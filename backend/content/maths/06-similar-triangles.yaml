# Class 9 Mathematics, chapter 6. Format: content/README.md.
# Also uses tips from chapter 3: added_not_ratio, swapped_parts.
subject: math
chapter: 6
title: Similar Triangles

tips:
  angles_scaled: "Angles don't change when a triangle is enlarged or shrunk. Only the lengths change."
  third_angle: "Find the missing angle first: the angles of a triangle add up to 180°."
  scale_inverted: "Check which way the scale goes: to get the bigger triangle's side, the answer should be bigger than the smaller triangle's side."
  unit_change: "Change units at the end: 100 cm = 1 m and 1000 m = 1 km, so 100000 cm = 1 km."
  matched_wrong_sides: "Match the letters in order. If ABC matches PQR, then B goes with Q and C with R, so BC matches QR."
  used_part_not_whole: "The small triangle's side AD matches the big triangle's whole side AB, not the leftover piece DB."
  perimeter_scale: "Find the scale factor from the perimeters (45 ÷ 30) and multiply the shortest side by it."
  scale_longest: "Match the longest side with the longest side: 15 ÷ 5."
  shadow_similar: "Similar triangles need equal angles, not equal sizes. The sun's rays meet both at the same angle."
  similar_angle: "The angles add to 180°: 180 − 45 − 60."
  similar_needs_angles: "Similar means all angles equal. Only equilateral triangles always have the same angles."

concepts:
  - code: math9.similar.equal_angles
    title: Triangles with the same angles
    notes: |
      If two triangles have the same three angles, their matching sides are all in the same ratio.
      Such triangles are called similar. The common ratio is the scale factor. Two equal angles are
      enough, because the third is then 180° minus the other two. Angles don't change with size.
    explanations:
      text: "Two triangles with the same angles have the same shape, even if one is bigger. Then every side of the big one is the same number of times the matching side of the small one. That number is the scale factor. If a 3-4-5 triangle has the same angles as a triangle whose longest side is 15, the scale factor is 15 ÷ 5 = 3, so the other sides are 9 and 12."
      visual: "Draw a triangle on a balloon and blow it up. It gets bigger, but its corners keep the same angles, and every side stretches by the same amount. The small and big triangles are similar."
      step_by_step: "Two triangles have the same angles. The small one has sides 3, 4 and 5 cm, and the big one's longest side is 15 cm. Step 1: Match the longest sides: 5 and 15. Step 2: Scale factor = 15 ÷ 5 = 3. Step 3: Multiply the other sides by 3: 9 cm and 12 cm."
      real_world: "A photo of a triangular roof, printed bigger, keeps the same angles. If the printed roof's base is 4 times the small print's, every other edge is 4 times as long too."
    activity:
      type: sort
      prompt: Are the two triangles similar (same three angles)?
      bins:
      - Similar
      - Not similar
      items:
      - label: 40°, 60°, 80° and 80°, 40°, 60°
        bin: Similar
        why: 'Both are 40°, 60°, 80°, just in a different order: similar.'
        clue: Write each triangle's angles from smallest to biggest. Are the lists the same?
      - label: 30°, 60°, 90° and 30°, 70°, 80°
        bin: Not similar
        clue: One angle matches. Do the other two?
        why: 'Only 30° matches; 60°, 90° and 70°, 80° are different: not similar.'
      - label: 50°, 50°, 80° and 50°, 80°, 50°
        bin: Similar
        clue: Sort each list from smallest. Same?
        why: 'Both are 50°, 50°, 80°: similar.'
      - label: Two angles 45° and 65°, and two angles 45° and 75°
        bin: Not similar
        clue: Work out each triangle's third angle (the three add to 180°).
        why: 'The third angles are 70° and 60°: 45°, 65°, 70° and 45°, 75°, 60° are different sets, so not similar.'
      - label: Two angles 35° and 75°, and two angles 75° and 70°
        bin: Similar
        why: 'The first is 35°, 75°, 70°; the second 75°, 70°, 35°. Same three angles: similar.'
        clue: Work out each triangle's third angle (the three add to 180°).
    lesson:
      - teach: A photo and its enlargement show the same shape at different sizes. For triangles, the same shape means the same three angles. Making a triangle bigger stretches its sides, but every angle stays exactly the same.
        check:
          prompt: A triangle has angles of 30°, 60° and 90°. You double every side. What are the new angles?
          options:
          - 30°, 60° and 90°
          - 60°, 120° and 180°
          - 15°, 30° and 45°
          answer: 30°, 60° and 90°
          why: Angles don't change with size. Doubling sides doubles lengths only.
        ways:
        - style: real_world
          teach: Zoom in on a photo on your phone. Everything gets bigger, but a person's face keeps the same shape, so the corners and angles don't change. A triangle zoomed to twice the size has every side doubled, and every angle exactly the same as before.
      - teach: If two triangles have the same three angles, their matching sides are all in the same ratio. Such triangles are called similar, and that ratio is the scale factor. A 3, 4, 5 triangle and a 6, 8, 10 triangle with the same angles have scale factor 2.
        picture:
          kind: compare
          columns:
          - title: Small triangle
            points:
            - sides 3, 4, 5 cm
            - angles 37°, 53°, 90°
          - title: Big triangle
            points:
            - sides 6, 8, 10 cm
            - same angles
          alt: 'Two similar triangles: the big one has every side twice as long and the same angles.'
        check:
          prompt: 'Similar triangles: the small one''s shortest side is 2 cm, the big one''s is 6 cm. What is the scale factor?'
          options:
          - '3'
          - '4'
          - '12'
          answer: '3'
          why: 6 ÷ 2 = 3, so every side of the big triangle is 3 times the matching side.
        ways:
        - style: step_by_step
          teach: 'Step 1: check that the two triangles have the same three angles. Step 2: pair up the sides opposite equal angles. Step 3: divide each big side by its partner. Step 4: all three answers are the same number, the scale factor. 6 ÷ 3, 8 ÷ 4 and 10 ÷ 5 all give 2.'
      - teach: Two equal angles are enough. The three angles of any triangle add to 180°, so if two angles match, the third is 180° minus those two in both triangles, and it matches too.
        check:
          prompt: One triangle has angles 50° and 60°. Another has 60° and 70°. What is the third angle of the first?
          options:
          - 70°
          - 50°
          - 60°
          answer: 70°
          why: '180° − 50° − 60° = 70°. So both triangles have 50°, 60° and 70°: they are similar.'
        ways:
        - style: step_by_step
          teach: 'Step 1: add the two known angles of the triangle. Step 2: take that from 180°, because the angles of a triangle always add to 180°. Step 3: if another triangle has the same two angles, its third angle comes out the same, so all three match.'
    items:
      - prompt: "Triangle ABC has angles of 40°, 60° and 80°. Triangle PQR has the same shape but sides twice as long. What are PQR's angles?"
        options: ["40°, 60° and 80°", "80°, 120° and 160°", "20°, 30° and 40°", "Can't tell"]
        answer: "40°, 60° and 80°"
        difficulty: 1
        hints: ["Enlarging changes lengths. Does it change angles?"]
        solution: "Step 1: Enlarging a triangle keeps its shape. Step 2: So the angles stay 40°, 60° and 80°."
        mistakes: {"80°, 120° and 160°": angles_scaled, "20°, 30° and 40°": angles_scaled}
      - prompt: "Two triangles have the same angles. The small one has sides 3, 4 and 5 cm. The big one's longest side is 15 cm. What is the scale factor?"
        answer: "3"
        check: "15/5"
        difficulty: 1
        hints: ["Match the longest sides: 5 and 15."]
        solution: "Step 1: The longest sides match: 5 cm and 15 cm. Step 2: 15 ÷ 5 = 3."
        mistakes: {"10": "scale_longest", "5": "scale_longest"}
      - prompt: "Two triangles have the same angles. The small one has sides 3, 4 and 5 cm. The big one's longest side is 15 cm. What is the big one's shortest side, in cm?"
        answer: "9"
        check: "3*15/5"
        difficulty: 1
        hints: ["The scale factor is 15 ÷ 5 = 3."]
        solution: "Step 1: Scale factor = 3. Step 2: 3 × 3 = 9 cm."
        mistakes: {"13": added_not_ratio}
      - prompt: "Two angles of one triangle are 50° and 70°. Two angles of another triangle are 70° and 60°. Are the triangles similar?"
        options: ["Yes: both have angles 50°, 60° and 70°", "No: the angles listed are different", "Only if the sides are equal", "Can't tell without the sides"]
        answer: "Yes: both have angles 50°, 60° and 70°"
        difficulty: 2
        hints: ["Find each triangle's third angle."]
        solution: "Step 1: First triangle: 180 − 50 − 70 = 60°. Step 2: Second triangle: 180 − 70 − 60 = 50°. Step 3: Both have 50°, 60° and 70°, so they are similar."
        mistakes: {"No: the angles listed are different": third_angle, "Can't tell without the sides": third_angle}
      - prompt: "Triangles ABC and PQR have the same angles, with AB matching PQ and BC matching QR. AB = 4 cm, PQ = 10 cm and BC = 6 cm. What is QR, in cm?"
        answer: "15"
        check: "6*10/4"
        difficulty: 2
        hints: ["Scale factor = 10 ÷ 4 = 2.5."]
        solution: "Step 1: Scale factor = 10 ÷ 4 = 2.5. Step 2: QR = 6 × 2.5 = 15 cm."
        mistakes: {"12": added_not_ratio}
      - prompt: "In triangle ABC, angle A = 45° and angle B = 75°. Triangle DEF is similar to it, with angle D = 45° and angle F = 60°. What is angle E, in degrees?"
        answer: "75"
        check: "180 - 45 - 60"
        difficulty: 3
        hints: ["Angles in a triangle add up to 180°."]
        solution: "Step 1: Angle E = 180 − 45 − 60. Step 2: = 75°, the same as angle B."
        mistakes: {"60": "similar_angle", "45": "similar_angle"}
      - prompt: "Which two triangles must be similar?"
        options: ["Any two equilateral triangles", "Any two right triangles", "Any two isosceles triangles", "Any two triangles with one equal angle"]
        answer: "Any two equilateral triangles"
        difficulty: 3
        hints: ["Which kind always has exactly the same angles?"]
        solution: "Step 1: Every equilateral triangle has angles of 60°, 60° and 60°. Step 2: Same angles, so they are always similar. Step 3: Right or isosceles triangles can have different other angles."

        mistakes: {"Any two right triangles": "similar_needs_angles", "Any two isosceles triangles": "similar_needs_angles", "Any two triangles with one equal angle": "similar_needs_angles"}
      - prompt: "Two triangles have the same angles. The small one has sides 4, 5 and 6 cm. The big one's shortest side is 10 cm. How long is the big one's longest side, in cm?"
        answer: "15"
        check: "6*10/4"
        difficulty: 2
        hints: ["The scale factor is 10 ÷ 4.", "Multiply the longest side, 6 cm, by 2.5."]
        solution: "Step 1: Scale factor = 10 ÷ 4 = 2.5. Step 2: Longest side = 6 × 2.5 = 15 cm."
        mistakes: {"12": added_not_ratio, "2.4": scale_inverted}
      - prompt: "In triangle ABC, angle A = 50° and angle B = 60°. In triangle PQR, angle P = 50° and angle R = 70°. Which is true?"
        options: ["They are similar, with B matching Q", "They are not similar", "They are similar, with B matching R", "We can't tell without the sides"]
        answer: "They are similar, with B matching Q"
        difficulty: 3
        hints: ["Find the third angle of each triangle.", "Angle C = 70° and angle Q = 60°."]
        solution: "Step 1: Angle C = 180 − 50 − 60 = 70°. Step 2: Angle Q = 180 − 50 − 70 = 60°. Step 3: Both have 50°, 60°, 70°, so they are similar, with B (60°) matching Q (60°)."
        mistakes: {"They are not similar": third_angle, "They are similar, with B matching R": matched_wrong_sides}
      - prompt: "Two similar triangles have scale factor 3. The small triangle's angles are 35°, 65° and 80°. What is the biggest angle of the large triangle, in degrees?"
        answer: "80"
        check: "80"
        difficulty: 3
        hints: ["Enlarging a triangle changes its sides, not its angles.", "Which angle is biggest in the small triangle?"]
        solution: "Step 1: Similar triangles have equal angles. Step 2: The biggest angle stays 80°."
        mistakes: {"240": angles_scaled}
      - prompt: Two triangles have the same angles. The small one has sides 2, 3 and 4 cm. The big one's shortest side is 6 cm. What is the scale factor?
        answer: '3'
        check: 6/2
        difficulty: 1
        hints:
        - Compare the two shortest sides.
        - 6 is how many times 2?
        solution: 'Step 1: The shortest sides are 2 cm and 6 cm. Step 2: 6 ÷ 2 = 3. Step 3: The scale factor is 3.'
        mistakes:
          '4': scale_inverted
      - prompt: Two triangles have the same angles. The small one has sides 2, 3 and 4 cm and the big one's shortest side is 6 cm. How long is the big one's longest side, in cm?
        answer: '12'
        check: 4*6/2
        difficulty: 1
        hints:
        - Find the scale factor first.
        - Every side is 3 times as long.
        solution: 'Step 1: Scale factor = 6 ÷ 2 = 3. Step 2: The small longest side is 4 cm. Step 3: 4 × 3 = 12 cm.'
        mistakes:
          '8': scale_inverted
      - prompt: Triangle ABC has angles of 35° and 85°. Triangle PQR has angles of 85° and 60°. Are they similar?
        options:
        - 'Yes: both have angles 35°, 60° and 85°'
        - 'No: they have different angles'
        - Only if their sides are equal
        answer: 'Yes: both have angles 35°, 60° and 85°'
        difficulty: 2
        hints:
        - Find the third angle of each triangle.
        - The angles of a triangle add up to 180°.
        solution: 'Step 1: ABC''s third angle is 180° − 35° − 85° = 60°. Step 2: PQR''s third angle is 180° − 85° − 60° = 35°. Step 3: Both have 35°, 60°, 85°, so they are similar.'
        mistakes:
          'No: they have different angles': third_angle
          Only if their sides are equal: similar_angle
      - prompt: Which pair of triangles is sure to be similar?
        options:
        - Two right triangles that each have a 40° angle
        - Any two right triangles
        - Any two triangles with a 40° angle
        - Any two isosceles triangles
        answer: Two right triangles that each have a 40° angle
        difficulty: 2
        hints:
        - Similar needs two equal angles.
        - Which pair is sure to share two angles?
        solution: 'Step 1: Two right triangles each with 40° share 90° and 40°. Step 2: So their third angles are both 50°. Step 3: The others share at most one angle, so they need not be similar.'
        mistakes:
          Any two right triangles: similar_needs_angles
          Any two triangles with a 40° angle: similar_needs_angles
      - prompt: Similar triangles have scale factor 2.5. A side of the small one is 4 cm. How long is the matching side of the big one, in cm?
        answer: '10'
        check: 4*2.5
        difficulty: 3
        hints:
        - Multiply the small side by the scale factor.
        - 4 × 2.5.
        solution: 'Step 1: Matching sides are in the ratio 1 : 2.5. Step 2: 4 × 2.5 = 10. Step 3: So the big side is 10 cm.'
        mistakes:
          '1.6': scale_inverted
      - prompt: Two similar triangles have angles of 25° and 90°. What is the third angle of the bigger one, in degrees?
        answer: '65'
        check: 180 - 25 - 90
        difficulty: 3
        hints:
        - Size doesn't change angles.
        - The three angles add up to 180°.
        solution: 'Step 1: Both triangles have the same angles. Step 2: 180 − 25 − 90 = 65. Step 3: So the third angle is 65°.'
        mistakes:
          '130': angles_scaled
  - code: math9.similar.sides_ratio
    title: Sides in the same ratio
    after: [math9.similar.equal_angles]
    notes: |
      If the three sides of one triangle are the same multiple of the three sides of another, the
      triangles have the same angles and are similar. Check by dividing matching sides (smallest
      with smallest, and so on): the answers must all be equal. Perimeters scale by the same factor.
    explanations:
      text: "It also works the other way round: if every side of one triangle is the same number of times the matching side of another, the angles are equal and the triangles are similar. Sides 2, 3, 4 and 4, 6, 8 are similar, because every side is doubled. Sides 3, 4, 5 and 4, 5, 6 are not: adding 1 to each side changes the shape."
      visual: "Build a 3-4-5 triangle from straws, then a 6-8-10 one with every straw doubled. Lay the small one in the corner of the big one: the corners fit exactly."
      step_by_step: "Are 4, 6, 9 and 6, 9, 13.5 similar? Step 1: Pair them smallest to largest. Step 2: 6 ÷ 4 = 1.5. Step 3: 9 ÷ 6 = 1.5. Step 4: 13.5 ÷ 9 = 1.5. Step 5: All the same, so yes."
      real_world: "A model of a triangular truss bridge uses sides of 5, 7 and 9 cm. If the real bridge's shortest side is 15 m, its longest is 27 m, because everything is 3 times as long (in metres instead of centimetres)."
    picture:
      kind: geometry
      points:
        A: [0.5, 1]
        B: [2.75, 1]
        C: [0.5, 4]
        P: [4, 1]
        Q: [8.5, 1]
        R: [4, 7]
      segments:
      - [A, B, '3']
      - [A, C, '4']
      - [B, C, '5']
      - [P, Q, '6']
      - [P, R, '8']
      - [Q, R, '10']
      caption: 'Every side doubles: 6/3 = 8/4 = 10/5 = 2, so the triangles are similar and their angles match.'
      alt: A 3-4-5 right triangle beside a 6-8-10 right triangle. Every side is doubled, so the two triangles are similar.
    activity:
      type: formula
      prompt: A 3, 4, 5 triangle is enlarged by a scale factor k.
      inputs:
      - name: k
        label: Scale factor k
        min: 0.5
        max: 4
        step: 0.5
        start: 1
      outputs:
      - name: a
        label: Side 1
        expr: 3*k
      - name: b
        label: Side 2
        expr: 4*k
      - name: c
        label: Side 3
        expr: 5*k
      goals:
      - prompt: Make the shortest side 7.5.
        want:
          a: 7.5
      - prompt: Make the longest side 15.
        want:
          c: 15
    lesson:
      - teach: 'There is a second way to spot similar triangles: compare the sides. If every side of one triangle is the same multiple of the matching side of the other, the triangles have the same angles and are similar.'
        check:
          prompt: Triangle sides 2, 3, 4 cm and 6, 9, 12 cm. What is each side multiplied by?
          options:
          - '3'
          - '4'
          - Different numbers
          answer: '3'
          why: 2 × 3 = 6, 3 × 3 = 9, 4 × 3 = 12. The same multiple every time, so they are similar.
        ways:
        - style: real_world
          teach: 'A photocopier set to 300% makes every length 3 times as long. Copy a triangle with sides 2, 3 and 4 cm, and you get 6, 9 and 12 cm. Because every side is the same multiple, the copy has exactly the same angles: the triangles are similar.'
      - teach: 'Match smallest with smallest, middle with middle, largest with largest, then divide. All three answers must be equal. 4, 6, 9 and 6, 9, 13.5 give 6 ÷ 4 = 1.5, 9 ÷ 6 = 1.5, 13.5 ÷ 9 = 1.5: similar. If one ratio differs, they are not similar.'
        check:
          prompt: Are triangles with sides 3, 4, 5 cm and 6, 8, 11 cm similar?
          options:
          - 'No: 11 ÷ 5 is not 2'
          - 'Yes: every side got bigger'
          answer: 'No: 11 ÷ 5 is not 2'
          why: 6 ÷ 3 = 2 and 8 ÷ 4 = 2, but 11 ÷ 5 = 2.2. The ratios must all match.
        ways:
        - style: step_by_step
          teach: 'Step 1: sort each triangle''s sides from shortest to longest. Step 2: divide the shortest by the shortest, the middle by the middle, the longest by the longest. Step 3: if all three answers match, the triangles are similar. If even one differs, they are not.'
      - teach: The perimeter grows by the same factor. A 3, 4, 5 triangle has perimeter 12. A similar triangle with perimeter 36 has scale factor 36 ÷ 12 = 3, so its sides are 9, 12 and 15.
        check:
          prompt: A triangle with perimeter 10 cm is enlarged to perimeter 30 cm. What is the scale factor?
          options:
          - '3'
          - '20'
          - 1/3
          answer: '3'
          why: 30 ÷ 10 = 3. Every side, and so the whole perimeter, is 3 times as long.
        ways:
        - style: step_by_step
          teach: 'Step 1: add the sides of the first triangle to get its perimeter. Step 2: divide the second perimeter by the first: that is the scale factor. Step 3: multiply each side of the first triangle by it to get the sides of the second.'
    items:
      - prompt: "Are triangles with sides 2, 3, 4 cm and 4, 6, 8 cm similar?"
        options: ["Yes: every side is doubled", "No: the sides are different", "Only if they have a right angle", "No: 4 − 2 is not 6 − 3"]
        answer: "Yes: every side is doubled"
        difficulty: 1
        hints: ["Divide matching sides: 4 ÷ 2, 6 ÷ 3, 8 ÷ 4."]
        solution: "Step 1: 4 ÷ 2 = 2, 6 ÷ 3 = 2 and 8 ÷ 4 = 2. Step 2: All the same, so they are similar."
        mistakes: {"No: 4 − 2 is not 6 − 3": added_not_ratio}
      - prompt: "Which triangle is similar to one with sides 3, 4 and 5 cm?"
        options: ["6, 8 and 10 cm", "4, 5 and 6 cm", "3, 4 and 6 cm", "5, 12 and 13 cm"]
        answer: "6, 8 and 10 cm"
        difficulty: 1
        hints: ["Look for every side multiplied by the same number."]
        solution: "Step 1: 6, 8, 10 is 3, 4, 5 times 2. Step 2: The others are not the same multiple."
        mistakes: {"4, 5 and 6 cm": added_not_ratio}
      - prompt: "A triangle has sides of 5, 7 and 9 cm. A similar triangle's shortest side is 15 cm. What is its longest side, in cm?"
        answer: "27"
        check: "9*15/5"
        difficulty: 2
        hints: ["Scale factor = 15 ÷ 5."]
        solution: "Step 1: Scale factor = 3. Step 2: 9 × 3 = 27 cm."
        mistakes: {"19": added_not_ratio}
      - prompt: "Are triangles with sides 4, 6, 9 cm and 6, 9, 13.5 cm similar?"
        options: ["Yes: every side is multiplied by 1.5", "No: 13.5 is not a whole number", "No: the sides go up by different amounts", "Can't tell without the angles"]
        answer: "Yes: every side is multiplied by 1.5"
        difficulty: 2
        hints: ["Divide matching sides."]
        solution: "Step 1: 6 ÷ 4 = 1.5, 9 ÷ 6 = 1.5 and 13.5 ÷ 9 = 1.5. Step 2: All the same, so they are similar."
        mistakes: {"No: the sides go up by different amounts": added_not_ratio}
      - prompt: "A triangle has sides of 8, 10 and 12 cm. A similar triangle has a perimeter of 45 cm. What is its shortest side, in cm?"
        answer: "12"
        check: "8*45/30"
        difficulty: 2
        hints: ["The first perimeter is 30 cm.", "Scale factor = 45 ÷ 30 = 1.5."]
        solution: "Step 1: First perimeter = 30 cm. Step 2: Scale factor = 1.5. Step 3: 8 × 1.5 = 12 cm."
        mistakes: {"8": "perimeter_scale", "15": "perimeter_scale"}
      - prompt: "A photo 10 cm wide is enlarged to 25 cm wide. A triangle in the photo has a side of 6 cm. How long is that side in the enlargement, in cm?"
        answer: "15"
        check: "6*25/10"
        difficulty: 3
        hints: ["Scale factor = 25 ÷ 10 = 2.5."]
        solution: "Step 1: Scale factor = 2.5. Step 2: 6 × 2.5 = 15 cm."
        mistakes: {"21": added_not_ratio}
      - prompt: "Which triangle is similar to one with sides 6, 8 and 9 cm?"
        options: ["9, 12 and 13.5 cm", "8, 10 and 11 cm", "12, 16 and 20 cm", "3, 4 and 5 cm"]
        answer: "9, 12 and 13.5 cm"
        difficulty: 2
        hints: ["Divide each side of the option by the matching side of 6, 8, 9.", "All three divisions must give the same number."]
        solution: "Step 1: 9 ÷ 6 = 1.5, 12 ÷ 8 = 1.5, 13.5 ÷ 9 = 1.5. Step 2: Same ratio, so similar."
        mistakes: {"8, 10 and 11 cm": added_not_ratio, "12, 16 and 20 cm": perimeter_scale}
      - prompt: "A triangle has sides of 3, 5 and 7 cm. A similar triangle has a perimeter of 60 cm. How long is its longest side, in cm?"
        answer: "28"
        check: "7*60/15"
        difficulty: 3
        hints: ["The first perimeter is 3 + 5 + 7 = 15 cm.", "The scale factor is 60 ÷ 15."]
        solution: "Step 1: Perimeter 15 cm, so the scale factor is 4. Step 2: Longest side = 7 × 4 = 28 cm."
        mistakes: {"20": perimeter_scale, "52": added_not_ratio}
      - prompt: "Triangle A has sides 5, 12 and 13 cm. Triangle B has sides 7.5, 18 and x cm, and is similar to A. What is x? Decimals are fine."
        answer: "19.5"
        check: "13*1.5"
        difficulty: 3
        hints: ["7.5 ÷ 5 = 1.5 and 18 ÷ 12 = 1.5.", "x = 13 × 1.5."]
        solution: "Step 1: Scale factor 1.5. Step 2: x = 13 × 1.5 = 19.5 cm."
        mistakes: {"15.5": added_not_ratio, "8.67": scale_inverted}
      - prompt: Are triangles with sides 5, 6, 7 cm and 10, 12, 14 cm similar?
        options:
        - 'Yes: every side is doubled'
        - 'No: the sides are different'
        - 'No: their perimeters are different'
        answer: 'Yes: every side is doubled'
        difficulty: 1
        hints:
        - Divide matching sides.
        - 10 ÷ 5, 12 ÷ 6 and 14 ÷ 7.
        solution: 'Step 1: 10 ÷ 5 = 2. Step 2: 12 ÷ 6 = 2 and 14 ÷ 7 = 2. Step 3: All equal, so the triangles are similar.'
        mistakes:
          'No: their perimeters are different': perimeter_scale
      - prompt: Which triangle is similar to one with sides 4, 5 and 6 cm?
        options:
        - 8, 10 and 12 cm
        - 5, 6 and 7 cm
        - 4, 10 and 12 cm
        - 8, 10 and 11 cm
        answer: 8, 10 and 12 cm
        difficulty: 1
        hints:
        - Look for every side multiplied by the same number.
        - Adding 1 to each side is not the same as multiplying.
        solution: 'Step 1: 8 ÷ 4 = 2. Step 2: 10 ÷ 5 = 2 and 12 ÷ 6 = 2. Step 3: So 8, 10, 12 is similar.'
        mistakes:
          5, 6 and 7 cm: similar_needs_angles
      - prompt: A triangle has sides of 4, 6 and 7 cm. A similar triangle's middle side is 9 cm. What is its longest side, in cm? Decimals are fine.
        answer: '10.5'
        check: 7*9/6
        difficulty: 2
        hints:
        - 'Match middle with middle: 6 ↔ 9.'
        - The scale factor is 9 ÷ 6 = 1.5.
        solution: 'Step 1: Scale factor = 9 ÷ 6 = 1.5. Step 2: The longest side is 7 × 1.5. Step 3: = 10.5 cm.'
        mistakes:
          '10': matched_wrong_sides
      - prompt: A triangle has sides of 2, 3 and 4 cm. A similar triangle has a perimeter of 36 cm. What is its longest side, in cm?
        answer: '16'
        check: 4*36/9
        difficulty: 2
        hints:
        - The first perimeter is 2 + 3 + 4 = 9 cm.
        - The scale factor is 36 ÷ 9 = 4.
        solution: 'Step 1: Perimeter 9 cm. Step 2: Scale factor 36 ÷ 9 = 4. Step 3: Longest side 4 × 4 = 16 cm.'
        mistakes:
          '12': scale_longest
      - prompt: A drawing of a triangle with sides 3, 6 and 8 cm is shrunk so that its longest side is 2 cm. How long is its shortest side, in cm? Decimals are fine.
        answer: '0.75'
        check: 3*2/8
        difficulty: 3
        hints:
        - The scale factor takes 8 to 2.
        - It is 2 ÷ 8 = 0.25.
        solution: 'Step 1: Scale factor = 2 ÷ 8 = 0.25. Step 2: Shortest side = 3 × 0.25. Step 3: = 0.75 cm.'
        mistakes:
          '12': scale_inverted
      - prompt: Triangle A has sides 6, 8 and 10 cm. Triangle B has sides 9, x and 15 cm and is similar to A. What is x?
        answer: '12'
        check: 8*9/6
        difficulty: 3
        hints:
        - Find the scale factor from a pair you know.
        - 9 ÷ 6 = 1.5, and 15 ÷ 10 = 1.5 too.
        solution: 'Step 1: Scale factor = 1.5. Step 2: x = 8 × 1.5. Step 3: x = 12.'
        mistakes:
          '11': matched_wrong_sides

  - code: math9.similar.matching
    title: Matching sides and finding lengths
    after: [math9.similar.sides_ratio]
    notes: |
      In similar triangles, matching sides are opposite equal angles. Writing triangle ABC ~ triangle
      PQR lists matching corners in order, so AB ↔ PQ, BC ↔ QR and CA ↔ RP. A line parallel to one side
      cuts off a small triangle similar to the whole one; compare with whole sides, not leftover parts.
    explanations:
      text: "To use similar triangles, first match the sides. If triangle ABC matches triangle PQR corner by corner, then AB goes with PQ, BC with QR and AC with PR. Then the ratios are equal: AB/PQ = BC/QR = AC/PR. Knowing three of these lengths gives the fourth."
      visual: "Colour the matching corners: A and P red, B and Q blue, C and R green. A side joins two colours, so the blue-green side BC matches the blue-green side QR."
      step_by_step: "Triangle ABC matches PQR, with AB = 6, BC = 8 and PQ = 9. Step 1: AB matches PQ, so the scale factor is 9 ÷ 6 = 1.5. Step 2: BC matches QR. Step 3: QR = 8 × 1.5 = 12."
      real_world: "In triangle ABC, a shelf DE runs parallel to the floor BC. The small triangle ADE at the top has the same shape as the whole triangle ABC. If AD is a third of AB, the shelf DE is a third of BC."
    activity:
      type: formula
      prompt: Small triangle sides 4 cm and 6 cm. In the big similar triangle, the side matching 4 cm is 10 cm.
      inputs:
      - name: k
        label: Scale factor
        min: 1
        max: 4
        step: 0.25
        start: 1
      outputs:
      - name: a
        label: Side matching 4 cm
        expr: 4*k
        unit: cm
      - name: b
        label: Side matching 6 cm
        expr: 6*k
        unit: cm
      goals:
      - prompt: Find the scale factor, then read the side matching 6 cm.
        want:
          a: 10
    lesson:
      - teach: In similar triangles, a side matches the side opposite the equal angle. Writing triangle ABC ~ triangle PQR means A matches P, B matches Q and C matches R, in that order. So AB ↔ PQ, BC ↔ QR and CA ↔ RP.
        check:
          prompt: Triangle ABC ~ triangle XYZ. Which side matches AC?
          options:
          - XZ
          - XY
          - YZ
          answer: XZ
          why: A ↔ X and C ↔ Z, so AC ↔ XZ.
        ways:
        - style: step_by_step
          teach: 'Step 1: read the names in order: ABC ~ PQR. Step 2: the first letters match, A and P; the second, B and Q; the third, C and R. Step 3: a side uses two letters, so swap each letter for its partner: AB becomes PQ, BC becomes QR, CA becomes RP.'
      - teach: 'To find a length, find the scale factor from a matching pair you know, then multiply. ABC ~ PQR, AB = 6, PQ = 9: the factor is 9 ÷ 6 = 1.5. If BC = 8, then QR = 8 × 1.5 = 12.'
        check:
          prompt: ABC ~ PQR with AB = 4, PQ = 12 and BC = 5. What is QR?
          options:
          - '15'
          - '13'
          - '60'
          answer: '15'
          why: The factor is 12 ÷ 4 = 3, so QR = 5 × 3 = 15.
        ways:
        - style: real_world
          teach: 'A map and the real town: if 6 cm on the map is 9 km on the ground, then every 1 cm stands for 1.5 km. So 8 cm on the map is 12 km. With similar triangles, one known pair of sides gives the scale, and the scale gives every other side.'
      - teach: A line parallel to one side of a triangle cuts off a small triangle similar to the whole. In triangle ABC with DE parallel to BC, triangle ADE ~ triangle ABC. Compare AD with the whole AB, not with the leftover DB.
        check:
          prompt: DE is parallel to BC, AD = 2, DB = 4 and BC = 9. Which ratio gives DE?
          options:
          - DE/BC = AD/AB = 2/6
          - DE/BC = AD/DB = 2/4
          - DE = BC − 2
          answer: DE/BC = AD/AB = 2/6
          why: ADE and ABC are similar, so DE ↔ BC and AD ↔ AB = 6. DE = 9 × 2/6 = 3.
        ways:
        - style: step_by_step
          teach: 'Step 1: with DE parallel to BC, the small triangle ADE has the same angles as ABC. Step 2: match AD with the whole side AB, not with DB. Step 3: if AD = 2 and DB = 4, then AB = 6. Step 4: DE/BC = AD/AB.'
    items:
      - prompt: "Triangle ABC is similar to triangle PQR, with A matching P, B matching Q and C matching R. Which side matches BC?"
        options: ["QR", "PQ", "PR", "AC"]
        answer: "QR"
        difficulty: 1
        hints: ["B goes with Q and C goes with R."]
        solution: "Step 1: B ↔ Q and C ↔ R. Step 2: So BC ↔ QR."
        mistakes: {"PQ": matched_wrong_sides, "PR": matched_wrong_sides}
      - prompt: "In triangle ABC, angle A = 30°. Triangle PQR is similar to it, and angle P matches angle A. What is angle P?"
        options: ["30°", "60°", "15°", "Can't tell"]
        answer: "30°"
        difficulty: 1
        hints: ["Matching angles in similar triangles are equal."]
        solution: "Step 1: Similar triangles have equal matching angles. Step 2: Angle P = 30°."
        mistakes: {"60°": angles_scaled, "15°": angles_scaled}
      - prompt: "Triangle ABC is similar to triangle PQR, with A, B, C matching P, Q, R. AB = 6 cm, BC = 8 cm and PQ = 9 cm. What is QR, in cm?"
        answer: "12"
        check: "8*9/6"
        difficulty: 2
        hints: ["Scale factor = PQ ÷ AB = 9 ÷ 6."]
        solution: "Step 1: Scale factor = 1.5. Step 2: QR = 8 × 1.5 = 12 cm."
        mistakes: {"11": added_not_ratio}
      - prompt: "Triangle ABC is similar to triangle DEF, with A, B, C matching D, E, F. AC = 10 cm, DF = 4 cm and EF = 6 cm. What is BC, in cm?"
        answer: "15"
        check: "6*10/4"
        difficulty: 2
        hints: ["AC matches DF, so ABC is 10 ÷ 4 = 2.5 times bigger.", "BC matches EF."]
        solution: "Step 1: Scale factor from DEF to ABC = 10 ÷ 4 = 2.5. Step 2: BC = 6 × 2.5 = 15 cm."
        mistakes: {"2.4": scale_inverted, "12": added_not_ratio}
      - prompt: "In triangle ABC, a line DE is parallel to BC, with D on AB and E on AC. AD = 3 cm, AB = 9 cm and BC = 12 cm. What is DE, in cm?"
        answer: "4"
        check: "12*3/9"
        difficulty: 3
        hints: ["Triangle ADE is similar to triangle ABC.", "AD matches AB, so the scale factor is 3 ÷ 9."]
        solution: "Step 1: ADE is similar to ABC. Step 2: Scale factor = 3/9 = 1/3. Step 3: DE = 12 ÷ 3 = 4 cm."
        mistakes: {"6": used_part_not_whole, "8": swapped_parts}
      - prompt: "Triangles ABC and PQR are similar, and PQR is 3 times as big. ABC's perimeter is 14 cm. What is PQR's perimeter, in cm?"
        answer: "42"
        check: "14*3"
        difficulty: 3
        hints: ["Every side is 3 times as long, so the total is too."]
        solution: "Step 1: Each side of PQR is 3 times the matching side of ABC. Step 2: Perimeter = 3 × 14 = 42 cm."
        mistakes: {"17": added_not_ratio}
      - prompt: "Triangle ABC is similar to triangle XYZ, with A, B, C matching X, Y, Z. BC = 9 cm, YZ = 6 cm and XY = 8 cm. How long is AB, in cm?"
        answer: "12"
        check: "8*9/6"
        difficulty: 2
        hints: ["BC matches YZ, so the scale from XYZ to ABC is 9 ÷ 6.", "AB = XY × 1.5."]
        solution: "Step 1: Scale factor = 9 ÷ 6 = 1.5. Step 2: AB = 8 × 1.5 = 12 cm."
        mistakes: {"11": added_not_ratio, "5.33": scale_inverted}
      - prompt: "In triangle ABC, DE is parallel to BC with D on AB and E on AC. AD = 4 cm, DB = 6 cm and DE = 5 cm. How long is BC, in cm?"
        answer: "12.5"
        check: "5*10/4"
        difficulty: 3
        hints: ["Triangles ADE and ABC are similar. Compare AD with the whole of AB.", "AB = 4 + 6 = 10 cm, so the scale factor is 10 ÷ 4."]
        solution: "Step 1: AB = 10 cm. Step 2: Scale factor = 10 ÷ 4 = 2.5. Step 3: BC = 5 × 2.5 = 12.5 cm."
        mistakes: {"7.5": used_part_not_whole, "11": added_not_ratio}
      - prompt: "Triangle PQR ~ triangle LMN (P, Q, R matching L, M, N). Angle Q = 65° and angle N = 45°. What is angle P, in degrees?"
        answer: "70"
        check: "180 - 65 - 45"
        difficulty: 3
        hints: ["Angle M matches Q, and angle R matches N.", "So triangle PQR has angles Q = 65° and R = 45°."]
        solution: "Step 1: Angle R = angle N = 45°. Step 2: Angle P = 180 − 65 − 45 = 70°."
        mistakes: {"65": matched_wrong_sides, "45": matched_wrong_sides}
      - prompt: Triangle KLM ~ triangle RST, with K, L, M matching R, S, T. Which side matches LM?
        options:
        - ST
        - RS
        - RT
        - TS is not a side
        answer: ST
        difficulty: 1
        hints:
        - Match the letters in order.
        - L ↔ S and M ↔ T.
        solution: 'Step 1: K ↔ R, L ↔ S, M ↔ T. Step 2: LM uses L and M. Step 3: So it matches ST.'
        mistakes:
          RS: matched_wrong_sides
          RT: matched_wrong_sides
      - prompt: Triangle ABC ~ triangle PQR, with A, B, C matching P, Q, R. AB = 5 cm, PQ = 10 cm and CA = 7 cm. What is RP, in cm?
        answer: '14'
        check: 7*10/5
        difficulty: 1
        hints:
        - Find the scale factor from AB and PQ.
        - CA matches RP.
        solution: 'Step 1: Scale factor = 10 ÷ 5 = 2. Step 2: CA ↔ RP. Step 3: RP = 7 × 2 = 14 cm.'
        mistakes:
          '3.5': scale_inverted
      - prompt: Triangle ABC ~ triangle DEF, with A, B, C matching D, E, F. AB = 9 cm, DE = 6 cm and EF = 8 cm. What is BC, in cm?
        answer: '12'
        check: 8*9/6
        difficulty: 2
        hints:
        - ABC is the bigger triangle here.
        - The factor from DEF to ABC is 9 ÷ 6 = 1.5.
        solution: 'Step 1: BC ↔ EF. Step 2: Factor = 9 ÷ 6 = 1.5. Step 3: BC = 8 × 1.5 = 12 cm.'
        mistakes:
          '5.333': scale_inverted
      - prompt: In triangle ABC, DE is parallel to BC, with D on AB and E on AC. AD = 5 cm, AB = 15 cm and DE = 4 cm. How long is BC, in cm?
        answer: '12'
        check: 4*15/5
        difficulty: 2
        hints:
        - Triangle ADE ~ triangle ABC.
        - AB is 3 times AD.
        solution: 'Step 1: ADE ~ ABC. Step 2: AB ÷ AD = 15 ÷ 5 = 3. Step 3: BC = 3 × 4 = 12 cm.'
        mistakes:
          '8': used_part_not_whole
      - prompt: In triangle ABC, DE is parallel to BC, with D on AB and E on AC. AD = 2 cm, DB = 3 cm and BC = 10 cm. How long is DE, in cm?
        answer: '4'
        check: 10*2/5
        difficulty: 3
        hints:
        - Use the whole side AB = AD + DB.
        - DE/BC = AD/AB = 2/5.
        solution: 'Step 1: AB = 2 + 3 = 5 cm. Step 2: DE/BC = 2/5. Step 3: DE = 10 × 2/5 = 4 cm.'
        mistakes:
          '6.667': used_part_not_whole
      - prompt: Triangle ABC ~ triangle PQR, with A, B, C matching P, Q, R. Angle A = 40° and angle R = 85°. What is angle B, in degrees?
        answer: '55'
        check: 180 - 40 - 85
        difficulty: 3
        hints:
        - Angle R matches angle C.
        - The angles of ABC are 40°, B and 85°.
        solution: 'Step 1: C ↔ R, so angle C = 85°. Step 2: Angle B = 180° − 40° − 85°. Step 3: = 55°.'
        mistakes:
          '85': similar_angle

  - code: math9.similar.heights
    title: Heights, shadows and maps
    after: [math9.similar.equal_angles]
    notes: |
      At the same time of day, sun rays meet the ground at the same angle, so an upright object and
      its shadow form triangles similar to those of any other upright object: height ÷ shadow is
      the same. Maps and scale drawings are similar figures too.
    explanations:
      text: "At any moment, the sun's rays hit the ground at the same angle everywhere nearby. A stick and its shadow make a right triangle, and so do a tree and its shadow. Same angles, so the triangles are similar: height ÷ shadow is the same for both. A 1 m stick with a 2 m shadow means a tree with a 16 m shadow is 8 m tall."
      visual: "Draw a short stick and a tall tree standing on the ground, each with a sloping line from its top to the end of its shadow. The sloping lines are parallel, because they are both sun rays. The two triangles have the same angles, one just bigger."
      step_by_step: "A 2 m pole casts a 3 m shadow, and a building's shadow is 30 m. Step 1: The building's shadow is 30 ÷ 3 = 10 times as long. Step 2: So the building is 10 times as tall. Step 3: 2 × 10 = 20 m."
      real_world: "Teachers sometimes measure the school flagpole this way: a student holds a 1 m ruler upright, measures its shadow and the flagpole's shadow, and works out the height without climbing anything."
    picture:
      kind: flow
      steps: [Stick 1 m tall casts a 2 m shadow, Tree casts a 12 m shadow at the same time, 'Sun''s rays hit both at the same angle, so the triangles are similar', Tree height = 12 × (1 ÷ 2) = 6 m]
      alt: 'A stick and a tree with shadows at the same time make similar triangles: a 1 m stick has a 2 m shadow, so a tree with a 12 m shadow is 6 m tall.'
    activity:
      type: formula
      prompt: A 1 m stick casts a 1.5 m shadow. At the same time, how tall is a tree with a 12 m shadow?
      inputs:
      - name: h
        label: Tree height
        min: 1
        max: 20
        step: 0.5
        start: 1
        unit: m
      outputs:
      - name: s
        label: Tree's shadow
        expr: 1.5*h
        unit: m
      goals:
      - prompt: Make the tree's shadow 12 m.
        want:
          s: 12
        hint: Every 1 m of height makes 1.5 m of shadow. How many 1.5s make 12?
        mistakes:
        - when:
            h: 18
          say: An 18 m tree would cast a 27 m shadow. Here shadows are longer than the things casting them, so the tree must be shorter than its 12 m shadow.
    lesson:
      - teach: At one moment of the day, the sun's rays hit the ground at the same angle everywhere nearby. A stick and its shadow, and a tree and its shadow, both make right triangles with that same angle. So the two triangles are similar.
        check:
          prompt: Why are the stick's triangle and the tree's triangle similar?
          options:
          - Both have a right angle and the same sun angle
          - The tree is taller
          - Their shadows are the same length
          answer: Both have a right angle and the same sun angle
          why: Two equal angles make triangles similar.
        ways:
        - style: step_by_step
          teach: 'Step 1: a stick stands straight, so it makes a right angle with the ground. Step 2: the tree does too. Step 3: at the same moment the sun''s rays come in at the same slant for both. Step 4: two equal angles, so the two triangles are similar.'
      - teach: So height ÷ shadow is the same for both. A 1 m stick with a 2 m shadow gives 1 ÷ 2 = 0.5. A tree with a 16 m shadow is 16 × 0.5 = 8 m tall. Measuring a short stick lets you find a tall height without climbing.
        picture:
          kind: compare
          columns:
          - title: Stick
            points:
            - height 1 m
            - shadow 2 m
          - title: Tree
            points:
            - height ? m
            - shadow 16 m
          alt: A stick 1 m tall casts a 2 m shadow; a tree casting a 16 m shadow is 8 m tall.
        check:
          prompt: A 2 m pole has a 4 m shadow. A building's shadow is 20 m. How tall is the building?
          options:
          - 10 m
          - 40 m
          - 18 m
          answer: 10 m
          why: Height is half the shadow (2 ÷ 4), so the building is 20 ÷ 2 = 10 m.
        ways:
        - style: real_world
          teach: 'Stand in the sun next to a friend. If your shadow is twice your height, so is your friend''s, and so is the coconut tree''s. Height ÷ shadow is the same for everything at that moment. Measure that number with a short stick, then multiply the tree''s shadow by it to get the tree''s height.'
      - teach: 'Maps and scale drawings are similar figures too. A scale of 1 : 50000 means 1 cm on the map is 50000 cm, which is 500 m, on the ground. Change units carefully: 100 cm = 1 m and 1000 m = 1 km.'
        check:
          prompt: 'On a 1 : 100000 map, 1 cm stands for how much?'
          options:
          - 1 km
          - 100 m
          - 10 km
          answer: 1 km
          why: 100000 cm = 1000 m = 1 km.
        ways:
        - style: step_by_step
          teach: 'Step 1: read the scale, 1 : 50000. Step 2: 1 cm on the map is 50000 cm on the ground. Step 3: divide by 100 to get metres: 500 m. Step 4: divide by 1000 to get kilometres: 0.5 km.'
    items:
      - prompt: "A 1 m stick casts a 2 m shadow. At the same time, a tree casts a 16 m shadow. How tall is the tree, in metres?"
        answer: "8"
        check: "1*16/2"
        difficulty: 1
        hints: ["The shadow is twice the height.", "So the height is half the shadow."]
        solution: "Step 1: Height ÷ shadow = 1 ÷ 2 for both. Step 2: Tree = 16 ÷ 2 = 8 m."
        mistakes: {"32": scale_inverted}
      - prompt: "A 2 m pole casts a 3 m shadow. At the same time, a building's shadow is 30 m long. How tall is the building, in metres?"
        answer: "20"
        check: "2*30/3"
        difficulty: 1
        hints: ["The building's shadow is 10 times the pole's."]
        solution: "Step 1: 30 ÷ 3 = 10. Step 2: 2 × 10 = 20 m."
        mistakes: {"45": scale_inverted, "29": added_not_ratio}
      - prompt: "Why are the triangles made by a stick and its shadow and by a tree and its shadow similar?"
        options: ["Both stand straight up and the sun's rays meet the ground at the same angle", "The stick and the tree are the same height", "The two shadows are the same length", "Any two triangles are similar"]
        answer: "Both stand straight up and the sun's rays meet the ground at the same angle"
        difficulty: 2
        hints: ["Think about the angles in each triangle."]
        solution: "Step 1: Both have a right angle at the ground. Step 2: The sun's rays make the same angle with the ground for both. Step 3: Two equal angles, so the triangles are similar."
        mistakes: {"The stick and the tree are the same height": "shadow_similar", "The two shadows are the same length": "shadow_similar", "Any two triangles are similar": "shadow_similar"}
      - prompt: "A girl 1.5 m tall casts a 2 m shadow. At the same time, a lamp post casts a 10 m shadow. How tall is the lamp post, in metres?"
        answer: "7.5"
        check: "1.5*10/2"
        difficulty: 2
        hints: ["The lamp post's shadow is 5 times the girl's."]
        solution: "Step 1: 10 ÷ 2 = 5. Step 2: 1.5 × 5 = 7.5 m."
        mistakes: {"9.5": added_not_ratio}
      - prompt: "A tree 12 m tall casts a 9 m shadow. How long is the shadow of a 4 m wall at the same time, in metres?"
        answer: "3"
        check: "4*9/12"
        difficulty: 2
        hints: ["The wall is a third of the tree's height."]
        solution: "Step 1: 4 ÷ 12 = 1/3. Step 2: Shadow = 9 ÷ 3 = 3 m."
        mistakes: {"1": added_not_ratio}
      - prompt: "On a map with a scale of 1 : 50000, two villages are 6 cm apart. How far apart are they really, in km?"
        answer: "3"
        check: "6*50000/100000"
        difficulty: 3
        hints: ["Real distance = 6 × 50000 cm.", "100000 cm = 1 km."]
        solution: "Step 1: 6 × 50000 = 300000 cm. Step 2: 300000 cm = 3000 m = 3 km."
        mistakes: {"300000": unit_change, "300": unit_change}
      - prompt: "A 1.2 m boy casts a 1.8 m shadow. At the same time a flagpole casts a 12 m shadow. How tall is the flagpole, in metres?"
        answer: "8"
        check: "12*1.2/1.8"
        difficulty: 2
        hints: ["Height ÷ shadow is the same for both.", "1.2 ÷ 1.8 = 2/3."]
        solution: "Step 1: Height ÷ shadow = 1.2 ÷ 1.8 = 2/3. Step 2: Flagpole = 12 × 2/3 = 8 m."
        mistakes: {"18": scale_inverted, "11.4": added_not_ratio}
      - prompt: "On a map, 2 cm stands for 5 km. Two towns are 7 cm apart on the map. How far apart are they really, in km?"
        answer: "17.5"
        check: "7*5/2"
        difficulty: 3
        hints: ["1 cm on the map is 2.5 km.", "7 × 2.5."]
        solution: "Step 1: 1 cm = 5 ÷ 2 = 2.5 km. Step 2: 7 cm = 7 × 2.5 = 17.5 km."
        mistakes: {"35": unit_change, "10": added_not_ratio}
      - prompt: "A mirror lies flat on the ground 6 m from a tree. A girl stands 1.5 m from the mirror on the other side and sees the treetop in it. Her eyes are 1.2 m above the ground. How tall is the tree, in metres?"
        answer: "4.8"
        check: "1.2*6/1.5"
        difficulty: 3
        hints: ["The light reflects at equal angles, so the two triangles are similar.", "Eye height ÷ her distance = tree height ÷ tree's distance."]
        solution: "Step 1: 1.2 ÷ 1.5 = height ÷ 6. Step 2: Height = 6 × 0.8 = 4.8 m."
        mistakes: {"7.5": scale_inverted, "5.7": added_not_ratio}
      - prompt: A 1 m stick casts a 3 m shadow. At the same time a tower casts a 45 m shadow. How tall is the tower, in metres?
        answer: '15'
        check: 45/3
        difficulty: 1
        hints:
        - Height ÷ shadow is the same for both.
        - The shadow is 3 times the height.
        solution: 'Step 1: The stick''s shadow is 3 times its height. Step 2: So the tower''s height is 45 ÷ 3. Step 3: = 15 m.'
        mistakes:
          '135': shadow_similar
      - prompt: A 1.5 m girl casts a 1 m shadow. At the same time a tree casts a 6 m shadow. How tall is the tree, in metres?
        answer: '9'
        check: 1.5*6/1
        difficulty: 1
        hints:
        - Height is 1.5 times the shadow here.
        - 6 × 1.5.
        solution: 'Step 1: Height ÷ shadow = 1.5 ÷ 1 = 1.5. Step 2: Tree height = 6 × 1.5. Step 3: = 9 m.'
        mistakes:
          '4': scale_inverted
      - prompt: A 3 m pole casts a 2 m shadow. At the same time a tower's shadow is 24 m. How tall is the tower, in metres?
        answer: '36'
        check: 3*24/2
        difficulty: 2
        hints:
        - Height ÷ shadow = 3 ÷ 2.
        - 24 × 1.5.
        solution: 'Step 1: Height ÷ shadow = 1.5. Step 2: Tower = 24 × 1.5. Step 3: = 36 m.'
        mistakes:
          '16': scale_inverted
      - prompt: 'On a map with a scale of 1 : 25000, a road is 8 cm long. How long is it really, in km?'
        answer: '2'
        check: 8*25000/100000
        difficulty: 2
        hints:
        - 8 cm on the map is 8 × 25000 cm on the ground.
        - 100000 cm = 1 km.
        solution: 'Step 1: 8 × 25000 = 200000 cm. Step 2: 200000 cm = 2000 m. Step 3: = 2 km.'
        mistakes:
          '200': unit_change
          '20': unit_change
      - prompt: A school plan uses 1 cm for 4 m. The playground is 25 cm long on the plan. How long is it really, in metres?
        answer: '100'
        check: 25*4
        difficulty: 3
        hints:
        - Each cm stands for 4 m.
        - 25 × 4.
        solution: 'Step 1: 1 cm ↔ 4 m. Step 2: 25 cm ↔ 25 × 4 m. Step 3: = 100 m.'
        mistakes:
          '6.25': scale_inverted
      - prompt: A 6 m tree casts a 4 m shadow. At the same time a lamp post casts a 3 m shadow. How tall is the lamp post, in metres? Decimals are fine.
        answer: '4.5'
        check: 6*3/4
        difficulty: 3
        hints:
