# Class 9 Mathematics, chapter 3. Format: content/README.md.
subject: math
chapter: 3
title: Parallel Lines

tips:
  counted_lines_not_gaps: "Count the gaps between the lines, not the lines: 5 lines make 4 gaps. The equal pieces sit in the gaps."
  equal_on_each_line: "The pieces are equal along each slanted line, but a more slanted line has longer pieces than a less slanted one."
  added_not_ratio: "Parallel lines keep ratios, not differences. If one part doubles, the other part doubles too."
  ratio_order: "Keep the parts in the same order on both lines: first part : second part."
  swapped_parts: "That is the other part. Read again which one the question asks for."
  equal_lengths_not_ratio: "The parts are in the same ratio, but they need not be the same length, because the two sides can be different lengths."
  shares_not_added: "Add the ratio numbers to find how many equal shares there are. In 2 : 3 there are 5 shares."
  multiplied_ratio: "Add the two ratio numbers, don't multiply them: a ratio like 2 : 5 needs 2 + 5 equal steps."
  short_ratio_side: "Parallel lines cut both sides in the same ratio. 2 : 2 on one side means the same on the other."

concepts:
  - code: math9.parallel.equal_parts
    title: Equally spaced parallel lines
    notes: |
      If parallel lines are equally spaced, any line crossing them is cut into equal parts. A more
      slanted line gives longer parts, but they are still equal to each other. With n lines there
      are n − 1 gaps. The ruled lines of a notebook can divide a strip into equal parts.
    explanations:
      text: "Notebook lines are parallel and equally spaced. Lay a ruler slanted across them: the pieces of the ruler between neighbouring lines are all the same length. Tilt the ruler more and the pieces get longer, but they stay equal to one another. So you can split any strip into equal parts without measuring."
      visual: "Draw five equally spaced parallel lines. Draw a slanted line across them and mark where it crosses: A, B, C, D and E. AB, BC, CD and DE are all equal. Draw a second, steeper slanted line. Its four pieces are equal too, though not the same length as the first line's."
      step_by_step: "To cut a 13 cm strip into 5 equal parts with notebook lines: Step 1: Put one end of the strip on a line. Step 2: Tilt the strip until its other end touches the 5th line after it. Step 3: Mark where the lines in between cross the strip. Step 4: The 4 marks cut it into 5 equal parts of 13 ÷ 5 = 2.6 cm."
      real_world: "A tailor wants 6 equal pleats on a 25 cm piece of cloth. Slanting the cloth across 6 gaps of a lined sheet gives the marks at once, each about 4.17 cm apart, with no awkward measuring."
    picture:
      kind: geometry
      points:
        A: [3, 9]
        B: [4, 7]
        C: [5, 5]
        D: [6, 3]
        E: [7, 1]
        _a1: [1, 9]
        _a2: [9, 9]
        _b1: [1, 7]
        _b2: [9, 7]
        _c1: [1, 5]
        _c2: [9, 5]
        _d1: [1, 3]
        _d2: [9, 3]
        _e1: [1, 1]
        _e2: [9, 1]
      segments:
      - [_a1, _a2]
      - [_b1, _b2]
      - [_c1, _c2]
      - [_d1, _d2]
      - [_e1, _e2]
      - [A, E]
      caption: 'The parallel lines are equally spaced, so they cut the slanted line into equal parts: AB = BC = CD = DE.'
      alt: Five equally spaced parallel lines crossed by a slanted line at A, B, C, D and E, which cut it into four equal pieces.
    activity:
      type: number_line
      min: 0
      max: 12
      step: 1
      start: 0
      prompt: Equally spaced parallel lines cut a 12 cm line into equal parts. Mark where the cuts fall.
      goals:
      - prompt: 'Cut it into 3 equal parts: mark the first cut.'
        target: 4
        mistakes:
        - when:
            v: 3
          say: 3 cm is a quarter of 12 cm. Cutting there would make 4 parts, not 3.
        - when:
            v: 6
          say: '6 cm is halfway: that cuts the line into 2 parts, not 3.'
        - when:
            v: 8
          say: '8 cm is two thirds of the way: that''s the second cut, not the first.'
      - prompt: 'Cut it into 4 equal parts: mark the third cut.'
        target: 9
        mistakes:
        - when:
            v: 3
          say: 3 cm is the first cut. The goal asks for the third one.
        - when:
            v: 6
          say: '6 cm is halfway: that''s the second cut of four.'
        - when:
            v: 8
          say: 8 cm is two thirds of the line. Quarters are smaller pieces than thirds.
    lesson:
      - teach: 'Look at the ruled lines in your notebook. They are parallel (they never meet) and equally spaced. Draw any slanted line across them: the ruled lines cut it into pieces that are all the same length.'
        check:
          prompt: Equally spaced parallel lines cut a slanted line. One piece is 2 cm. How long is the next piece?
          options:
          - 2 cm
          - 4 cm
          - It can be any length
          answer: 2 cm
          why: Equally spaced parallel lines cut any crossing line into equal pieces, so every piece is 2 cm.
        ways:
        - style: real_world
          teach: Lay a pencil slanting across a page of your ruled notebook. Mark where each line crosses it. The marks are the same distance apart along the pencil, because the ruled lines are parallel and equally spaced. Tilt the pencil and the marks spread out, but stay equal to each other.
      - teach: A line that slants more crosses at a longer path, so its pieces are longer, but they are still equal to each other. One line might be cut into 2 cm pieces and another into 3 cm pieces by the same ruled lines.
        check:
          prompt: The same ruled lines cut line A into 2 cm pieces. Line B slants more. What can you say about B's pieces?
          options:
          - They are equal to each other, and longer than 2 cm
          - They are all 2 cm
          - They get longer and longer
          answer: They are equal to each other, and longer than 2 cm
          why: Each crossing line is cut into equal pieces; a more slanted line has longer ones.
        ways:
        - style: real_world
          teach: Walk straight across a zebra crossing and each stripe takes, say, one step. Walk across it slanting and each stripe takes a longer step, but every stripe still takes the same longer step. More slant means longer pieces, never unequal ones.
      - teach: Count gaps, not lines. With 4 parallel lines there are 3 gaps between them, so a slanted line across all 4 is cut into 3 pieces. With n lines there are n − 1 pieces.
        picture:
          kind: flow
          steps:
          - 4 parallel lines
          - 3 gaps between them
          - 3 equal pieces on the slanted line
          alt: Four parallel lines have three gaps, so a crossing line is cut into three equal pieces.
        check:
          prompt: A slanted line crosses 5 equally spaced parallel lines. Into how many pieces is it cut between the first and the last?
          options:
          - '4'
          - '5'
          - '6'
          answer: '4'
          why: 5 lines have 4 gaps between them, so there are 4 pieces.
        ways:
        - style: real_world
          teach: 'Think of fence posts: 4 posts have 3 gaps between them. Parallel lines are like the posts and the pieces of the slanted line are the gaps. So with 4 lines there are 3 pieces, and with n lines there are n − 1.'
    items:
      - prompt: "Four equally spaced parallel lines cross a slanted line. The part between the first two lines is 3 cm. How long is the slanted line from the first line to the fourth, in cm?"
        answer: "9"
        check: "3*3"
        difficulty: 1
        hints: ["How many gaps are there between 4 lines?", "3 gaps of 3 cm each."]
        solution: "Step 1: 4 lines make 3 gaps. Step 2: Each gap cuts 3 cm. Step 3: 3 × 3 = 9 cm."
        mistakes: {"12": counted_lines_not_gaps}
      - prompt: "A slanted line crosses 6 equally spaced parallel lines. From the first line to the last it is 20 cm long. How long is each piece between neighbouring lines, in cm?"
        answer: "4"
        check: "20/5"
        difficulty: 1
        hints: ["6 lines make 5 gaps.", "The 20 cm is shared equally between the gaps."]
        solution: "Step 1: 6 lines make 5 gaps. Step 2: 20 ÷ 5 = 4 cm."
        mistakes: {"3.33": "counted_lines_not_gaps", "20": "forgot_divide"}
      - prompt: "Three equally spaced parallel lines are crossed by two different slanted lines. Which is true?"
        options: ["Each slanted line is cut into two equal parts", "Both slanted lines are cut into parts of the same length", "The two parts of each slanted line are different lengths"]
        answer: "Each slanted line is cut into two equal parts"
        difficulty: 1
        hints: ["Equal spacing gives equal parts along any one crossing line.", "Does a more slanted line have the same length of parts?"]
        solution: "Step 1: Equally spaced parallel lines cut each crossing line into equal parts. Step 2: Different slants give different lengths, so the two lines' parts need not match each other."
        mistakes: {"Both slanted lines are cut into parts of the same length": equal_on_each_line}
      - prompt: "To divide a strip into 7 equal parts using equally spaced parallel lines, how many gaps between the lines must the strip reach across?"
        answer: "7"
        check: "8 - 1"
        difficulty: 2
        hints: ["Each gap gives one part."]
        solution: "Step 1: Each gap between two lines gives one part. Step 2: 7 parts need 7 gaps, which is 8 lines."
        mistakes: {"8": counted_lines_not_gaps}
      - prompt: "Equally spaced parallel lines cut a slanted line into pieces of 2.5 cm. The slanted line crosses 9 of the lines. How long is it from the first of them to the last, in cm?"
        answer: "20"
        check: "(9 - 1)*2.5"
        difficulty: 2
        hints: ["9 lines make 8 gaps."]
        solution: "Step 1: 9 lines make 8 gaps. Step 2: 8 × 2.5 = 20 cm."
        mistakes: {"22.5": counted_lines_not_gaps}
      - prompt: "Five equally spaced parallel lines cross two slanted lines. On the second slanted line, the part from the 1st to the 3rd parallel line is 7 cm. How long is the second slanted line from the 1st to the 5th parallel line, in cm?"
        answer: "14"
        check: "4*(7/2)"
        difficulty: 3
        hints: ["From the 1st to the 3rd line is 2 gaps.", "Each gap on this line is 3.5 cm. How many gaps from the 1st to the 5th?"]
        solution: "Step 1: 1st to 3rd line is 2 gaps, so each gap is 3.5 cm. Step 2: 1st to 5th line is 4 gaps. Step 3: 4 × 3.5 = 14 cm."
        mistakes: {"17.5": counted_lines_not_gaps}
      - prompt: "A slanted line crosses 8 equally spaced parallel lines. Each part between neighbouring lines is 1.5 cm. How long is it from the first line to the last, in cm?"
        answer: "10.5"
        check: "7*1.5"
        difficulty: 2
        hints: ["8 lines make how many gaps?", "There are 7 gaps of 1.5 cm."]
        solution: "Step 1: 8 lines have 7 gaps. Step 2: 7 × 1.5 = 10.5 cm."
        mistakes: {"12": counted_lines_not_gaps}
      - prompt: "Equally spaced parallel lines cut one slanted line into parts of 2 cm and another slanted line into parts of 3 cm. On the first line, from the 1st parallel line to the 6th is 10 cm. How long is that stretch on the second line, in cm?"
        answer: "15"
        check: "5*3"
        difficulty: 3
        hints: ["From the 1st to the 6th line is 5 gaps.", "On the second line each gap is 3 cm."]
        solution: "Step 1: 1st to 6th line = 5 gaps (10 ÷ 2 = 5 on the first line). Step 2: 5 × 3 = 15 cm on the second line."
        mistakes: {"18": counted_lines_not_gaps, "10": equal_on_each_line}
      - prompt: "A strip of paper 21 cm wide is laid slanting across ruled lines so that it is divided into 7 equal parts. How wide is each part, in cm?"
        answer: "3"
        check: "21/7"
        difficulty: 3
        hints: ["7 equal parts need 8 ruled lines, but you only need the number of parts here.", "Share 21 cm into 7 equal parts."]
        solution: "Step 1: The strip is cut into 7 equal parts. Step 2: 21 ÷ 7 = 3 cm each."
        mistakes: {"2.625": counted_lines_not_gaps, "3.5": counted_lines_not_gaps}
      - prompt: A slanted line crosses 3 equally spaced parallel lines. Each piece between neighbouring lines is 5 cm. How long is it from the first line to the last, in cm?
        answer: '10'
        check: (3 - 1)*5
        difficulty: 1
        hints:
        - How many gaps are there between 3 lines?
        - There are 2 gaps, each 5 cm.
        solution: 'Step 1: 3 lines have 2 gaps. Step 2: Each gap gives a 5 cm piece. Step 3: 2 × 5 = 10 cm.'
        mistakes:
          '15': counted_lines_not_gaps
      - prompt: A slanted line crosses 5 equally spaced parallel lines. From the first to the last it is 12 cm. How long is each piece, in cm?
        answer: '3'
        check: 12/(5 - 1)
        difficulty: 1
        hints:
        - Count the gaps between 5 lines.
        - 12 cm is shared among 4 gaps.
        solution: 'Step 1: 5 lines have 4 gaps. Step 2: 12 ÷ 4 = 3. Step 3: So each piece is 3 cm.'
        mistakes:
          '2.4': counted_lines_not_gaps
      - prompt: Equally spaced parallel lines cut line A into 2 cm pieces and line B into 4 cm pieces. On line A, 5 pieces make 10 cm. How long are the same 5 pieces on line B, in cm?
        answer: '20'
        check: 5*4
        difficulty: 2
        hints:
        - The same gaps give 5 pieces on line B too.
        - Each piece on B is 4 cm.
        solution: 'Step 1: The same 5 gaps cut B into 5 pieces. Step 2: Each is 4 cm. Step 3: 5 × 4 = 20 cm.'
        mistakes:
          '10': equal_on_each_line
      - prompt: Which of these can divide a strip of paper into 5 equal parts?
        options:
        - Laying it slanting across a notebook so it spans exactly 5 gaps between ruled lines
        - Laying it across 5 ruled lines
        - Folding it in half twice
        answer: Laying it slanting across a notebook so it spans exactly 5 gaps between ruled lines
        difficulty: 2
        hints:
        - Equal gaps between ruled lines give equal pieces.
        - How many gaps make 5 parts?
        solution: 'Step 1: Equally spaced lines cut the strip into equal pieces. Step 2: 5 gaps give 5 pieces. Step 3: 5 lines would give only 4 gaps, and folding twice gives 4 parts.'
        mistakes:
          Laying it across 5 ruled lines: counted_lines_not_gaps
      - prompt: A slanted line crosses 10 equally spaced parallel lines and is 27 cm from the first to the last. How long is it from the 1st line to the 4th, in cm?
        answer: '9'
        check: 27/9*3
        difficulty: 3
        hints:
        - 'First find one piece: how many gaps between 10 lines?'
        - Each piece is 27 ÷ 9 cm. From the 1st line to the 4th is 3 pieces.
        solution: 'Step 1: 10 lines have 9 gaps, so each piece is 27 ÷ 9 = 3 cm. Step 2: From line 1 to line 4 is 3 gaps. Step 3: 3 × 3 = 9 cm.'
        mistakes:
          '12': counted_lines_not_gaps
      - prompt: Equally spaced parallel lines cut a slanted line into 1.2 cm pieces. How many gaps does a 6 cm stretch of that line cross?
        answer: '5'
        check: 6/1.2
        difficulty: 3
        hints:
        - Each gap gives one 1.2 cm piece.
        - How many 1.2 cm pieces make 6 cm?
        solution: 'Step 1: Each gap makes a 1.2 cm piece. Step 2: 6 ÷ 1.2 = 5. Step 3: So the stretch crosses 5 gaps, between 6 lines.'
        mistakes:
          '6': counted_lines_not_gaps

  - code: math9.parallel.ratio
    title: Parallel lines and ratios
    after: [math9.parallel.equal_parts]
    notes: |
      Parallel lines need not be equally spaced. Whatever their spacing, they cut any two crossing
      lines in the same ratio: if they cut one line into 2 cm and 3 cm, and another into 4 cm and
      x cm, then 2 : 3 = 4 : x, so x = 6.
    explanations:
      text: "Parallel lines don't have to be equally spaced. Whatever their spacing, they cut any two crossing lines in the same ratio. If three parallel lines cut one line into 2 cm and 3 cm, they cut every other crossing line in the ratio 2 : 3 too, for example into 4 cm and 6 cm, or 3 cm and 4.5 cm."
      visual: "Draw three parallel lines with the middle one nearer the top. Cross them with two slanted lines. On each slanted line the top piece is shorter, and top piece ÷ bottom piece gives the same number for both lines."
      step_by_step: "Three parallel lines cut one line into 2 cm and 3 cm, and another into 4 cm and x cm. Step 1: The ratios match: 2 : 3 = 4 : x. Step 2: As fractions, 2/3 = 4/x. Step 3: Cross-multiply: 2x = 12. Step 4: x = 6 cm."
      real_world: "Two straight roads cross three parallel railway lines. Between the first two railways, road A runs 400 m and road B 500 m. If road A runs 600 m between the second and third railways, road B runs 750 m there, because 400 : 600 = 500 : 750."
    activity:
      type: formula
      prompt: 'A 10 cm line is cut in the ratio a : b by parallel lines.'
      inputs:
      - name: a
        label: a
        min: 1
        max: 9
        step: 1
        start: 1
      - name: b
        label: b
        min: 1
        max: 9
        step: 1
        start: 1
      outputs:
      - name: p
        label: First part
        expr: 10*a/(a+b)
        unit: cm
      - name: q
        label: Second part
        expr: 10*b/(a+b)
        unit: cm
      goals:
      - prompt: Make the first part 6 cm and the second 4 cm. What ratio is that?
        want:
          p: 6
          q: 4
        mistakes:
        - when:
            p: 4
            q: 6
          say: 'The parts are swapped: the first part is 4 cm and the second 6 cm. In a : b, a goes with the first part.'
    lesson:
      - teach: Parallel lines need not be equally spaced. Take three parallel lines, with a wide gap and a narrow gap. Any line crossing them is cut into a long piece and a short piece.
        check:
          prompt: Three parallel lines have a wide gap then a narrow gap. A line crosses them. Which piece is longer?
          options:
          - The piece across the wide gap
          - The piece across the narrow gap
          - They are equal
          answer: The piece across the wide gap
          why: The wider the gap between the parallel lines, the longer the piece of the crossing line.
        ways:
        - style: real_world
          teach: On a road with three parallel lanes markings, one lane wide and one narrow, a bridge crossing the road diagonally spends longer over the wide lane than over the narrow one. Whatever the angle, the wide gap always gives the longer piece.
      - teach: 'The rule: parallel lines cut every crossing line in the same ratio. If they cut one line into 2 cm and 3 cm (ratio 2 : 3), they cut any other crossing line in the ratio 2 : 3 too, such as 4 cm and 6 cm.'
        picture:
          kind: compare
          columns:
          - title: Line l
            points:
            - 2 cm
            - 3 cm
            - 'ratio 2 : 3'
          - title: Line m
            points:
            - 4 cm
            - 6 cm
            - 'ratio 2 : 3'
          alt: 'The same three parallel lines cut line l into 2 cm and 3 cm, and line m into 4 cm and 6 cm: the same ratio 2 : 3.'
        check:
          prompt: Parallel lines cut one line into 1 cm and 2 cm. Another line is cut into 3 cm and x cm. What is x?
          options:
          - '6'
          - '4'
          - '3'
          answer: '6'
          why: '1 : 2 = 3 : x. The first part grew 3 times, so the second does too: 2 × 3 = 6.'
        ways:
        - style: step_by_step
          teach: 'Step 1: on the first crossing line, write the two pieces as a ratio, like 2 : 3. Step 2: on any other crossing line, the pieces are in the same ratio. Step 3: find what the first piece was multiplied by, say 2 became 4 (×2). Step 4: multiply the other number the same: 3 × 2 = 6.'
      - teach: 'To find a missing length, write the two ratios equal and see what the first part was multiplied by. 2 : 3 = 4 : x. 2 became 4 (times 2), so 3 becomes 6. A common slip is adding instead: 2 + 2 = 4, so 3 + 2 = 5 is wrong.'
        check:
          prompt: '3 : 5 = 6 : x. What is x?'
          options:
          - '10'
          - '8'
          - '15'
          answer: '10'
          why: '3 was doubled to make 6, so 5 is doubled too: x = 10. Adding 3 to each would give 8, which keeps the difference, not the ratio.'
        ways:
        - style: real_world
          teach: A recipe uses 2 cups of rice to 3 cups of water. For twice as much you use 4 cups of rice, so 6 cups of water, not 5. Ratios grow by multiplying, not adding. Missing lengths cut by parallel lines work just the same.
    items:
      - prompt: "Three parallel lines cut one line into parts of 2 cm and 3 cm, and another line into parts of 4 cm and x cm. What is x?"
        answer: "6"
        check: "4*3/2"
        difficulty: 1
        hints: ["2 : 3 = 4 : x.", "2 became 4, so it doubled."]
        solution: "Step 1: 2/3 = 4/x. Step 2: 2x = 12. Step 3: x = 6 cm."
        mistakes: {"5": added_not_ratio}
      - prompt: "Parallel lines cut one line into parts of 3 cm and 6 cm. They cut another line into a 5 cm part and a second part. How long is the second part, in cm?"
        answer: "10"
        check: "5*6/3"
        difficulty: 1
        hints: ["On the first line the second part is twice the first."]
        solution: "Step 1: 3 : 6 = 1 : 2. Step 2: So the second part is 2 × 5 = 10 cm."
        mistakes: {"8": added_not_ratio}
      - prompt: "Three parallel lines cut a line into parts of 4 cm and 6 cm. In what ratio do they cut any other line crossing them?"
        options: ["2 : 3", "3 : 2", "1 : 1", "4 : 10"]
        answer: "2 : 3"
        difficulty: 1
        hints: ["Simplify 4 : 6.", "Keep the parts in the same order."]
        solution: "Step 1: 4 : 6 = 2 : 3. Step 2: Every crossing line is cut in the ratio 2 : 3."
        mistakes: {"3 : 2": ratio_order}
      - prompt: "Three parallel lines cut line l into 2.5 cm and 4 cm. They cut line m into x cm and 6 cm. What is x? Decimals are fine."
        answer: "3.75"
        check: "6*2.5/4"
        difficulty: 2
        hints: ["x : 6 = 2.5 : 4.", "x = 6 × 2.5 ÷ 4."]
        solution: "Step 1: x/6 = 2.5/4. Step 2: x = 15/4. Step 3: x = 3.75 cm."
        mistakes: {"4.5": added_not_ratio}
      - prompt: "Three parallel lines cross a line, and the part between the outer two is 12 cm. The middle line cuts it in the ratio 1 : 2. How long is the shorter part, in cm?"
        answer: "4"
        check: "12*1/3"
        difficulty: 2
        hints: ["1 : 2 means 3 equal shares.", "Each share is 12 ÷ 3."]
        solution: "Step 1: 1 + 2 = 3 shares. Step 2: Each share is 4 cm. Step 3: The shorter part is 1 share, 4 cm."
        mistakes: {"6": shares_not_added, "8": swapped_parts}
      - prompt: "Three parallel lines cut line l into 4 cm and 5 cm. On line m, the length between the outer two lines is 13.5 cm. How long is the first part of line m, in cm?"
        answer: "6"
        check: "13.5*4/9"
        difficulty: 3
        hints: ["Line m is cut in the ratio 4 : 5, which is 9 shares.", "One share is 13.5 ÷ 9 = 1.5 cm."]
        solution: "Step 1: 4 + 5 = 9 shares. Step 2: One share is 1.5 cm. Step 3: The first part is 4 × 1.5 = 6 cm."
        mistakes: {"7.5": swapped_parts}
      - prompt: "Two roads cross three parallel railway lines. Between the first two railways, road A runs 400 m and road B runs 500 m. Between the second and third railways, road A runs 600 m. How far does road B run there, in metres?"
        answer: "750"
        check: "500*600/400"
        difficulty: 3
        hints: ["400 : 600 = 500 : x.", "600 is 1.5 times 400."]
        solution: "Step 1: 400/600 = 500/x. Step 2: 400x = 300000. Step 3: x = 750 m."
        mistakes: {"700": added_not_ratio}
      - prompt: "Three parallel lines cut a line into 6 cm and 9 cm. Another line crossing them is 25 cm between the outer lines. How long is its shorter part, in cm?"
        answer: "10"
        check: "25*6/15"
        difficulty: 2
        hints: ["The ratio is 6 : 9 = 2 : 3, so there are 5 shares.", "25 cm shared in the ratio 2 : 3."]
        solution: "Step 1: 6 : 9 = 2 : 3. Step 2: 25 ÷ 5 = 5 cm per share. Step 3: Shorter part = 2 × 5 = 10 cm."
        mistakes: {"15": swapped_parts, "6": equal_lengths_not_ratio}
      - prompt: "Four parallel lines cut line l into 2 cm, 3 cm and 5 cm. They cut line m into 3 cm, x cm and y cm. What is x + y?"
        answer: "12"
        check: "3*(3 + 5)/2"
        difficulty: 3
        hints: ["The first parts are 2 cm and 3 cm, so line m is 1.5 times line l.", "x = 1.5 × 3 and y = 1.5 × 5."]
        solution: "Step 1: 3 ÷ 2 = 1.5, so every part on m is 1.5 times the part on l. Step 2: x = 4.5 and y = 7.5. Step 3: x + y = 12."
        mistakes: {"9": added_not_ratio, "8": equal_lengths_not_ratio}
      - prompt: "Three parallel lines cut line l into 3 cm and 5 cm. On line m, the second part is 2 cm longer than the first. How long is the first part on m, in cm?"
        answer: "3"
        check: "2*3/(5 - 3)"
        difficulty: 3
        hints: ["The parts on m are in the ratio 3 : 5, like 3k and 5k.", "5k − 3k = 2."]
        solution: "Step 1: Parts on m are 3k and 5k. Step 2: 5k − 3k = 2k = 2, so k = 1. Step 3: The first part is 3 cm (and the second 5 cm)."
        mistakes: {"5": swapped_parts, "1": shares_not_added}
      - prompt: Parallel lines cut one line into 2 cm and 5 cm. They cut another line into 6 cm and x cm. What is x?
        answer: '15'
        check: 5*6/2
        difficulty: 1
        hints:
        - The ratio on both lines is the same.
        - 2 became 6, which is times 3.
        solution: 'Step 1: 2 : 5 = 6 : x. Step 2: 6 is 3 times 2. Step 3: So x = 3 × 5 = 15.'
        mistakes:
          '9': added_not_ratio
      - prompt: Three parallel lines cut a line into 3 cm and 9 cm. In what ratio do they cut another line?
        options:
        - '1 : 3'
        - '3 : 1'
        - '1 : 9'
        - '3 : 9 is not a ratio'
        answer: '1 : 3'
        difficulty: 1
        hints:
        - Every crossing line is cut in the same ratio.
        - '3 : 9 can be simplified by dividing both by 3.'
        solution: 'Step 1: The ratio is 3 : 9. Step 2: Divide both by 3: 1 : 3. Step 3: Any other crossing line is cut in the ratio 1 : 3.'
        mistakes:
          '3 : 1': ratio_order
      - prompt: Three parallel lines cut line l into 4 cm and 10 cm. They cut line m into x cm and 15 cm. What is x?
        answer: '6'
        check: 4*15/10
        difficulty: 2
        hints:
        - '4 : 10 = x : 15.'
        - '10 became 15: what was it multiplied by?'
        solution: 'Step 1: 10 × 1.5 = 15. Step 2: So x = 4 × 1.5. Step 3: x = 6 cm.'
        mistakes:
          '9': added_not_ratio
      - prompt: 'Three parallel lines cross a line, and the length between the outer two is 20 cm. The middle line cuts it in the ratio 3 : 2. How long is the longer part, in cm?'
        answer: '12'
        check: 20*3/5
        difficulty: 2
        hints:
        - '3 : 2 means 5 equal shares in all.'
        - Each share is 20 ÷ 5 cm.
        solution: 'Step 1: 3 + 2 = 5 shares. Step 2: Each share is 4 cm. Step 3: The longer part is 3 × 4 = 12 cm.'
        mistakes:
          '8': swapped_parts
      - prompt: Four parallel lines cut line l into 1 cm, 2 cm and 3 cm. They cut line m into pieces whose total is 18 cm. How long is the longest piece on m, in cm?
        answer: '9'
        check: 18*3/6
        difficulty: 3
        hints:
        - 'The pieces on m are in the ratio 1 : 2 : 3 too.'
        - 1 + 2 + 3 = 6 shares make 18 cm.
        solution: 'Step 1: 6 shares make 18 cm, so one share is 3 cm. Step 2: The pieces on m are 3, 6 and 9 cm. Step 3: The longest is 9 cm.'
        mistakes:
          '3': swapped_parts
      - prompt: Three parallel lines cut line l into 5 cm and 7 cm. On line m the first part is 4 cm shorter than the second. How long is the second part on m, in cm?
        answer: '14'
        check: 7*4/2
        difficulty: 3
        hints:
        - On l the difference between the parts is 2 cm.
        - On m the difference is 4 cm, so m is l times 2.
        solution: 'Step 1: On l, 7 − 5 = 2. Step 2: On m the difference is 4, twice as much, so every part is doubled. Step 3: The second part on m is 7 × 2 = 14 cm.'
        mistakes:
          '11': added_not_ratio

  - code: math9.parallel.triangle
    title: A line parallel to a side of a triangle
    after: [math9.parallel.ratio]
    notes: |
      In triangle ABC, a line parallel to BC meets AB at P and AC at Q. Then AP : PB = AQ : QC,
      and also AP : AB = AQ : AC. (Think of a third parallel line through A: three parallel lines
      crossing AB and AC.)
    explanations:
      text: "Draw a triangle ABC and a line parallel to BC that cuts AB at P and AC at Q. P and Q cut the two sides in the same ratio: AP : PB = AQ : QC. Why? Imagine one more line through A, parallel to BC. Now three parallel lines cross AB and AC, which is the rule from before."
      visual: "Draw triangle ABC with BC at the bottom. Draw PQ parallel to BC, a third of the way down. P is a third of the way down AB and Q is a third of the way down AC, so AP : PB = AQ : QC = 1 : 2."
      step_by_step: "In triangle ABC, PQ is parallel to BC, AP = 3 cm, PB = 6 cm and AQ = 4 cm. Step 1: AP : PB = AQ : QC. Step 2: 3/6 = 4/QC. Step 3: 3 × QC = 24. Step 4: QC = 8 cm."
      real_world: "A triangular sail has a seam parallel to its bottom edge. If the seam starts 1 m down a 3 m slanted edge, it is also a third of the way down the other slanted edge, so the sailmaker only needs to measure one side."
    picture:
      kind: geometry
      points:
        A: [5, 9]
        B: [1, 1]
        C: [9, 1]
        P: [3.67, 6.33]
        Q: [6.33, 6.33]
      segments:
      - [A, B]
      - [A, C]
      - [B, C, 9 cm]
      - [P, Q, 3 cm]
      caption: PQ is parallel to BC a third of the way down, so AP is a third of AB, AQ a third of AC, and PQ a third of BC.
      alt: Triangle ABC with a line PQ parallel to the base BC, a third of the way down from A. PQ is 3 cm, a third of BC's 9 cm.
    activity:
      type: formula
      prompt: 'In triangle ABC, a line parallel to BC cuts AB at P and AC at Q, with AQ = 4 cm. Then AP : PB = AQ : QC.'
      inputs:
      - name: ap
        label: AP
        min: 1
        max: 10
        step: 1
        start: 1
        unit: cm
      - name: pb
        label: PB
        min: 1
        max: 10
        step: 1
        start: 1
        unit: cm
      outputs:
      - name: qc
        label: QC
        expr: 4*pb/ap
        unit: cm
      goals:
      - prompt: Make QC = 6 cm. What do AP and PB have to be?
        want:
          qc: 6
        hint: 'AP : PB = AQ : QC = 4 : 6. Which pairs of numbers are in the ratio 4 : 6?'
        mistakes:
        - when:
            qc:
            - 2.6
            - 2.7
          say: 'QC came out about 2.67 cm, shorter than AQ. AP and PB may be the wrong way round: QC is longer than AQ, so PB must be longer than AP.'
    lesson:
      - teach: In triangle ABC, draw a line parallel to BC. It meets AB at P and AC at Q. Now imagine one more line through A, parallel to BC too. Then we have three parallel lines (through A, through P and Q, and BC) crossing the two sides AB and AC.
        picture:
          kind: flow
          steps:
          - Line through A, parallel to BC
          - Line PQ, parallel to BC
          - Side BC
          alt: 'Three parallel lines: one through A, PQ, and BC. Sides AB and AC both cross all three.'
        check:
          prompt: In triangle ABC, PQ is parallel to BC. Which lines do the sides AB and AC both cross?
          options:
          - The line through A, PQ and BC
          - Only BC
          - Only PQ
          answer: The line through A, PQ and BC
          why: Thinking of a parallel line through A gives three parallel lines that both sides cross.
        ways:
        - style: step_by_step
          teach: 'Step 1: draw triangle ABC. Step 2: draw PQ parallel to BC, with P on AB and Q on AC. Step 3: through A draw one more line parallel to BC. Step 4: now three parallel lines cross AB and AC, so everything you know about parallel lines and ratios applies to the two sides.'
      - teach: 'Three parallel lines cut both crossing lines in the same ratio. So AP : PB = AQ : QC. If AP = 3 and PB = 6, then AQ : QC is also 1 : 2.'
        check:
          prompt: PQ is parallel to BC, AP = 2 cm, PB = 4 cm and AQ = 3 cm. What is QC?
          options:
          - 6 cm
          - 5 cm
          - 1.5 cm
          answer: 6 cm
          why: 'AP : PB = 2 : 4 = 1 : 2, so QC is twice AQ: 6 cm.'
        ways:
        - style: step_by_step
          teach: 'Step 1: find the ratio on side AB, say AP : PB = 3 : 6 = 1 : 2. Step 2: the parallel line cuts AC in the same ratio, so AQ : QC = 1 : 2. Step 3: if AQ is known, multiply by 2 to get QC.'
      - teach: 'It also works with whole sides: AP : AB = AQ : AC. If AP is 2 of AB''s 5 equal shares, then AQ is 2 of AC''s 5 shares. Watch whether a question gives you PB (the rest of the side) or AB (the whole side).'
        check:
          prompt: PQ is parallel to BC, AP = 3 cm and AB = 9 cm. What fraction of AC is AQ?
          options:
          - 1/3
          - 1/2
          - 3/9 of AB
          answer: 1/3
          why: 'AP : AB = 3 : 9 = 1 : 3, so AQ is 1/3 of AC.'
        ways:
        - style: real_world
          teach: Think of a slice of cake cut parallel to its base. If you cut a third of the way down one side, you are a third of the way down the other side too. So if AP is one third of AB, then AQ is one third of AC. Just check whether you were given part of the side or all of it.
    items:
      - prompt: "In triangle ABC, a line parallel to BC cuts AB at P and AC at Q. AP = 3 cm, PB = 6 cm and AQ = 4 cm. What is QC, in cm?"
        answer: "8"
        check: "4*6/3"
        difficulty: 1
        hints: ["AP : PB = AQ : QC.", "PB is twice AP."]
        solution: "Step 1: 3/6 = 4/QC. Step 2: 3 × QC = 24. Step 3: QC = 8 cm."
        mistakes: {"7": added_not_ratio}
      - prompt: "In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP = 2 cm, PB = 2 cm and AQ = 3 cm. What is QC, in cm?"
        answer: "3"
        check: "3*2/2"
        difficulty: 1
        hints: ["AP and PB are equal, so P is the middle of AB."]
        solution: "Step 1: AP : PB = 1 : 1. Step 2: So AQ : QC = 1 : 1. Step 3: QC = 3 cm."
        mistakes: {"2": "short_ratio_side", "1": "short_ratio_side"}
      - prompt: "In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. Which is always true?"
        options: ["AP : PB = AQ : QC", "AP = AQ", "PB = QC", "AP : PB = QC : AQ"]
        answer: "AP : PB = AQ : QC"
        difficulty: 1
        hints: ["The two sides are cut in the same ratio.", "Keep the order: top part : bottom part on both sides."]
        solution: "Step 1: A line parallel to BC cuts AB and AC in the same ratio. Step 2: AP : PB = AQ : QC."
        mistakes: {"AP = AQ": equal_lengths_not_ratio, "PB = QC": equal_lengths_not_ratio, "AP : PB = QC : AQ": ratio_order}
      - prompt: "In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AB = 10 cm, AP = 4 cm and AC = 15 cm. What is AQ, in cm?"
        answer: "6"
        check: "15*4/10"
        difficulty: 2
        hints: ["AP : AB = AQ : AC.", "4/10 = AQ/15."]
        solution: "Step 1: AP/AB = AQ/AC. Step 2: 4/10 = AQ/15. Step 3: AQ = 6 cm."
        mistakes: {"9": swapped_parts}
      - prompt: "In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP = 5 cm, PB = 3 cm and AC = 12 cm. What is AQ, in cm? Decimals are fine."
        answer: "7.5"
        check: "12*5/8"
        difficulty: 2
        hints: ["AC is cut in the ratio 5 : 3, which is 8 shares.", "One share is 12 ÷ 8 = 1.5 cm."]
        solution: "Step 1: 5 + 3 = 8 shares. Step 2: One share is 1.5 cm. Step 3: AQ = 5 × 1.5 = 7.5 cm."
        mistakes: {"4.5": swapped_parts}
      - prompt: "In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP = x cm, PB = 4 cm, AQ = 6 cm and QC = 8 cm. What is x?"
        answer: "3"
        check: "6*4/8"
        difficulty: 3
        hints: ["x : 4 = 6 : 8.", "6 : 8 simplifies to 3 : 4."]
        solution: "Step 1: x/4 = 6/8. Step 2: x = 24/8. Step 3: x = 3 cm."
        mistakes: {"2": added_not_ratio}
      - prompt: "P is on side AB of triangle ABC with AP : PB = 2 : 3. A line through P parallel to BC meets AC at Q. AC = 20 cm. What is QC, in cm?"
        answer: "12"
        check: "20*3/5"
        difficulty: 3
        hints: ["AQ : QC = 2 : 3 too.", "That is 5 shares of 4 cm."]
        solution: "Step 1: AQ : QC = 2 : 3, which is 5 shares. Step 2: One share is 4 cm. Step 3: QC = 3 × 4 = 12 cm."
        mistakes: {"8": swapped_parts, "10": shares_not_added}
      - prompt: "In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP = 4 cm, AB = 12 cm and AQ = 5 cm. What is AC, in cm?"
        answer: "15"
        check: "5*12/4"
        difficulty: 2
        hints: ["AP : AB = AQ : AC.", "AB is 3 times AP."]
        solution: "Step 1: AP : AB = 4 : 12 = 1 : 3. Step 2: AC = 3 × AQ = 15 cm."
        mistakes: {"13": added_not_ratio, "10": swapped_parts}
      - prompt: "In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP : PB = 3 : 2 and AC = 15 cm. How long is QC, in cm?"
        answer: "6"
        check: "15*2/5"
        difficulty: 3
        hints: ["AQ : QC = 3 : 2 as well, so AC is 5 shares.", "Each share is 15 ÷ 5."]
        solution: "Step 1: AQ : QC = 3 : 2, so AC has 3 + 2 = 5 shares. Step 2: One share = 3 cm. Step 3: QC = 2 × 3 = 6 cm."
        mistakes: {"9": swapped_parts, "7.5": shares_not_added}
      - prompt: "In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP = 6 cm, PB = 9 cm and QC = 12 cm. How long is AC, in cm?"
        answer: "20"
        check: "12*6/9 + 12"
        difficulty: 3
        hints: ["First find AQ from AP : PB = AQ : QC.", "AQ = 12 × 6/9 = 8. Then AC = AQ + QC."]
        solution: "Step 1: AQ : 12 = 6 : 9, so AQ = 8 cm. Step 2: AC = 8 + 12 = 20 cm."
        mistakes: {"8": added_not_ratio, "18": swapped_parts}
      - prompt: In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP = 4 cm, PB = 2 cm and AQ = 6 cm. What is QC, in cm?
        answer: '3'
        check: 6*2/4
        difficulty: 1
        hints:
        - 'AP : PB = AQ : QC.'
        - AP is twice PB, so AQ is twice QC.
        solution: 'Step 1: AP : PB = 4 : 2 = 2 : 1. Step 2: So AQ : QC = 2 : 1. Step 3: QC = 6 ÷ 2 = 3 cm.'
        mistakes:
          '12': ratio_order
      - prompt: In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP = 1 cm, PB = 3 cm and QC = 6 cm. What is AQ, in cm?
        answer: '2'
        check: 6*1/3
        difficulty: 1
        hints:
        - 'AP : PB = AQ : QC.'
        - PB is 3 times AP.
        solution: 'Step 1: AP : PB = 1 : 3. Step 2: So QC is 3 times AQ. Step 3: AQ = 6 ÷ 3 = 2 cm.'
        mistakes:
          '18': ratio_order
      - prompt: In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AB = 12 cm, AP = 3 cm and AC = 8 cm. What is AQ, in cm?
        answer: '2'
        check: 8*3/12
        difficulty: 2
        hints:
        - 'Here you have whole sides: use AP : AB = AQ : AC.'
        - AP is a quarter of AB.
        solution: 'Step 1: AP : AB = 3 : 12 = 1 : 4. Step 2: So AQ is a quarter of AC. Step 3: AQ = 8 ÷ 4 = 2 cm.'
        mistakes:
          '6': short_ratio_side
      - prompt: In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP = 6 cm, PB = 4 cm and AC = 15 cm. What is QC, in cm?
        answer: '6'
        check: 15*4/10
        difficulty: 2
        hints:
        - AB = AP + PB = 10 cm.
        - 'QC is PB''s share of the side: 4 out of 10.'
        solution: 'Step 1: AB = 6 + 4 = 10 cm. Step 2: PB : AB = 4 : 10, so QC is 4/10 of AC. Step 3: QC = 15 × 4/10 = 6 cm.'
        mistakes:
          '9': swapped_parts
      - prompt: In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AQ = 5 cm, QC = 5 cm and AB = 9 cm. What is AP, in cm? Decimals are fine.
        answer: '4.5'
        check: 9/2
        difficulty: 3
        hints:
        - AQ and QC are equal. What does that say about Q?
        - Then P is in the same place on AB.
        solution: 'Step 1: AQ = QC, so Q is the middle of AC. Step 2: So P is the middle of AB too. Step 3: AP = 9 ÷ 2 = 4.5 cm.'
        mistakes:
          '5': equal_lengths_not_ratio
      - prompt: 'In triangle ABC, PQ is parallel to BC, with P on AB and Q on AC. AP : PB = 1 : 4 and AC = 25 cm. How long is AQ, in cm?'
        answer: '5'
        check: 25*1/5
        difficulty: 3
        hints:
        - '1 : 4 means AC is made of 5 equal shares.'
        - AQ is 1 share.
        solution: 'Step 1: 1 + 4 = 5 shares. Step 2: One share of 25 cm is 5 cm. Step 3: AQ = 5 cm and QC = 20 cm.'
        mistakes:
          '20': swapped_parts

  - code: math9.parallel.divide_segment
    title: Dividing a line in a given ratio
    after: [math9.parallel.ratio]
    notes: |
      To divide a line AB in the ratio m : n there are m + n equal shares: the parts are
      AB × m/(m + n) and AB × n/(m + n). Construction: draw a slanted line from A, mark m + n equal
      steps, join the last mark to B, and draw a parallel to that join through the m-th mark.
    explanations:
      text: "To divide a line AB in the ratio 2 : 3, there are 2 + 3 = 5 equal shares, each AB ÷ 5. So a 10 cm line splits into 4 cm and 6 cm. To draw it, make a slanted line from A, mark 5 equal steps on it, join the 5th mark to B, and draw a line through the 2nd mark parallel to that join. It cuts AB at the point you want."
      visual: "Picture AB along the bottom and a slanted line rising from A with five equal tick marks. A line runs from the 5th tick down to B, and a parallel line from the 2nd tick down to AB. The parallel lines cut AB in the same 2 : 3 ratio as the ticks."
      step_by_step: "To divide a 12 cm line in the ratio 1 : 3: Step 1: Add the ratio numbers: 1 + 3 = 4 shares. Step 2: One share is 12 ÷ 4 = 3 cm. Step 3: The first part is 1 share, 3 cm. Step 4: The second part is 3 shares, 9 cm. Step 5: Check: 3 + 9 = 12."
      real_world: "A 1.5 m ribbon is cut in the ratio 2 : 1 for two gift boxes. That is 3 shares of 0.5 m, so the pieces are 1 m and 0.5 m."
    activity:
      type: order
      prompt: 'Put the steps for dividing a line AB in the ratio 2 : 3 in order.'
      steps:
      - Draw the line AB
      - Draw a slanting line from A
      - Mark 5 equal steps along it from A
      - Join the 5th mark to B
      - Draw a parallel line through the 2nd mark
      - Where it meets AB is the point you want
      reasons:
        Draw a slanting line from A: A slanting line from A needs the line AB, and its point A, to be there first.
        Mark 5 equal steps along it from A: The steps go along the slanting line, so it must be drawn first. 2 + 3 = 5 steps.
        Join the 5th mark to B: There is no 5th mark until the 5 steps are marked.
        Draw a parallel line through the 2nd mark: Parallel to what? The line from the 5th mark to B has to be drawn first.
        Where it meets AB is the point you want: The point only appears where the parallel line crosses AB.
    lesson:
      - teach: 'Dividing a line in the ratio 2 : 3 means cutting it into 2 + 3 = 5 equal shares, then giving 2 shares to the first part and 3 to the second. A 10 cm line has shares of 2 cm, so the parts are 4 cm and 6 cm.'
        picture:
          kind: flow
          steps:
          - 'Ratio 2 : 3'
          - 2 + 3 = 5 shares
          - 10 cm ÷ 5 = 2 cm per share
          - 'Parts: 4 cm and 6 cm'
          alt: 'A 10 cm line in the ratio 2 : 3: five shares of 2 cm, giving parts of 4 cm and 6 cm.'
        check:
          prompt: 'A 12 cm line is divided in the ratio 1 : 2. How many equal shares is it cut into?'
          options:
          - '3'
          - '2'
          - '12'
          answer: '3'
          why: 1 + 2 = 3 shares, each 4 cm, so the parts are 4 cm and 8 cm.
        ways:
        - style: real_world
          teach: 'Sharing ₹10 between two children in the ratio 2 : 3 means making 5 equal shares of ₹2 and giving 2 shares to one, 3 to the other: ₹4 and ₹6. Cutting a line in a ratio is exactly the same, with centimetres instead of rupees.'
      - teach: 'With ruler and compass we can do it without measuring. From A draw a slanted line and mark 5 equal steps on it. Join the 5th mark to B. Then draw a line through the 2nd mark parallel to that join. Where it meets AB divides it in the ratio 2 : 3.'
        check:
          prompt: 'To divide AB in the ratio 3 : 1, how many equal steps do you mark on the slanted line?'
          options:
          - '4'
          - '3'
          - '1'
          answer: '4'
          why: 3 + 1 = 4 steps. The parallel goes through the 3rd mark.
        ways:
        - style: step_by_step
          teach: 'Step 1: add the ratio numbers, 2 + 3 = 5. Step 2: from A draw a slanted line and mark 5 equal steps with the compass. Step 3: join the last mark to B. Step 4: draw a line through mark 2 parallel to that join. Step 5: where it cuts AB is the point you want.'
      - teach: 'Why does it work? The parallel lines through the marks cut the slanted line into equal steps, so they cut AB in the same ratio: 2 steps to 3 steps.'
        check:
          prompt: 'Why is AB cut in the ratio 2 : 3 by this construction?'
          options:
          - Parallel lines cut every crossing line in the same ratio
          - Because we measured AB
          - Because the slanted line is 5 cm
          answer: Parallel lines cut every crossing line in the same ratio
          why: 'The slanted line is cut 2 : 3 by the parallel lines, so AB is cut 2 : 3 as well.'
        ways:
        - style: real_world
          teach: It's the notebook-lines idea again. The parallel lines through the marks cut the slanted line into equal steps. Parallel lines cut every line that crosses them in the same ratio, so AB gets cut 2 steps to 3 steps as well.
    items:
      - prompt: "A line 10 cm long is divided in the ratio 2 : 3. How long is the shorter part, in cm?"
        answer: "4"
        check: "10*2/5"
        difficulty: 1
        hints: ["2 : 3 means 5 equal shares.", "One share is 10 ÷ 5 = 2 cm."]
        solution: "Step 1: 2 + 3 = 5 shares. Step 2: One share is 2 cm. Step 3: The shorter part is 2 shares, 4 cm."
        mistakes: {"6": swapped_parts, "5": shares_not_added}
      - prompt: "A line 12 cm long is divided in the ratio 1 : 3. How long is the longer part, in cm?"
        answer: "9"
        check: "12*3/4"
        difficulty: 1
        hints: ["1 : 3 means 4 equal shares.", "One share is 3 cm."]
        solution: "Step 1: 1 + 3 = 4 shares. Step 2: One share is 3 cm. Step 3: The longer part is 3 shares, 9 cm."
        mistakes: {"3": swapped_parts, "4": shares_not_added}
      - prompt: "To divide a line in the ratio 3 : 4 with a slanted line, how many equal steps do you mark on the slanted line?"
        options: ["7", "4", "3", "12"]
        answer: "7"
        check: "3 + 4"
        difficulty: 1
        hints: ["One step for each share."]
        solution: "Step 1: 3 : 4 has 3 + 4 = 7 shares. Step 2: So mark 7 equal steps."
        mistakes: {"12": multiplied_ratio, "4": shares_not_added}
      - prompt: "A line 15 cm long is divided in the ratio 2 : 3. How long is the longer part, in cm?"
        answer: "9"
        check: "15*3/5"
        difficulty: 2
        hints: ["5 shares of 3 cm."]
        solution: "Step 1: 2 + 3 = 5 shares. Step 2: One share is 3 cm. Step 3: The longer part is 3 shares, 9 cm."
        mistakes: {"6": swapped_parts, "7.5": shares_not_added}
      - prompt: "To divide AB in the ratio 2 : 3, you mark 5 equal steps on a slanted line from A and join the 5th mark to B. Through which mark do you draw the parallel line?"
        options: ["The 2nd", "The 3rd", "The 5th", "The 1st"]
        answer: "The 2nd"
        difficulty: 2
        hints: ["The part next to A should be 2 shares."]
        solution: "Step 1: The part next to A is 2 of the 5 shares. Step 2: So draw the parallel through the 2nd mark."
        mistakes: {"The 3rd": ratio_order}
      - prompt: "A point divides a line in the ratio 3 : 5, and the longer part is 10 cm. How long is the whole line, in cm?"
        answer: "16"
        check: "(10/5)*(3 + 5)"
        difficulty: 3
        hints: ["The longer part is 5 shares.", "One share is 10 ÷ 5 = 2 cm."]
        solution: "Step 1: 5 shares = 10 cm, so one share is 2 cm. Step 2: The whole line is 8 shares. Step 3: 8 × 2 = 16 cm."
        mistakes: {"6": swapped_parts}
      - prompt: "A 1.5 m ribbon is cut in the ratio 2 : 1. How long is the longer piece, in metres?"
        answer: "1"
        check: "1.5*2/3"
        difficulty: 3
        hints: ["2 : 1 means 3 shares.", "One share is 0.5 m."]
        solution: "Step 1: 2 + 1 = 3 shares. Step 2: One share is 0.5 m. Step 3: The longer piece is 2 shares, 1 m."
        mistakes: {"0.5": swapped_parts, "0.75": shares_not_added}
      - prompt: "A 20 cm line is divided in the ratio 3 : 2. How long is the longer part, in cm?"
        answer: "12"
        check: "20*3/5"
        difficulty: 2
        hints: ["3 + 2 = 5 equal shares.", "Each share is 4 cm."]
        solution: "Step 1: 20 ÷ 5 = 4 cm per share. Step 2: Longer part = 3 × 4 = 12 cm."
        mistakes: {"8": swapped_parts, "6.67": shares_not_added}
      - prompt: "A point divides a line in the ratio 4 : 3. The difference between the two parts is 2 cm. How long is the whole line, in cm?"
        answer: "14"
        check: "2*7"
        difficulty: 3
        hints: ["The parts are 4k and 3k, so they differ by k.", "k = 2. The whole line is 7k."]
        solution: "Step 1: Parts are 4k and 3k; 4k − 3k = k = 2 cm. Step 2: Whole line = 7k = 14 cm."
        mistakes: {"8": swapped_parts, "2": shares_not_added}
      - prompt: "A 36 cm rod is cut into three pieces in the ratio 2 : 3 : 4. How long is the middle-sized piece, in cm?"
        answer: "12"
        check: "36*3/9"
        difficulty: 3
        hints: ["2 + 3 + 4 = 9 shares.", "Each share is 36 ÷ 9 = 4 cm."]
        solution: "Step 1: 9 shares, each 4 cm. Step 2: Middle piece = 3 × 4 = 12 cm."
        mistakes: {"16": swapped_parts, "8": swapped_parts}
      - prompt: 'A line 18 cm long is divided in the ratio 1 : 2. How long is the shorter part, in cm?'
        answer: '6'
        check: 18*1/3
        difficulty: 1
        hints:
        - '1 : 2 means 3 equal shares.'
        - Each share is 18 ÷ 3 cm.
        solution: 'Step 1: 1 + 2 = 3 shares. Step 2: Each share is 6 cm. Step 3: The shorter part is 1 share, 6 cm.'
        mistakes:
          '12': swapped_parts
          '9': shares_not_added
      - prompt: 'A line 14 cm long is divided in the ratio 3 : 4. How long is the longer part, in cm?'
        answer: '8'
        check: 14*4/7
        difficulty: 1
        hints:
        - How many shares are there in all?
        - 3 + 4 = 7 shares, each 2 cm.
        solution: 'Step 1: 7 shares in all. Step 2: Each share is 14 ÷ 7 = 2 cm. Step 3: The longer part is 4 × 2 = 8 cm.'
        mistakes:
          '6': swapped_parts
      - prompt: 'To divide AB in the ratio 4 : 3, you mark 7 equal steps from A and join the 7th mark to B. Through which mark do you draw the parallel?'
        options:
        - The 4th
        - The 3rd
        - The 7th
        - The 1st
        answer: The 4th
        difficulty: 2
        hints:
        - The first part from A gets the first number of the ratio.
        - How many steps belong to the part next to A?
        solution: 'Step 1: The part next to A gets 4 of the 7 shares. Step 2: So the parallel goes through the 4th mark. Step 3: It cuts AB into 4 : 3 from A.'
        mistakes:
          The 3rd: ratio_order
      - prompt: 'A 2.4 m plank is cut in the ratio 1 : 5. How long is the shorter piece, in metres? Decimals are fine.'
        answer: '0.4'
        check: 2.4/6
        difficulty: 2
        hints:
        - 1 + 5 = 6 shares.
        - Each share is 2.4 ÷ 6 m.
        solution: 'Step 1: 6 equal shares. Step 2: 2.4 ÷ 6 = 0.4 m per share. Step 3: The shorter piece is 1 share, 0.4 m.'
        mistakes:
          '2': swapped_parts
      - prompt: 'A point divides a line in the ratio 2 : 7, and the shorter part is 6 cm. How long is the whole line, in cm?'
        answer: '27'
        check: 6/2*9
        difficulty: 3
        hints:
        - The shorter part is 2 shares.
        - One share is 3 cm, and there are 9 shares.
        solution: 'Step 1: 2 shares = 6 cm, so 1 share = 3 cm. Step 2: The whole line is 2 + 7 = 9 shares. Step 3: 9 × 3 = 27 cm.'
        mistakes:
          '21': short_ratio_side
      - prompt: 'A 45 cm rod is cut into three pieces in the ratio 1 : 3 : 5. How long is the longest piece, in cm?'
        answer: '25'
        check: 45*5/9
        difficulty: 3
        hints:
        - Add all three numbers to find the shares.
        - 1 + 3 + 5 = 9 shares of 5 cm.
        solution: 'Step 1: 9 shares in all. Step 2: 45 ÷ 9 = 5 cm per share. Step 3: The longest piece is 5 × 5 = 25 cm.'
        mistakes:
          '5': swapped_parts
