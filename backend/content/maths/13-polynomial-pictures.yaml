# Class 9 Mathematics, chapter 13. Format: content/README.md.
# Also uses tips from earlier chapters: added_sides, sign_slip, forgot_divide.
subject: math
chapter: 13
title: Polynomial Pictures

tips:
  midpoint_other_end: "The midpoint is halfway, so the other end is as far again past the midpoint: B = 2 × midpoint − A in each coordinate."
  steady_rise: "Check the steepness between each pair of points. A straight line has the same slope everywhere."
  from_one_point: "Start from the point you know and move along the line: each step of 1 across changes y by the slope."
  swapped_coordinates: "Write the across number (x) first and the up-or-down number (y) second: (x, y)."
  forgot_constant: "Don't forget the number added at the end of the equation."
  y_intercept_not_x: "That is where the line crosses the y-axis (x = 0). On the x-axis y = 0, so solve for x."
  slope_not_intercept: "On the y-axis x = 0, so y is just the constant term."
  intercept_not_slope: "The slope is the number multiplying x. The constant term only says where the line crosses the y-axis."
  fits_one_point: "Check every point. An equation can fit one point and miss the others."
  run_over_rise: "Slope is the change in y divided by the change in x: up-or-down over across."
  distance_on_axis: "A point on the y-axis is straight above or below the origin, so its distance is just how far up or down it is. No squaring needed."

concepts:
  - code: math9.polypic.coordinates
    title: Points and coordinates
    notes: |
      A point in the plane is given by (x, y): x across from the origin (right positive) and y up
      (down negative). Points on the y-axis have x = 0; on the x-axis, y = 0. The distance between
      (x₁, y₁) and (x₂, y₂) is √((x₂ − x₁)² + (y₂ − y₁)²), from a right triangle. The midpoint is
      halfway in each coordinate.
    explanations:
      text: "Two number lines crossing at right angles make a grid. Any point is named by two numbers (x, y): first how far across, then how far up. (3, −2) is 3 to the right of the crossing point and 2 down. The distance from (0, 0) to (3, 4) is the longest side of a right triangle with sides 3 and 4: √(9 + 16) = 5."
      visual: "Picture a classroom seating chart: column number first, then row number. (3, 2) means column 3, row 2. Swapping them sends you to a different desk."
      step_by_step: "Distance from (1, 2) to (4, 6): Step 1: Across: 4 − 1 = 3. Step 2: Up: 6 − 2 = 4. Step 3: Distance = √(3² + 4²) = √25 = 5."
      real_world: "A city map with a grid lets you say 'the school is at (4, 6) and the library at (1, 2)'. Straight across country, they are 5 blocks apart, even though walking along the streets is 3 + 4 = 7 blocks."
    activity:
      type: graph
      mode: point
      range:
      - -6
      - 6
      prompt: Move the point. x goes left and right; y goes up and down.
      goals:
      - prompt: Put the point at (3, 2).
        x: 3
        y: 2
      - prompt: Now (−4, 1).
        x: -4
        y: 1
      - prompt: Now (0, −5).
        x: 0
        y: -5
    lesson:
      - teach: 'Draw two number lines crossing at 0: the x-axis across and the y-axis up. Their crossing point is the origin. Any point is named by two numbers (x, y): first how far across, then how far up. (3, −2) means 3 to the right and 2 down.'
        check:
          prompt: Which point is 4 to the left of the origin and 1 up?
          options:
          - (−4, 1)
          - (1, −4)
          - (4, 1)
          answer: (−4, 1)
          why: 'Across comes first: left is negative, so x = −4. Up 1 gives y = 1.'
        ways:
        - style: real_world
          teach: 'Finding a seat in a cinema: row first, then seat number. A point on a graph is found the same way, in a fixed order: first across (x), then up or down (y). (3, −2) means walk 3 steps right, then 2 steps down. Negative across means walk left.'
      - teach: Points on the y-axis have x = 0, like (0, 5). Points on the x-axis have y = 0, like (−3, 0). The distance from the origin to (0, 5) is just 5.
        check:
          prompt: On which axis is the point (7, 0)?
          options:
          - The x-axis
          - The y-axis
          - Neither
          answer: The x-axis
          why: y = 0 means it hasn't gone up or down, so it lies on the x-axis.
        ways:
        - style: step_by_step
          teach: 'Step 1: look at the first number. If it is 0, the point is not moved across at all, so it sits on the y-axis. Step 2: look at the second number. If it is 0, the point is not moved up or down, so it sits on the x-axis.'
      - teach: 'The distance between two points comes from a right triangle. From (1, 2) to (4, 6): 3 across and 4 up, so the distance is √(3² + 4²) = √25 = 5. The midpoint is halfway in each coordinate: between (2, 5) and (8, 1) it is ((2 + 8)/2, (5 + 1)/2) = (5, 3).'
        picture:
          kind: flow
          steps:
          - 'Across: 4 − 1 = 3'
          - 'Up: 6 − 2 = 4'
          - Distance = √(3² + 4²) = 5
          alt: 'The distance from (1, 2) to (4, 6) is the long side of a right triangle 3 across and 4 up: 5.'
        check:
          prompt: What is the distance from (0, 0) to (6, 8)?
          options:
          - '10'
          - '14'
          - '48'
          answer: '10'
          why: √(6² + 8²) = √100 = 10. Adding 6 + 8 would walk along the axes instead of straight.
        ways:
        - style: step_by_step
          teach: 'Step 1: find how far across the two points are: subtract the x''s. Step 2: find how far up: subtract the y''s. Step 3: these are the two short sides of a right triangle. Step 4: the distance is √(across² + up²). For the midpoint, average the x''s and average the y''s.'
    items:
      - prompt: "Which point is 3 to the right of the origin and 2 down?"
        options: ["(3, −2)", "(−2, 3)", "(3, 2)", "(−3, 2)"]
        answer: "(3, −2)"
        difficulty: 1
        hints: ["Across first, then up or down.", "Down is negative."]
        solution: "x = 3 (right) and y = −2 (down), so (3, −2)."
        mistakes: {"(−2, 3)": swapped_coordinates, "(3, 2)": sign_slip}
      - prompt: "On which axis does the point (0, −4) lie?"
        options: ["The y-axis", "The x-axis", "Neither axis", "Both axes"]
        answer: "The y-axis"
        difficulty: 1
        hints: ["x = 0 means no movement across."]
        solution: "x = 0, so the point is straight below the origin, on the y-axis."
        mistakes: {"The x-axis": swapped_coordinates}
      - prompt: "How far is the point (0, 5) from the origin?"
        answer: "5"
        check: "sqrt(0**2 + 5**2)"
        difficulty: 1
        hints: ["It is straight up from the origin."]
        solution: "(0, 5) is 5 straight up, so the distance is 5."
        mistakes: {"0": "distance_on_axis", "25": "distance_on_axis"}
      - prompt: "How far is the point (3, 4) from the origin?"
        answer: "5"
        check: "sqrt(3**2 + 4**2)"
        difficulty: 2
        hints: ["Right triangle with sides 3 and 4."]
        solution: "Step 1: √(3² + 4²) = √25. Step 2: = 5."
        mistakes: {"7": added_sides, "25": forgot_root}
      - prompt: "What is the distance between (1, 2) and (4, 6)?"
        answer: "5"
        check: "sqrt((4 - 1)**2 + (6 - 2)**2)"
        difficulty: 2
        hints: ["Across 3, up 4."]
        solution: "Step 1: Across 3, up 4. Step 2: √(9 + 16) = 5."
        mistakes: {"7": added_sides}
      - prompt: "What is the x-coordinate of the point halfway between (2, 5) and (8, 1)?"
        answer: "5"
        check: "(2 + 8)/2"
        difficulty: 3
        hints: ["Halfway across: (2 + 8) ÷ 2."]
        solution: "(2 + 8) ÷ 2 = 5, so the midpoint is (5, 3)."
        mistakes: {"3": swapped_coordinates}
      - prompt: "What is the distance between the points (−2, 3) and (4, −5)?"
        answer: "10"
        check: "sqrt((4+2)**2 + (-5-3)**2)"
        difficulty: 3
        hints: ["Across: from −2 to 4. Up or down: from 3 to −5.", "Use the right-triangle rule on those two changes."]
        solution: "Step 1: Change in x = 4 − (−2) = 6. Step 2: Change in y = −5 − 3 = −8. Step 3: Distance = √(36 + 64) = 10."
        mistakes: {"14": added_sides, "100": forgot_root}
      - prompt: "The midpoint of AB is (3, 4) and A is (1, 0). Where is B?"
        options: ["(5, 8)", "(2, 2)", "(8, 5)", "(4, 4)"]
        answer: "(5, 8)"
        difficulty: 3
        hints: ["From A to the midpoint, x goes up 2 and y goes up 4.", "Go the same again past the midpoint."]
        solution: "Step 1: A to midpoint: x + 2, y + 4. Step 2: Midpoint to B: the same again, so B = (3 + 2, 4 + 4) = (5, 8)."
        mistakes: {"(2, 2)": midpoint_other_end, "(8, 5)": swapped_coordinates, "(4, 4)": midpoint_other_end}
      - prompt: "A triangle has corners at (0, 0), (4, 0) and (0, 3). What is its perimeter?"
        answer: "12"
        check: "4 + 3 + sqrt(4**2 + 3**2)"
        difficulty: 2
        hints: ["Two sides lie along the axes.", "The third side is the slanting one: use the right-triangle rule."]
        solution: "Step 1: Sides along the axes are 4 and 3. Step 2: The slanting side is √(16 + 9) = 5. Step 3: Perimeter = 4 + 3 + 5 = 12."
        mistakes: {"14": added_sides, "7": diagonal_as_side, "6": area_not_perimeter}
      - prompt: Which point is 5 to the left of the origin and 3 down?
        options:
        - (−5, −3)
        - (−3, −5)
        - (5, −3)
        - (−5, 3)
        answer: (−5, −3)
        difficulty: 1
        hints:
        - The x-coordinate comes first.
        - Left and down are both negative.
        solution: 'Step 1: 5 left gives x = −5. Step 2: 3 down gives y = −3. Step 3: So (−5, −3).'
        mistakes:
          (−3, −5): swapped_coordinates
      - prompt: How far is the point (−6, 0) from the origin?
        answer: '6'
        check: '6'
        difficulty: 1
        hints:
        - The point is on the x-axis.
        - Distance is never negative.
        solution: 'Step 1: (−6, 0) is on the x-axis. Step 2: It is 6 steps left of the origin. Step 3: So the distance is 6.'
        mistakes:
          '-6': distance_on_axis
      - prompt: How far is the point (5, 12) from the origin?
        answer: '13'
        check: sqrt(5**2 + 12**2)
        difficulty: 2
        hints:
        - 'Use a right triangle: 5 across and 12 up.'
        - √(25 + 144).
        solution: 'Step 1: 5² + 12² = 25 + 144 = 169. Step 2: √169 = 13. Step 3: So the distance is 13.'
        mistakes:
          '17': distance_on_axis
      - prompt: What is the midpoint of (−4, 2) and (6, 8)?
        options:
        - (1, 5)
        - (5, 3)
        - (2, 10)
        - (5, 1)
        answer: (1, 5)
        difficulty: 2
        hints:
        - Average the x-coordinates, then the y-coordinates.
        - (−4 + 6) ÷ 2 and (2 + 8) ÷ 2.
        solution: 'Step 1: x = (−4 + 6) ÷ 2 = 1. Step 2: y = (2 + 8) ÷ 2 = 5. Step 3: Midpoint (1, 5).'
        mistakes:
          (5, 1): swapped_coordinates
          (5, 3): midpoint_other_end
      - prompt: What is the distance between (−1, −1) and (5, 7)?
        answer: '10'
        check: sqrt(6**2 + 8**2)
        difficulty: 3
        hints:
        - 'Across: 5 − (−1) = 6.'
        - 'Up: 7 − (−1) = 8.'
        solution: 'Step 1: Across 6, up 8. Step 2: 6² + 8² = 100. Step 3: √100 = 10.'
        mistakes:
          '14': distance_on_axis
      - prompt: A rectangle has corners at (1, 1), (7, 1), (7, 5) and (1, 5). How long is its diagonal?
        options:
        - √52
        - '10'
        - √20
        - '52'
        answer: √52
        check: sqrt(6**2 + 4**2)
        difficulty: 3
        hints:
        - The sides are 6 and 4.
        - √(36 + 16).
        solution: 'Step 1: Width 7 − 1 = 6, height 5 − 1 = 4. Step 2: Diagonal² = 36 + 16 = 52. Step 3: Diagonal = √52 = 2√13, about 7.2.'
        mistakes:
          '10': distance_on_axis
          '52': distance_on_axis

  - code: math9.polypic.lines
    title: Lines from equations
    after: [math9.polypic.coordinates]
    notes: |
      The points (x, y) that satisfy y = ax + b lie on a straight line: this is the picture of the
      first-degree polynomial ax + b. It crosses the y-axis at (0, b) and the x-axis where ax + b = 0.
      A point is on the line if its coordinates make the equation true.
    explanations:
      text: "For y = 2x + 1, pick values of x and work out y: x = 0 gives 1, x = 1 gives 3, x = 2 gives 5. Plot (0, 1), (1, 3) and (2, 5): they lie on a straight line. Every point on that line fits the equation, and every point that fits is on the line."
      visual: "Make a table with x on top (0, 1, 2, 3) and y below (1, 3, 5, 7). Each column is a dot on the grid. Join the dots with a ruler: a straight line climbing 2 squares for every 1 across."
      step_by_step: "Where does y = 2x − 6 cross the x-axis? Step 1: On the x-axis, y = 0. Step 2: 0 = 2x − 6. Step 3: 2x = 6. Step 4: x = 3, so the point is (3, 0)."
      real_world: "A taxi charges ₹50 to start and ₹15 per km: y = 15x + 50. Plotting it gives a straight line starting at ₹50 when x = 0, which the driver can use to read off any fare."
    picture:
      kind: geometry
      axes: true
      range: [-1, 8]
      points:
        (0, 1): [0, 1]
        (1, 3): [1, 3]
        (2, 5): [2, 5]
        (3, 7): [3, 7]
      segments:
      - ['(0, 1)', '(3, 7)', y = 2x + 1]
      caption: 'Each pair from the table is a point. They all lie on one straight line: y = 2x + 1.'
      alt: Axes with the points (0, 1), (1, 3), (2, 5) and (3, 7) joined by the straight line y = 2x + 1.
    activity:
      type: graph
      mode: line
      range:
      - -6
      - 6
      m_step: 0.5
      prompt: Every straight line is y = mx + c. Tilt it with Tilt up / Tilt down, and slide it with Up / Down.
      goals:
      - prompt: Make the line go through both green points.
        through:
        - - 0
          - 1
        - - 2
          - 5
        mistakes:
        - when:
            m: 4
            c: 1
          say: 'This line is too steep: from (0, 1), going 2 across takes it up 8, to (2, 9).'
        - when:
            m: 2
            c: 5
          say: This line crosses the y-axis at 5. The first point, (0, 1), is on the y-axis, so the line must cross it at 1.
      - prompt: Now through (0, −2) and (4, 0).
        through:
        - - 0
          - -2
        - - 4
          - 0
        mistakes:
        - when:
            m: 2
            c: -2
          say: 'Too steep: from (0, −2), going 4 across takes it up 8, not 2.'
    lesson:
      - teach: 'Take y = 2x + 1 and work out a few points: x = 0 gives y = 1, x = 1 gives 3, x = 2 gives 5. Plot (0, 1), (1, 3), (2, 5): they lie on one straight line. Every first-degree polynomial ax + b draws a straight line like this.'
        picture:
          kind: flow
          steps:
          - x = 0 → y = 1
          - x = 1 → y = 3
          - x = 2 → y = 5
          - All on one straight line
          alt: 'Points of y = 2x + 1: (0, 1), (1, 3) and (2, 5) lie on a straight line.'
        check:
          prompt: On y = 2x + 1, what is y when x = 4?
          options:
          - '9'
          - '7'
          - '8'
          answer: '9'
          why: 2 × 4 + 1 = 9, so (4, 9) is on the line.
        ways:
        - style: step_by_step
          teach: 'Step 1: make a small table with x = 0, 1, 2. Step 2: put each x into y = 2x + 1 to get y: 1, 3, 5. Step 3: plot the points (0, 1), (1, 3), (2, 5). Step 4: join them with a ruler. They line up, because ax + b always draws a straight line.'
      - teach: A point is on the line if its coordinates make the equation true. Is (2, 4) on y = 3x − 2? 3 × 2 − 2 = 4. Yes. Is (1, 3) on it? 3 × 1 − 2 = 1, not 3. No.
        check:
          prompt: Is (3, 5) on the line y = x + 2?
          options:
          - 'Yes'
          - 'No'
          answer: 'Yes'
          why: 3 + 2 = 5, which is the point's y, so it fits.
        ways:
        - style: step_by_step
          teach: 'Step 1: take the point''s x and put it into the equation. Step 2: work out y. Step 3: compare with the point''s own y. Same number: the point is on the line. Different: it is not.'
      - teach: 'The line y = ax + b crosses the y-axis where x = 0, so at y = b. It crosses the x-axis where y = 0, so where ax + b = 0. For y = 2x − 6: the y-axis at −6, and the x-axis at x = 3.'
        check:
          prompt: Where does y = 4x − 8 cross the x-axis?
          options:
          - x = 2
          - x = −8
          - x = 4
          answer: x = 2
          why: 4x − 8 = 0 gives x = 2. It crosses the y-axis at −8.
        ways:
        - style: step_by_step
          teach: 'Step 1: for the y-axis crossing, put x = 0: y = b. Step 2: for the x-axis crossing, put y = 0 and solve ax + b = 0. For y = 2x − 6: y-axis at −6; 2x − 6 = 0 gives x = 3.'
    items:
      - prompt: "On the line y = 2x + 1, what is y when x = 3?"
        answer: "7"
        check: "2*3 + 1"
        difficulty: 1
        hints: ["Put 3 in place of x."]
        solution: "y = 2 × 3 + 1 = 7"
        mistakes: {"6": forgot_constant, "5": times_not_plus}
      - prompt: "Which point lies on the line y = 3x − 2?"
        options: ["(2, 4)", "(4, 2)", "(1, 2)", "(0, 2)"]
        answer: "(2, 4)"
        difficulty: 1
        hints: ["Put each x into 3x − 2 and see if you get the y."]
        solution: "Step 1: For x = 2: 3 × 2 − 2 = 4, which matches. Step 2: The others don't fit."
        mistakes: {"(4, 2)": swapped_coordinates, "(0, 2)": sign_slip}
      - prompt: "Where does the line y = 5x + 4 cross the y-axis? Give the y value."
        answer: "4"
        check: "5*0 + 4"
        difficulty: 2
        hints: ["On the y-axis, x = 0."]
        solution: "With x = 0, y = 4, so the line crosses at (0, 4)."
        mistakes: {"5": slope_not_intercept}
      - prompt: "Where does the line y = 2x − 6 cross the x-axis? Give the x value."
        answer: "3"
        check: "6/2"
        difficulty: 2
        hints: ["On the x-axis, y = 0.", "0 = 2x − 6."]
        solution: "Step 1: 2x − 6 = 0. Step 2: 2x = 6. Step 3: x = 3."
        mistakes: {"-6": y_intercept_not_x, "-3": sign_slip}
      - prompt: "The line y = ax + 1 passes through the point (2, 7). What is a?"
        answer: "3"
        check: "(7 - 1)/2"
        difficulty: 3
        hints: ["7 = a × 2 + 1."]
        solution: "Step 1: 7 = 2a + 1. Step 2: 2a = 6. Step 3: a = 3."
        mistakes: {"6": forgot_divide}
      - prompt: "The points (1, 3), (2, 5) and (3, 7) lie on one straight line. Which is its equation?"
        options: ["y = 2x + 1", "y = x + 2", "y = 3x", "y = 2x + 3"]
        answer: "y = 2x + 1"
        difficulty: 3
        hints: ["y goes up 2 each time x goes up 1.", "Check all three points."]
        solution: "Step 1: y goes up 2 for each 1 across, so y = 2x + something. Step 2: (1, 3): 3 = 2 + 1. Step 3: y = 2x + 1, and (2, 5), (3, 7) fit too."
        mistakes: {"y = x + 2": fits_one_point, "y = 3x": fits_one_point}
      - prompt: "Where do the lines y = 2x + 1 and y = −x + 7 meet? Give the x value."
        answer: "2"
        check: "(7-1)/3"
        difficulty: 3
        hints: ["At the meeting point both lines have the same y.", "2x + 1 = −x + 7."]
        solution: "Step 1: 2x + 1 = −x + 7. Step 2: 3x = 6. Step 3: x = 2 (and y = 5)."
        mistakes: {"6": forgot_divide, "8/3": wrong_inverse}
      - prompt: "The line y = 3x + b passes through the point (2, 1). What is b?"
        answer: "-5"
        check: "1 - 3*2"
        difficulty: 2
        hints: ["Put x = 2 and y = 1 into the equation.", "1 = 6 + b."]
        solution: "Step 1: 1 = 3 × 2 + b. Step 2: b = 1 − 6 = −5."
        mistakes: {"5": sign_slip, "7": wrong_inverse, "-4": times_not_plus}
      - prompt: "A line crosses the y-axis at 4 and the x-axis at 2. Which is its equation?"
        options: ["y = −2x + 4", "y = 2x + 4", "y = 4x + 2", "y = −x + 4"]
        answer: "y = −2x + 4"
        difficulty: 3
        hints: ["Crossing the y-axis at 4 gives the constant term.", "From (0, 4) to (2, 0): how much does y change for each 1 across?"]
        solution: "Step 1: b = 4. Step 2: Slope = (0 − 4) ÷ (2 − 0) = −2. Step 3: y = −2x + 4."
        mistakes: {"y = 2x + 4": sign_slip, "y = 4x + 2": slope_not_intercept, "y = −x + 4": fits_one_point}
      - prompt: On the line y = 3x − 1, what is y when x = 2?
        answer: '5'
        check: 3*2 - 1
        difficulty: 1
        hints:
        - Put 2 in place of x.
        - 3 × 2 − 1.
        solution: 'Step 1: y = 3 × 2 − 1. Step 2: = 6 − 1. Step 3: = 5.'
        mistakes:
          '6': forgot_constant
      - prompt: Which point lies on the line y = 2x + 3?
        options:
        - (1, 5)
        - (5, 1)
        - (1, 3)
        - (2, 5)
        answer: (1, 5)
        difficulty: 1
        hints:
        - 'Try each point: does 2x + 3 give its y?'
        - 'For (1, 5): 2 × 1 + 3.'
        solution: 'Step 1: For x = 1, y = 2 + 3 = 5. Step 2: So (1, 5) is on the line. Step 3: (2, 5) is not: 2 × 2 + 3 = 7.'
        mistakes:
          (5, 1): swapped_coordinates
          (1, 3): y_intercept_not_x
      - prompt: Where does the line y = −3x + 9 cross the x-axis? Give the x value.
        answer: '3'
        check: 9/3
        difficulty: 2
        hints:
        - On the x-axis, y = 0.
        - −3x + 9 = 0.
        solution: 'Step 1: −3x + 9 = 0. Step 2: 3x = 9. Step 3: x = 3.'
        mistakes:
          '9': y_intercept_not_x
          '-3': slope_not_intercept
      - prompt: The line y = ax − 4 passes through (3, 8). What is a?
        answer: '4'
        check: (8 + 4)/3
        difficulty: 2
        hints:
        - Put x = 3 and y = 8 into the equation.
        - 8 = 3a − 4.
        solution: 'Step 1: 8 = 3a − 4. Step 2: 3a = 12. Step 3: a = 4.'
        mistakes:
          '1.333': forgot_constant
      - prompt: Where do the lines y = x + 4 and y = 3x meet? Give the x value.
        answer: '2'
        check: 4/2
        difficulty: 3
        hints:
        - Where they meet, both give the same y.
        - x + 4 = 3x.
        solution: 'Step 1: x + 4 = 3x. Step 2: 4 = 2x. Step 3: x = 2, and y = 6.'
        mistakes:
          '6': swapped_coordinates
      - prompt: The points (0, 2), (1, 5) and (2, 8) lie on one line. Which is its equation?
        options:
        - y = 3x + 2
        - y = 2x + 3
        - y = 3x + 5
        - y = x + 2
        answer: y = 3x + 2
        difficulty: 3
        hints:
        - 'At x = 0, y = 2: that gives b.'
        - y goes up 3 for each 1 across.
        solution: 'Step 1: At x = 0, y = 2, so b = 2. Step 2: Each step across adds 3, so a = 3. Step 3: y = 3x + 2; check (2, 8): 6 + 2 = 8.'
        mistakes:
          y = 2x + 3: intercept_not_slope
          y = x + 2: fits_one_point

  - code: math9.polypic.slope
    title: Steepness of a line
    after: [math9.polypic.lines]
    notes: |
      The slope of a line is change in y ÷ change in x between any two of its points. For y = ax + b
      the slope is a: y goes up a for every 1 across. A bigger slope is steeper; a negative slope goes
      downhill. Slope is a rate: rupees per km, litres per minute.
    explanations:
      text: "The slope says how steep a line is: how far it goes up for each step across. Between (1, 2) and (3, 8), it goes up 6 while going across 2, so the slope is 6 ÷ 2 = 3. In y = ax + b, the slope is a, the number multiplying x."
      visual: "Draw a staircase under the line, each step 1 square across. On y = 3x, each step rises 3 squares; on y = x, just 1. The taller the steps, the steeper the line."
      step_by_step: "Slope of the line through (0, 5) and (2, 1): Step 1: Change in y: 1 − 5 = −4. Step 2: Change in x: 2 − 0 = 2. Step 3: Slope = −4 ÷ 2 = −2. The line goes down."
      real_world: "A tank fills steadily: 30 litres after 2 minutes, 75 after 5. The rate is (75 − 30) ÷ (5 − 2) = 15 litres per minute. That rate is the slope of the line on a graph of litres against minutes."
    activity:
      type: graph
      mode: line
      range:
      - -6
      - 6
      m_step: 0.5
      prompt: The slope m tells how much y changes when x goes up by 1.
      goals:
      - prompt: Make a line with slope 2 that crosses the y-axis at −1.
        m: 2
        c: -1
        mistakes:
        - when:
            m: -1
            c: 2
          say: 'You swapped them: this line has slope −1 and crosses at 2. In y = mx + c, m is the slope and c is where it crosses the y-axis.'
      - prompt: 'Make a line going down: slope −1, through (0, 3).'
        m: -1
        c: 3
        mistakes:
        - when:
            m: 1
            c: 3
          say: Slope 1 goes up as you move right. Going down means a negative slope.
    lesson:
      - teach: 'Some lines are steeper than others. The slope measures steepness: how much y changes for each 1 step across. Between two points, slope = change in y ÷ change in x. From (1, 2) to (3, 8): y goes up 6 while x goes 2, so the slope is 3.'
        check:
          prompt: From (0, 1) to (2, 5), what is the slope?
          options:
          - '2'
          - '4'
          - 1/2
          answer: '2'
          why: 'y changes by 4 and x by 2: 4 ÷ 2 = 2. 1/2 would be across ÷ up, upside down.'
        ways:
        - style: real_world
          teach: 'Climbing a staircase: a steep one rises a lot for each step forward, a gentle one rises a little. Slope is that rise for each 1 step across. Between two points: how much you went up, divided by how far you went across.'
      - teach: 'For y = ax + b, the slope is a: each step across adds a to y. y = 5x + 1 is steeper than y = 2x + 7. A negative slope means the line goes downhill: y = −2x + 5 drops 2 for each step across.'
        check:
          prompt: Which line goes downhill from left to right?
          options:
          - y = −x + 4
          - y = x − 4
          - y = 4x
          answer: y = −x + 4
          why: 'Its slope is −1: y gets smaller as x gets bigger.'
        ways:
        - style: real_world
          teach: 'In y = ax + b, a is how much y grows each time x grows by 1, so a is the steepness. y = 5x climbs 5 per step, steeper than y = 2x. A negative a is like walking downhill: each step forward takes you lower.'
      - teach: 'Slope is a rate in real life. A taxi fare y = 15x + 50 (x in km) goes up ₹15 for every km: the slope is 15 rupees per km, and 50 is the fixed starting charge. If points are on one line, the slope between any two of them is the same.'
        check:
          prompt: A plant is 4 cm tall on day 0 and grows steadily to 10 cm on day 3. How many cm does it grow each day?
          options:
          - '2'
          - '3'
          - '6'
          answer: '2'
          why: (10 − 4) ÷ 3 = 2 cm per day.
        ways:
        - style: real_world
          teach: 'An autorickshaw fare: ₹50 to start plus ₹15 for every km. The fare line goes up ₹15 per km: that ₹15 is the slope, and the ₹50 is where the line starts. A steady change like a plant growing the same amount each day is also a slope.'
    items:
      - prompt: "What is the slope of the line y = 4x − 3?"
        answer: "4"
        check: "Poly(4*x - 3, x).coeff_monomial(x)"
        difficulty: 1
        hints: ["The slope is the number multiplying x."]
        solution: "In y = ax + b the slope is a, so it is 4."
        mistakes: {"-3": intercept_not_slope}
      - prompt: "What is the slope of the line through (1, 2) and (3, 8)?"
        answer: "3"
        check: "(8 - 2)/(3 - 1)"
        difficulty: 2
        hints: ["Change in y ÷ change in x."]
        solution: "Step 1: Up 6. Step 2: Across 2. Step 3: 6 ÷ 2 = 3."
        mistakes: {"1/3": run_over_rise}
      - prompt: "What is the slope of the line through (0, 5) and (2, 1)?"
        answer: "-2"
        check: "(1 - 5)/(2 - 0)"
        difficulty: 2
        hints: ["y goes from 5 down to 1."]
        solution: "Step 1: Change in y = 1 − 5 = −4. Step 2: Change in x = 2. Step 3: Slope = −2."
        mistakes: {"2": sign_slip, "-1/2": run_over_rise}
      - prompt: "Which of these lines is steepest?"
        options: ["y = 5x + 1", "y = 2x + 9", "y = x − 4", "y = 3x"]
        answer: "y = 5x + 1"
        difficulty: 2
        hints: ["Compare the numbers multiplying x."]
        solution: "The slopes are 5, 2, 1 and 3. The biggest is 5, so y = 5x + 1 is steepest."
        mistakes: {"y = 2x + 9": intercept_not_slope}
      - prompt: "A taxi fare is y = 15x + 50 rupees for a ride of x km. By how many rupees does the fare go up for each extra km?"
        answer: "15"
        check: "(15*2 + 50) - (15*1 + 50)"
        difficulty: 3
        hints: ["Compare the fare for 1 km and for 2 km."]
        solution: "Step 1: 1 km: ₹65. Step 2: 2 km: ₹80. Step 3: ₹15 more per km, the slope."
        mistakes: {"50": intercept_not_slope, "65": forgot_constant}
      - prompt: "A tank fills at a steady rate. After 2 minutes it holds 30 litres, and after 5 minutes 75 litres. How many litres flow in per minute?"
        answer: "15"
        check: "(75 - 30)/(5 - 2)"
        difficulty: 3
        hints: ["In 3 minutes, 45 litres flowed in."]
        solution: "Step 1: 75 − 30 = 45 litres. Step 2: 5 − 2 = 3 minutes. Step 3: 45 ÷ 3 = 15 litres per minute."
        mistakes: {"1/15": run_over_rise, "45": forgot_divide}
      - prompt: "Do the points (0, 1), (2, 5) and (5, 12) lie on one straight line?"
        options: ["No: the steepness changes", "Yes: y goes up every time", "Yes: all the coordinates are positive"]
        answer: "No: the steepness changes"
        difficulty: 3
        hints: ["Find the slope from the first point to the second.", "Then from the second to the third. Are they equal?"]
        solution: "Step 1: Slope from (0, 1) to (2, 5) = 4 ÷ 2 = 2. Step 2: Slope from (2, 5) to (5, 12) = 7 ÷ 3. Step 3: The slopes differ, so the points are not on one straight line."
        mistakes: {"Yes: y goes up every time": steady_rise, "Yes: all the coordinates are positive": steady_rise}
      - prompt: "A line has a slope of 3 and passes through (1, 2). What is y on this line when x = 4?"
        answer: "11"
        check: "2 + 3*(4-1)"
        difficulty: 3
        hints: ["From x = 1 to x = 4 is 3 steps across.", "Each step across raises y by 3."]
        solution: "Step 1: x goes up 3. Step 2: y goes up 3 × 3 = 9. Step 3: y = 2 + 9 = 11."
        mistakes: {"14": from_one_point, "12": from_one_point, "9": forgot_constant}
      - prompt: "A phone plan costs ₹199 for 10 GB and ₹319 for 25 GB, and the cost rises steadily with the data. How many rupees does each extra GB cost?"
        answer: "8"
        check: "(319-199)/(25-10)"
        difficulty: 2
        hints: ["How much more money, for how many more GB?", "Slope = change in cost ÷ change in GB."]
        solution: "Step 1: Extra cost = 319 − 199 = ₹120. Step 2: Extra data = 15 GB. Step 3: 120 ÷ 15 = ₹8 per GB."
        mistakes: {"120": forgot_divide, "0.125": run_over_rise}
      - prompt: What is the slope of the line y = −5x + 2?
        answer: '-5'
        check: '-5'
        difficulty: 1
        hints:
        - In y = ax + b, the slope is a.
        - Keep the sign.
        solution: 'Step 1: The number in front of x is −5. Step 2: That is the slope. Step 3: So −5: the line goes downhill.'
        mistakes:
          '2': intercept_not_slope
          '5': slope_not_intercept
      - prompt: What is the slope of the line through (2, 3) and (6, 11)?
        answer: '2'
        check: (11 - 3)/(6 - 2)
        difficulty: 1
        hints:
        - Slope = change in y ÷ change in x.
        - 8 ÷ 4.
        solution: 'Step 1: Change in y = 11 − 3 = 8. Step 2: Change in x = 6 − 2 = 4. Step 3: 8 ÷ 4 = 2.'
        mistakes:
          '0.5': run_over_rise
      - prompt: What is the slope of the line through (−1, 4) and (3, −4)?
        answer: '-2'
        check: (-4 - 4)/(3 - (-1))
        difficulty: 2
        hints:
        - Change in y = −4 − 4.
        - Change in x = 3 − (−1) = 4.
        solution: 'Step 1: Change in y = −8. Step 2: Change in x = 4. Step 3: −8 ÷ 4 = −2.'
        mistakes:
          '2': steady_rise
      - prompt: Which of these lines is least steep?
        options:
        - y = 0.5x + 9
        - y = 2x
        - y = 3x − 1
        - y = x + 9
        answer: y = 0.5x + 9
        difficulty: 2
        hints:
        - Steepness is the number in front of x.
        - Ignore the number added at the end.
        solution: 'Step 1: The slopes are 0.5, 2, 3 and 1. Step 2: The smallest is 0.5. Step 3: So y = 0.5x + 9 is least steep.'
        mistakes:
          y = x + 9: intercept_not_slope
      - prompt: An auto fare is ₹30 for the first km and rises steadily to ₹90 for 5 km. How many rupees does each km after the first cost?
        answer: '15'
        check: (90 - 30)/(5 - 1)
        difficulty: 3
        hints:
        - Slope = change in fare ÷ change in km.
        - From 1 km to 5 km is 4 km.
        solution: 'Step 1: Fare goes up 90 − 30 = 60. Step 2: Distance goes up 5 − 1 = 4 km. Step 3: 60 ÷ 4 = ₹15 per km.'
        mistakes:
          '18': from_one_point
          '12': from_one_point
      - prompt: A line has slope −2 and passes through (1, 7). What is y when x = 4?
        answer: '1'
        check: 7 + (-2)*(4 - 1)
        difficulty: 3
        hints:
        - From x = 1 to x = 4 is 3 steps across.
        - Each step changes y by −2.
        solution: 'Step 1: 3 steps across. Step 2: y changes by 3 × (−2) = −6. Step 3: y = 7 − 6 = 1.'
        mistakes:
          '13': steady_rise
          '-1': from_one_point
