# Class 9 Mathematics, chapter 1. Format: content/README.md.
subject: math
chapter: 1
title: Pairs of Equations

tips:
  forgot_divide: "That is the total for more than one of the unknown. Divide by how many there are to get just one."
  swapped_unknowns: "That is the other unknown. Read again which one the question asks for."
  difference_as_number: "The difference is how far apart the two numbers are, not one of the numbers."
  subtract_when_opposite: "When the same unknown has opposite signs, like +4y and −4y, adding makes it cancel. Subtracting would double it."
  only_one_side: "Multiply every term of the equation, on both sides of the = sign, or it stops being true."
  perimeter_half: "The perimeter is 2 × (length + breadth), so length + breadth is half the perimeter."
  digits_reversed: "That is the number with its digits reversed. Check which of the two is bigger."
  angle_sum_180: "The two acute angles of a right triangle add up to 90°, because the right angle takes the other 90°."
  match_coefficient: "To remove x, the x terms in both equations must match. Look at the x term in the second equation: what do you multiply the first equation's x by to get it?"
  add_when_same: When an unknown has the same sign in both equations, like 5x and 5x, adding doubles it. Taking one equation from the other makes it cancel.
  match_coefficient_y: 'To remove y, the y terms in both equations must match. Look at the y term in the second equation: what do you multiply the first equation''s y by to get it?'

concepts:
  - code: math9.pairs.sum_difference
    title: Two numbers from their sum and difference
    notes: |
      If x + y = s and x − y = d, adding the equations gives 2x = s + d, so x = (s + d) / 2.
      Subtracting gives 2y = s − d, so y = (s − d) / 2. The chapter opens with problems like
      "the sum of two numbers is 34 and their difference is 10".
    explanations:
      text: "If two numbers add up to 34 and one is 10 more than the other, take the extra 10 away first. The 24 that is left is two equal smaller numbers, so the smaller number is 12 and the bigger is 22. In letters: x + y = 34 and x − y = 10. Adding the two equations gives 2x = 44, so x = 22, and y = 34 − 22 = 12."
      visual: "Draw two strips of paper for the two numbers. The long strip is 10 longer than the short one, and together they measure 34. Cut the extra 10 off the long strip: two equal short strips are left, measuring 24, so each is 12. Stick the 10 back on: the long strip is 22."
      step_by_step: "Step 1: Write the sum as x + y = 34 and the difference as x − y = 10. Step 2: Add the equations. +y and −y cancel, leaving 2x = 44. Step 3: Divide by 2, so x = 22. Step 4: Put x into the sum: 22 + y = 34, so y = 12. Step 5: Check the difference: 22 − 12 = 10."
      real_world: "Anu and her brother have ₹50 together, and Anu has ₹14 more. Keep Anu's extra ₹14 aside. The ₹36 left is shared equally, so her brother has ₹18 and Anu has ₹18 + ₹14 = ₹32."
    picture:
      kind: flow
      steps: ['Sum 34, difference 10', 'Cut the extra 10 off the longer strip: 34 − 10 = 24', 'Now two equal strips: 24 ÷ 2 = 12, the smaller number', The larger is 12 + 10 = 22]
      alt: 'Finding two numbers with sum 34 and difference 10: remove the 10, halve 24 to get 12, and add 10 back to get 22.'
    activity:
      type: formula
      prompt: Two numbers x and y. Change them and watch their sum and difference.
      inputs:
      - name: x
        label: x
        min: 0
        max: 20
        step: 1
        start: 0
      - name: y
        label: y
        min: 0
        max: 20
        step: 1
        start: 0
      outputs:
      - name: s
        label: x + y
        expr: x+y
      - name: d
        label: x − y
        expr: x-y
      goals:
      - prompt: Find two numbers whose sum is 20 and difference is 6.
        want:
          s: 20
          d: 6
        hint: Add the sum and the difference together. What do you get, in terms of x?
        mistakes:
        - when:
            d: -6
          say: 'Your difference is −6, so y is the bigger number. The question wants x − y = 6: x has to be the bigger one.'
        - when:
            s: 20
          say: The sum is 20, but the difference isn't 6. Many pairs add to 20 (10 and 10, 12 and 8, …); only one pair is also 6 apart.
      - prompt: Now sum 15, difference 3.
        want:
          s: 15
          d: 3
        mistakes:
        - when:
            d: -3
          say: Your difference is −3, so y is the bigger number. For x − y = 3, x has to be the bigger one.
        - when:
            s: 15
          say: The sum is 15, but the two numbers aren't 3 apart yet.
    lesson:
      - teach: 'Two numbers are hidden, but we know two facts about them: what they add up to (their sum) and how far apart they are (their difference). For example: two numbers add up to 34, and one is 10 more than the other. Either fact alone fits many pairs. Together they fix both numbers.'
        check:
          prompt: Two numbers are 9 and 5. What is their difference?
          options:
          - '4'
          - '14'
          - '45'
          answer: '4'
          why: 'The difference is how far apart they are: 9 − 5 = 4. Adding them gives the sum, 14.'
      - teach: 'Think of the numbers as two strips of paper. The long strip is 10 longer, and together they measure 34. Cut the extra 10 off the long strip. What is left, 34 − 10 = 24, is two equal short strips, so each is 12. That is the smaller number. Stick the 10 back on: the bigger number is 22.'
        picture:
          kind: flow
          steps:
          - Sum 34, difference 10
          - 'Cut off the extra 10: 34 − 10 = 24'
          - 'Two equal strips: 24 ÷ 2 = 12'
          - 'Bigger number: 12 + 10 = 22'
          alt: Remove the difference 10 from the sum 34, halve the 24 that is left to get 12, then add 10 back to get 22.
        check:
          prompt: Sum 20, difference 6. After cutting off the extra 6, how much is left to share equally?
          options:
          - '14'
          - '26'
          - '7'
          answer: '14'
          why: 20 − 6 = 14. That 14 is two equal smaller numbers, so the smaller is 7 and the bigger is 13.
      - teach: 'In letters, call the bigger number x and the smaller y. The facts are x + y = 34 and x − y = 10. Add the two equations: +y and −y cancel, leaving 2x = 44, so x = 22. Then y = 34 − 22 = 12.'
        check:
          prompt: x + y = 16 and x − y = 4. Adding the two equations gives what?
          options:
          - 2x = 20
          - 2y = 12
          - x = 20
          answer: 2x = 20
          why: x + x = 2x, y − y = 0 and 16 + 4 = 20. So 2x = 20, and x = 10.
      - teach: 'Always check your pair against both facts: 22 + 12 = 34 and 22 − 12 = 10. Two slips to watch: stopping at 2x = 44 and forgetting to halve, and giving the smaller number when the question asked for the bigger.'
        check:
          prompt: Someone says the two numbers with sum 30 and difference 4 are 17 and 13. Are they right?
          options:
          - 'Yes'
          - 'No'
          answer: 'Yes'
          why: 17 + 13 = 30 and 17 − 13 = 4. Both facts are true, so the pair is right.
    items:
      - prompt: "The sum of two numbers is 34 and their difference is 10. What is the bigger number?"
        answer: "22"
        check: "(34 + 10)/2"
        difficulty: 1
        hints: ["Call the numbers x and y: x + y = 34 and x − y = 10.", "Add the two equations. What is 2x?"]
        solution: "Step 1: x + y = 34 and x − y = 10. Step 2: Adding them, 2x = 44. Step 3: x = 22."
        mistakes: {"44": forgot_divide, "12": swapped_unknowns}
      - prompt: "The sum of two numbers is 34 and their difference is 10. What is the smaller number?"
        answer: "12"
        check: "(34 - 10)/2"
        difficulty: 1
        hints: ["Subtract the difference from the sum first.", "34 − 10 is two of the smaller number."]
        solution: "Step 1: x + y = 34 and x − y = 10. Step 2: Subtracting, 2y = 24. Step 3: y = 12."
        mistakes: {"24": forgot_divide, "22": swapped_unknowns}
      - prompt: "Two numbers add up to 50. One is 8 more than the other. What is the smaller number?"
        answer: "21"
        check: "(50 - 8)/2"
        difficulty: 1
        hints: ["Take the extra 8 away from 50.", "What is left is two equal smaller numbers."]
        solution: "Step 1: 50 − 8 = 42. Step 2: 42 ÷ 2 = 21. Step 3: Check: 21 + 29 = 50 and 29 − 21 = 8."
        mistakes: {"42": forgot_divide, "29": swapped_unknowns}
      - prompt: "x + y = 27 and x − y = 5. What is x?"
        answer: "16"
        check: "(27 + 5)/2"
        difficulty: 2
        hints: ["Add the two equations.", "The y terms cancel and you get 2x = 32."]
        solution: "Step 1: Adding, 2x = 32. Step 2: x = 16. Step 3: Check: y = 11, and 16 − 11 = 5."
        mistakes: {"32": forgot_divide, "11": swapped_unknowns}
      - prompt: "The sum of two numbers is 3/4 and their difference is 1/4. What is the bigger number? Type a fraction like 2/3."
        answer: "1/2"
        check: "(3/4 + 1/4)/2"
        difficulty: 2
        hints: ["It works just like whole numbers: add the sum and the difference.", "3/4 + 1/4 = 1. Half of that is the bigger number."]
        solution: "Step 1: x + y = 3/4 and x − y = 1/4. Step 2: Adding, 2x = 1. Step 3: x = 1/2."
        mistakes: {"1": forgot_divide, "1/4": swapped_unknowns}
      - prompt: "Which pair of numbers has a sum of 40 and a difference of 12?"
        options: ["26 and 14", "28 and 12", "20 and 20", "24 and 16"]
        answer: "26 and 14"
        difficulty: 2
        hints: ["The bigger number is (40 + 12) ÷ 2.", "Check each pair: does it add to 40 and differ by 12?"]
        solution: "Step 1: Bigger number = (40 + 12) ÷ 2 = 26. Step 2: Smaller number = 40 − 26 = 14. Step 3: Check: 26 − 14 = 12."
        mistakes: {"28 and 12": difference_as_number}
      - prompt: "A 25 m rope is cut into two pieces. One piece is 3 m longer than the other. How long is the longer piece, in metres?"
        answer: "14"
        check: "(25 + 3)/2"
        difficulty: 3
        hints: ["The two pieces add up to 25 and differ by 3.", "Longer piece = (sum + difference) ÷ 2."]
        solution: "Step 1: x + y = 25 and x − y = 3. Step 2: 2x = 28. Step 3: x = 14 m, and the other piece is 11 m."
        mistakes: {"28": forgot_divide, "11": swapped_unknowns}
      - prompt: "Half the sum of two numbers is 20 and half their difference is 6. What is the bigger number?"
        answer: "26"
        check: "(2*20 + 2*6)/2"
        difficulty: 3
        hints: ["First find the sum and the difference themselves.", "The sum is 40 and the difference is 12."]
        solution: "Step 1: Sum = 40 and difference = 12. Step 2: 2x = 52. Step 3: x = 26."
        mistakes: {"14": swapped_unknowns}
      - prompt: "Two numbers add up to 100 and differ by 36. What is the smaller number?"
        answer: "32"
        check: "(100 - 36)/2"
        difficulty: 2
        hints: ["Take the difference away from the sum first.", "What is left is two equal smaller numbers."]
        solution: "Step 1: 100 − 36 = 64. Step 2: 64 ÷ 2 = 32. Step 3: Check: 32 + 68 = 100 and 68 − 32 = 36."
        mistakes: {"64": forgot_divide, "68": swapped_unknowns}
      - prompt: "A father and son are 48 years old together. The father is 28 years older. How old is the son?"
        answer: "10"
        check: "(48 - 28)/2"
        difficulty: 3
        hints: ["The ages add up to 48 and differ by 28.", "Take the 28 extra years away, then share what is left equally."]
        solution: "Step 1: 48 − 28 = 20. Step 2: 20 ÷ 2 = 10, the son's age. Step 3: The father is 38, and 38 − 10 = 28."
        mistakes: {"20": forgot_divide, "38": swapped_unknowns}
      - prompt: "x + y = 2.5 and x − y = 0.5. What is y? Decimals are fine."
        answer: "1"
        check: "(2.5 - 0.5)/2"
        difficulty: 3
        hints: ["Subtract the second equation from the first.", "The x terms cancel: 2y = 2."]
        solution: "Step 1: Subtracting, 2y = 2.5 − 0.5 = 2. Step 2: y = 1. Step 3: Then x = 1.5, and 1.5 − 1 = 0.5."
        mistakes: {"2": forgot_divide, "1.5": swapped_unknowns}
      - prompt: The sum of two numbers is 20 and their difference is 4. What is the bigger number?
        answer: '12'
        check: (20 + 4)/2
        difficulty: 1
        hints:
        - Add the sum and the difference.
        - That total is two of the bigger number.
        solution: 'Step 1: 20 + 4 = 24. Step 2: 24 ÷ 2 = 12. Step 3: The smaller number is 8, and 12 − 8 = 4.'
        mistakes:
          '24': forgot_divide
          '8': swapped_unknowns
      - prompt: x + y = 20 and x − y = 6. What is y?
        answer: '7'
        check: (20 - 6)/2
        difficulty: 1
        hints:
        - Take the second equation away from the first.
        - The x terms cancel, leaving 2y = 14.
        solution: 'Step 1: (x + y) − (x − y) = 20 − 6, so 2y = 14. Step 2: y = 7. Step 3: Check: x = 13, and 13 − 7 = 6.'
        mistakes:
          '14': forgot_divide
          '13': swapped_unknowns
      - prompt: Two numbers have a sum of 30 and a difference of 8. Which are they?
        options:
        - 19 and 11
        - 22 and 8
        - 15 and 15
        - 38 and 22
        answer: 19 and 11
        difficulty: 2
        hints:
        - The bigger number is half of (30 + 8).
        - Check each pair against both facts.
        solution: 'Step 1: Bigger = (30 + 8) ÷ 2 = 19. Step 2: Smaller = 30 − 19 = 11. Step 3: Check: 19 − 11 = 8.'
        mistakes:
          22 and 8: difference_as_number
      - prompt: The sum of two numbers is 9 and their difference is 2. What is the bigger number? Decimals are fine.
        answer: '5.5'
        check: (9 + 2)/2
        difficulty: 2
        hints:
        - 'It works the same way with decimals: add the sum and the difference.'
        - 9 + 2 = 11 is two of the bigger number.
        solution: 'Step 1: 9 + 2 = 11. Step 2: 11 ÷ 2 = 5.5. Step 3: The smaller is 3.5, and 5.5 − 3.5 = 2.'
        mistakes:
          '11': forgot_divide
          '3.5': swapped_unknowns
      - prompt: Two friends share 60 marbles. One has 14 more than the other. How many marbles does the one with fewer have?
        answer: '23'
        check: (60 - 14)/2
        difficulty: 3
        hints:
        - The two shares add up to 60 and differ by 14.
        - Take away the extra 14, then share what is left equally.
        solution: 'Step 1: 60 − 14 = 46. Step 2: 46 ÷ 2 = 23. Step 3: The other friend has 37, and 23 + 37 = 60.'
        mistakes:
          '46': forgot_divide
          '37': swapped_unknowns

  - code: math9.pairs.elimination
    title: Adding or subtracting the equations
    after: [math9.pairs.sum_difference]
    notes: |
      When one unknown has the same number in front of it in both equations, subtracting the
      equations (same signs) or adding them (opposite signs) removes it. Example: x + y = 8 and
      2x + y = 10; subtracting gives x = 2, then y = 6. Adding both equations can also give
      combined amounts such as x + y directly.
    explanations:
      text: "Look for an unknown with the same number in front of it in both equations. In x + y = 8 and 2x + y = 10, both have one y. Subtract the first equation from the second: (2x + y) − (x + y) = 10 − 8, so x = 2. Then y = 8 − 2 = 6. If the signs are opposite, like +3y and −3y, add the equations instead."
      visual: "Picture two shop bills. Bill 1: one pen and one pencil, ₹8. Bill 2: two pens and one pencil, ₹10. Put them side by side. Bill 2 has exactly one extra pen and costs ₹2 more, so a pen costs ₹2. Take the pen off bill 1: the pencil costs ₹6."
      step_by_step: "Step 1: Write the equations one under the other: 2x + y = 10 and x + y = 8. Step 2: The y terms match, so subtract: 2x − x = x and 10 − 8 = 2. Step 3: So x = 2. Step 4: Put x = 2 into x + y = 8, so y = 6. Step 5: Check in the other equation: 2 × 2 + 6 = 10."
      real_world: "2 notebooks and 3 pens cost ₹80. 2 notebooks and 5 pens cost ₹100. The notebooks are the same in both, so the 2 extra pens cost ₹20, and one pen is ₹10. Then 2 notebooks cost 80 − 30 = ₹50, so one notebook is ₹25."
    picture:
      kind: flow
      steps: ['Bill 1: 1 pen + 1 pencil = ₹8', 'Bill 2: 2 pens + 1 pencil = ₹10', Bill 2 has one extra pen and costs ₹2 more, 'So a pen costs ₹2, and a pencil ₹8 − ₹2 = ₹6']
      alt: 'Two shop bills compared: the second has one more pen and costs 2 rupees more, so a pen is 2 rupees and a pencil 6 rupees.'
    activity:
      type: formula
      prompt: Both equations must be true together. Change x and y.
      inputs:
      - name: x
        label: x
        min: 0
        max: 10
        step: 1
        start: 0
      - name: y
        label: y
        min: 0
        max: 10
        step: 1
        start: 0
      outputs:
      - name: p
        label: 2x + 3y
        expr: 2*x+3*y
      - name: q
        label: x − y
        expr: x-y
      goals:
      - prompt: Make 2x + 3y = 12 and x − y = 1 at the same time.
        want:
          p: 12
          q: 1
        hint: Can you make the y terms cancel? Try multiplying x − y = 1 by 3, then adding it to the first.
        mistakes:
        - when:
            p: 12
          say: 'Only 2x + 3y = 12 is true. A pair that fits one equation isn''t enough: both must be true for the same x and y.'
        - when:
            q: 1
          say: Only x − y = 1 is true. Lots of pairs are 1 apart (2 and 1, 3 and 2, …); only one of them also makes 2x + 3y = 12.
    lesson:
      - teach: 'Sometimes one unknown has the same number in front of it in both equations. In x + y = 8 and 2x + y = 10, both have one y. Take the first equation away from the second: (2x + y) − (x + y) = 10 − 8, which leaves x = 2. The y has disappeared.'
        check:
          prompt: 3x + y = 11 and x + y = 5. Take the second away from the first. What is left?
          options:
          - 2x = 6
          - 4x = 16
          - 2y = 6
          answer: 2x = 6
          why: 3x − x = 2x, y − y = 0 and 11 − 5 = 6. So 2x = 6, and x = 3.
      - teach: If the same unknown has opposite signs, like +3y in one equation and −3y in the other, add the equations instead. +3y and −3y make 0. In 2x + 3y = 13 and 2x − 3y = 1, adding gives 4x = 14.
        check:
          prompt: When does adding the two equations remove y?
          options:
          - When the y terms have opposite signs, like +2y and −2y
          - When the y terms are the same, like +2y and +2y
          - Never
          answer: When the y terms have opposite signs, like +2y and −2y
          why: +2y and −2y add up to 0. Terms with the same sign cancel when you subtract instead.
      - teach: 'Once one unknown is found, put it back into either equation to find the other. From x = 2 and x + y = 8: 2 + y = 8, so y = 6. Then check in the other equation: 2 × 2 + 6 = 10, which is right.'
        check:
          prompt: You found x = 3, and x + y = 7. What is y?
          options:
          - '4'
          - '10'
          - '3'
          answer: '4'
          why: 3 + y = 7, so y = 7 − 3 = 4.
      - teach: Adding both equations can also give a total straight away. 2x + 3y = 13 and 3x + 2y = 12 add up to 5x + 5y = 25, so x + y = 5 without finding x or y first.
        check:
          prompt: x + 2y = 9 and 2x + y = 6 add up to 3x + 3y = 15. What is x + y?
          options:
          - '5'
          - '15'
          - '3'
          answer: '5'
          why: 'Divide every term of 3x + 3y = 15 by 3: x + y = 5.'
    items:
      - prompt: "x + y = 8 and 2x + y = 10. What is x?"
        answer: "2"
        check: "10 - 8"
        difficulty: 1
        hints: ["Both equations have one y.", "Subtract the first equation from the second."]
        solution: "Step 1: (2x + y) − (x + y) = 10 − 8. Step 2: x = 2."
        mistakes: {"6": swapped_unknowns}
      - prompt: "x + y = 8 and 2x + y = 10. What is y?"
        answer: "6"
        check: "8 - (10 - 8)"
        difficulty: 1
        hints: ["Find x first by subtracting the equations.", "Then put x into x + y = 8."]
        solution: "Step 1: Subtracting, x = 2. Step 2: 2 + y = 8. Step 3: y = 6."
        mistakes: {"2": swapped_unknowns}
      - prompt: "3x + y = 17 and x + y = 7. What is x?"
        answer: "5"
        check: "(17 - 7)/2"
        difficulty: 1
        hints: ["The y terms match. Subtract.", "You get 2x = 10."]
        solution: "Step 1: (3x + y) − (x + y) = 17 − 7. Step 2: 2x = 10. Step 3: x = 5."
        mistakes: {"10": forgot_divide, "2": swapped_unknowns}
      - prompt: "5x + 2y = 24 and 3x + 2y = 16. What is x?"
        answer: "4"
        check: "(24 - 16)/2"
        difficulty: 2
        hints: ["Both have 2y. Subtract.", "5x − 3x = 2x."]
        solution: "Step 1: Subtracting, 2x = 8. Step 2: x = 4. Step 3: Then 2y = 24 − 20 = 4, so y = 2."
        mistakes: {"8": forgot_divide, "2": swapped_unknowns}
      - prompt: "2x + 3y = 13 and 2x − 3y = 1. What is x? Decimals are fine."
        answer: "3.5"
        check: "(13 + 1)/4"
        difficulty: 2
        hints: ["+3y and −3y have opposite signs, so add.", "You get 4x = 14."]
        solution: "Step 1: Adding, 4x = 14. Step 2: x = 3.5. Step 3: Then 3y = 13 − 7 = 6, so y = 2."
        mistakes: {"14": forgot_divide, "2": swapped_unknowns}
      - prompt: "To find x from 3x + 4y = 26 and 5x − 4y = 6, what should you do with the two equations?"
        options: ["Add them", "Subtract them", "Multiply them", "Divide them"]
        answer: "Add them"
        difficulty: 2
        hints: ["Look at the y terms: +4y and −4y.", "Which way makes them cancel?"]
        solution: "Step 1: +4y and −4y have opposite signs. Step 2: Adding gives 8x = 32, and the y terms are gone."
        mistakes: {"Subtract them": subtract_when_opposite}
      - prompt: "3x + 4y = 26 and 5x − 4y = 6. What is y? Decimals are fine."
        answer: "3.5"
        check: "(26 - 3*(32/8))/4"
        difficulty: 3
        hints: ["Add the equations to find x first.", "8x = 32, so x = 4. Put it into 3x + 4y = 26."]
        solution: "Step 1: Adding, 8x = 32, so x = 4. Step 2: 12 + 4y = 26. Step 3: 4y = 14, so y = 3.5."
        mistakes: {"4": swapped_unknowns, "14": forgot_divide}
      - prompt: "2x + 3y = 13 and 3x + 2y = 12. What is x + y?"
        answer: "5"
        check: "(13 + 12)/5"
        difficulty: 3
        hints: ["You don't need x and y separately. Add the two equations.", "You get 5x + 5y = 25."]
        solution: "Step 1: Adding, 5x + 5y = 25. Step 2: Divide by 5: x + y = 5."
        mistakes: {"25": forgot_divide}
      - prompt: "4x + y = 23 and x + y = 8. What is y?"
        answer: "3"
        check: "8 - (23 - 8)/3"
        difficulty: 2
        hints: ["Subtract the second equation from the first to remove y.", "3x = 15, so x = 5. Now use x + y = 8."]
        solution: "Step 1: Subtracting, 3x = 15. Step 2: x = 5. Step 3: 5 + y = 8, so y = 3."
        mistakes: {"5": swapped_unknowns, "15": forgot_divide}
      - prompt: "3x + 5y = 31 and 3x − 5y = 1. What is y?"
        answer: "3"
        check: "(31 - 1)/10"
        difficulty: 3
        hints: ["The x terms are the same, so subtract the equations.", "3x − 3x = 0 and 5y − (−5y) = 10y."]
        solution: "Step 1: Subtracting, 10y = 30. Step 2: y = 3. Step 3: Then 3x = 16, x = 16/3; check 16 + 15 = 31."
        mistakes: {"30": forgot_divide, "0": subtract_when_opposite}
      - prompt: "6x + 7y = 47 and 6x + 2y = 22. What is x?"
        answer: "2"
        check: "(22 - 2*(47 - 22)/5)/6"
        difficulty: 3
        hints: ["Subtract to remove x first: 5y = 25.", "With y = 5, put it back into 6x + 2y = 22."]
        solution: "Step 1: Subtracting, 5y = 25, so y = 5. Step 2: 6x + 10 = 22, so 6x = 12. Step 3: x = 2."
        mistakes: {"5": swapped_unknowns, "12": forgot_divide}
      - prompt: 2x + y = 11 and x + y = 7. What is x?
        answer: '4'
        check: 11 - 7
        difficulty: 1
        hints:
        - Both equations have one y. Take one equation away from the other.
        - (2x + y) − (x + y) leaves just x.
        solution: 'Step 1: Subtract: (2x + y) − (x + y) = 11 − 7. Step 2: So x = 4. Step 3: Then y = 7 − 4 = 3.'
        mistakes:
          '3': swapped_unknowns
      - prompt: x + 4y = 14 and x − 4y = 6. What is x?
        answer: '10'
        check: (14 + 6)/2
        difficulty: 2
        hints:
        - The y terms have opposite signs.
        - Adding the equations gives 2x = 20.
        solution: 'Step 1: Add: 2x = 20. Step 2: x = 10. Step 3: Then 4y = 4, so y = 1.'
        mistakes:
          '20': forgot_divide
          '1': swapped_unknowns
      - prompt: To find y from 5x + 2y = 19 and 5x − y = 7, what should you do first?
        options:
        - Take the second equation away from the first
        - Add the two equations
        - Multiply the first equation by 2
        answer: Take the second equation away from the first
        difficulty: 2
        hints:
        - 'Look at the x terms: are their signs the same or opposite?'
        - Both are +5x, so they cancel only one way.
        solution: 'Step 1: Both equations have +5x. Step 2: Subtracting gives 2y − (−y) = 3y = 12. Step 3: So y = 4.'
        mistakes:
          Add the two equations: add_when_same
      - prompt: 7x + 3y = 37 and 2x + 3y = 17. What is y?
        answer: '3'
        check: (17 - 2*4)/3
        difficulty: 3
        hints:
        - Both have +3y, so subtract to find x first.
        - 5x = 20, so x = 4. Put it back into the second equation.
        solution: 'Step 1: Subtract: 5x = 20, so x = 4. Step 2: 2 × 4 + 3y = 17, so 3y = 9. Step 3: y = 3.'
        mistakes:
          '4': swapped_unknowns
      - prompt: 4x + 3y = 25 and 3x + 4y = 24. What is x + y?
        answer: '7'
        check: (25 + 24)/7
        difficulty: 3
        hints:
        - Try adding the two equations.
        - You get 7x + 7y = 49.
        solution: 'Step 1: Add: 7x + 7y = 49. Step 2: Divide by 7: x + y = 7. Step 3: Check: x = 4 and y = 3 fit both equations.'
        mistakes:
          '49': forgot_divide

  - code: math9.pairs.make_match
    title: Making the numbers match first
    after: [math9.pairs.elimination]
    notes: |
      When no unknown has matching numbers in front, multiply one or both equations by a number
      so that one unknown matches, then add or subtract. Every term on both sides is multiplied.
    explanations:
      text: "In x + 2y = 11 and 3x + y = 13, nothing matches yet. Multiply the whole first equation by 3: 3x + 6y = 33. Now both have 3x. Subtract 3x + y = 13 to get 5y = 20, so y = 4 and x = 11 − 8 = 3. Multiply every term, including the number on the right."
      visual: "Think of x + 2y = 11 as a balance: one x and two y's on one pan, 11 on the other. Three copies of the balance still balance: three x's and six y's against 33. Every pan is tripled, not just one weight."
      step_by_step: "Step 1: Choose the unknown to remove, say x, in x + 2y = 11 and 3x + y = 13. Step 2: Multiply the first equation by 3: 3x + 6y = 33. Step 3: Subtract the second equation: 5y = 20. Step 4: y = 4. Step 5: Put y = 4 into x + 2y = 11, so x = 3. Step 6: Check: 3 × 3 + 4 = 13."
      real_world: "One pen and two pencils cost ₹11. Three pens and one pencil cost ₹13. Three of the first bill would be 3 pens and 6 pencils for ₹33. Compared with the second bill, the 5 extra pencils cost ₹20, so a pencil is ₹4 and a pen is ₹3."
    activity:
      type: formula
      prompt: Find x and y that fit both equations.
      inputs:
      - name: x
        label: x
        min: 0
        max: 10
        step: 1
        start: 0
      - name: y
        label: y
        min: 0
        max: 10
        step: 1
        start: 0
      outputs:
      - name: p
        label: 3x + 2y
        expr: 3*x+2*y
      - name: q
        label: x + y
        expr: x+y
      goals:
      - prompt: Make 3x + 2y = 16 and x + y = 7.
        want:
          p: 16
          q: 7
        hint: 'If x + y = 7, then 2x + 2y = 14. Compare that with 3x + 2y = 16: what does the extra x equal?'
        mistakes:
        - when:
            q: 7
          say: x + y = 7 is true, but many pairs add to 7. Only one of them also makes 3x + 2y = 16.
        - when:
            p: 16
          say: 3x + 2y = 16 is true, but x + y isn't 7 yet.
    lesson:
      - teach: 'In x + 2y = 11 and 3x + y = 13, no unknown has the same number in front of it. We can make one match: multiply the first equation by 3 to get 3x + 6y = 33. Now both equations have 3x.'
        check:
          prompt: To make the x terms match in x + y = 5 and 4x + 3y = 18, multiply the first equation by what?
          options:
          - '4'
          - '3'
          - '5'
          answer: '4'
          why: x × 4 = 4x, which matches the 4x in the second equation.
      - teach: Multiply every term, on both sides of the = sign. 2x + 3y = 7 multiplied by 4 is 8x + 12y = 28. Writing 8x + 3y = 7 or 8x + 12y = 7 would make the equation untrue, because only part of it was multiplied.
        check:
          prompt: Multiply x + 2y = 5 by 3. Which is right?
          options:
          - 3x + 6y = 15
          - 3x + 2y = 5
          - 3x + 6y = 5
          answer: 3x + 6y = 15
          why: 'Every term is multiplied: 3 × x = 3x, 3 × 2y = 6y and 3 × 5 = 15.'
      - teach: 'Then add or subtract as before. 3x + 6y = 33 and 3x + y = 13 both have 3x, so subtract: 5y = 20, which gives y = 4. Put it back: x + 8 = 11, so x = 3.'
        check:
          prompt: 3x + 6y = 33 and 3x + y = 13. Taking the second from the first gives what?
          options:
          - 5y = 20
          - 7y = 46
          - 6x = 46
          answer: 5y = 20
          why: 3x − 3x = 0, 6y − y = 5y and 33 − 13 = 20.
      - teach: 'Sometimes both equations need multiplying. For 3x + 2y = 12 and 2x + 3y = 13, multiply the first by 2 and the second by 3: 6x + 4y = 24 and 6x + 9y = 39. Now both have 6x, and subtracting gives 5y = 15.'
        check:
          prompt: To make the y terms match in 2x + 3y = 8 and 5x + 2y = 9, which works?
          options:
          - First × 2, second × 3
          - First × 3, second × 2
          - First × 5, second × 2
          answer: First × 2, second × 3
          why: 3y × 2 = 6y and 2y × 3 = 6y, so both y terms become 6y.
    items:
      - prompt: "To remove x from x + 2y = 11 and 3x + y = 13, what should you multiply the first equation by?"
        options: ["3", "2", "11", "13"]
        answer: "3"
        difficulty: 1
        hints: ["The second equation has 3x. How do you turn x into 3x?"]
        solution: "Step 1: Multiplying x + 2y = 11 by 3 gives 3x + 6y = 33. Step 2: Now both equations have 3x."
        mistakes: {"2": "match_coefficient", "13": "match_coefficient"}
      - prompt: "Multiply every term of 2x + 3y = 7 by 4. What do you get?"
        options: ["8x + 12y = 28", "8x + 12y = 7", "8x + 3y = 7", "6x + 7y = 11"]
        answer: "8x + 12y = 28"
        difficulty: 1
        hints: ["Every term, on both sides of =, is multiplied by 4."]
        solution: "Step 1: 4 × 2x = 8x. Step 2: 4 × 3y = 12y. Step 3: 4 × 7 = 28."
        mistakes: {"8x + 12y = 7": only_one_side, "8x + 3y = 7": only_one_side}
      - prompt: "x + 2y = 11 and 3x + y = 13. What is y?"
        answer: "4"
        check: "(3*11 - 13)/5"
        difficulty: 2
        hints: ["Multiply the first equation by 3.", "3x + 6y = 33. Now subtract 3x + y = 13."]
        solution: "Step 1: 3x + 6y = 33. Step 2: Subtracting 3x + y = 13 gives 5y = 20. Step 3: y = 4."
        mistakes: {"3": swapped_unknowns, "20": forgot_divide}
      - prompt: "2x + y = 7 and x + 3y = 11. What is x?"
        answer: "2"
        check: "(3*7 - 11)/5"
        difficulty: 2
        hints: ["Multiply the first equation by 3 to match the 3y.", "6x + 3y = 21. Now subtract x + 3y = 11."]
        solution: "Step 1: 6x + 3y = 21. Step 2: Subtracting, 5x = 10. Step 3: x = 2, and then y = 3."
        mistakes: {"3": swapped_unknowns, "10": forgot_divide}
      - prompt: "3x + 2y = 12 and 2x + 3y = 13. What is x?"
        answer: "2"
        check: "(3*12 - 2*13)/5"
        difficulty: 2
        hints: ["Make the y terms match: multiply the first by 3 and the second by 2.", "9x + 6y = 36 and 4x + 6y = 26."]
        solution: "Step 1: 9x + 6y = 36 and 4x + 6y = 26. Step 2: Subtracting, 5x = 10. Step 3: x = 2, and then y = 3."
        mistakes: {"3": swapped_unknowns, "10": forgot_divide}
      - prompt: "5x + 3y = 41 and 2x + 5y = 43. What is y?"
        answer: "7"
        check: "(5*43 - 2*41)/19"
        difficulty: 3
        hints: ["Make the x terms match: multiply the first by 2 and the second by 5.", "10x + 6y = 82 and 10x + 25y = 215."]
        solution: "Step 1: 10x + 6y = 82 and 10x + 25y = 215. Step 2: Subtracting, 19y = 133. Step 3: y = 7, and then x = 4."
        mistakes: {"4": swapped_unknowns}
      - prompt: "4x − 3y = 1 and 3x + 2y = 22. What is x?"
        answer: "4"
        check: "(2*1 + 3*22)/17"
        difficulty: 3
        hints: ["Make the y terms match: multiply the first by 2 and the second by 3.", "−6y and +6y have opposite signs, so add."]
        solution: "Step 1: 8x − 6y = 2 and 9x + 6y = 66. Step 2: Adding, 17x = 68. Step 3: x = 4, and then y = 5."
        mistakes: {"5": swapped_unknowns, "68": forgot_divide}
      - prompt: "x + 3y = 10 and 2x + y = 5. What is y?"
        answer: "3"
        check: "(2*10 - 5)/5"
        difficulty: 2
        hints: ["Multiply the first equation by 2 so the x terms match.", "2x + 6y = 20. Now subtract 2x + y = 5."]
        solution: "Step 1: 2x + 6y = 20. Step 2: Subtracting 2x + y = 5 gives 5y = 15. Step 3: y = 3 (and x = 1)."
        mistakes: {"15": forgot_divide, "1": swapped_unknowns}
      - prompt: "2x + 3y = 21 and 3x + 2y = 19. What is x?"
        answer: "3"
        check: "(2*21 - 3*19)/(4 - 9)"
        difficulty: 3
        hints: ["Make the y terms match: multiply the first by 2 and the second by 3.", "4x + 6y = 42 and 9x + 6y = 57. Subtract."]
        solution: "Step 1: 4x + 6y = 42 and 9x + 6y = 57. Step 2: Subtracting, 5x = 15. Step 3: x = 3, and then y = 5."
        mistakes: {"5": swapped_unknowns, "15": forgot_divide}
      - prompt: "To remove y from 3x + 4y = 18 and 5x − 6y = 11, which pair of multipliers works?"
        options: ["Multiply the first by 3 and the second by 2", "Multiply the first by 6 and the second by 4", "Multiply the first by 5 and the second by 3", "Multiply only the first by 2"]
        answer: "Multiply the first by 3 and the second by 2"
        difficulty: 3
        hints: ["You need the y terms to become the same size: 4y and 6y.", "The smallest number both 4 and 6 go into is 12."]
        solution: "Step 1: 4y × 3 = 12y and 6y × 2 = 12y. Step 2: Then 12y and −12y cancel when you add. Step 3: Multiplying by 6 and 4 also works but makes bigger numbers; 5 and 3 would match x, not y."
        mistakes: {"Multiply the first by 5 and the second by 3": match_coefficient, "Multiply only the first by 2": match_coefficient}
      - prompt: To make the y terms match in 2x + y = 8 and 3x + 2y = 13, what should you multiply the first equation by?
        answer: '2'
        check: '2'
        difficulty: 1
        hints:
        - Look at the y term in the second equation.
        - What turns y into 2y?
        solution: 'Step 1: The second equation has 2y. Step 2: y × 2 = 2y. Step 3: So multiply the first equation by 2 to get 4x + 2y = 16.'
        mistakes:
          '3': match_coefficient_y
      - prompt: Multiply every term of 3x − y = 4 by 5. What do you get?
        options:
        - 15x − 5y = 20
        - 15x − y = 4
        - 15x − 5y = 4
        - 15x + 5y = 20
        answer: 15x − 5y = 20
        difficulty: 2
        hints:
        - Every term on both sides gets multiplied.
        - Multiply 3x, −y and 4 each by 5.
        solution: 'Step 1: 5 × 3x = 15x. Step 2: 5 × (−y) = −5y. Step 3: 5 × 4 = 20, so 15x − 5y = 20.'
        mistakes:
          15x − y = 4: only_one_side
          15x − 5y = 4: only_one_side
      - prompt: 2x + y = 8 and 3x + 2y = 13. What is x?
        answer: '3'
        check: 2*8 - 13
        difficulty: 2
        hints:
        - Make the y terms match first.
        - 'Multiply the first equation by 2: 4x + 2y = 16.'
        solution: 'Step 1: 4x + 2y = 16. Step 2: Subtract 3x + 2y = 13 to get x = 3. Step 3: Then y = 8 − 6 = 2.'
        mistakes:
          '2': swapped_unknowns
      - prompt: 3x + 2y = 16 and 4x − 3y = 10. What is x?
        answer: '4'
        check: (3*16 + 2*10)/17
        difficulty: 3
        hints:
        - 'Make the y terms match: one has +2y and the other −3y.'
        - Multiply the first by 3 and the second by 2, then add.
        solution: 'Step 1: 9x + 6y = 48 and 8x − 6y = 20. Step 2: Add: 17x = 68. Step 3: x = 4, and then 2y = 4, so y = 2.'
        mistakes:
          '2': swapped_unknowns
      - prompt: 5x + 2y = 20 and 3x + 5y = 31. What is y?
        answer: '5'
        check: (20 - 5*2)/2
        difficulty: 3
        hints:
        - Make one unknown match in both equations.
        - Multiply the first by 5 and the second by 2 to get 10y in both.
        solution: 'Step 1: 25x + 10y = 100 and 6x + 10y = 62. Step 2: Subtract: 19x = 38, so x = 2. Step 3: 10 + 2y = 20, so y = 5.'
        mistakes:
          '2': swapped_unknowns

  - code: math9.pairs.word_problems
    title: Writing equations from a situation
    after: [math9.pairs.make_match]
    notes: |
      Name the two unknowns with letters, write one equation for each fact, then solve.
      Common situations: prices, ages, coins, two-digit numbers (10a + b), rectangles
      (perimeter = 2(length + breadth)) and angles (acute angles of a right triangle add to 90°).
    explanations:
      text: "Ask: which two things don't I know? Give them letters. Each sentence with a number usually gives one equation. Example: 4 chairs and 3 tables cost ₹2100, and 5 chairs and 2 tables cost ₹1750. With x for a chair and y for a table, 4x + 3y = 2100 and 5x + 2y = 1750. Solving gives ₹150 for a chair and ₹500 for a table."
      visual: "Make a small table with one column for each unknown and one for the total. For the chairs and tables, row 1 is 4 | 3 | ₹2100 and row 2 is 5 | 2 | ₹1750. Each row becomes one equation: 4x + 3y = 2100 and 5x + 2y = 1750."
      step_by_step: "Step 1: Choose letters: x for the price of a chair, y for a table. Step 2: First fact: 4x + 3y = 2100. Step 3: Second fact: 5x + 2y = 1750. Step 4: Make the y terms match: 8x + 6y = 4200 and 15x + 6y = 5250. Step 5: Subtract: 7x = 1050, so x = 150. Step 6: Then 3y = 2100 − 600 = 1500, so y = 500."
      real_world: "Rahul is 3 times as old as his sister. In 5 years he will be twice as old as her. With x for Rahul and y for his sister: x = 3y and x + 5 = 2(y + 5). Putting 3y in place of x: 3y + 5 = 2y + 10, so y = 5. His sister is 5 and Rahul is 15."
    activity:
      type: formula
      prompt: Pens cost ₹5 and notebooks ₹12. Choose how many of each.
      inputs:
      - name: p
        label: Pens
        min: 0
        max: 15
        step: 1
        start: 0
      - name: n
        label: Notebooks
        min: 0
        max: 15
        step: 1
        start: 0
      outputs:
      - name: count
        label: Things bought
        expr: p+n
      - name: cost
        label: Total cost
        expr: 5*p+12*n
        unit: ₹
      goals:
      - prompt: Buy 10 things for exactly ₹78.
        want:
          count: 10
          cost: 78
        hint: 'If all 10 were pens: ₹50. Each swap to a notebook adds ₹7.'
        mistakes:
        - when:
            count: 10
          say: You bought 10 things, but they cost the wrong amount. Swapping one pen for a notebook changes the cost by ₹7.
        - when:
            cost: 78
          say: That costs ₹78, but you didn't buy 10 things.
    lesson:
      - teach: 'A word problem hides two unknowns. Start by naming them: ''Let x be the price of 1 kg of rice, in rupees, and y the price of 1 kg of sugar.'' Saying what each letter stands for, with its unit, makes the rest much easier.'
        check:
          prompt: A pen and a notebook cost ₹40 together. What is a good first step?
          options:
          - Let x be the price of a pen and y the price of a notebook
          - Guess the price of the pen
          - Divide 40 by 2
          answer: Let x be the price of a pen and y the price of a notebook
          why: Naming the unknowns first lets you write each fact as an equation.
      - teach: Next, turn each fact into one equation. '2 kg of rice and 1 kg of sugar cost ₹130' becomes 2x + y = 130. 'The pen costs ₹9 more than the pencil' becomes x − y = 9, which is the same as x = y + 9.
        check:
          prompt: Anu is 4 years older than Binu. With a for Anu's age and b for Binu's, which equation fits?
          options:
          - a − b = 4
          - b − a = 4
          - a + b = 4
          answer: a − b = 4
          why: Anu is older, so Anu's age minus Binu's age is 4.
      - teach: 'Some situations bring their own rule. A rectangle: perimeter = 2 × (length + breadth). A two-digit number with tens digit a and units digit b is 10a + b, and with its digits reversed it is 10b + a. In a right triangle, the two acute angles add up to 90°.'
        check:
          prompt: A two-digit number has tens digit a and units digit b. How do we write the number?
          options:
          - 10a + b
          - a + b
          - 10b + a
          answer: 10a + b
          why: 'The tens digit counts tens: for example 47 = 10 × 4 + 7.'
      - teach: 'Solve the pair, then answer exactly what was asked, with its unit, and check it in the story. If the pen is ₹12 and the pencil ₹3: together they cost ₹15, and the pen costs ₹9 more. Both facts fit.'
        check:
          prompt: You found x = 12 for the pen and y = 3 for the pencil. The question asks for the pencil's price. What do you answer?
          options:
          - ₹3
          - ₹12
          - ₹15
          answer: ₹3
          why: The question asked about the pencil, which is y, so the answer is ₹3.
    items:
      - prompt: "Meera buys 2 kg of rice and 1 kg of sugar for ₹130. With x for the price of 1 kg of rice and y for 1 kg of sugar, which equation fits?"
        options: ["2x + y = 130", "x + 2y = 130", "2x + 2y = 130", "2xy = 130"]
        answer: "2x + y = 130"
        difficulty: 1
        hints: ["2 kg of rice cost 2 × x.", "Add the cost of the sugar."]
        solution: "Step 1: Rice costs 2x. Step 2: Sugar costs y. Step 3: 2x + y = 130."
        mistakes: {"x + 2y = 130": swapped_unknowns}
      - prompt: "A pen and a pencil cost ₹15 together. The pen costs ₹9 more than the pencil. How many rupees does the pencil cost?"
        answer: "3"
        check: "(15 - 9)/2"
        difficulty: 1
        hints: ["Pen + pencil = 15 and pen − pencil = 9.", "Take the extra 9 away from 15 and share what is left."]
        solution: "Step 1: 15 − 9 = 6. Step 2: 6 ÷ 2 = 3. Step 3: The pencil costs ₹3 and the pen ₹12."
        mistakes: {"6": forgot_divide, "12": swapped_unknowns}
      - prompt: "The perimeter of a rectangle is 30 cm and its length is 3 cm more than its breadth. What is the length, in cm?"
        answer: "9"
        check: "(30/2 + 3)/2"
        difficulty: 2
        hints: ["Length + breadth is half the perimeter.", "Length + breadth = 15 and length − breadth = 3."]
        solution: "Step 1: Length + breadth = 15. Step 2: Length − breadth = 3. Step 3: 2 × length = 18, so the length is 9 cm."
        mistakes: {"16.5": perimeter_half, "18": forgot_divide, "6": swapped_unknowns}
      - prompt: "Some ₹5 coins and ₹10 coins make ₹80. If the numbers of the two kinds were swapped, they would make ₹70. How many ₹10 coins are there?"
        answer: "6"
        check: "(150/15 + 10/5)/2"
        difficulty: 2
        hints: ["With x five-rupee coins and y ten-rupee coins: 5x + 10y = 80 and 10x + 5y = 70.", "Adding gives 15x + 15y = 150, so x + y = 10."]
        solution: "Step 1: 5x + 10y = 80 and 10x + 5y = 70. Step 2: Adding, x + y = 10. Step 3: Subtracting, 5y − 5x = 10, so y − x = 2. Step 4: y = 6 and x = 4."
        mistakes: {"4": swapped_unknowns}
      - prompt: "Rahul is 3 times as old as his sister. In 5 years he will be twice as old as her. How old is Rahul now?"
        answer: "15"
        check: "3*(2*5 - 5)"
        difficulty: 2
        hints: ["With x for Rahul and y for his sister: x = 3y.", "In 5 years: x + 5 = 2(y + 5)."]
        solution: "Step 1: x = 3y and x + 5 = 2(y + 5). Step 2: 3y + 5 = 2y + 10, so y = 5. Step 3: x = 15."
        mistakes: {"5": swapped_unknowns}
      - prompt: "4 chairs and 3 tables cost ₹2100. 5 chairs and 2 tables cost ₹1750. How many rupees does one table cost?"
        answer: "500"
        check: "(5*2100 - 4*1750)/(5*3 - 4*2)"
        difficulty: 3
        hints: ["4x + 3y = 2100 and 5x + 2y = 1750.", "Make the x terms match: multiply the first by 5 and the second by 4."]
        solution: "Step 1: 20x + 15y = 10500 and 20x + 8y = 7000. Step 2: Subtracting, 7y = 3500. Step 3: y = 500, and a chair costs ₹150."
        mistakes: {"150": swapped_unknowns}
      - prompt: "The digits of a two-digit number add up to 9. Reversing the digits makes the number 27 bigger. What is the number?"
        answer: "36"
        check: "10*((9 - 3)/2) + (9 + 3)/2"
        difficulty: 3
        hints: ["With tens digit a and ones digit b, the number is 10a + b and a + b = 9.", "Reversed it is 10b + a, so (10b + a) − (10a + b) = 27, which means b − a = 3."]
        solution: "Step 1: a + b = 9. Step 2: 9b − 9a = 27, so b − a = 3. Step 3: b = 6 and a = 3. Step 4: The number is 36, and 63 − 36 = 27."
        mistakes: {"63": digits_reversed}
      - prompt: "In a right triangle, one acute angle is 20° more than the other. What is the larger acute angle, in degrees?"
        answer: "55"
        check: "(90 + 20)/2"
        difficulty: 3
        hints: ["The two acute angles add up to 90°.", "Sum 90 and difference 20."]
        solution: "Step 1: x + y = 90 and x − y = 20. Step 2: 2x = 110. Step 3: x = 55°, and the other angle is 35°."
        mistakes: {"100": angle_sum_180, "35": swapped_unknowns, "110": forgot_divide}
      - prompt: "3 notebooks and 2 pens cost ₹110. 1 notebook and 2 pens cost ₹50. How many rupees does a notebook cost?"
        answer: "30"
        check: "(110 - 50)/2"
        difficulty: 2
        hints: ["Subtract the second purchase from the first: the pens cancel.", "2 notebooks cost ₹60."]
        solution: "Step 1: Subtracting, 2 notebooks cost 110 − 50 = ₹60. Step 2: 1 notebook costs ₹30. Step 3: Then 2 pens cost ₹20, so a pen is ₹10."
        mistakes: {"60": forgot_divide, "10": swapped_unknowns}
      - prompt: "A two-digit number is 7 times the sum of its digits. Its tens digit is 3 more than its units digit. What is the number?"
        answer: "63"
        check: "10*6 + 3"
        difficulty: 3
        hints: ["Write the number as 10a + b, with a = b + 3.", "10a + b = 7(a + b) gives 3a = 6b, so a = 2b."]
        solution: "Step 1: 10a + b = 7a + 7b, so 3a = 6b and a = 2b. Step 2: With a = b + 3: 2b = b + 3, so b = 3 and a = 6. Step 3: The number is 63, and 7 × (6 + 3) = 63."
        mistakes: {"36": digits_reversed}
