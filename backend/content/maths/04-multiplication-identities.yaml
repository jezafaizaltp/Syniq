# Class 9 Mathematics, chapter 4. Format: content/README.md.
# Mistake tags square_each_term, missing_double, sign_middle, sign_last, sum_not_difference,
# extra_middle_term and product_terms have tips in English and Malayalam in backend/app/i18n.py.
subject: math
chapter: 4
title: Multiplication Identities

tips:
  sign_product: "Watch the signs: a plus times a minus gives a minus, and a minus times a minus gives a plus."
  square_coefficient: "Square the number in front too: (2y)² = 2y × 2y = 4y², not 2y²."
  squared_difference: "a² − b² is not (a − b)². Use a² − b² = (a + b)(a − b)."

concepts:
  - code: math9.ident.bracket_product
    title: Multiplying two sums
    notes: |
      (a + b)(c + d) = ac + ad + bc + bd: every part of the first times every part of the second.
      For numbers, 23 × 15 = (20 + 3)(10 + 5) = 200 + 100 + 30 + 15 = 345. For letters,
      (x + a)(x + b) = x² + (a + b)x + ab.
    explanations:
      text: "To multiply two sums, multiply each part of the first by each part of the second, then add: (a + b)(c + d) = ac + ad + bc + bd. With numbers, 23 × 15 = (20 + 3) × (10 + 5) = 200 + 100 + 30 + 15 = 345. With letters, (x + 4)(x + 5) = x² + 5x + 4x + 20 = x² + 9x + 20."
      visual: "Draw a rectangle 23 long and 15 wide. Split the length into 20 and 3, and the width into 10 and 5. You get four smaller rectangles: 20 × 10 = 200, 20 × 5 = 100, 3 × 10 = 30 and 3 × 5 = 15. Together they make 345."
      step_by_step: "For (x + 4)(x + 5): Step 1: x × x = x². Step 2: x × 5 = 5x. Step 3: 4 × x = 4x. Step 4: 4 × 5 = 20. Step 5: Add and collect: x² + 9x + 20."
      real_world: "A 40 m by 30 m school field is made 5 m longer and 2 m wider. The new area is (40 + 5)(30 + 2) = 1200 + 80 + 150 + 10 = 1440 m²."
    items:
      - prompt: "Use (20 + 3)(10 + 5) to work out 23 × 15."
        answer: "345"
        check: "23*15"
        difficulty: 1
        hints: ["Multiply each part of the first bracket by each part of the second.", "20 × 10, 20 × 5, 3 × 10 and 3 × 5."]
        solution: "Step 1: 20 × 10 = 200 and 20 × 5 = 100. Step 2: 3 × 10 = 30 and 3 × 5 = 15. Step 3: 200 + 100 + 30 + 15 = 345."
        mistakes: {"215": product_terms}
      - prompt: "Expand (x + 4)(x + 5)."
        options: ["x² + 9x + 20", "x² + 20", "x² + 9x + 9", "x² + 20x + 9"]
        answer: "x² + 9x + 20"
        check: "expand((x + 4)*(x + 5))"
        difficulty: 1
        hints: ["x × x, x × 5, 4 × x and 4 × 5.", "Add the two x terms."]
        solution: "x² + 5x + 4x + 20 = x² + 9x + 20"
        mistakes: {"x² + 20": product_terms}
      - prompt: "Expand (x − 3)(x + 7)."
        options: ["x² + 4x − 21", "x² − 21", "x² − 4x − 21", "x² + 4x + 21"]
        answer: "x² + 4x − 21"
        check: "expand((x - 3)*(x + 7))"
        difficulty: 2
        hints: ["−3 × 7 is negative.", "The x terms are 7x and −3x."]
        solution: "x² + 7x − 3x − 21 = x² + 4x − 21"
        mistakes: {"x² − 21": product_terms, "x² + 4x + 21": sign_product, "x² − 4x − 21": sign_product}
      - prompt: "Expand (a + 2)(b + 3)."
        options: ["ab + 3a + 2b + 6", "ab + 6", "ab + 5", "ab + 2a + 3b + 6"]
        answer: "ab + 3a + 2b + 6"
        check: "expand((a + 2)*(b + 3))"
        difficulty: 2
        hints: ["a × b, a × 3, 2 × b and 2 × 3.", "No terms here can be collected."]
        solution: "Step 1: a × b = ab and a × 3 = 3a. Step 2: 2 × b = 2b and 2 × 3 = 6. Step 3: ab + 3a + 2b + 6."
        mistakes: {"ab + 6": product_terms}
      - prompt: "(x + 3)(x + b) = x² + 7x + 12. What is b?"
        answer: "4"
        check: "12/3"
        difficulty: 2
        hints: ["The last term, 12, is 3 × b.", "Check with the middle term: 3 + b should be 7."]
        solution: "Step 1: 3 × b = 12, so b = 4. Step 2: Check: 3 + 4 = 7, the middle number."
      - prompt: "Expand (2x + 3)(3x − 1)."
        options: ["6x² + 7x − 3", "6x² − 3", "5x² + 7x − 3", "6x² + 11x − 3"]
        answer: "6x² + 7x − 3"
        check: "expand((2*x + 3)*(3*x - 1))"
        difficulty: 3
        hints: ["2x × 3x = 6x².", "The x terms are −2x and 9x."]
        solution: "6x² − 2x + 9x − 3 = 6x² + 7x − 3"
        mistakes: {"6x² − 3": product_terms}
      - prompt: "Use (100 + 2)(100 + 5) to work out 102 × 105."
        answer: "10710"
        check: "102*105"
        difficulty: 3
        hints: ["100 × 100, 100 × 5, 2 × 100 and 2 × 5."]
        solution: "Step 1: 10000 + 500 + 200 + 10. Step 2: = 10710."
        mistakes: {"10010": product_terms}

  - code: math9.ident.square_of_sum
    title: "Square of a sum: (a + b)²"
    after: [math9.ident.bracket_product]
    notes: |
      (a + b)² = a² + 2ab + b²: the square of the first, twice the product, the square of the
      second. The common mistake is a² + b², leaving out 2ab.
    explanations:
      text: "(x + 5)² means (x + 5)(x + 5). Multiplying out gives x² + 5x + 5x + 25 = x² + 10x + 25. In general (a + b)² = a² + 2ab + b²: the square of the first, twice the product, and the square of the second."
      visual: "Draw a square with side a + b and split each side into a and b. Inside are a square a × a, a square b × b and two rectangles a × b. So (a + b)² = a² + 2ab + b². Forgetting the two rectangles is the most common mistake."
      step_by_step: "For (2y + 3)²: Step 1: Square the first term: (2y)² = 4y². Step 2: Twice the product: 2 × 2y × 3 = 12y. Step 3: Square the last term: 9. Step 4: 4y² + 12y + 9."
      real_world: "A square photo 15 cm wide gets a 2 cm frame on every side, so its side becomes 19 cm. The area with the frame is (15 + 4)² = 225 + 120 + 16 = 361 cm²."
    items:
      - prompt: "Expand (x + 5)²."
        options: ["x² + 10x + 25", "x² + 25", "x² + 5x + 25", "x² + 10x + 10"]
        answer: "x² + 10x + 25"
        check: "expand((x + 5)^2)"
        difficulty: 1
        hints: ["(x + 5)² = (x + 5)(x + 5).", "First squared, twice the product, last squared."]
        solution: "x² + 2(x)(5) + 5² = x² + 10x + 25"
        mistakes: {"x² + 25": square_each_term, "x² + 5x + 25": missing_double}
      - prompt: "Expand (y + 1)²."
        options: ["y² + 2y + 1", "y² + 1", "y² + y + 1", "y² + 2y + 2"]
        answer: "y² + 2y + 1"
        check: "expand((y + 1)^2)"
        difficulty: 1
        hints: ["Twice the product: 2 × y × 1."]
        solution: "y² + 2(y)(1) + 1² = y² + 2y + 1"
        mistakes: {"y² + 1": square_each_term, "y² + y + 1": missing_double}
      - prompt: "Expand (2y + 3)²."
        options: ["4y² + 12y + 9", "4y² + 9", "2y² + 12y + 9", "4y² + 6y + 9"]
        answer: "4y² + 12y + 9"
        check: "expand((2*y + 3)^2)"
        difficulty: 2
        hints: ["(2y)² = 4y².", "Twice the product: 2 × 2y × 3."]
        solution: "(2y)² + 2(2y)(3) + 3² = 4y² + 12y + 9"
        mistakes: {"4y² + 9": square_each_term, "4y² + 6y + 9": missing_double, "2y² + 12y + 9": square_coefficient}
      - prompt: "If a + b = 9 and ab = 14, what is a² + b²?"
        answer: "53"
        check: "9^2 - 2*14"
        difficulty: 2
        hints: ["(a + b)² = a² + 2ab + b².", "So a² + b² = (a + b)² − 2ab."]
        solution: "Step 1: a² + b² = (a + b)² − 2ab. Step 2: = 81 − 28. Step 3: = 53."
        mistakes: {"81": missing_double, "67": missing_double}
      - prompt: "Expand (3m + 2n)²."
        options: ["9m² + 12mn + 4n²", "9m² + 4n²", "9m² + 6mn + 4n²", "3m² + 12mn + 2n²"]
        answer: "9m² + 12mn + 4n²"
        check: "expand((3*m + 2*n)^2)"
        difficulty: 3
        hints: ["(3m)² = 9m² and (2n)² = 4n².", "Twice the product: 2 × 3m × 2n."]
        solution: "(3m)² + 2(3m)(2n) + (2n)² = 9m² + 12mn + 4n²"
        mistakes: {"9m² + 4n²": square_each_term, "9m² + 6mn + 4n²": missing_double, "3m² + 12mn + 2n²": square_coefficient}
      - prompt: "(x + k)² = x² + 14x + 49. What is k?"
        answer: "7"
        check: "14/2"
        difficulty: 3
        hints: ["The middle term is 2 × x × k.", "2k = 14. Check: k² should be 49."]
        solution: "Step 1: 2k = 14, so k = 7. Step 2: Check: 7² = 49."
        mistakes: {"14": missing_double}

  - code: math9.ident.square_of_difference
    title: "Square of a difference: (a − b)²"
    after: [math9.ident.square_of_sum]
    notes: |
      (a − b)² = a² − 2ab + b². The middle term is negative; the last term is positive.
      (x − y)² and (y − x)² are equal.
    explanations:
      text: "(x − 4)² = (x − 4)(x − 4) = x² − 4x − 4x + 16 = x² − 8x + 16. In general (a − b)² = a² − 2ab + b². The middle term takes the minus sign, but the last term is positive, because −4 × −4 = +16."
      visual: "Start with a square of side a. Cut a strip of width b off the right side and another off the top. Each strip has area ab, but the small b × b corner was cut away twice, so add it back once: a² − 2ab + b²."
      step_by_step: "For (3k − 1)²: Step 1: Square the first term: 9k². Step 2: Twice the product, with the minus sign: −2 × 3k × 1 = −6k. Step 3: Square the last term: (−1)² = 1. Step 4: 9k² − 6k + 1."
      real_world: "To work out 99² in your head: (100 − 1)² = 10000 − 200 + 1 = 9801."
    items:
      - prompt: "Expand (x − 4)²."
        options: ["x² − 8x + 16", "x² − 16", "x² + 8x + 16", "x² − 8x − 16"]
        answer: "x² − 8x + 16"
        check: "expand((x - 4)^2)"
        difficulty: 1
        hints: ["Use a² − 2ab + b² with a = x and b = 4."]
        solution: "x² − 2(x)(4) + 4² = x² − 8x + 16"
        mistakes: {"x² − 16": square_each_term, "x² + 8x + 16": sign_middle, "x² − 8x − 16": sign_last}
      - prompt: "Expand (a − 1)²."
        options: ["a² − 2a + 1", "a² − 1", "a² + 2a + 1", "a² − a + 1"]
        answer: "a² − 2a + 1"
        check: "expand((a - 1)^2)"
        difficulty: 1
        hints: ["The middle term is −2 × a × 1."]
        solution: "a² − 2(a)(1) + 1² = a² − 2a + 1"
        mistakes: {"a² − 1": square_each_term, "a² + 2a + 1": sign_middle, "a² − a + 1": missing_double}
      - prompt: "Expand (3k − 1)²."
        options: ["9k² − 6k + 1", "9k² − 1", "9k² − 3k + 1", "3k² − 6k + 1"]
        answer: "9k² − 6k + 1"
        check: "expand((3*k - 1)^2)"
        difficulty: 2
        hints: ["(3k)² = 9k².", "The middle term is −2 × 3k × 1."]
        solution: "(3k)² − 2(3k)(1) + 1² = 9k² − 6k + 1"
        mistakes: {"9k² − 1": square_each_term, "9k² − 3k + 1": missing_double, "3k² − 6k + 1": square_coefficient}
      - prompt: "If a − b = 5 and ab = 6, what is a² + b²?"
        answer: "37"
        check: "5^2 + 2*6"
        difficulty: 2
        hints: ["(a − b)² = a² − 2ab + b².", "So a² + b² = (a − b)² + 2ab."]
        solution: "Step 1: a² + b² = (a − b)² + 2ab. Step 2: = 25 + 12. Step 3: = 37."
        mistakes: {"13": sign_middle, "25": missing_double}
      - prompt: "Use (100 − 1)² to work out 99²."
        answer: "9801"
        check: "99^2"
        difficulty: 2
        hints: ["100² − 2 × 100 × 1 + 1²."]
        solution: "Step 1: 10000 − 200 + 1. Step 2: = 9801."
        mistakes: {"9999": square_each_term, "10201": sign_middle, "9799": sign_last}
      - prompt: "Expand (2p − 5q)²."
        options: ["4p² − 20pq + 25q²", "4p² − 25q²", "4p² + 20pq + 25q²", "4p² − 10pq + 25q²"]
        answer: "4p² − 20pq + 25q²"
        check: "expand((2*p - 5*q)^2)"
        difficulty: 3
        hints: ["(2p)² = 4p² and (5q)² = 25q².", "The middle term is −2 × 2p × 5q."]
        solution: "(2p)² − 2(2p)(5q) + (5q)² = 4p² − 20pq + 25q²"
        mistakes: {"4p² − 25q²": square_each_term, "4p² + 20pq + 25q²": sign_middle, "4p² − 10pq + 25q²": missing_double}
      - prompt: "Which of these is equal to (x − y)²?"
        options: ["(y − x)²", "x² − y²", "(x + y)²", "x² + y²"]
        answer: "(y − x)²"
        check: "expand((x - y)^2)"
        difficulty: 3
        hints: ["Expand both (x − y)² and (y − x)².", "y − x is −(x − y), and squaring removes the minus."]
        solution: "Step 1: (x − y)² = x² − 2xy + y². Step 2: (y − x)² = y² − 2xy + x², the same."
        mistakes: {"x² − y²": square_each_term, "x² + y²": square_each_term}

  - code: math9.ident.difference_of_squares
    title: "Sum times difference: (a + b)(a − b)"
    after: [math9.ident.bracket_product]
    notes: |
      (a + b)(a − b) = a² − b²: the middle terms cancel. Used backwards it factorises a
      difference of squares: x² − 49 = (x + 7)(x − 7). Also a² − b² is not (a − b)².
    explanations:
      text: "(x + 6)(x − 6) = x² − 6x + 6x − 36. The middle terms cancel, leaving x² − 36. In general (a + b)(a − b) = a² − b²: a sum times a difference of the same two terms gives the difference of their squares."
      visual: "Take a square of side a and cut a small square of side b from one corner. The L-shape left has area a² − b². Cut the L into two strips and move one: they make a rectangle with sides a + b and a − b."
      step_by_step: "For (2m + 3)(2m − 3): Step 1: It is a sum times a difference of the same two terms. Step 2: Square the first: (2m)² = 4m². Step 3: Square the second: 3² = 9. Step 4: Subtract: 4m² − 9."
      real_world: "A square courtyard of side 20 m has a square water tank of side 4 m in one corner. The paved area is 20² − 4² = (20 + 4)(20 − 4) = 24 × 16 = 384 m²."
    items:
      - prompt: "Expand (x + 6)(x − 6)."
        options: ["x² − 36", "x² + 36", "x² − 12x − 36", "x² − 12"]
        answer: "x² − 36"
        check: "expand((x + 6)*(x - 6))"
        difficulty: 1
        hints: ["The middle terms −6x and +6x cancel."]
        solution: "x² − 6x + 6x − 36 = x² − 36"
        mistakes: {"x² + 36": sum_not_difference, "x² − 12x − 36": extra_middle_term}
      - prompt: "Which product equals y² − 25?"
        options: ["(y + 5)(y − 5)", "(y − 5)²", "(y + 5)²", "(y + 25)(y − 1)"]
        answer: "(y + 5)(y − 5)"
        check: "y^2 - 25"
        difficulty: 1
        hints: ["25 = 5².", "A difference of squares comes from a sum times a difference."]
        solution: "y² − 25 = y² − 5² = (y + 5)(y − 5)"
      - prompt: "Expand (2m + 3)(2m − 3)."
        options: ["4m² − 9", "4m² + 9", "2m² − 9", "4m² − 12m − 9"]
        answer: "4m² − 9"
        check: "expand((2*m + 3)*(2*m - 3))"
        difficulty: 2
        hints: ["Use a² − b² with a = 2m and b = 3.", "(2m)² = 4m²."]
        solution: "(2m)² − 3² = 4m² − 9"
        mistakes: {"4m² + 9": sum_not_difference, "2m² − 9": square_coefficient, "4m² − 12m − 9": extra_middle_term}
      - prompt: "Use (60 + 1)(60 − 1) to work out 61 × 59."
        answer: "3599"
        check: "61*59"
        difficulty: 2
        hints: ["(a + b)(a − b) = a² − b².", "60² − 1²."]
        solution: "Step 1: 60² − 1² = 3600 − 1. Step 2: = 3599."
        mistakes: {"3601": sum_not_difference}
      - prompt: "x² − y² = 40 and x + y = 10. What is x − y?"
        answer: "4"
        check: "40/10"
        difficulty: 2
        hints: ["x² − y² = (x + y)(x − y).", "10 × (x − y) = 40."]
        solution: "Step 1: (x + y)(x − y) = 40. Step 2: 10(x − y) = 40. Step 3: x − y = 4."
      - prompt: "What is 75² − 25²?"
        answer: "5000"
        check: "75^2 - 25^2"
        difficulty: 3
        hints: ["Don't square them: use (a + b)(a − b).", "(75 + 25)(75 − 25) = 100 × 50."]
        solution: "Step 1: 75² − 25² = (75 + 25)(75 − 25). Step 2: = 100 × 50. Step 3: = 5000."
        mistakes: {"2500": squared_difference}
      - prompt: "Factorise 9x² − 16."
        options: ["(3x + 4)(3x − 4)", "(3x − 4)²", "(9x + 16)(x − 1)", "(3x + 4)²"]
        answer: "(3x + 4)(3x − 4)"
        check: "9x^2 - 16"
        difficulty: 3
        hints: ["9x² = (3x)² and 16 = 4².", "a² − b² = (a + b)(a − b)."]
        solution: "9x² − 16 = (3x)² − 4² = (3x + 4)(3x − 4)"

  - code: math9.ident.quick_calculation
    title: Quick calculation with identities
    after: [math9.ident.square_of_difference, math9.ident.difference_of_squares]
    notes: |
      Write numbers near a round number as a sum or difference and use an identity:
      103² = (100 + 3)² = 10609, 199² = (200 − 1)² = 39601, 48 × 52 = 50² − 2² = 2496,
      101² − 99² = (101 + 99)(101 − 99) = 400.
    explanations:
      text: "Identities make some big multiplications easy. Look for a round number nearby. 103² = (100 + 3)² = 10000 + 600 + 9 = 10609. 97 × 103 = (100 − 3)(100 + 3) = 10000 − 9 = 9991."
      visual: "103² is a square of side 100 + 3: a 100 × 100 block (10000), two 100 × 3 strips (300 each) and a small 3 × 3 corner (9). 10000 + 600 + 9 = 10609."
      step_by_step: "For 48 × 52: Step 1: Both are 2 away from 50. Step 2: Write them as (50 − 2)(50 + 2). Step 3: Use (a − b)(a + b) = a² − b². Step 4: 2500 − 4 = 2496."
      real_world: "A shop sells 52 school bags at ₹48 each. 48 × 52 = 50² − 2² = 2500 − 4, so the total is ₹2496."
    items:
      - prompt: "Use an identity to work out 103²."
        answer: "10609"
        check: "103^2"
        difficulty: 1
        hints: ["103 = 100 + 3.", "10000 + 2 × 100 × 3 + 9."]
        solution: "(100 + 3)² = 10000 + 600 + 9 = 10609"
        mistakes: {"10009": square_each_term, "10309": missing_double}
      - prompt: "Use an identity to work out 48 × 52."
        answer: "2496"
        check: "48*52"
        difficulty: 1
        hints: ["48 = 50 − 2 and 52 = 50 + 2.", "50² − 2²."]
        solution: "(50 − 2)(50 + 2) = 2500 − 4 = 2496"
        mistakes: {"2504": sum_not_difference}
      - prompt: "Use an identity to work out 199²."
        answer: "39601"
        check: "199^2"
        difficulty: 2
        hints: ["199 = 200 − 1.", "40000 − 2 × 200 × 1 + 1."]
        solution: "(200 − 1)² = 40000 − 400 + 1 = 39601"
        mistakes: {"39999": square_each_term, "40401": sign_middle, "39599": sign_last}
      - prompt: "Use an identity to work out 95 × 105."
        answer: "9975"
        check: "95*105"
        difficulty: 2
        hints: ["95 = 100 − 5 and 105 = 100 + 5."]
        solution: "(100 − 5)(100 + 5) = 10000 − 25 = 9975"
        mistakes: {"10025": sum_not_difference}
      - prompt: "Use an identity to work out 1001²."
        answer: "1002001"
        check: "1001^2"
        difficulty: 2
        hints: ["1001 = 1000 + 1."]
        solution: "(1000 + 1)² = 1000000 + 2000 + 1 = 1002001"
        mistakes: {"1000001": square_each_term}
      - prompt: "Use an identity to work out 10.5². Decimals are fine."
        answer: "110.25"
        check: "10.5^2"
        difficulty: 3
        hints: ["10.5 = 10 + 0.5.", "100 + 2 × 10 × 0.5 + 0.25."]
        solution: "(10 + 0.5)² = 100 + 10 + 0.25 = 110.25"
        mistakes: {"100.25": square_each_term}
      - prompt: "What is 101² − 99²?"
        answer: "400"
        check: "101^2 - 99^2"
        difficulty: 3
        hints: ["Use a² − b² = (a + b)(a − b).", "(101 + 99)(101 − 99)."]
        solution: "(101 + 99)(101 − 99) = 200 × 2 = 400"
        mistakes: {"4": squared_difference}
