# Class 9 Mathematics, chapter 4. Format: content/README.md.
# Mistake tags square_each_term, missing_double, sign_middle, sign_last, sum_not_difference,
# extra_middle_term and product_terms have tips in English and Malayalam in backend/app/i18n.py.
subject: math
chapter: 4
title: Multiplication Identities

tips:
  sign_product: "Watch the signs: a plus times a minus gives a minus, and a minus times a minus gives a plus."
  square_coefficient: "Square the number in front too: (2y)² = 2y × 2y = 4y², not 2y²."
  squared_difference: "a² − b² is not (a − b)². Use a² − b² = (a + b)(a − b)."
  diff_squares_not_square: "a² − b² is (a + b)(a − b), not (a − b)² or (a + b)²."
  diff_squares_use: "x² − y² = (x + y)(x − y). Put in x + y = 10 and divide."
  product_constant: "The constant terms multiply: 3 × b = 12."

concepts:
  - code: math9.ident.bracket_product
    title: Multiplying two sums
    notes: |
      (a + b)(c + d) = ac + ad + bc + bd: every part of the first times every part of the second.
      For numbers, 23 × 15 = (20 + 3)(10 + 5) = 200 + 100 + 30 + 15 = 345. For letters,
      (x + a)(x + b) = x² + (a + b)x + ab.
    explanations:
      text: "To multiply two sums, multiply each part of the first by each part of the second, then add: (a + b)(c + d) = ac + ad + bc + bd. With numbers, 23 × 15 = (20 + 3) × (10 + 5) = 200 + 100 + 30 + 15 = 345. With letters, (x + 4)(x + 5) = x² + 5x + 4x + 20 = x² + 9x + 20."
      visual: "Draw a rectangle 23 long and 15 wide. Split the length into 20 and 3, and the width into 10 and 5. You get four smaller rectangles: 20 × 10 = 200, 20 × 5 = 100, 3 × 10 = 30 and 3 × 5 = 15. Together they make 345."
      step_by_step: "For (x + 4)(x + 5): Step 1: x × x = x². Step 2: x × 5 = 5x. Step 3: 4 × x = 4x. Step 4: 4 × 5 = 20. Step 5: Add and collect: x² + 9x + 20."
      real_world: "A 40 m by 30 m school field is made 5 m longer and 2 m wider. The new area is (40 + 5)(30 + 2) = 1200 + 80 + 150 + 10 = 1440 m²."
    picture:
      kind: area_grid
      cols:
      - {size: 20, label: '20'}
      - {size: 3, label: '3'}
      rows:
      - {size: 10, label: '10'}
      - {size: 5, label: '5'}
      cells:
      - ['200', '30']
      - ['100', '15']
      caption: 23 × 15 = 200 + 30 + 100 + 15 = 345
      alt: A 23 by 15 rectangle split into 20 by 10 (200), 3 by 10 (30), 20 by 5 (100) and 3 by 5 (15), which add to 345.
    activity:
      type: formula
      prompt: Three expressions. One is (x + 2)(x + 3) multiplied out correctly; the last one is a common slip.
      inputs:
      - name: x
        label: x
        min: 0
        max: 12
        step: 1
        start: 1
      outputs:
      - name: p
        label: (x + 2)(x + 3)
        expr: (x+2)*(x+3)
      - name: q
        label: x² + 5x + 6
        expr: x^2+5*x+6
      - name: r
        label: x² + 6
        expr: x^2+6
      goals:
      - prompt: Make (x + 2)(x + 3) equal 56. Which of the other two always agrees with it?
        want:
          p: 56
      - prompt: x² + 6 is the slip. Find the only x where it agrees with (x + 2)(x + 3).
        want:
          p: 6
    lesson:
      - teach: 'To multiply 23 × 15, split both numbers: 23 = 20 + 3 and 15 = 10 + 5. Draw a rectangle 23 long and 15 wide, and cut it into four boxes. The four areas are 20 × 10, 20 × 5, 3 × 10 and 3 × 5. Added, they give 200 + 100 + 30 + 15 = 345.'
        picture:
          kind: area_grid
          cols:
          - size: 20
            label: '20'
          - size: 3
            label: '3'
          rows:
          - size: 10
            label: '10'
          - size: 5
            label: '5'
          cells:
          - - '200'
            - '30'
          - - '100'
            - '15'
          caption: 23 × 15 = 200 + 30 + 100 + 15 = 345
          alt: A 23 by 15 rectangle cut into four boxes of 200, 30, 100 and 15.
        check:
          prompt: Split 12 × 13 as (10 + 2)(10 + 3). How many boxes do you add?
          options:
          - '4'
          - '2'
          - '3'
          answer: '4'
          why: 'Each of the 2 parts of the first number meets each of the 2 parts of the second: 2 × 2 = 4 boxes (100, 30, 20 and 6).'
        ways:
        - style: real_world
          teach: Buying 23 notebooks at ₹15 each? Pay for 20 notebooks at ₹10 (₹200), then 20 at the extra ₹5 (₹100), then 3 at ₹10 (₹30), then 3 at ₹5 (₹15). Four small bills add to ₹345. Splitting both numbers gives four small products to add.
      - teach: 'The same works with letters: (a + b)(c + d) = ac + ad + bc + bd. Every part of the first bracket multiplies every part of the second. Leaving one out is the most common slip.'
        check:
          prompt: Which is (a + 2)(b + 5)?
          options:
          - ab + 5a + 2b + 10
          - ab + 10
          - ab + 7
          answer: ab + 5a + 2b + 10
          why: 'a × b, a × 5, 2 × b and 2 × 5: all four products.'
        ways:
        - style: step_by_step
          teach: 'Step 1: take the first part of the first bracket, a, and multiply it by each part of the second: ac and ad. Step 2: take the second part, b, and do the same: bc and bd. Step 3: write all four and add. Count them: two parts times two parts must give four products.'
      - teach: 'When both brackets start with x, two of the products are x terms and can be added: (x + 4)(x + 5) = x² + 5x + 4x + 20 = x² + 9x + 20. The middle number is 4 + 5 and the last number is 4 × 5. With a minus sign, keep the sign with its number: (x − 3)(x + 7) = x² + 4x − 21.'
        check:
          prompt: (x + 2)(x + 6) = x² + ?x + 12. What is the middle number?
          options:
          - '8'
          - '12'
          - '2'
          answer: '8'
          why: The x terms are 6x and 2x, which add to 8x. The last term is 2 × 6 = 12.
        ways:
        - style: step_by_step
          teach: 'Step 1: x times x gives x². Step 2: the two x terms come from x times each number; add the numbers, keeping their signs. Step 3: the last term is the two numbers multiplied, keeping signs. For (x + 4)(x + 5): x², then (4 + 5)x = 9x, then 4 × 5 = 20.'
    items:
      - prompt: "Use (20 + 3)(10 + 5) to work out 23 × 15."
        answer: "345"
        check: "23*15"
        difficulty: 1
        hints: ["Multiply each part of the first bracket by each part of the second.", "20 × 10, 20 × 5, 3 × 10 and 3 × 5."]
        solution: "Step 1: 20 × 10 = 200 and 20 × 5 = 100. Step 2: 3 × 10 = 30 and 3 × 5 = 15. Step 3: 200 + 100 + 30 + 15 = 345."
        mistakes: {"215": product_terms}
      - prompt: "Expand (x + 4)(x + 5)."
        options: ["x² + 9x + 20", "x² + 20", "x² + 9x + 9", "x² + 20x + 9"]
        answer: "x² + 9x + 20"
        check: "expand((x + 4)*(x + 5))"
        difficulty: 1
        hints: ["x × x, x × 5, 4 × x and 4 × 5.", "Add the two x terms."]
        solution: "x² + 5x + 4x + 20 = x² + 9x + 20"
        mistakes: {"x² + 20": product_terms}
      - prompt: "Expand (x − 3)(x + 7)."
        options: ["x² + 4x − 21", "x² − 21", "x² − 4x − 21", "x² + 4x + 21"]
        answer: "x² + 4x − 21"
        check: "expand((x - 3)*(x + 7))"
        difficulty: 2
        hints: ["−3 × 7 is negative.", "The x terms are 7x and −3x."]
        solution: "x² + 7x − 3x − 21 = x² + 4x − 21"
        mistakes: {"x² − 21": product_terms, "x² + 4x + 21": sign_product, "x² − 4x − 21": sign_product}
      - prompt: "Expand (a + 2)(b + 3)."
        options: ["ab + 3a + 2b + 6", "ab + 6", "ab + 5", "ab + 2a + 3b + 6"]
        answer: "ab + 3a + 2b + 6"
        check: "expand((a + 2)*(b + 3))"
        difficulty: 2
        hints: ["a × b, a × 3, 2 × b and 2 × 3.", "No terms here can be collected."]
        solution: "Step 1: a × b = ab and a × 3 = 3a. Step 2: 2 × b = 2b and 2 × 3 = 6. Step 3: ab + 3a + 2b + 6."
        mistakes: {"ab + 6": product_terms}
      - prompt: "(x + 3)(x + b) = x² + 7x + 12. What is b?"
        answer: "4"
        check: "12/3"
        difficulty: 2
        hints: ["The last term, 12, is 3 × b.", "Check with the middle term: 3 + b should be 7."]
        solution: "Step 1: 3 × b = 12, so b = 4. Step 2: Check: 3 + 4 = 7, the middle number."
        mistakes: {"9": "product_constant", "7": "product_constant"}
      - prompt: "Expand (2x + 3)(3x − 1)."
        options: ["6x² + 7x − 3", "6x² − 3", "5x² + 7x − 3", "6x² + 11x − 3"]
        answer: "6x² + 7x − 3"
        check: "expand((2*x + 3)*(3*x - 1))"
        difficulty: 3
        hints: ["2x × 3x = 6x².", "The x terms are −2x and 9x."]
        solution: "6x² − 2x + 9x − 3 = 6x² + 7x − 3"
        mistakes: {"6x² − 3": product_terms}
      - prompt: "Use (100 + 2)(100 + 5) to work out 102 × 105."
        answer: "10710"
        check: "102*105"
        difficulty: 3
        hints: ["100 × 100, 100 × 5, 2 × 100 and 2 × 5."]
        solution: "Step 1: 10000 + 500 + 200 + 10. Step 2: = 10710."
        mistakes: {"10010": product_terms}
      - prompt: "Use (30 + 4)(20 + 1) to work out 34 × 21."
        answer: "714"
        check: "34*21"
        difficulty: 2
        hints: ["Multiply every part of the first bracket by every part of the second.", "600 + 30 + 80 + 4."]
        solution: "Step 1: 30 × 20 = 600, 30 × 1 = 30, 4 × 20 = 80, 4 × 1 = 4. Step 2: 600 + 30 + 80 + 4 = 714."
        mistakes: {"604": product_terms, "634": product_terms}
      - prompt: "(x + a)(x + 3) = x² + 8x + 15. What is a?"
        answer: "5"
        check: "15/3"
        difficulty: 3
        hints: ["The last term is a × 3.", "Also a + 3 must be 8. Check both."]
        solution: "Step 1: a × 3 = 15, so a = 5. Step 2: Check the middle term: 5 + 3 = 8."
        mistakes: {"12": product_constant, "8": product_constant}
      - prompt: "Expand (x − 2)(x − 6)."
        options: ["x² − 8x + 12", "x² − 8x − 12", "x² + 8x + 12", "x² − 4x + 12"]
        answer: "x² − 8x + 12"
        difficulty: 3
        hints: ["−2 × −6 is positive.", "The middle term is (−2) + (−6) lots of x."]
        solution: "Step 1: x × x = x². Step 2: x × (−6) + (−2) × x = −8x. Step 3: (−2) × (−6) = +12."
        mistakes: {"x² − 8x − 12": sign_product, "x² + 8x + 12": sign_product}
      - prompt: Use (10 + 2)(10 + 3) to work out 12 × 13.
        answer: '156'
        check: 12*13
        difficulty: 1
        hints:
        - Multiply each part of the first bracket by each part of the second.
        - 100 + 30 + 20 + 6.
        solution: 'Step 1: 10 × 10 = 100 and 10 × 3 = 30. Step 2: 2 × 10 = 20 and 2 × 3 = 6. Step 3: 100 + 30 + 20 + 6 = 156.'
        mistakes:
          '106': product_terms
      - prompt: Expand (x + 2)(x + 3).
        options:
        - x² + 5x + 6
        - x² + 6
        - x² + 6x + 5
        - x² + 5x + 5
        answer: x² + 5x + 6
        check: expand((x + 2)*(x + 3))
        difficulty: 1
        hints:
        - 'Four products: x × x, x × 3, 2 × x, 2 × 3.'
        - Add the two x terms together.
        solution: 'Step 1: x² + 3x + 2x + 6. Step 2: 3x + 2x = 5x. Step 3: So it is x² + 5x + 6.'
        mistakes:
          x² + 6: product_terms
          x² + 6x + 5: product_constant
      - prompt: Expand (x + 5)(x − 2).
        options:
        - x² + 3x − 10
        - x² − 3x − 10
        - x² + 3x + 10
        - x² − 10
        answer: x² + 3x − 10
        check: expand((x + 5)*(x - 2))
        difficulty: 2
        hints:
        - Keep the minus sign with the 2.
        - The x terms are −2x and +5x.
        solution: 'Step 1: x² − 2x + 5x − 10. Step 2: −2x + 5x = 3x. Step 3: So it is x² + 3x − 10.'
        mistakes:
          x² − 3x − 10: sign_middle
          x² + 3x + 10: sign_product
          x² − 10: product_terms
      - prompt: (x + a)(x + 2) = x² + 9x + 14. What is a?
        answer: '7'
        check: 14/2
        difficulty: 2
        hints:
        - The last term, 14, is a × 2.
        - 'Check with the middle number: a + 2 should be 9.'
        solution: 'Step 1: 2 × a = 14, so a = 7. Step 2: Check: 7 + 2 = 9, the middle number. Step 3: So a = 7.'
        mistakes:
          '9': product_constant
          '12': product_constant
      - prompt: Expand (3x + 2)(x + 4).
        options:
        - 3x² + 14x + 8
        - 3x² + 8
        - 3x² + 12x + 8
        - 4x² + 14x + 8
        answer: 3x² + 14x + 8
        check: expand((3*x + 2)*(x + 4))
        difficulty: 3
        hints:
        - 3x × x, 3x × 4, 2 × x and 2 × 4.
        - The x terms are 12x and 2x.
        solution: 'Step 1: 3x² + 12x + 2x + 8. Step 2: 12x + 2x = 14x. Step 3: So it is 3x² + 14x + 8.'
        mistakes:
          3x² + 8: product_terms
          3x² + 12x + 8: product_terms
      - prompt: Use (200 + 3)(100 + 1) to work out 203 × 101.
        answer: '20503'
        check: 203*101
        difficulty: 3
        hints:
        - 'Four products: 200 × 100, 200 × 1, 3 × 100, 3 × 1.'
        - 20000 + 200 + 300 + 3.
        solution: 'Step 1: 200 × 100 = 20000 and 200 × 1 = 200. Step 2: 3 × 100 = 300 and 3 × 1 = 3. Step 3: 20000 + 200 + 300 + 3 = 20503.'
        mistakes:
          '20003': product_terms

  - code: math9.ident.square_of_sum
    title: "Square of a sum: (a + b)²"
    after: [math9.ident.bracket_product]
    notes: |
      (a + b)² = a² + 2ab + b²: the square of the first, twice the product, the square of the
      second. The common mistake is a² + b², leaving out 2ab.
    explanations:
      text: "(x + 5)² means (x + 5)(x + 5). Multiplying out gives x² + 5x + 5x + 25 = x² + 10x + 25. In general (a + b)² = a² + 2ab + b²: the square of the first, twice the product, and the square of the second."
      visual: "Draw a square with side a + b and split each side into a and b. Inside are a square a × a, a square b × b and two rectangles a × b. So (a + b)² = a² + 2ab + b². Forgetting the two rectangles is the most common mistake."
      step_by_step: "For (2y + 3)²: Step 1: Square the first term: (2y)² = 4y². Step 2: Twice the product: 2 × 2y × 3 = 12y. Step 3: Square the last term: 9. Step 4: 4y² + 12y + 9."
      real_world: "A square photo 15 cm wide gets a 2 cm frame on every side, so its side becomes 19 cm. The area with the frame is (15 + 4)² = 225 + 120 + 16 = 361 cm²."
    picture:
      kind: area_grid
      cols:
      - {size: 3, label: a}
      - {size: 1.5, label: b}
      rows:
      - {size: 3, label: a}
      - {size: 1.5, label: b}
      cells:
      - [a², ab]
      - [ab, b²]
      caption: (a + b)² = a² + 2ab + b²
      alt: A square of side a + b split into a², b² and two ab rectangles, so (a + b)² = a² + 2ab + b².
    activity:
      type: formula
      prompt: (a + b)² is a² + b² plus something more. Find out what.
      inputs:
      - name: a
        label: a
        min: 0
        max: 10
        step: 1
        start: 0
      - name: b
        label: b
        min: 0
        max: 10
        step: 1
        start: 0
      outputs:
      - name: sq
        label: (a + b)²
        expr: (a+b)^2
      - name: parts
        label: a² + b²
        expr: a^2+b^2
      - name: gap
        label: The difference
        expr: (a+b)^2-a^2-b^2
      goals:
      - prompt: Make (a + b)² = 49 and a² + b² = 25. The difference is 2ab.
        want:
          sq: 49
          parts: 25
        mistakes:
        - when:
            sq: 49
          say: (a + b)² is 49, so a + b = 7, but a² + b² isn't 25. Which pair adding to 7 also has squares adding to 25?
        - when:
            parts: 25
          say: 'a² + b² is 25, but (a + b)² isn''t 49. Notice: (a + b)² is always bigger by the difference shown.'
    lesson:
      - teach: '(a + b)² means (a + b) × (a + b). Draw a square with side a + b and cut it up: you get an a by a square, a b by b square, and two a by b rectangles. So (a + b)² = a² + 2ab + b².'
        picture:
          kind: area_grid
          cols:
          - size: 3
            label: a
          - size: 1.5
            label: b
          rows:
          - size: 3
            label: a
          - size: 1.5
            label: b
          cells:
          - - a²
            - ab
          - - ab
            - b²
          caption: (a + b)² = a² + 2ab + b²
          alt: A square of side a + b cut into a², two rectangles ab, and b².
        check:
          prompt: How many a by b rectangles are inside a square of side a + b?
          options:
          - '2'
          - '1'
          - '4'
          answer: '2'
          why: One in each of the two corners that aren't squares, so the middle term is 2ab.
        ways:
        - style: step_by_step
          teach: 'Step 1: (a + b)² is (a + b) × (a + b). Step 2: multiply every part by every part: a × a, a × b, b × a, b × b. Step 3: a × b and b × a are the same, so there are two of them. Step 4: so (a + b)² = a² + 2ab + b².'
      - teach: 'The rule in words: the square of the first, plus twice the first times the second, plus the square of the second. (x + 5)² = x² + 2 × x × 5 + 25 = x² + 10x + 25. Writing just x² + 25 forgets the two rectangles.'
        check:
          prompt: Which is (x + 3)²?
          options:
          - x² + 6x + 9
          - x² + 9
          - x² + 3x + 9
          answer: x² + 6x + 9
          why: x², then 2 × x × 3 = 6x, then 3² = 9.
        ways:
        - style: real_world
          teach: 'A square courtyard 5 m on a side is enlarged by x m each way. The new area is not just the old square plus the new corner square: the two long strips along the sides are added too. So (x + 5)² = x² + 10x + 25, and the 10x is those two strips.'
      - teach: 'Square the whole first term: (2y + 3)² starts with (2y)² = 4y², not 2y². The middle is 2 × 2y × 3 = 12y. So (2y + 3)² = 4y² + 12y + 9.'
        check:
          prompt: What is the first term of (3m + 1)²?
          options:
          - 9m²
          - 3m²
          - 6m
          answer: 9m²
          why: (3m)² = 3m × 3m = 9m².
        ways:
        - style: step_by_step
          teach: 'Step 1: treat the whole first term as one block, 2y. Step 2: square the block: (2y)² = 2y × 2y = 4y². Step 3: twice the block times the second: 2 × 2y × 3 = 12y. Step 4: square the second: 9. Don''t square just the letter.'
      - teach: It also helps with numbers and with facts about a and b. 41² = (40 + 1)² = 1600 + 80 + 1 = 1681. And if you know a + b and ab, then a² + b² = (a + b)² − 2ab.
        check:
          prompt: a + b = 5 and ab = 6. What is a² + b²?
          options:
          - '13'
          - '25'
          - '19'
          answer: '13'
          why: (a + b)² = 25 = a² + b² + 2ab = a² + b² + 12, so a² + b² = 13.
        ways:
        - style: step_by_step
          teach: 'Step 1: write 41 as 40 + 1. Step 2: square the first, 1600. Step 3: twice the first times the second, 80. Step 4: square the second, 1. Add: 1681. For a² + b²: (a + b)² holds a² + b² plus an extra 2ab, so take 2ab away.'
    items:
      - prompt: "Expand (x + 5)²."
        options: ["x² + 10x + 25", "x² + 25", "x² + 5x + 25", "x² + 10x + 10"]
        answer: "x² + 10x + 25"
        check: "expand((x + 5)^2)"
        difficulty: 1
        hints: ["(x + 5)² = (x + 5)(x + 5).", "First squared, twice the product, last squared."]
        solution: "x² + 2(x)(5) + 5² = x² + 10x + 25"
        mistakes: {"x² + 25": square_each_term, "x² + 5x + 25": missing_double}
      - prompt: "Expand (y + 1)²."
        options: ["y² + 2y + 1", "y² + 1", "y² + y + 1", "y² + 2y + 2"]
        answer: "y² + 2y + 1"
        check: "expand((y + 1)^2)"
        difficulty: 1
        hints: ["Twice the product: 2 × y × 1."]
        solution: "y² + 2(y)(1) + 1² = y² + 2y + 1"
        mistakes: {"y² + 1": square_each_term, "y² + y + 1": missing_double}
      - prompt: "Expand (2y + 3)²."
        options: ["4y² + 12y + 9", "4y² + 9", "2y² + 12y + 9", "4y² + 6y + 9"]
        answer: "4y² + 12y + 9"
        check: "expand((2*y + 3)^2)"
        difficulty: 2
        hints: ["(2y)² = 4y².", "Twice the product: 2 × 2y × 3."]
        solution: "(2y)² + 2(2y)(3) + 3² = 4y² + 12y + 9"
        mistakes: {"4y² + 9": square_each_term, "4y² + 6y + 9": missing_double, "2y² + 12y + 9": square_coefficient}
      - prompt: "If a + b = 9 and ab = 14, what is a² + b²?"
        answer: "53"
        check: "9^2 - 2*14"
        difficulty: 2
        hints: ["(a + b)² = a² + 2ab + b².", "So a² + b² = (a + b)² − 2ab."]
        solution: "Step 1: a² + b² = (a + b)² − 2ab. Step 2: = 81 − 28. Step 3: = 53."
        mistakes: {"81": missing_double, "67": missing_double}
      - prompt: "Expand (3m + 2n)²."
        options: ["9m² + 12mn + 4n²", "9m² + 4n²", "9m² + 6mn + 4n²", "3m² + 12mn + 2n²"]
        answer: "9m² + 12mn + 4n²"
        check: "expand((3*m + 2*n)^2)"
        difficulty: 3
        hints: ["(3m)² = 9m² and (2n)² = 4n².", "Twice the product: 2 × 3m × 2n."]
        solution: "(3m)² + 2(3m)(2n) + (2n)² = 9m² + 12mn + 4n²"
        mistakes: {"9m² + 4n²": square_each_term, "9m² + 6mn + 4n²": missing_double, "3m² + 12mn + 2n²": square_coefficient}
      - prompt: "(x + k)² = x² + 14x + 49. What is k?"
        answer: "7"
        check: "14/2"
        difficulty: 3
        hints: ["The middle term is 2 × x × k.", "2k = 14. Check: k² should be 49."]
        solution: "Step 1: 2k = 14, so k = 7. Step 2: Check: 7² = 49."
        mistakes: {"14": missing_double}
      - prompt: "Use (40 + 1)² to work out 41²."
        answer: "1681"
        check: "41**2"
        difficulty: 2
        hints: ["(a + b)² = a² + 2ab + b².", "1600 + 80 + 1."]
        solution: "Step 1: 40² = 1600. Step 2: 2 × 40 × 1 = 80. Step 3: 1² = 1, total 1681."
        mistakes: {"1601": missing_double, "1602": missing_double}
      - prompt: "If x + 1/x = 5, what is x² + 1/x²?"
        answer: "23"
        check: "5**2 - 2"
        difficulty: 3
        hints: ["Square both sides of x + 1/x = 5.", "(x + 1/x)² = x² + 2 + 1/x², because x × 1/x = 1."]
        solution: "Step 1: (x + 1/x)² = 25. Step 2: x² + 2 + 1/x² = 25. Step 3: x² + 1/x² = 23."
        mistakes: {"25": missing_double, "27": missing_double}
      - prompt: "A square of side a + b is cut into pieces. Which set of pieces makes it up?"
        options: ["One a by a square, one b by b square and two a by b rectangles", "One a by a square and one b by b square", "One a by a square, one b by b square and one a by b rectangle", "Two a by a squares and two b by b squares"]
        answer: "One a by a square, one b by b square and two a by b rectangles"
        difficulty: 3
        hints: ["Draw the square and cut each side at the point a from the corner.", "The two rectangles are the 2ab."]
        solution: "Step 1: Cutting both sides at a gives four pieces. Step 2: They are a², b² and two ab rectangles. Step 3: So (a + b)² = a² + 2ab + b²."
        mistakes: {"One a by a square and one b by b square": square_each_term, "One a by a square, one b by b square and one a by b rectangle": missing_double}
      - prompt: Expand (x + 3)².
        options:
        - x² + 6x + 9
        - x² + 9
        - x² + 3x + 9
        - x² + 6x + 6
        answer: x² + 6x + 9
        check: expand((x + 3)**2)
        difficulty: 1
        hints:
        - Square the first, twice the product, square the second.
        - Twice the product is 2 × x × 3.
        solution: 'Step 1: x² from x × x. Step 2: 2 × x × 3 = 6x. Step 3: 3² = 9, so x² + 6x + 9.'
        mistakes:
          x² + 9: missing_double
          x² + 3x + 9: missing_double
      - prompt: Use (30 + 2)² to work out 32².
        answer: '1024'
        check: 32**2
        difficulty: 1
        hints:
        - 30² + 2 × 30 × 2 + 2².
        - 900 + 120 + 4.
        solution: 'Step 1: 30² = 900. Step 2: 2 × 30 × 2 = 120. Step 3: 2² = 4, so 32² = 1024.'
        mistakes:
          '904': missing_double
      - prompt: Expand (4a + 1)².
        options:
        - 16a² + 8a + 1
        - 4a² + 8a + 1
        - 16a² + 1
        - 16a² + 4a + 1
        answer: 16a² + 8a + 1
        check: expand((4*a + 1)**2)
        difficulty: 2
        hints:
        - 'Square the whole first term: (4a)².'
        - Twice the product is 2 × 4a × 1.
        solution: 'Step 1: (4a)² = 16a². Step 2: 2 × 4a × 1 = 8a. Step 3: 1² = 1, so 16a² + 8a + 1.'
        mistakes:
          4a² + 8a + 1: square_coefficient
          16a² + 1: missing_double
      - prompt: If a + b = 7 and ab = 10, what is a² + b²?
        answer: '29'
        check: 7**2 - 2*10
        difficulty: 2
        hints:
        - (a + b)² = a² + b² + 2ab.
        - 49 = a² + b² + 20.
        solution: 'Step 1: (a + b)² = 49. Step 2: 2ab = 20. Step 3: a² + b² = 49 − 20 = 29.'
        mistakes:
          '49': missing_double
          '39': missing_double
      - prompt: (x + k)² = x² + 18x + 81. What is k?
        answer: '9'
        check: 18/2
        difficulty: 3
        hints:
        - The middle term is 2 × k × x.
        - 2k = 18.
        solution: 'Step 1: 2k = 18. Step 2: k = 9. Step 3: Check: 9² = 81, the last term.'
        mistakes:
          '18': missing_double
      - prompt: Expand (x + 2y)².
        options:
        - x² + 4xy + 4y²
        - x² + 2xy + 4y²
        - x² + 4y²
        - x² + 4xy + 2y²
        answer: x² + 4xy + 4y²
        check: expand((x + 2*y)**2)
        difficulty: 3
        hints:
        - The second term is 2y; square all of it.
        - Twice the product is 2 × x × 2y.
        solution: 'Step 1: x². Step 2: 2 × x × 2y = 4xy. Step 3: (2y)² = 4y², so x² + 4xy + 4y².'
        mistakes:
          x² + 2xy + 4y²: missing_double
          x² + 4xy + 2y²: square_coefficient

  - code: math9.ident.square_of_difference
    title: "Square of a difference: (a − b)²"
    after: [math9.ident.square_of_sum]
    notes: |
      (a − b)² = a² − 2ab + b². The middle term is negative; the last term is positive.
      (x − y)² and (y − x)² are equal.
    explanations:
      text: "(x − 4)² = (x − 4)(x − 4) = x² − 4x − 4x + 16 = x² − 8x + 16. In general (a − b)² = a² − 2ab + b². The middle term takes the minus sign, but the last term is positive, because −4 × −4 = +16."
      visual: "Start with a square of side a. Cut a strip of width b off the right side and another off the top. Each strip has area ab, but the small b × b corner was cut away twice, so add it back once: a² − 2ab + b²."
      step_by_step: "For (3k − 1)²: Step 1: Square the first term: 9k². Step 2: Twice the product, with the minus sign: −2 × 3k × 1 = −6k. Step 3: Square the last term: (−1)² = 1. Step 4: 9k² − 6k + 1."
      real_world: "To work out 99² in your head: (100 − 1)² = 10000 − 200 + 1 = 9801."
    picture:
      kind: area_grid
      cols:
      - {size: 3, label: a − b}
      - {size: 1.2, label: b}
      rows:
      - {size: 1.2, label: b}
      - {size: 3, label: a − b}
      cells:
      - [(a − b)b, b²]
      - [(a − b)², (a − b)b]
      caption: 'a² is all four pieces. Take away the two strips ab (which together hold b² twice) and add one b² back: (a − b)² = a² − 2ab + b².'
      alt: A square of side a split into (a − b)², two (a − b) by b strips and a b² corner, showing (a − b)² = a² − 2ab + b².
    activity:
      type: formula
      prompt: Compare (a − b)² with a² − 2ab + b².
      inputs:
      - name: a
        label: a
        min: 0
        max: 12
        step: 1
        start: 0
      - name: b
        label: b
        min: 0
        max: 12
        step: 1
        start: 0
      outputs:
      - name: sq
        label: (a − b)²
        expr: (a-b)^2
      - name: exp
        label: a² − 2ab + b²
        expr: a^2-2*a*b+b^2
      goals:
      - prompt: Keep a = 10 and make (a − b)² = 9.
        want:
          a: 10
          sq: 9
        mistakes:
        - when:
            sq: 9
          say: (a − b)² is 9, but a has to stay at 10.
    lesson:
      - teach: '(a − b)² works like (a + b)², with one change: the middle term is subtracted. (a − b)² = a² − 2ab + b². The last term stays plus, because (−b) × (−b) = +b².'
        check:
          prompt: What is the sign of the last term in (x − 4)²?
          options:
          - 'Plus: +16'
          - 'Minus: −16'
          answer: 'Plus: +16'
          why: (−4) × (−4) = +16, so (x − 4)² = x² − 8x + 16.
        ways:
        - style: real_world
          teach: 'Owing money twice cancels like this: losing ₹4 four times over a negative is a gain. (−4) × (−4) = +16. That is why the last term of (x − 4)² is +16, while the middle term, x times −4 twice, is −8x.'
      - teach: 'Example: (x − 6)² = x² − 2 × x × 6 + 36 = x² − 12x + 36. With a number in front: (3k − 1)² = 9k² − 6k + 1.'
        check:
          prompt: Which is (y − 5)²?
          options:
          - y² − 10y + 25
          - y² − 25
          - y² − 10y − 25
          answer: y² − 10y + 25
          why: y², then −2 × y × 5 = −10y, then (−5)² = +25.
        ways:
        - style: step_by_step
          teach: 'Step 1: square the first term: x². Step 2: twice the first times the second, with a minus sign: −2 × x × 6 = −12x. Step 3: square the second, always plus: +36. So (x − 6)² = x² − 12x + 36.'
      - teach: 'Use it for numbers just below a round number: 99² = (100 − 1)² = 10000 − 200 + 1 = 9801. And (x − y)² = (y − x)², because a number and its negative have the same square.'
        check:
          prompt: What is 49², using (50 − 1)²?
          options:
          - '2401'
          - '2499'
          - '2500'
          answer: '2401'
          why: 2500 − 100 + 1 = 2401.
        ways:
        - style: step_by_step
          teach: 'Step 1: write 99 as 100 − 1. Step 2: 100² = 10000. Step 3: subtract twice 100 × 1, which is 200: 9800. Step 4: add 1² = 1: 9801. Any number just below a round number squares this way.'
    items:
      - prompt: "Expand (x − 4)²."
        options: ["x² − 8x + 16", "x² − 16", "x² + 8x + 16", "x² − 8x − 16"]
        answer: "x² − 8x + 16"
        check: "expand((x - 4)^2)"
        difficulty: 1
        hints: ["Use a² − 2ab + b² with a = x and b = 4."]
        solution: "x² − 2(x)(4) + 4² = x² − 8x + 16"
        mistakes: {"x² − 16": square_each_term, "x² + 8x + 16": sign_middle, "x² − 8x − 16": sign_last}
      - prompt: "Expand (a − 1)²."
        options: ["a² − 2a + 1", "a² − 1", "a² + 2a + 1", "a² − a + 1"]
        answer: "a² − 2a + 1"
        check: "expand((a - 1)^2)"
        difficulty: 1
        hints: ["The middle term is −2 × a × 1."]
        solution: "a² − 2(a)(1) + 1² = a² − 2a + 1"
        mistakes: {"a² − 1": square_each_term, "a² + 2a + 1": sign_middle, "a² − a + 1": missing_double}
      - prompt: "Expand (3k − 1)²."
        options: ["9k² − 6k + 1", "9k² − 1", "9k² − 3k + 1", "3k² − 6k + 1"]
        answer: "9k² − 6k + 1"
        check: "expand((3*k - 1)^2)"
        difficulty: 2
        hints: ["(3k)² = 9k².", "The middle term is −2 × 3k × 1."]
        solution: "(3k)² − 2(3k)(1) + 1² = 9k² − 6k + 1"
        mistakes: {"9k² − 1": square_each_term, "9k² − 3k + 1": missing_double, "3k² − 6k + 1": square_coefficient}
      - prompt: "If a − b = 5 and ab = 6, what is a² + b²?"
        answer: "37"
        check: "5^2 + 2*6"
        difficulty: 2
        hints: ["(a − b)² = a² − 2ab + b².", "So a² + b² = (a − b)² + 2ab."]
        solution: "Step 1: a² + b² = (a − b)² + 2ab. Step 2: = 25 + 12. Step 3: = 37."
        mistakes: {"13": sign_middle, "25": missing_double}
      - prompt: "Use (100 − 1)² to work out 99²."
        answer: "9801"
        check: "99^2"
        difficulty: 2
        hints: ["100² − 2 × 100 × 1 + 1²."]
        solution: "Step 1: 10000 − 200 + 1. Step 2: = 9801."
        mistakes: {"9999": square_each_term, "10201": sign_middle, "9799": sign_last}
      - prompt: "Expand (2p − 5q)²."
        options: ["4p² − 20pq + 25q²", "4p² − 25q²", "4p² + 20pq + 25q²", "4p² − 10pq + 25q²"]
        answer: "4p² − 20pq + 25q²"
        check: "expand((2*p - 5*q)^2)"
        difficulty: 3
        hints: ["(2p)² = 4p² and (5q)² = 25q².", "The middle term is −2 × 2p × 5q."]
        solution: "(2p)² − 2(2p)(5q) + (5q)² = 4p² − 20pq + 25q²"
        mistakes: {"4p² − 25q²": square_each_term, "4p² + 20pq + 25q²": sign_middle, "4p² − 10pq + 25q²": missing_double}
      - prompt: "Which of these is equal to (x − y)²?"
        options: ["(y − x)²", "x² − y²", "(x + y)²", "x² + y²"]
        answer: "(y − x)²"
        check: "expand((x - y)^2)"
        difficulty: 3
        hints: ["Expand both (x − y)² and (y − x)².", "y − x is −(x − y), and squaring removes the minus."]
        solution: "Step 1: (x − y)² = x² − 2xy + y². Step 2: (y − x)² = y² − 2xy + x², the same."
        mistakes: {"x² − y²": square_each_term, "x² + y²": square_each_term}
      - prompt: "Use (50 − 2)² to work out 48²."
        answer: "2304"
        check: "48**2"
        difficulty: 2
        hints: ["(a − b)² = a² − 2ab + b².", "2500 − 200 + 4."]
        solution: "Step 1: 50² = 2500. Step 2: 2 × 50 × 2 = 200, taken away. Step 3: 2² = 4 added: 2304."
        mistakes: {"2496": square_each_term, "2296": sign_last}
      - prompt: "a + b = 10 and ab = 21. What is (a − b)²?"
        answer: "16"
        check: "10**2 - 4*21"
        difficulty: 3
        hints: ["(a − b)² = a² + b² − 2ab, and a² + b² = (a + b)² − 2ab.", "So (a − b)² = (a + b)² − 4ab."]
        solution: "Step 1: (a + b)² = 100. Step 2: (a − b)² = 100 − 4 × 21 = 16. Step 3: Check with a = 7, b = 3: (7 − 3)² = 16."
        mistakes: {"58": missing_double, "79": missing_double}
      - prompt: "(x − k)² = x² − 12x + 36. What is k?"
        answer: "6"
        check: "12/2"
        difficulty: 3
        hints: ["The middle term is −2kx.", "2k = 12."]
        solution: "Step 1: −2kx = −12x, so k = 6. Step 2: Check: k² = 36."
        mistakes: {"12": missing_double, "-6": sign_middle}
      - prompt: Expand (x − 3)².
        options:
        - x² − 6x + 9
        - x² − 9
        - x² + 6x + 9
        - x² − 6x − 9
        answer: x² − 6x + 9
        check: expand((x - 3)**2)
        difficulty: 1
        hints:
        - The middle term is minus twice the product.
        - −2 × x × 3 = −6x.
        solution: 'Step 1: x². Step 2: −2 × x × 3 = −6x. Step 3: (−3)² = +9, so x² − 6x + 9.'
        mistakes:
          x² − 9: missing_double
          x² + 6x + 9: sign_middle
          x² − 6x − 9: sign_last
      - prompt: Use (100 − 2)² to work out 98².
        answer: '9604'
        check: 98**2
        difficulty: 1
        hints:
        - 100² − 2 × 100 × 2 + 2².
        - 10000 − 400 + 4.
        solution: 'Step 1: 100² = 10000. Step 2: 2 × 100 × 2 = 400. Step 3: 10000 − 400 + 4 = 9604.'
        mistakes:
          '9996': missing_double
      - prompt: Expand (2x − 1)².
        options:
        - 4x² − 4x + 1
        - 2x² − 4x + 1
        - 4x² − 2x + 1
        - 4x² − 1
        answer: 4x² − 4x + 1
        check: expand((2*x - 1)**2)
        difficulty: 2
        hints:
        - (2x)² is the first term.
        - The middle term is −2 × 2x × 1.
        solution: 'Step 1: (2x)² = 4x². Step 2: −2 × 2x × 1 = −4x. Step 3: +1, so 4x² − 4x + 1.'
        mistakes:
          2x² − 4x + 1: square_coefficient
          4x² − 2x + 1: missing_double
          4x² − 1: missing_double
      - prompt: If a − b = 3 and ab = 10, what is a² + b²?
        answer: '29'
        check: 3**2 + 2*10
        difficulty: 2
        hints:
        - (a − b)² = a² + b² − 2ab.
        - 9 = a² + b² − 20.
        solution: 'Step 1: (a − b)² = 9. Step 2: 2ab = 20. Step 3: a² + b² = 9 + 20 = 29.'
        mistakes:
          '9': missing_double
          '19': missing_double
      - prompt: (x − k)² = x² − 20x + 100. What is k?
        answer: '10'
        check: 20/2
        difficulty: 3
        hints:
        - The middle term is −2 × k × x.
        - 2k = 20.
        solution: 'Step 1: 2k = 20. Step 2: k = 10. Step 3: Check: 10² = 100, the last term.'
        mistakes:
          '20': missing_double
      - prompt: a + b = 8 and ab = 12. What is (a − b)²?
        answer: '16'
        check: 8**2 - 4*12
        difficulty: 3
        hints:
        - (a − b)² = (a + b)² − 4ab.
        - 64 − 48.
        solution: 'Step 1: (a + b)² = a² + 2ab + b² = 64. Step 2: (a − b)² = a² − 2ab + b², which is 4ab less. Step 3: 64 − 48 = 16.'
        mistakes:
          '40': squared_difference

  - code: math9.ident.difference_of_squares
    title: "Sum times difference: (a + b)(a − b)"
    after: [math9.ident.bracket_product]
    notes: |
      (a + b)(a − b) = a² − b²: the middle terms cancel. Used backwards it factorises a
      difference of squares: x² − 49 = (x + 7)(x − 7). Also a² − b² is not (a − b)².
    explanations:
      text: "(x + 6)(x − 6) = x² − 6x + 6x − 36. The middle terms cancel, leaving x² − 36. In general (a + b)(a − b) = a² − b²: a sum times a difference of the same two terms gives the difference of their squares."
      visual: "Take a square of side a and cut a small square of side b from one corner. The L-shape left has area a² − b². Cut the L into two strips and move one: they make a rectangle with sides a + b and a − b."
      step_by_step: "For (2m + 3)(2m − 3): Step 1: It is a sum times a difference of the same two terms. Step 2: Square the first: (2m)² = 4m². Step 3: Square the second: 3² = 9. Step 4: Subtract: 4m² − 9."
      real_world: "A square courtyard of side 20 m has a square water tank of side 4 m in one corner. The paved area is 20² − 4² = (20 + 4)(20 − 4) = 24 × 16 = 384 m²."
    picture:
      kind: area_grid
      cols:
      - {size: 3, label: a − b}
      - {size: 1.3, label: b}
      rows:
      - {size: 1.3, label: b}
      - {size: 3, label: a − b}
      cells:
      - [(a − b)b, b² (cut out)]
      - [(a − b)², (a − b)b]
      caption: Cut b² from the corner of a². The L-shape left, a² − b², rearranges into a strip (a + b) long and (a − b) wide.
      alt: A square of side a with a small b² square cut from one corner. The L-shape left has area a² − b², which equals (a + b)(a − b).
    activity:
      type: formula
      prompt: '(a + b)(a − b) and a² − b²: are they always equal?'
      inputs:
      - name: a
        label: a
        min: 0
        max: 12
        step: 1
        start: 0
      - name: b
        label: b
        min: 0
        max: 12
        step: 1
        start: 0
      outputs:
      - name: s
        label: a + b
        expr: a+b
      - name: p
        label: (a + b)(a − b)
        expr: (a+b)*(a-b)
      - name: q
        label: a² − b²
        expr: a^2-b^2
      goals:
      - prompt: Make a + b = 10 and a² − b² = 40.
        want:
          s: 10
          q: 40
        hint: 'Watch (a + b)(a − b) and a² − b²: they always match. So 40 = 10 × (a − b).'
        mistakes:
        - when:
            s: 10
          say: 'a + b = 10, but a² − b² isn''t 40. a² − b² = (a + b)(a − b), so think: 10 × what = 40?'
        - when:
            q: 40
          say: a² − b² = 40, but a + b isn't 10 yet.
    lesson:
      - teach: 'Multiply (a + b)(a − b): a² − ab + ab − b². The middle terms cancel, leaving a² − b². So a sum times a difference of the same two things is a difference of squares.'
        check:
          prompt: What is (x + 3)(x − 3)?
          options:
          - x² − 9
          - x² + 9
          - x² − 6x − 9
          answer: x² − 9
          why: −3x and +3x cancel, leaving x² − 9.
        ways:
        - style: step_by_step
          teach: 'Step 1: multiply every part: a × a = a², a × (−b) = −ab, b × a = +ab, b × (−b) = −b². Step 2: −ab and +ab cancel. Step 3: what is left is a² − b². So same two terms, one plus and one minus, gives a square minus a square.'
      - teach: 'Used backwards, it factorises: x² − 49 = (x + 7)(x − 7), because 49 = 7². And 9x² − 16 = (3x + 4)(3x − 4). Careful: a² − b² is not (a − b)², which has a middle term.'
        check:
          prompt: Which equals y² − 64?
          options:
          - (y + 8)(y − 8)
          - (y − 8)²
          - (y − 32)(y + 2)
          answer: (y + 8)(y − 8)
          why: 64 = 8², so y² − 64 = (y + 8)(y − 8). (y − 8)² would be y² − 16y + 64.
        ways:
        - style: step_by_step
          teach: 'Step 1: check both terms are perfect squares with a minus between them: x² and 49. Step 2: take their roots: x and 7. Step 3: write (root + root)(root − root): (x + 7)(x − 7). If there is a plus between them, or a middle term, this rule does not apply.'
      - teach: It makes some sums quick. 61 × 59 = (60 + 1)(60 − 1) = 3600 − 1 = 3599. And 53² − 47² = (53 + 47)(53 − 47) = 100 × 6 = 600.
        check:
          prompt: What is 21 × 19, using (20 + 1)(20 − 1)?
          options:
          - '399'
          - '401'
          - '400'
          answer: '399'
          why: 20² − 1² = 400 − 1 = 399.
        ways:
        - style: real_world
          teach: A shopkeeper multiplies 61 × 59 in her head. Both are 1 away from 60, one above and one below. So she does 60 × 60 = 3600 and takes away 1 × 1 = 1. Answer 3599. Pairs that sit equally either side of a round number are quick this way.
    items:
      - prompt: "Expand (x + 6)(x − 6)."
        options: ["x² − 36", "x² + 36", "x² − 12x − 36", "x² − 12"]
        answer: "x² − 36"
        check: "expand((x + 6)*(x - 6))"
        difficulty: 1
        hints: ["The middle terms −6x and +6x cancel."]
        solution: "x² − 6x + 6x − 36 = x² − 36"
        mistakes: {"x² + 36": sum_not_difference, "x² − 12x − 36": extra_middle_term}
      - prompt: "Which product equals y² − 25?"
        options: ["(y + 5)(y − 5)", "(y − 5)²", "(y + 5)²", "(y + 25)(y − 1)"]
        answer: "(y + 5)(y − 5)"
        check: "y^2 - 25"
        difficulty: 1
        hints: ["25 = 5².", "A difference of squares comes from a sum times a difference."]
        solution: "y² − 25 = y² − 5² = (y + 5)(y − 5)"
        mistakes: {"(y − 5)²": "diff_squares_not_square", "(y + 5)²": "diff_squares_not_square"}
      - prompt: "Expand (2m + 3)(2m − 3)."
        options: ["4m² − 9", "4m² + 9", "2m² − 9", "4m² − 12m − 9"]
        answer: "4m² − 9"
        check: "expand((2*m + 3)*(2*m - 3))"
        difficulty: 2
        hints: ["Use a² − b² with a = 2m and b = 3.", "(2m)² = 4m²."]
        solution: "(2m)² − 3² = 4m² − 9"
        mistakes: {"4m² + 9": sum_not_difference, "2m² − 9": square_coefficient, "4m² − 12m − 9": extra_middle_term}
      - prompt: "Use (60 + 1)(60 − 1) to work out 61 × 59."
        answer: "3599"
        check: "61*59"
        difficulty: 2
        hints: ["(a + b)(a − b) = a² − b².", "60² − 1²."]
        solution: "Step 1: 60² − 1² = 3600 − 1. Step 2: = 3599."
        mistakes: {"3601": sum_not_difference}
      - prompt: "x² − y² = 40 and x + y = 10. What is x − y?"
        answer: "4"
        check: "40/10"
        difficulty: 2
        hints: ["x² − y² = (x + y)(x − y).", "10 × (x − y) = 40."]
        solution: "Step 1: (x + y)(x − y) = 40. Step 2: 10(x − y) = 40. Step 3: x − y = 4."
        mistakes: {"30": "diff_squares_use", "400": "diff_squares_use"}
      - prompt: "What is 75² − 25²?"
        answer: "5000"
        check: "75^2 - 25^2"
        difficulty: 3
        hints: ["Don't square them: use (a + b)(a − b).", "(75 + 25)(75 − 25) = 100 × 50."]
        solution: "Step 1: 75² − 25² = (75 + 25)(75 − 25). Step 2: = 100 × 50. Step 3: = 5000."
        mistakes: {"2500": squared_difference}
      - prompt: "Factorise 9x² − 16."
        options: ["(3x + 4)(3x − 4)", "(3x − 4)²", "(9x + 16)(x − 1)", "(3x + 4)²"]
        answer: "(3x + 4)(3x − 4)"
        check: "9x^2 - 16"
        difficulty: 3
        hints: ["9x² = (3x)² and 16 = 4².", "a² − b² = (a + b)(a − b)."]
        solution: "9x² − 16 = (3x)² − 4² = (3x + 4)(3x − 4)"

        mistakes: {"(3x − 4)²": "diff_squares_not_square", "(3x + 4)²": "diff_squares_not_square"}
      - prompt: "What is 53² − 47²?"
        answer: "600"
        check: "53**2 - 47**2"
        difficulty: 2
        hints: ["a² − b² = (a + b)(a − b).", "(53 + 47)(53 − 47)."]
        solution: "Step 1: 53 + 47 = 100. Step 2: 53 − 47 = 6. Step 3: 100 × 6 = 600."
        mistakes: {"36": squared_difference}
      - prompt: "A square of side 15 cm has a square of side 5 cm cut from a corner. What area is left, in cm²?"
        answer: "200"
        check: "15**2 - 5**2"
        difficulty: 3
        hints: ["Area left = 15² − 5².", "Use (15 + 5)(15 − 5)."]
        solution: "Step 1: 15² − 5² = (15 + 5)(15 − 5). Step 2: 20 × 10 = 200 cm²."
        mistakes: {"100": squared_difference}
      - prompt: "x + y = 12 and x − y = 3. What is x² − y²?"
        answer: "36"
        check: "12*3"
        difficulty: 3
        hints: ["x² − y² = (x + y)(x − y).", "You don't need x and y themselves."]
        solution: "Step 1: x² − y² = (x + y)(x − y). Step 2: 12 × 3 = 36."
        mistakes: {"81": squared_difference, "15": diff_squares_use}
      - prompt: Expand (a + 4)(a − 4).
        options:
        - a² − 16
        - a² + 16
        - a² − 8a − 16
        - a² − 8
        answer: a² − 16
        check: expand((a + 4)*(a - 4))
        difficulty: 1
        hints:
        - The middle terms cancel.
        - The answer is a square minus a square.
        solution: 'Step 1: a² − 4a + 4a − 16. Step 2: −4a + 4a = 0. Step 3: So a² − 16.'
        mistakes:
          a² + 16: sign_last
          a² − 8: square_each_term
      - prompt: Use (40 + 2)(40 − 2) to work out 42 × 38.
        answer: '1596'
        check: 42*38
        difficulty: 1
        hints:
        - It is 40² − 2².
        - 1600 − 4.
        solution: 'Step 1: 40² = 1600. Step 2: 2² = 4. Step 3: 1600 − 4 = 1596.'
        mistakes:
          '1604': sign_last
      - prompt: Factorise 4x² − 25.
        options:
        - (2x + 5)(2x − 5)
        - (4x + 5)(4x − 5)
        - (2x − 5)²
        - (4x + 25)(x − 1)
        answer: (2x + 5)(2x − 5)
        check: 4*x**2 - 25
        difficulty: 2
        hints:
        - 'Write each part as a square: 4x² = (2x)².'
        - 25 = 5².
        solution: 'Step 1: 4x² = (2x)² and 25 = 5². Step 2: a² − b² = (a + b)(a − b). Step 3: So (2x + 5)(2x − 5).'
        mistakes:
          (4x + 5)(4x − 5): square_coefficient
          (2x − 5)²: diff_squares_not_square
      - prompt: What is 36² − 34²?
        answer: '140'
        check: 36**2 - 34**2
        difficulty: 2
        hints:
        - Use (a + b)(a − b).
        - (36 + 34)(36 − 34).
        solution: 'Step 1: 36 + 34 = 70. Step 2: 36 − 34 = 2. Step 3: 70 × 2 = 140.'
        mistakes:
          '4': diff_squares_use
      - prompt: x² − y² = 45 and x − y = 5. What is x + y?
        answer: '9'
        check: 45/5
        difficulty: 3
        hints:
        - x² − y² = (x + y)(x − y).
        - 45 = (x + y) × 5.
        solution: 'Step 1: (x + y)(x − y) = 45. Step 2: (x + y) × 5 = 45. Step 3: x + y = 9.'
        mistakes:
          '40': diff_squares_use
      - prompt: A square garden of side 25 m has a square pond of side 15 m in one corner. What area of garden is left around the pond, in m²?
        answer: '400'
        check: 25**2 - 15**2
        difficulty: 3
        hints:
        - The area left is 25² − 15².
        - (25 + 15)(25 − 15).
        solution: 'Step 1: 25 + 15 = 40. Step 2: 25 − 15 = 10. Step 3: 40 × 10 = 400 m².'
        mistakes:
          '100': diff_squares_not_square
  - code: math9.ident.quick_calculation
    title: Quick calculation with identities
    after: [math9.ident.square_of_difference, math9.ident.difference_of_squares]
    notes: |
      Write numbers near a round number as a sum or difference and use an identity:
      103² = (100 + 3)² = 10609, 199² = (200 − 1)² = 39601, 48 × 52 = 50² − 2² = 2496,
      101² − 99² = (101 + 99)(101 − 99) = 400.
    explanations:
      text: "Identities make some big multiplications easy. Look for a round number nearby. 103² = (100 + 3)² = 10000 + 600 + 9 = 10609. 97 × 103 = (100 − 3)(100 + 3) = 10000 − 9 = 9991."
      visual: "103² is a square of side 100 + 3: a 100 × 100 block (10000), two 100 × 3 strips (300 each) and a small 3 × 3 corner (9). 10000 + 600 + 9 = 10609."
      step_by_step: "For 48 × 52: Step 1: Both are 2 away from 50. Step 2: Write them as (50 − 2)(50 + 2). Step 3: Use (a − b)(a + b) = a² − b². Step 4: 2500 − 4 = 2496."
      real_world: "A shop sells 52 school bags at ₹48 each. 48 × 52 = 50² − 2² = 2500 − 4, so the total is ₹2496."
    picture:
      kind: area_grid
      cols:
      - {size: 100, label: '100'}
      - {size: 3, label: '3'}
      rows:
      - {size: 100, label: '100'}
      - {size: 3, label: '3'}
      cells:
      - ['10000', '300']
      - ['300', '9']
      caption: 103² = 10000 + 300 + 300 + 9 = 10609
      alt: '103 squared as a square of side 100 + 3: a 10000 block, two 300 strips and a 9 corner, totalling 10609.'
    activity:
      type: formula
      prompt: Work out 102 × 98 quickly as (a + b)(a − b) = a² − b².
      inputs:
      - name: a
        label: a
        min: 90
        max: 110
        step: 1
        start: 90
      - name: b
        label: b
        min: 0
        max: 10
        step: 1
        start: 0
      outputs:
      - name: p
        label: (a + b) × (a − b)
        expr: (a+b)*(a-b)
      - name: q
        label: a² − b²
        expr: a^2-b^2
      goals:
      - prompt: Choose a and b so that a + b = 102 and a − b = 98.
        want:
          p: 9996
        hint: 102 and 98 are the same distance from a middle number. That middle number is a.
        mistakes:
        - when:
            a: 102
          say: With a = 102, a + b goes past 102 as soon as b is more than 0. a sits in the middle of the two numbers, not at the top.
    lesson:
      - teach: Numbers just above or below a round number are easy to square with an identity. 103² = (100 + 3)² = 10000 + 600 + 9 = 10609. 199² = (200 − 1)² = 40000 − 400 + 1 = 39601.
        check:
          prompt: Which way of writing 102 makes 102² easy?
          options:
          - (100 + 2)²
          - (51 × 2)²
          - (110 − 8)²
          answer: (100 + 2)²
          why: '100 is round, so 100² = 10000 and 2 × 100 × 2 = 400 are easy: 10000 + 400 + 4 = 10404.'
        ways:
        - style: step_by_step
          teach: 'Step 1: find the round number nearest to yours: 103 is near 100. Step 2: write it as round plus or minus a small part: 100 + 3. Step 3: use (a + b)² or (a − b)²: 10000 + 600 + 9 = 10609.'
      - teach: Two numbers the same distance either side of a round number multiply as a difference of squares. 48 × 52 = (50 − 2)(50 + 2) = 2500 − 4 = 2496. 95 × 105 = 10000 − 25 = 9975.
        check:
          prompt: 47 × 53 = (50 − 3)(50 + 3). What is it?
          options:
          - '2491'
          - '2500'
          - '2509'
          answer: '2491'
          why: 50² − 3² = 2500 − 9 = 2491.
        ways:
        - style: step_by_step
          teach: 'Step 1: find the middle of the two numbers: 48 and 52 have middle 50. Step 2: find how far each is from the middle: 2. Step 3: square the middle and take away the square of the distance: 2500 − 4 = 2496.'
      - teach: 'Pick the identity by the shape of the sum: one number squared, use (a + b)² or (a − b)². Two numbers either side of a middle, use (a + b)(a − b). A square minus a square, use (a + b)(a − b) backwards.'
        check:
          prompt: Which identity suits 1004 × 996?
          options:
          - (a + b)(a − b) = a² − b²
          - (a + b)² = a² + 2ab + b²
          - (a − b)² = a² − 2ab + b²
          answer: (a + b)(a − b) = a² − b²
          why: 1004 and 996 are 4 either side of 1000, so 1004 × 996 = 1000² − 4² = 999984.
        ways:
        - style: real_world
          teach: 'Like picking the right tool from a box: one number squared? Use (a + b)² or (a − b)². Two numbers either side of a middle, like 1004 and 996? Use (a + b)(a − b). A square minus a square? Use the same tool backwards.'
    items:
      - prompt: "Use an identity to work out 103²."
        answer: "10609"
        check: "103^2"
        difficulty: 1
        hints: ["103 = 100 + 3.", "10000 + 2 × 100 × 3 + 9."]
        solution: "(100 + 3)² = 10000 + 600 + 9 = 10609"
        mistakes: {"10009": square_each_term, "10309": missing_double}
      - prompt: "Use an identity to work out 48 × 52."
        answer: "2496"
        check: "48*52"
        difficulty: 1
        hints: ["48 = 50 − 2 and 52 = 50 + 2.", "50² − 2²."]
        solution: "(50 − 2)(50 + 2) = 2500 − 4 = 2496"
        mistakes: {"2504": sum_not_difference}
      - prompt: "Use an identity to work out 199²."
        answer: "39601"
        check: "199^2"
        difficulty: 2
        hints: ["199 = 200 − 1.", "40000 − 2 × 200 × 1 + 1."]
        solution: "(200 − 1)² = 40000 − 400 + 1 = 39601"
        mistakes: {"39999": square_each_term, "40401": sign_middle, "39599": sign_last}
      - prompt: "Use an identity to work out 95 × 105."
        answer: "9975"
        check: "95*105"
        difficulty: 2
        hints: ["95 = 100 − 5 and 105 = 100 + 5."]
        solution: "(100 − 5)(100 + 5) = 10000 − 25 = 9975"
        mistakes: {"10025": sum_not_difference}
      - prompt: "Use an identity to work out 1001²."
        answer: "1002001"
        check: "1001^2"
        difficulty: 2
        hints: ["1001 = 1000 + 1."]
        solution: "(1000 + 1)² = 1000000 + 2000 + 1 = 1002001"
        mistakes: {"1000001": square_each_term}
      - prompt: "Use an identity to work out 10.5². Decimals are fine."
        answer: "110.25"
        check: "10.5^2"
        difficulty: 3
        hints: ["10.5 = 10 + 0.5.", "100 + 2 × 10 × 0.5 + 0.25."]
        solution: "(10 + 0.5)² = 100 + 10 + 0.25 = 110.25"
        mistakes: {"100.25": square_each_term}
      - prompt: "What is 101² − 99²?"
        answer: "400"
        check: "101^2 - 99^2"
        difficulty: 3
        hints: ["Use a² − b² = (a + b)(a − b).", "(101 + 99)(101 − 99)."]
        solution: "(101 + 99)(101 − 99) = 200 × 2 = 400"
        mistakes: {"4": squared_difference}
      - prompt: "Use an identity to work out 98²."
        answer: "9604"
        check: "98**2"
        difficulty: 2
        hints: ["98 = 100 − 2.", "10000 − 400 + 4."]
        solution: "Step 1: (100 − 2)² = 10000 − 2 × 100 × 2 + 4. Step 2: 10000 − 400 + 4 = 9604."
        mistakes: {"9996": square_each_term, "9596": sign_last}
      - prompt: "Use an identity to work out 37 × 43."
        answer: "1591"
        check: "37*43"
        difficulty: 3
        hints: ["Both are 3 away from 40.", "(40 − 3)(40 + 3) = 40² − 3²."]
        solution: "Step 1: 37 × 43 = (40 − 3)(40 + 3). Step 2: 1600 − 9 = 1591."
        mistakes: {"1609": sum_not_difference}
      - prompt: "What is 1002² − 998²?"
        answer: "8000"
        check: "1002**2 - 998**2"
        difficulty: 3
        hints: ["Use a² − b² = (a + b)(a − b).", "(2000)(4)."]
        solution: "Step 1: 1002 + 998 = 2000. Step 2: 1002 − 998 = 4. Step 3: 2000 × 4 = 8000."
        mistakes: {"16": squared_difference}
      - prompt: Use an identity to work out 101².
        answer: '10201'
        check: 101**2
        difficulty: 1
        hints:
        - Write 101 as 100 + 1.
        - 10000 + 200 + 1.
        solution: 'Step 1: (100 + 1)² = 100² + 2 × 100 × 1 + 1². Step 2: = 10000 + 200 + 1. Step 3: = 10201.'
        mistakes:
          '10001': missing_double
      - prompt: Use an identity to work out 29 × 31.
        answer: '899'
        check: 29*31
        difficulty: 1
        hints:
        - Both numbers are 1 away from 30.
        - 30² − 1².
        solution: 'Step 1: 29 × 31 = (30 − 1)(30 + 1). Step 2: = 30² − 1². Step 3: = 900 − 1 = 899.'
        mistakes:
          '901': sign_last
      - prompt: Use an identity to work out 1004 × 996.
        answer: '999984'
        check: 1004*996
        difficulty: 2
        hints:
        - Both are 4 away from 1000.
        - 1000² − 4².
        solution: 'Step 1: (1000 + 4)(1000 − 4). Step 2: = 1000000 − 16. Step 3: = 999984.'
        mistakes:
          '1000016': sign_last
      - prompt: Use an identity to work out 299².
        answer: '89401'
        check: 299**2
        difficulty: 2
        hints:
        - Write 299 as 300 − 1.
        - 90000 − 600 + 1.
        solution: 'Step 1: (300 − 1)² = 300² − 2 × 300 + 1. Step 2: = 90000 − 600 + 1. Step 3: = 89401.'
        mistakes:
          '89999': missing_double
      - prompt: Use an identity to work out 9.8². Decimals are fine.
        answer: '96.04'
        check: 9.8**2
        difficulty: 3
        hints:
        - Write 9.8 as 10 − 0.2.
        - 100 − 4 + 0.04.
        solution: 'Step 1: (10 − 0.2)² = 100 − 2 × 10 × 0.2 + 0.2². Step 2: = 100 − 4 + 0.04. Step 3: = 96.04.'
        mistakes:
          '99.96': missing_double
      - prompt: What is 505² − 495²?
        answer: '10000'
        check: 505**2 - 495**2
        difficulty: 3
        hints:
        - Use (a + b)(a − b).
        - (505 + 495)(505 − 495).
        solution: 'Step 1: 505 + 495 = 1000. Step 2: 505 − 495 = 10. Step 3: 1000 × 10 = 10000.'
        mistakes:
          '100': diff_squares_use
