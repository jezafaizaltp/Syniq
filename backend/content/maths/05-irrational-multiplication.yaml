# Class 9 Mathematics, chapter 5. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_root, doubled_not_squared, half_not_root, root_top_only,
# and the translated identity tips square_each_term, missing_double, sign_middle, sum_not_difference.
subject: math
chapter: 5
title: Irrational Multiplication

tips:
  added_under_root: "Multiply the numbers under the roots, don't add them: √a × √b = √(a × b)."
  added_outside: "Multiply the numbers outside the roots too: 2√3 × 4√2 = (2 × 4) × √(3 × 2)."
  wrong_square_factor: "Look for a perfect square that divides the number: 12 = 4 × 3, so √12 = √4 × √3 = 2√3."
  square_not_root_out: "When a perfect square comes out of the root, only its root comes out: √18 = √9 × √2 = 3√2, not 9√2."
  moved_in_without_square: "To move a number under the root, square it: 3√5 = √9 × √5 = √45."
  like_terms: "Add roots the way you add 2x + 5x = 7x: count them, and the root itself stays the same."
  root_of_sum: "√a + √b is not √(a + b): √9 + √16 = 3 + 4 = 7, but √25 = 5. Simplify each root first, then add the ones that match."
  rationalise_both: "Multiply the top and the bottom by the root at the bottom. Then the bottom becomes a whole number, for example √2 × √2 = 2."
  expand_then_subtract: "Expand x² first, using (a + b)² = a² + 2ab + b². Then work out 2x and take it away; the √ parts should cancel."
  rationalise_half: "1/√2 = √2/2. Halve 1.414, don't double it."
  roots_cancel: "+√3 and −√3 cancel. What's left is 3 + 1."

concepts:
  - code: math9.irrmul.product
    title: Multiplying square roots
    notes: |
      √a × √b = √(ab) for positive a and b, because (√a × √b)² = a × b. So √2 × √8 = √16 = 4 and
      √2 × √3 = √6. Numbers outside multiply too: 2√3 × 4√2 = 8√6. √a × √a = a.
    explanations:
      text: "√2 × √8 = √16 = 4. Multiplying two square roots gives the square root of the product: √a × √b = √(a × b). Check it by squaring: (√2 × √8)² = 2 × 8 = 16, so √2 × √8 is the number whose square is 16, which is 4."
      visual: "Picture a rectangle √2 cm wide and √8 cm long. Its area is √2 × √8. Cut and rearrange it and it fills exactly a 4 cm by 1 cm strip: area 4 cm², the same as √16."
      step_by_step: "For 2√3 × 4√2: Step 1: Multiply the numbers outside: 2 × 4 = 8. Step 2: Multiply the numbers under the roots: 3 × 2 = 6, giving √6. Step 3: Put them together: 8√6."
      real_world: "A rectangular tile is √6 cm by √3 cm. Its area is √6 × √3 = √18 = 3√2 cm², about 4.24 cm²."
    activity:
      type: formula
      prompt: √a × √b is always √(ab). Try it.
      inputs:
      - name: a
        label: a
        min: 1
        max: 20
        step: 1
        start: 1
      - name: b
        label: b
        min: 1
        max: 20
        step: 1
        start: 1
      outputs:
      - name: p
        label: √a × √b
        expr: sqrt(a)*sqrt(b)
        places: 3
      - name: q
        label: √(ab)
        expr: sqrt(a*b)
        places: 3
      goals:
      - prompt: Make √a × √b equal 6 exactly, without a or b being a perfect square.
        want:
          p: 6
          a: 2
        hint: a × b must be 36.
        mistakes:
        - when:
            a: 2
            b: 3
          say: '√2 × √3 = √6, about 2.45, not 6. Multiplying square roots multiplies what''s inside: √2 × √b = √(2b). For that to be 6 = √36, what must 2b be?'
        - when:
            a: 4
          say: '4 is a perfect square: √4 = 2. The goal asks for a and b that are not perfect squares.'
        - when:
            a: 9
          say: '9 is a perfect square: √9 = 3. The goal asks for a and b that are not perfect squares.'
    lesson:
      - teach: 'What is √2 × √8? Square it: (√2 × √8)² = √2 × √2 × √8 × √8 = 2 × 8 = 16. A positive number whose square is 16 is 4. So √2 × √8 = √16 = 4. In general, √a × √b = √(ab).'
        check:
          prompt: What is √3 × √3?
          options:
          - '3'
          - '9'
          - √6
          answer: '3'
          why: √3 × √3 = √9 = 3. A root times itself gives back the number under it.
      - teach: 'Often the product is not a perfect square, and that''s fine: √2 × √3 = √6, and we leave it as √6. When the product is a perfect square, finish it: √3 × √12 = √36 = 6.'
        check:
          prompt: What is √2 × √5?
          options:
          - √10
          - √7
          - '10'
          answer: √10
          why: 'Multiply under the root: 2 × 5 = 10. Adding (√7) is a different, wrong rule.'
      - teach: 'Numbers in front multiply with each other, and roots with roots: 2√3 × 4√2 = (2 × 4) × (√3 × √2) = 8√6.'
        check:
          prompt: What is 3√2 × 2√5?
          options:
          - 6√10
          - 5√7
          - 6√7
          answer: 6√10
          why: 3 × 2 = 6 in front, and √2 × √5 = √10.
    items:
      - prompt: "What is √2 × √8?"
        answer: "4"
        check: "sqrt(2)*sqrt(8)"
        difficulty: 1
        hints: ["Multiply the numbers under the roots: √(2 × 8).", "√16 = ?"]
        solution: "Step 1: √2 × √8 = √16. Step 2: √16 = 4."
        mistakes: {"16": forgot_root}
      - prompt: "What is √3 × √12?"
        answer: "6"
        check: "sqrt(3)*sqrt(12)"
        difficulty: 1
        hints: ["√(3 × 12) = √36."]
        solution: "Step 1: √3 × √12 = √36. Step 2: √36 = 6."
        mistakes: {"36": forgot_root}
      - prompt: "What is √5 × √5?"
        answer: "5"
        check: "sqrt(5)*sqrt(5)"
        difficulty: 1
        hints: ["√5 is the number whose square is 5."]
        solution: "Step 1: √5 × √5 = √25. Step 2: = 5."
        mistakes: {"25": forgot_root, "10": doubled_not_squared}
      - prompt: "What is √2 × √3?"
        options: ["√6", "√5", "6", "5"]
        answer: "√6"
        check: "sqrt(2)*sqrt(3)"
        difficulty: 2
        hints: ["Multiply the numbers under the roots."]
        solution: "√2 × √3 = √(2 × 3) = √6"
        mistakes: {"√5": added_under_root}
      - prompt: "What is 2√3 × 4√2?"
        options: ["8√6", "6√6", "8√5", "6√5"]
        answer: "8√6"
        check: "2*sqrt(3)*4*sqrt(2)"
        difficulty: 2
        hints: ["Multiply outside numbers together and root numbers together.", "2 × 4 = 8 and √3 × √2 = √6."]
        solution: "Step 1: 2 × 4 = 8. Step 2: √3 × √2 = √6. Step 3: 8√6."
        mistakes: {"6√6": added_outside, "8√5": added_under_root}
      - prompt: "What is √18 × √8?"
        answer: "12"
        check: "sqrt(18)*sqrt(8)"
        difficulty: 3
        hints: ["18 × 8 = 144.", "√144 = ?"]
        solution: "Step 1: √18 × √8 = √144. Step 2: = 12."
        mistakes: {"144": forgot_root}
      - prompt: "A rectangle is √6 cm long and √3 cm wide. What is its area, in cm²?"
        options: ["3√2", "√9", "9", "2√3"]
        answer: "3√2"
        check: "sqrt(6)*sqrt(3)"
        difficulty: 3
        hints: ["Area = √6 × √3 = √18.", "18 = 9 × 2."]
        solution: "Step 1: √6 × √3 = √18. Step 2: √18 = √9 × √2 = 3√2 cm²."
        mistakes: {"√9": added_under_root, "9": added_under_root}
      - prompt: "What is √6 × √24?"
        answer: "12"
        check: "sqrt(6*24)"
        difficulty: 2
        hints: ["√a × √b = √(ab).", "6 × 24 = 144."]
        solution: "Step 1: √6 × √24 = √144. Step 2: √144 = 12."
        mistakes: {"144": forgot_root}
      - prompt: "What is 3√2 × 5√8?"
        answer: "60"
        check: "3*5*sqrt(16)"
        difficulty: 3
        hints: ["Multiply the numbers outside and the roots separately.", "3 × 5 = 15 and √2 × √8 = √16."]
        solution: "Step 1: 3 × 5 = 15. Step 2: √2 × √8 = √16 = 4. Step 3: 15 × 4 = 60."
        mistakes: {"240": forgot_root, "15": forgot_root}
      - prompt: "A square has sides of 2√3 cm. What is its area, in cm²?"
        answer: "12"
        check: "(2*sqrt(3))**2"
        difficulty: 3
        hints: ["Area = side × side = 2√3 × 2√3.", "2 × 2 = 4 and √3 × √3 = 3."]
        solution: "Step 1: 2√3 × 2√3 = 4 × 3. Step 2: Area = 12 cm²."
        mistakes: {"6": doubled_not_squared, "4": forgot_root}
      - prompt: What is √2 × √18?
        options:
        - '6'
        - √20
        - '36'
        - 2√5
        answer: '6'
        check: sqrt(2)*sqrt(18)
        difficulty: 1
        hints:
        - Multiply the numbers under the roots.
        - 2 × 18 = 36, a perfect square.
        solution: 'Step 1: √2 × √18 = √36. Step 2: 36 = 6². Step 3: So the answer is 6.'
        mistakes:
          √20: added_under_root
          '36': square_not_root_out
      - prompt: What is √7 × √7?
        options:
        - '7'
        - '49'
        - √14
        - '14'
        answer: '7'
        check: sqrt(7)*sqrt(7)
        difficulty: 1
        hints:
        - What does √7 mean?
        - √7 multiplied by itself gives the number under the root.
        solution: 'Step 1: √7 × √7 = √49. Step 2: √49 = 7. Step 3: So the answer is 7.'
        mistakes:
          '49': square_not_root_out
          √14: added_under_root
      - prompt: What is √5 × √3?
        options:
        - √15
        - √8
        - '15'
        - 2√2
        answer: √15
        check: sqrt(5)*sqrt(3)
        difficulty: 2
        hints:
        - Multiply under the root.
        - 15 is not a perfect square, so leave the root.
        solution: 'Step 1: √5 × √3 = √(5 × 3). Step 2: = √15. Step 3: 15 has no perfect square factor, so √15 is the answer.'
        mistakes:
          √8: added_under_root
      - prompt: What is 4√3 × √3?
        answer: '12'
        check: 4*sqrt(3)*sqrt(3)
        difficulty: 2
        hints:
        - √3 × √3 first.
        - √3 × √3 = 3, then multiply by 4.
        solution: 'Step 1: √3 × √3 = 3. Step 2: 4 × 3 = 12. Step 3: So 4√3 × √3 = 12.'
        mistakes:
          '36': square_not_root_out
      - prompt: A rectangle is 2√5 cm long and √20 cm wide. What is its area, in cm²?
        answer: '20'
        check: 2*sqrt(5)*sqrt(20)
        difficulty: 3
        hints:
        - Area = length × width.
        - √5 × √20 = √100.
        solution: 'Step 1: 2√5 × √20 = 2 × √100. Step 2: √100 = 10. Step 3: 2 × 10 = 20 cm².'
        mistakes:
          '10': square_not_root_out

  - code: math9.irrmul.simplify
    title: Simplifying square roots
    after: [math9.irrmul.product]
    notes: |
      Split the number into a perfect square times another number, and take the square
      root of the perfect square out: √12 = √4 × √3 = 2√3, √50 = 5√2, √72 = 6√2. Going the other
      way, 3√5 = √45. Use the largest perfect square factor to finish in one step.
    explanations:
      text: "√12 looks hard, but 12 = 4 × 3 and 4 is a perfect square. So √12 = √4 × √3 = 2√3. To simplify a square root, find the largest perfect square that divides the number, and take its root outside."
      visual: "Write the number as a product with a square in it: 50 = 25 × 2. Draw a box around the 25. The box opens up and lets its root, 5, step outside the √ sign, while the 2 stays inside: 5√2."
      step_by_step: "For √72: Step 1: List perfect squares: 4, 9, 16, 25, 36, 49. Step 2: The largest that divides 72 is 36. Step 3: 72 = 36 × 2. Step 4: √72 = √36 × √2 = 6√2."
      real_world: "A square plot has an area of 50 m². Its side is √50 m. Written as 5√2 m, it is easy to estimate: 5 × 1.414 ≈ 7.07 m."
    picture:
      kind: flow
      steps: [50 = 25 × 2, '25 is a square: √25 = 5', √50 = √25 × √2, √50 = 5√2]
      alt: 'Simplifying the square root of 50: 50 is 25 times 2, and the root of 25 is 5, so root 50 is 5 root 2.'
    activity:
      type: sort
      prompt: Which simpler form is each square root equal to?
      bins:
      - 2√3
      - 3√2
      - 2√5
      items:
      - label: √12
        bin: 2√3
        why: 12 = 4 × 3, so √12 = √4 × √3 = 2√3.
        clue: Find a square number that divides 12.
      - label: √18
        bin: 3√2
        why: 18 = 9 × 2, so √18 = 3√2.
        clue: 'Which square number divides 18: 4 or 9?'
      - label: √20
        bin: 2√5
        why: 20 = 4 × 5, so √20 = 2√5.
        clue: Which square number divides 20?
      - label: √4 × √3
        bin: 2√3
        clue: What is √4?
        why: √4 = 2, so √4 × √3 = 2√3.
      - label: √9 × √2
        bin: 3√2
        clue: What is √9?
        why: √9 = 3, so √9 × √2 = 3√2.
      - label: √4 × √5
        bin: 2√5
        clue: What is √4?
        why: √4 = 2, so √4 × √5 = 2√5.
    lesson:
      - teach: √12 can be written more simply. 12 = 4 × 3, and 4 is a perfect square. So √12 = √4 × √3 = 2√3. The perfect square comes out of the root as its square root.
        check:
          prompt: √20 = √4 × √5. What is that?
          options:
          - 2√5
          - 4√5
          - √5 × 2√2
          answer: 2√5
          why: '√4 = 2 comes out, and the 5 stays under the root: 2√5.'
      - teach: 'Look for the largest perfect square that divides the number: 4, 9, 16, 25, 36, 49, 64, 81, 100… √72 = √36 × √2 = 6√2 in one step. Using √4 × √18 works too, but you''d have to simplify √18 again.'
        check:
          prompt: What is the largest perfect square that divides 50?
          options:
          - '25'
          - '5'
          - '10'
          answer: '25'
          why: 50 = 25 × 2, so √50 = 5√2.
      - teach: 'Going backwards, put the number in front back under the root by squaring it: 3√5 = √9 × √5 = √45. A common slip is 3√5 = √15, which forgets to square the 3.'
        check:
          prompt: Which is the same as 2√7?
          options:
          - √28
          - √14
          - √49
          answer: √28
          why: 2 = √4, and √4 × √7 = √28.
    items:
      - prompt: "Simplify √12."
        options: ["2√3", "3√2", "6", "4√3"]
        answer: "2√3"
        check: "sqrt(12)"
        difficulty: 1
        hints: ["12 = 4 × 3.", "√4 = 2."]
        solution: "√12 = √4 × √3 = 2√3"
        mistakes: {"3√2": wrong_square_factor, "6": half_not_root, "4√3": square_not_root_out}
      - prompt: "Simplify √50."
        options: ["5√2", "2√5", "25√2", "10√5"]
        answer: "5√2"
        check: "sqrt(50)"
        difficulty: 1
        hints: ["50 = 25 × 2."]
        solution: "√50 = √25 × √2 = 5√2"
        mistakes: {"25√2": square_not_root_out, "2√5": wrong_square_factor}
      - prompt: "Simplify √72."
        options: ["6√2", "4√3", "8√2", "36√2"]
        answer: "6√2"
        check: "sqrt(72)"
        difficulty: 2
        hints: ["The largest perfect square dividing 72 is 36."]
        solution: "√72 = √36 × √2 = 6√2"
        mistakes: {"36√2": square_not_root_out}
      - prompt: "Which of these equals √48?"
        options: ["4√3", "3√4", "16√3", "2√6"]
        answer: "4√3"
        check: "sqrt(48)"
        difficulty: 2
        hints: ["48 = 16 × 3."]
        solution: "√48 = √16 × √3 = 4√3"
        mistakes: {"16√3": square_not_root_out}
      - prompt: "√75 = a√3. What is a?"
        answer: "5"
        check: "sqrt(75)/sqrt(3)"
        difficulty: 2
        hints: ["75 = 25 × 3."]
        solution: "Step 1: √75 = √25 × √3. Step 2: = 5√3, so a = 5."
        mistakes: {"25": square_not_root_out}
      - prompt: "Simplify √200."
        options: ["10√2", "20√10", "100√2", "2√10"]
        answer: "10√2"
        check: "sqrt(200)"
        difficulty: 3
        hints: ["200 = 100 × 2."]
        solution: "√200 = √100 × √2 = 10√2"
        mistakes: {"100√2": square_not_root_out}
      - prompt: "Which of these is the same as 3√5?"
        options: ["√45", "√15", "√75", "√8"]
        answer: "√45"
        check: "3*sqrt(5)"
        difficulty: 3
        hints: ["3 = √9.", "√9 × √5 = ?"]
        solution: "3√5 = √9 × √5 = √45"
        mistakes: {"√15": moved_in_without_square, "√8": added_under_root}
      - prompt: "Simplify √98."
        options: ["7√2", "2√7", "49√2", "14√7"]
        answer: "7√2"
        difficulty: 2
        hints: ["Find a perfect square that divides 98.", "98 = 49 × 2."]
        solution: "Step 1: √98 = √49 × √2. Step 2: √49 = 7, so √98 = 7√2."
        mistakes: {"49√2": square_not_root_out, "2√7": wrong_square_factor}
      - prompt: "√180 = a√5. What is a?"
        answer: "6"
        check: "sqrt(180/5)"
        difficulty: 3
        hints: ["180 = 36 × 5.", "Take √36 out."]
        solution: "Step 1: 180 = 36 × 5. Step 2: √180 = 6√5, so a = 6."
        mistakes: {"36": square_not_root_out, "3": wrong_square_factor}
      - prompt: "Which of these is the same as 4√3?"
        options: ["√48", "√12", "√24", "√7"]
        answer: "√48"
        difficulty: 3
        hints: ["To move 4 inside the root, square it.", "4² × 3 = ?"]
        solution: "Step 1: 4√3 = √16 × √3. Step 2: √(16 × 3) = √48."
        mistakes: {"√12": moved_in_without_square, "√7": added_under_root}
      - prompt: Simplify √18.
        options:
        - 3√2
        - 2√3
        - 9√2
        - 6√3
        answer: 3√2
        check: sqrt(18)
        difficulty: 1
        hints:
        - Find a perfect square that divides 18.
        - 18 = 9 × 2.
        solution: 'Step 1: 18 = 9 × 2. Step 2: √18 = √9 × √2. Step 3: = 3√2.'
        mistakes:
          9√2: square_not_root_out
      - prompt: Simplify √27.
        options:
        - 3√3
        - 9√3
        - 3√9
        - √9 + √3
        answer: 3√3
        check: sqrt(27)
        difficulty: 1
        hints:
        - 27 = 9 × 3.
        - √9 comes out as 3.
        solution: 'Step 1: 27 = 9 × 3. Step 2: √27 = √9 × √3. Step 3: = 3√3.'
        mistakes:
          9√3: square_not_root_out
      - prompt: √80 = a√5. What is a?
        answer: '4'
        check: sqrt(80/5)
        difficulty: 2
        hints:
        - 80 = 16 × 5.
        - √16 comes out.
        solution: 'Step 1: 80 = 16 × 5. Step 2: √80 = √16 × √5 = 4√5. Step 3: So a = 4.'
        mistakes:
          '16': square_not_root_out
      - prompt: Which of these is the same as 5√2?
        options:
        - √50
        - √10
        - √25
        - √7
        answer: √50
        check: 5*sqrt(2)
        difficulty: 2
        hints:
        - Put the 5 back under the root by squaring it.
        - 5² = 25, and 25 × 2 = 50.
        solution: 'Step 1: 5 = √25. Step 2: √25 × √2 = √50. Step 3: So 5√2 = √50.'
        mistakes:
          √10: moved_in_without_square
      - prompt: Simplify √288.
        options:
        - 12√2
        - 6√2
        - 8√2
        - 24√2
        answer: 12√2
        check: sqrt(288)
        difficulty: 3
        hints:
        - Look for the largest perfect square that divides 288.
        - 288 = 144 × 2.
        solution: 'Step 1: 288 = 144 × 2. Step 2: √144 = 12. Step 3: √288 = 12√2.'
        mistakes:
          6√2: wrong_square_factor
          24√2: square_not_root_out

  - code: math9.irrmul.add
    title: Adding and subtracting square roots
    after: [math9.irrmul.simplify]
    notes: |
      Like roots add like like terms: 2√3 + 5√3 = 7√3. Unlike roots can't be combined until they
      are simplified: √8 + √2 = 2√2 + √2 = 3√2, and √12 + √27 = 2√3 + 3√3 = 5√3.
      √a + √b is not √(a + b).
    explanations:
      text: "2√3 + 5√3 = 7√3, just like 2x + 5x = 7x. Roots with different numbers under them don't combine directly, and √a + √b is not √(a + b). But simplifying can make them match: √8 + √2 = 2√2 + √2 = 3√2."
      visual: "Think of √3 as a kind of fruit. Two √3 mangoes and five √3 mangoes make seven √3 mangoes. A √2 is a different fruit, so it can't join the √3 pile. But √8 turns out to be two √2s in disguise."
      step_by_step: "For √12 + √27: Step 1: Simplify √12 = 2√3. Step 2: Simplify √27 = 3√3. Step 3: Now both are √3s: 2√3 + 3√3. Step 4: = 5√3."
      real_world: "A triangle has sides of √12 cm, √27 cm and √48 cm. They are 2√3, 3√3 and 4√3, so the perimeter is 9√3 cm, about 15.6 cm."
    activity:
      type: sort
      prompt: Can the two be added into a single term?
      bins:
      - Yes, one term
      - 'No'
      items:
      - label: √2 + √8
        bin: Yes, one term
        why: '√8 = √(4 × 2) = 2√2, so √2 + 2√2 = 3√2: one term.'
        clue: Can √8 be written using √2?
      - label: √3 + √12
        bin: Yes, one term
        why: '√12 = 2√3, so √3 + 2√3 = 3√3: one term.'
        clue: Can √12 be written using √3?
      - label: √2 + √3
        bin: 'No'
        why: √2 and √3 are different roots that can't be simplified, so they stay two terms, like 2 apples + 3 mangoes.
        clue: Can either be written using the other's square root?
      - label: √5 + √20
        bin: Yes, one term
        clue: Is there a square number inside 20?
        why: '√20 = 2√5, so √5 + 2√5 = 3√5: one term.'
      - label: √6 + √10
        bin: 'No'
        clue: Do 6 or 10 have a square factor like 4 or 9?
        why: Neither 6 nor 10 has a square factor, so √6 and √10 stay separate.
      - label: 2√7 + √7
        bin: Yes, one term
        clue: 'Both count the same thing: √7. How many √7s altogether?'
        why: '2 of √7 plus 1 of √7 is 3√7: one term.'
    lesson:
      - teach: 'Roots of the same number add like apples: 2√3 + 5√3 = 7√3, just as 2 apples + 5 apples = 7 apples. Subtraction works the same: 6√5 − 2√5 = 4√5.'
        check:
          prompt: What is 4√2 + 3√2?
          options:
          - 7√2
          - 7√4
          - 12√2
          answer: 7√2
          why: 'Both are √2, so add the numbers in front: 4 + 3 = 7.'
      - teach: '√a + √b is NOT √(a + b). Test it: √9 + √16 = 3 + 4 = 7, but √25 = 5. Different roots can''t be combined as they are.'
        check:
          prompt: Is √4 + √9 the same as √13?
          options:
          - No, √4 + √9 = 5, but √13 is not 5
          - 'Yes'
          answer: No, √4 + √9 = 5, but √13 is not 5
          why: 2 + 3 = 5, and 5² = 25, not 13.
      - teach: But simplifying first can make them alike. √8 + √2 = 2√2 + √2 = 3√2. √12 + √27 = 2√3 + 3√3 = 5√3.
        check:
          prompt: What is √18 + √2?
          options:
          - 4√2
          - √20
          - 3√2
          answer: 4√2
          why: √18 = 3√2, and 3√2 + √2 = 4√2.
    items:
      - prompt: "What is 2√3 + 5√3?"
        options: ["7√3", "7√6", "10√3", "√21"]
        answer: "7√3"
        check: "2*sqrt(3) + 5*sqrt(3)"
        difficulty: 1
        hints: ["Count the √3s, like 2x + 5x."]
        solution: "2√3 + 5√3 = 7√3"
        mistakes: {"7√6": like_terms, "10√3": like_terms}
      - prompt: "What is 6√5 − 2√5?"
        options: ["4√5", "4", "8√5", "√20"]
        answer: "4√5"
        check: "6*sqrt(5) - 2*sqrt(5)"
        difficulty: 1
        hints: ["Like 6x − 2x."]
        solution: "6√5 − 2√5 = 4√5"
        mistakes: {"4": like_terms, "8√5": like_terms}
      - prompt: "What is √8 + √2?"
        options: ["3√2", "√10", "2√2", "4"]
        answer: "3√2"
        check: "sqrt(8) + sqrt(2)"
        difficulty: 2
        hints: ["Simplify √8 first.", "√8 = 2√2."]
        solution: "Step 1: √8 = 2√2. Step 2: 2√2 + √2 = 3√2."
        mistakes: {"√10": root_of_sum}
      - prompt: "What is √12 + √27?"
        options: ["5√3", "√39", "6√3", "13√3"]
        answer: "5√3"
        check: "sqrt(12) + sqrt(27)"
        difficulty: 2
        hints: ["√12 = 2√3 and √27 = 3√3."]
        solution: "Step 1: √12 = 2√3. Step 2: √27 = 3√3. Step 3: 2√3 + 3√3 = 5√3."
        mistakes: {"√39": root_of_sum}
      - prompt: "Is √9 + √16 equal to √25?"
        options: ["No: √9 + √16 is 7, but √25 is 5", "Yes: both are 5", "Yes: both are 7", "No: √9 + √16 is 25"]
        answer: "No: √9 + √16 is 7, but √25 is 5"
        difficulty: 2
        hints: ["Work out each root: √9 = 3 and √16 = 4."]
        solution: "Step 1: √9 + √16 = 3 + 4 = 7. Step 2: √25 = 5. Step 3: So they are not equal."
        mistakes: {"Yes: both are 5": root_of_sum}
      - prompt: "What is √50 − √18 + √8?"
        options: ["4√2", "√40", "2√2", "6√2"]
        answer: "4√2"
        check: "sqrt(50) - sqrt(18) + sqrt(8)"
        difficulty: 3
        hints: ["√50 = 5√2, √18 = 3√2 and √8 = 2√2."]
        solution: "Step 1: 5√2 − 3√2 + 2√2. Step 2: = 4√2."
        mistakes: {"√40": root_of_sum}
      - prompt: "A triangle's sides are √12 cm, √27 cm and √48 cm. What is its perimeter, in cm?"
        options: ["9√3", "√87", "9", "3√3"]
        answer: "9√3"
        check: "sqrt(12) + sqrt(27) + sqrt(48)"
        difficulty: 3
        hints: ["Simplify each: 2√3, 3√3 and 4√3."]
        solution: "Step 1: √12 + √27 + √48 = 2√3 + 3√3 + 4√3. Step 2: = 9√3 cm."
        mistakes: {"√87": root_of_sum}
      - prompt: "What is √20 + √45?"
        options: ["5√5", "√65", "13√5", "5√10"]
        answer: "5√5"
        difficulty: 2
        hints: ["Simplify each root first.", "√20 = 2√5 and √45 = 3√5."]
        solution: "Step 1: √20 = 2√5. Step 2: √45 = 3√5. Step 3: 2√5 + 3√5 = 5√5."
        mistakes: {"√65": root_of_sum, "5√10": like_terms}
      - prompt: "What is 3√8 − √32?"
        options: ["2√2", "2√6", "√24", "8√2"]
        answer: "2√2"
        difficulty: 3
        hints: ["√8 = 2√2 and √32 = 4√2.", "3 × 2√2 = 6√2."]
        solution: "Step 1: 3√8 = 6√2. Step 2: √32 = 4√2. Step 3: 6√2 − 4√2 = 2√2."
        mistakes: {"2√6": like_terms, "√24": root_of_sum}
      - prompt: "A rectangle is √50 cm long and √18 cm wide. What is its perimeter, in cm?"
        options: ["16√2", "8√2", "2√68", "30"]
        answer: "16√2"
        difficulty: 3
        hints: ["Perimeter = 2 × (length + width).", "√50 = 5√2 and √18 = 3√2."]
        solution: "Step 1: √50 + √18 = 5√2 + 3√2 = 8√2. Step 2: Perimeter = 2 × 8√2 = 16√2 cm."
        mistakes: {"8√2": perimeter_half, "2√68": root_of_sum}
      - prompt: What is 9√7 − 4√7?
        options:
        - 5√7
        - '5'
        - 13√7
        - √35
        answer: 5√7
        check: 9*sqrt(7) - 4*sqrt(7)
        difficulty: 1
        hints:
        - Both are √7.
        - Subtract the numbers in front.
        solution: 'Step 1: Both terms are multiples of √7. Step 2: 9 − 4 = 5. Step 3: So 5√7.'
        mistakes:
          13√7: like_terms
          '5': like_terms
      - prompt: What is √3 + 2√3 + 3√3?
        options:
        - 6√3
        - 6√9
        - 5√3
        - √18
        answer: 6√3
        check: sqrt(3) + 2*sqrt(3) + 3*sqrt(3)
        difficulty: 1
        hints:
        - √3 on its own counts as 1√3.
        - 1 + 2 + 3.
        solution: 'Step 1: All three are √3. Step 2: 1 + 2 + 3 = 6. Step 3: So 6√3.'
        mistakes:
          6√9: added_under_root
          5√3: like_terms
      - prompt: What is √32 + √8?
        options:
        - 6√2
        - √40
        - 2√10
        - 8√2
        answer: 6√2
        check: sqrt(32) + sqrt(8)
        difficulty: 2
        hints:
        - Simplify each root first.
        - √32 = 4√2 and √8 = 2√2.
        solution: 'Step 1: √32 = 4√2. Step 2: √8 = 2√2. Step 3: 4√2 + 2√2 = 6√2.'
        mistakes:
          √40: root_of_sum
          2√10: root_of_sum
      - prompt: What is √75 − √12?
        options:
        - 3√3
        - √63
        - 7√3
        - 3√7
        answer: 3√3
        check: sqrt(75) - sqrt(12)
        difficulty: 2
        hints:
        - Simplify each root first.
        - √75 = 5√3 and √12 = 2√3.
        solution: 'Step 1: √75 = 5√3. Step 2: √12 = 2√3. Step 3: 5√3 − 2√3 = 3√3.'
        mistakes:
          √63: root_of_sum
          7√3: added_outside
      - prompt: A square has sides of √8 cm. What is its perimeter, in cm?
        options:
        - 8√2
        - 4√2
        - 2√2
        - '16'
        answer: 8√2
        check: 4*sqrt(8)
        difficulty: 3
        hints:
        - Perimeter = 4 × side.
        - √8 = 2√2.
        solution: 'Step 1: √8 = 2√2. Step 2: Perimeter = 4 × 2√2. Step 3: = 8√2 cm.'
        mistakes:
          '16': square_not_root_out

  - code: math9.irrmul.divide
    title: Dividing square roots
    after: [math9.irrmul.simplify]
    notes: |
      √a ÷ √b = √(a/b): √18 ÷ √2 = √9 = 3. To remove a root from the bottom of a fraction, multiply
      top and bottom by that root: 1/√2 = √2/2, 6/√3 = 6√3/3 = 2√3. With √2 ≈ 1.414, 1/√2 ≈ 0.707.
    explanations:
      text: "Dividing works like multiplying: √18 ÷ √2 = √(18 ÷ 2) = √9 = 3. When a root is at the bottom of a fraction, multiply the top and the bottom by it: 1/√2 = √2/(√2 × √2) = √2/2. The value stays the same, but now it's easy to work out: 1.414 ÷ 2 ≈ 0.707."
      visual: "Picture 6/√3 as a seesaw. Multiplying both ends by √3 keeps it level: 6√3 on top, 3 at the bottom. Now the bottom is a plain number, and 6√3/3 = 2√3."
      step_by_step: "For 10/√5: Step 1: Multiply top and bottom by √5: 10√5/(√5 × √5). Step 2: The bottom is 5. Step 3: 10√5/5 = 2√5."
      real_world: "A square has a diagonal of 1 m. Its side is 1/√2 m. Dividing 1 by 1.414 by hand is slow, but √2/2 = 1.414 ÷ 2 ≈ 0.707 m is quick."
    picture:
      kind: flow
      steps: [6/√3, 'Multiply top and bottom by √3: 6√3 / 3', Divide 6 by 3, 6/√3 = 2√3]
      alt: 'Dividing 6 by root 3: multiply top and bottom by root 3 to get 6 root 3 over 3, which is 2 root 3.'
    activity:
      type: formula
      prompt: √a ÷ √b is the same as √(a ÷ b).
      inputs:
      - name: a
        label: a
        min: 1
        max: 50
        step: 1
        start: 1
      - name: b
        label: b
        min: 1
        max: 10
        step: 1
        start: 1
      outputs:
      - name: p
        label: √a ÷ √b
        expr: sqrt(a)/sqrt(b)
        places: 3
      - name: q
        label: √(a ÷ b)
        expr: sqrt(a/b)
        places: 3
      goals:
      - prompt: Make √a ÷ √b equal 3 with b = 2.
        want:
          p: 3
          b: 2
        hint: a ÷ b must be 9.
        mistakes:
        - when:
            a: 6
            b: 2
          say: '√6 ÷ √2 = √3, about 1.73, not 3. Dividing roots divides what''s inside: 6 ÷ 2 = 3 stays under the root. What''s inside must be 3², not 3.'
    lesson:
      - teach: 'Dividing works like multiplying: √a ÷ √b = √(a ÷ b). So √18 ÷ √2 = √9 = 3. And √50 ÷ √2 = √25 = 5.'
        check:
          prompt: What is √32 ÷ √2?
          options:
          - '4'
          - √30
          - '16'
          answer: '4'
          why: √(32 ÷ 2) = √16 = 4.
      - teach: 'A root at the bottom of a fraction is awkward. Multiply the top and the bottom by that root to move it: 1/√2 = (1 × √2)/(√2 × √2) = √2/2. The value doesn''t change, because we multiplied by √2/√2 = 1.'
        check:
          prompt: To clear the root from 5/√3, what do you multiply the top and bottom by?
          options:
          - √3
          - '3'
          - '5'
          answer: √3
          why: '√3 × √3 = 3, so the bottom becomes 3: 5/√3 = 5√3/3.'
      - teach: 'Then simplify if you can: 6/√3 = 6√3/3 = 2√3. It also makes decimals easy: 1/√2 = √2/2 ≈ 1.414 ÷ 2 = 0.707.'
        check:
          prompt: What is 4/√2 without a root at the bottom?
          options:
          - 2√2
          - 4√2
          - √2/4
          answer: 2√2
          why: 4/√2 = 4√2/2 = 2√2.
    items:
      - prompt: "What is √18 ÷ √2?"
        answer: "3"
        check: "sqrt(18)/sqrt(2)"
        difficulty: 1
        hints: ["√(18 ÷ 2) = √9."]
        solution: "Step 1: √18 ÷ √2 = √9. Step 2: = 3."
        mistakes: {"9": forgot_root}
      - prompt: "What is √50 ÷ √2?"
        answer: "5"
        check: "sqrt(50)/sqrt(2)"
        difficulty: 1
        hints: ["√(50 ÷ 2) = √25."]
        solution: "Step 1: √50 ÷ √2 = √25. Step 2: = 5."
        mistakes: {"25": forgot_root}
      - prompt: "Write 1/√2 without a root at the bottom."
        options: ["√2/2", "2/√2", "√2", "1/2"]
        answer: "√2/2"
        check: "1/sqrt(2)"
        difficulty: 2
        hints: ["Multiply the top and bottom by √2.", "√2 × √2 = 2."]
        solution: "1/√2 = √2/(√2 × √2) = √2/2"
        mistakes: {"1/2": rationalise_both, "√2": rationalise_both}
      - prompt: "Write 6/√3 without a root at the bottom."
        options: ["2√3", "3√2", "6√3", "2"]
        answer: "2√3"
        check: "6/sqrt(3)"
        difficulty: 2
        hints: ["Multiply the top and bottom by √3.", "6√3/3 = ?"]
        solution: "Step 1: 6/√3 = 6√3/3. Step 2: = 2√3."
        mistakes: {"6√3": rationalise_both, "2": rationalise_both}
      - prompt: "Using √2 ≈ 1.414, what is 1/√2, to three decimal places?"
        answer: "0.707"
        check: "1.414/2"
        difficulty: 2
        hints: ["1/√2 = √2/2.", "1.414 ÷ 2."]
        solution: "Step 1: 1/√2 = √2/2. Step 2: ≈ 1.414 ÷ 2 = 0.707."
        mistakes: {"2.828": "rationalise_half", "1.414": "rationalise_half"}
      - prompt: "Simplify √(3/4)."
        options: ["√3/2", "3/2", "√3/4", "3/4"]
        answer: "√3/2"
        check: "sqrt(3/4)"
        difficulty: 3
        hints: ["Take the root of the top and of the bottom.", "√4 = 2."]
        solution: "√(3/4) = √3/√4 = √3/2"
        mistakes: {"√3/4": root_top_only}
      - prompt: "Write 10/√5 without a root at the bottom."
        options: ["2√5", "5√2", "10√5", "√2"]
        answer: "2√5"
        check: "10/sqrt(5)"
        difficulty: 3
        hints: ["Multiply the top and bottom by √5."]
        solution: "Step 1: 10/√5 = 10√5/5. Step 2: = 2√5."
        mistakes: {"10√5": rationalise_both}
      - prompt: "What is √72 ÷ √8?"
        answer: "3"
        check: "sqrt(72/8)"
        difficulty: 2
        hints: ["√a ÷ √b = √(a ÷ b).", "72 ÷ 8 = 9."]
        solution: "Step 1: √72 ÷ √8 = √9. Step 2: √9 = 3."
        mistakes: {"9": forgot_root}
      - prompt: "Write 3/√6 without a root at the bottom."
        options: ["√6/2", "3√6", "√6/6", "√3/2"]
        answer: "√6/2"
        difficulty: 3
        hints: ["Multiply top and bottom by √6.", "3√6/6, then simplify."]
        solution: "Step 1: 3/√6 × √6/√6 = 3√6/6. Step 2: 3√6/6 = √6/2."
        mistakes: {"3√6": rationalise_both, "√6/6": rationalise_both}
      - prompt: "Using √3 ≈ 1.732, what is 3/√3, to three decimal places?"
        answer: "1.732"
        check: "3*1.732/3"
        difficulty: 3
        hints: ["3/√3 = 3√3/3.", "That simplifies to √3."]
        solution: "Step 1: 3/√3 = 3√3/3 = √3. Step 2: √3 ≈ 1.732."
        mistakes: {"5.196": rationalise_both, "0.577": rationalise_half}
      - prompt: What is √27 ÷ √3?
        answer: '3'
        check: sqrt(27)/sqrt(3)
        difficulty: 1
        hints:
        - Divide under the root.
        - 27 ÷ 3 = 9.
        solution: 'Step 1: √27 ÷ √3 = √(27 ÷ 3). Step 2: = √9. Step 3: = 3.'
        mistakes:
          '9': square_not_root_out
      - prompt: Write 1/√5 without a root at the bottom.
        options:
        - √5/5
        - 5/√5
        - √5
        - 1/5
        answer: √5/5
        check: 1/sqrt(5)
        difficulty: 1
        hints:
        - Multiply the top and the bottom by √5.
        - √5 × √5 = 5.
        solution: 'Step 1: Multiply top and bottom by √5. Step 2: The top becomes √5 and the bottom 5. Step 3: So √5/5.'
        mistakes:
          √5: rationalise_both
      - prompt: Write 12/√6 without a root at the bottom.
        options:
        - 2√6
        - 12√6
        - √6/2
        - 6√2
        answer: 2√6
        check: 12/sqrt(6)
        difficulty: 2
        hints:
        - Multiply the top and the bottom by √6.
        - 12√6/6 can be simplified.
        solution: 'Step 1: 12/√6 = 12√6/6. Step 2: 12 ÷ 6 = 2. Step 3: So 2√6.'
        mistakes:
          12√6: rationalise_both
      - prompt: Using √5 ≈ 2.236, what is 5/√5, to three decimal places?
        answer: '2.236'
        check: '2.236'
        difficulty: 2
        hints:
        - 'Clear the root first: 5/√5 = 5√5/5.'
        - That is just √5.
        solution: 'Step 1: 5/√5 = 5√5/5. Step 2: = √5. Step 3: ≈ 2.236.'
        mistakes:
          '1.118': rationalise_half
      - prompt: Simplify √(5/9).
        options:
        - √5/3
        - 5/3
        - √5/9
        - √(5/3)
        answer: √5/3
        check: sqrt(5/9)
        difficulty: 3
        hints:
        - Take the root of the top and of the bottom.
        - √9 = 3.
        solution: 'Step 1: √(5/9) = √5/√9. Step 2: √9 = 3. Step 3: So √5/3.'
        mistakes:
          √5/9: rationalise_half

  - code: math9.irrmul.identities
    title: Identities with square roots
    after: [math9.irrmul.add, math9.irrmul.divide]
    notes: |
      The identities of chapter 4 work with roots: (√3 + √2)(√3 − √2) = 3 − 2 = 1,
      (√2 + 1)² = 2 + 2√2 + 1 = 3 + 2√2, (√5 − 1)² = 6 − 2√5. A sum times a difference removes the
      roots, which is how 1/(√3 + √2) becomes √3 − √2.
    explanations:
      text: "(a + b)(a − b) = a² − b² works for roots too: (√3 + √2)(√3 − √2) = 3 − 2 = 1. The roots disappear. Squares work as well: (√2 + 1)² = 2 + 2√2 + 1 = 3 + 2√2."
      visual: "Draw a square with side √2 + 1. Inside are a √2 × √2 square (area 2), a 1 × 1 square (area 1) and two √2 × 1 rectangles (area √2 each). Total: 3 + 2√2."
      step_by_step: "For 1/(√3 + √2): Step 1: Multiply top and bottom by √3 − √2. Step 2: The bottom is (√3 + √2)(√3 − √2) = 3 − 2 = 1. Step 3: The top is √3 − √2. Step 4: So 1/(√3 + √2) = √3 − √2."
      real_world: "A rectangle is (√7 + 2) cm long and (√7 − 2) cm wide. Although both sides are irrational, its area is a whole number: 7 − 4 = 3 cm²."
    picture:
      kind: area_grid
      cols:
      - {size: 2.2, label: √2}
      - {size: 1.5, label: '1'}
      rows:
      - {size: 2.2, label: √2}
      - {size: 1.5, label: '1'}
      cells:
      - ['2', √2]
      - [√2, '1']
      caption: (√2 + 1)² = 2 + √2 + √2 + 1 = 3 + 2√2
      alt: A square of side root 2 plus 1 split into areas 2, root 2, root 2 and 1, which add to 3 + 2 root 2.
    activity:
      type: formula
      prompt: (√a + √b)(√a − √b) has no square roots left in it. See why.
      inputs:
      - name: a
        label: a
        min: 1
        max: 15
        step: 1
        start: 1
      - name: b
        label: b
        min: 1
        max: 15
        step: 1
        start: 1
      outputs:
      - name: p
        label: (√a + √b)(√a − √b)
        expr: (sqrt(a)+sqrt(b))*(sqrt(a)-sqrt(b))
        places: 3
      - name: q
        label: a − b
        expr: a-b
      goals:
      - prompt: Make the product equal 5 using a = 7.
        want:
          p: 5
          a: 7
        mistakes:
        - when:
            a: 7
            b: 5
          say: (√7 + √5)(√7 − √5) = 7 − 5 = 2. The square roots vanish and leave a − b, so a − b has to be 5.
    lesson:
      - teach: The identities from chapter 4 work with roots too. (√3 + √2)(√3 − √2) is a sum times a difference, so it is (√3)² − (√2)² = 3 − 2 = 1. The roots vanish.
        check:
          prompt: What is (√5 + √2)(√5 − √2)?
          options:
          - '3'
          - √3
          - '7'
          answer: '3'
          why: (√5)² − (√2)² = 5 − 2 = 3.
      - teach: 'Squares of sums keep a root in the middle: (√2 + 1)² = (√2)² + 2 × √2 × 1 + 1² = 2 + 2√2 + 1 = 3 + 2√2. Squares of differences: (√5 − 1)² = 5 − 2√5 + 1 = 6 − 2√5.'
        check:
          prompt: What is (√3 + 1)²?
          options:
          - 4 + 2√3
          - '4'
          - 3 + 2√3
          answer: 4 + 2√3
          why: 3 + 2√3 + 1 = 4 + 2√3.
      - teach: 'The sum-times-difference trick clears roots from the bottom of a fraction. 1/(√3 + √2): multiply top and bottom by √3 − √2. The bottom becomes 3 − 2 = 1, so the answer is √3 − √2.'
        check:
          prompt: To clear the roots from 1/(√5 + √3), multiply the top and bottom by what?
          options:
          - √5 − √3
          - √5 + √3
          - √15
          answer: √5 − √3
          why: (√5 + √3)(√5 − √3) = 5 − 3 = 2, which has no root.
    items:
      - prompt: "What is (√3 + √2)(√3 − √2)?"
        answer: "1"
        check: "expand((sqrt(3) + sqrt(2))*(sqrt(3) - sqrt(2)))"
        difficulty: 1
        hints: ["(a + b)(a − b) = a² − b².", "(√3)² − (√2)²."]
        solution: "Step 1: (√3)² − (√2)². Step 2: = 3 − 2 = 1."
        mistakes: {"5": sum_not_difference}
      - prompt: "What is (√7 + 2)(√7 − 2)?"
        answer: "3"
        check: "expand((sqrt(7) + 2)*(sqrt(7) - 2))"
        difficulty: 1
        hints: ["(√7)² − 2²."]
        solution: "Step 1: (√7)² − 2². Step 2: = 7 − 4 = 3."
        mistakes: {"11": sum_not_difference}
      - prompt: "Expand (√2 + 1)²."
        options: ["3 + 2√2", "3", "2 + 2√2", "3 + √2"]
        answer: "3 + 2√2"
        check: "expand((sqrt(2) + 1)^2)"
        difficulty: 2
        hints: ["(a + b)² = a² + 2ab + b².", "(√2)² = 2."]
        solution: "(√2)² + 2(√2)(1) + 1² = 2 + 2√2 + 1 = 3 + 2√2"
        mistakes: {"3": square_each_term, "3 + √2": missing_double}
      - prompt: "Expand (√5 − 1)²."
        options: ["6 − 2√5", "4", "6 + 2√5", "4 − 2√5"]
        answer: "6 − 2√5"
        check: "expand((sqrt(5) - 1)^2)"
        difficulty: 2
        hints: ["(a − b)² = a² − 2ab + b²."]
        solution: "(√5)² − 2(√5)(1) + 1² = 5 − 2√5 + 1 = 6 − 2√5"
        mistakes: {"4": square_each_term, "6 + 2√5": sign_middle}
      - prompt: "Write 1/(√3 + √2) without a root at the bottom."
        options: ["√3 − √2", "√3 + √2", "1/5", "√5"]
        answer: "√3 − √2"
        check: "1/(sqrt(3) + sqrt(2))"
        difficulty: 3
        hints: ["Multiply top and bottom by the bottom with its sign in the middle changed.", "The bottom becomes 3 − 2 = 1."]
        solution: "Step 1: Multiply by (√3 − √2)/(√3 − √2). Step 2: The bottom is 3 − 2 = 1. Step 3: The answer is √3 − √2."
        mistakes: {"1/5": root_of_sum, "√5": root_of_sum}
      - prompt: "x = √2 + 1. What is x² − 2x?"
        answer: "1"
        check: "expand((sqrt(2) + 1)^2 - 2*(sqrt(2) + 1))"
        difficulty: 3
        hints: ["x² = 3 + 2√2.", "2x = 2√2 + 2."]
        solution: "Step 1: x² = 3 + 2√2. Step 2: 2x = 2√2 + 2. Step 3: x² − 2x = 3 − 2 = 1."
        mistakes: {"3": "expand_then_subtract", "-1": "expand_then_subtract"}
      - prompt: "x = √3. What is x² + x + 1 − √3?"
        answer: "4"
        check: "sqrt(3)^2 + sqrt(3) + 1 - sqrt(3)"
        difficulty: 3
        hints: ["x² = 3.", "x and −√3 cancel."]
        solution: "Step 1: 3 + √3 + 1 − √3. Step 2: = 4."
        mistakes: {"3": "roots_cancel"}
      - prompt: "What is (2√3 + 1)(2√3 − 1)?"
        answer: "11"
        check: "(2*sqrt(3))**2 - 1"
        difficulty: 2
        hints: ["(a + b)(a − b) = a² − b².", "(2√3)² = 4 × 3."]
        solution: "Step 1: (2√3)² = 12. Step 2: 12 − 1 = 11."
        mistakes: {"5": square_coefficient, "13": sum_not_difference}
      - prompt: "Expand (√3 + √2)²."
        options: ["5 + 2√6", "5", "5 + √6", "6 + 2√5"]
        answer: "5 + 2√6"
        difficulty: 3
        hints: ["(a + b)² = a² + 2ab + b².", "2ab = 2√3√2 = 2√6."]
        solution: "Step 1: (√3)² + (√2)² = 5. Step 2: 2 × √3 × √2 = 2√6. Step 3: Total 5 + 2√6."
        mistakes: {"5": square_each_term, "5 + √6": missing_double}
      - prompt: "Write 2/(√5 − 1) without a root at the bottom."
        options: ["(√5 + 1)/2", "√5 + 1", "(√5 − 1)/2", "2√5 + 2"]
        answer: "(√5 + 1)/2"
        difficulty: 3
        hints: ["Multiply top and bottom by √5 + 1.", "The bottom becomes 5 − 1 = 4."]
        solution: "Step 1: 2(√5 + 1)/((√5 − 1)(√5 + 1)) = 2(√5 + 1)/4. Step 2: = (√5 + 1)/2."
        mistakes: {"√5 + 1": rationalise_both, "(√5 − 1)/2": root_of_sum}
      - prompt: What is (√6 + 1)(√6 − 1)?
        answer: '5'
        check: (sqrt(6) + 1)*(sqrt(6) - 1)
        difficulty: 1
        hints:
        - It is a sum times a difference.
        - (√6)² − 1².
        solution: 'Step 1: (a + b)(a − b) = a² − b². Step 2: (√6)² − 1² = 6 − 1. Step 3: = 5.'
        mistakes:
          '7': roots_cancel
      - prompt: What is (√11 + 3)(√11 − 3)?
        answer: '2'
        check: (sqrt(11) + 3)*(sqrt(11) - 3)
        difficulty: 1
        hints:
        - Sum times difference.
        - 11 − 9.
        solution: 'Step 1: (√11)² = 11. Step 2: 3² = 9. Step 3: 11 − 9 = 2.'
        mistakes:
          '8': roots_cancel
      - prompt: Expand (√3 − 1)².
        options:
        - 4 − 2√3
        - '2'
        - '4'
        - 3 − 2√3
        answer: 4 − 2√3
        check: expand((sqrt(3) - 1)**2)
        difficulty: 2
        hints:
        - (a − b)² = a² − 2ab + b².
        - 3 − 2√3 + 1.
        solution: 'Step 1: (√3)² = 3. Step 2: −2 × √3 × 1 = −2√3. Step 3: 3 − 2√3 + 1 = 4 − 2√3.'
        mistakes:
          '2': missing_double
          '4': missing_double
      - prompt: Expand (√5 + √2)².
        options:
        - 7 + 2√10
        - '7'
        - 7 + √10
        - 25 + 2√10
        answer: 7 + 2√10
        check: expand((sqrt(5) + sqrt(2))**2)
        difficulty: 2
        hints:
        - (a + b)² = a² + 2ab + b².
        - 5 + 2√10 + 2.
        solution: 'Step 1: (√5)² = 5 and (√2)² = 2. Step 2: 2 × √5 × √2 = 2√10. Step 3: 5 + 2 + 2√10 = 7 + 2√10.'
        mistakes:
          '7': missing_double
          7 + √10: missing_double
      - prompt: Write 4/(√7 + √3) without roots at the bottom.
        options:
        - √7 − √3
        - √7 + √3
        - 4(√7 − √3)
        - (√7 − √3)/4
        answer: √7 − √3
        check: 4/(sqrt(7) + sqrt(3))
        difficulty: 3
        hints:
        - Multiply the top and bottom by the bottom with its sign changed.
        - The bottom becomes 7 − 3 = 4.
        solution: 'Step 1: Multiply top and bottom by √7 − √3. Step 2: The bottom is 7 − 3 = 4 and the top is 4(√7 − √3). Step 3: 4(√7 − √3)/4 = √7 − √3.'
        mistakes:
          4(√7 − √3): rationalise_half
