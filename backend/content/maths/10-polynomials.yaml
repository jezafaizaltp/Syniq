# Class 9 Mathematics, chapter 10. Format: content/README.md.
# Also uses tips from earlier chapters: times_not_plus, square_of_negative, sign_rule, sign_slip,
# forgot_divide, other_side, minus_negative, product_terms.
subject: math
chapter: 10
title: Polynomials

tips:
  coefficient_not_degree: "The degree is the highest power of x, not the number in front of it."
  dropped_sign: "The sign belongs to the term: in −9x the coefficient is −9."
  added_constants: "The constant term of a product comes from multiplying the constants, not adding them."
  multiplied_degrees: "When polynomials are multiplied, their degrees add: x² × x³ = x⁵."
  added_powers: "When adding, only the numbers in front change: 3x² + x² = 4x². The power stays the same."
  multiply_every_term: "Multiply every term in one bracket by every term in the other, then collect like terms."
  cube_degree: "The degree is the highest power of x once you multiply out. (x + 1)² starts with x²; what does (x + 1) multiplied three times start with?"
  degree_highest_power: "The degree is the highest power of x: 3x has power 1."
  substitute_carefully: "Put the value of x into every term, one at a time, and keep each sign: work out x³, then 2x², then x, then add and take away in order."

concepts:
  - code: math9.poly.terms
    title: Terms, coefficients and degree
    notes: |
      A polynomial in x is a sum of terms like 3x², −5x and 7. The number in front of a term is its
      coefficient (with its sign), the term without x is the constant term, and the highest power
      of x is the degree. When polynomials are multiplied, their degrees add.
    explanations:
      text: "In 3x² − 5x + 7 there are three terms. 3x² has coefficient 3, −5x has coefficient −5, and 7 is the constant term. The highest power of x is 2, so the degree is 2. A polynomial of degree 1, like 3x − 7, is called linear; degree 2 is quadratic."
      visual: "Write each term in its own box, sign included: [3x²] [−5x] [+7]. The first box has the highest power, 2: that is the degree. The number at the front of each box is its coefficient."
      step_by_step: "For (x² + 1)(x³ − x): Step 1: The highest power from the first bracket is x². Step 2: From the second, x³. Step 3: Multiplying them gives x⁵. Step 4: So the degree is 2 + 3 = 5."
      real_world: "The area of a square garden with a path of width x around a 10 m square is (10 + 2x)², which expands to 4x² + 40x + 100: a polynomial of degree 2 in x."
    activity:
      type: sort
      prompt: What is the degree (the highest power of x)?
      bins:
      - Degree 1
      - Degree 2
      - Degree 3
      items:
      - label: 3x + 1
        bin: Degree 1
        clue: Which power of x is in it? (x on its own is x¹.)
        why: x is x¹, so the degree is 1.
      - label: x² − 4
        bin: Degree 2
        clue: What is the biggest power of x?
        why: 'The biggest power is x²: degree 2.'
      - label: 2x³ + x
        bin: Degree 3
        clue: Ignore the 2 in front. What is the biggest power of x?
        why: 'x³ is the biggest power: degree 3. The 2 in front doesn''t change the degree.'
      - label: 5 − x
        bin: Degree 1
        clue: Which term has x in it, and what power?
        why: '−x is x¹: degree 1. The order of the terms doesn''t matter.'
      - label: x³
        bin: Degree 3
        clue: Only one term. What is its power?
        why: 'x³: degree 3.'
      - label: 4x² + x + 1
        bin: Degree 2
        clue: Look at each term's power of x. Which is biggest?
        why: 'x² is the biggest power: degree 2.'
    lesson:
      - teach: 'A polynomial in x is a sum of terms such as 3x², −5x and 7. Each term is a number times a whole-number power of x. The number in front of a term, with its sign, is its coefficient: in 3x² − 5x + 7, the coefficient of x is −5. The term with no x, here 7, is the constant term.'
        check:
          prompt: In 6x³ − 2x + 9, what is the coefficient of x?
          options:
          - −2
          - '2'
          - '6'
          answer: −2
          why: The term with x is −2x, and the sign belongs to the coefficient.
      - teach: 'The degree of a polynomial is the highest power of x in it. 3x² − 5x + 7 has degree 2. 4x − 1 has degree 1. Look at the power, not the coefficient: 9x² still has degree 2.'
        check:
          prompt: What is the degree of 2 + 8x − x⁴?
          options:
          - '4'
          - '8'
          - '2'
          answer: '4'
          why: The highest power of x is x⁴, so the degree is 4, wherever the term is written.
      - teach: 'When two polynomials are multiplied, their degrees add, because x³ × x² = x⁵. So (x² + 1)(x³ − x) has degree 2 + 3 = 5. The constant term of a product is the product of the constant terms: (x + 2)(x − 5) has constant term −10.'
        check:
          prompt: What is the degree of (x³ + 2)(x⁴ − 1)?
          options:
          - '7'
          - '12'
          - '4'
          answer: '7'
          why: 'x³ × x⁴ = x⁷, so the degrees add: 3 + 4 = 7.'
    items:
      - prompt: "Which of these is a polynomial of degree 1?"
        options: ["3x − 7", "x² − 7", "7", "x³ + x"]
        answer: "3x − 7"
        difficulty: 1
        hints: ["Degree 1 means the highest power of x is x itself."]
        solution: "Step 1: 3x − 7 has highest power x¹. Step 2: x² − 7 has degree 2, 7 has degree 0 and x³ + x has degree 3."
        mistakes: {"x² − 7": "degree_highest_power", "7": "degree_highest_power"}
      - prompt: "What is the degree of 3x² − 5x + 7?"
        answer: "2"
        check: "degree(3*x**2 - 5*x + 7, x)"
        difficulty: 1
        hints: ["Find the highest power of x."]
        solution: "The highest power is x², so the degree is 2."
        mistakes: {"3": coefficient_not_degree, "7": coefficient_not_degree}
      - prompt: "What is the coefficient of x in 4x³ + 2x² − 9x + 1?"
        answer: "-9"
        check: "Poly(4*x**3 + 2*x**2 - 9*x + 1, x).coeff_monomial(x)"
        difficulty: 1
        hints: ["Find the term with just x, and keep its sign."]
        solution: "The x term is −9x, so the coefficient is −9."
        mistakes: {"9": dropped_sign}
      - prompt: "What is the constant term of (x + 2)(x − 5)?"
        answer: "-10"
        check: "expand((x + 2)*(x - 5)).subs(x, 0)"
        difficulty: 2
        hints: ["The constant term comes from 2 × (−5)."]
        solution: "Step 1: The constants are 2 and −5. Step 2: 2 × (−5) = −10."
        mistakes: {"10": dropped_sign, "-3": added_constants}
      - prompt: "What is the degree of (x² + 1)(x³ − x)?"
        answer: "5"
        check: "degree(expand((x**2 + 1)*(x**3 - x)), x)"
        difficulty: 2
        hints: ["x² × x³ = ?"]
        solution: "Step 1: The highest terms are x² and x³. Step 2: x² × x³ = x⁵. Step 3: Degree 5."
        mistakes: {"6": multiplied_degrees}
      - prompt: "What is the degree of (x + 1)³?"
        answer: "3"
        check: "degree(expand((x + 1)**3), x)"
        difficulty: 3
        hints: ["(x + 1)³ = (x + 1)(x + 1)(x + 1).", "The highest term is x × x × x."]
        solution: "Step 1: Multiplying three brackets, the highest term is x³. Step 2: Degree 3."

        mistakes: {"1": "cube_degree", "4": "cube_degree"}
      - prompt: "What is the coefficient of x² in 5 − 3x + x³ − 7x²?"
        answer: "-7"
        check: "-7"
        difficulty: 2
        hints: ["Find the x² term, sign included.", "The terms can be in any order."]
        solution: "Step 1: The x² term is −7x². Step 2: Its coefficient is −7."
        mistakes: {"7": dropped_sign, "3": coefficient_not_degree}
      - prompt: "What is the degree of (2x³ + 1)(x² − 4) + x⁶?"
        answer: "6"
        check: "6"
        difficulty: 3
        hints: ["The product has highest power x³ × x² = x⁵.", "Then x⁶ is added."]
        solution: "Step 1: (2x³ + 1)(x² − 4) has degree 3 + 2 = 5. Step 2: Adding x⁶ gives degree 6."
        mistakes: {"5": degree_highest_power, "30": multiplied_degrees}
      - prompt: "What is the constant term of (x − 3)(x + 2)(x − 1)?"
        answer: "6"
        check: "(-3)*2*(-1)"
        difficulty: 3
        hints: ["The constant term is the product of the constants.", "(−3) × 2 × (−1)."]
        solution: "Step 1: Constant = (−3) × 2 × (−1). Step 2: = 6."
        mistakes: {"-6": dropped_sign, "-2": added_constants}
      - prompt: What is the degree of 7x⁵ + 3x² − 1?
        answer: '5'
        check: '5'
        difficulty: 1
        hints:
        - Find the highest power of x.
        - Ignore the coefficients.
        solution: 'Step 1: The powers are 5, 2 and 0. Step 2: The highest is 5. Step 3: So the degree is 5.'
        mistakes:
          '7': coefficient_not_degree
      - prompt: What is the constant term of 4x² − 6x − 11?
        answer: '-11'
        check: '-11'
        difficulty: 1
        hints:
        - It is the term with no x.
        - Keep its sign.
        solution: 'Step 1: The terms are 4x², −6x and −11. Step 2: −11 has no x. Step 3: So the constant term is −11.'
        mistakes:
          '11': dropped_sign
      - prompt: What is the coefficient of x³ in 2x − x³ + 5x²?
        answer: '-1'
        check: '-1'
        difficulty: 2
        hints:
        - −x³ means −1 × x³.
        - The sign belongs to the coefficient.
        solution: 'Step 1: The x³ term is −x³. Step 2: −x³ = −1 × x³. Step 3: So the coefficient is −1.'
        mistakes:
          '1': dropped_sign
          '3': coefficient_not_degree
      - prompt: What is the degree of (x² − 3)(x² + 3)?
        answer: '4'
        check: 2 + 2
        difficulty: 2
        hints:
        - Degrees add when you multiply.
        - x² × x².
        solution: 'Step 1: Each bracket has degree 2. Step 2: x² × x² = x⁴. Step 3: So the degree is 4.'
        mistakes:
          '2': added_powers
      - prompt: What is the constant term of (2x − 1)(x + 4)(x − 3)?
        answer: '12'
        check: (-1)*4*(-3)
        difficulty: 3
        hints:
        - Multiply the constant terms of the brackets.
        - (−1) × 4 × (−3).
        solution: 'Step 1: The constants are −1, 4 and −3. Step 2: (−1) × 4 = −4. Step 3: (−4) × (−3) = 12.'
        mistakes:
          '-12': dropped_sign
          '0': added_constants
      - prompt: What is the degree of (x + 2)⁴?
        answer: '4'
        check: '4'
        difficulty: 3
        hints:
        - (x + 2)⁴ is four brackets multiplied.
        - Each has degree 1.
        solution: 'Step 1: (x + 2)⁴ = (x + 2)(x + 2)(x + 2)(x + 2). Step 2: Degrees add: 1 + 1 + 1 + 1. Step 3: = 4.'
        mistakes:
          '1': cube_degree
          '8': multiplied_degrees
  - code: math9.poly.value
    title: The value of a polynomial
    after: [math9.poly.terms]
    notes: |
      p(x) names a polynomial; p(a) is its value when x = a. Replace x with the number in brackets
      and work it out, powers first. If p(a) = 0, then a is a zero of p. A condition like p(1) = 0
      can be used to find an unknown coefficient.
    explanations:
      text: "If p(x) = x² − 4, then p(3) means 'put 3 in place of x': p(3) = 3² − 4 = 5. And p(−2) = (−2)² − 4 = 0. When p(a) = 0, a is called a zero of the polynomial."
      visual: "Think of p as a machine. Drop 3 into the funnel; the machine squares it to 9 and takes away 4; out comes 5. Drop −2 in; it squares to 4, takes away 4, and out comes 0."
      step_by_step: "For p(x) = 3x² − x + 2 and x = −1: Step 1: Write (−1) wherever x is: 3(−1)² − (−1) + 2. Step 2: (−1)² = 1, so 3 × 1 = 3. Step 3: −(−1) = +1. Step 4: 3 + 1 + 2 = 6."
      real_world: "A taxi charges ₹50 plus ₹15 per km: p(x) = 15x + 50 for x km. A 6 km ride costs p(6) = 90 + 50 = ₹140."
    activity:
      type: formula
      prompt: Find the value of p(x) = x³ − 2x + 1 for different x.
      inputs:
      - name: x
        label: x
        min: -4
        max: 4
        step: 1
        start: 0
      outputs:
      - name: v
        label: p(x)
        expr: x^3-2*x+1
      goals:
      - prompt: Find x with p(x) = 5.
        want:
          v: 5
        mistakes:
        - when:
            x: -2
          say: 'x = −2 gives −8 + 4 + 1 = −3: the cube of a negative stays negative.'
      - prompt: Find x with p(x) = −20.
        want:
          v: -20
        mistakes:
        - when:
            x: 3
          say: x = 3 gives 27 − 6 + 1 = 22. To get a big negative answer, x³ must be negative.
    lesson:
      - teach: 'We often name a polynomial p(x). Then p(3) means its value when x = 3: put 3 in place of every x. If p(x) = 2x + 5, then p(3) = 2 × 3 + 5 = 11.'
        check:
          prompt: p(x) = 4x − 1. What is p(2)?
          options:
          - '7'
          - '41'
          - '3'
          answer: '7'
          why: 4 × 2 − 1 = 8 − 1 = 7.
      - teach: 'With negative numbers, use brackets and do powers first. p(x) = x² − 3x: p(−2) = (−2)² − 3 × (−2) = 4 + 6 = 10.'
        check:
          prompt: p(x) = x² + x. What is p(−3)?
          options:
          - '6'
          - −12
          - '12'
          answer: '6'
          why: (−3)² + (−3) = 9 − 3 = 6.
      - teach: 'If p(a) = 0, the number a is called a zero of p. For x² − 4: p(2) = 0 and p(−2) = 0, so 2 and −2 are its zeros. A fact like p(1) = 0 can also be used to find a missing coefficient.'
        check:
          prompt: p(x) = x² − 25. Which is a zero of p?
          options:
          - '5'
          - '25'
          - '0'
          answer: '5'
          why: p(5) = 25 − 25 = 0. (−5 is another zero.)
    items:
      - prompt: "p(x) = 2x + 5. What is p(3)?"
        answer: "11"
        check: "2*3 + 5"
        difficulty: 1
        hints: ["Put 3 in place of x: 2 × 3 + 5."]
        solution: "Step 1: p(3) = 2 × 3 + 5. Step 2: = 6 + 5 = 11."
        mistakes: {"10": times_not_plus}
      - prompt: "p(x) = x² − 4. What is p(−2)?"
        answer: "0"
        check: "(-2)**2 - 4"
        difficulty: 1
        hints: ["(−2)² = 4."]
        solution: "Step 1: p(−2) = (−2)² − 4. Step 2: = 4 − 4 = 0."
        mistakes: {"-8": square_of_negative}
      - prompt: "p(x) = x³ − 2x² + x − 1. What is p(2)?"
        answer: "1"
        check: "2**3 - 2*2**2 + 2 - 1"
        difficulty: 2
        hints: ["2³ = 8 and 2 × 2² = 8."]
        solution: "Step 1: 8 − 8 + 2 − 1. Step 2: = 1."
        mistakes: {"3": "substitute_carefully", "-1": "substitute_carefully"}
      - prompt: "p(x) = 3x² − x + 2. What is p(−1)?"
        answer: "6"
        check: "3*(-1)**2 - (-1) + 2"
        difficulty: 2
        hints: ["3(−1)² = 3.", "−(−1) = +1."]
        solution: "Step 1: 3(−1)² − (−1) + 2. Step 2: = 3 + 1 + 2 = 6."
        mistakes: {"4": sign_rule, "0": square_of_negative}
      - prompt: "p(x) = x² + kx + 6 and p(1) = 0. What is k?"
        answer: "-7"
        check: "-(1 + 6)"
        difficulty: 2
        hints: ["p(1) = 1 + k + 6.", "1 + k + 6 = 0."]
        solution: "Step 1: p(1) = 7 + k. Step 2: 7 + k = 0. Step 3: k = −7."
        mistakes: {"7": sign_slip}
      - prompt: "p(x) = ax + 3 and p(2) = 11. What is a?"
        answer: "4"
        check: "(11 - 3)/2"
        difficulty: 3
        hints: ["2a + 3 = 11."]
        solution: "Step 1: 2a + 3 = 11. Step 2: 2a = 8. Step 3: a = 4."
        mistakes: {"8": forgot_divide, "7": times_not_plus}
      - prompt: "p(x) = x² − 5x + 6. There are two numbers that make p(x) = 0. What is the smaller one?"
        answer: "2"
        check: "Min(*solve(x**2 - 5*x + 6, x))"
        difficulty: 3
        hints: ["Try x = 1, 2, 3.", "p(2) = 4 − 10 + 6."]
        solution: "Step 1: p(2) = 4 − 10 + 6 = 0. Step 2: p(3) = 9 − 15 + 6 = 0. Step 3: The smaller is 2."
        mistakes: {"3": other_side}
      - prompt: "p(x) = 2x² − 3x + 1. What is p(−2)?"
        answer: "15"
        check: "2*4 + 6 + 1"
        difficulty: 2
        hints: ["(−2)² = 4.", "2 × 4 − 3 × (−2) + 1."]
        solution: "Step 1: 2 × 4 = 8. Step 2: −3 × (−2) = +6. Step 3: 8 + 6 + 1 = 15."
        mistakes: {"3": sign_rule, "-1": square_of_negative}
      - prompt: "p(x) = x³ + kx − 4 and p(2) = 10. What is k?"
        answer: "3"
        check: "(10 + 4 - 8)/2"
        difficulty: 3
        hints: ["p(2) = 8 + 2k − 4.", "8 + 2k − 4 = 10."]
        solution: "Step 1: p(2) = 8 + 2k − 4 = 4 + 2k. Step 2: 4 + 2k = 10, so k = 3."
        mistakes: {"6": forgot_divide, "7": sign_slip}
      - prompt: "p(x) = x² − 9. Which numbers make p(x) = 0?"
        options: ["3 and −3", "Only 3", "9 and −9", "Only 9"]
        answer: "3 and −3"
        difficulty: 3
        hints: ["Which numbers squared give 9?", "Don't forget the negative one."]
        solution: "Step 1: x² = 9. Step 2: x = 3 or x = −3, since (−3)² = 9 too."
        mistakes: {"Only 3": other_side, "9 and −9": forgot_root}
      - prompt: p(x) = 3x − 4. What is p(5)?
        answer: '11'
        check: 3*5 - 4
        difficulty: 1
        hints:
        - Put 5 in place of x.
        - 3 × 5 − 4.
        solution: 'Step 1: p(5) = 3 × 5 − 4. Step 2: = 15 − 4. Step 3: = 11.'
        mistakes:
          '31': substitute_carefully
      - prompt: p(x) = x² + 2. What is p(−3)?
        answer: '11'
        check: (-3)**2 + 2
        difficulty: 1
        hints:
        - (−3)² first.
        - (−3)² = 9.
        solution: 'Step 1: (−3)² = 9. Step 2: 9 + 2. Step 3: = 11.'
        mistakes:
          '-7': substitute_carefully
      - prompt: p(x) = x³ − x. What is p(3)?
        answer: '24'
        check: 3**3 - 3
        difficulty: 2
        hints:
        - 3³ = 27.
        - 27 − 3.
        solution: 'Step 1: 3³ = 27. Step 2: 27 − 3. Step 3: = 24.'
        mistakes:
          '6': substitute_carefully
      - prompt: p(x) = x² − 6x + k and p(2) = 0. What is k?
        answer: '8'
        check: -(2**2 - 6*2)
        difficulty: 2
        hints:
        - Work out p(2) with k left in.
        - 4 − 12 + k = 0.
        solution: 'Step 1: p(2) = 4 − 12 + k. Step 2: −8 + k = 0. Step 3: k = 8.'
        mistakes:
          '-8': dropped_sign
      - prompt: p(x) = 2x² − 5x. What is p(−1) + p(1)?
        answer: '4'
        check: (2 + 5) + (2 - 5)
        difficulty: 3
        hints:
        - Work out each value separately.
        - p(−1) = 7 and p(1) = −3.
        solution: 'Step 1: p(−1) = 2 + 5 = 7. Step 2: p(1) = 2 − 5 = −3. Step 3: 7 + (−3) = 4.'
        mistakes:
          '-6': substitute_carefully
      - prompt: p(x) = x² − 7x + 10. What is the larger of the two numbers that make p(x) = 0?
        answer: '5'
        check: '5'
        difficulty: 3
        hints:
        - Look for two numbers that multiply to 10 and add to 7.
        - Try p(2) and p(5).
        solution: 'Step 1: x² − 7x + 10 = (x − 2)(x − 5). Step 2: p(2) = 0 and p(5) = 0. Step 3: The larger is 5.'
        mistakes:
          '2': substitute_carefully
          '10': substitute_carefully

  - code: math9.poly.operations
    title: Adding, subtracting and multiplying polynomials
    after: [math9.poly.value]
    notes: |
      Add or subtract polynomials by collecting like terms (same power of x); the powers don't change.
      Subtracting a bracket changes the sign of every term in it. To multiply, multiply every term of
      one by every term of the other and collect like terms.
    explanations:
      text: "Adding polynomials means adding like terms: (3x² + 2x − 1) + (x² − 5x + 4) = 4x² − 3x + 3. Only the numbers in front change; x² stays x². When subtracting a bracket, every sign inside flips: (5x − 3) − (2x − 7) = 5x − 3 − 2x + 7 = 3x + 4."
      visual: "Line the polynomials up in columns by power, like adding numbers in columns: an x² column, an x column and a number column. Add down each column."
      step_by_step: "For (x + 2)(x² − x + 3): Step 1: x × each term: x³ − x² + 3x. Step 2: 2 × each term: 2x² − 2x + 6. Step 3: Add: x³ + (−x² + 2x²) + (3x − 2x) + 6. Step 4: = x³ + x² + x + 6."
      real_world: "A shop's income is 40x + 200 rupees and its costs are 15x + 350 rupees for x items sold. Profit = (40x + 200) − (15x + 350) = 25x − 150 rupees."
    activity:
      type: formula
      prompt: (x + 1)(x − 2) multiplied out is x² − x − 2. Check it with numbers.
      inputs:
      - name: x
        label: x
        min: -6
        max: 6
        step: 1
        start: 0
      outputs:
      - name: p
        label: (x + 1)(x − 2)
        expr: (x+1)*(x-2)
      - name: q
        label: x² − x − 2
        expr: x^2-x-2
      goals:
      - prompt: Find an x where both equal 10.
        want:
          p: 10
      - prompt: 'Find an x where both equal 0. Look at the brackets: what makes a bracket 0?'
        want:
          p: 0
    lesson:
      - teach: 'To add polynomials, add like terms: terms with the same power of x. (3x² + 2x − 1) + (x² − 5x + 4) = 4x² − 3x + 3. The powers don''t change when you add: x² + x² is 2x², not x⁴.'
        check:
          prompt: What is (2x² + 3x) + (5x² − x)?
          options:
          - 7x² + 2x
          - 7x⁴ + 2x
          - 7x² + 4x
          answer: 7x² + 2x
          why: 2x² + 5x² = 7x² and 3x − x = 2x. Powers stay the same.
      - teach: Subtracting a bracket changes the sign of every term inside it. (5x − 3) − (2x − 7) = 5x − 3 − 2x + 7 = 3x + 4. Forgetting to change the sign of the last term is the usual slip.
        check:
          prompt: What is (x + 4) − (x − 2)?
          options:
          - '6'
          - '2'
          - 2x + 2
          answer: '6'
          why: x + 4 − x + 2 = 6. The −2 becomes +2.
      - teach: To multiply, multiply every term of one polynomial by every term of the other, then collect like terms. (x + 2)(x² − x + 3) = x³ − x² + 3x + 2x² − 2x + 6 = x³ + x² + x + 6.
        check:
          prompt: What is 3x(x² + 2)?
          options:
          - 3x³ + 6x
          - 3x³ + 2
          - 3x² + 6x
          answer: 3x³ + 6x
          why: 3x × x² = 3x³ and 3x × 2 = 6x.
    items:
      - prompt: "(3x² + 2x − 1) + (x² − 5x + 4) = ?"
        options: ["4x² − 3x + 3", "4x² + 7x + 3", "3x² − 3x + 3", "4x⁴ − 3x² + 3"]
        answer: "4x² − 3x + 3"
        check: "expand((3*x**2 + 2*x - 1) + (x**2 - 5*x + 4))"
        difficulty: 1
        hints: ["Add the x² terms, then the x terms, then the numbers."]
        solution: "Step 1: 3x² + x² = 4x². Step 2: 2x − 5x = −3x. Step 3: −1 + 4 = 3. Step 4: 4x² − 3x + 3."
        mistakes: {"4x² + 7x + 3": sign_slip, "4x⁴ − 3x² + 3": added_powers}
      - prompt: "(5x − 3) − (2x − 7) = ?"
        options: ["3x + 4", "3x − 10", "3x − 4", "7x + 4"]
        answer: "3x + 4"
        check: "expand((5*x - 3) - (2*x - 7))"
        difficulty: 1
        hints: ["Taking away the bracket flips every sign inside: −2x + 7."]
        solution: "Step 1: 5x − 3 − 2x + 7. Step 2: = 3x + 4."
        mistakes: {"3x − 10": minus_negative, "3x − 4": minus_negative}
      - prompt: "x(2x² − 3x + 4) = ?"
        options: ["2x³ − 3x² + 4x", "2x³ − 3x + 4", "−x² + 4x", "3x³ − 2x² + 5x"]
        answer: "2x³ − 3x² + 4x"
        check: "expand(x*(2*x**2 - 3*x + 4))"
        difficulty: 2
        hints: ["Multiply every term inside by x."]
        solution: "x × 2x² − x × 3x + x × 4 = 2x³ − 3x² + 4x"
        mistakes: {"2x³ − 3x + 4": multiply_every_term}
      - prompt: "(x + 2)(x² − x + 3) = ?"
        options: ["x³ + x² + x + 6", "x³ − x² + 3x + 6", "x³ + x² + 5x + 6", "x³ + 6"]
        answer: "x³ + x² + x + 6"
        check: "expand((x + 2)*(x**2 - x + 3))"
        difficulty: 2
        hints: ["x × (x² − x + 3), then 2 × (x² − x + 3).", "Collect like terms."]
        solution: "Step 1: x³ − x² + 3x. Step 2: 2x² − 2x + 6. Step 3: Adding: x³ + x² + x + 6."
        mistakes: {"x³ + 6": product_terms, "x³ − x² + 3x + 6": multiply_every_term}
      - prompt: "In (2x + 3)(x² − 4x + 1), what is the coefficient of x²?"
        answer: "-5"
        check: "Poly(expand((2*x + 3)*(x**2 - 4*x + 1)), x).coeff_monomial(x**2)"
        difficulty: 3
        hints: ["x² comes from 2x × (−4x) and 3 × x².", "−8x² + 3x²."]
        solution: "Step 1: 2x × (−4x) = −8x². Step 2: 3 × x² = 3x². Step 3: −8 + 3 = −5."
        mistakes: {"-8": multiply_every_term, "3": multiply_every_term}
      - prompt: "p(x) = x² + 1 and q(x) = x − 1. What is p(x) − x × q(x)?"
        options: ["x + 1", "2x² − x + 1", "1 − x", "x − 1"]
        answer: "x + 1"
        check: "expand((x**2 + 1) - x*(x - 1))"
        difficulty: 3
        hints: ["x × q(x) = x² − x.", "Subtracting flips its signs: −x² + x."]
        solution: "Step 1: x × q(x) = x² − x. Step 2: x² + 1 − x² + x. Step 3: = x + 1."
        mistakes: {"1 − x": minus_negative}
      - prompt: "(4x² − 3x + 2) − (x² + 2x − 5) = ?"
        options: ["3x² − 5x + 7", "3x² − x − 3", "3x² − 5x − 3", "5x² − x − 3"]
        answer: "3x² − 5x + 7"
        difficulty: 2
        hints: ["Subtracting the bracket changes every sign in it.", "4x² − x², −3x − 2x, 2 + 5."]
        solution: "Step 1: 4x² − x² = 3x². Step 2: −3x − 2x = −5x. Step 3: 2 − (−5) = 7."
        mistakes: {"3x² − x − 3": minus_negative, "3x² − 5x − 3": minus_negative}
      - prompt: "(x − 1)(x² + x + 1) = ?"
        options: ["x³ − 1", "x³ + 1", "x³ − 2x² − 1", "x³ + 2x² + 2x + 1"]
        answer: "x³ − 1"
        difficulty: 3
        hints: ["Multiply x by each term, then −1 by each term.", "Many terms cancel."]
        solution: "Step 1: x(x² + x + 1) = x³ + x² + x. Step 2: −1(x² + x + 1) = −x² − x − 1. Step 3: Adding: x³ − 1."
        mistakes: {"x³ + 1": sign_rule, "x³ + 2x² + 2x + 1": multiply_every_term}
      - prompt: "p(x) = 2x + 1 and q(x) = x² − 3. What is the coefficient of x in p(x) × q(x)?"
        answer: "-6"
        check: "2*(-3)"
        difficulty: 3
        hints: ["Which pairs of terms multiply to give an x term?", "Only 2x × (−3)."]
        solution: "Step 1: (2x + 1)(x² − 3) = 2x³ + x² − 6x − 3. Step 2: The coefficient of x is −6."
        mistakes: {"6": dropped_sign, "-3": multiply_every_term}
      - prompt: (2x² − x + 5) + (3x² + 4x − 2) = ?
        options:
        - 5x² + 3x + 3
        - 5x⁴ + 3x + 3
        - 5x² + 5x + 3
        - 6x² + 3x + 3
        answer: 5x² + 3x + 3
        check: expand((2*x**2 - x + 5) + (3*x**2 + 4*x - 2))
        difficulty: 1
        hints:
        - Add the x² terms, then the x terms, then the numbers.
        - −x + 4x = 3x.
        solution: 'Step 1: 2x² + 3x² = 5x². Step 2: −x + 4x = 3x. Step 3: 5 − 2 = 3, so 5x² + 3x + 3.'
        mistakes:
          5x⁴ + 3x + 3: added_powers
      - prompt: (6x + 1) − (4x − 3) = ?
        options:
        - 2x + 4
        - 2x − 2
        - 10x − 2
        - 2x − 4
        answer: 2x + 4
        check: expand((6*x + 1) - (4*x - 3))
        difficulty: 1
        hints:
        - Change the sign of every term in the second bracket.
        - 6x + 1 − 4x + 3.
        solution: 'Step 1: 6x + 1 − 4x + 3. Step 2: 6x − 4x = 2x. Step 3: 1 + 3 = 4, so 2x + 4.'
        mistakes:
          2x − 2: dropped_sign
      - prompt: 2x(x² − 4x + 1) = ?
        options:
        - 2x³ − 8x² + 2x
        - 2x³ − 4x + 1
        - 2x² − 8x + 2
        - 2x³ − 8x + 2x
        answer: 2x³ − 8x² + 2x
        check: expand(2*x*(x**2 - 4*x + 1))
        difficulty: 2
        hints:
        - Multiply every term by 2x.
        - 2x × x² = 2x³.
        solution: 'Step 1: 2x × x² = 2x³. Step 2: 2x × (−4x) = −8x². Step 3: 2x × 1 = 2x.'
        mistakes:
          2x³ − 4x + 1: multiply_every_term
      - prompt: (x − 3)(x² + 2x − 1) = ?
        options:
        - x³ − x² − 7x + 3
        - x³ − 3x² − 7x + 3
        - x³ − x² − 7x − 3
        - x³ + 2x − 3
        answer: x³ − x² − 7x + 3
        check: expand((x - 3)*(x**2 + 2*x - 1))
        difficulty: 2
        hints:
        - Multiply x by each term, then −3 by each term.
        - x³ + 2x² − x − 3x² − 6x + 3.
        solution: 'Step 1: x(x² + 2x − 1) = x³ + 2x² − x. Step 2: −3(x² + 2x − 1) = −3x² − 6x + 3. Step 3: Add: x³ − x² − 7x + 3.'
        mistakes:
          x³ − x² − 7x − 3: dropped_sign
          x³ + 2x − 3: multiply_every_term
      - prompt: In (x² + 3x − 2)(x + 5), what is the coefficient of x?
        answer: '13'
        check: 3*5 + (-2)*1
        difficulty: 3
        hints:
        - Find every pair of terms whose product is an x term.
        - 3x × 5 and −2 × x.
        solution: 'Step 1: 3x × 5 = 15x. Step 2: −2 × x = −2x. Step 3: 15x − 2x = 13x, so the coefficient is 13.'
        mistakes:
          '15': multiply_every_term
          '17': dropped_sign
      - prompt: p(x) = x² + x and q(x) = x² − x. What is p(x) − q(x)?
        options:
        - 2x
        - 2x²
        - '0'
        - −2x
        answer: 2x
        check: expand((x**2 + x) - (x**2 - x))
        difficulty: 3
        hints:
        - Subtracting changes every sign in q(x).
        - x² + x − x² + x.
        solution: 'Step 1: x² + x − x² + x. Step 2: x² − x² = 0. Step 3: x + x = 2x.'
        mistakes:
          '0': dropped_sign
