# Class 9 Mathematics, chapter 15. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_divide.
subject: math
chapter: 15
title: Statistics

tips:
  removed_value_mean: "Find the total first (mean × count). Take the removed number out of the total, then divide by how many numbers are left."
  needed_total: "Work with totals: the total needed for the new mean, minus the total already scored."
  misread_value: "Fix the total, not the mean: take out the wrong number, put in the right one, then divide again."
  median_unknown: "The two middle numbers of the ordered list average to the median. Write that as an equation."
  typical_value: "One very large value drags the total up. Which average does not use the size of every value?"
  mode_unknown: "Count how many times each value appears for each choice of x. The mode must be the only value that appears most."
  which_averages: "Work out all three averages before comparing them."
  numbers_only: "The mean and median need numbers you can add or put in order. Colours have neither."
  frequency_median: "Add the frequencies until you reach the middle positions. With an even total there are two middle positions."
  divided_wrong_count: "Divide by how many numbers there are, not by some other number."
  median_not_sorted: "Put the numbers in order first. The median is the middle of the ordered list."
  median_even_count: "With an even count there are two middle numbers. The median is halfway between them."
  mode_not_count: "The mode is the value that appears most often, not how many times it appears."
  mean_not_mode: "The mode is the most common value. You worked out the mean (the average) instead."
  mean_not_median: "Sort the numbers first and find the one in the middle (or halfway between the two middle ones). The total divided by the count is a different measure."
  frequency_not_used: "Multiply each value by its frequency before adding. Each value counts as many times as it occurs."
  divided_by_values: "Divide by the total frequency (how many people), not by how many different values there are."
  middle_of_list_unsorted: "Use the position in the ordered list, counting through the frequencies."
  frequency_equation: "Multiply each value by its frequency, add, and set it equal to the mean times the total frequency."
  missing_value_mean: "Total = mean × count = 60. Take away the three known numbers."
  mode_value: "The mode is the value that appears most, not how often it appears."
  two_modes: "When two values tie for the most, both are modes."

concepts:
  - code: math9.stats.mean
    title: Mean
    notes: |
      The mean (average) of a set of numbers is their sum divided by how many there are. It is the
      equal share if the total were split evenly. Adding a number above the mean raises it; changing
      the total by k changes the mean by k ÷ n.
    explanations:
      text: "Five students score 6, 8, 7, 9 and 10. Their total is 40, and there are 5 scores, so the mean is 40 ÷ 5 = 8. If everyone had scored the same, each would have 8."
      visual: "Picture five towers of blocks, heights 6, 8, 7, 9 and 10. Move blocks from the tall towers to the short ones until all are equal. Every tower ends up 8 blocks high."
      step_by_step: "Mean of 12, 15, 9, 14: Step 1: Add: 12 + 15 + 9 + 14 = 50. Step 2: Count: 4 numbers. Step 3: 50 ÷ 4 = 12.5."
      real_world: "A cricketer scores 45, 30, 72 and 53 in four matches: 200 runs. The batting average is 200 ÷ 4 = 50 runs a match."
    picture:
      kind: bars
      unit: blocks in each tower
      bars:
      - {label: A, value: 6}
      - {label: B, value: 8}
      - {label: C, value: 7}
      - {label: D, value: 9}
      - {label: E, value: 10}
      caption: '40 blocks in all, 5 towers: level them out and each has 40 ÷ 5 = 8. The mean is 8.'
      alt: Five towers of 6, 8, 7, 9 and 10 blocks. Together they have 40 blocks, so levelled out each would have 8, the mean.
    activity:
      type: formula
      prompt: Four test marks are 6, 8, 7 and 9. Choose the fifth.
      inputs:
      - name: x
        label: Fifth mark
        min: 0
        max: 10
        step: 1
        start: 0
      outputs:
      - name: m
        label: Mean
        expr: (30+x)/5
        places: 2
      goals:
      - prompt: Make the mean exactly 8.
        want:
          m: 8
        hint: The total must be 8 × 5 = 40.
        mistakes:
        - when:
            x: 8
          say: Adding 8 makes the total 38, and 38 ÷ 5 = 7.6, not 8. The other four average 7.5, so the new mark has to be above 8 to pull the mean up to 8.
    lesson:
      - teach: 'Four towers of blocks are 6, 8, 7 and 9 blocks high. If we share all the blocks out so every tower is the same height, how high is each? 6 + 8 + 7 + 9 = 30 blocks, shared by 4 towers: 7.5 each. That equal share is the mean, or average.'
        picture:
          kind: bars
          unit: blocks in each tower
          bars:
          - label: A
            value: 6
          - label: B
            value: 8
          - label: C
            value: 7
          - label: D
            value: 9
          alt: Four towers of 6, 8, 7 and 9 blocks. Levelled out, each would be 7.5 blocks high.
        check:
          prompt: What is the mean of 4, 6 and 8?
          options:
          - '6'
          - '18'
          - '9'
          answer: '6'
          why: '4 + 6 + 8 = 18, shared by 3 numbers: 18 ÷ 3 = 6.'
      - teach: 'Mean = sum of the values ÷ how many values there are. Divide by the count of values, not by the biggest value or by 2. For 45, 30, 72 and 53: the sum is 200 and there are 4 scores, so the mean is 50.'
        check:
          prompt: What is the mean of 10, 20, 30, 40 and 50?
          options:
          - '30'
          - '75'
          - '50'
          answer: '30'
          why: 'The sum is 150, and there are 5 numbers: 150 ÷ 5 = 30.'
      - teach: Mean × count = total, which lets you work backwards. If 4 numbers have mean 15, their total is 60. If three of them are 10, 12 and 20 (total 42), the fourth is 60 − 42 = 18.
        check:
          prompt: The mean of 3 numbers is 10. What is their total?
          options:
          - '30'
          - '13'
          - '10'
          answer: '30'
          why: Total = mean × count = 10 × 3 = 30.
    items:
      - prompt: "What is the mean of 6, 8, 7, 9 and 10?"
        answer: "8"
        check: "(6 + 8 + 7 + 9 + 10)/5"
        difficulty: 1
        hints: ["Add them, then divide by 5."]
        solution: "Step 1: 6 + 8 + 7 + 9 + 10 = 40. Step 2: 40 ÷ 5 = 8."
        mistakes: {"40": forgot_divide, "10": divided_wrong_count}
      - prompt: "What is the mean of 12, 15, 9 and 14?"
        answer: "12.5"
        check: "Rational(12 + 15 + 9 + 14, 4)"
        difficulty: 1
        hints: ["The total is 50."]
        solution: "Step 1: Total 50. Step 2: 50 ÷ 4 = 12.5."
        mistakes: {"50": forgot_divide, "10": divided_wrong_count}
      - prompt: "A cricketer scores 45, 30, 72 and 53 runs in four matches. What is the mean score?"
        answer: "50"
        check: "(45 + 30 + 72 + 53)/4"
        difficulty: 2
        hints: ["Total runs ÷ number of matches."]
        solution: "Step 1: 45 + 30 + 72 + 53 = 200. Step 2: 200 ÷ 4 = 50."
        mistakes: {"200": forgot_divide}
      - prompt: "The mean of 4 numbers is 15. Three of them are 10, 12 and 20. What is the fourth number?"
        answer: "18"
        check: "4*15 - (10 + 12 + 20)"
        difficulty: 2
        hints: ["The total of all 4 is 4 × 15 = 60."]
        solution: "Step 1: Total = 60. Step 2: 10 + 12 + 20 = 42. Step 3: 60 − 42 = 18."
        mistakes: {"42": "missing_value_mean", "14": "missing_value_mean"}
      - prompt: "The mean mark of 10 students is 32. A new student scoring 54 joins. What is the new mean?"
        answer: "34"
        check: "(10*32 + 54)/11"
        difficulty: 3
        hints: ["Old total: 10 × 32 = 320.", "Now there are 11 students."]
        solution: "Step 1: Old total 320. Step 2: New total 374. Step 3: 374 ÷ 11 = 34."
        mistakes: {"43": divided_wrong_count, "187/5": divided_wrong_count}
      - prompt: "Every number in a list is increased by 3. What happens to the mean?"
        options: ["It goes up by 3", "It stays the same", "It is multiplied by 3", "It goes up by 3 times the count"]
        answer: "It goes up by 3"
        difficulty: 3
        hints: ["Try it with 1, 2, 3 (mean 2) and 4, 5, 6."]
        solution: "The total goes up by 3n and is divided by n, so the mean goes up by 3. Check: 1, 2, 3 has mean 2; 4, 5, 6 has mean 5."
        mistakes: {"It goes up by 3 times the count": forgot_divide}
      - prompt: "The mean of 5 numbers is 20. One of them, 30, is removed. What is the mean of the other four?"
        answer: "17.5"
        check: "(5*20-30)/4"
        difficulty: 3
        hints: ["The total of the 5 numbers is 5 × 20.", "Take away 30, then divide by 4."]
        solution: "Step 1: Total = 100. Step 2: Without 30, total = 70. Step 3: Mean = 70 ÷ 4 = 17.5."
        mistakes: {"14": removed_value_mean, "-10": removed_value_mean}
      - prompt: "A student's mean mark over 4 tests is 65. What must they score in the 5th test to make the mean 68?"
        answer: "80"
        check: "5*68 - 4*65"
        difficulty: 3
        hints: ["Total so far = 4 × 65.", "Total needed = 5 × 68."]
        solution: "Step 1: Total so far = 260. Step 2: Total needed = 340. Step 3: The 5th test must be 340 − 260 = 80."
        mistakes: {"71": needed_total, "68": needed_total, "3": needed_total}
      - prompt: "The mean of 20 numbers was found to be 15. Later it was found that 35 had been copied as 53. What is the correct mean?"
        answer: "14.1"
        check: "(20*15 - 53 + 35)/20"
        difficulty: 3
        hints: ["The wrong total was 20 × 15 = 300.", "The total was 18 too big."]
        solution: "Step 1: Wrong total = 300. Step 2: Correct total = 300 − 53 + 35 = 282. Step 3: Mean = 282 ÷ 20 = 14.1."
        mistakes: {"15.9": misread_value, "-3": misread_value}
      - prompt: What is the mean of 3, 5, 7, 9 and 11?
        answer: '7'
        check: (3 + 5 + 7 + 9 + 11)/5
        difficulty: 1
        hints:
        - Add them all up.
        - Divide the total by how many numbers there are.
        solution: 'Step 1: 3 + 5 + 7 + 9 + 11 = 35. Step 2: There are 5 numbers. Step 3: 35 ÷ 5 = 7.'
        mistakes:
          '35': divided_wrong_count
          '17.5': divided_wrong_count
      - prompt: 'Rain fell on 4 days: 12 mm, 8 mm, 0 mm and 20 mm. What was the mean rainfall per day, in mm?'
        answer: '10'
        check: (12 + 8 + 0 + 20)/4
        difficulty: 1
        hints:
        - The 0 mm day still counts as a day.
        - 40 ÷ 4.
        solution: 'Step 1: 12 + 8 + 0 + 20 = 40. Step 2: There are 4 days. Step 3: 40 ÷ 4 = 10 mm.'
        mistakes:
          '13.333': divided_wrong_count
      - prompt: The mean of 5 numbers is 12. Four of them are 10, 15, 8 and 14. What is the fifth?
        answer: '13'
        check: 5*12 - (10 + 15 + 8 + 14)
        difficulty: 2
        hints:
        - Total = mean × count = 60.
        - The four known numbers add to 47.
        solution: 'Step 1: Total = 5 × 12 = 60. Step 2: 10 + 15 + 8 + 14 = 47. Step 3: Fifth = 60 − 47 = 13.'
        mistakes:
          '12': missing_value_mean
      - prompt: Every mark in a test is doubled. The old mean was 14. What is the new mean?
        answer: '28'
        check: 14*2
        difficulty: 2
        hints:
        - If every value doubles, so does the total.
        - The count stays the same.
        solution: 'Step 1: The total doubles. Step 2: The number of marks is the same. Step 3: So the mean doubles: 28.'
        mistakes:
          '16': removed_value_mean
      - prompt: The mean age of 6 children is 10. When their teacher joins, the mean age becomes 14. How old is the teacher?
        answer: '38'
        check: 7*14 - 6*10
        difficulty: 3
        hints:
        - Total of 6 children = 60.
        - Total of all 7 = 7 × 14 = 98.
        solution: 'Step 1: Children''s total = 60. Step 2: New total = 98. Step 3: Teacher = 98 − 60 = 38.'
        mistakes:
          '14': needed_total
          '24': needed_total
      - prompt: A batter's mean over 8 innings is 40. What must she score in the 9th innings to raise the mean to 42?
        answer: '58'
        check: 9*42 - 8*40
        difficulty: 3
        hints:
        - Total needed after 9 innings = 9 × 42.
        - Total so far = 8 × 40.
        solution: 'Step 1: Needed total = 378. Step 2: So far = 320. Step 3: She needs 378 − 320 = 58.'
        mistakes:
          '42': needed_total
          '44': needed_total

  - code: math9.stats.median
    title: Median
    after: [math9.stats.mean]
    notes: |
      The median is the middle value when the data are arranged in order. With n values (n odd) it is
      the ((n + 1)/2)th value; with n even it is the mean of the two middle values. Unlike the mean, it
      is not pulled far by one very large or very small value.
    explanations:
      text: "Heights 150, 142, 160, 155, 148 cm. In order: 142, 148, 150, 155, 160. The middle one, 150, is the median: half the students are shorter and half taller."
      visual: "Line the students up from shortest to tallest. The one standing exactly in the middle of the line has the median height."
      step_by_step: "Median of 7, 3, 9, 4, 12, 10: Step 1: Order: 3, 4, 7, 9, 10, 12. Step 2: Six numbers, so the middle two are 7 and 9. Step 3: Median = (7 + 9) ÷ 2 = 8."
      real_world: "Monthly wages in a small shop: ₹9,000, ₹10,000, ₹11,000, ₹12,000 and the owner's ₹1,00,000. The mean is ₹28,400, which no worker earns; the median, ₹11,000, describes a typical wage better."
    activity:
      type: number_line
      min: 0
      max: 16
      step: 1
      start: 0
      prompt: 'Five marks: 12, 3, 15, 7, 8. The median is the middle mark once they are in order.'
      goals:
      - prompt: Put the marker on the median.
        target: 8
        mistakes:
        - when:
            v: 15
          say: 15 is the middle of the list as written (12, 3, 15, 7, 8). The median is the middle after putting them in order.
        - when:
            v: 9
          say: '9 is the mean: 45 ÷ 5. The median is a different thing: the middle mark in order.'
      - prompt: A sixth mark, 10, is added. With two middle marks, the median is halfway between them.
        target: 9
        mistakes:
        - when:
            v: 8
          say: 8 was the middle before. With six marks there are two middle ones.
        - when:
            v: 10
          say: 10 is one of the two middle marks. The median is halfway between both of them.
    lesson:
      - teach: 'The median is the middle value when the data are put in order. For 150, 142, 160, 155, 148, first sort them: 142, 148, 150, 155, 160. The middle one is 150. Always sort first: the middle of an unsorted list means nothing.'
        check:
          prompt: What is the median of 9, 2, 7?
          options:
          - '7'
          - '2'
          - '6'
          answer: '7'
          why: 'In order: 2, 7, 9. The middle value is 7.'
      - teach: 'With an even number of values there are two middle ones, so take their mean. 3, 4, 7, 9, 10, 12 in order: the middle two are 7 and 9, so the median is 8.'
        check:
          prompt: What is the median of 2, 5, 6, 11?
          options:
          - '5.5'
          - '5'
          - '6'
          answer: '5.5'
          why: The middle two are 5 and 6, and their mean is 5.5.
      - teach: The median is not pulled far by one extreme value. Wages ₹9,000, ₹10,000, ₹11,000, ₹12,000 and ₹1,00,000 have median ₹11,000 but mean ₹28,400. So the median often describes a typical value better.
        check:
          prompt: Five houses cost ₹20 lakh, ₹22 lakh, ₹25 lakh, ₹27 lakh and ₹3 crore. Which average shows a typical house better?
          options:
          - The median
          - The mean
          answer: The median
          why: The ₹3 crore house pulls the mean far up, but the median (₹25 lakh) stays typical.
    items:
      - prompt: "What is the median of 150, 142, 160, 155 and 148?"
        answer: "150"
        check: "sorted([150, 142, 160, 155, 148])[2]"
        difficulty: 1
        hints: ["Put them in order first."]
        solution: "Step 1: 142, 148, 150, 155, 160. Step 2: The middle (3rd) is 150."
        mistakes: {"160": median_not_sorted, "151": mean_not_median}
      - prompt: "What is the median of 3, 5, 8, 10, 13, 15 and 20?"
        answer: "10"
        check: "sorted([3, 5, 8, 10, 13, 15, 20])[3]"
        difficulty: 1
        hints: ["7 numbers: the 4th is the middle."]
        solution: "Already in order; the 4th value is 10."
        mistakes: {"74/7": mean_not_median}
      - prompt: "What is the median of 7, 3, 9, 4, 12 and 10?"
        answer: "8"
        check: "(sorted([7, 3, 9, 4, 12, 10])[2] + sorted([7, 3, 9, 4, 12, 10])[3])/2"
        difficulty: 2
        hints: ["Order them: 3, 4, 7, 9, 10, 12.", "Two numbers are in the middle."]
        solution: "Step 1: 3, 4, 7, 9, 10, 12. Step 2: Middle two: 7 and 9. Step 3: (7 + 9) ÷ 2 = 8."
        mistakes: {"13/2": median_not_sorted, "7": median_even_count, "15/2": mean_not_median}
      - prompt: "Five wages are ₹9,000, ₹10,000, ₹11,000, ₹12,000 and ₹1,00,000. What is the median wage in rupees?"
        answer: "11000"
        check: "sorted([9000, 10000, 11000, 12000, 100000])[2]"
        difficulty: 2
        hints: ["The middle of five ordered values is the 3rd."]
        solution: "In order, the 3rd wage is ₹11,000."
        mistakes: {"28400": mean_not_median}
      - prompt: "Which changes the most if the largest number in a list is made much larger?"
        options: ["The mean", "The median", "Both change by the same amount", "Neither changes"]
        answer: "The mean"
        difficulty: 2
        hints: ["Does the middle value move when the biggest value grows?"]
        solution: "The total grows, so the mean rises. The middle value stays where it is, so the median does not change."
        mistakes: {"The median": mean_not_median}
      - prompt: "The numbers 4, 6, x, 11, 15 are in order and their median equals their mean. What is x?"
        answer: "9"
        check: "solve(Eq(x, (4 + 6 + x + 11 + 15)/5), x)[0]"
        difficulty: 3
        hints: ["The median is x.", "So x = (36 + x) ÷ 5."]
        solution: "Step 1: Median = x. Step 2: x = (36 + x) ÷ 5. Step 3: 5x = 36 + x, so 4x = 36 and x = 9."
        mistakes: {"36/5": forgot_divide}
      - prompt: "The numbers 3, 5, 7, x, x + 2, 12, 14, 15 are in order, and their median is 9. What is x?"
        answer: "8"
        check: "(2*9 - 2)/2"
        difficulty: 3
        hints: ["8 numbers: the median is halfway between the 4th and 5th.", "(x + x + 2) ÷ 2 = 9."]
        solution: "Step 1: (x + x + 2) ÷ 2 = 9. Step 2: 2x + 2 = 18, so x = 8."
        mistakes: {"9": median_unknown, "7": median_unknown}
      - prompt: "Six students have heights 140, 152, 147, 160, 138 and 155 cm. A new student 150 cm tall joins. What is the median height now, in cm?"
        answer: "150"
        check: "150"
        difficulty: 2
        hints: ["There are now 7 heights.", "Put them in order and take the 4th."]
        solution: "Step 1: In order: 138, 140, 147, 150, 152, 155, 160. Step 2: The 4th is 150 cm."
        mistakes: {"160": median_not_sorted, "149.5": median_not_sorted, "148.857": mean_not_median}
      - prompt: "In a small company, nine workers earn ₹15,000 to ₹20,000 a month and the owner earns ₹8,00,000. Which average best describes a typical worker's pay?"
        options: ["The median", "The mean", "The total pay", "The highest pay"]
        answer: "The median"
        difficulty: 2
        hints: ["Which average is pulled up by the owner's huge pay?", "The middle value ignores how big the largest one is."]
        solution: "Step 1: The owner's pay drags the mean far above what most people earn. Step 2: The median is the middle pay, so it stays typical."
        mistakes: {"The mean": typical_value, "The total pay": typical_value, "The highest pay": typical_value}
      - prompt: What is the median of 21, 17, 25, 19 and 30?
        answer: '21'
        check: '21'
        difficulty: 1
        hints:
        - Put them in order first.
        - 17, 19, 21, 25, 30.
        solution: 'Step 1: In order: 17, 19, 21, 25, 30. Step 2: There are 5 values. Step 3: The middle (3rd) is 21.'
        mistakes:
          '25': median_not_sorted
      - prompt: What is the median of 4, 8, 15, 16, 23 and 42?
        answer: '15.5'
        check: (15 + 16)/2
        difficulty: 1
        hints:
        - There are 6 values, so two are in the middle.
        - The middle two are 15 and 16.
        solution: 'Step 1: The list is already in order. Step 2: The middle two are 15 and 16. Step 3: Median = (15 + 16) ÷ 2 = 15.5.'
        mistakes:
          '15': median_even_count
          '18': mean_not_median
      - prompt: What is the median of 12, 3, 8, 5, 10, 7, 1?
        answer: '7'
        check: '7'
        difficulty: 2
        hints:
        - Sort them first.
        - 1, 3, 5, 7, 8, 10, 12.
        solution: 'Step 1: In order: 1, 3, 5, 7, 8, 10, 12. Step 2: 7 values, so the 4th is the middle. Step 3: Median = 7.'
        mistakes:
          '5': middle_of_list_unsorted
      - prompt: 'Marks of 8 students: 35, 40, 42, 45, 48, 50, 52, 90. What is the median mark?'
        answer: '46.5'
        check: (45 + 48)/2
        difficulty: 2
        hints:
        - '8 values: the 4th and 5th are the middle.'
        - 45 and 48.
        solution: 'Step 1: Already in order. Step 2: The 4th and 5th values are 45 and 48. Step 3: Median = (45 + 48) ÷ 2 = 46.5.'
        mistakes:
          '50.25': mean_not_median
      - prompt: The numbers 2, 5, x, 9, 12 are in order and their median is 7. What is their mean?
        answer: '7'
        check: (2 + 5 + 7 + 9 + 12)/5
        difficulty: 3
        hints:
        - The median is the middle value, x.
        - So x = 7. Now find the mean.
        solution: 'Step 1: The middle value x = 7. Step 2: Sum = 2 + 5 + 7 + 9 + 12 = 35. Step 3: Mean = 35 ÷ 5 = 7.'
        mistakes:
          '5.6': median_unknown
      - prompt: Seven runners finish in 12, 13, 13, 14, 15, 16 and 40 minutes. The slowest runner is removed. What is the median of the other six, in minutes?
        answer: '13.5'
        check: (13 + 14)/2
        difficulty: 3
        hints:
        - 'Six values remain: 12, 13, 13, 14, 15, 16.'
        - The middle two are 13 and 14.
        solution: 'Step 1: 12, 13, 13, 14, 15, 16. Step 2: The middle two are 13 and 14. Step 3: Median = 13.5 minutes.'
        mistakes:
          '14': median_even_count

  - code: math9.stats.mode
    title: Mode
    after: [math9.stats.mean]
    notes: |
      The mode is the value that occurs most often. A list may have more than one mode, or none if
      every value appears once. The mode is the only average that works for non-numbers, like the
      most popular colour or shoe size sold most.
    explanations:
      text: "Shoe sizes sold today: 6, 7, 7, 8, 7, 9, 6, 7. Size 7 was sold 4 times, more than any other, so the mode is 7. The shopkeeper should keep more size 7 in stock."
      visual: "Draw a bar for each size: the tallest bar shows the mode."
      step_by_step: "Mode of 3, 5, 3, 8, 5, 3, 9: Step 1: Count: 3 appears 3 times, 5 twice, 8 once, 9 once. Step 2: The mode is 3."
      real_world: "A canteen counts which snack is bought most: 25 samosas, 40 vadas, 18 puffs. The mode is vada, so they make the most of those."
    picture:
      kind: bars
      unit: pairs of shoes sold
      bars:
      - {label: Size 5, value: 4}
      - {label: Size 6, value: 9}
      - {label: Size 7, value: 6}
      - {label: Size 8, value: 2}
      caption: The tallest bar is size 6, so the mode is size 6.
      alt: 'Shoe sales by size: size 5 sold 4, size 6 sold 9, size 7 sold 6, size 8 sold 2. The tallest bar, size 6, is the mode.'
    activity:
      type: bars
      show: tally
      max: 10
      prompt: 'Shoe sizes in a class. Build the bar graph: the tallest bar is the mode.'
      categories:
      - label: Size 5
        value: 3
      - label: Size 6
        value: 8
      - label: Size 7
        value: 5
      - label: Size 8
        value: 2
    lesson:
      - teach: The mode is the value that appears most often. In 6, 7, 7, 8, 7, 9, 6, 7, the number 7 appears four times, more than any other, so the mode is 7. The mode is a value from the list, not how many times it appears.
        check:
          prompt: What is the mode of 2, 3, 3, 5, 3, 2?
          options:
          - '3'
          - '2'
          - Three times
          answer: '3'
          why: 3 appears three times, more than any other value. The mode is the value 3, not the count.
      - teach: A list can have two modes (2, 4, 4, 7, 7 has modes 4 and 7) or no mode at all if every value appears once (1, 2, 3, 4).
        check:
          prompt: How many modes does 5, 5, 6, 8, 8, 9 have?
          options:
          - 'Two: 5 and 8'
          - 'One: 8'
          - None
          answer: 'Two: 5 and 8'
          why: 5 and 8 each appear twice, more than 6 or 9.
      - teach: 'The mode is the only average that works for things that aren''t numbers: the most popular snack, the shirt size sold most, the commonest colour. A shop owner orders more of the mode.'
        check:
          prompt: 'Votes for a class trip: beach 12, hills 15, zoo 9. Which average makes sense here?'
          options:
          - 'The mode: hills'
          - The mean
          - The median
          answer: 'The mode: hills'
          why: Places are not numbers, so they can't be added or ordered. The most popular choice is the mode.
    items:
      - prompt: "What is the mode of 6, 7, 7, 8, 7, 9, 6, 7?"
        answer: "7"
        check: "7"
        difficulty: 1
        hints: ["Which number appears most often?"]
        solution: "7 appears 4 times, more than any other value."
        mistakes: {"4": mode_not_count, "57/8": mean_not_mode}
      - prompt: "What is the mode of 3, 5, 3, 8, 5, 3, 9?"
        answer: "3"
        check: "3"
        difficulty: 1
        hints: ["Count each value."]
        solution: "3 appears three times; 5 twice; 8 and 9 once."
        mistakes: {"5": "mode_value", "3.5": "mode_value"}
      - prompt: "A canteen sold 25 samosas, 40 vadas and 18 puffs. Which snack is the mode?"
        options: ["Vada", "Samosa", "Puff", "There is no mode"]
        answer: "Vada"
        difficulty: 1
        hints: ["Which was bought most often?"]
        solution: "40 vadas is the most, so vada is the mode."
        mistakes: {"Samosa": "mode_value", "There is no mode": "mode_value"}
      - prompt: "In the list 2, 4, 4, 5, 7, 7, 9 which statement is true?"
        options: ["4 and 7 are both modes", "4 is the only mode", "7 is the only mode", "There is no mode"]
        answer: "4 and 7 are both modes"
        difficulty: 2
        hints: ["Count how often 4 and 7 each appear."]
        solution: "4 and 7 each appear twice and nothing appears more, so both are modes."
        mistakes: {"4 is the only mode": "two_modes", "7 is the only mode": "two_modes", "There is no mode": "two_modes"}
      - prompt: "The list 5, 8, 10, 10, 12, 8 has one more number added, and then 8 is the only mode. What is the added number?"
        answer: "8"
        check: "8"
        difficulty: 2
        hints: ["Right now 8 and 10 each appear twice."]
        solution: "8 and 10 both appear twice. Adding another 8 makes 8 appear three times, so 8 is the only mode."
        mistakes: {"10": "two_modes", "5": "two_modes"}
      - prompt: "Marks of 7 students are 12, 14, 19, 14, 20, 18, 17. What is the median minus the mode?"
        answer: "3"
        check: "sorted([12, 14, 19, 14, 20, 18, 17])[3] - 14"
        difficulty: 3
        hints: ["Order: 12, 14, 14, 17, 18, 19, 20."]
        solution: "Step 1: Mode = 14 (it appears twice). Step 2: Median = 4th value = 17. Step 3: 17 − 14 = 3."
        mistakes: {"-3": sign_slip}
      - prompt: "The list 4, x, 6, 7, 6, 4, x has 4 as its only mode. What is x?"
        options: ["4", "6", "5", "7"]
        answer: "4"
        difficulty: 3
        hints: ["x appears twice in the list.", "Try each choice and count how often each value appears."]
        solution: "Step 1: Without x, 4 and 6 each appear twice. Step 2: If x = 4, then 4 appears four times and is the only mode. Any other x leaves a tie or makes another value the mode."
        mistakes: {"5": mode_unknown, "6": mode_unknown, "7": mode_unknown}
      - prompt: "Ages: 12, 13, 13, 14, 14, 14, 15. Which two averages are equal?"
        options: ["Median and mode", "Mean and median", "Mean and mode", "All three"]
        answer: "Median and mode"
        difficulty: 3
        hints: ["Mean = total ÷ 7.", "Find the 4th value and the most common value."]
        solution: "Step 1: Mean = 95 ÷ 7 ≈ 13.6. Step 2: Median = 4th value = 14. Step 3: Mode = 14. So the median and mode are equal."
        mistakes: {"All three": which_averages, "Mean and median": which_averages, "Mean and mode": which_averages}
      - prompt: "The colours of 20 cars in a car park are: white 7, black 5, red 4, grey 4. Which average can describe this data?"
        options: ["Only the mode", "The mean", "The median", "All three"]
        answer: "Only the mode"
        difficulty: 2
        hints: ["Can you add colours?", "Can you put colours in order of size?"]
        solution: "Step 1: Colours cannot be added or ordered, so there is no mean or median. Step 2: The most common colour is the mode."
        mistakes: {"The mean": numbers_only, "The median": numbers_only, "All three": numbers_only}
      - prompt: What is the mode of 4, 9, 4, 6, 9, 4, 2?
        answer: '4'
        check: '4'
        difficulty: 1
        hints:
        - Count how many times each value appears.
        - 4 appears three times.
        solution: 'Step 1: 4 appears 3 times, 9 twice, 6 and 2 once. Step 2: 4 appears most. Step 3: Mode = 4.'
        mistakes:
          '3': mode_not_count
          '9': mode_value
      - prompt: 'Shoe sizes sold today: 6, 7, 8, 7, 9, 7, 8, 6, 7. Which size is the mode?'
        answer: '7'
        check: '7'
        difficulty: 1
        hints:
        - Which size appears most often?
        - Count the 7s.
        solution: 'Step 1: Size 7 appears 4 times. Step 2: No other size appears as often. Step 3: Mode = 7.'
        mistakes:
          '4': mode_not_count
          '8': mode_value
      - prompt: Which statement is true about 1, 3, 5, 7, 9?
        options:
        - It has no mode
        - Its mode is 5
        - Its mode is 1
        - Its mode is 9
        answer: It has no mode
        difficulty: 2
        hints:
        - How many times does each value appear?
        - Every value appears just once.
        solution: 'Step 1: Each number appears once. Step 2: None appears more than the others. Step 3: So there is no mode.'
        mistakes:
          Its mode is 5: mean_not_mode
      - prompt: The list 3, 6, 6, 8, 8, 10 gets one more number, and then 6 is the only mode. What number was added?
        answer: '6'
        check: '6'
        difficulty: 2
        hints:
        - Right now 6 and 8 tie as modes.
        - Which value must get one more?
        solution: 'Step 1: 6 and 8 each appear twice. Step 2: Adding another 6 makes it appear 3 times. Step 3: So the added number is 6.'
        mistakes:
          '8': two_modes
      - prompt: 'Marks: 15, 18, 12, 18, 20, 16, 18, 13. What is the mode minus the median?'
        answer: '1'
        check: 18 - (16 + 18)/2
        difficulty: 3
        hints:
        - 'Mode first: which mark appears most?'
        - 'In order: 12, 13, 15, 16, 18, 18, 18, 20; median is between the 4th and 5th.'
        solution: 'Step 1: Mode = 18. Step 2: Median = (16 + 18) ÷ 2 = 17. Step 3: 18 − 17 = 1.'
        mistakes:
          '2': median_even_count
          '-1': which_averages
      - prompt: 'Ages: 10, 11, 11, 12, 12, 12, 13. Which is true?'
        options:
        - Median and mode are both 12
        - Mean and mode are both 12
        - All three averages are 12
        - Mean and median are both 11
        answer: Median and mode are both 12
        difficulty: 3
        hints:
        - Work out each average.
        - Mean = 81 ÷ 7 ≈ 11.6.
        solution: 'Step 1: Mode = 12 (three times). Step 2: Median = 4th value = 12. Step 3: Mean = 81 ÷ 7 ≈ 11.6, so only median and mode are 12.'
        mistakes:
          All three averages are 12: which_averages
          Mean and mode are both 12: mean_not_mode

  - code: math9.stats.frequency
    title: Averages from a frequency table
    after: [math9.stats.median, math9.stats.mode]
    notes: |
      In a frequency table each value x comes with a frequency f, the number of times it occurs.
      Mean = Σfx ÷ Σf. The mode is the value with the largest frequency. For the median, add up the
      frequencies (cumulative frequency) until you pass the middle position.
    explanations:
      text: "Goals scored by a team in 10 matches: 0 goals in 2 matches, 1 goal in 5, 2 goals in 3. Total goals = 0×2 + 1×5 + 2×3 = 11, over 2 + 5 + 3 = 10 matches, so the mean is 1.1 goals a match. The mode is 1 goal, which happened in 5 matches."
      visual: "Write the table as a long list: 0, 0, 1, 1, 1, 1, 1, 2, 2, 2. A frequency table is just a short way of writing that list."
      step_by_step: "Marks 5, 6, 7 with frequencies 4, 10, 6. Step 1: Σfx = 20 + 60 + 42 = 122. Step 2: Σf = 20. Step 3: Mean = 122 ÷ 20 = 6.1."
      real_world: "A shop records shirt sizes sold: 38 (12 shirts), 40 (20), 42 (8). The mode, 40, tells the owner what to reorder; the mean size helps with stitching estimates."
    activity:
      type: formula
      prompt: 2 children read 2 books each, and some children read 4 books each.
      inputs:
      - name: f
        label: Children who read 4 books
        min: 0
        max: 12
        step: 1
        start: 0
      outputs:
      - name: n
        label: Children
        expr: 2+f
      - name: m
        label: Mean books
        expr: (4+4*f)/(2+f)
        places: 2
      goals:
      - prompt: Make the mean 3.5 books.
        want:
          m: 3.5
        hint: Mean = (2 × 2 + 4f) ÷ (2 + f).
    lesson:
      - teach: 'When values repeat a lot, we use a frequency table: each value with how many times it occurs. Goals in 10 matches: 0 goals in 2 matches, 1 goal in 5, 2 goals in 3. The frequencies 2 + 5 + 3 = 10 add up to the number of matches.'
        check:
          prompt: Marks 4, 5, 6 were scored by 3, 8 and 4 students. How many students are there?
          options:
          - '15'
          - '3'
          - 15 marks
          answer: '15'
          why: 'Add the frequencies: 3 + 8 + 4 = 15 students.'
      - teach: 'Mean from a table: multiply each value by its frequency, add these up, then divide by the total frequency. Goals: 0 × 2 + 1 × 5 + 2 × 3 = 11 goals in 10 matches, so the mean is 1.1. Dividing by the number of different values (3) is a common slip.'
        picture:
          kind: flow
          steps:
          - 0 × 2 = 0
          - 1 × 5 = 5
          - 2 × 3 = 6
          - Total 11 goals ÷ 10 matches = 1.1
          alt: 'Mean from a frequency table: multiply each value by its frequency, add, and divide by the total frequency.'
        check:
          prompt: Values 1 and 2 have frequencies 3 and 1. What is the mean?
          options:
          - '1.25'
          - '1.5'
          - '2.5'
          answer: '1.25'
          why: '1 × 3 + 2 × 1 = 5, and 3 + 1 = 4 values: 5 ÷ 4 = 1.25.'
      - teach: 'The mode is the value with the biggest frequency. For the median, add up frequencies in order until you reach the middle position. 20 families: the middle is between the 10th and 11th. If sizes 2, 3, 4 have 3, 5, 8 families, the running totals are 3, 8, 16, so the 10th and 11th families have size 4.'
        check:
          prompt: Sizes 38, 40, 42 sold 12, 20 and 8 shirts. What is the mode?
          options:
          - '40'
          - '20'
          - '42'
          answer: '40'
          why: Size 40 has the largest frequency, 20. The mode is the size, not the frequency.
    items:
      - prompt: "Goals in 10 matches: 0 goals in 2 matches, 1 goal in 5 matches, 2 goals in 3 matches. What is the mean number of goals per match?"
        answer: "1.1"
        check: "Rational(0*2 + 1*5 + 2*3, 2 + 5 + 3)"
        difficulty: 1
        hints: ["Total goals = 0×2 + 1×5 + 2×3.", "Divide by the 10 matches."]
        solution: "Step 1: Total goals = 0 + 5 + 6 = 11. Step 2: 11 ÷ 10 = 1.1."
        mistakes: {"1": mean_not_mode, "11/3": divided_by_values, "10/3": frequency_not_used}
      - prompt: "Shirt sizes sold: size 38 (12 shirts), size 40 (20 shirts), size 42 (8 shirts). What is the mode?"
        answer: "40"
        check: "40"
        difficulty: 1
        hints: ["Which size has the largest frequency?"]
        solution: "Size 40 sold 20 times, the most."
        mistakes: {"20": mode_not_count}
      - prompt: "Marks 5, 6 and 7 were scored by 4, 10 and 6 students. What is the mean mark?"
        answer: "6.1"
        check: "Rational(5*4 + 6*10 + 7*6, 4 + 10 + 6)"
        difficulty: 2
        hints: ["Σfx = 5×4 + 6×10 + 7×6.", "Σf = 20."]
        solution: "Step 1: Σfx = 20 + 60 + 42 = 122. Step 2: Σf = 20. Step 3: 122 ÷ 20 = 6.1."
        mistakes: {"6": mean_not_mode, "122/3": divided_by_values, "18": frequency_not_used}
      - prompt: "Family sizes in a street: 2 people (3 families), 3 people (5 families), 4 people (8 families), 5 people (4 families). How many people live in the street altogether?"
        answer: "73"
        check: "2*3 + 3*5 + 4*8 + 5*4"
        difficulty: 2
        hints: ["Multiply each size by its number of families."]
        solution: "6 + 15 + 32 + 20 = 73 people."
        mistakes: {"14": frequency_not_used, "20": frequency_not_used}
      - prompt: "Using the same street (sizes 2, 3, 4, 5 with 3, 5, 8, 4 families), what is the median family size?"
        answer: "4"
        check: "4"
        difficulty: 3
        hints: ["20 families, so the median is between the 10th and 11th.", "Cumulative: 3, 8, 16, 20."]
        solution: "Step 1: 20 families. Step 2: Cumulative frequencies 3, 8, 16, 20. Step 3: The 10th and 11th families both have 4 people, so the median is 4."
        mistakes: {"7/2": middle_of_list_unsorted, "73/20": mean_not_median}
      - prompt: "Values 1, 3 and 5 have frequencies 4, k and 6. The mean is 3.2. What is k?"
        answer: "10"
        check: "solve(Eq(1*4 + 3*k + 5*6, Rational(16, 5)*(4 + k + 6)), k)[0]"
        difficulty: 3
        hints: ["Σfx = 4 + 3k + 30 = 34 + 3k.", "Σfx = 3.2 × Σf = 3.2(10 + k)."]
        solution: "Step 1: 34 + 3k = 3.2(10 + k) = 32 + 3.2k. Step 2: 2 = 0.2k. Step 3: k = 10."
        mistakes: {"5": "frequency_equation", "3": "frequency_equation"}
      - prompt: "Marks 2, 4, 6 and 8 were scored by 3, 7, 6 and 4 students. What is the median mark?"
        answer: "5"
        check: "(4+6)/2"
        difficulty: 3
        hints: ["20 students: the median is halfway between the 10th and 11th.", "Running totals: 3, 10, 16, 20."]
        solution: "Step 1: 20 students, so the 10th and 11th marks are in the middle. Step 2: Running totals 3, 10, 16, 20: the 10th mark is 4, the 11th is 6. Step 3: Median = 5."
        mistakes: {"4": frequency_median, "6": frequency_median, "5.1": mean_not_median}
      - prompt: "Marks 2, 4, 6 and 8 were scored by 3, 7, 6 and 4 students. What is the mean mark?"
        answer: "5.1"
        check: "(2*3 + 4*7 + 6*6 + 8*4)/20"
        difficulty: 2
        hints: ["Multiply each mark by the number of students who got it.", "Divide by the number of students, 20."]
        solution: "Step 1: Σfx = 6 + 28 + 36 + 32 = 102. Step 2: Σf = 20. Step 3: Mean = 102 ÷ 20 = 5.1."
        mistakes: {"5": frequency_not_used, "25.5": divided_by_values}
      - prompt: "Values 10, 20 and 30 have frequencies 5, 8 and f. The mean is 20. What is f?"
        answer: "5"
        check: "(10*5 + 20*8 - 20*13)/(20 - 30)"
        difficulty: 3
        hints: ["Σfx = 50 + 160 + 30f and Σf = 13 + f.", "Set (210 + 30f) ÷ (13 + f) = 20."]
        solution: "Step 1: 210 + 30f = 20(13 + f) = 260 + 20f. Step 2: 10f = 50, so f = 5."
        mistakes: {"8": mode_not_count, "50": forgot_divide}
      - prompt: 'Children in families: 1 child (4 families), 2 children (5 families), 3 children (1 family). What is the mean number of children per family?'
        answer: '1.7'
        check: (1*4 + 2*5 + 3*1)/10
        difficulty: 1
        hints:
        - Multiply each value by its frequency and add.
        - 4 + 10 + 3 = 17 children in 10 families.
        solution: 'Step 1: 1 × 4 + 2 × 5 + 3 × 1 = 17. Step 2: 4 + 5 + 1 = 10 families. Step 3: 17 ÷ 10 = 1.7.'
        mistakes:
          '2': frequency_not_used
          '5.667': divided_by_values
      - prompt: Marks 6, 7, 8 and 9 were scored by 5, 12, 9 and 4 students. What is the mode?
        answer: '7'
        check: '7'
        difficulty: 1
        hints:
        - Find the largest frequency.
        - 12 students scored the same mark.
        solution: 'Step 1: The frequencies are 5, 12, 9, 4. Step 2: The largest is 12. Step 3: Its mark is 7, so the mode is 7.'
        mistakes:
          '12': mode_not_count
      - prompt: Values 2, 4 and 6 have frequencies 5, 10 and 5. What is the mean?
        answer: '4'
        check: (2*5 + 4*10 + 6*5)/20
        difficulty: 2
        hints:
        - Σfx = 10 + 40 + 30.
        - Σf = 20.
        solution: 'Step 1: Σfx = 2 × 5 + 4 × 10 + 6 × 5 = 80. Step 2: Σf = 20. Step 3: 80 ÷ 20 = 4.'
        mistakes:
          '26.667': divided_by_values
      - prompt: Values 1, 2, 3 and 4 have frequencies 3, 6, 7 and 4. What is the median?
        answer: '3'
        check: '3'
        difficulty: 2
        hints:
        - '20 values: the median is between the 10th and 11th.'
        - 'Running totals: 3, 9, 16, 20.'
        solution: 'Step 1: Σf = 20, so look at the 10th and 11th values. Step 2: Running totals 3, 9, 16: values 10 to 16 are 3. Step 3: Median = 3.'
        mistakes:
          '2.5': frequency_median
          '7': frequency_median
      - prompt: Values 0, 1 and 2 have frequencies 2, k and 4. The mean is 1.2. What is k?
        answer: '4'
        check: (8 - 1.2*6)/(1.2 - 1)
        difficulty: 3
        hints:
        - Write the total and the count with k in them.
        - Σfx = k + 8 and Σf = 6 + k.
        solution: 'Step 1: Σfx = 0 × 2 + 1 × k + 2 × 4 = k + 8, and Σf = 6 + k. Step 2: k + 8 = 1.2(6 + k) = 7.2 + 1.2k. Step 3: 0.8 = 0.2k, so k = 4.'
        mistakes:
          '6': frequency_equation
      - prompt: 'A dice is rolled 20 times: 1 (2 times), 2 (4), 3 (3), 4 (5), 5 (2), 6 (4). What is the mean score?'
        answer: '3.65'
        check: (1*2 + 2*4 + 3*3 + 4*5 + 5*2 + 6*4)/20
        difficulty: 3
        hints:
        - Multiply each score by how many times it came up.
        - The products add up to 73 over 20 rolls.
        solution: 'Step 1: Σfx = 2 + 8 + 9 + 20 + 10 + 24 = 73. Step 2: Σf = 20 rolls. Step 3: Mean = 73 ÷ 20 = 3.65.'
        mistakes:
          '3.5': frequency_not_used
