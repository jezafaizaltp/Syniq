# Class 9 Mathematics, chapter 8. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_root, unit_change.
subject: math
chapter: 8
title: Circle Measures

tips:
  pi_exact: "22/7 and 3.14 are only close to π. π's decimals go on for ever without repeating, so no fraction is exactly equal to it."
  pi_constant: "For every circle, big or small, circumference ÷ diameter is the same number, π."
  radius_diameter: "The diameter is twice the radius. Check which one the question gives, and which one the formula needs."
  area_not_perimeter: "That is the area, πr². The perimeter (circumference) is πd, which is 2πr."
  perimeter_not_area: "That is the perimeter, 2πr. The area is πr²: the radius times itself, times π."
  area_scale: "Area depends on r × r. If r becomes 3r, the area has 3 × 3 = 9 times as much. Use the same idea for the change in the question."
  whole_not_half: "A semicircle is half a circle, so take half of the circle's area or curved length."
  forgot_straight_edge: "The perimeter of a semicircle also includes its straight side, the diameter."
  subtract_areas: "Find the area of the whole shape, then take away the area of the part that is cut out."
  fraction_lowest: "Divide the top and bottom by their biggest common factor. Both numbers here end in 0, so start by dividing both by 10."
  pi_digits: "π starts 3.1415… Compare each choice with these first digits, place by place."
  pi_doubled: "2 × 3.14: double each digit carefully."

concepts:
  - code: math9.circle.pi
    title: "A new number: π"
    notes: |
      For every circle, circumference ÷ diameter is the same number, called π. π ≈ 3.14 ≈ 22/7,
      but π is irrational: its decimal digits never end or repeat (3.14159…). 22/7 = 3.142857… is
      slightly more than π.
    explanations:
      text: "Wrap a thread around any round object, a bangle, a plate or a wheel, and measure it. Divide by the diameter. You always get a little more than 3, about 3.14. This number is the same for every circle, and it is called π (pi). Like √2, π is irrational: 3.14 and 22/7 are only close to it."
      visual: "Roll a wheel along the ground for one full turn and mark where it stops. Now lay its diameter along that path. It fits just over 3 times, with a small piece left over. That 'just over 3' is π."
      step_by_step: "To estimate π with a steel plate: Step 1: Wrap a thread around the edge and measure it, say 66 cm. Step 2: Measure across the middle, say 21 cm. Step 3: 66 ÷ 21 ≈ 3.14. Step 4: Any circle gives about the same answer."
      real_world: "A bicycle wheel with a diameter of 70 cm rolls about 3.14 × 70 ≈ 220 cm in one turn. The number of turns on the cycle's meter, times 220 cm, gives the distance travelled."
    activity:
      type: formula
      prompt: 'Measure circles of different sizes: the perimeter divided by the diameter is always the same.'
      inputs:
      - name: d
        label: Diameter
        min: 1
        max: 20
        step: 1
        start: 1
        unit: cm
      outputs:
      - name: c
        label: Perimeter
        expr: pi*d
        unit: cm
      - name: r
        label: Perimeter ÷ diameter
        expr: pi*d/d
        places: 4
      goals:
      - prompt: Make a circle whose perimeter is between 31.4 and 31.5 cm.
        want:
          c:
          - 31.4
          - 31.5
        mistakes:
        - when:
            d: 5
          say: 'With diameter 5 the perimeter is about 15.7 cm, half of what you need. Perimeter = π × diameter: a circle twice as wide has twice the perimeter.'
    lesson:
      - teach: Wrap a thread round a round tin to measure its circumference (the distance around), then measure its diameter (the distance straight across through the centre). Divide circumference by diameter. You get a little more than 3, whatever size the tin.
        check:
          prompt: A bangle's circumference is about 19 cm and its diameter about 6 cm. About how many times the diameter is the circumference?
          options:
          - A little more than 3
          - Exactly 2
          - About 13
          answer: A little more than 3
          why: 19 ÷ 6 ≈ 3.17. For every circle, the answer is the same number, a little more than 3.
      - teach: 'That number is called π (pi). For every circle, circumference ÷ diameter = π. π ≈ 3.14, and 22/7 is also close. But π is irrational: its decimals 3.14159… go on for ever without repeating, so 3.14 and 22/7 are only approximations.'
        check:
          prompt: Which is true about π?
          options:
          - Its decimals never end or repeat
          - It is exactly 22/7
          - It is different for big circles
          answer: Its decimals never end or repeat
          why: π is irrational. 22/7 = 3.142857… is a little bigger than π.
      - teach: Because circumference ÷ diameter = π for every circle, doubling the diameter doubles the circumference. A circle 3 times as wide goes 3 times as far round.
        check:
          prompt: Circle B is 5 times as wide as circle A. How do their circumferences compare?
          options:
          - B's is 5 times A's
          - B's is 25 times A's
          - They are equal
          answer: B's is 5 times A's
          why: Circumference = π × diameter, so it grows by the same factor as the diameter.
    items:
      - prompt: "For any circle, what is circumference ÷ diameter?"
        options: ["π, about 3.14", "2", "It depends on the size of the circle", "π, which is exactly 22/7"]
        answer: "π, about 3.14"
        difficulty: 1
        hints: ["Is it the same for a bangle and a wheel?"]
        solution: "Step 1: For every circle the answer is the same number, π. Step 2: π ≈ 3.14, but it is not exactly 22/7."
        mistakes: {"π, which is exactly 22/7": pi_exact, "It depends on the size of the circle": pi_constant}
      - prompt: "Which statement is true?"
        options: ["π is irrational", "π = 3.14 exactly", "π = 22/7 exactly", "π is a whole number"]
        answer: "π is irrational"
        difficulty: 1
        hints: ["Can π be written exactly as a fraction?"]
        solution: "Step 1: π = 3.14159…, with decimals that never end or repeat. Step 2: So it is irrational; 3.14 and 22/7 are approximations."
        mistakes: {"π = 3.14 exactly": pi_exact, "π = 22/7 exactly": pi_exact}
      - prompt: "Which of these is closest to π?"
        options: ["3.14", "3.41", "3.0", "4.13"]
        answer: "3.14"
        difficulty: 1
        hints: ["π = 3.14159…"]
        solution: "π = 3.14159…, so 3.14 is closest."
        mistakes: {"3.41": "pi_digits", "3.0": "pi_digits"}
      - prompt: "A wheel's circumference is 220 cm and its diameter is 70 cm. What is circumference ÷ diameter, as a fraction in lowest terms? Type it like 2/3."
        answer: "22/7"
        check: "220/70"
        difficulty: 2
        hints: ["220/70, then divide top and bottom by 10."]
        solution: "Step 1: 220/70 = 22/7. Step 2: This is a common approximation of π."
        mistakes: {"22/70": "fraction_lowest"}
      - prompt: "Using π ≈ 3.14, what is 2π?"
        answer: "6.28"
        check: "2*3.14"
        difficulty: 2
        hints: ["2 × 3.14."]
        solution: "2 × 3.14 = 6.28"
        mistakes: {"5.28": "pi_doubled", "9.86": "pi_doubled"}
      - prompt: "Which is bigger: π or 22/7?"
        options: ["22/7", "π", "They are equal"]
        answer: "22/7"
        difficulty: 3
        hints: ["22 ÷ 7 = 3.142857…", "π = 3.14159…"]
        solution: "Step 1: 22/7 = 3.1428… Step 2: π = 3.1415… Step 3: So 22/7 is slightly bigger."
        mistakes: {"They are equal": pi_exact}
      - prompt: "A round tin lid has a circumference of 31.4 cm. Using π ≈ 3.14, what is its diameter, in cm?"
        answer: "10"
        check: "31.4/3.14"
        difficulty: 2
        hints: ["Circumference ÷ diameter = π.", "So diameter = circumference ÷ π."]
        solution: "Step 1: Diameter = 31.4 ÷ 3.14. Step 2: = 10 cm."
        mistakes: {"5": radius_diameter, "98.596": pi_constant}
      - prompt: "Two circles have diameters 7 cm and 21 cm. How many times as long is the bigger circle's circumference?"
        answer: "3"
        check: "21/7"
        difficulty: 3
        hints: ["Circumference = π × diameter for both.", "π is the same; compare the diameters."]
        solution: "Step 1: Circumferences are 7π and 21π. Step 2: 21π ÷ 7π = 3."
        mistakes: {"9": area_scale, "14": pi_constant}
      - prompt: "Which of these is not equal to π?"
        options: ["3.14", "Circumference ÷ diameter", "Half circumference ÷ radius", "Area ÷ radius²"]
        answer: "3.14"
        difficulty: 3
        hints: ["π is exact; some of these are only close to it.", "Check each against C = 2πr and A = πr²."]
        solution: "Step 1: C ÷ d, (C/2) ÷ r and A ÷ r² are all exactly π. Step 2: 3.14 is only an approximation, so it is not equal to π."
        mistakes: {"Half circumference ÷ radius": pi_exact, "Area ÷ radius²": pi_exact}
      - prompt: What is π, for any circle?
        options:
        - Circumference ÷ diameter
        - Circumference ÷ radius
        - Diameter ÷ circumference
        - Area ÷ diameter
        answer: Circumference ÷ diameter
        difficulty: 1
        hints:
        - π compares the distance round with the distance across.
        - Which measure goes straight across through the centre?
        solution: 'Step 1: Circumference is the distance round. Step 2: Diameter is the distance across. Step 3: π = circumference ÷ diameter ≈ 3.14.'
        mistakes:
          Circumference ÷ radius: radius_diameter
      - prompt: Which of these is NOT a good value for π?
        options:
        - '3'
        - '3.14'
        - 22/7
        - '3.1416'
        answer: '3'
        difficulty: 1
        hints:
        - π is a little more than 3.
        - Which value leaves out the part after the point?
        solution: 'Step 1: π = 3.14159… Step 2: 3.14, 22/7 and 3.1416 are all close. Step 3: 3 is too rough to use.'
        mistakes:
          '3.14': pi_exact
      - prompt: A round table top has a diameter of 2 m. Using π ≈ 3.14, how far is it round its edge, in metres?
        answer: '6.28'
        check: 3.14*2
        difficulty: 2
        hints:
        - Circumference = π × diameter.
        - 3.14 × 2.
        solution: 'Step 1: C = π × d. Step 2: C = 3.14 × 2. Step 3: = 6.28 m.'
        mistakes:
          '12.56': pi_doubled
      - prompt: A circle's circumference is 62.8 cm. Using π ≈ 3.14, what is its diameter, in cm?
        answer: '20'
        check: 62.8/3.14
        difficulty: 2
        hints:
        - Diameter = circumference ÷ π.
        - 62.8 ÷ 3.14.
        solution: 'Step 1: d = C ÷ π. Step 2: d = 62.8 ÷ 3.14. Step 3: = 20 cm.'
        mistakes:
          '10': radius_diameter
      - prompt: A circular ground has a diameter 4 times that of a circular pond. The pond's circumference is 30 m. What is the ground's circumference, in metres?
        answer: '120'
        check: 4*30
        difficulty: 3
        hints:
        - Circumference grows with the diameter.
        - 4 times as wide means 4 times as far round.
        solution: 'Step 1: C = π × d. Step 2: Multiplying d by 4 multiplies C by 4. Step 3: 4 × 30 = 120 m.'
        mistakes:
          '480': area_scale
      - prompt: 'Which is closer to π: 3.14 or 22/7?'
        options:
        - 22/7
        - '3.14'
        - They are equally close
        answer: 22/7
        difficulty: 3
        hints:
        - π = 3.14159…
        - 22/7 = 3.142857…
        solution: 'Step 1: π − 3.14 ≈ 0.0016. Step 2: 22/7 − π ≈ 0.0013. Step 3: So 22/7 is slightly closer.'
        mistakes:
          '3.14': pi_digits

  - code: math9.circle.circumference
    title: The perimeter of a circle
    after: [math9.circle.pi]
    notes: |
      Circumference (perimeter) = π × diameter = 2πr. Exact answers are written with π (radius 5 gives
      10π); otherwise use π ≈ 22/7 or 3.14 as the question says. Going backwards, d = C ÷ π.
    explanations:
      text: "Since circumference ÷ diameter = π, the circumference is π × diameter. The diameter is twice the radius, so it is also 2πr. A circle of diameter 14 cm has a circumference of 22/7 × 14 = 44 cm."
      visual: "Picture a circle with a line straight across it, the diameter. Now imagine bending three diameters and a bit more around the edge. That's the circumference: π diameters."
      step_by_step: "For a circle of radius 7 cm, with π ≈ 22/7: Step 1: Diameter = 2 × 7 = 14 cm. Step 2: Circumference = π × d = 22/7 × 14. Step 3: = 44 cm."
      real_world: "A bicycle wheel 70 cm across goes 22/7 × 70 = 220 cm in one turn. After 100 turns the bicycle has travelled 22000 cm, which is 220 m."
    activity:
      type: formula
      prompt: Perimeter of a circle = 2πr.
      inputs:
      - name: r
        label: Radius
        min: 1
        max: 20
        step: 1
        start: 1
        unit: cm
      outputs:
      - name: c
        label: Perimeter
        expr: 2*pi*r
        unit: cm
      goals:
      - prompt: Make the perimeter about 44 cm (43.9 to 44.1).
        want:
          c:
          - 43.9
          - 44.1
        hint: 'Using 22/7: 2 × 22/7 × r = 44.'
        mistakes:
        - when:
            r: 14
          say: With radius 14 the perimeter is about 88 cm, twice too much. 14 may be the diameter you're thinking of, not the radius.
    lesson:
      - teach: Since circumference ÷ diameter = π, the circumference is π × diameter. The diameter is twice the radius, so circumference = 2πr. A circle of radius 7 cm has circumference 2 × 22/7 × 7 = 44 cm.
        check:
          prompt: A circle has a diameter of 7 cm. Using π ≈ 22/7, what is its circumference?
          options:
          - 22 cm
          - 44 cm
          - 154 cm
          answer: 22 cm
          why: C = π × d = 22/7 × 7 = 22 cm. Using 7 as a radius would give 44 cm.
      - teach: If a question doesn't say which value of π to use, leave π in the answer. Radius 5 gives circumference 2 × π × 5 = 10π cm. That is the exact answer.
        check:
          prompt: A circle has a radius of 4 cm. What is its exact circumference?
          options:
          - 8π cm
          - 4π cm
          - 16π cm
          answer: 8π cm
          why: 2 × π × 4 = 8π. 16π would be the area, πr².
      - teach: 'Going backwards: diameter = circumference ÷ π. A wheel rolls one circumference in each full turn, so a 70 cm wheel goes 220 cm per turn, and 100 turns go 22000 cm = 220 m.'
        check:
          prompt: A wire 22 cm long is bent into a circle. Using π ≈ 22/7, what is its diameter?
          options:
          - 7 cm
          - 3.5 cm
          - 14 cm
          answer: 7 cm
          why: d = 22 ÷ 22/7 = 22 × 7/22 = 7 cm.
    items:
      - prompt: "A circle has a diameter of 14 cm. Using π ≈ 22/7, what is its circumference, in cm?"
        answer: "44"
        check: "(22/7)*14"
        difficulty: 1
        hints: ["Circumference = π × diameter."]
        solution: "Step 1: C = π × d. Step 2: = 22/7 × 14. Step 3: = 44 cm."
        mistakes: {"22": radius_diameter, "154": area_not_perimeter}
      - prompt: "A circle has a radius of 7 cm. Using π ≈ 22/7, what is its circumference, in cm?"
        answer: "44"
        check: "2*(22/7)*7"
        difficulty: 1
        hints: ["Circumference = 2πr."]
        solution: "Step 1: C = 2 × 22/7 × 7. Step 2: = 44 cm."
        mistakes: {"22": radius_diameter, "154": area_not_perimeter}
      - prompt: "A circle has a radius of 5 cm. What is its circumference, in cm?"
        options: ["10π", "5π", "25π", "10"]
        answer: "10π"
        check: "2*pi*5"
        difficulty: 1
        hints: ["Circumference = 2πr."]
        solution: "C = 2 × π × 5 = 10π cm"
        mistakes: {"5π": radius_diameter, "25π": area_not_perimeter}
      - prompt: "A wheel has a diameter of 70 cm. How far does it roll in one full turn, in cm? Use π ≈ 22/7."
        answer: "220"
        check: "(22/7)*70"
        difficulty: 2
        hints: ["One turn rolls out the whole circumference."]
        solution: "Step 1: C = 22/7 × 70. Step 2: = 220 cm."
        mistakes: {"110": radius_diameter}
      - prompt: "A circle's circumference is 88 cm. Using π ≈ 22/7, what is its radius, in cm?"
        answer: "14"
        check: "88/(2*22/7)"
        difficulty: 2
        hints: ["2πr = 88.", "r = 88 ÷ (2 × 22/7)."]
        solution: "Step 1: 2 × 22/7 × r = 88. Step 2: 44/7 × r = 88. Step 3: r = 14 cm."
        mistakes: {"28": radius_diameter}
      - prompt: "A wire 44 cm long is bent into a circle. Using π ≈ 22/7, what is the circle's diameter, in cm?"
        answer: "14"
        check: "44/(22/7)"
        difficulty: 3
        hints: ["The wire's length is the circumference.", "d = C ÷ π."]
        solution: "Step 1: π × d = 44. Step 2: d = 44 × 7/22. Step 3: d = 14 cm."
        mistakes: {"7": radius_diameter}
      - prompt: "A bicycle wheel with a diameter of 70 cm turns 100 times. How far does the bicycle go, in metres? Use π ≈ 22/7."
        answer: "220"
        check: "(22/7)*70*100/100"
        difficulty: 3
        hints: ["One turn covers the wheel's circumference: π × diameter.", "100 turns, then change cm to m."]
        solution: "Step 1: One turn = 22/7 × 70 = 220 cm. Step 2: 100 turns = 22000 cm. Step 3: = 220 m."
        mistakes: {"22000": unit_change, "110": radius_diameter}
      - prompt: "A circle has a radius of 10.5 cm. Using π ≈ 22/7, what is its circumference, in cm?"
        answer: "66"
        check: "2*22/7*10.5"
        difficulty: 2
        hints: ["Circumference = 2πr.", "2 × 22/7 × 10.5."]
        solution: "Step 1: 2 × 10.5 = 21. Step 2: 21 × 22/7 = 66 cm."
        mistakes: {"33": radius_diameter, "346.5": area_not_perimeter}
      - prompt: "A wheel goes 440 m in 200 full turns. Using π ≈ 22/7, what is its diameter, in cm?"
        answer: "70"
        check: "44000/200/(22/7)"
        difficulty: 3
        hints: ["One turn = 440 ÷ 200 = 2.2 m = 220 cm.", "Diameter = circumference ÷ π."]
        solution: "Step 1: One turn = 2.2 m = 220 cm. Step 2: Diameter = 220 ÷ 22/7 = 70 cm."
        mistakes: {"35": radius_diameter, "0.7": unit_change}
      - prompt: "A square and a circle have the same perimeter of 88 cm. Using π ≈ 22/7, how much longer is the circle's diameter than the square's side, in cm?"
        answer: "6"
        check: "88/(22/7) - 88/4"
        difficulty: 3
        hints: ["Square side = 88 ÷ 4.", "Circle diameter = 88 ÷ π."]
        solution: "Step 1: Square side = 22 cm. Step 2: Circle diameter = 88 × 7/22 = 28 cm. Step 3: 28 − 22 = 6 cm."
        mistakes: {"8": radius_diameter, "-8": radius_diameter}
      - prompt: A circle has a diameter of 21 cm. Using π ≈ 22/7, what is its circumference, in cm?
        answer: '66'
        check: 22/7*21
        difficulty: 1
        hints:
        - Circumference = π × diameter.
        - 22/7 × 21.
        solution: 'Step 1: C = π × d. Step 2: 22/7 × 21 = 22 × 3. Step 3: = 66 cm.'
        mistakes:
          '132': radius_diameter
      - prompt: A circle has a radius of 3.5 cm. Using π ≈ 22/7, what is its circumference, in cm?
        answer: '22'
        check: 2*22/7*3.5
        difficulty: 1
        hints:
        - Circumference = 2πr.
        - 2 × 3.5 = 7, the diameter.
        solution: 'Step 1: d = 2 × 3.5 = 7 cm. Step 2: C = 22/7 × 7. Step 3: = 22 cm.'
        mistakes:
          '11': radius_diameter
          '38.5': area_not_perimeter
      - prompt: A circle has a diameter of 9 cm. What is its exact circumference?
        options:
        - 9π cm
        - 18π cm
        - 4.5π cm
        - 81π cm
        answer: 9π cm
        difficulty: 2
        hints:
        - Circumference = π × diameter.
        - No value of π is given, so keep π.
        solution: 'Step 1: C = π × d. Step 2: d = 9. Step 3: C = 9π cm.'
        mistakes:
          18π cm: radius_diameter
          81π cm: area_not_perimeter
      - prompt: A circular park has a circumference of 132 m. Using π ≈ 22/7, what is its radius, in metres?
        answer: '21'
        check: 132/(2*22/7)
        difficulty: 2
        hints:
        - 'Find the diameter first: C ÷ π.'
        - 132 × 7/22 = 42.
        solution: 'Step 1: d = 132 ÷ 22/7 = 42 m. Step 2: r = d ÷ 2. Step 3: r = 21 m.'
        mistakes:
          '42': radius_diameter
      - prompt: A wheel of diameter 56 cm turns 50 times. Using π ≈ 22/7, how far does it go, in metres?
        answer: '88'
        check: 22/7*56*50/100
        difficulty: 3
        hints:
        - One turn goes one circumference.
        - 22/7 × 56 = 176 cm per turn.
        solution: 'Step 1: One turn = 22/7 × 56 = 176 cm. Step 2: 50 turns = 8800 cm. Step 3: 8800 cm = 88 m.'
        mistakes:
          '8800': radius_diameter
          '176': radius_diameter
      - prompt: A semicircular arch has a radius of 7 m. Using π ≈ 22/7, how long is the curved part, in metres?
        answer: '22'
        check: 22/7*7
        difficulty: 3
        hints:
        - The curve is half of the full circle's circumference.
        - Half of 2πr is πr.
        solution: 'Step 1: Full circumference = 2 × 22/7 × 7 = 44 m. Step 2: Half of it is the curve. Step 3: 44 ÷ 2 = 22 m.'
        mistakes:
          '44': whole_not_half

  - code: math9.circle.area
    title: The area of a circle
    after: [math9.circle.circumference]
    notes: |
      Area = πr². Cut a circle into thin slices and arrange them alternately: they make a shape close
      to a rectangle of length πr (half the circumference) and height r. Doubling the radius makes
      the area 4 times as big. From an area, r = √(A ÷ π).
    explanations:
      text: "The area of a circle is π × r × r, written πr². A circle of radius 7 cm has an area of 22/7 × 7 × 7 = 154 cm². Remember: the perimeter uses r once (2πr), the area uses it twice (πr²)."
      visual: "Cut a circle into many thin slices like a pizza. Lay them side by side, points up and down in turn. They make a shape very close to a rectangle: one side is half the circumference, πr, and the other is the radius, r. So the area is πr × r = πr²."
      step_by_step: "For a circle of diameter 20 cm with π ≈ 3.14: Step 1: Radius = 20 ÷ 2 = 10 cm. Step 2: r² = 100. Step 3: Area = 3.14 × 100 = 314 cm²."
      real_world: "A 28 cm pizza (14 cm radius) has an area of 22/7 × 14 × 14 = 616 cm². Cut into 8 equal slices, each slice is 77 cm². Two 20 cm pizzas give less to eat than one 28 cm pizza."
    activity:
      type: formula
      prompt: Area of a circle = πr².
      inputs:
      - name: r
        label: Radius
        min: 1
        max: 20
        step: 1
        start: 1
        unit: cm
      outputs:
      - name: a
        label: Area
        expr: pi*r^2
        unit: cm²
        places: 1
      goals:
      - prompt: Make the area about 154 cm² (153.5 to 154.5).
        want:
          a:
          - 153.5
          - 154.5
        mistakes:
        - when:
            r: 14
          say: With radius 14 the area is about 616 cm², four times too big. The radius is squared, so it grows fast.
      - prompt: What happens to the area when you double the radius? Make it about 616 cm².
        want:
          a:
          - 614
          - 618
    lesson:
      - teach: Cut a circle into many thin slices, like a pizza, and lay them in a row, pointing up and down in turn. They make a shape close to a rectangle. Its length is half the circumference, πr, and its height is the radius, r.
        picture:
          kind: flow
          steps:
          - Cut the circle into thin slices
          - Lay them point up, point down
          - 'Almost a rectangle: πr long, r high'
          - Area = πr × r = πr²
          alt: Slices of a circle rearranged into a near rectangle of length πr and height r, giving area πr².
        check:
          prompt: In the near rectangle, why is the length πr?
          options:
          - It is half of the circumference 2πr
          - It is the diameter
          - It is the radius
          answer: It is half of the circumference 2πr
          why: Half the slices' curved edges are on top and half on the bottom, so each long side is half of 2πr.
      - teach: 'So the area of a circle is πr². Radius 7 cm, π ≈ 22/7: area = 22/7 × 7 × 7 = 154 cm². Square the radius, not the diameter: if you''re given the diameter, halve it first.'
        check:
          prompt: A circle has a diameter of 10 cm. What is its exact area?
          options:
          - 25π cm²
          - 100π cm²
          - 10π cm²
          answer: 25π cm²
          why: r = 5, so πr² = 25π. 100π squares the diameter by mistake, and 10π is the circumference.
      - teach: The area grows with the square of the radius. Double the radius and the area becomes 2² = 4 times as big; triple it and the area becomes 9 times as big. To go back from area to radius, divide by π and take the square root.
        check:
          prompt: A circle's area is 9π cm². What is its radius?
          options:
          - 3 cm
          - 9 cm
          - 4.5 cm
          answer: 3 cm
          why: πr² = 9π, so r² = 9 and r = 3.
    items:
      - prompt: "A circle has a radius of 7 cm. Using π ≈ 22/7, what is its area, in cm²?"
        answer: "154"
        check: "(22/7)*7^2"
        difficulty: 1
        hints: ["Area = πr².", "22/7 × 7 × 7."]
        solution: "Step 1: Area = 22/7 × 7 × 7. Step 2: = 22 × 7. Step 3: = 154 cm²."
        mistakes: {"44": perimeter_not_area, "616": radius_diameter}
      - prompt: "A circle has a radius of 3 cm. What is its area, in cm²?"
        options: ["9π", "6π", "3π", "9"]
        answer: "9π"
        check: "pi*3^2"
        difficulty: 1
        hints: ["Area = πr² = π × 3 × 3."]
        solution: "Area = π × 3² = 9π cm²"
        mistakes: {"6π": perimeter_not_area}
      - prompt: "A circle has a diameter of 20 cm. Using π ≈ 3.14, what is its area, in cm²?"
        answer: "314"
        check: "3.14*10^2"
        difficulty: 2
        hints: ["Find the radius first: 10 cm."]
        solution: "Step 1: r = 10 cm. Step 2: Area = 3.14 × 100. Step 3: = 314 cm²."
        mistakes: {"1256": radius_diameter, "62.8": perimeter_not_area}
      - prompt: "If the radius of a circle is doubled, how many times as big does its area become?"
        options: ["4", "2", "8", "π"]
        answer: "4"
        check: "(pi*2^2)/(pi*1^2)"
        difficulty: 2
        hints: ["Try radius 1 and radius 2.", "π × 1² = π and π × 2² = 4π."]
        solution: "Step 1: Radius 1 gives area π. Step 2: Radius 2 gives 4π. Step 3: So 4 times as big."
        mistakes: {"2": area_scale}
      - prompt: "A circular garden has an area of 616 m². Using π ≈ 22/7, what is its radius, in metres?"
        answer: "14"
        check: "sqrt(616/(22/7))"
        difficulty: 2
        hints: ["22/7 × r² = 616, so r² = 616 × 7 ÷ 22.", "r² = 196."]
        solution: "Step 1: r² = 616 × 7/22 = 196. Step 2: r = √196 = 14 m."
        mistakes: {"196": forgot_root}
      - prompt: "A circular pizza with a diameter of 28 cm is cut into 8 equal slices. Using π ≈ 22/7, what is the area of one slice, in cm²?"
        answer: "77"
        check: "(22/7)*14^2/8"
        difficulty: 3
        hints: ["Radius = 14 cm.", "Whole pizza = 616 cm²."]
        solution: "Step 1: Area = 22/7 × 14 × 14 = 616 cm². Step 2: One slice = 616 ÷ 8 = 77 cm²."
        mistakes: {"308": radius_diameter, "11": perimeter_not_area}
      - prompt: "A circle has a diameter of 14 cm. Using π ≈ 22/7, what is its area, in cm²?"
        answer: "154"
        check: "22/7*7**2"
        difficulty: 2
        hints: ["Halve the diameter to get the radius.", "Area = πr² with r = 7."]
        solution: "Step 1: r = 7 cm. Step 2: Area = 22/7 × 49 = 154 cm²."
        mistakes: {"616": radius_diameter, "44": perimeter_not_area}
      - prompt: "A circle's circumference is 44 cm. Using π ≈ 22/7, what is its area, in cm²?"
        answer: "154"
        check: "22/7*(44/(2*22/7))**2"
        difficulty: 3
        hints: ["First find the radius from 2πr = 44.", "r = 7 cm."]
        solution: "Step 1: 2 × 22/7 × r = 44, so r = 7 cm. Step 2: Area = 22/7 × 49 = 154 cm²."
        mistakes: {"616": radius_diameter, "44": perimeter_not_area}
      - prompt: "A circle's radius is made 3 times as long. How many times as big does its area become?"
        answer: "9"
        check: "3**2"
        difficulty: 3
        hints: ["Area = πr². What happens to r²?", "(3r)² = 9r²."]
        solution: "Step 1: New area = π(3r)² = 9πr². Step 2: That is 9 times the old area."
        mistakes: {"3": area_scale, "6": area_scale}
      - prompt: A circle has a radius of 14 cm. Using π ≈ 22/7, what is its area, in cm²?
        answer: '616'
        check: 22/7*14**2
        difficulty: 1
        hints:
        - Area = πr².
        - 22/7 × 14 × 14.
        solution: 'Step 1: r² = 196. Step 2: 22/7 × 196 = 22 × 28. Step 3: = 616 cm².'
        mistakes:
          '88': perimeter_not_area
      - prompt: A circle has a radius of 6 cm. What is its exact area?
        options:
        - 36π cm²
        - 12π cm²
        - 6π cm²
        - 144π cm²
        answer: 36π cm²
        difficulty: 1
        hints:
        - Area = πr².
        - 6² = 36.
        solution: 'Step 1: Area = π × 6². Step 2: 6² = 36. Step 3: So 36π cm².'
        mistakes:
          12π cm²: perimeter_not_area
          144π cm²: radius_diameter
      - prompt: A circular rangoli has a diameter of 1 m. Using π ≈ 3.14, what is its area, in m²? Decimals are fine.
        answer: '0.785'
        check: 3.14*0.5**2
        difficulty: 2
        hints:
        - Halve the diameter to get the radius.
        - r = 0.5 m, so r² = 0.25.
        solution: 'Step 1: r = 0.5 m. Step 2: r² = 0.25. Step 3: 3.14 × 0.25 = 0.785 m².'
        mistakes:
          '3.14': radius_diameter
      - prompt: A circle's area is 49π cm². What is its diameter, in cm?
        answer: '14'
        check: 2*sqrt(49)
        difficulty: 2
        hints:
        - πr² = 49π, so r² = 49.
        - Find r, then double it.
        solution: 'Step 1: r² = 49. Step 2: r = 7 cm. Step 3: d = 14 cm.'
        mistakes:
          '7': radius_diameter
      - prompt: A circle's radius is halved. Its area becomes what fraction of what it was? Type a fraction like 2/3.
        answer: 1/4
        check: (1/2)**2
        difficulty: 3
        hints:
        - Area depends on r².
        - (1/2)² = ?
        solution: 'Step 1: Area = πr². Step 2: Halving r multiplies r² by (1/2)². Step 3: (1/2)² = 1/4.'
        mistakes:
          1/2: area_scale
      - prompt: A circular field has a circumference of 88 m. Using π ≈ 22/7, what is its area, in m²?
        answer: '616'
        check: 22/7*14**2
        difficulty: 3
        hints:
        - First find the radius from the circumference.
        - 2πr = 88, so r = 14.
        solution: 'Step 1: r = 88 ÷ (2 × 22/7) = 14 m. Step 2: Area = 22/7 × 14². Step 3: = 616 m².'
        mistakes:
          '88': perimeter_not_area

  - code: math9.circle.shapes
    title: Half circles, rings and other shapes
    after: [math9.circle.area]
    notes: |
      Shapes made from parts of circles: a semicircle has half the area (πr²/2) and a curved edge of
      πr, plus the diameter if the straight side is included. A ring's area is the outer circle's
      area minus the inner one's. Cut-out areas are subtracted; joined pieces are added.
    explanations:
      text: "Many shapes are made from circles. A semicircle is half a circle: its area is πr² ÷ 2. Its perimeter is half the circumference, πr, plus the straight side, 2r. A ring is a big circle with a small one cut out, so its area is the big area minus the small area."
      visual: "Picture a running track: a rectangle in the middle with a half circle stuck on each end. The two half circles together make one whole circle. So one lap is the two straight sides plus one full circumference."
      step_by_step: "A square of side 14 cm with a circle fitting exactly inside it: Step 1: Square area = 14 × 14 = 196 cm². Step 2: The circle's radius is 7 cm, so its area is 154 cm². Step 3: Area outside the circle = 196 − 154 = 42 cm²."
      real_world: "A school track has straight sides of 100 m and semicircular ends 70 m across. One lap is 100 + 100 + 22/7 × 70 = 420 m."
    activity:
      type: formula
      prompt: 'A ring: a big circle of radius R with a small circle of radius r cut out.'
      inputs:
      - name: big
        label: R
        min: 1
        max: 12
        step: 1
        start: 2
        unit: cm
      - name: small
        label: r
        min: 0
        max: 11
        step: 1
        start: 1
        unit: cm
      outputs:
      - name: a
        label: Ring area
        expr: pi*(big^2-small^2)
        unit: cm²
        places: 1
      goals:
      - prompt: Make a ring with area about 88 cm² (87.5 to 88.5).
        want:
          a:
          - 87.5
          - 88.5
        hint: R² − r² must be 28.
    lesson:
      - teach: A semicircle is half a circle. Its area is half of πr². Its curved edge is half the circumference, πr. If the question asks for the perimeter, add the straight edge too, which is the diameter 2r.
        check:
          prompt: A semicircle has radius 7 cm. With π ≈ 22/7, its curved edge is 22 cm. What is its whole perimeter?
          options:
          - 36 cm
          - 22 cm
          - 29 cm
          answer: 36 cm
          why: Curve 22 cm + straight edge 14 cm (the diameter) = 36 cm.
      - teach: 'A ring is a big circle with a small circle taken out. Its area is the big area minus the small area: πR² − πr². A path round a pond of radius 7 m, 3.5 m wide, has R = 10.5 m and r = 7 m.'
        picture:
          kind: flow
          steps:
          - 'Big circle: πR²'
          - 'Small circle: πr²'
          - Ring = πR² − πr²
          alt: The area of a ring is the area of the outer circle minus the area of the inner circle.
        check:
          prompt: A ring has outer radius 5 cm and inner radius 3 cm. What is its exact area?
          options:
          - 16π cm²
          - 4π cm²
          - 2π cm²
          answer: 16π cm²
          why: 25π − 9π = 16π. Subtracting the radii first (5 − 3 = 2, then 4π) is a common slip.
      - teach: 'For other shapes, break them into parts you know. A square with a semicircle on one side: add the square''s area and the semicircle''s. A square with a circle cut out: subtract. A quarter circle is a quarter of πr².'
        check:
          prompt: A shape is a 10 cm square with a circle of area 78.5 cm² cut out. What is its area?
          options:
          - 21.5 cm²
          - 178.5 cm²
          - 78.5 cm²
          answer: 21.5 cm²
          why: Square 100 cm² minus circle 78.5 cm² = 21.5 cm². A cut-out is subtracted.
    items:
      - prompt: "What is the area of a semicircle of radius 7 cm, in cm²? Use π ≈ 22/7."
        answer: "77"
        check: "(22/7)*7^2/2"
        difficulty: 1
        hints: ["A full circle of radius 7 is 154 cm²."]
        solution: "Step 1: Full circle = 154 cm². Step 2: Half = 77 cm²."
        mistakes: {"154": whole_not_half}
      - prompt: "A semicircle has radius r. What is its area?"
        options: ["πr²/2", "πr²", "πr", "2πr"]
        answer: "πr²/2"
        check: "pi*r^2/2"
        difficulty: 1
        hints: ["Half of a circle's area."]
        solution: "A circle's area is πr², so half is πr²/2."
        mistakes: {"πr²": whole_not_half, "πr": perimeter_not_area}
      - prompt: "What is the perimeter of a semicircle of radius 7 cm, including its straight side, in cm? Use π ≈ 22/7."
        answer: "36"
        check: "(22/7)*7 + 14"
        difficulty: 2
        hints: ["The curved part is half of 44 cm.", "Add the straight side: the diameter, 14 cm."]
        solution: "Step 1: Curved part = 22/7 × 7 = 22 cm. Step 2: Straight side = 14 cm. Step 3: 22 + 14 = 36 cm."
        mistakes: {"22": forgot_straight_edge, "58": whole_not_half}
      - prompt: "A ring is cut from a circle of radius 7 cm by removing a circle of radius 3.5 cm from the middle. Using π ≈ 22/7, what is the ring's area, in cm²?"
        answer: "115.5"
        check: "(22/7)*(7^2 - 3.5^2)"
        difficulty: 2
        hints: ["Big circle = 154 cm².", "Small circle = 22/7 × 3.5 × 3.5 = 38.5 cm²."]
        solution: "Step 1: Big circle = 154 cm². Step 2: Small circle = 38.5 cm². Step 3: Ring = 154 − 38.5 = 115.5 cm²."
        mistakes: {"38.5": subtract_areas, "192.5": subtract_areas}
      - prompt: "A circle fits exactly inside a square with sides of 14 cm, touching all four sides. Using π ≈ 22/7, what is the area of the square outside the circle, in cm²?"
        answer: "42"
        check: "14^2 - (22/7)*7^2"
        difficulty: 3
        hints: ["The circle's diameter is 14 cm, so its radius is 7 cm.", "Square area − circle area."]
        solution: "Step 1: Square = 196 cm². Step 2: Circle = 154 cm². Step 3: 196 − 154 = 42 cm²."
        mistakes: {"154": subtract_areas, "196": subtract_areas}
      - prompt: "A running track has two straight sides of 100 m and a semicircle at each end. The semicircles are 70 m across. How long is one lap, in metres? Use π ≈ 22/7."
        answer: "420"
        check: "2*100 + (22/7)*70"
        difficulty: 3
        hints: ["The two semicircles together make one full circle of diameter 70 m.", "That circle's circumference is 220 m."]
        solution: "Step 1: Straight sides = 200 m. Step 2: Two semicircles = one circle = 22/7 × 70 = 220 m. Step 3: Lap = 420 m."
        mistakes: {"310": whole_not_half}
      - prompt: "A quarter circle has a radius of 14 cm. Using π ≈ 22/7, what is its area, in cm²?"
        answer: "154"
        check: "22/7*14**2/4"
        difficulty: 2
        hints: ["A quarter circle is a quarter of the full circle's area.", "Full area = 22/7 × 196 = 616."]
        solution: "Step 1: Full circle = 616 cm². Step 2: Quarter = 616 ÷ 4 = 154 cm²."
        mistakes: {"616": whole_not_half, "308": whole_not_half}
      - prompt: "A square of side 14 cm has a semicircle on one side, outside the square, with that side as its diameter. Using π ≈ 22/7, what is the area of the whole shape, in cm²?"
        answer: "273"
        check: "14**2 + 22/7*7**2/2"
        difficulty: 3
        hints: ["Square area + half a circle of radius 7.", "196 + 77."]
        solution: "Step 1: Square = 196 cm². Step 2: Semicircle = 22/7 × 49 ÷ 2 = 77 cm². Step 3: Total = 273 cm²."
        mistakes: {"350": whole_not_half, "119": subtract_areas}
      - prompt: "A circular path 3.5 m wide goes round a circular pond of radius 7 m. Using π ≈ 22/7, what is the area of the path, in m²?"
        answer: "192.5"
        check: "22/7*(10.5**2 - 7**2)"
        difficulty: 3
        hints: ["The outer radius is 7 + 3.5 = 10.5 m.", "Path = big circle − pond."]
        solution: "Step 1: Outer circle = 22/7 × 110.25 = 346.5 m². Step 2: Pond = 22/7 × 49 = 154 m². Step 3: Path = 346.5 − 154 = 192.5 m²."
        mistakes: {"38.5": subtract_areas, "346.5": subtract_areas}
      - prompt: A semicircle has a radius of 14 cm. Using π ≈ 22/7, what is its area, in cm²?
        answer: '308'
        check: 22/7*14**2/2
        difficulty: 1
        hints:
        - It is half of πr².
        - πr² = 616 for radius 14.
        solution: 'Step 1: Full circle = 22/7 × 196 = 616 cm². Step 2: Half of it. Step 3: = 308 cm².'
        mistakes:
          '616': whole_not_half
      - prompt: A quarter circle has a radius of 7 cm. Using π ≈ 22/7, what is its area, in cm²? Decimals are fine.
        answer: '38.5'
        check: 22/7*7**2/4
        difficulty: 1
        hints:
        - It is a quarter of πr².
        - πr² = 154 for radius 7.
        solution: 'Step 1: Full circle = 154 cm². Step 2: A quarter of it. Step 3: 154 ÷ 4 = 38.5 cm².'
        mistakes:
          '154': whole_not_half
          '77': whole_not_half
      - prompt: What is the perimeter of a semicircle of radius 14 cm, including its straight side, in cm? Use π ≈ 22/7.
        answer: '72'
        check: 22/7*14 + 28
        difficulty: 2
        hints:
        - Curved part = πr.
        - Add the diameter, 28 cm.
        solution: 'Step 1: Curve = 22/7 × 14 = 44 cm. Step 2: Straight side = 28 cm. Step 3: 44 + 28 = 72 cm.'
        mistakes:
          '44': forgot_straight_edge
          '116': whole_not_half
      - prompt: A ring has an outer radius of 10 cm and an inner radius of 6 cm. What is its exact area?
        options:
        - 64π cm²
        - 16π cm²
        - 136π cm²
        - 4π cm²
        answer: 64π cm²
        difficulty: 2
        hints:
        - Outer area minus inner area.
        - 100π − 36π.
        solution: 'Step 1: Outer = π × 10² = 100π. Step 2: Inner = π × 6² = 36π. Step 3: 100π − 36π = 64π cm².'
        mistakes:
          16π cm²: subtract_areas
          136π cm²: subtract_areas
      - prompt: A rectangle 14 cm by 10 cm has a semicircle on its 14 cm side, outside it. Using π ≈ 22/7, what is the area of the whole shape, in cm²?
        answer: '217'
        check: 14*10 + 22/7*7**2/2
        difficulty: 3
        hints:
        - Add the rectangle and the semicircle.
        - The semicircle's radius is 7 cm.
        solution: 'Step 1: Rectangle = 140 cm². Step 2: Semicircle = 154 ÷ 2 = 77 cm². Step 3: 140 + 77 = 217 cm².'
        mistakes:
          '294': whole_not_half
      - prompt: Four quarter circles of radius 7 cm are cut from the corners of a 28 cm square. Using π ≈ 22/7, what area is left, in cm²?
        answer: '630'
        check: 28**2 - 22/7*7**2
        difficulty: 3
        hints:
        - Four quarter circles make one whole circle.
        - Square area minus the circle's area.
        solution: 'Step 1: Square = 784 cm². Step 2: Four quarters = one circle of radius 7 = 154 cm². Step 3: 784 − 154 = 630 cm².'
        mistakes:
          '745.5': whole_not_half
