# Class 9 Mathematics, chapter 8. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_root, unit_change.
subject: math
chapter: 8
title: Circle Measures

tips:
  pi_exact: "22/7 and 3.14 are close to π but not equal to it. π is irrational: its decimals go on for ever without repeating."
  pi_constant: "For every circle, big or small, circumference ÷ diameter is the same number, π."
  radius_diameter: "The diameter is twice the radius. Check which one the question gives, and which one the formula needs."
  area_not_perimeter: "That is the area, πr². The perimeter (circumference) is πd, which is 2πr."
  perimeter_not_area: "That is the perimeter, 2πr. The area is πr²: the radius times itself, times π."
  area_scale: "Area depends on r × r, so doubling the radius makes the area 2 × 2 = 4 times as big."
  whole_not_half: "A semicircle is half a circle, so take half of the circle's area or curved length."
  forgot_straight_edge: "The perimeter of a semicircle also includes its straight side, the diameter."
  subtract_areas: "Find the area of the whole shape, then take away the area of the part that is cut out."

concepts:
  - code: math9.circle.pi
    title: "A new number: π"
    notes: |
      For every circle, circumference ÷ diameter is the same number, called π. π ≈ 3.14 ≈ 22/7,
      but π is irrational: its decimal digits never end or repeat (3.14159…). 22/7 = 3.142857… is
      slightly more than π.
    explanations:
      text: "Wrap a thread around any round object, a bangle, a plate or a wheel, and measure it. Divide by the diameter. You always get a little more than 3, about 3.14. This number is the same for every circle, and it is called π (pi). Like √2, π is irrational: 3.14 and 22/7 are only close to it."
      visual: "Roll a wheel along the ground for one full turn and mark where it stops. Now lay its diameter along that path. It fits just over 3 times, with a small piece left over. That 'just over 3' is π."
      step_by_step: "To estimate π with a steel plate: Step 1: Wrap a thread around the edge and measure it, say 66 cm. Step 2: Measure across the middle, say 21 cm. Step 3: 66 ÷ 21 ≈ 3.14. Step 4: Any circle gives about the same answer."
      real_world: "A bicycle wheel with a diameter of 70 cm rolls about 3.14 × 70 ≈ 220 cm in one turn. The number of turns on the cycle's meter, times 220 cm, gives the distance travelled."
    items:
      - prompt: "For any circle, what is circumference ÷ diameter?"
        options: ["π, about 3.14", "2", "It depends on the size of the circle", "π, which is exactly 22/7"]
        answer: "π, about 3.14"
        difficulty: 1
        hints: ["Is it the same for a bangle and a wheel?"]
        solution: "Step 1: For every circle the answer is the same number, π. Step 2: π ≈ 3.14, but it is not exactly 22/7."
        mistakes: {"π, which is exactly 22/7": pi_exact, "It depends on the size of the circle": pi_constant}
      - prompt: "Which statement is true?"
        options: ["π is irrational", "π = 3.14 exactly", "π = 22/7 exactly", "π is a whole number"]
        answer: "π is irrational"
        difficulty: 1
        hints: ["Can π be written exactly as a fraction?"]
        solution: "Step 1: π = 3.14159…, with decimals that never end or repeat. Step 2: So it is irrational; 3.14 and 22/7 are approximations."
        mistakes: {"π = 3.14 exactly": pi_exact, "π = 22/7 exactly": pi_exact}
      - prompt: "Which of these is closest to π?"
        options: ["3.14", "3.41", "3.0", "4.13"]
        answer: "3.14"
        difficulty: 1
        hints: ["π = 3.14159…"]
        solution: "π = 3.14159…, so 3.14 is closest."
      - prompt: "A wheel's circumference is 220 cm and its diameter is 70 cm. What is circumference ÷ diameter, as a fraction in lowest terms? Type it like 2/3."
        answer: "22/7"
        check: "220/70"
        difficulty: 2
        hints: ["220/70, then divide top and bottom by 10."]
        solution: "Step 1: 220/70 = 22/7. Step 2: This is a common approximation of π."
      - prompt: "Using π ≈ 3.14, what is 2π?"
        answer: "6.28"
        check: "2*3.14"
        difficulty: 2
        hints: ["2 × 3.14."]
        solution: "2 × 3.14 = 6.28"
      - prompt: "Which is bigger: π or 22/7?"
        options: ["22/7", "π", "They are equal"]
        answer: "22/7"
        difficulty: 3
        hints: ["22 ÷ 7 = 3.142857…", "π = 3.14159…"]
        solution: "Step 1: 22/7 = 3.1428… Step 2: π = 3.1415… Step 3: So 22/7 is slightly bigger."
        mistakes: {"They are equal": pi_exact}

  - code: math9.circle.circumference
    title: The perimeter of a circle
    after: [math9.circle.pi]
    notes: |
      Circumference (perimeter) = π × diameter = 2πr. Exact answers are written with π (radius 5 gives
      10π); otherwise use π ≈ 22/7 or 3.14 as the question says. Going backwards, d = C ÷ π.
    explanations:
      text: "Since circumference ÷ diameter = π, the circumference is π × diameter. The diameter is twice the radius, so it is also 2πr. A circle of diameter 14 cm has a circumference of 22/7 × 14 = 44 cm."
      visual: "Picture a circle with a line straight across it, the diameter. Now imagine bending three diameters and a bit more around the edge. That's the circumference: π diameters."
      step_by_step: "For a circle of radius 7 cm, with π ≈ 22/7: Step 1: Diameter = 2 × 7 = 14 cm. Step 2: Circumference = π × d = 22/7 × 14. Step 3: = 44 cm."
      real_world: "A bicycle wheel 70 cm across goes 22/7 × 70 = 220 cm in one turn. After 100 turns the bicycle has travelled 22000 cm, which is 220 m."
    items:
      - prompt: "A circle has a diameter of 14 cm. Using π ≈ 22/7, what is its circumference, in cm?"
        answer: "44"
        check: "(22/7)*14"
        difficulty: 1
        hints: ["Circumference = π × diameter."]
        solution: "Step 1: C = π × d. Step 2: = 22/7 × 14. Step 3: = 44 cm."
        mistakes: {"22": radius_diameter, "154": area_not_perimeter}
      - prompt: "A circle has a radius of 7 cm. Using π ≈ 22/7, what is its circumference, in cm?"
        answer: "44"
        check: "2*(22/7)*7"
        difficulty: 1
        hints: ["Circumference = 2πr."]
        solution: "Step 1: C = 2 × 22/7 × 7. Step 2: = 44 cm."
        mistakes: {"22": radius_diameter, "154": area_not_perimeter}
      - prompt: "A circle has a radius of 5 cm. What is its circumference, in cm?"
        options: ["10π", "5π", "25π", "10"]
        answer: "10π"
        check: "2*pi*5"
        difficulty: 1
        hints: ["Circumference = 2πr."]
        solution: "C = 2 × π × 5 = 10π cm"
        mistakes: {"5π": radius_diameter, "25π": area_not_perimeter}
      - prompt: "A wheel has a diameter of 70 cm. How far does it roll in one full turn, in cm? Use π ≈ 22/7."
        answer: "220"
        check: "(22/7)*70"
        difficulty: 2
        hints: ["One turn rolls out the whole circumference."]
        solution: "Step 1: C = 22/7 × 70. Step 2: = 220 cm."
        mistakes: {"110": radius_diameter}
      - prompt: "A circle's circumference is 88 cm. Using π ≈ 22/7, what is its radius, in cm?"
        answer: "14"
        check: "88/(2*22/7)"
        difficulty: 2
        hints: ["2πr = 88.", "r = 88 ÷ (2 × 22/7)."]
        solution: "Step 1: 2 × 22/7 × r = 88. Step 2: 44/7 × r = 88. Step 3: r = 14 cm."
        mistakes: {"28": radius_diameter}
      - prompt: "A wire 44 cm long is bent into a circle. Using π ≈ 22/7, what is the circle's diameter, in cm?"
        answer: "14"
        check: "44/(22/7)"
        difficulty: 3
        hints: ["The wire's length is the circumference.", "d = C ÷ π."]
        solution: "Step 1: π × d = 44. Step 2: d = 44 × 7/22. Step 3: d = 14 cm."
        mistakes: {"7": radius_diameter}
      - prompt: "A bicycle wheel with a diameter of 70 cm turns 100 times. How far does the bicycle go, in metres? Use π ≈ 22/7."
        answer: "220"
        check: "(22/7)*70*100/100"
        difficulty: 3
        hints: ["One turn is 220 cm.", "100 turns, then change cm to m."]
        solution: "Step 1: One turn = 22/7 × 70 = 220 cm. Step 2: 100 turns = 22000 cm. Step 3: = 220 m."
        mistakes: {"22000": unit_change, "110": radius_diameter}

  - code: math9.circle.area
    title: The area of a circle
    after: [math9.circle.circumference]
    notes: |
      Area = πr². Cut a circle into thin slices and arrange them alternately: they make a shape close
      to a rectangle of length πr (half the circumference) and height r. Doubling the radius makes
      the area 4 times as big. From an area, r = √(A ÷ π).
    explanations:
      text: "The area of a circle is π × r × r, written πr². A circle of radius 7 cm has an area of 22/7 × 7 × 7 = 154 cm². Remember: the perimeter uses r once (2πr), the area uses it twice (πr²)."
      visual: "Cut a circle into many thin slices like a pizza. Lay them side by side, points up and down in turn. They make a shape very close to a rectangle: one side is half the circumference, πr, and the other is the radius, r. So the area is πr × r = πr²."
      step_by_step: "For a circle of diameter 20 cm with π ≈ 3.14: Step 1: Radius = 20 ÷ 2 = 10 cm. Step 2: r² = 100. Step 3: Area = 3.14 × 100 = 314 cm²."
      real_world: "A 28 cm pizza (14 cm radius) has an area of 22/7 × 14 × 14 = 616 cm². Cut into 8 equal slices, each slice is 77 cm². Two 20 cm pizzas give less to eat than one 28 cm pizza."
    items:
      - prompt: "A circle has a radius of 7 cm. Using π ≈ 22/7, what is its area, in cm²?"
        answer: "154"
        check: "(22/7)*7^2"
        difficulty: 1
        hints: ["Area = πr².", "22/7 × 7 × 7."]
        solution: "Step 1: Area = 22/7 × 7 × 7. Step 2: = 22 × 7. Step 3: = 154 cm²."
        mistakes: {"44": perimeter_not_area, "616": radius_diameter}
      - prompt: "A circle has a radius of 3 cm. What is its area, in cm²?"
        options: ["9π", "6π", "3π", "9"]
        answer: "9π"
        check: "pi*3^2"
        difficulty: 1
        hints: ["Area = πr² = π × 3 × 3."]
        solution: "Area = π × 3² = 9π cm²"
        mistakes: {"6π": perimeter_not_area}
      - prompt: "A circle has a diameter of 20 cm. Using π ≈ 3.14, what is its area, in cm²?"
        answer: "314"
        check: "3.14*10^2"
        difficulty: 2
        hints: ["Find the radius first: 10 cm."]
        solution: "Step 1: r = 10 cm. Step 2: Area = 3.14 × 100. Step 3: = 314 cm²."
        mistakes: {"1256": radius_diameter, "62.8": perimeter_not_area}
      - prompt: "If the radius of a circle is doubled, how many times as big does its area become?"
        options: ["4", "2", "8", "π"]
        answer: "4"
        check: "(pi*2^2)/(pi*1^2)"
        difficulty: 2
        hints: ["Try radius 1 and radius 2.", "π × 1² = π and π × 2² = 4π."]
        solution: "Step 1: Radius 1 gives area π. Step 2: Radius 2 gives 4π. Step 3: So 4 times as big."
        mistakes: {"2": area_scale}
      - prompt: "A circular garden has an area of 616 m². Using π ≈ 22/7, what is its radius, in metres?"
        answer: "14"
        check: "sqrt(616/(22/7))"
        difficulty: 2
        hints: ["22/7 × r² = 616, so r² = 616 × 7 ÷ 22.", "r² = 196."]
        solution: "Step 1: r² = 616 × 7/22 = 196. Step 2: r = √196 = 14 m."
        mistakes: {"196": forgot_root}
      - prompt: "A circular pizza with a diameter of 28 cm is cut into 8 equal slices. Using π ≈ 22/7, what is the area of one slice, in cm²?"
        answer: "77"
        check: "(22/7)*14^2/8"
        difficulty: 3
        hints: ["Radius = 14 cm.", "Whole pizza = 616 cm²."]
        solution: "Step 1: Area = 22/7 × 14 × 14 = 616 cm². Step 2: One slice = 616 ÷ 8 = 77 cm²."
        mistakes: {"308": radius_diameter, "11": perimeter_not_area}

  - code: math9.circle.shapes
    title: Half circles, rings and other shapes
    after: [math9.circle.area]
    notes: |
      Shapes made from parts of circles: a semicircle has half the area (πr²/2) and a curved edge of
      πr, plus the diameter if the straight side is included. A ring's area is the outer circle's
      area minus the inner one's. Cut-out areas are subtracted; joined pieces are added.
    explanations:
      text: "Many shapes are made from circles. A semicircle is half a circle: its area is πr² ÷ 2. Its perimeter is half the circumference, πr, plus the straight side, 2r. A ring is a big circle with a small one cut out, so its area is the big area minus the small area."
      visual: "Picture a running track: a rectangle in the middle with a half circle stuck on each end. The two half circles together make one whole circle. So one lap is the two straight sides plus one full circumference."
      step_by_step: "A square of side 14 cm with a circle fitting exactly inside it: Step 1: Square area = 14 × 14 = 196 cm². Step 2: The circle's radius is 7 cm, so its area is 154 cm². Step 3: Area outside the circle = 196 − 154 = 42 cm²."
      real_world: "A school track has straight sides of 100 m and semicircular ends 70 m across. One lap is 100 + 100 + 22/7 × 70 = 420 m."
    items:
      - prompt: "What is the area of a semicircle of radius 7 cm, in cm²? Use π ≈ 22/7."
        answer: "77"
        check: "(22/7)*7^2/2"
        difficulty: 1
        hints: ["A full circle of radius 7 is 154 cm²."]
        solution: "Step 1: Full circle = 154 cm². Step 2: Half = 77 cm²."
        mistakes: {"154": whole_not_half}
      - prompt: "A semicircle has radius r. What is its area?"
        options: ["πr²/2", "πr²", "πr", "2πr"]
        answer: "πr²/2"
        check: "pi*r^2/2"
        difficulty: 1
        hints: ["Half of a circle's area."]
        solution: "A circle's area is πr², so half is πr²/2."
        mistakes: {"πr²": whole_not_half, "πr": perimeter_not_area}
      - prompt: "What is the perimeter of a semicircle of radius 7 cm, including its straight side, in cm? Use π ≈ 22/7."
        answer: "36"
        check: "(22/7)*7 + 14"
        difficulty: 2
        hints: ["The curved part is half of 44 cm.", "Add the straight side: the diameter, 14 cm."]
        solution: "Step 1: Curved part = 22/7 × 7 = 22 cm. Step 2: Straight side = 14 cm. Step 3: 22 + 14 = 36 cm."
        mistakes: {"22": forgot_straight_edge, "58": whole_not_half}
      - prompt: "A ring is cut from a circle of radius 7 cm by removing a circle of radius 3.5 cm from the middle. Using π ≈ 22/7, what is the ring's area, in cm²?"
        answer: "115.5"
        check: "(22/7)*(7^2 - 3.5^2)"
        difficulty: 2
        hints: ["Big circle = 154 cm².", "Small circle = 22/7 × 3.5 × 3.5 = 38.5 cm²."]
        solution: "Step 1: Big circle = 154 cm². Step 2: Small circle = 38.5 cm². Step 3: Ring = 154 − 38.5 = 115.5 cm²."
        mistakes: {"38.5": subtract_areas, "192.5": subtract_areas}
      - prompt: "A circle fits exactly inside a square with sides of 14 cm, touching all four sides. Using π ≈ 22/7, what is the area of the square outside the circle, in cm²?"
        answer: "42"
        check: "14^2 - (22/7)*7^2"
        difficulty: 3
        hints: ["The circle's diameter is 14 cm, so its radius is 7 cm.", "Square area − circle area."]
        solution: "Step 1: Square = 196 cm². Step 2: Circle = 154 cm². Step 3: 196 − 154 = 42 cm²."
        mistakes: {"154": subtract_areas, "196": subtract_areas}
      - prompt: "A running track has two straight sides of 100 m and a semicircle at each end. The semicircles are 70 m across. How long is one lap, in metres? Use π ≈ 22/7."
        answer: "420"
        check: "2*100 + (22/7)*70"
        difficulty: 3
        hints: ["The two semicircles together make one full circle of diameter 70 m.", "That circle's circumference is 220 m."]
        solution: "Step 1: Straight sides = 200 m. Step 2: Two semicircles = one circle = 22/7 × 70 = 220 m. Step 3: Lap = 420 m."
        mistakes: {"310": whole_not_half}
