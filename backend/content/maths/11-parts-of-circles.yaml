# Class 9 Mathematics, chapter 11. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_root, added_sides.
subject: math
chapter: 11
title: Parts of Circles

tips:
  half_chord: "The perpendicular from the centre cuts the chord in half. Double the half you found."
  same_side: "On the same side of the centre, subtract the two distances; on opposite sides, add them."
  double_not_half: "The angle at the circle is half the angle at the centre on the same arc, not double."
  missed_right_angle: "The angle standing on a diameter is 90°. Use it with the angle sum of 180°."
  opposite_angles_cyclic: "Opposite angles of a quadrilateral drawn inside a circle add up to 180°."
  arc_not_area: "That is the arc length (part of 2πr). The sector's area is the same part of πr²."
  arc_45: "45° is one eighth of the circle: 44 ÷ 8."
  arc_fraction: "A 90° arc is a quarter of the circumference."
  arc_to_angle: "The arc's share of the circumference is its share of 360°: 11 of 44."
  diameter_longest: "The closer a chord is to the centre, the longer it gets. Which chord goes right through the centre?"
  perpendicular_bisects: "The perpendicular from the centre always cuts a chord exactly in half."
  same_arc_equal: "Angles at the circle on the same arc are equal: both are half the centre angle."
  sector_fraction: "A sector's fraction is its angle over 360: 90/360."

concepts:
  - code: math9.circparts.chords
    title: Chords and the centre
    notes: |
      A chord joins two points on a circle; the diameter is the longest chord. The perpendicular
      from the centre to a chord cuts it in half. So the radius, half the chord and the distance from
      the centre make a right triangle: r² = (half chord)² + d².
    explanations:
      text: "A chord is a straight line joining two points on a circle. Drop a perpendicular from the centre onto the chord: it lands exactly in the middle. The radius to the chord's end, half the chord and that perpendicular make a right triangle. So if the radius is 5 and the chord is 3 from the centre, half the chord is √(25 − 9) = 4, and the chord is 8."
      visual: "Draw a circle with centre O and a chord AB. Draw OM straight down to the chord, meeting it at a right angle at M, and join OA. Triangle OMA is right-angled at M, with OA = radius, OM = distance and AM = half the chord."
      step_by_step: "Radius 13 cm, chord 24 cm. How far is the chord from the centre? Step 1: Half the chord is 12. Step 2: d² = 13² − 12² = 169 − 144 = 25. Step 3: d = 5 cm."
      real_world: "A round table top of radius 50 cm is cut straight along a chord 30 cm from the centre to fit against a wall. The cut edge is 2 × √(50² − 30²) = 2 × 40 = 80 cm long."
    picture:
      kind: geometry
      points:
        O: [5, 5]
        A: [1.8, 2.6]
        B: [8.2, 2.6]
        M: [5, 2.6]
      circles:
      - {centre: O, radius: 4}
      segments:
      - [A, B]
      - [O, M, '2.4']
      - [O, A, '4']
      angles:
      - {at: M, from: O, to: A, label: 90°}
      caption: OM meets the chord at a right angle, so AM = √(4² − 2.4²) = 3.2 and AB = 6.4.
      alt: A circle with centre O, radius 4 and chord AB. OM is 2.4, at right angles to AB, so half the chord is 3.2.
    activity:
      type: formula
      prompt: A chord in a circle of radius 5 cm. Move it closer to or further from the centre.
      inputs:
      - name: d
        label: Distance from centre
        min: 0
        max: 5
        step: 0.5
        start: 0
        unit: cm
      outputs:
      - name: c
        label: Chord length
        expr: 2*sqrt(25-d^2)
        unit: cm
      goals:
      - prompt: Make the chord 8 cm long.
        want:
          c: 8
        hint: 'Half the chord, the distance and the radius make a right triangle: 4² + d² = 5².'
        mistakes:
        - when:
            d: 4
          say: At 4 cm from the centre the chord is 6 cm. Chords get shorter as they move away from the centre.
      - prompt: Which distance gives the longest chord?
        want:
          c: 10
        mistakes:
        - when:
            d:
            - 0.5
            - 5
          say: Moving away from the centre makes the chord shorter. Where would a chord be longest?
    lesson:
      - teach: A chord is a straight line joining two points on a circle. A chord through the centre is a diameter, and it is the longest chord. Chords further from the centre are shorter.
        check:
          prompt: Which is the longest chord of a circle of radius 6 cm?
          options:
          - The diameter, 12 cm
          - Any chord, 6 cm
          - There is no longest chord
          answer: The diameter, 12 cm
          why: The diameter passes through the centre and is twice the radius.
      - teach: 'Draw a line from the centre perpendicular to a chord (meeting it at a right angle). It cuts the chord into two equal halves. Fold a paper circle so a chord lands on itself: the fold goes through the centre and the chord''s middle.'
        check:
          prompt: A chord is 10 cm long. The perpendicular from the centre meets it at M. How long is each half?
          options:
          - 5 cm
          - 10 cm
          - It depends on the radius
          answer: 5 cm
          why: 'The perpendicular from the centre always bisects the chord: 10 ÷ 2 = 5 cm.'
      - teach: 'So the radius, half the chord and the distance from the centre make a right triangle, with the radius as the longest side: r² = (half chord)² + d². Radius 5 and distance 3: half chord = √(25 − 9) = 4, so the chord is 8.'
        picture:
          kind: flow
          steps:
          - Radius r = 5 (longest side)
          - Distance from centre d = 3
          - Half chord = √(5² − 3²) = 4
          - Chord = 2 × 4 = 8
          alt: 'The radius, half the chord and the distance from the centre form a right triangle: 5² = 4² + 3².'
        check:
          prompt: Radius 10 cm, chord 8 cm from the centre. How long is half the chord?
          options:
          - 6 cm
          - 2 cm
          - 12 cm
          answer: 6 cm
          why: √(10² − 8²) = √36 = 6 cm, so the whole chord is 12 cm.
    items:
      - prompt: "The perpendicular from the centre of a circle to a chord:"
        options: ["cuts the chord into two equal parts", "is always as long as the chord", "cuts the chord in the ratio 1 : 2", "never meets the chord"]
        answer: "cuts the chord into two equal parts"
        difficulty: 1
        hints: ["The circle is symmetric about this line."]
        solution: "The circle looks the same on both sides of the perpendicular, so it meets the chord at its middle."
        mistakes: {"cuts the chord in the ratio 1 : 2": "perpendicular_bisects", "is always as long as the chord": "perpendicular_bisects"}
      - prompt: "A chord AB is 8 cm long. The perpendicular from the centre meets it at M. How long is AM, in cm?"
        answer: "4"
        check: "8/2"
        difficulty: 1
        hints: ["M is the middle of AB."]
        solution: "M is the midpoint, so AM = 8 ÷ 2 = 4 cm."
        mistakes: {"8": "half_chord", "16": "half_chord"}
      - prompt: "A circle has a radius of 5 cm. A chord is 3 cm from the centre. How long is the chord, in cm?"
        answer: "8"
        check: "2*sqrt(5**2 - 3**2)"
        difficulty: 1
        hints: ["Half the chord² = 5² − 3².", "Then double it."]
        solution: "Step 1: Half the chord = √(25 − 9) = 4 cm. Step 2: The chord is 8 cm."
        mistakes: {"4": half_chord, "16": forgot_root}
      - prompt: "Which chord of a circle is the longest?"
        options: ["The diameter", "A chord near the edge", "All chords are the same length", "A chord 1 cm from the centre"]
        answer: "The diameter"
        difficulty: 2
        hints: ["The closer a chord is to the centre, the longer it is."]
        solution: "Step 1: Half the chord = √(r² − d²) gets bigger as d gets smaller. Step 2: It is biggest when d = 0, through the centre: the diameter."
        mistakes: {"A chord near the edge": "diameter_longest", "All chords are the same length": "diameter_longest"}
      - prompt: "A circle has a radius of 13 cm and a chord 24 cm long. How far is the chord from the centre, in cm?"
        answer: "5"
        check: "sqrt(13**2 - 12**2)"
        difficulty: 2
        hints: ["Use half the chord: 12 cm.", "d² = 13² − 12²."]
        solution: "Step 1: d² = 169 − 144 = 25. Step 2: d = 5 cm."
        mistakes: {"25": forgot_root}
      - prompt: "A chord 6 cm long is 4 cm from the centre of a circle. What is the radius, in cm?"
        answer: "5"
        check: "sqrt(3**2 + 4**2)"
        difficulty: 2
        hints: ["Half the chord is 3 cm.", "r² = 3² + 4²."]
        solution: "Step 1: r² = 9 + 16 = 25. Step 2: r = 5 cm."
        mistakes: {"7": added_sides, "25": forgot_root}
      - prompt: "Two parallel chords of a circle of radius 10 cm are 12 cm and 16 cm long, on the same side of the centre. How far apart are they, in cm?"
        answer: "2"
        check: "sqrt(10**2 - 6**2) - sqrt(10**2 - 8**2)"
        difficulty: 3
        hints: ["The 12 cm chord is √(100 − 36) = 8 cm from the centre.", "The 16 cm chord is √(100 − 64) = 6 cm from the centre."]
        solution: "Step 1: Distances: 8 cm and 6 cm. Step 2: Same side, so subtract: 2 cm."
        mistakes: {"14": same_side}
      - prompt: "A circle has a radius of 10 cm. A chord is 6 cm from the centre. How long is the chord, in cm?"
        answer: "16"
        check: "2*sqrt(10**2 - 6**2)"
        difficulty: 2
        hints: ["Radius, half the chord and the distance make a right triangle.", "Half chord = √(100 − 36)."]
        solution: "Step 1: Half chord = √(100 − 36) = 8 cm. Step 2: Chord = 16 cm."
        mistakes: {"8": half_chord, "4": forgot_root}
      - prompt: "Two parallel chords of lengths 10 cm and 24 cm are on opposite sides of the centre of a circle of radius 13 cm. How far apart are they, in cm?"
        answer: "17"
        check: "sqrt(13**2 - 5**2) + sqrt(13**2 - 12**2)"
        difficulty: 3
        hints: ["Find each chord's distance from the centre.", "On opposite sides, add the distances."]
        solution: "Step 1: 10 cm chord: √(169 − 25) = 12 cm from the centre. Step 2: 24 cm chord: √(169 − 144) = 5 cm. Step 3: Opposite sides: 12 + 5 = 17 cm."
        mistakes: {"7": same_side, "14": forgot_root}
      - prompt: "A chord 16 cm long is 6 cm from the centre of a circle. How long is the diameter, in cm?"
        answer: "20"
        check: "2*sqrt(8**2 + 6**2)"
        difficulty: 3
        hints: ["Half the chord is 8 cm.", "Radius = √(8² + 6²)."]
        solution: "Step 1: Radius = √(64 + 36) = 10 cm. Step 2: Diameter = 20 cm."
        mistakes: {"10": radius_diameter, "14": added_sides}
      - prompt: A chord PQ is 14 cm long. The perpendicular from the centre meets it at N. How long is NQ, in cm?
        answer: '7'
        check: 14/2
        difficulty: 1
        hints:
        - The perpendicular from the centre cuts the chord in half.
        - Half of 14.
        solution: 'Step 1: The perpendicular bisects PQ. Step 2: NQ = PQ ÷ 2. Step 3: = 7 cm.'
        mistakes:
          '14': perpendicular_bisects
          '28': double_not_half
      - prompt: A circle has a radius of 13 cm. A chord is 5 cm from the centre. How long is the chord, in cm?
        answer: '24'
        check: 2*sqrt(13**2 - 5**2)
        difficulty: 1
        hints:
        - Half chord² = r² − d².
        - 169 − 25 = 144.
        solution: 'Step 1: Half chord² = 13² − 5² = 144. Step 2: Half chord = 12 cm. Step 3: Chord = 24 cm.'
        mistakes:
          '12': half_chord
      - prompt: A chord 24 cm long is 9 cm from the centre of a circle. What is the radius, in cm?
        answer: '15'
        check: sqrt(12**2 + 9**2)
        difficulty: 2
        hints:
        - Half the chord is 12 cm.
        - r² = 12² + 9².
        solution: 'Step 1: Half chord = 12. Step 2: r² = 144 + 81 = 225. Step 3: r = 15 cm.'
        mistakes:
          '25': half_chord
          '30': double_not_half
      - prompt: A circle has a radius of 17 cm and a chord 30 cm long. How far is the chord from the centre, in cm?
        answer: '8'
        check: sqrt(17**2 - 15**2)
        difficulty: 2
        hints:
        - Half the chord is 15 cm.
        - d² = 17² − 15².
        solution: 'Step 1: Half chord = 15. Step 2: d² = 289 − 225 = 64. Step 3: d = 8 cm.'
        mistakes:
          '16': double_not_half
      - prompt: 'In a circle of radius 5 cm, which chord is closer to the centre: a 6 cm chord or an 8 cm chord?'
        options:
        - The 8 cm chord
        - The 6 cm chord
        - They are the same distance
        answer: The 8 cm chord
        difficulty: 3
        hints:
        - 'Work out each distance: d² = r² − (half chord)².'
        - Longer chords are nearer the centre.
        solution: 'Step 1: 6 cm chord: d = √(25 − 9) = 4 cm. Step 2: 8 cm chord: d = √(25 − 16) = 3 cm. Step 3: So the 8 cm chord is closer.'
        mistakes:
          The 6 cm chord: diameter_longest
      - prompt: Two parallel chords of a circle of radius 5 cm are 6 cm and 8 cm long, on opposite sides of the centre. How far apart are they, in cm?
        answer: '7'
        check: sqrt(25 - 9) + sqrt(25 - 16)
        difficulty: 3
        hints:
        - Find each chord's distance from the centre.
        - On opposite sides, add the distances.
        solution: 'Step 1: 6 cm chord is 4 cm from the centre. Step 2: 8 cm chord is 3 cm from the centre. Step 3: Opposite sides: 4 + 3 = 7 cm.'
        mistakes:
          '1': same_side

  - code: math9.circparts.angles
    title: Angles in circles
    after: [math9.circparts.chords]
    notes: |
      The angle an arc makes at the centre is twice the angle it makes at any point on the rest of
      the circle. So angles on the same arc are equal, and an angle standing on a diameter (angle in
      a semicircle) is 90°. Opposite angles of a quadrilateral with all corners on a circle add to 180°.
    explanations:
      text: "Take an arc of a circle. The angle it makes at the centre is twice the angle it makes at any point on the rest of the circle. If the centre angle is 80°, every angle on the circle standing on that arc is 40°. A diameter makes 180° at the centre, so the angle on the circle is 90°: the angle in a semicircle is a right angle."
      visual: "Draw a diameter AB and pick any point C on the circle. Join CA and CB. However you move C around the circle, the corner at C stays a perfect right angle."
      step_by_step: "AB is a diameter, C is on the circle, and angle CAB = 30°. Step 1: Angle ACB = 90° (angle in a semicircle). Step 2: Angles of triangle ABC add to 180°. Step 3: Angle CBA = 180 − 90 − 30 = 60°."
      real_world: "A carpenter checks if a semicircular arch is truly round by putting a set square's corner on the arch with its edges touching the two ends of the base. If the arch is a true semicircle, the corner fits at every point."
    picture:
      kind: geometry
      points:
        O: [5, 5]
        A: [1, 5]
        B: [9, 5]
        C: [6.6, 8.67]
      circles:
      - {centre: O, radius: 4}
      segments:
      - [A, B]
      - [C, A]
      - [C, B]
      angles:
      - {at: C, from: A, to: B, label: 90°}
      caption: AB is a diameter, so the angle at C is always 90°, wherever C is on the circle.
      alt: A circle with diameter AB and a point C on the circle. The angle ACB is a right angle.
    activity:
      type: angle
      prompt: Angles in circles. Turn the arm to the angle asked.
      goals:
      - prompt: The angle in a semicircle is always this.
        degrees: 90
        mistakes:
        - when:
            degrees: 180
          say: '180° is the angle at the centre on a diameter: a straight line. The angle at the circle on the same arc is half of it.'
      - prompt: An angle at the circle is 35°. The angle at the centre on the same arc is double. Make it.
        degrees: 70
        mistakes:
        - when:
            degrees: 35
          say: 35° is the angle at the circle itself. The angle at the centre on the same arc is twice as big.
        - when:
            degrees:
            - 15
            - 20
          say: 'That''s about half of 35°. The angle at the centre is the bigger one: double, not half.'
      - prompt: Opposite angles of a cyclic quadrilateral add to 180°. One is 110°; make the other.
        degrees: 70
        mistakes:
        - when:
            degrees: 110
          say: 110° is the angle you were given. Opposite angles are only equal when both are 90°.
        - when:
            degrees: 250
          say: That's 360° − 110°, angles round a point. Opposite angles of a cyclic quadrilateral add to 180°, not 360°.
    lesson:
      - teach: Take an arc of a circle. The angle it makes at the centre is twice the angle it makes at any point on the rest of the circle. If arc AB makes 80° at the centre O, then from any point C on the rest of the circle, angle ACB = 40°.
        check:
          prompt: An arc makes 120° at the centre. What angle does it make at the circle?
          options:
          - 60°
          - 240°
          - 120°
          answer: 60°
          why: 'The angle at the circle is half the angle at the centre: 120 ÷ 2 = 60.'
      - teach: 'Two results follow. Angles on the same arc, from points on the same side, are all equal (each is half the same centre angle). And a diameter makes 180° at the centre, so any angle standing on a diameter is 90°: the angle in a semicircle is a right angle.'
        check:
          prompt: AB is a diameter and C is on the circle. What is angle ACB?
          options:
          - 90°
          - 180°
          - 60°
          answer: 90°
          why: The diameter's centre angle is 180°, and half of it is 90°.
      - teach: A quadrilateral with all four corners on a circle is called cyclic. Its opposite angles add up to 180°. If one angle is 110°, the angle opposite it is 70°.
        check:
          prompt: A cyclic quadrilateral has an angle of 95°. What is the opposite angle?
          options:
          - 85°
          - 95°
          - 265°
          answer: 85°
          why: 'Opposite angles add to 180°: 180 − 95 = 85.'
    items:
      - prompt: "An arc makes an angle of 80° at the centre. What angle does it make at a point on the rest of the circle, in degrees?"
        answer: "40"
        check: "80/2"
        difficulty: 1
        hints: ["The angle at the circle is half the angle at the centre."]
        solution: "80 ÷ 2 = 40°"
        mistakes: {"160": double_not_half}
      - prompt: "What is the angle in a semicircle, in degrees?"
        answer: "90"
        check: "180/2"
        difficulty: 1
        hints: ["A diameter makes 180° at the centre."]
        solution: "Step 1: The diameter's angle at the centre is 180°. Step 2: Half of that is 90°."
        mistakes: {"180": "semicircle_right", "45": "semicircle_right"}
      - prompt: "An angle at the circle, standing on an arc, is 35°. What angle does the same arc make at the centre, in degrees?"
        answer: "70"
        check: "2*35"
        difficulty: 2
        hints: ["The centre angle is double."]
        solution: "2 × 35 = 70°"
        mistakes: {"17.5": double_not_half}
      - prompt: "AB is a diameter of a circle and C is a point on the circle. Angle CAB = 30°. What is angle CBA, in degrees?"
        answer: "60"
        check: "180 - 90 - 30"
        difficulty: 2
        hints: ["Angle ACB = 90°."]
        solution: "Step 1: Angle ACB = 90°. Step 2: 180 − 90 − 30 = 60°."
        mistakes: {"150": missed_right_angle}
      - prompt: "Two different points on a circle each make an angle with the same arc. Which is true?"
        options: ["The two angles are equal", "The point nearer the arc makes a bigger angle", "The angles add up to 180°", "The angles add up to 90°"]
        answer: "The two angles are equal"
        difficulty: 3
        hints: ["Each is half of the same centre angle."]
        solution: "Both angles are half of the arc's angle at the centre, so they are equal."
        mistakes: {"The point nearer the arc makes a bigger angle": "same_arc_equal", "The angles add up to 180°": "same_arc_equal"}
      - prompt: "A quadrilateral has all four corners on a circle. One of its angles is 110°. What is the opposite angle, in degrees?"
        answer: "70"
        check: "180 - 110"
        difficulty: 3
        hints: ["Opposite angles of such a quadrilateral add up to 180°."]
        solution: "180 − 110 = 70°"
        mistakes: {"110": opposite_angles_cyclic, "250": opposite_angles_cyclic}
      - prompt: "In a circle with centre O, A, B and C are on the circle and angle AOB = 130°. C is on the larger arc. What is angle ACB, in degrees?"
        answer: "65"
        check: "130/2"
        difficulty: 2
        hints: ["The angle at the centre is twice the angle at the circle.", "Halve 130."]
        solution: "Step 1: Angle ACB stands on the same arc as angle AOB. Step 2: ACB = 130 ÷ 2 = 65°."
        mistakes: {"260": double_not_half, "115": opposite_angles_cyclic}
      - prompt: "ABCD has all four corners on a circle. Angle A = 3 × angle C. What is angle C, in degrees?"
        answer: "45"
        check: "180/4"
        difficulty: 3
        hints: ["Opposite angles of such a quadrilateral add to 180°.", "3C + C = 180."]
        solution: "Step 1: A + C = 180°. Step 2: 4C = 180, so C = 45° (and A = 135°)."
        mistakes: {"135": swapped_unknowns, "90": opposite_angles_cyclic}
      - prompt: "AB is a diameter and C is on the circle. AC = 6 cm and BC = 8 cm. What is the radius, in cm?"
        answer: "5"
        check: "sqrt(6**2 + 8**2)/2"
        difficulty: 3
        hints: ["The angle at C is 90° because AB is a diameter.", "AB = √(6² + 8²)."]
        solution: "Step 1: Angle ACB = 90°. Step 2: AB = √(36 + 64) = 10 cm. Step 3: Radius = 5 cm."
        mistakes: {"10": radius_diameter, "7": added_sides}
      - prompt: An arc makes an angle of 100° at the centre. What angle does it make at a point on the rest of the circle, in degrees?
        answer: '50'
        check: 100/2
        difficulty: 1
        hints:
        - The angle at the circle is half the centre angle.
        - Half of 100.
        solution: 'Step 1: Angle at circle = centre angle ÷ 2. Step 2: 100 ÷ 2. Step 3: = 50°.'
        mistakes:
          '200': double_not_half
      - prompt: An angle at the circle, standing on an arc, is 42°. What angle does the same arc make at the centre, in degrees?
        answer: '84'
        check: 42*2
        difficulty: 1
        hints:
        - The centre angle is twice the angle at the circle.
        - 2 × 42.
        solution: 'Step 1: Centre angle = 2 × angle at circle. Step 2: 2 × 42. Step 3: = 84°.'
        mistakes:
          '21': double_not_half
      - prompt: AB is a diameter of a circle and C is on the circle. Angle CAB = 25°. What is angle CBA, in degrees?
        answer: '65'
        check: 180 - 90 - 25
        difficulty: 2
        hints:
        - Angle ACB stands on a diameter.
        - Angle ACB = 90°, and the angles of triangle ABC add to 180°.
        solution: 'Step 1: Angle ACB = 90°. Step 2: 180 − 90 − 25. Step 3: = 65°.'
        mistakes:
          '155': missed_right_angle
      - prompt: A, B, C and D are on a circle, and C and D are on the same side of AB. Angle ACB = 38°. What is angle ADB, in degrees?
        answer: '38'
        check: '38'
        difficulty: 2
        hints:
        - Both angles stand on the same arc AB.
        - Angles on the same arc are equal.
        solution: 'Step 1: Angles ACB and ADB stand on arc AB. Step 2: Angles on the same arc are equal. Step 3: So angle ADB = 38°.'
        mistakes:
          '76': same_arc_equal
          '142': opposite_angles_cyclic
      - prompt: PQRS is a cyclic quadrilateral. Angle P = 2 × angle R. What is angle P, in degrees?
        answer: '120'
        check: 180*2/3
        difficulty: 3
        hints:
        - P and R are opposite, so P + R = 180°.
        - 2R + R = 180.
        solution: 'Step 1: P + R = 180°. Step 2: 3R = 180, so R = 60°. Step 3: P = 120°.'
        mistakes:
          '60': opposite_angles_cyclic
      - prompt: AB is a diameter of a circle and C is on the circle. AC = 5 cm and BC = 12 cm. What is the diameter, in cm?
        answer: '13'
        check: sqrt(5**2 + 12**2)
        difficulty: 3
        hints:
        - Angle ACB is a right angle.
        - AB² = AC² + BC².
        solution: 'Step 1: Angle ACB = 90°, since AB is a diameter. Step 2: AB² = 25 + 144 = 169. Step 3: AB = 13 cm.'
        mistakes:
          '6.5': half_chord
          '17': missed_right_angle

  - code: math9.circparts.arcs_sectors
    title: Arcs and sectors
    after: [math9.circparts.angles]
    notes: |
      An arc with centre angle θ is θ/360 of the circle, so its length is θ/360 × 2πr. A sector (a
      slice bounded by two radii and an arc) has area θ/360 × πr². A 90° sector is a quarter of the
      circle.
    explanations:
      text: "A sector is a slice of a circle, like a slice of pizza. Its angle at the centre tells you what fraction of the circle it is: 90° is 90/360 = 1/4 of the circle. So its arc is 1/4 of the circumference and its area is 1/4 of the circle's area."
      visual: "Picture a clock face. From 12 to 3 the minute hand sweeps a quarter of the circle, 90°. The crust from 12 to 3 is a quarter of the rim (the arc), and the slice is a quarter of the face (the sector)."
      step_by_step: "Radius 14 cm, sector angle 90°, π ≈ 22/7: Step 1: Fraction = 90/360 = 1/4. Step 2: Circle area = 22/7 × 14 × 14 = 616 cm². Step 3: Sector area = 616 ÷ 4 = 154 cm²."
      real_world: "A pendulum 21 cm long swings through 60°. Its tip travels 60/360 = 1/6 of a full circle of radius 21 cm: 1/6 × 2 × 22/7 × 21 = 22 cm."
    activity:
      type: formula
      prompt: A sector of a circle with radius 7 cm and angle θ.
      inputs:
      - name: a
        label: Angle θ
        min: 10
        max: 360
        step: 10
        start: 90
        unit: °
      outputs:
      - name: arc
        label: Arc length
        expr: 2*pi*7*a/360
        unit: cm
        places: 1
      - name: area
        label: Sector area
        expr: pi*49*a/360
        unit: cm²
        places: 1
      goals:
      - prompt: Make the sector area about 77 cm² (76.5 to 77.5).
        want:
          area:
          - 76.5
          - 77.5
        mistakes:
        - when:
            a: 360
          say: 'That''s the whole circle: its area is about 154 cm². 77 is a part of it.'
      - prompt: Make the arc about 11 cm (10.9 to 11.1).
        want:
          arc:
          - 10.9
          - 11.1
        mistakes:
        - when:
            a: 360
          say: That's the whole circumference, about 44 cm. 11 cm is a part of it.
    lesson:
      - teach: A whole turn is 360°. An arc whose angle at the centre is 90° is 90/360 = 1/4 of the circle. An arc of 60° is 60/360 = 1/6 of it. So an arc's length is (θ/360) × 2πr.
        check:
          prompt: What fraction of the circle is an arc of 120°?
          options:
          - 1/3
          - 1/4
          - 1/2
          answer: 1/3
          why: 120/360 = 1/3.
      - teach: 'A sector is a slice of the circle between two radii, like a slice of pizza. Its area is the same fraction of the whole area: (θ/360) × πr². A 90° sector of a circle of radius 14 cm is 1/4 × 616 = 154 cm².'
        check:
          prompt: A circle has an area of 300 cm². What is the area of a 60° sector?
          options:
          - 50 cm²
          - 60 cm²
          - 100 cm²
          answer: 50 cm²
          why: 60/360 = 1/6, and 300 ÷ 6 = 50.
      - teach: 'Watch which formula you need: arc length uses 2πr (a distance around), sector area uses πr² (a space inside). And you can go backwards: if an arc is 1/4 of the circumference, its angle is 90°.'
        check:
          prompt: An arc is half of the circle's circumference. What is its angle at the centre?
          options:
          - 180°
          - 90°
          - 360°
          answer: 180°
          why: Half of 360° is 180°.
    items:
      - prompt: "What fraction of a circle is a sector with a 90° angle? Type a fraction like 1/2."
        answer: "1/4"
        check: "90/360"
        difficulty: 1
        hints: ["A full turn is 360°."]
        solution: "90/360 = 1/4"
        mistakes: {"1/2": "sector_fraction", "1/90": "sector_fraction"}
      - prompt: "A circle has a circumference of 44 cm. How long is the arc of a 90° sector, in cm?"
        answer: "11"
        check: "44*90/360"
        difficulty: 1
        hints: ["90° is a quarter of the circle."]
        solution: "44 ÷ 4 = 11 cm"
        mistakes: {"22": "arc_fraction", "176": "arc_fraction"}
      - prompt: "A circle has a radius of 7 cm. Using π ≈ 22/7, what is the length of an arc with a 45° angle at the centre, in cm?"
        answer: "5.5"
        check: "(45/360)*2*(22/7)*7"
        difficulty: 2
        hints: ["The circumference is 44 cm.", "45° is 1/8 of the circle."]
        solution: "Step 1: Circumference = 44 cm. Step 2: 44 ÷ 8 = 5.5 cm."
        mistakes: {"11": "arc_45", "2.75": "radius_diameter"}
      - prompt: "A circle has a radius of 14 cm. Using π ≈ 22/7, what is the area of a 90° sector, in cm²?"
        answer: "154"
        check: "(90/360)*(22/7)*14**2"
        difficulty: 2
        hints: ["Circle area = 616 cm².", "A quarter of it."]
        solution: "Step 1: Circle area = 22/7 × 196 = 616 cm². Step 2: 616 ÷ 4 = 154 cm²."
        mistakes: {"22": arc_not_area, "616": arc_not_area}
      - prompt: "A sector of a circle of radius r has a 60° angle. What is its area?"
        options: ["πr²/6", "πr²/3", "2πr/6", "πr/6"]
        answer: "πr²/6"
        check: "pi*r**2*60/360"
        difficulty: 2
        hints: ["60/360 = 1/6 of the circle's area."]
        solution: "Area = 60/360 × πr² = πr²/6"
        mistakes: {"2πr/6": arc_not_area, "πr²/3": arc_not_area}
      - prompt: "A pendulum 21 cm long swings through an angle of 60°. How long is the arc its tip travels, in cm? Use π ≈ 22/7."
        answer: "22"
        check: "(60/360)*2*(22/7)*21"
        difficulty: 3
        hints: ["Full circle: 2 × 22/7 × 21 = 132 cm.", "60° is a sixth."]
        solution: "Step 1: Circumference = 132 cm. Step 2: 132 ÷ 6 = 22 cm."
        mistakes: {"231": arc_not_area}
      - prompt: "A sector of a circle with a radius of 7 cm has an arc 11 cm long. What is its angle, in degrees? Use π ≈ 22/7."
        answer: "90"
        check: "360*11/(2*(22/7)*7)"
        difficulty: 3
        hints: ["The circumference is 44 cm.", "11 is what fraction of 44?"]
        solution: "Step 1: 11/44 = 1/4. Step 2: 1/4 × 360 = 90°."
        mistakes: {"45": "arc_to_angle", "180": "arc_to_angle"}
      - prompt: "A circle has a radius of 21 cm. Using π ≈ 22/7, what is the length of an arc with a 120° angle at the centre, in cm?"
        answer: "44"
        check: "120/360*2*22/7*21"
        difficulty: 2
        hints: ["120° is 1/3 of the circle.", "Circumference = 2 × 22/7 × 21 = 132."]
        solution: "Step 1: Circumference = 132 cm. Step 2: Arc = 132 ÷ 3 = 44 cm."
        mistakes: {"462": arc_not_area, "22": radius_diameter}
      - prompt: "A sector of a circle of radius 7 cm has an area of 77 cm². Using π ≈ 22/7, what is its angle, in degrees?"
        answer: "180"
        check: "77/(22/7*49)*360"
        difficulty: 3
        hints: ["The full circle's area is 22/7 × 49 = 154.", "What fraction of 154 is 77?"]
        solution: "Step 1: Full area = 154 cm². Step 2: 77 is half, so the angle is 180°."
        mistakes: {"90": sector_fraction, "77": arc_to_angle}
      - prompt: "The minute hand of a clock is 14 cm long. Using π ≈ 22/7, what area does it sweep in 15 minutes, in cm²?"
        answer: "154"
        check: "22/7*14**2/4"
        difficulty: 3
        hints: ["15 minutes is a quarter of an hour.", "Area swept = a quarter of a circle of radius 14."]
        solution: "Step 1: Full circle = 22/7 × 196 = 616 cm². Step 2: A quarter = 154 cm²."
        mistakes: {"22": arc_not_area, "616": sector_fraction}
      - prompt: What fraction of a circle is a sector with a 45° angle? Type a fraction like 1/2.
        answer: 1/8
        check: 45/360
        difficulty: 1
        hints:
        - A whole turn is 360°.
        - 45/360, simplified.
        solution: 'Step 1: Fraction = 45/360. Step 2: Divide top and bottom by 45. Step 3: = 1/8.'
        mistakes:
          1/4: arc_45
      - prompt: A circle has a circumference of 60 cm. How long is the arc of a 120° sector, in cm?
        answer: '20'
        check: 60*120/360
        difficulty: 1
        hints:
        - 120° is what fraction of 360°?
        - 1/3 of 60.
        solution: 'Step 1: 120/360 = 1/3. Step 2: 1/3 of 60. Step 3: = 20 cm.'
        mistakes:
          '120': arc_fraction
      - prompt: A circle has a radius of 21 cm. Using π ≈ 22/7, what is the length of an arc with a 60° angle at the centre, in cm?
        answer: '22'
        check: 60/360*2*22/7*21
        difficulty: 2
        hints:
        - Full circumference = 2 × 22/7 × 21 = 132 cm.
        - 60° is 1/6 of the circle.
        solution: 'Step 1: Circumference = 132 cm. Step 2: 60/360 = 1/6. Step 3: 132 ÷ 6 = 22 cm.'
        mistakes:
          '231': arc_not_area
      - prompt: A circle has a radius of 7 cm. Using π ≈ 22/7, what is the area of a 120° sector, in cm²? Give your answer to two decimal places.
        answer: '51.33'
        check: round(120/360*22/7*49, 2)
        difficulty: 2
        hints:
        - Full area = 154 cm².
        - 120° is 1/3 of the circle.
        solution: 'Step 1: Area of circle = 22/7 × 49 = 154 cm². Step 2: 120/360 = 1/3. Step 3: 154 ÷ 3 ≈ 51.33 cm².'
        mistakes:
          '14.67': arc_not_area
      - prompt: A sector of a circle of radius 14 cm has an arc 22 cm long. What is its angle, in degrees? Use π ≈ 22/7.
        answer: '90'
        check: 22/(2*22/7*14)*360
        difficulty: 3
        hints:
        - The full circumference is 88 cm.
        - 22 is what fraction of 88?
        solution: 'Step 1: Circumference = 2 × 22/7 × 14 = 88 cm. Step 2: 22/88 = 1/4. Step 3: 1/4 of 360° = 90°.'
        mistakes:
          '22': arc_to_angle
      - prompt: The minute hand of a clock is 21 cm long. Using π ≈ 22/7, how far does its tip travel in 20 minutes, in cm?
        answer: '44'
        check: 20/60*2*22/7*21
        difficulty: 3
        hints:
        - In 60 minutes the tip goes once round.
        - 20 minutes is 1/3 of the way round.
        solution: 'Step 1: Full circle = 2 × 22/7 × 21 = 132 cm. Step 2: 20 minutes = 1/3 of a turn. Step 3: 132 ÷ 3 = 44 cm.'
        mistakes:
          '462': arc_not_area
