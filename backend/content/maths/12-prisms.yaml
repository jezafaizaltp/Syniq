# Class 9 Mathematics, chapter 12. Format: content/README.md.
# Also uses tips from earlier chapters: half_base_height, perimeter_not_area.
subject: math
chapter: 12
title: Prisms

tips:
  sloped_depth: "The depth changes along the pool. Look at the pool from the side: what shape is that end, and how do you find its area?"
  melt_recast: "Melting keeps the volume the same. Put both volumes in the same unit before dividing: 1 m = 100 cm, so 1 m³ = 100 × 100 × 100 cm³."
  level_rise: "The water that flows in spreads over the whole floor of the tank. Rise = volume ÷ floor area, with litres changed to m³ first."
  open_faces: "List the faces that are actually painted. A floor that is not painted is left out."
  added_dimensions: "Volume multiplies the three measurements: length × width × height. Adding them doesn't give a volume."
  area_not_volume: "That is the area of one face. Volume needs all three measurements: for a cube, edge × edge × edge."
  litres: "1 litre = 1000 cm³, so divide the volume in cm³ by 1000."
  volume_not_area: "That is the volume. Surface area adds up the areas of all the faces."
  one_face: "That is one face. A cube has 6 equal faces, so multiply by 6."
  opposite_faces: "Each face has an equal face opposite it. Add the three different faces, then double."
  no_lid: "A box without a lid has no top face, so leave it out."
  both_ends: "A prism has two equal ends, so count the end shape twice."
  scale_volume: "Volume uses three lengths (length × width × height). If each one is multiplied by k, the volume is multiplied by k × k × k."
  scale_area: "Area uses two lengths. If every edge is multiplied by k, each face's area is multiplied by k × k."
  depth_from_volume: "Depth = volume ÷ base area. Find the base area first."
  end_area_given: "The area of the end is already given, so don't halve it again. Multiply it by the length."
  prism_faces: "Count the faces of a triangular prism: the two triangle ends, plus one flat side for every edge of the triangle."
  prism_volume: "Prism volume = area of the end × length. Multiply, don't add."

concepts:
  - code: math9.prism.volume
    title: Volume of a prism
    notes: |
      A prism has two equal, parallel ends joined by rectangles. Its volume is the area of an end
      (the base) times its length (height). Cuboid: l × w × h; cube: a³; triangular prism:
      ½ × base × height of the triangle × length; a cylinder works the same way: πr² × h.
      1 litre = 1000 cm³ and 1 m³ = 1000 litres.
    explanations:
      text: "A prism is a solid with the same shape all the way through, like a stack of identical slices. Its volume is the area of one slice (the base) times how tall the stack is. A cuboid 5 cm by 4 cm by 3 cm has a 20 cm² base and a height of 3 cm, so its volume is 60 cm³."
      visual: "Picture a stack of 3 layers of 1 cm cubes, each layer 5 cubes by 4 cubes. Each layer has 20 cubes, so the stack has 60. That is the volume: 60 cm³."
      step_by_step: "For a triangular prism whose end is a right triangle with sides 3 cm and 4 cm, and length 10 cm: Step 1: End area = ½ × 3 × 4 = 6 cm². Step 2: Volume = 6 × 10 = 60 cm³."
      real_world: "A fish tank 50 cm × 40 cm × 30 cm holds 60000 cm³. Since 1 litre is 1000 cm³, it holds 60 litres of water."
    activity:
      type: formula
      prompt: 'A rectangular prism: volume = length × breadth × height.'
      inputs:
      - name: l
        label: Length
        min: 1
        max: 10
        step: 1
        start: 1
        unit: cm
      - name: b
        label: Breadth
        min: 1
        max: 10
        step: 1
        start: 1
        unit: cm
      - name: h
        label: Height
        min: 1
        max: 10
        step: 1
        start: 1
        unit: cm
      outputs:
      - name: v
        label: Volume
        expr: l*b*h
        unit: cm³
      goals:
      - prompt: Make a prism with volume 60 cm³ and height 5 cm.
        want:
          v: 60
          h: 5
        mistakes:
        - when:
            v: 60
          say: The volume is 60 cm³, but the height must be 5 cm.
    items:
      - prompt: "A cuboid is 5 cm long, 4 cm wide and 3 cm high. What is its volume, in cm³?"
        answer: "60"
        check: "5*4*3"
        difficulty: 1
        hints: ["Volume = length × width × height."]
        solution: "5 × 4 × 3 = 60 cm³"
        mistakes: {"12": added_dimensions}
      - prompt: "A cube has edges of 4 cm. What is its volume, in cm³?"
        answer: "64"
        check: "4**3"
        difficulty: 1
        hints: ["4 × 4 × 4."]
        solution: "4 × 4 × 4 = 64 cm³"
        mistakes: {"16": area_not_volume, "12": added_dimensions}
      - prompt: "A prism has a triangular end with an area of 12 cm², and it is 10 cm long. What is its volume, in cm³?"
        answer: "120"
        check: "12*10"
        difficulty: 2
        hints: ["Volume = end area × length."]
        solution: "12 × 10 = 120 cm³"
        mistakes: {"22": "prism_volume", "60": "end_area_given"}
      - prompt: "A triangular prism's end is a right triangle with shorter sides of 3 cm and 4 cm. The prism is 10 cm long. What is its volume, in cm³?"
        answer: "60"
        check: "(3*4/2)*10"
        difficulty: 2
        hints: ["The end's area is ½ × 3 × 4."]
        solution: "Step 1: End area = 6 cm². Step 2: Volume = 6 × 10 = 60 cm³."
        mistakes: {"120": half_base_height}
      - prompt: "A cylindrical tank has a radius of 7 m and a height of 10 m. Using π ≈ 22/7, what is its volume, in m³?"
        answer: "1540"
        check: "(22/7)*7**2*10"
        difficulty: 2
        hints: ["The base is a circle: πr² = 154 m²."]
        solution: "Step 1: Base area = 22/7 × 49 = 154 m². Step 2: Volume = 154 × 10 = 1540 m³."
        mistakes: {"440": perimeter_not_area}
      - prompt: "A cuboid tank is 2 m long and 1.5 m wide, and holds 6 m³ of water when full. How deep is it, in m?"
        answer: "2"
        check: "6/(2*1.5)"
        difficulty: 3
        hints: ["Base area = 2 × 1.5 = 3 m².", "Depth = volume ÷ base area."]
        solution: "Step 1: Base area = 3 m². Step 2: Depth = 6 ÷ 3 = 2 m."
        mistakes: {"18": "depth_from_volume", "1.5": "depth_from_volume"}
      - prompt: "A fish tank is 50 cm long, 40 cm wide and 30 cm high. How many litres does it hold when full? (1 litre = 1000 cm³)"
        answer: "60"
        check: "50*40*30/1000"
        difficulty: 3
        hints: ["Volume = 60000 cm³.", "Divide by 1000."]
        solution: "Step 1: 50 × 40 × 30 = 60000 cm³. Step 2: 60000 ÷ 1000 = 60 litres."
        mistakes: {"60000": litres}
      - prompt: "A swimming pool is 20 m long and 10 m wide. It is 1 m deep at the shallow end and 3 m deep at the deep end, sloping evenly. How many m³ of water does it hold when full?"
        answer: "400"
        check: "(1+3)/2*20*10"
        difficulty: 3
        hints: ["Seen from the side, the pool is a trapezium.", "Area of the side = average depth × length; then multiply by the width."]
        solution: "Step 1: The side is a trapezium of area (1 + 3) ÷ 2 × 20 = 40 m². Step 2: The pool is a prism 10 m wide: 40 × 10 = 400 m³."
        mistakes: {"600": sloped_depth, "200": sloped_depth}
      - prompt: "A 1 m³ block of iron is melted and made into small cubes with 10 cm edges. How many small cubes are made?"
        answer: "1000"
        check: "100**3/10**3"
        difficulty: 3
        hints: ["The total volume does not change.", "Write 1 m³ in cm³ first."]
        solution: "Step 1: 1 m³ = 100 × 100 × 100 = 1,000,000 cm³. Step 2: One small cube is 10³ = 1000 cm³. Step 3: 1,000,000 ÷ 1000 = 1000 cubes."
        mistakes: {"10": melt_recast, "100": melt_recast}
      - prompt: "Water flows into a cuboid tank with a floor 4 m long and 3 m wide at 2,400 litres a minute. By how many cm does the water level rise each minute?"
        answer: "20"
        check: "2400/1000/(4*3)*100"
        difficulty: 3
        hints: ["2,400 litres is how many m³?", "Rise = volume ÷ floor area."]
        solution: "Step 1: 2,400 litres = 2.4 m³. Step 2: Floor area = 12 m². Step 3: Rise = 2.4 ÷ 12 = 0.2 m = 20 cm."
        mistakes: {"200": level_rise, "0.2": level_rise}

  - code: math9.prism.surface
    title: Surface area of a prism
    after: [math9.prism.volume]
    notes: |
      Surface area is the total area of all faces. A cube has 6 equal faces: 6a². A cuboid has
      three pairs: 2(lw + lh + wh). A prism's side faces together make a rectangle of perimeter of
      the end × length; add both ends. A cylinder's curved surface is 2πr × h.
    explanations:
      text: "To find how much cardboard a box needs, add the areas of all its faces. A cuboid 5 by 4 by 3 has three different faces: 5 × 4 = 20, 5 × 3 = 15 and 4 × 3 = 12. Each appears twice, so the total is 2 × (20 + 15 + 12) = 94 cm²."
      visual: "Cut open a cardboard box along its edges and lay it flat. You see a cross shape made of six rectangles: a top and bottom, a front and back, and two sides. The surface area is the area of this flat net."
      step_by_step: "A triangular prism with a 3-4-5 right triangle at each end, 10 cm long: Step 1: Two ends: 2 × ½ × 3 × 4 = 12 cm². Step 2: Three side rectangles: (3 + 4 + 5) × 10 = 120 cm². Step 3: Total = 132 cm²."
      real_world: "To paint a cylindrical water tank of radius 7 m and height 10 m on the outside (sides only), the painter covers 2 × 22/7 × 7 × 10 = 440 m²."
    activity:
      type: formula
      prompt: Surface area = 2(lb + bh + hl).
      inputs:
      - name: l
        label: Length
        min: 1
        max: 10
        step: 1
        start: 1
        unit: cm
      - name: b
        label: Breadth
        min: 1
        max: 10
        step: 1
        start: 1
        unit: cm
      - name: h
        label: Height
        min: 1
        max: 10
        step: 1
        start: 1
        unit: cm
      outputs:
      - name: v
        label: Volume
        expr: l*b*h
        unit: cm³
      - name: s
        label: Surface area
        expr: 2*(l*b+b*h+h*l)
        unit: cm²
      goals:
      - prompt: Make volume 60 cm³ with surface area 94 cm².
        want:
          v: 60
          s: 94
        mistakes:
        - when:
            v: 60
          say: 'The volume is right, but the surface isn''t 94 cm². Boxes with the same volume can have different surfaces: try another shape.'
      - prompt: Same volume, 60 cm³, but surface area 104 cm².
        want:
          v: 60
          s: 104
        mistakes:
        - when:
            v: 60
          say: The volume is right, but the surface isn't 104 cm². Flatter, longer boxes have more surface.
    items:
      - prompt: "How many faces does a triangular prism have?"
        options: ["5", "6", "3", "9"]
        answer: "5"
        check: "2 + 3"
        difficulty: 1
        hints: ["Two triangle ends, and one rectangle for each side of the triangle."]
        solution: "2 triangular ends + 3 rectangles = 5 faces"
        mistakes: {"6": "prism_faces", "3": "prism_faces", "9": "prism_faces"}
      - prompt: "A cube has edges of 3 cm. What is its total surface area, in cm²?"
        answer: "54"
        check: "6*3**2"
        difficulty: 1
        hints: ["One face is 3 × 3 = 9 cm².", "A cube has 6 faces."]
        solution: "Step 1: One face = 9 cm². Step 2: 6 × 9 = 54 cm²."
        mistakes: {"27": volume_not_area, "9": one_face}
      - prompt: "A cuboid is 5 cm long, 4 cm wide and 3 cm high. What is its total surface area, in cm²?"
        answer: "94"
        check: "2*(5*4 + 5*3 + 4*3)"
        difficulty: 1
        hints: ["The three different faces are 20, 15 and 12 cm².", "Each appears twice."]
        solution: "Step 1: 20 + 15 + 12 = 47. Step 2: × 2 = 94 cm²."
        mistakes: {"47": opposite_faces, "60": volume_not_area}
      - prompt: "A box without a lid is 10 cm long, 8 cm wide and 5 cm high. How much cardboard does it need, in cm²?"
        answer: "260"
        check: "2*(10*8 + 10*5 + 8*5) - 10*8"
        difficulty: 2
        hints: ["Find the whole surface, then take off the top (10 × 8)."]
        solution: "Step 1: Whole surface = 2 × (80 + 50 + 40) = 340 cm². Step 2: Without the top: 340 − 80 = 260 cm²."
        mistakes: {"340": no_lid, "400": volume_not_area}
      - prompt: "A cylinder has a radius of 7 cm and a height of 10 cm. Using π ≈ 22/7, what is the area of its curved surface, in cm²?"
        answer: "440"
        check: "2*(22/7)*7*10"
        difficulty: 2
        hints: ["Unrolled, the curved surface is a rectangle: circumference × height."]
        solution: "Step 1: Circumference = 44 cm. Step 2: 44 × 10 = 440 cm²."
        mistakes: {"1540": volume_not_area}
      - prompt: "A triangular prism's ends are right triangles with sides 3 cm, 4 cm and 5 cm, and the prism is 10 cm long. What is its total surface area, in cm²?"
        answer: "132"
        check: "2*(3*4/2) + (3 + 4 + 5)*10"
        difficulty: 3
        hints: ["Each end is ½ × 3 × 4 = 6 cm².", "The side rectangles together are (3 + 4 + 5) × 10."]
        solution: "Step 1: Ends: 2 × 6 = 12 cm². Step 2: Sides: 12 × 10 = 120 cm². Step 3: Total = 132 cm²."
        mistakes: {"126": both_ends, "60": volume_not_area}
      - prompt: "A cube has a total surface area of 150 cm². What is its volume, in cm³?"
        answer: "125"
        check: "(150/6)**(3/2)"
        difficulty: 3
        hints: ["Six equal faces share the 150 cm².", "From one face's area, find the edge."]
        solution: "Step 1: One face = 150 ÷ 6 = 25 cm². Step 2: Edge = √25 = 5 cm. Step 3: Volume = 5³ = 125 cm³."
        mistakes: {"25": one_face, "15625": one_face}
      - prompt: "A room is 5 m long, 4 m wide and 3 m high. The four walls and the ceiling are painted, but not the floor. How many m² are painted?"
        answer: "74"
        check: "2*(5*3 + 4*3) + 5*4"
        difficulty: 2
        hints: ["Walls: two of 5 × 3 and two of 4 × 3.", "Add the ceiling once."]
        solution: "Step 1: Walls = 2 × 15 + 2 × 12 = 54 m². Step 2: Ceiling = 20 m². Step 3: Painted = 74 m²."
        mistakes: {"94": open_faces, "54": open_faces, "60": volume_not_area}
      - prompt: "A closed cylinder has a radius of 7 cm and a height of 10 cm. Using π ≈ 22/7, what is its total surface area, in cm²?"
        answer: "748"
        check: "2*22/7*7*10 + 2*22/7*7**2"
        difficulty: 3
        hints: ["Curved surface = 2πrh.", "Both circular ends count too."]
        solution: "Step 1: Curved surface = 2 × 22/7 × 7 × 10 = 440 cm². Step 2: Each end = 22/7 × 49 = 154 cm²; two ends = 308 cm². Step 3: Total = 748 cm²."
        mistakes: {"594": both_ends, "440": both_ends, "1540": volume_not_area}

  - code: math9.prism.scaling
    title: Bigger and smaller prisms
    after: [math9.prism.surface]
    notes: |
      If every length of a solid is multiplied by k, its surface area is multiplied by k² and its
      volume by k³. Doubling the edge of a cube makes the area 4 times and the volume 8 times as big.
      From a cube's volume, the edge is the cube root.
    explanations:
      text: "Make a cube twice as wide, twice as deep and twice as tall. Each face is now 2 × 2 = 4 times as big, so the surface area is 4 times as big. The volume is 2 × 2 × 2 = 8 times as big. Lengths, areas and volumes grow at different speeds."
      visual: "Build a 2 cm cube from 1 cm cubes. You need 8 small cubes, not 2. Each face of the big cube shows 4 small squares, not 2."
      step_by_step: "A cube has a volume of 64 cm³. What is its surface area? Step 1: Edge × edge × edge = 64, so the edge is 4 cm. Step 2: One face = 16 cm². Step 3: Six faces = 96 cm²."
      real_world: "A mango box twice as big in every direction holds 8 times as many mangoes but needs only 4 times as much cardboard. That is why big boxes are cheaper per mango."
    activity:
      type: formula
      prompt: A 2 × 3 × 4 cm prism, enlarged by a scale factor k.
      inputs:
      - name: k
        label: Scale factor
        min: 1
        max: 4
        step: 0.5
        start: 1
      outputs:
      - name: v
        label: Volume
        expr: 24*k^3
        unit: cm³
      - name: s
        label: Surface area
        expr: 52*k^2
        unit: cm²
      goals:
      - prompt: Make the volume 192 cm³. How many times bigger did the surface get?
        want:
          v: 192
        mistakes:
        - when:
            k: 4
          say: 'k = 4 makes each side 4 times longer, and the volume 64 times bigger: 1,536 cm³.'
        - when:
            k: 3
          say: 'k = 3 makes the volume 27 times bigger: 648 cm³.'
      - prompt: Now make the surface area 468 cm². How many times bigger is the volume?
        want:
          s: 468
        mistakes:
        - when:
            k: 2
          say: 'k = 2 makes the surface 4 times bigger: 208 cm².'
    items:
      - prompt: "If every edge of a cube is doubled, how many times as big does its volume become?"
        answer: "8"
        check: "2**3"
        difficulty: 1
        hints: ["Volume uses three lengths.", "2 × 2 × 2."]
        solution: "2 × 2 × 2 = 8 times"
        mistakes: {"2": scale_volume, "4": scale_volume}
      - prompt: "How many 1 cm cubes fit inside a cube with 5 cm edges?"
        answer: "125"
        check: "5**3"
        difficulty: 1
        hints: ["5 layers of 5 × 5 cubes."]
        solution: "Step 1: One layer has 5 × 5 = 25 cubes. Step 2: 5 layers: 125 cubes."
        mistakes: {"25": area_not_volume, "15": added_dimensions}
      - prompt: "If every edge of a cube is doubled, how many times as big does its surface area become?"
        answer: "4"
        check: "2**2"
        difficulty: 2
        hints: ["Area uses two lengths."]
        solution: "Each face is 2 × 2 = 4 times as big, so the whole surface is 4 times as big."
        mistakes: {"8": scale_area, "2": scale_area}
      - prompt: "A cuboid has a volume of 10 cm³. Its length, width and height are all tripled. What is the new volume, in cm³?"
        answer: "270"
        check: "10*3**3"
        difficulty: 3
        hints: ["Volume is multiplied by 3 × 3 × 3."]
        solution: "Step 1: 3 × 3 × 3 = 27. Step 2: 10 × 27 = 270 cm³."
        mistakes: {"30": scale_volume, "90": scale_volume}
      - prompt: "A cube has a volume of 64 cm³. What is its total surface area, in cm²?"
        answer: "96"
        check: "6*(64**(1/3))**2"
        difficulty: 3
        hints: ["Which number times itself three times gives 64?", "The edge is 4 cm."]
        solution: "Step 1: 4 × 4 × 4 = 64, so the edge is 4 cm. Step 2: One face = 16 cm². Step 3: 6 × 16 = 96 cm²."
        mistakes: {"16": one_face, "64": volume_not_area}
      - prompt: "Every edge of a cube is made 1.5 times as long. How many times as big does its volume become?"
        answer: "3.375"
        check: "1.5**3"
        difficulty: 3
        hints: ["Volume uses three lengths.", "Multiply 1.5 by itself three times."]
        solution: "Step 1: Volume scales by k³. Step 2: 1.5³ = 3.375."
        mistakes: {"1.5": scale_volume, "2.25": scale_area, "4.5": scale_volume}
      - prompt: "Two cubes have volumes of 27 cm³ and 125 cm³. What is the ratio of their surface areas?"
        options: ["9 : 25", "3 : 5", "27 : 125", "6 : 10"]
        answer: "9 : 25"
        difficulty: 3
        hints: ["Find each edge from the volume first.", "Areas go with the square of the edges."]
        solution: "Step 1: Edges are 3 cm and 5 cm. Step 2: Surface areas are 6 × 9 and 6 × 25, so the ratio is 9 : 25."
        mistakes: {"3 : 5": scale_area, "27 : 125": scale_area, "6 : 10": scale_area}
      - prompt: "A model of a hall is made at a scale of 1 : 50. The model holds 2 litres of air. How many litres of air does the real hall hold?"
        answer: "250000"
        check: "2*50**3"
        difficulty: 3
        hints: ["Every length is 50 times as long.", "Volume grows by 50 × 50 × 50."]
        solution: "Step 1: Volume scale = 50³ = 125,000. Step 2: 2 × 125,000 = 250,000 litres."
        mistakes: {"100": scale_volume, "5000": scale_area}
