# Class 9 Mathematics, chapter 9. Format: content/README.md.
# Also uses tips from earlier chapters: pi_exact, perfect_square_root, half_not_root, sign_slip.
subject: math
chapter: 9
title: Real Numbers

tips:
  irrational_product: "Not always: √2 × √2 = 2, which is rational."
  irrational_sum: "Not always: √2 + (−√2) = 0, which is rational."
  non_repeating: "A decimal is rational only if one fixed block of digits repeats for ever. Here the gaps keep growing, so nothing repeats."
  distance_subtract: "The distance between two numbers is the bigger one minus the smaller one."
  negative_distance: "A distance is never negative. Take the bigger number minus the smaller, or drop the minus sign."
  midpoint_half_distance: "Halfway between a and b is (a + b) ÷ 2. Half the distance tells you how far the middle is from each end, not where it is."
  other_side: "There are two numbers at that distance, one on each side. Check which one the question asks for."
  between_root2: "√2 ≈ 1.414. The number must be bigger than 1 and smaller than 1.414."
  decimal_compare: "Write them all as decimals: 1.700, 1.732, 1.750."
  diagonal_swing: "The diagonal of a unit square is √2 ≈ 1.41; swinging it keeps that length."
  furthest_right: "Further right means bigger. √5 ≈ 2.24 is bigger than 2."
  root_of_square: "√16 = 4, a whole number, so it is rational. The other roots never end or repeat."
  whole_between_roots: "Find the first whole number above the smaller root and the last one below the bigger root, then count them, both ends included. For example, between √5 and √20 lie 3 and 4: two numbers."

concepts:
  - code: math9.real.kinds
    title: Rational and irrational numbers
    notes: |
      Rational numbers can be written as fractions (whole numbers, ending decimals and recurring
      decimals). Irrational numbers cannot: √2, √3, π, and decimals that never end or repeat.
      Together they make the real numbers. A rational plus an irrational is irrational, but two
      irrationals can add or multiply to a rational (√2 × √2 = 2).
    explanations:
      text: "Every number on the number line is a real number. Some can be written as a fraction: 3, −5, 0.75 = 3/4 and 0.333… = 1/3. These are rational. Others can't, like √2, √5 and π. These are irrational: their decimals go on for ever without a repeating block. Rational and irrational numbers together are the real numbers."
      visual: "Picture two baskets. Into the 'rational' basket go 3, −1/2, 0.75 and 0.333…. Into the 'irrational' basket go √2, √3 and π. Every point on the number line belongs in exactly one basket."
      step_by_step: "Is 0.1010010001… rational? Step 1: Look for a block of digits that repeats for ever. Step 2: The number of 0s between the 1s keeps growing. Step 3: So no block repeats. Step 4: It is irrational."
      real_world: "A tailor measures cloth in fractions of a metre, which are rational. But the diagonal of a 1 m square tablecloth is √2 m, an irrational length. Both are real lengths you can cut."
    activity:
      type: sort
      prompt: Rational (a fraction of whole numbers) or irrational?
      bins:
      - Rational
      - Irrational
      items:
      - label: 3/4
        bin: Rational
        clue: Is it already a fraction of two whole numbers?
        why: '3/4 is a fraction of whole numbers: rational.'
      - label: √2
        bin: Irrational
        clue: Can any fraction, squared, give exactly 2?
        why: 'No fraction squares to exactly 2; its decimal never ends or repeats: irrational.'
      - label: 0.333…
        bin: Rational
        why: '0.333… = 1/3: rational.'
        clue: 'A repeating decimal: can you write it as a fraction?'
      - label: π
        bin: Irrational
        clue: Does π's decimal ever end or repeat? (22/7 is only close.)
        why: 'π = 3.14159… never ends or repeats; 22/7 is just near it: irrational.'
      - label: √9
        bin: Rational
        why: '√9 = 3 = 3/1: rational. Not every square root is irrational.'
        clue: Work out √9 first.
      - label: '1.5'
        bin: Rational
        clue: Can you write 1.5 as a fraction?
        why: '1.5 = 3/2: rational.'
      - label: √5
        bin: Irrational
        clue: Is 5 a perfect square?
        why: 5 is not a perfect square, so √5 is irrational.
      - label: −7
        bin: Rational
        clue: Can you write −7 as a fraction?
        why: '−7 = −7/1: every whole number is rational.'
    lesson:
      - teach: 'A rational number is one that can be written as a fraction of whole numbers: 5 = 5/1, 0.25 = 1/4, −3 = −3/1, and recurring decimals like 0.333… = 1/3. Their decimals either end or repeat.'
        check:
          prompt: Which of these is rational?
          options:
          - '0.75'
          - √3
          - π
          answer: '0.75'
          why: 0.75 = 3/4, a fraction. √3 and π can't be written as fractions.
        ways:
        - style: step_by_step
          teach: 'Step 1: try to write the number as one whole number over another. Step 2: whole numbers work: 5 = 5/1. Step 3: decimals that end work: 0.25 = 25/100 = 1/4. Step 4: decimals that repeat work too: 0.333… = 1/3. If it can be done, the number is rational.'
      - teach: 'An irrational number can''t be written as a fraction. Its decimals go on for ever without repeating: √2 = 1.41421…, π = 3.14159… Rational and irrational numbers together make up the real numbers.'
        check:
          prompt: 0.1234567891011… (counting on for ever) never repeats. What kind of number is it?
          options:
          - Irrational
          - Rational
          answer: Irrational
          why: Its decimals never end and never settle into a repeating block.
        ways:
        - style: real_world
          teach: Some decimals are like a clock pattern that repeats, 0.272727…; others are like the digits of π, never settling into any pattern. The repeating kind can be turned into a fraction. The never-repeating kind can't, and those numbers are called irrational. Both kinds together are the real numbers.
      - teach: 'Mixing them: a rational plus an irrational is always irrational (1 + √2). But two irrationals can give a rational: √2 × √2 = 2, and √3 + (−√3) = 0. Simplify before deciding.'
        check:
          prompt: What kind of number is √5 × √20?
          options:
          - 'Rational: it is 10'
          - Irrational
          - It can't be worked out
          answer: 'Rational: it is 10'
          why: √5 × √20 = √100 = 10, a whole number.
        ways:
        - style: step_by_step
          teach: 'Step 1: before deciding, do the sum. Step 2: multiply or add the roots if you can: √5 × √20 = √100. Step 3: simplify: √100 = 10. Step 4: now decide. 10 is a whole number, so it is rational even though it started as roots.'
    items:
      - prompt: "Which of these numbers is irrational?"
        options: ["√5", "0.75", "−3", "22/7"]
        answer: "√5"
        difficulty: 1
        hints: ["Which one can't be written as a fraction?"]
        solution: "Step 1: 0.75 = 3/4, −3 = −3/1 and 22/7 is already a fraction. Step 2: √5 can't be written as a fraction."
        mistakes: {"22/7": pi_exact}
      - prompt: "Which of these numbers is rational?"
        options: ["√16", "√2", "π", "√3"]
        answer: "√16"
        difficulty: 1
        hints: ["Work out √16."]
        solution: "Step 1: √16 = 4 = 4/1, a fraction. Step 2: √2, π and √3 are irrational."
        mistakes: {"√2": "root_of_square", "π": "pi_exact"}
      - prompt: "What kind of number is √2 + (−√2)?"
        options: ["0, a rational number", "An irrational number", "2√2", "Not a real number"]
        answer: "0, a rational number"
        difficulty: 2
        hints: ["A number plus its negative is 0."]
        solution: "Step 1: √2 + (−√2) = 0. Step 2: 0 is rational."
        mistakes: {"An irrational number": irrational_sum}
      - prompt: "Which statement is always true?"
        options: ["A rational number plus an irrational number is irrational", "Two irrational numbers add up to an irrational number", "Two irrational numbers multiply to an irrational number", "Every square root is irrational"]
        answer: "A rational number plus an irrational number is irrational"
        difficulty: 2
        hints: ["Test each with √2.", "√2 × √2 = ?"]
        solution: "Step 1: √2 × √2 = 2 and √2 + (−√2) = 0 are rational, so the second and third can fail. Step 2: √4 = 2, so not every root is irrational. Step 3: 1 + √2 can never be a fraction, so the first is always true."
        mistakes: {"Two irrational numbers add up to an irrational number": irrational_sum, "Two irrational numbers multiply to an irrational number": irrational_product, "Every square root is irrational": perfect_square_root}
      - prompt: "Which of these is a rational number between 1 and √2?"
        options: ["1.2", "1.5", "√3", "1.42"]
        answer: "1.2"
        difficulty: 2
        hints: ["√2 ≈ 1.414."]
        solution: "Step 1: √2 ≈ 1.414. Step 2: 1.5 and 1.42 are bigger than that, and √3 is irrational. Step 3: 1.2 = 6/5 lies between 1 and 1.414."
        mistakes: {"1.5": "between_root2", "1.42": "between_root2", "√3": "between_root2"}
      - prompt: "How many whole numbers are there between √10 and √50?"
        answer: "4"
        check: "floor(sqrt(50)) - ceiling(sqrt(10)) + 1"
        difficulty: 3
        hints: ["√10 is a bit more than 3, and √50 a bit more than 7."]
        solution: "Step 1: 3² = 9 < 10 < 16 = 4², so √10 is between 3 and 4. Step 2: 7² = 49 < 50, so √50 is just over 7. Step 3: The whole numbers between are 4, 5, 6 and 7: four of them."
        mistakes: {"40": "whole_between_roots", "3": "whole_between_roots", "5": "whole_between_roots"}
      - prompt: "The decimal 0.1010010001… has one more 0 before each new 1. Is it rational or irrational?"
        options: ["Irrational: it never ends and never repeats", "Rational: it is a decimal", "Rational: the 1s repeat", "It can't be decided"]
        answer: "Irrational: it never ends and never repeats"
        difficulty: 3
        hints: ["Is there one block of digits that repeats for ever?"]
        solution: "Step 1: The gaps between the 1s keep growing. Step 2: So no fixed block repeats. Step 3: It is irrational."
        mistakes: {"Rational: the 1s repeat": non_repeating, "Rational: it is a decimal": non_repeating}
      - prompt: "Which of √12, √0.25, 0.333… and 22/7 is irrational?"
        options: ["√12", "√0.25", "0.333…", "22/7"]
        answer: "√12"
        difficulty: 2
        hints: ["Is the number under the root a perfect square?", "√0.25 = 0.5, a fraction."]
        solution: "Step 1: √0.25 = 0.5, 0.333… = 1/3 and 22/7 are fractions. Step 2: 12 is not a perfect square, so √12 = 2√3 is irrational."
        mistakes: {"22/7": pi_exact, "√0.25": perfect_square_root}
      - prompt: "What kind of number is √3 × √12?"
        options: ["Rational: it is 6", "Irrational, because both are roots", "Irrational: it is √15", "Rational: it is 36"]
        answer: "Rational: it is 6"
        difficulty: 3
        hints: ["Multiply under one root.", "√36 = ?"]
        solution: "Step 1: √3 × √12 = √36. Step 2: √36 = 6, which is rational."
        mistakes: {"Irrational, because both are roots": irrational_product, "Irrational: it is √15": added_under_root}
      - prompt: "How many whole numbers are there between √20 and √90?"
        answer: "5"
        check: "9 - 5 + 1"
        difficulty: 3
        hints: ["√20 is between 4 and 5; √90 is between 9 and 10.", "Count 5, 6, 7, 8, 9."]
        solution: "Step 1: 4² = 16 < 20 < 25 = 5², so √20 is between 4 and 5. Step 2: 9² = 81 < 90 < 100, so √90 is between 9 and 10. Step 3: The whole numbers between are 5, 6, 7, 8, 9: five of them."
        mistakes: {"70": whole_between_roots, "6": whole_between_roots}
      - prompt: Which one of these cannot be written as a fraction?
        options:
        - √11
        - √36
        - '0.5'
        - −7
        answer: √11
        difficulty: 1
        hints:
        - Check which square roots come out exactly.
        - √36 = 6. Is 11 a perfect square?
        solution: 'Step 1: √36 = 6, 0.5 = 1/2 and −7 = −7/1 are rational. Step 2: 11 is not a perfect square. Step 3: So √11 is irrational.'
        mistakes:
          √36: root_of_square
      - prompt: Which of these is a rational number?
        options:
        - √49
        - √8
        - π
        - √2 + 1
        answer: √49
        difficulty: 1
        hints:
        - A square root of a perfect square is a whole number.
        - 49 = 7 × 7.
        solution: 'Step 1: √49 = 7 = 7/1. Step 2: √8 and π are irrational. Step 3: √2 + 1 is rational plus irrational, so irrational.'
        mistakes:
          √2 + 1: irrational_sum
      - prompt: What kind of number is 3 + √7?
        options:
        - Irrational
        - Rational
        - A whole number
        answer: Irrational
        difficulty: 2
        hints:
        - Is √7 rational?
        - A rational plus an irrational is…?
        solution: 'Step 1: 3 is rational. Step 2: √7 is irrational. Step 3: Their sum is irrational.'
        mistakes:
          Rational: irrational_sum
      - prompt: What kind of number is √8 ÷ √2?
        options:
        - 'Rational: it is 2'
        - 'Irrational: it is √4'
        - 'Irrational: it has roots in it'
        answer: 'Rational: it is 2'
        difficulty: 2
        hints:
        - √a ÷ √b = √(a ÷ b).
        - 8 ÷ 2 = 4.
        solution: 'Step 1: √8 ÷ √2 = √4. Step 2: √4 = 2. Step 3: 2 is rational.'
        mistakes:
          'Irrational: it has roots in it': irrational_product
          'Irrational: it is √4': root_of_square
      - prompt: How many whole numbers are there between √5 and √30?
        answer: '3'
        check: 5 - 2
        difficulty: 3
        hints:
        - √5 is between 2 and 3, and √30 between 5 and 6.
        - Count the whole numbers from 3 to 5.
        solution: 'Step 1: √5 ≈ 2.24 and √30 ≈ 5.48. Step 2: The whole numbers between are 3, 4, 5. Step 3: That is 3 numbers.'
        mistakes:
          '25': whole_between_roots
          '4': whole_between_roots
      - prompt: Which of these is a rational number between √2 and √3?
        options:
        - '1.5'
        - √2.5
        - '1.4'
        - '1.8'
        answer: '1.5'
        difficulty: 3
        hints:
        - √2 ≈ 1.414 and √3 ≈ 1.732.
        - Which decimal sits between them, and is rational?
        solution: 'Step 1: √2 ≈ 1.414 and √3 ≈ 1.732. Step 2: 1.5 is between them and equals 3/2. Step 3: √2.5 is between them but irrational; 1.4 and 1.8 are outside.'
        mistakes:
          '1.4': between_root2
          √2.5: non_repeating

  - code: math9.real.number_line
    title: Real numbers on the number line
    after: [math9.real.kinds]
    notes: |
      Every real number is a point on the number line and every point is a real number. √2 can be
      marked by swinging the diagonal of a unit square onto the line with a compass. To order or
      place irrational numbers, use approximations (√2 ≈ 1.414, √3 ≈ 1.732) or squares.
    explanations:
      text: "The number line has room for every real number. To mark √2, draw a square of side 1 on the line from 0 to 1. Its diagonal is √2 long. Put a compass on 0, open it to the diagonal's end, and swing it down onto the line: it lands at √2, about 1.41. To compare numbers like √3 and 1.7, use decimals: √3 ≈ 1.732, so it is to the right of 1.7."
      visual: "Picture the number line with a small square standing on it between 0 and 1. A curved arrow swings the square's diagonal down onto the line, landing a little before 1.5. That point is √2."
      step_by_step: "To place √7: Step 1: Find squares around 7: 4 and 9. Step 2: So √7 is between √4 = 2 and √9 = 3. Step 3: 2.6² = 6.76 and 2.7² = 7.29. Step 4: So √7 is between 2.6 and 2.7, about 2.65."
      real_world: "A road map shows towns as points along a highway. A milestone can be at any real distance, like 10√2 km from a junction, not just at whole or fractional kilometres."
    picture:
      kind: number_line
      from: -1
      to: 3
      step: 0.5
      points:
      - {at: 1.41421, label: √2}
      jumps:
      - {from: 0, to: 1.41421, label: diagonal of the unit square}
      caption: The diagonal of a 1 by 1 square is √2. Swing it down onto the line from 0 to find √2.
      alt: A number line where the diagonal of a unit square, of length root 2, is swung down from 0 to land just after 1.4.
    activity:
      type: number_line
      min: -3
      max: 3
      step: 0.5
      start: 0
      denominator: 2
      prompt: Every real number has a place on the line. The marks are halves.
      goals:
      - prompt: Put the marker on 5/2.
        target: 2.5
        mistakes:
        - when:
            v: 2
          say: 2 is 4 halves. 5/2 is 5 halves.
        - when:
            v: 3
          say: 3 is 6 halves. 5/2 is 5 halves.
      - prompt: Put it on −3/2.
        target: -1.5
        mistakes:
        - when:
            v: 1.5
          say: That's +3/2. The minus sign puts it on the other side of 0.
      - prompt: √2 is about 1.41. Put the marker on the half mark nearest to it.
        target: 1.5
        mistakes:
        - when:
            v: 1
          say: √2 ≈ 1.41, which is more than 1.25, the point halfway between 1 and 1.5.
        - when:
            v: 2
          say: '2 is too far: √2 × √2 = 2, so √2 itself is much less than 2.'
    lesson:
      - teach: Every real number has a place on the number line, rational or irrational, and every point on the line is a real number. There are no gaps.
        check:
          prompt: Is there a point on the number line for √3?
          options:
          - Yes, every real number has a point
          - No, only fractions have points
          answer: Yes, every real number has a point
          why: The number line has a point for every real number, including irrationals like √3.
        ways:
        - style: real_world
          teach: Picture a measuring tape that is perfectly smooth, with no missing points. Fractions have their marks, and so do numbers like √3 and π, even though no ruler mark lands exactly on them. Every point on the tape is some real number, and every real number has its point.
      - teach: We can mark √2 exactly. Draw a square of side 1 on the line from 0 to 1. Its diagonal is √2. Put the compass point at 0, open it to the diagonal's top corner, and swing an arc down to the line. It lands at √2, about 1.41.
        picture:
          kind: flow
          steps:
          - Square of side 1 from 0 to 1
          - Diagonal = √2
          - Compass at 0, swing the diagonal down
          - It lands at √2 ≈ 1.41
          alt: Marking √2 on the number line by swinging the diagonal of a unit square down from 0.
        check:
          prompt: To mark √5 the same way, which right triangle do you draw from 0?
          options:
          - Shorter sides 1 and 2
          - Shorter sides 1 and 1
          - Shorter sides 2 and 3
          answer: Shorter sides 1 and 2
          why: 1² + 2² = 5, so its longest side is √5.
        ways:
        - style: step_by_step
          teach: 'Step 1: on the number line, draw a right triangle from 0 with base 1 along the line and height 1 straight up. Step 2: its slanted side is √(1² + 1²) = √2. Step 3: put the compass point on 0 and open it to the top of the slanted side. Step 4: swing it down to the line. The arc lands at √2.'
      - teach: 'To order numbers with roots, use decimals or compare squares. √3 ≈ 1.732 lies between 1.7 and 7/4 = 1.75. Negative numbers flip the order: −√5 ≈ −2.24 is to the left of −2.'
        check:
          prompt: 'Which is further right on the number line: √10 or 3?'
          options:
          - √10
          - '3'
          answer: √10
          why: 3 = √9, and √10 > √9.
        ways:
        - style: step_by_step
          teach: 'Step 1: to compare √10 and 3, square both: 10 and 9. Step 2: the bigger square belongs to the bigger number. Step 3: the bigger number sits further right. For negatives, the order flips: the bigger root is further left.'
    items:
      - prompt: "Between which two whole numbers is √7 on the number line?"
        options: ["2 and 3", "3 and 4", "6 and 7", "1 and 2"]
        answer: "2 and 3"
        difficulty: 1
        hints: ["2² = 4 and 3² = 9."]
        solution: "Step 1: 4 < 7 < 9. Step 2: So √7 is between 2 and 3."
        mistakes: {"6 and 7": half_not_root}
      - prompt: "Which of these points is furthest to the right on the number line?"
        options: ["√5", "2", "−3", "1.5"]
        answer: "√5"
        difficulty: 1
        hints: ["√5 ≈ 2.236."]
        solution: "Step 1: √5 ≈ 2.236. Step 2: It is bigger than 2, 1.5 and −3, so it is furthest right."
        mistakes: {"2": "furthest_right", "−3": "bigger_negative"}
      - prompt: "To mark √2 on the number line, you draw a square of side 1 from 0 to 1, then swing its diagonal down onto the line with a compass centred at 0. Where does it land?"
        options: ["At about 1.41", "At exactly 1.5", "At exactly 2", "At about 0.71"]
        answer: "At about 1.41"
        difficulty: 2
        hints: ["The diagonal of a unit square is √2."]
        solution: "Step 1: The diagonal is √2 long. Step 2: Swinging it keeps its length. Step 3: It lands at √2 ≈ 1.41."
        mistakes: {"At exactly 1.5": "diagonal_swing", "At about 0.71": "diagonal_swing"}
      - prompt: "Which list is in order from smallest to largest?"
        options: ["1.7, √3, 7/4", "√3, 1.7, 7/4", "7/4, √3, 1.7", "1.7, 7/4, √3"]
        answer: "1.7, √3, 7/4"
        difficulty: 2
        hints: ["√3 ≈ 1.732 and 7/4 = 1.75."]
        solution: "Step 1: 1.7 = 1.700, √3 ≈ 1.732 and 7/4 = 1.750. Step 2: So 1.7, √3, 7/4."
        mistakes: {"√3, 1.7, 7/4": "decimal_compare", "1.7, 7/4, √3": "decimal_compare"}
      - prompt: "Which whole number is nearest to √27?"
        answer: "5"
        check: "floor(sqrt(27) + 1/2)"
        difficulty: 2
        hints: ["5² = 25 and 6² = 36."]
        solution: "Step 1: 25 is much closer to 27 than 36 is. Step 2: √27 ≈ 5.2, so the nearest whole number is 5."
        mistakes: {"13.5": half_not_root}
      - prompt: "On the number line, P is at √2 and Q is at 3√2. Using √2 ≈ 1.414, how far apart are P and Q, to three decimal places?"
        answer: "2.828"
        check: "3*1.414 - 1.414"
        difficulty: 3
        hints: ["Distance = 3√2 − √2 = 2√2."]
        solution: "Step 1: PQ = 3√2 − √2 = 2√2. Step 2: ≈ 2 × 1.414 = 2.828."
        mistakes: {"5.656": distance_subtract}
      - prompt: "Put −√5, −2, √3 and 2 in order from smallest to largest."
        options: ["−√5, −2, √3, 2", "−2, −√5, √3, 2", "−√5, −2, 2, √3", "−2, −√5, 2, √3"]
        answer: "−√5, −2, √3, 2"
        difficulty: 2
        hints: ["√5 is about 2.24, so −√5 is about −2.24.", "√3 is about 1.73."]
        solution: "Step 1: −√5 ≈ −2.24 is less than −2. Step 2: √3 ≈ 1.73 is less than 2. Step 3: Order: −√5, −2, √3, 2."
        mistakes: {"−2, −√5, √3, 2": bigger_negative, "−√5, −2, 2, √3": decimal_compare}
      - prompt: "A right triangle with shorter sides 1 and 2 is drawn from 0 on the number line. Its longest side is swung down onto the line from 0. At which number does it land?"
        options: ["√5", "3", "√3", "2.5"]
        answer: "√5"
        difficulty: 3
        hints: ["The longest side is √(1² + 2²).", "Swinging keeps its length."]
        solution: "Step 1: Longest side = √(1 + 4) = √5. Step 2: The compass keeps the length, so it lands at √5 ≈ 2.24."
        mistakes: {"3": added_sides, "√3": diagonal_swing}
      - prompt: "On the number line, P is at −√2 and Q is at 2√2. Using √2 ≈ 1.414, how far apart are they, to three decimal places?"
        answer: "4.242"
        check: "3*1.414"
        difficulty: 3
        hints: ["Distance = bigger − smaller = 2√2 − (−√2).", "That is 3√2."]
        solution: "Step 1: 2√2 − (−√2) = 3√2. Step 2: 3 × 1.414 = 4.242."
        mistakes: {"1.414": distance_subtract, "2.828": negative_distance}
      - prompt: Between which two whole numbers is √40 on the number line?
        options:
        - 6 and 7
        - 5 and 6
        - 20 and 21
        - 7 and 8
        answer: 6 and 7
        difficulty: 1
        hints:
        - Find the perfect squares either side of 40.
        - 36 and 49.
        solution: 'Step 1: 36 < 40 < 49. Step 2: √36 = 6 and √49 = 7. Step 3: So √40 is between 6 and 7.'
        mistakes:
          20 and 21: root_of_square
      - prompt: Which of these points is furthest to the left on the number line?
        options:
        - −√10
        - −3
        - −√5
        - '0'
        answer: −√10
        difficulty: 1
        hints:
        - Furthest left means smallest.
        - √10 ≈ 3.16, so −√10 ≈ −3.16.
        solution: 'Step 1: −√10 ≈ −3.16 and −√5 ≈ −2.24. Step 2: −3.16 < −3 < −2.24 < 0. Step 3: So −√10 is furthest left.'
        mistakes:
          −3: furthest_right
          '0': furthest_right
      - prompt: Which whole number is nearest to √60?
        answer: '8'
        check: '8'
        difficulty: 2
        hints:
        - 7² = 49 and 8² = 64.
        - Is 60 closer to 49 or to 64?
        solution: 'Step 1: 49 < 60 < 64. Step 2: 60 is 4 from 64 but 11 from 49. Step 3: So √60 ≈ 7.75 and the nearest whole number is 8.'
        mistakes:
          '7': decimal_compare
          '30': root_of_square
      - prompt: Put 1.5, √2 and 1.4 in order from smallest to largest.
        options:
        - 1.4, √2, 1.5
        - √2, 1.4, 1.5
        - 1.4, 1.5, √2
        - 1.5, √2, 1.4
        answer: 1.4, √2, 1.5
        difficulty: 2
        hints:
        - √2 ≈ 1.414.
        - Where does 1.414 fit between 1.4 and 1.5?
        solution: 'Step 1: √2 ≈ 1.414. Step 2: 1.4 < 1.414 < 1.5. Step 3: So 1.4, √2, 1.5.'
        mistakes:
          √2, 1.4, 1.5: decimal_compare
          1.4, 1.5, √2: decimal_compare
      - prompt: A square of side 1 is drawn from 2 to 3 on the number line. Its diagonal from 2 is swung down onto the line, to the right. Where does it land?
        options:
        - 2 + √2
        - √2
        - 3√2
        - 2√2
        answer: 2 + √2
        difficulty: 3
        hints:
        - The compass is at 2, not 0.
        - The diagonal is √2 long, measured from 2.
        solution: 'Step 1: The diagonal is √2. Step 2: The compass point is at 2. Step 3: So it lands at 2 + √2 ≈ 3.41.'
        mistakes:
          √2: diagonal_swing
      - prompt: On the number line, P is at √3 and Q is at 4√3. Using √3 ≈ 1.732, how far apart are they, to three decimal places?
        answer: '5.196'
        check: 3*1.732
        difficulty: 3
        hints:
        - Distance = 4√3 − √3.
        - That is 3√3.
        solution: 'Step 1: 4√3 − √3 = 3√3. Step 2: 3 × 1.732. Step 3: = 5.196.'
        mistakes:
          '8.66': distance_subtract

  - code: math9.real.distance
    title: Distance between points
    after: [math9.real.number_line]
    notes: |
      The distance between the points x and y on the number line is the bigger minus the smaller,
      written |x − y|. |a| is the distance of a from 0, so |−9| = 9. The point halfway between a and
      b is (a + b)/2. |x − 3| = 5 has two answers, x = 8 and x = −2.
    explanations:
      text: "The distance between two points on the number line is the bigger number minus the smaller. From −2 to 5 is 5 − (−2) = 7. Mathematicians write this as |5 − (−2)|, where |…| means 'drop the minus sign if there is one'. So |−9| = 9: −9 is 9 steps from 0."
      visual: "Mark −2 and 5 on a number line and count the steps between them: 2 steps from −2 to 0, then 5 more to 5. That's 7 steps, the distance."
      step_by_step: "Which numbers are 5 away from 3? Step 1: Go 5 right: 3 + 5 = 8. Step 2: Go 5 left: 3 − 5 = −2. Step 3: Both work, so |x − 3| = 5 means x = 8 or x = −2."
      real_world: "A thermometer reads −6°C at night and −1°C in the morning. The temperature rose by the distance between them: −1 − (−6) = 5 degrees."
    picture:
      kind: number_line
      from: -3
      to: 6
      step: 1
      points:
      - {at: -2, label: −2}
      - {at: 5, label: '5'}
      jumps:
      - {from: -2, to: 5, label: 7 steps}
      caption: Distance = 5 − (−2) = 7.
      alt: A number line with points at −2 and 5. The distance between them is 7 steps.
    activity:
      type: number_line
      min: -6
      max: 6
      step: 1
      start: -3
      prompt: The distance between two numbers is the bigger one minus the smaller one. The marker starts at −3.
      goals:
      - prompt: Move to the number 7 steps to the right of −3.
        target: 4
        mistakes:
        - when:
            v: 3
          say: '3 is 6 steps to the right of −3. Count again: the step over 0 counts too.'
      - prompt: Move to the number whose distance from 4 is 9, on the left.
        target: -5
        mistakes:
        - when:
            v: -4
          say: −4 is 8 steps from 4. Count each step of 1 again.
        - when:
            v:
            - 5
            - 6
          say: That's to the right of 4. The goal wants the number on the left.
    lesson:
      - teach: The distance between two points on the number line is the bigger number minus the smaller one. From 3 to 8 is 8 − 3 = 5. From −2 to 5 is 5 − (−2) = 7. Distances are never negative.
        picture:
          kind: number_line
          from: -3
          to: 6
          step: 1
          points:
          - at: -2
            label: −2
          - at: 5
            label: '5'
          alt: On the number line, −2 and 5 are 7 steps apart.
        check:
          prompt: How far apart are −4 and 2?
          options:
          - '6'
          - −2
          - '2'
          answer: '6'
          why: '2 − (−4) = 2 + 4 = 6. Count the steps: 4 to reach 0, then 2 more.'
        ways:
        - style: real_world
          teach: 'If you are on floor 5 and your friend is in basement −2, how many floors apart are you? Count from −2 up to 0 (2 floors) and then up to 5 (5 floors): 7 in all. That is 5 − (−2). A distance is always counted as a positive number.'
      - teach: '|a|, called the absolute value of a, is the distance of a from 0. |−9| = 9 and |9| = 9. The distance between x and y is |x − y|, which is the same as |y − x|.'
        check:
          prompt: What is |2 − 11|?
          options:
          - '9'
          - −9
          - '13'
          answer: '9'
          why: 2 − 11 = −9, and its distance from 0 is 9.
        ways:
        - style: step_by_step
          teach: 'Step 1: |a| asks: how far is a from 0? Step 2: drop any minus sign, because distance has no direction: |−9| = 9. Step 3: for the distance between x and y, subtract them and then take the absolute value: |2 − 11| = |−9| = 9.'
      - teach: 'The point halfway between a and b is (a + b)/2: halfway between −4 and 10 is 6/2 = 3. And an equation like |x − 3| = 5 has two answers: the points 5 steps either side of 3, which are 8 and −2.'
        check:
          prompt: Which numbers are 4 away from 1?
          options:
          - 5 and −3
          - 5 only
          - 4 and −4
          answer: 5 and −3
          why: 1 + 4 = 5 and 1 − 4 = −3. Both are 4 steps from 1.
        ways:
        - style: step_by_step
          teach: 'Step 1: for |x − 3| = 5, start at 3 on the number line. Step 2: go 5 steps right: 8. Step 3: go 5 steps left: −2. Step 4: both are 5 away from 3, so there are two answers. Halfway between two points is their sum divided by 2.'
    items:
      - prompt: "On the number line, how far apart are 3 and 8?"
        answer: "5"
        check: "Abs(3 - 8)"
        difficulty: 1
        hints: ["Bigger minus smaller."]
        solution: "8 − 3 = 5"
        mistakes: {"11": distance_subtract, "-5": negative_distance}
      - prompt: "How far apart are −2 and 5 on the number line?"
        answer: "7"
        check: "Abs(5 - (-2))"
        difficulty: 1
        hints: ["5 − (−2) = 5 + 2."]
        solution: "Step 1: 5 − (−2). Step 2: = 7."
        mistakes: {"3": sign_slip}
      - prompt: "How far apart are −6 and −1 on the number line?"
        answer: "5"
        check: "Abs(-1 - (-6))"
        difficulty: 1
        hints: ["The bigger number is −1.", "−1 − (−6) = −1 + 6."]
        solution: "Step 1: −1 − (−6) = −1 + 6. Step 2: = 5."
        mistakes: {"7": sign_slip, "-5": negative_distance}
      - prompt: "What is |−9|?"
        answer: "9"
        check: "Abs(-9)"
        difficulty: 2
        hints: ["How far is −9 from 0?"]
        solution: "−9 is 9 steps from 0, so |−9| = 9."
        mistakes: {"-9": negative_distance}
      - prompt: "What is |3 − 10|?"
        answer: "7"
        check: "Abs(3 - 10)"
        difficulty: 2
        hints: ["3 − 10 = −7.", "Drop the minus sign."]
        solution: "Step 1: 3 − 10 = −7. Step 2: |−7| = 7."
        mistakes: {"-7": negative_distance, "13": distance_subtract}
      - prompt: "Which number is halfway between −4 and 10 on the number line?"
        answer: "3"
        check: "(-4 + 10)/2"
        difficulty: 2
        hints: ["Halfway = (a + b) ÷ 2."]
        solution: "Step 1: (−4 + 10) ÷ 2 = 6 ÷ 2. Step 2: = 3. Step 3: Check: 3 is 7 from each end."
        mistakes: {"7": midpoint_half_distance}
      - prompt: "A number x is 5 away from 3 on the number line, and x is negative. What is x?"
        answer: "-2"
        check: "3 - 5"
        difficulty: 3
        hints: ["Go 5 to the left of 3."]
        solution: "Step 1: The numbers 5 away from 3 are 8 and −2. Step 2: The negative one is −2."
        mistakes: {"8": other_side, "2": sign_slip}
      - prompt: "|x − 4| = 6 and x is bigger than 4. What is x?"
        answer: "10"
        check: "4 + 6"
        difficulty: 3
        hints: ["x is 6 away from 4.", "Bigger than 4 means go right."]
        solution: "Step 1: x is 6 away from 4, so x = 10 or x = −2. Step 2: Bigger than 4: x = 10."
        mistakes: {"-2": other_side, "2": distance_subtract}
      - prompt: "Which number is halfway between −7 and 3 on the number line?"
        answer: "-2"
        check: "(-7 + 3)/2"
        difficulty: 2
        hints: ["Add the two numbers and halve.", "(−7 + 3) ÷ 2."]
        solution: "Step 1: −7 + 3 = −4. Step 2: −4 ÷ 2 = −2. Step 3: Check: −2 is 5 from both."
        mistakes: {"5": midpoint_half_distance, "-5": midpoint_half_distance}
      - prompt: "|x + 2| = 5 and x is negative. What is x?"
        answer: "-7"
        check: "-2 - 5"
        difficulty: 3
        hints: ["|x + 2| is the distance from x to −2.", "Go 5 to the left of −2."]
        solution: "Step 1: |x − (−2)| = 5, so x is 5 away from −2. Step 2: The two such points are 3 and −7. Step 3: x is negative, so x = −7."
        mistakes: {"3": other_side, "-3": sign_slip}
      - prompt: "Point A is at −3.5 and point B is at 6.25. How far apart are they?"
        answer: "9.75"
        check: "6.25 - (-3.5)"
        difficulty: 3
        hints: ["Distance = bigger − smaller.", "6.25 − (−3.5) = 6.25 + 3.5."]
        solution: "Step 1: 6.25 − (−3.5) = 6.25 + 3.5. Step 2: = 9.75."
        mistakes: {"2.75": negative_distance, "-9.75": distance_subtract}
      - prompt: How far apart are −8 and −3 on the number line?
        answer: '5'
        check: -3 - (-8)
        difficulty: 1
        hints:
        - Bigger minus smaller.
        - −3 − (−8).
        solution: 'Step 1: −3 is bigger than −8. Step 2: −3 − (−8) = −3 + 8. Step 3: = 5.'
        mistakes:
          '11': distance_subtract
          '-5': negative_distance
      - prompt: What is |−15|?
        answer: '15'
        check: '15'
        difficulty: 1
        hints:
        - '|a| is a''s distance from 0.'
        - Distances are never negative.
        solution: 'Step 1: −15 is 15 steps left of 0. Step 2: Its distance from 0 is 15. Step 3: So |−15| = 15.'
        mistakes:
          '-15': negative_distance
      - prompt: Which number is halfway between −9 and 1 on the number line?
        answer: '-4'
        check: (-9 + 1)/2
        difficulty: 2
        hints:
        - Halfway is (a + b) ÷ 2.
        - (−9 + 1) ÷ 2.
        solution: 'Step 1: −9 + 1 = −8. Step 2: −8 ÷ 2 = −4. Step 3: Check: −4 is 5 from both −9 and 1.'
        mistakes:
          '5': midpoint_half_distance
          '-5': midpoint_half_distance
      - prompt: A lift is at floor −2 (basement) and goes up to floor 9. How many floors does it pass through, counting the move from each floor to the next?
        answer: '11'
        check: 9 - (-2)
        difficulty: 2
        hints:
        - It is the distance from −2 to 9.
        - 9 − (−2).
        solution: 'Step 1: Distance = 9 − (−2). Step 2: = 9 + 2. Step 3: = 11 floors.'
        mistakes:
          '7': distance_subtract
      - prompt: '|x − 1| = 7 and x is negative. What is x?'
        answer: '-6'
        check: 1 - 7
        difficulty: 3
        hints:
        - x is 7 away from 1.
        - The negative one is to the left of 1.
        solution: 'Step 1: x = 1 + 7 or x = 1 − 7. Step 2: 8 or −6. Step 3: x is negative, so x = −6.'
        mistakes:
          '8': other_side
          '-8': other_side
      - prompt: M is halfway between A and B. A is at −5 and M is at 2. Where is B?
        answer: '9'
        check: 2 + (2 - (-5))
        difficulty: 3
        hints:
        - From A to M is 7 steps.
        - B is another 7 steps past M.
        solution: 'Step 1: AM = 2 − (−5) = 7. Step 2: MB is also 7. Step 3: B = 2 + 7 = 9.'
        mistakes:
          '-1.5': midpoint_half_distance
