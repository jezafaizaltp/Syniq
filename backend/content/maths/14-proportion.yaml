# Class 9 Mathematics, chapter 14. Format: content/README.md.
# Also uses tips from earlier chapters: added_not_ratio, ratio_order, shares_not_added, forgot_divide.
subject: math
chapter: 14
title: Proportion

tips:
  ratio_after_change: "Find the actual numbers first, then change them. The ratio numbers themselves are not the counts."
  ratio_add_equal: "Call the numbers 3k and 5k. Add 4 to each, set the new fraction equal to the new ratio, and solve for k."
  mixture_one_part: "Only one part of the mixture changes. Find how much of the part that stays the same there is, then use the new ratio."
  bigger_minus_smaller: "The question asks how much more, so find both shares and take one from the other."
  chain_ratio: "Make the shared person's number the same in both ratios before joining them into one ratio."
  work_left: "Some of the work is already done. Count only the work that is left, in worker-days."
  ratio_not_simplified: "Divide both numbers by their biggest common factor to get the simplest form."
  added_difference: "In proportion, things change by multiplying, not by adding the same amount."
  direct_not_inverse: "When both go up together, the ratio stays the same: find the amount for 1 first."
  inverse_not_direct: "When one goes up and the other goes down, the product stays the same: multiply, then divide."
  share_of_one_part: "That is the size of one part. Multiply by the number of parts this person gets."
  whole_divided_wrong: "First add the ratio numbers to find how many parts the whole is split into."

concepts:
  - code: math9.prop.ratio
    title: Ratios
    notes: |
      A ratio a : b compares two quantities of the same kind by division. It does not change when
      both numbers are multiplied or divided by the same non-zero number, so 12 : 18 = 2 : 3. The
      order matters: boys to girls is not girls to boys. Ratios can be written as fractions a/b.
    explanations:
      text: "A class has 12 boys and 18 girls. The ratio of boys to girls is 12 : 18. Dividing both by 6 gives 2 : 3: for every 2 boys there are 3 girls. The ratio says how the two compare, not how many there are."
      visual: "Line up the students in groups of 5: 2 boys and 3 girls in each. You get 6 such groups. Each group shows the ratio 2 : 3."
      step_by_step: "Simplify 24 : 36. Step 1: The biggest number dividing both is 12. Step 2: 24 ÷ 12 = 2 and 36 ÷ 12 = 3. Step 3: The ratio is 2 : 3."
      real_world: "A recipe uses 2 cups of rice to 3 cups of water. For a bigger family, 4 cups of rice need 6 cups of water: the ratio 2 : 3 stays the same."
    activity:
      type: formula
      prompt: A class of 30 has boys and girls.
      inputs:
      - name: b
        label: Boys
        min: 1
        max: 29
        step: 1
        start: 15
      outputs:
      - name: g
        label: Girls
        expr: 30-b
      - name: r
        label: Girls for every boy
        expr: (30-b)/b
        places: 2
      goals:
      - prompt: 'Make the ratio of boys to girls 2 : 3.'
        want:
          r: 1.5
        hint: '2 : 3 means 1.5 girls for every boy.'
        mistakes:
        - when:
            r:
            - 0.66
            - 0.67
          say: 'Now there are 2 girls for every 3 boys: that''s 3 : 2 for boys to girls, the other way round. 2 : 3 means fewer boys than girls.'
    lesson:
      - teach: 'A ratio compares two amounts of the same kind by division. A class with 12 boys and 18 girls has boys to girls in the ratio 12 : 18. The order matters: girls to boys would be 18 : 12.'
        check:
          prompt: A basket has 5 mangoes and 8 bananas. What is the ratio of bananas to mangoes?
          options:
          - '8 : 5'
          - '5 : 8'
          - '5 : 13'
          answer: '8 : 5'
          why: Bananas come first because the question asks for bananas to mangoes.
        ways:
        - style: step_by_step
          teach: 'Step 1: read which thing is named first. Step 2: write its amount first. Step 3: write the other amount after the colon. ''Bananas to mangoes'' with 8 bananas and 5 mangoes is 8 : 5. Swap the order and the ratio means something different.'
      - teach: 'Like fractions, a ratio stays the same when both numbers are multiplied or divided by the same number. 12 : 18 = 2 : 3 (dividing both by 6), and 4 : 5 = 20 : 25 (multiplying both by 5). The simplest form uses the smallest whole numbers.'
        check:
          prompt: 'Write 15 : 25 in its simplest form.'
          options:
          - '3 : 5'
          - '5 : 3'
          - '15 : 25 is already simplest'
          answer: '3 : 5'
          why: 'Divide both by 5: 15 : 25 = 3 : 5.'
        ways:
        - style: step_by_step
          teach: 'Step 1: find a number that divides both sides of the ratio. Step 2: divide both by it. Step 3: repeat until no number other than 1 divides both. 12 : 18, divide by 6: 2 : 3. Multiplying both sides by the same number gives an equal ratio too.'
      - teach: 'Use a ratio to find a missing amount. Red to blue beads is 3 : 7 and there are 21 blue. 7 became 21, which is times 3, so red is 3 × 3 = 9. Adding the same number to both (3 + 14, 7 + 14) does not keep the ratio.'
        check:
          prompt: 'Tea to milk is 2 : 5. There are 15 cups of milk. How many cups of tea?'
          options:
          - '6'
          - '12'
          - '37.5'
          answer: '6'
          why: 5 × 3 = 15, so tea is 2 × 3 = 6.
        ways:
        - style: real_world
          teach: 'Mixing paint 3 tins red to 7 tins blue. You now use 21 tins blue: that is 3 times as much, so you need 3 times as much red, 9 tins. Adding 14 tins to both would change the colour. Ratios grow by multiplying.'
    items:
      - prompt: "A class has 12 boys and 18 girls. What is the ratio of boys to girls in simplest form?"
        options: ["2 : 3", "3 : 2", "12 : 30", "6 : 9"]
        answer: "2 : 3"
        difficulty: 1
        hints: ["Divide both numbers by 6."]
        solution: "12 : 18 = (12 ÷ 6) : (18 ÷ 6) = 2 : 3"
        mistakes: {"3 : 2": ratio_order, "6 : 9": ratio_not_simplified, "12 : 30": added_not_ratio}
      - prompt: "The ratio 4 : 5 is the same as 20 : ?. What is the missing number?"
        answer: "25"
        check: "20*5/4"
        difficulty: 1
        hints: ["4 was multiplied by 5 to get 20."]
        solution: "Step 1: 20 = 4 × 5. Step 2: 5 × 5 = 25."
        mistakes: {"21": added_difference}
      - prompt: "A school has teachers and students in the ratio 1 : 25. There are 40 teachers. How many students are there?"
        answer: "1000"
        check: "40*25"
        difficulty: 1
        hints: ["Each teacher goes with 25 students."]
        solution: "40 × 25 = 1000 students."
        mistakes: {"65": added_difference}
      - prompt: "In a bag, the ratio of red to blue beads is 3 : 7. There are 21 blue beads. How many red beads are there?"
        answer: "9"
        check: "21/7*3"
        difficulty: 2
        hints: ["7 parts are 21 beads, so 1 part is 3 beads."]
        solution: "Step 1: 1 part = 21 ÷ 7 = 3. Step 2: Red = 3 × 3 = 9."
        mistakes: {"17": added_difference, "49": ratio_order}
      - prompt: "A rectangle is 15 cm long and 10 cm wide. What fraction of the length is the width?"
        answer: "2/3"
        check: "Rational(10, 15)"
        difficulty: 2
        hints: ["Width ÷ length."]
        solution: "10/15 = 2/3"
        mistakes: {"3/2": ratio_order}
      - prompt: "Anu's height to Binu's height is 5 : 6. Binu's height to Chinnu's height is 4 : 5. What fraction of Chinnu's height is Anu's height?"
        answer: "2/3"
        check: "Rational(5, 6)*Rational(4, 5)"
        difficulty: 3
        hints: ["Anu/Chinnu = (Anu/Binu) × (Binu/Chinnu)."]
        solution: "Step 1: Anu/Binu = 5/6. Step 2: Binu/Chinnu = 4/5. Step 3: Anu/Chinnu = 5/6 × 4/5 = 20/30 = 2/3."
        mistakes: {"9/11": added_not_ratio}
      - prompt: "A class of 35 has boys and girls in the ratio 3 : 4. How many more boys must join so that there are as many boys as girls?"
        answer: "5"
        check: "35*4/7 - 35*3/7"
        difficulty: 3
        hints: ["Split 35 into 7 equal parts.", "Find the number of boys and girls, then compare."]
        solution: "Step 1: One part = 35 ÷ 7 = 5. Step 2: Boys = 15, girls = 20. Step 3: 5 more boys are needed."
        mistakes: {"1": ratio_after_change, "20": bigger_minus_smaller}
      - prompt: "A recipe uses rice and dal in the ratio 5 : 2. Kavya wants to use all 3 kg of her dal. How many kg of rice does she need?"
        answer: "7.5"
        check: "3*5/2"
        difficulty: 2
        hints: ["Each part of dal goes with how much rice?", "2 parts are 3 kg, so 1 part is 1.5 kg."]
        solution: "Step 1: 2 parts = 3 kg, so 1 part = 1.5 kg. Step 2: Rice = 5 parts = 7.5 kg."
        mistakes: {"6": added_difference, "1.2": ratio_order}
      - prompt: "Two numbers are in the ratio 3 : 5. When 4 is added to each, the ratio becomes 2 : 3. What is the smaller number?"
        answer: "12"
        check: "3*4"
        difficulty: 3
        hints: ["Write the numbers as 3k and 5k.", "(3k + 4) ÷ (5k + 4) = 2 ÷ 3."]
        solution: "Step 1: 3(3k + 4) = 2(5k + 4). Step 2: 9k + 12 = 10k + 8, so k = 4. Step 3: The numbers are 12 and 20."
        mistakes: {"4": share_of_one_part, "3": ratio_add_equal, "20": ratio_order}
      - prompt: A garden has 16 roses and 24 jasmine plants. What is the ratio of roses to jasmine in simplest form?
        options:
        - '2 : 3'
        - '3 : 2'
        - '16 : 24'
        - '4 : 6'
        answer: '2 : 3'
        difficulty: 1
        hints:
        - Divide both numbers by the same number.
        - Both 16 and 24 divide by 8.
        solution: 'Step 1: 16 : 24. Step 2: Divide both by 8. Step 3: = 2 : 3.'
        mistakes:
          '3 : 2': chain_ratio
          '4 : 6': ratio_not_simplified
      - prompt: 'The ratio 3 : 8 is the same as 12 : ?. What is the missing number?'
        answer: '32'
        check: 8*12/3
        difficulty: 1
        hints:
        - '3 became 12: multiplied by what?'
        - Multiply 8 by the same number.
        solution: 'Step 1: 12 ÷ 3 = 4. Step 2: 8 × 4 = 32. Step 3: So 3 : 8 = 12 : 32.'
        mistakes:
          '17': ratio_add_equal
      - prompt: 'Cement to sand in a mix is 1 : 4. A builder uses 20 bags of sand. How many bags of cement does he need?'
        answer: '5'
        check: 20/4
        difficulty: 2
        hints:
        - Sand is 4 times the cement.
        - 20 ÷ 4.
        solution: 'Step 1: For every 4 bags of sand there is 1 of cement. Step 2: 20 ÷ 4 = 5 groups. Step 3: So 5 bags of cement.'
        mistakes:
          '80': mixture_one_part
          '4': mixture_one_part
      - prompt: A photo is 12 cm wide and 18 cm tall. What fraction of its height is its width? Type a fraction like 2/3.
        answer: 2/3
        check: 12/18
        difficulty: 2
        hints:
        - Width ÷ height.
        - 12/18, simplified.
        solution: 'Step 1: 12/18. Step 2: Divide top and bottom by 6. Step 3: = 2/3.'
        mistakes:
          3/2: chain_ratio
      - prompt: 'Boys to girls in a club is 2 : 3. Girls to teachers is 6 : 1. There are 4 teachers. How many boys are there?'
        answer: '16'
        check: 4*6*2/3
        difficulty: 3
        hints:
        - 'Find the girls first: 6 girls for each teacher.'
        - There are 24 girls.
        solution: 'Step 1: Girls = 6 × 4 = 24. Step 2: Boys : girls = 2 : 3, and 3 × 8 = 24. Step 3: Boys = 2 × 8 = 16.'
        mistakes:
          '36': chain_ratio
          '8': chain_ratio
      - prompt: 'Two numbers are in the ratio 2 : 5. When 6 is added to each, the ratio becomes 1 : 2. What is the larger number?'
        answer: '30'
        check: 5*6
        difficulty: 3
        hints:
        - Call the numbers 2k and 5k.
        - '(2k + 6) : (5k + 6) = 1 : 2, so 2(2k + 6) = 5k + 6.'
        solution: 'Step 1: 4k + 12 = 5k + 6. Step 2: k = 6. Step 3: The numbers are 12 and 30, so the larger is 30.'
        mistakes:
          '12': ratio_after_change

  - code: math9.prop.direct
    title: Direct proportion
    after: [math9.prop.ratio]
    notes: |
      Two quantities are in direct proportion when one is always the same multiple of the other:
      y = kx. If one doubles, so does the other, and y/x stays constant. Solve by finding the value
      for one unit (the unitary method) or by keeping the ratio equal.
    explanations:
      text: "If 5 pens cost ₹60, then 1 pen costs ₹12, and 8 pens cost 8 × 12 = ₹96. Cost and number of pens are in direct proportion: the cost per pen stays the same, ₹12."
      visual: "Make a table: pens 1, 2, 3, 4, 5 and cost 12, 24, 36, 48, 60. Each row of cost is 12 times the pens. Plotted, the points lie on a straight line through (0, 0)."
      step_by_step: "A car goes 150 km on 10 litres. How far on 4 litres? Step 1: 1 litre goes 150 ÷ 10 = 15 km. Step 2: 4 litres go 4 × 15 = 60 km."
      real_world: "A shop sells rice at ₹45 per kg. 2 kg costs ₹90, 3 kg ₹135. The bill grows in step with the weight."
    picture:
      kind: bars
      unit: cost in rupees, ₹12 a pen
      bars:
      - {label: 1 pen, value: 12}
      - {label: 2 pens, value: 24}
      - {label: 3 pens, value: 36}
      - {label: 4 pens, value: 48}
      - {label: 5 pens, value: 60}
      caption: 'Double the pens, double the cost: cost ÷ pens is always 12.'
      alt: 'Bars for the cost of 1 to 5 pens at 12 rupees each: 12, 24, 36, 48 and 60, growing by the same amount each time.'
    activity:
      type: formula
      prompt: Pens cost ₹12 each. Cost is directly proportional to the number of pens.
      inputs:
      - name: n
        label: Pens
        min: 0
        max: 20
        step: 1
        start: 0
      outputs:
      - name: c
        label: Cost
        expr: 12*n
        unit: ₹
      - name: r
        label: Cost ÷ pens
        expr: 12*n/max(n,1)
        unit: ₹
      goals:
      - prompt: How many pens for ₹84?
        want:
          c: 84
      - prompt: 'Now double the money: ₹168. How many pens?'
        want:
          c: 168
        mistakes:
        - when:
            n: 8
          say: 8 pens cost ₹96. Twice as many pens as 7 cost twice as much.
    lesson:
      - teach: 'Two amounts are in direct proportion when one is always the same multiple of the other. If 1 pen costs ₹12, then 2 pens cost ₹24 and 5 pens cost ₹60. Double the pens, double the cost: cost ÷ number stays 12.'
        check:
          prompt: Which pair is in direct proportion?
          options:
          - Litres of milk bought and its cost
          - Speed of a bus and time for a trip
          - A person's age and height
          answer: Litres of milk bought and its cost
          why: Twice the milk costs twice as much. Faster speed means less time, and height doesn't keep pace with age.
        ways:
        - style: step_by_step
          teach: 'Step 1: double one amount. Step 2: does the other double too? Step 3: halve it: does the other halve? If yes both times, they are in direct proportion: one divided by the other stays the same, like cost ÷ number of pens.'
      - teach: 'The unitary method: find the value for one, then multiply. 5 pens cost ₹60, so 1 pen costs ₹12, and 8 pens cost 8 × 12 = ₹96.'
        picture:
          kind: flow
          steps:
          - 5 pens → ₹60
          - 1 pen → ₹60 ÷ 5 = ₹12
          - 8 pens → ₹12 × 8 = ₹96
          alt: 'Unitary method: from 5 pens for ₹60, one pen costs ₹12, so 8 pens cost ₹96.'
        check:
          prompt: 4 kg of rice cost ₹200. How much do 7 kg cost?
          options:
          - ₹350
          - ₹203
          - ₹800
          answer: ₹350
          why: 1 kg costs 200 ÷ 4 = ₹50, so 7 kg cost 7 × 50 = ₹350.
        ways:
        - style: step_by_step
          teach: 'Step 1: divide to find the value for one: 5 pens for ₹60, so 1 pen is ₹12. Step 2: multiply by how many you want: 8 pens, 8 × 12 = ₹96.'
      - teach: In letters, y = kx, where k is the amount for one. If y = 10 when x = 4, then k = 10 ÷ 4 = 2.5, and when x = 6, y = 2.5 × 6 = 15. Maps and scales are direct proportion too.
        check:
          prompt: y is in direct proportion to x, and y = 12 when x = 3. What is y when x = 5?
          options:
          - '20'
          - '14'
          - '36'
          answer: '20'
          why: k = 12 ÷ 3 = 4, so y = 4 × 5 = 20.
        ways:
        - style: step_by_step
          teach: 'Step 1: write y = kx. Step 2: put in the known pair to find k: k = y ÷ x. Step 3: use that k with the new x. If y = 10 when x = 4, k = 2.5; when x = 6, y = 15.'
    items:
      - prompt: "5 pens cost ₹60. How many rupees do 8 pens cost?"
        answer: "96"
        check: "60/5*8"
        difficulty: 1
        hints: ["First find the cost of 1 pen."]
        solution: "Step 1: 1 pen = 60 ÷ 5 = ₹12. Step 2: 8 pens = 8 × 12 = ₹96."
        mistakes: {"63": added_difference, "12": share_of_one_part, "300/8": direct_not_inverse}
      - prompt: "Which of these pairs are in direct proportion?"
        options: ["Weight of rice bought and its cost", "Speed and time for a fixed journey", "Number of workers and days to finish a job", "Age and height of a person"]
        answer: "Weight of rice bought and its cost"
        difficulty: 1
        hints: ["Double one: does the other double too?"]
        solution: "Twice the rice costs twice as much. Speed and time, and workers and days, are inverse. Age and height are not in any fixed proportion."
        mistakes: {"Speed and time for a fixed journey": inverse_not_direct, "Number of workers and days to finish a job": inverse_not_direct}
      - prompt: "A car travels 150 km on 10 litres of petrol. How many km does it travel on 4 litres?"
        answer: "60"
        check: "150/10*4"
        difficulty: 2
        hints: ["Find the km for 1 litre."]
        solution: "Step 1: 150 ÷ 10 = 15 km per litre. Step 2: 4 × 15 = 60 km."
        mistakes: {"15": share_of_one_part, "375": direct_not_inverse}
      - prompt: "y is in direct proportion to x. When x = 4, y = 10. What is y when x = 6?"
        answer: "15"
        check: "Rational(10, 4)*6"
        difficulty: 2
        hints: ["y/x stays the same: 10/4."]
        solution: "Step 1: y = (10/4) × x. Step 2: y = 2.5 × 6 = 15."
        mistakes: {"12": added_difference, "20/3": direct_not_inverse}
      - prompt: "A map uses the scale 1 cm for 5 km. Two towns are 7.5 cm apart on the map. How many km apart are they?"
        answer: "37.5"
        check: "Rational(15, 2)*5"
        difficulty: 2
        hints: ["Each cm is 5 km."]
        solution: "7.5 × 5 = 37.5 km"
        mistakes: {"1.5": direct_not_inverse}
      - prompt: "A tap fills 3/4 of a tank in 9 minutes. At the same rate, how many minutes does it take to fill the whole tank?"
        answer: "12"
        check: "9/Rational(3, 4)"
        difficulty: 3
        hints: ["1/4 of the tank takes 9 ÷ 3 = 3 minutes."]
        solution: "Step 1: 3 quarters take 9 minutes, so 1 quarter takes 3. Step 2: 4 quarters take 12 minutes."
        mistakes: {"27/4": direct_not_inverse, "3": share_of_one_part}
      - prompt: "A machine makes 450 bottles in 1.5 hours. How many bottles does it make in 4 hours?"
        answer: "1200"
        check: "450/1.5*4"
        difficulty: 2
        hints: ["How many bottles in 1 hour?", "450 ÷ 1.5 = 300."]
        solution: "Step 1: In 1 hour: 450 ÷ 1.5 = 300. Step 2: In 4 hours: 300 × 4 = 1200."
        mistakes: {"1800": share_of_one_part, "168.75": direct_not_inverse}
      - prompt: "y is in direct proportion to x. When x = 0.6, y = 4.2. What is x when y = 9.8?"
        answer: "1.4"
        check: "9.8/(4.2/0.6)"
        difficulty: 3
        hints: ["y ÷ x is the same every time.", "4.2 ÷ 0.6 = 7."]
        solution: "Step 1: y = 7x. Step 2: 9.8 = 7x, so x = 1.4."
        mistakes: {"6.2": added_difference, "68.6": wrong_inverse}
      - prompt: "On a map, 2 cm stands for 15 km. A road is 51 km long. How long is it on the map, in cm?"
        answer: "6.8"
        check: "51*2/15"
        difficulty: 3
        hints: ["How many km does 1 cm stand for?", "1 cm = 7.5 km."]
        solution: "Step 1: 1 cm stands for 7.5 km. Step 2: 51 ÷ 7.5 = 6.8 cm."
        mistakes: {"382.5": wrong_inverse, "25.5": share_of_one_part}
      - prompt: 6 notebooks cost ₹180. How many rupees do 10 notebooks cost?
        answer: '300'
        check: 180/6*10
        difficulty: 1
        hints:
        - Find the cost of 1 notebook.
        - 180 ÷ 6 = 30.
        solution: 'Step 1: 1 notebook costs 180 ÷ 6 = ₹30. Step 2: 10 notebooks cost 10 × 30. Step 3: = ₹300.'
        mistakes:
          '184': added_difference
          '108': inverse_not_direct
      - prompt: A cyclist rides 12 km in 40 minutes at a steady speed. How many km does she ride in 1 hour?
        answer: '18'
        check: 12/40*60
        difficulty: 1
        hints:
        - 1 hour is 60 minutes.
        - How far in 10 minutes first?
        solution: 'Step 1: In 10 minutes she rides 3 km. Step 2: 60 minutes is 6 lots of 10. Step 3: 6 × 3 = 18 km.'
        mistakes:
          '32': added_difference
      - prompt: A printer prints 75 pages in 3 minutes. How many minutes does it take to print 200 pages?
        answer: '8'
        check: 200/(75/3)
        difficulty: 2
        hints:
        - How many pages per minute?
        - 75 ÷ 3 = 25 pages a minute.
        solution: 'Step 1: 25 pages a minute. Step 2: 200 ÷ 25. Step 3: = 8 minutes.'
        mistakes:
          '5000': inverse_not_direct
      - prompt: y is in direct proportion to x. When x = 5, y = 8. What is y when x = 12.5?
        answer: '20'
        check: 8/5*12.5
        difficulty: 2
        hints:
        - k = y ÷ x = 8 ÷ 5.
        - k = 1.6.
        solution: 'Step 1: k = 8 ÷ 5 = 1.6. Step 2: y = 1.6 × 12.5. Step 3: = 20.'
        mistakes:
          '15.5': added_difference
          '3.2': inverse_not_direct
      - prompt: On a map, 3 cm stands for 20 km. Two towns are 45 km apart. How far apart are they on the map, in cm?
        answer: '6.75'
        check: 45*3/20
        difficulty: 3
        hints:
        - How many cm for 1 km?
        - 3 ÷ 20 = 0.15 cm per km.
        solution: 'Step 1: 1 km ↔ 0.15 cm. Step 2: 45 km ↔ 45 × 0.15. Step 3: = 6.75 cm.'
        mistakes:
          '300': inverse_not_direct
      - prompt: A tap fills 2/5 of a tank in 6 minutes. At the same rate, how many minutes does it take to fill the whole tank?
        answer: '15'
        check: 6/(2/5)
        difficulty: 3
        hints:
        - How long for 1/5 of the tank?
        - 1/5 takes 3 minutes.
        solution: 'Step 1: 2/5 takes 6 minutes, so 1/5 takes 3 minutes. Step 2: The whole tank is 5/5. Step 3: 5 × 3 = 15 minutes.'
        mistakes:
          '2.4': inverse_not_direct

  - code: math9.prop.inverse
    title: Inverse proportion
    after: [math9.prop.direct]
    notes: |
      Two quantities are in inverse proportion when their product stays constant: xy = k. If one
      doubles, the other halves. Typical cases: workers and days for a fixed job, speed and time for
      a fixed distance. Find the constant product first, then divide.
    explanations:
      text: "6 workers finish a wall in 10 days. The job is 6 × 10 = 60 worker-days. With 4 workers it takes 60 ÷ 4 = 15 days. More workers, fewer days; fewer workers, more days."
      visual: "Picture 60 bricks to lay, one brick per worker per day. Arrange them in a rectangle: 6 rows of 10, or 4 rows of 15, or 12 rows of 5. The total, the area, never changes."
      step_by_step: "A bus at 40 km/h takes 3 hours. How long at 60 km/h? Step 1: Distance = 40 × 3 = 120 km. Step 2: Time = 120 ÷ 60 = 2 hours."
      real_world: "Food stocked for 20 campers for 9 days lasts only 6 days if 30 campers come: 20 × 9 = 180 camper-days, and 180 ÷ 30 = 6."
    activity:
      type: formula
      prompt: A job takes 24 worker-days. More workers, fewer days.
      inputs:
      - name: w
        label: Workers
        min: 1
        max: 24
        step: 1
        start: 1
      outputs:
      - name: d
        label: Days
        expr: 24/w
        places: 1
      goals:
      - prompt: Finish it in 4 days.
        want:
          d: 4
        mistakes:
        - when:
            w: 4
          say: 4 workers take 6 days. With more workers the job is shared, so to finish faster you need more workers, not fewer.
      - prompt: Finish it in 3 days.
        want:
          d: 3
        mistakes:
        - when:
            w: 3
          say: 3 workers take 8 days. Fewer days needs more workers.
    lesson:
      - teach: Some amounts go the opposite way. More workers finish a job in fewer days; a faster bus takes less time. When one amount doubles and the other halves, they are in inverse proportion.
        check:
          prompt: Which pair is in inverse proportion?
          options:
          - Number of workers and days to build a wall
          - Number of pens and their cost
          - Distance on a map and real distance
          answer: Number of workers and days to build a wall
          why: Twice the workers need half the days. The other two grow together.
        ways:
        - style: real_world
          teach: 'Sharing a box of 60 laddoos: 6 friends get 10 each, 12 friends get only 5 each. More people, fewer each. When one amount goes up as the other goes down, so that doubling one halves the other, they are in inverse proportion.'
      - teach: 'In inverse proportion, the product stays the same. 6 workers take 10 days: the job is 6 × 10 = 60 worker-days. With 4 workers, it takes 60 ÷ 4 = 15 days. Find the product first, then divide.'
        picture:
          kind: flow
          steps:
          - 6 workers × 10 days = 60 worker-days
          - Same job, 4 workers
          - 60 ÷ 4 = 15 days
          alt: The job is 60 worker-days; with 4 workers it takes 15 days.
        check:
          prompt: A trip takes 4 hours at 30 km/h. How long at 60 km/h?
          options:
          - 2 hours
          - 8 hours
          - 34 hours
          answer: 2 hours
          why: Distance = 4 × 30 = 120 km, the fixed product. 120 ÷ 60 = 2 hours.
        ways:
        - style: step_by_step
          teach: 'Step 1: multiply the two amounts you know: 6 workers × 10 days = 60 worker-days. Step 2: this total job stays the same. Step 3: divide by the new amount: 60 ÷ 4 workers = 15 days.'
      - teach: 'Check by asking: if one goes up, should the other go down? If yes, multiply then divide (inverse). If both go up together, use the unitary method (direct). Mixing them up gives answers that are clearly too big or too small.'
        check:
          prompt: Food lasts 10 people for 6 days. Will it last 15 people longer or shorter?
          options:
          - 'Shorter: 4 days'
          - 'Longer: 9 days'
          answer: 'Shorter: 4 days'
          why: More people eat it faster. 10 × 6 = 60 person-days, and 60 ÷ 15 = 4 days.
        ways:
        - style: step_by_step
          teach: 'Step 1: ask: if one amount goes up, should the other go up or down? Step 2: both up: direct, find one and multiply. Step 3: one up, one down: inverse, multiply then divide. Step 4: check the answer moved the right way.'
    items:
      - prompt: "6 workers can build a wall in 10 days. How many days will 4 workers take?"
        answer: "15"
        check: "6*10/4"
        difficulty: 1
        hints: ["Total work = 6 × 10 worker-days."]
        solution: "Step 1: 6 × 10 = 60 worker-days. Step 2: 60 ÷ 4 = 15 days."
        mistakes: {"20/3": inverse_not_direct, "12": added_difference}
      - prompt: "A bus at 40 km/h takes 3 hours for a journey. How many hours does it take at 60 km/h?"
        answer: "2"
        check: "40*3/60"
        difficulty: 1
        hints: ["Find the distance first."]
        solution: "Step 1: 40 × 3 = 120 km. Step 2: 120 ÷ 60 = 2 hours."
        mistakes: {"9/2": inverse_not_direct}
      - prompt: "x and y are in inverse proportion. When x = 8, y = 3. What is y when x = 12?"
        answer: "2"
        check: "8*3/12"
        difficulty: 2
        hints: ["x × y stays 24."]
        solution: "Step 1: 8 × 3 = 24. Step 2: y = 24 ÷ 12 = 2."
        mistakes: {"9/2": inverse_not_direct}
      - prompt: "Food in a camp lasts 20 people for 9 days. For how many days will it last 30 people?"
        answer: "6"
        check: "20*9/30"
        difficulty: 2
        hints: ["20 × 9 = 180 person-days."]
        solution: "Step 1: 20 × 9 = 180 person-days. Step 2: 180 ÷ 30 = 6 days."
        mistakes: {"27/2": inverse_not_direct}
      - prompt: "Which table shows x and y in inverse proportion?"
        options: ["x: 2, 4, 8 and y: 12, 6, 3", "x: 2, 4, 8 and y: 3, 6, 12", "x: 2, 4, 8 and y: 12, 10, 6", "x: 2, 4, 8 and y: 5, 7, 11"]
        answer: "x: 2, 4, 8 and y: 12, 6, 3"
        difficulty: 2
        hints: ["Multiply x and y in each pair."]
        solution: "2 × 12 = 4 × 6 = 8 × 3 = 24, so the product stays the same."
        mistakes: {"x: 2, 4, 8 and y: 3, 6, 12": inverse_not_direct, "x: 2, 4, 8 and y: 12, 10, 6": added_difference}
      - prompt: "12 pipes fill a tank in 5 hours. How many pipes are needed to fill it in 3 hours?"
        answer: "20"
        check: "12*5/3"
        difficulty: 3
        hints: ["12 × 5 = 60 pipe-hours."]
        solution: "Step 1: 12 × 5 = 60 pipe-hours. Step 2: 60 ÷ 3 = 20 pipes."
        mistakes: {"36/5": inverse_not_direct}
      - prompt: "10 workers can finish a job in 12 days. After 4 days, 2 workers leave. How many more days will the rest take to finish?"
        answer: "10"
        check: "10*(12-4)/8"
        difficulty: 3
        hints: ["How much work is left, in worker-days?", "10 workers would have needed 8 more days."]
        solution: "Step 1: Work left = 10 workers × 8 days = 80 worker-days. Step 2: 8 workers take 80 ÷ 8 = 10 days."
        mistakes: {"15": work_left, "6.4": inverse_not_direct, "8": work_left}
      - prompt: "A car takes 4 hours for a journey at 45 km/h. How fast must it go, in km/h, to take 3 hours?"
        answer: "60"
        check: "45*4/3"
        difficulty: 2
        hints: ["The distance stays the same.", "Distance = 45 × 4 = 180 km."]
        solution: "Step 1: Distance = 180 km. Step 2: Speed = 180 ÷ 3 = 60 km/h."
        mistakes: {"33.75": inverse_not_direct, "44": added_difference}
      - prompt: "x and y are in inverse proportion. When x = 2.5, y = 16. What is x when y = 10?"
        answer: "4"
        check: "2.5*16/10"
        difficulty: 2
        hints: ["x × y stays the same.", "2.5 × 16 = 40."]
        solution: "Step 1: xy = 40. Step 2: x = 40 ÷ 10 = 4."
        mistakes: {"1.5625": inverse_not_direct, "8.5": added_difference}
      - prompt: 8 workers paint a school in 6 days. How many days would 12 workers take?
        answer: '4'
        check: 8*6/12
        difficulty: 1
        hints:
        - More workers, fewer days.
        - The job is 8 × 6 = 48 worker-days.
        solution: 'Step 1: Job = 8 × 6 = 48 worker-days. Step 2: 48 ÷ 12. Step 3: = 4 days.'
        mistakes:
          '9': direct_not_inverse
      - prompt: A train takes 5 hours at 80 km/h. How many hours does it take at 100 km/h?
        answer: '4'
        check: 5*80/100
        difficulty: 1
        hints:
        - Find the distance first.
        - 5 × 80 = 400 km.
        solution: 'Step 1: Distance = 400 km. Step 2: 400 ÷ 100. Step 3: = 4 hours.'
        mistakes:
          '6.25': direct_not_inverse
      - prompt: x and y are in inverse proportion. When x = 6, y = 10. What is y when x = 15?
        answer: '4'
        check: 6*10/15
        difficulty: 2
        hints:
        - xy stays the same.
        - 6 × 10 = 60.
        solution: 'Step 1: xy = 60. Step 2: 15 × y = 60. Step 3: y = 4.'
        mistakes:
          '25': direct_not_inverse
      - prompt: In which of these tables is y inversely proportional to x?
        options:
        - 'x: 1, 2, 5 and y: 20, 10, 4'
        - 'x: 1, 2, 5 and y: 3, 6, 15'
        - 'x: 1, 2, 5 and y: 20, 19, 16'
        - 'x: 1, 2, 5 and y: 10, 8, 2'
        answer: 'x: 1, 2, 5 and y: 20, 10, 4'
        difficulty: 2
        hints:
        - Multiply each x by its y.
        - In inverse proportion the products are all equal.
        solution: 'Step 1: 1 × 20 = 20, 2 × 10 = 20, 5 × 4 = 20. Step 2: The products are equal. Step 3: So the first table is inverse proportion.'
        mistakes:
          'x: 1, 2, 5 and y: 3, 6, 15': direct_not_inverse
          'x: 1, 2, 5 and y: 20, 19, 16': inverse_not_direct
      - prompt: A tank is filled by 4 taps in 9 hours. How many taps are needed to fill it in 6 hours?
        answer: '6'
        check: 4*9/6
        difficulty: 3
        hints:
        - Fewer hours need more taps.
        - 4 × 9 = 36 tap-hours.
        solution: 'Step 1: Job = 36 tap-hours. Step 2: 36 ÷ 6. Step 3: = 6 taps.'
        mistakes:
          '2.667': direct_not_inverse
      - prompt: 15 workers can finish a road in 8 days. After 2 days, 5 more workers join. How many more days do they need to finish?
        answer: '4.5'
        check: 15*(8 - 2)/20
        difficulty: 3
        hints:
        - After 2 days, 6 days' work for 15 workers is left.
        - That is 90 worker-days, now shared by 20 workers.
        solution: 'Step 1: Work left = 15 × 6 = 90 worker-days. Step 2: Now 20 workers. Step 3: 90 ÷ 20 = 4.5 days.'
        mistakes:
          '6': work_left

  - code: math9.prop.sharing
    title: Sharing in a ratio
    after: [math9.prop.ratio]
    notes: |
      To share an amount in the ratio a : b, split it into a + b equal parts; one person gets a parts
      and the other b. For three people a : b : c, use a + b + c parts. Check: the shares add up to the
      whole.
    explanations:
      text: "Share ₹500 between Ravi and Sita in the ratio 2 : 3. There are 2 + 3 = 5 parts, so each part is ₹100. Ravi gets 2 parts, ₹200, and Sita 3 parts, ₹300. Check: 200 + 300 = 500."
      visual: "Draw a bar for ₹500 and cut it into 5 equal pieces of ₹100. Colour 2 pieces for Ravi and 3 for Sita."
      step_by_step: "Share 72 sweets in the ratio 1 : 2 : 3. Step 1: Parts: 1 + 2 + 3 = 6. Step 2: One part = 72 ÷ 6 = 12. Step 3: Shares: 12, 24 and 36."
      real_world: "Two friends put ₹3,000 and ₹2,000 into a stall and make a profit of ₹1,500. Shared fairly in the ratio 3 : 2, they get ₹900 and ₹600."
    picture:
      kind: bars
      unit: rupees
      bars:
      - {label: 'Ravi: 2 parts', value: 200}
      - {label: 'Sita: 3 parts', value: 300}
      caption: '₹500 in the ratio 2 : 3 is 5 parts of ₹100: Ravi gets 2 parts, Sita 3.'
      alt: '500 rupees shared in the ratio 2 to 3: Ravi gets 200 rupees and Sita 300 rupees.'
    activity:
      type: formula
      prompt: 'Share ₹600 in the ratio a : b.'
      inputs:
      - name: a
        label: a
        min: 1
        max: 9
        step: 1
        start: 1
      - name: b
        label: b
        min: 1
        max: 9
        step: 1
        start: 1
      outputs:
      - name: x
        label: First share
        expr: 600*a/(a+b)
        unit: ₹
      - name: y
        label: Second share
        expr: 600*b/(a+b)
        unit: ₹
      goals:
      - prompt: Make the shares ₹240 and ₹360.
        want:
          x: 240
          y: 360
        mistakes:
        - when:
            x: 360
            y: 240
          say: 'The shares are swapped: the first share is ₹360. In a : b, a goes with the first share.'
    lesson:
      - teach: 'To share ₹500 between Ravi and Sita in the ratio 2 : 3, cut it into 2 + 3 = 5 equal parts. Each part is ₹100. Ravi gets 2 parts (₹200) and Sita 3 parts (₹300). Check: 200 + 300 = 500.'
        picture:
          kind: bars
          bars:
          - label: Ravi
            value: 200
          - label: Sita
            value: 300
          alt: 'Ravi gets 200 and Sita gets 300 when 500 is shared in the ratio 2 : 3.'
        check:
          prompt: '₹60 is shared in the ratio 1 : 2. How many equal parts is it cut into?'
          options:
          - '3'
          - '2'
          - '60'
          answer: '3'
          why: 1 + 2 = 3 parts of ₹20. The shares are ₹20 and ₹40.
        ways:
        - style: step_by_step
          teach: 'Step 1: add the numbers of the ratio: 2 + 3 = 5 parts. Step 2: divide the total by the parts: 500 ÷ 5 = 100 per part. Step 3: multiply each person''s number by one part: 2 × 100 and 3 × 100. Step 4: check the shares add back to the total.'
      - teach: 'For three people, add all three numbers. 72 sweets in the ratio 1 : 2 : 3 make 6 parts of 12: shares of 12, 24 and 36. A common slip is dividing by just one of the numbers.'
        check:
          prompt: '90 is shared in the ratio 2 : 3 : 4. What is one part?'
          options:
          - '10'
          - '30'
          - '45'
          answer: '10'
          why: 2 + 3 + 4 = 9 parts, and 90 ÷ 9 = 10.
        ways:
        - style: real_world
          teach: 'Three friends put money into a business in the ratio 1 : 2 : 3, so there are 6 shares in all. If the profit is 72, each share is 72 ÷ 6 = 12. The friends get 12, 24 and 36. Divide by the total of all the ratio numbers, not just one.'
      - teach: 'Sometimes you know a share and want the whole. Shared 4 : 5, the smaller share is ₹240. 4 parts = ₹240, so 1 part = ₹60, and the whole is 9 parts = ₹540.'
        check:
          prompt: 'Shared 3 : 2, the bigger share is ₹90. What was the total?'
          options:
          - ₹150
          - ₹60
          - ₹135
          answer: ₹150
          why: 3 parts = ₹90, so 1 part = ₹30, and 5 parts = ₹150.
        ways:
        - style: step_by_step
          teach: 'Step 1: find which part of the ratio you know: shared 4 : 5, the smaller share is 4 parts. Step 2: find one part: 240 ÷ 4 = 60. Step 3: the whole is all the parts: 4 + 5 = 9, so 9 × 60 = 540.'
    items:
      - prompt: "₹500 is shared between Ravi and Sita in the ratio 2 : 3. How many rupees does Ravi get?"
        answer: "200"
        check: "500/(2 + 3)*2"
        difficulty: 1
        hints: ["2 + 3 = 5 parts."]
        solution: "Step 1: 500 ÷ 5 = 100 per part. Step 2: Ravi: 2 × 100 = ₹200."
        mistakes: {"100": share_of_one_part, "300": swapped_parts, "250": whole_divided_wrong}
      - prompt: "A rope 60 m long is cut in the ratio 1 : 4. How many metres long is the shorter piece?"
        answer: "12"
        check: "60/(1 + 4)"
        difficulty: 1
        hints: ["1 + 4 = 5 parts."]
        solution: "60 ÷ 5 = 12 m for one part; the shorter piece is 1 part."
        mistakes: {"15": whole_divided_wrong, "48": swapped_parts}
      - prompt: "72 sweets are shared among three children in the ratio 1 : 2 : 3. How many does the child with the biggest share get?"
        answer: "36"
        check: "72/(1 + 2 + 3)*3"
        difficulty: 2
        hints: ["1 + 2 + 3 = 6 parts."]
        solution: "Step 1: 72 ÷ 6 = 12. Step 2: 3 × 12 = 36."
        mistakes: {"12": share_of_one_part, "24": whole_divided_wrong}
      - prompt: "Two friends invest ₹3,000 and ₹2,000 and share a profit of ₹1,500 in the ratio of their money. How many rupees does the first friend get?"
        answer: "900"
        check: "1500/(3 + 2)*3"
        difficulty: 2
        hints: ["The ratio is 3000 : 2000 = 3 : 2."]
        solution: "Step 1: 3 + 2 = 5 parts. Step 2: 1500 ÷ 5 = 300. Step 3: 3 × 300 = ₹900."
        mistakes: {"600": swapped_parts, "300": share_of_one_part, "500": whole_divided_wrong}
      - prompt: "Money is shared in the ratio 4 : 5. The smaller share is ₹240. What was the total amount in rupees?"
        answer: "540"
        check: "240/4*(4 + 5)"
        difficulty: 3
        hints: ["4 parts are ₹240, so 1 part is ₹60."]
        solution: "Step 1: 1 part = 240 ÷ 4 = 60. Step 2: 9 parts = 9 × 60 = ₹540."
        mistakes: {"300": shares_not_added, "60": share_of_one_part}
      - prompt: "The angles of a triangle are in the ratio 2 : 3 : 4. What is the largest angle in degrees?"
        answer: "80"
        check: "180/(2 + 3 + 4)*4"
        difficulty: 3
        hints: ["The angles add up to 180°.", "2 + 3 + 4 = 9 parts."]
        solution: "Step 1: 180 ÷ 9 = 20. Step 2: 4 × 20 = 80°."
        mistakes: {"20": share_of_one_part, "45": whole_divided_wrong}
      - prompt: "A, B and C share ₹3,400. A : B = 1 : 2 and B : C = 3 : 4. How many rupees does C get?"
        answer: "1600"
        check: "3400/17*8"
        difficulty: 3
        hints: ["Make B's number the same in both ratios: 1 : 2 = 3 : 6 and 3 : 4 = 6 : 8.", "A : B : C = 3 : 6 : 8."]
        solution: "Step 1: A : B : C = 3 : 6 : 8, 17 parts. Step 2: One part = 3400 ÷ 17 = 200. Step 3: C = 8 × 200 = 1600."
        mistakes: {"200": share_of_one_part, "1360": chain_ratio}
      - prompt: "A father divides 2.4 acres of land between two children in the ratio 5 : 7. How many acres more does the bigger share have?"
        answer: "0.4"
        check: "2.4/12*(7-5)"
        difficulty: 3
        hints: ["Split 2.4 acres into 12 equal parts.", "The bigger share has 2 parts more."]
        solution: "Step 1: One part = 2.4 ÷ 12 = 0.2 acre. Step 2: The difference is 2 parts = 0.4 acre."
        mistakes: {"1.4": bigger_minus_smaller, "0.2": share_of_one_part, "1": bigger_minus_smaller}
      - prompt: "500 ml of sugar syrup has sugar and water in the ratio 1 : 4. How many ml of water must be added to make the ratio 1 : 9?"
        answer: "500"
        check: "500/5*9 - 500/5*4"
        difficulty: 3
        hints: ["The sugar does not change. How much sugar is there?", "Sugar 100 ml needs 900 ml of water for 1 : 9."]
        solution: "Step 1: Sugar = 100 ml, water = 400 ml. Step 2: For 1 : 9, water must be 900 ml. Step 3: Add 900 − 400 = 500 ml."
        mistakes: {"900": mixture_one_part, "450": mixture_one_part, "250": added_difference}
      - prompt: '₹800 is shared between two sisters in the ratio 3 : 5. How many rupees does the younger sister, with the smaller share, get?'
        answer: '300'
        check: 800*3/8
        difficulty: 1
        hints:
        - 3 + 5 = 8 parts.
        - Each part is 800 ÷ 8.
        solution: 'Step 1: 8 parts. Step 2: Each part = ₹100. Step 3: Smaller share = 3 × 100 = ₹300.'
        mistakes:
          '500': share_of_one_part
      - prompt: 'A 45 m cloth is cut in the ratio 4 : 5. How many metres long is the longer piece?'
        answer: '25'
        check: 45*5/9
        difficulty: 1
        hints:
        - 4 + 5 = 9 parts.
        - 45 ÷ 9 = 5 m per part.
        solution: 'Step 1: 9 parts of 5 m. Step 2: Longer piece = 5 parts. Step 3: 5 × 5 = 25 m.'
        mistakes:
          '20': share_of_one_part
          '9': whole_divided_wrong
      - prompt: '₹1,200 is shared among three friends in the ratio 2 : 3 : 5. How many rupees does the friend with the middle share get?'
        answer: '360'
        check: 1200*3/10
        difficulty: 2
        hints:
        - 2 + 3 + 5 = 10 parts.
        - Each part is ₹120.
        solution: 'Step 1: 10 parts. Step 2: 1200 ÷ 10 = ₹120 a part. Step 3: Middle share = 3 × 120 = ₹360.'
        mistakes:
          '400': whole_divided_wrong
      - prompt: 'The angles of a triangle are in the ratio 1 : 2 : 3. What is the smallest angle, in degrees?'
        answer: '30'
        check: 180/6
        difficulty: 2
        hints:
        - The angles add to 180°.
        - 1 + 2 + 3 = 6 parts.
        solution: 'Step 1: 6 parts make 180°. Step 2: 1 part = 30°. Step 3: The smallest angle is 30° (the others are 60° and 90°).'
        mistakes:
          '60': share_of_one_part
      - prompt: 'Money is shared in the ratio 5 : 3. The bigger share is ₹350 more than the smaller. What is the total, in rupees?'
        answer: '1400'
        check: 350/2*8
        difficulty: 3
        hints:
        - The difference is 5 − 3 = 2 parts.
        - 2 parts = ₹350.
        solution: 'Step 1: 2 parts = ₹350, so 1 part = ₹175. Step 2: The total is 8 parts. Step 3: 8 × 175 = ₹1,400.'
        mistakes:
          '2800': bigger_minus_smaller
          '700': bigger_minus_smaller
      - prompt: 'A, B and C share ₹2,600. A : B = 3 : 4 and B : C = 2 : 3. How many rupees does A get?'
        answer: '600'
        check: 2600*3/13
        difficulty: 3
        hints:
        - 'Make B the same in both ratios: B : C = 4 : 6.'
        - 'So A : B : C = 3 : 4 : 6, which is 13 parts.'
        solution: 'Step 1: B : C = 2 : 3 = 4 : 6. Step 2: A : B : C = 3 : 4 : 6, 13 parts. Step 3: 2600 ÷ 13 = 200, so A gets 3 × 200 = ₹600.'
        mistakes:
          '1200': chain_ratio
