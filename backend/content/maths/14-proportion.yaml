# Class 9 Mathematics, chapter 14. Format: content/README.md.
# Also uses tips from earlier chapters: added_not_ratio, ratio_order, shares_not_added, forgot_divide.
subject: math
chapter: 14
title: Proportion

tips:
  ratio_not_simplified: "Divide both numbers by their biggest common factor to get the simplest form."
  added_difference: "In proportion, things change by multiplying, not by adding the same amount."
  direct_not_inverse: "When one goes up and the other goes down, the product stays the same: multiply, then divide."
  inverse_not_direct: "When both go up together, the ratio stays the same: find the amount for 1 first."
  share_of_one_part: "That is the size of one part. Multiply by the number of parts this person gets."
  whole_divided_wrong: "First add the ratio numbers to find how many parts the whole is split into."

concepts:
  - code: math9.prop.ratio
    title: Ratios
    notes: |
      A ratio a : b compares two quantities of the same kind by division. It does not change when
      both numbers are multiplied or divided by the same non-zero number, so 12 : 18 = 2 : 3. The
      order matters: boys to girls is not girls to boys. Ratios can be written as fractions a/b.
    explanations:
      text: "A class has 12 boys and 18 girls. The ratio of boys to girls is 12 : 18. Dividing both by 6 gives 2 : 3: for every 2 boys there are 3 girls. The ratio says how the two compare, not how many there are."
      visual: "Line up the students in groups of 5: 2 boys and 3 girls in each. You get 6 such groups. Each group shows the ratio 2 : 3."
      step_by_step: "Simplify 24 : 36. Step 1: The biggest number dividing both is 12. Step 2: 24 ÷ 12 = 2 and 36 ÷ 12 = 3. Step 3: The ratio is 2 : 3."
      real_world: "A recipe uses 2 cups of rice to 3 cups of water. For a bigger family, 4 cups of rice need 6 cups of water: the ratio 2 : 3 stays the same."
    items:
      - prompt: "A class has 12 boys and 18 girls. What is the ratio of boys to girls in simplest form?"
        options: ["2 : 3", "3 : 2", "12 : 30", "6 : 9"]
        answer: "2 : 3"
        difficulty: 1
        hints: ["Divide both numbers by 6."]
        solution: "12 : 18 = (12 ÷ 6) : (18 ÷ 6) = 2 : 3"
        mistakes: {"3 : 2": ratio_order, "6 : 9": ratio_not_simplified, "12 : 30": added_not_ratio}
      - prompt: "The ratio 4 : 5 is the same as 20 : ?. What is the missing number?"
        answer: "25"
        check: "20*5/4"
        difficulty: 1
        hints: ["4 was multiplied by 5 to get 20."]
        solution: "Step 1: 20 = 4 × 5. Step 2: 5 × 5 = 25."
        mistakes: {"21": added_difference}
      - prompt: "A school has teachers and students in the ratio 1 : 25. There are 40 teachers. How many students are there?"
        answer: "1000"
        check: "40*25"
        difficulty: 1
        hints: ["Each teacher goes with 25 students."]
        solution: "40 × 25 = 1000 students."
        mistakes: {"65": added_difference}
      - prompt: "In a bag, the ratio of red to blue beads is 3 : 7. There are 21 blue beads. How many red beads are there?"
        answer: "9"
        check: "21/7*3"
        difficulty: 2
        hints: ["7 parts are 21 beads, so 1 part is 3 beads."]
        solution: "Step 1: 1 part = 21 ÷ 7 = 3. Step 2: Red = 3 × 3 = 9."
        mistakes: {"17": added_difference, "49": ratio_order}
      - prompt: "A rectangle is 15 cm long and 10 cm wide. What fraction of the length is the width?"
        answer: "2/3"
        check: "Rational(10, 15)"
        difficulty: 2
        hints: ["Width ÷ length."]
        solution: "10/15 = 2/3"
        mistakes: {"3/2": ratio_order}
      - prompt: "Anu's height to Binu's height is 5 : 6. Binu's height to Chinnu's height is 4 : 5. What fraction of Chinnu's height is Anu's height?"
        answer: "2/3"
        check: "Rational(5, 6)*Rational(4, 5)"
        difficulty: 3
        hints: ["Anu/Chinnu = (Anu/Binu) × (Binu/Chinnu)."]
        solution: "Step 1: Anu/Binu = 5/6. Step 2: Binu/Chinnu = 4/5. Step 3: Anu/Chinnu = 5/6 × 4/5 = 20/30 = 2/3."
        mistakes: {"9/11": added_not_ratio}

  - code: math9.prop.direct
    title: Direct proportion
    after: [math9.prop.ratio]
    notes: |
      Two quantities are in direct proportion when one is always the same multiple of the other:
      y = kx. If one doubles, so does the other, and y/x stays constant. Solve by finding the value
      for one unit (the unitary method) or by keeping the ratio equal.
    explanations:
      text: "If 5 pens cost ₹60, then 1 pen costs ₹12, and 8 pens cost 8 × 12 = ₹96. Cost and number of pens are in direct proportion: the cost per pen stays the same, ₹12."
      visual: "Make a table: pens 1, 2, 3, 4, 5 and cost 12, 24, 36, 48, 60. Each row of cost is 12 times the pens. Plotted, the points lie on a straight line through (0, 0)."
      step_by_step: "A car goes 150 km on 10 litres. How far on 4 litres? Step 1: 1 litre goes 150 ÷ 10 = 15 km. Step 2: 4 litres go 4 × 15 = 60 km."
      real_world: "A shop sells rice at ₹45 per kg. 2 kg costs ₹90, 3 kg ₹135. The bill grows in step with the weight."
    items:
      - prompt: "5 pens cost ₹60. How many rupees do 8 pens cost?"
        answer: "96"
        check: "60/5*8"
        difficulty: 1
        hints: ["First find the cost of 1 pen."]
        solution: "Step 1: 1 pen = 60 ÷ 5 = ₹12. Step 2: 8 pens = 8 × 12 = ₹96."
        mistakes: {"63": added_difference, "12": share_of_one_part, "300/8": direct_not_inverse}
      - prompt: "Which of these pairs are in direct proportion?"
        options: ["Weight of rice bought and its cost", "Speed and time for a fixed journey", "Number of workers and days to finish a job", "Age and height of a person"]
        answer: "Weight of rice bought and its cost"
        difficulty: 1
        hints: ["Double one: does the other double too?"]
        solution: "Twice the rice costs twice as much. Speed and time, and workers and days, are inverse. Age and height are not in any fixed proportion."
        mistakes: {"Speed and time for a fixed journey": inverse_not_direct, "Number of workers and days to finish a job": inverse_not_direct}
      - prompt: "A car travels 150 km on 10 litres of petrol. How many km does it travel on 4 litres?"
        answer: "60"
        check: "150/10*4"
        difficulty: 2
        hints: ["Find the km for 1 litre."]
        solution: "Step 1: 150 ÷ 10 = 15 km per litre. Step 2: 4 × 15 = 60 km."
        mistakes: {"15": share_of_one_part, "375": direct_not_inverse}
      - prompt: "y is in direct proportion to x. When x = 4, y = 10. What is y when x = 6?"
        answer: "15"
        check: "Rational(10, 4)*6"
        difficulty: 2
        hints: ["y/x stays the same: 10/4."]
        solution: "Step 1: y = (10/4) × x. Step 2: y = 2.5 × 6 = 15."
        mistakes: {"12": added_difference, "20/3": direct_not_inverse}
      - prompt: "A map uses the scale 1 cm for 5 km. Two towns are 7.5 cm apart on the map. How many km apart are they?"
        answer: "37.5"
        check: "Rational(15, 2)*5"
        difficulty: 2
        hints: ["Each cm is 5 km."]
        solution: "7.5 × 5 = 37.5 km"
        mistakes: {"1.5": direct_not_inverse}
      - prompt: "A tap fills 3/4 of a tank in 9 minutes. At the same rate, how many minutes does it take to fill the whole tank?"
        answer: "12"
        check: "9/Rational(3, 4)"
        difficulty: 3
        hints: ["1/4 of the tank takes 9 ÷ 3 = 3 minutes."]
        solution: "Step 1: 3 quarters take 9 minutes, so 1 quarter takes 3. Step 2: 4 quarters take 12 minutes."
        mistakes: {"27/4": direct_not_inverse, "3": share_of_one_part}

  - code: math9.prop.inverse
    title: Inverse proportion
    after: [math9.prop.direct]
    notes: |
      Two quantities are in inverse proportion when their product stays constant: xy = k. If one
      doubles, the other halves. Typical cases: workers and days for a fixed job, speed and time for
      a fixed distance. Find the constant product first, then divide.
    explanations:
      text: "6 workers finish a wall in 10 days. The job is 6 × 10 = 60 worker-days. With 4 workers it takes 60 ÷ 4 = 15 days. More workers, fewer days; fewer workers, more days."
      visual: "Picture 60 bricks to lay, one brick per worker per day. Arrange them in a rectangle: 6 rows of 10, or 4 rows of 15, or 12 rows of 5. The total, the area, never changes."
      step_by_step: "A bus at 40 km/h takes 3 hours. How long at 60 km/h? Step 1: Distance = 40 × 3 = 120 km. Step 2: Time = 120 ÷ 60 = 2 hours."
      real_world: "Food stocked for 20 campers for 9 days lasts only 6 days if 30 campers come: 20 × 9 = 180 camper-days, and 180 ÷ 30 = 6."
    items:
      - prompt: "6 workers can build a wall in 10 days. How many days will 4 workers take?"
        answer: "15"
        check: "6*10/4"
        difficulty: 1
        hints: ["Total work = 6 × 10 worker-days."]
        solution: "Step 1: 6 × 10 = 60 worker-days. Step 2: 60 ÷ 4 = 15 days."
        mistakes: {"20/3": inverse_not_direct, "12": added_difference}
      - prompt: "A bus at 40 km/h takes 3 hours for a journey. How many hours does it take at 60 km/h?"
        answer: "2"
        check: "40*3/60"
        difficulty: 1
        hints: ["Find the distance first."]
        solution: "Step 1: 40 × 3 = 120 km. Step 2: 120 ÷ 60 = 2 hours."
        mistakes: {"9/2": inverse_not_direct}
      - prompt: "x and y are in inverse proportion. When x = 8, y = 3. What is y when x = 12?"
        answer: "2"
        check: "8*3/12"
        difficulty: 2
        hints: ["x × y stays 24."]
        solution: "Step 1: 8 × 3 = 24. Step 2: y = 24 ÷ 12 = 2."
        mistakes: {"9/2": inverse_not_direct}
      - prompt: "Food in a camp lasts 20 people for 9 days. For how many days will it last 30 people?"
        answer: "6"
        check: "20*9/30"
        difficulty: 2
        hints: ["20 × 9 = 180 person-days."]
        solution: "Step 1: 20 × 9 = 180 person-days. Step 2: 180 ÷ 30 = 6 days."
        mistakes: {"27/2": inverse_not_direct}
      - prompt: "Which table shows x and y in inverse proportion?"
        options: ["x: 2, 4, 8 and y: 12, 6, 3", "x: 2, 4, 8 and y: 3, 6, 12", "x: 2, 4, 8 and y: 12, 10, 6", "x: 2, 4, 8 and y: 5, 7, 11"]
        answer: "x: 2, 4, 8 and y: 12, 6, 3"
        difficulty: 2
        hints: ["Multiply x and y in each pair."]
        solution: "2 × 12 = 4 × 6 = 8 × 3 = 24, so the product stays the same."
        mistakes: {"x: 2, 4, 8 and y: 3, 6, 12": inverse_not_direct, "x: 2, 4, 8 and y: 12, 10, 6": added_difference}
      - prompt: "12 pipes fill a tank in 5 hours. How many pipes are needed to fill it in 3 hours?"
        answer: "20"
        check: "12*5/3"
        difficulty: 3
        hints: ["12 × 5 = 60 pipe-hours."]
        solution: "Step 1: 12 × 5 = 60 pipe-hours. Step 2: 60 ÷ 3 = 20 pipes."
        mistakes: {"36/5": inverse_not_direct}

  - code: math9.prop.sharing
    title: Sharing in a ratio
    after: [math9.prop.ratio]
    notes: |
      To share an amount in the ratio a : b, split it into a + b equal parts; one person gets a parts
      and the other b. For three people a : b : c, use a + b + c parts. Check: the shares add up to the
      whole.
    explanations:
      text: "Share ₹500 between Ravi and Sita in the ratio 2 : 3. There are 2 + 3 = 5 parts, so each part is ₹100. Ravi gets 2 parts, ₹200, and Sita 3 parts, ₹300. Check: 200 + 300 = 500."
      visual: "Draw a bar for ₹500 and cut it into 5 equal pieces of ₹100. Colour 2 pieces for Ravi and 3 for Sita."
      step_by_step: "Share 72 sweets in the ratio 1 : 2 : 3. Step 1: Parts: 1 + 2 + 3 = 6. Step 2: One part = 72 ÷ 6 = 12. Step 3: Shares: 12, 24 and 36."
      real_world: "Two friends put ₹3,000 and ₹2,000 into a stall and make a profit of ₹1,500. Shared fairly in the ratio 3 : 2, they get ₹900 and ₹600."
    items:
      - prompt: "₹500 is shared between Ravi and Sita in the ratio 2 : 3. How many rupees does Ravi get?"
        answer: "200"
        check: "500/(2 + 3)*2"
        difficulty: 1
        hints: ["2 + 3 = 5 parts."]
        solution: "Step 1: 500 ÷ 5 = 100 per part. Step 2: Ravi: 2 × 100 = ₹200."
        mistakes: {"100": share_of_one_part, "300": swapped_parts, "250": whole_divided_wrong}
      - prompt: "A rope 60 m long is cut in the ratio 1 : 4. How many metres long is the shorter piece?"
        answer: "12"
        check: "60/(1 + 4)"
        difficulty: 1
        hints: ["1 + 4 = 5 parts."]
        solution: "60 ÷ 5 = 12 m for one part; the shorter piece is 1 part."
        mistakes: {"15": whole_divided_wrong, "48": swapped_parts}
      - prompt: "72 sweets are shared among three children in the ratio 1 : 2 : 3. How many does the child with the biggest share get?"
        answer: "36"
        check: "72/(1 + 2 + 3)*3"
        difficulty: 2
        hints: ["1 + 2 + 3 = 6 parts."]
        solution: "Step 1: 72 ÷ 6 = 12. Step 2: 3 × 12 = 36."
        mistakes: {"12": share_of_one_part, "24": whole_divided_wrong}
      - prompt: "Two friends invest ₹3,000 and ₹2,000 and share a profit of ₹1,500 in the ratio of their money. How many rupees does the first friend get?"
        answer: "900"
        check: "1500/(3 + 2)*3"
        difficulty: 2
        hints: ["The ratio is 3000 : 2000 = 3 : 2."]
        solution: "Step 1: 3 + 2 = 5 parts. Step 2: 1500 ÷ 5 = 300. Step 3: 3 × 300 = ₹900."
        mistakes: {"600": swapped_parts, "300": share_of_one_part, "500": whole_divided_wrong}
      - prompt: "Money is shared in the ratio 4 : 5. The smaller share is ₹240. What was the total amount in rupees?"
        answer: "540"
        check: "240/4*(4 + 5)"
        difficulty: 3
        hints: ["4 parts are ₹240, so 1 part is ₹60."]
        solution: "Step 1: 1 part = 240 ÷ 4 = 60. Step 2: 9 parts = 9 × 60 = ₹540."
        mistakes: {"300": shares_not_added, "60": share_of_one_part}
      - prompt: "The angles of a triangle are in the ratio 2 : 3 : 4. What is the largest angle in degrees?"
        answer: "80"
        check: "180/(2 + 3 + 4)*4"
        difficulty: 3
        hints: ["The angles add up to 180°.", "2 + 3 + 4 = 9 parts."]
        solution: "Step 1: 180 ÷ 9 = 20. Step 2: 4 × 20 = 80°."
        mistakes: {"20": share_of_one_part, "45": whole_divided_wrong}
