# Class 9 Mathematics, chapter 7. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_divide, swapped_unknowns, doubled_not_squared.
subject: math
chapter: 7
title: Negative Numbers

tips:
  sign_slip: "Picture the number line: adding moves right, taking away moves left. Check which side of zero you end up."
  minus_negative: "Taking away a negative is the same as adding: 5 − (−2) = 5 + 2."
  bigger_negative: "On the number line, −7 is further left than −2, so −7 is the smaller number."
  sign_rule: "Different signs give a negative answer; the same signs give a positive answer. This works for × and ÷."
  count_negatives: "Count the negative signs: an even number of them makes a positive answer, an odd number a negative one."
  square_of_negative: "(−3)² = (−3) × (−3) = 9. The square of a negative number is positive."
  times_not_plus: "3x means 3 × x, not 3 + x."
  wrong_inverse: "Undo each step with its opposite: undo + 8 by taking away 8 from both sides, undo × by ÷."

concepts:
  - code: math9.neg.add_subtract
    title: Adding and subtracting negative numbers
    notes: |
      On the number line, adding a positive number moves right and adding a negative number moves
      left. Subtracting a number is the same as adding its negative, so 5 − (−2) = 5 + 2 = 7 and
      −7 − (−3) = −7 + 3 = −4. Of two negative numbers, the one further from zero is smaller.
    explanations:
      text: "Think of a number line. −3 + 5 starts at −3 and moves 5 steps right, ending at 2. −4 − 6 starts at −4 and moves 6 steps left, ending at −10. Taking away a negative turns around: 5 − (−2) = 5 + 2 = 7."
      visual: "Picture a lift in a building with floors below the ground: floor −3 is three floors underground. From floor −3, going up 5 floors brings you to floor 2. From floor −4, going down 6 floors brings you to floor −10."
      step_by_step: "For −7 − (−3): Step 1: Taking away −3 is the same as adding 3. Step 2: So it is −7 + 3. Step 3: Start at −7 and move 3 right. Step 4: You reach −4."
      real_world: "If you owe a friend ₹7, your money is −7. If the friend lets you off ₹3 of that debt, it's like taking away −3: you now owe ₹4, so your money is −4."
    items:
      - prompt: "What is −3 + 5?"
        answer: "2"
        check: "-3 + 5"
        difficulty: 1
        hints: ["Start at −3 on the number line.", "Move 5 to the right."]
        solution: "Step 1: Start at −3. Step 2: Move 5 right. Step 3: You reach 2."
        mistakes: {"-8": sign_slip, "-2": sign_slip, "8": sign_slip}
      - prompt: "What is −4 − 6?"
        answer: "-10"
        check: "-4 - 6"
        difficulty: 1
        hints: ["Start at −4 and move 6 to the left."]
        solution: "Step 1: Start at −4. Step 2: Move 6 left. Step 3: You reach −10."
        mistakes: {"2": sign_slip, "-2": sign_slip, "10": sign_slip}
      - prompt: "What is 5 − (−2)?"
        answer: "7"
        check: "5 - (-2)"
        difficulty: 1
        hints: ["Taking away a negative is the same as adding."]
        solution: "Step 1: 5 − (−2) = 5 + 2. Step 2: = 7."
        mistakes: {"3": minus_negative}
      - prompt: "Which of these numbers is the smallest?"
        options: ["−7", "−2", "0", "3"]
        answer: "−7"
        difficulty: 1
        hints: ["The smallest number is furthest to the left on the number line."]
        solution: "Step 1: On the number line the order is −7, −2, 0, 3. Step 2: −7 is furthest left, so it is the smallest."
        mistakes: {"−2": bigger_negative, "0": bigger_negative}
      - prompt: "What is −7 − (−3)?"
        answer: "-4"
        check: "-7 - (-3)"
        difficulty: 2
        hints: ["Taking away −3 is the same as adding 3.", "−7 + 3 = ?"]
        solution: "Step 1: −7 − (−3) = −7 + 3. Step 2: = −4."
        mistakes: {"-10": minus_negative, "4": sign_slip}
      - prompt: "At night it is −2°C. By noon the temperature has risen by 9 degrees. What is the noon temperature, in °C?"
        answer: "7"
        check: "-2 + 9"
        difficulty: 2
        hints: ["Start at −2 and move 9 up."]
        solution: "Step 1: −2 + 9. Step 2: = 7°C."
        mistakes: {"11": sign_slip, "-11": sign_slip}
      - prompt: "What is −12 + 5 − (−4) − 8?"
        answer: "-11"
        check: "-12 + 5 - (-4) - 8"
        difficulty: 3
        hints: ["Work from left to right.", "−(−4) is +4."]
        solution: "Step 1: −12 + 5 = −7. Step 2: −7 + 4 = −3. Step 3: −3 − 8 = −11."
        mistakes: {"-19": minus_negative}

  - code: math9.neg.multiply_divide
    title: Multiplying and dividing with negatives
    after: [math9.neg.add_subtract]
    notes: |
      positive × negative = negative, negative × negative = positive, and the same for division.
      With several factors, count the negatives: an even number gives a positive product, an odd
      number a negative one. (−3)² = 9.
    explanations:
      text: "Multiplying by a negative number flips the sign. So −4 × 3 = −12, and −5 × −6 = +30, because the second minus flips the sign back. Division follows the same rule: −24 ÷ 6 = −4 and −36 ÷ −9 = 4."
      visual: "Look at the pattern: 3 × −2 = −6, 2 × −2 = −4, 1 × −2 = −2, 0 × −2 = 0. Each step adds 2. Keep going: −1 × −2 = 2, −2 × −2 = 4. A negative times a negative comes out positive."
      step_by_step: "For (−2) × (−3) × (−5): Step 1: Count the minus signs: 3. Step 2: An odd number, so the answer is negative. Step 3: Multiply the numbers: 2 × 3 × 5 = 30. Step 4: Answer: −30."
      real_world: "A tank loses 4 litres an hour, so its change is −4 litres per hour. Three hours ago it had 3 × 4 = 12 litres more than now: going back in time (−3 hours) × losing (−4) gives +12."
    items:
      - prompt: "What is −4 × 3?"
        answer: "-12"
        check: "-4*3"
        difficulty: 1
        hints: ["Different signs give a negative answer."]
        solution: "Step 1: 4 × 3 = 12. Step 2: Different signs, so −12."
        mistakes: {"12": sign_rule}
      - prompt: "What is −5 × −6?"
        answer: "30"
        check: "(-5)*(-6)"
        difficulty: 1
        hints: ["The same signs give a positive answer."]
        solution: "Step 1: 5 × 6 = 30. Step 2: Same signs, so +30."
        mistakes: {"-30": sign_rule}
      - prompt: "What is −24 ÷ 6?"
        answer: "-4"
        check: "-24/6"
        difficulty: 1
        hints: ["Different signs give a negative answer, for division too."]
        solution: "Step 1: 24 ÷ 6 = 4. Step 2: Different signs, so −4."
        mistakes: {"4": sign_rule}
      - prompt: "What is −36 ÷ −9?"
        answer: "4"
        check: "(-36)/(-9)"
        difficulty: 2
        hints: ["The same signs give a positive answer."]
        solution: "Step 1: 36 ÷ 9 = 4. Step 2: Same signs, so +4."
        mistakes: {"-4": sign_rule}
      - prompt: "What is (−2) × (−3) × (−5)?"
        answer: "-30"
        check: "(-2)*(-3)*(-5)"
        difficulty: 2
        hints: ["Count the minus signs.", "Three is odd."]
        solution: "Step 1: 2 × 3 × 5 = 30. Step 2: Three negatives, an odd number, so −30."
        mistakes: {"30": count_negatives}
      - prompt: "What is (−1) × (−1) × (−1) × (−1)?"
        answer: "1"
        check: "(-1)^4"
        difficulty: 3
        hints: ["Four minus signs: even or odd?"]
        solution: "Step 1: 1 × 1 × 1 × 1 = 1. Step 2: Four negatives, an even number, so +1."
        mistakes: {"-1": count_negatives, "-4": count_negatives}
      - prompt: "What is (−3)²?"
        answer: "9"
        check: "(-3)^2"
        difficulty: 3
        hints: ["(−3)² means (−3) × (−3)."]
        solution: "Step 1: (−3) × (−3). Step 2: Same signs, so +9."
        mistakes: {"-9": square_of_negative, "-6": doubled_not_squared, "6": doubled_not_squared}

  - code: math9.neg.substitute
    title: Putting negative numbers into expressions
    after: [math9.neg.multiply_divide]
    notes: |
      Put the negative number in brackets, then use the sign rules: if x = −2 then 3x = 3 × (−2) = −6,
      x² = (−2)² = 4 and x³ = −8. Work out powers first, then multiplication, then addition.
    explanations:
      text: "When x is a negative number, write it in brackets before working anything out. If x = −3, then x² = (−3)² = 9, 2x = 2 × (−3) = −6 and x + 7 = −3 + 7 = 4. The brackets stop the minus sign from getting lost."
      visual: "Picture a box with x written on it. Take the x out and drop (−3) into the box, brackets and all. So 2x² − x becomes 2(−3)² − (−3)."
      step_by_step: "For 2x² − 3x + 1 with x = −1: Step 1: Replace x with (−1): 2(−1)² − 3(−1) + 1. Step 2: Powers first: (−1)² = 1, so 2 × 1 = 2. Step 3: −3 × (−1) = +3. Step 4: 2 + 3 + 1 = 6."
      real_world: "A shop's daily profit is 50n − 400 rupees, where n is the number of items sold. On a bad day the formula can go negative: with n = 6, the profit is 300 − 400 = −₹100, a loss."
    items:
      - prompt: "x = −2. What is 3x?"
        answer: "-6"
        check: "3*(-2)"
        difficulty: 1
        hints: ["3x = 3 × (−2)."]
        solution: "Step 1: 3x = 3 × (−2). Step 2: = −6."
        mistakes: {"6": sign_rule, "1": times_not_plus}
      - prompt: "x = −4. What is x + 7?"
        answer: "3"
        check: "-4 + 7"
        difficulty: 1
        hints: ["−4 + 7: start at −4, move 7 right."]
        solution: "Step 1: x + 7 = −4 + 7. Step 2: = 3."
        mistakes: {"11": sign_slip, "-11": sign_slip, "-3": sign_slip}
      - prompt: "x = −3. What is x²?"
        answer: "9"
        check: "(-3)^2"
        difficulty: 2
        hints: ["x² = (−3) × (−3)."]
        solution: "Step 1: x² = (−3)². Step 2: = 9."
        mistakes: {"-9": square_of_negative, "-6": doubled_not_squared}
      - prompt: "a = −2 and b = 5. What is ab − b?"
        answer: "-15"
        check: "(-2)*5 - 5"
        difficulty: 2
        hints: ["ab = (−2) × 5 = −10."]
        solution: "Step 1: ab = −10. Step 2: −10 − 5 = −15."
        mistakes: {"-5": sign_slip, "5": sign_rule}
      - prompt: "x = −1. What is 2x² − 3x + 1?"
        answer: "6"
        check: "2*(-1)^2 - 3*(-1) + 1"
        difficulty: 2
        hints: ["(−1)² = 1.", "−3 × (−1) = +3."]
        solution: "Step 1: 2(−1)² − 3(−1) + 1. Step 2: = 2 + 3 + 1. Step 3: = 6."
        mistakes: {"0": sign_rule, "2": square_of_negative}
      - prompt: "x = −2. What is x³?"
        answer: "-8"
        check: "(-2)^3"
        difficulty: 3
        hints: ["x³ = (−2) × (−2) × (−2).", "Three negatives."]
        solution: "Step 1: 2 × 2 × 2 = 8. Step 2: Three negatives, so −8."
        mistakes: {"8": count_negatives}
      - prompt: "x = −5. What is (x − 3)(x + 5)?"
        answer: "0"
        check: "(-5 - 3)*(-5 + 5)"
        difficulty: 3
        hints: ["Work out each bracket first.", "x + 5 = 0."]
        solution: "Step 1: x − 3 = −8 and x + 5 = 0. Step 2: −8 × 0 = 0."

  - code: math9.neg.equations
    title: Equations with negative answers
    after: [math9.neg.substitute]
    notes: |
      Equations are solved the same way when the answer is negative: x + 8 = 3 gives x = 3 − 8 = −5;
      2x + 9 = 1 gives 2x = −8, x = −4; −3x = 12 gives x = −4. Pairs of equations can also have
      negative solutions.
    explanations:
      text: "Negative answers come up naturally. x + 8 = 3 asks: what plus 8 gives 3? Take 8 from both sides: x = 3 − 8 = −5. Check: −5 + 8 = 3. Solve exactly as before, and use the sign rules carefully."
      visual: "Picture a balance with x and 8 weights on one side and 3 on the other. Take 8 off both sides. The left side has just x, the right has 3 − 8, which is 5 below zero: −5."
      step_by_step: "For 2x + 9 = 1: Step 1: Take 9 from both sides: 2x = −8. Step 2: Divide both sides by 2: x = −4. Step 3: Check: 2 × (−4) + 9 = −8 + 9 = 1."
      real_world: "A bank account had ₹500. After a bill of ₹x is paid, the balance is −₹150 (overdrawn). So 500 − x = −150, which gives x = 650: the bill was ₹650."
    items:
      - prompt: "x + 8 = 3. What is x?"
        answer: "-5"
        check: "3 - 8"
        difficulty: 1
        hints: ["Take 8 from both sides."]
        solution: "Step 1: x = 3 − 8. Step 2: x = −5. Step 3: Check: −5 + 8 = 3."
        mistakes: {"5": sign_slip, "11": wrong_inverse}
      - prompt: "x − 4 = −10. What is x?"
        answer: "-6"
        check: "-10 + 4"
        difficulty: 1
        hints: ["Add 4 to both sides."]
        solution: "Step 1: x = −10 + 4. Step 2: x = −6."
        mistakes: {"-14": wrong_inverse, "6": sign_slip}
      - prompt: "2x + 9 = 1. What is x?"
        answer: "-4"
        check: "(1 - 9)/2"
        difficulty: 2
        hints: ["Take 9 from both sides first.", "2x = −8."]
        solution: "Step 1: 2x = 1 − 9 = −8. Step 2: x = −4."
        mistakes: {"5": wrong_inverse, "4": sign_slip, "-8": forgot_divide}
      - prompt: "−3x = 12. What is x?"
        answer: "-4"
        check: "12/(-3)"
        difficulty: 2
        hints: ["Divide both sides by −3."]
        solution: "Step 1: x = 12 ÷ (−3). Step 2: x = −4."
        mistakes: {"4": sign_rule, "15": wrong_inverse}
      - prompt: "A bank account has ₹500. After a bill of ₹x is paid, the balance is −₹150. What is x?"
        answer: "650"
        check: "500 - (-150)"
        difficulty: 2
        hints: ["500 − x = −150.", "x = 500 − (−150)."]
        solution: "Step 1: 500 − x = −150. Step 2: x = 500 + 150. Step 3: x = 650."
        mistakes: {"350": sign_slip}
      - prompt: "x + y = 2 and x − y = 8. What is y?"
        answer: "-3"
        check: "(2 - 8)/2"
        difficulty: 3
        hints: ["Subtract the equations: 2y = 2 − 8."]
        solution: "Step 1: Subtracting, 2y = −6. Step 2: y = −3. Step 3: Then x = 5."
        mistakes: {"3": sign_slip, "5": swapped_unknowns}
      - prompt: "The sum of two numbers is −4 and their difference is 10. What is the smaller number?"
        answer: "-7"
        check: "(-4 - 10)/2"
        difficulty: 3
        hints: ["Smaller = (sum − difference) ÷ 2."]
        solution: "Step 1: (−4 − 10) ÷ 2 = −14 ÷ 2. Step 2: = −7. Step 3: The bigger number is 3, and 3 − (−7) = 10."
        mistakes: {"7": sign_slip, "3": swapped_unknowns, "-14": forgot_divide}
