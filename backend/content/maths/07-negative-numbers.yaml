# Class 9 Mathematics, chapter 7. Format: content/README.md.
# Also uses tips from earlier chapters: forgot_divide, swapped_unknowns, doubled_not_squared.
subject: math
chapter: 7
title: Negative Numbers

tips:
  sign_slip: "Picture the number line: adding moves right, taking away moves left. Check which side of zero you end up."
  minus_negative: "Taking away a negative is the same as adding: 6 − (−4) = 6 + 4. Change each '− (−…)' to '+' before you work it out, and remove brackets carefully, changing every sign inside a bracket with − in front."
  bigger_negative: "On the number line, −7 is further left than −2, so −7 is the smaller number."
  sign_rule: "Different signs give a negative answer; the same signs give a positive answer. This works for × and ÷."
  count_negatives: "Count the negative signs: an even number of them makes a positive answer, an odd number a negative one."
  square_of_negative: "A negative times a negative is positive, so (−4)² = 16, not −16. Square the number before using any other signs in front."
  times_not_plus: "3x means 3 × x, not 3 + x."
  wrong_inverse: "Undo each step with its opposite: undo + 8 by taking away 8 from both sides, undo × by ÷."
  zero_factor: "Put the value of x into each bracket separately. If either bracket works out to nothing, what does that make the whole product?"

concepts:
  - code: math9.neg.add_subtract
    title: Adding and subtracting negative numbers
    notes: |
      On the number line, adding a positive number moves right and adding a negative number moves
      left. Subtracting a number is the same as adding its negative, so 5 − (−2) = 5 + 2 = 7 and
      −7 − (−3) = −7 + 3 = −4. Of two negative numbers, the one further from zero is smaller.
    explanations:
      text: "Think of a number line. −3 + 5 starts at −3 and moves 5 steps right, ending at 2. −4 − 6 starts at −4 and moves 6 steps left, ending at −10. Taking away a negative turns around: 5 − (−2) = 5 + 2 = 7."
      visual: "Picture a lift in a building with floors below the ground: floor −3 is three floors underground. From floor −3, going up 5 floors brings you to floor 2. From floor −4, going down 6 floors brings you to floor −10."
      step_by_step: "For −7 − (−3): Step 1: Taking away −3 is the same as adding 3. Step 2: So it is −7 + 3. Step 3: Start at −7 and move 3 right. Step 4: You reach −4."
      real_world: "If you owe a friend ₹7, your money is −7. If the friend lets you off ₹3 of that debt, it's like taking away −3: you now owe ₹4, so your money is −4."
    picture:
      kind: number_line
      from: -4
      to: 3
      step: 1
      points:
      - {at: -3, label: start}
      - {at: 2, label: end}
      jumps:
      - {from: -3, to: 2, label: up 5}
      caption: '−3 + 5 = 2: from floor −3, go up 5 floors to floor 2.'
      alt: A number line from −4 to 3. Starting at −3 and jumping up 5 lands on 2, showing −3 + 5 = 2.
    activity:
      type: number_line
      min: -10
      max: 10
      step: 1
      start: 3
      prompt: Adding moves right; subtracting moves left. The marker starts at 3.
      goals:
      - prompt: Work out 3 − 8.
        target: -5
        mistakes:
        - when:
            v:
            - 6
            - 10
          say: 'That is to the right of 3: you added. Subtracting 8 moves 8 steps left, past 0.'
        - when:
            v: 5
          say: '5 is 8 − 3: the numbers swapped places. Start at 3 and move 8 to the left, past 0.'
      - prompt: 'Now from there, add 7: −5 + 7.'
        target: 2
        mistakes:
        - when:
            v:
            - -10
            - -6
          say: 'That is to the left of −5: you took 7 away. Adding 7 moves 7 steps right.'
      - prompt: 'Now 2 − (−4): subtracting a negative moves right.'
        target: 6
        mistakes:
        - when:
            v: -2
          say: '−2 is 2 − 4: you took away 4. But you''re taking away −4, a debt. Taking away a debt leaves you better off, so you move right.'
    lesson:
      - teach: 'Numbers below zero are negative: −1, −2, −3… A thermometer shows them: 3 degrees below freezing is −3°C. On a number line, negative numbers sit to the left of 0, and the further left, the smaller the number. So −7 is smaller than −2.'
        picture:
          kind: number_line
          from: -8
          to: 3
          step: 1
          points:
          - at: -7
            label: −7
          - at: -2
            label: −2
          - at: 0
            label: '0'
          alt: 'A number line from −8 to 3: −7 is further left than −2, so it is smaller.'
        check:
          prompt: 'Which is smaller: −5 or −1?'
          options:
          - −5
          - −1
          answer: −5
          why: '−5 is further left of zero on the number line, so it is smaller. Think of −5°C: colder than −1°C.'
      - teach: 'Adding a positive number moves right; adding a negative number moves left. −3 + 5: start at −3, move 5 right, land on 2. 4 + (−6): start at 4, move 6 left, land on −2.'
        check:
          prompt: What is −2 + 6?
          options:
          - '4'
          - −8
          - −4
          answer: '4'
          why: 'Start at −2 and move 6 steps right: −1, 0, 1, 2, 3, 4.'
      - teach: 'Subtracting a number is the same as adding its opposite. 5 − (−2) = 5 + 2 = 7: taking away a debt of 2 leaves you 2 better off. And −7 − (−3) = −7 + 3 = −4.'
        check:
          prompt: What is 3 − (−4)?
          options:
          - '7'
          - −1
          - '1'
          answer: '7'
          why: 'Subtracting −4 is adding 4: 3 + 4 = 7.'
    items:
      - prompt: "What is −3 + 5?"
        answer: "2"
        check: "-3 + 5"
        difficulty: 1
        hints: ["Start at −3 on the number line.", "Move 5 to the right."]
        solution: "Step 1: Start at −3. Step 2: Move 5 right. Step 3: You reach 2."
        mistakes: {"-8": sign_slip, "-2": sign_slip, "8": sign_slip}
      - prompt: "What is −4 − 6?"
        answer: "-10"
        check: "-4 - 6"
        difficulty: 1
        hints: ["Start at −4 and move 6 to the left."]
        solution: "Step 1: Start at −4. Step 2: Move 6 left. Step 3: You reach −10."
        mistakes: {"2": sign_slip, "-2": sign_slip, "10": sign_slip}
      - prompt: "What is 5 − (−2)?"
        answer: "7"
        check: "5 - (-2)"
        difficulty: 1
        hints: ["Taking away a negative is the same as adding."]
        solution: "Step 1: 5 − (−2) = 5 + 2. Step 2: = 7."
        mistakes: {"3": minus_negative}
      - prompt: "Which of these numbers is the smallest?"
        options: ["−7", "−2", "0", "3"]
        answer: "−7"
        difficulty: 1
        hints: ["The smallest number is furthest to the left on the number line."]
        solution: "Step 1: On the number line the order is −7, −2, 0, 3. Step 2: −7 is furthest left, so it is the smallest."
        mistakes: {"−2": bigger_negative, "0": bigger_negative}
      - prompt: "What is −7 − (−3)?"
        answer: "-4"
        check: "-7 - (-3)"
        difficulty: 2
        hints: ["Taking away −3 is the same as adding 3.", "−7 + 3 = ?"]
        solution: "Step 1: −7 − (−3) = −7 + 3. Step 2: = −4."
        mistakes: {"-10": minus_negative, "4": sign_slip}
      - prompt: "At night it is −2°C. By noon the temperature has risen by 9 degrees. What is the noon temperature, in °C?"
        answer: "7"
        check: "-2 + 9"
        difficulty: 2
        hints: ["Start at −2 and move 9 up."]
        solution: "Step 1: −2 + 9. Step 2: = 7°C."
        mistakes: {"11": sign_slip, "-11": sign_slip}
      - prompt: "What is −12 + 5 − (−4) − 8?"
        answer: "-11"
        check: "-12 + 5 - (-4) - 8"
        difficulty: 3
        hints: ["Work from left to right.", "−(−4) is +4."]
        solution: "Step 1: −12 + 5 = −7. Step 2: −7 + 4 = −3. Step 3: −3 − 8 = −11."
        mistakes: {"-19": minus_negative}
      - prompt: "What is −15 + 8 − (−3)?"
        answer: "-4"
        check: "-15 + 8 + 3"
        difficulty: 2
        hints: ["Subtracting −3 is the same as adding 3.", "−15 + 8 = −7."]
        solution: "Step 1: −15 + 8 = −7. Step 2: −7 − (−3) = −7 + 3 = −4."
        mistakes: {"-10": minus_negative, "4": sign_slip}
      - prompt: "A diver is 12 m below sea level. She swims up 5 m, then down 9 m. How far below sea level is she now, in metres? Give a positive number."
        answer: "16"
        check: "12 - 5 + 9"
        difficulty: 3
        hints: ["Write her depth as −12, then add +5 and −9.", "−12 + 5 − 9 = ?"]
        solution: "Step 1: −12 + 5 = −7. Step 2: −7 − 9 = −16. Step 3: She is 16 m below sea level."
        mistakes: {"26": sign_slip, "8": sign_slip}
      - prompt: "The temperature fell from 4°C to −11°C. By how many degrees did it fall?"
        answer: "15"
        check: "4 - (-11)"
        difficulty: 3
        hints: ["Find the distance from 4 down to −11.", "4 − (−11)."]
        solution: "Step 1: From 4 down to 0 is 4 degrees. Step 2: From 0 down to −11 is 11 more. Step 3: 4 + 11 = 15 degrees."
        mistakes: {"7": minus_negative, "-15": sign_slip}
      - prompt: What is −8 + 3?
        answer: '-5'
        check: -8 + 3
        difficulty: 1
        hints:
        - Start at −8 on the number line.
        - Adding 3 moves 3 steps right.
        solution: 'Step 1: Start at −8. Step 2: Move 3 to the right: −7, −6, −5. Step 3: So −8 + 3 = −5.'
        mistakes:
          '5': sign_slip
          '-11': sign_slip
      - prompt: What is −6 − 4?
        answer: '-10'
        check: -6 - 4
        difficulty: 1
        hints:
        - Subtracting 4 moves 4 steps left.
        - Start at −6 and go further below zero.
        solution: 'Step 1: Start at −6. Step 2: Move 4 to the left. Step 3: You land on −10.'
        mistakes:
          '-2': sign_slip
          '10': sign_slip
      - prompt: Which of these numbers is the largest?
        options:
        - −1
        - −3
        - −10
        - −25
        answer: −1
        difficulty: 1
        hints:
        - On the number line, larger numbers are further right.
        - Which is closest to zero?
        solution: 'Step 1: All four are negative. Step 2: The one closest to zero is furthest right. Step 3: That is −1.'
        mistakes:
          −25: bigger_negative
      - prompt: What is −9 − (−5)?
        answer: '-4'
        check: -9 - (-5)
        difficulty: 2
        hints:
        - Subtracting −5 is the same as adding 5.
        - −9 + 5.
        solution: 'Step 1: −9 − (−5) = −9 + 5. Step 2: Start at −9, move 5 right. Step 3: = −4.'
        mistakes:
          '-14': minus_negative
      - prompt: In Shimla the temperature is −4°C. In Kochi it is 29°C. How many degrees warmer is Kochi?
        answer: '33'
        check: 29 - (-4)
        difficulty: 2
        hints:
        - 'Find the difference: 29 − (−4).'
        - Subtracting −4 means adding 4.
        solution: 'Step 1: Difference = 29 − (−4). Step 2: = 29 + 4. Step 3: = 33 degrees.'
        mistakes:
          '25': minus_negative
      - prompt: What is 7 − 15 + (−6) − (−10)?
        answer: '-4'
        check: 7 - 15 + (-6) - (-10)
        difficulty: 3
        hints:
        - Go left to right.
        - 7 − 15 = −8 to start.
        solution: 'Step 1: 7 − 15 = −8. Step 2: −8 + (−6) = −14. Step 3: −14 − (−10) = −14 + 10 = −4.'
        mistakes:
          '-24': minus_negative

  - code: math9.neg.multiply_divide
    title: Multiplying and dividing with negatives
    after: [math9.neg.add_subtract]
    notes: |
      positive × negative = negative, negative × negative = positive, and the same for division.
      With several factors, count the negatives: an even number gives a positive product, an odd
      number a negative one. (−3)² = 9.
    explanations:
      text: "Multiplying by a negative number flips the sign. So −4 × 3 = −12, and −5 × −6 = +30, because the second minus flips the sign back. Division follows the same rule: −24 ÷ 6 = −4 and −36 ÷ −9 = 4."
      visual: "Look at the pattern: 3 × −2 = −6, 2 × −2 = −4, 1 × −2 = −2, 0 × −2 = 0. Each step adds 2. Keep going: −1 × −2 = 2, −2 × −2 = 4. A negative times a negative comes out positive."
      step_by_step: "For (−2) × (−3) × (−5): Step 1: Count the minus signs: 3. Step 2: An odd number, so the answer is negative. Step 3: Multiply the numbers: 2 × 3 × 5 = 30. Step 4: Answer: −30."
      real_world: "A tank loses 4 litres an hour, so its change is −4 litres per hour. Three hours ago it had 3 × 4 = 12 litres more than now: going back in time (−3 hours) × losing (−4) gives +12."
    picture:
      kind: flow
      steps: [3 × −2 = −6, 2 × −2 = −4, 1 × −2 = −2, 0 × −2 = 0, −1 × −2 = 2, −2 × −2 = 4]
      alt: 'A pattern: 3 times −2 is −6, 2 times −2 is −4, and so on, each step adding 2, until −1 times −2 is 2 and −2 times −2 is 4.'
      caption: 'Each step adds 2, so the pattern carries on past zero: a negative times a negative is positive.'
    activity:
      type: sort
      prompt: Is the answer positive or negative?
      bins:
      - Positive
      - Negative
      items:
      - label: (−3) × 4
        bin: Negative
        clue: How many of the numbers have a minus sign? Is that count odd or even?
        why: 'One negative: the answer is negative, −12.'
      - label: (−2) × (−5)
        bin: Positive
        why: 'Two negatives make a positive: 10.'
        clue: Count the negative numbers. Odd or even?
      - label: 12 ÷ (−3)
        bin: Negative
        clue: Dividing follows the same sign rule as multiplying. How many negatives?
        why: 'One negative: −4.'
      - label: (−8) ÷ (−2)
        bin: Positive
        clue: How many negatives?
        why: 'Two negatives: positive 4.'
      - label: (−1) × (−1) × (−1)
        bin: Negative
        why: 'Two of them make +1, and the third makes it −1: three negatives, an odd number, so negative.'
        clue: 'Count the negatives: one pair, and then?'
      - label: (−2)²
        bin: Positive
        clue: (−2)² means (−2) × (−2). How many negatives is that?
        why: '(−2) × (−2) = 4: two negatives make a positive.'
    lesson:
      - teach: 'Multiplying a negative number by a positive one gives a negative answer. −4 × 3 means three lots of −4: −4 + (−4) + (−4) = −12. Owing ₹4 to three friends is owing ₹12.'
        check:
          prompt: What is −5 × 2?
          options:
          - −10
          - '10'
          - −7
          answer: −10
          why: Two lots of −5 make −10.
      - teach: 'Look at the pattern: −3 × 2 = −6, −3 × 1 = −3, −3 × 0 = 0. Each time the answer goes up by 3. Continue: −3 × −1 = 3, −3 × −2 = 6. So a negative times a negative is positive. Division follows the same sign rules.'
        picture:
          kind: flow
          steps:
          - −3 × 2 = −6
          - −3 × 1 = −3
          - −3 × 0 = 0
          - −3 × (−1) = 3
          - −3 × (−2) = 6
          alt: The pattern −6, −3, 0, 3, 6 rises by 3 each time, so −3 × −2 = 6.
        check:
          prompt: What is −20 ÷ −4?
          options:
          - '5'
          - −5
          - −80
          answer: '5'
          why: 'Same signs give a positive answer: 20 ÷ 4 = 5.'
      - teach: With many factors, count the negatives. An even number of negatives gives a positive answer; an odd number gives a negative one. (−2) × (−3) × (−5) has three negatives, so it is −30. And (−3)² = (−3) × (−3) = 9.
        check:
          prompt: Is (−1) × (−2) × (−3) × (−4) positive or negative?
          options:
          - Positive
          - Negative
          answer: Positive
          why: Four negatives is an even number, so the answer, 24, is positive.
    items:
      - prompt: "What is −4 × 3?"
        answer: "-12"
        check: "-4*3"
        difficulty: 1
        hints: ["Different signs give a negative answer."]
        solution: "Step 1: 4 × 3 = 12. Step 2: Different signs, so −12."
        mistakes: {"12": sign_rule}
      - prompt: "What is −5 × −6?"
        answer: "30"
        check: "(-5)*(-6)"
        difficulty: 1
        hints: ["The same signs give a positive answer."]
        solution: "Step 1: 5 × 6 = 30. Step 2: Same signs, so +30."
        mistakes: {"-30": sign_rule}
      - prompt: "What is −24 ÷ 6?"
        answer: "-4"
        check: "-24/6"
        difficulty: 1
        hints: ["Different signs give a negative answer, for division too."]
        solution: "Step 1: 24 ÷ 6 = 4. Step 2: Different signs, so −4."
        mistakes: {"4": sign_rule}
      - prompt: "What is −36 ÷ −9?"
        answer: "4"
        check: "(-36)/(-9)"
        difficulty: 2
        hints: ["The same signs give a positive answer."]
        solution: "Step 1: 36 ÷ 9 = 4. Step 2: Same signs, so +4."
        mistakes: {"-4": sign_rule}
      - prompt: "What is (−2) × (−3) × (−5)?"
        answer: "-30"
        check: "(-2)*(-3)*(-5)"
        difficulty: 2
        hints: ["Count the minus signs.", "Three is odd."]
        solution: "Step 1: 2 × 3 × 5 = 30. Step 2: Three negatives, an odd number, so −30."
        mistakes: {"30": count_negatives}
      - prompt: "What is (−1) × (−1) × (−1) × (−1)?"
        answer: "1"
        check: "(-1)^4"
        difficulty: 3
        hints: ["Four minus signs: even or odd?"]
        solution: "Step 1: 1 × 1 × 1 × 1 = 1. Step 2: Four negatives, an even number, so +1."
        mistakes: {"-1": count_negatives, "-4": count_negatives}
      - prompt: "What is (−3)²?"
        answer: "9"
        check: "(-3)^2"
        difficulty: 3
        hints: ["(−3)² means (−3) × (−3)."]
        solution: "Step 1: (−3) × (−3). Step 2: Same signs, so +9."
        mistakes: {"-9": square_of_negative, "-6": doubled_not_squared, "6": doubled_not_squared}
      - prompt: "What is (−48) ÷ (−6) × (−2)?"
        answer: "-16"
        check: "(-48)/(-6)*(-2)"
        difficulty: 2
        hints: ["Work from left to right.", "(−48) ÷ (−6) = 8."]
        solution: "Step 1: (−48) ÷ (−6) = 8. Step 2: 8 × (−2) = −16."
        mistakes: {"16": count_negatives, "4": sign_rule}
      - prompt: "What is (−2)⁵?"
        answer: "-32"
        check: "(-2)**5"
        difficulty: 3
        hints: ["Five negative factors.", "An odd number of negatives gives a negative product."]
        solution: "Step 1: 2⁵ = 32. Step 2: Five negatives is odd, so the answer is −32."
        mistakes: {"32": count_negatives, "-10": times_not_plus}
      - prompt: "a × b = −24 and a = −6. What is b?"
        answer: "4"
        check: "-24/(-6)"
        difficulty: 3
        hints: ["b = −24 ÷ a.", "A negative divided by a negative is positive."]
        solution: "Step 1: b = −24 ÷ (−6). Step 2: b = 4. Step 3: Check: −6 × 4 = −24."
        mistakes: {"-4": sign_rule, "-18": wrong_inverse}
      - prompt: What is 7 × (−3)?
        answer: '-21'
        check: 7*(-3)
        difficulty: 1
        hints:
        - A positive times a negative is…?
        - 7 × 3 = 21, then fix the sign.
        solution: 'Step 1: 7 × 3 = 21. Step 2: One negative factor makes the answer negative. Step 3: So −21.'
        mistakes:
          '21': sign_rule
          '4': times_not_plus
      - prompt: What is −8 × −4?
        answer: '32'
        check: -8*-4
        difficulty: 1
        hints:
        - Two negatives multiply to…?
        - 8 × 4 = 32.
        solution: 'Step 1: 8 × 4 = 32. Step 2: Two negative factors give a positive answer. Step 3: So 32.'
        mistakes:
          '-32': sign_rule
          '-12': times_not_plus
      - prompt: What is 45 ÷ (−9)?
        answer: '-5'
        check: 45/(-9)
        difficulty: 1
        hints:
        - Different signs give a negative answer.
        - 45 ÷ 9 = 5.
        solution: 'Step 1: 45 ÷ 9 = 5. Step 2: The signs are different. Step 3: So −5.'
        mistakes:
          '5': sign_rule
      - prompt: What is (−2) × (−2) × (−2) × (−2)?
        answer: '16'
        check: (-2)**4
        difficulty: 2
        hints:
        - Count the negative factors.
        - Four is even.
        solution: 'Step 1: 2 × 2 × 2 × 2 = 16. Step 2: Four negatives, an even number. Step 3: So the answer is +16.'
        mistakes:
          '-16': count_negatives
      - prompt: What is −(4²)? Watch the brackets.
        answer: '-16'
        check: -(4**2)
        difficulty: 2
        hints:
        - Square 4 first, then put the minus in front.
        - This is not (−4)².
        solution: 'Step 1: 4² = 16. Step 2: The minus sign is outside the square. Step 3: So −(4²) = −16.'
        mistakes:
          '16': square_of_negative
      - prompt: a × b = 35 and a = −7. What is b?
        answer: '-5'
        check: 35/(-7)
        difficulty: 3
        hints:
        - b = 35 ÷ a.
        - Positive divided by negative is negative.
        solution: 'Step 1: b = 35 ÷ (−7). Step 2: Different signs give a negative. Step 3: b = −5.'
        mistakes:
          '5': wrong_inverse

  - code: math9.neg.substitute
    title: Putting negative numbers into expressions
    after: [math9.neg.multiply_divide]
    notes: |
      Put the negative number in brackets, then use the sign rules: if x = −2 then 3x = 3 × (−2) = −6,
      x² = (−2)² = 4 and x³ = −8. Work out powers first, then multiplication, then addition.
    explanations:
      text: "When x is a negative number, write it in brackets before working anything out. If x = −3, then x² = (−3)² = 9, 2x = 2 × (−3) = −6 and x + 7 = −3 + 7 = 4. The brackets stop the minus sign from getting lost."
      visual: "Picture a box with x written on it. Take the x out and drop (−3) into the box, brackets and all. So 2x² − x becomes 2(−3)² − (−3)."
      step_by_step: "For 2x² − 3x + 1 with x = −1: Step 1: Replace x with (−1): 2(−1)² − 3(−1) + 1. Step 2: Powers first: (−1)² = 1, so 2 × 1 = 2. Step 3: −3 × (−1) = +3. Step 4: 2 + 3 + 1 = 6."
      real_world: "A shop's daily profit is 50n − 400 rupees, where n is the number of items sold. On a bad day the formula can go negative: with n = 6, the profit is 300 − 400 = −₹100, a loss."
    activity:
      type: formula
      prompt: Put numbers, including negative ones, into 2x² − 3x.
      inputs:
      - name: x
        label: x
        min: -5
        max: 5
        step: 1
        start: 0
      outputs:
      - name: v
        label: 2x² − 3x
        expr: 2*x^2-3*x
      goals:
      - prompt: Find a negative x that makes 2x² − 3x = 14.
        want:
          v: 14
        mistakes:
        - when:
            x: 2
          say: 'x = 2 gives 2 × 4 − 6 = 2. With a negative x, −3x turns into + something: the minus signs cancel.'
        - when:
            x: 4
          say: x = 4 gives 32 − 12 = 20. The goal asks for a negative x.
      - prompt: Find x that makes it 27.
        want:
          v: 27
        mistakes:
        - when:
            x: 3
          say: 'x = 3 gives 18 − 9 = 9. Squaring makes 3 and −3 the same, but −3x changes sign: which one makes −3x add instead of take away?'
    lesson:
      - teach: To put a negative number into an expression, write it in brackets first. If x = −2, then 3x = 3 × (−2) = −6, and x + 7 = (−2) + 7 = 5. The brackets stop sign mistakes.
        check:
          prompt: x = −3. What is 4x?
          options:
          - −12
          - '12'
          - '1'
          answer: −12
          why: 4 × (−3) = −12.
      - teach: Powers come first. If x = −2, then x² = (−2)² = (−2) × (−2) = 4, which is positive. x³ = (−2) × (−2) × (−2) = −8, which is negative. Without brackets, −2² would wrongly become −4.
        check:
          prompt: x = −5. What is x²?
          options:
          - '25'
          - −25
          - −10
          answer: '25'
          why: (−5) × (−5) = 25. Squaring a negative gives a positive.
      - teach: 'Then do multiplication, then addition, in the usual order. x = −1 in 2x² − 3x + 1: x² = 1, so 2 × 1 = 2; −3 × (−1) = +3; then 2 + 3 + 1 = 6.'
        check:
          prompt: x = −1. What is x² + x?
          options:
          - '0'
          - '2'
          - −2
          answer: '0'
          why: x² = 1 and x = −1, so 1 + (−1) = 0.
    items:
      - prompt: "x = −2. What is 3x?"
        answer: "-6"
        check: "3*(-2)"
        difficulty: 1
        hints: ["3x = 3 × (−2)."]
        solution: "Step 1: 3x = 3 × (−2). Step 2: = −6."
        mistakes: {"6": sign_rule, "1": times_not_plus}
      - prompt: "x = −4. What is x + 7?"
        answer: "3"
        check: "-4 + 7"
        difficulty: 1
        hints: ["−4 + 7: start at −4, move 7 right."]
        solution: "Step 1: x + 7 = −4 + 7. Step 2: = 3."
        mistakes: {"11": sign_slip, "-11": sign_slip, "-3": sign_slip}
      - prompt: "x = −3. What is x²?"
        answer: "9"
        check: "(-3)^2"
        difficulty: 2
        hints: ["x² = (−3) × (−3)."]
        solution: "Step 1: x² = (−3)². Step 2: = 9."
        mistakes: {"-9": square_of_negative, "-6": doubled_not_squared}
      - prompt: "a = −2 and b = 5. What is ab − b?"
        answer: "-15"
        check: "(-2)*5 - 5"
        difficulty: 2
        hints: ["ab = (−2) × 5 = −10."]
        solution: "Step 1: ab = −10. Step 2: −10 − 5 = −15."
        mistakes: {"-5": sign_slip, "5": sign_rule}
      - prompt: "x = −1. What is 2x² − 3x + 1?"
        answer: "6"
        check: "2*(-1)^2 - 3*(-1) + 1"
        difficulty: 2
        hints: ["(−1)² = 1.", "−3 × (−1) = +3."]
        solution: "Step 1: 2(−1)² − 3(−1) + 1. Step 2: = 2 + 3 + 1. Step 3: = 6."
        mistakes: {"0": sign_rule, "2": square_of_negative}
      - prompt: "x = −2. What is x³?"
        answer: "-8"
        check: "(-2)^3"
        difficulty: 3
        hints: ["x³ = (−2) × (−2) × (−2).", "Three negatives."]
        solution: "Step 1: 2 × 2 × 2 = 8. Step 2: Three negatives, so −8."
        mistakes: {"8": count_negatives}
      - prompt: "x = −5. What is (x − 3)(x + 5)?"
        answer: "0"
        check: "(-5 - 3)*(-5 + 5)"
        difficulty: 3
        hints: ["Work out each bracket first.", "x + 5 = 0."]
        solution: "Step 1: x − 3 = −8 and x + 5 = 0. Step 2: −8 × 0 = 0."

        mistakes: {"-8": "zero_factor", "16": "zero_factor"}
      - prompt: "x = −3. What is 2x² + x?"
        answer: "15"
        check: "2*(-3)**2 + (-3)"
        difficulty: 2
        hints: ["Square first: (−3)² = 9.", "2 × 9 + (−3)."]
        solution: "Step 1: x² = 9. Step 2: 2 × 9 = 18. Step 3: 18 + (−3) = 15."
        mistakes: {"-21": square_of_negative, "21": sign_slip}
      - prompt: "a = −2 and b = −3. What is a² − b²?"
        answer: "-5"
        check: "(-2)**2 - (-3)**2"
        difficulty: 3
        hints: ["Both squares are positive.", "4 − 9."]
        solution: "Step 1: a² = 4 and b² = 9. Step 2: 4 − 9 = −5."
        mistakes: {"5": sign_slip, "13": square_of_negative}
      - prompt: "x = −1. What is x¹⁰⁰ + x⁹⁹?"
        answer: "0"
        check: "(-1)**100 + (-1)**99"
        difficulty: 3
        hints: ["An even power of −1 is 1; an odd power is −1.", "1 + (−1)."]
        solution: "Step 1: (−1)¹⁰⁰ = 1. Step 2: (−1)⁹⁹ = −1. Step 3: 1 + (−1) = 0."
        mistakes: {"2": count_negatives, "-2": count_negatives}
      - prompt: x = −5. What is 2x?
        answer: '-10'
        check: 2*(-5)
        difficulty: 1
        hints:
        - Write the −5 in brackets.
        - 2 × (−5).
        solution: 'Step 1: 2x = 2 × (−5). Step 2: A positive times a negative is negative. Step 3: = −10.'
        mistakes:
          '10': sign_rule
          '-3': times_not_plus
      - prompt: x = −6. What is x + 10?
        answer: '4'
        check: -6 + 10
        difficulty: 1
        hints:
        - Start at −6 on the number line.
        - Move 10 to the right.
        solution: 'Step 1: x + 10 = (−6) + 10. Step 2: Start at −6 and move 10 right. Step 3: = 4.'
        mistakes:
          '-16': sign_slip
          '16': sign_slip
      - prompt: x = −4. What is x² − 10?
        answer: '6'
        check: (-4)**2 - 10
        difficulty: 2
        hints:
        - 'Square first: (−4)².'
        - (−4)² = 16.
        solution: 'Step 1: (−4)² = 16. Step 2: 16 − 10. Step 3: = 6.'
        mistakes:
          '-26': square_of_negative
      - prompt: a = 3 and b = −2. What is a² + ab?
        answer: '3'
        check: 3**2 + 3*(-2)
        difficulty: 2
        hints:
        - a² = 9.
        - ab = 3 × (−2).
        solution: 'Step 1: a² = 9. Step 2: ab = −6. Step 3: 9 + (−6) = 3.'
        mistakes:
          '15': sign_rule
      - prompt: x = −2. What is x³ + x²?
        answer: '-4'
        check: (-2)**3 + (-2)**2
        difficulty: 3
        hints:
        - x³ = (−2)³ and x² = (−2)².
        - −8 and 4.
        solution: 'Step 1: (−2)³ = −8. Step 2: (−2)² = 4. Step 3: −8 + 4 = −4.'
        mistakes:
          '12': count_negatives
          '-12': square_of_negative
      - prompt: x = −3. What is (x + 1)(x − 1)?
        answer: '8'
        check: (-3 + 1)*(-3 - 1)
        difficulty: 3
        hints:
        - Work out each bracket first.
        - x + 1 = −2 and x − 1 = −4.
        solution: 'Step 1: x + 1 = −2. Step 2: x − 1 = −4. Step 3: (−2) × (−4) = 8.'
        mistakes:
          '-8': sign_rule
  - code: math9.neg.equations
    title: Equations with negative answers
    after: [math9.neg.substitute]
    notes: |
      Equations are solved the same way when the answer is negative: x + 8 = 3 gives x = 3 − 8 = −5;
      2x + 9 = 1 gives 2x = −8, x = −4; −3x = 12 gives x = −4. Pairs of equations can also have
      negative solutions.
    explanations:
      text: "Negative answers come up naturally. x + 8 = 3 asks: what plus 8 gives 3? Take 8 from both sides: x = 3 − 8 = −5. Check: −5 + 8 = 3. Solve exactly as before, and use the sign rules carefully."
      visual: "Picture a balance with x and 8 weights on one side and 3 on the other. Take 8 off both sides. The left side has just x, the right has 3 − 8, which is 5 below zero: −5."
      step_by_step: "For 2x + 9 = 1: Step 1: Take 9 from both sides: 2x = −8. Step 2: Divide both sides by 2: x = −4. Step 3: Check: 2 × (−4) + 9 = −8 + 9 = 1."
      real_world: "A bank account had ₹500. After a bill of ₹x is paid, the balance is −₹150 (overdrawn). So 500 − x = −150, which gives x = 650: the bill was ₹650."
    activity:
      type: formula
      prompt: Try values of x in 3x + 7.
      inputs:
      - name: x
        label: x
        min: -10
        max: 10
        step: 1
        start: 0
      outputs:
      - name: v
        label: 3x + 7
        expr: 3*x+7
      goals:
      - prompt: Solve 3x + 7 = −8.
        want:
          v: -8
        hint: 3x must be −15.
        mistakes:
        - when:
            x: 5
          say: x = 5 gives 3 × 5 + 7 = 22. For 3x + 7 to be negative, 3x must be a negative number bigger than 7.
        - when:
            x: -1
          say: x = −1 gives −3 + 7 = 4. 3x needs to be much more negative.
    lesson:
      - teach: 'Equations are solved the same way when the answer is negative. x + 8 = 3: take 8 from both sides, x = 3 − 8 = −5. Check: −5 + 8 = 3.'
        check:
          prompt: x + 6 = 2. What is x?
          options:
          - −4
          - '4'
          - '8'
          answer: −4
          why: 'x = 2 − 6 = −4. Check: −4 + 6 = 2.'
      - teach: 'With a number in front of x, divide at the end, keeping track of the sign. 2x + 9 = 1: 2x = 1 − 9 = −8, so x = −4. And −3x = 12: x = 12 ÷ (−3) = −4.'
        check:
          prompt: −2x = 10. What is x?
          options:
          - −5
          - '5'
          - '8'
          answer: −5
          why: 'x = 10 ÷ (−2) = −5. Check: −2 × (−5) = 10.'
      - teach: 'Real life gives negative answers too: a balance below zero, a temperature below freezing, a depth below sea level. Always put your answer back into the equation to check the signs.'
        check:
          prompt: '5 − x = 9. Someone says x = 4. Check it: what is 5 − 4?'
          options:
          - 1, so x = 4 is wrong; x = −4
          - 9, so x = 4 is right
          answer: 1, so x = 4 is wrong; x = −4
          why: '5 − 4 = 1, not 9. With x = −4: 5 − (−4) = 9, which fits.'
    items:
      - prompt: "x + 8 = 3. What is x?"
        answer: "-5"
        check: "3 - 8"
        difficulty: 1
        hints: ["Take 8 from both sides."]
        solution: "Step 1: x = 3 − 8. Step 2: x = −5. Step 3: Check: −5 + 8 = 3."
        mistakes: {"5": sign_slip, "11": wrong_inverse}
      - prompt: "x − 4 = −10. What is x?"
        answer: "-6"
        check: "-10 + 4"
        difficulty: 1
        hints: ["Add 4 to both sides."]
        solution: "Step 1: x = −10 + 4. Step 2: x = −6."
        mistakes: {"-14": wrong_inverse, "6": sign_slip}
      - prompt: "2x + 9 = 1. What is x?"
        answer: "-4"
        check: "(1 - 9)/2"
        difficulty: 2
        hints: ["Take 9 from both sides first.", "2x = −8."]
        solution: "Step 1: 2x = 1 − 9 = −8. Step 2: x = −4."
        mistakes: {"5": wrong_inverse, "4": sign_slip, "-8": forgot_divide}
      - prompt: "−3x = 12. What is x?"
        answer: "-4"
        check: "12/(-3)"
        difficulty: 2
        hints: ["Divide both sides by −3."]
        solution: "Step 1: x = 12 ÷ (−3). Step 2: x = −4."
        mistakes: {"4": sign_rule, "15": wrong_inverse}
      - prompt: "A bank account has ₹500. After a bill of ₹x is paid, the balance is −₹150. What is x?"
        answer: "650"
        check: "500 - (-150)"
        difficulty: 2
        hints: ["500 − x = −150.", "x = 500 − (−150)."]
        solution: "Step 1: 500 − x = −150. Step 2: x = 500 + 150. Step 3: x = 650."
        mistakes: {"350": sign_slip}
      - prompt: "x + y = 2 and x − y = 8. What is y?"
        answer: "-3"
        check: "(2 - 8)/2"
        difficulty: 3
        hints: ["Subtract the equations: 2y = 2 − 8."]
        solution: "Step 1: Subtracting, 2y = −6. Step 2: y = −3. Step 3: Then x = 5."
        mistakes: {"3": sign_slip, "5": swapped_unknowns}
      - prompt: "The sum of two numbers is −4 and their difference is 10. What is the smaller number?"
        answer: "-7"
        check: "(-4 - 10)/2"
        difficulty: 3
        hints: ["Smaller = (sum − difference) ÷ 2."]
        solution: "Step 1: (−4 − 10) ÷ 2 = −14 ÷ 2. Step 2: = −7. Step 3: The bigger number is 3, and 3 − (−7) = 10."
        mistakes: {"7": sign_slip, "3": swapped_unknowns, "-14": forgot_divide}
      - prompt: "5 − 2x = 17. What is x?"
        answer: "-6"
        check: "(5 - 17)/2"
        difficulty: 2
        hints: ["Take 5 from both sides: −2x = 12.", "Divide by −2."]
        solution: "Step 1: −2x = 17 − 5 = 12. Step 2: x = 12 ÷ (−2) = −6. Step 3: Check: 5 − 2(−6) = 17."
        mistakes: {"6": sign_rule, "-11": wrong_inverse}
      - prompt: "3(x + 4) = x + 2. What is x?"
        answer: "-5"
        check: "(2 - 12)/2"
        difficulty: 3
        hints: ["Open the bracket: 3x + 12 = x + 2.", "2x = −10."]
        solution: "Step 1: 3x + 12 = x + 2. Step 2: 2x = 2 − 12 = −10. Step 3: x = −5."
        mistakes: {"5": sign_slip, "-10": forgot_divide}
      - prompt: "2x + 3y = −1 and x − 3y = 13. What is x?"
        answer: "4"
        check: "(-1 + 13)/3"
        difficulty: 3
        hints: ["The y terms have opposite signs: add the equations.", "3x = 12."]
        solution: "Step 1: Adding, 3x = 12. Step 2: x = 4. Step 3: Then 4 − 3y = 13, so y = −3."
        mistakes: {"-3": swapped_unknowns, "12": forgot_divide}
      - prompt: x + 11 = 4. What is x?
        answer: '-7'
        check: 4 - 11
        difficulty: 1
        hints:
        - Take 11 from both sides.
        - 4 − 11.
        solution: 'Step 1: x = 4 − 11. Step 2: = −7. Step 3: Check: −7 + 11 = 4.'
        mistakes:
          '7': sign_slip
          '15': sign_slip
      - prompt: x − 3 = −8. What is x?
        answer: '-5'
        check: -8 + 3
        difficulty: 1
        hints:
        - Add 3 to both sides.
        - −8 + 3.
        solution: 'Step 1: x = −8 + 3. Step 2: = −5. Step 3: Check: −5 − 3 = −8.'
        mistakes:
          '-11': sign_slip
      - prompt: 3x + 10 = 4. What is x?
        answer: '-2'
        check: (4 - 10)/3
        difficulty: 2
        hints:
        - First take 10 from both sides.
        - 3x = −6.
        solution: 'Step 1: 3x = 4 − 10 = −6. Step 2: x = −6 ÷ 3. Step 3: x = −2.'
        mistakes:
          '2': sign_rule
          '-6': wrong_inverse
      - prompt: A submarine is at −40 m. It rises x m and is then at −15 m. What is x?
        answer: '25'
        check: -15 - (-40)
        difficulty: 2
        hints:
        - −40 + x = −15.
        - x = −15 − (−40).
        solution: 'Step 1: −40 + x = −15. Step 2: x = −15 + 40. Step 3: x = 25 m.'
        mistakes:
          '-55': minus_negative
          '55': minus_negative
      - prompt: 4(x + 3) = 2x + 4. What is x?
        answer: '-4'
        check: (4 - 12)/2
        difficulty: 3
        hints:
        - 'Open the bracket: 4x + 12.'
        - 4x + 12 = 2x + 4, so 2x = −8.
        solution: 'Step 1: 4x + 12 = 2x + 4. Step 2: 2x = 4 − 12 = −8. Step 3: x = −4.'
        mistakes:
          '4': sign_slip
          '-8': wrong_inverse
      - prompt: The sum of two numbers is −6 and their difference is 4. What is the bigger number?
        answer: '-1'
        check: (-6 + 4)/2
        difficulty: 3
        hints:
        - Bigger = (sum + difference) ÷ 2.
        - (−6 + 4) ÷ 2.
        solution: 'Step 1: Bigger = (−6 + 4) ÷ 2. Step 2: = −2 ÷ 2. Step 3: = −1, and the smaller is −5.'
        mistakes:
          '-5': sign_slip
          '5': sign_slip
