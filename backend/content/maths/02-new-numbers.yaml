# Class 9 Mathematics, chapter 2. Format: content/README.md.
subject: math
chapter: 2
title: New Numbers

tips:
  half_not_root: "The square root isn't half the number. It is the number that, multiplied by itself, gives the number."
  squared_perimeter: "Find the side first: perimeter ÷ 4. Then multiply the side by itself."
  decimal_places: "Count decimal places: a number with one decimal place, squared, has two (0.3 × 0.3 = 0.09). So the root of a two-place decimal has one place."
  root_top_only: "Take the square root of both the top and the bottom of the fraction."
  forgot_root: "That is the length squared. Take the square root to get the length."
  perfect_square_root: "That one is a whole number, like √4 = 2, so it is rational. Square roots of perfect squares are whole numbers."
  added_sides: "Sides of a right triangle don't simply add. Square the two shorter sides, add the squares, then take the square root."
  diagonal_as_side: "That length is the diagonal, not the side. Find the side first."
  added_squares_instead: "For a missing shorter side, subtract the squares: longest² − other side²."
  doubled_not_squared: "Squaring means multiplying a number by itself, not by 2. For example, (√3)² = √3 × √3, which takes you back to the number under the root."
  added_not_multiplied: "3√2 means 3 × √2, not 3 + √2."
  compare_squares: "To compare, square both numbers: (2√3)² = 4 × 3 = 12 and (3√2)² = 9 × 2 = 18."
  half_base_height: "The area of a triangle is half of base × height. Don't forget the half."
  over_ten: "Recurring decimals go over 9s, not 10s: one repeating digit over 9, two repeating digits over 99."
  area_equals_perimeter: "Write the area as s × s and the perimeter as 4 × s. Set them equal, then divide both sides by s."
  perfect_square_check: "A perfect square is a whole number times itself, like 6 × 6 = 36. For each choice, try to find a whole number that multiplies by itself to make it."
  recurring_subtract: "Write 10x and x one under the other and subtract: the endless repeating part lines up and cancels, leaving a whole number."
  root_estimate: "Estimate both roots first: √3 ≈ 1.73 and √5 ≈ 2.24. Pick the number between them."
  spiral_count: "Each new triangle adds 1 under the root of the long side. Write the long sides in order, starting from √2, and stop at the triangle the question asks about."
  terminating_denominator: "Fractions whose bottom has only 2s and 5s stop. A bottom of 3 makes the digits repeat."

concepts:
  - code: math9.newnum.square_roots
    title: Squares and square roots
    notes: |
      The square root of a number is the positive number which multiplied by itself gives it:
      √49 = 7 because 7 × 7 = 49. A square of area A has side √A. For fractions take the root
      of top and bottom (√(9/16) = 3/4); for decimals, √1.44 = 1.2 because 1.2 × 1.2 = 1.44.
    explanations:
      text: "The square root of a number is the number that, multiplied by itself, gives it. √49 = 7 because 7 × 7 = 49. So a square with an area of 49 cm² has sides of 7 cm. Square roots work for fractions and decimals too: √(9/16) = 3/4 and √1.44 = 1.2."
      visual: "Arrange 49 small tiles into a square. You get 7 rows of 7, so the side is 7 tiles. With 50 tiles there is always one left over or one gap, so 50 is not a perfect square."
      step_by_step: "To find the area of a square with a perimeter of 40 cm: Step 1: A square has 4 equal sides, so each side is 40 ÷ 4 = 10 cm. Step 2: Area = side × side = 10 × 10. Step 3: The area is 100 cm²."
      real_world: "A square classroom floor needs 64 square tiles of 1 m side. The floor is 8 m by 8 m, because √64 = 8."
    picture:
      kind: flow
      steps: ['49 tiles make a square: 7 rows of 7', So √49 = 7, '50 tiles can''t make a square: one is always left over', So √50 is not a whole number; it's a little more than 7]
      alt: 49 tiles make a 7 by 7 square, so the square root of 49 is 7; 50 tiles can't make a square, so its root is a little more than 7.
    activity:
      type: formula
      prompt: A square of side s. Change the side and watch the area.
      inputs:
      - name: s
        label: Side
        min: 1
        max: 20
        step: 1
        start: 1
        unit: cm
      outputs:
      - name: a
        label: Area
        expr: s^2
        unit: cm²
      goals:
      - prompt: Make a square with area 49 cm². Its side is √49.
        want:
          a: 49
      - prompt: Now area 169 cm².
        want:
          a: 169
    lesson:
      - teach: 'Squaring a number means multiplying it by itself: 7 squared is 7 × 7 = 49, written 7². A square whose side is 7 cm has an area of 7² = 49 cm². Numbers like 1, 4, 9, 16, 25, 36, 49 are called perfect squares.'
        picture:
          kind: area_grid
          cols:
          - size: 7
            label: 7 cm
          rows:
          - size: 7
            label: 7 cm
          cells:
          - - 49 cm²
          alt: A square with sides of 7 cm has an area of 7 × 7 = 49 cm².
        check:
          prompt: What is 6²?
          options:
          - '36'
          - '12'
          - '66'
          answer: '36'
          why: 6² means 6 × 6, which is 36. 12 is 6 + 6, which is doubling, not squaring.
      - teach: 'The square root goes the other way. √49 asks: which positive number times itself gives 49? The answer is 7, because 7 × 7 = 49. So if a square has an area of 49 cm², its side is √49 = 7 cm.'
        check:
          prompt: A square has an area of 64 cm². How long is its side?
          options:
          - 8 cm
          - 32 cm
          - 16 cm
          answer: 8 cm
          why: 8 × 8 = 64, so √64 = 8. Halving 64 gives 32, which is a different thing.
      - teach: 'Fractions and decimals have square roots too. For a fraction, take the root of the top and of the bottom: √(9/16) = 3/4, because 3/4 × 3/4 = 9/16. For a decimal, think of the digits and the places: √1.44 = 1.2, because 1.2 × 1.2 = 1.44.'
        check:
          prompt: What is √(4/25)?
          options:
          - 2/5
          - 2/25
          - 4/5
          answer: 2/5
          why: '√4 = 2 and √25 = 5, so √(4/25) = 2/5. Check: 2/5 × 2/5 = 4/25.'
      - teach: Check a square root by squaring it back. Is √0.09 = 0.3? 0.3 × 0.3 = 0.09, so yes. A common slip is √0.09 = 0.03, but 0.03 × 0.03 = 0.0009.
        check:
          prompt: Is √0.16 equal to 0.4 or 0.04?
          options:
          - '0.4'
          - '0.04'
          answer: '0.4'
          why: 0.4 × 0.4 = 0.16, while 0.04 × 0.04 = 0.0016.
    items:
      - prompt: "A square has an area of 49 cm². How long is each side, in cm?"
        answer: "7"
        check: "sqrt(49)"
        difficulty: 1
        hints: ["Which number multiplied by itself gives 49?"]
        solution: "Step 1: 7 × 7 = 49. Step 2: So each side is 7 cm."
        mistakes: {"24.5": half_not_root}
      - prompt: "The perimeter of a square is 40 cm. What is its area, in cm²?"
        answer: "100"
        check: "(40/4)^2"
        difficulty: 1
        hints: ["Find the side first: the perimeter is 4 equal sides.", "The side is 10 cm."]
        solution: "Step 1: Side = 40 ÷ 4 = 10 cm. Step 2: Area = 10 × 10 = 100 cm²."
        mistakes: {"1600": squared_perimeter}
      - prompt: "What is √144?"
        answer: "12"
        check: "sqrt(144)"
        difficulty: 1
        hints: ["Try 10 × 10 = 100 and 13 × 13 = 169.", "The answer is between 10 and 13."]
        solution: "Step 1: 12 × 12 = 144. Step 2: So √144 = 12."
        mistakes: {"72": half_not_root}
      - prompt: "Which of these numbers is a perfect square?"
        options: ["81", "50", "27", "90"]
        answer: "81"
        difficulty: 1
        hints: ["A perfect square is a whole number times itself.", "Try 9 × 9."]
        solution: "Step 1: 9 × 9 = 81. Step 2: 50, 27 and 90 are not whole numbers times themselves."
        mistakes: {"50": "perfect_square_check", "27": "perfect_square_check"}
      - prompt: "What is √1.44? Decimals are fine."
        answer: "1.2"
        check: "sqrt(144/100)"
        difficulty: 2
        hints: ["Think of √144 first.", "1.44 has two decimal places, so its square root has one."]
        solution: "Step 1: √144 = 12. Step 2: 1.44 = 144/100, so √1.44 = 12/10. Step 3: √1.44 = 1.2."
        mistakes: {"0.12": decimal_places, "0.72": half_not_root}
      - prompt: "What is √(9/16)? Type a fraction like 2/3."
        answer: "3/4"
        check: "sqrt(9/16)"
        difficulty: 2
        hints: ["Take the square root of the top and the bottom separately."]
        solution: "Step 1: √9 = 3. Step 2: √16 = 4. Step 3: √(9/16) = 3/4."
        mistakes: {"3/16": root_top_only}
      - prompt: "A square's area in cm² and its perimeter in cm are the same number. How long is its side, in cm?"
        answer: "4"
        check: "16/4"
        difficulty: 2
        hints: ["With side s, the area is s × s and the perimeter is 4 × s.", "s × s = 4 × s. Divide both sides by s."]
        solution: "Step 1: s × s = 4s. Step 2: Dividing by s, s = 4. Step 3: Check: area 16 and perimeter 16."
        mistakes: {"16": "area_equals_perimeter", "2": "area_equals_perimeter"}
      - prompt: "A square floor has an area of 6.25 m². How long is one side, in metres?"
        answer: "2.5"
        check: "sqrt(625/100)"
        difficulty: 3
        hints: ["√625 = 25.", "6.25 has two decimal places, so the side has one."]
        solution: "Step 1: 6.25 = 625/100. Step 2: √625 = 25 and √100 = 10. Step 3: The side is 25/10 = 2.5 m."
        mistakes: {"3.125": half_not_root, "0.25": decimal_places}
      - prompt: "What is √0.09? Decimals are fine."
        answer: "0.3"
        check: "sqrt(0.09)"
        difficulty: 2
        hints: ["Which decimal multiplied by itself gives 0.09?", "3 × 3 = 9; count the decimal places."]
        solution: "Step 1: 0.3 × 0.3 = 0.09. Step 2: So √0.09 = 0.3."
        mistakes: {"0.03": decimal_places, "0.045": half_not_root}
      - prompt: "A square garden has an area of 196 m². A fence goes all round it. How long is the fence, in metres?"
        answer: "56"
        check: "4*sqrt(196)"
        difficulty: 3
        hints: ["First find the side: which number times itself is 196?", "The side is 14 m. The fence goes round all four sides."]
        solution: "Step 1: Side = √196 = 14 m. Step 2: Fence = 4 × 14 = 56 m."
        mistakes: {"14": forgot_divide, "98": half_not_root}
      - prompt: "What is √(2 1/4)? Type a fraction like 2/3."
        answer: "3/2"
        check: "sqrt(9/4)"
        difficulty: 3
        hints: ["Write 2 1/4 as an improper fraction first.", "2 1/4 = 9/4. Take the root of the top and the bottom."]
        solution: "Step 1: 2 1/4 = 9/4. Step 2: √9 = 3 and √4 = 2. Step 3: √(9/4) = 3/2."
        mistakes: {"3/4": root_top_only, "9/8": half_not_root}
      - prompt: What is √81?
        answer: '9'
        check: sqrt(81)
        difficulty: 1
        hints:
        - Which number times itself gives 81?
        - Try 8 × 8 and 9 × 9.
        solution: 'Step 1: 9 × 9 = 81. Step 2: So √81 = 9. Step 3: Check: 9² = 81.'
        mistakes:
          '40.5': half_not_root
      - prompt: A square has sides of 13 cm. What is its area, in cm²?
        answer: '169'
        check: 13**2
        difficulty: 1
        hints:
        - The area of a square is side × side.
        - Work out 13 × 13.
        solution: 'Step 1: Area = 13 × 13. Step 2: 13 × 13 = 169. Step 3: So the area is 169 cm².'
        mistakes:
          '26': doubled_not_squared
          '52': squared_perimeter
      - prompt: What is √(25/49)? Type a fraction like 2/3.
        answer: 5/7
        check: sqrt(25/49)
        difficulty: 2
        hints:
        - Take the square root of the top and of the bottom.
        - √25 and √49 are both whole numbers.
        solution: 'Step 1: √25 = 5. Step 2: √49 = 7. Step 3: So √(25/49) = 5/7, and 5/7 × 5/7 = 25/49.'
        mistakes:
          5/49: root_top_only
      - prompt: What is √2.25? Decimals are fine.
        answer: '1.5'
        check: sqrt(2.25)
        difficulty: 2
        hints:
        - 2.25 is 225 hundredths, and 225 is a perfect square.
        - √225 = 15, so the root has one decimal place.
        solution: 'Step 1: 15 × 15 = 225. Step 2: So 1.5 × 1.5 = 2.25. Step 3: √2.25 = 1.5.'
        mistakes:
          '0.15': decimal_places
          '15': decimal_places
      - prompt: Two square tiles have areas of 16 cm² and 9 cm². Placed side by side, how long is the row they make, in cm?
        answer: '7'
        check: sqrt(16) + sqrt(9)
        difficulty: 3
        hints:
        - First find the side of each tile.
        - The row's length is the two sides added.
        solution: 'Step 1: The first tile''s side is √16 = 4 cm. Step 2: The second''s is √9 = 3 cm. Step 3: Side by side they make 4 + 3 = 7 cm.'
        mistakes:
          '5': added_squares_instead

  - code: math9.newnum.irrational_lengths
    title: Lengths like √2
    after: [math9.newnum.square_roots]
    notes: |
      The diagonal of a square of side 1 is √2, since 1² + 1² = 2. √2 cannot be written as a
      fraction: no fraction multiplied by itself gives exactly 2. Numbers like this are called
      irrational. A square of side a has diagonal a√2. A right triangle with shorter sides a and b
      has longest side √(a² + b²). An equilateral triangle of side 2 has height √3.
    explanations:
      text: "Draw a square with sides of 1 cm. Its diagonal is the longest side of a right triangle with two 1 cm sides, so diagonal² = 1² + 1² = 2, and the diagonal is √2 cm. No fraction gives exactly 2 when multiplied by itself: 7/5 × 7/5 = 49/25 is a little less, and 17/12 × 17/12 = 289/144 is a little more. So √2 is a new kind of number, called irrational."
      visual: "Draw a 1 cm square and its diagonal. Now draw a bigger square standing on that diagonal. It is made of four half-squares of the small one, so its area is 2 cm². Its side, the diagonal, is the number whose square is 2: that is √2."
      step_by_step: "To find the diagonal of a square with sides of 3 cm: Step 1: The diagonal is the longest side of a right triangle whose other sides are 3 cm and 3 cm. Step 2: diagonal² = 3² + 3² = 18. Step 3: diagonal = √18. Step 4: √18 = √9 × √2 = 3√2 cm, about 4.24 cm."
      real_world: "A square garden is 10 m on each side. Walking straight across from corner to corner is 10√2 m, about 14.1 m, instead of 20 m along two sides."
    activity:
      type: formula
      prompt: No fraction squares to exactly 2. Get as close as you can.
      inputs:
      - name: x
        label: x
        min: 1
        max: 2
        step: 0.01
        start: 1
      outputs:
      - name: sq
        label: x²
        expr: x^2
        places: 4
      goals:
      - prompt: 'Find x with x² between 1.98 and 2: that is √2 to two decimal places.'
        want:
          sq:
          - 1.98
          - 2
        hint: '1.4² = 1.96 and 1.5² = 2.25. So x is between 1.4 and 1.5: which hundredth?'
        mistakes:
        - when:
            sq:
            - 2.0001
            - 4
          say: 'x² is now more than 2, so x is bigger than √2. Squares grow fast: even 0.01 more makes a difference.'
    lesson:
      - teach: 'Draw a square with sides of 1 cm and its diagonal. The diagonal cuts it into two right triangles. In a right triangle, the square on the longest side equals the two other squares added: 1² + 1² = 2. So the diagonal is √2 cm.'
        picture:
          kind: flow
          steps:
          - Square with sides of 1 cm
          - Its diagonal makes two right triangles
          - Diagonal² = 1² + 1² = 2
          - Diagonal = √2 cm
          alt: A square ABCD with sides of 1 cm and the diagonal AC, which is √2 cm.
        check:
          prompt: A right triangle has shorter sides of 1 cm and 2 cm. The longest side squared is 1² + 2². What is that?
          options:
          - '5'
          - '3'
          - '9'
          answer: '5'
          why: 1² + 2² = 1 + 4 = 5, so the longest side is √5 cm.
      - teach: '√2 is about 1.414, but no fraction multiplied by itself gives exactly 2. Numbers like √2, √3 and √5 can''t be written as a fraction. They are called irrational numbers. √4 = 2 and √9 = 3 are not irrational: they are whole numbers.'
        check:
          prompt: Which of these is irrational?
          options:
          - √7
          - √16
          - √25
          answer: √7
          why: √16 = 4 and √25 = 5. 7 is not a perfect square, so √7 can't be written as a fraction.
      - teach: 'Squaring a root undoes it: (√7)² = √7 × √7 = 7. And a bigger square has a longer diagonal in step: a square of side 3 has diagonal √(3² + 3²) = √18 = 3√2, which is 3 times the diagonal of a unit square.'
        check:
          prompt: What is (√11)²?
          options:
          - '11'
          - √22
          - '121'
          answer: '11'
          why: √11 is the number which multiplied by itself gives 11, so (√11)² = 11.
    items:
      - prompt: "A square has sides of 1 cm. How long is its diagonal, in cm?"
        options: ["√2", "2", "1", "√3"]
        answer: "√2"
        check: "sqrt(1^2 + 1^2)"
        difficulty: 1
        hints: ["The diagonal makes a right triangle with two sides of the square.", "diagonal² = 1² + 1²."]
        solution: "Step 1: diagonal² = 1² + 1² = 2. Step 2: diagonal = √2 cm."
        mistakes: {"2": forgot_root}
      - prompt: "Which of these numbers is irrational?"
        options: ["√3", "√4", "√9", "1.5"]
        answer: "√3"
        difficulty: 1
        hints: ["Work out the ones you can: √4 = 2 and √9 = 3.", "1.5 = 3/2 is a fraction."]
        solution: "Step 1: √4 = 2, √9 = 3 and 1.5 = 3/2 are all fractions or whole numbers. Step 2: √3 cannot be written as a fraction, so it is irrational."
        mistakes: {"√4": perfect_square_root, "√9": perfect_square_root}
      - prompt: "What is (√7)²?"
        answer: "7"
        check: "sqrt(7)^2"
        difficulty: 1
        hints: ["(√7)² means √7 × √7.", "√7 is the number whose square is 7."]
        solution: "Step 1: (√7)² = √7 × √7. Step 2: By the meaning of √7, that is 7."
        mistakes: {"14": doubled_not_squared}
      - prompt: "A right triangle has shorter sides of 1 cm and 2 cm. How long is its longest side, in cm?"
        options: ["√5", "3", "√3", "5"]
        answer: "√5"
        check: "sqrt(1^2 + 2^2)"
        difficulty: 2
        hints: ["Square the two shorter sides and add.", "1 + 4 = 5. Now take the square root."]
        solution: "Step 1: 1² + 2² = 5. Step 2: The longest side is √5 cm."
        mistakes: {"3": added_sides, "5": forgot_root}
      - prompt: "A square has sides of 3 cm. How long is its diagonal, in cm?"
        options: ["3√2", "6", "9", "√6"]
        answer: "3√2"
        check: "sqrt(3^2 + 3^2)"
        difficulty: 2
        hints: ["diagonal² = 3² + 3² = 18.", "√18 = √9 × √2."]
        solution: "Step 1: diagonal² = 9 + 9 = 18. Step 2: diagonal = √18 = √9 × √2 = 3√2 cm."
        mistakes: {"6": added_sides}
      - prompt: "The diagonal of a square is √2 cm. What is its area, in cm²?"
        options: ["1", "2", "√2", "4"]
        answer: "1"
        check: "sqrt(2)^2/2"
        difficulty: 2
        hints: ["A square of side 1 has diagonal √2.", "So the side is 1 cm."]
        solution: "Step 1: A square of side s has diagonal s√2. Step 2: s√2 = √2, so s = 1. Step 3: Area = 1 × 1 = 1 cm²."
        mistakes: {"2": diagonal_as_side}
      - prompt: "An equilateral triangle has sides of 2 cm. How tall is it, in cm?"
        options: ["√3", "2", "√5", "1"]
        answer: "√3"
        check: "sqrt(2^2 - 1^2)"
        difficulty: 3
        hints: ["The height cuts the triangle into two right triangles with a 1 cm base and a 2 cm slanted side.", "height² = 2² − 1²."]
        solution: "Step 1: Each half is a right triangle with sides 1 cm and the height, and longest side 2 cm. Step 2: height² = 4 − 1 = 3. Step 3: height = √3 cm."
        mistakes: {"√5": added_squares_instead}
      - prompt: "A spiral of right triangles starts with a triangle whose two shorter sides are 1 cm. Each next triangle has the longest side of the one before as a shorter side, and 1 cm as its other shorter side. How long is the longest side of the 3rd triangle, in cm?"
        options: ["2", "√3", "√5", "3"]
        answer: "2"
        check: "sqrt(1 + 1 + 1 + 1)"
        difficulty: 3
        hints: ["The 1st triangle's longest side is √2.", "The 2nd is √(2 + 1) = √3. Keep going."]
        solution: "Step 1: 1st: √(1 + 1) = √2. Step 2: 2nd: √(2 + 1) = √3. Step 3: 3rd: √(3 + 1) = √4 = 2 cm."

        mistakes: {"√3": "spiral_count", "√5": "spiral_count"}
      - prompt: "A rectangle is 2 cm by 3 cm. How long is its diagonal, in cm?"
        options: ["√13", "5", "√5", "13"]
        answer: "√13"
        difficulty: 2
        hints: ["The diagonal is the longest side of a right triangle with sides 2 and 3.", "2² + 3² = ?"]
        solution: "Step 1: 2² + 3² = 4 + 9 = 13. Step 2: The diagonal is √13 cm."
        mistakes: {"5": added_sides, "13": forgot_root}
      - prompt: "A square has a diagonal of 4 cm. What is its area, in cm²?"
        answer: "8"
        check: "4**2/2"
        difficulty: 3
        hints: ["If the side is a, then a² + a² = diagonal².", "2a² = 16. The area is a²."]
        solution: "Step 1: a² + a² = 4² = 16. Step 2: 2a² = 16, so a² = 8. Step 3: The area is a² = 8 cm²."
        mistakes: {"16": diagonal_as_side, "4": half_not_root}
      - prompt: "A square has sides of √3 cm. A bigger square has sides of √27 cm. How many times as long is the bigger square's side?"
        answer: "3"
        check: "sqrt(27)/sqrt(3)"
        difficulty: 3
        hints: ["Divide √27 by √3.", "√27 ÷ √3 = √(27 ÷ 3)."]
        solution: "Step 1: √27 ÷ √3 = √9. Step 2: √9 = 3, so the side is 3 times as long."
        mistakes: {"9": forgot_root, "24": added_not_multiplied}
      - prompt: What is √3 × √3?
        options:
        - '3'
        - '9'
        - √6
        - '6'
        answer: '3'
        check: sqrt(3)*sqrt(3)
        difficulty: 1
        hints:
        - What does √3 mean?
        - √3 is the number which multiplied by itself gives 3.
        solution: 'Step 1: √3 × √3 = (√3)². Step 2: Squaring undoes the root. Step 3: So it is 3.'
        mistakes:
          '9': doubled_not_squared
      - prompt: A right triangle has shorter sides of 2 cm and 3 cm. How long is its longest side, in cm?
        options:
        - √13
        - '5'
        - √5
        - '13'
        answer: √13
        check: sqrt(2**2 + 3**2)
        difficulty: 2
        hints:
        - Square the two shorter sides and add them.
        - 2² + 3² = 4 + 9.
        solution: 'Step 1: 2² + 3² = 4 + 9 = 13. Step 2: The longest side squared is 13. Step 3: So it is √13 cm.'
        mistakes:
          '5': added_sides
          '13': forgot_root
      - prompt: A square has sides of 5 cm. How long is its diagonal, in cm?
        options:
        - 5√2
        - '10'
        - √10
        - '25'
        answer: 5√2
        check: sqrt(5**2 + 5**2)
        difficulty: 2
        hints:
        - The diagonal makes a right triangle with two sides of the square.
        - 5² + 5² = 50, and √50 = √25 × √2.
        solution: 'Step 1: Diagonal² = 5² + 5² = 50. Step 2: √50 = √(25 × 2) = 5√2. Step 3: So the diagonal is 5√2 cm, about 7.07 cm.'
        mistakes:
          '10': added_sides
      - prompt: Which of these numbers is NOT irrational?
        options:
        - √36
        - √6
        - √12
        - √2
        answer: √36
        difficulty: 2
        hints:
        - Look for a number under the root that is a perfect square.
        - Which of 36, 6, 12, 2 is some number times itself?
        solution: 'Step 1: 36 = 6 × 6. Step 2: So √36 = 6, a whole number. Step 3: 6, 12 and 2 are not perfect squares, so their roots are irrational.'
        mistakes:
          √12: perfect_square_check
      - prompt: A rectangle is 1 cm wide and its diagonal is 3 cm. How long is the rectangle, in cm?
        options:
        - 2√2
        - '2'
        - √10
        - '8'
        answer: 2√2
        check: sqrt(3**2 - 1**2)
        difficulty: 3
        hints:
        - Width² + length² = diagonal².
        - 1 + length² = 9.
        solution: 'Step 1: length² = 3² − 1² = 8. Step 2: length = √8. Step 3: √8 = √(4 × 2) = 2√2 cm.'
        mistakes:
          '2': added_sides
          '8': forgot_root
  - code: math9.newnum.approximations
    title: Estimating square roots
    after: [math9.newnum.irrational_lengths]
    notes: |
      Useful values: √2 ≈ 1.414, √3 ≈ 1.732, √5 ≈ 2.236. To place √n between whole numbers, find
      the perfect squares either side of n. To get closer, square decimals: 1.41² = 1.9881 and
      1.42² = 2.0164, so √2 is between 1.41 and 1.42. Compare roots by squaring them.
    explanations:
      text: "To estimate √20, find the perfect squares around 20: 16 and 25. So √20 is between √16 = 4 and √25 = 5, and nearer 4 because 20 is nearer 16. In fact √20 ≈ 4.47. The same idea gives the values worth remembering: √2 ≈ 1.414, √3 ≈ 1.732 and √5 ≈ 2.236."
      visual: "Mark 4 and 5 on a number line. Their squares are 16 and 25. 20 is 4 of the 9 steps from 16 to 25, so √20 sits a little under halfway from 4 to 5, at about 4.47."
      step_by_step: "To see why √2 ≈ 1.414: Step 1: 1.4² = 1.96, a little less than 2. Step 2: 1.5² = 2.25, more than 2. Step 3: So √2 is between 1.4 and 1.5. Step 4: 1.41² = 1.9881 and 1.42² = 2.0164, so √2 is between 1.41 and 1.42. Step 5: Going on the same way gives 1.414."
      real_world: "A carpenter needs a diagonal brace for a square frame 50 cm wide. It is 50√2 cm. With √2 ≈ 1.414 that is about 70.7 cm, so a 71 cm piece of wood is enough."
    picture:
      kind: number_line
      from: 3
      to: 6
      step: 0.5
      points:
      - {at: 4, label: √16}
      - {at: 4.47, label: √20}
      - {at: 5, label: √25}
      caption: '20 is between 16 and 25, so √20 is between 4 and 5, a little under halfway: about 4.47.'
      alt: A number line from 3 to 6. The square root of 20 sits between 4, the root of 16, and 5, the root of 25, at about 4.47.
    activity:
      type: formula
      prompt: Estimate √10 by squaring guesses.
      inputs:
      - name: x
        label: Guess
        min: 3
        max: 4
        step: 0.01
        start: 3
      outputs:
      - name: sq
        label: Guess²
        expr: x^2
        places: 4
      goals:
      - prompt: Find a guess whose square is between 9.9 and 10.1.
        want:
          sq:
          - 9.9
          - 10.1
        hint: 3² = 9 and 4² = 16, so √10 is a little over 3.
        mistakes:
        - when:
            sq:
            - 10.1001
            - 16
          say: Your guess squared is more than 10, so your guess is bigger than √10.
    lesson:
      - teach: 'To see roughly how big √30 is, find the perfect squares on each side of 30: 25 = 5² and 36 = 6². Since 30 is between 25 and 36, √30 is between 5 and 6.'
        picture:
          kind: number_line
          from: 4
          to: 7
          step: 0.5
          points:
          - at: 5
            label: √25
          - at: 5.48
            label: √30
          - at: 6
            label: √36
          alt: 'A number line from 4 to 7: √30 lies between √25 = 5 and √36 = 6.'
        check:
          prompt: √20 is between which two whole numbers?
          options:
          - 4 and 5
          - 10 and 11
          - 3 and 4
          answer: 4 and 5
          why: 16 = 4² and 25 = 5², and 20 is between 16 and 25.
      - teach: 'To get closer, square decimals. 1.41² = 1.9881 is just below 2 and 1.42² = 2.0164 is just above, so √2 is between 1.41 and 1.42. Useful values to remember: √2 ≈ 1.414, √3 ≈ 1.732, √5 ≈ 2.236.'
        check:
          prompt: 1.7² = 2.89 and 1.8² = 3.24. So √3 is between which two numbers?
          options:
          - 1.7 and 1.8
          - 2.89 and 3.24
          - 1 and 1.7
          answer: 1.7 and 1.8
          why: 3 is between 2.89 and 3.24, so its root is between 1.7 and 1.8.
      - teach: To compare roots, square them. Which is larger, 3√2 or 2√3? (3√2)² = 9 × 2 = 18 and (2√3)² = 4 × 3 = 12. 18 is larger, so 3√2 is larger.
        check:
          prompt: 'Which is larger: 2√2 or √7?'
          options:
          - 2√2
          - √7
          answer: 2√2
          why: (2√2)² = 4 × 2 = 8 and (√7)² = 7. 8 > 7, so 2√2 is larger.
    items:
      - prompt: "√30 lies between which two whole numbers?"
        options: ["5 and 6", "4 and 5", "6 and 7", "15 and 16"]
        answer: "5 and 6"
        difficulty: 1
        hints: ["Which perfect squares are just below and just above 30?", "25 and 36."]
        solution: "Step 1: 25 < 30 < 36. Step 2: √25 = 5 and √36 = 6. Step 3: So √30 is between 5 and 6."
        mistakes: {"15 and 16": half_not_root}
      - prompt: "Using √2 ≈ 1.414, what is 3√2 to three decimal places?"
        answer: "4.242"
        check: "3*1.414"
        difficulty: 1
        hints: ["3√2 means 3 × √2."]
        solution: "Step 1: 3√2 = 3 × 1.414. Step 2: = 4.242."
        mistakes: {"4.414": added_not_multiplied}
      - prompt: "Which number is between √3 and √5?"
        options: ["1.9", "1.6", "2.4", "1.7"]
        answer: "1.9"
        difficulty: 2
        hints: ["√3 ≈ 1.732 and √5 ≈ 2.236."]
        solution: "Step 1: √3 ≈ 1.732 and √5 ≈ 2.236. Step 2: Only 1.9 is between them."
        mistakes: {"1.6": "root_estimate", "2.4": "root_estimate", "1.7": "root_estimate"}
      - prompt: "A steel wire 4 m long is bent into a square. Using √2 ≈ 1.414, how long is the square's diagonal, in metres?"
        answer: "1.414"
        check: "(4/4)*1.414"
        difficulty: 2
        hints: ["Each side is 4 ÷ 4 = 1 m.", "A square of side 1 has diagonal √2."]
        solution: "Step 1: Side = 1 m. Step 2: Diagonal = √2 m ≈ 1.414 m."
        mistakes: {"2": added_sides}
      - prompt: "Which is larger?"
        options: ["3√2", "2√3", "They are equal"]
        answer: "3√2"
        difficulty: 2
        hints: ["Square both numbers.", "(3√2)² = 9 × 2 and (2√3)² = 4 × 3."]
        solution: "Step 1: (3√2)² = 18. Step 2: (2√3)² = 12. Step 3: 18 > 12, so 3√2 is larger."
        mistakes: {"2√3": compare_squares, "They are equal": compare_squares}
      - prompt: "An equilateral triangle has sides of 2 cm, so its height is √3 cm. Using √3 ≈ 1.732, what is its area in cm², to three decimal places?"
        answer: "1.732"
        check: "(1/2)*2*1.732"
        difficulty: 3
        hints: ["Area of a triangle = ½ × base × height.", "½ × 2 × 1.732."]
        solution: "Step 1: Area = ½ × 2 × √3 = √3. Step 2: ≈ 1.732 cm²."
        mistakes: {"3.464": half_base_height}
      - prompt: "Between which two numbers, one decimal place apart, does √10 lie?"
        options: ["3.1 and 3.2", "3.2 and 3.3", "3.0 and 3.1", "5.0 and 5.1"]
        answer: "3.1 and 3.2"
        difficulty: 3
        hints: ["3² = 9 and 4² = 16, so start just above 3.", "Try 3.1² and 3.2²."]
        solution: "Step 1: 3.1² = 9.61, less than 10. Step 2: 3.2² = 10.24, more than 10. Step 3: So √10 is between 3.1 and 3.2."
        mistakes: {"5.0 and 5.1": half_not_root}
      - prompt: "√50 lies between which two whole numbers?"
        options: ["7 and 8", "6 and 7", "24 and 26", "8 and 9"]
        answer: "7 and 8"
        difficulty: 2
        hints: ["Find the perfect squares just below and just above 50.", "49 = 7² and 64 = 8²."]
        solution: "Step 1: 7² = 49 and 8² = 64. Step 2: 50 is between 49 and 64, so √50 is between 7 and 8."
        mistakes: {"24 and 26": half_not_root, "6 and 7": root_estimate}
      - prompt: "Using √3 ≈ 1.732, what is 2√3 + √3 to three decimal places?"
        answer: "5.196"
        check: "3*1.732"
        difficulty: 3
        hints: ["2√3 + √3 is 3 lots of √3.", "3 × 1.732 = ?"]
        solution: "Step 1: 2√3 + √3 = 3√3. Step 2: 3 × 1.732 = 5.196."
        mistakes: {"3.732": added_not_multiplied, "3.464": added_not_multiplied}
      - prompt: "Which is larger: 2√5 or 3√2?"
        options: ["2√5", "3√2", "They are equal"]
        answer: "2√5"
        difficulty: 3
        hints: ["Compare the squares instead.", "(2√5)² = 4 × 5 and (3√2)² = 9 × 2."]
        solution: "Step 1: (2√5)² = 20 and (3√2)² = 18. Step 2: 20 > 18, so 2√5 is larger."
        mistakes: {"3√2": compare_squares, "They are equal": compare_squares}
      - prompt: √70 lies between which two whole numbers?
        options:
        - 8 and 9
        - 7 and 8
        - 35 and 36
        - 6 and 7
        answer: 8 and 9
        difficulty: 1
        hints:
        - Find the perfect squares just below and just above 70.
        - 8² = 64 and 9² = 81.
        solution: 'Step 1: 64 < 70 < 81. Step 2: 64 = 8² and 81 = 9². Step 3: So √70 is between 8 and 9.'
        mistakes:
          35 and 36: half_not_root
      - prompt: Using √5 ≈ 2.236, what is 2√5 to three decimal places?
        answer: '4.472'
        check: 2*2.236
        difficulty: 1
        hints:
        - 2√5 means 2 × √5.
        - Multiply 2.236 by 2.
        solution: 'Step 1: 2√5 = 2 × √5. Step 2: 2 × 2.236 = 4.472. Step 3: So 2√5 ≈ 4.472.'
        mistakes:
          '3.162': root_estimate
      - prompt: 'Which is larger: 4√2 or 3√3?'
        options:
        - 4√2
        - 3√3
        - They are equal
        answer: 4√2
        difficulty: 2
        hints:
        - Square each one.
        - (4√2)² = 16 × 2 and (3√3)² = 9 × 3.
        solution: 'Step 1: (4√2)² = 32. Step 2: (3√3)² = 27. Step 3: 32 > 27, so 4√2 is larger.'
        mistakes:
          3√3: compare_squares
      - prompt: Using √2 ≈ 1.414, how long is the diagonal of a square with sides of 10 cm, in cm, to two decimal places?
        answer: '14.14'
        check: 10*1.414
        difficulty: 2
        hints:
        - A square of side a has diagonal a√2.
        - Multiply 1.414 by 10.
        solution: 'Step 1: Diagonal = 10√2. Step 2: 10 × 1.414 = 14.14. Step 3: So the diagonal is about 14.14 cm.'
        mistakes:
          '20': added_sides
      - prompt: Between which two numbers, one decimal place apart, does √5 lie?
        options:
        - 2.2 and 2.3
        - 2.3 and 2.4
        - 2.1 and 2.2
        - 2.5 and 2.6
        answer: 2.2 and 2.3
        difficulty: 3
        hints:
        - √4 = 2 and √9 = 3, so start by squaring decimals just above 2.
        - 2.2² = 4.84 and 2.3² = 5.29.
        solution: 'Step 1: 2.2² = 4.84, below 5. Step 2: 2.3² = 5.29, above 5. Step 3: So √5 is between 2.2 and 2.3.'
        mistakes:
          2.5 and 2.6: half_not_root

  - code: math9.newnum.recurring
    title: Recurring decimals as fractions
    after: [math9.newnum.square_roots]
    notes: |
      A decimal whose digits repeat for ever, like 0.444…, is a fraction. With x = 0.444…,
      10x = 4.444…, so 9x = 4 and x = 4/9. With two repeating digits multiply by 100:
      0.3636… = 36/99 = 4/11. So recurring decimals are rational, unlike √2.
    explanations:
      text: "0.444… goes on for ever, but it is still a fraction. Call it x. Then 10x = 4.444…. Both have the same never-ending tail, so subtracting, 10x − x = 4. That gives 9x = 4 and x = 4/9. Check: 4 ÷ 9 = 0.444…."
      visual: "Write 10x = 4.4444… above x = 0.4444… so that the 4s line up. Subtract column by column. Every 4 after the point cancels, leaving 9x = 4."
      step_by_step: "For 0.3636…: Step 1: Call it x. Step 2: Two digits repeat, so multiply by 100: 100x = 36.3636…. Step 3: Subtract x: 99x = 36. Step 4: x = 36/99 = 4/11."
      real_world: "Share ₹10 equally among 3 friends: each share is ₹3.333…. That never-ending decimal is just 10/3. In practice each friend gets ₹3.33 and 1 paisa is left over."
    picture:
      kind: flow
      steps: [x = 0.4444…, 10x = 4.4444…, 'Subtract: 10x − x = 4', '9x = 4, so x = 4/9']
      alt: 'Turning 0.4444… into a fraction: 10x minus x leaves 9x = 4, so x = 4/9.'
    activity:
      type: sort
      prompt: Does the fraction become a decimal that ends, or one that repeats forever?
      bins:
      - Ends
      - Repeats
      items:
      - label: 1/4
        bin: Ends
        why: '1/4 = 0.25: it stops after two places.'
        clue: Work out 1 ÷ 4. Does the division stop?
      - label: 1/3
        bin: Repeats
        why: '1/3 = 0.333…: the remainder 1 keeps coming back, so the 3s never stop.'
        clue: Work out 1 ÷ 3. What remainder keeps coming back?
      - label: 2/5
        bin: Ends
        clue: Can 5 be made into 10 by multiplying?
        why: '2/5 = 4/10 = 0.4: it ends.'
      - label: 1/6
        bin: Repeats
        why: '1/6 = 0.1666…: the 3 in 6 makes it repeat.'
        clue: 6 = 2 × 3. Does the 3 matter?
      - label: 3/8
        bin: Ends
        why: '3/8 = 375/1000 = 0.375: it ends.'
        clue: 8 = 2 × 2 × 2. Does 8 go exactly into 1000?
      - label: 2/7
        bin: Repeats
        clue: Divide 2 by 7 for a few places. Do the remainders start again?
        why: '2/7 = 0.285714285714…: the six digits repeat for ever.'
      - label: 7/20
        bin: Ends
        why: 'Only 2s and 5s in the denominator, so it ends: 7/20 = 0.35.'
        clue: 20 = 2 × 2 × 5. Any prime factors other than 2 and 5?
    lesson:
      - teach: Some fractions give decimals that never end. 1/3 = 0.333…, where the 3 repeats for ever. This is called a recurring decimal. 1/4 = 0.25 ends, but 1/3, 2/9 and 4/11 recur.
        check:
          prompt: Which of these gives a decimal that repeats for ever?
          options:
          - 2/3
          - 1/2
          - 3/4
          answer: 2/3
          why: 2/3 = 0.666…, and the 6 repeats for ever. 1/2 = 0.5 and 3/4 = 0.75 end.
      - teach: 'We can turn a recurring decimal back into a fraction. Let x = 0.444… Then 10x = 4.444… Take x away from 10x: the endless 4s cancel, leaving 9x = 4. So x = 4/9.'
        picture:
          kind: flow
          steps:
          - x = 0.444…
          - 10x = 4.444…
          - 10x − x = 4, so 9x = 4
          - x = 4/9
          alt: Multiply 0.444… by 10, subtract the original to cancel the repeating part, and get x = 4/9.
        check:
          prompt: x = 0.888… What is 10x − x?
          options:
          - '8'
          - 8.888…
          - '0.8'
          answer: '8'
          why: 10x = 8.888… and x = 0.888…; the repeating 8s cancel, leaving 8. So 9x = 8 and x = 8/9.
      - teach: 'With two repeating digits, multiply by 100 instead. x = 0.3636…: 100x = 36.3636…, so 99x = 36 and x = 36/99 = 4/11. Every recurring decimal is a fraction, so it is rational. √2''s decimals never repeat.'
        check:
          prompt: To write 0.2525… (25 repeats) as a fraction, what do you multiply x by?
          options:
          - '100'
          - '10'
          - '25'
          answer: '100'
          why: 'Two digits repeat, so multiplying by 100 shifts the decimal by one whole block: 100x = 25.2525…'
    items:
      - prompt: "Which of these fractions gives a recurring decimal?"
        options: ["1/3", "1/4", "1/2", "1/5"]
        answer: "1/3"
        difficulty: 1
        hints: ["Divide each: 1 ÷ 4 = 0.25 stops.", "Try 1 ÷ 3."]
        solution: "Step 1: 1/4 = 0.25, 1/2 = 0.5 and 1/5 = 0.2 stop. Step 2: 1/3 = 0.333… goes on for ever."
        mistakes: {"1/4": "terminating_denominator", "1/5": "terminating_denominator"}
      - prompt: "Write 0.555… (the 5 repeats for ever) as a fraction. Type it like 2/3."
        answer: "5/9"
        check: "nsimplify(0.555555555555556)"
        difficulty: 1
        hints: ["Call it x. What is 10x?", "10x − x = 5."]
        solution: "Step 1: x = 0.555…, so 10x = 5.555…. Step 2: 9x = 5. Step 3: x = 5/9."
        mistakes: {"1/2": over_ten}
      - prompt: "Write 0.222… (the 2 repeats for ever) as a fraction. Type it like 2/3."
        answer: "2/9"
        check: "nsimplify(0.222222222222222)"
        difficulty: 1
        hints: ["One digit repeats, so it goes over 9."]
        solution: "Step 1: x = 0.222…, so 10x = 2.222…. Step 2: 9x = 2. Step 3: x = 2/9."
        mistakes: {"1/5": over_ten}
      - prompt: "Write 0.1212… (12 repeats for ever) as a fraction. Type it like 2/3."
        answer: "4/33"
        check: "nsimplify(0.121212121212121)"
        difficulty: 2
        hints: ["Two digits repeat, so multiply by 100.", "99x = 12."]
        solution: "Step 1: 100x = 12.1212…. Step 2: 99x = 12. Step 3: x = 12/99 = 4/33."
        mistakes: {"3/25": over_ten}
      - prompt: "What is √0.444…? Type a fraction like 2/3."
        answer: "2/3"
        check: "sqrt(nsimplify(0.444444444444444))"
        difficulty: 2
        hints: ["First write 0.444… as a fraction: 4/9.", "Then take the square root of top and bottom."]
        solution: "Step 1: 0.444… = 4/9. Step 2: √(4/9) = 2/3."
        mistakes: {"2/9": root_top_only}
      - prompt: "Write 0.3636… (36 repeats for ever) as a fraction. Type it like 2/3."
        answer: "4/11"
        check: "nsimplify(0.363636363636364)"
        difficulty: 3
        hints: ["Multiply by 100: 100x = 36.3636….", "99x = 36. Simplify the fraction."]
        solution: "Step 1: 100x = 36.3636…. Step 2: 99x = 36. Step 3: x = 36/99 = 4/11."
        mistakes: {"9/25": over_ten}
      - prompt: "x = 0.777… (the 7 repeats for ever). What is 9x?"
        answer: "7"
        check: "9*nsimplify(0.777777777777778)"
        difficulty: 3
        hints: ["10x = 7.777….", "9x = 10x − x."]
        solution: "Step 1: 10x = 7.777…. Step 2: 10x − x = 7. Step 3: So 9x = 7."
        mistakes: {"0.777": "recurring_subtract", "6.993": "recurring_subtract"}
      - prompt: "Write 0.444… (the 4 repeats for ever) as a fraction. Type it like 2/3."
        answer: "4/9"
        check: "4/9"
        difficulty: 2
        hints: ["Let x = 0.444… Then 10x = 4.444…", "Subtract: 10x − x = 4."]
        solution: "Step 1: 10x = 4.444… and x = 0.444… Step 2: 9x = 4. Step 3: x = 4/9."
        mistakes: {"4/10": over_ten, "2/5": over_ten}
      - prompt: "Write 1.333… (the 3 repeats for ever) as a fraction. Type it like 2/3."
        answer: "4/3"
        check: "1 + 3/9"
        difficulty: 3
        hints: ["The whole number 1 stays. 0.333… is a fraction you know.", "0.333… = 3/9 = 1/3."]
        solution: "Step 1: 0.333… = 3/9 = 1/3. Step 2: 1 + 1/3 = 4/3."
        mistakes: {"13/10": over_ten, "1/3": recurring_subtract}
      - prompt: "Write 0.2727… (27 repeats for ever) as a fraction in lowest terms. Type it like 2/3."
        answer: "3/11"
        check: "27/99"
        difficulty: 3
        hints: ["Two digits repeat, so multiply by 100.", "100x − x = 27, so x = 27/99. Simplify."]
        solution: "Step 1: 100x = 27.2727… and x = 0.2727… Step 2: 99x = 27, so x = 27/99. Step 3: Dividing top and bottom by 9 gives 3/11."
        mistakes: {"27/100": over_ten, "27/90": recurring_subtract}
      - prompt: Write 0.111… (the 1 repeats for ever) as a fraction. Type it like 2/3.
        answer: 1/9
        check: 1/9
        difficulty: 1
        hints:
        - Let x = 0.111… and write down 10x.
        - 10x − x = 1.
        solution: 'Step 1: 10x = 1.111… Step 2: 10x − x = 9x = 1. Step 3: x = 1/9.'
        mistakes:
          1/10: recurring_subtract
      - prompt: Which of these fractions gives a decimal that ends?
        options:
        - 3/8
        - 1/6
        - 2/7
        - 5/9
        answer: 3/8
        difficulty: 1
        hints:
        - Look at the bottom number of each fraction.
        - A fraction ends when its bottom has only 2s and 5s as factors.
        solution: 'Step 1: 8 = 2 × 2 × 2. Step 2: So 3/8 = 0.375, which ends. Step 3: 6, 7 and 9 have other factors, so those fractions recur.'
        mistakes:
          1/6: terminating_denominator
      - prompt: Write 0.0909… (09 repeats for ever) as a fraction in lowest terms. Type it like 2/3.
        answer: 1/11
        check: 9/99
        difficulty: 2
        hints:
        - Two digits repeat, so use 100x.
        - 99x = 9.
        solution: 'Step 1: 100x = 9.0909… Step 2: 100x − x = 99x = 9. Step 3: x = 9/99 = 1/11.'
        mistakes:
          9/100: recurring_subtract
      - prompt: Write 2.666… (the 6 repeats for ever) as a fraction. Type it like 2/3.
        answer: 8/3
        check: 2 + 6/9
        difficulty: 3
        hints:
        - Split it into 2 and 0.666…
        - 0.666… = 6/9 = 2/3.
        solution: 'Step 1: 0.666… = 6/9 = 2/3. Step 2: 2.666… = 2 + 2/3. Step 3: 2 + 2/3 = 8/3.'
        mistakes:
          2/3: recurring_subtract
      - prompt: What is 0.333… + 0.666…? (Both digits repeat for ever.)
        answer: '1'
        check: 1/3 + 2/3
