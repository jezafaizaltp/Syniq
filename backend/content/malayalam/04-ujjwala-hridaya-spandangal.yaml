    items:
      - prompt: "'അങ്കണം' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["മുറ്റം", "ആകാശം", "അടുക്കള", "കിണർ"]
        answer: "മുറ്റം"
        difficulty: 1
        hints: ["'സ്കൂളങ്കണത്തിലെ കൊടിമരം'."]
        solution: "അങ്കണം = മുറ്റം."
        mistakes: {"ആകാശം": mal_word_meaning}
      - prompt: "'ജപ്തി' എന്നാൽ:"
        options: ["കണ്ടുകെട്ടൽ", "ഉത്സവം", "നികുതിയിളവ്", "കൃഷി"]
        answer: "കണ്ടുകെട്ടൽ"
        difficulty: 1
        hints: ["നികുതി മുടങ്ങിയാൽ വരുന്നത്."]
        solution: "ജപ്തി = കണ്ടുകെട്ടൽ."
        mistakes: {"നികുതിയിളവ്": mal_word_meaning}
      - prompt: "'വിവേചനം' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["വേർതിരിവ്", "വിവാഹം", "വിശ്വാസം", "വിജയം"]
        answer: "വേർതിരിവ്"
        difficulty: 2
        hints: ["'ജാതിമതവിവേചനങ്ങളില്ലാതെ'."]
        solution: "വിവേചനം = വേർതിരിവ്."
        mistakes: {"വിശ്വാസം": mal_word_meaning}
      - prompt: "'മടിശ്ശീല' എന്നാൽ:"
        options: ["പണസഞ്ചി", "മടിയുള്ള സ്വഭാവം", "തലയണ", "ഒരു തരം ശീല (തുണി) മാത്രം"]
        answer: "പണസഞ്ചി"
        difficulty: 2
        hints: ["'മടിശ്ശീലയിൽ കൂലിനെല്ലുമായ്'."]
        solution: "മടിശ്ശീല = പണസഞ്ചി, ഉടുവസ്ത്രത്തിന്റെ മുകളറ്റം."
        mistakes: {"മടിയുള്ള സ്വഭാവം": mal_word_meaning}
      - prompt: "'വ്യതിയാനം' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["മാറ്റം", "യാത്ര", "വേദന", "വിജയം"]
        answer: "മാറ്റം"
        difficulty: 2
        hints: ["'ആചാരത്തിൽനിന്നുള്ള വ്യതിയാനം'."]
        solution: "വ്യതിയാനം = മാറ്റം."
        mistakes: {"യാത്ര": "mal_vyathiyanam", "വേദന": "mal_vyathiyanam", "വിജയം": "mal_vyathiyanam"}
      - prompt: "'വർണ്ണശബളം' എന്നതിന്റെ അർഥം:"
        options: ["നിറപ്പകിട്ടാർന്നത്", "ശബ്ദമുള്ളത്", "ഇരുണ്ടത്", "വെളുത്തത്"]
        answer: "നിറപ്പകിട്ടാർന്നത്"
        difficulty: 3
        hints: ["'അവരുടെ ഭാവി എത്ര വർണ്ണശബളം!'"]
        solution: "വർണ്ണശബളം = പല നിറങ്ങളുള്ള, നിറപ്പകിട്ടാർന്ന."
        mistakes: {"ശബ്ദമുള്ളത്": mal_word_meaning}
      - prompt: "'വിവേചനമില്ലാതെ കുട്ടികൾ സ്കൂളിൽ പോകും' — 'വിവേചനം' എന്നതിന്റെ വിപരീതാർഥം നൽകുന്ന ആശയം ഏത്?"
        options: ["സമത്വം", "വേർതിരിവ്", "ജപ്തി", "മാറ്റം"]
        answer: "സമത്വം"
        difficulty: 3
        hints: ["വിവേചനം എന്നാൽ വേർതിരിവ്. അതിന്റെ എതിര് എന്താണ്?"]
        solution: "Step 1: വിവേചനം = ആളുകളെ വേർതിരിച്ചു കാണൽ. Step 2: എല്ലാവരെയും ഒരുപോലെ കാണുന്നത് സമത്വം."
        mistakes: {"വേർതിരിവ്": mal_word_meaning, "ജപ്തി": mal_word_meaning, "മാറ്റം": mal_word_meaning}
      - prompt: "'കർഷകരെ പിഴിയുന്ന നികുതിയും ജപ്തിയും ഇല്ല' — ഇവിടെ 'ജപ്തി' ചെയ്യുമ്പോൾ കർഷകന് എന്തു സംഭവിക്കുന്നു?"
        options: ["കടം തിരിച്ചടയ്ക്കാത്തതിനാൽ ഭൂമിയും സ്വത്തും കണ്ടുകെട്ടപ്പെടുന്നു", "കർഷകന് സമ്മാനം കിട്ടുന്നു", "കർഷകന് പുതിയ ഭൂമി ലഭിക്കുന്നു", "വിളവ് ഇരട്ടിയാകുന്നു"]
        answer: "കടം തിരിച്ചടയ്ക്കാത്തതിനാൽ ഭൂമിയും സ്വത്തും കണ്ടുകെട്ടപ്പെടുന്നു"
        difficulty: 3
        hints: ["പദപരിചയത്തിൽ 'ജപ്തി'ക്ക് നൽകിയ അർഥം ഓർക്കൂ.", "'പിഴിയുന്ന' എന്ന വാക്ക് അത് നല്ലതാണോ ദോഷമാണോ എന്നു പറയുന്നു?"]
        solution: "Step 1: ജപ്തി = കണ്ടുകെട്ടൽ. Step 2: കർഷകന്റെ ഭൂമിയും സ്വത്തും അധികാരികൾ പിടിച്ചെടുക്കുന്നു; അതുകൊണ്ടാണ് അയിഷു അതില്ലാത്ത നാട് സ്വപ്നം കാണുന്നത്."
        mistakes: {"കർഷകന് സമ്മാനം കിട്ടുന്നു": mal_word_meaning, "കർഷകന് പുതിയ ഭൂമി ലഭിക്കുന്നു": mal_word_meaning, "വിളവ് ഇരട്ടിയാകുന്നു": mal_word_meaning}
      - prompt: '''ഇറയം'' എന്ന പദത്തിന്റെ അർഥം:'
        options:
        - പൂമുഖത്തെ ഉയർന്ന തളം
        - അടുക്കള
        - തൊഴുത്ത്
        - കിണർ
        answer: പൂമുഖത്തെ ഉയർന്ന തളം
        difficulty: 1
        hints:
        - കുഞ്ഞുങ്ങൾ വഴിക്കണ്ണുമായി ഇരുന്ന സ്ഥലം.
        - വീടിന്റെ മുൻവശത്തെ ഒരു ഭാഗം.
        solution: ഇറയം = പൂമുഖത്തെ ഉയർന്ന തളം.
        mistakes:
          അടുക്കള: m4_word_meaning
      - prompt: '''വെടിപ്പായ'' എന്ന പദത്തിന്റെ അർഥം:'
        options:
        - വൃത്തിയുള്ള
        - വെടിയൊച്ചയുള്ള
        - പൊട്ടിയ
        - ഇരുണ്ട
        answer: വൃത്തിയുള്ള
        difficulty: 1
        hints:
        - '''വെടി''യുമായി ബന്ധമില്ല.'
        - ഈർക്കിലിവരകളുള്ള മുറ്റം എങ്ങനെയാണ്?
        solution: വെടിപ്പായ = വൃത്തിയുള്ള.
        mistakes:
          വെടിയൊച്ചയുള്ള: m4_word_meaning
      - prompt: '''ഭാസുരം'' എന്ന പദത്തിന്റെ അർഥം:'
        options:
        - ശോഭയുള്ള
        - ഭയമുള്ള
        - ഭാരമുള്ള
        - പഴയ
        answer: ശോഭയുള്ള
        difficulty: 2
        hints:
        - '''ഭാസ്'' = പ്രകാശം.'
        - തിളക്കമുള്ള ഒരു ഭാവി എന്നു പറയുമ്പോൾ.
        solution: ഭാസുരം = ശോഭയുള്ള.
        mistakes:
          ഭയമുള്ള: m4_word_meaning
      - prompt: '''മെഴുക്ക് വെടിഞ്ഞ കറിച്ചട്ടികൾ'' — ''മെഴുക്ക്'' എന്നാൽ:'
        options:
        - എണ്ണമയം
        - മെഴുകുതിരി
        - പൊടി
        - വെള്ളം
        answer: എണ്ണമയം
        difficulty: 2
        hints:
        - കഴുകി വൃത്തിയാക്കുമ്പോൾ പോകുന്നത്.
        - പാചകത്തിനു ശേഷം പാത്രത്തിൽ പറ്റിപ്പിടിക്കുന്നത്.
        solution: മെഴുക്ക് = എണ്ണമയം; കഴുകി എണ്ണമയം പോയ പാത്രങ്ങൾ.
        mistakes:
          മെഴുകുതിരി: m4_word_meaning
      - prompt: '''കൈവഴി'' എന്ന പദത്തിന്റെ അർഥം:'
        options:
