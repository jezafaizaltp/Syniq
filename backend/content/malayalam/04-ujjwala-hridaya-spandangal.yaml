        - '''ഇവരും ദൈവത്തിന്റെ മക്കൾ.'''
        solution: വേർതിരിവില്ലാതെ എല്ലാവരെയും ഒപ്പമിരുത്തുന്നതാണ് ഗുരുവിന്റെ പ്രവൃത്തിയുടെ പാഠം.
