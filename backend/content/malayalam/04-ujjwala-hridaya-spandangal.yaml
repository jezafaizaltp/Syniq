subject: mal
chapter: 4
title: "കേരളപാഠാവലി 4: ഉജ്ജ്വലഹൃദയസ്പന്ദങ്ങൾ"

tips:
  mal_read_again: "പാഠഭാഗം വീണ്ടും വായിക്കുക. ഉത്തരം മിക്കപ്പോഴും പാഠത്തിൽത്തന്നെ നേരിട്ടു പറയുന്നുണ്ട്."
  mal_author_work: "എഴുത്തുകാരനെയും കൃതിയെയും ചേർത്ത് ഓർക്കുക: പാഠത്തിന്റെ ഒടുവിൽ [ ] ൽ എഴുത്തുകാരന്റെ പേരും മുകളിൽ കൃതിയുടെ പേരും ഉണ്ട്."
  mal_ayishu_hopes: "അയിഷുവിന്റെ സ്വാതന്ത്ര്യപ്രതീക്ഷകൾ: വെള്ളക്കാരും അവർ താങ്ങിനിർത്തുന്ന രാജാക്കന്മാരും ഇല്ല; കർഷകരെ പിഴിയുന്ന നികുതിയും ജപ്തിയും ഇല്ല; കുഞ്ഞുങ്ങൾ വയറുനിറയെ ഉണ്ണും; ജാതിമതവിവേചനമില്ലാതെ പഠിക്കും."
  mal_guru_message: "അരുവിപ്പുറത്ത് ശിവപ്രതിഷ്ഠ നടത്തിയ സാമൂഹ്യപരിഷ്കർത്താവിന്റെ പ്രശസ്ത സന്ദേശമാണിത്; 19-ാം നൂറ്റാണ്ടിന്റെ അവസാനത്തിലാണ് പ്രതിഷ്ഠ. സന്ദേശം എന്തിന്റെയൊക്കെ ഭേദം ഇല്ലാതാകണമെന്നാണ് പറയുന്നത്?"
  mal_letters_symbol: "'അനേകമക്ഷരങ്ങൾ' വിദ്യാഭ്യാസത്തിന്റെയും അറിവിന്റെയും പ്രതീകമാണ്: അക്ഷരം നിഷേധിക്കപ്പെട്ട ഒരു ജനതയുടെ മക്കൾ ഇപ്പോൾ പഠിക്കുന്നു."
  mal_imagery: "വാക്കുകൾ കൊണ്ട് കണ്ണിനു മുന്നിൽ ഒരു ദൃശ്യം വരയ്ക്കുന്ന പ്രയോഗത്തിന് മലയാളത്തിൽ ഒരു പേരുണ്ട്. ഉപമയിൽ എന്തിനെ എന്തിനോട് താരതമ്യം ചെയ്യുന്നു എന്ന് നോക്കൂ; ആ ചിത്രം ഏത് അനുഭവം ഉണ്ടാക്കുന്നു എന്നും ചിന്തിക്കൂ."
  mal_word_meaning: "പദപരിചയത്തിൽ നൽകിയ അർഥം നോക്കുക: പാഠത്തിലെ സന്ദർഭത്തിൽ ആ വാക്കിന് പ്രത്യേക അർഥമുണ്ട്."
  mal_ayishu: "നോവൽഭാഗം ഒരു മുസ്ലിം പെൺകുട്ടിയുടെ പഠനത്തിനും സ്വാതന്ത്ര്യത്തിനുമുള്ള ആഗ്രഹത്തെക്കുറിച്ചാണ്. പാഠത്തിൽ ആവർത്തിച്ചുവരുന്ന പേര് ഓർക്കൂ."
  mal_guru_influence: "പ്രസംഗമില്ലാതെ തന്നെ ജനങ്ങൾ നിർദേശം അനുസരിച്ചു. ഭയമാണോ, അതോ ഗുരുവിനോടുള്ള വിശ്വാസമാണോ അതിനു കാരണം?"
  mal_guru_workers: "ഗുരു വാക്കുകൊണ്ടല്ല, ഒരു പ്രവൃത്തികൊണ്ടാണ് മാറിയിരുന്നവരെ ചേർത്തുപിടിച്ചത്. അവരെ അകറ്റുകയല്ല, അടുത്തിരുത്തുകയാണ്."
  mal_ilanji: "കവിതയിലെ മരം സുഗന്ധമുള്ള ചെറിയ പൂക്കൾ പൊഴിക്കുന്ന ഒന്നാണ്. കവിതയിലെ വരി വീണ്ടും വായിക്കൂ."
  mal_vyathiyanam: "'കാലാവസ്ഥാവ്യതിയാനം' എന്ന പ്രയോഗം ഓർക്കൂ. കാലാവസ്ഥയ്ക്ക് എന്തു സംഭവിക്കുന്നതിനെയാണ് അതു പറയുന്നത്?"
  m4_ayishu_scene: 'സ്വാതന്ത്ര്യദിനത്തിലെ രംഗങ്ങൾ ക്രമത്തിൽ ഓർക്കൂ: സ്കൂളിലെ ചടങ്ങ്, പതാക ഉയർത്തൽ, പിന്നെ ഘോഷയാത്ര. ചോദ്യം ഏതു രംഗത്തെക്കുറിച്ചാണ്?'
  m4_ayishu_dream: അയിഷുവിന്റെ സ്വപ്നം പഠനവുമായി ബന്ധപ്പെട്ടതാണ്. നാട്ടുകാരുടെ പ്രതീക്ഷകൾ ജീവിതവുമായും നീതിയുമായും ബന്ധപ്പെട്ടതാണ്. ഈ ഉത്തരം അവയിൽ ഏതിനോട് ചേരും?
  m4_guru_scene: 'അരുവിപ്പുറത്തെ സംഭവങ്ങൾ രണ്ടുണ്ട്: 1888-ലെ സന്ദേശം, അടുത്ത വർഷത്തെ ശിവരാത്രിയോഗം. ചോദ്യം ഏതിനെക്കുറിച്ചാണ്?'
  m4_guru_act: ഗുരു പ്രസംഗിക്കുന്നതിനെക്കാൾ പ്രവൃത്തിയിലൂടെയാണ് പഠിപ്പിച്ചത്. ഈ ഉത്തരം ആ രീതിയോട് ചേരുമോ എന്നു നോക്കൂ.
  m4_akshara_picture: 'കവിതയിലെ വീട്ടുകാഴ്ച ഒന്നുകൂടി മനസ്സിൽ കാണൂ: മുറ്റം, ഇറയം, പാത്രങ്ങൾ, കുഞ്ഞുങ്ങൾ. ചോദ്യം ഏതു കാഴ്ചയെക്കുറിച്ചാണ്?'
  m4_akshara_meaning: കവിതയിൽ 'അക്ഷരം' വെറും എഴുത്തുരൂപമല്ല. അത് ഒരു തലമുറയ്ക്ക് കിട്ടിയ എന്തിനെയാണ് കാണിക്കുന്നത്?
  m4_word_meaning: പദം പാഠത്തിലെ വാക്യത്തിൽ വച്ചു വായിക്കൂ. ഏത് അർഥം ചേർത്താലാണ് വാക്യം ശരിയാകുന്നത്?

concepts:
  - code: mal9.u4.swathanthryam
    title: സ്വാതന്ത്ര്യംതന്നെ ജീവിതം
    notes: |
      ഖദീജാ മുംതാസിന്റെ 'നീട്ടിയെഴുത്തുകൾ' എന്ന നോവലിലെ ഭാഗം. ഇന്ത്യാചരിത്രവും കേരളത്തിന്റെ
      നവോത്ഥാനവും ചേർത്ത് മൂന്നു തലമുറയുടെ ജീവിതം പറയുന്ന നോവൽ. കേന്ദ്രകഥാപാത്രം അയിഷു.
      പത്താംക്ലാസിൽ ഡിസ്റ്റിങ്ഷൻ നേടി മഹാരാജാസ് എന്ന 'സ്വപ്നകലാലയ'ത്തിൽ ചേരാനിരിക്കെയാണ്
      സ്വാതന്ത്ര്യദിനം വരുന്നത്: "ഇന്ത്യ സ്വതന്ത്രയാവുന്നു! ഞാനും സ്വതന്ത്രയാവുന്നു!" അവളുടെ മനസ്സ്
      "പീലി വിരിച്ച മയിലായി". റമദാനു മുമ്പ് വീട് വൃത്തിയാക്കുമ്പോഴുള്ള തെളിച്ചം നാടിനു മുഴുവൻ.
      പ്രതീക്ഷകൾ: വെള്ളക്കാരും അവർ താങ്ങിനിർത്തുന്ന രാജാക്കന്മാരും വെള്ളപ്പട്ടാളവും ഇല്ല; നമ്മൾ
      നമ്മളെ ഭരിക്കും; കർഷകരെ പിഴിയുന്ന നികുതിയും ജപ്തിയും ഹുണ്ടികപ്പിരിവുകാരും പൂഴ്ത്തിവയ്പുകാരും
      ഇല്ല; കുഞ്ഞുങ്ങൾ വയറുനിറയെ ഭക്ഷണം കഴിച്ച് ജാതിമതവിവേചനമില്ലാതെ സ്കൂളിൽ പോകും. 'ഗേൾസിൽ'
      ഹെഡ്മാസ്റ്ററുടെ സന്ദേശം, 'ജയ്ഹിന്ദ്', ദേശീയപതാക ആദ്യമായി കൊടിമരത്തിലേക്ക് "ചിറകു കുടഞ്ഞു
      കയറി", "വന്ദേമാതരം". ഘോഷയാത്ര വടക്കേനടയിൽനിന്ന് ചേരമാൻ പള്ളിക്കു മുമ്പിലൂടെ അഴീക്കോട്
      കടപ്പുറത്തേക്ക്. ബന്ധപ്പെട്ടവ: 1947 ആഗസ്റ്റ് 14 അർധരാത്രി നെഹ്റുവിന്റെ പ്രസംഗം; വള്ളത്തോളിന്റെ
      "പോരാ പോരാ നാളിൽ നാളിൽ ദൂരദൂരമുയരട്ടെ".
    explanations:
      text: "1947-ലെ സ്വാതന്ത്ര്യദിനം ഒരു പെൺകുട്ടിയുടെ കണ്ണിലൂടെ കാണുകയാണ് ഈ നോവൽഭാഗം. നാടിന്റെ സ്വാതന്ത്ര്യവും സ്വന്തം പഠനസ്വപ്നവും ഒന്നിച്ചു വിടരുന്നു. നികുതിയും പട്ടിണിയും ജാതിവിവേചനവുമില്ലാത്ത ഒരു നാടാണ് എല്ലാവരും സ്വപ്നം കാണുന്നത്."
      visual: "ഒരു ചിത്രം വരയ്ക്കുക: പീലി വിരിച്ച മയിൽ (അയിഷുവിന്റെ മനസ്സ്), കൊടിമരത്തിലേക്ക് ചിറകു കുടഞ്ഞു കയറുന്ന ത്രിവർണ്ണപതാക, പല സ്കൂളുകളിൽനിന്നുള്ള ജാഥകൾ കൈവഴികൾപോലെ ഒന്നിച്ച് ഒരു വലിയ പുഴയാകുന്നത്."
      step_by_step: "'മനസ്സ് മുഴുവനുമൊരു പീലി വിരിച്ച മയിലായി' എന്നതിന്റെ അർഥം: 1. മയിൽ പീലി വിരിക്കുന്നത് സന്തോഷത്തിലാണ്. 2. അയിഷുവിന്റെ മനസ്സിനെ അതിനോട് ചേർത്തുവയ്ക്കുന്നു. 3. അവൾ അതിരറ്റ ആഹ്ലാദത്തിലാണ് എന്നു കാണിക്കുന്നു."
      real_world: "ഇന്നും ആഗസ്റ്റ് 15-ന് സ്കൂളുകളിൽ പതാക ഉയർത്തലും ദേശഭക്തിഗാനവും ഘോഷയാത്രയും നടക്കുന്നു. 1947-ൽ ആദ്യമായി അതു ചെയ്തവരുടെ ആവേശം ഈ പാഠത്തിലുണ്ട്."
    activity:
      type: sort
      prompt: 'സ്വാതന്ത്ര്യദിനത്തിൽ അയിഷുവിന്റെ പ്രതീക്ഷകൾ: എന്ത് ഇല്ലാതാകും, എന്ത് പുതുതായി വരും?'
      bins:
      - ഇല്ലാതാകും
      - പുതുതായി വരും
      items:
      - label: വെള്ളപ്പട്ടാളം
        bin: ഇല്ലാതാകും
        clue: സ്വതന്ത്ര ഇന്ത്യയിൽ ആരുടെ പട്ടാളം വേണ്ട?
        why: വെള്ളക്കാരും അവരുടെ പട്ടാളവും പോകും എന്ന് അയിഷു.
      - label: കർഷകരെ പിഴിയുന്ന നികുതിയും ജപ്തിയും
        bin: ഇല്ലാതാകും
        clue: കർഷകർ എന്തിൽനിന്ന് മോചിതരാകും?
        why: ഇവ ഇല്ലാതാകും എന്നാണ് അയിഷുവിന്റെ സ്വപ്നം.
      - label: പൂഴ്ത്തിവയ്പുകാർ
        bin: ഇല്ലാതാകും
        clue: ഭക്ഷണം ഒളിപ്പിച്ചുവച്ച് വില കൂട്ടുന്നവർക്ക് എന്തു സംഭവിക്കും?
        why: പൂഴ്ത്തിവയ്പുകാർ ഇല്ലാത്ത നാടാണ് അയിഷുവിന്റെ പ്രതീക്ഷ.
      - label: നമ്മൾ നമ്മളെ ഭരിക്കും
        bin: പുതുതായി വരും
        clue: വെള്ളക്കാർ പോകുമ്പോൾ ഭരണം ആരുടെ കൈയിൽ?
        why: സ്വയംഭരണം പുതുതായി വരുന്നു.
      - label: കുഞ്ഞുങ്ങൾ വയറുനിറയെ ഭക്ഷണം കഴിക്കും
        bin: പുതുതായി വരും
        clue: ഇത് മാറ്റപ്പെടേണ്ടതോ കൊണ്ടുവരേണ്ടതോ?
        why: 'വിശപ്പില്ലാത്ത കുട്ടിക്കാലം: പുതിയ പ്രതീക്ഷ.'
      - label: ജാതിമതവിവേചനമില്ലാതെ സ്കൂളിൽ
        bin: പുതുതായി വരും
        clue: എല്ലാ കുട്ടികളും എങ്ങനെ സ്കൂളിൽ പോകും?
        why: 'വിവേചനമില്ലാത്ത വിദ്യാഭ്യാസം: പുതിയ പ്രതീക്ഷ.'
    lesson:
      - teach: '''സ്വാതന്ത്ര്യംതന്നെ ജീവിതം'' ഖദീജാ മുംതാസിന്റെ ''നീട്ടിയെഴുത്തുകൾ'' എന്ന നോവലിലെ ഭാഗമാണ്. ഇന്ത്യാചരിത്രവും കേരളനവോത്ഥാനവും ചേർത്ത് മൂന്നു തലമുറയുടെ ജീവിതം പറയുന്ന നോവൽ. കേന്ദ്രകഥാപാത്രം അയിഷു. പത്താംക്ലാസിൽ ഡിസ്റ്റിങ്ഷൻ നേടി, മഹാരാജാസ് കോളേജിൽ ചേരാൻ കാത്തിരിക്കുകയാണ് അവൾ.'
        check:
          prompt: 'അയിഷു പത്താംക്ലാസിൽ നേടിയത്:'
          options:
          - ഡിസ്റ്റിങ്ഷൻ
          - തോൽവി
          - സ്കോളർഷിപ്പ് പരീക്ഷയിൽ ഒന്നാംസ്ഥാനം
          answer: ഡിസ്റ്റിങ്ഷൻ
          why: ഡിസ്റ്റിങ്ഷൻ നേടി മഹാരാജാസിൽ ചേരാനിരിക്കുകയാണ്.
      - teach: 'അപ്പോഴാണ് സ്വാതന്ത്ര്യദിനം: ''ഇന്ത്യ സ്വതന്ത്രയാവുന്നു! ഞാനും സ്വതന്ത്രയാവുന്നു!'' അവളുടെ മനസ്സ് പീലി വിരിച്ച മയിലായി. നാട്ടുകാരുടെ പ്രതീക്ഷകൾ: വെള്ളക്കാരും അവർ താങ്ങിനിർത്തുന്ന രാജാക്കന്മാരുമില്ല; നമ്മൾ നമ്മളെ ഭരിക്കും; കർഷകരെ പിഴിയുന്ന നികുതിയും ജപ്തിയും പൂഴ്ത്തിവയ്പും ഇല്ല; കുഞ്ഞുങ്ങൾ വിശപ്പില്ലാതെ, ജാതിമതവിവേചനമില്ലാതെ സ്കൂളിൽ പോകും.'
        picture:
          kind: compare
          columns:
          - title: അയിഷുവിന്റെ സ്വപ്നം
            points:
            - മഹാരാജാസിൽ പഠിക്കണം
            - ഞാനും സ്വതന്ത്രയാവുന്നു
          - title: നാടിന്റെ പ്രതീക്ഷ
            points:
            - നമ്മൾ നമ്മളെ ഭരിക്കും
