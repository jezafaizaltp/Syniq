        - വടക്കേനടയ്ക്കും കടപ്പുറത്തിനും ഇടയിൽ.
        solution: വടക്കേനടയിൽനിന്ന് ചേരമാൻ പള്ളിക്കു മുമ്പിലൂടെ അഴീക്കോട് കടപ്പുറത്തേക്ക്.
