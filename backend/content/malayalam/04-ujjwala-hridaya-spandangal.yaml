        check:
          prompt: '''തസ്തിക'' എന്നതിന്റെ അർഥം:'
          options:
          - ഔദ്യോഗിക സ്ഥാനം
          - നികുതി
          - കടപ്പുറം
          answer: ഔദ്യോഗിക സ്ഥാനം
          why: 'ഉദാ: അധ്യാപക തസ്തിക.'
      - teach: 'ഭാവവും ഭംഗിയും കാണിക്കുന്നവ: ത്രസിപ്പ് (തുടിപ്പ്), ഭാസുരം (ശോഭയുള്ള), വർണ്ണശബളം (നിറപ്പകിട്ടാർന്നത്), വാസരം (പകൽ), വ്യതിയാനം (മാറ്റം), കൈവഴി (നദിയുടെ ശാഖ).'
