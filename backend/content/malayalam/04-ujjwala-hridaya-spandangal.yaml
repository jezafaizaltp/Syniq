        - ഗുരു അവരിൽനിന്ന് രണ്ടു കുട്ടികളെ വിളിച്ചു.
        solution: പാവപ്പെട്ട കർഷകത്തൊഴിലാളികൾ മാറിയിരിക്കുന്നത് ഗുരു കണ്ടു.
        mistakes:
          ക്ഷേത്രഭാരവാഹികൾ: m4_guru_scene
      - prompt: യോഗത്തിനൊടുവിൽ ഗുരു എന്താണ് ചെയ്തത്?
        options:
        - മഠത്തിന്റെ ചുമരിൽ കുറിച്ച വരികൾ ഒരാളെക്കൊണ്ട് ഉറക്കെ വായിപ്പിച്ചു
        - നീണ്ട പ്രസംഗം നടത്തി
        - വെടിക്കെട്ട് തുടങ്ങാൻ പറഞ്ഞു
        - യോഗം പിരിച്ചുവിട്ട് പോയി
        answer: മഠത്തിന്റെ ചുമരിൽ കുറിച്ച വരികൾ ഒരാളെക്കൊണ്ട് ഉറക്കെ വായിപ്പിച്ചു
        difficulty: 2
        hints:
        - ഗുരു സ്വയം പ്രസംഗിച്ചില്ല.
        - ആ വരികൾ എഴുതിവച്ചിരുന്നത് ഒരു ചുമരിലായിരുന്നു.
        solution: ഒടുവിൽ ചുമരിൽ കുറിച്ച സന്ദേശം ഒരാളെക്കൊണ്ട് ഉറക്കെ വായിപ്പിച്ചു.
        mistakes:
