            - എല്ലാ കുഞ്ഞുങ്ങളും സ്കൂളിൽ
          alt: അയിഷുവിന്റെ സ്വപ്നവും നാടിന്റെ പ്രതീക്ഷകളും.
        check:
          prompt: '''ഞാനും സ്വതന്ത്രയാവുന്നു'' എന്ന് അയിഷു പറയുന്നതിൽ അവൾ ചേർത്തുകാണുന്നത്:'
          options:
          - നാടിന്റെ സ്വാതന്ത്ര്യവും തന്റെ പഠനസ്വപ്നവും
          - ജോലിയും ശമ്പളവും
          - യാത്രയും വിനോദവും
          answer: നാടിന്റെ സ്വാതന്ത്ര്യവും തന്റെ പഠനസ്വപ്നവും
          why: പഠിക്കാനുള്ള അവസരം കൂടി തുറക്കുമെന്ന് അവൾ കരുതി.
      - teach: സ്കൂളിൽ ('ഗേൾസിൽ') ഹെഡ്മാസ്റ്ററുടെ സന്ദേശം, 'ജയ്ഹിന്ദ്'. ദേശീയപതാക ആദ്യമായി കൊടിമരത്തിലേക്ക് 'ചിറകു കുടഞ്ഞു കയറി'; 'വന്ദേമാതരം' മുഴങ്ങി. ഘോഷയാത്ര വടക്കേനടയിൽനിന്ന് ചേരമാൻ പള്ളിക്കു മുന്നിലൂടെ അഴീക്കോട് കടപ്പുറത്തേക്ക് നീങ്ങി.
        check:
          prompt: ഘോഷയാത്ര ചെന്നെത്തിയത് എവിടെ?
          options:
