        - ഭൂപടത്തിൽ കേരളം എവിടെ?
        solution: ഭാരതത്തിന്റെ തെക്കേ അറ്റത്തുനിന്നാണ് ഗുരു ഈ സന്ദേശം നൽകിയത്.
        mistakes:
