      - prompt: 'ഇന്നത്തെ ഒരു സ്കൂളിൽ ഗുരുവിന്റെ ഈ പാഠം നടപ്പാക്കാനുള്ള ഏറ്റവും നല്ല വഴി:'
        options:
        - എല്ലാ കുട്ടികളെയും വേർതിരിവില്ലാതെ ഒപ്പമിരുത്തുക
        - കുട്ടികളെ ജാതി തിരിച്ച് ഇരുത്തുക
        - ആഘോഷങ്ങൾക്ക് കൂടുതൽ വെടിക്കെട്ട് നടത്തുക
        - ചിലരെ മാത്രം വേദിയിലേക്ക് വിളിക്കുക
        answer: എല്ലാ കുട്ടികളെയും വേർതിരിവില്ലാതെ ഒപ്പമിരുത്തുക
