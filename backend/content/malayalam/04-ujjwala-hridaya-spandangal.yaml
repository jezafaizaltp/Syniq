        - ദേശീയപതാകയെക്കുറിച്ചുള്ള കവിത.
        solution: വള്ളത്തോളിന്റെ വരികൾ; പതാക ഓരോ ദിവസവും കൂടുതൽ ഉയരട്ടെ എന്ന ആശംസ.
