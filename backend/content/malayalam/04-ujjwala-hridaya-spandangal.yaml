        mistakes: {"റമദാനും സ്വാതന്ത്ര്യദിനവും ഒരേ ദിവസമായിരുന്നു": mal_imagery, "നാട്ടിൽ വൃത്തിയാക്കൽ മത്സരം നടന്നു": mal_imagery, "അയിഷുവിന് വീട്ടുജോലി ഇഷ്ടമല്ല": mal_imagery}
