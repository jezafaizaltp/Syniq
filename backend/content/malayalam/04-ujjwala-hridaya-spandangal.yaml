        hints: ["'സ്വന്തം അന്തരാത്മാവിന്റെ ശബ്ദത്തോടു പ്രതികരിക്കുന്നതുപോലെ'."]
        solution: "വിധി പ്രസ്താവിക്കാതെതന്നെ ജനം അനുസരിച്ചത് ഗുരുവിന്റെ ധാർമ്മികസ്വാധീനം കാണിക്കുന്നു."

        mistakes: {"ഗുരുവിന് സംസാരിക്കാൻ ഇഷ്ടമില്ലായിരുന്നു": "mal_guru_influence", "ജനങ്ങൾ ഗുരുവിനെ ഭയന്നിരുന്നു": "mal_guru_influence", "യോഗം നടന്നില്ല": "mal_guru_influence"}
      - prompt: "ഗുരു രണ്ടു കുട്ടികളെ വിളിച്ച് ഇരുവശത്തും ഇരുത്തി. ഈ പ്രവൃത്തി ഒരു പ്രസംഗത്തെക്കാൾ ശക്തമാകുന്നത് എന്തുകൊണ്ട്?"
        options: ["പറയുന്ന സമത്വം സ്വന്തം പ്രവൃത്തിയിലൂടെ എല്ലാവരുടെയും മുന്നിൽ കാണിച്ചു", "കുട്ടികൾ പാട്ടുപാടി", "ഗുരുവിന് സംസാരിക്കാൻ കഴിഞ്ഞില്ല", "കുട്ടികൾ ഗുരുവിന്റെ ബന്ധുക്കളായിരുന്നു"]
        answer: "പറയുന്ന സമത്വം സ്വന്തം പ്രവൃത്തിയിലൂടെ എല്ലാവരുടെയും മുന്നിൽ കാണിച്ചു"
        difficulty: 3
        hints: ["തൊഴിലാളികൾ യോഗത്തിൽ എവിടെയാണ് ഇരുന്നിരുന്നത്?", "ഗുരു അവരുടെ കുട്ടികളെ എവിടെ ഇരുത്തി?"]
        solution: "Step 1: പാവപ്പെട്ട തൊഴിലാളികൾ മാറിയിരിക്കുകയായിരുന്നു. Step 2: അവരുടെ കുട്ടികളെ തന്റെ അരികിൽ ഇരുത്തിയതിലൂടെ 'ഇവരും ദൈവത്തിന്റെ മക്കൾ' എന്ന സന്ദേശം എല്ലാവരും നേരിട്ടു കണ്ടു."
        mistakes: {"കുട്ടികൾ പാട്ടുപാടി": mal_guru_workers, "ഗുരുവിന് സംസാരിക്കാൻ കഴിഞ്ഞില്ല": mal_guru_influence, "കുട്ടികൾ ഗുരുവിന്റെ ബന്ധുക്കളായിരുന്നു": mal_guru_workers}
      - prompt: "ബുദ്ധൻ അഹിംസയ്ക്കും നബി സാഹോദര്യത്തിനും മുഖ്യത നൽകി എന്ന് ഗുരു പറയുന്നതിലൂടെ എന്തു കാണിക്കുന്നു?"
        options: ["ഓരോ കാലത്തെയും പ്രധാന പ്രശ്നത്തിനനുസരിച്ച് മഹാന്മാർ സന്ദേശം നൽകി", "ബുദ്ധനും നബിയും ഒരേ നാട്ടുകാരാണ്", "ഇന്ത്യയ്ക്ക് ഒരു സന്ദേശവും ആവശ്യമില്ല", "അഹിംസ ഇന്നത്തെ ഏക ആവശ്യമാണ്"]
        answer: "ഓരോ കാലത്തെയും പ്രധാന പ്രശ്നത്തിനനുസരിച്ച് മഹാന്മാർ സന്ദേശം നൽകി"
        difficulty: 3
        hints: ["ബുദ്ധന്റെ കാലത്ത് എന്താണ് കലശലായിരുന്നത്?", "ഗുരുവിന്റെ കാലത്തെ ഇന്ത്യയുടെ പ്രശ്നം എന്തായിരുന്നു?"]
        solution: "Step 1: ഹിംസ കലശലായ കാലത്ത് ബുദ്ധൻ അഹിംസ പറഞ്ഞു; അറേബ്യയിൽ നബി സാഹോദര്യം. Step 2: അതുപോലെ ജാതിമതമത്സരം നിറഞ്ഞ ഇന്ത്യയ്ക്ക് അതിൽനിന്നുള്ള മോചനമാണ് വേണ്ടതെന്ന് ഗുരു പറയുന്നു."
        mistakes: {"ബുദ്ധനും നബിയും ഒരേ നാട്ടുകാരാണ്": mal_read_again, "ഇന്ത്യയ്ക്ക് ഒരു സന്ദേശവും ആവശ്യമില്ല": mal_guru_message, "അഹിംസ ഇന്നത്തെ ഏക ആവശ്യമാണ്": mal_guru_message}
      - prompt: '''അരുവിപ്പുറത്തുനിന്ന് ഒരു സന്ദേശം'' എഴുതിയതാര്?'
        options:
