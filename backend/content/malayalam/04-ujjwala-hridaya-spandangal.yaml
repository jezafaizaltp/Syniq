        - എല്ലാ കുഞ്ഞുങ്ങൾക്കും ഒരുപോലെ.
        solution: കുഞ്ഞുങ്ങൾ വയറുനിറയെ കഴിച്ച് ജാതിമതവിവേചനമില്ലാതെ സ്കൂളിൽ പോകും എന്നായിരുന്നു പ്രതീക്ഷ.
        mistakes:
