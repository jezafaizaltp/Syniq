        - ബങ്കിംചന്ദ്രന്റെ ഗാനത്തിൽനിന്നുള്ളത്.
        solution: ദേശീയപതാക ഉയർന്നപ്പോൾ 'വന്ദേമാതരം' മുഴങ്ങി.
