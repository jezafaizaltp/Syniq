          - മഹാരാജാസ് കോളേജ്
          - അരുവിപ്പുറം
          answer: അഴീക്കോട് കടപ്പുറം
          why: വടക്കേനടയിൽനിന്ന് ചേരമാൻ പള്ളി വഴി അഴീക്കോട് കടപ്പുറത്തേക്ക്.
    items:
      - prompt: "'നീട്ടിയെഴുത്തുകൾ' എന്ന നോവൽ എഴുതിയതാര്?"
        options: ["ഖദീജാ മുംതാസ്", "മാധവിക്കുട്ടി", "ഗ്രേസി", "സന്തോഷ് ഏച്ചിക്കാനം"]
        answer: "ഖദീജാ മുംതാസ്"
