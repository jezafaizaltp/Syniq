    lesson:
      - teach: '''അരുവിപ്പുറത്തുനിന്ന് ഒരു സന്ദേശം'' പി. കെ. ഗോപാലകൃഷ്ണന്റെ ''ശ്രീനാരായണഗുരു: വിശ്വമാനവികതയുടെ പ്രവാചകൻ'' എന്ന കൃതിയിലെ ഭാഗം. 1888-ൽ ഗുരു അരുവിപ്പുറത്തുനിന്ന് നൽകിയ സന്ദേശം: ജാതിഭേദവും മതദ്വേഷവുമില്ലാതെ എല്ലാവരും സോദരത്വേന വാഴുന്ന മാതൃകാസ്ഥാനം.'
