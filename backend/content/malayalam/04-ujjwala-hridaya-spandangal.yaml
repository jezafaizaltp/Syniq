subject: mal
chapter: 4
title: "കേരളപാഠാവലി 4: ഉജ്ജ്വലഹൃദയസ്പന്ദങ്ങൾ"

tips:
  mal_read_again: "പാഠഭാഗം വീണ്ടും വായിക്കുക. ഉത്തരം മിക്കപ്പോഴും പാഠത്തിൽത്തന്നെ നേരിട്ടു പറയുന്നുണ്ട്."
  mal_author_work: "എഴുത്തുകാരനെയും കൃതിയെയും ചേർത്ത് ഓർക്കുക: പാഠത്തിന്റെ ഒടുവിൽ [ ] ൽ എഴുത്തുകാരന്റെ പേരും മുകളിൽ കൃതിയുടെ പേരും ഉണ്ട്."
  mal_ayishu_hopes: "അയിഷുവിന്റെ സ്വാതന്ത്ര്യപ്രതീക്ഷകൾ: വെള്ളക്കാരും അവർ താങ്ങിനിർത്തുന്ന രാജാക്കന്മാരും ഇല്ല; കർഷകരെ പിഴിയുന്ന നികുതിയും ജപ്തിയും ഇല്ല; കുഞ്ഞുങ്ങൾ വയറുനിറയെ ഉണ്ണും; ജാതിമതവിവേചനമില്ലാതെ പഠിക്കും."
  mal_guru_message: "1888-ൽ അരുവിപ്പുറത്തുനിന്ന് ഗുരു നൽകിയ സന്ദേശം: ജാതിഭേദവും മതദ്വേഷവും ഇല്ലാതെ എല്ലാവരും സോദരത്വേന വാഴുക."
  mal_letters_symbol: "'അനേകമക്ഷരങ്ങൾ' വിദ്യാഭ്യാസത്തിന്റെയും അറിവിന്റെയും പ്രതീകമാണ്: അക്ഷരം നിഷേധിക്കപ്പെട്ട ഒരു ജനതയുടെ മക്കൾ ഇപ്പോൾ പഠിക്കുന്നു."
  mal_imagery: "വാങ്മയചിത്രം: വാക്കുകൾകൊണ്ട് കണ്ണിനു മുന്നിൽ ഒരു ദൃശ്യം വരയ്ക്കുന്ന പ്രയോഗം (ഉദാ: വെയിലത്ത് ഉണങ്ങി മിനുങ്ങുന്ന കഞ്ഞിക്കലം)."
  mal_word_meaning: "പദപരിചയത്തിൽ നൽകിയ അർഥം നോക്കുക: പാഠത്തിലെ സന്ദർഭത്തിൽ ആ വാക്കിന് പ്രത്യേക അർഥമുണ്ട്."

concepts:
  - code: mal9.u4.swathanthryam
    title: സ്വാതന്ത്ര്യംതന്നെ ജീവിതം
    notes: |
      ഖദീജാ മുംതാസിന്റെ 'നീട്ടിയെഴുത്തുകൾ' എന്ന നോവലിലെ ഭാഗം. ഇന്ത്യാചരിത്രവും കേരളത്തിന്റെ
      നവോത്ഥാനവും ചേർത്ത് മൂന്നു തലമുറയുടെ ജീവിതം പറയുന്ന നോവൽ. കേന്ദ്രകഥാപാത്രം അയിഷു.
      പത്താംക്ലാസിൽ ഡിസ്റ്റിങ്ഷൻ നേടി മഹാരാജാസ് എന്ന 'സ്വപ്നകലാലയ'ത്തിൽ ചേരാനിരിക്കെയാണ്
      സ്വാതന്ത്ര്യദിനം വരുന്നത്: "ഇന്ത്യ സ്വതന്ത്രയാവുന്നു! ഞാനും സ്വതന്ത്രയാവുന്നു!" അവളുടെ മനസ്സ്
      "പീലി വിരിച്ച മയിലായി". റമദാനു മുമ്പ് വീട് വൃത്തിയാക്കുമ്പോഴുള്ള തെളിച്ചം നാടിനു മുഴുവൻ.
      പ്രതീക്ഷകൾ: വെള്ളക്കാരും അവർ താങ്ങിനിർത്തുന്ന രാജാക്കന്മാരും വെള്ളപ്പട്ടാളവും ഇല്ല; നമ്മൾ
      നമ്മളെ ഭരിക്കും; കർഷകരെ പിഴിയുന്ന നികുതിയും ജപ്തിയും ഹുണ്ടികപ്പിരിവുകാരും പൂഴ്ത്തിവയ്പുകാരും
      ഇല്ല; കുഞ്ഞുങ്ങൾ വയറുനിറയെ ഭക്ഷണം കഴിച്ച് ജാതിമതവിവേചനമില്ലാതെ സ്കൂളിൽ പോകും. 'ഗേൾസിൽ'
      ഹെഡ്മാസ്റ്ററുടെ സന്ദേശം, 'ജയ്ഹിന്ദ്', ദേശീയപതാക ആദ്യമായി കൊടിമരത്തിലേക്ക് "ചിറകു കുടഞ്ഞു
      കയറി", "വന്ദേമാതരം". ഘോഷയാത്ര വടക്കേനടയിൽനിന്ന് ചേരമാൻ പള്ളിക്കു മുമ്പിലൂടെ അഴീക്കോട്
      കടപ്പുറത്തേക്ക്. ബന്ധപ്പെട്ടവ: 1947 ആഗസ്റ്റ് 14 അർധരാത്രി നെഹ്റുവിന്റെ പ്രസംഗം; വള്ളത്തോളിന്റെ
      "പോരാ പോരാ നാളിൽ നാളിൽ ദൂരദൂരമുയരട്ടെ".
    explanations:
      text: "1947-ലെ സ്വാതന്ത്ര്യദിനം ഒരു പെൺകുട്ടിയുടെ കണ്ണിലൂടെ കാണുകയാണ് ഈ നോവൽഭാഗം. നാടിന്റെ സ്വാതന്ത്ര്യവും സ്വന്തം പഠനസ്വപ്നവും ഒന്നിച്ചു വിടരുന്നു. നികുതിയും പട്ടിണിയും ജാതിവിവേചനവുമില്ലാത്ത ഒരു നാടാണ് എല്ലാവരും സ്വപ്നം കാണുന്നത്."
      visual: "ഒരു ചിത്രം വരയ്ക്കുക: പീലി വിരിച്ച മയിൽ (അയിഷുവിന്റെ മനസ്സ്), കൊടിമരത്തിലേക്ക് ചിറകു കുടഞ്ഞു കയറുന്ന ത്രിവർണ്ണപതാക, പല സ്കൂളുകളിൽനിന്നുള്ള ജാഥകൾ കൈവഴികൾപോലെ ഒന്നിച്ച് ഒരു വലിയ പുഴയാകുന്നത്."
      step_by_step: "'മനസ്സ് മുഴുവനുമൊരു പീലി വിരിച്ച മയിലായി' എന്നതിന്റെ അർഥം: 1. മയിൽ പീലി വിരിക്കുന്നത് സന്തോഷത്തിലാണ്. 2. അയിഷുവിന്റെ മനസ്സിനെ അതിനോട് ചേർത്തുവയ്ക്കുന്നു. 3. അവൾ അതിരറ്റ ആഹ്ലാദത്തിലാണ് എന്നു കാണിക്കുന്നു."
      real_world: "ഇന്നും ആഗസ്റ്റ് 15-ന് സ്കൂളുകളിൽ പതാക ഉയർത്തലും ദേശഭക്തിഗാനവും ഘോഷയാത്രയും നടക്കുന്നു. 1947-ൽ ആദ്യമായി അതു ചെയ്തവരുടെ ആവേശം ഈ പാഠത്തിലുണ്ട്."
    items:
      - prompt: "'നീട്ടിയെഴുത്തുകൾ' എന്ന നോവൽ എഴുതിയതാര്?"
        options: ["ഖദീജാ മുംതാസ്", "മാധവിക്കുട്ടി", "ഗ്രേസി", "സന്തോഷ് ഏച്ചിക്കാനം"]
        answer: "ഖദീജാ മുംതാസ്"
        difficulty: 1
        hints: ["പാഠത്തിന്റെ ഒടുവിൽ [ ] ൽ നോക്കുക."]
        solution: "'നീട്ടിയെഴുത്തുകൾ' ഖദീജാ മുംതാസിന്റെ നോവലാണ്."
        mistakes: {"ഗ്രേസി": mal_author_work}
      - prompt: "നോവൽഭാഗത്തിലെ പ്രധാന കഥാപാത്രം ആര്?"
        options: ["അയിഷു", "ഭാഗ്യലക്ഷ്മി", "സുനിത", "നാരായണി"]
        answer: "അയിഷു"
        difficulty: 1
        hints: ["പത്താംക്ലാസിൽ ഡിസ്റ്റിങ്ഷൻ നേടിയ പെൺകുട്ടി."]
        solution: "അയിഷുവാണ് പ്രധാന കഥാപാത്രം."
      - prompt: "അയിഷു ചേരാൻ സ്വപ്നം കണ്ട കലാലയം ഏത്?"
        options: ["മഹാരാജാസ്", "യൂണിവേഴ്സിറ്റി കോളേജ്", "ശാന്തിനികേതനം", "ബ്രണ്ണൻ കോളേജ്"]
        answer: "മഹാരാജാസ്"
        difficulty: 1
        hints: ["'മഹാരാജാസ് എന്ന സ്വപ്നകലാലയം'."]
        solution: "മഹാരാജാസിൽ ചേരാനാണ് അവൾ അർഹയായത്."
        mistakes: {"ശാന്തിനികേതനം": mal_read_again}
      - prompt: "'അവളുടെ മനസ്സ് മുഴുവനുമൊരു പീലി വിരിച്ച മയിലായി' — ഈ പ്രയോഗം സൂചിപ്പിക്കുന്നത്:"
        options: ["അയിഷുവിന്റെ അതിരറ്റ ആഹ്ലാദം", "അയിഷുവിന്റെ ഭയം", "അയിഷുവിന്റെ ദുഃഖം", "മയിലിനോടുള്ള ഇഷ്ടം"]
        answer: "അയിഷുവിന്റെ അതിരറ്റ ആഹ്ലാദം"
        difficulty: 2
        hints: ["മയിൽ പീലി വിരിക്കുന്നത് എപ്പോഴാണ്?"]
        solution: "നാടും താനും സ്വതന്ത്രയാവുന്നതിന്റെ ആഹ്ലാദം."
        mistakes: {"മയിലിനോടുള്ള ഇഷ്ടം": mal_imagery}
      - prompt: "താഴെ പറയുന്നവയിൽ അയിഷുവും നാട്ടുകാരും സ്വതന്ത്ര ഇന്ത്യയിൽ പ്രതീക്ഷിക്കാത്തത് ഏത്?"
        options: ["കർഷകരെ പിഴിയുന്ന പുതിയ നികുതികൾ", "കുഞ്ഞുങ്ങൾ വയറുനിറയെ ഭക്ഷണം കഴിക്കുന്നത്", "ജാതിമതവിവേചനമില്ലാത്ത സ്കൂളുകൾ", "നമ്മൾതന്നെ നമ്മളെ ഭരിക്കുന്നത്"]
        answer: "കർഷകരെ പിഴിയുന്ന പുതിയ നികുതികൾ"
        difficulty: 2
        hints: ["'ഇനി കൃഷിക്കാരെ പിഴിയുന്ന നികുതിയുണ്ടാവില്ല'."]
        solution: "നികുതിയും ജപ്തിയും ഇല്ലാതാകുമെന്നായിരുന്നു പ്രതീക്ഷ."
        mistakes: {"ജാതിമതവിവേചനമില്ലാത്ത സ്കൂളുകൾ": mal_ayishu_hopes}
      - prompt: "'ദേശീയപതാക ആദ്യമായി കൊടിമരത്തിലേക്ക് ചിറകു കുടഞ്ഞു കയറി' — ഇതിൽ പതാകയെ എന്തിനോടാണ് ഉപമിക്കുന്നത്?"
        options: ["പറന്നുയരുന്ന ഒരു പക്ഷി", "ഒഴുകുന്ന പുഴ", "പീലി വിരിച്ച മയിൽ", "ഉദിക്കുന്ന സൂര്യൻ"]
        answer: "പറന്നുയരുന്ന ഒരു പക്ഷി"
        difficulty: 2
        hints: ["ചിറകു കുടയുന്നത് ആരാണ്?"]
        solution: "ചിറകു കുടഞ്ഞു കയറുന്ന പക്ഷിയായി പതാകയെ സങ്കല്പിക്കുന്നു."
        mistakes: {"പീലി വിരിച്ച മയിൽ": mal_imagery}
      - prompt: "'അർധരാത്രിയുടെ മണിമുഴങ്ങുമ്പോൾ ... ഇന്ത്യ ജീവിതത്തിലേക്കും സ്വാതന്ത്ര്യത്തിലേക്കും ഉണർന്നെണീക്കും' — ഈ പ്രസംഗം ആരുടേതാണ്?"
        options: ["ജവഹർലാൽ നെഹ്റു", "മഹാത്മാഗാന്ധി", "വള്ളത്തോൾ നാരായണമേനോൻ", "ശ്രീനാരായണഗുരു"]
        answer: "ജവഹർലാൽ നെഹ്റു"
        difficulty: 3
        hints: ["1947 ആഗസ്റ്റ് 14 അർധരാത്രി."]
        solution: "നെഹ്റുവിന്റെ പ്രസംഗത്തിൽനിന്ന്."
        mistakes: {"വള്ളത്തോൾ നാരായണമേനോൻ": mal_author_work}

  - code: mal9.u4.aruvippuram
    title: അരുവിപ്പുറത്തുനിന്ന് ഒരു സന്ദേശം
    after: [mal9.u4.swathanthryam]
    notes: |
      പി. കെ. ഗോപാലകൃഷ്ണന്റെ 'ശ്രീനാരായണഗുരു: വിശ്വമാനവികതയുടെ പ്രവാചകൻ' എന്ന കൃതിയിലെ ഭാഗം.
      "ജാതിഭേദം മതദ്വേഷം / ഏതുമില്ലാതെ സർവരും / സോദരത്വേന വാഴുന്ന / മാതൃകാസ്ഥാനമാണിത്" എന്ന
      സന്ദേശം 1888-ൽ ഗുരു ഭാരതത്തിന്റെ തെക്കേ അറ്റത്തുനിന്ന് നൽകി. സി. വി. കുഞ്ഞുരാമനുമായുള്ള
      സംഭാഷണം: ഹിംസ കലശലായ കാലത്ത് ബുദ്ധൻ അഹിംസയ്ക്കും നബി അറേബ്യയിൽ സാഹോദര്യത്തിനും മുഖ്യത
      നൽകി; ഇന്ന് ഇന്ത്യയുടെ ആവശ്യം ജാതികളും മതങ്ങളും തമ്മിലുള്ള മത്സരത്തിൽനിന്ന് മോചനം. അടുത്ത
      വർഷം അരുവിപ്പുറത്തെ ശിവരാത്രി (നടരാജഗുരുവിന്റെ വിവരണം): ആനയെഴുന്നള്ളിപ്പിന്റെയും
      വെടിക്കെട്ടിന്റെയും അർഥശൂന്യതയെപ്പറ്റി ഗുരു പറഞ്ഞു; പ്രസംഗിച്ചില്ല, എങ്കിലും ജനം അതു
      നടപ്പാക്കി. അർധരാത്രിയിലെ യോഗത്തിൽ മാറിയിരുന്ന പാവപ്പെട്ട കർഷകത്തൊഴിലാളികളെ കണ്ട്,
      "ഇവരെ വേർതിരിച്ചിരുത്തണമോ?" എന്നു ചോദിച്ചു; രണ്ടു കുട്ടികളെ വിളിച്ച് ഇരുവശത്തുമിരുത്തി:
      "മറ്റുള്ളവരെപ്പോലെ ഇവരും ദൈവത്തിന്റെ മക്കളാണ്". ഗുരുവിന്റെ കണ്ണുകളിൽനിന്ന് കണ്ണീരൊഴുകി.
      ഒടുവിൽ മഠത്തിന്റെ ചുമരിൽ കുറിച്ച വരികൾ ഒരാളെക്കൊണ്ട് ഉറക്കെ വായിപ്പിച്ചു. ബന്ധപ്പെട്ടവ:
      പണ്ഡിറ്റ് കെ. പി. കറുപ്പന്റെ 'ജാതിക്കുമ്മി'; ഗുരുവിന്റെ 'ആത്മോപദേശശതകം'.
    explanations:
      text: "ജാതിയുടെയും മതത്തിന്റെയും പേരിലുള്ള വേർതിരിവുകൾ ഇല്ലാതെ എല്ലാവരും സഹോദരങ്ങളായി ജീവിക്കണം എന്നതാണ് ഗുരുവിന്റെ സന്ദേശം. വാക്കുകളെക്കാൾ പ്രവൃത്തിയിലൂടെയാണ് — മാറ്റിയിരുത്തിയ കുട്ടികളെ അടുത്തിരുത്തിക്കൊണ്ട് — ഗുരു അതു പഠിപ്പിച്ചത്."
      visual: "ഒരു യോഗസ്ഥലം വരയ്ക്കുക: നടുവിൽ ഗുരു, ഇരുവശത്തും രണ്ടു കുട്ടികൾ; മാറിയിരുന്ന തൊഴിലാളികൾ ജനക്കൂട്ടത്തിലേക്ക് ചേരുന്ന അമ്പടയാളം; ചുമരിൽ 'ജാതിഭേദം മതദ്വേഷം...' എന്ന വരികൾ."
      step_by_step: "ഗുരുവിന്റെ വിശകലനം: 1. ഓരോ കാലത്തെ ആവശ്യത്തിനനുസരിച്ച് ഒരു ധർമ്മത്തിന് മുഖ്യത നൽകണം. 2. ബുദ്ധന്റെ കാലം → അഹിംസ; നബിയുടെ കാലം → സാഹോദര്യം. 3. ഇന്നത്തെ ഇന്ത്യ → ജാതിമതമത്സരത്തിൽനിന്ന് മോചനം."
      real_world: "സ്കൂളിൽ എല്ലാവരും ഒരേ ബെഞ്ചിലിരുന്ന് ഒരേ ഭക്ഷണം കഴിക്കുന്നത് ഗുരു സ്വപ്നം കണ്ട 'മാതൃകാസ്ഥാന'ത്തിന്റെ ഒരു ചെറിയ രൂപമാണ്."
    items:
      - prompt: "'ജാതിഭേദം മതദ്വേഷം ഏതുമില്ലാതെ സർവരും സോദരത്വേന വാഴുന്ന മാതൃകാസ്ഥാനമാണിത്' — ഇത് ആരുടെ വാക്കുകൾ?"
        options: ["ശ്രീനാരായണഗുരു", "പണ്ഡിറ്റ് കെ. പി. കറുപ്പൻ", "പൊയ്കയിൽ അപ്പച്ചൻ", "നടരാജഗുരു"]
        answer: "ശ്രീനാരായണഗുരു"
        difficulty: 1
        hints: ["അരുവിപ്പുറം."]
        solution: "ശ്രീനാരായണഗുരു അരുവിപ്പുറത്തുനിന്ന് നൽകിയ സന്ദേശം."
        mistakes: {"നടരാജഗുരു": mal_guru_message}
      - prompt: "ഏതു വർഷമാണ് ഗുരു ഈ സന്ദേശം നൽകിയത്?"
        answer: "1888"
        check: "1888"
        difficulty: 1
        hints: ["'ആ ഉപദേശമാണ് ...-ൽ തന്നെ ശ്രീനാരായണഗുരു ... നൽകിയത്'."]
        solution: "1888-ൽ."
        mistakes: {"1947": mal_guru_message}
      - prompt: "ഗുരുവിന്റെ അഭിപ്രായത്തിൽ ബുദ്ധൻ ഏതു ധർമ്മത്തിനാണ് മുഖ്യത നൽകിയത്?"
        options: ["അഹിംസ", "സാഹോദര്യം", "സമ്പത്ത്", "യുദ്ധം"]
        answer: "അഹിംസ"
        difficulty: 2
        hints: ["ബുദ്ധന്റെ കാലത്ത് ഹിംസ കലശലായിരുന്നു."]
        solution: "ഹിംസ കലശലായതിനാൽ ബുദ്ധൻ അഹിംസയ്ക്ക് മുഖ്യത നൽകി."
        mistakes: {"സാഹോദര്യം": mal_read_again}
      - prompt: "ഗുരുവിന്റെ കാഴ്ചപ്പാടിൽ അന്നത്തെ ഇന്ത്യയുടെ ആവശ്യം എന്തായിരുന്നു?"
        options: ["ജാതികളും മതങ്ങളും തമ്മിലുള്ള മത്സരത്തിൽനിന്ന് മോചനം", "കൂടുതൽ ഉത്സവങ്ങൾ", "വലിയ ക്ഷേത്രങ്ങൾ", "വെടിക്കെട്ടും ആനയെഴുന്നള്ളിപ്പും"]
        answer: "ജാതികളും മതങ്ങളും തമ്മിലുള്ള മത്സരത്തിൽനിന്ന് മോചനം"
        difficulty: 2
        hints: ["സി. വി. കുഞ്ഞുരാമനുമായുള്ള സംഭാഷണം."]
        solution: "ജാതിമതമത്സരത്തിൽനിന്നുള്ള മോചനം."
        mistakes: {"വെടിക്കെട്ടും ആനയെഴുന്നള്ളിപ്പും": mal_guru_message}
      - prompt: "ശിവരാത്രിയോഗത്തിൽ മാറിയിരുന്ന തൊഴിലാളികളോട് ഗുരു ചെയ്തതെന്ത്?"
        options: ["അവരിൽനിന്ന് രണ്ടു കുട്ടികളെ വിളിച്ച് തന്റെ ഇരുവശത്തുമിരുത്തി", "അവരെ തിരിച്ചയച്ചു", "അവർക്കായി വേറെ യോഗം നടത്തി", "ഒന്നും ചെയ്തില്ല"]
        answer: "അവരിൽനിന്ന് രണ്ടു കുട്ടികളെ വിളിച്ച് തന്റെ ഇരുവശത്തുമിരുത്തി"
        difficulty: 2
        hints: ["'മറ്റുള്ളവരെപ്പോലെ ഇവരും ദൈവത്തിന്റെ മക്കളാണ്'."]
        solution: "രണ്ടു കുട്ടികളെ ഇരുവശത്തുമിരുത്തി എല്ലാവരും സമന്മാരാണെന്ന് കാണിച്ചു."
      - prompt: "ആനയെഴുന്നള്ളിപ്പിനെയും വെടിക്കെട്ടിനെയും കുറിച്ച് ഗുരു എന്തു പറഞ്ഞു?"
        options: ["അവയുടെ അർഥശൂന്യതയെപ്പറ്റി പറഞ്ഞു", "കൂടുതൽ ആനകൾ വേണമെന്നു പറഞ്ഞു", "അവയെ പുകഴ്ത്തി", "ഒന്നും പറഞ്ഞില്ല"]
        answer: "അവയുടെ അർഥശൂന്യതയെപ്പറ്റി പറഞ്ഞു"
        difficulty: 2
        hints: ["നടരാജഗുരുവിന്റെ വിവരണം."]
        solution: "അവ അർഥശൂന്യമാണെന്ന് ഗുരു ആളുകളോട് പറഞ്ഞു."
        mistakes: {"അവയെ പുകഴ്ത്തി": mal_read_again}
      - prompt: "'ഗുരു പ്രസംഗം ചെയ്തില്ല. പക്ഷേ ... ഗുരുവിന്റെ നിർദേശം ജനങ്ങൾ നടപ്പിലാക്കി.' — ഇതിൽനിന്ന് മനസ്സിലാകുന്നത്:"
        options: ["ഗുരുവിന്റെ വാക്കുകൾക്ക് ജനങ്ങൾക്കിടയിലുണ്ടായിരുന്ന വലിയ സ്വാധീനം", "ഗുരുവിന് സംസാരിക്കാൻ ഇഷ്ടമില്ലായിരുന്നു", "ജനങ്ങൾ ഗുരുവിനെ ഭയന്നിരുന്നു", "യോഗം നടന്നില്ല"]
        answer: "ഗുരുവിന്റെ വാക്കുകൾക്ക് ജനങ്ങൾക്കിടയിലുണ്ടായിരുന്ന വലിയ സ്വാധീനം"
        difficulty: 3
        hints: ["'സ്വന്തം അന്തരാത്മാവിന്റെ ശബ്ദത്തോടു പ്രതികരിക്കുന്നതുപോലെ'."]
        solution: "വിധി പ്രസ്താവിക്കാതെതന്നെ ജനം അനുസരിച്ചത് ഗുരുവിന്റെ ധാർമ്മികസ്വാധീനം കാണിക്കുന്നു."

  - code: mal9.u4.aksharangal
    title: കാണുന്നുണ്ടനേകമക്ഷരങ്ങൾ
    after: [mal9.u4.aruvippuram]
    notes: |
      എം. ആർ. രേണുകുമാറിന്റെ 'കൊതിയൻ' എന്ന സമാഹാരത്തിലെ കവിത. തലങ്ങും വിലങ്ങും ഈർക്കിലിവരകൾ
      നിറഞ്ഞ വെടിപ്പായ മുറ്റം; അതിരുകാത്ത് മണമൂറി പൊട്ടിച്ചിരിച്ചുനിൽക്കുന്ന ഇലഞ്ഞിമരം; കുളിച്ച്
      വൃത്തിയായി ഇറയത്ത് വഴിക്കണ്ണുമായിരിക്കുന്ന കറുത്ത കുഞ്ഞുങ്ങൾ; മെഴുക്കു വെടിഞ്ഞ് വെയിലത്ത്
      ഉണങ്ങി മിനുങ്ങുന്ന കഞ്ഞിക്കലവും കറിച്ചട്ടികളും; ചാഞ്ഞുകിടക്കുന്ന ചിരട്ടത്തവികൾ. വേലയ്ക്കിറങ്ങിയ
      രക്ഷിതാവ് മടിശ്ശീലയിൽ കൂലിനെല്ലുമായി തിരിച്ചെത്തുമ്പോൾ കാണുന്നത് രാവിലെ വിട്ടുപോന്ന
      വീടും കുഞ്ഞുങ്ങളുമല്ല. "ആരാണിങ്ങനെ ... വീടിനെ അടുക്കിപ്പെറുക്കി വെടിപ്പുള്ളതാക്കിയത്!",
      "മൂക്കട്ടയൊലിപ്പിച്ചു നിന്ന കുഞ്ഞുങ്ങളെ പുഞ്ചിരിതൂകുന്ന പൂവുകളാക്കിയത്!" — "കാണുന്നുണ്ട്
      അവരുടെ കണ്ണുകളിൽ; അനേകമക്ഷരങ്ങൾ." അക്ഷരം (വിദ്യാഭ്യാസം) നേടിയ ഒരു തലമുറയുടെ മാറ്റം,
      കേരളീയ നവോത്ഥാനത്തിന്റെ ഫലം. ബന്ധപ്പെട്ടവ: പൊയ്കയിൽ അപ്പച്ചന്റെ "കാണുന്നീലൊരക്ഷരവും
      എന്റെ വംശത്തെപ്പറ്റി".
    explanations:
      text: "പണിക്കുപോയി തിരിച്ചുവരുന്ന ഒരാൾ കാണുന്നത് പുതിയൊരു വീടും പുതിയ കുഞ്ഞുങ്ങളുമാണ്. വൃത്തിയും ചിട്ടയും അറിവും ആ വീട്ടിൽ വന്നുകഴിഞ്ഞു. കുഞ്ഞുങ്ങളുടെ കണ്ണുകളിലെ 'അനേകമക്ഷരങ്ങൾ' വിദ്യാഭ്യാസം കൊണ്ടുവന്ന മാറ്റത്തിന്റെ അടയാളമാണ്."
      visual: "രണ്ടു ചിത്രങ്ങൾ: രാവിലെ — അലങ്കോലമായ വീട്, മണ്ണിൽ പുരണ്ട കുഞ്ഞുങ്ങൾ; വൈകുന്നേരം — ഈർക്കിൽവരകളുള്ള മുറ്റം, വെയിലത്ത് മിനുങ്ങുന്ന കലങ്ങൾ, കണ്ണുകളിൽ അക്ഷരങ്ങൾ തിളങ്ങുന്ന കുഞ്ഞുങ്ങൾ."
      step_by_step: "'കണ്ണുകളിൽ അനേകമക്ഷരങ്ങൾ' വിശദീകരിക്കാം: 1. അക്ഷരം = എഴുത്തും വായനയും. 2. കണ്ണിൽ അക്ഷരം = പഠിച്ചതിന്റെ തിളക്കം. 3. അക്ഷരം നിഷേധിക്കപ്പെട്ട ഒരു സമൂഹം അറിവിലേക്ക് വളർന്നു."
      real_world: "കേരളത്തിന്റെ ഉയർന്ന സാക്ഷരത നവോത്ഥാനപ്രസ്ഥാനങ്ങളുടെയും പൊതുവിദ്യാലയങ്ങളുടെയും ഫലമാണ്. നിങ്ങളുടെ മുത്തശ്ശീമുത്തച്ഛന്മാരുടെ കാലത്തെ സ്കൂൾ അനുഭവം ചോദിച്ചറിയാം."
    items:
      - prompt: "'കാണുന്നുണ്ടനേകമക്ഷരങ്ങൾ' എന്ന കവിത എഴുതിയതാര്?"
        options: ["എം. ആർ. രേണുകുമാർ", "പൊയ്കയിൽ അപ്പച്ചൻ", "വള്ളത്തോൾ നാരായണമേനോൻ", "വിജയരാജമല്ലിക"]
        answer: "എം. ആർ. രേണുകുമാർ"
        difficulty: 1
        hints: ["'കൊതിയൻ' എന്ന സമാഹാരം."]
        solution: "എം. ആർ. രേണുകുമാർ."
        mistakes: {"പൊയ്കയിൽ അപ്പച്ചൻ": mal_author_work}
      - prompt: "കവിതയിൽ മുറ്റത്തിന്റെ അതിരുകാത്ത് നിൽക്കുന്ന മരം ഏത്?"
        options: ["ഇലഞ്ഞിമരം", "മാവ്", "പുളിമരം", "തെങ്ങ്"]
        answer: "ഇലഞ്ഞിമരം"
        difficulty: 1
        hints: ["മണമൂറി പൊട്ടിച്ചിരിച്ചു നിൽക്കുന്നു."]
        solution: "ഇലഞ്ഞിമരം."
      - prompt: "വേല കഴിഞ്ഞ് തിരിച്ചെത്തുന്നയാളുടെ മടിശ്ശീലയിൽ എന്താണ്?"
        options: ["കൂലിനെല്ല്", "പണം", "പുസ്തകങ്ങൾ", "പലഹാരം"]
        answer: "കൂലിനെല്ല്"
        difficulty: 2
        hints: ["പണ്ട് കൂലിയായി കിട്ടിയിരുന്നത്."]
        solution: "കൂലിയായി കിട്ടിയ നെല്ല്."
        mistakes: {"പണം": mal_read_again}
      - prompt: "'വെയിലത്ത് ഇരുന്നുണങ്ങി മിനുങ്ങുന്ന കഞ്ഞിക്കലവും കറിച്ചട്ടികളും' — ഇത് ഏതുതരം പ്രയോഗമാണ്?"
        options: ["വാങ്മയചിത്രം", "ചോദ്യം", "പഴഞ്ചൊല്ല്", "സംഭാഷണം"]
        answer: "വാങ്മയചിത്രം"
        difficulty: 2
        hints: ["വാക്കുകൊണ്ട് വരച്ച ചിത്രം."]
        solution: "വാക്കുകളിലൂടെ ഒരു ദൃശ്യം കണ്ണിനു മുന്നിൽ കൊണ്ടുവരുന്നു: വാങ്മയചിത്രം."
        mistakes: {"പഴഞ്ചൊല്ല്": mal_imagery}
      - prompt: "'കാണുന്നുണ്ട് അവരുടെ കണ്ണുകളിൽ; അനേകമക്ഷരങ്ങൾ' — ഇവിടെ 'അക്ഷരങ്ങൾ' എന്തിന്റെ പ്രതീകം?"
        options: ["വിദ്യാഭ്യാസവും അറിവും", "കണ്ണിന്റെ അസുഖം", "കണ്ണീര്", "ഭയം"]
        answer: "വിദ്യാഭ്യാസവും അറിവും"
        difficulty: 2
        hints: ["അക്ഷരം പഠിച്ച കുഞ്ഞുങ്ങൾ."]
        solution: "അക്ഷരങ്ങൾ വിദ്യാഭ്യാസത്തിന്റെ പ്രതീകമാണ്."
        mistakes: {"കണ്ണീര്": mal_letters_symbol}
      - prompt: "കവിത പ്രധാനമായും എന്തിനെക്കുറിച്ചാണ്?"
        options: ["വിദ്യാഭ്യാസവും നവോത്ഥാനവും ഒരു സമൂഹത്തിൽ കൊണ്ടുവന്ന മാറ്റം", "ഒരു ഇലഞ്ഞിമരത്തിന്റെ ഭംഗി", "കൃഷിയിലെ നഷ്ടം", "ഒരു യാത്ര"]
        answer: "വിദ്യാഭ്യാസവും നവോത്ഥാനവും ഒരു സമൂഹത്തിൽ കൊണ്ടുവന്ന മാറ്റം"
        difficulty: 3
        hints: ["'കാണുന്നുണ്ടിങ്ങനെ ഓരോരോ മാറ്റങ്ങൾ'."]
        solution: "അക്ഷരം നേടിയ തലമുറയുടെ മാറ്റമാണ് കവിതയുടെ പ്രമേയം."
        mistakes: {"ഒരു ഇലഞ്ഞിമരത്തിന്റെ ഭംഗി": mal_letters_symbol}

  - code: mal9.u4.words
    title: "പദപരിചയം: ഉജ്ജ്വലഹൃദയസ്പന്ദങ്ങൾ"
    after: [mal9.u4.swathanthryam]
    notes: |
      പാഠങ്ങളിലെ പദങ്ങൾ: അങ്കണം (മുറ്റം), ഇറയം (പൂമുഖത്തെ ഉയർന്ന തളം), ഉമ്മറം (വീടിന്റെ മുൻഭാഗം),
      ജപ്തി (കണ്ടുകെട്ടൽ), തസ്തിക (ഔദ്യോഗിക സ്ഥാനം), ത്രസിപ്പ് (തുടിപ്പ്), ഭാസുരം (ശോഭയുള്ള), ഭൂതി
      (ഐശ്വര്യം), മടിശ്ശീല (പണസഞ്ചി), മെഴുക്ക് (എണ്ണമയം), വർണ്ണശബളം (നിറപ്പകിട്ടാർന്നത്), വാസരം
      (പകൽ), വിവേചനം (വേർതിരിവ്), വെടിപ്പായ (വൃത്തിയുള്ള), വ്യതിയാനം (മാറ്റം), കൈവഴി (നദിയുടെ
      ശാഖ), ഹുണ്ടികപ്പിരിവ് (കച്ചവടക്കാർക്കിടയിലെ പണം കൊടുക്കൽ-വാങ്ങൽ സമ്പ്രദായം).
    explanations:
      text: "പഴയകാലജീവിതം വിവരിക്കുന്ന പാഠങ്ങളിൽ ഇന്നു കുറച്ചുമാത്രം കേൾക്കുന്ന വാക്കുകളുണ്ട്. അവയുടെ അർഥം അറിഞ്ഞാലേ സന്ദർഭം പൂർണ്ണമായി മനസ്സിലാകൂ."
      visual: "ഒരു പഴയ വീടിന്റെ ചിത്രം വരച്ച് ഭാഗങ്ങൾക്ക് പേരിടുക: അങ്കണം/മുറ്റം, ഉമ്മറം, ഇറയം."
      step_by_step: "'വെടിപ്പായ മുറ്റം' — 1. വെടിപ്പ് = വൃത്തി. 2. വെടിപ്പായ = വൃത്തിയുള്ള. 3. അർഥം: വൃത്തിയുള്ള മുറ്റം."
      real_world: "മുത്തശ്ശിമാരോട് 'ഇറയം', 'മടിശ്ശീല' തുടങ്ങിയ വാക്കുകൾ ചോദിച്ചുനോക്കൂ — അവർ അവ നിത്യം ഉപയോഗിച്ചിരുന്നവയാണ്."
    items:
      - prompt: "'അങ്കണം' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["മുറ്റം", "ആകാശം", "അടുക്കള", "കിണർ"]
        answer: "മുറ്റം"
        difficulty: 1
        hints: ["'സ്കൂളങ്കണത്തിലെ കൊടിമരം'."]
        solution: "അങ്കണം = മുറ്റം."
        mistakes: {"ആകാശം": mal_word_meaning}
      - prompt: "'ജപ്തി' എന്നാൽ:"
        options: ["കണ്ടുകെട്ടൽ", "ഉത്സവം", "നികുതിയിളവ്", "കൃഷി"]
        answer: "കണ്ടുകെട്ടൽ"
        difficulty: 1
        hints: ["നികുതി മുടങ്ങിയാൽ വരുന്നത്."]
        solution: "ജപ്തി = കണ്ടുകെട്ടൽ."
        mistakes: {"നികുതിയിളവ്": mal_word_meaning}
      - prompt: "'വിവേചനം' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["വേർതിരിവ്", "വിവാഹം", "വിശ്വാസം", "വിജയം"]
        answer: "വേർതിരിവ്"
        difficulty: 2
        hints: ["'ജാതിമതവിവേചനങ്ങളില്ലാതെ'."]
        solution: "വിവേചനം = വേർതിരിവ്."
        mistakes: {"വിശ്വാസം": mal_word_meaning}
      - prompt: "'മടിശ്ശീല' എന്നാൽ:"
        options: ["പണസഞ്ചി", "മടിയുള്ള സ്വഭാവം", "തലയണ", "ഒരു തരം ശീല (തുണി) മാത്രം"]
        answer: "പണസഞ്ചി"
        difficulty: 2
        hints: ["'മടിശ്ശീലയിൽ കൂലിനെല്ലുമായ്'."]
        solution: "മടിശ്ശീല = പണസഞ്ചി, ഉടുവസ്ത്രത്തിന്റെ മുകളറ്റം."
        mistakes: {"മടിയുള്ള സ്വഭാവം": mal_word_meaning}
      - prompt: "'വ്യതിയാനം' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["മാറ്റം", "യാത്ര", "വേദന", "വിജയം"]
        answer: "മാറ്റം"
        difficulty: 2
        hints: ["'ആചാരത്തിൽനിന്നുള്ള വ്യതിയാനം'."]
        solution: "വ്യതിയാനം = മാറ്റം."
      - prompt: "'വർണ്ണശബളം' എന്നതിന്റെ അർഥം:"
        options: ["നിറപ്പകിട്ടാർന്നത്", "ശബ്ദമുള്ളത്", "ഇരുണ്ടത്", "വെളുത്തത്"]
        answer: "നിറപ്പകിട്ടാർന്നത്"
        difficulty: 3
        hints: ["'അവരുടെ ഭാവി എത്ര വർണ്ണശബളം!'"]
        solution: "വർണ്ണശബളം = പല നിറങ്ങളുള്ള, നിറപ്പകിട്ടാർന്ന."
        mistakes: {"ശബ്ദമുള്ളത്": mal_word_meaning}
