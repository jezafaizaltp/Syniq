      - teach: 'സി. വി. കുഞ്ഞുരാമനോട് ഗുരു പറഞ്ഞു: ഹിംസ കലശലായ കാലത്ത് ബുദ്ധൻ അഹിംസയ്ക്കും, അറേബ്യയിൽ നബി സാഹോദര്യത്തിനും മുഖ്യത നൽകി. ഇന്ന് ഇന്ത്യയ്ക്ക് വേണ്ടത് ജാതികളും മതങ്ങളും തമ്മിലുള്ള മത്സരത്തിൽനിന്ന് മോചനം. ഓരോ കാലത്തിനും അതിന്റെ പ്രശ്നത്തിനുള്ള സന്ദേശം.'
