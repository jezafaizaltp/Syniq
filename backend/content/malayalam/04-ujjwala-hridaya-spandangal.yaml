  - code: mal9.u4.words
    title: "പദപരിചയം: ഉജ്ജ്വലഹൃദയസ്പന്ദങ്ങൾ"
    after: [mal9.u4.swathanthryam]
    notes: |
      പാഠങ്ങളിലെ പദങ്ങൾ: അങ്കണം (മുറ്റം), ഇറയം (പൂമുഖത്തെ ഉയർന്ന തളം), ഉമ്മറം (വീടിന്റെ മുൻഭാഗം),
      ജപ്തി (കണ്ടുകെട്ടൽ), തസ്തിക (ഔദ്യോഗിക സ്ഥാനം), ത്രസിപ്പ് (തുടിപ്പ്), ഭാസുരം (ശോഭയുള്ള), ഭൂതി
      (ഐശ്വര്യം), മടിശ്ശീല (പണസഞ്ചി), മെഴുക്ക് (എണ്ണമയം), വർണ്ണശബളം (നിറപ്പകിട്ടാർന്നത്), വാസരം
      (പകൽ), വിവേചനം (വേർതിരിവ്), വെടിപ്പായ (വൃത്തിയുള്ള), വ്യതിയാനം (മാറ്റം), കൈവഴി (നദിയുടെ
      ശാഖ), ഹുണ്ടികപ്പിരിവ് (കച്ചവടക്കാർക്കിടയിലെ പണം കൊടുക്കൽ-വാങ്ങൽ സമ്പ്രദായം).
    explanations:
      text: "പഴയകാലജീവിതം വിവരിക്കുന്ന പാഠങ്ങളിൽ ഇന്നു കുറച്ചുമാത്രം കേൾക്കുന്ന വാക്കുകളുണ്ട്. അവയുടെ അർഥം അറിഞ്ഞാലേ സന്ദർഭം പൂർണ്ണമായി മനസ്സിലാകൂ."
      visual: "ഒരു പഴയ വീടിന്റെ ചിത്രം വരച്ച് ഭാഗങ്ങൾക്ക് പേരിടുക: അങ്കണം/മുറ്റം, ഉമ്മറം, ഇറയം."
      step_by_step: "'വെടിപ്പായ മുറ്റം' — 1. വെടിപ്പ് = വൃത്തി. 2. വെടിപ്പായ = വൃത്തിയുള്ള. 3. അർഥം: വൃത്തിയുള്ള മുറ്റം."
      real_world: "മുത്തശ്ശിമാരോട് 'ഇറയം', 'മടിശ്ശീല' തുടങ്ങിയ വാക്കുകൾ ചോദിച്ചുനോക്കൂ — അവർ അവ നിത്യം ഉപയോഗിച്ചിരുന്നവയാണ്."
    activity:
      type: sort
      prompt: പാഠങ്ങളിലെ ഈ വാക്കുകൾ അർഥമനുസരിച്ച് തരംതിരിക്കൂ.
      bins:
      - വീടിന്റെ ഭാഗം
      - പണവുമായി ബന്ധപ്പെട്ടത്
      - ശോഭ / ഐശ്വര്യം
      items:
      - label: അങ്കണം
        bin: വീടിന്റെ ഭാഗം
        clue: ഈർക്കിലിവരകൾ കാണുന്നത് എവിടെ?
        why: അങ്കണം = മുറ്റം.
      - label: ഇറയം
        bin: വീടിന്റെ ഭാഗം
        clue: കുഞ്ഞുങ്ങൾ വഴിക്കണ്ണുമായി ഇരുന്നത് എവിടെ?
        why: ഇറയം = പൂമുഖത്തെ ഉയർന്ന തളം.
      - label: ഉമ്മറം
        bin: വീടിന്റെ ഭാഗം
        clue: വീട്ടിൽ കയറുമ്പോൾ ആദ്യം എത്തുന്നത് എവിടെ?
        why: ഉമ്മറം = വീടിന്റെ മുൻഭാഗം.
      - label: ജപ്തി
        bin: പണവുമായി ബന്ധപ്പെട്ടത്
        clue: കടം വീട്ടാത്ത കർഷകന്റെ ഭൂമിക്ക് എന്തു സംഭവിക്കുന്നു?
        why: ജപ്തി = കണ്ടുകെട്ടൽ.
      - label: മടിശ്ശീല
        bin: പണവുമായി ബന്ധപ്പെട്ടത്
        clue: കൂലിനെല്ല് എന്തിലാണ് കൊണ്ടുവന്നത്?
        why: മടിശ്ശീല = പണസഞ്ചി.
      - label: ഹുണ്ടികപ്പിരിവ്
        bin: പണവുമായി ബന്ധപ്പെട്ടത്
        clue: കച്ചവടക്കാർക്കിടയിലെ ഒരു സമ്പ്രദായം.
        why: പണം കൊടുക്കൽ-വാങ്ങൽ സമ്പ്രദായം.
      - label: ഭാസുരം
        bin: ശോഭ / ഐശ്വര്യം
        clue: ഇത് വീടിന്റെ ഭാഗമോ പണമോ അല്ല. എന്തു ഗുണമാണ്?
        why: ഭാസുരം = ശോഭയുള്ള.
      - label: വർണ്ണശബളം
        bin: ശോഭ / ഐശ്വര്യം
        clue: '''വർണ്ണം'' എന്നാൽ നിറം.'
        why: വർണ്ണശബളം = നിറപ്പകിട്ടാർന്നത്.
      - label: ഭൂതി
        bin: ശോഭ / ഐശ്വര്യം
        clue: ഇത് ഐശ്വര്യവുമായി ബന്ധപ്പെട്ട വാക്കാണോ?
        why: ഭൂതി = ഐശ്വര്യം.
    lesson:
