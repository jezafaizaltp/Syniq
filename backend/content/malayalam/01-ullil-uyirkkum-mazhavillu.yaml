  - code: mal9.u1.amma
    title: അമ്മ
    after: [mal9.u1.sukruthaharangal]
    notes: |
      മാധവിക്കുട്ടിയുടെ 'തണുപ്പ്' എന്ന സമാഹാരത്തിലെ കഥ. ഇരുപതു പൈസയ്ക്കു പച്ചക്കറി വാങ്ങി മടങ്ങുന്ന
      വൃദ്ധയെ ഒരു കറുത്ത മെർസിഡീസ് കാർ ഇടിച്ചിട്ട് ഓടിപ്പോയി; വലത്തേ കാലു ചതഞ്ഞു. സൈക്കിൾ
      നിർത്തിയ പാൽക്കാരൻ "എന്തുപറ്റി അമ്മേ?" എന്നു ചോദിച്ചു — കൊല്ലങ്ങളായി ആരും അവരെ അങ്ങനെ
      വിളിച്ചിരുന്നില്ല; മക്കൾ ഉപേക്ഷിച്ച് പുറംരാജ്യങ്ങളിലേക്കു പോയിരുന്നു. പോലീസുകാരൻ പാൽക്കാരനെ
      സംശയിച്ചു; പാൽക്കാരന്റെ പേര് ബോലോറാം, അച്ഛൻ മോത്തീറാം, സ്വദേശം ഗയയ്ക്കടുത്ത ഇമാംഗഞ്ച്.
      "എന്റെ അമ്മയല്ല ... ഇവരെ ഞാനിന്ന് ആദ്യം കാണുകയാണ്." ടാക്സി ഡ്രൈവർ പണം വാങ്ങാതെ
      ഡോക്ടറുടെ അടുത്തെത്തിച്ചു. ഡോക്ടർ: "അമ്മയ്ക്കു വേദനിക്കുന്നുണ്ടോ?" — പണ്ട് തലവേദനിച്ചു
      കിടന്നപ്പോൾ പത്തുവയസ്സായ മകൻ ചോദിച്ച അതേ ചോദ്യം. വീട് പഹാഡ്ഗഞ്ചിൽ. "അവരെ പേടിപ്പിക്കുന്നത്
      എന്തിനാണ്?" — മക്കളെ കുറ്റപ്പെടുത്താതിരിക്കാനുള്ള കരുതൽ. വീട്ടിൽ പച്ചക്കറിയും വെള്ളവുമില്ല;
      വെറുംനിലത്ത് കിടന്ന അവർക്ക് പെട്ടെന്ന് "കാരണം കിട്ടാത്ത ഒരാനന്ദം" തോന്നി.
    explanations:
      text: "മക്കൾ ഉപേക്ഷിച്ച ഒരു അമ്മയെ അപരിചിതർ സ്നേഹത്തോടെ 'അമ്മേ' എന്നു വിളിക്കുന്നു, സഹായിക്കുന്നു. സ്വന്തക്കാർ മറക്കുമ്പോഴും മനുഷ്യത്വം വഴിയിൽ കാത്തുനിൽക്കുന്നുണ്ട്. ഒരു ചോദ്യം പഴയ സ്നേഹത്തിന്റെ ഓർമ്മ ഉണർത്തുന്നു."
      visual: "ഒരു റോഡ്: ചിതറിയ വെണ്ടയ്ക്കകൾക്കിടയിൽ വീണ വൃദ്ധ, സൈക്കിൾ നിർത്തി ഓടിവരുന്ന പാൽക്കാരൻ, ദൂരേക്കു പായുന്ന കറുത്ത കാർ, പുസ്തകവുമായി പോലീസുകാരൻ."
      step_by_step: "അവസാനത്തെ 'കാരണം കിട്ടാത്ത ഒരാനന്ദം' എന്തുകൊണ്ട്? 1. വർഷങ്ങൾക്കുശേഷം ആരോ 'അമ്മേ' എന്നു വിളിച്ചു. 2. 'അമ്മയ്ക്കു വേദനിക്കുന്നുണ്ടോ?' എന്ന ചോദ്യം മകന്റെ ബാല്യം ഓർമ്മിപ്പിച്ചു. 3. ഒരിക്കൽ താൻ സ്നേഹിക്കപ്പെട്ടിരുന്നു എന്ന ഓർമ്മയാണ് ആ ആനന്ദം."
      real_world: "വഴിയിൽ അപകടത്തിൽപ്പെട്ടവരെ ആശുപത്രിയിലെത്തിക്കുന്നവരെ 'നല്ല ശമര്യക്കാരൻ' എന്നു വിളിക്കാറുണ്ട്; അത്തരം സഹായികളെ നിയമവും സംരക്ഷിക്കുന്നു."
    activity:
      type: sort
      prompt: കഥയിൽ ഓരോന്നും ചെയ്തതോ പറഞ്ഞതോ ആര്?
