        solution: "Step 1: വീട്ടിൽ മനുഷ്യരും എണ്ണമറ്റ ജീവികളും ഒന്നിച്ചു കഴിയുന്നു. Step 2: ഇവയെല്ലാം ബന്ധപ്പെടുന്ന ഒരു അഖണ്ഡലോകമാണ് ബഷീറിന്റേതെന്ന് പഠനം പറയുന്നു."
        mistakes: {"മൃഗങ്ങൾ മാത്രമുള്ള ലോകം": mal_goat_symbol, "ബഷീർ ഒറ്റയ്ക്കു കഴിയുന്ന ലോകം": mal_read_again, "നഗരത്തിലെ തിരക്കുള്ള ലോകം": mal_read_again}
      - prompt: 'ആടിന്റെ നിറം:'
        options:
        - തവിട്ട്
        - കറുപ്പ്
        - വെളുപ്പ്
        - ചാരം
        answer: തവിട്ട്
        difficulty: 1
        hints:
        - ആടിനെ വിവരിക്കുന്ന ഭാഗം വായിക്കൂ.
        - മണ്ണിന്റെ നിറത്തോട് അടുത്ത നിറം.
        solution: തവിട്ടുനിറമുള്ള ഒരു പെണ്ണാട്.
        mistakes:
          കറുപ്പ്: m1_basheer_house
      - prompt: ബഷീറിന്റെ വീടിന്റെ മേൽക്കൂര എന്തുകൊണ്ടുള്ളതായിരുന്നു?
        options:
        - ഓല
        - ഓട്
        - കോൺക്രീറ്റ്
        - തകിട്
        answer: ഓല
        difficulty: 2
        hints:
        - '''... മേഞ്ഞ ഒരു ചെറിയ കെട്ടിടം''.'
        - തെങ്ങിൽനിന്ന് കിട്ടുന്ന വസ്തു.
        solution: ഓലമേഞ്ഞ ചെറിയ വീട്.
        mistakes:
          ഓട്: m1_basheer_house
      - prompt: വീട്ടിൽ എത്ര മുറികൾ ഉണ്ടായിരുന്നു?
        answer: '2'
        check: '2'
        difficulty: 2
        hints:
        - 'വീടിന്റെ വിവരണം: ''... മുറികളും ഒരടുക്കളയും ...''.'
        - രണ്ടു വരാന്തകളും ഉണ്ടായിരുന്നു.
        solution: രണ്ടു മുറികളും ഒരടുക്കളയും രണ്ടു വരാന്തകളും.
        mistakes:
          '4': m1_basheer_house
      - prompt: '''നമുക്ക് ഈ മുറ്റം കെട്ടിക്കണം'' എന്നു പറയുന്നതാര്?'
        options:
        - അബു
        - പാത്തുമ്മ
        - ഉമ്മ
        - ബഷീർ
        answer: അബു
        difficulty: 2
        hints:
        - ബഷീറിന്റെ ഒരു സഹോദരൻ.
        - അയാളും പണം ചോദിക്കുന്നു.
        solution: സഹോദരൻ അബുവിന്റെ ആവശ്യം.
        mistakes:
          പാത്തുമ്മ: m1_basheer_house
      - prompt: 'എല്ലാവരും ബഷീറിനോട് പണം ചോദിക്കാൻ കാരണം:'
        options:
        - വലിയ ധനികനായാണ് വന്നതെന്ന് അവർ കരുതി
        - ബഷീർ ബാങ്കിൽ ജോലി ചെയ്തു
        - ബഷീർ ലോട്ടറി അടിച്ചു
        - ആടിനെ വിൽക്കാൻ
        answer: വലിയ ധനികനായാണ് വന്നതെന്ന് അവർ കരുതി
        difficulty: 2
        hints:
        - ഏറെക്കാലം ദൂരെയായിരുന്നയാൾ തിരിച്ചെത്തി.
        - വീട്ടുകാരുടെ വിചാരം എന്തായിരുന്നു?
        solution: ബഷീർ പണക്കാരനായി വന്നുവെന്നായിരുന്നു അവരുടെ വിചാരം.
        mistakes:
          ആടിനെ വിൽക്കാൻ: m1_basheer_house
      - prompt: '''ചെറിയ കാര്യങ്ങളിലൂടെ വലിയ ലോകത്തിന്റെ വിസ്മയം'' — പഠനം ഇതു പറയുന്നത് ഏതിനെക്കുറിച്ച്?'
        options:
        - ബഷീറിന്റെ 'തമാശക്കഥ'യുടെ ആഴം
        - ആടിന്റെ ഭക്ഷണം
        - വീടിന്റെ വലിപ്പം
        - പോലീസിന്റെ അന്വേഷണം
        answer: ബഷീറിന്റെ 'തമാശക്കഥ'യുടെ ആഴം
        difficulty: 3
        hints:
        - കഥ വെറും തമാശയാണോ?
        - വീട്ടിലെ ചെറിയ സംഭവങ്ങൾ എന്തു കാണിക്കുന്നു?
        solution: നിസ്സാരമെന്നു തോന്നുന്ന വീട്ടുകാര്യങ്ങളിലൂടെ ജീവിതത്തിന്റെ വലുപ്പം കാണിക്കുന്നു.
        mistakes:
          ആടിന്റെ ഭക്ഷണം: m1_study_not_story
      - prompt: 'ഈ പാഠവുമായി ബന്ധപ്പെടുത്തി വായിക്കാവുന്ന, ശാരദക്കുട്ടിയുടെ രചന:'
        options:
        - വീടാക്കടങ്ങൾ
        - ആഫ്രിക്ക
        - തണുപ്പ്
        - ചണ്ഡാലഭിക്ഷുകി
        answer: വീടാക്കടങ്ങൾ
        difficulty: 3
        hints:
        - '''ആഫ്രിക്ക'' എൻ. വി. കൃഷ്ണവാര്യരുടേതാണ്.'
        - പേരിൽ 'കടങ്ങൾ' ഉണ്ട്.
        solution: ഡോ. എസ്. ശാരദക്കുട്ടിയുടെ 'വീടാക്കടങ്ങൾ'.
        mistakes:
          ആഫ്രിക്ക: m1_study_not_story
  - code: mal9.u1.bhasha
    title: "ഭാഷ: പദജോഡികൾ, അനുപ്രയോഗം, പദപരിചയം"
    after: [mal9.u1.amma]
    notes: |
      പദജോഡികൾ: സൃഷ്ടി - സ്രഷ്ടാവ്, അനുഗ്രഹം - അനുഗൃഹീതൻ (ക്രിയ/ഭാവം - കർത്താവ്/ഗുണി). 'പോയി'
      രണ്ടു സന്ദർഭത്തിൽ: "അവർ പകച്ചു നിന്നുപോയി" — അനുപ്രയോഗം (പ്രധാനക്രിയയെ സഹായിക്കുന്നു, പൂർണ്ണത/
      വികാരം കാണിക്കുന്നു); "അവർ വീട്ടിലേക്കു തിരിച്ചുപോയി" — യഥാർഥ ഗമനം. പദപരിചയം: കിടാത്തി (മകൾ),
      ചാരു (മനോഹരം), കോമളാംഗി (സുന്ദരി), അല്ലൽ (ദുഃഖം), ആസ്യം (മുഖം), കരപുടം (കൈക്കുമ്പിൾ),
      അർഥിക്കുക (അപേക്ഷിക്കുക), ഓതി (പറഞ്ഞു), ഖണ്ഡിക (പരസ്പരബന്ധമുള്ള വാക്യങ്ങൾ ചേർന്ന ഗദ്യഭാഗം),
      ഊരുചുറ്റൽ (നാടുചുറ്റൽ), കൗതുകം (ജിജ്ഞാസ).
    explanations:
      text: "ഒരേ വാക്ക് രണ്ടു രീതിയിൽ പ്രവർത്തിക്കാം: 'തിരിച്ചുപോയി' എന്നതിൽ 'പോയി' യാത്രയാണ്; 'നിന്നുപോയി' എന്നതിൽ അത് ഒരു സഹായകക്രിയ മാത്രം — അനുപ്രയോഗം."
      visual: "രണ്ടു ചിത്രം: വഴിയിലൂടെ നടന്നു മറയുന്ന ഒരാൾ (തിരിച്ചുപോയി), അനങ്ങാതെ ഞെട്ടി നിൽക്കുന്ന ഒരാൾ (നിന്നുപോയി)."
      step_by_step: "'പകച്ചു നിന്നുപോയി' പരിശോധിക്കാം: 1. പ്രധാനക്രിയ: നിന്നു. 2. 'പോയി' ചേർത്താലും എങ്ങോട്ടും പോകുന്നില്ല. 3. അതിനാൽ 'പോയി' അനുപ്രയോഗം."
      real_world: "'ഞാൻ ഉറങ്ങിപ്പോയി', 'പേടിച്ചുപോയി' — ദിവസവും നാം അനുപ്രയോഗം ഉപയോഗിക്കുന്നു."
    activity:
      type: sort
      prompt: ഓരോ വാക്യത്തിലെയും 'പോയി' ശരിക്കുള്ള പോക്കാണോ, പ്രധാനക്രിയയെ സഹായിക്കുന്ന അനുപ്രയോഗമാണോ?
      bins:
      - അനുപ്രയോഗം
      - യഥാർഥ ഗമനം
      items:
      - label: അവർ പകച്ചു നിന്നുപോയി
        bin: അനുപ്രയോഗം
        clue: അവർ എവിടേക്കെങ്കിലും നടന്നോ?
        why: ആരും എങ്ങും പോയില്ല; 'പോയി' പകപ്പിന്റെ പൂർണ്ണത കാണിക്കുന്നു.
      - label: അവർ വീട്ടിലേക്കു തിരിച്ചുപോയി
        bin: യഥാർഥ ഗമനം
        clue: ഇവിടെ ഒരിടത്തുനിന്ന് മറ്റൊരിടത്തേക്കു നീങ്ങുന്നുണ്ടോ?
        why: വീട്ടിലേക്ക് യഥാർഥത്തിൽ പോകുന്നു.
      - label: ഞാൻ ഞെട്ടിപ്പോയി
        bin: അനുപ്രയോഗം
        clue: ഞെട്ടുമ്പോൾ ആരെങ്കിലും സ്ഥലം മാറുന്നുണ്ടോ?
        why: '''പോയി'' ഞെട്ടലിന്റെ ശക്തി കൂട്ടുന്നു; ഗമനമില്ല.'
      - label: പാൽ തിളച്ചുപോയി
        bin: അനുപ്രയോഗം
        clue: പാൽ എങ്ങോട്ടാണ് പോയത്?
        why: '''പോയി'' തിളയ്ക്കൽ കഴിഞ്ഞു എന്ന പൂർണ്ണത കാണിക്കുന്നു.'
      - label: അവൻ ചന്തയിലേക്കു പോയി
        bin: യഥാർഥ ഗമനം
        clue: '''ചന്തയിലേക്ക്'' എന്നത് ഒരു ലക്ഷ്യസ്ഥാനമാണോ?'
        why: ചന്തയിലേക്ക് യഥാർഥത്തിൽ പോകുന്നു.
      - label: കുട്ടികൾ ബസ്സിൽ സ്കൂളിൽ പോയി
        bin: യഥാർഥ ഗമനം
        clue: ബസ്സിൽ കയറി എന്തു ചെയ്തു?
        why: 'സ്കൂളിലേക്ക് യാത്ര ചെയ്തു: യഥാർഥ ഗമനം.'
    lesson:
      - teach: 'പദജോഡികൾ: ഒരു പദം പ്രവൃത്തിയോ ഭാവമോ; മറ്റേത് അതു ചെയ്യുന്നയാളോ അതു ലഭിച്ചയാളോ. സൃഷ്ടി - സ്രഷ്ടാവ് (സൃഷ്ടിക്കുന്നയാൾ). അനുഗ്രഹം - അനുഗൃഹീതൻ (അനുഗ്രഹം കിട്ടിയയാൾ).'
        picture:
          kind: compare
          columns:
          - title: പ്രവൃത്തി / ഭാവം
            points:
            - സൃഷ്ടി
            - അനുഗ്രഹം
          - title: ആൾ
            points:
            - സ്രഷ്ടാവ്
            - അനുഗൃഹീതൻ
          alt: 'പ്രവൃത്തിയും അതു ചെയ്യുന്നയാളും: പദജോഡികൾ.'
        check:
          prompt: '''സൃഷ്ടിക്കുന്നയാൾ'' എന്ന അർഥം തരുന്ന പദം:'
          options:
          - സ്രഷ്ടാവ്
          - സൃഷ്ടി
          - സൃഷ്ടികൾ
          answer: സ്രഷ്ടാവ്
          why: -താവ് എന്ന രൂപം ചെയ്യുന്നയാളെ കുറിക്കുന്നു.
        ways:
        - style: step_by_step
          teach: 'പദജോഡി രണ്ടു ചോദ്യങ്ങൾകൊണ്ട് തിരിച്ചറിയാം. ഒന്ന്: ഈ പദം ഒരു പ്രവൃത്തിയോ ഭാവമോ ആണോ? (സൃഷ്ടി, അനുഗ്രഹം). രണ്ട്: ഇതു ചെയ്യുന്നയാൾ, അല്ലെങ്കിൽ ഇതു ലഭിച്ചയാൾ ആര്? സൃഷ്ടിക്കുന്നയാൾ: സ്രഷ്ടാവ്. അനുഗ്രഹം കിട്ടിയയാൾ: അനുഗൃഹീതൻ.'
      - teach: '''പോയി'' രണ്ടുതരം: ''അവർ വീട്ടിലേക്കു തിരിച്ചുപോയി'' — ശരിക്കുമുള്ള യാത്ര. ''അവർ പകച്ചു നിന്നുപോയി'' — ആരും എങ്ങോട്ടും പോകുന്നില്ല; ''പോയി'' പ്രധാനക്രിയയെ സഹായിക്കുന്നു. ഇതാണ് അനുപ്രയോഗം.'
        picture:
          kind: compare
          columns:
          - title: യഥാർഥ ഗമനം
            points:
            - വീട്ടിലേക്കു പോയി
            - സ്ഥലം മാറുന്നു
          - title: അനുപ്രയോഗം
            points:
            - തളർന്നുപോയി
            - പ്രധാനക്രിയയെ സഹായിക്കുന്നു
          alt: '''പോയി'' എന്നതിന്റെ രണ്ട് ഉപയോഗങ്ങൾ.'
        check:
          prompt: '''അവൻ ഞെട്ടിപ്പോയി'' — ''പോയി'' ഇവിടെ:'
          options:
          - അനുപ്രയോഗം
          - യഥാർഥ യാത്ര
          - നാമം
          answer: അനുപ്രയോഗം
          why: അവൻ എങ്ങോട്ടും പോകുന്നില്ല.
        ways:
        - style: step_by_step
          teach: '''പോയി'' വരുമ്പോൾ ഒരു ചോദ്യം ചോദിക്കൂ: ആരെങ്കിലും ശരിക്കും എങ്ങോട്ടെങ്കിലും പോയോ? ''അവർ വീട്ടിലേക്കു തിരിച്ചുപോയി'' — പോയി, അതിനാൽ ഇത് സാധാരണ ക്രിയ. ''അവർ പകച്ചു നിന്നുപോയി'' — ആരും എങ്ങും പോയില്ല; ''പോയി'' പ്രധാനക്രിയയെ സഹായിക്കുക മാത്രം. ഇതാണ് അനുപ്രയോഗം.'
      - teach: 'പദപരിചയം: കിടാത്തി (മകൾ), ചാരു (മനോഹരം), കോമളാംഗി (സുന്ദരി), അല്ലൽ (ദുഃഖം), ആസ്യം (മുഖം), കരപുടം (കൈക്കുമ്പിൾ), അർഥിക്കുക (അപേക്ഷിക്കുക), ഓതി (പറഞ്ഞു), ഊരുചുറ്റൽ (നാടുചുറ്റൽ), കൗതുകം (ജിജ്ഞാസ).'
        check:
          prompt: '''ഓതി'' എന്നതിന്റെ അർഥം:'
          options:
          - പറഞ്ഞു
          - ഓടി
          - പാടി
          answer: പറഞ്ഞു
          why: ഓതുക = പറയുക.
        ways:
        - style: real_world
          teach: പുതിയ പദങ്ങൾ നമ്മുടെ സംസാരത്തിൽ വച്ചുനോക്കാം. മകളെ കിടാത്തി എന്നു പറയാം. മനോഹരമായത് ചാരു; സുന്ദരി കോമളാംഗി. ദുഃഖം അല്ലൽ; മുഖം ആസ്യം. കൈക്കുമ്പിൾ കരപുടം. അപേക്ഷിക്കുക എന്നതിന് അർഥിക്കുക. 'പറഞ്ഞു' എന്നതിന് ഓതി. നാടുചുറ്റൽ ഊരുചുറ്റൽ; ജിജ്ഞാസ കൗതുകം.
    items:
      - prompt: "'സൃഷ്ടി' എന്നതിനോട് ചേരുന്ന പദം (സൃഷ്ടിക്കുന്നയാൾ):"
        options: ["സ്രഷ്ടാവ്", "സൃഷ്ടികൾ", "സൃഷ്ടിച്ചു", "അനുഗൃഹീതൻ"]
        answer: "സ്രഷ്ടാവ്"
        difficulty: 1
        hints: ["അനുഗ്രഹം - അനുഗൃഹീതൻ പോലെ."]
        solution: "സൃഷ്ടി - സ്രഷ്ടാവ്."
        mistakes: {"സൃഷ്ടികൾ": "mal_srashta", "സൃഷ്ടിച്ചു": "mal_srashta", "അനുഗൃഹീതൻ": "mal_srashta"}
      - prompt: "'ആ കാഴ്ച കണ്ട് അവർ പകച്ചു നിന്നുപോയി' — ഇവിടെ 'പോയി':"
        options: ["അനുപ്രയോഗം; എങ്ങോട്ടും പോകുന്നില്ല", "ഒരിടത്തുനിന്ന് മറ്റൊരിടത്തേക്ക് പോകൽ", "നാമം", "ഭാവിക്കാലം"]
        answer: "അനുപ്രയോഗം; എങ്ങോട്ടും പോകുന്നില്ല"
        difficulty: 2
        hints: ["അവർ അവിടെത്തന്നെ നിൽക്കുകയാണ്."]
        solution: "ഇവിടെ 'പോയി' പ്രധാനക്രിയയെ സഹായിക്കുന്ന അനുപ്രയോഗം."
        mistakes: {"ഒരിടത്തുനിന്ന് മറ്റൊരിടത്തേക്ക് പോകൽ": mal_aux_verb}
      - prompt: "'ആ കാഴ്ച കണ്ട് അവർ വീട്ടിലേക്കു തിരിച്ചുപോയി' — ഇവിടെ 'പോയി':"
        options: ["യഥാർഥത്തിൽ പോകൽ എന്ന അർഥത്തിൽ", "അനുപ്രയോഗം മാത്രം", "ചോദ്യം", "വിശേഷണം"]
        answer: "യഥാർഥത്തിൽ പോകൽ എന്ന അർഥത്തിൽ"
        difficulty: 2
        hints: ["വീട്ടിലേക്ക് യാത്ര ചെയ്യുന്നു."]
        solution: "ഇവിടെ 'പോയി' ഗമനം എന്ന സ്വന്തം അർഥത്തിൽ."
        mistakes: {"അനുപ്രയോഗം മാത്രം": mal_aux_verb}
      - prompt: "'കരപുടം' എന്നതിന്റെ അർഥം:"
        options: ["കൈക്കുമ്പിൾ", "കരയുന്ന മുഖം", "കറുത്ത തുണി", "കരയിലെ വീട്"]
        answer: "കൈക്കുമ്പിൾ"
        difficulty: 2
        hints: ["ഭിക്ഷു വെള്ളം വാങ്ങാൻ നീട്ടിയത്."]
        solution: "കരപുടം = കൈക്കുമ്പിൾ."
        mistakes: {"കരയുന്ന മുഖം": mal_word_meaning}
      - prompt: "'ആസ്യം' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["മുഖം", "ആകാശം", "ആശ", "ആഹാരം"]
        answer: "മുഖം"
        difficulty: 3
        hints: ["'മുറ്റുമാസ്യം മറഞ്ഞുകിടക്കുന്ന'."]
        solution: "ആസ്യം = മുഖം."
        mistakes: {"ആകാശം": mal_word_meaning}
      - prompt: "'അല്ലൽ' എന്നതിന്റെ അർഥം:"
        options: ["ദുഃഖം", "ഇല്ല", "സന്തോഷം", "വെള്ളം"]
        answer: "ദുഃഖം"
        difficulty: 1
        hints: ["'അല്ലലാലങ്ങു ജാതി മറന്നിതോ?'"]
        solution: "അല്ലൽ = ദുഃഖം."
        mistakes: {"ഇല്ല": mal_word_meaning}
      - prompt: "'അനുഗ്രഹം' എന്നതിനോട് ചേരുന്ന പദം (അനുഗ്രഹം ലഭിച്ചയാൾ):"
        options: ["അനുഗൃഹീതൻ", "അനുഗ്രഹിക്കൽ", "അനുഗ്രഹങ്ങൾ", "സ്രഷ്ടാവ്"]
        answer: "അനുഗൃഹീതൻ"
        difficulty: 3
        hints: ["സൃഷ്ടി - സ്രഷ്ടാവ് എന്ന ജോഡി ഓർക്കൂ.", "ചോദ്യം ഒരു ആളിനെയാണ് ചോദിക്കുന്നത്."]
        solution: "Step 1: ജോഡിയിൽ ഒന്ന് ഭാവമാണ്, മറ്റേത് ആളാണ്. Step 2: അനുഗ്രഹം കിട്ടിയ ആൾ: അനുഗൃഹീതൻ."
        mistakes: {"അനുഗ്രഹിക്കൽ": mal_word_pair, "അനുഗ്രഹങ്ങൾ": mal_word_pair, "സ്രഷ്ടാവ്": mal_word_pair}
      - prompt: "താഴെ കൊടുത്തവയിൽ 'പോയി' അനുപ്രയോഗമായി വരുന്ന വാക്യം ഏത്?"
        options: ["വാർത്ത കേട്ട് അവൻ തളർന്നുപോയി.", "അവൻ ചന്തയിലേക്കു പോയി.", "കുട്ടികൾ സ്കൂളിൽ പോയി.", "അച്ഛൻ ജോലിക്കു പോയി."]
        answer: "വാർത്ത കേട്ട് അവൻ തളർന്നുപോയി."
        difficulty: 3
        hints: ["ഏതു വാക്യത്തിലാണ് ആരും എങ്ങോട്ടും യാത്രചെയ്യാത്തത്?"]
        solution: "Step 1: മറ്റു മൂന്നിലും ഒരിടത്തേക്കുള്ള യാത്രയുണ്ട്. Step 2: 'തളർന്നുപോയി'യിൽ യാത്രയില്ല; 'പോയി' പ്രധാനക്രിയയെ സഹായിക്കുന്നു: അനുപ്രയോഗം."
        mistakes: {"അവൻ ചന്തയിലേക്കു പോയി.": mal_aux_verb, "കുട്ടികൾ സ്കൂളിൽ പോയി.": mal_aux_verb, "അച്ഛൻ ജോലിക്കു പോയി.": mal_aux_verb}
      - prompt: '''ചാരു'' എന്നതിന്റെ അർഥം:'
        options:
        - മനോഹരം
        - ദുഃഖം
        - മകൾ
        - മുഖം
        answer: മനോഹരം
        difficulty: 1
        hints:
        - '''ചാരുസാരി'' എന്ന പ്രയോഗം ഓർക്കൂ.'
        - ഭംഗിയുമായി ബന്ധം.
        solution: ചാരു = മനോഹരം, ഭംഗിയുള്ള.
        mistakes:
          ദുഃഖം: m1_meaning_check
      - prompt: '''അർഥിക്കുക'' എന്നതിന്റെ അർഥം:'
        options:
        - അപേക്ഷിക്കുക
        - അർഥം പറയുക
        - ഓടുക
        - ഉറങ്ങുക
        answer: അപേക്ഷിക്കുക
        difficulty: 2
        hints:
        - ഭിക്ഷു വെള്ളത്തിനായി ചെയ്യുന്നത്.
        - '''അർഥി'' = ചോദിക്കുന്നയാൾ.'
        solution: അർഥിക്കുക = അപേക്ഷിക്കുക, യാചിക്കുക.
        mistakes:
          അർഥം പറയുക: m1_meaning_check
      - prompt: '''കൗതുകം'' എന്നതിന്റെ അർഥം:'
        options:
        - ജിജ്ഞാസ
        - ഭയം
        - ക്ഷീണം
        - ദേഷ്യം
        answer: ജിജ്ഞാസ
        difficulty: 1
        hints:
        - പുതിയത് അറിയാനുള്ള ആഗ്രഹം.
        - കുട്ടികളിൽ കൂടുതലായി കാണുന്ന ഭാവം.
        solution: കൗതുകം = ജിജ്ഞാസ, അറിയാനുള്ള താൽപ്പര്യം.
        mistakes:
          ഭയം: m1_meaning_check
      - prompt: 'താഴെ കൊടുത്തവയിൽ ''പോയി'' യഥാർഥ യാത്രയായി വരുന്ന വാക്യം:'
        options:
        - അവൾ ചന്തയിലേക്കു പോയി.
        - അവൾ ഞെട്ടിപ്പോയി.
        - പാൽ തിളച്ചുപോയി.
        - അവൻ ഉറങ്ങിപ്പോയി.
        answer: അവൾ ചന്തയിലേക്കു പോയി.
        difficulty: 2
        hints:
        - ഏതു വാക്യത്തിലാണ് ആൾ ഒരിടത്തേക്ക് നീങ്ങുന്നത്?
        - മറ്റുള്ളവയിൽ 'പോയി' സഹായക്രിയ മാത്രം.
        solution: ചന്തയിലേക്കു പോകുന്നതാണ് ശരിക്കുമുള്ള യാത്ര.
        mistakes:
          അവൾ ഞെട്ടിപ്പോയി.: m1_doer_word
      - prompt: '''ഊരുചുറ്റൽ'' എന്നതിന്റെ അർഥം:'
        options:
        - നാടുചുറ്റൽ
        - വീടുപണി
        - കൃഷി
        - ഉറക്കം
        answer: നാടുചുറ്റൽ
        difficulty: 1
        hints:
        - '''ഊര്'' = നാട്, ഗ്രാമം.'
        - ബഷീർ ഏറെക്കാലം ചെയ്തത്.
        solution: ഊരുചുറ്റൽ = നാടുചുറ്റൽ, യാത്ര.
        mistakes:
          വീടുപണി: m1_meaning_check
      - prompt: '''കോമളാംഗി'' എന്ന പദത്തിന്റെ അർഥം:'
        options:
        - സുന്ദരി
        - ബുദ്ധിമതി
        - വൃദ്ധ
        - ദരിദ്ര
        answer: സുന്ദരി
        difficulty: 2
        hints:
        - കോമളം = മൃദുലം, ഭംഗിയുള്ളത്.
        - അംഗം = ശരീരം.
        solution: കോമളമായ അംഗങ്ങളുള്ളവൾ = സുന്ദരി.
        mistakes:
          വൃദ്ധ: m1_meaning_check
      - prompt: '''ദാനം'' എന്നതിനോട് ചേരുന്ന, ''ദാനം ചെയ്യുന്നയാൾ'' എന്ന പദം:'
        options:
        - ദാതാവ്
        - ദാനം
        - ദാനങ്ങൾ
        - ദാനശീലം
        answer: ദാതാവ്
        difficulty: 3
        hints:
        - സ്രഷ്ടാവ് എന്ന രൂപം ഓർക്കൂ.
        - '''-താവ്'' ചേർന്ന രൂപം.'
        solution: ദാനം ചെയ്യുന്നയാൾ = ദാതാവ്.
        mistakes:
          ദാനശീലം: m1_doer_word
