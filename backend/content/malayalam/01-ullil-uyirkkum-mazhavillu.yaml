        solution: "ബോലോറാം."
        mistakes: {"മോത്തീറാം": mal_amma_story}
      - prompt: "'അമ്മേ' എന്ന വിളി കേട്ടപ്പോൾ വൃദ്ധയ്ക്ക് ശക്തി വീണ്ടുകിട്ടിയതുപോലെ തോന്നാൻ കാരണം:"
