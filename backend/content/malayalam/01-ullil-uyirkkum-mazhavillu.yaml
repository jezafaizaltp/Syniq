        hints: ["അവളുടെ ജാതി കാരണം സമൂഹം അവളോട് എങ്ങനെ പെരുമാറിയിരിക്കും?", "ഭിക്ഷു എന്താണ് ചോദിക്കുന്നില്ലെന്ന് പറഞ്ഞത്?"]
        solution: "Step 1: ഗ്രാമത്തിനു പുറത്ത് മാറ്റിനിർത്തപ്പെട്ടവളാണ് അവൾ. Step 2: 'ജാതി ചോദിക്കുന്നില്ല' എന്ന വാക്ക് അവൾ മുമ്പ് കേട്ടിട്ടില്ലാത്തതാണ്; അതാണ് വിസ്മയം."
        mistakes: {"ഭിക്ഷു വലിയ സമ്മാനം നൽകി": mal_think_why, "കിണറ്റിൽ വെള്ളം തീർന്നുപോയി": mal_think_why, "ഭിക്ഷു അവളുടെ ബന്ധുവായിരുന്നു": mal_chandala}
      - prompt: മാതംഗി എവിടെനിന്നാണ് വെള്ളം കോരിക്കൊണ്ടിരുന്നത്?
        options:
        - കിണറ്റിൽനിന്ന്
        - പുഴയിൽനിന്ന്
        - കുളത്തിൽനിന്ന്
        - മഴവെള്ളത്തിൽനിന്ന്
        answer: കിണറ്റിൽനിന്ന്
        difficulty: 1
        hints:
        - വരൾച്ചക്കാലത്തും വെള്ളം കിട്ടുന്ന ഇടം.
        - അവൾ കയറും പാത്രവുമായി നിൽക്കുകയായിരുന്നു.
        solution: പാഠമനുസരിച്ച് മാതംഗി കിണറ്റിൽനിന്ന് വെള്ളം കോരുകയായിരുന്നു.
        mistakes:
          പുഴയിൽനിന്ന്: m1_place_time
      - prompt: കഥ നടക്കുന്നത് ഏതു സ്ഥലത്തിനടുത്താണ്?
        options:
        - ശ്രാവസ്തി
        - അരുവിപ്പുറം
        - ശാന്തിനികേതനം
        - പഹാഡ്ഗഞ്ച്
        answer: ശ്രാവസ്തി
        difficulty: 2
        hints:
        - ഉത്തരേന്ത്യയിലെ ഒരു പുരാതന നഗരം.
        - ബുദ്ധന്റെ കാലവുമായി ബന്ധപ്പെട്ട സ്ഥലം.
        solution: കഥ നടക്കുന്നത് ഉത്തരേന്ത്യയിലെ ശ്രാവസ്തിക്കടുത്ത്.
        mistakes:
          പഹാഡ്ഗഞ്ച്: m1_place_time
      - prompt: '''ദാഹിക്കുന്നു ഭഗിനീ'' എന്നു പറയുന്നതാര്?'
        options:
        - ആനന്ദൻ എന്ന ഭിക്ഷു
        - മാതംഗി
        - ചാമർ നായകൻ
        - ഗ്രാമമുഖ്യൻ
        answer: ആനന്ദൻ എന്ന ഭിക്ഷു
        difficulty: 1
        hints:
        - ദാഹിച്ചു വലഞ്ഞത് ആര്?
        - അദ്ദേഹം അവളെ സഹോദരി എന്നു വിളിക്കുന്നു.
        solution: ദാഹിച്ചെത്തിയ ആനന്ദൻ മാതംഗിയോട് പറയുന്ന വാക്കുകൾ.
        mistakes:
          മാതംഗി: m1_who_said
      - prompt: '''അല്ലലാലങ്ങു ജാതി മറന്നിതോ?'' — ഈ ചോദ്യം ചോദിക്കുന്നതാര്?'
        options:
        - മാതംഗി
        - ആനന്ദൻ
        - കവി നേരിട്ട്
        - ഗ്രാമവാസികൾ
        answer: മാതംഗി
        difficulty: 2
        hints:
        - ജാതിയെക്കുറിച്ച് ആശങ്കപ്പെടുന്നത് ആര്?
        - വെള്ളം കൊടുക്കാൻ മടിക്കുന്നയാൾ.
        solution: ദുഃഖം കൊണ്ട് ഭിക്ഷു ജാതി മറന്നോ എന്ന് മാതംഗി ചോദിക്കുന്നു.
        mistakes:
          ആനന്ദൻ: m1_who_said
      - prompt: '''അല്ലൽ'' എന്ന പദത്തിന് ഈ വരിയിലുള്ള അർഥം:'
        options:
        - ദുഃഖം
        - സന്തോഷം
        - ദാഹം
        - ജാതി
        answer: ദുഃഖം
        difficulty: 2
        hints:
        - വേദനയോ ബുദ്ധിമുട്ടോ ആണ്.
        - '''അല്ലലാൽ'' = ... കാരണം.'
        solution: അല്ലൽ = ദുഃഖം, കഷ്ടപ്പാട്.
        mistakes:
          സന്തോഷം: m1_meaning_check
      - prompt: 'ഈ കാവ്യഭാഗം ഇന്നത്തെ വായനക്കാരനോട് പറയുന്ന പ്രധാന സന്ദേശം:'
        options:
        - മനുഷ്യരെ ജാതി നോക്കാതെ സ്നേഹിക്കണം
        - വരൾച്ചയിൽ വെള്ളം സൂക്ഷിക്കണം
        - ഭിക്ഷുക്കൾ ദൂരയാത്ര ചെയ്യരുത്
        - കിണർ ആഴത്തിൽ കുഴിക്കണം
        answer: മനുഷ്യരെ ജാതി നോക്കാതെ സ്നേഹിക്കണം
        difficulty: 3
        hints:
        - ഭിക്ഷു ചോദിക്കാതിരുന്നത് എന്ത്?
        - ഗുരുവിന്റെ 'മനുഷ്യന്റെ ജാതി മനുഷ്യത്വം' ഓർക്കൂ.
        solution: ജാതിയല്ല, മനുഷ്യത്വമാണ് വലുത് എന്നതാണ് സന്ദേശം.
        mistakes:
          വരൾച്ചയിൽ വെള്ളം സൂക്ഷിക്കണം: mal_jaathi_idea

  - code: mal9.u1.amma
    title: അമ്മ
    after: [mal9.u1.sukruthaharangal]
    notes: |
      മാധവിക്കുട്ടിയുടെ 'തണുപ്പ്' എന്ന സമാഹാരത്തിലെ കഥ. ഇരുപതു പൈസയ്ക്കു പച്ചക്കറി വാങ്ങി മടങ്ങുന്ന
      വൃദ്ധയെ ഒരു കറുത്ത മെർസിഡീസ് കാർ ഇടിച്ചിട്ട് ഓടിപ്പോയി; വലത്തേ കാലു ചതഞ്ഞു. സൈക്കിൾ
      നിർത്തിയ പാൽക്കാരൻ "എന്തുപറ്റി അമ്മേ?" എന്നു ചോദിച്ചു — കൊല്ലങ്ങളായി ആരും അവരെ അങ്ങനെ
      വിളിച്ചിരുന്നില്ല; മക്കൾ ഉപേക്ഷിച്ച് പുറംരാജ്യങ്ങളിലേക്കു പോയിരുന്നു. പോലീസുകാരൻ പാൽക്കാരനെ
      സംശയിച്ചു; പാൽക്കാരന്റെ പേര് ബോലോറാം, അച്ഛൻ മോത്തീറാം, സ്വദേശം ഗയയ്ക്കടുത്ത ഇമാംഗഞ്ച്.
      "എന്റെ അമ്മയല്ല ... ഇവരെ ഞാനിന്ന് ആദ്യം കാണുകയാണ്." ടാക്സി ഡ്രൈവർ പണം വാങ്ങാതെ
      ഡോക്ടറുടെ അടുത്തെത്തിച്ചു. ഡോക്ടർ: "അമ്മയ്ക്കു വേദനിക്കുന്നുണ്ടോ?" — പണ്ട് തലവേദനിച്ചു
      കിടന്നപ്പോൾ പത്തുവയസ്സായ മകൻ ചോദിച്ച അതേ ചോദ്യം. വീട് പഹാഡ്ഗഞ്ചിൽ. "അവരെ പേടിപ്പിക്കുന്നത്
      എന്തിനാണ്?" — മക്കളെ കുറ്റപ്പെടുത്താതിരിക്കാനുള്ള കരുതൽ. വീട്ടിൽ പച്ചക്കറിയും വെള്ളവുമില്ല;
      വെറുംനിലത്ത് കിടന്ന അവർക്ക് പെട്ടെന്ന് "കാരണം കിട്ടാത്ത ഒരാനന്ദം" തോന്നി.
    explanations:
      text: "മക്കൾ ഉപേക്ഷിച്ച ഒരു അമ്മയെ അപരിചിതർ സ്നേഹത്തോടെ 'അമ്മേ' എന്നു വിളിക്കുന്നു, സഹായിക്കുന്നു. സ്വന്തക്കാർ മറക്കുമ്പോഴും മനുഷ്യത്വം വഴിയിൽ കാത്തുനിൽക്കുന്നുണ്ട്. ഒരു ചോദ്യം പഴയ സ്നേഹത്തിന്റെ ഓർമ്മ ഉണർത്തുന്നു."
      visual: "ഒരു റോഡ്: ചിതറിയ വെണ്ടയ്ക്കകൾക്കിടയിൽ വീണ വൃദ്ധ, സൈക്കിൾ നിർത്തി ഓടിവരുന്ന പാൽക്കാരൻ, ദൂരേക്കു പായുന്ന കറുത്ത കാർ, പുസ്തകവുമായി പോലീസുകാരൻ."
      step_by_step: "അവസാനത്തെ 'കാരണം കിട്ടാത്ത ഒരാനന്ദം' എന്തുകൊണ്ട്? 1. വർഷങ്ങൾക്കുശേഷം ആരോ 'അമ്മേ' എന്നു വിളിച്ചു. 2. 'അമ്മയ്ക്കു വേദനിക്കുന്നുണ്ടോ?' എന്ന ചോദ്യം മകന്റെ ബാല്യം ഓർമ്മിപ്പിച്ചു. 3. ഒരിക്കൽ താൻ സ്നേഹിക്കപ്പെട്ടിരുന്നു എന്ന ഓർമ്മയാണ് ആ ആനന്ദം."
      real_world: "വഴിയിൽ അപകടത്തിൽപ്പെട്ടവരെ ആശുപത്രിയിലെത്തിക്കുന്നവരെ 'നല്ല ശമര്യക്കാരൻ' എന്നു വിളിക്കാറുണ്ട്; അത്തരം സഹായികളെ നിയമവും സംരക്ഷിക്കുന്നു."
    activity:
      type: sort
      prompt: കഥയിൽ ഓരോന്നും ചെയ്തതോ പറഞ്ഞതോ ആര്?
      bins:
      - പാൽക്കാരൻ ബോലോറാം
      - പോലീസുകാരൻ
      - ടാക്സി ഡ്രൈവർ
      - ഡോക്ടർ
      items:
      - label: '"എന്തുപറ്റി അമ്മേ?"'
        bin: പാൽക്കാരൻ ബോലോറാം
        clue: വൃദ്ധ വീണിടത്ത് ആദ്യം സൈക്കിൾ നിർത്തിയതാര്?
        why: സൈക്കിൾ നിർത്തിയ പാൽക്കാരനാണ് ആദ്യം 'അമ്മേ' എന്നു വിളിച്ചത്.
      - label: '"ഇവരെ ഞാനിന്ന് ആദ്യം കാണുകയാണ്"'
        bin: പാൽക്കാരൻ ബോലോറാം
        clue: സംശയിക്കപ്പെട്ടപ്പോൾ ആരാണ് ഇങ്ങനെ വിശദീകരിക്കുന്നത്?
        why: പോലീസ് സംശയിച്ചപ്പോൾ 'എന്റെ അമ്മയല്ല' എന്ന് പാൽക്കാരൻ പറയുന്നു.
      - label: പാൽക്കാരനെ സംശയിച്ചു
        bin: പോലീസുകാരൻ
        clue: അപരിചിതനായ സഹായിയെ ചോദ്യം ചെയ്തതാര്?
        why: പോലീസുകാരൻ പാൽക്കാരന്റെ പേരും അച്ഛന്റെ പേരും നാടും ചോദിക്കുന്നു.
      - label: പണം വാങ്ങാതെ ഡോക്ടറുടെ അടുത്തെത്തിച്ചു
        bin: ടാക്സി ഡ്രൈവർ
        clue: വൃദ്ധയെ വണ്ടിയിൽ കൊണ്ടുപോയതാര്?
        why: ടാക്സി ഡ്രൈവർ പണം വാങ്ങാതെ അവരെ ഡോക്ടറുടെ അടുത്തെത്തിച്ചു.
      - label: '"അമ്മയ്ക്കു വേദനിക്കുന്നുണ്ടോ?"'
        bin: ഡോക്ടർ
        clue: ഈ ചോദ്യം വൃദ്ധയ്ക്ക് മകനെ ഓർമ്മിപ്പിച്ചു. ചികിത്സിക്കുമ്പോൾ ചോദിച്ചതാര്?
        why: ഡോക്ടറുടെ ഈ ചോദ്യം പത്തുവയസ്സായ മകൻ പണ്ട് ചോദിച്ചതുപോലെ.
    lesson:
      - teach: '''അമ്മ'' മാധവിക്കുട്ടിയുടെ ''തണുപ്പ്'' എന്ന സമാഹാരത്തിലെ കഥ. പച്ചക്കറി വാങ്ങി മടങ്ങുന്ന വൃദ്ധയെ ഒരു കറുത്ത മെർസിഡീസ് കാർ ഇടിച്ചിട്ട് നിർത്താതെ പോകുന്നു. സൈക്കിൾ നിർത്തിയ പാൽക്കാരൻ ''എന്തുപറ്റി അമ്മേ?'' എന്നു ചോദിക്കുന്നു.'
        check:
          prompt: '''അമ്മ'' ഏതു സമാഹാരത്തിലെ കഥ?'
          options:
          - തണുപ്പ്
          - ബാല്യകാലസഖി
          - ആഫ്രിക്ക
          answer: തണുപ്പ്
          why: മാധവിക്കുട്ടിയുടെ 'തണുപ്പ്' എന്ന സമാഹാരം.
        ways:
