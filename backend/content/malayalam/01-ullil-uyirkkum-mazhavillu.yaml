subject: mal
chapter: 1
title: "കേരളപാഠാവലി 1: ഉള്ളിലുയിർക്കും മഴവില്ല്"

tips:
  mal_think_why: "കഥാപാത്രം അങ്ങനെ ചെയ്യുന്നതിനു മുമ്പും ശേഷവും എന്തു സംഭവിച്ചു? കാരണം പാഠത്തിൽത്തന്നെ കണ്ടെത്തൂ; ഊഹിച്ചുമാത്രം ഉത്തരം തിരഞ്ഞെടുക്കരുത്."
  mal_word_pair: "ജോഡിയിൽ ഒന്ന് പ്രവൃത്തിയോ ഭാവമോ ആണ്; മറ്റേത് അതു ചെയ്യുന്ന ആളോ അതു ലഭിച്ച ആളോ ആണ്. ചോദ്യം ഏതാണ് ആവശ്യപ്പെടുന്നത്?"
  mal_chandala: "കവിതയിലെ രണ്ടുപേരെ വേർതിരിച്ചറിയൂ: വെള്ളം ചോദിക്കുന്ന ബുദ്ധഭിക്ഷുവും വെള്ളം കൊടുക്കാൻ മടിക്കുന്ന യുവതിയും. അവൾ മടിക്കുന്നതിന്റെ കാരണം എന്താണ്?"
  mal_amma_story: "'അമ്മ' (മാധവിക്കുട്ടി): കാറിടിച്ച് വീണ വൃദ്ധയെ ആശുപത്രിയിലെത്തിക്കുന്നത് അപരിചിതരായ പാൽക്കാരൻ ബോലോറാമും ടാക്സി ഡ്രൈവറുമാണ്; മക്കൾ അവരെ ഉപേക്ഷിച്ച് പോയിരുന്നു."
  mal_basheer_goat: "'പാത്തുമ്മായുടെ ആട്' ബഷീറിന്റെ കൃതി; പാഠം അതിനെക്കുറിച്ച് പ്രൊഫ. എം. കെ. സാനു എഴുതിയ പഠനമാണ് ('ബഷീർ - ഏകാന്തവീഥിയിലെ അവധൂതൻ')."
  mal_aux_verb: "'പോയി' ശരിക്കും ഒരിടത്തേക്കുള്ള യാത്രയാണോ എന്ന് ചോദിക്കൂ. യാത്രയില്ലാതെ പ്രധാനക്രിയയെ സഹായിക്കുക മാത്രമാണെങ്കിൽ അതിന്റെ പേര് എന്ത്?"
  mal_goat_owner: "കഥയുടെ പേരുതന്നെ നോക്കൂ: 'പാത്തുമ്മായുടെ ആട്'. പാത്തുമ്മ ബഷീറിന് ആരാണ്?"
  mal_goat_symbol: "ആട് വീട്ടിലെങ്ങും കയറിനടക്കുന്നു, ആരും തടയുന്നില്ല, എന്തും തിന്നുന്നു. തടസ്സമില്ലാത്ത ഈ ജീവിതം ഏതു ഭാവത്തെ ഓർമ്മിപ്പിക്കുന്നു?"
  mal_jaathi_idea: "ഭിക്ഷു വെള്ളം ചോദിക്കുന്നു, ജാതി ചോദിക്കുന്നില്ല. ആ നിമിഷം അദ്ദേഹത്തിന് എന്താണ് വലുത്: മനുഷ്യന്റെ ആവശ്യമോ ജാതിയോ? അതു ചേരുന്ന ഉത്തരം നോക്കൂ."
  mal_srashta: "ചോദ്യം ആളെയാണ് ചോദിക്കുന്നത്, പ്രവൃത്തിയെയോ ബഹുവചനത്തെയോ അല്ല. 'ചെയ്യുന്നയാൾ' എന്ന അർഥം തരുന്ന '-താവ്' പോലുള്ള രൂപം ഏതിലുണ്ട്?"
  m1_who_said: 'ഈ വാക്കുകൾ പറയുന്നത് ആരാണ്: ഭിക്ഷുവോ മാതംഗിയോ? സന്ദർഭം പാഠത്തിൽ വീണ്ടും വായിക്കൂ.'
  m1_place_time: കഥ നടക്കുന്ന സ്ഥലവും കാലവും പാഠത്തിന്റെ തുടക്കത്തിൽ പറയുന്നുണ്ട്; അവിടെ തിരിച്ചുപോയി നോക്കൂ.
  m1_amma_people: 'കഥയിലെ ആളുകളെ വേർതിരിക്കൂ: വൃദ്ധ, പാൽക്കാരൻ, പോലീസുകാരൻ, ടാക്സി ഡ്രൈവർ, ഡോക്ടർ. ചോദ്യം ആരെക്കുറിച്ചാണ്?'
  m1_amma_feeling: മക്കൾ ഉപേക്ഷിച്ചുപോയ അമ്മയ്ക്ക് അപരിചിതരിൽനിന്ന് കിട്ടിയത് എന്താണ്? ആ അനുഭവം അവരെ എങ്ങനെ സ്പർശിച്ചു?
  m1_basheer_house: ബഷീറിന്റെ വീട്ടിൽ ആരൊക്കെ, എന്തൊക്കെ ഉണ്ടായിരുന്നു എന്ന് പാഠത്തിലെ വിവരണം വീണ്ടും വായിക്കൂ.
  m1_study_not_story: പാഠം ബഷീറിന്റെ കഥയല്ല; ആ കഥയെക്കുറിച്ച് മറ്റൊരാൾ എഴുതിയ പഠനമാണ്. എഴുതിയതാര്, ഏതു കൃതിയിൽ?
  m1_meaning_check: പദം വാക്യത്തിൽ വച്ച് വായിച്ചുനോക്കൂ. ഏത് അർഥം ചേർത്താലാണ് വാക്യം ശരിയാകുന്നത്?
  m1_doer_word: ജോഡിയിൽ ഒന്ന് പ്രവൃത്തി, മറ്റേത് അതു ചെയ്യുന്നയാൾ. ആളെ കുറിക്കുന്ന രൂപം ഏത്?

concepts:
  - code: mal9.u1.sukruthaharangal
    title: സുകൃതഹാരങ്ങൾ
    notes: |
      കുമാരനാശാന്റെ 'ചണ്ഡാലഭിക്ഷുകി' എന്ന ഖണ്ഡകാവ്യത്തിലെ ഭാഗം. കഥ നടക്കുന്നത് രണ്ടായിരത്തഞ്ഞൂറു
      വർഷങ്ങൾക്കു മുമ്പ്, ഉത്തരേന്ത്യയിലെ ശ്രാവസ്തിക്കടുത്ത്; കൊടിയ വരൾച്ച. ദാഹാർത്തനായ ആനന്ദൻ എന്ന
      ബുദ്ധഭിക്ഷു കിണറ്റിൽനിന്ന് വെള്ളം കോരുന്ന മാതംഗിയോട് വെള്ളം ചോദിക്കുന്നു: "ദാഹിക്കുന്നു ഭഗിനീ".
      അവൾ: "അല്ലല്ലെന്തു കഥയിതു കഷ്ടമേ! അല്ലലാലങ്ങു ജാതി മറന്നിതോ?" — താൻ ഗ്രാമത്തിനു പുറത്തു
      വസിക്കുന്ന 'ചാമർ' നായകന്റെ കിടാത്തി (മകൾ) ആണ്. ഭിക്ഷു: "ജാതി ചോദിക്കുന്നില്ല ഞാൻ സോദരി,
      ചോദിക്കുന്നു നീർ നാവുവരണ്ടഹോ". അവൾ വിസ്മയത്തോടെ നിന്നു; വെള്ളം പകർന്നു. "പുണ്യശാലിനി, നീ
      പകർന്നിടുമിത്തണ്ണീർ ... അന്തമറ്റ സുകൃതഹാരങ്ങൾ നിന്നന്തരാത്മാവിലർപ്പിക്കുന്നുണ്ടാവാം."
      വാങ്മയചിത്രം: "കറ്റക്കാർകൂന്തൽ മുടിത്തലവഴി മുറ്റുമാസ്യം മറഞ്ഞുകിടക്കുന്ന ചാരുസാരി..." ബന്ധപ്പെട്ടവ:
      ഗുരു "മനുഷ്യന്റെ ജാതി മനുഷ്യത്വമാണ്"; അംബേദ്കർ: സമത്വം, സ്വാതന്ത്ര്യം, സാഹോദര്യം.
    explanations:
      text: "ജാതിയുടെ പേരിൽ മാറ്റിനിർത്തപ്പെട്ട ഒരു പെൺകുട്ടിയോട് ബുദ്ധഭിക്ഷു സ്നേഹത്തോടെ വെള്ളം ചോദിക്കുന്നു. ദാഹമാണ് മനുഷ്യന്റെ ആവശ്യം, ജാതിയല്ല. അവൾ നൽകുന്ന ഓരോ തുള്ളിയും പുണ്യമാണെന്ന് കവി പറയുന്നു."
      visual: "ഉണങ്ങിയ മരത്തിനടുത്ത് ഒരു കിണർ; കയറും പാളയുമായി മാതംഗി; കൈക്കുമ്പിൾ നീട്ടി വെള്ളം കുടിക്കുന്ന മഞ്ഞവസ്ത്രധാരിയായ ഭിക്ഷു."
      step_by_step: "'സുകൃതഹാരങ്ങൾ' എന്ന ശീർഷകം: 1. സുകൃതം = പുണ്യം. 2. ഹാരം = മാല. 3. അവൾ പകർന്ന ഓരോ തുള്ളിയും അവളുടെ ഉള്ളിൽ പുണ്യത്തിന്റെ മാലകൾ ചാർത്തുന്നു."
      real_world: "ഇന്നും ജാതിയുടെയോ മതത്തിന്റെയോ പേരിൽ വിവേചനം കാണുമ്പോൾ ആനന്ദന്റെ 'ജാതി ചോദിക്കുന്നില്ല' എന്ന വാക്ക് ഓർക്കാം."
    activity:
      type: order
      prompt: കവിതയിലെ സംഭവങ്ങൾ നടന്ന ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - 'ആനന്ദൻ: "ദാഹിക്കുന്നു ഭഗിനീ"'
      - മാതംഗി തന്റെ ജാതി പറഞ്ഞ് മടിക്കുന്നു
      - 'ഭിക്ഷു: "ജാതി ചോദിക്കുന്നില്ല ഞാൻ"'
      - മാതംഗി വിസ്മയത്തോടെ നിന്ന് വെള്ളം പകരുന്നു
      - ഭിക്ഷു അവളെ 'പുണ്യശാലിനി' എന്നു വിളിക്കുന്നു
      reasons:
        മാതംഗി തന്റെ ജാതി പറഞ്ഞ് മടിക്കുന്നു: വെള്ളം ചോദിച്ചതിനുള്ള മറുപടിയാണിത്. ആദ്യം ആരെങ്കിലും വെള്ളം ചോദിക്കണമല്ലോ.
        'ഭിക്ഷു: "ജാതി ചോദിക്കുന്നില്ല ഞാൻ"': ഇത് മാതംഗി ജാതി പറഞ്ഞതിനുള്ള മറുപടിയാണ്.
        മാതംഗി വിസ്മയത്തോടെ നിന്ന് വെള്ളം പകരുന്നു: ജാതി ചോദിക്കാത്ത ഭിക്ഷുവിന്റെ മറുപടി കേട്ടാണ് അവൾ വിസ്മയിക്കുന്നത്.
        ഭിക്ഷു അവളെ 'പുണ്യശാലിനി' എന്നു വിളിക്കുന്നു: '"നീ പകർന്നിടുമിത്തണ്ണീർ" എന്നാണ് ഭിക്ഷു പറയുന്നത്: വെള്ളം കിട്ടിയശേഷമുള്ള വാക്ക്.'
    lesson:
      - teach: '''സുകൃതഹാരങ്ങൾ'' കുമാരനാശാന്റെ ''ചണ്ഡാലഭിക്ഷുകി'' എന്ന ഖണ്ഡകാവ്യത്തിലെ ഭാഗമാണ്. രണ്ടായിരത്തഞ്ഞൂറു വർഷം മുമ്പ്, ശ്രാവസ്തിക്കടുത്ത്, കൊടിയ വരൾച്ചക്കാലം. ദാഹിച്ചു വലഞ്ഞ ആനന്ദൻ എന്ന ബുദ്ധഭിക്ഷു കിണറ്റിൽനിന്ന് വെള്ളം കോരുന്ന മാതംഗിയോട് വെള്ളം ചോദിക്കുന്നു.'
        check:
          prompt: '''ചണ്ഡാലഭിക്ഷുകി'' എഴുതിയ കവി ആര്?'
          options:
          - കുമാരനാശാൻ
          - മാധവിക്കുട്ടി
          - ബഷീർ
          answer: കുമാരനാശാൻ
          why: ഇത് ആശാന്റെ ഖണ്ഡകാവ്യമാണ്.
        ways:
        - style: step_by_step
          teach: 'കഥാപശ്ചാത്തലം ക്രമത്തിൽ നോക്കാം. ഒന്ന്: കവിത കുമാരനാശാന്റെ ''ചണ്ഡാലഭിക്ഷുകി'' എന്ന ഖണ്ഡകാവ്യത്തിലേത്. രണ്ട്: കാലം രണ്ടായിരത്തഞ്ഞൂറു വർഷം മുമ്പ്; സ്ഥലം ശ്രാവസ്തിക്കടുത്ത്. മൂന്ന്: കൊടിയ വരൾച്ചക്കാലം. നാല്: ദാഹിച്ചു വലഞ്ഞ ബുദ്ധഭിക്ഷു ആനന്ദൻ, കിണറ്റിൽനിന്ന് വെള്ളം കോരുന്ന മാതംഗിയോട് വെള്ളം ചോദിക്കുന്നു.'
      - teach: 'താൻ ചാമർ നായകന്റെ മകളാണെന്നും, തന്നിൽനിന്ന് വെള്ളം വാങ്ങിയാൽ ഭിക്ഷു ജാതി മറക്കുകയാണെന്നും മാതംഗി ഭയപ്പെടുന്നു. ഭിക്ഷുവിന്റെ മറുപടി: ''ജാതി ചോദിക്കുന്നില്ല ഞാൻ സോദരി, ചോദിക്കുന്നു നീർ നാവുവരണ്ടഹോ.'' മനുഷ്യന്റെ ആവശ്യമാണ് വലുത്, ജാതിയല്ല.'
