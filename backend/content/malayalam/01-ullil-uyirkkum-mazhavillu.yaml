        hints: ["ആ ദിവസം ആരൊക്കെ അവരെ സഹായിച്ചു?", "വീട്ടിൽ പച്ചക്കറിയും വെള്ളവും ഉണ്ടായിരുന്നോ?"]
        solution: "Step 1: പാൽക്കാരനും ടാക്സി ഡ്രൈവറും ഡോക്ടറും 'അമ്മ' എന്ന സ്നേഹത്തോടെ പെരുമാറി. Step 2: വീട്ടിൽ ഒന്നുമില്ലെങ്കിലും ആ കരുതലിന്റെ ഓർമ്മ അവർക്ക് ആനന്ദം നൽകി."
        mistakes: {"വീട്ടിൽ ധാരാളം ഭക്ഷണം ഉണ്ടായിരുന്നു": mal_read_again, "മക്കൾ തിരിച്ചുവന്നു": mal_amma_story, "കാലിലെ വേദന പൂർണ്ണമായി മാറി": mal_think_why}
      - prompt: അപകടത്തിൽ വൃദ്ധയുടെ ഏതു ഭാഗത്താണ് പരിക്കേറ്റത്?
        options:
        - വലത്തേ കാല്
        - ഇടത്തേ കൈ
        - തല
        - കണ്ണ്
        answer: വലത്തേ കാല്
        difficulty: 1
        hints:
        - അവർക്ക് നടക്കാൻ കഴിയാതായി.
        - കാലു ചതഞ്ഞു എന്ന് പാഠം.
        solution: കാർ ഇടിച്ച് വലത്തേ കാലു ചതഞ്ഞു.
        mistakes:
          തല: m1_amma_people
      - prompt: 'ബോലോറാമിന്റെ അച്ഛന്റെ പേര്:'
        options:
        - മോത്തീറാം
        - ബോലോറാം
        - ഇമാംഗഞ്ച്
        - പഹാഡ്ഗഞ്ച്
        answer: മോത്തീറാം
        difficulty: 2
        hints:
        - പോലീസുകാരൻ ചോദിച്ചപ്പോൾ പാൽക്കാരൻ പറഞ്ഞു.
        - '''-റാം'' എന്ന് അവസാനിക്കുന്ന പേര്.'
        solution: പാൽക്കാരൻ ബോലോറാം, അച്ഛൻ മോത്തീറാം.
        mistakes:
          ബോലോറാം: m1_amma_people
          ഇമാംഗഞ്ച്: m1_amma_people
      - prompt: വൃദ്ധയുടെ വീട് എവിടെയാണ്?
        options:
        - പഹാഡ്ഗഞ്ച്
        - ഇമാംഗഞ്ച്
        - ഗയ
        - ശ്രാവസ്തി
        answer: പഹാഡ്ഗഞ്ച്
        difficulty: 2
        hints:
        - ഇമാംഗഞ്ച് പാൽക്കാരന്റെ നാടാണ്.
        - ഡോക്ടറോടു പറഞ്ഞ സ്ഥലം.
        solution: വൃദ്ധയുടെ വീട് പഹാഡ്ഗഞ്ചിൽ.
        mistakes:
          ഇമാംഗഞ്ച്: m1_amma_people
      - prompt: പോലീസുകാരൻ ആദ്യം ആരെയാണ് സംശയിച്ചത്?
        options:
        - പാൽക്കാരനെ
        - ടാക്സി ഡ്രൈവറെ
        - ഡോക്ടറെ
        - വൃദ്ധയുടെ മകനെ
        answer: പാൽക്കാരനെ
        difficulty: 2
        hints:
        - അപകടസ്ഥലത്ത് കണ്ടത് ആരെ?
        - '''എന്റെ അമ്മയല്ല'' എന്ന് അയാൾക്ക് പറയേണ്ടിവന്നു.'
        solution: സ്ഥലത്തുണ്ടായിരുന്ന പാൽക്കാരനെ പോലീസുകാരൻ സംശയിച്ചു.
        mistakes:
          ഡോക്ടറെ: m1_amma_people
      - prompt: ഡോക്ടറുടെ 'അമ്മയ്ക്കു വേദനിക്കുന്നുണ്ടോ?' എന്ന ചോദ്യം വൃദ്ധയെ എന്ത് ഓർമ്മിപ്പിച്ചു?
        options:
        - പത്തുവയസ്സുള്ള മകൻ പണ്ട് ചോദിച്ച അതേ ചോദ്യം
        - ആശുപത്രിയിലെ ബില്ല്
        - കാറിന്റെ നിറം
        - പച്ചക്കറിയുടെ വില
        answer: പത്തുവയസ്സുള്ള മകൻ പണ്ട് ചോദിച്ച അതേ ചോദ്യം
        difficulty: 3
        hints:
        - പണ്ട് തലവേദനിച്ചു കിടന്ന ഒരു ദിവസം.
        - മകന്റെ കുട്ടിക്കാലം.
        solution: തലവേദനിച്ചു കിടന്നപ്പോൾ പത്തുവയസ്സായ മകൻ ചോദിച്ച ചോദ്യം ഓർമ്മവന്നു.
        mistakes:
          ആശുപത്രിയിലെ ബില്ല്: m1_amma_feeling
      - prompt: 'ടാക്സി ഡ്രൈവറുടെ പ്രവൃത്തി കഥയിൽ കാണിക്കുന്നത്:'
        options:
        - അപരിചിതരിലെ നന്മ
        - പണത്തോടുള്ള ആർത്തി
        - നിയമലംഘനം
        - മക്കളുടെ സ്നേഹം
        answer: അപരിചിതരിലെ നന്മ
        difficulty: 2
        hints:
        - അയാൾ പണം വാങ്ങിയോ?
        - അയാൾ വൃദ്ധയ്ക്ക് ആരുമല്ല.
        solution: പണം വാങ്ങാതെ സഹായിച്ച ഡ്രൈവർ അപരിചിതരിലെ നന്മ കാണിക്കുന്നു.
        mistakes:
          പണത്തോടുള്ള ആർത്തി: m1_amma_feeling
      - prompt: 'വീട്ടിലെത്തിയപ്പോൾ വൃദ്ധയുടെ അവസ്ഥ:'
        options:
        - പച്ചക്കറിയും വെള്ളവുമില്ലാതെ വെറുംനിലത്ത് കിടന്നു
        - മക്കൾ കാത്തിരിക്കുന്നു
        - സദ്യ ഒരുക്കിയിരുന്നു
        - അയൽക്കാർ കൂട്ടിരുന്നു
        answer: പച്ചക്കറിയും വെള്ളവുമില്ലാതെ വെറുംനിലത്ത് കിടന്നു
        difficulty: 2
        hints:
        - വാങ്ങിയ പച്ചക്കറി അപകടത്തിൽ നഷ്ടപ്പെട്ടു.
        - അവർ തനിച്ചാണ് താമസം.
        solution: വീട്ടിൽ പച്ചക്കറിയും വെള്ളവുമില്ല; അവർ വെറുംനിലത്ത് കിടന്നു.
        mistakes:
          മക്കൾ കാത്തിരിക്കുന്നു: mal_amma_story

  - code: mal9.u1.pathumma
    title: പാത്തുമ്മായുടെ ആട് - ഒരു സത്യമായ കഥ
    after: [mal9.u1.amma]
    notes: |
      പ്രൊഫ. എം. കെ. സാനുവിന്റെ 'ബഷീർ - ഏകാന്തവീഥിയിലെ അവധൂതൻ' എന്ന കൃതിയിൽനിന്ന്, ബഷീറിന്റെ
      'പാത്തുമ്മായുടെ ആട്' എന്ന കൃതിയെക്കുറിച്ചുള്ള പഠനം. ബഷീർ: "ഇത് എന്റെ വീട്ടിലെ സത്യമായ കഥയാണ്";
      കഥാപാത്രങ്ങളെല്ലാം ജീവിച്ചിരിക്കുന്നവർ. വീട്: "ഓലമേഞ്ഞ ഒരു ചെറിയ, രണ്ടു മുറികളും ഒരടുക്കളയും
      രണ്ടു വരാന്തകളുമുള്ള കെട്ടിടം." ഊരുചുറ്റലിനുശേഷം 'പ്രശാന്തി തേടി' എത്തിയ ബഷീറിന് കിട്ടുന്നത്
      'ചന്ത കൂടിയ ബഹളം': ഉമ്മ, രണ്ടു സഹോദരന്മാരും കുടുംബവും, സഹോദരിയും ഭർത്താവും മക്കളും, ഇളയ
      സഹോദരൻ; ഉമ്മയുടെ അഭയാർഥികളായ പൂച്ചകൾ, കാക്കത്തൊള്ളായിരം എലികൾ, കാക്കകൾ, പത്തുനൂറു
      കോഴികൾ, എറിയനും പരുന്തും. നടുവിൽ തവിട്ടുനിറമുള്ള ഒരു പെണ്ണാട്: സഹോദരി പാത്തുമ്മായുടെ ആട്;
      അതിന് സർവവിധമായ സ്വാതന്ത്ര്യം. എല്ലാവർക്കും പണം വേണം (വലിയ ധനികനായാണ് ബഷീർ വന്നതെന്ന്
      അവരുടെ വിചാരം); അബു: "നമുക്ക് ഈ മുറ്റം കെട്ടിക്കണം". ബഷീർ ഒരു യോഗിയെപ്പോലെ മന്ദഹാസത്തോടെ
      എല്ലാം കാണുന്നു; ആട് സർവവിധമായ സ്വാതന്ത്ര്യത്തിന്റെ പ്രതീകം. മനുഷ്യരും പ്രകൃതിയും ജീവജാലങ്ങളും
      ബന്ധപ്പെടുന്ന അഖണ്ഡമായ ലോകം; ചെറിയ കാര്യങ്ങളിലൂടെ വലിയ ലോകത്തിന്റെ വിസ്മയം കാണിക്കുന്ന
      'തമാശക്കഥ'. ബന്ധപ്പെട്ടവ: ഡോ. എസ്. ശാരദക്കുട്ടി 'വീടാക്കടങ്ങൾ'; എൻ. വി. കൃഷ്ണവാര്യർ 'ആഫ്രിക്ക'.
    explanations:
      text: "ബഹളം നിറഞ്ഞ ഒരു വീട്ടിലെ ചെറിയ സംഭവങ്ങളിലൂടെ ബഷീർ ഒരു വലിയ ലോകം കാണിക്കുന്നു: മനുഷ്യരും ആടും പൂച്ചയും കോഴിയും ഒന്നിച്ചു ജീവിക്കുന്ന ലോകം. ആ കൃതിയുടെ ഭംഗി വിശദീകരിക്കുകയാണ് എം. കെ. സാനു."
      visual: "ബഷീറിന്റെ ഓലവീട് വരയ്ക്കുക: വരാന്തയിൽ പുഞ്ചിരിക്കുന്ന ബഷീർ, ചുറ്റും കുട്ടികൾ, പൂച്ചകൾ, കോഴികൾ, കാക്കകൾ; നടുവിൽ ആരെയും കൂസാതെ നടക്കുന്ന തവിട്ടുനിറമുള്ള ആട്."
      step_by_step: "'ഒരു സത്യമായ കഥ' എന്ന് എന്തുകൊണ്ട്? 1. കഥാപാത്രങ്ങൾ ബഷീറിന്റെ സ്വന്തം വീട്ടുകാർ. 2. അവരെല്ലാം അപ്പോഴും ജീവിച്ചിരുന്നു. 3. അതിനാൽ ഇത് ഭാവനയല്ല, അനുഭവം എന്ന് ബഷീർ പറയുന്നു."
      real_world: "നിങ്ങളുടെ വീട്ടിലെ വളർത്തുമൃഗങ്ങളും അയൽക്കാരും ചേർന്ന ഒരു ദിവസം തമാശയോടെ എഴുതിനോക്കൂ — അതും ഒരു 'സത്യമായ കഥ' ആകും."
    activity:
      type: sort
      prompt: ബഷീർ 'പ്രശാന്തി തേടി' എത്തിയ വീട്ടിൽ ആരൊക്കെ? മനുഷ്യരെയും ജീവികളെയും വേർതിരിക്കൂ.
      bins:
      - വീട്ടിലെ മനുഷ്യർ
      - വീട്ടിലെ ജീവികൾ
      items:
      - label: ഉമ്മ
        bin: വീട്ടിലെ മനുഷ്യർ
        clue: പൂച്ചകൾ ആരുടെ 'അഭയാർഥികൾ' ആണ്?
        why: ഉമ്മ വീട്ടിലുണ്ട്; പൂച്ചകൾ ഉമ്മയുടെ അഭയാർഥികളാണ്.
      - label: സഹോദരി പാത്തുമ്മ
        bin: വീട്ടിലെ മനുഷ്യർ
        clue: ആട് ആരുടേതാണ്?
        why: ആട് സഹോദരി പാത്തുമ്മായുടേതാണ്.
      - label: ഇളയ സഹോദരൻ
        bin: വീട്ടിലെ മനുഷ്യർ
        clue: ബഷീറിന്റെ കുടുംബത്തിലെ ആരാണിത്?
        why: രണ്ടു സഹോദരന്മാരും കുടുംബവും പുറമേ ഇളയ സഹോദരനും ഉണ്ട്.
      - label: കാക്കത്തൊള്ളായിരം എലികൾ
        bin: വീട്ടിലെ ജീവികൾ
        clue: '''കാക്കത്തൊള്ളായിരം'' എന്നത് എണ്ണമില്ലാത്തത്ര എന്നാണ്. ഏതു കൂട്ടം?'
        why: എലികൾ വീട്ടിലെ ബഹളത്തിന്റെ ഭാഗമാണ്.
      - label: പത്തുനൂറു കോഴികൾ
        bin: വീട്ടിലെ ജീവികൾ
        clue: ഇവർ കുടുംബാംഗങ്ങളാണോ?
        why: കോഴികളും 'ചന്ത കൂടിയ ബഹള'ത്തിലുണ്ട്.
      - label: തവിട്ടുനിറമുള്ള പെണ്ണാട്
        bin: വീട്ടിലെ ജീവികൾ
        clue: '''സർവവിധമായ സ്വാതന്ത്ര്യം'' ഉള്ള ഈ അംഗം ആര്?'
