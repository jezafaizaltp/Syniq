# Class 9 Malayalam (Kerala Padavali), Unit 1. Format: content/README.md.
# Written from the 2024 SCERT Kerala Padavali Part 1 text supplied by the school (read from page images).
# Malayalam wording written by Claude; not yet checked by a native Malayalam teacher.
# Uses tips from Unit 4: mal_read_again, mal_author_work, mal_imagery, mal_word_meaning.
subject: mal
chapter: 1
title: "കേരളപാഠാവലി 1: ഉള്ളിലുയിർക്കും മഴവില്ല്"

tips:
  mal_chandala: "'ചണ്ഡാലഭിക്ഷുകി' (കുമാരനാശാൻ): ദാഹിച്ചുവന്ന ബുദ്ധഭിക്ഷു ആനന്ദൻ ചണ്ഡാലയുവതിയായ മാതംഗിയോട് വെള്ളം ചോദിക്കുന്നു: 'ജാതി ചോദിക്കുന്നില്ല ഞാൻ സോദരി, ചോദിക്കുന്നു നീർ'."
  mal_amma_story: "'അമ്മ' (മാധവിക്കുട്ടി): കാറിടിച്ച് വീണ വൃദ്ധയെ ആശുപത്രിയിലെത്തിക്കുന്നത് അപരിചിതരായ പാൽക്കാരൻ ബോലോറാമും ടാക്സി ഡ്രൈവറുമാണ്; മക്കൾ അവരെ ഉപേക്ഷിച്ച് പോയിരുന്നു."
  mal_basheer_goat: "'പാത്തുമ്മായുടെ ആട്' ബഷീറിന്റെ കൃതി; പാഠം അതിനെക്കുറിച്ച് പ്രൊഫ. എം. കെ. സാനു എഴുതിയ പഠനമാണ് ('ബഷീർ - ഏകാന്തവീഥിയിലെ അവധൂതൻ')."
  mal_aux_verb: "'നിന്നുപോയി' എന്നതിലെ 'പോയി' ഒരു അനുപ്രയോഗമാണ് (സ്വന്തം അർഥമില്ലാതെ പ്രധാനക്രിയയെ സഹായിക്കുന്നു); 'തിരിച്ചുപോയി' എന്നതിൽ 'പോയി' യഥാർഥത്തിൽ പോകൽ എന്ന അർഥത്തിൽ."

concepts:
  - code: mal9.u1.sukruthaharangal
    title: സുകൃതഹാരങ്ങൾ
    notes: |
      കുമാരനാശാന്റെ 'ചണ്ഡാലഭിക്ഷുകി' എന്ന ഖണ്ഡകാവ്യത്തിലെ ഭാഗം. കഥ നടക്കുന്നത് രണ്ടായിരത്തഞ്ഞൂറു
      വർഷങ്ങൾക്കു മുമ്പ്, ഉത്തരേന്ത്യയിലെ ശ്രാവസ്തിക്കടുത്ത്; കൊടിയ വരൾച്ച. ദാഹാർത്തനായ ആനന്ദൻ എന്ന
      ബുദ്ധഭിക്ഷു കിണറ്റിൽനിന്ന് വെള്ളം കോരുന്ന മാതംഗിയോട് വെള്ളം ചോദിക്കുന്നു: "ദാഹിക്കുന്നു ഭഗിനീ".
      അവൾ: "അല്ലല്ലെന്തു കഥയിതു കഷ്ടമേ! അല്ലലാലങ്ങു ജാതി മറന്നിതോ?" — താൻ ഗ്രാമത്തിനു പുറത്തു
      വസിക്കുന്ന 'ചാമർ' നായകന്റെ കിടാത്തി (മകൾ) ആണ്. ഭിക്ഷു: "ജാതി ചോദിക്കുന്നില്ല ഞാൻ സോദരി,
      ചോദിക്കുന്നു നീർ നാവുവരണ്ടഹോ". അവൾ വിസ്മയത്തോടെ നിന്നു; വെള്ളം പകർന്നു. "പുണ്യശാലിനി, നീ
      പകർന്നിടുമിത്തണ്ണീർ ... അന്തമറ്റ സുകൃതഹാരങ്ങൾ നിന്നന്തരാത്മാവിലർപ്പിക്കുന്നുണ്ടാവാം."
      വാങ്മയചിത്രം: "കറ്റക്കാർകൂന്തൽ മുടിത്തലവഴി മുറ്റുമാസ്യം മറഞ്ഞുകിടക്കുന്ന ചാരുസാരി..." ബന്ധപ്പെട്ടവ:
      ഗുരു "മനുഷ്യന്റെ ജാതി മനുഷ്യത്വമാണ്"; അംബേദ്കർ: സമത്വം, സ്വാതന്ത്ര്യം, സാഹോദര്യം.
    explanations:
      text: "ജാതിയുടെ പേരിൽ മാറ്റിനിർത്തപ്പെട്ട ഒരു പെൺകുട്ടിയോട് ബുദ്ധഭിക്ഷു സ്നേഹത്തോടെ വെള്ളം ചോദിക്കുന്നു. ദാഹമാണ് മനുഷ്യന്റെ ആവശ്യം, ജാതിയല്ല. അവൾ നൽകുന്ന ഓരോ തുള്ളിയും പുണ്യമാണെന്ന് കവി പറയുന്നു."
      visual: "ഉണങ്ങിയ മരത്തിനടുത്ത് ഒരു കിണർ; കയറും പാളയുമായി മാതംഗി; കൈക്കുമ്പിൾ നീട്ടി വെള്ളം കുടിക്കുന്ന മഞ്ഞവസ്ത്രധാരിയായ ഭിക്ഷു."
      step_by_step: "'സുകൃതഹാരങ്ങൾ' എന്ന ശീർഷകം: 1. സുകൃതം = പുണ്യം. 2. ഹാരം = മാല. 3. അവൾ പകർന്ന ഓരോ തുള്ളിയും അവളുടെ ഉള്ളിൽ പുണ്യത്തിന്റെ മാലകൾ ചാർത്തുന്നു."
      real_world: "ഇന്നും ജാതിയുടെയോ മതത്തിന്റെയോ പേരിൽ വിവേചനം കാണുമ്പോൾ ആനന്ദന്റെ 'ജാതി ചോദിക്കുന്നില്ല' എന്ന വാക്ക് ഓർക്കാം."
    items:
      - prompt: "'ചണ്ഡാലഭിക്ഷുകി' എന്ന കാവ്യം എഴുതിയതാര്?"
        options: ["എൻ. കുമാരനാശാൻ", "വള്ളത്തോൾ നാരായണമേനോൻ", "ഇടശ്ശേരി ഗോവിന്ദൻനായർ", "വൈലോപ്പിള്ളി ശ്രീധരമേനോൻ"]
        answer: "എൻ. കുമാരനാശാൻ"
        difficulty: 1
        hints: ["'ചിന്താവിഷ്ടയായ സീത'യുടെയും കവി."]
        solution: "കുമാരനാശാൻ."
        mistakes: {"വള്ളത്തോൾ നാരായണമേനോൻ": mal_author_work}
      - prompt: "ബുദ്ധഭിക്ഷുവിന്റെ പേരെന്ത്?"
        options: ["ആനന്ദൻ", "ബുദ്ധൻ", "മാതംഗി", "അശോകൻ"]
        answer: "ആനന്ദൻ"
        difficulty: 1
        hints: ["ദാഹാർത്തനായ ബുദ്ധഭിക്ഷു."]
        solution: "ആനന്ദൻ."
        mistakes: {"മാതംഗി": mal_chandala}
      - prompt: "കഥ നടക്കുന്നത് എത്ര വർഷം മുമ്പാണ്?"
        answer: "2500"
        check: "2500"
        difficulty: 2
        hints: ["'രണ്ടായിരത്തഞ്ഞൂറു വർഷങ്ങൾക്കു മുമ്പ്'."]
        solution: "ഏകദേശം 2500 വർഷം മുമ്പ്."
        mistakes: {"250": mal_read_again}
      - prompt: "ഭിക്ഷു വെള്ളം ചോദിച്ചപ്പോൾ മാതംഗി മടിച്ചതെന്തുകൊണ്ട്?"
        options: ["താൻ ചണ്ഡാലയുവതിയായതിനാൽ ഭിക്ഷുവിന് പാപമാകുമെന്നു കരുതി", "കിണറ്റിൽ വെള്ളമില്ലായിരുന്നു", "ഭിക്ഷുവിനെ ഇഷ്ടമില്ലായിരുന്നു", "പാള പൊട്ടിയിരുന്നു"]
        answer: "താൻ ചണ്ഡാലയുവതിയായതിനാൽ ഭിക്ഷുവിന് പാപമാകുമെന്നു കരുതി"
        difficulty: 2
        hints: ["'അല്ലലാലങ്ങു ജാതി മറന്നിതോ?'"]
        solution: "ജാതിഭേദം കാരണം താൻ നൽകുന്ന വെള്ളം ഭിക്ഷുവിന് ദോഷമാകുമെന്ന് അവൾ ഭയന്നു."
        mistakes: {"കിണറ്റിൽ വെള്ളമില്ലായിരുന്നു": mal_chandala}
      - prompt: "'ജാതി ചോദിക്കുന്നില്ല ഞാൻ സോദരി, ചോദിക്കുന്നു നീർ' — ഈ വരികളിലെ ആശയം:"
        options: ["മനുഷ്യന്റെ ആവശ്യവും സ്നേഹവുമാണ് പ്രധാനം; ജാതിയല്ല", "ജാതി അറിയാതെ വെള്ളം കുടിക്കരുത്", "വെള്ളം വിലയ്ക്കു വാങ്ങണം", "ഭിക്ഷുവിന് ദാഹമില്ല"]
        answer: "മനുഷ്യന്റെ ആവശ്യവും സ്നേഹവുമാണ് പ്രധാനം; ജാതിയല്ല"
        difficulty: 2
        hints: ["ഗുരു: 'മനുഷ്യന്റെ ജാതി മനുഷ്യത്വമാണ്'."]
        solution: "ജാതിഭേദത്തെ നിരാകരിക്കുന്ന മാനവികതയാണ് ആശയം."
      - prompt: "'കിടാത്തി' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["മകൾ", "കിടക്ക", "അമ്മ", "ദാസി"]
        answer: "മകൾ"
        difficulty: 2
        hints: ["'ചാമർ നായകന്റെ കിടാത്തി ഞാൻ'."]
        solution: "കിടാത്തി = മകൾ."
        mistakes: {"കിടക്ക": mal_word_meaning}
      - prompt: "'അന്തമറ്റ സുകൃതഹാരങ്ങൾ' — 'സുകൃതം' എന്നതിന്റെ അർഥം:"
        options: ["പുണ്യം", "പാപം", "സുഖം", "സ്വർണ്ണം"]
        answer: "പുണ്യം"
        difficulty: 3
        hints: ["'പുണ്യശാലിനി'."]
        solution: "സുകൃതം = പുണ്യം; സുകൃതഹാരം = പുണ്യത്തിന്റെ മാല."
        mistakes: {"സ്വർണ്ണം": mal_word_meaning}

  - code: mal9.u1.amma
    title: അമ്മ
    after: [mal9.u1.sukruthaharangal]
    notes: |
      മാധവിക്കുട്ടിയുടെ 'തണുപ്പ്' എന്ന സമാഹാരത്തിലെ കഥ. ഇരുപതു പൈസയ്ക്കു പച്ചക്കറി വാങ്ങി മടങ്ങുന്ന
      വൃദ്ധയെ ഒരു കറുത്ത മെർസിഡീസ് കാർ ഇടിച്ചിട്ട് ഓടിപ്പോയി; വലത്തേ കാലു ചതഞ്ഞു. സൈക്കിൾ
      നിർത്തിയ പാൽക്കാരൻ "എന്തുപറ്റി അമ്മേ?" എന്നു ചോദിച്ചു — കൊല്ലങ്ങളായി ആരും അവരെ അങ്ങനെ
      വിളിച്ചിരുന്നില്ല; മക്കൾ ഉപേക്ഷിച്ച് പുറംരാജ്യങ്ങളിലേക്കു പോയിരുന്നു. പോലീസുകാരൻ പാൽക്കാരനെ
      സംശയിച്ചു; പാൽക്കാരന്റെ പേര് ബോലോറാം, അച്ഛൻ മോത്തീറാം, സ്വദേശം ഗയയ്ക്കടുത്ത ഇമാംഗഞ്ച്.
      "എന്റെ അമ്മയല്ല ... ഇവരെ ഞാനിന്ന് ആദ്യം കാണുകയാണ്." ടാക്സി ഡ്രൈവർ പണം വാങ്ങാതെ
      ഡോക്ടറുടെ അടുത്തെത്തിച്ചു. ഡോക്ടർ: "അമ്മയ്ക്കു വേദനിക്കുന്നുണ്ടോ?" — പണ്ട് തലവേദനിച്ചു
      കിടന്നപ്പോൾ പത്തുവയസ്സായ മകൻ ചോദിച്ച അതേ ചോദ്യം. വീട് പഹാഡ്ഗഞ്ചിൽ. "അവരെ പേടിപ്പിക്കുന്നത്
      എന്തിനാണ്?" — മക്കളെ കുറ്റപ്പെടുത്താതിരിക്കാനുള്ള കരുതൽ. വീട്ടിൽ പച്ചക്കറിയും വെള്ളവുമില്ല;
      വെറുംനിലത്ത് കിടന്ന അവർക്ക് പെട്ടെന്ന് "കാരണം കിട്ടാത്ത ഒരാനന്ദം" തോന്നി.
    explanations:
      text: "മക്കൾ ഉപേക്ഷിച്ച ഒരു അമ്മയെ അപരിചിതർ സ്നേഹത്തോടെ 'അമ്മേ' എന്നു വിളിക്കുന്നു, സഹായിക്കുന്നു. സ്വന്തക്കാർ മറക്കുമ്പോഴും മനുഷ്യത്വം വഴിയിൽ കാത്തുനിൽക്കുന്നുണ്ട്. ഒരു ചോദ്യം പഴയ സ്നേഹത്തിന്റെ ഓർമ്മ ഉണർത്തുന്നു."
