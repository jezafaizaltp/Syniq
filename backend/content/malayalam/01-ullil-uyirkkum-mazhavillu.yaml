        answer: "ഒരു കറുത്ത മെർസിഡീസ് കാർ"
        difficulty: 1
        hints: ["അത് നിർത്താതെ ഓടിപ്പോയി."]
        solution: "കറുത്ത മെർസിഡീസ് കാർ."
        mistakes: {"ഒരു സൈക്കിൾ": mal_amma_story}
      - prompt: "പാൽക്കാരന്റെ പേര്:"
