        options: ["ഉപേക്ഷിച്ചിട്ടും മക്കളെ കുറ്റപ്പെടുത്താതിരിക്കാനുള്ള അമ്മയുടെ കരുതൽ", "മക്കളോടുള്ള ദേഷ്യം", "ഡോക്ടറോടുള്ള ഭയം", "പണമില്ലായ്മ"]
        answer: "ഉപേക്ഷിച്ചിട്ടും മക്കളെ കുറ്റപ്പെടുത്താതിരിക്കാനുള്ള അമ്മയുടെ കരുതൽ"
