      - teach: ഈ ബഹളത്തിനു നടുവിൽ പാത്തുമ്മായുടെ തവിട്ടുനിറമുള്ള ആട് എവിടെയും കയറിനടക്കുന്നു; അതിന് സർവവിധമായ സ്വാതന്ത്ര്യം. ബഷീർ ഒരു യോഗിയെപ്പോലെ മന്ദഹാസത്തോടെ എല്ലാം കാണുന്നു. മനുഷ്യരും ജീവികളും ചേർന്ന ഒരൊറ്റ ലോകമാണ് ബഷീറിന്റേത്.
