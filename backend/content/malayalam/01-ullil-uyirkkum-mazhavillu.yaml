          teach: 'വെയിലത്ത് തളർന്നുവീണ ഒരാൾക്ക് വെള്ളം കൊടുക്കുമ്പോൾ നമ്മൾ അയാളുടെ ജാതി ചോദിക്കാറില്ലല്ലോ. ആനന്ദനും അതുതന്നെ പറയുന്നു. താൻ ചാമർ നായകന്റെ മകളാണെന്നും, തന്നിൽനിന്ന് വെള്ളം വാങ്ങിയാൽ ഭിക്ഷു ജാതി മറക്കുകയാണെന്നും മാതംഗി ഭയപ്പെടുന്നു. ഭിക്ഷു: ''ജാതി ചോദിക്കുന്നില്ല ഞാൻ സോദരി, ചോദിക്കുന്നു നീർ നാവുവരണ്ടഹോ.'' വലുത് മനുഷ്യന്റെ ആവശ്യമാണ്, ജാതിയല്ല.'
