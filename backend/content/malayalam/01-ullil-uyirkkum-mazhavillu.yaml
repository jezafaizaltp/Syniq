  - code: mal9.u1.pathumma
    title: പാത്തുമ്മായുടെ ആട് - ഒരു സത്യമായ കഥ
    after: [mal9.u1.amma]
    notes: |
      പ്രൊഫ. എം. കെ. സാനുവിന്റെ 'ബഷീർ - ഏകാന്തവീഥിയിലെ അവധൂതൻ' എന്ന കൃതിയിൽനിന്ന്, ബഷീറിന്റെ
      'പാത്തുമ്മായുടെ ആട്' എന്ന കൃതിയെക്കുറിച്ചുള്ള പഠനം. ബഷീർ: "ഇത് എന്റെ വീട്ടിലെ സത്യമായ കഥയാണ്";
      കഥാപാത്രങ്ങളെല്ലാം ജീവിച്ചിരിക്കുന്നവർ. വീട്: "ഓലമേഞ്ഞ ഒരു ചെറിയ, രണ്ടു മുറികളും ഒരടുക്കളയും
      രണ്ടു വരാന്തകളുമുള്ള കെട്ടിടം." ഊരുചുറ്റലിനുശേഷം 'പ്രശാന്തി തേടി' എത്തിയ ബഷീറിന് കിട്ടുന്നത്
      'ചന്ത കൂടിയ ബഹളം': ഉമ്മ, രണ്ടു സഹോദരന്മാരും കുടുംബവും, സഹോദരിയും ഭർത്താവും മക്കളും, ഇളയ
      സഹോദരൻ; ഉമ്മയുടെ അഭയാർഥികളായ പൂച്ചകൾ, കാക്കത്തൊള്ളായിരം എലികൾ, കാക്കകൾ, പത്തുനൂറു
      കോഴികൾ, എറിയനും പരുന്തും. നടുവിൽ തവിട്ടുനിറമുള്ള ഒരു പെണ്ണാട്: സഹോദരി പാത്തുമ്മായുടെ ആട്;
      അതിന് സർവവിധമായ സ്വാതന്ത്ര്യം. എല്ലാവർക്കും പണം വേണം (വലിയ ധനികനായാണ് ബഷീർ വന്നതെന്ന്
      അവരുടെ വിചാരം); അബു: "നമുക്ക് ഈ മുറ്റം കെട്ടിക്കണം". ബഷീർ ഒരു യോഗിയെപ്പോലെ മന്ദഹാസത്തോടെ
      എല്ലാം കാണുന്നു; ആട് സർവവിധമായ സ്വാതന്ത്ര്യത്തിന്റെ പ്രതീകം. മനുഷ്യരും പ്രകൃതിയും ജീവജാലങ്ങളും
      ബന്ധപ്പെടുന്ന അഖണ്ഡമായ ലോകം; ചെറിയ കാര്യങ്ങളിലൂടെ വലിയ ലോകത്തിന്റെ വിസ്മയം കാണിക്കുന്ന
      'തമാശക്കഥ'. ബന്ധപ്പെട്ടവ: ഡോ. എസ്. ശാരദക്കുട്ടി 'വീടാക്കടങ്ങൾ'; എൻ. വി. കൃഷ്ണവാര്യർ 'ആഫ്രിക്ക'.
    explanations:
      text: "ബഹളം നിറഞ്ഞ ഒരു വീട്ടിലെ ചെറിയ സംഭവങ്ങളിലൂടെ ബഷീർ ഒരു വലിയ ലോകം കാണിക്കുന്നു: മനുഷ്യരും ആടും പൂച്ചയും കോഴിയും ഒന്നിച്ചു ജീവിക്കുന്ന ലോകം. ആ കൃതിയുടെ ഭംഗി വിശദീകരിക്കുകയാണ് എം. കെ. സാനു."
      visual: "ബഷീറിന്റെ ഓലവീട് വരയ്ക്കുക: വരാന്തയിൽ പുഞ്ചിരിക്കുന്ന ബഷീർ, ചുറ്റും കുട്ടികൾ, പൂച്ചകൾ, കോഴികൾ, കാക്കകൾ; നടുവിൽ ആരെയും കൂസാതെ നടക്കുന്ന തവിട്ടുനിറമുള്ള ആട്."
      step_by_step: "'ഒരു സത്യമായ കഥ' എന്ന് എന്തുകൊണ്ട്? 1. കഥാപാത്രങ്ങൾ ബഷീറിന്റെ സ്വന്തം വീട്ടുകാർ. 2. അവരെല്ലാം അപ്പോഴും ജീവിച്ചിരുന്നു. 3. അതിനാൽ ഇത് ഭാവനയല്ല, അനുഭവം എന്ന് ബഷീർ പറയുന്നു."
      real_world: "നിങ്ങളുടെ വീട്ടിലെ വളർത്തുമൃഗങ്ങളും അയൽക്കാരും ചേർന്ന ഒരു ദിവസം തമാശയോടെ എഴുതിനോക്കൂ — അതും ഒരു 'സത്യമായ കഥ' ആകും."
    items:
      - prompt: "'പാത്തുമ്മായുടെ ആട്' എന്ന കൃതി ആരുടേതാണ്?"
        options: ["വൈക്കം മുഹമ്മദ് ബഷീർ", "എം. കെ. സാനു", "തകഴി", "എസ്. കെ. പൊറ്റെക്കാട്ട്"]
        answer: "വൈക്കം മുഹമ്മദ് ബഷീർ"
        difficulty: 1
        hints: ["എം. കെ. സാനു അതിനെക്കുറിച്ച് എഴുതി."]
        solution: "ബഷീറിന്റെ കൃതി; പാഠം അതിനെക്കുറിച്ചുള്ള സാനുവിന്റെ പഠനം."
        mistakes: {"എം. കെ. സാനു": mal_basheer_goat}
      - prompt: "പാഠഭാഗം ഏതു കൃതിയിൽനിന്നാണ്?"
        options: ["ബഷീർ - ഏകാന്തവീഥിയിലെ അവധൂതൻ", "വീടാക്കടങ്ങൾ", "ആഫ്രിക്ക", "തണുപ്പ്"]
        answer: "ബഷീർ - ഏകാന്തവീഥിയിലെ അവധൂതൻ"
        difficulty: 2
        hints: ["പ്രൊഫ. എം. കെ. സാനു."]
        solution: "'ബഷീർ - ഏകാന്തവീഥിയിലെ അവധൂതൻ'."
        mistakes: {"വീടാക്കടങ്ങൾ": mal_author_work}
      - prompt: "ആട് ആരുടേതാണ്?"
        options: ["ബഷീറിന്റെ സഹോദരി പാത്തുമ്മായുടെ", "ബഷീറിന്റെ ഉമ്മയുടെ", "അബുവിന്റെ", "അയൽക്കാരന്റെ"]
        answer: "ബഷീറിന്റെ സഹോദരി പാത്തുമ്മായുടെ"
        difficulty: 1
        hints: ["ശീർഷകം."]
        solution: "സഹോദരി പാത്തുമ്മായുടെ ആട്."
      - prompt: "ബഷീർ വീട്ടിലെത്തിയത് എന്തു തേടിയാണ്?"
        options: ["പ്രശാന്തി", "പണം", "ജോലി", "ആട്"]
        answer: "പ്രശാന്തി"
        difficulty: 1
        hints: ["പക്ഷേ കിട്ടിയത് 'ചന്ത കൂടിയ ബഹളം'."]
        solution: "ഊരുചുറ്റലിനുശേഷം പ്രശാന്തി തേടി."
        mistakes: {"പണം": mal_basheer_goat}
      - prompt: "'ചന്ത കൂടിയ ബഹളമാണ് അവിടെ എപ്പോഴും' — ഈ പ്രയോഗം എന്തിനെ സൂചിപ്പിക്കുന്നു?"
        options: ["ആളുകളും ജീവികളും നിറഞ്ഞ വീട്ടിലെ നിർത്താത്ത ശബ്ദവും തിരക്കും", "വീടിനടുത്ത് ഒരു ചന്തയുണ്ടായിരുന്നു", "വീട്ടിൽ കച്ചവടം നടന്നിരുന്നു", "വീട്ടിൽ ആരുമില്ലായിരുന്നു"]
        answer: "ആളുകളും ജീവികളും നിറഞ്ഞ വീട്ടിലെ നിർത്താത്ത ശബ്ദവും തിരക്കും"
        difficulty: 2
        hints: ["കുട്ടികളുടെ കരച്ചിൽ, പെണ്ണുങ്ങളുടെ വഴക്ക്..."]
        solution: "വീട്ടിലെ തിരക്കും ബഹളവും ചന്തയോട് ഉപമിക്കുന്നു."
        mistakes: {"വീടിനടുത്ത് ഒരു ചന്തയുണ്ടായിരുന്നു": mal_imagery}
      - prompt: "പഠനമനുസരിച്ച് ആട് എന്തിന്റെ പ്രതീകമായി വളരുന്നു?"
        options: ["സർവവിധമായ സ്വാതന്ത്ര്യത്തിന്റെ", "ദാരിദ്ര്യത്തിന്റെ", "ഭയത്തിന്റെ", "സമ്പത്തിന്റെ"]
        answer: "സർവവിധമായ സ്വാതന്ത്ര്യത്തിന്റെ"
        difficulty: 3
        hints: ["'ആരും അതിനെ നിയന്ത്രിക്കുന്നില്ല'."]
        solution: "സർവതന്ത്രവും അതിലംഘിക്കുന്ന ആട് സ്വാതന്ത്ര്യത്തിന്റെ പ്രതീകമാകുന്നു."

  - code: mal9.u1.bhasha
    title: "ഭാഷ: പദജോഡികൾ, അനുപ്രയോഗം, പദപരിചയം"
    after: [mal9.u1.amma]
    notes: |
      പദജോഡികൾ: സൃഷ്ടി - സ്രഷ്ടാവ്, അനുഗ്രഹം - അനുഗൃഹീതൻ (ക്രിയ/ഭാവം - കർത്താവ്/ഗുണി). 'പോയി'
      രണ്ടു സന്ദർഭത്തിൽ: "അവർ പകച്ചു നിന്നുപോയി" — അനുപ്രയോഗം (പ്രധാനക്രിയയെ സഹായിക്കുന്നു, പൂർണ്ണത/
      വികാരം കാണിക്കുന്നു); "അവർ വീട്ടിലേക്കു തിരിച്ചുപോയി" — യഥാർഥ ഗമനം. പദപരിചയം: കിടാത്തി (മകൾ),
      ചാരു (മനോഹരം), കോമളാംഗി (സുന്ദരി), അല്ലൽ (ദുഃഖം), ആസ്യം (മുഖം), കരപുടം (കൈക്കുമ്പിൾ),
      അർഥിക്കുക (അപേക്ഷിക്കുക), ഓതി (പറഞ്ഞു), ഖണ്ഡിക (പരസ്പരബന്ധമുള്ള വാക്യങ്ങൾ ചേർന്ന ഗദ്യഭാഗം),
      ഊരുചുറ്റൽ (നാടുചുറ്റൽ), കൗതുകം (ജിജ്ഞാസ).
    explanations:
      text: "ഒരേ വാക്ക് രണ്ടു രീതിയിൽ പ്രവർത്തിക്കാം: 'തിരിച്ചുപോയി' എന്നതിൽ 'പോയി' യാത്രയാണ്; 'നിന്നുപോയി' എന്നതിൽ അത് ഒരു സഹായകക്രിയ മാത്രം — അനുപ്രയോഗം."
      visual: "രണ്ടു ചിത്രം: വഴിയിലൂടെ നടന്നു മറയുന്ന ഒരാൾ (തിരിച്ചുപോയി), അനങ്ങാതെ ഞെട്ടി നിൽക്കുന്ന ഒരാൾ (നിന്നുപോയി)."
      step_by_step: "'പകച്ചു നിന്നുപോയി' പരിശോധിക്കാം: 1. പ്രധാനക്രിയ: നിന്നു. 2. 'പോയി' ചേർത്താലും എങ്ങോട്ടും പോകുന്നില്ല. 3. അതിനാൽ 'പോയി' അനുപ്രയോഗം."
      real_world: "'ഞാൻ ഉറങ്ങിപ്പോയി', 'പേടിച്ചുപോയി' — ദിവസവും നാം അനുപ്രയോഗം ഉപയോഗിക്കുന്നു."
    items:
      - prompt: "'സൃഷ്ടി' എന്നതിനോട് ചേരുന്ന പദം (സൃഷ്ടിക്കുന്നയാൾ):"
        options: ["സ്രഷ്ടാവ്", "സൃഷ്ടികൾ", "സൃഷ്ടിച്ചു", "അനുഗൃഹീതൻ"]
        answer: "സ്രഷ്ടാവ്"
        difficulty: 1
        hints: ["അനുഗ്രഹം - അനുഗൃഹീതൻ പോലെ."]
        solution: "സൃഷ്ടി - സ്രഷ്ടാവ്."
      - prompt: "'ആ കാഴ്ച കണ്ട് അവർ പകച്ചു നിന്നുപോയി' — ഇവിടെ 'പോയി':"
        options: ["അനുപ്രയോഗം; എങ്ങോട്ടും പോകുന്നില്ല", "ഒരിടത്തുനിന്ന് മറ്റൊരിടത്തേക്ക് പോകൽ", "നാമം", "ഭാവിക്കാലം"]
        answer: "അനുപ്രയോഗം; എങ്ങോട്ടും പോകുന്നില്ല"
        difficulty: 2
        hints: ["അവർ അവിടെത്തന്നെ നിൽക്കുകയാണ്."]
        solution: "ഇവിടെ 'പോയി' പ്രധാനക്രിയയെ സഹായിക്കുന്ന അനുപ്രയോഗം."
        mistakes: {"ഒരിടത്തുനിന്ന് മറ്റൊരിടത്തേക്ക് പോകൽ": mal_aux_verb}
      - prompt: "'ആ കാഴ്ച കണ്ട് അവർ വീട്ടിലേക്കു തിരിച്ചുപോയി' — ഇവിടെ 'പോയി':"
        options: ["യഥാർഥത്തിൽ പോകൽ എന്ന അർഥത്തിൽ", "അനുപ്രയോഗം മാത്രം", "ചോദ്യം", "വിശേഷണം"]
        answer: "യഥാർഥത്തിൽ പോകൽ എന്ന അർഥത്തിൽ"
        difficulty: 2
        hints: ["വീട്ടിലേക്ക് യാത്ര ചെയ്യുന്നു."]
        solution: "ഇവിടെ 'പോയി' ഗമനം എന്ന സ്വന്തം അർഥത്തിൽ."
        mistakes: {"അനുപ്രയോഗം മാത്രം": mal_aux_verb}
      - prompt: "'കരപുടം' എന്നതിന്റെ അർഥം:"
        options: ["കൈക്കുമ്പിൾ", "കരയുന്ന മുഖം", "കറുത്ത തുണി", "കരയിലെ വീട്"]
        answer: "കൈക്കുമ്പിൾ"
        difficulty: 2
        hints: ["ഭിക്ഷു വെള്ളം വാങ്ങാൻ നീട്ടിയത്."]
        solution: "കരപുടം = കൈക്കുമ്പിൾ."
        mistakes: {"കരയുന്ന മുഖം": mal_word_meaning}
      - prompt: "'ആസ്യം' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["മുഖം", "ആകാശം", "ആശ", "ആഹാരം"]
        answer: "മുഖം"
        difficulty: 3
        hints: ["'മുറ്റുമാസ്യം മറഞ്ഞുകിടക്കുന്ന'."]
        solution: "ആസ്യം = മുഖം."
        mistakes: {"ആകാശം": mal_word_meaning}
      - prompt: "'അല്ലൽ' എന്നതിന്റെ അർഥം:"
        options: ["ദുഃഖം", "ഇല്ല", "സന്തോഷം", "വെള്ളം"]
        answer: "ദുഃഖം"
        difficulty: 1
        hints: ["'അല്ലലാലങ്ങു ജാതി മറന്നിതോ?'"]
        solution: "അല്ലൽ = ദുഃഖം."
        mistakes: {"ഇല്ല": mal_word_meaning}
