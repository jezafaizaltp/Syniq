        why: സൈക്കിൾ നിർത്തിയ പാൽക്കാരനാണ് ആദ്യം 'അമ്മേ' എന്നു വിളിച്ചത്.
      - label: '"ഇവരെ ഞാനിന്ന് ആദ്യം കാണുകയാണ്"'
