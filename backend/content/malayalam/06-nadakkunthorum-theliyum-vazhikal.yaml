      - teach: ഹക്കീം ഉറങ്ങുന്നു; വണ്ടി മണൽക്കൂനകൾക്കിടയിലൂടെ മുന്നോട്ട്. നജീബിന്റെ മനസ്സിൽ ഭയം — 'പടച്ചോനേ'. സ്വപ്നങ്ങളുമായി വന്ന ഒരു പ്രവാസിയുടെ ദുരിതജീവിതം ഇവിടെ തുടങ്ങുന്നു. 'പച്ചവെള്ളം' എന്നതിലെ 'പച്ച' നിറമല്ല, 'വെറും, ഒന്നും ചേർക്കാത്ത' എന്നാണ് (പച്ചക്കള്ളം, പച്ചമനുഷ്യൻ).
        check:
          prompt: '''പച്ചവെള്ളം'' എന്നതിലെ ''പച്ച'' എന്നതിന്റെ അർഥം:'
