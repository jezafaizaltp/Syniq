        options: ["കുഞ്ഞിനെയെന്നപോലെ മടിയിലിരുത്തി", "കൊക്കിൽ കൊത്തിയെടുത്ത്", "ചിറകിനടിയിൽ ഒളിപ്പിച്ച്", "കാലിൽ കെട്ടിവച്ച്"]
        answer: "കുഞ്ഞിനെയെന്നപോലെ മടിയിലിരുത്തി"
        difficulty: 1
        hints: ["അതിന് ചിറകും കൊക്കുമില്ല."]
        solution: "കുഞ്ഞിനെയെന്നപോലെ മടിയിലിരുത്തി."
        mistakes: {"ചിറകിനടിയിൽ ഒളിപ്പിച്ച്": mal_imagery}
      - prompt: "അപ്പൂപ്പൻതാടിയുടെ സ്മാരകം എന്താണ്?"
        options: ["അത് വീണിടത്ത് നാളെ ഉയരുന്ന മരം", "ഒരു കൽപ്രതിമ", "ഒരു കവിതാപുസ്തകം", "ഒരു പൂന്തോട്ടത്തിലെ ഫലകം"]
        answer: "അത് വീണിടത്ത് നാളെ ഉയരുന്ന മരം"
        difficulty: 2
        hints: ["വിത്ത് മുളച്ചാൽ എന്തുണ്ടാകും?"]
        solution: "അത് കൊണ്ടുപോയ വിത്ത് വളർന്നുണ്ടാകുന്ന മരമാണ് സ്മാരകം."
        mistakes: {"ഒരു കൽപ്രതിമ": mal_thistle_seed}
      - prompt: "'ധീരമെങ്കിലും എളിയ അതിന്റെ ശ്രമം' — എളിയ എന്നതിന്റെ അർഥം?"
        options: ["ചെറിയ, വിനീതമായ", "വലിയ, ഗംഭീരമായ", "ഭയന്ന", "പഴയ"]
        answer: "ചെറിയ, വിനീതമായ"
        difficulty: 2
        hints: ["'ധീരമെങ്കിലും' എന്നത് ഒരു വിപരീതഭാവം കാണിക്കുന്നു."]
        solution: "എളിയ = ചെറിയ, വിനയമുള്ള."
        mistakes: {"വലിയ, ഗംഭീരമായ": mal_word_meaning}
      - prompt: "'അറിവില്ലായ്മയുടെ ഭാരക്കുറവിൽ' പറക്കുന്നു എന്നതുകൊണ്ട് കവി സൂചിപ്പിക്കുന്നത് ഏറ്റവും നന്നായി ഏത്?"
        options: ["ഭയവും കണക്കുകൂട്ടലും ഭാരമാകാത്തതിനാൽ അത് ലഘുവായി ധൈര്യത്തോടെ പറക്കുന്നു", "അത് ബുദ്ധിയില്ലാത്തതിനാൽ വഴിതെറ്റുന്നു", "അതിന് ഭാരം കൂടുതലാണ്", "അത് പറക്കാൻ പഠിച്ചിട്ടില്ല"]
        answer: "ഭയവും കണക്കുകൂട്ടലും ഭാരമാകാത്തതിനാൽ അത് ലഘുവായി ധൈര്യത്തോടെ പറക്കുന്നു"
        difficulty: 3
        hints: ["എവിടെ വീഴുമെന്ന് അറിയാതെയാണ് അത് പോകുന്നത്; അതുകൊണ്ട് ആശങ്കയുമില്ല."]
        solution: "അറിവില്ലായ്മ ഇവിടെ ഒരു ലഘുത്വമാണ്: ആശങ്കയുടെ ഭാരമില്ലാതെ ധൈര്യത്തോടെ ശ്രമിക്കൽ."
        mistakes: {"അത് ബുദ്ധിയില്ലാത്തതിനാൽ വഴിതെറ്റുന്നു": mal_imagery}

  - code: mal9.u6.manalkoonakal
    title: മണൽക്കൂനകൾക്കിടയിലൂടെ
    notes: |
      ബെന്യാമിന്റെ 'ആടുജീവിതം' എന്ന നോവലിൽനിന്നുള്ള ഭാഗം. നാട്ടിൽ മണൽവാരൽ തൊഴിലാളിയായിരുന്ന നജീബ്,
      ശശിയുടെ സഹായത്തോടെ, ഹക്കീമിനൊപ്പം ബോംബെ വഴി ഗൾഫിലേക്ക് പോകുന്നു. റിയാദിൽ വിമാനമിറങ്ങിയ അവരെ
      സ്വീകരിക്കാൻ ആരുമില്ല; അർബാബ് (തൊഴിലുടമ) ആണെന്ന് അവർ കരുതിയ ഒരാൾ അവരെ ഒരു പഴയ പിക്കപ്പ്
      വാനിന്റെ തുറന്ന പിൻഭാഗത്ത് കയറ്റി കൊണ്ടുപോകുന്നു. നജീബിന്റെ ബാഗിൽ ഉമ്മ ഉണ്ടാക്കിയ മീൻ അച്ചാറും
      ഭാര്യ സൈനു ഉണ്ടാക്കിയ നാരങ്ങ (ഓറഞ്ച്) അച്ചാറും. വിമാനത്തിൽനിന്ന് കിട്ടിയ അല്പം വെള്ളം മാത്രമായിരുന്നു
      ആഹാരം. ഹക്കീം ഉറങ്ങുന്നു; വണ്ടി മണൽക്കൂനകൾക്കിടയിലൂടെ മുന്നോട്ട്; നജീബിന്റെ മനസ്സിൽ ഭയം —
      "പടച്ചോനേ". സ്വപ്നങ്ങളുമായി വന്ന പ്രവാസിയുടെ ദുരിതജീവിതത്തിന്റെ തുടക്കം. ബന്ധപ്പെട്ടവ: സച്ചിദാനന്ദന്റെ
      'താജിൽ, വീണ്ടും'; പി. വത്സലയുടെ ഉദ്ധരണി. ഭാഷ: 'പച്ചവെള്ളം' പോലുള്ള 'പച്ച-' ചേർന്ന പ്രയോഗങ്ങൾ
      (പച്ചക്കള്ളം, പച്ചമനുഷ്യൻ).
    explanations:
      text: "ഗൾഫിൽ നല്ലൊരു ജോലിയും ജീവിതവും സ്വപ്നം കണ്ട് എത്തിയ നജീബിനെ ഒരു അപരിചിതൻ മരുഭൂമിയുടെ ഉള്ളിലേക്ക് കൊണ്ടുപോകുന്നു. ആ യാത്രയിൽ അവന്റെ മനസ്സിൽ നിറയുന്ന ഭയവും അനിശ്ചിതത്വവുമാണ് പാഠം."
      visual: "യാത്രയുടെ വര: നാട് (മണൽവാരൽ) → ബോംബെ → റിയാദ് വിമാനത്താവളം → പഴയ പിക്കപ്പിന്റെ പിൻഭാഗം → അറ്റമില്ലാത്ത മണൽക്കൂനകൾ."
      step_by_step: "നജീബിന്റെ മനസ്സ് പടിപടിയായി: 1. പ്രതീക്ഷ (വിമാനമിറങ്ങുമ്പോൾ). 2. ആശയക്കുഴപ്പം (ആരും സ്വീകരിക്കാനില്ല). 3. ആശ്വാസം (അർബാബ് എന്നു കരുതിയ ആൾ). 4. ഭയം (വണ്ടി മരുഭൂമിയിലേക്ക്). 5. പ്രാർഥന ('പടച്ചോനേ')."
      real_world: "വിദേശജോലിക്ക് പോകുന്നവർ ശരിയായ വിസയും തൊഴിൽകരാറും ഉറപ്പാക്കണം. നോർക്ക പോലുള്ള സർക്കാർ സംവിധാനങ്ങൾ പ്രവാസികളെ സഹായിക്കാനുള്ളതാണ്."
    items:
      - prompt: "'ആടുജീവിതം' എന്ന നോവൽ എഴുതിയതാര്?"
        options: ["ബെന്യാമിൻ", "എസ്. കെ. പൊറ്റെക്കാട്ട്", "തകഴി ശിവശങ്കരപ്പിള്ള", "സച്ചിദാനന്ദൻ"]
        answer: "ബെന്യാമിൻ"
        difficulty: 1
        hints: ["'മണൽക്കൂനകൾക്കിടയിലൂടെ' ഈ നോവലിൽനിന്നുള്ളതാണ്."]
        solution: "ബെന്യാമിൻ."
        mistakes: {"സച്ചിദാനന്ദൻ": mal_author_work}
      - prompt: "നാട്ടിൽ നജീബ് എന്തു ജോലിയാണ് ചെയ്തിരുന്നത്?"
        options: ["മണൽവാരൽ", "ആടുമേയ്ക്കൽ", "ഡ്രൈവിങ്", "കൃഷി"]
        answer: "മണൽവാരൽ"
        difficulty: 1
        hints: ["പുഴയുമായി ബന്ധപ്പെട്ട ജോലി."]
        solution: "നജീബ് മണൽവാരൽ തൊഴിലാളിയായിരുന്നു."
        mistakes: {"ആടുമേയ്ക്കൽ": mal_aadujeevitham}
      - prompt: "നജീബും ഹക്കീമും വിമാനമിറങ്ങിയ നഗരം ഏത്?"
        options: ["റിയാദ്", "ദുബായ്", "ബോംബെ", "മസ്കറ്റ്"]
        answer: "റിയാദ്"
        difficulty: 1
        hints: ["ബോംബെ വഴിയാണ് അവർ പോയത്."]
        solution: "റിയാദ്."
        mistakes: {"ബോംബെ": mal_read_again}
      - prompt: "അർബാബ് എന്നു കരുതിയ ആൾ അവരെ കൊണ്ടുപോയത് എങ്ങനെ?"
        options: ["ഒരു പഴയ പിക്കപ്പ് വാനിന്റെ തുറന്ന പിൻഭാഗത്ത്", "ഒരു പുതിയ കാറിൽ", "ഒട്ടകപ്പുറത്ത്", "ബസ്സിൽ"]
        answer: "ഒരു പഴയ പിക്കപ്പ് വാനിന്റെ തുറന്ന പിൻഭാഗത്ത്"
        difficulty: 2
        hints: ["മുന്നിൽ ഇരിക്കാൻ അയാൾ അനുവദിച്ചില്ല."]
        solution: "പഴയ പിക്കപ്പിന്റെ പിന്നിൽ."
        mistakes: {"ഒരു പുതിയ കാറിൽ": mal_aadujeevitham}
      - prompt: "നജീബിന്റെ ബാഗിലെ മീൻ അച്ചാർ ഉണ്ടാക്കിയത് ആര്?"
        options: ["ഉമ്മ", "സൈനു", "ഹക്കീമിന്റെ ഉമ്മ", "ശശി"]
        answer: "ഉമ്മ"
        difficulty: 2
        hints: ["സൈനു ഉണ്ടാക്കിയത് മറ്റൊരു അച്ചാറാണ്."]
        solution: "മീൻ അച്ചാർ ഉമ്മയും, നാരങ്ങ അച്ചാർ സൈനുവും."
        mistakes: {"സൈനു": mal_read_again}
      - prompt: "വണ്ടി മണൽക്കൂനകൾക്കിടയിലൂടെ നീങ്ങുമ്പോൾ നജീബിന്റെ മനസ്സിൽ പ്രധാനമായുണ്ടായ വികാരം?"
        options: ["ഭയവും ആശങ്കയും", "അമിതമായ സന്തോഷം", "ദേഷ്യം", "ഉറക്കം"]
        answer: "ഭയവും ആശങ്കയും"
        difficulty: 2
        hints: ["'പടച്ചോനേ' എന്ന വിളി."]
        solution: "എങ്ങോട്ടാണെന്നറിയാത്ത യാത്രയിൽ ഭയവും ആശങ്കയും; ഉറങ്ങിയത് ഹക്കീമാണ്."
        mistakes: {"ഉറക്കം": mal_aadujeevitham}
      - prompt: "'പച്ചവെള്ളം' എന്നതിലെ 'പച്ച' നിറത്തെയല്ല കുറിക്കുന്നത്. ഇതുപോലെ 'പച്ച' ചേർന്ന പ്രയോഗം ഏത്?"
        options: ["പച്ചക്കള്ളം", "പച്ചിലക്കൂട്", "പച്ചപ്പുൽമേട്", "പച്ചത്തത്ത"]
        answer: "പച്ചക്കള്ളം"
        difficulty: 3
        hints: ["ഇവിടെ 'പച്ച' എന്നാൽ ശുദ്ധമായ, ഒന്നും ചേർക്കാത്ത."]
        solution: "പച്ചക്കള്ളം = തനി കള്ളം. മറ്റുള്ളവയിൽ പച്ച നിറമാണ്."
        mistakes: {"പച്ചത്തത്ത": mal_word_meaning}

  - code: mal9.u6.chihnam
    title: "ഭാഷ: ചോദ്യചിഹ്നവും ആശ്ചര്യചിഹ്നവും"
    after: [mal9.u6.santiniketan]
    notes: |
      ചോദ്യവാക്യത്തിന്റെ ഒടുവിൽ ചോദ്യചിഹ്നം (?): "നിങ്ങൾ ശാന്തിനികേതനം കണ്ടിട്ടുണ്ടോ?"
      വികാരം (അത്ഭുതം, സന്തോഷം, ദുഃഖം, ഭയം) പ്രകടിപ്പിക്കുന്ന വാക്യത്തിന് ആശ്ചര്യചിഹ്നം (!):
      "എത്ര മനോഹരമായ സ്ഥലം!" ചോദ്യരൂപത്തിലുള്ള വാക്യം അത്ഭുതം പ്രകടിപ്പിക്കാനും ഉപയോഗിക്കാം;
      അപ്പോൾ അർഥം നോക്കി ചിഹ്നം തിരഞ്ഞെടുക്കണം.
    explanations:
      text: "ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാക്യത്തിന് ?; മനസ്സിലെ വികാരം പുറത്തുവരുന്ന വാക്യത്തിന് !."
      visual: "രണ്ടു പെട്ടികൾ: '?' — എന്ത്, ആര്, എവിടെ, എപ്പോൾ, -ഓ; '!' — എത്ര...!, ഹാ!, അയ്യോ!, കഷ്ടം!"
      step_by_step: "1. വാക്യം ഉത്തരം ചോദിക്കുന്നുണ്ടോ? ഉണ്ടെങ്കിൽ ?. 2. ഇല്ലെങ്കിൽ, അത് ഒരു വികാരം പ്രകടിപ്പിക്കുന്നുണ്ടോ? ഉണ്ടെങ്കിൽ !. 3. രണ്ടുമല്ലെങ്കിൽ പൂർണ്ണവിരാമം (.)."
      real_world: "സന്ദേശം അയയ്ക്കുമ്പോൾ ചിഹ്നം മാറിയാൽ അർഥം മാറും: 'നീ വരുന്നു.' / 'നീ വരുന്നോ?' / 'നീ വരുന്നു!'"
    items:
      - prompt: "'എത്ര ശാന്തമായ സ്ഥലം___' — ഒടുവിൽ ചേർക്കേണ്ട ചിഹ്നം?"
        options: ["!", "?", ".", ","]
        answer: "!"
        difficulty: 1
        hints: ["ഇത് അത്ഭുതം പ്രകടിപ്പിക്കുന്നു."]
        solution: "ആശ്ചര്യചിഹ്നം (!)."
        mistakes: {"?": mal_punctuation}
      - prompt: "'നിങ്ങൾ എപ്പോഴാണ് ബോൽപൂരിൽ എത്തിയത്___' — ഒടുവിൽ ചേർക്കേണ്ട ചിഹ്നം?"
        options: ["?", "!", ".", ";"]
        answer: "?"
        difficulty: 1
        hints: ["'എപ്പോൾ' എന്ന ചോദ്യവാക്ക്."]
        solution: "ചോദ്യചിഹ്നം (?)."
        mistakes: {"!": mal_punctuation}
      - prompt: "'അയ്യോ, വണ്ടി മരുഭൂമിയിലേക്കാണല്ലോ പോകുന്നത്___' — ഒടുവിൽ ചേർക്കേണ്ട ചിഹ്നം?"
        options: ["!", "?", ",", "-"]
        answer: "!"
        difficulty: 2
        hints: ["'അയ്യോ' ഭയം കാണിക്കുന്നു; ഉത്തരം ചോദിക്കുന്നില്ല."]
        solution: "ആശ്ചര്യചിഹ്നം (!)."
        mistakes: {"?": mal_punctuation}
      - prompt: "ചിഹ്നം ശരിയായി ഉപയോഗിച്ച വാക്യം ഏത്?"
        options: ["ശ്രീനികേതനം എവിടെയാണ്?", "ശ്രീനികേതനം എവിടെയാണ്!", "എത്ര മനോഹരമായ മാന്തോപ്പ്?", "ഹാ? എന്തൊരു കാഴ്ച."]
        answer: "ശ്രീനികേതനം എവിടെയാണ്?"
        difficulty: 2
        hints: ["'എവിടെ' ഉത്തരം ആവശ്യപ്പെടുന്നു."]
        solution: "'ശ്രീനികേതനം എവിടെയാണ്?' ശരി."
        mistakes: {"എത്ര മനോഹരമായ മാന്തോപ്പ്?": mal_punctuation}
      - prompt: "'നീ ഇത്രവേഗം എത്തിയോ' — ഇത് അത്ഭുതമായാണ് പറയുന്നതെങ്കിൽ, ഏറ്റവും ഉചിതമായ ചിഹ്നം?"
        options: ["!", ".", ",", ";"]
        answer: "!"
        difficulty: 3
        hints: ["ചോദ്യരൂപമാണെങ്കിലും ഇവിടെ ഉത്തരം ആവശ്യമില്ല; വികാരമാണ്."]
        solution: "അത്ഭുതം പ്രകടിപ്പിക്കുമ്പോൾ ആശ്ചര്യചിഹ്നം (!)."
        mistakes: {".": mal_punctuation}
