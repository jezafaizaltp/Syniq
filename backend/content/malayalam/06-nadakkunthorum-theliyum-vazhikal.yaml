subject: mal
chapter: 6
title: "അടിസ്ഥാനപാഠാവലി 1: നടക്കുന്തോറും തെളിയും വഴികൾ"

tips:
  mal_santiniketan: "'ശാന്തിനികേതനം' (എസ്. കെ. പൊറ്റെക്കാട്ട്, 'യാത്രാസ്മരണകൾ'): ബോൽപൂരിൽ ഇറങ്ങി നടന്നെത്തുന്ന ടാഗോറിന്റെ വിദ്യാലയം. ബനാറസ് ഹിന്ദു സർവ്വകലാശാലപോലെ വലിയ കെട്ടിടങ്ങളില്ല; ഓലമേഞ്ഞ കുടിലുകളും മാന്തോപ്പുകളും. കലാഭവനം (1922, നന്ദലാൽ ബോസ്), സംഗീതഭവനം, ഗ്രാമപുനർനിർമ്മാണകേന്ദ്രമായ ശ്രീനികേതനം."
  mal_thistle_seed: "'സ്മാരകം' (വീരാൻകുട്ടി): ചിറകില്ലാത്ത അപ്പൂപ്പൻതാടി വിത്തിനെ കുഞ്ഞിനെയെന്നപോലെ മടിയിലിരുത്തി പറക്കുന്നു. 'ധീരമെങ്കിലും എളിയ' ആ ശ്രമം വീഴുന്നിടത്ത് നാളെ ഒരു മരം സ്മാരകമായി ഉയരും."
  mal_aadujeevitham: "'മണൽക്കൂനകൾക്കിടയിലൂടെ' ബെന്യാമിന്റെ 'ആടുജീവിതം' എന്ന നോവലിൽനിന്ന്: മണൽവാരൽ തൊഴിലാളിയായിരുന്ന നജീബും ഹക്കീമും റിയാദിൽ വിമാനമിറങ്ങുന്നു; അർബാബ് എന്നു കരുതിയ ആൾ അവരെ പഴയ പിക്കപ്പിന്റെ പിന്നിൽ കയറ്റി മരുഭൂമിയിലൂടെ കൊണ്ടുപോകുന്നു."
  mal_punctuation: "ചിഹ്നം: ചോദ്യത്തിന്റെ ഒടുവിൽ ചോദ്യചിഹ്നം (?); അത്ഭുതം, സന്തോഷം, ദുഃഖം, ഭയം തുടങ്ങിയ വികാരം പ്രകടിപ്പിക്കുന്ന വാക്യത്തിന്റെ ഒടുവിൽ ആശ്ചര്യചിഹ്നം (!)."

concepts:
  - code: mal9.u6.santiniketan
    title: ശാന്തിനികേതനം
    notes: |
      എസ്. കെ. പൊറ്റെക്കാട്ടിന്റെ 'യാത്രാസ്മരണകൾ' എന്ന കൃതിയിൽനിന്നുള്ള യാത്രാവിവരണം. കൽക്കത്തയിൽനിന്ന്
      നൂറു നാഴിക അകലെയുള്ള ബോൽപൂർ സ്റ്റേഷനിൽ ഇറങ്ങി ഏതാണ്ട് മൂന്നു മൈൽ നടന്നാണ് ലേഖകൻ ശാന്തിനികേതനത്തിൽ
      എത്തുന്നത്. വഴിയിലെ ബംഗാളി ഗ്രാമങ്ങൾ കേരളത്തെ ഓർമ്മിപ്പിക്കുന്നു. ബനാറസ് ഹിന്ദു സർവ്വകലാശാലയിലേതുപോലെ
      ഗംഭീരമായ കെട്ടിടങ്ങൾ ഇവിടെ ഇല്ല; ഓലമേഞ്ഞ കുടിലുകളും മാന്തോപ്പുകളും വൃക്ഷച്ചുവട്ടിലെ പഠനവും.
      കലാഭവനം (1922-ൽ ആരംഭിച്ചു; നന്ദലാൽ ബോസ്), സംഗീതഭവനം, രണ്ടു നാഴിക പടിഞ്ഞാറ് 1922-ൽ സ്ഥാപിച്ച
      ഗ്രാമപുനർനിർമ്മാണകേന്ദ്രമായ ശ്രീനികേതനം. ടാഗോറിന്റെ ഗീതാഞ്ജലിയിലെ "Where the mind is without fear"
      എന്ന പ്രാർഥനയുടെ ചൈതന്യം അവിടെ അനുഭവപ്പെടുന്നു. ബന്ധപ്പെട്ട വായന: വി. മുസഫർ അഹമ്മദിന്റെ
      'മരുഭൂമിയുടെ ആത്മകഥ'. ഭാഷ: ചോദ്യചിഹ്നവും ആശ്ചര്യചിഹ്നവും.
    explanations:
      text: "പ്രകൃതിയോട് ചേർന്ന്, വലിയ കെട്ടിടങ്ങളില്ലാതെ, ഭയമില്ലാത്ത മനസ്സോടെ പഠിക്കാവുന്ന ഒരു വിദ്യാലയമാണ് ടാഗോറിന്റെ ശാന്തിനികേതനം. അത് പൊറ്റെക്കാട്ട് നേരിൽ കണ്ട അനുഭവമാണ് ഈ പാഠം."
      visual: "ഒരു വഴിഭൂപടം: കൽക്കത്ത → (100 നാഴിക) → ബോൽപൂർ സ്റ്റേഷൻ → (3 മൈൽ നടത്തം) → ശാന്തിനികേതനം (കലാഭവനം, സംഗീതഭവനം, മാന്തോപ്പുകൾ) → (2 നാഴിക പടിഞ്ഞാറ്) → ശ്രീനികേതനം."
      step_by_step: "യാത്രാവിവരണം വായിക്കുമ്പോൾ: 1. എവിടെനിന്ന് എവിടേക്ക്? 2. വഴിയിൽ കണ്ട കാഴ്ചകൾ. 3. സ്ഥലത്തിന്റെ പ്രത്യേകതകൾ. 4. എഴുത്തുകാരന്റെ സ്വന്തം അനുഭവവും അഭിപ്രായവും."
      real_world: "നമ്മുടെ സ്കൂളിലും മരത്തണലിൽ ഒരു ക്ലാസ് നടത്തിയാൽ എങ്ങനെയിരിക്കും? ശാന്തിനികേതനം കാണിക്കുന്നത് പഠനത്തിന് വലിയ കെട്ടിടമല്ല, നല്ല അന്തരീക്ഷമാണ് പ്രധാനം എന്നാണ്."
    items:
      - prompt: "'ശാന്തിനികേതനം' എന്ന യാത്രാവിവരണം എഴുതിയതാര്?"
        options: ["എസ്. കെ. പൊറ്റെക്കാട്ട്", "ബെന്യാമിൻ", "വി. മുസഫർ അഹമ്മദ്", "എം. ടി. വാസുദേവൻ നായർ"]
        answer: "എസ്. കെ. പൊറ്റെക്കാട്ട്"
        difficulty: 1
        hints: ["'യാത്രാസ്മരണകൾ' എന്ന കൃതി."]
        solution: "എസ്. കെ. പൊറ്റെക്കാട്ട്."
        mistakes: {"വി. മുസഫർ അഹമ്മദ്": mal_author_work}
      - prompt: "ശാന്തിനികേതനം സ്ഥാപിച്ച മഹാകവി ആര്?"
        options: ["രവീന്ദ്രനാഥ ടാഗോർ", "കുമാരനാശാൻ", "നന്ദലാൽ ബോസ്", "ഗാന്ധിജി"]
        answer: "രവീന്ദ്രനാഥ ടാഗോർ"
        difficulty: 1
        hints: ["ഗീതാഞ്ജലിയുടെ കവി."]
        solution: "രവീന്ദ്രനാഥ ടാഗോർ."
        mistakes: {"നന്ദലാൽ ബോസ്": mal_santiniketan}
      - prompt: "ശാന്തിനികേതനത്തിലേക്ക് പോകാൻ ലേഖകൻ ഇറങ്ങിയ റെയിൽവേ സ്റ്റേഷൻ ഏത്?"
        options: ["ബോൽപൂർ", "കൽക്കത്ത", "ബനാറസ്", "ശ്രീനികേതനം"]
        answer: "ബോൽപൂർ"
        difficulty: 1
        hints: ["കൽക്കത്തയിൽനിന്ന് നൂറു നാഴിക."]
        solution: "ബോൽപൂർ സ്റ്റേഷനിൽ ഇറങ്ങി നടന്നു."
        mistakes: {"കൽക്കത്ത": mal_read_again}
      - prompt: "ശാന്തിനികേതനത്തിലെ കെട്ടിടങ്ങളെക്കുറിച്ച് ലേഖകൻ പറയുന്നത് എന്ത്?"
        options: ["ബനാറസ് ഹിന്ദു സർവ്വകലാശാലയിലേതുപോലെ ഗംഭീരമായ കെട്ടിടങ്ങളില്ല; ഓലമേഞ്ഞ കുടിലുകളും മാന്തോപ്പുകളും", "വലിയ മാർബിൾ കൊട്ടാരങ്ങളാണ്", "എല്ലാം ആധുനിക കോൺക്രീറ്റ് കെട്ടിടങ്ങളാണ്", "കെട്ടിടങ്ങളൊന്നുമില്ല, മരുഭൂമിയാണ്"]
        answer: "ബനാറസ് ഹിന്ദു സർവ്വകലാശാലയിലേതുപോലെ ഗംഭീരമായ കെട്ടിടങ്ങളില്ല; ഓലമേഞ്ഞ കുടിലുകളും മാന്തോപ്പുകളും"
        difficulty: 2
        hints: ["ലാളിത്യമാണ് പ്രത്യേകത."]
        solution: "ലളിതമായ കുടിലുകളും മരത്തണലുമാണ് ശാന്തിനികേതനം."
        mistakes: {"വലിയ മാർബിൾ കൊട്ടാരങ്ങളാണ്": mal_santiniketan}
      - prompt: "കലാഭവനം ആരംഭിച്ച വർഷം ഏത്?"
        answer: "1922"
        check: "1922"
        difficulty: 2
        hints: ["ശ്രീനികേതനം സ്ഥാപിച്ചതും അതേ വർഷം."]
        solution: "1922."
        mistakes: {"1888": mal_read_again}
      - prompt: "ശ്രീനികേതനം എന്തിനുള്ള കേന്ദ്രമാണ്?"
        options: ["ഗ്രാമപുനർനിർമ്മാണം", "സംഗീതപഠനം", "ചിത്രകല", "സൈനികപരിശീലനം"]
        answer: "ഗ്രാമപുനർനിർമ്മാണം"
        difficulty: 2
        hints: ["ശാന്തിനികേതനത്തിൽനിന്ന് രണ്ടു നാഴിക പടിഞ്ഞാറ്."]
        solution: "ഗ്രാമങ്ങളെ മെച്ചപ്പെടുത്താനുള്ള ഗ്രാമപുനർനിർമ്മാണകേന്ദ്രം."
        mistakes: {"സംഗീതപഠനം": mal_santiniketan}
      - prompt: "ബോൽപൂരിൽനിന്നുള്ള വഴിയിലെ ബംഗാളി ഗ്രാമങ്ങൾ ലേഖകനെ എന്തിനെ ഓർമ്മിപ്പിക്കുന്നു?"
        options: ["കേരളത്തെ", "ഹിമാലയത്തെ", "മരുഭൂമിയെ", "ബോംബെ നഗരത്തെ"]
        answer: "കേരളത്തെ"
        difficulty: 3
        hints: ["പച്ചപ്പും വയലും തെങ്ങും."]
        solution: "ബംഗാളിലെ ഗ്രാമങ്ങൾക്ക് കേരളത്തോട് സാമ്യമുണ്ടെന്ന് ലേഖകൻ."
        mistakes: {"മരുഭൂമിയെ": mal_read_again}

  - code: mal9.u6.smarakam
    title: സ്മാരകം
    notes: |
      വീരാൻകുട്ടിയുടെ 'മിണ്ടാപ്രാണി' എന്ന സമാഹാരത്തിലെ കവിത. അപ്പൂപ്പൻതാടിയുടെ പറക്കൽ ഒരു എളിയ
      ശ്രമമാണ്. അതിന് ചിറകില്ല; വിത്തിനെ കുഞ്ഞിനെയെന്നപോലെ മടിയിലിരുത്തി "അറിവില്ലായ്മയുടെ
      ഭാരക്കുറവിൽ" അത് പറക്കുന്നു. "ധീരമെങ്കിലും എളിയ അതിന്റെ ശ്രമം" — അത് വീഴുന്നിടത്ത് നാളെ ഒരു
      മരം അതിന്റെ സ്മാരകമായി ഉയരും. ചെറിയ ജീവിതങ്ങളുടെ നിശ്ശബ്ദമായ സംഭാവനയാണ് ആശയം.
      ബന്ധപ്പെട്ടവ: സോക്രട്ടീസ് ("എനിക്ക് ഒന്നും അറിയില്ല എന്നതാണ് എന്റെ അറിവ്" എന്ന ചിന്ത);
      പി. പി. രാമചന്ദ്രന്റെ 'ലളിതം'.
    explanations:
      text: "ചിറകില്ലാത്ത, ഭാരമില്ലാത്ത ഒരു അപ്പൂപ്പൻതാടി ഒരു വിത്തിനെ ദൂരേക്ക് കൊണ്ടുപോകുന്നു. അതിന്റെ ഓർമ്മയ്ക്കായി ആരും കല്ലിൽ സ്മാരകം പണിയുന്നില്ല; അത് കൊണ്ടുപോയ വിത്ത് വളർന്നുണ്ടാകുന്ന മരമാണ് അതിന്റെ സ്മാരകം."
      visual: "മൂന്നു ചിത്രങ്ങൾ: കാറ്റിൽ പറക്കുന്ന അപ്പൂപ്പൻതാടി (മടിയിൽ വിത്ത്) → മണ്ണിൽ വീണ വിത്ത് → അവിടെ ഉയർന്നുനിൽക്കുന്ന വലിയ മരം."
      step_by_step: "കവിതയിലെ ആശയം: 1. അപ്പൂപ്പൻതാടി ചെറുതും ദുർബലവുമാണ്. 2. എങ്കിലും അത് ധൈര്യത്തോടെ പറക്കുന്നു. 3. വിത്തിനെ സുരക്ഷിതമായി എത്തിക്കുന്നു. 4. ഫലം: നാളെ ഒരു മരം. 5. അതിനാൽ ചെറിയ ശ്രമങ്ങൾക്കും വലിയ വിലയുണ്ട്."
      real_world: "ഒരു മരം നടുന്നതോ ഒരു കൂട്ടുകാരനെ പഠിക്കാൻ സഹായിക്കുന്നതോ ചെറിയ കാര്യമായി തോന്നാം. പക്ഷേ അതിന്റെ ഫലം നാളെ വലുതായി വളരും."
    items:
      - prompt: "'സ്മാരകം' എന്ന കവിത എഴുതിയതാര്?"
