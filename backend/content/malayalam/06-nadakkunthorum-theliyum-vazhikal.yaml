          - കാറ്റിൽ എവിടെയോ വീഴുന്നു
          - വിത്ത് മുളയ്ക്കുന്നു
          - 'നാളെ ഒരു മരം: സ്മാരകം'
          alt: അപ്പൂപ്പൻതാടിയുടെ പറക്കൽ ഒരു മരമായി മാറുന്ന ക്രമം.
        check:
          prompt: 'അപ്പൂപ്പൻതാടിയുടെ സ്മാരകമായി ഉയരുന്നത്:'
          options:
