          - ഒരു കല്ല്
          - ഒരു കൂട്
          answer: ഒരു മരം
          why: വീണിടത്ത് വിത്ത് മുളച്ച് മരമാകുന്നു.
      - teach: ചെറിയ ജീവിതങ്ങളും ആരുമറിയാതെ ലോകത്തിന് വലിയ സംഭാവന നൽകുന്നു എന്നതാണ് കവിതയുടെ ആശയം. 'എനിക്ക് ഒന്നും അറിയില്ല എന്നതാണ് എന്റെ അറിവ്' എന്ന സോക്രട്ടീസിന്റെ ചിന്തയും എളിമയെക്കുറിച്ചാണ്.
