  - code: mal9.u6.manalkoonakal
    title: മണൽക്കൂനകൾക്കിടയിലൂടെ
    notes: |
      ബെന്യാമിന്റെ 'ആടുജീവിതം' എന്ന നോവലിൽനിന്നുള്ള ഭാഗം. നാട്ടിൽ മണൽവാരൽ തൊഴിലാളിയായിരുന്ന നജീബ്,
      ശശിയുടെ സഹായത്തോടെ, ഹക്കീമിനൊപ്പം ബോംബെ വഴി ഗൾഫിലേക്ക് പോകുന്നു. റിയാദിൽ വിമാനമിറങ്ങിയ അവരെ
      സ്വീകരിക്കാൻ ആരുമില്ല; അർബാബ് (തൊഴിലുടമ) ആണെന്ന് അവർ കരുതിയ ഒരാൾ അവരെ ഒരു പഴയ പിക്കപ്പ്
      വാനിന്റെ തുറന്ന പിൻഭാഗത്ത് കയറ്റി കൊണ്ടുപോകുന്നു. നജീബിന്റെ ബാഗിൽ ഉമ്മ ഉണ്ടാക്കിയ മീൻ അച്ചാറും
      ഭാര്യ സൈനു ഉണ്ടാക്കിയ നാരങ്ങ (ഓറഞ്ച്) അച്ചാറും. വിമാനത്തിൽനിന്ന് കിട്ടിയ അല്പം വെള്ളം മാത്രമായിരുന്നു
      ആഹാരം. ഹക്കീം ഉറങ്ങുന്നു; വണ്ടി മണൽക്കൂനകൾക്കിടയിലൂടെ മുന്നോട്ട്; നജീബിന്റെ മനസ്സിൽ ഭയം —
      "പടച്ചോനേ". സ്വപ്നങ്ങളുമായി വന്ന പ്രവാസിയുടെ ദുരിതജീവിതത്തിന്റെ തുടക്കം. ബന്ധപ്പെട്ടവ: സച്ചിദാനന്ദന്റെ
      'താജിൽ, വീണ്ടും'; പി. വത്സലയുടെ ഉദ്ധരണി. ഭാഷ: 'പച്ചവെള്ളം' പോലുള്ള 'പച്ച-' ചേർന്ന പ്രയോഗങ്ങൾ
      (പച്ചക്കള്ളം, പച്ചമനുഷ്യൻ).
    explanations:
      text: "ഗൾഫിൽ നല്ലൊരു ജോലിയും ജീവിതവും സ്വപ്നം കണ്ട് എത്തിയ നജീബിനെ ഒരു അപരിചിതൻ മരുഭൂമിയുടെ ഉള്ളിലേക്ക് കൊണ്ടുപോകുന്നു. ആ യാത്രയിൽ അവന്റെ മനസ്സിൽ നിറയുന്ന ഭയവും അനിശ്ചിതത്വവുമാണ് പാഠം."
      visual: "യാത്രയുടെ വര: നാട് (മണൽവാരൽ) → ബോംബെ → റിയാദ് വിമാനത്താവളം → പഴയ പിക്കപ്പിന്റെ പിൻഭാഗം → അറ്റമില്ലാത്ത മണൽക്കൂനകൾ."
      step_by_step: "നജീബിന്റെ മനസ്സ് പടിപടിയായി: 1. പ്രതീക്ഷ (വിമാനമിറങ്ങുമ്പോൾ). 2. ആശയക്കുഴപ്പം (ആരും സ്വീകരിക്കാനില്ല). 3. ആശ്വാസം (അർബാബ് എന്നു കരുതിയ ആൾ). 4. ഭയം (വണ്ടി മരുഭൂമിയിലേക്ക്). 5. പ്രാർഥന ('പടച്ചോനേ')."
      real_world: "വിദേശജോലിക്ക് പോകുന്നവർ ശരിയായ വിസയും തൊഴിൽകരാറും ഉറപ്പാക്കണം. നോർക്ക പോലുള്ള സർക്കാർ സംവിധാനങ്ങൾ പ്രവാസികളെ സഹായിക്കാനുള്ളതാണ്."
    activity:
      type: order
      prompt: നജീബിന്റെ യാത്ര ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - നാട്ടിൽ മണൽവാരൽ തൊഴിലാളി
      - ശശിയുടെ സഹായത്തോടെ ബോംബെ വഴി ഗൾഫിലേക്ക്
      - റിയാദിൽ ഇറങ്ങുന്നു, സ്വീകരിക്കാൻ ആരുമില്ല
      - അർബാബ് എന്നു കരുതിയ ആൾ പിക്കപ്പിൽ കയറ്റുന്നു
      - മണൽക്കൂനകൾക്കിടയിലൂടെ, മനസ്സിൽ ഭയം
      reasons:
        ശശിയുടെ സഹായത്തോടെ ബോംബെ വഴി ഗൾഫിലേക്ക്: ഗൾഫ് യാത്രയ്ക്ക് മുമ്പ് നജീബ് നാട്ടിൽ മണൽവാരലായിരുന്നു.
        റിയാദിൽ ഇറങ്ങുന്നു, സ്വീകരിക്കാൻ ആരുമില്ല: ബോംബെ വഴിയുള്ള വിമാനയാത്രയ്ക്കുശേഷമാണ് റിയാദിലെത്തുന്നത്.
        അർബാബ് എന്നു കരുതിയ ആൾ പിക്കപ്പിൽ കയറ്റുന്നു: ആരും സ്വീകരിക്കാനില്ലാതിരുന്നപ്പോഴാണ് ഈ ആളെ അർബാബ് എന്നു കരുതിയത്.
        മണൽക്കൂനകൾക്കിടയിലൂടെ, മനസ്സിൽ ഭയം: പിക്കപ്പിൽ കയറിയശേഷമാണ് വണ്ടി മരുഭൂമിയിലൂടെ പോകുന്നത്.
    lesson:
      - teach: '''മണൽക്കൂനകൾക്കിടയിലൂടെ'' ബെന്യാമിന്റെ ''ആടുജീവിതം'' എന്ന നോവലിലെ ഭാഗം. നാട്ടിൽ മണൽവാരൽ തൊഴിലാളിയായ നജീബ്, ശശിയുടെ സഹായത്തോടെ, ഹക്കീമിനൊപ്പം ബോംബെ വഴി ഗൾഫിലേക്ക്. ബാഗിൽ ഉമ്മയുടെ മീൻ അച്ചാറും ഭാര്യ സൈനുവിന്റെ നാരങ്ങ അച്ചാറും.'
        check:
          prompt: 'നജീബിന്റെ ഭാര്യയുടെ പേര്:'
          options:
          - സൈനു
          - ഭാഗ്യലക്ഷ്മി
          - അയിഷു
          answer: സൈനു
          why: സൈനു ഉണ്ടാക്കിയ നാരങ്ങ അച്ചാർ ബാഗിലുണ്ട്.
      - teach: റിയാദിൽ വിമാനമിറങ്ങിയ അവരെ സ്വീകരിക്കാൻ ആരുമില്ല. അർബാബ് (തൊഴിലുടമ) എന്ന് അവർ കരുതിയ ഒരാൾ അവരെ ഒരു പഴയ പിക്കപ്പ് വാനിന്റെ തുറന്ന പിൻഭാഗത്ത് കയറ്റി. വിമാനത്തിൽനിന്ന് കിട്ടിയ അല്പം വെള്ളം മാത്രമായിരുന്നു ആഹാരം.
        picture:
          kind: flow
          steps:
