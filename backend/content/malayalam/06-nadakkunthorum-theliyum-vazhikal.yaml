      - teach: '''അറിവില്ലായ്മയുടെ ഭാരക്കുറവിൽ'' അത് പറക്കുന്നു: എവിടെ വീഴുമെന്ന ഭയമോ കണക്കുകൂട്ടലോ അതിനു ഭാരമല്ല. ''ധീരമെങ്കിലും എളിയ'' ശ്രമം. അത് വീഴുന്നിടത്ത് നാളെ ഒരു മരം ഉയരും — അതാണ് അതിന്റെ സ്മാരകം.'
        picture:
