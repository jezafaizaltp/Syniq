        difficulty: 1
        hints:
        - വണ്ടിയിൽ ഉറങ്ങിപ്പോയയാൾ.
        - നജീബിനെക്കാൾ പ്രായം കുറഞ്ഞ ഒരാൾ.
        solution: ഹക്കീമിനൊപ്പമാണ് നജീബ് യാത്ര ചെയ്തത്.
        mistakes:
          ശശി: m6_naj_detail
      - prompt: നജീബും ഹക്കീമും ഏതു നഗരം വഴിയാണ് ഗൾഫിലേക്ക് പോയത്?
        options:
        - ബോംബെ
        - കൽക്കത്ത
        - ദില്ലി
        - മദ്രാസ്
        answer: ബോംബെ
        difficulty: 1
        hints:
        - ഇന്ത്യയുടെ പടിഞ്ഞാറൻ തീരത്തെ വലിയ നഗരം.
        - ഇന്ന് മുംബൈ എന്നു വിളിക്കുന്നു.
        solution: ബോംബെ വഴിയായിരുന്നു യാത്ര.
        mistakes:
          കൽക്കത്ത: m6_naj_detail
      - prompt: 'സൈനു ഉണ്ടാക്കി കൊടുത്തയച്ച അച്ചാർ:'
        options:
        - നാരങ്ങ അച്ചാർ
        - മീൻ അച്ചാർ
        - മാങ്ങ അച്ചാർ
        - നെല്ലിക്ക അച്ചാർ
        answer: നാരങ്ങ അച്ചാർ
        difficulty: 2
        hints:
        - മീൻ അച്ചാർ ഉമ്മയുടേതാണ്.
        - പുളിയുള്ള ഒരു പഴം.
        solution: ഉമ്മ മീൻ അച്ചാർ; സൈനു നാരങ്ങ അച്ചാർ.
        mistakes:
          മീൻ അച്ചാർ: m6_naj_detail
      - prompt: 'റിയാദിലെത്തിയശേഷം അവർക്ക് ആകെ കിട്ടിയ ആഹാരം:'
        options:
        - വിമാനത്തിൽനിന്ന് കിട്ടിയ അല്പം വെള്ളം
        - നല്ലൊരു ഊണ്
        - ഈന്തപ്പഴം
        - ചായയും പലഹാരവും
        answer: വിമാനത്തിൽനിന്ന് കിട്ടിയ അല്പം വെള്ളം
        difficulty: 2
        hints:
        - അവരെ സ്വീകരിക്കാൻ ആരുമുണ്ടായിരുന്നില്ല.
        - വിശപ്പ് മാറാത്ത അവസ്ഥ.
        solution: വിമാനത്തിൽനിന്ന് കിട്ടിയ അല്പം വെള്ളം മാത്രമായിരുന്നു ആഹാരം.
        mistakes:
          നല്ലൊരു ഊണ്: m6_naj_feeling
      - prompt: 'വിമാനത്താവളത്തിൽ ആരും സ്വീകരിക്കാൻ വരാതിരുന്നപ്പോൾ നജീബിന് ആദ്യം തോന്നിയിരിക്കാവുന്നത്:'
        options:
        - ആശങ്കയും ഒറ്റപ്പെടലും
        - അഭിമാനം
        - ആശ്വാസം
        - ദേഷ്യം മാത്രം
        answer: ആശങ്കയും ഒറ്റപ്പെടലും
        difficulty: 3
        hints:
        - പുതിയ നാട്, അറിയാത്ത ഭാഷ, ആരുമില്ല.
        - പിന്നീട് 'പടച്ചോനേ' എന്ന വിളിയിൽ അത് വളരുന്നു.
        solution: അപരിചിതമായ നാട്ടിൽ ആരുമില്ലാത്ത അവസ്ഥ ആശങ്കയും ഒറ്റപ്പെടലും ഉണ്ടാക്കുന്നു.
        mistakes:
          ആശ്വാസം: m6_naj_feeling

  - code: mal9.u6.chihnam
    title: "ഭാഷ: ചോദ്യചിഹ്നവും ആശ്ചര്യചിഹ്നവും"
    after: [mal9.u6.santiniketan]
    notes: |
      ചോദ്യവാക്യത്തിന്റെ ഒടുവിൽ ചോദ്യചിഹ്നം (?): "നിങ്ങൾ ശാന്തിനികേതനം കണ്ടിട്ടുണ്ടോ?"
      വികാരം (അത്ഭുതം, സന്തോഷം, ദുഃഖം, ഭയം) പ്രകടിപ്പിക്കുന്ന വാക്യത്തിന് ആശ്ചര്യചിഹ്നം (!):
      "എത്ര മനോഹരമായ സ്ഥലം!" ചോദ്യരൂപത്തിലുള്ള വാക്യം അത്ഭുതം പ്രകടിപ്പിക്കാനും ഉപയോഗിക്കാം;
      അപ്പോൾ അർഥം നോക്കി ചിഹ്നം തിരഞ്ഞെടുക്കണം.
    explanations:
      text: "ഉത്തരം പ്രതീക്ഷിക്കുന്ന വാക്യത്തിന് ?; മനസ്സിലെ വികാരം പുറത്തുവരുന്ന വാക്യത്തിന് !."
      visual: "രണ്ടു പെട്ടികൾ: '?' — എന്ത്, ആര്, എവിടെ, എപ്പോൾ, -ഓ; '!' — എത്ര...!, ഹാ!, അയ്യോ!, കഷ്ടം!"
      step_by_step: "1. വാക്യം ഉത്തരം ചോദിക്കുന്നുണ്ടോ? ഉണ്ടെങ്കിൽ ?. 2. ഇല്ലെങ്കിൽ, അത് ഒരു വികാരം പ്രകടിപ്പിക്കുന്നുണ്ടോ? ഉണ്ടെങ്കിൽ !. 3. രണ്ടുമല്ലെങ്കിൽ പൂർണ്ണവിരാമം (.)."
      real_world: "സന്ദേശം അയയ്ക്കുമ്പോൾ ചിഹ്നം മാറിയാൽ അർഥം മാറും: 'നീ വരുന്നു.' / 'നീ വരുന്നോ?' / 'നീ വരുന്നു!'"
    activity:
      type: sort
      prompt: ഓരോ വാക്യത്തിന്റെയും ഒടുവിൽ ഏതു ചിഹ്നം വേണം? അർഥം നോക്കൂ.
      bins:
      - ചോദ്യചിഹ്നം (?)
      - ആശ്ചര്യചിഹ്നം (!)
      items:
      - label: നിങ്ങൾ ശാന്തിനികേതനം കണ്ടിട്ടുണ്ടോ
        bin: ചോദ്യചിഹ്നം (?)
        clue: ഇതിന് ഒരു മറുപടി പ്രതീക്ഷിക്കുന്നുണ്ടോ?
        why: വിവരം അറിയാനുള്ള ചോദ്യം.
      - label: വണ്ടി എപ്പോൾ പുറപ്പെടും
        bin: ചോദ്യചിഹ്നം (?)
        clue: '''എപ്പോൾ'' എന്ന ചോദ്യവാക്ക് കാണുന്നുണ്ടോ?'
        why: സമയം അറിയാനുള്ള ചോദ്യം.
      - label: എത്ര മനോഹരമായ സ്ഥലം
        bin: ആശ്ചര്യചിഹ്നം (!)
        clue: '''എത്ര'' ഉണ്ട്, പക്ഷേ ഇവിടെ എണ്ണം ചോദിക്കുന്നുണ്ടോ?'
        why: എണ്ണം ചോദിക്കുന്നില്ല; അത്ഭുതം പ്രകടിപ്പിക്കുന്നു.
      - label: അയ്യോ, കാലു മുറിഞ്ഞു
        bin: ആശ്ചര്യചിഹ്നം (!)
        clue: '''അയ്യോ'' ഏതു വികാരം കാണിക്കുന്നു?'
        why: 'വേദന/ഭയം: വികാരം, ആശ്ചര്യചിഹ്നം.'
      - label: ഹാ, എന്തൊരു തണുപ്പ്
        bin: ആശ്ചര്യചിഹ്നം (!)
        clue: '''എന്തൊരു'' ഇവിടെ ചോദ്യമാണോ?'
        why: അത്ഭുതം പ്രകടിപ്പിക്കുന്നു.
      - label: നീ എന്തിനാണ് കരയുന്നത്
        bin: ചോദ്യചിഹ്നം (?)
        clue: കാരണം അറിയാൻ ചോദിക്കുകയാണോ?
        why: കാരണം അറിയാനുള്ള ചോദ്യം.
    lesson:
      - teach: 'ചോദ്യം ചോദിക്കുന്ന വാക്യത്തിന്റെ ഒടുവിൽ ചോദ്യചിഹ്നം (?) ഇടുന്നു: ''നിങ്ങൾ ശാന്തിനികേതനം കണ്ടിട്ടുണ്ടോ?'' ഇവിടെ കേൾക്കുന്നയാളിൽനിന്ന് ഒരു മറുപടി പ്രതീക്ഷിക്കുന്നു.'
        check:
          prompt: '''നീ എപ്പോൾ വരും'' — ഒടുവിൽ ചേർക്കേണ്ടത്:'
          options:
          - '?'
          - '!'
          - .
          answer: '?'
          why: മറുപടി പ്രതീക്ഷിക്കുന്ന ചോദ്യം.
      - teach: 'അത്ഭുതം, സന്തോഷം, ദുഃഖം, ഭയം തുടങ്ങിയ വികാരങ്ങൾ പുറത്തുവരുന്ന വാക്യത്തിന്റെ ഒടുവിൽ ആശ്ചര്യചിഹ്നം (!): ''എത്ര മനോഹരമായ സ്ഥലം!'' ''അയ്യോ'', ''ഹാ'', ''എത്ര'', ''എന്തൊരു'' പോലുള്ള വാക്കുകൾ പലപ്പോഴും സൂചന തരും.'
        picture:
          kind: compare
          columns:
          - title: ചോദ്യചിഹ്നം ?
            points:
            - മറുപടി വേണം
            - എവിടെ? എപ്പോൾ? ആര്?
          - title: ആശ്ചര്യചിഹ്നം !
            points:
            - വികാരം പുറത്തുവരുന്നു
            - അയ്യോ! എത്ര! എന്തൊരു!
          alt: ചോദ്യചിഹ്നവും ആശ്ചര്യചിഹ്നവും തമ്മിലുള്ള വ്യത്യാസം.
        check:
          prompt: '''എന്തൊരു ചൂട്'' — ഒടുവിൽ ചേർക്കേണ്ടത്:'
          options:
          - '!'
          - '?'
          - ','
          answer: '!'
          why: ചൂടിനെക്കുറിച്ചുള്ള വികാരം പുറത്തുവരുന്നു.
      - teach: 'ചിലപ്പോൾ ചോദ്യരൂപത്തിലുള്ള വാക്യം മറുപടി പ്രതീക്ഷിക്കാതെ അത്ഭുതം പ്രകടിപ്പിക്കാൻ പറയും: ''നീ ഇത്രവേഗം എത്തിയോ!'' അപ്പോൾ വാക്കുകളുടെ രൂപം നോക്കിയല്ല, പറയുന്നയാളുടെ ഉദ്ദേശ്യം നോക്കിയാണ് ചിഹ്നം തീരുമാനിക്കേണ്ടത്.'
        check:
          prompt: 'ചിഹ്നം തീരുമാനിക്കുമ്പോൾ ഏറ്റവും പ്രധാനം:'
          options:
          - പറയുന്നയാളുടെ ഉദ്ദേശ്യം
          - വാക്യത്തിന്റെ നീളം
          - ആദ്യത്തെ വാക്ക്
          answer: പറയുന്നയാളുടെ ഉദ്ദേശ്യം
          why: മറുപടി വേണോ, വികാരമാണോ എന്നതാണ് പ്രധാനം.
    items:
      - prompt: "'എത്ര ശാന്തമായ സ്ഥലം___' — ഒടുവിൽ ചേർക്കേണ്ട ചിഹ്നം?"
        options: ["!", "?", ".", ","]
        answer: "!"
        difficulty: 1
        hints: ["ഇത് അത്ഭുതം പ്രകടിപ്പിക്കുന്നു."]
        solution: "ആശ്ചര്യചിഹ്നം (!)."
        mistakes: {"?": mal_punctuation}
      - prompt: "'നിങ്ങൾ എപ്പോഴാണ് ബോൽപൂരിൽ എത്തിയത്___' — ഒടുവിൽ ചേർക്കേണ്ട ചിഹ്നം?"
        options: ["?", "!", ".", ";"]
        answer: "?"
        difficulty: 1
        hints: ["'എപ്പോൾ' എന്ന ചോദ്യവാക്ക്."]
        solution: "ചോദ്യചിഹ്നം (?)."
        mistakes: {"!": mal_punctuation}
      - prompt: "'അയ്യോ, വണ്ടി മരുഭൂമിയിലേക്കാണല്ലോ പോകുന്നത്___' — ഒടുവിൽ ചേർക്കേണ്ട ചിഹ്നം?"
        options: ["!", "?", ",", "-"]
        answer: "!"
        difficulty: 2
        hints: ["'അയ്യോ' ഭയം കാണിക്കുന്നു; ഉത്തരം ചോദിക്കുന്നില്ല."]
        solution: "ആശ്ചര്യചിഹ്നം (!)."
        mistakes: {"?": mal_punctuation}
      - prompt: "ചിഹ്നം ശരിയായി ഉപയോഗിച്ച വാക്യം ഏത്?"
        options: ["ശ്രീനികേതനം എവിടെയാണ്?", "ശ്രീനികേതനം എവിടെയാണ്!", "എത്ര മനോഹരമായ മാന്തോപ്പ്?", "ഹാ? എന്തൊരു കാഴ്ച."]
        answer: "ശ്രീനികേതനം എവിടെയാണ്?"
        difficulty: 2
        hints: ["'എവിടെ' ഉത്തരം ആവശ്യപ്പെടുന്നു."]
        solution: "'ശ്രീനികേതനം എവിടെയാണ്?' ശരി."
        mistakes: {"എത്ര മനോഹരമായ മാന്തോപ്പ്?": mal_punctuation}
      - prompt: "'നീ ഇത്രവേഗം എത്തിയോ' — ഇത് അത്ഭുതമായാണ് പറയുന്നതെങ്കിൽ, ഏറ്റവും ഉചിതമായ ചിഹ്നം?"
        options: ["!", ".", ",", ";"]
        answer: "!"
        difficulty: 3
        hints: ["ചോദ്യരൂപമാണെങ്കിലും ഇവിടെ ഉത്തരം ആവശ്യമില്ല; വികാരമാണ്."]
