subject: mal
chapter: 6
title: "അടിസ്ഥാനപാഠാവലി 1: നടക്കുന്തോറും തെളിയും വഴികൾ"

tips:
  mal_santiniketan: "'ശാന്തിനികേതനം' (എസ്. കെ. പൊറ്റെക്കാട്ട്, 'യാത്രാസ്മരണകൾ'): ബോൽപൂരിൽ ഇറങ്ങി നടന്നെത്തുന്ന ടാഗോറിന്റെ വിദ്യാലയം. ബനാറസ് ഹിന്ദു സർവ്വകലാശാലപോലെ വലിയ കെട്ടിടങ്ങളില്ല; ഓലമേഞ്ഞ കുടിലുകളും മാന്തോപ്പുകളും. കലാഭവനം (1919, നന്ദലാൽ ബോസ്), സംഗീതഭവനം, ഗ്രാമപുനർനിർമ്മാണകേന്ദ്രമായ ശ്രീനികേതനം."
  mal_thistle_seed: "കവിതയിൽ പറക്കുന്നത് കാറ്റിൽ ഒഴുകിനടക്കുന്ന പഞ്ഞിപോലുള്ള ഒരു സസ്യഭാഗമാണ്; അത് ഒരു വിത്തിനെ ചുമക്കുന്നു. ആ വിത്ത് വീഴുന്നിടത്ത് നാളെ എന്തു വളരും?"
  mal_aadujeevitham: "നജീബ് നാട്ടിൽ പുഴയുമായി ബന്ധപ്പെട്ട ഒരു ജോലിയാണ് ചെയ്തിരുന്നത്. അർബാബ് അവരെ കൊണ്ടുപോയ വണ്ടി എങ്ങനെയുള്ളതായിരുന്നു? മരുഭൂമിയിലെ യാത്രയിൽ അവരുടെ മനസ്സിൽ എന്തായിരുന്നു?"
  mal_punctuation: "ചിഹ്നം: ചോദ്യത്തിന്റെ ഒടുവിൽ ചോദ്യചിഹ്നം (?); അത്ഭുതം, സന്തോഷം, ദുഃഖം, ഭയം തുടങ്ങിയ വികാരം പ്രകടിപ്പിക്കുന്ന വാക്യത്തിന്റെ ഒടുവിൽ ആശ്ചര്യചിഹ്നം (!)."
  m6_which_book: "ഗീതാഞ്ജലി ടാഗോറിന്റെ കൃതിയാണ്. ഈ പാഠം എഴുതിയത് ടാഗോറല്ല, ശാന്തിനികേതനം കാണാൻ പോയ ഒരു മലയാളി സഞ്ചാരിയാണ്."
  m6_santi_place: 'ശാന്തിനികേതനത്തിലെ ഓരോ ഭാഗവും വേർതിരിച്ച് ഓർക്കൂ: ചിത്രകലയ്ക്ക് ഒന്ന്, സംഗീതത്തിന് ഒന്ന്, ഗ്രാമങ്ങൾക്കുവേണ്ടി ഒന്ന്. ചോദ്യം ഏതിനെക്കുറിച്ചാണ്?'
  m6_santi_way: 'യാത്രയുടെ വിവരങ്ങൾ പാഠത്തിന്റെ തുടക്കത്തിലുണ്ട്: എവിടെനിന്ന്, എത്ര ദൂരം, ഏതു സ്റ്റേഷൻ, എങ്ങനെ. ഒന്നുകൂടി വായിക്കൂ.'
  m6_seed_image: 'കവിതയിൽ അപ്പൂപ്പൻതാടി ഒരു ചെറിയ, എളിയ ജീവിയാണ്. ഈ വരി അതിന്റെ ഏതു ഗുണത്തെയാണ് കാണിക്കുന്നത്: ലാളിത്യം, ധൈര്യം, കരുതൽ?'
  m6_naj_detail: 'നജീബിന്റെ യാത്രയിലെ വിവരങ്ങൾ ക്രമത്തിൽ ഓർക്കൂ: ആരുടെ സഹായം, ആരുടെ കൂടെ, ഏതു വഴി, എവിടെ ഇറങ്ങി, എന്തിൽ കയറി.'
  m6_naj_feeling: സ്വപ്നങ്ങളുമായി വന്ന നജീബിനെ ആരും സ്വീകരിക്കാനില്ല, വണ്ടി മരുഭൂമിയിലേക്ക്. ആ നിമിഷം അയാളുടെ മനസ്സ് എങ്ങനെയായിരിക്കും?
  m6_mark_meaning: വാക്യം ഉറക്കെ വായിച്ചുനോക്കൂ. മറുപടി പ്രതീക്ഷിക്കുന്ന ചോദ്യമാണോ, അതോ ഒരു വികാരം പുറത്തുവരികയാണോ?

concepts:
  - code: mal9.u6.santiniketan
    title: ശാന്തിനികേതനം
    notes: |
      എസ്. കെ. പൊറ്റെക്കാട്ടിന്റെ 'യാത്രാസ്മരണകൾ' എന്ന കൃതിയിൽനിന്നുള്ള യാത്രാവിവരണം. കൽക്കത്തയിൽനിന്ന്
      നൂറു നാഴിക അകലെയുള്ള ബോൽപൂർ സ്റ്റേഷനിൽ ഇറങ്ങി ഏതാണ്ട് മൂന്നു മൈൽ നടന്നാണ് ലേഖകൻ ശാന്തിനികേതനത്തിൽ
      എത്തുന്നത്. വഴിയിലെ ബംഗാളി ഗ്രാമങ്ങൾ കേരളത്തെ ഓർമ്മിപ്പിക്കുന്നു. ബനാറസ് ഹിന്ദു സർവ്വകലാശാലയിലേതുപോലെ
      ഗംഭീരമായ കെട്ടിടങ്ങൾ ഇവിടെ ഇല്ല; ഓലമേഞ്ഞ കുടിലുകളും മാന്തോപ്പുകളും വൃക്ഷച്ചുവട്ടിലെ പഠനവും.
      കലാഭവനം (1919-ൽ ആരംഭിച്ചു; നന്ദലാൽ ബോസ്), സംഗീതഭവനം, രണ്ടു നാഴിക പടിഞ്ഞാറ് 1922-ൽ സ്ഥാപിച്ച
      ഗ്രാമപുനർനിർമ്മാണകേന്ദ്രമായ ശ്രീനികേതനം. ടാഗോറിന്റെ ഗീതാഞ്ജലിയിലെ "Where the mind is without fear"
      എന്ന പ്രാർഥനയുടെ ചൈതന്യം അവിടെ അനുഭവപ്പെടുന്നു. ബന്ധപ്പെട്ട വായന: വി. മുസഫർ അഹമ്മദിന്റെ
      'മരുഭൂമിയുടെ ആത്മകഥ'. ഭാഷ: ചോദ്യചിഹ്നവും ആശ്ചര്യചിഹ്നവും.
    explanations:
      text: "പ്രകൃതിയോട് ചേർന്ന്, വലിയ കെട്ടിടങ്ങളില്ലാതെ, ഭയമില്ലാത്ത മനസ്സോടെ പഠിക്കാവുന്ന ഒരു വിദ്യാലയമാണ് ടാഗോറിന്റെ ശാന്തിനികേതനം. അത് പൊറ്റെക്കാട്ട് നേരിൽ കണ്ട അനുഭവമാണ് ഈ പാഠം."
      visual: "ഒരു വഴിഭൂപടം: കൽക്കത്ത → (100 നാഴിക) → ബോൽപൂർ സ്റ്റേഷൻ → (3 മൈൽ നടത്തം) → ശാന്തിനികേതനം (കലാഭവനം, സംഗീതഭവനം, മാന്തോപ്പുകൾ) → (2 നാഴിക പടിഞ്ഞാറ്) → ശ്രീനികേതനം."
      step_by_step: "യാത്രാവിവരണം വായിക്കുമ്പോൾ: 1. എവിടെനിന്ന് എവിടേക്ക്? 2. വഴിയിൽ കണ്ട കാഴ്ചകൾ. 3. സ്ഥലത്തിന്റെ പ്രത്യേകതകൾ. 4. എഴുത്തുകാരന്റെ സ്വന്തം അനുഭവവും അഭിപ്രായവും."
      real_world: "നമ്മുടെ സ്കൂളിലും മരത്തണലിൽ ഒരു ക്ലാസ് നടത്തിയാൽ എങ്ങനെയിരിക്കും? ശാന്തിനികേതനം കാണിക്കുന്നത് പഠനത്തിന് വലിയ കെട്ടിടമല്ല, നല്ല അന്തരീക്ഷമാണ് പ്രധാനം എന്നാണ്."
    activity:
      type: order
      prompt: ലേഖകന്റെ ശാന്തിനികേതനയാത്ര ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - കൽക്കത്തയിൽനിന്ന് നൂറു നാഴിക യാത്ര
      - ബോൽപൂർ സ്റ്റേഷനിൽ ഇറങ്ങുന്നു
      - മൂന്നു മൈൽ നടത്തം, ബംഗാളി ഗ്രാമങ്ങൾ
      - ശാന്തിനികേതനത്തിൽ, മരച്ചുവട്ടിലെ പഠനം കാണുന്നു
      reasons:
        ബോൽപൂർ സ്റ്റേഷനിൽ ഇറങ്ങുന്നു: 'ബോൽപൂർ കൽക്കത്തയിൽനിന്ന് നൂറു നാഴിക അകലെ: ആദ്യം അവിടെയെത്തണം.'
        മൂന്നു മൈൽ നടത്തം, ബംഗാളി ഗ്രാമങ്ങൾ: സ്റ്റേഷനിൽനിന്നാണ് നടന്നു തുടങ്ങുന്നത്.
        ശാന്തിനികേതനത്തിൽ, മരച്ചുവട്ടിലെ പഠനം കാണുന്നു: നടന്നാണ് അവിടെ എത്തിയത്; ഗ്രാമങ്ങൾ വഴിയിലാണ്.
    lesson:
      - teach: '''ശാന്തിനികേതനം'' എസ്. കെ. പൊറ്റെക്കാട്ടിന്റെ ''യാത്രാസ്മരണകൾ'' എന്ന കൃതിയിലെ യാത്രാവിവരണമാണ്. കൽക്കത്തയിൽനിന്ന് നൂറു നാഴിക അകലെയുള്ള ബോൽപൂർ സ്റ്റേഷനിൽ ഇറങ്ങി ഏകദേശം മൂന്നു മൈൽ നടന്നാണ് ലേഖകൻ രവീന്ദ്രനാഥ ടാഗോർ സ്ഥാപിച്ച ശാന്തിനികേതനത്തിൽ എത്തുന്നത്. വഴിയിലെ ബംഗാളി ഗ്രാമങ്ങൾ കേരളത്തെ ഓർമ്മിപ്പിക്കുന്നു.'
        check:
          prompt: '''ശാന്തിനികേതനം'' ഏതുതരം രചനയാണ്?'
          options:
          - യാത്രാവിവരണം
          - കവിത
          - നോവൽഭാഗം
          answer: യാത്രാവിവരണം
          why: പൊറ്റെക്കാട്ടിന്റെ 'യാത്രാസ്മരണകളി'ൽനിന്ന്.
      - teach: ഇവിടെ ബനാറസ് ഹിന്ദു സർവ്വകലാശാലയിലേതുപോലെ ഗംഭീരമായ കെട്ടിടങ്ങളില്ല; ഓലമേഞ്ഞ കുടിലുകൾ, മാന്തോപ്പുകൾ, മരച്ചുവട്ടിലെ ക്ലാസുകൾ. കലാഭവനം (ചിത്രകല; 1919; നന്ദലാൽ ബോസ്), സംഗീതഭവനം, പിന്നെ രണ്ടു നാഴിക പടിഞ്ഞാറ് 1922-ൽ സ്ഥാപിച്ച ഗ്രാമപുനർനിർമ്മാണകേന്ദ്രമായ ശ്രീനികേതനം.
        picture:
          kind: compare
          columns:
          - title: കലാഭവനം
            points:
            - ചിത്രകല
            - '1919'
            - നന്ദലാൽ ബോസ്
          - title: സംഗീതഭവനം
            points:
            - സംഗീതം
          - title: ശ്രീനികേതനം
            points:
            - ഗ്രാമപുനർനിർമ്മാണം
            - '1922'
            - രണ്ടു നാഴിക പടിഞ്ഞാറ്
          alt: ശാന്തിനികേതനത്തിലെ മൂന്നു കേന്ദ്രങ്ങളും അവയുടെ വിവരങ്ങളും.
        check:
          prompt: 'കലാഭവനവുമായി ബന്ധപ്പെട്ട ചിത്രകാരൻ:'
          options:
          - നന്ദലാൽ ബോസ്
          - നജീബ്
          - വീരാൻകുട്ടി
          answer: നന്ദലാൽ ബോസ്
          why: 1919-ൽ ആരംഭിച്ച കലാഭവനം; നന്ദലാൽ ബോസ്.
      - teach: ടാഗോറിന്റെ ഗീതാഞ്ജലിയിലെ 'Where the mind is without fear' (മനസ്സ് ഭയരഹിതമായിരിക്കുന്നിടത്ത്) എന്ന പ്രാർഥനയുടെ ചൈതന്യം ശാന്തിനികേതനത്തിൽ അനുഭവപ്പെടുന്നു എന്ന് ലേഖകൻ. പ്രകൃതിയോടിണങ്ങി, ഭയമില്ലാതെ, സ്വതന്ത്രമായി പഠിക്കുക — അതാണ് അവിടത്തെ ആശയം.
        check:
          prompt: '''Where the mind is without fear'' ഏതു കൃതിയിലേതാണ്?'
          options:
          - ഗീതാഞ്ജലി
          - യാത്രാസ്മരണകൾ
