        hints: ["'മിണ്ടാപ്രാണി' എന്ന സമാഹാരം."]
        solution: "വീരാൻകുട്ടി."
        mistakes: {"പി. പി. രാമചന്ദ്രൻ": mal_author_work}
      - prompt: "കവിതയിൽ പറക്കുന്നത് എന്താണ്?"
        options: ["അപ്പൂപ്പൻതാടി", "പൂമ്പാറ്റ", "കിളി", "പട്ടം"]
        answer: "അപ്പൂപ്പൻതാടി"
