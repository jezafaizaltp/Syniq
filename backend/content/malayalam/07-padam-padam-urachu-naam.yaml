        - ഭയം
        - ദേഷ്യം
        answer: അധ്വാനശീലം
        difficulty: 2
        hints:
        - എപ്പോഴും എന്തെങ്കിലും ചെയ്തുകൊണ്ടിരിക്കുന്നു.
        - '''നിങ്ങളും നിങ്ങളുടെ ജോലിയും'' എന്ന പാഠം ഓർക്കൂ.'
        solution: വിശ്രമമില്ലാതെ പണിയെടുക്കുന്ന അധ്വാനശീലം.
        mistakes:
          മടി: m7_ant_value
      - prompt: '''ലോലം'' എന്ന പദത്തിന്റെ അർഥം:'
        options:
        - മൃദുവായ, നേർത്ത
        - കടുപ്പമുള്ള
        - വലിയ
        - കറുത്ത
        answer: മൃദുവായ, നേർത്ത
        difficulty: 2
        hints:
        - ഉറുമ്പിന്റെ ശരീരത്തെക്കുറിച്ച് പറയുന്നത്.
        - എളുപ്പം ചതഞ്ഞുപോകുന്നത്.
        solution: ലോലം = മൃദുവായ, നേർത്ത.
        mistakes:
          കടുപ്പമുള്ള: m7_ant_image
      - prompt: 'ഈ കവിത വായിച്ച ഒരു കുട്ടി എടുക്കാവുന്ന ഏറ്റവും നല്ല തീരുമാനം:'
        options:
        - നടക്കുമ്പോൾ ചെറുജീവികളെ ശ്രദ്ധിച്ച് ഉപദ്രവിക്കാതിരിക്കുക
        - ഉറുമ്പുകളെ കണ്ടാൽ കൊല്ലുക
        - ഉറുമ്പിൻകൂട് പൊളിച്ചുനോക്കുക
        - ചെറുജീവികളെ ശ്രദ്ധിക്കേണ്ടതില്ല
        answer: നടക്കുമ്പോൾ ചെറുജീവികളെ ശ്രദ്ധിച്ച് ഉപദ്രവിക്കാതിരിക്കുക
