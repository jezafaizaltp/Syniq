subject: mal
chapter: 7
title: "അടിസ്ഥാനപാഠാവലി 2: പദം പദം ഉറച്ചു നാം"

tips:
  mal_ant_poem: "കവിതയിലെ ജീവി തലയിൽ വിത്ത് ചുമക്കുന്ന ഒരു ചെറിയ പ്രാണിയാണ്. അത് ഏത് കാലത്തേക്കാണ് ഭക്ഷണം കരുതിവയ്ക്കുന്നത്? അവസാനം കവി എന്തു ചെയ്തതിനാലാണ് ദുഃഖിക്കുന്നത്?"
  mal_daya: "ദയ ഒരു അടിമപ്പെൺകുട്ടിയാണ്; മന്ത്രിപദത്തിനുള്ള പരീക്ഷയ്ക്ക് അവൾ ഒരു പുരുഷന്റെ വേഷമിട്ടു. കഥ നടക്കുന്ന നഗരവും വീട്ടുടമസ്ഥനെയും തിരക്കഥയുടെ തുടക്കത്തിൽ കാണാം. ചതുരംഗത്തിൽ അവൾ മനഃപൂർവം ചെയ്തതെന്ത് എന്ന് ആലോചിക്കൂ."
  mal_tathagata: "അമ്മ ഓർമ്മകൾ നഷ്ടപ്പെടുന്ന ഒരു രോഗത്തിലാണ്. അമ്മ നോക്കിയിരിക്കുന്ന ഫോട്ടോ വർഷങ്ങൾക്കുമുമ്പ് മരിച്ച ഒരു കുടുംബാംഗത്തിന്റേതാണ്. ഇത്തരം രോഗികളോട് എങ്ങനെ പെരുമാറണമെന്നാണ് കഥ പറയുന്നത്?"
  mal_doubling: "ഒരേ പദം രണ്ടുതവണ ചേർത്തെഴുതുമ്പോൾ ഇടയിൽ ഒരു അക്ഷരം ഇരട്ടിക്കുന്നു. ആവർത്തനം അർഥത്തിന് തുടർച്ചയോ ഊന്നലോ നൽകുന്നു. ആവർത്തനമില്ലാത്ത സാധാരണ സമസ്തപദം ഏത് എന്നും നോക്കൂ."

concepts:
  - code: mal9.u7.vamsham
    title: വംശം
    notes: |
      വിജയലക്ഷ്മിയുടെ 'സീതാദർശനം' എന്ന സമാഹാരത്തിലെ കവിത. (യൂണിറ്റിന്റെ ആമുഖം: ജി. ശങ്കരക്കുറുപ്പിന്റെ
      'നക്ഷത്രഗീതം'.) ഒരു ഉറുമ്പിനെക്കുറിച്ചാണ് കവിത. അത് ഒരു വിത്ത് പൂവുയർത്തിപ്പിടിച്ചപോലെ തലയിൽ
      ചുമന്നു നടക്കുന്നു; എണ്ണമിനുപ്പുള്ള മുഖം, ലോലമായ ശരീരം. മഴക്കാലത്തേക്കു വേണ്ടത് കരുതിവയ്ക്കുന്നു;
      രാവും പകലും വെറുതെയിരിക്കുന്നില്ല. മലപോലെ തോന്നുന്ന തടസ്സങ്ങൾ അത് കയറിക്കടക്കുന്നു. അതിനെ
      അറിയാതെ ചതച്ചുകളഞ്ഞതിൽ കവി ഖേദിക്കുന്നു. ചെറുജീവികളുടെ അധ്വാനത്തോടും അതിജീവനത്തോടുമുള്ള
      ആദരവും, എല്ലാ ജീവനും ഒരേ വംശമാണെന്ന ബോധവുമാണ് ആശയം. ബന്ധപ്പെട്ടത്: ഉള്ളൂരിന്റെ 'പ്രേമസംഗീതം'.
    explanations:
      text: "ഒരു ചെറിയ ഉറുമ്പിന്റെ അധ്വാനവും കരുതലും ധൈര്യവും കവി സൂക്ഷ്മമായി കാണുന്നു. അതിനെ ചതച്ചതിൽ കവിക്കുണ്ടാകുന്ന കുറ്റബോധം മനുഷ്യന് മറ്റു ജീവികളോടുള്ള ഉത്തരവാദിത്തം ഓർമ്മിപ്പിക്കുന്നു."
      visual: "ഒരു ഉറുമ്പിന്റെ വലിയ ചിത്രം: തലയിൽ പൂവുപോലെ ഒരു വിത്ത്, മുന്നിൽ ഒരു കല്ല് (അതിന് അത് ഒരു മല), പിന്നിൽ മഴക്കാലത്തേക്കുള്ള ധാന്യശേഖരം."
      step_by_step: "1. കവി ഉറുമ്പിനെ കാണുന്നു. 2. അതിന്റെ രൂപം വർണ്ണിക്കുന്നു (എണ്ണമിനുപ്പുള്ള മുഖം, ലോലമായ ദേഹം). 3. അതിന്റെ അധ്വാനവും കരുതലും. 4. തടസ്സങ്ങൾ കടക്കുന്ന ധൈര്യം. 5. അതിനെ ചതച്ചതിലെ ഖേദം."
      real_world: "നടക്കുമ്പോഴും കളിക്കുമ്പോഴും ചെറുജീവികളെ ശ്രദ്ധിക്കാം. ഉറുമ്പുകൾ കൂട്ടായി ജോലിചെയ്യുന്നതും ഭക്ഷണം ശേഖരിക്കുന്നതും നിരീക്ഷിച്ച് ഒരു കുറിപ്പ് എഴുതാം."
    activity:
      type: sort
      prompt: കവിതയിൽ ഉറുമ്പിനെക്കുറിച്ചും കവിയെക്കുറിച്ചുമുള്ള ഭാഗങ്ങൾ തരംതിരിക്കൂ.
      bins:
      - ഉറുമ്പ് ചെയ്യുന്നത്
      - ഉറുമ്പിന്റെ രൂപം
      - കവി ചെയ്തത്
      items:
      - label: വിത്ത് തലയിൽ ചുമന്നു നടക്കുന്നു
        bin: ഉറുമ്പ് ചെയ്യുന്നത്
        clue: ഇത് ഒരു പ്രവൃത്തിയോ, രൂപവർണ്ണനയോ?
        why: വിത്ത് ചുമക്കൽ ഉറുമ്പിന്റെ അധ്വാനമാണ്.
      - label: മഴക്കാലത്തേക്കു കരുതിവയ്ക്കുന്നു
        bin: ഉറുമ്പ് ചെയ്യുന്നത്
        clue: ഇത് ആരുടെ മുൻകരുതലാണ്?
        why: ഉറുമ്പിന്റെ കരുതൽ, അതിജീവനം.
      - label: മലപോലുള്ള തടസ്സങ്ങൾ കയറിക്കടക്കുന്നു
        bin: ഉറുമ്പ് ചെയ്യുന്നത്
        clue: ചെറിയ ഉറുമ്പിന് മല പോലെ തോന്നുന്നത് എന്ത്?
        why: തടസ്സങ്ങൾ കടക്കുന്നത് ഉറുമ്പാണ്.
      - label: എണ്ണമിനുപ്പുള്ള മുഖം
        bin: ഉറുമ്പിന്റെ രൂപം
        clue: ഇത് ചെയ്യുന്നതോ കാണുന്നതോ?
        why: ഉറുമ്പിന്റെ രൂപവർണ്ണന.
      - label: ലോലമായ ശരീരം
        bin: ഉറുമ്പിന്റെ രൂപം
        clue: ഇത് ഒരു പ്രവൃത്തിയാണോ?
        why: ഉറുമ്പിന്റെ ശരീരത്തിന്റെ വർണ്ണന.
      - label: അറിയാതെ ചതച്ചുകളഞ്ഞു
        bin: കവി ചെയ്തത്
        clue: ഉറുമ്പിന് ഇത് സംഭവിച്ചതാരാൽ?
        why: കവി അറിയാതെ ഉറുമ്പിനെ ചതച്ചു.
      - label: ചതച്ചതിൽ ഖേദിക്കുന്നു
        bin: കവി ചെയ്തത്
        clue: ആരുടെ മനസ്സിലാണ് ഈ വേദന?
        why: 'കവിയുടെ ഖേദം: എല്ലാ ജീവനും ഒരേ വംശം.'
    items:
      - prompt: "'വംശം' എന്ന കവിത എഴുതിയതാര്?"
        options: ["വിജയലക്ഷ്മി", "വീരാൻകുട്ടി", "ഉള്ളൂർ", "ജി. ശങ്കരക്കുറുപ്പ്"]
        answer: "വിജയലക്ഷ്മി"
        difficulty: 1
        hints: ["'സീതാദർശനം' എന്ന സമാഹാരം."]
        solution: "വിജയലക്ഷ്മി."
        mistakes: {"ഉള്ളൂർ": mal_author_work}
      - prompt: "കവിതയിലെ ജീവി ഏത്?"
        options: ["ഉറുമ്പ്", "തേനീച്ച", "ചിലന്തി", "പൂമ്പാറ്റ"]
        answer: "ഉറുമ്പ്"
        difficulty: 1
        hints: ["വിത്ത് തലയിൽ ചുമക്കുന്നത്."]
        solution: "ഉറുമ്പ്."
        mistakes: {"തേനീച്ച": mal_ant_poem}
      - prompt: "ഉറുമ്പ് വിത്ത് ചുമക്കുന്നതിനെ കവി എന്തിനോടാണ് ഉപമിക്കുന്നത്?"
        options: ["പൂവുയർത്തിപ്പിടിച്ചതിനോട്", "കിരീടം ചൂടിയതിനോട്", "ഭാണ്ഡം ചുമക്കുന്നതിനോട്", "കുട പിടിച്ചതിനോട്"]
        answer: "പൂവുയർത്തിപ്പിടിച്ചതിനോട്"
        difficulty: 1
        hints: ["ഭാരം ഒരു അലങ്കാരംപോലെ."]
        solution: "പൂവുയർത്തിപ്പിടിച്ചതുപോലെ."
        mistakes: {"ഭാണ്ഡം ചുമക്കുന്നതിനോട്": mal_imagery}
      - prompt: "ഉറുമ്പ് ഭക്ഷണം ശേഖരിച്ചുവയ്ക്കുന്നത് ഏതു കാലത്തേക്കാണ്?"
        options: ["മഴക്കാലത്തേക്ക്", "വേനൽക്കാലത്തേക്ക്", "ഉത്സവകാലത്തേക്ക്", "വസന്തകാലത്തേക്ക്"]
        answer: "മഴക്കാലത്തേക്ക്"
        difficulty: 2
        hints: ["പുറത്തിറങ്ങാൻ കഴിയാത്ത കാലം."]
        solution: "മഴക്കാലത്തേക്ക് കരുതിവയ്ക്കുന്നു."
        mistakes: {"വേനൽക്കാലത്തേക്ക്": mal_ant_poem}
      - prompt: "കവിതയുടെ ഒടുവിൽ കവിയുടെ മനസ്സിലുള്ള പ്രധാന ഭാവം?"
        options: ["ഉറുമ്പിനെ ചതച്ചതിലുള്ള ഖേദം", "ഉറുമ്പിനോടുള്ള ദേഷ്യം", "ഉറുമ്പിനെ പിടിച്ചതിലുള്ള സന്തോഷം", "ഭയം"]
        answer: "ഉറുമ്പിനെ ചതച്ചതിലുള്ള ഖേദം"
        difficulty: 2
        hints: ["കുറ്റബോധം."]
        solution: "ഒരു ജീവനെ നശിപ്പിച്ചതിലുള്ള ഖേദം."
        mistakes: {"ഉറുമ്പിനോടുള്ള ദേഷ്യം": mal_ant_poem}
      - prompt: "കവിതയ്ക്ക് 'വംശം' എന്ന പേര് ഏറ്റവും ചേരുന്നത് ഏത് ആശയം കൊണ്ടാണ്?"
        options: ["ഉറുമ്പും മനുഷ്യനും ഉൾപ്പെടെ എല്ലാ ജീവനും ഒരേ ജീവവംശത്തിന്റെ ഭാഗമാണ്", "ഉറുമ്പുകൾ ഒരു രാജവംശമാണ്", "കവിയുടെ കുടുംബചരിത്രമാണ് കവിത", "ഉറുമ്പുകൾ മനുഷ്യരുടെ ശത്രുക്കളാണ്"]
        answer: "ഉറുമ്പും മനുഷ്യനും ഉൾപ്പെടെ എല്ലാ ജീവനും ഒരേ ജീവവംശത്തിന്റെ ഭാഗമാണ്"
        difficulty: 3
        hints: ["കവി ഉറുമ്പിൽ തന്നെത്തന്നെ, മനുഷ്യന്റെ അധ്വാനത്തെത്തന്നെ, കാണുന്നു."]
        solution: "അധ്വാനിക്കുകയും കരുതുകയും അതിജീവിക്കുകയും ചെയ്യുന്ന എല്ലാ ജീവനും ഒരേ വംശം എന്ന ബോധം."
        mistakes: {"ഉറുമ്പുകൾ ഒരു രാജവംശമാണ്": mal_ant_poem}
      - prompt: "ഉറുമ്പ് 'മലപോലെ തോന്നുന്ന തടസ്സങ്ങൾ' കയറിക്കടക്കുന്നു. ഈ ചിത്രം ഉറുമ്പിന്റെ ഏതു ഗുണം കാണിക്കുന്നു?"
        options: ["ചെറുതാണെങ്കിലും തളരാത്ത അതിജീവനശേഷി", "അതിന്റെ വലിയ ശരീരം", "അതിന്റെ മടി", "മറ്റു ജീവികളോടുള്ള ദേഷ്യം"]
        answer: "ചെറുതാണെങ്കിലും തളരാത്ത അതിജീവനശേഷി"
        difficulty: 3
        hints: ["ഉറുമ്പിന് ഒരു ചെറിയ കല്ല് എങ്ങനെ തോന്നും?", "രാവും പകലും അത് എന്തു ചെയ്യുന്നു?"]
        solution: "Step 1: ചെറിയ ഉറുമ്പിന് ചെറിയ തടസ്സവും മലപോലെയാണ്. Step 2: എന്നിട്ടും അത് കയറിക്കടക്കുന്നു: തളരാത്ത അധ്വാനവും അതിജീവനവും."
        mistakes: {"അതിന്റെ വലിയ ശരീരം": mal_ant_poem, "അതിന്റെ മടി": mal_ant_poem, "മറ്റു ജീവികളോടുള്ള ദേഷ്യം": mal_ant_poem}
      - prompt: "ഉറുമ്പിനെ അറിയാതെ ചതച്ചതിൽ കവി ഖേദിക്കുന്നു. ഈ ഖേദം വായനക്കാരോട് എന്താണ് ആവശ്യപ്പെടുന്നത്?"
        options: ["ചെറുജീവികളുടെ ജീവനും വിലയുണ്ടെന്ന് ഓർത്ത് ശ്രദ്ധയോടെ ജീവിക്കാൻ", "ഉറുമ്പുകളെ വീട്ടിൽനിന്ന് ഓടിക്കാൻ", "മഴക്കാലത്ത് പുറത്തിറങ്ങാതിരിക്കാൻ", "ഭക്ഷണം കരുതിവയ്ക്കാതിരിക്കാൻ"]
        answer: "ചെറുജീവികളുടെ ജീവനും വിലയുണ്ടെന്ന് ഓർത്ത് ശ്രദ്ധയോടെ ജീവിക്കാൻ"
        difficulty: 3
        hints: ["കവിതയുടെ പേര് 'വംശം'. ഏതു വംശത്തെക്കുറിച്ചാണ് കവി ചിന്തിക്കുന്നത്?", "അറിയാതെ ചെയ്ത ഒരു തെറ്റ് കവിയെ എന്തു പഠിപ്പിച്ചു?"]
        solution: "Step 1: എല്ലാ ജീവനും ഒരേ വംശമാണെന്നാണ് കവിതയുടെ ബോധം. Step 2: ചെറിയ ഒരു ജീവനും നഷ്ടപ്പെടരുതെന്ന കരുതലാണ് ഖേദത്തിലൂടെ കവി പങ്കുവയ്ക്കുന്നത്."
        mistakes: {"ഉറുമ്പുകളെ വീട്ടിൽനിന്ന് ഓടിക്കാൻ": mal_ant_poem, "മഴക്കാലത്ത് പുറത്തിറങ്ങാതിരിക്കാൻ": mal_ant_poem, "ഭക്ഷണം കരുതിവയ്ക്കാതിരിക്കാൻ": mal_ant_poem}

  - code: mal9.u7.daya
    title: ദയ
    notes: |
      എം. ടി. വാസുദേവൻ നായരുടെ 'ദയ' എന്ന തിരക്കഥയിൽനിന്നുള്ള ഭാഗം. ബാഗ്ദാദിലെ മൻസൂറിന്റെ വീട്ടിലെ
      ബുദ്ധിമതിയായ അടിമപ്പെൺകുട്ടിയാണ് ദയ. അവൾ സമീർ എന്ന യുവാവിന്റെ വേഷം ധരിച്ച് മറ്റൊരു രാജ്യത്ത്
      എത്തുന്നു. അവിടെ മന്ത്രിസ്ഥാനം പരീക്ഷകളിലൂടെയാണ് നിറയ്ക്കുന്നത്; ആറുപേർ മുമ്പേ വന്നുപോയി.
      രംഗം 61: അമ്പെയ്ത്തിൽ അഞ്ച് അമ്പും നടുവിലെ വൃത്തത്തിൽ; വാൾപ്പയറ്റിലും ജയം; നാലുപേരുടെ കൈയും
      കാലും ഒടിച്ച കാട്ടുകുതിരയെ മെരുക്കുന്നു. രംഗം 62: രാജാവുമായി ചതുരംഗം. രാജാവിനെ തോൽപ്പിക്കാതിരിക്കാൻ
      അവൾ മനഃപൂർവം ഒരു നീക്കം പിഴയ്ക്കുന്നു: "ഒരു യുദ്ധത്തിലെ തോൽവി അങ്ങ് മറക്കും. കളിയിലെ തോൽവി
      കയ്പായി മനസ്സിൽ നിൽക്കും." പാർമെനിഡീസിന്റെ "മാറ്റങ്ങളെല്ലാം മായയാണ്" എന്ന ചിന്തയും സംഭാഷണത്തിൽ
      വരുന്നു. രാജാവ് സമീറിനെ മന്ത്രിയാക്കുന്നു; രാജകുമാരിക്ക് പതിനഞ്ചു വയസ്സ്. തിരക്കഥയുടെ രൂപം: രംഗസംഖ്യ,
      സ്ഥലം/സമയം, ദൃശ്യവിവരണം, സംഭാഷണം. ഭാഷ: പതുക്കെപ്പതുക്കെ പോലുള്ള ദ്വിരുക്തി.
    explanations:
      text: "ശക്തിയും കഴിവും മാത്രമല്ല, മനുഷ്യമനസ്സിനെക്കുറിച്ചുള്ള വിവേകവുമാണ് ദയയെ മന്ത്രിയാക്കുന്നത്. ചതുരംഗത്തിൽ രാജാവിനെ തോൽപ്പിക്കാതിരിക്കുന്നതാണ് അവളുടെ ഏറ്റവും വലിയ ബുദ്ധി."
      visual: "നാലു പടികളുള്ള ഒരു ഗോവണി: അമ്പെയ്ത്ത് (5/5 നടുവിൽ) → വാൾപ്പയറ്റ് → കാട്ടുകുതിര → ചതുരംഗം (മനഃപൂർവമുള്ള പിഴവ്) → മന്ത്രിസ്ഥാനം."
      step_by_step: "തിരക്കഥ വായിക്കാൻ: 1. രംഗസംഖ്യ (61, 62). 2. സ്ഥലവും സമയവും. 3. ക്യാമറ കാണുന്നത് (ദൃശ്യം). 4. കഥാപാത്രങ്ങൾ പറയുന്നത് (സംഭാഷണം). കഥയിൽനിന്ന് വ്യത്യസ്തമായി, എല്ലാം കാണിക്കാവുന്ന രീതിയിൽ എഴുതുന്നു."
      real_world: "കളിയിൽ ജയിക്കുന്നതിനെക്കാൾ പ്രധാനം ചിലപ്പോൾ ബന്ധങ്ങളും മറ്റുള്ളവരുടെ മനസ്സുമാണ്. പക്ഷേ ദയ കഴിവിലൂടെയാണ് ആദ്യം ബഹുമാനം നേടുന്നത് എന്നും ഓർക്കണം."
    activity:
      type: order
      prompt: ദയ മന്ത്രിയായത് എങ്ങനെ? രംഗങ്ങൾ ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - ദയ സമീർ എന്ന യുവാവിന്റെ വേഷത്തിൽ എത്തുന്നു
      - 'രംഗം 61: അമ്പെയ്ത്ത്, വാൾപ്പയറ്റ്, കാട്ടുകുതിര'
      - 'രംഗം 62: രാജാവുമായി ചതുരംഗം'
