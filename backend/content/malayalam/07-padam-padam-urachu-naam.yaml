        mistakes: {"4": mal_read_again}
      - prompt: "നാലുമാസം മുമ്പ് അമ്മയ്ക്ക് എന്തു സംഭവിച്ചു?"
        options: ["നഗരത്തിലെ ട്രാഫിക്കിൽ വഴിതെറ്റിപ്പോയി", "വീണ് കാലൊടിഞ്ഞു", "ആശുപത്രിയിൽ പ്രവേശിപ്പിച്ചു", "ദീപുവിന്റെ സ്കൂളിൽ പോയി"]
        answer: "നഗരത്തിലെ ട്രാഫിക്കിൽ വഴിതെറ്റിപ്പോയി"
        difficulty: 2
        hints: ["ഓർമ്മക്കുറവ് കാരണം വഴി മറന്നു."]
        solution: "നഗരത്തിരക്കിൽ വഴിതെറ്റി."
        mistakes: {"വീണ് കാലൊടിഞ്ഞു": mal_read_again}
      - prompt: "കഥ വായിച്ചശേഷം ഏറ്റവും ഉചിതമായ നിരീക്ഷണം ഏത്?"
        options: ["മറവിരോഗമുള്ളവരെ ക്ഷമയോടെയും സ്നേഹത്തോടെയും പരിചരിക്കുന്നതാണ് പ്രധാനം", "രോഗികളെ ഒറ്റയ്ക്കു വിടണം", "പഴയ ഫോട്ടോകൾ നശിപ്പിക്കണം", "ഓർമ്മക്കുറവ് ഒരു തമാശയാണ്"]
        answer: "മറവിരോഗമുള്ളവരെ ക്ഷമയോടെയും സ്നേഹത്തോടെയും പരിചരിക്കുന്നതാണ് പ്രധാനം"
        difficulty: 3
        hints: ["മകൾ അമ്മയോട് പെരുമാറുന്ന രീതി."]
        solution: "കരുതലും ക്ഷമയുമാണ് കഥയുടെ സന്ദേശം."
        mistakes: {"രോഗികളെ ഒറ്റയ്ക്കു വിടണം": mal_tathagata}

  - code: mal9.u7.dvirukthi
    title: "ഭാഷ: പദാവർത്തനവും ചേർത്തെഴുത്തും"
    after: [mal9.u7.daya]
    notes: |
      ഒരേ പദം ആവർത്തിക്കുമ്പോൾ (ദ്വിരുക്തി) തുടർച്ചയോ ക്രമമോ ഊന്നലോ കിട്ടുന്നു: പതുക്കെ + പതുക്കെ =
      പതുക്കെപ്പതുക്കെ; പദം പദം (ഓരോ ചുവടും); ചെറുതുചെറുതായി; വീടുവീടാന്തരം. രണ്ടാമത്തെ പദം ക/ച/ത/പ
      യിൽ തുടങ്ങുമ്പോൾ ചേർത്തെഴുതുമ്പോൾ അത് ഇരട്ടിക്കാം (പതുക്കെപ്പതുക്കെ). 'തഥാഗത'യിലെ പ്രവർത്തനം:
      പദങ്ങൾ ചേർത്തെഴുതൽ (മറവി + രോഗം = മറവിരോഗം).
    explanations:
      text: "ഒരു വാക്ക് രണ്ടുതവണ പറയുമ്പോൾ അർഥത്തിന് ആഴം കൂടുന്നു: 'പതുക്കെ' എന്നതിനെക്കാൾ സാവധാനമാണ് 'പതുക്കെപ്പതുക്കെ'."
      visual: "പതുക്കെ + പതുക്കെ → പതുക്കെ'പ്പ'തുക്കെ (പ് ഇരട്ടിച്ചു)."
      step_by_step: "1. ആവർത്തിക്കുന്ന പദം കണ്ടെത്തുക. 2. രണ്ടാമത്തേത് ഖരാക്ഷരത്തിൽ (ക ച ട ത പ) തുടങ്ങുന്നുണ്ടോ നോക്കുക. 3. ഉണ്ടെങ്കിൽ ചേർത്തെഴുതുമ്പോൾ ഇരട്ടിപ്പ്. 4. അർഥം: തുടർച്ച/ഊന്നൽ."
      real_world: "'വേഗം വേഗം വാ!' എന്ന് അമ്മ വിളിക്കുമ്പോൾ ഒറ്റ 'വേഗം' എന്നതിനെക്കാൾ തിടുക്കം കൂടുതലാണ്."
    items:
      - prompt: "പതുക്കെ + പതുക്കെ ചേർത്തെഴുതുമ്പോൾ?"
        options: ["പതുക്കെപ്പതുക്കെ", "പതുക്കെപതുക്കെ", "പതുക്കപ്പതുക്കെ", "പതുക്കെയ്പതുക്കെ"]
        answer: "പതുക്കെപ്പതുക്കെ"
        difficulty: 1
        hints: ["'പ' ഇരട്ടിക്കുന്നു."]
        solution: "പതുക്കെപ്പതുക്കെ."
        mistakes: {"പതുക്കെപതുക്കെ": mal_doubling}
      - prompt: "'പതുക്കെപ്പതുക്കെ' എന്നതിന്റെ അർഥം?"
        options: ["വളരെ സാവധാനം, ക്രമേണ", "വളരെ വേഗം", "ഉടനെ", "ഒരിക്കലും"]
        answer: "വളരെ സാവധാനം, ക്രമേണ"
        difficulty: 1
        hints: ["ആവർത്തനം ഊന്നൽ കൂട്ടുന്നു."]
        solution: "ക്രമേണ, വളരെ സാവധാനം."
        mistakes: {"വളരെ വേഗം": mal_doubling}
      - prompt: "യൂണിറ്റിന്റെ പേരായ 'പദം പദം ഉറച്ചു നാം' — ഇതിലെ 'പദം പദം' എന്നതിന്റെ അർഥം?"
        options: ["ഓരോ ചുവടും", "ഓരോ വാക്കും എഴുതി", "പല ഭാഷകൾ", "രണ്ടു കാലുകൾ മാത്രം"]
        answer: "ഓരോ ചുവടും"
        difficulty: 2
        hints: ["ഇവിടെ പദം = കാലടി."]
        solution: "ഓരോ ചുവടും ഉറപ്പോടെ മുന്നോട്ട്."
        mistakes: {"ഓരോ വാക്കും എഴുതി": mal_word_meaning}
      - prompt: "മറവി + രോഗം ചേർത്തെഴുതുക."
        options: ["മറവിരോഗം", "മറവിറോഗം", "മറവ്രോഗം", "മറവിയ്രോഗം"]
        answer: "മറവിരോഗം"
        difficulty: 2
        hints: ["'ര' ഇരട്ടിക്കില്ല; വെറുതെ ചേർത്താൽ മതി."]
        solution: "മറവിരോഗം."
        mistakes: {"മറവിയ്രോഗം": mal_sandhi}
      - prompt: "താഴെ കൊടുത്തവയിൽ പദാവർത്തനം (ദ്വിരുക്തി) അല്ലാത്തത് ഏത്?"
        options: ["മഴക്കാലം", "വീടുവീടാന്തരം", "ചെറുതുചെറുതായി", "പതുക്കെപ്പതുക്കെ"]
        answer: "മഴക്കാലം"
        difficulty: 3
        hints: ["ഒരേ പദം ആവർത്തിക്കുന്നുണ്ടോ എന്ന് നോക്കുക."]
        solution: "മഴക്കാലം = മഴ + കാലം; ആവർത്തനമില്ല."
        mistakes: {"വീടുവീടാന്തരം": mal_doubling}
