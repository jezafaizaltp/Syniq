  - code: mal9.u7.tathagata
    title: തഥാഗത
    notes: |
      അഷിതയുടെ 'അഷിതയുടെ കഥകൾ' എന്ന സമാഹാരത്തിലെ കഥ. അമ്മയ്ക്ക് അൽഷിമേഴ്സ് (മറവിരോഗം). ഡോക്ടർ
      പറഞ്ഞു: "reaction matters" — നമ്മുടെ പ്രതികരണമാണ് പ്രധാനം. പത്തു വർഷം മുമ്പ് മരിച്ച ചേച്ചി
      അമ്മിണിക്കുട്ടിയുടെ ഫോട്ടോയിൽ അമ്മ നോക്കിയിരിക്കുന്നു. അനിയൻ ദീപുവിന്റെ സ്കൂൾ തുറക്കുന്നു. കഥ
      പറയുന്ന മകൾ പന്ത്രണ്ടു മണിക്ക് മരുന്നു കൊടുക്കുന്നു; ജനലിനരികിൽ അമ്മയോടൊപ്പമിരുന്ന് കുട്ടികൾ ഫുട്ബോൾ
      കളിക്കുന്നത് കാണുന്നു. നാലുമാസം മുമ്പ് അമ്മ നഗരത്തിലെ ട്രാഫിക്കിൽ വഴിതെറ്റിപ്പോയിരുന്നു. "അമ്മയുടെ
      അമ്മിണിക്കുട്ടിയെ?" എന്ന ചോദ്യത്തിന് "അമ്മിണിക്കുട്ടി മരിച്ചുപോയി" എന്ന ഉത്തരം. ഓർമ്മ മാഞ്ഞുപോകുന്ന
      അമ്മയോടുള്ള മക്കളുടെ സ്നേഹവും ക്ഷമയും വേദനയുമാണ് കഥ. ബന്ധപ്പെട്ടത്: സാവിത്രി രാജീവന്റെ 'അമ്മയെ
      കുളിപ്പിക്കുമ്പോൾ'. ഭാഷ: പദങ്ങൾ ചേർത്തെഴുതൽ.
    explanations:
      text: "ഒരുകാലത്ത് മക്കളെ നോക്കിയിരുന്ന അമ്മയെ ഇന്ന് മക്കൾ കുഞ്ഞിനെയെന്നപോലെ നോക്കുന്നു. ഓർമ്മ നഷ്ടപ്പെട്ട ഒരാളോട് ക്ഷമയോടെ, സ്നേഹത്തോടെ പെരുമാറുന്നതാണ് ഏറ്റവും വലിയ മരുന്ന്."
      visual: "ഒരു ജനൽ: അകത്ത് അമ്മയും മകളും, ചുമരിൽ അമ്മിണിക്കുട്ടിയുടെ ഫോട്ടോ, മേശയിൽ 12 മണിക്കുള്ള മരുന്ന്; പുറത്ത് ഫുട്ബോൾ കളിക്കുന്ന കുട്ടികൾ."
      step_by_step: "1. അമ്മയ്ക്ക് എന്താണ് രോഗം? (അൽഷിമേഴ്സ്). 2. ഡോക്ടറുടെ ഉപദേശം (reaction matters). 3. അമ്മയുടെ ഓർമ്മ എവിടെ നിൽക്കുന്നു? (മരിച്ച മകൾ). 4. മകളുടെ പരിചരണം. 5. കഥയിലെ വേദനയും സ്നേഹവും."
      real_world: "വീട്ടിലെ പ്രായമായവർ ഒരേ കാര്യം വീണ്ടും വീണ്ടും ചോദിച്ചാൽ ദേഷ്യപ്പെടാതെ ശാന്തമായി മറുപടി പറയാം. നമ്മുടെ പ്രതികരണം അവരുടെ മനസ്സിനെ ബാധിക്കും."
    activity:
      type: sort
      prompt: കഥ നടക്കുന്ന ദിവസം നടക്കുന്നതോ, മുമ്പ് നടന്നതോ?
      bins:
      - കഥ നടക്കുന്ന ദിവസം
      - മുമ്പ് നടന്നത്
      items:
      - label: ചേച്ചി അമ്മിണിക്കുട്ടി മരിച്ചു
        bin: മുമ്പ് നടന്നത്
        clue: എത്ര വർഷം മുമ്പ്?
        why: പത്തു വർഷം മുമ്പ് മരിച്ചു; അമ്മ ഇപ്പോഴും ഫോട്ടോയിൽ നോക്കിയിരിക്കുന്നു.
      - label: അമ്മ നഗരത്തിലെ ട്രാഫിക്കിൽ വഴിതെറ്റി
        bin: മുമ്പ് നടന്നത്
        clue: ഇത് എപ്പോഴായിരുന്നു എന്നാണ് കഥ?
        why: നാലുമാസം മുമ്പ്.
      - label: ദീപുവിന്റെ സ്കൂൾ തുറക്കുന്നു
        bin: കഥ നടക്കുന്ന ദിവസം
        clue: ഇത് കഥയിലെ ഇന്നത്തെ കാര്യമാണോ?
        why: കഥ നടക്കുന്ന ദിവസം അനിയന്റെ സ്കൂൾ തുറക്കുന്നു.
      - label: പന്ത്രണ്ടു മണിക്ക് അമ്മയ്ക്ക് മരുന്ന്
        bin: കഥ നടക്കുന്ന ദിവസം
        clue: മകൾ ഇത് ഇപ്പോൾ ചെയ്യുന്നതോ ഓർക്കുന്നതോ?
        why: അന്നത്തെ ദിനചര്യ.
      - label: ജനലിനരികിലിരുന്ന് ഫുട്ബോൾ കാണുന്നു
        bin: കഥ നടക്കുന്ന ദിവസം
        clue: അമ്മയും മകളും ഇപ്പോൾ എവിടെ?
        why: അന്ന് അമ്മയോടൊപ്പം ജനലിനരികിൽ.
    lesson:
      - teach: '''തഥാഗത'' അഷിതയുടെ കഥ. കഥ പറയുന്ന മകളുടെ അമ്മയ്ക്ക് അൽഷിമേഴ്സ് (മറവിരോഗം). ഡോക്ടർ പറഞ്ഞു: ''reaction matters'' — അമ്മയോട് നമ്മൾ എങ്ങനെ പ്രതികരിക്കുന്നു എന്നതാണ് പ്രധാനം.'
        check:
          prompt: '''reaction matters'' എന്നു പറഞ്ഞതാര്?'
          options:
          - ഡോക്ടർ
          - ദീപു
          - അമ്മ
          answer: ഡോക്ടർ
          why: അമ്മയെ എങ്ങനെ പരിചരിക്കണം എന്ന് ഡോക്ടർ പറഞ്ഞു.
        ways:
        - style: real_world
          teach: 'വീട്ടിലെ ഒരു മുതിർന്നയാൾ ഒരേ ചോദ്യം വീണ്ടും വീണ്ടും ചോദിക്കുമ്പോൾ നമ്മൾ ദേഷ്യപ്പെടാറുണ്ടോ? അഷിതയുടെ ''തഥാഗത'' എന്ന കഥയിൽ, കഥ പറയുന്ന മകളുടെ അമ്മയ്ക്ക് അൽഷിമേഴ്സ് (മറവിരോഗം) ആണ്. ഡോക്ടർ പറഞ്ഞു: ''reaction matters'' — അമ്മയോട് നമ്മൾ എങ്ങനെ പ്രതികരിക്കുന്നു എന്നതാണ് പ്രധാനം.'
      - teach: പത്തു വർഷം മുമ്പ് മരിച്ച ചേച്ചി അമ്മിണിക്കുട്ടിയുടെ ഫോട്ടോയിൽ അമ്മ നോക്കിയിരിക്കുന്നു. അനിയൻ ദീപുവിന്റെ സ്കൂൾ തുറക്കുന്നു. മകൾ പന്ത്രണ്ടു മണിക്ക് അമ്മയ്ക്ക് മരുന്നു കൊടുക്കുന്നു. നാലുമാസം മുമ്പ് അമ്മ നഗരത്തിലെ ട്രാഫിക്കിൽ വഴിതെറ്റിപ്പോയിരുന്നു.
        picture:
          kind: compare
          columns:
          - title: കുടുംബം
            points:
            - അമ്മ (മറവിരോഗം)
            - മകൾ (കഥ പറയുന്നയാൾ)
            - ദീപു (അനിയൻ)
            - അമ്മിണിക്കുട്ടി (മരിച്ച ചേച്ചി)
          - title: സമയങ്ങൾ
            points:
            - 'പത്തു വർഷം മുമ്പ്: ചേച്ചിയുടെ മരണം'
            - 'നാലുമാസം മുമ്പ്: വഴിതെറ്റൽ'
            - 'പന്ത്രണ്ടു മണി: മരുന്ന്'
          alt: '''തഥാഗത''യിലെ കുടുംബാംഗങ്ങളും പ്രധാന സമയങ്ങളും.'
        check:
          prompt: 'കഥയിലെ അനിയന്റെ പേര്:'
          options:
          - ദീപു
          - സുജിത്ത്
          - സമീർ
          answer: ദീപു
          why: ദീപുവിന്റെ സ്കൂൾ തുറക്കുന്ന ദിവസം.
        ways:
        - style: step_by_step
          teach: 'വീട്ടിലെ ആളുകളെയും കാര്യങ്ങളെയും ഒന്നൊന്നായി. ഒന്ന്: അമ്മ, പത്തു വർഷം മുമ്പ് മരിച്ച ചേച്ചി അമ്മിണിക്കുട്ടിയുടെ ഫോട്ടോയിൽ നോക്കിയിരിക്കുന്നു. രണ്ട്: അനിയൻ ദീപു; അവന്റെ സ്കൂൾ തുറക്കുന്നു. മൂന്ന്: മകൾ, പന്ത്രണ്ടു മണിക്ക് അമ്മയ്ക്ക് മരുന്നു കൊടുക്കുന്നു. നാല്: നാലുമാസം മുമ്പ് അമ്മ നഗരത്തിലെ ട്രാഫിക്കിൽ വഴിതെറ്റിപ്പോയിരുന്നു.'
      - teach: ജനലിനരികിൽ അമ്മയോടൊപ്പമിരുന്ന് മകൾ കുട്ടികളുടെ ഫുട്ബോൾ കളി കാണുന്നു. 'അമ്മയുടെ അമ്മിണിക്കുട്ടിയെ?' എന്ന ചോദ്യത്തിന് 'അമ്മിണിക്കുട്ടി മരിച്ചുപോയി' എന്ന ഉത്തരം. ഓർമ്മ മാഞ്ഞുപോകുന്ന അമ്മയോടുള്ള മക്കളുടെ സ്നേഹവും ക്ഷമയും വേദനയുമാണ് കഥ.
        check:
          prompt: 'കഥയുടെ പ്രധാന ഭാവം:'
          options:
          - മറവിരോഗമുള്ള അമ്മയോടുള്ള സ്നേഹവും ക്ഷമയും
          - ഫുട്ബോൾ കളിയുടെ ആവേശം
          - നഗരജീവിതത്തിന്റെ തിരക്ക്
          answer: മറവിരോഗമുള്ള അമ്മയോടുള്ള സ്നേഹവും ക്ഷമയും
          why: മക്കൾ അമ്മയെ ക്ഷമയോടെ പരിചരിക്കുന്നു.
        ways:
        - style: step_by_step
          teach: 'അവസാനരംഗം ക്രമത്തിൽ. ഒന്ന്: ജനലിനരികിൽ അമ്മയോടൊപ്പമിരുന്ന് മകൾ കുട്ടികളുടെ ഫുട്ബോൾ കളി കാണുന്നു. രണ്ട്: ''അമ്മയുടെ അമ്മിണിക്കുട്ടിയെ?'' എന്ന ചോദ്യം. മൂന്ന്: ''അമ്മിണിക്കുട്ടി മരിച്ചുപോയി'' എന്ന ഉത്തരം. ഓർമ്മ മാഞ്ഞുപോകുന്ന അമ്മയോടുള്ള മക്കളുടെ സ്നേഹവും ക്ഷമയും വേദനയുമാണ് കഥ.'
    items:
      - prompt: "'തഥാഗത' എന്ന കഥ എഴുതിയതാര്?"
