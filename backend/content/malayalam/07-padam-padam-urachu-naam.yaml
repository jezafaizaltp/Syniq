        options: ["മറവിരോഗമുള്ളവരെ ക്ഷമയോടെയും സ്നേഹത്തോടെയും പരിചരിക്കുന്നതാണ് പ്രധാനം", "രോഗികളെ ഒറ്റയ്ക്കു വിടണം", "പഴയ ഫോട്ടോകൾ നശിപ്പിക്കണം", "ഓർമ്മക്കുറവ് ഒരു തമാശയാണ്"]
        answer: "മറവിരോഗമുള്ളവരെ ക്ഷമയോടെയും സ്നേഹത്തോടെയും പരിചരിക്കുന്നതാണ് പ്രധാനം"
        difficulty: 3
        hints: ["മകൾ അമ്മയോട് പെരുമാറുന്ന രീതി."]
        solution: "കരുതലും ക്ഷമയുമാണ് കഥയുടെ സന്ദേശം."
        mistakes: {"രോഗികളെ ഒറ്റയ്ക്കു വിടണം": mal_tathagata}
      - prompt: "ഡോക്ടർ 'reaction matters' എന്നു പറഞ്ഞു. ഇതനുസരിച്ച് അമ്മ 'അമ്മിണിക്കുട്ടി എവിടെ?' എന്ന് വീണ്ടും വീണ്ടും ചോദിക്കുമ്പോൾ ഏറ്റവും ഉചിതമായ പെരുമാറ്റം?"
        options: ["ക്ഷമയോടെ, ശാന്തമായി, അമ്മയെ വേദനിപ്പിക്കാതെ മറുപടി പറയുക", "അമ്മയോട് ദേഷ്യപ്പെടുക", "ചോദ്യം കേട്ടില്ലെന്നു നടിക്കുക", "അമ്മയെ മുറിയിൽ പൂട്ടിയിടുക"]
        answer: "ക്ഷമയോടെ, ശാന്തമായി, അമ്മയെ വേദനിപ്പിക്കാതെ മറുപടി പറയുക"
        difficulty: 3
        hints: ["അമ്മ മനഃപൂർവം മറക്കുന്നതാണോ?", "നമ്മുടെ പ്രതികരണം അമ്മയിൽ എന്തു മാറ്റമുണ്ടാക്കും?"]
        solution: "Step 1: മറവി രോഗം കൊണ്ടാണ്; അമ്മയുടെ കുറ്റമല്ല. Step 2: ദേഷ്യമല്ല, ക്ഷമയും സ്നേഹവുമാണ് അമ്മയെ സുരക്ഷിതയാക്കുന്നത്."
        mistakes: {"അമ്മയോട് ദേഷ്യപ്പെടുക": mal_tathagata, "ചോദ്യം കേട്ടില്ലെന്നു നടിക്കുക": mal_tathagata, "അമ്മയെ മുറിയിൽ പൂട്ടിയിടുക": mal_tathagata}
      - prompt: "ജനലിനരികിൽ അമ്മയോടൊപ്പമിരുന്ന് കുട്ടികൾ ഫുട്ബോൾ കളിക്കുന്നത് മകൾ കാണുന്ന രംഗം കഥയിൽ എന്തു നൽകുന്നു?"
        options: ["മറവിയുടെ വേദനയ്ക്കിടയിലും അമ്മയും മകളും പങ്കിടുന്ന ശാന്തമായ ഒരു നിമിഷം", "മകൾക്ക് ഫുട്ബോൾ കളിക്കാനുള്ള ആഗ്രഹം", "അമ്മയുടെ രോഗം പൂർണ്ണമായി മാറിയത്", "ദീപുവിന്റെ സ്കൂൾ തുറന്നത്"]
        answer: "മറവിയുടെ വേദനയ്ക്കിടയിലും അമ്മയും മകളും പങ്കിടുന്ന ശാന്തമായ ഒരു നിമിഷം"
        difficulty: 3
        hints: ["ഈ രംഗത്തിൽ മകൾ എന്താണ് ചെയ്യുന്നത്: അമ്മയെ ശാസിക്കുകയാണോ കൂടെയിരിക്കുകയാണോ?", "രോഗം മാറിയെന്ന് കഥയിൽ എവിടെയെങ്കിലും പറയുന്നുണ്ടോ?"]
        solution: "Step 1: രോഗം മാറിയിട്ടില്ല. Step 2: എന്നിട്ടും മകൾ അമ്മയോടൊപ്പം ഇരുന്ന് ഒരേ കാഴ്ച കാണുന്നു: വേദനയ്ക്കിടയിലെ സ്നേഹത്തിന്റെ ഒരു കൊച്ചുനിമിഷം."
        mistakes: {"മകൾക്ക് ഫുട്ബോൾ കളിക്കാനുള്ള ആഗ്രഹം": mal_think_why, "അമ്മയുടെ രോഗം പൂർണ്ണമായി മാറിയത്": mal_tathagata, "ദീപുവിന്റെ സ്കൂൾ തുറന്നത്": mal_read_again}

  - code: mal9.u7.dvirukthi
    title: "ഭാഷ: പദാവർത്തനവും ചേർത്തെഴുത്തും"
    after: [mal9.u7.daya]
    notes: |
      ഒരേ പദം ആവർത്തിക്കുമ്പോൾ (ദ്വിരുക്തി) തുടർച്ചയോ ക്രമമോ ഊന്നലോ കിട്ടുന്നു: പതുക്കെ + പതുക്കെ =
      പതുക്കെപ്പതുക്കെ; പദം പദം (ഓരോ ചുവടും); ചെറുതുചെറുതായി; വീടുവീടാന്തരം. രണ്ടാമത്തെ പദം ക/ച/ത/പ
      യിൽ തുടങ്ങുമ്പോൾ ചേർത്തെഴുതുമ്പോൾ അത് ഇരട്ടിക്കാം (പതുക്കെപ്പതുക്കെ). 'തഥാഗത'യിലെ പ്രവർത്തനം:
      പദങ്ങൾ ചേർത്തെഴുതൽ (മറവി + രോഗം = മറവിരോഗം).
    explanations:
      text: "ഒരു വാക്ക് രണ്ടുതവണ പറയുമ്പോൾ അർഥത്തിന് ആഴം കൂടുന്നു: 'പതുക്കെ' എന്നതിനെക്കാൾ സാവധാനമാണ് 'പതുക്കെപ്പതുക്കെ'."
      visual: "പതുക്കെ + പതുക്കെ → പതുക്കെ'പ്പ'തുക്കെ (പ് ഇരട്ടിച്ചു)."
      step_by_step: "1. ആവർത്തിക്കുന്ന പദം കണ്ടെത്തുക. 2. രണ്ടാമത്തേത് ഖരാക്ഷരത്തിൽ (ക ച ട ത പ) തുടങ്ങുന്നുണ്ടോ നോക്കുക. 3. ഉണ്ടെങ്കിൽ ചേർത്തെഴുതുമ്പോൾ ഇരട്ടിപ്പ്. 4. അർഥം: തുടർച്ച/ഊന്നൽ."
      real_world: "'വേഗം വേഗം വാ!' എന്ന് അമ്മ വിളിക്കുമ്പോൾ ഒറ്റ 'വേഗം' എന്നതിനെക്കാൾ തിടുക്കം കൂടുതലാണ്."
    activity:
      type: sort
      prompt: ഒരേ പദം ആവർത്തിച്ചതാണോ (ദ്വിരുക്തി), രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ചേർത്തതാണോ?
      bins:
      - ദ്വിരുക്തി
      - രണ്ടു പദങ്ങളുടെ ചേർച്ച
      items:
      - label: പതുക്കെപ്പതുക്കെ
        bin: ദ്വിരുക്തി
        clue: ഇതിനെ രണ്ടായി പിരിച്ചാൽ രണ്ടു ഭാഗവും ഒന്നാണോ?
        why: 'പതുക്കെ + പതുക്കെ: തുടർച്ച കാണിക്കുന്ന ദ്വിരുക്തി.'
      - label: പദം പദം
        bin: ദ്വിരുക്തി
        clue: ഒരേ വാക്ക് രണ്ടു തവണ?
        why: ഓരോ ചുവടും എന്ന ക്രമം കാണിക്കുന്നു.
      - label: വീടുവീടാന്തരം
        bin: ദ്വിരുക്തി
        clue: '''വീട്'' എത്ര തവണ?'
        why: ഓരോ വീട്ടിലും എന്ന അർഥം.
      - label: മറവിരോഗം
        bin: രണ്ടു പദങ്ങളുടെ ചേർച്ച
        clue: 'മറവി + രോഗം: രണ്ടും ഒരേ വാക്കാണോ?'
        why: രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ചേർത്തെഴുതി.
      - label: തുമ്പപ്പൂ
        bin: രണ്ടു പദങ്ങളുടെ ചേർച്ച
        clue: തുമ്പ + പൂ. ആവർത്തനമുണ്ടോ?
        why: പ ഇരട്ടിച്ചെങ്കിലും രണ്ടു വ്യത്യസ്ത പദങ്ങൾ.
      - label: വേപ്പിലക്കട്ടി
        bin: രണ്ടു പദങ്ങളുടെ ചേർച്ച
        clue: വേപ്പില + കട്ടി. ഒരേ പദമാണോ?
        why: രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ചേർന്നത്.
    items:
      - prompt: "പതുക്കെ + പതുക്കെ ചേർത്തെഴുതുമ്പോൾ?"
        options: ["പതുക്കെപ്പതുക്കെ", "പതുക്കെപതുക്കെ", "പതുക്കപ്പതുക്കെ", "പതുക്കെയ്പതുക്കെ"]
        answer: "പതുക്കെപ്പതുക്കെ"
        difficulty: 1
        hints: ["'പ' ഇരട്ടിക്കുന്നു."]
        solution: "പതുക്കെപ്പതുക്കെ."
        mistakes: {"പതുക്കെപതുക്കെ": mal_doubling}
      - prompt: "'പതുക്കെപ്പതുക്കെ' എന്നതിന്റെ അർഥം?"
        options: ["വളരെ സാവധാനം, ക്രമേണ", "വളരെ വേഗം", "ഉടനെ", "ഒരിക്കലും"]
        answer: "വളരെ സാവധാനം, ക്രമേണ"
        difficulty: 1
        hints: ["ആവർത്തനം ഊന്നൽ കൂട്ടുന്നു."]
        solution: "ക്രമേണ, വളരെ സാവധാനം."
        mistakes: {"വളരെ വേഗം": mal_doubling}
      - prompt: "യൂണിറ്റിന്റെ പേരായ 'പദം പദം ഉറച്ചു നാം' — ഇതിലെ 'പദം പദം' എന്നതിന്റെ അർഥം?"
        options: ["ഓരോ ചുവടും", "ഓരോ വാക്കും എഴുതി", "പല ഭാഷകൾ", "രണ്ടു കാലുകൾ മാത്രം"]
        answer: "ഓരോ ചുവടും"
        difficulty: 2
        hints: ["ഇവിടെ പദം = കാലടി."]
        solution: "ഓരോ ചുവടും ഉറപ്പോടെ മുന്നോട്ട്."
        mistakes: {"ഓരോ വാക്കും എഴുതി": mal_word_meaning}
      - prompt: "മറവി + രോഗം ചേർത്തെഴുതുക."
        options: ["മറവിരോഗം", "മറവിറോഗം", "മറവ്രോഗം", "മറവിയ്രോഗം"]
        answer: "മറവിരോഗം"
        difficulty: 2
        hints: ["'ര' ഇരട്ടിക്കില്ല; വെറുതെ ചേർത്താൽ മതി."]
        solution: "മറവിരോഗം."
        mistakes: {"മറവിയ്രോഗം": mal_sandhi}
      - prompt: "താഴെ കൊടുത്തവയിൽ പദാവർത്തനം (ദ്വിരുക്തി) അല്ലാത്തത് ഏത്?"
        options: ["മഴക്കാലം", "വീടുവീടാന്തരം", "ചെറുതുചെറുതായി", "പതുക്കെപ്പതുക്കെ"]
        answer: "മഴക്കാലം"
        difficulty: 3
        hints: ["ഒരേ പദം ആവർത്തിക്കുന്നുണ്ടോ എന്ന് നോക്കുക."]
        solution: "മഴക്കാലം = മഴ + കാലം; ആവർത്തനമില്ല."
        mistakes: {"വീടുവീടാന്തരം": mal_doubling}
      - prompt: "'വീടുവീടാന്തരം' എന്ന പദാവർത്തനം നൽകുന്ന അർഥം?"
        options: ["ഓരോ വീട്ടിലും, ഒന്നൊന്നായി എല്ലാ വീടുകളിലും", "ഒരു വലിയ വീട്", "വീട്ടിൽനിന്ന് പുറത്ത്", "ഒരു വീട് മാത്രം"]
        answer: "ഓരോ വീട്ടിലും, ഒന്നൊന്നായി എല്ലാ വീടുകളിലും"
        difficulty: 3
        hints: ["ഒരേ പദം ആവർത്തിക്കുമ്പോൾ തുടർച്ചയോ ക്രമമോ ആണ് സാധാരണ കിട്ടുന്നത്.", "'പദം പദം' = ഓരോ ചുവടും എന്നതുപോലെ."]
        solution: "Step 1: 'വീട്' ആവർത്തിച്ചുവരുന്നു. Step 2: അത് ഒന്നിനുപിറകെ ഒന്നായി എല്ലാ വീടുകളും എന്ന ക്രമം നൽകുന്നു."
