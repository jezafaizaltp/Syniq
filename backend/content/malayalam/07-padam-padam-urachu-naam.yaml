        hints: ["'അഷിതയുടെ കഥകൾ'."]
        solution: "അഷിത."
        mistakes: {"സാവിത്രി രാജീവൻ": mal_author_work}
      - prompt: "കഥയിലെ അമ്മയ്ക്ക് ബാധിച്ച രോഗം?"
        options: ["അൽഷിമേഴ്സ് (മറവിരോഗം)", "പനി", "പ്രമേഹം", "കാഴ്ചക്കുറവ്"]
        answer: "അൽഷിമേഴ്സ് (മറവിരോഗം)"
        difficulty: 1
        hints: ["ഓർമ്മ നഷ്ടപ്പെടുന്ന രോഗം."]
        solution: "അൽഷിമേഴ്സ്."
        mistakes: {"കാഴ്ചക്കുറവ്": mal_tathagata}
      - prompt: "ഡോക്ടർ പറഞ്ഞ 'reaction matters' എന്നതിന്റെ അർഥം?"
        options: ["നമ്മൾ അമ്മയോട് എങ്ങനെ പ്രതികരിക്കുന്നു എന്നതാണ് പ്രധാനം", "മരുന്നിന്റെ രാസപ്രവർത്തനം പ്രധാനമാണ്", "അമ്മ ദേഷ്യപ്പെടുന്നത് പ്രധാനമാണ്", "ആശുപത്രിയിലെ ചികിത്സ മാത്രം മതി"]
        answer: "നമ്മൾ അമ്മയോട് എങ്ങനെ പ്രതികരിക്കുന്നു എന്നതാണ് പ്രധാനം"
        difficulty: 2
        hints: ["വീട്ടുകാരുടെ പെരുമാറ്റം."]
        solution: "ക്ഷമയോടെയുള്ള പ്രതികരണം രോഗിയെ സഹായിക്കും."
        mistakes: {"മരുന്നിന്റെ രാസപ്രവർത്തനം പ്രധാനമാണ്": mal_word_meaning}
      - prompt: "അമ്മ ആരുടെ ഫോട്ടോയിലാണ് നോക്കിയിരിക്കുന്നത്?"
        options: ["മരിച്ചുപോയ മകൾ അമ്മിണിക്കുട്ടിയുടെ", "ദീപുവിന്റെ", "ഡോക്ടറുടെ", "സ്വന്തം അമ്മയുടെ"]
        answer: "മരിച്ചുപോയ മകൾ അമ്മിണിക്കുട്ടിയുടെ"
        difficulty: 1
        hints: ["പത്തു വർഷം മുമ്പ് മരിച്ച ചേച്ചി."]
        solution: "അമ്മിണിക്കുട്ടിയുടെ ഫോട്ടോ."
        mistakes: {"ദീപുവിന്റെ": mal_tathagata}
      - prompt: "അമ്മിണിക്കുട്ടി മരിച്ചിട്ട് എത്ര വർഷമായി?"
        answer: "10"
        check: "10"
