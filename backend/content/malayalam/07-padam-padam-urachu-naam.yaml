        - രംഗം 61 ശരീരബലവും ആയുധവുമായി ബന്ധപ്പെട്ടത്.
        - ബുദ്ധികൊണ്ടുള്ള കളി അടുത്ത രംഗത്താണ്.
        solution: ചതുരംഗം രംഗം 62-ലാണ്; രംഗം 61-ൽ അമ്പും വാളും കുതിരയും.
        mistakes:
          അമ്പെയ്ത്ത്: m7_daya_test
      - prompt: സംഭാഷണത്തിൽ 'മാറ്റങ്ങളെല്ലാം മായയാണ്' എന്ന ചിന്ത ആരുടേതായി വരുന്നു?
        options:
        - പാർമെനിഡീസ്
        - സോക്രട്ടീസ്
        - ടാഗോർ
        - എം. ടി.
        answer: പാർമെനിഡീസ്
        difficulty: 3
        hints:
        - ഒരു പ്രാചീന ഗ്രീക്ക് ചിന്തകൻ.
        - സോക്രട്ടീസ് അല്ല.
        solution: പാർമെനിഡീസിന്റെ ചിന്തയാണ് സംഭാഷണത്തിൽ വരുന്നത്.
        mistakes:
          സോക്രട്ടീസ്: mal_daya
      - prompt: തിരക്കഥയിൽ സാധാരണ ഉണ്ടാകാത്തത് ഏത്?
        options:
        - കഥാപാത്രത്തിന്റെ മനസ്സിലെ ചിന്തകളുടെ നീണ്ട വിവരണം
        - രംഗസംഖ്യ
        - ദൃശ്യവിവരണം
        - സംഭാഷണം
        answer: കഥാപാത്രത്തിന്റെ മനസ്സിലെ ചിന്തകളുടെ നീണ്ട വിവരണം
        difficulty: 3
        hints:
        - ക്യാമറയ്ക്ക് കാണിക്കാനാവാത്തത് ഏത്?
        - തിരക്കഥ കാണാനും കേൾക്കാനുമുള്ളതാണ്.
        solution: മനസ്സിലെ ചിന്തകൾ ക്യാമറയ്ക്ക് കാണിക്കാനാവില്ല; തിരക്കഥ ദൃശ്യവും സംഭാഷണവുമാണ്.
        mistakes:
