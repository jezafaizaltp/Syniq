  - code: mal9.u7.daya
    title: ദയ
    notes: |
      എം. ടി. വാസുദേവൻ നായരുടെ 'ദയ' എന്ന തിരക്കഥയിൽനിന്നുള്ള ഭാഗം. ബാഗ്ദാദിലെ മൻസൂറിന്റെ വീട്ടിലെ
      ബുദ്ധിമതിയായ അടിമപ്പെൺകുട്ടിയാണ് ദയ. അവൾ സമീർ എന്ന യുവാവിന്റെ വേഷം ധരിച്ച് മറ്റൊരു രാജ്യത്ത്
      എത്തുന്നു. അവിടെ മന്ത്രിസ്ഥാനം പരീക്ഷകളിലൂടെയാണ് നിറയ്ക്കുന്നത്; ആറുപേർ മുമ്പേ വന്നുപോയി.
      രംഗം 61: അമ്പെയ്ത്തിൽ അഞ്ച് അമ്പും നടുവിലെ വൃത്തത്തിൽ; വാൾപ്പയറ്റിലും ജയം; നാലുപേരുടെ കൈയും
      കാലും ഒടിച്ച കാട്ടുകുതിരയെ മെരുക്കുന്നു. രംഗം 62: രാജാവുമായി ചതുരംഗം. രാജാവിനെ തോൽപ്പിക്കാതിരിക്കാൻ
      അവൾ മനഃപൂർവം ഒരു നീക്കം പിഴയ്ക്കുന്നു: "ഒരു യുദ്ധത്തിലെ തോൽവി അങ്ങ് മറക്കും. കളിയിലെ തോൽവി
      കയ്പായി മനസ്സിൽ നിൽക്കും." പാർമെനിഡീസിന്റെ "മാറ്റങ്ങളെല്ലാം മായയാണ്" എന്ന ചിന്തയും സംഭാഷണത്തിൽ
      വരുന്നു. രാജാവ് സമീറിനെ മന്ത്രിയാക്കുന്നു; രാജകുമാരിക്ക് പതിനഞ്ചു വയസ്സ്. തിരക്കഥയുടെ രൂപം: രംഗസംഖ്യ,
      സ്ഥലം/സമയം, ദൃശ്യവിവരണം, സംഭാഷണം. ഭാഷ: പതുക്കെപ്പതുക്കെ പോലുള്ള ദ്വിരുക്തി.
    explanations:
      text: "ശക്തിയും കഴിവും മാത്രമല്ല, മനുഷ്യമനസ്സിനെക്കുറിച്ചുള്ള വിവേകവുമാണ് ദയയെ മന്ത്രിയാക്കുന്നത്. ചതുരംഗത്തിൽ രാജാവിനെ തോൽപ്പിക്കാതിരിക്കുന്നതാണ് അവളുടെ ഏറ്റവും വലിയ ബുദ്ധി."
      visual: "നാലു പടികളുള്ള ഒരു ഗോവണി: അമ്പെയ്ത്ത് (5/5 നടുവിൽ) → വാൾപ്പയറ്റ് → കാട്ടുകുതിര → ചതുരംഗം (മനഃപൂർവമുള്ള പിഴവ്) → മന്ത്രിസ്ഥാനം."
      step_by_step: "തിരക്കഥ വായിക്കാൻ: 1. രംഗസംഖ്യ (61, 62). 2. സ്ഥലവും സമയവും. 3. ക്യാമറ കാണുന്നത് (ദൃശ്യം). 4. കഥാപാത്രങ്ങൾ പറയുന്നത് (സംഭാഷണം). കഥയിൽനിന്ന് വ്യത്യസ്തമായി, എല്ലാം കാണിക്കാവുന്ന രീതിയിൽ എഴുതുന്നു."
      real_world: "കളിയിൽ ജയിക്കുന്നതിനെക്കാൾ പ്രധാനം ചിലപ്പോൾ ബന്ധങ്ങളും മറ്റുള്ളവരുടെ മനസ്സുമാണ്. പക്ഷേ ദയ കഴിവിലൂടെയാണ് ആദ്യം ബഹുമാനം നേടുന്നത് എന്നും ഓർക്കണം."
    activity:
      type: order
      prompt: ദയ മന്ത്രിയായത് എങ്ങനെ? രംഗങ്ങൾ ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - ദയ സമീർ എന്ന യുവാവിന്റെ വേഷത്തിൽ എത്തുന്നു
      - 'രംഗം 61: അമ്പെയ്ത്ത്, വാൾപ്പയറ്റ്, കാട്ടുകുതിര'
      - 'രംഗം 62: രാജാവുമായി ചതുരംഗം'
      - മനഃപൂർവം ഒരു നീക്കം പിഴയ്ക്കുന്നു
      - രാജാവ് സമീറിനെ മന്ത്രിയാക്കുന്നു
      reasons:
        'രംഗം 61: അമ്പെയ്ത്ത്, വാൾപ്പയറ്റ്, കാട്ടുകുതിര': പരീക്ഷകൾ എഴുതാൻ സമീർ ആദ്യം ആ രാജ്യത്ത് എത്തണം.
        'രംഗം 62: രാജാവുമായി ചതുരംഗം': രംഗം 61-ലെ പരീക്ഷകൾക്കുശേഷമാണ് രംഗം 62.
        മനഃപൂർവം ഒരു നീക്കം പിഴയ്ക്കുന്നു: കളിക്കിടയിലാണ് ദയ രാജാവിനെ തോൽപ്പിക്കാതിരിക്കാൻ തീരുമാനിക്കുന്നത്.
        രാജാവ് സമീറിനെ മന്ത്രിയാക്കുന്നു: എല്ലാ പരീക്ഷകൾക്കും ശേഷമാണ് തീരുമാനം.
    lesson:
      - teach: '''ദയ'' എം. ടി. വാസുദേവൻ നായരുടെ തിരക്കഥയിലെ ഭാഗം. ബാഗ്ദാദിലെ മൻസൂറിന്റെ വീട്ടിലെ ബുദ്ധിമതിയായ അടിമപ്പെൺകുട്ടിയാണ് ദയ. സമീർ എന്ന യുവാവിന്റെ വേഷത്തിൽ അവൾ മറ്റൊരു രാജ്യത്ത് എത്തുന്നു. അവിടെ മന്ത്രിയെ പരീക്ഷകളിലൂടെയാണ് തിരഞ്ഞെടുക്കുന്നത്; മുമ്പ് ആറുപേർ വന്ന് പരാജയപ്പെട്ടു.'
        check:
          prompt: ദയ ആദ്യം ആരുടെ വീട്ടിലായിരുന്നു?
          options:
          - ബാഗ്ദാദിലെ മൻസൂറിന്റെ
          - രാജാവിന്റെ
          - സമീറിന്റെ
          answer: ബാഗ്ദാദിലെ മൻസൂറിന്റെ
          why: മൻസൂറിന്റെ വീട്ടിലെ അടിമപ്പെൺകുട്ടി.
        ways:
        - style: step_by_step
          teach: 'കഥയുടെ തുടക്കം ക്രമത്തിൽ. ഒന്ന്: എം. ടി. വാസുദേവൻ നായരുടെ തിരക്കഥ ''ദയ''. രണ്ട്: ദയ, ബാഗ്ദാദിലെ മൻസൂറിന്റെ വീട്ടിലെ ബുദ്ധിമതിയായ അടിമപ്പെൺകുട്ടി. മൂന്ന്: സമീർ എന്ന യുവാവിന്റെ വേഷത്തിൽ അവൾ മറ്റൊരു രാജ്യത്ത് എത്തുന്നു. നാല്: അവിടെ മന്ത്രിയെ തിരഞ്ഞെടുക്കുന്നത് പരീക്ഷകളിലൂടെ; മുമ്പ് ആറുപേർ വന്ന് പരാജയപ്പെട്ടു.'
      - teach: 'രംഗം 61: അമ്പെയ്ത്തിൽ അഞ്ച് അമ്പും നടുവിലെ വൃത്തത്തിൽ; വാൾപ്പയറ്റിലും ജയം; നാലുപേരെ വീഴ്ത്തിയ കാട്ടുകുതിരയെ മെരുക്കുന്നു. രംഗം 62: രാജാവുമായി ചതുരംഗം. രാജാവിനെ തോൽപ്പിക്കാതിരിക്കാൻ മനഃപൂർവം ഒരു നീക്കം പിഴയ്ക്കുന്നു: ''യുദ്ധത്തിലെ തോൽവി അങ്ങ് മറക്കും; കളിയിലെ തോൽവി കയ്പായി മനസ്സിൽ നിൽക്കും.'''
        picture:
          kind: flow
          steps:
          - 'അമ്പെയ്ത്ത്: അഞ്ചും നടുവിൽ'
          - 'വാൾപ്പയറ്റ്: ജയം'
          - കാട്ടുകുതിരയെ മെരുക്കൽ
          - 'ചതുരംഗം: മനഃപൂർവം ഒരു പിഴ'
          - മന്ത്രിസ്ഥാനം
          alt: ദയ മന്ത്രിയാകാൻ കടന്ന പരീക്ഷകളുടെ ക്രമം.
        check:
          prompt: 'രംഗം 62-ൽ ദയയും രാജാവും കളിക്കുന്ന കളി:'
          options:
          - ചതുരംഗം
          - പന്തുകളി
          - ചീട്ടുകളി
          answer: ചതുരംഗം
          why: ചതുരംഗത്തിൽ അവൾ ഒരു നീക്കം മനഃപൂർവം പിഴയ്ക്കുന്നു.
        ways:
