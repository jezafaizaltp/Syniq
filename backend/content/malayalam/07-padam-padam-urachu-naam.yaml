        - മരിച്ചുപോയ മകളെ അമ്മ ഇപ്പോഴും ചോദിക്കുന്നു.
        solution: അൽഷിമേഴ്സ് = മറവിരോഗം; ഓർമ്മ പതുക്കെ നഷ്ടപ്പെടുന്നു.
        mistakes:
          കാഴ്ച കുറയുന്ന രോഗം: mal_tathagata
      - prompt: 'മറവിരോഗമുള്ള ഒരു മുത്തശ്ശി ഒരേ ചോദ്യം വീണ്ടും വീണ്ടും ചോദിക്കുന്നു. ''reaction matters'' എന്ന ആശയമനുസരിച്ച് ചെയ്യരുതാത്തത്:'
        options:
        - '''എത്ര തവണ പറഞ്ഞു!'' എന്ന് ദേഷ്യപ്പെടുക'
        - ശാന്തമായി വീണ്ടും മറുപടി പറയുക
        - കൈപിടിച്ച് കൂടെയിരിക്കുക
        - ഇഷ്ടമുള്ള കാര്യത്തിലേക്ക് പതുക്കെ ശ്രദ്ധ മാറ്റുക
        answer: '''എത്ര തവണ പറഞ്ഞു!'' എന്ന് ദേഷ്യപ്പെടുക'
        difficulty: 3
        hints:
        - നമ്മുടെ പ്രതികരണം അവരെ എങ്ങനെ ബാധിക്കും?
        - ഓർക്കാനാവാത്തത് അവരുടെ കുറ്റമല്ല.
        solution: ദേഷ്യം അവരെ വേദനിപ്പിക്കും; ക്ഷമയും ശാന്തതയുമാണ് വേണ്ടത്.
        mistakes:
          ശാന്തമായി വീണ്ടും മറുപടി പറയുക: m7_amma_care

  - code: mal9.u7.dvirukthi
    title: "ഭാഷ: പദാവർത്തനവും ചേർത്തെഴുത്തും"
    after: [mal9.u7.daya]
    notes: |
      ഒരേ പദം ആവർത്തിക്കുമ്പോൾ (ദ്വിരുക്തി) തുടർച്ചയോ ക്രമമോ ഊന്നലോ കിട്ടുന്നു: പതുക്കെ + പതുക്കെ =
      പതുക്കെപ്പതുക്കെ; പദം പദം (ഓരോ ചുവടും); ചെറുതുചെറുതായി; വീടുവീടാന്തരം. രണ്ടാമത്തെ പദം ക/ച/ത/പ
      യിൽ തുടങ്ങുമ്പോൾ ചേർത്തെഴുതുമ്പോൾ അത് ഇരട്ടിക്കാം (പതുക്കെപ്പതുക്കെ). 'തഥാഗത'യിലെ പ്രവർത്തനം:
      പദങ്ങൾ ചേർത്തെഴുതൽ (മറവി + രോഗം = മറവിരോഗം).
    explanations:
      text: "ഒരു വാക്ക് രണ്ടുതവണ പറയുമ്പോൾ അർഥത്തിന് ആഴം കൂടുന്നു: 'പതുക്കെ' എന്നതിനെക്കാൾ സാവധാനമാണ് 'പതുക്കെപ്പതുക്കെ'."
      visual: "പതുക്കെ + പതുക്കെ → പതുക്കെ'പ്പ'തുക്കെ (പ് ഇരട്ടിച്ചു)."
      step_by_step: "1. ആവർത്തിക്കുന്ന പദം കണ്ടെത്തുക. 2. രണ്ടാമത്തേത് ഖരാക്ഷരത്തിൽ (ക ച ട ത പ) തുടങ്ങുന്നുണ്ടോ നോക്കുക. 3. ഉണ്ടെങ്കിൽ ചേർത്തെഴുതുമ്പോൾ ഇരട്ടിപ്പ്. 4. അർഥം: തുടർച്ച/ഊന്നൽ."
      real_world: "'വേഗം വേഗം വാ!' എന്ന് അമ്മ വിളിക്കുമ്പോൾ ഒറ്റ 'വേഗം' എന്നതിനെക്കാൾ തിടുക്കം കൂടുതലാണ്."
    activity:
      type: sort
      prompt: ഒരേ പദം ആവർത്തിച്ചതാണോ (ദ്വിരുക്തി), രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ചേർത്തതാണോ?
      bins:
      - ദ്വിരുക്തി
      - രണ്ടു പദങ്ങളുടെ ചേർച്ച
      items:
      - label: പതുക്കെപ്പതുക്കെ
        bin: ദ്വിരുക്തി
        clue: ഇതിനെ രണ്ടായി പിരിച്ചാൽ രണ്ടു ഭാഗവും ഒന്നാണോ?
        why: 'പതുക്കെ + പതുക്കെ: തുടർച്ച കാണിക്കുന്ന ദ്വിരുക്തി.'
      - label: പദം പദം
        bin: ദ്വിരുക്തി
        clue: ഒരേ വാക്ക് രണ്ടു തവണ?
        why: ഓരോ ചുവടും എന്ന ക്രമം കാണിക്കുന്നു.
      - label: വീടുവീടാന്തരം
        bin: ദ്വിരുക്തി
        clue: '''വീട്'' എത്ര തവണ?'
        why: ഓരോ വീട്ടിലും എന്ന അർഥം.
      - label: മറവിരോഗം
        bin: രണ്ടു പദങ്ങളുടെ ചേർച്ച
        clue: 'മറവി + രോഗം: രണ്ടും ഒരേ വാക്കാണോ?'
        why: രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ചേർത്തെഴുതി.
      - label: തുമ്പപ്പൂ
        bin: രണ്ടു പദങ്ങളുടെ ചേർച്ച
        clue: തുമ്പ + പൂ. ആവർത്തനമുണ്ടോ?
        why: പ ഇരട്ടിച്ചെങ്കിലും രണ്ടു വ്യത്യസ്ത പദങ്ങൾ.
      - label: വേപ്പിലക്കട്ടി
        bin: രണ്ടു പദങ്ങളുടെ ചേർച്ച
        clue: വേപ്പില + കട്ടി. ഒരേ പദമാണോ?
        why: രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ചേർന്നത്.
    lesson:
      - teach: ഒരേ പദം രണ്ടുതവണ ആവർത്തിക്കുന്നതാണ് ദ്വിരുക്തി (പദാവർത്തനം). അത് തുടർച്ചയോ ക്രമമോ ഊന്നലോ നൽകുന്നു. പതുക്കെ + പതുക്കെ = പതുക്കെപ്പതുക്കെ (വളരെ സാവധാനം); പദം പദം = ഓരോ ചുവടും.
        check:
          prompt: '''പദം പദം'' എന്നതിൽ ഉള്ളത്:'
          options:
          - ദ്വിരുക്തി
          - ഉപമ
          - സമാസം
          answer: ദ്വിരുക്തി
          why: ഒരേ പദം രണ്ടുതവണ.
        ways:
        - style: real_world
          teach: 'ഒരു കുഞ്ഞ് നടക്കാൻ പഠിക്കുമ്പോൾ നമ്മൾ പറയും: ''പതുക്കെപ്പതുക്കെ''. ഒരേ വാക്ക് രണ്ടുതവണ പറയുമ്പോൾ അർഥത്തിന് ഊന്നൽ കൂടുന്നു — വളരെ സാവധാനം. ഇങ്ങനെ ഒരേ പദം ആവർത്തിക്കുന്നതാണ് ദ്വിരുക്തി (പദാവർത്തനം). അത് തുടർച്ചയോ ക്രമമോ ഊന്നലോ നൽകുന്നു. ''പദം പദം'' = ഓരോ ചുവടും.'
      - teach: 'ചേർത്തെഴുതുമ്പോൾ: രണ്ടാമത്തെ പദം ക, ച, ത, പ എന്നിവയിൽ തുടങ്ങിയാൽ ആ അക്ഷരം ഇരട്ടിക്കാം: പതുക്കെ + പതുക്കെ = പതുക്കെപ്പതുക്കെ. രണ്ടാമത്തേത് സ്വരത്തിൽ തുടങ്ങിയാൽ ആദ്യപദത്തിന്റെ അവസാനത്തെ ഉകാരം പോയി ചേരും: അടുത്ത് + അടുത്ത് = അടുത്തടുത്ത്.'
        picture:
          kind: compare
          columns:
          - title: ക/ച/ത/പ തുടക്കം
            points:
            - പതുക്കെ + പതുക്കെ → പതുക്കെപ്പതുക്കെ
            - തുള്ളി + തുള്ളി → തുള്ളിത്തുള്ളി
          - title: സ്വരം തുടക്കം
            points:
            - അടുത്ത് + അടുത്ത് → അടുത്തടുത്ത്
          alt: ദ്വിരുക്തി ചേർത്തെഴുതുമ്പോഴുള്ള രണ്ടു രീതികൾ.
        check:
          prompt: '''പതുക്കെപ്പതുക്കെ'' എന്നതിൽ ഇരട്ടിച്ച അക്ഷരം:'
          options:
          - പ
          - ക
          - ത
          answer: പ
          why: 'രണ്ടാമത്തെ പദം ''പ''യിൽ തുടങ്ങുന്നു: പ്പ.'
        ways:
        - style: step_by_step
          teach: 'ആവർത്തിച്ച പദങ്ങൾ ചേർത്തെഴുതാൻ രണ്ടാമത്തെ പദത്തിന്റെ ആദ്യ അക്ഷരം നോക്കൂ. ക, ച, ത, പ ഇവയിൽ ഒന്നാണോ? എങ്കിൽ ആ അക്ഷരം ഇരട്ടിക്കാം: പതുക്കെ + പതുക്കെ = പതുക്കെപ്പതുക്കെ. സ്വരത്തിൽ തുടങ്ങുന്നുവോ? എങ്കിൽ ആദ്യപദത്തിന്റെ അവസാനത്തെ ഉകാരം പോയി ചേരും: അടുത്ത് + അടുത്ത് = അടുത്തടുത്ത്.'
      - teach: 'സാധാരണ പദങ്ങൾ ചേർത്തെഴുതുന്നതും ഈ യൂണിറ്റിലുണ്ട്: മറവി + രോഗം = മറവിരോഗം; മഴ + കാലം = മഴക്കാലം. ഇവ ഒരേ പദത്തിന്റെ ആവർത്തനമല്ല, രണ്ടു വ്യത്യസ്ത പദങ്ങൾ ചേർന്നതാണ് — അതിനാൽ ദ്വിരുക്തിയല്ല.'
        check:
          prompt: '''മറവിരോഗം'' ദ്വിരുക്തിയാണോ?'
          options:
          - അല്ല; രണ്ടു വ്യത്യസ്ത പദങ്ങൾ
          - അതെ; ഒരേ പദം ആവർത്തിക്കുന്നു
          - അതെ; രണ്ടും നാമങ്ങൾ
          answer: അല്ല; രണ്ടു വ്യത്യസ്ത പദങ്ങൾ
          why: മറവി, രോഗം — വേറെ വേറെ പദങ്ങൾ.
        ways:
        - style: step_by_step
          teach: 'ദ്വിരുക്തിയാണോ എന്ന് ഒരു ചോദ്യംകൊണ്ട് പരിശോധിക്കൂ: ചേർന്ന രണ്ടു പദങ്ങളും ഒന്നുതന്നെയാണോ? പതുക്കെ + പതുക്കെ: ഒന്നുതന്നെ, അതിനാൽ ദ്വിരുക്തി. മഴ + കാലം = മഴക്കാലം; മറവി + രോഗം = മറവിരോഗം: രണ്ടും വ്യത്യസ്ത പദങ്ങൾ — ഇത് സാധാരണ ചേർത്തെഴുത്താണ്, ദ്വിരുക്തിയല്ല.'
    items:
      - prompt: "പതുക്കെ + പതുക്കെ ചേർത്തെഴുതുമ്പോൾ?"
        options: ["പതുക്കെപ്പതുക്കെ", "പതുക്കെപതുക്കെ", "പതുക്കപ്പതുക്കെ", "പതുക്കെയ്പതുക്കെ"]
        answer: "പതുക്കെപ്പതുക്കെ"
        difficulty: 1
        hints: ["'പ' ഇരട്ടിക്കുന്നു."]
        solution: "പതുക്കെപ്പതുക്കെ."
        mistakes: {"പതുക്കെപതുക്കെ": mal_doubling}
      - prompt: "'പതുക്കെപ്പതുക്കെ' എന്നതിന്റെ അർഥം?"
        options: ["വളരെ സാവധാനം, ക്രമേണ", "വളരെ വേഗം", "ഉടനെ", "ഒരിക്കലും"]
        answer: "വളരെ സാവധാനം, ക്രമേണ"
        difficulty: 1
        hints: ["ആവർത്തനം ഊന്നൽ കൂട്ടുന്നു."]
        solution: "ക്രമേണ, വളരെ സാവധാനം."
        mistakes: {"വളരെ വേഗം": mal_doubling}
      - prompt: "യൂണിറ്റിന്റെ പേരായ 'പദം പദം ഉറച്ചു നാം' — ഇതിലെ 'പദം പദം' എന്നതിന്റെ അർഥം?"
        options: ["ഓരോ ചുവടും", "ഓരോ വാക്കും എഴുതി", "പല ഭാഷകൾ", "രണ്ടു കാലുകൾ മാത്രം"]
        answer: "ഓരോ ചുവടും"
        difficulty: 2
        hints: ["ഇവിടെ പദം = കാലടി."]
        solution: "ഓരോ ചുവടും ഉറപ്പോടെ മുന്നോട്ട്."
        mistakes: {"ഓരോ വാക്കും എഴുതി": mal_word_meaning}
      - prompt: "മറവി + രോഗം ചേർത്തെഴുതുക."
        options: ["മറവിരോഗം", "മറവിറോഗം", "മറവ്രോഗം", "മറവിയ്രോഗം"]
        answer: "മറവിരോഗം"
        difficulty: 2
        hints: ["'ര' ഇരട്ടിക്കില്ല; വെറുതെ ചേർത്താൽ മതി."]
        solution: "മറവിരോഗം."
        mistakes: {"മറവിയ്രോഗം": mal_sandhi}
      - prompt: "താഴെ കൊടുത്തവയിൽ പദാവർത്തനം (ദ്വിരുക്തി) അല്ലാത്തത് ഏത്?"
        options: ["മഴക്കാലം", "വീടുവീടാന്തരം", "ചെറുതുചെറുതായി", "പതുക്കെപ്പതുക്കെ"]
        answer: "മഴക്കാലം"
        difficulty: 3
        hints: ["ഒരേ പദം ആവർത്തിക്കുന്നുണ്ടോ എന്ന് നോക്കുക."]
        solution: "മഴക്കാലം = മഴ + കാലം; ആവർത്തനമില്ല."
