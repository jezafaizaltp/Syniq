        - മഴ
        - ഉത്സവം
        - ട്രാഫിക്
        answer: കുട്ടികളുടെ ഫുട്ബോൾ കളി
        difficulty: 1
        hints:
        - പുറത്ത് കുട്ടികൾ ഒരു കളിയിലാണ്.
