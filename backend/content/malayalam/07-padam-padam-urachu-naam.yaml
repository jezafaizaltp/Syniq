      - രാജാവ് സമീറിനെ മന്ത്രിയാക്കുന്നു
      reasons:
        'രംഗം 61: അമ്പെയ്ത്ത്, വാൾപ്പയറ്റ്, കാട്ടുകുതിര': പരീക്ഷകൾ എഴുതാൻ സമീർ ആദ്യം ആ രാജ്യത്ത് എത്തണം.
        'രംഗം 62: രാജാവുമായി ചതുരംഗം': രംഗം 61-ലെ പരീക്ഷകൾക്കുശേഷമാണ് രംഗം 62.
        മനഃപൂർവം ഒരു നീക്കം പിഴയ്ക്കുന്നു: കളിക്കിടയിലാണ് ദയ രാജാവിനെ തോൽപ്പിക്കാതിരിക്കാൻ തീരുമാനിക്കുന്നത്.
        രാജാവ് സമീറിനെ മന്ത്രിയാക്കുന്നു: എല്ലാ പരീക്ഷകൾക്കും ശേഷമാണ് തീരുമാനം.
