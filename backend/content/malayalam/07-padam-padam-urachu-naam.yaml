        solution: "പത്ത് (10) വർഷം."
        mistakes: {"4": mal_read_again}
      - prompt: "നാലുമാസം മുമ്പ് അമ്മയ്ക്ക് എന്തു സംഭവിച്ചു?"
        options: ["നഗരത്തിലെ ട്രാഫിക്കിൽ വഴിതെറ്റിപ്പോയി", "വീണ് കാലൊടിഞ്ഞു", "ആശുപത്രിയിൽ പ്രവേശിപ്പിച്ചു", "ദീപുവിന്റെ സ്കൂളിൽ പോയി"]
        answer: "നഗരത്തിലെ ട്രാഫിക്കിൽ വഴിതെറ്റിപ്പോയി"
        difficulty: 2
        hints: ["ഓർമ്മക്കുറവ് കാരണം വഴി മറന്നു."]
        solution: "നഗരത്തിരക്കിൽ വഴിതെറ്റി."
        mistakes: {"വീണ് കാലൊടിഞ്ഞു": mal_read_again}
      - prompt: "കഥ വായിച്ചശേഷം ഏറ്റവും ഉചിതമായ നിരീക്ഷണം ഏത്?"
        options: ["മറവിരോഗമുള്ളവരെ ക്ഷമയോടെയും സ്നേഹത്തോടെയും പരിചരിക്കുന്നതാണ് പ്രധാനം", "രോഗികളെ ഒറ്റയ്ക്കു വിടണം", "പഴയ ഫോട്ടോകൾ നശിപ്പിക്കണം", "ഓർമ്മക്കുറവ് ഒരു തമാശയാണ്"]
        answer: "മറവിരോഗമുള്ളവരെ ക്ഷമയോടെയും സ്നേഹത്തോടെയും പരിചരിക്കുന്നതാണ് പ്രധാനം"
        difficulty: 3
        hints: ["മകൾ അമ്മയോട് പെരുമാറുന്ന രീതി."]
        solution: "കരുതലും ക്ഷമയുമാണ് കഥയുടെ സന്ദേശം."
        mistakes: {"രോഗികളെ ഒറ്റയ്ക്കു വിടണം": mal_tathagata}
      - prompt: "ഡോക്ടർ 'reaction matters' എന്നു പറഞ്ഞു. ഇതനുസരിച്ച് അമ്മ 'അമ്മിണിക്കുട്ടി എവിടെ?' എന്ന് വീണ്ടും വീണ്ടും ചോദിക്കുമ്പോൾ ഏറ്റവും ഉചിതമായ പെരുമാറ്റം?"
        options: ["ക്ഷമയോടെ, ശാന്തമായി, അമ്മയെ വേദനിപ്പിക്കാതെ മറുപടി പറയുക", "അമ്മയോട് ദേഷ്യപ്പെടുക", "ചോദ്യം കേട്ടില്ലെന്നു നടിക്കുക", "അമ്മയെ മുറിയിൽ പൂട്ടിയിടുക"]
        answer: "ക്ഷമയോടെ, ശാന്തമായി, അമ്മയെ വേദനിപ്പിക്കാതെ മറുപടി പറയുക"
        difficulty: 3
        hints: ["അമ്മ മനഃപൂർവം മറക്കുന്നതാണോ?", "നമ്മുടെ പ്രതികരണം അമ്മയിൽ എന്തു മാറ്റമുണ്ടാക്കും?"]
        solution: "Step 1: മറവി രോഗം കൊണ്ടാണ്; അമ്മയുടെ കുറ്റമല്ല. Step 2: ദേഷ്യമല്ല, ക്ഷമയും സ്നേഹവുമാണ് അമ്മയെ സുരക്ഷിതയാക്കുന്നത്."
        mistakes: {"അമ്മയോട് ദേഷ്യപ്പെടുക": mal_tathagata, "ചോദ്യം കേട്ടില്ലെന്നു നടിക്കുക": mal_tathagata, "അമ്മയെ മുറിയിൽ പൂട്ടിയിടുക": mal_tathagata}
      - prompt: "ജനലിനരികിൽ അമ്മയോടൊപ്പമിരുന്ന് കുട്ടികൾ ഫുട്ബോൾ കളിക്കുന്നത് മകൾ കാണുന്ന രംഗം കഥയിൽ എന്തു നൽകുന്നു?"
        options: ["മറവിയുടെ വേദനയ്ക്കിടയിലും അമ്മയും മകളും പങ്കിടുന്ന ശാന്തമായ ഒരു നിമിഷം", "മകൾക്ക് ഫുട്ബോൾ കളിക്കാനുള്ള ആഗ്രഹം", "അമ്മയുടെ രോഗം പൂർണ്ണമായി മാറിയത്", "ദീപുവിന്റെ സ്കൂൾ തുറന്നത്"]
        answer: "മറവിയുടെ വേദനയ്ക്കിടയിലും അമ്മയും മകളും പങ്കിടുന്ന ശാന്തമായ ഒരു നിമിഷം"
        difficulty: 3
        hints: ["ഈ രംഗത്തിൽ മകൾ എന്താണ് ചെയ്യുന്നത്: അമ്മയെ ശാസിക്കുകയാണോ കൂടെയിരിക്കുകയാണോ?", "രോഗം മാറിയെന്ന് കഥയിൽ എവിടെയെങ്കിലും പറയുന്നുണ്ടോ?"]
        solution: "Step 1: രോഗം മാറിയിട്ടില്ല. Step 2: എന്നിട്ടും മകൾ അമ്മയോടൊപ്പം ഇരുന്ന് ഒരേ കാഴ്ച കാണുന്നു: വേദനയ്ക്കിടയിലെ സ്നേഹത്തിന്റെ ഒരു കൊച്ചുനിമിഷം."
        mistakes: {"മകൾക്ക് ഫുട്ബോൾ കളിക്കാനുള്ള ആഗ്രഹം": mal_think_why, "അമ്മയുടെ രോഗം പൂർണ്ണമായി മാറിയത്": mal_tathagata, "ദീപുവിന്റെ സ്കൂൾ തുറന്നത്": mal_read_again}
      - prompt: '''തഥാഗത'' ഉൾപ്പെട്ട സമാഹാരം:'
        options:
        - അഷിതയുടെ കഥകൾ
        - സീതാദർശനം
        - തണുപ്പ്
        - പ്രണയം അഞ്ചടി ഏഴിഞ്ച്
        answer: അഷിതയുടെ കഥകൾ
        difficulty: 1
        hints:
        - എഴുത്തുകാരിയുടെ പേരുതന്നെ സമാഹാരത്തിന്റെ പേരിലുണ്ട്.
        - കഥകളുടെ ഒരു ശേഖരം.
        solution: '''അഷിതയുടെ കഥകൾ'' എന്ന സമാഹാരം.'
        mistakes:
          സീതാദർശനം: mal_tathagata
      - prompt: മകൾ അമ്മയ്ക്ക് മരുന്നു കൊടുക്കുന്നത് എത്ര മണിക്ക്?
