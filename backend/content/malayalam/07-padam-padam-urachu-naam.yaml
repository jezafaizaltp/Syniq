  - code: mal9.u7.tathagata
    title: തഥാഗത
    notes: |
      അഷിതയുടെ 'അഷിതയുടെ കഥകൾ' എന്ന സമാഹാരത്തിലെ കഥ. അമ്മയ്ക്ക് അൽഷിമേഴ്സ് (മറവിരോഗം). ഡോക്ടർ
      പറഞ്ഞു: "reaction matters" — നമ്മുടെ പ്രതികരണമാണ് പ്രധാനം. പത്തു വർഷം മുമ്പ് മരിച്ച ചേച്ചി
      അമ്മിണിക്കുട്ടിയുടെ ഫോട്ടോയിൽ അമ്മ നോക്കിയിരിക്കുന്നു. അനിയൻ ദീപുവിന്റെ സ്കൂൾ തുറക്കുന്നു. കഥ
      പറയുന്ന മകൾ പന്ത്രണ്ടു മണിക്ക് മരുന്നു കൊടുക്കുന്നു; ജനലിനരികിൽ അമ്മയോടൊപ്പമിരുന്ന് കുട്ടികൾ ഫുട്ബോൾ
      കളിക്കുന്നത് കാണുന്നു. നാലുമാസം മുമ്പ് അമ്മ നഗരത്തിലെ ട്രാഫിക്കിൽ വഴിതെറ്റിപ്പോയിരുന്നു. "അമ്മയുടെ
      അമ്മിണിക്കുട്ടിയെ?" എന്ന ചോദ്യത്തിന് "അമ്മിണിക്കുട്ടി മരിച്ചുപോയി" എന്ന ഉത്തരം. ഓർമ്മ മാഞ്ഞുപോകുന്ന
      അമ്മയോടുള്ള മക്കളുടെ സ്നേഹവും ക്ഷമയും വേദനയുമാണ് കഥ. ബന്ധപ്പെട്ടത്: സാവിത്രി രാജീവന്റെ 'അമ്മയെ
      കുളിപ്പിക്കുമ്പോൾ'. ഭാഷ: പദങ്ങൾ ചേർത്തെഴുതൽ.
    explanations:
      text: "ഒരുകാലത്ത് മക്കളെ നോക്കിയിരുന്ന അമ്മയെ ഇന്ന് മക്കൾ കുഞ്ഞിനെയെന്നപോലെ നോക്കുന്നു. ഓർമ്മ നഷ്ടപ്പെട്ട ഒരാളോട് ക്ഷമയോടെ, സ്നേഹത്തോടെ പെരുമാറുന്നതാണ് ഏറ്റവും വലിയ മരുന്ന്."
      visual: "ഒരു ജനൽ: അകത്ത് അമ്മയും മകളും, ചുമരിൽ അമ്മിണിക്കുട്ടിയുടെ ഫോട്ടോ, മേശയിൽ 12 മണിക്കുള്ള മരുന്ന്; പുറത്ത് ഫുട്ബോൾ കളിക്കുന്ന കുട്ടികൾ."
