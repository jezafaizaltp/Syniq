        - വിറ്റ ശേഷം മരം ആരുടേതാണ്?
        - മുറിക്കണോ വേണ്ടയോ എന്നു പറയാനുള്ള അവകാശം.
        solution: വിറ്റതോടെ മരത്തിന്മേലുള്ള ഉടമസ്ഥാവകാശവും പോയി; ഇനി മുറിക്കുന്നത് തടയാനാവില്ല.
        mistakes:
          പറമ്പ് മുഴുവൻ: mal_tamarind
      - prompt: '''പൂത്തിരി കത്തിച്ചെങ്ങളെ നൃത്തം തത്തിക്കാനില്ലിനിയാരും'' — ഈ വരിയിലെ ഭാവം:'
        options:
        - നഷ്ടബോധവും ദുഃഖവും
        - ആഘോഷവും സന്തോഷവും
        - ദേഷ്യവും പ്രതികാരവും
        - ഭയവും പരിഭ്രമവും
        answer: നഷ്ടബോധവും ദുഃഖവും
        difficulty: 3
        hints:
        - '''ഇനി ആരുമില്ല'' എന്ന വാക്കുകൾ ശ്രദ്ധിക്കൂ.'
        - മരം പോയതോടെ കാറ്റിനു നഷ്ടമായതെന്ത്?
        solution: മരമില്ലാതായതോടെ കാറ്റിന് നൃത്തം ചെയ്യാനിടമില്ല; നഷ്ടബോധമാണ് ഭാവം.
        mistakes:
          ആഘോഷവും സന്തോഷവും: m2_puli_symbol
      - prompt: 'ഈ കവിതയുടെ ആശയത്തോട് ഏറ്റവും ചേരുന്ന ഇന്നത്തെ പ്രവൃത്തി:'
        options:
        - ലാഭത്തിനായി മരങ്ങൾ മുറിക്കാതെ സംരക്ഷിക്കുക
        - പഴയ മരങ്ങളെല്ലാം വിറ്റ് പുതിയ വീട് പണിയുക
        - കിളികളെ പറമ്പിൽനിന്ന് ഓടിക്കുക
        - പാടം നികത്തി കെട്ടിടം പണിയുക
        answer: ലാഭത്തിനായി മരങ്ങൾ മുറിക്കാതെ സംരക്ഷിക്കുക
        difficulty: 3
        hints:
        - കവി ആരെയാണ് വിമർശിക്കുന്നത്?
        - ആവശ്യവും അത്യാർത്തിയും തമ്മിലുള്ള വ്യത്യാസം ഓർക്കൂ.
        solution: ലാഭക്കൊതിക്കെതിരെയാണ് കവിത; മരങ്ങളെ സംരക്ഷിക്കുന്നതാണ് അതിനോട് ചേരുന്നത്.
        mistakes:
          പഴയ മരങ്ങളെല്ലാം വിറ്റ് പുതിയ വീട് പണിയുക: mal_tamarind

  - code: mal9.u2.prakruthipadangal
    title: പ്രകൃതിപാഠങ്ങൾ
    after: [mal9.u2.pulimavu]
    notes: |
      ഡോ. കെ. എസ്. രവികുമാറിന്റെ 'സഹ്യകാനനത്തിൽ വിരിഞ്ഞ കവിത' എന്ന കൃതിയിൽനിന്ന്, വൈലോപ്പിള്ളി
      ശ്രീധരമേനോന്റെ കവിതയെക്കുറിച്ചുള്ള പഠനം. ഇരുപതാംനൂറ്റാണ്ടിന്റെ സങ്കീർണ്ണമായ ഹൃദയതാളം
      ആവിഷ്കരിച്ച കവി. അടിയാധാരം മാനവികതാബോധം: മനുഷ്യന്റെ കർമ്മശേഷിയിലും ലോകത്തെ മാറ്റിപ്പണിയാനുള്ള
      ഇച്ഛയിലുമുള്ള വിശ്വാസം — "മർത്യവീര്യമീയദ്രിയെ വെല്ലും" (അദ്രി = പർവതം). കാട് നാടാക്കുന്നവർ,
      പുഴയെ അണകെട്ടി മെരുക്കുന്നവർ... 'എന്റെ ഗ്രാമം': കൊച്ചി നഗരം സമീപഗ്രാമമായ ഇടപ്പള്ളിയെ
      വിഴുങ്ങുന്ന ചിത്രം; "കാളവണ്ടിയുഗത്തിൽനിന്ന് സ്പുട്നിക് യുഗത്തിലേക്കുള്ള കുതിപ്പ്". 'യുഗപരിവർത്തനം'.
      പിന്നീട് എല്ലാം മനുഷ്യനുവേണ്ടി എന്ന കാഴ്ചപ്പാടിൽനിന്ന് പ്രകൃതിയുടെ നിലനിൽപ്പ് മനുഷ്യന്റെ
      നിലനിൽപ്പിന് അനിവാര്യമാണ് എന്ന തിരിച്ചറിവിലേക്ക് (എൺപതുകളിൽ). 'മൃതസഞ്ജീവനി' എന്ന കാവ്യനാടകം:
      കമ്പനിയുടെ വിഷമൊഴുക്ക് പുഴയെ 'പൂതന'യാക്കി, മീനുകൾ ചത്തുപൊങ്ങി; വൻകിട അണക്കെട്ടുകൾ
      ആദിവാസികളെ കുടിയിറക്കുന്നു. 'പുരയ്ക്കു തീപിടിക്കുമ്പോൾ വാഴ വെട്ടുക' (മറ്റൊരാളുടെ ദുരിതം
      സ്വന്തം ലാഭത്തിന് ഉപയോഗിക്കുക) എന്ന ശൈലി: കൊള്ളലാഭത്തിനായി വനം വെട്ടുന്നവർ. പരിസ്ഥിതിക
      വിവേകം: മനുഷ്യൻ പ്രകൃതിയെ കീഴ്പ്പെടുത്തുന്നവനല്ല, പ്രകൃതിയോടിണങ്ങി ജീവിക്കുന്നവൻ.
    explanations:
      text: "വൈലോപ്പിള്ളി ആദ്യം മനുഷ്യന്റെ ശക്തിയെ പാടി: മലകളെ ജയിക്കുന്ന മനുഷ്യൻ. പിന്നീട് വികസനം പ്രകൃതിയെ തകർക്കുന്നതു കണ്ട് അദ്ദേഹം ഓർമ്മിപ്പിച്ചു: പ്രകൃതിയില്ലെങ്കിൽ മനുഷ്യനുമില്ല."
      visual: "ഒരു രണ്ടുഭാഗച്ചിത്രം: ഇടത്ത് കാളവണ്ടി, പാടം, ഗ്രാമം; വലത്ത് റോക്കറ്റ്, ഫാക്ടറി, വിഷമൊഴുകുന്ന പുഴ. നടുവിൽ ഒരു ചോദ്യചിഹ്നം: 'ഈ കുതിപ്പിന്റെ വില?'"
      step_by_step: "'പുരയ്ക്കു തീപിടിക്കുമ്പോൾ വാഴ വെട്ടുക' — 1. വീടു കത്തുമ്പോൾ എല്ലാവരും തീ കെടുത്താൻ ഓടുന്നു. 2. ആ തിരക്കിൽ ഒരാൾ വാഴക്കുല വെട്ടിക്കൊണ്ടുപോകുന്നു. 3. മറ്റുള്ളവരുടെ ദുരിതം സ്വന്തം ലാഭത്തിനാക്കൽ."
      real_world: "പെരിയാറിലെ മീൻചാകൽ, നഗരമാലിന്യം, അണക്കെട്ടുകൾമൂലമുള്ള കുടിയിറക്കം — വൈലോപ്പിള്ളി കണ്ട പ്രശ്നങ്ങൾ ഇന്നും വാർത്തകളിലുണ്ട്."
    activity:
      type: order
      prompt: വൈലോപ്പിള്ളിയുടെ കാഴ്ചപ്പാട് കാലക്രമത്തിൽ എങ്ങനെ മാറി? ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - '"മർത്യവീര്യമീയദ്രിയെ വെല്ലും": മനുഷ്യശേഷിയിൽ വിശ്വാസം'
      - '''എന്റെ ഗ്രാമം'': നഗരം ഗ്രാമത്തെ വിഴുങ്ങുന്നു'
      - 'എൺപതുകൾ: പ്രകൃതി നിലനിന്നാലേ മനുഷ്യനുള്ളൂ'
      reasons:
        '''എന്റെ ഗ്രാമം'': നഗരം ഗ്രാമത്തെ വിഴുങ്ങുന്നു': മാറ്റത്തിന്റെ വിലയെക്കുറിച്ചുള്ള ആശങ്ക വരുന്നത് മനുഷ്യൻ പ്രകൃതിയെ മാറ്റിപ്പണിയാൻ തുടങ്ങിയശേഷമാണ്.
        'എൺപതുകൾ: പ്രകൃതി നിലനിന്നാലേ മനുഷ്യനുള്ളൂ': 'ലേഖനം പറയുന്നു: ''എല്ലാം മനുഷ്യനുവേണ്ടി'' എന്നതിൽനിന്ന് പിന്നീട് ഈ തിരിച്ചറിവിലേക്ക്.'
    lesson:
      - teach: '''പ്രകൃതിപാഠങ്ങൾ'' ഡോ. കെ. എസ്. രവികുമാറിന്റെ ''സഹ്യകാനനത്തിൽ വിരിഞ്ഞ കവിത'' എന്ന കൃതിയിലെ ഭാഗമാണ്. ഇത് ഒരു കവിതയല്ല; വൈലോപ്പിള്ളി ശ്രീധരമേനോന്റെ കവിതകളെക്കുറിച്ചുള്ള ഒരു പഠനമാണ്.'
        check:
          prompt: '''പ്രകൃതിപാഠങ്ങൾ'' ഏതുതരം രചനയാണ്?'
          options:
          - കവിതകളെക്കുറിച്ചുള്ള പഠനം
          - നോവൽഭാഗം
          - കവിത
          answer: കവിതകളെക്കുറിച്ചുള്ള പഠനം
          why: വൈലോപ്പിള്ളിക്കവിതകളെക്കുറിച്ച് രവികുമാർ എഴുതിയ പഠനം.
      - teach: 'ആദ്യഘട്ടത്തിൽ വൈലോപ്പിള്ളിക്കവിതയുടെ അടിയാധാരം മാനവികതാബോധമാണ്: മനുഷ്യന്റെ കർമ്മശേഷിയിലും ലോകം മാറ്റിപ്പണിയാനുള്ള ഇച്ഛയിലും വിശ്വാസം. ''മർത്യവീര്യമീയദ്രിയെ വെല്ലും'' (അദ്രി = പർവതം). കാട് നാടാക്കുന്നവർ, പുഴയെ അണകെട്ടി മെരുക്കുന്നവർ. ''എന്റെ ഗ്രാമ''ത്തിൽ കൊച്ചി നഗരം ഇടപ്പള്ളിയെ വിഴുങ്ങുന്നു.'
        picture:
          kind: compare
          columns:
          - title: ആദ്യഘട്ടം
            points:
            - മാനവികതാബോധം
            - മനുഷ്യശക്തിയിൽ വിശ്വാസം
            - '''മർത്യവീര്യമീയദ്രിയെ വെല്ലും'''
          - title: പിൽക്കാലം (എൺപതുകൾ)
            points:
            - പരിസ്ഥിതിക വിവേകം
            - പ്രകൃതിയില്ലെങ്കിൽ മനുഷ്യനില്ല
            - '''മൃതസഞ്ജീവനി'''
          alt: വൈലോപ്പിള്ളിക്കവിതയുടെ രണ്ടു ഘട്ടങ്ങൾ.
        check:
          prompt: '''മർത്യവീര്യമീയദ്രിയെ വെല്ലും'' — ''അദ്രി'' എന്നാൽ:'
          options:
          - പർവതം
          - പുഴ
          - കാട്
          answer: പർവതം
          why: അദ്രി = പർവതം; മനുഷ്യശക്തി മലയെയും ജയിക്കും.
      - teach: 'പിന്നീട് (എൺപതുകളിൽ) കവിയുടെ കാഴ്ച മാറി: എല്ലാം മനുഷ്യനുവേണ്ടി എന്നതിൽനിന്ന്, പ്രകൃതിയുടെ നിലനിൽപ്പ് മനുഷ്യന്റെ നിലനിൽപ്പിന് അനിവാര്യമാണ് എന്ന തിരിച്ചറിവിലേക്ക്. ''മൃതസഞ്ജീവനി''യിൽ കമ്പനിയുടെ വിഷം പുഴയെ ''പൂതന''യാക്കുന്നു, മീനുകൾ ചത്തുപൊങ്ങുന്നു; വൻ അണക്കെട്ടുകൾ ആദിവാസികളെ കുടിയിറക്കുന്നു.'
        check:
          prompt: 'പിൽക്കാലത്ത് വൈലോപ്പിള്ളിയിൽ ഉണ്ടായ തിരിച്ചറിവ്:'
          options:
          - പ്രകൃതിയുടെ നിലനിൽപ്പ് മനുഷ്യന്റെ നിലനിൽപ്പിന് അനിവാര്യം
          - മനുഷ്യൻ പ്രകൃതിയെ കീഴ്പ്പെടുത്തണം
          - നഗരമാണ് ഗ്രാമത്തേക്കാൾ നല്ലത്
          answer: പ്രകൃതിയുടെ നിലനിൽപ്പ് മനുഷ്യന്റെ നിലനിൽപ്പിന് അനിവാര്യം
          why: ഇതാണ് പരിസ്ഥിതിക വിവേകം.
    items:
