subject: mal
chapter: 2
title: "കേരളപാഠാവലി 2: ഭൂമിയാകുന്നു നാം"

tips:
  mal_samasa_kind: "സമസ്തപദം പിരിച്ചെഴുതി നോക്കൂ: ഏതു പദത്തിനാണ് പ്രാധാന്യം? ആദ്യപദം വിശേഷണമാണോ? രണ്ടിനും തുല്യമാണോ? അതോ രണ്ടുമല്ലാത്ത മറ്റൊരാളെയാണോ പറയുന്നത്?"
  mal_elephant_doctor: "ആനക്കുട്ടിക്ക് പരിക്കുപറ്റിയത് വിനോദസഞ്ചാരികൾ കാട്ടിൽ ഉപേക്ഷിച്ച ഒരു വസ്തു കൊണ്ടാണ്. പാഠത്തിൽ ആനക്കുട്ടിയുടെ പ്രായവും ഡോക്ടർ അതിനെ മുമ്പ് കണ്ട കാര്യവും വീണ്ടും വായിക്കൂ."
  mal_tamarind: "'പുളിമാവു വെട്ടി' (ഇടശ്ശേരി): പണത്തിനുവേണ്ടി പുളിമരം വെട്ടുന്ന മനുഷ്യന്റെ ലാഭക്കൊതിയും, അതോടെ കിളികൾക്കും കാറ്റിനും നാട്ടുകാർക്കും നഷ്ടമാകുന്നതും."
  mal_vyloppilli: "'പ്രകൃതിപാഠങ്ങൾ' (ഡോ. കെ. എസ്. രവികുമാർ) വൈലോപ്പിള്ളിക്കവിതയെക്കുറിച്ച്: ആദ്യം മനുഷ്യശക്തിയിലുള്ള വിശ്വാസം (മാനവികത); പിന്നീട് പ്രകൃതിയുടെ നിലനിൽപ്പ് മനുഷ്യന്റെ നിലനിൽപ്പിന് അനിവാര്യമാണെന്ന ബോധം."
  mal_samasam: "സമാസം പിരിച്ചെഴുതുമ്പോൾ രണ്ടു പദങ്ങൾ തമ്മിലുള്ള ബന്ധം നോക്കൂ: ഒന്നിന്റെ ഭാഗമാണോ, ഒന്ന് മറ്റേതിനെ വിശേഷിപ്പിക്കുന്നോ, രണ്ടിനും തുല്യപ്രാധാന്യമാണോ, ഒന്നുകൊണ്ട് മറ്റേത് പ്രവർത്തിക്കുന്നോ?"
  mal_pulimavu_birds: "'പറവകളേ' എന്ന വിളി ശ്രദ്ധിക്കൂ. മരം വീണതോടെ കൂടു നഷ്ടപ്പെട്ടവർ ആരാണ്?"
  mal_shaili_vazha: "വീട് കത്തുന്ന നേരത്ത് സഹായിക്കാതെ സ്വന്തം വാഴ വെട്ടുന്നയാൾ: ഇയാൾ ആരുടെ ലാഭം നോക്കുന്നു, ആരുടെ ദുരിതം മുതലെടുക്കുന്നു?"

concepts:
  - code: mal9.u2.anadoctor
    title: ആനഡോക്ടർ
    notes: |
      ജയമോഹന്റെ 'ആനഡോക്ടർ' എന്ന നോവലിലെ ഭാഗം. മുതുമലയിലെ മൃഗഡോക്ടറാണ് 'ഡോ. കെ.' എന്നറിയപ്പെടുന്ന
      കൃഷ്ണമൂർത്തി. മുമ്പ്, വിനോദസഞ്ചാരികൾ വലിച്ചെറിഞ്ഞ കുപ്പിച്ചില്ല് കാലിൽ തറഞ്ഞ ഒരു പിടിയാനയെ
      അദ്ദേഹം രക്ഷിച്ചു. ഒന്നരക്കൊല്ലത്തിനുശേഷം ഒരു രാത്രി പത്തുമണി കഴിഞ്ഞ്, അതേ അവസ്ഥയിലുള്ള രണ്ടു
      വയസ്സുള്ള കുട്ടിയാന ആനക്കൂട്ടത്തോടൊപ്പം ടോപ്പ് സ്ലിപ്പിലെ ഡോക്ടറുടെ വീട്ടിലെത്തുന്നു. "ഈസി!
      ഈസി!"; സൂചിയിലൂടെ മയക്കുമരുന്ന്; ഫോർസെപ്സുകൊണ്ട് ചില്ല് വലിച്ചെടുത്തു: "Well, almost clean.
      Lucky guy." ചൂട് തലയിൽ കയറാതിരിക്കാൻ ആഖ്യാതാവ് കാതിൽ വെള്ളമൊഴിച്ചു. "He is a tusker. My
      alpha male." — ഇത് അന്ന് രക്ഷിച്ച പിടിയാനയുടെ കുഞ്ഞാണ്; ആന മനുഷ്യമുഖങ്ങൾ ഓർമ്മിച്ചുവയ്ക്കും.
      മുതുമലയിൽനിന്ന് പത്തു സ്ഥലത്തെങ്കിലും ഗ്രാമങ്ങളിലൂടെ, നാലിടത്ത് റോഡ് മുറിച്ചുകടന്നാണ് വരവ്.
      ഒടുവിൽ മുപ്പതോളം ആനകൾ തുമ്പിക്കൈ പൊക്കി ചിന്നംവിളിച്ചു — "ദേവദുന്ദുഭികൾ മുഴങ്ങി". ഭാഷ:
      "പുറത്തുനിന്ന് വെള്ളച്ചാട്ടംപോലെ തണുത്ത കാറ്റ് അകത്തേക്കു വന്നു. ഇരുട്ട് വലിയ കറുത്ത
      തിരശ്ശീലപോലെ തൂങ്ങിക്കിടന്നു." ബന്ധപ്പെട്ടത്: കുമാരനാശാന്റെ 'ചിന്താവിഷ്ടയായ സീത'.
    explanations:
      text: "മനുഷ്യന്റെ അശ്രദ്ധ (കാട്ടിൽ എറിഞ്ഞ കുപ്പി) കാട്ടുമൃഗങ്ങളെ മുറിവേൽപ്പിക്കുന്നു. പക്ഷേ ഒരു ഡോക്ടറുടെ കരുണ ആനകളുടെ മനസ്സിൽ പതിയുന്നു: അമ്മയെ രക്ഷിച്ചയാളെ തേടി കുട്ടിയാന കിലോമീറ്ററുകൾ നടന്നുവരുന്നു."
      visual: "രാത്രിയിൽ ഒരു വീട്ടുമുറ്റം: ടോർച്ച് വെളിച്ചത്തിൽ കാലിലെ മുറിവ് നോക്കുന്ന ഡോക്ടർ, ബക്കറ്റിൽ വെള്ളവുമായി ആഖ്യാതാവ്, ഇരുട്ടിൽ വലയം ചെയ്ത് നിൽക്കുന്ന മുപ്പതോളം ആനകൾ."
      step_by_step: "കുട്ടിയാന എങ്ങനെ ഡോക്ടറെ കണ്ടെത്തി? 1. ഒന്നരക്കൊല്ലം മുമ്പ് അമ്മയെ ചികിത്സിച്ചപ്പോൾ അത് കൂടെയുണ്ടായിരുന്നു. 2. ആന മുഖങ്ങളും വഴികളും ഓർമ്മിക്കും. 3. അതിനാൽ സഹായം തേടി അതേ ഡോക്ടറുടെ അടുത്തെത്തി."
      real_world: "വനപാതകളിലും വിനോദകേന്ദ്രങ്ങളിലും പ്ലാസ്റ്റിക്കും കുപ്പിയും വലിച്ചെറിയരുത് — അവ മൃഗങ്ങളുടെ ജീവനെടുക്കാം."
    activity:
      type: order
      prompt: '''ആനഡോക്ടർ'' എന്ന ഭാഗത്തെ സംഭവങ്ങൾ ക്രമത്തിൽ വയ്ക്കൂ.'
      steps:
      - ഡോക്ടർ പിടിയാനയുടെ കാലിലെ ചില്ലെടുക്കുന്നു
      - ഒന്നരക്കൊല്ലത്തിനുശേഷം ആനക്കൂട്ടം വീട്ടിലെത്തുന്നു
      - കുട്ടിയാനയ്ക്ക് മയക്കുമരുന്ന് കുത്തിവയ്ക്കുന്നു
      - ഫോർസെപ്സുകൊണ്ട് ചില്ല് വലിച്ചെടുക്കുന്നു
      - '"Well, almost clean. Lucky guy."'
      reasons:
        ഒന്നരക്കൊല്ലത്തിനുശേഷം ആനക്കൂട്ടം വീട്ടിലെത്തുന്നു: '''ഒന്നരക്കൊല്ലത്തിനുശേഷം'': എന്തിനുശേഷം? ആദ്യം പിടിയാനയെ രക്ഷിച്ച സംഭവം വേണം.'
        കുട്ടിയാനയ്ക്ക് മയക്കുമരുന്ന് കുത്തിവയ്ക്കുന്നു: ആന വീട്ടിലെത്തിയശേഷമേ ചികിത്സ തുടങ്ങാനാകൂ.
        ഫോർസെപ്സുകൊണ്ട് ചില്ല് വലിച്ചെടുക്കുന്നു: ആന മയങ്ങിയശേഷമേ സുരക്ഷിതമായി ചില്ലെടുക്കാനാകൂ.
        '"Well, almost clean. Lucky guy."': മുറിവ് വൃത്തിയായി എന്നു പറയുന്നത് ചില്ലെടുത്തശേഷമാണ്.
    items:
      - prompt: "'ആനഡോക്ടർ' എന്ന നോവൽ എഴുതിയതാര്?"
        options: ["ജയമോഹൻ", "ഇടശ്ശേരി ഗോവിന്ദൻനായർ", "കെ. എസ്. രവികുമാർ", "പ്രഭാവർമ്മ"]
        answer: "ജയമോഹൻ"
        difficulty: 1
        hints: ["പാഠത്തിന്റെ ഒടുവിൽ [ ] ൽ."]
        solution: "ജയമോഹൻ."
        mistakes: {"പ്രഭാവർമ്മ": mal_author_work}
      - prompt: "കുട്ടിയാനയുടെ കാലിൽ തറച്ചിരുന്നതെന്ത്?"
        options: ["കുപ്പിച്ചില്ല്", "മുള്ള്", "അമ്പ്", "ആണി"]
        answer: "കുപ്പിച്ചില്ല്"
        difficulty: 1
        hints: ["വിനോദസഞ്ചാരികൾ വലിച്ചെറിഞ്ഞത്."]
        solution: "വിനോദസഞ്ചാരികൾ എറിഞ്ഞ കുപ്പിയുടെ ചില്ല്."
        mistakes: {"മുള്ള്": mal_elephant_doctor}
      - prompt: "കുട്ടിയാനയുടെ പ്രായം (വയസ്സ്):"
        answer: "2"
        check: "2"
        difficulty: 1
        hints: ["'രണ്ടു വയസ്സ്' എന്ന് ഡോക്ടർ."]
        solution: "രണ്ടു വയസ്സ്."
        mistakes: {"10": mal_elephant_doctor}
      - prompt: "ഡോക്ടർ ആഖ്യാതാവിനോട് ആനയുടെ കാതിൽ വെള്ളമൊഴിക്കാൻ പറഞ്ഞതെന്തിന്?"
        options: ["ചൂട് തലയിൽ കയറാതിരിക്കാൻ", "ആനയെ ഉണർത്താൻ", "മുറിവ് കഴുകാൻ", "ആനയെ കുളിപ്പിക്കാൻ"]
        answer: "ചൂട് തലയിൽ കയറാതിരിക്കാൻ"
        difficulty: 2
        hints: ["'കാത് നിലച്ചാൽ തലയ്ക്ക് ചൂട് കയറിയേക്കും'."]
        solution: "മയങ്ങിക്കിടക്കുമ്പോൾ തലയിൽ ചൂട് കയറാതിരിക്കാൻ."
        mistakes: {"മുറിവ് കഴുകാൻ": mal_read_again}
      - prompt: "ഈ കുട്ടിയാനയെ ഡോക്ടർ മുമ്പ് കണ്ടിട്ടുണ്ടായിരുന്നത് എങ്ങനെ?"
        options: ["ഒന്നരക്കൊല്ലം മുമ്പ് ചികിത്സിച്ച പിടിയാനയുടെ കൂടെയുണ്ടായിരുന്ന കുഞ്ഞ്", "ഒരു മൃഗശാലയിൽ", "ടിവിയിൽ", "ഒരിക്കലും കണ്ടിട്ടില്ല"]
        answer: "ഒന്നരക്കൊല്ലം മുമ്പ് ചികിത്സിച്ച പിടിയാനയുടെ കൂടെയുണ്ടായിരുന്ന കുഞ്ഞ്"
        difficulty: 2
        hints: ["'അപ്പോൾ ഒപ്പമുണ്ടായിരുന്ന കുഞ്ഞ് ഇവനാണ്'."]
        solution: "അമ്മയാനയെ രക്ഷിച്ചപ്പോൾ കൂടെയുണ്ടായിരുന്ന കുഞ്ഞ്."
        mistakes: {"ഒരിക്കലും കണ്ടിട്ടില്ല": mal_elephant_doctor}
      - prompt: "'ഇരുട്ട് വലിയ കറുത്ത തിരശ്ശീലപോലെ തൂങ്ങിക്കിടന്നു' — ഈ പ്രയോഗം ഗദ്യത്തിന് നൽകുന്നത്:"
        options: ["കാഴ്ചയുടെ തീവ്രതയും ഭംഗിയും (ഉപമ)", "ഒരു വിവരം മാത്രം", "ചോദ്യരൂപം", "തമാശ"]
        answer: "കാഴ്ചയുടെ തീവ്രതയും ഭംഗിയും (ഉപമ)"
        difficulty: 3
        hints: ["'പോലെ' ഉപയോഗിച്ചുള്ള താരതമ്യം."]
        solution: "ഇരുട്ടിനെ തിരശ്ശീലയോട് ഉപമിച്ച് ദൃശ്യം കണ്ണിനു മുന്നിൽ കൊണ്ടുവരുന്നു."
        mistakes: {"ഒരു വിവരം മാത്രം": mal_imagery}
      - prompt: "ഒന്നരക്കൊല്ലം കഴിഞ്ഞ് കുട്ടിയാനയെയുംകൊണ്ട് ആനക്കൂട്ടം ഡോക്ടറുടെ വീട്ടിൽത്തന്നെ എത്തിയത് എന്തു കാണിക്കുന്നു?"
        options: ["ആനകൾ മനുഷ്യമുഖങ്ങളും കിട്ടിയ സഹായവും ഓർമ്മിച്ചുവയ്ക്കുന്നു", "ആനകൾ വഴിതെറ്റി വന്നതാണ്", "ആനകൾക്ക് ഭക്ഷണം വേണമായിരുന്നു", "ഡോക്ടർ ആനകളെ വിളിച്ചുവരുത്തി"]
        answer: "ആനകൾ മനുഷ്യമുഖങ്ങളും കിട്ടിയ സഹായവും ഓർമ്മിച്ചുവയ്ക്കുന്നു"
        difficulty: 3
        hints: ["ഈ കുട്ടിയാനയുടെ അമ്മയെ ഡോക്ടർ മുമ്പ് എന്തു ചെയ്തു?", "മുതുമലയിൽനിന്ന് എത്ര ഗ്രാമങ്ങളും റോഡുകളും കടന്നാണ് അവർ വന്നത്?"]
        solution: "Step 1: അമ്മയാനയെ ഡോക്ടർ മുമ്പ് രക്ഷിച്ചിരുന്നു. Step 2: ദൂരം താണ്ടി അതേ ഡോക്ടറുടെ അടുത്തെത്തിയത് ആനകളുടെ ഓർമ്മയും വിശ്വാസവും കാണിക്കുന്നു."
        mistakes: {"ആനകൾ വഴിതെറ്റി വന്നതാണ്": mal_elephant_doctor, "ആനകൾക്ക് ഭക്ഷണം വേണമായിരുന്നു": mal_think_why, "ഡോക്ടർ ആനകളെ വിളിച്ചുവരുത്തി": mal_think_why}
      - prompt: "ഒടുവിൽ മുപ്പതോളം ആനകൾ ചിന്നംവിളിച്ചപ്പോൾ 'ദേവദുന്ദുഭികൾ മുഴങ്ങി' എന്ന് ആഖ്യാതാവ് പറയുന്നു. ആ നിമിഷത്തിന്റെ ഭാവം?"
        options: ["നന്ദിയും ആഘോഷവും നിറഞ്ഞ മഹത്തായ നിമിഷം", "ആനകളുടെ ദേഷ്യം", "കാട്ടിലെ അപകടസൂചന", "ഡോക്ടറുടെ ഭയം"]
        answer: "നന്ദിയും ആഘോഷവും നിറഞ്ഞ മഹത്തായ നിമിഷം"
        difficulty: 3
        hints: ["ദുന്ദുഭി എന്താണ്? അത് എപ്പോഴാണ് മുഴങ്ങുക?", "അപ്പോൾ കുട്ടിയാനയുടെ കാലിൽനിന്ന് എന്തു നീക്കിയിരുന്നു?"]
        solution: "Step 1: ദുന്ദുഭി ദേവന്മാരുടെ വാദ്യമാണ്; വിജയത്തിലും ആഘോഷത്തിലും മുഴങ്ങുന്നത്. Step 2: ചികിത്സ കഴിഞ്ഞപ്പോൾ ആനകളുടെ വിളി ഒരു നന്ദിപ്രകടനംപോലെ തോന്നി."
        mistakes: {"ആനകളുടെ ദേഷ്യം": mal_imagery, "കാട്ടിലെ അപകടസൂചന": mal_imagery, "ഡോക്ടറുടെ ഭയം": mal_imagery}

  - code: mal9.u2.pulimavu
    title: പുളിമാവു വെട്ടി
    after: [mal9.u2.anadoctor]
    notes: |
      ഇടശ്ശേരി ഗോവിന്ദൻനായരുടെ കവിത ('ഇടശ്ശേരിക്കവിതകൾ'). പുറംപറമ്പിലെ പുളിമാവ് ഒരാൾക്ക്
      വിറ്റു; "മുറിച്ചുതള്ളിപ്പലക പിടിപ്പിൻ!" അതോടെ ഉടമസ്ഥാവകാശവും പോയി. ഗിരിശൃംഗത്തിന്റെ
      പ്രതിരൂപംപോലെ നിന്ന മരം, പാടത്തിന്റെ കരയിൽ നമ്മുടെ കുടിലിന്നടയാളം; പൂത്തുനിൽക്കുന്ന അതിന്റെ
      ചില്ലകളിൽ ദേവന്മാർക്കുള്ളാവാസം; ഉച്ചയ്ക്ക് കിളികളുടെ പേച്ചുകളകളം. "പച്ചത്തണലും കൊത്തിയെടുത്തിട്ടകലെപ്പാറിൻ
      പറവകളേ!" "കുറുത്തനാൾ തൊട്ടിന്നോളം തല കുനിച്ചിട്ടില്ലാത്തോനീ വൃദ്ധൻ." "സ്വന്തം മാറത്തമ്മമഹിക്കെരി-
      തീക്കനൽ വീണാൽ വീണോട്ടെ; എന്തിലുമേറെക്കാമ്യം പണമേ തുച്ഛം ...!" — എന്തിനെയും ലാഭക്കൊതിയോടെ
      കാണുന്ന ആധുനികമനുഷ്യന്റെ മനോഭാവം. പൂങ്കുലയും കൊണ്ടോടിവരുന്ന പാലക്കാടൻ കുളിർകാറ്റ്; "പൂത്തിരി
      കത്തിച്ചെങ്ങളെ നൃത്തം തത്തിക്കാനില്ലിനിയാരും". ഗാന്ധിജി: "എല്ലാവരുടെയും ആവശ്യങ്ങൾക്കുള്ള
      വിഭവങ്ങൾ ഭൂമിയിലുണ്ട്. എന്നാൽ ഒരാളുടെ പോലും അത്യാർത്തിക്കുള്ളതില്ല." അമ്മമഹി = അമ്മയാകുന്ന
      ഭൂമി; കാമ്യം = ആഗ്രഹിക്കത്തക്ക കാര്യം; തുച്ഛൻ = നിസ്സാരൻ; ഗിരിശൃംഗം = കൊടുമുടി.
    explanations:
      text: "പണത്തിനുവേണ്ടി ഒരു പഴയ പുളിമരം വെട്ടുമ്പോൾ നഷ്ടപ്പെടുന്നത് ഒരു മരം മാത്രമല്ല: കിളികളുടെ വീട്, തണൽ, കാറ്റിന്റെ കളി, ഗ്രാമത്തിന്റെ അടയാളം. ലാഭക്കൊതി പ്രകൃതിയെ മറക്കുന്നതിനെ കവി വിമർശിക്കുന്നു."
      visual: "ഒരു വലിയ പുളിമരം, കീഴെ ഒരു കുടിൽ; ഒരു വശത്ത് മഴു; പറന്നകലുന്ന കിളികൾ; ദൂരെനിന്ന് വരുന്ന കാറ്റിന്റെ വരകൾ; ഒരു കൈയിൽ നോട്ടുകൾ."
      step_by_step: "'എന്തിലുമേറെക്കാമ്യം പണമേ' — 1. കാമ്യം = ആഗ്രഹിക്കത്തക്കത്. 2. പണം എല്ലാറ്റിലും വലുതാണെന്ന ചിന്ത. 3. ഭൂമിയുടെ മാറിൽ തീ വീണാലും പണം മതി എന്ന ലാഭക്കൊതിയെ കവി പരിഹസിക്കുന്നു."
      real_world: "റോഡ് വികസനത്തിനും കെട്ടിടങ്ങൾക്കുമായി പഴയ മരങ്ങൾ മുറിക്കുമ്പോൾ പകരം മരം നടാനുള്ള നിയമങ്ങൾ പല സ്ഥലങ്ങളിലുമുണ്ട്."
    activity:
      type: sort
      prompt: കവിതയിലെ ഓരോ വരിയും എന്തിനെക്കുറിച്ച്? മരം നൽകിയിരുന്നതോ, ലാഭക്കൊതിയുടെ ശബ്ദമോ?
      bins:
      - മരം നൽകിയിരുന്നത്
      - ലാഭക്കൊതിയുടെ ശബ്ദം
      items:
      - label: ഗിരിശൃംഗത്തിന്റെ പ്രതിരൂപം
        bin: മരം നൽകിയിരുന്നത്
        clue: കൊടുമുടി പോലെ നിന്നത് എന്താണ്?
        why: ഉയർന്നുനിന്ന പുളിമാവിന്റെ ഗാംഭീര്യമാണിത്.
      - label: പാടത്തിന്റെ കരയിൽ കുടിലിന്നടയാളം
        bin: മരം നൽകിയിരുന്നത്
        clue: വീട് തിരിച്ചറിയാൻ സഹായിച്ചത് എന്ത്?
        why: മരം വീടിന്റെ അടയാളം കൂടിയായിരുന്നു.
      - label: ഉച്ചയ്ക്ക് കിളികളുടെ പേച്ചുകളകളം
        bin: മരം നൽകിയിരുന്നത്
        clue: കിളികൾ എവിടെയിരുന്നാണ് ശബ്ദിച്ചത്?
        why: മരം കിളികൾക്ക് ഇടം നൽകി.
      - label: '"മുറിച്ചുതള്ളിപ്പലക പിടിപ്പിൻ!"'
        bin: ലാഭക്കൊതിയുടെ ശബ്ദം
        clue: മരത്തെ എന്തായിട്ടാണ് ഇവിടെ കാണുന്നത്?
        why: മരം പലകയ്ക്കുള്ള തടി മാത്രമായി കാണുന്നു.
      - label: '"എന്തിലുമേറെക്കാമ്യം പണമേ"'
        bin: ലാഭക്കൊതിയുടെ ശബ്ദം
        clue: ഇവിടെ എന്തിനാണ് ഏറ്റവും വില?
        why: പണത്തെ എല്ലാറ്റിനും മേലെ കാണുന്ന ആധുനികമനുഷ്യന്റെ മനോഭാവം.
    items:
      - prompt: "'പുളിമാവു വെട്ടി' എന്ന കവിത എഴുതിയതാര്?"
        options: ["ഇടശ്ശേരി ഗോവിന്ദൻനായർ", "വൈലോപ്പിള്ളി ശ്രീധരമേനോൻ", "കുമാരനാശാൻ", "തിരുനല്ലൂർ കരുണാകരൻ"]
        answer: "ഇടശ്ശേരി ഗോവിന്ദൻനായർ"
        difficulty: 1
        hints: ["'ഇടശ്ശേരിക്കവിതകൾ'."]
        solution: "ഇടശ്ശേരി ഗോവിന്ദൻനായർ."
        mistakes: {"വൈലോപ്പിള്ളി ശ്രീധരമേനോൻ": mal_author_work}
      - prompt: "പുളിമാവ് വെട്ടാൻ കാരണം:"
        options: ["പണത്തിനുവേണ്ടി വിറ്റു", "മരം ഉണങ്ങിപ്പോയി", "കൊടുങ്കാറ്റിൽ വീണു", "കിളികൾ ശല്യമായി"]
        answer: "പണത്തിനുവേണ്ടി വിറ്റു"
        difficulty: 1
        hints: ["'എന്തിലുമേറെക്കാമ്യം പണമേ'."]
        solution: "പണത്തിനായി മരം വിറ്റു; വാങ്ങിയവൻ പലകയ്ക്കായി മുറിക്കുന്നു."
        mistakes: {"മരം ഉണങ്ങിപ്പോയി": mal_tamarind}
      - prompt: "'പച്ചത്തണലും കൊത്തിയെടുത്തിട്ടകലെപ്പാറിൻ പറവകളേ!' — കവി ആരോടാണ് സംസാരിക്കുന്നത്?"
        options: ["മരത്തിൽ കൂടുകൂട്ടിയിരുന്ന കിളികളോട്", "മരംവെട്ടുകാരനോട്", "കാറ്റിനോട്", "കുട്ടികളോട്"]
        answer: "മരത്തിൽ കൂടുകൂട്ടിയിരുന്ന കിളികളോട്"
        difficulty: 2
        hints: ["പറവകൾ = പക്ഷികൾ."]
        solution: "വീടു നഷ്ടപ്പെടുന്ന പക്ഷികളോട്."
        mistakes: {"മരംവെട്ടുകാരനോട്": "mal_pulimavu_birds", "കാറ്റിനോട്": "mal_pulimavu_birds", "കുട്ടികളോട്": "mal_pulimavu_birds"}
      - prompt: "'സ്വന്തം മാറത്തമ്മമഹിക്കെരിതീക്കനൽ വീണാൽ വീണോട്ടെ' — 'അമ്മമഹി' എന്നാൽ:"
        options: ["അമ്മയാകുന്ന ഭൂമി", "അമ്മയുടെ മഹിമ", "വലിയ അമ്മ", "മഹാനദി"]
        answer: "അമ്മയാകുന്ന ഭൂമി"
        difficulty: 2
        hints: ["മഹി = ഭൂമി."]
        solution: "അമ്മമഹി = അമ്മയാകുന്ന ഭൂമി."
        mistakes: {"അമ്മയുടെ മഹിമ": mal_word_meaning}
      - prompt: "കവിതയിൽ വിമർശിക്കപ്പെടുന്ന മനോഭാവം:"
        options: ["എന്തിനെയും ലാഭക്കൊതിയോടെ കാണുന്ന ആധുനികമനുഷ്യന്റെ മനോഭാവം", "കിളികളോടുള്ള സ്നേഹം", "കൃഷിയോടുള്ള താൽപര്യം", "ഗ്രാമത്തോടുള്ള ഇഷ്ടം"]
