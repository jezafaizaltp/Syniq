        - ഇത് ആഘോഷിക്കുന്നത് മാനവികതാബോധത്തിന്റെ ഭാഗം.
        solution: പ്രകൃതിയെ മനുഷ്യൻ കീഴ്പ്പെടുത്തുന്നത് ആഘോഷിക്കുന്നത് ആദ്യഘട്ടത്തിലാണ്.
        mistakes:
          പരിസ്ഥിതിക വിവേകം നിറഞ്ഞ പിൽക്കാലം: m2_vylo_stage
      - prompt: 'പാഠമനുസരിച്ച് പരിസ്ഥിതിക വിവേകമുള്ള മനുഷ്യൻ:'
        options:
        - പ്രകൃതിയോടിണങ്ങി ജീവിക്കുന്നവൻ
        - പ്രകൃതിയെ കീഴ്പ്പെടുത്തുന്നവൻ
        - നഗരത്തിൽ മാത്രം ജീവിക്കുന്നവൻ
        - യന്ത്രങ്ങളെ ഉപേക്ഷിക്കുന്നവൻ
        answer: പ്രകൃതിയോടിണങ്ങി ജീവിക്കുന്നവൻ
        difficulty: 3
        hints:
        - പിൽക്കാലത്ത് കവിയുടെ നിലപാട് എങ്ങനെ മാറി?
        - പ്രകൃതിയില്ലെങ്കിൽ മനുഷ്യനുമില്ല.
        solution: മനുഷ്യൻ പ്രകൃതിയെ കീഴ്പ്പെടുത്തുന്നവനല്ല, പ്രകൃതിയോടിണങ്ങി ജീവിക്കുന്നവനാണ്.
        mistakes:
          പ്രകൃതിയെ കീഴ്പ്പെടുത്തുന്നവൻ: mal_vyloppilli
  - code: mal9.u2.samasam
    title: "ഭാഷ: സമാസവും പദപരിചയവും"
    after: [mal9.u2.prakruthipadangal]
    notes: |
      സമസ്തപദം വിഗ്രഹിക്കൽ (പാഠപുസ്തകത്തിലെ ഉദാഹരണങ്ങൾ): ഹൃദയതാളം = ഹൃദയത്തിന്റെ താളം; കുട്ടിയാന =
      കുട്ടിയായ ആന; ആവിവണ്ടി = ആവിയാൽ ഓടുന്ന വണ്ടി. സമാസഭേദങ്ങൾ: തത്പുരുഷൻ (ഉത്തരപദത്തിന്
      പ്രാധാന്യം; ഹൃദയതാളം), കർമ്മധാരയൻ (പൂർവപദം വിശേഷണം; കുട്ടിയാന, നീലാകാശം), ദ്വന്ദ്വൻ (ഇരുപദത്തിനും
      തുല്യപ്രാധാന്യം; സുഖസൗകര്യങ്ങൾ = സുഖവും സൗകര്യവും, രാപ്പകൽ), ബഹുവ്രീഹി (അന്യപദത്തിന്
      പ്രാധാന്യം; മുക്കണ്ണൻ = മൂന്നു കണ്ണുള്ളവൻ). പദങ്ങൾ ചേർത്തെഴുതുന്നതിന്റെ മേന്മ: ചുരുക്കം, ഒഴുക്ക്.
      പദപരിചയം: അദ്രി (പർവതം), അപചയം (നാശം, താഴ്ച), ഗിരിശൃംഗം (കൊടുമുടി), ഗ്രാസം (വിഴുങ്ങൽ),
      ഗംബൂട്ടുകൾ (നീണ്ട റബ്ബർബൂട്ട്), ചൂര് (ഗന്ധം), ജീർണ്ണത (പഴക്കം), ജീവിതവ്യം (ജീവിക്കാനുള്ള കഴിവ്),
      ദേവദുന്ദുഭി (ദേവന്മാരുടെ വാദ്യോപകരണം), തുച്ഛൻ (നിസ്സാരൻ).
    explanations:
      text: "രണ്ടോ അതിലധികമോ പദങ്ങൾ ചേർന്ന് ഒരു പദമാകുന്നതാണ് സമാസം. പിരിച്ചെഴുതുമ്പോൾ (വിഗ്രഹിക്കുമ്പോൾ) ഏതു പദത്തിനാണ് പ്രാധാന്യം എന്നു നോക്കി സമാസം തിരിച്ചറിയാം."
      visual: "ഒരു പട്ടിക: സമസ്തപദം | വിഗ്രഹം | പ്രാധാന്യം | സമാസം. ഹൃദയതാളം | ഹൃദയത്തിന്റെ താളം | താളം | തത്പുരുഷൻ. കുട്ടിയാന | കുട്ടിയായ ആന | ആന (വിശേഷണം+വിശേഷ്യം) | കർമ്മധാരയൻ. സുഖസൗകര്യങ്ങൾ | സുഖവും സൗകര്യവും | രണ്ടും | ദ്വന്ദ്വൻ."
      step_by_step: "'സുഖസൗകര്യങ്ങൾ' — 1. വിഗ്രഹം: സുഖവും സൗകര്യവും. 2. 'ഉം' ചേർത്ത് രണ്ടും തുല്യമായി നിൽക്കുന്നു. 3. ഇരുപദത്തിനും പ്രാധാന്യം: ദ്വന്ദ്വസമാസം."
      real_world: "പത്രത്തലക്കെട്ടുകളിൽ സ്ഥലം ലാഭിക്കാൻ സമസ്തപദങ്ങൾ ധാരാളം ഉപയോഗിക്കുന്നു: 'വിലക്കയറ്റം', 'ജലക്ഷാമം'."
    activity:
      type: sort
      prompt: ഓരോ സമസ്തപദവും ഏതു സമാസം? വിഗ്രഹിച്ചുനോക്കൂ.
      bins:
      - തത്പുരുഷൻ
      - കർമ്മധാരയൻ
      - ദ്വന്ദ്വൻ
      - ബഹുവ്രീഹി
      items:
      - label: ഹൃദയതാളം
        bin: തത്പുരുഷൻ
        clue: ഹൃദയത്തിന്റെ താളം. ഏതു പദത്തിനാണ് പ്രാധാന്യം?
        why: 'ഉത്തരപദമായ ''താളം'' പ്രധാനം: തത്പുരുഷൻ.'
      - label: ആവിവണ്ടി
        bin: തത്പുരുഷൻ
        clue: ആവിയാൽ ഓടുന്ന വണ്ടി. പ്രധാനം ആവിയോ വണ്ടിയോ?
        why: '''വണ്ടി'' എന്ന ഉത്തരപദം പ്രധാനം: തത്പുരുഷൻ.'
      - label: കുട്ടിയാന
        bin: കർമ്മധാരയൻ
        clue: കുട്ടിയായ ആന. 'കുട്ടി' ആനയെ എങ്ങനെ വിശേഷിപ്പിക്കുന്നു?
        why: 'പൂർവപദം ഉത്തരപദത്തിന്റെ വിശേഷണം: കർമ്മധാരയൻ.'
      - label: നീലാകാശം
        bin: കർമ്മധാരയൻ
        clue: നീലയായ ആകാശം. ഏതു പദം വിശേഷണം?
        why: '''നീല'' ആകാശത്തിന്റെ വിശേഷണം: കർമ്മധാരയൻ.'
      - label: സുഖസൗകര്യങ്ങൾ
        bin: ദ്വന്ദ്വൻ
        clue: സുഖവും സൗകര്യവും. ഏതിനാണ് കൂടുതൽ പ്രാധാന്യം?
        why: 'രണ്ടിനും തുല്യപ്രാധാന്യം: ദ്വന്ദ്വൻ.'
      - label: രാപ്പകൽ
        bin: ദ്വന്ദ്വൻ
        clue: രാവും പകലും. ഒന്ന് മറ്റേതിനെ വിശേഷിപ്പിക്കുന്നുണ്ടോ?
        why: 'ഇരുപദത്തിനും തുല്യപ്രാധാന്യം: ദ്വന്ദ്വൻ.'
      - label: മുക്കണ്ണൻ
        bin: ബഹുവ്രീഹി
        clue: മൂന്നു കണ്ണുള്ളവൻ. ഈ പദം കണ്ണിനെക്കുറിച്ചാണോ, മറ്റൊരാളെക്കുറിച്ചാണോ?
        why: 'മൂന്നു കണ്ണുള്ള ഒരാളെ (ശിവനെ) കുറിക്കുന്നു: അന്യപദപ്രധാനം, ബഹുവ്രീഹി.'
    lesson:
      - teach: 'രണ്ടോ അതിലധികമോ പദങ്ങൾ ചേർന്ന് ഒറ്റ പദമാകുന്നത് സമാസം. അങ്ങനെയുണ്ടായ പദം സമസ്തപദം. അതിനെ പിരിച്ച് ബന്ധം കാണിച്ച് എഴുതുന്നത് വിഗ്രഹം. ഉദാ: ഹൃദയതാളം = ഹൃദയത്തിന്റെ താളം; കുട്ടിയാന = കുട്ടിയായ ആന. ചേർത്തെഴുതുമ്പോൾ വാക്യത്തിന് ചുരുക്കവും ഒഴുക്കും കിട്ടുന്നു.'
        check:
          prompt: സമസ്തപദം പിരിച്ച് ബന്ധം കാണിച്ച് എഴുതുന്നതിനെ എന്തു പറയുന്നു?
          options:
          - വിഗ്രഹം
          - ഉപമ
          - ശൈലി
          answer: വിഗ്രഹം
          why: ഹൃദയതാളം = ഹൃദയത്തിന്റെ താളം — ഇതാണ് വിഗ്രഹം.
      - teach: 'നാലു പ്രധാന സമാസങ്ങൾ: തത്പുരുഷൻ (ഉത്തരപദത്തിന് പ്രാധാന്യം: ഹൃദയതാളം), കർമ്മധാരയൻ (പൂർവപദം വിശേഷണം: കുട്ടിയാന, നീലാകാശം), ദ്വന്ദ്വൻ (രണ്ടിനും തുല്യപ്രാധാന്യം: രാപ്പകൽ = രാവും പകലും), ബഹുവ്രീഹി (രണ്ടുമല്ല, മറ്റൊരാളെ കുറിക്കുന്നു: മുക്കണ്ണൻ = മൂന്നു കണ്ണുള്ളവൻ).'
        picture:
          kind: compare
          columns:
          - title: തത്പുരുഷൻ / കർമ്മധാരയൻ
            points:
            - ഹൃദയത്തിന്റെ താളം
            - കുട്ടിയായ ആന
            - നീലയായ ആകാശം
          - title: ദ്വന്ദ്വൻ
            points:
            - രാവും പകലും
            - സുഖവും സൗകര്യവും
          - title: ബഹുവ്രീഹി
            points:
            - മൂന്നു കണ്ണുള്ളവൻ (മുക്കണ്ണൻ)
          alt: നാലു സമാസങ്ങളും അവയുടെ വിഗ്രഹങ്ങളും.
        check:
          prompt: 'രണ്ടു പദങ്ങൾക്കും തുല്യപ്രാധാന്യമുള്ള സമാസം:'
          options:
          - ദ്വന്ദ്വൻ
          - ബഹുവ്രീഹി
          - കർമ്മധാരയൻ
          answer: ദ്വന്ദ്വൻ
          why: രാപ്പകൽ = രാവും പകലും; രണ്ടും ഒരുപോലെ പ്രധാനം.
      - teach: 'പാഠങ്ങളിലെ ചില പുതിയ പദങ്ങൾ: അപചയം (നാശം, താഴ്ച), ഗ്രാസം (വിഴുങ്ങൽ), ഗംബൂട്ടുകൾ (നീണ്ട റബ്ബർബൂട്ട്), ചൂര് (ഗന്ധം), ജീർണ്ണത (പഴക്കം), ജീവിതവ്യം (ജീവിക്കാനുള്ള കഴിവ്). പുതിയ പദം കാണുമ്പോൾ അത് വാക്യത്തിൽ വച്ച് വായിച്ച് അർഥം ഉറപ്പിക്കൂ.'
        check:
          prompt: '''ചൂര്'' എന്ന പദത്തിന്റെ അർഥം:'
          options:
          - ഗന്ധം
          - ചൂട്
          - നിറം
          answer: ഗന്ധം
          why: ചൂര് = ഗന്ധം (മണം).
    items:
      - prompt: "'ഹൃദയതാളം' വിഗ്രഹിക്കുമ്പോൾ:"
        options: ["ഹൃദയത്തിന്റെ താളം", "ഹൃദയവും താളവും", "ഹൃദയമായ താളം", "ഹൃദയത്താൽ താളം"]
        answer: "ഹൃദയത്തിന്റെ താളം"
        difficulty: 1
        hints: ["പാഠപുസ്തകത്തിലെ ഉദാഹരണം."]
        solution: "ഹൃദയത്തിന്റെ താളം."
        mistakes: {"ഹൃദയവും താളവും": mal_samasam}
      - prompt: "'കുട്ടിയാന' വിഗ്രഹിക്കുമ്പോൾ:"
        options: ["കുട്ടിയായ ആന", "കുട്ടിയുടെ ആന", "കുട്ടിയും ആനയും", "കുട്ടിക്കുള്ള ആന"]
        answer: "കുട്ടിയായ ആന"
        difficulty: 1
        hints: ["'കുട്ടി' ആനയെ വിശേഷിപ്പിക്കുന്നു."]
        solution: "കുട്ടിയായ ആന — കർമ്മധാരയൻ."
        mistakes: {"കുട്ടിയുടെ ആന": mal_samasam}
      - prompt: "'സുഖസൗകര്യങ്ങൾ' ഏതു സമാസം?"
        options: ["ദ്വന്ദ്വസമാസം", "തത്പുരുഷസമാസം", "കർമ്മധാരയസമാസം", "ബഹുവ്രീഹിസമാസം"]
        answer: "ദ്വന്ദ്വസമാസം"
        difficulty: 2
        hints: ["സുഖവും സൗകര്യവും — രണ്ടിനും തുല്യപ്രാധാന്യം."]
