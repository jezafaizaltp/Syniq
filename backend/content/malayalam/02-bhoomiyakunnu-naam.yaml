        hints: ["'മർത്യവീര്യമീയദ്രിയെ വെല്ലും'."]
        solution: "അദ്രി = പർവതം."
        mistakes: {"അഗ്നി": mal_word_meaning}
      - prompt: "'ദേവദുന്ദുഭികൾ മുഴങ്ങി' — 'ദുന്ദുഭി' എന്നാൽ:"
        options: ["ഒരു വാദ്യോപകരണം", "ഒരു പക്ഷി", "ഒരു ആയുധം", "ഒരു പൂവ്"]
        answer: "ഒരു വാദ്യോപകരണം"
        difficulty: 3
        hints: ["'മുഴങ്ങി' — ശബ്ദമുണ്ടാക്കുന്നത്."]
        solution: "ദേവദുന്ദുഭി = ദേവന്മാരുടെ വാദ്യോപകരണം; ആനകളുടെ ചിന്നംവിളിയെ അതിനോട് ഉപമിക്കുന്നു."
        mistakes: {"ഒരു ആയുധം": mal_word_meaning}
