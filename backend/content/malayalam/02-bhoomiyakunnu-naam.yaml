  - code: mal9.u2.samasam
    title: "ഭാഷ: സമാസവും പദപരിചയവും"
    after: [mal9.u2.prakruthipadangal]
    notes: |
      സമസ്തപദം വിഗ്രഹിക്കൽ (പാഠപുസ്തകത്തിലെ ഉദാഹരണങ്ങൾ): ഹൃദയതാളം = ഹൃദയത്തിന്റെ താളം; കുട്ടിയാന =
      കുട്ടിയായ ആന; ആവിവണ്ടി = ആവിയാൽ ഓടുന്ന വണ്ടി. സമാസഭേദങ്ങൾ: തത്പുരുഷൻ (ഉത്തരപദത്തിന്
      പ്രാധാന്യം; ഹൃദയതാളം), കർമ്മധാരയൻ (പൂർവപദം വിശേഷണം; കുട്ടിയാന, നീലാകാശം), ദ്വന്ദ്വൻ (ഇരുപദത്തിനും
      തുല്യപ്രാധാന്യം; സുഖസൗകര്യങ്ങൾ = സുഖവും സൗകര്യവും, രാപ്പകൽ), ബഹുവ്രീഹി (അന്യപദത്തിന്
      പ്രാധാന്യം; മുക്കണ്ണൻ = മൂന്നു കണ്ണുള്ളവൻ). പദങ്ങൾ ചേർത്തെഴുതുന്നതിന്റെ മേന്മ: ചുരുക്കം, ഒഴുക്ക്.
      പദപരിചയം: അദ്രി (പർവതം), അപചയം (നാശം, താഴ്ച), ഗിരിശൃംഗം (കൊടുമുടി), ഗ്രാസം (വിഴുങ്ങൽ),
      ഗംബൂട്ടുകൾ (നീണ്ട റബ്ബർബൂട്ട്), ചൂര് (ഗന്ധം), ജീർണ്ണത (പഴക്കം), ജീവിതവ്യം (ജീവിക്കാനുള്ള കഴിവ്),
      ദേവദുന്ദുഭി (ദേവന്മാരുടെ വാദ്യോപകരണം), തുച്ഛൻ (നിസ്സാരൻ).
    explanations:
      text: "രണ്ടോ അതിലധികമോ പദങ്ങൾ ചേർന്ന് ഒരു പദമാകുന്നതാണ് സമാസം. പിരിച്ചെഴുതുമ്പോൾ (വിഗ്രഹിക്കുമ്പോൾ) ഏതു പദത്തിനാണ് പ്രാധാന്യം എന്നു നോക്കി സമാസം തിരിച്ചറിയാം."
      visual: "ഒരു പട്ടിക: സമസ്തപദം | വിഗ്രഹം | പ്രാധാന്യം | സമാസം. ഹൃദയതാളം | ഹൃദയത്തിന്റെ താളം | താളം | തത്പുരുഷൻ. കുട്ടിയാന | കുട്ടിയായ ആന | ആന (വിശേഷണം+വിശേഷ്യം) | കർമ്മധാരയൻ. സുഖസൗകര്യങ്ങൾ | സുഖവും സൗകര്യവും | രണ്ടും | ദ്വന്ദ്വൻ."
      step_by_step: "'സുഖസൗകര്യങ്ങൾ' — 1. വിഗ്രഹം: സുഖവും സൗകര്യവും. 2. 'ഉം' ചേർത്ത് രണ്ടും തുല്യമായി നിൽക്കുന്നു. 3. ഇരുപദത്തിനും പ്രാധാന്യം: ദ്വന്ദ്വസമാസം."
      real_world: "പത്രത്തലക്കെട്ടുകളിൽ സ്ഥലം ലാഭിക്കാൻ സമസ്തപദങ്ങൾ ധാരാളം ഉപയോഗിക്കുന്നു: 'വിലക്കയറ്റം', 'ജലക്ഷാമം'."
    items:
      - prompt: "'ഹൃദയതാളം' വിഗ്രഹിക്കുമ്പോൾ:"
        options: ["ഹൃദയത്തിന്റെ താളം", "ഹൃദയവും താളവും", "ഹൃദയമായ താളം", "ഹൃദയത്താൽ താളം"]
        answer: "ഹൃദയത്തിന്റെ താളം"
        difficulty: 1
        hints: ["പാഠപുസ്തകത്തിലെ ഉദാഹരണം."]
        solution: "ഹൃദയത്തിന്റെ താളം."
        mistakes: {"ഹൃദയവും താളവും": mal_samasam}
      - prompt: "'കുട്ടിയാന' വിഗ്രഹിക്കുമ്പോൾ:"
        options: ["കുട്ടിയായ ആന", "കുട്ടിയുടെ ആന", "കുട്ടിയും ആനയും", "കുട്ടിക്കുള്ള ആന"]
        answer: "കുട്ടിയായ ആന"
        difficulty: 1
        hints: ["'കുട്ടി' ആനയെ വിശേഷിപ്പിക്കുന്നു."]
        solution: "കുട്ടിയായ ആന — കർമ്മധാരയൻ."
        mistakes: {"കുട്ടിയുടെ ആന": mal_samasam}
      - prompt: "'സുഖസൗകര്യങ്ങൾ' ഏതു സമാസം?"
        options: ["ദ്വന്ദ്വസമാസം", "തത്പുരുഷസമാസം", "കർമ്മധാരയസമാസം", "ബഹുവ്രീഹിസമാസം"]
        answer: "ദ്വന്ദ്വസമാസം"
        difficulty: 2
        hints: ["സുഖവും സൗകര്യവും — രണ്ടിനും തുല്യപ്രാധാന്യം."]
        solution: "ഇരുപദത്തിനും തുല്യപ്രാധാന്യമുള്ളതിനാൽ ദ്വന്ദ്വൻ."
        mistakes: {"തത്പുരുഷസമാസം": mal_samasam}
      - prompt: "'ആവിവണ്ടി' എന്നതിന്റെ വിഗ്രഹം:"
        options: ["ആവിയാൽ ഓടുന്ന വണ്ടി", "ആവിയും വണ്ടിയും", "ആവിയുടെ വണ്ടി മാത്രം", "ആവിയായ വണ്ടി"]
        answer: "ആവിയാൽ ഓടുന്ന വണ്ടി"
        difficulty: 2
        hints: ["പാഠപുസ്തകത്തിലെ ഉദാഹരണം."]
        solution: "ആവിയാൽ ഓടുന്ന വണ്ടി."
        mistakes: {"ആവിയും വണ്ടിയും": mal_samasam}
      - prompt: "'അദ്രി' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["പർവതം", "അഗ്നി", "ആകാശം", "നദി"]
        answer: "പർവതം"
