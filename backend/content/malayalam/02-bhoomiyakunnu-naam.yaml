      - teach: '''He is a tusker. My alpha male.'' അന്ന് രക്ഷിച്ച പിടിയാനയുടെ കുഞ്ഞാണിത്; ആന മനുഷ്യമുഖങ്ങൾ ഓർമ്മിച്ചുവയ്ക്കും. പത്തു ഗ്രാമങ്ങളെങ്കിലും കടന്ന്, നാലിടത്ത് റോഡ് മുറിച്ചുകടന്നാണ് അവ വന്നത്. ഒടുവിൽ മുപ്പതോളം ആനകൾ ചിന്നംവിളിച്ചു: ''ദേവദുന്ദുഭികൾ മുഴങ്ങി''. മൃഗങ്ങളും നന്ദിയും സ്നേഹവും ഓർക്കുന്നു എന്ന് കഥ കാണിക്കുന്നു.'
