      - prompt: "പുളിമാവിനെ 'കുറുത്തനാൾ തൊട്ടിന്നോളം തല കുനിച്ചിട്ടില്ലാത്തോനീ വൃദ്ധൻ' എന്നു കവി വിളിക്കുന്നു. ഇതിലൂടെ മരത്തിന് കൊടുക്കുന്ന ഭാവം?"
        options: ["ആത്മാഭിമാനമുള്ള ഒരു മുതിർന്ന മനുഷ്യന്റെ ഭാവം", "ദുർബലനായ രോഗിയുടെ ഭാവം", "കുസൃതിക്കാരനായ കുട്ടിയുടെ ഭാവം", "ഭയന്നുനിൽക്കുന്ന ഒരാളുടെ ഭാവം"]
        answer: "ആത്മാഭിമാനമുള്ള ഒരു മുതിർന്ന മനുഷ്യന്റെ ഭാവം"
        difficulty: 3
        hints: ["'വൃദ്ധൻ' എന്ന് ആരെയാണ് സാധാരണ വിളിക്കുക?", "'തല കുനിക്കാത്ത' ഒരാളെക്കുറിച്ച് നമ്മൾ എന്തു പറയും?"]
        solution: "Step 1: മരത്തെ ഒരു വൃദ്ധമനുഷ്യനായി കവി കാണുന്നു. Step 2: ഒരിക്കലും തല കുനിക്കാത്തവൻ: ആത്മാഭിമാനത്തോടെ ഉയർന്നുനിന്ന ജീവിതം."
        mistakes: {"ദുർബലനായ രോഗിയുടെ ഭാവം": mal_tamarind, "കുസൃതിക്കാരനായ കുട്ടിയുടെ ഭാവം": mal_tamarind, "ഭയന്നുനിൽക്കുന്ന ഒരാളുടെ ഭാവം": mal_tamarind}
      - prompt: "'എന്തിലുമേറെക്കാമ്യം പണമേ' — ഇതോട് ചേർത്തുവായിക്കാവുന്ന ഗാന്ധിജിയുടെ വാക്യം എന്തു പറയുന്നു?"
        options: ["ഭൂമിയിൽ എല്ലാവരുടെയും ആവശ്യത്തിനുള്ളതുണ്ട്, ഒരാളുടെ അത്യാർത്തിക്കുള്ളതില്ല", "പണം ഉണ്ടാക്കാൻ മരം വെട്ടണം", "പ്രകൃതി മനുഷ്യനുവേണ്ടി മാത്രമാണ്", "മരങ്ങൾ വിൽക്കുന്നത് നല്ല കച്ചവടമാണ്"]
        answer: "ഭൂമിയിൽ എല്ലാവരുടെയും ആവശ്യത്തിനുള്ളതുണ്ട്, ഒരാളുടെ അത്യാർത്തിക്കുള്ളതില്ല"
        difficulty: 3
        hints: ["കവിത വിമർശിക്കുന്നത് ഏതു മനോഭാവത്തെയാണ്?", "ആവശ്യവും അത്യാർത്തിയും തമ്മിൽ എന്തു വ്യത്യാസം?"]
        solution: "Step 1: കവിത പണത്തിനുവേണ്ടി എന്തും വിൽക്കുന്ന ലാഭക്കൊതിയെ വിമർശിക്കുന്നു. Step 2: ഗാന്ധിജിയും ആവശ്യം നിറവേറ്റാമെന്നും അത്യാർത്തി നിറവേറ്റാനാവില്ലെന്നും പറയുന്നു."
        mistakes: {"പണം ഉണ്ടാക്കാൻ മരം വെട്ടണം": mal_tamarind, "പ്രകൃതി മനുഷ്യനുവേണ്ടി മാത്രമാണ്": mal_vyloppilli, "മരങ്ങൾ വിൽക്കുന്നത് നല്ല കച്ചവടമാണ്": mal_tamarind}

  - code: mal9.u2.prakruthipadangal
    title: പ്രകൃതിപാഠങ്ങൾ
    after: [mal9.u2.pulimavu]
    notes: |
      ഡോ. കെ. എസ്. രവികുമാറിന്റെ 'സഹ്യകാനനത്തിൽ വിരിഞ്ഞ കവിത' എന്ന കൃതിയിൽനിന്ന്, വൈലോപ്പിള്ളി
      ശ്രീധരമേനോന്റെ കവിതയെക്കുറിച്ചുള്ള പഠനം. ഇരുപതാംനൂറ്റാണ്ടിന്റെ സങ്കീർണ്ണമായ ഹൃദയതാളം
      ആവിഷ്കരിച്ച കവി. അടിയാധാരം മാനവികതാബോധം: മനുഷ്യന്റെ കർമ്മശേഷിയിലും ലോകത്തെ മാറ്റിപ്പണിയാനുള്ള
      ഇച്ഛയിലുമുള്ള വിശ്വാസം — "മർത്യവീര്യമീയദ്രിയെ വെല്ലും" (അദ്രി = പർവതം). കാട് നാടാക്കുന്നവർ,
      പുഴയെ അണകെട്ടി മെരുക്കുന്നവർ... 'എന്റെ ഗ്രാമം': കൊച്ചി നഗരം സമീപഗ്രാമമായ ഇടപ്പള്ളിയെ
      വിഴുങ്ങുന്ന ചിത്രം; "കാളവണ്ടിയുഗത്തിൽനിന്ന് സ്പുട്നിക് യുഗത്തിലേക്കുള്ള കുതിപ്പ്". 'യുഗപരിവർത്തനം'.
      പിന്നീട് എല്ലാം മനുഷ്യനുവേണ്ടി എന്ന കാഴ്ചപ്പാടിൽനിന്ന് പ്രകൃതിയുടെ നിലനിൽപ്പ് മനുഷ്യന്റെ
      നിലനിൽപ്പിന് അനിവാര്യമാണ് എന്ന തിരിച്ചറിവിലേക്ക് (എൺപതുകളിൽ). 'മൃതസഞ്ജീവനി' എന്ന കാവ്യനാടകം:
      കമ്പനിയുടെ വിഷമൊഴുക്ക് പുഴയെ 'പൂതന'യാക്കി, മീനുകൾ ചത്തുപൊങ്ങി; വൻകിട അണക്കെട്ടുകൾ
      ആദിവാസികളെ കുടിയിറക്കുന്നു. 'പുരയ്ക്കു തീപിടിക്കുമ്പോൾ വാഴ വെട്ടുക' (മറ്റൊരാളുടെ ദുരിതം
      സ്വന്തം ലാഭത്തിന് ഉപയോഗിക്കുക) എന്ന ശൈലി: കൊള്ളലാഭത്തിനായി വനം വെട്ടുന്നവർ. പരിസ്ഥിതിക
      വിവേകം: മനുഷ്യൻ പ്രകൃതിയെ കീഴ്പ്പെടുത്തുന്നവനല്ല, പ്രകൃതിയോടിണങ്ങി ജീവിക്കുന്നവൻ.
    explanations:
      text: "വൈലോപ്പിള്ളി ആദ്യം മനുഷ്യന്റെ ശക്തിയെ പാടി: മലകളെ ജയിക്കുന്ന മനുഷ്യൻ. പിന്നീട് വികസനം പ്രകൃതിയെ തകർക്കുന്നതു കണ്ട് അദ്ദേഹം ഓർമ്മിപ്പിച്ചു: പ്രകൃതിയില്ലെങ്കിൽ മനുഷ്യനുമില്ല."
      visual: "ഒരു രണ്ടുഭാഗച്ചിത്രം: ഇടത്ത് കാളവണ്ടി, പാടം, ഗ്രാമം; വലത്ത് റോക്കറ്റ്, ഫാക്ടറി, വിഷമൊഴുകുന്ന പുഴ. നടുവിൽ ഒരു ചോദ്യചിഹ്നം: 'ഈ കുതിപ്പിന്റെ വില?'"
      step_by_step: "'പുരയ്ക്കു തീപിടിക്കുമ്പോൾ വാഴ വെട്ടുക' — 1. വീടു കത്തുമ്പോൾ എല്ലാവരും തീ കെടുത്താൻ ഓടുന്നു. 2. ആ തിരക്കിൽ ഒരാൾ വാഴക്കുല വെട്ടിക്കൊണ്ടുപോകുന്നു. 3. മറ്റുള്ളവരുടെ ദുരിതം സ്വന്തം ലാഭത്തിനാക്കൽ."
      real_world: "പെരിയാറിലെ മീൻചാകൽ, നഗരമാലിന്യം, അണക്കെട്ടുകൾമൂലമുള്ള കുടിയിറക്കം — വൈലോപ്പിള്ളി കണ്ട പ്രശ്നങ്ങൾ ഇന്നും വാർത്തകളിലുണ്ട്."
    activity:
      type: order
      prompt: വൈലോപ്പിള്ളിയുടെ കാഴ്ചപ്പാട് കാലക്രമത്തിൽ എങ്ങനെ മാറി? ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - '"മർത്യവീര്യമീയദ്രിയെ വെല്ലും": മനുഷ്യശേഷിയിൽ വിശ്വാസം'
      - '''എന്റെ ഗ്രാമം'': നഗരം ഗ്രാമത്തെ വിഴുങ്ങുന്നു'
      - 'എൺപതുകൾ: പ്രകൃതി നിലനിന്നാലേ മനുഷ്യനുള്ളൂ'
      reasons:
        '''എന്റെ ഗ്രാമം'': നഗരം ഗ്രാമത്തെ വിഴുങ്ങുന്നു': മാറ്റത്തിന്റെ വിലയെക്കുറിച്ചുള്ള ആശങ്ക വരുന്നത് മനുഷ്യൻ പ്രകൃതിയെ മാറ്റിപ്പണിയാൻ തുടങ്ങിയശേഷമാണ്.
        'എൺപതുകൾ: പ്രകൃതി നിലനിന്നാലേ മനുഷ്യനുള്ളൂ': 'ലേഖനം പറയുന്നു: ''എല്ലാം മനുഷ്യനുവേണ്ടി'' എന്നതിൽനിന്ന് പിന്നീട് ഈ തിരിച്ചറിവിലേക്ക്.'
    items:
      - prompt: "'പ്രകൃതിപാഠങ്ങൾ' ഏതു കവിയുടെ കവിതകളെക്കുറിച്ചുള്ള പഠനമാണ്?"
        options: ["വൈലോപ്പിള്ളി ശ്രീധരമേനോൻ", "ഇടശ്ശേരി ഗോവിന്ദൻനായർ", "കുമാരനാശാൻ", "ഒ. എൻ. വി. കുറുപ്പ്"]
        answer: "വൈലോപ്പിള്ളി ശ്രീധരമേനോൻ"
        difficulty: 1
        hints: ["'മൃതസഞ്ജീവനി', 'എന്റെ ഗ്രാമം'."]
        solution: "വൈലോപ്പിള്ളി."
        mistakes: {"ഇടശ്ശേരി ഗോവിന്ദൻനായർ": mal_vyloppilli}
      - prompt: "ഈ പഠനം എഴുതിയതാര്?"
        options: ["ഡോ. കെ. എസ്. രവികുമാർ", "പ്രൊഫ. എം. കെ. സാനു", "ഡോ. എസ്. ശാരദക്കുട്ടി", "പി. കെ. ഗോപാലകൃഷ്ണൻ"]
        answer: "ഡോ. കെ. എസ്. രവികുമാർ"
        difficulty: 1
        hints: ["'സഹ്യകാനനത്തിൽ വിരിഞ്ഞ കവിത'."]
        solution: "ഡോ. കെ. എസ്. രവികുമാർ."
        mistakes: {"പ്രൊഫ. എം. കെ. സാനു": mal_author_work}
      - prompt: "വൈലോപ്പിള്ളിക്കവിതകളുടെ അടിയാധാരമായി ലേഖകൻ പറയുന്നത്:"
        options: ["മാനവികതാബോധം", "ഭക്തി", "ഹാസ്യം", "പ്രണയം"]
        answer: "മാനവികതാബോധം"
        difficulty: 2
        hints: ["'മർത്യവീര്യമീയദ്രിയെ വെല്ലും'."]
        solution: "മനുഷ്യശക്തിയിലുള്ള വിശ്വാസം — മാനവികതാബോധം."
        mistakes: {"ഭക്തി": mal_vyloppilli}
      - prompt: "'എന്റെ ഗ്രാമം' എന്ന കവിതയിൽ കൊച്ചി നഗരം വിഴുങ്ങുന്ന ഗ്രാമം:"
        options: ["ഇടപ്പള്ളി", "അഴീക്കോട്", "ബേഡഡുക്ക", "അരുവിപ്പുറം"]
        answer: "ഇടപ്പള്ളി"
        difficulty: 2
        hints: ["കൊച്ചിയുടെ സമീപഗ്രാമം."]
        solution: "ഇടപ്പള്ളി."
        mistakes: {"അഴീക്കോട്": mal_read_again}
      - prompt: "'മൃതസഞ്ജീവനി'യിൽ പുഴ തന്നെ 'പൂതന'യാക്കിയത് എന്താണെന്നു പറയുന്നു?"
        options: ["കമ്പനി ഒഴുക്കിയ വിഷം", "കനത്ത മഴ", "വരൾച്ച", "മീൻപിടിത്തക്കാർ"]
        answer: "കമ്പനി ഒഴുക്കിയ വിഷം"
        difficulty: 2
        hints: ["'കമ്പനി വന്നതാണെൻ ദുരന്തം'."]
        solution: "വ്യവസായശാലയുടെ വിഷമൊഴുക്ക് പുഴയെ നശിപ്പിച്ചു."
        mistakes: {"കനത്ത മഴ": mal_vyloppilli}
      - prompt: "'പുരയ്ക്കു തീപിടിക്കുമ്പോൾ വാഴ വെട്ടുക' എന്ന ശൈലിയുടെ അർഥം:"
        options: ["മറ്റൊരാളുടെ ദുരിതം സ്വന്തം ലാഭത്തിനായി ഉപയോഗിക്കുക", "തീ കെടുത്താൻ സഹായിക്കുക", "കൃഷി ചെയ്യുക", "വേഗം ജോലി തീർക്കുക"]
        answer: "മറ്റൊരാളുടെ ദുരിതം സ്വന്തം ലാഭത്തിനായി ഉപയോഗിക്കുക"
        difficulty: 3
        hints: ["എല്ലാവരും തീ കെടുത്തുമ്പോൾ ഒരാൾ വാഴക്കുല കൊണ്ടുപോകുന്നു."]
        solution: "അവസരം മുതലെടുത്തുള്ള സ്വാർഥലാഭം."

        mistakes: {"തീ കെടുത്താൻ സഹായിക്കുക": "mal_shaili_vazha", "കൃഷി ചെയ്യുക": "mal_shaili_vazha", "വേഗം ജോലി തീർക്കുക": "mal_shaili_vazha"}
      - prompt: "'മർത്യവീര്യമീയദ്രിയെ വെല്ലും' എന്ന വരി വൈലോപ്പിള്ളിക്കവിതയിലെ ഏതു ഘട്ടത്തെ കാണിക്കുന്നു?"
        options: ["മനുഷ്യന്റെ കർമ്മശേഷിയിലുള്ള ആദ്യകാല വിശ്വാസം", "പ്രകൃതിയെ സംരക്ഷിക്കണമെന്ന പിൽക്കാല ബോധം", "നഗരജീവിതത്തോടുള്ള വെറുപ്പ്", "യുദ്ധത്തോടുള്ള ഭയം"]
        answer: "മനുഷ്യന്റെ കർമ്മശേഷിയിലുള്ള ആദ്യകാല വിശ്വാസം"
        difficulty: 3
        hints: ["'അദ്രി' എന്നാൽ പർവതം. മനുഷ്യൻ പർവതത്തെ എന്തു ചെയ്യും എന്നാണ് വരി?", "കവിയുടെ ചിന്ത എൺപതുകളിൽ എങ്ങനെ മാറി?"]
        solution: "Step 1: മനുഷ്യവീര്യം പർവതത്തെ ജയിക്കുമെന്നാണ് വരി: മാനവികതയിലുള്ള വിശ്വാസം. Step 2: പ്രകൃതിയുടെ നിലനിൽപ്പിനെക്കുറിച്ചുള്ള ബോധം പിന്നീടാണ് വന്നത്."
        mistakes: {"പ്രകൃതിയെ സംരക്ഷിക്കണമെന്ന പിൽക്കാല ബോധം": mal_vyloppilli, "നഗരജീവിതത്തോടുള്ള വെറുപ്പ്": mal_vyloppilli, "യുദ്ധത്തോടുള്ള ഭയം": mal_vyloppilli}
      - prompt: "'കാളവണ്ടിയുഗത്തിൽനിന്ന് സ്പുട്നിക് യുഗത്തിലേക്കുള്ള കുതിപ്പ്' — ഈ പ്രയോഗം എന്തിനെക്കുറിച്ചാണ്?"
        options: ["ഗ്രാമം അതിവേഗം നഗരവും യന്ത്രയുഗവുമായി മാറുന്നത്", "കാളവണ്ടി ബഹിരാകാശത്തേക്കു പോയത്", "കൃഷി കൂടിവന്നത്", "ഗ്രാമത്തിലെ ഉത്സവം"]
        answer: "ഗ്രാമം അതിവേഗം നഗരവും യന്ത്രയുഗവുമായി മാറുന്നത്"
        difficulty: 3
        hints: ["കാളവണ്ടി പഴയകാലത്തെ ഏതു ജീവിതത്തെ ഓർമ്മിപ്പിക്കുന്നു?", "സ്പുട്നിക് എന്തായിരുന്നു?"]
        solution: "Step 1: കാളവണ്ടി പഴയ ഗ്രാമജീവിതം; സ്പുട്നിക് ആധുനിക ശാസ്ത്രയുഗം. Step 2: 'എന്റെ ഗ്രാമ'ത്തിൽ ഇടപ്പള്ളി കൊച്ചി നഗരത്തിന്റെ ഭാഗമാകുന്ന വലിയ മാറ്റമാണിത്."
        mistakes: {"കാളവണ്ടി ബഹിരാകാശത്തേക്കു പോയത്": mal_imagery, "കൃഷി കൂടിവന്നത്": mal_vyloppilli, "ഗ്രാമത്തിലെ ഉത്സവം": mal_vyloppilli}
  - code: mal9.u2.samasam
    title: "ഭാഷ: സമാസവും പദപരിചയവും"
    after: [mal9.u2.prakruthipadangal]
    notes: |
      സമസ്തപദം വിഗ്രഹിക്കൽ (പാഠപുസ്തകത്തിലെ ഉദാഹരണങ്ങൾ): ഹൃദയതാളം = ഹൃദയത്തിന്റെ താളം; കുട്ടിയാന =
      കുട്ടിയായ ആന; ആവിവണ്ടി = ആവിയാൽ ഓടുന്ന വണ്ടി. സമാസഭേദങ്ങൾ: തത്പുരുഷൻ (ഉത്തരപദത്തിന്
      പ്രാധാന്യം; ഹൃദയതാളം), കർമ്മധാരയൻ (പൂർവപദം വിശേഷണം; കുട്ടിയാന, നീലാകാശം), ദ്വന്ദ്വൻ (ഇരുപദത്തിനും
      തുല്യപ്രാധാന്യം; സുഖസൗകര്യങ്ങൾ = സുഖവും സൗകര്യവും, രാപ്പകൽ), ബഹുവ്രീഹി (അന്യപദത്തിന്
      പ്രാധാന്യം; മുക്കണ്ണൻ = മൂന്നു കണ്ണുള്ളവൻ). പദങ്ങൾ ചേർത്തെഴുതുന്നതിന്റെ മേന്മ: ചുരുക്കം, ഒഴുക്ക്.
      പദപരിചയം: അദ്രി (പർവതം), അപചയം (നാശം, താഴ്ച), ഗിരിശൃംഗം (കൊടുമുടി), ഗ്രാസം (വിഴുങ്ങൽ),
      ഗംബൂട്ടുകൾ (നീണ്ട റബ്ബർബൂട്ട്), ചൂര് (ഗന്ധം), ജീർണ്ണത (പഴക്കം), ജീവിതവ്യം (ജീവിക്കാനുള്ള കഴിവ്),
      ദേവദുന്ദുഭി (ദേവന്മാരുടെ വാദ്യോപകരണം), തുച്ഛൻ (നിസ്സാരൻ).
    explanations:
      text: "രണ്ടോ അതിലധികമോ പദങ്ങൾ ചേർന്ന് ഒരു പദമാകുന്നതാണ് സമാസം. പിരിച്ചെഴുതുമ്പോൾ (വിഗ്രഹിക്കുമ്പോൾ) ഏതു പദത്തിനാണ് പ്രാധാന്യം എന്നു നോക്കി സമാസം തിരിച്ചറിയാം."
      visual: "ഒരു പട്ടിക: സമസ്തപദം | വിഗ്രഹം | പ്രാധാന്യം | സമാസം. ഹൃദയതാളം | ഹൃദയത്തിന്റെ താളം | താളം | തത്പുരുഷൻ. കുട്ടിയാന | കുട്ടിയായ ആന | ആന (വിശേഷണം+വിശേഷ്യം) | കർമ്മധാരയൻ. സുഖസൗകര്യങ്ങൾ | സുഖവും സൗകര്യവും | രണ്ടും | ദ്വന്ദ്വൻ."
      step_by_step: "'സുഖസൗകര്യങ്ങൾ' — 1. വിഗ്രഹം: സുഖവും സൗകര്യവും. 2. 'ഉം' ചേർത്ത് രണ്ടും തുല്യമായി നിൽക്കുന്നു. 3. ഇരുപദത്തിനും പ്രാധാന്യം: ദ്വന്ദ്വസമാസം."
      real_world: "പത്രത്തലക്കെട്ടുകളിൽ സ്ഥലം ലാഭിക്കാൻ സമസ്തപദങ്ങൾ ധാരാളം ഉപയോഗിക്കുന്നു: 'വിലക്കയറ്റം', 'ജലക്ഷാമം'."
    activity:
      type: sort
      prompt: ഓരോ സമസ്തപദവും ഏതു സമാസം? വിഗ്രഹിച്ചുനോക്കൂ.
      bins:
      - തത്പുരുഷൻ
      - കർമ്മധാരയൻ
      - ദ്വന്ദ്വൻ
      - ബഹുവ്രീഹി
      items:
      - label: ഹൃദയതാളം
        bin: തത്പുരുഷൻ
        clue: ഹൃദയത്തിന്റെ താളം. ഏതു പദത്തിനാണ് പ്രാധാന്യം?
        why: 'ഉത്തരപദമായ ''താളം'' പ്രധാനം: തത്പുരുഷൻ.'
      - label: ആവിവണ്ടി
        bin: തത്പുരുഷൻ
        clue: ആവിയാൽ ഓടുന്ന വണ്ടി. പ്രധാനം ആവിയോ വണ്ടിയോ?
        why: '''വണ്ടി'' എന്ന ഉത്തരപദം പ്രധാനം: തത്പുരുഷൻ.'
      - label: കുട്ടിയാന
        bin: കർമ്മധാരയൻ
        clue: കുട്ടിയായ ആന. 'കുട്ടി' ആനയെ എങ്ങനെ വിശേഷിപ്പിക്കുന്നു?
        why: 'പൂർവപദം ഉത്തരപദത്തിന്റെ വിശേഷണം: കർമ്മധാരയൻ.'
      - label: നീലാകാശം
        bin: കർമ്മധാരയൻ
        clue: നീലയായ ആകാശം. ഏതു പദം വിശേഷണം?
        why: '''നീല'' ആകാശത്തിന്റെ വിശേഷണം: കർമ്മധാരയൻ.'
      - label: സുഖസൗകര്യങ്ങൾ
        bin: ദ്വന്ദ്വൻ
        clue: സുഖവും സൗകര്യവും. ഏതിനാണ് കൂടുതൽ പ്രാധാന്യം?
        why: 'രണ്ടിനും തുല്യപ്രാധാന്യം: ദ്വന്ദ്വൻ.'
      - label: രാപ്പകൽ
        bin: ദ്വന്ദ്വൻ
        clue: രാവും പകലും. ഒന്ന് മറ്റേതിനെ വിശേഷിപ്പിക്കുന്നുണ്ടോ?
        why: 'ഇരുപദത്തിനും തുല്യപ്രാധാന്യം: ദ്വന്ദ്വൻ.'
      - label: മുക്കണ്ണൻ
        bin: ബഹുവ്രീഹി
        clue: മൂന്നു കണ്ണുള്ളവൻ. ഈ പദം കണ്ണിനെക്കുറിച്ചാണോ, മറ്റൊരാളെക്കുറിച്ചാണോ?
        why: 'മൂന്നു കണ്ണുള്ള ഒരാളെ (ശിവനെ) കുറിക്കുന്നു: അന്യപദപ്രധാനം, ബഹുവ്രീഹി.'
    items:
      - prompt: "'ഹൃദയതാളം' വിഗ്രഹിക്കുമ്പോൾ:"
        options: ["ഹൃദയത്തിന്റെ താളം", "ഹൃദയവും താളവും", "ഹൃദയമായ താളം", "ഹൃദയത്താൽ താളം"]
        answer: "ഹൃദയത്തിന്റെ താളം"
        difficulty: 1
        hints: ["പാഠപുസ്തകത്തിലെ ഉദാഹരണം."]
        solution: "ഹൃദയത്തിന്റെ താളം."
        mistakes: {"ഹൃദയവും താളവും": mal_samasam}
      - prompt: "'കുട്ടിയാന' വിഗ്രഹിക്കുമ്പോൾ:"
        options: ["കുട്ടിയായ ആന", "കുട്ടിയുടെ ആന", "കുട്ടിയും ആനയും", "കുട്ടിക്കുള്ള ആന"]
        answer: "കുട്ടിയായ ആന"
        difficulty: 1
        hints: ["'കുട്ടി' ആനയെ വിശേഷിപ്പിക്കുന്നു."]
