      - prompt: ചികിത്സയ്ക്കുമുമ്പ് ഡോക്ടർ സൂചിയിലൂടെ മയക്കുമരുന്ന് കൊടുത്തത് എന്തിന്?
        options:
        - ചികിത്സയ്ക്കിടെ ആന അനങ്ങാതിരിക്കാനും വേദന അറിയാതിരിക്കാനും
        - ആനയെ ഉറക്കി കാട്ടിലേക്ക് അയയ്ക്കാൻ
        - ആനയുടെ ചൂടു കൂട്ടാൻ
        - ആനക്കൂട്ടത്തെ ഓടിക്കാൻ
        answer: ചികിത്സയ്ക്കിടെ ആന അനങ്ങാതിരിക്കാനും വേദന അറിയാതിരിക്കാനും
        difficulty: 2
        hints:
        - വലിയൊരു ജീവിയുടെ കാലിൽനിന്ന് ചില്ലെടുക്കണം.
        - പരിക്കേറ്റ ആന വേദനയിൽ പിടഞ്ഞാലോ?
        solution: മയക്കിയാലേ ആന അനങ്ങാതെ, വേദനയറിയാതെ ചില്ല് എടുക്കാൻ കഴിയൂ.
        mistakes:
          ആനയുടെ ചൂടു കൂട്ടാൻ: m2_ana_care
      - prompt: '''പുറത്തുനിന്ന് വെള്ളച്ചാട്ടംപോലെ തണുത്ത കാറ്റ് അകത്തേക്കു വന്നു.'' — കാറ്റിനെ എന്തിനോടാണ് ഉപമിച്ചിരിക്കുന്നത്?'
        options:
        - വെള്ളച്ചാട്ടം
        - തിരശ്ശീല
        - ദുന്ദുഭി
        - ആനക്കൂട്ടം
        answer: വെള്ളച്ചാട്ടം
        difficulty: 2
        hints:
        - '''പോലെ'' എന്ന വാക്കിനു തൊട്ടുമുമ്പുള്ള പദം നോക്കൂ.'
        - ഒഴുകിയിറങ്ങുന്ന ഒരു തണുത്ത കാഴ്ച.
        solution: തണുത്ത കാറ്റിനെ വെള്ളച്ചാട്ടത്തോട് ഉപമിക്കുന്നു.
        mistakes:
          തിരശ്ശീല: m2_ana_language
      - prompt: ആനക്കൂട്ടം ഡോക്ടറുടെ വീട്ടിലെത്താൻ എത്ര ഇടത്ത് റോഡ് മുറിച്ചുകടന്നു?
        options:
        - നാല്
        - രണ്ട്
        - പത്ത്
        - മുപ്പത്
        answer: നാല്
        difficulty: 2
        hints:
        - കടന്ന ഗ്രാമങ്ങളുടെ എണ്ണവും റോഡുകളുടെ എണ്ണവും വേറെയാണ്.
        - ഗ്രാമങ്ങൾ പത്തിലേറെ; റോഡുകൾ അതിലും കുറവ്.
        solution: പത്തു ഗ്രാമങ്ങളെങ്കിലും കടന്ന്, നാലിടത്ത് റോഡ് മുറിച്ചുകടന്നാണ് വരവ്.
        mistakes:
          പത്ത്: m2_ana_order
      - prompt: '''ആനഡോക്ടർ'' എന്ന പാഠം വായനക്കാരനിൽ ഉണ്ടാക്കുന്ന പ്രധാന ചിന്ത:'
        options:
        - മൃഗങ്ങൾക്കും ഓർമ്മയും നന്ദിയുമുണ്ട്; അവയോട് കരുതൽ വേണം
        - ആനകൾ അപകടകാരികളാണ്, അകന്നുനിൽക്കണം
        - വനത്തിൽ റോഡുകൾ കൂടുതൽ വേണം
        - ഡോക്ടർമാർ രാത്രി ജോലിചെയ്യരുത്
        answer: മൃഗങ്ങൾക്കും ഓർമ്മയും നന്ദിയുമുണ്ട്; അവയോട് കരുതൽ വേണം
        difficulty: 3
        hints:
        - ആനക്കൂട്ടം ആരെ തേടിയാണ് വന്നത്?
        - ഒടുവിലത്തെ ചിന്നംവിളി എന്തിന്റെ സൂചനയാണ്?
        solution: ആനകൾ സഹായിച്ചയാളെ ഓർത്ത് തിരിച്ചുവരുന്നു; മൃഗങ്ങളോടുള്ള കരുതലും അവയുടെ നന്ദിയുമാണ് പാഠം.
        mistakes:
          ആനകൾ അപകടകാരികളാണ്, അകന്നുനിൽക്കണം: mal_elephant_doctor

  - code: mal9.u2.pulimavu
    title: പുളിമാവു വെട്ടി
    after: [mal9.u2.anadoctor]
    notes: |
      ഇടശ്ശേരി ഗോവിന്ദൻനായരുടെ കവിത ('ഇടശ്ശേരിക്കവിതകൾ'). പുറംപറമ്പിലെ പുളിമാവ് ഒരാൾക്ക്
      വിറ്റു; "മുറിച്ചുതള്ളിപ്പലക പിടിപ്പിൻ!" അതോടെ ഉടമസ്ഥാവകാശവും പോയി. ഗിരിശൃംഗത്തിന്റെ
      പ്രതിരൂപംപോലെ നിന്ന മരം, പാടത്തിന്റെ കരയിൽ നമ്മുടെ കുടിലിന്നടയാളം; പൂത്തുനിൽക്കുന്ന അതിന്റെ
      ചില്ലകളിൽ ദേവന്മാർക്കുള്ളാവാസം; ഉച്ചയ്ക്ക് കിളികളുടെ പേച്ചുകളകളം. "പച്ചത്തണലും കൊത്തിയെടുത്തിട്ടകലെപ്പാറിൻ
      പറവകളേ!" "കുറുത്തനാൾ തൊട്ടിന്നോളം തല കുനിച്ചിട്ടില്ലാത്തോനീ വൃദ്ധൻ." "സ്വന്തം മാറത്തമ്മമഹിക്കെരി-
      തീക്കനൽ വീണാൽ വീണോട്ടെ; എന്തിലുമേറെക്കാമ്യം പണമേ തുച്ഛം ...!" — എന്തിനെയും ലാഭക്കൊതിയോടെ
      കാണുന്ന ആധുനികമനുഷ്യന്റെ മനോഭാവം. പൂങ്കുലയും കൊണ്ടോടിവരുന്ന പാലക്കാടൻ കുളിർകാറ്റ്; "പൂത്തിരി
      കത്തിച്ചെങ്ങളെ നൃത്തം തത്തിക്കാനില്ലിനിയാരും". ഗാന്ധിജി: "എല്ലാവരുടെയും ആവശ്യങ്ങൾക്കുള്ള
      വിഭവങ്ങൾ ഭൂമിയിലുണ്ട്. എന്നാൽ ഒരാളുടെ പോലും അത്യാർത്തിക്കുള്ളതില്ല." അമ്മമഹി = അമ്മയാകുന്ന
      ഭൂമി; കാമ്യം = ആഗ്രഹിക്കത്തക്ക കാര്യം; തുച്ഛൻ = നിസ്സാരൻ; ഗിരിശൃംഗം = കൊടുമുടി.
    explanations:
      text: "പണത്തിനുവേണ്ടി ഒരു പഴയ പുളിമരം വെട്ടുമ്പോൾ നഷ്ടപ്പെടുന്നത് ഒരു മരം മാത്രമല്ല: കിളികളുടെ വീട്, തണൽ, കാറ്റിന്റെ കളി, ഗ്രാമത്തിന്റെ അടയാളം. ലാഭക്കൊതി പ്രകൃതിയെ മറക്കുന്നതിനെ കവി വിമർശിക്കുന്നു."
      visual: "ഒരു വലിയ പുളിമരം, കീഴെ ഒരു കുടിൽ; ഒരു വശത്ത് മഴു; പറന്നകലുന്ന കിളികൾ; ദൂരെനിന്ന് വരുന്ന കാറ്റിന്റെ വരകൾ; ഒരു കൈയിൽ നോട്ടുകൾ."
      step_by_step: "'എന്തിലുമേറെക്കാമ്യം പണമേ' — 1. കാമ്യം = ആഗ്രഹിക്കത്തക്കത്. 2. പണം എല്ലാറ്റിലും വലുതാണെന്ന ചിന്ത. 3. ഭൂമിയുടെ മാറിൽ തീ വീണാലും പണം മതി എന്ന ലാഭക്കൊതിയെ കവി പരിഹസിക്കുന്നു."
      real_world: "റോഡ് വികസനത്തിനും കെട്ടിടങ്ങൾക്കുമായി പഴയ മരങ്ങൾ മുറിക്കുമ്പോൾ പകരം മരം നടാനുള്ള നിയമങ്ങൾ പല സ്ഥലങ്ങളിലുമുണ്ട്."
    activity:
      type: sort
      prompt: കവിതയിലെ ഓരോ വരിയും എന്തിനെക്കുറിച്ച്? മരം നൽകിയിരുന്നതോ, ലാഭക്കൊതിയുടെ ശബ്ദമോ?
      bins:
      - മരം നൽകിയിരുന്നത്
      - ലാഭക്കൊതിയുടെ ശബ്ദം
      items:
      - label: ഗിരിശൃംഗത്തിന്റെ പ്രതിരൂപം
        bin: മരം നൽകിയിരുന്നത്
        clue: കൊടുമുടി പോലെ നിന്നത് എന്താണ്?
        why: ഉയർന്നുനിന്ന പുളിമാവിന്റെ ഗാംഭീര്യമാണിത്.
      - label: പാടത്തിന്റെ കരയിൽ കുടിലിന്നടയാളം
        bin: മരം നൽകിയിരുന്നത്
        clue: വീട് തിരിച്ചറിയാൻ സഹായിച്ചത് എന്ത്?
        why: മരം വീടിന്റെ അടയാളം കൂടിയായിരുന്നു.
      - label: ഉച്ചയ്ക്ക് കിളികളുടെ പേച്ചുകളകളം
        bin: മരം നൽകിയിരുന്നത്
        clue: കിളികൾ എവിടെയിരുന്നാണ് ശബ്ദിച്ചത്?
        why: മരം കിളികൾക്ക് ഇടം നൽകി.
      - label: '"മുറിച്ചുതള്ളിപ്പലക പിടിപ്പിൻ!"'
        bin: ലാഭക്കൊതിയുടെ ശബ്ദം
        clue: മരത്തെ എന്തായിട്ടാണ് ഇവിടെ കാണുന്നത്?
        why: മരം പലകയ്ക്കുള്ള തടി മാത്രമായി കാണുന്നു.
      - label: '"എന്തിലുമേറെക്കാമ്യം പണമേ"'
        bin: ലാഭക്കൊതിയുടെ ശബ്ദം
        clue: ഇവിടെ എന്തിനാണ് ഏറ്റവും വില?
        why: പണത്തെ എല്ലാറ്റിനും മേലെ കാണുന്ന ആധുനികമനുഷ്യന്റെ മനോഭാവം.
    lesson:
      - teach: '''പുളിമാവു വെട്ടി'' ഇടശ്ശേരി ഗോവിന്ദൻനായരുടെ കവിതയാണ്. പുറംപറമ്പിലെ പഴയ പുളിമാവ് ഒരാൾക്ക് വിറ്റു: ''മുറിച്ചുതള്ളിപ്പലക പിടിപ്പിൻ!'' വിറ്റതോടെ മരത്തിന്മേലുള്ള ഉടമസ്ഥാവകാശവും പോയി.'
        check:
          prompt: പുളിമാവ് മുറിച്ച് എന്താക്കാനാണ് വാങ്ങിയയാൾ പറയുന്നത്?
          options:
          - പലക
          - വിറക്
          - വള്ളം
          answer: പലക
          why: '''മുറിച്ചുതള്ളിപ്പലക പിടിപ്പിൻ!'''
      - teach: ആ മരം ഒരു കൊടുമുടിപോലെ (ഗിരിശൃംഗം) നിന്നിരുന്നു. പാടത്തിന്റെ കരയിൽ അത് നമ്മുടെ കുടിലിന്റെ അടയാളമായിരുന്നു; ചില്ലകളിൽ ദേവന്മാർക്ക് ആവാസം, ഉച്ചയ്ക്ക് കിളികളുടെ കളകളം, പാലക്കാടൻ കുളിർകാറ്റിന്റെ നൃത്തം. മരം പോകുമ്പോൾ ഇതെല്ലാം പോകുന്നു.
        picture:
          kind: compare
          columns:
          - title: മരം ഉണ്ടായിരുന്നപ്പോൾ
            points:
            - കുടിലിന്റെ അടയാളം
            - കിളികളുടെ കളകളം
            - പച്ചത്തണൽ
            - കാറ്റിന്റെ നൃത്തം
          - title: മരം വെട്ടിയപ്പോൾ
            points:
            - അടയാളമില്ല
            - കിളികൾ അകലേക്ക്
            - തണലില്ല
            - നൃത്തം തത്തിക്കാനാരുമില്ല
          alt: പുളിമാവ് ഉണ്ടായിരുന്നപ്പോഴും വെട്ടിയപ്പോഴും ഉള്ള വ്യത്യാസം.
        check:
          prompt: '''ഗിരിശൃംഗം'' എന്നതിന്റെ അർഥം:'
          options:
          - കൊടുമുടി
          - പുഴ
          - പാടം
          answer: കൊടുമുടി
          why: ഗിരി = മല, ശൃംഗം = മുകൾഭാഗം.
