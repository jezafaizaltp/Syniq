subject: mal
chapter: 8
title: "അടിസ്ഥാനപാഠാവലി 3: ആരോഗ്യത്തിന്റെ രസക്കൂട്ടുകൾ"

tips:
  mal_feast_satire: "'അല്പമല്ല ഭുജിക്കുന്നു' (കുഞ്ചൻനമ്പ്യാർ, 'പഞ്ചേന്ദ്രോപാഖ്യാനം' തുള്ളൽ): നീണ്ട സദ്യവിഭവപ്പട്ടികയിലൂടെ അമിതഭക്ഷണക്കൊതിയെ ഫലിതത്തോടെ പരിഹസിക്കുന്നു: 'കഴുത്തോളം പൂർണ്ണമായിട്ടുപ്പുറത്തു കവിഞ്ഞാലും തൃപ്തിയില്ല ചിലർക്കെല്ലാം'."
  mal_kittummavan: "'കിട്ടുമ്മാവൻ' (തകഴി, 'കുറേ കഥാപാത്രങ്ങൾ'): തീറ്റക്കൊതിയനായ കിട്ടുമ്മാവൻ ഭാഗംകിട്ടിയ നിലം വിറ്റ് കാപ്പിക്കട തുടങ്ങി, പിന്നെ വള്ളത്തിൽ കപ്പ വിറ്റു, ഒടുവിൽ വീടുതോറും 'കഞ്ഞിവെള്ളമായാലും മതി' എന്ന് ഇരന്നു."
  mal_local_food: "'ഭക്ഷണവും ആരോഗ്യവും': പ്രാദേശികഭക്ഷണം പുതുമയുള്ളതും പോഷകം കൂടിയതുമാണ്; വിളവെടുത്തശേഷം വിറ്റാമിനുകൾ കുറഞ്ഞുവരുന്നു. ആഗോള ഭക്ഷ്യവ്യവസ്ഥ കാഴ്ചയ്ക്ക് ഭംഗിയുള്ളതും ദൂരേക്ക് കൊണ്ടുപോകാവുന്നതുമായ ഭക്ഷണത്തിനാണ് പ്രാധാന്യം നൽകുന്നത് (പച്ചയ്ക്ക് പറിച്ച് എഥിലീൻ കൊണ്ട് പഴുപ്പിക്കുന്ന തക്കാളി)."
  mal_and_or: "'ഉം' ചേർത്താൽ എല്ലാം ഒന്നിച്ച് (നാരങ്ങയും മാങ്ങയും = രണ്ടും); 'ഓ' ചേർത്താൽ ഏതെങ്കിലും ഒന്ന് (നാരങ്ങയോ മാങ്ങയോ = ഒന്നുമാത്രം)."
  mal_derived_word: "നാമത്തിൽനിന്ന് വിശേഷണം: പ്രദേശം → പ്രാദേശികം, വ്യവസായം → വ്യാവസായികം, കൃഷി → കാർഷികം. ആദ്യസ്വരം നീളുന്നു (അ → ആ, ഋ → ആർ), ഒടുവിൽ '-ഇകം' ചേരുന്നു."

concepts:
  - code: mal9.u8.alpamalla
    title: അല്പമല്ല ഭുജിക്കുന്നു
    notes: |
      കുഞ്ചൻനമ്പ്യാരുടെ 'പഞ്ചേന്ദ്രോപാഖ്യാനം' എന്ന തുള്ളൽകൃതിയിൽനിന്നുള്ള ഭാഗം. ഒരു സദ്യയിലെ
      വിഭവങ്ങളുടെ നീണ്ട പട്ടിക: ചോറ്, നെയ്യ്, നേന്ത്രപ്പഴം, തേൻ, പപ്പടം, ഇഞ്ചിമാങ്ങ, നാരങ്ങക്കറി,
      വേപ്പിലക്കട്ടി, പരിപ്പ്, പച്ചടി, പഞ്ചസാര പുരട്ടിയ ഉപ്പേരി... "ചെറുതുമ്പപ്പൂവിനൊക്കും വെളുത്തുപ്പും"
      (തുമ്പപ്പൂ പോലെ വെളുത്ത ഉപ്പ്); "എരിശ്ശേരി നാലുകൂട്ടം പ്രഥമനങ്ങഞ്ചുകൂട്ടം". "കഴുത്തോളം
      പൂർണ്ണമായിട്ടുപ്പുറത്തു കവിഞ്ഞാലും തൃപ്തിയില്ല ചിലർക്കെല്ലാം" — അമിതഭക്ഷണക്കൊതിയെ
      ഫലിതത്തോടെ പരിഹസിക്കുന്നു. തുള്ളലിന്റെ മുഖമുദ്ര: ഫലിതവും സാമൂഹികവിമർശനവും. പഴഞ്ചൊല്ലുകൾ:
      "അത്താഴം അരവയറ്", "അന്നവിചാരം മുന്നവിചാരം". ഭാഷ: വേപ്പില + കട്ടി = വേപ്പിലക്കട്ടി,
      തുമ്പ + പൂ = തുമ്പപ്പൂ.
    explanations:
      text: "നമ്പ്യാർ സദ്യയുടെ രുചി വർണ്ണിക്കുകയും, അതേ സമയം കഴുത്തോളം തിന്നിട്ടും തൃപ്തിവരാത്തവരെ കളിയാക്കുകയും ചെയ്യുന്നു. ചിരിപ്പിച്ചുകൊണ്ട് ചിന്തിപ്പിക്കുന്നതാണ് തുള്ളലിന്റെ രീതി."
      visual: "ഒരു വാഴയിലയിൽ വിഭവങ്ങൾ വരയ്ക്കുക: ചോറ്, പരിപ്പ്, നെയ്യ്, പപ്പടം, ഉപ്പേരി, ഇഞ്ചിമാങ്ങ, നാരങ്ങക്കറി, പച്ചടി, എരിശ്ശേരി (4 കൂട്ടം), പ്രഥമൻ (5 കൂട്ടം)."
      step_by_step: "1. വിഭവങ്ങളുടെ പട്ടിക (വർണ്ണന). 2. അളവില്ലാതെ തിന്നുന്നവരുടെ ചിത്രം. 3. 'തൃപ്തിയില്ല' — പരിഹാസം. 4. സന്ദേശം: മിതമായ ഭക്ഷണമാണ് ആരോഗ്യം ('അത്താഴം അരവയറ്')."
      real_world: "കല്യാണസദ്യകളിൽ ധാരാളം ഭക്ഷണം പാഴാകുന്നു. ആവശ്യത്തിനുമാത്രം വിളമ്പിക്കഴിക്കുന്നത് ആരോഗ്യത്തിനും നാടിനും നല്ലതാണ്."
    items:
      - prompt: "'അല്പമല്ല ഭുജിക്കുന്നു' എന്ന ഭാഗം ആരുടെ കൃതിയിൽനിന്നാണ്?"
        options: ["കുഞ്ചൻനമ്പ്യാർ", "കുമാരനാശാൻ", "ഉള്ളൂർ", "ഇടശ്ശേരി"]
        answer: "കുഞ്ചൻനമ്പ്യാർ"
        difficulty: 1
        hints: ["തുള്ളൽ പ്രസ്ഥാനത്തിന്റെ ഉപജ്ഞാതാവ്."]
        solution: "കുഞ്ചൻനമ്പ്യാർ ('പഞ്ചേന്ദ്രോപാഖ്യാനം')."
        mistakes: {"കുമാരനാശാൻ": mal_author_work}
      - prompt: "കുഞ്ചൻനമ്പ്യാരുടെ കൃതികൾ ഏതു കലാരൂപത്തിനുവേണ്ടിയുള്ളതാണ്?"
        options: ["തുള്ളൽ", "കഥകളി", "കൂടിയാട്ടം", "തെയ്യം"]
        answer: "തുള്ളൽ"
        difficulty: 1
        hints: ["ഓട്ടൻതുള്ളൽ."]
        solution: "തുള്ളൽ."
        mistakes: {"കഥകളി": mal_feast_satire}
      - prompt: "'ചെറുതുമ്പപ്പൂവിനൊക്കും വെളുത്തുപ്പും' — ഉപ്പിനെ എന്തിനോടാണ് ഉപമിച്ചിരിക്കുന്നത്?"
        options: ["തുമ്പപ്പൂവിനോട്", "മഞ്ഞിനോട്", "പഞ്ചസാരയോട്", "പാലിനോട്"]
        answer: "തുമ്പപ്പൂവിനോട്"
        difficulty: 1
        hints: ["'ഒക്കും' = തുല്യമാകും."]
        solution: "തുമ്പപ്പൂ പോലെ വെളുത്ത ഉപ്പ്."
        mistakes: {"പഞ്ചസാരയോട്": mal_imagery}
      - prompt: "സദ്യയിൽ പ്രഥമൻ എത്ര കൂട്ടം ഉണ്ടായിരുന്നു?"
        answer: "5"
        check: "5"
        difficulty: 2
        hints: ["'എരിശ്ശേരി നാലുകൂട്ടം പ്രഥമനങ്ങഞ്ചുകൂട്ടം'."]
        solution: "അഞ്ചു (5) കൂട്ടം; എരിശ്ശേരി നാലു കൂട്ടം."
        mistakes: {"4": mal_read_again}
      - prompt: "'കഴുത്തോളം പൂർണ്ണമായിട്ടുപ്പുറത്തു കവിഞ്ഞാലും തൃപ്തിയില്ല ചിലർക്കെല്ലാം' — ഈ വരികളിലെ ഭാവം?"
        options: ["അമിതഭക്ഷണക്കൊതിയെക്കുറിച്ചുള്ള പരിഹാസം", "ദുഃഖം", "ഭക്തി", "ദേശസ്നേഹം"]
        answer: "അമിതഭക്ഷണക്കൊതിയെക്കുറിച്ചുള്ള പരിഹാസം"
        difficulty: 2
        hints: ["തുള്ളലിലെ ഫലിതം."]
        solution: "ആർത്തിയെ കളിയാക്കുന്ന ആക്ഷേപഹാസ്യം."
        mistakes: {"ഭക്തി": mal_feast_satire}
      - prompt: "വേപ്പില + കട്ടി ചേർത്തെഴുതുക."
        options: ["വേപ്പിലക്കട്ടി", "വേപ്പിലകട്ടി", "വേപ്പിലയ്ക്കട്ടി", "വേപ്പില്കട്ടി"]
        answer: "വേപ്പിലക്കട്ടി"
        difficulty: 2
        hints: ["തുമ്പ + പൂ = തുമ്പപ്പൂ പോലെ."]
        solution: "'ക' ഇരട്ടിച്ച് വേപ്പിലക്കട്ടി (ദ്വിത്വസന്ധി)."
        mistakes: {"വേപ്പിലകട്ടി": mal_sandhi}
      - prompt: "പാഠത്തിന്റെ ആശയത്തോട് ഏറ്റവും ചേരുന്ന പഴഞ്ചൊല്ല്?"
        options: ["അത്താഴം അരവയറ്", "അക്കരപ്പച്ച", "ആന കൊടുത്താലും ആശ കൊടുക്കരുത്", "മിന്നുന്നതെല്ലാം പൊന്നല്ല"]
        answer: "അത്താഴം അരവയറ്"
        difficulty: 3
        hints: ["മിതമായ ഭക്ഷണം."]
        solution: "അത്താഴം അരവയറ് = രാത്രി വയർ നിറയെ തിന്നരുത്; മിതത്വമാണ് ആരോഗ്യം."
        mistakes: {"മിന്നുന്നതെല്ലാം പൊന്നല്ല": mal_feast_satire}

  - code: mal9.u8.kittummavan
    title: കിട്ടുമ്മാവൻ
    notes: |
      തകഴി ശിവശങ്കരപ്പിള്ളയുടെ 'കുറേ കഥാപാത്രങ്ങൾ' എന്ന കൃതിയിൽനിന്ന്. കിട്ടുമ്മാവനും ഭാര്യ
      കുട്ടിച്ചേച്ചിയും. തീറ്റക്കൊതിയാണ് കിട്ടുമ്മാവന്റെ മുഖമുദ്ര: തോരൻ, ചമ്മന്തി, പായസം... എന്നിങ്ങനെ
      ഓരോന്ന് ആവശ്യപ്പെടും. പന്ത്രണ്ടു മണിവരെ രണ്ടാളുടെ പണി ചെയ്യും. കുടുംബം ഭാഗം വച്ചപ്പോൾ ഏകദേശം
      മുപ്പതു പറ നിലവും ഒരു പുരയിടവും കിട്ടി. നിലം നാലുപേർക്ക് വിറ്റ് ഒരു കാപ്പിക്കട തുടങ്ങി; ആറു ദോശ
      സ്വയം തിന്നു; കട പൊളിഞ്ഞു. പിന്നെ വള്ളത്തിൽ കപ്പ വിൽക്കുന്നയാളായി. ഒടുവിൽ വീടുതോറും ഇരന്നു:
      "വല്ലതും തരണം. കഞ്ഞിവെള്ളമായാലും മതി". സ്ത്രീകൾ പറഞ്ഞു: "വയറ്റിൽ പുഴുവാണ്". ഹാസ്യവും
      സഹതാപവും കലർന്ന ഒരു കഥാപാത്രചിത്രം. ഭാഷ: 'നാരങ്ങയോ മാങ്ങയോ' / 'നാരങ്ങയും മാങ്ങയും'.
    explanations:
      text: "അധ്വാനിയായിരുന്നിട്ടും ഭക്ഷണത്തോടുള്ള അമിതമായ കൊതി കാരണം ഉള്ളതെല്ലാം നഷ്ടപ്പെട്ട ഒരു മനുഷ്യന്റെ കഥ. തകഴി അയാളെ കളിയാക്കുന്നതിനൊപ്പം അയാളോട് സഹതാപവും ഉണർത്തുന്നു."
      visual: "ഒരു ഇറക്കപ്പടി: 30 പറ നിലം → നിലം വിറ്റു → കാപ്പിക്കട (6 ദോശ!) → വള്ളത്തിൽ കപ്പക്കച്ചവടം → വീടുതോറും 'കഞ്ഞിവെള്ളമായാലും മതി'."
