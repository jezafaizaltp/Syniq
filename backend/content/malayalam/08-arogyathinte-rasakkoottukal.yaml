      - teach: 'ഭാഷ: നാമത്തിൽനിന്ന് വിശേഷണം. പ്രദേശം → പ്രാദേശികം, വ്യവസായം → വ്യാവസായികം, കൃഷി → കാർഷികം. ആദ്യ അക്ഷരത്തിലെ സ്വരം നീളുകയും ''-ികം'' ചേരുകയും ചെയ്യുന്നു. അനുബന്ധ വാർത്ത: കേരളത്തിലെ ചക്ക ജർമ്മനിയിൽ ഹിറ്റായി (''സ്റ്റേൺ'' വാരിക).'
