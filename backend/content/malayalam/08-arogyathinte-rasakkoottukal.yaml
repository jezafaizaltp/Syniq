        - ബെന്യാമിൻ
        - എം. ടി. വാസുദേവൻ നായർ
        answer: തകഴി ശിവശങ്കരപ്പിള്ള
        difficulty: 1
        hints:
        - കുട്ടനാടിന്റെ കഥാകാരൻ.
        - '''ചെമ്മീൻ'' എഴുതിയയാൾ.'
