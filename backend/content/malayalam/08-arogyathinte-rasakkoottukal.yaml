      - label: പുതുമയുള്ള, പോഷകം കൂടിയ പച്ചക്കറി
        bin: പ്രാദേശികഭക്ഷണം
        clue: വിളവെടുത്ത് അധികം വൈകാതെ കഴിച്ചാൽ വിറ്റാമിന് എന്തു സംഭവിക്കും?
        why: വിറ്റാമിൻ ക്രമേണ കുറയും; അടുത്തുനിന്നുള്ളത് പുതുമയുള്ളത്.
      - label: മണ്ണിലെ സൂക്ഷ്മജീവികളുടെ ചെറിയ പാടുള്ള പഴം
        bin: പ്രാദേശികഭക്ഷണം
        clue: ലേഖനം ഈ പാടുകളെ ദോഷമായി കാണുന്നുണ്ടോ?
        why: 'ഈ പാടുകൾ ദോഷമല്ല: പ്രാദേശിക, സ്വാഭാവിക ഭക്ഷണം.'
    lesson:
      - teach: '''ഭക്ഷണവും ആരോഗ്യവും'' — ''നമ്മുടെ ഭക്ഷണം നമ്മുടെ നാട്ടിൽ'' എന്ന കൃതിയിലെ ലേഖനം (ഹെലേന നോർബെർഗ്-ഹോഡ്ജ് തുടങ്ങിയവർ; പരിഭാഷ എം. പി. പരമേശ്വരൻ തുടങ്ങിയവർ). ആഗോള ഭക്ഷ്യവ്യവസ്ഥ വളർച്ചാഹോർമോൺ, കീടനാശിനി, പഞ്ചസാരപ്പാനീയങ്ങൾ, കൃത്രിമനിറങ്ങൾ എന്നിവയിലൂടെ രോഗങ്ങൾ കൂട്ടുന്നു — മരുന്നുവ്യവസായത്തിന് കൂടുതൽ രോഗികൾ.'
        check:
