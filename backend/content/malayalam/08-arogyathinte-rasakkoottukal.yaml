      - prompt: "കിട്ടുമ്മാവന്റെ പ്രധാന സ്വഭാവദോഷം?"
        options: ["തീറ്റക്കൊതി", "മടി", "ദേഷ്യം", "കള്ളം പറയൽ"]
        answer: "തീറ്റക്കൊതി"
