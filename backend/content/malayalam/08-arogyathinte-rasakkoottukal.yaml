      prompt: ലേഖനമനുസരിച്ച് ഇവ പ്രാദേശികഭക്ഷണത്തിന്റെ സ്വഭാവമോ, ആഗോള ഭക്ഷ്യവ്യവസ്ഥയുടേതോ?
      bins:
      - പ്രാദേശികഭക്ഷണം
