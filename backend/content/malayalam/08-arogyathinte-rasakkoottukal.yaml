        hints: ["'കുറേ കഥാപാത്രങ്ങൾ'."]
        solution: "തകഴി ശിവശങ്കരപ്പിള്ള."
        mistakes: {"ബഷീർ": mal_author_work}
      - prompt: "കിട്ടുമ്മാവന്റെ ഭാര്യയുടെ പേര്?"
