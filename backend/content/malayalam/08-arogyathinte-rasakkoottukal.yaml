    after: [mal9.u8.kittummavan]
    notes: |
      'ഉം' (സമുച്ചയം) രണ്ടോ അധികമോ കാര്യങ്ങളെ ഒന്നിച്ചു ചേർക്കുന്നു: "നാരങ്ങയും മാങ്ങയും വേണം" =
      രണ്ടും വേണം. 'ഓ' (വികല്പം) ഏതെങ്കിലും ഒന്ന് തിരഞ്ഞെടുക്കാൻ: "നാരങ്ങയോ മാങ്ങയോ വേണം" = ഒന്ന്
      മതി. 'ഓ' ചോദ്യത്തിനും ഉപയോഗിക്കും: "നീ വരുന്നോ?". നാമത്തിൽനിന്ന് വിശേഷണം ഉണ്ടാക്കൽ:
      പ്രദേശം → പ്രാദേശികം (ലേഖനത്തിലെ പ്രവർത്തനം).
