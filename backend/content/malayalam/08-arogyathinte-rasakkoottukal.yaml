        why: കൂടുതൽ രോഗികളെ സൃഷ്ടിക്കുന്ന ഭക്ഷണത്തിന്റെ ഉദാഹരണം.
      - label: പച്ചയ്ക്ക് പറിച്ച്, എഥിലീൻകൊണ്ട് പഴുപ്പിച്ച തക്കാളി
        bin: ആഗോള ഭക്ഷ്യവ്യവസ്ഥ
