        - ആറു ദോശ ആരാണ് തിന്നത്?
        solution: നിയന്ത്രിക്കാനാവാത്ത കൊതിയാണ് അയാളെ തകർത്തത്; ആഗ്രഹങ്ങളിൽ നിയന്ത്രണം വേണം.
