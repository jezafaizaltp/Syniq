  - code: mal9.u8.um_o
    title: "ഭാഷ: 'ഉം', 'ഓ' എന്നീ ഘടകങ്ങൾ"
    after: [mal9.u8.kittummavan]
    notes: |
      'ഉം' (സമുച്ചയം) രണ്ടോ അധികമോ കാര്യങ്ങളെ ഒന്നിച്ചു ചേർക്കുന്നു: "നാരങ്ങയും മാങ്ങയും വേണം" =
      രണ്ടും വേണം. 'ഓ' (വികല്പം) ഏതെങ്കിലും ഒന്ന് തിരഞ്ഞെടുക്കാൻ: "നാരങ്ങയോ മാങ്ങയോ വേണം" = ഒന്ന്
      മതി. 'ഓ' ചോദ്യത്തിനും ഉപയോഗിക്കും: "നീ വരുന്നോ?". നാമത്തിൽനിന്ന് വിശേഷണം ഉണ്ടാക്കൽ:
      പ്രദേശം → പ്രാദേശികം (ലേഖനത്തിലെ പ്രവർത്തനം).
    explanations:
      text: "'ഉം' = എല്ലാം ഒരുമിച്ച്; 'ഓ' = ഏതെങ്കിലും ഒന്ന്. ഒരക്ഷരത്തിന്റെ വ്യത്യാസം അർഥം മുഴുവൻ മാറ്റുന്നു."
      visual: "രണ്ടു പാത്രങ്ങൾ: 'ഉം' — നാരങ്ങയും മാങ്ങയും ഒരേ പാത്രത്തിൽ; 'ഓ' — നാരങ്ങയോ മാങ്ങയോ: ഒന്നുമാത്രം പാത്രത്തിൽ, മറ്റേത് പുറത്ത്."
      step_by_step: "1. വാക്യത്തിൽ എത്ര കാര്യങ്ങൾ വേണം എന്ന് ചോദിക്കുക. 2. എല്ലാം വേണമെങ്കിൽ 'ഉം'. 3. ഒന്നുമതിയെങ്കിൽ 'ഓ'."
      real_world: "കടയിൽ 'പാലും റൊട്ടിയും വാങ്ങണം' എന്നും 'പാലോ റൊട്ടിയോ വാങ്ങണം' എന്നും പറയുന്നത് രണ്ട് വ്യത്യസ്ത ആവശ്യങ്ങളാണ്."
