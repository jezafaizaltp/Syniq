      - prompt: '''പന്ത്രണ്ടു മണിവരെ രണ്ടാളുടെ പണി ചെയ്യും'' — ഇത് കിട്ടുമ്മാവനെക്കുറിച്ച് എന്തു കാണിക്കുന്നു?'
