        - അയാൾ മടിയനായിരുന്നു
        - അയാൾക്ക് ജോലിയില്ലായിരുന്നു
        - അയാൾ പണക്കാരനായിരുന്നു
        answer: കൊതിയനാണെങ്കിലും കഠിനാധ്വാനിയായിരുന്നു
        difficulty: 3
        hints:
