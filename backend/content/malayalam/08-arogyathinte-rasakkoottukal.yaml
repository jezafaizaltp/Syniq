      - prompt: "ആഗോള ഭക്ഷ്യവ്യവസ്ഥ ഭക്ഷണത്തിൽ കൂടുതൽ വിലകൽപ്പിക്കുന്നത് എന്തിനാണെന്നാണ് ലേഖനം പറയുന്നത്?"
        options: ["കാഴ്ചയിലെ ഭംഗിക്കും ദൂരയാത്രയ്ക്കുള്ള കഴിവിനും", "പോഷകത്തിന്", "കർഷകന്റെ ആരോഗ്യത്തിന്", "മണ്ണിന്റെ ഫലഭൂയിഷ്ഠതയ്ക്ക്"]
        answer: "കാഴ്ചയിലെ ഭംഗിക്കും ദൂരയാത്രയ്ക്കുള്ള കഴിവിനും"
