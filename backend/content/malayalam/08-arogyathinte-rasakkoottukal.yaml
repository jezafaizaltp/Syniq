          teach: 'നാമത്തിൽനിന്ന് വിശേഷണം രണ്ടു പടികളിൽ. ഒന്ന്: ആദ്യ അക്ഷരത്തിലെ സ്വരം നീട്ടുക: പ്ര → പ്രാ, കൃ → കാ. രണ്ട്: അവസാനം ''-ികം'' ചേർക്കുക: പ്രദേശം → പ്രാദേശികം; കൃഷി → കാർഷികം. ഇതേ രീതി മറ്റു നാമങ്ങളിലും പരീക്ഷിക്കൂ. അനുബന്ധ വാർത്ത: കേരളത്തിലെ ചക്ക ജർമ്മനിയിൽ ഹിറ്റായി (''സ്റ്റേൺ'' വാരിക).'
