      text: "'ഉം' = എല്ലാം ഒരുമിച്ച്; 'ഓ' = ഏതെങ്കിലും ഒന്ന്. ഒരക്ഷരത്തിന്റെ വ്യത്യാസം അർഥം മുഴുവൻ മാറ്റുന്നു."
      visual: "രണ്ടു പാത്രങ്ങൾ: 'ഉം' — നാരങ്ങയും മാങ്ങയും ഒരേ പാത്രത്തിൽ; 'ഓ' — നാരങ്ങയോ മാങ്ങയോ: ഒന്നുമാത്രം പാത്രത്തിൽ, മറ്റേത് പുറത്ത്."
