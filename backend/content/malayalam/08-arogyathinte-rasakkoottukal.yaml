        solution: "ഏകദേശം മുപ്പത് (30) പറ."
        mistakes: {"6": mal_read_again}
      - prompt: "നിലം വിറ്റ പണം കൊണ്ട് കിട്ടുമ്മാവൻ ആദ്യം എന്തു തുടങ്ങി?"
        options: ["കാപ്പിക്കട", "കപ്പക്കൃഷി", "വള്ളക്കച്ചവടം", "തുണിക്കട"]
        answer: "കാപ്പിക്കട"
        difficulty: 2
        hints: ["അവിടെ ആറു ദോശ അദ്ദേഹം തന്നെ തിന്നു."]
        solution: "കാപ്പിക്കട; പിന്നീടാണ് വള്ളത്തിൽ കപ്പ വിറ്റത്."
        mistakes: {"വള്ളക്കച്ചവടം": mal_kittummavan}
      - prompt: "ഇരക്കാൻ വന്ന കിട്ടുമ്മാവനെക്കുറിച്ച് സ്ത്രീകൾ പറഞ്ഞത്?"
        options: ["വയറ്റിൽ പുഴുവാണ്", "അയാൾ പണക്കാരനാണ്", "അയാൾ ദൈവമാണ്", "അയാൾക്ക് വിശപ്പില്ല"]
        answer: "വയറ്റിൽ പുഴുവാണ്"
        difficulty: 2
        hints: ["എത്ര തിന്നാലും വിശപ്പ് മാറില്ല എന്ന അർഥത്തിൽ."]
        solution: "'വയറ്റിൽ പുഴുവാണ്'."
        mistakes: {"അയാൾക്ക് വിശപ്പില്ല": mal_read_again}
      - prompt: "കിട്ടുമ്മാവനോടുള്ള തകഴിയുടെ സമീപനം ഏറ്റവും നന്നായി വിവരിക്കുന്നത്?"
        options: ["ഹാസ്യവും സഹതാപവും ഒരുമിച്ച്", "കടുത്ത വെറുപ്പ്", "ആരാധന", "തീർത്തും നിസ്സംഗത"]
        answer: "ഹാസ്യവും സഹതാപവും ഒരുമിച്ച്"
        difficulty: 3
        hints: ["നാം ചിരിക്കുന്നു, പക്ഷേ ഒടുവിൽ അയാളുടെ അവസ്ഥ വേദനിപ്പിക്കുന്നു."]
        solution: "ചിരിപ്പിക്കുന്ന വിവരണം; ഒപ്പം ഇരക്കേണ്ടിവന്ന ഒരു മനുഷ്യനോടുള്ള സഹതാപം."
        mistakes: {"കടുത്ത വെറുപ്പ്": mal_kittummavan}
      - prompt: "കാപ്പിക്കട തുടങ്ങിയ കിട്ടുമ്മാവൻ ആറു ദോശ സ്വയം തിന്നു; കട പൊളിഞ്ഞു. ഇതിൽനിന്ന് മനസ്സിലാക്കാവുന്നത്?"
        options: ["നിയന്ത്രിക്കാനാവാത്ത കൊതി സ്വന്തം ജീവിതം തകർക്കും", "കാപ്പിക്കട നല്ല കച്ചവടമല്ല", "ദോശ ആരോഗ്യത്തിന് ദോഷമാണ്", "നാട്ടുകാർ കട കൊള്ളയടിച്ചു"]
        answer: "നിയന്ത്രിക്കാനാവാത്ത കൊതി സ്വന്തം ജീവിതം തകർക്കും"
        difficulty: 3
        hints: ["കച്ചവടത്തിനുള്ള ദോശ ആരാണ് തിന്നത്?", "അതിനുശേഷം കിട്ടുമ്മാവന്റെ ജീവിതം എങ്ങോട്ടു പോയി?"]
        solution: "Step 1: വിൽക്കാനുള്ളത് തിന്നുതീർത്തതുകൊണ്ട് കട പൊളിഞ്ഞു. Step 2: പിന്നീട് കപ്പക്കച്ചവടവും ഇരക്കലും: കൊതി അദ്ദേഹത്തിന്റെ ജീവിതം തകർത്തു."
        mistakes: {"കാപ്പിക്കട നല്ല കച്ചവടമല്ല": mal_kittummavan, "ദോശ ആരോഗ്യത്തിന് ദോഷമാണ്": mal_kittummavan, "നാട്ടുകാർ കട കൊള്ളയടിച്ചു": mal_read_again}
      - prompt: "'വല്ലതും തരണം. കഞ്ഞിവെള്ളമായാലും മതി' — ഈ വാക്കുകൾ വായിക്കുമ്പോൾ വായനക്കാരന് കിട്ടുമ്മാവനോട് തോന്നുന്നത് എന്താണ്?"
        options: ["ചിരിക്കൊപ്പം സഹതാപവും", "വെറുപ്പ് മാത്രം", "ഭയം", "അസൂയ"]
        answer: "ചിരിക്കൊപ്പം സഹതാപവും"
        difficulty: 3
        hints: ["ഭാഗം വച്ചപ്പോൾ മുപ്പതു പറ നിലം കിട്ടിയ ഒരാളാണ് ഇപ്പോൾ ഇരക്കുന്നത്.", "തകഴി ഇദ്ദേഹത്തെ വെറുക്കപ്പെട്ടവനായാണോ ചിത്രീകരിക്കുന്നത്?"]
        solution: "Step 1: കൊതിയുടെ കഥകൾ ചിരിപ്പിക്കുന്നു. Step 2: എന്നാൽ എല്ലാം നഷ്ടപ്പെട്ട് കഞ്ഞിവെള്ളം ഇരക്കുന്ന അവസ്ഥ വേദനിപ്പിക്കുന്നു: ഹാസ്യവും സഹതാപവും ഒന്നിച്ച്."
        mistakes: {"വെറുപ്പ് മാത്രം": mal_kittummavan, "ഭയം": mal_kittummavan, "അസൂയ": mal_kittummavan}
      - prompt: '''കുറേ കഥാപാത്രങ്ങൾ'' എഴുതിയതാര്?'
