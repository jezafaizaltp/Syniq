  - code: mal9.u8.bhakshanam
    title: ഭക്ഷണവും ആരോഗ്യവും
    notes: |
      ഹെലേന നോർബെർഗ്-ഹോഡ്ജ് തുടങ്ങിയവർ എഴുതി എം. പി. പരമേശ്വരൻ തുടങ്ങിയവർ പരിഭാഷപ്പെടുത്തിയ
      'നമ്മുടെ ഭക്ഷണം നമ്മുടെ നാട്ടിൽ' എന്ന കൃതിയിൽനിന്നുള്ള ലേഖനം. ആഗോള ഭക്ഷ്യവ്യവസ്ഥ കൂടുതൽ
      ഉപഭോക്താക്കളെ — അതായത് ആഗോള മരുന്നുവ്യവസായത്തിന് കൂടുതൽ രോഗികളെ — സൃഷ്ടിക്കുന്നു എന്ന്
      ലേഖകർ വാദിക്കുന്നു: വളർച്ചാഹോർമോൺ കലർന്ന ഹാംബർഗറുകൾ, കീടനാശിനി തളിച്ച പച്ചക്കറികൾ, പഞ്ചസാര
      പാനീയങ്ങൾ, കൃത്രിമനിറങ്ങൾ. പ്രാദേശികഭക്ഷണം പുതുമയുള്ളതും പോഷകം കൂടിയതുമാണ്; വിളവെടുത്തശേഷം
      വിറ്റാമിനുകൾ ക്രമേണ കുറയുന്നു. ദൂരേക്ക് കൊണ്ടുപോകാൻ തക്കാളി പച്ചയ്ക്ക് പറിച്ച് എഥിലീൻ ഉപയോഗിച്ച്
      പഴുപ്പിക്കുന്നു; പോഷകത്തെക്കാൾ കാഴ്ചയ്ക്കാണ് വില. മണ്ണിലെ സൂക്ഷ്മജീവികൾ ഉണ്ടാക്കുന്ന ചെറിയ പാടുകൾ
      ദോഷമല്ല. അനുബന്ധ വാർത്ത: കേരളത്തിലെ ചക്ക ജർമ്മനിയിൽ ഹിറ്റ് ('സ്റ്റേൺ' വാരിക). ഭാഷ:
      പ്രദേശം-പ്രാദേശികം, വ്യവസായം-വ്യാവസായികം, കൃഷി-കാർഷികം.
    explanations:
      text: "നമ്മുടെ നാട്ടിൽ വിളയുന്ന പുതിയ ഭക്ഷണമാണ് ആരോഗ്യത്തിന് ഏറ്റവും നല്ലത്. ദൂരെനിന്ന് വരുന്ന, കാഴ്ചയ്ക്ക് ഭംഗിയുള്ള, രാസവസ്തുക്കൾ ചേർത്ത ഭക്ഷണം രോഗങ്ങൾ കൂട്ടുന്നു എന്ന് ലേഖനം വാദിക്കുന്നു."
      visual: "രണ്ടു തക്കാളിയുടെ താരതമ്യപ്പട്ടിക: പ്രാദേശികം (ചെടിയിൽ പഴുത്തത്, ചെറിയ പാടുകൾ, പോഷകം കൂടുതൽ) / ആഗോളം (പച്ചയ്ക്ക് പറിച്ച്, എഥിലീൻ, ആയിരക്കണക്കിന് കിലോമീറ്റർ യാത്ര, കാണാൻ മിനുസം)."
      step_by_step: "ലേഖനത്തിലെ വാദം: 1. ആഗോള ഭക്ഷ്യവ്യവസ്ഥയുടെ ലക്ഷ്യം ലാഭം. 2. അതിനായി രാസവസ്തുക്കളും ദീർഘദൂരയാത്രയും. 3. ഫലം: പോഷകക്കുറവും രോഗവും. 4. പരിഹാരം: പ്രാദേശികഭക്ഷണം."
      real_world: "വീട്ടുമുറ്റത്ത് ചീരയോ പയറോ വളർത്താം. ചക്ക, മാങ്ങ, പപ്പായ പോലുള്ള നാടൻ പഴങ്ങൾ പാക്കറ്റ് പലഹാരങ്ങളെക്കാൾ ആരോഗ്യകരമാണ്."
    items:
      - prompt: "ലേഖനമനുസരിച്ച് കൂടുതൽ പോഷകമുള്ളത് ഏതു ഭക്ഷണമാണ്?"
        options: ["പുതുമയുള്ള പ്രാദേശികഭക്ഷണം", "ദൂരെനിന്ന് ഇറക്കുമതി ചെയ്തത്", "കൃത്രിമനിറം ചേർത്തത്", "പാക്കറ്റിലാക്കിയത്"]
        answer: "പുതുമയുള്ള പ്രാദേശികഭക്ഷണം"
        difficulty: 1
        hints: ["വിളവെടുത്തശേഷം വിറ്റാമിനുകൾ കുറയുന്നു."]
        solution: "പ്രാദേശികഭക്ഷണം."
        mistakes: {"ദൂരെനിന്ന് ഇറക്കുമതി ചെയ്തത്": mal_local_food}
