subject: mal
chapter: 8
title: "അടിസ്ഥാനപാഠാവലി 3: ആരോഗ്യത്തിന്റെ രസക്കൂട്ടുകൾ"

tips:
  mal_feast_satire: "കുഞ്ചൻനമ്പ്യാർ ജനകീയമായ ഒരു കലാരൂപത്തിനായാണ് കൃതികൾ എഴുതിയത്; അതിൽ നർത്തകൻ തുള്ളിക്കൊണ്ട് പാടുന്നു. സദ്യയിലെ ഭക്ഷണക്കൊതിയെ കളിയാക്കുന്ന പാഠത്തിന് ചേരുന്നത് മിതമായി കഴിക്കാൻ പറയുന്ന പഴഞ്ചൊല്ലാണ്."
  mal_kittummavan: "കിട്ടുമ്മാവനെ ഓർക്കുമ്പോൾ ആദ്യം വരുന്നത് ഭക്ഷണത്തോടുള്ള അമിതമായ ഇഷ്ടമാണ്. നിലം വിറ്റ് തുടങ്ങിയ ആദ്യ കച്ചവടം പാഠത്തിൽ നോക്കൂ. തകഴി അദ്ദേഹത്തെ പരിഹസിക്കുകയാണോ, അതോ ചിരിയോടൊപ്പം അലിവും കാണിക്കുകയാണോ?"
  mal_local_food: "വിളവെടുത്തുകഴിഞ്ഞാൽ ഭക്ഷണത്തിലെ പോഷകം കുറഞ്ഞുവരും; അപ്പോൾ ഏത് ഭക്ഷണത്തിലാണ് കൂടുതൽ? ദൂരേക്ക് കൊണ്ടുപോകാൻ തക്കാളി പച്ചയ്ക്ക് പറിച്ച് ഒരു വാതകം കൊണ്ട് പഴുപ്പിക്കുന്നു. ആഗോളവ്യവസ്ഥ പോഷകത്തിനാണോ ഭംഗിക്കാണോ മുൻഗണന നൽകുന്നത്?"
  mal_and_or: "'-ഉം' എല്ലാം ഒന്നിച്ച് ചേർക്കുന്നു; '-ഓ' പലതിൽ ഒന്ന് തിരഞ്ഞെടുക്കാൻ പറയുന്നു. ചോദ്യത്തിൽ ഏതാണ് ഉപയോഗിച്ചതെന്ന് നോക്കി ഉത്തരം അതിനു ചേരുംവിധം നൽകൂ."
  mal_derived_word: "നാമത്തിൽനിന്ന് വിശേഷണം ഉണ്ടാക്കുമ്പോൾ ആദ്യസ്വരം നീളുന്നു (അ → ആ, ഋ → ആർ), ഒടുവിൽ '-ഇകം' ചേരുന്നു. ഈ നിയമം നിങ്ങൾക്ക് കിട്ടിയ പദത്തിൽ പ്രയോഗിക്കൂ."
  m8_feast_list: സദ്യയിലെ വിഭവപ്പട്ടിക ഒന്നുകൂടി വായിക്കൂ. ചോദ്യത്തിലെ വിഭവം പട്ടികയിൽ ഏതു രൂപത്തിലാണ് വരുന്നത്?
  m8_feast_humour: നമ്പ്യാർ ആരെയും നേരിട്ട് ചീത്ത പറയുന്നില്ല; ചിരിപ്പിച്ചുകൊണ്ട് ഒരു ദോഷം ചൂണ്ടിക്കാട്ടുന്നു. ഇവിടെ ഏതു ദോഷമാണ്?
  m8_kittu_story: 'കിട്ടുമ്മാവന്റെ ജീവിതം ക്രമത്തിൽ ഓർക്കൂ: ഭാഗം വയ്ക്കൽ, നിലം വിൽപ്പന, കാപ്പിക്കട, വള്ളത്തിലെ കച്ചവടം, ഒടുവിൽ ഇരക്കൽ.'
  m8_food_idea: ലേഖകർ ദൂരെനിന്നുള്ള, കാഴ്ചയ്ക്കു ഭംഗിയുള്ള ഭക്ഷണത്തെക്കാൾ പുതിയ നാടൻ ഭക്ഷണത്തെയാണ് പിന്തുണയ്ക്കുന്നത്. ഈ ഉത്തരം ഏതു പക്ഷത്താണ്?
  m8_adj_form: നാമത്തിൽനിന്ന് വിശേഷണമുണ്ടാക്കുമ്പോൾ ആദ്യ അക്ഷരത്തിലെ സ്വരം പലപ്പോഴും നീളുന്നു, അവസാനം '-ികം' വരുന്നു. പ്രദേശം → പ്രാദേശികം എന്നതുപോലെ ചെയ്തുനോക്കൂ.
  m8_um_o: '''ഉം'' എല്ലാം ഒന്നിച്ചു ചേർക്കുന്നു; ''ഓ'' ഏതെങ്കിലും ഒന്ന് തിരഞ്ഞെടുക്കാൻ പറയുന്നു. വാക്യത്തിൽ ഏതാണ് ഉപയോഗിച്ചത്?'

concepts:
  - code: mal9.u8.alpamalla
    title: അല്പമല്ല ഭുജിക്കുന്നു
    notes: |
      കുഞ്ചൻനമ്പ്യാരുടെ 'പഞ്ചേന്ദ്രോപാഖ്യാനം' എന്ന തുള്ളൽകൃതിയിൽനിന്നുള്ള ഭാഗം. ഒരു സദ്യയിലെ
      വിഭവങ്ങളുടെ നീണ്ട പട്ടിക: ചോറ്, നെയ്യ്, നേന്ത്രപ്പഴം, തേൻ, പപ്പടം, ഇഞ്ചിമാങ്ങ, നാരങ്ങക്കറി,
      വേപ്പിലക്കട്ടി, പരിപ്പ്, പച്ചടി, പഞ്ചസാര പുരട്ടിയ ഉപ്പേരി... "ചെറുതുമ്പപ്പൂവിനൊക്കും വെളുത്തുപ്പും"
      (തുമ്പപ്പൂ പോലെ വെളുത്ത ഉപ്പ്); "എരിശ്ശേരി നാലുകൂട്ടം പ്രഥമനങ്ങഞ്ചുകൂട്ടം". "കഴുത്തോളം
      പൂർണ്ണമായിട്ടുപ്പുറത്തു കവിഞ്ഞാലും തൃപ്തിയില്ല ചിലർക്കെല്ലാം" — അമിതഭക്ഷണക്കൊതിയെ
      ഫലിതത്തോടെ പരിഹസിക്കുന്നു. തുള്ളലിന്റെ മുഖമുദ്ര: ഫലിതവും സാമൂഹികവിമർശനവും. പഴഞ്ചൊല്ലുകൾ:
      "അത്താഴം അരവയറ്", "അന്നവിചാരം മുന്നവിചാരം". ഭാഷ: വേപ്പില + കട്ടി = വേപ്പിലക്കട്ടി,
      തുമ്പ + പൂ = തുമ്പപ്പൂ.
    explanations:
      text: "നമ്പ്യാർ സദ്യയുടെ രുചി വർണ്ണിക്കുകയും, അതേ സമയം കഴുത്തോളം തിന്നിട്ടും തൃപ്തിവരാത്തവരെ കളിയാക്കുകയും ചെയ്യുന്നു. ചിരിപ്പിച്ചുകൊണ്ട് ചിന്തിപ്പിക്കുന്നതാണ് തുള്ളലിന്റെ രീതി."
      visual: "ഒരു വാഴയിലയിൽ വിഭവങ്ങൾ വരയ്ക്കുക: ചോറ്, പരിപ്പ്, നെയ്യ്, പപ്പടം, ഉപ്പേരി, ഇഞ്ചിമാങ്ങ, നാരങ്ങക്കറി, പച്ചടി, എരിശ്ശേരി (4 കൂട്ടം), പ്രഥമൻ (5 കൂട്ടം)."
      step_by_step: "1. വിഭവങ്ങളുടെ പട്ടിക (വർണ്ണന). 2. അളവില്ലാതെ തിന്നുന്നവരുടെ ചിത്രം. 3. 'തൃപ്തിയില്ല' — പരിഹാസം. 4. സന്ദേശം: മിതമായ ഭക്ഷണമാണ് ആരോഗ്യം ('അത്താഴം അരവയറ്')."
      real_world: "കല്യാണസദ്യകളിൽ ധാരാളം ഭക്ഷണം പാഴാകുന്നു. ആവശ്യത്തിനുമാത്രം വിളമ്പിക്കഴിക്കുന്നത് ആരോഗ്യത്തിനും നാടിനും നല്ലതാണ്."
    activity:
      type: sort
      prompt: 'തുള്ളൽഭാഗത്തിലെ വരികൾ: വിഭവപ്പട്ടികയോ, ഉപമയോ, അമിതഭക്ഷണത്തിന്റെ പരിഹാസമോ?'
      bins:
      - വിഭവപ്പട്ടിക
      - ഉപമ
      - പരിഹാസം
      items:
      - label: ഇഞ്ചിമാങ്ങ, നാരങ്ങക്കറി
        bin: വിഭവപ്പട്ടിക
        clue: ഇവ ഇലയിൽ വിളമ്പുന്നതാണോ?
        why: സദ്യയിലെ വിഭവങ്ങളുടെ നീണ്ട പട്ടികയുടെ ഭാഗം.
      - label: എരിശ്ശേരി നാലുകൂട്ടം
        bin: വിഭവപ്പട്ടിക
        clue: ഇവിടെ എണ്ണുന്നത് എന്താണ്?
        why: 'വിഭവങ്ങളുടെ എണ്ണം: പട്ടിക.'
      - label: പ്രഥമനങ്ങഞ്ചുകൂട്ടം
        bin: വിഭവപ്പട്ടിക
        clue: പായസങ്ങൾ എത്ര?
        why: 'അഞ്ചുതരം പ്രഥമൻ: വിഭവപ്പട്ടിക.'
      - label: ചെറുതുമ്പപ്പൂവിനൊക്കും വെളുത്തുപ്പ്
        bin: ഉപമ
        clue: '''ഒക്കും'' = പോലെ. എന്തിനെ എന്തിനോടു താരതമ്യം ചെയ്യുന്നു?'
        why: 'ഉപ്പിന്റെ വെളുപ്പിനെ തുമ്പപ്പൂവിനോട്: ഉപമ.'
      - label: കഴുത്തോളം നിറഞ്ഞാലും തൃപ്തിയില്ല
        bin: പരിഹാസം
        clue: ഇത് ആരെക്കുറിച്ച്, ഏതു ഭാവത്തിൽ?
        why: അമിതഭക്ഷണക്കൊതിയെ ഫലിതത്തോടെ പരിഹസിക്കുന്നു.
      - label: അല്പമല്ല ഭുജിക്കുന്നു
        bin: പരിഹാസം
        clue: '''അല്പമല്ല'' എന്നതിൽ ഒരു ചിരിയുണ്ടോ?'
        why: വയറുനിറയെ തിന്നുന്നവരെ കളിയാക്കുന്നു.
    lesson:
      - teach: '''അല്പമല്ല ഭുജിക്കുന്നു'' കുഞ്ചൻനമ്പ്യാരുടെ ''പഞ്ചേന്ദ്രോപാഖ്യാനം'' എന്ന തുള്ളൽകൃതിയിലെ ഭാഗമാണ്. ഭുജിക്കുക = ഭക്ഷിക്കുക. ഒരു സദ്യയിലെ വിഭവങ്ങളുടെ നീണ്ട പട്ടിക: ചോറ്, നെയ്യ്, നേന്ത്രപ്പഴം, തേൻ, പപ്പടം, ഇഞ്ചിമാങ്ങ, നാരങ്ങക്കറി, വേപ്പിലക്കട്ടി, പരിപ്പ്, പച്ചടി, പഞ്ചസാര പുരട്ടിയ ഉപ്പേരി...'
        check:
          prompt: '''ഭുജിക്കുക'' എന്നതിന്റെ അർഥം:'
          options:
          - ഭക്ഷിക്കുക
          - ഓടുക
          - പാടുക
          answer: ഭക്ഷിക്കുക
          why: അല്പമല്ല ഭുജിക്കുന്നു = കുറച്ചല്ല തിന്നുന്നത്.
        ways:
        - style: real_world
          teach: 'ഓണസദ്യയ്ക്ക് ഇലയിൽ വിളമ്പുന്ന വിഭവങ്ങൾ എണ്ണിനോക്കിയിട്ടുണ്ടോ? കുഞ്ചൻനമ്പ്യാരുടെ ''പഞ്ചേന്ദ്രോപാഖ്യാനം'' എന്ന തുള്ളൽകൃതിയിലെ ''അല്പമല്ല ഭുജിക്കുന്നു'' (ഭുജിക്കുക = ഭക്ഷിക്കുക) അങ്ങനെയൊരു നീണ്ട പട്ടികയാണ്: ചോറ്, നെയ്യ്, നേന്ത്രപ്പഴം, തേൻ, പപ്പടം, ഇഞ്ചിമാങ്ങ, നാരങ്ങക്കറി, വേപ്പിലക്കട്ടി, പരിപ്പ്, പച്ചടി, പഞ്ചസാര പുരട്ടിയ ഉപ്പേരി...'
      - teach: 'ഉപ്പിനെ ചെറുതുമ്പപ്പൂവിനോട് ഉപമിക്കുന്നു: അത്ര വെളുത്തത്. എരിശ്ശേരി നാലുകൂട്ടം, പ്രഥമൻ അഞ്ചുകൂട്ടം. എന്നിട്ടും ''കഴുത്തോളം നിറഞ്ഞാലും തൃപ്തിയില്ല ചിലർക്കെല്ലാം'' — അമിതഭക്ഷണക്കൊതിയെ ചിരിപ്പിച്ചുകൊണ്ട് പരിഹസിക്കുന്നു.'
        picture:
          kind: bars
          bars:
          - label: എരിശ്ശേരി
            value: 4
          - label: പ്രഥമൻ
            value: 5
          unit: കൂട്ടം
          alt: സദ്യയിലെ എരിശ്ശേരിയുടെയും പ്രഥമന്റെയും കൂട്ടങ്ങളുടെ എണ്ണം.
        check:
          prompt: 'ഉപ്പിനെ ഉപമിക്കുന്നത്:'
          options:
          - തുമ്പപ്പൂവിനോട്
          - പഞ്ചസാരയോട്
          - മഞ്ഞിനോട്
          answer: തുമ്പപ്പൂവിനോട്
          why: '''ചെറുതുമ്പപ്പൂവിനൊക്കും വെളുത്തുപ്പ്.'''
        ways:
        - style: step_by_step
          teach: 'കവി എങ്ങനെ ചിരിപ്പിക്കുന്നു, പടിപടിയായി. ഒന്ന്: ഉപ്പിനെ ചെറുതുമ്പപ്പൂവിനോട് ഉപമിക്കുന്നു — അത്ര വെളുത്തത്. രണ്ട്: എരിശ്ശേരി നാലുകൂട്ടം, പ്രഥമൻ അഞ്ചുകൂട്ടം — വിഭവങ്ങൾ കൂടിക്കൂടി വരുന്നു. മൂന്ന്: എന്നിട്ടും ''കഴുത്തോളം നിറഞ്ഞാലും തൃപ്തിയില്ല ചിലർക്കെല്ലാം''. ഇങ്ങനെ അമിതഭക്ഷണക്കൊതിയെ ചിരിപ്പിച്ചുകൊണ്ട് പരിഹസിക്കുന്നു.'
      - teach: 'തുള്ളലിന്റെ മുഖമുദ്ര ഫലിതവും സാമൂഹികവിമർശനവുമാണ്. ''അത്താഴം അരവയറ്'' എന്ന പഴഞ്ചൊല്ല് മിതമായി കഴിക്കാനാണ് പറയുന്നത്. ഭാഷ: വേപ്പില + കട്ടി = വേപ്പിലക്കട്ടി; തുമ്പ + പൂ = തുമ്പപ്പൂ.'
        check:
          prompt: 'തുള്ളലിന്റെ മുഖമുദ്ര:'
          options:
          - ഫലിതവും സാമൂഹികവിമർശനവും
          - ദുഃഖവും വിരഹവും
          - യുദ്ധവർണ്ണന
          answer: ഫലിതവും സാമൂഹികവിമർശനവും
          why: ചിരിപ്പിച്ചുകൊണ്ട് സമൂഹത്തിലെ ദോഷങ്ങൾ കാണിക്കുന്നു.
        ways:
        - style: real_world
          teach: 'ഇന്നത്തെ ട്രോളുകൾ പോലെയാണ് തുള്ളൽ: ആളുകളെ ചിരിപ്പിക്കും, ഒപ്പം സമൂഹത്തിലെ കുറവുകൾ ചൂണ്ടിക്കാട്ടും. ഫലിതവും സാമൂഹികവിമർശനവുമാണ് തുള്ളലിന്റെ മുഖമുദ്ര. ''അത്താഴം അരവയറ്'' എന്ന പഴഞ്ചൊല്ല് മിതമായി കഴിക്കാനാണ് പറയുന്നത്. ഭാഷ: വേപ്പില + കട്ടി = വേപ്പിലക്കട്ടി; തുമ്പ + പൂ = തുമ്പപ്പൂ.'
    items:
      - prompt: "'അല്പമല്ല ഭുജിക്കുന്നു' എന്ന ഭാഗം ആരുടെ കൃതിയിൽനിന്നാണ്?"
        options: ["കുഞ്ചൻനമ്പ്യാർ", "കുമാരനാശാൻ", "ഉള്ളൂർ", "ഇടശ്ശേരി"]
        answer: "കുഞ്ചൻനമ്പ്യാർ"
        difficulty: 1
        hints: ["തുള്ളൽ പ്രസ്ഥാനത്തിന്റെ ഉപജ്ഞാതാവ്."]
        solution: "കുഞ്ചൻനമ്പ്യാർ ('പഞ്ചേന്ദ്രോപാഖ്യാനം')."
        mistakes: {"കുമാരനാശാൻ": mal_author_work}
      - prompt: "കുഞ്ചൻനമ്പ്യാരുടെ കൃതികൾ ഏതു കലാരൂപത്തിനുവേണ്ടിയുള്ളതാണ്?"
        options: ["തുള്ളൽ", "കഥകളി", "കൂടിയാട്ടം", "തെയ്യം"]
        answer: "തുള്ളൽ"
        difficulty: 1
        hints: ["ഓട്ടൻതുള്ളൽ."]
        solution: "തുള്ളൽ."
        mistakes: {"കഥകളി": mal_feast_satire}
      - prompt: "'ചെറുതുമ്പപ്പൂവിനൊക്കും വെളുത്തുപ്പും' — ഉപ്പിനെ എന്തിനോടാണ് ഉപമിച്ചിരിക്കുന്നത്?"
        options: ["തുമ്പപ്പൂവിനോട്", "മഞ്ഞിനോട്", "പഞ്ചസാരയോട്", "പാലിനോട്"]
        answer: "തുമ്പപ്പൂവിനോട്"
        difficulty: 1
        hints: ["'ഒക്കും' = തുല്യമാകും."]
        solution: "തുമ്പപ്പൂ പോലെ വെളുത്ത ഉപ്പ്."
        mistakes: {"പഞ്ചസാരയോട്": mal_imagery}
      - prompt: "സദ്യയിൽ പ്രഥമൻ എത്ര കൂട്ടം ഉണ്ടായിരുന്നു?"
        answer: "5"
        check: "5"
        difficulty: 2
        hints: ["'എരിശ്ശേരി നാലുകൂട്ടം പ്രഥമനങ്ങഞ്ചുകൂട്ടം'."]
        solution: "അഞ്ചു (5) കൂട്ടം; എരിശ്ശേരി നാലു കൂട്ടം."
        mistakes: {"4": mal_read_again}
      - prompt: "'കഴുത്തോളം പൂർണ്ണമായിട്ടുപ്പുറത്തു കവിഞ്ഞാലും തൃപ്തിയില്ല ചിലർക്കെല്ലാം' — ഈ വരികളിലെ ഭാവം?"
        options: ["അമിതഭക്ഷണക്കൊതിയെക്കുറിച്ചുള്ള പരിഹാസം", "ദുഃഖം", "ഭക്തി", "ദേശസ്നേഹം"]
        answer: "അമിതഭക്ഷണക്കൊതിയെക്കുറിച്ചുള്ള പരിഹാസം"
        difficulty: 2
        hints: ["തുള്ളലിലെ ഫലിതം."]
        solution: "ആർത്തിയെ കളിയാക്കുന്ന ആക്ഷേപഹാസ്യം."
        mistakes: {"ഭക്തി": mal_feast_satire}
      - prompt: "വേപ്പില + കട്ടി ചേർത്തെഴുതുക."
        options: ["വേപ്പിലക്കട്ടി", "വേപ്പിലകട്ടി", "വേപ്പിലയ്ക്കട്ടി", "വേപ്പില്കട്ടി"]
        answer: "വേപ്പിലക്കട്ടി"
        difficulty: 2
        hints: ["തുമ്പ + പൂ = തുമ്പപ്പൂ പോലെ."]
        solution: "'ക' ഇരട്ടിച്ച് വേപ്പിലക്കട്ടി (ദ്വിത്വസന്ധി)."
        mistakes: {"വേപ്പിലകട്ടി": mal_sandhi}
      - prompt: "പാഠത്തിന്റെ ആശയത്തോട് ഏറ്റവും ചേരുന്ന പഴഞ്ചൊല്ല്?"
        options: ["അത്താഴം അരവയറ്", "അക്കരപ്പച്ച", "ആന കൊടുത്താലും ആശ കൊടുക്കരുത്", "മിന്നുന്നതെല്ലാം പൊന്നല്ല"]
        answer: "അത്താഴം അരവയറ്"
        difficulty: 3
        hints: ["മിതമായ ഭക്ഷണം."]
        solution: "അത്താഴം അരവയറ് = രാത്രി വയർ നിറയെ തിന്നരുത്; മിതത്വമാണ് ആരോഗ്യം."
        mistakes: {"മിന്നുന്നതെല്ലാം പൊന്നല്ല": mal_feast_satire}
      - prompt: "നീണ്ട വിഭവപ്പട്ടിക നിരത്തിയശേഷം 'തൃപ്തിയില്ല ചിലർക്കെല്ലാം' എന്നു പറയുന്നതിലാണ് നമ്പ്യാരുടെ ഫലിതം. എങ്ങനെ?"
        options: ["ഇത്രയും വിഭവങ്ങൾ കഴിച്ചിട്ടും തീരാത്ത കൊതി കാണിച്ച് ചിരിപ്പിച്ചുകൊണ്ട് വിമർശിക്കുന്നു", "സദ്യയിൽ വിഭവങ്ങൾ കുറവായിരുന്നു", "നമ്പ്യാർ ഭക്ഷണം പാകം ചെയ്തു", "സദ്യ ഒഴിവാക്കണമെന്ന് നേരിട്ടു പറയുന്നു"]
        answer: "ഇത്രയും വിഭവങ്ങൾ കഴിച്ചിട്ടും തീരാത്ത കൊതി കാണിച്ച് ചിരിപ്പിച്ചുകൊണ്ട് വിമർശിക്കുന്നു"
        difficulty: 3
        hints: ["വിഭവങ്ങൾ എത്രയുണ്ട്? എരിശ്ശേരിയും പ്രഥമനും എത്ര കൂട്ടം?", "'കഴുത്തോളം' നിറഞ്ഞിട്ടും തൃപ്തിയില്ലെങ്കിൽ എന്തു തോന്നും?"]
        solution: "Step 1: അമിതമായ വിഭവങ്ങൾ എണ്ണിപ്പറഞ്ഞ് കഴുത്തോളം നിറച്ചിട്ടും തൃപ്തിയില്ലാത്തവരെ കാണിക്കുന്നു. Step 2: ചിരിപ്പിച്ചുകൊണ്ട് അത്യാർത്തിയെ വിമർശിക്കുന്നതാണ് തുള്ളലിന്റെ രീതി."
        mistakes: {"സദ്യയിൽ വിഭവങ്ങൾ കുറവായിരുന്നു": mal_feast_satire, "നമ്പ്യാർ ഭക്ഷണം പാകം ചെയ്തു": mal_feast_satire, "സദ്യ ഒഴിവാക്കണമെന്ന് നേരിട്ടു പറയുന്നു": mal_feast_satire}
      - prompt: "സദ്യയിൽ എരിശ്ശേരി നാലുകൂട്ടവും പ്രഥമൻ അഞ്ചുകൂട്ടവും ഉണ്ടായിരുന്നു. ആകെ എത്ര കൂട്ടം?"
        answer: "9"
        check: "4 + 5"
        difficulty: 3
        hints: ["രണ്ടു വിഭവങ്ങളുടെയും എണ്ണം കൂട്ടൂ."]
        solution: "Step 1: എരിശ്ശേരി 4, പ്രഥമൻ 5. Step 2: 4 + 5 = 9 കൂട്ടം."
        mistakes: {"5": mal_read_again, "20": mal_read_again}
      - prompt: '''അല്പമല്ല ഭുജിക്കുന്നു'' ഏതു കൃതിയിലെ ഭാഗമാണ്?'
        options:
        - പഞ്ചേന്ദ്രോപാഖ്യാനം
        - കുറേ കഥാപാത്രങ്ങൾ
        - നക്ഷത്രഗീതം
        - ചണ്ഡാലഭിക്ഷുകി
        answer: പഞ്ചേന്ദ്രോപാഖ്യാനം
        difficulty: 1
        hints:
        - കുഞ്ചൻനമ്പ്യാരുടെ തുള്ളൽകൃതി.
        - പേരിൽ 'ഉപാഖ്യാനം' (കഥ) ഉണ്ട്.
        solution: കുഞ്ചൻനമ്പ്യാരുടെ 'പഞ്ചേന്ദ്രോപാഖ്യാനം'.
        mistakes:
          കുറേ കഥാപാത്രങ്ങൾ: mal_feast_satire
      - prompt: സദ്യയിൽ എരിശ്ശേരി എത്ര കൂട്ടം?
        options:
        - നാല്
        - അഞ്ച്
        - ഒന്ന്
        - ഒമ്പത്
        answer: നാല്
        difficulty: 1
        hints:
        - പ്രഥമനെക്കാൾ ഒന്നു കുറവ്.
        - '''എരിശ്ശേരി ... കൂട്ടം പ്രഥമനങ്ങഞ്ചുകൂട്ടം''.'
        solution: എരിശ്ശേരി നാലുകൂട്ടം, പ്രഥമൻ അഞ്ചുകൂട്ടം.
        mistakes:
          അഞ്ച്: m8_feast_list
      - prompt: 'സദ്യയിലെ ഉപ്പേരിയെക്കുറിച്ച് പറയുന്ന പ്രത്യേകത:'
        options:
        - പഞ്ചസാര പുരട്ടിയത്
        - മുളകുപൊടി വിതറിയത്
        - ഉപ്പില്ലാത്തത്
        - പച്ചയ്ക്കുള്ളത്
        answer: പഞ്ചസാര പുരട്ടിയത്
        difficulty: 2
        hints:
        - മധുരമുള്ള ഒരു തരം ഉപ്പേരി.
        - ശർക്കരവരട്ടിപോലെ മധുരം.
        solution: പഞ്ചസാര പുരട്ടിയ ഉപ്പേരി വിഭവപ്പട്ടികയിലുണ്ട്.
        mistakes:
          മുളകുപൊടി വിതറിയത്: m8_feast_list
      - prompt: '''തുമ്പ + പൂ'' ചേർത്തെഴുതുമ്പോൾ:'
        options:
        - തുമ്പപ്പൂ
        - തുമ്പപൂ
        - തുമ്പാപൂ
        - തുമ്പുപൂ
        answer: തുമ്പപ്പൂ
        difficulty: 2
        hints:
        - രണ്ടാമത്തെ പദം 'പ'യിൽ തുടങ്ങുന്നു.
        - '''വേപ്പിലക്കട്ടി''യിൽ ''ക'' ഇരട്ടിച്ചതുപോലെ.'
        solution: തുമ്പ + പൂ = തുമ്പപ്പൂ ('പ' ഇരട്ടിച്ചു).
        mistakes:
          തുമ്പപൂ: m7_join_rule
      - prompt: '''അത്താഴം അരവയറ്'' എന്ന പഴഞ്ചൊല്ല് ഉപദേശിക്കുന്നത്:'
        options:
        - രാത്രി മിതമായി ഭക്ഷണം കഴിക്കുക
        - രാത്രി ഭക്ഷണം ഒഴിവാക്കുക
