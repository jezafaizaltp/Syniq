          - കുറേ കഥാപാത്രങ്ങൾ
          - നാം മുന്നോട്ട്
          answer: നമ്മുടെ ഭക്ഷണം നമ്മുടെ നാട്ടിൽ
          why: പരിഭാഷപ്പെടുത്തിയ കൃതിയിലെ ലേഖനം.
        ways:
        - style: step_by_step
          teach: 'ലേഖനത്തിന്റെ വാദം ഒരു ചങ്ങലയായി. ഒന്ന്: ആഗോള ഭക്ഷ്യവ്യവസ്ഥ വളർച്ചാഹോർമോൺ, കീടനാശിനി, പഞ്ചസാരപ്പാനീയങ്ങൾ, കൃത്രിമനിറങ്ങൾ എന്നിവ ഉപയോഗിക്കുന്നു. രണ്ട്: ഇവ രോഗങ്ങൾ കൂട്ടുന്നു. മൂന്ന്: അതോടെ മരുന്നുവ്യവസായത്തിന് കൂടുതൽ രോഗികൾ. ലേഖനം ''നമ്മുടെ ഭക്ഷണം നമ്മുടെ നാട്ടിൽ'' എന്ന കൃതിയിലേത് (ഹെലേന നോർബെർഗ്-ഹോഡ്ജ് തുടങ്ങിയവർ; പരിഭാഷ എം. പി. പരമേശ്വരൻ തുടങ്ങിയവർ).'
      - teach: പ്രാദേശികഭക്ഷണം പുതുമയുള്ളതും പോഷകം കൂടിയതുമാണ്; വിളവെടുത്തശേഷം വിറ്റാമിനുകൾ ക്രമേണ കുറയുന്നു. ദൂരേക്ക് കൊണ്ടുപോകാൻ തക്കാളി പച്ചയ്ക്ക് പറിച്ച് എഥിലീൻകൊണ്ട് പഴുപ്പിക്കുന്നു; പോഷകത്തെക്കാൾ കാഴ്ചയ്ക്കാണ് വില. മണ്ണിലെ സൂക്ഷ്മജീവികൾ ഉണ്ടാക്കുന്ന ചെറിയ പാടുകൾ ദോഷമല്ല.
