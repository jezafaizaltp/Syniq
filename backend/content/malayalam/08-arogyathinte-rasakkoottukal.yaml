      - prompt: "'ആഗോള ഭക്ഷ്യവ്യവസ്ഥ ആഗോള മരുന്നുവ്യവസായത്തിന് കൂടുതൽ രോഗികളെ സൃഷ്ടിക്കുന്നു' — ലേഖകർ ഇങ്ങനെ പറയാൻ കാരണം?"
