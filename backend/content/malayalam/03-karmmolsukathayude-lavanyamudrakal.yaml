        mistakes: {"2": mal_work_essay}
      - prompt: "താഴെ പറയുന്നവയിൽ ജോലി നൽകുന്നതായി ലേഖകൻ പറയാത്തത് ഏത്?"
        options: ["ജോലിയില്ലാതെ സുഖലോലുപരായി കഴിയാനുള്ള ഭാഗ്യം", "'എനിക്ക് ഇന്നത് നേടാൻ കഴിഞ്ഞു' എന്ന ചാരിതാർഥ്യം", "സമുദായത്തിന് ഉപയോഗപ്രദമായി എന്ന ബോധം", "നിർമ്മാണാത്മകമായ കഴിവുകൾ പ്രകടിപ്പിക്കാനുള്ള അവസരം"]
        answer: "ജോലിയില്ലാതെ സുഖലോലുപരായി കഴിയാനുള്ള ഭാഗ്യം"
        difficulty: 2
        hints: ["അത് 'വിഡ്ഢിത്തം' എന്ന് ലേഖകൻ."]
        solution: "ജോലിയില്ലാത്ത സുഖജീവിതം മടുപ്പുണ്ടാക്കുമെന്നാണ് ലേഖകൻ പറയുന്നത്."
        mistakes: {"സമുദായത്തിന് ഉപയോഗപ്രദമായി എന്ന ബോധം": mal_work_essay}
      - prompt: "'പണത്തിനുവേണ്ടി മാത്രമേ ജോലിചെയ്യൂ എന്ന വിചാരം ശരിയല്ല' — ലേഖകൻ ഇങ്ങനെ പറയാൻ കാരണം:"
        options: ["ജോലി കഴിവുകൾ വികസിപ്പിക്കുകയും വ്യക്തിപ്രഭാവത്തിന് അന്തസ്സ് കൂട്ടുകയും ചെയ്യുന്നു", "പണം ആവശ്യമില്ല", "ജോലി സമയം കളയാനുള്ളതാണ്", "എല്ലാ ജോലിയും ഒരുപോലെ മടുപ്പാണ്"]
        answer: "ജോലി കഴിവുകൾ വികസിപ്പിക്കുകയും വ്യക്തിപ്രഭാവത്തിന് അന്തസ്സ് കൂട്ടുകയും ചെയ്യുന്നു"
        difficulty: 2
        hints: ["'ഉപജീവനത്തിനു പണമില്ലാതെ കഴിയില്ല. എന്നാൽ...'"]
        solution: "ജോലി വ്യക്തിത്വവികാസത്തിനുള്ള മാർഗമാണ്."
        mistakes: {"പണം ആവശ്യമില്ല": mal_work_essay}
      - prompt: "'അധ്വാനിക്കാൻ തയ്യാറില്ലാത്തവൻ ആഹാരത്തിനർഹനല്ല' — ഇതിനോട് ചേർന്ന പഴഞ്ചൊല്ല്:"
        options: ["വിയർത്തവന്റെ വിശപ്പിന് സുഖമുണ്ട്", "മിന്നുന്നതെല്ലാം പൊന്നല്ല", "അക്കരപ്പച്ച", "ആന കൊടുത്താലും ആശ കൊടുക്കരുത്"]
        answer: "വിയർത്തവന്റെ വിശപ്പിന് സുഖമുണ്ട്"
        difficulty: 2
        hints: ["പാഠപുസ്തകം ബന്ധപ്പെടുത്താൻ പറയുന്ന പഴഞ്ചൊല്ല്."]
        solution: "അധ്വാനിച്ചവനാണ് ആഹാരത്തിന്റെ രുചി അറിയുന്നത്."
        mistakes: {"മിന്നുന്നതെല്ലാം പൊന്നല്ല": "mal_proverb_work", "അക്കരപ്പച്ച": "mal_proverb_work", "ആന കൊടുത്താലും ആശ കൊടുക്കരുത്": "mal_proverb_work"}
      - prompt: "ലേഖകന്റെ അഭിപ്രായത്തിൽ മനുഷ്യന്റെ മഹത്വം എവിടെയാണ്?"
        options: ["ജോലി എത്ര നിസ്സാരമായാലും അത് സർവകഴിവുകളും ഉപയോഗിച്ച് നിർവഹിക്കുന്ന രീതിയിൽ", "വലിയ ശമ്പളമുള്ള ജോലിയിൽ മാത്രം", "ജോലി ചെയ്യാതിരിക്കുന്നതിൽ", "മറ്റുള്ളവരെക്കൊണ്ട് ജോലി ചെയ്യിക്കുന്നതിൽ"]
        answer: "ജോലി എത്ര നിസ്സാരമായാലും അത് സർവകഴിവുകളും ഉപയോഗിച്ച് നിർവഹിക്കുന്ന രീതിയിൽ"
        difficulty: 3
        hints: ["പ്ലേറ്റോ മുതൽ നെഹ്റു വരെയുള്ളവരുടെ ഉപദേശം."]
        solution: "ജോലിയുടെ വലുപ്പമല്ല, ചെയ്യുന്ന രീതിയാണ് മഹത്വം."
        mistakes: {"വലിയ ശമ്പളമുള്ള ജോലിയിൽ മാത്രം": mal_work_essay}

  - code: mal9.u3.vibhakti
    title: "ഭാഷ: വിഭക്തിപ്രത്യയങ്ങളും പദപരിചയവും"
    after: [mal9.u3.achuthammama]
    notes: |
      നാമത്തോടു ചേർന്ന് മറ്റു പദങ്ങളുമായുള്ള ബന്ധം കാണിക്കുന്ന പ്രത്യയങ്ങളാണ് വിഭക്തിപ്രത്യയങ്ങൾ.
      പാഠപുസ്തകത്തിലെ ഉദാഹരണങ്ങൾ: "ശോഭ അച്യുതമ്മാമയ്ക്ക് ചായ കൊടുത്തു" (ക്ക് — ഉദ്ദേശിക),
      "അച്യുതമ്മാമയോട് ഞാൻ ലോഹ്യം പറഞ്ഞു" (ഓട് — സംയോജിക), "ഞാൻ അച്യുതമ്മാമയെ കണ്ടു" (എ —
      പ്രതിഗ്രാഹിക), "അച്യുതമ്മാമയുടെ ആവശ്യം" (ഉടെ — സംബന്ധിക). മറ്റുള്ളവ: നിർദേശിക (പ്രത്യയമില്ല),
      പ്രയോജിക (ആൽ — കൈകൊണ്ട്/കൈയാൽ), ആധാരിക (ഇൽ, കൽ — വീട്ടിൽ). ദ്വന്ദ്വസമാസം: സുഖസൗകര്യങ്ങൾ =
      സുഖവും സൗകര്യവും. പദപരിചയം: ചാരിതാർഥ്യം (സംതൃപ്തി), ഉപജീവനം (ജീവിക്കാൻ ആവശ്യമായത്), അഭിവൃദ്ധി
      (വളർച്ച), ചാതുര്യം (സാമർഥ്യം), ആർദ്രത (അലിവ്), അപശങ്കം (ശങ്കകൂടാതെ), തിമിരം (അന്ധത),
      ജാഗരൂകം (ഉണർച്ചയുള്ള), ഗാഢം (തീവ്രമായ).
    explanations:
      text: "ഒരേ നാമം 'അച്യുതമ്മാമ' പ്രത്യയം മാറുമ്പോൾ വാക്യത്തിൽ വേറെ വേറെ പങ്കു വഹിക്കുന്നു: ആർക്ക് (ക്ക്), ആരോട് (ഓട്), ആരെ (എ), ആരുടെ (ഉടെ)."
      visual: "നടുവിൽ 'അച്യുതമ്മാമ' എന്ന പെട്ടി; ചുറ്റും അമ്പുകൾ: -യെ (പ്രതിഗ്രാഹിക), -യോട് (സംയോജിക), -യ്ക്ക് (ഉദ്ദേശിക), -യുടെ (സംബന്ധിക), -യാൽ (പ്രയോജിക), -യിൽ (ആധാരിക)."
      step_by_step: "'അച്യുതമ്മാമയോട് ഞാൻ ലോഹ്യം പറഞ്ഞു' — 1. പ്രത്യയം: ഓട്. 2. ഓട് കൂടെ/നേരെ എന്ന ബന്ധം കാണിക്കുന്നു. 3. സംയോജികാവിഭക്തി."
      real_world: "ഇംഗ്ലീഷിൽ to, with, of തുടങ്ങിയ prepositions ചെയ്യുന്ന ജോലിയാണ് മലയാളത്തിൽ വിഭക്തിപ്രത്യയങ്ങൾ ചെയ്യുന്നത്."
    activity:
      type: sort
      prompt: ഓരോ പദത്തിലെയും വിഭക്തി ഏത്? പ്രത്യയം നോക്കൂ.
      bins:
      - പ്രതിഗ്രാഹിക (എ)
      - ഉദ്ദേശിക (ക്ക്)
      - സംബന്ധിക (ഉടെ)
      - സംയോജിക (ഓട്)
      - ആധാരിക (ഇൽ)
      items:
      - label: അച്യുതമ്മാമയെ കണ്ടു
        bin: പ്രതിഗ്രാഹിക (എ)
        clue: നാമത്തിന്റെ ഒടുവിൽ ചേർന്ന പ്രത്യയം ഏത്?
        why: '''എ'' ചേർന്നു: പ്രതിഗ്രാഹിക.'
      - label: അച്യുതമ്മാമയ്ക്ക് ചായ കൊടുത്തു
        bin: ഉദ്ദേശിക (ക്ക്)
        clue: ചായ ആർക്കുവേണ്ടി? പ്രത്യയം നോക്കൂ.
        why: '''ക്ക്'' ചേർന്നു: ഉദ്ദേശിക.'
      - label: അച്യുതമ്മാമയുടെ ആവശ്യം
        bin: സംബന്ധിക (ഉടെ)
        clue: ആവശ്യം ആരുടേത്? ഏതു പ്രത്യയം?
        why: '''ഉടെ'' ചേർന്നു: സംബന്ധിക.'
      - label: മാധവന്റെ ഓഫീസ്
        bin: സംബന്ധിക (ഉടെ)
        clue: '''-ന്റെ'' എന്നത് ഉടമസ്ഥത കാണിക്കുന്നുണ്ടോ?'
        why: '''ന്റെ'' സംബന്ധികയുടെ മറ്റൊരു രൂപം.'
      - label: അച്യുതമ്മാമയോട് ലോഹ്യം പറഞ്ഞു
        bin: സംയോജിക (ഓട്)
        clue: ലോഹ്യം ആരോട്? പ്രത്യയം ഏത്?
        why: '''ഓട്'' ചേർന്നു: സംയോജിക.'
      - label: വീട്ടിൽ എത്തി
        bin: ആധാരിക (ഇൽ)
        clue: ഇത് ഒരു സ്ഥലം കാണിക്കുന്നുണ്ടോ?
        why: '''ഇൽ'' ചേർന്നു: ആധാരിക.'
      - label: ഓഫീസിൽ കോൺഫറൻസ്
        bin: ആധാരിക (ഇൽ)
        clue: കോൺഫറൻസ് എവിടെ?
        why: '''ഇൽ'' സ്ഥലം കാണിക്കുന്നു: ആധാരിക.'
    items:
      - prompt: "'ഞാൻ അച്യുതമ്മാമയെ കണ്ടു' — അടിവരയിട്ട പദത്തിലെ വിഭക്തി:"
        options: ["പ്രതിഗ്രാഹിക", "സംയോജിക", "ഉദ്ദേശിക", "സംബന്ധിക"]
        answer: "പ്രതിഗ്രാഹിക"
        difficulty: 1
        hints: ["പ്രത്യയം 'എ'."]
        solution: "'എ' പ്രത്യയം — പ്രതിഗ്രാഹിക."
        mistakes: {"സംയോജിക": mal_vibhakti}
      - prompt: "'അച്യുതമ്മാമയോട് ഞാൻ ലോഹ്യം പറഞ്ഞു' — വിഭക്തി:"
        options: ["സംയോജിക", "പ്രതിഗ്രാഹിക", "ആധാരിക", "പ്രയോജിക"]
        answer: "സംയോജിക"
        difficulty: 1
        hints: ["പ്രത്യയം 'ഓട്'."]
        solution: "'ഓട്' — സംയോജിക."
        mistakes: {"പ്രതിഗ്രാഹിക": mal_vibhakti}
      - prompt: "'ശോഭ അച്യുതമ്മാമയ്ക്ക് ചായ കൊടുത്തു' — വിഭക്തി:"
        options: ["ഉദ്ദേശിക", "സംബന്ധിക", "സംയോജിക", "നിർദേശിക"]
        answer: "ഉദ്ദേശിക"
        difficulty: 2
        hints: ["പ്രത്യയം 'ക്ക്'."]
        solution: "'ക്ക്' — ഉദ്ദേശിക."
        mistakes: {"സംബന്ധിക": mal_vibhakti}
      - prompt: "'അച്യുതമ്മാമയുടെ ആവശ്യം എന്തായിരുന്നുവോ?' — വിഭക്തി:"
        options: ["സംബന്ധിക", "ഉദ്ദേശിക", "പ്രതിഗ്രാഹിക", "ആധാരിക"]
        answer: "സംബന്ധിക"
        difficulty: 2
        hints: ["പ്രത്യയം 'ഉടെ'."]
        solution: "'ഉടെ' — സംബന്ധിക."
        mistakes: {"ഉദ്ദേശിക": mal_vibhakti}
      - prompt: "'വീട്ടിൽ' എന്ന പദത്തിലെ വിഭക്തി:"
        options: ["ആധാരിക", "പ്രയോജിക", "സംയോജിക", "സംബന്ധിക"]
        answer: "ആധാരിക"
        difficulty: 3
        hints: ["പ്രത്യയം 'ഇൽ' — സ്ഥലം."]
        solution: "'ഇൽ' — ആധാരിക."
        mistakes: {"പ്രയോജിക": mal_vibhakti}
      - prompt: "'ചാരിതാർഥ്യം' എന്നതിന്റെ അർഥം:"
        options: ["സംതൃപ്തി", "ചരിത്രം", "സ്വഭാവം", "ദുഃഖം"]
        answer: "സംതൃപ്തി"
        difficulty: 2
        hints: ["'എനിക്ക് ഇന്നത് നേടാൻ കഴിഞ്ഞു' എന്ന തോന്നൽ."]
        solution: "ചാരിതാർഥ്യം = സംതൃപ്തി."
        mistakes: {"ചരിത്രം": mal_word_meaning}
