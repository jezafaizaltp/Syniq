  - code: mal9.u3.achuthammama
    title: അച്യുതമ്മാമ
    after: [mal9.u3.tharishu]
    notes: |
      കെ. പി. രാമനുണ്ണിയുടെ 'എൻട്രൻസ് എഴുതുന്ന കുട്ടി' എന്ന സമാഹാരത്തിലെ കഥ. ആഖ്യാതാവ് മാധവൻ, തിരക്കുള്ള
      കമ്പനി ഉദ്യോഗസ്ഥൻ; ഭാര്യ ശോഭ, കൊച്ചുമോൻ. ഒരു തിങ്കളാഴ്ച രാവിലെ ഏഴുമണിക്ക് അച്യുതമ്മാമ എത്തുന്നു;
      ഒൻപതുമണിയുടെ കോൺഫറൻസിനുമുമ്പ് ഡാറ്റാ ഓഫീസിലെത്തണം. "മാധവാ, എനിക്ക് നിന്നോട് കുറച്ചു
      സംസാരിക്കാനുണ്ട്... ഒരു രണ്ടുമണിക്കൂറെങ്കിലും വേണം." — "രണ്ടുമണിക്കൂർ, അതായത് നൂറ്റിയിരുപത്
      മിനിറ്റോ?!" അച്ഛനെ ഓർമ്മയില്ലാത്ത മാധവന് ബാല്യത്തിന്റെ സംരക്ഷകപ്രതീകമായിരുന്നു അച്യുതമ്മാമ:
      തോളിൽ കയറിയാൽ കുതിരയാകുന്ന, ഉത്സവപ്പറമ്പിലെ അമിട്ടായി ചിരിക്കുന്ന, ഉത്രാടനാളിലെ നിറവായ ആൾ.
      മാധവൻ പണം നീട്ടിയപ്പോൾ: "നല്ല വിരോധാഭാസം. മാധവനോട് ഇങ്ങോട്ടു പണം വാങ്ങാനല്ല ഞാൻ വന്നത്."
      ഞായറാഴ്ച വരാൻ പറഞ്ഞു; പക്ഷേ അന്ന് ഏരിയാ ഡയറക്ടറടക്കം കമ്പനി ബോസുമാർ വീട്ടിലെത്തി, മാധവന്
      പോകേണ്ടിവന്നു. "നിനക്കതിന് ആവില്ല, മാധവാ. ഞാൻ കാക്കുന്നില്ല." "അച്യുതമ്മാമയ്ക്കുവേണ്ടി മാറ്റിവച്ച
      ഞായറാഴ്ചയുടെ ചിതയെരിയുന്ന നേരത്താണ് എനിക്ക് മടങ്ങാൻ കഴിഞ്ഞത്." ഒരപരിചിതൻ ഏൽപ്പിച്ച കത്ത്:
      "ഇനിയൊരു മടക്കമുണ്ടാവില്ല... കവറിൽ രണ്ടുലക്ഷം ഉറുപ്പികയുണ്ട്. തറവാട്ടുസ്വത്തിൽ നിനക്കും അമ്മയ്ക്കും
      തരാനുള്ള ഓഹരിയാണിത്." പ്രമേയം: തൊഴിൽമേഖലയിലെ സമ്മർദ്ദം കുടുംബബന്ധങ്ങളെ ഇല്ലാതാക്കുന്നത്;
      "എന്റെ ജീവിതം എത്രത്തോളം എന്റെ കൈയിലല്ല".
    explanations:
      text: "ജോലിത്തിരക്കിൽ ഒരാൾക്ക് സ്വന്തം ബാല്യത്തിലെ സംരക്ഷകനോട് രണ്ടു മണിക്കൂർ സംസാരിക്കാൻ കഴിയുന്നില്ല. ആ മനുഷ്യൻ പണം ചോദിക്കാനല്ല, പണം കൊടുക്കാനും യാത്ര പറയാനുമാണ് വന്നത് എന്ന് മാധവൻ അറിയുന്നത് വളരെ വൈകിയാണ്."
      visual: "ഒരു ക്ലോക്കിന്റെ ചിത്രം: ഓരോ മണിക്കൂറിലും മീറ്റിങ്, ഫോൺ, ബോസ്; ഒരു മൂലയിൽ പ്ലാസ്റ്റിക് പൊതിയുമായി കാത്തുനിൽക്കുന്ന വൃദ്ധൻ; അവസാനം ഒരു ചിതയും ഒരു കത്തും."
      step_by_step: "'ഞായറാഴ്ചയുടെ ചിതയെരിയുന്ന നേരത്ത്' — 1. ഞായർ അച്യുതമ്മാമയ്ക്കായി മാറ്റിവച്ചതായിരുന്നു. 2. ആ ദിവസവും ജോലി കൊണ്ടുപോയി. 3. മാധവൻ മടങ്ങിയെത്തുമ്പോൾ അച്യുതമ്മാമയുടെ ചിതയും ആ ഞായറിന്റെ പ്രതീക്ഷയും ഒന്നിച്ച് എരിയുന്നു."
      real_world: "വലിയ കമ്പനികളിൽ 'വർക്ക്-ലൈഫ് ബാലൻസ്' ഇന്ന് പ്രധാന ചർച്ചയാണ്. കുടുംബത്തിനും സ്വന്തക്കാർക്കും സമയം കണ്ടെത്തുന്നത് ഒരു കഴിവാണ്."
