        solution: "ജോലിസമ്മർദ്ദവും ബന്ധങ്ങളുടെ നഷ്ടവും."

        mistakes: {"ഗ്രാമത്തിലെ ഉത്സവം": "mal_achu_theme", "കൃഷിയുടെ പ്രാധാന്യം": "mal_achu_theme", "ഒരു യാത്രയുടെ വിവരണം": "mal_achu_theme"}
  - code: mal9.u3.joli
    title: നിങ്ങളും നിങ്ങളുടെ ജോലിയും
    after: [mal9.u3.achuthammama]
    notes: |
      കെ. പി. കേശവമേനോന്റെ 'നാം മുന്നോട്ട്' എന്ന കൃതിയിൽനിന്നുള്ള ലേഖനം. അധികംപേരും ജോലിചെയ്യുന്നത്
      ഉപജീവനത്തിനുവേണ്ടി മാത്രം; പക്ഷേ "പണത്തിനുവേണ്ടി മാത്രമേ ജോലിചെയ്യൂ എന്ന വിചാരം ശരിയല്ല".
      "അധ്വാനിക്കാൻ തയ്യാറില്ലാത്തവൻ ആഹാരത്തിനർഹനല്ല." ജോലി സമയം കളയാനുള്ള മാർഗമല്ല; അതിലൂടെ
      നാം കഴിവുകൾ വികസിപ്പിക്കുന്നു; വ്യക്തിപ്രഭാവത്തിന് മാറ്റും അന്തസ്സും കൂടുന്നു. ജോലി നൽകുന്ന മൂന്നു
      കാര്യങ്ങൾ: (1) 'എനിക്ക് ഇന്നത് നേടാൻ കഴിഞ്ഞു' എന്ന ചാരിതാർഥ്യം, (2) സമുദായത്തിന് ഉപയോഗപ്രദമായി
      എന്ന ബോധം, (3) നിർമ്മാണാത്മകമായ കഴിവുകൾ പ്രകടിപ്പിക്കാനുള്ള അവസരം. ജോലിയില്ലാതെ സുഖലോലുപരായി
      കഴിയുന്നത് ഭാഗ്യമെന്നു കരുതുന്നത് വിഡ്ഢിത്തം — മനസ്സിന് മടുപ്പുണ്ടാക്കും. ലോകത്തിലെ വലിയ
      ചിന്തകർ — പ്ലേറ്റോ, അരിസ്റ്റോട്ടിൽ, ഗാന്ധിജി, നെഹ്റു — അധ്വാനത്തിന് വലിയ വില കല്പിച്ചു. ജോലി
      എത്ര നിസ്സാരമായാലും അത് നിർവഹിക്കുന്ന രീതിയിലാണ് മഹത്വം. ബന്ധപ്പെട്ടവ: നെഹ്റു "ജീവിക്കുക
      എന്നതിന് അർഥം അധ്വാനിക്കുക എന്നതാണ്"; പഴഞ്ചൊല്ല് "വിയർത്തവന്റെ വിശപ്പിന് സുഖമുണ്ട്".
    explanations:
      text: "ജോലി ശമ്പളത്തിനുള്ള വഴി മാത്രമല്ലെന്ന് ലേഖകൻ പറയുന്നു. നന്നായി ചെയ്യുന്ന ജോലി നമുക്ക് സംതൃപ്തിയും സമൂഹത്തിന് ഉപകാരവും നമ്മുടെ കഴിവുകൾക്ക് വളർച്ചയും നൽകുന്നു."
      visual: "ഒരു മരം വരയ്ക്കുക: വേര് = അധ്വാനം; മൂന്നു ശാഖകൾ = ചാരിതാർഥ്യം, സമൂഹത്തിന് ഉപകാരം, കഴിവുകളുടെ പ്രകടനം; പഴങ്ങൾ = അന്തസ്സും വ്യക്തിപ്രഭാവവും."
      step_by_step: "'അധ്വാനിക്കാൻ തയ്യാറില്ലാത്തവൻ ആഹാരത്തിനർഹനല്ല' — 1. ആഹാരം ആരുടെയോ അധ്വാനത്തിന്റെ ഫലമാണ്. 2. അധ്വാനിക്കാതെ അത് വാങ്ങുന്നത് മറ്റുള്ളവരുടെ അധ്വാനം പറ്റുന്നതാണ്. 3. അതിനാൽ അധ്വാനമാണ് ആഹാരത്തിനുള്ള അർഹത."
      real_world: "വീട്ടിലെ ചെറിയ ജോലികൾ — ചെടി നനയ്ക്കൽ, പാത്രം കഴുകൽ — ശ്രദ്ധയോടെ ചെയ്യുമ്പോഴും 'ഞാൻ ചെയ്തു' എന്ന സംതൃപ്തി കിട്ടും."
    activity:
      type: sort
      prompt: കേശവമേനോൻ ഇവയിൽ ഏതിനോട് യോജിക്കുന്നു, ഏതിനെ തള്ളുന്നു?
      bins:
      - ലേഖകൻ യോജിക്കുന്നു
      - ലേഖകൻ തള്ളുന്നു
      items:
      - label: ജോലിയിലൂടെ നമ്മുടെ കഴിവുകൾ വികസിക്കുന്നു
        bin: ലേഖകൻ യോജിക്കുന്നു
        clue: ജോലി വ്യക്തിപ്രഭാവത്തിന് എന്തു നൽകുന്നു എന്നാണ് ലേഖനം?
        why: ജോലി കഴിവുകൾ വികസിപ്പിക്കുന്നു, അന്തസ്സ് കൂട്ടുന്നു.
      - label: സമുദായത്തിന് ഉപയോഗപ്പെട്ടു എന്ന ബോധം
        bin: ലേഖകൻ യോജിക്കുന്നു
        clue: ജോലി നൽകുന്ന മൂന്നു കാര്യങ്ങൾ ഓർക്കൂ.
        why: ജോലി നൽകുന്ന രണ്ടാമത്തെ കാര്യം ഇതാണ്.
      - label: അധ്വാനിക്കാത്തവൻ ആഹാരത്തിനർഹനല്ല
        bin: ലേഖകൻ യോജിക്കുന്നു
        clue: ലേഖനത്തിൽ ഉദ്ധരിക്കുന്ന വാക്യമാണോ ഇത്?
        why: ലേഖകൻ ഈ ആശയം ശരിവയ്ക്കുന്നു.
      - label: പണത്തിനുവേണ്ടി മാത്രമേ ജോലി ചെയ്യൂ
        bin: ലേഖകൻ തള്ളുന്നു
        clue: '''ഈ വിചാരം ശരിയല്ല'' എന്ന് ലേഖകൻ പറയുന്നത് എന്തിനെക്കുറിച്ച്?'
        why: പണത്തിനുവേണ്ടി മാത്രമുള്ള ജോലി എന്ന വിചാരം ശരിയല്ല എന്ന് ലേഖനം.
      - label: ജോലി സമയം കളയാനുള്ള ഒരു മാർഗം
        bin: ലേഖകൻ തള്ളുന്നു
        clue: ജോലി വെറുതെ നേരം പോക്കാനാണോ?
        why: ജോലി സമയം കളയാനുള്ളതല്ല എന്ന് ലേഖനം വ്യക്തമാക്കുന്നു.
      - label: ജോലിയില്ലാതെ സുഖിച്ചു കഴിയുന്നത് ഭാഗ്യം
        bin: ലേഖകൻ തള്ളുന്നു
        clue: ലേഖകൻ ഇതിനെ എന്താണ് വിളിക്കുന്നത്?
        why: അത് വിഡ്ഢിത്തമാണെന്നും മനസ്സിന് മടുപ്പുണ്ടാക്കുമെന്നും ലേഖനം.
    items:
      - prompt: "'നിങ്ങളും നിങ്ങളുടെ ജോലിയും' ഏതു കൃതിയിൽനിന്നാണ്?"
        options: ["നാം മുന്നോട്ട്", "എൻട്രൻസ് എഴുതുന്ന കുട്ടി", "സഹ്യകാനനത്തിൽ വിരിഞ്ഞ കവിത", "തണുപ്പ്"]
        answer: "നാം മുന്നോട്ട്"
        difficulty: 1
        hints: ["കെ. പി. കേശവമേനോൻ."]
        solution: "'നാം മുന്നോട്ട്' — കെ. പി. കേശവമേനോൻ."
        mistakes: {"എൻട്രൻസ് എഴുതുന്ന കുട്ടി": mal_author_work}
      - prompt: "ലേഖകന്റെ അഭിപ്രായത്തിൽ ജോലിചെയ്യുന്നതുകൊണ്ട് എത്ര കാര്യങ്ങൾ നമുക്കു സാധിക്കും?"
        answer: "3"
