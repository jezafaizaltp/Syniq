    lesson:
      - teach: '''നിങ്ങളും നിങ്ങളുടെ ജോലിയും'' കെ. പി. കേശവമേനോന്റെ ''നാം മുന്നോട്ട്'' എന്ന കൃതിയിലെ ലേഖനം. അധികംപേരും ഉപജീവനത്തിനുവേണ്ടി മാത്രം ജോലിചെയ്യുന്നു. പക്ഷേ ''പണത്തിനുവേണ്ടി മാത്രമേ ജോലിചെയ്യൂ എന്ന വിചാരം ശരിയല്ല'' എന്ന് ലേഖകൻ.'
        check:
