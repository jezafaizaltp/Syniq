        - തരിശുനിലത്ത് അവർ എന്തു ചെയ്യാനാണ് വരുന്നത്?
        - കൃഷിക്കു വേണ്ടത്.
        solution: തരിശുനിലം കൃഷിയിടമാക്കാൻ വരുന്നവരുടെ കൈയിൽ വിത്തും വിളയും.
        mistakes:
          വാളും പരിചയും: m3_tharishu_image
      - prompt: തൊഴിലാളികളുടെ വാക്കുകൾ ആകാശത്തെ കിടിലംകൊള്ളിക്കുന്നത് എന്തുപോലെ?
        options:
        - ഇടിയൊച്ചകൾപോലെ
        - കിളിപ്പാട്ടുപോലെ
        - കാറ്റിന്റെ മൂളൽപോലെ
        - മണിനാദംപോലെ
        answer: ഇടിയൊച്ചകൾപോലെ
        difficulty: 2
        hints:
        - കരിമുകിലും മിന്നലും കഴിഞ്ഞാൽ വരുന്ന ശബ്ദം.
        - ഉറച്ചതും മുഴങ്ങുന്നതുമായ ശബ്ദം.
        solution: കൂർത്ത പരുക്കൻവാക്കുകൾ ഇടിയൊച്ചകൾപോലെ ആകാശത്തെ കിടിലംകൊള്ളിക്കുന്നു.
        mistakes:
          കിളിപ്പാട്ടുപോലെ: m3_tharishu_image
      - prompt: '''വറുതിയൊടങ്കം വെട്ടുന്നോർ'' — ഇവിടെ ''അങ്കം വെട്ടുക'' എന്നതിന്റെ അർഥം:'
        options:
        - പോരാടുക
        - കൃഷി ചെയ്യുക
        - പാട്ടുപാടുക
        - വിശ്രമിക്കുക
        answer: പോരാടുക
        difficulty: 2
        hints:
        - പഴയകാലത്ത് യോദ്ധാക്കൾ ചെയ്തിരുന്നത്.
        - ദാരിദ്ര്യത്തോടുള്ള ഏറ്റുമുട്ടൽ.
        solution: അങ്കം വെട്ടുക = പോരാടുക. ദാരിദ്ര്യത്തോട് പോരാടുന്നവർ.
        mistakes:
          കൃഷി ചെയ്യുക: m3_tharishu_word
      - prompt: 'തൊഴിലാളികളുടെ അടിയേറ്റ് തകരുന്നതായി കവി പറയുന്നത്:'
        options:
        - കരിങ്കൽക്കുന്നുകൾ
        - വീടുകൾ
        - മരങ്ങൾ
        - പാലങ്ങൾ
        answer: കരിങ്കൽക്കുന്നുകൾ
        difficulty: 2
        hints:
        - ഏറ്റവും ഉറപ്പുള്ള ഒന്ന്.
        - അവരുടെ ശക്തിയുടെ വലുപ്പം കാണിക്കാൻ.
        solution: കരിങ്കൽക്കുന്നുകൾപോലും അവരുടെ അടിയേറ്റു തകരുന്നു.
        mistakes:
          മരങ്ങൾ: m3_tharishu_image
      - prompt: '''ആ മഹാസംരംഭത്തിൻ സംഘഗാനത്തിൽ ചേർന്നു നാമനുഭവിക്കാം പണ്ടില്ലാത്തൊരഭിമാനം'' — ഈ വരികൾ ഏതു കവിതയിലേതാണ്?'
        options:
        - യുഗപരിവർത്തനം
        - പുളിമാവു വെട്ടി
        - ചണ്ഡാലഭിക്ഷുകി
        - ചിന്താവിഷ്ടയായ സീത
        answer: യുഗപരിവർത്തനം
        difficulty: 3
        hints:
        - വൈലോപ്പിള്ളിയുടെ കവിത.
        - ഒരു കാലം മാറി മറ്റൊന്നാകുന്നതിനെക്കുറിച്ച്.
        solution: വൈലോപ്പിള്ളിയുടെ 'യുഗപരിവർത്തന'ത്തിലെ വരികൾ; ഇതും സംഘശക്തിയെക്കുറിച്ചാണ്.
        mistakes:
          പുളിമാവു വെട്ടി: mal_workers_poem
      - prompt: 'ഈ കവിതയും ''യുഗപരിവർത്തന''വും ഒരുപോലെ ആഘോഷിക്കുന്നത്:'
        options:
        - ഒരുമിച്ചുള്ള അധ്വാനത്തിന്റെ ശക്തിയും അഭിമാനവും
        - ഗ്രാമത്തിന്റെ ശാന്തമായ സൗന്ദര്യം
        - ഒറ്റയ്ക്കുള്ള ധ്യാനം
        - പണക്കാരുടെ ആഡംബരം
        answer: ഒരുമിച്ചുള്ള അധ്വാനത്തിന്റെ ശക്തിയും അഭിമാനവും
        difficulty: 3
        hints:
        - '''സംഘഗാനം'', ''അണിയായണിയായ്'' — രണ്ടിലും ഒരു ആശയമുണ്ട്.'
        - ഒരാളല്ല, പലർ ഒന്നിച്ച്.
        solution: രണ്ടു കവിതകളും സംഘശക്തിയെയും അധ്വാനത്തിന്റെ അഭിമാനത്തെയും ആഘോഷിക്കുന്നു.
        mistakes:
          ഗ്രാമത്തിന്റെ ശാന്തമായ സൗന്ദര്യം: mal_tharishu_veeryam

  - code: mal9.u3.achuthammama
    title: അച്യുതമ്മാമ
    after: [mal9.u3.tharishu]
    notes: |
      കെ. പി. രാമനുണ്ണിയുടെ 'എൻട്രൻസ് എഴുതുന്ന കുട്ടി' എന്ന സമാഹാരത്തിലെ കഥ. ആഖ്യാതാവ് മാധവൻ, തിരക്കുള്ള
      കമ്പനി ഉദ്യോഗസ്ഥൻ; ഭാര്യ ശോഭ, കൊച്ചുമോൻ. ഒരു തിങ്കളാഴ്ച രാവിലെ ഏഴുമണിക്ക് അച്യുതമ്മാമ എത്തുന്നു;
      ഒൻപതുമണിയുടെ കോൺഫറൻസിനുമുമ്പ് ഡാറ്റാ ഓഫീസിലെത്തണം. "മാധവാ, എനിക്ക് നിന്നോട് കുറച്ചു
      സംസാരിക്കാനുണ്ട്... ഒരു രണ്ടുമണിക്കൂറെങ്കിലും വേണം." — "രണ്ടുമണിക്കൂർ, അതായത് നൂറ്റിയിരുപത്
      മിനിറ്റോ?!" അച്ഛനെ ഓർമ്മയില്ലാത്ത മാധവന് ബാല്യത്തിന്റെ സംരക്ഷകപ്രതീകമായിരുന്നു അച്യുതമ്മാമ:
      തോളിൽ കയറിയാൽ കുതിരയാകുന്ന, ഉത്സവപ്പറമ്പിലെ അമിട്ടായി ചിരിക്കുന്ന, ഉത്രാടനാളിലെ നിറവായ ആൾ.
      മാധവൻ പണം നീട്ടിയപ്പോൾ: "നല്ല വിരോധാഭാസം. മാധവനോട് ഇങ്ങോട്ടു പണം വാങ്ങാനല്ല ഞാൻ വന്നത്."
      ഞായറാഴ്ച വരാൻ പറഞ്ഞു; പക്ഷേ അന്ന് ഏരിയാ ഡയറക്ടറടക്കം കമ്പനി ബോസുമാർ വീട്ടിലെത്തി, മാധവന്
      പോകേണ്ടിവന്നു. "നിനക്കതിന് ആവില്ല, മാധവാ. ഞാൻ കാക്കുന്നില്ല." "അച്യുതമ്മാമയ്ക്കുവേണ്ടി മാറ്റിവച്ച
      ഞായറാഴ്ചയുടെ ചിതയെരിയുന്ന നേരത്താണ് എനിക്ക് മടങ്ങാൻ കഴിഞ്ഞത്." ഒരപരിചിതൻ ഏൽപ്പിച്ച കത്ത്:
      "ഇനിയൊരു മടക്കമുണ്ടാവില്ല... കവറിൽ രണ്ടുലക്ഷം ഉറുപ്പികയുണ്ട്. തറവാട്ടുസ്വത്തിൽ നിനക്കും അമ്മയ്ക്കും
      തരാനുള്ള ഓഹരിയാണിത്." പ്രമേയം: തൊഴിൽമേഖലയിലെ സമ്മർദ്ദം കുടുംബബന്ധങ്ങളെ ഇല്ലാതാക്കുന്നത്;
      "എന്റെ ജീവിതം എത്രത്തോളം എന്റെ കൈയിലല്ല".
    explanations:
      text: "ജോലിത്തിരക്കിൽ ഒരാൾക്ക് സ്വന്തം ബാല്യത്തിലെ സംരക്ഷകനോട് രണ്ടു മണിക്കൂർ സംസാരിക്കാൻ കഴിയുന്നില്ല. ആ മനുഷ്യൻ പണം ചോദിക്കാനല്ല, പണം കൊടുക്കാനും യാത്ര പറയാനുമാണ് വന്നത് എന്ന് മാധവൻ അറിയുന്നത് വളരെ വൈകിയാണ്."
      visual: "ഒരു ക്ലോക്കിന്റെ ചിത്രം: ഓരോ മണിക്കൂറിലും മീറ്റിങ്, ഫോൺ, ബോസ്; ഒരു മൂലയിൽ പ്ലാസ്റ്റിക് പൊതിയുമായി കാത്തുനിൽക്കുന്ന വൃദ്ധൻ; അവസാനം ഒരു ചിതയും ഒരു കത്തും."
      step_by_step: "'ഞായറാഴ്ചയുടെ ചിതയെരിയുന്ന നേരത്ത്' — 1. ഞായർ അച്യുതമ്മാമയ്ക്കായി മാറ്റിവച്ചതായിരുന്നു. 2. ആ ദിവസവും ജോലി കൊണ്ടുപോയി. 3. മാധവൻ മടങ്ങിയെത്തുമ്പോൾ അച്യുതമ്മാമയുടെ ചിതയും ആ ഞായറിന്റെ പ്രതീക്ഷയും ഒന്നിച്ച് എരിയുന്നു."
      real_world: "വലിയ കമ്പനികളിൽ 'വർക്ക്-ലൈഫ് ബാലൻസ്' ഇന്ന് പ്രധാന ചർച്ചയാണ്. കുടുംബത്തിനും സ്വന്തക്കാർക്കും സമയം കണ്ടെത്തുന്നത് ഒരു കഴിവാണ്."
    activity:
      type: order
      prompt: ആ തിങ്കളാഴ്ച രാവിലെ നടന്നത് ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - രാവിലെ ഏഴുമണിക്ക് അച്യുതമ്മാമ എത്തുന്നു
      - '"ഒരു രണ്ടുമണിക്കൂറെങ്കിലും വേണം"'
      - മാധവൻ പണം നീട്ടുന്നു
      - '"പണം വാങ്ങാനല്ല ഞാൻ വന്നത്"'
      - മാധവൻ ഞായറാഴ്ച വരാൻ പറയുന്നു
      reasons:
        '"ഒരു രണ്ടുമണിക്കൂറെങ്കിലും വേണം"': സംസാരിക്കാൻ സമയം ചോദിക്കുന്നത് വന്നശേഷമാണ്.
        മാധവൻ പണം നീട്ടുന്നു: രണ്ടുമണിക്കൂർ കൊടുക്കാൻ നേരമില്ലാത്ത മാധവൻ പകരം പണം നീട്ടുന്നു.
        '"പണം വാങ്ങാനല്ല ഞാൻ വന്നത്"': 'പണം നീട്ടിയതിനുള്ള മറുപടിയാണിത്: ''നല്ല വിരോധാഭാസം''.'
        മാധവൻ ഞായറാഴ്ച വരാൻ പറയുന്നു: അന്ന് സമയമില്ലാത്തതുകൊണ്ട് സംസാരം പിന്നീടാക്കുന്നു.
    lesson:
      - teach: '''അച്യുതമ്മാമ'' കെ. പി. രാമനുണ്ണിയുടെ ''എൻട്രൻസ് എഴുതുന്ന കുട്ടി'' എന്ന സമാഹാരത്തിലെ കഥ. ആഖ്യാതാവ് മാധവൻ തിരക്കുള്ള കമ്പനി ഉദ്യോഗസ്ഥനാണ്; ഭാര്യ ശോഭ, ഒരു കൊച്ചുമകൻ. ഒരു തിങ്കളാഴ്ച രാവിലെ ഏഴുമണിക്ക് അച്യുതമ്മാമ വീട്ടിലെത്തുന്നു; മാധവന് ഒൻപതുമണിക്ക് കോൺഫറൻസ്.'
        check:
          prompt: 'അച്യുതമ്മാമ എത്തിയ ദിവസം:'
          options:
          - തിങ്കളാഴ്ച
          - ഞായറാഴ്ച
          - ശനിയാഴ്ച
          answer: തിങ്കളാഴ്ച
          why: ഒരു തിങ്കളാഴ്ച രാവിലെ ഏഴുമണിക്ക്.
