      - teach: 'പുതിയ പദങ്ങൾ: ഉപജീവനം (ജീവിക്കാൻ ആവശ്യമായത്), അഭിവൃദ്ധി (വളർച്ച), ചാതുര്യം (സാമർഥ്യം), ആർദ്രത (അലിവ്), അപശങ്കം (ശങ്കകൂടാതെ), തിമിരം (അന്ധത), ജാഗരൂകം (ഉണർച്ചയുള്ള), ഗാഢം (തീവ്രമായ).'
