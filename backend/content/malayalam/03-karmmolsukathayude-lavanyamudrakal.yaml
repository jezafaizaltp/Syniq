      - teach: '''അറിയുക, ഞങ്ങളനേകം നിരകളിൽ വറുതിയൊടങ്കം വെട്ടുന്നോർ'' — ദാരിദ്ര്യത്തോട് പോരാടുന്നവരാണ് തങ്ങളെന്ന് അവർ പ്രഖ്യാപിക്കുന്നു. പട്ടിണിയിലും തളരാതെ ജീവിക്കുന്ന അധ്വാനവർഗത്തിന്റെ ജീവിതവും അധ്വാനത്തോടുള്ള മനോഭാവവും സംഘശക്തിയുമാണ് കവിതയുടെ പ്രമേയം.'
