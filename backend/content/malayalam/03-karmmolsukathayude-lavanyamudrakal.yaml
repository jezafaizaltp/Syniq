        - വിനോദത്തിന്
        answer: ഉപജീവനത്തിന്
        difficulty: 1
        hints:
        - ജീവിക്കാൻ ആവശ്യമായത് കണ്ടെത്താൻ.
        - ലേഖകൻ ഇത് പോരാ എന്നു പറയുന്നു.
        solution: അധികംപേരും ഉപജീവനത്തിനുവേണ്ടി മാത്രം ജോലിചെയ്യുന്നു.
        mistakes:
          സമുദായസേവനത്തിന്: m3_work_view
      - prompt: അധ്വാനത്തിന് വലിയ വില കല്പിച്ചവരായി ലേഖകൻ പേരെടുത്തു പറയാത്തത് ആരെ?
        options:
        - ബഷീർ
        - പ്ലേറ്റോ
        - ഗാന്ധിജി
        - അരിസ്റ്റോട്ടിൽ
        answer: ബഷീർ
        difficulty: 2
        hints:
        - പാഠത്തിൽ നാലു ചിന്തകരുടെ പേരുണ്ട്.
        - അവരിൽ ഒരാൾ നെഹ്റു.
        solution: പ്ലേറ്റോ, അരിസ്റ്റോട്ടിൽ, ഗാന്ധിജി, നെഹ്റു എന്നിവരെയാണ് ലേഖകൻ പറയുന്നത്.
        mistakes:
          പ്ലേറ്റോ: m3_work_view
      - prompt: ഒരു കൂട്ടുകാരി ഗ്രാമത്തിലെ വായനശാലയിൽ സൗജന്യമായി പുസ്തകം അടുക്കിവയ്ക്കുന്നു, അത് നാട്ടുകാർക്ക് ഉപകാരപ്പെടുന്നു. ലേഖനത്തിൽ ജോലി നൽകുന്ന ഏതു കാര്യമാണ് ഇതിൽ കൂടുതൽ തെളിയുന്നത്?
        options:
        - സമുദായത്തിന് ഉപയോഗപ്രദമായി എന്ന ബോധം
        - ഉപജീവനം
        - സുഖലോലുപത
        - മടുപ്പ്
        answer: സമുദായത്തിന് ഉപയോഗപ്രദമായി എന്ന ബോധം
        difficulty: 2
        hints:
        - ഇവിടെ പ്രയോജനം കിട്ടുന്നത് ആർക്കാണ്?
        - അവൾക്ക് പണം കിട്ടുന്നില്ല.
        solution: നാട്ടുകാർക്ക് ഉപകാരപ്പെടുന്നു — സമുദായത്തിന് ഉപയോഗപ്രദമായി എന്ന ബോധം.
        mistakes:
          ഉപജീവനം: m3_work_gives
      - prompt: ഒരു കുട്ടി സ്വന്തമായി ഒരു ചെറിയ പക്ഷിക്കൂട് ഉണ്ടാക്കി തന്റെ കൈവേല തെളിയിക്കുന്നു. ജോലി നൽകുന്ന ഏതു കാര്യമാണിത്?
        options:
        - നിർമ്മാണാത്മകമായ കഴിവുകൾ പ്രകടിപ്പിക്കാനുള്ള അവസരം
        - ഉപജീവനം
        - സമയം കളയൽ
        - മടുപ്പ്
        answer: നിർമ്മാണാത്മകമായ കഴിവുകൾ പ്രകടിപ്പിക്കാനുള്ള അവസരം
        difficulty: 2
        hints:
        - ഇവിടെ എന്തെങ്കിലും പുതുതായി ഉണ്ടാക്കുന്നു.
        - കൈയിലുള്ള കഴിവ് പുറത്തുവരുന്നു.
        solution: സ്വന്തം കൈവേലകൊണ്ട് എന്തെങ്കിലും ഉണ്ടാക്കുന്നത് നിർമ്മാണാത്മകമായ കഴിവുകളുടെ പ്രകടനം.
        mistakes:
          സമയം കളയൽ: m3_work_gives
      - prompt: ലേഖകന്റെ അഭിപ്രായത്തിൽ ജോലിയിലൂടെ വ്യക്തിക്ക് എന്തു സംഭവിക്കുന്നു?
        options:
        - കഴിവുകൾ വികസിക്കുന്നു, വ്യക്തിപ്രഭാവത്തിന് അന്തസ്സ് കൂടുന്നു
        - സമയം വെറുതെ പോകുന്നു
        - ആരോഗ്യം നശിക്കുന്നു
        - സൗഹൃദങ്ങൾ കുറയുന്നു
        answer: കഴിവുകൾ വികസിക്കുന്നു, വ്യക്തിപ്രഭാവത്തിന് അന്തസ്സ് കൂടുന്നു
        difficulty: 3
        hints:
        - ജോലി സമയം കളയാനുള്ള മാർഗമല്ല എന്ന് ലേഖകൻ.
        - പണത്തിനപ്പുറം ജോലി വ്യക്തിക്ക് നൽകുന്നതെന്ത്?
        solution: ജോലിയിലൂടെ കഴിവുകൾ വികസിക്കുന്നു; വ്യക്തിപ്രഭാവത്തിന് മാറ്റും അന്തസ്സും കൂടുന്നു.
        mistakes:
          സമയം വെറുതെ പോകുന്നു: m3_work_view
      - prompt: ഈ ലേഖനത്തിലെ ആശയത്തിന് എതിരായ ചിന്ത ഏത്?
        options:
        - ചെറിയ ജോലികൾ ചെയ്യുന്നത് അന്തസ്സുകേടാണ്
        - എല്ലാ ജോലിക്കും അന്തസ്സുണ്ട്
        - അധ്വാനിക്കുന്നവന്റെ വിശപ്പിന് സുഖമുണ്ട്
        - ജോലി ചാരിതാർഥ്യം നൽകുന്നു
        answer: ചെറിയ ജോലികൾ ചെയ്യുന്നത് അന്തസ്സുകേടാണ്
        difficulty: 3
        hints:
        - ലേഖകൻ മഹത്വം കാണുന്നത് എവിടെയാണ്?
        - ജോലിയുടെ വലുപ്പമാണോ ചെയ്യുന്ന രീതിയാണോ പ്രധാനം?
        solution: ജോലി എത്ര നിസ്സാരമായാലും ചെയ്യുന്ന രീതിയിലാണ് മഹത്വം എന്ന ലേഖകന്റെ ആശയത്തിന് എതിരാണിത്.
        mistakes:
          എല്ലാ ജോലിക്കും അന്തസ്സുണ്ട്: m3_work_view

  - code: mal9.u3.vibhakti
    title: "ഭാഷ: വിഭക്തിപ്രത്യയങ്ങളും പദപരിചയവും"
    after: [mal9.u3.achuthammama]
    notes: |
      നാമത്തോടു ചേർന്ന് മറ്റു പദങ്ങളുമായുള്ള ബന്ധം കാണിക്കുന്ന പ്രത്യയങ്ങളാണ് വിഭക്തിപ്രത്യയങ്ങൾ.
      പാഠപുസ്തകത്തിലെ ഉദാഹരണങ്ങൾ: "ശോഭ അച്യുതമ്മാമയ്ക്ക് ചായ കൊടുത്തു" (ക്ക് — ഉദ്ദേശിക),
      "അച്യുതമ്മാമയോട് ഞാൻ ലോഹ്യം പറഞ്ഞു" (ഓട് — സംയോജിക), "ഞാൻ അച്യുതമ്മാമയെ കണ്ടു" (എ —
      പ്രതിഗ്രാഹിക), "അച്യുതമ്മാമയുടെ ആവശ്യം" (ഉടെ — സംബന്ധിക). മറ്റുള്ളവ: നിർദേശിക (പ്രത്യയമില്ല),
      പ്രയോജിക (ആൽ — കൈകൊണ്ട്/കൈയാൽ), ആധാരിക (ഇൽ, കൽ — വീട്ടിൽ). ദ്വന്ദ്വസമാസം: സുഖസൗകര്യങ്ങൾ =
      സുഖവും സൗകര്യവും. പദപരിചയം: ചാരിതാർഥ്യം (സംതൃപ്തി), ഉപജീവനം (ജീവിക്കാൻ ആവശ്യമായത്), അഭിവൃദ്ധി
      (വളർച്ച), ചാതുര്യം (സാമർഥ്യം), ആർദ്രത (അലിവ്), അപശങ്കം (ശങ്കകൂടാതെ), തിമിരം (അന്ധത),
      ജാഗരൂകം (ഉണർച്ചയുള്ള), ഗാഢം (തീവ്രമായ).
    explanations:
      text: "ഒരേ നാമം 'അച്യുതമ്മാമ' പ്രത്യയം മാറുമ്പോൾ വാക്യത്തിൽ വേറെ വേറെ പങ്കു വഹിക്കുന്നു: ആർക്ക് (ക്ക്), ആരോട് (ഓട്), ആരെ (എ), ആരുടെ (ഉടെ)."
      visual: "നടുവിൽ 'അച്യുതമ്മാമ' എന്ന പെട്ടി; ചുറ്റും അമ്പുകൾ: -യെ (പ്രതിഗ്രാഹിക), -യോട് (സംയോജിക), -യ്ക്ക് (ഉദ്ദേശിക), -യുടെ (സംബന്ധിക), -യാൽ (പ്രയോജിക), -യിൽ (ആധാരിക)."
      step_by_step: "'അച്യുതമ്മാമയോട് ഞാൻ ലോഹ്യം പറഞ്ഞു' — 1. പ്രത്യയം: ഓട്. 2. ഓട് കൂടെ/നേരെ എന്ന ബന്ധം കാണിക്കുന്നു. 3. സംയോജികാവിഭക്തി."
      real_world: "ഇംഗ്ലീഷിൽ to, with, of തുടങ്ങിയ prepositions ചെയ്യുന്ന ജോലിയാണ് മലയാളത്തിൽ വിഭക്തിപ്രത്യയങ്ങൾ ചെയ്യുന്നത്."
    activity:
      type: sort
      prompt: ഓരോ പദത്തിലെയും വിഭക്തി ഏത്? പ്രത്യയം നോക്കൂ.
      bins:
      - പ്രതിഗ്രാഹിക (എ)
      - ഉദ്ദേശിക (ക്ക്)
      - സംബന്ധിക (ഉടെ)
      - സംയോജിക (ഓട്)
      - ആധാരിക (ഇൽ)
      items:
      - label: അച്യുതമ്മാമയെ കണ്ടു
        bin: പ്രതിഗ്രാഹിക (എ)
        clue: നാമത്തിന്റെ ഒടുവിൽ ചേർന്ന പ്രത്യയം ഏത്?
        why: '''എ'' ചേർന്നു: പ്രതിഗ്രാഹിക.'
      - label: അച്യുതമ്മാമയ്ക്ക് ചായ കൊടുത്തു
        bin: ഉദ്ദേശിക (ക്ക്)
        clue: ചായ ആർക്കുവേണ്ടി? പ്രത്യയം നോക്കൂ.
        why: '''ക്ക്'' ചേർന്നു: ഉദ്ദേശിക.'
      - label: അച്യുതമ്മാമയുടെ ആവശ്യം
        bin: സംബന്ധിക (ഉടെ)
        clue: ആവശ്യം ആരുടേത്? ഏതു പ്രത്യയം?
        why: '''ഉടെ'' ചേർന്നു: സംബന്ധിക.'
      - label: മാധവന്റെ ഓഫീസ്
        bin: സംബന്ധിക (ഉടെ)
        clue: '''-ന്റെ'' എന്നത് ഉടമസ്ഥത കാണിക്കുന്നുണ്ടോ?'
        why: '''ന്റെ'' സംബന്ധികയുടെ മറ്റൊരു രൂപം.'
      - label: അച്യുതമ്മാമയോട് ലോഹ്യം പറഞ്ഞു
        bin: സംയോജിക (ഓട്)
        clue: ലോഹ്യം ആരോട്? പ്രത്യയം ഏത്?
        why: '''ഓട്'' ചേർന്നു: സംയോജിക.'
      - label: വീട്ടിൽ എത്തി
        bin: ആധാരിക (ഇൽ)
        clue: ഇത് ഒരു സ്ഥലം കാണിക്കുന്നുണ്ടോ?
        why: '''ഇൽ'' ചേർന്നു: ആധാരിക.'
      - label: ഓഫീസിൽ കോൺഫറൻസ്
        bin: ആധാരിക (ഇൽ)
        clue: കോൺഫറൻസ് എവിടെ?
        why: '''ഇൽ'' സ്ഥലം കാണിക്കുന്നു: ആധാരിക.'
    lesson:
      - teach: 'നാമത്തോടു ചേർന്ന്, ആ നാമത്തിന് വാക്യത്തിലെ മറ്റു പദങ്ങളുമായുള്ള ബന്ധം കാണിക്കുന്ന പ്രത്യയങ്ങളാണ് വിഭക്തിപ്രത്യയങ്ങൾ. ഉദാ: അച്യുതമ്മാമ + എ = അച്യുതമ്മാമയെ; അച്യുതമ്മാമ + ഉടെ = അച്യുതമ്മാമയുടെ. പ്രത്യയം മാറുമ്പോൾ അർഥബന്ധം മാറുന്നു.'
        check:
          prompt: '''അച്യുതമ്മാമയുടെ'' എന്ന പദത്തിലെ പ്രത്യയം:'
          options:
          - ഉടെ
          - എ
          - ഓട്
          answer: ഉടെ
          why: അച്യുതമ്മാമ + ഉടെ.
      - teach: 'ഏഴു വിഭക്തികൾ: നിർദേശിക (പ്രത്യയമില്ല: ശോഭ), പ്രതിഗ്രാഹിക (എ: അമ്മാമയെ), സംയോജിക (ഓട്: അമ്മാമയോട്), ഉദ്ദേശിക (ക്ക്, ന്: അമ്മാമയ്ക്ക്), പ്രയോജിക (ആൽ: കൈയാൽ), സംബന്ധിക (ഉടെ, ന്റെ: അമ്മാമയുടെ), ആധാരിക (ഇൽ, കൽ: വീട്ടിൽ).'
        picture:
          kind: compare
          columns:
          - title: പ്രത്യയം
            points:
            - എ
            - ഓട്
            - ക്ക്
