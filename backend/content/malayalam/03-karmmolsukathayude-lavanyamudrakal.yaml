subject: mal
chapter: 3
title: "കേരളപാഠാവലി 3: കർമ്മോത്സുകതയുടെ ലാവണ്യമുദ്രകൾ"

tips:
  mal_workers_poem: "'തരിശുനിലങ്ങളിലേക്ക്' (തിരുനല്ലൂർ കരുണാകരൻ): കരിമുകിൽപോലെ വരുന്ന വേലക്കാർ തരിശുഭൂമി ഉഴുതുമറിക്കുന്നു; അധ്വാനവർഗത്തിന്റെ സംഘശക്തിയും ആത്മാഭിമാനവും."
  mal_achuthammama: "'അച്യുതമ്മാമ' (കെ. പി. രാമനുണ്ണി): തിരക്കുള്ള കമ്പനി ഉദ്യോഗസ്ഥനായ മാധവന് ബാല്യത്തിലെ സംരക്ഷകനായ അച്യുതമ്മാമയോട് രണ്ടു മണിക്കൂർ സംസാരിക്കാൻ സമയം കിട്ടുന്നില്ല; അദ്ദേഹം മരിച്ചശേഷമാണ് മാധവന് മടങ്ങാനാകുന്നത്."
  mal_work_essay: "'നിങ്ങളും നിങ്ങളുടെ ജോലിയും' (കെ. പി. കേശവമേനോൻ): ജോലി പണത്തിനുമാത്രമല്ല; അത് ചാരിതാർഥ്യവും സമൂഹത്തിന് ഉപകാരവും കഴിവുകൾ പ്രകടിപ്പിക്കാനുള്ള അവസരവും നൽകുന്നു."
  mal_vibhakti: "പദത്തിന്റെ ഒടുവിലെ പ്രത്യയം നോക്കൂ: -എ, -ഓട്, -ക്ക്/-ന്, -ന്റെ/-ഉടെ, -ആൽ, -ഇൽ. ഓരോ പ്രത്യയത്തിനും ഒരു വിഭക്തിയുടെ പേരുണ്ട്; പാഠപുസ്തകത്തിലെ പട്ടിക ഓർക്കൂ."
  mal_achu_theme: "കഥയിൽ ജോലിയുടെ തിരക്കും സമ്മർദ്ദവും കാരണം വീട്ടിലുള്ളവർ തമ്മിൽ എന്താണ് സംഭവിക്കുന്നത് എന്നു വീണ്ടും വായിക്കൂ."
  mal_proverb_work: "വാക്യം അധ്വാനത്തെയും ആഹാരത്തെയും ചേർത്തുപറയുന്നു. ജോലി ചെയ്തു ക്ഷീണിച്ചവനെയും വിശപ്പിനെയും പറയുന്ന പഴഞ്ചൊല്ല് ഏത്?"
  mal_tharishu_veeryam: "'ഭൂമി മുഴുവൻ ഒറ്റച്ചാലായി ഉഴുതുമറിക്കും' എന്നത് വലിയ ശക്തിയെക്കുറിച്ചുള്ള ചിത്രമാണ്. മടിയോ ദുഃഖമോ ഇവിടെ ചേരുമോ?"

concepts:
  - code: mal9.u3.tharishu
    title: തരിശുനിലങ്ങളിലേക്ക്
    notes: |
      തിരുനല്ലൂർ കരുണാകരന്റെ കവിത ('തിരുനല്ലൂർ കരുണാകരന്റെ കവിതകൾ'). "തരിശുനിലങ്ങളിലേക്കു വരുന്നു
      കരിമുകിൽപോലെ വേലക്കാർ" — എരിയും വേനലിനറുതിയിലണയും കരിമുകിൽപോലെ; മിഴിയിൽ മിന്നൽപ്പിണരുകൾ;
      കൈകളിൽ തളരാത്തുയരും ഏഴകളായ വിളയും വിത്തും; ഇടവാളുകളായി കുളിരും, ഏഴകൾ. വ്യഥകളുള്ളിലൊതുക്കി
      അവർ നടക്കുമ്പോൾ ഗതകാലത്തിന്റെ ജീർണ്ണതകൾ തകരുന്നു. "മുഴുവൻ ഭൂമിയുമൊറ്റച്ചാലായുഴുതുമറിക്കും
      വീര്യമൊടെ അണിയായണിയായ് വേലക്കാരവരടിവച്ചടിവച്ചണയുമ്പോൾ" അവരുടെ കൂർത്ത പരുക്കൻവാക്കുകൾ
      ഇടിയൊച്ചകൾപോലാകാശത്തെ കിടിലംകൊള്ളിക്കുന്നു: "അറിയുക, ഞങ്ങളനേകം നിരകളിൽ വറുതിയൊടങ്കം
      വെട്ടുന്നോർ, മുതിയാതെയും പട്ടിണിയിൽ സ്വയമെരിയുമ്പോഴും ജീവിപ്പോർ" — കരിങ്കൽക്കുന്നുകൾ അവരുടെ
      അടിയേറ്റു തകരുന്നു. തരിശുനിലം = കൃഷിചെയ്യാത്ത നിലം. പ്രമേയം: അധ്വാനവർഗത്തിന്റെ ജീവിതാവസ്ഥയും
      അധ്വാനത്തോടുള്ള മനോഭാവവും, സംഘശക്തി. ബന്ധപ്പെട്ടത്: വൈലോപ്പിള്ളിയുടെ 'യുഗപരിവർത്തനം'
      ("ആ മഹാസംരംഭത്തിൻ സംഘഗാനത്തിൽ ചേർന്നു നാമനുഭവിക്കാം പണ്ടില്ലാത്തൊരഭിമാനം").
    explanations:
      text: "ആരും കൃഷി ചെയ്യാത്ത തരിശുഭൂമിയിലേക്ക് തൊഴിലാളികൾ ഒന്നിച്ചു വരുന്നു. വേനലിനുശേഷം വരുന്ന മഴമേഘംപോലെ അവർ ആ മണ്ണിന് ജീവൻ നൽകുന്നു. വിശപ്പും ദുരിതവും ഉള്ളിലൊതുക്കി അവർ കല്ലും മണ്ണും ഉഴുതുമറിക്കുന്നു."
      visual: "ഉണങ്ങിവിണ്ട തരിശുഭൂമി; ആകാശത്ത് കറുത്ത മഴമേഘങ്ങൾ; അതിനു താഴെ കൈക്കോട്ടും വിത്തുമായി നിരനിരയായി നടന്നുവരുന്ന തൊഴിലാളികൾ."
      step_by_step: "'കരിമുകിൽപോലെ വേലക്കാർ' — 1. കരിമുകിൽ = കറുത്ത മഴമേഘം. 2. വേനലിനുശേഷം മഴമേഘം ഭൂമിക്ക് ജീവൻ നൽകുന്നു. 3. തൊഴിലാളികളും തരിശുഭൂമിക്ക് ജീവൻ നൽകുന്നു — അതാണ് ഉപമയുടെ ഭംഗി."
      real_world: "കേരളത്തിൽ ഇന്ന് തരിശുനിലങ്ങളിൽ കുടുംബശ്രീ കൂട്ടായ്മകളും കർഷകസംഘങ്ങളും വീണ്ടും നെൽക്കൃഷി ഇറക്കുന്നുണ്ട്."
    activity:
      type: sort
      prompt: 'കവിതയിലെ ബിംബങ്ങൾ: മഴക്കാലത്തിന്റെ ചിത്രമോ, അധ്വാനത്തിന്റെ ശക്തിയുടെ ഫലമോ?'
      bins:
      - മഴക്കാലബിംബം
      - അധ്വാനശക്തിയുടെ ഫലം
      items:
      - label: വേലക്കാർ കരിമുകിൽപോലെ
        bin: മഴക്കാലബിംബം
        clue: എരിയും വേനലിനറുതിയിൽ വരുന്നത് എന്ത്?
        why: വേനലിനൊടുവിലെ കരിമേഘംപോലെ, ആശ്വാസവുമായി വേലക്കാർ.
      - label: മിഴിയിൽ മിന്നൽപ്പിണരുകൾ
        bin: മഴക്കാലബിംബം
        clue: മേഘത്തോടൊപ്പം ആകാശത്ത് കാണുന്നത് എന്ത്?
        why: 'മിന്നൽ: മേഘബിംബം തുടരുന്നു.'
      - label: വാക്കുകൾ ഇടിയൊച്ചകൾപോലെ
        bin: മഴക്കാലബിംബം
        clue: മിന്നലിനുശേഷം കേൾക്കുന്നത് എന്ത്?
        why: 'ഇടിയൊച്ച: കരിമുകിൽ, മിന്നൽ, ഇടി എന്ന ക്രമം.'
      - label: ഗതകാലത്തിന്റെ ജീർണ്ണതകൾ തകരുന്നു
        bin: അധ്വാനശക്തിയുടെ ഫലം
        clue: വേലക്കാർ നടക്കുമ്പോൾ പഴയതിന് എന്തു സംഭവിക്കുന്നു?
        why: അവരുടെ മുന്നേറ്റം പഴയ ജീർണ്ണതകളെ തകർക്കുന്നു.
      - label: കരിങ്കൽക്കുന്നുകൾ അടിയേറ്റു തകരുന്നു
        bin: അധ്വാനശക്തിയുടെ ഫലം
        clue: ആരുടെ അടിയേറ്റാണ് കുന്നുകൾ തകരുന്നത്?
        why: വേലക്കാരുടെ അധ്വാനശക്തി കരിങ്കല്ലിനെയും തകർക്കുന്നു.
      - label: ഭൂമി മുഴുവൻ ഒറ്റച്ചാലായുഴുതുമറിക്കും
        bin: അധ്വാനശക്തിയുടെ ഫലം
        clue: ഇത് മേഘം ചെയ്യുന്നതോ മനുഷ്യർ ചെയ്യുന്നതോ?
        why: ഉഴുതുമറിക്കുന്നത് വേലക്കാരുടെ വീര്യമാണ്.
    items:
      - prompt: "'തരിശുനിലങ്ങളിലേക്ക്' എന്ന കവിത എഴുതിയതാര്?"
        options: ["തിരുനല്ലൂർ കരുണാകരൻ", "വൈലോപ്പിള്ളി ശ്രീധരമേനോൻ", "ഇടശ്ശേരി ഗോവിന്ദൻനായർ", "എം. ആർ. രേണുകുമാർ"]
        answer: "തിരുനല്ലൂർ കരുണാകരൻ"
        difficulty: 1
        hints: ["'തിരുനല്ലൂർ കരുണാകരന്റെ കവിതകൾ'."]
        solution: "തിരുനല്ലൂർ കരുണാകരൻ."
        mistakes: {"വൈലോപ്പിള്ളി ശ്രീധരമേനോൻ": mal_author_work}
      - prompt: "'തരിശുനിലം' എന്നാൽ:"
        options: ["കൃഷിചെയ്യാത്ത നിലം", "വെള്ളം കെട്ടിയ നിലം", "വീടുവച്ച സ്ഥലം", "കാട്"]
        answer: "കൃഷിചെയ്യാത്ത നിലം"
        difficulty: 1
        hints: ["പദപരിചയം."]
        solution: "തരിശുനിലം = കൃഷിചെയ്യാത്ത നിലം."
        mistakes: {"കാട്": mal_word_meaning}
      - prompt: "കവി വേലക്കാരെ ആദ്യം ഉപമിക്കുന്നത് എന്തിനോട്?"
        options: ["കരിമുകിലിനോട്", "കാട്ടാനയോട്", "പുഴയോട്", "സൂര്യനോട്"]
        answer: "കരിമുകിലിനോട്"
        difficulty: 1
        hints: ["'...പോലെ വേലക്കാർ'."]
        solution: "കരിമുകിൽ (മഴമേഘം) പോലെ വേലക്കാർ."
        mistakes: {"സൂര്യനോട്": mal_imagery}
      - prompt: "'അവരുടെ കൂർത്ത പരുക്കൻവാക്കുകളവരുടെ ഹൃദയസ്പന്ദങ്ങൾ ഇടിയൊച്ചകൾപോലാകാശത്തെക്കിടിലംകൊള്ളിച്ചുയരുന്നു' — ഇത് എന്തിനെ കാണിക്കുന്നു?"
        options: ["തൊഴിലാളികളുടെ സംഘശക്തിയും ആത്മവിശ്വാസവും", "തൊഴിലാളികളുടെ ഭയം", "ഇടിമിന്നലുള്ള കാലാവസ്ഥ", "തൊഴിലാളികളുടെ വഴക്ക്"]
        answer: "തൊഴിലാളികളുടെ സംഘശക്തിയും ആത്മവിശ്വാസവും"
        difficulty: 2
        hints: ["പാഠപുസ്തകത്തിലെ ചോദ്യം: 'തൊഴിലാളികളുടെ സംഘശക്തി'."]
        solution: "ഒരുമിച്ചുയരുന്ന അവരുടെ ശബ്ദം ആകാശത്തെ വിറപ്പിക്കുന്നു: സംഘശക്തി."
        mistakes: {"ഇടിമിന്നലുള്ള കാലാവസ്ഥ": mal_workers_poem}
      - prompt: "'മുഴുവൻ ഭൂമിയുമൊറ്റച്ചാലായുഴുതുമറിക്കും വീര്യമൊടെ' — തൊഴിലാളികളുടെ ഏതു സവിശേഷതയാണ് ഇവിടെ?"
