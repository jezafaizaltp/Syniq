        - വീട്ടിൽ സാധാരണ കിട്ടുന്ന നാടൻ മരുന്ന്.
        - മുറിവിൽ ഇടുന്ന മഞ്ഞനിറമുള്ള പൊടി.
        solution: പഞ്ഞിയും മഞ്ഞൾപ്പൊടിയും, കൂടെ ഇറ്റിച്ച വെള്ളം.
        mistakes:
          ഗുളികയും സൂചിയും: m5_parrot_detail
      - prompt: 'തത്തയെ കിടത്തിയ പഴയ കൂട്ടിൽ മുമ്പ് വളർത്തിയിരുന്നത്:'
        options:
        - മൈനയെയും അണ്ണാനെയും
        - കോഴികളെ
        - മുയലിനെ
        - പ്രാവുകളെ
        answer: മൈനയെയും അണ്ണാനെയും
        difficulty: 2
        hints:
        - ഒരു പക്ഷിയും ഒരു ചെറുജീവിയും.
        - രണ്ടും നാട്ടിൻപുറത്ത് സാധാരണ കാണുന്നവ.
        solution: പണ്ട് മൈനയെയും പിന്നെ അണ്ണാനെയും വളർത്തിയ കമ്പിക്കൂട്.
        mistakes:
          പ്രാവുകളെ: m5_parrot_detail
      - prompt: 'തത്തയുടെ നാവു വടിക്കാൻ ഉപയോഗിച്ചത്:'
        options:
        - കരിമ്പനയോല
        - ഈർക്കിൽ
        - തൂവൽ
        - പഞ്ഞി
        answer: കരിമ്പനയോല
        difficulty: 2
        hints:
        - ഒരു മരത്തിന്റെ ഇല.
        - പനവർഗത്തിൽപ്പെട്ട മരം.
        solution: കരിമ്പനയോലകൊണ്ട് നാവു വടിച്ചു.
        mistakes:
          ഈർക്കിൽ: m5_parrot_detail
      - prompt: 'അയൽപക്കത്തെ കണ്ടൻപൂച്ചയോട് ''അവൾ ഞങ്ങടെ മോളാ!'' എന്നു പറയുന്നതിൽ തെളിയുന്നത്:'
        options:
        - തത്ത അവർക്ക് സ്വന്തം മകളെപ്പോലെയായി
        - പൂച്ചയോടുള്ള ദേഷ്യം മാത്രം
        - തത്തയെ വിൽക്കാനുള്ള ആഗ്രഹം
        - അയൽക്കാരോടുള്ള പരാതി
        answer: തത്ത അവർക്ക് സ്വന്തം മകളെപ്പോലെയായി
        difficulty: 3
        hints:
        - മക്കൾ ദൂരെയാണ്.
        - ആ വീട്ടിൽ തത്തയുടെ സ്ഥാനം എന്താണ്?
        solution: മക്കൾ അകലെയായ ആ വീട്ടിൽ തത്ത സ്വന്തം മകളുടെ സ്ഥാനത്താണ്.
        mistakes:
          പൂച്ചയോടുള്ള ദേഷ്യം മാത്രം: m5_parrot_feeling

  - code: mal9.u5.chiriyude_arangettam
    title: ചിരിയുടെ അരങ്ങേറ്റം
    after: [mal9.u5.thathakkoodu]
    notes: |
      ചാർളി ചാപ്ലിന്റെ 'എന്റെ ആത്മകഥ'യിൽനിന്ന് (വിവർത്തനം: സ്മിത മീനാക്ഷി). ചാപ്ലിൻ ജനിച്ച് ഒരു
      വർഷത്തിനുശേഷം മാതാപിതാക്കൾ പിരിഞ്ഞു (മദ്യപാനം ഒരു കാരണം). ആഴ്ചയിൽ ഇരുപത്തിയഞ്ചു പൗണ്ട്
      വരുമാനമുള്ള നടിയായിരുന്നു അമ്മ; ജീവനാംശം ചോദിച്ചില്ല. അമ്മയ്ക്ക് ശബ്ദതടസ്സം വന്നു; പാടുമ്പോൾ
      ശബ്ദമിടറി, കാണികൾ കൂവി. അൽഡർഷോട്ടിലെ കാന്റീൻ തിയേറ്ററിൽ (കാണികൾ കൂടുതലും വഴക്കാളികളായ
      സൈനികർ) ഒരു ദിവസം അമ്മയ്ക്ക് വേദി വിടേണ്ടിവന്നു. ചാപ്ലിൻ പാടുന്നതു കണ്ടിട്ടുള്ള മാനേജർ
      അഞ്ചുവയസ്സുകാരനെ വേദിയിലെത്തിച്ചു. 'ജാക്ക് ജോൺസ്' എന്ന പാട്ട് പാടി; പണം വന്നുവീണപ്പോൾ
      പാട്ടുനിർത്തി, പെറുക്കിയെടുത്തിട്ടേ പാടൂ എന്നു പറഞ്ഞു; സ്റ്റേജ് മാനേജർ തൂവാലയുമായി വന്നു; പണം
      അയാൾ എടുക്കുമോ എന്ന സംശയത്തിൽ പിന്നാലെ പോയി, അമ്മയെ ഏൽപ്പിച്ചശേഷമേ മടങ്ങിയുള്ളൂ. നൃത്തം,
      അനുകരണങ്ങൾ; അമ്മയുടെ ഐറിഷ് മാർച്ച് ഗാനത്തിലെ ശബ്ദമിടർച്ച നിഷ്കളങ്കമായി അനുകരിച്ചു. "അതായിരുന്നു
      എന്റെ അരങ്ങേറ്റം; അമ്മയുടെ അരങ്ങൊഴിയലും." ബന്ധപ്പെട്ടവ: 'ദി കിഡ്', 'മോഡേൺ ടൈംസ്'.
    explanations:
      text: "ദാരിദ്ര്യവും അരക്ഷിതത്വവും നിറഞ്ഞ ബാല്യത്തിൽ, അമ്മയുടെ ശബ്ദം നഷ്ടപ്പെട്ട രാത്രിയിലാണ് ലോകത്തെ ചിരിപ്പിച്ച ചാപ്ലിന്റെ അരങ്ങേറ്റം. ഒരേ നിമിഷം മകന്റെ തുടക്കവും അമ്മയുടെ അവസാനവും — ചിരിക്കു പിന്നിലെ കണ്ണീരാണ് ഈ ഭാഗം."
      visual: "വേദിയുടെ ചിത്രം: അരങ്ങുവിളക്കുകൾക്കു മുന്നിൽ ഒരു കൊച്ചുകുട്ടി, നിലത്ത് നാണയങ്ങൾ, തൂവാലയുമായി സ്റ്റേജ് മാനേജർ, വശത്ത് വിഷമിച്ചുനിൽക്കുന്ന അമ്മ."
      step_by_step: "'എന്റെ അരങ്ങേറ്റം; അമ്മയുടെ അരങ്ങൊഴിയലും' — 1. അരങ്ങേറ്റം = ആദ്യമായി വേദിയിൽ. 2. അരങ്ങൊഴിയൽ = വേദി വിടൽ. 3. ആ രാത്രി ചാപ്ലിൻ തുടങ്ങി, അമ്മ പിന്നീട് അഭിനയിച്ചില്ല."
      real_world: "'പ്രതിസന്ധികളുണ്ടാവുമ്പോഴാണ് പ്രതിഭ മാറ്റുരയ്ക്കപ്പെടുന്നത്' — കഷ്ടപ്പാടിൽനിന്ന് ഉയർന്നുവന്ന കലാകാരന്മാരുടെ കഥകൾ നമുക്കു ചുറ്റിലുമുണ്ട്."
    activity:
      type: order
      prompt: അഞ്ചുവയസ്സുകാരൻ ചാപ്ലിൻ ആദ്യമായി വേദിയിലെത്തിയത് എങ്ങനെ? ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - അമ്മയ്ക്ക് ശബ്ദതടസ്സം വരുന്നു
      - അൽഡർഷോട്ടിൽ കാണികൾ കൂവുന്നു, അമ്മ വേദി വിടുന്നു
      - മാനേജർ ചാപ്ലിനെ വേദിയിലെത്തിക്കുന്നു
      - '''ജാക്ക് ജോൺസ്'' പാടുന്നു'
      - പണം പെറുക്കിയിട്ടേ പാടൂ എന്നു പറയുന്നു
      reasons:
        അൽഡർഷോട്ടിൽ കാണികൾ കൂവുന്നു, അമ്മ വേദി വിടുന്നു: പാടുമ്പോൾ ശബ്ദമിടറിയതുകൊണ്ടാണ് കാണികൾ കൂവിയത്.
        മാനേജർ ചാപ്ലിനെ വേദിയിലെത്തിക്കുന്നു: അമ്മ വേദി വിട്ടതുകൊണ്ടാണ് പകരം ഒരാളെ വേണ്ടിവന്നത്.
        '''ജാക്ക് ജോൺസ്'' പാടുന്നു': വേദിയിലെത്തിയശേഷമേ പാടാനാകൂ.
        പണം പെറുക്കിയിട്ടേ പാടൂ എന്നു പറയുന്നു: പാട്ടിനിടയിൽ പണം വന്നുവീണപ്പോഴാണ് പാട്ടു നിർത്തിയത്.
    lesson:
      - teach: '''ചിരിയുടെ അരങ്ങേറ്റം'' ചാർളി ചാപ്ലിന്റെ ''എന്റെ ആത്മകഥ''യിൽനിന്നാണ് (വിവർത്തനം: സ്മിത മീനാക്ഷി). ചാപ്ലിൻ ജനിച്ച് ഒരു വർഷം കഴിഞ്ഞപ്പോൾ മാതാപിതാക്കൾ പിരിഞ്ഞു. അമ്മ ആഴ്ചയിൽ ഇരുപത്തിയഞ്ചു പൗണ്ട് വരുമാനമുള്ള നടിയായിരുന്നു; അച്ഛനോട് ജീവനാംശം ചോദിച്ചില്ല.'
        check:
          prompt: ഈ ആത്മകഥാഭാഗം മലയാളത്തിലേക്ക് വിവർത്തനം ചെയ്തതാര്?
          options:
          - സ്മിത മീനാക്ഷി
          - ഗ്രേസി
          - ഖദീജാ മുംതാസ്
          answer: സ്മിത മീനാക്ഷി
          why: 'വിവർത്തനം: സ്മിത മീനാക്ഷി.'
      - teach: അമ്മയ്ക്ക് ശബ്ദതടസ്സം വന്നു; പാടുമ്പോൾ ശബ്ദമിടറി, കാണികൾ കൂവി. അൽഡർഷോട്ടിലെ കാന്റീൻ തിയേറ്ററിൽ (കാണികൾ ഏറെയും വഴക്കാളികളായ സൈനികർ) ഒരു ദിവസം അവർക്ക് വേദി വിടേണ്ടിവന്നു. ചാപ്ലിൻ പാടുന്നത് മുമ്പ് കണ്ടിട്ടുള്ള മാനേജർ അഞ്ചുവയസ്സുകാരനെ വേദിയിലെത്തിച്ചു.
        picture:
          kind: flow
          steps:
          - അമ്മയുടെ ശബ്ദം ഇടറുന്നു
          - കാണികൾ കൂവുന്നു
          - മാനേജർ ചാപ്ലിനെ വേദിയിൽ
          - '''ജാക്ക് ജോൺസ്'' പാട്ട്'
          - പണം അമ്മയെ ഏൽപ്പിക്കുന്നു
          - അനുകരണം, ചിരി
          alt: ചാപ്ലിന്റെ ആദ്യ വേദിയിലെ സംഭവങ്ങളുടെ ക്രമം.
        check:
          prompt: കൊച്ചു ചാപ്ലിനെ വേദിയിലെത്തിച്ചതാര്?
          options:
          - തിയേറ്ററിലെ മാനേജർ
          - അച്ഛൻ
          - ഒരു സൈനികൻ
          answer: തിയേറ്ററിലെ മാനേജർ
          why: അവൻ പാടുന്നത് മാനേജർ മുമ്പ് കേട്ടിരുന്നു.
      - teach: '''ജാക്ക് ജോൺസ്'' പാടുമ്പോൾ പണം വന്നുവീണു; പാട്ടുനിർത്തി, പെറുക്കിയെടുത്തിട്ടേ പാടൂ എന്ന് അവൻ പറഞ്ഞു. പണം അമ്മയെ ഏൽപ്പിച്ചശേഷമേ മടങ്ങിയുള്ളൂ. പിന്നെ നൃത്തം, അനുകരണം; അമ്മയുടെ ശബ്ദമിടർച്ചപോലും നിഷ്കളങ്കമായി അനുകരിച്ചു, കാണികൾ ചിരിച്ചു. ''അതായിരുന്നു എന്റെ അരങ്ങേറ്റം; അമ്മയുടെ അരങ്ങൊഴിയലും.'''
        check:
          prompt: '''അരങ്ങൊഴിയൽ'' എന്നതിന്റെ അർഥം:'
          options:
          - വേദി എന്നേക്കുമായി വിട്ടുപോകൽ
          - ആദ്യമായി വേദിയിൽ കയറൽ
          - വേദി അലങ്കരിക്കൽ
          answer: വേദി എന്നേക്കുമായി വിട്ടുപോകൽ
          why: മകന്റെ അരങ്ങേറ്റദിവസംതന്നെ അമ്മ വേദിയിൽനിന്ന് പിൻവാങ്ങി.
    items:
      - prompt: "'ചിരിയുടെ അരങ്ങേറ്റം' ആരുടെ ആത്മകഥയിൽനിന്നുള്ളതാണ്?"
        options: ["ചാർളി ചാപ്ലിൻ", "സ്മിത മീനാക്ഷി", "ബഷീർ", "ഗ്രേസി"]
        answer: "ചാർളി ചാപ്ലിൻ"
