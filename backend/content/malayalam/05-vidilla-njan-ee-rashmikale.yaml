          - പഴയ കമ്പിക്കൂട്
          - തുറന്നുവിട്ടിട്ടും പോയില്ല
          - '''ഞങ്ങടെ മോൾ'''
          alt: തത്തക്കുഞ്ഞ് വീട്ടിലെ അംഗമായി മാറുന്ന ക്രമം.
