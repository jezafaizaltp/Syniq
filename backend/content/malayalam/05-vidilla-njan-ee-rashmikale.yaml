        - ആനഡോക്ടർ
        - നീട്ടിയെഴുത്തുകൾ
        - ജാക്ക് ജോൺസ്
        answer: ദി കിഡ്
        difficulty: 3
        hints:
        - ഒരു കുട്ടിയെക്കുറിച്ചുള്ള നിശ്ശബ്ദചിത്രം.
        - '''മോഡേൺ ടൈംസ്'' പോലെ മറ്റൊന്ന്.'
        solution: '''ദി കിഡ്'', ''മോഡേൺ ടൈംസ്'' എന്നിവ ചാപ്ലിന്റെ പ്രശസ്ത ചിത്രങ്ങൾ.'
        mistakes:
          ജാക്ക് ജോൺസ്: m5_chaplin_detail

  - code: mal9.u5.madhurakkizhangu
    title: മധുരക്കിഴങ്ങിന്റെ രുചി
    after: [mal9.u5.chiriyude_arangettam]
    notes: |
      സന്തോഷ് ഏച്ചിക്കാനത്തിന്റെ 'പകൽസ്വപ്നത്തിൽ വെയിലുകായാൻ വന്ന ഒരു നരി' എന്ന കൃതിയിലെ
      അനുഭവക്കുറിപ്പ്. ബേഡഡുക്കയിലെ അമ്മവീട്ടിലെത്തിയ എഴുത്തുകാരൻ വയലിലേക്ക് ഓടുന്ന ആളുകളെ
      കാണുന്നു. പ്രായമുള്ള കൃഷിക്കാരനും കന്നുകാലിചികിത്സകനുമായ ചെറിയോനേട്ടൻ കഥ പറയുന്നു.
      സുജിത്ത് (8), സുനിത (6): അമ്മ നാരായണി മരിച്ചു; അമ്മൂമ്മ ചോയിച്ചി (75) അടുത്ത വീടുകളിൽ പാത്രം
      കഴുകി അവരെ പോറ്റി; മുതുമുത്തശ്ശി കുഞ്ഞമ്മ നേരത്തേ മരിച്ചു; പിന്നെ ചോയിച്ചിയും. ഇടിവെട്ടിയാൽ
      കൂൺ മുളയ്ക്കുമെന്ന അറിവ്; തവര പൊട്ടിച്ച് ഉപ്പിട്ട് തിന്നു. സുജിത്ത് കൈക്കോട്ട് പൊക്കിക്കാണിച്ചപ്പോൾ
      ചെറിയോനേട്ടൻ "ആ കണ്ടം നീയെടുത്തോടാ" എന്നു പറഞ്ഞു. മറ്റുള്ളവർ ഉപേക്ഷിച്ച വള്ളികൾ നട്ടു;
      ചെറിയോനേട്ടൻ നൽകിയ രണ്ടു മൺകുടങ്ങളിൽ തോട്ടിൽനിന്ന് വെള്ളമെടുത്തു ("ഒരുറുമ്പ് അരിമണി
      കൊണ്ടുപോകുംപോലെ"). രോഗംകൊണ്ട് വള്ളികൾക്ക് മഞ്ഞനിറം; കൃഷിക്കാർ നനയ്ക്കലും വളമിടലും നിർത്തി;
      കുട്ടികൾ നനയ്ക്കൽ തുടർന്നു. വിളവെടുപ്പിൽ മറ്റുള്ളവർക്ക് മുരടിച്ച വേരുകൾ; കുട്ടികളുടെ കണ്ടത്തിൽ
      "ചുവന്ന ശംഖുപോലെ" കൂറ്റൻ കിഴങ്ങുകൾ. "മധുരക്കിഴങ്ങുചാക്കുകൾക്കിടയിൽ രണ്ട്
      കുഞ്ഞുകിഴങ്ങുകളെപ്പോലെ സുജിത്തും സുനിതയും." കിഴങ്ങ് ആത്മവിശ്വാസത്തിന്റെ പ്രതീകം.
    explanations:
      text: "എല്ലാം നഷ്ടപ്പെട്ട രണ്ടു കുഞ്ഞുങ്ങൾ, എല്ലാവരും ഉപേക്ഷിച്ചിട്ടും പ്രതീക്ഷ കൈവിടാതെ അധ്വാനിച്ചു. അവരുടെ ആത്മവിശ്വാസത്തിൽനിന്ന് വെള്ളവും വളവും വലിച്ചെടുത്തതുപോലെ അവരുടെ കിഴങ്ങുകൾ വിളഞ്ഞു."
      visual: "വയലിന്റെ ചിത്രം: മഞ്ഞനിറം പടർന്ന വള്ളികൾ, മുരടിച്ച വേരുകൾ വലിച്ചെറിയുന്ന കൃഷിക്കാർ, ഒരറ്റത്ത് മൺകുടവുമായി രണ്ടു കുട്ടികൾ, അവരുടെ കണ്ടത്തിൽ ചുവന്ന ശംഖുപോലുള്ള കിഴങ്ങുകൾ."
      step_by_step: "എന്തുകൊണ്ട് കുട്ടികൾക്കുമാത്രം വിളവ് കിട്ടി? 1. രോഗം വന്നപ്പോൾ മറ്റുള്ളവർ നനയ്ക്കലും വളമിടലും നിർത്തി. 2. കുട്ടികൾ ഒന്നും ആലോചിക്കാതെ നനയ്ക്കൽ തുടർന്നു. 3. പരിചരണം തുടർന്ന അവരുടെ ചെടികൾ വിളഞ്ഞു."
      real_world: "പരീക്ഷയിലോ കളിയിലോ തോൽവി മുന്നിൽ കണ്ടാലും ശ്രമം തുടരുന്നവരാണ് പലപ്പോഴും വിജയിക്കുന്നത്. നിങ്ങളുടെ നാട്ടിൽ പ്രതിസന്ധി മറികടന്ന ഒരാളെ പരിചയപ്പെടുത്തൂ."
    activity:
      type: order
      prompt: സുജിത്തിന്റെയും സുനിതയുടെയും കഥ ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - അമ്മ നാരായണി മരിക്കുന്നു
      - അമ്മൂമ്മ ചോയിച്ചി പാത്രം കഴുകി അവരെ പോറ്റുന്നു
      - ചോയിച്ചിയും മരിക്കുന്നു
      - '"ആ കണ്ടം നീയെടുത്തോടാ"'
      - ഉപേക്ഷിച്ച വള്ളികൾ നട്ട് തോട്ടിൽനിന്ന് നനയ്ക്കുന്നു
      reasons:
        അമ്മൂമ്മ ചോയിച്ചി പാത്രം കഴുകി അവരെ പോറ്റുന്നു: അമ്മ മരിച്ചതുകൊണ്ടാണ് അമ്മൂമ്മ അവരെ നോക്കേണ്ടിവന്നത്.
        ചോയിച്ചിയും മരിക്കുന്നു: '''പിന്നെ ചോയിച്ചിയും'': അവരെ പോറ്റിയശേഷമാണ്.'
        '"ആ കണ്ടം നീയെടുത്തോടാ"': ആരുമില്ലാതായ സുജിത്ത് കൈക്കോട്ട് പൊക്കിക്കാണിച്ചപ്പോഴാണ് ചെറിയോനേട്ടൻ ഇതു പറയുന്നത്.
        ഉപേക്ഷിച്ച വള്ളികൾ നട്ട് തോട്ടിൽനിന്ന് നനയ്ക്കുന്നു: കണ്ടം കിട്ടിയശേഷമേ അതിൽ നടാനാകൂ.
    lesson:
      - teach: '''മധുരക്കിഴങ്ങിന്റെ രുചി'' സന്തോഷ് ഏച്ചിക്കാനത്തിന്റെ അനുഭവക്കുറിപ്പ്. ബേഡഡുക്കയിലെ അമ്മവീട്ടിൽ, കൃഷിക്കാരനും കന്നുകാലിചികിത്സകനുമായ ചെറിയോനേട്ടൻ ഒരു കഥ പറയുന്നു. സുജിത്ത് (8), സുനിത (6). അമ്മ നാരായണി മരിച്ചു; അമ്മൂമ്മ ചോയിച്ചി അയൽവീടുകളിൽ പാത്രം കഴുകി അവരെ പോറ്റി; പിന്നെ ചോയിച്ചിയും മരിച്ചു.'
        check:
          prompt: 'കുട്ടികളുടെ അമ്മൂമ്മയുടെ പേര്:'
          options:
          - ചോയിച്ചി
          - നാരായണി
          - കുഞ്ഞമ്മ
          answer: ചോയിച്ചി
          why: നാരായണി അമ്മ; കുഞ്ഞമ്മ മുതുമുത്തശ്ശി.
      - teach: 'ഒറ്റപ്പെട്ട കുട്ടികൾ കാടും വയലും അറിഞ്ഞു വളർന്നു: ഇടിവെട്ടിയാൽ കൂൺ മുളയ്ക്കും, തവര പൊട്ടിച്ച് ഉപ്പിട്ട് തിന്നാം. സുജിത്ത് കൈക്കോട്ട് പൊക്കിക്കാണിച്ചപ്പോൾ ചെറിയോനേട്ടൻ: ''ആ കണ്ടം നീയെടുത്തോടാ.'' മറ്റുള്ളവർ ഉപേക്ഷിച്ച വള്ളികൾ നട്ടു; രണ്ടു മൺകുടങ്ങളിൽ തോട്ടിൽനിന്ന് വെള്ളം കോരി — ഉറുമ്പ് അരിമണി കൊണ്ടുപോകുംപോലെ.'
        picture:
          kind: compare
          columns:
          - title: മറ്റു കൃഷിക്കാർ
            points:
            - രോഗം കണ്ടപ്പോൾ നന നിർത്തി
            - വളമിടൽ നിർത്തി
            - മുരടിച്ച വേരുകൾ
          - title: സുജിത്തും സുനിതയും
            points:
            - ഉപേക്ഷിച്ച വള്ളികൾ നട്ടു
            - നനയ്ക്കൽ തുടർന്നു
            - ചുവന്ന ശംഖുപോലെ കൂറ്റൻ കിഴങ്ങുകൾ
          alt: മറ്റു കൃഷിക്കാരുടെയും കുട്ടികളുടെയും കൃഷിയും വിളവും.
        check:
          prompt: കുട്ടികൾ നട്ടത് എന്തായിരുന്നു?
          options:
          - മറ്റുള്ളവർ ഉപേക്ഷിച്ച വള്ളികൾ
          - കടയിൽനിന്ന് വാങ്ങിയ വിത്ത്
          - തെങ്ങിൻതൈകൾ
          answer: മറ്റുള്ളവർ ഉപേക്ഷിച്ച വള്ളികൾ
          why: ഉപേക്ഷിക്കപ്പെട്ട വള്ളികളിൽനിന്ന് അവർ വിളവുണ്ടാക്കി.
      - teach: രോഗംകൊണ്ട് വള്ളികൾ മഞ്ഞച്ചപ്പോൾ മറ്റുള്ളവർ നനയും വളമിടലും നിർത്തി; കുട്ടികൾ നനയ്ക്കൽ തുടർന്നു. വിളവെടുപ്പിൽ കുട്ടികളുടെ കണ്ടത്തിൽ 'ചുവന്ന ശംഖുപോലെ' കൂറ്റൻ കിഴങ്ങുകൾ. കിഴങ്ങ് അവരുടെ ആത്മവിശ്വാസത്തിന്റെയും പ്രതീക്ഷ കൈവിടാത്ത അധ്വാനത്തിന്റെയും പ്രതീകമാണ്.
        check:
          prompt: കുട്ടികളുടെ കിഴങ്ങുകളെ എന്തിനോടാണ് ഉപമിച്ചത്?
          options:
          - ചുവന്ന ശംഖ്
          - ഉറുമ്പ്
          - കരിമുകിൽ
          answer: ചുവന്ന ശംഖ്
          why: '''ചുവന്ന ശംഖുപോലെ'' കൂറ്റൻ കിഴങ്ങുകൾ.'
    items:
