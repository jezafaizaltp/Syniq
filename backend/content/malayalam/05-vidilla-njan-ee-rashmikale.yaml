  - code: mal9.u5.sandhi
    title: "ഭാഷ: പദച്ചേർച്ചയും പദപരിചയവും"
    after: [mal9.u5.madhurakkizhangu]
    notes: |
      പദങ്ങൾ ചേർത്തെഴുതുമ്പോഴുള്ള മാറ്റങ്ങൾ (സന്ധി). ലോപസന്ധി: ഒരു വർണ്ണം ലോപിക്കുന്നു — പകുത്ത് +
      എടുത്തു = പകുത്തെടുത്തു (സംവൃതോകാരം പോകുന്നു), കണ്ണീർ + ഒപ്പി. ആഗമസന്ധി: പുതിയ വർണ്ണം
      വരുന്നു — വളരെ + ഏറെ = വളരെയേറെ (യ് വരുന്നു), തിരു + ഓണം = തിരുവോണം (വ് വരുന്നു). ദ്വിത്വസന്ധി:
      വർണ്ണം ഇരട്ടിക്കുന്നു — അ + ദേഹം = അദ്ദേഹം, ഇ + കാലം = ഇക്കാലം. ആദേശസന്ധി: ഒരു വർണ്ണത്തിനു
      പകരം മറ്റൊന്ന് — കൺ + തു = കണ്ടു, നിൻ + കൾ = നിങ്ങൾ. പദപരിചയം: അത്യാഹിതം (അപകടം),
      അനാഥത്വം (നാഥനില്ലാത്ത അവസ്ഥ), ഈർഷ്യ (കോപം), ഇറമ്പ് (അരിക്), കയ്യാല (അതിരിലുള്ള വേലി,
      മതിൽ), കൊഞ്ഞനം കുത്തുക (കളിയാക്കുക), ദീനഭാവം (ദുഃഖഭാവം), മുനിഞ്ഞിരിക്കുക (മിണ്ടാതിരിക്കുക),
      മ്ലാനത (ക്ഷീണം), വിഷണ്ണനായി (ദുഃഖിതനായി), വെണ്ണീർ (ചാരം).
    explanations:
      text: "രണ്ടു വാക്കുകൾ ചേരുമ്പോൾ ചിലപ്പോൾ ഒരക്ഷരം പോകും (ലോപം), ചിലപ്പോൾ പുതിയതു വരും (ആഗമം), ചിലപ്പോൾ ഇരട്ടിക്കും (ദ്വിത്വം), ചിലപ്പോൾ മാറും (ആദേശം). ചേർത്തെഴുതിയ വാക്ക് പിരിച്ചുനോക്കിയാൽ ഏതാണെന്ന് കണ്ടെത്താം."
      visual: "നാലു പെട്ടികൾ: ലോപം (➖ പകുത്തെടുത്തു), ആഗമം (➕ വളരെയേറെ), ദ്വിത്വം (✖2 അദ്ദേഹം), ആദേശം (🔄 കണ്ടു)."
      step_by_step: "'വളരെയേറെ' പിരിക്കാം: 1. വളരെ + ഏറെ. 2. ചേർന്നപ്പോൾ നടുവിൽ 'യ്' വന്നു (വളരെ-യ്-ഏറെ). 3. പുതിയ വർണ്ണം വന്നതിനാൽ ആഗമസന്ധി."
      real_world: "'തിരുവോണം', 'അദ്ദേഹം', 'കണ്ടു' — നാം ദിവസവും പറയുന്ന വാക്കുകളിൽത്തന്നെ സന്ധികളുണ്ട്."
    items:
      - prompt: "'പകുത്ത് + എടുത്തു = പകുത്തെടുത്തു' — ഇത് ഏതു സന്ധി?"
        options: ["ലോപസന്ധി", "ആഗമസന്ധി", "ദ്വിത്വസന്ധി", "ആദേശസന്ധി"]
        answer: "ലോപസന്ധി"
        difficulty: 1
        hints: ["'പകുത്ത്' എന്നതിലെ ് പോയി."]
        solution: "ഒരു വർണ്ണം ലോപിച്ചതിനാൽ ലോപസന്ധി."
        mistakes: {"ആഗമസന്ധി": mal_sandhi}
      - prompt: "'വളരെ + ഏറെ = വളരെയേറെ' — ഇത് ഏതു സന്ധി?"
        options: ["ആഗമസന്ധി", "ലോപസന്ധി", "ദ്വിത്വസന്ധി", "ആദേശസന്ധി"]
        answer: "ആഗമസന്ധി"
        difficulty: 1
        hints: ["'യ്' എന്ന പുതിയ വർണ്ണം വന്നു."]
        solution: "പുതിയ വർണ്ണം വന്നതിനാൽ ആഗമസന്ധി."
        mistakes: {"ലോപസന്ധി": mal_sandhi}
      - prompt: "'അ + ദേഹം = അദ്ദേഹം' — ഇത് ഏതു സന്ധി?"
        options: ["ദ്വിത്വസന്ധി", "ആഗമസന്ധി", "ലോപസന്ധി", "ആദേശസന്ധി"]
        answer: "ദ്വിത്വസന്ധി"
        difficulty: 2
        hints: ["'ദ' ഇരട്ടിച്ചു."]
        solution: "വർണ്ണം ഇരട്ടിച്ചതിനാൽ ദ്വിത്വസന്ധി."
        mistakes: {"ആഗമസന്ധി": mal_sandhi}
      - prompt: "'കൺ + തു = കണ്ടു' — ഇത് ഏതു സന്ധി?"
        options: ["ആദേശസന്ധി", "ലോപസന്ധി", "ആഗമസന്ധി", "ദ്വിത്വസന്ധി"]
        answer: "ആദേശസന്ധി"
        difficulty: 3
        hints: ["'ത' യ്ക്കു പകരം 'ട' വന്നു."]
        solution: "ഒരു വർണ്ണത്തിനു പകരം മറ്റൊന്ന് വന്നതിനാൽ ആദേശസന്ധി."
        mistakes: {"ദ്വിത്വസന്ധി": mal_sandhi}
      - prompt: "'അത്യാഹിതം' എന്ന പദത്തിന്റെ അർഥം:"
        options: ["അപകടം", "ആഘോഷം", "അതിഥി", "ആഹാരം"]
        answer: "അപകടം"
        difficulty: 1
        hints: ["ആളുകൾ വെപ്രാളപ്പെട്ട് ഓടുന്നു."]
        solution: "അത്യാഹിതം = അപകടം."
        mistakes: {"ആഘോഷം": mal_word_meaning}
      - prompt: "'വിഷണ്ണനായി നോക്കിനിന്നു' — 'വിഷണ്ണൻ' എന്നാൽ:"
        options: ["ദുഃഖിതൻ", "വിഷമുള്ളവൻ", "സന്തോഷവാൻ", "കോപിഷ്ഠൻ"]
        answer: "ദുഃഖിതൻ"
        difficulty: 2
        hints: ["ചോരയൊലിപ്പിച്ചു കിടക്കുന്ന തത്തക്കുഞ്ഞിനെ കണ്ടപ്പോൾ."]
        solution: "വിഷണ്ണനായി = ദുഃഖിതനായി."
        mistakes: {"വിഷമുള്ളവൻ": mal_word_meaning}
      - prompt: "'വെണ്ണീർ' എന്നതിന്റെ അർഥം:"
        options: ["ചാരം", "വെള്ളം", "വെണ്ണ", "കണ്ണീര്"]
        answer: "ചാരം"
        difficulty: 2
        hints: ["പാത്രം കഴുകാൻ ഉപയോഗിച്ചിരുന്നത്."]
        solution: "വെണ്ണീർ = ചാരം."
        mistakes: {"വെണ്ണ": mal_word_meaning}
