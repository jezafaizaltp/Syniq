      എടുത്തു = പകുത്തെടുത്തു (സംവൃതോകാരം പോകുന്നു), കണ്ണീർ + ഒപ്പി. ആഗമസന്ധി: പുതിയ വർണ്ണം
      വരുന്നു — വളരെ + ഏറെ = വളരെയേറെ (യ് വരുന്നു), തിരു + ഓണം = തിരുവോണം (വ് വരുന്നു). ദ്വിത്വസന്ധി:
      വർണ്ണം ഇരട്ടിക്കുന്നു — അ + ദേഹം = അദ്ദേഹം, ഇ + കാലം = ഇക്കാലം. ആദേശസന്ധി: ഒരു വർണ്ണത്തിനു
      പകരം മറ്റൊന്ന് — കൺ + തു = കണ്ടു, നിൻ + കൾ = നിങ്ങൾ. പദപരിചയം: അത്യാഹിതം (അപകടം),
      അനാഥത്വം (നാഥനില്ലാത്ത അവസ്ഥ), ഈർഷ്യ (കോപം), ഇറമ്പ് (അരിക്), കയ്യാല (അതിരിലുള്ള വേലി,
      മതിൽ), കൊഞ്ഞനം കുത്തുക (കളിയാക്കുക), ദീനഭാവം (ദുഃഖഭാവം), മുനിഞ്ഞിരിക്കുക (മിണ്ടാതിരിക്കുക),
      മ്ലാനത (ക്ഷീണം), വിഷണ്ണനായി (ദുഃഖിതനായി), വെണ്ണീർ (ചാരം).
    explanations:
      text: "രണ്ടു വാക്കുകൾ ചേരുമ്പോൾ ചിലപ്പോൾ ഒരക്ഷരം പോകും (ലോപം), ചിലപ്പോൾ പുതിയതു വരും (ആഗമം), ചിലപ്പോൾ ഇരട്ടിക്കും (ദ്വിത്വം), ചിലപ്പോൾ മാറും (ആദേശം). ചേർത്തെഴുതിയ വാക്ക് പിരിച്ചുനോക്കിയാൽ ഏതാണെന്ന് കണ്ടെത്താം."
      visual: "നാലു പെട്ടികൾ: ലോപം (➖ പകുത്തെടുത്തു), ആഗമം (➕ വളരെയേറെ), ദ്വിത്വം (✖2 അദ്ദേഹം), ആദേശം (🔄 കണ്ടു)."
      step_by_step: "'വളരെയേറെ' പിരിക്കാം: 1. വളരെ + ഏറെ. 2. ചേർന്നപ്പോൾ നടുവിൽ 'യ്' വന്നു (വളരെ-യ്-ഏറെ). 3. പുതിയ വർണ്ണം വന്നതിനാൽ ആഗമസന്ധി."
      real_world: "'തിരുവോണം', 'അദ്ദേഹം', 'കണ്ടു' — നാം ദിവസവും പറയുന്ന വാക്കുകളിൽത്തന്നെ സന്ധികളുണ്ട്."
    activity:
      type: sort
      prompt: ഓരോ ചേർച്ചയിലും എന്തു സംഭവിച്ചു? വർണ്ണം പോയോ, വന്നോ, ഇരട്ടിച്ചോ, മാറിയോ?
      bins:
      - ലോപസന്ധി
      - ആഗമസന്ധി
      - ദ്വിത്വസന്ധി
      - ആദേശസന്ധി
      items:
      - label: പകുത്ത് + എടുത്തു = പകുത്തെടുത്തു
        bin: ലോപസന്ധി
        clue: '''പകുത്ത്'' എന്നതിന്റെ ഒടുവിലെ ചെറിയ ഉ എവിടെപ്പോയി?'
        why: 'സംവൃതോകാരം ലോപിച്ചു: ലോപസന്ധി.'
      - label: വളരെ + ഏറെ = വളരെയേറെ
        bin: ആഗമസന്ധി
        clue: രണ്ടു പദങ്ങൾക്കിടയിൽ പുതിയ ഒരു വർണ്ണം കാണുന്നുണ്ടോ?
        why: 'യ് വന്നുചേർന്നു: ആഗമസന്ധി.'
      - label: തിരു + ഓണം = തിരുവോണം
        bin: ആഗമസന്ധി
        clue: '''തിരു'', ''ഓണം'' എന്നിവയിൽ ഇല്ലാത്ത വർണ്ണം ഏത്?'
        why: 'വ് വന്നുചേർന്നു: ആഗമസന്ധി.'
      - label: അ + ദേഹം = അദ്ദേഹം
        bin: ദ്വിത്വസന്ധി
        clue: '''ദ'' എത്ര തവണ ഉണ്ട്?'
        why: 'ദ ഇരട്ടിച്ചു: ദ്വിത്വസന്ധി.'
      - label: ഇ + കാലം = ഇക്കാലം
        bin: ദ്വിത്വസന്ധി
        clue: '''ക'' ചേർന്നപ്പോൾ എന്തായി?'
        why: 'ക ഇരട്ടിച്ചു: ദ്വിത്വസന്ധി.'
      - label: കൺ + തു = കണ്ടു
        bin: ആദേശസന്ധി
        clue: '''ത'' എവിടെ? അതിനു പകരം എന്തു വന്നു?'
        why: 'ത-യ്ക്കു പകരം ട വന്നു: ആദേശസന്ധി.'
      - label: നിൻ + കൾ = നിങ്ങൾ
        bin: ആദേശസന്ധി
        clue: '''ക'' ചേർത്തെഴുതിയപ്പോൾ എന്തായി മാറി?'
        why: 'ക-യ്ക്കു പകരം ങ്ങ: ആദേശസന്ധി.'
    lesson:
      - teach: 'രണ്ടു പദങ്ങൾ ചേർത്തെഴുതുമ്പോൾ അവ ചേരുന്നിടത്ത് മാറ്റങ്ങൾ വരും; ഇതാണ് സന്ധി. ലോപസന്ധി: ഒരു വർണ്ണം ഇല്ലാതാകുന്നു. പകുത്ത് + എടുത്തു = പകുത്തെടുത്തു (പകുത്ത് എന്നതിന്റെ അവസാനത്തെ ഉകാരം പോയി).'
        check:
          prompt: 'ലോപസന്ധിയിൽ സംഭവിക്കുന്നത്:'
          options:
          - ഒരു വർണ്ണം ഇല്ലാതാകുന്നു
          - പുതിയ വർണ്ണം വരുന്നു
          - വർണ്ണം ഇരട്ടിക്കുന്നു
          answer: ഒരു വർണ്ണം ഇല്ലാതാകുന്നു
          why: ലോപം = ഇല്ലാതാകൽ.
      - teach: 'ആഗമസന്ധി: പുതിയ വർണ്ണം വന്നുചേരുന്നു (വളരെ + ഏറെ = വളരെയേറെ: യ്; തിരു + ഓണം = തിരുവോണം: വ്). ദ്വിത്വസന്ധി: വർണ്ണം ഇരട്ടിക്കുന്നു (അ + ദേഹം = അദ്ദേഹം; ഇ + കാലം = ഇക്കാലം). ആദേശസന്ധി: ഒരു വർണ്ണത്തിനു പകരം മറ്റൊന്ന് (കൺ + തു = കണ്ടു; നിൻ + കൾ = നിങ്ങൾ).'
        picture:
          kind: compare
          columns:
          - title: ലോപം / ആഗമം
            points:
            - പകുത്ത് + എടുത്തു → പകുത്തെടുത്തു
            - തിരു + ഓണം → തിരുവോണം
          - title: ദ്വിത്വം / ആദേശം
            points:
            - അ + ദേഹം → അദ്ദേഹം
            - കൺ + തു → കണ്ടു
          alt: നാലു സന്ധികളുടെയും ഓരോ ഉദാഹരണം.
        check:
          prompt: '''ഇ + കാലം = ഇക്കാലം'' — ഏതു സന്ധി?'
          options:
          - ദ്വിത്വസന്ധി
          - ലോപസന്ധി
          - ആദേശസന്ധി
          answer: ദ്വിത്വസന്ധി
          why: '''ക'' ഇരട്ടിച്ചു: ക്ക.'
      - teach: 'പുതിയ പദങ്ങൾ: അനാഥത്വം (നാഥനില്ലാത്ത അവസ്ഥ), ഈർഷ്യ (കോപം), ഇറമ്പ് (അരിക്), കയ്യാല (അതിരിലെ മൺവേലി), കൊഞ്ഞനം കുത്തുക (കളിയാക്കുക), ദീനഭാവം (ദുഃഖഭാവം), മുനിഞ്ഞിരിക്കുക (മിണ്ടാതിരിക്കുക), മ്ലാനത (ക്ഷീണം).'
        check:
          prompt: '''കൊഞ്ഞനം കുത്തുക'' എന്നതിന്റെ അർഥം:'
