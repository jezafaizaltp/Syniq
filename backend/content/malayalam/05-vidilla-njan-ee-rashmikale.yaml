subject: mal
chapter: 5
title: "കേരളപാഠാവലി 5: വിടില്ലഞാനീരശ്മികളെ"

tips:
  mal_parrot_story: "'തത്തക്കൂട്' (ഗ്രേസി): മക്കൾ ഓസ്ട്രേലിയയിലും കാനഡയിലുമുള്ള കുട്ടിക്കൃഷ്ണനും ഭാഗ്യലക്ഷ്മിക്കും കാക്കകൾ ആക്രമിച്ച തത്തക്കുഞ്ഞ് മകളെപ്പോലെയാകുന്നു. തുറന്നുവിട്ടിട്ടും അത് പോകുന്നില്ല."
  mal_chaplin_debut: "ചാപ്ലിൻ വളരെ ചെറുപ്പത്തിൽ, അമ്മയ്ക്ക് പാടാൻ കഴിയാതെ വന്ന രാത്രിയാണ് ആദ്യമായി സ്റ്റേജിൽ കയറിയത്. അദ്ദേഹം പാടിയ പാട്ടിന്റെ പേര് ഒരാളുടെ പേരാണ്. ആ രാത്രി ഒരേസമയം രണ്ടു വികാരങ്ങൾ ഉണർത്തുന്നു."
  mal_sweet_potato: "കുട്ടികളിൽ ചേട്ടനും അനിയത്തിയും ഉണ്ട്; അവരുടെ പ്രായം പാഠത്തിൽ നോക്കൂ. അവർക്ക് സ്ഥലം കൊടുത്തത് ഒരു നാട്ടുകാരനാണ്. രോഗം വന്നിട്ടും അവർ എന്തു ചെയ്യുന്നത് നിർത്തിയില്ല?"
  mal_sandhi: "സന്ധി: ലോപം (ഒരു വർണ്ണം ലോപിക്കുന്നു: പകുത്ത് + എടുത്തു = പകുത്തെടുത്തു), ആഗമം (പുതിയ വർണ്ണം വരുന്നു: വളരെ + ഏറെ = വളരെയേറെ), ദ്വിത്വം (വർണ്ണം ഇരട്ടിക്കുന്നു: അ + ദേഹം = അദ്ദേഹം), ആദേശം (ഒരു വർണ്ണത്തിനു പകരം മറ്റൊന്ന്: കൺ + തു = കണ്ടു)."
  mal_chaplin_coins: "കൊച്ചു ചാപ്ലിൻ കാണികളെ ചിരിപ്പിച്ചത് ഒരു നിഷ്കളങ്കമായ നിബന്ധന വെച്ചാണ്. പാട്ടിനു മുമ്പ് അവന് എന്താണ് ആദ്യം വേണ്ടിയിരുന്നത്?"
  mal_chaplin_mother: "അന്ന് അമ്മ സ്റ്റേജിൽ പാടിക്കൊണ്ടിരിക്കെ എന്താണ് പ്രശ്നമായത്? പാട്ടുകാരിക്ക് ഏറ്റവും ആവശ്യമായത് എന്താണോ, അതിനാണ് തകരാർ വന്നത്."
  m5_parrot_detail: 'കഥയിലെ ചെറിയ വിശദാംശങ്ങൾ ഓർക്കൂ: തത്തക്കുഞ്ഞിനെ കണ്ട സ്ഥലം, ചികിത്സ, പഴയ കൂട്, തത്തയുടെ വിളികൾ. ചോദ്യം ഏതിനെക്കുറിച്ചാണ്?'
  m5_parrot_feeling: തത്തയും ആ വൃദ്ധദമ്പതികളും തമ്മിലുള്ള ബന്ധം ഒരു വീട്ടിലെ അംഗങ്ങൾ തമ്മിലുള്ളതുപോലെയാണ്. ഈ ഉത്തരം ആ ഭാവത്തോട് ചേരുമോ?
  m5_chaplin_detail: 'സംഭവങ്ങളുടെ ക്രമം ഓർക്കൂ: അമ്മയുടെ ശബ്ദം ഇടറുന്നു, മാനേജർ കുട്ടിയെ വേദിയിലെത്തിക്കുന്നു, പാട്ട്, പണം, അനുകരണം. ചോദ്യം ഏതു ഭാഗത്തെക്കുറിച്ചാണ്?'
  m5_potato_people: 'കഥയിലെ ആളുകളെ വേർതിരിക്കൂ: രണ്ടു കുട്ടികൾ, മരിച്ചുപോയ അമ്മ, അവരെ പോറ്റിയ അമ്മൂമ്മ, കണ്ടം കൊടുത്ത കൃഷിക്കാരൻ. ചോദ്യം ആരെക്കുറിച്ചാണ്?'
  m5_potato_detail: 'കുട്ടികൾ എങ്ങനെയാണ് കൃഷി നടത്തിയത് എന്ന് പാഠത്തിൽ വീണ്ടും നോക്കൂ: എന്തു നട്ടു, എവിടെനിന്ന് വെള്ളം, എന്തിൽ കോരി?'
  m5_sandhi_kind: 'ചേർത്തെഴുതിയപ്പോൾ എന്തു സംഭവിച്ചു എന്നു നോക്കൂ: ഒരു വർണ്ണം പോയോ, പുതിയത് വന്നോ, ഇരട്ടിച്ചോ, അതോ മറ്റൊന്നായി മാറിയോ?'
  m5_word_meaning: പദം ഒരു വാക്യത്തിൽ വച്ചു നോക്കൂ. ഏത് അർഥം ചേർത്താലാണ് വാക്യം ശരിയാകുന്നത്?

concepts:
  - code: mal9.u5.thathakkoodu
    title: തത്തക്കൂട്
    notes: |
      ഗ്രേസിയുടെ 'പ്രണയം അഞ്ചടി ഏഴിഞ്ച്' എന്ന സമാഹാരത്തിലെ കഥ. കുട്ടിക്കൃഷ്ണനും ഭാര്യ
      ഭാഗ്യലക്ഷ്മിയും; രണ്ട് ആൺമക്കൾ ഓസ്ട്രേലിയയിലും കാനഡയിലും സ്ഥിരതാമസം; പേരക്കുട്ടികളുടെ മുഖം
      പോലും ഓർമ്മയിൽ തെളിയുന്നില്ല. അഞ്ചോ ആറോ കൊല്ലം മുമ്പ് കൊന്നത്തെങ്ങിന്റെ ചോട്ടിൽ കാക്കപ്പട
      ആക്രമിച്ച ഒരു തത്തക്കുഞ്ഞിനെ അയാൾ രക്ഷിച്ചു; പഞ്ഞിയും മഞ്ഞൾപ്പൊടിയും, ഇറ്റിച്ച വെള്ളം. പണ്ട്
      മൈനയെയും പിന്നെ അണ്ണാനെയും വളർത്തിയ പഴയ കമ്പിക്കൂട്ടിൽ അതിനെ കിടത്തി. സുഖമായപ്പോൾ
      തുറന്നുവിട്ടിട്ടും അത് പോയില്ല. തത്ത ഭാഗ്യലക്ഷ്മിയെ "പാക്യം" എന്നും അയാളെ "കുട്ടീ" എന്നും
      വിളിച്ചു; നാവു വടിക്കാൻ കരിമ്പനയോല. അയൽപക്കത്തെ കണ്ടൻപൂച്ചയോട് "അവൾ ഞങ്ങടെ മോളാ!"
      തത്ത അവരെ കളിയാക്കുകയും ('പുലി വന്നേ' കഥ), ഭാഗ്യത്തിന്റെ കണ്ണു നിറയുമ്പോൾ "പാക്യം! എനിക്കു
      വിശക്കുന്നു" എന്നു വിളിച്ച് സങ്കടം മാറ്റുകയും ചെയ്തു. നാല്പത്തിയൊന്നു കൊല്ലം കൂടെ ജീവിച്ച ഭാര്യ
      നെഞ്ചത്ത് കൈ അമർത്തി വീണുമരിച്ചപ്പോൾ അയാൾ തത്തയെ മൂന്നാമതും തുറന്നുവിടുന്നു; പക്ഷേ അത്
      അയാളുടെ തോളിൽ വന്നിരുന്ന് "കുട്ടീ! കരയല്ലേ... കരയല്ലേ..." എന്ന് ആശ്വസിപ്പിക്കുന്നു. ബന്ധപ്പെട്ടത്:
      വള്ളത്തോളിന്റെ 'കിളിക്കൊഞ്ചൽ' — "ബന്ധുര കാഞ്ചനക്കൂട്ടിലാണെങ്കിലും ബന്ധനം ബന്ധനം തന്നെ പാരിൽ".
      ഇവിടെ കൂട് ബന്ധനത്തെക്കാൾ സ്നേഹത്തിന്റെയും കരുതലിന്റെയും ഇടമാകുന്നു.
    explanations:
      text: "മക്കൾ അകലെയായ ഒരു വൃദ്ധദമ്പതികളുടെ ഏകാന്തതയിലേക്ക് ഒരു തത്ത മകളായി വരുന്നു. സ്വാതന്ത്ര്യം നൽകിയിട്ടും അത് പോകുന്നില്ല; ഒടുവിൽ ഭാര്യ മരിച്ച് ഒറ്റയ്ക്കായ കുട്ടിക്കൃഷ്ണനെ ആശ്വസിപ്പിക്കുന്നതും ആ തത്തയാണ്."
      visual: "ഒരു ചിത്രകഥ: കാക്കകൾ വളഞ്ഞ തത്തക്കുഞ്ഞ് → പഞ്ഞിയും മഞ്ഞളും → ഉമ്മറത്ത് തൂക്കിയ കൂട് → 'പാക്യം!' വിളി → തുറന്ന വാതിൽ → കുട്ടിക്കൃഷ്ണന്റെ തോളിലിരിക്കുന്ന തത്ത."
      step_by_step: "തത്ത എന്തുകൊണ്ട് പോയില്ല? 1. ചെറുപ്പം മുതൽ അവർ മകളെപ്പോലെ വളർത്തി. 2. അവരുടെ സ്നേഹം അതിനും തിരിച്ചറിയാം. 3. അതിനാൽ കൂട് അതിന് ബന്ധനമല്ല, വീടാണ്."
      real_world: "മക്കൾ വിദേശത്ത് ജോലിചെയ്യുന്ന പല കേരളീയ വീടുകളിലും പ്രായമായ മാതാപിതാക്കൾ ഒറ്റയ്ക്കാണ്. അവർക്ക് കൂട്ടും കരുതലും എങ്ങനെ നൽകാം എന്ന് ഈ കഥ ചിന്തിപ്പിക്കുന്നു."
    activity:
      type: order
      prompt: തത്ത കുട്ടിക്കൃഷ്ണന്റെ വീട്ടിലെ അംഗമായത് എങ്ങനെ? ക്രമത്തിൽ വയ്ക്കൂ.
      steps:
      - കാക്കപ്പട ആക്രമിച്ച തത്തക്കുഞ്ഞിനെ രക്ഷിക്കുന്നു
      - പഞ്ഞിയും മഞ്ഞളും വെള്ളവുമായി പഴയ കൂട്ടിൽ ശുശ്രൂഷ
      - സുഖമായപ്പോൾ തുറന്നുവിട്ടിട്ടും തത്ത പോകുന്നില്ല
      - തത്ത 'പാക്യം', 'കുട്ടീ' എന്നു വിളിക്കുന്നു
      reasons:
        പഞ്ഞിയും മഞ്ഞളും വെള്ളവുമായി പഴയ കൂട്ടിൽ ശുശ്രൂഷ: ശുശ്രൂഷിക്കാൻ ആദ്യം കുഞ്ഞിനെ കാക്കകളിൽനിന്ന് രക്ഷിക്കണം.
        സുഖമായപ്പോൾ തുറന്നുവിട്ടിട്ടും തത്ത പോകുന്നില്ല: '''സുഖമായപ്പോൾ'': ശുശ്രൂഷയ്ക്കുശേഷം.'
        തത്ത 'പാക്യം', 'കുട്ടീ' എന്നു വിളിക്കുന്നു: അവരോടൊപ്പം താമസിച്ചാണ് തത്ത അവരുടെ പേരുകൾ പഠിക്കുന്നത്.
    lesson:
      - teach: '''തത്തക്കൂട്'' ഗ്രേസിയുടെ ''പ്രണയം അഞ്ചടി ഏഴിഞ്ച്'' എന്ന സമാഹാരത്തിലെ കഥ. കുട്ടിക്കൃഷ്ണനും ഭാര്യ ഭാഗ്യലക്ഷ്മിയും തനിച്ചാണ്; രണ്ട് ആൺമക്കൾ ഓസ്ട്രേലിയയിലും കാനഡയിലും. പേരക്കുട്ടികളുടെ മുഖംപോലും ഓർമ്മയിൽ തെളിയുന്നില്ല.'
        check:
          prompt: 'കുട്ടിക്കൃഷ്ണന്റെ ഭാര്യയുടെ പേര്:'
          options:
          - ഭാഗ്യലക്ഷ്മി
          - നാരായണി
          - ശോഭ
          answer: ഭാഗ്യലക്ഷ്മി
          why: തത്ത അവരെ 'പാക്യം' എന്നു വിളിക്കും.
      - teach: 'അഞ്ചോ ആറോ കൊല്ലം മുമ്പ്, കൊന്നത്തെങ്ങിന്റെ ചോട്ടിൽ കാക്കപ്പട ആക്രമിച്ച ഒരു തത്തക്കുഞ്ഞിനെ അയാൾ രക്ഷിച്ചു: പഞ്ഞി, മഞ്ഞൾപ്പൊടി, ഇറ്റിച്ച വെള്ളം. പണ്ട് മൈനയെയും അണ്ണാനെയും വളർത്തിയ പഴയ കമ്പിക്കൂട്ടിൽ കിടത്തി. സുഖമായി തുറന്നുവിട്ടിട്ടും അത് പോയില്ല; ഭാഗ്യലക്ഷ്മിയെ ''പാക്യം'' എന്നും അയാളെ ''കുട്ടീ'' എന്നും വിളിച്ചു. ''അവൾ ഞങ്ങടെ മോളാ!'''
