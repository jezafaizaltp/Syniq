subject: mal
chapter: 5
title: "കേരളപാഠാവലി 5: വിടില്ലഞാനീരശ്മികളെ"

tips:
  mal_parrot_story: "'തത്തക്കൂട്' (ഗ്രേസി): മക്കൾ ഓസ്ട്രേലിയയിലും കാനഡയിലുമുള്ള കുട്ടിക്കൃഷ്ണനും ഭാഗ്യലക്ഷ്മിക്കും കാക്കകൾ ആക്രമിച്ച തത്തക്കുഞ്ഞ് മകളെപ്പോലെയാകുന്നു. തുറന്നുവിട്ടിട്ടും അത് പോകുന്നില്ല."
  mal_chaplin_debut: "ചാപ്ലിൻ അഞ്ചാം വയസ്സിൽ അൽഡർഷോട്ടിലെ കാന്റീൻ തിയേറ്ററിൽ അമ്മയുടെ ശബ്ദമിടറിയപ്പോൾ 'ജാക്ക് ജോൺസ്' പാടി അരങ്ങേറി: അത് മകന്റെ അരങ്ങേറ്റവും അമ്മയുടെ അരങ്ങൊഴിയലുമായി."
  mal_sweet_potato: "'മധുരക്കിഴങ്ങിന്റെ രുചി': അനാഥരായ സുജിത്തും (8) സുനിതയും (6) ചെറിയോനേട്ടന്റെ കണ്ടത്തിൽ കിഴങ്ങു നട്ടു; രോഗം വന്നിട്ടും നനയ്ക്കൽ നിർത്താത്തതിനാൽ അവർക്കുമാത്രം വലിയ വിളവ് കിട്ടി."
  mal_sandhi: "സന്ധി: ലോപം (ഒരു വർണ്ണം ലോപിക്കുന്നു: പകുത്ത് + എടുത്തു = പകുത്തെടുത്തു), ആഗമം (പുതിയ വർണ്ണം വരുന്നു: വളരെ + ഏറെ = വളരെയേറെ), ദ്വിത്വം (വർണ്ണം ഇരട്ടിക്കുന്നു: അ + ദേഹം = അദ്ദേഹം), ആദേശം (ഒരു വർണ്ണത്തിനു പകരം മറ്റൊന്ന്: കൺ + തു = കണ്ടു)."

concepts:
  - code: mal9.u5.thathakkoodu
    title: തത്തക്കൂട്
    notes: |
      ഗ്രേസിയുടെ 'പ്രണയം അഞ്ചടി ഏഴിഞ്ച്' എന്ന സമാഹാരത്തിലെ കഥ. കുട്ടിക്കൃഷ്ണനും ഭാര്യ
      ഭാഗ്യലക്ഷ്മിയും; രണ്ട് ആൺമക്കൾ ഓസ്ട്രേലിയയിലും കാനഡയിലും സ്ഥിരതാമസം; പേരക്കുട്ടികളുടെ മുഖം
      പോലും ഓർമ്മയിൽ തെളിയുന്നില്ല. അഞ്ചോ ആറോ കൊല്ലം മുമ്പ് കൊന്നത്തെങ്ങിന്റെ ചോട്ടിൽ കാക്കപ്പട
      ആക്രമിച്ച ഒരു തത്തക്കുഞ്ഞിനെ അയാൾ രക്ഷിച്ചു; പഞ്ഞിയും മഞ്ഞൾപ്പൊടിയും, ഇറ്റിച്ച വെള്ളം. പണ്ട്
      മൈനയെയും പിന്നെ അണ്ണാനെയും വളർത്തിയ പഴയ കമ്പിക്കൂട്ടിൽ അതിനെ കിടത്തി. സുഖമായപ്പോൾ
      തുറന്നുവിട്ടിട്ടും അത് പോയില്ല. തത്ത ഭാഗ്യലക്ഷ്മിയെ "പാക്യം" എന്നും അയാളെ "കുട്ടീ" എന്നും
      വിളിച്ചു; നാവു വടിക്കാൻ കരിമ്പനയോല. അയൽപക്കത്തെ കണ്ടൻപൂച്ചയോട് "അവൾ ഞങ്ങടെ മോളാ!"
      തത്ത അവരെ കളിയാക്കുകയും ('പുലി വന്നേ' കഥ), ഭാഗ്യത്തിന്റെ കണ്ണു നിറയുമ്പോൾ "പാക്യം! എനിക്കു
      വിശക്കുന്നു" എന്നു വിളിച്ച് സങ്കടം മാറ്റുകയും ചെയ്തു. നാല്പത്തിയൊന്നു കൊല്ലം കൂടെ ജീവിച്ച ഭാര്യ
      നെഞ്ചത്ത് കൈ അമർത്തി വീണുമരിച്ചപ്പോൾ അയാൾ തത്തയെ മൂന്നാമതും തുറന്നുവിടുന്നു; പക്ഷേ അത്
      അയാളുടെ തോളിൽ വന്നിരുന്ന് "കുട്ടീ! കരയല്ലേ... കരയല്ലേ..." എന്ന് ആശ്വസിപ്പിക്കുന്നു. ബന്ധപ്പെട്ടത്:
      വള്ളത്തോളിന്റെ 'കിളിക്കൊഞ്ചൽ' — "ബന്ധുര കാഞ്ചനക്കൂട്ടിലാണെങ്കിലും ബന്ധനം ബന്ധനം തന്നെ പാരിൽ".
      ഇവിടെ കൂട് ബന്ധനത്തെക്കാൾ സ്നേഹത്തിന്റെയും കരുതലിന്റെയും ഇടമാകുന്നു.
    explanations:
      text: "മക്കൾ അകലെയായ ഒരു വൃദ്ധദമ്പതികളുടെ ഏകാന്തതയിലേക്ക് ഒരു തത്ത മകളായി വരുന്നു. സ്വാതന്ത്ര്യം നൽകിയിട്ടും അത് പോകുന്നില്ല; ഒടുവിൽ ഭാര്യ മരിച്ച് ഒറ്റയ്ക്കായ കുട്ടിക്കൃഷ്ണനെ ആശ്വസിപ്പിക്കുന്നതും ആ തത്തയാണ്."
      visual: "ഒരു ചിത്രകഥ: കാക്കകൾ വളഞ്ഞ തത്തക്കുഞ്ഞ് → പഞ്ഞിയും മഞ്ഞളും → ഉമ്മറത്ത് തൂക്കിയ കൂട് → 'പാക്യം!' വിളി → തുറന്ന വാതിൽ → കുട്ടിക്കൃഷ്ണന്റെ തോളിലിരിക്കുന്ന തത്ത."
      step_by_step: "തത്ത എന്തുകൊണ്ട് പോയില്ല? 1. ചെറുപ്പം മുതൽ അവർ മകളെപ്പോലെ വളർത്തി. 2. അവരുടെ സ്നേഹം അതിനും തിരിച്ചറിയാം. 3. അതിനാൽ കൂട് അതിന് ബന്ധനമല്ല, വീടാണ്."
      real_world: "മക്കൾ വിദേശത്ത് ജോലിചെയ്യുന്ന പല കേരളീയ വീടുകളിലും പ്രായമായ മാതാപിതാക്കൾ ഒറ്റയ്ക്കാണ്. അവർക്ക് കൂട്ടും കരുതലും എങ്ങനെ നൽകാം എന്ന് ഈ കഥ ചിന്തിപ്പിക്കുന്നു."
    items:
      - prompt: "'തത്തക്കൂട്' എന്ന കഥ എഴുതിയതാര്?"
        options: ["ഗ്രേസി", "മാധവിക്കുട്ടി", "ഖദീജാ മുംതാസ്", "വിജയരാജമല്ലിക"]
        answer: "ഗ്രേസി"
        difficulty: 1
        hints: ["'പ്രണയം അഞ്ചടി ഏഴിഞ്ച്' എന്ന സമാഹാരം."]
        solution: "ഗ്രേസി."
        mistakes: {"മാധവിക്കുട്ടി": mal_author_work}
      - prompt: "തത്തക്കുഞ്ഞിനെ ആക്രമിച്ചത് ആരാണ്?"
        options: ["കാക്കക്കൂട്ടം", "കണ്ടൻപൂച്ച", "ഒരു പാമ്പ്", "പരുന്ത്"]
        answer: "കാക്കക്കൂട്ടം"
        difficulty: 1
        hints: ["കൊന്നത്തെങ്ങിന്റെ ചോട്ടിൽ കലമ്പൽ."]
        solution: "കാക്കപ്പട വളഞ്ഞ് ആക്രമിച്ചു."
        mistakes: {"കണ്ടൻപൂച്ച": mal_parrot_story}
      - prompt: "തത്ത ഭാഗ്യലക്ഷ്മിയെ വിളിച്ചിരുന്നത് എങ്ങനെ?"
        options: ["പാക്യം", "അമ്മ", "കുട്ടീ", "ലക്ഷ്മി"]
        answer: "പാക്യം"
        difficulty: 1
        hints: ["'ഭാഗ്യം' എന്നു വിളിക്കാൻ നാവു വഴങ്ങിയില്ല."]
        solution: "'പാക്യം!' എന്നാണ് വിളിച്ചത്; 'കുട്ടീ' എന്നത് കുട്ടിക്കൃഷ്ണനെ."
        mistakes: {"കുട്ടീ": mal_parrot_story}
      - prompt: "കുട്ടിക്കൃഷ്ണനും ഭാഗ്യലക്ഷ്മിയും എത്ര കൊല്ലം ഒന്നിച്ചു ജീവിച്ചു?"
        answer: "41"
        check: "41"
        difficulty: 2
        hints: ["'നാല്പത്തിയൊന്നുകൊല്ലം കൂടെ ജീവിച്ച ഭാര്യ'."]
        solution: "നാല്പത്തിയൊന്ന് (41) കൊല്ലം."
        mistakes: {"14": mal_read_again}
      - prompt: "ഇരുവരുടെയും ആൺമക്കൾ എവിടെയാണ് സ്ഥിരതാമസം?"
        options: ["ഓസ്ട്രേലിയയിലും കാനഡയിലും", "ഗൾഫിലും അമേരിക്കയിലും", "ബാംഗ്ലൂരിലും ചെന്നൈയിലും", "അതേ നാട്ടിൽ"]
        answer: "ഓസ്ട്രേലിയയിലും കാനഡയിലും"
        difficulty: 2
        hints: ["വളരെ ദൂരെ."]
        solution: "ഒരാൾ ഓസ്ട്രേലിയയിലും മറ്റേയാൾ കാനഡയിലും."
        mistakes: {"അതേ നാട്ടിൽ": mal_parrot_story}
      - prompt: "കഥയുടെ ഒടുവിൽ, ഭാര്യ മരിച്ചശേഷം കൂടു തുറന്നപ്പോൾ തത്ത എന്തു ചെയ്തു?"
        options: ["കുട്ടിക്കൃഷ്ണന്റെ തോളിൽ വന്നിരുന്ന് 'കുട്ടീ! കരയല്ലേ' എന്ന് ആശ്വസിപ്പിച്ചു", "പറന്നുപോയി", "കൂട്ടിൽത്തന്നെ മിണ്ടാതിരുന്നു", "പൂച്ചയെ ഓടിച്ചു"]
        answer: "കുട്ടിക്കൃഷ്ണന്റെ തോളിൽ വന്നിരുന്ന് 'കുട്ടീ! കരയല്ലേ' എന്ന് ആശ്വസിപ്പിച്ചു"
        difficulty: 2
        hints: ["കഥയുടെ അവസാനവാക്യം."]
        solution: "തത്ത അയാളെ ആശ്വസിപ്പിച്ചു."
        mistakes: {"പറന്നുപോയി": mal_read_again}
      - prompt: "'ബന്ധുര കാഞ്ചനക്കൂട്ടിലാണെങ്കിലും ബന്ധനം ബന്ധനം തന്നെ പാരിൽ' (വള്ളത്തോൾ). ഈ കഥയിൽ കൂട് എന്തിന്റെ ഇടമായാണ് മാറുന്നത്?"
        options: ["സ്നേഹത്തിന്റെയും കരുതലിന്റെയും", "ശിക്ഷയുടെ", "ഭയത്തിന്റെ", "കച്ചവടത്തിന്റെ"]
        answer: "സ്നേഹത്തിന്റെയും കരുതലിന്റെയും"
        difficulty: 3
        hints: ["തുറന്നിട്ടും തത്ത പോകുന്നില്ല."]
        solution: "ഇവിടെ കൂട് ബന്ധനമല്ല; സ്നേഹബന്ധത്തിന്റെ വീടാണ്."
        mistakes: {"ശിക്ഷയുടെ": mal_parrot_story}

  - code: mal9.u5.chiriyude_arangettam
    title: ചിരിയുടെ അരങ്ങേറ്റം
    after: [mal9.u5.thathakkoodu]
    notes: |
      ചാർളി ചാപ്ലിന്റെ 'എന്റെ ആത്മകഥ'യിൽനിന്ന് (വിവർത്തനം: സ്മിത മീനാക്ഷി). ചാപ്ലിൻ ജനിച്ച് ഒരു
      വർഷത്തിനുശേഷം മാതാപിതാക്കൾ പിരിഞ്ഞു (മദ്യപാനം ഒരു കാരണം). ആഴ്ചയിൽ ഇരുപത്തിയഞ്ചു പൗണ്ട്
      വരുമാനമുള്ള നടിയായിരുന്നു അമ്മ; ജീവനാംശം ചോദിച്ചില്ല. അമ്മയ്ക്ക് ശബ്ദതടസ്സം വന്നു; പാടുമ്പോൾ
      ശബ്ദമിടറി, കാണികൾ കൂവി. അൽഡർഷോട്ടിലെ കാന്റീൻ തിയേറ്ററിൽ (കാണികൾ കൂടുതലും വഴക്കാളികളായ
      സൈനികർ) ഒരു ദിവസം അമ്മയ്ക്ക് വേദി വിടേണ്ടിവന്നു. ചാപ്ലിൻ പാടുന്നതു കണ്ടിട്ടുള്ള മാനേജർ
      അഞ്ചുവയസ്സുകാരനെ വേദിയിലെത്തിച്ചു. 'ജാക്ക് ജോൺസ്' എന്ന പാട്ട് പാടി; പണം വന്നുവീണപ്പോൾ
      പാട്ടുനിർത്തി, പെറുക്കിയെടുത്തിട്ടേ പാടൂ എന്നു പറഞ്ഞു; സ്റ്റേജ് മാനേജർ തൂവാലയുമായി വന്നു; പണം
      അയാൾ എടുക്കുമോ എന്ന സംശയത്തിൽ പിന്നാലെ പോയി, അമ്മയെ ഏൽപ്പിച്ചശേഷമേ മടങ്ങിയുള്ളൂ. നൃത്തം,
      അനുകരണങ്ങൾ; അമ്മയുടെ ഐറിഷ് മാർച്ച് ഗാനത്തിലെ ശബ്ദമിടർച്ച നിഷ്കളങ്കമായി അനുകരിച്ചു. "അതായിരുന്നു
      എന്റെ അരങ്ങേറ്റം; അമ്മയുടെ അരങ്ങൊഴിയലും." ബന്ധപ്പെട്ടവ: 'ദി കിഡ്', 'മോഡേൺ ടൈംസ്'.
    explanations:
      text: "ദാരിദ്ര്യവും അരക്ഷിതത്വവും നിറഞ്ഞ ബാല്യത്തിൽ, അമ്മയുടെ ശബ്ദം നഷ്ടപ്പെട്ട രാത്രിയിലാണ് ലോകത്തെ ചിരിപ്പിച്ച ചാപ്ലിന്റെ അരങ്ങേറ്റം. ഒരേ നിമിഷം മകന്റെ തുടക്കവും അമ്മയുടെ അവസാനവും — ചിരിക്കു പിന്നിലെ കണ്ണീരാണ് ഈ ഭാഗം."
      visual: "വേദിയുടെ ചിത്രം: അരങ്ങുവിളക്കുകൾക്കു മുന്നിൽ ഒരു കൊച്ചുകുട്ടി, നിലത്ത് നാണയങ്ങൾ, തൂവാലയുമായി സ്റ്റേജ് മാനേജർ, വശത്ത് വിഷമിച്ചുനിൽക്കുന്ന അമ്മ."
      step_by_step: "'എന്റെ അരങ്ങേറ്റം; അമ്മയുടെ അരങ്ങൊഴിയലും' — 1. അരങ്ങേറ്റം = ആദ്യമായി വേദിയിൽ. 2. അരങ്ങൊഴിയൽ = വേദി വിടൽ. 3. ആ രാത്രി ചാപ്ലിൻ തുടങ്ങി, അമ്മ പിന്നീട് അഭിനയിച്ചില്ല."
      real_world: "'പ്രതിസന്ധികളുണ്ടാവുമ്പോഴാണ് പ്രതിഭ മാറ്റുരയ്ക്കപ്പെടുന്നത്' — കഷ്ടപ്പാടിൽനിന്ന് ഉയർന്നുവന്ന കലാകാരന്മാരുടെ കഥകൾ നമുക്കു ചുറ്റിലുമുണ്ട്."
    items:
      - prompt: "'ചിരിയുടെ അരങ്ങേറ്റം' ആരുടെ ആത്മകഥയിൽനിന്നുള്ളതാണ്?"
        options: ["ചാർളി ചാപ്ലിൻ", "സ്മിത മീനാക്ഷി", "ബഷീർ", "ഗ്രേസി"]
        answer: "ചാർളി ചാപ്ലിൻ"
        difficulty: 1
        hints: ["സ്മിത മീനാക്ഷി വിവർത്തനം ചെയ്തു."]
        solution: "ചാർളി ചാപ്ലിന്റെ 'എന്റെ ആത്മകഥ'."
        mistakes: {"സ്മിത മീനാക്ഷി": mal_author_work}
      - prompt: "എത്രാം വയസ്സിലാണ് ചാപ്ലിൻ ആദ്യമായി വേദിയിൽ പാടിയത്?"
        answer: "5"
        check: "5"
        difficulty: 1
        hints: ["'...ാം വയസ്സിൽ ഞാനെന്റെ അരങ്ങിലെ ആദ്യപ്രകടനം നടത്തി'."]
        solution: "അഞ്ചാം വയസ്സിൽ."
        mistakes: {"15": mal_chaplin_debut}
      - prompt: "ചാപ്ലിന്റെ അമ്മയുടെ നാടകജീവിതം നിലച്ചുപോയതിന് പ്രധാന കാരണം:"
        options: ["ശബ്ദതടസ്സം", "പണക്കൂടുതൽ", "പുതിയ ജോലി കിട്ടിയത്", "വിദേശയാത്ര"]
        answer: "ശബ്ദതടസ്സം"
        difficulty: 1
        hints: ["പാടുമ്പോൾ ശബ്ദമിടറി."]
        solution: "ശബ്ദതടസ്സം കാരണം കാണികൾ കൂവി; അഭിനയം നിലച്ചു."
      - prompt: "ചാപ്ലിൻ അന്ന് പാടിയ പാട്ടിന്റെ പേര്:"
        options: ["ജാക്ക് ജോൺസ്", "ലെറ്റ് ഇറ്റ് ഗോ", "വന്ദേമാതരം", "ഐറിഷ് മാർച്ച്"]
        answer: "ജാക്ക് ജോൺസ്"
        difficulty: 2
        hints: ["പ്രശസ്തമായ ഒരു ഗാനം; ഐറിഷ് മാർച്ച് പിന്നീട് അനുകരിച്ചതാണ്."]
        solution: "'ജാക്ക് ജോൺസ്'."
        mistakes: {"ഐറിഷ് മാർച്ച്": mal_chaplin_debut}
      - prompt: "സ്റ്റേജിലേക്ക് പണം വന്നുവീണപ്പോൾ ചാപ്ലിൻ എന്തു ചെയ്തു?"
        options: ["പാട്ടു നിർത്തി, പണം പെറുക്കിയെടുത്തിട്ടേ പാടൂ എന്നു പറഞ്ഞു", "പണം കാണികൾക്കുതന്നെ എറിഞ്ഞുകൊടുത്തു", "ഓടി അകത്തേക്കു പോയി", "ശ്രദ്ധിക്കാതെ പാടിക്കൊണ്ടിരുന്നു"]
        answer: "പാട്ടു നിർത്തി, പണം പെറുക്കിയെടുത്തിട്ടേ പാടൂ എന്നു പറഞ്ഞു"
        difficulty: 2
        hints: ["അത് സദസ്സിൽ ചിരി പടർത്തി."]
        solution: "പാട്ടു നിർത്തി പണം പെറുക്കിയെടുക്കുമെന്നു പറഞ്ഞു."
      - prompt: "അൽഡർഷോട്ടിലെ കാന്റീൻ തിയേറ്ററിലെ കാണികൾ കൂടുതലും ആരായിരുന്നു?"
        options: ["വഴക്കാളികളായ സൈനികർ", "കുട്ടികൾ", "അധ്യാപകർ", "നാടകനടന്മാർ"]
        answer: "വഴക്കാളികളായ സൈനികർ"
        difficulty: 2
        hints: ["പരിഹസിക്കാൻ ചെറിയ കാരണം മതി."]
        solution: "കാണികൾ കൂടുതലും സൈനികരായിരുന്നു."
        mistakes: {"കുട്ടികൾ": mal_read_again}
      - prompt: "'അതായിരുന്നു എന്റെ അരങ്ങേറ്റം; അമ്മയുടെ അരങ്ങൊഴിയലും' — ഈ വാക്യത്തിലെ ഭാവം:"
        options: ["സന്തോഷവും സങ്കടവും ഒന്നിച്ച്", "ശുദ്ധമായ സന്തോഷം മാത്രം", "ദേഷ്യം", "ഭയം"]
        answer: "സന്തോഷവും സങ്കടവും ഒന്നിച്ച്"
        difficulty: 3
        hints: ["മകന്റെ തുടക്കം, അമ്മയുടെ അവസാനം."]
        solution: "ഒരേ രാത്രി മകന്റെ വിജയവും അമ്മയുടെ നഷ്ടവും: സമ്മിശ്രഭാവം."
        mistakes: {"ശുദ്ധമായ സന്തോഷം മാത്രം": mal_chaplin_debut}

  - code: mal9.u5.madhurakkizhangu
    title: മധുരക്കിഴങ്ങിന്റെ രുചി
    after: [mal9.u5.chiriyude_arangettam]
    notes: |
      സന്തോഷ് ഏച്ചിക്കാനത്തിന്റെ 'പകൽസ്വപ്നത്തിൽ വെയിലുകായാൻ വന്ന ഒരു നരി' എന്ന കൃതിയിലെ
      അനുഭവക്കുറിപ്പ്. ബേഡഡുക്കയിലെ അമ്മവീട്ടിലെത്തിയ എഴുത്തുകാരൻ വയലിലേക്ക് ഓടുന്ന ആളുകളെ
      കാണുന്നു. പ്രായമുള്ള കൃഷിക്കാരനും കന്നുകാലിചികിത്സകനുമായ ചെറിയോനേട്ടൻ കഥ പറയുന്നു.
      സുജിത്ത് (8), സുനിത (6): അമ്മ നാരായണി മരിച്ചു; അമ്മൂമ്മ ചോയിച്ചി (75) അടുത്ത വീടുകളിൽ പാത്രം
      കഴുകി അവരെ പോറ്റി; മുതുമുത്തശ്ശി കുഞ്ഞമ്മ നേരത്തേ മരിച്ചു; പിന്നെ ചോയിച്ചിയും. ഇടിവെട്ടിയാൽ
      കൂൺ മുളയ്ക്കുമെന്ന അറിവ്; തവര പൊട്ടിച്ച് ഉപ്പിട്ട് തിന്നു. സുജിത്ത് കൈക്കോട്ട് പൊക്കിക്കാണിച്ചപ്പോൾ
      ചെറിയോനേട്ടൻ "ആ കണ്ടം നീയെടുത്തോടാ" എന്നു പറഞ്ഞു. മറ്റുള്ളവർ ഉപേക്ഷിച്ച വള്ളികൾ നട്ടു;
      ചെറിയോനേട്ടൻ നൽകിയ രണ്ടു മൺകുടങ്ങളിൽ തോട്ടിൽനിന്ന് വെള്ളമെടുത്തു ("ഒരുറുമ്പ് അരിമണി
      കൊണ്ടുപോകുംപോലെ"). രോഗംകൊണ്ട് വള്ളികൾക്ക് മഞ്ഞനിറം; കൃഷിക്കാർ നനയ്ക്കലും വളമിടലും നിർത്തി;
      കുട്ടികൾ നനയ്ക്കൽ തുടർന്നു. വിളവെടുപ്പിൽ മറ്റുള്ളവർക്ക് മുരടിച്ച വേരുകൾ; കുട്ടികളുടെ കണ്ടത്തിൽ
      "ചുവന്ന ശംഖുപോലെ" കൂറ്റൻ കിഴങ്ങുകൾ. "മധുരക്കിഴങ്ങുചാക്കുകൾക്കിടയിൽ രണ്ട്
      കുഞ്ഞുകിഴങ്ങുകളെപ്പോലെ സുജിത്തും സുനിതയും." കിഴങ്ങ് ആത്മവിശ്വാസത്തിന്റെ പ്രതീകം.
    explanations:
      text: "എല്ലാം നഷ്ടപ്പെട്ട രണ്ടു കുഞ്ഞുങ്ങൾ, എല്ലാവരും ഉപേക്ഷിച്ചിട്ടും പ്രതീക്ഷ കൈവിടാതെ അധ്വാനിച്ചു. അവരുടെ ആത്മവിശ്വാസത്തിൽനിന്ന് വെള്ളവും വളവും വലിച്ചെടുത്തതുപോലെ അവരുടെ കിഴങ്ങുകൾ വിളഞ്ഞു."
      visual: "വയലിന്റെ ചിത്രം: മഞ്ഞനിറം പടർന്ന വള്ളികൾ, മുരടിച്ച വേരുകൾ വലിച്ചെറിയുന്ന കൃഷിക്കാർ, ഒരറ്റത്ത് മൺകുടവുമായി രണ്ടു കുട്ടികൾ, അവരുടെ കണ്ടത്തിൽ ചുവന്ന ശംഖുപോലുള്ള കിഴങ്ങുകൾ."
      step_by_step: "എന്തുകൊണ്ട് കുട്ടികൾക്കുമാത്രം വിളവ് കിട്ടി? 1. രോഗം വന്നപ്പോൾ മറ്റുള്ളവർ നനയ്ക്കലും വളമിടലും നിർത്തി. 2. കുട്ടികൾ ഒന്നും ആലോചിക്കാതെ നനയ്ക്കൽ തുടർന്നു. 3. പരിചരണം തുടർന്ന അവരുടെ ചെടികൾ വിളഞ്ഞു."
      real_world: "പരീക്ഷയിലോ കളിയിലോ തോൽവി മുന്നിൽ കണ്ടാലും ശ്രമം തുടരുന്നവരാണ് പലപ്പോഴും വിജയിക്കുന്നത്. നിങ്ങളുടെ നാട്ടിൽ പ്രതിസന്ധി മറികടന്ന ഒരാളെ പരിചയപ്പെടുത്തൂ."
    items:
      - prompt: "'മധുരക്കിഴങ്ങിന്റെ രുചി' എഴുതിയതാര്?"
        options: ["സന്തോഷ് ഏച്ചിക്കാനം", "ഗ്രേസി", "എം. ആർ. രേണുകുമാർ", "ഖദീജാ മുംതാസ്"]
