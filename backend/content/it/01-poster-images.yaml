# Class 9 Information and Communications Technology, chapter 1. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 1 text supplied by the school. Software: GIMP.
subject: it
chapter: 1
title: Poster Images

tips:
  gimp_basics: "GIMP (GNU Image Manipulation Program) is free image editing software. A new canvas is made with File → New, giving width and height in pixels. A pixel (picture element) is the smallest unit of a digital image."
  gimp_layers: "Put each poster element on its own layer so it can be moved and edited later. If an image is pasted straight onto the background layer, moving it moves the background too. Use Edit → Paste as → New Layer."
  gimp_selection: "Selection tools: Rectangle Select (R), Ellipse Select (E), Free Select (F), Fuzzy Select (U, picks similar colours using a Threshold), Paths tool (B, click around an outline, then Select → From Path)."
  gimp_tools: "Move tool changes position, Scale tool changes size, Bucket Fill (Shift+B) and Gradient (G) add colour, Text tool adds words, Crop cuts part of an image, Flip changes direction."
  gimp_files: "GIMP saves its project file as .xcf, which keeps layers and transparency. To use the poster elsewhere, File → Export as PNG, JPEG or TIFF."
  rgba: "RGBA: red, green and blue make the colours; the alpha channel controls transparency. A background can be deleted to transparent only if the layer has an alpha channel (Layer → Add Alpha Channel)."

concepts:
  - code: it9.poster.canvas_layers
    title: GIMP canvas, pixels and layers
    notes: |
      Image editing is improving or changing an image with software: improving quality, removing
      unwanted parts, adding new ones. A good poster arranges text, images and background well. GIMP (GNU
      Image Manipulation Program), like Krita, is used for graphic design. It was first called the General
      Image Manipulation Program, created by Spencer Kimball and Peter Mattis, students at the University
      of California; it joined the GNU Project and was renamed. Its mascot Wilber was created by Tuomas
      Kuosmanen on 25 September 1997. Create a canvas: File → New, enter width and height (e.g. 600 × 400
      pixels), OK. A pixel (picture element) is the basic unit of a digital image; more pixels, better
      quality. Main window: toolbox, canvas, layers window. Layers are transparent sheets on top of an
      image; each element on its own layer can be edited separately. A new canvas has a Background layer.
      Right-click a tool to see others in its group. Colour the background with Bucket Fill, Paintbrush or
      Gradient (G): pick foreground and background colours, drag across the canvas.
    explanations:
      text: "In GIMP you start with a blank canvas measured in pixels. Every part of the poster goes on its own layer, like clear sheets stacked on top of each other."
      visual: "Imagine a stack of transparent plastic sheets: the bottom one is coloured (background), one has fruits, one has a bottle, one has words. You can slide any sheet without disturbing the others."
      step_by_step: "To start a poster: Step 1: File → New. Step 2: type width 600 and height 400 pixels, OK. Step 3: choose the Gradient tool (G). Step 4: pick two colours and drag from top to bottom on the canvas."
      real_world: "Shop banners and school notices you see are made the same way, with photos, shapes and text on separate layers."
    items:
      - prompt: "What does GIMP stand for?"
        options: ["GNU Image Manipulation Program", "Graphic Image Making Program", "General Internet Media Program", "Great Image Movement Program"]
        answer: "GNU Image Manipulation Program"
        difficulty: 1
        hints: ["It is part of the GNU Project."]
        solution: "GNU Image Manipulation Program."
        mistakes: {"Graphic Image Making Program": gimp_basics}
      - prompt: "The basic unit of a digital image is a"
        options: ["Pixel", "Layer", "Canvas", "Byte"]
        answer: "Pixel"
        difficulty: 1
        hints: ["It is short for picture element."]
        solution: "A pixel."
        mistakes: {"Layer": gimp_basics}
      - prompt: "Which menu option creates a new canvas in GIMP?"
        options: ["File → New", "Edit → Copy", "Colours → Brightness-Contrast", "Filters → Blur"]
        answer: "File → New"
        difficulty: 1
        hints: ["It is in the File menu."]
        solution: "File → New, then enter width and height."
        mistakes: {"Edit → Copy": gimp_basics}
      - prompt: "Why should each poster element be placed on a separate layer?"
        options: ["So each part can be edited separately at any time", "So the file becomes smaller", "So the colours are brighter", "So it prints faster"]
        answer: "So each part can be edited separately at any time"
        difficulty: 1
        hints: ["Layers are like transparent sheets."]
        solution: "Separate layers let you move or change one part without affecting others."
        mistakes: {"So the file becomes smaller": gimp_layers}
      - prompt: "A canvas is 600 pixels wide and 400 pixels high. How many pixels does it have in total?"
        answer: "240000"
        check: "600 * 400"
        difficulty: 2
        hints: ["Multiply width by height."]
        solution: "600 × 400 = 240,000 pixels."
        mistakes: {"1000": gimp_basics}
      - prompt: "Which tool blends two colours to make a background like Figure 1.5?"
        options: ["Gradient", "Move", "Scale", "Fuzzy Select"]
        answer: "Gradient"
        difficulty: 2
        hints: ["Its shortcut key is G."]
        solution: "The Gradient tool."
        mistakes: {"Move": gimp_tools}
      - prompt: "Who created Wilber, the official symbol of GIMP?"
        options: ["Tuomas Kuosmanen", "Spencer Kimball", "Peter Mattis", "Richard Stallman"]
        answer: "Tuomas Kuosmanen"
        difficulty: 2
        hints: ["A Finnish citizen, in 1997."]
        solution: "Tuomas Kuosmanen, on 25 September 1997."
        mistakes: {"Spencer Kimball": gimp_basics}
      - prompt: "When you move an image with the Move tool, the background moves too. What is the likely reason?"
        options: ["The image was pasted into the background layer", "The Move tool is broken", "The image format is not supported", "The canvas is too small"]
        answer: "The image was pasted into the background layer"
        difficulty: 3
        hints: ["It should have been pasted as a new layer."]
        solution: "Pasted onto the background layer, the image is part of it. Use Edit → Paste as → New Layer."
        mistakes: {"The Move tool is broken": gimp_layers}

  - code: it9.poster.selection
    title: Selecting and placing images
    after: [it9.poster.canvas_layers]
    notes: |
      Open an image with File → Open. Selection tools select all or part of an image: Rectangle Select
      (R), Ellipse Select (E), Free Select (F), Fuzzy Select (U). Fuzzy Select picks an area of similar
      colour, controlled by Threshold in Tool Options; click the background colour, press Delete, then
      Select → None. Removing the background to transparency needs an alpha channel; for an RGB-only image
      right-click the layer → Add Alpha Channel. RGBA: red, green, blue plus alpha (transparency); view in
      Windows → Dockable Dialogs → Channels. To add to the poster: select, Edit → Copy, then in the canvas
      window Edit → Paste as → New Layer; double-click the layer to rename it. Scale tool changes size (unlink
      the chain to change width and height separately); Move tool changes position. Transform tools change
      size, shape and proportion. Colours → Brightness-Contrast improves an image. Paths tool (B): click
      along edges, Ctrl+click at the start point, then Select → From Path. Duplicate Layer (right-click)
      copies an element, e.g. a second bottle. Crop tool cuts part of an image.
    explanations:
      text: "To use part of a photo, select it, copy it and paste it as a new layer. Fuzzy Select grabs areas of similar colour; the Paths tool lets you trace around an object."
      visual: "Fuzzy Select is like a magic wand: click the white table behind the fruits and all the white is selected at once. Press Delete and only the fruits remain."
      step_by_step: "To cut out a bottle: Step 1: open Bottle.png. Step 2: choose the Paths tool (B) and click around its edge. Step 3: Ctrl+click at the start point. Step 4: Select → From Path. Step 5: Copy, then Paste as New Layer on the poster. Step 6: Scale and Move it."
      real_world: "Online shops remove the background of product photos so items look clean on a white or coloured page."
    items:
      - prompt: "Which tool selects an area of similar colour with one click?"
        options: ["Fuzzy Select", "Rectangle Select", "Move", "Text"]
        answer: "Fuzzy Select"
        difficulty: 1
        hints: ["Its shortcut key is U."]
        solution: "Fuzzy Select."
        mistakes: {"Rectangle Select": gimp_selection}
      - prompt: "What is the shortcut key for Rectangle Select in GIMP?"
        options: ["R", "U", "B", "G"]
        answer: "R"
        difficulty: 1
        hints: ["It is the first letter of the tool's name."]
        solution: "R."
        mistakes: {"U": gimp_selection}
      - prompt: "Which tool changes the size of an image layer?"
        options: ["Scale", "Move", "Bucket Fill", "Fuzzy Select"]
        answer: "Scale"
        difficulty: 1
        hints: ["Enter the new width and height."]
        solution: "The Scale tool."
        mistakes: {"Move": gimp_tools}
      - prompt: "In RGBA, what does the A (alpha channel) control?"
        options: ["Transparency", "Brightness", "Size", "Sharpness"]
        answer: "Transparency"
        difficulty: 2
        hints: ["Without it, a deleted background cannot become see-through."]
        solution: "The alpha channel controls transparency or opacity."
        mistakes: {"Brightness": rgba}
      - prompt: "Which option pastes a copied image onto a new layer?"
        options: ["Edit → Paste as → New Layer", "File → New", "Select → None", "File → Export"]
        answer: "Edit → Paste as → New Layer"
        difficulty: 2
        hints: ["It is in the Edit menu."]
        solution: "Edit → Paste as → New Layer."
        mistakes: {"File → New": gimp_layers}
      - prompt: "In Fuzzy Select, what does the Threshold value decide?"
        options: ["How much of the similar colours is included in the selection", "The size of the canvas", "The font size", "The file format"]
        answer: "How much of the similar colours is included in the selection"
        difficulty: 2
        hints: ["It is in Tool Options."]
        solution: "Threshold sets how close a colour must be to be selected."
        mistakes: {"The size of the canvas": gimp_selection}
      - prompt: "After tracing around an object with the Paths tool, how do you turn it into a selection?"
        options: ["Select → From Path", "Select → None", "Edit → Copy", "Filters → Blur"]
        answer: "Select → From Path"
        difficulty: 2
        hints: ["Ctrl+click at the starting point first."]
        solution: "Select → From Path."
        mistakes: {"Select → None": gimp_selection}
      - prompt: "You need two identical bottles on the poster. What is the quickest way?"
        options: ["Right-click the bottle layer and choose Duplicate Layer", "Draw the second bottle by hand", "Open a new canvas", "Export the poster twice"]
        answer: "Right-click the bottle layer and choose Duplicate Layer"
        difficulty: 3
        hints: ["Copy the layer you already have."]
        solution: "Duplicate Layer, then move the copy."
        mistakes: {"Open a new canvas": gimp_layers}

  - code: it9.poster.text_export
    title: Text, shadows, shapes and exporting
    after: [it9.poster.selection]
    notes: |
      Text tool: set font size, colour and style in Tool Options, click the canvas and type. Shadow for
      letters: duplicate the text layer, colour the copy black, lower it behind the original (Raise/Lower
      this layer in the Layers palette), apply Filters → Blur → Gaussian Blur, then shift it with the Move
      tool. One-click shadow: Filters → Light and Shadow → Drop Shadow, entering X, Y, blur and radius.
      Shapes: drag with Rectangle Select or Ellipse Select on a new layer, choose colours, fill with Bucket
      Fill (Shift+B) or Gradient (G). Flip tool changes direction. Save the project with File → Save; GIMP's
      project format is .xcf, which keeps layers and transparency. To use the poster elsewhere: File →
      Export, choose folder, name, file type (PNG, JPEG, TIFF), Export. Image editing jobs: graphic design
      for posters, brochures, websites, visual effects in games and films, social media and e-commerce.
    explanations:
      text: "Add words with the Text tool and make them stand out with a shadow. Save your work as .xcf to keep layers, and export it as JPG or PNG to use it anywhere else."
      visual: "A text shadow is just a blurred black copy of the words, placed slightly behind and to one side of the real words."
      step_by_step: "To finish and share: Step 1: File → Save (makes poster.xcf). Step 2: File → Export. Step 3: pick a folder and name. Step 4: choose JPEG image as the file type. Step 5: Export."
      real_world: "A photo you share on WhatsApp is a JPG or PNG; a designer keeps the .xcf so they can change the poster later."
    items:
      - prompt: "What is the project file format of GIMP?"
        options: ["XCF", "PDF", "JPG", "PNG"]
        answer: "XCF"
        difficulty: 1
        hints: ["It keeps layers for later editing."]
        solution: ".xcf."
        mistakes: {"JPG": gimp_files}
      - prompt: "To convert a GIMP poster into a JPG image you use"
        options: ["File → Export", "File → Save", "Edit → Paste", "Select → All"]
        answer: "File → Export"
        difficulty: 1
        hints: ["Save only makes .xcf."]
        solution: "File → Export and choose JPEG."
        mistakes: {"File → Save": gimp_files}
      - prompt: "Which filter gives a quick shadow to an object layer?"
        options: ["Light and Shadow → Drop Shadow", "Blur → Gaussian Blur only", "Colours → Brightness-Contrast", "Select → From Path"]
        answer: "Light and Shadow → Drop Shadow"
        difficulty: 2
        hints: ["It is in the Filters menu."]
        solution: "Filters → Light and Shadow → Drop Shadow."
        mistakes: {"Colours → Brightness-Contrast": gimp_tools}
      - prompt: "Why save the poster as .xcf and not only as JPG?"
        options: ["XCF keeps layers and transparency for future editing", "XCF opens in every app", "JPG cannot show colours", "XCF files are always smaller"]
        answer: "XCF keeps layers and transparency for future editing"
        difficulty: 2
        hints: ["JPG flattens everything into one picture."]
        solution: "The project file keeps every layer editable."
        mistakes: {"XCF opens in every app": gimp_files}
      - prompt: "To make a hand-made text shadow, after duplicating the text layer and colouring it black, you"
        options: ["Lower it behind the original and apply Gaussian Blur", "Delete the original text", "Export the image", "Use Fuzzy Select on it"]
        answer: "Lower it behind the original and apply Gaussian Blur"
        difficulty: 2
        hints: ["The shadow must be behind the words and soft."]
        solution: "Lower the black copy, blur it, then nudge it with the Move tool."
        mistakes: {"Delete the original text": gimp_layers}
      - prompt: "Which tool would you use to add the heading FRUIT FEST?"
        options: ["Text tool", "Scale tool", "Paths tool", "Crop tool"]
        answer: "Text tool"
        difficulty: 1
        hints: ["Set the font in Tool Options."]
        solution: "The Text tool."
        mistakes: {"Paths tool": gimp_tools}
      - prompt: "What is the shortcut key for Bucket Fill?"
        options: ["Shift+B", "G", "U", "Ctrl+C"]
        answer: "Shift+B"
        difficulty: 2
        hints: ["B alone is the Paths tool."]
        solution: "Shift+B."
        mistakes: {"G": gimp_tools}
