# Class 9 Information and Communications Technology, chapter 5. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 1 text supplied by the school. Topics: wikis, e-mail, social media, online services, cyber safety.
subject: it
chapter: 5
title: The Web of Goodness

tips:
  wiki_facts: "'Wiki' is a Hawaiian word for fast. The first wiki was made in the mid-1990s by an American programmer, not the e-mail pioneer. Wikipedia runs on wiki software named after media. Deliberately false edits are vandalism."
  schoolwiki_steps: "SchoolWiki's Malayalam menu words describe the action: one means 'practice ground' for learners, one means 'edit', one means 'enter'. A captcha checks that a real person, not a program, is signing up."
  email_parts: "An e-mail address is username@domain: the part before @ is the person, the part after is the service. The father of e-mail sent the first network e-mail in 1971; he is not the wiki inventor."
  social_safety: "Safe social media: check privacy settings, do not share address, phone or birth date, report and block abuse, don't spread fake news, never rush to meet online strangers, limit screen time, and tell parents or teachers about bad experiences."
  online_money: "Two-factor means a second check after the password, usually a code sent to your phone. Debit spends your own money; credit is borrowed and paid back later. Public Wi-Fi is risky for banking. The Kerala portal's name starts with 'SAMAGRA'."
  cyber_crimes: "Match the trick to its name: fake prize or lottery messages fish for your details; threats built from your social-media posts are stalking; harmful programs are malicious software. Digital money runs on blockchain. Smart home gadgets that talk to the internet form the Internet of Things (IoT)."
  it5_wiki_who: 'Keep the facts apart: who made the first wiki and when, what software runs the wikis, and who watches over Wikipedia.'
  it5_schoolwiki_words: 'SchoolWiki''s menu is in Malayalam: Pravesikkuka logs in, Thiruthuka edits, Ezhuthukalari is the practice page.'
  it5_address_parts: An e-mail address is username @ provider's domain. The part before @ is the person; the part after is the service.
  it5_stay_safe: Ask whether the action keeps your personal details, your safety and other people's privacy protected.
  it5_scam_signs: Unbelievable offers, urgent requests for money or bank details, and unknown links are warning signs.
  it5_card_kinds: A debit card spends your own money now; a credit card borrows money you repay later.

concepts:
  - code: it9.web.wikis
    title: Wikipedia and SchoolWiki
    notes: |
      Stephen Hawking: the internet is used for good and evil; use it for the betterment of humanity.
      Wikipedia: an encyclopedia made by the collaboration of many people, open to anyone with internet,
      editable by anyone, monitored by volunteers. Membership is not required to edit (the editor's IP
      address is shown) but logging in is better. 'Wiki' is from Hawaiian 'WikiWiki', meaning quick;
      Ward Cunningham, an American programmer, created the first wiki, WikiWikiWeb, in 1995. Wikipedia has
      strong governance: wrong edits are removed and repeat offenders (Wikipedia vandals) banned.
      SchoolWiki (schoolwiki.in): encyclopedia by all Kerala schools, built on MediaWiki from the
      Wikimedia Foundation; aims to collect students' creative work and teachers' resources; has school
      history, arts festival works, digital magazines. Search by school name or code. To edit, become a
      member: Sign up → username, password, confirm password, e-mail, name, captcha → Create your
      membership → verify by e-mail. Captcha checks that the user is human, stopping fake accounts made by
      programs. Ezhuthukalari is a practice page for each student: Pravesikkuka (log in) → Ezhuthukalari →
      type your name → write or paste content; Bold, Italic, headings from the toolbar; images via
      Chithrangalum Mediakalum; Thiruthuka to edit; Save the changes.
    explanations:
      text: "A wiki is a website anyone can edit together. Wikipedia is the world's wiki encyclopedia; SchoolWiki is Kerala schools' own. You practise editing in Ezhuthukalari first."
      visual: "Picture a big notice board in the school hall where every student can pin and correct notes, while volunteers remove anything false. That is a wiki."
      step_by_step: "To start your Ezhuthukalari page: Step 1: open schoolwiki.in and click Pravesikkuka. Step 2: log in. Step 3: click Ezhuthukalari on the left. Step 4: type your name, click Pravesikkuka. Step 5: write, format and click Save the changes."
      real_world: "Your own school has a SchoolWiki page with its year of founding, e-mail address and educational district."
    activity:
      type: order
      prompt: Join SchoolWiki and write on your practice page. Put the steps in order.
      steps:
      - 'Sign up: username, password, e-mail, captcha'
      - Create your membership and verify by e-mail
      - Pravesikkuka (log in)
      - Open Ezhuthukalari and type your name
      - Write the content, then save the changes
      reasons:
        Create your membership and verify by e-mail: You fill in the form before creating the account.
        Pravesikkuka (log in): You can only log in after your membership is created and verified.
        Open Ezhuthukalari and type your name: The practice page is for members who are logged in.
        Write the content, then save the changes: You must open your page before writing on it.
    lesson:
      - teach: Wikipedia is an encyclopedia written together by many people. Anyone with internet can read or edit it; volunteers watch for wrong edits, and repeat 'vandals' are banned. 'Wiki' is Hawaiian for quick. Ward Cunningham made the first wiki, WikiWikiWeb, in 1995.
        check:
          prompt: Who can edit Wikipedia?
          options:
          - Anyone with internet
          - Only professors
          - Only the government
          answer: Anyone with internet
          why: That openness is what makes it a wiki.
        ways:
        - style: real_world
          teach: 'Imagine a class notebook that anyone can write in, with monitors who rub out wrong entries and stop the troublemakers. Wikipedia is that, for the whole world: anyone with internet can read or edit it; volunteers watch for wrong edits, and repeat ''vandals'' are banned. ''Wiki'' is Hawaiian for quick; Ward Cunningham made the first wiki, WikiWikiWeb, in 1995.'
      - teach: SchoolWiki (schoolwiki.in) is an encyclopedia made by Kerala schools, built on MediaWiki like Wikipedia. It holds school histories, arts festival works and digital magazines. To edit, sign up with a username, password, e-mail and a captcha (a test that you are human), then verify by e-mail.
        picture:
          kind: flow
          steps:
          - Sign up
          - Username, password, e-mail
          - Captcha
          - Create membership
          - Verify e-mail
          alt: Joining SchoolWiki.
        check:
          prompt: What does a captcha check?
          options:
          - That you are a human
          - Your exam marks
          - Your internet speed
          answer: That you are a human
          why: It stops programs making fake accounts.
        ways:
        - style: step_by_step
          teach: 'Join SchoolWiki (schoolwiki.in), Kerala schools'' own encyclopedia built on MediaWiki, with school histories, arts festival works and digital magazines. Step 1: sign up with a username, password and e-mail. Step 2: solve the captcha, a small test that proves you are a human. Step 3: verify your account from the e-mail.'
      - teach: 'Each student can practise on an Ezhuthukalari page: Pravesikkuka (log in) → Ezhuthukalari → write; use Bold, Italic and headings; add images with Chithrangalum Mediakalum; edit with Thiruthuka; save the changes.'
        check:
          prompt: Which SchoolWiki option logs you in?
          options:
          - Pravesikkuka
          - Thiruthuka
          - Ezhuthukalari
          answer: Pravesikkuka
          why: Pravesikkuka means 'enter'.
        ways:
        - style: step_by_step
          teach: 'Practise on your Ezhuthukalari page. Step 1: Pravesikkuka, to log in. Step 2: open Ezhuthukalari and write. Step 3: use Bold, Italic and headings. Step 4: add images with Chithrangalum Mediakalum. Step 5: edit later with Thiruthuka. Step 6: save the changes.'
    items:
      - prompt: "Which software is used to build Wikipedia and SchoolWiki?"
        options: ["MediaWiki", "WikiWiki", "Wikimania", "Softwiki"]
        answer: "MediaWiki"
        difficulty: 1
        hints: ["It is from the Wikimedia Foundation."]
        solution: "MediaWiki."
        mistakes: {"WikiWiki": wiki_facts}
      - prompt: "The word 'wiki' comes from Hawaiian and means"
        options: ["Quick", "Knowledge", "Book", "Friend"]
        answer: "Quick"
        difficulty: 1
        hints: ["Wikis are meant to be edited quickly by anyone."]
        solution: "Quick."
        mistakes: {"Knowledge": wiki_facts}
      - prompt: "Who created the first wiki, WikiWikiWeb?"
        options: ["Ward Cunningham", "Ray Tomlinson", "Guido van Rossum", "Tim Berners-Lee"]
        answer: "Ward Cunningham"
        difficulty: 2
        hints: ["An American programmer, in 1995."]
        solution: "Ward Cunningham."
        mistakes: {"Ray Tomlinson": wiki_facts}
      - prompt: "In which year was the first wiki created?"
        answer: "1995"
        check: "1995"
        difficulty: 2
        hints: ["Mid-1990s."]
        solution: "1995."
        mistakes: {"1991": wiki_facts}
      - prompt: "What is the 'Ezhuthukalari' page in SchoolWiki for?"
        options: ["Students practising wiki editing", "Teachers marking exams", "Buying books", "Video calls"]
        answer: "Students practising wiki editing"
        difficulty: 1
        hints: ["Ezhuthu = writing, kalari = training ground."]
        solution: "It is a practice page."
        mistakes: {"Teachers marking exams": schoolwiki_steps}
      - prompt: "What is the purpose of a captcha on a sign-up form?"
        options: ["To check that the user is a human and stop fake accounts made by programs", "To make the password longer", "To send e-mail", "To show adverts"]
        answer: "To check that the user is a human and stop fake accounts made by programs"
        difficulty: 2
        hints: ["Scribbled letters or simple maths."]
        solution: "It proves a human is filling the form."
        mistakes: {"To make the password longer": schoolwiki_steps}
      - prompt: "Which SchoolWiki option do you use to edit your page?"
        options: ["Thiruthuka", "Pravesikkuka", "Chithrangalum Mediakalum", "Sign up"]
        answer: "Thiruthuka"
        difficulty: 2
        hints: ["Look for the Malayalam word for 'edit' among the tabs at the top of the page."]
        solution: "Thiruthuka."
        mistakes: {"Pravesikkuka": schoolwiki_steps}
      - prompt: "Someone keeps adding false information to Wikipedia on purpose. What can happen?"
        options: ["The edits are removed and the person can be banned as a vandal", "Nothing, anyone can write anything", "Wikipedia shuts down", "The person becomes an editor"]
        answer: "The edits are removed and the person can be banned as a vandal"
        difficulty: 2
        hints: ["Wikipedia has strong governance."]
        solution: "Wrong content is deleted; repeat offenders are banned."
        mistakes: {"Nothing, anyone can write anything": wiki_facts}
      - prompt: "A Wikipedia article was changed without logging in. What does Wikipedia show in the page history for that edit?"
        options: ["The editor's IP address", "The editor's phone number", "Nothing at all", "The editor's school name"]
        answer: "The editor's IP address"
        difficulty: 3
        hints: ["Membership is not needed to edit.", "Each device on the internet has an address."]
        solution: "Step 1: Anyone can edit without an account. Step 2: Then the device's IP address is recorded with the edit instead of a username."
        mistakes: {"The editor's phone number": wiki_facts, "Nothing at all": wiki_facts, "The editor's school name": wiki_facts}
      - prompt: "Why is SchoolWiki a better place than Wikipedia for your school's arts festival magazine?"
        options: ["SchoolWiki is meant for Kerala schools' own creative work and resources", "Wikipedia does not allow pictures", "SchoolWiki is not on the internet", "Wikipedia is only in English"]
        answer: "SchoolWiki is meant for Kerala schools' own creative work and resources"
        difficulty: 3
        hints: ["What is each wiki's aim?", "Wikipedia is an encyclopedia for notable topics."]
        solution: "Step 1: SchoolWiki aims to collect Kerala students' creative work and teachers' resources. Step 2: A school magazine fits that aim; Wikipedia is a general encyclopedia."
        mistakes: {"Wikipedia does not allow pictures": schoolwiki_steps, "SchoolWiki is not on the internet": schoolwiki_steps, "Wikipedia is only in English": schoolwiki_steps}
      - prompt: What is the address of SchoolWiki?
        options:
        - schoolwiki.in
        - wikipedia.org
        - samagra.kite.kerala.gov.in
        - gmail.com
        answer: schoolwiki.in
        difficulty: 1
        hints:
        - It is an Indian website.
        - Its address is its own name.
        solution: 'Step 1: Wikipedia is .org. Step 2: SAMAGRA is a KITE portal. Step 3: schoolwiki.in.'
        mistakes:
          wikipedia.org: it5_wiki_who
      - prompt: Which organisation provides the MediaWiki software?
        options:
        - Wikimedia Foundation
        - KSEB
        - Google
        - ARPANET
        answer: Wikimedia Foundation
        difficulty: 2
        hints:
        - It also runs Wikipedia.
        - Its name is close to 'MediaWiki'.
        solution: 'Step 1: MediaWiki runs Wikipedia. Step 2: Wikipedia is run by a foundation. Step 3: Wikimedia Foundation.'
        mistakes:
          Google: it5_wiki_who
      - prompt: Which SchoolWiki option adds images to your page?
        options:
        - Chithrangalum Mediakalum
        - Pravesikkuka
        - Thiruthuka
        - Ezhuthukalari
        answer: Chithrangalum Mediakalum
        difficulty: 2
        hints:
        - '''Chithram'' means picture in Malayalam.'
        - It handles pictures and media.
        solution: 'Step 1: Pravesikkuka = log in; Thiruthuka = edit. Step 2: Chithram = picture. Step 3: Chithrangalum Mediakalum.'
        mistakes:
          Thiruthuka: it5_schoolwiki_words
      - prompt: Who said the internet can be used for good and evil and should serve humanity?
        options:
        - Stephen Hawking
        - Ward Cunningham
        - Ray Tomlinson
        - John McCarthy
        answer: Stephen Hawking
        difficulty: 2
        hints:
        - He was a famous physicist.
        - The chapter opens with his words.
        solution: 'Step 1: Cunningham made wikis; Tomlinson e-mail; McCarthy AI. Step 2: The physicist is left. Step 3: Stephen Hawking.'
        mistakes:
          Ward Cunningham: wiki_facts
      - prompt: How can you find a particular school on SchoolWiki?
        options:
        - Search by school name or school code
        - Only by phone
        - By sending a letter
        - It cannot be searched
        answer: Search by school name or school code
        difficulty: 1
        hints:
        - Use the search box.
        - Every school has a name and a code.
        solution: 'Step 1: SchoolWiki has a search box. Step 2: Schools have names and codes. Step 3: Search either.'
        mistakes:
          It cannot be searched: schoolwiki_steps

  - code: it9.web.email_social
    title: E-mail and social media
    after: [it9.web.wikis]
    notes: |
      E-mail (electronic mail): first form in the late 1960s by the US Department of Defense over ARPANET;
      Ray Tomlinson, who wrote the program, is the father of e-mail. An address has a username and the
      provider's domain (gourykrishna@gmail.com: username gourykrishna, provider gmail.com). It is a
      person's digital identity and main contact for online services. Providers: Gmail, Yahoo Mail,
      Disroot. To create one: open a provider's site, choose a username, create a password, give details,
      verify. Social media lets people share resources and interact: LinkedIn (professional networking,
      linking job seekers and employers), YouTube, Instagram, WhatsApp. Uses: resource exchange,
      networking, social groups, real-time communication (video calls, live), e-commerce. Be smart: secure
      privacy settings; don't share address, phone or date of birth; report and block disrespect; be
      respectful; no fake news; don't trust or rush to meet strangers; limit screen time and know signs of
      addiction; don't share others' information without permission; tell parents, teachers or friends
      about bad experiences. Fact checking: verify the source, ask others, use official channels.
    explanations:
      text: "Your e-mail address is your online identity: a username, an @, and the provider's name. Social media helps you share and connect, but you must protect your privacy and check facts."
      visual: "An e-mail address is like a house address: the username is the house name, and the part after @ is the town where the post office is."
      step_by_step: "Before sharing a forwarded message: Step 1: who first sent it? Step 2: does an official site or news source say the same? Step 3: if not sure, don't forward it."
      real_world: "If someone you met on Instagram asks to meet you alone, tell your parents or a teacher at once."
    activity:
      type: sort
      prompt: Safe or unsafe on social media?
      bins:
      - Safe
      - Unsafe
      items:
      - label: Setting your profile to private
        bin: Safe
        clue: Who can see your posts?
        why: Secure privacy settings keep you safe.
      - label: Posting your home address and phone number
        bin: Unsafe
        clue: Who could see it?
        why: Never share personal details publicly.
      - label: Forwarding a shocking message without checking
        bin: Unsafe
        clue: Could it be fake?
        why: Check the source first; fake news harms.
      - label: Blocking and reporting someone who is rude
        bin: Safe
        clue: Stops disrespect.
        why: Report and block.
      - label: Meeting an online 'friend' alone
        bin: Unsafe
        clue: Do you really know them?
        why: Don't trust or rush to meet strangers.
      - label: Telling a teacher about a bad experience online
        bin: Safe
        clue: Who can help?
        why: Tell parents, teachers or friends.
      - label: Sharing a friend's photo without asking
        bin: Unsafe
        clue: Whose permission is needed?
        why: Never share others' information without permission.
    lesson:
      - teach: 'E-mail began in the late 1960s on ARPANET (US Department of Defense). Ray Tomlinson is called the father of e-mail. An address has a username and the provider''s domain: in gourykrishna@gmail.com, the username is gourykrishna and the provider is gmail.com.'
        picture:
          kind: compare
          columns:
          - title: Before @
            points:
            - username
            - gourykrishna
          - title: After @
            points:
            - provider's domain
            - gmail.com
          alt: Parts of an e-mail address.
        check:
          prompt: In ravi@disroot.org, the provider is
          options:
          - disroot.org
          - ravi
          - '@'
          answer: disroot.org
          why: The part after @ is the provider.
        ways:
        - style: step_by_step
          teach: 'Read an e-mail address in two parts, split at the @. Before the @: the username (gourykrishna). After the @: the provider''s domain (gmail.com). E-mail began in the late 1960s on ARPANET, run by the US Department of Defense, and Ray Tomlinson is called the father of e-mail.'
      - teach: 'Social media lets people share and interact: LinkedIn (jobs and professional networking), YouTube, Instagram, WhatsApp. Uses include sharing resources, groups, video calls and online selling.'
        check:
          prompt: Which platform links job seekers and employers?
          options:
          - LinkedIn
          - YouTube
          - Gmail
          answer: LinkedIn
          why: It is a professional network.
        ways:
        - style: real_world
          teach: Match the platform to the job. Looking for work or hiring? LinkedIn, for professional networking. Watching or posting videos? YouTube. Sharing photos? Instagram. Chatting and calling in groups? WhatsApp. Social media is also used for sharing resources, video calls and online selling.
      - teach: 'Be smart online: set privacy, don''t share your address, phone or birth date, block and report abuse, don''t spread fake news, don''t meet strangers, watch your screen time, and don''t share others'' details without permission. Check news with official sources. Tell a trusted adult about bad experiences.'
        check:
          prompt: A forwarded message looks shocking. First you should
          options:
          - Check the source
          - Share it at once
          - Add your own comments
          answer: Check the source
          why: Fake news spreads when people forward without checking.
        ways:
        - style: real_world
          teach: Treat the online world like a busy street. You wouldn't tell a stranger your address, phone number or birthday, or go off to meet them. Online, set privacy, block and report abuse, don't share others' details without permission, and watch your screen time. Before forwarding shocking news, check it with official sources. Tell a trusted adult about bad experiences.
    items:
      - prompt: "In the address gourykrishna@gmail.com, what is the username?"
        options: ["gourykrishna", "gmail.com", "@", "com"]
        answer: "gourykrishna"
        difficulty: 1
        hints: ["It comes before the @."]
        solution: "gourykrishna; gmail.com is the provider."
        mistakes: {"gmail.com": email_parts}
      - prompt: "Who is known as the father of e-mail?"
        options: ["Ray Tomlinson", "Ward Cunningham", "Stephen Hawking", "Bill Gates"]
        answer: "Ray Tomlinson"
        difficulty: 1
        hints: ["He wrote the first program on ARPANET."]
        solution: "Ray Tomlinson."
        mistakes: {"Ward Cunningham": email_parts}
      - prompt: "Which is a professional networking platform linking job seekers and employers?"
        options: ["LinkedIn", "Instagram", "YouTube", "SchoolWiki"]
        answer: "LinkedIn"
        difficulty: 1
        hints: ["Profiles show qualifications and experience."]
        solution: "LinkedIn."
        mistakes: {"Instagram": social_safety}
      - prompt: "Which of these is NOT social media?"
        options: ["SchoolWiki", "YouTube", "Instagram", "WhatsApp"]
        answer: "SchoolWiki"
        difficulty: 2
        hints: ["One is a school encyclopedia."]
        solution: "SchoolWiki is a wiki encyclopedia."
        mistakes: {"WhatsApp": social_safety}
      - prompt: "Which should you avoid sharing publicly on social media?"
        options: ["Your home address and phone number", "A photo of a flower", "A school event announcement", "A book review"]
        answer: "Your home address and phone number"
        difficulty: 1
        hints: ["Personal information can be misused."]
        solution: "Keep address, phone and date of birth private."
        mistakes: {"A book review": social_safety}
      - prompt: "A stranger from Instagram invites you to meet. What should you do?"
        options: ["Not go, and inform teachers and parents", "Go alone", "Share your address", "Keep it secret"]
        answer: "Not go, and inform teachers and parents"
        difficulty: 2
        hints: ["Never rush to meet strangers you meet online."]
        solution: "Refuse and tell a trusted adult."
        mistakes: {"Keep it secret": social_safety}
      - prompt: "You receive a shocking news message. What is the best first step?"
        options: ["Check the source through official channels before sharing", "Forward it to all groups", "Delete your account", "Reply angrily"]
        answer: "Check the source through official channels before sharing"
        difficulty: 2
        hints: ["Fake news spreads when people forward without checking."]
        solution: "Verify first."
        mistakes: {"Forward it to all groups": social_safety}
      - prompt: "Which two addresses use the same e-mail provider: anu.k@disroot.org, anu.k@gmail.com, ravi99@gmail.com, ravi99@yahoo.com?"
        options: ["anu.k@gmail.com and ravi99@gmail.com", "anu.k@disroot.org and anu.k@gmail.com", "ravi99@gmail.com and ravi99@yahoo.com", "anu.k@disroot.org and ravi99@yahoo.com"]
        answer: "anu.k@gmail.com and ravi99@gmail.com"
        difficulty: 3
        hints: ["Which part of an address names the provider?", "Look after the @ sign."]
        solution: "Step 1: The provider's domain comes after @. Step 2: Two addresses end in gmail.com, so they share a provider even though the usernames differ."
        mistakes: {"anu.k@disroot.org and anu.k@gmail.com": email_parts, "ravi99@gmail.com and ravi99@yahoo.com": email_parts, "anu.k@disroot.org and ravi99@yahoo.com": email_parts}
      - prompt: "A classmate posts a photo of your class timetable with your house address visible in the corner. What is the best step?"
        options: ["Ask them politely to remove or crop it, and report it if needed", "Share it further so everyone knows", "Ignore it, addresses are not private", "Post their address in return"]
        answer: "Ask them politely to remove or crop it, and report it if needed"
        difficulty: 3
        hints: ["Is a home address safe to share publicly?", "Be respectful, but protect privacy."]
        solution: "Step 1: A home address is personal information that should not be public. Step 2: Respectfully ask for it to be removed, and use report options if it stays."
        mistakes: {"Share it further so everyone knows": social_safety, "Ignore it, addresses are not private": social_safety, "Post their address in return": social_safety}
      - prompt: On which network did e-mail first appear?
        options:
        - ARPANET
        - SchoolWiki
        - LinkedIn
        - KSEB
        answer: ARPANET
        difficulty: 2
        hints:
        - It was a US Department of Defense network.
        - It was in the 1960s.
        solution: 'Step 1: E-mail began in the late 1960s. Step 2: It ran on the defence network. Step 3: ARPANET.'
        mistakes:
          LinkedIn: email_parts
      - prompt: In meera.s@yahoo.com, what is the provider's domain?
        options:
        - yahoo.com
        - meera.s
        - meera
        - com
        answer: yahoo.com
        difficulty: 1
        hints:
        - Look after the @ sign.
        - The provider's whole domain is needed.
        solution: 'Step 1: Before @ = username. Step 2: After @ = provider. Step 3: yahoo.com.'
        mistakes:
          meera.s: it5_address_parts
          com: it5_address_parts
      - prompt: Which is an e-mail provider?
        options:
        - Disroot
        - Instagram
        - PictoBlox
        - Kalzium
        answer: Disroot
        difficulty: 2
        hints:
        - Gmail and Yahoo Mail are others.
        - Instagram is social media.
        solution: 'Step 1: Instagram = social; PictoBlox = coding; Kalzium = chemistry. Step 2: The mail service is left. Step 3: Disroot.'
        mistakes:
          Instagram: email_parts
      - prompt: Why is an e-mail address called your digital identity?
        options:
        - Online services use it to know and contact you
        - It shows your photo
        - It is printed on your ID card
        - It changes every day
        answer: Online services use it to know and contact you
        difficulty: 2
        hints:
        - What do you give when you sign up anywhere?
        - Messages and resets come to it.
        solution: 'Step 1: Sign-ups ask for e-mail. Step 2: Services contact you there. Step 3: It identifies you online.'
        mistakes:
          It changes every day: it5_address_parts
      - prompt: You notice you spend hours on social media and feel restless without it. What is wise?
        options:
        - Limit screen time and talk to someone you trust
        - Use it even more
        - Hide it from everyone
        - Delete your school books
        answer: Limit screen time and talk to someone you trust
        difficulty: 3
        hints:
        - These are signs of addiction.
        - The lesson advises limits and asking for help.
        solution: 'Step 1: Hours of use and restlessness are warning signs. Step 2: Set limits. Step 3: Talk to a trusted adult.'
        mistakes:
          Use it even more: it5_stay_safe
      - prompt: Which is respectful behaviour on social media?
        options:
        - Asking before sharing a friend's photo
        - Posting a friend's phone number
        - Spreading a rumour
        - Mocking someone's comment
        answer: Asking before sharing a friend's photo
        difficulty: 1
        hints:
        - Think about other people's privacy.
        - Permission matters.
