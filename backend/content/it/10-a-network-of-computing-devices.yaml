# Class 9 Information and Communications Technology, chapter 10. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 2 text supplied by the school. Topic: computer networks.
subject: it
chapter: 10
title: A Network of Computing Devices

tips:
  net_media: "An Internet Service Provider (BSNL, Jio, Airtel, Vi) connects us to the internet. Data travels by optical fibre (light signals, very little loss), plastic-coated copper cable (analogue signals) or wireless signals (including satellites). Media converters change these signals to digital and back."
  net_devices: "A computer network shares information, hardware and services. UTP (Unshielded Twisted Pair) cable has 4 twisted pairs; it ends in an RJ45 jack that fits the computer's network port. A switch sends data only to the device it is meant for; a hub copies it to all devices, so switches are used today."
  net_types: "LAN: within a building or room (school lab). WAN: across a country or beyond (railways, banks). PAN: around one person (phone, watch, earbuds). Wireless networks use RF waves: Wi-Fi (about 150 m) and Bluetooth (about 10 m)."
  mac_ip: "A MAC address is fixed by the manufacturer, written in hexadecimal as six pairs (00:1B:44:11:3A:B7). An IP address can be assigned; IPv4 has four numbers separated by dots, each from 0 to 255 (e.g. 192.168.1.15). IPv6 uses hexadecimal and allows far more devices."
  protocols: "Protocols are common rules that let different operating systems talk. DHCP gives addresses automatically; TCP/IP for exchanging data; HTTP for webpages; FTP for files; SSH for remote login; VNC for screen sharing."
  static_ip: "Static IP in a lab: IPv4 → Manual, address 192.168.1.x where x is 2 to 254 (0, 1 and 255 are reserved), netmask 255.255.255.0, gateway and DNS 192.168.1.1. Test with ping followed by the IP address."
  domain_iot: "Servers are powerful computers that provide services. A domain name (cusat.ac.in) is an easy-to-remember name for a server's IP address (210.212.233.54). IoT devices (smart TVs, smart bulbs, smart locks) have a microprocessor that lets them connect to a network."

concepts:
  - code: it9.net.building
    title: Building a computer network
    notes: |
      Messages pass between devices through media (cables, wireless) following rules, like vehicles on a
      road network following traffic rules. An Internet Service Provider (BSNL, Jio, Airtel, Vi) connects
      our computer to the internet; phone infrastructure is now used for the internet and even calls.
      Cables: optical fibre (thin plastic-coated glass fibres; data as light; minimal loss) and
      plastic-coated copper (data as analogue signals). Wireless signals, including satellites, also carry
      data. Computers work in digital form, but digital signals cannot travel far without loss, so media
      converters change analogue, optical and wireless signals to digital and back. A computer network:
      computers connected to share information, hardware (printers, scanners) and services (files,
      internet, screen sharing). UTP (Unshielded Twisted Pair) cables have four pairs of coloured wires
      twisted together (e.g. green solid with white-green striped). A port connects external devices; the
      cable needs a connector jack, RJ45 (Registered Jack 45); RJ9 and RJ11 are for old telephones. Many
      computers connect to one common device, a switch, with enough ports. A hub sends copies of data to
      all computers; a switch only to the intended one, reducing traffic and increasing speed, so switches
      are used more now. Networks connected to networks form the internet. Types: LAN (one building or
      room, e.g. the school lab), WAN (across a country or beyond, e.g. railways, banks), PAN (around one
      person). Wireless networks use RF (radio frequency) waves: Wi-Fi covers up to about 150 m (laptops,
      phones, smart home devices); Bluetooth about 10 m and slower (headphones, keyboards, smartwatches).
    explanations:
      text: "A network links computers so they can share files, printers and the internet. Cables with RJ45 plugs run to a switch, which sends each message only to the right computer."
      visual: "Picture the lab: every computer has a blue cable running to one box (the switch) on the wall, like spokes to the hub of a cycle wheel."
      step_by_step: "To pick the network type: Step 1: is it one room or building? LAN. Step 2: does it cross cities or countries? WAN. Step 3: is it just your own phone, watch and earbuds? PAN."
      real_world: "Indian Railways' ticket booking links stations across the country: a WAN. Your school's computer lab is a LAN."
    items:
      - prompt: "The connector at the end of a network cable is called"
        options: ["RJ45", "RJ11", "USB", "HDMI"]
        answer: "RJ45"
        difficulty: 1
        hints: ["RJ11 is for old telephones."]
        solution: "RJ45 (Registered Jack 45)."
        mistakes: {"RJ11": net_devices}
      - prompt: "A network inside the school computer lab is a"
        options: ["LAN", "WAN", "PAN"]
        answer: "LAN"
        difficulty: 1
        hints: ["Local Area Network."]
        solution: "LAN."
        mistakes: {"WAN": net_types}
      - prompt: "How many twisted pairs of wires does a common UTP cable have?"
        answer: "4"
        check: "4"
        difficulty: 1
        hints: ["That is 8 wires in all."]
        solution: "Four pairs."
        mistakes: {"8": net_devices}
      - prompt: "Which device sends data only to the computer it is meant for?"
        options: ["Switch", "Hub", "Media converter", "Printer"]
        answer: "Switch"
        difficulty: 1
        hints: ["A hub sends copies to everyone."]
        solution: "A switch."
        mistakes: {"Hub": net_devices}
      - prompt: "Which device is used very rarely nowadays?"
        options: ["Hub", "Switch", "Router", "Media converter"]
        answer: "Hub"
        difficulty: 2
        hints: ["It floods every computer with copies."]
        solution: "The hub; switches replaced it."
        mistakes: {"Switch": net_devices}
      - prompt: "Why do optical fibre cables lose very little data?"
        options: ["Data travels as light through glass fibres", "They are thicker", "They use analogue signals", "They are buried deeper"]
        answer: "Data travels as light through glass fibres"
        difficulty: 2
        hints: ["They are thin glass fibres coated with plastic."]
        solution: "Light signals in glass have minimal loss."
        mistakes: {"They use analogue signals": net_media}
      - prompt: "Why is a media converter needed?"
        options: ["To change analogue, optical or wireless signals into digital signals and back", "To print documents", "To store files", "To cool the computer"]
        answer: "To change analogue, optical or wireless signals into digital signals and back"
        difficulty: 2
        hints: ["Computers work only with digital signals."]
        solution: "It converts between signal types."
        mistakes: {"To store files": net_media}
      - prompt: "Wireless earbuds connected to your phone form which kind of network?"
        options: ["PAN, using Bluetooth", "WAN, using cables", "LAN, using a switch"]
        answer: "PAN, using Bluetooth"
        difficulty: 2
        hints: ["It surrounds one person, about 10 m."]
        solution: "A Personal Area Network over Bluetooth."
        mistakes: {"WAN, using cables": net_types}
      - prompt: "Wi-Fi covers about 150 m and Bluetooth about 10 m. How many times farther does Wi-Fi reach?"
        answer: "15"
        check: "150/10"
        difficulty: 2
        hints: ["Divide."]
        solution: "150 ÷ 10 = 15 times."
        mistakes: {"140": net_types}

  - code: it9.net.addresses_protocols
    title: MAC addresses, IP addresses and protocols
    after: [it9.net.building]
    notes: |
      Devices on a network need unique addresses, like postal addresses. MAC (Media Access Control)
      address: unique, assigned by the manufacturer; helps police trace lost or stolen devices; written in
      hexadecimal (16 symbols 0–9 and A–F) as six pairs, e.g. 00:1B:44:11:3A:B7; seen in Settings → Network
      or Wi-Fi → Details → Hardware Address. Binary uses 0 and 1, decimal 0–9. IP address: assigned to each
      device so devices can identify one another; can be changed. IPv4: four numbers separated by dots, each
      0–255 (256 values), e.g. 192.168.1.1. In home and lab networks addresses differ only in the last part
      (keep 192.168). IPv6 handles far more devices with hexadecimal addresses like
      2001:0db8:85a3:0000:0000:8a2e:0370:7334 (IPv4 is 32-bit). Protocols are common rules so that
      networking software on GNU/Linux, Apple and Windows can communicate, like traffic signs understood
      across countries. DHCP (Dynamic Host Configuration Protocol) assigns temporary addresses
      automatically. TCP/IP: rules for exchanging information. SSH (Secure Shell): remote login. HTTP
      (HyperText Transfer Protocol): transfers webpages; browsers use it. FTP (File Transfer Protocol):
      transfers files.
    explanations:
      text: "Every device has a fixed MAC address from the factory and an IP address on the network. Protocols are the shared rules, like DHCP for handing out IP addresses and HTTP for webpages."
      visual: "A MAC address is like your Aadhaar number: fixed and unique. An IP address is like your seat number in class: it can change if you move."
      step_by_step: "To check an IPv4 address: Step 1: are there exactly four numbers separated by dots? Step 2: is each number between 0 and 255? If both are yes, it is valid. 192.168.1.254 is valid; 192.168.1.256 is not."
      real_world: "When your phone joins the school Wi-Fi, DHCP gives it an IP address in a second without you doing anything."
    items:
      - prompt: "Which is a valid IPv4 address?"
        options: ["192.168.1.254", "192.168.1.257", "192.168.1.256", "192.168.256.1"]
        answer: "192.168.1.254"
        difficulty: 1
        hints: ["Each number must be 0 to 255."]
        solution: "Only 192.168.1.254 has all parts within 0–255."
        mistakes: {"192.168.1.256": mac_ip}
      - prompt: "Who assigns a device's MAC address?"
        options: ["The manufacturer", "The user", "DHCP", "The internet service provider"]
        answer: "The manufacturer"
        difficulty: 1
        hints: ["It is fixed in the hardware."]
        solution: "The manufacturer."
        mistakes: {"DHCP": mac_ip}
      - prompt: "Which protocol assigns IP addresses automatically?"
        options: ["DHCP", "FTP", "HTTP", "SSH"]
        answer: "DHCP"
        difficulty: 1
        hints: ["Dynamic Host Configuration Protocol."]
        solution: "DHCP."
        mistakes: {"FTP": protocols}
      - prompt: "Web browsers work using which protocol?"
        options: ["HTTP", "FTP", "SSH", "DHCP"]
        answer: "HTTP"
        difficulty: 1
        hints: ["HyperText Transfer Protocol."]
        solution: "HTTP."
        mistakes: {"FTP": protocols}
      - prompt: "How many different values can each number in an IPv4 address take (0 to 255)?"
        answer: "256"
        check: "255 - 0 + 1"
        difficulty: 2
        hints: ["Count 0 as well."]
        solution: "256 values."
        mistakes: {"255": mac_ip}
      - prompt: "How many symbols does the hexadecimal system use?"
        answer: "16"
        check: "10 + 6"
        difficulty: 2
        hints: ["0–9 and A–F."]
        solution: "10 digits + 6 letters = 16."
        mistakes: {"10": mac_ip}
      - prompt: "Which protocol lets you log in to and control a faraway computer?"
        options: ["SSH", "HTTP", "DHCP", "FTP"]
        answer: "SSH"
        difficulty: 2
        hints: ["Secure Shell."]
        solution: "SSH."
        mistakes: {"HTTP": protocols}
      - prompt: "How can a GNU/Linux computer and a Windows computer exchange data on one network?"
        options: ["Their networking software follows common protocols", "They must use the same operating system", "They need the same MAC address", "They cannot"]
        answer: "Their networking software follows common protocols"
        difficulty: 2
        hints: ["Like traffic signs understood in every country."]
        solution: "Shared protocols make it possible."
        mistakes: {"They need the same MAC address": protocols}
      - prompt: "A MAC address like 00:1B:44:11:3A:B7 has how many pairs?"
        answer: "6"
        check: "6"
        difficulty: 2
        hints: ["Count the groups between colons."]
        solution: "Six pairs."
        mistakes: {"5": mac_ip}
      - prompt: "Why was IPv6 introduced?"
        options: ["To give addresses to far more devices as IoT grows", "To make addresses shorter", "To remove MAC addresses", "To stop using hexadecimal"]
        answer: "To give addresses to far more devices as IoT grows"
        difficulty: 3
        hints: ["IPv4 is only 32-bit."]
        solution: "IPv6 has a much larger address space."
        mistakes: {"To make addresses shorter": mac_ip}

  - code: it9.net.using_network
    title: Using the lab network and the internet
    after: [it9.net.addresses_protocols]
    notes: |
      Join Wi-Fi in GNU/Linux: Settings → Wi-Fi → turn on → choose a network under Visible Networks →
      enter password; DHCP assigns an IP address. Find the IP address with the Network Manager Applet
      (nm-applet) on the top panel → Wi-Fi Settings (or Wired) → Settings → Details. A static (fixed) IP is
      better for file transfer and other tasks: IPv4 tab → Manual → address e.g. 192.168.1.204 (last part
      any number 2–254; 0, 1 and 255 are reserved), netmask 255.255.255.0, gateway 192.168.1.1, DNS
      192.168.1.1, turn off Automatic DNS, Apply; keep 192.168.1. the same for all lab computers. Test with
      the terminal command ping followed by an IP address, e.g. ping 192.168.1.15. File transfer needs the
      file name, its location, the computer's IP address, and its username and password: Files → Other
      Locations → Connect to Server → ssh://192.168.1.15 → Connect → log in. Screen sharing uses the VNC
      protocol (no internet needed): on the sharing computer Settings → Sharing → Remote Desktop On, enable
      Legacy VNC Protocol; on the viewing computer open Remmina, choose VNC, type the IP, Enter; accept on
      the sharing computer. The internet is a huge network of networks. Servers are high-performance
      computers that provide data and services; websites are stored on them and reached by the server's IP
      address (e.g. 210.212.233.54 for CUSAT). Domain names (cusat.ac.in) are easy-to-remember names for
      IP addresses. IoT: smart TVs, refrigerators, washing machines, bulbs, fans and locks contain a
      microprocessor so they can connect to a network and be controlled from a distance.
    explanations:
      text: "Once on the network, a computer has an IP address you can use to ping it, copy files from it with SSH, or view its screen with VNC. On the internet, domain names stand in for hard-to-remember server IP addresses."
      visual: "A domain name is like a contact name in your phone: you tap 'Amma' instead of remembering the 10-digit number. cusat.ac.in stands for 210.212.233.54."
      step_by_step: "To fetch a file from another lab computer: Step 1: know its IP, username and password. Step 2: Files → Other Locations. Step 3: type ssh://192.168.1.15 in Connect to Server. Step 4: Connect and log in. Step 5: open the folder and copy the file."
      real_world: "A Wi-Fi smart bulb you switch on from your phone app is an IoT device on your home network."
    items:
      - prompt: "Which command checks whether another computer on the network can be reached?"
        options: ["ping", "copy", "print", "save"]
        answer: "ping"
        difficulty: 1
        hints: ["Type it in the terminal followed by an IP address."]
        solution: "ping, e.g. ping 192.168.1.15."
        mistakes: {"copy": static_ip}
      - prompt: "An easy-to-remember name for a server's IP address, like cusat.ac.in, is a"
        options: ["Domain name", "MAC address", "Protocol", "Port"]
        answer: "Domain name"
        difficulty: 1
        hints: ["Every website has one."]
        solution: "A domain name."
        mistakes: {"MAC address": domain_iot}
      - prompt: "Which of these is NOT an IoT device?"
        options: ["USB cable", "Smart lock", "Smart television", "Voice assistant device"]
        answer: "USB cable"
        difficulty: 1
        hints: ["IoT devices contain a microprocessor and connect to a network."]
        solution: "A USB cable is not a smart device."
        mistakes: {"Smart lock": domain_iot}
      - prompt: "Which protocol and app are used to view another lab computer's screen?"
        options: ["VNC with Remmina", "FTP with GIMP", "HTTP with Calc", "DHCP with Writer"]
        answer: "VNC with Remmina"
        difficulty: 2
        hints: ["Enable Legacy VNC Protocol on the sharing computer."]
        solution: "VNC, viewed with Remmina."
        mistakes: {"FTP with GIMP": protocols}
      - prompt: "When assigning a static IP 192.168.1.x in the lab, which last numbers are allowed?"
        options: ["2 to 254", "0 to 255", "1 to 255", "0 to 1"]
        answer: "2 to 254"
        difficulty: 2
        hints: ["0, 1 and 255 are reserved."]
        solution: "Any number from 2 to 254."
        mistakes: {"0 to 255": static_ip}
      - prompt: "If 0, 1 and 255 are reserved, how many static addresses from 192.168.1.0 to 192.168.1.255 can lab computers use?"
        answer: "253"
        check: "256 - 3"
        difficulty: 3
        hints: ["There are 256 values in all."]
        solution: "256 − 3 = 253 (2 to 254)."
        mistakes: {"256": static_ip}
      - prompt: "What is typed in Connect to Server to open another computer's files with SSH?"
        options: ["ssh://192.168.1.15", "http://192.168.1.15", "ping 192.168.1.15", "192.168.1.15.ssh"]
        answer: "ssh://192.168.1.15"
        difficulty: 2
        hints: ["Start with the protocol name."]
        solution: "ssh:// followed by the IP address."
        mistakes: {"http://192.168.1.15": protocols}
      - prompt: "What makes a smart device different from an ordinary one?"
        options: ["It has a microprocessor so it can connect to a network and be controlled remotely", "It is bigger", "It uses more electricity", "It has no buttons"]
        answer: "It has a microprocessor so it can connect to a network and be controlled remotely"
        difficulty: 2
        hints: ["That is what IoT means."]
        solution: "The microprocessor lets it join a network."
        mistakes: {"It is bigger": domain_iot}
      - prompt: "Which of these is NOT needed to fetch a file from another lab computer?"
        options: ["Its MAC address", "Its IP address", "The file's location", "Its username and password"]
        answer: "Its MAC address"
        difficulty: 3
        hints: ["The textbook lists four things: name, location, IP, login."]
        solution: "The MAC address is not needed."
        mistakes: {"Its IP address": static_ip}
