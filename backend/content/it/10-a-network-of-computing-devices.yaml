# Class 9 Information and Communications Technology, chapter 10. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 2 text supplied by the school. Topic: computer networks.
subject: it
chapter: 10
title: A Network of Computing Devices

tips:
  net_media: "An Internet Service Provider (BSNL, Jio, Airtel, Vi) connects us to the internet. Data travels by optical fibre (light signals, very little loss), plastic-coated copper cable (analogue signals) or wireless signals (including satellites). Media converters change these signals to digital and back."
  net_devices: "Network cables end in a plug wider than a phone plug (RJ11). A UTP cable has twisted pairs of wires: count the pairs, not the wires. A smart device sends only to the right computer; the older one sends to all and is rarely used."
  net_types: "LAN: within a building or room (school lab). WAN: across a country or beyond (railways, banks). PAN: around one person (phone, watch, earbuds). Wireless networks use RF waves: Wi-Fi (about 150 m) and Bluetooth (about 10 m)."
  mac_ip: "Each IPv4 number runs from 0 to 255; count how many values that is. MAC addresses are burned in at the factory and written as pairs separated by colons: count the pairs in the example. Hexadecimal uses 0–9 plus A–F. IPv6 makes room for many more devices."
  protocols: "Each protocol has a job: one hands out addresses automatically (Dynamic Host Configuration), one serves web pages (HyperText Transfer), one gives a secure remote shell, one transfers files. Different systems talk because they follow the same rules."
  static_ip: "To test whether a computer answers, send it a short signal named after the sound of sonar. In 192.168.1.x, x runs from 0 to 255 but 0, 1 and 255 are reserved: take them out and count what's left. To reach another lab computer you need its network address; the factory-set hardware number is not used for this."
  domain_iot: "An easy name like cusat.ac.in stands in for a server's number address and is registered for a website. Smart (IoT) devices have a microprocessor so they can connect to a network; which choice is just a plain lead with no chip?"
  it10_net_size: 'Name the network by its size: around one person, one building, or across a country.'
  it10_cable_kind: Glass fibres carry light; copper wires carry electrical signals.
  it10_mac_vs_ip: The maker fixes the MAC address; the network hands out the IP address.
  it10_protocol_job: 'Match the protocol to its job: giving addresses, carrying webpages, moving files, or logging in remotely.'
  it10_reserved: In the lab range, 0, 1 and 255 are kept aside for special uses. Count what's left.
  it10_iot_test: An IoT device has a tiny processor and can be controlled over a network.

concepts:
  - code: it9.net.building
    title: Building a computer network
    notes: |
      Messages pass between devices through media (cables, wireless) following rules, like vehicles on a
      road network following traffic rules. An Internet Service Provider (BSNL, Jio, Airtel, Vi) connects
      our computer to the internet; phone infrastructure is now used for the internet and even calls.
      Cables: optical fibre (thin plastic-coated glass fibres; data as light; minimal loss) and
      plastic-coated copper (data as analogue signals). Wireless signals, including satellites, also carry
      data. Computers work in digital form, but digital signals cannot travel far without loss, so media
      converters change analogue, optical and wireless signals to digital and back. A computer network:
      computers connected to share information, hardware (printers, scanners) and services (files,
      internet, screen sharing). UTP (Unshielded Twisted Pair) cables have four pairs of coloured wires
      twisted together (e.g. green solid with white-green striped). A port connects external devices; the
      cable needs a connector jack, RJ45 (Registered Jack 45); RJ9 and RJ11 are for old telephones. Many
      computers connect to one common device, a switch, with enough ports. A hub sends copies of data to
      all computers; a switch only to the intended one, reducing traffic and increasing speed, so switches
      are used more now. Networks connected to networks form the internet. Types: LAN (one building or
      room, e.g. the school lab), WAN (across a country or beyond, e.g. railways, banks), PAN (around one
      person). Wireless networks use RF (radio frequency) waves: Wi-Fi covers up to about 150 m (laptops,
      phones, smart home devices); Bluetooth about 10 m and slower (headphones, keyboards, smartwatches).
    explanations:
      text: "A network links computers so they can share files, printers and the internet. Cables with RJ45 plugs run to a switch, which sends each message only to the right computer."
      visual: "Picture the lab: every computer has a blue cable running to one box (the switch) on the wall, like spokes to the hub of a cycle wheel."
      step_by_step: "To pick the network type: Step 1: is it one room or building? LAN. Step 2: does it cross cities or countries? WAN. Step 3: is it just your own phone, watch and earbuds? PAN."
      real_world: "Indian Railways' ticket booking links stations across the country: a WAN. Your school's computer lab is a LAN."
    activity:
      type: sort
      prompt: LAN, WAN or PAN?
      bins:
      - LAN
      - WAN
      - PAN
      items:
      - label: The school computer lab
        bin: LAN
        clue: One room or building.
        why: Local area network.
      - label: Railway booking across India
        bin: WAN
        clue: Across a country.
        why: Wide area network.
      - label: Your phone, smartwatch and earbuds
        bin: PAN
        clue: Around one person.
        why: Personal area network.
      - label: Bank branches all over the world
        bin: WAN
        clue: Beyond a country.
        why: WAN.
      - label: Computers in one office floor
        bin: LAN
        clue: One building.
        why: LAN.
      - label: Bluetooth keyboard and your laptop
        bin: PAN
        clue: About 10 m around you.
        why: PAN.
    lesson:
      - teach: 'A computer network joins computers so they can share files, printers and the internet. Data travels through media: optical fibre (light through glass, very little loss), copper cables, or wireless signals. An Internet Service Provider (BSNL, Jio, Airtel, Vi) connects us to the internet.'
        check:
          prompt: Which cable sends data as light?
          options:
          - Optical fibre
          - Copper
          - USB
          answer: Optical fibre
          why: Glass fibres carry light.
        ways:
        - style: real_world
          teach: 'Think of a computer network as roads between houses, so things can be shared: files, printers and the internet. The roads can be optical fibre (light through glass, with very little loss), copper cables, or wireless signals. An Internet Service Provider such as BSNL, Jio, Airtel or Vi is the highway that connects us to the internet.'
      - teach: Lab computers use UTP cables (four twisted pairs of wires) with RJ45 connectors, all plugged into a switch. A switch sends data only to the right computer; an old hub sends it to all, slowing the network.
        picture:
          kind: compare
          columns:
          - title: Switch
            points:
            - sends to the right computer only
            - faster, less traffic
          - title: Hub
            points:
            - sends to every computer
            - slower, rarely used now
          alt: Switch versus hub.
        check:
          prompt: Why are switches preferred to hubs?
          options:
          - They send data only where it is needed
          - They are louder
          - They need no cables
          answer: They send data only where it is needed
          why: Less needless traffic means more speed.
        ways:
        - style: real_world
          teach: A hub is like a teacher shouting a message to the whole class; a switch is like walking over and telling only the right student. That is why switches keep the network fast. In the lab, each computer has a UTP cable (four twisted pairs of wires) with an RJ45 connector, plugged into the switch.
      - teach: 'Network types: PAN (around one person, e.g. Bluetooth earbuds), LAN (a room or building, e.g. the lab), WAN (across a country, e.g. banks and railways). Wireless: Wi-Fi reaches about 150 m; Bluetooth about 10 m.'
        picture:
          kind: bars
          unit: approx. range (m)
          bars:
          - label: Bluetooth
            value: 10
          - label: Wi-Fi
            value: 150
          alt: Wi-Fi reaches much farther than Bluetooth.
        check:
          prompt: A bank's network across India is a
          options:
          - WAN
          - LAN
          - PAN
          answer: WAN
          why: Wide Area Network covers large distances.
        ways:
        - style: step_by_step
          teach: 'Sort networks by size, smallest first. Around one person: PAN, like Bluetooth earbuds (Bluetooth reaches about 10 m). A room or building: LAN, like the computer lab (Wi-Fi reaches about 150 m). Across a country: WAN, like the networks of banks and railways.'
    items:
      - prompt: "The connector at the end of a network cable is called"
        options: ["RJ45", "RJ11", "USB", "HDMI"]
        answer: "RJ45"
        difficulty: 1
        hints: ["RJ11 is for old telephones."]
        solution: "RJ45 (Registered Jack 45)."
        mistakes: {"RJ11": net_devices}
      - prompt: "A network inside the school computer lab is a"
        options: ["LAN", "WAN", "PAN"]
        answer: "LAN"
        difficulty: 1
        hints: ["Local Area Network."]
        solution: "LAN."
        mistakes: {"WAN": net_types}
      - prompt: "How many twisted pairs of wires does a common UTP cable have?"
        answer: "4"
        check: "4"
        difficulty: 1
        hints: ["That is 8 wires in all."]
        solution: "Four pairs."
        mistakes: {"8": net_devices}
      - prompt: "Which device sends data only to the computer it is meant for?"
        options: ["Switch", "Hub", "Media converter", "Printer"]
        answer: "Switch"
        difficulty: 1
        hints: ["A hub sends copies to everyone."]
        solution: "A switch."
        mistakes: {"Hub": net_devices}
      - prompt: "Which device is used very rarely nowadays?"
        options: ["Hub", "Switch", "Router", "Media converter"]
        answer: "Hub"
        difficulty: 2
        hints: ["It floods every computer with copies."]
        solution: "The hub; switches replaced it."
        mistakes: {"Switch": net_devices}
      - prompt: "Why do optical fibre cables lose very little data?"
        options: ["Data travels as light through glass fibres", "They are thicker", "They use analogue signals", "They are buried deeper"]
        answer: "Data travels as light through glass fibres"
        difficulty: 2
        hints: ["They are thin glass fibres coated with plastic."]
        solution: "Light signals in glass have minimal loss."
        mistakes: {"They use analogue signals": net_media}
      - prompt: "Why is a media converter needed?"
        options: ["To change analogue, optical or wireless signals into digital signals and back", "To print documents", "To store files", "To cool the computer"]
        answer: "To change analogue, optical or wireless signals into digital signals and back"
        difficulty: 2
        hints: ["Computers work only with digital signals."]
        solution: "It converts between signal types."
        mistakes: {"To store files": net_media}
      - prompt: "Wireless earbuds connected to your phone form which kind of network?"
        options: ["PAN, using Bluetooth", "WAN, using cables", "LAN, using a switch"]
        answer: "PAN, using Bluetooth"
        difficulty: 2
        hints: ["It surrounds one person, about 10 m."]
        solution: "A Personal Area Network over Bluetooth."
        mistakes: {"WAN, using cables": net_types}
      - prompt: "Wi-Fi covers about 150 m and Bluetooth about 10 m. How many times farther does Wi-Fi reach?"
        answer: "15"
        check: "150/10"
        difficulty: 2
        hints: ["Divide."]
        solution: "150 ÷ 10 = 15 times."
        mistakes: {"140": net_types}
      - prompt: "A lab has 20 computers joined by a hub. One computer sends a file to another. Why does the network slow down?"
        options: ["A hub sends the data to every computer, not only the one it is for", "A hub stores all the files", "A hub converts data into light", "A hub needs Bluetooth"]
        answer: "A hub sends the data to every computer, not only the one it is for"
        difficulty: 3
        hints: ["Compare a hub with a switch.", "Which one sends data only where it should go?"]
        solution: "Step 1: A switch sends data only to the right computer. Step 2: A hub sends it to all of them, filling the network with unneeded traffic."
        mistakes: {"A hub stores all the files": net_devices, "A hub converts data into light": net_media, "A hub needs Bluetooth": net_devices}
      - prompt: "Two school buildings are 2 km apart and need a fast link that loses very little data. Which medium fits best?"
        options: ["Optical fibre cable", "Bluetooth", "A UTP cable with RJ45", "A hub"]
        answer: "Optical fibre cable"
        difficulty: 3
        hints: ["Bluetooth reaches about 10 m.", "Which medium carries data as light?"]
        solution: "Step 1: The distance is long and loss must be low. Step 2: Optical fibre carries data as light through glass with minimal loss over long distances."
        mistakes: {"Bluetooth": net_types, "A UTP cable with RJ45": net_media, "A hub": net_devices}
      - prompt: Which is an Internet Service Provider?
        options:
        - BSNL
        - Firefox
        - GIMP
        - Kalzium
        answer: BSNL
        difficulty: 1
        hints:
        - It provides internet connections.
        - Jio and Airtel are others.
        solution: 'Step 1: Firefox is a browser; GIMP and Kalzium are software. Step 2: The connection company is left. Step 3: BSNL.'
        mistakes:
          Firefox: net_devices
      - prompt: Old telephones used which connectors?
        options:
        - RJ9 and RJ11
        - RJ45
        - USB-C
        - HDMI
        answer: RJ9 and RJ11
        difficulty: 2
        hints:
        - RJ45 is for network cables.
        - Telephones used smaller jacks.
        solution: 'Step 1: Network = RJ45. Step 2: Phones used smaller registered jacks. Step 3: RJ9 and RJ11.'
        mistakes:
          RJ45: net_media
      - prompt: Copper cables carry data as what kind of signals?
        options:
        - Analogue electrical signals
        - Light
        - Sound waves in air
        - Radio from satellites
        answer: Analogue electrical signals
        difficulty: 2
        hints:
        - Copper conducts electricity.
        - Optical fibre is the one that uses light.
        solution: 'Step 1: Fibre uses light. Step 2: Copper conducts electricity. Step 3: Analogue electrical signals.'
        mistakes:
          Light: it10_cable_kind
      - prompt: A smartwatch linked to a phone by Bluetooth is part of which network type?
        options:
        - PAN
        - LAN
        - WAN
        - Internet backbone
        answer: PAN
        difficulty: 2
        hints:
        - It is all around one person.
        - Bluetooth reaches only about 10 m.
        solution: 'Step 1: Devices are on one person. Step 2: Short range. Step 3: Personal Area Network.'
        mistakes:
          LAN: it10_net_size

  - code: it9.net.addresses_protocols
    title: MAC addresses, IP addresses and protocols
    after: [it9.net.building]
    notes: |
      Devices on a network need unique addresses, like postal addresses. MAC (Media Access Control)
      address: unique, assigned by the manufacturer; helps police trace lost or stolen devices; written in
      hexadecimal (16 symbols 0–9 and A–F) as six pairs, e.g. 00:1B:44:11:3A:B7; seen in Settings → Network
      or Wi-Fi → Details → Hardware Address. Binary uses 0 and 1, decimal 0–9. IP address: assigned to each
      device so devices can identify one another; can be changed. IPv4: four numbers separated by dots, each
      0–255 (256 values), e.g. 192.168.1.1. In home and lab networks addresses differ only in the last part
      (keep 192.168). IPv6 handles far more devices with hexadecimal addresses like
      2001:0db8:85a3:0000:0000:8a2e:0370:7334 (IPv4 is 32-bit). Protocols are common rules so that
      networking software on GNU/Linux, Apple and Windows can communicate, like traffic signs understood
      across countries. DHCP (Dynamic Host Configuration Protocol) assigns temporary addresses
      automatically. TCP/IP: rules for exchanging information. SSH (Secure Shell): remote login. HTTP
      (HyperText Transfer Protocol): transfers webpages; browsers use it. FTP (File Transfer Protocol):
      transfers files.
    explanations:
      text: "Every device has a fixed MAC address from the factory and an IP address on the network. Protocols are the shared rules, like DHCP for handing out IP addresses and HTTP for webpages."
      visual: "A MAC address is like your Aadhaar number: fixed and unique. An IP address is like your seat number in class: it can change if you move."
      step_by_step: "To check an IPv4 address: Step 1: are there exactly four numbers separated by dots? Step 2: is each number between 0 and 255? If both are yes, it is valid. 192.168.1.254 is valid; 192.168.1.256 is not."
      real_world: "When your phone joins the school Wi-Fi, DHCP gives it an IP address in a second without you doing anything."
    activity:
      type: sort
      prompt: Which protocol does the job?
      bins:
      - DHCP
      - HTTP
      - FTP
      - SSH
      items:
      - label: Gives your laptop an IP address automatically
        bin: DHCP
        clue: Dynamic Host Configuration.
        why: DHCP.
      - label: Brings webpages to your browser
        bin: HTTP
        clue: HyperText Transfer.
        why: HTTP.
      - label: Sends big files between computers
        bin: FTP
        clue: File Transfer.
        why: FTP.
      - label: Logs in to another computer remotely
        bin: SSH
        clue: Secure Shell.
        why: SSH.
      - label: A temporary address for a new phone on Wi-Fi
        bin: DHCP
        clue: Assigned on joining.
        why: DHCP.
      - label: Opening schoolwiki.in
        bin: HTTP
        clue: Browser.
        why: HTTP.
    lesson:
      - teach: 'Every device needs an address. The MAC (Media Access Control) address is fixed by the maker, written as six pairs of hexadecimal symbols (0–9, A–F), e.g. 00:1B:44:11:3A:B7. The IP address is given by the network and can change. IPv4: four numbers 0–255, e.g. 192.168.1.1. IPv6 allows far more devices.'
        picture:
          kind: compare
          columns:
          - title: MAC address
            points:
            - set by manufacturer
            - fixed
            - 00:1B:44:11:3A:B7
          - title: IP address
            points:
            - given by the network
            - can change
            - 192.168.1.1
          alt: MAC and IP addresses.
        check:
          prompt: Which address stays the same wherever your phone goes?
          options:
          - MAC address
          - IP address
          - Both change
          answer: MAC address
          why: The maker fixes it.
        ways:
        - style: real_world
          teach: 'Your name stays the same wherever you go; your seat number changes from classroom to classroom. A MAC (Media Access Control) address is like your name: fixed by the maker, six pairs of hexadecimal symbols (0-9, A-F), e.g. 00:1B:44:11:3A:B7. An IP address is like the seat: given by the network and can change. IPv4 uses four numbers 0-255 (192.168.1.1); IPv6 allows far more devices.'
      - teach: Protocols are shared rules so different systems can talk. DHCP gives IP addresses automatically; TCP/IP governs exchange; HTTP carries webpages; FTP moves files; SSH lets you log in to a distant computer securely.
        picture:
          kind: compare
          columns:
          - title: Addresses / web
            points:
            - 'DHCP: gives IPs'
            - 'HTTP: webpages'
          - title: Files / remote
            points:
            - 'FTP: file transfer'
            - 'SSH: remote login'
          alt: Common network protocols.
        check:
          prompt: Which protocol moves files between computers?
          options:
          - FTP
          - DHCP
          - HTTP
          answer: FTP
          why: File Transfer Protocol.
        ways:
        - style: step_by_step
          teach: 'Match each protocol to its job. Gives out IP addresses automatically: DHCP. The main rules for exchanging data: TCP/IP. Carries webpages: HTTP. Moves files between computers: FTP. Logs in to a distant computer securely: SSH. Protocols are shared rules, so different systems can talk.'
    items:
      - prompt: "Which is a valid IPv4 address?"
        options: ["192.168.1.254", "192.168.1.257", "192.168.1.256", "192.168.256.1"]
        answer: "192.168.1.254"
        difficulty: 1
        hints: ["Each number must be 0 to 255."]
        solution: "Only 192.168.1.254 has all parts within 0–255."
        mistakes: {"192.168.1.256": mac_ip}
      - prompt: "Who assigns a device's MAC address?"
        options: ["The manufacturer", "The user", "DHCP", "The internet service provider"]
        answer: "The manufacturer"
        difficulty: 1
        hints: ["It is fixed in the hardware."]
        solution: "The manufacturer."
        mistakes: {"DHCP": mac_ip}
      - prompt: "Which protocol assigns IP addresses automatically?"
        options: ["DHCP", "FTP", "HTTP", "SSH"]
        answer: "DHCP"
        difficulty: 1
        hints: ["Dynamic Host Configuration Protocol."]
        solution: "DHCP."
        mistakes: {"FTP": protocols}
      - prompt: "Web browsers work using which protocol?"
        options: ["HTTP", "FTP", "SSH", "DHCP"]
        answer: "HTTP"
        difficulty: 1
        hints: ["HyperText Transfer Protocol."]
        solution: "HTTP."
        mistakes: {"FTP": protocols}
      - prompt: "How many different values can each number in an IPv4 address take (0 to 255)?"
        answer: "256"
        check: "255 - 0 + 1"
        difficulty: 2
        hints: ["Count 0 as well."]
        solution: "256 values."
        mistakes: {"255": mac_ip}
      - prompt: "How many symbols does the hexadecimal system use?"
        answer: "16"
        check: "10 + 6"
        difficulty: 2
        hints: ["0–9 and A–F."]
        solution: "10 digits + 6 letters = 16."
        mistakes: {"10": mac_ip}
      - prompt: "Which protocol lets you log in to and control a faraway computer?"
        options: ["SSH", "HTTP", "DHCP", "FTP"]
        answer: "SSH"
        difficulty: 2
        hints: ["Secure Shell."]
        solution: "SSH."
        mistakes: {"HTTP": protocols}
      - prompt: "How can a GNU/Linux computer and a Windows computer exchange data on one network?"
        options: ["Their networking software follows common protocols", "They must use the same operating system", "They need the same MAC address", "They cannot"]
        answer: "Their networking software follows common protocols"
        difficulty: 2
        hints: ["Like traffic signs understood in every country."]
        solution: "Shared protocols make it possible."
        mistakes: {"They need the same MAC address": protocols}
      - prompt: "A MAC address like 00:1B:44:11:3A:B7 has how many pairs?"
        answer: "6"
        check: "6"
        difficulty: 2
        hints: ["Count the groups between colons."]
        solution: "Six pairs."
        mistakes: {"5": mac_ip}
      - prompt: "Why was IPv6 introduced?"
        options: ["To give addresses to far more devices as IoT grows", "To make addresses shorter", "To remove MAC addresses", "To stop using hexadecimal"]
        answer: "To give addresses to far more devices as IoT grows"
        difficulty: 3
        hints: ["IPv4 is only 32-bit."]
        solution: "IPv6 has a much larger address space."
        mistakes: {"To make addresses shorter": mac_ip}
      - prompt: "Why is 192.168.1.300 not a valid IPv4 address?"
        options: ["Each number can only be from 0 to 255", "It has too few dots", "IPv4 addresses cannot start with 192", "It uses decimal numbers"]
        answer: "Each number can only be from 0 to 255"
        difficulty: 3
        hints: ["Check each of the four numbers.", "What is the largest value one part can take?"]
        solution: "Step 1: Each of the four parts of an IPv4 address goes from 0 to 255. Step 2: 300 is too large, so the address is invalid."
        mistakes: {"It has too few dots": mac_ip, "IPv4 addresses cannot start with 192": mac_ip, "It uses decimal numbers": mac_ip}
      - prompt: "Your phone gets a new IP address at home and at school, but its MAC address stays the same. Why?"
        options: ["The MAC address is fixed by the maker; the network gives the IP address", "The phone changes its MAC address daily", "IP addresses are fixed by the maker", "MAC addresses only work at school"]
        answer: "The MAC address is fixed by the maker; the network gives the IP address"
        difficulty: 3
        hints: ["Who assigns each address?", "Which protocol hands out IP addresses?"]
        solution: "Step 1: The manufacturer sets the MAC address. Step 2: Each network's DHCP gives the device an IP address, so it changes from network to network."
        mistakes: {"The phone changes its MAC address daily": mac_ip, "IP addresses are fixed by the maker": protocols, "MAC addresses only work at school": mac_ip}
      - prompt: What does DHCP stand for?
        options:
        - Dynamic Host Configuration Protocol
        - Digital Home Computer Program
        - Data Hub Control Port
        - Direct HTTP Connection
        answer: Dynamic Host Configuration Protocol
        difficulty: 2
        hints:
        - It configures hosts (computers) automatically.
        - '''Dynamic'' means it can change.'
        solution: 'Step 1: It sets up computers on a network. Step 2: Addresses change (dynamic). Step 3: Dynamic Host Configuration Protocol.'
        mistakes:
          Data Hub Control Port: it10_protocol_job
      - prompt: Which IPv4 address is NOT valid?
        options:
        - 10.0.0.256
        - 10.0.0.25
        - 192.168.0.1
        - 172.16.5.4
        answer: 10.0.0.256
        difficulty: 2
        hints:
        - Each number must be 0 to 255.
        - Check the last number of each.
        solution: 'Step 1: Allowed range is 0–255. Step 2: 256 is too big. Step 3: 10.0.0.256.'
        mistakes:
          10.0.0.25: mac_ip
      - prompt: Where in GNU/Linux can you see a device's MAC address?
        options:
        - Settings → Network or Wi-Fi → Details → Hardware Address
        - File → New
        - Tools → Protect Sheet
        - Insert → Image
        answer: Settings → Network or Wi-Fi → Details → Hardware Address
        difficulty: 3
        hints:
        - It is a network setting.
        - The MAC is a hardware address.
        solution: 'Step 1: Open network settings. Step 2: Look at Details. Step 3: Hardware Address shows the MAC.'
        mistakes:
          Tools → Protect Sheet: it10_mac_vs_ip

  - code: it9.net.using_network
    title: Using the lab network and the internet
    after: [it9.net.addresses_protocols]
    notes: |
      Join Wi-Fi in GNU/Linux: Settings → Wi-Fi → turn on → choose a network under Visible Networks →
      enter password; DHCP assigns an IP address. Find the IP address with the Network Manager Applet
      (nm-applet) on the top panel → Wi-Fi Settings (or Wired) → Settings → Details. A static (fixed) IP is
      better for file transfer and other tasks: IPv4 tab → Manual → address e.g. 192.168.1.204 (last part
      any number 2–254; 0, 1 and 255 are reserved), netmask 255.255.255.0, gateway 192.168.1.1, DNS
      192.168.1.1, turn off Automatic DNS, Apply; keep 192.168.1. the same for all lab computers. Test with
      the terminal command ping followed by an IP address, e.g. ping 192.168.1.15. File transfer needs the
      file name, its location, the computer's IP address, and its username and password: Files → Other
      Locations → Connect to Server → ssh://192.168.1.15 → Connect → log in. Screen sharing uses the VNC
      protocol (no internet needed): on the sharing computer Settings → Sharing → Remote Desktop On, enable
      Legacy VNC Protocol; on the viewing computer open Remmina, choose VNC, type the IP, Enter; accept on
      the sharing computer. The internet is a huge network of networks. Servers are high-performance
      computers that provide data and services; websites are stored on them and reached by the server's IP
      address (e.g. 210.212.233.54 for CUSAT). Domain names (cusat.ac.in) are easy-to-remember names for
      IP addresses. IoT: smart TVs, refrigerators, washing machines, bulbs, fans and locks contain a
      microprocessor so they can connect to a network and be controlled from a distance.
    explanations:
      text: "Once on the network, a computer has an IP address you can use to ping it, copy files from it with SSH, or view its screen with VNC. On the internet, domain names stand in for hard-to-remember server IP addresses."
      visual: "A domain name is like a contact name in your phone: you tap 'Amma' instead of remembering the 10-digit number. cusat.ac.in stands for 210.212.233.54."
      step_by_step: "To fetch a file from another lab computer: Step 1: know its IP, username and password. Step 2: Files → Other Locations. Step 3: type ssh://192.168.1.15 in Connect to Server. Step 4: Connect and log in. Step 5: open the folder and copy the file."
      real_world: "A Wi-Fi smart bulb you switch on from your phone app is an IoT device on your home network."
    activity:
      type: sort
      prompt: 'Lab network 192.168.1.__ : can a computer use this last number?'
      bins:
      - Usable
      - Reserved
      items:
      - label: '204'
        bin: Usable
        clue: Is it between 2 and 254?
        why: 'Yes: 192.168.1.204 is fine.'
      - label: '15'
        bin: Usable
        clue: Between 2 and 254?
        why: Usable.
      - label: '2'
        bin: Usable
        clue: The lowest allowed.
        why: Usable.
      - label: '254'
        bin: Usable
        clue: The highest allowed.
        why: Usable.
      - label: '0'
        bin: Reserved
        clue: Is it in 2–254?
        why: 0 is reserved.
      - label: '255'
        bin: Reserved
        clue: One past the highest allowed.
        why: 255 is reserved.
      - label: '1'
        bin: Reserved
        clue: The gateway uses it.
        why: 1 is reserved (gateway 192.168.1.1).
    lesson:
      - teach: 'Join Wi-Fi: Settings → Wi-Fi → choose a network → password; DHCP gives an IP. For lab tasks, set a static IP: IPv4 → Manual, address 192.168.1.x (x from 2 to 254), netmask 255.255.255.0, gateway and DNS 192.168.1.1. Test with ping, e.g. ping 192.168.1.15.'
        picture:
          kind: flow
          steps:
          - IPv4 → Manual
          - Address 192.168.1.x
          - Netmask 255.255.255.0
          - Gateway & DNS 192.168.1.1
          - Apply, then ping
          alt: Setting a static IP in the lab.
        check:
          prompt: Which command tests if another computer replies?
          options:
          - ping
          - copy
          - print
          answer: ping
          why: ping sends a test message and waits for a reply.
        ways:
        - style: step_by_step
          teach: 'Set a static IP for a lab task. Step 1: open the network settings → IPv4 → Manual. Step 2: address 192.168.1.x, with x from 2 to 254. Step 3: netmask 255.255.255.0. Step 4: gateway and DNS 192.168.1.1. Step 5: test with ping, e.g. ping 192.168.1.15: if it replies, you''re connected. (On normal Wi-Fi, choose the network, type the password, and DHCP gives the IP.)'
      - teach: 'Share files over SSH: Files → Other Locations → Connect to Server → ssh://IP, then log in with that computer''s username and password. Share screens with VNC: turn on Remote Desktop (Legacy VNC) on one computer and connect from Remmina on another.'
        check:
          prompt: Which app views another computer's screen?
          options:
          - Remmina
          - GIMP
          - Kalzium
          answer: Remmina
          why: Remmina is a remote desktop client using VNC.
        ways:
        - style: step_by_step
          teach: 'Choose the tool by the job. Share files: Files → Other Locations → Connect to Server → ssh://IP, then log in with that computer''s username and password. See another computer''s screen: turn on Remote Desktop (Legacy VNC) on that computer, then connect to it from Remmina.'
      - teach: The internet is a network of networks. Websites live on servers reached by IP address; domain names (cusat.ac.in) are easy names for those addresses. IoT devices (smart TVs, bulbs, locks) have microprocessors so they can be controlled over a network.
        check:
          prompt: A domain name is
          options:
          - An easy name for a server's IP address
          - A type of cable
          - A Wi-Fi password
          answer: An easy name for a server's IP address
          why: Names are easier to remember than numbers.
        ways:
        - style: real_world
          teach: 'You save a friend''s number under their name, not the digits. Domain names do this for servers: cusat.ac.in is an easy name for a server''s IP address. The internet is a network of networks, with websites living on servers. IoT devices such as smart TVs, bulbs and locks have microprocessors, so they can be controlled over a network too.'
    items:
      - prompt: "Which command checks whether another computer on the network can be reached?"
        options: ["ping", "copy", "print", "save"]
        answer: "ping"
        difficulty: 1
        hints: ["Type it in the terminal followed by an IP address."]
        solution: "ping, e.g. ping 192.168.1.15."
        mistakes: {"copy": static_ip}
      - prompt: "An easy-to-remember name for a server's IP address, like cusat.ac.in, is a"
        options: ["Domain name", "MAC address", "Protocol", "Port"]
        answer: "Domain name"
        difficulty: 1
        hints: ["Every website has one."]
        solution: "A domain name."
        mistakes: {"MAC address": domain_iot}
      - prompt: "Which of these is NOT an IoT device?"
        options: ["USB cable", "Smart lock", "Smart television", "Voice assistant device"]
        answer: "USB cable"
        difficulty: 1
        hints: ["IoT devices contain a microprocessor and connect to a network."]
        solution: "A USB cable is not a smart device."
        mistakes: {"Smart lock": domain_iot}
      - prompt: "Which protocol and app are used to view another lab computer's screen?"
        options: ["VNC with Remmina", "FTP with GIMP", "HTTP with Calc", "DHCP with Writer"]
        answer: "VNC with Remmina"
        difficulty: 2
        hints: ["Enable Legacy VNC Protocol on the sharing computer."]
        solution: "VNC, viewed with Remmina."
        mistakes: {"FTP with GIMP": protocols}
      - prompt: "When assigning a static IP 192.168.1.x in the lab, which last numbers are allowed?"
        options: ["2 to 254", "0 to 255", "1 to 255", "0 to 1"]
        answer: "2 to 254"
        difficulty: 2
        hints: ["0, 1 and 255 are reserved."]
        solution: "Any number from 2 to 254."
        mistakes: {"0 to 255": static_ip}
      - prompt: "If 0, 1 and 255 are reserved, how many static addresses from 192.168.1.0 to 192.168.1.255 can lab computers use?"
        answer: "253"
        check: "256 - 3"
        difficulty: 3
        hints: ["There are 256 values in all."]
        solution: "256 − 3 = 253 (2 to 254)."
        mistakes: {"256": static_ip}
      - prompt: "What is typed in Connect to Server to open another computer's files with SSH?"
        options: ["ssh://192.168.1.15", "http://192.168.1.15", "ping 192.168.1.15", "192.168.1.15.ssh"]
        answer: "ssh://192.168.1.15"
        difficulty: 2
        hints: ["Start with the protocol name."]
        solution: "ssh:// followed by the IP address."
        mistakes: {"http://192.168.1.15": protocols}
      - prompt: "What makes a smart device different from an ordinary one?"
        options: ["It has a microprocessor so it can connect to a network and be controlled remotely", "It is bigger", "It uses more electricity", "It has no buttons"]
        answer: "It has a microprocessor so it can connect to a network and be controlled remotely"
        difficulty: 2
        hints: ["That is what IoT means."]
        solution: "The microprocessor lets it join a network."
        mistakes: {"It is bigger": domain_iot}
      - prompt: "Which of these is NOT needed to fetch a file from another lab computer?"
        options: ["Its MAC address", "Its IP address", "The file's location", "Its username and password"]
        answer: "Its MAC address"
        difficulty: 3
        hints: ["The textbook lists four things: name, location, IP, login."]
        solution: "The MAC address is not needed."
        mistakes: {"Its IP address": static_ip}
      - prompt: "Two lab computers were both given the static IP 192.168.1.20. What is likely to happen?"
        options: ["An address clash: one or both cannot connect properly", "They share files faster", "DHCP fixes it by changing the MAC address", "Nothing, addresses may repeat"]
        answer: "An address clash: one or both cannot connect properly"
        difficulty: 3
        hints: ["Why do devices need addresses at all?", "Can two houses share one postal address without confusion?"]
        solution: "Step 1: Each device needs a unique address so data reaches the right one. Step 2: Two with the same IP clash and the network cannot tell them apart."
        mistakes: {"They share files faster": static_ip, "DHCP fixes it by changing the MAC address": static_ip, "Nothing, addresses may repeat": static_ip}
      - prompt: "ping 192.168.1.15 gets no reply, but ping 192.168.1.16 replies. What can you say?"
        options: ["The computer at .15 cannot be reached right now", "The whole lab network is broken", "Your own computer has no IP address", "The internet is down"]
        answer: "The computer at .15 cannot be reached right now"
        difficulty: 3
        hints: ["One ping worked. What does that say about your own connection?", "Only one address did not answer."]
        solution: "Step 1: The reply from .16 shows your computer and the network work. Step 2: So the problem is with the computer at .15: it may be off or unplugged."
        mistakes: {"The whole lab network is broken": static_ip, "Your own computer has no IP address": static_ip, "The internet is down": domain_iot}
      - prompt: Which netmask is used for the lab's static IP setting?
        options:
        - 255.255.255.0
        - 192.168.1.1
        - 0.0.0.0
        - 255.0.0.0
        answer: 255.255.255.0
        difficulty: 2
        hints:
        - The lesson gives one netmask for the lab.
        - It ends in .0 and starts with 255.
        solution: 'Step 1: Gateway is 192.168.1.1. Step 2: The netmask is different. Step 3: 255.255.255.0.'
        mistakes:
          192.168.1.1: static_ip
      - prompt: What four things do you need to fetch a file from another lab computer?
        options:
        - File name, its location, the computer's IP, and its username and password
        - Only the MAC address
        - Only the Wi-Fi name
        - The printer's name
        answer: File name, its location, the computer's IP, and its username and password
        difficulty: 2
        hints:
        - You must know what, where, which computer and how to log in.
        - MAC address is not needed.
        solution: 'Step 1: Which file and where. Step 2: Which computer (IP). Step 3: Login details.'
        mistakes:
          Only the MAC address: it10_mac_vs_ip
      - prompt: Which is an IoT device?
        options:
        - A smart door lock controlled from a phone
        - A wooden chair
        - A paper notebook
        - A pencil
        answer: A smart door lock controlled from a phone
        difficulty: 1
        hints:
        - IoT devices connect to a network.
        - Which can be controlled from a distance?
        solution: 'Step 1: Chairs, notebooks and pencils have no processor. Step 2: A smart lock connects to a network. Step 3: The smart lock.'
        mistakes:
          A wooden chair: it10_iot_test
      - prompt: Lab computers are numbered 192.168.1.2 upward, one each. What is the largest number of lab computers this range can hold?
        answer: '253'
        check: 254 - 2 + 1
        difficulty: 3
        hints:
        - Allowed last numbers are 2 to 254.
        - Count from 2 to 254 inclusive.
        solution: 'Step 1: Range 2–254. Step 2: 254 − 2 + 1. Step 3: 253 computers.'
        mistakes:
          '252': it10_reserved
          '256': it10_reserved
