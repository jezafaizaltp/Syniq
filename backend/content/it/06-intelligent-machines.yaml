# Class 9 Information and Communications Technology, chapter 6. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 2 text supplied by the school. Topics: artificial intelligence, NLP, prompts, responsible AI.
subject: it
chapter: 6
title: Intelligent Machines

tips:
  ai_basics: "The term 'Artificial Intelligence' was first used at a summer conference in the mid-1950s by an American computer scientist (not Alan Turing). AI learns in three steps: collect data, spot patterns, decide. Telling a tiger from a deer is spotting patterns."
  ai_model: "An AI model is the trained part that learns from data and makes predictions, and it improves with more data. Language models predict what comes next in a sentence, and very big ones have a name that says they are large."
  nlp: "Spell out NLP word by word: everyday human language, being processed by a computer. Voice assistants that understand speech use it. The small pieces a sentence is split into share their name with the coins used in games."
  prompts: "Good instructions to an AI are specific, can set a role ('act as…'), and get refined and retried when the result is wrong. The word for this instruction also means to remind an actor of their line."
  responsible_ai: "Responsible AI means: don't hurt anyone, respect privacy, be honest that AI helped, and check what AI says, because it learns from data that can be wrong. Your own skills grow only with your own practice."
  ai_agent: "An AI agent coordinates several systems and finishes a whole task for you, like a travel agent who books tickets, rooms and food and pays."
  it6_three_steps: 'AI works in three stages: gather examples, learn the patterns in them, then act on new cases.'
  it6_ai_history: 'Check the history notes: who named AI, at which college, and in which year.'
  it6_model_meaning: A model is the trained 'brain' of an AI system, built by learning from lots of examples.
  it6_nlp_steps: NLP first splits a sentence into pieces, then studies its structure, then builds a reply.
  it6_good_prompt: 'A good prompt is specific: it says the task, the audience or persona, the context and the form of the answer.'
  it6_principle_match: "Ask what goes wrong in the situation: is someone hurt, are private details exposed, is credit hidden, or is a claim left unchecked?"
  it6_agent_many: An AI agent does a chain of tasks on its own, not just one answer.

concepts:
  - code: it9.ai.how_ai_works
    title: What AI is and how it works
    notes: |
      Example: drones with sensors and forest cameras scan the area to reduce human-wildlife conflict:
      watch animals, warn when they cross the forest boundary, count them, detect poaching. Artificial
      intelligence enables computers and machines to imitate human intelligence and problem-solving.
      The term was first used by American scientist John McCarthy at a 1956 workshop at Dartmouth College,
      New Hampshire (the Dartmouth Conference). Uses: road safety, device assistants, identifying people,
      classifying objects, translation, diagnosing disease, making drugs, weather forecasting, writing
      stories, drawing. Three steps: data collection (pictures of forest animals), pattern recognition
      (learns to tell tiger, elephant and deer apart), decision making (counts and identifies animals). An
      AI model is a program trained to analyse data and make predictions or decisions, the brain of an AI
      system, trained on large data for a task (thousands of animal images; millions of sentences for a
      chatbot like ChatGPT); models improve with new data. Language models predict words by finding
      patterns in human language; ChatGPT, Gemini and Meta AI work on them.
    explanations:
      text: "AI learns from lots of examples. It collects data, spots patterns, and then decides. The trained program that does this is called a model."
      visual: "Picture a child learning animals from a picture book: after seeing many tigers and elephants (data), they notice stripes versus trunks (patterns), and can then name a new animal (decision)."
      step_by_step: "For the forest drone: Step 1, data collection: take thousands of photos. Step 2, pattern recognition: learn the shapes of tigers, elephants and deer. Step 3, decision making: count them and warn when one crosses the boundary."
      real_world: "Your phone's photo app groups pictures of the same person: it learned faces from data, which is AI pattern recognition."
    activity:
      type: order
      prompt: A forest-camera AI that counts animals. Put its steps in order.
      steps:
      - 'Data collection: thousands of animal pictures'
      - 'Pattern recognition: tells tiger, elephant, deer apart'
      - 'Decision making: counts and names animals it sees'
      - Improves with new data
      reasons:
        'Pattern recognition: tells tiger, elephant, deer apart': It needs data before it can find patterns.
        'Decision making: counts and names animals it sees': It can only decide after it has learned the patterns.
        Improves with new data: New data helps a model that already works get better.
    lesson:
      - teach: 'Artificial intelligence lets machines imitate human thinking and problem-solving. John McCarthy first used the term at the Dartmouth Conference in 1956. Example: drones and forest cameras with AI watch animals, warn when they cross the boundary, count them and spot poachers.'
        check:
          prompt: Who first used the term 'Artificial Intelligence'?
          options:
          - John McCarthy
          - Ray Tomlinson
          - Guido van Rossum
          answer: John McCarthy
          why: He named it at Dartmouth in 1956.
        ways:
        - style: real_world
          teach: 'In Kerala''s forests, AI cameras and drones watch the wildlife: they warn when an elephant crosses the boundary, count the animals and spot poachers. That is artificial intelligence: machines imitating human thinking and problem-solving. John McCarthy first used the term at the Dartmouth Conference in 1956.'
      - teach: 'AI learns in three steps: data collection (many animal photos), pattern recognition (learns tiger vs elephant vs deer), decision making (counts and identifies animals in new photos).'
        picture:
          kind: flow
          steps:
          - Data collection
          - Pattern recognition
          - Decision making
          alt: Three steps of AI.
        check:
          prompt: Counting animals in a new photo is which step?
          options:
          - Decision making
          - Data collection
          - Pattern recognition
          answer: Decision making
          why: It uses what was learnt to act on new data.
        ways:
        - style: real_world
          teach: Think of how a child learns animals. First they see many animals (data collection). Then they notice stripes mean tiger and a trunk means elephant (pattern recognition). Then they name a new animal they have never seen before (decision making). An AI learns in the same three steps.
      - teach: 'An AI model is a program trained on lots of data to predict or decide: the ''brain'' of the system. More and better data improves it. Language models (behind ChatGPT, Gemini, Meta AI) predict the next words from patterns in human language.'
        check:
          prompt: What makes an AI model better?
          options:
          - Learning from more and better data
          - A bigger screen
          - Turning it off
          answer: Learning from more and better data
          why: Models improve as they see more examples.
        ways:
        - style: real_world
          teach: 'A student who practises with more, and better, questions gets better at exams. An AI model is similar: a program trained on lots of data to predict or decide, the ''brain'' of the system, and more and better data improves it. Language models behind ChatGPT, Gemini and Meta AI learn patterns in human language and predict the next words.'
    items:
      - prompt: "Who first used the term 'Artificial Intelligence'?"
        options: ["John McCarthy", "Alan Turing", "Guido van Rossum", "Ray Tomlinson"]
        answer: "John McCarthy"
        difficulty: 1
        hints: ["An American scientist, at Dartmouth."]
        solution: "John McCarthy."
        mistakes: {"Alan Turing": ai_basics}
      - prompt: "In which year was the Dartmouth Conference where the term AI was introduced?"
        answer: "1956"
        check: "1956"
        difficulty: 1
        hints: ["Mid-1950s."]
        solution: "1956."
        mistakes: {"1991": ai_basics}
      - prompt: "What are the three main steps by which AI systems learn and decide?"
        options: ["Data collection, pattern recognition, decision making", "Typing, printing, saving", "Drawing, colouring, exporting", "Asking, waiting, answering"]
        answer: "Data collection, pattern recognition, decision making"
        difficulty: 1
        hints: ["First gather information."]
        solution: "Collect data, recognise patterns, make decisions."
        mistakes: {"Typing, printing, saving": ai_basics}
      - prompt: "The drone's AI learns to tell a tiger from a deer. Which step is this?"
        options: ["Pattern recognition", "Data collection", "Decision making"]
        answer: "Pattern recognition"
        difficulty: 2
        hints: ["It is finding differences in the data."]
        solution: "Pattern recognition."
        mistakes: {"Decision making": ai_basics}
      - prompt: "What is an AI model?"
        options: ["A program trained on data to analyse it and make predictions or decisions", "A toy robot", "A computer screen", "A type of keyboard"]
        answer: "A program trained on data to analyse it and make predictions or decisions"
        difficulty: 2
        hints: ["It is called the brain of an AI system."]
        solution: "A trained program."
        mistakes: {"A toy robot": ai_model}
      - prompt: "What do language AI models predict?"
        options: ["Words", "Weather", "Earthquakes", "Exam marks"]
        answer: "Words"
        difficulty: 2
        hints: ["They find patterns in human language."]
        solution: "They predict words."
        mistakes: {"Weather": ai_model}
      - prompt: "Why does an AI model get better over time?"
        options: ["It keeps learning from new data", "Its screen gets bigger", "It is repainted", "It is turned off more often"]
        answer: "It keeps learning from new data"
        difficulty: 2
        hints: ["More examples, better accuracy."]
        solution: "New data improves its accuracy."
        mistakes: {"It is turned off more often": ai_model}
      - prompt: "A forest camera AI was trained only on daytime photos. At night it keeps missing elephants. Which step most needs improving?"
        options: ["Data collection: it needs night-time photos to learn from", "Decision making: it should sound the alarm more often", "Nothing: AI never makes mistakes", "The camera's colour"]
        answer: "Data collection: it needs night-time photos to learn from"
        difficulty: 3
        hints: ["An AI can only learn patterns that are in its data.", "What kind of photos did it never see?"]
        solution: "Step 1: Patterns are learnt from the data given. Step 2: With no night photos, it never learnt how elephants look at night, so it needs more varied data."
        mistakes: {"Decision making: it should sound the alarm more often": ai_basics, "Nothing: AI never makes mistakes": responsible_ai, "The camera's colour": ai_basics}
      - prompt: "A phone keyboard suggests 'morning' after you type 'Good'. What is the AI model doing?"
        options: ["Predicting the most likely next word from the text it learnt", "Reading your mind", "Copying what your friend typed", "Choosing a word at random"]
        answer: "Predicting the most likely next word from the text it learnt"
        difficulty: 3
        hints: ["What do language models predict?", "Which word often follows 'Good' in lots of text?"]
        solution: "Step 1: Language models are trained on a lot of text. Step 2: They predict the word most likely to come next, like 'morning' after 'Good'."
        mistakes: {"Reading your mind": ai_model, "Copying what your friend typed": ai_model, "Choosing a word at random": ai_model}
      - prompt: Where was the Dartmouth Conference held?
        options:
        - Dartmouth College, New Hampshire
        - University of California
        - Oxford
        - Kerala
        answer: Dartmouth College, New Hampshire
        difficulty: 2
        hints:
        - The conference is named after the college.
        - It is in a US state in New England.
        solution: 'Step 1: Dartmouth Conference → Dartmouth College. Step 2: It is in New Hampshire. Step 3: Dartmouth College, New Hampshire.'
        mistakes:
          University of California: it6_ai_history
      - prompt: Taking thousands of photos of forest animals to train the AI is which step?
        options:
        - Data collection
        - Pattern recognition
        - Decision making
        - Prompting
        answer: Data collection
        difficulty: 1
        hints:
        - It is the first step.
        - Nothing is learnt yet; examples are gathered.
        solution: 'Step 1: Photos are gathered. Step 2: That is before learning. Step 3: Data collection.'
        mistakes:
          Decision making: it6_three_steps
      - prompt: Which is a use of AI named in the lesson?
        options:
        - Diagnosing diseases
        - Boiling water
        - Sharpening pencils
        - Watering plants by hand
        answer: Diagnosing diseases
        difficulty: 1
        hints:
        - AI helps doctors.
        - It needs thinking and pattern-spotting.
        solution: 'Step 1: AI imitates thinking. Step 2: Doctors use it to read scans. Step 3: Diagnosing diseases.'
        mistakes:
          Boiling water: ai_basics
      - prompt: Which chatbot is named as working on a language model?
        options:
        - Gemini
        - GIMP
        - Kalzium
        - PictoBlox
        answer: Gemini
        difficulty: 2
        hints:
        - ChatGPT and Meta AI are others.
        - GIMP and Kalzium are not chatbots.
        solution: 'Step 1: Chatbots use language models. Step 2: GIMP, Kalzium, PictoBlox are other software. Step 3: Gemini.'
        mistakes:
          GIMP: it6_model_meaning
      - prompt: A chatbot is trained on millions of sentences. What is this training data used for?
        options:
        - Learning patterns in language
        - Storing photos
        - Charging the phone
        - Making the screen brighter
        answer: Learning patterns in language
        difficulty: 2
        hints:
        - Sentences teach how words go together.
        - Then it can predict words.
        solution: 'Step 1: Sentences show word patterns. Step 2: The model learns them. Step 3: Learning patterns in language.'
        mistakes:
          Storing photos: ai_model
      - prompt: A forest AI keeps mistaking wild boars for deer. What would most help?
        options:
        - Training it with more labelled boar and deer photos
        - Turning off the camera
        - Painting the drone
        - Using a bigger battery
        answer: Training it with more labelled boar and deer photos
        difficulty: 3
        hints:
        - Its pattern recognition is weak for these animals.
        - What does a model learn from?
        solution: 'Step 1: The model confuses two animals. Step 2: It needs more examples of both. Step 3: Train with more labelled photos.'
        mistakes:
          Using a bigger battery: it6_three_steps

  - code: it9.ai.nlp_prompts
    title: NLP and writing good prompts
    after: [it9.ai.how_ai_works]
    notes: |
      NLP (Natural Language Processing) is the branch of AI that helps computers understand, interpret
      and respond to human language; it combines linguistics with programming and machine learning. Steps:
      understanding the sentence (break into words or phrases, tokens), analysing the structure (grammar,
      syntax, relations), creating responses. Examples: Google Assistant, Amazon Alexa, chatbots,
      translation apps, game characters. Models trained on huge text with NLP are Large Language Models
      (LLMs). Many NLP systems handle Malayalam, but not all fully. A prompt is a sentence or question given
      to an NLP system; the more precise the prompt, the better the response. 'What is photosynthesis?'
      gives a general answer; adding 'Explain the light phase and the dark phase' gives detail; 'Act as a
      high school teacher' changes the style. Prompt tips: be clear and precise (not 'Tell me about history'
      but 'Explain the causes of World War II'); make the persona clear; provide context; use examples;
      test and refine. Prompt engineering is a growing job area. AI can write stories and poems and make
      images and videos (e.g. 'Draw an image of an Indian girl planting a tree'); re-prompt if the result is
      wrong. Anuvadini (AICTE) does translation. Learning uses: answering doubts any time, simplifying
      ('Act as a 14 year old student, explain transition elements'), language help. Don't let AI replace
      practising your own creative skills.
    explanations:
      text: "NLP is how computers understand our language. What you get back depends on your prompt: a clear, detailed prompt with a role and context gets a better answer."
      visual: "A prompt is like ordering at a hotel: 'food' gets you anything; 'two masala dosas, less spicy, for a child' gets exactly what you want."
      step_by_step: "To improve a prompt: Step 1: say exactly what you want (photosynthesis, light and dark phases). Step 2: give a persona (act as a high school teacher). Step 3: add context (for a Class 9 student). Step 4: read the answer and refine."
      real_world: "When you ask Google Assistant 'Will it rain in Kozhikode tomorrow?', NLP breaks your words into tokens, works out the meaning and replies."
    activity:
      type: sort
      prompt: Is it a good prompt or a weak one?
      bins:
      - Clear and precise
      - Too vague
      items:
      - label: Tell me about history
        bin: Too vague
        clue: Which history? What do you want?
        why: 'Vague: say exactly what you need.'
      - label: Explain the causes of World War II
        bin: Clear and precise
        clue: Does it name the topic and the task?
        why: Clear and precise.
      - label: What is photosynthesis?
        bin: Too vague
        clue: It gives only a general answer.
        why: Add detail, like the light and dark phases.
      - label: As a teacher, explain the light and dark phases
        bin: Clear and precise
        clue: Persona, topic, detail.
        why: Clear and precise.
      - label: Draw something nice
        bin: Too vague
        clue: Nice how?
        why: Vague.
      - label: Draw an Indian girl planting a tree
        bin: Clear and precise
        clue: Who, doing what.
        why: Clear.
    lesson:
      - teach: 'NLP (Natural Language Processing) helps computers understand and respond to human language. Steps: understand the sentence (break it into tokens), analyse its structure (grammar), create a response. Alexa, Google Assistant, chatbots and translation apps use NLP. Models trained on huge text are LLMs.'
        picture:
          kind: flow
          steps:
          - Break into tokens
          - Analyse structure
          - Create response
          alt: How NLP handles a sentence.
        check:
          prompt: What does NLP help computers do?
          options:
          - Understand human language
          - Draw pictures only
          - Cool down
          answer: Understand human language
          why: Natural language = the language people speak.
        ways:
        - style: step_by_step
          teach: 'Follow what happens when you ask a voice assistant a question. Step 1: understand the sentence by breaking it into small pieces called tokens. Step 2: analyse its structure (the grammar). Step 3: create a response. This is NLP, Natural Language Processing, used by Alexa, Google Assistant, chatbots and translation apps. Models trained on huge amounts of text are LLMs.'
      - teach: 'A prompt is what you ask the AI. Precise prompts get better answers. Tips: be clear, set a persona (''Act as a Class 9 teacher''), give context, give examples, test and refine. ''Tell me about history'' is vague; ''Explain the causes of World War II'' is precise.'
        picture:
          kind: compare
          columns:
          - title: Vague
            points:
            - Tell me about plants.
          - title: Precise
            points:
            - Act as a Class 9 teacher. Explain photosynthesis in 5 simple points.
          alt: A vague prompt and a precise prompt.
        check:
          prompt: Which prompt is better?
          options:
          - List 3 causes of soil erosion in Kerala
          - Tell me stuff
          - Soil?
          answer: List 3 causes of soil erosion in Kerala
          why: It is clear about task, number and place.
        ways:
        - style: step_by_step
          teach: 'Improve a prompt step by step. Start vague: ''Tell me about history.'' Step 1: be clear about what you want: ''Explain the causes of World War II.'' Step 2: set a persona: ''Act as a Class 9 teacher.'' Step 3: give context and, if useful, an example. Step 4: test the answer and refine the prompt. Precise prompts get better answers.'
      - teach: AI can write, draw and translate (Anuvadini by AICTE). Use it to clear doubts and simplify ideas, but keep practising your own writing and drawing; AI should not replace your skills.
        check:
          prompt: Why keep practising writing yourself?
          options:
          - Your own skills grow only with practice
          - AI is banned
          - Writing is boring
          answer: Your own skills grow only with practice
          why: AI helps, but you learn by doing.
        ways:
        - style: real_world
          teach: 'A calculator doesn''t make you good at mental maths; only practice does. AI is the same: it can write, draw and translate (like Anuvadini by AICTE), and it can clear doubts and simplify ideas. But keep practising your own writing and drawing, because AI should not replace your skills.'
    items:
      - prompt: "What does NLP stand for in AI?"
        options: ["Natural Language Processing", "New Learning Program", "Network Link Protocol", "Natural Logic Programming"]
        answer: "Natural Language Processing"
        difficulty: 1
        hints: ["It deals with human language."]
        solution: "Natural Language Processing."
        mistakes: {"New Learning Program": nlp}
      - prompt: "A sentence or question we give to an AI system to get a response is called a"
        options: ["Prompt", "Token", "Model", "Pixel"]
        answer: "Prompt"
        difficulty: 1
        hints: ["It is what you type into the chat box before the AI answers."]
        solution: "A prompt."
        mistakes: {"Token": prompts}
      - prompt: "Which of these is an NLP-based system?"
        options: ["Amazon Alexa", "A calculator", "A printer", "A USB drive"]
        answer: "Amazon Alexa"
        difficulty: 1
        hints: ["It understands spoken requests."]
        solution: "Alexa (also Google Assistant, chatbots)."
        mistakes: {"A calculator": nlp}
      - prompt: "Which prompt is clearer and more precise?"
        options: ["Explain the causes of World War II", "Tell me about history", "History?", "Say something"]
        answer: "Explain the causes of World War II"
        difficulty: 1
        hints: ["Avoid vague language."]
        solution: "It names exactly what is wanted."
        mistakes: {"Tell me about history": prompts}
      - prompt: "In NLP, breaking a sentence into words or phrases is called making"
        options: ["Tokens", "Pixels", "Layers", "Slides"]
        answer: "Tokens"
        difficulty: 2
        hints: ["It is the first step, understanding the sentence."]
        solution: "Tokens."
        mistakes: {"Pixels": nlp}
      - prompt: "Language models trained on very large amounts of text are called"
        options: ["Large Language Models (LLMs)", "Local Area Networks", "Learning Management Systems", "Logic Machines"]
        answer: "Large Language Models (LLMs)"
        difficulty: 2
        hints: ["ChatGPT and Gemini are examples."]
        solution: "LLMs."
        mistakes: {"Local Area Networks": ai_model}
      - prompt: "Adding 'Act as a high school teacher' to a prompt does what?"
        options: ["Sets a persona so the answer suits that style", "Makes the AI slower", "Translates it to Malayalam", "Deletes the answer"]
        answer: "Sets a persona so the answer suits that style"
        difficulty: 2
        hints: ["It tells the AI whose voice to use."]
        solution: "It gives a persona."
        mistakes: {"Makes the AI slower": prompts}
      - prompt: "An AI image tool draws the wrong picture for your prompt. What should you do?"
        options: ["Refine the prompt and try again", "Give up on AI forever", "Restart the computer", "Use a shorter, vaguer prompt"]
        answer: "Refine the prompt and try again"
        difficulty: 2
        hints: ["Test and refine."]
        solution: "Adjust the prompt and re-prompt."
        mistakes: {"Use a shorter, vaguer prompt": prompts}
      - prompt: "Which prompt will most likely give a useful study answer?"
        options: ["Act as a Class 9 teacher and explain photosynthesis in 5 simple points with one everyday example", "photosynthesis", "Tell me everything", "Explain plants"]
        answer: "Act as a Class 9 teacher and explain photosynthesis in 5 simple points with one everyday example"
        difficulty: 3
        hints: ["A good prompt is clear and precise.", "Does it say who the answer is for and what shape it should take?"]
        solution: "Step 1: Good prompts set a persona, a clear topic and a format. Step 2: Only one gives all three, so the AI knows exactly what to produce."
        mistakes: {"photosynthesis": prompts, "Tell me everything": prompts, "Explain plants": prompts}
      - prompt: "A translation app turns 'It is raining cats and dogs' into a sentence about animals falling. Which part of NLP went wrong?"
        options: ["Understanding the meaning of the sentence, not just its words", "Breaking the sentence into tokens", "Spelling the words", "Typing the sentence"]
        answer: "Understanding the meaning of the sentence, not just its words"
        difficulty: 3
        hints: ["The words were found correctly.", "The phrase is an idiom: its meaning is not in the separate words."]
        solution: "Step 1: The tokens were correct. Step 2: The app missed what the whole phrase means (heavy rain), so its understanding and analysis failed."
        mistakes: {"Breaking the sentence into tokens": nlp, "Spelling the words": nlp, "Typing the sentence": nlp}
      - prompt: Which is a translation tool named in the lesson?
        options:
        - Anuvadini
        - Kalzium
        - Scribus
        - PhET
        answer: Anuvadini
        difficulty: 2
        hints:
        - It is by AICTE.
        - '''Anuvad'' means translation.'
        solution: 'Step 1: Kalzium, Scribus, PhET do other jobs. Step 2: ''Anuvad'' = translate. Step 3: Anuvadini.'
        mistakes:
          Scribus: nlp
      - prompt: Analysing grammar and relations between words is which NLP step?
        options:
        - Analysing the structure
        - Creating responses
        - Collecting photos
        - Printing
        answer: Analysing the structure
        difficulty: 2
        hints:
        - It comes after breaking into tokens.
        - Grammar is about structure.
        solution: 'Step 1: Tokens first. Step 2: Then grammar and relations. Step 3: Analysing the structure.'
        mistakes:
          Creating responses: it6_nlp_steps
      - prompt: Which prompt sets a persona?
        options:
        - Act as a science teacher and explain gravity
        - Explain gravity
        - Gravity?
        - What is gravity in one word?
        answer: Act as a science teacher and explain gravity
        difficulty: 1
        hints:
        - A persona is a role for the AI.
        - Look for 'Act as'.
        solution: 'Step 1: A persona gives the AI a role. Step 2: ''Act as...'' does that. Step 3: Act as a science teacher.'
        mistakes:
          Explain gravity: it6_good_prompt
      - prompt: The job of designing good prompts for AI is called
        options:
        - Prompt engineering
        - Web hosting
        - Data entry
        - Photo editing
        answer: Prompt engineering
        difficulty: 1
        hints:
        - It is a growing job area.
        - Its name has 'prompt' in it.
        solution: 'Step 1: Prompts guide AI. Step 2: Designing them well is a skill. Step 3: Prompt engineering.'
        mistakes:
          Web hosting: prompts
      - prompt: Why might an NLP system struggle with some Malayalam sentences?
        options:
        - Not all systems are fully trained on Malayalam
        - Malayalam has no grammar
        - Computers can't show Malayalam
        - Malayalam is too short
        answer: Not all systems are fully trained on Malayalam
        difficulty: 3
        hints:
        - Models learn from the text they are trained on.
        - Less Malayalam text means weaker learning.
        solution: 'Step 1: Models learn from data. Step 2: Some have little Malayalam training. Step 3: They may not fully handle it.'
        mistakes:
          Malayalam has no grammar: it6_model_meaning

  - code: it9.ai.responsible
    title: Using AI responsibly and AI agents
    after: [it9.ai.nlp_prompts]
    notes: |
      AI answers come from training data and may not be true or accurate; some systems may serve the
      interests of their makers; verify before use. Key principles of responsible AI: avoid harm (no
      harmful or misleading content, no fake news), respect privacy (never share your or others' personal
      information with unsafe AI), be honest (give credit for AI help; don't pass it off as all your own),
      think critically (review and verify AI content). Use AI to enhance your abilities, not to replace
      practice. AI agents coordinate several systems and complete a task automatically, like a travel
      agent: 'Arrange a two-day trip to Munnar on 22nd' could book tickets, hotel, food and passes and pay.
    explanations:
      text: "AI can be wrong, so check its answers. Don't use it to harm or mislead, protect personal details, and say when AI helped you."
      visual: "Treat AI like a clever classmate who sometimes guesses: useful for ideas, but you still check the textbook."
      step_by_step: "Before using an AI answer in homework: Step 1: compare it with your textbook or a trusted site. Step 2: fix anything wrong. Step 3: write it in your own words. Step 4: mention that you used AI."
      real_world: "If an AI tool asks for your Aadhaar number or home address, don't give it."
    activity:
      type: sort
      prompt: Responsible use of AI?
      bins:
      - Responsible
      - Not responsible
      items:
      - label: Checking an AI answer in your textbook
        bin: Responsible
        clue: AI can be wrong.
        why: 'Think critically: verify.'
      - label: Handing in an AI essay as all your own
        bin: Not responsible
        clue: Who wrote it?
        why: 'Be honest: give credit.'
      - label: Typing a friend's phone number into an unknown AI app
        bin: Not responsible
        clue: Whose information is it?
        why: Respect privacy.
      - label: Asking AI to explain a hard topic, then practising yourself
        bin: Responsible
        clue: Help, not replacement.
        why: Use AI to enhance your abilities.
      - label: Using AI to make a fake news picture
        bin: Not responsible
        clue: Who could be harmed?
        why: 'Avoid harm: no fake news.'
      - label: Saying 'I used AI to help with this' in your project
        bin: Responsible
        clue: Honesty.
        why: Give credit.
    lesson:
      - teach: AI answers come from training data, so they can be wrong or biased, and some may serve their makers' interests. Always check important facts with trusted sources.
        check:
          prompt: Why check AI answers?
          options:
          - They can be wrong
          - They are always secret
          - They cost money
          answer: They can be wrong
          why: AI learns from data that may contain errors.
        ways:
        - style: real_world
          teach: A friend who has read only one newspaper may sound sure but still be wrong. AI learns from its training data, so its answers can be wrong or biased, and some may serve the interests of the company that made it. Before you use an important fact, check it with a trusted source.
      - teach: 'Four principles: avoid harm (no fake or harmful content), respect privacy (don''t share personal details with unsafe AI), be honest (say when AI helped), think critically (review and verify). Use AI to grow your abilities, not replace them.'
        picture:
          kind: compare
          columns:
          - title: Avoid harm / privacy
            points:
            - no fake news
            - no personal details
          - title: Honest / critical
            points:
            - credit AI help
            - check and verify
          alt: Principles of responsible AI.
        check:
          prompt: Saying 'AI helped me write this' follows which principle?
          options:
          - Be honest
          - Avoid harm
          - Respect privacy
          answer: Be honest
          why: You give credit for help received.
        ways:
        - style: step_by_step
          teach: 'Check your AI use against four principles. 1, avoid harm: no fake or harmful content. 2, respect privacy: don''t share personal details with unsafe AI. 3, be honest: say when AI helped you. 4, think critically: review and verify what it gives you. Use AI to grow your abilities, not to replace them.'
      - teach: 'An AI agent works like a travel agent: give one goal (''Plan a two-day Munnar trip on the 22nd'') and it books tickets, hotel, food and passes, and pays, by coordinating many systems.'
        check:
          prompt: An AI agent is different from a simple chatbot because it
          options:
          - Completes several tasks on its own
          - Only says hello
          - Has no internet
          answer: Completes several tasks on its own
          why: It carries out a chain of actions for a goal.
        ways:
        - style: step_by_step
          teach: 'See what an AI agent does with one goal: ''Plan a two-day Munnar trip on the 22nd.'' Step 1: it books the tickets. Step 2: it books the hotel. Step 3: it arranges food and passes. Step 4: it pays. It coordinates many systems on its own, like a travel agent, while a simple chatbot only answers.'
    items:
      - prompt: "Which is NOT a principle of responsible AI?"
        options: ["Trust AI blindly", "Avoid harm to others", "Respect privacy", "Be honest"]
        answer: "Trust AI blindly"
        difficulty: 1
        hints: ["We should think critically."]
        solution: "Never trust AI blindly."
        mistakes: {"Respect privacy": responsible_ai}
      - prompt: "Which best describes an AI agent?"
        options: ["An AI system that does several tasks together as needed, like booking tickets, rooms and food", "A system that only buys tickets", "A system that only books rooms", "A person who repairs computers"]
        answer: "An AI system that does several tasks together as needed, like booking tickets, rooms and food"
        difficulty: 1
        hints: ["Like a travel agent."]
        solution: "It coordinates many systems for one goal."
        mistakes: {"A system that only buys tickets": ai_agent}
      - prompt: "Why must AI answers be checked?"
        options: ["They come from training data and can be wrong", "AI never makes mistakes", "Checking is against the rules", "AI answers are always in Hindi"]
        answer: "They come from training data and can be wrong"
        difficulty: 1
        hints: ["Think critically."]
        solution: "AI can make mistakes or be biased."
        mistakes: {"AI never makes mistakes": responsible_ai}
      - prompt: "You used AI to help write your project. What is the honest thing to do?"
        options: ["Mention that AI helped", "Say it is all your own work", "Hide the file", "Copy it without reading"]
        answer: "Mention that AI helped"
        difficulty: 2
        hints: ["Be honest: give credit."]
        solution: "Give credit for AI help."
        mistakes: {"Say it is all your own work": responsible_ai}
      - prompt: "Using AI to make a fake news video about a classmate breaks which principle?"
        options: ["Avoid harm", "Think critically", "Use examples", "Test and refine"]
        answer: "Avoid harm"
        difficulty: 2
        hints: ["It hurts and misleads others."]
        solution: "It breaks 'avoid harm' (and respect privacy)."
        mistakes: {"Use examples": responsible_ai}
      - prompt: "Why does the textbook warn against using AI for all your stories and drawings?"
        options: ["Your own creative skills grow only through practice", "AI drawings are illegal", "Stories cannot be written by AI", "AI is too slow"]
        answer: "Your own creative skills grow only through practice"
        difficulty: 2
        hints: ["Use AI to enhance, not replace, your abilities."]
        solution: "Too much AI use can stop your own skills from growing."
        mistakes: {"AI drawings are illegal": responsible_ai}
      - prompt: "An AI chatbot gives you a date for an exam that differs from the school notice. What should you do?"
        options: ["Trust the school notice and check with the teacher", "Trust the AI because it knows more", "Average the two dates", "Ask the AI again until it agrees"]
        answer: "Trust the school notice and check with the teacher"
        difficulty: 3
        hints: ["Where does an AI's answer come from?", "Which source is official?"]
        solution: "Step 1: AI answers come from training data and can be wrong or old. Step 2: Verify with the official source: the school notice and the teacher."
        mistakes: {"Trust the AI because it knows more": responsible_ai, "Average the two dates": responsible_ai, "Ask the AI again until it agrees": responsible_ai}
      - prompt: "Which task needs an AI agent rather than a simple chatbot answer?"
        options: ["Finding a train, booking the seat and adding it to your calendar", "Telling you the capital of Kerala", "Explaining what a noun is", "Translating one word"]
        answer: "Finding a train, booking the seat and adding it to your calendar"
        difficulty: 3
        hints: ["An agent does several connected tasks.", "Which choice has more than one action?"]
        solution: "Step 1: An AI agent carries out several tasks together as needed. Step 2: Searching, booking and adding to a calendar are three linked actions."
        mistakes: {"Telling you the capital of Kerala": ai_agent, "Explaining what a noun is": ai_agent, "Translating one word": ai_agent}
      - prompt: Typing your friend's phone number and address into an unknown AI app breaks which principle?
        options:
        - Respect privacy
        - Be honest
        - Think critically
        - Avoid harm only
        answer: Respect privacy
        difficulty: 2
        hints:
        - Whose details are shared?
        - Personal information should stay protected.
        solution: 'Step 1: The details are personal. Step 2: Sharing them with an unsafe app is risky. Step 3: Respect privacy.'
        mistakes:
          Be honest: it6_principle_match
      - prompt: An AI tells you a famous scientist was born in a year that your textbook disagrees with. Which principle do you use?
        options:
        - Think critically and verify
        - Avoid harm
        - Respect privacy
        - Trust the AI
        answer: Think critically and verify
        difficulty: 2
        hints:
        - Two sources disagree.
        - What should you do before believing either?
        solution: 'Step 1: AI can be wrong. Step 2: Compare with trusted sources. Step 3: Think critically and verify.'
        mistakes:
          Trust the AI: it6_principle_match
      - prompt: Which request suits an AI agent?
        options:
        - Book my bus, hotel and lunch for Saturday's trip
        - What is 2 + 2?
        - Spell 'elephant'
        - Say hello
        answer: Book my bus, hotel and lunch for Saturday's trip
        difficulty: 2
        hints:
        - Agents handle many linked tasks.
        - Which request has several steps?
        solution: 'Step 1: Simple questions need one answer. Step 2: Booking needs many actions. Step 3: The trip request.'
        mistakes:
          What is 2 + 2?: it6_agent_many
      - prompt: Why might some AI answers be biased?
        options:
        - They can reflect their training data or their makers' interests
        - AI is always neutral
        - Bias is impossible in computers
        - Because the screen is small
        answer: They can reflect their training data or their makers' interests
        difficulty: 3
        hints:
        - Where does AI learn from?
        - Who builds it?
        solution: 'Step 1: AI learns from data people made. Step 2: Makers set its goals. Step 3: Both can add bias.'
        mistakes:
          AI is always neutral: responsible_ai
      - prompt: Copying an AI-written essay and calling it entirely yours is
        options:
        - Dishonest
        - Responsible
        - Creative practice
        - Required
        answer: Dishonest
        difficulty: 1
        hints:
        - Did you write it?
        - One principle is about honesty.
        solution: 'Step 1: The AI wrote it. Step 2: Claiming it as yours hides that. Step 3: Dishonest.'
        mistakes:
          Responsible: it6_principle_match
      - prompt: Making a fake video of a teacher saying something rude breaks which principle?
        options:
        - Avoid harm
        - Think critically
        - Be honest only
        - None
        answer: Avoid harm
        difficulty: 1
        hints:
        - Fake content can hurt people.
        - It spreads false information.
        solution: 'Step 1: The video is fake and hurtful. Step 2: It can damage someone. Step 3: Avoid harm.'
        mistakes:
          None: it6_principle_match
      - prompt: How should a student best use AI for learning?
        options:
        - To clear doubts and practise more, while still doing their own work
        - To do all homework without reading
        - To avoid thinking
        - To copy answers in exams
        answer: To clear doubts and practise more, while still doing their own work
        difficulty: 2
        hints:
        - AI should enhance, not replace, your abilities.
        - Which option keeps you learning?
        solution: 'Step 1: AI can explain and quiz. Step 2: You still practise. Step 3: Use it to help, not to replace you.'
        mistakes:
          To do all homework without reading: responsible_ai
