# Class 9 Information and Communications Technology, chapter 8. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 2 text supplied by the school. Software: LibreOffice Impress.
subject: it
chapter: 8
title: The Infinite Scope of Presentation

tips:
  impress_basics: "Pictures go in from the Insert menu. Animations are in the sidebar. Short bullet points leave room for the speaker. Presentation skill improves with practice, and you still need to know Impress to fix what AI makes. Google's online tool for slides lets people work together."
  master_slide: "A master slide is a template that sets the layout and style for many slides. Open it with Master View (Slide Properties), design titles, shapes, date, footer and slide number, then Close Master View. Change the master once and every slide using it changes. Transitions are not set by the master."
  master_use: "A master slide is a design template: applying it changes the look and keeps your content. You change it from the Slide menu."
  slide_number: "Slide numbers, date and time are 'fields' that update by themselves. Find Field in the Insert menu."
  infographics: "Info + graphics: information shown with pictures. Ready-made diagrams are in the sidebar's Gallery. Hidden shapes are fixed by changing the stacking order from the right-click menu. Percentages of a whole add up to 100. LibreOffice's drawing program can make them too."
  it8_plan_first: 'Good talks are planned before the software is opened: gather material and sketch a storyboard.'
  it8_less_text: Slides support the speaker; they should not hold every word. Short points and pictures work best.
  it8_master_all: A change on a master slide shows on every slide that uses that master, and only those.
  it8_master_cannot: Masters hold layout, fonts, backgrounds, footers and numbers. Movement between slides is set elsewhere.
  it8_field_menu: Automatic slide numbers, dates and titles are inserted as fields.
  it8_percent_rest: All parts of a whole add to 100%. Take away the parts you know.
  it8_percent_of: To find a percentage of a number, multiply the number by the percentage and divide by 100.

concepts:
  - code: it9.present.planning
    title: Planning a presentation and adding images and text
    notes: |
      A good presentation shows ideas systematically by combining text, images, audio and video,
      presents complex information simply, and varies communication styles. Presentation skills are an
      important soft skill that anyone can develop with practice. Prepare first: collect information,
      images and videos; make a storyboard. Starting with a thought-provoking image is attractive: choose
      a Blank Slide layout, Insert Image icon or Insert → Image (Intro.png), resize. Add a title with a text
      box (Insert → Text Box), choose font, size and colour, then select the text, open Animation in the
      sidebar, click + and choose Category and Effect. Bullet lists keep slide content short so the
      presenter can explain. Charts show data analysis. Collaborative online platforms: Google Slides,
      Prezi, Canva, Slidesgo. Public speaking platforms: TEDx, YouTube, Toastmasters; Malala Yousafzai and
      Greta Thunberg share ideas worldwide. AI tools can make presentations in minutes, but you need Impress
      skills to correct them.
    explanations:
      text: "Plan first, then build. Open with a strong picture, add a clear title, and keep slides short with bullet points so you do the explaining."
      visual: "A storyboard is a row of boxes drawn on paper, one per slide, with a quick sketch and a few words in each. It is the map of your talk."
      step_by_step: "To animate a title: Step 1: Insert → Text Box and type it. Step 2: select the text. Step 3: open Animation in the sidebar. Step 4: click +. Step 5: pick a Category and Effect."
      real_world: "Teachers on KITE VICTERS use slides with one big image and a few words so viewers stay focused on the speaker."
    activity:
      type: order
      prompt: Plan a presentation. Put the steps in order.
      steps:
      - Collect information, images and videos
      - Make a storyboard
      - Insert an opening image on a blank slide
      - Add a title text box and an animation
      - Present, and explain the short bullet points
      reasons:
        Make a storyboard: You plan the order of slides once you have material.
        Insert an opening image on a blank slide: Build slides only after the storyboard.
        Add a title text box and an animation: Text and animation go on a slide that already exists.
        Present, and explain the short bullet points: Presenting comes last.
    lesson:
      - teach: A good presentation combines text, images, audio and video to explain ideas simply. Before opening Impress, collect information and images and make a storyboard (a plan of each slide).
        picture:
          kind: flow
          steps:
          - Collect information
          - Collect images and videos
          - Make a storyboard
          - Build slides in Impress
          alt: Planning a presentation.
        check:
          prompt: What should you make before building slides?
          options:
          - A storyboard
          - A spreadsheet
          - A password
          answer: A storyboard
          why: It plans what goes on each slide.
      - teach: Start with a striking image on a Blank Slide (Insert → Image). Add a title with Insert → Text Box. Animate it from the sidebar's Animation panel (+, then Category and Effect). Use short bullet points and charts so you can explain the rest aloud.
        check:
          prompt: Where do you add an animation effect?
          options:
          - Animation in the sidebar
          - File → Save
          - Tools → Protect
          answer: Animation in the sidebar
          why: The sidebar's Animation panel holds the effects.
      - teach: 'Presentation skill is a soft skill that improves with practice. Online tools: Google Slides, Prezi, Canva, Slidesgo. Speakers share ideas on TEDx, YouTube and Toastmasters. AI can draft slides fast, but you need Impress skills to fix them.'
        check:
          prompt: Presentation skills are
          options:
          - A soft skill that improves with practice
          - Something you are born with or not
          - Only for teachers
          answer: A soft skill that improves with practice
          why: Anyone can get better with practice.
    items:
      - prompt: "Which menu option inserts a picture into an Impress slide?"
        options: ["Insert → Image", "Slide → New Slide", "Format → Character", "Tools → Spelling"]
        answer: "Insert → Image"
        difficulty: 1
        hints: ["There is also an icon on the toolbar."]
        solution: "Insert → Image."
        mistakes: {"Slide → New Slide": impress_basics}
      - prompt: "Where do you add an animation to selected text in Impress?"
        options: ["Animation in the sidebar", "File → Export", "Insert → Field", "Slide → Change Slide Master"]
        answer: "Animation in the sidebar"
        difficulty: 1
        hints: ["Click + and choose an effect."]
        solution: "Sidebar → Animation."
        mistakes: {"Insert → Field": impress_basics}
      - prompt: "Why use bullet lists on slides?"
        options: ["To keep content short so the presenter can explain more", "To fill the slide with text", "To hide information", "To make the file larger"]
        answer: "To keep content short so the presenter can explain more"
        difficulty: 1
        hints: ["Slides should be concise and suggestive."]
        solution: "They list main ideas briefly."
        mistakes: {"To fill the slide with text": impress_basics}
      - prompt: "Which is an online collaborative platform for presentations?"
        options: ["Google Slides", "Kalzium", "GIMP", "gImageReader"]
        answer: "Google Slides"
        difficulty: 2
        hints: ["Prezi and Canva are others."]
        solution: "Google Slides."
        mistakes: {"Kalzium": impress_basics}
      - prompt: "Presentation skills are best described as"
        options: ["A soft skill anyone can improve with practice", "A skill only for computer engineers", "Something you are born with or not", "Only for teachers"]
        answer: "A soft skill anyone can improve with practice"
        difficulty: 2
        hints: ["Technical skills depend on the field; this one does not."]
        solution: "A soft skill developed through practice."
        mistakes: {"Something you are born with or not": impress_basics}
      - prompt: "AI can now make a whole presentation in minutes. Why still learn Impress?"
        options: ["You need to understand the software to check and correct what AI makes", "AI presentations cannot be opened", "Impress is required by law", "AI cannot add images"]
        answer: "You need to understand the software to check and correct what AI makes"
        difficulty: 2
        hints: ["AI output needs correcting."]
        solution: "Only someone who knows the software can fix AI-made slides."
        mistakes: {"AI cannot add images": impress_basics}
      - prompt: "Your slide has 12 long sentences in small font. What is the best change?"
        options: ["Keep a few short bullet points and an image, and say the rest aloud", "Make the font even smaller to fit more", "Add more animations to each sentence", "Split each sentence onto a new slide"]
        answer: "Keep a few short bullet points and an image, and say the rest aloud"
        difficulty: 3
        hints: ["What are bullet points on a slide for?", "Who should do most of the explaining?"]
        solution: "Step 1: Slides should show short points and visuals. Step 2: The presenter explains the details, so cut the text to a few bullets and add an image."
        mistakes: {"Make the font even smaller to fit more": impress_basics, "Add more animations to each sentence": impress_basics, "Split each sentence onto a new slide": impress_basics}
      - prompt: "Before opening Impress for a talk on water saving, what should you prepare first?"
        options: ["A storyboard with the information and images you will use", "The slide transitions", "The final font colours", "The printed handouts"]
        answer: "A storyboard with the information and images you will use"
        difficulty: 3
        hints: ["Planning comes before designing.", "What helps you decide the order of slides?"]
        solution: "Step 1: Collect information, images and videos. Step 2: Make a storyboard to plan the flow; then build the slides in Impress."
        mistakes: {"The slide transitions": impress_basics, "The final font colours": impress_basics, "The printed handouts": impress_basics}
      - prompt: Which menu option adds a text box?
        options:
        - Insert → Text Box
        - Slide → New Slide
        - Format → Bullets
        - Tools → Options
        answer: Insert → Text Box
        difficulty: 1
        hints:
        - You are adding something to the slide.
        - It is under Insert.
        solution: 'Step 1: Text boxes are inserted. Step 2: The Insert menu has them. Step 3: Insert → Text Box.'
        mistakes:
          Slide → New Slide: impress_basics
      - prompt: Which slide layout is best for starting with a full-screen image?
        options:
        - Blank Slide
        - Title, Content
        - Title Only with a list
        - Two Content
        answer: Blank Slide
        difficulty: 2
        hints:
        - You don't want empty placeholder boxes.
        - Start with nothing on the slide.
        solution: 'Step 1: Placeholders get in the way of a big image. Step 2: An empty layout avoids them. Step 3: Blank Slide.'
        mistakes:
          Title, Content: it8_plan_first
      - prompt: Which platform is known for public speaking clubs?
        options:
        - Toastmasters
        - Slidesgo
        - Kalzium
        - GIMP
        answer: Toastmasters
        difficulty: 2
        hints:
        - Members practise speeches together.
        - It is not a slide-making tool.
        solution: 'Step 1: Slidesgo makes slides; Kalzium and GIMP are other software. Step 2: The speaking club is left. Step 3: Toastmasters.'
        mistakes:
          Slidesgo: impress_basics
      - prompt: Why are charts useful in a presentation?
        options:
        - They show data analysis at a glance
        - They hide information
        - They make slides load slowly
        - They replace the speaker
        answer: They show data analysis at a glance
        difficulty: 1
        hints:
        - Think of numbers in a picture.
        - The audience sees patterns quickly.
        solution: 'Step 1: Data is hard to read as text. Step 2: Charts show it visually. Step 3: At a glance.'
        mistakes:
          They replace the speaker: it8_less_text
      - prompt: Who is named as using public platforms to share ideas worldwide?
        options:
        - Greta Thunberg
        - Ward Cunningham
        - John McCarthy
        - Ray Tomlinson
        answer: Greta Thunberg
        difficulty: 2
        hints:
        - She is a young climate activist.
        - Malala Yousafzai is the other example.
        solution: 'Step 1: The others are computer pioneers. Step 2: The lesson names Malala and a climate activist. Step 3: Greta Thunberg.'
        mistakes:
          John McCarthy: impress_basics
      - prompt: In the Animation panel, after clicking +, what do you choose?
        options:
        - Category and Effect
        - Font and Size
        - Row and Column
        - Password and Username
        answer: Category and Effect
        difficulty: 2
        hints:
        - Animations are sorted into kinds.
        - Then you pick one from that kind.
        solution: 'Step 1: Click +. Step 2: Choose the type of animation. Step 3: Category and Effect.'
        mistakes:
          Font and Size: impress_basics
      - prompt: A classmate's slides are full of paragraphs read aloud word for word. What advice fits the lesson?
        options:
        - Use short bullet points and images, and explain in your own words
        - Add more paragraphs
        - Use smaller fonts
        - Remove all images
        answer: Use short bullet points and images, and explain in your own words
        difficulty: 3
        hints:
        - Slides should be short.
        - The speaker explains the detail.
        solution: 'Step 1: Long text bores the audience. Step 2: Short points guide them. Step 3: Speak the rest yourself.'
        mistakes:
          Add more paragraphs: it8_less_text

  - code: it9.present.master_slides
    title: Master slides
    after: [it9.present.planning]
    notes: |
      Adding numbers and titles to each slide by hand takes time. Master slides are template slides that
      are the basis for all slides; they give all slides the same style; to change the layout, change the
      master. To prepare: insert a new slide, choose the Title, Content layout, click Master View
      (Sidebar → Slide Properties). Master View has positions for text levels, date and time, footer and
      slide number. Format titles (e.g. Heading 1 Anek Malayalam, blue, bold). Add designs with shapes from
      the Drawing toolbar or Insert → Shapes (rectangle, Moon from Symbol Shapes); colour with Area and
      Line in Properties; drag handles to resize. Slide design: consistent theme, key information first,
      no clutter, use blank space, complementary colours for readability. Insert → Field → Slide Number
      (also Date, Time, Slide Title) numbers all slides. Close Master View (click outside any selected
      object if it is not visible). Masters are named Default 1, Default 2...; right-click in the Slide
      Pane for Rename Master or Delete Master. Master slides do not appear among the normal slides. To use:
      Slide → New Slide, then Slide → Change Slide Master and choose, or pick it in Slide Properties.
      Applying a master keeps the slide's content and applies the design. Slide transitions are not set by
      the master.
    explanations:
      text: "A master slide is the design template behind your slides. Put the colours, shapes, fonts and slide number on it once, and every slide using it looks the same."
      visual: "Think of a letterhead: the school logo, address and border are printed once, and every letter written on it carries them."
      step_by_step: "To build a master: Step 1: add a slide with Title, Content layout. Step 2: open Master View. Step 3: set title fonts and colours. Step 4: add shapes. Step 5: Insert → Field → Slide Number. Step 6: Close Master View."
      real_world: "Company presentations all have the same logo and colours on every slide because they use one master slide."
    activity:
      type: sort
      prompt: Set it on the master slide or on one slide?
      bins:
      - Master slide
      - Each slide itself
      items:
      - label: Slide numbers on every slide
        bin: Master slide
        clue: Same for all slides.
        why: Insert → Field → Slide Number in Master View.
      - label: The title font and colour for every slide
        bin: Master slide
        clue: Same style everywhere.
        why: Master.
      - label: A design shape in the corner of every slide
        bin: Master slide
        clue: Repeats on all.
        why: Master.
      - label: A slide transition
        bin: Each slide itself
        clue: The master does not set it.
        why: Transitions are not set by the master.
      - label: The text of slide 4's bullet points
        bin: Each slide itself
        clue: Different on every slide.
        why: Content belongs to each slide.
      - label: A photo on only slide 2
        bin: Each slide itself
        clue: Only once.
        why: Put it on that slide.
    lesson:
      - teach: 'Master slides are templates that set the design for all slides using them: title style, background, shapes, footer, date and slide number. Change the master once, and every slide using it changes. Open Master View from Sidebar → Slide Properties.'
        check:
          prompt: You make the master's title red. Which slides change?
          options:
          - All slides using that master
          - Only the first slide
          - None
          answer: All slides using that master
          why: The master controls their design.
      - teach: In Master View, add shapes (Insert → Shapes) and colour them with Area and Line. Add slide numbers with Insert → Field → Slide Number. Masters are named Default 1, Default 2; right-click to rename or delete. Masters don't appear as normal slides. Transitions are not set by the master.
        picture:
          kind: compare
          columns:
          - title: Master can set
            points:
            - title font and colour
            - background shapes
            - footer, date, slide number
          - title: Master cannot set
            points:
            - slide transitions
            - each slide's own content
          alt: What a master slide controls.
        check:
          prompt: Which is NOT set by a master slide?
          options:
          - Slide transitions
          - Title colour
          - Slide number position
          answer: Slide transitions
          why: Transitions are set slide by slide.
      - teach: 'To use a master: Slide → New Slide, then Slide → Change Slide Master (or choose in Slide Properties). The slide keeps its content and takes the master''s design. Good design: consistent theme, key point first, no clutter, white space, readable colours.'
        check:
          prompt: Applying a master to a filled slide
          options:
          - Keeps the content, changes the design
          - Deletes the content
          - Changes nothing
          answer: Keeps the content, changes the design
          why: Masters change look, not content.
    items:
      - prompt: "What is the main use of master slides?"
        options: ["To define the overall layout and style used by other slides", "To give each slide a different animation", "To control navigation", "To delete slides"]
        answer: "To define the overall layout and style used by other slides"
        difficulty: 1
        hints: ["They are templates."]
        solution: "They set a common layout and style."
        mistakes: {"To give each slide a different animation": master_slide}
      - prompt: "How do you add a slide number in Impress?"
        options: ["Insert → Field → Slide Number", "Format → Bullets", "Slide → Delete", "Tools → Options"]
        answer: "Insert → Field → Slide Number"
        difficulty: 1
        hints: ["It is a field."]
        solution: "Insert → Field → Slide Number."
        mistakes: {"Format → Bullets": slide_number}
      - prompt: "Which of these cannot be set using a master slide?"
        options: ["Slide transitions", "Background colour", "Font size and colour", "Paragraph style"]
        answer: "Slide transitions"
        difficulty: 2
        hints: ["Masters control the look, not how slides change."]
        solution: "Transitions are set separately."
        mistakes: {"Background colour": master_slide}
      - prompt: "What happens when you apply a master slide to a slide that already has content?"
        options: ["The design is applied and the content is kept", "All content is deleted", "Only the content is hidden", "The slide is duplicated"]
        answer: "The design is applied and the content is kept"
        difficulty: 2
        hints: ["Your text is not lost."]
        solution: "The design changes; content stays."
        mistakes: {"All content is deleted": master_use}
      - prompt: "Which option lets you pick a master for a new slide?"
        options: ["Slide → Change Slide Master", "Insert → Image", "File → Save", "Format → Character"]
        answer: "Slide → Change Slide Master"
        difficulty: 2
        hints: ["It is in the Slide menu."]
        solution: "Slide → Change Slide Master."
        mistakes: {"Insert → Image": master_use}
      - prompt: "Close Master View is not visible. What is the likely reason?"
        options: ["An object or text frame on the slide is selected", "The file is not saved", "There are too many slides", "The slide has no title"]
        answer: "An object or text frame on the slide is selected"
        difficulty: 3
        hints: ["Click outside the slide."]
        solution: "Deselect by clicking outside the slide."
        mistakes: {"The file is not saved": master_slide}
      - prompt: "You have 12 slides using one master. You change the title colour on the master. How many slides change?"
        answer: "12"
        check: "12"
        difficulty: 2
        hints: ["Every slide using that master."]
        solution: "All 12."
        mistakes: {"1": master_slide}
      - prompt: "A presentation has 15 slides: 10 use master A and 5 use master B. You add a logo to master B. How many slides show the logo?"
        answer: "5"
        check: "15 - 10"
        difficulty: 3
        hints: ["A change to a master shows only on slides that use that master."]
        solution: "Step 1: Only slides based on master B get the change. Step 2: That is 5 slides."
        mistakes: {"15": master_use, "10": master_use}
      - prompt: "You typed the school name on every slide one by one. Later the name must change. What would have been better?"
        options: ["Put the name in the master slide's footer once", "Use a bigger font", "Add it as a slide transition", "Write it in the notes"]
        answer: "Put the name in the master slide's footer once"
        difficulty: 3
        hints: ["Which slide is the base for all the others?", "Change once, change everywhere."]
        solution: "Step 1: Items on the master appear on every slide using it. Step 2: Putting the name in the master's footer means one change updates every slide."
        mistakes: {"Use a bigger font": master_slide, "Add it as a slide transition": master_slide, "Write it in the notes": master_slide}
      - prompt: From where do you open Master View?
        options:
        - Sidebar → Slide Properties
        - Tools → Protect
        - File → Export
        - Insert → Image
        answer: Sidebar → Slide Properties
        difficulty: 2
        hints:
        - It is about the slide's properties.
        - Look in the sidebar.
        solution: 'Step 1: Masters are a slide property. Step 2: The sidebar shows Slide Properties. Step 3: Master View is there.'
        mistakes:
          File → Export: master_slide
      - prompt: Which menu adds the current date to every slide automatically through the master?
        options:
        - Insert → Field
        - Insert → Image
        - Slide → New Slide
        - Format → Bullets
        answer: Insert → Field
        difficulty: 2
        hints:
        - Slide number is inserted the same way.
        - It inserts a value that updates itself.
        solution: 'Step 1: Date, time and slide number are automatic values. Step 2: They are inserted as fields. Step 3: Insert → Field.'
        mistakes:
          Insert → Image: it8_field_menu
      - prompt: A deck has 20 slides; 14 use master A and 6 use master B. You change master A's background. How many slides change?
        answer: '14'
        check: '14'
        difficulty: 2
        hints:
        - Only slides using master A change.
        - Master B slides stay the same.
        solution: 'Step 1: Master A is used by 14 slides. Step 2: Master B slides are untouched. Step 3: 14.'
        mistakes:
          '20': it8_master_all
          '6': it8_master_all
      - prompt: Which tab in Properties colours a shape's inside?
        options:
        - Area
        - Line
        - Font
        - Animation
        answer: Area
        difficulty: 2
        hints:
        - Line sets the border.
        - The inside is the shape's area.
        solution: 'Step 1: Line = border. Step 2: The inside surface is the area. Step 3: Area.'
        mistakes:
          Line: master_use
      - prompt: How do you rename a master slide?
        options:
        - Right-click it in the Slide Pane → Rename Master
        - Double-click the title
        - Use Tools → Protect
        - Export it
        answer: Right-click it in the Slide Pane → Rename Master
        difficulty: 2
        hints:
        - Masters are listed in the Slide Pane in Master View.
        - A right-click shows options.
        solution: 'Step 1: Masters appear in the Slide Pane. Step 2: Right-click shows Rename. Step 3: Rename Master.'
        mistakes:
          Double-click the title: master_slide
      - prompt: Why do master slides not appear among the normal slides in a show?
        options:
        - They are templates, not content slides
        - They are deleted
        - They are hidden by a password
        - They are images
        answer: They are templates, not content slides
        difficulty: 3
        hints:
        - What is a master's job?
        - It shapes other slides.
        solution: 'Step 1: Masters define design. Step 2: They aren''t presented themselves. Step 3: They are templates.'
        mistakes:
          They are deleted: it8_master_cannot

  - code: it9.present.infographics
    title: Infographics with the Impress Gallery
    after: [it9.present.master_slides]
    notes: |
      Charts can show data analysis in a presentation (e.g. risk factors for heart health of adults in
      India). Infographics (information graphics) present complex information clearly, simply and
      engagingly, combining images, charts and minimal text; more attractive than a plain chart. They can
      be made in LibreOffice Draw or with the Gallery in Impress: Blank Slide layout, Sidebar → Gallery →
      Diagrams, drag a design (e.g. Goal-List-Colourful) onto the slide, double-click text boxes to type
      (risk factor and percentage), resize shapes to fit; add a title shape (e.g. Rectangle-Cut-2) and an
      image (Heart.png); right-click → Arrange to bring hidden items forward. Present the finished slides
      as a slide show.
    explanations:
      text: "An infographic turns numbers into a picture story with icons, shapes and few words. Impress's Gallery has ready diagrams you can drag in and fill."
      visual: "Instead of a bar chart saying 'smoking 30%', picture a coloured arrow with a cigarette icon and '30%' in big letters: that is an infographic."
      step_by_step: "To make one: Step 1: add a Blank Slide. Step 2: Sidebar → Gallery → Diagrams. Step 3: drag Goal-List-Colourful onto the slide. Step 4: double-click each box and type a factor and its percentage. Step 5: add a title shape and an image, and use Arrange if something is hidden."
      real_world: "Health posters in hospitals often show 'eat less salt, walk 30 minutes' with icons: they are infographics."
    activity:
      type: order
      prompt: Make an infographic in Impress. Put the steps in order.
      steps:
      - Choose a Blank Slide layout
      - Sidebar → Gallery → Diagrams
      - Drag a design such as Goal-List-Colourful onto the slide
      - Double-click the text boxes and type the data
      - Add a title shape and an image, then arrange
      reasons:
        Sidebar → Gallery → Diagrams: You need the slide before opening the Gallery.
        Drag a design such as Goal-List-Colourful onto the slide: Pick a design from the Gallery first.
        Double-click the text boxes and type the data: You type into the design after it is on the slide.
        Add a title shape and an image, then arrange: Finish with title and picture; Arrange brings hidden items forward.
    lesson:
      - teach: Infographics (information graphics) show complex information simply using images, charts and very little text. They are more engaging than a plain chart. Make them in LibreOffice Draw or with Impress's Gallery.
        check:
          prompt: An infographic combines
          options:
          - Images, charts and little text
          - Only long paragraphs
          - Only numbers in a table
          answer: Images, charts and little text
          why: It explains at a glance.
      - teach: 'In Impress: Blank Slide → Sidebar → Gallery → Diagrams, drag a design onto the slide, double-click its boxes to type (risk factor and %), resize shapes, add a title shape and an image. If something is hidden, right-click → Arrange. Then run the slide show.'
        picture:
          kind: flow
          steps:
          - Blank Slide
          - Gallery → Diagrams
          - Drag a design
          - Type labels and %
          - Add title and image
          - Arrange layers
          alt: Making an infographic in Impress.
        check:
          prompt: Where are ready-made diagram designs?
          options:
          - Sidebar → Gallery → Diagrams
          - File → Export
          - Tools → Macros
          answer: Sidebar → Gallery → Diagrams
          why: The Gallery holds diagram designs.
    items:
