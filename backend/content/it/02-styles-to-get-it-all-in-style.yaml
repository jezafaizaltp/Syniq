# Class 9 Information and Communications Technology, chapter 2. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 1 text supplied by the school. Software: LibreOffice Writer, gImageReader.
subject: it
chapter: 2
title: Styles to Get it All in Style

tips:
  inherit_level: "A table of contents follows heading levels. Ask which heading level this new style was built from."
  ocr: "OCR reads letters from a picture of a page: its name says it sees (optical) letters (characters) and identifies them. The school app's name contains 'Image' and 'Reader'; GIMP only edits pictures."
  writer_styles: "Styles are ready-made sets of formatting (font, size, colour, alignment, spacing) for headings, paragraphs and pages. Change a style once and every place using it changes. Open the Styles window with F11."
  fill_format: "Fill Format Mode: pick a style in the Styles window, click Fill Format Mode, then click each piece of text to give it that style. Press Esc to stop."
  new_style: "Malayalam is a 'complex text layout' script, and Writer has a separate font setting for such scripts. A new style is named in the tab that organises styles. Subheadings sit one level below main headings, so choose the level that matches."
  footnote: "Think of where a page's 'foot' is. End-notes gather after the last page instead. Both are added from the Insert menu."
  toc: "Writer builds the contents table only from text that has heading styles; main headings use the top level. In the finished table you hold a key and click to jump, and after adding pages you right-click the table to refresh it."
  it2_ocr_steps: 'In gImageReader: add the image, choose the language, recognise, then save the text.'
  it2_style_kind: 'Styles come in kinds: paragraph (whole paragraphs like headings), character (a few letters), page, frame, list and table.'
  it2_one_change: A style is defined once and used many times. Change the definition and every use changes.
  it2_inherit: A new style copies (inherits) everything from its parent unless you set it differently.
  it2_ctl_font: Writer has separate font settings for Western, Asian and CTL (complex text, like Malayalam) scripts.
  it2_foot_end: Footnotes sit at the bottom of the same page; endnotes all gather at the end of the document.
  it2_toc_source: The automatic table of contents is built from heading styles, and it must be refreshed after changes.
  it2_cancel_key: F11 opens and closes the Styles window. Which key do you press to cancel or leave almost any mode?

concepts:
  - code: it9.styles.ocr_styles
    title: OCR and paragraph styles
    notes: |
      OCR (Optical Character Recognition) recognises characters in an image file or scanned document and
      converts them to text; Tesseract OCR, GOCR, EasyOCR are examples; gImageReader is the OCR app on
      school computers: Files → Add images, choose language in Recognize all, click Recognize all, then
      Save output. Formatting every heading by hand in a long document is slow and must be repeated if the
      design changes. Styles are pre-defined features of headings, paragraphs and pages that can be used
      when needed. Apply: select the heading, use the Style box at the left of the formatting toolbar,
      choose Heading 1 (font size 18 pt). The Styles window (More Styles, sidebar, or F11) has categories:
      Paragraph, Character, Frame, Page, List and Table styles; Heading 1 is a paragraph style. Fill Format
      Mode applies the selected style to each item you click; Esc exits. An .ott file is an ODF document
      template; it opens as Untitled, so save it first.
    explanations:
      text: "OCR reads printed words from a picture and makes them typeable text. Styles let you decide once how headings should look, and Writer applies that look everywhere."
      visual: "Think of a school uniform: one design is decided, and every student wearing it looks the same. A style is a uniform for all headings."
      step_by_step: "To style all headings: Step 1: press F11 to open Styles. Step 2: click Heading 1. Step 3: click Fill Format Mode. Step 4: click each heading in the document. Step 5: press Esc."
      real_world: "Every chapter title in this ICT textbook looks the same because the designers used one heading style."
    activity:
      type: sort
      prompt: Which style category?
      bins:
      - Paragraph style
      - Page style
      - Character style
      items:
      - label: Heading 1
        bin: Paragraph style
        clue: It formats a whole heading line.
        why: Heading 1 is a paragraph style.
      - label: Text Body for normal paragraphs
        bin: Paragraph style
        clue: Applies to a whole block of text.
        why: Paragraph style.
      - label: Landscape page with wide margins
        bin: Page style
        clue: It changes the sheet, not the words.
        why: Page style.
      - label: Bold red for one word inside a sentence
        bin: Character style
        clue: Only a few letters change.
        why: Character style.
      - label: A heading style you made, MyStyle1
        bin: Paragraph style
        clue: It inherits from Heading 1.
        why: Paragraph style.
      - label: Italic for a book title inside a line
        bin: Character style
        clue: Just part of a line.
        why: Character style.
    lesson:
      - teach: 'OCR (Optical Character Recognition) turns text in a picture or scan into editable text. Examples: Tesseract, GOCR, EasyOCR. On school computers, gImageReader does this: Files → Add images, choose the language, click Recognize all, then Save output.'
        picture:
          kind: flow
          steps:
          - Add image
          - Choose language
          - Recognize all
          - Save output as text
          alt: Using gImageReader.
        check:
          prompt: OCR changes a scanned page into
          options:
          - Editable text
          - A video
          - A spreadsheet chart
          answer: Editable text
          why: It recognises the letters in the image.
        ways:
        - style: step_by_step
          teach: 'Turn a scanned page into text you can edit, using gImageReader. Step 1: Files → Add images. Step 2: choose the language. Step 3: click Recognize all. Step 4: Save output. This is OCR, Optical Character Recognition; Tesseract, GOCR and EasyOCR are other OCR tools.'
      - teach: Formatting each heading by hand is slow and must be redone if the design changes. Styles are saved sets of formatting. Pick one from the Style box (e.g. Heading 1) or the Styles window (F11). Fill Format Mode applies a style to each item you click; Esc stops it.
        check:
          prompt: Which key opens the Styles window?
          options:
          - F11
          - F1
          - Esc
          answer: F11
          why: F11 toggles the Styles sidebar in Writer.
        ways:
        - style: real_world
          teach: 'Imagine a school uniform rule: change the shirt colour once, and every student''s uniform changes. Styles are like that for a document: saved sets of formatting. Instead of formatting every heading by hand, pick a style from the Style box (like Heading 1) or the Styles window (F11). Fill Format Mode applies a style to each item you click; Esc stops it.'
    items:
      - prompt: "What does OCR stand for?"
        options: ["Optical Character Recognition", "Online Content Reader", "Open Colour Recorder", "Optical Code Reader"]
        answer: "Optical Character Recognition"
        difficulty: 1
        hints: ["It recognises characters in images."]
        solution: "Optical Character Recognition."
        mistakes: {"Online Content Reader": ocr}
      - prompt: "Which OCR application is available on the school computers?"
        options: ["gImageReader", "GIMP", "Scribus", "LibreOffice Calc"]
        answer: "gImageReader"
        difficulty: 1
        hints: ["Its name has 'Reader' in it."]
        solution: "gImageReader."
        mistakes: {"GIMP": ocr}
      - prompt: "Which key opens the Styles window in LibreOffice Writer?"
        options: ["F11", "F5", "F1", "Esc"]
        answer: "F11"
        difficulty: 1
        hints: ["It is a function key near the end of the row."]
        solution: "F11."
        mistakes: {"F5": writer_styles}
      - prompt: "Styles in LibreOffice Writer are"
        options: ["Pre-defined formatting for headings, paragraphs and pages", "Pictures added to a page", "Spelling checks", "Shortcut keys"]
        answer: "Pre-defined formatting for headings, paragraphs and pages"
        difficulty: 1
        hints: ["They are decided in advance and reused."]
        solution: "Pre-defined features that can be applied when needed."
        mistakes: {"Pictures added to a page": writer_styles}
      - prompt: "Heading 1 belongs to which category of styles?"
        options: ["Paragraph Styles", "Page Styles", "Frame Styles", "List Styles"]
        answer: "Paragraph Styles"
        difficulty: 2
        hints: ["A heading is a kind of paragraph."]
        solution: "Paragraph Styles."
        mistakes: {"Page Styles": writer_styles}
      - prompt: "What does Fill Format Mode do?"
        options: ["Applies the selected style to each item you click", "Fills the page with colour", "Deletes all formatting", "Creates a new page"]
        answer: "Applies the selected style to each item you click"
        difficulty: 2
        hints: ["Press Esc to stop it."]
        solution: "It gives the chosen style to whatever you click."
        mistakes: {"Fills the page with colour": fill_format}
      - prompt: "When you open an .ott file, it opens as Untitled. Why?"
        options: ["It is a template file, so a new document is made from it", "The file is damaged", "It is a picture file", "It has no text"]
        answer: "It is a template file, so a new document is made from it"
        difficulty: 2
        hints: ["OTT is an ODF template format."]
        solution: "Templates open as new unsaved documents; save the file first."
        mistakes: {"The file is damaged": writer_styles}
      - prompt: "A scanned Malayalam page comes out as nonsense letters in gImageReader. What should you check first?"
        options: ["The language chosen in Recognize all", "The font size of the page", "Fill Format Mode", "The page style"]
        answer: "The language chosen in Recognize all"
        difficulty: 3
        hints: ["OCR must know which letters to look for.", "Where do you choose the language before recognising?"]
        solution: "Step 1: OCR matches shapes to the letters of a chosen language. Step 2: If English is chosen, Malayalam letters are misread, so choose Malayalam in Recognize all."
        mistakes: {"The font size of the page": ocr, "Fill Format Mode": fill_format, "The page style": ocr}
      - prompt: "A 40-page report has 25 headings formatted by hand. The teacher asks for all headings in green. Why would styles have saved time?"
        options: ["Changing one style changes every heading using it at once", "Styles make the file smaller", "Styles colour text automatically green", "Styles stop the text from being edited"]
        answer: "Changing one style changes every heading using it at once"
        difficulty: 3
        hints: ["How many changes would you make by hand?", "How many changes with a style?"]
        solution: "Step 1: By hand, each of the 25 headings must be changed. Step 2: With a style, you modify the style once and all headings that use it change together."
        mistakes: {"Styles make the file smaller": writer_styles, "Styles colour text automatically green": writer_styles, "Styles stop the text from being edited": writer_styles}
      - prompt: Which is an example of OCR software?
        options:
        - Tesseract
        - GIMP
        - Kalzium
        - Impress
        answer: Tesseract
        difficulty: 1
        hints:
        - It reads text from images.
        - GIMP edits images; Impress makes slides.
        solution: 'Step 1: GIMP, Kalzium and Impress do other jobs. Step 2: One reads letters in images. Step 3: Tesseract.'
        mistakes:
          GIMP: ocr
      - prompt: In gImageReader, what do you click to turn the image into text?
        options:
        - Recognize all
        - Export
        - Fill Format
        - Crop
        answer: Recognize all
        difficulty: 1
        hints:
        - OCR means recognising characters.
        - The button's name says so.
        solution: 'Step 1: Add the image. Step 2: Choose language. Step 3: Click Recognize all.'
        mistakes:
          Export: it2_ocr_steps
      - prompt: How do you stop Fill Format Mode?
        options:
        - Press Esc
        - Press F11
        - Press Delete
        - Close Writer
        answer: Press Esc
        difficulty: 1
        hints:
        - It is the key for cancelling.
        - Top-left of the keyboard.
        solution: 'Step 1: Fill Format keeps applying the style. Step 2: Cancel with the escape key. Step 3: Esc.'
        mistakes:
          Press F11: it2_cancel_key
      - prompt: Which style category formats a few selected letters, not the whole paragraph?
        options:
        - Character Styles
        - Paragraph Styles
        - Page Styles
        - Frame Styles
        answer: Character Styles
        difficulty: 2
        hints:
        - Letters are characters.
        - Heading 1 is a paragraph style.
        solution: 'Step 1: Paragraph styles affect whole paragraphs. Step 2: Letters are characters. Step 3: Character Styles.'
        mistakes:
          Paragraph Styles: it2_style_kind
      - prompt: What size is Heading 1 by default in Writer, according to the lesson?
        options:
        - 18 pt
        - 12 pt
        - 10 pt
        - 36 pt
        answer: 18 pt
        difficulty: 2
        hints:
        - It is bigger than normal text.
        - Normal text is around 12 pt.
        solution: 'Step 1: Headings are larger than body text. Step 2: The lesson names its size. Step 3: 18 pt.'
        mistakes:
          12 pt: writer_styles
      - prompt: Why is a template (.ott) useful?
        options:
        - Each new document starts with the same styles and layout
        - It deletes styles
        - It makes images
        - It is a video format
        answer: Each new document starts with the same styles and layout
        difficulty: 3
        hints:
        - It opens as 'Untitled'.
        - Think of a form you fill in again and again.
        solution: 'Step 1: Templates hold ready-made styles. Step 2: Opening one makes a new copy. Step 3: Each document starts the same way.'
        mistakes:
          It deletes styles: writer_styles

  - code: it9.styles.modify_create
    title: Changing and creating styles
    after: [it9.styles.ocr_styles]
    notes: |
      To change a style: open the Styles window, right-click the style (e.g. Heading 1) → Modify, change
      Font (family e.g. THUMBA, size 14 pt), Font Effects (colour) and Alignment (Center), OK. Every
      heading with that style changes at once. For Malayalam fonts, change the CTL Font. To create a new
      style: right-click Heading under Paragraph Styles → New; in the Organizer tab enter the name
      (MyStyle1) and choose Inherit from (Heading 1, Heading 2...); set Font, Font Effects, Alignment,
      Indents & Spacing; OK. MyStyle1 appears under Heading 1; apply with Fill Format Mode. MyStyle2 for
      subheadings inherits from Heading 2. Drag and drop: drag formatted text into the Styles window and
      name the new style. Load Styles from Template reuses styles in other documents. LaTeX (with
      TeXmaker) prepares scientific and mathematical documents; Scribus is free desktop publishing
      software that supports Unicode and is used by many Malayalam newspapers.
    explanations:
      text: "Modify a style and every heading using it changes together. You can also make your own style and base it on Heading 1 or Heading 2 so Writer still knows it is a heading."
      visual: "Picture a remote control for all headings: change the colour once on the remote (Modify) and every heading on every page turns that colour."
      step_by_step: "To make MyStyle1: Step 1: F11. Step 2: right-click Heading → New. Step 3: Organizer tab, name MyStyle1, Inherit from Heading 1. Step 4: set font, colour, alignment. Step 5: OK, then Fill Format the headings."
      real_world: "Newspaper designers set one style for headlines; when the editor wants bigger headlines, one change updates the whole paper."
    activity:
      type: order
      prompt: Make a new style MyStyle1 for headings. Put the steps in order.
      steps:
      - Open the Styles window (F11)
      - Right-click Heading under Paragraph Styles → New
      - 'Organizer tab: name it MyStyle1, Inherit from Heading 1'
      - Set Font, Font Effects and Alignment, then OK
      - Apply it with Fill Format Mode
      reasons:
        Right-click Heading under Paragraph Styles → New: You need the Styles window open to find Paragraph Styles.
        'Organizer tab: name it MyStyle1, Inherit from Heading 1': Name and parent come first so the Table of Contents can use it.
        Set Font, Font Effects and Alignment, then OK: Formatting is set after the style exists and has a parent.
        Apply it with Fill Format Mode: You can only apply a style after it has been created.
    lesson:
      - teach: 'To change a style: in the Styles window right-click it (e.g. Heading 1) → Modify, then change Font, Font Effects (colour) and Alignment. Every heading using that style changes at once. For Malayalam text, change the CTL Font.'
        check:
          prompt: You make Heading 1 red. What happens?
          options:
          - Every Heading 1 turns red
          - Only the selected heading turns red
          - Nothing
          answer: Every Heading 1 turns red
          why: Changing the style changes all its uses.
        ways:
        - style: step_by_step
          teach: 'Change a style in four steps. Step 1: open the Styles window. Step 2: right-click the style, say Heading 1 → Modify. Step 3: change Font, Font Effects (colour) and Alignment; for Malayalam text, change the CTL Font. Step 4: OK. Every heading that uses this style changes at once.'
      - teach: 'To create a style: right-click a heading style → New. In Organizer give a name (MyStyle1) and choose Inherit from (Heading 1). Set font, effects, alignment and spacing. A sub-heading style (MyStyle2) inherits from Heading 2. You can also drag formatted text into the Styles window.'
        picture:
          kind: flow
          steps:
          - Heading 1
          - MyStyle1 inherits from it
          - Change Heading 1's font
          - MyStyle1 changes too (unless set)
          alt: How inheriting works.
        check:
          prompt: A new style first copies its settings from
          options:
          - The style it inherits from
          - The last page
          - The printer
          answer: The style it inherits from
          why: That is what 'Inherit from' means.
        ways:
        - style: real_world
          teach: 'A child inherits features from a parent, then grows their own. A new style does the same: right-click a heading style → New, give it a name (MyStyle1) in Organizer and choose Inherit from (Heading 1). It starts with Heading 1''s settings, then you change font, effects, alignment and spacing. A sub-heading style (MyStyle2) can inherit from Heading 2. You can also drag formatted text into the Styles window.'
      - teach: 'Other tools: Load Styles from Template reuses styles; LaTeX (with TeXmaker) is for maths and science documents; Scribus is free desktop publishing software that handles Unicode Malayalam and is used by many Malayalam newspapers.'
        check:
          prompt: Which suits a newspaper layout?
          options:
          - Scribus
          - Kalzium
          - gImageReader
          answer: Scribus
          why: It is desktop publishing software.
        ways:
        - style: step_by_step
          teach: Choose the tool by the job. Reusing styles from another file? Load Styles from Template. Writing maths or science documents? LaTeX, with TeXmaker. Laying out a newspaper or magazine with Malayalam text? Scribus, free desktop publishing software that handles Unicode Malayalam and is used by many Malayalam newspapers.
    items:
      - prompt: "All headings use Heading 1. You modify Heading 1 to make the font blue. What happens?"
        options: ["All headings using Heading 1 turn blue", "Only the first heading turns blue", "Only the table of contents turns blue", "Nothing changes"]
        answer: "All headings using Heading 1 turn blue"
        difficulty: 1
        hints: ["That is the whole point of styles."]
        solution: "Every heading with that style changes."
        mistakes: {"Only the first heading turns blue": writer_styles}
      - prompt: "Which option lets you change an existing style?"
        options: ["Right-click the style → Modify", "Insert → Page break", "File → Export", "Format → Clear"]
        answer: "Right-click the style → Modify"
        difficulty: 1
        hints: ["It is in the Styles window."]
        solution: "Right-click → Modify."
        mistakes: {"Insert → Page break": writer_styles}
      - prompt: "For a Malayalam font, which font setting should be changed?"
        options: ["CTL Font", "Western Font", "Asian Font", "Symbol Font"]
        answer: "CTL Font"
        difficulty: 2
        hints: ["CTL means Complex Text Layout."]
        solution: "The CTL Font."
        mistakes: {"Western Font": new_style}
      - prompt: "When creating MyStyle2 for subheadings, what should Inherit from be set to?"
        options: ["Heading 2", "Heading 1", "Heading 4", "Default Paragraph"]
        answer: "Heading 2"
        difficulty: 2
        hints: ["Subheadings are second-level headings."]
        solution: "Heading 2."
        mistakes: {"Heading 1": new_style}
      - prompt: "In which tab do you type the name of a new style?"
        options: ["Organizer", "Font", "Alignment", "Indents & Spacing"]
        answer: "Organizer"
        difficulty: 2
        hints: ["Inherit from is in the same tab."]
        solution: "The Organizer tab."
        mistakes: {"Font": new_style}
      - prompt: "Which free desktop publishing software is used by many Malayalam newspapers?"
        options: ["Scribus", "LaTeX", "GIMP", "gImageReader"]
        answer: "Scribus"
        difficulty: 2
        hints: ["It supports Unicode fonts."]
        solution: "Scribus."
        mistakes: {"LaTeX": writer_styles}
      - prompt: "Which tool is best for writing a maths article full of formulae?"
        options: ["LaTeX", "GIMP", "gImageReader", "Krita"]
        answer: "LaTeX"
        difficulty: 2
        hints: ["TeXmaker helps write documents in it."]
        solution: "LaTeX."
        mistakes: {"GIMP": writer_styles}
      - prompt: "You made MyStyle1 inheriting from Heading 1. Then you change Heading 1's font to THUMBA. What happens to MyStyle1 text if you did not set its own font?"
        options: ["It changes to THUMBA as well", "It stays exactly the same", "It becomes plain body text", "It is deleted"]
        answer: "It changes to THUMBA as well"
        difficulty: 3
        hints: ["What does 'inherit' mean for features you did not set?", "A child style takes what it has not changed from its parent."]
        solution: "Step 1: MyStyle1 takes unset features from Heading 1. Step 2: Its font was not set, so the change to Heading 1's font flows into MyStyle1."
        mistakes: {"It stays exactly the same": new_style, "It becomes plain body text": new_style, "It is deleted": new_style}
      - prompt: "Your Malayalam heading does not change when you set a new font under Western font. Why?"
        options: ["Malayalam uses the CTL font setting", "Malayalam text cannot have styles", "The heading is in a footnote", "You must first export to PDF"]
        answer: "Malayalam uses the CTL font setting"
        difficulty: 3
        hints: ["Writer keeps separate font settings for different scripts.", "Which setting is for complex scripts?"]
        solution: "Step 1: Writer has Western, Asian and CTL (complex text layout) fonts. Step 2: Malayalam is a complex script, so its font is set in CTL."
        mistakes: {"Malayalam text cannot have styles": new_style, "The heading is in a footnote": new_style, "You must first export to PDF": new_style}
      - prompt: In which tab of the style dialog do you choose 'Inherit from'?
        options:
        - Organizer
        - Font Effects
        - Alignment
        - Indents & Spacing
        answer: Organizer
        difficulty: 2
        hints:
        - The same tab where you type the style's name.
        - It organises the style's place in the family.
        solution: 'Step 1: Name and parent are set together. Step 2: That is the first tab. Step 3: Organizer.'
        mistakes:
          Font Effects: new_style
      - prompt: Which tab do you use to change a style's colour?
        options:
        - Font Effects
        - Organizer
        - Alignment
        - Indents & Spacing
        answer: Font Effects
        difficulty: 1
        hints:
        - Colour is an effect on the letters.
        - Its name mentions effects.
        solution: 'Step 1: Colour belongs to how letters look. Step 2: The tab covers font effects. Step 3: Font Effects.'
        mistakes:
          Organizer: new_style
      - prompt: MyStyle2 inherits from Heading 2. Heading 2 is changed to size 16. MyStyle2 had no size of its own. What size is MyStyle2 now?
        answer: '16'
        check: '16'
        difficulty: 3
        hints:
        - MyStyle2 copies what it did not set itself.
        - Its parent is now 16.
        solution: 'Step 1: MyStyle2 inherits size from Heading 2. Step 2: Heading 2 became 16. Step 3: MyStyle2 is 16 too.'
        mistakes:
          '14': it2_inherit
          '12': it2_inherit
      - prompt: How can you reuse your styles in another document?
        options:
        - Load Styles from Template
        - Print the styles
        - Copy one heading by hand
        - Use OCR
        answer: Load Styles from Template
        difficulty: 2
        hints:
        - Styles can be imported.
        - Look for 'Load Styles'.
        solution: 'Step 1: Styles live in a document or template. Step 2: Writer can load them. Step 3: Load Styles from Template.'
        mistakes:
          Use OCR: it2_one_change
      - prompt: Which alignment puts a heading in the middle of the line?
        options:
        - Center
        - Left
        - Right
        - Justified
        answer: Center
        difficulty: 1
        hints:
        - Not to either side.
        - Equal space on both sides.
        solution: 'Step 1: Left and right push to one side. Step 2: Middle means equal space. Step 3: Center.'
        mistakes:
          Justified: writer_styles
      - prompt: A Malayalam heading uses a style. You change the style's Western font. Why doesn't the heading change?
        options:
        - Malayalam uses the CTL font setting
        - Styles can't change fonts
        - Malayalam can't be styled
        - The file is read-only
        answer: Malayalam uses the CTL font setting
        difficulty: 3
        hints:
        - Writer has separate font settings for different scripts.
        - Malayalam is a complex script.
        solution: 'Step 1: Western font affects English letters. Step 2: Malayalam uses complex text layout. Step 3: Change the CTL font.'
        mistakes:
          Styles can't change fonts: it2_ctl_font

  - code: it9.styles.notes_toc
    title: Footnotes, endnotes and table of contents
    after: [it9.styles.modify_create]
    notes: |
      Footnotes give extra information, hints or references for a term. Click at the end of the word,
      Insert → Footnote and Endnote → Footnote; a number appears by the word and at the bottom of the page
      below a short line, where you type the note. Clicking the number jumps between word and note.
      Footnotes are numbered in order. Endnote puts all notes together at the end of the document. Table of
      Contents lists topics, subtopics and page numbers; typing it by hand is laborious and goes out of
      date. Writer's Table of Contents and Index builds it automatically from heading styles, so new styles
      must inherit from the right Heading level. Steps: Insert → Page break for a new first page, click
      there, Insert → Table of Contents and Index → Table of Contents, Index or Bibliography, type a Title,
      OK. Ctrl+click an entry to jump to that page; links also work in an exported PDF. Right-click →
      Update Index or Edit Index; untick 'Protected against manual changes' to format it directly.
    explanations:
      text: "Footnotes explain a word at the bottom of the same page; endnotes collect explanations at the end. The table of contents is built automatically from your heading styles."
      visual: "A footnote is a little number 1 beside a word, with a matching 1 at the bottom of the page and the explanation next to it."
      step_by_step: "To add a contents page: Step 1: put the cursor at the start and Insert → Page break. Step 2: click on the new page. Step 3: Insert → Table of Contents and Index → Table of Contents, Index or Bibliography. Step 4: type the title. Step 5: OK."
      real_world: "In any textbook, the contents page at the front tells you which page each chapter starts on."
    activity:
      type: sort
      prompt: Footnote, endnote or Table of Contents?
      bins:
      - Footnote
      - Endnote
      - Table of Contents
      items:
      - label: A note at the bottom of the same page
        bin: Footnote
        clue: Below a short line on that page.
        why: Footnote.
      - label: All notes collected at the end of the document
        bin: Endnote
        clue: Not on each page.
        why: Endnote.
      - label: Lists topics with page numbers, made from heading styles
        bin: Table of Contents
        clue: Built automatically from headings.
        why: Table of Contents.
      - label: Explains a term on page 3, right there on page 3
        bin: Footnote
        clue: Same page as the word.
        why: Footnote.
      - label: Ctrl+click an entry to jump to that page
        bin: Table of Contents
        clue: Links to every heading.
        why: Table of Contents.
      - label: References gathered after the last chapter
        bin: Endnote
        clue: At the very end.
        why: Endnote.
    lesson:
      - teach: 'Footnotes add extra information at the bottom of the same page: click after the word, Insert → Footnote and Endnote → Footnote, and type. Numbers stay in order automatically. Endnotes collect all notes at the end of the document.'
        picture:
          kind: compare
          columns:
          - title: Footnote
            points:
            - bottom of the same page
            - next to the word's page
          - title: Endnote
            points:
            - end of the document
            - all notes together
          alt: Footnotes and endnotes.
        check:
          prompt: Where does a footnote go?
          options:
          - Bottom of the same page
          - End of the document
          - Top of the page
          answer: Bottom of the same page
          why: '''Foot'' = bottom of the page.'
        ways:
        - style: step_by_step
          teach: 'Add a footnote in three steps. Step 1: click just after the word. Step 2: Insert → Footnote and Endnote → Footnote. Step 3: type the note. It appears at the bottom of the same page, and the numbers stay in order by themselves. Endnotes are different: they collect all the notes at the end of the document.'
      - teach: 'A Table of Contents lists headings with page numbers. Writer builds it from heading styles: Insert → Table of Contents and Index → Table of Contents, Index or Bibliography. Ctrl+click an entry to jump there. After edits, right-click → Update Index.'
        picture:
          kind: flow
          steps:
          - Use heading styles
          - Insert Table of Contents
          - Ctrl+click to jump
          - Update Index after changes
          alt: Making an automatic table of contents.
        check:
          prompt: After adding pages, how do you fix the table of contents?
          options:
          - Right-click → Update Index
          - Type new numbers by hand
          - Delete it
          answer: Right-click → Update Index
          why: Update refreshes headings and page numbers.
        ways:
        - style: real_world
          teach: 'Open your textbook''s contents page: chapter names with page numbers. Writer can build one for you from heading styles: Insert → Table of Contents and Index → Table of Contents, Index or Bibliography. Ctrl+click an entry to jump to it. Added pages later? Right-click the table → Update Index, and the page numbers are corrected.'
    items:
      - prompt: "Where does a footnote appear?"
        options: ["At the bottom of the same page", "At the end of the document", "In the header", "On the title page"]
        answer: "At the bottom of the same page"
        difficulty: 1
        hints: ["An endnote goes to the end of the document."]
        solution: "At the bottom of the page."
        mistakes: {"At the end of the document": footnote}
      - prompt: "Which menu path inserts a footnote?"
        options: ["Insert → Footnote and Endnote → Footnote", "Format → Styles", "File → New", "Tools → Spelling"]
        answer: "Insert → Footnote and Endnote → Footnote"
        difficulty: 1
        hints: ["It is in the Insert menu."]
        solution: "Insert → Footnote and Endnote → Footnote."
        mistakes: {"Format → Styles": footnote}
      - prompt: "How does Writer know what to put in an automatic table of contents?"
        options: ["It reads the heading styles in the document", "It reads the first word of every page", "You must type each entry", "It reads the footnotes"]
        answer: "It reads the heading styles in the document"
        difficulty: 2
        hints: ["That is why Inherit from matters."]
        solution: "It recognises text styled as Heading 1, 2, 3."
        mistakes: {"You must type each entry": toc}
      - prompt: "A main heading style must inherit from which level to appear correctly in the table of contents?"
        options: ["Heading 1", "Heading 2", "Heading 3", "Heading 4"]
        answer: "Heading 1"
        difficulty: 2
        hints: ["Main headings are top level."]
        solution: "Heading 1."
        mistakes: {"Heading 2": toc}
      - prompt: "How do you jump to a chapter from the table of contents in Writer?"
        options: ["Hold Ctrl and click the entry", "Double-click the page number", "Press F11", "Right-click and choose Delete"]
        answer: "Hold Ctrl and click the entry"
        difficulty: 2
        hints: ["A tip appears when you point at an entry."]
        solution: "Ctrl+click."
        mistakes: {"Press F11": toc}
      - prompt: "You added two new pages after making the table of contents. How do you fix the page numbers?"
        options: ["Right-click the table → Update Index", "Retype the table", "Delete the new pages", "Export to PDF"]
        answer: "Right-click the table → Update Index"
        difficulty: 3
        hints: ["Writer can refresh it automatically."]
        solution: "Update Index recalculates entries and page numbers."
        mistakes: {"Retype the table": toc}
      - prompt: "Your notes should all appear together after the last page. What do you use?"
        options: ["Endnote", "Footnote", "Header", "Page border"]
        answer: "Endnote"
        difficulty: 1
        hints: ["'End' of the document."]
        solution: "Endnote."
        mistakes: {"Footnote": footnote}
      - prompt: "Your subheadings use MyStyle2, but they do not appear in the table of contents. What is the likely cause?"
        options: ["MyStyle2 was not made to inherit from a Heading level", "The table of contents shows only one heading", "Subheadings never appear in a table of contents", "The page has footnotes"]
        answer: "MyStyle2 was not made to inherit from a Heading level"
        difficulty: 3
        hints: ["How does Writer decide what goes in the table of contents?", "Check the Inherit from box in the Organizer tab."]
        solution: "Step 1: The table of contents is built from Heading levels. Step 2: A style that does not inherit from a Heading level is not counted, so set Inherit from to Heading 2 and update the index."
        mistakes: {"The table of contents shows only one heading": inherit_level, "Subheadings never appear in a table of contents": inherit_level, "The page has footnotes": toc}
      - prompt: "A page has footnotes 1, 2 and 3. You add a new footnote between notes 1 and 2. What number does the old note 3 become?"
        answer: "4"
        check: "3 + 1"
        difficulty: 3
        hints: ["Footnotes are numbered in order automatically.", "One new note comes before it."]
        solution: "Step 1: The new note becomes 2. Step 2: Every later note moves up by one, so old 3 becomes 4."
        mistakes: {"3": footnote}
      - prompt: Which menu path inserts an automatic table of contents?
        options:
        - Insert → Table of Contents and Index
        - Format → Columns
        - File → Export
        - Tools → OCR
        answer: Insert → Table of Contents and Index
        difficulty: 1
        hints:
        - You are adding something new.
        - It's under Insert.
        solution: 'Step 1: A table of contents is inserted. Step 2: The Insert menu has it. Step 3: Insert → Table of Contents and Index.'
        mistakes:
          File → Export: it2_toc_source
      - prompt: What should you add first so the table of contents sits on its own first page?
        options:
        - A page break
        - A footnote
        - An image
        - A new style
        answer: A page break
        difficulty: 2
        hints:
        - You need a blank page at the start.
        - Insert → Page break.
        solution: 'Step 1: The TOC needs its own page. Step 2: A break starts a new page. Step 3: Page break.'
        mistakes:
          A footnote: it2_foot_end
      - prompt: Why is typing a table of contents by hand a bad idea?
        options:
        - It goes out of date when pages change
        - It looks too neat
        - Writer won't allow typing
        - It needs the internet
        answer: It goes out of date when pages change
        difficulty: 2
        hints:
        - What happens when you add pages later?
        - Page numbers move.
        solution: 'Step 1: Editing moves headings to new pages. Step 2: Typed numbers don''t update. Step 3: It goes out of date.'
        mistakes:
          Writer won't allow typing: it2_toc_source
      - prompt: To format the table of contents text directly, what must you untick?
        options:
        - Protected against manual changes
        - Show footnotes
        - Use OCR
        - Inherit from
        answer: Protected against manual changes
        difficulty: 3
        hints:
        - Writer locks the table by default.
        - Turn off the protection.
        solution: 'Step 1: The table is protected. Step 2: Unlock it in Edit Index. Step 3: Untick ''Protected against manual changes''.'
        mistakes:
          Inherit from: it2_inherit
      - prompt: You click a footnote number in the text. What happens?
        options:
        - You jump to the note
        - The note is deleted
        - A new page opens
        - The style changes
        answer: You jump to the note
        difficulty: 1
        hints:
        - The number links word and note.
        - Clicking the note's number jumps back.
        solution: 'Step 1: Footnote numbers are links. Step 2: Click to go to the note. Step 3: You jump to it.'
        mistakes:
          The note is deleted: footnote
      - prompt: Do the table of contents links still work after exporting to PDF?
        options:
        - 'Yes'
        - No, never
        - Only on paper
        - Only in GIMP
        answer: 'Yes'
        difficulty: 2
        hints:
        - The lesson mentions exported PDFs.
        - Links are kept.
        solution: 'Step 1: Writer exports links to PDF. Step 2: TOC entries are links. Step 3: Yes, they work.'
        mistakes:
          No, never: toc
