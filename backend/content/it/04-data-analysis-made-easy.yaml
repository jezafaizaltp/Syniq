# Class 9 Information and Communications Technology, chapter 4. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 1 text supplied by the school. Software: LibreOffice Calc.
subject: it
chapter: 4
title: Data Analysis Made Easy

tips:
  density_divide: "Density is people per square kilometre. Which number goes on top of the division?"
  calc_formula: "A Calc formula starts with =. Population density = population ÷ area, e.g. =C2/F2. Drag the fill handle (small square at the cell corner) to copy the formula down; the cell addresses change row by row."
  calc_limits: "A file of several sheets has a name like a book of work. For the row limit, check the textbook figure: it is a little over a million (two to the power twenty)."
  lookup_fn: "In a lookup table each group starts at its lower limit. A value belongs to the last group whose lower limit is not more than it: a value exactly at a limit starts the new group. Ranges are named from the Data menu."
  countif_fn: "COUNTIF(range; criterion) counts how many cells in a range meet a condition, e.g. how many states are 'Very high population density'."
  autofilter: "AutoFilter (Data → AutoFilter) shows only the rows that meet a condition; it hides the rest without deleting them. Standard Filter (Data → More Filters) lets you set criteria."
  protect_sheet: "Protecting a sheet is a safety tool, so look in the Tools menu. It stops changes, but people can still open the file and look."
  it4_people_per_km: 'Density is people for each square kilometre: divide the people by the area.'
  it4_relative_ref: When you drag the fill handle down one row, every row number in the formula goes up by one.
  it4_lower_limit: Each category starts at its lower limit and runs up to just below the next one. Find the band the number falls in.
  it4_count_rest: All the categories together make the total. Take away the ones you know.
  it4_lookup_or_countif: LOOKUP puts each value into a category; COUNTIF counts how many cells meet a condition.
  it4_hide_not_delete: A filter only hides rows; nothing is deleted.
  it4_protect_view: A protected sheet can still be opened and read, but not changed without the password.
  it4_menu_names: Each Calc menu groups related jobs. File is for saving, Tools for protection; which menu works on the values in your table?

concepts:
  - code: it9.data.density_formula
    title: Data, spreadsheets and the density formula
    notes: |
      Data is raw, unprocessed information: numbers, words, images or videos. Organised and analysed, it
      gives meaningful information for decisions. The 2011 Census data is in Census_India_2011.ots. A
      file with more than one sheet is a workbook; Calc allows up to 10,000 sheets per workbook, and each
      sheet up to 1,048,576 rows and 1,024 columns. Population density is the average number of people per
      square kilometre: total population ÷ land area. In Calc, click G2 and type =C2/F2 (C2 population of
      Uttar Pradesh, F2 its area), Enter; you can click cells instead of typing addresses. Use the fill
      handle to copy the formula to other rows. Manage decimals with the ROUND function or Delete Decimal
      Place on the toolbar. Online spreadsheets (Google Sheets, Microsoft Excel online, Zoho Sheet) let
      several people work at once.
    explanations:
      text: "Data becomes useful once you organise it and calculate with it. In Calc, a formula like =C2/F2 divides population by area to get density, and the fill handle repeats it for every state."
      visual: "Picture a table: column C people, column F area, column G empty. Type =C2/F2 in G2, then pull the little square down. Every row fills in by itself."
      step_by_step: "To find density: Step 1: click G2. Step 2: type = then click C2, type /, click F2. Step 3: Enter. Step 4: drag the fill handle down to the last state. Step 5: use Delete Decimal Place to show two decimals."
      real_world: "Kerala had about 3.34 crore people on about 38,863 sq km in 2011, a density of about 860 per sq km, one of India's highest."
    activity:
      type: number_line
      min: 300
      max: 1100
      step: 20
      start: 300
      prompt: Population density = population ÷ area. Mark the density (people per sq km).
      goals:
      - prompt: 'A district: 60,000 people on 100 sq km'
        target: 600
        mistakes:
        - when:
            v: 1000
          say: 'Check the division: density = mass ÷ volume. Count the zeros carefully.'
      - prompt: 'A state: 3,34,00,000 people on about 38,900 sq km (Kerala)'
        target: 860
        mistakes:
        - when:
            v: 380
          say: That's close to India's density (382). Kerala is much more crowded.
        - when:
            v: 1100
          say: That's close to Bihar's (1106), the highest.
      - prompt: 'A town: 20,000 people on 50 sq km'
        target: 400
        mistakes:
        - when:
            v: 1000
          say: That multiplies instead of dividing. 20000 ÷ 50.
        - when:
            v: 380
          say: 'That''s India''s density. Work it out: 20000 ÷ 50.'
    lesson:
      - teach: 'Data is raw information: numbers, words, images. Organised and analysed, it helps us decide. A spreadsheet file with many sheets is a workbook. In Calc a sheet can have up to 1,048,576 rows and 1,024 columns.'
        check:
          prompt: A Calc file with several sheets is a
          options:
          - Workbook
          - Template
          - Slide
          answer: Workbook
          why: A workbook holds sheets.
        ways:
        - style: real_world
          teach: 'A school register is raw data: names, marks, attendance. Once it is sorted and totalled, it helps the teacher decide who needs help. Data can be numbers, words or images. In Calc, a file can hold many sheets, like a notebook with many pages: that whole file is a workbook. Each sheet can have up to 1,048,576 rows and 1,024 columns.'
      - teach: 'Population density = total population ÷ land area (people per sq km). In Calc, every formula starts with =. In G2 type =C2/F2 (population ÷ area) and press Enter, then drag the fill handle down to copy it: the row numbers change automatically (=C3/F3, =C4/F4...).'
        picture:
          kind: flow
          steps:
          - 'G2: =C2/F2'
          - Drag fill handle
          - 'G3: =C3/F3'
          - 'G4: =C4/F4'
          alt: The fill handle copies the formula row by row.
        check:
          prompt: 1,000 people live on 4 sq km. Density?
          options:
          - '250'
          - '4000'
          - '1004'
          answer: '250'
          why: 1000 ÷ 4 = 250 per sq km.
        ways:
        - style: step_by_step
          teach: 'Find population density in Calc. Step 1: density = total population ÷ land area (people per sq km). Step 2: in G2 type =C2/F2 (every formula starts with =) and press Enter. Step 3: drag the fill handle down. Step 4: Calc changes the row numbers for you: =C3/F3, =C4/F4 and so on.'
      - teach: Use ROUND or Delete Decimal Place to tidy decimals. Online spreadsheets (Google Sheets, Excel online, Zoho Sheet) let many people edit together.
        check:
          prompt: Which lets several people edit one sheet at the same time?
          options:
          - An online spreadsheet
          - A printed sheet
          - A PNG image
          answer: An online spreadsheet
          why: Online sheets are shared over the internet.
        ways:
        - style: real_world
          teach: 'Long decimals like 859.2347 are hard to read; round them with ROUND or the Delete Decimal Place button. And when a whole class must fill one sheet, use an online spreadsheet such as Google Sheets, Excel online or Zoho Sheet: many people can edit the same sheet at the same time.'
    items:
      - prompt: "Population density is calculated as"
        options: ["Total population ÷ land area", "Land area ÷ total population", "Total population × land area", "Total population − land area"]
        answer: "Total population ÷ land area"
        difficulty: 1
        hints: ["People per square kilometre."]
        solution: "Population ÷ area."
        mistakes: {"Land area ÷ total population": calc_formula}
      - prompt: "Every formula in LibreOffice Calc starts with"
        options: ["=", "+", "#", "$"]
        answer: "="
        difficulty: 1
        hints: ["Like =C2/F2."]
        solution: "The equals sign."
        mistakes: {"#": calc_formula}
      - prompt: "A district has 50,000 people on 200 sq km. What is its population density?"
        answer: "250"
        check: "50000/200"
        difficulty: 1
        hints: ["Divide people by area."]
        solution: "50,000 ÷ 200 = 250 per sq km."
        mistakes: {"10000000": calc_formula}
      - prompt: "A spreadsheet file with more than one sheet is called a"
        options: ["Workbook", "Workspace", "Database", "Template"]
        answer: "Workbook"
        difficulty: 1
        hints: ["Like a book of sheets."]
        solution: "A workbook."
        mistakes: {"Database": calc_limits}
      - prompt: "How many rows can one Calc sheet have at most?"
        answer: "1048576"
        check: "1048576"
        difficulty: 2
        hints: ["It is 2 to the power 20, a little over ten lakh."]
        solution: "1,048,576 rows."
        mistakes: {"1024": calc_limits}
      - prompt: "In G2 you typed =C2/F2 and dragged the fill handle to G3. What formula is in G3?"
        options: ["=C3/F3", "=C2/F2", "=C3/F2", "=G2/F3"]
        answer: "=C3/F3"
        difficulty: 2
        hints: ["Row numbers move down with the formula."]
        solution: "The addresses change to row 3."
        mistakes: {"=C2/F2": calc_formula}
      - prompt: "Kerala's 2011 population was about 3,34,06,061 and its area about 38,863 sq km. What is its density, to the nearest whole number?"
        answer: "860"
        check: "round(33406061/38863)"
        difficulty: 3
        hints: ["Divide and round."]
        solution: "33,406,061 ÷ 38,863 ≈ 859.6, so about 860 per sq km."
        mistakes: {"38863": calc_formula}
      - prompt: "Which toolbar option reduces the number of decimal places shown?"
        options: ["Delete Decimal Place", "AutoFilter", "Protect Sheet", "Define Range"]
        answer: "Delete Decimal Place"
        difficulty: 2
        hints: ["The ROUND function also works."]
        solution: "Delete Decimal Place (or ROUND)."
        mistakes: {"AutoFilter": calc_formula}
      - prompt: "A district has 12,60,000 people on 900 sq km. What is its population density?"
        answer: "1400"
        check: "1260000//900"
        difficulty: 3
        hints: ["Density = population ÷ area.", "1,260,000 ÷ 900."]
        solution: "Step 1: Density = 1,260,000 ÷ 900. Step 2: = 1,400 people per sq km."
        mistakes: {"14": density_divide, "140": density_divide}
      - prompt: "A student typed =F2/C2 in G2 instead of =C2/F2. What will the column show?"
        options: ["Area per person, a very small number, not the density", "The correct density", "An error message", "The total population"]
        answer: "Area per person, a very small number, not the density"
        difficulty: 3
        hints: ["C2 is the population and F2 the area.", "What happens if you divide area by population?"]
        solution: "Step 1: Density is population ÷ area, so C2/F2. Step 2: F2/C2 is area ÷ population: square kilometres per person, a tiny decimal, not people per sq km."
        mistakes: {"The correct density": density_divide, "An error message": calc_formula, "The total population": calc_formula}
      - prompt: A town has 90,000 people on 300 sq km. What is its population density?
        answer: '300'
        check: 90000/300
        difficulty: 1
        hints:
        - Divide people by area.
        - 90,000 ÷ 300.
        solution: 'Step 1: People 90,000. Step 2: Area 300 sq km. Step 3: 300 per sq km.'
        mistakes:
          '27000000': it4_people_per_km
      - prompt: How many columns can one Calc sheet have at most?
        options:
        - '1024'
        - '1048576'
        - '10000'
        - '256'
        answer: '1024'
        difficulty: 2
        hints:
        - Rows go past a million, but columns are far fewer.
        - It is about a thousand.
        solution: 'Step 1: Rows: 1,048,576. Step 2: Columns are fewer. Step 3: 1,024.'
        mistakes:
          '1048576': calc_limits
      - prompt: Which of these is an online spreadsheet?
        options:
        - Zoho Sheet
        - GIMP
        - PictoBlox
        - Kalzium
        answer: Zoho Sheet
        difficulty: 1
        hints:
        - Its name has the word 'Sheet'.
        - The others are for images, coding and chemistry.
        solution: 'Step 1: GIMP = images; PictoBlox = coding; Kalzium = elements. Step 2: The spreadsheet is left. Step 3: Zoho Sheet.'
        mistakes:
          GIMP: calc_formula
      - prompt: In H5 you type =D5*2 and drag down to H7. What formula is in H7?
        options:
        - =D7*2
        - =D5*2
        - =D7*4
        - =H7*2
        answer: =D7*2
        difficulty: 2
        hints:
        - Each row down adds 1 to the row number.
        - The 2 is a plain number and does not change.
        solution: 'Step 1: H5 → H7 is two rows down. Step 2: D5 → D7. Step 3: =D7*2.'
        mistakes:
          =D5*2: it4_relative_ref
      - prompt: Kerala's density is about 860 and India's about 382. About how many more people per sq km does Kerala have?
        answer: '478'
        check: 860 - 382
        difficulty: 2
        hints:
        - Find the difference.
        - 860 − 382.
        solution: 'Step 1: Kerala 860. Step 2: India 382. Step 3: 860 − 382 = 478.'
        mistakes:
          '1242': m5_subtract_not_add

  - code: it9.data.lookup_countif
    title: Classifying with LOOKUP and counting with COUNTIF
    after: [it9.data.density_formula]
    notes: |
      Categories (Table 4.1): below 100 very low; 100 to under 200 low; 200 to under 400 moderate; 400 to
      under 800 high; 800 and above very high population density. LOOKUP is used when data must be put
      into many categories. Make the lookup table in Sheet2 (lower limits 0, 100, 200, 400, 800 with
      names), select it, Data → Define Range, name it Criteria. In J2 open the Function Wizard (fx) →
      LOOKUP → Search Criterion G2, Search Vector Criteria, leave Result Vector empty, OK; drag the fill
      handle. Head the column Classification. LOOKUP searches for a value in a row or column and returns
      the matching value from another. Counting by hand in large data is error-prone; COUNTIF counts the
      cells in a range that meet a condition: Function Wizard → COUNTIF → Range J2:J36, Criteria the cell
      with the category name, OK, fill down.
    explanations:
      text: "LOOKUP sorts each state into a group by checking its density against a small table of limits. COUNTIF then counts how many states landed in each group."
      visual: "Imagine five boxes labelled from very low to very high, each with a minimum number on it. LOOKUP drops each state into the last box whose minimum it reaches. COUNTIF counts the cards in each box."
      step_by_step: "To classify 350: Step 1: list the limits 0, 100, 200, 400, 800. Step 2: find the biggest limit not more than 350: that is 200. Step 3: 200 belongs to 'Moderate'. So 350 is moderate."
      real_world: "Schools use the same idea to turn marks into grades: 80 and above A, 60–79 B, 40–59 C, below 40 D."
    activity:
      type: sort
      prompt: Which density class? (people per sq km)
      bins:
      - Very low (below 100)
      - Low (100–199)
      - Moderate (200–399)
      - High (400–799)
      - Very high (800+)
      items:
      - label: Arunachal Pradesh, 17
        bin: Very low (below 100)
        clue: Is it below 100?
        why: 17 is below 100.
      - label: Himachal Pradesh, 123
        bin: Low (100–199)
        clue: Between 100 and 200.
        why: Low.
      - label: Odisha, 270
        bin: Moderate (200–399)
        clue: Between 200 and 400.
        why: Moderate.
      - label: India, 382
        bin: Moderate (200–399)
        clue: Is 382 under 400?
        why: '382 is still under 400: moderate.'
      - label: Maharashtra, 365
        bin: Moderate (200–399)
        clue: Under 400.
        why: Moderate.
      - label: Uttar Pradesh, 829
        bin: Very high (800+)
        clue: 800 or more?
        why: '829 is 800 or more: very high.'
      - label: Kerala, 860
        bin: Very high (800+)
        clue: Compare with 800.
        why: Very high.
      - label: Punjab, 551
        bin: High (400–799)
        clue: Between 400 and 800.
        why: High.
      - label: Exactly 400
        bin: High (400–799)
        clue: 'Lower limit counts: 400 to under 800.'
        why: 400 is the start of high, not moderate.
    lesson:
      - teach: 'States are grouped by density: below 100 very low; 100–199 low; 200–399 moderate; 400–799 high; 800 and above very high. LOOKUP puts each value into its category using a table of lower limits (0, 100, 200, 400, 800), named with Data → Define Range (e.g. Criteria).'
        picture:
          kind: bars
          unit: lower limit (people per sq km)
          bars:
          - label: Very low
            value: 0
          - label: Low
            value: 100
          - label: Moderate
            value: 200
          - label: High
            value: 400
          - label: Very high
            value: 800
          alt: Lower limits of the five density categories.
        check:
          prompt: Density 150 is in which category?
          options:
          - Low
          - Moderate
          - Very low
          answer: Low
          why: 150 is between 100 and 199.
        ways:
        - style: real_world
          teach: 'Think of grading marks into A, B, C by lower limits. Densities are grouped the same way: below 100 very low; 100-199 low; 200-399 moderate; 400-799 high; 800 and above very high. LOOKUP looks at each value and puts it in its group, using a table of lower limits (0, 100, 200, 400, 800) named with Data → Define Range (e.g. Criteria).'
      - teach: 'LOOKUP: Function Wizard (fx) → LOOKUP → Search Criterion (G2), Search Vector (Criteria), OK, then fill down. The lower limits must be sorted smallest to largest. COUNTIF counts cells that meet a condition: Range J2:J36, Criteria the category name.'
        picture:
          kind: compare
          columns:
          - title: LOOKUP
            points:
            - value → category
            - needs sorted limits
          - title: COUNTIF
            points:
            - how many match?
            - range + condition
          alt: LOOKUP and COUNTIF compared.
        check:
          prompt: Which function tells you how many states are 'High'?
          options:
          - COUNTIF
          - LOOKUP
          - ROUND
          answer: COUNTIF
          why: It counts cells meeting a condition.
        ways:
        - style: step_by_step
          teach: 'Classify, then count. Step 1: fx → LOOKUP. Step 2: Search Criterion = G2, Search Vector = Criteria (sorted smallest to largest), OK. Step 3: fill down. Step 4: to count a category, use COUNTIF with Range J2:J36 and Criteria the category name. COUNTIF counts cells that meet a condition.'
    items:
      - prompt: "A state has a density of 350 per sq km. Which category is it in?"
        options: ["Moderate population density", "Low population density", "High population density", "Very high population density"]
        answer: "Moderate population density"
        difficulty: 1
        hints: ["200 to less than 400."]
        solution: "Moderate."
        mistakes: {"High population density": lookup_fn}
      - prompt: "A state has a density of 860. Which category is it in?"
        options: ["Very high population density", "High population density", "Moderate population density"]
        answer: "Very high population density"
        difficulty: 1
        hints: ["800 and above."]
        solution: "Very high."
        mistakes: {"High population density": lookup_fn}
      - prompt: "What does COUNTIF do?"
        options: ["Counts the cells in a range that meet a condition", "Counts all empty cells", "Finds the largest value", "Counts cells with formulas"]
        answer: "Counts the cells in a range that meet a condition"
        difficulty: 1
        hints: ["COUNT + IF."]
        solution: "It counts cells meeting a condition."
        mistakes: {"Finds the largest value": countif_fn}
      - prompt: "What is the LOOKUP function used for?"
        options: ["To find a value in a row or column and return the matching value from another", "To protect cells", "To count empty cells", "To sort data"]
        answer: "To find a value in a row or column and return the matching value from another"
        difficulty: 2
        hints: ["It matched density to category."]
        solution: "It looks up a value and returns the corresponding result."
        mistakes: {"To protect cells": lookup_fn}
      - prompt: "Which menu option gives a selected range a name like 'Criteria'?"
        options: ["Data → Define Range", "Tools → Protect Sheet", "Data → AutoFilter", "Insert → Function"]
        answer: "Data → Define Range"
        difficulty: 2
        hints: ["It is in the Data menu."]
        solution: "Data → Define Range."
        mistakes: {"Data → AutoFilter": lookup_fn}
      - prompt: "A density is exactly 400. Which category is it in?"
        options: ["High population density", "Moderate population density", "Very high population density"]
        answer: "High population density"
        difficulty: 2
        hints: ["Moderate is 200 to less than 400."]
        solution: "400 is the lower limit of 'High'."
        mistakes: {"Moderate population density": lookup_fn}
      - prompt: "Data for 35 states is in J2 to J36. How many cells is that?"
        answer: "35"
        check: "36 - 2 + 1"
        difficulty: 2
        hints: ["Count both ends."]
        solution: "36 − 2 + 1 = 35."
        mistakes: {"34": countif_fn}
      - prompt: "Using the grade table below 40 D, 40–59 C, 60–79 B, 80 and above A, what grade is 59?"
        options: ["C", "B", "D", "A"]
        answer: "C"
        difficulty: 2
        hints: ["59 is less than 60."]
        solution: "C."
        mistakes: {"B": lookup_fn}
      - prompt: "Your lookup table lists the lower limits as 800, 400, 200, 100, 0 (largest first). LOOKUP gives strange categories. Why?"
        options: ["LOOKUP needs the search vector sorted from smallest to largest", "LOOKUP cannot use numbers", "The range must be named Classification", "COUNTIF must be used first"]
        answer: "LOOKUP needs the search vector sorted from smallest to largest"
        difficulty: 3
        hints: ["How were the lower limits written in the textbook table?", "LOOKUP searches through the list in order."]
        solution: "Step 1: LOOKUP finds the largest lower limit not more than the value by moving up the list. Step 2: That only works when the limits go 0, 100, 200, 400, 800 in increasing order."
        mistakes: {"LOOKUP cannot use numbers": lookup_fn, "The range must be named Classification": lookup_fn, "COUNTIF must be used first": countif_fn}
      - prompt: "In J2:J36, 6 states are Very High, 9 High, 11 Moderate and 4 Low. How many are Very Low?"
        answer: "5"
        check: "35 - (6+9+11+4)"
        difficulty: 3
        hints: ["How many cells are there from J2 to J36?", "Subtract all the counts you know."]
        solution: "Step 1: J2 to J36 is 35 cells. Step 2: 6 + 9 + 11 + 4 = 30. Step 3: 35 − 30 = 5."
        mistakes: {"6": countif_fn, "4": countif_fn}
      - prompt: A state has a density of 99. Which category is it in?
        options:
        - Very low
        - Low
        - Moderate
        - High
        answer: Very low
        difficulty: 1
        hints:
        - Low starts at 100.
        - Is 99 below that?
        solution: 'Step 1: Low begins at 100. Step 2: 99 is below it. Step 3: Very low.'
        mistakes:
          Low: it4_lower_limit
      - prompt: A state has a density of 799. Which category is it in?
        options:
        - High
        - Very high
        - Moderate
        - Low
        answer: High
        difficulty: 2
        hints:
        - The next category starts at 800.
        - 799 is just below that.
        solution: 'Step 1: High = 400 to under 800. Step 2: 799 is under 800. Step 3: High.'
        mistakes:
          Very high: it4_lower_limit
      - prompt: Where do you start the LOOKUP function from?
        options:
        - Function Wizard (fx)
        - Tools → Protect Sheet
        - Data → AutoFilter
        - File → Export
        answer: Function Wizard (fx)
        difficulty: 1
        hints:
        - Functions are chosen from a wizard.
        - Its button shows fx.
        solution: 'Step 1: LOOKUP is a function. Step 2: Functions open from the wizard. Step 3: Function Wizard (fx).'
        mistakes:
          Data → AutoFilter: it4_lookup_or_countif
      - prompt: Of 30 districts, 8 are Very High, 7 High, 9 Moderate and 4 Low. How many are Very Low?
        answer: '2'
        check: 30 - 8 - 7 - 9 - 4
        difficulty: 2
        hints:
        - Add the known ones first.
        - Take that from 30.
        solution: 'Step 1: 8 + 7 + 9 + 4 = 28. Step 2: 30 − 28 = 2. Step 3: 2.'
        mistakes:
          '28': it4_count_rest
      - prompt: In COUNTIF, what goes in the 'Range' box?
        options:
        - The cells to be checked
        - The answer
        - The password
        - The chart title
        answer: The cells to be checked
        difficulty: 2
        hints:
        - COUNTIF looks through a set of cells.
        - Criteria is the condition; Range is where to look.
        solution: 'Step 1: COUNTIF needs where and what. Step 2: Range = where. Step 3: The cells to be checked.'
        mistakes:
          The answer: countif_fn

  - code: it9.data.filter_protect
    title: Filtering and protecting data
    after: [it9.data.lookup_countif]
    notes: |
      AutoFilter separates specific data: click a heading cell (Classification), Data → AutoFilter; arrow
      buttons appear in the heading cells; click the arrow, keep only the needed tick (Very High Density),
      OK. Only those rows are displayed; others are hidden, not deleted. Data → More Filters → Standard
      Filter filters by set criteria. Protect Sheet: Tools → Protect Sheet, enter and confirm a password,
      OK, save. The file can still be opened and viewed but not edited. To edit, unprotect with the
      password (Tools → Protect Sheet again). Specific cells can also be protected.
    explanations:
      text: "AutoFilter shows only the rows you want, like only the very high density states. Protect Sheet locks the sheet with a password so others can look but not change."
      visual: "AutoFilter is like a sieve: you choose what passes through, and everything else is hidden below, still there."
      step_by_step: "To show only very high density states: Step 1: click the Classification heading. Step 2: Data → AutoFilter. Step 3: click the arrow in that heading. Step 4: untick all except Very High Density. Step 5: OK."
      real_world: "A class teacher can lock the marks sheet with a password so students can see but not change their marks."
    activity:
      type: sort
      prompt: AutoFilter or Protect Sheet?
      bins:
      - AutoFilter
      - Protect Sheet
      items:
      - label: Show only the 'Very High Density' states
        bin: AutoFilter
        clue: Keep some rows visible, hide others.
        why: AutoFilter.
      - label: Stop classmates from changing the data
        bin: Protect Sheet
        clue: Needs a password.
        why: Protect Sheet.
      - label: Hide every row except one category
        bin: AutoFilter
        clue: Rows are hidden, not deleted.
        why: AutoFilter.
      - label: Others can open and view but not edit
        bin: Protect Sheet
        clue: Locked with a password.
        why: Protect Sheet.
      - label: Arrow buttons appear in the heading cells
        bin: AutoFilter
        clue: Data menu.
        why: AutoFilter.
      - label: Tools menu, enter and confirm a password
        bin: Protect Sheet
        clue: Tools menu.
        why: Protect Sheet.
    lesson:
      - teach: 'AutoFilter shows only rows that match what you choose: click a heading cell, Data → AutoFilter, then use the arrow to tick only, say, ''Very High Density''. Other rows are hidden, not deleted. Standard Filter (Data → More Filters) lets you set conditions.'
        picture:
          kind: flow
          steps:
          - Click heading
          - Data → AutoFilter
          - Click arrow
          - Tick only what you need
          - Matching rows shown
          alt: Using AutoFilter.
        check:
          prompt: What happens to rows that don't match a filter?
          options:
          - They are hidden
          - They are deleted
          - They turn red
          answer: They are hidden
          why: Clearing the filter brings them back.
        ways:
        - style: real_world
          teach: 'On a shopping site you tick ''size M'' and only M shirts show; the others are still in the shop. AutoFilter does that in Calc: click a heading cell, Data → AutoFilter, then use the arrow to tick only, say, ''Very High Density''. Other rows are hidden, not deleted. Data → More Filters → Standard Filter lets you set conditions.'
      - teach: Tools → Protect Sheet with a password stops changes. The file can still be opened and viewed. To edit again, unprotect with the same password. You can also protect only certain cells.
        check:
          prompt: After protecting a sheet, others can
          options:
          - Open and view it
          - Edit any cell
          - Delete the password
          answer: Open and view it
          why: Protection blocks editing, not viewing.
        ways:
        - style: step_by_step
          teach: 'Protect a sheet in steps. Step 1: Tools → Protect Sheet. Step 2: set a password. Now nobody can change it, but it can still be opened and viewed. Step 3: to edit again, unprotect it with the same password. You can also protect only certain cells.'
    items:
      - prompt: "What does AutoFilter do?"
        options: ["Displays only rows that meet chosen criteria", "Deletes rows that do not meet criteria", "Sorts data alphabetically", "Creates a chart"]
        answer: "Displays only rows that meet chosen criteria"
        difficulty: 1
        hints: ["The other rows are hidden, not deleted."]
        solution: "It shows only matching rows."
        mistakes: {"Deletes rows that do not meet criteria": autofilter}
      - prompt: "Which menu option protects a sheet with a password?"
        options: ["Tools → Protect Sheet", "Data → AutoFilter", "File → Export", "Data → Define Range"]
        answer: "Tools → Protect Sheet"
        difficulty: 1
        hints: ["It is in the Tools menu."]
        solution: "Tools → Protect Sheet."
        mistakes: {"Data → AutoFilter": protect_sheet}
      - prompt: "After Protect Sheet, what can others still do with the file?"
        options: ["Open and view it", "Edit any cell", "Delete the sheet", "Change the password without knowing it"]
        answer: "Open and view it"
        difficulty: 2
        hints: ["It stops editing, not viewing."]
        solution: "They can view but not edit."
        mistakes: {"Edit any cell": protect_sheet}
      - prompt: "Where is the Standard Filter found?"
        options: ["Data → More Filters → Standard Filter", "Tools → Protect Sheet", "Format → Cells", "Insert → Chart"]
        answer: "Data → More Filters → Standard Filter"
        difficulty: 2
        hints: ["It is with AutoFilter in the Data menu."]
        solution: "Data → More Filters → Standard Filter."
        mistakes: {"Tools → Protect Sheet": autofilter}
      - prompt: "You filtered to show only Very High Density states. What happened to the other rows?"
        options: ["They are hidden and come back when the filter is removed", "They are deleted forever", "They moved to Sheet2", "They turned into zeros"]
        answer: "They are hidden and come back when the filter is removed"
        difficulty: 2
        hints: ["Filtering does not change the data."]
        solution: "They are only hidden."
        mistakes: {"They are deleted forever": autofilter}
      - prompt: "You need to find how many states have literacy above 90% and show only those states. Which pair of tools fits best?"
        options: ["COUNTIF to count and AutoFilter to show them", "Protect Sheet and Define Range", "Delete Decimal Place and ROUND", "Fill handle and Export"]
        answer: "COUNTIF to count and AutoFilter to show them"
        difficulty: 3
        hints: ["One counts, one displays."]
        solution: "COUNTIF counts; AutoFilter (or Standard Filter) shows the rows."
        mistakes: {"Protect Sheet and Define Range": countif_fn}
      - prompt: "You protected a sheet and gave the file to a friend. They can open it but cannot type a correction. What must happen first?"
        options: ["The sheet is unprotected with the password", "The friend uses AutoFilter", "The file is saved as a new name", "The friend deletes the rows"]
        answer: "The sheet is unprotected with the password"
        difficulty: 3
        hints: ["What does Protect Sheet stop?", "Where is the same option to undo it?"]
        solution: "Step 1: A protected sheet can be viewed but not edited. Step 2: Tools → Protect Sheet again with the password removes the protection so edits are allowed."
        mistakes: {"The friend uses AutoFilter": protect_sheet, "The file is saved as a new name": protect_sheet, "The friend deletes the rows": protect_sheet}
      - prompt: "After filtering to Very High Density, you see 6 rows and add their populations. Then you clear the filter. How many rows are deleted from the sheet?"
        answer: "0"
        check: "0"
        difficulty: 3
        hints: ["Does a filter hide rows or remove them?"]
        solution: "Step 1: AutoFilter only hides the rows that do not match. Step 2: Clearing the filter shows them again: nothing was deleted."
        mistakes: {"29": autofilter, "6": autofilter}
      - prompt: Which menu turns on AutoFilter?
        options:
        - Data
        - Tools
        - File
        - Insert
        answer: Data
        difficulty: 1
        hints:
        - Filtering sorts through the values in your table.
        - More Filters is in the same menu.
        solution: 'Step 1: Filters sort through data. Step 2: The Data menu holds them. Step 3: Data.'
        mistakes:
          Tools: it4_menu_names
      - prompt: After AutoFilter is on, what appears in the heading cells?
        options:
        - Arrow buttons
        - Passwords
        - Charts
        - Pictures
        answer: Arrow buttons
        difficulty: 1
        hints:
        - You click them to choose what to show.
        - They open a list.
        solution: 'Step 1: Each heading gets a control. Step 2: It opens a tick list. Step 3: Arrow buttons.'
        mistakes:
          Passwords: autofilter
      - prompt: When protecting a sheet, how many times do you type the password?
        answer: '2'
        check: '2'
        difficulty: 2
        hints:
        - You enter it, then confirm it.
        - Confirming prevents typing mistakes.
        solution: 'Step 1: Enter the password. Step 2: Confirm it again. Step 3: Twice.'
        mistakes:
          '1': protect_sheet
      - prompt: A sheet has 36 rows of states. A filter shows 6. How many rows still exist in the sheet?
        answer: '36'
        check: '36'
        difficulty: 2
        hints:
        - Does a filter remove rows?
        - Hidden rows still exist.
        solution: 'Step 1: Filters hide, not delete. Step 2: All rows remain. Step 3: 36.'
        mistakes:
          '6': it4_hide_not_delete
          '30': it4_hide_not_delete
      - prompt: You want classmates to see marks but not change them. What should you do?
        options:
        - Protect the sheet with a password
        - Use AutoFilter
        - Use COUNTIF
        - Delete the marks
        answer: Protect the sheet with a password
        difficulty: 2
        hints:
        - They should read but not edit.
        - Which feature blocks editing?
        solution: 'Step 1: Viewing must stay possible. Step 2: Editing must be blocked. Step 3: Protect the sheet.'
        mistakes:
          Use AutoFilter: it4_protect_view
      - prompt: Which tool lets you filter by a condition such as 'density greater than 500'?
        options:
        - Standard Filter
        - Protect Sheet
        - Delete Decimal Place
        - Define Range
        answer: Standard Filter
        difficulty: 3
        hints:
        - AutoFilter ticks values; this one uses conditions.
        - It is under Data → More Filters.
        solution: 'Step 1: A ''greater than'' rule is a condition. Step 2: More Filters has a tool for conditions. Step 3: Standard Filter.'
        mistakes:
          Define Range: it4_lookup_or_countif
      - prompt: How do you unprotect a sheet?
        options:
        - Tools → Protect Sheet again and enter the password
        - Delete the file
        - Use AutoFilter
        - Export as PDF
        answer: Tools → Protect Sheet again and enter the password
        difficulty: 2
        hints:
        - Use the same menu option.
        - You need the password.
        solution: 'Step 1: Protection is toggled in Tools. Step 2: Choose Protect Sheet again. Step 3: Enter the password.'
        mistakes:
          Use AutoFilter: it4_protect_view
