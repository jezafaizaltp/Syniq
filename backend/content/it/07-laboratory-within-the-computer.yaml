      - prompt: Which is the best reason to simulate the inside of a nuclear reactor rather than visit it?
        options:
        - It is dangerous to observe directly
        - Simulations are always prettier
        - Reactors are boring
        - Computers are cheap
        answer: It is dangerous to observe directly
        difficulty: 2
        hints:
        - Think of safety.
        - Radiation is harmful.
        solution: 'Step 1: Reactors are dangerous. Step 2: Simulations avoid danger. Step 3: Safety is the reason.'
        mistakes:
          Simulations are always prettier: it7_why_simulate
      - prompt: Light passes from glass into air. Compared with the angle of incidence, the angle of refraction is
        options:
        - Larger
        - Smaller
        - Equal
        - Zero
        answer: Larger
        difficulty: 3
        hints:
        - Glass is denser than air.
        - Going into a rarer medium, light bends away from the normal.
        solution: 'Step 1: Glass → air is dense → rare. Step 2: It bends away from the normal. Step 3: The angle gets larger.'
        mistakes:
          Smaller: it7_dense_bend
      - prompt: Why must the media sliders be set before measuring?
        options:
        - Bending depends on which two media the light passes between
        - Sliders change the colour only
        - They switch the program off
        - They have no effect
        answer: Bending depends on which two media the light passes between
        difficulty: 3
        hints:
        - Air–air gives no bending.
        - Air–water gives some.
        solution: 'Step 1: Bending happens when media differ. Step 2: The amount depends on the pair. Step 3: Set the media first.'
        mistakes:
