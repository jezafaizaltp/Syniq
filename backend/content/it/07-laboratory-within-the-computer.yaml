# Class 9 Information and Communications Technology, chapter 7. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 2 text supplied by the school. Software: GeoGebra, Kalzium, PhET Bending Light.
subject: it
chapter: 7
title: Laboratory within the Computer

tips:
  geogebra_tools: "Lines that meet at a right angle have one name; lines that stay the same distance apart and never meet have another (like railway tracks). A copy-line tool needs the line and the point to pass through. A measuring tool reports length."
  parallel_division: "Equally spaced parallel lines cut any slanting line into equal parts. To divide a line into n equal parts: draw a slanting line from one end, mark n equal steps on it, join the last mark to the other end, and draw parallels to that join through the other marks."
  kalzium_basics: "In an atom model the nucleus is in the middle and tiny dots move in the shells around it: what are they? Kalzium colours the table by states of matter from the Gradients menu."
  electron_config: "Fill shells in order, 2 then 8 then 8, until all electrons are placed: the total is the atomic number. The number of shells is the period, and the last shell's electrons decide chemical properties."
  simulation_light: "A simulation lets you safely study what is hard or dangerous to see in real life. Angles of incidence and refraction are measured from the line drawn at 90° to the surface. Light slows down in water, so think about which way it turns; with the same medium on both sides nothing changes."
  it7_equal_parts: Equally spaced parallels cut any slanting line into equal parts. Divide the total length by the number of parts.
  it7_ratio_parts: 'For a ratio a : b, the whole is split into a + b equal parts. Find one part, then multiply.'
  it7_tool_choice: 'GeoGebra has a separate tool for each job: draw, make parallel, make perpendicular, measure.'
  it7_count_shells: Read the configuration shell by shell. The number of shells gives the period; the last number is the outer-shell electrons.
  it7_add_electrons: 'The atomic number equals the total number of electrons: add all the numbers in the configuration.'
  it7_dense_bend: Going into a denser medium (air → water), light bends towards the normal; going out, it bends away.
  it7_why_simulate: Simulations help when the real thing is dangerous, costly, too big, too small or too far away.

concepts:
  - code: it9.lab.geogebra
    title: Parallel lines in GeoGebra
    notes: |
      Simulation software, virtual labs and interactive tools make science and maths learning lively.
      Earlier, string was used to draw circles and a try square (used by carpenters to mark and check 90°
      angles) to make angles. GeoGebra is software for accurate geometric constructions; its tools are
      arranged in groups: mark a point, midpoint, intersection of two lines, lines and segments, parallel
      and perpendicular lines, polygons, circles, angles, measurement. Parallel lines never meet; a line
      meeting another at 90° is perpendicular to it. To draw a parallel or perpendicular: choose the tool,
      click the line, then the point it must pass through. Equidistant parallel lines cut a slanting line
      into equal parts, wherever the slanting line is moved. A line parallel to side AB of a triangle
      divides the other two sides in the same ratio. Dividing a 19-unit line into 3 equal parts: draw it
      with Segment with Given Length, draw a slanting line from one end, mark 3 equal steps on it, join the
      last mark to the other end, draw parallels through the other marks, measure with Distance or Length.
    explanations:
      text: "GeoGebra draws exact shapes. A key idea: parallel lines spaced equally cut any slanting line into equal pieces, which lets you divide a line into as many equal parts as you want."
      visual: "Picture the lines on a ruled notebook page. Lay a pencil across them at a slant: the gaps between the lines along the pencil are all the same."
      step_by_step: "To split a 19-unit line into 3 equal parts: Step 1: draw the 19-unit line. Step 2: draw a slanting line from one end. Step 3: mark 3 equal steps on it. Step 4: join the third mark to the other end. Step 5: draw parallels through marks 1 and 2. Each part is 19 ÷ 3 units."
      real_world: "Playground markers still use a string and peg to draw a big circle, the same idea as GeoGebra's circle tool."
    activity:
      type: order
      prompt: Divide a 19-unit line into 3 equal parts in GeoGebra. Put the steps in order.
      steps:
      - Draw AB with Segment with Given Length (19)
      - Draw a slanting line from A
      - Mark 3 equal steps on the slanting line
      - Join the last mark to B
      - Draw parallels through the other marks
      - Measure the parts with Distance or Length
      reasons:
        Draw a slanting line from A: You need the line AB before drawing from its end.
        Mark 3 equal steps on the slanting line: The steps go on the slanting line, so it comes first.
        Join the last mark to B: Join only after the marks are there.
        Draw parallels through the other marks: The parallels copy the direction of the joining line.
        Measure the parts with Distance or Length: Measure at the end to check the parts are equal.
    lesson:
      - teach: 'GeoGebra is software for accurate geometry. Its tools are in groups: points, lines, parallel and perpendicular lines, polygons, circles, angles and measurement. Parallel lines never meet; a perpendicular meets a line at 90°.'
        check:
          prompt: Lines that meet at 90° are
          options:
          - Perpendicular
          - Parallel
          - Curved
          answer: Perpendicular
          why: Perpendicular means at right angles.
        ways:
        - style: real_world
          teach: 'Look at railway tracks: the two rails run side by side and never meet; they are parallel. The sleepers cross them at right angles, 90°; those are perpendicular. GeoGebra is software for drawing such geometry accurately, with tool groups for points, lines, parallel and perpendicular lines, polygons, circles, angles and measurement.'
      - teach: 'To draw a parallel or perpendicular: choose the tool, click the line, then the point it must pass through. Equally spaced parallel lines cut any slanting line into equal pieces. A line parallel to one side of a triangle cuts the other two sides in the same ratio.'
        picture:
          kind: flow
          steps:
          - Choose Parallel Line tool
          - Click the line
          - Click the point
          - Parallel drawn
          alt: Drawing a parallel line in GeoGebra.
        check:
          prompt: Equally spaced parallels cut a slanting line into
          options:
          - Equal parts
          - Random parts
          - Two parts only
          answer: Equal parts
          why: Equal gaps between parallels give equal pieces.
        ways:
        - style: real_world
          teach: 'Lay a ruler slanting across ruled notebook lines: the equally spaced lines cut it into equal pieces. GeoGebra shows this exactly. To draw a parallel or perpendicular, choose the tool, click the line, then click the point it must pass through. Also, a line parallel to one side of a triangle cuts the other two sides in the same ratio.'
      - teach: 'To split a 19-unit line into 3 equal parts: draw it (Segment with Given Length), draw a slanting line from one end, mark 3 equal steps, join the last step to the other end, and draw parallels through the other marks. Measure with Distance or Length.'
        picture:
          kind: number_line
          from: 0
          to: 19
          points:
          - at: 0
            label: A
          - at: 6.33
            label: 1/3
          - at: 12.67
            label: 2/3
          - at: 19
            label: B
          alt: A 19-unit line split into three equal parts.
        check:
          prompt: Each part of the 19-unit line is about
          options:
          - 6.33 units
          - 19 units
          - 3 units
          answer: 6.33 units
          why: 19 ÷ 3 ≈ 6.33.
        ways:
        - style: real_world
          teach: Dividing a 19-unit line into 3 by measuring is hard, but GeoGebra can do it by drawing. Draw the line (Segment with Given Length), draw a slanting line from one end, mark 3 equal steps on it, join the last step to the other end, and draw parallels through the other marks. Then measure the parts with Distance or Length; they should match 19 ÷ 3.
    items:
      - prompt: "A line that meets another line at 90° is called"
        options: ["Perpendicular", "Parallel", "Slanting", "Curved"]
        answer: "Perpendicular"
        difficulty: 1
        hints: ["A try square checks this angle."]
        solution: "Perpendicular."
        mistakes: {"Parallel": geogebra_tools}
      - prompt: "Lines that never meet, however far they are extended, are"
        options: ["Parallel lines", "Perpendicular lines", "Intersecting lines", "Diagonals"]
        answer: "Parallel lines"
        difficulty: 1
        hints: ["Like railway tracks."]
        solution: "Parallel lines."
        mistakes: {"Intersecting lines": geogebra_tools}
      - prompt: "To draw a parallel line in GeoGebra, after choosing the tool you click"
        options: ["The line, then the point the parallel must pass through", "Only the empty canvas", "The menu bar", "The Move tool"]
        answer: "The line, then the point the parallel must pass through"
        difficulty: 1
        hints: ["Two clicks."]
        solution: "Click the line, then the point."
        mistakes: {"Only the empty canvas": geogebra_tools}
      - prompt: "Four equally spaced parallel lines are cut by a slanting line. What is true of the pieces of the slanting line between them?"
        options: ["They are all equal", "Each is double the one before", "They are all different", "They are zero"]
        answer: "They are all equal"
        difficulty: 2
        hints: ["Move the slanting line and measure again."]
        solution: "Equidistant parallels cut equal segments."
        mistakes: {"They are all different": parallel_division}
      - prompt: "Using the same method, a 21-unit line is divided into 3 equal parts. How long is each part?"
        answer: "7"
        check: "21/3"
        difficulty: 2
        hints: ["Divide the length by the number of parts."]
        solution: "21 ÷ 3 = 7 units. (The textbook's 19-unit line gives parts of about 6.33 units.)"
        mistakes: {"63": parallel_division}
      - prompt: "A triangle has perimeter 18 units and sides in the ratio 2 : 3 : 4. How long is the longest side?"
        answer: "8"
        check: "18 * 4 / (2 + 3 + 4)"
        difficulty: 3
        hints: ["2 + 3 + 4 = 9 parts; each part is 18 ÷ 9."]
        solution: "Each part = 2 units, so sides 4, 6, 8. Longest = 8."
        mistakes: {"4": parallel_division}
      - prompt: "Which GeoGebra tool measures the length of a segment?"
        options: ["Distance or Length", "Parallel Line", "Midpoint", "Polygon"]
        answer: "Distance or Length"
        difficulty: 2
        hints: ["It is a measurement tool."]
        solution: "Distance or Length."
        mistakes: {"Midpoint": geogebra_tools}
      - prompt: "In triangle ABC, a line parallel to AB cuts the other two sides. What is special about how it divides them?"
        options: ["It divides both sides in the same ratio", "It always cuts them in half", "It makes them perpendicular", "It does not touch them"]
        answer: "It divides both sides in the same ratio"
        difficulty: 3
        hints: ["Drag a vertex in triangle.ggb and watch the ratios."]
        solution: "The two sides are divided in the same ratio."
        mistakes: {"It always cuts them in half": parallel_division}
      - prompt: "A 20-unit line is to be divided in the ratio 2 : 3 using equally spaced parallel lines. How long is the shorter part?"
        answer: "8"
        check: "20*2//5"
        difficulty: 3
        hints: ["2 + 3 = 5 equal pieces in all.", "Each piece is 20 ÷ 5 units."]
        solution: "Step 1: 2 + 3 = 5 equal pieces. Step 2: Each is 20 ÷ 5 = 4 units. Step 3: The shorter part is 2 pieces = 8 units."
        mistakes: {"4": parallel_division, "12": parallel_division, "10": parallel_division}
      - prompt: "In GeoGebra, you drag point A of triangle ABC, but the line you drew parallel to AB stops being parallel. What went wrong?"
        options: ["It was drawn by eye with the line tool, not with the Parallel Line tool", "GeoGebra cannot keep lines parallel", "The triangle was too big", "The Distance tool was used"]
        answer: "It was drawn by eye with the line tool, not with the Parallel Line tool"
        difficulty: 3
        hints: ["A construction made with the right tool stays true when you drag.", "Which tool links the new line to AB?"]
        solution: "Step 1: The Parallel Line tool ties the new line to AB, so it stays parallel when points move. Step 2: A line drawn by eye has no such link and breaks when dragged."
        mistakes: {"GeoGebra cannot keep lines parallel": geogebra_tools, "The triangle was too big": geogebra_tools, "The Distance tool was used": geogebra_tools}
      - prompt: A 24-unit line is divided into 4 equal parts with parallel lines. How long is each part?
        answer: '6'
        check: 24/4
        difficulty: 1
        hints:
        - Divide the length by the number of parts.
        - 24 ÷ 4.
        solution: 'Step 1: Length 24. Step 2: 4 parts. Step 3: 6 units each.'
        mistakes:
          '20': it7_equal_parts
          '96': it7_equal_parts
      - prompt: 'A 15-unit line is divided in the ratio 2 : 3. How long is the longer part?'
        answer: '9'
        check: 15*3/5
        difficulty: 2
        hints:
        - 2 + 3 = 5 equal parts.
        - One part = 15 ÷ 5.
        solution: 'Step 1: 5 parts. Step 2: Each part = 3. Step 3: Longer = 3 × 3 = 9.'
        mistakes:
          '6': it7_ratio_parts
          '5': it7_ratio_parts
      - prompt: What tool did carpenters use to mark right angles before software?
        options:
        - Try square
        - Protractor app
        - GeoGebra
        - Compass on a phone
        answer: Try square
        difficulty: 1
        hints:
        - It is an L-shaped tool.
        - The lesson mentions it with string for circles.
        solution: 'Step 1: Carpenters need 90° corners. Step 2: An L-shaped metal tool checks them. Step 3: Try square.'
        mistakes:
          GeoGebra: geogebra_tools
      - prompt: Which GeoGebra tool draws a line at 90° to a given line?
        options:
        - Perpendicular Line
        - Parallel Line
        - Midpoint
        - Circle
        answer: Perpendicular Line
        difficulty: 1
        hints:
        - 90° means right angle.
        - Which word means at right angles?
        solution: 'Step 1: 90° = right angle. Step 2: Lines at right angles are perpendicular. Step 3: Perpendicular Line tool.'
        mistakes:
          Parallel Line: it7_tool_choice
      - prompt: Which tool draws a segment of an exact length, like 19 units?
        options:
        - Segment with Given Length
        - Free Select
        - Polygon
        - Angle
        answer: Segment with Given Length
        difficulty: 2
        hints:
        - You type the length.
        - Its name says 'given length'.
        solution: 'Step 1: Exact length is needed. Step 2: One segment tool asks for it. Step 3: Segment with Given Length.'
        mistakes:
          Polygon: it7_tool_choice

  - code: it9.lab.kalzium
    title: Exploring elements with Kalzium
    after: [it9.lab.geogebra]
    notes: |
      Kalzium is interactive chemistry software built on the periodic table; click an element to see
      atomic number, atomic mass, electron configuration, physical and chemical properties, history and
      uses. Atom Model shows shells as circles and electrons as yellow dots. Sodium (Na), the first element
      of period 3: atomic number 11, configuration 2,8,1, group 1. Next button moves to the next element.
      Examples: lithium 2,1; potassium 2,8,8,1; rubidium 2,8,18,8,1; beryllium 2,2; magnesium 2,8,2; calcium
      2,8,8,2. Chemical properties depend on the number of outer-shell electrons. Main group elements:
      groups 1, 2 and 13–18. Scheme → Groups or Family colours them; Legend shows each family; Gradients →
      State of Matter shows state in nature, and the year of discovery is in the same tab. Settings →
      Configure Kalzium → Gradients changes colours. Scheme → Iconic shows symbols for main uses. Transition
      elements are in groups 3–12, with lanthanoids and actinoids; noble gases in group 18. Search by
      element name in the search bar. Zinc is used to make brass; polonium is radioactive.
    explanations:
      text: "Kalzium is a periodic table you can click. Each element shows its atomic number, how its electrons sit in shells, and what it is used for."
      visual: "The Atom Model for sodium shows three rings: 2 yellow dots on the first, 8 on the second, 1 on the third. Three rings means period 3; one outer dot means group 1."
      step_by_step: "To find period and group from a configuration like 2,8,2: Step 1: count the numbers: three shells, so period 3. Step 2: the last number is 2, so group 2. Step 3: add them for the atomic number: 12 (magnesium)."
      real_world: "Brass taps and vessels in your kitchen are made of copper and zinc, and Kalzium's Iconic view shows that use for zinc."
    activity:
      type: sort
      prompt: Which group is it in? (Use the electron configuration.)
      bins:
      - Group 1
      - Group 2
      - Group 18
      items:
      - label: 'Sodium: 2,8,1'
        bin: Group 1
        clue: Count the outer-shell electrons.
        why: '1 outer electron: group 1.'
      - label: 'Lithium: 2,1'
        bin: Group 1
        clue: Look at the last number.
        why: Group 1.
      - label: 'Potassium: 2,8,8,1'
        bin: Group 1
        clue: Outer shell?
        why: Group 1.
      - label: 'Magnesium: 2,8,2'
        bin: Group 2
        clue: Outer shell?
        why: '2 outer electrons: group 2.'
      - label: 'Calcium: 2,8,8,2'
        bin: Group 2
        clue: Outer shell?
        why: Group 2.
      - label: 'Neon: 2,8'
        bin: Group 18
        clue: Is the outer shell full?
        why: 'A full outer shell: noble gas, group 18.'
      - label: 'Argon: 2,8,8'
        bin: Group 18
        clue: Is the outer shell full?
        why: Noble gas, group 18.
    lesson:
      - teach: Kalzium is an interactive periodic table. Click an element to see its atomic number, mass, electron configuration, properties, history and uses. The Atom Model shows shells as circles and electrons as yellow dots.
        check:
          prompt: In the Atom Model, electrons are shown as
          options:
          - Yellow dots
          - Blue squares
          - Red lines
          answer: Yellow dots
          why: Shells are circles; electrons are yellow dots.
        ways:
        - style: step_by_step
          teach: 'Explore an element in Kalzium. Step 1: open Kalzium, an interactive periodic table. Step 2: click an element. Step 3: read its atomic number, mass, electron configuration, properties, history and uses. Step 4: open the Atom Model: shells are drawn as circles, and electrons as yellow dots.'
      - teach: 'Sodium (11) is 2,8,1: three shells, so period 3; one outer electron, so group 1. Elements with the same outer electrons (Li 2,1; Na 2,8,1; K 2,8,8,1) behave alike. Main groups: 1, 2 and 13–18; transition elements: 3–12; noble gases: 18.'
        picture:
          kind: compare
          columns:
          - title: Shells
            points:
            - 2,8,1 has 3 shells
            - → period 3
          - title: Outer electrons
            points:
            - last number = 1
            - → group 1
          alt: Reading period and group from a configuration.
        check:
          prompt: Magnesium is 2,8,2. Its period is
          options:
          - '3'
          - '2'
          - '8'
          answer: '3'
          why: It has three shells.
        ways:
        - style: step_by_step
          teach: 'Place an element from its electron arrangement. Take sodium, 2,8,1. Step 1: count the numbers: three shells, so period 3. Step 2: look at the last number: one outer electron, so group 1. Elements with the same outer electrons (Li 2,1; Na 2,8,1; K 2,8,8,1) behave alike. Main groups are 1, 2 and 13-18; 3-12 are transition elements; 18 is the noble gases.'
      - teach: 'Kalzium options: Scheme → Groups or Family colours the table; Gradients → State of Matter shows solid, liquid or gas (and discovery year); Scheme → Iconic shows main uses; the search bar finds elements by name.'
        check:
          prompt: Which option shows if an element is a gas?
          options:
          - Gradients → State of Matter
          - Scheme → Iconic
          - Atom Model
          answer: Gradients → State of Matter
          why: It colours elements by their state.
        ways:
        - style: step_by_step
          teach: Pick the Kalzium option by question. Which elements are in the same family? Scheme → Groups or Family. Is it solid, liquid or gas (or when was it discovered)? Gradients → State of Matter. What is it used for? Scheme → Iconic. Where is it? Type its name in the search bar.
    items:
      - prompt: "What is the electron configuration of sodium (atomic number 11)?"
        options: ["2,8,1", "2,8,2", "2,1", "2,8,8,1"]
        answer: "2,8,1"
        difficulty: 1
        hints: ["Fill 2, then 8, then the rest."]
        solution: "2,8,1."
        mistakes: {"2,8,8,1": electron_config}
      - prompt: "In Kalzium's Atom Model, what does each yellow dot represent?"
        options: ["An electron", "A proton", "A shell", "A neutron"]
        answer: "An electron"
        difficulty: 1
        hints: ["Circles are shells."]
        solution: "An electron."
        mistakes: {"A shell": kalzium_basics}
      - prompt: "Calcium has the configuration 2,8,8,2. What is its atomic number?"
        answer: "20"
        check: "2 + 8 + 8 + 2"
        difficulty: 1
        hints: ["Add the electrons."]
        solution: "2 + 8 + 8 + 2 = 20."
        mistakes: {"4": electron_config}
      - prompt: "An element has configuration 2,8,2. Which period is it in?"
        answer: "3"
        check: "3"
        difficulty: 2
        hints: ["Count the shells."]
        solution: "Three shells, so period 3 (it is magnesium)."
        mistakes: {"2": electron_config}
      - prompt: "Rubidium is 2,8,18,8,1. How many electrons are in its outermost shell?"
        answer: "1"
        check: "1"
        difficulty: 2
        hints: ["Look at the last number."]
        solution: "1, so it is in group 1 (alkali metals)."
        mistakes: {"8": electron_config}
      - prompt: "Which Kalzium option shows whether elements are solid, liquid or gas?"
        options: ["Gradients → State of Matter", "Scheme → Iconic", "Atom Model", "Search bar"]
        answer: "Gradients → State of Matter"
        difficulty: 2
        hints: ["It is next to the Scheme tab."]
        solution: "Gradients → State of Matter."
        mistakes: {"Scheme → Iconic": kalzium_basics}
      - prompt: "The chemical properties of an element depend mainly on"
        options: ["The number of electrons in its outermost shell", "Its colour in Kalzium", "Its year of discovery", "Its name"]
        answer: "The number of electrons in its outermost shell"
        difficulty: 2
        hints: ["Elements in the same group behave alike."]
        solution: "Outer-shell electrons."
        mistakes: {"Its year of discovery": electron_config}
      - prompt: "An element in period 2 and group 18 has atomic number 10. What is its electron configuration?"
        options: ["2,8", "2,8,1", "2,6", "8,2"]
        answer: "2,8"
        difficulty: 3
        hints: ["Two shells; the outer one is full."]
        solution: "2,8 (neon, a noble gas)."
        mistakes: {"2,8,1": electron_config}
      - prompt: "Kalzium shows an element with configuration 2,8,7. In which group of the periodic table is it?"
        answer: "17"
        check: "10 + 7"
        difficulty: 3
        hints: ["Count the electrons in the outermost shell.", "For elements with 3 or more outer electrons, group = outer electrons + 10."]
        solution: "Step 1: The outermost shell has 7 electrons. Step 2: Group = 7 + 10 = 17 (it is chlorine, atomic number 17)."
        mistakes: {"7": electron_config, "3": electron_config}
      - prompt: "Sodium (2,8,1) and potassium (2,8,8,1) behave alike in reactions. What does Kalzium's Atom Model show that explains this?"
        options: ["Both have 1 electron in the outermost shell", "Both have 8 electrons in the second shell", "Both have the same atomic mass", "Both have three shells"]
        answer: "Both have 1 electron in the outermost shell"
        difficulty: 3
        hints: ["Chemical properties depend mainly on which shell?", "Count the yellow dots in the last circle for each."]
        solution: "Step 1: Chemical properties depend on outermost electrons. Step 2: Both have 1 electron in the last shell, so they react in similar ways."
        mistakes: {"Both have 8 electrons in the second shell": electron_config, "Both have the same atomic mass": kalzium_basics, "Both have three shells": electron_config}
      - prompt: Potassium is 2,8,8,1. What is its atomic number?
        answer: '19'
        check: 2+8+8+1
        difficulty: 1
        hints:
        - Add the electrons in all shells.
        - 2 + 8 + 8 + 1.
        solution: 'Step 1: Electrons = protons in a neutral atom. Step 2: 2 + 8 + 8 + 1 = 19. Step 3: 19.'
        mistakes:
          '4': it7_add_electrons
          '1': it7_add_electrons
      - prompt: An element is 2,8,3. Which group is it in?
        answer: '13'
        check: '13'
        difficulty: 3
        hints:
        - Three outer electrons.
        - Main groups after the transition block start at 13.
        solution: 'Step 1: Outer shell has 3. Step 2: Group 1 = 1, group 2 = 2, then groups 13–18 for 3–8. Step 3: Group 13.'
        mistakes:
          '3': electron_config
      - prompt: Which groups hold the transition elements?
        options:
        - 3 to 12
        - 1 and 2
        - 13 to 18
        - Only 18
        answer: 3 to 12
        difficulty: 2
        hints:
        - They sit in the middle block of the table.
        - Main groups are 1, 2 and 13–18.
        solution: 'Step 1: Main groups take 1, 2 and 13–18. Step 2: The middle block remains. Step 3: 3 to 12.'
        mistakes:
          13 to 18: kalzium_basics
      - prompt: Lithium is 2,1. How many shells does it have?
        answer: '2'
        check: '2'
        difficulty: 1
        hints:
        - Count how many numbers there are.
        - Each number is one shell.
        solution: 'Step 1: The configuration has two numbers. Step 2: Each is a shell. Step 3: 2 shells.'
        mistakes:
          '3': it7_count_shells
      - prompt: Which Kalzium option shows pictures of an element's main uses?
        options:
        - Scheme → Iconic
        - Gradients → State of Matter
        - Next button
        - Search bar
        answer: Scheme → Iconic
        difficulty: 2
        hints:
        - Uses are shown as icons.
        - It is under Scheme.
        solution: 'Step 1: Uses are shown as symbols. Step 2: Symbols = icons. Step 3: Scheme → Iconic.'
        mistakes:
          Search bar: kalzium_basics

  - code: it9.lab.bending_light
    title: Simulating refraction with PhET
    after: [it9.lab.kalzium]
    notes: |
      Scientific simulation software recreates a real phenomenon on a computer so we can observe it
      without doing the activity; useful for things that are complex, dangerous or out of reach. A pen
      partly in water looks bent because light bends. PhET (virtual lab) → Physics → Bending Light → Intro:
      move the light source with the mouse; sliders on the right set the two media; the protractor measures
      the angle of incidence and angle of refraction; tools on the left show the wave nature and intensity
      of light. Light from air to water bends towards the normal; if both media are the same there is no
      change in path. The Prisms window shows refraction through prisms. In the simulation, the angle of
      refraction increases as the angle of incidence increases.
    explanations:
      text: "PhET lets you shine a virtual laser from air into water and measure the angles. Light bends towards the normal when it enters water, and not at all if the medium does not change."
      visual: "Draw a dotted line straight down through the water surface (the normal). A ray coming in at a slant bends closer to that dotted line once it is in the water."
      step_by_step: "To measure in Bending Light: Step 1: open Intro. Step 2: set medium 1 to air and medium 2 to water. Step 3: turn the laser on. Step 4: drag the protractor to the point where the ray hits the surface. Step 5: read both angles from the normal."
      real_world: "A coin in a bucket of water looks closer to the top than it is, because light bends as it leaves the water."
    activity:
      type: sort
      prompt: In PhET Bending Light, what happens to the ray?
      bins:
      - Bends towards the normal
      - Goes straight on
      items:
      - label: Light from air into water
        bin: Bends towards the normal
        clue: Water is denser than air.
        why: It bends towards the normal.
      - label: Both media set to air
        bin: Goes straight on
        clue: Is anything different between the two sides?
        why: Same medium, no change in path.
      - label: Light from air into glass
        bin: Bends towards the normal
        clue: Glass is denser.
        why: Towards the normal.
      - label: Both media set to water
        bin: Goes straight on
        clue: Same both sides.
        why: No bending.
      - label: A ray along the normal (0° incidence)
        bin: Goes straight on
        clue: The angle of incidence is zero.
        why: Along the normal it passes straight.
    lesson:
      - teach: 'A simulation recreates a real event on a computer so we can study it safely, especially when it is complex, dangerous or out of reach. PhET''s Bending Light shows refraction: a pencil in water looks bent because light bends between media.'
        check:
          prompt: Why use a simulation?
          options:
          - To study something safely without the real setup
          - To avoid learning
          - To play music
          answer: To study something safely without the real setup
          why: We can change conditions easily and safely.
        ways:
        - style: real_world
          teach: 'Pilots first learn to fly in a simulator, safely, before they fly a real plane. A computer simulation recreates a real event so we can study it, especially when it is complex, dangerous or out of reach. PhET''s Bending Light simulation shows refraction: why a pencil in water looks bent, as light bends between media.'
      - teach: 'In Bending Light → Intro, drag the light source, pick the two media with sliders, and use the protractor to measure the angles of incidence and refraction (from the normal). Air → water: the ray bends towards the normal. Same medium on both sides: no bending.'
        picture:
          kind: compare
          columns:
          - title: Air → water
            points:
            - into denser medium
            - bends towards the normal
          - title: Water → air
            points:
            - into rarer medium
            - bends away from the normal
          alt: Direction of bending.
        check:
          prompt: Light from water into air bends
          options:
          - Away from the normal
          - Towards the normal
          - Not at all
          answer: Away from the normal
          why: Going into a rarer medium, it bends away.
        ways:
        - style: step_by_step
          teach: 'Measure refraction in Bending Light → Intro. Step 1: drag the light source. Step 2: choose the two media with the sliders. Step 3: use the protractor to measure the angle of incidence and the angle of refraction, both from the normal. Step 4: compare: air to water bends the ray towards the normal; the same medium on both sides gives no bending.'
      - teach: As the angle of incidence increases, the angle of refraction also increases. A ray along the normal (0°) goes straight through. The Prisms window shows refraction through prisms.
        check:
          prompt: A ray hits water at 0° to the normal. It
          options:
          - Goes straight
          - Bends sharply
          - Reflects back fully
          answer: Goes straight
          why: Along the normal there is no bending.
        ways:
        - style: step_by_step
          teach: 'Try angles one by one. Start at 0°, straight along the normal: the ray goes straight through. Raise the angle of incidence a little: the ray bends, and the angle of refraction grows too. Raise it more: the angle of refraction grows more. The Prisms window shows the same bending through prisms.'
    items:
      - prompt: "Light passes from air into water. How does it bend?"
        options: ["Towards the normal", "Away from the normal", "It does not bend"]
        answer: "Towards the normal"
        difficulty: 1
        hints: ["Water is optically denser than air."]
        solution: "Towards the normal."
        mistakes: {"Away from the normal": simulation_light}
      - prompt: "Both media are set to air in the simulation. What happens to the ray?"
        options: ["Its path does not change", "It bends towards the normal", "It bends away from the normal", "It disappears"]
        answer: "Its path does not change"
        difficulty: 1
        hints: ["No change of medium, no bending."]
        solution: "There is no refraction in the same medium."
        mistakes: {"It bends towards the normal": simulation_light}
      - prompt: "Why are science simulations useful?"
        options: ["They let us study complex, dangerous or unreachable phenomena safely on a computer", "They replace all textbooks", "They make computers faster", "They are only games"]
        answer: "They let us study complex, dangerous or unreachable phenomena safely on a computer"
        difficulty: 1
        hints: ["We can observe without doing the real experiment."]
        solution: "They recreate phenomena safely."
        mistakes: {"They are only games": simulation_light}
      - prompt: "Which tool in Bending Light measures the angles of incidence and refraction?"
        options: ["Protractor", "Ruler", "Thermometer", "Stopwatch"]
        answer: "Protractor"
        difficulty: 2
        hints: ["It measures angles."]
        solution: "The protractor tool."
        mistakes: {"Ruler": simulation_light}
      - prompt: "As you increase the angle of incidence from air into water, the angle of refraction"
        options: ["Increases", "Decreases", "Stays the same"]
        answer: "Increases"
        difficulty: 2
        hints: ["Compare two measurements in the simulation."]
        solution: "It increases, but stays smaller than the angle of incidence."
        mistakes: {"Decreases": simulation_light}
      - prompt: "Angles of incidence and refraction are measured from"
        options: ["The normal", "The water surface", "The light source", "The bottom of the tank"]
        answer: "The normal"
        difficulty: 2
        hints: ["Angles in optics are measured from the line at 90° to the surface. What is that line called?"]
        solution: "From the normal."
        mistakes: {"The water surface": simulation_light}
      - prompt: "In Bending Light, a ray from air hits the water straight along the normal (angle of incidence 0°). What happens?"
        options: ["It goes straight on without bending", "It bends towards the normal", "It bends away from the normal", "It is completely reflected"]
        answer: "It goes straight on without bending"
        difficulty: 3
        hints: ["Angles are measured from the normal.", "If the ray is along the normal, there is no angle to bend from."]
        solution: "Step 1: At 0° the ray travels along the normal. Step 2: Its speed changes but its direction does not, so it goes straight through."
        mistakes: {"It bends towards the normal": simulation_light, "It bends away from the normal": simulation_light, "It is completely reflected": simulation_light}
      - prompt: "You set the top medium to water and the bottom to air. Compared with air-to-water, how does the ray now bend?"
        options: ["Away from the normal", "Towards the normal", "It does not bend", "It turns back up"]
        answer: "Away from the normal"
        difficulty: 3
        hints: ["The light now goes from a denser to a rarer medium.", "Air to water bends towards the normal; this is the reverse journey."]
        solution: "Step 1: Water to air is denser to rarer. Step 2: Light then speeds up and bends away from the normal, the reverse of air to water."
        mistakes: {"Towards the normal": simulation_light, "It does not bend": simulation_light, "It turns back up": simulation_light}
      - prompt: Which PhET section is Bending Light found in?
        options:
        - Physics
        - Biology
        - Mathematics
        - Chemistry
        answer: Physics
        difficulty: 1
        hints:
        - Refraction of light is studied in this science.
        - It is about light and optics.
        solution: 'Step 1: Bending light is optics. Step 2: Optics is part of physics. Step 3: Physics.'
        mistakes:
          Chemistry: simulation_light
      - prompt: Which window of Bending Light shows light passing through prisms?
        options:
        - Prisms
        - Intro
        - Atom Model
        - Gallery
        answer: Prisms
        difficulty: 1
        hints:
        - Its name matches the object.
        - Intro shows two flat media.
        solution: 'Step 1: Intro shows two media. Step 2: Another window has prisms. Step 3: Prisms.'
        mistakes:
          Intro: simulation_light
      - prompt: Why does a pen in a glass of water look bent?
        options:
        - Light bends as it passes from water to air
        - The pen really bends
        - The glass is curved only
        - Water is coloured
        answer: Light bends as it passes from water to air
        difficulty: 2
        hints:
        - The pen is straight.
        - What happens to light at the water's surface?
        solution: 'Step 1: The pen does not bend. Step 2: Light changes direction at the surface. Step 3: Refraction makes it look bent.'
        mistakes:
          The pen really bends: it7_dense_bend
      - prompt: In the simulation, the angle of incidence goes from 30° to 50° (air to water). What happens to the angle of refraction?
        options:
        - It increases
        - It decreases
        - It stays the same
        - It becomes 0°
        answer: It increases
        difficulty: 2
        hints:
        - The two angles move together.
        - Bigger incidence, bigger refraction.
        solution: 'Step 1: Incidence rises. Step 2: Refraction follows. Step 3: It increases.'
        mistakes:
