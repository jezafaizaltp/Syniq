# Class 9 Information and Communications Technology, chapter 7. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 2 text supplied by the school. Software: GeoGebra, Kalzium, PhET Bending Light.
subject: it
chapter: 7
title: Laboratory within the Computer

tips:
  geogebra_tools: "GeoGebra tools come in groups: Point tools (point, midpoint, intersection), line tools (segment, segment with given length), Parallel Line and Perpendicular Line tools, polygon, circle, angle, and Distance or Length to measure. For a parallel or perpendicular: pick the tool, click the line, then click the point it should pass through."
  parallel_division: "Equally spaced parallel lines cut any slanting line into equal parts. To divide a line into n equal parts: draw a slanting line from one end, mark n equal steps on it, join the last mark to the other end, and draw parallels to that join through the other marks."
  kalzium_basics: "Kalzium is a digital periodic table. Click an element to see atomic number, mass, electron configuration, Atom Model, properties, history and uses. Scheme → Groups or Family colours element families; Gradients → State of Matter shows solids, liquids and gases; Scheme → Iconic shows uses; search by name."
  electron_config: "Chemical properties depend on the electrons in the outermost shell. The number of shells gives the period. For main group elements, 1 or 2 outer electrons means group 1 or 2. Sodium (11) is 2,8,1: period 3, group 1."
  simulation_light: "A simulation recreates a real phenomenon on a computer so you can study things that are complex, dangerous or out of reach. In PhET Bending Light, light going from air into water bends towards the normal; in the same medium it does not bend."

concepts:
  - code: it9.lab.geogebra
    title: Parallel lines in GeoGebra
    notes: |
      Simulation software, virtual labs and interactive tools make science and maths learning lively.
      Earlier, string was used to draw circles and a try square (used by carpenters to mark and check 90°
      angles) to make angles. GeoGebra is software for accurate geometric constructions; its tools are
      arranged in groups: mark a point, midpoint, intersection of two lines, lines and segments, parallel
      and perpendicular lines, polygons, circles, angles, measurement. Parallel lines never meet; a line
      meeting another at 90° is perpendicular to it. To draw a parallel or perpendicular: choose the tool,
      click the line, then the point it must pass through. Equidistant parallel lines cut a slanting line
      into equal parts, wherever the slanting line is moved. A line parallel to side AB of a triangle
      divides the other two sides in the same ratio. Dividing a 19-unit line into 3 equal parts: draw it
      with Segment with Given Length, draw a slanting line from one end, mark 3 equal steps on it, join the
      last mark to the other end, draw parallels through the other marks, measure with Distance or Length.
    explanations:
      text: "GeoGebra draws exact shapes. A key idea: parallel lines spaced equally cut any slanting line into equal pieces, which lets you divide a line into as many equal parts as you want."
      visual: "Picture the lines on a ruled notebook page. Lay a pencil across them at a slant: the gaps between the lines along the pencil are all the same."
      step_by_step: "To split a 19-unit line into 3 equal parts: Step 1: draw the 19-unit line. Step 2: draw a slanting line from one end. Step 3: mark 3 equal steps on it. Step 4: join the third mark to the other end. Step 5: draw parallels through marks 1 and 2. Each part is 19 ÷ 3 units."
      real_world: "Playground markers still use a string and peg to draw a big circle, the same idea as GeoGebra's circle tool."
    items:
      - prompt: "A line that meets another line at 90° is called"
        options: ["Perpendicular", "Parallel", "Slanting", "Curved"]
        answer: "Perpendicular"
        difficulty: 1
        hints: ["A try square checks this angle."]
        solution: "Perpendicular."
        mistakes: {"Parallel": geogebra_tools}
      - prompt: "Lines that never meet, however far they are extended, are"
        options: ["Parallel lines", "Perpendicular lines", "Intersecting lines", "Diagonals"]
        answer: "Parallel lines"
        difficulty: 1
        hints: ["Like railway tracks."]
        solution: "Parallel lines."
        mistakes: {"Intersecting lines": geogebra_tools}
      - prompt: "To draw a parallel line in GeoGebra, after choosing the tool you click"
        options: ["The line, then the point the parallel must pass through", "Only the empty canvas", "The menu bar", "The Move tool"]
        answer: "The line, then the point the parallel must pass through"
        difficulty: 1
        hints: ["Two clicks."]
        solution: "Click the line, then the point."
        mistakes: {"Only the empty canvas": geogebra_tools}
      - prompt: "Four equally spaced parallel lines are cut by a slanting line. What is true of the pieces of the slanting line between them?"
        options: ["They are all equal", "Each is double the one before", "They are all different", "They are zero"]
        answer: "They are all equal"
        difficulty: 2
        hints: ["Move the slanting line and measure again."]
        solution: "Equidistant parallels cut equal segments."
        mistakes: {"They are all different": parallel_division}
      - prompt: "Using the same method, a 21-unit line is divided into 3 equal parts. How long is each part?"
        answer: "7"
        check: "21/3"
        difficulty: 2
        hints: ["Divide the length by the number of parts."]
        solution: "21 ÷ 3 = 7 units. (The textbook's 19-unit line gives parts of about 6.33 units.)"
        mistakes: {"63": parallel_division}
      - prompt: "A triangle has perimeter 18 units and sides in the ratio 2 : 3 : 4. How long is the longest side?"
        answer: "8"
        check: "18 * 4 / (2 + 3 + 4)"
        difficulty: 3
        hints: ["2 + 3 + 4 = 9 parts; each part is 18 ÷ 9."]
        solution: "Each part = 2 units, so sides 4, 6, 8. Longest = 8."
        mistakes: {"4": parallel_division}
      - prompt: "Which GeoGebra tool measures the length of a segment?"
        options: ["Distance or Length", "Parallel Line", "Midpoint", "Polygon"]
        answer: "Distance or Length"
        difficulty: 2
        hints: ["It is a measurement tool."]
        solution: "Distance or Length."
        mistakes: {"Midpoint": geogebra_tools}
      - prompt: "In triangle ABC, a line parallel to AB cuts the other two sides. What is special about how it divides them?"
        options: ["It divides both sides in the same ratio", "It always cuts them in half", "It makes them perpendicular", "It does not touch them"]
        answer: "It divides both sides in the same ratio"
        difficulty: 3
        hints: ["Drag a vertex in triangle.ggb and watch the ratios."]
        solution: "The two sides are divided in the same ratio."
        mistakes: {"It always cuts them in half": parallel_division}

  - code: it9.lab.kalzium
    title: Exploring elements with Kalzium
    after: [it9.lab.geogebra]
    notes: |
      Kalzium is interactive chemistry software built on the periodic table; click an element to see
      atomic number, atomic mass, electron configuration, physical and chemical properties, history and
      uses. Atom Model shows shells as circles and electrons as yellow dots. Sodium (Na), the first element
      of period 3: atomic number 11, configuration 2,8,1, group 1. Next button moves to the next element.
      Examples: lithium 2,1; potassium 2,8,8,1; rubidium 2,8,18,8,1; beryllium 2,2; magnesium 2,8,2; calcium
      2,8,8,2. Chemical properties depend on the number of outer-shell electrons. Main group elements:
      groups 1, 2 and 13–18. Scheme → Groups or Family colours them; Legend shows each family; Gradients →
      State of Matter shows state in nature, and the year of discovery is in the same tab. Settings →
      Configure Kalzium → Gradients changes colours. Scheme → Iconic shows symbols for main uses. Transition
      elements are in groups 3–12, with lanthanoids and actinoids; noble gases in group 18. Search by
      element name in the search bar. Zinc is used to make brass; polonium is radioactive.
    explanations:
      text: "Kalzium is a periodic table you can click. Each element shows its atomic number, how its electrons sit in shells, and what it is used for."
      visual: "The Atom Model for sodium shows three rings: 2 yellow dots on the first, 8 on the second, 1 on the third. Three rings means period 3; one outer dot means group 1."
      step_by_step: "To find period and group from a configuration like 2,8,2: Step 1: count the numbers: three shells, so period 3. Step 2: the last number is 2, so group 2. Step 3: add them for the atomic number: 12 (magnesium)."
      real_world: "Brass taps and vessels in your kitchen are made of copper and zinc, and Kalzium's Iconic view shows that use for zinc."
    items:
      - prompt: "What is the electron configuration of sodium (atomic number 11)?"
        options: ["2,8,1", "2,8,2", "2,1", "2,8,8,1"]
        answer: "2,8,1"
        difficulty: 1
        hints: ["Fill 2, then 8, then the rest."]
        solution: "2,8,1."
        mistakes: {"2,8,8,1": electron_config}
      - prompt: "In Kalzium's Atom Model, what does each yellow dot represent?"
        options: ["An electron", "A proton", "A shell", "A neutron"]
        answer: "An electron"
        difficulty: 1
        hints: ["Circles are shells."]
        solution: "An electron."
        mistakes: {"A shell": kalzium_basics}
      - prompt: "Calcium has the configuration 2,8,8,2. What is its atomic number?"
        answer: "20"
        check: "2 + 8 + 8 + 2"
        difficulty: 1
        hints: ["Add the electrons."]
        solution: "2 + 8 + 8 + 2 = 20."
        mistakes: {"4": electron_config}
      - prompt: "An element has configuration 2,8,2. Which period is it in?"
        answer: "3"
        check: "3"
        difficulty: 2
        hints: ["Count the shells."]
        solution: "Three shells, so period 3 (it is magnesium)."
        mistakes: {"2": electron_config}
      - prompt: "Rubidium is 2,8,18,8,1. How many electrons are in its outermost shell?"
        answer: "1"
        check: "1"
        difficulty: 2
        hints: ["Look at the last number."]
        solution: "1, so it is in group 1 (alkali metals)."
        mistakes: {"8": electron_config}
      - prompt: "Which Kalzium option shows whether elements are solid, liquid or gas?"
        options: ["Gradients → State of Matter", "Scheme → Iconic", "Atom Model", "Search bar"]
        answer: "Gradients → State of Matter"
        difficulty: 2
        hints: ["It is next to the Scheme tab."]
        solution: "Gradients → State of Matter."
        mistakes: {"Scheme → Iconic": kalzium_basics}
      - prompt: "The chemical properties of an element depend mainly on"
        options: ["The number of electrons in its outermost shell", "Its colour in Kalzium", "Its year of discovery", "Its name"]
        answer: "The number of electrons in its outermost shell"
        difficulty: 2
        hints: ["Elements in the same group behave alike."]
        solution: "Outer-shell electrons."
        mistakes: {"Its year of discovery": electron_config}
      - prompt: "An element in period 2 and group 18 has atomic number 10. What is its electron configuration?"
        options: ["2,8", "2,8,1", "2,6", "8,2"]
        answer: "2,8"
        difficulty: 3
        hints: ["Two shells; the outer one is full."]
        solution: "2,8 (neon, a noble gas)."
        mistakes: {"2,8,1": electron_config}

  - code: it9.lab.bending_light
    title: Simulating refraction with PhET
    after: [it9.lab.kalzium]
    notes: |
      Scientific simulation software recreates a real phenomenon on a computer so we can observe it
      without doing the activity; useful for things that are complex, dangerous or out of reach. A pen
      partly in water looks bent because light bends. PhET (virtual lab) → Physics → Bending Light → Intro:
      move the light source with the mouse; sliders on the right set the two media; the protractor measures
      the angle of incidence and angle of refraction; tools on the left show the wave nature and intensity
      of light. Light from air to water bends towards the normal; if both media are the same there is no
      change in path. The Prisms window shows refraction through prisms. In the simulation, the angle of
      refraction increases as the angle of incidence increases.
    explanations:
      text: "PhET lets you shine a virtual laser from air into water and measure the angles. Light bends towards the normal when it enters water, and not at all if the medium does not change."
      visual: "Draw a dotted line straight down through the water surface (the normal). A ray coming in at a slant bends closer to that dotted line once it is in the water."
      step_by_step: "To measure in Bending Light: Step 1: open Intro. Step 2: set medium 1 to air and medium 2 to water. Step 3: turn the laser on. Step 4: drag the protractor to the point where the ray hits the surface. Step 5: read both angles from the normal."
      real_world: "A coin in a bucket of water looks closer to the top than it is, because light bends as it leaves the water."
    items:
      - prompt: "Light passes from air into water. How does it bend?"
        options: ["Towards the normal", "Away from the normal", "It does not bend"]
        answer: "Towards the normal"
        difficulty: 1
        hints: ["Water is optically denser than air."]
        solution: "Towards the normal."
        mistakes: {"Away from the normal": simulation_light}
      - prompt: "Both media are set to air in the simulation. What happens to the ray?"
        options: ["Its path does not change", "It bends towards the normal", "It bends away from the normal", "It disappears"]
        answer: "Its path does not change"
        difficulty: 1
        hints: ["No change of medium, no bending."]
        solution: "There is no refraction in the same medium."
        mistakes: {"It bends towards the normal": simulation_light}
      - prompt: "Why are science simulations useful?"
        options: ["They let us study complex, dangerous or unreachable phenomena safely on a computer", "They replace all textbooks", "They make computers faster", "They are only games"]
        answer: "They let us study complex, dangerous or unreachable phenomena safely on a computer"
        difficulty: 1
        hints: ["We can observe without doing the real experiment."]
        solution: "They recreate phenomena safely."
        mistakes: {"They are only games": simulation_light}
      - prompt: "Which tool in Bending Light measures the angles of incidence and refraction?"
        options: ["Protractor", "Ruler", "Thermometer", "Stopwatch"]
        answer: "Protractor"
        difficulty: 2
        hints: ["It measures angles."]
        solution: "The protractor tool."
        mistakes: {"Ruler": simulation_light}
      - prompt: "As you increase the angle of incidence from air into water, the angle of refraction"
        options: ["Increases", "Decreases", "Stays the same"]
        answer: "Increases"
        difficulty: 2
        hints: ["Compare two measurements in the simulation."]
        solution: "It increases, but stays smaller than the angle of incidence."
        mistakes: {"Decreases": simulation_light}
      - prompt: "Angles of incidence and refraction are measured from"
        options: ["The normal", "The water surface", "The light source", "The bottom of the tank"]
        answer: "The normal"
        difficulty: 2
        hints: ["The normal is perpendicular to the surface."]
        solution: "From the normal."
        mistakes: {"The water surface": simulation_light}
