# Class 9 Information and Communications Technology, chapter 3. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 1 text supplied by the school. Software: PictoBlox (blocks and Python).
subject: it
chapter: 3
title: Let's Develop Software!

tips:
  hour_formula: "Use direction = hour × 30 + minute × 0.5. Work out each part before adding."
  block_coding: "Block coding means snapping ready-made blocks together instead of typing commands from memory. Scratch-like tools are block-based; languages where you type every word are text-based."
  app_steps: "Making an app has two main steps: 1) prepare the interface (layout design) with the sprites and backdrop, 2) give instructions (coding) so each part works."
  clock_angles: "A full turn is 360°. Divide it by the number of steps in one turn: 60 seconds for the second hand, 12 hours for the hour hand, and that hourly turn divided by 60 for each minute. Anticlockwise is a left turn."
  pivot_point: "A sprite turns around a small crosshair in its Costume Editor. For a clock hand, that point must sit where the hand meets the centre of the dial. Overlapping sprites are stacked in layers that you can bring forward or send back."
  variables_input: "The Sensing blocks read things from outside: what the user types, and the computer's clock. A typed answer is stored in a variable so you can compare it later; the alarm should sound only when the stored time matches the clock."
  python_syntax: "Python was created in the early 1990s by a Dutch programmer (Tim Berners-Lee made the web, not Python). Syntax is the set of grammar rules for writing code."
  it3_block_vs_text: Block coding uses drag-and-drop blocks; text languages need typed instructions with exact syntax.
  it3_two_steps: 'Building an app has two stages: first lay out what the user sees, then write the instructions.'
  it3_layers: "When sprites overlap, blocks that change how a sprite appears on the stage decide which one is in front."
  it3_degrees_per_step: A full turn is 360°. Divide by the number of steps in one full turn.
  it3_hour_formula: Hour hand direction = hour × 30 + minute × 0.5. Work out each part, then add.
  it3_store_input: The typed reply has to be kept somewhere so the program can compare it later.
  it3_both_match: An alarm must check that the hour AND the minute both match.

concepts:
  - code: it9.software.interface
    title: Block coding and building the interface
    notes: |
      Devices can remind us of times accurately and without tiring, e.g. a water bell to remind students
      to drink water. Applications can be made with programming languages (Java, Python, C++) or block
      coding apps (Scratch, PictoBlox). Block programming: drag-and-drop code blocks in simple language;
      no need to memorise instructions; good for beginners. Two main steps: 1) preparing the interface
      (layout designing), 2) giving instructions (coding). Alarm clock interface in PictoBlox: delete the
      default sprite, add clock.png (dial) in the middle of the stage, Hour_handle.png at size 50, then
      Minute_handle.png, Second_handle.png and Alarm_button. In the Costume Editor, use Select to set the
      rotation centre (pivot point, the small crosshair) so the hand rotates around the dial's centre. Use
      go to front/back layer (Looks) to arrange overlapping sprites. Save once the interface is set.
    explanations:
      text: "Block coding lets you build apps by snapping blocks together. First you place the pictures (interface), then you tell them what to do (code)."
      visual: "Picture a paper clock: first you pin the dial and three hands on a board (interface). Then you write rules for how each hand turns (coding)."
      step_by_step: "To build the clock face: Step 1: delete the default sprite. Step 2: add clock.png and centre it. Step 3: add each hand. Step 4: in the Costume Editor, set each hand's pivot point at its base. Step 5: place the pivots on the dial's centre mark."
      real_world: "School bells, phone alarms and microwave timers are all small programs that act at a set time."
    activity:
      type: order
      prompt: Build the alarm clock interface in PictoBlox. Put the steps in order.
      steps:
      - Delete the default sprite
      - Add the clock dial (clock.png) in the middle
      - Add the hour, minute and second hands
      - Set each hand's rotation centre at the dial's centre
      - Arrange layers so the hands are in front, then save
      reasons:
        Add the clock dial (clock.png) in the middle: The stage must be cleared before placing the dial.
        Add the hour, minute and second hands: The hands go on top of the dial, so the dial comes first.
        Set each hand's rotation centre at the dial's centre: Each hand must exist before you can set its pivot point.
        Arrange layers so the hands are in front, then save: Arrange and save only when every sprite is placed.
    lesson:
      - teach: Apps can be built with text languages (Python, Java, C++) or with block coding apps (Scratch, PictoBlox). In block coding you drag and drop blocks written in simple words, so you don't need to memorise commands. It is good for beginners.
        check:
          prompt: Which is a block coding app?
          options:
          - Scratch
          - Python
          - C++
          answer: Scratch
          why: Scratch uses drag-and-drop blocks.
        ways:
        - style: real_world
          teach: 'Think of building with LEGO bricks instead of carving wood: you join ready-made pieces. Block coding apps like Scratch and PictoBlox work that way: you drag and drop blocks written in simple words, so you don''t need to memorise commands. Professionals often type text languages like Python, Java and C++, but blocks are great for beginners.'
      - teach: 'Making an app has two steps: (1) prepare the interface (layout: what the user sees) and (2) give instructions (coding). For an alarm clock in PictoBlox: delete the default sprite, add the dial, then the hour, minute and second hands and an alarm button.'
        picture:
          kind: flow
          steps:
          - Delete default sprite
          - Add clock dial
          - Add hour, minute, second hands
          - Add alarm button
          - Save
          alt: Building the alarm clock interface.
        check:
          prompt: 'What comes first: the interface or the code?'
          options:
          - The interface
          - The code
          - Neither
          answer: The interface
          why: You lay out the screen, then tell each part what to do.
        ways:
        - style: real_world
          teach: 'When building a house, you put up the walls before wiring the switches. Apps are the same: first the interface (what the user sees), then the instructions (the code). For a PictoBlox alarm clock: delete the default sprite, add the dial, then the hour, minute and second hands, and an alarm button.'
      - teach: Each hand must turn around the dial's centre. In the Costume Editor, set the rotation centre (pivot point, a small crosshair) at the base of each hand. Use 'go to front layer' / 'go to back layer' so hands appear above the dial.
        check:
          prompt: Where should a clock hand's pivot point be?
          options:
          - At its base
          - At its tip
          - Anywhere
          answer: At its base
          why: Real hands turn around the end fixed at the centre.
        ways:
        - style: real_world
          teach: 'A real clock hand is fixed at one end and swings around it. In PictoBlox, set that fixed point too: in the Costume Editor, put the rotation centre (the pivot point, a small crosshair) at the base of each hand, so it turns around the dial''s centre. Use ''go to front layer'' or ''go to back layer'' so the hands appear above the dial.'
    items:
      - prompt: "Block programming creates programs by"
        options: ["Dragging and dropping code blocks", "Typing long instructions from memory", "Drawing pictures only", "Recording your voice"]
        answer: "Dragging and dropping code blocks"
        difficulty: 1
        hints: ["Scratch and PictoBlox work this way."]
        solution: "Dragging and dropping blocks."
        mistakes: {"Typing long instructions from memory": block_coding}
      - prompt: "What are the two main steps in preparing an application?"
        options: ["Preparing the interface and giving instructions (coding)", "Printing and scanning", "Saving and deleting", "Drawing and colouring"]
        answer: "Preparing the interface and giving instructions (coding)"
        difficulty: 1
        hints: ["Layout first, then code."]
        solution: "Interface (layout design), then coding."
        mistakes: {"Drawing and colouring": app_steps}
      - prompt: "Which of these is a block coding application?"
        options: ["PictoBlox", "Python", "Java", "C++"]
        answer: "PictoBlox"
        difficulty: 1
        hints: ["The others are text-based languages."]
        solution: "PictoBlox (also Scratch)."
        mistakes: {"Python": block_coding}
      - prompt: "The small crosshair in a sprite's Costume Editor that the sprite turns around is the"
        options: ["Pivot point", "Backdrop", "Variable", "Operator"]
        answer: "Pivot point"
        difficulty: 2
        hints: ["It is also called the rotation centre."]
        solution: "The pivot point."
        mistakes: {"Backdrop": pivot_point}
      - prompt: "A pigeon sprite is hidden behind a tree sprite. How can you bring the pigeon forward?"
        options: ["Use 'go to front layer' on the pigeon or 'go to back layer' on the tree", "Delete the tree", "Make the stage bigger", "Change the pigeon's colour"]
        answer: "Use 'go to front layer' on the pigeon or 'go to back layer' on the tree"
        difficulty: 2
        hints: ["Both ways work; they are in Looks."]
        solution: "Either block works."
        mistakes: {"Delete the tree": pivot_point}
      - prompt: "Why must a clock hand's pivot point be at its base?"
        options: ["So it turns around the centre of the dial like a real hand", "So it changes colour", "So it moves faster", "So it is hidden"]
        answer: "So it turns around the centre of the dial like a real hand"
        difficulty: 2
        hints: ["A sprite rotates around its pivot point."]
        solution: "Otherwise it spins around its middle and looks wrong."
        mistakes: {"So it moves faster": pivot_point}
      - prompt: "When the clock runs, the second hand spins around its middle instead of its end. What needs fixing?"
        options: ["Set the rotation centre at the hand's base in the Costume Editor", "Change the sprite's size to 50", "Send the hand to the back layer", "Delete the dial sprite"]
        answer: "Set the rotation centre at the hand's base in the Costume Editor"
        difficulty: 3
        hints: ["The small crosshair decides where a sprite turns.", "Where should a clock hand turn from?"]
        solution: "Step 1: A sprite turns around its pivot point. Step 2: Move the pivot (rotation centre) to the base of the hand so it turns around the dial's centre."
        mistakes: {"Change the sprite's size to 50": pivot_point, "Send the hand to the back layer": pivot_point, "Delete the dial sprite": pivot_point}
      - prompt: "The hands disappear behind the dial when the program runs. Which block fixes this?"
        options: ["go to front layer on each hand", "point in direction 90", "ask and wait", "start sound"]
        answer: "go to front layer on each hand"
        difficulty: 3
        hints: ["Overlapping sprites are arranged by layers.", "Which group of blocks (Looks) changes layers?"]
        solution: "Step 1: The dial is on top of the hands. Step 2: Use the Looks block go to front layer on each hand so they show over the dial."
        mistakes: {"point in direction 90": app_steps, "ask and wait": variables_input, "start sound": app_steps}
      - prompt: Which is a reason block coding suits beginners?
        options:
        - No need to memorise instructions
        - It needs exact typed syntax
        - It only works offline
        - It has no pictures
        answer: No need to memorise instructions
        difficulty: 1
        hints:
        - Blocks are written in simple words.
        - You choose them instead of typing.
        solution: 'Step 1: Blocks show their instructions. Step 2: You drag them into place. Step 3: No need to memorise.'
        mistakes:
          It needs exact typed syntax: it3_block_vs_text
      - prompt: In the alarm clock project, which file is the dial?
        options:
        - clock.png
        - Hour_handle.png
        - Alarm_button
        - Second_handle.png
        answer: clock.png
        difficulty: 1
        hints:
        - It is the round face behind the hands.
        - Its name is just the object.
        solution: 'Step 1: Handles are the hands. Step 2: The button sets the alarm. Step 3: The dial is clock.png.'
        mistakes:
          Hour_handle.png: app_steps
      - prompt: At what size was the hour hand sprite set?
        options:
        - '50'
        - '100'
        - '10'
        - '360'
        answer: '50'
        difficulty: 2
        hints:
        - It had to be smaller than the default 100.
        - Half its size.
        solution: 'Step 1: Default size is 100. Step 2: The hand was made half size. Step 3: 50.'
        mistakes:
          '360': clock_angles
      - prompt: What is the first stage of making an application called?
        options:
        - Preparing the interface (layout designing)
        - Coding
        - Testing
        - Selling
        answer: Preparing the interface (layout designing)
        difficulty: 1
        hints:
        - What the user will see is designed first.
        - Coding comes after.
        solution: 'Step 1: Two main steps. Step 2: Layout comes first. Step 3: Preparing the interface.'
        mistakes:
          Coding: it3_two_steps
      - prompt: Which block category has 'go to front layer'?
        options:
        - Looks
        - Sound
        - Sensing
        - Operators
        answer: Looks
        difficulty: 2
        hints:
        - It changes how sprites appear on stage.
        - Not about sound or maths.
        solution: 'Step 1: Layering affects appearance. Step 2: Appearance blocks are grouped together. Step 3: Looks.'
        mistakes:
          Operators: it3_layers
      - prompt: Which device could remind students to drink water, as in the lesson's example?
        options:
        - A water bell
        - A printer
        - A scanner
        - A projector
        answer: A water bell
        difficulty: 1
        hints:
        - It rings at set times.
        - It reminds about water.
        solution: 'Step 1: Devices can remind us on time. Step 2: The lesson names one for drinking water. Step 3: A water bell.'
        mistakes:
          A printer: block_coding
      - prompt: Why use a block coding app before learning Python?
        options:
        - You learn program logic without worrying about syntax
        - Block apps are faster than Python
        - Python cannot make games
        - Block apps need no computer
        answer: You learn program logic without worrying about syntax
        difficulty: 3
        hints:
        - What is hardest for beginners in typed languages?
        - Blocks always fit correctly.
        solution: 'Step 1: Typed code fails on small spelling or spacing errors. Step 2: Blocks avoid that. Step 3: You focus on logic.'
        mistakes:
          Python cannot make games: it3_block_vs_text

  - code: it9.software.clock_code
    title: Coding the clock hands
    after: [it9.software.interface]
    notes: |
      Turning a sprite's direction arrow rotates it. The dial is 360°; the second hand completes the
      circle in 60 moves, so it turns 360 ÷ 60 = 6° each second. The minute hand also moves 6° a minute.
      The current block in Sensing gives the computer's time (second, minute, hour). Operators (maths,
      logic, text blocks) combine values: point in direction (current second × 6). The hour hand moves
      360 ÷ 12 = 30° each hour and 30 ÷ 60 = 0.5° each minute: point in direction = current hour × 30 +
      current minute × 0.5. Clicking the green flag runs the program.
    explanations:
      text: "Each hand is told which way to point using the computer's time. Seconds and minutes are multiplied by 6. The hour is multiplied by 30, and half a degree is added for every minute."
      visual: "Picture the dial as a pizza cut into 60 thin slices of 6° each. The second hand jumps one slice every second. The hour hand jumps 5 slices (30°) every hour."
      step_by_step: "For 3:20: Step 1: hour × 30 = 3 × 30 = 90. Step 2: minute × 0.5 = 20 × 0.5 = 10. Step 3: add: 90 + 10 = 100°."
      real_world: "Watch a real wall clock at 6:30: the hour hand is halfway between 6 and 7, not on the 6. That half-way slide is the 0.5° per minute."
    activity:
      type: angle
      prompt: The clock dial is 360°. How far has the hand turned from 12?
      goals:
      - prompt: The second hand at 10 seconds (6° each second)
        degrees: 60
        mistakes:
        - when:
            degrees: 10
          say: 'That''s the number of seconds. Each second turns the hand 6°: 10 × 6.'
        - when:
            degrees: 100
          say: Each second is 6°, not 10°.
      - prompt: The hour hand at 3 o'clock (30° each hour)
        degrees: 90
        mistakes:
        - when:
            degrees: 15
          say: That uses the second hand's rule. The hour hand moves 360 ÷ 12 = 30° each hour.
        - when:
            degrees: 180
          say: That's 6 hours. Each hour is 30° on the clock face; how many hours is 3 o'clock?
      - prompt: The hour hand at 4:30 (30° an hour + 0.5° a minute)
        degrees: 135
        mistakes:
        - when:
            degrees: 120
          say: That's 4:00. Add 30 minutes × 0.5° = 15°.
        - when:
            degrees: 150
          say: The hour hand is halfway to 5, not at 5.
      - prompt: The minute hand at 45 minutes (6° each minute)
        degrees: 270
        mistakes:
        - when:
            degrees: 45
          say: 'That''s the minutes. Each minute turns 6°: 45 × 6.'
    lesson:
      - teach: 'A dial is 360°. The second hand goes round in 60 steps, so it turns 360 ÷ 60 = 6° each second. The minute hand also moves 6° each minute. In PictoBlox: point in direction (current second × 6).'
        picture:
          kind: flow
          steps:
          - Full circle 360°
          - ÷ 60 steps
          - = 6° per second
          alt: Why the second hand moves 6°.
        check:
          prompt: At 10 seconds, the second hand points to
          options:
          - 60°
          - 10°
          - 600°
          answer: 60°
          why: 10 × 6 = 60.
        ways:
        - style: step_by_step
          teach: 'Work out the second hand''s turn. Step 1: a full circle is 360°. Step 2: the second hand takes 60 steps to go round. Step 3: 360 ÷ 60 = 6° per second. Step 4: so its direction is current second × 6. The minute hand also moves 6° each minute. In PictoBlox: point in direction (current second × 6).'
      - teach: The hour hand moves 360 ÷ 12 = 30° each hour, and 30 ÷ 60 = 0.5° each minute. So direction = hour × 30 + minute × 0.5. The 'current' block in Sensing gives the computer's time; Operators blocks do the maths.
        picture:
          kind: flow
          steps:
          - hour × 30
          - + minute × 0.5
          - = hour hand direction
          alt: Hour hand formula.
        check:
          prompt: At 2:00, the hour hand points to
          options:
          - 60°
          - 30°
          - 120°
          answer: 60°
          why: 2 × 30 + 0 = 60.
        ways:
        - style: step_by_step
          teach: 'Work out the hour hand. Step 1: 12 hours make 360°, so 360 ÷ 12 = 30° per hour. Step 2: each hour has 60 minutes, so 30 ÷ 60 = 0.5° per minute. Step 3: direction = hour × 30 + minute × 0.5. Get the time from the ''current'' block in Sensing, and do the maths with Operators blocks.'
    items:
      - prompt: "How many degrees does the second hand turn each second?"
        answer: "6"
        check: "360/60"
        difficulty: 1
        hints: ["360° in 60 moves."]
        solution: "360 ÷ 60 = 6°."
        mistakes: {"60": clock_angles}
      - prompt: "How many degrees does the hour hand turn in one hour?"
        answer: "30"
        check: "360/12"
        difficulty: 1
        hints: ["There are 12 hours on the dial."]
        solution: "360 ÷ 12 = 30°."
        mistakes: {"6": clock_angles}
      - prompt: "How many degrees does the hour hand move in one minute?"
        answer: "0.5"
        check: "30/60"
        difficulty: 2
        hints: ["It moves 30° in 60 minutes."]
        solution: "30 ÷ 60 = 0.5°."
        mistakes: {"6": clock_angles}
      - prompt: "At 15 seconds, what direction (in degrees) should the second hand point?"
        answer: "90"
        check: "15 * 6"
        difficulty: 2
        hints: ["Multiply seconds by 6."]
        solution: "15 × 6 = 90°."
        mistakes: {"15": clock_angles}
      - prompt: "Using direction = hour × 30 + minute × 0.5, where should the hour hand point at 3:20?"
        answer: "100"
        check: "3 * 30 + 20 * 0.5"
        difficulty: 2
        hints: ["3 × 30, then add 20 × 0.5."]
        solution: "90 + 10 = 100°."
        mistakes: {"90": clock_angles}
      - prompt: "Using the same formula, where should the hour hand point at 9:30?"
        answer: "285"
        check: "9 * 30 + 30 * 0.5"
        difficulty: 3
        hints: ["9 × 30 = 270."]
        solution: "270 + 15 = 285°."
        mistakes: {"270": clock_angles}
      - prompt: "Which PictoBlox block gives the computer's current time?"
        options: ["current (in Sensing)", "say (in Looks)", "play sound (in Sound)", "go to front layer (in Looks)"]
        answer: "current (in Sensing)"
        difficulty: 1
        hints: ["It is a sensing block."]
        solution: "The current block in Sensing."
        mistakes: {"say (in Looks)": variables_input}
      - prompt: "A sprite Earth should turn anticlockwise 5° every second. Which instruction fits?"
        options: ["Turn left (anticlockwise) 5 degrees, wait 1 second, repeat forever", "Turn right 5 degrees once", "Move 5 steps", "Turn left 360 degrees once"]
        answer: "Turn left (anticlockwise) 5 degrees, wait 1 second, repeat forever"
        difficulty: 3
        hints: ["It must keep happening every second."]
        solution: "Inside a forever loop: turn anticlockwise 5°, then wait 1 second."
        mistakes: {"Turn right 5 degrees once": clock_angles}
      - prompt: "Using direction = hour × 30 + minute × 0.5, where should the hour hand point at 7:40?"
        answer: "230"
        check: "7*30 + 40//2"
        difficulty: 3
        hints: ["7 × 30 = ?", "40 × 0.5 = ?"]
        solution: "Step 1: 7 × 30 = 210. Step 2: 40 × 0.5 = 20. Step 3: 210 + 20 = 230°."
        mistakes: {"210": hour_formula, "250": hour_formula}
      - prompt: "At 4:30, how many degrees apart are the hour hand and the minute hand?"
        answer: "45"
        check: "30*6 - (4*30 + 30//2)"
        difficulty: 3
        hints: ["Minute hand: minute × 6. Hour hand: hour × 30 + minute × 0.5.", "Find both directions, then the difference."]
        solution: "Step 1: Minute hand: 30 × 6 = 180°. Step 2: Hour hand: 4 × 30 + 30 × 0.5 = 135°. Step 3: 180 − 135 = 45°."
        mistakes: {"60": clock_angles, "30": clock_angles}
      - prompt: At 40 seconds, what direction should the second hand point (degrees)?
        answer: '240'
        check: 40*6
        difficulty: 1
        hints:
        - Each second is 6°.
        - 40 × 6.
        solution: 'Step 1: 6° per second. Step 2: 40 seconds. Step 3: 240°.'
        mistakes:
          '46': it3_degrees_per_step
      - prompt: Using hour × 30 + minute × 0.5, where does the hour hand point at 5:10?
        answer: '155'
        check: 5*30 + 10*0.5
        difficulty: 2
        hints:
        - 5 × 30 first.
        - Then add 10 × 0.5.
        solution: 'Step 1: 5 × 30 = 150. Step 2: 10 × 0.5 = 5. Step 3: 155°.'
        mistakes:
          '150': it3_hour_formula
      - prompt: Which block category holds maths blocks like × and +?
        options:
        - Operators
        - Looks
        - Sound
        - Events
        answer: Operators
        difficulty: 1
        hints:
        - Maths signs like × and + act on numbers.
        - Logic and text blocks are there too.
        solution: 'Step 1: × and + operate on numbers. Step 2: They are grouped together. Step 3: Operators.'
        mistakes:
          Looks: hour_formula
      - prompt: How many degrees does the minute hand move in 15 minutes?
        answer: '90'
        check: 15*6
        difficulty: 2
        hints:
        - The minute hand moves 6° a minute.
        - 15 × 6.
        solution: 'Step 1: 6° per minute. Step 2: 15 minutes. Step 3: 90°.'
        mistakes:
          '7.5': it3_degrees_per_step
      - prompt: What starts the PictoBlox program running?
        options:
        - Clicking the green flag
        - Pressing Delete
        - Closing the stage
        - Saving the file
        answer: Clicking the green flag
        difficulty: 1
        hints:
        - It is a coloured flag above the stage.
        - Its colour means 'go'.
        solution: 'Step 1: Programs start with an event. Step 2: The flag is the usual start. Step 3: Green flag.'
        mistakes:
          Saving the file: block_coding

  - code: it9.software.alarm_python
    title: Input, variables, sound and Python
    after: [it9.software.clock_code]
    notes: |
      The ask and wait block (Sensing) shows a field to type input; the reply (answer) is stored in a
      variable such as Hour, and another, Minute. Variables store input as numbers or text and can be
      changed by instructions. When the stored time equals the clock's time (use the = operator and
      'and'), the alarm sound plays a set number of times. The Sounds tab adds sounds from the library,
      recordings or uploaded files; play with the start sound block. Professional developers mostly use
      text-based languages (Python, Java, C++). PictoBlox also has a Python coding window; adding sprites
      generates some Python code. Python, created in 1991 under Guido van Rossum, is easy to learn and is
      used from small games to AI. Syntax is the correct structure of code, like grammar; in Python,
      indentation and symbols like quotes are part of the syntax.
    explanations:
      text: "The alarm asks you for a time, keeps it in variables, and keeps checking whether the clock has reached it. When it has, it plays a sound. Python is a typed language that does the same kind of work."
      visual: "A variable is a labelled box. 'Hour' box holds 10, 'Minute' box holds 30. The program keeps peeking at the clock and at the boxes until they match."
      step_by_step: "To set an alarm: Step 1: ask 'Hour?' and wait. Step 2: set Hour to answer. Step 3: ask 'Minute?' and wait, set Minute to answer. Step 4: if current hour = Hour and current minute = Minute, play the sound."
      real_world: "When your phone asks 'What time should I wake you?', it saves your answer and checks the time until it matches: the same idea."
    activity:
      type: sort
      prompt: What is it in the alarm program?
      bins:
      - Input block
      - Variable
      - Operator
      - Sound block
      items:
      - label: ask and wait
        bin: Input block
        clue: Shows a field for the user to type in.
        why: Input block (Sensing).
      - label: answer (the reply typed)
        bin: Input block
        clue: Comes straight from the ask block.
        why: The answer reporter belongs to the ask block.
      - label: Hour
        bin: Variable
        clue: Stores the typed hour so it can be used later.
        why: A variable stores a value.
      - label: Minute
        bin: Variable
        clue: Stores a value.
        why: A variable.
      - label: = and 'and'
        bin: Operator
        clue: Compare the stored time with the clock's time.
        why: Operator blocks.
      - label: start sound
        bin: Sound block
        clue: Plays the alarm.
        why: Sound block.
    lesson:
      - teach: The 'ask and wait' block (Sensing) lets the user type an answer. Store the answer in variables such as Hour and Minute. A variable is a named box that holds a value which can change.
        check:
          prompt: Where is the typed alarm hour kept?
          options:
          - In a variable
          - In the dial sprite
          - In the sound library
          answer: In a variable
          why: Variables store values for later use.
        ways:
        - style: real_world
          teach: 'A variable is like a labelled box on a shelf: the label stays, but you can change what is inside. When the ''ask and wait'' block (Sensing) gets the user''s answer, store it in boxes named Hour and Minute, so the alarm can check them later.'
      - teach: The alarm rings when Hour = current hour AND Minute = current minute. Use the = and 'and' blocks. Add a sound from the Sounds tab and play it with 'start sound', repeating a few times.
        picture:
          kind: flow
          steps:
          - ask and wait
          - store Hour and Minute
          - 'check: hour = Hour and minute = Minute'
          - start sound
          alt: The alarm logic.
        check:
          prompt: Why must both hour and minute be checked?
          options:
          - Otherwise it rings at wrong times
          - To save memory
          - To change the dial colour
          answer: Otherwise it rings at wrong times
          why: Checking only minutes would ring every hour.
        ways:
        - style: step_by_step
          teach: 'Build the alarm check. Step 1: compare Hour with the current hour using an = block. Step 2: compare Minute with the current minute. Step 3: join both with an ''and'' block, so it is true only when both match; checking only the hour would ring all hour long. Step 4: add a sound from the Sounds tab and play it with ''start sound'', repeated a few times.'
      - teach: Professionals mostly write text code (Python, Java, C++). Python was created in 1991 under Guido van Rossum and is used from games to AI. Syntax is the grammar of code; in Python, indentation and quotes are part of it.
        check:
          prompt: What is syntax?
          options:
          - The correct structure of code
          - A kind of sound
          - A sprite
          answer: The correct structure of code
          why: Like grammar in a language.
        ways:
        - style: real_world
          teach: 'Every language has grammar: ''ate I rice'' sounds wrong. Code has grammar too, called syntax: the correct structure a computer expects. In Python, indentation (spaces at the start of lines) and quotes are part of it. Python was created in 1991 under Guido van Rossum and is used from games to AI; professionals mostly write text code like Python, Java and C++.'
    items:
      - prompt: "Which block lets the user type in the alarm time?"
        options: ["ask and wait", "go to front layer", "point in direction", "change size"]
        answer: "ask and wait"
        difficulty: 1
        hints: ["It is in the Sensing section."]
        solution: "ask and wait."
        mistakes: {"point in direction": variables_input}
      - prompt: "What is a variable used for in the alarm clock project?"
        options: ["To store the alarm hour and minute", "To draw the dial", "To play the sound", "To rotate the hands"]
        answer: "To store the alarm hour and minute"
        difficulty: 1
        hints: ["It is a labelled place to keep a value."]
        solution: "Variables like Hour and Minute store the input."
        mistakes: {"To draw the dial": variables_input}
      - prompt: "Who led the creation of Python?"
        options: ["Guido van Rossum", "Charles Babbage", "Tim Berners-Lee", "John McCarthy"]
        answer: "Guido van Rossum"
        difficulty: 2
        hints: ["It was created in 1991."]
        solution: "Guido van Rossum."
        mistakes: {"Tim Berners-Lee": python_syntax}
      - prompt: "In which year was Python created?"
        answer: "1991"
        check: "1991"
        difficulty: 2
        hints: ["Early 1990s."]
        solution: "1991."
        mistakes: {"1956": python_syntax}
      - prompt: "In programming, syntax means"
        options: ["The correct structure of code, like grammar in a language", "The speed of the computer", "The colour of the code", "The name of the file"]
        answer: "The correct structure of code, like grammar in a language"
        difficulty: 2
        hints: ["In Python, indentation is part of it."]
        solution: "Syntax is the grammar of code."
        mistakes: {"The speed of the computer": python_syntax}
      - prompt: "When should the alarm sound play?"
        options: ["When the stored Hour and Minute equal the clock's current hour and minute", "Every second", "When the flag is clicked", "When the sprite is deleted"]
        answer: "When the stored Hour and Minute equal the clock's current hour and minute"
        difficulty: 2
        hints: ["Compare the variables with current time."]
        solution: "Both hour and minute must match."
        mistakes: {"Every second": variables_input}
      - prompt: "Which of these is a text-based programming language?"
        options: ["Python", "Scratch", "PictoBlox blocks", "Blockly"]
        answer: "Python"
        difficulty: 1
        hints: ["You type it, not drag it."]
        solution: "Python (also Java, C++)."
        mistakes: {"Scratch": block_coding}
      - prompt: "The alarm is set for 6:30, but it rings at 6:00, 6:30, 7:30 and other times. Which condition was probably used?"
        options: ["Only minute = Minute was checked", "hour = Hour and minute = Minute", "hour > Hour", "No condition at all"]
        answer: "Only minute = Minute was checked"
        difficulty: 3
        hints: ["It rings whenever the minutes are 30.", "Both the hour and the minute must match."]
        solution: "Step 1: Ringing at any :30 means only the minute is compared. Step 2: The fix is current hour = Hour and current minute = Minute, joined with 'and'."
        mistakes: {"hour = Hour and minute = Minute": variables_input, "hour > Hour": variables_input, "No condition at all": variables_input}
      - prompt: "In Python, a line inside an if block is not moved in like the others and the program stops with an error. What kind of mistake is this?"
        options: ["A syntax error: indentation is part of Python's grammar", "A wrong alarm time", "A missing sound file", "A slow computer"]
        answer: "A syntax error: indentation is part of Python's grammar"
        difficulty: 3
        hints: ["Syntax is like grammar for code.", "In Python, spaces at the start of a line matter."]
        solution: "Step 1: Python uses indentation to show which lines belong inside a block. Step 2: Wrong indentation breaks that rule, so it is a syntax error."
        mistakes: {"A wrong alarm time": python_syntax, "A missing sound file": python_syntax, "A slow computer": python_syntax}
      - prompt: Which block plays a chosen sound?
        options:
        - start sound
        - ask and wait
        - go to front layer
        - point in direction
        answer: start sound
        difficulty: 1
        hints:
        - It is in the Sound category.
        - It begins playing the sound.
        solution: 'Step 1: The alarm must make a noise. Step 2: Sound blocks play sounds. Step 3: start sound.'
        mistakes:
          ask and wait: variables_input
      - prompt: Which operator joins two conditions so both must be true?
        options:
        - and
        - or
        - not
        - +
        answer: and
        difficulty: 2
        hints:
        - The alarm needs hour AND minute to match.
        - With 'or', only one would need to match.
        solution: 'Step 1: Both conditions must hold. Step 2: The joining word means ''both''. Step 3: and.'
        mistakes:
          or: it3_both_match
      - prompt: Name one other way to get a sound into PictoBlox besides the library.
        options:
        - Record it
        - Draw it
        - Type it in Python only
        - Scan it
        answer: Record it
        difficulty: 2
        hints:
        - Use a microphone.
        - 'The Sounds tab has three options: library, record, upload.'
        solution: 'Step 1: Library is one option. Step 2: You can also use a microphone or a file. Step 3: Record it.'
        mistakes:
          Draw it: variables_input
      - prompt: In Python, which is part of the syntax?
        options:
        - Indentation
        - The colour of the screen
        - The size of the monitor
        - The speed of the internet
        answer: Indentation
        difficulty: 2
        hints:
        - Python cares how lines are lined up.
        - Spaces at the start of a line matter.
        solution: 'Step 1: Syntax = rules for writing code. Step 2: Python uses spaces to group lines. Step 3: Indentation.'
        mistakes:
          The colour of the screen: python_syntax
      - prompt: The user types 7 for the hour. Which variable should hold it?
        options:
        - Hour
        - Minute
        - Second
        - Sound
        answer: Hour
        difficulty: 1
        hints:
        - Match the value to its meaning.
        - 7 is the alarm's hour.
        solution: 'Step 1: Two variables: Hour and Minute. Step 2: 7 is the hour. Step 3: Hour.'
        mistakes:
          Minute: it3_store_input
      - prompt: When you add sprites in PictoBlox's Python mode, what appears?
        options:
        - Some Python code is generated
        - The sprites disappear
        - A new block category
        - The computer restarts
        answer: Some Python code is generated
        difficulty: 3
        hints:
        - The Python window shows code for what you do.
        - Sprites need code to exist in Python.
        solution: 'Step 1: Python mode shows code. Step 2: Adding sprites creates matching lines. Step 3: Some code is generated.'
        mistakes:
          The sprites disappear: python_syntax
