# Class 9 Information and Communications Technology, chapter 9. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 2 text supplied by the school. Topic: HTML webpages.
# Note: the textbook's Table 9.2 labels #00ff00 as blue; it is green (#0000ff is blue). This pack uses the correct colours.
subject: it
chapter: 9
title: Creating a Webpage

tips:
  web_basics: "A webpage is a file stored on a server. Your browser asks the server for it using its URL and shows it. In https://www.schoolwiki.in, https:// is how to access it, www is part of the server, schoolwiki.in is the domain name. Browsers: Firefox, Chromium, Chrome, Safari, Edge."
  html_structure: "HTML (HyperText Markup Language), invented by Tim Berners-Lee, tells the browser how to show content. A page starts with <html> and ends with </html>; <head> holds metadata and <title> (shown in the title bar); <body> holds what appears on the page."
  html_tags: "Tags are written in angle brackets; most have an opening tag and a closing tag with /. Headings <h1> (biggest) to <h6>, paragraph <p>, line break <br>, bold <b>, italic <i>, underline <u>, <font color face size>."
  attributes: "Attributes add settings inside the opening tag, e.g. <body bgcolor=\"#0000ff\">, <img src=\"juice.png\" height=\"400\" width=\"200\">. To change an image, change src. Hex colours mix red, green, blue: #ff0000 red, #00ff00 green, #0000ff blue, #000000 black, #ffffff white."
  html_table: "A table uses <table>...</table>; each row is <tr>, header cells <th>, ordinary cells <td>. Video uses <video controls> with <source src=\"video.mp4\" type=\"video/mp4\">."

concepts:
  - code: it9.web.how_webpages_work
    title: How webpages work
    notes: |
      A website usually has several webpages. A webpage is a digital page viewable on a computer, phone
      or tablet, with images, text, buttons and animations. It is a file stored on a computer called a
      server; your device sends a request and the server sends the page back, like a library teacher
      fetching a book you ask for. Each page has a unique URL (Uniform Resource Locator), its web address.
      https://www.schoolwiki.in has three parts: https:// (how to access the page), www (part of the
      server), schoolwiki.in (name or domain). A web browser (Mozilla Firefox, Chromium, Google Chrome,
      Safari, Microsoft Edge) interprets the URL, fetches the page and turns the page's instructions into
      text and images. Right-click → View Page Source shows the instructions (tags). HTML (HyperText Markup
      Language) tells the browser how to display content; it was invented by Sir Tim Berners-Lee.
    explanations:
      text: "Webpages live on servers. When you type a URL, your browser asks the server for that page, receives it, and reads its HTML to draw it on your screen."
      visual: "It is like a library: the server is the library, the URL is the book's code, and the browser is you asking the teacher and reading the book."
      step_by_step: "To read a URL: Step 1: https:// tells how to connect. Step 2: www names part of the server. Step 3: the rest (schoolwiki.in) is the domain name."
      real_world: "When you open samagra.kite.kerala.gov.in, a KITE server sends the page to your phone in a fraction of a second."
    items:
      - prompt: "What does URL stand for?"
        options: ["Uniform Resource Locator", "Universal Reading Link", "United Resource Line", "User Route Locator"]
        answer: "Uniform Resource Locator"
        difficulty: 1
        hints: ["It is a web address."]
        solution: "Uniform Resource Locator."
        mistakes: {"Universal Reading Link": web_basics}
      - prompt: "The computer that stores webpages and sends them when asked is called a"
        options: ["Server", "Browser", "Router", "Printer"]
        answer: "Server"
        difficulty: 1
        hints: ["It serves pages to devices."]
        solution: "A server."
        mistakes: {"Browser": web_basics}
      - prompt: "Which of these is a web browser?"
        options: ["Mozilla Firefox", "GIMP", "LibreOffice Calc", "Kalzium"]
        answer: "Mozilla Firefox"
        difficulty: 1
        hints: ["It displays webpages."]
        solution: "Firefox (also Chromium, Chrome, Safari, Edge)."
        mistakes: {"GIMP": web_basics}
      - prompt: "Who invented HTML?"
        options: ["Tim Berners-Lee", "Ward Cunningham", "John McCarthy", "Ray Tomlinson"]
        answer: "Tim Berners-Lee"
        difficulty: 2
        hints: ["A British computer scientist, later at Oxford and MIT."]
        solution: "Sir Tim Berners-Lee."
        mistakes: {"Ward Cunningham": html_structure}
      - prompt: "In https://www.schoolwiki.in, which part is the domain name?"
        options: ["schoolwiki.in", "https://", "www", "https://www"]
        answer: "schoolwiki.in"
        difficulty: 2
        hints: ["It is the name of the site."]
        solution: "schoolwiki.in."
        mistakes: {"www": web_basics}
      - prompt: "How can you see the HTML instructions of a page in a browser?"
        options: ["Right-click → View Page Source", "Press F11", "File → Export", "Double-click the image"]
        answer: "Right-click → View Page Source"
        difficulty: 2
        hints: ["It shows the source code."]
        solution: "View Page Source."
        mistakes: {"Press F11": html_structure}

  - code: it9.web.html_basics
    title: HTML structure, headings and formatting
    after: [it9.web.how_webpages_work]
    notes: |
      HTML tags are instructions in angle brackets (<html>); an element is a tag and the content inside
      it, e.g. <h1>This is a heading</h1>. Most tags have an opening and closing tag (with /). Basic
      structure: <html> ... </html> around everything; <head> holds metadata (data about data) including
      <title>, shown in the browser's title bar; <body> holds the content displayed. <h1> is the main
      heading; <h2> to <h6> for other headings; <p> for paragraphs. Write the page in a Text Editor and
      save as schoolMain.html; double-click to open in the browser; to edit, right-click → Open With Other
      Application → Text Editor. Attributes give extra settings in the opening tag: <body bgcolor="blue">
      or hexadecimal codes such as #0000ff; codes mix red, green and blue (#ff0000 red, #00ff00 green,
      #0000ff blue, #000000 black, #ffffff white). Choose a background that keeps text readable. Formatting:
      <font color="red">, <font face="Ubuntu">, <font size=5>, <br> new line, <b> bold, <i> italic, <u>
      underline. CSS makes pages more attractive.
    explanations:
      text: "An HTML page is text with tags. Everything sits inside <html>; page information goes in <head>, and what you see goes in <body>. Headings, paragraphs and formatting each have their own tag."
      visual: "Tags are like brackets around words: <b> opens bold and </b> closes it, so only the words between them become bold."
      step_by_step: "To make a first page: Step 1: open Text Editor. Step 2: type <html><head><title>My School</title></head><body><h1>School Name</h1><p>About us</p></body></html>. Step 3: save as schoolMain.html. Step 4: double-click it to view."
      real_world: "The title you see on a browser tab comes from the page's <title> tag."
    items:
      - prompt: "What does HTML stand for?"
        options: ["HyperText Markup Language", "High Tech Modern Language", "Home Tool Markup Language", "Hyperlink Text Making Language"]
        answer: "HyperText Markup Language"
        difficulty: 1
        hints: ["It is a markup language."]
        solution: "HyperText Markup Language."
        mistakes: {"High Tech Modern Language": html_structure}
      - prompt: "Which tag holds the content that is displayed on the webpage?"
        options: ["<body>", "<head>", "<title>", "<html> only"]
        answer: "<body>"
        difficulty: 1
        hints: ["<head> holds metadata."]
        solution: "<body>."
        mistakes: {"<head>": html_structure}
      - prompt: "Which tag gives the main heading of a page?"
        options: ["<h1>", "<h6>", "<p>", "<br>"]
        answer: "<h1>"
        difficulty: 1
        hints: ["Headings go from h1 to h6."]
        solution: "<h1>."
        mistakes: {"<h6>": html_tags}
      - prompt: "Text inside the <title> tag appears"
        options: ["In the browser's title bar", "As the main heading", "At the bottom of the page", "Nowhere"]
        answer: "In the browser's title bar"
        difficulty: 2
        hints: ["Look at the browser tab."]
        solution: "In the title bar or tab."
        mistakes: {"As the main heading": html_structure}
      - prompt: "Which tag ends a line and starts a new one?"
        options: ["<br>", "<p>", "<b>", "<u>"]
        answer: "<br>"
        difficulty: 2
        hints: ["Break."]
        solution: "<br>."
        mistakes: {"<b>": html_tags}
      - prompt: "Which hexadecimal code gives blue?"
        options: ["#0000ff", "#ff0000", "#00ff00", "#ffffff"]
        answer: "#0000ff"
        difficulty: 2
        hints: ["The code is red, green, blue in that order."]
        solution: "#0000ff (#00ff00 is green)."
        mistakes: {"#00ff00": attributes}
      - prompt: "Where must attributes like bgcolor be written?"
        options: ["Inside the opening tag", "Inside the closing tag", "After </html>", "In a separate file"]
        answer: "Inside the opening tag"
        difficulty: 2
        hints: ["<body bgcolor=\"blue\">."]
        solution: "In the opening tag."
        mistakes: {"Inside the closing tag": attributes}
      - prompt: "Metadata means"
        options: ["Data about data", "Very large data", "Deleted data", "Data in a table"]
        answer: "Data about data"
        difficulty: 2
        hints: ["It goes in the <head>."]
        solution: "Data about data."
        mistakes: {"Very large data": html_structure}

  - code: it9.web.images_tables
    title: Images, tables and video in HTML
    after: [it9.web.html_basics]
    notes: |
      Pictures are added with <img>; technically they are linked, not put inside the page. Attributes:
      src (file name), height and width, e.g. <img src="juice.png" height="400" width="200">; the image must
      be in the same folder as the page. To replace the image, change src. Tables: <table>...</table>
      defines a table, <tr> a row, <th> a header cell, <td> a cell. Example: Item, Description, Price rows
      for Jack Fruit Jam 100 g ₹150, Mango Squash 100 g ₹100, Tapioca 500 g ₹100. Tables can also lay out a
      whole page. Video: <video width="320" height="240" controls><source src="video.mp4"
      type="video/mp4"></video>. <hr> draws a horizontal line; links are another element (anchor tag).
    explanations:
      text: "Use <img> with src to show a picture, <table> with rows and cells to show data, and <video> to play a clip. The picture file must sit in the same folder as the page."
      visual: "Build a table like stacking shelves: <table> is the cupboard, each <tr> is a shelf, and each <td> is a box on that shelf."
      step_by_step: "To add a 3-column table with a header: Step 1: <table>. Step 2: <tr><th>Item</th><th>Description</th><th>Price</th></tr>. Step 3: one <tr> with three <td> for each item. Step 4: </table>."
      real_world: "Online shop pages use tables and images just like this to list products and prices."
    items:
      - prompt: "Which tag adds an image to a webpage?"
        options: ["<img>", "<table>", "<video>", "<font>"]
        answer: "<img>"
        difficulty: 1
        hints: ["Short for image."]
        solution: "<img>."
        mistakes: {"<video>": attributes}
      - prompt: "In <img src=\"juice.png\" height=\"200\" width=\"400\">, which part must change to show a different picture?"
        options: ["src", "img", "width", "height"]
        answer: "src"
        difficulty: 1
        hints: ["It names the image file."]
        solution: "src."
        mistakes: {"width": attributes}
      - prompt: "Which tag defines a table row?"
        options: ["<tr>", "<td>", "<th>", "<table>"]
        answer: "<tr>"
        difficulty: 1
        hints: ["t-r = table row."]
        solution: "<tr>."
        mistakes: {"<td>": html_table}
      - prompt: "Which tag defines a header cell in a table?"
        options: ["<th>", "<td>", "<tr>", "<h1>"]
        answer: "<th>"
        difficulty: 2
        hints: ["t-h = table header."]
        solution: "<th>."
        mistakes: {"<h1>": html_table}
      - prompt: "A table has a header row and 3 item rows, each with 3 cells. How many cells are there in total?"
        answer: "12"
        check: "(1 + 3) * 3"
        difficulty: 2
        hints: ["4 rows × 3 columns."]
        solution: "4 × 3 = 12 cells."
        mistakes: {"9": html_table}
      - prompt: "The image does not appear on your page. What is a likely reason?"
        options: ["The image file is not in the same folder as the page", "The page has a title", "The body is blue", "The table has three rows"]
        answer: "The image file is not in the same folder as the page"
        difficulty: 2
        hints: ["Images are linked, not stored inside the page."]
        solution: "Keep the image in the page's folder or give the correct path."
        mistakes: {"The page has a title": attributes}
      - prompt: "Which attribute in the <video> tag shows play and pause buttons?"
        options: ["controls", "src", "bgcolor", "face"]
        answer: "controls"
        difficulty: 2
        hints: ["<video width=\"320\" height=\"240\" controls>."]
        solution: "controls."
        mistakes: {"src": html_table}
      - prompt: "In the fruit fest table, Jack Fruit Jam is ₹150 and Mango Squash ₹100. What is the total for one of each?"
        answer: "250"
        check: "150 + 100"
        difficulty: 1
        hints: ["Add the prices."]
        solution: "₹250."
        mistakes: {"50": html_table}
