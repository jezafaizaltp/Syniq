# Class 9 Information and Communications Technology, chapter 9. Format: content/README.md.
# Written from the 2024 SCERT ICT Part 2 text supplied by the school. Topic: HTML webpages.
# Note: the textbook's Table 9.2 labels #00ff00 as blue; it is green (#0000ff is blue). This pack uses the correct colours.
subject: it
chapter: 9
title: Creating a Webpage

tips:
  web_basics: "URL spells out the address that locates a resource. The powerful computer that 'serves' pages when asked is different from the app that shows them (Firefox, Chrome). In a web address, 'www' is just a part; the domain is the main name with its ending."
  html_structure: "HTML was invented by the scientist who created the World Wide Web. Displayed content goes in one main section; the head holds information about the page itself ('meta' means about), and the title shows at the very top of the browser window or tab."
  html_tags: "Heading tags run from h1 (largest) to h6 (smallest). A line break tag is short for 'break'; <b> is bold."
  attributes: "Attributes are settings written within the tag that starts an element, never the one that ends it. Hex colours are #RRGGBB: the last pair is blue. The image tag is short for image, and src names the file to show, which must be where the page can find it."
  html_table: "Table tags are short: tr = table row, th = table header, td = table data. Count cells as rows × cells per row, including the header row. The video attribute that shows play buttons is named after them. Add the prices to get the total."
  it9_request_reply: Your browser asks; the server holds the file and sends it back. Who stores, and who displays?
  it9_url_parts: A URL has a method (https://), a server part (www), a domain name, and sometimes a page path after the slash.
  it9_browser_list: 'Browsers open webpages: Firefox, Chromium, Chrome, Safari, Edge. Editors, servers and search sites are different things.'
  it9_head_body: The head holds information about the page (like its title); the body holds what visitors see.
  it9_close_tag: A closing tag is the same as the opening one with a / after the <.
  it9_hex_colour: 'In #RRGGBB, the first pair is red, the second green, the third blue. ff is full, 00 is none.'
  it9_table_tags: "Each table tag has one job: wrap the whole table, start a row, make a heading cell, or make an ordinary cell. The letters hint at the job (t = table, r = row, h = heading, d = data)."
  it9_img_attr: src names the picture file; height and width set its size.
  it9_packs_count: First find how many 500 g packs make the amount asked for, then multiply by the price of one pack.

concepts:
  - code: it9.web.how_webpages_work
    title: How webpages work
    notes: |
      A website usually has several webpages. A webpage is a digital page viewable on a computer, phone
      or tablet, with images, text, buttons and animations. It is a file stored on a computer called a
      server; your device sends a request and the server sends the page back, like a library teacher
      fetching a book you ask for. Each page has a unique URL (Uniform Resource Locator), its web address.
      https://www.schoolwiki.in has three parts: https:// (how to access the page), www (part of the
      server), schoolwiki.in (name or domain). A web browser (Mozilla Firefox, Chromium, Google Chrome,
      Safari, Microsoft Edge) interprets the URL, fetches the page and turns the page's instructions into
      text and images. Right-click → View Page Source shows the instructions (tags). HTML (HyperText Markup
      Language) tells the browser how to display content; it was invented by Sir Tim Berners-Lee.
    explanations:
      text: "Webpages live on servers. When you type a URL, your browser asks the server for that page, receives it, and reads its HTML to draw it on your screen."
      visual: "It is like a library: the server is the library, the URL is the book's code, and the browser is you asking the teacher and reading the book."
      step_by_step: "To read a URL: Step 1: https:// tells how to connect. Step 2: www names part of the server. Step 3: the rest (schoolwiki.in) is the domain name."
      real_world: "When you open samagra.kite.kerala.gov.in, a KITE server sends the page to your phone in a fraction of a second."
    activity:
      type: sort
      prompt: Which part of https://www.schoolwiki.in?
      bins:
      - https://
      - www
      - schoolwiki.in
      items:
      - label: How to access the page (the protocol)
        bin: https://
        clue: Comes first, with a colon and slashes.
        why: https:// says how to access it.
      - label: Part of the server
        bin: www
        clue: The middle part.
        why: www.
      - label: The name, or domain
        bin: schoolwiki.in
        clue: The easy-to-remember name.
        why: The domain.
      - label: Would change to cusat.ac.in for another site
        bin: schoolwiki.in
        clue: Which part names the site?
        why: The domain changes.
      - label: Secure transfer of webpages
        bin: https://
        clue: The 's' means secure.
        why: Protocol part.
    lesson:
      - teach: A website is a set of webpages. A webpage is a file stored on a server. Your device sends a request; the server sends the page back, like a librarian fetching the book you ask for. Each page has a unique address, its URL (Uniform Resource Locator).
        picture:
          kind: flow
          steps:
          - You type a URL
          - Browser sends a request
          - Server finds the file
          - Server sends it back
          - Browser shows the page
          alt: How a webpage reaches you.
        check:
          prompt: Where is a webpage file stored?
          options:
          - On a server
          - In the browser's icon
          - In the keyboard
          answer: On a server
          why: The server sends a copy when asked.
      - teach: 'https://www.schoolwiki.in has three parts: https:// (how to access), www (part of the server), schoolwiki.in (domain name). A browser (Firefox, Chromium, Chrome, Safari, Edge) fetches the page and turns its instructions into text and images.'
        check:
          prompt: In https://www.kite.kerala.gov.in, the method of access is
          options:
          - https://
          - www
          - kerala.gov.in
          answer: https://
          why: The first part tells how to access the page.
      - teach: Webpages are written in HTML (HyperText Markup Language), invented by Tim Berners-Lee. Right-click → View Page Source shows a page's HTML tags.
        check:
          prompt: How can you see a page's HTML?
          options:
          - Right-click → View Page Source
          - Press F11
          - Use OCR
          answer: Right-click → View Page Source
          why: The browser shows the source code.
    items:
      - prompt: "What does URL stand for?"
        options: ["Uniform Resource Locator", "Universal Reading Link", "United Resource Line", "User Route Locator"]
        answer: "Uniform Resource Locator"
        difficulty: 1
        hints: ["It is a web address."]
        solution: "Uniform Resource Locator."
        mistakes: {"Universal Reading Link": web_basics}
      - prompt: "The computer that stores webpages and sends them when asked is called a"
        options: ["Server", "Browser", "Router", "Printer"]
        answer: "Server"
        difficulty: 1
        hints: ["It serves pages to devices."]
        solution: "A server."
        mistakes: {"Browser": web_basics}
      - prompt: "Which of these is a web browser?"
        options: ["Mozilla Firefox", "GIMP", "LibreOffice Calc", "Kalzium"]
        answer: "Mozilla Firefox"
        difficulty: 1
        hints: ["It displays webpages."]
        solution: "Firefox (also Chromium, Chrome, Safari, Edge)."
        mistakes: {"GIMP": web_basics}
      - prompt: "Who invented HTML?"
        options: ["Tim Berners-Lee", "Ward Cunningham", "John McCarthy", "Ray Tomlinson"]
        answer: "Tim Berners-Lee"
        difficulty: 2
        hints: ["A British computer scientist, later at Oxford and MIT."]
        solution: "Sir Tim Berners-Lee."
        mistakes: {"Ward Cunningham": html_structure}
      - prompt: "In https://www.schoolwiki.in, which part is the domain name?"
        options: ["schoolwiki.in", "https://", "www", "https://www"]
        answer: "schoolwiki.in"
        difficulty: 2
        hints: ["It is the name of the site."]
        solution: "schoolwiki.in."
        mistakes: {"www": web_basics}
      - prompt: "How can you see the HTML instructions of a page in a browser?"
        options: ["Right-click → View Page Source", "Press F11", "File → Export", "Double-click the image"]
        answer: "Right-click → View Page Source"
        difficulty: 2
        hints: ["It shows the source code."]
        solution: "View Page Source."
        mistakes: {"Press F11": html_structure}
      - prompt: "In https://www.schoolwiki.in/Main_Page, what does the part after the domain name, /Main_Page, tell the server?"
        options: ["Which page on that site to send", "Which browser you use", "Your IP address", "The school's password"]
        answer: "Which page on that site to send"
        difficulty: 3
        hints: ["The domain names the site.", "A site has many pages; how does the server know which one?"]
        solution: "Step 1: schoolwiki.in names the website. Step 2: /Main_Page names the particular page the server should send back."
        mistakes: {"Which browser you use": web_basics, "Your IP address": web_basics, "The school's password": web_basics}
      - prompt: "You open the same page on a phone and a laptop. Where is the page's file actually stored?"
        options: ["On the server, which sends a copy to each device", "On the phone only", "On the laptop only", "Inside the browser program"]
        answer: "On the server, which sends a copy to each device"
        difficulty: 3
        hints: ["Who answers the device's request?", "Think of the library teacher and the book."]
        solution: "Step 1: The webpage file lives on a server. Step 2: Each device sends a request and the server sends the page to it."
        mistakes: {"On the phone only": web_basics, "On the laptop only": web_basics, "Inside the browser program": web_basics}
      - prompt: Which of these is NOT a web browser?
        options:
        - Text Editor
        - Chromium
        - Safari
        - Microsoft Edge
        answer: Text Editor
        difficulty: 1
        hints:
        - Browsers display webpages.
        - One option is for writing plain text.
        solution: 'Step 1: Chromium, Safari and Edge open webpages. Step 2: Text Editor writes files. Step 3: Text Editor.'
        mistakes:
          Chromium: it9_browser_list
      - prompt: In https://www.schoolwiki.in, what does 'www' refer to?
        options:
        - Part of the server
        - The domain name
        - The method of access
        - The page path
        answer: Part of the server
        difficulty: 2
        hints:
        - It comes between https:// and the domain.
        - It points to the web server.
        solution: 'Step 1: https:// = method. Step 2: schoolwiki.in = domain. Step 3: www = part of the server.'
        mistakes:
          The domain name: it9_url_parts
      - prompt: In the library comparison, who plays the part of the server?
        options:
        - The library teacher who fetches the book
        - The student who asks
        - The book's author
        - The school bus
        answer: The library teacher who fetches the book
        difficulty: 2
        hints:
        - The server keeps and sends files.
        - Who keeps and fetches books?
        solution: 'Step 1: You ask = browser request. Step 2: The keeper fetches = server. Step 3: The library teacher.'
        mistakes:
          The student who asks: it9_request_reply
      - prompt: What does a web browser do with a page's HTML?
        options:
        - Turns its instructions into text and images on screen
        - Deletes it
        - Prints it as code only
        - Sends it to the printer
        answer: Turns its instructions into text and images on screen
        difficulty: 1
        hints:
        - HTML is a set of instructions.
        - The browser follows them.
        solution: 'Step 1: HTML says how to show content. Step 2: The browser reads it. Step 3: It displays text and images.'
        mistakes:
          Prints it as code only: web_basics
      - prompt: Does every webpage have its own unique URL?
        options:
        - 'Yes'
        - No, all pages share one
        - Only home pages
        - Only pages with pictures
        answer: 'Yes'
        difficulty: 1
        hints:
        - A URL is like a postal address.
        - Two houses can't share an address.
        solution: 'Step 1: A URL locates one page. Step 2: Each page must be found exactly. Step 3: Yes, each is unique.'
        mistakes:
          No, all pages share one: it9_url_parts
      - prompt: What does a website usually consist of?
        options:
        - Several webpages
        - Only one image
        - A single word
        - A printer and a scanner
        answer: Several webpages
        difficulty: 1
        hints:
        - Think of SchoolWiki's many pages.
        - A site groups pages together.
        solution: 'Step 1: Sites have home, about, contact pages and more. Step 2: They are grouped. Step 3: Several webpages.'
        mistakes:
          Only one image: web_basics
      - prompt: In https://www.example.org/news, which part is the page path?
        options:
        - /news
        - https://
        - www
        - example.org
        answer: /news
        difficulty: 3
        hints:
        - It comes after the domain name.
        - It starts with a slash.
        solution: 'Step 1: https:// = method; www = server; example.org = domain. Step 2: The rest is the path. Step 3: /news.'
        mistakes:
          example.org: it9_url_parts

  - code: it9.web.html_basics
    title: HTML structure, headings and formatting
    after: [it9.web.how_webpages_work]
    notes: |
      HTML tags are instructions in angle brackets (<html>); an element is a tag and the content inside
      it, e.g. <h1>This is a heading</h1>. Most tags have an opening and closing tag (with /). Basic
      structure: <html> ... </html> around everything; <head> holds metadata (data about data) including
      <title>, shown in the browser's title bar; <body> holds the content displayed. <h1> is the main
      heading; <h2> to <h6> for other headings; <p> for paragraphs. Write the page in a Text Editor and
      save as schoolMain.html; double-click to open in the browser; to edit, right-click → Open With Other
      Application → Text Editor. Attributes give extra settings in the opening tag: <body bgcolor="blue">
      or hexadecimal codes such as #0000ff; codes mix red, green and blue (#ff0000 red, #00ff00 green,
      #0000ff blue, #000000 black, #ffffff white). Choose a background that keeps text readable. Formatting:
      <font color="red">, <font face="Ubuntu">, <font size=5>, <br> new line, <b> bold, <i> italic, <u>
      underline. CSS makes pages more attractive.
    explanations:
      text: "An HTML page is text with tags. Everything sits inside <html>; page information goes in <head>, and what you see goes in <body>. Headings, paragraphs and formatting each have their own tag."
      visual: "Tags are like brackets around words: <b> opens bold and </b> closes it, so only the words between them become bold."
      step_by_step: "To make a first page: Step 1: open Text Editor. Step 2: type <html><head><title>My School</title></head><body><h1>School Name</h1><p>About us</p></body></html>. Step 3: save as schoolMain.html. Step 4: double-click it to view."
      real_world: "The title you see on a browser tab comes from the page's <title> tag."
    activity:
      type: sort
      prompt: Which tag?
      bins:
      - <head>
      - <body>
      - <h1>
      - <p>
      items:
      - label: Holds the <title> shown in the title bar
        bin: <head>
        clue: Metadata, not shown on the page.
        why: <head>.
      - label: Holds all the content you see
        bin: <body>
        clue: Displayed in the window.
        why: <body>.
      - label: The main heading
        bin: <h1>
        clue: The biggest heading.
        why: <h1>.
      - label: A paragraph of text
        bin: <p>
        clue: Ordinary text block.
        why: <p>.
      - label: Where bgcolor="blue" goes to colour the page
        bin: <body>
        clue: The visible part of the page.
        why: <body bgcolor=...>.
      - label: Data about data (metadata)
        bin: <head>
        clue: Not displayed.
        why: <head>.
    lesson:
      - teach: 'HTML tags are instructions in angle brackets. Most come in pairs: <p> ... </p>. A page''s structure: <html> wraps everything; <head> holds information like <title> (shown in the title bar); <body> holds what is displayed.'
        picture:
          kind: flow
          steps:
          - <html>
          - <head><title>…</title></head>
          - <body> content </body>
          - </html>
          alt: Basic structure of an HTML page.
        check:
          prompt: Which tag holds the visible content?
          options:
          - <body>
          - <head>
          - <title>
          answer: <body>
          why: The body is what visitors see.
      - teach: 'Headings: <h1> (main) to <h6>. Paragraph: <p>. New line: <br>. Bold <b>, italic <i>, underline <u>. Font: <font color="red" size=5 face="Ubuntu">. Save the file as name.html in a Text Editor and open it in a browser.'
        check:
          prompt: Which tag makes text bold?
          options:
          - <b>
          - <i>
          - <br>
          answer: <b>
          why: b stands for bold.
      - teach: 'Attributes go inside the opening tag: <body bgcolor="#0000ff">. Colour codes are #RRGGBB: #ff0000 red, #00ff00 green, #0000ff blue, #000000 black, #ffffff white. Pick colours that keep text readable.'
        picture:
          kind: compare
          columns:
          - title: Code
            points:
            - '#ff0000'
            - '#00ff00'
            - '#0000ff'
          - title: Colour
            points:
            - red
            - green
            - blue
          alt: Hex colour codes.
        check:
          prompt: '#000000 is'
          options:
          - Black
          - White
          - Red
          answer: Black
          why: No red, no green, no blue.
    items:
      - prompt: "What does HTML stand for?"
        options: ["HyperText Markup Language", "High Tech Modern Language", "Home Tool Markup Language", "Hyperlink Text Making Language"]
        answer: "HyperText Markup Language"
        difficulty: 1
        hints: ["It is a markup language."]
        solution: "HyperText Markup Language."
        mistakes: {"High Tech Modern Language": html_structure}
      - prompt: "Which tag holds the content that is displayed on the webpage?"
        options: ["<body>", "<head>", "<title>", "<html> only"]
        answer: "<body>"
        difficulty: 1
        hints: ["<head> holds metadata."]
        solution: "<body>."
        mistakes: {"<head>": html_structure}
      - prompt: "Which tag gives the main heading of a page?"
        options: ["<h1>", "<h6>", "<p>", "<br>"]
        answer: "<h1>"
        difficulty: 1
        hints: ["Headings go from h1 to h6."]
        solution: "<h1>."
        mistakes: {"<h6>": html_tags}
      - prompt: "Text inside the <title> tag appears"
        options: ["In the browser's title bar", "As the main heading", "At the bottom of the page", "Nowhere"]
        answer: "In the browser's title bar"
        difficulty: 2
        hints: ["Look at the browser tab."]
        solution: "In the title bar or tab."
        mistakes: {"As the main heading": html_structure}
      - prompt: "Which tag ends a line and starts a new one?"
        options: ["<br>", "<p>", "<b>", "<u>"]
        answer: "<br>"
        difficulty: 2
        hints: ["Break."]
        solution: "<br>."
        mistakes: {"<b>": html_tags}
      - prompt: "Which hexadecimal code gives blue?"
        options: ["#0000ff", "#ff0000", "#00ff00", "#ffffff"]
        answer: "#0000ff"
        difficulty: 2
        hints: ["The code is red, green, blue in that order."]
        solution: "#0000ff (#00ff00 is green)."
        mistakes: {"#00ff00": attributes}
      - prompt: "Where must attributes like bgcolor be written?"
        options: ["Inside the opening tag", "Inside the closing tag", "After </html>", "In a separate file"]
        answer: "Inside the opening tag"
        difficulty: 2
        hints: ["<body bgcolor=\"blue\">."]
        solution: "In the opening tag."
        mistakes: {"Inside the closing tag": attributes}
      - prompt: "Metadata means"
        options: ["Data about data", "Very large data", "Deleted data", "Data in a table"]
        answer: "Data about data"
        difficulty: 2
        hints: ["It goes in the <head>."]
        solution: "Data about data."
        mistakes: {"Very large data": html_structure}
      - prompt: "A page shows the heading, but every line after it is also huge and bold. Which mistake is most likely?"
        options: ["The closing </h1> tag is missing", "The <title> is too long", "The <body> tag is missing", "A <br> tag was used"]
        answer: "The closing </h1> tag is missing"
        difficulty: 3
        hints: ["Where does the heading's effect stop?", "Most tags need a closing tag with /."]
        solution: "Step 1: The h1 effect lasts until </h1>. Step 2: Without it, the rest of the text is treated as part of the heading."
        mistakes: {"The <title> is too long": html_structure, "The <body> tag is missing": html_structure, "A <br> tag was used": html_tags}
      - prompt: "Which line correctly gives the page a yellow background?"
        options: ["<body bgcolor=\"#ffff00\">", "<body> bgcolor=\"#ffff00\"", "</body bgcolor=\"#ffff00\">", "<bgcolor body=\"#ffff00\">"]
        answer: "<body bgcolor=\"#ffff00\">"
        difficulty: 3
        hints: ["Where must attributes go?", "Yellow is red + green at full, blue at zero."]
        solution: "Step 1: Attributes go inside the opening tag. Step 2: #ffff00 is full red and green, no blue: yellow."
        mistakes: {"<body> bgcolor=\"#ffff00\"": attributes, "</body bgcolor=\"#ffff00\">": attributes, "<bgcolor body=\"#ffff00\">": attributes}
      - prompt: Which is the closing tag for <p>?
        options:
        - </p>
        - <p/>
        - <\p>
        - <p>
        answer: </p>
        difficulty: 1
        hints:
        - Closing tags add a slash.
        - The slash comes right after the <.
        solution: 'Step 1: Same tag name. Step 2: Add / after <. Step 3: </p>.'
        mistakes:
          <p/>: it9_close_tag
      - prompt: Which hexadecimal code gives white?
        options:
        - '#ffffff'
        - '#000000'
        - '#ff0000'
        - '#00ff00'
        answer: '#ffffff'
        difficulty: 2
        hints:
        - White is all colours at full strength.
        - ff means full.
        solution: 'Step 1: White = full red, green and blue. Step 2: Each pair is ff. Step 3: #ffffff.'
        mistakes:
          '#000000': it9_hex_colour
      - prompt: Which tag gives italic text?
        options:
        - <i>
        - <u>
        - <b>
        - <h1>
        answer: <i>
        difficulty: 1
        hints:
        - Use the first letter of the style.
        - Underline is <u>.
        solution: 'Step 1: Bold = b, underline = u. Step 2: Italic starts with i. Step 3: <i>.'
        mistakes:
          <u>: html_tags
      - prompt: Where does the <title> tag go?
        options:
        - Inside <head>
        - Inside <body>
        - After </html>
        - Inside <p>
        answer: Inside <head>
        difficulty: 2
        hints:
        - The title is information about the page.
        - It is shown in the title bar, not on the page.
        solution: 'Step 1: <head> holds metadata. Step 2: The title is metadata. Step 3: Inside <head>.'
        mistakes:
          Inside <body>: it9_head_body
      - prompt: What file extension should a webpage be saved with?
        options:
        - .html
        - .odt
        - .xcf
        - .png
        answer: .html
        difficulty: 1
        hints:
        - The language is HTML.
        - The extension matches it.
        solution: 'Step 1: .odt is Writer, .xcf is GIMP, .png is an image. Step 2: Webpages use the language''s name. Step 3: .html.'
        mistakes:
          .odt: html_structure

  - code: it9.web.images_tables
    title: Images, tables and video in HTML
    after: [it9.web.html_basics]
    notes: |
      Pictures are added with <img>; technically they are linked, not put inside the page. Attributes:
      src (file name), height and width, e.g. <img src="juice.png" height="400" width="200">; the image must
      be in the same folder as the page. To replace the image, change src. Tables: <table>...</table>
      defines a table, <tr> a row, <th> a header cell, <td> a cell. Example: Item, Description, Price rows
      for Jack Fruit Jam 100 g ₹150, Mango Squash 100 g ₹100, Tapioca 500 g ₹100. Tables can also lay out a
      whole page. Video: <video width="320" height="240" controls><source src="video.mp4"
      type="video/mp4"></video>. <hr> draws a horizontal line; links are another element (anchor tag).
    explanations:
      text: "Use <img> with src to show a picture, <table> with rows and cells to show data, and <video> to play a clip. The picture file must sit in the same folder as the page."
      visual: "Build a table like stacking shelves: <table> is the cupboard, each <tr> is a shelf, and each <td> is a box on that shelf."
      step_by_step: "To add a 3-column table with a header: Step 1: <table>. Step 2: <tr><th>Item</th><th>Description</th><th>Price</th></tr>. Step 3: one <tr> with three <td> for each item. Step 4: </table>."
      real_world: "Online shop pages use tables and images just like this to list products and prices."
    activity:
      type: sort
      prompt: Which tag?
      bins:
      - <img>
      - <table>
      - <tr>
      - <td>
      items:
      - label: Adds a picture with src, height and width
        bin: <img>
        clue: Linked, not inside the page.
        why: <img>.
      - label: Starts and ends the whole table
        bin: <table>
        clue: Around everything.
        why: <table>.
      - label: 'One row: Mango Squash, 100 g, ₹100'
        bin: <tr>
        clue: A row of cells.
        why: <tr> = table row.
      - label: 'One cell: ₹150'
        bin: <td>
        clue: A single box.
        why: <td> = table data cell.
      - label: Change the file name to show a new picture
        bin: <img>
        clue: Change src.
        why: <img src=...>.
      - label: 'One cell: Jack Fruit Jam'
        bin: <td>
        clue: A single box.
        why: <td>.
    lesson:
      - teach: <img src="juice.png" height="400" width="200"> shows a picture. src gives the file name; the image must be in the same folder as the page. Change src to show a different picture.
        check:
          prompt: Which attribute names the image file?
          options:
          - src
          - width
          - bgcolor
          answer: src
          why: src = source file.
      - teach: 'Tables: <table> wraps the table, <tr> makes each row, <th> a heading cell, <td> an ordinary cell. Video: <video width="320" height="240" controls><source src="video.mp4" type="video/mp4"></video>. <hr> draws a horizontal line.'
        picture:
          kind: compare
          columns:
          - title: Table tags
            points:
            - <table> whole table
            - <tr> row
            - <th> heading cell
            - <td> cell
          - title: Other
            points:
            - <img> picture
            - <video> video
            - <hr> line
          alt: HTML tags for tables and media.
        check:
          prompt: Which tag starts a new row?
          options:
          - <tr>
          - <td>
          - <th>
          answer: <tr>
          why: tr = table row.
    items:
      - prompt: "Which tag adds an image to a webpage?"
        options: ["<img>", "<table>", "<video>", "<font>"]
        answer: "<img>"
        difficulty: 1
        hints: ["Short for image."]
        solution: "<img>."
        mistakes: {"<video>": attributes}
      - prompt: "In <img src=\"juice.png\" height=\"200\" width=\"400\">, which part must change to show a different picture?"
        options: ["src", "img", "width", "height"]
        answer: "src"
        difficulty: 1
        hints: ["It names the image file."]
        solution: "src."
        mistakes: {"width": attributes}
      - prompt: "Which tag defines a table row?"
        options: ["<tr>", "<td>", "<th>", "<table>"]
        answer: "<tr>"
        difficulty: 1
        hints: ["t-r = table row."]
        solution: "<tr>."
        mistakes: {"<td>": html_table}
      - prompt: "Which tag defines a header cell in a table?"
        options: ["<th>", "<td>", "<tr>", "<h1>"]
        answer: "<th>"
        difficulty: 2
        hints: ["t-h = table header."]
        solution: "<th>."
        mistakes: {"<h1>": html_table}
      - prompt: "A table has a header row and 3 item rows, each with 3 cells. How many cells are there in total?"
        answer: "12"
        check: "(1 + 3) * 3"
        difficulty: 2
        hints: ["4 rows × 3 columns."]
        solution: "4 × 3 = 12 cells."
        mistakes: {"9": html_table}
      - prompt: "The image does not appear on your page. What is a likely reason?"
        options: ["The image file is not in the same folder as the page", "The page has a title", "The body is blue", "The table has three rows"]
        answer: "The image file is not in the same folder as the page"
        difficulty: 2
        hints: ["Images are linked, not stored inside the page."]
        solution: "Keep the image in the page's folder or give the correct path."
        mistakes: {"The page has a title": attributes}
      - prompt: "Which attribute in the <video> tag shows play and pause buttons?"
        options: ["controls", "src", "bgcolor", "face"]
        answer: "controls"
        difficulty: 2
        hints: ["It is a single word with no value, written inside the <video> tag, and it names what the viewer gets."]
        solution: "controls."
        mistakes: {"src": html_table}
      - prompt: "In the fruit fest table, Jack Fruit Jam is ₹150 and Mango Squash ₹100. What is the total for one of each?"
        answer: "250"
        check: "150 + 100"
        difficulty: 1
        hints: ["Add the prices."]
        solution: "₹250."
        mistakes: {"50": html_table}
      - prompt: "A price table has 1 header row and 4 item rows, with 3 columns. How many <td> cells are there?"
        answer: "12"
        check: "4*3"
        difficulty: 3
        hints: ["Header cells use <th>, not <td>.", "Count only the item rows."]
        solution: "Step 1: The header row uses <th>. Step 2: 4 item rows × 3 cells = 12 <td> cells."
        mistakes: {"15": html_table, "7": html_table}
      - prompt: "<img src=\"juice.png\" height=\"400\" width=\"200\"> makes the picture look stretched tall. What is the simplest fix?"
        options: ["Change height and width to match the picture's real shape", "Change src to juice.jpg", "Put the image inside <th>", "Add the controls attribute"]
        answer: "Change height and width to match the picture's real shape"
        difficulty: 3
        hints: ["Which attributes set the size?", "Here the height is twice the width."]
        solution: "Step 1: height and width set the size shown. Step 2: 400 tall by 200 wide squeezes a wider picture, so use values in the picture's own proportion."
        mistakes: {"Change src to juice.jpg": attributes, "Put the image inside <th>": html_table, "Add the controls attribute": html_table}
      - prompt: Which tag draws a horizontal line across the page?
        options:
        - <hr>
        - <br>
        - <tr>
        - <th>
        answer: <hr>
        difficulty: 1
        hints:
        - h for horizontal.
        - <br> only breaks the line.
        solution: 'Step 1: <br> = new line. Step 2: A drawn line across is horizontal rule. Step 3: <hr>.'
        mistakes:
          <br>: html_tags
      - prompt: Which tag holds an ordinary data cell in a table?
        options:
        - <td>
        - <th>
        - <tr>
        - <table>
        answer: <td>
        difficulty: 1
        hints:
        - th is for headings.
        - d stands for data.
        solution: 'Step 1: th = heading cell. Step 2: Normal cells hold data. Step 3: <td>.'
        mistakes:
          <th>: it9_table_tags
      - prompt: A table has 1 header row and 5 item rows, with 4 columns. How many cells in all?
        answer: '24'
        check: (1+5)*4
        difficulty: 2
        hints:
        - Count all rows first.
        - Rows × columns.
        solution: 'Step 1: 1 + 5 = 6 rows. Step 2: 4 columns. Step 3: 6 × 4 = 24 cells.'
        mistakes:
          '20': it9_table_tags
          '10': it9_table_tags
      - prompt: In <img src="logo.png" width="300">, what does width set?
        options:
        - How wide the image appears
        - The file name
        - The page colour
        - The video length
        answer: How wide the image appears
        difficulty: 1
        hints:
        - Width is a size.
        - src is the file name.
        solution: 'Step 1: src = file. Step 2: width = size across. Step 3: How wide it appears.'
        mistakes:
          The file name: it9_img_attr
      - prompt: Tapioca 500 g costs ₹100 in the fruit fest table. What would 2 kg cost at the same rate?
        answer: '400'
        check: 100*2000/500
        difficulty: 3
        hints:
        - How many 500 g packs make 2 kg?
        - 2 kg = 2000 g.
        solution: 'Step 1: 2000 ÷ 500 = 4 packs. Step 2: 4 × ₹100. Step 3: ₹400.'
        mistakes:
          '200': it9_packs_count
