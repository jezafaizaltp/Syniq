    - पेड़ काटने चाहिए
    - पेड़ बेकार हैं
    - केवल फल खाओ
    answer: पेड़ जीवित और उपकारी हैं, उनकी रक्षा करें
    difficulty: 2
    hints:
    - पेड़ क्या-क्या देता है?
    - रक्षा।
    solution: पेड़ जीवित हैं और सबको देते हैं; उनकी रक्षा करें।
    mistakes:
      पेड़ काटने चाहिए: hin6_whole
  - prompt: पेड़ का कौन-सा भाग ज़मीन के नीचे रहता है?
    options:
    - जड़
    - पत्ती
    - फूल
    answer: जड़
    difficulty: 1
    hints:
    - यह भाग पेड़ को मिट्टी में पकड़कर रखता है।
    - यह मिट्टी से पानी सोखता है।
    solution: 'चरण 1: पेड़ को टिकने और पानी के लिए मिट्टी चाहिए। चरण 2: यह काम जड़ करती है, जो नीचे रहती है।'
    mistakes:
      पत्ती: c6h13_ang
      फूल: c6h13_ang
  - prompt: तने का मुख्य काम क्या है?
    options:
    - पेड़ को सीधा रखना और पानी ऊपर पहुँचाना
    - भोजन बनाना
    - बीज बनाना
    answer: पेड़ को सीधा रखना और पानी ऊपर पहुँचाना
    difficulty: 2
    hints:
    - तना जड़ और पत्तियों के बीच है।
    - यह सहारा भी देता है और रास्ता भी।
    solution: 'चरण 1: तना बीच का भाग है। चरण 2: वह पेड़ को खड़ा रखता है और पानी ऊपर ले जाता है।'
    mistakes:
      भोजन बनाना: c6h13_ang
      बीज बनाना: c6h13_ang
  - prompt: बीज से पेड़ बनने में सबसे पहले क्या होता है?
    options:
    - अंकुर फूटता है
    - फल लगते हैं
    - फूल खिलते हैं
    answer: अंकुर फूटता है
    difficulty: 1
    hints:
    - बीज से सबसे पहले एक नन्हा हिस्सा निकलता है।
    - फल-फूल तो बाद में आते हैं।
    solution: 'चरण 1: बीज को पानी, हवा, धूप मिलती है। चरण 2: सबसे पहले उससे अंकुर फूटता है।'
    mistakes:
      फल लगते हैं: c6h13_kram
      फूल खिलते हैं: c6h13_kram
  - prompt: पेड़ हमें क्या नहीं देता?
    options:
    - प्लास्टिक
    - छाया
    - फल
    answer: प्लास्टिक
    difficulty: 1
    hints:
    - तीन में से दो चीज़ें पाठ में बताई गई हैं।
    - कौन-सी चीज़ कारखाने में बनती है?
    solution: 'चरण 1: पेड़ फल, छाया, हवा और लकड़ी देता है। चरण 2: प्लास्टिक पेड़ नहीं देता।'
    mistakes:
      छाया: c6h13_bhav
      फल: c6h13_bhav
  - prompt: '''संवेदना'' का अर्थ क्या है?'
    options:
    - महसूस करने की शक्ति
    - बोलने की शक्ति
    - उड़ने की शक्ति
    answer: महसूस करने की शक्ति
    difficulty: 2
    hints:
    - बसु ने दिखाया कि पौधे चोट पर प्रतिक्रिया करते हैं।
    - '''वेदना'' का अर्थ दर्द या अनुभव है।'
    solution: 'चरण 1: वेदना = अनुभव। चरण 2: संवेदना = कुछ महसूस कर पाने की शक्ति।'
    mistakes:
      बोलने की शक्ति: c6h13_lekhak
      उड़ने की शक्ति: c6h13_lekhak
  - prompt: पत्तियाँ भोजन बनाने के लिए क्या लेती हैं?
    options:
    - सूर्य का प्रकाश, हवा और पानी
    - केवल मिट्टी
    - केवल चाँदनी
    answer: सूर्य का प्रकाश, हवा और पानी
    difficulty: 2
    hints:
    - पत्तियाँ दिन में भोजन बनाती हैं।
    - पानी जड़ से आता है और हवा पत्तियों से अंदर जाती है।
    solution: 'चरण 1: जड़ से पानी आता है, हवा पत्तियों में जाती है। चरण 2: सूर्य के प्रकाश में पत्तियाँ भोजन बनाती हैं।'
    mistakes:
      केवल मिट्टी: c6h13_ang
      केवल चाँदनी: c6h13_ang
  - prompt: पेड़ को 'परोपकारी' क्यों कहा जा सकता है?
    options:
    - वह बदले में कुछ माँगे बिना सबको देता है
    - वह केवल अपने लिए जीता है
    - वह दूसरों से छीनता है
    answer: वह बदले में कुछ माँगे बिना सबको देता है
    difficulty: 3
    hints:
    - '''पर'' = दूसरे, ''उपकार'' = भलाई।'
    - पेड़ अपनी छाया का पैसा माँगता है क्या?
