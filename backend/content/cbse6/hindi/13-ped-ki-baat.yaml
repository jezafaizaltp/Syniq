          alt: 'पेड़ जीवित है: वह साँस लेता है, भोजन बनाता है और बढ़ता है; और वह हमें फल, छाया, शुद्ध हवा और लकड़ी देता है।'
      - style: real_world
        teach: गर्मी की दोपहर में राहगीर सड़क किनारे किसी बड़े पेड़ की छाँव में रुककर साँस लेते हैं। पेड़ उनसे कुछ नहीं माँगता। ऐसे पेड़ बचाना और नए पेड़ लगाना ही उसके उपकार का धन्यवाद है।
