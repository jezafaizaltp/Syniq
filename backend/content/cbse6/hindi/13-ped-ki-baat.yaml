subject: cbse6-hin
chapter: 13
title: पेड़ की बात (निबंध)
tips:
  h6_ankur_zaroorat: "बीज मिट्टी में अँधेरे में होता है, पर उसे और भी कई चीज़ें चाहिए।"
  h6_basu: "बसु ने यंत्र से दिखाया कि पौधे भी चोट और मौसम पर प्रतिक्रिया करते हैं।"
  h6_jadein: "जड़ें ज़मीन के नीचे होती हैं। वहाँ से वे पेड़ के लिए क्या लाती हैं?"
  h6_prakash: "पत्तियाँ भोजन दिन में बनाती हैं, रात में नहीं।"
  c6h13_kram: 'पेड़ के जीवन को क्रम से सोचो: बीज, अंकुर, जड़-तना, पत्तियाँ, फूल-फल, और नए बीज।'
  c6h13_ang: 'पेड़ के हर हिस्से का काम सोचो: कौन नीचे से लेता है, कौन ऊपर ले जाता है, कौन भोजन बनाता है।'
  c6h13_lekhak: 'लेखक के बारे में सोचो: वे कवि थे या वैज्ञानिक, और उन्होंने पौधों के बारे में क्या साबित किया?'
  c6h13_bhav: सोचो कि पेड़ जीवन भर दूसरों को क्या-क्या देता है, और बदले में हमें क्या करना चाहिए।

concepts:
- code: cbse6h.m13.ped
  title: पेड़ की बात (निबंध)
  notes: |
    लेखक: जगदीशचंद्र बसु (वैज्ञानिक, जिन्होंने दिखाया कि पौधों में भी जीवन और संवेदना है)। निबंध में पेड़ के जीवन की कहानी:
    बीज मिट्टी में पड़ा रहता है; धूप, पानी, हवा और गर्मी मिलने पर अंकुर फूटता है; जड़ें नीचे जाकर पानी और भोजन लेती हैं,
    तना ऊपर बढ़ता है; पत्तियाँ सूर्य के प्रकाश से भोजन बनाती हैं; पेड़ बढ़कर फूल, फल और बीज देता है, जिससे नए पेड़
    बनते हैं। पेड़ भी जीवित है, साँस लेता है, बढ़ता है। पेड़ जीवन भर दूसरों को फल, छाया, हवा और लकड़ी देता है।
    संदेश: पेड़ जीवित हैं; उनसे प्रेम करें और उनकी रक्षा करें; परोपकार का भाव।
  explanations:
    text: 'वैज्ञानिक जगदीशचंद्र बसु पेड़ के जीवन की कहानी बताते हैं: बीज से अंकुर, जड़ें पानी लेती हैं, पत्तियाँ धूप से भोजन बनाती हैं, फिर फूल, फल और नए बीज। पेड़ भी हमारी तरह जीवित है, और जीवन भर दूसरों को फल, छाया और हवा देता है।'
    visual: 'कल्पना कीजिए एक गोल चक्र: मिट्टी में बीज → अंकुर → नन्हा पौधा → बड़ा पेड़ → फूल और फल → बीज फिर मिट्टी में।'
    step_by_step: '1. लेखक पहचानें: जगदीशचंद्र बसु। 2. पेड़ के जीवन के चरण क्रम से लिखें। 3. जड़ और पत्ती का काम लिखें। 4. पेड़ दूसरों को क्या देता है। 5. संदेश: रक्षा और परोपकार।'
    real_world: वन महोत्सव (जुलाई) में स्कूल पेड़ लगाते हैं; एक पेड़ बरसों तक छाया, फल और साफ़ हवा देता है।
  picture:
    kind: flow
    steps:
    - बीज
    - अंकुर
    - पौधा
    - बड़ा पेड़
    - फूल और फल
    - नए बीज
    alt: 'पेड़ का जीवन-चक्र: बीज, अंकुर, पौधा, बड़ा पेड़, फूल और फल, और फिर नए बीज।'
  activity:
    type: order
    prompt: पेड़ का जीवन क्रम से लगाओ।
    steps:
    - बीज मिट्टी में पड़ा रहता है
    - धूप, पानी, हवा से अंकुर फूटता है
    - जड़ें नीचे, तना ऊपर बढ़ता है
    - पेड़ फूल और फल देता है
    - फलों के बीजों से नए पेड़
    reasons:
      धूप, पानी, हवा से अंकुर फूटता है: अंकुर बीज से ही फूटता है।
      जड़ें नीचे, तना ऊपर बढ़ता है: अंकुर फूटने के बाद ही पौधा बढ़ता है।
      पेड़ फूल और फल देता है: बढ़कर बड़ा होने पर ही फूल-फल आते हैं।
      फलों के बीजों से नए पेड़: बीज फल के अंदर बनते हैं।
  lesson:
    - teach: '''पेड़ की बात'' जगदीशचंद्र बसु का निबंध है। बसु वैज्ञानिक थे जिन्होंने अपने यंत्रों से दिखाया कि पौधों में भी जीवन और संवेदना है। इस निबंध में वे पेड़ के जीवन की कहानी बताते हैं।'
      check:
        prompt: जगदीशचंद्र बसु कौन थे?
        options:
        - वैज्ञानिक
        - राजा
        - खिलाड़ी
        answer: वैज्ञानिक
        why: उन्होंने पौधों पर प्रयोग करके उनका जीवन दिखाया।
    - teach: बीज मिट्टी में पड़ा रहता है। पानी, हवा, धूप और गर्मी मिलने पर अंकुर फूटता है। जड़ें नीचे जाकर पानी और भोजन-रस लेती हैं, तना ऊपर बढ़ता है, पत्तियाँ सूर्य के प्रकाश से भोजन बनाती हैं। फिर फूल, फल और बीज आते हैं, और नए पेड़ बनते हैं।
      picture:
        kind: flow
        steps:
        - बीज
        - अंकुर
        - जड़ और तना
        - पत्तियाँ भोजन बनाती हैं
        - फूल और फल
        - नए बीज
        alt: 'पेड़ का जीवन-चक्र: बीज से अंकुर, पौधा, फूल-फल और फिर नए बीज।'
      check:
        prompt: पेड़ के फल से क्या मिलता है जिससे नए पेड़ बनते हैं?
        options:
        - बीज
        - पत्थर
        - पानी
        answer: बीज
        why: फल के अंदर बीज होते हैं, जो फिर उगते हैं।
    - teach: 'पेड़ भी जीवित है: वह साँस लेता है, भोजन बनाता है और बढ़ता है। वह जीवन भर दूसरों को फल, छाया, शुद्ध हवा और लकड़ी देता है। संदेश: पेड़ों से प्रेम करो और उनकी रक्षा करो।'
      check:
        prompt: पेड़ को जीवित क्यों कहा गया है?
        options:
        - वह साँस लेता है और बढ़ता है
        - वह चलता-फिरता है
        - वह बोलता है
        answer: वह साँस लेता है और बढ़ता है
        why: साँस लेना और बढ़ना जीवित चीज़ों के लक्षण हैं।
  items:
  - prompt: '''पेड़ की बात'' के लेखक कौन हैं?'
    options:
    - जगदीशचंद्र बसु
    - सी. वी. रमन
    - प्रेमचंद
    - दिनकर
    answer: जगदीशचंद्र बसु
    difficulty: 1
    hints:
    - पौधों पर शोध करने वाले वैज्ञानिक।
    - बसु।
    solution: लेखक जगदीशचंद्र बसु हैं।
    mistakes:
      सी. वी. रमन: hin6_read_again
  - prompt: बीज से अंकुर फूटने के लिए क्या चाहिए?
    options:
    - पानी, हवा, धूप और गर्मी
    - केवल अँधेरा
    - नमक
    - प्लास्टिक
    answer: पानी, हवा, धूप और गर्मी
    difficulty: 1
    hints:
    - प्रकृति की चीज़ें।
    - अंकुरण।
    solution: बीज को पानी, हवा, धूप और गर्मी चाहिए।
    mistakes: {"केवल अँधेरा": "h6_ankur_zaroorat"}
  - prompt: पेड़ की जड़ें क्या काम करती हैं?
    options:
    - मिट्टी से पानी और भोजन-रस लेती हैं
    - फल बनाती हैं
    - उड़ती हैं
    - गाना गाती हैं
    answer: मिट्टी से पानी और भोजन-रस लेती हैं
    difficulty: 1
    hints:
    - नीचे ज़मीन में।
    - पानी।
    solution: जड़ें पानी और भोजन-रस लेती हैं।
    mistakes: {"फल बनाती हैं": "h6_jadein"}
  - prompt: पत्तियाँ भोजन किसकी मदद से बनाती हैं?
    options:
    - सूर्य के प्रकाश से
    - चाँदनी से
    - बिजली से
    - आग से
    answer: सूर्य के प्रकाश से
    difficulty: 2
    hints:
    - हरी पत्तियाँ।
    - धूप।
    solution: पत्तियाँ धूप से भोजन बनाती हैं।
    mistakes: {"चाँदनी से": "h6_prakash"}
  - prompt: जगदीशचंद्र बसु ने क्या दिखाया था?
    options:
    - पौधों में भी जीवन और संवेदना है
    - पेड़ निर्जीव हैं
    - पेड़ चल सकते हैं
    - पेड़ों को पानी नहीं चाहिए
    answer: पौधों में भी जीवन और संवेदना है
    difficulty: 2
    hints:
    - वैज्ञानिक खोज।
    - जीवित।
    solution: उन्होंने दिखाया कि पौधे जीवित हैं और प्रतिक्रिया करते हैं।
    mistakes: {"पेड़ निर्जीव हैं": "h6_basu"}
  - prompt: इस निबंध का मुख्य संदेश क्या है?
