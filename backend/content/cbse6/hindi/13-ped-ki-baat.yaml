subject: cbse6-hin
chapter: 13
title: पेड़ की बात (निबंध)
concepts:
- code: cbse6h.m13.ped
  title: पेड़ की बात (निबंध)
  notes: |
    लेखक: जगदीशचंद्र बसु (वैज्ञानिक, जिन्होंने दिखाया कि पौधों में भी जीवन और संवेदना है)। निबंध में पेड़ के जीवन की कहानी:
    बीज मिट्टी में पड़ा रहता है; धूप, पानी, हवा और गर्मी मिलने पर अंकुर फूटता है; जड़ें नीचे जाकर पानी और भोजन लेती हैं,
    तना ऊपर बढ़ता है; पत्तियाँ सूर्य के प्रकाश से भोजन बनाती हैं; पेड़ बढ़कर फूल, फल और बीज देता है, जिससे नए पेड़
    बनते हैं। पेड़ भी जीवित है, साँस लेता है, बढ़ता है। पेड़ जीवन भर दूसरों को फल, छाया, हवा और लकड़ी देता है।
    संदेश: पेड़ जीवित हैं; उनसे प्रेम करें और उनकी रक्षा करें; परोपकार का भाव।
  explanations:
    text: 'वैज्ञानिक जगदीशचंद्र बसु पेड़ के जीवन की कहानी बताते हैं: बीज से अंकुर, जड़ें पानी लेती हैं, पत्तियाँ धूप से भोजन बनाती हैं, फिर फूल, फल और नए बीज। पेड़ भी हमारी तरह जीवित है, और जीवन भर दूसरों को फल, छाया और हवा देता है।'
    visual: 'कल्पना कीजिए एक गोल चक्र: मिट्टी में बीज → अंकुर → नन्हा पौधा → बड़ा पेड़ → फूल और फल → बीज फिर मिट्टी में।'
    step_by_step: '1. लेखक पहचानें: जगदीशचंद्र बसु। 2. पेड़ के जीवन के चरण क्रम से लिखें। 3. जड़ और पत्ती का काम लिखें। 4. पेड़ दूसरों को क्या देता है। 5. संदेश: रक्षा और परोपकार।'
    real_world: वन महोत्सव (जुलाई) में स्कूल पेड़ लगाते हैं; एक पेड़ बरसों तक छाया, फल और साफ़ हवा देता है।
  picture:
    kind: flow
    steps:
    - बीज
    - अंकुर
    - पौधा
    - बड़ा पेड़
    - फूल और फल
    - नए बीज
    alt: 'पेड़ का जीवन-चक्र: बीज, अंकुर, पौधा, बड़ा पेड़, फूल और फल, और फिर नए बीज।'
  items:
  - prompt: '''पेड़ की बात'' के लेखक कौन हैं?'
    options:
    - जगदीशचंद्र बसु
    - सी. वी. रमन
    - प्रेमचंद
    - दिनकर
    answer: जगदीशचंद्र बसु
    difficulty: 1
    hints:
    - पौधों पर शोध करने वाले वैज्ञानिक।
    - बसु।
    solution: लेखक जगदीशचंद्र बसु हैं।
    mistakes:
      सी. वी. रमन: hin6_read_again
  - prompt: बीज से अंकुर फूटने के लिए क्या चाहिए?
    options:
    - पानी, हवा, धूप और गर्मी
    - केवल अँधेरा
    - नमक
    - प्लास्टिक
    answer: पानी, हवा, धूप और गर्मी
    difficulty: 1
    hints:
    - प्रकृति की चीज़ें।
    - अंकुरण।
    solution: बीज को पानी, हवा, धूप और गर्मी चाहिए।
  - prompt: पेड़ की जड़ें क्या काम करती हैं?
    options:
    - मिट्टी से पानी और भोजन-रस लेती हैं
    - फल बनाती हैं
    - उड़ती हैं
    - गाना गाती हैं
    answer: मिट्टी से पानी और भोजन-रस लेती हैं
    difficulty: 1
    hints:
    - नीचे ज़मीन में।
    - पानी।
    solution: जड़ें पानी और भोजन-रस लेती हैं।
  - prompt: पत्तियाँ भोजन किसकी मदद से बनाती हैं?
    options:
    - सूर्य के प्रकाश से
    - चाँदनी से
    - बिजली से
    - आग से
    answer: सूर्य के प्रकाश से
    difficulty: 2
    hints:
    - हरी पत्तियाँ।
    - धूप।
    solution: पत्तियाँ धूप से भोजन बनाती हैं।
  - prompt: जगदीशचंद्र बसु ने क्या दिखाया था?
    options:
    - पौधों में भी जीवन और संवेदना है
    - पेड़ निर्जीव हैं
    - पेड़ चल सकते हैं
    - पेड़ों को पानी नहीं चाहिए
    answer: पौधों में भी जीवन और संवेदना है
    difficulty: 2
    hints:
    - वैज्ञानिक खोज।
    - जीवित।
    solution: उन्होंने दिखाया कि पौधे जीवित हैं और प्रतिक्रिया करते हैं।
  - prompt: इस निबंध का मुख्य संदेश क्या है?
    options:
    - पेड़ जीवित और उपकारी हैं, उनकी रक्षा करें
    - पेड़ काटने चाहिए
    - पेड़ बेकार हैं
    - केवल फल खाओ
    answer: पेड़ जीवित और उपकारी हैं, उनकी रक्षा करें
    difficulty: 2
    hints:
    - पेड़ क्या-क्या देता है?
    - रक्षा।
    solution: पेड़ जीवित हैं और सबको देते हैं; उनकी रक्षा करें।
