    - शत्रु के रूप में
    - मशीन के रूप में
    answer: माँ के रूप में
    difficulty: 2
    hints:
    - गोद में बच्चे को कौन बिठाता है?
    - अंकुर धरती के बच्चे जैसे हैं।
    solution: 'चरण 1: गोद माँ की होती है। चरण 2: कवि धरती को माँ और अंकुरों को उसके बच्चे मानते हैं।'
    mistakes:
      शत्रु के रूप में: c6h3_upma
      मशीन के रूप में: c6h3_upma
  - prompt: '''नगाड़े की तरह गरजना'' में किसकी आवाज़ की बात है?'
    options:
    - बादलों की
    - पक्षियों की
    - नदी की
    answer: बादलों की
    difficulty: 2
    hints:
    - नगाड़ा ज़ोर से बजता है।
    - आकाश में कौन गरजता है?
    solution: 'चरण 1: गरजना ज़ोर की आवाज़ है। चरण 2: आकाश में बादल गरजते हैं।'
    mistakes:
      पक्षियों की: c6h3_upma
      नदी की: c6h3_upma
  - prompt: धरती को 'प्यासी' कहना कैसा प्रयोग है?
    options:
    - धरती को जीव की तरह दिखाना
    - धरती का सही नाप बताना
    - धरती का रंग बताना
    answer: धरती को जीव की तरह दिखाना
    difficulty: 3
    hints:
