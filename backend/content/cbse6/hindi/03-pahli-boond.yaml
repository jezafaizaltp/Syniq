    - युद्ध का डर
    - शहर की भीड़
    answer: प्रकृति के उपकार पर खुशी
    difficulty: 2
    hints:
    - कविता में वर्षा का स्वागत है।
    - धरती, पौधे, सब खुश हैं।
    solution: 'चरण 1: वर्षा जीवन लाती है। चरण 2: कविता प्रकृति के इस उपकार पर खुशी दिखाती है।'
    mistakes:
      युद्ध का डर: c6h3_bhav
      शहर की भीड़: c6h3_bhav
