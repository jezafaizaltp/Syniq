subject: cbse6-hin
chapter: 3
title: पहली बूँद (कविता)
tips:
  h6_amrit: "पहली बूँद धरती को नया जीवन देती है। जीवन देने वाला पेय कौन-सा है?"
  h6_ankur: "दरारें तो सूखे में पड़ती हैं। पानी मिलने पर बीज से क्या निकलता है?"
  h6_nagada: "गर्जना ज़ोरदार आवाज़ है। बाँसुरी तो धीमी बजती है।"
  h6_pyasi: "बारिश से पहले गर्मी में धरती का हाल सोचो।"
  c6h3_pahle: बारिश से पहले और बारिश के बाद की धरती की तुलना करो। गर्मी में क्या होता है?
  c6h3_upma: कवि किसी चीज़ को दूसरी चीज़ जैसा बताते हैं। दोनों में कौन-सा गुण एक जैसा है?
  c6h3_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ कविता से मेल खाए, वही चुनो।
  c6h3_bhav: सोचो कि वर्षा धरती, पौधों और लोगों को क्या देती है।

concepts:
- code: cbse6h.m3.boond
  title: पहली बूँद (कविता)
  notes: |
    कवि: गोपालकृष्ण कौल। गर्मी के बाद वर्षा की पहली बूँद धरती पर गिरती है। प्यासी, सूखी धरती को जैसे नया जीवन मिल जाता
    है: धरती की गोद में अंकुर फूटते हैं, हरियाली छा जाती है, आकाश में काले बादल नगाड़े की तरह गरजते हैं, बिजली चमकती है।
    पहली बूँद को कवि अमृत के समान बताते हैं, जो सूखे होंठों जैसी धरती को तृप्त करती है।
    संदेश: वर्षा जीवन देती है; प्रकृति का सौंदर्य और उपकार।
  explanations:
    text: 'गर्मी में धरती प्यासी और सूखी है। तभी वर्षा की पहली बूँद गिरती है, और जैसे धरती में नई जान आ जाती है: अंकुर फूटते हैं और हरियाली छा जाती है। कवि इस पहली बूँद को अमृत जैसा मानते हैं।'
    visual: 'कल्पना कीजिए: फटी हुई सूखी ज़मीन, ऊपर काले बादल, और एक चमकती बूँद गिरते ही ज़मीन से एक नन्हा हरा अंकुर झाँकता है।'
    step_by_step: '1. पहले की स्थिति देखें: सूखी, प्यासी धरती। 2. पहली बूँद का गिरना। 3. बदलाव खोजें: अंकुर, हरियाली। 4. आकाश के चित्र: बादल, बिजली। 5. कवि का भाव: खुशी और आभार।'
    real_world: केरल में जून में मानसून की पहली बारिश के साथ मिट्टी की सोंधी खुशबू आती है और खेतों में धान बोया जाता है।
  picture:
    kind: flow
    steps:
    - सूखी, प्यासी धरती
    - पहली बूँद गिरी
    - अंकुर फूटे
    - हरियाली छा गई
    alt: सूखी धरती पर पहली बूँद गिरी, अंकुर फूटे और हरियाली छा गई।
  activity:
    type: order
    prompt: पहली बूँद गिरने के बाद क्या-क्या होता है? क्रम से लगाओ।
    steps:
    - गर्मी से धरती प्यासी, सूखी
    - वर्षा की पहली बूँद गिरती है
    - धरती की गोद में अंकुर फूटते हैं
    - चारों ओर हरियाली छा जाती है
    reasons:
      वर्षा की पहली बूँद गिरती है: पहली बूँद गर्मी के बाद आती है।
      धरती की गोद में अंकुर फूटते हैं: पानी मिलने पर ही बीज फूटते हैं।
      चारों ओर हरियाली छा जाती है: अंकुर बढ़कर ही हरियाली बनते हैं।
  lesson:
    - teach: '''पहली बूँद'' गोपालकृष्ण कौल की कविता है। लंबी गर्मी के बाद धरती सूखी और प्यासी है। तभी वर्षा की पहली बूँद गिरती है, और जैसे धरती को नया जीवन मिल जाता है।'
      check:
        prompt: पहली बूँद गिरने से पहले धरती का हाल कैसा था?
        options:
        - सूखी और प्यासी
        - हरी-भरी
        - बर्फ़ से ढकी
        answer: सूखी और प्यासी
        why: गर्मी ने धरती का पानी सुखा दिया था।
      ways:
      - style: visual
        teach: पहली बूँद से पहले और बाद की धरती, साथ-साथ रखकर देखो।
        picture:
          kind: compare
          columns:
          - title: बूँद से पहले
            points:
            - लंबी गर्मी
            - सूखी धरती
            - प्यास
          - title: बूँद के बाद
            points:
            - ठंडक
            - नया जीवन
            - आशा
          alt: पहली बूँद से पहले लंबी गर्मी, सूखी धरती और प्यास है; बूँद के बाद ठंडक, नया जीवन और आशा है।
      - style: real_world
        teach: मई-जून की तपती दोपहर के बाद जब पहली बारिश होती है, तो मिट्टी से सोंधी खुशबू उठती है और बच्चे बाहर दौड़ पड़ते हैं। कवि उसी पल की खुशी को कविता में पकड़ते हैं।
    - teach: 'बूँद पड़ते ही बदलाव होता है: धरती की गोद में अंकुर फूटते हैं, हरियाली छा जाती है। आकाश में काले बादल नगाड़े की तरह गरजते हैं और बिजली चमकती है।'
      picture:
        kind: compare
        columns:
        - title: बूँद से पहले
          points:
          - सूखी धरती
          - प्यास
          - दरारें
        - title: बूँद के बाद
          points:
          - अंकुर फूटे
          - हरियाली
          - बादल गरजे
        alt: पहली बूँद से पहले धरती सूखी थी, बाद में अंकुर और हरियाली आई।
      check:
        prompt: बूँद पड़ने के बाद धरती पर क्या दिखता है?
        options:
        - हरियाली
        - धूल भरी आँधी
        - बर्फ़
        answer: हरियाली
        why: पानी पाकर बीज उगते हैं और धरती हरी हो जाती है।
      ways:
      - style: step_by_step
        teach: 'पहला: आकाश में काले बादल घिर आते हैं। दूसरा: बादल ज़ोर से गरजते हैं और बिजली चमकती है। तीसरा: बूँदें धरती पर गिरती हैं। चौथा: बीजों से नन्हे पौधे निकल आते हैं। पाँचवाँ: चारों ओर हरियाली फैल जाती है।'
      - style: real_world
        teach: किसी गमले में बीज बोकर कुछ दिन पानी दो, तो मिट्टी में से छोटी-सी हरी नोक झाँकने लगती है। बारिश के बाद पूरे खेत-मैदान में यही बात एक साथ होती है।
    - teach: 'कवि पहली बूँद को अमृत जैसा बताते हैं, क्योंकि वह जीवन देती है। किसी चीज़ को दूसरी चीज़ जैसा बताना तुलना (उपमा) है। कविता का संदेश: वर्षा धरती को नया जीवन देती है, प्रकृति उपकारी और सुंदर है।'
      check:
        prompt: कवि पहली बूँद को अमृत जैसा क्यों कहते हैं?
        options:
        - क्योंकि वह जीवन देती है
        - क्योंकि वह मीठी है
        - क्योंकि वह महँगी है
        answer: क्योंकि वह जीवन देती है
        why: अमृत की तरह बूँद सूखी धरती में जान डाल देती है।
      ways:
      - style: visual
        teach: 'उपमा कैसे बनती है: दो चीज़ें और उनका एक जैसा गुण।'
        picture:
          kind: flow
          steps:
          - 'पहली चीज़ चुनो: पहली बूँद'
          - 'दूसरी चीज़ चुनो: अमृत'
          - 'दोनों का एक जैसा गुण खोजो: जीवन देना'
          - 'जोड़ो: पहली बूँद अमृत जैसी है'
          alt: उपमा बनाने के लिए पहली चीज़ पहली बूँद, दूसरी चीज़ अमृत, और दोनों का एक जैसा गुण जीवन देना है; इन्हें जोड़कर कहते हैं कि पहली बूँद अमृत जैसी है।
      - style: step_by_step
        teach: 'पहला: एक वाक्य लो, जैसे ''बच्चे का चेहरा चाँद जैसा है।'' दूसरा: पहचानो कि किसकी तुलना हो रही है: चेहरा और चाँद। तीसरा: सोचो कि दोनों में क्या एक जैसा है: सुंदरता और चमक। चौथा: ''जैसा'', ''सा'', ''समान'' जैसे शब्द उपमा पहचानने में मदद करते हैं।'
  items:
  - prompt: '''पहली बूँद'' कविता के कवि कौन हैं?'
    options:
    - गोपालकृष्ण कौल
    - सूरदास
    - रहीम
    - दिनकर
    answer: गोपालकृष्ण कौल
    difficulty: 1
    hints:
    - नाम में 'गोपाल'।
    - प्रकृति कविता।
    solution: कविता गोपालकृष्ण कौल की है।
    mistakes:
      सूरदास: hin6_read_again
  - prompt: पहली बूँद से पहले धरती कैसी थी?
    options:
    - सूखी और प्यासी
    - हरी-भरी
    - बर्फ़ से ढकी
    - पानी में डूबी
    answer: सूखी और प्यासी
    difficulty: 1
    hints:
    - गर्मी के बाद।
    - प्यास।
    solution: धरती सूखी और प्यासी थी।
    mistakes: {"हरी-भरी": "h6_pyasi"}
  - prompt: पहली बूँद गिरने पर धरती में क्या फूटे?
    options:
    - अंकुर
    - पत्थर
    - दरारें
    - ज्वालामुखी
    answer: अंकुर
    difficulty: 1
    hints:
    - नए पौधे।
    - हरा।
    solution: धरती में अंकुर फूटे।
    mistakes: {"दरारें": "h6_ankur"}
  - prompt: कवि पहली बूँद की तुलना किससे करते हैं?
    options:
    - अमृत से
    - ज़हर से
    - आग से
    - पत्थर से
    answer: अमृत से
    difficulty: 2
    hints:
    - जीवन देने वाला।
    - मीठा।
    solution: पहली बूँद अमृत के समान है।
    mistakes: {"ज़हर से": "h6_amrit"}
  - prompt: कविता में बादलों की गर्जना की तुलना किससे है?
    options:
    - नगाड़े से
    - बाँसुरी से
    - घंटी से
    - सीटी से
    answer: नगाड़े से
    difficulty: 2
    hints:
    - ज़ोर की आवाज़।
    - ढोल जैसा।
    solution: बादल नगाड़े की तरह गरजते हैं।
    mistakes: {"बाँसुरी से": "h6_nagada"}
  - prompt: कविता का मुख्य संदेश क्या है?
    options:
    - वर्षा धरती को नया जीवन देती है
    - बारिश परेशानी है
    - गर्मी अच्छी है
    - बादल डरावने हैं
    answer: वर्षा धरती को नया जीवन देती है
    difficulty: 2
    hints:
    - पहले और बाद की तुलना।
    - जीवन।
    solution: वर्षा सूखी धरती में नया जीवन लाती है।
    mistakes:
      बारिश परेशानी है: hin6_poem_meaning
  - prompt: '''अंकुर'' किसे कहते हैं?'
    options:
    - बीज से निकला नन्हा पौधा
    - पेड़ की मोटी डाल
    - सूखा पत्ता
    answer: बीज से निकला नन्हा पौधा
    difficulty: 1
    hints:
    - यह बीज के फूटने पर निकलता है।
    - यह पौधे की सबसे पहली अवस्था है।
    solution: 'चरण 1: बीज को पानी मिलता है। चरण 2: उससे नन्हा पौधा निकलता है, जिसे अंकुर कहते हैं।'
    mistakes:
      पेड़ की मोटी डाल: c6h3_shabd
      सूखा पत्ता: c6h3_shabd
  - prompt: कविता में आकाश में क्या चमकता है?
    options:
    - बिजली
    - सूरज की तेज़ धूप
    - इंद्रधनुष
    answer: बिजली
    difficulty: 1
    hints:
    - यह गरजते बादलों के साथ दिखती है।
    - बारिश के तूफ़ान में यह क्षण भर के लिए चमकती है।
    solution: 'चरण 1: बादल गरज रहे हैं। चरण 2: उनके साथ बिजली चमकती है।'
    mistakes:
      सूरज की तेज़ धूप: c6h3_pahle
      इंद्रधनुष: c6h3_pahle
  - prompt: कविता किस ऋतु के आने का वर्णन करती है?
    options:
    - वर्षा ऋतु
    - शीत ऋतु
    - वसंत ऋतु
    answer: वर्षा ऋतु
    difficulty: 1
    hints:
    - कविता बूँदों और बादलों की है।
    - गर्मी के बाद कौन-सी ऋतु आती है?
    solution: 'चरण 1: बूँदें और बादल वर्षा के चिह्न हैं। चरण 2: यह वर्षा ऋतु का आना है।'
    mistakes:
      शीत ऋतु: c6h3_pahle
      वसंत ऋतु: c6h3_pahle
  - prompt: '''धरती की गोद'' कहकर कवि धरती को किस रूप में देखते हैं?'
    options:
    - माँ के रूप में
    - शत्रु के रूप में
    - मशीन के रूप में
    answer: माँ के रूप में
    difficulty: 2
    hints:
    - गोद में बच्चे को कौन बिठाता है?
    - अंकुर धरती के बच्चे जैसे हैं।
    solution: 'चरण 1: गोद माँ की होती है। चरण 2: कवि धरती को माँ और अंकुरों को उसके बच्चे मानते हैं।'
    mistakes:
      शत्रु के रूप में: c6h3_upma
      मशीन के रूप में: c6h3_upma
  - prompt: '''नगाड़े की तरह गरजना'' में किसकी आवाज़ की बात है?'
    options:
    - बादलों की
    - पक्षियों की
    - नदी की
    answer: बादलों की
    difficulty: 2
    hints:
    - नगाड़ा ज़ोर से बजता है।
    - आकाश में कौन गरजता है?
    solution: 'चरण 1: गरजना ज़ोर की आवाज़ है। चरण 2: आकाश में बादल गरजते हैं।'
    mistakes:
      पक्षियों की: c6h3_upma
      नदी की: c6h3_upma
  - prompt: धरती को 'प्यासी' कहना कैसा प्रयोग है?
    options:
