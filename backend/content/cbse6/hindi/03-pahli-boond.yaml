    - बीज बोने के लिए गीली मिट्टी चाहिए।
    solution: 'चरण 1: खेती के लिए पानी चाहिए। चरण 2: वर्षा आने से बुवाई हो सकती है।'
    mistakes:
      स्कूल बंद हो जाएँगे: c6h3_bhav
      गर्मी बढ़ जाएगी: c6h3_bhav
  - prompt: '''हरियाली छा जाना'' का अर्थ क्या है?'
    options:
    - चारों ओर हरा-भरा हो जाना
    - सब सूख जाना
    - अँधेरा हो जाना
    answer: चारों ओर हरा-भरा हो जाना
    difficulty: 2
    hints:
    - '''छा जाना'' मतलब हर तरफ़ फैल जाना।'
    - हरियाली पौधों से आती है।
    solution: 'चरण 1: हरियाली = हरापन। चरण 2: छा जाना = चारों ओर फैलना।'
    mistakes:
      सब सूख जाना: c6h3_shabd
      अँधेरा हो जाना: c6h3_shabd
  - prompt: इस कविता का मुख्य भाव कौन-सा है?
    options:
