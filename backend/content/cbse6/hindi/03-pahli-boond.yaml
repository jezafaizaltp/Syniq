    - बारिश के तूफ़ान में यह क्षण भर के लिए चमकती है।
    solution: 'चरण 1: बादल गरज रहे हैं। चरण 2: उनके साथ बिजली चमकती है।'
    mistakes:
      सूरज की तेज़ धूप: c6h3_pahle
      इंद्रधनुष: c6h3_pahle
  - prompt: कविता किस ऋतु के आने का वर्णन करती है?
    options:
    - वर्षा ऋतु
    - शीत ऋतु
    - वसंत ऋतु
    answer: वर्षा ऋतु
    difficulty: 1
    hints:
    - कविता बूँदों और बादलों की है।
    - गर्मी के बाद कौन-सी ऋतु आती है?
    solution: 'चरण 1: बूँदें और बादल वर्षा के चिह्न हैं। चरण 2: यह वर्षा ऋतु का आना है।'
    mistakes:
      शीत ऋतु: c6h3_pahle
      वसंत ऋतु: c6h3_pahle
  - prompt: '''धरती की गोद'' कहकर कवि धरती को किस रूप में देखते हैं?'
    options:
