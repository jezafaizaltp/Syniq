    - यह पौधे की सबसे पहली अवस्था है।
    solution: 'चरण 1: बीज को पानी मिलता है। चरण 2: उससे नन्हा पौधा निकलता है, जिसे अंकुर कहते हैं।'
    mistakes:
      पेड़ की मोटी डाल: c6h3_shabd
      सूखा पत्ता: c6h3_shabd
  - prompt: कविता में आकाश में क्या चमकता है?
