    - कवि धरती में जान महसूस करते हैं।
    solution: 'चरण 1: प्यास जीवों को लगती है। चरण 2: कवि धरती को जीव की तरह दिखाते हैं।'
    mistakes:
      धरती का सही नाप बताना: c6h3_upma
      धरती का रंग बताना: c6h3_upma
  - prompt: पहली बूँद से किसानों को सबसे ज़्यादा खुशी क्यों होती होगी?
    options:
    - खेतों में बुवाई हो सकेगी
    - स्कूल बंद हो जाएँगे
    - गर्मी बढ़ जाएगी
    answer: खेतों में बुवाई हो सकेगी
    difficulty: 3
