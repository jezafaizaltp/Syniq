subject: cbse6-hin
chapter: 5
title: रहीम के दोहे
concepts:
- code: cbse6h.m5.rahim
  title: रहीम के दोहे
  notes: |
    कवि: रहीम (अब्दुर्रहीम ख़ानख़ाना), अकबर के दरबार के नवरत्नों में से एक, कवि और दानी। दोहा: दो पंक्तियों का छंद।
    प्रसिद्ध दोहे: "रहिमन धागा प्रेम का, मत तोड़ो चटकाय। टूटे से फिर ना मिले, मिले गाँठ परि जाय।" (प्रेम का संबंध
    झटके से न तोड़ें; टूटकर जुड़े तो गाँठ रह जाती है।) "तरुवर फल नहिं खात है, सरवर पियहिं न पान। कहि रहीम पर काज हित,
    संपति सँचहिं सुजान।" (पेड़ अपना फल नहीं खाते, तालाब अपना पानी नहीं पीते; सज्जन दूसरों के लिए धन जोड़ते हैं।)
    (पाठ में कौन-से दोहे हैं, इसका मिलान छपी पुस्तक से बाकी।)
  explanations:
    text: 'रहीम अकबर के दरबार के कवि थे। उनके दोहे दो पंक्तियों में जीवन की बड़ी सीख देते हैं: प्रेम का धागा झटके से मत तोड़ो, क्योंकि जुड़ने पर भी गाँठ रह जाती है। पेड़ अपने फल नहीं खाते, वैसे ही अच्छे लोग दूसरों के लिए जीते हैं।'
    visual: 'कल्पना कीजिए: एक धागा जो टूटकर जुड़ा है और बीच में गाँठ दिख रही है; और फल से लदा पेड़ जिसके फल राहगीर खा रहे हैं।'
    step_by_step: '1. कवि और छंद पहचानें: रहीम, दोहा (दो पंक्तियाँ)। 2. हर दोहे का सीधा अर्थ लिखें। 3. उसके पीछे की सीख खोजें। 4. अपने जीवन से उदाहरण सोचें।'
    real_world: 'दोस्त से छोटी बात पर झगड़ा करके दोस्ती तोड़ना आसान है, पर फिर से पहले जैसा भरोसा बनाना मुश्किल होता है: यही ''गाँठ'' है।'
  picture:
    kind: compare
    columns:
    - title: धागे वाला दोहा
      points:
      - प्रेम का धागा
      - झटके से न तोड़ो
      - जुड़े तो गाँठ रहती है
    - title: पेड़ वाला दोहा
      points:
      - पेड़ फल नहीं खाते
      - तालाब पानी नहीं पीते
      - सज्जन दूसरों के लिए
    alt: धागे वाला दोहा कहता है प्रेम का रिश्ता न तोड़ो; पेड़ वाला दोहा कहता है सज्जन दूसरों के लिए जीते हैं।
  items:
  - prompt: रहीम किसके दरबार में थे?
    options:
    - अकबर
    - अशोक
    - शिवाजी
    - चंद्रगुप्त
    answer: अकबर
    difficulty: 1
    hints:
    - मुग़ल बादशाह।
    - नवरत्न।
    solution: रहीम अकबर के दरबार के नवरत्नों में थे।
    mistakes:
      अशोक: hin6_read_again
  - prompt: दोहे में कितनी पंक्तियाँ होती हैं?
    options:
    - दो
    - चार
    - छह
    - एक
    answer: दो
    difficulty: 1
    hints:
    - '''दो'' से ''दोहा''।'
    - छोटा छंद।
    solution: दोहे में दो पंक्तियाँ होती हैं।
  - prompt: '''रहिमन धागा प्रेम का'' दोहे में धागा किसका प्रतीक है?'
    options:
    - प्रेम के संबंध का
    - कपड़े का
    - पतंग का
    - रस्सी का
    answer: प्रेम के संबंध का
    difficulty: 1
    hints:
    - '''धागा प्रेम का''।'
    - रिश्ता।
    solution: धागा प्रेम के संबंध का प्रतीक है।
  - prompt: टूटे धागे को जोड़ने पर क्या रह जाता है?
    options:
    - गाँठ
    - रंग
    - कुछ नहीं
    - चमक
    answer: गाँठ
    difficulty: 1
    hints:
    - '''मिले गाँठ परि जाय''।'
    - गठान।
    solution: जोड़ने पर गाँठ रह जाती है।
  - prompt: '''तरुवर फल नहिं खात है'' का अर्थ है:'
    options:
    - पेड़ अपने फल खुद नहीं खाते
    - पेड़ों पर फल नहीं लगते
    - फल खाना मना है
    - पेड़ सूख गए
    answer: पेड़ अपने फल खुद नहीं खाते
    difficulty: 2
    hints:
    - तरुवर = पेड़।
    - दूसरों के लिए।
    solution: पेड़ अपने फल दूसरों के लिए देते हैं।
  - prompt: पेड़ और तालाब के उदाहरण से रहीम क्या सिखाते हैं?
    options:
    - सज्जन दूसरों की भलाई के लिए जीते हैं
    - पेड़ काटने चाहिए
    - पानी बचाना व्यर्थ है
    - धन केवल अपने लिए जोड़ो
    answer: सज्जन दूसरों की भलाई के लिए जीते हैं
    difficulty: 2
    hints:
    - '''पर काज हित''।'
    - परोपकार।
    solution: सज्जन दूसरों के काम के लिए धन जोड़ते हैं।
    mistakes:
      धन केवल अपने लिए जोड़ो: hin6_poem_meaning
