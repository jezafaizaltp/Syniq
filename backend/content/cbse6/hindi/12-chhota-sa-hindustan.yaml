    - 21वीं सदी में
    - पाषाण युग में
    answer: 19वीं सदी में
    difficulty: 2
    hints:
    - यह अंग्रेज़ी राज के समय की बात है।
    - लगभग 150-200 साल पहले।
    solution: 'चरण 1: अंग्रेज़ी राज में मज़दूर बाहर भेजे गए। चरण 2: यह 19वीं सदी की बात है।'
    mistakes:
      21वीं सदी में: c6h12_itihas
      पाषाण युग में: c6h12_itihas
  - prompt: लेखक को मॉरीशस में भारत की याद क्यों आती है?
    options:
    - वहाँ भारतीय भाषा, त्योहार और खान-पान जीवित हैं
    - वहाँ हिमालय दिखता है
    - वहाँ भारतीय रेल चलती है
    answer: वहाँ भारतीय भाषा, त्योहार और खान-पान जीवित हैं
    difficulty: 2
    hints:
    - लेखक वहाँ के लोगों के जीवन को देखते हैं।
    - उनकी बोली और त्योहार कैसे हैं?
    solution: 'चरण 1: लेखक वहाँ भारतीय संस्कृति देखते हैं। चरण 2: इसीलिए उन्हें भारत की याद आती है।'
    mistakes:
      वहाँ हिमालय दिखता है: c6h12_sanskriti
      वहाँ भारतीय रेल चलती है: c6h12_sanskriti
  - prompt: '''पूर्वज'' का अर्थ क्या है?'
    options:
    - हमसे पहले की पीढ़ियों के लोग
    - पूर्व दिशा के लोग
    - हमारे छोटे भाई-बहन
    answer: हमसे पहले की पीढ़ियों के लोग
    difficulty: 2
    hints:
    - दादा-परदादा के बारे में सोचो।
    - '''पूर्व'' का एक अर्थ पहले होता है।'
    solution: 'चरण 1: पूर्व = पहले, ज = जन्मे। चरण 2: पूर्वज = हमसे पहले जन्मी पीढ़ियाँ।'
    mistakes:
      पूर्व दिशा के लोग: c6h12_shabd
      हमारे छोटे भाई-बहन: c6h12_shabd
  - prompt: इस पाठ का मुख्य संदेश क्या है?
    options:
    - दूर रहकर भी लोग अपनी संस्कृति से जुड़े रहते हैं
    - विदेश जाना बुरा है
    - समुद्र-तट पर ही रहना चाहिए
    answer: दूर रहकर भी लोग अपनी संस्कृति से जुड़े रहते हैं
    difficulty: 3
    hints:
    - मॉरीशस के भारतीय भारत से बहुत दूर हैं।
    - फिर भी उन्होंने क्या नहीं छोड़ा?
    solution: 'चरण 1: लोग भारत से दूर गए। चरण 2: फिर भी उन्होंने भाषा और त्योहार नहीं छोड़े; संस्कृति साथ चली।'
    mistakes:
      विदेश जाना बुरा है: c6h12_sanskriti
      समुद्र-तट पर ही रहना चाहिए: c6h12_sanskriti
  - prompt: मॉरीशस के प्राकृतिक सौंदर्य में पाठ क्या बताता है?
    options:
    - समुद्र-तट, गन्ने के खेत और पहाड़
    - बर्फ़ के मैदान
    - रेत के टीले
    answer: समुद्र-तट, गन्ने के खेत और पहाड़
    difficulty: 1
    hints:
    - यह गर्म, हरा-भरा द्वीप है।
    - चारों ओर समुद्र और बीच में खेत।
    solution: 'चरण 1: द्वीप पर समुद्र-तट हैं। चरण 2: साथ में गन्ने के खेत और पहाड़ भी।'
    mistakes:
      बर्फ़ के मैदान: c6h12_desh
      रेत के टीले: c6h12_desh
  - prompt: मॉरीशस भारत से किस दिशा में है?
    options:
    - दक्षिण-पश्चिम
    - उत्तर
    - पूर्व
    answer: दक्षिण-पश्चिम
    difficulty: 3
    hints:
    - यह अफ़्रीका के पास है।
    - भारत से नीचे और बाईं ओर।
    solution: 'चरण 1: मॉरीशस अफ़्रीका के पूर्वी तट के पास है। चरण 2: भारत से यह दक्षिण-पश्चिम दिशा में है।'
    mistakes:
      उत्तर: c6h12_desh
      पूर्व: c6h12_desh
