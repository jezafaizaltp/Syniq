    - प्रेमचंद
    - सुदर्शन
    - सूरदास
    answer: रामधारी सिंह 'दिनकर'
    difficulty: 1
    hints:
    - राष्ट्रकवि।
    - '''दिनकर''।'
    solution: लेखक रामधारी सिंह दिनकर हैं।
    mistakes: {"प्रेमचंद": "h6_dinkar"}
  - prompt: मॉरीशस किस महासागर में है?
    options:
    - हिंद महासागर
    - प्रशांत महासागर
    - अटलांटिक महासागर
    - आर्कटिक महासागर
    answer: हिंद महासागर
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - भारत के नाम पर।
    solution: मॉरीशस हिंद महासागर में है।
    mistakes: {"प्रशांत महासागर": "h6_hind_mahasagar"}
  - prompt: भारतीय मूल के लोगों के पूर्वज मॉरीशस में क्या काम करने गए थे?
    options:
    - गन्ने के खेतों में मज़दूरी
    - कंप्यूटर चलाना
    - जहाज़ बनाना
