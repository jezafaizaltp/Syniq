    - उन्हें एक कागज़ी समझौते पर बाहर भेजा जाता था।
    solution: 'चरण 1: गिरमिट = एग्रीमेंट। चरण 2: समझौते पर विदेश भेजे गए मज़दूर गिरमिटिया कहलाए।'
    mistakes:
      राजा के सैनिक: c6h12_itihas
      स्कूल के शिक्षक: c6h12_itihas
  - prompt: भारतीय मूल के लोग पहली बार मॉरीशस लगभग कब पहुँचे?
    options:
