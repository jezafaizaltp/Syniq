    - वहाँ बहुत ठंड है
    - वहाँ हिमालय है
    answer: वहाँ भारतीय भाषा, त्योहार और संस्कृति जीवित हैं
    difficulty: 2
    hints:
    - क्या-क्या भारतीय दिखता है?
    - संस्कृति।
    solution: भारतीय संस्कृति वहाँ जीवित है, इसलिए यह नाम।
    mistakes:
      वह भारत का एक राज्य है: hin6_whole
  - prompt: यात्रा के अनुभवों का वर्णन करने वाली रचना को क्या कहते हैं?
    options:
    - यात्रा-वृत्तांत
    - आत्मकथा
    - कविता
    - नाटक
    answer: यात्रा-वृत्तांत
    difficulty: 1
    hints:
    - यात्रा + वृत्तांत (वर्णन)।
    - यात्रा।
    solution: यह यात्रा-वृत्तांत कहलाता है।
    mistakes: {"आत्मकथा": "h6_yatra_vritant"}
  - prompt: मॉरीशस किस प्रकार का देश है?
    options:
    - द्वीप-देश
    - रेगिस्तानी देश
    - पहाड़ों से घिरा देश जहाँ समुद्र नहीं
    answer: द्वीप-देश
    difficulty: 1
    hints:
    - यह महासागर के बीच में है।
    - चारों ओर पानी से घिरी ज़मीन को क्या कहते हैं?
    solution: 'चरण 1: मॉरीशस के चारों ओर समुद्र है। चरण 2: वह द्वीप-देश है।'
    mistakes:
      रेगिस्तानी देश: c6h12_desh
      पहाड़ों से घिरा देश जहाँ समुद्र नहीं: c6h12_desh
  - prompt: मॉरीशस में मुख्य रूप से कौन-सी फ़सल उगाई जाती रही है?
    options:
    - गन्ना
    - कॉफ़ी
    - गेहूँ
    answer: गन्ना
    difficulty: 1
    hints:
    - इससे चीनी बनती है।
    - भारतीय मज़दूर इन्हीं खेतों में काम करने गए।
    solution: 'चरण 1: मज़दूर खेतों में काम करने गए थे। चरण 2: वहाँ के खेत गन्ने के थे।'
    mistakes:
      कॉफ़ी: c6h12_desh
      गेहूँ: c6h12_desh
  - prompt: '''गिरमिटिया'' मज़दूर किन्हें कहा जाता था?'
    options:
    - समझौते (एग्रीमेंट) पर विदेश भेजे गए मज़दूर
    - राजा के सैनिक
    - स्कूल के शिक्षक
    answer: समझौते (एग्रीमेंट) पर विदेश भेजे गए मज़दूर
    difficulty: 3
    hints:
