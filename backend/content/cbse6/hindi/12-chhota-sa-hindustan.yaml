subject: cbse6-hin
chapter: 12
title: हिंद महासागर में छोटा-सा हिंदुस्तान (यात्रा-वृत्तांत)
tips:
  h6_dinkar: "यह यात्रा-वर्णन राष्ट्रकवि कहे जाने वाले कवि का है, जिन्होंने 'रश्मिरथी' लिखी।"
  h6_ganna: "वे बहुत पहले गरीबी में मज़दूर बनकर गए थे। मॉरीशस में चीनी किससे बनती है?"
  h6_hind_mahasagar: "मॉरीशस अफ़्रीका के पास, भारत के दक्षिण-पश्चिम में है। भारत के नाम वाला महासागर कौन-सा है?"
  h6_yatra_vritant: "आत्मकथा पूरे जीवन की कहानी है। किसी यात्रा का वर्णन क्या कहलाता है?"
  c6h12_desh: 'मॉरीशस के बारे में पाठ की बातें याद करो: वह कहाँ है, वहाँ कौन रहते हैं और क्या उगता है।'
  c6h12_itihas: सोचो कि भारतीय मूल के लोग बहुत पहले वहाँ क्यों और कैसे पहुँचे।
  c6h12_sanskriti: 'भारत से दूर रहकर भी लोग अपनी कौन-सी चीज़ें साथ रखते हैं: भाषा, त्योहार, खाना?'
  c6h12_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ पाठ से मेल खाए, वही चुनो।

concepts:
- code: cbse6h.m12.mauritius
  title: हिंद महासागर में छोटा-सा हिंदुस्तान (यात्रा-वृत्तांत)
  notes: |
    लेखक: रामधारी सिंह 'दिनकर'। यात्रा-वृत्तांत: हिंद महासागर में स्थित द्वीप-देश मॉरीशस की यात्रा। लेखक देखते हैं कि
    वहाँ बड़ी संख्या में भारतीय मूल के लोग रहते हैं, जिनके पूर्वज लगभग 19वीं सदी में (गिरमिटिया मज़दूर बनकर) गन्ने के
    खेतों में काम करने गए थे। वहाँ आज भी हिंदी, भोजपुरी बोली जाती है, भारतीय त्योहार, रामायण-पाठ, पहनावा और खान-पान
    जीवित हैं; इसलिए लेखक उसे 'छोटा-सा हिंदुस्तान' कहते हैं। प्राकृतिक सौंदर्य: समुद्र-तट, गन्ने के खेत, पहाड़।
    संदेश: संस्कृति लोगों के साथ यात्रा करती है; दूर रहकर भी अपनी जड़ों से जुड़ाव।
  explanations:
    text: दिनकर जी मॉरीशस की यात्रा का वर्णन करते हैं, जो हिंद महासागर में एक द्वीप है। वहाँ बहुत-से लोग भारतीय मूल के हैं, जिनके पूर्वज गन्ने के खेतों में काम करने गए थे। आज भी वहाँ हिंदी-भोजपुरी, भारतीय त्योहार और रामायण जीवित हैं, इसलिए लेखक उसे 'छोटा-सा हिंदुस्तान' कहते हैं।
    visual: 'कल्पना कीजिए: नीले समुद्र से घिरा हरा द्वीप, लहराते गन्ने के खेत, और एक गाँव में दीवाली के दीये जलाते लोग जो भोजपुरी में बात कर रहे हैं।'
    step_by_step: '1. लेखक और विधा पहचानें: दिनकर, यात्रा-वृत्तांत। 2. स्थान: मॉरीशस, हिंद महासागर। 3. वहाँ भारतीय कैसे पहुँचे। 4. कौन-सी भारतीय बातें वहाँ जीवित हैं। 5. शीर्षक का अर्थ।'
    real_world: मॉरीशस, फ़िजी, सूरीनाम जैसे कई देशों में भारतीय मूल के लोग आज भी हिंदी और भोजपुरी बोलते हैं।
  picture:
    kind: compare
    columns:
    - title: मॉरीशस में भारत की झलक
      points:
      - हिंदी, भोजपुरी
      - दीवाली, होली
      - रामायण-पाठ
    - title: मॉरीशस की प्रकृति
      points:
      - नीला समुद्र
      - गन्ने के खेत
      - पहाड़
    alt: मॉरीशस में हिंदी-भोजपुरी, भारतीय त्योहार और रामायण-पाठ हैं; वहाँ नीला समुद्र, गन्ने के खेत और पहाड़ हैं।
  activity:
    type: sort
    prompt: मॉरीशस को 'छोटा-सा हिंदुस्तान' क्यों कहा? और वहाँ की प्रकृति कैसी है?
    bins:
    - भारत से जुड़ी बातें
    - मॉरीशस की प्रकृति
    items:
    - label: हिंदी और भोजपुरी बोली जाती है
      bin: भारत से जुड़ी बातें
      clue: ये भाषाएँ कहाँ से आईं?
      why: पूर्वजों की भाषा आज भी जीवित।
    - label: रामायण-पाठ और भारतीय त्योहार
      bin: भारत से जुड़ी बातें
      clue: यह परंपरा कहाँ की है?
      why: भारतीय संस्कृति जीवित है।
    - label: गिरमिटिया पूर्वज
      bin: भारत से जुड़ी बातें
      clue: भारतीय वहाँ कैसे पहुँचे?
      why: 19वीं सदी में मज़दूर बनकर गए।
    - label: समुद्र-तट
      bin: मॉरीशस की प्रकृति
      clue: द्वीप के चारों ओर क्या है?
      why: प्राकृतिक सौंदर्य।
    - label: पहाड़ और गन्ने के खेत
      bin: मॉरीशस की प्रकृति
      clue: यह दृश्य है या परंपरा?
      why: मॉरीशस का प्राकृतिक दृश्य।
  lesson:
    - teach: '''हिंद महासागर में छोटा-सा हिंदुस्तान'' रामधारी सिंह ''दिनकर'' का यात्रा-वृत्तांत है। यात्रा-वृत्तांत में लेखक अपनी किसी यात्रा के अनुभव लिखता है। यह यात्रा मॉरीशस की है, जो हिंद महासागर में एक द्वीप-देश है।'
      check:
        prompt: यात्रा-वृत्तांत में क्या लिखा जाता है?
        options:
        - किसी यात्रा के अनुभव
        - किसी खेल के नियम
        - किसी पौधे का चित्र
        answer: किसी यात्रा के अनुभव
        why: वृत्तांत = वर्णन; यात्रा का वर्णन।
    - teach: मॉरीशस में बहुत-से भारतीय मूल के लोग रहते हैं। उनके पूर्वज लगभग 19वीं सदी में गिरमिटिया मज़दूर बनकर गन्ने के खेतों में काम करने गए थे। कठिन जीवन के बाद भी उन्होंने अपनी संस्कृति नहीं छोड़ी।
      picture:
        kind: flow
        steps:
        - '19वीं सदी: भारत से मज़दूर गए'
        - गन्ने के खेतों में कठिन काम
        - भाषा और त्योहार साथ रखे
        - 'आज: ''छोटा-सा हिंदुस्तान'''
        alt: भारतीय मज़दूरों के मॉरीशस जाने से आज तक की कहानी।
      check:
        prompt: भारतीय मूल के लोगों के पूर्वज मॉरीशस कैसे पहुँचे?
        options:
        - मज़दूर बनकर
        - राजा बनकर
        - पर्यटक बनकर
        answer: मज़दूर बनकर
        why: वे गिरमिटिया मज़दूर बनकर खेतों में काम करने गए थे।
    - teach: 'आज भी वहाँ हिंदी और भोजपुरी बोली जाती है, भारतीय त्योहार मनते हैं, रामायण-पाठ होता है, और पहनावा-खान-पान भारत जैसा है। इसलिए लेखक उसे ''छोटा-सा हिंदुस्तान'' कहते हैं। संदेश: संस्कृति लोगों के साथ यात्रा करती है।'
      check:
        prompt: मॉरीशस में कौन-सी भारतीय बोली भी बोली जाती है?
        options:
        - भोजपुरी
        - जापानी
        - फ्रेंच-जर्मन
        answer: भोजपुरी
        why: ज़्यादातर पूर्वज बिहार-उत्तर प्रदेश के भोजपुरी क्षेत्र से गए थे।
  items:
  - prompt: यह यात्रा-वृत्तांत किस देश के बारे में है?
    options:
    - मॉरीशस
    - श्रीलंका
    - नेपाल
    - जापान
    answer: मॉरीशस
    difficulty: 1
    hints:
    - हिंद महासागर का द्वीप।
    - '''छोटा-सा हिंदुस्तान''।'
    solution: यह मॉरीशस के बारे में है।
    mistakes:
      श्रीलंका: hin6_read_again
  - prompt: पाठ के लेखक कौन हैं?
    options:
