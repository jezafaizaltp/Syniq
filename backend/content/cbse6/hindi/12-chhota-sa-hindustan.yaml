    - गन्ना।
    solution: वे गन्ने के खेतों में काम करने गए थे।
    mistakes: {"राज करना": "h6_ganna"}
  - prompt: मॉरीशस को 'छोटा-सा हिंदुस्तान' क्यों कहा गया?
    options:
    - वहाँ भारतीय भाषा, त्योहार और संस्कृति जीवित हैं
