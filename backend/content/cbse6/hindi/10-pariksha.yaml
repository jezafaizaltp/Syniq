    - यह बहुत ऊँचा पद था।
    solution: 'चरण 1: दीवान राजा का सबसे बड़ा सहायक था। चरण 2: वह रियासत का मुख्य मंत्री था।'
    mistakes:
      सेना का सिपाही: c6h10_shabd
      खेत का मज़दूर: c6h10_shabd
  - prompt: उम्मीदवारों को कितने समय तक परखा गया?
