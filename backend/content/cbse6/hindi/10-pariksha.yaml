    - दर्द में भी मदद करना आसान नहीं।
    solution: 'चरण 1: खेल में उसका पैर चोटिल था। चरण 2: फिर भी उसने गाड़ी निकाली।'
    mistakes:
      उसे इनाम का लालच था: c6h10_gun
      उसे किसी ने मजबूर किया: c6h10_gun
  - prompt: बाकी उम्मीदवारों की अच्छाई कैसी थी?
