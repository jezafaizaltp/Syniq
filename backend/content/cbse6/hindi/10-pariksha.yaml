    - मदद।
    solution: दया, साहस और कर्तव्य-भावना ही असली योग्यता थी।
    mistakes: {"उसके पास सबसे बड़ी डिग्री थी": "h6_deewan"}
  - prompt: '''दीवान'' किसे कहते थे?'
    options:
    - रियासत का मुख्य मंत्री
    - सेना का सिपाही
    - खेत का मज़दूर
    answer: रियासत का मुख्य मंत्री
    difficulty: 2
