subject: cbse6-hin
chapter: 10
title: परीक्षा (कहानी)
tips:
  h6_deewan: "दीवान साहब डिग्री नहीं, मन के गुण परख रहे थे।"
  h6_devgarh: "यह प्रेमचंद की कहानी की काल्पनिक रियासत है, नाम में 'देव' है।"
  h6_jankinath: "बाकी उम्मीदवार देखकर निकल गए। सिर्फ़ एक युवक रुका।"
  h6_naala: "गाड़ी कीचड़ और पानी वाली जगह में फँसी थी।"
  c6h10_kram: 'कहानी को क्रम से दोहराओ: दीवान की छुट्टी, विज्ञापन, उम्मीदवारों का महीना, खेल, फँसी गाड़ी, और फ़ैसला।'
  c6h10_gun: दीवान साहब किस तरह का आदमी चाहते थे? डिग्री और दिखावे से अलग, मन के गुणों के बारे में सोचो।
  c6h10_paatra: सोचो कि कहानी में कौन परख रहा है, कौन परखा जा रहा है, और कौन भेस बदले हुए है।
  c6h10_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ कहानी से मेल खाए, वही चुनो।

concepts:
- code: cbse6h.m10.pariksha
  title: परीक्षा (कहानी)
  notes: |
    लेखक: प्रेमचंद। देवगढ़ रियासत के दीवान सरदार सुजान सिंह बूढ़े होकर सेवा से छुट्टी चाहते हैं। राजा कहते हैं कि वे
    स्वयं नया दीवान चुनें। विज्ञापन निकलता है; बहुत-से उम्मीदवार आते हैं और एक महीने तक सबका व्यवहार परखा जाता है;
    सब दिखावटी अच्छाई करते हैं। एक शाम हॉकी के खेल के बाद, लौटते समय एक गरीब किसान की अनाज से भरी गाड़ी नाले में फँसी
    होती है। सब निकल जाते हैं, पर एक युवक (पंडित जानकीनाथ), जिसके पैर में खेल में चोट लगी थी, गाड़ी को धक्का देकर
    निकालता है। वह 'किसान' असल में भेस बदले सुजान सिंह थे। वे जानकीनाथ को दीवान चुनते हैं, क्योंकि उसमें दया, साहस और
    आत्मबल है। संदेश: सच्ची योग्यता दया और कर्तव्य-भावना में है, डिग्रियों और दिखावे में नहीं।
  explanations:
    text: देवगढ़ के बूढ़े दीवान सुजान सिंह नया दीवान चुनते हैं। उम्मीदवार एक महीने तक अच्छे बनने का दिखावा करते हैं। एक दिन एक गरीब किसान की गाड़ी नाले में फँसती है; सब चले जाते हैं, पर घायल पैर वाला युवक जानकीनाथ उसे निकालता है। किसान असल में सुजान सिंह थे, और वे जानकीनाथ को दीवान चुनते हैं।
    visual: 'कल्पना कीजिए: शाम का समय, नाले में फँसी अनाज की गाड़ी, बेबस बूढ़ा किसान, और लँगड़ाता युवक कंधा लगाकर पहिया धकेल रहा है, जबकि दूसरे उम्मीदवार हँसते हुए आगे बढ़ जाते हैं।'
    step_by_step: '1. स्थिति समझें: नए दीवान का चुनाव। 2. उम्मीदवारों का दिखावा देखें। 3. असली परीक्षा: फँसी गाड़ी। 4. जानकीनाथ ने क्या किया। 5. रहस्य: किसान कौन था। 6. शीर्षक का अर्थ।'
    real_world: 'नौकरी के इंटरव्यू में भी अक्सर लोगों का व्यवहार परखा जाता है: दूसरों के प्रति आदर और मदद करने की भावना।'
  picture:
    kind: flow
    steps:
    - दीवान सुजान सिंह छुट्टी चाहते हैं
    - उम्मीदवार दिखावा करते हैं
    - किसान की गाड़ी नाले में फँसी
    - घायल जानकीनाथ ने गाड़ी निकाली
    - किसान = सुजान सिंह; जानकीनाथ दीवान बने
    alt: 'कहानी का क्रम: दीवान की छुट्टी, उम्मीदवारों का दिखावा, फँसी गाड़ी, जानकीनाथ की मदद और उसका दीवान चुना जाना।'
  activity:
    type: order
    prompt: कहानी की घटनाएँ क्रम से लगाओ।
    steps:
    - सुजान सिंह सेवा से छुट्टी चाहते हैं
    - नए दीवान का विज्ञापन, महीने भर परख
    - हॉकी के बाद किसान की गाड़ी नाले में फँसी
    - घायल पैर वाला जानकीनाथ गाड़ी निकालता है
    - किसान असल में सुजान सिंह, जानकीनाथ दीवान
    reasons:
      नए दीवान का विज्ञापन, महीने भर परख: सुजान सिंह के जाने से ही नए दीवान की ज़रूरत पड़ी।
      हॉकी के बाद किसान की गाड़ी नाले में फँसी: यह परख के दिनों की एक शाम है।
      घायल पैर वाला जानकीनाथ गाड़ी निकालता है: गाड़ी फँसी थी, तभी मदद की ज़रूरत थी।
      किसान असल में सुजान सिंह, जानकीनाथ दीवान: भेद मदद के बाद खुलता है।
  lesson:
    - teach: '''परीक्षा'' प्रेमचंद की कहानी है। देवगढ़ रियासत के दीवान सरदार सुजान सिंह बूढ़े हो गए और सेवा से छुट्टी चाहते थे। राजा ने कहा कि नया दीवान वे खुद चुनें। विज्ञापन निकला और बहुत-से उम्मीदवार आए।'
      check:
        prompt: नया दीवान चुनने का काम किसे मिला?
        options:
        - सुजान सिंह को
        - राजा के बेटे को
        - गाँव वालों को
        answer: सुजान सिंह को
        why: राजा ने यह ज़िम्मेदारी पुराने दीवान को दी।
    - teach: एक महीने तक सबका व्यवहार परखा गया। सब दिखावटी अच्छाई करते रहे। एक शाम हॉकी के खेल के बाद, एक गरीब किसान की अनाज भरी गाड़ी नाले में फँसी थी। सब निकल गए, पर पैर में चोट वाले युवक जानकीनाथ ने रुककर गाड़ी निकाली।
      picture:
        kind: flow
        steps:
        - दीवान छुट्टी चाहते हैं
        - उम्मीदवार एक महीना परखे जाते हैं
        - खेल के बाद गाड़ी नाले में फँसी
        - सब चले गए, जानकीनाथ रुका
        - जानकीनाथ दीवान चुना गया
        alt: 'कहानी का क्रम: परख, फँसी गाड़ी, और सही उम्मीदवार का चुनाव।'
      check:
        prompt: बाकी उम्मीदवारों ने गाड़ी देखकर क्या किया?
        options:
        - अनदेखा करके निकल गए
        - मिलकर धक्का लगाया
        - पुलिस बुलाई
        answer: अनदेखा करके निकल गए
        why: उनकी अच्छाई केवल दिखावा थी।
    - teach: 'वह ''किसान'' असल में भेस बदले सुजान सिंह थे। उन्होंने जानकीनाथ को दीवान चुना, क्योंकि उसमें दया, साहस और आत्मबल था। सीख: सच्ची योग्यता दया और कर्तव्य में है, डिग्री और दिखावे में नहीं।'
      check:
        prompt: यह कहानी किस चीज़ को सच्ची योग्यता मानती है?
        options:
        - दया और कर्तव्य-भावना
        - महँगे कपड़े
        - बड़ी डिग्रियाँ
        answer: दया और कर्तव्य-भावना
        why: जानकीनाथ इन्हीं गुणों से चुना गया।
  items:
  - prompt: '''परीक्षा'' कहानी के लेखक कौन हैं?'
    options:
    - प्रेमचंद
    - सुदर्शन
    - बिस्मिल
    - दिनकर
    answer: प्रेमचंद
    difficulty: 1
    hints:
    - कथा-सम्राट।
    - '''ईदगाह'' के लेखक।'
    solution: कहानी प्रेमचंद की है।
    mistakes:
      सुदर्शन: hin6_read_again
  - prompt: सुजान सिंह किस रियासत के दीवान थे?
    options:
