concepts:
- code: cbse6h.m10.pariksha
  title: परीक्षा (कहानी)
  notes: |
    लेखक: प्रेमचंद। देवगढ़ रियासत के दीवान सरदार सुजान सिंह बूढ़े होकर सेवा से छुट्टी चाहते हैं। राजा कहते हैं कि वे
    स्वयं नया दीवान चुनें। विज्ञापन निकलता है; बहुत-से उम्मीदवार आते हैं और एक महीने तक सबका व्यवहार परखा जाता है;
    सब दिखावटी अच्छाई करते हैं। एक शाम हॉकी के खेल के बाद, लौटते समय एक गरीब किसान की अनाज से भरी गाड़ी नाले में फँसी
    होती है। सब निकल जाते हैं, पर एक युवक (पंडित जानकीनाथ), जिसके पैर में खेल में चोट लगी थी, गाड़ी को धक्का देकर
    निकालता है। वह 'किसान' असल में भेस बदले सुजान सिंह थे। वे जानकीनाथ को दीवान चुनते हैं, क्योंकि उसमें दया, साहस और
    आत्मबल है। संदेश: सच्ची योग्यता दया और कर्तव्य-भावना में है, डिग्रियों और दिखावे में नहीं।
  explanations:
    text: देवगढ़ के बूढ़े दीवान सुजान सिंह नया दीवान चुनते हैं। उम्मीदवार एक महीने तक अच्छे बनने का दिखावा करते हैं। एक दिन एक गरीब किसान की गाड़ी नाले में फँसती है; सब चले जाते हैं, पर घायल पैर वाला युवक जानकीनाथ उसे निकालता है। किसान असल में सुजान सिंह थे, और वे जानकीनाथ को दीवान चुनते हैं।
    visual: 'कल्पना कीजिए: शाम का समय, नाले में फँसी अनाज की गाड़ी, बेबस बूढ़ा किसान, और लँगड़ाता युवक कंधा लगाकर पहिया धकेल रहा है, जबकि दूसरे उम्मीदवार हँसते हुए आगे बढ़ जाते हैं।'
    step_by_step: '1. स्थिति समझें: नए दीवान का चुनाव। 2. उम्मीदवारों का दिखावा देखें। 3. असली परीक्षा: फँसी गाड़ी। 4. जानकीनाथ ने क्या किया। 5. रहस्य: किसान कौन था। 6. शीर्षक का अर्थ।'
    real_world: 'नौकरी के इंटरव्यू में भी अक्सर लोगों का व्यवहार परखा जाता है: दूसरों के प्रति आदर और मदद करने की भावना।'
  picture:
    kind: flow
    steps:
    - दीवान सुजान सिंह छुट्टी चाहते हैं
    - उम्मीदवार दिखावा करते हैं
    - किसान की गाड़ी नाले में फँसी
    - घायल जानकीनाथ ने गाड़ी निकाली
    - किसान = सुजान सिंह; जानकीनाथ दीवान बने
    alt: 'कहानी का क्रम: दीवान की छुट्टी, उम्मीदवारों का दिखावा, फँसी गाड़ी, जानकीनाथ की मदद और उसका दीवान चुना जाना।'
  items:
  - prompt: '''परीक्षा'' कहानी के लेखक कौन हैं?'
    options:
    - प्रेमचंद
    - सुदर्शन
    - बिस्मिल
    - दिनकर
    answer: प्रेमचंद
    difficulty: 1
    hints:
    - कथा-सम्राट।
    - '''ईदगाह'' के लेखक।'
    solution: कहानी प्रेमचंद की है।
    mistakes:
      सुदर्शन: hin6_read_again
  - prompt: सुजान सिंह किस रियासत के दीवान थे?
    options:
    - देवगढ़
    - जयपुर
    - मैसूर
    - ग्वालियर
    answer: देवगढ़
    difficulty: 1
    hints:
    - कहानी की रियासत।
    - '''देव''।'
    solution: वे देवगढ़ के दीवान थे।
    mistakes: {"जयपुर": "h6_devgarh"}
  - prompt: किसान की गाड़ी कहाँ फँसी थी?
    options:
    - नाले में
    - पहाड़ पर
    - बाज़ार में
    - महल में
    answer: नाले में
    difficulty: 1
    hints:
    - कीचड़।
    - रास्ते में।
    solution: गाड़ी नाले में फँसी थी।
    mistakes: {"पहाड़ पर": "h6_naala"}
  - prompt: गाड़ी किसने निकाली?
    options:
    - जानकीनाथ ने
    - सभी उम्मीदवारों ने
    - राजा ने
    - किसी ने नहीं
    answer: जानकीनाथ ने
    difficulty: 1
    hints:
    - पैर में चोट वाला युवक।
    - पंडित।
    solution: जानकीनाथ ने गाड़ी निकाली।
    mistakes: {"सभी उम्मीदवारों ने": "h6_jankinath"}
  - prompt: वह किसान असल में कौन था?
    options:
    - भेस बदले सुजान सिंह
    - राजा
    - एक डाकू
    - एक उम्मीदवार
    answer: भेस बदले सुजान सिंह
    difficulty: 2
    hints:
    - कहानी का रहस्य।
    - परीक्षा लेने वाला।
    solution: किसान के भेस में सुजान सिंह थे।
    mistakes:
      राजा: hin6_whole
  - prompt: जानकीनाथ को दीवान क्यों चुना गया?
    options:
    - उसमें दया, साहस और आत्मबल था
    - उसके पास सबसे बड़ी डिग्री थी
    - वह सबसे अमीर था
    - वह हॉकी जीता था
    answer: उसमें दया, साहस और आत्मबल था
    difficulty: 2
    hints:
    - असली परीक्षा क्या थी?
    - मदद।
    solution: दया, साहस और कर्तव्य-भावना ही असली योग्यता थी।
    mistakes: {"उसके पास सबसे बड़ी डिग्री थी": "h6_deewan"}
