    difficulty: 2
    hints:
    - जब कोई देख नहीं रहा था, तब उन्होंने क्या किया?
    - वे केवल अच्छा दिखना चाहते थे।
    solution: 'चरण 1: परख के समय वे अच्छे बने। चरण 2: असली मौके पर निकल गए, इसलिए उनकी अच्छाई दिखावटी थी।'
    mistakes:
      सच्ची: c6h10_gun
      छिपी हुई: c6h10_gun
  - prompt: सुजान सिंह ने किसान का भेस क्यों बनाया?
    options:
