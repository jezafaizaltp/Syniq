    solution: 'चरण 1: वे सही दीवान चुनना चाहते थे। चरण 2: भेस से उन्होंने देखा कि कौन सच में दयालु है।'
    mistakes:
      अनाज बेचने के लिए: c6h10_paatra
      मज़ाक करने के लिए: c6h10_paatra
  - prompt: '''आत्मबल'' का अर्थ क्या है?'
    options:
