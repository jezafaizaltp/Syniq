    - शतरंज
    - कबड्डी
    answer: हॉकी
    difficulty: 2
    hints:
    - इस खेल में स्टिक और गेंद होती है।
    - इसी खेल में जानकीनाथ के पैर में चोट लगी।
    solution: 'चरण 1: खेल में स्टिक और गेंद थी। चरण 2: वह खेल हॉकी था।'
    mistakes:
