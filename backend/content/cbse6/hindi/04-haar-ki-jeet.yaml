subject: cbse6-hin
chapter: 4
title: हार की जीत (कहानी)
tips:
  h6_dhokha: "बाबा भारती घोड़ा बेचना नहीं चाहते थे। खड़गसिंह ने उनकी दया का फ़ायदा कैसे उठाया?"
  h6_haar_jeet: "बाबा ने घोड़ा खो दिया, पर अंत में खड़गसिंह घोड़ा लौटा गया। बाबा ने क्या जीता?"
  h6_mat_batana: "बाबा को डर था कि लोग गरीबों पर भरोसा करना छोड़ देंगे।"
  h6_sudarshan: "यह प्रसिद्ध कहानी प्रेमचंद के समय के एक दूसरे लेखक की है।"

concepts:
- code: cbse6h.m4.haarjeet
  title: हार की जीत (कहानी)
  notes: |
    लेखक: सुदर्शन। बाबा भारती के पास 'सुलतान' नाम का सुंदर घोड़ा था, जिससे वे बहुत प्रेम करते थे। डाकू खड़गसिंह उसे
    पाना चाहता था। एक दिन खड़गसिंह अपाहिज (असहाय) गरीब का भेस बनाकर रास्ते में बैठा और बाबा से मदद माँगी। बाबा ने
    उसे घोड़े पर बिठाया, तो वह घोड़ा लेकर भाग गया। बाबा ने उससे कहा: यह घटना किसी को मत बताना, नहीं तो लोग गरीबों
    और असहायों पर विश्वास करना छोड़ देंगे। यह बात खड़गसिंह के मन को छू गई और वह रात को चुपचाप घोड़ा अस्तबल में
    बाँध गया। सुबह बाबा घोड़े को पाकर बहुत खुश हुए। संदेश: अच्छाई और भलाई से बुरे व्यक्ति का भी हृदय बदल जाता है।
  explanations:
    text: 'बाबा भारती को अपना घोड़ा सुलतान बहुत प्रिय था। डाकू खड़गसिंह ने असहाय गरीब का भेस बनाकर मदद माँगी और घोड़ा लेकर भाग गया। बाबा ने कहा: यह बात किसी को मत बताना, नहीं तो लोग गरीबों पर विश्वास करना छोड़ देंगे। इस बात से डाकू का मन बदल गया और उसने घोड़ा लौटा दिया।'
    visual: 'कल्पना कीजिए: एक सुंदर घोड़ा, उस पर बैठा भेस बदला डाकू भागता हुआ, पीछे खड़े बाबा भारती। फिर रात में चुपके से घोड़ा अस्तबल में बाँधता खड़गसिंह।'
    step_by_step: '1. पात्र पहचानें: बाबा भारती, सुलतान, खड़गसिंह। 2. डाकू की चाल समझें। 3. बाबा की विनती पढ़ें। 4. डाकू का बदलाव देखें। 5. शीर्षक का अर्थ: बाबा की हार में जीत।'
    real_world: किसी ज़रूरतमंद की मदद करने से पहले लोग झिझकते हैं क्योंकि कोई धोखा दे सकता है; बाबा भारती चाहते थे कि यह भरोसा कभी न टूटे।
  picture:
    kind: flow
    steps:
    - बाबा को सुलतान प्रिय
    - खड़गसिंह असहाय बनकर मदद माँगता है
    - घोड़ा लेकर भाग जाता है
    - 'बाबा: किसी को मत बताना'
    - खड़गसिंह घोड़ा लौटा देता है
    alt: 'कहानी का क्रम: बाबा का प्रिय घोड़ा, डाकू की चाल, घोड़ा चोरी, बाबा की विनती और डाकू का घोड़ा लौटाना।'
  activity:
    type: order
    prompt: कहानी की घटनाएँ क्रम से लगाओ।
    steps:
    - खड़गसिंह सुलतान को पाना चाहता है
    - खड़गसिंह अपाहिज का भेस बनाकर मदद माँगता है
    - बाबा उसे घोड़े पर बिठाते हैं, वह भाग जाता है
    - बाबा कहते हैं, यह घटना किसी को मत बताना
    - रात को खड़गसिंह घोड़ा अस्तबल में बाँध जाता है
    reasons:
      खड़गसिंह अपाहिज का भेस बनाकर मदद माँगता है: भेस घोड़ा पाने की चाल था।
      बाबा उसे घोड़े पर बिठाते हैं, वह भाग जाता है: मदद माँगने पर ही बाबा ने उसे बिठाया।
      बाबा कहते हैं, यह घटना किसी को मत बताना: धोखा हो जाने के बाद बाबा ने यह कहा।
      रात को खड़गसिंह घोड़ा अस्तबल में बाँध जाता है: बाबा की बात ने उसका मन बदला।
  items:
  - prompt: बाबा भारती के घोड़े का नाम क्या था?
    options:
    - सुलतान
    - चेतक
    - बादल
    - राजा
    answer: सुलतान
    difficulty: 1
    hints:
    - बहुत सुंदर घोड़ा।
    - '''स'' से शुरू।'
    solution: घोड़े का नाम सुलतान था।
    mistakes:
      चेतक: hin6_read_again
  - prompt: '''हार की जीत'' कहानी के लेखक कौन हैं?'
    options:
    - सुदर्शन
    - प्रेमचंद
    - दिनकर
    - बिस्मिल
    answer: सुदर्शन
    difficulty: 1
    hints:
    - प्रेमचंद के समय के कहानीकार।
    - '''स'' से नाम।'
    solution: कहानी सुदर्शन की है।
    mistakes: {"प्रेमचंद": "h6_sudarshan"}
  - prompt: खड़गसिंह ने घोड़ा पाने के लिए क्या किया?
    options:
    - असहाय गरीब का भेस बनाकर धोखा दिया
    - घोड़ा खरीदा
    - बाबा से लड़ाई की
    - घोड़ा माँग लिया
    answer: असहाय गरीब का भेस बनाकर धोखा दिया
    difficulty: 1
    hints:
    - भेस बदला।
    - मदद माँगी।
    solution: उसने असहाय बनकर धोखे से घोड़ा लिया।
    mistakes: {"घोड़ा खरीदा": "h6_dhokha"}
  - prompt: बाबा भारती ने खड़गसिंह से क्या कहा?
    options:
    - यह घटना किसी को मत बताना
    - घोड़ा तुरंत लौटाओ
    - मैं पुलिस बुलाऊँगा
    - दूसरा घोड़ा भी ले जाओ
    answer: यह घटना किसी को मत बताना
    difficulty: 2
    hints:
    - लोगों का भरोसा।
    - गरीबों पर विश्वास।
    solution: बाबा ने कहा कि यह बात किसी को न बताए।
    mistakes: {"मैं पुलिस बुलाऊँगा": "h6_mat_batana"}
  - prompt: बाबा भारती ऐसा क्यों चाहते थे?
    options:
    - ताकि लोग गरीबों और असहायों पर विश्वास करना न छोड़ें
    - ताकि डाकू पकड़ा न जाए
    - क्योंकि उन्हें शर्म आई
    - क्योंकि घोड़ा बूढ़ा था
    answer: ताकि लोग गरीबों और असहायों पर विश्वास करना न छोड़ें
    difficulty: 2
    hints:
    - दूसरों की भलाई।
    - भरोसा।
    solution: उन्हें डर था कि लोग ज़रूरतमंदों की मदद करना बंद कर देंगे।
    mistakes:
      ताकि डाकू पकड़ा न जाए: hin6_whole
  - prompt: शीर्षक 'हार की जीत' का अर्थ क्या है?
    options:
    - बाबा घोड़ा हारकर भी डाकू का मन जीत गए
    - घुड़दौड़ में हार
    - डाकू जीत गया
    - बाबा खेल में हारे
    answer: बाबा घोड़ा हारकर भी डाकू का मन जीत गए
    difficulty: 2
    hints:
    - अंत में क्या हुआ?
    - मन बदला।
    solution: घोड़ा खोने की हार में डाकू का हृदय-परिवर्तन बाबा की जीत थी।
    mistakes: {"घुड़दौड़ में हार": "h6_haar_jeet"}
