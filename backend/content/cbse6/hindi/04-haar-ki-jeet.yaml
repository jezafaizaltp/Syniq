subject: cbse6-hin
chapter: 4
title: हार की जीत (कहानी)
tips:
  h6_dhokha: "बाबा भारती घोड़ा बेचना नहीं चाहते थे। खड़गसिंह ने उनकी दया का फ़ायदा कैसे उठाया?"
  h6_haar_jeet: "बाबा ने घोड़ा खो दिया, पर अंत में खड़गसिंह घोड़ा लौटा गया। बाबा ने क्या जीता?"
  h6_mat_batana: "बाबा को डर था कि लोग गरीबों पर भरोसा करना छोड़ देंगे।"
  h6_sudarshan: "यह प्रसिद्ध कहानी प्रेमचंद के समय के एक दूसरे लेखक की है।"
  c6h4_kram: 'कहानी को क्रम से दोहराओ: घोड़े से प्रेम, डाकू की चाह, भेस, धोखा, बाबा की बात, और अंत।'
  c6h4_paatra: सोचो कि कहानी में कौन संत है, कौन डाकू है, और किसका स्वभाव बदलता है।
  c6h4_bhav: किसी पात्र के मन में उस समय क्या चल रहा होगा? उसके काम से उसका भाव समझो।
  c6h4_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ कहानी से मेल खाए, वही चुनो।

concepts:
- code: cbse6h.m4.haarjeet
  title: हार की जीत (कहानी)
  notes: |
    लेखक: सुदर्शन। बाबा भारती के पास 'सुलतान' नाम का सुंदर घोड़ा था, जिससे वे बहुत प्रेम करते थे। डाकू खड़गसिंह उसे
    पाना चाहता था। एक दिन खड़गसिंह अपाहिज (असहाय) गरीब का भेस बनाकर रास्ते में बैठा और बाबा से मदद माँगी। बाबा ने
    उसे घोड़े पर बिठाया, तो वह घोड़ा लेकर भाग गया। बाबा ने उससे कहा: यह घटना किसी को मत बताना, नहीं तो लोग गरीबों
    और असहायों पर विश्वास करना छोड़ देंगे। यह बात खड़गसिंह के मन को छू गई और वह रात को चुपचाप घोड़ा अस्तबल में
    बाँध गया। सुबह बाबा घोड़े को पाकर बहुत खुश हुए। संदेश: अच्छाई और भलाई से बुरे व्यक्ति का भी हृदय बदल जाता है।
  explanations:
    text: 'बाबा भारती को अपना घोड़ा सुलतान बहुत प्रिय था। डाकू खड़गसिंह ने असहाय गरीब का भेस बनाकर मदद माँगी और घोड़ा लेकर भाग गया। बाबा ने कहा: यह बात किसी को मत बताना, नहीं तो लोग गरीबों पर विश्वास करना छोड़ देंगे। इस बात से डाकू का मन बदल गया और उसने घोड़ा लौटा दिया।'
    visual: 'कल्पना कीजिए: एक सुंदर घोड़ा, उस पर बैठा भेस बदला डाकू भागता हुआ, पीछे खड़े बाबा भारती। फिर रात में चुपके से घोड़ा अस्तबल में बाँधता खड़गसिंह।'
    step_by_step: '1. पात्र पहचानें: बाबा भारती, सुलतान, खड़गसिंह। 2. डाकू की चाल समझें। 3. बाबा की विनती पढ़ें। 4. डाकू का बदलाव देखें। 5. शीर्षक का अर्थ: बाबा की हार में जीत।'
    real_world: किसी ज़रूरतमंद की मदद करने से पहले लोग झिझकते हैं क्योंकि कोई धोखा दे सकता है; बाबा भारती चाहते थे कि यह भरोसा कभी न टूटे।
  picture:
    kind: flow
    steps:
    - बाबा को सुलतान प्रिय
    - खड़गसिंह असहाय बनकर मदद माँगता है
    - घोड़ा लेकर भाग जाता है
    - 'बाबा: किसी को मत बताना'
    - खड़गसिंह घोड़ा लौटा देता है
    alt: 'कहानी का क्रम: बाबा का प्रिय घोड़ा, डाकू की चाल, घोड़ा चोरी, बाबा की विनती और डाकू का घोड़ा लौटाना।'
  activity:
    type: order
    prompt: कहानी की घटनाएँ क्रम से लगाओ।
    steps:
    - खड़गसिंह सुलतान को पाना चाहता है
    - खड़गसिंह अपाहिज का भेस बनाकर मदद माँगता है
    - बाबा उसे घोड़े पर बिठाते हैं, वह भाग जाता है
    - बाबा कहते हैं, यह घटना किसी को मत बताना
    - रात को खड़गसिंह घोड़ा अस्तबल में बाँध जाता है
    reasons:
      खड़गसिंह अपाहिज का भेस बनाकर मदद माँगता है: भेस घोड़ा पाने की चाल था।
      बाबा उसे घोड़े पर बिठाते हैं, वह भाग जाता है: मदद माँगने पर ही बाबा ने उसे बिठाया।
      बाबा कहते हैं, यह घटना किसी को मत बताना: धोखा हो जाने के बाद बाबा ने यह कहा।
      रात को खड़गसिंह घोड़ा अस्तबल में बाँध जाता है: बाबा की बात ने उसका मन बदला।
  lesson:
    - teach: '''हार की जीत'' सुदर्शन की कहानी है। बाबा भारती के पास ''सुलतान'' नाम का सुंदर घोड़ा था। वे उसे बच्चे की तरह प्यार करते थे और रोज़ उसे देखकर खुश होते थे।'
      check:
        prompt: बाबा भारती अपने घोड़े से कैसा प्रेम करते थे?
        options:
        - बच्चे जैसा गहरा प्रेम
        - बिल्कुल प्रेम नहीं
        - केवल बेचने के लिए रखते थे
        answer: बच्चे जैसा गहरा प्रेम
        why: घोड़ा उनके जीवन की सबसे प्यारी चीज़ था।
    - teach: डाकू खड़गसिंह घोड़ा चाहता था। वह असहाय गरीब का भेस बनाकर रास्ते में बैठ गया। दयालु बाबा ने उसे घोड़े पर बिठा लिया, और वह घोड़ा लेकर भाग गया।
      picture:
        kind: flow
        steps:
        - खड़गसिंह घोड़ा देखता है
        - गरीब का भेस बनाता है
        - बाबा उसे घोड़े पर बिठाते हैं
        - डाकू घोड़ा लेकर भागता है
        - रात को घोड़ा लौटा जाता है
        alt: 'कहानी का क्रम: भेस, धोखा और फिर घोड़े की वापसी।'
      check:
        prompt: खड़गसिंह ने किसका फ़ायदा उठाया?
        options:
        - बाबा की दया का
        - बाबा की बीमारी का
        - बाबा के डर का
        answer: बाबा की दया का
        why: बाबा ने गरीब समझकर मदद की थी।
    - teach: 'बाबा ने डाकू से कहा: यह घटना किसी को मत बताना, नहीं तो लोग गरीबों पर विश्वास करना छोड़ देंगे। यह बात डाकू के मन को छू गई और वह रात को घोड़ा लौटा गया। बाबा घोड़ा हारकर भी डाकू का मन जीत गए।'
      check:
        prompt: डाकू ने घोड़ा क्यों लौटाया?
        options:
        - बाबा की बात ने उसका मन बदल दिया
        - पुलिस ने पकड़ लिया
        - घोड़ा बीमार हो गया
        answer: बाबा की बात ने उसका मन बदल दिया
        why: भलाई ने बुरे व्यक्ति का हृदय बदल दिया।
  items:
  - prompt: बाबा भारती के घोड़े का नाम क्या था?
    options:
    - सुलतान
    - चेतक
    - बादल
    - राजा
    answer: सुलतान
    difficulty: 1
    hints:
    - बहुत सुंदर घोड़ा।
    - '''स'' से शुरू।'
    solution: घोड़े का नाम सुलतान था।
    mistakes:
      चेतक: hin6_read_again
  - prompt: '''हार की जीत'' कहानी के लेखक कौन हैं?'
    options:
    - सुदर्शन
    - प्रेमचंद
    - दिनकर
    - बिस्मिल
    answer: सुदर्शन
    difficulty: 1
    hints:
    - प्रेमचंद के समय के कहानीकार।
    - '''स'' से नाम।'
    solution: कहानी सुदर्शन की है।
    mistakes: {"प्रेमचंद": "h6_sudarshan"}
  - prompt: खड़गसिंह ने घोड़ा पाने के लिए क्या किया?
    options:
    - असहाय गरीब का भेस बनाकर धोखा दिया
    - घोड़ा खरीदा
    - बाबा से लड़ाई की
    - घोड़ा माँग लिया
    answer: असहाय गरीब का भेस बनाकर धोखा दिया
    difficulty: 1
    hints:
    - भेस बदला।
    - मदद माँगी।
    solution: उसने असहाय बनकर धोखे से घोड़ा लिया।
    mistakes: {"घोड़ा खरीदा": "h6_dhokha"}
  - prompt: बाबा भारती ने खड़गसिंह से क्या कहा?
    options:
    - यह घटना किसी को मत बताना
    - घोड़ा तुरंत लौटाओ
    - मैं पुलिस बुलाऊँगा
    - दूसरा घोड़ा भी ले जाओ
    answer: यह घटना किसी को मत बताना
    difficulty: 2
    hints:
    - लोगों का भरोसा।
    - गरीबों पर विश्वास।
    solution: बाबा ने कहा कि यह बात किसी को न बताए।
    mistakes: {"मैं पुलिस बुलाऊँगा": "h6_mat_batana"}
  - prompt: बाबा भारती ऐसा क्यों चाहते थे?
    options:
    - ताकि लोग गरीबों और असहायों पर विश्वास करना न छोड़ें
    - ताकि डाकू पकड़ा न जाए
    - क्योंकि उन्हें शर्म आई
    - क्योंकि घोड़ा बूढ़ा था
    answer: ताकि लोग गरीबों और असहायों पर विश्वास करना न छोड़ें
    difficulty: 2
    hints:
    - दूसरों की भलाई।
    - भरोसा।
    solution: उन्हें डर था कि लोग ज़रूरतमंदों की मदद करना बंद कर देंगे।
    mistakes:
      ताकि डाकू पकड़ा न जाए: hin6_whole
  - prompt: शीर्षक 'हार की जीत' का अर्थ क्या है?
    options:
    - बाबा घोड़ा हारकर भी डाकू का मन जीत गए
    - घुड़दौड़ में हार
    - डाकू जीत गया
    - बाबा खेल में हारे
    answer: बाबा घोड़ा हारकर भी डाकू का मन जीत गए
    difficulty: 2
    hints:
    - अंत में क्या हुआ?
    - मन बदला।
    solution: घोड़ा खोने की हार में डाकू का हृदय-परिवर्तन बाबा की जीत थी।
    mistakes: {"घुड़दौड़ में हार": "h6_haar_jeet"}
  - prompt: खड़गसिंह कौन था?
    options:
    - एक प्रसिद्ध डाकू
    - बाबा का बेटा
    - गाँव का मुखिया
    answer: एक प्रसिद्ध डाकू
    difficulty: 1
    hints:
    - लोग उसके नाम से डरते थे।
    - उसने धोखे से घोड़ा छीना।
    solution: 'चरण 1: वह लोगों को लूटता था। चरण 2: खड़गसिंह एक डाकू था।'
    mistakes:
      बाबा का बेटा: c6h4_paatra
      गाँव का मुखिया: c6h4_paatra
  - prompt: खड़गसिंह ने किसका भेस बनाया?
    options:
    - असहाय गरीब का
    - राजा का
    - साधु का
    answer: असहाय गरीब का
    difficulty: 1
    hints:
    - वह बाबा की दया जगाना चाहता था।
    - दया किस पर आती है?
    solution: 'चरण 1: बाबा दयालु थे। चरण 2: इसलिए डाकू ने असहाय गरीब का भेस बनाया।'
    mistakes:
      राजा का: c6h4_kram
      साधु का: c6h4_kram
  - prompt: घोड़ा छिन जाने के बाद बाबा को सबसे बड़ी चिंता क्या थी?
    options:
    - लोग गरीबों पर विश्वास करना छोड़ देंगे
    - उन्हें पैदल चलना पड़ेगा
    - उनका पैसा चला जाएगा
    answer: लोग गरीबों पर विश्वास करना छोड़ देंगे
    difficulty: 2
    hints:
    - बाबा को अपने नुकसान से ज़्यादा किसकी फ़िक्र थी?
    - उन्होंने डाकू से घटना छिपाने को कहा।
    solution: 'चरण 1: बाबा ने घटना किसी को न बताने को कहा। चरण 2: उन्हें डर था कि लोग असहायों की मदद करना छोड़ देंगे।'
    mistakes:
      उन्हें पैदल चलना पड़ेगा: c6h4_bhav
      उनका पैसा चला जाएगा: c6h4_bhav
  - prompt: डाकू ने घोड़ा कब और कहाँ लौटाया?
    options:
    - रात को चुपचाप अस्तबल में
    - दिन में भरे बाज़ार में
    - मंदिर के मेले में
    answer: रात को चुपचाप अस्तबल में
    difficulty: 2
    hints:
    - वह किसी को दिखना नहीं चाहता था।
    - घोड़े की जगह कहाँ होती है?
    solution: 'चरण 1: घोड़ा अस्तबल में रहता है। चरण 2: डाकू रात को चुपचाप उसे वहीं बाँध गया।'
    mistakes:
      दिन में भरे बाज़ार में: c6h4_kram
      मंदिर के मेले में: c6h4_kram
  - prompt: सुबह घोड़े को अस्तबल में पाकर बाबा कैसा महसूस करते हैं?
    options:
    - बहुत खुश
    - गुस्से में
    - डरे हुए
    answer: बहुत खुश
    difficulty: 1
    hints:
    - उनकी सबसे प्यारी चीज़ लौट आई।
    - प्यारी चीज़ वापस मिलने पर मन कैसा होता है?
    solution: 'चरण 1: घोड़ा बाबा को बहुत प्यारा था। चरण 2: उसे पाकर वे बहुत खुश हुए।'
    mistakes:
      गुस्से में: c6h4_bhav
      डरे हुए: c6h4_bhav
  - prompt: कहानी में किसका स्वभाव बदलता है?
    options:
    - खड़गसिंह का
    - बाबा भारती का
    - घोड़े का
    answer: खड़गसिंह का
    difficulty: 2
    hints:
