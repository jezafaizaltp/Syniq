concepts:
- code: cbse6h.m7.jalate
  title: जलाते चलो (कविता)
  notes: |
    कवि: द्वारिका प्रसाद माहेश्वरी। कविता प्रेरणा देती है कि अँधेरे से हार न मानें, बल्कि दीप जलाते चलें। दीया यहाँ
    ज्ञान, प्रेम, आशा और भलाई का प्रतीक है; अँधेरा अज्ञान, दुख और बुराई का। एक दीया छोटा है, पर जब सब मिलकर दीप
    जलाते हैं तो धरती का अँधेरा मिट जाता है। कवि कहते हैं कि रुकना नहीं है, आगे बढ़ते हुए दीप जलाते जाना है।
    संदेश: मिलकर अच्छाई और ज्ञान फैलाओ; छोटा प्रयास भी अँधेरा दूर करता है।
  explanations:
    text: 'कवि कहते हैं: अँधेरे से डरो मत, दीप जलाते चलो। यहाँ दीया ज्ञान, प्रेम और आशा का प्रतीक है और अँधेरा अज्ञान और दुख का। एक छोटा दीया भी रोशनी देता है, और जब सब मिलकर दीप जलाते हैं, तो पूरा अँधेरा मिट जाता है।'
    visual: 'कल्पना कीजिए: अँधेरी रात, एक बच्चा दीया जलाता है, फिर उसी से दूसरा, फिर तीसरा... कुछ ही देर में पूरी गली दीयों से जगमगा उठती है।'
    step_by_step: '1. कवि और मुख्य बात पहचानें: दीप जलाना। 2. प्रतीक समझें: दीया = ज्ञान, प्रेम; अँधेरा = अज्ञान, दुख। 3. ''मिलकर'' की बात देखें। 4. संदेश लिखें।'
    real_world: 'किसी एक बच्चे को पढ़ना सिखाना भी एक दीया जलाने जैसा है: वह आगे दूसरों को सिखाता है।'
  picture:
    kind: compare
    columns:
    - title: दीया (प्रकाश)
      points:
      - ज्ञान
      - प्रेम
      - आशा
    - title: अँधेरा
      points:
      - अज्ञान
      - नफ़रत
      - निराशा
    alt: दीया ज्ञान, प्रेम और आशा का प्रतीक है; अँधेरा अज्ञान, नफ़रत और निराशा का।
  items:
  - prompt: '''जलाते चलो'' कविता के कवि कौन हैं?'
    options:
    - द्वारिका प्रसाद माहेश्वरी
    - सूरदास
    - रहीम
    - सोहनलाल द्विवेदी
    answer: द्वारिका प्रसाद माहेश्वरी
    difficulty: 1
    hints:
    - बाल-कविताओं के कवि।
    - '''द्वारिका''।'
    solution: कविता द्वारिका प्रसाद माहेश्वरी की है।
    mistakes:
      रहीम: hin6_read_again
  - prompt: कविता में क्या जलाते चलने को कहा गया है?
    options:
    - दीप (दीये)
    - कूड़ा
    - पत्ते
    - लकड़ी
    answer: दीप (दीये)
    difficulty: 1
    hints:
    - रोशनी के लिए।
    - दीपावली।
    solution: दीप जलाते चलने को कहा गया है।
