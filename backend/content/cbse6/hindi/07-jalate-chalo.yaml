  - prompt: कविता में दीया किसका प्रतीक है?
    options:
    - ज्ञान, प्रेम और आशा का
    - आग से खतरे का
    - गर्मी का
    - धन का
    answer: ज्ञान, प्रेम और आशा का
    difficulty: 2
    hints:
    - अँधेरा मिटाता है।
    - अच्छाई।
    solution: दीया ज्ञान, प्रेम और आशा का प्रतीक है।
    mistakes:
