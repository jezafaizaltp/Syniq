subject: cbse6-hin
chapter: 7
title: जलाते चलो (कविता)
tips:
  h6_andhera: "कविता में अँधेरा बुरी चीज़ है जिसे मिटाना है।"
  h6_chhote_prayas: "एक-एक दीया छोटा है, पर बहुत सारे मिलकर क्या करते हैं?"
  h6_deep: "कविता अँधेरा मिटाने की है। रोशनी किससे होती है?"
  h6_milkar: "सूरज डूबने से तो अँधेरा बढ़ता है। कविता सबके साथ मिलकर कुछ करने की बात करती है।"
  c6h7_pratik: कविता में रोशनी और अँधेरा केवल रोशनी-अँधेरा नहीं हैं। सोचो कि जीवन में अच्छी और बुरी चीज़ें कौन-सी हैं।
  c6h7_prerna: कवि हमसे कुछ करते रहने को कह रहे हैं। सोचो कि वे रुकने को कहते हैं या आगे बढ़ने को।
  c6h7_saath: एक व्यक्ति और बहुत सारे लोगों के काम की तुलना करो। मिलकर करने से क्या बदलता है?
  c6h7_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ कविता से मेल खाए, वही चुनो।

concepts:
- code: cbse6h.m7.jalate
  title: जलाते चलो (कविता)
  notes: |
    कवि: द्वारिका प्रसाद माहेश्वरी। कविता प्रेरणा देती है कि अँधेरे से हार न मानें, बल्कि दीप जलाते चलें। दीया यहाँ
    ज्ञान, प्रेम, आशा और भलाई का प्रतीक है; अँधेरा अज्ञान, दुख और बुराई का। एक दीया छोटा है, पर जब सब मिलकर दीप
    जलाते हैं तो धरती का अँधेरा मिट जाता है। कवि कहते हैं कि रुकना नहीं है, आगे बढ़ते हुए दीप जलाते जाना है।
    संदेश: मिलकर अच्छाई और ज्ञान फैलाओ; छोटा प्रयास भी अँधेरा दूर करता है।
  explanations:
    text: 'कवि कहते हैं: अँधेरे से डरो मत, दीप जलाते चलो। यहाँ दीया ज्ञान, प्रेम और आशा का प्रतीक है और अँधेरा अज्ञान और दुख का। एक छोटा दीया भी रोशनी देता है, और जब सब मिलकर दीप जलाते हैं, तो पूरा अँधेरा मिट जाता है।'
    visual: 'कल्पना कीजिए: अँधेरी रात, एक बच्चा दीया जलाता है, फिर उसी से दूसरा, फिर तीसरा... कुछ ही देर में पूरी गली दीयों से जगमगा उठती है।'
    step_by_step: '1. कवि और मुख्य बात पहचानें: दीप जलाना। 2. प्रतीक समझें: दीया = ज्ञान, प्रेम; अँधेरा = अज्ञान, दुख। 3. ''मिलकर'' की बात देखें। 4. संदेश लिखें।'
    real_world: 'किसी एक बच्चे को पढ़ना सिखाना भी एक दीया जलाने जैसा है: वह आगे दूसरों को सिखाता है।'
  picture:
    kind: compare
    columns:
    - title: दीया (प्रकाश)
      points:
      - ज्ञान
      - प्रेम
      - आशा
    - title: अँधेरा
      points:
      - अज्ञान
      - नफ़रत
      - निराशा
    alt: दीया ज्ञान, प्रेम और आशा का प्रतीक है; अँधेरा अज्ञान, नफ़रत और निराशा का।
  activity:
    type: sort
    prompt: कविता में दीया किसका प्रतीक है और अँधेरा किसका?
    bins:
    - दीया
    - अँधेरा
    items:
    - label: ज्ञान
      bin: दीया
      clue: ज्ञान से क्या मिटता है?
      why: दीया = ज्ञान।
    - label: आशा
      bin: दीया
      clue: आशा अँधेरे में क्या करती है?
      why: दीया = आशा।
    - label: अज्ञान
      bin: अँधेरा
      clue: ज्ञान का उलटा?
      why: अँधेरा = अज्ञान।
    - label: दुख और बुराई
      bin: अँधेरा
      clue: दीप जलाकर क्या मिटाना है?
      why: अँधेरा = दुख और बुराई।
  lesson:
    - teach: '''जलाते चलो'' द्वारिका प्रसाद माहेश्वरी की प्रेरणा देने वाली कविता है। कवि कहते हैं कि अँधेरे से हार मत मानो, आगे बढ़ते हुए दीप जलाते चलो।'
      check:
        prompt: कवि अँधेरे के सामने क्या करने को कहते हैं?
        options:
        - दीप जलाते चलना
        - आँखें बंद कर लेना
        - घर लौट जाना
        answer: दीप जलाते चलना
        why: कविता का शीर्षक ही यही कहता है।
    - teach: 'कविता में दीया और अँधेरा प्रतीक हैं। दीया = ज्ञान, प्रेम, आशा और भलाई। अँधेरा = अज्ञान, दुख और बुराई। प्रतीक का अर्थ है: एक चीज़ से दूसरी बड़ी बात दिखाना।'
      picture:
        kind: compare
        columns:
        - title: दीया
          points:
          - ज्ञान
          - प्रेम
          - आशा
        - title: अँधेरा
          points:
          - अज्ञान
          - दुख
          - बुराई
        alt: दीया ज्ञान, प्रेम और आशा का प्रतीक है; अँधेरा अज्ञान, दुख और बुराई का।
      check:
        prompt: कविता में 'अँधेरा' किसका प्रतीक है?
        options:
        - अज्ञान और दुख का
        - रात के खाने का
        - आराम का
        answer: अज्ञान और दुख का
        why: जैसे दीया अँधेरा मिटाता है, वैसे ज्ञान अज्ञान मिटाता है।
    - teach: 'एक दीया छोटा होता है, पर जब सब मिलकर दीप जलाते हैं तो धरती का अँधेरा मिट जाता है। सीख: छोटे-छोटे अच्छे प्रयास मिलकर बड़ा बदलाव लाते हैं, इसलिए रुकना नहीं है।'
      check:
        prompt: धरती का अँधेरा कैसे मिटेगा?
        options:
        - सब मिलकर दीप जलाएँ
        - एक बड़ा बल्ब लगाकर
        - इंतज़ार करके
        answer: सब मिलकर दीप जलाएँ
        why: कविता मिलकर प्रयास करने की बात करती है।
  items:
  - prompt: '''जलाते चलो'' कविता के कवि कौन हैं?'
    options:
    - द्वारिका प्रसाद माहेश्वरी
    - सूरदास
    - रहीम
    - सोहनलाल द्विवेदी
    answer: द्वारिका प्रसाद माहेश्वरी
    difficulty: 1
    hints:
    - बाल-कविताओं के कवि।
    - '''द्वारिका''।'
    solution: कविता द्वारिका प्रसाद माहेश्वरी की है।
    mistakes:
      रहीम: hin6_read_again
  - prompt: कविता में क्या जलाते चलने को कहा गया है?
    options:
