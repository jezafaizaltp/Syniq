    solution: सबके मिलकर दीप जलाने से अँधेरा मिटेगा।
    mistakes: {"जब सूरज डूबेगा": "h6_milkar"}
  - prompt: कविता से क्या सीख मिलती है?
    options:
    - छोटे-छोटे अच्छे प्रयास मिलकर बड़ा बदलाव लाते हैं
    - अँधेरे में बैठे रहो
    - अकेले कुछ मत करो
    - दीये बेकार हैं
    answer: छोटे-छोटे अच्छे प्रयास मिलकर बड़ा बदलाव लाते हैं
    difficulty: 2
    hints:
    - एक दीया, फिर कई।
    - बदलाव।
    solution: हर छोटा प्रयास मिलकर अँधेरा दूर करता है।
    mistakes: {"अकेले कुछ मत करो": "h6_chhote_prayas"}
  - prompt: '''जलाते चलो'' कविता किस भाव की कविता है?'
    options:
    - प्रेरणा
    - डर
    - शोक
    answer: प्रेरणा
    difficulty: 1
    hints:
    - कवि हमें आगे बढ़ने को कहते हैं।
    - यह कविता हिम्मत बढ़ाती है।
    solution: 'चरण 1: कवि रुकने नहीं, बढ़ने को कहते हैं। चरण 2: यह प्रेरणा की कविता है।'
    mistakes:
      डर: c6h7_prerna
      शोक: c6h7_prerna
  - prompt: '''दीप'' शब्द का दूसरा नाम क्या है?'
    options:
    - दीया
    - दरवाज़ा
    - दीवार
    answer: दीया
    difficulty: 1
    hints:
    - इसमें तेल और बाती होती है।
    - दीपावली में यही जलाए जाते हैं।
    solution: 'चरण 1: दीपावली = दीपों की पंक्ति। चरण 2: दीप का दूसरा नाम दीया है।'
    mistakes:
      दरवाज़ा: c6h7_shabd
      दीवार: c6h7_shabd
  - prompt: कवि 'चलो' शब्द से क्या कहना चाहते हैं?
    options:
    - रुको मत, आगे बढ़ते रहो
    - भाग जाओ
    - सो जाओ
    answer: रुको मत, आगे बढ़ते रहो
    difficulty: 2
    hints:
    - कवि काम करते-करते आगे बढ़ने की बात करते हैं।
    - यह रुकने का उल्टा है।
    solution: 'चरण 1: ''जलाते चलो'' = जलाते हुए आगे बढ़ो। चरण 2: रुकना नहीं है।'
    mistakes:
      भाग जाओ: c6h7_prerna
      सो जाओ: c6h7_prerna
  - prompt: कक्षा में किसी साथी को कोई पाठ समझ नहीं आ रहा। 'दीप जलाने' का काम कौन-सा होगा?
    options:
    - उसे प्यार से समझाना
    - उस पर हँसना
    - उसे अनदेखा करना
    answer: उसे प्यार से समझाना
    difficulty: 3
    hints:
    - दीया ज्ञान और प्रेम का प्रतीक है।
    - किस काम से साथी का 'अँधेरा' मिटेगा?
    solution: 'चरण 1: दीया = ज्ञान और प्रेम। चरण 2: साथी को प्यार से समझाना दीप जलाने जैसा है।'
    mistakes:
      उस पर हँसना: c6h7_pratik
      उसे अनदेखा करना: c6h7_pratik
  - prompt: एक दीया छोटा है, फिर भी कवि उसे जलाने को क्यों कहते हैं?
    options:
    - हर छोटा प्रयास भी कुछ अँधेरा मिटाता है
    - क्योंकि दीया सस्ता है
    - क्योंकि बड़ा दीया नहीं मिलता
    answer: हर छोटा प्रयास भी कुछ अँधेरा मिटाता है
    difficulty: 3
    hints:
    - एक दीया पूरे कमरे को न सही, अपने पास तो रोशनी देता है।
    - बहुत से दीये मिलकर क्या करते हैं?
    solution: 'चरण 1: एक दीया भी थोड़ी रोशनी देता है। चरण 2: छोटे प्रयास जुड़कर बड़ा बदलाव लाते हैं।'
    mistakes:
      क्योंकि दीया सस्ता है: c6h7_saath
      क्योंकि बड़ा दीया नहीं मिलता: c6h7_saath
  - prompt: '''अज्ञान'' का अर्थ क्या है?'
    options:
    - ज्ञान न होना
    - बहुत ज्ञान होना
    - ज्ञान बाँटना
    answer: ज्ञान न होना
    difficulty: 2
    hints:
    - '''अ'' जोड़ने से शब्द का उल्टा अर्थ बनता है।'
    - जैसे सत्य से असत्य।
    solution: 'चरण 1: ''अ'' = नहीं। चरण 2: अज्ञान = ज्ञान न होना।'
    mistakes:
      बहुत ज्ञान होना: c6h7_shabd
      ज्ञान बाँटना: c6h7_shabd
  - prompt: कविता में दीया किस बात का प्रतीक नहीं है?
    options:
    - बुराई
    - आशा
    - ज्ञान
    answer: बुराई
    difficulty: 2
    hints:
    - दीया अच्छी चीज़ों का प्रतीक है।
    - कौन-सा विकल्प अँधेरे के साथ जाता है?
    solution: 'चरण 1: दीया = ज्ञान, प्रेम, आशा। चरण 2: बुराई अँधेरे का प्रतीक है, दीये का नहीं।'
    mistakes:
      आशा: c6h7_pratik
      ज्ञान: c6h7_pratik
  - prompt: '''मिलकर दीप जलाना'' आज के जीवन में किस काम जैसा है?'
    options:
    - सब मिलकर गाँव की सफ़ाई करना
    - अकेले खेलते रहना
    - झगड़ा करना
    answer: सब मिलकर गाँव की सफ़ाई करना
    difficulty: 3
    hints:
    - कविता में सब लोग साथ मिलकर कुछ अच्छा करते हैं।
    - किस काम में बहुत लोग मिलकर भलाई करते हैं?
    solution: 'चरण 1: मिलकर दीप जलाना = मिलकर भलाई करना। चरण 2: सब मिलकर सफ़ाई करना ऐसा ही काम है।'
    mistakes:
      अकेले खेलते रहना: c6h7_saath
      झगड़ा करना: c6h7_saath
  - prompt: कविता का शीर्षक 'जलाते चलो' क्यों ठीक है?
    options:
    - कविता बार-बार रोशनी फैलाते हुए बढ़ने को कहती है
    - कविता आग से खेलने को कहती है
    - कविता चूल्हा जलाने की है
    answer: कविता बार-बार रोशनी फैलाते हुए बढ़ने को कहती है
    difficulty: 3
    hints:
    - 'शीर्षक में दो काम हैं: जलाना और चलना।'
    - कविता का मुख्य संदेश इन्हीं दो कामों में है।
    solution: 'चरण 1: शीर्षक में जलाना और चलना है। चरण 2: कविता यही कहती है, इसलिए शीर्षक ठीक है।'
