      clue: सेना के बीच जाना क्या दिखाता है?
      why: चेतक का साहस।
    - label: भालों-तलवारों के बीच से निकल जाता
      bin: निडरता
      clue: हथियारों से डरता था?
      why: चेतक की निडरता।
  lesson:
    - teach: '''चेतक की वीरता'' श्यामनारायण पांडेय के काव्य ''हल्दीघाटी'' का अंश है। इसमें महाराणा प्रताप के घोड़े चेतक की वीरता का वर्णन है, जो 1576 के हल्दीघाटी युद्ध में दिखी।'
      check:
        prompt: यह कविता किस काव्य से ली गई है?
        options:
