      - भालों-तलवारों से बचा
      - स्वामी का साथ दिया
    alt: चेतक हवा से तेज़, इशारा समझने वाला और निडर था; युद्ध में वह दुश्मनों के बीच कूदा और स्वामी का साथ दिया।
  activity:
    type: sort
    prompt: कविता में चेतक की कौन-सी बात किस गुण को दिखाती है?
    bins:
