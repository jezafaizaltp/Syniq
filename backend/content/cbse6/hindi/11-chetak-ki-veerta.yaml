        answer: वह राणा का इशारा समझ लेता था
        why: स्वामी और घोड़े के बीच गहरी समझ थी।
    - teach: यह वीर रस की कविता है। इसकी लय तेज़ है, पढ़ते समय दौड़ते घोड़े जैसा लगता है। कविता स्वामिभक्ति, साहस और वीरता का संदेश देती है।
      check:
        prompt: कविता की तेज़ लय किसका अनुभव कराती है?
