subject: cbse6-hin
chapter: 11
title: चेतक की वीरता (कविता)
tips:
  h6_haldighati: "चेतक महाराणा प्रताप का घोड़ा था। प्रताप ने अकबर की सेना से राजस्थान की किस घाटी में युद्ध किया?"
  h6_hawa: "चेतक बहुत तेज़ था। कछुआ तो धीमा होता है।"
  h6_shyamnarayan: "यह कविता 'हल्दीघाटी' नामक महाकाव्य से है।"
  h6_varsh: "2026 में से 1576 घटाओ। सैकड़े के अंक ध्यान से देखो।"
  c6h11_itihas: 'कविता के पीछे की इतिहास की घटना याद करो: कौन राजा, किसकी सेना, किस साल।'
  c6h11_gun: कविता चेतक की किन बातों की तारीफ़ करती है? उसकी गति, समझ और साहस के बारे में सोचो।
  c6h11_ras: 'सोचो कि कविता पढ़कर मन में कौन-सा भाव जागता है: जोश, हँसी या दुख?'
  c6h11_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ कविता से मेल खाए, वही चुनो।

concepts:
- code: cbse6h.m11.chetak
  title: चेतक की वीरता (कविता)
  notes: |
    कवि: श्यामनारायण पांडेय (काव्य 'हल्दीघाटी' से)। महाराणा प्रताप के घोड़े चेतक की वीरता का वर्णन, हल्दीघाटी के युद्ध
    (1576) में। चेतक हवा से भी तेज़ दौड़ता था, राणा का इशारा समझ लेता था, चाबुक की ज़रूरत नहीं पड़ती थी; वह दुश्मनों
    की सेना के बीच कूद जाता, भालों और तलवारों के बीच से निकल जाता। वीर रस की कविता; तेज़ लय से दौड़ते घोड़े का अनुभव।
    संदेश: स्वामिभक्ति, साहस और वीरता।
  explanations:
    text: यह कविता महाराणा प्रताप के घोड़े चेतक की वीरता बताती है। हल्दीघाटी के युद्ध में चेतक हवा से तेज़ दौड़ा, राणा के इशारे को समझा और दुश्मनों के बीच से निकल गया। कविता की तेज़ लय पढ़ते हुए लगता है जैसे घोड़ा दौड़ रहा हो।
    visual: 'कल्पना कीजिए: धूल उड़ाता सफ़ेद घोड़ा, उस पर भाला लिए महाराणा प्रताप, चारों ओर तलवारें, और घोड़ा एक छलाँग में आगे निकल जाता है।'
    step_by_step: '1. कवि और युद्ध पहचानें: हल्दीघाटी। 2. चेतक के गुण खोजें: तेज़, समझदार, निडर। 3. उपमाएँ देखें: हवा से तेज़। 4. रस पहचानें: वीर रस। 5. संदेश लिखें।'
    real_world: राजस्थान में हल्दीघाटी के पास चेतक की समाधि (स्मारक) है, जहाँ लोग आज भी उसकी वीरता याद करते हैं।
  picture:
    kind: compare
