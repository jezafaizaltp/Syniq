      why: चेतक की गति।
    - label: राणा का इशारा समझ लेता था
      bin: समझदारी
      clue: बिना कहे बात समझना क्या दिखाता है?
      why: चेतक की समझ।
    - label: चाबुक की ज़रूरत नहीं पड़ती थी
