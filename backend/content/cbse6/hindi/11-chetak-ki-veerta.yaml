    - teach: चेतक हवा से भी तेज़ दौड़ता था। वह राणा का इशारा समझ लेता था, उसे चाबुक की ज़रूरत नहीं पड़ती थी। वह दुश्मन की सेना के बीच कूद जाता और भालों-तलवारों के बीच से निकल जाता।
      picture:
        kind: compare
        columns:
        - title: चेतक की गति
          points:
