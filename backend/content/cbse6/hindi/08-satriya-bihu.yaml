    - केवल मंच पर गुरु करते हैं
    - केवल विदेश में होता है
    answer: आम लोग मिलकर त्योहारों पर करते हैं
    difficulty: 3
    hints:
    - '''लोक'' का अर्थ है आम लोग।'
    - बिहू गाँव-गाँव में होता है।
    solution: 'चरण 1: लोक = आम जनता। चरण 2: लोकनृत्य आम लोग मिलकर त्योहारों पर करते हैं।'
    mistakes:
      केवल मंच पर गुरु करते हैं: c6h8_tulna
      केवल विदेश में होता है: c6h8_tulna
  - prompt: सत्रिया और बिहू में एक समान बात क्या है?
    options:
    - दोनों असम के नृत्य हैं
    - दोनों शास्त्रीय नृत्य हैं
    - दोनों केवल मठों में होते हैं
    answer: दोनों असम के नृत्य हैं
