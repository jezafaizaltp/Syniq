concepts:
- code: cbse6h.m8.nritya
  title: सत्रिया और बिहू नृत्य (निबंध)
  notes: |
    असम के दो प्रसिद्ध नृत्यों का परिचय। सत्रिया: शास्त्रीय नृत्य, जिसकी शुरुआत लगभग 15वीं-16वीं सदी में संत श्रीमंत
    शंकरदेव ने की; यह असम के सत्रों (वैष्णव मठों) में भक्ति के लिए किया जाता था; इसमें कृष्ण-कथाएँ दिखाई जाती हैं।
    सन 2000 में इसे भारत के शास्त्रीय नृत्यों में मान्यता मिली। बिहू: असम का लोकनृत्य, बोहाग (रोंगाली) बिहू पर, अप्रैल में
    असमिया नववर्ष और वसंत के स्वागत में किया जाता है; युवक-युवतियाँ ढोल, पेपा (भैंस के सींग का बाजा) और गोगोना के साथ
    नाचते हैं; पारंपरिक वस्त्र मेखेला-चादर।
    संदेश: भारत की सांस्कृतिक विविधता और परंपराओं पर गर्व।
  explanations:
    text: 'असम के दो नृत्य हैं: सत्रिया और बिहू। सत्रिया शास्त्रीय नृत्य है जिसे संत शंकरदेव ने सत्रों (मठों) में भक्ति के लिए शुरू किया। बिहू लोकनृत्य है, जो अप्रैल में बोहाग बिहू पर नववर्ष और वसंत के स्वागत में ढोल और पेपा के साथ होता है।'
    visual: 'कल्पना कीजिए दो दृश्य: एक मठ में सफ़ेद वस्त्र पहने नर्तक धीमी, सुंदर मुद्राओं में कृष्ण-कथा दिखाते हुए; और खेतों के पास ढोल की थाप पर लाल-सुनहरी मेखेला-चादर में नाचते युवा।'
    step_by_step: '1. नृत्य का नाम और प्रकार: शास्त्रीय या लोक। 2. कहाँ से: असम। 3. किसने शुरू किया / कब होता है। 4. वाद्य और वस्त्र। 5. महत्व।'
    real_world: गणतंत्र दिवस की परेड में असम की झाँकी में अक्सर बिहू नर्तक दिखते हैं।
  picture:
    kind: compare
    columns:
    - title: सत्रिया
      points:
      - शास्त्रीय नृत्य
      - शंकरदेव ने शुरू किया
      - सत्रों में भक्ति
    - title: बिहू
      points:
      - लोकनृत्य
      - बोहाग बिहू (अप्रैल)
      - ढोल और पेपा
    alt: सत्रिया शास्त्रीय नृत्य है जिसे शंकरदेव ने सत्रों में भक्ति के लिए शुरू किया; बिहू लोकनृत्य है जो अप्रैल में ढोल और पेपा के साथ होता है।
  items:
  - prompt: सत्रिया और बिहू नृत्य किस राज्य के हैं?
    options:
    - असम
    - केरल
    - पंजाब
    - गुजरात
    answer: असम
    difficulty: 1
    hints:
    - पूर्वोत्तर भारत।
    - ब्रह्मपुत्र।
    solution: दोनों असम के नृत्य हैं।
    mistakes:
      केरल: hin6_read_again
  - prompt: सत्रिया नृत्य की शुरुआत किसने की?
    options:
    - श्रीमंत शंकरदेव
    - रवींद्रनाथ टैगोर
    - बिरजू महाराज
    - तानसेन
    answer: श्रीमंत शंकरदेव
    difficulty: 1
    hints:
    - असम के संत।
    - वैष्णव।
    solution: संत श्रीमंत शंकरदेव ने इसकी शुरुआत की।
    mistakes: {"बिरजू महाराज": "h6_shankardev"}
  - prompt: बिहू किस प्रकार का नृत्य है?
    options:
    - लोकनृत्य
    - शास्त्रीय नृत्य
    - पश्चिमी नृत्य
    - युद्ध-नृत्य
    answer: लोकनृत्य
    difficulty: 1
    hints:
    - लोगों का उत्सव-नृत्य।
    - खेत और वसंत।
    solution: बिहू असम का लोकनृत्य है।
    mistakes: {"शास्त्रीय नृत्य": "h6_loknritya"}
  - prompt: सत्रिया नृत्य पहले कहाँ किया जाता था?
    options:
    - सत्रों (वैष्णव मठों) में
    - बाज़ार में
    - स्टेडियम में
    - स्कूलों में
    answer: सत्रों (वैष्णव मठों) में
    difficulty: 2
    hints:
    - नाम में ही संकेत।
    - भक्ति।
    solution: यह सत्रों में भक्ति के लिए होता था।
    mistakes: {"स्टेडियम में": "h6_satra"}
  - prompt: बोहाग (रोंगाली) बिहू कब मनाया जाता है?
    options:
    - अप्रैल में, असमिया नववर्ष पर
    - दिसंबर में
    - अगस्त में
    - जनवरी में
    answer: अप्रैल में, असमिया नववर्ष पर
    difficulty: 2
    hints:
    - वसंत।
    - नया साल।
    solution: यह अप्रैल में नववर्ष और वसंत के स्वागत में होता है।
    mistakes: {"दिसंबर में": "h6_bohag"}
  - prompt: '''पेपा'' क्या है?'
    options:
    - भैंस के सींग से बना बाजा
    - एक मिठाई
    - एक नदी
    - एक वस्त्र
    answer: भैंस के सींग से बना बाजा
    difficulty: 2
    hints:
    - बिहू में बजता है।
    - फूँककर।
    solution: पेपा भैंस के सींग का बाजा है।
    mistakes: {"एक मिठाई": "h6_pepa"}
