    difficulty: 2
    hints:
    - बिहू में बजता है।
    - फूँककर।
    solution: पेपा भैंस के सींग का बाजा है।
    mistakes: {"एक मिठाई": "h6_pepa"}
  - prompt: सत्रिया किस प्रकार का नृत्य है?
    options:
    - शास्त्रीय नृत्य
    - लोकनृत्य
    - पश्चिमी नृत्य
    answer: शास्त्रीय नृत्य
    difficulty: 1
    hints:
    - इसे सन 2000 में भारत के ऐसे नृत्यों की सूची में जगह मिली।
    - कथक और भरतनाट्यम भी इसी तरह के हैं।
    solution: 'चरण 1: सत्रिया के नियम और परंपरा तय हैं। चरण 2: यह शास्त्रीय नृत्य है।'
    mistakes:
      लोकनृत्य: c6h8_tulna
      पश्चिमी नृत्य: c6h8_tulna
  - prompt: सत्रिया को शास्त्रीय नृत्य के रूप में मान्यता कब मिली?
    options:
    - सन 2000 में
    - सन 1947 में
    - सन 1857 में
    answer: सन 2000 में
    difficulty: 2
    hints:
    - यह बहुत हाल की बात है।
    - 21वीं सदी के शुरू में।
    solution: 'चरण 1: पाठ बताता है कि मान्यता नई सदी की शुरुआत में मिली। चरण 2: वह साल 2000 था।'
    mistakes:
      सन 1947 में: c6h8_tulna
      सन 1857 में: c6h8_tulna
  - prompt: बिहू नृत्य में महिलाएँ पारंपरिक रूप से क्या पहनती हैं?
    options:
