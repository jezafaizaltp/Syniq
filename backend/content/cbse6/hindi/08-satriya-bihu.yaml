# CBSE Class 6 Hindi (NCERT Malhar, 2024), chapter 8. Format: content/README.md.
# Written from memory and study notes, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse6-hin
chapter: 8
title: सत्रिया और बिहू नृत्य (निबंध)
tips:
  h6_bohag: "बोहाग बिहू असमिया नए साल पर, वसंत में मनाया जाता है।"
  h6_loknritya: "बिहू गाँव-गाँव में लोग मिलकर करते हैं, फ़सल के उत्सव पर।"
  h6_pepa: "पेपा बिहू में फूँककर बजाया जाता है।"
  h6_satra: "नृत्य का नाम उस जगह से बना है जहाँ यह होता था।"
  h6_shankardev: "बिरजू महाराज कथक के गुरु थे। सत्रिया असम के एक संत ने लगभग 500 साल पहले शुरू किया।"
  c6h8_tulna: 'दोनों नृत्यों को अलग-अलग रखो: एक मठों में भक्ति के लिए, दूसरा गाँवों में त्योहार पर। प्रश्न किसका है?'
  c6h8_tyohar: सोचो कि यह नृत्य किस मौसम और किस अवसर पर होता है।
  c6h8_saaz: नृत्य के साथ बजने वाले बाजों और पहनावे को याद करो।
  c6h8_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ पाठ से मेल खाए, वही चुनो।

concepts:
- code: cbse6h.m8.nritya
  title: सत्रिया और बिहू नृत्य (निबंध)
  notes: |
    असम के दो प्रसिद्ध नृत्यों का परिचय। सत्रिया: शास्त्रीय नृत्य, जिसकी शुरुआत लगभग 15वीं-16वीं सदी में संत श्रीमंत
    शंकरदेव ने की; यह असम के सत्रों (वैष्णव मठों) में भक्ति के लिए किया जाता था; इसमें कृष्ण-कथाएँ दिखाई जाती हैं।
    सन 2000 में इसे भारत के शास्त्रीय नृत्यों में मान्यता मिली। बिहू: असम का लोकनृत्य, बोहाग (रोंगाली) बिहू पर, अप्रैल में
    असमिया नववर्ष और वसंत के स्वागत में किया जाता है; युवक-युवतियाँ ढोल, पेपा (भैंस के सींग का बाजा) और गोगोना के साथ
    नाचते हैं; पारंपरिक वस्त्र मेखेला-चादर।
    संदेश: भारत की सांस्कृतिक विविधता और परंपराओं पर गर्व।
  explanations:
    text: 'असम के दो नृत्य हैं: सत्रिया और बिहू। सत्रिया शास्त्रीय नृत्य है जिसे संत शंकरदेव ने सत्रों (मठों) में भक्ति के लिए शुरू किया। बिहू लोकनृत्य है, जो अप्रैल में बोहाग बिहू पर नववर्ष और वसंत के स्वागत में ढोल और पेपा के साथ होता है।'
    visual: 'कल्पना कीजिए दो दृश्य: एक मठ में सफ़ेद वस्त्र पहने नर्तक धीमी, सुंदर मुद्राओं में कृष्ण-कथा दिखाते हुए; और खेतों के पास ढोल की थाप पर लाल-सुनहरी मेखेला-चादर में नाचते युवा।'
    step_by_step: '1. नृत्य का नाम और प्रकार: शास्त्रीय या लोक। 2. कहाँ से: असम। 3. किसने शुरू किया / कब होता है। 4. वाद्य और वस्त्र। 5. महत्व।'
    real_world: गणतंत्र दिवस की परेड में असम की झाँकी में अक्सर बिहू नर्तक दिखते हैं।
  picture:
    kind: compare
    columns:
    - title: सत्रिया
      points:
      - शास्त्रीय नृत्य
      - शंकरदेव ने शुरू किया
      - सत्रों में भक्ति
    - title: बिहू
      points:
      - लोकनृत्य
      - बोहाग बिहू (अप्रैल)
      - ढोल और पेपा
    alt: सत्रिया शास्त्रीय नृत्य है जिसे शंकरदेव ने सत्रों में भक्ति के लिए शुरू किया; बिहू लोकनृत्य है जो अप्रैल में ढोल और पेपा के साथ होता है।
  activity:
    type: sort
    prompt: यह बात सत्रिया की है या बिहू की?
    bins:
    - सत्रिया
    - बिहू
    items:
    - label: शंकरदेव ने शुरू किया
      bin: सत्रिया
      clue: वैष्णव संत से जुड़ा नृत्य कौन-सा?
      why: सत्रिया की शुरुआत शंकरदेव ने की।
    - label: सत्रों (मठों) में भक्ति के लिए
      bin: सत्रिया
      clue: 'नाम से ही सोचो: सत्र।'
      why: सत्रिया = सत्रों का नृत्य।
    - label: सन 2000 में शास्त्रीय नृत्य की मान्यता
      bin: सत्रिया
      clue: शास्त्रीय नृत्य कौन-सा है?
      why: सत्रिया शास्त्रीय नृत्य है।
    - label: अप्रैल में असमिया नववर्ष पर
      bin: बिहू
      clue: बोहाग में कौन-सा उत्सव होता है?
      why: रोंगाली बिहू नववर्ष पर।
    - label: ढोल और पेपा के साथ लोकनृत्य
      bin: बिहू
      clue: लोकनृत्य कौन-सा है?
      why: बिहू लोकनृत्य है।
  lesson:
    - teach: 'यह निबंध असम के दो प्रसिद्ध नृत्यों का परिचय देता है: सत्रिया और बिहू। एक शास्त्रीय नृत्य है और दूसरा लोकनृत्य। दोनों असम की संस्कृति का गर्व हैं।'
      check:
        prompt: यह पाठ किस राज्य की संस्कृति के बारे में है?
        options:
        - असम
        - केरल
        - पंजाब
        answer: असम
        why: सत्रिया और बिहू दोनों असम के नृत्य हैं।
    - teach: सत्रिया शास्त्रीय नृत्य है। इसकी शुरुआत लगभग 500 साल पहले संत श्रीमंत शंकरदेव ने की। यह सत्रों (वैष्णव मठों) में भक्ति के लिए किया जाता था और इसमें कृष्ण-कथाएँ दिखाई जाती हैं। सन 2000 में इसे भारत के शास्त्रीय नृत्यों में मान्यता मिली।
      picture:
        kind: compare
        columns:
        - title: सत्रिया
          points:
          - शास्त्रीय नृत्य
          - सत्रों में भक्ति
          - कृष्ण-कथाएँ
        - title: बिहू
          points:
          - लोकनृत्य
          - बोहाग बिहू पर
          - ढोल और पेपा
        alt: सत्रिया मठों का शास्त्रीय भक्ति-नृत्य है, बिहू त्योहार का लोकनृत्य।
      check:
        prompt: सत्रिया नृत्य में किसकी कथाएँ दिखाई जाती हैं?
        options:
        - कृष्ण की
        - शिवाजी की
        - अकबर की
        answer: कृष्ण की
        why: यह वैष्णव मठों का भक्ति-नृत्य है।
    - teach: बिहू असम का लोकनृत्य है। बोहाग (रोंगाली) बिहू अप्रैल में असमिया नववर्ष और वसंत के स्वागत में मनाया जाता है। युवक-युवतियाँ ढोल, पेपा और गोगोना के साथ नाचते हैं, और पारंपरिक मेखेला-चादर पहनते हैं।
      check:
        prompt: बोहाग बिहू किस ऋतु का स्वागत करता है?
        options:
        - वसंत
        - शीत
        - वर्षा
        answer: वसंत
        why: यह अप्रैल में, नए साल और वसंत के साथ आता है।
  items:
  - prompt: सत्रिया और बिहू नृत्य किस राज्य के हैं?
    options:
    - असम
    - केरल
    - पंजाब
    - गुजरात
    answer: असम
    difficulty: 1
    hints:
    - पूर्वोत्तर भारत।
    - ब्रह्मपुत्र।
    solution: दोनों असम के नृत्य हैं।
