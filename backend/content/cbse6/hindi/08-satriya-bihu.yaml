    - इसमें दो हिस्से होते हैं, नीचे और ऊपर।
    solution: 'चरण 1: बिहू असम का नृत्य है। चरण 2: असम का पारंपरिक पहनावा मेखेला-चादर है।'
    mistakes:
      लहँगा-चोली: c6h8_saaz
      कोट-पैंट: c6h8_saaz
  - prompt: बिहू नृत्य के साथ कौन-सा बाजा नहीं बजता?
    options:
    - सितार
    - ढोल
    - पेपा
    answer: सितार
    difficulty: 2
    hints:
    - तीन में से दो बाजे पाठ में बताए गए हैं।
    - बिहू के बाजे ढोल, पेपा और गोगोना हैं।
    solution: 'चरण 1: बिहू में ढोल, पेपा, गोगोना बजते हैं। चरण 2: सितार इनमें नहीं है।'
    mistakes:
      ढोल: c6h8_saaz
      पेपा: c6h8_saaz
  - prompt: '''सत्र'' शब्द का पाठ में अर्थ क्या है?'
    options:
    - वैष्णव मठ
    - स्कूल की छुट्टी
    - खेल का मैदान
    answer: वैष्णव मठ
    difficulty: 2
    hints:
    - सत्रिया नृत्य का नाम इसी से बना है।
    - ये भक्ति के स्थान हैं।
    solution: 'चरण 1: सत्रिया = सत्रों का नृत्य। चरण 2: सत्र असम के वैष्णव मठ हैं।'
    mistakes:
      स्कूल की छुट्टी: c6h8_shabd
      खेल का मैदान: c6h8_shabd
  - prompt: बोहाग बिहू को और किस नाम से जाना जाता है?
    options:
    - रोंगाली बिहू
    - दीपावली
    - ओणम
    answer: रोंगाली बिहू
    difficulty: 2
    hints:
    - दूसरे नाम में भी 'बिहू' शब्द है।
    - '''रोंग'' का अर्थ असमिया में खुशी है।'
    solution: 'चरण 1: बोहाग बिहू खुशी का त्योहार है। चरण 2: इसे रोंगाली बिहू भी कहते हैं।'
    mistakes:
      दीपावली: c6h8_tyohar
      ओणम: c6h8_tyohar
  - prompt: लोकनृत्य की पहचान क्या है?
    options:
