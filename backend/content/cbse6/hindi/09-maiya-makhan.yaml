subject: cbse6-hin
chapter: 9
title: मैया मैं नहिं माखन खायो (पद)
tips:
  h6_brajbhasha: "सूरदास मथुरा-वृंदावन क्षेत्र के कवि थे। वहाँ की भाषा क्या कहलाती है?"
  h6_chhinka: "माखन ऊँचे टँगे छींके पर रखा था। कृष्ण कहते हैं वे छोटे हैं।"
  h6_vatsalya: "यह पद माँ और बच्चे के प्यार का है, युद्ध का नहीं।"
  h6_yashoda: "पद 'मैया मोरी' से शुरू होता है। कृष्ण किसे 'मैया' कहते हैं?"
  c6h9_bahana: 'कृष्ण के तीन बहानों को क्रम से याद करो: दिन भर कहाँ रहे, हाथ कैसे हैं, और दोस्त क्या करते हैं।'
  c6h9_kavi: 'सूरदास के बारे में सोचो: वे किसके भक्त थे और किस क्षेत्र की बोली में गाते थे?'
  c6h9_bhav: माँ और बच्चे की इस बातचीत में कैसा प्यार है? सोचो कि माँ को गुस्सा आता है या हँसी।
  c6h9_shabd: ब्रजभाषा के शब्द का आज की हिंदी वाला रूप सोचो, फिर विकल्पों से मिलाओ।

concepts:
- code: cbse6h.m9.makhan
  title: मैया मैं नहिं माखन खायो (पद)
  notes: |
    कवि: सूरदास, भक्ति काल के कृष्ण-भक्त कवि, ब्रजभाषा। इस पद में बालक कृष्ण माँ यशोदा से कहते हैं कि उन्होंने
    माखन नहीं खाया। वे बहाने बनाते हैं: सुबह होते ही गायें चराने वन भेज दिया जाता है, शाम को लौटता हूँ; मैं छोटा हूँ,
    मेरे छोटे हाथ ऊँचे छींके (सिकहर) तक कैसे पहुँचेंगे; ग्वाल-बाल मुझसे बैर रखते हैं और ज़बरदस्ती मुँह पर माखन लगा
    देते हैं। यह सुनकर यशोदा हँस पड़ती हैं और कृष्ण को गले लगा लेती हैं। रस: वात्सल्य (माँ-बच्चे का प्रेम)।
  explanations:
    text: 'इस पद में नन्हे कृष्ण माँ यशोदा से कहते हैं: मैंने माखन नहीं खाया! वे बहाने बनाते हैं: मैं तो दिन भर गायें चराता हूँ, मेरे छोटे हाथ ऊँचे छींके तक कैसे पहुँचेंगे, ग्वाल-बालों ने मेरे मुँह पर माखन लगा दिया। यशोदा हँसकर उन्हें गले लगा लेती हैं।'
    visual: 'कल्पना कीजिए: ऊपर लटकता माखन का मटका, मुँह पर माखन लगाए नन्हे कृष्ण, हाथ पीछे छिपाए, और सामने मुस्कुराती माँ यशोदा।'
    step_by_step: '1. कवि और भाषा पहचानें: सूरदास, ब्रजभाषा। 2. वक्ता और श्रोता: कृष्ण और यशोदा। 3. कृष्ण के बहाने एक-एक कर लिखें। 4. यशोदा की प्रतिक्रिया। 5. रस: वात्सल्य।'
    real_world: 'छोटे बच्चे जब शरारत करके मासूम बहाने बनाते हैं, तो माता-पिता को गुस्सा कम और प्यार ज़्यादा आता है: यही वात्सल्य है।'
  picture:
    kind: compare
    columns:
    - title: कृष्ण के बहाने
      points:
      - दिन भर गायें चराता हूँ
      - हाथ छोटे, छींका ऊँचा
      - ग्वाल-बालों ने माखन लगाया
    - title: यशोदा का उत्तर
      points:
      - हँस पड़ीं
      - गले लगा लिया
      - प्यार उमड़ा
    alt: कृष्ण बहाने बनाते हैं कि वे गायें चराते हैं, हाथ छोटे हैं, ग्वाल-बालों ने माखन लगाया; यशोदा हँसकर उन्हें गले लगा लेती हैं।
  activity:
    type: sort
    prompt: कृष्ण के बहाने और यशोदा की प्रतिक्रिया अलग करो।
    bins:
    - कृष्ण का बहाना
    - यशोदा ने किया
    items:
    - label: सुबह से गायें चराने वन भेज देती हो
      bin: कृष्ण का बहाना
      clue: 'माखन खाने का समय कहाँ था: यह कौन कहता है?'
      why: कृष्ण का पहला बहाना।
    - label: छोटे हाथ ऊँचे छींके तक कैसे पहुँचें
      bin: कृष्ण का बहाना
      clue: अपने छोटेपन का सहारा कौन लेता है?
      why: कृष्ण का बहाना।
    - label: ग्वाल-बालों ने मुँह पर माखन लगाया
      bin: कृष्ण का बहाना
      clue: दोष किसी और पर कौन डालता है?
      why: कृष्ण दूसरों पर दोष डालते हैं।
    - label: हँसकर गले लगा लिया
      bin: यशोदा ने किया
      clue: बहाने सुनकर माँ ने क्या किया?
      why: 'वात्सल्य: यशोदा हँस पड़ीं।'
  lesson:
    - teach: '''मैया मैं नहिं माखन खायो'' सूरदास का पद है। सूरदास भक्ति काल के कृष्ण-भक्त कवि थे और ब्रजभाषा में लिखते थे। पद एक गाया जाने वाला छोटा गीत है।'
      check:
        prompt: सूरदास किसके भक्त थे?
        options:
        - कृष्ण के
        - राम के
        - बुद्ध के
        answer: कृष्ण के
        why: उनके पद बालक कृष्ण की लीलाओं से भरे हैं।
    - teach: 'बालक कृष्ण माँ यशोदा से कहते हैं कि उन्होंने माखन नहीं खाया, और बहाने बनाते हैं: 1. सुबह से गायें चराने वन भेज दिया जाता है, शाम को लौटता हूँ। 2. मेरे छोटे हाथ ऊँचे छींके तक कैसे पहुँचेंगे? 3. ग्वाल-बाल मुझसे बैर रखते हैं और ज़बरदस्ती मुँह पर माखन लगा देते हैं।'
      picture:
        kind: flow
        steps:
        - दिन भर वन में गायें चराईं
        - छोटे हाथ छींके तक नहीं पहुँचते
        - ग्वाल-बालों ने मुँह पर माखन लगाया
        - यशोदा हँसकर गले लगाती हैं
        alt: कृष्ण के तीन बहाने और फिर माँ का प्यार।
      check:
        prompt: कृष्ण अपने मुँह पर लगे माखन का दोष किसे देते हैं?
        options:
        - ग्वाल-बालों को
        - गायों को
        - बलराम को
        answer: ग्वाल-बालों को
        why: वे कहते हैं कि दोस्तों ने ज़बरदस्ती लगा दिया।
    - teach: बच्चे की भोली चतुराई सुनकर यशोदा हँस पड़ती हैं और कृष्ण को गले लगा लेती हैं। इस पद में वात्सल्य रस है, यानी माँ-बाप का बच्चे के प्रति प्यार।
      check:
        prompt: वात्सल्य रस किस प्रेम को कहते हैं?
        options:
        - माँ-बाप का बच्चे के प्रति प्रेम
        - देश के प्रति प्रेम
        - मित्रों का प्रेम
        answer: माँ-बाप का बच्चे के प्रति प्रेम
        why: यशोदा का कृष्ण के लिए प्यार इसी का उदाहरण है।
  items:
  - prompt: इस पद के कवि कौन हैं?
    options:
    - सूरदास
    - तुलसीदास
    - रहीम
    - कबीर
    answer: सूरदास
    difficulty: 1
    hints:
    - कृष्ण-भक्त।
    - बाल-लीला के कवि।
    solution: पद सूरदास का है।
    mistakes:
      तुलसीदास: hin6_read_again
  - prompt: कृष्ण किससे कहते हैं कि उन्होंने माखन नहीं खाया?
    options:
    - माँ यशोदा से
    - बलराम से
    - राधा से
    - नंद बाबा से
    answer: माँ यशोदा से
    difficulty: 1
    hints:
    - '''मैया''।'
    - माँ।
    solution: वे माँ यशोदा से कहते हैं।
    mistakes: {"बलराम से": "h6_yashoda"}
  - prompt: सूरदास ने किस भाषा में लिखा?
    options:
    - ब्रजभाषा
    - अंग्रेज़ी
    - मलयालम
    - बांग्ला
    answer: ब्रजभाषा
    difficulty: 1
    hints:
    - मथुरा-वृंदावन की भाषा।
    - ब्रज।
    solution: सूरदास ने ब्रजभाषा में लिखा।
    mistakes: {"बांग्ला": "h6_brajbhasha"}
  - prompt: कृष्ण अपने छोटे हाथों के बारे में क्या कहते हैं?
    options:
    - वे ऊँचे छींके तक नहीं पहुँच सकते
    - वे बहुत बड़े हैं
    - उनमें चोट लगी है
    - वे गंदे हैं
    answer: वे ऊँचे छींके तक नहीं पहुँच सकते
    difficulty: 2
    hints:
    - माखन ऊँचे टँगा है।
    - छोटा बच्चा।
    solution: वे कहते हैं कि छोटे हाथ ऊँचे छींके तक कैसे पहुँचेंगे।
    mistakes: {"उनमें चोट लगी है": "h6_chhinka"}
  - prompt: अंत में यशोदा क्या करती हैं?
    options:
    - हँसकर कृष्ण को गले लगा लेती हैं
    - कृष्ण को डाँटती हैं
    - माखन फेंक देती हैं
    - रोने लगती हैं
    answer: हँसकर कृष्ण को गले लगा लेती हैं
    difficulty: 2
    hints:
    - माँ का प्यार।
    - मुस्कान।
    solution: यशोदा हँसकर उन्हें गले लगा लेती हैं।
    mistakes:
      कृष्ण को डाँटती हैं: hin6_poem_meaning
  - prompt: इस पद में कौन-सा रस है?
    options:
    - वात्सल्य रस
    - वीर रस
    - भयानक रस
    - रौद्र रस
    answer: वात्सल्य रस
    difficulty: 2
    hints:
    - माँ और बच्चे का प्रेम।
    - वात्सल्य।
    solution: माँ-बच्चे के प्रेम का वात्सल्य रस है।
    mistakes: {"वीर रस": "h6_vatsalya"}
  - prompt: इस पद में 'मैया' कौन है?
    options:
    - यशोदा
    - देवकी
    - राधा
    answer: यशोदा
    difficulty: 1
    hints:
    - कृष्ण गोकुल में जिस माँ के पास पले।
    - वे नंद बाबा की पत्नी थीं।
    solution: 'चरण 1: कृष्ण गोकुल में पले। चरण 2: वहाँ उनकी मैया यशोदा थीं।'
    mistakes:
      देवकी: c6h9_bhav
      राधा: c6h9_bhav
  - prompt: '''छींका'' क्या होता है?'
    options:
    - ऊपर टँगी रस्सी की जाली जिसमें बर्तन रखते हैं
    - दूध दुहने की बाल्टी
    - गाय बाँधने का खूँटा
    answer: ऊपर टँगी रस्सी की जाली जिसमें बर्तन रखते हैं
    difficulty: 2
    hints:
    - माखन इसमें ऊँचाई पर रखा था।
    - यह छत से लटकता है।
    solution: 'चरण 1: माखन बच्चों से बचाने को ऊँचा रखा जाता था। चरण 2: छींका ऊपर टँगी रस्सी की जाली है।'
    mistakes:
      दूध दुहने की बाल्टी: c6h9_shabd
      गाय बाँधने का खूँटा: c6h9_shabd
  - prompt: कृष्ण कहते हैं कि वे दिन भर कहाँ रहते हैं?
    options:
    - वन में गायें चराते हुए
    - पाठशाला में
    - बाज़ार में
    answer: वन में गायें चराते हुए
    difficulty: 1
    hints:
    - वे ग्वाल-बाल थे।
    - गायों के साथ वे कहाँ जाते थे?
    solution: 'चरण 1: ग्वाले गायें चराने जाते हैं। चरण 2: कृष्ण कहते हैं वे दिन भर वन में थे।'
    mistakes:
      पाठशाला में: c6h9_bahana
      बाज़ार में: c6h9_bahana
  - prompt: '''नहिं'' शब्द का आज की हिंदी में रूप क्या है?'
    options:
    - नहीं
    - नया
    - नाम
    answer: नहीं
    difficulty: 1
    hints:
    - कृष्ण मना कर रहे हैं।
    - यह 'हाँ' का उल्टा है।
    solution: 'चरण 1: कृष्ण कह रहे हैं उन्होंने नहीं खाया। चरण 2: नहिं = नहीं।'
    mistakes:
      नया: c6h9_shabd
      नाम: c6h9_shabd
  - prompt: कृष्ण के बहाने किस बात को दिखाते हैं?
    options:
    - बच्चे की भोली चतुराई
    - बड़ों का गुस्सा
    - राजा की वीरता
    answer: बच्चे की भोली चतुराई
    difficulty: 2
    hints:
    - एक छोटा बच्चा पकड़े जाने पर क्या करता है?
    - बहाने प्यारे हैं, डरावने नहीं।
    solution: 'चरण 1: कृष्ण बचने के लिए मासूम बहाने बनाते हैं। चरण 2: यह बच्चे की भोली चतुराई है।'
    mistakes:
      बड़ों का गुस्सा: c6h9_bhav
      राजा की वीरता: c6h9_bhav
  - prompt: कृष्ण के अनुसार ग्वाल-बाल ऐसा क्यों करते हैं?
    options:
    - वे उनसे बैर रखते हैं
    - वे उन्हें इनाम देना चाहते हैं
    - वे भूखे हैं
    answer: वे उनसे बैर रखते हैं
    difficulty: 2
    hints:
    - कृष्ण दोस्तों को दोषी बताते हैं।
    - '''बैर'' का अर्थ है दुश्मनी।'
    solution: 'चरण 1: कृष्ण कहते हैं दोस्तों ने माखन लगाया। चरण 2: कारण वे बताते हैं: दोस्त उनसे बैर रखते हैं।'
    mistakes:
      वे उन्हें इनाम देना चाहते हैं: c6h9_bahana
      वे भूखे हैं: c6h9_bahana
  - prompt: सूरदास का यह पद किस काल का है?
    options:
    - भक्ति काल
    - आधुनिक काल
    - वीरगाथा काल
    answer: भक्ति काल
    difficulty: 2
    hints:
    - सूरदास, तुलसीदास, मीराबाई इसी समय के कवि थे।
    - इस समय के कवि भगवान की भक्ति के गीत लिखते थे।
    solution: 'चरण 1: सूरदास कृष्ण-भक्ति के कवि थे। चरण 2: वे भक्ति काल के कवि हैं।'
    mistakes:
