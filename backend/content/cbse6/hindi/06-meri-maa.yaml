subject: cbse6-hin
chapter: 6
title: मेरी माँ (आत्मकथा-अंश)
tips:
  h6_atmakatha: "बिस्मिल अपने ही जीवन के बारे में लिख रहे हैं।"
  h6_bismil: "बिस्मिल काकोरी कांड से जुड़े थे और देश की आज़ादी के लिए लड़े।"
  h6_padhna: "माँ ने घर के काम के बाद समय निकालकर अक्षर सीखे।"
  h6_pahli_guru: "बिस्मिल कहते हैं माँ ने उन्हें सबसे पहले अच्छे संस्कार सिखाए।"

concepts:
- code: cbse6h.m6.maa
  title: मेरी माँ (आत्मकथा-अंश)
  notes: |
    लेखक: राम प्रसाद 'बिस्मिल', स्वतंत्रता सेनानी और क्रांतिकारी (काकोरी कांड, 1925)। अपनी आत्मकथा के इस अंश में वे
    अपनी माँ के बारे में बताते हैं: माँ की शादी कम उम्र में हुई थी और वे पढ़ी-लिखी नहीं थीं, पर उन्होंने स्वयं पढ़ना
    सीखा। उन्होंने बेटे को धर्म, सच्चाई और अच्छे संस्कार दिए, उसकी पढ़ाई और देश-सेवा में साथ दिया, और कठिन समय में
    हिम्मत दी। बिस्मिल अपने जीवन की हर अच्छाई का श्रेय माँ को देते हैं और कहते हैं कि माँ ही उनकी पहली गुरु थीं।
    संदेश: माँ का प्रेम, त्याग और मार्गदर्शन जीवन बनाता है।
  explanations:
    text: क्रांतिकारी राम प्रसाद बिस्मिल अपनी माँ के बारे में लिखते हैं। माँ ने खुद पढ़ना सीखा, बेटे को सच्चाई और अच्छे संस्कार सिखाए, और देश-सेवा के रास्ते पर उसका साथ दिया। बिस्मिल माँ को अपनी पहली गुरु मानते हैं।
    visual: 'कल्पना कीजिए: दीये की रोशनी में किताब पढ़ना सीखती एक माँ, और पास बैठा उसका बेटा, जो आगे चलकर देश के लिए लड़ा।'
    step_by_step: '1. लेखक पहचानें: बिस्मिल। 2. माँ के गुण खोजें: पढ़ना सीखा, संस्कार दिए। 3. माँ ने बेटे का साथ कैसे दिया। 4. बिस्मिल माँ को क्या मानते हैं। 5. संदेश लिखें।'
    real_world: बहुत-से महान लोग, जैसे शिवाजी (माता जीजाबाई), अपनी सफलता का श्रेय अपनी माँ को देते हैं।
  picture:
    kind: compare
    columns:
    - title: माँ ने क्या किया
      points:
      - खुद पढ़ना सीखा
      - सच्चाई और संस्कार सिखाए
      - देश-सेवा में साथ दिया
    - title: बिस्मिल ने क्या माना
      points:
      - माँ पहली गुरु
      - हर अच्छाई का श्रेय माँ को
      - माँ का प्रेम सबसे बड़ा
    alt: माँ ने खुद पढ़ना सीखा, संस्कार दिए और देश-सेवा में साथ दिया; बिस्मिल माँ को पहली गुरु मानते हैं।
  activity:
    type: sort
    prompt: बिस्मिल की माँ ने खुद क्या किया, और बेटे को क्या दिया?
    bins:
    - माँ ने खुद किया
    - बेटे को दिया
    items:
    - label: स्वयं पढ़ना सीखा
      bin: माँ ने खुद किया
      clue: पढ़ी-लिखी न होकर भी माँ ने क्या किया?
      why: माँ ने अपने आप पढ़ना सीखा।
    - label: धर्म और सच्चाई के संस्कार
      bin: बेटे को दिया
      clue: बिस्मिल की अच्छाइयाँ कहाँ से आईं?
      why: माँ के दिए संस्कार।
    - label: देश-सेवा में साथ
      bin: बेटे को दिया
      clue: क्रांतिकारी बेटे का साथ किसने दिया?
      why: माँ ने बेटे का साथ दिया।
    - label: कठिन समय में हिम्मत
      bin: बेटे को दिया
      clue: मुश्किल में सहारा किसने दिया?
      why: माँ की दी हिम्मत।
  items:
  - prompt: '''मेरी माँ'' पाठ के लेखक कौन हैं?'
    options:
    - राम प्रसाद 'बिस्मिल'
    - प्रेमचंद
    - सुदर्शन
    - दिनकर
    answer: राम प्रसाद 'बिस्मिल'
    difficulty: 1
    hints:
    - क्रांतिकारी।
    - '''सरफ़रोशी की तमन्ना''।'
    solution: पाठ राम प्रसाद बिस्मिल की आत्मकथा से है।
    mistakes:
      प्रेमचंद: hin6_read_again
  - prompt: यह पाठ किस विधा का है?
    options:
    - आत्मकथा
    - कविता
    - नाटक
    - पत्र
    answer: आत्मकथा
    difficulty: 1
    hints:
    - लेखक अपने जीवन के बारे में।
    - '''आत्म'' = अपना।'
    solution: यह आत्मकथा का अंश है।
    mistakes: {"कविता": "h6_atmakatha"}
  - prompt: बिस्मिल की माँ ने स्वयं क्या सीखा?
    options:
    - पढ़ना
    - घुड़सवारी
    - तलवार चलाना
    - गाड़ी चलाना
    answer: पढ़ना
    difficulty: 1
    hints:
    - पहले पढ़ी-लिखी नहीं थीं।
    - अक्षर।
    solution: उन्होंने खुद पढ़ना सीखा।
    mistakes: {"तलवार चलाना": "h6_padhna"}
  - prompt: बिस्मिल किस रूप में प्रसिद्ध हैं?
    options:
    - स्वतंत्रता सेनानी और क्रांतिकारी
    - खिलाड़ी
    - वैज्ञानिक
    - अभिनेता
    answer: स्वतंत्रता सेनानी और क्रांतिकारी
    difficulty: 1
    hints:
    - काकोरी।
    - आज़ादी की लड़ाई।
    solution: वे क्रांतिकारी स्वतंत्रता सेनानी थे।
    mistakes: {"खिलाड़ी": "h6_bismil"}
  - prompt: बिस्मिल अपनी माँ को क्या मानते हैं?
    options:
    - अपनी पहली गुरु
    - एक अजनबी
    - केवल रसोइया
    - अपनी दुश्मन
    answer: अपनी पहली गुरु
    difficulty: 2
    hints:
    - सीख देने वाली।
    - गुरु।
    solution: वे माँ को अपनी पहली गुरु मानते हैं।
    mistakes: {"केवल रसोइया": "h6_pahli_guru"}
  - prompt: इस पाठ का मुख्य संदेश क्या है?
    options:
    - माँ का प्रेम और मार्गदर्शन जीवन को बनाता है
    - माँ की बात नहीं माननी चाहिए
    - पढ़ाई ज़रूरी नहीं
    - देश-सेवा बेकार है
    answer: माँ का प्रेम और मार्गदर्शन जीवन को बनाता है
    difficulty: 2
    hints:
    - पूरे पाठ को देखें।
    - श्रेय।
    solution: माँ के संस्कार और साथ ने बिस्मिल का जीवन बनाया।
    mistakes:
      माँ की बात नहीं माननी चाहिए: hin6_whole
