    - वैज्ञानिक
    - अभिनेता
    answer: स्वतंत्रता सेनानी और क्रांतिकारी
    difficulty: 1
    hints:
    - काकोरी।
    - आज़ादी की लड़ाई।
    solution: वे क्रांतिकारी स्वतंत्रता सेनानी थे।
    mistakes: {"खिलाड़ी": "h6_bismil"}
  - prompt: बिस्मिल अपनी माँ को क्या मानते हैं?
    options:
    - अपनी पहली गुरु
    - एक अजनबी
    - केवल रसोइया
    - अपनी दुश्मन
    answer: अपनी पहली गुरु
    difficulty: 2
    hints:
    - सीख देने वाली।
    - गुरु।
    solution: वे माँ को अपनी पहली गुरु मानते हैं।
    mistakes: {"केवल रसोइया": "h6_pahli_guru"}
  - prompt: इस पाठ का मुख्य संदेश क्या है?
    options:
    - माँ का प्रेम और मार्गदर्शन जीवन को बनाता है
    - माँ की बात नहीं माननी चाहिए
    - पढ़ाई ज़रूरी नहीं
    - देश-सेवा बेकार है
    answer: माँ का प्रेम और मार्गदर्शन जीवन को बनाता है
    difficulty: 2
    hints:
    - पूरे पाठ को देखें।
    - श्रेय।
    solution: माँ के संस्कार और साथ ने बिस्मिल का जीवन बनाया।
    mistakes:
      माँ की बात नहीं माननी चाहिए: hin6_whole
  - prompt: बिस्मिल किस घटना से जुड़े थे?
    options:
    - काकोरी कांड
    - दांडी यात्रा
    - पानीपत का युद्ध
    answer: काकोरी कांड
    difficulty: 2
    hints:
    - यह 1925 में हुई क्रांतिकारी घटना थी।
    - इसमें अंग्रेज़ों का खज़ाना ले जा रही रेल रोकी गई थी।
    solution: 'चरण 1: बिस्मिल क्रांतिकारी थे। चरण 2: वे 1925 के काकोरी कांड से जुड़े थे।'
    mistakes:
      दांडी यात्रा: c6h6_lekhak
      पानीपत का युद्ध: c6h6_lekhak
  - prompt: बिस्मिल की माँ की शादी कब हुई थी?
    options:
    - कम उम्र में
    - बहुत बड़ी उम्र में
    - पढ़ाई पूरी करने के बाद
    answer: कम उम्र में
    difficulty: 1
    hints:
    - इसी कारण वे पढ़ नहीं पाई थीं।
    - उस समय छोटी उम्र में शादियाँ होती थीं।
    solution: 'चरण 1: पाठ बताता है कि उनकी पढ़ाई नहीं हो पाई थी। चरण 2: उनकी शादी कम उम्र में हुई थी।'
    mistakes:
      बहुत बड़ी उम्र में: c6h6_maa
      पढ़ाई पूरी करने के बाद: c6h6_maa
  - prompt: माँ ने बेटे को कौन-सी बात सिखाई?
    options:
    - सच बोलना और अच्छे संस्कार
    - झूठ बोलना
    - आलस करना
    answer: सच बोलना और अच्छे संस्कार
    difficulty: 1
    hints:
    - माँ उनकी पहली गुरु थीं।
    - गुरु अच्छी बातें सिखाता है।
    solution: 'चरण 1: माँ गुरु की तरह थीं। चरण 2: उन्होंने सच्चाई और अच्छे संस्कार सिखाए।'
    mistakes:
      झूठ बोलना: c6h6_maa
      आलस करना: c6h6_maa
  - prompt: माँ का स्वयं पढ़ना सीखना उनके किस गुण को दिखाता है?
    options:
    - लगन और सीखने की इच्छा
    - आलस
    - डर
    answer: लगन और सीखने की इच्छा
    difficulty: 2
    hints:
    - बिना स्कूल के पढ़ना सीखना आसान नहीं।
    - इसके लिए मेहनत और चाह चाहिए।
    solution: 'चरण 1: उन्होंने कठिनाई में भी पढ़ना सीखा। चरण 2: यह उनकी लगन दिखाता है।'
    mistakes:
      आलस: c6h6_bhav
      डर: c6h6_bhav
  - prompt: देश-सेवा के काम में माँ ने बेटे का कैसे साथ दिया?
    options:
    - हिम्मत बढ़ाकर और समर्थन देकर
    - उसे घर में बंद करके
    - उससे बात बंद करके
    answer: हिम्मत बढ़ाकर और समर्थन देकर
    difficulty: 2
    hints:
    - कठिन समय में माँ ने क्या दिया?
    - वे बेटे के रास्ते में रुकावट नहीं बनीं।
    solution: 'चरण 1: माँ बेटे के काम पर गर्व करती थीं। चरण 2: उन्होंने हिम्मत और समर्थन दिया।'
    mistakes:
      उसे घर में बंद करके: c6h6_maa
      उससे बात बंद करके: c6h6_maa
  - prompt: '''श्रेय देना'' का अर्थ क्या है?'
    options:
    - किसी अच्छे काम का कारण उसे मानना
    - किसी को दोष देना
    - किसी को पैसे देना
    answer: किसी अच्छे काम का कारण उसे मानना
    difficulty: 3
    hints:
    - जीतने वाला खिलाड़ी कहता है, 'यह मेरे कोच की वजह से है।'
    - यह धन्यवाद जैसा भाव है।
    solution: 'चरण 1: श्रेय = अच्छे काम का मान। चरण 2: बिस्मिल अपनी अच्छाई का कारण माँ को मानते हैं।'
    mistakes:
      किसी को दोष देना: c6h6_shabd
      किसी को पैसे देना: c6h6_shabd
  - prompt: इस पाठ में बिस्मिल के मन में माँ के लिए कौन-सा भाव है?
    options:
    - गहरा आदर और कृतज्ञता
    - नाराज़गी
    - उदासीनता
    answer: गहरा आदर और कृतज्ञता
    difficulty: 2
    hints:
    - वे माँ को अपनी पहली गुरु कहते हैं।
    - जिसके हम आभारी हों, उसके लिए कैसा मन होता है?
