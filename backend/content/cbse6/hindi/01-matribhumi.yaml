subject: cbse6-hin
chapter: 1
title: मातृभूमि (कविता)
tips:
  hin6_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है: उस पात्र या घटना वाला हिस्सा खोजें।'
  hin6_poem_meaning: 'कविता की बात के पीछे का भाव समझें: यह चित्र जीवन की किस बात की ओर इशारा करता है?'
  hin6_whole: 'पूरे पाठ के बारे में सोचें, केवल एक पंक्ति के बारे में नहीं: शुरुआत से अंत तक क्या बदलता है?'
  h6_aakash: "सागर नीचे है। आकाश तक कौन-सी ऊँची चीज़ पहुँचती है?"
  h6_charan: "चरण नीचे होते हैं। देश के दक्षिण में कौन उन्हें धोता है?"
  h6_matribhumi: "'मातृ' का अर्थ माँ है और 'भूमि' का अर्थ धरती।"
  c6h1_chitra: 'कविता में प्रकृति के चित्र खोजो: ऊपर क्या है, नीचे क्या है, बीच में क्या बहता है?'
  c6h1_bhav: 'सोचो कि कवि अपने देश के लिए कैसा मन रखते हैं: वे शिकायत कर रहे हैं या आदर दिखा रहे हैं?'
  c6h1_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ कविता से मेल खाए, वही चुनो।
  c6h1_log: कवि बताते हैं कि यह भूमि किन महान लोगों की है। उनके गुणों पर ध्यान दो।
concepts:
- code: cbse6h.m1.matribhumi
  title: मातृभूमि (कविता)
  notes: |
    कवि: सोहनलाल द्विवेदी। देशप्रेम की कविता। कवि भारत माता का सुंदर चित्र खींचते हैं: ऊँचा हिमालय आकाश को चूमता है,
    गंगा-यमुना जैसी नदियाँ बहती हैं, सागर उसके चरण धोता है, हरे-भरे खेत और वन हैं। यह भूमि वीरों, ऋषियों और
    महापुरुषों की है। कवि इस मातृभूमि को प्रणाम करते हैं और उसके लिए प्रेम और गर्व जगाते हैं।
    संदेश: अपनी मातृभूमि से प्रेम करें, उसकी प्रकृति और परंपरा पर गर्व करें।
  explanations:
    text: 'इस कविता में कवि भारत माता की सुंदरता बताते हैं: ऊँचा हिमालय, बहती नदियाँ, चरण धोता सागर और हरे-भरे खेत। यह वीरों और ऋषियों की धरती है। कवि इस मातृभूमि को प्रणाम करते हैं।'
    visual: 'भारत का नक्शा सोचिए: ऊपर बर्फ़ से ढका हिमालय जैसे मुकुट, बीच में बहती गंगा, नीचे तीन ओर लहराता सागर जो जैसे पैर धो रहा हो।'
    step_by_step: '1. कवि और विषय पहचानें: देशप्रेम। 2. प्रकृति के चित्र खोजें: हिमालय, नदियाँ, सागर। 3. भूमि के लोगों के बारे में देखें: वीर, ऋषि। 4. कवि का भाव लिखें: प्रणाम और गर्व।'
    real_world: स्कूल की प्रार्थना-सभा में राष्ट्रगान गाते समय हम भी वही गर्व महसूस करते हैं जो इस कविता में है।
  picture:
    kind: compare
    columns:
    - title: प्रकृति
      points:
      - हिमालय (मुकुट जैसा)
      - गंगा-यमुना
      - चरण धोता सागर
    - title: लोग
      points:
      - वीर
      - ऋषि
      - महापुरुष
    alt: कविता में प्रकृति के चित्र हिमालय, गंगा-यमुना और सागर हैं; यह भूमि वीरों, ऋषियों और महापुरुषों की है।
  activity:
    type: sort
    prompt: कविता में मातृभूमि का कौन-सा अंश कहाँ है?
    bins:
    - सिर पर (उत्तर)
    - चरणों में (दक्षिण)
    - धरती पर
    items:
    - label: आकाश को चूमता हिमालय
      bin: सिर पर (उत्तर)
      clue: भारत के सबसे ऊपर क्या है?
      why: हिमालय उत्तर में, सिर पर।
    - label: चरण धोता सागर
      bin: चरणों में (दक्षिण)
      clue: सागर माँ के कौन-से अंग धोता है?
      why: दक्षिण में सागर, चरणों में।
    - label: गंगा-यमुना
      bin: धरती पर
      clue: नदियाँ कहाँ बहती हैं?
      why: मैदानों में बहती नदियाँ।
    - label: हरे-भरे खेत और वन
      bin: धरती पर
      clue: ये धरती को कैसे सजाते हैं?
      why: धरती की हरियाली।
  lesson:
    - teach: '''मातृभूमि'' सोहनलाल द्विवेदी की देशप्रेम की कविता है। ''मातृ'' का अर्थ माँ और ''भूमि'' का अर्थ धरती। कवि अपने देश को माँ की तरह देखते हैं और उसे प्रणाम करते हैं।'
      check:
        prompt: कवि अपने देश को किस रूप में देखते हैं?
        options:
        - माँ के रूप में
        - राजा के रूप में
        - मित्र के रूप में
        answer: माँ के रूप में
        why: '''मातृभूमि'' शब्द में ही माँ छिपी है।'
    - teach: 'कवि भारत का सुंदर चित्र बनाते हैं: ऊँचा हिमालय जैसे आकाश को चूमता है, गंगा-यमुना जैसी नदियाँ बहती हैं, सागर जैसे माँ के चरण धोता है, और खेत-वन हरे-भरे हैं।'
      picture:
        kind: flow
        steps:
        - 'ऊपर: आकाश चूमता हिमालय'
        - 'बीच: बहती गंगा-यमुना'
        - 'धरती: हरे खेत और वन'
        - 'नीचे: चरण धोता सागर'
        alt: कविता का चित्र ऊपर हिमालय से नीचे सागर तक चलता है।
      check:
        prompt: कविता में नदियाँ कौन-सी बताई गई हैं?
        options:
        - गंगा-यमुना
        - नील-अमेज़न
        - टेम्स-राइन
        answer: गंगा-यमुना
        why: कवि भारत की नदियों का चित्र देते हैं।
    - teach: यह भूमि केवल सुंदर ही नहीं, वीरों, ऋषियों और महापुरुषों की भी है। इसलिए कवि को इस पर गर्व है। कविता हमें अपनी धरती, उसकी प्रकृति और परंपरा से प्रेम करना सिखाती है।
      check:
        prompt: कवि के मन में मातृभूमि के लिए कौन-सा भाव है?
        options:
        - प्रेम और गर्व
        - डर
        - ऊब
        answer: प्रेम और गर्व
        why: कवि प्रणाम करते हैं और गर्व करते हैं।
  items:
  - prompt: '''मातृभूमि'' कविता के कवि कौन हैं?'
    options:
    - सोहनलाल द्विवेदी
    - सूरदास
    - रहीम
    - प्रेमचंद
    answer: सोहनलाल द्विवेदी
    difficulty: 1
    hints:
    - देशप्रेम के कवि।
    - राष्ट्रीय कविताएँ।
    solution: कविता सोहनलाल द्विवेदी की है।
    mistakes:
      प्रेमचंद: hin6_read_again
  - prompt: '''मातृभूमि'' का अर्थ है:'
    options:
    - माँ जैसी अपनी जन्मभूमि
    - विदेश
    - जंगल
    - पहाड़
    answer: माँ जैसी अपनी जन्मभूमि
    difficulty: 1
    hints:
    - मातृ = माँ।
    - भूमि = धरती।
    solution: मातृभूमि वह भूमि है जहाँ हमने जन्म लिया, जो माँ के समान है।
    mistakes: {"विदेश": "h6_matribhumi"}
  - prompt: कविता में आकाश को कौन चूमता है?
    options:
    - हिमालय
    - सागर
    - गंगा
    - खेत
    answer: हिमालय
    difficulty: 1
    hints:
    - सबसे ऊँचा।
    - उत्तर में।
    solution: ऊँचा हिमालय आकाश को चूमता है।
    mistakes: {"सागर": "h6_aakash"}
  - prompt: कविता में मातृभूमि के चरण कौन धोता है?
    options:
    - सागर
    - बादल
    - हिमालय
    - किसान
    answer: सागर
    difficulty: 1
    hints:
    - दक्षिण में।
    - तीन ओर पानी।
    solution: सागर मातृभूमि के चरण धोता है।
    mistakes: {"हिमालय": "h6_charan"}
  - prompt: कविता का मुख्य भाव क्या है?
    options:
    - देशप्रेम और गर्व
    - दुख
    - हास्य
    - डर
    answer: देशप्रेम और गर्व
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - प्रणाम।
    solution: कविता देशप्रेम और गर्व जगाती है।
    mistakes:
      हास्य: hin6_poem_meaning
  - prompt: '''सागर चरण धोता है'' कहकर कवि क्या दिखाना चाहते हैं?'
    options:
    - प्रकृति भी मातृभूमि का आदर करती है
    - सागर गंदा है
    - लोग नहाते हैं
    - पानी कम है
    answer: प्रकृति भी मातृभूमि का आदर करती है
    difficulty: 2
    hints:
    - चरण धोना = आदर।
    - मानवीकरण।
    solution: जैसे बड़ों के चरण धोकर आदर करते हैं, वैसे ही सागर मातृभूमि का आदर करता है।
    mistakes:
      सागर गंदा है: hin6_poem_meaning
  - prompt: '''मातृभूमि'' शब्द में ''मातृ'' का अर्थ क्या है?'
    options:
    - माँ
    - पिता
    - मित्र
    answer: माँ
    difficulty: 1
    hints:
    - '''मातृ'' शब्द ''माता'' से बना है।'
    - मातृभाषा भी इसी से बना शब्द है।
    solution: 'चरण 1: ''मातृ'' = माता। चरण 2: मातृभूमि = माँ जैसी धरती।'
    mistakes:
      पिता: c6h1_shabd
      मित्र: c6h1_shabd
  - prompt: '''हिमालय आकाश को चूमता है'' से कवि क्या बताना चाहते हैं?'
    options:
    - हिमालय बहुत ऊँचा है
    - हिमालय छोटा है
    - आकाश नीचे आ गया है
    answer: हिमालय बहुत ऊँचा है
    difficulty: 2
    hints:
    - चूमने के लिए पास तक पहुँचना पड़ता है।
    - पहाड़ आकाश तक कब पहुँचता है?
    solution: 'चरण 1: आकाश बहुत ऊपर है। चरण 2: जो उसे चूमे, वह बहुत ऊँचा होगा।'
    mistakes:
      हिमालय छोटा है: c6h1_chitra
      आकाश नीचे आ गया है: c6h1_chitra
  - prompt: कविता के अनुसार यह भूमि किनकी है?
    options:
    - वीरों, ऋषियों और महापुरुषों की
    - केवल राजाओं की
    - केवल व्यापारियों की
    answer: वीरों, ऋषियों और महापुरुषों की
    difficulty: 1
    hints:
    - कवि महान लोगों की बात करते हैं।
    - साहसी लोग और ज्ञानी लोग, दोनों।
    solution: 'चरण 1: कवि साहसी और ज्ञानी लोगों को याद करते हैं। चरण 2: यह भूमि वीरों, ऋषियों और महापुरुषों की है।'
    mistakes:
      केवल राजाओं की: c6h1_log
      केवल व्यापारियों की: c6h1_log
  - prompt: कविता किस विषय पर है?
    options:
    - देशप्रेम
    - खेल
    - विज्ञान
    answer: देशप्रेम
    difficulty: 1
    hints:
    - कवि अपनी धरती को प्रणाम करते हैं।
    - यह भावना देश के लिए है।
    solution: 'चरण 1: कवि भारत की सुंदरता और महानता बताते हैं। चरण 2: यह देशप्रेम की कविता है।'
    mistakes:
      खेल: c6h1_bhav
      विज्ञान: c6h1_bhav
  - prompt: '''प्रणाम'' शब्द का अर्थ क्या है?'
    options:
    - आदर से नमस्कार
    - गुस्सा
    - विदाई का गीत
    answer: आदर से नमस्कार
    difficulty: 2
    hints:
    - हम बड़ों को पैर छूकर क्या करते हैं?
    - यह आदर दिखाने का तरीका है।
    solution: 'चरण 1: प्रणाम आदर का भाव है। चरण 2: इसका अर्थ आदर से नमस्कार है।'
    mistakes:
      गुस्सा: c6h1_shabd
      विदाई का गीत: c6h1_shabd
  - prompt: कविता में हिमालय की तुलना किससे करना ठीक लगता है?
    options:
    - माँ के मुकुट से
    - माँ के चरणों से
    - माँ की चप्पल से
    answer: माँ के मुकुट से
    difficulty: 2
    hints:
    - हिमालय भारत में सबसे ऊपर है।
    - सिर पर क्या पहना जाता है?
    solution: 'चरण 1: हिमालय उत्तर में, सबसे ऊपर है। चरण 2: सिर पर मुकुट होता है।'
    mistakes:
      माँ के चरणों से: c6h1_chitra
      माँ की चप्पल से: c6h1_chitra
  - prompt: '''हरे-भरे'' शब्द किसकी विशेषता बताता है?'
    options:
    - खेत और वन
    - सागर की लहरें
    - बर्फ़ीले पहाड़
    answer: खेत और वन
    difficulty: 2
    hints:
    - हरा रंग पेड़-पौधों का होता है।
    - फ़सलें और पेड़ कहाँ होते हैं?
    solution: 'चरण 1: हरापन पौधों से आता है। चरण 2: कविता में खेत और वन हरे-भरे हैं।'
    mistakes:
      सागर की लहरें: c6h1_chitra
      बर्फ़ीले पहाड़: c6h1_chitra
  - prompt: इस कविता को पढ़कर हमें क्या करने की प्रेरणा मिलती है?
    options:
    - अपनी धरती से प्रेम करना और उसकी रक्षा करना
    - दूसरे देश चले जाना
    - प्रकृति को अनदेखा करना
    answer: अपनी धरती से प्रेम करना और उसकी रक्षा करना
    difficulty: 3
    hints:
    - कवि जिस चीज़ पर गर्व करते हैं, उसका हम क्या करें?
    - प्रेम हो तो हम उसका ध्यान रखते हैं।
    solution: 'चरण 1: कवि धरती की सुंदरता और महानता दिखाते हैं। चरण 2: इससे हमें उससे प्रेम करने और उसे बचाने की प्रेरणा मिलती है।'
    mistakes:
      दूसरे देश चले जाना: c6h1_bhav
      प्रकृति को अनदेखा करना: c6h1_bhav
  - prompt: मातृभूमि को 'माँ' कहना कैसा प्रयोग है?
    options:
    - धरती को माँ की तरह मानना
