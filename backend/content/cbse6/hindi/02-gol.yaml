title: गोल (संस्मरण)
tips:
  h6_badla: "ध्यानचंद ने गुस्से का जवाब खेल से दिया।"
  h6_gol_seekh: "ध्यानचंद ने लड़ाई नहीं की। उन्होंने क्या करके दिखाया?"
  h6_jadugar: "'उड़न सिख' धावक मिल्खा सिंह थे। ध्यानचंद गेंद को स्टिक से ऐसे चलाते थे जैसे जादू हो।"
  h6_khel_diwas: "15 अगस्त स्वतंत्रता दिवस है। खेल दिवस ध्यानचंद के जन्मदिन पर, उसी महीने के अंत में है।"
  c6h2_ghatna: 'संस्मरण की घटना को क्रम से याद करो: मैच, चोट, मैदान में वापसी, और फिर क्या हुआ।'
