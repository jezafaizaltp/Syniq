concepts:
- code: cbse6h.m2.gol
  title: गोल (संस्मरण)
  notes: |
    लेखक: मेजर ध्यानचंद, हॉकी के जादूगर। संस्मरण में वे अपने खेल-जीवन की एक घटना बताते हैं: एक मैच में विरोधी टीम के
    एक खिलाड़ी ने गुस्से में उनके सिर पर हॉकी स्टिक मार दी। ध्यानचंद ने बदले में लड़ाई नहीं की, बल्कि मैदान में लौटकर
    उसे कहा कि वे बदला लेंगे, और फिर एक के बाद एक गोल करके अपनी टीम को जिताया। यही उनका बदला था।
    वे कहते हैं कि सफलता का राज़ अभ्यास, लगन और टीम-भावना है; जीत पूरी टीम की होती है। वे सेना में थे और साधारण
    परिवार से थे। उनके जन्मदिन 29 अगस्त को भारत में राष्ट्रीय खेल दिवस मनाया जाता है।
  explanations:
    text: 'हॉकी के जादूगर ध्यानचंद एक घटना बताते हैं: एक मैच में विरोधी खिलाड़ी ने गुस्से में उनके सिर पर स्टिक मार दी। उन्होंने लड़ाई नहीं की, बल्कि गोल पर गोल करके जवाब दिया। उनके अनुसार सफलता का राज़ है अभ्यास, लगन और टीम-भावना।'
    visual: 'हॉकी का मैदान सोचिए: सिर पर पट्टी बाँधे ध्यानचंद, गेंद को स्टिक से चिपकाए दौड़ते हुए, और गोलपोस्ट में गेंद जाते ही तालियाँ बजाते दर्शक।'
    step_by_step: '1. लेखक पहचानें: ध्यानचंद। 2. घटना समझें: स्टिक की चोट। 3. उनका जवाब देखें: गोल करके बदला। 4. उनकी सफलता का राज़ लिखें। 5. संदेश: खेल-भावना।'
    real_world: हर साल 29 अगस्त को, ध्यानचंद के जन्मदिन पर, भारत में राष्ट्रीय खेल दिवस मनाया जाता है।
  picture:
    kind: flow
    steps:
    - मैच चल रहा है
    - विरोधी ने स्टिक मारी
    - ध्यानचंद ने लड़ाई नहीं की
    - गोल पर गोल किए
    - यही था उनका बदला
    alt: 'घटना का क्रम: मैच में विरोधी ने स्टिक मारी, ध्यानचंद ने लड़ाई नहीं की और गोल करके बदला लिया।'
  activity:
    type: order
    prompt: ध्यानचंद के 'बदले' की घटना क्रम से लगाओ।
    steps:
    - विरोधी खिलाड़ी गुस्से में सिर पर स्टिक मारता है
    - ध्यानचंद लड़ाई नहीं करते
    - मैदान में लौटकर कहते हैं, बदला लूँगा
    - एक के बाद एक गोल करके टीम जिताते हैं
    reasons:
      ध्यानचंद लड़ाई नहीं करते: चोट लगने के बाद ही बदले का सवाल उठा।
      मैदान में लौटकर कहते हैं, बदला लूँगा: लड़ने के बजाय वे खेल में लौटे।
      एक के बाद एक गोल करके टीम जिताते हैं: यही उनका कहा हुआ बदला था।
  items:
  - prompt: ध्यानचंद किस खेल के लिए प्रसिद्ध हैं?
    options:
    - हॉकी
    - क्रिकेट
    - फ़ुटबॉल
    - कबड्डी
    answer: हॉकी
    difficulty: 1
    hints:
    - स्टिक और गेंद।
    - हॉकी के जादूगर।
    solution: ध्यानचंद हॉकी के महान खिलाड़ी थे।
    mistakes:
      क्रिकेट: hin6_read_again
  - prompt: ध्यानचंद को किस नाम से पुकारा जाता है?
    options:
    - हॉकी का जादूगर
    - उड़न सिख
    - क्रिकेट का भगवान
    - लिटिल मास्टर
    answer: हॉकी का जादूगर
    difficulty: 1
    hints:
    - गेंद स्टिक से चिपकी रहती थी।
    - जादू।
    solution: उन्हें हॉकी का जादूगर कहते हैं।
    mistakes: {"उड़न सिख": "h6_jadugar"}
  - prompt: विरोधी खिलाड़ी के स्टिक मारने पर ध्यानचंद ने क्या किया?
    options:
    - गोल करके बदला लिया
    - उसे भी स्टिक मारी
    - खेल छोड़ दिया
    - रोने लगे
    answer: गोल करके बदला लिया
    difficulty: 1
    hints:
    - शीर्षक 'गोल'।
    - खेल से जवाब।
    solution: उन्होंने गोल पर गोल करके जवाब दिया।
    mistakes: {"उसे भी स्टिक मारी": "h6_badla"}
  - prompt: राष्ट्रीय खेल दिवस कब मनाया जाता है?
    options:
    - 29 अगस्त
    - 15 अगस्त
    - 2 अक्टूबर
    - 14 नवंबर
    answer: 29 अगस्त
    difficulty: 2
    hints:
    - ध्यानचंद का जन्मदिन।
    - अगस्त।
    solution: 29 अगस्त, ध्यानचंद के जन्मदिन पर।
    mistakes: {"15 अगस्त": "h6_khel_diwas"}
  - prompt: ध्यानचंद के अनुसार सफलता का राज़ क्या है?
    options:
    - अभ्यास, लगन और टीम-भावना
    - केवल भाग्य
    - महँगे जूते
    - विरोधी से लड़ना
    answer: अभ्यास, लगन और टीम-भावना
    difficulty: 2
    hints:
    - रोज़ मेहनत।
    - मिलकर खेलना।
    solution: अभ्यास, लगन और टीम-भावना से सफलता मिलती है।
    mistakes:
      केवल भाग्य: hin6_whole
  - prompt: इस संस्मरण से क्या सीख मिलती है?
    options:
    - गुस्से का जवाब अच्छे प्रदर्शन से दें, लड़ाई से नहीं
    - चोट लगे तो बदला लो
    - खेल में जीतना ही सब कुछ है
    - अकेले खेलना अच्छा है
    answer: गुस्से का जवाब अच्छे प्रदर्शन से दें, लड़ाई से नहीं
    difficulty: 2
    hints:
