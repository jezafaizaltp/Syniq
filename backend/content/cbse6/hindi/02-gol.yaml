    - घाव पर कुछ बाँधा जाता है।
    solution: 'चरण 1: उन्होंने झगड़ा नहीं किया। चरण 2: पट्टी बँधवाकर वे फिर खेलने आ गए।'
    mistakes:
      घर चले गए: c6h2_ghatna
      विरोधी से झगड़ा किया: c6h2_ghatna
