# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 9. Format: content/README.md.
subject: cbse6-sci
chapter: 9
title: Methods of Separation in Everyday Life
tips:
  c6s_filter_dissolve: Filtration removes only insoluble particles. Dissolved salt passes through the filter; use evaporation to get it back.
  t6_churning: "Butter is separated by stirring curd fast for a long time."
  t6_condensation: "Vapour turning back to water on a cold surface is condensation."
  t6_evaporation_salt: "Salt is dissolved. Heating away the water leaves it behind."
  t6_filter_first: "First remove the sand by filtering; the salt is still dissolved in the water."
  t6_filtration: "A strainer lets liquid through and holds back solids."
  t6_handpicking: "Picking out stones by hand is handpicking."
  t6_magnet: "Iron is attracted by a magnet; sand isn't."
  t6_sedimentation: "Heavier particles settling to the bottom is sedimentation."
  t6_threshing: "Beating stalks to free the grain is threshing."
  t6_why_separate: "We separate mixtures to remove what we don't want or get what we do."
  t6_winnowing: "Wind blows away the lighter husk. That's winnowing."
concepts:
- code: cbse6s.sep.methods
  title: Simple ways to separate mixtures
  notes: |
    Mixtures are separated to remove unwanted parts or harmful things, or to get a useful part. Handpicking (stones from
    rice), threshing (grain from stalks by beating), winnowing (wind blows away light husk), sieving (different-sized
    particles: flour bran), sedimentation (heavy particles settle), decantation (pour off the liquid), filtration
    (filter paper or cloth stops insoluble particles), magnetic separation (iron from sand).
  explanations:
    text: We separate mixtures to remove what we don't want or to get what we need. Pick stones out of rice by hand. Use wind to blow away light husk (winnowing). Use a sieve for different-sized bits. Let mud settle and pour off the water, or pour it through a filter.
    visual: 'Picture muddy water in a glass. Leave it: mud sinks to the bottom (sedimentation). Gently pour the cleaner water into another glass (decantation). Pour it through filter paper to catch fine dirt (filtration).'
    step_by_step: 'Step 1: Look at how the parts differ: size, weight, magnetism, dissolving. Step 2: Choose the method that uses that difference. Step 3: Separate. Step 4: Check whether another method is needed.'
    real_world: At home, tea is filtered through a strainer, rice is checked for small stones, and farmers winnow grain in the wind.
  picture:
    kind: compare
    columns:
    - title: Method
      points:
      - Winnowing
      - Sieving
      - Magnetic separation
    - title: Uses difference in
      points:
      - weight (wind)
      - particle size
      - magnetism
    - title: Example
      points:
      - husk from grain
      - bran from flour
      - iron from sand
    alt: Winnowing separates husk from grain by weight, sieving separates bran by size, and a magnet pulls iron out of sand.
  activity:
    type: sort
    prompt: Which way would you separate each mixture?
    bins:
    - Handpicking
    - Winnowing
    - Sieving
    - Using a magnet
    items:
    - label: Small stones from rice
      bin: Handpicking
      why: 'The stones are big enough to see and pick out: handpicking.'
      clue: Are the stones big enough to see and pick out?
    - label: Husk from grain
      bin: Winnowing
      why: 'Wind blows away the light husk: winnowing.'
      clue: Which is lighter, husk or grain? What could blow it away?
    - label: Bran from flour
      bin: Sieving
      why: 'The bran pieces are bigger than flour: sieving.'
      clue: Are the bran pieces bigger than flour?
    - label: Iron pins from sand
      bin: Using a magnet
      clue: What pulls iron but not sand?
      why: A magnet pulls out the iron pins.
    - label: Pebbles from sand
      bin: Sieving
      clue: Which is bigger? What lets small bits through?
      why: A sieve keeps pebbles and lets sand through.
    - label: Rotten tomatoes from good ones
      bin: Handpicking
      clue: Can you see which ones are bad?
      why: 'You can see them and pick them out: handpicking.'
  items:
  - prompt: 'Removing small stones from rice by hand is called:'
    options:
    - Handpicking
    - Winnowing
    - Filtration
    - Evaporation
    answer: Handpicking
    difficulty: 1
    hints:
    - Done with fingers.
    - Few, visible impurities.
    solution: This is handpicking.
    mistakes: {"Winnowing": "t6_handpicking", "Filtration": "t6_handpicking"}
  - prompt: 'Separating husk from grain using wind is called:'
    options:
    - Winnowing
    - Sieving
    - Threshing
    - Decantation
    answer: Winnowing
    difficulty: 1
    hints:
    - Light husk blows away.
    - Done from a height.
    solution: Winnowing uses wind.
    mistakes: {"Sieving": "t6_winnowing", "Threshing": "t6_winnowing"}
  - prompt: 'Tea leaves are removed from tea using a strainer. This is:'
    options:
    - Filtration
    - Evaporation
    - Handpicking
    - Winnowing
    answer: Filtration
    difficulty: 1
    hints:
    - The liquid passes through.
    - Solids stay behind.
    solution: A strainer filters out the leaves.
    mistakes: {"Evaporation": "t6_filtration", "Winnowing": "t6_filtration"}
  - prompt: 'Iron filings mixed with sand can be separated using:'
    options:
    - A magnet
    - A sieve
    - Water
    - Wind
    answer: A magnet
    difficulty: 1
    hints:
    - Iron is magnetic.
    - Sand is not.
    solution: A magnet attracts the iron.
    mistakes: {"A sieve": "t6_magnet", "Wind": "t6_magnet"}
  - prompt: 'Mud settling at the bottom of a glass of water is:'
    options:
    - Sedimentation
    - Condensation
    - Filtration
    - Threshing
    answer: Sedimentation
    difficulty: 2
    hints:
    - Heavy particles sink.
    - Then pour off the water.
    solution: Settling of heavy particles is sedimentation.
    mistakes: {"Condensation": "t6_sedimentation", "Threshing": "t6_sedimentation"}
  - prompt: 'Beating harvested stalks to remove the grain is:'
    options:
    - Threshing
    - Winnowing
    - Sieving
    - Decantation
    answer: Threshing
    difficulty: 2
    hints:
    - Done right after harvest.
    - Grain comes off the stalk.
    solution: This is threshing.
    mistakes: {"Winnowing": "t6_threshing", "Decantation": "t6_threshing"}
- code: cbse6s.sep.evap
  title: Evaporation, condensation and choosing a method
  after:
  - cbse6s.sep.methods
  notes: |
    Evaporation separates a dissolved solid from a liquid: heat salt water until water evaporates and salt remains (sea
    salt is made in salt pans in Gujarat and Tamil Nadu). Condensation recovers the water: cover with a cold plate and
    collect drops. Often several methods are needed in order: salt + sand + water: dissolve, filter (sand stays),
    evaporate (salt remains). Churning separates butter from curd.
  explanations:
    text: 'Some things dissolve, like salt in water, and a filter cannot catch them. To get the salt back, let the water evaporate: the salt is left behind. Sometimes you need several methods one after another, like dissolving, filtering and then evaporating.'
    visual: Heat a spoon of salty water over a candle. The water disappears as steam and white salt crystals are left on the spoon.
    step_by_step: 'Step 1: Is one part dissolved? If yes, filtering alone won''t work. Step 2: Remove insoluble parts first by filtering. Step 3: Evaporate to get the dissolved solid. Step 4: Condense the vapour to get the water back if needed.'
    real_world: Salt farmers let sea water evaporate in shallow salt pans under the sun; the salt is scraped up when the water has gone.
  picture:
    kind: flow
    steps:
    - Salt + sand + water
    - 'Filter: sand stays on paper'
    - Salty water passes through
    - Evaporate the water
    - Salt is left
    alt: 'To separate salt and sand: add water, filter out the sand, then evaporate the water to leave the salt.'
  activity:
    type: sort
    prompt: Which method gets the useful part out?
    bins:
    - Evaporation
    - Filtration
    - Sedimentation and decantation
    - Condensation
    items:
    - label: Salt from sea water
      bin: Evaporation
      why: 'Heat removes the water; salt stays behind: evaporation.'
      clue: If the water goes away, what stays behind?
    - label: Mud from muddy water
      bin: Filtration
      clue: What stops mud but lets water through?
      why: 'A filter paper holds back the mud: filtration.'
    - label: Letting sand settle, then pouring off the water
      bin: Sedimentation and decantation
      clue: It settles, then you pour. What are those steps called?
      why: Settling is sedimentation; pouring off is decantation.
    - label: Getting water back from steam
      bin: Condensation
      why: 'Cooling turns vapour into water drops: condensation.'
      clue: What happens when steam meets something cold?
    - label: Sand from sand and water
      bin: Filtration
      clue: What lets water through but holds the sand?
      why: 'Filter paper holds the sand: filtration.'
  items:
  - prompt: How is salt obtained from sea water?
    options:
    - Evaporation
    - Filtration
    - Magnetic separation
    - Winnowing
    answer: Evaporation
    difficulty: 1
    hints:
    - The water must go away.
    - Salt pans in the sun.
    solution: Sea water is evaporated to leave salt.
    mistakes: {"Filtration": "t6_evaporation_salt", "Winnowing": "t6_evaporation_salt"}
  - prompt: Can filtration separate salt from salt water?
    options:
    - No, dissolved salt passes through the filter
    - Yes, always
    - Only with a sieve
    - Only if the water is hot
    answer: No, dissolved salt passes through the filter
    difficulty: 2
    hints:
    - Salt is dissolved.
    - Particles are too tiny.
    solution: Dissolved salt goes through filter paper.
    mistakes:
      Yes, always: c6s_filter_dissolve
  - prompt: 'To separate sand and salt, after adding water you should first:'
    options:
    - Filter
    - Evaporate
    - Use a magnet
    - Winnow
    answer: Filter
    difficulty: 2
    hints:
    - Remove the sand first.
    - Sand doesn't dissolve.
    solution: Filter out the sand, then evaporate the water.
    mistakes: {"Evaporate": "t6_filter_first", "Use a magnet": "t6_filter_first"}
  - prompt: 'Butter is separated from curd by:'
    options:
    - Churning
    - Winnowing
    - Sieving
    - Handpicking
    answer: Churning
    difficulty: 1
    hints:
    - Done with a churner (mathani).
    - Shaking hard.
    solution: Churning separates butter.
    mistakes: {"Winnowing": "t6_churning", "Sieving": "t6_churning"}
  - prompt: 'Water vapour turns back into water on a cold plate. This is:'
    options:
    - Condensation
    - Evaporation
    - Sedimentation
    - Melting
    answer: Condensation
    difficulty: 1
    hints:
    - Gas to liquid.
    - Cold surface.
    solution: This is condensation.
    mistakes: {"Evaporation": "t6_condensation", "Melting": "t6_condensation"}
  - prompt: Why do we separate mixtures?
    options:
    - To remove unwanted or harmful parts, or get useful parts
    - To make them heavier
    - To change their colour
    - There is no reason
    answer: To remove unwanted or harmful parts, or get useful parts
    difficulty: 1
    hints:
    - Stones in rice, salt from sea.
    - Purpose.
    solution: We separate to remove what we don't want or get what we need.
    mistakes: {"To make them heavier": "t6_why_separate", "There is no reason": "t6_why_separate"}
