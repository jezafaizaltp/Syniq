# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 9. Format: content/README.md.
subject: cbse6-sci
chapter: 9
title: Methods of Separation in Everyday Life
tips:
  c6s_filter_dissolve: Filtration removes only insoluble particles. Dissolved salt passes through the filter; use evaporation to get it back.
  t6_churning: "Butter is separated by stirring curd fast for a long time."
  t6_condensation: "Evaporation turns water into vapour. Here vapour meets a cold plate and changes back. Which is the opposite change?"
  t6_evaporation_salt: "Salt is dissolved. Heating away the water leaves it behind."
  t6_filter_first: "Salt is dissolved, so a magnet or evaporation can't get the sand out yet. Which step catches the undissolved sand first?"
  t6_filtration: "A strainer lets liquid through and holds back solids."
  t6_handpicking: "Winnowing uses wind and filtration uses a filter. Here the tool is just your hands."
  t6_magnet: "Sieves and wind sort by size and weight. Iron has a special property sand does not. What pulls iron out?"
  t6_sedimentation: "Condensation is vapour turning to water. Here heavy mud sinks and settles at the bottom. What is settling called?"
  t6_threshing: "Winnowing uses wind to blow husk away. That comes after the grain is first knocked loose from the stalks. What is that step?"
  t6_why_separate: "We separate mixtures to remove what we don't want or get what we do."
  t6_winnowing: "Sieving needs holes and threshing beats the stalks. Here the wind does the work, blowing light husk away."
  c6s9_differ: 'Find how the two parts differ: size, weight, magnetism, or whether one dissolves. The method uses that difference.'
  c6s9_dissolved: A dissolved solid passes through filters and cloth. Only removing the water leaves it behind.
  c6s9_order: First get rid of what won't dissolve, then deal with what did.
  c6s9_heavy: Heavy bits sink if you wait; then the clear liquid on top can be poured off.
  c6s9_farm: 'Think about what the farmer does at each step after harvest: beat, then use the wind.'
concepts:
- code: cbse6s.sep.methods
  title: Simple ways to separate mixtures
  notes: |
    Mixtures are separated to remove unwanted parts or harmful things, or to get a useful part. Handpicking (stones from
    rice), threshing (grain from stalks by beating), winnowing (wind blows away light husk), sieving (different-sized
    particles: flour bran), sedimentation (heavy particles settle), decantation (pour off the liquid), filtration
    (filter paper or cloth stops insoluble particles), magnetic separation (iron from sand).
  explanations:
    text: We separate mixtures to remove what we don't want or to get what we need. Pick stones out of rice by hand. Use wind to blow away light husk (winnowing). Use a sieve for different-sized bits. Let mud settle and pour off the water, or pour it through a filter.
    visual: 'Picture muddy water in a glass. Leave it: mud sinks to the bottom (sedimentation). Gently pour the cleaner water into another glass (decantation). Pour it through filter paper to catch fine dirt (filtration).'
    step_by_step: 'Step 1: Look at how the parts differ: size, weight, magnetism, dissolving. Step 2: Choose the method that uses that difference. Step 3: Separate. Step 4: Check whether another method is needed.'
    real_world: At home, tea is filtered through a strainer, rice is checked for small stones, and farmers winnow grain in the wind.
  picture:
    kind: compare
    columns:
    - title: Method
      points:
      - Winnowing
      - Sieving
      - Magnetic separation
    - title: Uses difference in
      points:
      - weight (wind)
      - particle size
      - magnetism
    - title: Example
      points:
      - husk from grain
      - bran from flour
      - iron from sand
    alt: Winnowing separates husk from grain by weight, sieving separates bran by size, and a magnet pulls iron out of sand.
  activity:
    type: sort
    prompt: Which way would you separate each mixture?
    bins:
    - Handpicking
    - Winnowing
    - Sieving
    - Using a magnet
    items:
    - label: Small stones from rice
      bin: Handpicking
      why: 'The stones are big enough to see and pick out: handpicking.'
      clue: Are the stones big enough to see and pick out?
    - label: Husk from grain
      bin: Winnowing
      why: 'Wind blows away the light husk: winnowing.'
      clue: Which is lighter, husk or grain? What could blow it away?
    - label: Bran from flour
      bin: Sieving
      why: 'The bran pieces are bigger than flour: sieving.'
      clue: Are the bran pieces bigger than flour?
    - label: Iron pins from sand
      bin: Using a magnet
      clue: What pulls iron but not sand?
      why: A magnet pulls out the iron pins.
    - label: Pebbles from sand
      bin: Sieving
      clue: Which is bigger? What lets small bits through?
      why: A sieve keeps pebbles and lets sand through.
    - label: Rotten tomatoes from good ones
      bin: Handpicking
      clue: Can you see which ones are bad?
      why: 'You can see them and pick them out: handpicking.'
  lesson:
    - teach: A mixture has two or more things mixed together. We separate mixtures to remove something unwanted or harmful, or to get something useful. Each method uses a difference between the parts.
      check:
        prompt: Why do we pick small stones out of dal before cooking?
        options:
        - To remove unwanted, harmful parts
        - To make the dal heavier
        - To change its colour
        answer: To remove unwanted, harmful parts
        why: Stones could hurt our teeth; we separate them out.
    - teach: After harvest, farmers beat the stalks to free the grain (threshing). Then they let the wind blow away the light husk while heavy grain falls nearby (winnowing). Handpicking removes a few big unwanted bits; sieving separates fine from coarse particles.
      picture:
        kind: flow
        steps:
        - Harvest
        - Threshing
        - Winnowing
        - Clean grain
        alt: After harvest, threshing frees the grain and winnowing blows the husk away.
      check:
        prompt: 'Flour is passed through a sieve to remove bran. This works because:'
        options:
        - Bran pieces are bigger than flour
        - Bran is magnetic
        - Bran dissolves
        answer: Bran pieces are bigger than flour
        why: A sieve lets small particles through and holds big ones back.
    - teach: 'For muddy water: let it stand so the heavy mud settles (sedimentation), pour off the clearer water (decantation), then pass it through filter paper or cloth to trap fine particles (filtration). A magnet pulls iron out of a mixture.'
      picture:
        kind: flow
        steps:
        - Sedimentation
        - Decantation
        - Filtration
        - Clearer water
        alt: Muddy water is left to settle, the top water is poured off, then filtered.
      check:
        prompt: 'Pouring off the clear water after mud has settled is called:'
        options:
        - Decantation
        - Winnowing
        - Threshing
        answer: Decantation
        why: Decantation means gently pouring off the liquid from settled solid.
  items:
  - prompt: 'Removing small stones from rice by hand is called:'
    options:
    - Handpicking
    - Winnowing
    - Filtration
    - Evaporation
    answer: Handpicking
    difficulty: 1
    hints:
    - Done with fingers.
    - Few, visible impurities.
    solution: This is handpicking.
    mistakes: {"Winnowing": "t6_handpicking", "Filtration": "t6_handpicking"}
  - prompt: 'Separating husk from grain using wind is called:'
    options:
    - Winnowing
    - Sieving
    - Threshing
    - Decantation
    answer: Winnowing
    difficulty: 1
    hints:
    - Light husk blows away.
    - Done from a height.
    solution: Winnowing uses wind.
    mistakes: {"Sieving": "t6_winnowing", "Threshing": "t6_winnowing"}
  - prompt: 'Tea leaves are removed from tea using a strainer. This is:'
    options:
    - Filtration
    - Evaporation
    - Handpicking
    - Winnowing
    answer: Filtration
    difficulty: 1
    hints:
    - The liquid passes through.
    - Solids stay behind.
    solution: A strainer filters out the leaves.
    mistakes: {"Evaporation": "t6_filtration", "Winnowing": "t6_filtration"}
  - prompt: 'Iron filings mixed with sand can be separated using:'
    options:
    - A magnet
    - A sieve
    - Water
    - Wind
    answer: A magnet
    difficulty: 1
    hints:
    - Iron is magnetic.
    - Sand is not.
    solution: A magnet attracts the iron.
    mistakes: {"A sieve": "t6_magnet", "Wind": "t6_magnet"}
  - prompt: 'Mud settling at the bottom of a glass of water is:'
    options:
    - Sedimentation
    - Condensation
    - Filtration
    - Threshing
    answer: Sedimentation
    difficulty: 2
    hints:
    - Heavy particles sink.
    - Then pour off the water.
    solution: Settling of heavy particles is sedimentation.
    mistakes: {"Condensation": "t6_sedimentation", "Threshing": "t6_sedimentation"}
  - prompt: 'Beating harvested stalks to remove the grain is:'
    options:
    - Threshing
    - Winnowing
    - Sieving
    - Decantation
    answer: Threshing
    difficulty: 2
    hints:
    - Done right after harvest.
    - Grain comes off the stalk.
    solution: This is threshing.
    mistakes: {"Winnowing": "t6_threshing", "Decantation": "t6_threshing"}
  - prompt: Which method separates bran from wheat flour?
    options:
    - Sieving
    - Winnowing
    - Magnetic separation
    answer: Sieving
    difficulty: 1
    hints:
    - The parts differ in size.
    - Which tool has small holes?
    solution: 'Step 1: bran is coarser than flour. Step 2: a sieve lets flour through and keeps the bran.'
    mistakes:
      Winnowing: c6s9_differ
      Magnetic separation: c6s9_differ
  - prompt: 'Winnowing works because husk is:'
    options:
    - Lighter than grain
    - Heavier than grain
    - Magnetic
    answer: Lighter than grain
    difficulty: 1
    hints:
    - The wind blows one part away.
    - Which part does wind carry?
    solution: 'Step 1: wind carries light things further. Step 2: husk is light, so it is blown away; grain falls close.'
    mistakes:
      Heavier than grain: c6s9_differ
      Magnetic: c6s9_differ
  - prompt: 'Put the farm steps in order:'
    options:
    - Harvesting, threshing, winnowing
    - Winnowing, harvesting, threshing
    - Threshing, winnowing, harvesting
    answer: Harvesting, threshing, winnowing
    difficulty: 2
    hints:
    - The crop must be cut first.
    - Husk is removed last.
    solution: 'Step 1: cut the crop, then beat it to free the grain. Step 2: then winnow away the husk.'
    mistakes:
      Winnowing, harvesting, threshing: c6s9_farm
      Threshing, winnowing, harvesting: c6s9_farm
  - prompt: 'A mixture of pins and sawdust is best separated by:'
    options:
    - A magnet
    - Sieving
    - Evaporation
    answer: A magnet
    difficulty: 1
    hints:
    - Pins are made of steel.
    - Sawdust is wood.
    solution: 'Step 1: steel pins are magnetic and sawdust is not. Step 2: a magnet pulls the pins out.'
    mistakes:
      Sieving: c6s9_differ
      Evaporation: c6s9_differ
  - prompt: 'Muddy river water is left in a bucket overnight. In the morning the mud is at the bottom. This is:'
    options:
    - Sedimentation
    - Filtration
    - Condensation
    answer: Sedimentation
    difficulty: 1
    hints:
    - Nothing was poured or filtered.
    - Heavy particles just settled.
    solution: 'Step 1: the heavy mud sank by itself. Step 2: settling of heavy particles is sedimentation.'
    mistakes:
      Filtration: c6s9_heavy
      Condensation: c6s9_heavy
  - prompt: After sedimentation, what is the next step to get the water out?
    options:
    - Decantation
    - Winnowing
    - Threshing
    answer: Decantation
    difficulty: 2
    hints:
    - The mud is at the bottom.
    - Gently pour the water off.
    solution: 'Step 1: the mud has settled. Step 2: gently pouring off the water is decantation.'
    mistakes:
      Winnowing: c6s9_heavy
      Threshing: c6s9_heavy
  - prompt: Paneer is separated from whey using a muslin cloth. Which method is this?
    options:
    - Filtration
    - Handpicking
    - Winnowing
    answer: Filtration
    difficulty: 2
    hints:
    - The cloth lets liquid through.
    - It holds the solid back.
    solution: 'Step 1: the cloth traps the solid paneer. Step 2: whey drains through: filtration.'
    mistakes:
      Handpicking: c6s9_differ
      Winnowing: c6s9_differ
  - prompt: Is filtered river water always safe to drink?
    options:
    - No, germs and dissolved substances can pass through
    - Yes, always
    - Yes, if it looks clear
    answer: No, germs and dissolved substances can pass through
    difficulty: 3
    hints:
    - Filters stop visible bits.
    - Can they stop tiny germs and dissolved things?
    solution: 'Step 1: a simple filter removes mud but not germs or dissolved substances. Step 2: water should also be boiled or treated.'
    mistakes:
      Yes, always: c6s9_dissolved
      Yes, if it looks clear: c6s9_dissolved
  - prompt: 'Rice has a few big stones in it. The easiest method is:'
    options:
    - Handpicking
    - Evaporation
    - Filtration
    answer: Handpicking
    difficulty: 1
    hints:
    - Only a few unwanted bits.
    - They are big enough to see.
    solution: 'Step 1: the stones are few and easy to see. Step 2: picking them out by hand is simplest.'
    mistakes:
      Evaporation: c6s9_differ
      Filtration: c6s9_differ
- code: cbse6s.sep.evap
  title: Evaporation, condensation and choosing a method
  after:
  - cbse6s.sep.methods
  notes: |
    Evaporation separates a dissolved solid from a liquid: heat salt water until water evaporates and salt remains (sea
    salt is made in salt pans in Gujarat and Tamil Nadu). Condensation recovers the water: cover with a cold plate and
    collect drops. Often several methods are needed in order: salt + sand + water: dissolve, filter (sand stays),
    evaporate (salt remains). Churning separates butter from curd.
  explanations:
    text: 'Some things dissolve, like salt in water, and a filter cannot catch them. To get the salt back, let the water evaporate: the salt is left behind. Sometimes you need several methods one after another, like dissolving, filtering and then evaporating.'
    visual: Heat a spoon of salty water over a candle. The water disappears as steam and white salt crystals are left on the spoon.
    step_by_step: 'Step 1: Is one part dissolved? If yes, filtering alone won''t work. Step 2: Remove insoluble parts first by filtering. Step 3: Evaporate to get the dissolved solid. Step 4: Condense the vapour to get the water back if needed.'
    real_world: Salt farmers let sea water evaporate in shallow salt pans under the sun; the salt is scraped up when the water has gone.
  picture:
    kind: flow
    steps:
    - Salt + sand + water
    - 'Filter: sand stays on paper'
    - Salty water passes through
    - Evaporate the water
    - Salt is left
    alt: 'To separate salt and sand: add water, filter out the sand, then evaporate the water to leave the salt.'
  activity:
    type: sort
    prompt: Which method gets the useful part out?
    bins:
    - Evaporation
    - Filtration
    - Sedimentation and decantation
    - Condensation
    items:
    - label: Salt from sea water
      bin: Evaporation
      why: 'Heat removes the water; salt stays behind: evaporation.'
      clue: If the water goes away, what stays behind?
    - label: Mud from muddy water
      bin: Filtration
      clue: What stops mud but lets water through?
      why: 'A filter paper holds back the mud: filtration.'
    - label: Letting sand settle, then pouring off the water
      bin: Sedimentation and decantation
      clue: It settles, then you pour. What are those steps called?
      why: Settling is sedimentation; pouring off is decantation.
    - label: Getting water back from steam
      bin: Condensation
      why: 'Cooling turns vapour into water drops: condensation.'
      clue: What happens when steam meets something cold?
    - label: Sand from sand and water
      bin: Filtration
      clue: What lets water through but holds the sand?
      why: 'Filter paper holds the sand: filtration.'
  lesson:
    - teach: 'A dissolved solid like salt can''t be filtered out: it passes through with the water. To get it back, heat the solution so the water evaporates; the salt is left behind. Sea salt is made this way in salt pans in Gujarat and Tamil Nadu.'
      picture:
        kind: flow
        steps:
        - Salt water in a dish
        - Heat or sunlight
        - Water evaporates
        - Salt remains
        alt: Salt water is heated, the water evaporates, and salt is left in the dish.
      check:
        prompt: Sugar dissolved in water. How do you get the sugar back?
        options:
        - Evaporate the water
        - Filter it
        - Use a magnet
        answer: Evaporate the water
        why: Dissolved sugar passes through filters; evaporating leaves it behind.
    - teach: To save the water too, cover the heated dish with a cold plate. The vapour condenses on the plate and drips into a cup. Evaporation followed by condensation gives back both the salt and pure water.
      check:
        prompt: Drops collect under a cold plate held over boiling salt water. Do they taste salty?
        options:
        - No, salt stays behind in the dish
        - Yes, very salty
        - They taste sweet
        answer: No, salt stays behind in the dish
        why: Only water evaporates; the salt doesn't.
    - teach: 'Many mixtures need more than one method, in the right order. Salt + sand: add water and stir (salt dissolves), filter (sand stays on the paper), evaporate the filtrate (salt remains). Churning separates butter from curd: the light butter collects on top.'
      picture:
        kind: flow
        steps:
        - Add water, stir
        - 'Filter: sand stays'
        - 'Evaporate: salt stays'
        alt: 'To separate sand and salt: dissolve in water, filter out the sand, evaporate to get the salt.'
      check:
        prompt: In the sand–salt method, where is the sand after filtering?
        options:
        - On the filter paper
        - In the salt water below
        - Dissolved
        answer: On the filter paper
        why: Sand doesn't dissolve, so the filter holds it.
  items:
  - prompt: How is salt obtained from sea water?
    options:
    - Evaporation
    - Filtration
    - Magnetic separation
    - Winnowing
    answer: Evaporation
    difficulty: 1
    hints:
    - The water must go away.
    - Salt pans in the sun.
    solution: Sea water is evaporated to leave salt.
    mistakes: {"Filtration": "t6_evaporation_salt", "Winnowing": "t6_evaporation_salt"}
  - prompt: Can filtration separate salt from salt water?
    options:
    - No, dissolved salt passes through the filter
    - Yes, always
    - Only with a sieve
    - Only if the water is hot
    answer: No, dissolved salt passes through the filter
    difficulty: 2
    hints:
    - Salt is dissolved.
    - Particles are too tiny.
    solution: Dissolved salt goes through filter paper.
    mistakes:
      Yes, always: c6s_filter_dissolve
  - prompt: 'To separate sand and salt, after adding water you should first:'
    options:
    - Filter
    - Evaporate
    - Use a magnet
    - Winnow
    answer: Filter
    difficulty: 2
    hints:
    - Remove the sand first.
    - Sand doesn't dissolve.
    solution: Filter out the sand, then evaporate the water.
    mistakes: {"Evaporate": "t6_filter_first", "Use a magnet": "t6_filter_first"}
  - prompt: 'Butter is separated from curd by:'
    options:
    - Churning
    - Winnowing
    - Sieving
    - Handpicking
    answer: Churning
    difficulty: 1
    hints:
    - Done with a churner (mathani).
    - Shaking hard.
    solution: Churning separates butter.
    mistakes: {"Winnowing": "t6_churning", "Sieving": "t6_churning"}
  - prompt: 'Water vapour turns back into water on a cold plate. This is:'
    options:
    - Condensation
    - Evaporation
    - Sedimentation
    - Melting
    answer: Condensation
    difficulty: 1
    hints:
    - Gas to liquid.
    - Cold surface.
    solution: This is condensation.
    mistakes: {"Evaporation": "t6_condensation", "Melting": "t6_condensation"}
  - prompt: Why do we separate mixtures?
    options:
    - To remove unwanted or harmful parts, or get useful parts
    - To make them heavier
    - To change their colour
    - There is no reason
    answer: To remove unwanted or harmful parts, or get useful parts
    difficulty: 1
    hints:
    - Stones in rice, salt from sea.
    - Purpose.
    solution: We separate to remove what we don't want or get what we need.
    mistakes: {"To make them heavier": "t6_why_separate", "There is no reason": "t6_why_separate"}
  - prompt: Which method gets salt from sea water in salt pans?
    options:
    - Evaporation by the Sun
    - Filtration
    - Sieving
    answer: Evaporation by the Sun
    difficulty: 1
    hints:
    - Sea water is left in shallow pans.
    - The Sun heats it.
    solution: 'Step 1: the Sun evaporates the water. Step 2: salt is left behind in the pans.'
    mistakes:
      Filtration: c6s9_dissolved
      Sieving: c6s9_dissolved
  - prompt: Can a sieve separate sugar from sugar water?
    options:
    - No, dissolved sugar goes through
    - Yes, easily
    - Yes, if you shake it
    answer: No, dissolved sugar goes through
    difficulty: 2
    hints:
    - Sugar has dissolved.
    - Its tiny particles fit through any holes.
    solution: 'Step 1: dissolved sugar is spread through the water. Step 2: it passes through a sieve; evaporation is needed.'
    mistakes:
      Yes, easily: c6s9_dissolved
      Yes, if you shake it: c6s9_dissolved
  - prompt: Sand, salt and water are mixed. What is the right order of methods?
    options:
    - Filtration, then evaporation
    - Evaporation, then filtration
    - Winnowing, then sieving
    answer: Filtration, then evaporation
    difficulty: 2
    hints:
    - Remove the part that didn't dissolve first.
    - Then get the dissolved part.
    solution: 'Step 1: filter out the sand. Step 2: evaporate the water to get the salt.'
    mistakes:
      Evaporation, then filtration: c6s9_order
      Winnowing, then sieving: c6s9_order
  - prompt: Why does churning separate butter from curd?
    options:
    - Butter is lighter and collects on top
    - Butter is magnetic
    - Butter dissolves
    answer: Butter is lighter and collects on top
    difficulty: 2
    hints:
    - Churning spins the curd.
    - Where does the butter end up?
    solution: 'Step 1: churning makes fat particles clump together. Step 2: the lighter butter rises and is skimmed off.'
    mistakes:
      Butter is magnetic: c6s9_differ
      Butter dissolves: c6s9_differ
  - prompt: 'Evaporation and condensation together can give us:'
    options:
    - Pure water from salt water
    - Salt from sand
    - Grain from husk
    answer: Pure water from salt water
    difficulty: 2
    hints:
    - Evaporation turns water to vapour.
    - Condensation turns it back.
    solution: 'Step 1: vapour leaves the salt behind. Step 2: condensing it gives pure water.'
    mistakes:
      Salt from sand: c6s9_order
      Grain from husk: c6s9_farm
  - prompt: 'Chalk powder in water: which method removes it?'
    options:
    - Filtration
    - Evaporation only
    - Magnet
    answer: Filtration
    difficulty: 2
    hints:
    - Chalk does not dissolve.
    - Undissolved particles are trapped by filter paper.
    solution: 'Step 1: chalk is insoluble. Step 2: filter paper traps it, letting water through.'
    mistakes:
      Evaporation only: c6s9_dissolved
      Magnet: c6s9_differ
  - prompt: Iron filings, sand and salt are mixed. Which step comes first?
    options:
    - Remove iron with a magnet
    - Evaporate
    - Filter
    answer: Remove iron with a magnet
    difficulty: 3
    hints:
    - Do the dry step before adding water.
    - Iron would rust in water.
    solution: 'Step 1: pull out the iron while dry. Step 2: then dissolve, filter the sand and evaporate the salt.'
    mistakes:
      Evaporate: c6s9_order
      Filter: c6s9_order
  - prompt: Why are salt pans made shallow and wide?
    options:
    - A wide surface makes water evaporate faster
    - So salt sinks
    - To keep sea water cold
    answer: A wide surface makes water evaporate faster
    difficulty: 3
    hints:
    - Evaporation happens at the surface.
    - More surface means faster drying.
    solution: 'Step 1: water evaporates from its surface. Step 2: a wide, shallow pan gives more surface, so drying is faster.'
    mistakes:
      So salt sinks: c6s9_dissolved
      To keep sea water cold: c6s9_dissolved
  - prompt: After evaporating salt water completely in a dish, what is left?
    options:
    - Salt crystals
    - Nothing at all
    - Sand
    answer: Salt crystals
    difficulty: 1
    hints:
    - Only the water left as vapour.
    - What was dissolved in it?
    solution: 'Step 1: water evaporates. Step 2: the dissolved salt stays behind as crystals.'
    mistakes:
      Nothing at all: c6s9_dissolved
      Sand: c6s9_dissolved
