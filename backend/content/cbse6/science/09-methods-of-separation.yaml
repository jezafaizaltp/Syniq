  - prompt: 'Case: After a storm, a coastal village has only sea water. A teacher boils sea water in a pot, holds a cold metal plate slanting above it, and places a cup under the lower edge of the plate. What collects in the cup, and what is left in the pot?'
    options:
    - Pure water in the cup; salt in the pot
    - Salt water in the cup; nothing in the pot
    - Salt in the cup; pure water in the pot
    answer: Pure water in the cup; salt in the pot
    hints:
    - Which part of sea water can turn into vapour?
    - What happens to vapour on the cold plate?
    solution: Only the water evaporates. Its vapour condenses on the cold plate and drips into the cup as pure water. The salt cannot rise, so it stays in the pot.
    mistakes:
