# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 12. Format: content/README.md.
subject: cbse6-sci
chapter: 12
title: Beyond Earth
tips:
  c6s_star_planet: "Stars make their own light; planets and moons only reflect light. Ask: does this object shine by itself, and what does it go around?"
  t6_chandrayaan: "Chandrayaan-3 landed where no country had landed before, a cold polar region. Which pole was it?"
  t6_constellation: "A planet is one world and a galaxy holds billions of stars. A small group of stars that seems to draw a shape has another name."
  t6_earth_rotates: "Stars don't move across the sky by themselves. What is really turning?"
  t6_eight_planets: "The planets are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune. Pluto is a dwarf planet."
  t6_jupiter: "The largest planet is the gas giant famous for its Great Red Spot."
  t6_light_pollution: "Bright city lights wash out faint stars."
  t6_mercury_closest: "Venus is second from the Sun and Mars is fourth. Which planet comes before Venus?"
  t6_nearest_star: "The Moon is not a star, and the Pole Star is very far away. Which star do you see every day?"
  t6_planets_beyond: "There are 8 planets and Earth is 3rd. How many come after it?"
  t6_pole_star: "One star stays almost fixed above the North Pole."
  c6s12_own: Ask whether the object makes its own light or only shines because sunlight falls on it.
  c6s12_spin: The sky seems to move the opposite way to how the Earth turns.
  c6s12_pattern: Groups of stars that make a picture have special names; one bright star sits almost still above the north.
  c6s12_order: Say the planets in order from the Sun and count along the list.
  c6s12_kind: 'Sort by size and make-up: small rocky ones near the Sun, huge gas and ice giants far away.'
  c6s12_isro: 'Recall what each Indian mission went to study: the Moon, the Sun or Mars.'
concepts:
- code: cbse6s.beyond.sky
  title: Stars, constellations and the night sky
  notes: |
    Stars are huge balls of hot gas that make their own light; the Sun is our nearest star. Stars appear to move east to
    west across the night sky because the Earth rotates. Constellations: groups of stars forming patterns: Saptarishi
    (Ursa Major, Big Dipper), Orion (Mriga). Pole Star (Dhruv Tara) stays nearly fixed above the north and helps find
    direction. Light pollution in cities hides faint stars. The Milky Way is our galaxy.
  explanations:
    text: Stars are huge, hot balls of gas that shine with their own light. The Sun is a star, the closest one to us. Groups of stars that form patterns are called constellations, like Saptarishi. The Pole Star stays almost still in the north sky, so travellers used it to find direction.
    visual: 'Picture the Saptarishi: seven bright stars like a big ladle. Draw a line through the two stars at the end of the ladle''s bowl and follow it: it points to the Pole Star.'
    step_by_step: 'Step 1: Find a dark place away from bright lights. Step 2: Look north. Step 3: Find the seven stars of Saptarishi. Step 4: Follow the two pointer stars to the Pole Star.'
    real_world: Sailors long ago used the Pole Star to steer at night; today, city lights make it hard to see many stars.
  picture:
    kind: compare
    columns:
    - title: Star
      points:
      - makes its own light
      - very hot gas
      - e.g. the Sun
    - title: Planet
      points:
      - reflects light
      - goes round a star
      - e.g. Earth
    alt: A star like the Sun makes its own light; a planet like Earth goes round a star and only reflects light.
  activity:
    type: sort
    prompt: Star, planet or constellation?
    bins:
    - Star
    - Planet
    - Constellation
    items:
    - label: The Sun
      bin: Star
      why: Our nearest star.
      clue: Does it make its own light?
    - label: Pole Star (Dhruv Tara)
      bin: Star
      clue: Is it a single point of its own light?
      why: It's a star that makes its own light.
    - label: Mars
      bin: Planet
      clue: Does it make its own light, or reflect sunlight?
      why: 'It reflects sunlight and goes round the Sun: a planet.'
    - label: Jupiter
      bin: Planet
      clue: Does it go round the Sun?
      why: 'It goes round the Sun: a planet.'
    - label: Venus
      bin: Planet
      why: 'It shines brightly, but only by reflecting sunlight: a planet.'
      clue: It shines brightly. Does it make its own light?
    - label: Saptarishi (Big Dipper)
      bin: Constellation
      clue: Is it one thing, or a group making a shape?
      why: 'A group of stars making a shape: a constellation.'
    - label: Orion
      bin: Constellation
      clue: Is it one thing, or a group making a shape?
      why: 'Stars making the shape of a hunter: a constellation.'
  lesson:
    - teach: Stars are huge balls of hot gas that make their own light. The Sun is a star, the nearest one to us. Other stars look tiny only because they are very far away. The Moon and planets do not make light; they reflect sunlight.
      picture:
        kind: compare
        columns:
        - title: Make own light
          points:
          - the Sun
          - other stars
        - title: Reflect sunlight
          points:
          - the Moon
          - planets
        alt: Stars like the Sun make their own light; the Moon and planets only reflect it.
      check:
        prompt: Why does the Moon shine at night?
        options:
        - It reflects sunlight
        - It makes its own light
        - It is a star
        answer: It reflects sunlight
        why: The Moon has no light of its own.
    - teach: 'Stars seem to rise in the east and set in the west, like the Sun. They don''t really move across the sky: the Earth spins from west to east, so the sky appears to turn the other way.'
      check:
        prompt: 'The Earth spins from west to east. So stars seem to move:'
        options:
        - From east to west
        - From west to east
        - Not at all
        answer: From east to west
        why: The sky appears to move opposite to the Earth's spin.
    - teach: 'Groups of stars that form patterns are constellations: Saptarishi (the Big Dipper) and Orion are easy to find. The Pole Star (Dhruv Tara) stays almost still above the north, so travellers use it for direction. City lights (light pollution) hide faint stars. Our galaxy is the Milky Way.'
      check:
        prompt: Why did sailors use the Pole Star?
        options:
        - It stays almost fixed above the north
        - It is the brightest star
        - It is the Moon
        answer: It stays almost fixed above the north
        why: A star that doesn't move shows a fixed direction.
  items:
  - prompt: 'The nearest star to the Earth is:'
    options:
    - The Sun
    - The Pole Star
    - The Moon
    - Mars
    answer: The Sun
    difficulty: 1
    hints:
    - It lights our day.
    - A star, not a planet.
    solution: The Sun is our nearest star.
    mistakes: {"The Pole Star": "t6_nearest_star", "The Moon": "t6_nearest_star"}
  - prompt: Which makes its own light?
    options:
    - A star
    - The Moon
    - A planet
    - A satellite
    answer: A star
    difficulty: 1
    hints:
    - Very hot gas.
    - Planets only reflect.
    solution: Stars produce their own light.
    mistakes:
      The Moon: c6s_star_planet
  - prompt: 'A group of stars forming a pattern is a:'
    options:
    - Constellation
    - Planet
    - Galaxy
    - Comet
    answer: Constellation
    difficulty: 1
    hints:
    - Like Saptarishi.
    - A star picture.
    solution: A star pattern is a constellation.
    mistakes: {"Planet": "t6_constellation", "Galaxy": "t6_constellation"}
  - prompt: Which star helps find the north direction?
    options:
    - Pole Star (Dhruv Tara)
    - The Sun
    - Sirius only
    - Any planet
    answer: Pole Star (Dhruv Tara)
    difficulty: 1
    hints:
    - It stays almost fixed.
    - North sky.
    solution: The Pole Star lies nearly above the North Pole.
    mistakes: {"The Sun": "t6_pole_star", "Any planet": "t6_pole_star"}
  - prompt: 'Stars appear to move from east to west at night because:'
    options:
    - the Earth rotates
    - stars walk
    - the Moon pushes them
    - clouds move them
    answer: the Earth rotates
    difficulty: 2
    hints:
    - We are the ones turning.
    - Same as sunrise and sunset.
    solution: The Earth's rotation makes stars seem to move.
    mistakes: {"stars walk": "t6_earth_rotates", "clouds move them": "t6_earth_rotates"}
  - prompt: Why do we see fewer stars in big cities?
    options:
    - Light pollution
    - There are fewer stars above cities
    - Cities are closer to the Sun
    - Stars avoid cities
    answer: Light pollution
    difficulty: 2
    hints:
    - Street lights and buildings.
    - Bright sky.
    solution: City lights make the sky too bright to see faint stars.
    mistakes: {"There are fewer stars above cities": "t6_light_pollution", "Cities are closer to the Sun": "t6_light_pollution"}
  - prompt: Why do other stars look so much smaller than the Sun?
    options:
    - They are much farther away
    - They are tiny pebbles
    - They are cold
    answer: They are much farther away
    difficulty: 1
    hints:
    - Many stars are bigger than the Sun.
    - A far-off lamp looks small.
    solution: 'Step 1: stars are huge, like the Sun. Step 2: they look tiny because they are very far away.'
    mistakes:
      They are tiny pebbles: c6s12_own
      They are cold: c6s12_own
  - prompt: Which of these does NOT make its own light?
    options:
    - Venus
    - The Sun
    - The Pole Star
    answer: Venus
    difficulty: 2
    hints:
    - Two of these are stars.
    - Planets only reflect light.
    solution: 'Step 1: the Sun and the Pole Star are stars. Step 2: Venus is a planet; it shines by reflected sunlight.'
    mistakes:
      The Sun: c6s12_own
      The Pole Star: c6s12_own
  - prompt: 'Saptarishi is a well-known:'
    options:
    - Constellation
    - Planet
    - Comet
    answer: Constellation
    difficulty: 1
    hints:
    - It is a group of seven bright stars.
    - They form a pattern.
    solution: 'Step 1: Saptarishi is seven stars in a pattern. Step 2: a star pattern is a constellation.'
    mistakes:
      Planet: c6s12_pattern
      Comet: c6s12_pattern
  - prompt: We live in which galaxy?
    options:
    - The Milky Way
    - Orion
    - Saptarishi
    answer: The Milky Way
    difficulty: 1
    hints:
    - A galaxy is a huge collection of stars.
    - Orion and Saptarishi are star patterns.
    solution: 'Step 1: Orion and Saptarishi are constellations. Step 2: our galaxy is the Milky Way.'
    mistakes:
      Orion: c6s12_pattern
      Saptarishi: c6s12_pattern
  - prompt: Why can't we see stars in the daytime?
    options:
    - Bright sunlight hides their faint light
    - They go out
    - They move behind the Earth's clouds always
    answer: Bright sunlight hides their faint light
    difficulty: 2
    hints:
    - Stars are still there in the day.
    - What is much brighter?
    solution: 'Step 1: stars shine all the time. Step 2: the Sun''s bright light drowns out their faint light.'
    mistakes:
      They go out: c6s12_own
      They move behind the Earth's clouds always: c6s12_own
  - prompt: Which place gives the best view of faint stars?
    options:
    - A dark village far from city lights
    - A busy city market
    - Under a street lamp
    answer: A dark village far from city lights
    difficulty: 1
    hints:
    - Lights brighten the sky.
    - Where is the sky darkest?
    solution: 'Step 1: city lights cause light pollution. Step 2: a dark village sky shows many more stars.'
    mistakes:
      A busy city market: c6s12_pattern
      Under a street lamp: c6s12_pattern
  - prompt: Facing the Pole Star, which direction is behind you?
    options:
    - South
    - East
    - West
    answer: South
    difficulty: 2
    hints:
    - The Pole Star is in the north.
    - What is opposite north?
    solution: 'Step 1: facing the Pole Star means facing north. Step 2: behind you is south.'
    mistakes:
      East: c6s12_pattern
      West: c6s12_pattern
  - prompt: 'Light from the Sun takes about 8 minutes to reach us. Light from other stars takes years. This shows that other stars are:'
    options:
    - Much farther than the Sun
    - Closer than the Sun
    - The same distance
    answer: Much farther than the Sun
    difficulty: 3
    hints:
    - Light travels at the same speed from all of them.
    - Longer time means longer distance.
    solution: 'Step 1: light travels at the same speed. Step 2: taking years instead of minutes means stars are much farther.'
    mistakes:
      Closer than the Sun: c6s12_own
      The same distance: c6s12_own
  - prompt: 'The Sun appears to rise in the east because:'
    options:
    - The Earth spins from west to east
    - The Sun goes round the Earth daily
    - The east is warmer
    answer: The Earth spins from west to east
    difficulty: 2
    hints:
    - The Sun does not really move across our sky.
    - Our Earth is turning.
    solution: 'Step 1: the Earth spins from west to east. Step 2: so the Sun appears to come up in the east.'
    mistakes:
      The Sun goes round the Earth daily: c6s12_spin
      The east is warmer: c6s12_spin
- code: cbse6s.beyond.solar
  title: The Solar System and space exploration
  after:
  - cbse6s.beyond.sky
  notes: |
    The Solar System: the Sun and everything going round it: 8 planets in order from the Sun: Mercury, Venus, Earth,
    Mars, Jupiter, Saturn, Uranus, Neptune. Inner four are rocky; outer four are giant gas/ice planets. Venus is the
    brightest planet; Jupiter the largest; Saturn has bright rings. Moons (natural satellites) go round planets. Asteroids
    (mostly between Mars and Jupiter), comets (icy, with tails). Artificial satellites are used for weather, TV, GPS.
    India's ISRO: Chandrayaan-3 landed near the Moon's south pole (2023); Aditya-L1 studies the Sun.
  explanations:
    text: 'The Solar System is the Sun and everything that goes round it. There are 8 planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune. Jupiter is the biggest. The Moon goes round the Earth. India''s ISRO landed Chandrayaan-3 on the Moon in 2023.'
    visual: Picture the Sun in the middle, with 8 rings around it. Four small rocky planets close in, then four giant planets further out, with a belt of rocks (asteroids) between Mars and Jupiter.
    step_by_step: 'Step 1: Start at the Sun. Step 2: Name the planets in order. Step 3: Remember the inner four are rocky and the outer four are giants. Step 4: Moons go round planets; planets go round the Sun.'
    real_world: Weather forecasts on TV use pictures from Indian satellites like INSAT; your phone's map uses satellites too.
  picture:
    kind: flow
    steps:
    - Mercury
    - Venus
    - Earth
    - Mars
    - Jupiter
    - Saturn
    - Uranus
    - Neptune
    alt: 'The 8 planets in order from the Sun: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune.'
  activity:
    type: order
    prompt: Put the planets in order, starting nearest the Sun.
    steps:
    - Mercury
    - Venus
    - Earth
    - Mars
    - Jupiter
    - Saturn
    - Uranus
    - Neptune
    reasons:
      Venus: Mercury is the closest planet to the Sun.
      Earth: Venus is between Mercury and Earth.
      Mars: Earth is the third planet; Mars is the fourth.
      Jupiter: The four rocky planets come first; Jupiter is the first giant.
      Saturn: Jupiter is closer than Saturn.
      Uranus: Saturn, with its rings, comes before Uranus.
      Neptune: Neptune is the furthest planet.
  lesson:
    - teach: 'The Solar System is the Sun and everything that goes round it. There are 8 planets. In order from the Sun: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.'
      picture:
        kind: flow
        steps:
        - Sun
        - Mercury
        - Venus
        - Earth
        - Mars
        - Jupiter
        - Saturn
        - Uranus
        alt: 'The Sun, then the planets in order: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune last.'
      check:
        prompt: Which planet comes just after Earth?
        options:
        - Mars
        - Venus
        - Jupiter
        answer: Mars
        why: The order is Mercury, Venus, Earth, Mars...
    - teach: The four inner planets are small and rocky. The four outer planets are giants made mostly of gas and ice. Jupiter is the largest; Saturn has bright rings; Venus is the brightest planet in our sky and the hottest.
      picture:
        kind: compare
        columns:
        - title: Inner (rocky)
          points:
          - Mercury
          - Venus
          - Earth
          - Mars
        - title: Outer (giants)
          points:
          - Jupiter
          - Saturn
          - Uranus
          - Neptune
        alt: Mercury, Venus, Earth and Mars are small rocky planets; Jupiter, Saturn, Uranus and Neptune are giants.
      check:
        prompt: Which planet is famous for its bright rings?
        options:
        - Saturn
        - Mars
        - Mercury
        answer: Saturn
        why: Saturn's rings of ice and rock can be seen with a small telescope.
    - teach: Moons are natural satellites going round planets. Asteroids are rocky pieces, mostly between Mars and Jupiter; comets are icy and grow tails near the Sun. People launch artificial satellites for weather, TV and GPS. India's ISRO landed Chandrayaan-3 near the Moon's south pole in 2023, and Aditya-L1 studies the Sun.
      check:
        prompt: 'A weather satellite launched by ISRO is:'
        options:
        - An artificial satellite
        - A natural satellite
        - A comet
        answer: An artificial satellite
        why: People built and launched it.
  items:
  - prompt: How many planets are there in the Solar System?
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - Mercury to Neptune.
    - Count them.
    solution: There are 8 planets.
    mistakes: {"9": "t6_eight_planets", "7": "t6_eight_planets"}
  - prompt: Which planet is closest to the Sun?
    options:
    - Mercury
    - Venus
    - Earth
    - Mars
    answer: Mercury
    difficulty: 1
    hints:
    - First in the list.
    - Small and hot.
    solution: Mercury is closest to the Sun.
    mistakes: {"Venus": "t6_mercury_closest", "Mars": "t6_mercury_closest"}
  - prompt: Which is the largest planet?
    options:
    - Jupiter
    - Saturn
    - Earth
    - Neptune
    answer: Jupiter
    difficulty: 1
    hints:
    - A gas giant.
    - Fifth from the Sun.
    solution: Jupiter is the largest.
    mistakes: {"Saturn": "t6_jupiter", "Earth": "t6_jupiter"}
  - prompt: 'The Moon is a:'
    options:
    - natural satellite of the Earth
    - star
    - planet
    - comet
    answer: natural satellite of the Earth
    difficulty: 1
    hints:
    - It goes round the Earth.
    - Not made by people.
    solution: The Moon is Earth's natural satellite.
    mistakes:
      star: c6s_star_planet
  - prompt: Earth is the 3rd planet from the Sun. How many planets lie further from the Sun than Earth?
    answer: '5'
    check: 8 - 3
    difficulty: 2
    hints:
    - 8 planets in all.
    - 8 − 3.
    solution: 8 − 3 = 5 planets.
    mistakes: {"3": "t6_planets_beyond", "6": "t6_planets_beyond"}
  - prompt: 'India''s Chandrayaan-3 landed in 2023 near the Moon''s:'
    options:
    - south pole
    - north pole
    - equator on the far side
    - Sun-facing crater
    answer: south pole
    difficulty: 2
    hints:
    - A first for any country.
    - South.
    solution: Chandrayaan-3 landed near the lunar south pole.
    mistakes: {"north pole": "t6_chandrayaan", "equator on the far side": "t6_chandrayaan"}
  - prompt: Which planet is between Venus and Mars?
    options:
    - Earth
    - Mercury
    - Jupiter
    answer: Earth
    difficulty: 1
    hints:
    - Say the order from the Sun.
    - Venus is 2nd and Mars is 4th.
    solution: 'Step 1: order: Mercury, Venus, Earth, Mars. Step 2: so Earth is between them.'
    mistakes:
      Mercury: c6s12_order
      Jupiter: c6s12_order
  - prompt: Which planet is farthest from the Sun?
    options:
    - Neptune
    - Saturn
    - Mars
    answer: Neptune
    difficulty: 1
    hints:
    - It is the last in the list.
    - Count to the 8th planet.
    solution: 'Step 1: the 8th planet from the Sun is the farthest. Step 2: that is Neptune.'
    mistakes:
      Saturn: c6s12_order
      Mars: c6s12_order
  - prompt: Jupiter is the 5th planet from the Sun. How many planets are closer to the Sun than Jupiter?
    answer: '4'
    check: 5-1
    difficulty: 2
    hints:
    - Count the planets before it.
    - Mercury, Venus, ...
    solution: 'Step 1: before Jupiter come Mercury, Venus, Earth, Mars. Step 2: that is 4 planets.'
    mistakes:
      '5': c6s12_order
      '3': c6s12_order
  - prompt: Which is a rocky inner planet?
    options:
    - Mars
    - Uranus
    - Saturn
    answer: Mars
    difficulty: 1
    hints:
    - The inner planets are the first four.
    - Uranus and Saturn are giants.
    solution: 'Step 1: inner planets are Mercury, Venus, Earth, Mars. Step 2: Mars is rocky.'
    mistakes:
      Uranus: c6s12_kind
      Saturn: c6s12_kind
  - prompt: Where are most asteroids found?
    options:
    - Between Mars and Jupiter
    - Inside the Sun
    - Between Earth and the Moon
    answer: Between Mars and Jupiter
    difficulty: 2
    hints:
    - They form a belt.
    - It lies between the rocky and giant planets.
    solution: 'Step 1: asteroids form a belt. Step 2: it lies between Mars and Jupiter.'
    mistakes:
      Inside the Sun: c6s12_kind
      Between Earth and the Moon: c6s12_kind
  - prompt: 'A comet''s tail appears when it:'
    options:
    - Comes close to the Sun and its ice heats up
    - Hits a planet
    - Goes far from the Sun
    answer: Comes close to the Sun and its ice heats up
    difficulty: 3
    hints:
    - Comets are made of ice and dust.
    - What does heat do to ice?
    solution: 'Step 1: near the Sun, the comet''s ice turns to gas. Step 2: gas and dust stream out as a glowing tail.'
    mistakes:
      Hits a planet: c6s12_kind
      Goes far from the Sun: c6s12_kind
  - prompt: 'India''s Aditya-L1 mission studies:'
    options:
    - The Sun
    - The Moon
    - Mars
    answer: The Sun
    difficulty: 2
    hints:
    - Think about what the Sanskrit word Aditya means.
    - It watches from far out in space.
    solution: 'Step 1: Aditya is a Sanskrit name for the Sun. Step 2: Aditya-L1 is India''s mission to study the Sun.'
    mistakes:
      The Moon: c6s12_isro
      Mars: c6s12_isro
  - prompt: 'GPS maps on phones work with the help of:'
    options:
    - Artificial satellites
    - Comets
    - Asteroids
    answer: Artificial satellites
    difficulty: 2
    hints:
    - Something launched by people sends signals.
    - It goes round the Earth.
    solution: 'Step 1: GPS needs signals from space. Step 2: artificial satellites send these signals.'
    mistakes:
      Comets: c6s12_kind
      Asteroids: c6s12_kind
  - prompt: Why is Venus easy to see in the evening or early morning sky?
    options:
    - It is the brightest planet in our sky
    - It makes its own light
    - It is the biggest planet
    answer: It is the brightest planet in our sky
    difficulty: 2
    hints:
    - It is close to Earth and covered in shiny clouds.
    - It does not make its own light.
    solution: 'Step 1: Venus reflects lots of sunlight from its clouds. Step 2: so it is the brightest planet we see.'
    mistakes:
      It makes its own light: c6s12_own
      It is the biggest planet: c6s12_kind
