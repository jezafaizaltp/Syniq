# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 8. Format: content/README.md.
subject: cbse6-sci
chapter: 8
title: A Journey through States of Water
tips:
  c6s_evap_cond: "Evaporation needs heat and makes vapour. Here the air touching a cold glass loses heat and its vapour becomes drops. What is that change?"
  t6_condenses: "When water vapour cools, it turns into tiny drops. What is that called?"
  t6_drought: "A long time without rain causes a shortage of water."
  t6_dry_faster: "Heat and wind help water evaporate faster."
  t6_evaporates: "Water on the clothes turns into vapour and goes into the air."
  t6_harvesting: "Deforestation and flooding don't save anything. Think of collecting rain like a farmer collects a crop."
  t6_matka: "Evaporation takes heat away. Where does the water evaporate from in a clay pot?"
  t6_melting: "Freezing turns water into ice. Ice turning into water is the opposite change. What is it called?"
  t6_precipitation: "Evaporation and condensation happen on the way up and inside clouds. What do we call water coming down from clouds as rain, snow or hail?"
  t6_sun_energy: "Evaporation needs heat. Where does that heat come from?"
  t6_temp_difference: "Subtract the smaller temperature from the larger."
  t6_transpiration: "Precipitation falls from clouds and condensation forms drops. Leaves breathing out water vapour has its own name."
  c6s8_names: 'Name the change by the state it starts in and the state it ends in.'
  c6s8_heat: Ask whether heat is being added or taken away in this change.
  c6s8_faster: Heat, wind, a wide spread and dry air all help water escape into the air.
  c6s8_cool: When water escapes from a surface into the air, it carries heat away with it.
  c6s8_cycle: 'Follow the water: up as vapour, cooling in the sky, falling back, flowing home.'
  c6s8_save: Think of ways to catch, keep or use water again rather than letting it run off.
concepts:
- code: cbse6s.water.states
  title: Three states and changes of state
  notes: |
    Water exists as solid (ice), liquid (water) and gas (water vapour). Melting: ice → water (at 0 °C). Freezing: water →
    ice. Evaporation: water → vapour at any temperature from the surface (faster with heat, wind, larger surface area,
    dry air). Boiling: rapid change at 100 °C. Condensation: vapour → water on cooling (droplets on a cold glass, dew).
    Evaporation causes cooling (sweat, earthen pots/matka).
  explanations:
    text: Water can be solid ice, liquid water or invisible water vapour. Heating ice melts it; heating water makes it evaporate. Cooling vapour turns it back into droplets (condensation), and cooling water enough freezes it.
    visual: 'Put ice in a steel glass. The ice melts into water. Drops appear on the outside of the cold glass: vapour from the air has condensed. Leave water in a plate in the sun: it slowly evaporates.'
    step_by_step: 'Step 1: Identify the starting state. Step 2: Is heat added or removed? Step 3: Added: solid → liquid → gas. Removed: gas → liquid → solid. Step 4: Name the change.'
    real_world: Wet clothes dry on a line by evaporation; water in a clay pot stays cool because some seeps out and evaporates.
  picture:
    kind: flow
    steps:
    - Ice (solid)
    - melting
    - Water (liquid)
    - evaporation
    - Water vapour (gas)
    alt: Heating takes water from ice to liquid by melting, then to vapour by evaporation; cooling reverses it.
  activity:
    type: scale
    min: -20
    max: 120
    step: 5
    start: 20
    unit: °C
    orientation: vertical
    prompt: Change the temperature of some water and see its state change.
    zones:
    - from: -20
      to: 0
      label: Ice (solid)
      says: Below 0 °C, the water freezes solid.
    - from: 0
      to: 100
      label: Water (liquid)
      says: Between 0 °C and 100 °C, it stays liquid.
    - from: 100
      to: 120
      label: Steam (gas)
      says: At 100 °C and above, it boils and turns to steam.
    goals:
    - prompt: Freeze the water.
      zone: Ice (solid)
    - prompt: Make it boil and turn to steam.
      zone: Steam (gas)
  lesson:
    - teach: 'Water exists in three states: solid (ice), liquid (water) and gas (water vapour). Heating or cooling changes one state into another.'
      picture:
        kind: flow
        steps:
        - Ice (solid)
        - melting
        - Water (liquid)
        - evaporation
        - Vapour (gas)
        alt: Ice melts into water, and water evaporates into vapour when heated.
      check:
        prompt: Steam from a kettle is water in which state?
        options:
        - Gas
        - Solid
        - Liquid
        answer: Gas
        why: Water vapour is the gas state of water.
    - teach: Melting turns ice into water (at 0 °C); freezing turns water into ice. Evaporation turns water into vapour from the surface at any temperature; boiling is fast change at 100 °C. Condensation turns vapour back into water when it cools, like drops on a cold glass or dew on grass.
      check:
        prompt: Your breath makes a mirror misty. Which change is this?
        options:
        - Condensation
        - Melting
        - Evaporation
        answer: Condensation
        why: Warm vapour in your breath cools on the mirror and turns to tiny drops.
    - teach: 'Evaporation is faster when it is hot, windy, the air is dry and the water is spread out wide. Evaporation also cools: sweat cools our skin, and water seeping through a matka evaporates and keeps the water inside cool.'
      check:
        prompt: 'Wet clothes are spread out instead of being left in a heap because:'
        options:
        - A wider surface helps water evaporate faster
        - Heaps are heavier
        - Spreading adds water
        answer: A wider surface helps water evaporate faster
        why: More surface open to air means faster evaporation.
  items:
  - prompt: What is the change from ice to water called?
    options:
    - Melting
    - Freezing
    - Condensation
    - Evaporation
    answer: Melting
    difficulty: 1
    hints:
    - Solid to liquid.
    - Ice cream in the sun.
    solution: Solid to liquid is melting.
    mistakes: {"Freezing": "t6_melting", "Condensation": "t6_melting"}
  - prompt: 'Drops of water form outside a glass of cold water. This is:'
    options:
    - Condensation
    - Evaporation
    - Melting
    - Boiling
    answer: Condensation
    difficulty: 1
    hints:
    - Vapour from air cools on the glass.
    - Gas to liquid.
    solution: Water vapour in the air condenses on the cold glass.
    mistakes:
      Evaporation: c6s_evap_cond
  - prompt: 'Wet clothes dry because water:'
    options:
    - evaporates
    - condenses
    - freezes
    - melts
    answer: evaporates
    difficulty: 1
    hints:
    - Liquid to vapour.
    - Into the air.
    solution: Water evaporates from the clothes.
    mistakes: {"condenses": "t6_evaporates", "freezes": "t6_evaporates"}
  - prompt: 'Clothes dry faster on a:'
    options:
    - sunny, windy day
    - cold, still day
    - rainy day
    - foggy day
    answer: sunny, windy day
    difficulty: 2
    hints:
    - Heat and wind speed up evaporation.
    - Dry air too.
    solution: Heat and wind speed up evaporation.
    mistakes: {"cold, still day": "t6_dry_faster", "rainy day": "t6_dry_faster"}
  - prompt: Why does water in an earthen pot (matka) stay cool?
    options:
    - Water seeping through evaporates and takes away heat
    - Clay is cold
    - Clay makes ice
    - The pot is painted
    answer: Water seeping through evaporates and takes away heat
    difficulty: 2
    hints:
    - Evaporation causes cooling.
    - Tiny pores.
    solution: Evaporation from the pot's surface cools the water inside.
    mistakes: {"Clay is cold": "t6_matka", "Clay makes ice": "t6_matka"}
  - prompt: Ice melts at 0 °C and water boils at 100 °C. What is the difference between these temperatures (in °C)?
    answer: '100'
    check: 100 - 0
    difficulty: 1
    hints:
    - "Subtract the melting point from the boiling point."
    - Subtract.
    solution: 100 − 0 = 100 °C.
    mistakes: {"0": "t6_temp_difference", "1": "t6_temp_difference"}
  - prompt: 'Water in an ice tray turns into ice cubes in the freezer. This change is:'
    options:
    - Freezing
    - Melting
    - Condensation
    answer: Freezing
    difficulty: 1
    hints:
    - Liquid to solid.
    - Heat is taken away.
    solution: 'Step 1: water (liquid) becomes ice (solid). Step 2: that change is freezing.'
    mistakes:
      Melting: c6s8_names
      Condensation: c6s8_names
  - prompt: 'A puddle on the road disappears on a sunny afternoon. The water has:'
    options:
    - Evaporated
    - Frozen
    - Condensed
    answer: Evaporated
    difficulty: 1
    hints:
    - Where did the water go?
    - Into the air as vapour.
    solution: 'Step 1: the Sun''s heat turned the water into vapour. Step 2: so it evaporated.'
    mistakes:
      Frozen: c6s8_names
      Condensed: c6s8_names
  - prompt: 'Tiny drops of water on grass on a cold winter morning are:'
    options:
    - Dew, formed by condensation
    - Rain, formed by melting
    - Steam
    answer: Dew, formed by condensation
    difficulty: 2
    hints:
    - It didn't rain.
    - Vapour in the air cooled on the cold grass.
    solution: 'Step 1: water vapour in the air touched the cold grass. Step 2: it cooled and condensed into dew.'
    mistakes:
      Rain, formed by melting: c6s8_names
      Steam: c6s8_names
  - prompt: In which change is heat taken away from water?
    options:
    - Freezing
    - Melting
    - Boiling
    answer: Freezing
    difficulty: 2
    hints:
    - Which change happens in a freezer?
    - Cooling removes heat.
    solution: 'Step 1: melting and boiling need heat. Step 2: freezing happens when heat is removed.'
    mistakes:
      Melting: c6s8_heat
      Boiling: c6s8_heat
  - prompt: Clothes dry fastest on which day?
    options:
    - Hot, dry and windy
    - Cold and still
    - Humid and cloudy
    answer: Hot, dry and windy
    difficulty: 1
    hints:
    - Heat, wind and dry air help evaporation.
    - Which day has all three?
    solution: 'Step 1: heat and wind speed up evaporation. Step 2: dry air takes in vapour easily, so hot, dry, windy is fastest.'
    mistakes:
      Cold and still: c6s8_faster
      Humid and cloudy: c6s8_faster
  - prompt: Why do we feel cool after sweating on a breezy day?
    options:
    - Sweat evaporates and takes heat from the skin
    - Sweat is cold water
    - The breeze adds ice
    answer: Sweat evaporates and takes heat from the skin
    difficulty: 2
    hints:
    - Evaporation needs heat.
    - Where does that heat come from?
    solution: 'Step 1: sweat evaporates using heat from the skin. Step 2: losing that heat makes us feel cool.'
    mistakes:
      Sweat is cold water: c6s8_cool
      The breeze adds ice: c6s8_cool
  - prompt: Water is spread on a plate and the same amount kept in a narrow glass. Which dries first?
    options:
    - The plate
    - The glass
    - Both together
    answer: The plate
    difficulty: 2
    hints:
    - Compare the surface open to air.
    - Evaporation happens at the surface.
    solution: 'Step 1: the plate gives a much wider surface. Step 2: more surface means faster evaporation.'
    mistakes:
      The glass: c6s8_faster
      Both together: c6s8_faster
  - prompt: Water boils at 100 °C and freezes at 0 °C. Water at 60 °C is in which state?
    options:
    - Liquid
    - Solid
    - Gas only
    answer: Liquid
    difficulty: 1
    hints:
    - 60 is between 0 and 100.
    - Between freezing and boiling, water is...
    solution: 'Step 1: 60 °C is above freezing and below boiling. Step 2: so the water is liquid.'
    mistakes:
      Solid: c6s8_names
      Gas only: c6s8_names
  - prompt: Why is ice used in a cold box to keep drinks cool?
    options:
    - Melting ice takes in heat from the drinks
    - Ice gives out heat
    - Ice is a gas
    answer: Melting ice takes in heat from the drinks
    difficulty: 3
    hints:
    - Melting needs heat.
    - Where does the ice get it from?
    solution: 'Step 1: ice needs heat to melt. Step 2: it takes that heat from the drinks around it, cooling them.'
    mistakes:
      Ice gives out heat: c6s8_heat
      Ice is a gas: c6s8_names
- code: cbse6s.water.cycle
  title: The water cycle and saving water
  after:
  - cbse6s.water.states
  notes: |
    Water cycle: sun heats water in oceans, rivers and lakes → evaporation; plants release vapour (transpiration);
    vapour rises, cools, condenses into tiny droplets → clouds; droplets join → precipitation (rain, snow, hail); water
    flows back through rivers and soaks into the ground (groundwater). Too little rain → drought; too much → floods.
    Conserve: rainwater harvesting, fixing leaks, reusing water.
  explanations:
    text: Water goes round and round. The sun heats seas and lakes, and water evaporates. The vapour rises, cools and condenses into clouds. When drops get heavy, they fall as rain. Rain fills rivers, soaks into the ground and returns to the sea. This is the water cycle.
    visual: Draw the sea, the sun above it, arrows going up (evaporation), a cloud (condensation), rain falling on mountains (precipitation) and a river flowing back to the sea (collection).
    step_by_step: 'Step 1: Evaporation from water bodies and plants. Step 2: Vapour rises and cools. Step 3: Condensation forms clouds. Step 4: Precipitation as rain or snow. Step 5: Collection in rivers, lakes and the ground.'
    real_world: 'Kerala''s monsoon is the water cycle in action: moist winds from the Arabian Sea bring heavy rain each June.'
  picture:
    kind: flow
    steps:
    - Evaporation
    - Condensation into clouds
    - Precipitation (rain)
    - Collection in rivers and ground
    - Back to the sea
    alt: 'The water cycle: evaporation, condensation into clouds, rain, collection in rivers and ground, and back to the sea.'
  activity:
    type: order
    prompt: Put the water cycle in order, starting with the Sun.
    steps:
    - The Sun heats water in seas and rivers
    - Water evaporates into vapour
    - Vapour rises and cools
    - 'It condenses into tiny drops: clouds'
    - Drops join and fall as rain
    - Water flows back to rivers and seas
    reasons:
      Water evaporates into vapour: The Sun's heat is what makes water evaporate.
      Vapour rises and cools: There's no vapour to rise until water evaporates.
      'It condenses into tiny drops: clouds': Vapour turns into drops only when it cools high up.
      Drops join and fall as rain: Rain comes from the drops in clouds.
      Water flows back to rivers and seas: The rain has to fall first.
  lesson:
    - teach: 'Water keeps moving between the Earth and the sky: this is the water cycle. The Sun heats oceans, rivers and lakes, and water evaporates. Plants also give out vapour from their leaves (transpiration).'
      picture:
        kind: flow
        steps:
        - Evaporation
        - Condensation (clouds)
        - Precipitation (rain)
        - Collection (rivers, ground)
        alt: 'The water cycle: water evaporates, condenses into clouds, falls as rain, and collects in rivers and the ground.'
      check:
        prompt: What gives energy for evaporation in the water cycle?
        options:
        - The Sun
        - The Moon
        - The wind alone
        answer: The Sun
        why: The Sun's heat makes water evaporate.
    - teach: 'Vapour rises and cools high up. It condenses into tiny drops that form clouds. Drops join into bigger ones and fall as precipitation: rain, snow or hail. Water flows back into rivers and seas or soaks into the ground as groundwater.'
      check:
        prompt: 'Water that soaks into the soil and is stored below is called:'
        options:
        - Groundwater
        - Cloud water
        - Vapour
        answer: Groundwater
        why: It collects underground and fills wells and handpumps.
    - teach: 'Too little rain for a long time causes drought; too much causes floods. We can save water: rainwater harvesting, fixing leaking taps, watering plants with used water, and protecting lakes and ponds.'
      check:
        prompt: Which saves the most water at home?
        options:
        - Fixing a dripping tap
        - Leaving the tap open while brushing
        - Washing the car with a running hose
        answer: Fixing a dripping tap
        why: A dripping tap wastes many litres every day.
  items:
  - prompt: 'Clouds form when water vapour:'
    options:
    - condenses
    - evaporates
    - melts
    - boils
    answer: condenses
    difficulty: 1
    hints:
    - Vapour cools high up.
    - Tiny droplets.
    solution: Clouds are condensed droplets.
    mistakes: {"evaporates": "t6_condenses", "boils": "t6_condenses"}
  - prompt: 'Water falling from clouds as rain, snow or hail is called:'
    options:
    - Precipitation
    - Evaporation
    - Transpiration
    - Condensation
    answer: Precipitation
    difficulty: 1
    hints:
    - It comes down.
    - Rain.
    solution: This is precipitation.
    mistakes: {"Evaporation": "t6_precipitation", "Condensation": "t6_precipitation"}
  - prompt: 'Plants give out water vapour through their leaves. This is:'
    options:
    - Transpiration
    - Precipitation
    - Condensation
    - Freezing
    answer: Transpiration
    difficulty: 2
    hints:
    - Tiny pores in leaves.
    - Plants 'sweat'.
    solution: Water loss from leaves is transpiration.
    mistakes: {"Precipitation": "t6_transpiration", "Condensation": "t6_transpiration"}
  - prompt: What gives the energy for the water cycle?
    options:
    - The Sun
    - The Moon
    - Wind only
    - Electricity
    answer: The Sun
    difficulty: 1
    hints:
    - It heats the water.
    - Evaporation needs heat.
    solution: The Sun's heat drives evaporation.
    mistakes: {"The Moon": "t6_sun_energy", "Electricity": "t6_sun_energy"}
  - prompt: 'Collecting rainwater from rooftops to use later is called:'
    options:
    - Rainwater harvesting
    - Deforestation
    - Evaporation
    - Flooding
    answer: Rainwater harvesting
    difficulty: 1
    hints:
    - Save rain.
    - Tanks or pits.
    solution: This is rainwater harvesting.
    mistakes: {"Deforestation": "t6_harvesting", "Flooding": "t6_harvesting"}
  - prompt: 'Long periods without rain can cause:'
    options:
    - Drought
    - Flood
    - Snowfall
    - High tides
    answer: Drought
    difficulty: 2
    hints:
    - Soil dries out.
    - Crops fail.
    solution: No rain for a long time causes drought.
    mistakes: {"Flood": "t6_drought", "Snowfall": "t6_drought"}
  - prompt: 'Clouds are made of:'
    options:
    - Tiny drops of water or ice
    - Smoke
    - Cotton-like dust
    answer: Tiny drops of water or ice
    difficulty: 1
    hints:
    - Clouds form when vapour cools.
    - Cooling vapour makes drops.
    solution: 'Step 1: vapour condenses high up. Step 2: clouds are tiny drops of water or ice crystals.'
    mistakes:
      Smoke: c6s8_cycle
      Cotton-like dust: c6s8_cycle
  - prompt: 'Arrange in order: rain, evaporation, cloud forming, rivers flow to the sea.'
    options:
    - Evaporation, cloud forming, rain, rivers flow to the sea
    - Rain, evaporation, rivers, clouds
    - Clouds, rivers, rain, evaporation
    answer: Evaporation, cloud forming, rain, rivers flow to the sea
    difficulty: 2
    hints:
    - Water must first go up.
    - Clouds come before rain.
    solution: 'Step 1: water evaporates and forms clouds. Step 2: rain falls and rivers carry it to the sea.'
    mistakes:
      Rain, evaporation, rivers, clouds: c6s8_cycle
      Clouds, rivers, rain, evaporation: c6s8_cycle
  - prompt: 'Hail is a form of:'
    options:
    - Precipitation
    - Evaporation
    - Transpiration
    answer: Precipitation
    difficulty: 1
    hints:
    - Hail falls from clouds.
    - What is falling water called?
    solution: 'Step 1: hail is ice falling from clouds. Step 2: anything falling from clouds is precipitation.'
    mistakes:
      Evaporation: c6s8_cycle
      Transpiration: c6s8_cycle
  - prompt: 'A plastic bag tied over leafy branches gets drops inside after a few hours. The water came from:'
    options:
    - Transpiration from the leaves
    - Rain
    - The plastic
    answer: Transpiration from the leaves
    difficulty: 2
    hints:
    - No rain fell into the bag.
    - Leaves give out vapour.
    solution: 'Step 1: leaves gave out water vapour. Step 2: it condensed on the bag: transpiration.'
    mistakes:
      Rain: c6s8_cycle
      The plastic: c6s8_cycle
  - prompt: Why does cutting forests reduce rain in an area over time?
    options:
    - Fewer plants means less transpiration
    - Trees make clouds heavier
    - Forests stop the Sun
    answer: Fewer plants means less transpiration
    difficulty: 3
    hints:
    - Plants add vapour to the air.
    - Less vapour means fewer clouds.
    solution: 'Step 1: trees release lots of vapour by transpiration. Step 2: fewer trees means less vapour and less rain.'
    mistakes:
      Trees make clouds heavier: c6s8_cycle
      Forests stop the Sun: c6s8_cycle
  - prompt: 'Rooftop rainwater is piped into a pit to refill the ground. This is:'
    options:
    - Rainwater harvesting
    - Condensation
    - Drought
    answer: Rainwater harvesting
    difficulty: 1
    hints:
    - Rain is being caught and saved.
    - It is a way to save water.
    solution: 'Step 1: rain from the roof is collected. Step 2: sending it into the ground is rainwater harvesting.'
    mistakes:
      Condensation: c6s8_save
      Drought: c6s8_save
  - prompt: 'Very heavy rain for many days can cause:'
    options:
    - Floods
    - Drought
    - Snow in deserts
    answer: Floods
    difficulty: 1
    hints:
    - Too much water.
    - Rivers overflow.
    solution: 'Step 1: lots of rain fills rivers. Step 2: they overflow, causing floods.'
    mistakes:
      Drought: c6s8_cycle
      Snow in deserts: c6s8_cycle
  - prompt: Which is a good way to reuse water at home?
    options:
    - Water plants with water used to wash vegetables
    - Throw used water into the drain
    - Keep taps running
    answer: Water plants with water used to wash vegetables
    difficulty: 1
    hints:
    - Reuse means using it again.
    - Which one gives the water a second job?
    solution: 'Step 1: vegetable-washing water is still clean enough. Step 2: using it for plants reuses it.'
    mistakes:
      Throw used water into the drain: c6s8_save
      Keep taps running: c6s8_save
  - prompt: Why do we say the total water on Earth stays about the same?
    options:
    - It keeps changing state and moving, but is not lost
    - New water is made every day
    - Water is destroyed in rain
    answer: It keeps changing state and moving, but is not lost
    difficulty: 3
    hints:
    - Think of the cycle as a loop.
    - Where does evaporated water go?
    solution: 'Step 1: water evaporates, condenses and falls again. Step 2: it changes place and state but stays on Earth.'
    mistakes:
      New water is made every day: c6s8_cycle
      Water is destroyed in rain: c6s8_cycle
