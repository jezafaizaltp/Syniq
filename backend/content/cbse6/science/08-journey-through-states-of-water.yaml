# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 8. Format: content/README.md.
subject: cbse6-sci
chapter: 8
title: A Journey through States of Water
tips:
  c6s_evap_cond: "Evaporation needs heat and makes vapour. Here the air touching a cold glass loses heat and its vapour becomes drops. What is that change?"
  t6_condenses: "When water vapour cools, it turns into tiny drops. What is that called?"
  t6_drought: "A long time without rain causes a shortage of water."
  t6_dry_faster: "Heat and wind help water evaporate faster."
  t6_evaporates: "Water on the clothes turns into vapour and goes into the air."
  t6_harvesting: "Deforestation and flooding don't save anything. Think of collecting rain like a farmer collects a crop."
  t6_matka: "Evaporation takes heat away. Where does the water evaporate from in a clay pot?"
  t6_melting: "Freezing turns water into ice. Ice turning into water is the opposite change. What is it called?"
