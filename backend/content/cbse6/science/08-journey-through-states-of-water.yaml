concepts:
- code: cbse6s.water.states
  title: Three states and changes of state
  notes: |
    Water exists as solid (ice), liquid (water) and gas (water vapour). Melting: ice → water (at 0 °C). Freezing: water →
    ice. Evaporation: water → vapour at any temperature from the surface (faster with heat, wind, larger surface area,
    dry air). Boiling: rapid change at 100 °C. Condensation: vapour → water on cooling (droplets on a cold glass, dew).
    Evaporation causes cooling (sweat, earthen pots/matka).
  explanations:
    text: Water can be solid ice, liquid water or invisible water vapour. Heating ice melts it; heating water makes it evaporate. Cooling vapour turns it back into droplets (condensation), and cooling water enough freezes it.
    visual: 'Put ice in a steel glass. The ice melts into water. Drops appear on the outside of the cold glass: vapour from the air has condensed. Leave water in a plate in the sun: it slowly evaporates.'
    step_by_step: 'Step 1: Identify the starting state. Step 2: Is heat added or removed? Step 3: Added: solid → liquid → gas. Removed: gas → liquid → solid. Step 4: Name the change.'
    real_world: Wet clothes dry on a line by evaporation; water in a clay pot stays cool because some seeps out and evaporates.
  picture:
    kind: flow
    steps:
    - Ice (solid)
    - melting
    - Water (liquid)
    - evaporation
    - Water vapour (gas)
    alt: Heating takes water from ice to liquid by melting, then to vapour by evaporation; cooling reverses it.
  activity:
    type: scale
    min: -20
    max: 120
    step: 5
    start: 20
    unit: °C
    orientation: vertical
    prompt: Change the temperature of some water and see its state change.
    zones:
    - from: -20
      to: 0
      label: Ice (solid)
      says: Below 0 °C, the water freezes solid.
    - from: 0
      to: 100
      label: Water (liquid)
      says: Between 0 °C and 100 °C, it stays liquid.
    - from: 100
      to: 120
      label: Steam (gas)
      says: At 100 °C and above, it boils and turns to steam.
    goals:
    - prompt: Freeze the water.
      zone: Ice (solid)
    - prompt: Make it boil and turn to steam.
      zone: Steam (gas)
  items:
  - prompt: What is the change from ice to water called?
    options:
    - Melting
    - Freezing
    - Condensation
    - Evaporation
    answer: Melting
    difficulty: 1
    hints:
    - Solid to liquid.
    - Ice cream in the sun.
    solution: Solid to liquid is melting.
    mistakes: {"Freezing": "t6_melting", "Condensation": "t6_melting"}
  - prompt: 'Drops of water form outside a glass of cold water. This is:'
    options:
    - Condensation
    - Evaporation
    - Melting
    - Boiling
    answer: Condensation
    difficulty: 1
    hints:
    - Vapour from air cools on the glass.
    - Gas to liquid.
    solution: Water vapour in the air condenses on the cold glass.
    mistakes:
      Evaporation: c6s_evap_cond
  - prompt: 'Wet clothes dry because water:'
    options:
    - evaporates
    - condenses
    - freezes
    - melts
    answer: evaporates
    difficulty: 1
    hints:
    - Liquid to vapour.
    - Into the air.
    solution: Water evaporates from the clothes.
    mistakes: {"condenses": "t6_evaporates", "freezes": "t6_evaporates"}
  - prompt: 'Clothes dry faster on a:'
    options:
    - sunny, windy day
    - cold, still day
    - rainy day
    - foggy day
    answer: sunny, windy day
    difficulty: 2
    hints:
    - Heat and wind speed up evaporation.
    - Dry air too.
    solution: Heat and wind speed up evaporation.
    mistakes: {"cold, still day": "t6_dry_faster", "rainy day": "t6_dry_faster"}
  - prompt: Why does water in an earthen pot (matka) stay cool?
    options:
    - Water seeping through evaporates and takes away heat
    - Clay is cold
    - Clay makes ice
    - The pot is painted
    answer: Water seeping through evaporates and takes away heat
    difficulty: 2
    hints:
    - Evaporation causes cooling.
    - Tiny pores.
    solution: Evaporation from the pot's surface cools the water inside.
    mistakes: {"Clay is cold": "t6_matka", "Clay makes ice": "t6_matka"}
  - prompt: Ice melts at 0 °C and water boils at 100 °C. What is the difference between these temperatures (in °C)?
    answer: '100'
    check: 100 - 0
    difficulty: 1
    hints:
    - "Subtract the melting point from the boiling point."
    - Subtract.
    solution: 100 − 0 = 100 °C.
    mistakes: {"0": "t6_temp_difference", "1": "t6_temp_difference"}
- code: cbse6s.water.cycle
  title: The water cycle and saving water
  after:
  - cbse6s.water.states
  notes: |
    Water cycle: sun heats water in oceans, rivers and lakes → evaporation; plants release vapour (transpiration);
    vapour rises, cools, condenses into tiny droplets → clouds; droplets join → precipitation (rain, snow, hail); water
    flows back through rivers and soaks into the ground (groundwater). Too little rain → drought; too much → floods.
    Conserve: rainwater harvesting, fixing leaks, reusing water.
  explanations:
    text: Water goes round and round. The sun heats seas and lakes, and water evaporates. The vapour rises, cools and condenses into clouds. When drops get heavy, they fall as rain. Rain fills rivers, soaks into the ground and returns to the sea. This is the water cycle.
    visual: Draw the sea, the sun above it, arrows going up (evaporation), a cloud (condensation), rain falling on mountains (precipitation) and a river flowing back to the sea (collection).
    step_by_step: 'Step 1: Evaporation from water bodies and plants. Step 2: Vapour rises and cools. Step 3: Condensation forms clouds. Step 4: Precipitation as rain or snow. Step 5: Collection in rivers, lakes and the ground.'
    real_world: 'Kerala''s monsoon is the water cycle in action: moist winds from the Arabian Sea bring heavy rain each June.'
  picture:
    kind: flow
    steps:
    - Evaporation
    - Condensation into clouds
    - Precipitation (rain)
    - Collection in rivers and ground
    - Back to the sea
    alt: 'The water cycle: evaporation, condensation into clouds, rain, collection in rivers and ground, and back to the sea.'
  activity:
    type: order
    prompt: Put the water cycle in order, starting with the Sun.
    steps:
    - The Sun heats water in seas and rivers
    - Water evaporates into vapour
    - Vapour rises and cools
    - 'It condenses into tiny drops: clouds'
    - Drops join and fall as rain
    - Water flows back to rivers and seas
    reasons:
      Water evaporates into vapour: The Sun's heat is what makes water evaporate.
      Vapour rises and cools: There's no vapour to rise until water evaporates.
      'It condenses into tiny drops: clouds': Vapour turns into drops only when it cools high up.
      Drops join and fall as rain: Rain comes from the drops in clouds.
      Water flows back to rivers and seas: The rain has to fall first.
  items:
  - prompt: 'Clouds form when water vapour:'
    options:
    - condenses
    - evaporates
    - melts
    - boils
    answer: condenses
    difficulty: 1
    hints:
    - Vapour cools high up.
    - Tiny droplets.
    solution: Clouds are condensed droplets.
    mistakes: {"evaporates": "t6_condenses", "boils": "t6_condenses"}
  - prompt: 'Water falling from clouds as rain, snow or hail is called:'
    options:
    - Precipitation
    - Evaporation
    - Transpiration
    - Condensation
    answer: Precipitation
    difficulty: 1
    hints:
    - It comes down.
    - Rain.
    solution: This is precipitation.
    mistakes: {"Evaporation": "t6_precipitation", "Condensation": "t6_precipitation"}
  - prompt: 'Plants give out water vapour through their leaves. This is:'
    options:
    - Transpiration
    - Precipitation
    - Condensation
    - Freezing
    answer: Transpiration
    difficulty: 2
    hints:
    - Tiny pores in leaves.
    - Plants 'sweat'.
    solution: Water loss from leaves is transpiration.
    mistakes: {"Precipitation": "t6_transpiration", "Condensation": "t6_transpiration"}
  - prompt: What gives the energy for the water cycle?
    options:
    - The Sun
    - The Moon
    - Wind only
    - Electricity
    answer: The Sun
    difficulty: 1
    hints:
    - It heats the water.
    - Evaporation needs heat.
    solution: The Sun's heat drives evaporation.
    mistakes: {"The Moon": "t6_sun_energy", "Electricity": "t6_sun_energy"}
  - prompt: 'Collecting rainwater from rooftops to use later is called:'
    options:
    - Rainwater harvesting
    - Deforestation
    - Evaporation
    - Flooding
    answer: Rainwater harvesting
    difficulty: 1
    hints:
    - Save rain.
    - Tanks or pits.
    solution: This is rainwater harvesting.
    mistakes: {"Deforestation": "t6_harvesting", "Flooding": "t6_harvesting"}
  - prompt: 'Long periods without rain can cause:'
    options:
    - Drought
    - Flood
    - Snowfall
    - High tides
    answer: Drought
    difficulty: 2
    hints:
    - Soil dries out.
    - Crops fail.
    solution: No rain for a long time causes drought.
    mistakes: {"Flood": "t6_drought", "Snowfall": "t6_drought"}
