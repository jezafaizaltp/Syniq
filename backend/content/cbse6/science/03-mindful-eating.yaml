# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 3. Format: content/README.md.
subject: cbse6-sci
chapter: 3
title: 'Mindful Eating: A Path to a Healthy Body'
tips:
  c6s_nutrient_test: "Each test colour points to one nutrient: blue-black for one, violet for another, an oily patch for fat. Match the colour in the question to its nutrient."
  t6_balanced: "A balanced diet has all nutrients, not just one kind of food."
  t6_carbs_energy: "Rice, wheat and potatoes give energy. Which nutrient are they rich in?"
  t6_fibre: "Fibre is not digested. How does that help the gut?"
  t6_iodine: "Iodine is needed by the thyroid in the neck. Lack of it makes the thyroid swell."
  t6_iron: "Iron makes red blood cells. Without enough, a person becomes pale and tired."
  t6_junk_food: "Junk food fills you with fat, salt or sugar. What does it lack?"
  t6_millet: "Millets are small, hardy grains that grow with little water. Rice is a big-water crop, and a potato is not a grain at all."
  t6_oil_patch: "Which nutrient leaves a see-through greasy patch on paper?"
  t6_protein: "Dal, eggs and fish build the body. Which nutrient is that?"
  t6_vitamin_c: "Scurvy was cured on long sea voyages by eating lemons and oranges. Which vitamin are those fruits famous for?"
concepts:
- code: cbse6s.food.nutrients
  title: Nutrients and a balanced diet
  notes: |
    Food gives nutrients: carbohydrates (energy: rice, wheat, potato), fats (more energy: ghee, oil, nuts), proteins
    (body-building and repair: dal, eggs, milk, fish), vitamins and minerals (protection and health: fruits, vegetables),
    plus dietary fibre (roughage, helps digestion) and water. A balanced diet has all of these in the right amounts.
    India has a wide variety of regional foods; millets (ragi, jowar, bajra) are nutritious. Eat mindfully: chew well,
    don't overeat, avoid too much junk food.
  explanations:
    text: Food contains nutrients. Carbohydrates and fats give energy. Proteins build and repair the body. Vitamins and minerals protect us. Fibre helps digestion, and we need water too. A balanced diet has all of them in the right amounts.
    visual: 'Picture a thali: rice or roti (carbohydrate), dal (protein), a little ghee (fat), sabzi and salad (vitamins, minerals, fibre), and a glass of water.'
    step_by_step: 'Step 1: List what is on your plate. Step 2: Name the main nutrient in each food. Step 3: Check every group is present. Step 4: Add what is missing.'
    real_world: A Kerala lunch of rice, sambar, thoran, fish curry and buttermilk covers most nutrient groups.
  picture:
    kind: compare
    columns:
    - title: Nutrient
      points:
      - Carbohydrate
      - Protein
      - Vitamins and minerals
    - title: Main job
      points:
      - energy
      - growth and repair
      - protection from disease
    - title: Food
      points:
      - rice, roti
      - dal, egg, fish
      - fruits, vegetables
    alt: Carbohydrates in rice give energy, proteins in dal and fish build the body, and vitamins and minerals in fruits and vegetables protect us.
  activity:
    type: sort
    prompt: Which nutrient does each food give most?
    bins:
    - Carbohydrates
    - Proteins
    - Fats
    - Vitamins and minerals
    items:
    - label: Rice
      bin: Carbohydrates
      clue: Is it mainly for energy?
      why: 'Rice is mostly starch: carbohydrates.'
    - label: Potato
      bin: Carbohydrates
      clue: Is it starchy?
      why: 'Potato is full of starch: carbohydrates.'
    - label: Dal
      bin: Proteins
      clue: Does it help the body grow and repair?
      why: Dal is rich in protein.
    - label: Egg
      bin: Proteins
      clue: Does it help build muscles?
      why: Egg is rich in protein.
    - label: Ghee
      bin: Fats
      clue: Is it oily or greasy?
      why: Ghee is fat.
    - label: Groundnuts
      bin: Fats
      why: Nuts have a lot of fat (and some protein).
      clue: 'Press one on paper: does it leave an oily mark?'
    - label: Orange
      bin: Vitamins and minerals
      clue: Which vitamin are oranges famous for?
      why: 'Oranges give vitamin C: vitamins and minerals.'
    - label: Spinach
      bin: Vitamins and minerals
      clue: What do green leaves give, like iron?
      why: Spinach gives iron and vitamins.
  items:
  - prompt: Which nutrient mainly gives energy?
    options:
    - Carbohydrates
    - Vitamins
    - Minerals
    - Water
    answer: Carbohydrates
    difficulty: 1
    hints:
    - Rice and wheat are rich in it.
    - Energy food.
    solution: Carbohydrates are energy-giving.
    mistakes: {"Vitamins": "t6_carbs_energy", "Water": "t6_carbs_energy"}
  - prompt: 'Dal, eggs and fish are rich in:'
    options:
    - Proteins
    - Fats only
    - Fibre only
    - Carbohydrates only
    answer: Proteins
    difficulty: 1
    hints:
    - Body-building food.
    - Muscles.
    solution: They are rich in protein.
    mistakes: {"Fats only": "t6_protein", "Carbohydrates only": "t6_protein"}
  - prompt: What does dietary fibre do?
    options:
    - Helps digestion and clears the bowels
    - Gives most energy
    - Builds muscles
    - Protects eyes
    answer: Helps digestion and clears the bowels
    difficulty: 1
    hints:
    - Found in vegetables, whole grains.
    - Roughage.
    solution: Fibre helps food move through the gut.
    mistakes: {"Gives most energy": "t6_fibre", "Builds muscles": "t6_fibre"}
  - prompt: 'A balanced diet means:'
    options:
    - all nutrients in the right amounts
    - only fruits
    - lots of sweets
    - eating once a day
    answer: all nutrients in the right amounts
    difficulty: 1
    hints:
    - Balance = nothing missing, nothing too much.
    - All groups.
    solution: A balanced diet has all nutrients in proper amounts.
    mistakes: {"only fruits": "t6_balanced", "eating once a day": "t6_balanced"}
  - prompt: Which is a millet?
    options:
    - Ragi
    - Rice
    - Potato
    - Wheat
    answer: Ragi
    difficulty: 2
    hints:
    - Small grains like jowar and bajra.
    - Finger millet.
    solution: Ragi (finger millet) is a millet.
    mistakes: {"Rice": "t6_millet", "Potato": "t6_millet"}
  - prompt: Why is too much junk food unhealthy?
    options:
    - It has lots of fat, salt or sugar and few other nutrients
    - It is too cheap
    - It has too much fibre
    - It is too cold
    answer: It has lots of fat, salt or sugar and few other nutrients
    difficulty: 2
    hints:
    - Think chips and cola.
    - What's missing?
    solution: Junk food is high in fat, salt or sugar and low in other nutrients.
    mistakes: {"It is too cheap": "t6_junk_food", "It has too much fibre": "t6_junk_food"}
- code: cbse6s.food.tests
  title: Testing food and deficiency diseases
  after:
  - cbse6s.food.nutrients
  notes: |
    Tests: starch, a few drops of dilute iodine turn blue-black; protein, copper sulphate + caustic soda solution turn
    violet; fat, rubbing on paper leaves an oily translucent patch. Deficiency diseases (lack of a nutrient for a long
    time): vitamin A, night blindness; vitamin C, scurvy (bleeding gums); vitamin D or calcium, rickets (soft bent
    bones); iron, anaemia (tiredness); iodine, goitre (swollen neck). Prevent by a balanced diet and iodised salt.
  explanations:
    text: 'We can test foods for nutrients. Iodine turns blue-black on starch. Fat leaves an oily patch on paper. If we miss a nutrient for a long time, we can get a deficiency disease: no vitamin C causes bleeding gums (scurvy), and no iron makes us tired (anaemia).'
    visual: 'Drop iodine on a slice of potato: it turns blue-black (starch). Rub a peanut on paper and hold it to light: an oily see-through patch (fat).'
    step_by_step: 'Step 1: Take a small sample. Step 2: Add the test chemical or rub on paper. Step 3: Watch for the colour or patch. Step 4: Decide which nutrient is present.'
    real_world: Iodised salt is used in Indian homes to prevent goitre; amla and guava are rich in vitamin C.
  picture:
    kind: compare
    columns:
    - title: Missing nutrient
      points:
      - Vitamin A
      - Vitamin C
      - Iron
      - Iodine
    - title: Disease
      points:
      - night blindness
      - scurvy
      - anaemia
      - goitre
    alt: Lack of vitamin A causes night blindness, vitamin C scurvy, iron anaemia and iodine goitre.
  activity:
    type: order
    prompt: Put the steps of the starch test in order.
    steps:
    - Take a small piece of food
    - Put it in a clean dish
    - Add 2 or 3 drops of dilute iodine
    - Watch the colour
    - Blue-black means starch is present
    reasons:
      Put it in a clean dish: You need the piece of food first.
      Add 2 or 3 drops of dilute iodine: The food should be in the dish before you add iodine.
      Watch the colour: There's nothing to watch until the iodine is on the food.
      Blue-black means starch is present: You can only decide after watching the colour.
  items:
  - prompt: 'Iodine solution turns blue-black when food contains:'
    options:
    - Starch
    - Protein
    - Fat
    - Water
    answer: Starch
    difficulty: 1
    hints:
    - Try it on a potato.
    - A carbohydrate.
    solution: Iodine turns blue-black with starch.
    mistakes:
      Protein: c6s_nutrient_test
  - prompt: 'An oily patch on paper shows the food has:'
    options:
    - Fat
    - Starch
    - Protein
    - Vitamin C
    answer: Fat
    difficulty: 1
    hints:
    - Hold the paper to light.
    - Translucent patch.
    solution: Fat leaves an oily patch.
    mistakes: {"Starch": "t6_oil_patch", "Protein": "t6_oil_patch"}
  - prompt: 'Bleeding gums (scurvy) is caused by lack of:'
    options:
    - Vitamin C
    - Vitamin A
    - Iron
    - Iodine
    answer: Vitamin C
    difficulty: 1
    hints:
    - Found in amla, oranges.
    - Citrus.
    solution: Scurvy is due to lack of vitamin C.
    mistakes: {"Vitamin A": "t6_vitamin_c", "Iron": "t6_vitamin_c"}
  - prompt: 'Lack of iron in the diet can cause:'
    options:
    - Anaemia
    - Goitre
    - Scurvy
    - Rickets
    answer: Anaemia
    difficulty: 1
    hints:
    - Blood needs iron.
    - Tiredness, pale skin.
    solution: Iron deficiency causes anaemia.
    mistakes: {"Goitre": "t6_iron", "Scurvy": "t6_iron"}
  - prompt: 'Iodised salt helps prevent:'
    options:
    - Goitre
    - Night blindness
    - Scurvy
    - Rickets
    answer: Goitre
    difficulty: 2
    hints:
    - Swelling in the neck.
    - Thyroid.
    solution: Iodine prevents goitre.
    mistakes: {"Night blindness": "t6_iodine", "Scurvy": "t6_iodine"}
  - prompt: 'A test with copper sulphate and caustic soda turns violet. The food has:'
    options:
    - Protein
    - Starch
    - Fat
    - Fibre
    answer: Protein
    difficulty: 2
    hints:
    - Violet colour test.
    - Body-building nutrient.
    solution: A violet colour shows protein.
    mistakes:
      Starch: c6s_nutrient_test
