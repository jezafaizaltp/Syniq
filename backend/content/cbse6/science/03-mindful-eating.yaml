# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 3. Format: content/README.md.
subject: cbse6-sci
chapter: 3
title: 'Mindful Eating: A Path to a Healthy Body'
tips:
  c6s_nutrient_test: "Each test colour points to one nutrient: blue-black for one, violet for another, an oily patch for fat. Match the colour in the question to its nutrient."
  t6_balanced: "A balanced diet has all nutrients, not just one kind of food."
  t6_carbs_energy: "Rice, wheat and potatoes give energy. Which nutrient are they rich in?"
  t6_fibre: "Fibre is not digested. How does that help the gut?"
  t6_iodine: "Iodine is needed by the thyroid in the neck. Lack of it makes the thyroid swell."
  t6_iron: "Iron makes red blood cells. Without enough, a person becomes pale and tired."
  t6_junk_food: "Junk food fills you with fat, salt or sugar. What does it lack?"
  t6_millet: "Millets are small, hardy grains that grow with little water. Rice is a big-water crop, and a potato is not a grain at all."
  t6_oil_patch: "Which nutrient leaves a see-through greasy patch on paper?"
  t6_protein: "Dal, eggs and fish build the body. Which nutrient is that?"
  t6_vitamin_c: "Scurvy was cured on long sea voyages by eating lemons and oranges. Which vitamin are those fruits famous for?"
  c6s3_job: 'Match the food to the job its main nutrient does: energy, body-building, protection or digestion.'
  c6s3_balance: A balanced plate has every nutrient group in sensible amounts, not just a lot of one.
  c6s3_test: Recall which test liquid or paper trick goes with which nutrient, and the colour or mark it gives.
  c6s3_lack: Link the sign in the body to the nutrient that was missing for a long time.
  c6s3_local: Think about foods grown nearby and in season; they are fresh and suit the region.
concepts:
- code: cbse6s.food.nutrients
  title: Nutrients and a balanced diet
  notes: |
    Food gives nutrients: carbohydrates (energy: rice, wheat, potato), fats (more energy: ghee, oil, nuts), proteins
    (body-building and repair: dal, eggs, milk, fish), vitamins and minerals (protection and health: fruits, vegetables),
    plus dietary fibre (roughage, helps digestion) and water. A balanced diet has all of these in the right amounts.
    India has a wide variety of regional foods; millets (ragi, jowar, bajra) are nutritious. Eat mindfully: chew well,
    don't overeat, avoid too much junk food.
  explanations:
    text: Food contains nutrients. Carbohydrates and fats give energy. Proteins build and repair the body. Vitamins and minerals protect us. Fibre helps digestion, and we need water too. A balanced diet has all of them in the right amounts.
    visual: 'Picture a thali: rice or roti (carbohydrate), dal (protein), a little ghee (fat), sabzi and salad (vitamins, minerals, fibre), and a glass of water.'
    step_by_step: 'Step 1: List what is on your plate. Step 2: Name the main nutrient in each food. Step 3: Check every group is present. Step 4: Add what is missing.'
    real_world: A Kerala lunch of rice, sambar, thoran, fish curry and buttermilk covers most nutrient groups.
  picture:
    kind: compare
    columns:
    - title: Nutrient
      points:
      - Carbohydrate
      - Protein
      - Vitamins and minerals
    - title: Main job
      points:
      - energy
      - growth and repair
      - protection from disease
    - title: Food
      points:
      - rice, roti
      - dal, egg, fish
      - fruits, vegetables
    alt: Carbohydrates in rice give energy, proteins in dal and fish build the body, and vitamins and minerals in fruits and vegetables protect us.
  activity:
    type: sort
    prompt: Which nutrient does each food give most?
    bins:
    - Carbohydrates
    - Proteins
    - Fats
    - Vitamins and minerals
    items:
    - label: Rice
      bin: Carbohydrates
      clue: Is it mainly for energy?
      why: 'Rice is mostly starch: carbohydrates.'
    - label: Potato
      bin: Carbohydrates
      clue: Is it starchy?
      why: 'Potato is full of starch: carbohydrates.'
    - label: Dal
      bin: Proteins
      clue: Does it help the body grow and repair?
      why: Dal is rich in protein.
    - label: Egg
      bin: Proteins
      clue: Does it help build muscles?
      why: Egg is rich in protein.
    - label: Ghee
      bin: Fats
      clue: Is it oily or greasy?
      why: Ghee is fat.
    - label: Groundnuts
      bin: Fats
      why: Nuts have a lot of fat (and some protein).
      clue: 'Press one on paper: does it leave an oily mark?'
    - label: Orange
      bin: Vitamins and minerals
      clue: Which vitamin are oranges famous for?
      why: 'Oranges give vitamin C: vitamins and minerals.'
    - label: Spinach
      bin: Vitamins and minerals
      clue: What do green leaves give, like iron?
      why: Spinach gives iron and vitamins.
  lesson:
    - teach: Food gives us nutrients. Carbohydrates (rice, wheat, potato) and fats (oil, ghee, nuts) give energy. Proteins (dal, milk, eggs, fish) build and repair the body.
      picture:
        kind: compare
        columns:
        - title: Energy
          points:
          - 'carbohydrates: rice, roti, potato'
          - 'fats: oil, ghee, nuts'
        - title: Body-building
          points:
          - 'proteins: dal, milk, egg, fish, paneer'
        - title: Protection
          points:
          - 'vitamins and minerals: fruits, green vegetables'
        alt: Carbohydrates and fats give energy, proteins build the body, vitamins and minerals protect it.
      check:
        prompt: Which food is rich in protein?
        options:
        - Rajma (kidney beans)
        - Sugar
        - Butter
        answer: Rajma (kidney beans)
        why: Pulses and beans are body-building foods.
    - teach: Vitamins and minerals keep us healthy and protect us from disease; fruits and vegetables are rich in them. Dietary fibre (roughage) from whole grains, fruits and vegetables helps food move through the gut. Water carries nutrients and removes waste.
      check:
        prompt: Which food has the most dietary fibre?
        options:
        - Whole fruit like guava
        - Fruit juice without pulp
        - Plain sugar
        answer: Whole fruit like guava
        why: Fibre is in the solid parts of plants; juice and sugar have little.
    - teach: A balanced diet has all nutrients, fibre and water in the right amounts for your age and activity. India's regional meals and millets like ragi, jowar and bajra can be very balanced. Mindful eating means eating slowly, stopping when full and choosing less junk food.
      check:
        prompt: Which meal is closest to balanced?
        options:
        - Rice, dal, vegetable curry, curd and a fruit
        - Chips and a cold drink
        - Only rice and pickle
        answer: Rice, dal, vegetable curry, curd and a fruit
        why: It has energy, protein, vitamins, minerals and fibre.
  items:
  - prompt: Which nutrient mainly gives energy?
    options:
    - Carbohydrates
    - Vitamins
    - Minerals
    - Water
    answer: Carbohydrates
    difficulty: 1
    hints:
    - Rice and wheat are rich in it.
    - Energy food.
    solution: Carbohydrates are energy-giving.
    mistakes: {"Vitamins": "t6_carbs_energy", "Water": "t6_carbs_energy"}
  - prompt: 'Dal, eggs and fish are rich in:'
    options:
    - Proteins
    - Fats only
    - Fibre only
    - Carbohydrates only
    answer: Proteins
    difficulty: 1
    hints:
    - Body-building food.
    - Muscles.
    solution: They are rich in protein.
    mistakes: {"Fats only": "t6_protein", "Carbohydrates only": "t6_protein"}
  - prompt: What does dietary fibre do?
    options:
    - Helps digestion and clears the bowels
    - Gives most energy
    - Builds muscles
    - Protects eyes
    answer: Helps digestion and clears the bowels
    difficulty: 1
    hints:
    - Found in vegetables, whole grains.
    - Roughage.
    solution: Fibre helps food move through the gut.
    mistakes: {"Gives most energy": "t6_fibre", "Builds muscles": "t6_fibre"}
  - prompt: 'A balanced diet means:'
    options:
    - all nutrients in the right amounts
    - only fruits
    - lots of sweets
    - eating once a day
    answer: all nutrients in the right amounts
    difficulty: 1
    hints:
    - Balance = nothing missing, nothing too much.
    - All groups.
    solution: A balanced diet has all nutrients in proper amounts.
    mistakes: {"only fruits": "t6_balanced", "eating once a day": "t6_balanced"}
  - prompt: Which is a millet?
    options:
    - Ragi
    - Rice
    - Potato
    - Wheat
    answer: Ragi
    difficulty: 2
    hints:
    - Small grains like jowar and bajra.
    - Finger millet.
    solution: Ragi (finger millet) is a millet.
    mistakes: {"Rice": "t6_millet", "Potato": "t6_millet"}
  - prompt: Why is too much junk food unhealthy?
    options:
    - It has lots of fat, salt or sugar and few other nutrients
    - It is too cheap
    - It has too much fibre
    - It is too cold
    answer: It has lots of fat, salt or sugar and few other nutrients
    difficulty: 2
    hints:
    - Think chips and cola.
    - What's missing?
    solution: Junk food is high in fat, salt or sugar and low in other nutrients.
    mistakes: {"It is too cheap": "t6_junk_food", "It has too much fibre": "t6_junk_food"}
  - prompt: Which nutrient gives the most energy per gram?
    options:
    - Fats
    - Proteins
    - Vitamins
    answer: Fats
    difficulty: 2
    hints:
    - Two nutrients give energy.
    - Ghee and oil are very rich.
    solution: 'Step 1: carbohydrates and fats give energy. Step 2: fats give about twice as much per gram.'
    mistakes:
      Proteins: c6s3_job
      Vitamins: c6s3_job
  - prompt: 'Roti and rice are mainly sources of:'
    options:
    - Carbohydrates
    - Proteins
    - Minerals
    answer: Carbohydrates
    difficulty: 1
    hints:
    - They are grains.
    - They give energy.
    solution: 'Step 1: grains are rich in starch. Step 2: starch is a carbohydrate.'
    mistakes:
      Proteins: c6s3_job
      Minerals: c6s3_job
  - prompt: A growing child needs extra of which nutrient to build muscles?
    options:
    - Proteins
    - Fats
    - Fibre
    answer: Proteins
    difficulty: 1
    hints:
    - Which nutrient is called 'body-building'?
    - Dal and milk are rich in it.
    solution: 'Step 1: muscles are built from protein. Step 2: so growing children need protein.'
    mistakes:
      Fats: c6s3_job
      Fibre: c6s3_job
  - prompt: Why is drinking enough water important?
    options:
    - It carries nutrients and removes waste
    - It gives lots of energy
    - It builds muscles
    answer: It carries nutrients and removes waste
    difficulty: 2
    hints:
    - Water has no energy.
    - Think about blood and urine.
    solution: 'Step 1: water gives no energy or protein. Step 2: it carries nutrients around the body and removes waste.'
    mistakes:
      It gives lots of energy: c6s3_job
      It builds muscles: c6s3_job
  - prompt: Which of these is a millet?
    options:
    - Jowar
    - Rice
    - Wheat
    answer: Jowar
    difficulty: 1
    hints:
    - Millets are small hardy grains.
    - Ragi and bajra are in the same family.
    solution: 'Step 1: rice and wheat are cereals, but not millets. Step 2: jowar (sorghum) is a millet.'
    mistakes:
      Rice: c6s3_local
      Wheat: c6s3_local
  - prompt: Why are millets called good for health and for farmers?
    options:
    - They are nutritious and grow with little water
    - They need a lot of water
    - They have no nutrients
    answer: They are nutritious and grow with little water
    difficulty: 2
    hints:
    - Millets grow in dry areas.
    - They are rich in fibre and minerals.
    solution: 'Step 1: millets are rich in fibre, minerals and protein. Step 2: they grow well even with little rain.'
    mistakes:
      They need a lot of water: c6s3_local
      They have no nutrients: c6s3_local
  - prompt: Which plate is missing body-building food?
    options:
    - Rice, potato curry and banana
    - Roti, dal and salad
    - Idli, sambar and curd
    answer: Rice, potato curry and banana
    difficulty: 3
    hints:
    - Look for dal, milk, curd, eggs or fish.
    - Which plate has none?
    solution: 'Step 1: dal, sambar and curd give protein. Step 2: rice, potato and banana have very little, so that plate lacks it.'
    mistakes:
      Roti, dal and salad: c6s3_balance
      Idli, sambar and curd: c6s3_balance
  - prompt: Which is an example of mindful eating?
    options:
    - Eating slowly and stopping when full
    - Eating while watching TV without noticing
    - Skipping breakfast every day
    answer: Eating slowly and stopping when full
    difficulty: 1
    hints:
    - Mindful means paying attention.
    - Which one listens to your body?
    solution: 'Step 1: mindful eating means paying attention to food and hunger. Step 2: eating slowly and stopping when full does that.'
    mistakes:
      Eating while watching TV without noticing: c6s3_balance
      Skipping breakfast every day: c6s3_balance
  - prompt: 'Eating too much fat and sugar and little exercise over years can lead to:'
    options:
    - Obesity
    - Night blindness
    - Scurvy
    answer: Obesity
    difficulty: 2
    hints:
    - Extra energy that isn't used is stored.
    - The others come from too little of a nutrient.
    solution: 'Step 1: too much energy food gets stored as fat. Step 2: over years this causes obesity.'
    mistakes:
      Night blindness: c6s3_lack
      Scurvy: c6s3_lack
- code: cbse6s.food.tests
  title: Testing food and deficiency diseases
  after:
  - cbse6s.food.nutrients
  notes: |
    Tests: starch, a few drops of dilute iodine turn blue-black; protein, copper sulphate + caustic soda solution turn
    violet; fat, rubbing on paper leaves an oily translucent patch. Deficiency diseases (lack of a nutrient for a long
    time): vitamin A, night blindness; vitamin C, scurvy (bleeding gums); vitamin D or calcium, rickets (soft bent
    bones); iron, anaemia (tiredness); iodine, goitre (swollen neck). Prevent by a balanced diet and iodised salt.
  explanations:
    text: 'We can test foods for nutrients. Iodine turns blue-black on starch. Fat leaves an oily patch on paper. If we miss a nutrient for a long time, we can get a deficiency disease: no vitamin C causes bleeding gums (scurvy), and no iron makes us tired (anaemia).'
    visual: 'Drop iodine on a slice of potato: it turns blue-black (starch). Rub a peanut on paper and hold it to light: an oily see-through patch (fat).'
    step_by_step: 'Step 1: Take a small sample. Step 2: Add the test chemical or rub on paper. Step 3: Watch for the colour or patch. Step 4: Decide which nutrient is present.'
    real_world: Iodised salt is used in Indian homes to prevent goitre; amla and guava are rich in vitamin C.
  picture:
    kind: compare
    columns:
    - title: Missing nutrient
      points:
      - Vitamin A
      - Vitamin C
      - Iron
      - Iodine
    - title: Disease
      points:
      - night blindness
      - scurvy
      - anaemia
      - goitre
    alt: Lack of vitamin A causes night blindness, vitamin C scurvy, iron anaemia and iodine goitre.
  activity:
    type: order
    prompt: Put the steps of the starch test in order.
    steps:
    - Take a small piece of food
    - Put it in a clean dish
    - Add 2 or 3 drops of dilute iodine
    - Watch the colour
    - Blue-black means starch is present
    reasons:
      Put it in a clean dish: You need the piece of food first.
      Add 2 or 3 drops of dilute iodine: The food should be in the dish before you add iodine.
      Watch the colour: There's nothing to watch until the iodine is on the food.
      Blue-black means starch is present: You can only decide after watching the colour.
  lesson:
    - teach: 'Simple tests show what a food contains. Starch: add 2–3 drops of dilute iodine; a blue-black colour means starch is present.'
      picture:
        kind: compare
        columns:
        - title: Potato + iodine
          points:
          - turns blue-black
          - starch present
        - title: Cucumber juice + iodine
          points:
          - stays brownish
          - little starch
        alt: Iodine turns potato blue-black because it has starch; cucumber juice stays brown.
      check:
        prompt: 'Rice water turns blue-black with iodine. It contains:'
        options:
        - Starch
        - Fat
        - Protein
        answer: Starch
        why: Blue-black with iodine is the starch test.
    - teach: 'Protein: mix the food with water, add copper sulphate solution and then caustic soda solution; violet means protein. Fat: rub the food on paper; an oily, see-through patch means fat.'
      check:
        prompt: 'Groundnut rubbed on paper leaves a see-through patch. It contains:'
        options:
        - Fat
        - Starch
        - Vitamin C
        answer: Fat
        why: An oily translucent patch is the fat test.
    - teach: 'If a nutrient is missing for a long time, a deficiency disease can follow. Vitamin A: night blindness. Vitamin C: scurvy (bleeding gums). Vitamin D or calcium: rickets (soft, bent bones). Iron: anaemia. Iodine: goitre. A balanced diet prevents them.'
      picture:
        kind: compare
        columns:
        - title: Vitamins
          points:
          - 'A: night blindness'
          - 'C: scurvy'
          - 'D: rickets'
        - title: Minerals
          points:
          - 'iron: anaemia'
          - 'iodine: goitre'
          - 'calcium: weak bones'
        alt: Missing vitamins A, C and D cause night blindness, scurvy and rickets; missing iron and iodine cause anaemia and goitre.
      check:
        prompt: A child cannot see well in dim light. Which vitamin may be lacking?
        options:
        - Vitamin A
        - Vitamin C
        - Vitamin D
        answer: Vitamin A
        why: Lack of vitamin A causes night blindness.
  items:
  - prompt: 'Iodine solution turns blue-black when food contains:'
    options:
    - Starch
    - Protein
    - Fat
    - Water
    answer: Starch
    difficulty: 1
    hints:
    - Try it on a potato.
    - A carbohydrate.
    solution: Iodine turns blue-black with starch.
    mistakes:
      Protein: c6s_nutrient_test
  - prompt: 'An oily patch on paper shows the food has:'
    options:
    - Fat
    - Starch
    - Protein
    - Vitamin C
    answer: Fat
    difficulty: 1
    hints:
    - Hold the paper to light.
    - Translucent patch.
    solution: Fat leaves an oily patch.
    mistakes: {"Starch": "t6_oil_patch", "Protein": "t6_oil_patch"}
  - prompt: 'Bleeding gums (scurvy) is caused by lack of:'
    options:
    - Vitamin C
    - Vitamin A
    - Iron
    - Iodine
    answer: Vitamin C
    difficulty: 1
    hints:
    - Found in amla, oranges.
    - Citrus.
    solution: Scurvy is due to lack of vitamin C.
    mistakes: {"Vitamin A": "t6_vitamin_c", "Iron": "t6_vitamin_c"}
  - prompt: 'Lack of iron in the diet can cause:'
    options:
    - Anaemia
    - Goitre
    - Scurvy
    - Rickets
    answer: Anaemia
    difficulty: 1
    hints:
    - Blood needs iron.
    - Tiredness, pale skin.
    solution: Iron deficiency causes anaemia.
    mistakes: {"Goitre": "t6_iron", "Scurvy": "t6_iron"}
  - prompt: 'Iodised salt helps prevent:'
    options:
    - Goitre
    - Night blindness
    - Scurvy
    - Rickets
    answer: Goitre
    difficulty: 2
    hints:
    - Swelling in the neck.
    - Thyroid.
    solution: Iodine prevents goitre.
    mistakes: {"Night blindness": "t6_iodine", "Scurvy": "t6_iodine"}
  - prompt: 'A test with copper sulphate and caustic soda turns violet. The food has:'
    options:
    - Protein
    - Starch
    - Fat
    - Fibre
    answer: Protein
    difficulty: 2
    hints:
    - Violet colour test.
    - Body-building nutrient.
    solution: A violet colour shows protein.
    mistakes:
      Starch: c6s_nutrient_test
  - prompt: Which test liquid is used to check for starch?
    options:
    - Dilute iodine
    - Copper sulphate
    - Lemon juice
    answer: Dilute iodine
    difficulty: 1
    hints:
    - The starch test gives a blue-black colour.
    - It is a brown liquid.
    solution: 'Step 1: copper sulphate is for protein. Step 2: dilute iodine is for starch.'
    mistakes:
      Copper sulphate: c6s3_test
      Lemon juice: c6s3_test
  - prompt: 'Boiled egg white with copper sulphate and caustic soda turns violet. This shows:'
    options:
    - Protein
    - Starch
    - Fat
    answer: Protein
    difficulty: 1
    hints:
    - Violet is the colour of one test.
    - Which test uses copper sulphate?
    solution: 'Step 1: copper sulphate + caustic soda is the protein test. Step 2: violet means protein is present.'
    mistakes:
      Starch: c6s3_test
      Fat: c6s3_test
  - prompt: Which food will NOT leave an oily patch on paper?
    options:
    - Cucumber
    - Butter
    - Coconut
    answer: Cucumber
    difficulty: 2
    hints:
    - The oily patch shows fat.
    - Which food has almost no fat?
    solution: 'Step 1: butter and coconut are fatty. Step 2: cucumber has very little fat, so no patch.'
    mistakes:
      Butter: c6s3_test
      Coconut: c6s3_test
  - prompt: 'Soft, bent leg bones in a child are a sign of:'
    options:
    - Rickets
    - Goitre
    - Anaemia
    answer: Rickets
    difficulty: 2
    hints:
    - Bones need calcium and vitamin D.
    - Which disease affects bones?
    solution: 'Step 1: bones become soft without vitamin D or calcium. Step 2: that disease is rickets.'
    mistakes:
      Goitre: c6s3_lack
      Anaemia: c6s3_lack
  - prompt: Which vitamin does our skin make in sunlight?
    options:
    - Vitamin D
    - Vitamin C
    - Vitamin A
    answer: Vitamin D
    difficulty: 2
    hints:
    - It helps bones use calcium.
    - Morning sun is a good source.
    solution: 'Step 1: skin makes this vitamin in sunlight. Step 2: it is vitamin D, which helps bones.'
    mistakes:
      Vitamin C: c6s3_lack
      Vitamin A: c6s3_lack
  - prompt: Amla, lemon and guava protect against which disease?
    options:
    - Scurvy
    - Goitre
    - Rickets
    answer: Scurvy
    difficulty: 2
    hints:
    - These sour fruits are rich in one vitamin.
    - Lack of it makes gums bleed.
    solution: 'Step 1: these fruits are rich in vitamin C. Step 2: vitamin C prevents scurvy.'
    mistakes:
      Goitre: c6s3_lack
      Rickets: c6s3_lack
  - prompt: A person is always tired and looks pale. Which food would help most?
    options:
    - Green leafy vegetables and jaggery (rich in iron)
    - More sugar
    - Fried snacks
    answer: Green leafy vegetables and jaggery (rich in iron)
    difficulty: 3
    hints:
    - Paleness and tiredness can mean anaemia.
    - Anaemia comes from lack of which mineral?
    solution: 'Step 1: these are signs of anaemia, from lack of iron. Step 2: iron-rich foods like greens and jaggery help.'
    mistakes:
      More sugar: c6s3_lack
      Fried snacks: c6s3_lack
  - prompt: Why is a few drops of iodine NOT safe to eat, even though we need iodine?
    options:
    - Test iodine solution is a chemical for testing, not food
    - Iodine is a vitamin
    - It turns food sweet
    answer: Test iodine solution is a chemical for testing, not food
    difficulty: 3
    hints:
    - We get our iodine from iodised salt.
    - Lab chemicals are never tasted.
    solution: 'Step 1: our body''s iodine comes from iodised salt in tiny amounts. Step 2: lab iodine solution is a chemical and must not be eaten.'
    mistakes:
      Iodine is a vitamin: c6s3_test
      It turns food sweet: c6s3_test
  - prompt: 'Bread turns blue-black with iodine and leaves no oily patch. Bread is mainly:'
    options:
    - Starch with little fat
    - Fat with no starch
    - Pure protein
    answer: Starch with little fat
    difficulty: 2
    hints:
    - Blue-black means one nutrient is there.
    - No patch means another is mostly absent.
    solution: 'Step 1: blue-black shows starch. Step 2: no oily patch shows little fat.'
    mistakes:
      Fat with no starch: c6s3_test
      Pure protein: c6s3_test
