# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 4. Format: content/README.md.
subject: cbse6-sci
chapter: 4
title: Exploring Magnets
tips:
  c6s_poles: Like poles (N–N or S–S) push apart; unlike poles (N–S) pull together. Repulsion is the sure test of a magnet.
  t6_broken_magnet: "Break a magnet and test each piece. Each new piece has two ends: what are they?"
  t6_compass: "Why does a compass needle point north? Because it is itself a…?"
  t6_lodestone: "Copper and granite are not magnetic. A natural magnet is a black iron-rich rock that sailors once used to find north."
  t6_lose_magnetism: "Rough treatment like heating or hammering scrambles a magnet's tiny magnets."
  t6_magnetic_material: "Magnets attract iron, nickel and cobalt. Plastic, wood and copper are not attracted."
  t6_non_magnetic: "Iron, nickel and cobalt are magnetic. Which choice is a metal that isn't?"
  t6_north_south: "A freely hanging magnet lines up with the Earth's magnetism."
  t6_poles_strongest: "Dip a magnet in iron filings. Where do most filings stick?"
  t6_two_poles: "Every magnet has a north pole and a…?"
  t6_unlike_attract: "Like poles repel; unlike poles…?"
  c6s4_metal: Only a few metals are pulled by a magnet. Not every shiny metal is one of them.
  c6s4_ends: Dip a magnet in iron filings and see where most of them stick.
  c6s4_poles: Same kinds of poles push apart; different kinds pull together.
  c6s4_test: Pulling can happen with plain iron too. Only pushing away proves both are magnets.
  c6s4_direction: A freely hanging magnet always settles along the same line on Earth.
  c6s4_care: Rough handling, heat and loose storage weaken magnets.
concepts:
- code: cbse6s.mag.materials
  title: Magnetic materials and poles
  notes: |
    Magnets attract iron, nickel and cobalt (magnetic materials); not wood, plastic, paper, copper, aluminium
    (non-magnetic). A natural magnet is magnetite (lodestone). Shapes: bar, horseshoe, ring, U-shaped. The attraction
    is strongest at the poles, near the ends. Every magnet has two poles, north and south; cutting a magnet gives two
    smaller magnets each with both poles.
  explanations:
    text: A magnet pulls things made of iron, nickel or cobalt. It does not pull wood, plastic or copper. Its pull is strongest at the ends, called poles. Every magnet has a north pole and a south pole, even if you break it in two.
    visual: 'Dip a bar magnet into iron filings. Lift it up: most filings cling to the two ends and few to the middle. The ends are the poles.'
    step_by_step: 'Step 1: Bring the magnet close to an object. Step 2: See if it is pulled. Step 3: If yes, the object contains iron, nickel or cobalt. Step 4: Notice where the pull is strongest: at the poles.'
    real_world: Fridge door seals, magnetic pencil boxes and cranes in scrap yards that lift iron all use magnets.
  picture:
    kind: compare
    columns:
    - title: Magnetic
      points:
      - iron nail
      - steel pin
      - nickel coin
    - title: Non-magnetic
      points:
      - plastic ruler
      - wooden stick
      - copper wire
    alt: Iron nails, steel pins and nickel are magnetic; plastic, wood and copper are not.
  activity:
    type: sort
    prompt: Will a magnet pull it?
    bins:
    - Magnetic
    - Not magnetic
    items:
    - label: Iron nail
      bin: Magnetic
      clue: Is it made of iron?
      why: Iron is attracted by a magnet.
    - label: Paper clip
      bin: Magnetic
      why: Most paper clips are made of iron (steel wire).
      clue: What metal is the wire usually?
    - label: Plastic ruler
      bin: Not magnetic
      clue: Is it a metal at all?
      why: Plastic is not attracted by a magnet.
    - label: Wooden pencil
      bin: Not magnetic
      clue: Is there any iron in it?
      why: Wood is not magnetic.
    - label: Aluminium foil
      bin: Not magnetic
      why: Aluminium is a metal, but magnets don't attract it.
      clue: It's a metal, but is it iron, nickel or cobalt?
    - label: Nickel
      bin: Magnetic
      clue: 'Magnets attract only a few metals. Bring a magnet near a nickel coin: what happens?'
      why: Nickel is magnetic.
    - label: Rubber eraser
      bin: Not magnetic
      clue: Is it a metal at all?
      why: Rubber is not magnetic.
  lesson:
    - teach: 'A magnet attracts some materials: iron, nickel, cobalt and things made from them, like steel pins. These are magnetic materials. Wood, plastic, glass, paper, copper and aluminium are not attracted: they are non-magnetic.'
      picture:
        kind: compare
        columns:
        - title: Magnetic
          points:
          - iron nail
          - steel pin
          - nickel
        - title: Non-magnetic
          points:
          - wood
          - plastic
          - copper wire
          - aluminium foil
        alt: Iron, steel and nickel are attracted by a magnet; wood, plastic, copper and aluminium are not.
      check:
        prompt: Which will a magnet pick up?
        options:
        - A steel safety pin
        - A rubber band
        - A copper coin
        answer: A steel safety pin
        why: Steel is mostly iron, which is magnetic.
    - teach: 'Magnets come in shapes: bar, horseshoe (U), ring and button. The first known magnets were natural rocks called magnetite or lodestone. Today most magnets are made by people.'
      check:
        prompt: What is a natural magnet called?
        options:
        - Lodestone
        - Limestone
        - Sandstone
        answer: Lodestone
        why: Lodestone (magnetite) is a rock that is naturally magnetic.
    - teach: 'The pull of a magnet is strongest near its ends, called poles. Every magnet has two poles: north and south. Break a magnet and each piece becomes a full magnet with its own north and south pole.'
      picture:
        kind: compare
        columns:
        - title: Ends (poles)
          points:
          - most iron filings stick
        - title: Middle
          points:
          - very few iron filings
        alt: Iron filings cluster at the two ends of a bar magnet and hardly stick to the middle.
      check:
        prompt: 'Iron filings sprinkled on a bar magnet collect mostly:'
        options:
        - At the two ends
        - In the middle
        - Evenly everywhere
        answer: At the two ends
        why: The poles, near the ends, have the strongest pull.
  items:
  - prompt: Which is attracted by a magnet?
    options:
    - Iron nail
    - Plastic ruler
    - Wooden spoon
    - Copper wire
    answer: Iron nail
    difficulty: 1
    hints:
    - Iron is magnetic.
    - Try a nail.
    solution: Iron is a magnetic material.
    mistakes: {"Plastic ruler": "t6_magnetic_material", "Copper wire": "t6_magnetic_material"}
  - prompt: Where is the attraction of a bar magnet strongest?
    options:
    - At its poles
    - In the middle
    - Equally everywhere
    - Nowhere
    answer: At its poles
    difficulty: 1
    hints:
    - Iron filings gather there.
    - The ends.
    solution: Attraction is strongest at the poles.
    mistakes: {"In the middle": "t6_poles_strongest", "Equally everywhere": "t6_poles_strongest"}
  - prompt: 'A natural magnet is called:'
    options:
    - Magnetite (lodestone)
    - Copper
    - Granite
    - Coal
    answer: Magnetite (lodestone)
    difficulty: 1
    hints:
    - Found as a rock.
    - Lodestone.
    solution: Magnetite is a natural magnet.
    mistakes: {"Copper": "t6_lodestone", "Granite": "t6_lodestone"}
  - prompt: How many poles does every magnet have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - North and south.
    - Count them.
    solution: Every magnet has 2 poles.
    mistakes: {"1": "t6_two_poles", "4": "t6_two_poles"}
  - prompt: 'A bar magnet is broken into two pieces. Each piece has:'
    options:
    - both a north and a south pole
    - only a north pole
    - only a south pole
    - no poles
    answer: both a north and a south pole
    difficulty: 2
    hints:
    - Poles always come in pairs.
    - Two small magnets.
    solution: Each piece becomes a full magnet with two poles.
    mistakes: {"only a north pole": "t6_broken_magnet", "no poles": "t6_broken_magnet"}
  - prompt: Which metal is NOT magnetic?
    options:
    - Aluminium
    - Iron
    - Nickel
    - Cobalt
    answer: Aluminium
    difficulty: 2
    hints:
    - Soft drink cans.
    - Only three common magnetic metals.
    solution: Aluminium is not attracted by magnets.
    mistakes: {"Iron": "t6_non_magnetic", "Nickel": "t6_non_magnetic"}
  - prompt: Which object is non-magnetic?
    options:
    - Aluminium can
    - Iron key
    - Steel spoon
    answer: Aluminium can
    difficulty: 1
    hints:
    - Which metal is not pulled by a magnet?
    - Iron and steel are magnetic.
    solution: 'Step 1: iron and steel are attracted. Step 2: aluminium is not, so the can is non-magnetic.'
    mistakes:
      Iron key: c6s4_metal
      Steel spoon: c6s4_metal
  - prompt: Which is a magnetic material?
    options:
    - Nickel
    - Gold
    - Glass
    answer: Nickel
    difficulty: 2
    hints:
    - 'Three metals are magnetic: iron, cobalt and one more.'
    - Gold is not one of them.
    solution: 'Step 1: magnetic metals are iron, nickel and cobalt. Step 2: so nickel.'
    mistakes:
      Gold: c6s4_metal
      Glass: c6s4_metal
  - prompt: Sand and iron filings are mixed. How can you separate them?
    options:
    - Move a magnet over the mixture
    - Add water and stir
    - Shake it hard
    answer: Move a magnet over the mixture
    difficulty: 1
    hints:
    - Only one part is magnetic.
    - Which tool picks it out?
    solution: 'Step 1: iron filings are magnetic, sand is not. Step 2: a magnet lifts the filings and leaves the sand.'
    mistakes:
      Add water and stir: c6s4_metal
      Shake it hard: c6s4_metal
  - prompt: A magnet is cut into 3 pieces. How many poles are there in all?
    answer: '6'
    check: 3*2
    difficulty: 2
    hints:
    - Each piece becomes a full magnet.
    - Each magnet has 2 poles.
    solution: 'Step 1: 3 pieces, each a magnet. Step 2: 3 × 2 = 6 poles.'
    mistakes:
      '2': c6s4_ends
      '3': c6s4_ends
  - prompt: Which part of a horseshoe magnet attracts pins most strongly?
    options:
    - The two tips
    - The curved middle
    - All parts equally
    answer: The two tips
    difficulty: 2
    hints:
    - A horseshoe magnet is a bent bar magnet.
    - Where are its poles?
    solution: 'Step 1: bending a bar magnet puts both poles at the tips. Step 2: so the tips attract most strongly.'
    mistakes:
      The curved middle: c6s4_ends
      All parts equally: c6s4_ends
  - prompt: 'A magnet attracts a paper clip through a sheet of paper. This shows magnetic force:'
    options:
    - Can act through paper
    - Is stopped by paper
    - Only works on paper
    answer: Can act through paper
    difficulty: 2
    hints:
    - The clip still moved.
    - The paper was in between.
    solution: 'Step 1: the clip moved even with paper in between. Step 2: so magnetic force acts through thin non-magnetic things like paper.'
    mistakes:
      Is stopped by paper: c6s4_metal
      Only works on paper: c6s4_metal
  - prompt: 'Most coins in India are made of steel-type metals. A magnet will:'
    options:
    - Probably attract them
    - Never attract any coin
    - Melt them
    answer: Probably attract them
    difficulty: 3
    hints:
    - Steel contains iron.
    - Try it at home with a fridge magnet.
    solution: 'Step 1: many Indian coins are made of ferritic stainless steel, which contains iron. Step 2: so a magnet can attract them.'
    mistakes:
      Never attract any coin: c6s4_metal
      Melt them: c6s4_metal
  - prompt: Which shows that a magnet has two poles?
    options:
    - Iron filings collect at both ends
    - It is shiny
    - It is heavy
    answer: Iron filings collect at both ends
    difficulty: 1
    hints:
    - Where is the pull strongest?
    - How many places?
    solution: 'Step 1: filings gather where the pull is strongest. Step 2: that happens at two ends: two poles.'
    mistakes:
      It is shiny: c6s4_ends
      It is heavy: c6s4_ends
  - prompt: Which is NOT a common shape of magnet?
    options:
    - Cone
    - Bar
    - Ring
    answer: Cone
    difficulty: 1
    hints:
    - Think of fridge magnets and lab magnets.
    - Bar, horseshoe, ring and button are common.
    solution: 'Step 1: bar, horseshoe, ring and button magnets are common. Step 2: cone-shaped magnets are not a usual type.'
    mistakes:
      Bar: c6s4_ends
      Ring: c6s4_ends
- code: cbse6s.mag.compass
  title: Directions, attraction and repulsion
  after:
  - cbse6s.mag.materials
  notes: |
    A freely suspended bar magnet always comes to rest pointing north–south; its north-seeking end is the north pole.
    A compass is a small magnetised needle used for direction. Like poles repel, unlike poles attract. Repulsion is the
    sure test that something is a magnet (iron is attracted to both poles). Magnets lose strength if heated, hammered or
    dropped; store bar magnets in pairs with unlike poles side by side and keepers (soft iron) at the ends.
  explanations:
    text: Hang a bar magnet freely and it turns until it points north–south. That is how a compass works. Two north poles push each other away, while a north and a south pull together. If something pushes a magnet away, it must be a magnet too.
    visual: 'Hang a bar magnet from a thread. It swings and stops pointing north–south. Bring the north pole of another magnet near its north pole: it swings away.'
    step_by_step: 'Step 1: Bring one pole of a known magnet near the object. Step 2: Then bring the other pole. Step 3: If one end pushes away (repels), the object is a magnet. Step 4: If both ends attract, it is only magnetic material.'
    real_world: Sailors and trekkers use compasses to find north when there is no sun or landmark.
  picture:
    kind: compare
    columns:
    - title: Poles brought together
      points:
      - N and S
      - N and N
      - S and S
    - title: What happens
      points:
      - attract
      - repel
      - repel
    alt: A north and a south pole attract; two north poles or two south poles repel.
  activity:
    type: sort
    prompt: Will the two ends pull together (attract) or push apart (repel)?
    bins:
    - Attract
    - Repel
    items:
    - label: North pole and south pole
      bin: Attract
      why: Unlike poles attract.
      clue: Are the poles the same or different?
    - label: South pole and north pole
      bin: Attract
      clue: Same or different poles?
      why: Unlike poles attract.
    - label: North pole and north pole
      bin: Repel
      why: Like poles repel.
      clue: Same or different poles?
    - label: South pole and south pole
      bin: Repel
      clue: Same or different poles?
      why: Like poles repel.
    - label: North pole and an iron nail
      bin: Attract
      why: Iron is pulled by either pole.
      clue: Does a plain nail have poles of its own?
  lesson:
    - teach: Hang a bar magnet freely by a thread. It turns and always settles pointing north–south. The end pointing north is its north pole. A compass is a tiny magnet needle that does the same, so travellers use it to find directions.
      picture:
        kind: flow
        steps:
        - Hang the magnet
        - It swings
        - It settles
        - North pole points north
        alt: A freely hanging magnet swings and comes to rest pointing north-south.
      check:
        prompt: A compass needle points along which line?
        options:
        - North–south
        - East–west
        - Any random line
        answer: North–south
        why: The needle is a small magnet, so it settles north–south.
    - teach: 'Two magnets push or pull each other. Like poles (N–N or S–S) repel: they push apart. Unlike poles (N–S) attract: they pull together.'
      picture:
        kind: compare
        columns:
        - title: N facing N
          points:
          - push apart
          - repel
        - title: S facing S
          points:
          - push apart
          - repel
        - title: N facing S
          points:
          - pull together
          - attract
        alt: North facing north and south facing south push apart; north facing south pull together.
      check:
        prompt: 'A south pole is brought near another south pole. They will:'
        options:
        - Repel
        - Attract
        - Do nothing
        answer: Repel
        why: Like poles repel.
    - teach: 'Repulsion is the sure test for a magnet: an iron bar is pulled by both poles, but only a magnet can push one pole away. Magnets get weaker if heated, hammered or dropped. Store bar magnets in pairs, unlike poles side by side, with soft iron keepers across the ends.'
      check:
        prompt: 'Bar X is attracted by both ends of a magnet. X is:'
        options:
        - Probably plain iron, not a magnet
        - Surely a magnet
        - Made of plastic
        answer: Probably plain iron, not a magnet
        why: A magnet would repel one of the ends; iron is attracted by both.
  items:
  - prompt: 'A freely hanging bar magnet always points:'
    options:
    - north–south
    - east–west
    - up–down
    - in any direction
    answer: north–south
    difficulty: 1
    hints:
    - That's how compasses work.
    - Earth's magnetism.
    solution: It settles in the north–south direction.
    mistakes: {"east–west": "t6_north_south", "in any direction": "t6_north_south"}
  - prompt: 'Two north poles brought close will:'
    options:
    - repel
    - attract
    - do nothing
    - stick together
    answer: repel
    difficulty: 1
    hints:
    - Like poles.
    - Push apart.
    solution: Like poles repel.
    mistakes:
      attract: c6s_poles
  - prompt: 'A north pole and a south pole will:'
    options:
    - attract
    - repel
    - do nothing
    - lose magnetism
    answer: attract
    difficulty: 1
    hints:
    - Unlike poles.
    - Pull together.
    solution: Unlike poles attract.
    mistakes: {"repel": "t6_unlike_attract", "do nothing": "t6_unlike_attract"}
  - prompt: Which is the sure test that a metal bar is a magnet?
    options:
    - It repels one pole of a magnet
    - It is attracted to a magnet
    - It is shiny
    - It is heavy
    answer: It repels one pole of a magnet
    difficulty: 2
    hints:
    - Iron is attracted by both poles.
    - Only magnets repel.
    solution: Only a magnet can repel another magnet.
    mistakes:
      It is attracted to a magnet: c6s_poles
  - prompt: What can make a magnet lose its magnetism?
    options:
    - Heating or hammering it
    - Keeping it with keepers
    - Storing it in pairs
    - Keeping it dry
    answer: Heating or hammering it
    difficulty: 2
    hints:
    - Rough treatment.
    - High temperature.
    solution: Heating, hammering or dropping weakens magnets.
    mistakes: {"Keeping it with keepers": "t6_lose_magnetism", "Keeping it dry": "t6_lose_magnetism"}
  - prompt: 'A compass needle is:'
    options:
    - a small magnet
    - made of plastic
    - a copper wire
    - a non-magnetic pin
    answer: a small magnet
    difficulty: 1
    hints:
    - It points north.
    - Magnetised.
    solution: A compass needle is a tiny magnet.
    mistakes: {"made of plastic": "t6_compass", "a non-magnetic pin": "t6_compass"}
  - prompt: Which way does the north pole of a freely hanging magnet point?
    options:
    - Towards the north
    - Towards the east
    - Towards the ground
    answer: Towards the north
    difficulty: 1
    hints:
    - Its name gives a clue.
    - It is the 'north-seeking' end.
    solution: 'Step 1: the north-seeking end is called the north pole. Step 2: it points to the north.'
    mistakes:
      Towards the east: c6s4_direction
      Towards the ground: c6s4_direction
  - prompt: A sailor's compass shows north is straight ahead. Which way is east?
    options:
    - To the right
    - To the left
    - Behind
    answer: To the right
    difficulty: 2
    hints:
    - Face north.
    - Where does the Sun rise?
    solution: 'Step 1: facing north, south is behind you. Step 2: east is to the right, west to the left.'
    mistakes:
      To the left: c6s4_direction
      Behind: c6s4_direction
  - prompt: 'Magnet A''s north pole is brought near magnet B''s south pole. They will:'
    options:
    - Attract
    - Repel
    - Spin around
    answer: Attract
    difficulty: 1
    hints:
    - Are the poles alike or unlike?
    - Unlike poles pull.
    solution: 'Step 1: north and south are unlike poles. Step 2: unlike poles attract.'
    mistakes:
      Repel: c6s4_poles
      Spin around: c6s4_poles
  - prompt: Two ring magnets on a pencil float one above the other with a gap. Which poles face each other?
    options:
    - Like poles
    - Unlike poles
    - No poles
    answer: Like poles
    difficulty: 3
    hints:
    - They are pushing apart.
    - What causes a push?
    solution: 'Step 1: the top magnet is pushed up. Step 2: pushing means repulsion, which happens between like poles.'
    mistakes:
      Unlike poles: c6s4_poles
      No poles: c6s4_poles
  - prompt: You have two identical bars. One is a magnet, one is iron. Which test tells them apart?
    options:
    - 'Bring each near one pole of a known magnet: only the magnet bar can repel it'
    - See which is heavier
    - See which one picks up paper
    answer: 'Bring each near one pole of a known magnet: only the magnet bar can repel it'
    difficulty: 3
    hints:
    - Both will be attracted to some pole.
    - Which bar can push?
    solution: 'Step 1: iron is attracted by both poles. Step 2: only a magnet can repel a pole, so repulsion identifies it.'
    mistakes:
      See which is heavier: c6s4_test
      See which one picks up paper: c6s4_test
  - prompt: Which action will weaken a magnet?
    options:
    - Dropping it many times
    - Keeping it with a keeper
    - Storing in pairs
    answer: Dropping it many times
    difficulty: 1
    hints:
    - Rough treatment harms magnets.
    - Keepers and pairs protect them.
    solution: 'Step 1: keepers and pairs help magnets stay strong. Step 2: dropping or hammering weakens them.'
    mistakes:
      Keeping it with a keeper: c6s4_care
      Storing in pairs: c6s4_care
  - prompt: Why should magnets be kept away from mobile phones and cards?
    options:
    - They can disturb things that store information magnetically
    - Phones attract magnets
    - Magnets get heavier
    answer: They can disturb things that store information magnetically
    difficulty: 2
    hints:
    - Some cards have a magnetic strip.
    - What could a strong magnet do to it?
    solution: 'Step 1: cards and some devices store data magnetically. Step 2: a strong magnet can mess up that data.'
    mistakes:
      Phones attract magnets: c6s4_care
      Magnets get heavier: c6s4_care
  - prompt: You can make a simple compass by rubbing a needle with a magnet and floating it on a leaf in water. Why does it work?
    options:
    - The needle becomes a magnet and settles north–south
    - Water is magnetic
    - The leaf points north
    answer: The needle becomes a magnet and settles north–south
    difficulty: 2
    hints:
    - Rubbing with a magnet changes the needle.
    - Floating lets it turn freely.
    solution: 'Step 1: stroking with a magnet makes the steel needle a magnet. Step 2: floating freely, it settles north–south.'
    mistakes:
      Water is magnetic: c6s4_direction
      The leaf points north: c6s4_direction
  - prompt: Bar magnets are stored side by side. Which way should they be placed?
    options:
    - North of one beside south of the other, with keepers
    - North beside north
    - Touching end to end, loose
    answer: North of one beside south of the other, with keepers
    difficulty: 2
    hints:
    - Unlike poles side by side keep them strong.
    - Keepers are pieces of soft iron.
    solution: 'Step 1: unlike poles side by side with keepers make a closed loop. Step 2: this stops the magnets weakening.'
    mistakes:
      North beside north: c6s4_care
      Touching end to end, loose: c6s4_care
