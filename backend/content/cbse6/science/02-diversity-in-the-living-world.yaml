# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 2. Format: content/README.md.
subject: cbse6-sci
chapter: 2
title: Diversity in the Living World
tips:
  c6s_taproot: Plants with net-like veins in leaves usually have a taproot; parallel veins go with fibrous roots.
concepts:
- code: cbse6s.div.plants
  title: Grouping plants
  notes: |
    Diversity = variety of living things. Plants grouped by size and stem: herbs (small, soft green stem: tulsi, wheat),
    shrubs (medium, woody stem branching near the base: rose, hibiscus), trees (tall, thick woody trunk: mango, neem),
    climbers (weak stems that climb with support: pea, money plant), creepers (spread on the ground: pumpkin,
    watermelon). Leaf venation: reticulate (net-like: hibiscus) goes with taproot; parallel (grass, banana) with
    fibrous roots.
  explanations:
    text: There are many kinds of plants, and we can group them. Herbs are small with soft stems. Shrubs are bushy with woody stems. Trees are tall with thick trunks. Climbers need support to grow up; creepers spread on the ground.
    visual: 'Picture a garden: a tiny tulsi (herb), a rose bush (shrub), a tall mango tree, a money plant climbing a pole, and a pumpkin vine across the soil.'
    step_by_step: 'Step 1: Look at the height. Step 2: Feel the stem: soft and green, or hard and woody? Step 3: Check where branches start. Step 4: Does it stand alone, climb or creep? Step 5: Name the group.'
    real_world: In a Kerala home garden you may see a coconut tree, a hibiscus shrub, tulsi in a pot and a pepper vine climbing a tree.
  picture:
    kind: compare
    columns:
    - title: Herb
      points:
      - small
      - soft green stem
      - tulsi, wheat
    - title: Shrub
      points:
      - medium, bushy
      - woody stem
      - rose, hibiscus
    - title: Tree
      points:
      - tall
      - thick woody trunk
      - mango, neem
    alt: Herbs are small with soft stems, shrubs are bushy with woody stems, and trees are tall with thick trunks.
  activity:
    type: sort
    prompt: Group the plants by their size and stem.
    bins:
    - Herb
    - Shrub
    - Tree
    - Climber
    items:
    - label: Wheat
      bin: Herb
      why: 'Small, with a soft green stem: a herb.'
      clue: Is the stem soft and green, or woody?
    - label: Tulsi
      bin: Herb
      clue: Is it small with a soft stem?
      why: 'Small, with soft stems: a herb.'
    - label: Rose
      bin: Shrub
      why: 'A woody stem that branches near the ground: a shrub.'
      clue: Woody stem? Does it branch near the ground?
    - label: Hibiscus
      bin: Shrub
      clue: Woody stem branching near the ground, or one tall trunk?
      why: 'Bushy, branching low: a shrub.'
    - label: Mango
      bin: Tree
      why: 'Tall, with a thick woody trunk: a tree.'
      clue: Does it have one thick, tall trunk?
    - label: Neem
      bin: Tree
      clue: Does it have one thick, tall trunk?
      why: 'A tall, thick trunk: a tree.'
    - label: Money plant
      bin: Climber
      why: 'A weak stem that climbs with support: a climber.'
      clue: Can its stem stand up on its own?
    - label: Pea
      bin: Climber
      clue: What do the tendrils of a pea plant hold on to?
      why: 'It climbs with tendrils: a climber.'
  items:
  - prompt: Which plant is a herb?
    options:
    - Tulsi
    - Mango
    - Neem
    - Banyan
    answer: Tulsi
    difficulty: 1
    hints:
    - Small with a soft green stem.
    - Grows in a pot.
    solution: Tulsi is a herb.
  - prompt: 'A rose plant is a:'
    options:
    - Shrub
    - Tree
    - Herb
    - Creeper
    answer: Shrub
    difficulty: 1
    hints:
    - Bushy with woody stems.
    - Medium size.
    solution: A rose is a shrub.
  - prompt: Which plant is a climber?
    options:
    - Money plant
    - Pumpkin
    - Wheat
    - Mango
    answer: Money plant
    difficulty: 1
    hints:
    - Needs support to go up.
    - Climbs a pole.
    solution: A money plant climbs with support.
  - prompt: 'Pumpkin and watermelon plants are:'
    options:
    - Creepers
    - Trees
    - Shrubs
    - Climbers
    answer: Creepers
    difficulty: 1
    hints:
    - They spread along the ground.
    - Weak stems.
    solution: They creep along the ground.
  - prompt: 'A leaf has parallel veins. Its plant most likely has:'
    options:
    - Fibrous roots
    - A taproot
    - No roots
    - Woody roots only
    answer: Fibrous roots
    difficulty: 2
    hints:
    - Grass has parallel veins.
    - Grass roots are bushy.
    solution: Parallel venation goes with fibrous roots.
    mistakes:
      A taproot: c6s_taproot
  - prompt: Which leaf has net-like (reticulate) veins?
    options:
    - Hibiscus
    - Grass
    - Banana
    - Maize
    answer: Hibiscus
    difficulty: 2
    hints:
    - Look for a branching net.
    - Not long parallel lines.
    solution: Hibiscus leaves have reticulate venation.
- code: cbse6s.div.animals
  title: Grouping animals and habitats
  after:
  - cbse6s.div.plants
  notes: |
    Animals can be grouped by where they live (habitat), how they move, what they eat, and whether they have a backbone
    (vertebrates: fish, frogs, snakes, birds, mammals; invertebrates: insects, earthworms, snails). Habitats: land
    (forests, deserts, grasslands, mountains) and water (ponds, rivers, oceans). Adaptations help survival: camel's
    long legs and humps (desert), fish gills and fins (water), thick fur of yak (cold mountains). Conserving diversity
    matters.
  explanations:
    text: 'Animals live in many different places, called habitats. Each animal has features that help it live there: a camel survives the desert, a fish breathes with gills underwater. We can also group animals by whether they have a backbone.'
    visual: Draw a camel in sand (long legs, humps for stored fat), a fish in water (fins, gills) and a yak on a snowy mountain (thick hairy coat).
    step_by_step: 'Step 1: Find the habitat. Step 2: Note the challenge there (heat, water, cold). Step 3: Find the body feature that helps. Step 4: Group by backbone if asked.'
    real_world: Kerala's backwaters are home to fish and water birds, while the Western Ghats forests shelter lion-tailed macaques and hornbills.
  picture:
    kind: compare
    columns:
    - title: Animal
      points:
      - Camel
      - Fish
      - Yak
    - title: Feature that helps
      points:
      - long legs, stores fat in hump
      - gills and fins
      - thick hairy coat
    alt: A camel has long legs and a hump for the desert, a fish has gills and fins for water, and a yak has a thick coat for the cold.
  activity:
    type: sort
    prompt: Where does each one live? Its body suits its habitat.
    bins:
    - Desert
    - Water
    - Cold mountains
    items:
    - label: Camel
      bin: Desert
      why: 'Wide feet for sand, can go long without water: desert.'
      clue: What do wide feet and storing water help with?
    - label: Fish
      bin: Water
      why: 'Gills and fins: water.'
      clue: What do gills and fins need?
    - label: Yak
      bin: Cold mountains
      why: 'Long thick hair keeps it warm: cold mountains.'
      clue: What is long thick hair good for?
    - label: Octopus
      bin: Water
      clue: Where does it breathe and swim?
      why: 'It lives in the sea: water.'
    - label: Snow leopard
      bin: Cold mountains
      why: 'Thick fur and wide paws for snow: cold mountains.'
      clue: What are thick fur and wide paws good for?
    - label: Cactus
      bin: Desert
      why: 'Storing water and losing little: desert.'
      clue: Why store water and have spines instead of leaves?
  items:
  - prompt: 'The place where an animal lives is its:'
    options:
    - Habitat
    - Diet
    - Backbone
    - Shelter only
    answer: Habitat
    difficulty: 1
    hints:
    - Its natural home.
    - Forest, pond, desert.
    solution: An animal's natural home is its habitat.
  - prompt: Which animal has a backbone?
    options:
    - Frog
    - Earthworm
    - Butterfly
    - Snail
    answer: Frog
    difficulty: 1
    hints:
    - Vertebrates have a backbone.
    - Fish, frogs, birds...
    solution: A frog is a vertebrate.
  - prompt: 'Fish breathe in water using:'
    options:
    - Gills
    - Lungs
    - Skin only
    - Fins
    answer: Gills
    difficulty: 1
    hints:
    - Slits on the sides of the head.
    - Not lungs.
    solution: Fish take oxygen from water with gills.
  - prompt: Which feature helps a yak live in cold mountains?
    options:
    - Thick hairy coat
    - Gills
    - Thin skin
    - Webbed feet
    answer: Thick hairy coat
    difficulty: 1
    hints:
    - It keeps the body warm.
    - Fur.
    solution: A thick coat keeps the yak warm.
  - prompt: 'A camel''s hump stores:'
    options:
    - Fat, which gives energy
    - Water only
    - Sand
    - Milk
    answer: Fat, which gives energy
    difficulty: 2
    hints:
    - Not water, a common mistake.
    - Energy store.
    solution: The hump stores fat, used for energy when food is scarce.
  - prompt: Which is an invertebrate?
    options:
    - Earthworm
    - Sparrow
    - Snake
    - Cow
    answer: Earthworm
    difficulty: 2
    hints:
    - No backbone.
    - Soft body.
    solution: An earthworm has no backbone.
