# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 2. Format: content/README.md.
subject: cbse6-sci
chapter: 2
title: Diversity in the Living World
tips:
  c6s_taproot: "Leaf veins and roots go together: net-like veins with one main root, parallel veins (like grass) with a bunch of thin roots. Which pattern does this leaf have?"
  t6_backbone: "Animals with a backbone are vertebrates. Earthworms, butterflies and snails have none."
  t6_camel_hump: "The hump is a food store, not a water tank."
  t6_climber: "A climber needs support and climbs up walls or sticks. Creepers spread on the ground."
  t6_creeper: "Pumpkin plants spread on the ground; they can't stand up on their own."
  t6_gills: "Fish take oxygen from water using organs behind their heads."
  t6_habitat: "The place where an animal lives and finds food and shelter has a name."
  t6_herb: "Herbs are small with soft green stems. Mango and neem grow into big trees."
  t6_invertebrate: "Invertebrate means without a backbone. Which animal is soft-bodied?"
  t6_reticulate: "Grass and banana leaves have long lines running side by side. Which leaf shows a criss-cross net instead?"
  t6_shrub: "A rose is bushy, with hard woody stems branching near the ground, but it never grows tall like a tree. Herbs have soft green stems. Which type is in between?"
  t6_yak: "Cold mountains need warmth. What would keep a yak warm?"
  c6s2_stem: 'Look at the stem: soft and green, woody near the base, or a thick trunk? Then think about height.'
  c6s2_weak: A weak stem either climbs on a support or spreads along the ground. Which does this one do?
  c6s2_veins: 'Leaf veins and roots come in matching pairs. Recall which vein pattern goes with one main root and which with many thin roots.'
  c6s2_backbone: 'Feel for a backbone: animals with one are vertebrates, those without are invertebrates.'
  c6s2_habitat: 'Think about where the animal lives and what problem that place gives it: cold, heat, little water.'
  c6s2_group: Choose one feature to sort by and check every member against that same feature.
concepts:
- code: cbse6s.div.plants
  title: Grouping plants
  notes: |
    Diversity = variety of living things. Plants grouped by size and stem: herbs (small, soft green stem: tulsi, wheat),
    shrubs (medium, woody stem branching near the base: rose, hibiscus), trees (tall, thick woody trunk: mango, neem),
    climbers (weak stems that climb with support: pea, money plant), creepers (spread on the ground: pumpkin,
    watermelon). Leaf venation: reticulate (net-like: hibiscus) goes with taproot; parallel (grass, banana) with
    fibrous roots.
  explanations:
    text: There are many kinds of plants, and we can group them. Herbs are small with soft stems. Shrubs are bushy with woody stems. Trees are tall with thick trunks. Climbers need support to grow up; creepers spread on the ground.
    visual: 'Picture a garden: a tiny tulsi (herb), a rose bush (shrub), a tall mango tree, a money plant climbing a pole, and a pumpkin vine across the soil.'
    step_by_step: 'Step 1: Look at the height. Step 2: Feel the stem: soft and green, or hard and woody? Step 3: Check where branches start. Step 4: Does it stand alone, climb or creep? Step 5: Name the group.'
    real_world: In a Kerala home garden you may see a coconut tree, a hibiscus shrub, tulsi in a pot and a pepper vine climbing a tree.
  picture:
    kind: compare
    columns:
    - title: Herb
      points:
      - small
      - soft green stem
      - tulsi, wheat
    - title: Shrub
      points:
      - medium, bushy
      - woody stem
      - rose, hibiscus
    - title: Tree
      points:
      - tall
      - thick woody trunk
      - mango, neem
    alt: Herbs are small with soft stems, shrubs are bushy with woody stems, and trees are tall with thick trunks.
  activity:
    type: sort
    prompt: Group the plants by their size and stem.
    bins:
    - Herb
    - Shrub
    - Tree
    - Climber
    items:
    - label: Wheat
      bin: Herb
      why: 'Small, with a soft green stem: a herb.'
      clue: Is the stem soft and green, or woody?
    - label: Tulsi
      bin: Herb
      clue: Is it small with a soft stem?
      why: 'Small, with soft stems: a herb.'
    - label: Rose
      bin: Shrub
      why: 'A woody stem that branches near the ground: a shrub.'
      clue: Woody stem? Does it branch near the ground?
    - label: Hibiscus
      bin: Shrub
      clue: Woody stem branching near the ground, or one tall trunk?
      why: 'Bushy, branching low: a shrub.'
    - label: Mango
      bin: Tree
      why: 'Tall, with a thick woody trunk: a tree.'
      clue: Does it have one thick, tall trunk?
    - label: Neem
      bin: Tree
      clue: Does it have one thick, tall trunk?
      why: 'A tall, thick trunk: a tree.'
    - label: Money plant
      bin: Climber
      why: 'A weak stem that climbs with support: a climber.'
      clue: Can its stem stand up on its own?
    - label: Pea
      bin: Climber
      clue: What do the tendrils of a pea plant hold on to?
      why: 'It climbs with tendrils: a climber.'
  lesson:
    - teach: Living things show huge variety, called diversity. To study them we group them by features they share. Plants can be grouped by their height and stem.
      picture:
        kind: compare
        columns:
        - title: Herbs
          points:
          - short
          - soft green stem
          - tulsi, wheat, mint
        - title: Shrubs
          points:
          - medium height
          - woody stem, branches near the base
          - rose, hibiscus
        - title: Trees
          points:
          - tall
          - thick woody trunk
          - mango, neem
        alt: Herbs are short with soft green stems, shrubs medium with woody stems branching low, trees tall with thick trunks.
      check:
        prompt: 'A plant is tall with a single thick woody trunk. It is a:'
        options:
        - Tree
        - Herb
        - Shrub
        answer: Tree
        why: A thick trunk and great height are features of trees.
    - teach: Some plants have weak stems that cannot stand up. Climbers hold on to a support and climb (pea, money plant, grapevine). Creepers spread along the ground (pumpkin, watermelon).
      check:
        prompt: 'A gourd plant spreads along the ground. It is a:'
        options:
        - Creeper
        - Climber
        - Tree
        answer: Creeper
        why: It grows along the ground, not up a support.
    - teach: 'Leaves give clues to roots. Leaves with net-like (reticulate) veins, like hibiscus, usually have a taproot: one main root with side roots. Leaves with parallel veins, like grass and banana, usually have fibrous roots: many thin roots of similar size.'
      picture:
        kind: compare
        columns:
        - title: Net-like veins
          points:
          - hibiscus, mango
          - taproot
        - title: Parallel veins
          points:
          - grass, maize, banana
          - fibrous roots
        alt: Net-veined leaves go with a taproot; parallel-veined leaves go with fibrous roots.
      check:
        prompt: A maize leaf has parallel veins. What roots will it have?
        options:
        - Fibrous roots
        - A taproot
        - No roots
        answer: Fibrous roots
        why: Parallel veins usually go with fibrous roots.
  items:
  - prompt: Which plant is a herb?
    options:
    - Tulsi
    - Mango
    - Neem
    - Banyan
    answer: Tulsi
    difficulty: 1
    hints:
    - Small with a soft green stem.
    - Grows in a pot.
    solution: Tulsi is a herb.
    mistakes: {"Mango": "t6_herb", "Banyan": "t6_herb"}
  - prompt: 'A rose plant is a:'
    options:
    - Shrub
    - Tree
    - Herb
    - Creeper
    answer: Shrub
    difficulty: 1
    hints:
    - Bushy with woody stems.
    - Medium size.
    solution: A rose is a shrub.
    mistakes: {"Tree": "t6_shrub", "Herb": "t6_shrub"}
  - prompt: Which plant is a climber?
    options:
    - Money plant
    - Pumpkin
    - Wheat
    - Mango
    answer: Money plant
    difficulty: 1
    hints:
    - Needs support to go up.
    - Climbs a pole.
    solution: A money plant climbs with support.
    mistakes: {"Pumpkin": "t6_climber", "Wheat": "t6_climber"}
  - prompt: 'Pumpkin and watermelon plants are:'
    options:
    - Creepers
    - Trees
    - Shrubs
    - Climbers
    answer: Creepers
    difficulty: 1
    hints:
    - They spread along the ground.
    - Weak stems.
    solution: They creep along the ground.
    mistakes: {"Climbers": "t6_creeper", "Shrubs": "t6_creeper"}
  - prompt: 'A leaf has parallel veins. Its plant most likely has:'
    options:
    - Fibrous roots
    - A taproot
    - No roots
    - Woody roots only
    answer: Fibrous roots
    difficulty: 2
    hints:
    - Grass has parallel veins.
    - Grass roots are bushy.
    solution: Parallel venation goes with fibrous roots.
    mistakes:
      A taproot: c6s_taproot
  - prompt: Which leaf has net-like (reticulate) veins?
    options:
    - Hibiscus
    - Grass
    - Banana
    - Maize
    answer: Hibiscus
    difficulty: 2
    hints:
    - Look for a branching net.
    - Not long parallel lines.
    solution: Hibiscus leaves have reticulate venation.
    mistakes: {"Grass": "t6_reticulate", "Banana": "t6_reticulate"}
  - prompt: Which plant is a shrub?
    options:
    - Hibiscus
    - Wheat
    - Neem
    answer: Hibiscus
    difficulty: 1
    hints:
    - A shrub is medium-sized with a woody stem.
    - It branches near the ground.
    solution: 'Step 1: wheat is a herb and neem is a tree. Step 2: hibiscus is a bushy shrub.'
    mistakes:
      Wheat: c6s2_stem
      Neem: c6s2_stem
  - prompt: Which plant is a tree?
    options:
    - Mango
    - Mint
    - Rose
    answer: Mango
    difficulty: 1
    hints:
    - Trees are tall with a thick trunk.
    - Mint is tiny and rose is bushy.
    solution: 'Step 1: mint is a herb, rose a shrub. Step 2: mango grows tall with a thick trunk, so it is a tree.'
    mistakes:
      Mint: c6s2_stem
      Rose: c6s2_stem
  - prompt: 'A grapevine holds on to a fence with thin coils. It is a:'
    options:
    - Climber
    - Creeper
    - Shrub
    answer: Climber
    difficulty: 1
    hints:
    - Its stem is weak.
    - Does it go up or along the ground?
    solution: 'Step 1: the stem is too weak to stand. Step 2: it uses the fence to climb up, so it is a climber.'
    mistakes:
      Creeper: c6s2_weak
      Shrub: c6s2_stem
  - prompt: Which of these plants is a herb?
    options:
    - Coriander
    - Peepal
    - Bougainvillea
    answer: Coriander
    difficulty: 2
    hints:
    - Herbs are small with soft green stems.
    - Peepal is huge.
    solution: 'Step 1: peepal is a tree and bougainvillea a woody shrub-climber. Step 2: coriander is small and soft: a herb.'
    mistakes:
      Peepal: c6s2_stem
      Bougainvillea: c6s2_stem
  - prompt: 'A plant has a taproot. Its leaves most likely have:'
    options:
    - Net-like veins
    - Parallel veins
    - No veins
    answer: Net-like veins
    difficulty: 2
    hints:
    - Roots and veins go in pairs.
    - Taproot goes with which vein pattern?
    solution: 'Step 1: taproots go with reticulate venation. Step 2: so the leaves have net-like veins.'
    mistakes:
      Parallel veins: c6s2_veins
      No veins: c6s2_veins
  - prompt: Which plant has fibrous roots?
    options:
    - Wheat
    - Mustard
    - Carrot
    answer: Wheat
    difficulty: 2
    hints:
    - Fibrous roots go with parallel veins.
    - Which is a grass-like plant?
    solution: 'Step 1: carrot and mustard have taproots. Step 2: wheat is a grass with fibrous roots.'
    mistakes:
      Mustard: c6s2_veins
      Carrot: c6s2_veins
  - prompt: Why do we group plants?
    options:
    - To study a huge variety more easily
    - To make them grow faster
    - Because all plants are the same
    answer: To study a huge variety more easily
    difficulty: 1
    hints:
    - There are lakhs of kinds of plants.
    - Groups help us make sense of them.
    solution: 'Step 1: there is great diversity. Step 2: grouping by shared features makes it easier to study.'
    mistakes:
      To make them grow faster: c6s2_group
      Because all plants are the same: c6s2_group
  - prompt: Neem, tulsi, rose, banyan. Which two are in the same group by stem?
    options:
    - Neem and banyan
    - Tulsi and rose
    - Rose and neem
    answer: Neem and banyan
    difficulty: 3
    hints:
    - Sort each into herb, shrub or tree.
    - Which two have thick trunks?
    solution: 'Step 1: tulsi is a herb and rose a shrub. Step 2: neem and banyan are both trees.'
    mistakes:
      Tulsi and rose: c6s2_group
      Rose and neem: c6s2_group
  - prompt: Which is NOT a feature used to group plants in this chapter?
    options:
    - The colour of the flower pot
    - Height
    - Type of stem
    answer: The colour of the flower pot
    difficulty: 2
    hints:
    - The feature must belong to the plant itself.
    - Is a pot part of the plant?
    solution: 'Step 1: height and stem belong to the plant. Step 2: a pot''s colour has nothing to do with the plant.'
    mistakes:
      Height: c6s2_group
      Type of stem: c6s2_group
- code: cbse6s.div.animals
  title: Grouping animals and habitats
  after:
  - cbse6s.div.plants
  notes: |
    Animals can be grouped by where they live (habitat), how they move, what they eat, and whether they have a backbone
    (vertebrates: fish, frogs, snakes, birds, mammals; invertebrates: insects, earthworms, snails). Habitats: land
    (forests, deserts, grasslands, mountains) and water (ponds, rivers, oceans). Adaptations help survival: camel's
    long legs and humps (desert), fish gills and fins (water), thick fur of yak (cold mountains). Conserving diversity
    matters.
  explanations:
    text: 'Animals live in many different places, called habitats. Each animal has features that help it live there: a camel survives the desert, a fish breathes with gills underwater. We can also group animals by whether they have a backbone.'
    visual: Draw a camel in sand (long legs, humps for stored fat), a fish in water (fins, gills) and a yak on a snowy mountain (thick hairy coat).
    step_by_step: 'Step 1: Find the habitat. Step 2: Note the challenge there (heat, water, cold). Step 3: Find the body feature that helps. Step 4: Group by backbone if asked.'
    real_world: Kerala's backwaters are home to fish and water birds, while the Western Ghats forests shelter lion-tailed macaques and hornbills.
  picture:
    kind: compare
    columns:
    - title: Animal
      points:
      - Camel
      - Fish
      - Yak
    - title: Feature that helps
      points:
      - long legs, stores fat in hump
      - gills and fins
      - thick hairy coat
    alt: A camel has long legs and a hump for the desert, a fish has gills and fins for water, and a yak has a thick coat for the cold.
  activity:
    type: sort
    prompt: Where does each one live? Its body suits its habitat.
    bins:
    - Desert
    - Water
    - Cold mountains
    items:
    - label: Camel
      bin: Desert
      why: 'Wide feet for sand, can go long without water: desert.'
      clue: What do wide feet and storing water help with?
    - label: Fish
      bin: Water
      why: 'Gills and fins: water.'
      clue: What do gills and fins need?
    - label: Yak
      bin: Cold mountains
      why: 'Long thick hair keeps it warm: cold mountains.'
      clue: What is long thick hair good for?
    - label: Octopus
      bin: Water
      clue: Where does it breathe and swim?
      why: 'It lives in the sea: water.'
    - label: Snow leopard
      bin: Cold mountains
      why: 'Thick fur and wide paws for snow: cold mountains.'
      clue: What are thick fur and wide paws good for?
    - label: Cactus
      bin: Desert
      why: 'Storing water and losing little: desert.'
      clue: Why store water and have spines instead of leaves?
  lesson:
    - teach: 'Animals can be grouped by whether they have a backbone. Vertebrates have one: fish, frogs, snakes, birds and mammals. Invertebrates do not: insects, earthworms, snails, spiders.'
      picture:
        kind: compare
        columns:
        - title: Vertebrates
          points:
          - backbone
          - fish, frog, lizard, crow, cow
        - title: Invertebrates
          points:
          - no backbone
          - ant, earthworm, snail, spider
        alt: Vertebrates like fish, frogs and cows have a backbone; invertebrates like ants and snails do not.
      check:
        prompt: Which is an invertebrate?
        options:
        - Butterfly
        - Sparrow
        - Snake
        answer: Butterfly
        why: Insects like butterflies have no backbone.
    - teach: 'The place where an animal lives and finds food and shelter is its habitat. Land habitats: forests, deserts, grasslands, mountains. Water habitats: ponds, rivers, seas.'
      check:
        prompt: What is the habitat of a fish like rohu?
        options:
        - 'Fresh water: rivers and ponds'
        - Deserts
        - Mountains
        answer: 'Fresh water: rivers and ponds'
        why: Rohu lives in fresh water.
    - teach: Adaptations are features that help an animal survive in its habitat. A camel has long legs and stored fat in its hump for the desert. A yak has thick hair for the cold. Fish have gills to breathe in water and fins to swim.
      picture:
        kind: compare
        columns:
        - title: Desert (camel)
          points:
          - long legs
          - fat in hump
          - little water needed
        - title: Cold mountains (yak)
          points:
          - long thick hair
          - strong hooves
        - title: Water (fish)
          points:
          - gills
          - fins
          - streamlined body
        alt: Camel, yak and fish each have features that suit their habitat.
      check:
        prompt: Why does a fish have a streamlined (pointed) body?
        options:
        - To move easily through water
        - To keep warm
        - To store fat
        answer: To move easily through water
        why: A smooth, pointed shape lets water flow past it.
  items:
  - prompt: 'The place where an animal lives is its:'
    options:
    - Habitat
    - Diet
    - Backbone
    - Shelter only
    answer: Habitat
    difficulty: 1
    hints:
    - Its natural home.
    - Forest, pond, desert.
    solution: An animal's natural home is its habitat.
    mistakes: {"Diet": "t6_habitat", "Backbone": "t6_habitat"}
  - prompt: Which animal has a backbone?
    options:
    - Frog
    - Earthworm
    - Butterfly
    - Snail
    answer: Frog
    difficulty: 1
    hints:
    - Vertebrates have a backbone.
    - Fish, frogs, birds...
    solution: A frog is a vertebrate.
    mistakes: {"Earthworm": "t6_backbone", "Snail": "t6_backbone"}
  - prompt: 'Fish breathe in water using:'
    options:
    - Gills
    - Lungs
    - Skin only
    - Fins
    answer: Gills
    difficulty: 1
    hints:
    - Slits on the sides of the head.
    - Not lungs.
    solution: Fish take oxygen from water with gills.
    mistakes: {"Lungs": "t6_gills", "Fins": "t6_gills"}
  - prompt: Which feature helps a yak live in cold mountains?
    options:
    - Thick hairy coat
    - Gills
    - Thin skin
    - Webbed feet
    answer: Thick hairy coat
    difficulty: 1
    hints:
    - It keeps the body warm.
    - Fur.
    solution: A thick coat keeps the yak warm.
    mistakes: {"Gills": "t6_yak", "Thin skin": "t6_yak"}
  - prompt: 'A camel''s hump stores:'
    options:
    - Fat, which gives energy
    - Water only
    - Sand
    - Milk
    answer: Fat, which gives energy
    difficulty: 2
    hints:
    - Not water, a common mistake.
    - Energy store.
    solution: The hump stores fat, used for energy when food is scarce.
    mistakes: {"Water only": "t6_camel_hump", "Sand": "t6_camel_hump"}
  - prompt: Which is an invertebrate?
    options:
    - Earthworm
    - Sparrow
    - Snake
    - Cow
    answer: Earthworm
    difficulty: 2
    hints:
    - No backbone.
    - Soft body.
    solution: An earthworm has no backbone.
    mistakes: {"Sparrow": "t6_invertebrate", "Snake": "t6_invertebrate"}
  - prompt: Which animal is a vertebrate?
    options:
    - Lizard
    - Snail
    - Ant
    answer: Lizard
    difficulty: 1
    hints:
    - Look for an animal with a backbone.
    - Snails and ants are soft-bodied or have a hard outer shell.
    solution: 'Step 1: snails and ants have no backbone. Step 2: a lizard does, so it is a vertebrate.'
    mistakes:
      Snail: c6s2_backbone
      Ant: c6s2_backbone
  - prompt: Which group has only invertebrates?
    options:
    - Spider, cockroach, earthworm
    - Frog, spider, ant
    - Fish, crab, snail
    answer: Spider, cockroach, earthworm
    difficulty: 2
    hints:
    - Check every animal in the group.
    - Even one vertebrate spoils the group.
    solution: 'Step 1: frog and fish have backbones. Step 2: spider, cockroach and earthworm all lack one.'
    mistakes:
      Frog, spider, ant: c6s2_backbone
      Fish, crab, snail: c6s2_backbone
  - prompt: 'A polar bear has thick white fur and a layer of fat. Its habitat is most likely:'
    options:
    - Icy polar regions
    - Hot deserts
    - Tropical rivers
    answer: Icy polar regions
    difficulty: 1
    hints:
    - Fur and fat keep an animal warm.
    - Where is warmth needed?
    solution: 'Step 1: thick fur and fat protect against cold. Step 2: so it lives in icy polar regions.'
    mistakes:
      Hot deserts: c6s2_habitat
      Tropical rivers: c6s2_habitat
  - prompt: Why does a camel have long legs?
    options:
    - To keep its body away from the hot sand
    - To climb trees
    - To swim
    answer: To keep its body away from the hot sand
    difficulty: 2
    hints:
    - Camels live in deserts.
    - The sand gets very hot.
    solution: 'Step 1: desert sand is very hot. Step 2: long legs keep the body higher, away from that heat.'
    mistakes:
      To climb trees: c6s2_habitat
      To swim: c6s2_habitat
  - prompt: A frog lives both in water and on land. Which feature helps it swim?
    options:
    - Webbed feet
    - Thick fur
    - A hump
    answer: Webbed feet
    difficulty: 1
    hints:
    - Think of a duck's feet too.
    - Skin between toes pushes water.
    solution: 'Step 1: webbing between toes works like a paddle. Step 2: so webbed feet help a frog swim.'
    mistakes:
      Thick fur: c6s2_habitat
      A hump: c6s2_habitat
  - prompt: Which animal is best suited to a grassland habitat?
    options:
    - Deer
    - Whale
    - Polar bear
    answer: Deer
    difficulty: 2
    hints:
    - Grasslands are warm open lands with grass.
    - Who eats grass and runs fast?
    solution: 'Step 1: whales need seas and polar bears ice. Step 2: deer eat grass and run fast in open land.'
    mistakes:
      Whale: c6s2_habitat
      Polar bear: c6s2_habitat
  - prompt: Why should we protect the variety of living things?
    options:
    - Living things depend on each other
    - Only big animals matter
    - Diversity has no use
    answer: Living things depend on each other
    difficulty: 2
    hints:
    - Think of bees and flowers.
    - Losing one kind affects others.
    solution: 'Step 1: plants need insects, animals need plants. Step 2: losing one kind harms others, so diversity matters.'
    mistakes:
      Only big animals matter: c6s2_group
      Diversity has no use: c6s2_group
  - prompt: Animals were sorted into 'flies' and 'does not fly'. Which one is in the wrong group?
    options:
    - Ostrich under 'flies'
    - Bat under 'flies'
    - Cow under 'does not fly'
    answer: Ostrich under 'flies'
    difficulty: 3
    hints:
    - Check each animal against the feature.
    - Not all birds can fly.
    solution: 'Step 1: bats do fly and cows do not. Step 2: an ostrich is a bird that cannot fly, so it is misplaced.'
    mistakes:
      Bat under 'flies': c6s2_group
      Cow under 'does not fly': c6s2_group
  - prompt: Earthworms live in damp soil. Which feature suits that habitat?
    options:
    - A soft, slimy body that slides through soil
    - Thick fur
    - Gills
    answer: A soft, slimy body that slides through soil
    difficulty: 2
    hints:
    - They burrow underground.
    - Which feature helps move through soil?
    solution: 'Step 1: earthworms move through soil. Step 2: a soft slimy body helps them slide through it and stay moist.'
    mistakes:
      Thick fur: c6s2_habitat
      Gills: c6s2_habitat
