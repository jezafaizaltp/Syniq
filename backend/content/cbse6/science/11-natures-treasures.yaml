# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 11. Format: content/README.md.
subject: cbse6-sci
chapter: 11
title: Nature's Treasures
tips:
  c6s_renewable: Renewable resources are replaced by nature quickly (sun, wind, water). Coal and petroleum take millions of years, so they are non-renewable.
  t6_chipko: "'Chipko' means to hug or cling. What did people cling to?"
  t6_deforestation: "Afforestation means planting trees. Cutting forests down is the opposite word."
  t6_forests: "Forests give us many things: wood, food, medicine and homes for animals."
  t6_fossil_fuels: "Fossils are remains of very old living things. Fossil fuels formed from those remains."
  t6_kavu: "Ghats are hills and kayal are backwaters. Sacred groves have their own Malayalam name, often beside a temple."
  t6_non_renewable: "Non-renewable means it can't be replaced quickly. Which one formed over millions of years?"
  t6_oxygen: "Which gas do we need to breathe?"
  t6_reuse_bag: "Burning and wasting destroy the bag. Using the same bag again and again is one of the three Rs."
  t6_save_electricity: "Which choice turns something off when it isn't needed?"
  t6_soil_erosion: "Tree roots hold soil. Without them, rain washes soil away."
  t6_wind: "Coal and petroleum are burnt. A windmill burns nothing; its blades are pushed. What pushes them?"
  c6s11_renew: Ask whether nature can refill it within a human lifetime, or whether it took millions of years to form.
  c6s11_use: 'Think about what each resource gives us: breath, power, food, shelter or fuel.'
  c6s11_harm: 'Follow the chain: what is lost first, and what does that loss cause next?'
  c6s11_save: Choose the action that uses less, uses again, or replaces what was taken.
  c6s11_people: Recall the communities and movements that protected trees and animals, and where they were.
concepts:
- code: cbse6s.nat.resources
  title: Natural resources
  notes: |
    Natural resources: things from nature that we use: air, water, sunlight, soil, forests, minerals, coal, petroleum,
    natural gas. Air: oxygen for breathing, wind for windmills. Water: drinking, farming, electricity. Sun: light and heat,
    solar energy. Soil: growing food. Forests: wood, food, medicines, homes for animals. Renewable (sun, wind, water,
    forests if replanted) vs non-renewable (coal, petroleum, natural gas: formed over millions of years from buried
    plants and animals: fossil fuels).
  explanations:
    text: 'Nature gives us air, water, sunlight, soil, forests and minerals. These are natural resources. Some, like sunlight and wind, will not run out: they are renewable. Others, like coal and petroleum, took millions of years to form and will run out: they are non-renewable.'
    visual: 'Picture a landscape: the sun, a windmill on a hill, a river with a dam, fields of soil, a forest, and a coal mine under the ground. Mark each as renewable or not.'
    step_by_step: 'Step 1: Name the resource. Step 2: Ask: does nature replace it quickly? Step 3: Yes: renewable. No (takes millions of years): non-renewable. Step 4: Think how to use it wisely.'
    real_world: Rooftop solar panels in India use sunlight, a renewable resource, while petrol for cars comes from non-renewable petroleum.
  picture:
    kind: compare
    columns:
    - title: Renewable
      points:
      - sunlight
      - wind
      - water
    - title: Non-renewable
      points:
      - coal
      - petroleum
      - natural gas
    alt: Sunlight, wind and water are renewable; coal, petroleum and natural gas are non-renewable.
  activity:
    type: sort
    prompt: Will it run out if we use too much?
    bins:
    - Will not run out
    - Can run out
    items:
    - label: Sunlight
      bin: Will not run out
      clue: Will the Sun stop shining in our lifetime?
      why: 'The Sun keeps shining: it will not run out.'
    - label: Wind
      bin: Will not run out
      clue: Does wind keep coming back?
      why: 'Wind keeps blowing: it will not run out.'
    - label: Air
      bin: Will not run out
      clue: Is air used up for ever when we breathe?
      why: 'Air is renewed by nature: it will not run out.'
    - label: Coal
      bin: Can run out
      why: 'It took millions of years to form: it can run out.'
      clue: How long did coal take to form?
    - label: Petroleum
      bin: Can run out
      clue: Can we make new petroleum quickly?
      why: 'It formed over millions of years: it can run out.'
    - label: Natural gas
      bin: Can run out
      clue: Is it formed quickly, or over millions of years?
      why: 'Formed over millions of years: it can run out.'
  lesson:
    - teach: 'Natural resources are things from nature that we use: air, water, sunlight, soil, forests, minerals, coal and petroleum. We don''t make them; nature gives them.'
      check:
        prompt: Which is a natural resource?
        options:
        - Soil
        - Plastic chair
        - Cement bag
        answer: Soil
        why: Soil comes from nature; chairs and cement are made by people.
    - teach: Each resource has many uses. Air gives oxygen to breathe and wind to turn windmills. Sunlight gives light, heat and solar power. Water is for drinking, farming and making electricity. Forests give wood, fruit, medicines and homes for animals.
      picture:
        kind: compare
        columns:
        - title: Air
          points:
          - oxygen to breathe
          - wind energy
        - title: Sunlight
          points:
          - light and heat
          - solar panels
        - title: Forests
          points:
          - wood, fruit, medicine
          - homes for animals
        alt: Air gives oxygen and wind energy, sunlight gives heat and solar power, forests give wood, food, medicine and homes.
      check:
        prompt: Solar panels on a roof use which resource?
        options:
        - Sunlight
        - Coal
        - Soil
        answer: Sunlight
        why: They turn sunlight into electricity.
    - teach: 'Renewable resources are refilled by nature: sunlight, wind, water, and forests if we replant. Non-renewable resources took millions of years to form and will run out: coal, petroleum and natural gas, called fossil fuels because they formed from buried plants and animals.'
      picture:
        kind: compare
        columns:
        - title: Renewable
          points:
          - sunlight
          - wind
          - water
          - forests (if replanted)
        - title: Non-renewable
          points:
          - coal
          - petroleum
          - natural gas
        alt: Sunlight, wind, water and forests are renewable; coal, petroleum and natural gas are not.
      check:
        prompt: Why will coal run out one day?
        options:
        - It takes millions of years to form
        - It melts in the Sun
        - Plants eat it
        answer: It takes millions of years to form
        why: We use it far faster than nature can make more.
  items:
  - prompt: Which is a renewable resource?
    options:
    - Sunlight
    - Coal
    - Petroleum
    - Natural gas
    answer: Sunlight
    difficulty: 1
    hints:
    - It will not run out.
    - Every day.
    solution: Sunlight is renewable.
    mistakes:
      Coal: c6s_renewable
  - prompt: 'Coal and petroleum are called fossil fuels because:'
    options:
    - they formed from remains of ancient plants and animals
    - they are found in rivers
    - they are made in factories
    - they are renewable
    answer: they formed from remains of ancient plants and animals
    difficulty: 2
    hints:
    - Buried long ago.
    - Fossils.
    solution: They formed over millions of years from buried living things.
    mistakes: {"they are made in factories": "t6_fossil_fuels", "they are renewable": "t6_fossil_fuels"}
  - prompt: Which gas in air do we need to breathe?
    options:
    - Oxygen
    - Carbon dioxide
    - Nitrogen
    - Smoke
    answer: Oxygen
    difficulty: 1
    hints:
    - We breathe it in.
    - Needed for life.
    solution: We need oxygen.
    mistakes: {"Carbon dioxide": "t6_oxygen", "Nitrogen": "t6_oxygen"}
  - prompt: Windmills use which resource?
    options:
    - Wind (moving air)
    - Coal
    - Petroleum
    - Soil
    answer: Wind (moving air)
    difficulty: 1
    hints:
    - Blades turn.
    - Moving air.
    solution: Windmills use wind energy.
    mistakes: {"Coal": "t6_wind", "Petroleum": "t6_wind"}
  - prompt: Which is non-renewable?
    options:
    - Petroleum
    - Wind
    - Sunlight
    - Rainwater
    answer: Petroleum
    difficulty: 1
    hints:
    - It took millions of years to form.
    - Fuel for cars.
    solution: Petroleum is non-renewable.
    mistakes: {"Wind": "t6_non_renewable", "Sunlight": "t6_non_renewable"}
  - prompt: 'Forests give us:'
    options:
    - wood, food, medicines and homes for animals
    - only plastic
    - petrol
    - electricity directly
    answer: wood, food, medicines and homes for animals
    difficulty: 2
    hints:
    - Think of everything trees give.
    - Many uses.
    solution: Forests provide many things for people and animals.
    mistakes: {"only plastic": "t6_forests", "petrol": "t6_forests"}
  - prompt: Which is a fossil fuel?
    options:
    - Natural gas
    - Wind
    - Sunlight
    answer: Natural gas
    difficulty: 1
    hints:
    - Fossil fuels formed from ancient remains.
    - Wind and sunlight are not dug out.
    solution: 'Step 1: wind and sunlight are renewable. Step 2: natural gas formed underground over millions of years: a fossil fuel.'
    mistakes:
      Wind: c6s11_renew
      Sunlight: c6s11_renew
  - prompt: Which resource is renewable?
    options:
    - Wind
    - Coal
    - Petroleum
    answer: Wind
    difficulty: 1
    hints:
    - Which one keeps coming back on its own?
    - Coal and petroleum are dug up.
    solution: 'Step 1: coal and petroleum will run out. Step 2: wind keeps blowing, so it is renewable.'
    mistakes:
      Coal: c6s11_renew
      Petroleum: c6s11_renew
  - prompt: 'Petrol and diesel are made from:'
    options:
    - Petroleum
    - Coal
    - Wood
    answer: Petroleum
    difficulty: 2
    hints:
    - They are liquid fuels.
    - Crude oil is dug from deep wells.
    solution: 'Step 1: crude oil is called petroleum. Step 2: it is refined to make petrol and diesel.'
    mistakes:
      Coal: c6s11_use
      Wood: c6s11_use
  - prompt: 'Forests are called renewable only if:'
    options:
    - We plant new trees to replace those cut
    - We cut all the trees
    - We burn them
    answer: We plant new trees to replace those cut
    difficulty: 2
    hints:
    - Trees take years to grow.
    - What keeps a forest going?
    solution: 'Step 1: trees regrow, but slowly. Step 2: forests stay renewable only if we replant what we cut.'
    mistakes:
      We cut all the trees: c6s11_renew
      We burn them: c6s11_renew
  - prompt: Which resource do farmers need most to grow crops, besides water and sunlight?
    options:
    - Fertile soil
    - Coal
    - Natural gas
    answer: Fertile soil
    difficulty: 1
    hints:
    - Plants stand in it.
    - It holds water and nutrients.
    solution: 'Step 1: plants take water and nutrients from the ground. Step 2: so they need fertile soil.'
    mistakes:
      Coal: c6s11_use
      Natural gas: c6s11_use
  - prompt: Which is a use of water as an energy resource?
    options:
    - Turning turbines at a dam to make electricity
    - Washing clothes
    - Drinking
    answer: Turning turbines at a dam to make electricity
    difficulty: 2
    hints:
    - Energy resource means it gives power.
    - Falling water can spin something.
    solution: 'Step 1: water falling from a dam spins turbines. Step 2: these make hydroelectricity.'
    mistakes:
      Washing clothes: c6s11_use
      Drinking: c6s11_use
  - prompt: Which medicine plant from Indian forests is well known for healing?
    options:
    - Neem
    - Plastic
    - Coal
    answer: Neem
    difficulty: 1
    hints:
    - It is a tree.
    - Its leaves are used to keep insects away and on skin.
    solution: 'Step 1: coal and plastic are not plants. Step 2: neem leaves and bark are used as medicine.'
    mistakes:
      Plastic: c6s11_use
      Coal: c6s11_use
  - prompt: 'Coal formed from:'
    options:
    - Plants buried millions of years ago
    - Rocks melting
    - Sea salt
    answer: Plants buried millions of years ago
    difficulty: 2
    hints:
    - It is a fossil fuel.
    - Ancient forests were buried.
    solution: 'Step 1: ancient forests were buried under soil. Step 2: heat and pressure over millions of years turned them into coal.'
    mistakes:
      Rocks melting: c6s11_renew
      Sea salt: c6s11_renew
  - prompt: Which energy source causes the least air pollution?
    options:
    - Solar energy
    - Burning coal
    - Burning diesel
    answer: Solar energy
    difficulty: 2
    hints:
    - Burning makes smoke.
    - Which one burns nothing?
    solution: 'Step 1: coal and diesel give out smoke when burnt. Step 2: solar panels burn nothing, so they pollute least.'
    mistakes:
      Burning coal: c6s11_renew
      Burning diesel: c6s11_renew
- code: cbse6s.nat.conserve
  title: Using nature's treasures wisely
  after:
  - cbse6s.nat.resources
  notes: |
    Overuse harms resources: cutting forests (deforestation) causes soil erosion and loss of animal homes; burning fossil
    fuels pollutes air. Conserve: switch off lights and fans, use public transport or cycles, save water, plant trees,
    reduce, reuse, recycle. Indian traditions value nature: sacred groves (kavu in Kerala), Chipko movement (people hugged
    trees to save them, 1970s Uttarakhand), Bishnoi community protecting trees and blackbuck.
  explanations:
    text: 'If we use resources carelessly, they get spoiled or run out. Cutting too many trees causes soil to wash away. Burning fuels dirties the air. We can save resources: switch off lights, save water, plant trees, and reduce, reuse and recycle.'
    visual: 'Picture two hills: one bare after the trees were cut, with mud sliding down in rain; one covered with trees whose roots hold the soil.'
    step_by_step: 'Step 1: Spot how a resource is being wasted. Step 2: Think of the harm it causes. Step 3: Find a simple habit that saves it. Step 4: Do it every day.'
    real_world: Kerala's sacred groves (kavu) have protected patches of forest for centuries; in the Chipko movement, villagers hugged trees to stop them being cut.
  picture:
    kind: compare
    columns:
    - title: Careless use
      points:
      - cutting forests
      - wasting electricity
      - leaving taps open
    - title: Wise use
      points:
      - planting trees
      - switching off lights
      - fixing leaks
    alt: Careless use like cutting forests and wasting power harms nature; planting trees, switching off lights and fixing leaks save resources.
  activity:
    type: sort
    prompt: Does it save resources or waste them?
    bins:
    - Saves
    - Wastes
    items:
    - label: Switching off the fan when leaving
      bin: Saves
      clue: Is electricity being used for nothing?
      why: 'No electricity is wasted: saves.'
    - label: Leaving the tap running while brushing
      bin: Wastes
      clue: Where does that water go?
      why: 'Clean water goes down the drain: wastes.'
    - label: Writing on both sides of paper
      bin: Saves
      clue: How many sheets does it use?
      why: 'Half the paper, fewer trees: saves.'
    - label: Cycling to a nearby shop
      bin: Saves
      clue: Does it burn fuel?
      why: 'No fuel burned: saves.'
    - label: Throwing away leftover food
      bin: Wastes
      clue: What happens to the food and the work that grew it?
      why: 'Good food and the water used to grow it are thrown away: wastes.'
    - label: Using a new plastic bag every time
      bin: Wastes
      clue: Where do all those bags end up?
      why: 'More plastic made and thrown away: wastes.'
  lesson:
    - teach: Overusing resources harms nature. Cutting forests on a large scale (deforestation) leaves soil bare, so rain washes it away (soil erosion), and animals lose their homes. Burning fuels pollutes the air.
      picture:
        kind: flow
        steps:
        - Trees cut
        - Roots gone
        - Rain washes soil
        - Animals lose homes
        alt: When trees are cut, roots no longer hold soil, rain washes it away and animals lose their homes.
      check:
        prompt: Why does soil wash away faster on a bare hill?
        options:
        - No roots hold the soil
        - The hill is too high
        - Rain is heavier there
        answer: No roots hold the soil
        why: Tree roots bind soil together.
    - teach: 'We can conserve resources: switch off lights and fans, walk, cycle or take a bus, save water, plant trees, and reduce, reuse and recycle.'
      check:
        prompt: Which saves fuel and reduces pollution?
        options:
        - Cycling to a nearby shop
        - Driving a car for 200 m
        - Leaving the engine running
        answer: Cycling to a nearby shop
        why: Cycling burns no fuel.
    - teach: Indian communities have protected nature for centuries. Kerala's sacred groves (kavu) are protected patches of forest. In the Chipko movement (1970s, Uttarakhand), people hugged trees to stop them being cut. The Bishnoi community of Rajasthan protects trees and blackbuck.
      picture:
        kind: compare
        columns:
        - title: Kavu
          points:
          - Kerala
          - sacred groves
        - title: Chipko
          points:
          - Uttarakhand, 1970s
          - hugging trees
        - title: Bishnoi
          points:
          - Rajasthan
          - trees and blackbuck
        alt: Kavu in Kerala, the Chipko movement in Uttarakhand, and the Bishnoi of Rajasthan all protect nature.
      check:
        prompt: Which community is known for protecting blackbuck?
        options:
        - Bishnoi
        - Chipko
        - Kavu
        answer: Bishnoi
        why: The Bishnoi of Rajasthan protect trees and blackbuck.
  items:
  - prompt: 'Cutting down forests on a large scale is called:'
    options:
    - Deforestation
    - Afforestation
    - Recycling
    - Irrigation
    answer: Deforestation
    difficulty: 1
    hints:
    - De- means removing.
    - Forests removed.
    solution: This is deforestation.
    mistakes: {"Afforestation": "t6_deforestation", "Recycling": "t6_deforestation"}
  - prompt: What happens to soil when trees on a hill are cut?
    options:
    - Rain washes it away (soil erosion)
    - It becomes richer
    - Nothing
    - It turns to rock
    answer: Rain washes it away (soil erosion)
    difficulty: 2
    hints:
    - Roots held the soil.
    - Erosion.
    solution: Without roots, soil is washed away.
    mistakes: {"It becomes richer": "t6_soil_erosion", "Nothing": "t6_soil_erosion"}
  - prompt: 'In the Chipko movement, people:'
    options:
    - hugged trees to stop them being cut
    - cut trees for wood
    - built dams
    - planted crops
    answer: hugged trees to stop them being cut
    difficulty: 1
    hints:
    - '''Chipko'' means to stick.'
    - Uttarakhand, 1970s.
    solution: Villagers hugged trees to protect them.
    mistakes: {"cut trees for wood": "t6_chipko", "built dams": "t6_chipko"}
  - prompt: Which habit saves electricity?
    options:
    - Switching off fans when leaving a room
    - Leaving the TV on
    - Keeping the fridge door open
    - Using lights in daytime
    answer: Switching off fans when leaving a room
    difficulty: 1
    hints:
    - Don't use it when not needed.
    - Off.
    solution: Switching off saves electricity.
    mistakes: {"Leaving the TV on": "t6_save_electricity", "Keeping the fridge door open": "t6_save_electricity"}
  - prompt: 'Sacred groves in Kerala are called:'
    options:
    - Kavu
    - Ghats
    - Kayal
    - Thottam
    answer: Kavu
    difficulty: 2
    hints:
    - Small forests near temples.
    - Protected for centuries.
    solution: Kerala's sacred groves are called kavu.
    mistakes: {"Ghats": "t6_kavu", "Kayal": "t6_kavu"}
  - prompt: 'Using a cloth bag again and again instead of new plastic bags is:'
    options:
    - Reusing
    - Wasting
    - Burning
    - Deforestation
    answer: Reusing
    difficulty: 1
    hints:
    - Use again.
    - One of the 3 Rs.
    solution: That is reusing.
    mistakes: {"Wasting": "t6_reuse_bag", "Burning": "t6_reuse_bag"}
  - prompt: Which habit saves water?
    options:
    - Turning off the tap while brushing
    - Bathing with a running hose
    - Leaving taps dripping
    answer: Turning off the tap while brushing
    difficulty: 1
    hints:
    - Which one uses less water?
    - The other two waste it.
    solution: 'Step 1: running taps waste water. Step 2: turning the tap off while brushing saves litres each day.'
    mistakes:
      Bathing with a running hose: c6s11_save
      Leaving taps dripping: c6s11_save
  - prompt: When a forest is cut down, what happens to the animals living there?
    options:
    - They lose their homes and food
    - They become stronger
    - Nothing changes
    answer: They lose their homes and food
    difficulty: 1
    hints:
    - Forests are their habitat.
    - What do trees give animals?
    solution: 'Step 1: forests give animals shelter and food. Step 2: cutting them leaves animals homeless and hungry.'
    mistakes:
      They become stronger: c6s11_harm
      Nothing changes: c6s11_harm
  - prompt: In which state did the Chipko movement begin?
    options:
    - Uttarakhand
    - Kerala
    - Gujarat
    answer: Uttarakhand
    difficulty: 2
    hints:
    - It began in Himalayan villages.
    - In the 1970s.
    solution: 'Step 1: the Chipko movement began in Himalayan villages. Step 2: that region is now Uttarakhand.'
    mistakes:
      Kerala: c6s11_people
      Gujarat: c6s11_people
  - prompt: Kavu are found in which state?
    options:
    - Kerala
    - Rajasthan
    - Punjab
    answer: Kerala
    difficulty: 1
    hints:
    - Kavu is a Malayalam word.
    - Sacred groves near temples.
    solution: 'Step 1: kavu is a Malayalam word for sacred grove. Step 2: they are found in Kerala.'
    mistakes:
      Rajasthan: c6s11_people
      Punjab: c6s11_people
  - prompt: Which action is recycling?
    options:
    - Sending old newspapers to be made into new paper
    - Using a jar again for pickles
    - Buying fewer things
    answer: Sending old newspapers to be made into new paper
    difficulty: 2
    hints:
    - Recycling makes new material from old.
    - Which one goes to a factory?
    solution: 'Step 1: reusing keeps the item as it is; reducing means buying less. Step 2: making new paper from old is recycling.'
    mistakes:
      Using a jar again for pickles: c6s11_save
      Buying fewer things: c6s11_save
  - prompt: Why does burning a lot of coal and petrol harm us?
    options:
    - It pollutes the air we breathe
    - It makes water sweeter
    - It creates more coal
    answer: It pollutes the air we breathe
    difficulty: 2
    hints:
    - Burning gives out smoke and gases.
    - Where do they go?
    solution: 'Step 1: burning fuels releases smoke and harmful gases. Step 2: these pollute the air and affect health.'
    mistakes:
      It makes water sweeter: c6s11_harm
      It creates more coal: c6s11_harm
  - prompt: Which is the best thing to do on a hillside where trees were cut?
    options:
    - Plant trees and grass to hold the soil
    - Build roads all over it
    - Burn the remaining plants
    answer: Plant trees and grass to hold the soil
    difficulty: 2
    hints:
    - Bare soil washes away.
    - What holds soil together?
    solution: 'Step 1: roots bind soil. Step 2: planting trees and grass stops erosion.'
    mistakes:
      Build roads all over it: c6s11_harm
      Burn the remaining plants: c6s11_harm
  - prompt: 'A family switches to LED bulbs and switches off fans when leaving rooms. They are:'
    options:
    - Saving electricity
    - Wasting electricity
    - Recycling bulbs
    answer: Saving electricity
    difficulty: 1
    hints:
    - LED bulbs use less power.
    - Fans off means less use.
    solution: 'Step 1: both actions cut electricity use. Step 2: so they are saving electricity.'
    mistakes:
      Wasting electricity: c6s11_save
      Recycling bulbs: c6s11_save
  - prompt: Why are sacred groves good for nature?
    options:
    - Trees and animals there are left undisturbed
    - They are cleared every year
    - They are used for mining
    answer: Trees and animals there are left undisturbed
    difficulty: 3
    hints:
    - People do not cut trees there.
    - What does that mean for wildlife?
    solution: 'Step 1: cutting and hunting are not allowed in sacred groves. Step 2: so plants and animals are protected there.'
    mistakes:
      They are cleared every year: c6s11_people
      They are used for mining: c6s11_people
