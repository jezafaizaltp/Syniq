# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 11. Format: content/README.md.
subject: cbse6-sci
chapter: 11
title: Nature's Treasures
tips:
  c6s_renewable: Renewable resources are replaced by nature quickly (sun, wind, water). Coal and petroleum take millions of years, so they are non-renewable.
concepts:
- code: cbse6s.nat.resources
  title: Natural resources
  notes: |
    Natural resources: things from nature that we use: air, water, sunlight, soil, forests, minerals, coal, petroleum,
    natural gas. Air: oxygen for breathing, wind for windmills. Water: drinking, farming, electricity. Sun: light and heat,
    solar energy. Soil: growing food. Forests: wood, food, medicines, homes for animals. Renewable (sun, wind, water,
    forests if replanted) vs non-renewable (coal, petroleum, natural gas: formed over millions of years from buried
    plants and animals: fossil fuels).
  explanations:
    text: 'Nature gives us air, water, sunlight, soil, forests and minerals. These are natural resources. Some, like sunlight and wind, will not run out: they are renewable. Others, like coal and petroleum, took millions of years to form and will run out: they are non-renewable.'
    visual: 'Picture a landscape: the sun, a windmill on a hill, a river with a dam, fields of soil, a forest, and a coal mine under the ground. Mark each as renewable or not.'
    step_by_step: 'Step 1: Name the resource. Step 2: Ask: does nature replace it quickly? Step 3: Yes: renewable. No (takes millions of years): non-renewable. Step 4: Think how to use it wisely.'
    real_world: Rooftop solar panels in India use sunlight, a renewable resource, while petrol for cars comes from non-renewable petroleum.
  picture:
    kind: compare
    columns:
    - title: Renewable
      points:
      - sunlight
      - wind
      - water
    - title: Non-renewable
      points:
      - coal
      - petroleum
      - natural gas
    alt: Sunlight, wind and water are renewable; coal, petroleum and natural gas are non-renewable.
  activity:
    type: sort
    prompt: Will it run out if we use too much?
    bins:
    - Will not run out
    - Can run out
    items:
    - label: Sunlight
      bin: Will not run out
    - label: Wind
      bin: Will not run out
    - label: Air
      bin: Will not run out
    - label: Coal
      bin: Can run out
      why: It took millions of years to form.
    - label: Petroleum
      bin: Can run out
    - label: Natural gas
      bin: Can run out
  items:
  - prompt: Which is a renewable resource?
    options:
    - Sunlight
    - Coal
    - Petroleum
    - Natural gas
    answer: Sunlight
    difficulty: 1
    hints:
    - It will not run out.
    - Every day.
    solution: Sunlight is renewable.
    mistakes:
      Coal: c6s_renewable
  - prompt: 'Coal and petroleum are called fossil fuels because:'
    options:
    - they formed from remains of ancient plants and animals
    - they are found in rivers
    - they are made in factories
    - they are renewable
    answer: they formed from remains of ancient plants and animals
    difficulty: 2
    hints:
    - Buried long ago.
    - Fossils.
    solution: They formed over millions of years from buried living things.
  - prompt: Which gas in air do we need to breathe?
    options:
    - Oxygen
    - Carbon dioxide
    - Nitrogen
    - Smoke
    answer: Oxygen
    difficulty: 1
    hints:
    - We breathe it in.
    - Needed for life.
    solution: We need oxygen.
  - prompt: Windmills use which resource?
    options:
    - Wind (moving air)
    - Coal
    - Petroleum
    - Soil
    answer: Wind (moving air)
    difficulty: 1
    hints:
    - Blades turn.
    - Moving air.
    solution: Windmills use wind energy.
  - prompt: Which is non-renewable?
    options:
    - Petroleum
    - Wind
    - Sunlight
    - Rainwater
    answer: Petroleum
    difficulty: 1
    hints:
    - It took millions of years to form.
    - Fuel for cars.
    solution: Petroleum is non-renewable.
  - prompt: 'Forests give us:'
    options:
    - wood, food, medicines and homes for animals
    - only plastic
    - petrol
    - electricity directly
    answer: wood, food, medicines and homes for animals
    difficulty: 2
    hints:
    - Think of everything trees give.
    - Many uses.
    solution: Forests provide many things for people and animals.
- code: cbse6s.nat.conserve
  title: Using nature's treasures wisely
  after:
  - cbse6s.nat.resources
  notes: |
    Overuse harms resources: cutting forests (deforestation) causes soil erosion and loss of animal homes; burning fossil
    fuels pollutes air. Conserve: switch off lights and fans, use public transport or cycles, save water, plant trees,
    reduce, reuse, recycle. Indian traditions value nature: sacred groves (kavu in Kerala), Chipko movement (people hugged
    trees to save them, 1970s Uttarakhand), Bishnoi community protecting trees and blackbuck.
  explanations:
    text: 'If we use resources carelessly, they get spoiled or run out. Cutting too many trees causes soil to wash away. Burning fuels dirties the air. We can save resources: switch off lights, save water, plant trees, and reduce, reuse and recycle.'
    visual: 'Picture two hills: one bare after the trees were cut, with mud sliding down in rain; one covered with trees whose roots hold the soil.'
    step_by_step: 'Step 1: Spot how a resource is being wasted. Step 2: Think of the harm it causes. Step 3: Find a simple habit that saves it. Step 4: Do it every day.'
    real_world: Kerala's sacred groves (kavu) have protected patches of forest for centuries; in the Chipko movement, villagers hugged trees to stop them being cut.
  picture:
    kind: compare
    columns:
    - title: Careless use
      points:
      - cutting forests
      - wasting electricity
      - leaving taps open
    - title: Wise use
      points:
      - planting trees
      - switching off lights
      - fixing leaks
    alt: Careless use like cutting forests and wasting power harms nature; planting trees, switching off lights and fixing leaks save resources.
  activity:
    type: sort
    prompt: Does it save resources or waste them?
    bins:
    - Saves
    - Wastes
    items:
    - label: Switching off the fan when leaving
      bin: Saves
    - label: Leaving the tap running while brushing
      bin: Wastes
    - label: Writing on both sides of paper
      bin: Saves
    - label: Cycling to a nearby shop
      bin: Saves
    - label: Throwing away leftover food
      bin: Wastes
    - label: Using a new plastic bag every time
      bin: Wastes
  items:
  - prompt: 'Cutting down forests on a large scale is called:'
    options:
    - Deforestation
    - Afforestation
    - Recycling
    - Irrigation
    answer: Deforestation
    difficulty: 1
    hints:
    - De- means removing.
    - Forests removed.
    solution: This is deforestation.
  - prompt: What happens to soil when trees on a hill are cut?
    options:
    - Rain washes it away (soil erosion)
    - It becomes richer
    - Nothing
    - It turns to rock
    answer: Rain washes it away (soil erosion)
    difficulty: 2
    hints:
    - Roots held the soil.
    - Erosion.
    solution: Without roots, soil is washed away.
  - prompt: 'In the Chipko movement, people:'
    options:
    - hugged trees to stop them being cut
    - cut trees for wood
    - built dams
    - planted crops
    answer: hugged trees to stop them being cut
    difficulty: 1
    hints:
    - '''Chipko'' means to stick.'
    - Uttarakhand, 1970s.
    solution: Villagers hugged trees to protect them.
  - prompt: Which habit saves electricity?
    options:
    - Switching off fans when leaving a room
    - Leaving the TV on
    - Keeping the fridge door open
    - Using lights in daytime
    answer: Switching off fans when leaving a room
    difficulty: 1
    hints:
    - Don't use it when not needed.
    - Off.
    solution: Switching off saves electricity.
  - prompt: 'Sacred groves in Kerala are called:'
    options:
    - Kavu
    - Ghats
    - Kayal
    - Thottam
    answer: Kavu
    difficulty: 2
    hints:
    - Small forests near temples.
    - Protected for centuries.
    solution: Kerala's sacred groves are called kavu.
  - prompt: 'Using a cloth bag again and again instead of new plastic bags is:'
    options:
    - Reusing
    - Wasting
    - Burning
    - Deforestation
    answer: Reusing
    difficulty: 1
    hints:
    - Use again.
    - One of the 3 Rs.
    solution: That is reusing.
