# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 6. Format: content/README.md.
subject: cbse6-sci
chapter: 6
title: Materials Around Us
tips:
  c6s_transparent: "Wood blocks all light. Look for the material you can see through clearly, like a window."
  t6_floats: "Which choice is light for its size?"
  t6_handles: "A handle should stay cool. Plastic and wood don't let heat through easily."
  t6_lustre: "The shine of metals has a special name."
  t6_natural: "Natural materials come from plants or animals. Plastic, nylon and polyester are made in factories."
  t6_pans: "Pans must carry heat to food and be strong."
  t6_paper_wood: "Paper is made from pulp. Where does the pulp come from?"
  t6_plastic_pollutes: "Plastic doesn't rot. What happens to it after one use?"
  t6_reusing: "Reusing means using the same thing again for something useful."
  t6_soluble: "Which choice disappears into water when stirred?"
  t6_translucent: "Through butter paper you see only a blurry glow: some light passes, but not a clear picture. Which word is in between see-through and blocking?"
  t6_waterproof: "A raincoat must not let water through."
  c6s6_see: 'Ask how much you can see through it: everything clearly, only blurred shapes, or nothing.'
  c6s6_dissolve: 'Stir it in water and wait: does it disappear, or does it settle or float?'
  c6s6_prop: Match the job of the object to the property it needs most.
  c6s6_source: 'Ask where it comes from: straight from nature, or made in a factory? Then think about which part of nature.'
  c6s6_3r: Reduce means use less, reuse means use again as it is, recycle means make into something new.
  c6s6_float: Light, hollow or airy things tend to float; small heavy things tend to sink.
concepts:
- code: cbse6s.mat.props
  title: Properties of materials
  notes: |
    Objects are made of materials (a tumbler can be glass, steel or plastic). Grouping by properties: appearance
    (lustrous metals vs dull), hardness (hard iron vs soft sponge), soluble or insoluble in water (salt, sugar dissolve;
    sand does not), float or sink, transparent / translucent / opaque, magnetic or not. The use of an object depends on
    the properties of its material.
  explanations:
    text: 'Things are made of materials like wood, glass, metal and plastic. Materials have properties: shiny or dull, hard or soft, dissolve in water or not, float or sink, see-through or not. We choose a material for a job because of its properties.'
    visual: Hold a glass sheet, butter paper and a wooden board to a lamp. Through glass you see clearly (transparent), through butter paper dimly (translucent), and through wood not at all (opaque).
    step_by_step: 'Step 1: Pick a property to test. Step 2: Test each material the same way. Step 3: Record the result. Step 4: Group materials that behave the same.'
    real_world: Windows use transparent glass, frosted bathroom windows are translucent, and doors are opaque wood.
  picture:
    kind: compare
    columns:
    - title: Transparent
      points:
      - glass
      - clear water
      - air
    - title: Translucent
      points:
      - butter paper
      - frosted glass
      - oily paper
    - title: Opaque
      points:
      - wood
      - metal
      - cardboard
    alt: Glass and water are transparent, butter paper and frosted glass are translucent, and wood and metal are opaque.
  activity:
    type: sort
    prompt: Can you see through it?
    bins:
    - Transparent
    - Translucent
    - Opaque
    items:
    - label: Clear glass
      bin: Transparent
      why: 'You can see clearly through it: transparent.'
      clue: Can you see clearly through it?
    - label: Clean water
      bin: Transparent
      clue: Can you see clearly through it?
      why: 'You can see through clear water: transparent.'
    - label: Butter paper
      bin: Translucent
      why: 'Some light passes, but you can''t see clearly: translucent.'
      clue: Does some light pass? Can you see clearly?
    - label: Frosted glass
      bin: Translucent
      clue: Does light pass? Can you see shapes clearly?
      why: 'Light passes but things look blurred: translucent.'
    - label: Wood
      bin: Opaque
      why: 'No light passes through: opaque.'
      clue: Does any light pass through?
    - label: Cardboard
      bin: Opaque
      clue: Does any light pass through?
      why: 'No light passes: opaque.'
  lesson:
    - teach: Everything around us is made of materials. One object can be made of different materials (a tumbler of glass, steel or plastic), and one material can make many objects (wood for chairs, doors and pencils).
      check:
        prompt: Which object can be made of wood, plastic OR metal?
        options:
        - A chair
        - A raincoat
        - A window pane
        answer: A chair
        why: Chairs are made of all three; the others need special properties.
    - teach: Materials have properties. Metals are shiny (lustrous); wood is dull. Iron is hard; sponge is soft. Salt and sugar dissolve in water (soluble); sand does not (insoluble). Some things float, others sink.
      check:
        prompt: Which pair are both soluble in water?
        options:
        - Salt and sugar
        - Sand and chalk
        - Oil and sawdust
        answer: Salt and sugar
        why: Both disappear when stirred in water.
    - teach: 'Light passes through some materials. Transparent: you can see clearly through (glass, clean water). Translucent: you see only blurred shapes (butter paper, frosted glass). Opaque: you cannot see through at all (wood, metal, cardboard).'
      picture:
        kind: compare
        columns:
        - title: Transparent
          points:
          - clear glass
          - clean water
        - title: Translucent
          points:
          - butter paper
          - frosted glass
        - title: Opaque
          points:
          - wood
          - cardboard
          - metal
        alt: Glass is transparent, butter paper translucent, wood opaque.
      check:
        prompt: 'A bathroom window lets light in but you can''t see clearly through. Its glass is:'
        options:
        - Translucent
        - Transparent
        - Opaque
        answer: Translucent
        why: Light passes but only blurred shapes are seen.
  items:
  - prompt: Which material is transparent?
    options:
    - Glass
    - Wood
    - Cardboard
    - Iron
    answer: Glass
    difficulty: 1
    hints:
    - You can see clearly through it.
    - Windows.
    solution: Glass is transparent.
    mistakes:
      Wood: c6s_transparent
  - prompt: 'Butter paper is:'
    options:
    - Translucent
    - Transparent
    - Opaque
    - Magnetic
    answer: Translucent
    difficulty: 1
    hints:
    - You see things dimly through it.
    - Partly lets light pass.
    solution: Butter paper is translucent.
    mistakes: {"Transparent": "t6_translucent", "Opaque": "t6_translucent"}
  - prompt: Which dissolves in water?
    options:
    - Sugar
    - Sand
    - Sawdust
    - Chalk powder
    answer: Sugar
    difficulty: 1
    hints:
    - It disappears when stirred.
    - Sweet tea.
    solution: Sugar is soluble in water.
    mistakes: {"Sand": "t6_soluble", "Sawdust": "t6_soluble"}
  - prompt: 'Metals usually have a shine. This is called:'
    options:
    - Lustre
    - Hardness
    - Solubility
    - Opacity
    answer: Lustre
    difficulty: 1
    hints:
    - Shiny surface.
    - Gold, silver.
    solution: The shine of metals is lustre.
    mistakes: {"Hardness": "t6_lustre", "Opacity": "t6_lustre"}
  - prompt: Which object floats on water?
    options:
    - A dry leaf
    - An iron nail
    - A stone
    - A steel spoon
    answer: A dry leaf
    difficulty: 1
    hints:
    - Light and spread out.
    - Try it.
    solution: A dry leaf floats.
    mistakes: {"An iron nail": "t6_floats", "A stone": "t6_floats"}
  - prompt: Why are cooking pans usually made of metal?
    options:
    - Metals conduct heat well and are strong
    - Metals are transparent
    - Metals dissolve in water
    - Metals are soft
    answer: Metals conduct heat well and are strong
    difficulty: 2
    hints:
    - Heat must reach the food.
    - Strong and heat-conducting.
    solution: Metals carry heat well and don't break easily.
    mistakes: {"Metals are transparent": "t6_pans", "Metals are soft": "t6_pans"}
  - prompt: Which material is opaque?
    options:
    - Cardboard
    - Clear plastic sheet
    - Glass
    answer: Cardboard
    difficulty: 1
    hints:
    - Opaque means no light comes through.
    - Which can you not see through at all?
    solution: 'Step 1: glass and clear plastic let you see through. Step 2: cardboard blocks light completely.'
    mistakes:
      Clear plastic sheet: c6s6_see
      Glass: c6s6_see
  - prompt: Which substance does NOT dissolve in water?
    options:
    - Sand
    - Salt
    - Sugar
    answer: Sand
    difficulty: 1
    hints:
    - Stir each in water.
    - Which one settles at the bottom?
    solution: 'Step 1: salt and sugar disappear. Step 2: sand settles: it is insoluble.'
    mistakes:
      Salt: c6s6_dissolve
      Sugar: c6s6_dissolve
  - prompt: Oil is poured into water. What happens?
    options:
    - It forms a layer on top
    - It dissolves completely
    - It sinks to the bottom
    answer: It forms a layer on top
    difficulty: 2
    hints:
    - Oil does not mix with water.
    - It is lighter than water.
    solution: 'Step 1: oil does not dissolve in water. Step 2: it is lighter, so it floats as a layer on top.'
    mistakes:
      It dissolves completely: c6s6_dissolve
      It sinks to the bottom: c6s6_float
  - prompt: Which object will sink in water?
    options:
    - An iron nail
    - A cork
    - A dry leaf
    answer: An iron nail
    difficulty: 1
    hints:
    - Small and heavy things sink.
    - Cork is light and airy.
    solution: 'Step 1: cork and dry leaves float. Step 2: an iron nail is small and heavy, so it sinks.'
    mistakes:
      A cork: c6s6_float
      A dry leaf: c6s6_float
  - prompt: Which is a hard material?
    options:
    - Stone
    - Cotton wool
    - Sponge
    answer: Stone
    difficulty: 1
    hints:
    - Press it with your finger.
    - Which does not get squashed?
    solution: 'Step 1: cotton and sponge squash easily. Step 2: stone does not: it is hard.'
    mistakes:
      Cotton wool: c6s6_prop
      Sponge: c6s6_prop
  - prompt: Why is glass used for windows?
    options:
    - It is transparent and lets light in
    - It is soft
    - It is magnetic
    answer: It is transparent and lets light in
    difficulty: 1
    hints:
    - What do we want from a window?
    - Light and a clear view.
    solution: 'Step 1: windows should let light in and let us see out. Step 2: glass is transparent, so it suits windows.'
    mistakes:
      It is soft: c6s6_prop
      It is magnetic: c6s6_prop
  - prompt: 'Rubbing a piece of copper wire with sandpaper makes it shine. This property is:'
    options:
    - Lustre
    - Solubility
    - Transparency
    answer: Lustre
    difficulty: 2
    hints:
    - Metals have a special shine.
    - Rubbing removes the dull outer layer.
    solution: 'Step 1: the fresh metal surface shines. Step 2: this shine is called lustre.'
    mistakes:
      Solubility: c6s6_prop
      Transparency: c6s6_see
  - prompt: Why are steel tumblers used more than glass tumblers for small children?
    options:
    - Steel does not break easily
    - Steel is transparent
    - Glass is magnetic
    answer: Steel does not break easily
    difficulty: 2
    hints:
    - Small children often drop things.
    - Which material survives a fall?
    solution: 'Step 1: glass can shatter when dropped. Step 2: steel is strong and unbreakable, so it is safer.'
    mistakes:
      Steel is transparent: c6s6_see
      Glass is magnetic: c6s6_prop
  - prompt: 'A sheet of oiled paper lets some light through but you can''t read through it. It is:'
    options:
    - Translucent
    - Transparent
    - Opaque
    answer: Translucent
    difficulty: 2
    hints:
    - Some light comes through.
    - But the view is blurred.
    solution: 'Step 1: some light passes, so it is not opaque. Step 2: you can''t see clearly, so it is translucent.'
    mistakes:
      Transparent: c6s6_see
      Opaque: c6s6_see
- code: cbse6s.mat.choose
  title: Choosing materials and their sources
  after:
  - cbse6s.mat.props
  notes: |
    Materials can be natural (cotton, wood, wool, clay, stone) or human-made (plastic, nylon, glass, steel from iron).
    Choose by need: a raincoat needs a waterproof material; a cooking pot handle needs a poor conductor of heat (plastic,
    wood). Reduce, reuse and recycle materials; plastics last very long and pollute, so avoid single-use plastic. Glass
    and metals can be recycled; paper comes from trees.
  explanations:
    text: 'Some materials come from nature, like cotton, wood and clay. Others are made by people, like plastic and nylon. We choose materials that suit the job: a raincoat must keep water out, and a pan handle must not get hot. Reduce, reuse and recycle to save materials.'
    visual: 'Look at a pressure cooker: metal body (carries heat to food), plastic or wooden handles (stay cool), rubber gasket (seals in steam). Each part has the right material.'
    step_by_step: 'Step 1: Ask what the object must do. Step 2: List the properties needed. Step 3: Pick a material with those properties. Step 4: Think about whether it can be reused or recycled.'
    real_world: Cloth bags and steel bottles replace single-use plastic bags and bottles to reduce waste.
  picture:
    kind: compare
    columns:
    - title: Natural
      points:
      - cotton
      - wood
      - clay
    - title: Human-made
      points:
      - plastic
      - nylon
      - glass
    alt: Cotton, wood and clay are natural materials; plastic, nylon and glass are made by people.
  activity:
    type: sort
    prompt: Does it come from nature, or is it made by people?
    bins:
    - Natural
    - Human-made
    items:
    - label: Cotton
      bin: Natural
      clue: Does it come from a plant or animal, or is it made in a factory?
      why: 'From the cotton plant: natural.'
    - label: Wool
      bin: Natural
      clue: Where does wool come from?
      why: 'From sheep: natural.'
    - label: Wood
      bin: Natural
      clue: Where does wood come from?
      why: 'From trees: natural.'
    - label: Clay
      bin: Natural
      clue: Is it dug from the ground or made in a factory?
      why: 'Dug from the earth: natural.'
    - label: Plastic
      bin: Human-made
      clue: Can you find plastic in nature?
      why: 'Made in factories from petroleum: human-made.'
    - label: Nylon
      bin: Human-made
      clue: Is it from a plant or animal?
      why: 'Made in factories: human-made.'
    - label: Glass
      bin: Human-made
      why: 'Glass is made by melting sand: human-made.'
      clue: Can you find glass growing or lying around in nature?
  lesson:
    - teach: 'Materials are natural or human-made. Natural ones come from plants, animals or the earth: cotton, jute, wool, silk, wood, clay, stone. Human-made ones are made in factories: plastic, nylon, polyester, glass.'
      picture:
        kind: compare
        columns:
        - title: Natural
          points:
          - cotton, jute (plants)
          - wool, silk (animals)
          - clay, stone (earth)
        - title: Human-made
          points:
          - plastic
          - nylon, polyester
          - glass
        alt: Cotton, wool and clay are natural materials; plastic, nylon and glass are made by people.
      check:
        prompt: 'Silk comes from:'
        options:
        - Silkworms
        - Plastic factories
        - Rocks
        answer: Silkworms
        why: Silk is a natural animal fibre.
    - teach: We choose a material by what the object must do. A raincoat must be waterproof. A cooking pot must conduct heat, but its handle must not, so handles are wood or plastic. A rope must be strong.
      check:
        prompt: Why is a frying pan's body made of metal?
        options:
        - Metal lets heat pass through quickly
        - Metal is soft
        - Metal is transparent
        answer: Metal lets heat pass through quickly
        why: Food cooks when heat passes quickly from the flame through the pan.
    - teach: 'Use materials wisely: reduce (use less), reuse (use again), recycle (make into new things). Plastic lasts hundreds of years and pollutes land and water, so avoid single-use plastic. Paper, glass and metal can be recycled.'
      picture:
        kind: flow
        steps:
        - Reduce
        - Reuse
        - Recycle
        alt: 'The three Rs: first use less, then use again, then recycle.'
      check:
        prompt: 'Carrying a cloth bag to the market instead of taking plastic bags is:'
        options:
        - Reducing plastic use
        - Recycling
        - Burning waste
        answer: Reducing plastic use
        why: You use fewer plastic bags.
  items:
  - prompt: Which is a natural material?
    options:
    - Cotton
    - Plastic
    - Nylon
    - Polyester
    answer: Cotton
    difficulty: 1
    hints:
    - It grows on a plant.
    - Not made in a factory.
    solution: Cotton comes from the cotton plant.
    mistakes: {"Plastic": "t6_natural", "Nylon": "t6_natural"}
  - prompt: 'A raincoat should be made of a material that is:'
    options:
    - Waterproof
    - Absorbent
    - Transparent only
    - Magnetic
    answer: Waterproof
    difficulty: 1
    hints:
    - It must keep you dry.
    - Water must not pass.
    solution: A raincoat needs a waterproof material.
    mistakes: {"Absorbent": "t6_waterproof", "Magnetic": "t6_waterproof"}
  - prompt: Why are pan handles often made of plastic or wood?
    options:
    - They do not let heat through easily
    - They are shiny
    - They are magnetic
    - They dissolve
    answer: They do not let heat through easily
    difficulty: 1
    hints:
    - Your hand must not burn.
    - Poor conductors.
    solution: Plastic and wood are poor conductors of heat.
    mistakes: {"They are shiny": "t6_handles", "They are magnetic": "t6_handles"}
  - prompt: 'Paper is made mainly from:'
    options:
    - Wood from trees
    - Sand
    - Plastic
    - Iron
    answer: Wood from trees
    difficulty: 1
    hints:
    - Wood pulp.
    - Trees.
    solution: Paper is made from wood pulp.
    mistakes: {"Sand": "t6_paper_wood", "Plastic": "t6_paper_wood"}
  - prompt: Why should we avoid single-use plastic?
    options:
    - It lasts very long and pollutes
    - It is too expensive
    - It is natural
    - It dissolves in rain
    answer: It lasts very long and pollutes
    difficulty: 2
    hints:
    - It doesn't rot.
    - Fills drains and oceans.
    solution: Plastic stays in the environment for hundreds of years.
    mistakes: {"It is natural": "t6_plastic_pollutes", "It dissolves in rain": "t6_plastic_pollutes"}
  - prompt: Which is an example of reusing?
    options:
    - Using a glass jar to store spices
    - Burning plastic
    - Throwing old clothes away
    - Buying new bags every day
    answer: Using a glass jar to store spices
    difficulty: 2
    hints:
    - Using again for another purpose.
    - No new material.
    solution: Using the jar again is reuse.
    mistakes: {"Burning plastic": "t6_reusing", "Buying new bags every day": "t6_reusing"}
  - prompt: Which is a human-made material?
    options:
    - Nylon
    - Jute
    - Wool
    answer: Nylon
    difficulty: 1
    hints:
    - Jute comes from a plant and wool from sheep.
    - Which is made in a factory?
    solution: 'Step 1: jute and wool are natural. Step 2: nylon is made in factories.'
    mistakes:
      Jute: c6s6_source
      Wool: c6s6_source
  - prompt: 'Clay pots (matkas) are made from a material that comes from:'
    options:
    - The earth
    - Animals
    - Factories only
    answer: The earth
    difficulty: 1
    hints:
    - Clay is dug from the ground.
    - It is a kind of soil.
    solution: 'Step 1: clay is a fine soil. Step 2: so it comes from the earth.'
    mistakes:
      Animals: c6s6_source
      Factories only: c6s6_source
  - prompt: Which material is best for an umbrella cover?
    options:
    - Waterproof plastic-coated cloth
    - Paper
    - Cotton wool
    answer: Waterproof plastic-coated cloth
    difficulty: 1
    hints:
    - An umbrella must keep rain out.
    - Paper and cotton soak water.
    solution: 'Step 1: the cover must stop water. Step 2: a waterproof coated cloth does that.'
    mistakes:
      Paper: c6s6_prop
      Cotton wool: c6s6_prop
  - prompt: Why are electric wires covered with plastic?
    options:
    - Plastic does not let electricity pass
    - Plastic is shiny
    - Plastic dissolves in water
    answer: Plastic does not let electricity pass
    difficulty: 2
    hints:
    - The cover keeps us safe from shocks.
    - What property does that need?
    solution: 'Step 1: copper inside carries electricity. Step 2: plastic does not conduct it, so it protects us.'
    mistakes:
      Plastic is shiny: c6s6_prop
      Plastic dissolves in water: c6s6_prop
  - prompt: 'Melting old glass bottles to make new ones is:'
    options:
    - Recycling
    - Reducing
    - Reusing
    answer: Recycling
    difficulty: 1
    hints:
    - The old bottles are changed into new material.
    - That is not using them as they are.
    solution: 'Step 1: the glass is melted and made into new bottles. Step 2: that is recycling.'
    mistakes:
      Reducing: c6s6_3r
      Reusing: c6s6_3r
  - prompt: 'Using an old newspaper to wrap a gift is:'
    options:
    - Reusing
    - Recycling
    - Reducing
    answer: Reusing
    difficulty: 2
    hints:
    - The newspaper is used as it is.
    - Nothing new is made from it.
    solution: 'Step 1: the paper is not changed. Step 2: it is used again for another job: reusing.'
    mistakes:
      Recycling: c6s6_3r
      Reducing: c6s6_3r
  - prompt: Why is a cricket bat made of wood rather than glass?
    options:
    - Wood is strong and does not shatter
    - Wood is transparent
    - Glass is too light
    answer: Wood is strong and does not shatter
    difficulty: 2
    hints:
    - The bat hits a hard ball.
    - Which material would break?
    solution: 'Step 1: the bat takes hard hits. Step 2: wood is strong and tough; glass would shatter.'
    mistakes:
      Wood is transparent: c6s6_see
      Glass is too light: c6s6_prop
  - prompt: Which waste takes the longest to break down in nature?
    options:
    - Plastic bottle
    - Banana peel
    - Paper bag
    answer: Plastic bottle
    difficulty: 2
    hints:
    - Natural things rot quickly.
    - Which one is made in a factory from oil?
    solution: 'Step 1: peels and paper rot in weeks or months. Step 2: plastic can last hundreds of years.'
    mistakes:
      Banana peel: c6s6_3r
      Paper bag: c6s6_3r
  - prompt: 'Jute bags are better for the environment than plastic bags because:'
    options:
    - Jute is natural and breaks down in soil
    - Jute is human-made
    - Jute never wears out
    answer: Jute is natural and breaks down in soil
    difficulty: 3
    hints:
    - Where does jute come from?
    - What happens to it when thrown away?
    solution: 'Step 1: jute comes from a plant. Step 2: it rots back into the soil, unlike plastic.'
    mistakes:
      Jute is human-made: c6s6_source
      Jute never wears out: c6s6_3r
