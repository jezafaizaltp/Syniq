# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 6. Format: content/README.md.
subject: cbse6-sci
chapter: 6
title: Materials Around Us
tips:
  c6s_transparent: "Wood blocks all light. Look for the material you can see through clearly, like a window."
  t6_floats: "Which choice is light for its size?"
  t6_handles: "A handle should stay cool. Plastic and wood don't let heat through easily."
  t6_lustre: "The shine of metals has a special name."
  t6_natural: "Natural materials come from plants or animals. Plastic, nylon and polyester are made in factories."
  t6_pans: "Pans must carry heat to food and be strong."
  t6_paper_wood: "Paper is made from pulp. Where does the pulp come from?"
  t6_plastic_pollutes: "Plastic doesn't rot. What happens to it after one use?"
  t6_reusing: "Reusing means using the same thing again for something useful."
  t6_soluble: "Which choice disappears into water when stirred?"
  t6_translucent: "Through butter paper you see only a blurry glow: some light passes, but not a clear picture. Which word is in between see-through and blocking?"
  t6_waterproof: "A raincoat must not let water through."
concepts:
- code: cbse6s.mat.props
  title: Properties of materials
  notes: |
    Objects are made of materials (a tumbler can be glass, steel or plastic). Grouping by properties: appearance
    (lustrous metals vs dull), hardness (hard iron vs soft sponge), soluble or insoluble in water (salt, sugar dissolve;
    sand does not), float or sink, transparent / translucent / opaque, magnetic or not. The use of an object depends on
    the properties of its material.
  explanations:
    text: 'Things are made of materials like wood, glass, metal and plastic. Materials have properties: shiny or dull, hard or soft, dissolve in water or not, float or sink, see-through or not. We choose a material for a job because of its properties.'
    visual: Hold a glass sheet, butter paper and a wooden board to a lamp. Through glass you see clearly (transparent), through butter paper dimly (translucent), and through wood not at all (opaque).
    step_by_step: 'Step 1: Pick a property to test. Step 2: Test each material the same way. Step 3: Record the result. Step 4: Group materials that behave the same.'
    real_world: Windows use transparent glass, frosted bathroom windows are translucent, and doors are opaque wood.
  picture:
    kind: compare
    columns:
    - title: Transparent
      points:
      - glass
      - clear water
      - air
    - title: Translucent
      points:
      - butter paper
      - frosted glass
      - oily paper
    - title: Opaque
      points:
      - wood
      - metal
      - cardboard
    alt: Glass and water are transparent, butter paper and frosted glass are translucent, and wood and metal are opaque.
  activity:
    type: sort
    prompt: Can you see through it?
    bins:
    - Transparent
    - Translucent
    - Opaque
    items:
    - label: Clear glass
      bin: Transparent
      why: 'You can see clearly through it: transparent.'
      clue: Can you see clearly through it?
    - label: Clean water
      bin: Transparent
      clue: Can you see clearly through it?
      why: 'You can see through clear water: transparent.'
    - label: Butter paper
      bin: Translucent
      why: 'Some light passes, but you can''t see clearly: translucent.'
      clue: Does some light pass? Can you see clearly?
    - label: Frosted glass
      bin: Translucent
      clue: Does light pass? Can you see shapes clearly?
      why: 'Light passes but things look blurred: translucent.'
    - label: Wood
      bin: Opaque
      why: 'No light passes through: opaque.'
      clue: Does any light pass through?
    - label: Cardboard
      bin: Opaque
      clue: Does any light pass through?
      why: 'No light passes: opaque.'
  items:
  - prompt: Which material is transparent?
    options:
    - Glass
    - Wood
    - Cardboard
    - Iron
    answer: Glass
    difficulty: 1
    hints:
    - You can see clearly through it.
    - Windows.
    solution: Glass is transparent.
    mistakes:
      Wood: c6s_transparent
  - prompt: 'Butter paper is:'
    options:
    - Translucent
    - Transparent
    - Opaque
    - Magnetic
    answer: Translucent
    difficulty: 1
    hints:
    - You see things dimly through it.
    - Partly lets light pass.
    solution: Butter paper is translucent.
    mistakes: {"Transparent": "t6_translucent", "Opaque": "t6_translucent"}
  - prompt: Which dissolves in water?
    options:
    - Sugar
    - Sand
    - Sawdust
    - Chalk powder
    answer: Sugar
    difficulty: 1
    hints:
    - It disappears when stirred.
    - Sweet tea.
    solution: Sugar is soluble in water.
    mistakes: {"Sand": "t6_soluble", "Sawdust": "t6_soluble"}
  - prompt: 'Metals usually have a shine. This is called:'
    options:
    - Lustre
    - Hardness
    - Solubility
    - Opacity
    answer: Lustre
    difficulty: 1
    hints:
    - Shiny surface.
    - Gold, silver.
    solution: The shine of metals is lustre.
    mistakes: {"Hardness": "t6_lustre", "Opacity": "t6_lustre"}
  - prompt: Which object floats on water?
    options:
    - A dry leaf
    - An iron nail
    - A stone
    - A steel spoon
    answer: A dry leaf
    difficulty: 1
    hints:
    - Light and spread out.
    - Try it.
    solution: A dry leaf floats.
    mistakes: {"An iron nail": "t6_floats", "A stone": "t6_floats"}
  - prompt: Why are cooking pans usually made of metal?
    options:
    - Metals conduct heat well and are strong
    - Metals are transparent
    - Metals dissolve in water
    - Metals are soft
    answer: Metals conduct heat well and are strong
    difficulty: 2
    hints:
    - Heat must reach the food.
    - Strong and heat-conducting.
    solution: Metals carry heat well and don't break easily.
    mistakes: {"Metals are transparent": "t6_pans", "Metals are soft": "t6_pans"}
- code: cbse6s.mat.choose
  title: Choosing materials and their sources
  after:
  - cbse6s.mat.props
  notes: |
    Materials can be natural (cotton, wood, wool, clay, stone) or human-made (plastic, nylon, glass, steel from iron).
    Choose by need: a raincoat needs a waterproof material; a cooking pot handle needs a poor conductor of heat (plastic,
    wood). Reduce, reuse and recycle materials; plastics last very long and pollute, so avoid single-use plastic. Glass
    and metals can be recycled; paper comes from trees.
  explanations:
    text: 'Some materials come from nature, like cotton, wood and clay. Others are made by people, like plastic and nylon. We choose materials that suit the job: a raincoat must keep water out, and a pan handle must not get hot. Reduce, reuse and recycle to save materials.'
    visual: 'Look at a pressure cooker: metal body (carries heat to food), plastic or wooden handles (stay cool), rubber gasket (seals in steam). Each part has the right material.'
    step_by_step: 'Step 1: Ask what the object must do. Step 2: List the properties needed. Step 3: Pick a material with those properties. Step 4: Think about whether it can be reused or recycled.'
    real_world: Cloth bags and steel bottles replace single-use plastic bags and bottles to reduce waste.
  picture:
    kind: compare
    columns:
    - title: Natural
      points:
      - cotton
      - wood
      - clay
    - title: Human-made
      points:
      - plastic
      - nylon
      - glass
    alt: Cotton, wood and clay are natural materials; plastic, nylon and glass are made by people.
  activity:
    type: sort
    prompt: Does it come from nature, or is it made by people?
    bins:
    - Natural
    - Human-made
    items:
    - label: Cotton
      bin: Natural
      clue: Does it come from a plant or animal, or is it made in a factory?
      why: 'From the cotton plant: natural.'
    - label: Wool
      bin: Natural
      clue: Where does wool come from?
      why: 'From sheep: natural.'
    - label: Wood
      bin: Natural
      clue: Where does wood come from?
      why: 'From trees: natural.'
    - label: Clay
      bin: Natural
      clue: Is it dug from the ground or made in a factory?
      why: 'Dug from the earth: natural.'
    - label: Plastic
      bin: Human-made
      clue: Can you find plastic in nature?
      why: 'Made in factories from petroleum: human-made.'
    - label: Nylon
      bin: Human-made
      clue: Is it from a plant or animal?
      why: 'Made in factories: human-made.'
    - label: Glass
      bin: Human-made
      why: 'Glass is made by melting sand: human-made.'
      clue: Can you find glass growing or lying around in nature?
  items:
  - prompt: Which is a natural material?
    options:
    - Cotton
    - Plastic
    - Nylon
    - Polyester
    answer: Cotton
    difficulty: 1
    hints:
    - It grows on a plant.
    - Not made in a factory.
    solution: Cotton comes from the cotton plant.
    mistakes: {"Plastic": "t6_natural", "Nylon": "t6_natural"}
  - prompt: 'A raincoat should be made of a material that is:'
    options:
    - Waterproof
    - Absorbent
    - Transparent only
    - Magnetic
    answer: Waterproof
    difficulty: 1
    hints:
    - It must keep you dry.
    - Water must not pass.
    solution: A raincoat needs a waterproof material.
    mistakes: {"Absorbent": "t6_waterproof", "Magnetic": "t6_waterproof"}
  - prompt: Why are pan handles often made of plastic or wood?
    options:
    - They do not let heat through easily
    - They are shiny
    - They are magnetic
    - They dissolve
    answer: They do not let heat through easily
    difficulty: 1
    hints:
    - Your hand must not burn.
    - Poor conductors.
    solution: Plastic and wood are poor conductors of heat.
    mistakes: {"They are shiny": "t6_handles", "They are magnetic": "t6_handles"}
  - prompt: 'Paper is made mainly from:'
    options:
    - Wood from trees
    - Sand
    - Plastic
    - Iron
    answer: Wood from trees
    difficulty: 1
    hints:
    - Wood pulp.
    - Trees.
    solution: Paper is made from wood pulp.
    mistakes: {"Sand": "t6_paper_wood", "Plastic": "t6_paper_wood"}
  - prompt: Why should we avoid single-use plastic?
    options:
    - It lasts very long and pollutes
    - It is too expensive
    - It is natural
    - It dissolves in rain
    answer: It lasts very long and pollutes
    difficulty: 2
    hints:
    - It doesn't rot.
    - Fills drains and oceans.
    solution: Plastic stays in the environment for hundreds of years.
    mistakes: {"It is natural": "t6_plastic_pollutes", "It dissolves in rain": "t6_plastic_pollutes"}
  - prompt: Which is an example of reusing?
    options:
    - Using a glass jar to store spices
    - Burning plastic
    - Throwing old clothes away
    - Buying new bags every day
    answer: Using a glass jar to store spices
    difficulty: 2
    hints:
    - Using again for another purpose.
    - No new material.
    solution: Using the jar again is reuse.
    mistakes: {"Burning plastic": "t6_reusing", "Buying new bags every day": "t6_reusing"}
