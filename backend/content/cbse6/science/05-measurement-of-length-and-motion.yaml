# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 5. Format: content/README.md.
subject: cbse6-sci
chapter: 5
title: Measurement of Length and Motion
tips:
  c6s_units: 1 m = 100 cm, 1 cm = 10 mm, 1 km = 1000 m. Multiply to go to a smaller unit, divide to go to a bigger one.
  c6s_zero_error: If the ruler's zero is worn, start at another mark (say 1 cm) and subtract it from the reading.
  t6_bicycle_wheel: "The wheel spins round AND the bicycle moves forward."
  t6_circular: "The blade tip goes round and round the centre. What kind of motion is that?"
  t6_cm_m: "Centi means one hundredth, so a centimetre is one hundredth of a metre. How many of them fit in a whole metre?"
  t6_eye_position: "Looking from the side makes the mark seem to shift. Where should your eye be?"
  t6_km_m: "1 km = 1000 m. Multiply."
  t6_linear: "Circular motion goes round; periodic motion repeats like a swing. A train on a straight track does neither. What is straight-line motion called?"
  t6_periodic: "A pendulum repeats the same swing again and again at regular times."
  t6_periodic_example: "Which motion repeats itself regularly?"
  t6_position_change: "If an object's place changes over time, it is moving."
  t6_standard_units: "Your handspan and your friend's are different sizes. Would you get the same measurement?"
  c6s5_convert: 'Bigger unit to smaller unit: multiply. Smaller to bigger: divide. Recall how many of the small unit make one big one.'
  c6s5_start: If the object does not start at zero, take the starting mark away from the end mark.
  c6s5_standard: A standard unit must be the same for everyone, everywhere.
  c6s5_curve: A ruler can't bend. Use something that can, then straighten it.
  c6s5_kind: 'Ask: is the path a straight line, a circle, or does it repeat itself again and again?'
  c6s5_reference: Moving or not depends on what you compare it with.
concepts:
- code: cbse6s.meas.length
  title: Measuring length
  notes: |
    Measuring = comparing with a standard unit. Old body units (handspan, cubit, foot, angul) vary between people, so
    standard units are needed: SI unit of length is the metre (m). 1 km = 1000 m; 1 m = 100 cm; 1 cm = 10 mm. Measure
    correctly: place the scale along the object, start from zero (or another clear mark if the end is broken, then
    subtract), keep the eye directly above the mark. Curved lengths: use a thread, then straighten it on a scale.
  explanations:
    text: To measure, we compare with a fixed unit. Handspans are different for each person, so we use standard units like the metre. 1 metre = 100 centimetres, and 1 centimetre = 10 millimetres. Put the ruler's zero at one end and look straight down at the mark.
    visual: 'Lay a ruler along a pencil. Put 0 at one end. The other end reaches 14.5 cm. If the ruler''s 0 is broken, start at 1 cm: the end reaches 15.5, so the length is 15.5 − 1 = 14.5 cm.'
    step_by_step: 'Step 1: Place the ruler along the object. Step 2: Line up 0 (or a clear mark) with one end. Step 3: Look straight down at the other end. Step 4: Read and subtract the start mark if it was not 0. Step 5: Write the unit.'
    real_world: Tailors use a measuring tape for curved lengths like your waist; road signs show distances in kilometres.
  picture:
    kind: number_line
    from: 0
    to: 16
    step: 1
    points:
    - at: 1
      label: start 1 cm
    - at: 15.5
      label: end 15.5 cm
    alt: Measuring from the 1 cm mark to 15.5 cm gives a length of 14.5 cm.
  activity:
    type: scale
    min: 0
    max: 15
    step: 0.5
    start: 0
    unit: cm
    orientation: horizontal
    prompt: A ruler in centimetres. Each small step is half a centimetre (5 mm). Move the marker.
    goals:
    - prompt: A pencil starts at 0 and ends at 7.5 cm. Put the marker at its end.
      value: 7.5
      mistakes:
      - when:
          v: 7
        say: 7 cm is one small step short. Each small mark is half a centimetre.
    - prompt: An eraser is 4 cm long. Mark 4 cm.
      value: 4
    - prompt: 'A broken ruler starts at 2 cm. A pin ends at 11 cm on it. Mark 11 cm: how long is the pin?'
      value: 11
      hint: Start counting from the 2 cm mark, not from 0. Where does the pin end?
      mistakes:
      - when:
          v: 9
        say: 9 cm is the pin's length, but the pin ends at the 11 cm mark on this broken ruler. Mark where it ends.
  lesson:
    - teach: Measuring means comparing with a unit. Long ago people used handspans, cubits and footsteps, but these differ from person to person. So the world agreed on standard units. The SI unit of length is the metre (m).
      check:
        prompt: Two children measure a table in handspans and get 8 and 10. Why?
        options:
        - Their handspans are different lengths
        - The table changed
        - One cannot count
        answer: Their handspans are different lengths
        why: Body units vary, which is why standard units are needed.
    - teach: 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm. To change a big unit into a smaller one, multiply; to change small into big, divide.
      picture:
        kind: flow
        steps:
        - 1 km
        - = 1000 m
        - 1 m = 100 cm
        - 1 cm = 10 mm
        alt: 1 kilometre is 1000 metres, 1 metre is 100 centimetres, 1 centimetre is 10 millimetres.
      check:
        prompt: How many millimetres are in 4 cm?
        options:
        - '40'
        - '400'
        - '4'
        answer: '40'
        why: 1 cm = 10 mm, so 4 × 10 = 40.
    - teach: 'Measure carefully: lay the ruler along the object, start at 0 (or at a clear mark and subtract), and keep your eye straight above the mark. For a curved line, lay a thread along it, mark the thread, then straighten it on the ruler.'
      picture:
        kind: number_line
        from: 0
        to: 12
        step: 1
        jumps:
        - from: 3
          to: 10
          label: 7 cm
        alt: An object starting at the 3 cm mark and ending at 10 cm is 7 cm long.
      check:
        prompt: An eraser runs from the 1 cm mark to the 5.5 cm mark. How long is it?
        options:
        - 4.5 cm
        - 5.5 cm
        - 6.5 cm
        answer: 4.5 cm
        why: 5.5 − 1 = 4.5.
  items:
  - prompt: How many centimetres are in 1 metre?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - Centi means hundredth.
    - 1 m = ? cm
    solution: 1 m = 100 cm.
    mistakes: {"10": "t6_cm_m", "1000": "t6_cm_m"}
  - prompt: Convert 3.5 m into centimetres.
    answer: '350'
    check: Rational(35,10)*100
    difficulty: 1
    hints:
    - Multiply by 100.
    - 3.5 × 100.
    solution: 3.5 × 100 = 350 cm.
    mistakes:
      '35': c6s_units
  - prompt: Convert 2 km into metres.
    answer: '2000'
    check: 2*1000
    difficulty: 1
    hints:
    - 1 km = 1000 m.
    - 2 × 1000.
    solution: 2 × 1000 = 2000 m.
    mistakes: {"200": "t6_km_m", "20": "t6_km_m"}
  - prompt: A pencil is measured from the 2 cm mark to the 13 cm mark. How long is it (in cm)?
    answer: '11'
    check: 13 - 2
    difficulty: 2
    hints:
    - The start was not 0.
    - 13 − 2.
    solution: 13 − 2 = 11 cm.
    mistakes:
      '13': c6s_zero_error
  - prompt: Why don't we use handspans as standard units?
    options:
    - Handspans differ from person to person
    - Hands are too small
    - Handspans are too accurate
    - It is not allowed
    answer: Handspans differ from person to person
    difficulty: 1
    hints:
    - Compare your span with an adult's.
    - Not the same.
    solution: Body measures vary, so results differ.
    mistakes: {"Hands are too small": "t6_standard_units", "Handspans are too accurate": "t6_standard_units"}
  - prompt: How should your eye be placed when reading a scale?
    options:
    - Directly above the mark
    - From the left side
    - From the right side
    - From far away
    answer: Directly above the mark
    difficulty: 2
    hints:
    - Viewing at a slant gives errors.
    - Straight down.
    solution: Looking straight down avoids error.
    mistakes: {"From the left side": "t6_eye_position", "From far away": "t6_eye_position"}
  - prompt: Convert 2.4 m into centimetres.
    answer: '240'
    check: 2.4*100
    difficulty: 1
    hints:
    - 1 m = 100 cm.
    - Multiply by 100.
    solution: 'Step 1: 2.4 × 100. Step 2: = 240 cm.'
    mistakes:
      '24': c6s5_convert
      '2400': c6s5_convert
  - prompt: Convert 750 cm into metres.
    answer: '7.5'
    check: 750/100
    difficulty: 2
    hints:
    - 'Small unit to big unit: divide.'
    - Divide by 100.
    solution: 'Step 1: 750 ÷ 100. Step 2: = 7.5 m.'
    mistakes:
      '75': c6s5_convert
      '75000': c6s5_convert
  - prompt: A school is 1.2 km from home. How far is that in metres?
    answer: '1200'
    check: 1.2*1000
    difficulty: 1
    hints:
    - 1 km = 1000 m.
    - Multiply by 1000.
    solution: 'Step 1: 1.2 × 1000. Step 2: = 1,200 m.'
    mistakes:
      '120': c6s5_convert
      '12': c6s5_convert
  - prompt: How many millimetres are in 1 m?
    answer: '1000'
    check: 100*10
    difficulty: 2
    hints:
    - 1 m = 100 cm.
    - Each cm is 10 mm.
    solution: 'Step 1: 1 m = 100 cm. Step 2: 100 × 10 = 1,000 mm.'
    mistakes:
      '100': c6s5_convert
      '10': c6s5_convert
  - prompt: A ruler's end is broken. A leaf lies from the 4 cm mark to the 12.5 cm mark. How long is it (in cm)?
    answer: '8.5'
    check: 12.5-4
    difficulty: 2
    hints:
    - Start mark is not zero.
    - End minus start.
    solution: 'Step 1: 12.5 − 4. Step 2: = 8.5 cm.'
    mistakes:
      '12.5': c6s5_start
      '16.5': c6s5_start
  - prompt: Which is the best way to measure the length of a curved line on a map?
    options:
    - Lay a thread along it, then measure the thread
    - Use a straight ruler only
    - Guess by looking
    answer: Lay a thread along it, then measure the thread
    difficulty: 1
    hints:
    - A ruler is straight.
    - What can follow a curve?
    solution: 'Step 1: a thread bends along the curve. Step 2: straighten it on a ruler to find the length.'
    mistakes:
      Use a straight ruler only: c6s5_curve
      Guess by looking: c6s5_curve
  - prompt: Which unit is best for the distance between Delhi and Mumbai?
    options:
    - Kilometre
    - Centimetre
    - Millimetre
    answer: Kilometre
    difficulty: 1
    hints:
    - It is a very long distance.
    - Choose the biggest unit.
    solution: 'Step 1: cities are hundreds of km apart. Step 2: kilometres keep the number small and clear.'
    mistakes:
      Centimetre: c6s5_convert
      Millimetre: c6s5_convert
  - prompt: Why must everyone in the world use the same standard units?
    options:
    - So measurements mean the same everywhere
    - Because metres are prettier
    - To make maths harder
    answer: So measurements mean the same everywhere
    difficulty: 2
    hints:
    - Think of buying cloth in another town.
    - A metre must be the same length there.
    solution: 'Step 1: if units changed from place to place, trade and science would be confused. Step 2: standard units mean the same everywhere.'
    mistakes:
      Because metres are prettier: c6s5_standard
      To make maths harder: c6s5_standard
  - prompt: A room is 5 m 40 cm long. How long is it in centimetres?
    answer: '540'
    check: 5*100+40
    difficulty: 3
    hints:
    - Change 5 m into cm first.
    - Then add the 40 cm.
    solution: 'Step 1: 5 m = 500 cm. Step 2: 500 + 40 = 540 cm.'
    mistakes:
      '5040': c6s5_convert
      '45': c6s5_convert
- code: cbse6s.meas.motion
  title: Types of motion
  after:
  - cbse6s.meas.length
  notes: |
    An object is in motion if its position changes with time compared with something fixed. Linear (straight-line)
    motion: a train on a straight track, a falling stone. Circular motion: a point on a fan blade, a merry-go-round.
    Periodic motion: repeats after equal time intervals: a pendulum, a swing, the hands of a clock. Some motions are
    several types at once: a bicycle wheel spins (circular) while the bicycle moves forward (linear).
  explanations:
    text: 'Something is moving if its position changes over time. A car on a straight road moves in a straight line. A fan blade moves in a circle. A swing goes back and forth again and again: that repeating motion is called periodic.'
    visual: 'Draw three pictures: a straight arrow for a train, a circle for a fan blade, and a swing moving back and forth with a curved double arrow.'
    step_by_step: 'Step 1: Watch the path the object takes. Step 2: Straight line? Linear. Step 3: Round a centre? Circular. Step 4: Repeats in equal times? Periodic. Step 5: Some motions are two at once.'
    real_world: A clock's pendulum swings periodically, a giant wheel at a fair moves in a circle, and a sprinter runs in a straight line.
  picture:
    kind: compare
    columns:
    - title: Linear
      points:
      - train on straight track
      - falling stone
    - title: Circular
      points:
      - fan blade
      - merry-go-round
    - title: Periodic
      points:
      - pendulum
      - swing
    alt: 'Linear motion: a train or falling stone. Circular motion: a fan or merry-go-round. Periodic motion: a pendulum or swing.'
  activity:
    type: sort
    prompt: What kind of motion is it?
    bins:
    - Straight-line (linear)
    - Circular
    - Periodic (repeats)
    items:
    - label: A train on a straight track
      bin: Straight-line (linear)
      clue: Does its path bend or come back?
      why: 'Along a straight path: linear motion.'
    - label: A falling stone
      bin: Straight-line (linear)
      clue: Which way is its path?
      why: 'Straight down: linear motion.'
    - label: A point on a fan blade
      bin: Circular
      clue: What shape does its path make?
      why: It goes round in a circle.
    - label: A merry-go-round
      bin: Circular
      clue: What shape does its path make?
      why: 'Round and round: circular motion.'
    - label: A swing going to and fro
      bin: Periodic (repeats)
      clue: Does it repeat the same movement again and again?
      why: 'It repeats, back and forth: periodic.'
    - label: A pendulum
      bin: Periodic (repeats)
      clue: Does it repeat the same movement?
      why: 'To and fro, again and again: periodic.'
  lesson:
    - teach: An object is in motion if its position changes with time compared with something fixed (a reference). A passenger sitting in a moving bus is at rest compared with the bus but moving compared with the trees outside.
      check:
        prompt: 'A book is on a seat in a moving train. Compared with the platform, the book is:'
        options:
        - Moving
        - At rest
        - Neither
        answer: Moving
        why: Its position changes compared with the platform.
    - teach: 'Linear motion is along a straight line: a march past, a falling stone. Circular motion goes round a fixed point: a merry-go-round, the tip of a fan blade.'
      picture:
        kind: compare
        columns:
        - title: Linear
          points:
          - train on straight track
          - falling apple
          - march past
        - title: Circular
          points:
          - fan blade tip
          - merry-go-round
          - giant wheel
        - title: Periodic
          points:
          - swing
          - pendulum
          - clock hands
        alt: Examples of straight-line, circular and repeating motion.
      check:
        prompt: 'A stone dropped from a roof shows:'
        options:
        - Linear motion
        - Circular motion
        - Periodic motion
        answer: Linear motion
        why: It falls in a straight line.
    - teach: 'Periodic motion repeats itself after equal intervals of time: a swing, a pendulum, a heartbeat. A motion can be more than one kind: a clock hand moves in a circle and repeats every hour, so it is circular and periodic.'
      check:
        prompt: 'The Earth going round the Sun once every year is:'
        options:
        - Circular and periodic
        - Only linear
        - Not motion
        answer: Circular and periodic
        why: It goes round and repeats every year.
  items:
  - prompt: 'A train moving on a straight track shows:'
    options:
    - Linear motion
    - Circular motion
    - Periodic motion
    - No motion
    answer: Linear motion
    difficulty: 1
    hints:
    - The path is straight.
    - Line.
    solution: 'Straight-line path: linear motion.'
    mistakes: {"Circular motion": "t6_linear", "Periodic motion": "t6_linear"}
  - prompt: 'The tip of a ceiling fan blade moves in:'
    options:
    - Circular motion
    - Linear motion
    - Zigzag motion
    - No motion
    answer: Circular motion
    difficulty: 1
    hints:
    - It goes round a centre.
    - A circle.
    solution: It moves in a circle.
    mistakes: {"Linear motion": "t6_circular", "Zigzag motion": "t6_circular"}
  - prompt: 'A swinging pendulum shows:'
    options:
    - Periodic motion
    - Linear motion only
    - No motion
    - Random motion
    answer: Periodic motion
    difficulty: 1
    hints:
    - It repeats in equal time.
    - Back and forth.
    solution: 'The pendulum repeats its motion: periodic.'
    mistakes: {"Linear motion only": "t6_periodic", "Random motion": "t6_periodic"}
  - prompt: When are we sure an object is moving?
    options:
    - Its position changes with time
    - It is heavy
    - It makes noise
    - It is coloured
    answer: Its position changes with time
    difficulty: 1
    hints:
    - Compare with something fixed.
    - Position.
    solution: Motion means a change in position with time.
    mistakes: {"It is heavy": "t6_position_change", "It makes noise": "t6_position_change"}
  - prompt: 'A moving bicycle''s wheel shows:'
    options:
    - circular and linear motion together
    - only periodic motion
    - no motion
    - only linear motion
    answer: circular and linear motion together
    difficulty: 2
    hints:
    - The wheel spins.
    - The bicycle goes forward.
    solution: The wheel turns (circular) while moving forward (linear).
    mistakes: {"only periodic motion": "t6_bicycle_wheel", "only linear motion": "t6_bicycle_wheel"}
  - prompt: Which is periodic motion?
    options:
    - Hands of a clock
    - A ball rolling once down a slope
    - A stone thrown far
    - A car parked
    answer: Hands of a clock
    difficulty: 2
    hints:
    - Repeats in equal intervals.
    - Every 12 hours.
    solution: Clock hands repeat their motion regularly.
    mistakes: {"A ball rolling once down a slope": "t6_periodic_example", "A stone thrown far": "t6_periodic_example"}
  - prompt: A child on a swing shows which motion?
    options:
    - Periodic
    - Linear
    - No motion
    answer: Periodic
    difficulty: 1
    hints:
    - The swing goes to and fro.
    - Does it repeat?
    solution: 'Step 1: the swing repeats the same path. Step 2: it takes equal time each time, so periodic.'
    mistakes:
      Linear: c6s5_kind
      No motion: c6s5_kind
  - prompt: 'A car moving on a straight highway shows:'
    options:
    - Linear motion
    - Circular motion
    - Periodic motion
    answer: Linear motion
    difficulty: 1
    hints:
    - Look at the shape of the path.
    - The road is straight.
    solution: 'Step 1: the path is a straight line. Step 2: so it is linear motion.'
    mistakes:
      Circular motion: c6s5_kind
      Periodic motion: c6s5_kind
  - prompt: 'A giant wheel at a fair turns round and round. Its seats show:'
    options:
    - Circular motion
    - Linear motion
    - No motion
    answer: Circular motion
    difficulty: 1
    hints:
    - The seats go round a centre.
    - What shape is the path?
    solution: 'Step 1: the seats move round a fixed centre. Step 2: that is circular motion.'
    mistakes:
      Linear motion: c6s5_kind
      No motion: c6s5_kind
  - prompt: 'Riya sits in a moving bus. Compared with her seat, she is:'
    options:
    - At rest
    - Moving
    - Spinning
    answer: At rest
    difficulty: 2
    hints:
    - Does her position change compared with the seat?
    - She moves together with it.
    solution: 'Step 1: her position does not change compared with the seat. Step 2: so, compared with the seat, she is at rest.'
    mistakes:
      Moving: c6s5_reference
      Spinning: c6s5_reference
  - prompt: Which is an example of periodic motion in your body?
    options:
    - Heartbeat
    - Growing taller
    - Hair getting longer
    answer: Heartbeat
    difficulty: 2
    hints:
    - Periodic means repeating at equal times.
    - Which one goes 'lub-dub' again and again?
    solution: 'Step 1: growing taller and hair growth don''t repeat. Step 2: the heartbeat repeats regularly: periodic.'
    mistakes:
      Growing taller: c6s5_kind
      Hair getting longer: c6s5_kind
  - prompt: 'A sewing machine needle moves up and down again and again. This is:'
    options:
    - Periodic motion
    - Circular motion
    - Linear only, never repeating
    answer: Periodic motion
    difficulty: 2
    hints:
    - The motion repeats.
    - Each up-and-down takes the same time.
    solution: 'Step 1: the needle repeats the same up-down movement. Step 2: at equal time gaps, so periodic.'
    mistakes:
      Circular motion: c6s5_kind
      Linear only, never repeating: c6s5_kind
  - prompt: 'The blades of a moving fan show circular motion. The whole fan (fixed to the ceiling) shows:'
    options:
    - No change of position
    - Linear motion
    - Periodic swinging
    answer: No change of position
    difficulty: 3
    hints:
    - Does the fan move across the room?
    - Only the blades turn.
    solution: 'Step 1: the fan stays fixed to the ceiling. Step 2: only its blades turn; the fan as a whole does not change position.'
    mistakes:
      Linear motion: c6s5_reference
      Periodic swinging: c6s5_kind
  - prompt: A pendulum makes 30 swings in 60 seconds. How long does one swing take (in seconds)?
    answer: '2'
    check: 60/30
    difficulty: 2
    hints:
    - Share 60 seconds equally among 30 swings.
    - 60 ÷ 30.
    solution: 'Step 1: 60 ÷ 30. Step 2: = 2 seconds per swing.'
    mistakes:
      '30': c6s5_kind
      '0.5': c6s5_kind
  - prompt: Trees seem to run backwards when you look out of a moving train. Why?
    options:
    - You are moving forward compared with them
    - Trees really move
    - The window is moving the trees
    answer: You are moving forward compared with them
    difficulty: 3
    hints:
    - Which is really changing position?
    - Compare you and the ground.
    solution: 'Step 1: the trees are fixed to the ground. Step 2: you move forward, so compared with you they seem to go back.'
    mistakes:
      Trees really move: c6s5_reference
      The window is moving the trees: c6s5_reference
