# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 10. Format: content/README.md.
subject: cbse6-sci
chapter: 10
title: 'Living Creatures: Exploring their Characteristics'
tips:
  c6s_living: Living things grow, need food, breathe, respond, excrete and reproduce. A car moves and uses fuel but does not grow or reproduce.
  t6_butterfly_order: "A butterfly lays eggs that hatch into caterpillars, which make a pupa before becoming adults."
  t6_dormant_seed: "A crystal and a candle flame can grow or move, but they don't come from life. Which one is only resting and can grow into a plant?"
  t6_germination: "A sprouting seed is waking up to grow. Think of what you give a seed in a pot so it grows: drink, breath and a warm spot."
  t6_light_response: "Plants bending to the window are reacting to light."
  t6_living_features: "All living things grow, breathe, need food and respond. Do all of them have legs?"
  t6_mosquito_break: "Mosquitoes need still water for their young. What happens if there's none?"
  t6_mosquito_larvae: "Mosquitoes lay eggs on still water."
  t6_response: "The leaf folds because it was touched. That's a response to something."
  t6_seed_start: "Flowers and fruit come later in a plant's life. What does a new plant grow from?"
  t6_stages_total: "Add the frog's 4 stages and the butterfly's 4 stages."
  t6_tadpole: "Young frogs swim with tails before growing legs."
  c6s10_all: 'Check the full list: food, growth, breathing, response, waste removal, reproduction, life span. A living thing shows all of them.'
  c6s10_stim: A stimulus is a change around a living thing; the response is what it does about it.
  c6s10_seed: A seed is alive but resting. Think about what wakes it up.
  c6s10_stages: Life cycles go in one direction from egg or seed to adult. Put the stages in that order.
  c6s10_water: Several insects begin life in still water. Remove the water and the cycle breaks.
concepts:
- code: cbse6s.living.features
  title: What makes something living
  notes: |
    Characteristics of living things: they need food (energy), grow, respire (breathe/take in air), respond to stimuli
    (plants bend towards light; touch-me-not folds), excrete wastes, reproduce, move (animals move from place to place;
    plants show movement in parts), and have a life span. Non-living things may show some features (a car moves, a
    crystal grows) but not all. Seeds look non-living but are alive (dormant) and sprout with water, air and warmth.
  explanations:
    text: 'Living things share features: they need food, grow, breathe, respond to things around them, get rid of waste, and have young ones. A car moves but cannot grow or have babies, so it is not living. A seed looks lifeless but sprouts when it gets water and warmth.'
    visual: 'Put a touch-me-not (mimosa) leaf near your finger. Touch it: the leaves fold. The plant is responding: a sign of life.'
    step_by_step: 'Step 1: List the features of living things. Step 2: Check the object for each one. Step 3: If it shows all of them over its life, it is living. Step 4: Showing only one or two is not enough.'
    real_world: Watching a bean seed soaked in water sprout over a few days shows that seeds are alive.
  picture:
    kind: compare
    columns:
    - title: Living things
      points:
      - need food
      - grow
      - reproduce
    - title: Non-living things
      points:
      - no food needed
      - do not grow
      - do not reproduce
    alt: Living things need food, grow and reproduce; non-living things do not.
  activity:
    type: sort
    prompt: Is it living or non-living?
    bins:
    - Living
    - Non-living
    items:
    - label: Dog
      bin: Living
      clue: Does it grow, eat and have young?
      why: 'It grows, eats and reproduces: living.'
    - label: Mushroom
      bin: Living
      why: 'It grows, takes in food and reproduces: living.'
      clue: Does it grow and make more mushrooms?
    - label: Neem tree
      bin: Living
      clue: Does it grow and make seeds?
      why: 'It grows and reproduces: living.'
    - label: Ant
      bin: Living
      clue: Does it eat, grow and lay eggs?
      why: Living.
    - label: Stone
      bin: Non-living
      clue: Does it grow, eat or breathe?
      why: 'None of these: non-living.'
    - label: Car
      bin: Non-living
      why: 'It moves, but doesn''t grow, eat or reproduce: non-living.'
      clue: It moves, but does it grow, eat or have baby cars?
    - label: Cloud
      bin: Non-living
      why: It moves and grows bigger, but it isn't alive.
      clue: It moves and gets bigger. Does it eat or reproduce?
    - label: Chair
      bin: Non-living
      clue: Does it grow or eat?
      why: Non-living.
  lesson:
    - teach: 'Living things share features. They need food for energy, grow, breathe (respire), get rid of wastes (excrete), reproduce, respond to changes, and have a life span: they are born and die.'
      picture:
        kind: compare
        columns:
        - title: Living things
          points:
          - need food
          - grow
          - breathe
          - respond
          - reproduce
          - die
        - title: Non-living things
          points:
          - may move or grow
          - but don't show all features
        alt: Living things need food, grow, breathe, respond, reproduce and die; non-living things may show some but not all.
      check:
        prompt: A candle flame uses air and moves. Is it living?
        options:
        - No, it doesn't grow, reproduce or respond like living things
        - Yes, it uses air
        - Yes, it moves
        answer: No, it doesn't grow, reproduce or respond like living things
        why: Showing one or two features isn't enough; living things show all.
    - teach: Living things respond to stimuli, changes around them. Touch-me-not leaves fold when touched; sunflowers turn towards the Sun; we pull our hand away from something hot.
      check:
        prompt: 'A cat runs away from a barking dog. The barking is the:'
        options:
        - Stimulus
        - Response
        - Life span
        answer: Stimulus
        why: The barking is the change; running away is the response.
    - teach: 'Plants move too, but only parts: roots grow down, shoots grow up towards light, leaves open and close. A seed may look lifeless, but it is alive and resting (dormant). With water, air and warmth it germinates (sprouts).'
      picture:
        kind: flow
        steps:
        - Dry seed (resting)
        - Water, air, warmth
        - Sprouts
        - Seedling
        alt: A dormant seed sprouts into a seedling when it gets water, air and warmth.
      check:
        prompt: 'Seeds kept dry in a jar for a year don''t sprout. Then they are sown and watered and they sprout. This shows the seeds were:'
        options:
        - Alive but resting
        - Non-living
        - Dead
        answer: Alive but resting
        why: Dead seeds would not sprout when watered.
  items:
  - prompt: Which is a feature of all living things?
    options:
    - They grow
    - They are green
    - They have legs
    - They can fly
    answer: They grow
    difficulty: 1
    hints:
    - Think of plants, animals, people.
    - From small to big.
    solution: All living things grow.
    mistakes: {"They are green": "t6_living_features", "They have legs": "t6_living_features"}
  - prompt: A car moves and uses fuel. Why is it not living?
    options:
    - It does not grow or reproduce
    - It is made of metal
    - It is too fast
    - It has wheels
    answer: It does not grow or reproduce
    difficulty: 1
    hints:
    - Check all the features.
    - Can it have baby cars?
    solution: A car does not grow, breathe or reproduce.
    mistakes:
      It has wheels: c6s_living
  - prompt: 'Leaves of a touch-me-not fold when touched. This shows:'
    options:
    - response to a stimulus
    - growth
    - excretion
    - reproduction
    answer: response to a stimulus
    difficulty: 1
    hints:
    - Touch is the stimulus.
    - It reacts.
    solution: The plant responds to touch.
    mistakes: {"growth": "t6_response", "excretion": "t6_response"}
  - prompt: 'A seed sprouts when it gets:'
    options:
    - water, air and warmth
    - only darkness
    - salt
    - plastic
    answer: water, air and warmth
    difficulty: 1
    hints:
    - Germination needs these.
    - Soak a bean.
    solution: Seeds need water, air and warmth to germinate.
    mistakes: {"only darkness": "t6_germination", "salt": "t6_germination"}
  - prompt: 'Plants bending towards a window show:'
    options:
    - response to light
    - excretion
    - breathing only
    - that they are non-living
    answer: response to light
    difficulty: 2
    hints:
    - The window gives light.
    - Stimulus.
    solution: Plants grow towards light.
    mistakes: {"excretion": "t6_light_response", "that they are non-living": "t6_light_response"}
  - prompt: Which of these is living?
    options:
    - A dormant seed
    - A crystal
    - A cloud
    - A burning candle
    answer: A dormant seed
    difficulty: 2
    hints:
    - It can grow into a plant.
    - It is resting.
    solution: A seed is alive but resting (dormant).
    mistakes: {"A crystal": "t6_dormant_seed", "A burning candle": "t6_dormant_seed"}
  - prompt: Which is a non-living thing?
    options:
    - A stone
    - A mushroom
    - An earthworm
    answer: A stone
    difficulty: 1
    hints:
    - Which does not grow, breathe or reproduce?
    - Mushrooms are living fungi.
    solution: 'Step 1: mushrooms and earthworms grow, breathe and reproduce. Step 2: a stone does none of these.'
    mistakes:
      A mushroom: c6s10_all
      An earthworm: c6s10_all
  - prompt: A robot moves, talks and uses electricity. Why is it not living?
    options:
    - It cannot grow or reproduce on its own
    - It is made of metal
    - It is too big
    answer: It cannot grow or reproduce on its own
    difficulty: 2
    hints:
    - Check the full list of living features.
    - Which ones are missing?
    solution: 'Step 1: moving and using energy are only two features. Step 2: it cannot grow or reproduce, so it is non-living.'
    mistakes:
      It is made of metal: c6s10_all
      It is too big: c6s10_all
  - prompt: 'Our eyes blink when dust flies at them. This is a:'
    options:
    - Response to a stimulus
    - Way of growing
    - Kind of reproduction
    answer: Response to a stimulus
    difficulty: 1
    hints:
    - Dust is a change around us.
    - Blinking is what the body does about it.
    solution: 'Step 1: flying dust is the stimulus. Step 2: blinking is the response.'
    mistakes:
      Way of growing: c6s10_stim
      Kind of reproduction: c6s10_stim
  - prompt: Which is an example of excretion?
    options:
    - Sweating
    - Eating
    - Sleeping
    answer: Sweating
    difficulty: 2
    hints:
    - Excretion removes waste from the body.
    - Which one sends something out?
    solution: 'Step 1: excretion means getting rid of wastes. Step 2: sweat removes water and salts, so sweating is excretion.'
    mistakes:
      Eating: c6s10_all
      Sleeping: c6s10_all
  - prompt: Which of these is NOT needed for a seed to germinate?
    options:
    - Sunlight on the seed
    - Water
    - Air
    answer: Sunlight on the seed
    difficulty: 3
    hints:
    - Seeds can sprout in a dark cupboard.
    - Which condition is not needed at the start?
    solution: 'Step 1: seeds need water, air and warmth to sprout. Step 2: light is needed later by the seedling, not to germinate.'
    mistakes:
      Water: c6s10_seed
      Air: c6s10_seed
  - prompt: 'Roots of a plant always grow downwards. This is a response to:'
    options:
    - Gravity
    - Sound
    - Touch only
    answer: Gravity
    difficulty: 3
    hints:
    - Turn a pot sideways; roots still bend down.
    - What pulls everything down?
    solution: 'Step 1: roots bend down whichever way the pot is turned. Step 2: they respond to gravity.'
    mistakes:
      Sound: c6s10_stim
      Touch only: c6s10_stim
  - prompt: Why do animals need food?
    options:
    - For energy to live and grow
    - Only for taste
    - To make them sleep
    answer: For energy to live and grow
    difficulty: 1
    hints:
    - Every activity needs energy.
    - Growth needs materials too.
    solution: 'Step 1: food gives energy for all activities. Step 2: it also gives materials for growth and repair.'
    mistakes:
      Only for taste: c6s10_all
      To make them sleep: c6s10_all
  - prompt: Which shows that plants breathe?
    options:
    - Leaves have tiny pores that take in air
    - Plants are green
    - Plants have flowers
    answer: Leaves have tiny pores that take in air
    difficulty: 2
    hints:
    - Breathing means taking in air.
    - Look under a leaf with a lens.
    solution: 'Step 1: leaves have tiny pores called stomata. Step 2: air goes in and out through them, so plants respire.'
    mistakes:
      Plants are green: c6s10_all
      Plants have flowers: c6s10_all
  - prompt: 'A dog has a life span of about 12 years. This means the dog:'
    options:
    - Lives for about 12 years and then dies
    - Grows 12 cm
    - Has 12 puppies
    answer: Lives for about 12 years and then dies
    difficulty: 1
    hints:
    - Life span is about time.
    - Every living thing is born and dies.
    solution: 'Step 1: life span is the length of life. Step 2: so the dog lives about 12 years.'
    mistakes:
      Grows 12 cm: c6s10_all
      Has 12 puppies: c6s10_all
- code: cbse6s.living.cycle
  title: Life cycles and adaptation
  after:
  - cbse6s.living.features
  notes: |
    Life cycle: stages from birth to adult to reproduction. Frog: egg → tadpole (lives in water, gills, tail) → froglet →
    adult frog (lungs, legs). Butterfly/silk moth: egg → larva (caterpillar) → pupa → adult. Mosquito: egg → larva → pupa
    → adult, all early stages in stagnant water (so remove standing water). Plants: seed → seedling → adult plant →
    flower → fruit and seed. Adaptations: features that help survival in a habitat.
  explanations:
    text: Living things go through stages in their life, called a life cycle. A frog starts as an egg, becomes a tadpole that swims with a tail, then grows legs and becomes a frog. A butterfly goes from egg to caterpillar to pupa to butterfly.
    visual: 'Draw a circle with four stops: frog eggs in water, a tadpole with a tail, a froglet with legs and a small tail, and an adult frog. Arrows join them in a loop.'
    step_by_step: 'Step 1: Start with the egg or seed. Step 2: Name each stage in order. Step 3: Note how the body changes. Step 4: Close the loop: the adult lays eggs or makes seeds.'
    real_world: Mosquitoes breed in stagnant water; emptying flowerpot trays and coolers breaks their life cycle and prevents dengue.
  picture:
    kind: flow
    steps:
    - Egg
    - Tadpole
    - Froglet
    - Adult frog
    - Lays eggs again
    alt: 'A frog''s life cycle: egg, tadpole, froglet, adult frog, which lays eggs again.'
  activity:
    type: order
    prompt: Put the life cycle of a frog in order.
    steps:
    - Eggs in water
    - Tadpole with a tail and gills
    - Tadpole grows legs
    - Froglet (tail getting shorter)
    - Adult frog
    reasons:
      Tadpole with a tail and gills: A tadpole hatches from an egg.
      Tadpole grows legs: Legs grow on a tadpole that has hatched and grown.
      Froglet (tail getting shorter): The tail shrinks after the legs have grown.
      Adult frog: The adult comes last, once the tail is gone.
  lesson:
    - teach: 'A life cycle is the set of stages a living thing goes through from birth to adult, which then has young of its own. A frog: egg → tadpole (lives in water, breathes with gills, has a tail) → froglet (legs grow, tail shrinks) → adult frog (lungs, lives on land and in water).'
      picture:
        kind: flow
        steps:
        - Eggs
        - Tadpole
        - Froglet
        - Adult frog
        alt: 'Frog life cycle: eggs hatch into tadpoles, which become froglets and then adult frogs.'
      check:
        prompt: Which stage of a frog breathes with gills?
        options:
        - Tadpole
        - Adult frog
        - Neither
        answer: Tadpole
        why: Tadpoles live fully in water and use gills.
    - teach: 'Butterflies and silk moths: egg → larva (caterpillar, eats a lot) → pupa (resting stage inside a case) → adult. Mosquitoes too go egg → larva → pupa → adult, and their early stages live in still water.'
      picture:
        kind: flow
        steps:
        - Egg
        - Larva (caterpillar)
        - Pupa
        - Adult butterfly
        alt: 'Butterfly life cycle: egg, caterpillar, pupa, adult.'
      check:
        prompt: A silk thread comes from the case made at which silk moth stage?
        options:
        - Pupa (cocoon)
        - Egg
        - Adult
        answer: Pupa (cocoon)
        why: The caterpillar spins a silk cocoon around itself as it becomes a pupa.
    - teach: 'Plants have life cycles too: seed → seedling → young plant → adult plant with flowers → fruits with seeds. Knowing life cycles helps us, for example by emptying stagnant water so mosquito larvae can''t grow.'
      check:
        prompt: Which plant stage comes right after the seed sprouts?
        options:
        - Seedling
        - Fruit
        - Flower
        answer: Seedling
        why: The sprouted seed grows into a small seedling first.
  items:
  - prompt: 'A young frog that lives in water and has a tail is a:'
    options:
    - Tadpole
    - Caterpillar
    - Pupa
    - Seedling
    answer: Tadpole
    difficulty: 1
    hints:
    - Comes out of frog eggs.
    - Swims with a tail.
    solution: It is a tadpole.
    mistakes: {"Caterpillar": "t6_tadpole", "Pupa": "t6_tadpole"}
  - prompt: What is the correct order for a butterfly?
    options:
    - Egg → caterpillar → pupa → butterfly
    - Egg → pupa → caterpillar → butterfly
    - Caterpillar → egg → butterfly → pupa
    - Pupa → egg → butterfly → caterpillar
    answer: Egg → caterpillar → pupa → butterfly
    difficulty: 1
    hints:
    - The caterpillar eats leaves.
    - Then it rests as a pupa.
    solution: Egg, larva (caterpillar), pupa, adult.
    mistakes: {"Egg → pupa → caterpillar → butterfly": "t6_butterfly_order", "Caterpillar → egg → butterfly → pupa": "t6_butterfly_order"}
  - prompt: 'Mosquito larvae grow in:'
    options:
    - stagnant water
    - dry sand
    - tree bark
    - clouds
    answer: stagnant water
    difficulty: 1
    hints:
    - Still, standing water.
    - Coolers, pots.
    solution: Mosquito eggs, larvae and pupae live in stagnant water.
    mistakes: {"dry sand": "t6_mosquito_larvae", "tree bark": "t6_mosquito_larvae"}
  - prompt: How can we break the mosquito life cycle at home?
    options:
    - Empty standing water regularly
    - Leave water in coolers
    - Grow more weeds
    - Keep buckets uncovered
    answer: Empty standing water regularly
    difficulty: 2
    hints:
    - Where do larvae live?
    - Remove it.
    solution: Removing stagnant water stops mosquitoes breeding.
    mistakes: {"Leave water in coolers": "t6_mosquito_break", "Keep buckets uncovered": "t6_mosquito_break"}
  - prompt: A frog's life cycle above has 4 stages. A butterfly's also has 4. How many stages in total?
    answer: '8'
    check: 4+4
    difficulty: 1
    hints:
    - 4 + 4.
    - Add.
    solution: 4 + 4 = 8.
    mistakes: {"4": "t6_stages_total", "16": "t6_stages_total"}
  - prompt: 'A plant''s life cycle starts with a:'
    options:
    - Seed
    - Flower
    - Fruit only
    - Leaf
    answer: Seed
    difficulty: 1
    hints:
    - It sprouts.
    - Germination.
    solution: A seed grows into a seedling and then a plant.
    mistakes: {"Flower": "t6_seed_start", "Fruit only": "t6_seed_start"}
  - prompt: Which stage of a butterfly eats the most leaves?
    options:
    - Caterpillar (larva)
    - Pupa
    - Egg
    answer: Caterpillar (larva)
    difficulty: 1
    hints:
    - One stage is busy eating and growing.
    - The pupa rests and does not eat.
    solution: 'Step 1: the egg and pupa don''t eat. Step 2: the caterpillar eats leaves and grows fast.'
    mistakes:
      Pupa: c6s10_stages
      Egg: c6s10_stages
  - prompt: What is the order of a mosquito's life cycle?
    options:
    - Egg → larva → pupa → adult
    - Larva → egg → adult → pupa
    - Egg → adult → larva → pupa
    answer: Egg → larva → pupa → adult
    difficulty: 2
    hints:
    - It is like a butterfly's cycle.
    - Eggs come first, adults last.
    solution: 'Step 1: eggs hatch into larvae. Step 2: larvae become pupae, then adults.'
    mistakes:
      Larva → egg → adult → pupa: c6s10_stages
      Egg → adult → larva → pupa: c6s10_stages
  - prompt: Why do health workers ask us not to let water collect in old tyres and coolers?
    options:
    - Mosquitoes lay eggs in still water
    - Water damages tyres
    - It wastes water
    answer: Mosquitoes lay eggs in still water
    difficulty: 2
    hints:
    - Think of dengue and malaria.
    - Where do mosquito larvae grow?
    solution: 'Step 1: mosquito larvae grow in stagnant water. Step 2: emptying it breaks their life cycle.'
    mistakes:
      Water damages tyres: c6s10_water
      It wastes water: c6s10_water
  - prompt: 'A froglet is the stage where:'
    options:
    - Legs have grown and the tail is shrinking
    - It is still an egg
    - It has gills and no legs
    answer: Legs have grown and the tail is shrinking
    difficulty: 2
    hints:
    - It is between tadpole and adult.
    - It looks like a small frog with a tail.
    solution: 'Step 1: the tadpole grows legs. Step 2: as the tail shrinks it is a froglet, nearly an adult.'
    mistakes:
      It is still an egg: c6s10_stages
      It has gills and no legs: c6s10_stages
  - prompt: Why does a frog lay its eggs in water?
    options:
    - Tadpoles can only live in water
    - Eggs are too heavy for land
    - Water keeps them warm
    answer: Tadpoles can only live in water
    difficulty: 3
    hints:
    - What hatches from the eggs?
    - How does that stage breathe?
    solution: 'Step 1: tadpoles hatch and breathe with gills. Step 2: gills work only in water, so eggs are laid there.'
    mistakes:
      Eggs are too heavy for land: c6s10_stages
      Water keeps them warm: c6s10_stages
  - prompt: Which life cycle stage of a plant makes new seeds?
    options:
    - Flower turning into fruit
    - Seedling
    - Root
    answer: Flower turning into fruit
    difficulty: 2
    hints:
    - Seeds are found inside fruits.
    - Fruits come from flowers.
    solution: 'Step 1: flowers become fruits. Step 2: fruits carry the new seeds.'
    mistakes:
      Seedling: c6s10_stages
      Root: c6s10_stages
  - prompt: How many stages are there from egg to adult in a butterfly's life cycle?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Egg, larva, ...
    - Count all the stages including egg and adult.
    solution: 'Step 1: egg, larva, pupa, adult. Step 2: that is 4 stages.'
    mistakes:
      '3': c6s10_stages
      '5': c6s10_stages
  - prompt: The pupa stage looks still. What is happening inside?
    options:
    - The body is changing into the adult form
    - Nothing, it is dead
    - It is laying eggs
    answer: The body is changing into the adult form
    difficulty: 2
    hints:
    - What comes out of the pupa?
    - Something very different from the caterpillar.
    solution: 'Step 1: a butterfly comes out of the pupa. Step 2: inside, the caterpillar''s body is rebuilt into the adult.'
    mistakes:
      Nothing, it is dead: c6s10_stages
      It is laying eggs: c6s10_stages
  - prompt: Silk farmers boil some cocoons. Which stage is inside a cocoon?
    options:
    - Pupa
    - Egg
    - Adult moth
    answer: Pupa
    difficulty: 2
    hints:
    - The caterpillar spins the cocoon.
    - Inside, it rests and changes.
    solution: 'Step 1: the caterpillar spins a cocoon around itself. Step 2: inside, it is in the pupa stage.'
    mistakes:
      Egg: c6s10_stages
      Adult moth: c6s10_stages
