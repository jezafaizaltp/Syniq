# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 10. Format: content/README.md.
subject: cbse6-sci
chapter: 10
title: 'Living Creatures: Exploring their Characteristics'
tips:
  c6s_living: Living things grow, need food, breathe, respond, excrete and reproduce. A car moves and uses fuel but does not grow or reproduce.
concepts:
- code: cbse6s.living.features
  title: What makes something living
  notes: |
    Characteristics of living things: they need food (energy), grow, respire (breathe/take in air), respond to stimuli
    (plants bend towards light; touch-me-not folds), excrete wastes, reproduce, move (animals move from place to place;
    plants show movement in parts), and have a life span. Non-living things may show some features (a car moves, a
    crystal grows) but not all. Seeds look non-living but are alive (dormant) and sprout with water, air and warmth.
  explanations:
    text: 'Living things share features: they need food, grow, breathe, respond to things around them, get rid of waste, and have young ones. A car moves but cannot grow or have babies, so it is not living. A seed looks lifeless but sprouts when it gets water and warmth.'
    visual: 'Put a touch-me-not (mimosa) leaf near your finger. Touch it: the leaves fold. The plant is responding: a sign of life.'
    step_by_step: 'Step 1: List the features of living things. Step 2: Check the object for each one. Step 3: If it shows all of them over its life, it is living. Step 4: Showing only one or two is not enough.'
    real_world: Watching a bean seed soaked in water sprout over a few days shows that seeds are alive.
  picture:
    kind: compare
    columns:
    - title: Living things
      points:
      - need food
      - grow
      - reproduce
    - title: Non-living things
      points:
      - no food needed
      - do not grow
      - do not reproduce
    alt: Living things need food, grow and reproduce; non-living things do not.
  items:
  - prompt: Which is a feature of all living things?
    options:
    - They grow
    - They are green
    - They have legs
    - They can fly
    answer: They grow
    difficulty: 1
    hints:
    - Think of plants, animals, people.
    - From small to big.
    solution: All living things grow.
  - prompt: A car moves and uses fuel. Why is it not living?
    options:
    - It does not grow or reproduce
    - It is made of metal
    - It is too fast
    - It has wheels
    answer: It does not grow or reproduce
    difficulty: 1
    hints:
    - Check all the features.
    - Can it have baby cars?
    solution: A car does not grow, breathe or reproduce.
    mistakes:
      It has wheels: c6s_living
  - prompt: 'Leaves of a touch-me-not fold when touched. This shows:'
    options:
    - response to a stimulus
    - growth
    - excretion
    - reproduction
    answer: response to a stimulus
    difficulty: 1
    hints:
    - Touch is the stimulus.
    - It reacts.
    solution: The plant responds to touch.
  - prompt: 'A seed sprouts when it gets:'
    options:
    - water, air and warmth
    - only darkness
    - salt
    - plastic
    answer: water, air and warmth
    difficulty: 1
    hints:
    - Germination needs these.
    - Soak a bean.
    solution: Seeds need water, air and warmth to germinate.
  - prompt: 'Plants bending towards a window show:'
    options:
    - response to light
    - excretion
    - breathing only
    - that they are non-living
    answer: response to light
    difficulty: 2
    hints:
    - The window gives light.
    - Stimulus.
    solution: Plants grow towards light.
  - prompt: Which of these is living?
    options:
    - A dormant seed
    - A crystal
    - A cloud
    - A burning candle
    answer: A dormant seed
    difficulty: 2
    hints:
    - It can grow into a plant.
    - It is resting.
    solution: A seed is alive but resting (dormant).
- code: cbse6s.living.cycle
  title: Life cycles and adaptation
  after:
  - cbse6s.living.features
  notes: |
    Life cycle: stages from birth to adult to reproduction. Frog: egg → tadpole (lives in water, gills, tail) → froglet →
    adult frog (lungs, legs). Butterfly/silk moth: egg → larva (caterpillar) → pupa → adult. Mosquito: egg → larva → pupa
    → adult, all early stages in stagnant water (so remove standing water). Plants: seed → seedling → adult plant →
    flower → fruit and seed. Adaptations: features that help survival in a habitat.
  explanations:
    text: Living things go through stages in their life, called a life cycle. A frog starts as an egg, becomes a tadpole that swims with a tail, then grows legs and becomes a frog. A butterfly goes from egg to caterpillar to pupa to butterfly.
    visual: 'Draw a circle with four stops: frog eggs in water, a tadpole with a tail, a froglet with legs and a small tail, and an adult frog. Arrows join them in a loop.'
    step_by_step: 'Step 1: Start with the egg or seed. Step 2: Name each stage in order. Step 3: Note how the body changes. Step 4: Close the loop: the adult lays eggs or makes seeds.'
    real_world: Mosquitoes breed in stagnant water; emptying flowerpot trays and coolers breaks their life cycle and prevents dengue.
  picture:
    kind: flow
    steps:
    - Egg
    - Tadpole
    - Froglet
    - Adult frog
    - Lays eggs again
    alt: 'A frog''s life cycle: egg, tadpole, froglet, adult frog, which lays eggs again.'
  items:
  - prompt: 'A young frog that lives in water and has a tail is a:'
    options:
    - Tadpole
    - Caterpillar
    - Pupa
    - Seedling
    answer: Tadpole
    difficulty: 1
    hints:
    - Comes out of frog eggs.
    - Swims with a tail.
    solution: It is a tadpole.
  - prompt: What is the correct order for a butterfly?
    options:
    - Egg → caterpillar → pupa → butterfly
    - Egg → pupa → caterpillar → butterfly
    - Caterpillar → egg → butterfly → pupa
    - Pupa → egg → butterfly → caterpillar
    answer: Egg → caterpillar → pupa → butterfly
    difficulty: 1
    hints:
    - The caterpillar eats leaves.
    - Then it rests as a pupa.
    solution: Egg, larva (caterpillar), pupa, adult.
  - prompt: 'Mosquito larvae grow in:'
    options:
    - stagnant water
    - dry sand
    - tree bark
    - clouds
    answer: stagnant water
    difficulty: 1
    hints:
    - Still, standing water.
    - Coolers, pots.
    solution: Mosquito eggs, larvae and pupae live in stagnant water.
  - prompt: How can we break the mosquito life cycle at home?
    options:
    - Empty standing water regularly
    - Leave water in coolers
    - Grow more weeds
    - Keep buckets uncovered
    answer: Empty standing water regularly
    difficulty: 2
    hints:
    - Where do larvae live?
    - Remove it.
    solution: Removing stagnant water stops mosquitoes breeding.
  - prompt: A frog's life cycle above has 4 stages. A butterfly's also has 4. How many stages in total?
    answer: '8'
    check: 4+4
    difficulty: 1
    hints:
    - 4 + 4.
    - Add.
    solution: 4 + 4 = 8.
  - prompt: 'A plant''s life cycle starts with a:'
    options:
    - Seed
    - Flower
    - Fruit only
    - Leaf
    answer: Seed
    difficulty: 1
    hints:
    - It sprouts.
    - Germination.
    solution: A seed grows into a seedling and then a plant.
