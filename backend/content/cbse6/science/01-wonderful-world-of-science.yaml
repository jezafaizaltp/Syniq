# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 1. Format: content/README.md.
subject: cbse6-sci
chapter: 1
title: The Wonderful World of Science
tips:
  c6s_method: Science starts with a question and checks ideas by observing and testing, not just by guessing.
  t6_bose: "J. C. Bose built instruments to measure tiny plant reactions. What did they show?"
  t6_hypothesis: "A result and a conclusion come after the test. Which word names the guess you make before testing?"
  t6_janaki: "Janaki Ammal studied plants and developed sweeter sugarcane."
  t6_observation: "An observation is what you can see, hear or measure, not a feeling or a wish."
  t6_question_first: "Before you can find something out, you need to know what you want to find out."
  t6_raman: "This scientist studied how light scatters, and the effect carries his name. Bose worked on plants and radio waves; Kalam on rockets."
  t6_safety: "Some experiments use heat, glass or sharp tools. Why is an adult needed?"
  t6_science_event: "Science explains things we can test and measure. Which choice can be measured?"
  t6_testable: "A testable question can be answered by measuring. Can you measure 'best' or 'nicest'?"
  t6_years_between: "Subtract the earlier year from the later year."
  c6s1_steps: 'Put the steps of finding out in order: wonder, look, guess, test, decide.'
  c6s1_seen: An observation is only what you can see, hear, smell, touch or measure, not a reason or opinion.
  c6s1_fair: In a fair test only one thing is changed; everything else is kept the same.
  c6s1_years: Take the earlier year away from the later year.
  c6s1_who: 'Recall what each scientist was curious about: light, plants or crops.'
  c6s1_everyday: 'Ask: can this be explained by how nature works, or is it just a belief or a choice?'
  c6s1_safe: Think about what could go wrong and who should be there to help.
concepts:
- code: cbse6s.wws.method
  title: How scientists find things out
  notes: |
    Science is a way of understanding the world by asking questions, observing carefully, making a guess (hypothesis),
    testing it with an experiment, and drawing a conclusion. Results must be checked again; ideas can change with new
    evidence. Science is everywhere: cooking, plants, weather, the sky. Curiosity is the starting point.
  explanations:
    text: Science is a way of finding out how the world works. It starts with a question, like 'Why do leaves fall?'. You observe, make a guess, test it with an experiment, and see whether the result supports your guess. Then you test again.
    visual: 'Picture a loop: Question → Observe → Guess → Test → Conclude → New question. Science goes round and round this loop.'
    step_by_step: 'Step 1: Ask a clear question. Step 2: Observe carefully and note what you see. Step 3: Make a guess you can test. Step 4: Test it fairly. Step 5: Decide what the result tells you.'
    real_world: Wondering why your mother's curd sets faster in summer, then trying it in a warm and a cool place, is doing science.
  picture:
    kind: flow
    steps:
    - Ask a question
    - Observe
    - Make a guess
    - Test it
    - Conclude, then ask again
    alt: 'The steps of science: ask, observe, guess, test, conclude, and ask again.'
  activity:
    type: order
    prompt: Put the steps scientists use to find things out in order.
    steps:
    - Observe something
    - Ask a question
    - Make a guess (hypothesis)
    - Test it with an experiment
    - Look at the results
    - Share what you found
    reasons:
      Ask a question: A question comes from noticing something first.
      Make a guess (hypothesis): You guess an answer to a question, so the question comes first.
      Test it with an experiment: 'An experiment tests a guess: make the guess first.'
      Look at the results: There are no results until the test is done.
      Share what you found: You share findings after looking at the results.
  lesson:
    - teach: 'Science is a way of finding out about the world. It starts with curiosity: a question like ''Why does milk turn sour?''. Then we observe carefully, using our senses and measuring.'
      check:
        prompt: Which is a scientific question?
        options:
        - Does a plant grow taller in sunlight than in shade?
        - Which colour is the prettiest?
        - Who is the best singer?
        answer: Does a plant grow taller in sunlight than in shade?
        why: It can be checked by observing and measuring; the others are opinions.
    - teach: Next we make a hypothesis, a guess that can be tested, and we test it with an experiment. A fair test changes only one thing at a time, so we know what caused the result.
      picture:
        kind: flow
        steps:
        - Question
        - Observe
        - Hypothesis
        - Experiment
        - Conclusion
        alt: 'The steps of finding out: ask a question, observe, guess, test, then decide.'
      check:
        prompt: To test if sunlight helps a plant grow, what should be different between two pots?
        options:
        - Only the sunlight
        - The soil and water too
        - Everything
        answer: Only the sunlight
        why: Changing one thing makes it a fair test.
    - teach: 'Finally we draw a conclusion and share it. Others repeat the test to check. If new evidence disagrees, scientists change their ideas: that is a strength of science, not a weakness.'
      check:
        prompt: A result could not be repeated by anyone else. What should scientists do?
        options:
        - Doubt it and test again
        - Believe it anyway
        - Stop all tests
        answer: Doubt it and test again
        why: Science trusts results that can be checked again.
  items:
  - prompt: What is usually the first step in finding something out scientifically?
    options:
    - Asking a question
    - Writing the answer
    - Buying equipment
    - Guessing without looking
    answer: Asking a question
    difficulty: 1
    hints:
    - Curiosity comes first.
    - What do you want to know?
    solution: Science begins with a question.
    mistakes: {"Writing the answer": "t6_question_first", "Guessing without looking": "t6_question_first"}
  - prompt: 'A guess that can be tested is called a:'
    options:
    - Hypothesis
    - Conclusion
    - Result
    - Fact sheet
    answer: Hypothesis
    difficulty: 1
    hints:
    - It comes before the experiment.
    - A testable idea.
    solution: A testable guess is a hypothesis.
    mistakes: {"Conclusion": "t6_hypothesis", "Result": "t6_hypothesis"}
  - prompt: Why do scientists repeat experiments?
    options:
    - To check that the result is reliable
    - Because they forgot the result
    - To waste time
    - To change the answer
    answer: To check that the result is reliable
    difficulty: 1
    hints:
    - One result might be a mistake.
    - Reliable means trustworthy.
    solution: Repeating checks that the result is reliable.
    mistakes:
      To change the answer: c6s_method
  - prompt: Which is an observation?
    options:
    - The leaf is yellow and dry
    - Leaves are sad in winter
    - The tree wants water
    - Leaves are magic
    answer: The leaf is yellow and dry
    difficulty: 1
    hints:
    - What can you actually see?
    - No guessing.
    solution: An observation is what you notice with your senses.
    mistakes: {"Leaves are sad in winter": "t6_observation", "The tree wants water": "t6_observation"}
  - prompt: 'If new evidence disagrees with an old idea, scientists:'
    options:
    - Test again and may change the idea
    - Ignore the new evidence
    - Hide the result
    - Always keep the old idea
    answer: Test again and may change the idea
    difficulty: 2
    hints:
    - Science can change.
    - Evidence matters most.
    solution: Scientific ideas change when strong new evidence appears.
    mistakes:
      Always keep the old idea: c6s_method
  - prompt: Which question can be tested by an experiment?
    options:
    - Do seeds sprout faster in warm water?
    - Is blue the best colour?
    - Which song is nicest?
    - Are cats better than dogs?
    answer: Do seeds sprout faster in warm water?
    difficulty: 2
    hints:
    - Can you measure the answer?
    - Count sprouted seeds.
    solution: Sprouting can be measured and compared; the others are opinions.
    mistakes: {"Is blue the best colour?": "t6_testable", "Are cats better than dogs?": "t6_testable"}
  - prompt: 'Riya thinks ''salt dissolves faster in hot water''. This is her:'
    options:
    - Hypothesis
    - Conclusion
    - Observation
    answer: Hypothesis
    difficulty: 1
    hints:
    - She has not tested it yet.
    - It is a guess she can test.
    solution: 'Step 1: it is an idea she can check by experiment. Step 2: a testable guess is a hypothesis.'
    mistakes:
      Conclusion: c6s1_steps
      Observation: c6s1_steps
  - prompt: 'After testing, Riya finds salt dissolves faster in hot water. Saying this is her:'
    options:
    - Conclusion
    - Question
    - Hypothesis
    answer: Conclusion
    difficulty: 1
    hints:
    - This comes after the experiment.
    - It is what she decides from the results.
    solution: 'Step 1: the test is done. Step 2: what she decides from the result is the conclusion.'
    mistakes:
      Question: c6s1_steps
      Hypothesis: c6s1_steps
  - prompt: Which is an observation, not a guess?
    options:
    - The ice cube melted in 10 minutes
    - Ice melts because it is unhappy
    - Maybe ice melts faster at night
    answer: The ice cube melted in 10 minutes
    difficulty: 1
    hints:
    - An observation is something you saw or measured.
    - Which one was timed?
    solution: 'Step 1: ''10 minutes'' was measured. Step 2: the others are guesses or not science.'
    mistakes:
      Ice melts because it is unhappy: c6s1_seen
      Maybe ice melts faster at night: c6s1_seen
  - prompt: To test whether seeds need water to sprout, which is a fair test?
    options:
    - Two pots of the same seeds and soil; water only one
    - Water one pot, keep the other in the fridge
    - Use different seeds in each pot
    answer: Two pots of the same seeds and soil; water only one
    difficulty: 2
    hints:
    - Change only one thing.
    - The thing being tested is water.
    solution: 'Step 1: keep seeds, soil and place the same. Step 2: change only the water, so any difference is due to water.'
    mistakes:
      Water one pot, keep the other in the fridge: c6s1_fair
      Use different seeds in each pot: c6s1_fair
  - prompt: Which step usually comes just before doing an experiment?
    options:
    - Making a hypothesis
    - Writing the conclusion
    - Sharing results
    answer: Making a hypothesis
    difficulty: 2
    hints:
    - You test something.
    - What is being tested?
    solution: 'Step 1: an experiment tests an idea. Step 2: so the hypothesis comes just before it.'
    mistakes:
      Writing the conclusion: c6s1_steps
      Sharing results: c6s1_steps
  - prompt: Why do scientists measure instead of just saying 'it got hotter'?
    options:
    - Measurements can be checked and compared
    - Measuring takes longer
    - Words are not allowed
    answer: Measurements can be checked and compared
    difficulty: 2
    hints:
    - '''Hotter'' means different things to different people.'
    - A number is the same for everyone.
    solution: 'Step 1: numbers like 35 °C mean the same to everyone. Step 2: so others can check and compare results.'
    mistakes:
      Measuring takes longer: c6s1_seen
      Words are not allowed: c6s1_seen
  - prompt: 'A test shows a plant grew in the dark. Many other tests show plants need light to make food. A good scientist would:'
    options:
    - Repeat the test and look for what was different
    - Throw away all old results
    - Ignore the new test
    answer: Repeat the test and look for what was different
    difficulty: 3
    hints:
    - One strange result needs checking.
    - Neither ignore it nor throw everything away.
    solution: 'Step 1: one odd result may have a hidden cause. Step 2: repeat it carefully and see what was different.'
    mistakes:
      Throw away all old results: c6s1_steps
      Ignore the new test: c6s1_steps
  - prompt: Which tool helps us observe tiny things like cells?
    options:
    - Microscope
    - Thermometer
    - Measuring tape
    answer: Microscope
    difficulty: 1
    hints:
    - It makes small things look bigger.
    - Not for temperature or length.
    solution: 'Step 1: a thermometer measures heat and a tape measures length. Step 2: a microscope magnifies tiny things.'
    mistakes:
      Thermometer: c6s1_seen
      Measuring tape: c6s1_seen
  - prompt: Which question is hard to test by experiment?
    options:
    - Is red a better colour than blue?
    - Does sugar dissolve faster when stirred?
    - Do plants bend towards light?
    answer: Is red a better colour than blue?
    difficulty: 2
    hints:
    - Which one depends on what someone likes?
    - Opinions can't be measured.
    solution: 'Step 1: stirring and light can be tested. Step 2: ''better colour'' is an opinion, not testable.'
    mistakes:
      Does sugar dissolve faster when stirred?: c6s1_fair
      Do plants bend towards light?: c6s1_fair
- code: cbse6s.wws.around
  title: Science in everyday life
  after:
  - cbse6s.wws.method
  notes: |
    Science explains daily things: why ice melts, why food spoils, why the Moon looks different, how a plant grows.
    Indian scientists such as C. V. Raman (scattering of light, Nobel 1930), Jagadish Chandra Bose (plant responses,
    radio waves) and Janaki Ammal (plant breeding, sugarcane) were curious about everyday things. Safety: handle tools
    carefully and do experiments with an adult.
  explanations:
    text: Science is not only in labs. It explains why ice melts, why food spoils and why we see a rainbow. Indian scientists like C. V. Raman and J. C. Bose started with simple questions about light and plants.
    visual: 'Think of your kitchen: boiling water (heat), dough rising (tiny living yeast), salt dissolving (mixing). Each is a small science lesson.'
    step_by_step: 'Step 1: Notice something ordinary. Step 2: Ask ''why'' or ''how''. Step 3: Find out what is happening. Step 4: Connect it to a science idea.'
    real_world: C. V. Raman wondered why the sea looks blue on a ship voyage, and his work on light won a Nobel Prize in 1930.
  picture:
    kind: compare
    columns:
    - title: Scientist
      points:
      - C. V. Raman
      - J. C. Bose
      - Janaki Ammal
    - title: Curious about
      points:
      - light and colour
      - plants and radio waves
      - plants and sugarcane
    alt: C. V. Raman studied light, J. C. Bose studied plants and radio waves, and Janaki Ammal studied plants like sugarcane.
  activity:
    type: sort
    prompt: Is it something seen (an observation) or a question we could test?
    bins:
    - Observation
    - Question to test
    items:
    - label: The ice in my glass melted in the sun
      bin: Observation
      clue: Is it something someone saw, or something to find out?
      why: 'It''s something seen: an observation.'
    - label: Does sugar dissolve faster in hot water?
      bin: Question to test
      clue: Could you do an experiment to find out?
      why: 'You can test it with hot and cold water: a question to test.'
    - label: The plant near the window is taller
      bin: Observation
      clue: Is it something seen, or a question?
      why: 'It''s something noticed: an observation.'
    - label: Do ants like sugar more than salt?
      bin: Question to test
      clue: Could you set up a test?
      why: 'Put both out and watch: a question to test.'
    - label: My shadow is shortest at noon
      bin: Observation
      clue: Is it something seen, or something asked?
      why: 'Something noticed: an observation.'
    - label: Will a seed grow without light?
      bin: Question to test
      clue: Could you do an experiment?
      why: 'Grow one seed in the dark and one in light: a question to test.'
  lesson:
    - teach: Science is all around us. Cooking changes food, puddles dry up in the sun, the Moon seems to change shape. Each of these has a reason that science can explain.
      check:
        prompt: Which of these does science explain?
        options:
        - Why puddles dry up on a sunny day
        - Which film is the most fun
        - Whose name is nicest
        answer: Why puddles dry up on a sunny day
        why: Drying is a natural process with a cause we can study.
    - teach: Indian scientists were curious about ordinary things. C. V. Raman wondered why the sea looks blue and won the Nobel Prize in 1930 for work on light. J. C. Bose showed plants respond to their surroundings. Janaki Ammal bred better sugarcane.
      picture:
        kind: compare
        columns:
        - title: C. V. Raman
          points:
          - light
          - Nobel Prize 1930
        - title: J. C. Bose
          points:
          - plants respond
          - radio waves
        - title: Janaki Ammal
          points:
          - plant breeding
          - sugarcane
        alt: Raman studied light, Bose studied plants and radio waves, Janaki Ammal bred plants like sugarcane.
      check:
        prompt: Who studied why light scatters and the sea looks blue?
        options:
        - C. V. Raman
        - Janaki Ammal
        - J. C. Bose
        answer: C. V. Raman
        why: Raman's famous work was on the scattering of light.
    - teach: Doing science safely matters. Use tools carefully, never taste or smell unknown things, keep away from fire and electricity, and work with a teacher or adult nearby.
      check:
        prompt: You find an unknown powder in the lab. What should you do?
        options:
        - Tell an adult and not touch or taste it
        - Taste a little
        - Mix it with water to see
        answer: Tell an adult and not touch or taste it
        why: Unknown things can be harmful; ask an adult first.
  items:
  - prompt: Which Indian scientist won the Nobel Prize for work on light?
    options:
    - C. V. Raman
    - J. C. Bose
    - Janaki Ammal
    - A. P. J. Abdul Kalam
    answer: C. V. Raman
    difficulty: 1
    hints:
    - The 'Raman effect'.
    - '1930.'
    solution: C. V. Raman won the Nobel Prize in Physics in 1930.
    mistakes: {"J. C. Bose": "t6_raman", "A. P. J. Abdul Kalam": "t6_raman"}
  - prompt: 'J. C. Bose showed that plants:'
    options:
    - respond to their surroundings
    - can walk
    - do not need water
    - are not living
    answer: respond to their surroundings
    difficulty: 1
    hints:
    - He used instruments to measure plant responses.
    - Plants react.
    solution: Bose showed plants respond to things like touch and heat.
    mistakes: {"can walk": "t6_bose", "are not living": "t6_bose"}
  - prompt: Which everyday event is explained by science?
    options:
    - Ice melting in the sun
    - A lucky number
    - A favourite colour
    - A dream
    answer: Ice melting in the sun
    difficulty: 1
    hints:
    - Heat changes things.
    - It can be tested.
    solution: 'Melting is explained by heat: a science idea.'
    mistakes: {"A lucky number": "t6_science_event", "A favourite colour": "t6_science_event"}
  - prompt: C. V. Raman won the Nobel Prize in 1930. How many years after that was 2024?
    answer: '94'
    check: 2024 - 1930
    difficulty: 1
    hints:
    - 2024 − 1930.
    - Subtract.
    solution: 2024 − 1930 = 94 years.
    mistakes: {"104": "t6_years_between", "3954": "t6_years_between"}
  - prompt: Why should experiments be done with an adult nearby?
    options:
    - For safety
    - To get marks
    - To make them slower
    - Adults do the thinking
    answer: For safety
    difficulty: 1
    hints:
    - Some tools are hot or sharp.
    - Being careful.
    solution: An adult helps keep experiments safe.
    mistakes: {"To get marks": "t6_safety", "Adults do the thinking": "t6_safety"}
  - prompt: 'Janaki Ammal is known for her work on:'
    options:
    - plants such as sugarcane
    - rockets
    - computers
    - medicine for animals
    answer: plants such as sugarcane
    difficulty: 2
    hints:
    - She was a botanist.
    - Plant breeding.
    solution: Janaki Ammal was a botanist who worked on sugarcane and other plants.
    mistakes: {"rockets": "t6_janaki", "computers": "t6_janaki"}
  - prompt: Why does a cut apple turn brown after some time?
    options:
    - It reacts with air
    - It is getting colder
    - Brown is its real colour
    answer: It reacts with air
    difficulty: 2
    hints:
    - It only happens on the cut side.
    - What touches the cut side?
    solution: 'Step 1: only the cut surface is open to air. Step 2: substances in the apple react with air and turn brown.'
    mistakes:
      It is getting colder: c6s1_everyday
      Brown is its real colour: c6s1_everyday
  - prompt: Why does food spoil faster outside than in a fridge?
    options:
    - Tiny microbes grow faster when it is warm
    - Fridges add salt
    - Cold air is heavier
    answer: Tiny microbes grow faster when it is warm
    difficulty: 2
    hints:
    - Something living causes spoiling.
    - Does it like warm or cold?
    solution: 'Step 1: microbes spoil food. Step 2: they grow faster in warmth, so cold slows spoiling.'
    mistakes:
      Fridges add salt: c6s1_everyday
      Cold air is heavier: c6s1_everyday
  - prompt: J. C. Bose invented an instrument to measure tiny growth of plants. What is it called?
    options:
    - Crescograph
    - Telescope
    - Barometer
    answer: Crescograph
    difficulty: 3
    hints:
    - It measures growth, not stars or air pressure.
    - Its name comes from the Latin for 'grow'.
    solution: 'Step 1: a telescope sees far things, a barometer measures air pressure. Step 2: Bose''s crescograph measured plant growth.'
    mistakes:
      Telescope: c6s1_who
      Barometer: c6s1_who
  - prompt: Janaki Ammal helped India grow sweeter varieties of which crop?
    options:
    - Sugarcane
    - Tea
    - Cotton
    answer: Sugarcane
    difficulty: 1
    hints:
    - She was a plant scientist.
    - The crop gives us sugar.
    solution: 'Step 1: Janaki Ammal worked on breeding crops. Step 2: her famous work was on sugarcane.'
    mistakes:
      Tea: c6s1_who
      Cotton: c6s1_who
  - prompt: 'February 28 is National Science Day in India. It marks a discovery by:'
    options:
    - C. V. Raman
    - J. C. Bose
    - Janaki Ammal
    answer: C. V. Raman
    difficulty: 2
    hints:
    - The discovery was about light.
    - It is called the Raman effect.
    solution: 'Step 1: the Raman effect was announced on 28 February 1928. Step 2: so the day honours C. V. Raman.'
    mistakes:
      J. C. Bose: c6s1_who
      Janaki Ammal: c6s1_who
  - prompt: Which is a safe habit in a science activity?
    options:
    - Wash hands after handling materials
    - Smell every liquid closely
    - Run around while holding glass
    answer: Wash hands after handling materials
    difficulty: 1
    hints:
    - Which one keeps you away from harm?
    - The other two are risky.
    solution: 'Step 1: smelling unknown liquids and running with glass can hurt you. Step 2: washing hands is safe.'
    mistakes:
      Smell every liquid closely: c6s1_safe
      Run around while holding glass: c6s1_safe
  - prompt: Why does the Moon seem to change shape over a month?
    options:
    - We see different amounts of its sunlit half
    - Clouds cover parts of it
    - It really grows and shrinks
    answer: We see different amounts of its sunlit half
    difficulty: 3
    hints:
    - Half the Moon is always lit by the Sun.
    - As it moves round Earth, we see that half from different angles.
    solution: 'Step 1: the Sun always lights half the Moon. Step 2: as the Moon goes round Earth, we see more or less of that lit half.'
    mistakes:
      Clouds cover parts of it: c6s1_everyday
      It really grows and shrinks: c6s1_everyday
  - prompt: Which of these is NOT science?
    options:
    - Believing a black cat brings bad luck
    - Finding out why iron rusts
    - Measuring rainfall every day
    answer: Believing a black cat brings bad luck
    difficulty: 2
    hints:
    - Science needs evidence.
    - Which one has no evidence behind it?
    solution: 'Step 1: rusting and rainfall can be tested and measured. Step 2: the black cat idea is a superstition with no evidence.'
    mistakes:
      Finding out why iron rusts: c6s1_everyday
      Measuring rainfall every day: c6s1_everyday
  - prompt: Raman won his Nobel Prize in 1930. How many years was that before India's independence in 1947?
    answer: '17'
    check: 1947-1930
    difficulty: 2
    hints:
    - Subtract the earlier year from the later one.
    - 1947 − 1930.
    solution: 'Step 1: 1947 − 1930. Step 2: = 17 years.'
    mistakes:
      '27': c6s1_years
      '13': c6s1_years
