# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 7. Format: content/README.md.
subject: cbse6-sci
chapter: 7
title: Temperature and its Measurement
tips:
  c6s_thermo: A clinical thermometer reads only 35–42 °C (body heat). For air or water use a laboratory thermometer (about −10 to 110 °C).
  c6s_touch: 'Touch is not reliable for temperature: the same water can feel warm to a cold hand and cool to a warm hand.'
  t6_body_temp: "Normal human body temperature is about 37 °C."
  t6_boiling_point: "Water boils at sea level at 100 °C."
  t6_expands: "Liquids get bigger when heated. Where can the liquid go in a thin tube?"
  t6_freezing_point: "Water turns to ice at 0 °C."
  t6_hold_thermometer: "Your warm hand on the bulb would change the reading."
  t6_marks_reading: "3 marks × 2 °C each, added to 20."
  t6_mercury: "If a mercury thermometer breaks, what is the danger?"
  t6_scale_division: "Divide the gap between the marks by the number of divisions."
  t6_small_division: "From 35 to 36 is 1 degree, split into 10 parts. Each part is 1 ÷ 10."
concepts:
- code: cbse6s.temp.measure
  title: Temperature and thermometers
  notes: |
    Temperature tells how hot or cold something is, measured in degrees Celsius (°C) with a thermometer. Touch is
    unreliable (dip one hand in cold and one in hot water, then both in lukewarm). Clinical thermometer: 35–42 °C, for
    body temperature (normal about 37 °C); digital thermometers are safer than mercury ones. Laboratory thermometer:
    about −10 °C to 110 °C. Water freezes at 0 °C and boils at 100 °C at sea level. Read at eye level; hold by the top,
    not the bulb.
  explanations:
    text: Temperature tells us how hot or cold something is. We measure it in degrees Celsius with a thermometer, because touch can fool us. A clinical thermometer measures body temperature (normal about 37 °C). A laboratory thermometer measures a wider range, for water or air.
    visual: Put one hand in cold water and one in warm water. Then put both in lukewarm water. One hand feels it warm, the other cool. Same water! That's why we need a thermometer.
    step_by_step: 'Step 1: Choose the right thermometer. Step 2: Hold it by the top, not the bulb. Step 3: Wait until the reading stops changing. Step 4: Read at eye level and write °C.'
    real_world: When you have a fever, a doctor checks if your temperature is above about 37 °C. Weather reports give the day's temperature, such as 32 °C in Kochi.
  picture:
    kind: number_line
    from: 0
    to: 100
    step: 10
    points:
    - at: 0
      label: water freezes
    - at: 37
      label: body
    - at: 100
      label: water boils
    alt: 'A Celsius scale from 0 to 100: water freezes at 0 °C, normal body temperature is about 37 °C, and water boils at 100 °C.'
  activity:
    type: scale
    min: -10
    max: 110
    step: 1
    start: 25
    unit: °C
    orientation: vertical
    prompt: A laboratory thermometer. Move the level up and down.
    zones:
    - from: -10
      to: 0
      label: Below freezing
      says: Water at this temperature is frozen into ice.
    - from: 0
      to: 100
      label: Liquid water
      says: Between 0 °C and 100 °C, water is a liquid.
    - from: 100
      to: 110
      label: Above boiling
      says: Above 100 °C, water has boiled into steam.
    goals:
    - prompt: Ice melts at this temperature. Set it.
      value: 0
      mistakes:
      - when:
          v: 100
        say: 100 °C is where water boils. Ice melts at a much colder temperature.
    - prompt: Normal body temperature is about this. Set it.
      value: 37
      mistakes:
      - when:
          v:
          - 40
          - 45
        say: That's a high fever, not normal body temperature.
    - prompt: Water boils here (at sea level).
      value: 100
      mistakes:
      - when:
          v: 0
        say: 0 °C is where ice melts. Water boils much hotter.
  items:
  - prompt: What is the normal temperature of the human body (in °C, about)?
    answer: '37'
    check: '37'
    difficulty: 1
    hints:
    - A little below 40.
    - Doctors check for this.
    solution: Normal body temperature is about 37 °C.
    mistakes: {"98.6": "t6_body_temp", "100": "t6_body_temp"}
  - prompt: At what temperature does pure water boil at sea level (in °C)?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - The top fixed point.
    - Kettle temperature.
    solution: Water boils at 100 °C.
    mistakes: {"0": "t6_boiling_point", "37": "t6_boiling_point"}
  - prompt: At what temperature does water freeze (in °C)?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - The bottom fixed point.
    - Ice forms.
    solution: Water freezes at 0 °C.
    mistakes: {"100": "t6_freezing_point", "32": "t6_freezing_point"}
  - prompt: Which thermometer should be used to measure the temperature of hot water?
    options:
    - Laboratory thermometer
    - Clinical thermometer
    - Your finger
    - A ruler
    answer: Laboratory thermometer
    difficulty: 1
    hints:
    - The clinical one only goes to 42 °C.
    - Wider range.
    solution: A laboratory thermometer covers a wide range.
    mistakes:
      Clinical thermometer: c6s_thermo
  - prompt: Why is touch not a reliable way to judge temperature?
    options:
    - The same thing can feel warm or cold depending on your hand
    - Hands are too small
    - Touch is too accurate
    - Only adults can feel heat
    answer: The same thing can feel warm or cold depending on your hand
    difficulty: 2
    hints:
    - Remember the three-bowl test.
    - Feelings vary.
    solution: Our sense of touch depends on what our hand felt before.
    mistakes:
      Hands are too small: c6s_touch
  - prompt: A child's temperature rose from 37 °C to 39 °C. By how many degrees did it rise?
    answer: '2'
    check: 39 - 37
    difficulty: 1
    hints:
    - Subtract.
    - 39 − 37.
    solution: 39 − 37 = 2 °C.
    mistakes: {"76": "t6_temp_rise", "39": "t6_temp_rise"}
- code: cbse6s.temp.read
  title: Reading a thermometer and the Celsius scale
  after:
  - cbse6s.temp.measure
  notes: |
    A thermometer scale is divided into degrees; small marks may be 0.1 °C (clinical) or 1 °C (laboratory). Count the
    value of each small division first: (difference between two numbered marks) ÷ (number of divisions). Liquid in the
    tube (alcohol or mercury) expands when heated and rises. Do not touch the bulb; keep the thermometer upright in the
    liquid without touching the container. Digital thermometers show the number directly.
  explanations:
    text: 'A thermometer has a scale with small marks. First find what each small mark is worth: if 30 and 40 are numbered and there are 10 marks between, each mark is 1 °C. The liquid inside rises when warm because it expands.'
    visual: 'Picture a thermometer between 30 and 40 with 10 small marks. The liquid stops at the 6th mark above 30: 36 °C.'
    step_by_step: 'Step 1: Find two numbered marks. Step 2: Count the small divisions between them. Step 3: Divide the difference by the divisions: value of one mark. Step 4: Count marks from the lower number and add.'
    real_world: Nurses read the small marks of clinical thermometers to one decimal place, like 37.6 °C.
  picture:
    kind: number_line
    from: 30
    to: 40
    step: 1
    points:
    - at: 36
      label: 36 °C
    alt: A thermometer scale from 30 to 40 with one-degree marks; the liquid reaches 36 °C.
  activity:
    type: scale
    min: 35
    max: 42
    step: 0.1
    start: 35
    unit: °C
    orientation: horizontal
    prompt: A clinical thermometer reads from 35 to 42 °C. Each small step is 0.1 °C.
    zones:
    - from: 35
      to: 37.5
      label: Normal
      says: A healthy body is about 37 °C.
    - from: 37.5
      to: 42
      label: Fever
      says: 'Above about 37.5 °C the body is fighting an illness: a fever.'
    goals:
    - prompt: Set it to 37.0 °C.
      value: 37
    - prompt: Ravi has a fever of 38.6 °C. Set it.
      value: 38.6
      mistakes:
      - when:
          v: 38
        say: 38.0 is six small steps short. Each small step is 0.1 °C.
    - prompt: Set any temperature that shows a fever.
      zone: Fever
  items:
  - prompt: Between the 20 and 30 marks there are 10 small divisions. What is each division worth (in °C)?
    answer: '1'
    check: (30-20)/10
    difficulty: 1
    hints:
    - (30 − 20) ÷ 10.
    - Divide.
    solution: 10 ÷ 10 = 1 °C per division.
    mistakes: {"10": "t6_scale_division", "2": "t6_scale_division"}
  - prompt: Between 35 and 36 there are 10 divisions. What is each division worth (in °C)?
    answer: 1/10
    check: Rational(1,10)
    difficulty: 2
    hints:
    - (36 − 35) ÷ 10.
    - A tenth.
    solution: 1 ÷ 10 = 0.1 °C.
    mistakes: {"1": "t6_small_division", "10": "t6_small_division"}
  - prompt: Each mark is 2 °C. The liquid is 3 marks above 20 °C. What is the reading (in °C)?
    answer: '26'
    check: 20 + 3*2
    difficulty: 2
    hints:
    - 3 × 2 = 6.
    - 20 + 6.
    solution: 20 + 3 × 2 = 26 °C.
    mistakes: {"23": "t6_marks_reading", "6": "t6_marks_reading"}
  - prompt: Why does the liquid rise in a thermometer when it is heated?
    options:
    - It expands
    - It shrinks
    - It evaporates
    - It freezes
    answer: It expands
    difficulty: 1
    hints:
    - Most things get bigger when heated.
    - Takes more space.
    solution: The liquid expands and moves up the tube.
    mistakes: {"It shrinks": "t6_expands", "It evaporates": "t6_expands"}
  - prompt: Where should you hold a thermometer?
    options:
    - By the top, away from the bulb
    - By the bulb
    - By the middle with a tight grip
    - It doesn't matter
    answer: By the top, away from the bulb
    difficulty: 1
    hints:
    - Your hand heat would change the reading.
    - Bulb senses heat.
    solution: Holding the bulb would warm it and spoil the reading.
    mistakes: {"By the bulb": "t6_hold_thermometer", "It doesn't matter": "t6_hold_thermometer"}
  - prompt: Why are digital thermometers preferred over mercury ones?
    options:
    - Mercury is poisonous if the thermometer breaks
    - Digital ones are heavier
    - Mercury is too cheap
    - Digital ones need no battery
    answer: Mercury is poisonous if the thermometer breaks
    difficulty: 2
    hints:
    - Safety.
    - Mercury is toxic.
    solution: Mercury is toxic, so digital thermometers are safer.
    mistakes: {"Digital ones are heavier": "t6_mercury", "Mercury is too cheap": "t6_mercury"}
