# CBSE Class 6 Science (NCERT Curiosity, 2024-25), chapter 7. Format: content/README.md.
subject: cbse6-sci
chapter: 7
title: Temperature and its Measurement
tips:
  c6s_thermo: "A clinical thermometer only reads body heat, from about 35 to 42 °C. Hot water is much hotter. Which thermometer has a wider range?"
  c6s_touch: 'Touch is not reliable for temperature: the same water can feel warm to a cold hand and cool to a warm hand.'
  t6_body_temp: "98.6 is the body temperature in Fahrenheit. The question asks for Celsius, which is a smaller number in the high 30s."
  t6_boiling_point: "0 °C is where water freezes and 37 °C is body heat. Water boils at a much higher round number on the Celsius scale."
  t6_expands: "Liquids get bigger when heated. Where can the liquid go in a thin tube?"
  t6_freezing_point: "32 is the freezing point in Fahrenheit, and 100 °C is boiling. On the Celsius scale, freezing is the starting point of the scale."
  t6_hold_thermometer: "Your warm hand on the bulb would change the reading."
  t6_marks_reading: "3 marks × 2 °C each, added to 20."
  t6_mercury: "If a mercury thermometer breaks, what is the danger?"
  t6_scale_division: "Divide the gap between the marks by the number of divisions."
  t6_small_division: "From 35 to 36 is 1 degree, split into 10 parts. Each part is 1 ÷ 10."
  c6s7_range: Look at the range printed on each thermometer and check whether the temperature fits inside it.
  c6s7_fixed: Recall the fixed points of water on the Celsius scale and a healthy body's reading.
  c6s7_division: 'Find what one small mark is worth: the gap between two numbers divided by the marks between them.'
  c6s7_change: A rise or fall is the difference between the two readings.
  c6s7_handle: 'Think of what would spoil the reading: warm fingers, the container''s heat, or reading at a slant.'
  c6s7_expand: Liquids take up more room when warmed and less when cooled.
concepts:
- code: cbse6s.temp.measure
  title: Temperature and thermometers
  notes: |
    Temperature tells how hot or cold something is, measured in degrees Celsius (°C) with a thermometer. Touch is
    unreliable (dip one hand in cold and one in hot water, then both in lukewarm). Clinical thermometer: 35–42 °C, for
    body temperature (normal about 37 °C); digital thermometers are safer than mercury ones. Laboratory thermometer:
    about −10 °C to 110 °C. Water freezes at 0 °C and boils at 100 °C at sea level. Read at eye level; hold by the top,
    not the bulb.
  explanations:
    text: Temperature tells us how hot or cold something is. We measure it in degrees Celsius with a thermometer, because touch can fool us. A clinical thermometer measures body temperature (normal about 37 °C). A laboratory thermometer measures a wider range, for water or air.
    visual: Put one hand in cold water and one in warm water. Then put both in lukewarm water. One hand feels it warm, the other cool. Same water! That's why we need a thermometer.
    step_by_step: 'Step 1: Choose the right thermometer. Step 2: Hold it by the top, not the bulb. Step 3: Wait until the reading stops changing. Step 4: Read at eye level and write °C.'
    real_world: When you have a fever, a doctor checks if your temperature is above about 37 °C. Weather reports give the day's temperature, such as 32 °C in Kochi.
  picture:
    kind: number_line
    from: 0
    to: 100
    step: 10
    points:
    - at: 0
      label: water freezes
    - at: 37
      label: body
    - at: 100
      label: water boils
    alt: 'A Celsius scale from 0 to 100: water freezes at 0 °C, normal body temperature is about 37 °C, and water boils at 100 °C.'
  activity:
    type: scale
    min: -10
    max: 110
    step: 1
    start: 25
    unit: °C
    orientation: vertical
    prompt: A laboratory thermometer. Move the level up and down.
    zones:
    - from: -10
      to: 0
      label: Below freezing
      says: Water at this temperature is frozen into ice.
    - from: 0
      to: 100
      label: Liquid water
      says: Between 0 °C and 100 °C, water is a liquid.
    - from: 100
      to: 110
      label: Above boiling
      says: Above 100 °C, water has boiled into steam.
    goals:
    - prompt: Ice melts at this temperature. Set it.
      value: 0
      mistakes:
      - when:
          v: 100
        say: 100 °C is where water boils. Ice melts at a much colder temperature.
    - prompt: Normal body temperature is about this. Set it.
      value: 37
      mistakes:
      - when:
          v:
          - 40
          - 45
        say: That's a high fever, not normal body temperature.
    - prompt: Water boils here (at sea level).
      value: 100
      mistakes:
      - when:
          v: 0
        say: 0 °C is where ice melts. Water boils much hotter.
  lesson:
    - teach: 'Temperature tells how hot or cold something is. Our sense of touch can fool us: after dipping a hand in cold water, lukewarm water feels warm. So we use a thermometer and measure in degrees Celsius (°C).'
      picture:
        kind: compare
        columns:
        - title: Hand from cold water
          points:
          - lukewarm water feels warm
        - title: Hand from hot water
          points:
          - the same lukewarm water feels cold
        alt: The same lukewarm water feels warm to a cold hand and cold to a hot hand, so touch is unreliable.
      check:
        prompt: Why do we need a thermometer?
        options:
        - Touch can't tell temperature reliably
        - Thermometers make things warmer
        - Touch is always exact
        answer: Touch can't tell temperature reliably
        why: The same thing can feel warm or cold depending on your hand.
    - teach: A clinical thermometer measures body temperature; its range is about 35 °C to 42 °C. Normal body temperature is about 37 °C. Digital thermometers are now preferred as mercury is poisonous.
      check:
        prompt: 'A clinical thermometer cannot measure boiling water because:'
        options:
        - Its scale only goes up to about 42 °C
        - It is digital
        - Water is transparent
        answer: Its scale only goes up to about 42 °C
        why: Boiling water is far above its range.
    - teach: A laboratory thermometer measures from about −10 °C to 110 °C, for water, air and other things. On the Celsius scale pure water freezes at 0 °C and boils at 100 °C at sea level.
      picture:
        kind: number_line
        from: -10
        to: 110
        step: 10
        points:
        - at: 0
          label: ice melts
        - at: 37
          label: body
        - at: 100
          label: water boils
        alt: On the Celsius scale, ice melts at 0, the body is about 37 and water boils at 100.
      check:
        prompt: Which thermometer is right for checking the air in a classroom?
        options:
        - Laboratory thermometer
        - Clinical thermometer only
        - A ruler
        answer: Laboratory thermometer
        why: Room temperature may fall outside the clinical range; the lab thermometer covers it.
  items:
  - prompt: What is the normal temperature of the human body (in °C, about)?
    answer: '37'
    check: '37'
    difficulty: 1
    hints:
    - A little below 40.
    - Doctors check for this.
    solution: Normal body temperature is about 37 °C.
    mistakes: {"98.6": "t6_body_temp", "100": "t6_body_temp"}
  - prompt: At what temperature does pure water boil at sea level (in °C)?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - The top fixed point.
    - Kettle temperature.
    solution: Water boils at 100 °C.
    mistakes: {"0": "t6_boiling_point", "37": "t6_boiling_point"}
  - prompt: At what temperature does water freeze (in °C)?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - The bottom fixed point.
    - Ice forms.
    solution: Water freezes at 0 °C.
    mistakes: {"100": "t6_freezing_point", "32": "t6_freezing_point"}
  - prompt: Which thermometer should be used to measure the temperature of hot water?
    options:
    - Laboratory thermometer
    - Clinical thermometer
    - Your finger
    - A ruler
    answer: Laboratory thermometer
    difficulty: 1
    hints:
    - The clinical one only goes to 42 °C.
    - Wider range.
    solution: A laboratory thermometer covers a wide range.
    mistakes:
      Clinical thermometer: c6s_thermo
  - prompt: Why is touch not a reliable way to judge temperature?
    options:
    - The same thing can feel warm or cold depending on your hand
    - Hands are too small
    - Touch is too accurate
    - Only adults can feel heat
    answer: The same thing can feel warm or cold depending on your hand
    difficulty: 2
    hints:
    - Remember the three-bowl test.
    - Feelings vary.
    solution: Our sense of touch depends on what our hand felt before.
    mistakes:
      Hands are too small: c6s_touch
  - prompt: A child's temperature rose from 37 °C to 39 °C. By how many degrees did it rise?
    answer: '2'
    check: 39 - 37
    difficulty: 1
    hints:
    - Subtract.
    - 39 − 37.
    solution: 39 − 37 = 2 °C.
    mistakes: {"76": "t6_temp_rise", "39": "t6_temp_rise"}
  - prompt: 'A healthy person''s body temperature is about:'
    options:
    - 37 °C
    - 100 °C
    - 0 °C
    answer: 37 °C
    difficulty: 1
    hints:
    - It is between 35 and 42.
    - A fever goes above it.
    solution: 'Step 1: normal body temperature sits in the clinical range. Step 2: it is about 37 °C.'
    mistakes:
      100 °C: c6s7_fixed
      0 °C: c6s7_fixed
  - prompt: What is the range of a clinical thermometer?
    options:
    - About 35 °C to 42 °C
    - About −10 °C to 110 °C
    - 0 °C to 1000 °C
    answer: About 35 °C to 42 °C
    difficulty: 1
    hints:
    - It is only for the human body.
    - Body temperature stays in a narrow range.
    solution: 'Step 1: the body stays near 37 °C. Step 2: so a clinical thermometer covers only about 35–42 °C.'
    mistakes:
      About −10 °C to 110 °C: c6s7_range
      0 °C to 1000 °C: c6s7_range
  - prompt: 'A child''s temperature is 39 °C. This means the child:'
    options:
    - Has a fever
    - Is normal
    - Is very cold
    answer: Has a fever
    difficulty: 1
    hints:
    - Compare with the normal temperature.
    - Is 39 above or below it?
    solution: 'Step 1: normal is about 37 °C. Step 2: 39 °C is higher, so the child has a fever.'
    mistakes:
      Is normal: c6s7_fixed
      Is very cold: c6s7_fixed
  - prompt: Water in a pot goes from 25 °C to 100 °C. By how much did its temperature rise (in °C)?
    answer: '75'
    check: 100-25
    difficulty: 1
    hints:
    - Find the difference.
    - 100 − 25.
    solution: 'Step 1: 100 − 25. Step 2: = 75 °C rise.'
    mistakes:
      '125': c6s7_change
      '25': c6s7_change
  - prompt: Ice from the freezer is at −6 °C. It warms to 0 °C. By how many degrees did it warm?
    answer: '6'
    check: 0-(-6)
    difficulty: 2
    hints:
    - Count up from −6 to 0.
    - Each step is 1 degree.
    solution: 'Step 1: from −6 to 0 is 6 steps. Step 2: so it warmed by 6 °C.'
    mistakes:
      '-6': c6s7_change
      '0': c6s7_change
  - prompt: Which thermometer would you use to measure the temperature of boiling water?
    options:
    - Laboratory thermometer
    - Clinical thermometer
    - Either one
    answer: Laboratory thermometer
    difficulty: 1
    hints:
    - Boiling water is about 100 °C.
    - Which thermometer goes that high?
    solution: 'Step 1: a clinical one stops at about 42 °C. Step 2: a lab thermometer reaches 110 °C, so use it.'
    mistakes:
      Clinical thermometer: c6s7_range
      Either one: c6s7_range
  - prompt: Why is a digital thermometer safer than a mercury one?
    options:
    - Mercury is poisonous if the glass breaks
    - Digital thermometers are hotter
    - Mercury is magnetic
    answer: Mercury is poisonous if the glass breaks
    difficulty: 2
    hints:
    - Think about what happens if it breaks.
    - Mercury is harmful.
    solution: 'Step 1: a broken mercury thermometer releases mercury. Step 2: mercury is poisonous, so digital ones are safer.'
    mistakes:
      Digital thermometers are hotter: c6s7_handle
      Mercury is magnetic: c6s7_handle
  - prompt: Day temperature in a desert is 45 °C and night temperature is 20 °C. How much does it drop (in °C)?
    answer: '25'
    check: 45-20
    difficulty: 2
    hints:
    - Subtract the night reading from the day reading.
    - 45 − 20.
    solution: 'Step 1: 45 − 20. Step 2: = 25 °C drop.'
    mistakes:
      '65': c6s7_change
      '20': c6s7_change
  - prompt: Should a clinical thermometer be used to check a hot cup of tea?
    options:
    - No, the tea is hotter than its range and could break it
    - Yes, it works for anything
    - Yes, if you shake it first
    answer: No, the tea is hotter than its range and could break it
    difficulty: 3
    hints:
    - Hot tea can be 70–80 °C.
    - What is the top of a clinical scale?
    solution: 'Step 1: hot tea is far above 42 °C. Step 2: the thermometer could be damaged; use a lab thermometer.'
    mistakes:
      Yes, it works for anything: c6s7_range
      Yes, if you shake it first: c6s7_range
- code: cbse6s.temp.read
  title: Reading a thermometer and the Celsius scale
  after:
  - cbse6s.temp.measure
  notes: |
    A thermometer scale is divided into degrees; small marks may be 0.1 °C (clinical) or 1 °C (laboratory). Count the
    value of each small division first: (difference between two numbered marks) ÷ (number of divisions). Liquid in the
    tube (alcohol or mercury) expands when heated and rises. Do not touch the bulb; keep the thermometer upright in the
    liquid without touching the container. Digital thermometers show the number directly.
  explanations:
    text: 'A thermometer has a scale with small marks. First find what each small mark is worth: if 30 and 40 are numbered and there are 10 marks between, each mark is 1 °C. The liquid inside rises when warm because it expands.'
    visual: 'Picture a thermometer between 30 and 40 with 10 small marks. The liquid stops at the 6th mark above 30: 36 °C.'
    step_by_step: 'Step 1: Find two numbered marks. Step 2: Count the small divisions between them. Step 3: Divide the difference by the divisions: value of one mark. Step 4: Count marks from the lower number and add.'
    real_world: Nurses read the small marks of clinical thermometers to one decimal place, like 37.6 °C.
  picture:
    kind: number_line
    from: 30
    to: 40
    step: 1
    points:
    - at: 36
      label: 36 °C
    alt: A thermometer scale from 30 to 40 with one-degree marks; the liquid reaches 36 °C.
  activity:
    type: scale
    min: 35
    max: 42
    step: 0.1
    start: 35
    unit: °C
    orientation: horizontal
    prompt: A clinical thermometer reads from 35 to 42 °C. Each small step is 0.1 °C.
    zones:
    - from: 35
      to: 37.5
      label: Normal
      says: A healthy body is about 37 °C.
    - from: 37.5
      to: 42
      label: Fever
      says: 'Above about 37.5 °C the body is fighting an illness: a fever.'
    goals:
    - prompt: Set it to 37.0 °C.
      value: 37
    - prompt: Ravi has a fever of 38.6 °C. Set it.
      value: 38.6
      mistakes:
      - when:
          v: 38
        say: 38.0 is six small steps short. Each small step is 0.1 °C.
    - prompt: Set any temperature that shows a fever.
      zone: Fever
  lesson:
    - teach: Before reading a thermometer, find what one small mark is worth. Take two numbered marks, find their difference, and divide by the number of small divisions between them.
      picture:
        kind: number_line
        from: 30
        to: 40
        step: 2
        points:
        - at: 36
          label: reading
        alt: Marks every 2 degrees from 30 to 40; the liquid stops at 36.
      check:
        prompt: Between 10 °C and 20 °C there are 5 small divisions. What is each worth?
        options:
        - 2 °C
        - 5 °C
        - 1 °C
        answer: 2 °C
        why: (20 − 10) ÷ 5 = 2.
    - teach: A thermometer works because the liquid in it (mercury or coloured alcohol) expands when heated and rises in the thin tube. When it cools, it contracts and falls. Digital thermometers show the number on a screen.
      check:
        prompt: 'A thermometer is moved from cold water into warm water. The liquid will:'
        options:
        - Rise
        - Fall
        - Stay still
        answer: Rise
        why: Warming makes the liquid expand.
    - teach: 'Use a lab thermometer correctly: hold it upright by the top, dip the bulb fully in the liquid without touching the container, wait until the level is steady, and read with your eye level with the top of the liquid.'
      check:
        prompt: Why should the bulb not touch the bottom of a heated beaker?
        options:
        - The beaker may be hotter than the water
        - It makes the liquid fall
        - It cools the water
        answer: The beaker may be hotter than the water
        why: You want the water's temperature, not the container's.
  items:
  - prompt: Between the 20 and 30 marks there are 10 small divisions. What is each division worth (in °C)?
    answer: '1'
    check: (30-20)/10
    difficulty: 1
    hints:
    - (30 − 20) ÷ 10.
    - Divide.
    solution: 10 ÷ 10 = 1 °C per division.
    mistakes: {"10": "t6_scale_division", "2": "t6_scale_division"}
  - prompt: Between 35 and 36 there are 10 divisions. What is each division worth (in °C)?
    answer: 1/10
    check: Rational(1,10)
    difficulty: 2
    hints:
    - (36 − 35) ÷ 10.
    - A tenth.
    solution: 1 ÷ 10 = 0.1 °C.
    mistakes: {"1": "t6_small_division", "10": "t6_small_division"}
  - prompt: Each mark is 2 °C. The liquid is 3 marks above 20 °C. What is the reading (in °C)?
    answer: '26'
    check: 20 + 3*2
    difficulty: 2
    hints:
    - 3 × 2 = 6.
    - 20 + 6.
    solution: 20 + 3 × 2 = 26 °C.
    mistakes: {"23": "t6_marks_reading", "6": "t6_marks_reading"}
  - prompt: Why does the liquid rise in a thermometer when it is heated?
    options:
    - It expands
    - It shrinks
    - It evaporates
    - It freezes
    answer: It expands
    difficulty: 1
    hints:
    - Most things get bigger when heated.
    - Takes more space.
    solution: The liquid expands and moves up the tube.
    mistakes: {"It shrinks": "t6_expands", "It evaporates": "t6_expands"}
  - prompt: Where should you hold a thermometer?
    options:
    - By the top, away from the bulb
    - By the bulb
    - By the middle with a tight grip
    - It doesn't matter
    answer: By the top, away from the bulb
    difficulty: 1
    hints:
    - Your hand heat would change the reading.
    - Bulb senses heat.
    solution: Holding the bulb would warm it and spoil the reading.
    mistakes: {"By the bulb": "t6_hold_thermometer", "It doesn't matter": "t6_hold_thermometer"}
  - prompt: Why are digital thermometers preferred over mercury ones?
    options:
    - Mercury is poisonous if the thermometer breaks
    - Digital ones are heavier
    - Mercury is too cheap
    - Digital ones need no battery
    answer: Mercury is poisonous if the thermometer breaks
    difficulty: 2
    hints:
    - Safety.
    - Mercury is toxic.
    solution: Mercury is toxic, so digital thermometers are safer.
    mistakes: {"Digital ones are heavier": "t6_mercury", "Mercury is too cheap": "t6_mercury"}
  - prompt: Between 0 and 10 there are 5 divisions. The liquid is 2 divisions above 0. What is the reading (in °C)?
    answer: '4'
    check: 2*2
    difficulty: 2
    hints:
    - Each division is (10 − 0) ÷ 5.
    - Then count 2 of them.
    solution: 'Step 1: each division = 2 °C. Step 2: 2 divisions = 4 °C.'
    mistakes:
      '2': c6s7_division
      '20': c6s7_division
  - prompt: Each small mark on a clinical thermometer is 0.1 °C. The mercury is 4 marks above 37 °C. What is the reading (in °C)?
    answer: '37.4'
    check: 37+0.4
    difficulty: 2
    hints:
    - 4 marks × 0.1.
    - Add it to 37.
    solution: 'Step 1: 4 × 0.1 = 0.4. Step 2: 37 + 0.4 = 37.4 °C.'
    mistakes:
      '41': c6s7_division
      '37.04': c6s7_division
  - prompt: Between 50 and 60 there are 10 divisions. The liquid is 7 divisions above 50. What is the reading (in °C)?
    answer: '57'
    check: 50+7
    difficulty: 1
    hints:
    - Each division is 1 °C.
    - Add 7 to 50.
    solution: 'Step 1: each division = (60 − 50) ÷ 10 = 1. Step 2: 50 + 7 = 57 °C.'
    mistakes:
      '53': c6s7_division
      '120': c6s7_division
  - prompt: Why is the liquid tube in a thermometer made very thin?
    options:
    - A small expansion makes a big visible rise
    - To save glass
    - So it cannot break
    answer: A small expansion makes a big visible rise
    difficulty: 3
    hints:
    - Liquids expand only a little.
    - In a thin tube, a little extra liquid climbs a long way.
    solution: 'Step 1: the liquid expands only slightly. Step 2: in a thin tube that small change shows as a big rise, easy to read.'
    mistakes:
      To save glass: c6s7_expand
      So it cannot break: c6s7_expand
  - prompt: 'A thermometer is taken out of ice water into a warm room. Its liquid level will:'
    options:
    - Rise
    - Fall
    - Disappear
    answer: Rise
    difficulty: 1
    hints:
    - The room is warmer than the ice water.
    - Warm liquids expand.
    solution: 'Step 1: the liquid warms up. Step 2: it expands and rises.'
    mistakes:
      Fall: c6s7_expand
      Disappear: c6s7_expand
  - prompt: 'Reading a thermometer from a slant angle gives:'
    options:
    - A wrong reading
    - A more exact reading
    - The same reading always
    answer: A wrong reading
    difficulty: 2
    hints:
    - Your eye should be level with the liquid top.
    - Looking from above or below shifts the mark.
    solution: 'Step 1: from a slant, the liquid top lines up with the wrong mark. Step 2: so the reading is wrong; keep your eye level.'
    mistakes:
      A more exact reading: c6s7_handle
      The same reading always: c6s7_handle
  - prompt: Why do we hold a thermometer by its top and not by the bulb?
    options:
    - Warmth from our fingers would change the reading
    - The bulb is sharp
    - The top is heavier
    answer: Warmth from our fingers would change the reading
    difficulty: 2
    hints:
    - Our hands are warm.
    - The bulb senses heat.
    solution: 'Step 1: the bulb picks up heat. Step 2: fingers on it would add their heat and give a wrong reading.'
    mistakes:
      The bulb is sharp: c6s7_handle
      The top is heavier: c6s7_handle
  - prompt: Each mark is 5 °C. The liquid is 3 marks below 0. What is the reading (in °C)?
    answer: '-15'
    check: -3*5
    difficulty: 3
    hints:
    - Each mark is 5 °C.
    - Below 0 means negative.
    solution: 'Step 1: 3 × 5 = 15. Step 2: below zero, so −15 °C.'
    mistakes:
      '15': c6s7_division
      '-3': c6s7_division
  - prompt: Why must you wait a little after dipping the thermometer before reading it?
    options:
    - The liquid needs time to reach the water's temperature
    - The scale needs to dry
    - It always shows 0 first
    answer: The liquid needs time to reach the water's temperature
    difficulty: 2
    hints:
    - Heat takes time to pass into the bulb.
    - Wait until the level stops moving.
    solution: 'Step 1: the bulb''s liquid warms or cools slowly. Step 2: read only when the level is steady.'
    mistakes:
      The scale needs to dry: c6s7_handle
      It always shows 0 first: c6s7_handle
