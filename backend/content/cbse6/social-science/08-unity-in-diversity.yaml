# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 8. Format: content/README.md.
subject: cbse6-ss
chapter: 8
title: Unity in Diversity, or 'Many in the One'
tips:
  c6ss_diversity: Diversity means differences (languages, food, dress); unity means what joins us (shared values, stories, festivals, the Constitution).
  s6_bihu: "Bihu is the new-year festival of the Brahmaputra valley."
  s6_constitution: "Which document gives every Indian the same rights?"
  s6_eighth_schedule: "The Eighth Schedule started with 14 languages in 1950 and more were added later. Recall today's total."
  s6_ezhuthachan: "Ezhuthachan is called the father of a south Indian language: the one spoken in Kerala."
  s6_food_climate: "Rice grows in wet places and wheat in drier ones. Why do foods differ?"
  s6_harvest: "Onam, Pongal, Bihu and Lohri all come when crops are gathered in."
  s6_kathakali: "Kathakali dancers wear green face paint and big skirts, in God's Own Country."
  s6_many_in_one: "Look for one thing that comes in many regional forms."
  s6_mekhela: "The mekhela chador is woven from muga silk in the north-east."
  s6_tulsidas: "Tulsidas wrote in a language of north India, in its Awadhi dialect."
  s6_vasudhaiva: "'Vasudha' is the Earth and 'kutumbakam' means family."
  c6ss8_region: Link the dance, dress, food or festival to the state or region it comes from.
  c6ss8_why: Think about how landscape, climate and history shape what people grow, wear and celebrate.
  c6ss8_story: Recall which poet retold the great epic in which language.
  c6ss8_bond: 'Look for what is shared across all the differences: stories, values, festivals, symbols, the Constitution.'
  c6ss8_count: Recall the number of languages listed in the Constitution's Eighth Schedule.
concepts:
- code: cbse6ss.unity.diverse
  title: India's diversity
  notes: |
    India has great diversity: 22 languages in the Eighth Schedule of the Constitution and hundreds more spoken; many
    religions, foods (rice in the south and east, wheat in the north; idli, dhokla, litti), clothes (saree draped in many
    styles, dhoti, mekhela chador), music and dance forms (Kathakali, Bharatanatyam, Bihu, Garba). Diversity comes from
    different landscapes, climates and histories.
  explanations:
    text: India is full of variety. People speak many languages, eat different foods, wear different clothes and celebrate different festivals. In Kerala people eat rice and wear the mundu; in Punjab people eat wheat rotis and wear the turban. This variety is called diversity.
    visual: 'Picture a map of India with small pictures: Kathakali in Kerala, Bihu dancers in Assam, Garba in Gujarat, Bhangra in Punjab; idli in the south and paratha in the north.'
    step_by_step: 'Step 1: Pick one thing: food, dress, language or dance. Step 2: Compare it across regions. Step 3: Think why it differs: climate, crops, history.'
    real_world: A train journey from Thiruvananthapuram to Delhi passes through regions where the language, food and dress change many times.
  picture:
    kind: compare
    columns:
    - title: Region
      points:
      - Kerala
      - Assam
      - Gujarat
    - title: Dance
      points:
      - Kathakali, Mohiniyattam
      - Bihu
      - Garba
    alt: Kerala has Kathakali and Mohiniyattam, Assam has Bihu, and Gujarat has Garba.
  activity:
    type: sort
    prompt: Which state is it from?
    bins:
    - Kerala
    - Assam
    - Gujarat
    - Tamil Nadu
    items:
    - label: Kathakali
      bin: Kerala
      clue: Dance-drama with painted faces.
      why: Kerala.
    - label: Bihu
      bin: Assam
      clue: Spring dance.
      why: Assam.
    - label: Mekhela chador
      bin: Assam
      clue: A two-piece drape.
      why: Assam.
    - label: Garba
      bin: Gujarat
      clue: Navratri dance.
      why: Gujarat.
    - label: Dhokla
      bin: Gujarat
      clue: Steamed snack.
      why: Gujarat.
    - label: Bharatanatyam
      bin: Tamil Nadu
      clue: Classical dance.
      why: Tamil Nadu.
  lesson:
    - teach: 'India is very diverse. The Eighth Schedule of the Constitution lists 22 languages, and hundreds more are spoken. People follow many religions and eat many kinds of food: rice is the main grain in the south and east, wheat in the north.'
      check:
        prompt: How many languages are listed in the Eighth Schedule?
        options:
        - '22'
        - '2'
        - '100'
        answer: '22'
        why: The Eighth Schedule lists 22 languages.
    - teach: Clothes and arts differ too. The saree is draped in many regional styles; men wear the dhoti or mundu; Assam has the mekhela chador. Dance forms include Kathakali (Kerala), Bharatanatyam (Tamil Nadu), Bihu (Assam) and Garba (Gujarat).
      picture:
        kind: compare
        columns:
        - title: Dance
          points:
          - 'Kathakali: Kerala'
          - 'Bharatanatyam: Tamil Nadu'
          - 'Garba: Gujarat'
        - title: Dress
          points:
          - 'mekhela chador: Assam'
          - 'mundu: Kerala'
          - 'saree: many drapes'
        - title: Food
          points:
          - 'idli: south'
          - 'dhokla: Gujarat'
          - 'litti: Bihar'
        alt: Different regions have their own dances, dresses and foods.
      check:
        prompt: 'Garba is a folk dance of:'
        options:
        - Gujarat
        - Kerala
        - Assam
        answer: Gujarat
        why: Garba is danced in Gujarat, especially at Navratri.
    - teach: Why so much variety? India has mountains, deserts, coasts, plains and forests, with different climates. Crops, clothes, homes and customs grow to suit each place, and each region has its own history.
      check:
        prompt: Why is coconut used a lot in Kerala cooking?
        options:
        - Coconut palms grow well in Kerala's coastal climate
        - It is not grown there
        - Coconuts are banned elsewhere
        answer: Coconut palms grow well in Kerala's coastal climate
        why: People cook with what grows around them.
  items:
  - prompt: How many languages are listed in the Eighth Schedule of the Constitution?
    answer: '22'
    check: '22'
    difficulty: 1
    hints:
    - More than 20.
    - Official schedule.
    solution: 22 languages.
    mistakes: {"18": "s6_eighth_schedule", "28": "s6_eighth_schedule"}
  - prompt: 'Kathakali is a dance form of:'
    options:
    - Kerala
    - Punjab
    - Assam
    - Gujarat
    answer: Kerala
    difficulty: 1
    hints:
    - Painted faces.
    - Our state.
    solution: Kathakali comes from Kerala.
    mistakes: {"Punjab": "s6_kathakali", "Assam": "s6_kathakali"}
  - prompt: 'Bihu is celebrated mainly in:'
    options:
    - Assam
    - Kerala
    - Rajasthan
    - Tamil Nadu
    answer: Assam
    difficulty: 1
    hints:
    - North-east.
    - Harvest festival.
    solution: Bihu is from Assam.
    mistakes: {"Rajasthan": "s6_bihu", "Kerala": "s6_bihu"}
  - prompt: Why do foods differ across India?
    options:
    - Different crops grow in different climates
    - People dislike each other
    - Food is chosen by law
    - There is no reason
    answer: Different crops grow in different climates
    difficulty: 2
    hints:
    - Rice needs lots of water.
    - Wheat grows in drier north.
    solution: Climate decides which crops grow, shaping food.
    mistakes: {"Food is chosen by law": "s6_food_climate"}
  - prompt: '''Diversity'' means:'
    options:
    - variety and differences
    - everyone being the same
    - fighting
    - one language only
    answer: variety and differences
    difficulty: 1
    hints:
    - Many kinds.
    - Different.
    solution: Diversity means variety.
    mistakes:
      everyone being the same: c6ss_diversity
  - prompt: 'Mekhela chador is a traditional dress of:'
    options:
    - Assam
    - Kerala
    - Punjab
    - Goa
    answer: Assam
    difficulty: 2
    hints:
    - Two-piece dress.
    - North-east.
    solution: Mekhela chador is worn in Assam.
    mistakes: {"Goa": "s6_mekhela", "Kerala": "s6_mekhela"}
  - prompt: 'Bharatanatyam is a classical dance from:'
    options:
    - Tamil Nadu
    - Punjab
    - Assam
    answer: Tamil Nadu
    difficulty: 1
    hints:
    - It is a South Indian dance.
    - Its home state's capital is Chennai.
    solution: 'Step 1: Bharatanatyam developed in temples of the south. Step 2: its home is Tamil Nadu.'
    mistakes:
      Punjab: c6ss8_region
      Assam: c6ss8_region
  - prompt: 'Litti chokha is a well-known dish of:'
    options:
    - Bihar
    - Kerala
    - Gujarat
    answer: Bihar
    difficulty: 2
    hints:
    - It is made of wheat and sattu.
    - A state in the east on the Ganga plain.
    solution: 'Step 1: litti is a baked wheat ball with sattu. Step 2: it is famous in Bihar.'
    mistakes:
      Kerala: c6ss8_region
      Gujarat: c6ss8_region
  - prompt: 'Dhokla, a steamed snack, comes from:'
    options:
    - Gujarat
    - Assam
    - Tamil Nadu
    answer: Gujarat
    difficulty: 1
    hints:
    - It is made from gram flour.
    - A western state.
    solution: 'Step 1: dhokla is a gram-flour snack. Step 2: it is from Gujarat.'
    mistakes:
      Assam: c6ss8_region
      Tamil Nadu: c6ss8_region
  - prompt: Why is wheat the main grain in Punjab but rice in West Bengal?
    options:
    - Their climates and rainfall suit different crops
    - It is a law
    - People there are told by others
    answer: Their climates and rainfall suit different crops
    difficulty: 2
    hints:
    - Rice needs lots of water.
    - Wheat likes cooler, drier winters.
    solution: 'Step 1: West Bengal gets heavy rain, good for rice. Step 2: Punjab''s cooler, drier winter suits wheat.'
    mistakes:
      It is a law: c6ss8_why
      People there are told by others: c6ss8_why
  - prompt: Which statement about the saree is true?
    options:
    - It is draped in many different styles across India
    - It is worn only in one state
    - It must always be white
    answer: It is draped in many different styles across India
    difficulty: 1
    hints:
    - Think of Bengali, Maharashtrian and Kerala styles.
    - Same garment, different drapes.
    solution: 'Step 1: the saree is worn across India. Step 2: each region has its own way of draping it.'
    mistakes:
      It is worn only in one state: c6ss8_region
      It must always be white: c6ss8_region
  - prompt: Which pair is correctly matched?
    options:
    - 'Bihu: Assam'
    - 'Kathakali: Punjab'
    - 'Garba: Kerala'
    answer: 'Bihu: Assam'
    difficulty: 2
    hints:
    - Check each dance with its home state.
    - Kathakali and Garba are wrongly placed.
    solution: 'Step 1: Kathakali is from Kerala and Garba from Gujarat. Step 2: Bihu: Assam is correct.'
    mistakes:
      'Kathakali: Punjab': c6ss8_region
      'Garba: Kerala': c6ss8_region
  - prompt: Malayalam is the main language of which state?
    options:
    - Kerala
    - Odisha
    - Rajasthan
    answer: Kerala
    difficulty: 1
    hints:
    - It is in the far south-west.
    - Its capital is Thiruvananthapuram.
    solution: 'Step 1: Malayalam is spoken in the south-west. Step 2: it is the language of Kerala.'
    mistakes:
      Odisha: c6ss8_region
      Rajasthan: c6ss8_region
  - prompt: Why are houses in Kerala often built with steep sloping roofs?
    options:
    - Heavy monsoon rain runs off quickly
    - To store snow
    - To catch sand
    answer: Heavy monsoon rain runs off quickly
    difficulty: 3
    hints:
    - Kerala gets very heavy rain.
    - Water must not collect on the roof.
    solution: 'Step 1: Kerala has heavy monsoons. Step 2: steep roofs let rainwater drain fast.'
    mistakes:
      To store snow: c6ss8_why
      To catch sand: c6ss8_why
  - prompt: Hundreds of languages are spoken in India, but how many are in the Eighth Schedule?
    answer: '22'
    check: '22'
    difficulty: 2
    hints:
    - It is a little more than twenty.
    - It includes Malayalam, Hindi, Tamil and others.
    solution: 'Step 1: the Eighth Schedule officially lists major languages. Step 2: there are 22 of them.'
    mistakes:
      '18': c6ss8_count
      '28': c6ss8_count
- code: cbse6ss.unity.one
  title: What unites us
  after:
  - cbse6ss.unity.diverse
  notes: |
    Many threads unite India: shared stories (Ramayana and Mahabharata retold in many languages: Kamba Ramayanam in Tamil,
    Adhyatma Ramayanam Kilippattu by Ezhuthachan in Malayalam, Ramcharitmanas by Tulsidas in Hindi), festivals celebrated
    in many forms (harvest festivals: Onam, Pongal, Bihu, Lohri, Makar Sankranti), shared values (respect for elders,
    hospitality, 'Vasudhaiva Kutumbakam': the world is one family), the national symbols and the Constitution. The saree:
    one garment, many drapes. 'Many in the one'.
  explanations:
    text: 'Though we are diverse, many things join us. The Ramayana is told in Malayalam, Tamil, Hindi and many other languages. Harvest festivals are celebrated everywhere under different names: Onam, Pongal, Bihu, Lohri. We share values like respecting elders and welcoming guests. This is unity in diversity.'
    visual: 'Draw one big circle labelled ''Harvest festival''. Around it, smaller circles: Onam (Kerala), Pongal (Tamil Nadu), Bihu (Assam), Lohri (Punjab), Makar Sankranti (many states).'
    step_by_step: 'Step 1: Find something that looks different across regions. Step 2: Look for the shared idea underneath. Step 3: Name the common thread.'
    real_world: 'During Onam in Kerala and Pongal in Tamil Nadu, families thank nature for the harvest: different names, the same spirit.'
  picture:
    kind: compare
    columns:
    - title: Harvest festival
      points:
      - Onam
      - Pongal
      - Bihu
      - Lohri
    - title: State
      points:
      - Kerala
      - Tamil Nadu
      - Assam
      - Punjab
    alt: 'Harvest festivals across India: Onam in Kerala, Pongal in Tamil Nadu, Bihu in Assam and Lohri in Punjab.'
  activity:
    type: sort
    prompt: Which harvest festival, where?
    bins:
    - Onam (Kerala)
    - Pongal (Tamil Nadu)
    - Bihu (Assam)
    - Lohri (Punjab)
    items:
    - label: Pookalam and sadya
      bin: Onam (Kerala)
      clue: Flower carpet and feast.
      why: Onam.
    - label: Rice boiled until it spills over
      bin: Pongal (Tamil Nadu)
      clue: Cooked in a new pot.
      why: Pongal.
    - label: Dancing and new crops in spring, Assam
      bin: Bihu (Assam)
      clue: North-east.
      why: Bihu.
    - label: Bonfire in January in the north
      bin: Lohri (Punjab)
      clue: Winter festival.
      why: Lohri.
  lesson:
    - teach: 'Many threads tie India together. The Ramayana and Mahabharata are retold in many languages: Kamban wrote the Kamba Ramayanam in Tamil, Ezhuthachan the Adhyatma Ramayanam Kilippattu in Malayalam, and Tulsidas the Ramcharitmanas in Hindi (Awadhi).'
      picture:
        kind: compare
        columns:
        - title: Tamil
          points:
          - Kamban
          - Kamba Ramayanam
        - title: Malayalam
          points:
          - Ezhuthachan
          - Adhyatma Ramayanam Kilippattu
        - title: Hindi (Awadhi)
          points:
          - Tulsidas
          - Ramcharitmanas
        alt: The Ramayana was retold by Kamban in Tamil, Ezhuthachan in Malayalam and Tulsidas in Awadhi Hindi.
      check:
        prompt: Who retold the Ramayana in Tamil?
        options:
        - Kamban
        - Tulsidas
        - Ezhuthachan
        answer: Kamban
        why: The Kamba Ramayanam is by Kamban.
    - teach: 'Festivals also unite us. Harvest is celebrated everywhere under different names: Onam in Kerala, Pongal in Tamil Nadu, Bihu in Assam, Lohri in Punjab, Makar Sankranti in many states. Different names, the same joy of the harvest.'
      check:
        prompt: 'Pongal is the harvest festival of:'
        options:
        - Tamil Nadu
        - Punjab
        - Assam
        answer: Tamil Nadu
        why: Pongal is celebrated in Tamil Nadu in January.
    - teach: 'Shared values unite us: respect for elders, welcoming guests, and ''Vasudhaiva Kutumbakam'', the world is one family. The national flag, anthem and the Constitution give all Indians the same rights. This is ''many in the one'': unity with diversity.'
      check:
        prompt: Which gives every Indian the same rights?
        options:
        - The Constitution
        - A single festival
        - One language
        answer: The Constitution
        why: The Constitution applies equally to all citizens.
  items:
  - prompt: 'Onam, Pongal, Bihu and Lohri are all:'
    options:
    - harvest festivals
    - sports events
    - new-year speeches
    - river names
    answer: harvest festivals
    difficulty: 1
    hints:
    - They celebrate crops.
    - Thanking nature.
    solution: All are harvest festivals.
    mistakes: {"new-year speeches": "s6_harvest"}
  - prompt: 'Ezhuthachan wrote a famous Ramayana in:'
    options:
    - Malayalam
    - Tamil
    - Hindi
    - Bengali
    answer: Malayalam
    difficulty: 2
    hints:
    - "Think of the language spoken in Kerala, where he lived."
    - Kilippattu.
    solution: Ezhuthachan's Adhyatma Ramayanam is in Malayalam.
    mistakes: {"Tamil": "s6_ezhuthachan"}
  - prompt: 'Tulsidas wrote the Ramcharitmanas in:'
    options:
    - Hindi (Awadhi)
    - Tamil
    - Malayalam
    - Sanskrit only
    answer: Hindi (Awadhi)
    difficulty: 2
    hints:
    - North India.
    - Awadhi dialect.
    solution: Ramcharitmanas is in Awadhi Hindi.
    mistakes: {"Sanskrit only": "s6_tulsidas"}
  - prompt: '''Vasudhaiva Kutumbakam'' means:'
    options:
    - the world is one family
    - my family only
    - be rich
    - obey the king
    answer: the world is one family
    difficulty: 1
    hints:
    - Vasudha = earth.
    - Kutumba = family.
    solution: It means the whole world is one family.
    mistakes: {"my family only": "s6_vasudhaiva"}
  - prompt: Which is an example of 'many in the one'?
    options:
    - The saree, draped in many regional styles
    - Everyone speaking one language
    - One food for all
    - One festival only
    answer: The saree, draped in many regional styles
    difficulty: 2
    hints:
    - One thing, many forms.
    - Different drapes.
    solution: One garment worn in many styles shows many in the one.
    mistakes: {"Everyone speaking one language": "s6_many_in_one"}
  - prompt: Which document unites all Indians with the same rights?
    options:
    - The Constitution
    - A cookbook
    - A train timetable
    - A newspaper
    answer: The Constitution
    difficulty: 1
    hints:
    - The highest law.
    - '1950.'
    solution: The Constitution gives every citizen the same rights.
    mistakes: {"A newspaper": "s6_constitution"}
  - prompt: 'Onam is celebrated mainly in:'
    options:
    - Kerala
    - Punjab
    - Assam
    answer: Kerala
    difficulty: 1
    hints:
    - It is a harvest festival with pookalam.
    - A Malayalam-speaking state.
    solution: 'Step 1: Onam has flower carpets and a big feast. Step 2: it is Kerala''s festival.'
    mistakes:
      Punjab: c6ss8_region
      Assam: c6ss8_region
  - prompt: 'Lohri is a harvest festival of:'
    options:
    - Punjab
    - Tamil Nadu
    - Kerala
    answer: Punjab
    difficulty: 1
    hints:
    - It has a bonfire in mid-January.
    - A northern state.
    solution: 'Step 1: Lohri is a winter bonfire festival. Step 2: it is celebrated in Punjab.'
    mistakes:
      Tamil Nadu: c6ss8_region
      Kerala: c6ss8_region
  - prompt: What do Onam, Pongal, Lohri and Bihu have in common?
    options:
    - They celebrate the harvest
    - They are all in the same state
    - They are all in one language
    answer: They celebrate the harvest
    difficulty: 2
    hints:
    - They are in different states.
    - Farmers celebrate them.
    solution: 'Step 1: each is in a different region. Step 2: all of them celebrate the harvest.'
    mistakes:
      They are all in the same state: c6ss8_bond
      They are all in one language: c6ss8_bond
  - prompt: 'The Ramcharitmanas was written in:'
    options:
    - Awadhi (Hindi)
    - Tamil
    - Malayalam
    answer: Awadhi (Hindi)
    difficulty: 2
    hints:
    - It was written by Tulsidas.
    - A northern language.
    solution: 'Step 1: Tulsidas wrote it. Step 2: it is in Awadhi, a form of Hindi.'
    mistakes:
      Tamil: c6ss8_story
      Malayalam: c6ss8_story
  - prompt: 'Kamba Ramayanam is a retelling of the Ramayana in:'
    options:
    - Tamil
    - Hindi
    - Bengali
    answer: Tamil
    difficulty: 1
    hints:
    - Written by Kamban.
    - A southern language.
    solution: 'Step 1: Kamban was a Tamil poet. Step 2: so the Kamba Ramayanam is in Tamil.'
    mistakes:
      Hindi: c6ss8_story
      Bengali: c6ss8_story
  - prompt: Why are the same epics retold in so many languages?
    options:
    - People everywhere loved them and told them in their own tongue
    - Only one copy existed
    - It was a rule
    answer: People everywhere loved them and told them in their own tongue
    difficulty: 2
    hints:
    - Great stories spread.
    - Each poet added local colour.
    solution: 'Step 1: the epics were loved across the land. Step 2: poets retold them in each language, linking regions.'
    mistakes:
      Only one copy existed: c6ss8_story
      It was a rule: c6ss8_story
  - prompt: 'Welcoming a guest as God (''Atithi Devo Bhava'') is an example of:'
    options:
    - A shared value
    - A dance form
    - A harvest crop
    answer: A shared value
    difficulty: 1
    hints:
    - It is a way of behaving.
    - Found across many regions.
    solution: 'Step 1: honouring guests is a belief about how to act. Step 2: it is a value shared across India.'
    mistakes:
      A dance form: c6ss8_bond
      A harvest crop: c6ss8_bond
  - prompt: Which national symbol is sung, not seen?
    options:
    - The national anthem
    - The national flag
    - The national emblem
    answer: The national anthem
    difficulty: 2
    hints:
    - It is a song.
    - '''Jana Gana Mana''.'
    solution: 'Step 1: the flag and emblem are seen. Step 2: the anthem, Jana Gana Mana, is sung.'
    mistakes:
      The national flag: c6ss8_bond
      The national emblem: c6ss8_bond
  - prompt: What does 'unity in diversity' mean?
    options:
    - Being one nation while keeping many different ways of life
    - Everyone must be the same
    - Differences divide us
    answer: Being one nation while keeping many different ways of life
    difficulty: 3
    hints:
    - 'Unity: together. Diversity: different.'
    - Both at once.
    solution: 'Step 1: diversity means many languages, foods and customs. Step 2: unity means we stay one nation with all of them.'
    mistakes:
      Everyone must be the same: c6ss8_bond
      Differences divide us: c6ss8_bond
