concepts:
- code: cbse6ss.roots.vedas
  title: The Vedas and Upanishads
  notes: |
    India's cultural roots are like a tree's roots with many branches. The Vedas: four collections (Rigveda, oldest, hymns;
    Samaveda, melodies; Yajurveda, rituals; Atharvaveda, daily life and healing), in Vedic Sanskrit, passed down orally
    for centuries with great accuracy. Rigveda hymns praise nature (Agni, Indra, Ushas) and value truth and harmony. The
    Upanishads: deep questions about the self and the universe ("Who am I?"; idea of Brahman and atman; "Tat tvam asi").
    Ideas: many paths to truth, dialogue and debate.
  explanations:
    text: 'The Vedas are among the oldest texts in the world. There are four: Rig, Sama, Yajur and Atharva. For centuries they were passed down by memory, very carefully. Later, the Upanishads asked big questions like ''Who am I?'' and ''What is the universe?''.'
    visual: Picture a big tree. Its deep roots are labelled Vedas and Upanishads; its branches spread out into many schools of thought, festivals and arts.
    step_by_step: 'Step 1: Name the four Vedas. Step 2: Note which is oldest: Rigveda. Step 3: Note how they were kept: orally. Step 4: See what the Upanishads asked about.'
    real_world: Students in some traditional schools still learn to chant Vedic hymns from memory, as children did thousands of years ago.
  picture:
    kind: compare
    columns:
    - title: Veda
      points:
      - Rigveda
      - Samaveda
      - Yajurveda
      - Atharvaveda
    - title: Mainly about
      points:
      - hymns
      - melodies
      - rituals
      - daily life, healing
    alt: The Rigveda has hymns, the Samaveda melodies, the Yajurveda rituals and the Atharvaveda daily life and healing.
  activity:
    type: sort
    prompt: Which Veda?
    bins:
    - Rigveda
    - Samaveda
    - Yajurveda
    - Atharvaveda
    items:
    - label: 'The oldest: hymns to Agni and Indra'
      bin: Rigveda
      clue: Oldest.
      why: Rigveda.
    - label: Melodies for singing
      bin: Samaveda
      clue: Music.
      why: Samaveda.
    - label: Rituals
      bin: Yajurveda
      clue: How to perform them.
      why: Yajurveda.
    - label: Daily life and healing
      bin: Atharvaveda
      clue: Medicine and charms.
      why: Atharvaveda.
  items:
  - prompt: How many Vedas are there?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Rig, Sama, Yajur, ...
    - Count.
    solution: There are four Vedas.
    mistakes: {"3": "s6_four_vedas", "18": "s6_four_vedas"}
  - prompt: Which is the oldest Veda?
    options:
    - Rigveda
    - Samaveda
    - Yajurveda
    - Atharvaveda
    answer: Rigveda
    difficulty: 1
    hints:
    - Hymns.
    - First of the four.
    solution: The Rigveda is the oldest.
    mistakes:
      Atharvaveda: c6ss_vedas
  - prompt: 'For a long time the Vedas were passed on:'
    options:
    - orally, by memory
    - only in books
    - on computers
    - on coins
    answer: orally, by memory
    difficulty: 1
    hints:
    - Teachers to students.
    - Chanting.
    solution: They were memorised and recited.
    mistakes: {"only in books": "s6_oral_vedas"}
  - prompt: 'The Upanishads mainly ask questions about:'
    options:
    - the self and the universe
    - farming methods
    - building roads
    - trade prices
    answer: the self and the universe
    difficulty: 2
    hints:
    - '''Who am I?'''
    - Deep thinking.
    solution: They explore the self and the universe.
    mistakes: {"farming methods": "s6_upanishads"}
  - prompt: 'The language of the Vedas is:'
    options:
    - Vedic Sanskrit
    - English
    - Persian
    - Tamil
    answer: Vedic Sanskrit
    difficulty: 1
    hints:
    - An ancient form.
    - Sanskrit.
    solution: They are in Vedic Sanskrit.
    mistakes: {"Tamil": "s6_vedic_sanskrit", "Persian": "s6_vedic_sanskrit"}
  - prompt: Which Veda is mainly about melodies for chanting?
    options:
    - Samaveda
    - Rigveda
    - Atharvaveda
    - Yajurveda
    answer: Samaveda
    difficulty: 2
    hints:
    - '''Saman'' means song.'
    - Music.
    solution: The Samaveda is about melodies.
    mistakes: {"Rigveda": "s6_samaveda"}
- code: cbse6ss.roots.paths
  title: Buddhism, Jainism and folk traditions
  after:
  - cbse6ss.roots.vedas
  notes: |
    Around the 6th–5th century BCE, new teachers appeared. Gautama Buddha (born at Lumbini; enlightenment at Bodh Gaya):
    life has suffering; it comes from desire; the Middle Path (neither luxury nor harsh self-denial) and the Eightfold Path
    lead to freedom; compassion. Vardhamana Mahavira (24th Tirthankara of Jainism): ahimsa (non-violence to all living
    beings), truth, non-possession, anekantavada (truth has many sides). Folk and tribal traditions: nature worship, sacred
    groves, respect for all life. All shared values: kindness, self-control, respect.
  explanations:
    text: 'About 2,500 years ago, the Buddha taught the Middle Path: avoid both too much comfort and too much hardship, and be kind. Mahavira taught ahimsa, not harming any living being. Folk and tribal communities honoured nature. These roots share values like compassion and respect.'
    visual: 'Picture three branches from the same roots: the Buddha under a bodhi tree, Mahavira walking carefully so as not to harm insects, and a village sacred grove.'
    step_by_step: 'Step 1: Name the teacher. Step 2: Name the key teaching. Step 3: Note the shared value: kindness, self-control, respect for life.'
    real_world: Bodh Gaya in Bihar, where the Buddha gained enlightenment, is visited by pilgrims from across Asia.
  picture:
    kind: compare
    columns:
    - title: Buddha
      points:
      - Middle Path
      - end of suffering
      - compassion
    - title: Mahavira
      points:
      - ahimsa
      - truth
      - many-sided truth
    alt: The Buddha taught the Middle Path and compassion; Mahavira taught ahimsa, truth and that truth has many sides.
  activity:
    type: sort
    prompt: Buddha, Mahavira, or both?
    bins:
    - Buddha
    - Mahavira
    - Both
    items:
    - label: The Middle Path
      bin: Buddha
      clue: Neither luxury nor harsh denial.
      why: Buddha.
    - label: Enlightenment at Bodh Gaya
      bin: Buddha
      clue: Under a tree.
      why: Buddha.
    - label: 24th Tirthankara
      bin: Mahavira
      clue: Jainism.
      why: Mahavira.
    - label: 'Anekantavada: truth has many sides'
      bin: Mahavira
      clue: Jain idea.
      why: Mahavira.
    - label: Kindness and self-control
      bin: Both
      clue: Shared values.
      why: Both.
  items:
  - prompt: Where did the Buddha gain enlightenment?
    options:
    - Bodh Gaya
    - Lumbini
    - Kashi
    - Mathura
    answer: Bodh Gaya
    difficulty: 1
    hints:
    - Under the bodhi tree.
    - Bihar.
    solution: He gained enlightenment at Bodh Gaya.
    mistakes: {"Lumbini": "s6_bodh_gaya"}
  - prompt: 'The Buddha''s ''Middle Path'' means:'
    options:
    - avoiding both luxury and harsh hardship
    - walking in the middle of the road
    - being in the middle of a crowd
    - eating only once
    answer: avoiding both luxury and harsh hardship
    difficulty: 1
    hints:
    - Balance.
    - Not extremes.
    solution: The Middle Path avoids extremes.
    mistakes: {"walking in the middle of the road": "s6_middle_path"}
  - prompt: '''Ahimsa'' means:'
    options:
    - non-violence to all living beings
    - wealth
    - war
    - fasting only
    answer: non-violence to all living beings
    difficulty: 1
    hints:
    - Mahavira's key teaching.
    - Do not harm.
    solution: Ahimsa is non-violence.
    mistakes: {"fasting only": "s6_ahimsa"}
  - prompt: 'Mahavira was the 24th Tirthankara of:'
    options:
    - Jainism
    - Buddhism
    - Sikhism
    - Islam
    answer: Jainism
    difficulty: 1
    hints:
    - Tirthankaras.
    - Jains.
    solution: Mahavira is the 24th Jain Tirthankara.
    mistakes: {"Buddhism": "s6_jainism"}
  - prompt: '''Anekantavada'' teaches that:'
    options:
    - truth has many sides
    - only one view is right
    - the Earth is flat
    - debate is wrong
    answer: truth has many sides
    difficulty: 2
    hints:
    - Aneka = many.
    - Many viewpoints.
    solution: Anekantavada means truth can be seen from many sides.
    mistakes: {"only one view is right": "s6_anekantavada"}
  - prompt: 'A value shared by the Buddha, Mahavira and folk traditions is:'
    options:
    - respect and compassion for all life
    - love of war
    - greed
    - ignoring nature
    answer: respect and compassion for all life
    difficulty: 2
    hints:
    - What do they all teach?
    - Kindness.
    solution: All value compassion and respect for life.
    mistakes: {"ignoring nature": "s6_shared_value"}
