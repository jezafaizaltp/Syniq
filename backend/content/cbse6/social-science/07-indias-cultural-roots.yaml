# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 7. Format: content/README.md.
subject: cbse6-ss
chapter: 7
title: India's Cultural Roots
tips:
  c6ss_vedas: "The Atharvaveda came last of the four. Which one was composed first, with hymns praising Agni and Indra?"
  s6_ahimsa: "'Himsa' means harm and 'a-' means not."
  s6_anekantavada: "'Aneka' means many."
  s6_bodh_gaya: "Lumbini is where he was born. Where did he gain enlightenment?"
  s6_four_vedas: "Rig, Sama, Yajur, Atharva. Count them."
  s6_jainism: "'Tirthankara' is a Jain word."
  s6_middle_path: "The Buddha tried luxury and then extreme hardship. The middle path is between them."
  s6_oral_vedas: "The Vedas were learnt by heart long before writing was common."
  s6_samaveda: "'Sama' means melody or song."
  s6_shared_value: "What did the Buddha and Mahavira both teach about living beings?"
  s6_upanishads: "The Upanishads are philosophy. What big questions do they ask?"
  s6_vedic_sanskrit: "The Vedas are very old Indian texts, in an early form of a classical language."
  c6ss7_veda: 'Recall what each of the four Vedas mainly holds: hymns, melodies, ritual instructions, or everyday life and healing.'
  c6ss7_oral: Think about how knowledge was kept for centuries before it was written down.
  c6ss7_upa: The later texts ask big questions about who we are and what the world is.
  c6ss7_buddha: 'Recall the places of the Enlightened One''s life, when he lived, and the heart of his teaching.'
  c6ss7_jain: 'Recall the main Jain values: non-violence, truth, owning little, and seeing many sides.'
  c6ss7_shared: Look for the value that all these traditions agree on.
concepts:
- code: cbse6ss.roots.vedas
  title: The Vedas and Upanishads
  notes: |
    India's cultural roots are like a tree's roots with many branches. The Vedas: four collections (Rigveda, oldest, hymns;
    Samaveda, melodies; Yajurveda, rituals; Atharvaveda, daily life and healing), in Vedic Sanskrit, passed down orally
    for centuries with great accuracy. Rigveda hymns praise nature (Agni, Indra, Ushas) and value truth and harmony. The
    Upanishads: deep questions about the self and the universe ("Who am I?"; idea of Brahman and atman; "Tat tvam asi").
    Ideas: many paths to truth, dialogue and debate.
  explanations:
    text: 'The Vedas are among the oldest texts in the world. There are four: Rig, Sama, Yajur and Atharva. For centuries they were passed down by memory, very carefully. Later, the Upanishads asked big questions like ''Who am I?'' and ''What is the universe?''.'
    visual: Picture a big tree. Its deep roots are labelled Vedas and Upanishads; its branches spread out into many schools of thought, festivals and arts.
    step_by_step: 'Step 1: Name the four Vedas. Step 2: Note which is oldest: Rigveda. Step 3: Note how they were kept: orally. Step 4: See what the Upanishads asked about.'
    real_world: Students in some traditional schools still learn to chant Vedic hymns from memory, as children did thousands of years ago.
  picture:
    kind: compare
    columns:
    - title: Veda
      points:
      - Rigveda
      - Samaveda
      - Yajurveda
      - Atharvaveda
    - title: Mainly about
      points:
      - hymns
      - melodies
      - rituals
      - daily life, healing
    alt: The Rigveda has hymns, the Samaveda melodies, the Yajurveda rituals and the Atharvaveda daily life and healing.
  activity:
    type: sort
    prompt: Which Veda?
    bins:
    - Rigveda
    - Samaveda
    - Yajurveda
    - Atharvaveda
    items:
    - label: 'The oldest: hymns to Agni and Indra'
      bin: Rigveda
      clue: Oldest.
      why: Rigveda.
    - label: Melodies for singing
      bin: Samaveda
      clue: Music.
      why: Samaveda.
    - label: Rituals
      bin: Yajurveda
      clue: How to perform them.
      why: Yajurveda.
    - label: Daily life and healing
      bin: Atharvaveda
      clue: Medicine and charms.
      why: Atharvaveda.
  lesson:
    - teach: 'India''s cultural roots are like the roots of a big tree with many branches. Among the oldest roots are the Vedas, four collections composed in Vedic Sanskrit: the Rigveda (hymns, the oldest), the Samaveda (melodies), the Yajurveda (rituals) and the Atharvaveda (daily life and healing).'
      picture:
        kind: compare
        columns:
        - title: Rigveda
          points:
          - hymns
          - oldest
        - title: Samaveda and Yajurveda
          points:
          - melodies
          - rituals
        - title: Atharvaveda
          points:
          - daily life
          - healing
        alt: 'The four Vedas: Rigveda of hymns, Samaveda of melodies, Yajurveda of rituals, Atharvaveda of daily life and healing.'
      check:
        prompt: Which Veda has instructions for rituals?
        options:
        - Yajurveda
        - Samaveda
        - Rigveda
        answer: Yajurveda
        why: The Yajurveda deals with how rituals are performed.
    - teach: For centuries the Vedas were not written down. Students learnt them by heart from teachers, using clever methods of chanting so not a syllable changed. UNESCO recognises this Vedic chanting tradition as world heritage.
      check:
        prompt: How were the Vedas kept accurate for so long without writing?
        options:
        - Careful memorising and chanting methods
        - Printing presses
        - Carving on every wall
        answer: Careful memorising and chanting methods
        why: They were passed on orally with great care.
    - teach: 'Rigveda hymns praise forces of nature like Agni (fire), Indra and Ushas (dawn), and value truth and harmony. Later, the Upanishads asked deep questions: ''Who am I?'', ''What is the world made of?''. They taught through dialogue and debate, and accepted many paths to truth.'
      check:
        prompt: 'The Upanishads are best known for:'
        options:
        - Deep questions about the self and the universe
        - Rules of cricket
        - Lists of kings
        answer: Deep questions about the self and the universe
        why: They explore ideas like atman (self) and Brahman.
  items:
  - prompt: How many Vedas are there?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Rig, Sama, Yajur, ...
    - Count.
    solution: There are four Vedas.
    mistakes: {"3": "s6_four_vedas", "18": "s6_four_vedas"}
  - prompt: Which is the oldest Veda?
    options:
    - Rigveda
    - Samaveda
    - Yajurveda
    - Atharvaveda
    answer: Rigveda
    difficulty: 1
    hints:
    - Hymns.
    - First of the four.
    solution: The Rigveda is the oldest.
    mistakes:
      Atharvaveda: c6ss_vedas
  - prompt: 'For a long time the Vedas were passed on:'
    options:
    - orally, by memory
    - only in books
    - on computers
    - on coins
    answer: orally, by memory
    difficulty: 1
    hints:
    - Teachers to students.
    - Chanting.
    solution: They were memorised and recited.
    mistakes: {"only in books": "s6_oral_vedas"}
  - prompt: 'The Upanishads mainly ask questions about:'
    options:
    - the self and the universe
    - farming methods
    - building roads
    - trade prices
    answer: the self and the universe
    difficulty: 2
    hints:
    - '''Who am I?'''
    - Deep thinking.
    solution: They explore the self and the universe.
    mistakes: {"farming methods": "s6_upanishads"}
  - prompt: 'The language of the Vedas is:'
    options:
    - Vedic Sanskrit
    - English
    - Persian
    - Tamil
    answer: Vedic Sanskrit
    difficulty: 1
    hints:
    - An ancient form.
    - Sanskrit.
    solution: They are in Vedic Sanskrit.
    mistakes: {"Tamil": "s6_vedic_sanskrit", "Persian": "s6_vedic_sanskrit"}
  - prompt: Which Veda is mainly about melodies for chanting?
    options:
    - Samaveda
    - Rigveda
    - Atharvaveda
    - Yajurveda
    answer: Samaveda
    difficulty: 2
    hints:
    - '''Saman'' means song.'
    - Music.
    solution: The Samaveda is about melodies.
    mistakes: {"Rigveda": "s6_samaveda"}
  - prompt: 'Ushas, praised in the Rigveda, is the goddess of:'
    options:
    - Dawn
    - War
    - Rain only
    answer: Dawn
    difficulty: 2
    hints:
    - Rigveda hymns praise nature.
    - She appears each morning.
    solution: 'Step 1: Rigveda hymns praise natural forces. Step 2: Ushas is the dawn.'
    mistakes:
      War: c6ss7_veda
      Rain only: c6ss7_veda
  - prompt: 'Agni in the Vedas stands for:'
    options:
    - Fire
    - Water
    - The Moon
    answer: Fire
    difficulty: 1
    hints:
    - Agni is still the Hindi word for it.
    - It burns.
    solution: 'Step 1: Agni is a nature force in the Vedas. Step 2: it means fire.'
    mistakes:
      Water: c6ss7_veda
      The Moon: c6ss7_veda
  - prompt: Which Veda deals with daily life and healing?
    options:
    - Atharvaveda
    - Samaveda
    - Yajurveda
    answer: Atharvaveda
    difficulty: 2
    hints:
    - It is the fourth Veda.
    - It includes remedies.
    solution: 'Step 1: Samaveda is melodies, Yajurveda rituals. Step 2: the Atharvaveda covers daily life and healing.'
    mistakes:
      Samaveda: c6ss7_veda
      Yajurveda: c6ss7_veda
  - prompt: 'The way the Vedas were passed on is an example of:'
    options:
    - Oral tradition
    - Printing
    - Painting
    answer: Oral tradition
    difficulty: 1
    hints:
    - They were spoken and memorised.
    - Not written.
    solution: 'Step 1: teachers chanted, students memorised. Step 2: passing on by speaking is oral tradition.'
    mistakes:
      Printing: c6ss7_oral
      Painting: c6ss7_oral
  - prompt: '''Who am I?'' is a question asked in the:'
    options:
    - Upanishads
    - Harappan seals
    - Persian books
    answer: Upanishads
    difficulty: 1
    hints:
    - It is a question about the self.
    - Later Vedic texts discuss it.
    solution: 'Step 1: the Upanishads explore the self. Step 2: ''Who am I?'' is one of their key questions.'
    mistakes:
      Harappan seals: c6ss7_upa
      Persian books: c6ss7_upa
  - prompt: 'Upanishad teachers often taught through:'
    options:
    - Dialogue and questions
    - Silent copying
    - Punishment
    answer: Dialogue and questions
    difficulty: 2
    hints:
    - Students sat near the teacher.
    - They asked and discussed.
    solution: 'Step 1: Upanishads are full of conversations. Step 2: learning happened through questions and discussion.'
    mistakes:
      Silent copying: c6ss7_upa
      Punishment: c6ss7_upa
  - prompt: Why are cultural roots compared to the roots of a tree?
    options:
    - They are old, hidden and support many branches of culture
    - They are made of wood
    - They grow underground only
    answer: They are old, hidden and support many branches of culture
    difficulty: 3
    hints:
    - Roots hold up the whole tree.
    - Many branches grow from one root system.
    solution: 'Step 1: roots are old and support everything above. Step 2: early ideas likewise support many later traditions.'
    mistakes:
      They are made of wood: c6ss7_shared
      They grow underground only: c6ss7_shared
  - prompt: How many Vedas are there besides the Rigveda?
    answer: '3'
    check: 4-1
    difficulty: 1
    hints:
    - There are four Vedas in all.
    - Leave out one.
    solution: 'Step 1: there are 4 Vedas. Step 2: 4 − 1 = 3 besides the Rigveda.'
    mistakes:
      '4': c6ss7_veda
      '2': c6ss7_veda
  - prompt: 'The idea that there are ''many paths to truth'' encourages:'
    options:
    - Respect for different views
    - Only one correct belief
    - Ending all discussion
    answer: Respect for different views
    difficulty: 2
    hints:
    - If many paths are valid...
    - '...others'' views deserve respect.'
    solution: 'Step 1: many paths means no single way is the only one. Step 2: so it encourages respecting other views.'
    mistakes:
      Only one correct belief: c6ss7_shared
      Ending all discussion: c6ss7_shared
- code: cbse6ss.roots.paths
  title: Buddhism, Jainism and folk traditions
  after:
  - cbse6ss.roots.vedas
  notes: |
    Around the 6th–5th century BCE, new teachers appeared. Gautama Buddha (born at Lumbini; enlightenment at Bodh Gaya):
    life has suffering; it comes from desire; the Middle Path (neither luxury nor harsh self-denial) and the Eightfold Path
    lead to freedom; compassion. Vardhamana Mahavira (24th Tirthankara of Jainism): ahimsa (non-violence to all living
    beings), truth, non-possession, anekantavada (truth has many sides). Folk and tribal traditions: nature worship, sacred
    groves, respect for all life. All shared values: kindness, self-control, respect.
  explanations:
    text: 'About 2,500 years ago, the Buddha taught the Middle Path: avoid both too much comfort and too much hardship, and be kind. Mahavira taught ahimsa, not harming any living being. Folk and tribal communities honoured nature. These roots share values like compassion and respect.'
    visual: 'Picture three branches from the same roots: the Buddha under a bodhi tree, Mahavira walking carefully so as not to harm insects, and a village sacred grove.'
    step_by_step: 'Step 1: Name the teacher. Step 2: Name the key teaching. Step 3: Note the shared value: kindness, self-control, respect for life.'
    real_world: Bodh Gaya in Bihar, where the Buddha gained enlightenment, is visited by pilgrims from across Asia.
  picture:
    kind: compare
    columns:
    - title: Buddha
      points:
      - Middle Path
      - end of suffering
      - compassion
    - title: Mahavira
      points:
      - ahimsa
      - truth
      - many-sided truth
    alt: The Buddha taught the Middle Path and compassion; Mahavira taught ahimsa, truth and that truth has many sides.
  activity:
    type: sort
    prompt: Buddha, Mahavira, or both?
    bins:
    - Buddha
    - Mahavira
    - Both
    items:
    - label: The Middle Path
      bin: Buddha
      clue: Neither luxury nor harsh denial.
      why: Buddha.
    - label: Enlightenment at Bodh Gaya
      bin: Buddha
      clue: Under a tree.
      why: Buddha.
    - label: 24th Tirthankara
      bin: Mahavira
      clue: Jainism.
      why: Mahavira.
    - label: 'Anekantavada: truth has many sides'
      bin: Mahavira
      clue: Jain idea.
      why: Mahavira.
    - label: Kindness and self-control
      bin: Both
      clue: Shared values.
      why: Both.
  lesson:
    - teach: Around the 6th–5th century BCE, new teachers arose. Gautama Buddha was born at Lumbini and gained enlightenment at Bodh Gaya. He taught that suffering comes from desire, and that the Middle Path and the Eightfold Path lead to freedom. He stressed compassion.
      picture:
        kind: flow
        steps:
        - Born at Lumbini
        - Enlightenment at Bodh Gaya
        - First teaching at Sarnath
        - Taught the Middle Path
        alt: The Buddha was born at Lumbini, became enlightened at Bodh Gaya, first taught at Sarnath and taught the Middle Path.
      check:
        prompt: Where was the Buddha born?
        options:
        - Lumbini
        - Bodh Gaya
        - Kashi
        answer: Lumbini
        why: Lumbini, in today's Nepal, is his birthplace.
    - teach: 'Vardhamana Mahavira was the 24th Tirthankara of Jainism. He taught ahimsa (non-violence to all living beings), truth, non-possession (owning little), and anekantavada: truth has many sides, so listen to others.'
      check:
        prompt: Why do some Jain monks sweep the path before walking?
        options:
        - To avoid hurting tiny creatures (ahimsa)
        - To keep shoes clean
        - For exercise
        answer: To avoid hurting tiny creatures (ahimsa)
        why: Ahimsa means not harming any living being.
    - teach: 'Folk and tribal traditions honoured nature: rivers, hills, trees and sacred groves. Across all these paths, shared values appear: kindness, self-control, truth and respect for all life.'
      check:
        prompt: Which value do the Buddha, Mahavira and folk traditions share?
        options:
        - Respect for all life
        - Love of war
        - Wasting food
        answer: Respect for all life
        why: All three teach care and compassion for living beings.
  items:
  - prompt: Where did the Buddha gain enlightenment?
    options:
    - Bodh Gaya
    - Lumbini
    - Kashi
    - Mathura
    answer: Bodh Gaya
    difficulty: 1
    hints:
    - Under the bodhi tree.
    - Bihar.
    solution: He gained enlightenment at Bodh Gaya.
    mistakes: {"Lumbini": "s6_bodh_gaya"}
  - prompt: 'The Buddha''s ''Middle Path'' means:'
    options:
    - avoiding both luxury and harsh hardship
    - walking in the middle of the road
    - being in the middle of a crowd
    - eating only once
    answer: avoiding both luxury and harsh hardship
    difficulty: 1
    hints:
    - Balance.
    - Not extremes.
    solution: The Middle Path avoids extremes.
    mistakes: {"walking in the middle of the road": "s6_middle_path"}
  - prompt: '''Ahimsa'' means:'
    options:
    - non-violence to all living beings
    - wealth
    - war
    - fasting only
    answer: non-violence to all living beings
    difficulty: 1
    hints:
    - Mahavira's key teaching.
    - Do not harm.
    solution: Ahimsa is non-violence.
    mistakes: {"fasting only": "s6_ahimsa"}
  - prompt: 'Mahavira was the 24th Tirthankara of:'
    options:
    - Jainism
    - Buddhism
    - Sikhism
    - Islam
    answer: Jainism
    difficulty: 1
    hints:
    - Tirthankaras.
    - Jains.
    solution: Mahavira is the 24th Jain Tirthankara.
    mistakes: {"Buddhism": "s6_jainism"}
  - prompt: '''Anekantavada'' teaches that:'
    options:
    - truth has many sides
    - only one view is right
    - the Earth is flat
    - debate is wrong
    answer: truth has many sides
    difficulty: 2
    hints:
    - Aneka = many.
    - Many viewpoints.
    solution: Anekantavada means truth can be seen from many sides.
    mistakes: {"only one view is right": "s6_anekantavada"}
  - prompt: 'A value shared by the Buddha, Mahavira and folk traditions is:'
    options:
    - respect and compassion for all life
    - love of war
    - greed
    - ignoring nature
    answer: respect and compassion for all life
    difficulty: 2
    hints:
    - What do they all teach?
    - Kindness.
    solution: All value compassion and respect for life.
    mistakes: {"ignoring nature": "s6_shared_value"}
  - prompt: Where did the Buddha give his first teaching?
    options:
    - Sarnath
    - Lumbini
    - Rameswaram
    answer: Sarnath
    difficulty: 2
    hints:
    - It is near Varanasi.
    - Not his birthplace.
    solution: 'Step 1: after enlightenment he went towards Varanasi. Step 2: he first taught at Sarnath.'
    mistakes:
      Lumbini: c6ss7_buddha
      Rameswaram: c6ss7_buddha
  - prompt: 'According to the Buddha, suffering mainly comes from:'
    options:
    - Desire and craving
    - Rain
    - Learning
    answer: Desire and craving
    difficulty: 2
    hints:
    - Wanting more and more.
    - It is inside the mind.
    solution: 'Step 1: the Buddha looked at the cause of suffering. Step 2: he found it in desire and craving.'
    mistakes:
      Rain: c6ss7_buddha
      Learning: c6ss7_buddha
  - prompt: 'Owning only what you really need is the Jain value of:'
    options:
    - Non-possession
    - Anekantavada
    - Ritual
    answer: Non-possession
    difficulty: 2
    hints:
    - It is about belongings.
    - Owning little.
    solution: 'Step 1: Jains try to own little. Step 2: this value is non-possession (aparigraha).'
    mistakes:
      Anekantavada: c6ss7_jain
      Ritual: c6ss7_jain
  - prompt: Two friends describe an elephant differently after touching different parts. Which idea does this story show?
    options:
    - 'Anekantavada: truth has many sides'
    - The Middle Path
    - Oral tradition
    answer: 'Anekantavada: truth has many sides'
    difficulty: 3
    hints:
    - Each friend is partly right.
    - No one sees the whole truth alone.
    solution: 'Step 1: each friend knows one part. Step 2: this shows truth has many sides: anekantavada.'
    mistakes:
      The Middle Path: c6ss7_jain
      Oral tradition: c6ss7_jain
  - prompt: 'The Eightfold Path is part of the teaching of:'
    options:
    - The Buddha
    - Mahavira
    - The Harappans
    answer: The Buddha
    difficulty: 1
    hints:
    - It goes with the Middle Path.
    - Taught after enlightenment at Bodh Gaya.
    solution: 'Step 1: the Middle Path and Eightfold Path go together. Step 2: both are the Buddha''s teaching.'
    mistakes:
      Mahavira: c6ss7_buddha
      The Harappans: c6ss7_buddha
  - prompt: 'A Tirthankara in Jainism is a:'
    options:
    - Great teacher who shows the way across the river of life
    - King
    - Trader
    answer: Great teacher who shows the way across the river of life
    difficulty: 2
    hints:
    - Tirtha means a crossing place.
    - Mahavira was the 24th.
    solution: 'Step 1: ''tirtha'' means a ford or crossing. Step 2: a Tirthankara is a teacher who shows the crossing to freedom.'
    mistakes:
      King: c6ss7_jain
      Trader: c6ss7_jain
  - prompt: 'Sacred groves and worship of hills and rivers belong mostly to:'
    options:
    - Folk and tribal traditions
    - Harappan seals
    - The Greeks
    answer: Folk and tribal traditions
    difficulty: 1
    hints:
    - Local communities honour nature.
    - Think of kavu in Kerala.
    solution: 'Step 1: local communities protect groves and honour hills. Step 2: these are folk and tribal traditions.'
    mistakes:
      Harappan seals: c6ss7_shared
      The Greeks: c6ss7_shared
  - prompt: About when did the Buddha and Mahavira live?
    options:
    - 6th–5th century BCE
    - 20th century CE
    - 2600 BCE
    answer: 6th–5th century BCE
    difficulty: 2
    hints:
    - After the Harappan cities.
    - About 2,500 years ago.
    solution: 'Step 1: they lived about 2,500 years ago. Step 2: that is the 6th–5th century BCE.'
    mistakes:
      20th century CE: c6ss7_buddha
      2600 BCE: c6ss7_buddha
  - prompt: Which practice follows the Buddha's Middle Path?
    options:
    - Eating enough, but not too much
    - Starving for weeks
    - Feasting all day
    answer: Eating enough, but not too much
    difficulty: 2
    hints:
    - Middle means between two extremes.
    - Not too much, not too little.
    solution: 'Step 1: the Middle Path avoids both extremes. Step 2: eating enough but not too much is the middle way.'
    mistakes:
      Starving for weeks: c6ss7_buddha
      Feasting all day: c6ss7_buddha
