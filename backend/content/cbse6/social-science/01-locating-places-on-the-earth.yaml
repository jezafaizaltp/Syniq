# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 1. Format: content/README.md.
subject: cbse6-ss
chapter: 1
title: Locating Places on the Earth
tips:
  c6ss_lat_long: Latitudes run east–west and measure north–south position from the Equator. Longitudes run pole to pole and measure east–west position from the Prime Meridian.
  c6ss_time: "The Earth turns a full 360° in 24 hours. Divide to find how far it turns in just one hour."
  s6_equator_zero: "Latitudes are counted north and south starting from the Equator."
  s6_globe: "A map is flat. Which model is round like the Earth?"
  s6_intercardinal: "The in-between direction takes its name from the two directions it sits between."
  s6_ist: "Divide 82.5 by 15: each 15° is one hour."
  s6_key: "The scale tells distance. Which part of a map tells you what each symbol means?"
  s6_scale_div: "Each 1 cm stands for 3 km. How many 3 km pieces fit in 12 km?"
  s6_scale_mult: "Each 1 cm on the map is 5 km. Multiply the map distance by 5."
  s6_sketch: "A plan and a map are drawn to scale. Which drawing is rough and from memory?"
  s6_time_15: "The Earth turns 15° every hour. How many 15s are in 45?"
  s6_tropic_cancer: "The Equator passes south of India. Which tropic is in the northern half of the Earth?"
  c6ss1_parts: 'Recall the parts every map needs: a title, a direction arrow, a key for symbols, and a scale.'
  c6ss1_dir: 'Draw a quick compass with north at the top and fill in the other points going clockwise, then trace the move on it.'
  c6ss1_scale: The scale tells how many real units one map unit stands for. Multiply to go from map to real; divide to go back.
  c6ss1_kind: 'Ask: is it drawn to scale? Does it show a small area in detail or a huge area?'
  c6ss1_lat: 'Picture the globe: one set of lines circles it parallel to the middle line, the other set joins the two poles. Which set is this about?'
  c6ss1_time: The Earth turns 360° in 24 hours. Work out how much it turns in one hour, then use that.
concepts:
- code: cbse6ss.loc.maps
  title: Maps, directions and scale
  notes: |
    A map is a drawing of an area on a flat surface. Its parts: title, directions (north arrow; cardinal: N, S, E, W;
    intermediate: NE, NW, SE, SW), symbols with a key (legend), and scale (e.g. 1 cm = 1 km). Sketch (no scale) vs
    plan (small area, large scale) vs map. Large-scale maps show small areas in detail; small-scale maps show large areas.
    A globe is a model of the Earth that keeps true shapes.
  explanations:
    text: A map is a drawing of a place on paper. It has a title, a north arrow, symbols explained in a key, and a scale that tells how map distance compares with real distance. A globe is a small round model of the whole Earth.
    visual: 'Draw your school: an arrow pointing north at the top corner, a small cross for the first-aid room, a blue line for the water tap, and a note: 1 cm = 10 m.'
    step_by_step: 'Step 1: Read the title. Step 2: Find north. Step 3: Read the key to understand symbols. Step 4: Use the scale: measure on the map and multiply.'
    real_world: Phone maps, bus route maps and the evacuation map on a school wall are all maps with symbols and directions.
  picture:
    kind: compare
    columns:
    - title: Map part
      points:
      - Title
      - North arrow
      - Key
      - Scale
    - title: Tells you
      points:
      - what the map shows
      - directions
      - meaning of symbols
      - real distance
    alt: A map's title tells what it shows, the north arrow gives direction, the key explains symbols and the scale gives real distance.
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: 'Map scale: 1 cm = 5 km. Mark the real distance in km.'
    goals:
    - prompt: Two towns are 4 cm apart on the map.
      target: 20
      mistakes:
      - when:
          v: 4
        say: 'That''s the map distance. Each cm stands for 5 km: 4 × 5.'
      - when:
          v: 9
        say: 'That adds 4 and 5. Multiply: each of the 4 cm is 5 km.'
    - prompt: A river is 7 cm long on the map.
      target: 35
      mistakes:
      - when:
          v: 12
        say: 'That adds. Multiply: 7 × 5.'
      - when:
          v: 7
        say: That's on the map. In real life, 7 × 5 km.
    - prompt: A road is 2 cm on the map.
      target: 10
      mistakes:
      - when:
          v: 2
        say: 'Multiply by the scale: 2 × 5.'
  lesson:
    - teach: A map is a drawing of all or part of the Earth on a flat surface. Every good map has a title, a north arrow for directions, symbols explained in a key (legend), and a scale.
      picture:
        kind: compare
        columns:
        - title: Title
          points:
          - what the map shows
        - title: Direction and key
          points:
          - north arrow
          - symbols explained
        - title: Scale
          points:
          - 1 cm = how many km
        alt: 'The main parts of a map: title, direction arrow, key and scale.'
      check:
        prompt: On a map, a small blue line stands for a river. Where is that explained?
        options:
        - In the key
        - In the title
        - In the scale
        answer: In the key
        why: The key (legend) explains what each symbol means.
    - teach: 'The four cardinal directions are north, south, east and west. Between them are the intermediate directions: north-east, south-east, south-west and north-west. Most maps have north at the top.'
      picture:
        kind: compare
        columns:
        - title: Cardinal
          points:
          - North
          - East
          - South
          - West
        - title: Intermediate
          points:
          - North-east
          - South-east
          - South-west
          - North-west
        alt: The four cardinal directions and the four in-between directions.
      check:
        prompt: Which direction lies between south and west?
        options:
        - South-west
        - North-west
        - South-east
        answer: South-west
        why: Its name joins the two directions it lies between.
    - teach: The scale links map distance to real distance. With 1 cm = 10 km, 3 cm on the map is 30 km on the ground. A sketch is drawn from memory without scale; a plan shows a small area like a house in great detail; a globe is a round model that keeps true shapes.
      check:
        prompt: Scale 1 cm = 10 km. Two villages are 6 cm apart on the map. How far apart are they really?
        options:
        - 60 km
        - 16 km
        - 6 km
        answer: 60 km
        why: 6 × 10 = 60.
  items:
  - prompt: 'The part of a map that explains its symbols is the:'
    options:
    - Key (legend)
    - Scale
    - Title
    - Grid
    answer: Key (legend)
    difficulty: 1
    hints:
    - It's like a dictionary for the map.
    - Legend.
    solution: The key explains the symbols.
    mistakes: {"Scale": "s6_key"}
  - prompt: On a map, 1 cm = 5 km. Two towns are 4 cm apart on the map. How far apart are they really (in km)?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - Multiply by the scale.
    - 4 × 5.
    solution: 4 × 5 = 20 km.
    mistakes: {"9": "s6_scale_mult", "4": "s6_scale_mult"}
  - prompt: Which direction lies between north and east?
    options:
    - North-east
    - South-east
    - North-west
    - South-west
    answer: North-east
    difficulty: 1
    hints:
    - Combine the two names.
    - NE.
    solution: Between north and east is north-east.
    mistakes: {"South-east": "s6_intercardinal", "North-west": "s6_intercardinal"}
  - prompt: 'A model of the Earth that keeps its true round shape is a:'
    options:
    - Globe
    - Map
    - Sketch
    - Plan
    answer: Globe
    difficulty: 1
    hints:
    - Round, can be spun.
    - Model.
    solution: A globe is a model of the Earth.
    mistakes: {"Map": "s6_globe"}
  - prompt: 'A drawing made without scale, from memory, is a:'
    options:
    - Sketch
    - Map
    - Plan
    - Globe
    answer: Sketch
    difficulty: 2
    hints:
    - Rough drawing.
    - No exact distances.
    solution: A sketch is drawn without scale.
    mistakes: {"Plan": "s6_sketch"}
  - prompt: A road is 12 km long. On a map with 1 cm = 3 km, how long will it be drawn (in cm)?
    answer: '4'
    check: 12/3
    difficulty: 2
    hints:
    - Divide by the scale.
    - 12 ÷ 3.
    solution: 12 ÷ 3 = 4 cm.
    mistakes: {"36": "s6_scale_div", "9": "s6_scale_div"}
  - prompt: Scale 1 cm = 2 km. A river is drawn 7 cm long. How long is it really (in km)?
    answer: '14'
    check: 7*2
    difficulty: 1
    hints:
    - Each cm stands for 2 km.
    - Multiply 7 by 2.
    solution: 'Step 1: 7 cm × 2 km per cm. Step 2: = 14 km.'
    mistakes:
      '9': c6ss1_scale
      '3.5': c6ss1_scale
  - prompt: Scale 1 cm = 50 km. Two cities are 250 km apart. How far apart on the map (in cm)?
    answer: '5'
    check: 250/50
    difficulty: 2
    hints:
    - Going from real to map, divide.
    - 250 ÷ 50.
    solution: 'Step 1: 250 ÷ 50. Step 2: = 5 cm.'
    mistakes:
      '12500': c6ss1_scale
      '200': c6ss1_scale
  - prompt: Which direction is opposite to north-east?
    options:
    - South-west
    - North-west
    - South-east
    answer: South-west
    difficulty: 2
    hints:
    - The opposite of north is south.
    - The opposite of east is west.
    solution: 'Step 1: flip north to south and east to west. Step 2: so the opposite of north-east is south-west.'
    mistakes:
      North-west: c6ss1_dir
      South-east: c6ss1_dir
  - prompt: 'A drawing of your classroom showing where each desk is, drawn to scale, is a:'
    options:
    - Plan
    - Globe
    - Sketch
    answer: Plan
    difficulty: 2
    hints:
    - It is drawn to scale.
    - It shows a small area in detail.
    solution: 'Step 1: it has a scale, so it is not a sketch. Step 2: a scaled drawing of a small area is a plan.'
    mistakes:
      Globe: c6ss1_kind
      Sketch: c6ss1_kind
  - prompt: Why is a globe more accurate than a world map?
    options:
    - It is round like the Earth, so shapes are not stretched
    - It is bigger
    - It has more colours
    answer: It is round like the Earth, so shapes are not stretched
    difficulty: 2
    hints:
    - The Earth is round.
    - Flattening a round surface stretches it.
    solution: 'Step 1: a flat map stretches some areas. Step 2: a globe keeps the true round shape, so shapes and sizes are right.'
    mistakes:
      It is bigger: c6ss1_kind
      It has more colours: c6ss1_kind
  - prompt: You face north and turn right. Which direction do you now face?
    options:
    - East
    - West
    - South
    answer: East
    difficulty: 1
    hints:
    - Picture a compass with north on top.
    - East is to the right of north.
    solution: 'Step 1: on a compass, east is clockwise from north. Step 2: turning right from north faces east.'
    mistakes:
      West: c6ss1_dir
      South: c6ss1_dir
  - prompt: Which map shows more detail of a small area?
    options:
    - A large-scale map
    - A small-scale map
    - A world map
    answer: A large-scale map
    difficulty: 3
    hints:
    - Large scale means things are drawn bigger.
    - Bigger drawings fit fewer places but more detail.
    solution: 'Step 1: a large-scale map draws a small area big. Step 2: so it shows more detail, like streets.'
    mistakes:
      A small-scale map: c6ss1_kind
      A world map: c6ss1_kind
  - prompt: Which is NOT one of the main parts of a map?
    options:
    - The mapmaker's photo
    - Scale
    - Key
    answer: The mapmaker's photo
    difficulty: 1
    hints:
    - Think of what helps you read a map.
    - Title, direction, key, scale.
    solution: 'Step 1: title, direction, key and scale help us read a map. Step 2: a photo of the mapmaker does not.'
    mistakes:
      Scale: c6ss1_parts
      Key: c6ss1_parts
  - prompt: A school is north of your house and the market is east of the school. In which direction is the market from your house?
    options:
    - North-east
    - South-west
    - North-west
    answer: North-east
    difficulty: 3
    hints:
    - First go north, then east.
    - Combine the two directions.
    solution: 'Step 1: go north to the school, then east to the market. Step 2: overall the market is north-east of the house.'
    mistakes:
      South-west: c6ss1_dir
      North-west: c6ss1_dir
- code: cbse6ss.loc.grid
  title: Latitudes, longitudes and time
  after:
  - cbse6ss.loc.maps
  notes: |
    Latitudes: imaginary east–west circles measuring distance north or south of the Equator (0°) up to the poles (90°N,
    90°S); Tropic of Cancer 23½°N passes through India; Tropic of Capricorn 23½°S. Longitudes (meridians): half-circles
    from pole to pole; Prime Meridian (0°) through Greenwich, London; 180° east and west. Long ago, Indian astronomers
    used a prime meridian through Ujjain. Together they form a grid giving every place an address. The Earth rotates 360°
    in 24 hours: 15° = 1 hour. Indian Standard Time is based on 82½°E and is 5½ hours ahead of Greenwich.
  explanations:
    text: Mapmakers draw imaginary lines on the globe. Latitudes run east–west and tell how far north or south of the Equator a place is. Longitudes run from pole to pole and tell how far east or west of the Prime Meridian it is. Every 15° of longitude makes 1 hour of time difference.
    visual: 'On a ball, draw a belt around the middle: the Equator. Draw rings above and below it: latitudes. Draw lines from top to bottom like segments of an orange: longitudes. Where a latitude and a longitude cross is a place''s address.'
    step_by_step: 'Step 1: Find the place''s latitude (N or S of Equator). Step 2: Find its longitude (E or W of Greenwich). Step 3: For time, find the longitude difference. Step 4: Divide by 15 to get hours; east is ahead.'
    real_world: When it is 12 noon in London, it is 5:30 pm in India, because India's standard meridian is 82½°E.
  picture:
    kind: compare
    columns:
    - title: Latitudes
      points:
      - run east–west
      - 0° is the Equator
      - up to 90° N or S
    - title: Longitudes
      points:
      - run pole to pole
      - 0° is the Prime Meridian
      - up to 180° E or W
    alt: Latitudes run east–west from the Equator at 0° to 90° at the poles; longitudes run pole to pole from the Prime Meridian at 0° to 180°.
  activity:
    type: number_line
    min: 0
    max: 12
    step: 0.5
    start: 0
    prompt: The Earth turns 15° every hour. How many hours ahead of Greenwich?
    goals:
    - prompt: A place at 45°E
      target: 3
      mistakes:
      - when:
          v: 4.5
        say: The Earth turns 15° each hour, so divide by 15, not 10.
    - prompt: A place at 90°E
      target: 6
      mistakes:
      - when:
          v: 9
        say: 'Divide the degrees by 15, not 10: 90 ÷ 15.'
    - prompt: India's standard meridian, 82½°E
      target: 5.5
      mistakes:
      - when:
          v: 5
        say: 82½ ÷ 15 = 5½. Don't drop the half hour.
      - when:
          v: 6
        say: 'That''s 90°E. India''s meridian is 82½°: 5½ hours.'
  lesson:
    - teach: Latitudes are imaginary lines running east–west round the globe. The Equator is 0°; latitudes go up to 90°N at the North Pole and 90°S at the South Pole. The Tropic of Cancer (23½°N) passes through India; the Tropic of Capricorn is 23½°S.
      picture:
        kind: number_line
        from: -90
        to: 90
        step: 15
        points:
        - at: -90
          label: S Pole
        - at: -23.5
          label: Capricorn
        - at: 0
          label: Equator
        - at: 23.5
          label: Cancer
        - at: 90
          label: N Pole
        alt: Latitudes from 90 south to 90 north, with the Equator at 0 and the two tropics at 23 and a half degrees.
      check:
        prompt: What is the latitude of the North Pole?
        options:
        - 90°N
        - 0°
        - 23½°N
        answer: 90°N
        why: Latitudes go from 0° at the Equator to 90° at the poles.
    - teach: Longitudes (meridians) are half-circles from the North Pole to the South Pole. The Prime Meridian (0°) passes through Greenwich in London; longitudes go 180° east and west. Long ago Indian astronomers used a meridian through Ujjain. Latitude and longitude together give each place an address.
      check:
        prompt: Where do all the longitude lines meet?
        options:
        - At the two poles
        - At the Equator
        - At Greenwich only
        answer: At the two poles
        why: Each meridian runs from pole to pole.
    - teach: The Earth turns 360° in 24 hours, so 15° every hour. Places to the east see the Sun earlier and have a later time. India's Standard Time uses 82½°E, so India is 82½ ÷ 15 = 5½ hours ahead of Greenwich.
      check:
        prompt: It is noon at Greenwich (0°). What time is it at 30°E?
        options:
        - 2 p.m.
        - 10 a.m.
        - Noon
        answer: 2 p.m.
        why: 30 ÷ 15 = 2 hours, and east is ahead.
  items:
  - prompt: What is the latitude of the Equator (in degrees)?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - The starting line.
    - Zero.
    solution: The Equator is 0°.
    mistakes: {"90": "s6_equator_zero", "180": "s6_equator_zero"}
  - prompt: 'The Prime Meridian passes through:'
    options:
    - Greenwich, London
    - Ujjain
    - New Delhi
    - the North Pole only
    answer: Greenwich, London
    difficulty: 1
    hints:
    - Chosen in 1884.
    - England.
    solution: The Prime Meridian passes through Greenwich.
    mistakes:
      Ujjain: c6ss_lat_long
  - prompt: Which important latitude passes through India?
    options:
    - Tropic of Cancer
    - Tropic of Capricorn
    - Equator
    - Arctic Circle
    answer: Tropic of Cancer
    difficulty: 1
    hints:
    - 23½° N.
    - Through the middle of India.
    solution: The Tropic of Cancer crosses India.
    mistakes: {"Equator": "s6_tropic_cancer", "Tropic of Capricorn": "s6_tropic_cancer"}
  - prompt: How many degrees does the Earth turn in one hour?
    answer: '15'
    check: 360/24
    difficulty: 1
    hints:
    - 360° in 24 hours.
    - 360 ÷ 24.
    solution: 360 ÷ 24 = 15°.
    mistakes:
      '30': c6ss_time
  - prompt: Two places are 45° of longitude apart. What is their time difference (in hours)?
    answer: '3'
    check: 45/15
    difficulty: 2
    hints:
    - 15° = 1 hour.
    - 45 ÷ 15.
    solution: 45 ÷ 15 = 3 hours.
    mistakes: {"45": "s6_time_15", "4": "s6_time_15"}
  - prompt: India's standard meridian is 82.5° E. How many hours ahead of Greenwich is India? (Give a number.)
    answer: 11/2
    check: Rational(165,2)/15
    difficulty: 2
    hints:
    - 82.5 ÷ 15.
    - 5½.
    solution: 82.5 ÷ 15 = 5.5 hours.
    mistakes: {"5": "s6_ist", "6": "s6_ist"}
  - prompt: What is the latitude of the South Pole?
    options:
    - 90°S
    - 0°
    - 180°
    answer: 90°S
    difficulty: 1
    hints:
    - Poles are the farthest from the Equator.
    - South side.
    solution: 'Step 1: latitudes reach 90° at the poles. Step 2: the South Pole is 90°S.'
    mistakes:
      0°: c6ss1_lat
      180°: c6ss1_lat
  - prompt: What is the longitude of the Prime Meridian (in degrees)?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - It is the starting line for longitudes.
    - Like the Equator for latitudes.
    solution: 'Step 1: longitudes are counted from the Prime Meridian. Step 2: so it is 0°.'
    mistakes:
      '180': c6ss1_lat
      '90': c6ss1_lat
  - prompt: Latitude lines run in which direction?
    options:
    - East–west
    - North–south
    - Diagonally
    answer: East–west
    difficulty: 2
    hints:
    - The Equator is a latitude.
    - Which way does the Equator run?
    solution: 'Step 1: the Equator circles the Earth east–west. Step 2: all latitudes are parallel to it, running east–west.'
    mistakes:
      North–south: c6ss1_lat
      Diagonally: c6ss1_lat
  - prompt: How long does the Earth take to turn through 60° of longitude (in hours)?
    answer: '4'
    check: 60/15
    difficulty: 2
    hints:
    - It turns 15° each hour.
    - 60 ÷ 15.
    solution: 'Step 1: 15° per hour. Step 2: 60 ÷ 15 = 4 hours.'
    mistakes:
      '60': c6ss1_time
      '15': c6ss1_time
  - prompt: It is 6 a.m. at Greenwich. What time is it in India (IST, 5½ hours ahead)?
    options:
    - 11:30 a.m.
    - 12:30 a.m.
    - 6:00 p.m.
    answer: 11:30 a.m.
    difficulty: 2
    hints:
    - India is ahead, so add.
    - 6:00 + 5:30.
    solution: 'Step 1: add 5 hours 30 minutes to 6 a.m. Step 2: = 11:30 a.m.'
    mistakes:
      12:30 a.m.: c6ss1_time
      6:00 p.m.: c6ss1_time
  - prompt: A place is at 45°W. How many hours behind Greenwich is it?
    answer: '3'
    check: 45/15
    difficulty: 2
    hints:
    - West of Greenwich is behind.
    - 45 ÷ 15.
    solution: 'Step 1: 45 ÷ 15 = 3. Step 2: west means behind, so 3 hours behind.'
    mistakes:
      '45': c6ss1_time
      '15': c6ss1_time
  - prompt: Which is the longest latitude circle?
    options:
    - The Equator
    - The Tropic of Cancer
    - The Arctic Circle
    answer: The Equator
    difficulty: 2
    hints:
    - Latitude circles get smaller towards the poles.
    - Which is in the middle?
    solution: 'Step 1: circles shrink as you go towards the poles. Step 2: the Equator, in the middle, is the longest.'
    mistakes:
      The Tropic of Cancer: c6ss1_lat
      The Arctic Circle: c6ss1_lat
  - prompt: Why does India use one standard time instead of local times for every town?
    options:
    - So trains, offices and schools across the country keep the same clock
    - Because India has no longitudes
    - Because the Sun rises at the same moment everywhere
    answer: So trains, offices and schools across the country keep the same clock
    difficulty: 3
    hints:
    - Local times differ from east to west India.
    - What would happen to train timetables?
    solution: 'Step 1: towns at different longitudes have different local times. Step 2: one standard time keeps everyone on the same clock.'
    mistakes:
      Because India has no longitudes: c6ss1_time
      Because the Sun rises at the same moment everywhere: c6ss1_time
  - prompt: How many degrees of longitude are there in total, east plus west?
    answer: '360'
    check: 180+180
    difficulty: 2
    hints:
    - Longitudes go 180° east and 180° west.
    - Add them.
    solution: 'Step 1: 180° east + 180° west. Step 2: = 360°, a full circle.'
    mistakes:
      '180': c6ss1_lat
      '90': c6ss1_lat
