# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 4. Format: content/README.md.
subject: cbse6-ss
chapter: 4
title: Timeline and Sources of History
tips:
  c6ss_bce: "BCE years count down towards year 1, like a countdown. A bigger BCE number is further from year 1. Is it earlier or later?"
  c6ss_sources: "Literary sources are written texts. A coin dug out of the ground is a found object. Which kind of source studies things dug up?"
  s6_archaeologist: "An architect designs buildings. Who digs up the past?"
  s6_bce_gap: "In BCE, years count down towards zero. 600 BCE is earlier: subtract 600 − 400."
  s6_bhimbetka: "Delhi, Kolkata and Mumbai are modern cities. The rock shelters are in Madhya Pradesh."
  s6_ce_gap: "Subtract: 2025 − 1947."
  s6_century: "'Cent' means hundred, as in per cent."
  s6_century_name: "The 1st century was years 1–100 and the 2nd was 101–200, so the century number is one more than the first two digits. Try it with 1857."
  s6_inscription: "Excavation is digging. What is writing carved on stone called?"
  s6_manuscript: "'Manu' means hand and 'script' means writing."
  s6_millennium: "'Mille' means thousand."
  s6_oral: "'Oral' means spoken."
  c6ss4_bce: 'BCE years count backwards: the bigger the BCE number, the longer ago it was.'
  c6ss4_span: Within the same era, take the smaller year from the bigger one.
  c6ss4_century: 'The century is one more than the hundreds in the year: years 1801–1900 make one century.'
  c6ss4_units: Recall how many years are in a decade, a century and a millennium.
  c6ss4_source: 'Ask what kind of thing it is: an object dug up, something written, or something passed on by word of mouth.'
  c6ss4_who: 'Match the expert to what they study: old objects, written records, or ancient bones and fossils.'
concepts:
- code: cbse6ss.time.timeline
  title: Timelines, BCE and CE
  notes: |
    History is the study of the past. A timeline shows events in order of time. Dates: CE (Common Era) counts forward from
    year 1; BCE (Before Common Era) counts backward. 500 BCE is older than 100 BCE. There is no year 0: from 1 BCE the next
    year is 1 CE. Decade = 10 years, century = 100 years, millennium = 1000 years. The 21st century is 2001–2100. Time
    spans: from 200 BCE to 300 CE is 499 years (no year 0); for rough spans, add the two numbers.
  explanations:
    text: A timeline puts events in order of time, like beads on a string. Years after the start of the Common Era are written CE; years before it are BCE and count backwards. So 500 BCE is older than 100 BCE. A century is 100 years.
    visual: 'Draw a long line. Mark 1 CE near the middle. To the right: 500 CE, 1000 CE, 2000 CE. To the left: 500 BCE, 1000 BCE, 2000 BCE. The further left, the older.'
    step_by_step: 'Step 1: Is the date BCE or CE? Step 2: BCE: bigger number means older. CE: bigger number means more recent. Step 3: Place it on the line. Step 4: For gaps across the line, add the BCE and CE numbers (and subtract 1 because there is no year 0).'
    real_world: Your grandparents' wedding year, your birth year and today form a family timeline.
  picture:
    kind: number_line
    from: -500
    to: 500
    step: 100
    points:
    - at: -300
      label: 300 BCE
    - at: 0
      label: start of CE
    - at: 200
      label: 200 CE
    alt: A timeline from 500 BCE to 500 CE, with 300 BCE to the left of the start of the Common Era and 200 CE to the right.
  activity:
    type: number_line
    min: -500
    max: 500
    step: 50
    start: 0
    prompt: A timeline. Left of the middle is BCE (counting back); right is CE.
    goals:
    - prompt: Mark 300 BCE
      target: -300
      mistakes:
      - when:
          v: 300
        say: That's 300 CE. BCE dates go to the left, before the Common Era.
    - prompt: Mark 200 CE
      target: 200
      mistakes:
      - when:
          v: -200
        say: That's 200 BCE. CE dates are to the right.
    - prompt: Which is older, 500 BCE or 100 BCE? Mark it.
      target: -500
      mistakes:
      - when:
          v: -100
        say: 'BCE counts backwards: 500 BCE is further back, so older.'
  lesson:
    - teach: History is the study of the past. A timeline places events in order along a line, oldest on the left. It helps us see what happened before and after.
      picture:
        kind: number_line
        from: -600
        to: 2100
        step: 300
        points:
        - at: -500
          label: 500 BCE
        - at: 0
          label: start of CE
        - at: 1947
          label: 1947 CE
        alt: A timeline with 500 BCE on the left, the start of the Common Era in the middle, and 1947 CE on the right.
      check:
        prompt: On a timeline, where do older events go?
        options:
        - To the left
        - To the right
        - Anywhere
        answer: To the left
        why: Timelines run from older (left) to newer (right).
    - teach: 'Years after the start of the Common Era are CE and count forward: 100 CE, 1947 CE. Years before it are BCE and count backwards: 500 BCE is older than 100 BCE. There is no year 0.'
      check:
        prompt: 'Which happened first: 250 BCE or 50 BCE?'
        options:
        - 250 BCE
        - 50 BCE
        - Same time
        answer: 250 BCE
        why: BCE counts backwards, so the bigger number is earlier.
    - teach: A decade is 10 years, a century 100 years and a millennium 1,000 years. The 1st century CE is years 1–100, so the 21st century is 2001–2100. To find the time between two years in the same era, subtract.
      check:
        prompt: Which century is the year 1526 in?
        options:
        - 16th century
        - 15th century
        - 17th century
        answer: 16th century
        why: 1501–1600 is the 16th century.
  items:
  - prompt: 'Which is older: 300 BCE or 100 BCE?'
    options:
    - 300 BCE
    - 100 BCE
    - They are the same
    - Cannot say
    answer: 300 BCE
    difficulty: 1
    hints:
    - BCE counts backwards.
    - Bigger BCE number is older.
    solution: 300 BCE is 200 years before 100 BCE.
    mistakes:
      100 BCE: c6ss_bce
  - prompt: How many years are in a century?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - Cent means hundred.
    - '100.'
    solution: A century is 100 years.
    mistakes: {"10": "s6_century", "1000": "s6_century"}
  - prompt: How many years are in a millennium?
    answer: '1000'
    check: '1000'
    difficulty: 1
    hints:
    - Mille means thousand.
    - Ten centuries.
    solution: A millennium is 1,000 years.
    mistakes: {"100": "s6_millennium"}
  - prompt: How many years passed from 1947 CE to 2025 CE?
    answer: '78'
    check: 2025 - 1947
    difficulty: 1
    hints:
    - Both CE.
    - Subtract.
    solution: 2025 − 1947 = 78 years.
    mistakes: {"88": "s6_ce_gap", "68": "s6_ce_gap"}
  - prompt: How many years passed from 600 BCE to 400 BCE?
    answer: '200'
    check: 600 - 400
    difficulty: 2
    hints:
    - 'Both BCE: subtract.'
    - 600 − 400.
    solution: 600 − 400 = 200 years.
    mistakes: {"1000": "s6_bce_gap", "100": "s6_bce_gap"}
  - prompt: Which century is the year 1857 in?
    options:
    - 19th century
    - 18th century
    - 17th century
    - 20th century
    answer: 19th century
    difficulty: 2
    hints:
    - "The years 1–100 are the 1st century. Which block of a hundred years holds 1857?"
    - Add 1 to the first two digits.
    solution: 1857 lies in 1801–1900, the 19th century.
    mistakes: {"18th century": "s6_century_name"}
  - prompt: 'Which is older: 1200 BCE or 800 BCE?'
    options:
    - 1200 BCE
    - 800 BCE
    - Both the same
    answer: 1200 BCE
    difficulty: 1
    hints:
    - BCE counts backwards.
    - Which is further back?
    solution: 'Step 1: in BCE, bigger numbers are further in the past. Step 2: 1200 BCE is older.'
    mistakes:
      800 BCE: c6ss4_bce
      Both the same: c6ss4_bce
  - prompt: How many years are in 3 decades?
    answer: '30'
    check: 3*10
    difficulty: 1
    hints:
    - A decade is 10 years.
    - 3 × 10.
    solution: 'Step 1: 1 decade = 10 years. Step 2: 3 × 10 = 30 years.'
    mistakes:
      '300': c6ss4_units
      '3': c6ss4_units
  - prompt: How many centuries make a millennium?
    answer: '10'
    check: 1000/100
    difficulty: 2
    hints:
    - A millennium is 1,000 years.
    - A century is 100 years.
    solution: 'Step 1: 1,000 ÷ 100. Step 2: = 10 centuries.'
    mistakes:
      '100': c6ss4_units
      '1000': c6ss4_units
  - prompt: Which century is the year 2025 in?
    options:
    - 21st century
    - 20th century
    - 22nd century
    answer: 21st century
    difficulty: 1
    hints:
    - Years 2001–2100 form one century.
    - Count from the 1st century, which is 1–100.
    solution: 'Step 1: 2001–2100 is the 21st century. Step 2: 2025 falls in it.'
    mistakes:
      20th century: c6ss4_century
      22nd century: c6ss4_century
  - prompt: How many years passed from 1857 CE to 1947 CE?
    answer: '90'
    check: 1947-1857
    difficulty: 2
    hints:
    - Both are CE years.
    - Subtract 1857 from 1947.
    solution: 'Step 1: 1947 − 1857. Step 2: = 90 years.'
    mistakes:
      '110': c6ss4_span
      '100': c6ss4_span
  - prompt: How many years passed from 1500 BCE to 1000 BCE?
    answer: '500'
    check: 1500-1000
    difficulty: 2
    hints:
    - 'Both are BCE: count down from 1500 to 1000.'
    - Subtract.
    solution: 'Step 1: BCE years count down, from 1500 to 1000. Step 2: 1500 − 1000 = 500 years.'
    mistakes:
      '2500': c6ss4_bce
      '1000': c6ss4_bce
  - prompt: 'Arrange from oldest to newest: 100 CE, 300 BCE, 1000 CE, 50 BCE'
    options:
    - 300 BCE, 50 BCE, 100 CE, 1000 CE
    - 50 BCE, 300 BCE, 100 CE, 1000 CE
    - 1000 CE, 100 CE, 50 BCE, 300 BCE
    answer: 300 BCE, 50 BCE, 100 CE, 1000 CE
    difficulty: 3
    hints:
    - All BCE years come before CE years.
    - Among BCE, the bigger number is older.
    solution: 'Step 1: 300 BCE is older than 50 BCE. Step 2: then CE: 100 CE, then 1000 CE.'
    mistakes:
      50 BCE, 300 BCE, 100 CE, 1000 CE: c6ss4_bce
      1000 CE, 100 CE, 50 BCE, 300 BCE: c6ss4_bce
  - prompt: The 18th century covers which years?
    options:
    - 1701–1800
    - 1801–1900
    - 1601–1700
    answer: 1701–1800
    difficulty: 2
    hints:
    - The 1st century is 1–100.
    - The 18th ends at 18 × 100.
    solution: 'Step 1: the 18th century ends in 1800. Step 2: it starts in 1701.'
    mistakes:
      1801–1900: c6ss4_century
      1601–1700: c6ss4_century
  - prompt: Why do historians use timelines?
    options:
    - To see the order of events and how far apart they were
    - To decorate books
    - To guess the future
    answer: To see the order of events and how far apart they were
    difficulty: 1
    hints:
    - A timeline puts events in order.
    - It also shows gaps between them.
    solution: 'Step 1: a timeline places events in order. Step 2: it shows what came first and the gaps between them.'
    mistakes:
      To decorate books: c6ss4_span
      To guess the future: c6ss4_span
- code: cbse6ss.time.sources
  title: How we know about the past
  after:
  - cbse6ss.time.timeline
  notes: |
    Sources of history: archaeological (material remains: tools, pottery, coins, buildings, bones, seals; studied by
    archaeologists who excavate), literary (written: religious texts, epics, travellers' accounts, inscriptions on stone
    or copper plates; manuscripts on palm leaf or birch bark), oral (stories, songs, folk traditions). Palaeontologists
    study fossils. Historians compare sources to check what is true. Early humans: cave paintings at Bhimbetka (MP).
  explanations:
    text: We learn about the past from sources. Archaeologists dig up old tools, pots, coins and buildings. Old writings like manuscripts and inscriptions tell us more. Stories and songs passed down by word of mouth are oral sources. Historians compare all of them.
    visual: Picture an archaeologist with a brush, gently uncovering a broken pot in a trench, next to a palm-leaf manuscript and a grandmother telling a story.
    step_by_step: 'Step 1: Find the source. Step 2: Decide its type: object, writing or spoken. Step 3: Ask what it tells us and how old it is. Step 4: Compare with other sources.'
    real_world: Old palm-leaf manuscripts (thaliyola) in Kerala record medicine, astronomy and literature from centuries ago.
  picture:
    kind: compare
    columns:
    - title: Archaeological
      points:
      - pots, tools
      - coins
      - buildings
    - title: Literary
      points:
      - manuscripts
      - inscriptions
      - travellers' accounts
    - title: Oral
      points:
      - folk songs
      - stories
      - family memories
    alt: Archaeological sources are objects like pots and coins, literary sources are writings like manuscripts and inscriptions, and oral sources are songs and stories.
  activity:
    type: sort
    prompt: Which kind of source?
    bins:
    - Archaeological
    - Literary
    - Oral
    items:
    - label: A coin dug up at an old site
      bin: Archaeological
      clue: Material remains.
      why: Archaeological.
    - label: Pottery pieces
      bin: Archaeological
      clue: Dug up.
      why: Archaeological.
    - label: A palm-leaf manuscript
      bin: Literary
      clue: Written.
      why: Literary.
    - label: A traveller's account
      bin: Literary
      clue: Written by a visitor.
      why: Literary.
    - label: Folk songs passed down
      bin: Oral
      clue: Spoken, not written.
      why: Oral.
    - label: Grandmother's stories of old times
      bin: Oral
      clue: Spoken.
      why: Oral.
  lesson:
    - teach: 'We learn about the past from sources. Archaeological sources are material remains: tools, pots, coins, seals, bones, buildings. Archaeologists find them by careful digging (excavation).'
      picture:
        kind: compare
        columns:
        - title: Archaeological
          points:
          - tools, pots, coins
          - buildings, bones
        - title: Literary
          points:
          - books, inscriptions
          - manuscripts
        - title: Oral
          points:
          - stories, songs
          - passed by word of mouth
        alt: 'Three kinds of sources: things dug up, things written, and things passed on by speaking.'
      check:
        prompt: A clay pot dug up at an old site is which kind of source?
        options:
        - Archaeological
        - Literary
        - Oral
        answer: Archaeological
        why: It is a material object from the past.
    - teach: 'Literary sources are written: religious books, epics, travellers'' accounts and inscriptions carved on stone or copper. Old books written by hand on palm leaves or birch bark are manuscripts.'
      check:
        prompt: 'Words carved on a stone pillar are called:'
        options:
        - An inscription
        - A manuscript
        - A folk song
        answer: An inscription
        why: Writing on stone or metal is an inscription.
    - teach: Oral sources are stories, songs and traditions passed down by word of mouth. Historians compare different sources to check what really happened. Early humans left paintings in rock shelters such as Bhimbetka in Madhya Pradesh.
      check:
        prompt: Why do historians compare many sources?
        options:
        - To check which details are true
        - To make the story longer
        - Because one source is always enough
        answer: To check which details are true
        why: Sources can disagree or be one-sided.
  items:
  - prompt: 'A person who digs up and studies old objects is an:'
    options:
    - Archaeologist
    - Astronaut
    - Architect
    - Accountant
    answer: Archaeologist
    difficulty: 1
    hints:
    - Excavation.
    - Old objects.
    solution: Archaeologists study material remains.
    mistakes: {"Architect": "s6_archaeologist"}
  - prompt: An old coin found in the ground is which type of source?
    options:
    - Archaeological
    - Literary
    - Oral
    - Not a source
    answer: Archaeological
    difficulty: 1
    hints:
    - It's an object.
    - Dug up.
    solution: A coin is a material, archaeological source.
    mistakes:
      Literary: c6ss_sources
  - prompt: 'Writing carved on stone or metal is called an:'
    options:
    - Inscription
    - Excavation
    - Fossil
    - Folk tale
    answer: Inscription
    difficulty: 1
    hints:
    - Ashoka's edicts.
    - Carved writing.
    solution: Carved writing is an inscription.
    mistakes: {"Excavation": "s6_inscription"}
  - prompt: 'Old texts written by hand on palm leaves or birch bark are:'
    options:
    - Manuscripts
    - Coins
    - Fossils
    - Maps
    answer: Manuscripts
    difficulty: 1
    hints:
    - Manu = hand.
    - Handwritten.
    solution: Handwritten old texts are manuscripts.
    mistakes: {"Fossils": "s6_manuscript"}
  - prompt: 'Folk songs passed down by word of mouth are:'
    options:
    - Oral sources
    - Archaeological sources
    - Inscriptions
    - Coins
    answer: Oral sources
    difficulty: 2
    hints:
    - Spoken, not written.
    - Oral = mouth.
    solution: They are oral sources.
    mistakes: {"Inscriptions": "s6_oral"}
  - prompt: Where are famous rock-shelter paintings of early humans in India?
    options:
    - Bhimbetka
    - Delhi
    - Kolkata
    - Mumbai
    answer: Bhimbetka
    difficulty: 2
    hints:
    - Madhya Pradesh.
    - Thousands of years old.
    solution: Bhimbetka rock shelters have ancient paintings.
    mistakes: {"Delhi": "s6_bhimbetka"}
  - prompt: 'Copper plates with a king''s order written on them are:'
    options:
    - Inscriptions
    - Oral sources
    - Fossils
    answer: Inscriptions
    difficulty: 1
    hints:
    - The writing is on metal.
    - Writing on stone or metal has a special name.
    solution: 'Step 1: the order is written on copper. Step 2: writing on metal or stone is an inscription.'
    mistakes:
      Oral sources: c6ss4_source
      Fossils: c6ss4_source
  - prompt: A grandmother's story about a flood long ago is which source?
    options:
    - Oral
    - Archaeological
    - Inscription
    answer: Oral
    difficulty: 1
    hints:
    - It is told, not written or dug up.
    - Passed by word of mouth.
    solution: 'Step 1: it is spoken. Step 2: spoken stories are oral sources.'
    mistakes:
      Archaeological: c6ss4_source
      Inscription: c6ss4_source
  - prompt: Who studies fossils of plants and animals that lived very long ago?
    options:
    - Palaeontologist
    - Archaeologist
    - Poet
    answer: Palaeontologist
    difficulty: 2
    hints:
    - Fossils are much older than human history.
    - It is not the person who studies pots and coins.
    solution: 'Step 1: archaeologists study human remains and objects. Step 2: palaeontologists study fossils.'
    mistakes:
      Archaeologist: c6ss4_who
      Poet: c6ss4_who
  - prompt: 'Manuscripts in ancient India were often written on:'
    options:
    - Palm leaves and birch bark
    - Plastic sheets
    - Glass
    answer: Palm leaves and birch bark
    difficulty: 1
    hints:
    - Paper was not common then.
    - They used natural materials.
    solution: 'Step 1: paper came later. Step 2: palm leaves (south) and birch bark (north) were used.'
    mistakes:
      Plastic sheets: c6ss4_source
      Glass: c6ss4_source
  - prompt: Rock paintings at Bhimbetka are in which state?
    options:
    - Madhya Pradesh
    - Kerala
    - Punjab
    answer: Madhya Pradesh
    difficulty: 2
    hints:
    - It is in central India.
    - Near Bhopal.
    solution: 'Step 1: Bhimbetka is near Bhopal. Step 2: Bhopal is in Madhya Pradesh.'
    mistakes:
      Kerala: c6ss4_source
      Punjab: c6ss4_source
  - prompt: An old coin shows a king's face and name. What can it tell historians?
    options:
    - Who ruled and when, and how trade worked
    - Nothing at all
    - Only the weather
    answer: Who ruled and when, and how trade worked
    difficulty: 2
    hints:
    - Coins carry names and pictures.
    - Coins are used for buying and selling.
    solution: 'Step 1: the name and face show the ruler. Step 2: where coins are found shows trade links.'
    mistakes:
      Nothing at all: c6ss4_source
      Only the weather: c6ss4_source
  - prompt: Why must archaeologists dig very carefully?
    options:
    - Objects and the layers they lie in are clues that can be destroyed
    - To save time
    - Because soil is rare
    answer: Objects and the layers they lie in are clues that can be destroyed
    difficulty: 3
    hints:
    - Deeper layers are usually older.
    - Breaking things loses information.
    solution: 'Step 1: each layer and its position tells a story. Step 2: careless digging breaks objects and mixes up layers.'
    mistakes:
      To save time: c6ss4_who
      Because soil is rare: c6ss4_who
  - prompt: 'A traveller''s diary from 1,000 years ago describing a city is a:'
    options:
    - Literary source
    - Archaeological source
    - Fossil
    answer: Literary source
    difficulty: 2
    hints:
    - It is written.
    - Written records are a type of source.
    solution: 'Step 1: the diary is a written account. Step 2: written records are literary sources.'
    mistakes:
      Archaeological source: c6ss4_source
      Fossil: c6ss4_source
  - prompt: Two sources disagree about a battle. What should a historian do?
    options:
    - Look for more sources and compare them
    - Pick the more exciting one
    - Ignore the battle
    answer: Look for more sources and compare them
    difficulty: 2
    hints:
    - One side may tell only its own story.
    - More evidence helps.
    solution: 'Step 1: each source may be one-sided. Step 2: comparing more sources helps find what really happened.'
    mistakes:
      Pick the more exciting one: c6ss4_who
      Ignore the battle: c6ss4_who
