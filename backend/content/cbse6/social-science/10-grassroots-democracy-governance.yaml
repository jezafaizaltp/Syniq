# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 10. Format: content/README.md.
subject: cbse6-ss
chapter: 10
title: 'Grassroots Democracy Part 1: Governance'
tips:
  c6ss_organs: "Three organs: one makes laws, one carries them out, one settles disputes. Match the job in the question to the right organ."
  s6_governance: "Governance is about making and carrying out decisions."
  s6_judiciary: "Courts settle disputes."
  s6_local: "A panchayat works for a village."
  s6_one_vote: "In a democracy wealth doesn't buy extra votes. Every adult counts the same. How many votes is that each?"
  s6_rules: "Rules help groups work together fairly."
  s6_supreme_court: "A High Court is for a state. Which court is above all?"
  s6_three_levels: "Central, state and local. Count them."
  s6_uttaramerur: "Mohenjo-daro and Lothal are Harappan. The village-election inscription is in Tamil Nadu."
  s6_vote_leaders: "In a democracy people choose leaders."
  s6_voting_age: "The voting age was lowered from 21 in 1988."
  c6ss10_demo: In a democracy the power to choose and change leaders rests with the people, each with an equal say.
  c6ss10_rules: Ask what would happen to fairness and order if there were no rules at all.
  c6ss10_organ: 'Match the job to the branch: making laws, carrying them out, or settling disputes.'
  c6ss10_level: 'Ask how big an area the decision covers: the whole country, one state, or one village or town.'
  c6ss10_old: 'Recall the old assemblies and the temple inscriptions about village elections: where they are and how old.'
concepts:
- code: cbse6ss.gov.democracy
  title: Governance and democracy
  notes: |
    Governance means how decisions are made and carried out for a group, from a school class to a country. Rules and
    laws are needed for order and fairness. Democracy: government by the people: citizens elect representatives; every
    adult (18+) has one vote; people can question and change leaders through elections. Ancient roots: assemblies like
    sabha and samiti; Uttaramerur inscriptions (Tamil Nadu, about 10th century) describe village elections.
  explanations:
    text: Governance is how a group makes and carries out decisions, whether it's a class, a village or a country. In a democracy, the people choose their leaders by voting. Every adult citizen, 18 or older, has one vote, and leaders must answer to the people.
    visual: 'Picture a class electing a monitor: candidates speak, everyone votes secretly, votes are counted and the winner leads, but can be replaced next term.'
    step_by_step: 'Step 1: Who makes the decisions? Step 2: How are they chosen? Step 3: If the people choose by voting and can change leaders, it is a democracy.'
    real_world: In India's general elections, nearly a billion voters choose their Members of Parliament, the largest election in the world.
  picture:
    kind: flow
    steps:
    - Citizens vote
    - Representatives elected
    - They make decisions
    - Citizens question them
    - 'Next election: keep or change'
    alt: In a democracy, citizens elect representatives who decide, answer to the people and can be changed at the next election.
  activity:
    type: sort
    prompt: Democratic or not?
    bins:
    - Democratic
    - Not democratic
    items:
    - label: Every adult has one vote
      bin: Democratic
      clue: Equal say.
      why: Democratic.
    - label: People can change leaders in elections
      bin: Democratic
      clue: Leaders answer to people.
      why: Democratic.
    - label: One person rules for life and can't be questioned
      bin: Not democratic
      clue: Who chose them?
      why: Not democratic.
    - label: Only rich people can vote
      bin: Not democratic
      clue: Is it equal?
      why: Not democratic.
    - label: Uttaramerur villages elect their assembly
      bin: Democratic
      clue: Old election records.
      why: An old democratic tradition.
  lesson:
    - teach: Governance means how decisions are made and carried out for a group, from a class to a whole country. Every group needs rules, and a country needs laws, so that life is orderly and fair.
      check:
        prompt: 'A class makes a rule: everyone gets a turn on the swing. This is an example of:'
        options:
        - Governance with a fair rule
        - A war
        - A trade deal
        answer: Governance with a fair rule
        why: A decision for the group, made and followed fairly.
    - teach: In a democracy, government is by the people. Citizens aged 18 and above elect representatives. Each adult has one vote, whether rich or poor, so everyone has an equal say. If people are unhappy, they can change leaders at the next election.
      picture:
        kind: flow
        steps:
        - Citizens 18+
        - Vote in elections
        - Representatives chosen
        - Government formed
        - 'Next election: keep or change'
        alt: Adult citizens vote to choose representatives, who form the government; at the next election people can keep or change them.
      check:
        prompt: A rich person and a poor person vote. How many votes does each have?
        options:
        - One each
        - 'Rich: more'
        - 'Poor: none'
        answer: One each
        why: In a democracy every adult has one equal vote.
    - teach: Democratic ideas are old in India. Early assemblies called sabha and samiti discussed matters. Inscriptions at Uttaramerur in Tamil Nadu, about 1,100 years old, describe how villages elected committees and who could stand.
      check:
        prompt: What do the Uttaramerur inscriptions describe?
        options:
        - Village elections
        - A sea voyage
        - A cricket match
        answer: Village elections
        why: They set out rules for choosing village committees.
  items:
  - prompt: 'In a democracy, leaders are chosen by:'
    options:
    - the people through voting
    - birth only
    - the army
    - a lottery
    answer: the people through voting
    difficulty: 1
    hints:
    - Elections.
    - Votes.
    solution: People elect leaders.
    mistakes: {"birth only": "s6_vote_leaders"}
  - prompt: At what age can an Indian citizen vote?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - Adult.
    - Voting age.
    solution: 18 years.
    mistakes: {"21": "s6_voting_age", "16": "s6_voting_age"}
  - prompt: Why do groups need rules?
    options:
    - For order and fairness
    - To punish everyone
    - To stop all games
    - No reason
    answer: For order and fairness
    difficulty: 1
    hints:
    - Think of a game without rules.
    - Fairness.
    solution: Rules keep order and fairness.
    mistakes: {"To punish everyone": "s6_rules"}
  - prompt: 'Ancient inscriptions describing village elections were found at:'
    options:
    - Uttaramerur
    - Mohenjo-daro
    - Lothal
    - Delhi
    answer: Uttaramerur
    difficulty: 2
    hints:
    - Tamil Nadu.
    - About 10th century.
    solution: Uttaramerur inscriptions describe village elections.
    mistakes: {"Mohenjo-daro": "s6_uttaramerur"}
  - prompt: '''Governance'' means:'
    options:
    - how decisions are made and carried out
    - only playing games
    - building houses
    - doing homework
    answer: how decisions are made and carried out
    difficulty: 1
    hints:
    - Govern = guide.
    - Decisions.
    solution: Governance is making and carrying out decisions.
    mistakes: {"building houses": "s6_governance"}
  - prompt: 'Each adult citizen in India has:'
    options:
    - one vote
    - ten votes
    - no vote
    - votes based on wealth
    answer: one vote
    difficulty: 2
    hints:
    - Equality.
    - Universal adult franchise.
    solution: Each adult has one equal vote.
    mistakes: {"votes based on wealth": "s6_one_vote"}
  - prompt: Uttaramerur is in which state?
    options:
    - Tamil Nadu
    - Punjab
    - Gujarat
    answer: Tamil Nadu
    difficulty: 1
    hints:
    - It is near Kanchipuram.
    - A southern state.
    solution: 'Step 1: Uttaramerur is near Kanchipuram. Step 2: it is in Tamil Nadu.'
    mistakes:
      Punjab: c6ss10_old
      Gujarat: c6ss10_old
  - prompt: A 16-year-old wants to vote in the next election. Can she?
    options:
    - No, the voting age is 18
    - Yes, at any age
    - Yes, if her parents agree
    answer: No, the voting age is 18
    difficulty: 1
    hints:
    - There is a minimum voting age.
    - It is 18.
    solution: 'Step 1: the voting age in India is 18. Step 2: at 16 she must wait 2 more years.'
    mistakes:
      Yes, at any age: c6ss10_demo
      Yes, if her parents agree: c6ss10_demo
  - prompt: A 16-year-old will be able to vote after how many years?
    answer: '2'
    check: 18-16
    difficulty: 1
    hints:
    - The voting age is 18.
    - 18 − 16.
    solution: 'Step 1: voting age is 18. Step 2: 18 − 16 = 2 years.'
    mistakes:
      '18': c6ss10_demo
      '16': c6ss10_demo
  - prompt: Why are elections held again every few years?
    options:
    - So people can keep or change their leaders
    - To give leaders a holiday
    - Because votes expire
    answer: So people can keep or change their leaders
    difficulty: 2
    hints:
    - Leaders must answer to the people.
    - What can voters do if unhappy?
    solution: 'Step 1: regular elections give people a choice again. Step 2: they can keep good leaders or replace others.'
    mistakes:
      To give leaders a holiday: c6ss10_demo
      Because votes expire: c6ss10_demo
  - prompt: 'A game without any rules would most likely become:'
    options:
    - Unfair and confusing
    - More fair
    - Easier to judge
    answer: Unfair and confusing
    difficulty: 1
    hints:
    - Who decides who wins?
    - What stops cheating?
    solution: 'Step 1: without rules, players can do anything. Step 2: the game becomes unfair and confusing.'
    mistakes:
      More fair: c6ss10_rules
      Easier to judge: c6ss10_rules
  - prompt: 'In ancient India, ''sabha'' and ''samiti'' were:'
    options:
    - Assemblies where people discussed matters
    - Types of food
    - Musical instruments
    answer: Assemblies where people discussed matters
    difficulty: 2
    hints:
    - Sabha still means a meeting.
    - People came together to decide.
    solution: 'Step 1: sabha and samiti were gatherings. Step 2: people discussed and decided matters in them.'
    mistakes:
      Types of food: c6ss10_old
      Musical instruments: c6ss10_old
  - prompt: Which is a feature of democracy?
    options:
    - Citizens can freely question their leaders
    - One person rules forever
    - Only the rich can vote
    answer: Citizens can freely question their leaders
    difficulty: 2
    hints:
    - Power belongs to the people.
    - Leaders must answer them.
    solution: 'Step 1: in a democracy, leaders answer to citizens. Step 2: so citizens can question them freely.'
    mistakes:
      One person rules forever: c6ss10_demo
      Only the rich can vote: c6ss10_demo
  - prompt: 'Your class elects a monitor by secret ballot. This is like:'
    options:
    - A small democratic election
    - A king's order
    - A court case
    answer: A small democratic election
    difficulty: 1
    hints:
    - Everyone votes.
    - The choice is the class's.
    solution: 'Step 1: every student votes. Step 2: choosing a leader by vote is democratic.'
    mistakes:
      A king's order: c6ss10_demo
      A court case: c6ss10_organ
  - prompt: About how old are the Uttaramerur inscriptions?
    options:
    - About 1,100 years
    - About 10 years
    - About 10,000 years
    answer: About 1,100 years
    difficulty: 3
    hints:
    - They date to about the 10th century CE.
    - From then to now.
    solution: 'Step 1: they date to around 920 CE. Step 2: that is about 1,100 years ago.'
    mistakes:
      About 10 years: c6ss10_old
      About 10,000 years: c6ss10_old
- code: cbse6ss.gov.organs
  title: Organs and levels of government
  after:
  - cbse6ss.gov.democracy
  notes: |
    Three organs (branches) of government: legislature (makes laws: Parliament, State Legislative Assemblies), executive
    (carries out laws: Prime Minister/Chief Minister, ministers, government officials), judiciary (courts: settle
    disputes, interpret laws; Supreme Court at the top). Separation of powers keeps balance. Three levels: central (union,
    for the whole country), state, and local (panchayats in villages, municipalities in towns and cities).
  explanations:
    text: 'Government has three parts. The legislature makes laws. The executive carries them out. The judiciary, the courts, settles disputes and checks that laws are followed. Government also works at three levels: the central government for the whole country, state governments and local governments in villages and towns.'
    visual: 'Draw a building with three pillars: ''Make laws'' (legislature), ''Carry out laws'' (executive), ''Judge disputes'' (judiciary). Under it, three floors: Central, State, Local.'
    step_by_step: 'Step 1: Identify the task: making, carrying out or judging laws. Step 2: Name the organ. Step 3: Identify the area: whole country, state or village/town. Step 4: Name the level.'
    real_world: Parliament passes a law, the government's departments put it into action, and if people disagree about it, courts decide.
  picture:
    kind: compare
    columns:
    - title: Organ
      points:
      - Legislature
      - Executive
      - Judiciary
    - title: Job
      points:
      - makes laws
      - carries out laws
      - settles disputes
    alt: The legislature makes laws, the executive carries them out and the judiciary settles disputes.
  activity:
    type: sort
    prompt: Legislature, executive or judiciary?
    bins:
    - Legislature
    - Executive
    - Judiciary
    items:
    - label: Parliament makes a law
      bin: Legislature
      clue: Makes laws.
      why: Legislature.
    - label: The Prime Minister and ministers carry it out
      bin: Executive
      clue: Carries out laws.
      why: Executive.
    - label: The Supreme Court settles a dispute
      bin: Judiciary
      clue: Courts.
      why: Judiciary.
    - label: Government officials run schools
      bin: Executive
      clue: Carrying out.
      why: Executive.
    - label: State Legislative Assembly debates a bill
      bin: Legislature
      clue: Makes laws.
      why: Legislature.
  lesson:
    - teach: Government has three organs. The legislature makes laws (Parliament for the country, Legislative Assemblies for states). The executive carries out laws (Prime Minister or Chief Minister, ministers and officials). The judiciary (courts) settles disputes and explains laws; the Supreme Court is the highest.
      picture:
        kind: compare
        columns:
        - title: Legislature
          points:
          - makes laws
          - Parliament, Assemblies
        - title: Executive
          points:
          - carries out laws
          - PM, CM, ministers, officials
        - title: Judiciary
          points:
          - settles disputes
          - courts, Supreme Court
        alt: Legislature makes laws, executive carries them out, judiciary settles disputes.
      check:
        prompt: Parliament belongs to which organ?
        options:
        - Legislature
        - Executive
        - Judiciary
        answer: Legislature
        why: Parliament makes laws.
    - teach: 'Keeping these three separate (separation of powers) means no single group holds all power: each can check the others.'
      check:
        prompt: Why keep law-making, law-enforcing and judging separate?
        options:
        - So no one group has all the power
        - To make work slower
        - Because they dislike each other
        answer: So no one group has all the power
        why: Separation keeps a balance.
    - teach: 'There are three levels of government: central (Union) for the whole country, state for each state, and local: panchayats in villages and municipalities in towns and cities.'
      picture:
        kind: flow
        steps:
        - Central (whole country)
        - State
        - Local (panchayat, municipality)
        alt: 'Three levels: the central government, state governments, and local bodies like panchayats and municipalities.'
      check:
        prompt: Who would fix a broken street light in your town?
        options:
        - The municipality (local)
        - The Supreme Court
        - Parliament
        answer: The municipality (local)
        why: Local bodies handle local services.
  items:
  - prompt: Which organ of government makes laws?
    options:
    - Legislature
    - Executive
    - Judiciary
    - Police
    answer: Legislature
    difficulty: 1
    hints:
    - Parliament.
    - Law-making.
    solution: The legislature makes laws.
    mistakes:
      Executive: c6ss_organs
  - prompt: Courts belong to which organ?
    options:
    - Judiciary
    - Legislature
    - Executive
    - Panchayat
    answer: Judiciary
    difficulty: 1
    hints:
    - Judges.
    - Justice.
    solution: Courts are the judiciary.
    mistakes: {"Legislature": "s6_judiciary"}
  - prompt: 'The executive''s job is to:'
    options:
    - carry out laws
    - make laws
    - judge cases
    - vote in elections
    answer: carry out laws
    difficulty: 1
    hints:
    - Ministers and officials.
    - Action.
    solution: The executive implements laws.
    mistakes:
      make laws: c6ss_organs
  - prompt: How many levels of government are there in India (central, state, local)?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Count them.
    - Three.
    solution: Three levels.
    mistakes: {"2": "s6_three_levels", "4": "s6_three_levels"}
  - prompt: A village panchayat is part of which level of government?
    options:
    - Local
    - Central
    - State
    - International
    answer: Local
    difficulty: 1
    hints:
    - Closest to people.
    - Village.
    solution: Panchayats are local government.
    mistakes: {"State": "s6_local"}
  - prompt: 'The highest court in India is the:'
    options:
    - Supreme Court
    - High Court of Kerala
    - District Court
    - Gram Sabha
    answer: Supreme Court
    difficulty: 2
    hints:
    - In New Delhi.
    - Top of judiciary.
    solution: The Supreme Court is the highest court.
    mistakes: {"High Court of Kerala": "s6_supreme_court"}
  - prompt: 'The Chief Minister of a state is part of the:'
    options:
    - Executive
    - Judiciary
    - Panchayat
    answer: Executive
    difficulty: 2
    hints:
    - The Chief Minister leads the state government.
    - Which organ carries out laws?
    solution: 'Step 1: the CM heads the state government. Step 2: the government carries out laws: the executive.'
    mistakes:
      Judiciary: c6ss10_organ
      Panchayat: c6ss10_level
  - prompt: Two neighbours disagree about a boundary wall. Who can settle it according to law?
    options:
    - A court (judiciary)
    - Parliament
    - A shopkeeper
    answer: A court (judiciary)
    difficulty: 1
    hints:
    - Disputes go to one organ.
    - Judges decide.
    solution: 'Step 1: settling disputes is the judiciary''s job. Step 2: so a court decides.'
    mistakes:
      Parliament: c6ss10_organ
      A shopkeeper: c6ss10_organ
  - prompt: Defence of the whole country is handled by which level?
    options:
    - Central government
    - Gram panchayat
    - Municipality
    answer: Central government
    difficulty: 1
    hints:
    - It concerns the whole nation.
    - Not one village or town.
    solution: 'Step 1: defence protects all of India. Step 2: so the central government handles it.'
    mistakes:
      Gram panchayat: c6ss10_level
      Municipality: c6ss10_level
  - prompt: 'A State Legislative Assembly mainly:'
    options:
    - Makes laws for the state
    - Runs the Supreme Court
    - Collects village garbage
    answer: Makes laws for the state
    difficulty: 2
    hints:
    - '''Legislative'' is about laws.'
    - It works for one state.
    solution: 'Step 1: ''legislative'' means law-making. Step 2: it makes laws for its state.'
    mistakes:
      Runs the Supreme Court: c6ss10_organ
      Collects village garbage: c6ss10_level
  - prompt: 'Government officials who run offices and schemes belong to the:'
    options:
    - Executive
    - Legislature
    - Judiciary
    answer: Executive
    difficulty: 2
    hints:
    - They put decisions into action.
    - They don't make laws or judge cases.
    solution: 'Step 1: officials carry out government decisions. Step 2: that is the executive''s job.'
    mistakes:
      Legislature: c6ss10_organ
      Judiciary: c6ss10_organ
  - prompt: 'Water supply in a big city is usually managed by the:'
    options:
    - Municipal corporation
    - Supreme Court
    - Gram Sabha
    answer: Municipal corporation
    difficulty: 2
    hints:
    - It is a local need in a city.
    - Gram Sabhas are for villages.
    solution: 'Step 1: water supply is a local service. Step 2: in a city, the municipal corporation manages it.'
    mistakes:
      Supreme Court: c6ss10_organ
      Gram Sabha: c6ss10_level
  - prompt: 'The Supreme Court is located in:'
    options:
    - New Delhi
    - Mumbai
    - Kolkata
    answer: New Delhi
    difficulty: 1
    hints:
    - It is in the national capital.
    - Parliament is in the same city.
    solution: 'Step 1: the Supreme Court serves the whole country. Step 2: it sits in the capital, New Delhi.'
    mistakes:
      Mumbai: c6ss10_level
      Kolkata: c6ss10_level
  - prompt: Which is a job of the legislature, not the judiciary?
    options:
    - Passing a new law on road safety
    - Deciding a case in court
    - Sentencing a thief
    answer: Passing a new law on road safety
    difficulty: 3
    hints:
    - Courts decide cases.
    - Which one creates a law?
    solution: 'Step 1: deciding cases and sentencing are court work. Step 2: passing a new law is the legislature''s job.'
    mistakes:
      Deciding a case in court: c6ss10_organ
      Sentencing a thief: c6ss10_organ
  - prompt: How many organs of government are there?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Make laws, carry them out, judge.
    - Count them.
    solution: 'Step 1: legislature, executive, judiciary. Step 2: that is 3.'
    mistakes:
      '2': c6ss10_organ
      '4': c6ss10_organ
