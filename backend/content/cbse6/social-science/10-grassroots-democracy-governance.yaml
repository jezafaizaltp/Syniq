# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 10. Format: content/README.md.
subject: cbse6-ss
chapter: 10
title: 'Grassroots Democracy Part 1: Governance'
tips:
  c6ss_organs: Legislature makes laws, executive carries them out, judiciary settles disputes and checks laws are followed.
concepts:
- code: cbse6ss.gov.democracy
  title: Governance and democracy
  notes: |
    Governance means how decisions are made and carried out for a group, from a school class to a country. Rules and
    laws are needed for order and fairness. Democracy: government by the people: citizens elect representatives; every
    adult (18+) has one vote; people can question and change leaders through elections. Ancient roots: assemblies like
    sabha and samiti; Uttaramerur inscriptions (Tamil Nadu, about 10th century) describe village elections.
  explanations:
    text: Governance is how a group makes and carries out decisions, whether it's a class, a village or a country. In a democracy, the people choose their leaders by voting. Every adult citizen, 18 or older, has one vote, and leaders must answer to the people.
    visual: 'Picture a class electing a monitor: candidates speak, everyone votes secretly, votes are counted and the winner leads, but can be replaced next term.'
    step_by_step: 'Step 1: Who makes the decisions? Step 2: How are they chosen? Step 3: If the people choose by voting and can change leaders, it is a democracy.'
    real_world: In India's general elections, nearly a billion voters choose their Members of Parliament, the largest election in the world.
  picture:
    kind: flow
    steps:
    - Citizens vote
    - Representatives elected
    - They make decisions
    - Citizens question them
    - 'Next election: keep or change'
    alt: In a democracy, citizens elect representatives who decide, answer to the people and can be changed at the next election.
  items:
  - prompt: 'In a democracy, leaders are chosen by:'
    options:
    - the people through voting
    - birth only
    - the army
    - a lottery
    answer: the people through voting
    difficulty: 1
    hints:
    - Elections.
    - Votes.
    solution: People elect leaders.
  - prompt: At what age can an Indian citizen vote?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - Adult.
    - Voting age.
    solution: 18 years.
  - prompt: Why do groups need rules?
    options:
    - For order and fairness
    - To punish everyone
    - To stop all games
    - No reason
    answer: For order and fairness
    difficulty: 1
    hints:
    - Think of a game without rules.
    - Fairness.
    solution: Rules keep order and fairness.
  - prompt: 'Ancient inscriptions describing village elections were found at:'
    options:
    - Uttaramerur
    - Mohenjo-daro
    - Lothal
    - Delhi
    answer: Uttaramerur
    difficulty: 2
    hints:
    - Tamil Nadu.
    - About 10th century.
    solution: Uttaramerur inscriptions describe village elections.
  - prompt: '''Governance'' means:'
    options:
    - how decisions are made and carried out
    - only playing games
    - building houses
    - doing homework
    answer: how decisions are made and carried out
    difficulty: 1
    hints:
    - Govern = guide.
    - Decisions.
    solution: Governance is making and carrying out decisions.
  - prompt: 'Each adult citizen in India has:'
    options:
    - one vote
    - ten votes
    - no vote
    - votes based on wealth
    answer: one vote
    difficulty: 2
    hints:
    - Equality.
    - Universal adult franchise.
    solution: Each adult has one equal vote.
- code: cbse6ss.gov.organs
  title: Organs and levels of government
  after:
  - cbse6ss.gov.democracy
  notes: |
    Three organs (branches) of government: legislature (makes laws: Parliament, State Legislative Assemblies), executive
    (carries out laws: Prime Minister/Chief Minister, ministers, government officials), judiciary (courts: settle
    disputes, interpret laws; Supreme Court at the top). Separation of powers keeps balance. Three levels: central (union,
    for the whole country), state, and local (panchayats in villages, municipalities in towns and cities).
  explanations:
    text: 'Government has three parts. The legislature makes laws. The executive carries them out. The judiciary, the courts, settles disputes and checks that laws are followed. Government also works at three levels: the central government for the whole country, state governments and local governments in villages and towns.'
    visual: 'Draw a building with three pillars: ''Make laws'' (legislature), ''Carry out laws'' (executive), ''Judge disputes'' (judiciary). Under it, three floors: Central, State, Local.'
    step_by_step: 'Step 1: Identify the task: making, carrying out or judging laws. Step 2: Name the organ. Step 3: Identify the area: whole country, state or village/town. Step 4: Name the level.'
    real_world: Parliament passes a law, the government's departments put it into action, and if people disagree about it, courts decide.
  picture:
    kind: compare
    columns:
    - title: Organ
      points:
      - Legislature
      - Executive
      - Judiciary
    - title: Job
      points:
      - makes laws
      - carries out laws
      - settles disputes
    alt: The legislature makes laws, the executive carries them out and the judiciary settles disputes.
  items:
  - prompt: Which organ of government makes laws?
    options:
    - Legislature
    - Executive
    - Judiciary
    - Police
    answer: Legislature
    difficulty: 1
    hints:
    - Parliament.
    - Law-making.
    solution: The legislature makes laws.
    mistakes:
      Executive: c6ss_organs
  - prompt: Courts belong to which organ?
    options:
    - Judiciary
    - Legislature
    - Executive
    - Panchayat
    answer: Judiciary
    difficulty: 1
    hints:
    - Judges.
    - Justice.
    solution: Courts are the judiciary.
  - prompt: 'The executive''s job is to:'
    options:
    - carry out laws
    - make laws
    - judge cases
    - vote in elections
    answer: carry out laws
    difficulty: 1
    hints:
    - Ministers and officials.
    - Action.
    solution: The executive implements laws.
    mistakes:
      make laws: c6ss_organs
  - prompt: How many levels of government are there in India (central, state, local)?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Count them.
    - Three.
    solution: Three levels.
  - prompt: A village panchayat is part of which level of government?
    options:
    - Local
    - Central
    - State
    - International
    answer: Local
    difficulty: 1
    hints:
    - Closest to people.
    - Village.
    solution: Panchayats are local government.
  - prompt: 'The highest court in India is the:'
    options:
    - Supreme Court
    - High Court of Kerala
    - District Court
    - Gram Sabha
    answer: Supreme Court
    difficulty: 2
    hints:
    - In New Delhi.
    - Top of judiciary.
    solution: The Supreme Court is the highest court.
