    - Which finds show that kind of order?
    solution: Streets laid out in a grid, bricks all of one size and drains along every street do not happen by chance. They show that the cities were planned.
    mistakes:
      Seals carved with pictures of animals: c6ss6_plan
      A script that nobody can read yet: c6ss6_plan
    exam: competency
