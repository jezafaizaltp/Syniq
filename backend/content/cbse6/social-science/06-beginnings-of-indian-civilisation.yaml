concepts:
- code: cbse6ss.harappa.cities
  title: The Harappan (Sindhu-Sarasvati) cities
  notes: |
    One of the world's earliest civilisations grew in the north-west of the subcontinent: the Harappan or
    Sindhu-Sarasvati civilisation; mature phase about 2600–1900 BCE. Cities: Harappa and Mohenjo-daro (Pakistan),
    Dholavira (water reservoirs) and Lothal (dockyard) in Gujarat, Rakhigarhi (Haryana), Kalibangan (Rajasthan). Features:
    planned streets in a grid, baked brick houses, covered drains, wells, the Great Bath (Mohenjo-daro), granaries, a
    citadel. Seals with animals (unicorn) and a script not yet deciphered.
  explanations:
    text: About 4,500 years ago, great cities grew along the Sindhu and Sarasvati rivers. Harappa, Mohenjo-daro, Dholavira and Lothal had straight streets, brick houses, covered drains and wells. They used seals with animal pictures and a script nobody can read yet.
    visual: 'Picture a city from above: straight streets crossing at right angles, rows of brick houses, drains with covers along each street, a big bath in the centre and a dockyard by the water at Lothal.'
    step_by_step: 'Step 1: Note where the cities were. Step 2: List what was planned: streets, drains, houses. Step 3: Note special buildings: Great Bath, dockyard, reservoirs. Step 4: Note what remains a mystery: the script.'
    real_world: Dholavira in Gujarat, with its clever water reservoirs, became a UNESCO World Heritage Site in 2021.
  picture:
    kind: compare
    columns:
    - title: City
      points:
      - Mohenjo-daro
      - Lothal
      - Dholavira
    - title: Famous for
      points:
      - the Great Bath
      - a dockyard
      - water reservoirs
    alt: Mohenjo-daro is famous for the Great Bath, Lothal for its dockyard and Dholavira for its water reservoirs.
  activity:
    type: sort
    prompt: Which Harappan site?
    bins:
    - Mohenjo-daro
    - Lothal
    - Dholavira
    - Kalibangan
    items:
    - label: The Great Bath
      bin: Mohenjo-daro
      clue: In Pakistan.
      why: Mohenjo-daro.
    - label: A dockyard
      bin: Lothal
      clue: Gujarat port.
      why: Lothal.
    - label: Large water reservoirs
      bin: Dholavira
      clue: In Kachchh.
      why: Dholavira.
    - label: In Rajasthan
      bin: Kalibangan
      clue: Ploughed fields found.
      why: Kalibangan.
  items:
  - prompt: 'The Harappan civilisation grew along the:'
    options:
    - Sindhu and Sarasvati rivers
    - Kaveri and Krishna
    - Nile
    - Ganga only
    answer: Sindhu and Sarasvati rivers
    difficulty: 1
    hints:
    - North-west.
    - Indus.
    solution: It grew along the Sindhu and Sarasvati.
    mistakes: {"Kaveri and Krishna": "s6_harappa_rivers", "Nile": "s6_harappa_rivers"}
  - prompt: Which Harappan site had a dockyard?
    options:
