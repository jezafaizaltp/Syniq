# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 6. Format: content/README.md.
subject: cbse6-ss
chapter: 6
title: The Beginnings of Indian Civilisation
tips:
  c6ss_harappa_script: The Harappan script has been found on seals, but nobody has yet been able to read (decipher) it.
  s6_after_decline: "People don't vanish. Where did they go?"
  s6_cotton: "Which crop gives fibre for cloth?"
  s6_dancing_girl: "The famous bronze from Mohenjo-daro is a small figure of a young woman standing as if dancing."
  s6_great_bath: "Lothal had the dockyard. Where was the Great Bath?"
  s6_harappa_decline: "There were no aeroplanes or cars then. What natural change could empty cities?"
  s6_harappa_rivers: "The Nile is in Egypt. Which rivers flow through north-west India and Pakistan?"
  s6_harappan_drains: "Harappan cities were carefully planned."
  s6_lothal: "Mohenjo-daro had the Great Bath. Which Gujarat site was a port?"
  s6_mature_span: "In BCE, subtract: 2600 − 1900."
  s6_mesopotamia: "Harappans traded west across the Arabian Sea, not to America or Japan."
  s6_standard_weights: "Fair trade needs weights everyone agrees on."
  c6ss6_site: 'Link each site to what made it famous: a bath, a dockyard, reservoirs, or being the first site found.'
  c6ss6_state: Recall which modern state or country each Harappan city lies in today.
  c6ss6_plan: 'Think about what the town planners built and what materials they had more than 4,000 years ago.'
  c6ss6_work: Think about what Harappans grew, made and traded, and with whom.
  c6ss6_decline: 'Think about water: what happens to farming towns when rains fail or a river dries up?'
  c6ss6_span: For two BCE dates, take the smaller number from the bigger.
concepts:
- code: cbse6ss.harappa.cities
  title: The Harappan (Sindhu-Sarasvati) cities
  notes: |
    One of the world's earliest civilisations grew in the north-west of the subcontinent: the Harappan or
    Sindhu-Sarasvati civilisation; mature phase about 2600–1900 BCE. Cities: Harappa and Mohenjo-daro (Pakistan),
    Dholavira (water reservoirs) and Lothal (dockyard) in Gujarat, Rakhigarhi (Haryana), Kalibangan (Rajasthan). Features:
    planned streets in a grid, baked brick houses, covered drains, wells, the Great Bath (Mohenjo-daro), granaries, a
    citadel. Seals with animals (unicorn) and a script not yet deciphered.
  explanations:
    text: About 4,500 years ago, great cities grew along the Sindhu and Sarasvati rivers. Harappa, Mohenjo-daro, Dholavira and Lothal had straight streets, brick houses, covered drains and wells. They used seals with animal pictures and a script nobody can read yet.
    visual: 'Picture a city from above: straight streets crossing at right angles, rows of brick houses, drains with covers along each street, a big bath in the centre and a dockyard by the water at Lothal.'
    step_by_step: 'Step 1: Note where the cities were. Step 2: List what was planned: streets, drains, houses. Step 3: Note special buildings: Great Bath, dockyard, reservoirs. Step 4: Note what remains a mystery: the script.'
    real_world: Dholavira in Gujarat, with its clever water reservoirs, became a UNESCO World Heritage Site in 2021.
  picture:
    kind: compare
    columns:
    - title: City
      points:
      - Mohenjo-daro
      - Lothal
      - Dholavira
    - title: Famous for
      points:
      - the Great Bath
      - a dockyard
      - water reservoirs
    alt: Mohenjo-daro is famous for the Great Bath, Lothal for its dockyard and Dholavira for its water reservoirs.
  activity:
    type: sort
    prompt: Which Harappan site?
    bins:
    - Mohenjo-daro
    - Lothal
    - Dholavira
    - Kalibangan
    items:
    - label: The Great Bath
      bin: Mohenjo-daro
      clue: In Pakistan.
      why: Mohenjo-daro.
    - label: A dockyard
      bin: Lothal
      clue: Gujarat port.
      why: Lothal.
    - label: Large water reservoirs
      bin: Dholavira
      clue: In Kachchh.
      why: Dholavira.
    - label: In Rajasthan
      bin: Kalibangan
      clue: Ploughed fields found.
      why: Kalibangan.
  lesson:
    - teach: Over 4,500 years ago one of the world's first civilisations grew in the north-west of our subcontinent, along the Sindhu and Sarasvati rivers. It is called the Harappan or Sindhu-Sarasvati civilisation. Its mature phase lasted from about 2600 to 1900 BCE.
      check:
        prompt: Why is it called the Harappan civilisation?
        options:
        - Harappa was the first of its cities to be found
        - A king named Harappa ruled it
        - It means 'rainy land'
        answer: Harappa was the first of its cities to be found
        why: Civilisations are often named after the first site discovered.
    - teach: Its cities were carefully planned. Streets crossed at right angles in a grid, houses were of baked bricks, and covered drains ran along the streets. Many cities had a raised citadel and a lower town.
      picture:
        kind: compare
        columns:
        - title: Citadel (raised)
          points:
          - big buildings
          - Great Bath
          - granary
        - title: Lower town
          points:
          - houses of baked brick
          - grid streets
          - covered drains
        alt: A Harappan city had a raised citadel with big buildings and a lower town with brick houses, grid streets and drains.
      check:
        prompt: What did covered drains show about Harappans?
        options:
        - They cared about cleanliness and planning
        - They had no water
        - They lived in tents
        answer: They cared about cleanliness and planning
        why: Covered drains needed careful planning and kept streets clean.
    - teach: 'Famous sites: Harappa and Mohenjo-daro (in Pakistan today), Dholavira with large water reservoirs and Lothal with a dockyard (both in Gujarat), Rakhigarhi (Haryana) and Kalibangan (Rajasthan). They made seals with animals like the ''unicorn'' and wrote in a script nobody can read yet.'
      check:
        prompt: Which Gujarat site is known for its water reservoirs?
        options:
        - Dholavira
        - Harappa
        - Rakhigarhi
        answer: Dholavira
        why: Dholavira stored rainwater in big reservoirs.
  items:
  - prompt: 'The Harappan civilisation grew along the:'
    options:
    - Sindhu and Sarasvati rivers
    - Kaveri and Krishna
    - Nile
    - Ganga only
    answer: Sindhu and Sarasvati rivers
    difficulty: 1
    hints:
    - North-west.
    - Indus.
    solution: It grew along the Sindhu and Sarasvati.
    mistakes: {"Kaveri and Krishna": "s6_harappa_rivers", "Nile": "s6_harappa_rivers"}
  - prompt: Which Harappan site had a dockyard?
    options:
    - Lothal
    - Harappa
    - Kalibangan
    - Rakhigarhi
    answer: Lothal
    difficulty: 1
    hints:
    - Gujarat.
    - Boats.
    solution: Lothal had a dockyard.
    mistakes: {"Harappa": "s6_lothal"}
  - prompt: 'The Great Bath was found at:'
    options:
    - Mohenjo-daro
    - Lothal
    - Dholavira
    - Delhi
    answer: Mohenjo-daro
    difficulty: 1
    hints:
    - Pakistan.
    - Large tank.
    solution: The Great Bath is at Mohenjo-daro.
    mistakes: {"Lothal": "s6_great_bath"}
  - prompt: 'Harappan streets were:'
    options:
    - planned in a grid with covered drains
    - narrow and winding with no drains
    - made of glass
    - only dirt paths
    answer: planned in a grid with covered drains
    difficulty: 1
    hints:
    - Town planning.
    - Straight lines.
    solution: Streets were planned in a grid with drains.
    mistakes: {"narrow and winding with no drains": "s6_harappan_drains"}
  - prompt: Can we read the Harappan script today?
    options:
    - No, it is not yet deciphered
    - Yes, easily
    - Only in Sanskrit
    - It was never written
    answer: No, it is not yet deciphered
    difficulty: 2
    hints:
    - Seen on seals.
    - A mystery.
    solution: The script has not been deciphered.
    mistakes:
      Yes, easily: c6ss_harappa_script
  - prompt: The mature Harappan phase lasted from about 2600 BCE to 1900 BCE. About how many years is that?
    answer: '700'
    check: 2600 - 1900
    difficulty: 2
    hints:
    - 'Both BCE: subtract.'
    - 2600 − 1900.
    solution: 2600 − 1900 = 700 years.
    mistakes: {"4500": "s6_mature_span", "600": "s6_mature_span"}
  - prompt: Rakhigarhi, one of the largest Harappan sites, is in which state?
    options:
    - Haryana
    - Kerala
    - Assam
    answer: Haryana
    difficulty: 2
    hints:
    - It is in north-west India.
    - Near Delhi.
    solution: 'Step 1: Rakhigarhi is in north-west India. Step 2: it is in Haryana.'
    mistakes:
      Kerala: c6ss6_state
      Assam: c6ss6_state
  - prompt: 'Kalibangan is a Harappan site in:'
    options:
    - Rajasthan
    - Tamil Nadu
    - Bihar
    answer: Rajasthan
    difficulty: 2
    hints:
    - It is near the dried Ghaggar river.
    - A desert state.
    solution: 'Step 1: Kalibangan lies on the Ghaggar in the north-west. Step 2: that is in Rajasthan.'
    mistakes:
      Tamil Nadu: c6ss6_state
      Bihar: c6ss6_state
  - prompt: Harappa and Mohenjo-daro are in which country today?
    options:
    - Pakistan
    - India
    - Nepal
    answer: Pakistan
    difficulty: 1
    hints:
    - They are on the Indus.
    - West of today's India.
    solution: 'Step 1: both cities are on the Indus river system. Step 2: today that area is in Pakistan.'
    mistakes:
      India: c6ss6_state
      Nepal: c6ss6_state
  - prompt: 'Harappan houses were mostly built of:'
    options:
    - Baked bricks
    - Steel
    - Glass
    answer: Baked bricks
    difficulty: 1
    hints:
    - Clay was shaped and fired.
    - Steel and glass came much later.
    solution: 'Step 1: Harappans fired clay bricks in kilns. Step 2: houses were built of these baked bricks.'
    mistakes:
      Steel: c6ss6_plan
      Glass: c6ss6_plan
  - prompt: What was the 'citadel' in a Harappan city?
    options:
    - A raised part with important buildings
    - A market boat
    - A burial ground
    answer: A raised part with important buildings
    difficulty: 2
    hints:
    - It stood higher than the rest.
    - Big buildings like the Great Bath were there.
    solution: 'Step 1: cities had a high mound and a lower town. Step 2: the high part with big buildings is the citadel.'
    mistakes:
      A market boat: c6ss6_plan
      A burial ground: c6ss6_plan
  - prompt: Which animal is famous on Harappan seals, though it may not be real?
    options:
    - The 'unicorn'
    - The kangaroo
    - The penguin
    answer: The 'unicorn'
    difficulty: 1
    hints:
    - It looks like a bull with one horn.
    - It appears on many seals.
    solution: 'Step 1: many seals show a one-horned animal. Step 2: it is called the ''unicorn''.'
    mistakes:
      The kangaroo: c6ss6_site
      The penguin: c6ss6_site
  - prompt: 'Harappan streets crossing at right angles show that the cities were:'
    options:
    - Planned
    - Built randomly
    - Temporary camps
    answer: Planned
    difficulty: 1
    hints:
    - Straight streets in a grid need a plan.
    - Random building gives crooked lanes.
    solution: 'Step 1: a grid of straight streets needs planning. Step 2: so the cities were planned.'
    mistakes:
      Built randomly: c6ss6_plan
      Temporary camps: c6ss6_plan
  - prompt: Why do historians know less about Harappan ideas than about Ashoka's?
    options:
    - We cannot yet read the Harappan script
    - Harappans had no cities
    - Ashoka lived earlier
    answer: We cannot yet read the Harappan script
    difficulty: 3
    hints:
    - Ashoka's inscriptions can be read.
    - What about Harappan writing?
    solution: 'Step 1: Ashoka''s edicts have been deciphered. Step 2: the Harappan script has not, so their own words are a mystery.'
    mistakes:
      Harappans had no cities: c6ss6_plan
      Ashoka lived earlier: c6ss6_span
  - prompt: 'The Great Bath was probably used for:'
    options:
    - Special bathing, perhaps for rituals
    - Storing grain
    - Building ships
    answer: Special bathing, perhaps for rituals
    difficulty: 2
    hints:
    - It was a large, waterproof tank.
    - Steps led down into it.
    solution: 'Step 1: it was a big tank with steps and waterproof bricks. Step 2: scholars think it was for special or ritual bathing.'
    mistakes:
      Storing grain: c6ss6_site
      Building ships: c6ss6_site
- code: cbse6ss.harappa.life
  title: Life, trade and decline
  after:
  - cbse6ss.harappa.cities
  notes: |
    Harappans farmed (wheat, barley, millets, cotton), kept animals, made beads, pottery, bronze tools and figurines
    (the 'dancing girl'), used standard weights and measures. They traded with Mesopotamia (by sea, from ports like
    Lothal). From about 1900 BCE the cities declined: likely climate change, weaker monsoons, the Sarasvati (Ghaggar-
    Hakra) drying up, floods; people moved to villages east and south. Much of their culture continued (bangles, weights,
    farming ways).
  explanations:
    text: Harappan people farmed wheat, barley and cotton, made beads, pots and bronze figures, and used standard weights. They traded by sea with faraway lands like Mesopotamia. Around 1900 BCE the cities slowly emptied, probably because the climate changed and rivers dried up. Many of their ways carried on in villages.
    visual: 'Picture a market: a farmer with barley, a bead-maker drilling stones, a trader weighing goods with cubical stone weights, and a boat leaving Lothal for the sea.'
    step_by_step: 'Step 1: List what they grew and made. Step 2: Note how they traded. Step 3: Look at the reasons for decline. Step 4: Note what continued afterwards.'
    real_world: Some bangles and weight systems used in Indian villages today are similar to Harappan ones.
  picture:
    kind: flow
    steps:
    - Cities flourish (2600 BCE)
    - Trade by land and sea
    - Climate changes, rivers dry
    - Cities decline (from 1900 BCE)
    - People move to villages
    alt: Harappan cities flourished and traded, then declined as the climate changed and rivers dried, and people moved to villages.
  activity:
    type: order
    prompt: The Harappan story. Put it in order.
    steps:
    - Farming villages grow wheat and barley
    - Planned cities rise (about 2600 BCE)
    - Trade with Mesopotamia from ports like Lothal
    - Climate changes and the Sarasvati dries up (after 1900 BCE)
    - People move to villages east and south
    reasons:
      Planned cities rise (about 2600 BCE): Villages had to produce extra food before cities could grow.
      Trade with Mesopotamia from ports like Lothal: Trade grew once the cities were rich and organised.
      Climate changes and the Sarasvati dries up (after 1900 BCE): These changes came at the end of the mature phase.
      People move to villages east and south: They left the cities as water and trade failed.
  lesson:
    - teach: Harappans were farmers and craftspeople. They grew wheat, barley, millets and cotton, and kept cattle and sheep. They made beads, pottery, bronze tools and figurines like the 'dancing girl', and used standard weights for trade.
      check:
        prompt: Why were standard weights useful?
        options:
        - Traders everywhere measured goods the same way
        - They were toys
        - They kept doors shut
        answer: Traders everywhere measured goods the same way
        why: Fair trade needs the same measures.
    - teach: They traded with faraway lands. Ships sailed from ports like Lothal to Mesopotamia (in today's Iraq), carrying beads, cotton and other goods.
      picture:
        kind: flow
        steps:
        - Craftspeople make beads, cloth
        - Goods carried to Lothal
        - Ships sail west
        - Mesopotamia
        alt: Harappan goods were carried to ports like Lothal and shipped west to Mesopotamia.
      check:
        prompt: Mesopotamia is in which region today?
        options:
        - West Asia (Iraq)
        - South India
        - Europe
        answer: West Asia (Iraq)
        why: Mesopotamia lay between the Tigris and Euphrates, in today's Iraq.
    - teach: 'From about 1900 BCE the big cities declined. Likely causes: climate change, weaker monsoons, the Sarasvati (Ghaggar-Hakra) drying up, and floods. People moved to villages to the east and south, and many Harappan ways, like bangles, weights and farming, continued.'
      picture:
        kind: flow
        steps:
        - Weaker rains
        - River dries up
        - Less food
        - People move to villages
        alt: Weaker rains and a drying river meant less food, so people left the cities for villages.
      check:
        prompt: Did Harappan culture vanish completely?
        options:
        - No, many ways continued in villages
        - Yes, it disappeared overnight
        - Yes, everyone left the subcontinent
        answer: No, many ways continued in villages
        why: Bangles, weights and farming methods carried on.
  items:
  - prompt: Which crop did Harappans grow to make cloth?
    options:
    - Cotton
    - Tea
    - Coffee
    - Rubber
    answer: Cotton
    difficulty: 1
    hints:
    - Spun into thread.
    - Clothes.
    solution: They grew cotton.
    mistakes: {"Rubber": "s6_cotton"}
  - prompt: 'Harappans traded by sea with:'
    options:
    - Mesopotamia
    - Japan
    - America
    - Australia
    answer: Mesopotamia
    difficulty: 1
