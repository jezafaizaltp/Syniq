      About 500 CE: c6ss6_span
  - prompt: Which river, now mostly dry, is linked with the Harappan decline?
    options:
    - Sarasvati (Ghaggar-Hakra)
    - Kaveri
    - Brahmaputra
    answer: Sarasvati (Ghaggar-Hakra)
    difficulty: 2
    hints:
    - It flowed in the north-west.
    - The civilisation is named after it too.
    solution: 'Step 1: the civilisation is named Sindhu-Sarasvati. Step 2: the Sarasvati (Ghaggar-Hakra) dried up, hurting towns along it.'
    mistakes:
      Kaveri: c6ss6_decline
      Brahmaputra: c6ss6_decline
  - prompt: How many years before 1900 BCE did the mature Harappan phase begin (at 2600 BCE)?
    answer: '700'
    check: 2600-1900
    difficulty: 2
    hints:
    - Both are BCE.
    - Subtract the smaller number.
    solution: 'Step 1: 2600 − 1900. Step 2: = 700 years.'
    mistakes:
      '4500': c6ss6_span
      '600': c6ss6_span
  - prompt: Why would weaker monsoons hurt Harappan cities?
    options:
    - Less rain meant poorer harvests and less food
