    solution: The Great Bath is at Mohenjo-daro.
    mistakes: {"Lothal": "s6_great_bath"}
  - prompt: 'Harappan streets were:'
    options:
    - planned in a grid with covered drains
    - narrow and winding with no drains
    - made of glass
    - only dirt paths
    answer: planned in a grid with covered drains
    difficulty: 1
    hints:
    - Town planning.
    - Straight lines.
    solution: Streets were planned in a grid with drains.
    mistakes: {"narrow and winding with no drains": "s6_harappan_drains"}
  - prompt: Can we read the Harappan script today?
    options:
    - No, it is not yet deciphered
    - Yes, easily
    - Only in Sanskrit
    - It was never written
    answer: No, it is not yet deciphered
    difficulty: 2
    hints:
    - Seen on seals.
    - A mystery.
    solution: The script has not been deciphered.
    mistakes:
      Yes, easily: c6ss_harappa_script
  - prompt: The mature Harappan phase lasted from about 2600 BCE to 1900 BCE. About how many years is that?
    answer: '700'
    check: 2600 - 1900
    difficulty: 2
    hints:
    - 'Both BCE: subtract.'
    - 2600 − 1900.
    solution: 2600 − 1900 = 700 years.
    mistakes: {"4500": "s6_mature_span", "600": "s6_mature_span"}
- code: cbse6ss.harappa.life
  title: Life, trade and decline
  after:
  - cbse6ss.harappa.cities
  notes: |
    Harappans farmed (wheat, barley, millets, cotton), kept animals, made beads, pottery, bronze tools and figurines
    (the 'dancing girl'), used standard weights and measures. They traded with Mesopotamia (by sea, from ports like
    Lothal). From about 1900 BCE the cities declined: likely climate change, weaker monsoons, the Sarasvati (Ghaggar-
    Hakra) drying up, floods; people moved to villages east and south. Much of their culture continued (bangles, weights,
    farming ways).
  explanations:
    text: Harappan people farmed wheat, barley and cotton, made beads, pots and bronze figures, and used standard weights. They traded by sea with faraway lands like Mesopotamia. Around 1900 BCE the cities slowly emptied, probably because the climate changed and rivers dried up. Many of their ways carried on in villages.
    visual: 'Picture a market: a farmer with barley, a bead-maker drilling stones, a trader weighing goods with cubical stone weights, and a boat leaving Lothal for the sea.'
    step_by_step: 'Step 1: List what they grew and made. Step 2: Note how they traded. Step 3: Look at the reasons for decline. Step 4: Note what continued afterwards.'
    real_world: Some bangles and weight systems used in Indian villages today are similar to Harappan ones.
  picture:
    kind: flow
    steps:
    - Cities flourish (2600 BCE)
    - Trade by land and sea
    - Climate changes, rivers dry
    - Cities decline (from 1900 BCE)
    - People move to villages
    alt: Harappan cities flourished and traded, then declined as the climate changed and rivers dried, and people moved to villages.
  activity:
    type: order
    prompt: The Harappan story. Put it in order.
    steps:
    - Farming villages grow wheat and barley
    - Planned cities rise (about 2600 BCE)
    - Trade with Mesopotamia from ports like Lothal
    - Climate changes and the Sarasvati dries up (after 1900 BCE)
    - People move to villages east and south
    reasons:
      Planned cities rise (about 2600 BCE): Villages had to produce extra food before cities could grow.
      Trade with Mesopotamia from ports like Lothal: Trade grew once the cities were rich and organised.
      Climate changes and the Sarasvati dries up (after 1900 BCE): These changes came at the end of the mature phase.
      People move to villages east and south: They left the cities as water and trade failed.
  items:
  - prompt: Which crop did Harappans grow to make cloth?
    options:
    - Cotton
    - Tea
    - Coffee
    - Rubber
    answer: Cotton
    difficulty: 1
    hints:
    - Spun into thread.
    - Clothes.
    solution: They grew cotton.
    mistakes: {"Rubber": "s6_cotton"}
  - prompt: 'Harappans traded by sea with:'
    options:
    - Mesopotamia
    - Japan
    - America
    - Australia
    answer: Mesopotamia
    difficulty: 1
    hints:
    - West Asia.
    - Iraq today.
    solution: They traded with Mesopotamia.
    mistakes: {"America": "s6_mesopotamia"}
  - prompt: 'The famous bronze figure from Mohenjo-daro is called the:'
    options:
    - Dancing girl
    - Priest king of Delhi
    - Lion of Ashoka
    - Great Buddha
    answer: Dancing girl
    difficulty: 2
    hints:
    - A small statue.
    - Bronze.
    solution: It is known as the 'dancing girl'.
    mistakes: {"Great Buddha": "s6_dancing_girl"}
  - prompt: Which is a likely reason for the decline of Harappan cities?
    options:
    - Climate change and rivers drying up
    - Invasion by aeroplanes
    - Too many computers
    - Overpopulation of cars
    answer: Climate change and rivers drying up
    difficulty: 1
    hints:
    - Weaker monsoons.
    - Sarasvati dried.
    solution: Climate change and drying rivers likely caused decline.
    mistakes: {"Invasion by aeroplanes": "s6_harappa_decline"}
  - prompt: 'Harappans used weights that were:'
    options:
    - standard in size
    - all different
    - made of plastic
    - never used
    answer: standard in size
    difficulty: 2
    hints:
    - Fair trade needs this.
    - Cubical stones.
    solution: They used standard weights.
    mistakes: {"all different": "s6_standard_weights"}
  - prompt: 'After the decline, many Harappans:'
    options:
    - moved to villages east and south
    - disappeared completely
    - went to the Moon
    - stopped farming
    answer: moved to villages east and south
    difficulty: 2
    hints:
    - Culture continued.
    - Moved.
    solution: People moved to smaller settlements and their ways continued.
    mistakes: {"disappeared completely": "s6_after_decline"}
