# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 5. Format: content/README.md.
subject: cbse6-ss
chapter: 5
title: India, That is Bharat
tips:
  c6ss_names: '''India'' comes from the Sindhu (Indus) river via Persian and Greek. ''Bharat'' comes from ancient Indian texts. Both appear in Article 1 of the Constitution.'
  s6_article1: "'We the people' opens the Preamble. Article 1 gives the country's names."
  s6_bharata: "Bharata was the name of an early people in the oldest Veda."
  s6_dwarka: "Dwarka is in Gujarat, facing the Arabian Sea."
  s6_greeks: "The name comes from 'Sindhu' through the Persians to these western visitors."
  s6_hind: "The Persians said 'h' for 's'. What does Sindhu become?"
  s6_jambudvipa: "'Jambu' is the jamun tree and 'dvipa' means island or land."
  s6_pilgrim_unity: "Pilgrims travelled the whole land. What did they carry with them?"
  s6_puri: "Puri is in Odisha, facing the Bay of Bengal."
  s6_rameswaram: "Kashi and Prayag are in the north. Which pilgrimage site is at the southern tip?"
  s6_union_states: "India is made of many states joined together."
  s6_vishnu_purana: "Bharatavarsha lies north of the sea and south of the snow."
concepts:
- code: cbse6ss.bharat.names
  title: The many names of our land
  notes: |
    The Constitution, Article 1: "India, that is Bharat, shall be a Union of States." Old names: Bharata (from the
    Bharatas, a clan in the Rigveda; Bharatavarsha in the Puranas: land between the ocean and the Himalayas), Jambudvipa
    (land of the jamun tree, in texts and Ashoka's inscriptions). Sindhu (Indus river) became 'Hindu' in Persian →
    'Hind', 'Hindustan'; the Greeks said 'Indos'/'India'. Chinese travellers like Xuanzang used 'Yindu'.
  explanations:
    text: Our country has many names. The Constitution says 'India, that is Bharat'. Bharat comes from ancient Indian texts. Jambudvipa, 'land of the jamun tree', is another old name. 'India' and 'Hindustan' come from the Sindhu river, through Persian and Greek travellers.
    visual: 'Draw the Sindhu river. Arrows go from it: ''Sindhu'' → Persian ''Hindu'' → ''Hindustan''; and → Greek ''Indos'' → ''India''. Separately, ancient texts → ''Bharata''.'
    step_by_step: 'Step 1: Note the name. Step 2: Ask who used it: Indians, Persians, Greeks or Chinese. Step 3: Find what it comes from: a river, a clan or a tree.'
    real_world: 'Our passports say ''Bharat Ganarajya'' in Hindi and ''Republic of India'' in English: both names are official.'
  picture:
    kind: flow
    steps:
    - Sindhu river
    - 'Persian: ''Hindu'''
    - '''Hind'', ''Hindustan'''
    - 'Greek: ''Indos'''
    - '''India'''
    alt: How 'India' and 'Hindustan' came from the Sindhu river through Persian and Greek.
  activity:
    type: sort
    prompt: Where does the name come from?
    bins:
    - Bharata
    - Jambudvipa
    - Hind / India
    items:
    - label: A clan named in the Rigveda
      bin: Bharata
      clue: Bharatavarsha in the Puranas.
      why: Bharata.
    - label: '''India, that is Bharat'' in Article 1'
      bin: Bharata
      clue: The Constitution.
      why: Bharat.
    - label: Land of the jamun tree
      bin: Jambudvipa
      clue: Used in Ashoka's inscriptions.
      why: Jambudvipa.
    - label: Sindhu became 'Hindu' in Persian
      bin: Hind / India
      clue: From the river's name.
      why: Hind.
    - label: The Greeks said 'Indos'
      bin: Hind / India
      clue: From the river again.
      why: India.
  items:
  - prompt: 'Article 1 of the Constitution begins:'
    options:
    - India, that is Bharat
    - We the people
    - Hindustan is great
    - Jambudvipa forever
    answer: India, that is Bharat
    difficulty: 1
    hints:
    - Article 1.
    - Two names.
    solution: 'Article 1 says: ''India, that is Bharat, shall be a Union of States.'''
    mistakes: {"We the people": "s6_article1"}
  - prompt: The name 'India' comes from which river?
    options:
    - Sindhu (Indus)
    - Ganga
    - Kaveri
    - Brahmaputra
    answer: Sindhu (Indus)
    difficulty: 1
    hints:
    - In the north-west.
    - Indus.
    solution: '''India'' comes from the Sindhu river.'
    mistakes:
      Ganga: c6ss_names
  - prompt: '''Jambudvipa'' means:'
    options:
    - land of the jamun tree
    - land of rivers
    - land of snow
    - land of kings
    answer: land of the jamun tree
    difficulty: 1
    hints:
    - Jambu = jamun.
    - A fruit tree.
    solution: Jambudvipa means land of the jamun tree.
    mistakes: {"land of rivers": "s6_jambudvipa"}
  - prompt: Who called the land 'Indos' or 'India'?
    options:
    - The Greeks
    - The Chinese
    - The Vedic poets
    - The British only
    answer: The Greeks
    difficulty: 2
    hints:
    - Ancient travellers from the west.
    - Alexander's time.
    solution: The Greeks used 'Indos'/'India'.
    mistakes: {"The British only": "s6_greeks", "The Vedic poets": "s6_greeks"}
  - prompt: '''Bharata'' is linked to:'
    options:
    - a clan mentioned in the Rigveda
    - a river in Persia
    - a Greek king
    - a Chinese word
    answer: a clan mentioned in the Rigveda
    difficulty: 2
    hints:
    - Ancient Indian text.
    - The Bharatas.
    solution: The Bharatas were a clan in the Rigveda.
    mistakes: {"a Greek king": "s6_bharata"}
  - prompt: Which name did the Persians use, from 'Sindhu'?
    options:
    - Hind / Hindustan
    - Jambudvipa
    - Bharatavarsha
    - Yindu
    answer: Hind / Hindustan
    difficulty: 2
    hints:
    - S became H in Persian.
    - Hindu → Hind.
    solution: Persians said 'Hind', 'Hindustan'.
    mistakes: {"Bharatavarsha": "s6_hind"}
- code: cbse6ss.bharat.land
  title: Bharat as a land and a shared idea
  after:
  - cbse6ss.bharat.names
  notes: |
    Ancient texts (Vishnu Purana) describe Bharatavarsha as the land north of the ocean and south of the snowy mountains.
    Places across India were joined by pilgrimage routes (tirthas): Kashi, Prayag, Kanchipuram, Dwarka, Puri, Rameswaram.
    Traders and travellers crossed it. The idea of a single cultural land existed long before modern borders. Today India
    is a Union of States and Union Territories.
  explanations:
    text: Old Indian texts describe Bharat as the land between the southern ocean and the snowy Himalayas. Pilgrims and traders travelled across it, from Kashi to Rameswaram, which helped people feel it was one land with many regions.
    visual: Draw India with dots at Kashi, Prayag, Dwarka, Puri, Kanchipuram and Rameswaram, and dotted lines joining them like pilgrim routes.
    step_by_step: 'Step 1: Find the ancient description of the land. Step 2: Mark the boundaries named (ocean, Himalayas). Step 3: Find pilgrimage places in different regions. Step 4: See how travel joined them.'
    real_world: Many families still travel from Kerala to Kashi, or from the north to Rameswaram, following very old pilgrimage routes.
  picture:
    kind: compare
    columns:
    - title: Boundary in old texts
      points:
      - ocean to the south
      - Himalayas to the north
    - title: Places joined by pilgrims
      points:
      - Kashi, Prayag
      - Dwarka, Puri, Rameswaram
    alt: Old texts place Bharat between the southern ocean and the Himalayas, and pilgrim routes joined places like Kashi, Prayag, Dwarka, Puri and Rameswaram.
  activity:
    type: sort
    prompt: Which corner of India? (Pilgrimage places)
    bins:
    - North
    - South
    - East
    - West
    items:
    - label: Kashi (Varanasi)
      bin: North
      clue: On the Ganga.
      why: North.
    - label: Rameswaram
      bin: South
      clue: Near the tip of India.
      why: South.
    - label: Puri
      bin: East
      clue: Odisha's coast.
      why: East.
    - label: Dwarka
      bin: West
      clue: Gujarat's coast.
      why: West.
    - label: Kanchipuram
      bin: South
      clue: Tamil Nadu.
      why: South.
    - label: Prayag
      bin: North
      clue: Where rivers meet.
      why: North.
  items:
  - prompt: 'The Vishnu Purana describes Bharatavarsha as lying between:'
    options:
    - the ocean and the snowy mountains
    - two deserts
    - two rivers only
    - Persia and China
    answer: the ocean and the snowy mountains
    difficulty: 1
    hints:
    - South and north.
    - Himalayas.
    solution: Between the ocean in the south and the Himalayas in the north.
    mistakes: {"two deserts": "s6_vishnu_purana"}
  - prompt: Which place is a pilgrimage site in the far south of India?
    options:
    - Rameswaram
    - Kashi
    - Dwarka
    - Prayag
    answer: Rameswaram
    difficulty: 1
    hints:
    - Tamil Nadu.
    - Near Sri Lanka.
    solution: Rameswaram is in the far south.
    mistakes: {"Kashi": "s6_rameswaram"}
  - prompt: How did pilgrimage routes help join India together?
    options:
    - People travelled and shared ideas across regions
    - They built walls
    - They stopped trade
    - They divided regions
    answer: People travelled and shared ideas across regions
    difficulty: 2
    hints:
    - Movement of people.
    - Shared culture.
    solution: Travel spread shared stories and practices.
    mistakes: {"They divided regions": "s6_pilgrim_unity"}
  - prompt: 'Today India is officially a:'
    options:
    - Union of States
    - single city
    - kingdom
    - colony
    answer: Union of States
    difficulty: 1
    hints:
    - Article 1.
    - Many states together.
    solution: India is a Union of States.
    mistakes: {"kingdom": "s6_union_states"}
  - prompt: 'Dwarka, a pilgrimage town, is on India''s:'
    options:
    - west coast
    - east coast
    - northern mountains
    - central plateau
    answer: west coast
    difficulty: 2
    hints:
    - Gujarat.
    - Arabian Sea.
    solution: Dwarka is in Gujarat on the west coast.
    mistakes: {"east coast": "s6_dwarka"}
  - prompt: 'Puri, a famous temple town, is on the:'
    options:
    - east coast
    - west coast
    - Himalayas
    - Thar desert
    answer: east coast
    difficulty: 2
    hints:
    - Odisha.
    - Bay of Bengal.
    solution: Puri is in Odisha on the east coast.
    mistakes: {"west coast": "s6_puri"}
