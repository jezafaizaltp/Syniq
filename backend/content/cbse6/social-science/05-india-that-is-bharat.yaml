# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 5. Format: content/README.md.
subject: cbse6-ss
chapter: 5
title: India, That is Bharat
tips:
  c6ss_names: "Ganga gives us words like Gangetic. The name India came through Persian and Greek from a river in the north-west, the one the Harappan cities grew beside."
  s6_article1: "'We the people' opens the Preamble. Article 1 gives the country's names."
  s6_bharata: "Bharata was the name of an early people in the oldest Veda."
  s6_dwarka: "Dwarka is in Gujarat, facing the Arabian Sea."
  s6_greeks: "The name comes from 'Sindhu' through the Persians to these western visitors."
  s6_hind: "The Persians said 'h' for 's'. What does Sindhu become?"
  s6_jambudvipa: "'Jambu' is the jamun tree and 'dvipa' means island or land."
  s6_pilgrim_unity: "Pilgrims travelled the whole land. What did they carry with them?"
  s6_puri: "Puri is in Odisha, facing the Bay of Bengal."
  s6_rameswaram: "Kashi and Prayag are in the north. Which pilgrimage site is at the southern tip?"
  s6_union_states: "India is made of many states joined together."
  s6_vishnu_purana: "Bharatavarsha lies north of the sea and south of the snow."
  c6ss5_who: 'Link each name to the people who used it: our own old texts, the Persians, the Greeks or Chinese travellers.'
  c6ss5_river: Several outside names grew out of one great river in the north-west. Follow how its name changed in other languages.
  c6ss5_text: Recall which old text or inscription a name appears in.
  c6ss5_place: 'Picture the map of India and find the town on it. Which state is it in, and which side of the country is that?'
  c6ss5_idea: Think about how people from distant regions came to feel they shared one land long before modern borders.
concepts:
- code: cbse6ss.bharat.names
  title: The many names of our land
  notes: |
    The Constitution, Article 1: "India, that is Bharat, shall be a Union of States." Old names: Bharata (from the
    Bharatas, a clan in the Rigveda; Bharatavarsha in the Puranas: land between the ocean and the Himalayas), Jambudvipa
    (land of the jamun tree, in texts and Ashoka's inscriptions). Sindhu (Indus river) became 'Hindu' in Persian →
    'Hind', 'Hindustan'; the Greeks said 'Indos'/'India'. Chinese travellers like Xuanzang used 'Yindu'.
  explanations:
    text: Our country has many names. The Constitution says 'India, that is Bharat'. Bharat comes from ancient Indian texts. Jambudvipa, 'land of the jamun tree', is another old name. 'India' and 'Hindustan' come from the Sindhu river, through Persian and Greek travellers.
    visual: 'Draw the Sindhu river. Arrows go from it: ''Sindhu'' → Persian ''Hindu'' → ''Hindustan''; and → Greek ''Indos'' → ''India''. Separately, ancient texts → ''Bharata''.'
    step_by_step: 'Step 1: Note the name. Step 2: Ask who used it: Indians, Persians, Greeks or Chinese. Step 3: Find what it comes from: a river, a clan or a tree.'
    real_world: 'Our passports say ''Bharat Ganarajya'' in Hindi and ''Republic of India'' in English: both names are official.'
  picture:
    kind: flow
    steps:
    - Sindhu river
    - 'Persian: ''Hindu'''
    - '''Hind'', ''Hindustan'''
    - 'Greek: ''Indos'''
    - '''India'''
    alt: How 'India' and 'Hindustan' came from the Sindhu river through Persian and Greek.
  activity:
    type: sort
    prompt: Where does the name come from?
    bins:
    - Bharata
    - Jambudvipa
    - Hind / India
    items:
    - label: A clan named in the Rigveda
      bin: Bharata
      clue: Bharatavarsha in the Puranas.
      why: Bharata.
    - label: '''India, that is Bharat'' in Article 1'
      bin: Bharata
      clue: The Constitution.
      why: Bharat.
    - label: Land of the jamun tree
      bin: Jambudvipa
      clue: Used in Ashoka's inscriptions.
      why: Jambudvipa.
    - label: Sindhu became 'Hindu' in Persian
      bin: Hind / India
      clue: From the river's name.
      why: Hind.
    - label: The Greeks said 'Indos'
      bin: Hind / India
      clue: From the river again.
      why: India.
  lesson:
    - teach: 'Our Constitution begins with: ''India, that is Bharat, shall be a Union of States.'' So our country has two official names. ''Bharata'' is very old: the Bharatas were a clan in the Rigveda, and the Puranas call the land Bharatavarsha.'
      check:
        prompt: Which two names does Article 1 of the Constitution give our country?
        options:
        - India and Bharat
        - Hind and Indos
        - Jambudvipa and Yindu
        answer: India and Bharat
        why: Article 1 says 'India, that is Bharat'.
    - teach: Another old name is Jambudvipa, 'the land of the jamun tree'. It appears in old texts and in the Emperor Ashoka's inscriptions.
      check:
        prompt: 'Jambudvipa is named after a:'
        options:
        - Fruit tree
        - River
        - Mountain
        answer: Fruit tree
        why: Jambu is the jamun tree.
    - teach: People outside also named our land after the Sindhu (Indus) river. The Persians said 'Hindu', which led to 'Hind' and 'Hindustan'. The Greeks said 'Indos', which became 'India'. Chinese travellers like Xuanzang wrote 'Yindu'.
      picture:
        kind: flow
        steps:
        - Sindhu (river)
        - 'Persian: Hindu → Hind'
        - 'Greek: Indos → India'
        - 'Chinese: Yindu'
        alt: The river name Sindhu became Hind in Persian, India through Greek, and Yindu in Chinese.
      check:
        prompt: The name 'India' came to English through which language?
        options:
        - Greek
        - Tamil
        - Chinese
        answer: Greek
        why: The Greeks said Indos and India for the land of the Indus.
  items:
  - prompt: 'Article 1 of the Constitution begins:'
    options:
    - India, that is Bharat
    - We the people
    - Hindustan is great
    - Jambudvipa forever
    answer: India, that is Bharat
    difficulty: 1
    hints:
    - Article 1.
    - Two names.
    solution: 'Article 1 says: ''India, that is Bharat, shall be a Union of States.'''
    mistakes: {"We the people": "s6_article1"}
  - prompt: The name 'India' comes from which river?
    options:
    - Sindhu (Indus)
    - Ganga
    - Kaveri
    - Brahmaputra
    answer: Sindhu (Indus)
    difficulty: 1
    hints:
    - In the north-west.
    - Indus.
    solution: '''India'' comes from the Sindhu river.'
    mistakes:
      Ganga: c6ss_names
  - prompt: '''Jambudvipa'' means:'
    options:
    - land of the jamun tree
    - land of rivers
    - land of snow
    - land of kings
    answer: land of the jamun tree
    difficulty: 1
    hints:
    - Jambu = jamun.
    - A fruit tree.
    solution: Jambudvipa means land of the jamun tree.
    mistakes: {"land of rivers": "s6_jambudvipa"}
  - prompt: Who called the land 'Indos' or 'India'?
    options:
    - The Greeks
    - The Chinese
    - The Vedic poets
    - The British only
    answer: The Greeks
    difficulty: 2
    hints:
    - Ancient travellers from the west.
    - Alexander's time.
    solution: The Greeks used 'Indos'/'India'.
    mistakes: {"The British only": "s6_greeks", "The Vedic poets": "s6_greeks"}
  - prompt: '''Bharata'' is linked to:'
    options:
    - a clan mentioned in the Rigveda
    - a river in Persia
    - a Greek king
    - a Chinese word
    answer: a clan mentioned in the Rigveda
    difficulty: 2
    hints:
    - Ancient Indian text.
    - The Bharatas.
    solution: The Bharatas were a clan in the Rigveda.
    mistakes: {"a Greek king": "s6_bharata"}
  - prompt: Which name did the Persians use, from 'Sindhu'?
    options:
    - Hind / Hindustan
    - Jambudvipa
    - Bharatavarsha
    - Yindu
    answer: Hind / Hindustan
    difficulty: 2
    hints:
    - S became H in Persian.
    - Hindu → Hind.
    solution: Persians said 'Hind', 'Hindustan'.
    mistakes: {"Bharatavarsha": "s6_hind"}
  - prompt: Which Chinese traveller used the name 'Yindu' for India?
    options:
    - Xuanzang
    - Megasthenes
    - Ashoka
    answer: Xuanzang
    difficulty: 2
    hints:
    - He was a Buddhist monk from China.
    - Megasthenes was Greek and Ashoka was an Indian emperor.
    solution: 'Step 1: Megasthenes was Greek; Ashoka was a king. Step 2: Xuanzang, a Chinese monk, wrote ''Yindu''.'
    mistakes:
      Megasthenes: c6ss5_who
      Ashoka: c6ss5_who
  - prompt: '''Hindustan'' came from the name used by the:'
    options:
    - Persians
    - Greeks
    - Chinese
    answer: Persians
    difficulty: 1
    hints:
    - They changed the 's' of Sindhu to 'h'.
    - Hind → Hindustan.
    solution: 'Step 1: Sindhu became ''Hindu'' in Persian. Step 2: from it came Hind and Hindustan.'
    mistakes:
      Greeks: c6ss5_who
      Chinese: c6ss5_who
  - prompt: 'The river Sindhu is also called the:'
    options:
    - Indus
    - Ganga
    - Kaveri
    answer: Indus
    difficulty: 1
    hints:
    - It flows in the north-west.
    - The name 'India' comes from it.
    solution: 'Step 1: Sindhu is the old name. Step 2: in English it is the Indus.'
    mistakes:
      Ganga: c6ss5_river
      Kaveri: c6ss5_river
  - prompt: Jambudvipa appears in which ruler's inscriptions?
    options:
    - Ashoka
    - Akbar
    - Shivaji
    answer: Ashoka
    difficulty: 2
    hints:
    - He ruled about 2,300 years ago.
    - He had messages carved on rocks and pillars.
    solution: 'Step 1: Ashoka''s rock edicts are very old. Step 2: they use the name Jambudvipa.'
    mistakes:
      Akbar: c6ss5_text
      Shivaji: c6ss5_text
  - prompt: '''Bharatavarsha'' is a name found in the:'
    options:
    - Puranas
    - Greek plays
    - Chinese diaries
    answer: Puranas
    difficulty: 2
    hints:
    - It is an Indian name.
    - Old Indian texts describing the land.
    solution: 'Step 1: Bharatavarsha is used in Indian texts. Step 2: the Puranas describe it.'
    mistakes:
      Greek plays: c6ss5_text
      Chinese diaries: c6ss5_text
  - prompt: Why did outsiders often name our land after the Sindhu river?
    options:
    - It was the great river they met first when coming from the north-west
    - It is the longest river in the world
    - It flows through Kerala
    answer: It was the great river they met first when coming from the north-west
    difficulty: 3
    hints:
    - Persians and Greeks came from the west.
    - Which big river lay on their route?
    solution: 'Step 1: visitors from Persia and Greece came through the north-west. Step 2: the Sindhu was the first great river they met, so they named the land after it.'
    mistakes:
      It is the longest river in the world: c6ss5_river
      It flows through Kerala: c6ss5_river
  - prompt: Which name is NOT an old name for our land?
    options:
    - Mesopotamia
    - Jambudvipa
    - Bharatavarsha
    answer: Mesopotamia
    difficulty: 2
    hints:
    - Two are found in Indian texts.
    - One is a region in West Asia.
    solution: 'Step 1: Jambudvipa and Bharatavarsha are names of our land. Step 2: Mesopotamia is in West Asia.'
    mistakes:
      Jambudvipa: c6ss5_text
      Bharatavarsha: c6ss5_text
  - prompt: Why does the Constitution use both 'India' and 'Bharat'?
    options:
    - Both names are old and belong to our history
    - Because the country has two governments
    - Because it was a printing mistake
    answer: Both names are old and belong to our history
    difficulty: 2
    hints:
    - One comes from our own texts, one from the river name used abroad.
    - Both are part of our story.
    solution: 'Step 1: Bharat comes from Indian texts; India from the Sindhu via Greek. Step 2: the Constitution keeps both as our names.'
    mistakes:
      Because the country has two governments: c6ss5_who
      Because it was a printing mistake: c6ss5_who
  - prompt: 'The Bharatas, after whom ''Bharat'' is named, are mentioned in the:'
    options:
    - Rigveda
    - Constitution only
    - Persian books
    answer: Rigveda
    difficulty: 1
    hints:
    - It is the oldest Veda.
    - The Bharatas were a clan.
    solution: 'Step 1: the Bharatas were an early clan. Step 2: they are mentioned in the Rigveda.'
    mistakes:
      Constitution only: c6ss5_text
      Persian books: c6ss5_text
- code: cbse6ss.bharat.land
  title: Bharat as a land and a shared idea
  after:
  - cbse6ss.bharat.names
  notes: |
    Ancient texts (Vishnu Purana) describe Bharatavarsha as the land north of the ocean and south of the snowy mountains.
    Places across India were joined by pilgrimage routes (tirthas): Kashi, Prayag, Kanchipuram, Dwarka, Puri, Rameswaram.
    Traders and travellers crossed it. The idea of a single cultural land existed long before modern borders. Today India
    is a Union of States and Union Territories.
  explanations:
    text: Old Indian texts describe Bharat as the land between the southern ocean and the snowy Himalayas. Pilgrims and traders travelled across it, from Kashi to Rameswaram, which helped people feel it was one land with many regions.
    visual: Draw India with dots at Kashi, Prayag, Dwarka, Puri, Kanchipuram and Rameswaram, and dotted lines joining them like pilgrim routes.
    step_by_step: 'Step 1: Find the ancient description of the land. Step 2: Mark the boundaries named (ocean, Himalayas). Step 3: Find pilgrimage places in different regions. Step 4: See how travel joined them.'
    real_world: Many families still travel from Kerala to Kashi, or from the north to Rameswaram, following very old pilgrimage routes.
  picture:
    kind: compare
    columns:
    - title: Boundary in old texts
      points:
      - ocean to the south
      - Himalayas to the north
    - title: Places joined by pilgrims
      points:
      - Kashi, Prayag
      - Dwarka, Puri, Rameswaram
    alt: Old texts place Bharat between the southern ocean and the Himalayas, and pilgrim routes joined places like Kashi, Prayag, Dwarka, Puri and Rameswaram.
  activity:
    type: sort
    prompt: Which corner of India? (Pilgrimage places)
    bins:
    - North
    - South
    - East
    - West
    items:
    - label: Kashi (Varanasi)
      bin: North
      clue: On the Ganga.
      why: North.
    - label: Rameswaram
      bin: South
      clue: Near the tip of India.
      why: South.
    - label: Puri
      bin: East
      clue: Odisha's coast.
      why: East.
    - label: Dwarka
      bin: West
      clue: Gujarat's coast.
      why: West.
    - label: Kanchipuram
      bin: South
      clue: Tamil Nadu.
      why: South.
    - label: Prayag
      bin: North
      clue: Where rivers meet.
      why: North.
  lesson:
    - teach: 'The Vishnu Purana describes Bharatavarsha as the land north of the ocean and south of the snowy mountains. That matches the shape of India: the Himalayas to the north and the sea to the south.'
      check:
        prompt: 'The ''snowy mountains'' in this description are the:'
        options:
        - Himalayas
        - Western Ghats
        - Aravallis
        answer: Himalayas
        why: They are the snowy mountains on India's north.
    - teach: 'Pilgrims travelled to sacred places (tirthas) all over the land: Kashi and Prayag in the north, Dwarka in the west, Puri in the east, Rameswaram and Kanchipuram in the south. These journeys spread ideas, languages and customs.'
      picture:
        kind: compare
        columns:
        - title: North
          points:
          - Kashi (Varanasi)
          - Prayag
        - title: West and East
          points:
          - Dwarka (west coast)
          - Puri (east coast)
        - title: South
          points:
          - Rameswaram
          - Kanchipuram
        alt: 'Pilgrimage places in all directions: Kashi and Prayag north, Dwarka west, Puri east, Rameswaram and Kanchipuram south.'
      check:
        prompt: How did pilgrimages bring people closer?
        options:
        - People from far regions met and shared ideas
        - Pilgrims stayed home
        - They built borders
        answer: People from far regions met and shared ideas
        why: Travel mixed people from across the land.
    - teach: Traders and travellers also crossed the land. So the idea of one shared cultural land existed long before modern maps and borders. Today India is a Union of States and Union Territories.
      check:
        prompt: What is India officially called today?
        options:
        - A Union of States
        - An empire
        - A single city
        answer: A Union of States
        why: Article 1 says India shall be a Union of States.
  items:
  - prompt: 'The Vishnu Purana describes Bharatavarsha as lying between:'
    options:
    - the ocean and the snowy mountains
    - two deserts
    - two rivers only
    - Persia and China
    answer: the ocean and the snowy mountains
    difficulty: 1
    hints:
    - South and north.
    - Himalayas.
    solution: Between the ocean in the south and the Himalayas in the north.
    mistakes: {"two deserts": "s6_vishnu_purana"}
  - prompt: Which place is a pilgrimage site in the far south of India?
    options:
    - Rameswaram
    - Kashi
    - Dwarka
    - Prayag
    answer: Rameswaram
    difficulty: 1
    hints:
    - Tamil Nadu.
    - Near Sri Lanka.
    solution: Rameswaram is in the far south.
    mistakes: {"Kashi": "s6_rameswaram"}
  - prompt: How did pilgrimage routes help join India together?
    options:
    - People travelled and shared ideas across regions
    - They built walls
    - They stopped trade
    - They divided regions
    answer: People travelled and shared ideas across regions
    difficulty: 2
    hints:
    - Movement of people.
    - Shared culture.
    solution: Travel spread shared stories and practices.
    mistakes: {"They divided regions": "s6_pilgrim_unity"}
  - prompt: 'Today India is officially a:'
    options:
    - Union of States
    - single city
    - kingdom
    - colony
    answer: Union of States
    difficulty: 1
    hints:
    - Article 1.
    - Many states together.
    solution: India is a Union of States.
    mistakes: {"kingdom": "s6_union_states"}
  - prompt: 'Dwarka, a pilgrimage town, is on India''s:'
    options:
    - west coast
    - east coast
    - northern mountains
    - central plateau
    answer: west coast
    difficulty: 2
    hints:
    - Gujarat.
    - Arabian Sea.
    solution: Dwarka is in Gujarat on the west coast.
    mistakes: {"east coast": "s6_dwarka"}
  - prompt: 'Puri, a famous temple town, is on the:'
    options:
    - east coast
    - west coast
    - Himalayas
    - Thar desert
    answer: east coast
    difficulty: 2
    hints:
    - Odisha.
    - Bay of Bengal.
    solution: Puri is in Odisha on the east coast.
    mistakes: {"west coast": "s6_puri"}
  - prompt: 'Kashi is another name for:'
    options:
    - Varanasi
    - Chennai
    - Dwarka
    answer: Varanasi
    difficulty: 1
    hints:
    - It is on the Ganga.
    - It is in Uttar Pradesh.
    solution: 'Step 1: Kashi is an ancient city on the Ganga. Step 2: today it is called Varanasi.'
    mistakes:
      Chennai: c6ss5_place
      Dwarka: c6ss5_place
  - prompt: Kanchipuram is a temple town in which part of India?
    options:
    - South
    - North
    - North-east
    answer: South
    difficulty: 1
    hints:
    - It is in Tamil Nadu.
    - Near Chennai.
    solution: 'Step 1: Kanchipuram is in Tamil Nadu. Step 2: so it is in the south.'
    mistakes:
      North: c6ss5_place
      North-east: c6ss5_place
  - prompt: 'Prayag, where rivers meet, is today called:'
    options:
    - Prayagraj
    - Puri
    - Pune
    answer: Prayagraj
    difficulty: 2
    hints:
    - The Ganga and Yamuna meet there.
    - It is in Uttar Pradesh.
    solution: 'Step 1: Prayag is where the Ganga and Yamuna meet. Step 2: the city is called Prayagraj.'
    mistakes:
      Puri: c6ss5_place
      Pune: c6ss5_place
  - prompt: A pilgrim from Kashi travels to Rameswaram. Which direction does she travel?
    options:
    - South
    - North
    - West
    answer: South
    difficulty: 2
    hints:
    - Kashi is in the north.
    - Rameswaram is at the tip of the peninsula.
    solution: 'Step 1: Kashi is in the north, Rameswaram in the far south. Step 2: so she travels south.'
    mistakes:
      North: c6ss5_place
      West: c6ss5_place
  - prompt: Besides pilgrims, who else carried ideas across the land?
    options:
    - Traders and travellers
    - Only kings
    - Nobody
    answer: Traders and travellers
    difficulty: 1
    hints:
    - Goods moved along routes.
    - So did the people who carried them.
    solution: 'Step 1: traders moved goods across regions. Step 2: with them travelled stories, words and customs.'
    mistakes:
      Only kings: c6ss5_idea
      Nobody: c6ss5_idea
  - prompt: Why do we say the idea of Bharat is older than modern borders?
    options:
    - Old texts and pilgrim routes already saw the land as one
    - Borders were drawn first
    - Maps did not exist
    answer: Old texts and pilgrim routes already saw the land as one
    difficulty: 3
    hints:
    - Think of the Vishnu Purana's description.
    - Pilgrims went to all corners.
    solution: 'Step 1: texts described one land from the mountains to the sea. Step 2: pilgrims crossed it, so the idea of one land is very old.'
    mistakes:
      Borders were drawn first: c6ss5_idea
      Maps did not exist: c6ss5_idea
  - prompt: Rameswaram lies near which water body?
    options:
    - The sea between India and Sri Lanka
    - The Arctic Ocean
    - The Thar
    answer: The sea between India and Sri Lanka
    difficulty: 2
    hints:
    - It is at the southern tip of Tamil Nadu.
    - It faces Sri Lanka.
    solution: 'Step 1: Rameswaram is on an island off Tamil Nadu. Step 2: it faces Sri Lanka across the sea.'
    mistakes:
      The Arctic Ocean: c6ss5_place
      The Thar: c6ss5_place
  - prompt: 'India today has States and:'
    options:
    - Union Territories
    - Kingdoms
    - Colonies
    answer: Union Territories
    difficulty: 1
    hints:
    - Some areas are run by the central government.
    - Delhi and Ladakh are examples.
    solution: 'Step 1: India is a Union of States. Step 2: it also has Union Territories like Ladakh and Lakshadweep.'
    mistakes:
      Kingdoms: c6ss5_idea
      Colonies: c6ss5_idea
  - prompt: Which pair of pilgrim towns are on opposite coasts of India?
    options:
    - Dwarka and Puri
    - Kashi and Prayag
    - Rameswaram and Kanchipuram
    answer: Dwarka and Puri
    difficulty: 3
    hints:
    - One is on the west coast, one on the east.
    - Kashi and Prayag are both inland in the north.
    solution: 'Step 1: Dwarka is in Gujarat (west coast). Step 2: Puri is in Odisha (east coast).'
    mistakes:
      Kashi and Prayag: c6ss5_place
      Rameswaram and Kanchipuram: c6ss5_place
