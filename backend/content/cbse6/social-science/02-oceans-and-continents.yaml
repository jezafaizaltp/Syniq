# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 2. Format: content/README.md.
subject: cbse6-ss
chapter: 2
title: Oceans and Continents
tips:
  c6ss_largest: "Compare sizes on a world map or globe: find the biggest landmass and the widest ocean, not the one you hear about most."
  s6_antarctica: "Which continent is at the South Pole?"
  s6_arabian_sea: "The Bay of Bengal is to the east. Which sea is to the west?"
  s6_arctic: "The Indian Ocean is third largest. Which ocean is round the North Pole?"
  s6_australia: "Europe is small, but which continent is also a single country?"
  s6_continents: "Name them around the globe: the Americas count as two, and the frozen continent counts too."
  s6_indian_ocean: "Which ocean shares its name with our country?"
  s6_land_pct: "Land and water together make 100%. 100 − 71."
  s6_ocean_gifts: "Oceans give fish, salt and trade routes. Which choice doesn't come from the sea surface?"
  s6_oceans: "Pacific, Atlantic, Indian, Southern and Arctic. Count them."
  s6_pangaea: "Gondwana was only the southern part. Which name means 'all lands'?"
concepts:
- code: cbse6ss.oc.continents
  title: The seven continents
  notes: |
    About 71% of the Earth's surface is water and 29% land. Land is divided into 7 continents: Asia (largest, India is
    here), Africa (second largest, Sahara desert, Nile river), North America, South America (Amazon rainforest), Antarctica
    (ice-covered, no permanent residents), Europe, Australia (smallest; also a country). Long ago all continents were
    joined in one landmass (Pangaea) and slowly drifted apart.
  explanations:
    text: 'Most of the Earth is covered by water. The large land areas are called continents, and there are seven: Asia, Africa, North America, South America, Antarctica, Europe and Australia. Asia is the biggest, and India is in Asia. Australia is the smallest.'
    visual: 'Picture a world map: Asia, huge, in the top right; Africa below Europe; the two Americas on the left; Australia small in the bottom right; white Antarctica at the very bottom.'
    step_by_step: 'Step 1: Find the Equator on a world map. Step 2: Name the continents north of it. Step 3: Name those south of it. Step 4: Order them by size: Asia first, Australia last.'
    real_world: 'Indian students who go abroad often study in Europe, North America or Australia: three different continents.'
  picture:
    kind: bars
    bars:
    - label: Asia
      value: 44
    - label: Africa
      value: 30
    - label: N. America
      value: 24
    - label: S. America
      value: 18
    - label: Antarctica
      value: 14
    - label: Europe
      value: 10
    - label: Australia
      value: 9
    alt: Approximate areas of the continents in million square kilometres, from Asia, the largest, to Australia, the smallest.
    unit: million sq km
  activity:
    type: sort
    prompt: Which continent?
    bins:
    - Asia
    - Africa
    - South America
    - Antarctica
    - Australia
    items:
    - label: The largest continent; India is here
      bin: Asia
      clue: Biggest.
      why: Asia.
    - label: Sahara Desert and the Nile
      bin: Africa
      clue: Second largest.
      why: Africa.
    - label: The Amazon rainforest
      bin: South America
      clue: Below North America.
      why: South America.
    - label: Covered in ice, no permanent residents
      bin: Antarctica
      clue: South Pole.
      why: Antarctica.
    - label: Smallest continent, also a country
      bin: Australia
      clue: Kangaroos.
      why: Australia.
    - label: Mount Everest
      bin: Asia
      clue: Himalayas.
      why: Asia.
  items:
  - prompt: How many continents are there?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Count them.
    - Asia, Africa, ...
    solution: There are 7 continents.
    mistakes: {"6": "s6_continents", "5": "s6_continents"}
  - prompt: Which is the largest continent?
    options:
    - Asia
    - Africa
    - Europe
    - Australia
    answer: Asia
    difficulty: 1
    hints:
    - India is part of it.
    - Biggest area.
    solution: Asia is the largest.
    mistakes:
      Africa: c6ss_largest
  - prompt: Which is the smallest continent?
    options:
    - Australia
    - Europe
    - Antarctica
    - South America
    answer: Australia
    difficulty: 1
    hints:
    - It is also a country.
    - Smallest.
    solution: Australia is the smallest continent.
    mistakes: {"Europe": "s6_australia"}
  - prompt: Which continent is covered with ice and has no permanent residents?
    options:
    - Antarctica
    - Asia
    - Europe
    - Africa
    answer: Antarctica
    difficulty: 1
    hints:
    - Around the South Pole.
    - Scientists visit.
    solution: Antarctica is icy with no permanent residents.
    mistakes: {"Asia": "s6_antarctica"}
  - prompt: About 71% of Earth's surface is water. What percent is land?
    answer: '29'
    check: 100 - 71
    difficulty: 1
    hints:
    - 100 − 71.
    - Subtract.
    solution: 100 − 71 = 29%.
    mistakes: {"71": "s6_land_pct", "39": "s6_land_pct"}
  - prompt: 'The single huge landmass from which continents drifted apart is called:'
    options:
    - Pangaea
    - Gondwana only
    - Atlantis
    - Eurasia
    answer: Pangaea
    difficulty: 2
    hints:
    - Pan means all.
    - Millions of years ago.
    solution: All continents were once joined as Pangaea.
    mistakes: {"Gondwana only": "s6_pangaea"}
- code: cbse6ss.oc.oceans
  title: The five oceans
  after:
  - cbse6ss.oc.continents
  notes: |
    Oceans: Pacific (largest and deepest; Mariana Trench), Atlantic (second largest, S-shaped), Indian (the only ocean
    named after a country, India), Southern (around Antarctica), Arctic (smallest, around the North Pole, mostly frozen).
    Oceans affect climate, give food (fish), salt, minerals and routes for trade. India's peninsula has the Arabian Sea
    (west), Bay of Bengal (east) and Indian Ocean (south). Ocean currents and tides.
  explanations:
    text: 'There are five oceans: the Pacific, Atlantic, Indian, Southern and Arctic. The Pacific is the largest and deepest. The Indian Ocean is the only one named after a country: India. Oceans give us fish, salt and sea routes, and they shape the weather.'
    visual: 'Picture India pointing down into the water: the Arabian Sea on the left, the Bay of Bengal on the right, and the Indian Ocean below.'
    step_by_step: 'Step 1: Find India on a world map. Step 2: Name the waters around it. Step 3: Find the other oceans: Pacific (east of Asia), Atlantic (between the Americas and Europe/Africa). Step 4: Note the Arctic in the north and the Southern Ocean around Antarctica.'
    real_world: Kerala's fishing boats sail into the Arabian Sea; ships carrying goods from India to Africa cross the Indian Ocean.
  picture:
    kind: compare
    columns:
    - title: Ocean
      points:
      - Pacific
      - Indian
      - Arctic
    - title: Fact
      points:
      - largest and deepest
      - named after India
      - smallest, around North Pole
    alt: The Pacific is the largest and deepest ocean, the Indian Ocean is named after India, and the Arctic is the smallest.
  activity:
    type: sort
    prompt: Which ocean?
    bins:
    - Pacific
    - Atlantic
    - Indian
    - Southern
    - Arctic
    items:
    - label: Largest and deepest, with the Mariana Trench
      bin: Pacific
      clue: Biggest.
      why: Pacific.
    - label: S-shaped, second largest
      bin: Atlantic
      clue: Between the Americas and Europe-Africa.
      why: Atlantic.
    - label: The only ocean named after a country
      bin: Indian
      clue: Our country.
      why: Indian Ocean.
    - label: Around Antarctica
      bin: Southern
      clue: Far south.
      why: Southern.
    - label: Smallest, around the North Pole
      bin: Arctic
      clue: Mostly frozen.
      why: Arctic.
  items:
  - prompt: How many oceans are there?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Pacific, Atlantic, ...
    - Count.
    solution: There are 5 oceans.
    mistakes: {"7": "s6_oceans", "4": "s6_oceans"}
  - prompt: Which is the largest ocean?
    options:
    - Pacific
    - Atlantic
    - Indian
    - Arctic
    answer: Pacific
    difficulty: 1
    hints:
    - Largest and deepest.
    - East of Asia.
    solution: The Pacific is the largest.
    mistakes:
      Atlantic: c6ss_largest
  - prompt: Which ocean is named after a country?
    options:
    - Indian Ocean
    - Pacific Ocean
    - Atlantic Ocean
    - Arctic Ocean
    answer: Indian Ocean
    difficulty: 1
    hints:
    - Our country.
    - South of India.
    solution: The Indian Ocean is named after India.
    mistakes: {"Pacific Ocean": "s6_indian_ocean"}
  - prompt: 'The sea to the west of India is the:'
    options:
    - Arabian Sea
    - Bay of Bengal
    - Red Sea
    - South China Sea
    answer: Arabian Sea
    difficulty: 1
    hints:
    - Kerala's coast faces it.
    - West.
    solution: The Arabian Sea is west of India.
    mistakes: {"Bay of Bengal": "s6_arabian_sea"}
  - prompt: Which is the smallest ocean?
    options:
    - Arctic
    - Indian
    - Southern
    - Atlantic
    answer: Arctic
    difficulty: 2
    hints:
    - Around the North Pole.
    - Mostly frozen.
    solution: The Arctic is the smallest ocean.
    mistakes: {"Indian": "s6_arctic", "Southern": "s6_arctic"}
  - prompt: Which of these do oceans NOT give us?
    options:
    - Coal mines on the surface
    - Fish
    - Salt
    - Sea routes for trade
    answer: Coal mines on the surface
    difficulty: 2
    hints:
    - Think of fishing, salt pans, ships.
    - Coal comes from land mines.
    solution: Oceans give fish, salt and trade routes, not surface coal mines.
    mistakes: {"Salt": "s6_ocean_gifts"}
