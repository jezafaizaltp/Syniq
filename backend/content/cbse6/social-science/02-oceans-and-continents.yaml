# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 2. Format: content/README.md.
subject: cbse6-ss
chapter: 2
title: Oceans and Continents
tips:
  c6ss_largest: "Compare sizes on a world map or globe: find the biggest landmass and the widest ocean, not the one you hear about most."
  s6_antarctica: "Which continent is at the South Pole?"
  s6_arabian_sea: "The Bay of Bengal is to the east. Which sea is to the west?"
  s6_arctic: "The Indian Ocean is third largest. Which ocean is round the North Pole?"
  s6_australia: "Europe is small, but which continent is also a single country?"
  s6_continents: "Name them around the globe: the Americas count as two, and the frozen continent counts too."
  s6_indian_ocean: "Which ocean shares its name with our country?"
  s6_land_pct: "Land and water together make 100%. 100 − 71."
  s6_ocean_gifts: "Oceans give fish, salt and trade routes. Which choice doesn't come from the sea surface?"
  s6_oceans: "Pacific, Atlantic, Indian, Southern and Arctic. Count them."
  s6_pangaea: "Gondwana was only the southern part. Which name means 'all lands'?"
  c6ss2_size: Rank the continents by size from biggest to smallest and find the place asked for.
  c6ss2_where: 'Picture the world map: which continent lies where, and which is joined to which?'
  c6ss2_feature: Link the famous river, desert or forest to the continent it is found in.
  c6ss2_ocean: 'Rank the oceans by size and recall where each lies: around which pole or between which continents.'
  c6ss2_india: 'Picture India''s outline: one sea on each side and the ocean to the south.'
  c6ss2_pct: Land and water together make the whole surface, 100%.
concepts:
- code: cbse6ss.oc.continents
  title: The seven continents
  notes: |
    About 71% of the Earth's surface is water and 29% land. Land is divided into 7 continents: Asia (largest, India is
    here), Africa (second largest, Sahara desert, Nile river), North America, South America (Amazon rainforest), Antarctica
    (ice-covered, no permanent residents), Europe, Australia (smallest; also a country). Long ago all continents were
    joined in one landmass (Pangaea) and slowly drifted apart.
  explanations:
    text: 'Most of the Earth is covered by water. The large land areas are called continents, and there are seven: Asia, Africa, North America, South America, Antarctica, Europe and Australia. Asia is the biggest, and India is in Asia. Australia is the smallest.'
    visual: 'Picture a world map: Asia, huge, in the top right; Africa below Europe; the two Americas on the left; Australia small in the bottom right; white Antarctica at the very bottom.'
    step_by_step: 'Step 1: Find the Equator on a world map. Step 2: Name the continents north of it. Step 3: Name those south of it. Step 4: Order them by size: Asia first, Australia last.'
    real_world: 'Indian students who go abroad often study in Europe, North America or Australia: three different continents.'
  picture:
    kind: bars
    bars:
    - label: Asia
      value: 44
    - label: Africa
      value: 30
    - label: N. America
      value: 24
    - label: S. America
      value: 18
    - label: Antarctica
      value: 14
    - label: Europe
      value: 10
    - label: Australia
      value: 9
    alt: Approximate areas of the continents in million square kilometres, from Asia, the largest, to Australia, the smallest.
    unit: million sq km
  activity:
    type: sort
    prompt: Which continent?
    bins:
    - Asia
    - Africa
    - South America
    - Antarctica
    - Australia
    items:
    - label: The largest continent; India is here
      bin: Asia
      clue: Biggest.
      why: Asia.
    - label: Sahara Desert and the Nile
      bin: Africa
      clue: Second largest.
      why: Africa.
    - label: The Amazon rainforest
      bin: South America
      clue: Below North America.
      why: South America.
    - label: Covered in ice, no permanent residents
      bin: Antarctica
      clue: South Pole.
      why: Antarctica.
    - label: Smallest continent, also a country
      bin: Australia
      clue: Kangaroos.
      why: Australia.
    - label: Mount Everest
      bin: Asia
      clue: Himalayas.
      why: Asia.
  lesson:
    - teach: About 71% of the Earth's surface is water and only 29% is land. The land is divided into seven large masses called continents.
      picture:
        kind: bars
        unit: '% of Earth''s surface'
        bars:
        - label: Water
          value: 71
        - label: Land
          value: 29
        alt: Water covers 71 percent of the Earth's surface and land 29 percent.
      check:
        prompt: Is there more land or more water on the Earth's surface?
        options:
        - More water
        - More land
        - Equal
        answer: More water
        why: 71% is water, more than twice the land.
    - teach: 'The seven continents by size: Asia (largest; India is here), Africa, North America, South America, Antarctica, Europe, Australia (smallest, and also a country).'
      picture:
        kind: flow
        steps:
        - Asia
        - Africa
        - North America
        - South America
        - Antarctica
        - Europe
        - Australia
        alt: 'The seven continents from largest to smallest: Asia, Africa, North America, South America, Antarctica, Europe, Australia.'
      check:
        prompt: Which continent is India in?
        options:
        - Asia
        - Africa
        - Europe
        answer: Asia
        why: India is in southern Asia.
    - teach: Each continent has famous features. Africa has the Sahara, the largest hot desert, and the Nile, a very long river. South America has the Amazon rainforest. Antarctica is covered with ice; only scientists stay there for a time. Long ago all land was one supercontinent, Pangaea, which slowly broke apart.
      check:
        prompt: 'The Amazon rainforest is in:'
        options:
        - South America
        - Africa
        - Australia
        answer: South America
        why: The Amazon river and forest lie in South America.
  items:
  - prompt: How many continents are there?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Count them.
    - Asia, Africa, ...
    solution: There are 7 continents.
    mistakes: {"6": "s6_continents", "5": "s6_continents"}
  - prompt: Which is the largest continent?
    options:
    - Asia
    - Africa
    - Europe
    - Australia
    answer: Asia
    difficulty: 1
    hints:
    - India is part of it.
    - Biggest area.
    solution: Asia is the largest.
    mistakes:
      Africa: c6ss_largest
  - prompt: Which is the smallest continent?
    options:
    - Australia
    - Europe
    - Antarctica
    - South America
    answer: Australia
    difficulty: 1
    hints:
    - It is also a country.
    - Smallest.
    solution: Australia is the smallest continent.
    mistakes: {"Europe": "s6_australia"}
  - prompt: Which continent is covered with ice and has no permanent residents?
    options:
    - Antarctica
    - Asia
    - Europe
    - Africa
    answer: Antarctica
    difficulty: 1
    hints:
    - Around the South Pole.
    - Scientists visit.
    solution: Antarctica is icy with no permanent residents.
    mistakes: {"Asia": "s6_antarctica"}
  - prompt: About 71% of Earth's surface is water. What percent is land?
    answer: '29'
    check: 100 - 71
    difficulty: 1
    hints:
    - 100 − 71.
    - Subtract.
    solution: 100 − 71 = 29%.
    mistakes: {"71": "s6_land_pct", "39": "s6_land_pct"}
  - prompt: 'The single huge landmass from which continents drifted apart is called:'
    options:
    - Pangaea
    - Gondwana only
    - Atlantis
    - Eurasia
    answer: Pangaea
    difficulty: 2
    hints:
    - Pan means all.
    - Millions of years ago.
    solution: All continents were once joined as Pangaea.
    mistakes: {"Gondwana only": "s6_pangaea"}
  - prompt: Which is the second largest continent?
    options:
    - Africa
    - Europe
    - Antarctica
    answer: Africa
    difficulty: 1
    hints:
    - Asia is the largest.
    - The next one has the Sahara.
    solution: 'Step 1: Asia is first. Step 2: Africa is second largest.'
    mistakes:
      Europe: c6ss2_size
      Antarctica: c6ss2_size
  - prompt: The Sahara desert is in which continent?
    options:
    - Africa
    - Asia
    - South America
    answer: Africa
    difficulty: 1
    hints:
    - It is the largest hot desert.
    - It lies in the north of a big continent.
    solution: 'Step 1: the Sahara spreads across North Africa. Step 2: so it is in Africa.'
    mistakes:
      Asia: c6ss2_feature
      South America: c6ss2_feature
  - prompt: Which continent is also a single country?
    options:
    - Australia
    - Africa
    - Europe
    answer: Australia
    difficulty: 1
    hints:
    - It is the smallest continent.
    - It has kangaroos.
    solution: 'Step 1: Africa and Europe have many countries. Step 2: Australia is both a continent and a country.'
    mistakes:
      Africa: c6ss2_size
      Europe: c6ss2_size
  - prompt: If 71% of Earth's surface is water, how many percent more water is there than land?
    answer: '42'
    check: 71-29
    difficulty: 2
    hints:
    - Land is 100 − 71.
    - Then subtract land from water.
    solution: 'Step 1: land = 29%. Step 2: 71 − 29 = 42% more water.'
    mistakes:
      '29': c6ss2_pct
      '71': c6ss2_pct
  - prompt: Which continent lies mostly south of the Equator and is joined to North America?
    options:
    - South America
    - Africa
    - Australia
    answer: South America
    difficulty: 2
    hints:
    - It is joined by a narrow strip of land.
    - Its name pairs with North America.
    solution: 'Step 1: a narrow strip joins the two Americas. Step 2: the southern one is South America.'
    mistakes:
      Africa: c6ss2_where
      Australia: c6ss2_where
  - prompt: Why do no people live permanently in Antarctica?
    options:
    - It is extremely cold and covered with thick ice
    - It is a desert of sand
    - It is underwater
    answer: It is extremely cold and covered with thick ice
    difficulty: 2
    hints:
    - It is around the South Pole.
    - What covers it?
    solution: 'Step 1: Antarctica lies around the South Pole. Step 2: it is freezing and ice-covered, so only scientists stay for a while.'
    mistakes:
      It is a desert of sand: c6ss2_feature
      It is underwater: c6ss2_feature
  - prompt: 'Europe and Asia share one big landmass. Together they are sometimes called:'
    options:
    - Eurasia
    - Pangaea
    - Oceania
    answer: Eurasia
    difficulty: 3
    hints:
    - Join their two names.
    - Pangaea was the ancient supercontinent.
    solution: 'Step 1: Europe + Asia are joined by land. Step 2: together the landmass is called Eurasia.'
    mistakes:
      Pangaea: c6ss2_where
      Oceania: c6ss2_where
  - prompt: How many continents are larger than Europe?
    answer: '5'
    check: '5'
    difficulty: 3
    hints:
    - List all seven by size.
    - Europe is second smallest.
    solution: 'Step 1: order: Asia, Africa, N. America, S. America, Antarctica, Europe, Australia. Step 2: 5 continents are larger than Europe.'
    mistakes:
      '6': c6ss2_size
      '4': c6ss2_size
  - prompt: 'The Nile, one of the longest rivers in the world, flows through:'
    options:
    - Africa
    - Europe
    - Australia
    answer: Africa
    difficulty: 1
    hints:
    - It flows through Egypt.
    - Egypt is in the north-east of a big continent.
    solution: 'Step 1: the Nile flows north through Egypt. Step 2: Egypt is in Africa.'
    mistakes:
      Europe: c6ss2_feature
      Australia: c6ss2_feature
- code: cbse6ss.oc.oceans
  title: The five oceans
  after:
  - cbse6ss.oc.continents
  notes: |
    Oceans: Pacific (largest and deepest; Mariana Trench), Atlantic (second largest, S-shaped), Indian (the only ocean
    named after a country, India), Southern (around Antarctica), Arctic (smallest, around the North Pole, mostly frozen).
    Oceans affect climate, give food (fish), salt, minerals and routes for trade. India's peninsula has the Arabian Sea
    (west), Bay of Bengal (east) and Indian Ocean (south). Ocean currents and tides.
  explanations:
    text: 'There are five oceans: the Pacific, Atlantic, Indian, Southern and Arctic. The Pacific is the largest and deepest. The Indian Ocean is the only one named after a country: India. Oceans give us fish, salt and sea routes, and they shape the weather.'
    visual: 'Picture India pointing down into the water: the Arabian Sea on the left, the Bay of Bengal on the right, and the Indian Ocean below.'
    step_by_step: 'Step 1: Find India on a world map. Step 2: Name the waters around it. Step 3: Find the other oceans: Pacific (east of Asia), Atlantic (between the Americas and Europe/Africa). Step 4: Note the Arctic in the north and the Southern Ocean around Antarctica.'
    real_world: Kerala's fishing boats sail into the Arabian Sea; ships carrying goods from India to Africa cross the Indian Ocean.
  picture:
    kind: compare
    columns:
    - title: Ocean
      points:
      - Pacific
      - Indian
      - Arctic
    - title: Fact
      points:
      - largest and deepest
      - named after India
      - smallest, around North Pole
    alt: The Pacific is the largest and deepest ocean, the Indian Ocean is named after India, and the Arctic is the smallest.
  activity:
    type: sort
    prompt: Which ocean?
    bins:
    - Pacific
    - Atlantic
    - Indian
    - Southern
    - Arctic
    items:
    - label: Largest and deepest, with the Mariana Trench
      bin: Pacific
      clue: Biggest.
      why: Pacific.
    - label: S-shaped, second largest
      bin: Atlantic
      clue: Between the Americas and Europe-Africa.
      why: Atlantic.
    - label: The only ocean named after a country
      bin: Indian
      clue: Our country.
      why: Indian Ocean.
    - label: Around Antarctica
      bin: Southern
      clue: Far south.
      why: Southern.
    - label: Smallest, around the North Pole
      bin: Arctic
      clue: Mostly frozen.
      why: Arctic.
  lesson:
    - teach: 'There are five oceans. From largest to smallest: Pacific, Atlantic, Indian, Southern and Arctic. They are all connected, making one big world ocean.'
      picture:
        kind: flow
        steps:
        - Pacific
        - Atlantic
        - Indian
        - Southern
        - Arctic
        alt: 'The five oceans from largest to smallest: Pacific, Atlantic, Indian, Southern, Arctic.'
      check:
        prompt: Which ocean is the second largest?
        options:
        - Atlantic
        - Indian
        - Arctic
        answer: Atlantic
        why: After the Pacific comes the Atlantic.
    - teach: The Pacific is the largest and deepest; the Mariana Trench is its deepest point. The Atlantic is S-shaped. The Indian Ocean is the only ocean named after a country. The Southern Ocean surrounds Antarctica, and the Arctic, the smallest, surrounds the North Pole and is mostly frozen.
      check:
        prompt: Which ocean surrounds Antarctica?
        options:
        - Southern Ocean
        - Arctic Ocean
        - Atlantic Ocean
        answer: Southern Ocean
        why: The Southern Ocean circles Antarctica; the Arctic is at the North Pole.
    - teach: Peninsular India has the Arabian Sea to the west, the Bay of Bengal to the east and the Indian Ocean to the south. Oceans give fish, salt, minerals and sea routes for trade, and they affect the climate and bring the monsoon rains.
      picture:
        kind: compare
        columns:
        - title: West
          points:
          - Arabian Sea
        - title: South
          points:
          - Indian Ocean
        - title: East
          points:
          - Bay of Bengal
        alt: India has the Arabian Sea on the west, the Indian Ocean to the south and the Bay of Bengal on the east.
      check:
        prompt: 'Chennai is on the coast of the:'
        options:
        - Bay of Bengal
        - Arabian Sea
        - Arctic Ocean
        answer: Bay of Bengal
        why: Chennai is on India's east coast.
  items:
  - prompt: How many oceans are there?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Pacific, Atlantic, ...
    - Count.
    solution: There are 5 oceans.
    mistakes: {"7": "s6_oceans", "4": "s6_oceans"}
  - prompt: Which is the largest ocean?
    options:
    - Pacific
    - Atlantic
    - Indian
    - Arctic
    answer: Pacific
    difficulty: 1
    hints:
    - Largest and deepest.
    - East of Asia.
    solution: The Pacific is the largest.
    mistakes:
      Atlantic: c6ss_largest
  - prompt: Which ocean is named after a country?
    options:
    - Indian Ocean
    - Pacific Ocean
    - Atlantic Ocean
    - Arctic Ocean
    answer: Indian Ocean
    difficulty: 1
    hints:
    - Our country.
    - South of India.
    solution: The Indian Ocean is named after India.
    mistakes: {"Pacific Ocean": "s6_indian_ocean"}
  - prompt: 'The sea to the west of India is the:'
    options:
    - Arabian Sea
    - Bay of Bengal
    - Red Sea
    - South China Sea
    answer: Arabian Sea
    difficulty: 1
    hints:
    - Kerala's coast faces it.
    - West.
    solution: The Arabian Sea is west of India.
    mistakes: {"Bay of Bengal": "s6_arabian_sea"}
  - prompt: Which is the smallest ocean?
    options:
    - Arctic
    - Indian
    - Southern
    - Atlantic
    answer: Arctic
    difficulty: 2
    hints:
    - Around the North Pole.
    - Mostly frozen.
    solution: The Arctic is the smallest ocean.
    mistakes: {"Indian": "s6_arctic", "Southern": "s6_arctic"}
  - prompt: Which of these do oceans NOT give us?
    options:
    - Coal mines on the surface
    - Fish
    - Salt
    - Sea routes for trade
    answer: Coal mines on the surface
    difficulty: 2
    hints:
    - Think of fishing, salt pans, ships.
    - Coal comes from land mines.
    solution: Oceans give fish, salt and trade routes, not surface coal mines.
    mistakes: {"Salt": "s6_ocean_gifts"}
  - prompt: Which is the deepest ocean?
    options:
    - Pacific
    - Atlantic
    - Arctic
    answer: Pacific
    difficulty: 1
    hints:
    - It has the Mariana Trench.
    - It is also the largest.
    solution: 'Step 1: the Mariana Trench is the deepest point on Earth. Step 2: it is in the Pacific.'
    mistakes:
      Atlantic: c6ss2_ocean
      Arctic: c6ss2_ocean
  - prompt: Which ocean is shaped like the letter S?
    options:
    - Atlantic
    - Indian
    - Southern
    answer: Atlantic
    difficulty: 2
    hints:
    - It lies between the Americas and Europe–Africa.
    - It is the second largest.
    solution: 'Step 1: the Atlantic winds between the Americas and Europe–Africa. Step 2: its shape looks like an S.'
    mistakes:
      Indian: c6ss2_ocean
      Southern: c6ss2_ocean
  - prompt: 'Mumbai and Kochi are on the coast of the:'
    options:
    - Arabian Sea
    - Bay of Bengal
    - Pacific Ocean
    answer: Arabian Sea
    difficulty: 1
    hints:
    - Both are on India's west coast.
    - Which sea lies to the west?
    solution: 'Step 1: Mumbai and Kochi are on the west coast. Step 2: the Arabian Sea lies there.'
    mistakes:
      Bay of Bengal: c6ss2_india
      Pacific Ocean: c6ss2_india
  - prompt: 'Kolkata and Visakhapatnam are near the:'
    options:
    - Bay of Bengal
    - Arabian Sea
    - Atlantic Ocean
    answer: Bay of Bengal
    difficulty: 1
    hints:
    - Both are on the east side of India.
    - Which water body is to the east?
    solution: 'Step 1: they are on the east coast. Step 2: the Bay of Bengal is there.'
    mistakes:
      Arabian Sea: c6ss2_india
      Atlantic Ocean: c6ss2_india
  - prompt: Which ocean is mostly frozen for much of the year?
    options:
    - Arctic
    - Indian
    - Pacific
    answer: Arctic
    difficulty: 1
    hints:
    - It is around the North Pole.
    - It is the smallest ocean.
    solution: 'Step 1: the Arctic surrounds the North Pole. Step 2: it is very cold and mostly frozen.'
    mistakes:
      Indian: c6ss2_ocean
      Pacific: c6ss2_ocean
  - prompt: How do oceans help India's farmers?
    options:
    - Winds from the ocean bring monsoon rain
    - Oceans water the fields directly
    - Oceans give them coal
    answer: Winds from the ocean bring monsoon rain
    difficulty: 2
    hints:
    - Most of India's rain comes in one season.
    - Where do those rain clouds come from?
    solution: 'Step 1: moist winds blow from the oceans in summer. Step 2: they bring monsoon rain for crops.'
    mistakes:
      Oceans water the fields directly: c6ss2_ocean
      Oceans give them coal: c6ss2_ocean
  - prompt: Which list has the oceans in order from smallest to largest?
    options:
    - Arctic, Southern, Indian, Atlantic, Pacific
    - Pacific, Atlantic, Indian, Southern, Arctic
    - Indian, Arctic, Pacific, Southern, Atlantic
    answer: Arctic, Southern, Indian, Atlantic, Pacific
    difficulty: 3
    hints:
    - Start with the smallest.
    - End with the biggest.
    solution: 'Step 1: the largest-first order is Pacific, Atlantic, Indian, Southern, Arctic. Step 2: reversed, it is Arctic, Southern, Indian, Atlantic, Pacific.'
    mistakes:
      Pacific, Atlantic, Indian, Southern, Arctic: c6ss2_ocean
      Indian, Arctic, Pacific, Southern, Atlantic: c6ss2_ocean
  - prompt: Why are oceans important for trade?
    options:
    - Ships carry goods between countries across them
    - They make goods cheaper by magic
    - They stop all travel
    answer: Ships carry goods between countries across them
    difficulty: 2
    hints:
    - Most goods between countries go by ship.
    - Ports are on the coast.
    solution: 'Step 1: big ships carry goods cheaply. Step 2: oceans link countries, so they are trade routes.'
    mistakes:
      They make goods cheaper by magic: c6ss2_ocean
      They stop all travel: c6ss2_ocean
  - prompt: Which ocean lies between Africa and Australia?
    options:
    - Indian Ocean
    - Atlantic Ocean
    - Arctic Ocean
    answer: Indian Ocean
    difficulty: 2
    hints:
    - It lies south of India.
    - Picture the map between those two continents.
    solution: 'Step 1: Africa is on the west, Australia on the east. Step 2: between them is the Indian Ocean.'
    mistakes:
      Atlantic Ocean: c6ss2_where
      Arctic Ocean: c6ss2_where
