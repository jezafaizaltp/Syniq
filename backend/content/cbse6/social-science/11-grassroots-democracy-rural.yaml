subject: cbse6-ss
chapter: 11
title: 'Grassroots Democracy Part 2: Local Government in Rural Areas'
tips:
  c6ss_sabha_panchayat: The Gram Sabha is all adult voters of the village. The Gram Panchayat is the smaller elected body that the Gram Sabha checks.
  s6_73rd: "The 42nd Amendment (1976) changed the Preamble. The panchayat amendment came in 1992, and the one for cities came right after it."
  s6_accountable: "The gram sabha is where villagers can ask questions."
  s6_block: "Between the village and the district is the block."
  s6_mgnrega: "MGNREGA is an employment guarantee scheme."
  s6_panchayat_money: "Panchayats collect some taxes and get funds from the government."
  s6_panchayat_term: "Panchayat elections are held on the same cycle as Lok Sabha and assembly elections."
  s6_panchayat_work: "A panchayat looks after the village. Which work is local?"
  s6_sarpanch: "A mayor heads a city. Who heads a village panchayat?"
