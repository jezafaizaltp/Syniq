# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 11. Format: content/README.md.
subject: cbse6-ss
chapter: 11
title: 'Grassroots Democracy Part 2: Local Government in Rural Areas'
tips:
  c6ss_sabha_panchayat: "The Sarpanch heads the panchayat, a small elected body. The Gram Sabha is much bigger: who in the village gets to be part of it?"
  s6_73rd: "The 42nd Amendment (1976) changed the Preamble. The panchayat amendment came in 1992, and the one for cities came right after it."
  s6_accountable: "The gram sabha is where villagers can ask questions."
  s6_block: "Between the village and the district is the block."
  s6_mgnrega: "MGNREGA is an employment guarantee scheme."
  s6_panchayat_money: "Panchayats collect some taxes and get funds from the government."
  s6_panchayat_term: "Panchayat elections are held on the same cycle as Lok Sabha and assembly elections."
  s6_panchayat_work: "A panchayat looks after the village. Which work is local?"
  s6_sarpanch: "A mayor heads a city. Who heads a village panchayat?"
  s6_three_tiers: "Village, block and district. Count them."
  s6_women_seats: "The reservation is for at least a much bigger share than a tenth."
  s6_zila: "'Zila' means district, the biggest area."
  c6ss11_body: 'Separate the two: one is every adult voter of the village meeting together; the other is the small elected team that does the work.'
  c6ss11_tier: 'Arrange the tiers by size of area: village, then a group of villages, then the whole district.'
  c6ss11_work: Think about the everyday needs of a village that are close to people's homes.
  c6ss11_law: 'Recall the constitutional amendment for panchayats: when it came and what it requires for seats and terms.'
  c6ss11_money: 'Think about where a local body''s money comes from: what it collects itself and what governments send.'
  c6ss11_check: Ask how ordinary villagers can see and question what their panchayat is doing.
concepts:
- code: cbse6ss.rural.panchayat
  title: The Gram Sabha and Gram Panchayat
  notes: |
    Panchayati Raj: local self-government in villages, given constitutional status by the 73rd Amendment (1992). Gram
    Sabha: all adults (18+) on the village voters' list; meets to discuss plans, approve the budget and check the
    panchayat's work. Gram Panchayat: elected members (ward members, panch) headed by the Sarpanch/Pradhan (in Kerala,
    President); elected for 5 years; secretary appointed by government. Work: roads, drains, drinking water, street lights,
    sanitation, birth and death registration. At least one-third of seats reserved for women (many states, including
    Kerala, reserve half).
  explanations:
    text: In villages, people govern themselves through the Panchayati Raj. All adult voters of a village form the Gram Sabha. They elect the Gram Panchayat, led by a Sarpanch or President, for 5 years. The panchayat looks after roads, water, drains and street lights, and the Gram Sabha checks its work.
    visual: 'Picture a meeting under a big tree: all adults of the village (Gram Sabha) discussing a new well, while the elected panchayat members and President sit at the front listening.'
    step_by_step: 'Step 1: Find who is in the Gram Sabha: all adult voters. Step 2: Find who is elected: Gram Panchayat members. Step 3: Find the head: Sarpanch/President. Step 4: List the panchayat''s work.'
    real_world: Kerala's panchayats run many local services, and half the seats are reserved for women.
  picture:
    kind: compare
    columns:
    - title: Gram Sabha
      points:
      - all adult voters
      - discusses and approves plans
      - checks the panchayat
    - title: Gram Panchayat
      points:
      - elected members
      - headed by Sarpanch/President
      - does the work
    alt: The Gram Sabha is all adult voters who discuss plans and check work; the Gram Panchayat is the elected body headed by the Sarpanch that does the work.
  activity:
    type: sort
    prompt: Gram Sabha or Gram Panchayat?
    bins:
    - Gram Sabha
    - Gram Panchayat
    items:
    - label: All adults on the village voters' list
      bin: Gram Sabha
      clue: Everyone 18+.
      why: Gram Sabha.
    - label: Elected ward members headed by the Sarpanch
      bin: Gram Panchayat
      clue: A smaller elected body.
      why: Gram Panchayat.
    - label: Approves the budget and checks the panchayat's work
      bin: Gram Sabha
      clue: The whole village.
      why: Gram Sabha.
    - label: Builds drains and fixes street lights
      bin: Gram Panchayat
      clue: Does the work.
      why: Gram Panchayat.
    - label: Registers births and deaths
      bin: Gram Panchayat
      clue: Office work.
      why: Gram Panchayat.
  lesson:
    - teach: 'Panchayati Raj is local self-government in villages: villagers run their own local affairs. The 73rd Amendment to the Constitution (1992) made panchayats a regular part of our government.'
      check:
        prompt: What does 'local self-government' mean?
        options:
        - People manage the affairs of their own area
        - Only the Prime Minister decides
        - Nobody makes decisions
        answer: People manage the affairs of their own area
        why: Villagers decide local matters themselves.
    - teach: The Gram Sabha is all the adults (18+) on the village voters' list. It meets to discuss plans, approve the budget and check the panchayat's work. The Gram Panchayat is the smaller elected body, headed by the Sarpanch (called President in Kerala), elected for 5 years.
      picture:
        kind: compare
        columns:
        - title: Gram Sabha
          points:
          - all adult voters
          - discusses, approves, checks
        - title: Gram Panchayat
          points:
          - elected members
          - headed by Sarpanch/President
          - does the work, 5 years
        alt: The Gram Sabha is all adult voters who discuss and check; the Gram Panchayat is the elected team led by the Sarpanch that does the work.
      check:
        prompt: Who can attend the Gram Sabha?
        options:
        - Every adult on the village voters' list
        - Only the Sarpanch
        - Only government officers
        answer: Every adult on the village voters' list
        why: The Gram Sabha is all the village's adult voters.
    - teach: The Gram Panchayat builds and repairs village roads and drains, arranges drinking water, street lights and sanitation, and records births and deaths. By law at least one-third of seats are reserved for women; many states, including Kerala, reserve half.
      check:
        prompt: A village has 15 panchayat seats. At least how many must be for women by law?
        options:
        - '5'
        - '3'
        - '10'
        answer: '5'
        why: One-third of 15 is 5.
  items:
  - prompt: 'The Gram Sabha consists of:'
    options:
    - all adult voters of the village
    - only the Sarpanch
    - only government officers
    - children of the village
    answer: all adult voters of the village
    difficulty: 1
    hints:
    - Everyone 18+ on the list.
    - Large meeting.
    solution: All adult voters form the Gram Sabha.
    mistakes:
      only the Sarpanch: c6ss_sabha_panchayat
  - prompt: 'The head of a Gram Panchayat is usually called the:'
    options:
    - Sarpanch (or President)
    - Mayor
    - Prime Minister
    - Governor
    answer: Sarpanch (or President)
    difficulty: 1
    hints:
    - Village head.
    - Pradhan.
    solution: The Sarpanch heads the panchayat.
    mistakes: {"Mayor": "s6_sarpanch"}
  - prompt: For how many years is a Gram Panchayat elected?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Same as most elections.
    - Five.
    solution: 5 years.
    mistakes: {"4": "s6_panchayat_term", "3": "s6_panchayat_term"}
  - prompt: Which work is done by a Gram Panchayat?
    options:
    - Building village roads and drains
    - Printing currency
    - Making national laws
    - Running the army
    answer: Building village roads and drains
    difficulty: 1
    hints:
    - Local needs.
    - Roads, water.
    solution: Panchayats handle local needs like roads and drains.
    mistakes: {"Making national laws": "s6_panchayat_work"}
  - prompt: Which amendment gave panchayats constitutional status?
    options:
    - 73rd Amendment (1992)
    - 42nd Amendment
    - 1st Amendment
    - 86th Amendment
    answer: 73rd Amendment (1992)
    difficulty: 2
    hints:
    - '1992.'
    - Seventy-third.
    solution: The 73rd Amendment, 1992.
    mistakes: {"42nd Amendment": "s6_73rd"}
  - prompt: At least what share of panchayat seats are reserved for women by law?
    options:
    - One-third
    - One-tenth
    - None
    - One-hundredth
    answer: One-third
    difficulty: 2
    hints:
    - Many states, like Kerala, give half.
    - Minimum by the Constitution.
    solution: At least one-third are reserved for women.
    mistakes: {"One-tenth": "s6_women_seats"}
  - prompt: 'A Gram Panchayat elected in 2025 will next face elections in:'
    answer: '2030'
    check: 2025+5
    difficulty: 2
    hints:
    - Panchayats are elected for 5 years.
    - 2025 + 5.
    solution: 'Step 1: the term is 5 years. Step 2: 2025 + 5 = 2030.'
    mistakes:
      '2028': c6ss11_law
      '2035': c6ss11_law
  - prompt: 'In Kerala, the head of a Gram Panchayat is called the:'
    options:
    - President
    - Prime Minister
    - Judge
    answer: President
    difficulty: 2
    hints:
    - In many states the head is the Sarpanch.
    - Kerala uses a different word.
    solution: 'Step 1: most states say Sarpanch or Pradhan. Step 2: Kerala calls the head the President.'
    mistakes:
      Prime Minister: c6ss11_body
      Judge: c6ss11_body
  - prompt: Which work would a Gram Panchayat NOT do?
    options:
    - Defend the country's borders
    - Repair the village road
    - Fix street lights
    answer: Defend the country's borders
    difficulty: 1
    hints:
    - Panchayats handle village needs.
    - Which one is a national job?
    solution: 'Step 1: roads and lights are village jobs. Step 2: border defence belongs to the central government.'
    mistakes:
      Repair the village road: c6ss11_work
      Fix street lights: c6ss11_work
  - prompt: 'Registering a baby''s birth in a village is done by the:'
    options:
    - Gram Panchayat
    - Supreme Court
    - Parliament
    answer: Gram Panchayat
    difficulty: 1
    hints:
    - It is a local record.
    - The nearest government office in a village.
    solution: 'Step 1: birth records are kept locally. Step 2: in villages the Gram Panchayat does this.'
    mistakes:
      Supreme Court: c6ss11_work
      Parliament: c6ss11_work
  - prompt: Who approves the village plan and budget in a meeting of all adult voters?
    options:
    - The Gram Sabha
    - The Supreme Court
    - The Zila Parishad alone
    answer: The Gram Sabha
    difficulty: 2
    hints:
    - It is the meeting of all adult voters.
    - It checks the panchayat's plans.
    solution: 'Step 1: all village voters meet in the Gram Sabha. Step 2: it discusses and approves the plan and budget.'
    mistakes:
      The Supreme Court: c6ss11_body
      The Zila Parishad alone: c6ss11_tier
  - prompt: In which year did the 73rd Amendment give panchayats constitutional status?
    answer: '1992'
    check: '1992'
    difficulty: 2
    hints:
    - It was in the early 1990s.
    - 'Same amendment number: 73rd.'
    solution: 'Step 1: Parliament passed the 73rd Amendment in the early 1990s. Step 2: it was in 1992.'
    mistakes:
      '1947': c6ss11_law
      '1950': c6ss11_law
  - prompt: Why are seats reserved for women in panchayats?
    options:
    - So women have a fair say in village decisions
    - Because men cannot vote
    - To make meetings shorter
    answer: So women have a fair say in village decisions
    difficulty: 2
    hints:
    - Women were often left out before.
    - Reservation makes room for them.
    solution: 'Step 1: women were under-represented. Step 2: reserved seats ensure they take part in decisions.'
    mistakes:
      Because men cannot vote: c6ss11_law
      To make meetings shorter: c6ss11_law
  - prompt: A village with 1,200 adult voters holds a Gram Sabha. How many people can attend as members?
    answer: '1200'
    check: '1200'
    difficulty: 3
    hints:
    - The Gram Sabha includes every adult voter.
    - So count them all.
    solution: 'Step 1: all adult voters are members. Step 2: so all 1,200 can attend.'
    mistakes:
      '12': c6ss11_body
      '120': c6ss11_body
  - prompt: Who appoints the panchayat secretary?
    options:
    - The government
    - The Gram Sabha by vote
    - The Sarpanch's family
    answer: The government
    difficulty: 3
    hints:
    - The secretary is not elected.
    - He or she is an official.
    solution: 'Step 1: the secretary keeps records and is not elected. Step 2: the government appoints this official.'
    mistakes:
      The Gram Sabha by vote: c6ss11_body
      The Sarpanch's family: c6ss11_body
- code: cbse6ss.rural.tiers
  title: Three tiers of Panchayati Raj
  after:
  - cbse6ss.rural.panchayat
  notes: |
    Three tiers: Gram Panchayat (village level), Panchayat Samiti / Block Panchayat (block level, groups of villages),
    Zila Parishad / District Panchayat (district level). Higher tiers plan for larger areas and coordinate. Funds come
    from local taxes (house, market), and grants from state and central governments. Schemes like MGNREGA (work
    guarantee) run through panchayats. People's participation in Gram Sabha keeps the panchayat accountable.
  explanations:
    text: Panchayati Raj has three levels. The Gram Panchayat works for one village, the Block Panchayat for a group of villages, and the District Panchayat (Zila Parishad) for the whole district. Money comes from local taxes and from the state and central governments.
    visual: 'Draw a pyramid: bottom, many Gram Panchayats; middle, a few Block Panchayats; top, one District Panchayat.'
    step_by_step: 'Step 1: Is the work for one village, a block or a district? Step 2: Match it to the tier. Step 3: Think about where the money comes from.'
    real_world: A road linking several villages may be built by the Block Panchayat, while a village drain is the Gram Panchayat's job.
  picture:
    kind: flow
    steps:
    - Gram Panchayat (village)
    - Block Panchayat / Panchayat Samiti
    - District Panchayat / Zila Parishad
    alt: 'Three tiers of Panchayati Raj: Gram Panchayat at the village, Block Panchayat above it and District Panchayat at the top.'
  activity:
    type: order
    prompt: Order the tiers of Panchayati Raj from smallest area to largest.
    steps:
    - Gram Panchayat (village)
    - Panchayat Samiti / Block Panchayat
    - Zila Parishad / District Panchayat
    reasons:
      Panchayat Samiti / Block Panchayat: A block groups many villages, so it is bigger than one village.
      Zila Parishad / District Panchayat: A district holds many blocks.
  lesson:
    - teach: Panchayati Raj has three tiers. At the bottom is the Gram Panchayat for a village. In the middle is the Panchayat Samiti (Block Panchayat) for a group of villages. At the top is the Zila Parishad (District Panchayat) for the whole district.
      picture:
        kind: flow
        steps:
        - Gram Panchayat (village)
        - Panchayat Samiti (block)
        - Zila Parishad (district)
        alt: 'Three tiers: Gram Panchayat for a village, Panchayat Samiti for a block, Zila Parishad for a district.'
      check:
        prompt: Which tier plans for a whole district?
        options:
        - Zila Parishad
        - Gram Panchayat
        - Gram Sabha
        answer: Zila Parishad
        why: Zila means district.
    - teach: Higher tiers plan for bigger areas and link villages together, for example a road joining several villages or a block hospital. Panchayats get money from local taxes (on houses, markets) and grants from the state and central governments.
      check:
        prompt: 'A road joining ten villages in a block is best planned by the:'
        options:
        - Panchayat Samiti (block)
        - One Gram Panchayat alone
        - A single family
        answer: Panchayat Samiti (block)
        why: It covers many villages, so the block level plans it.
    - teach: 'Schemes like MGNREGA, which guarantees paid work to rural families, run through panchayats. When villagers attend the Gram Sabha and ask questions, the panchayat stays accountable: it must explain how money was spent.'
      check:
        prompt: How can villagers check how the panchayat spent its money?
        options:
        - Ask questions in the Gram Sabha
        - Stay at home
        - Wait for the Supreme Court
        answer: Ask questions in the Gram Sabha
        why: The Gram Sabha is where the panchayat must answer to people.
  items:
  - prompt: How many tiers does Panchayati Raj have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Village, block, district.
    - Count.
    solution: Three tiers.
    mistakes: {"2": "s6_three_tiers", "4": "s6_three_tiers"}
  - prompt: 'The top tier of Panchayati Raj is the:'
    options:
    - Zila Parishad (District Panchayat)
    - Gram Sabha
    - Gram Panchayat
    - Ward
    answer: Zila Parishad (District Panchayat)
    difficulty: 1
    hints:
    - District level.
    - Largest area.
    solution: The Zila Parishad is at the district level.
    mistakes: {"Gram Sabha": "s6_zila"}
  - prompt: 'The middle tier works at the:'
    options:
    - block level
    - village level
    - national level
    - household level
    answer: block level
    difficulty: 1
    hints:
    - Group of villages.
    - Panchayat Samiti.
    solution: The Panchayat Samiti works at block level.
    mistakes: {"village level": "s6_block"}
  - prompt: 'Panchayats get money from:'
    options:
    - local taxes and government grants
    - only lotteries
    - only donations
    - printing money
    answer: local taxes and government grants
    difficulty: 2
    hints:
    - House tax, market fees.
    - State and central funds.
    solution: Local taxes and grants fund panchayats.
    mistakes: {"printing money": "s6_panchayat_money"}
  - prompt: How do villagers keep the panchayat accountable?
    options:
    - By attending Gram Sabha meetings and asking questions
    - By staying silent
    - By not voting
    - By moving away
    answer: By attending Gram Sabha meetings and asking questions
    difficulty: 2
    hints:
    - Participation.
    - Questions.
    solution: Taking part in the Gram Sabha keeps the panchayat answerable.
    mistakes: {"By staying silent": "s6_accountable"}
  - prompt: 'MGNREGA, run through panchayats, mainly provides:'
    options:
    - guaranteed paid work in villages
    - free cars
    - foreign travel
    - school uniforms only
    answer: guaranteed paid work in villages
    difficulty: 2
    hints:
    - Employment.
    - Rural jobs.
    solution: MGNREGA guarantees paid work to rural households.
    mistakes: {"school uniforms only": "s6_mgnrega"}
  - prompt: Which tier is in the middle of Panchayati Raj?
    options:
    - Panchayat Samiti
    - Zila Parishad
    - Gram Panchayat
    answer: Panchayat Samiti
    difficulty: 1
    hints:
    - Village at the bottom, district at the top.
    - What is in between?
    solution: 'Step 1: the bottom is village, the top district. Step 2: the middle is the block-level Panchayat Samiti.'
    mistakes:
      Zila Parishad: c6ss11_tier
      Gram Panchayat: c6ss11_tier
  - prompt: 'In Kerala, the district-level tier is called the:'
    options:
    - District Panchayat
    - Gram Sabha
    - Municipality
    answer: District Panchayat
    difficulty: 2
    hints:
    - Other states call it Zila Parishad.
    - Kerala uses the English word for zila.
    solution: 'Step 1: zila means district. Step 2: Kerala calls it the District Panchayat.'
    mistakes:
      Gram Sabha: c6ss11_tier
      Municipality: c6ss11_tier
  - prompt: 'A tax on houses collected by the panchayat is a source of:'
    options:
    - Local income
    - Central grants
    - Court fines
    answer: Local income
    difficulty: 2
    hints:
    - The panchayat collects it itself.
    - Not sent from outside.
    solution: 'Step 1: the panchayat collects the house tax. Step 2: so it is its own local income.'
    mistakes:
      Central grants: c6ss11_money
      Court fines: c6ss11_money
  - prompt: MGNREGA promises rural households up to how many days of paid work a year?
    answer: '100'
    check: '100'
    difficulty: 3
    hints:
    - It is a round number.
    - A little over three months of working days.
    solution: 'Step 1: MGNREGA guarantees work days to each rural household. Step 2: the guarantee is up to 100 days a year.'
    mistakes:
      '365': c6ss11_money
      '30': c6ss11_money
  - prompt: How many tiers are below the Zila Parishad?
    answer: '2'
    check: 3-1
    difficulty: 2
    hints:
    - There are three tiers in all.
    - The Zila Parishad is the top one.
    solution: 'Step 1: three tiers, with the Zila Parishad on top. Step 2: 3 − 1 = 2 below it.'
    mistakes:
      '3': c6ss11_tier
      '1': c6ss11_tier
  - prompt: Why is a three-tier system useful?
    options:
    - Small needs are met locally, bigger ones at block or district level
    - It makes villages invisible
    - It removes elections
    answer: Small needs are met locally, bigger ones at block or district level
    difficulty: 3
    hints:
    - Some needs cover one village, some many.
    - Each tier fits a size of task.
    solution: 'Step 1: a village handles its own drains. Step 2: block and district handle things shared by many villages, like hospitals and big roads.'
    mistakes:
      It makes villages invisible: c6ss11_tier
      It removes elections: c6ss11_tier
  - prompt: A panchayat says it built a well, but villagers find none. What should they do?
    options:
    - Raise it in the Gram Sabha and ask for accounts
    - Say nothing
    - Build a wall
    answer: Raise it in the Gram Sabha and ask for accounts
    difficulty: 2
    hints:
    - Villagers can question the panchayat.
    - Where do they do that?
    solution: 'Step 1: the Gram Sabha is where the panchayat must answer. Step 2: villagers should ask for the accounts there.'
    mistakes:
      Say nothing: c6ss11_check
      Build a wall: c6ss11_check
  - prompt: 'Grants from the state government to the panchayat are money that:'
    options:
    - Comes from outside to help it work
    - The panchayat earns from markets
    - Villagers pay as fines
    answer: Comes from outside to help it work
    difficulty: 2
    hints:
    - A grant is given, not earned.
    - From a higher level of government.
    solution: 'Step 1: grants are given by state or central government. Step 2: they come from outside the village to help.'
    mistakes:
      The panchayat earns from markets: c6ss11_money
      Villagers pay as fines: c6ss11_money
  - prompt: 'The block level of Panchayati Raj is also called the:'
    options:
    - Block Panchayat
    - Gram Sabha
    - Parliament
    answer: Block Panchayat
    difficulty: 1
    hints:
    - It works at the block level.
    - Its other name is Panchayat Samiti.
    solution: 'Step 1: the middle tier works for a block. Step 2: it is the Panchayat Samiti or Block Panchayat.'
    mistakes:
      Gram Sabha: c6ss11_tier
      Parliament: c6ss11_tier
