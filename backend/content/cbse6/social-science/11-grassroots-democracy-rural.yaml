concepts:
- code: cbse6ss.rural.panchayat
  title: The Gram Sabha and Gram Panchayat
  notes: |
    Panchayati Raj: local self-government in villages, given constitutional status by the 73rd Amendment (1992). Gram
    Sabha: all adults (18+) on the village voters' list; meets to discuss plans, approve the budget and check the
    panchayat's work. Gram Panchayat: elected members (ward members, panch) headed by the Sarpanch/Pradhan (in Kerala,
    President); elected for 5 years; secretary appointed by government. Work: roads, drains, drinking water, street lights,
    sanitation, birth and death registration. At least one-third of seats reserved for women (many states, including
    Kerala, reserve half).
  explanations:
    text: In villages, people govern themselves through the Panchayati Raj. All adult voters of a village form the Gram Sabha. They elect the Gram Panchayat, led by a Sarpanch or President, for 5 years. The panchayat looks after roads, water, drains and street lights, and the Gram Sabha checks its work.
    visual: 'Picture a meeting under a big tree: all adults of the village (Gram Sabha) discussing a new well, while the elected panchayat members and President sit at the front listening.'
    step_by_step: 'Step 1: Find who is in the Gram Sabha: all adult voters. Step 2: Find who is elected: Gram Panchayat members. Step 3: Find the head: Sarpanch/President. Step 4: List the panchayat''s work.'
    real_world: Kerala's panchayats run many local services, and half the seats are reserved for women.
  picture:
    kind: compare
    columns:
    - title: Gram Sabha
      points:
      - all adult voters
      - discusses and approves plans
      - checks the panchayat
    - title: Gram Panchayat
      points:
      - elected members
      - headed by Sarpanch/President
      - does the work
    alt: The Gram Sabha is all adult voters who discuss plans and check work; the Gram Panchayat is the elected body headed by the Sarpanch that does the work.
  activity:
    type: sort
    prompt: Gram Sabha or Gram Panchayat?
    bins:
    - Gram Sabha
    - Gram Panchayat
    items:
    - label: All adults on the village voters' list
      bin: Gram Sabha
      clue: Everyone 18+.
      why: Gram Sabha.
    - label: Elected ward members headed by the Sarpanch
      bin: Gram Panchayat
      clue: A smaller elected body.
      why: Gram Panchayat.
    - label: Approves the budget and checks the panchayat's work
      bin: Gram Sabha
      clue: The whole village.
      why: Gram Sabha.
    - label: Builds drains and fixes street lights
      bin: Gram Panchayat
      clue: Does the work.
      why: Gram Panchayat.
    - label: Registers births and deaths
      bin: Gram Panchayat
      clue: Office work.
      why: Gram Panchayat.
  items:
  - prompt: 'The Gram Sabha consists of:'
    options:
    - all adult voters of the village
    - only the Sarpanch
    - only government officers
    - children of the village
    answer: all adult voters of the village
    difficulty: 1
    hints:
    - Everyone 18+ on the list.
    - Large meeting.
    solution: All adult voters form the Gram Sabha.
    mistakes:
      only the Sarpanch: c6ss_sabha_panchayat
  - prompt: 'The head of a Gram Panchayat is usually called the:'
    options:
    - Sarpanch (or President)
    - Mayor
    - Prime Minister
    - Governor
    answer: Sarpanch (or President)
    difficulty: 1
    hints:
    - Village head.
    - Pradhan.
    solution: The Sarpanch heads the panchayat.
    mistakes: {"Mayor": "s6_sarpanch"}
  - prompt: For how many years is a Gram Panchayat elected?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Same as most elections.
    - Five.
    solution: 5 years.
    mistakes: {"4": "s6_panchayat_term", "3": "s6_panchayat_term"}
  - prompt: Which work is done by a Gram Panchayat?
    options:
    - Building village roads and drains
    - Printing currency
    - Making national laws
    - Running the army
    answer: Building village roads and drains
    difficulty: 1
    hints:
    - Local needs.
    - Roads, water.
    solution: Panchayats handle local needs like roads and drains.
    mistakes: {"Making national laws": "s6_panchayat_work"}
  - prompt: Which amendment gave panchayats constitutional status?
    options:
    - 73rd Amendment (1992)
    - 42nd Amendment
    - 1st Amendment
    - 86th Amendment
    answer: 73rd Amendment (1992)
    difficulty: 2
    hints:
    - '1992.'
    - Seventy-third.
    solution: The 73rd Amendment, 1992.
    mistakes: {"42nd Amendment": "s6_73rd"}
  - prompt: At least what share of panchayat seats are reserved for women by law?
    options:
    - One-third
    - One-tenth
    - None
    - One-hundredth
    answer: One-third
    difficulty: 2
    hints:
    - Many states, like Kerala, give half.
    - Minimum by the Constitution.
    solution: At least one-third are reserved for women.
    mistakes: {"One-tenth": "s6_women_seats"}
- code: cbse6ss.rural.tiers
  title: Three tiers of Panchayati Raj
  after:
  - cbse6ss.rural.panchayat
  notes: |
    Three tiers: Gram Panchayat (village level), Panchayat Samiti / Block Panchayat (block level, groups of villages),
    Zila Parishad / District Panchayat (district level). Higher tiers plan for larger areas and coordinate. Funds come
    from local taxes (house, market), and grants from state and central governments. Schemes like MGNREGA (work
    guarantee) run through panchayats. People's participation in Gram Sabha keeps the panchayat accountable.
  explanations:
    text: Panchayati Raj has three levels. The Gram Panchayat works for one village, the Block Panchayat for a group of villages, and the District Panchayat (Zila Parishad) for the whole district. Money comes from local taxes and from the state and central governments.
    visual: 'Draw a pyramid: bottom, many Gram Panchayats; middle, a few Block Panchayats; top, one District Panchayat.'
    step_by_step: 'Step 1: Is the work for one village, a block or a district? Step 2: Match it to the tier. Step 3: Think about where the money comes from.'
    real_world: A road linking several villages may be built by the Block Panchayat, while a village drain is the Gram Panchayat's job.
  picture:
    kind: flow
    steps:
    - Gram Panchayat (village)
    - Block Panchayat / Panchayat Samiti
    - District Panchayat / Zila Parishad
    alt: 'Three tiers of Panchayati Raj: Gram Panchayat at the village, Block Panchayat above it and District Panchayat at the top.'
  activity:
    type: order
    prompt: Order the tiers of Panchayati Raj from smallest area to largest.
    steps:
    - Gram Panchayat (village)
    - Panchayat Samiti / Block Panchayat
    - Zila Parishad / District Panchayat
    reasons:
      Panchayat Samiti / Block Panchayat: A block groups many villages, so it is bigger than one village.
      Zila Parishad / District Panchayat: A district holds many blocks.
  items:
  - prompt: How many tiers does Panchayati Raj have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Village, block, district.
    - Count.
    solution: Three tiers.
    mistakes: {"2": "s6_three_tiers", "4": "s6_three_tiers"}
  - prompt: 'The top tier of Panchayati Raj is the:'
    options:
    - Zila Parishad (District Panchayat)
    - Gram Sabha
    - Gram Panchayat
    - Ward
    answer: Zila Parishad (District Panchayat)
    difficulty: 1
    hints:
    - District level.
    - Largest area.
    solution: The Zila Parishad is at the district level.
    mistakes: {"Gram Sabha": "s6_zila"}
  - prompt: 'The middle tier works at the:'
    options:
    - block level
    - village level
    - national level
    - household level
    answer: block level
    difficulty: 1
    hints:
    - Group of villages.
    - Panchayat Samiti.
    solution: The Panchayat Samiti works at block level.
    mistakes: {"village level": "s6_block"}
  - prompt: 'Panchayats get money from:'
    options:
    - local taxes and government grants
    - only lotteries
    - only donations
    - printing money
    answer: local taxes and government grants
    difficulty: 2
    hints:
    - House tax, market fees.
    - State and central funds.
    solution: Local taxes and grants fund panchayats.
    mistakes: {"printing money": "s6_panchayat_money"}
  - prompt: How do villagers keep the panchayat accountable?
    options:
    - By attending Gram Sabha meetings and asking questions
    - By staying silent
    - By not voting
    - By moving away
    answer: By attending Gram Sabha meetings and asking questions
    difficulty: 2
    hints:
    - Participation.
    - Questions.
    solution: Taking part in the Gram Sabha keeps the panchayat answerable.
    mistakes: {"By staying silent": "s6_accountable"}
  - prompt: 'MGNREGA, run through panchayats, mainly provides:'
    options:
    - guaranteed paid work in villages
    - free cars
    - foreign travel
    - school uniforms only
    answer: guaranteed paid work in villages
    difficulty: 2
    hints:
    - Employment.
    - Rural jobs.
    solution: MGNREGA guarantees paid work to rural households.
    mistakes: {"school uniforms only": "s6_mgnrega"}
