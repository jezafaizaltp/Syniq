# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 13. Format: content/README.md.
subject: cbse6-ss
chapter: 13
title: The Value of Work
tips:
  c6ss_economic: Economic activities earn money or produce goods for sale. Non-economic activities are done out of love, care or duty, without payment.
  s6_child_labour: "Children have a right to education."
  s6_cook_economic: "The cook is paid."
  s6_daily_wage: "Daily wage × days: 600 × 5."
  s6_dignity: "'Dignity' means respect."
  s6_economic: "Is the farmer earning money?"
  s6_for_money: "The difference between economic and non-economic is about payment."
  s6_gandhi: "Gandhi cleaned toilets at his ashram himself."
  s6_household_value: "Unpaid work still keeps families going."
  s6_profit: "A salary is paid to a worker. What does a shopkeeper keep after paying all costs?"
  s6_salary: "Profit is what a business keeps after costs. What do we call a worker's fixed monthly pay?"
  s6_volunteer: "Volunteers are not paid."
  c6ss13_kind: 'Ask one question: is this done to earn money, or out of love, care or duty?'
  c6ss13_value: 'Unpaid work still has value: think what would happen if nobody did it.'
  c6ss13_pay: 'Match the way of earning to how and when it is paid: by the day, by the month, or what a business keeps after costs.'
  c6ss13_calc: Multiply the pay for one unit of time by the number of units, or take costs away from takings.
  c6ss13_dignity: Every honest job helps others and deserves the same respect.
  c6ss13_child: Children have a right to school and play; the law protects them from work.
concepts:
- code: cbse6ss.work.types
  title: Economic and non-economic activities
  notes: |
    Economic activities: done to earn money or produce goods and services for exchange (farmer selling rice, teacher
    paid salary, shopkeeper). Non-economic activities: done out of love, care, duty or for social reasons, not for money
    (a mother cooking for the family, volunteering, helping a neighbour). The same activity can be either (cooking at home
    vs. a cook in a restaurant). Unpaid work at home is valuable but often unrecognised.
  explanations:
    text: 'Some work earns money, like a farmer selling rice or a teacher getting a salary: these are economic activities. Other work is done out of love or care, like a parent cooking at home or volunteering: these are non-economic activities. Both are valuable.'
    visual: 'Picture two kitchens: in a restaurant, a cook is paid to make dosas (economic); at home, a grandmother makes dosas for the family (non-economic). Same work, different purpose.'
    step_by_step: 'Step 1: Look at the activity. Step 2: Ask: is it done for money or exchange? Step 3: Yes: economic. Step 4: No, done for love, duty or service: non-economic.'
    real_world: A doctor treating patients in a hospital earns a salary; the same doctor treating people free at a village camp is volunteering.
  picture:
    kind: compare
    columns:
    - title: Economic
      points:
      - farmer selling vegetables
      - paid teacher
      - shopkeeper
    - title: Non-economic
      points:
      - parent cooking at home
      - volunteering
      - helping a neighbour
    alt: Selling vegetables, paid teaching and shopkeeping are economic; cooking at home, volunteering and helping neighbours are non-economic.
  activity:
    type: sort
    prompt: Economic or non-economic activity?
    bins:
    - Economic
    - Non-economic
    items:
    - label: A farmer selling rice
      bin: Economic
      clue: Earns money.
      why: Economic.
    - label: A mother cooking for her family
      bin: Non-economic
      clue: Done out of love.
      why: Non-economic.
    - label: A cook in a restaurant
      bin: Economic
      clue: Paid for cooking.
      why: 'Economic: the same work, but for pay.'
    - label: Volunteering at a flood camp
      bin: Non-economic
      clue: No pay.
      why: Non-economic.
    - label: A teacher's salary job
      bin: Economic
      clue: Paid monthly.
      why: Economic.
    - label: Helping a neighbour carry bags
      bin: Non-economic
      clue: Kindness.
      why: Non-economic.
  lesson:
    - teach: 'Economic activities are done to earn money or to produce goods and services for sale: a farmer selling rice, a teacher earning a salary, a shopkeeper selling goods.'
      check:
        prompt: 'A tailor stitches clothes for customers and is paid. This is:'
        options:
        - An economic activity
        - A non-economic activity
        - A hobby only
        answer: An economic activity
        why: It is done to earn money.
    - teach: 'Non-economic activities are done out of love, care, duty or for society, not for money: a parent cooking for the family, volunteering at a camp, helping a neighbour.'
      check:
        prompt: 'A boy teaches his little sister to read at home. This is:'
        options:
        - A non-economic activity
        - An economic activity
        - A job with salary
        answer: A non-economic activity
        why: It is done out of love, not for pay.
    - teach: The same activity can be either. Cooking at home for the family is non-economic; a cook in a restaurant is economic. Unpaid housework and care keep families going, even though they are often not counted or thanked.
      picture:
        kind: compare
        columns:
        - title: Non-economic
          points:
          - mother cooks for family
          - grandson nurses grandmother
        - title: Economic
          points:
          - cook in a restaurant
          - nurse in a hospital
        alt: Cooking and nursing are non-economic at home for family, but economic when done for pay.
      check:
        prompt: 'A nurse caring for patients in a hospital for a salary does:'
        options:
        - An economic activity
        - A non-economic activity
        - No work
        answer: An economic activity
        why: She is paid for her work.
  items:
  - prompt: 'A farmer selling vegetables in a market is doing:'
    options:
    - an economic activity
    - a non-economic activity
    - no work
    - a hobby only
    answer: an economic activity
    difficulty: 1
    hints:
    - For money.
    - Sale.
    solution: Selling for money is economic.
    mistakes: {"a non-economic activity": "s6_economic"}
  - prompt: 'A mother cooking food for her family is doing:'
    options:
    - a non-economic activity
    - an economic activity
    - nothing useful
    - a government job
    answer: a non-economic activity
    difficulty: 1
    hints:
    - Done out of love.
    - Not paid.
    solution: Unpaid care work is non-economic.
    mistakes:
      an economic activity: c6ss_economic
  - prompt: 'Volunteering to clean a beach is:'
    options:
    - non-economic
    - economic
    - illegal
    - a business
    answer: non-economic
    difficulty: 1
    hints:
    - No payment.
    - Service.
    solution: Volunteering is non-economic.
    mistakes: {"economic": "s6_volunteer"}
  - prompt: 'A cook in a restaurant is doing:'
    options:
    - an economic activity
    - a non-economic activity
    - volunteering
    - a school activity
    answer: an economic activity
    difficulty: 1
    hints:
    - Paid.
    - Job.
    solution: A paid cook does economic work.
    mistakes: {"volunteering": "s6_cook_economic"}
  - prompt: Why is household work valuable even though it is unpaid?
    options:
    - Families depend on it for care and daily life
    - It isn't valuable
    - It earns lots of money
    - Only because it is easy
    answer: Families depend on it for care and daily life
    difficulty: 2
    hints:
    - Imagine a home without it.
    - Care.
    solution: Household work keeps families running.
    mistakes: {"It isn't valuable": "s6_household_value"}
  - prompt: 'The same activity can be economic or non-economic depending on:'
    options:
    - whether it is done for money
    - the time of day
    - the weather
    - the colour of clothes
    answer: whether it is done for money
    difficulty: 2
    hints:
    - Purpose.
    - Payment.
    solution: Purpose (money or not) decides.
    mistakes: {"the time of day": "s6_for_money"}
  - prompt: 'A fisherman sells his catch at the harbour. This is:'
    options:
    - An economic activity
    - A non-economic activity
    - Volunteering
    answer: An economic activity
    difficulty: 1
    hints:
    - He sells the fish.
    - Money is earned.
    solution: 'Step 1: he sells his catch for money. Step 2: so it is economic.'
    mistakes:
      A non-economic activity: c6ss13_kind
      Volunteering: c6ss13_kind
  - prompt: 'A girl helps her grandmother with medicines every evening. This is:'
    options:
    - A non-economic activity
    - An economic activity
    - A business
    answer: A non-economic activity
    difficulty: 1
    hints:
    - No money is involved.
    - Done out of care.
    solution: 'Step 1: she isn''t paid. Step 2: done out of love, so it is non-economic.'
    mistakes:
      An economic activity: c6ss13_kind
      A business: c6ss13_kind
  - prompt: Which is an economic activity?
    options:
    - A carpenter making chairs to sell
    - Playing cricket with friends
    - Watering plants at home
    answer: A carpenter making chairs to sell
    difficulty: 1
    hints:
    - Which one earns money?
    - Something is made for sale.
    solution: 'Step 1: playing and home gardening earn nothing. Step 2: making chairs to sell earns money: economic.'
    mistakes:
      Playing cricket with friends: c6ss13_kind
      Watering plants at home: c6ss13_kind
  - prompt: 'Donating blood at a camp is:'
    options:
    - Non-economic, done to help others
    - Economic, for profit
    - A salary job
    answer: Non-economic, done to help others
    difficulty: 2
    hints:
    - Donors are not paid.
    - It saves lives.
    solution: 'Step 1: blood donors are not paid. Step 2: so it is a non-economic act of service.'
    mistakes:
      Economic, for profit: c6ss13_kind
      A salary job: c6ss13_kind
  - prompt: A woman stitches her son's school uniform at home, then stitches dresses for customers. Which is economic?
    options:
    - Stitching for customers
    - Stitching her son's uniform
    - Both
    answer: Stitching for customers
    difficulty: 2
    hints:
    - Same skill, two purposes.
    - Which one earns money?
    solution: 'Step 1: the uniform is for her family: non-economic. Step 2: dresses for customers earn money: economic.'
    mistakes:
      Stitching her son's uniform: c6ss13_kind
      Both: c6ss13_kind
  - prompt: If nobody did cooking, cleaning and caring at home for a week, what would happen?
    options:
    - Family life would become very hard
    - Nothing
    - Everyone would earn more
    answer: Family life would become very hard
    difficulty: 2
    hints:
    - This work is unpaid.
    - But is it needed?
    solution: 'Step 1: meals, clean homes and care would stop. Step 2: so this unpaid work is very valuable.'
    mistakes:
      Nothing: c6ss13_value
      Everyone would earn more: c6ss13_value
  - prompt: 'A doctor treating patients free at a weekend camp, without pay, is doing:'
    options:
    - A non-economic activity
    - An economic activity
    - Trade
    answer: A non-economic activity
    difficulty: 3
    hints:
    - Doctors usually earn from their work.
    - But here, is there pay?
    solution: 'Step 1: no money is earned at the camp. Step 2: so this activity is non-economic, even though doctoring is usually economic.'
    mistakes:
      An economic activity: c6ss13_kind
      Trade: c6ss13_kind
  - prompt: Why is unpaid household work often called 'invisible'?
    options:
    - It is not paid or counted, so people forget its value
    - Nobody can see the house
    - It is done at night
    answer: It is not paid or counted, so people forget its value
    difficulty: 3
    hints:
    - It doesn't show up in any income.
    - So it's easy to overlook.
    solution: 'Step 1: no wages are recorded for it. Step 2: so its value is often overlooked, though families depend on it.'
    mistakes:
      Nobody can see the house: c6ss13_value
      It is done at night: c6ss13_value
  - prompt: 'Students cleaning their school campus on Swachhata Day are doing:'
    options:
    - Non-economic, community work
    - Economic work
    - Paid labour
    answer: Non-economic, community work
    difficulty: 1
    hints:
    - Are they paid?
    - They do it for the school community.
    solution: 'Step 1: no one is paid. Step 2: it is done for the community, so non-economic.'
    mistakes:
      Economic work: c6ss13_kind
      Paid labour: c6ss13_kind
- code: cbse6ss.work.dignity
  title: Dignity of labour and earning
  after:
  - cbse6ss.work.types
  notes: |
    Dignity of labour: all honest work deserves respect: farmers, cleaners, carpenters, doctors, engineers. Mahatma Gandhi
    cleaned toilets himself to show this. People earn wages (daily), salary (monthly), profit (business) or fees. Skills
    and education help people find work. Work also gives satisfaction and a sense of contributing. Child labour is wrong
    and illegal; children should be in school.
  explanations:
    text: 'Every honest job deserves respect, whether it''s cleaning streets, farming, teaching or building. This is called the dignity of labour. People earn as wages, salary or profit. Children should study and play, not work for money: child labour is against the law.'
    visual: 'Picture a row of workers: a sanitation worker, a farmer, a carpenter, a nurse and an engineer, each with a sign ''My work matters''.'
    step_by_step: 'Step 1: Name the job. Step 2: Ask who benefits from it. Step 3: Recognise that society needs it. Step 4: Give it equal respect.'
    real_world: Gandhiji cleaned toilets in his ashram to teach that no work is too low.
  picture:
    kind: compare
    columns:
    - title: Way of earning
      points:
      - Wages
      - Salary
      - Profit
    - title: Paid to
      points:
      - daily labourers
      - monthly employees
      - business owners
    alt: Daily labourers earn wages, monthly employees earn a salary and business owners earn profit.
  activity:
    type: sort
    prompt: Wage, salary, profit or fee?
    bins:
    - Wage
    - Salary
    - Profit
    - Fee
    items:
    - label: A labourer paid at the end of each day
      bin: Wage
      clue: Daily.
      why: Wage.
    - label: A clerk paid every month
      bin: Salary
      clue: Monthly.
      why: Salary.
    - label: A shopkeeper's earnings after costs
      bin: Profit
      clue: Business.
      why: Profit.
    - label: A doctor charges per visit
      bin: Fee
      clue: For a service.
      why: Fee.
  lesson:
    - teach: 'Dignity of labour means every honest job deserves respect: farmer, cleaner, carpenter, doctor, engineer. Mahatma Gandhi cleaned toilets himself to show that no work is low.'
      check:
        prompt: Which shows dignity of labour?
        options:
        - Treating the school cleaner with the same respect as the principal
        - Laughing at a cobbler
        - Calling some jobs dirty
        answer: Treating the school cleaner with the same respect as the principal
        why: All honest work deserves respect.
    - teach: 'People earn in different ways: daily wages (paid each day), a salary (paid each month), profit (what a business keeps after paying its costs) and fees (paid for a service, like a lawyer''s).'
      picture:
        kind: compare
        columns:
        - title: Wage
          points:
          - paid daily or weekly
          - construction worker
        - title: Salary
          points:
          - paid monthly
          - teacher, clerk
        - title: Profit
          points:
          - earnings minus costs
          - shopkeeper
        alt: Wages are paid daily, salaries monthly, and profit is what a business keeps after costs.
      check:
        prompt: 'A shop sells goods for ₹10,000 and its costs are ₹7,000. Its profit is:'
        options:
        - ₹3,000
        - ₹17,000
        - ₹10,000
        answer: ₹3,000
        why: Profit = takings − costs = 10,000 − 7,000.
    - teach: 'Skills and education help people find good work, and work gives satisfaction and a sense of contributing. Child labour is wrong and against the law: children belong in school.'
      check:
        prompt: 'A 10-year-old is made to work in a shop all day. This is:'
        options:
        - Child labour, which is illegal
        - A good job
        - A salary job
        answer: Child labour, which is illegal
        why: Children have a right to education, not full-time work.
  items:
  - prompt: '''Dignity of labour'' means:'
    options:
    - all honest work deserves respect
    - only office work is respectable
    - hard work is shameful
    - work only for money
    answer: all honest work deserves respect
    difficulty: 1
    hints:
    - Respect.
    - Every job.
    solution: All honest work is respectable.
    mistakes: {"only office work is respectable": "s6_dignity"}
  - prompt: 'Money paid to a worker every month is called:'
    options:
    - salary
    - profit
    - rent
    - interest
    answer: salary
    difficulty: 1
    hints:
    - Monthly.
    - Employees.
    solution: Monthly pay is a salary.
    mistakes: {"profit": "s6_salary"}
  - prompt: 'Money a shopkeeper earns after paying all costs is:'
    options:
    - profit
    - salary
    - wages
    - tax
    answer: profit
    difficulty: 2
    hints:
    - Business earning.
    - Sales minus costs.
    solution: That is profit.
    mistakes: {"salary": "s6_profit"}
  - prompt: Who cleaned toilets himself to show the dignity of labour?
    options:
    - Mahatma Gandhi
    - Akbar
    - Ashoka
    - Shivaji
    answer: Mahatma Gandhi
    difficulty: 1
    hints:
    - In his ashram.
    - Father of the Nation.
    solution: Gandhiji did this.
    mistakes: {"Ashoka": "s6_gandhi"}
  - prompt: 'Child labour is:'
    options:
    - wrong and illegal; children should be in school
    - a good way to learn
    - allowed for all
    - compulsory
    answer: wrong and illegal; children should be in school
    difficulty: 1
    hints:
    - Right to education.
    - Law.
    solution: Child labour is illegal.
    mistakes: {"a good way to learn": "s6_child_labour"}
  - prompt: A labourer earns ₹600 a day and works 5 days. How much does she earn (in ₹)?
    answer: '3000'
    check: 600*5
    difficulty: 1
    hints:
    - Multiply.
    - 600 × 5.
    solution: 600 × 5 = ₹3,000.
    mistakes: {"605": "s6_daily_wage", "300": "s6_daily_wage"}
  - prompt: 'A teacher is paid ₹30,000 every month. This payment is called:'
    options:
    - Salary
    - Profit
    - Daily wage
    answer: Salary
    difficulty: 1
    hints:
    - Paid every month.
    - Fixed amount.
    solution: 'Step 1: it is paid monthly. Step 2: a monthly payment is a salary.'
    mistakes:
      Profit: c6ss13_pay
      Daily wage: c6ss13_pay
  - prompt: A mason earns ₹800 a day. How much does he earn in 6 days (in ₹)?
    answer: '4800'
    check: 800*6
    difficulty: 1
    hints:
    - Multiply daily wage by days.
    - 800 × 6.
    solution: 'Step 1: 800 × 6. Step 2: = ₹4,800.'
    mistakes:
      '806': c6ss13_calc
      '1400': c6ss13_calc
  - prompt: A vendor sells fruit for ₹2,500 in a day. The fruit cost him ₹1,800. What is his profit (in ₹)?
    answer: '700'
    check: 2500-1800
    difficulty: 2
    hints:
    - Profit = takings − costs.
    - 2,500 − 1,800.
    solution: 'Step 1: 2,500 − 1,800. Step 2: = ₹700 profit.'
    mistakes:
      '4300': c6ss13_calc
      '2500': c6ss13_calc
  - prompt: 'A lawyer charges ₹2,000 for advice. This payment is a:'
    options:
    - Fee
    - Salary
    - Wage
    answer: Fee
    difficulty: 2
    hints:
    - Paid for a particular service.
    - Not monthly, not daily.
    solution: 'Step 1: it is paid for one service. Step 2: such a payment is a fee.'
    mistakes:
      Salary: c6ss13_pay
      Wage: c6ss13_pay
  - prompt: Why did Gandhiji clean toilets himself?
    options:
    - To show that no honest work is low
    - Because he was paid for it
    - As a punishment
    answer: To show that no honest work is low
    difficulty: 1
    hints:
    - Many people looked down on cleaners.
    - He wanted to change that.
    solution: 'Step 1: some work was looked down upon. Step 2: Gandhiji did it himself to show all work has dignity.'
    mistakes:
      Because he was paid for it: c6ss13_dignity
      As a punishment: c6ss13_dignity
  - prompt: Which statement shows dignity of labour?
    options:
    - '''The farmer who grows our food deserves respect.'''
    - '''Only office jobs matter.'''
    - '''Cleaners are less important.'''
    answer: '''The farmer who grows our food deserves respect.'''
    difficulty: 2
    hints:
    - Which statement respects all work?
    - The other two look down on some jobs.
    solution: 'Step 1: two statements rank jobs as better or worse. Step 2: respecting the farmer shows dignity of labour.'
    mistakes:
      '''Only office jobs matter.''': c6ss13_dignity
      '''Cleaners are less important.''': c6ss13_dignity
  - prompt: Where should a 12-year-old spend the working day?
    options:
    - At school
    - In a factory
    - Selling goods on trains
    answer: At school
    difficulty: 1
    hints:
    - Children have a right to education.
    - Child labour is illegal.
    solution: 'Step 1: child labour is against the law. Step 2: a 12-year-old belongs in school.'
    mistakes:
      In a factory: c6ss13_child
      Selling goods on trains: c6ss13_child
  - prompt: A worker earns ₹15,000 a month. How much is that in a year (in ₹)?
    answer: '180000'
    check: 15000*12
    difficulty: 2
    hints:
    - A year has 12 months.
    - 15,000 × 12.
    solution: 'Step 1: 15,000 × 12. Step 2: = ₹1,80,000.'
    mistakes:
      '15012': c6ss13_calc
      '18000': c6ss13_calc
  - prompt: Besides money, what else does work give people?
    options:
    - Satisfaction and a sense of contributing
    - Nothing else
    - Only tiredness
    answer: Satisfaction and a sense of contributing
    difficulty: 2
    hints:
    - Think how a farmer feels at harvest.
    - Or a doctor who cures someone.
    solution: 'Step 1: work produces something useful for others. Step 2: this gives satisfaction and pride.'
    mistakes:
      Nothing else: c6ss13_dignity
      Only tiredness: c6ss13_dignity
