# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 9. Format: content/README.md.
subject: cbse6-ss
chapter: 9
title: Family and Community
tips:
  c6ss_joint: A joint family has grandparents, parents, uncles, aunts and cousins living together. A nuclear family is parents and their children.
concepts:
- code: cbse6ss.fam.family
  title: Families and their roles
  notes: |
    A family is the first group a child belongs to. Types: joint (extended: grandparents, uncles, aunts, cousins together)
    and nuclear (parents and children). Families give love, care, food, safety, values and traditions. Members share
    work and responsibilities; grandparents pass on stories and wisdom. Values learned: sharing, respect, cooperation,
    caring for elders and children. Roles should be shared fairly, including household work.
  explanations:
    text: A family is the first group we belong to. In a joint family, grandparents, uncles, aunts and cousins live together. In a nuclear family, parents live with their children. Families give us love, care and values, and every member can share the work.
    visual: 'Draw two houses. In one: grandparents, parents, an uncle, an aunt and three cousins (joint family). In the other: two parents and two children (nuclear family).'
    step_by_step: 'Step 1: List the members who live together. Step 2: Decide the family type. Step 3: List what the family gives each member. Step 4: List how members can share the work.'
    real_world: 'In many Indian homes, grandparents tell bedtime stories, parents work and children help lay the table: everyone has a role.'
  picture:
    kind: compare
    columns:
    - title: Joint family
      points:
      - grandparents, parents
      - uncles, aunts, cousins
      - share one home
    - title: Nuclear family
      points:
      - parents
      - their children
      - smaller household
    alt: A joint family includes grandparents, parents, uncles, aunts and cousins; a nuclear family has parents and their children.
  items:
  - prompt: 'A family of parents and their children only is a:'
    options:
    - nuclear family
    - joint family
    - community
    - village
    answer: nuclear family
    difficulty: 1
    hints:
    - Small family.
    - Nucleus = centre.
    solution: That is a nuclear family.
    mistakes:
      joint family: c6ss_joint
  - prompt: 'A family with grandparents, uncles, aunts and cousins together is a:'
    options:
    - joint family
    - nuclear family
    - club
    - school
    answer: joint family
    difficulty: 1
    hints:
    - Extended family.
    - Many generations.
    solution: That is a joint family.
  - prompt: What does a family give a child?
    options:
    - love, care, safety and values
    - only money
    - only homework
    - nothing
    answer: love, care, safety and values
    difficulty: 1
    hints:
    - Think about home.
    - Many things.
    solution: Families give love, care, safety and values.
  - prompt: 'Grandparents often pass on:'
    options:
    - stories, traditions and wisdom
    - only rules
    - cars
    - exams
    answer: stories, traditions and wisdom
    difficulty: 1
    hints:
    - Bedtime stories.
    - Experience.
    solution: Grandparents share stories and wisdom.
  - prompt: 'Household work should be:'
    options:
    - shared by all members
    - done only by mothers
    - done only by children
    - left undone
    answer: shared by all members
    difficulty: 2
    hints:
    - Fairness.
    - Everyone can help.
    solution: Sharing work is fair and teaches responsibility.
  - prompt: Which value do we first learn in a family?
    options:
    - Sharing and caring
    - Cheating
    - Fighting
    - Wasting
    answer: Sharing and caring
    difficulty: 1
    hints:
    - Good habits.
    - Love.
    solution: Families teach sharing and caring.
- code: cbse6ss.fam.community
  title: Communities and helping each other
  after:
  - cbse6ss.fam.family
  notes: |
    A community is a larger group of people living in the same area or sharing a common interest (village, neighbourhood,
    residents' association, farming or fishing community). Communities cooperate: festivals, building wells, helping in
    floods (Kerala floods 2018: fishermen rescued thousands with their boats), sharing resources (common grazing land,
    ponds). Community helpers: teachers, doctors, farmers, sanitation workers, postmen. 'Seva' (selfless service).
    Respect and dignity for all who serve the community.
  explanations:
    text: 'A community is a bigger group, like the people in our village, street or town. Communities help each other: they celebrate festivals together, look after shared ponds and help in emergencies. During the 2018 Kerala floods, fishermen used their boats to rescue thousands of people.'
    visual: 'Picture a village: families in houses, a shared pond, a school, a health centre, and people working together to clean the pond before the monsoon.'
    step_by_step: 'Step 1: Name the community. Step 2: List what its members share. Step 3: Find ways they help each other. Step 4: Name community helpers and thank them.'
    real_world: Neighbours bringing food when a family is unwell, or a residents' group cleaning the street together, are communities in action.
  picture:
    kind: compare
    columns:
    - title: Family
      points:
      - small group
      - lives together
      - first group
    - title: Community
      points:
      - larger group
      - same area or interest
      - shares resources
    alt: A family is a small group living together; a community is a larger group sharing an area or interest and its resources.
  items:
  - prompt: 'A group of people living in the same area and helping each other is a:'
    options:
    - community
    - family only
    - classroom only
    - company
    answer: community
    difficulty: 1
    hints:
    - Bigger than a family.
    - Village, street.
    solution: That is a community.
  - prompt: During the 2018 Kerala floods, who rescued many people with their boats?
    options:
    - Fishermen
    - Pilots only
    - Shopkeepers
    - Students only
    answer: Fishermen
    difficulty: 1
    hints:
    - They know the water.
    - Boats.
    solution: Kerala's fishermen rescued thousands.
  - prompt: Which is a community helper?
    options:
    - A sanitation worker
    - A cartoon character
    - A film villain
    - A robot toy
    answer: A sanitation worker
    difficulty: 1
    hints:
    - Keeps streets clean.
    - Serves everyone.
    solution: Sanitation workers help the whole community.
  - prompt: '''Seva'' means:'
    options:
    - selfless service
    - selling goods
    - sleeping
    - saving money only
    answer: selfless service
    difficulty: 2
    hints:
    - Helping without reward.
    - Service.
    solution: Seva means selfless service.
  - prompt: 'A shared village pond is an example of:'
    options:
    - a common resource
    - private property
    - a factory
    - a school subject
    answer: a common resource
    difficulty: 2
    hints:
    - Used by everyone.
    - Shared.
    solution: It is shared by the community.
  - prompt: Why should we respect all community helpers?
    options:
    - Their work keeps everyone safe and healthy
    - They are rich
    - They are famous
    - They give gifts
    answer: Their work keeps everyone safe and healthy
    difficulty: 1
    hints:
    - Dignity of work.
    - We depend on them.
    solution: Every helper's work matters to us all.
