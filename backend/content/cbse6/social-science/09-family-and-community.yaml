# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 9. Format: content/README.md.
subject: cbse6-ss
chapter: 9
title: Family and Community
tips:
  c6ss_joint: "A joint family includes grandparents, uncles, aunts and cousins. A family of just parents and their children has another name."
  s6_common_resource: "A pond used by the whole village belongs to all."
  s6_community: "A family is one household. What do we call many families living in the same area and helping each other?"
  s6_family_gives: "A family gives more than money."
  s6_fishermen: "Who had boats and knew the waters?"
  s6_grandparents: "Grandparents have lived a long time. What can they share?"
  s6_helper: "A community helper is a real person who serves others."
  s6_joint_family: "A nuclear family is parents and children only."
  s6_respect_helpers: "Why do we need sanitation workers, nurses and firefighters?"
  s6_seva: "Seva is done without asking for anything back."
  s6_share_work: "Fair households share the work."
  s6_sharing: "Which value is good to learn?"
  c6ss9_type: 'Count who lives together: just parents and children, or grandparents, uncles, aunts and cousins too?'
  c6ss9_give: Think about what a child needs to grow up well, beyond food alone.
  c6ss9_fair: Ask whether the work is shared so that no one person carries it all.
  c6ss9_group: A community is people linked by a place or a shared interest who help each other.
  c6ss9_common: A shared resource belongs to everyone, so everyone must look after it.
  c6ss9_respect: Every job that keeps the community running deserves respect and fair treatment.
concepts:
- code: cbse6ss.fam.family
  title: Families and their roles
  notes: |
    A family is the first group a child belongs to. Types: joint (extended: grandparents, uncles, aunts, cousins together)
    and nuclear (parents and children). Families give love, care, food, safety, values and traditions. Members share
    work and responsibilities; grandparents pass on stories and wisdom. Values learned: sharing, respect, cooperation,
    caring for elders and children. Roles should be shared fairly, including household work.
  explanations:
    text: A family is the first group we belong to. In a joint family, grandparents, uncles, aunts and cousins live together. In a nuclear family, parents live with their children. Families give us love, care and values, and every member can share the work.
    visual: 'Draw two houses. In one: grandparents, parents, an uncle, an aunt and three cousins (joint family). In the other: two parents and two children (nuclear family).'
    step_by_step: 'Step 1: List the members who live together. Step 2: Decide the family type. Step 3: List what the family gives each member. Step 4: List how members can share the work.'
    real_world: 'In many Indian homes, grandparents tell bedtime stories, parents work and children help lay the table: everyone has a role.'
  picture:
    kind: compare
    columns:
    - title: Joint family
      points:
      - grandparents, parents
      - uncles, aunts, cousins
      - share one home
    - title: Nuclear family
      points:
      - parents
      - their children
      - smaller household
    alt: A joint family includes grandparents, parents, uncles, aunts and cousins; a nuclear family has parents and their children.
  activity:
    type: sort
    prompt: Joint or nuclear family?
    bins:
    - Joint family
    - Nuclear family
    items:
    - label: Parents and two children
      bin: Nuclear family
      clue: Just parents and children.
      why: Nuclear.
    - label: Grandparents, uncles, aunts and cousins under one roof
      bin: Joint family
      clue: Many relatives.
      why: Joint.
    - label: A mother and her son
      bin: Nuclear family
      clue: Small family.
      why: Nuclear.
    - label: Three generations living together
      bin: Joint family
      clue: Grandparents too.
      why: Joint.
  lesson:
    - teach: The family is the first group a child belongs to. In a nuclear family, parents and their children live together. In a joint (extended) family, grandparents, uncles, aunts and cousins also live together.
      picture:
        kind: compare
        columns:
        - title: Nuclear family
          points:
          - parents
          - children
        - title: Joint family
          points:
          - grandparents
          - parents, uncles, aunts
          - children, cousins
        alt: A nuclear family is parents and children; a joint family also includes grandparents, uncles, aunts and cousins.
      check:
        prompt: 'Riya lives with her parents, grandparents and her uncle''s family. Hers is a:'
        options:
        - Joint family
        - Nuclear family
        - Community
        answer: Joint family
        why: Several generations and relatives live together.
    - teach: Families give love, care, food, safety, and values like sharing, honesty and respect. Grandparents pass on stories, festivals and wisdom.
      check:
        prompt: Which of these does a family give a child?
        options:
        - Love, care and values
        - Only a house
        - Exam marks
        answer: Love, care and values
        why: A family shapes how a child feels and behaves.
    - teach: 'Family members share work and responsibilities: cooking, cleaning, shopping, caring for the young and the old. Work should be shared fairly between everyone, girls and boys, women and men.'
      check:
        prompt: Who should help with household chores?
        options:
        - All family members, by turns
        - Only the mother
        - Only girls
        answer: All family members, by turns
        why: Fair sharing means everyone helps.
  items:
  - prompt: 'A family of parents and their children only is a:'
    options:
    - nuclear family
    - joint family
    - community
    - village
    answer: nuclear family
    difficulty: 1
    hints:
    - Small family.
    - Nucleus = centre.
    solution: That is a nuclear family.
    mistakes:
      joint family: c6ss_joint
  - prompt: 'A family with grandparents, uncles, aunts and cousins together is a:'
    options:
    - joint family
    - nuclear family
    - club
    - school
    answer: joint family
    difficulty: 1
    hints:
    - Extended family.
    - Many generations.
    solution: That is a joint family.
    mistakes: {"nuclear family": "s6_joint_family"}
  - prompt: What does a family give a child?
    options:
    - love, care, safety and values
    - only money
    - only homework
    - nothing
    answer: love, care, safety and values
    difficulty: 1
    hints:
    - Think about home.
    - Many things.
    solution: Families give love, care, safety and values.
    mistakes: {"only money": "s6_family_gives"}
  - prompt: 'Grandparents often pass on:'
    options:
    - stories, traditions and wisdom
    - only rules
    - cars
    - exams
    answer: stories, traditions and wisdom
    difficulty: 1
    hints:
    - Bedtime stories.
    - Experience.
    solution: Grandparents share stories and wisdom.
    mistakes: {"only rules": "s6_grandparents"}
  - prompt: 'Household work should be:'
    options:
    - shared by all members
    - done only by mothers
    - done only by children
    - left undone
    answer: shared by all members
    difficulty: 2
    hints:
    - Fairness.
    - Everyone can help.
    solution: Sharing work is fair and teaches responsibility.
    mistakes: {"done only by mothers": "s6_share_work"}
  - prompt: Which value do we first learn in a family?
    options:
    - Sharing and caring
    - Cheating
    - Fighting
    - Wasting
    answer: Sharing and caring
    difficulty: 1
    hints:
    - Good habits.
    - Love.
    solution: Families teach sharing and caring.
    mistakes: {"Wasting": "s6_sharing"}
  - prompt: 'Arjun lives with only his mother, father and sister. His family is:'
    options:
    - Nuclear
    - Joint
    - A community
    answer: Nuclear
    difficulty: 1
    hints:
    - Only parents and children.
    - No grandparents or cousins.
    solution: 'Step 1: only parents and children live together. Step 2: that is a nuclear family.'
    mistakes:
      Joint: c6ss9_type
      A community: c6ss9_group
  - prompt: Which is an advantage of a joint family?
    options:
    - There are more people to share work and care
    - Nobody ever disagrees
    - Children never go to school
    answer: There are more people to share work and care
    difficulty: 2
    hints:
    - More adults are at home.
    - Who can look after children and elders?
    solution: 'Step 1: many adults live together. Step 2: so work and care can be shared among more people.'
    mistakes:
      Nobody ever disagrees: c6ss9_type
      Children never go to school: c6ss9_type
  - prompt: 'A family teaches children to respect elders. This is passing on:'
    options:
    - Values
    - Taxes
    - Votes
    answer: Values
    difficulty: 1
    hints:
    - It is about how to behave.
    - Ideas of right and wrong.
    solution: 'Step 1: respecting elders is a way of behaving. Step 2: ways of behaving we are taught are values.'
    mistakes:
      Taxes: c6ss9_give
      Votes: c6ss9_give
  - prompt: 'In Meena''s house, her brother washes dishes and she waters plants. This shows:'
    options:
    - Work shared fairly
    - Only girls work
    - Nobody works
    answer: Work shared fairly
    difficulty: 1
    hints:
    - Both children help.
    - Is it fair?
    solution: 'Step 1: both brother and sister do chores. Step 2: work is shared fairly.'
    mistakes:
      Only girls work: c6ss9_fair
      Nobody works: c6ss9_fair
  - prompt: Why do grandparents' stories matter?
    options:
    - They pass on traditions, history and wisdom
    - They are only for fun
    - They replace school
    answer: They pass on traditions, history and wisdom
    difficulty: 2
    hints:
    - Grandparents remember long ago.
    - Stories carry lessons.
    solution: 'Step 1: grandparents know old customs and events. Step 2: their stories keep these alive for the young.'
    mistakes:
      They are only for fun: c6ss9_give
      They replace school: c6ss9_give
  - prompt: Grandfather is ill. What is the caring thing for the family to do?
    options:
    - Take turns looking after him
    - Leave him alone
    - Make only one person do it all
    answer: Take turns looking after him
    difficulty: 2
    hints:
    - Care should be shared.
    - No one should carry it alone.
    solution: 'Step 1: caring is a family responsibility. Step 2: taking turns shares the work and gives him company.'
    mistakes:
      Leave him alone: c6ss9_fair
      Make only one person do it all: c6ss9_fair
  - prompt: 'Celebrating festivals together in a family mainly helps to:'
    options:
    - Keep traditions alive and bring members closer
    - Avoid each other
    - Earn money
    answer: Keep traditions alive and bring members closer
    difficulty: 1
    hints:
    - Festivals are shared events.
    - They follow old customs.
    solution: 'Step 1: festivals follow old customs. Step 2: celebrating together keeps them alive and bonds the family.'
    mistakes:
      Avoid each other: c6ss9_give
      Earn money: c6ss9_give
  - prompt: Which is the first group most children belong to?
    options:
    - Their family
    - Their country
    - Their school
    answer: Their family
    difficulty: 1
    hints:
    - Before school, before friends.
    - From birth.
    solution: 'Step 1: a child is born into a family. Step 2: so the family is the first group.'
    mistakes:
      Their country: c6ss9_group
      Their school: c6ss9_group
  - prompt: A family of 6 shares 12 chores equally. How many chores does each person do?
    answer: '2'
    check: 12/6
    difficulty: 2
    hints:
    - Share equally means divide.
    - 12 ÷ 6.
    solution: 'Step 1: 12 chores among 6 people. Step 2: 12 ÷ 6 = 2 each.'
    mistakes:
      '6': c6ss9_fair
      '72': c6ss9_fair
- code: cbse6ss.fam.community
  title: Communities and helping each other
  after:
  - cbse6ss.fam.family
  notes: |
    A community is a larger group of people living in the same area or sharing a common interest (village, neighbourhood,
    residents' association, farming or fishing community). Communities cooperate: festivals, building wells, helping in
    floods (Kerala floods 2018: fishermen rescued thousands with their boats), sharing resources (common grazing land,
    ponds). Community helpers: teachers, doctors, farmers, sanitation workers, postmen. 'Seva' (selfless service).
    Respect and dignity for all who serve the community.
  explanations:
    text: 'A community is a bigger group, like the people in our village, street or town. Communities help each other: they celebrate festivals together, look after shared ponds and help in emergencies. During the 2018 Kerala floods, fishermen used their boats to rescue thousands of people.'
    visual: 'Picture a village: families in houses, a shared pond, a school, a health centre, and people working together to clean the pond before the monsoon.'
    step_by_step: 'Step 1: Name the community. Step 2: List what its members share. Step 3: Find ways they help each other. Step 4: Name community helpers and thank them.'
    real_world: Neighbours bringing food when a family is unwell, or a residents' group cleaning the street together, are communities in action.
  picture:
    kind: compare
    columns:
    - title: Family
      points:
      - small group
      - lives together
      - first group
    - title: Community
      points:
      - larger group
      - same area or interest
      - shares resources
    alt: A family is a small group living together; a community is a larger group sharing an area or interest and its resources.
  activity:
    type: sort
    prompt: Who helps the community this way?
    bins:
    - Doctor
    - Teacher
    - Sanitation worker
    - Fishermen
    items:
    - label: Treats the sick
      bin: Doctor
      clue: At the clinic.
      why: Doctor.
    - label: Helps children learn
      bin: Teacher
      clue: At school.
      why: Teacher.
    - label: Keeps streets clean
      bin: Sanitation worker
      clue: Collects waste.
      why: Sanitation worker.
    - label: Rescued thousands with boats in the 2018 Kerala floods
      bin: Fishermen
      clue: Used their own boats.
      why: Fishermen.
  lesson:
    - teach: 'A community is a bigger group of people who live in the same area or share an interest: a village, a neighbourhood, a farming or fishing community. Members help each other in good times and bad.'
      check:
        prompt: Which is a community?
        options:
        - The people of a fishing village
        - One person alone
        - A single house
        answer: The people of a fishing village
        why: They share a place and a way of life.
    - teach: 'Communities cooperate: they celebrate festivals together, build wells, clean ponds and help in disasters. In the 2018 Kerala floods, fishermen used their boats to rescue thousands of people. Selfless help like this is called seva.'
      check:
        prompt: What did fishermen do in the 2018 Kerala floods?
        options:
        - Rescued people with their boats
        - Stayed away
        - Sold their boats
        answer: Rescued people with their boats
        why: Their boats and skills saved thousands.
    - teach: Communities share common resources like grazing land, ponds and parks, and must care for them together. Community helpers like teachers, doctors, farmers, sanitation workers and postal workers keep life running, and all deserve respect.
      check:
        prompt: Why should villagers not dump garbage in the shared pond?
        options:
        - Everyone uses it, so all must keep it clean
        - Ponds like garbage
        - Only one family uses it
        answer: Everyone uses it, so all must keep it clean
        why: A common resource is cared for by all.
  items:
  - prompt: 'A group of people living in the same area and helping each other is a:'
    options:
    - community
    - family only
    - classroom only
    - company
    answer: community
    difficulty: 1
    hints:
    - Bigger than a family.
    - Village, street.
    solution: That is a community.
    mistakes: {"family only": "s6_community"}
  - prompt: During the 2018 Kerala floods, who rescued many people with their boats?
    options:
    - Fishermen
    - Pilots only
    - Shopkeepers
    - Students only
    answer: Fishermen
    difficulty: 1
    hints:
    - They know the water.
    - Boats.
    solution: Kerala's fishermen rescued thousands.
    mistakes: {"Pilots only": "s6_fishermen"}
  - prompt: Which is a community helper?
    options:
    - A sanitation worker
    - A cartoon character
    - A film villain
    - A robot toy
    answer: A sanitation worker
    difficulty: 1
    hints:
    - Keeps streets clean.
    - Serves everyone.
    solution: Sanitation workers help the whole community.
    mistakes: {"A robot toy": "s6_helper"}
  - prompt: '''Seva'' means:'
    options:
    - selfless service
    - selling goods
    - sleeping
    - saving money only
    answer: selfless service
    difficulty: 2
    hints:
    - Helping without reward.
    - Service.
    solution: Seva means selfless service.
    mistakes: {"selling goods": "s6_seva"}
  - prompt: 'A shared village pond is an example of:'
    options:
    - a common resource
    - private property
    - a factory
    - a school subject
    answer: a common resource
    difficulty: 2
    hints:
    - Used by everyone.
    - Shared.
    solution: It is shared by the community.
    mistakes: {"private property": "s6_common_resource"}
  - prompt: Why should we respect all community helpers?
    options:
    - Their work keeps everyone safe and healthy
    - They are rich
    - They are famous
    - They give gifts
    answer: Their work keeps everyone safe and healthy
    difficulty: 1
    hints:
    - Dignity of work.
    - We depend on them.
    solution: Every helper's work matters to us all.
    mistakes: {"They are rich": "s6_respect_helpers"}
  - prompt: 'A residents'' association cleaning its colony park together shows:'
    options:
    - Community cooperation
    - Family quarrel
    - Government court
    answer: Community cooperation
    difficulty: 1
    hints:
    - Many neighbours work together.
    - For a shared space.
    solution: 'Step 1: neighbours work together. Step 2: this is community cooperation.'
    mistakes:
      Family quarrel: c6ss9_group
      Government court: c6ss9_group
  - prompt: 'Village grazing land used by everyone''s cattle is a:'
    options:
    - Common resource
    - Private shop
    - Personal garden
    answer: Common resource
    difficulty: 1
    hints:
    - It belongs to everyone.
    - Not one person's property.
    solution: 'Step 1: all villagers use it. Step 2: something shared by all is a common resource.'
    mistakes:
      Private shop: c6ss9_common
      Personal garden: c6ss9_common
  - prompt: 'Volunteers serving free food at a langar is an example of:'
    options:
    - Seva (selfless service)
    - Trade
    - Taxation
    answer: Seva (selfless service)
    difficulty: 2
    hints:
    - They expect nothing back.
    - Service to others.
    solution: 'Step 1: volunteers serve without payment. Step 2: selfless service is seva.'
    mistakes:
      Trade: c6ss9_respect
      Taxation: c6ss9_respect
  - prompt: Which community helper keeps our streets clean?
    options:
    - Sanitation worker
    - Postal worker
    - Pilot
    answer: Sanitation worker
    difficulty: 1
    hints:
    - They collect garbage.
    - They sweep roads.
    solution: 'Step 1: sweeping and garbage collection keep streets clean. Step 2: sanitation workers do this.'
    mistakes:
      Postal worker: c6ss9_respect
      Pilot: c6ss9_respect
  - prompt: If everyone takes too much water from a shared village tank, what happens?
    options:
    - It runs dry and all suffer
    - It fills up faster
    - Nothing changes
    answer: It runs dry and all suffer
    difficulty: 2
    hints:
    - The tank is limited.
    - Overuse by some hurts all.
    solution: 'Step 1: the tank holds only so much. Step 2: overuse empties it and the whole village suffers.'
    mistakes:
      It fills up faster: c6ss9_common
      Nothing changes: c6ss9_common
  - prompt: Why is a farming community important to a town?
    options:
    - It grows the food the town eats
    - It makes cars
    - It runs the courts
    answer: It grows the food the town eats
    difficulty: 1
    hints:
    - Where does food come from?
    - Farmers grow it.
    solution: 'Step 1: towns don''t grow most of their food. Step 2: farming communities supply it.'
    mistakes:
      It makes cars: c6ss9_group
      It runs the courts: c6ss9_group
  - prompt: Which shows respect for community helpers?
    options:
    - Thanking the sanitation worker and keeping waste sorted
    - Shouting at the postman
    - Throwing waste on the road
    answer: Thanking the sanitation worker and keeping waste sorted
    difficulty: 2
    hints:
    - Respect means kindness and making their work easier.
    - Which one helps them?
    solution: 'Step 1: thanking shows respect. Step 2: sorting waste makes their job easier.'
    mistakes:
      Shouting at the postman: c6ss9_respect
      Throwing waste on the road: c6ss9_respect
  - prompt: Why did many people call the Kerala fishermen 'Kerala's own army' in 2018?
    options:
    - They rescued thousands of flood victims
    - They were soldiers
    - They fought a war
    answer: They rescued thousands of flood victims
    difficulty: 3
    hints:
    - They were not soldiers.
    - What did they do during the floods?
    solution: 'Step 1: fishermen took their boats into flooded areas. Step 2: they rescued thousands, so people praised them like an army.'
    mistakes:
      They were soldiers: c6ss9_group
      They fought a war: c6ss9_group
  - prompt: 'A family and a community are alike because both:'
    options:
    - Are groups where people help and depend on each other
    - Have exactly the same size
    - Are made by the government
    answer: Are groups where people help and depend on each other
    difficulty: 3
    hints:
    - One is small, one bigger.
    - What happens inside both?
    solution: 'Step 1: families and communities differ in size. Step 2: in both, people help and depend on one another.'
    mistakes:
      Have exactly the same size: c6ss9_group
      Are made by the government: c6ss9_group
