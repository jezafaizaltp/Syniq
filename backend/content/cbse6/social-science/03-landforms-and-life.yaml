concepts:
- code: cbse6ss.land.types
  title: Mountains, plateaus and plains
  notes: |
    Landforms: mountains (high land with steep slopes and peaks; Himalayas, youngest and highest, Mount Everest 8,849 m;
    Western Ghats/Sahyadri; Aravallis among the oldest), plateaus (raised, flat-topped land; Deccan Plateau, Chota Nagpur
    Plateau rich in minerals; Tibetan Plateau highest), plains (low, flat land, often made by rivers depositing silt:
    Indo-Gangetic plains, fertile). Other forms: valleys, deserts (Thar), coasts, islands (Andaman and Nicobar,
    Lakshadweep). Rivers shape land.
  explanations:
    text: 'The land is not flat everywhere. Mountains rise high with steep slopes. Plateaus are high but flat on top, like a table. Plains are low and flat, often made by rivers, and are good for farming. India has all three: the Himalayas, the Deccan Plateau and the Ganga plains.'
    visual: 'Draw a side view: a pointed peak (mountain), a high flat table top (plateau), and a low flat stretch with a river (plain).'
    step_by_step: 'Step 1: Is the land high or low? Step 2: Is the top pointed or flat? Step 3: High and pointed: mountain. High and flat: plateau. Low and flat: plain.'
    real_world: Munnar's tea gardens sit on the slopes of the Western Ghats, while the flat Ganga plains grow wheat and rice.
  picture:
    kind: compare
    columns:
    - title: Mountain
      points:
      - high
      - steep slopes, peaks
      - Himalayas
    - title: Plateau
      points:
      - high
      - flat top
      - Deccan
    - title: Plain
      points:
      - low
      - flat
      - Ganga plains
    alt: Mountains are high with peaks like the Himalayas, plateaus are high and flat like the Deccan, and plains are low and flat like the Ganga plains.
  activity:
    type: sort
    prompt: Mountain, plateau or plain?
    bins:
    - Mountain
    - Plateau
    - Plain
    items:
    - label: Himalayas
      bin: Mountain
      clue: High peaks, steep slopes.
      why: Mountain.
    - label: Aravallis, among the oldest
      bin: Mountain
      clue: Old, worn-down ranges.
      why: Mountain.
    - label: Deccan
      bin: Plateau
      clue: Raised, flat-topped.
      why: Plateau.
    - label: Chota Nagpur, rich in minerals
      bin: Plateau
      clue: Flat-topped high land.
      why: Plateau.
    - label: Indo-Gangetic
      bin: Plain
      clue: Low, flat, river silt.
      why: Plain.
    - label: Land around the Ganga delta
      bin: Plain
      clue: Flat, made by rivers.
      why: Plain.
  items:
  - prompt: 'High land with a flat top is a:'
    options:
    - Plateau
    - Plain
    - Valley
    - Peak
    answer: Plateau
    difficulty: 1
    hints:
    - Like a table.
    - Deccan.
    solution: A flat-topped highland is a plateau.
    mistakes:
      Plain: c6ss_plateau
  - prompt: 'The highest mountain in the world, Mount Everest, is in the:'
    options:
    - Himalayas
    - Western Ghats
    - Aravallis
    - Vindhyas
    answer: Himalayas
    difficulty: 1
    hints:
    - North of India.
    - Highest range.
    solution: Mount Everest is in the Himalayas.
    mistakes: {"Western Ghats": "s6_everest"}
  - prompt: 'Plains are good for farming because:'
    options:
    - they are flat with fertile soil from rivers
    - they are very high
    - they are rocky
    - they are cold
    answer: they are flat with fertile soil from rivers
    difficulty: 1
    hints:
    - Rivers bring silt.
    - Easy to plough.
    solution: Flat land and fertile silt make plains good for farming.
    mistakes: {"they are very high": "s6_plains_farm"}
  - prompt: 'The Western Ghats are also called the:'
    options:
    - Sahyadri
    - Aravallis
    - Himadri
    - Satpura
    answer: Sahyadri
    difficulty: 2
    hints:
    - Along India's west coast.
    - Kerala, Karnataka, Maharashtra.
    solution: The Western Ghats are the Sahyadri.
    mistakes: {"Himadri": "s6_sahyadri", "Aravallis": "s6_sahyadri"}
  - prompt: Mount Everest is about 8,849 m high. Anamudi, the highest peak in south India, is about 2,695 m. How much higher is Everest (in m)?
    answer: '6154'
    check: 8849 - 2695
    difficulty: 2
    hints:
    - Subtract.
    - 8849 − 2695.
    solution: 8,849 − 2,695 = 6,154 m.
    mistakes: {"11544": "s6_height_diff", "6254": "s6_height_diff"}
  - prompt: Which plateau is known for minerals like coal and iron?
    options:
    - Chota Nagpur Plateau
    - Tibetan Plateau
    - Malwa Plateau
    - Ladakh Plateau
    answer: Chota Nagpur Plateau
    difficulty: 2
    hints:
    - Jharkhand.
    - Mines.
    solution: The Chota Nagpur Plateau is rich in minerals.
    mistakes: {"Tibetan Plateau": "s6_chota_nagpur"}
- code: cbse6ss.land.life
  title: How landforms shape people's lives
  after:
  - cbse6ss.land.types
  notes: |
    People adapt to landforms. Mountains: cold, thin soil, terrace farming on slopes, houses of stone and wood with
    sloping roofs, herding (yak, sheep), tourism; difficult transport. Plateaus: mining, some farming, waterfalls for
    hydroelectricity. Plains: dense population, farming, big cities, easy transport. Coasts: fishing, ports, coconut;
    deserts: camels, little water, mud houses. Respect for mountains and rivers in Indian traditions.
  explanations:
    text: Where people live changes how they live. In mountains, farmers cut steps (terraces) into slopes and keep yaks or sheep. On plains, flat land makes farming and travel easy, so many people live there. On coasts, people fish and trade by sea.
    visual: Picture terrace fields climbing a hill like stairs, a mountain house with a steep roof, and below, a flat plain with big fields and a town.
    step_by_step: 'Step 1: Name the landform. Step 2: Think of its weather, soil and slope. Step 3: Work out what work and homes suit it. Step 4: Note what is difficult there.'
    real_world: In Ladakh people grow barley on terraces; in Kerala's coastal villages people fish and grow coconut.
  picture:
    kind: compare
    columns:
    - title: Landform
      points:
      - Mountains
      - Plains
      - Coasts
    - title: Way of life
      points:
      - terrace farming, herding
      - farming, cities
      - fishing, ports
    alt: In the mountains people farm on terraces and herd animals, on the plains they farm and build cities, and on the coast they fish and run ports.
  activity:
    type: sort
    prompt: Where do people live like this?
    bins:
    - Mountains
    - Plains
    - Desert
    - Coast
    items:
    - label: Terrace farming and stone houses with sloping roofs
      bin: Mountains
      clue: Steep slopes, snow.
      why: Mountains.
    - label: Herding yaks
      bin: Mountains
      clue: Cold, high places.
      why: Mountains.
    - label: Big cities, dense population, easy transport
      bin: Plains
      clue: Flat, fertile land.
      why: Plains.
    - label: Camels and mud houses
      bin: Desert
      clue: Little water.
      why: Desert.
    - label: Fishing boats and ports
      bin: Coast
      clue: Near the sea.
      why: Coast.
    - label: Coconut groves by the sea
      bin: Coast
      clue: Sandy shores.
      why: Coast.
  items:
  - prompt: 'Farmers on hill slopes grow crops in steps called:'
    options:
    - Terraces
    - Plains
    - Deltas
    - Dunes
    answer: Terraces
    difficulty: 1
    hints:
    - Like stairs.
    - Stops soil washing away.
    solution: Step-like fields are terraces.
    mistakes: {"Deltas": "s6_terraces"}
  - prompt: Why do many people live on plains?
    options:
    - Flat land makes farming and travel easy
    - They are very cold
    - There is no water
    - They are high up
    answer: Flat land makes farming and travel easy
    difficulty: 1
    hints:
    - Fertile and flat.
    - Easy roads.
    solution: Plains are easy to farm and travel.
    mistakes: {"They are high up": "s6_plains_people"}
  - prompt: 'Houses in snowy mountains often have:'
    options:
    - sloping roofs
    - flat roofs only
    - no roofs
    - glass roofs
    answer: sloping roofs
    difficulty: 2
    hints:
    - Snow must slide off.
    - Steep.
    solution: Sloping roofs let snow slide off.
    mistakes: {"flat roofs only": "s6_sloping_roof"}
  - prompt: 'Main work of people living on the coast is often:'
    options:
    - fishing
    - yak herding
    - mining coal
    - growing apples
    answer: fishing
    difficulty: 1
    hints:
    - Near the sea.
    - Boats.
    solution: Coastal people often fish.
    mistakes: {"yak herding": "s6_coast_fishing"}
  - prompt: Which animal helps people in cold high mountains like Ladakh?
    options:
    - Yak
    - Camel
    - Elephant
    - Crocodile
    answer: Yak
    difficulty: 1
    hints:
    - Thick hair.
    - Cold heights.
    solution: Yaks suit cold mountains.
    mistakes: {"Camel": "s6_yak"}
  - prompt: 'Plateaus often have waterfalls used for:'
    options:
    - hydroelectricity
    - growing rice in water
    - salt making
    - fishing boats
    answer: hydroelectricity
    difficulty: 2
    hints:
    - Falling water turns turbines.
    - Electricity.
    solution: Waterfalls can produce hydroelectricity.
    mistakes: {"growing rice in water": "s6_hydro"}
