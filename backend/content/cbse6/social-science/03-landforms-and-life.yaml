# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 3. Format: content/README.md.
subject: cbse6-ss
chapter: 3
title: Landforms and Life
tips:
  c6ss_plateau: "A plain is low and flat, and a mountain rises to a peak. Which landform is high up but flat on top, like a table?"
  s6_chota_nagpur: "The Tibetan Plateau is in China. Which plateau in Jharkhand is rich in minerals?"
  s6_coast_fishing: "People on the coast use what is next to them: the sea."
  s6_everest: "The Western Ghats and Aravallis are much lower. Everest is in the great northern range."
  s6_height_diff: "Subtract: 8,849 − 2,695."
  s6_hydro: "Falling water can turn turbines."
  s6_plains_farm: "Plains are low and flat. What do rivers leave on them?"
  s6_plains_people: "Flat land makes farming, roads and towns easy."
  s6_sahyadri: "Himadri is a Himalayan range. The Western Ghats have a Sanskrit name meaning 'benevolent mountains'."
  s6_sloping_roof: "Snow is heavy. What roof shape lets it slide off?"
  s6_terraces: "Deltas form at river mouths. What are the flat steps that farmers cut into a hillside called?"
  s6_yak: "Camels suit hot deserts. Which shaggy animal suits cold mountains?"
  c6ss3_shape: 'Describe the shape: high with peaks, high but flat on top, or low and flat.'
  c6ss3_where: 'Picture India on a map and recall where this landform lies. Its name may hold a clue.'
  c6ss3_life: 'Ask what the land and weather make easy or hard there: farming, travel, building, keeping warm.'
  c6ss3_diff: To compare two heights, take the smaller from the larger.
  c6ss3_water: Think about what falling or flowing water can be used for, and what rivers leave behind.
concepts:
- code: cbse6ss.land.types
  title: Mountains, plateaus and plains
  notes: |
    Landforms: mountains (high land with steep slopes and peaks; Himalayas, youngest and highest, Mount Everest 8,849 m;
    Western Ghats/Sahyadri; Aravallis among the oldest), plateaus (raised, flat-topped land; Deccan Plateau, Chota Nagpur
    Plateau rich in minerals; Tibetan Plateau highest), plains (low, flat land, often made by rivers depositing silt:
    Indo-Gangetic plains, fertile). Other forms: valleys, deserts (Thar), coasts, islands (Andaman and Nicobar,
    Lakshadweep). Rivers shape land.
  explanations:
    text: 'The land is not flat everywhere. Mountains rise high with steep slopes. Plateaus are high but flat on top, like a table. Plains are low and flat, often made by rivers, and are good for farming. India has all three: the Himalayas, the Deccan Plateau and the Ganga plains.'
    visual: 'Draw a side view: a pointed peak (mountain), a high flat table top (plateau), and a low flat stretch with a river (plain).'
    step_by_step: 'Step 1: Is the land high or low? Step 2: Is the top pointed or flat? Step 3: High and pointed: mountain. High and flat: plateau. Low and flat: plain.'
    real_world: Munnar's tea gardens sit on the slopes of the Western Ghats, while the flat Ganga plains grow wheat and rice.
  picture:
    kind: compare
    columns:
    - title: Mountain
      points:
      - high
      - steep slopes, peaks
      - Himalayas
    - title: Plateau
      points:
      - high
      - flat top
      - Deccan
    - title: Plain
      points:
      - low
      - flat
      - Ganga plains
    alt: Mountains are high with peaks like the Himalayas, plateaus are high and flat like the Deccan, and plains are low and flat like the Ganga plains.
  activity:
    type: sort
    prompt: Mountain, plateau or plain?
    bins:
    - Mountain
    - Plateau
    - Plain
    items:
    - label: Himalayas
      bin: Mountain
      clue: High peaks, steep slopes.
      why: Mountain.
    - label: Aravallis, among the oldest
      bin: Mountain
      clue: Old, worn-down ranges.
      why: Mountain.
    - label: Deccan
      bin: Plateau
      clue: Raised, flat-topped.
      why: Plateau.
    - label: Chota Nagpur, rich in minerals
      bin: Plateau
      clue: Flat-topped high land.
      why: Plateau.
    - label: Indo-Gangetic
      bin: Plain
      clue: Low, flat, river silt.
      why: Plain.
    - label: Land around the Ganga delta
      bin: Plain
      clue: Flat, made by rivers.
      why: Plain.
  lesson:
    - teach: Landforms are natural shapes of the land. Mountains are high with steep slopes and peaks. The Himalayas are the highest and youngest mountains; Mount Everest (8,849 m) is the world's highest peak. The Aravallis are among the oldest mountains, and the Western Ghats (Sahyadri) run along India's west coast.
      picture:
        kind: compare
        columns:
        - title: Mountain
          points:
          - high, steep slopes
          - peaks
          - Himalayas
        - title: Plateau
          points:
          - raised
          - flat top
          - Deccan
        - title: Plain
          points:
          - low, flat
          - river soil
          - Ganga plains
        alt: Mountains are high with peaks, plateaus are raised and flat-topped, plains are low and flat.
      check:
        prompt: Which are among the oldest mountains in India?
        options:
        - Aravallis
        - Himalayas
        - Alps
        answer: Aravallis
        why: The Aravallis are very old and worn down; the Himalayas are young.
    - teach: A plateau is raised land with a fairly flat top, often called a tableland. The Deccan Plateau covers much of south India. The Chota Nagpur Plateau is rich in coal and iron. The Tibetan Plateau is the highest in the world.
      check:
        prompt: Why is a plateau called a tableland?
        options:
        - It is high with a flat top, like a table
        - It is made of wood
        - It is very low
        answer: It is high with a flat top, like a table
        why: Its raised flat top looks like a table.
    - teach: Plains are low, flat lands, usually made by rivers that bring fine soil (silt). The Indo-Gangetic plains are very fertile. India also has deserts (Thar), coasts, valleys, and islands such as Andaman and Nicobar and Lakshadweep.
      check:
        prompt: What makes river plains so fertile?
        options:
        - Silt brought by the rivers
        - Snow
        - Sand from the desert
        answer: Silt brought by the rivers
        why: Rivers spread rich fine soil when they flood.
  items:
  - prompt: 'High land with a flat top is a:'
    options:
    - Plateau
    - Plain
    - Valley
    - Peak
    answer: Plateau
    difficulty: 1
    hints:
    - Like a table.
    - Deccan.
    solution: A flat-topped highland is a plateau.
    mistakes:
      Plain: c6ss_plateau
  - prompt: 'The highest mountain in the world, Mount Everest, is in the:'
    options:
    - Himalayas
    - Western Ghats
    - Aravallis
    - Vindhyas
    answer: Himalayas
    difficulty: 1
    hints:
    - North of India.
    - Highest range.
    solution: Mount Everest is in the Himalayas.
    mistakes: {"Western Ghats": "s6_everest"}
  - prompt: 'Plains are good for farming because:'
    options:
    - they are flat with fertile soil from rivers
    - they are very high
    - they are rocky
    - they are cold
    answer: they are flat with fertile soil from rivers
    difficulty: 1
    hints:
    - Rivers bring silt.
    - Easy to plough.
    solution: Flat land and fertile silt make plains good for farming.
    mistakes: {"they are very high": "s6_plains_farm"}
  - prompt: 'The Western Ghats are also called the:'
    options:
    - Sahyadri
    - Aravallis
    - Himadri
    - Satpura
    answer: Sahyadri
    difficulty: 2
    hints:
    - Along India's west coast.
    - Kerala, Karnataka, Maharashtra.
    solution: The Western Ghats are the Sahyadri.
    mistakes: {"Himadri": "s6_sahyadri", "Aravallis": "s6_sahyadri"}
  - prompt: Mount Everest is about 8,849 m high. Anamudi, the highest peak in south India, is about 2,695 m. How much higher is Everest (in m)?
    answer: '6154'
    check: 8849 - 2695
    difficulty: 2
    hints:
    - Subtract.
    - 8849 − 2695.
    solution: 8,849 − 2,695 = 6,154 m.
    mistakes: {"11544": "s6_height_diff", "6254": "s6_height_diff"}
  - prompt: Which plateau is known for minerals like coal and iron?
    options:
    - Chota Nagpur Plateau
    - Tibetan Plateau
    - Malwa Plateau
    - Ladakh Plateau
    answer: Chota Nagpur Plateau
    difficulty: 2
    hints:
    - Jharkhand.
    - Mines.
    solution: The Chota Nagpur Plateau is rich in minerals.
    mistakes: {"Tibetan Plateau": "s6_chota_nagpur"}
  - prompt: Which is a plain?
    options:
    - The Indo-Gangetic plain
    - The Deccan
    - The Himalayas
    answer: The Indo-Gangetic plain
    difficulty: 1
    hints:
    - Plains are low and flat.
    - The Deccan is raised; the Himalayas are high.
    solution: 'Step 1: the Deccan is a plateau and the Himalayas are mountains. Step 2: the Indo-Gangetic plain is low flat land.'
    mistakes:
      The Deccan: c6ss3_shape
      The Himalayas: c6ss3_shape
  - prompt: Which is the highest plateau in the world?
    options:
    - Tibetan Plateau
    - Deccan Plateau
    - Chota Nagpur Plateau
    answer: Tibetan Plateau
    difficulty: 2
    hints:
    - It lies just north of the Himalayas.
    - It is called the roof of the world.
    solution: 'Step 1: the Deccan and Chota Nagpur are in India and lower. Step 2: the Tibetan Plateau is the highest.'
    mistakes:
      Deccan Plateau: c6ss3_where
      Chota Nagpur Plateau: c6ss3_where
  - prompt: Which landform is the Thar?
    options:
    - Desert
    - Plateau
    - Island
    answer: Desert
    difficulty: 1
    hints:
    - It is in Rajasthan.
    - It has sand dunes and little rain.
    solution: 'Step 1: the Thar has sand dunes and little rain. Step 2: so it is a desert.'
    mistakes:
      Plateau: c6ss3_shape
      Island: c6ss3_shape
  - prompt: The Western Ghats run along which side of India?
    options:
    - West coast
    - East coast
    - Northern border
    answer: West coast
    difficulty: 1
    hints:
    - Their name gives a clue.
    - They run near the Arabian Sea.
    solution: 'Step 1: ''Western'' tells you the side. Step 2: they run along India''s west coast.'
    mistakes:
      East coast: c6ss3_where
      Northern border: c6ss3_where
  - prompt: 'Lakshadweep is a group of:'
    options:
    - Islands
    - Mountains
    - Plateaus
    answer: Islands
    difficulty: 1
    hints:
    - It lies in the Arabian Sea.
    - Land surrounded by water.
    solution: 'Step 1: Lakshadweep is surrounded by sea. Step 2: so it is a group of islands.'
    mistakes:
      Mountains: c6ss3_shape
      Plateaus: c6ss3_shape
  - prompt: Mount Everest is 8,849 m high and Kangchenjunga about 8,586 m. How much higher is Everest (in m)?
    answer: '263'
    check: 8849-8586
    difficulty: 2
    hints:
    - Subtract the smaller height.
    - 8,849 − 8,586.
    solution: 'Step 1: 8,849 − 8,586. Step 2: = 263 m.'
    mistakes:
      '17435': c6ss3_diff
      '363': c6ss3_diff
  - prompt: 'A low area between hills or mountains, often with a river, is a:'
    options:
    - Valley
    - Plateau
    - Peak
    answer: Valley
    difficulty: 2
    hints:
    - It lies between high land.
    - Rivers often flow through it.
    solution: 'Step 1: the land is low between hills. Step 2: that is a valley.'
    mistakes:
      Plateau: c6ss3_shape
      Peak: c6ss3_shape
  - prompt: Why are the Himalayas called young mountains?
    options:
    - They formed more recently and are still rising
    - Children climb them
    - They are small
    answer: They formed more recently and are still rising
    difficulty: 3
    hints:
    - Old mountains get worn down and rounded.
    - The Himalayas are tall and sharp.
    solution: 'Step 1: the Himalayas formed later than old ranges like the Aravallis. Step 2: they are tall, sharp and still rising slowly.'
    mistakes:
      Children climb them: c6ss3_shape
      They are small: c6ss3_shape
  - prompt: The Deccan Plateau lies in which part of India?
    options:
    - South
    - Far north
    - North-east hills
    answer: South
    difficulty: 2
    hints:
    - It is between the Western and Eastern Ghats.
    - It covers much of the peninsula.
    solution: 'Step 1: the Deccan lies between the two Ghats. Step 2: that is southern (peninsular) India.'
    mistakes:
      Far north: c6ss3_where
      North-east hills: c6ss3_where
- code: cbse6ss.land.life
  title: How landforms shape people's lives
  after:
  - cbse6ss.land.types
  notes: |
    People adapt to landforms. Mountains: cold, thin soil, terrace farming on slopes, houses of stone and wood with
    sloping roofs, herding (yak, sheep), tourism; difficult transport. Plateaus: mining, some farming, waterfalls for
    hydroelectricity. Plains: dense population, farming, big cities, easy transport. Coasts: fishing, ports, coconut;
    deserts: camels, little water, mud houses. Respect for mountains and rivers in Indian traditions.
  explanations:
    text: Where people live changes how they live. In mountains, farmers cut steps (terraces) into slopes and keep yaks or sheep. On plains, flat land makes farming and travel easy, so many people live there. On coasts, people fish and trade by sea.
    visual: Picture terrace fields climbing a hill like stairs, a mountain house with a steep roof, and below, a flat plain with big fields and a town.
    step_by_step: 'Step 1: Name the landform. Step 2: Think of its weather, soil and slope. Step 3: Work out what work and homes suit it. Step 4: Note what is difficult there.'
    real_world: In Ladakh people grow barley on terraces; in Kerala's coastal villages people fish and grow coconut.
  picture:
    kind: compare
    columns:
    - title: Landform
      points:
      - Mountains
      - Plains
      - Coasts
    - title: Way of life
      points:
      - terrace farming, herding
      - farming, cities
      - fishing, ports
    alt: In the mountains people farm on terraces and herd animals, on the plains they farm and build cities, and on the coast they fish and run ports.
  activity:
    type: sort
    prompt: Where do people live like this?
    bins:
    - Mountains
    - Plains
    - Desert
    - Coast
    items:
    - label: Terrace farming and stone houses with sloping roofs
      bin: Mountains
      clue: Steep slopes, snow.
      why: Mountains.
    - label: Herding yaks
      bin: Mountains
      clue: Cold, high places.
      why: Mountains.
    - label: Big cities, dense population, easy transport
      bin: Plains
      clue: Flat, fertile land.
      why: Plains.
    - label: Camels and mud houses
      bin: Desert
      clue: Little water.
      why: Desert.
    - label: Fishing boats and ports
      bin: Coast
      clue: Near the sea.
      why: Coast.
    - label: Coconut groves by the sea
      bin: Coast
      clue: Sandy shores.
      why: Coast.
  lesson:
    - teach: Life in the mountains is shaped by cold weather, steep slopes and thin soil. People cut steps called terraces to farm the slopes, build stone-and-wood houses with sloping roofs so snow slides off, keep yaks and sheep, and welcome tourists. Travel is hard.
      picture:
        kind: compare
        columns:
        - title: Mountains
          points:
          - terrace farming
          - sloping roofs
          - yaks, sheep
        - title: Plains
          points:
          - big farms
          - many cities
          - easy roads and railways
        alt: Mountain life uses terraces, sloping roofs and herding; plain life has big farms, cities and easy transport.
      check:
        prompt: Why do mountain houses have sloping roofs?
        options:
        - So snow and rain slide off
        - To look pretty
        - To catch more snow
        answer: So snow and rain slide off
        why: Heavy snow on a flat roof could break it.
    - teach: Plains have flat land and fertile soil, so farming, roads, railways and cities grow easily. That is why most people live on plains. Plateaus have minerals for mining, and waterfalls used to make hydroelectricity.
      check:
        prompt: Why do many big cities grow on plains?
        options:
        - Flat land makes building and transport easy
        - Plains are cold
        - Plains have no rivers
        answer: Flat land makes building and transport easy
        why: Flat land is easy to build and travel on.
    - teach: On the coasts, people fish, work at ports and grow coconuts. In the desert, water is scarce, so people keep camels and build thick mud houses that stay cool. Indian traditions show respect for mountains and rivers.
      check:
        prompt: Which work is common in coastal villages?
        options:
        - Fishing
        - Yak herding
        - Coal mining
        answer: Fishing
        why: The sea is close, so fishing is a natural livelihood.
  items:
  - prompt: 'Farmers on hill slopes grow crops in steps called:'
    options:
    - Terraces
    - Plains
    - Deltas
    - Dunes
    answer: Terraces
    difficulty: 1
    hints:
    - Like stairs.
    - Stops soil washing away.
    solution: Step-like fields are terraces.
    mistakes: {"Deltas": "s6_terraces"}
  - prompt: Why do many people live on plains?
    options:
    - Flat land makes farming and travel easy
    - They are very cold
    - There is no water
    - They are high up
    answer: Flat land makes farming and travel easy
    difficulty: 1
    hints:
    - Fertile and flat.
    - Easy roads.
    solution: Plains are easy to farm and travel.
    mistakes: {"They are high up": "s6_plains_people"}
  - prompt: 'Houses in snowy mountains often have:'
    options:
    - sloping roofs
    - flat roofs only
    - no roofs
    - glass roofs
    answer: sloping roofs
    difficulty: 2
    hints:
    - Snow must slide off.
    - Steep.
    solution: Sloping roofs let snow slide off.
    mistakes: {"flat roofs only": "s6_sloping_roof"}
  - prompt: 'Main work of people living on the coast is often:'
    options:
    - fishing
    - yak herding
    - mining coal
    - growing apples
    answer: fishing
    difficulty: 1
    hints:
    - Near the sea.
    - Boats.
    solution: Coastal people often fish.
    mistakes: {"yak herding": "s6_coast_fishing"}
  - prompt: Which animal helps people in cold high mountains like Ladakh?
    options:
    - Yak
    - Camel
    - Elephant
    - Crocodile
    answer: Yak
    difficulty: 1
    hints:
    - Thick hair.
    - Cold heights.
    solution: Yaks suit cold mountains.
    mistakes: {"Camel": "s6_yak"}
  - prompt: 'Plateaus often have waterfalls used for:'
    options:
    - hydroelectricity
    - growing rice in water
    - salt making
    - fishing boats
    answer: hydroelectricity
    difficulty: 2
    hints:
    - Falling water turns turbines.
    - Electricity.
    solution: Waterfalls can produce hydroelectricity.
    mistakes: {"growing rice in water": "s6_hydro"}
  - prompt: Why is terrace farming used on hills?
    options:
    - Steps stop soil and water from washing down the slope
    - It makes hills taller
    - It needs no soil
    answer: Steps stop soil and water from washing down the slope
    difficulty: 2
    hints:
    - Rain runs fast down a slope.
    - Flat steps hold it.
    solution: 'Step 1: on a slope, rain washes soil away. Step 2: flat terraces hold soil and water so crops grow.'
    mistakes:
      It makes hills taller: c6ss3_life
      It needs no soil: c6ss3_life
  - prompt: Why do desert houses often have thick mud walls?
    options:
    - They keep the inside cool in the hot day
    - Mud is shiny
    - To hold snow
    answer: They keep the inside cool in the hot day
    difficulty: 2
    hints:
    - Deserts are very hot by day.
    - Thick walls slow down heat.
    solution: 'Step 1: thick mud walls let heat in slowly. Step 2: so the inside stays cool in the day.'
    mistakes:
      Mud is shiny: c6ss3_life
      To hold snow: c6ss3_life
  - prompt: Which animal is most useful for carrying loads in the Thar desert?
    options:
    - Camel
    - Yak
    - Penguin
    answer: Camel
    difficulty: 1
    hints:
    - It can go long without water.
    - It walks well on sand.
    solution: 'Step 1: yaks suit cold mountains, penguins icy seas. Step 2: camels suit hot sandy deserts.'
    mistakes:
      Yak: c6ss3_life
      Penguin: c6ss3_life
  - prompt: Why is travel harder in mountains than on plains?
    options:
    - Steep slopes, landslides and snow block roads
    - Mountains have too many railways
    - Mountains are flat
    answer: Steep slopes, landslides and snow block roads
    difficulty: 1
    hints:
    - Think about building a road on a steep hill.
    - What happens in heavy rain or snow?
    solution: 'Step 1: roads must wind up steep slopes. Step 2: landslides and snow often block them.'
    mistakes:
      Mountains have too many railways: c6ss3_life
      Mountains are flat: c6ss3_shape
  - prompt: Why do plateaus often have mines?
    options:
    - Many plateaus are rich in minerals
    - Plateaus are made of water
    - Plateaus have deep sea
    answer: Many plateaus are rich in minerals
    difficulty: 2
    hints:
    - Think of Chota Nagpur.
    - Coal and iron are dug there.
    solution: 'Step 1: old rocks of plateaus hold minerals. Step 2: so people mine coal, iron and others there.'
    mistakes:
      Plateaus are made of water: c6ss3_shape
      Plateaus have deep sea: c6ss3_shape
  - prompt: 'A waterfall on a plateau edge can be used to:'
    options:
    - Make electricity
    - Grow rice on top of it
    - Store snow
    answer: Make electricity
    difficulty: 2
    hints:
    - Falling water has energy.
    - It can turn turbines.
    solution: 'Step 1: falling water spins turbines. Step 2: this makes hydroelectricity.'
    mistakes:
      Grow rice on top of it: c6ss3_water
      Store snow: c6ss3_water
  - prompt: Which job is common in hill stations like Shimla and Munnar?
    options:
    - Tourism
    - Deep-sea fishing
    - Desert camel herding
    answer: Tourism
    difficulty: 1
    hints:
    - Many visitors come for cool weather.
    - Hotels and guides are needed.
    solution: 'Step 1: people visit hills for cool weather and views. Step 2: so tourism is a big job there.'
    mistakes:
      Deep-sea fishing: c6ss3_life
      Desert camel herding: c6ss3_life
  - prompt: Why do most people in India live on the plains?
    options:
    - Fertile soil, water and flat land help farming and towns
    - Plains are the coldest
    - Plains have the most snow
    answer: Fertile soil, water and flat land help farming and towns
    difficulty: 2
    hints:
    - Think about food and travel.
    - What do plains have plenty of?
    solution: 'Step 1: plains have rivers and fertile soil for crops. Step 2: flat land makes building and transport easy, so many people live there.'
    mistakes:
      Plains are the coldest: c6ss3_life
      Plains have the most snow: c6ss3_life
  - prompt: 'Coconut and fishing are main sources of living in:'
    options:
    - Coastal Kerala
    - Ladakh
    - The Thar desert
    answer: Coastal Kerala
    difficulty: 1
    hints:
    - Coconut trees grow near the sea.
    - Fishing needs the sea.
    solution: 'Step 1: Ladakh is cold and high, Thar is dry. Step 2: coastal Kerala has the sea and coconut palms.'
    mistakes:
      Ladakh: c6ss3_life
      The Thar desert: c6ss3_life
