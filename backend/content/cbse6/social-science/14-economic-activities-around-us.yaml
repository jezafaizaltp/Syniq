    - Goods going out.
    - Ex = out.
    solution: "Selling goods to other countries is export; buying from them is import."
    mistakes: {"import": "s6_export"}
  - prompt: Why do sectors depend on each other?
    options:
    - "Each needs goods or services from the others"
    - "They do not depend on each other at all"
    - "Because the law says that they must"
    - "Only because of the weather, nothing else"
    answer: Each needs goods or services from the others
    difficulty: 1
    hints:
    - Farmers need tools; factories need raw materials.
    - Links.
    solution: Each sector needs what the others provide.
    mistakes: {"They do not depend on each other at all": "s6_interdependent"}
  - prompt: Which shows the tertiary sector helping the primary sector?
    options:
    - "A bank giving a farmer a loan"
    - "A farmer growing rice in a field"
    - "A mill making sugar from cane"
    - "A miner digging coal from a pit"
    answer: A bank giving a farmer a loan
    difficulty: 2
    hints:
    - Service helping a farmer.
    - Loan.
    solution: Banking (tertiary) helps farming (primary).
    mistakes: {"A mill making sugar from cane": "s6_bank_loan"}
  - prompt: 'A bank lending money to a factory owner is the tertiary sector helping the:'
    options:
    - Secondary sector
    - Primary sector
    - Tertiary sector itself only
    answer: Secondary sector
    difficulty: 2
    hints:
    - Banks are tertiary.
    - A factory belongs to which sector?
    solution: 'Step 1: the bank is tertiary. Step 2: the factory is secondary, so the bank helps the secondary sector.'
    mistakes:
      Primary sector: c6ss14_link
      Tertiary sector itself only: c6ss14_link
  - prompt: A truck strike stops all transport for a week. Who is affected?
    options:
    - "Farmers, factories and shops"
    - "The truck drivers themselves"
    - "Nobody at all, as goods wait"
    answer: Farmers, factories and shops
    difficulty: 2
    hints:
    - Trucks carry goods for everyone.
    - Think of all three sectors.
    solution: 'Step 1: farm produce, raw materials and goods all move by truck. Step 2: so all sectors suffer.'
    mistakes:
      "The truck drivers themselves": c6ss14_link
      "Nobody at all, as goods wait": c6ss14_link
  - prompt: 'Kerala''s spices sold to Europe are an example of:'
    options:
    - Export
    - Import
    - A local haat
    answer: Export
    difficulty: 1
    hints:
    - They leave India.
    - Selling abroad.
    solution: 'Step 1: spices go from India to Europe. Step 2: selling abroad is export.'
    mistakes:
      Import: c6ss14_market
      A local haat: c6ss14_market
  - prompt: 'Villagers sell vegetables and buy pots at a market held every Thursday. This is a:'
    options:
    - Weekly haat
    - Global market
    - Stock exchange
    answer: Weekly haat
    difficulty: 1
    hints:
    - It is held once a week.
    - In or near a village.
    solution: 'Step 1: the market meets weekly in a village. Step 2: that is a haat.'
    mistakes:
      Global market: c6ss14_market
      Stock exchange: c6ss14_market
  - prompt: A sugar mill closes. Which group is hit first?
    options:
    - Sugarcane farmers who sell to it
    - Software engineers in another city
    - Fishermen at sea
    answer: Sugarcane farmers who sell to it
    difficulty: 2
    hints:
    - Who supplies the mill?
    - They lose their buyer.
    solution: 'Step 1: the mill buys sugarcane. Step 2: when it closes, cane farmers lose their buyer first.'
    mistakes:
      Software engineers in another city: c6ss14_link
      Fishermen at sea: c6ss14_link
  - prompt: Which shows the secondary sector helping the primary sector?
    options:
    - "A factory making tractors for farmers"
    - "A farmer selling rice at the market"
    - "A teacher teaching children in a school"
    answer: A factory making tractors for farmers
    difficulty: 2
    hints:
    - The helper is a factory.
    - The one helped grows crops.
    solution: 'Step 1: a tractor factory is secondary. Step 2: tractors help farmers (primary).'
    mistakes:
      "A farmer selling rice at the market": c6ss14_link
      "A teacher teaching children in a school": c6ss14_link
  - prompt: 'India selling software services to companies in the USA is:'
    options:
    - An export of services
    - An import of goods
    - A primary activity
    answer: An export of services
    difficulty: 3
    hints:
    - The service goes from India to the USA.
    - Software is a service, not a farm product.
    solution: 'Step 1: India sells to another country: export. Step 2: software is a service, so it is an export of services.'
    mistakes:
      An import of goods: c6ss14_market
      A primary activity: c6ss14_sector
  - prompt: Why do villages and cities need each other?
    options:
    - "Villages supply food and raw materials; cities supply goods and services"
    - "They do not need each other, as each has what it needs"
    - "Cities grow all the food, and villages only buy it from them"
    answer: Villages supply food and raw materials; cities supply goods and services
    difficulty: 2
    hints:
    - Where is food grown?
    - Where are many factories and hospitals?
    solution: 'Step 1: villages grow food and raw materials. Step 2: cities make goods and offer services; each needs the other.'
    mistakes:
      "They do not need each other, as each has what it needs": c6ss14_link
      "Cities grow all the food, and villages only buy it from them": c6ss14_link
  - prompt: A good monsoon gives a big cotton harvest. What will most likely happen next?
    options:
    - "Textile mills get more cotton and make more cloth"
    - "Textile mills close down because of the rain"
    - "The cotton disappears before it can be picked"
    answer: Textile mills get more cotton and make more cloth
    difficulty: 1
    hints:
    - More raw material.
    - Mills can work more.
    solution: 'Step 1: more cotton reaches the mills. Step 2: they can make more cloth.'
    mistakes:
      "Textile mills close down because of the rain": c6ss14_link
      "The cotton disappears before it can be picked": c6ss14_link
  - prompt: 'Assertion (A): A long power cut at a factory can reduce the earnings of lorry drivers.

      Reason (R): The sectors depend on each other, so a change in one spreads to the others.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. A factory that makes fewer goods has fewer loads to send, so drivers earn less; R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): When India buys crude oil from another country, it is an export.

      Reason (R): Selling goods to other countries is called export.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: buying from another country is an import. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Heavy rain washes away the only road to a hill village for a month. The apple growers cannot send their fruit to the city, a juice factory in the city runs short of apples, and fruit shops have little to sell. What does this show?'
    options:
    - A problem in one sector spreads to the others
    - Each sector works on its own
    - Only the growers are affected by a broken road
    answer: A problem in one sector spreads to the others
    hints:
    - Count how many kinds of workers were affected.
    - Which sectors do growers, a factory and shops belong to?
    solution: The growers (primary), the juice factory (secondary) and the shops (tertiary) were all hit by one broken road. The sectors depend on each other, so trouble in one spreads.
    mistakes:
      Each sector works on its own: c6ss14_link
      Only the growers are affected by a broken road: c6ss14_link
    exam: case
    difficulty: 2
  - prompt: 'Situation: A village self-help group makes pickles. It sells first at the village''s weekly market, then to shops across the state, and at last to buyers in another country. What is the last kind of sale called?'
    options:
    - Export
    - Import
    - A haat sale
    answer: Export
    hints:
    - Where are the last buyers?
    - Is the group selling to another country or buying from it?
    solution: Selling goods to buyers in other countries is export. Import is buying from other countries, and a haat is the weekly village market where the group began.
    mistakes:
      Import: c6ss14_market
      A haat sale: c6ss14_market
    exam: competency
    difficulty: 2
