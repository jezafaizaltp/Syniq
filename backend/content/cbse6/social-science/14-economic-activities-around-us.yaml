    - Transport.
    - Service.
    solution: 'Transport is a service: tertiary.'
    mistakes: {"secondary activity": "s6_tertiary"}
  - prompt: Which is a primary activity?
    options:
    - Mining coal
    - Making cars
    - Banking
    - Teaching
    answer: Mining coal
    difficulty: 1
    hints:
    - From the earth.
    - Nature.
    solution: "Mining takes coal straight from the earth: primary. Making cars is secondary; banking and teaching are tertiary."
    mistakes: {"Making cars": "s6_primary"}
  - prompt: A bank is part of which sector?
    options:
    - Tertiary
