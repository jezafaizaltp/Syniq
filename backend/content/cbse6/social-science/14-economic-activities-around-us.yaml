    - Like coal mining.
    solution: 'Step 1: bauxite is dug directly from the earth. Step 2: so mining it is primary.'
    mistakes:
      Secondary: c6ss14_sector
      Tertiary: c6ss14_sector
  - prompt: 'Assertion (A): A rubber tyre has passed through more than one sector before it reaches a buyer.

      Reason (R): Raw rubber is tapped from trees, made into tyres in a factory, and then transported and sold.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Tapping is primary, tyre-making is secondary, and transport and sale are tertiary; R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): A teacher works in the secondary sector.

      Reason (R): The tertiary sector provides services such as teaching, transport and banking.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: teaching is a service, so a teacher works in the tertiary sector. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Anu''s family grows sugarcane. A mill nearby crushes the cane and makes sugar. A trader''s lorry then carries the sugar bags to shops in the city. In that order, which sectors do the three activities belong to?'
    options:
    - Primary, secondary, tertiary
    - Secondary, primary, tertiary
    - Tertiary, secondary, primary
    answer: Primary, secondary, tertiary
    hints:
    - Which activity takes something straight from nature?
    - Which one makes a new product, and which one is a service?
    solution: 'Growing sugarcane uses the land directly: primary. Making sugar from cane turns a raw material into a product: secondary. Carrying and selling the bags is a service: tertiary.'
    mistakes:
      Secondary, primary, tertiary: c6ss14_chain
      Tertiary, secondary, primary: c6ss14_chain
