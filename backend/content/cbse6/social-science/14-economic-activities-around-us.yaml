# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 14. Format: content/README.md.
subject: cbse6-ss
chapter: 14
title: Economic Activities Around Us
tips:
  c6ss_sectors: Primary = taking from nature (farming, fishing, mining). Secondary = making things (factories). Tertiary = services (transport, banking, teaching).
  s6_bank: "Banks provide services."
  s6_bank_loan: "Which choice shows a service helping a farmer?"
  s6_coconut_oil: "Making oil changes the coconut into a new product."
  s6_cotton_mills: "Less cotton means less raw material."
  s6_export: "'Ex' means out."
  s6_haat: "A mall is a big building in a city. What is the open village market that meets once a week called?"
  s6_interdependent: "Farms need factories' machines, and factories need farms' crops."
  s6_primary: "Mining takes something directly from nature."
  s6_secondary: "Making furniture turns wood into a new product."
  s6_tertiary: "A bus driver gives a service."
  s6_tractor: "A tractor is made in a factory."
  c6ss14_sector: 'Ask: is it taking something straight from nature, making something new from raw material, or giving a service?'
  c6ss14_chain: Follow the product from nature to factory to the buyer; each step belongs to a different sector.
  c6ss14_link: Ask what each sector needs from the others to keep going.
  c6ss14_market: 'Sort markets by how far the goods travel: the village, the region, the country, or abroad.'
concepts:
- code: cbse6ss.econ.sectors
  title: Primary, secondary and tertiary activities
  notes: |
    Economic activities fall into three sectors. Primary: using natural resources directly: farming, fishing, forestry,
    mining, animal rearing. Secondary: turning raw materials into finished goods: factories, handicrafts (cotton into
    cloth, sugarcane into sugar, wood into furniture). Tertiary (services): support others: transport, trade, banking,
    teaching, health care, IT. Example chain: cotton farmer (primary) → textile mill (secondary) → truck and shop
    (tertiary).
  explanations:
    text: Economic activities are grouped into three types. Primary activities take things directly from nature, like farming and fishing. Secondary activities make goods from raw materials, like turning cotton into cloth. Tertiary activities are services, like transport, banking and teaching.
    visual: 'Draw a chain: a cotton field (primary) → a spinning mill making cloth (secondary) → a truck carrying shirts to a shop where a salesperson sells them (tertiary).'
    step_by_step: 'Step 1: Look at the activity. Step 2: Is it taking from nature? Primary. Step 3: Is it making a product? Secondary. Step 4: Is it a service to others? Tertiary.'
    real_world: 'Kerala''s coconut chain: farmers grow coconuts (primary), factories make coconut oil and coir (secondary), and traders and transporters sell them (tertiary).'
  picture:
    kind: flow
    steps:
    - Cotton farming (primary)
    - Spinning and weaving (secondary)
    - Transport and selling (tertiary)
    alt: 'From cotton farm to shop: farming is primary, making cloth is secondary, and transporting and selling are tertiary.'
  activity:
    type: sort
    prompt: Primary, secondary or tertiary?
    bins:
    - Primary
    - Secondary
    - Tertiary
    items:
    - label: Growing cotton
      bin: Primary
      clue: From the land.
      why: Primary.
    - label: Fishing
      bin: Primary
      clue: Nature.
      why: Primary.
    - label: Weaving cotton into cloth in a mill
      bin: Secondary
      clue: Turning raw material into goods.
      why: Secondary.
    - label: Making furniture from wood
      bin: Secondary
      clue: Making goods.
      why: Secondary.
    - label: A truck carrying cloth to shops
      bin: Tertiary
      clue: A service.
      why: Tertiary.
    - label: Banking
      bin: Tertiary
      clue: Service.
      why: Tertiary.
  lesson:
    - teach: 'Economic activities fall into three sectors. The primary sector uses natural resources directly: farming, fishing, forestry, mining and animal rearing.'
      check:
        prompt: Which is a primary activity?
        options:
        - Growing paddy
        - Running a bank
        - Making biscuits in a factory
        answer: Growing paddy
        why: Farming uses land and water directly from nature.
    - teach: 'The secondary sector turns raw materials into finished goods in factories or workshops: cotton into cloth, sugarcane into sugar, wood into furniture, clay into pots.'
      check:
        prompt: 'Turning sugarcane into sugar is:'
        options:
        - Secondary
        - Primary
        - Tertiary
        answer: Secondary
        why: A raw material is processed into a new product.
    - teach: 'The tertiary (service) sector supports the others and people: transport, trade, banking, teaching, health care, IT. One product passes through all three: a cotton farmer (primary), a textile mill (secondary), then trucks and shops (tertiary).'
      picture:
        kind: flow
        steps:
        - Cotton farm (primary)
        - Textile mill (secondary)
        - Truck and shop (tertiary)
        - Your shirt
        alt: A shirt starts on a cotton farm, is made in a mill, and reaches you by truck and shop.
      check:
        prompt: A teacher works in which sector?
        options:
        - Tertiary
        - Primary
        - Secondary
        answer: Tertiary
        why: Teaching is a service.
  items:
  - prompt: 'Fishing is a:'
    options:
    - primary activity
    - secondary activity
    - tertiary activity
    - non-economic activity
    answer: primary activity
    difficulty: 1
    hints:
    - Directly from nature.
    - Sea.
    solution: Fishing is primary.
    mistakes:
      secondary activity: c6ss_sectors
  - prompt: 'Making furniture from wood is a:'
    options:
    - secondary activity
    - primary activity
    - tertiary activity
    - non-economic activity
    answer: secondary activity
    difficulty: 1
    hints:
    - Raw material to product.
    - Making.
    solution: Manufacturing is secondary.
    mistakes: {"primary activity": "s6_secondary"}
  - prompt: 'A bus driver provides a:'
    options:
    - tertiary (service) activity
    - primary activity
    - secondary activity
    - non-economic activity
    answer: tertiary (service) activity
    difficulty: 1
    hints:
    - Transport.
    - Service.
    solution: 'Transport is a service: tertiary.'
    mistakes: {"secondary activity": "s6_tertiary"}
  - prompt: Which is a primary activity?
    options:
    - Mining coal
    - Making cars
    - Banking
    - Teaching
    answer: Mining coal
    difficulty: 1
    hints:
    - From the earth.
    - Nature.
    solution: Mining is primary.
    mistakes: {"Making cars": "s6_primary"}
  - prompt: A bank is part of which sector?
    options:
    - Tertiary
    - Primary
    - Secondary
    - None
    answer: Tertiary
    difficulty: 2
    hints:
    - It gives a service.
    - Money services.
    solution: Banking is a tertiary service.
    mistakes: {"Secondary": "s6_bank"}
  - prompt: 'In the chain coconut → coconut oil → shop, making coconut oil is:'
    options:
    - secondary
    - primary
    - tertiary
    - non-economic
    answer: secondary
    difficulty: 2
    hints:
    - Processing.
    - Factory.
    solution: Turning coconuts into oil is secondary.
    mistakes: {"primary": "s6_coconut_oil"}
  - prompt: 'Rearing cows for milk is a:'
    options:
    - Primary activity
    - Secondary activity
    - Tertiary activity
    answer: Primary activity
    difficulty: 1
    hints:
    - Animals are natural resources.
    - Nothing is made in a factory.
    solution: 'Step 1: milk comes directly from animals. Step 2: rearing animals is primary.'
    mistakes:
      Secondary activity: c6ss14_sector
      Tertiary activity: c6ss14_sector
  - prompt: 'Making paneer from milk in a dairy plant is a:'
    options:
    - Secondary activity
    - Primary activity
    - Tertiary activity
    answer: Secondary activity
    difficulty: 2
    hints:
    - Milk is the raw material.
    - It is turned into a new product.
    solution: 'Step 1: milk is processed into paneer. Step 2: making a new product is secondary.'
    mistakes:
      Primary activity: c6ss14_sector
      Tertiary activity: c6ss14_sector
  - prompt: A doctor in a clinic works in which sector?
    options:
    - Tertiary
    - Primary
    - Secondary
    answer: Tertiary
    difficulty: 1
    hints:
    - A doctor gives a service.
    - Nothing is grown or made.
    solution: 'Step 1: treating patients is a service. Step 2: services are tertiary.'
    mistakes:
      Primary: c6ss14_sector
      Secondary: c6ss14_sector
  - prompt: 'Cutting timber in a forest is primary. Making a table from that timber is:'
    options:
    - Secondary
    - Primary
    - Tertiary
    answer: Secondary
    difficulty: 1
    hints:
    - Timber is the raw material.
    - A table is a finished product.
    solution: 'Step 1: wood is turned into a table. Step 2: that is a secondary activity.'
    mistakes:
      Primary: c6ss14_chain
      Tertiary: c6ss14_chain
  - prompt: 'A software engineer writing apps works in the:'
    options:
    - Tertiary sector
    - Primary sector
    - Secondary sector
    answer: Tertiary sector
    difficulty: 2
    hints:
    - IT is a service.
    - No raw material is dug or grown.
    solution: 'Step 1: software is an IT service. Step 2: IT belongs to the tertiary sector.'
    mistakes:
      Primary sector: c6ss14_sector
      Secondary sector: c6ss14_sector
  - prompt: 'In the chain ''iron ore mine → steel plant → hardware shop'', the steel plant is:'
    options:
    - Secondary
    - Primary
    - Tertiary
    answer: Secondary
    difficulty: 2
    hints:
    - Mining is first, the shop is last.
    - The plant turns ore into steel.
    solution: 'Step 1: mining is primary and the shop tertiary. Step 2: the steel plant makes steel from ore: secondary.'
    mistakes:
      Primary: c6ss14_chain
      Tertiary: c6ss14_chain
  - prompt: Which list has one activity from each sector, in order primary, secondary, tertiary?
    options:
    - Fishing, canning fish, selling cans
    - Selling cans, fishing, canning fish
    - Canning fish, fishing, selling cans
    answer: Fishing, canning fish, selling cans
    difficulty: 3
    hints:
    - Start with nature.
    - End with the service.
    solution: 'Step 1: fishing takes from nature (primary). Step 2: canning makes a product (secondary); selling is a service (tertiary).'
    mistakes:
      Selling cans, fishing, canning fish: c6ss14_chain
      Canning fish, fishing, selling cans: c6ss14_chain
  - prompt: 'Weaving a Kanchipuram silk saree on a handloom is:'
    options:
    - Secondary
    - Primary
    - Tertiary
    answer: Secondary
    difficulty: 2
    hints:
    - Silk thread is a raw material.
    - The weaver makes a finished product.
    solution: 'Step 1: silk yarn is turned into a saree. Step 2: making goods, even by hand, is secondary.'
    mistakes:
      Primary: c6ss14_sector
      Tertiary: c6ss14_sector
  - prompt: Mining bauxite from the ground is in which sector?
    options:
    - Primary
    - Secondary
    - Tertiary
    answer: Primary
    difficulty: 1
    hints:
    - It takes a mineral from nature.
    - Like coal mining.
    solution: 'Step 1: bauxite is dug directly from the earth. Step 2: so mining it is primary.'
    mistakes:
      Secondary: c6ss14_sector
      Tertiary: c6ss14_sector
- code: cbse6ss.econ.links
  title: How activities depend on each other
  after:
  - cbse6ss.econ.sectors
  notes: |
    Sectors depend on each other: farmers need seeds, tools and fertilisers (secondary), transport and banks (tertiary);
    factories need raw materials (primary) and workers, electricity, shops. A change in one affects others (bad monsoon →
    less cotton → mills slow → fewer goods in shops). Markets: local (weekly haat), regional, national, global (exports
    like spices, tea, software). Interdependence links villages and cities.
  explanations:
    text: No activity works alone. A farmer needs tools from factories and trucks to carry crops. A factory needs raw materials from farms and mines, and shops to sell its goods. If the monsoon fails, less cotton grows, mills slow down and shops have fewer clothes.
    visual: 'Draw three circles labelled Primary, Secondary, Tertiary with arrows going both ways between each pair: everything is connected.'
    step_by_step: 'Step 1: Pick an activity. Step 2: List what it needs from the other sectors. Step 3: List what it gives them. Step 4: Imagine what happens if one link breaks.'
    real_world: Kerala's spices are grown by farmers, cleaned and packed in factories, and shipped from Kochi port to the world.
  picture:
    kind: flow
    steps:
    - Bad monsoon
    - Less cotton grown
    - Mills make less cloth
    - Fewer clothes in shops
    - Shopkeepers earn less
    alt: A bad monsoon means less cotton, less cloth from the mills, fewer clothes in shops and lower earnings for shopkeepers.
  activity:
    type: order
    prompt: A bad monsoon. Follow the chain of effects.
    steps:
    - Too little rain
    - Less cotton grows
    - Textile mills slow down
    - Fewer clothes reach the shops
    reasons:
      Less cotton grows: Cotton farming needs rain, so the crop falls first.
      Textile mills slow down: Mills need cotton as raw material.
      Fewer clothes reach the shops: Mills make less, so shops get less to sell.
  lesson:
    - teach: The three sectors depend on each other. A farmer (primary) needs seeds, tools and fertilisers (made in the secondary sector), and trucks and bank loans (tertiary). A factory needs raw materials from the primary sector and transport and shops to sell its goods.
      picture:
        kind: compare
        columns:
        - title: Farmer gets
          points:
          - tractor, fertiliser (secondary)
          - loan, transport (tertiary)
        - title: Factory gets
          points:
          - raw cotton (primary)
          - electricity, shops (tertiary)
        alt: Farmers need goods from factories and services like banks; factories need raw materials from farms and services like transport.
      check:
        prompt: 'A fertiliser factory needs farmers because:'
        options:
        - Farmers buy its fertiliser
        - Farmers make its machines
        - Farmers run its bank
        answer: Farmers buy its fertiliser
        why: Without buyers, the factory cannot sell.
    - teach: A change in one sector spreads to others. If the monsoon fails, less cotton grows; mills slow down; fewer clothes reach shops; truck drivers and shop workers earn less.
      picture:
        kind: flow
        steps:
        - Monsoon fails
        - Less cotton
        - Mills slow down
        - Fewer clothes in shops
        alt: A failed monsoon means less cotton, slower mills and fewer clothes in shops.
      check:
        prompt: If fishermen catch fewer fish, what happens to fish-canning factories?
        options:
        - They produce less
        - They produce more
        - Nothing changes
        answer: They produce less
        why: Their raw material falls.
    - teach: 'Goods are sold in markets of different sizes: a weekly village haat, regional and national markets, and global markets. Selling to other countries is export (India exports spices, tea and software); buying from them is import.'
      check:
        prompt: 'India buying crude oil from other countries is:'
        options:
        - Import
        - Export
        - A haat
        answer: Import
        why: Buying from abroad is import.
  items:
  - prompt: 'A farmer needs a tractor. The tractor comes from the:'
    options:
    - secondary sector
    - primary sector
    - tertiary sector
    - non-economic sector
    answer: secondary sector
    difficulty: 1
    hints:
    - Made in a factory.
    - Manufacturing.
    solution: 'Tractors are manufactured: secondary.'
    mistakes: {"primary sector": "s6_tractor"}
  - prompt: 'If the monsoon fails and less cotton grows, textile mills will:'
    options:
    - produce less cloth
    - produce more cloth
    - not be affected
    - start fishing
    answer: produce less cloth
    difficulty: 1
    hints:
    - Raw material is short.
    - Chain effect.
    solution: Less cotton means less cloth.
    mistakes: {"produce more cloth": "s6_cotton_mills"}
  - prompt: 'A weekly village market is often called a:'
    options:
    - haat
    - mall
    - port
    - mint
    answer: haat
    difficulty: 2
    hints:
    - Rural market.
    - Once a week.
    solution: A weekly village market is a haat.
    mistakes: {"mall": "s6_haat"}
  - prompt: 'Selling Indian tea to other countries is called:'
    options:
    - export
    - import
    - mining
    - farming
    answer: export
    difficulty: 2
    hints:
    - Goods going out.
    - Ex = out.
    solution: Selling abroad is export.
    mistakes: {"import": "s6_export"}
  - prompt: Why do sectors depend on each other?
    options:
    - Each needs goods or services from the others
    - They don't
    - Only by law
    - Because of the weather only
    answer: Each needs goods or services from the others
    difficulty: 1
    hints:
    - Farmers need tools; factories need raw materials.
    - Links.
    solution: Each sector needs what the others provide.
    mistakes: {"They don't": "s6_interdependent"}
  - prompt: Which shows the tertiary sector helping the primary sector?
    options:
    - A bank giving a farmer a loan
    - A farmer growing rice
    - A mill making sugar
    - A miner digging coal
    answer: A bank giving a farmer a loan
    difficulty: 2
    hints:
    - Service helping a farmer.
    - Loan.
    solution: Banking (tertiary) helps farming (primary).
    mistakes: {"A mill making sugar": "s6_bank_loan"}
  - prompt: 'A bank lending money to a factory owner is the tertiary sector helping the:'
    options:
    - Secondary sector
    - Primary sector
    - Tertiary sector itself only
    answer: Secondary sector
    difficulty: 2
    hints:
    - Banks are tertiary.
    - A factory belongs to which sector?
    solution: 'Step 1: the bank is tertiary. Step 2: the factory is secondary, so the bank helps the secondary sector.'
    mistakes:
      Primary sector: c6ss14_link
      Tertiary sector itself only: c6ss14_link
  - prompt: A truck strike stops all transport for a week. Who is affected?
    options:
    - Farmers, factories and shops
    - Only truck drivers
    - Nobody
    answer: Farmers, factories and shops
    difficulty: 2
    hints:
    - Trucks carry goods for everyone.
    - Think of all three sectors.
    solution: 'Step 1: farm produce, raw materials and goods all move by truck. Step 2: so all sectors suffer.'
    mistakes:
      Only truck drivers: c6ss14_link
      Nobody: c6ss14_link
  - prompt: 'Kerala''s spices sold to Europe are an example of:'
    options:
    - Export
    - Import
    - A local haat
    answer: Export
    difficulty: 1
    hints:
    - They leave India.
    - Selling abroad.
    solution: 'Step 1: spices go from India to Europe. Step 2: selling abroad is export.'
    mistakes:
      Import: c6ss14_market
      A local haat: c6ss14_market
  - prompt: 'Villagers sell vegetables and buy pots at a market held every Thursday. This is a:'
    options:
    - Weekly haat
    - Global market
    - Stock exchange
    answer: Weekly haat
    difficulty: 1
    hints:
    - It is held once a week.
    - In or near a village.
    solution: 'Step 1: the market meets weekly in a village. Step 2: that is a haat.'
    mistakes:
      Global market: c6ss14_market
      Stock exchange: c6ss14_market
  - prompt: A sugar mill closes. Which group is hit first?
    options:
    - Sugarcane farmers who sell to it
    - Software engineers in another city
    - Fishermen at sea
    answer: Sugarcane farmers who sell to it
    difficulty: 2
    hints:
    - Who supplies the mill?
    - They lose their buyer.
    solution: 'Step 1: the mill buys sugarcane. Step 2: when it closes, cane farmers lose their buyer first.'
    mistakes:
      Software engineers in another city: c6ss14_link
      Fishermen at sea: c6ss14_link
  - prompt: Which shows the secondary sector helping the primary sector?
    options:
    - A factory making tractors for farmers
    - A farmer selling rice
    - A teacher teaching
    answer: A factory making tractors for farmers
    difficulty: 2
    hints:
    - The helper is a factory.
    - The one helped grows crops.
    solution: 'Step 1: a tractor factory is secondary. Step 2: tractors help farmers (primary).'
    mistakes:
      A farmer selling rice: c6ss14_link
      A teacher teaching: c6ss14_link
  - prompt: 'India selling software services to companies in the USA is:'
    options:
    - An export of services
    - An import of goods
    - A primary activity
    answer: An export of services
    difficulty: 3
    hints:
    - The service goes from India to the USA.
    - Software is a service, not a farm product.
    solution: 'Step 1: India sells to another country: export. Step 2: software is a service, so it is an export of services.'
    mistakes:
      An import of goods: c6ss14_market
      A primary activity: c6ss14_sector
  - prompt: Why do villages and cities need each other?
    options:
    - Villages supply food and raw materials; cities supply goods and services
    - They don't need each other
    - Cities grow all the food
    answer: Villages supply food and raw materials; cities supply goods and services
    difficulty: 2
    hints:
    - Where is food grown?
    - Where are many factories and hospitals?
    solution: 'Step 1: villages grow food and raw materials. Step 2: cities make goods and offer services; each needs the other.'
    mistakes:
      They don't need each other: c6ss14_link
      Cities grow all the food: c6ss14_link
  - prompt: A good monsoon gives a big cotton harvest. What will most likely happen next?
    options:
    - Textile mills get more cotton and make more cloth
    - Mills close down
    - Cotton disappears
    answer: Textile mills get more cotton and make more cloth
    difficulty: 1
    hints:
    - More raw material.
    - Mills can work more.
    solution: 'Step 1: more cotton reaches the mills. Step 2: they can make more cloth.'
    mistakes:
      Mills close down: c6ss14_link
      Cotton disappears: c6ss14_link
