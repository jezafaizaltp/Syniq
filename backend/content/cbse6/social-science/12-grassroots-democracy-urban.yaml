# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 12. Format: content/README.md.
subject: cbse6-ss
chapter: 12
title: 'Grassroots Democracy Part 3: Local Government in Urban Areas'
tips:
  c6ss_urban: "A Gram Panchayat is for villages. A big city like Kochi has a larger body led by a Mayor."
  s6_74th: "The panchayat amendment of 1992 was for villages. The amendment for towns and cities has the next number."
  s6_birth_reg: "Birth registration is a local record."
  s6_commissioner: "The mayor is elected. Who is the officer running daily work?"
  s6_councillor: "Each ward elects a local representative to the city council."
  s6_garbage: "Garbage is a local city service."
  s6_mayor: "A sarpanch heads a village. Who heads a city corporation?"
  s6_not_municipal: "Defence is a job for the central government."
  s6_property_tax: "City bodies tax buildings and land."
  s6_segregate: "Which choice helps waste get recycled?"
  s6_streetlight: "Street lights are a local service."
  s6_wards: "A city is divided into small areas for elections."
  c6ss12_body: 'Match the size of the place to its body: big city, smaller town, or a village turning into a town.'
  c6ss12_people: Separate who is elected (to represent people) from who is appointed (to run the offices).
  c6ss12_work: Think about the daily services a town needs close to home, not national jobs.
  c6ss12_money: Think about what a city charges its own residents, and what governments send it.
  c6ss12_duty: Ask what each citizen can do to make the city's work easier.
concepts:
- code: cbse6ss.urban.bodies
  title: Municipal bodies
  notes: |
    Urban local government: given constitutional status by the 74th Amendment (1992). Municipal Corporation for large
    cities (Kochi, Thiruvananthapuram, Mumbai), headed by an elected Mayor; Municipal Council/Municipality for smaller
    towns, headed by a Chairperson; Nagar Panchayat for areas changing from rural to urban. The city is divided into
    wards; each elects a councillor for 5 years. A Municipal Commissioner (an IAS officer) heads the administration.
  explanations:
    text: Towns and cities have their own local government. Big cities like Kochi have a Municipal Corporation led by a Mayor. Smaller towns have a Municipal Council led by a Chairperson. The city is split into wards, and each ward elects a councillor.
    visual: 'Draw a city map divided into numbered blocks (wards). Put a small figure in each block: the ward councillor. In the centre, a building labelled ''Corporation'', with the Mayor.'
    step_by_step: 'Step 1: Is it a big city or small town? Step 2: Name the body: Corporation or Council. Step 3: Name the head: Mayor or Chairperson. Step 4: Remember: wards elect councillors.'
    real_world: Kerala has six Municipal Corporations, including Thiruvananthapuram, Kochi and Kozhikode.
  picture:
    kind: compare
    columns:
    - title: Municipal Corporation
      points:
      - big cities
      - headed by Mayor
      - e.g. Kochi
    - title: Municipal Council
      points:
      - smaller towns
      - headed by Chairperson
      - e.g. a district town
    alt: Big cities like Kochi have a Municipal Corporation headed by a Mayor; smaller towns have a Municipal Council headed by a Chairperson.
  activity:
    type: sort
    prompt: Which urban body or person?
    bins:
    - Municipal Corporation
    - Municipality
    - Nagar Panchayat
    items:
    - label: Kochi, a big city
      bin: Municipal Corporation
      clue: Large city.
      why: Corporation.
    - label: Headed by a Mayor
      bin: Municipal Corporation
      clue: Big city head.
      why: Corporation.
    - label: A small town headed by a Chairperson
      bin: Municipality
      clue: Smaller town.
      why: Municipality.
    - label: An area changing from rural to urban
      bin: Nagar Panchayat
      clue: In between.
      why: Nagar Panchayat.
  lesson:
    - teach: Towns and cities also govern themselves locally. The 74th Amendment (1992) gave urban local bodies a place in the Constitution. Large cities have a Municipal Corporation, smaller towns a Municipal Council (Municipality), and areas changing from village to town a Nagar Panchayat.
      picture:
        kind: compare
        columns:
        - title: Municipal Corporation
          points:
          - large city
          - 'head: Mayor'
        - title: Municipal Council
          points:
          - smaller town
          - 'head: Chairperson'
        - title: Nagar Panchayat
          points:
          - village becoming a town
        alt: Large cities have a Municipal Corporation led by a Mayor, smaller towns a Municipal Council led by a Chairperson, and changing areas a Nagar Panchayat.
      check:
        prompt: 'A small town is governed by a:'
        options:
        - Municipal Council
        - Zila Parishad
        - Supreme Court
        answer: Municipal Council
        why: Smaller towns have a Municipal Council (Municipality).
    - teach: A city is divided into wards. Each ward elects a councillor for 5 years. The councillors choose or work with the Mayor, who leads the Municipal Corporation.
      check:
        prompt: Whom should you meet about a problem in your own ward?
        options:
        - Your ward councillor
        - The Prime Minister
        - A judge
        answer: Your ward councillor
        why: The councillor represents your ward.
    - teach: Day-to-day administration is run by the Municipal Commissioner, an officer appointed by the state government, with many staff. So elected leaders decide and represent, while officials carry out the work.
      check:
        prompt: Is the Municipal Commissioner elected by voters?
        options:
        - No, appointed by the government
        - Yes, by each ward
        - Yes, by the Mayor's family
        answer: No, appointed by the government
        why: The Commissioner is an appointed officer.
  items:
  - prompt: 'A large city like Kochi is governed by a:'
    options:
    - Municipal Corporation
    - Gram Panchayat
    - Zila Parishad
    - Gram Sabha
    answer: Municipal Corporation
    difficulty: 1
    hints:
    - Big city.
    - Mayor.
    solution: Big cities have Municipal Corporations.
    mistakes:
      Gram Panchayat: c6ss_urban
  - prompt: 'The head of a Municipal Corporation is the:'
    options:
    - Mayor
    - Sarpanch
    - Governor
    - Prime Minister
    answer: Mayor
    difficulty: 1
    hints:
    - Elected leader of a city.
    - Mayor.
    solution: The Mayor heads the Corporation.
    mistakes: {"Sarpanch": "s6_mayor"}
  - prompt: 'A city is divided into small areas called:'
    options:
    - wards
    - states
    - blocks of panchayats
    - continents
    answer: wards
    difficulty: 1
    hints:
    - Each elects a councillor.
    - Ward.
    solution: Cities are divided into wards.
    mistakes: {"states": "s6_wards"}
  - prompt: 'Each ward elects a:'
    options:
    - councillor
    - Prime Minister
    - judge
    - President of India
    answer: councillor
    difficulty: 1
    hints:
    - Ward representative.
    - Councillor.
    solution: Each ward elects a councillor.
    mistakes: {"judge": "s6_councillor"}
  - prompt: Which amendment gave constitutional status to urban local bodies?
    options:
    - 74th Amendment (1992)
    - 73rd Amendment
    - 44th Amendment
    - 1st Amendment
    answer: 74th Amendment (1992)
    difficulty: 2
    hints:
    - Just after the 73rd.
    - Urban.
    solution: The 74th Amendment, 1992.
    mistakes: {"73rd Amendment": "s6_74th"}
  - prompt: Who heads the day-to-day administration of a Municipal Corporation?
    options:
    - Municipal Commissioner
    - Sarpanch
    - Gram Sabha
    - Chief Justice
    answer: Municipal Commissioner
    difficulty: 2
    hints:
    - An officer, not elected.
    - Often IAS.
    solution: The Municipal Commissioner runs the administration.
    mistakes: {"Sarpanch": "s6_commissioner"}
  - prompt: 'Thiruvananthapuram, a big city, is governed by a:'
    options:
    - Municipal Corporation
    - Gram Panchayat
    - Nagar Panchayat
    answer: Municipal Corporation
    difficulty: 1
    hints:
    - It is Kerala's capital, a large city.
    - Large cities have the biggest urban body.
    solution: 'Step 1: Thiruvananthapuram is a large city. Step 2: large cities have a Municipal Corporation.'
    mistakes:
      Gram Panchayat: c6ss12_body
      Nagar Panchayat: c6ss12_body
  - prompt: 'The head of a Municipal Council in a small town is the:'
    options:
    - Chairperson
    - Mayor
    - Sarpanch
    answer: Chairperson
    difficulty: 2
    hints:
    - Mayor is for big cities.
    - Sarpanch is for villages.
    solution: 'Step 1: big cities have a Mayor, villages a Sarpanch. Step 2: a Municipal Council is led by a Chairperson.'
    mistakes:
      Mayor: c6ss12_body
      Sarpanch: c6ss12_body
  - prompt: For how many years is a ward councillor elected?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Same as panchayat members.
    - Same as the Lok Sabha.
    solution: 'Step 1: local body terms are fixed. Step 2: a councillor is elected for 5 years.'
    mistakes:
      '3': c6ss12_people
      '10': c6ss12_people
  - prompt: A city has 100 wards. How many councillors are elected?
    answer: '100'
    check: '100'
    difficulty: 2
    hints:
    - Each ward elects one councillor.
    - Count the wards.
    solution: 'Step 1: one councillor per ward. Step 2: 100 wards elect 100 councillors.'
    mistakes:
      '50': c6ss12_people
      '1': c6ss12_people
  - prompt: 'The Municipal Commissioner is usually an officer of the:'
    options:
    - IAS
    - Army
    - Supreme Court
    answer: IAS
    difficulty: 2
    hints:
    - He or she is a senior government officer.
    - Indian Administrative Service.
    solution: 'Step 1: the Commissioner is appointed to run the administration. Step 2: usually from the IAS.'
    mistakes:
      Army: c6ss12_people
      Supreme Court: c6ss12_people
  - prompt: A large village is quickly becoming a town. Which body may govern it?
    options:
    - Nagar Panchayat
    - Municipal Corporation
    - Parliament
    answer: Nagar Panchayat
    difficulty: 2
    hints:
    - It is in between village and town.
    - Its name mixes both ideas.
    solution: 'Step 1: it is changing from rural to urban. Step 2: such areas get a Nagar Panchayat.'
    mistakes:
      Municipal Corporation: c6ss12_body
      Parliament: c6ss12_body
  - prompt: Which is elected, not appointed?
    options:
    - The ward councillor
    - The Municipal Commissioner
    - The municipal engineer
    answer: The ward councillor
    difficulty: 2
    hints:
    - Voters choose one of these.
    - The others are officials.
    solution: 'Step 1: officers like the Commissioner and engineer are appointed. Step 2: the ward councillor is elected by residents.'
    mistakes:
      The Municipal Commissioner: c6ss12_people
      The municipal engineer: c6ss12_people
  - prompt: Why is a city divided into wards?
    options:
    - So each small area has its own representative
    - To stop people moving
    - To make taxes disappear
    answer: So each small area has its own representative
    difficulty: 3
    hints:
    - A city is too big for one person to know every street.
    - Each part needs a voice.
    solution: 'Step 1: big cities have many areas with different needs. Step 2: wards let each area elect someone to speak for it.'
    mistakes:
      To stop people moving: c6ss12_body
      To make taxes disappear: c6ss12_body
  - prompt: 'Rural local bodies come from the 73rd Amendment. Urban local bodies come from the:'
    options:
    - 74th Amendment
    - 72nd Amendment
    - 1st Amendment
    answer: 74th Amendment
    difficulty: 2
    hints:
    - It came right after the 73rd.
    - Both were in 1992.
    solution: 'Step 1: the 73rd was for panchayats. Step 2: the next one, the 74th, was for towns and cities.'
    mistakes:
      72nd Amendment: c6ss12_body
      1st Amendment: c6ss12_body
- code: cbse6ss.urban.work
  title: What city governments do
  after:
  - cbse6ss.urban.bodies
  notes: |
    Municipal work: water supply, sewage and drains, garbage collection and waste management, street lights, roads,
    parks, public health (hospitals, vaccination), primary schools, fire services, markets, registering births and deaths,
    building permissions. Money: property tax, water charges, fees, grants. Citizens' duties: pay taxes, segregate waste,
    report problems, take part in ward committees.
  explanations:
    text: City governments look after water supply, garbage collection, drains, street lights, roads and parks. They run some schools and hospitals and register births and deaths. They get money from property tax and fees. Citizens help by paying taxes, separating waste and reporting problems.
    visual: 'Picture a city morning: a garbage truck collecting sorted waste, a worker fixing a street light, water flowing from a public tap and children playing in a clean park: all municipal work.'
    step_by_step: 'Step 1: Name the service. Step 2: Ask if it is local to the city. Step 3: If yes, the municipal body handles it. Step 4: Think how citizens can help.'
    real_world: Separating wet and dry waste at home makes the corporation's waste collection easier and keeps the city clean.
  picture:
    kind: compare
    columns:
    - title: City body does
      points:
      - water supply
      - garbage collection
      - street lights
    - title: Citizens can
      points:
      - pay property tax
      - separate waste
      - report problems
    alt: The city body supplies water, collects garbage and runs street lights; citizens pay property tax, separate waste and report problems.
  activity:
    type: sort
    prompt: Who pays for it, and how?
    bins:
    - Property tax
    - Water charges
    - Government grants
    items:
    - label: A house owner pays yearly for their building
      bin: Property tax
      clue: Based on the house.
      why: Property tax.
    - label: A bill for tap water
      bin: Water charges
      clue: Pay for what you use.
      why: Water charges.
    - label: Money from the state for a new hospital
      bin: Government grants
      clue: From higher government.
      why: Grants.
    - label: Shop owner pays on their building
      bin: Property tax
      clue: Based on property.
      why: Property tax.
  lesson:
    - teach: 'Municipal bodies provide everyday services: water supply, sewage and drains, garbage collection, street lights, roads, parks, public health such as vaccination, primary schools, fire services and markets. They also register births and deaths and give building permissions.'
      picture:
        kind: compare
        columns:
        - title: Clean and safe
          points:
          - garbage collection
          - drains
          - fire service
        - title: Basic needs
          points:
          - water supply
          - street lights
          - roads
        - title: Records and health
          points:
          - birth and death registration
          - vaccination
          - schools
        alt: City bodies keep the city clean and safe, provide water, lights and roads, and handle records, health and schools.
      check:
        prompt: Who issues permission to build a new house in a city?
        options:
        - The municipal body
        - The Supreme Court
        - A school
        answer: The municipal body
        why: Building permission is a municipal job.
    - teach: Money for this comes from property tax, water charges, fees and licences, and grants from state and central governments.
      check:
        prompt: 'A homeowner pays a yearly tax on her house to the city. This is:'
        options:
        - Property tax
        - A gift
        - A fine
        answer: Property tax
        why: Tax on buildings and land is property tax.
    - teach: 'Citizens have duties too: pay taxes, separate wet and dry waste, use water carefully, report problems and join ward meetings. A city works best when people and the municipality cooperate.'
      check:
        prompt: Which helps the city's garbage work most?
        options:
        - Separating wet and dry waste at home
        - Throwing waste into drains
        - Burning plastic on the street
        answer: Separating wet and dry waste at home
        why: Sorted waste can be composted or recycled.
  items:
  - prompt: Who collects garbage in a city?
    options:
    - The Municipal Corporation or Council
    - The Supreme Court
    - The Parliament
    - The Election Commission
    answer: The Municipal Corporation or Council
    difficulty: 1
    hints:
    - Local service.
    - Municipal.
    solution: Municipal bodies handle garbage collection.
    mistakes: {"The Parliament": "s6_garbage"}
  - prompt: Which is a main source of money for municipal bodies?
    options:
    - Property tax
    - Income from Parliament seats
    - Sale of rivers
    - School fees of children only
    answer: Property tax
    difficulty: 2
    hints:
    - Paid by house owners.
    - Local tax.
    solution: Property tax is a key source.
    mistakes: {"Sale of rivers": "s6_property_tax"}
  - prompt: Which is a citizen's duty that helps the city?
    options:
    - Separating wet and dry waste
    - Throwing litter on roads
    - Wasting water
    - Breaking street lights
    answer: Separating wet and dry waste
    difficulty: 1
    hints:
    - Helps waste management.
    - Segregation.
    solution: Separating waste helps the city.
    mistakes: {"Wasting water": "s6_segregate"}
  - prompt: 'Registering a baby''s birth in a city is done by the:'
    options:
    - Municipal body
    - Army
    - Supreme Court
    - Railway
    answer: Municipal body
    difficulty: 2
    hints:
    - Local records.
    - Birth certificate.
    solution: Municipal bodies register births and deaths.
    mistakes: {"Supreme Court": "s6_birth_reg"}
  - prompt: 'A broken street light should be reported to the:'
    options:
    - ward councillor or municipal office
    - Prime Minister
    - Supreme Court
    - school principal
    answer: ward councillor or municipal office
    difficulty: 1
    hints:
    - Local problem.
    - Closest representative.
    solution: Report it to your ward councillor or the municipality.
    mistakes: {"Prime Minister": "s6_streetlight"}
  - prompt: Which service is NOT usually done by a municipal body?
    options:
    - Defending the country's borders
    - Street lights
    - Drains
    - Parks
    answer: Defending the country's borders
    difficulty: 1
    hints:
    - That is national.
    - Army.
    solution: Defence is done by the central government.
    mistakes: {"Drains": "s6_not_municipal"}
  - prompt: Which service is provided by a municipal body?
    options:
    - Street lighting
    - Printing currency notes
    - Running the army
    answer: Street lighting
    difficulty: 1
    hints:
    - It is a local, everyday service.
    - The others are national jobs.
    solution: 'Step 1: currency and the army are central jobs. Step 2: street lights are a municipal service.'
    mistakes:
      Printing currency notes: c6ss12_work
      Running the army: c6ss12_work
  - prompt: Banana peels and vegetable waste are which type of waste?
    options:
    - Wet (biodegradable) waste
    - Dry waste
    - Electronic waste
    answer: Wet (biodegradable) waste
    difficulty: 1
    hints:
    - They come from plants.
    - They rot quickly.
    solution: 'Step 1: peels and vegetable bits rot. Step 2: they are wet, biodegradable waste.'
    mistakes:
      Dry waste: c6ss12_duty
      Electronic waste: c6ss12_duty
  - prompt: A fire breaks out in a shop. Which municipal service helps?
    options:
    - Fire service
    - Birth registration
    - Parks department
    answer: Fire service
    difficulty: 1
    hints:
    - Emergency service.
    - Fire engines.
    solution: 'Step 1: fires need fire engines. Step 2: the municipal fire service responds.'
    mistakes:
      Birth registration: c6ss12_work
      Parks department: c6ss12_work
  - prompt: A city collects ₹2,000 property tax each from 500 houses. How much does it collect (in ₹)?
    answer: '1000000'
    check: 2000*500
    difficulty: 3
    hints:
    - Multiply tax by number of houses.
    - 2,000 × 500.
    solution: 'Step 1: 2,000 × 500. Step 2: = ₹10,00,000 (ten lakh).'
    mistakes:
      '100000': c6ss12_money
      '2500': c6ss12_money
  - prompt: 'Water charges paid by households go to the:'
    options:
    - Municipal body
    - Supreme Court
    - Gram Sabha
    answer: Municipal body
    difficulty: 1
    hints:
    - It supplies the water.
    - It is the city's local body.
    solution: 'Step 1: the municipality supplies city water. Step 2: water charges are paid to it.'
    mistakes:
      Supreme Court: c6ss12_money
      Gram Sabha: c6ss12_money
  - prompt: Children get free polio drops at a city health centre. Which municipal work is this?
    options:
    - Public health
    - Street lighting
    - Building permissions
    answer: Public health
    difficulty: 2
    hints:
    - It protects people from disease.
    - Vaccination.
    solution: 'Step 1: vaccination prevents disease. Step 2: that is public health work.'
    mistakes:
      Street lighting: c6ss12_work
      Building permissions: c6ss12_work
  - prompt: Which citizen action makes a city's drains overflow?
    options:
    - Throwing plastic bags into drains
    - Paying property tax
    - Reporting a leak
    answer: Throwing plastic bags into drains
    difficulty: 2
    hints:
    - Drains must stay clear.
    - What blocks them?
    solution: 'Step 1: plastic blocks drains. Step 2: blocked drains overflow, especially in rain.'
    mistakes:
      Paying property tax: c6ss12_duty
      Reporting a leak: c6ss12_duty
  - prompt: Why must citizens pay municipal taxes?
    options:
    - They pay for services like water, roads and garbage collection
    - To punish them
    - Taxes are not used
    answer: They pay for services like water, roads and garbage collection
    difficulty: 2
    hints:
    - Services cost money.
    - Where does that money come from?
    solution: 'Step 1: city services need money. Step 2: taxes from citizens help pay for them.'
    mistakes:
      To punish them: c6ss12_money
      Taxes are not used: c6ss12_money
  - prompt: Newspapers and plastic bottles are which type of waste?
    options:
    - Dry waste
    - Wet waste
    - Food waste
    answer: Dry waste
    difficulty: 1
    hints:
    - They don't rot quickly.
    - They can be recycled.
    solution: 'Step 1: paper and plastic don''t rot fast. Step 2: they are dry waste for recycling.'
    mistakes:
      Wet waste: c6ss12_duty
      Food waste: c6ss12_duty
