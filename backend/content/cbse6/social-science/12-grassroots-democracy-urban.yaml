# CBSE Class 6 Social Science (NCERT Exploring Society: India and Beyond, 2024-25), chapter 12. Format: content/README.md.
subject: cbse6-ss
chapter: 12
title: 'Grassroots Democracy Part 3: Local Government in Urban Areas'
tips:
  c6ss_urban: Big cities have a Municipal Corporation led by a Mayor; smaller towns have a Municipal Council (or Municipality) led by a Chairperson.
concepts:
- code: cbse6ss.urban.bodies
  title: Municipal bodies
  notes: |
    Urban local government: given constitutional status by the 74th Amendment (1992). Municipal Corporation for large
    cities (Kochi, Thiruvananthapuram, Mumbai), headed by an elected Mayor; Municipal Council/Municipality for smaller
    towns, headed by a Chairperson; Nagar Panchayat for areas changing from rural to urban. The city is divided into
    wards; each elects a councillor for 5 years. A Municipal Commissioner (an IAS officer) heads the administration.
  explanations:
    text: Towns and cities have their own local government. Big cities like Kochi have a Municipal Corporation led by a Mayor. Smaller towns have a Municipal Council led by a Chairperson. The city is split into wards, and each ward elects a councillor.
    visual: 'Draw a city map divided into numbered blocks (wards). Put a small figure in each block: the ward councillor. In the centre, a building labelled ''Corporation'', with the Mayor.'
    step_by_step: 'Step 1: Is it a big city or small town? Step 2: Name the body: Corporation or Council. Step 3: Name the head: Mayor or Chairperson. Step 4: Remember: wards elect councillors.'
    real_world: Kerala has six Municipal Corporations, including Thiruvananthapuram, Kochi and Kozhikode.
  picture:
    kind: compare
    columns:
    - title: Municipal Corporation
      points:
      - big cities
      - headed by Mayor
      - e.g. Kochi
    - title: Municipal Council
      points:
      - smaller towns
      - headed by Chairperson
      - e.g. a district town
    alt: Big cities like Kochi have a Municipal Corporation headed by a Mayor; smaller towns have a Municipal Council headed by a Chairperson.
  items:
  - prompt: 'A large city like Kochi is governed by a:'
    options:
    - Municipal Corporation
    - Gram Panchayat
    - Zila Parishad
    - Gram Sabha
    answer: Municipal Corporation
    difficulty: 1
    hints:
    - Big city.
    - Mayor.
    solution: Big cities have Municipal Corporations.
    mistakes:
      Gram Panchayat: c6ss_urban
  - prompt: 'The head of a Municipal Corporation is the:'
    options:
    - Mayor
    - Sarpanch
    - Governor
    - Prime Minister
    answer: Mayor
    difficulty: 1
    hints:
    - Elected leader of a city.
    - Mayor.
    solution: The Mayor heads the Corporation.
  - prompt: 'A city is divided into small areas called:'
    options:
    - wards
    - states
    - blocks of panchayats
    - continents
    answer: wards
    difficulty: 1
    hints:
    - Each elects a councillor.
    - Ward.
    solution: Cities are divided into wards.
  - prompt: 'Each ward elects a:'
    options:
    - councillor
    - Prime Minister
    - judge
    - President of India
    answer: councillor
    difficulty: 1
    hints:
    - Ward representative.
    - Councillor.
    solution: Each ward elects a councillor.
  - prompt: Which amendment gave constitutional status to urban local bodies?
    options:
    - 74th Amendment (1992)
    - 73rd Amendment
    - 44th Amendment
    - 1st Amendment
    answer: 74th Amendment (1992)
    difficulty: 2
    hints:
    - Just after the 73rd.
    - Urban.
    solution: The 74th Amendment, 1992.
  - prompt: Who heads the day-to-day administration of a Municipal Corporation?
    options:
    - Municipal Commissioner
    - Sarpanch
    - Gram Sabha
    - Chief Justice
    answer: Municipal Commissioner
    difficulty: 2
    hints:
    - An officer, not elected.
    - Often IAS.
    solution: The Municipal Commissioner runs the administration.
- code: cbse6ss.urban.work
  title: What city governments do
  after:
  - cbse6ss.urban.bodies
  notes: |
    Municipal work: water supply, sewage and drains, garbage collection and waste management, street lights, roads,
    parks, public health (hospitals, vaccination), primary schools, fire services, markets, registering births and deaths,
    building permissions. Money: property tax, water charges, fees, grants. Citizens' duties: pay taxes, segregate waste,
    report problems, take part in ward committees.
  explanations:
    text: City governments look after water supply, garbage collection, drains, street lights, roads and parks. They run some schools and hospitals and register births and deaths. They get money from property tax and fees. Citizens help by paying taxes, separating waste and reporting problems.
    visual: 'Picture a city morning: a garbage truck collecting sorted waste, a worker fixing a street light, water flowing from a public tap and children playing in a clean park: all municipal work.'
    step_by_step: 'Step 1: Name the service. Step 2: Ask if it is local to the city. Step 3: If yes, the municipal body handles it. Step 4: Think how citizens can help.'
    real_world: Separating wet and dry waste at home makes the corporation's waste collection easier and keeps the city clean.
  picture:
    kind: compare
    columns:
    - title: City body does
      points:
      - water supply
      - garbage collection
      - street lights
    - title: Citizens can
      points:
      - pay property tax
      - separate waste
      - report problems
    alt: The city body supplies water, collects garbage and runs street lights; citizens pay property tax, separate waste and report problems.
  items:
  - prompt: Who collects garbage in a city?
    options:
    - The Municipal Corporation or Council
    - The Supreme Court
    - The Parliament
    - The Election Commission
    answer: The Municipal Corporation or Council
    difficulty: 1
    hints:
    - Local service.
    - Municipal.
    solution: Municipal bodies handle garbage collection.
  - prompt: Which is a main source of money for municipal bodies?
    options:
    - Property tax
    - Income from Parliament seats
    - Sale of rivers
    - School fees of children only
    answer: Property tax
    difficulty: 2
    hints:
    - Paid by house owners.
    - Local tax.
    solution: Property tax is a key source.
  - prompt: Which is a citizen's duty that helps the city?
    options:
    - Separating wet and dry waste
    - Throwing litter on roads
    - Wasting water
    - Breaking street lights
    answer: Separating wet and dry waste
    difficulty: 1
    hints:
    - Helps waste management.
    - Segregation.
    solution: Separating waste helps the city.
  - prompt: 'Registering a baby''s birth in a city is done by the:'
    options:
    - Municipal body
    - Army
    - Supreme Court
    - Railway
    answer: Municipal body
    difficulty: 2
    hints:
    - Local records.
    - Birth certificate.
    solution: Municipal bodies register births and deaths.
  - prompt: 'A broken street light should be reported to the:'
    options:
    - ward councillor or municipal office
    - Prime Minister
    - Supreme Court
    - school principal
    answer: ward councillor or municipal office
    difficulty: 1
    hints:
    - Local problem.
    - Closest representative.
    solution: Report it to your ward councillor or the municipality.
  - prompt: Which service is NOT usually done by a municipal body?
    options:
    - Defending the country's borders
    - Street lights
    - Drains
    - Parks
    answer: Defending the country's borders
    difficulty: 1
    hints:
    - That is national.
    - Army.
    solution: Defence is done by the central government.
