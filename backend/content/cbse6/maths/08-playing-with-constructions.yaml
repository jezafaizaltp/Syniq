# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 8. Format: content/README.md.
subject: cbse6-math
chapter: 8
title: Playing with Constructions
tips:
  c6_radius: The radius goes from the centre to the edge. The diameter goes right across through the centre, so it is twice the radius.
  c6_square_def: "A square needs equal sides AND right angles. With equal sides but slanted angles, the shape is a pushed-over square with another name."
  t6_arc: "A ray is straight and a diameter goes straight across. A curved piece of the circle's edge has its own short name."
  t6_arcs_meet: "Each arc is drawn with radius 4 cm. So P is 4 cm from each centre."
  t6_circle_equal: "A compass keeps its legs the same width while drawing. What does that tell you about each point and the centre?"
  t6_equal_diagonals: "A rectangle's two diagonals are equal."
  t6_four_right: "Every corner of a rectangle is a right angle. Count the corners."
  t6_radius_half: "The radius is half the diameter."
  t6_rectangle_diagonals: "Measure both diagonals of a rectangle. What do you notice?"
  t6_tool_right_angle: "Which tools have a ready-made 90° corner or measure angles?"
concepts:
- code: cbse6m.cons.circles
  title: Circles and arcs with a compass
  notes: |
    A compass draws circles: the point is the centre, the opening is the radius. Every point on a circle is the same
    distance (the radius) from the centre. Diameter = 2 × radius, passes through the centre. An arc is part of a circle.
    Arcs mark points at a given distance from a point; two arcs from two points meet where both distances hold. Designs
    (wavy lines, eyes, flowers) are made from arcs.
  explanations:
    text: A compass draws circles. Put the sharp point at the centre, open it to the radius you want, and turn. Every point on the circle is the same distance from the centre. The diameter goes right across through the centre and is twice the radius.
    visual: 'Open a compass to 3 cm, put the point on O and draw a circle. Draw a line through O touching the circle on both sides: that diameter is 6 cm.'
    step_by_step: 'Step 1: Set the compass opening on a ruler. Step 2: Put the point on the centre. Step 3: Turn the compass without changing the opening. Step 4: For an arc, turn only part of the way.'
    real_world: A bangle, a coin and a wheel are all circles; the spokes of a wheel are radii.
  picture:
    kind: geometry
    points:
      O:
      - 5
      - 5
      A:
      - 8
      - 5
      _B:
      - 2
      - 5
    segments:
    - - O
      - A
      - radius 3 cm
    circles:
    - centre: O
      radius: 3
    alt: A circle with centre O and radius OA of 3 cm.
  activity:
    type: order
    prompt: Put the steps for drawing a circle of radius 4 cm with a compass in order.
    steps:
    - Mark the centre point O
    - Open the compass to 4 cm on a ruler
    - Put the compass point on O
    - Turn the pencil all the way round
    - Check the radius again with the ruler
    reasons:
      Open the compass to 4 cm on a ruler: You need the centre O marked before you set the size.
      Put the compass point on O: Set the radius first, so the circle comes out the right size.
      Turn the pencil all the way round: The point must be on O first, or the circle won't be centred.
      Check the radius again with the ruler: You can only check a circle once it is drawn.
  items:
  - prompt: A circle has radius 4 cm. What is its diameter (in cm)?
    answer: '8'
    check: 2*4
    difficulty: 1
    hints:
    - Diameter = 2 × radius.
    - 2 × 4.
    solution: 2 × 4 = 8 cm.
    mistakes:
      '4': c6_radius
  - prompt: A circle has diameter 10 cm. What is its radius (in cm)?
    answer: '5'
    check: 10/2
    difficulty: 1
    hints:
    - Radius is half the diameter.
    - 10 ÷ 2.
    solution: 10 ÷ 2 = 5 cm.
    mistakes: {"20": "t6_radius_half", "10": "t6_radius_half"}
  - prompt: 'All points on a circle are:'
    options:
    - the same distance from the centre
    - on a straight line
    - inside the circle
    - different distances from the centre
    answer: the same distance from the centre
    difficulty: 1
    hints:
    - That distance has a name.
    - The radius.
    solution: Every point on a circle is one radius from the centre.
    mistakes: {"on a straight line": "t6_circle_equal", "different distances from the centre": "t6_circle_equal"}
  - prompt: What is a part of a circle called?
    options:
    - An arc
    - A ray
    - A diameter
    - A vertex
    answer: An arc
    difficulty: 1
    hints:
    - A curved piece.
    - Like a rainbow shape.
    solution: A piece of a circle's edge is an arc.
    mistakes: {"A ray": "t6_arc", "A diameter": "t6_arc"}
  - prompt: 'To draw a circle of radius 5 cm, you open the compass to:'
    options:
    - 5 cm
    - 10 cm
    - 2.5 cm
    - any size
    answer: 5 cm
    difficulty: 1
    hints:
    - The opening is the radius.
    - Not the diameter.
    solution: The compass opening equals the radius, 5 cm.
    mistakes:
      10 cm: c6_radius
  - prompt: 'Two arcs of radius 4 cm are drawn from points A and B, 6 cm apart. The point P where they meet is:'
    options:
    - 4 cm from A and 4 cm from B
    - 6 cm from both
    - on the line AB
    - 2 cm from A
    answer: 4 cm from A and 4 cm from B
    difficulty: 2
    hints:
    - Each arc is 4 cm from its centre.
    - P lies on both arcs.
    solution: P is on both arcs, so it is 4 cm from A and 4 cm from B.
    mistakes: {"6 cm from both": "t6_arcs_meet", "on the line AB": "t6_arcs_meet"}
- code: cbse6m.cons.shapes
  title: Constructing squares and rectangles
  after:
  - cbse6m.cons.circles
  notes: |
    Rectangle: opposite sides equal, all angles 90°; its diagonals are equal and bisect each other. Square: all sides
    equal, all angles 90°; diagonals equal, bisect each other at 90°. To construct a rectangle 6 cm × 4 cm: draw AB =
    6 cm, draw perpendiculars at A and B (set square or protractor), mark 4 cm on each with a compass, join. Using only a
    compass and ruler: from the end points, arcs of the right lengths fix the fourth corner.
  explanations:
    text: To build a rectangle, draw one side, make square corners at both ends, measure the other side on each, and join the tops. A square is a rectangle with all four sides equal. A rectangle's diagonals are equal in length.
    visual: 'Draw AB = 6 cm. At A and B, draw lines straight up (90°). Mark 4 cm up each line at D and C. Join DC. Check with a ruler: DC should be 6 cm.'
    step_by_step: 'Step 1: Draw the base with a ruler. Step 2: Make 90° angles at both ends. Step 3: Use the compass to mark the side length on each. Step 4: Join the marks. Step 5: Check the diagonals are equal.'
    real_world: 'Carpenters check a door frame is a true rectangle by measuring both diagonals: if they are equal, the corners are square.'
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 2
      B:
      - 8
      - 2
      C:
      - 8
      - 7
      D:
      - 1
      - 7
    segments:
    - - A
      - B
      - 6 cm
    - - B
      - C
      - 4 cm
    - - C
      - D
    - - D
      - A
    - - A
      - C
    - - B
      - D
    alt: Rectangle ABCD, 6 cm by 4 cm, with its two equal diagonals AC and BD.
  activity:
    type: rectangle
    max_side: 10
    prompt: Construct shapes with exact sides. Opposite sides of a rectangle are equal.
    goals:
    - prompt: Make a rectangle 5 units long and 3 units wide.
      width: 5
      height: 3
    - prompt: Make a square with sides of 4 units.
      width: 4
      height: 4
  items:
  - prompt: Which is true for every rectangle?
    options:
    - Its diagonals are equal
    - All sides are equal
    - It has an angle of 60°
    - Its diagonals are always perpendicular
    answer: Its diagonals are equal
    difficulty: 1
    hints:
    - Measure both diagonals.
    - Sides are not all equal.
    solution: A rectangle's diagonals are always equal.
    mistakes: {"All sides are equal": "t6_rectangle_diagonals", "Its diagonals are always perpendicular": "t6_rectangle_diagonals"}
  - prompt: How many right angles does a rectangle have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count the corners.
    - All are square corners.
    solution: All 4 angles are 90°.
    mistakes: {"2": "t6_four_right", "0": "t6_four_right"}
  - prompt: 'A shape has 4 equal sides but its angles are not 90°. It is a:'
    options:
    - Rhombus
    - Square
    - Rectangle
    - Triangle
    answer: Rhombus
    difficulty: 2
    hints:
    - A square also needs 90° angles.
    - A tilted square shape.
    solution: Four equal sides without right angles make a rhombus.
    mistakes:
      Square: c6_square_def
  - prompt: A rectangle is 6 cm by 8 cm. Its diagonal is 10 cm. How long is the other diagonal (in cm)?
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - Diagonals of a rectangle are equal.
    - Same length.
    solution: The other diagonal is also 10 cm.
    mistakes: {"6": "t6_equal_diagonals", "8": "t6_equal_diagonals"}
  - prompt: What is the perimeter of the square you construct with side 5 cm (in cm)?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - 4 × side.
    - 4 × 5.
    solution: 4 × 5 = 20 cm.
    mistakes: {"25": "t6_square_perimeter", "10": "t6_square_perimeter"}
  - prompt: Which tool is used to make sure a corner is exactly 90°?
    options:
    - Set square or protractor
    - Compass only
    - Eraser
    - Divider only
    answer: Set square or protractor
    difficulty: 2
    hints:
    - You need to measure an angle.
    - A set square has a 90° corner.
    solution: A set square or protractor gives an exact right angle.
    mistakes: {"Compass only": "t6_tool_right_angle", "Eraser": "t6_tool_right_angle"}
