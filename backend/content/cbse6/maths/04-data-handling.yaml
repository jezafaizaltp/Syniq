# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 4. Format: content/README.md.
subject: cbse6-math
chapter: 4
title: Data Handling
tips:
  c6_tally: Each group of tally marks |||| with a line across counts 5. Count the groups in fives, then add the single marks.
  c6_scale: 'Read the key or scale first: if one picture stands for 10, multiply the number of pictures by 10.'
  t6_bar_graph_parts: "Without a title and labels, can a reader tell what the bars mean?"
  t6_choose_scale: "Choose a scale where the biggest value fits on the page but bars are still easy to read."
  t6_fewest: "The fewest has the smallest number (the shortest bar)."
  t6_how_many_more: "'How many more' means subtract the smaller from the larger."
  t6_most_liked: "The most liked fruit has the highest count."
  t6_picture_scale: "Each picture is 4 balls. Divide 18 by 4; half a picture is allowed."
  t6_survey_total: "Add all the counts together."
  t6_tally_fives: "Bundles of five let you count 5, 10, 15 … quickly."
  t6_total_bars: "Add all five bars."
concepts:
- code: cbse6m.data.collect
  title: Collecting and organising data
  notes: |
    Data are facts and numbers collected to answer a question. Organise them in a table. Tally marks: draw one stroke per
    item, and the fifth stroke crosses the four (||||) to make counting in fives easy. Frequency = how many times a
    value appears. Sorting data by size or category helps find the most common (mode) and least common. A
    pictograph uses pictures; each picture stands for a fixed number (the key or scale).
  explanations:
    text: Data are information we collect to answer a question, like 'Which fruit do my classmates like most?'. We count with tally marks, groups of five with a line across, and write the totals in a table. A pictograph shows the counts with pictures.
    visual: 'Draw a table: Fruit | Tally | Number. Mango: |||| ||| = 8. Banana: |||| = 5. Apple: ||| = 3. Each crossed bundle is 5.'
    step_by_step: 'Step 1: Ask a clear question. Step 2: Make a mark for each answer. Step 3: Bundle every 5 marks. Step 4: Count and write the totals. Step 5: Find which is most and least common.'
    real_world: A class monitor counting votes for the class leader on the board uses tally marks, bundling them in fives.
  picture:
    kind: bars
    bars:
    - label: Mango
      value: 8
    - label: Banana
      value: 5
    - label: Apple
      value: 3
    - label: Orange
      value: 4
    alt: 'Favourite fruits: mango 8, banana 5, apple 3, orange 4.'
    unit: children
  activity:
    type: bars
    show: tally
    max: 10
    prompt: A class voted for their favourite fruit. Build the bar graph from the tally marks.
    categories:
    - label: Mango
      value: 8
    - label: Banana
      value: 5
    - label: Apple
      value: 3
    - label: Guava
      value: 6
  items:
  - prompt: How many does |||| |||| ||| stand for? (|||| is a bundle of 5)
    answer: '13'
    check: 5+5+3
    difficulty: 1
    hints:
    - Two bundles of 5 and 3 single marks.
    - 5 + 5 + 3.
    solution: 5 + 5 + 3 = 13.
    mistakes:
      '11': c6_tally
  - prompt: In a fruit survey, mango got 8, banana 5, apple 3, orange 4. Which fruit is most liked?
    options:
    - Mango
    - Banana
    - Apple
    - Orange
    answer: Mango
    difficulty: 1
    hints:
    - Find the biggest number.
    - 8 is the largest.
    solution: Mango has the highest count, 8.
    mistakes: {"Banana": "t6_most_liked", "Apple": "t6_most_liked"}
  - prompt: In the same survey, how many children answered in all?
    answer: '20'
    check: 8+5+3+4
    difficulty: 1
    hints:
    - Add all the counts.
    - 8 + 5 + 3 + 4.
    solution: 8 + 5 + 3 + 4 = 20.
    mistakes: {"4": "t6_survey_total", "8": "t6_survey_total"}
  - prompt: In a pictograph, one 🍎 stands for 10 apples. How many apples do 6 🍎 show?
    answer: '60'
    check: 6*10
    difficulty: 1
    hints:
    - Each picture = 10.
    - 6 × 10.
    solution: 6 × 10 = 60 apples.
    mistakes:
      '6': c6_scale
  - prompt: One ⚽ stands for 4 balls. How many pictures show 18 balls?
    answer: '4.5'
    check: Rational(18,4)
    difficulty: 2
    hints:
    - 18 ÷ 4.
    - A half picture shows 2.
    solution: 18 ÷ 4 = 4 and a half pictures.
    mistakes: {"72": "t6_picture_scale", "18": "t6_picture_scale"}
  - prompt: Why do we bundle tally marks in fives?
    options:
    - To count quickly by fives
    - To make them look neat only
    - Because five is the biggest number
    - To hide the total
    answer: To count quickly by fives
    difficulty: 2
    hints:
    - Think about counting 23 single marks.
    - Groups are easier.
    solution: Bundles of five let us count by fives quickly.
    mistakes: {"Because five is the biggest number": "t6_tally_fives", "To hide the total": "t6_tally_fives"}
- code: cbse6m.data.bars
  title: Reading and drawing bar graphs
  after:
  - cbse6m.data.collect
  notes: |
    A bar graph shows data with bars of equal width; the height (or length) shows the value. One axis shows the
    categories, the other a scale (1 unit = 5 children, say). Choose a scale so the biggest value fits. Gaps between
    bars are equal. Read a bar by following its top across to the scale. Compare bars to find the largest, smallest,
    differences and totals. A graph needs a title and labels on both axes.
  explanations:
    text: 'A bar graph uses bars to show numbers. Taller bars mean bigger numbers. Before reading it, check the scale: one square might mean 1, 5 or 10. Then follow the top of each bar across to the scale.'
    visual: Draw two lines like an L. Write days along the bottom and numbers 0, 10, 20, 30 up the side. For Monday's 20 books, draw a bar up to 20; for Tuesday's 30, a taller bar up to 30.
    step_by_step: 'Step 1: Read the title and the labels. Step 2: Check the scale. Step 3: Follow each bar''s top to the scale. Step 4: Compare bars to answer the question.'
    real_world: Weather reports show rainfall each month as bars, so you can see at a glance that July is the wettest month in Kerala.
  picture:
    kind: bars
    bars:
    - label: Mon
      value: 20
    - label: Tue
      value: 30
    - label: Wed
      value: 15
    - label: Thu
      value: 25
    - label: Fri
      value: 10
    alt: 'Library books borrowed: Monday 20, Tuesday 30, Wednesday 15, Thursday 25, Friday 10.'
    unit: books
  activity:
    type: bars
    show: table
    max: 20
    prompt: Books read in a month by four friends. Make each bar as tall as the table says.
    categories:
    - label: Asha
      value: 12
    - label: Ravi
      value: 7
    - label: Meera
      value: 15
    - label: Dev
      value: 4
  items:
  - prompt: In the library graph (Mon 20, Tue 30, Wed 15, Thu 25, Fri 10), on which day were the fewest books borrowed?
    options:
    - Friday
    - Monday
    - Wednesday
    - Tuesday
    answer: Friday
    difficulty: 1
    hints:
    - Find the shortest bar.
    - 10 is the smallest.
    solution: Friday has the shortest bar, 10.
    mistakes: {"Tuesday": "t6_fewest", "Wednesday": "t6_fewest"}
  - prompt: How many more books were borrowed on Tuesday than on Wednesday?
    answer: '15'
    check: 30 - 15
    difficulty: 1
    hints:
    - 30 − 15.
    - Subtract.
    solution: 30 − 15 = 15 more.
    mistakes: {"45": "t6_how_many_more", "30": "t6_how_many_more"}
  - prompt: How many books were borrowed from Monday to Friday?
    answer: '100'
    check: 20+30+15+25+10
    difficulty: 2
    hints:
    - Add all five bars.
    - 20+30+15+25+10.
    solution: 20 + 30 + 15 + 25 + 10 = 100.
    mistakes: {"20": "t6_total_bars", "90": "t6_total_bars"}
  - prompt: A bar graph has a scale of 1 unit = 5 children. A bar is 7 units tall. How many children is that?
    answer: '35'
    check: 7*5
    difficulty: 1
    hints:
    - Multiply by the scale.
    - 7 × 5.
    solution: 7 × 5 = 35 children.
    mistakes:
      '7': c6_scale
  - prompt: Which is the best scale to show values 120, 260 and 340?
    options:
    - 1 unit = 50
    - 1 unit = 1
    - 1 unit = 2
    - 1 unit = 1000
    answer: 1 unit = 50
    difficulty: 2
    hints:
    - The biggest bar should fit but not be tiny.
    - 340 ÷ 50 ≈ 7 units.
    solution: '1 unit = 50 makes the bars about 2 to 7 units tall: a good fit.'
    mistakes: {"1 unit = 1": "t6_choose_scale", "1 unit = 1000": "t6_choose_scale"}
  - prompt: What must every bar graph have?
    options:
    - A title and labelled axes
    - Bars of different widths
    - Pictures
    - Exactly five bars
    answer: A title and labelled axes
    difficulty: 2
    hints:
    - How else would the reader know what it shows?
    - Labels.
    solution: A title and labels on both axes tell the reader what the graph shows.
    mistakes: {"Pictures": "t6_bar_graph_parts", "Exactly five bars": "t6_bar_graph_parts"}
