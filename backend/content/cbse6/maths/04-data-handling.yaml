# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 4. Format: content/README.md.
subject: cbse6-math
chapter: 4
title: Data Handling
tips:
  c6_tally: Each group of tally marks |||| with a line across counts 5. Count the groups in fives, then add the single marks.
  c6_scale: 'Read the key or scale first: if one picture stands for 10, multiply the number of pictures by 10.'
  t6_bar_graph_parts: "Without a title and labels, can a reader tell what the bars mean?"
  t6_choose_scale: "Choose a scale where the biggest value fits on the page but bars are still easy to read."
  t6_fewest: "The fewest has the smallest number (the shortest bar)."
  t6_how_many_more: "'How many more' means subtract the smaller from the larger."
  t6_most_liked: "The most liked fruit has the highest count."
  t6_picture_scale: "Each picture is 4 balls. Divide 18 by 4; half a picture is allowed."
  t6_survey_total: "Add all the counts together."
  t6_tally_fives: "Bundles of five let you count 5, 10, 15 … quickly."
  t6_total_bars: "Add all five bars."
  c6m4_tally: Count the full bundles of five first, then add the loose marks.
  c6m4_key: 'Check the key: each picture stands for more than one thing.'
  c6m4_total: To find how many in all, add every row of the table.
  c6m4_diff: '''How many more'' means take the smaller number away from the bigger one.'
  c6m4_read: Follow the top of the bar straight across to the scale.
  c6m4_scale: Pick a scale that makes the biggest bar fit, with not too many units.
  c6m4_mode: Look for the value that appears the most times.
concepts:
- code: cbse6m.data.collect
  title: Collecting and organising data
  notes: |
    Data are facts and numbers collected to answer a question. Organise them in a table. Tally marks: draw one stroke per
    item, and the fifth stroke crosses the four (||||) to make counting in fives easy. Frequency = how many times a
    value appears. Sorting data by size or category helps find the most common (mode) and least common. A
    pictograph uses pictures; each picture stands for a fixed number (the key or scale).
  explanations:
    text: Data are information we collect to answer a question, like 'Which fruit do my classmates like most?'. We count with tally marks, groups of five with a line across, and write the totals in a table. A pictograph shows the counts with pictures.
    visual: 'Draw a table: Fruit | Tally | Number. Mango: |||| ||| = 8. Banana: |||| = 5. Apple: ||| = 3. Each crossed bundle is 5.'
    step_by_step: 'Step 1: Ask a clear question. Step 2: Make a mark for each answer. Step 3: Bundle every 5 marks. Step 4: Count and write the totals. Step 5: Find which is most and least common.'
    real_world: A class monitor counting votes for the class leader on the board uses tally marks, bundling them in fives.
  picture:
    kind: bars
    bars:
    - label: Mango
      value: 8
    - label: Banana
      value: 5
    - label: Apple
      value: 3
    - label: Orange
      value: 4
    alt: 'Favourite fruits: mango 8, banana 5, apple 3, orange 4.'
    unit: children
  activity:
    type: bars
    show: tally
    max: 10
    prompt: A class voted for their favourite fruit. Build the bar graph from the tally marks.
    categories:
    - label: Mango
      value: 8
    - label: Banana
      value: 5
    - label: Apple
      value: 3
    - label: Guava
      value: 6
  lesson:
    - teach: Data are facts we collect to answer a question, like 'Which fruit does our class like most?'. We write them in a table so they are easy to read.
      check:
        prompt: Which question needs data collected from your class?
        options:
        - Which sport do most of us play?
        - What is 7 × 8?
        - How many sides does a square have?
        answer: Which sport do most of us play?
        why: Only that one needs you to ask people and count their answers.
    - teach: 'Tally marks keep count while you collect. Draw one stroke for each answer; the fifth stroke goes across the first four. Then count in fives: |||| |||| || is 5 + 5 + 2 = 12. The count is the frequency.'
      picture:
        kind: flow
        steps:
        - '|||| (5)'
        - '|||| (10)'
        - '|| (12)'
        alt: Two bundles of five and two loose strokes make 12.
      check:
        prompt: How many do three bundles and one loose stroke show?
        options:
        - '16'
        - '13'
        - '31'
        answer: '16'
        why: 3 bundles × 5 = 15, plus 1 = 16.
    - teach: A pictograph uses pictures. The key tells what one picture stands for. If one 📚 = 5 books, then 4 📚 = 20 books, and half a 📚 shows 2 or 3 books rounded.
      picture:
        kind: compare
        columns:
        - title: Class A
          points:
          - 📚📚📚
          - 3 × 5 = 15 books
        - title: Class B
          points:
          - 📚📚📚📚
          - 4 × 5 = 20 books
        alt: 'Key: each book picture is worth 5 books. Class A has three pictures, 15 books; Class B has four, 20 books.'
      check:
        prompt: 'Key: one ⭐ = 3 stars won. How many stars do 5 ⭐ show?'
        options:
        - '15'
        - '5'
        - '8'
        answer: '15'
        why: 5 pictures × 3 = 15.
  items:
  - prompt: How many does |||| |||| ||| stand for? (|||| is a bundle of 5)
    answer: '13'
    check: 5+5+3
    difficulty: 1
    hints:
    - Two bundles of 5 and 3 single marks.
    - 5 + 5 + 3.
    solution: 5 + 5 + 3 = 13.
    mistakes:
      '11': c6_tally
  - prompt: In a fruit survey, mango got 8, banana 5, apple 3, orange 4. Which fruit is most liked?
    options:
    - Mango
    - Banana
    - Apple
    - Orange
    answer: Mango
    difficulty: 1
    hints:
    - Find the biggest number.
    - 8 is the largest.
    solution: Mango has the highest count, 8.
    mistakes: {"Banana": "t6_most_liked", "Apple": "t6_most_liked"}
  - prompt: In the same survey, how many children answered in all?
    answer: '20'
    check: 8+5+3+4
    difficulty: 1
    hints:
    - Add all the counts.
    - 8 + 5 + 3 + 4.
    solution: 8 + 5 + 3 + 4 = 20.
    mistakes: {"4": "t6_survey_total", "8": "t6_survey_total"}
  - prompt: In a pictograph, one 🍎 stands for 10 apples. How many apples do 6 🍎 show?
    answer: '60'
    check: 6*10
    difficulty: 1
    hints:
    - Each picture = 10.
    - 6 × 10.
    solution: 6 × 10 = 60 apples.
    mistakes:
      '6': c6_scale
  - prompt: One ⚽ stands for 4 balls. How many pictures show 18 balls?
    answer: '4.5'
    check: Rational(18,4)
    difficulty: 2
    hints:
    - 18 ÷ 4.
    - A half picture shows 2.
    solution: 18 ÷ 4 = 4 and a half pictures.
    mistakes: {"72": "t6_picture_scale", "18": "t6_picture_scale"}
  - prompt: Why do we bundle tally marks in fives?
    options:
    - To count quickly by fives
    - To make them look neat only
    - Because five is the biggest number
    - To hide the total
    answer: To count quickly by fives
    difficulty: 2
    hints:
    - Think about counting 23 single marks.
    - Groups are easier.
    solution: Bundles of five let us count by fives quickly.
    mistakes: {"Because five is the biggest number": "t6_tally_fives", "To hide the total": "t6_tally_fives"}
  - prompt: How many does |||| |||| |||| |||| | show? (|||| is a bundle of 5)
    answer: '21'
    check: 4*5+1
    difficulty: 1
    hints:
    - Count the bundles.
    - 4 bundles of 5, then the loose stroke.
    solution: 'Step 1: 4 bundles × 5 = 20. Step 2: 20 + 1 = 21.'
    mistakes:
      '17': c6m4_tally
      '5': c6m4_tally
  - prompt: 'Colours of 15 children''s bags: red 4, blue 6, black 5. Which colour is most common?'
    options:
    - Blue
    - Red
    - Black
    answer: Blue
    difficulty: 1
    hints:
    - Compare 4, 6 and 5.
    - Most common means the biggest count.
    solution: 'Step 1: the biggest count is 6. Step 2: that is blue.'
    mistakes:
      Red: c6m4_mode
      Black: c6m4_mode
  - prompt: 'Shoe sizes in a group: 4, 5, 5, 6, 5, 4, 7, 5. Which size appears most often?'
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Count how many times each size appears.
    - Which one has the biggest count?
    solution: 'Step 1: size 4 twice, 5 four times, 6 once, 7 once. Step 2: so size 5 appears most.'
    mistakes:
      '4': c6m4_mode
      '7': c6m4_mode
  - prompt: 'Key: one 🚲 = 10 bicycles. A row has 3 and a half 🚲. How many bicycles is that?'
    answer: '35'
    check: 3*10+5
    difficulty: 2
    hints:
    - 3 full pictures first.
    - Half a picture is half of 10.
    solution: 'Step 1: 3 × 10 = 30. Step 2: half a picture = 5, so 30 + 5 = 35.'
    mistakes:
      '3.5': c6m4_key
      '31': c6m4_key
  - prompt: 'Key: one 🍦 = 6 ice creams sold. 42 were sold on Sunday. How many 🍦 are drawn?'
    answer: '7'
    check: 42/6
    difficulty: 2
    hints:
    - Each picture is worth 6.
    - How many 6s make 42?
    solution: 'Step 1: 42 ÷ 6. Step 2: = 7 pictures.'
    mistakes:
      '42': c6m4_key
      '6': c6m4_key
  - prompt: 'Votes: cricket 12, football 9, kabaddi 7, chess 4. How many children voted?'
    answer: '32'
    check: 12+9+7+4
    difficulty: 1
    hints:
    - Add every row.
    - 12 + 9 = 21, then add 7 and 4.
    solution: 'Step 1: 12 + 9 + 7 + 4. Step 2: = 32 children.'
    mistakes:
      '28': c6m4_total
      '12': c6m4_total
  - prompt: 'Same votes: cricket 12, chess 4. How many more chose cricket than chess?'
    answer: '8'
    check: 12-4
    difficulty: 1
    hints:
    - Take the smaller away from the bigger.
    - 12 − 4.
    solution: 'Step 1: 12 − 4. Step 2: = 8 more.'
    mistakes:
      '16': c6m4_diff
      '3': c6m4_diff
  - prompt: A tally shows |||| |||| |||| for 'walk to school' and |||| ||| for 'bus'. How many more walk?
    answer: '7'
    check: 15-8
    difficulty: 2
    hints:
    - 'Walk: 3 bundles. Bus: 1 bundle and 3 strokes.'
    - Find each count, then subtract.
    solution: 'Step 1: walk = 15 and bus = 8. Step 2: 15 − 8 = 7 more.'
    mistakes:
      '23': c6m4_diff
      '2': c6m4_tally
  - prompt: Why is it better to sort the data in a table before answering questions?
    options:
    - You can see counts and compare them at a glance
    - It changes the answers
    - Tables make the numbers bigger
    answer: You can see counts and compare them at a glance
    difficulty: 1
    hints:
    - Think about a long jumbled list.
    - What does a table make easier?
    solution: 'Step 1: a jumbled list is hard to count. Step 2: a table groups the data so you can compare quickly.'
    mistakes:
      It changes the answers: c6m4_total
      Tables make the numbers bigger: c6m4_total
- code: cbse6m.data.bars
  title: Reading and drawing bar graphs
  after:
  - cbse6m.data.collect
  notes: |
    A bar graph shows data with bars of equal width; the height (or length) shows the value. One axis shows the
    categories, the other a scale (1 unit = 5 children, say). Choose a scale so the biggest value fits. Gaps between
    bars are equal. Read a bar by following its top across to the scale. Compare bars to find the largest, smallest,
    differences and totals. A graph needs a title and labels on both axes.
  explanations:
    text: 'A bar graph uses bars to show numbers. Taller bars mean bigger numbers. Before reading it, check the scale: one square might mean 1, 5 or 10. Then follow the top of each bar across to the scale.'
    visual: Draw two lines like an L. Write days along the bottom and numbers 0, 10, 20, 30 up the side. For Monday's 20 books, draw a bar up to 20; for Tuesday's 30, a taller bar up to 30.
    step_by_step: 'Step 1: Read the title and the labels. Step 2: Check the scale. Step 3: Follow each bar''s top to the scale. Step 4: Compare bars to answer the question.'
    real_world: Weather reports show rainfall each month as bars, so you can see at a glance that July is the wettest month in Kerala.
  picture:
    kind: bars
    bars:
    - label: Mon
      value: 20
    - label: Tue
      value: 30
    - label: Wed
      value: 15
    - label: Thu
      value: 25
    - label: Fri
      value: 10
    alt: 'Library books borrowed: Monday 20, Tuesday 30, Wednesday 15, Thursday 25, Friday 10.'
    unit: books
  activity:
    type: bars
    show: table
    max: 20
    prompt: Books read in a month by four friends. Make each bar as tall as the table says.
    categories:
    - label: Asha
      value: 12
    - label: Ravi
      value: 7
    - label: Meera
      value: 15
    - label: Dev
      value: 4
  lesson:
    - teach: A bar graph shows each category as a bar. All bars have the same width and equal gaps. The height of the bar shows the value, read on the scale beside it.
      picture:
        kind: bars
        unit: books
        bars:
        - label: Mon
          value: 20
        - label: Tue
          value: 30
        - label: Wed
          value: 15
        - label: Thu
          value: 25
        alt: 'Books borrowed: Monday 20, Tuesday 30, Wednesday 15, Thursday 25. Tuesday''s bar is tallest.'
      check:
        prompt: In this graph, which day has the tallest bar?
        options:
        - Tuesday
        - Monday
        - Thursday
        answer: Tuesday
        why: Tuesday's bar reaches 30, higher than the rest.
    - teach: The scale says what one unit on the axis means. With 1 unit = 10 children, a bar 4 units tall shows 40 children. Choose a scale so the biggest value fits on your paper.
      check:
        prompt: 'Scale: 1 unit = 20 people. A bar is 6 units tall. How many people?'
        options:
        - '120'
        - '26'
        - '60'
        answer: '120'
        why: 6 × 20 = 120.
    - teach: 'Use the bars to compare: the tallest bar is the most, the shortest the least. Subtract to find ''how many more'', and add all the bars to find the total. Every graph needs a title and labels on both axes.'
      check:
        prompt: Bars show 25 and 40. How many more is the taller one?
        options:
        - '15'
        - '65'
        - '40'
        answer: '15'
        why: 40 − 25 = 15.
  items:
  - prompt: In the library graph (Mon 20, Tue 30, Wed 15, Thu 25, Fri 10), on which day were the fewest books borrowed?
    options:
    - Friday
    - Monday
    - Wednesday
    - Tuesday
    answer: Friday
    difficulty: 1
    hints:
    - Find the shortest bar.
    - 10 is the smallest.
    solution: Friday has the shortest bar, 10.
    mistakes: {"Tuesday": "t6_fewest", "Wednesday": "t6_fewest"}
  - prompt: How many more books were borrowed on Tuesday than on Wednesday?
    answer: '15'
    check: 30 - 15
    difficulty: 1
    hints:
    - "Read the number for Tuesday and for Wednesday, then find the difference."
    - Subtract.
    solution: 30 − 15 = 15 more.
    mistakes: {"45": "t6_how_many_more", "30": "t6_how_many_more"}
  - prompt: How many books were borrowed from Monday to Friday?
    answer: '100'
    check: 20+30+15+25+10
    difficulty: 2
    hints:
    - Add all five bars.
    - 20+30+15+25+10.
    solution: 20 + 30 + 15 + 25 + 10 = 100.
    mistakes: {"20": "t6_total_bars", "90": "t6_total_bars"}
  - prompt: A bar graph has a scale of 1 unit = 5 children. A bar is 7 units tall. How many children is that?
    answer: '35'
    check: 7*5
    difficulty: 1
    hints:
    - Multiply by the scale.
    - 7 × 5.
    solution: 7 × 5 = 35 children.
    mistakes:
      '7': c6_scale
  - prompt: Which is the best scale to show values 120, 260 and 340?
    options:
    - 1 unit = 50
    - 1 unit = 1
    - 1 unit = 2
    - 1 unit = 1000
    answer: 1 unit = 50
    difficulty: 2
    hints:
    - The biggest bar should fit but not be tiny.
    - 340 ÷ 50 ≈ 7 units.
    solution: '1 unit = 50 makes the bars about 2 to 7 units tall: a good fit.'
    mistakes: {"1 unit = 1": "t6_choose_scale", "1 unit = 1000": "t6_choose_scale"}
  - prompt: What must every bar graph have?
    options:
    - A title and labelled axes
    - Bars of different widths
    - Pictures
    - Exactly five bars
    answer: A title and labelled axes
    difficulty: 2
    hints:
    - How else would the reader know what it shows?
    - Labels.
    solution: A title and labels on both axes tell the reader what the graph shows.
    mistakes: {"Pictures": "t6_bar_graph_parts", "Exactly five bars": "t6_bar_graph_parts"}
  - prompt: 'Scale: 1 unit = 10 kg. A bar reaches 4 and a half units. How many kg?'
    answer: '45'
    check: Rational(9,2)*10
    difficulty: 2
    hints:
    - 4 units = 40 kg.
    - Half a unit is half of 10.
    solution: 'Step 1: 4 × 10 = 40. Step 2: half unit = 5, so 45 kg.'
    mistakes:
      '4.5': c6m4_read
      '40': c6m4_read
  - prompt: 'Rainfall bars: June 300 mm, July 450 mm, August 350 mm. Which month had the most rain?'
    options:
    - July
    - June
    - August
    answer: July
    difficulty: 1
    hints:
    - Find the tallest bar.
    - Compare 300, 450 and 350.
    solution: 'Step 1: the largest value is 450. Step 2: that is July.'
    mistakes:
      June: c6m4_read
      August: c6m4_read
  - prompt: 'Same rainfall: how much rain fell in the three months together (in mm)?'
    answer: '1100'
    check: 300+450+350
    difficulty: 2
    hints:
    - Add the three bars.
    - 300 + 450 + 350.
    solution: 'Step 1: 300 + 450 = 750. Step 2: 750 + 350 = 1,100 mm.'
    mistakes:
      '1000': c6m4_total
      '450': c6m4_total
  - prompt: 'Same rainfall: how much more rain fell in July than in June (in mm)?'
    answer: '150'
    check: 450-300
    difficulty: 1
    hints:
    - Subtract the June bar from the July bar.
    - 450 − 300.
    solution: 'Step 1: 450 − 300. Step 2: = 150 mm more.'
    mistakes:
      '750': c6m4_diff
      '100': c6m4_diff
  - prompt: Values are 8, 14, 20 and 11. Which scale is most sensible on a small sheet?
    options:
    - 1 unit = 2
    - 1 unit = 50
    - 1 unit = 0.5
    answer: 1 unit = 2
    difficulty: 2
    hints:
    - The biggest value is 20.
    - How many units would 20 need with each scale?
    solution: 'Step 1: with 1 unit = 2, 20 needs 10 units: it fits and is easy to read. Step 2: 1 unit = 50 makes tiny bars and 0.5 needs 40 units.'
    mistakes:
      1 unit = 50: c6m4_scale
      1 unit = 0.5: c6m4_scale
  - prompt: 'Scale: 1 unit = 5 students. 35 students like music. How many units tall is the bar?'
    answer: '7'
    check: 35/5
    difficulty: 2
    hints:
    - Each unit stands for 5.
    - 35 ÷ 5.
    solution: 'Step 1: 35 ÷ 5. Step 2: = 7 units.'
    mistakes:
      '35': c6m4_read
      '5': c6m4_read
  - prompt: In a bar graph, why must all bars have the same width?
    options:
    - So only the height shows the value
    - To make it colourful
    - So the bars touch
    answer: So only the height shows the value
    difficulty: 2
    hints:
    - What do we look at to compare bars?
    - A wider bar would look bigger.
    solution: 'Step 1: we compare bars by height. Step 2: equal widths stop a wider bar from looking like more.'
    mistakes:
      To make it colourful: c6m4_read
      So the bars touch: c6m4_read
  - prompt: 'Marks bars: Asha 45, Ravi 38, Meena 45, John 30. Who scored the least?'
    options:
    - John
    - Ravi
    - Asha
    answer: John
    difficulty: 1
    hints:
    - Find the shortest bar.
    - Compare all four values.
    solution: 'Step 1: the smallest value is 30. Step 2: that is John.'
    mistakes:
      Ravi: c6m4_read
      Asha: c6m4_read
  - prompt: 'Trees planted bars: Class 6A 18, 6B 24, 6C 30. Together, how many trees?'
    answer: '72'
    check: 18+24+30
    difficulty: 2
    hints:
    - Add all three bars.
    - 18 + 24 = 42, then add 30.
    solution: 'Step 1: 18 + 24 = 42. Step 2: 42 + 30 = 72 trees.'
    mistakes:
      '62': c6m4_total
      '30': c6m4_total
