# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 2. Format: content/README.md.
subject: cbse6-math
chapter: 2
title: Lines and Angles
tips:
  c6_protractor_scale: A protractor has two scales. Start from the 0 that lies on one arm of the angle and read that same scale.
  c6_angle_types: "Compare with 90° and 180°: is 135° smaller than a right angle, or between a right angle and a straight line?"
  t6_arms: "The vertex is the corner point where they meet. The two rays reaching out from it have a body-part name."
  t6_clock_angle: "Each hour on a clock is 30° (360 ÷ 12). Count the hours between the hands."
  t6_lines_meet: "Two different straight lines can cross at most once."
  t6_one_line: "Try it with a ruler: how many different straight lines can you draw through two dots?"
  t6_ray: "A line goes on both ways and a segment stops at both ends. Which one starts at a point and goes on one way only, like a torch beam?"
  t6_right_angle: "A right angle is the corner of a square: a quarter turn."
  t6_segment: "A segment stops at both ends. A ray stops at one end. A line never stops."
  t6_straight_angle: "A straight angle is a half turn: two right angles."
  t6_vertex_middle: "In ∠PQR the middle letter names the vertex, where the arms meet."
concepts:
- code: cbse6m.lines.basics
  title: Points, lines, rays and segments
  notes: |
    A point marks a position (named with a capital letter, A). A line segment AB has two end points and a fixed length.
    A line AB goes on forever in both directions. A ray OA starts at O and goes on forever through A. Through two points
    exactly one line passes. Two different lines meet in at most one point. An angle is made by two rays from a common
    point (the vertex); the rays are its arms. Name an angle with the vertex in the middle: ∠ABC has vertex B.
  explanations:
    text: A point is just a position. Join two points and you get a line segment, which has a start and an end. A ray has one starting point and goes on forever. A line goes on forever both ways. Two rays from the same point make an angle.
    visual: 'Draw a dot A. Draw a segment from A to B with dots at both ends. Draw a ray from O with an arrow at one end. Draw a line with arrows at both ends. Then draw two rays from one dot: that is an angle.'
    step_by_step: 'Step 1: Count the end points: 2 = segment, 1 = ray, 0 = line. Step 2: For an angle, find the shared starting point: the vertex. Step 3: Name the angle with the vertex letter in the middle.'
    real_world: 'A torch beam is like a ray: it starts at the torch and goes on. A ruler''s edge between two marks is a segment. The hands of a clock make an angle at the centre.'
  picture:
    kind: geometry
    points:
      O:
      - 2
      - 2
      A:
      - 8
      - 2
      B:
      - 6
      - 7
    segments:
    - - O
      - A
    - - O
      - B
    angles:
    - at: O
      from: A
      to: B
      label: ∠AOB
    alt: Two rays OA and OB start from the vertex O and make the angle AOB.
  activity:
    type: sort
    prompt: Is it a line, a ray or a line segment? Choose for each one.
    bins:
    - Line
    - Ray
    - Line segment
    items:
    - label: Goes on forever in both directions
      bin: Line
      clue: How many ends does it have?
      why: 'No ends at all: a line.'
    - label: Has one end point and goes on forever the other way
      bin: Ray
      clue: How many ends does it have?
      why: 'One end: a ray.'
    - label: Has two end points
      bin: Line segment
      clue: Does it go on forever?
      why: 'Two ends, so it stops: a line segment.'
    - label: A torch beam shining into the sky
      bin: Ray
      why: 'It starts at the torch and goes on in one direction: a ray.'
      clue: Where does it start? Does it stop?
    - label: The edge of a ruler
      bin: Line segment
      why: 'The edge stops at both ends of the ruler: a line segment.'
      clue: Does the edge stop somewhere?
    - label: Sunlight from the Sun
      bin: Ray
      why: 'It starts at the Sun and goes outward: a ray.'
      clue: Where does it start? Does it stop?
    - label: A side of your notebook
      bin: Line segment
      why: 'It has two ends, the corners: a line segment.'
      clue: Does it have ends?
  items:
  - prompt: Which has exactly two end points?
    options:
    - A line segment
    - A ray
    - A line
    - A point
    answer: A line segment
    difficulty: 1
    hints:
    - Which one stops at both ends?
    - It has a fixed length.
    solution: A line segment has two end points.
    mistakes: {"A ray": "t6_segment", "A line": "t6_segment"}
  - prompt: Which has one end point and goes on forever in one direction?
    options:
    - A ray
    - A line segment
    - A line
    - An angle
    answer: A ray
    difficulty: 1
    hints:
    - Like a torch beam.
    - One start, no end.
    solution: A ray starts at one point and goes on forever.
    mistakes: {"A line segment": "t6_ray", "A line": "t6_ray"}
  - prompt: In ∠PQR, which point is the vertex?
    options:
    - Q
    - P
    - R
    - None of them
    answer: Q
    difficulty: 1
    hints:
    - The vertex is written in the middle.
    - ∠P-Q-R.
    solution: The middle letter, Q, is the vertex.
    mistakes: {"P": "t6_vertex_middle", "R": "t6_vertex_middle"}
  - prompt: How many lines can pass through two given points?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Try drawing more than one straight line through two dots.
    - Only one fits.
    solution: Exactly one line passes through two points.
    mistakes: {"2": "t6_one_line", "0": "t6_one_line"}
  - prompt: At most how many points can two different straight lines share?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - Lines that cross meet once.
    - Parallel lines share none.
    solution: Two different lines meet in at most one point.
    mistakes: {"2": "t6_lines_meet", "0": "t6_lines_meet"}
  - prompt: What are the two rays that make an angle called?
    options:
    - Its arms
    - Its vertices
    - Its segments
    - Its points
    answer: Its arms
    difficulty: 2
    hints:
    - They spread out from the vertex.
    - Like arms from a body.
    solution: The rays of an angle are its arms.
    mistakes: {"Its vertices": "t6_arms", "Its segments": "t6_arms"}
- code: cbse6m.lines.angles
  title: Measuring and comparing angles
  after:
  - cbse6m.lines.basics
  notes: |
    An angle measures the amount of turn between its arms, in degrees (°). A full turn is 360°, a half turn (straight
    angle) 180°, a quarter turn (right angle) 90°. Acute: less than 90°; obtuse: between 90° and 180°; reflex: more
    than 180°. Use a protractor: put its centre on the vertex, line up 0 with one arm, read where the other arm crosses,
    on the scale that starts at 0 on that arm. Perpendicular lines meet at a right angle. Clock: each hour mark is 30°.
  explanations:
    text: 'An angle tells us how much one arm has turned from the other. We measure it in degrees: a full turn is 360°, a straight line is 180° and a square corner is 90°. Angles smaller than 90° are acute; between 90° and 180° are obtuse.'
    visual: Open a book slowly. Closed is 0°. A little open is acute. Standing straight up like an L is a right angle, 90°. Wider is obtuse. Flat open is a straight angle, 180°.
    step_by_step: 'Step 1: Put the protractor''s centre point on the vertex. Step 2: Line up the 0° line with one arm. Step 3: Follow the scale that starts at 0 on that arm. Step 4: Read the number where the other arm crosses.'
    real_world: The corner of a book or door frame is a right angle. Between the hands of a clock at 3 o'clock is 90°; at 6 o'clock it is 180°.
  picture:
    kind: compare
    columns:
    - title: Acute
      points:
      - less than 90°
      - e.g. 45°
      - sharp tip
    - title: Right
      points:
      - exactly 90°
      - square corner
      - perpendicular arms
    - title: Obtuse
      points:
      - more than 90°
      - less than 180°
      - e.g. 120°
    alt: Acute angles are less than 90°, a right angle is exactly 90°, and obtuse angles are between 90° and 180°.
  activity:
    type: angle
    prompt: Turn the arm to open the angle. The number tells you how many degrees it has turned.
    goals:
    - prompt: Make a right angle, like the corner of a book.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: '180° is a straight line: two right angles. A book''s corner is half of that.'
      - when:
          degrees:
          - 45
          - 60
        say: 'That''s narrower than a book''s corner: an acute angle.'
    - prompt: Make an acute angle (less than a right angle).
      kind: acute
    - prompt: Make an obtuse angle (more than a right angle, less than a straight line).
      kind: obtuse
    - prompt: Make a straight angle.
      degrees: 180
      mistakes:
      - when:
          degrees: 90
        say: '90° is a right angle: a corner. A straight angle is two right angles, flat like a line.'
      - when:
          degrees: 360
        say: 360° is a full turn, all the way round. A straight angle is half a turn.
  items:
  - prompt: How many degrees are in a right angle?
    answer: '90'
    check: 360/4
    difficulty: 1
    hints:
    - A quarter of a full turn.
    - 360 ÷ 4.
    solution: A right angle is 90°.
    mistakes: {"180": "t6_right_angle", "45": "t6_right_angle"}
  - prompt: How many degrees are in a straight angle?
    answer: '180'
    check: 360/2
    difficulty: 1
    hints:
    - Half a full turn.
    - 360 ÷ 2.
    solution: A straight angle is 180°.
    mistakes: {"90": "t6_straight_angle", "360": "t6_straight_angle"}
  - prompt: 'An angle of 135° is:'
    options:
    - Obtuse
    - Acute
    - Right
    - Straight
    answer: Obtuse
    difficulty: 1
    hints:
    - Compare with 90° and 180°.
    - Between them.
    solution: 135° lies between 90° and 180°, so it is obtuse.
    mistakes:
      Acute: c6_angle_types
  - prompt: What angle do the hands of a clock make at 3 o'clock?
    answer: '90'
    check: 3*30
    difficulty: 1
    hints:
    - 3 hour gaps.
    - Each gap is 30°.
    solution: 3 × 30° = 90°.
    mistakes: {"3": "t6_clock_angle", "180": "t6_clock_angle"}
  - prompt: What is the smaller angle between the clock hands at 4 o'clock?
    answer: '120'
    check: 4*30
    difficulty: 2
    hints:
    - 4 hour gaps.
    - Each is 30°.
    solution: 4 × 30° = 120°.
    mistakes: {"4": "t6_clock_angle", "240": "t6_clock_angle"}
  - prompt: A protractor shows the other arm at both 50 and 130. The first arm lies on the 0 of the inner scale, which reads 130 here. What is the angle?
    options:
    - 130°
    - 50°
    - 180°
    - 80°
    answer: 130°
    difficulty: 2
    hints:
    - Use the scale that starts at 0 on the first arm.
    - That scale reads 130.
    solution: 'Read the scale whose 0 is on the first arm: 130°.'
    mistakes:
      50°: c6_protractor_scale
