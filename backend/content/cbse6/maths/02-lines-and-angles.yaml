# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 2. Format: content/README.md.
subject: cbse6-math
chapter: 2
title: Lines and Angles
tips:
  c6_protractor_scale: A protractor has two scales. Start from the 0 that lies on one arm of the angle and read that same scale.
  c6_angle_types: "Compare with 90° and 180°: is 135° smaller than a right angle, or between a right angle and a straight line?"
  t6_arms: "The vertex is the corner point where they meet. The two rays reaching out from it have a body-part name."
  t6_clock_angle: "Each hour on a clock is 30° (360 ÷ 12). Count the hours between the hands."
  t6_lines_meet: "Two different straight lines can cross at most once."
  t6_one_line: "Try it with a ruler: how many different straight lines can you draw through two dots?"
  t6_ray: "A line goes on both ways and a segment stops at both ends. Which one starts at a point and goes on one way only, like a torch beam?"
  t6_right_angle: "A right angle is the corner of a square: a quarter turn."
  t6_segment: "A segment stops at both ends. A ray stops at one end. A line never stops."
  t6_straight_angle: "A straight angle is a half turn: two right angles."
  t6_vertex_middle: "In ∠PQR the middle letter names the vertex, where the arms meet."
  c6m2_ends: 'Count the end points of each one: does it stop at two ends, one end or nowhere?'
  c6m2_name: In an angle's name the middle letter is the corner where the arms meet.
  c6m2_turn: 'Picture yourself turning on the spot. Work out what fraction of a whole turn this is.'
  c6m2_type: Compare with 90° first, then with 180°.
  c6m2_clock: Count the hour gaps between the hands, then use 30° for each gap.
  c6m2_rest: On a straight line the angles together make a half turn. Take the known part away.
  c6m2_scale: Read the scale that starts at 0 on the first arm.
concepts:
- code: cbse6m.lines.basics
  title: Points, lines, rays and segments
  notes: |
    A point marks a position (named with a capital letter, A). A line segment AB has two end points and a fixed length.
    A line AB goes on forever in both directions. A ray OA starts at O and goes on forever through A. Through two points
    exactly one line passes. Two different lines meet in at most one point. An angle is made by two rays from a common
    point (the vertex); the rays are its arms. Name an angle with the vertex in the middle: ∠ABC has vertex B.
  explanations:
    text: A point is just a position. Join two points and you get a line segment, which has a start and an end. A ray has one starting point and goes on forever. A line goes on forever both ways. Two rays from the same point make an angle.
    visual: 'Draw a dot A. Draw a segment from A to B with dots at both ends. Draw a ray from O with an arrow at one end. Draw a line with arrows at both ends. Then draw two rays from one dot: that is an angle.'
    step_by_step: 'Step 1: Count the end points: 2 = segment, 1 = ray, 0 = line. Step 2: For an angle, find the shared starting point: the vertex. Step 3: Name the angle with the vertex letter in the middle.'
    real_world: 'A torch beam is like a ray: it starts at the torch and goes on. A ruler''s edge between two marks is a segment. The hands of a clock make an angle at the centre.'
  picture:
    kind: geometry
    points:
      O:
      - 2
      - 2
      A:
      - 8
      - 2
      B:
      - 6
      - 7
    segments:
    - - O
      - A
    - - O
      - B
    angles:
    - at: O
      from: A
      to: B
      label: ∠AOB
    alt: Two rays OA and OB start from the vertex O and make the angle AOB.
  activity:
    type: sort
    prompt: Is it a line, a ray or a line segment? Choose for each one.
    bins:
    - Line
    - Ray
    - Line segment
    items:
    - label: Goes on forever in both directions
      bin: Line
      clue: How many ends does it have?
      why: 'No ends at all: a line.'
    - label: Has one end point and goes on forever the other way
      bin: Ray
      clue: How many ends does it have?
      why: 'One end: a ray.'
    - label: Has two end points
      bin: Line segment
      clue: Does it go on forever?
      why: 'Two ends, so it stops: a line segment.'
    - label: A torch beam shining into the sky
      bin: Ray
      why: 'It starts at the torch and goes on in one direction: a ray.'
      clue: Where does it start? Does it stop?
    - label: The edge of a ruler
      bin: Line segment
      why: 'The edge stops at both ends of the ruler: a line segment.'
      clue: Does the edge stop somewhere?
    - label: Sunlight from the Sun
      bin: Ray
      why: 'It starts at the Sun and goes outward: a ray.'
      clue: Where does it start? Does it stop?
    - label: A side of your notebook
      bin: Line segment
      why: 'It has two ends, the corners: a line segment.'
      clue: Does it have ends?
  lesson:
    - teach: 'A point marks a place and is named with a capital letter. A line segment AB joins A and B and stops at both: it has a length. A line goes on forever both ways. A ray starts at one point and goes on forever one way.'
      picture:
        kind: compare
        columns:
        - title: Segment AB
          points:
          - 2 end points
          - can be measured
        - title: Ray OA
          points:
          - 1 end point, O
          - goes on forever past A
        - title: Line AB
          points:
          - no end points
          - goes on forever both ways
        alt: A segment has two end points, a ray has one, a line has none.
      check:
        prompt: Which of these can you measure with a ruler?
        options:
        - A line segment
        - A ray
        - A line
        answer: A line segment
        why: Only a segment stops at both ends, so only it has a fixed length.
    - teach: Through two points only one straight line can pass. Two different lines can cross at most once. Lines that never meet, like rail tracks, are parallel.
      check:
        prompt: Two different straight lines cross. At how many points do they meet?
        options:
        - '1'
        - '2'
        - Many
        answer: '1'
        why: If they shared two points they would be the same line.
    - teach: 'An angle is two rays that start from the same point. That point is the vertex and the rays are the arms. We name the angle with the vertex in the middle: ∠ABC has vertex B, arms BA and BC.'
      picture:
        kind: geometry
        points:
          A:
          - 8
          - 5
          B:
          - 2
          - 2
          C:
          - 9
          - 2
        segments:
        - - B
          - A
        - - B
          - C
        angles:
        - at: B
          from: C
          to: A
        alt: 'Angle ABC: two arms BA and BC meet at the vertex B.'
      check:
        prompt: What are the arms of ∠XYZ?
        options:
        - YX and YZ
        - XY and XZ
        - ZX and ZY
        answer: YX and YZ
        why: The vertex is the middle letter Y, and both arms start at Y.
  items:
  - prompt: Which has exactly two end points?
    options:
    - A line segment
    - A ray
    - A line
    - A point
    answer: A line segment
    difficulty: 1
    hints:
    - Which one stops at both ends?
    - It has a fixed length.
    solution: A line segment has two end points.
    mistakes: {"A ray": "t6_segment", "A line": "t6_segment"}
  - prompt: Which has one end point and goes on forever in one direction?
    options:
    - A ray
    - A line segment
    - A line
    - An angle
    answer: A ray
    difficulty: 1
    hints:
    - Like a torch beam.
    - One start, no end.
    solution: A ray starts at one point and goes on forever.
    mistakes: {"A line segment": "t6_ray", "A line": "t6_ray"}
  - prompt: In ∠PQR, which point is the vertex?
    options:
    - Q
    - P
    - R
    - None of them
    answer: Q
    difficulty: 1
    hints:
    - The vertex is written in the middle.
    - ∠P-Q-R.
    solution: The middle letter, Q, is the vertex.
    mistakes: {"P": "t6_vertex_middle", "R": "t6_vertex_middle"}
  - prompt: How many lines can pass through two given points?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Try drawing more than one straight line through two dots.
    - Only one fits.
    solution: Exactly one line passes through two points.
    mistakes: {"2": "t6_one_line", "0": "t6_one_line"}
  - prompt: At most how many points can two different straight lines share?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - Lines that cross meet once.
    - Parallel lines share none.
    solution: Two different lines meet in at most one point.
    mistakes: {"2": "t6_lines_meet", "0": "t6_lines_meet"}
  - prompt: What are the two rays that make an angle called?
    options:
    - Its arms
    - Its vertices
    - Its segments
    - Its points
    answer: Its arms
    difficulty: 2
    hints:
    - They spread out from the vertex.
    - Like arms from a body.
    solution: The rays of an angle are its arms.
    mistakes: {"Its vertices": "t6_arms", "Its segments": "t6_arms"}
  - prompt: Which goes on forever in both directions?
    options:
    - A line
    - A ray
    - A line segment
    answer: A line
    difficulty: 1
    hints:
    - Think about where each one stops.
    - Which has no end point at all?
    solution: 'Step 1: a segment stops at two ends, a ray at one. Step 2: a line has no end points, so it goes on forever both ways.'
    mistakes:
      A ray: c6m2_ends
      A line segment: c6m2_ends
  - prompt: How many end points does ray OP have?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - A ray starts somewhere.
    - Does it stop at the other side?
    solution: 'Step 1: a ray starts at O. Step 2: it never stops past P, so it has 1 end point.'
    mistakes:
      '2': c6m2_ends
      '0': c6m2_ends
  - prompt: In ∠LMN, which point is the vertex?
    options:
    - M
    - L
    - N
    answer: M
    difficulty: 1
    hints:
    - The vertex letter sits in a special place in the name.
    - Look at the middle letter.
    solution: 'Step 1: the middle letter of the name is the vertex. Step 2: in ∠LMN that is M.'
    mistakes:
      L: c6m2_name
      N: c6m2_name
  - prompt: Which is another correct name for ∠ABC?
    options:
    - ∠CBA
    - ∠BAC
    - ∠ACB
    answer: ∠CBA
    difficulty: 2
    hints:
    - The vertex must stay in the middle.
    - You may swap the two arm letters.
    solution: 'Step 1: the vertex B must be in the middle. Step 2: swapping the ends gives ∠CBA, the same angle.'
    mistakes:
      ∠BAC: c6m2_name
      ∠ACB: c6m2_name
  - prompt: Three points A, B, C are on one straight line. How many different line segments can you name using them?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Pick any two of the three points.
    - AB, BC and one more.
    solution: 'Step 1: the pairs are AB, BC and AC. Step 2: that is 3 segments.'
    mistakes:
      '2': c6m2_ends
      '6': c6m2_ends
  - prompt: How many lines can be drawn through one single point?
    options:
    - As many as you like
    - Exactly one
    - Exactly two
    answer: As many as you like
    difficulty: 2
    hints:
    - Turn a ruler around a pin.
    - Is a second point fixed?
    solution: 'Step 1: with only one point fixed, a ruler can turn to any direction. Step 2: so endless lines pass through one point.'
    mistakes:
      Exactly one: c6m2_ends
      Exactly two: c6m2_ends
  - prompt: 'Lines on a ruled notebook page never meet however far you draw them. They are:'
    options:
    - Parallel
    - Crossing
    - Rays
    answer: Parallel
    difficulty: 1
    hints:
    - They keep the same distance apart.
    - There is a special word for lines that never meet.
    solution: 'Step 1: the lines stay the same distance apart. Step 2: lines that never meet are parallel.'
    mistakes:
      Crossing: c6m2_ends
      Rays: c6m2_ends
  - prompt: Four points, no three on a straight line. How many segments join them in pairs?
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - Each point joins the other 3.
    - Each segment gets counted twice that way.
    solution: 'Step 1: 4 points × 3 others = 12. Step 2: each segment was counted twice, so 12 ÷ 2 = 6.'
    mistakes:
      '4': c6m2_ends
      '12': c6m2_ends
  - prompt: Ray AB and ray AC point in exactly opposite directions. What do they make together?
    options:
    - A straight line through A
    - A segment BC only
    - A right angle
    answer: A straight line through A
    difficulty: 3
    hints:
    - Both start at A.
    - They go on forever in opposite ways.
    solution: 'Step 1: both rays start at A. Step 2: going forever in opposite directions, together they form a whole line (a straight angle at A).'
    mistakes:
      A segment BC only: c6m2_ends
      A right angle: c6m2_turn
- code: cbse6m.lines.angles
  title: Measuring and comparing angles
  after:
  - cbse6m.lines.basics
  notes: |
    An angle measures the amount of turn between its arms, in degrees (°). A full turn is 360°, a half turn (straight
    angle) 180°, a quarter turn (right angle) 90°. Acute: less than 90°; obtuse: between 90° and 180°; reflex: more
    than 180°. Use a protractor: put its centre on the vertex, line up 0 with one arm, read where the other arm crosses,
    on the scale that starts at 0 on that arm. Perpendicular lines meet at a right angle. Clock: each hour mark is 30°.
  explanations:
    text: 'An angle tells us how much one arm has turned from the other. We measure it in degrees: a full turn is 360°, a straight line is 180° and a square corner is 90°. Angles smaller than 90° are acute; between 90° and 180° are obtuse.'
    visual: Open a book slowly. Closed is 0°. A little open is acute. Standing straight up like an L is a right angle, 90°. Wider is obtuse. Flat open is a straight angle, 180°.
    step_by_step: 'Step 1: Put the protractor''s centre point on the vertex. Step 2: Line up the 0° line with one arm. Step 3: Follow the scale that starts at 0 on that arm. Step 4: Read the number where the other arm crosses.'
    real_world: The corner of a book or door frame is a right angle. Between the hands of a clock at 3 o'clock is 90°; at 6 o'clock it is 180°.
  picture:
    kind: compare
    columns:
    - title: Acute
      points:
      - less than 90°
      - e.g. 45°
      - sharp tip
    - title: Right
      points:
      - exactly 90°
      - square corner
      - perpendicular arms
    - title: Obtuse
      points:
      - more than 90°
      - less than 180°
      - e.g. 120°
    alt: Acute angles are less than 90°, a right angle is exactly 90°, and obtuse angles are between 90° and 180°.
  activity:
    type: angle
    prompt: Turn the arm to open the angle. The number tells you how many degrees it has turned.
    goals:
    - prompt: Make a right angle, like the corner of a book.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: '180° is a straight line: two right angles. A book''s corner is half of that.'
      - when:
          degrees:
          - 45
          - 60
        say: 'That''s narrower than a book''s corner: an acute angle.'
    - prompt: Make an acute angle (less than a right angle).
      kind: acute
    - prompt: Make an obtuse angle (more than a right angle, less than a straight line).
      kind: obtuse
    - prompt: Make a straight angle.
      degrees: 180
      mistakes:
      - when:
          degrees: 90
        say: '90° is a right angle: a corner. A straight angle is two right angles, flat like a line.'
      - when:
          degrees: 360
        say: 360° is a full turn, all the way round. A straight angle is half a turn.
  lesson:
    - teach: An angle measures how much one arm has turned from the other. A full turn is 360°. Half a turn, a straight angle, is 180°. A quarter turn, a right angle, is 90°, like the corner of a book.
      picture:
        kind: compare
        columns:
        - title: Right angle
          points:
          - quarter turn
          - 90°
        - title: Straight angle
          points:
          - half turn
          - 180°
        - title: Full turn
          points:
          - all the way round
          - 360°
        alt: A quarter turn is 90 degrees, a half turn 180 degrees, a full turn 360 degrees.
      check:
        prompt: How many right angles make a full turn?
        options:
        - '4'
        - '2'
        - '3'
        answer: '4'
        why: 360 ÷ 90 = 4.
    - teach: Angles less than 90° are acute. Between 90° and 180° they are obtuse. More than 180° but less than 360° they are reflex.
      picture:
        kind: number_line
        from: 0
        to: 360
        step: 30
        points:
        - at: 90
          label: right
        - at: 180
          label: straight
        - at: 45
          label: acute
        - at: 135
          label: obtuse
        - at: 270
          label: reflex
        alt: Acute angles are below 90, obtuse between 90 and 180, reflex between 180 and 360.
      check:
        prompt: What kind of angle is 200°?
        options:
        - Reflex
        - Obtuse
        - Acute
        answer: Reflex
        why: 200° is more than 180°.
    - teach: To measure, place the protractor's centre on the vertex and line up 0 with one arm. Read the scale that starts at 0 on that arm where the other arm crosses. On a clock each hour gap is 360 ÷ 12 = 30°.
      check:
        prompt: At 2 o'clock, what angle do the clock hands make?
        options:
        - 60°
        - 30°
        - 120°
        answer: 60°
        why: 'The hands are 2 hour gaps apart: 2 × 30° = 60°.'
  items:
  - prompt: How many degrees are in a right angle?
    answer: '90'
    check: 360/4
    difficulty: 1
    hints:
    - A quarter of a full turn.
    - 360 ÷ 4.
    solution: A right angle is 90°.
    mistakes: {"180": "t6_right_angle", "45": "t6_right_angle"}
  - prompt: How many degrees are in a straight angle?
    answer: '180'
    check: 360/2
    difficulty: 1
    hints:
    - Half a full turn.
    - 360 ÷ 2.
    solution: A straight angle is 180°.
    mistakes: {"90": "t6_straight_angle", "360": "t6_straight_angle"}
  - prompt: 'An angle of 135° is:'
    options:
    - Obtuse
    - Acute
    - Right
    - Straight
    answer: Obtuse
    difficulty: 1
    hints:
    - Compare with 90° and 180°.
    - Between them.
    solution: 135° lies between 90° and 180°, so it is obtuse.
    mistakes:
      Acute: c6_angle_types
  - prompt: What angle do the hands of a clock make at 3 o'clock?
    answer: '90'
    check: 3*30
    difficulty: 1
    hints:
    - 3 hour gaps.
    - Each gap is 30°.
    solution: 3 × 30° = 90°.
    mistakes: {"3": "t6_clock_angle", "180": "t6_clock_angle"}
  - prompt: What is the smaller angle between the clock hands at 4 o'clock?
    answer: '120'
    check: 4*30
    difficulty: 2
    hints:
    - 4 hour gaps.
    - Each is 30°.
    solution: 4 × 30° = 120°.
    mistakes: {"4": "t6_clock_angle", "240": "t6_clock_angle"}
  - prompt: A protractor shows the other arm at both 50 and 130. The first arm lies on the 0 of the inner scale, which reads 130 here. What is the angle?
    options:
    - 130°
    - 50°
    - 180°
    - 80°
    answer: 130°
    difficulty: 2
    hints:
    - Use the scale that starts at 0 on the first arm.
    - That scale reads 130.
    solution: 'Read the scale whose 0 is on the first arm: 130°.'
    mistakes:
      50°: c6_protractor_scale
  - prompt: How many degrees make a full turn?
    answer: '360'
    check: '360'
    difficulty: 1
    hints:
    - A straight angle is half of it.
    - Double 180.
    solution: 'Step 1: half a turn is 180°. Step 2: a full turn is 2 × 180° = 360°.'
    mistakes:
      '180': c6m2_turn
      '90': c6m2_turn
  - prompt: 'An angle of 45° is:'
    options:
    - Acute
    - Obtuse
    - Reflex
    answer: Acute
    difficulty: 1
    hints:
    - Compare 45 with 90.
    - Smaller than a right angle has a special name.
    solution: 'Step 1: 45° is less than 90°. Step 2: so it is acute.'
    mistakes:
      Obtuse: c6m2_type
      Reflex: c6m2_type
  - prompt: 'An angle of 300° is:'
    options:
    - Reflex
    - Obtuse
    - Straight
    answer: Reflex
    difficulty: 2
    hints:
    - Compare 300 with 180.
    - More than a half turn.
    solution: 'Step 1: 300° is more than 180° and less than 360°. Step 2: so it is reflex.'
    mistakes:
      Obtuse: c6m2_type
      Straight: c6m2_type
  - prompt: What angle do the clock hands make at 6 o'clock?
    answer: '180'
    check: 6*30
    difficulty: 2
    hints:
    - Count the hour gaps from 12 to 6.
    - Each gap is 30°.
    solution: 'Step 1: there are 6 gaps. Step 2: 6 × 30° = 180°, a straight angle.'
    mistakes:
      '6': c6m2_clock
      '90': c6m2_clock
  - prompt: What is the smaller angle between the clock hands at 5 o'clock?
    answer: '150'
    check: 5*30
    difficulty: 2
    hints:
    - Count the gaps from 12 to 5.
    - Multiply by 30.
    solution: 'Step 1: 5 gaps. Step 2: 5 × 30° = 150°.'
    mistakes:
      '120': c6m2_clock
      '180': c6m2_clock
  - prompt: Two angles sit side by side on a straight line. One is 70°. What is the other?
    answer: '110'
    check: 180-70
    difficulty: 2
    hints:
    - Together they make a straight angle.
    - Subtract 70 from 180.
    solution: 'Step 1: angles on a straight line add to 180°. Step 2: 180° − 70° = 110°.'
    mistakes:
      '20': c6m2_rest
      '290': c6m2_rest
  - prompt: You face north and turn clockwise to face east. How many degrees did you turn?
    answer: '90'
    check: '90'
    difficulty: 2
    hints:
    - North to east is a quarter of the way round.
    - A full turn is 360°.
    solution: 'Step 1: north to east is a quarter turn. Step 2: 360° ÷ 4 = 90°.'
    mistakes:
      '180': c6m2_turn
      '45': c6m2_turn
  - prompt: 'Lines that meet at a right angle are called:'
    options:
    - Perpendicular
    - Parallel
    - Reflex
    answer: Perpendicular
    difficulty: 1
    hints:
    - Think of the corner of a page.
    - It is not lines that never meet.
    solution: 'Step 1: the lines make a 90° angle. Step 2: such lines are perpendicular.'
    mistakes:
      Parallel: c6m2_type
      Reflex: c6m2_type
  - prompt: A protractor shows the other arm at 40 and 140. The first arm lies on 0 of the outer scale, which reads 40 there. What is the angle?
    options:
    - 40°
    - 140°
    - 180°
    answer: 40°
    difficulty: 3
    hints:
    - Use only the scale that is 0 on the first arm.
    - That scale reads which number at the other arm?
    solution: 'Step 1: the outer scale starts at 0 on the first arm. Step 2: it reads 40 at the other arm, so the angle is 40° (it looks acute too).'
    mistakes:
      140°: c6m2_scale
      180°: c6m2_scale
