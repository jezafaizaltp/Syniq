# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 5. Format: content/README.md.
subject: cbse6-math
chapter: 5
title: Prime Time
tips:
  c6_one_prime: 1 has only one factor (itself), so it is neither prime nor composite. Primes have exactly two factors.
  c6_div3: A number is divisible by 3 when its digit sum is divisible by 3. Add the digits first.
concepts:
- code: cbse6m.prime.factors
  title: Factors, multiples and primes
  notes: |
    A factor divides a number exactly (factors of 12: 1, 2, 3, 4, 6, 12). A multiple is a number times 1, 2, 3, ...
    (multiples of 4: 4, 8, 12, ...). Common multiples: multiples of both (of 3 and 4: 12, 24, ...). Common factors:
    factors of both. Prime: exactly two factors, 1 and itself (2, 3, 5, 7, 11, 13, ...). Composite: more than two
    factors. 1 is neither. 2 is the only even prime. Sieve of Eratosthenes: cross out multiples of 2, 3, 5, 7 to find
    primes up to 100 (there are 25). Co-prime: no common factor except 1 (8 and 15).
  explanations:
    text: 'Factors are numbers that divide exactly: 3 is a factor of 12. Multiples are what you get by counting in steps: 12 is a multiple of 3. A prime number has exactly two factors, 1 and itself, like 7. A number with more factors, like 12, is composite. 1 is neither.'
    visual: 'Make rectangles from 12 counters: 1×12, 2×6, 3×4. Each side length is a factor. With 7 counters you can only make 1×7: 7 is prime.'
    step_by_step: 'Step 1: Try dividing by 1, 2, 3, ... up to the number''s square root. Step 2: Each exact division gives a pair of factors. Step 3: If the only factors are 1 and the number, it is prime.'
    real_world: Two frogs jump on a number line, one by 3s and one by 4s. Where both land (12, 24, ...) are common multiples, like two buses that leave together again after 12 minutes.
  picture:
    kind: number_line
    from: 0
    to: 24
    step: 1
    points:
    - at: 12
      label: '12'
    - at: 24
      label: '24'
    alt: Jumps of 3 and of 4 on a number line land together at 12 and 24, the common multiples.
    jumps:
    - from: 0
      to: 3
      label: '3'
    - from: 3
      to: 6
      label: '3'
    - from: 6
      to: 9
      label: '3'
    - from: 9
      to: 12
      label: '3'
    - from: 0
      to: 4
      label: '4'
    - from: 4
      to: 8
      label: '4'
    - from: 8
      to: 12
      label: '4'
  items:
  - prompt: How many factors does 12 have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - 'List them: 1, 2, 3, 4, 6, 12.'
    - Count.
    solution: '1, 2, 3, 4, 6, 12: six factors.'
  - prompt: Which is a prime number?
    options:
    - '13'
    - '15'
    - '21'
    - '1'
    answer: '13'
    difficulty: 1
    hints:
    - A prime has exactly 2 factors.
    - 13 = 1 × 13 only.
    solution: 13 has only 1 and 13 as factors.
    mistakes:
      '1': c6_one_prime
  - prompt: What is the smallest common multiple of 3 and 4?
    answer: '12'
    check: lcm(3,4)
    difficulty: 1
    hints:
    - 'Multiples of 4: 4, 8, 12 ...'
    - Which is also a multiple of 3?
    solution: 12 is the first number in both lists.
  - prompt: What is the only even prime number?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Every other even number has 2 as a factor.
    - The smallest prime.
    solution: 2 is the only even prime.
  - prompt: How many prime numbers are there between 1 and 20?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - 2, 3, 5, 7, ...
    - Keep going to 19.
    solution: '2, 3, 5, 7, 11, 13, 17, 19: eight primes.'
  - prompt: Which pair is co-prime?
    options:
    - 8 and 15
    - 6 and 9
    - 10 and 15
    - 4 and 12
    answer: 8 and 15
    difficulty: 2
    hints:
    - 'Co-prime: only common factor is 1.'
    - 8 = 2×2×2, 15 = 3×5.
    solution: 8 and 15 share no factor except 1.
- code: cbse6m.prime.factorise
  title: Prime factorisation and divisibility
  after:
  - cbse6m.prime.factors
  notes: |
    Every composite number is a product of primes in exactly one way (order aside): 60 = 2 × 2 × 3 × 5. Use a factor
    tree. Divisibility tests: by 2 (last digit even), 3 (digit sum divisible by 3), 4 (last two digits divisible by 4),
    5 (ends in 0 or 5), 8 (last three digits divisible by 8), 9 (digit sum divisible by 9), 10 (ends in 0).
    Co-prime test via prime factors: no common prime. A number is divisible by 6 if divisible by 2 and 3.
  explanations:
    text: 'Every number can be broken into prime building blocks: 60 = 2 × 2 × 3 × 5. Draw a factor tree, splitting each number until only primes are left. Divisibility rules let you check quickly: if the digits add up to a multiple of 3, the number divides by 3.'
    visual: 'Draw 60 at the top. Branch to 6 and 10. 6 splits into 2 and 3; 10 into 2 and 5. The leaves 2, 3, 2, 5 are all prime: 60 = 2 × 2 × 3 × 5.'
    step_by_step: 'Step 1: Divide by the smallest prime that works (2, then 3, then 5 ...). Step 2: Keep dividing the answer. Step 3: Stop at 1. Step 4: Write all the primes you divided by as a product.'
    real_world: 'To check whether 1,236 sweets can be shared equally among 3 children, add 1+2+3+6 = 12: divisible by 3, so yes.'
  picture:
    kind: flow
    steps:
    - '60'
    - 60 = 2 × 30
    - 30 = 2 × 15
    - 15 = 3 × 5
    - 60 = 2 × 2 × 3 × 5
    alt: 'Factor tree for 60: divide by 2, by 2 again, then by 3, leaving 5, so 60 = 2 × 2 × 3 × 5.'
  items:
  - prompt: What is the prime factorisation of 60?
    options:
    - 2 × 2 × 3 × 5
    - 2 × 30
    - 6 × 10
    - 4 × 15
    answer: 2 × 2 × 3 × 5
    difficulty: 1
    hints:
    - All the factors must be prime.
    - Break 30, 10, 15 further.
    solution: 60 = 2 × 2 × 3 × 5, all primes.
  - prompt: Is 4,251 divisible by 3?
    options:
    - 'Yes'
    - 'No'
    - Only by 9
    - Cannot tell
    answer: 'Yes'
    difficulty: 1
    hints:
    - 'Add the digits: 4+2+5+1.'
    - 12 is divisible by 3.
    solution: Digit sum 12 is divisible by 3, so 4,251 is too.
    mistakes:
      'No': c6_div3
  - prompt: Which number is divisible by 4?
    options:
    - 3,716
    - 3,718
    - 3,714
    - 3,710
    answer: 3,716
    difficulty: 2
    hints:
    - Check the last two digits.
    - 16 ÷ 4 = 4.
    solution: The last two digits, 16, are divisible by 4.
  - prompt: 'Find the product: 2 × 2 × 2 × 3 × 3.'
    answer: '72'
    check: 2*2*2*3*3
    difficulty: 1
    hints:
    - 8 × 9.
    - Multiply.
    solution: 8 × 9 = 72.
  - prompt: 'A number is divisible by 2 and by 3. It must also be divisible by:'
    options:
    - '6'
    - '5'
    - '9'
    - '12'
    answer: '6'
    difficulty: 2
    hints:
    - 2 × 3.
    - 2 and 3 are co-prime.
    solution: Divisible by co-primes 2 and 3 means divisible by 6.
  - prompt: What is the largest prime factor of 84?
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - 84 = 2 × 2 × 3 × 7.
    - Pick the biggest.
    solution: 84 = 2 × 2 × 3 × 7, so the largest prime factor is 7.
