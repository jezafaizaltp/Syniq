# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 10. Format: content/README.md.
subject: cbse6-math
chapter: 10
title: The Other Side of Zero
tips:
  c6_neg_compare: On the number line, numbers get smaller as you go left. −8 is further left than −3, so −8 is smaller.
  c6_sub_neg: 'Subtracting a negative number is the same as adding its positive: 5 − (−3) = 5 + 3.'
  t6_add_negative: "Adding −5 means moving 5 to the left from 3."
  t6_debt_negative: "Money earned is +. A debt is the opposite sign."
  t6_lift_down: "Start at 2 and count down 5 floors, through 0."
  t6_negatives_add: "Two moves to the left: you go further below zero."
  t6_opposite: "The opposite is the same distance from 0 on the other side."
  t6_order_integers: "On a number line, numbers further left are smaller. −5 is further left than −1."
  t6_rise_up: "Rising means moving towards 0. Start at −200 and go up 50."
  t6_subtract_past_zero: "Start at 2 and move 7 to the left."
  t6_temp_rise: "Subtract the starting temperature from the new one."
  t6_zero_pair: "A number and its opposite cancel each other."
  c6m10_left: On the number line, the number further to the left is the smaller one, even if its digits look bigger.
  c6m10_move: Adding a positive moves right; adding a negative moves left. Count the steps on the line.
  c6m10_pairs: Pair each + with a − and cancel them. What is left over is the answer.
  c6m10_minusneg: Taking away a negative is the same as adding the positive.
  c6m10_zero: Count the steps down to zero first, then the steps past zero.
  c6m10_sign: 'Decide first: is this above or below zero, a gain or a loss?'
concepts:
- code: cbse6m.int.meaning
  title: Negative numbers and the number line
  notes: |
    Integers: ..., −3, −2, −1, 0, 1, 2, 3, ... Negative numbers are below zero: floors below ground in a building (−1,
    −2), temperatures below 0°C, debts (₹−50), depths below sea level. On a number line, positive numbers are right of
    0, negative left; a number is greater than every number to its left. Opposites: 5 and −5 are the same distance
    from 0 (5 + (−5) = 0). The Bhāskarāchārya / Brahmagupta writings called positive numbers 'fortunes' and negative
    'debts'.
  explanations:
    text: 'Numbers can go below zero. A lift goes to floor −1 (one below ground). A cold place can be −5°C. On a number line, negative numbers sit to the left of 0. The further left, the smaller: −8 is less than −3.'
    visual: 'Draw a number line from −5 to 5. Put 0 in the middle. Mark −3: three steps left. Mark 2: two steps right. 2 is to the right of −3, so 2 is greater.'
    step_by_step: 'Step 1: Place both numbers on a number line. Step 2: The one further right is greater. Step 3: Remember: every negative number is less than 0 and every positive number.'
    real_world: In Leh in winter the temperature can fall to −15°C. A building's basement parking is often floor −1 or −2.
  picture:
    kind: number_line
    from: -5
    to: 5
    step: 1
    points:
    - at: -3
      label: −3
    - at: 0
      label: '0'
    - at: 2
      label: '2'
    alt: A number line from −5 to 5 marking −3, 0 and 2. Numbers to the right are greater.
  activity:
    type: number_line
    min: -10
    max: 10
    step: 1
    start: 0
    prompt: Numbers left of zero are negative. Move the marker.
    goals:
    - prompt: It is 3 degrees below zero in Leh. Put the marker on −3.
      target: -3
      mistakes:
      - when:
          v: 3
        say: +3 is 3 degrees above zero, a warm-ish winter day. Below zero means the other side of 0.
    - prompt: 'Which is colder: −7 or −2? Put the marker on the colder one.'
      target: -7
      hint: Further left is smaller, so colder.
      mistakes:
      - when:
          v: -2
        say: −2 is closer to 0, so it is warmer than −7. Further left means colder.
  lesson:
    - teach: 'Numbers below zero are negative: −1, −2, −3. We use them for floors below the ground, temperatures below 0 °C, money owed, and depths below sea level. Positive numbers, zero and negative numbers together are integers.'
      picture:
        kind: number_line
        from: -5
        to: 5
        step: 1
        points:
        - at: -3
          label: basement 3
        - at: 0
          label: ground
        - at: 4
          label: floor 4
        alt: 'A number line from −5 to 5: basement floors are negative, ground is 0, upper floors positive.'
      check:
        prompt: A diver is 12 m below sea level. How do we write this?
        options:
        - −12 m
        - +12 m
        - 12 m up
        answer: −12 m
        why: Below sea level is the negative side.
    - teach: 'On a number line, numbers grow to the right. So any number is bigger than every number to its left: −2 > −7 because −2 is further right. Every positive number is bigger than every negative number.'
      check:
        prompt: Which is bigger, −1 or −10?
        options:
        - −1
        - −10
        - They are equal
        answer: −1
        why: −1 is closer to zero, further right on the line.
    - teach: 'Opposites are the same distance from 0 on different sides: 6 and −6. A number and its opposite add to 0, like earning ₹6 and spending ₹6.'
      check:
        prompt: What must you add to −9 to get 0?
        options:
        - '9'
        - −9
        - '0'
        answer: '9'
        why: 9 is the opposite of −9, and opposites add to 0.
  items:
  - prompt: Which is smaller, −8 or −3?
    options:
    - −8
    - −3
    - They are equal
    - Cannot tell
    answer: −8
    difficulty: 1
    hints:
    - Place them on a number line.
    - Which is further left?
    solution: −8 is further left, so it is smaller.
    mistakes:
      −3: c6_neg_compare
  - prompt: A lift is at floor 2. It goes down 5 floors. Which floor is it on now?
    answer: '-3'
    check: 2 - 5
    difficulty: 1
    hints:
    - Count 5 steps left from 2.
    - 2 − 5.
    solution: '2 − 5 = −3: three floors below ground.'
    mistakes: {"3": "t6_lift_down", "7": "t6_lift_down"}
  - prompt: What is the opposite of 7?
    answer: '-7'
    check: '-7'
    difficulty: 1
    hints:
    - Same distance from 0.
    - Other side.
    solution: The opposite of 7 is −7.
    mistakes: {"7": "t6_opposite", "0": "t6_opposite"}
  - prompt: The temperature is −4°C. It rises by 6°C. What is it now (in °C)?
    answer: '2'
    check: -4 + 6
    difficulty: 2
    hints:
    - Start at −4, move 6 right.
    - −4 + 6.
    solution: −4 + 6 = 2°C.
    mistakes: {"10": "t6_temp_rise", "-10": "t6_temp_rise"}
  - prompt: 'Arrange from smallest to largest: 3, −1, 0, −5'
    options:
    - −5, −1, 0, 3
    - −1, −5, 0, 3
    - 0, −1, −5, 3
    - 3, 0, −1, −5
    answer: −5, −1, 0, 3
    difficulty: 2
    hints:
    - Leftmost first.
    - −5 is furthest left.
    solution: 'On the number line: −5, −1, 0, 3.'
    mistakes: {"−1, −5, 0, 3": "t6_order_integers", "3, 0, −1, −5": "t6_order_integers"}
  - prompt: 'If ₹100 earned is written +100, then a debt of ₹40 is written:'
    options:
    - −40
    - '+40'
    - '40'
    - −140
    answer: −40
    difficulty: 1
    hints:
    - Debt is the opposite of earning.
    - Use the minus sign.
    solution: 'A debt is written as a negative number: −40.'
    mistakes: {"+40": "t6_debt_negative", "−140": "t6_debt_negative"}
  - prompt: Which is greater, −15 or −2?
    answer: '-2'
    check: '-2'
    difficulty: 1
    hints:
    - Picture both on the number line.
    - Which one is further to the right?
    solution: 'Step 1: −2 is closer to zero. Step 2: so −2 is to the right of −15 and is greater.'
    mistakes:
      '-15': c6m10_left
  - prompt: 'Arrange from largest to smallest: −4, 2, −7, 0'
    options:
    - 2, 0, −4, −7
    - −7, −4, 0, 2
    - 2, 0, −7, −4
    answer: 2, 0, −4, −7
    difficulty: 2
    hints:
    - Start with the number furthest right.
    - Among negatives, the one closest to zero is biggest.
    solution: 'Step 1: 2 is largest, then 0. Step 2: −4 is right of −7, so 2, 0, −4, −7.'
    mistakes:
      −7, −4, 0, 2: c6m10_left
      2, 0, −7, −4: c6m10_left
  - prompt: Leh is −8 °C and Chennai is 30 °C. Which city is colder?
    options:
    - Leh
    - Chennai
    - Both are equally cold
    answer: Leh
    difficulty: 1
    hints:
    - Colder means lower temperature.
    - Any negative is below any positive.
    solution: 'Step 1: −8 is less than 30. Step 2: so Leh is colder.'
    mistakes:
      Chennai: c6m10_left
      Both are equally cold: c6m10_left
  - prompt: A lift is at floor −2. It goes up 5 floors. Which floor is it on?
    answer: '3'
    check: -2+5
    difficulty: 2
    hints:
    - Going up means moving right on the line.
    - Count 2 steps to ground, then the rest.
    solution: 'Step 1: from −2, two floors up reaches 0. Step 2: 3 more floors reaches floor 3.'
    mistakes:
      '7': c6m10_zero
      '-7': c6m10_zero
  - prompt: How many integers are there between −3 and 3 (not counting −3 and 3)?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - 'List them: −2, −1, ...'
    - Don't forget zero.
    solution: 'Step 1: −2, −1, 0, 1, 2. Step 2: that is 5 integers.'
    mistakes:
      '4': c6m10_zero
      '6': c6m10_zero
  - prompt: A shop gains ₹300 on Monday and loses ₹500 on Tuesday. How is Tuesday written?
    options:
    - −500
    - '+500'
    - −200
    answer: −500
    difficulty: 1
    hints:
    - A gain is written with +.
    - What sign does a loss get?
    solution: 'Step 1: gains are positive. Step 2: so a loss of ₹500 is −500.'
    mistakes:
      '+500': c6m10_sign
      −200: c6m10_sign
  - prompt: Which integer is 4 less than −6?
    answer: '-10'
    check: -6-4
    difficulty: 2
    hints:
    - Less means move left.
    - Move 4 steps left from −6.
    solution: 'Step 1: start at −6. Step 2: 4 steps left reaches −10.'
    mistakes:
      '-2': c6m10_left
      '2': c6m10_left
  - prompt: What is the opposite of −13?
    answer: '13'
    check: '13'
    difficulty: 1
    hints:
    - Same distance from zero.
    - Other side of zero.
    solution: 'Step 1: −13 is 13 steps left of 0. Step 2: its opposite is 13 steps right: 13.'
    mistakes:
      '-13': c6m10_sign
      '0': c6m10_sign
  - prompt: A bird flies 6 m above the sea and a fish swims 4 m below. How far apart are they up and down (in m)?
    answer: '10'
    check: 6-(-4)
    difficulty: 3
    hints:
    - Write the bird as +6 and the fish as −4.
    - Count from −4 up to 6.
    solution: 'Step 1: from −4 to 0 is 4 m. Step 2: from 0 to 6 is 6 m, so 10 m apart.'
    mistakes:
      '2': c6m10_zero
      '-2': c6m10_zero
- code: cbse6m.int.ops
  title: Adding and subtracting integers
  after:
  - cbse6m.int.meaning
  notes: |
    Adding a positive number: move right; adding a negative: move left. 3 + (−5) = −2. A number plus its opposite is 0
    (zero pair): use + and − tokens; cancel pairs. Subtracting: moving the other way. Subtracting a negative = adding a
    positive: 5 − (−3) = 8. Subtracting a positive = adding a negative: 2 − 7 = 2 + (−7) = −5. Building lift game:
    start floor + movement = new floor. Order does not matter in addition: (−4) + 6 = 6 + (−4).
  explanations:
    text: 'Adding a positive number moves you right on the number line; adding a negative moves you left. Positive and negative tokens cancel in pairs: +1 and −1 make 0. Taking away a negative is the same as adding a positive: 5 − (−3) = 8.'
    visual: 'Use tokens: + is green, − is red. For 3 + (−5), put 3 green and 5 red. Cancel 3 pairs. 2 red are left: −2.'
    step_by_step: 'Step 1: Write each number as tokens. Step 2: For addition, put them together. Step 3: Cancel +/− pairs. Step 4: Count what is left. Step 5: For subtracting a negative, change it to adding the positive.'
    real_world: 'A submarine at −200 m rises 50 m: −200 + 50 = −150 m. A shopkeeper who loses ₹30 and then earns ₹50 is ₹20 up.'
  picture:
    kind: number_line
    from: -3
    to: 4
    step: 1
    points:
    - at: 3
      label: '3'
    - at: -2
      label: −2
    alt: Adding −5 to 3 is a jump of 5 to the left, landing on −2.
    jumps:
    - from: 3
      to: -2
      label: +(−5)
  activity:
    type: number_line
    min: -10
    max: 10
    step: 1
    start: -2
    prompt: Adding moves right, subtracting moves left. The marker starts at −2.
    goals:
    - prompt: 'Work out −2 + 5: move the marker 5 steps right.'
      target: 3
      mistakes:
      - when:
          v: -7
        say: '−7 is −2 − 5: you moved left. Adding 5 moves 5 steps right.'
    - prompt: 'Now 3 − 7: from 3, move 7 steps left.'
      target: -4
      mistakes:
      - when:
          v: 10
        say: 'That''s 3 + 7: you moved right. Subtracting 7 moves left, past 0.'
    - prompt: 'Now −4 − (−6): taking away a negative is the same as adding. Where do you land?'
      target: 2
      hint: −4 − (−6) = −4 + 6.
      mistakes:
      - when:
          v: -10
        say: 'That''s −4 − 6: you moved left. But taking away −6 (a debt) leaves you better off: move right.'
  lesson:
    - teach: 'To add on a number line, start at the first number. Adding a positive number moves right; adding a negative number moves left. 2 + (−5): start at 2, move 5 left, land on −3.'
      picture:
        kind: number_line
        from: -5
        to: 5
        step: 1
        jumps:
        - from: 2
          to: -3
          label: +(−5)
        alt: Starting at 2 and jumping 5 steps left lands on −3.
      check:
        prompt: What is −1 + 4?
        options:
        - '3'
        - −5
        - '5'
        answer: '3'
        why: 'Start at −1 and move 4 right: 0, 1, 2, 3.'
    - teach: 'Tokens help: + and − tokens cancel in pairs (a zero pair). For 5 + (−8), pair 5 pluses with 5 minuses; 3 minuses are left, so the answer is −3.'
      picture:
        kind: compare
        columns:
        - title: 5 + (−8)
          points:
          - + + + + +
          - − − − − − − − −
        - title: Cancel 5 pairs
          points:
          - 3 minuses left
          - = −3
        alt: '5 plus tokens and 8 minus tokens cancel in 5 pairs, leaving 3 minus tokens: the answer is −3.'
      check:
        prompt: What is (−6) + 6?
        options:
        - '0'
        - '12'
        - −12
        answer: '0'
        why: Six zero pairs cancel completely.
    - teach: 'Subtracting is moving the opposite way. 3 − 7 = 3 + (−7) = −4. Taking away a negative is adding a positive: 4 − (−2) = 4 + 2 = 6, like a debt being removed.'
      check:
        prompt: What is −2 − (−5)?
        options:
        - '3'
        - −7
        - −3
        answer: '3'
        why: −2 − (−5) = −2 + 5 = 3.
  items:
  - prompt: Find 3 + (−5).
    answer: '-2'
    check: 3 + (-5)
    difficulty: 1
    hints:
    - Start at 3, move 5 left.
    - Cancel 3 pairs.
    solution: 3 + (−5) = −2.
    mistakes: {"8": "t6_add_negative", "2": "t6_add_negative"}
  - prompt: Find (−4) + (−6).
    answer: '-10'
    check: -4 + -6
    difficulty: 1
    hints:
    - Both move left.
    - 4 + 6 steps left.
    solution: (−4) + (−6) = −10.
    mistakes: {"10": "t6_negatives_add", "2": "t6_negatives_add"}
  - prompt: Find 5 − (−3).
    answer: '8'
    check: 5 - (-3)
    difficulty: 2
    hints:
    - Subtracting a negative is adding a positive.
    - 5 + 3.
    solution: 5 − (−3) = 5 + 3 = 8.
    mistakes:
      '2': c6_sub_neg
  - prompt: Find 2 − 7.
    answer: '-5'
    check: 2 - 7
    difficulty: 1
    hints:
    - Move 7 left from 2.
    - 2 + (−7).
    solution: 2 − 7 = −5.
    mistakes: {"5": "t6_subtract_past_zero", "9": "t6_subtract_past_zero"}
  - prompt: Find (−7) + 7.
    answer: '0'
    check: -7 + 7
    difficulty: 1
    hints:
    - A number and its opposite.
    - Zero pairs.
    solution: (−7) + 7 = 0.
    mistakes: {"14": "t6_zero_pair", "-14": "t6_zero_pair"}
  - prompt: A submarine is at −200 m. It rises 50 m. What is its new position (in m)?
    answer: '-150'
    check: -200 + 50
    difficulty: 2
    hints:
    - Rising means adding.
    - −200 + 50.
    solution: −200 + 50 = −150 m.
    mistakes: {"-250": "t6_rise_up", "150": "t6_rise_up"}
  - prompt: Find (−9) + 4.
    answer: '-5'
    check: -9+4
    difficulty: 1
    hints:
    - Start at −9 and move right.
    - Move 4 steps.
    solution: 'Step 1: start at −9. Step 2: 4 steps right reaches −5.'
    mistakes:
      '5': c6m10_move
      '-13': c6m10_move
  - prompt: Find (−3) + (−8).
    answer: '-11'
    check: -3-8
    difficulty: 1
    hints:
    - 'Both are negative: keep moving left.'
    - 3 + 8 steps left of zero.
    solution: 'Step 1: start at −3. Step 2: move 8 left to −11.'
    mistakes:
      '11': c6m10_move
      '-5': c6m10_move
  - prompt: Find 6 − (−4).
    answer: '10'
    check: 6-(-4)
    difficulty: 2
    hints:
    - Taking away a negative...
    - '...is adding the positive.'
    solution: 'Step 1: 6 − (−4) = 6 + 4. Step 2: = 10.'
    mistakes:
      '2': c6m10_minusneg
      '-10': c6m10_minusneg
  - prompt: Find 4 − 11.
    answer: '-7'
    check: 4-11
    difficulty: 1
    hints:
    - Count down 4 to reach zero.
    - Then the rest of the 11 steps past zero.
    solution: 'Step 1: 4 steps take you to 0. Step 2: 7 more steps left reach −7.'
    mistakes:
      '7': c6m10_zero
      '-15': c6m10_zero
  - prompt: Find (−5) − 3.
    answer: '-8'
    check: -5-3
    difficulty: 2
    hints:
    - Subtracting a positive moves left.
    - From −5, move 3 left.
    solution: 'Step 1: −5 − 3 = −5 + (−3). Step 2: = −8.'
    mistakes:
      '-2': c6m10_move
      '8': c6m10_move
  - prompt: Find (−7) − (−10).
    answer: '3'
    check: -7-(-10)
    difficulty: 3
    hints:
    - Change − (−10) into + 10.
    - −7 + 10.
    solution: 'Step 1: −7 − (−10) = −7 + 10. Step 2: = 3.'
    mistakes:
      '-17': c6m10_minusneg
      '-3': c6m10_minusneg
  - prompt: The morning temperature is −3 °C. By noon it is 5 °C. By how many degrees did it rise?
    answer: '8'
    check: 5-(-3)
    difficulty: 2
    hints:
    - Count from −3 up to 0.
    - Then from 0 up to 5.
    solution: 'Step 1: −3 to 0 is 3 degrees. Step 2: 0 to 5 is 5 more, so 8 degrees.'
    mistakes:
      '2': c6m10_zero
      '-8': c6m10_zero
  - prompt: Using tokens, 7 pluses and 10 minuses are put together. What number is left after cancelling?
    answer: '-3'
    check: 7-10
    difficulty: 2
    hints:
    - Make zero pairs.
    - How many minuses have no partner?
    solution: 'Step 1: 7 zero pairs cancel. Step 2: 3 minuses are left, so −3.'
    mistakes:
      '3': c6m10_pairs
      '17': c6m10_pairs
  - prompt: Ravi has ₹20 and owes ₹35. If he pays what he can, what is his money position?
    options:
    - −₹15
    - ₹15
    - −₹55
    answer: −₹15
    difficulty: 3
    hints:
    - Write it as 20 + (−35).
    - Which is bigger, what he has or what he owes?
    solution: 'Step 1: 20 + (−35). Step 2: 20 pairs cancel, 15 owed remain: −₹15.'
    mistakes:
      ₹15: c6m10_sign
      −₹55: c6m10_move
