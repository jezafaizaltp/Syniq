# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 10. Format: content/README.md.
subject: cbse6-math
chapter: 10
title: The Other Side of Zero
tips:
  c6_neg_compare: On the number line, numbers get smaller as you go left. −8 is further left than −3, so −8 is smaller.
  c6_sub_neg: 'Subtracting a negative number is the same as adding its positive: 5 − (−3) = 5 + 3.'
concepts:
- code: cbse6m.int.meaning
  title: Negative numbers and the number line
  notes: |
    Integers: ..., −3, −2, −1, 0, 1, 2, 3, ... Negative numbers are below zero: floors below ground in a building (−1,
    −2), temperatures below 0°C, debts (₹−50), depths below sea level. On a number line, positive numbers are right of
    0, negative left; a number is greater than every number to its left. Opposites: 5 and −5 are the same distance
    from 0 (5 + (−5) = 0). The Bhāskarāchārya / Brahmagupta writings called positive numbers 'fortunes' and negative
    'debts'.
  explanations:
    text: 'Numbers can go below zero. A lift goes to floor −1 (one below ground). A cold place can be −5°C. On a number line, negative numbers sit to the left of 0. The further left, the smaller: −8 is less than −3.'
    visual: 'Draw a number line from −5 to 5. Put 0 in the middle. Mark −3: three steps left. Mark 2: two steps right. 2 is to the right of −3, so 2 is greater.'
    step_by_step: 'Step 1: Place both numbers on a number line. Step 2: The one further right is greater. Step 3: Remember: every negative number is less than 0 and every positive number.'
    real_world: In Leh in winter the temperature can fall to −15°C. A building's basement parking is often floor −1 or −2.
  picture:
    kind: number_line
    from: -5
    to: 5
    step: 1
    points:
    - at: -3
      label: −3
    - at: 0
      label: '0'
    - at: 2
      label: '2'
    alt: A number line from −5 to 5 marking −3, 0 and 2. Numbers to the right are greater.
  activity:
    type: number_line
    min: -10
    max: 10
    step: 1
    start: 0
    prompt: Numbers left of zero are negative. Move the marker.
    goals:
    - prompt: It is 3 degrees below zero in Leh. Put the marker on −3.
      target: -3
      mistakes:
      - when:
          v: 3
        say: +3 is 3 degrees above zero, a warm-ish winter day. Below zero means the other side of 0.
    - prompt: 'Which is colder: −7 or −2? Put the marker on the colder one.'
      target: -7
      hint: Further left is smaller, so colder.
      mistakes:
      - when:
          v: -2
        say: −2 is closer to 0, so it is warmer than −7. Further left means colder.
  items:
  - prompt: Which is smaller, −8 or −3?
    options:
    - −8
    - −3
    - They are equal
    - Cannot tell
    answer: −8
    difficulty: 1
    hints:
    - Place them on a number line.
    - Which is further left?
    solution: −8 is further left, so it is smaller.
    mistakes:
      −3: c6_neg_compare
  - prompt: A lift is at floor 2. It goes down 5 floors. Which floor is it on now?
    answer: '-3'
    check: 2 - 5
    difficulty: 1
    hints:
    - Count 5 steps left from 2.
    - 2 − 5.
    solution: '2 − 5 = −3: three floors below ground.'
  - prompt: What is the opposite of 7?
    answer: '-7'
    check: '-7'
    difficulty: 1
    hints:
    - Same distance from 0.
    - Other side.
    solution: The opposite of 7 is −7.
  - prompt: The temperature is −4°C. It rises by 6°C. What is it now (in °C)?
    answer: '2'
    check: -4 + 6
    difficulty: 2
    hints:
    - Start at −4, move 6 right.
    - −4 + 6.
    solution: −4 + 6 = 2°C.
  - prompt: 'Arrange from smallest to largest: 3, −1, 0, −5'
    options:
    - −5, −1, 0, 3
    - −1, −5, 0, 3
    - 0, −1, −5, 3
    - 3, 0, −1, −5
    answer: −5, −1, 0, 3
    difficulty: 2
    hints:
    - Leftmost first.
    - −5 is furthest left.
    solution: 'On the number line: −5, −1, 0, 3.'
  - prompt: 'If ₹100 earned is written +100, then a debt of ₹40 is written:'
    options:
    - −40
    - '+40'
    - '40'
    - −140
    answer: −40
    difficulty: 1
    hints:
    - Debt is the opposite of earning.
    - Use the minus sign.
    solution: 'A debt is written as a negative number: −40.'
- code: cbse6m.int.ops
  title: Adding and subtracting integers
  after:
  - cbse6m.int.meaning
  notes: |
    Adding a positive number: move right; adding a negative: move left. 3 + (−5) = −2. A number plus its opposite is 0
    (zero pair): use + and − tokens; cancel pairs. Subtracting: moving the other way. Subtracting a negative = adding a
    positive: 5 − (−3) = 8. Subtracting a positive = adding a negative: 2 − 7 = 2 + (−7) = −5. Building lift game:
    start floor + movement = new floor. Order does not matter in addition: (−4) + 6 = 6 + (−4).
  explanations:
    text: 'Adding a positive number moves you right on the number line; adding a negative moves you left. Positive and negative tokens cancel in pairs: +1 and −1 make 0. Taking away a negative is the same as adding a positive: 5 − (−3) = 8.'
    visual: 'Use tokens: + is green, − is red. For 3 + (−5), put 3 green and 5 red. Cancel 3 pairs. 2 red are left: −2.'
    step_by_step: 'Step 1: Write each number as tokens. Step 2: For addition, put them together. Step 3: Cancel +/− pairs. Step 4: Count what is left. Step 5: For subtracting a negative, change it to adding the positive.'
    real_world: 'A submarine at −200 m rises 50 m: −200 + 50 = −150 m. A shopkeeper who loses ₹30 and then earns ₹50 is ₹20 up.'
  picture:
    kind: number_line
    from: -3
    to: 4
    step: 1
    points:
    - at: 3
      label: '3'
    - at: -2
      label: −2
    alt: Adding −5 to 3 is a jump of 5 to the left, landing on −2.
    jumps:
    - from: 3
      to: -2
      label: +(−5)
  activity:
    type: number_line
    min: -10
    max: 10
    step: 1
    start: -2
    prompt: Adding moves right, subtracting moves left. The marker starts at −2.
    goals:
    - prompt: 'Work out −2 + 5: move the marker 5 steps right.'
      target: 3
      mistakes:
      - when:
          v: -7
        say: '−7 is −2 − 5: you moved left. Adding 5 moves 5 steps right.'
    - prompt: 'Now 3 − 7: from 3, move 7 steps left.'
      target: -4
      mistakes:
      - when:
          v: 10
        say: 'That''s 3 + 7: you moved right. Subtracting 7 moves left, past 0.'
    - prompt: 'Now −4 − (−6): taking away a negative is the same as adding. Where do you land?'
      target: 2
      hint: −4 − (−6) = −4 + 6.
      mistakes:
      - when:
          v: -10
        say: 'That''s −4 − 6: you moved left. But taking away −6 (a debt) leaves you better off: move right.'
  items:
  - prompt: Find 3 + (−5).
    answer: '-2'
    check: 3 + (-5)
    difficulty: 1
    hints:
    - Start at 3, move 5 left.
    - Cancel 3 pairs.
    solution: 3 + (−5) = −2.
  - prompt: Find (−4) + (−6).
    answer: '-10'
    check: -4 + -6
    difficulty: 1
    hints:
    - Both move left.
    - 4 + 6 steps left.
    solution: (−4) + (−6) = −10.
  - prompt: Find 5 − (−3).
    answer: '8'
    check: 5 - (-3)
    difficulty: 2
    hints:
    - Subtracting a negative is adding a positive.
    - 5 + 3.
    solution: 5 − (−3) = 5 + 3 = 8.
    mistakes:
      '2': c6_sub_neg
  - prompt: Find 2 − 7.
    answer: '-5'
    check: 2 - 7
    difficulty: 1
    hints:
    - Move 7 left from 2.
    - 2 + (−7).
    solution: 2 − 7 = −5.
  - prompt: Find (−7) + 7.
    answer: '0'
    check: -7 + 7
    difficulty: 1
    hints:
    - A number and its opposite.
    - Zero pairs.
    solution: (−7) + 7 = 0.
  - prompt: A submarine is at −200 m. It rises 50 m. What is its new position (in m)?
    answer: '-150'
    check: -200 + 50
    difficulty: 2
    hints:
    - Rising means adding.
    - −200 + 50.
    solution: −200 + 50 = −150 m.
