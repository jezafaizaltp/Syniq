# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 6. Format: content/README.md.
subject: cbse6-math
chapter: 6
title: Perimeter and Area
tips:
  c6_perim_area: Perimeter is the distance around (add the sides, in cm). Area is the space inside (length × breadth, in square cm).
  c6_perim_rect: 'A rectangle has two lengths and two breadths: perimeter = 2 × (length + breadth), not length + breadth.'
  t6_breadth: "Area = length × breadth, so breadth = area ÷ length."
  t6_half_rectangle: "A diagonal cuts the rectangle into two equal triangles. Find the rectangle's area, then halve."
  t6_hexagon_perimeter: "A hexagon has 6 equal sides."
  t6_rounds: "Find the perimeter of the park (2 × (150 + 80)), then multiply by the 3 rounds."
  t6_side_from_perimeter: "A square's 4 sides are equal. Divide the perimeter by 4."
  t6_square_area: "Area of a square = side × side."
  t6_square_perimeter: "A square has 4 equal sides. Perimeter = 4 × side."
  t6_tiles_area: "Number of tiles = floor area ÷ area of one tile."
  t6_triangle_perimeter: "Perimeter = add all three sides."
  c6m6_around: 'Perimeter is the walk all the way round: add every side, not just two.'
  c6m6_inside: Area counts the squares that cover the inside, so multiply length by breadth.
  c6m6_mix: 'Check what is asked: the boundary (perimeter) or the surface covered (area).'
  c6m6_back: 'Work backwards: undo the formula one step at a time.'
  c6m6_units: Change everything to the same unit before you calculate.
  c6m6_half: Count full squares as 1, more-than-half as 1, exactly half as ½, less than half as 0.
concepts:
- code: cbse6m.pa.perimeter
  title: Perimeter
  notes: |
    Perimeter = total length of the boundary of a closed figure. Rectangle: 2 × (length + breadth). Square: 4 × side.
    Triangle: sum of three sides. Regular polygon: number of sides × side length. Units: cm, m. Running around a
    rectangular park of 150 m × 80 m once covers 2 × 230 = 460 m. Shapes with the same perimeter can have different
    areas.
  explanations:
    text: 'Perimeter is the distance all the way around a shape. Walk along every edge and add the lengths. For a rectangle, that is two lengths and two breadths: 2 × (length + breadth). For a square, 4 × side.'
    visual: 'Draw a rectangle 6 cm long and 4 cm wide. Trace around it with your finger: 6, then 4, then 6, then 4. Total 20 cm.'
    step_by_step: 'Step 1: List every side length. Step 2: Make sure all are in the same unit. Step 3: Add them, or use 2 × (l + b) for a rectangle and 4 × side for a square.'
    real_world: Putting a fence around a garden or lace around a tablecloth needs the perimeter.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 2
      B:
      - 9
      - 2
      C:
      - 9
      - 7
      D:
      - 1
      - 7
    segments:
    - - A
      - B
      - 6 cm
    - - B
      - C
      - 4 cm
    - - C
      - D
      - 6 cm
    - - D
      - A
      - 4 cm
    alt: A rectangle ABCD with sides 6 cm, 4 cm, 6 cm and 4 cm; its perimeter is 20 cm.
  activity:
    type: rectangle
    max_side: 10
    prompt: Change the width and height. The perimeter is the distance all the way round.
    goals:
    - prompt: Make a rectangle with a perimeter of 14 units.
      perimeter: 14
    - prompt: Make one 4 units wide with a perimeter of 20.
      width: 4
      perimeter: 20
  lesson:
    - teach: 'Perimeter is the length of the boundary of a closed shape: the distance you walk to go once around it. For any shape, add the lengths of all its sides.'
      picture:
        kind: geometry
        points:
          A:
          - 1
          - 2
          B:
          - 8
          - 2
          C:
          - 8
          - 6
          D:
          - 1
          - 6
        segments:
        - - A
          - B
          - 7 cm
        - - B
          - C
          - 4 cm
        - - C
          - D
          - 7 cm
        - - D
          - A
          - 4 cm
        alt: A rectangle 7 cm long and 4 cm wide; going round is 7 + 4 + 7 + 4 = 22 cm.
      check:
        prompt: A triangle has sides 4 cm, 7 cm and 9 cm. What is its perimeter?
        options:
        - 20 cm
        - 11 cm
        - 63 cm
        answer: 20 cm
        why: 4 + 7 + 9 = 20.
    - teach: 'Shortcuts: a rectangle has two lengths and two breadths, so perimeter = 2 × (length + breadth). A square has 4 equal sides: 4 × side. A regular polygon: number of sides × side.'
      check:
        prompt: Perimeter of a rectangle 10 m by 3 m?
        options:
        - 26 m
        - 13 m
        - 30 m
        answer: 26 m
        why: 2 × (10 + 3) = 26.
    - teach: You can work backwards. If a square's perimeter is 28 cm, each side is 28 ÷ 4 = 7 cm. If a rectangle's perimeter is 30 cm and its length 9 cm, then length + breadth = 15, so breadth = 6 cm.
      check:
        prompt: A regular pentagon has perimeter 40 cm. How long is each side?
        options:
        - 8 cm
        - 10 cm
        - 5 cm
        answer: 8 cm
        why: '5 equal sides: 40 ÷ 5 = 8.'
  items:
  - prompt: Find the perimeter of a rectangle 6 cm long and 4 cm wide (in cm).
    answer: '20'
    check: 2*(6+4)
    difficulty: 1
    hints:
    - 2 × (6 + 4).
    - Add all four sides.
    solution: 2 × (6 + 4) = 20 cm.
    mistakes:
      '10': c6_perim_rect
  - prompt: Find the perimeter of a square of side 7 cm (in cm).
    answer: '28'
    check: 4*7
    difficulty: 1
    hints:
    - 4 × side.
    - 4 × 7.
    solution: 4 × 7 = 28 cm.
    mistakes: {"49": "t6_square_perimeter", "14": "t6_square_perimeter"}
  - prompt: A triangle has sides 5 cm, 6 cm and 8 cm. Find its perimeter (in cm).
    answer: '19'
    check: 5+6+8
    difficulty: 1
    hints:
    - Add the three sides.
    - 5 + 6 + 8.
    solution: 5 + 6 + 8 = 19 cm.
    mistakes: {"240": "t6_triangle_perimeter", "14": "t6_triangle_perimeter"}
  - prompt: A regular hexagon has sides of 3 cm. Find its perimeter (in cm).
    answer: '18'
    check: 6*3
    difficulty: 1
    hints:
    - A hexagon has 6 equal sides.
    - 6 × 3.
    solution: 6 × 3 = 18 cm.
    mistakes: {"9": "t6_hexagon_perimeter", "12": "t6_hexagon_perimeter"}
  - prompt: Akshi runs 3 rounds of a rectangular park 150 m by 80 m. How far does she run (in m)?
    answer: '1380'
    check: 3*2*(150+80)
    difficulty: 2
    hints:
    - One round = 2 × (150 + 80).
    - Then × 3.
    solution: One round is 460 m; 3 rounds = 1,380 m.
    mistakes: {"460": "t6_rounds", "690": "t6_rounds"}
  - prompt: A square has a perimeter of 36 cm. What is its side (in cm)?
    answer: '9'
    check: 36/4
    difficulty: 2
    hints:
    - Perimeter = 4 × side.
    - 36 ÷ 4.
    solution: 36 ÷ 4 = 9 cm.
    mistakes: {"6": "t6_side_from_perimeter", "18": "t6_side_from_perimeter"}
  - prompt: Find the perimeter of a rectangle 12 cm by 5 cm (in cm).
    answer: '34'
    check: 2*(12+5)
    difficulty: 1
    hints:
    - Add the length and breadth first.
    - Then double it.
    solution: 'Step 1: 12 + 5 = 17. Step 2: 2 × 17 = 34 cm.'
    mistakes:
      '17': c6m6_around
      '60': c6m6_mix
  - prompt: A square field has side 25 m. How much wire goes once round it (in m)?
    answer: '100'
    check: 4*25
    difficulty: 1
    hints:
    - A square has 4 equal sides.
    - 4 × 25.
    solution: 'Step 1: perimeter = 4 × side. Step 2: 4 × 25 = 100 m.'
    mistakes:
      '625': c6m6_mix
      '50': c6m6_around
  - prompt: A rectangle has perimeter 40 cm and length 13 cm. What is its breadth (in cm)?
    answer: '7'
    check: 40/2-13
    difficulty: 2
    hints:
    - Half the perimeter is length + breadth.
    - 40 ÷ 2 = 20.
    solution: 'Step 1: length + breadth = 40 ÷ 2 = 20. Step 2: breadth = 20 − 13 = 7 cm.'
    mistakes:
      '27': c6m6_back
      '14': c6m6_back
  - prompt: An equilateral triangle has perimeter 45 cm. How long is each side (in cm)?
    answer: '15'
    check: 45/3
    difficulty: 1
    hints:
    - All three sides are equal.
    - Divide by 3.
    solution: 'Step 1: 3 equal sides. Step 2: 45 ÷ 3 = 15 cm.'
    mistakes:
      '9': c6m6_back
      '135': c6m6_back
  - prompt: A regular octagon has sides of 6 cm. Find its perimeter (in cm).
    answer: '48'
    check: 8*6
    difficulty: 1
    hints:
    - An octagon has 8 sides.
    - 8 × 6.
    solution: 'Step 1: 8 equal sides. Step 2: 8 × 6 = 48 cm.'
    mistakes:
      '36': c6m6_around
      '14': c6m6_around
  - prompt: A rectangle is 2 m long and 50 cm wide. Find its perimeter in cm.
    answer: '500'
    check: 2*(200+50)
    difficulty: 3
    hints:
    - Change 2 m to cm first.
    - 2 m = 200 cm.
    solution: 'Step 1: 2 m = 200 cm. Step 2: 2 × (200 + 50) = 500 cm.'
    mistakes:
      '104': c6m6_units
      '250': c6m6_around
  - prompt: Lace is sewn round a square cloth of side 30 cm. Lace costs ₹2 per cm. What is the cost (in ₹)?
    answer: '240'
    check: 4*30*2
    difficulty: 2
    hints:
    - 'First find the length of lace: the perimeter.'
    - Then multiply by the cost per cm.
    solution: 'Step 1: perimeter = 4 × 30 = 120 cm. Step 2: 120 × 2 = ₹240.'
    mistakes:
      '120': c6m6_around
      '60': c6m6_around
  - prompt: Two squares of side 3 cm are joined side to side to make a rectangle. What is the rectangle's perimeter (in cm)?
    answer: '18'
    check: 2*(6+3)
    difficulty: 3
    hints:
    - The rectangle is 6 cm by 3 cm.
    - The shared side is now inside, not on the boundary.
    solution: 'Step 1: the new shape is 6 cm by 3 cm. Step 2: perimeter = 2 × (6 + 3) = 18 cm (less than 12 + 12 = 24, because the joined sides are inside).'
    mistakes:
      '24': c6m6_around
      '9': c6m6_around
  - prompt: 'Which shape has the larger perimeter: an 8 cm × 2 cm rectangle or a square of side 5 cm?'
    options:
    - Both the same
    - The rectangle
    - The square
    answer: Both the same
    difficulty: 2
    hints:
    - 'Work out the rectangle: 2 × (l + b).'
    - 'Work out the square: 4 × side.'
    solution: 'Step 1: rectangle: 2 × (8 + 2) = 20 cm. Step 2: square: 4 × 5 = 20 cm. They are equal.'
    mistakes:
      The rectangle: c6m6_around
      The square: c6m6_around
- code: cbse6m.pa.area
  title: Area
  after:
  - cbse6m.pa.perimeter
  notes: |
    Area = amount of surface a closed figure covers, measured in square units (sq cm, sq m). Count unit squares on
    squared paper: full squares count 1, more than half count 1, half count ½, less than half count 0. Rectangle:
    length × breadth. Square: side × side. A diagonal splits a rectangle into two triangles of half the area.
    Tangram pieces show area by comparison. Same area can have different perimeters (4×6 and 3×8 both 24 sq cm).
  explanations:
    text: 'Area is how much flat space a shape covers. We measure it in square units: a square 1 cm on each side covers 1 square centimetre. For a rectangle, count the squares quickly with length × breadth.'
    visual: 'Draw a rectangle 5 squares long and 3 squares tall on squared paper. There are 3 rows of 5 squares: 15 squares in all.'
    step_by_step: 'Step 1: Check both lengths are in the same unit. Step 2: Multiply length × breadth. Step 3: Write the answer in square units. Step 4: For a right triangle cut from a rectangle, halve the rectangle''s area.'
    real_world: Buying tiles for a floor or paint for a wall depends on area, not perimeter.
  picture:
    kind: area_grid
    cols:
    - size: 5
      label: 5 cm
    rows:
    - size: 3
      label: 3 cm
    cells:
    - - 15 sq cm
    alt: A rectangle 5 cm by 3 cm covers 15 square centimetres.
  activity:
    type: rectangle
    max_side: 10
    prompt: Area is how many unit squares cover the inside. Change the sides and watch it change.
    goals:
    - prompt: Make a rectangle with an area of 12 square units.
      area: 12
    - prompt: Now area 12 and perimeter 14.
      area: 12
      perimeter: 14
    - prompt: Make a square with an area of 16.
      area: 16
      width: 4
      height: 4
  lesson:
    - teach: 'Area is how much surface a shape covers. We measure it by counting unit squares: a square 1 cm on each side has area 1 sq cm. On squared paper, count full squares as 1, more than half as 1, exactly half as ½ and less than half as 0.'
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: 1 cm
        - size: 1
          label: 1 cm
        - size: 1
          label: 1 cm
        rows:
        - size: 1
          label: 1 cm
        - size: 1
          label: 1 cm
        cells:
        - - '1'
          - '1'
          - '1'
        - - '1'
          - '1'
          - '1'
        alt: A 3 cm by 2 cm rectangle split into 6 unit squares, so its area is 6 square centimetres.
      check:
        prompt: A shape covers 7 full squares and 2 exactly-half squares. What is its area?
        options:
        - 8 sq units
        - 9 sq units
        - 7 sq units
        answer: 8 sq units
        why: 7 + ½ + ½ = 8.
    - teach: 'For a rectangle, rows × squares in each row: area = length × breadth. For a square, side × side. Area is in square units (sq cm, sq m), perimeter in plain units (cm, m).'
      check:
        prompt: Area of a rectangle 7 cm by 4 cm?
        options:
        - 28 sq cm
        - 22 sq cm
        - 11 sq cm
        answer: 28 sq cm
        why: 7 × 4 = 28.
    - teach: Area and perimeter are different. A 1 × 12 and a 3 × 4 rectangle both cover 12 sq cm, but their perimeters are 26 cm and 14 cm. A diagonal cuts a rectangle into two equal triangles, each with half the area.
      picture:
        kind: compare
        columns:
        - title: 1 × 12
          points:
          - area 12 sq cm
          - perimeter 26 cm
        - title: 3 × 4
          points:
          - area 12 sq cm
          - perimeter 14 cm
        alt: Two rectangles with the same area of 12 square centimetres have perimeters 26 cm and 14 cm.
      check:
        prompt: A 6 × 4 rectangle is cut on its diagonal. Area of each triangle?
        options:
        - 12 sq units
        - 24 sq units
        - 10 sq units
        answer: 12 sq units
        why: 6 × 4 = 24, and half of 24 is 12.
  items:
  - prompt: Find the area of a rectangle 5 cm by 3 cm (in sq cm).
    answer: '15'
    check: 5*3
    difficulty: 1
    hints:
    - length × breadth.
    - 5 × 3.
    solution: 5 × 3 = 15 sq cm.
    mistakes:
      '16': c6_perim_area
  - prompt: Find the area of a square of side 9 m (in sq m).
    answer: '81'
    check: 9*9
    difficulty: 1
    hints:
    - side × side.
    - 9 × 9.
    solution: 9 × 9 = 81 sq m.
    mistakes: {"36": "t6_square_area", "18": "t6_square_area"}
  - prompt: A rectangle is cut along a diagonal. The rectangle is 8 cm by 6 cm. What is the area of one triangle (in sq cm)?
    answer: '24'
    check: 8*6/2
    difficulty: 2
    hints:
    - The rectangle is 48 sq cm.
    - Half of it.
    solution: 8 × 6 ÷ 2 = 24 sq cm.
    mistakes: {"48": "t6_half_rectangle", "14": "t6_half_rectangle"}
  - prompt: A floor is 4 m by 3 m. Each tile covers 1 sq m. How many tiles are needed?
    answer: '12'
    check: 4*3
    difficulty: 1
    hints:
    - Area of the floor.
    - 4 × 3.
    solution: 4 × 3 = 12 tiles.
    mistakes: {"7": "t6_tiles_area", "14": "t6_tiles_area"}
  - prompt: A rectangle has area 48 sq cm and length 8 cm. What is its breadth (in cm)?
    answer: '6'
    check: 48/8
    difficulty: 2
    hints:
    - Area ÷ length.
    - 48 ÷ 8.
    solution: 48 ÷ 8 = 6 cm.
    mistakes: {"40": "t6_breadth", "16": "t6_breadth"}
  - prompt: 'A 4 × 6 rectangle and a 3 × 8 rectangle have:'
    options:
    - the same area but different perimeters
    - the same perimeter but different areas
    - the same area and perimeter
    - different areas and perimeters
    answer: the same area but different perimeters
    difficulty: 2
    hints:
    - 'Areas: 24 and 24.'
    - 'Perimeters: 20 and 22.'
    solution: Both cover 24 sq units, but their perimeters are 20 and 22.
    mistakes:
      the same area and perimeter: c6_perim_area
  - prompt: Find the area of a rectangle 15 m by 4 m (in sq m).
    answer: '60'
    check: 15*4
    difficulty: 1
    hints:
    - Area = length × breadth.
    - 15 × 4.
    solution: 'Step 1: area = 15 × 4. Step 2: = 60 sq m.'
    mistakes:
      '38': c6m6_mix
      '19': c6m6_mix
  - prompt: Find the area of a square of side 12 cm (in sq cm).
    answer: '144'
    check: 12*12
    difficulty: 1
    hints:
    - Area = side × side.
    - 12 × 12.
    solution: 'Step 1: area = 12 × 12. Step 2: = 144 sq cm.'
    mistakes:
      '48': c6m6_mix
      '24': c6m6_inside
  - prompt: A square has area 64 sq cm. What is its side (in cm)?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - Which number times itself gives 64?
    - Try 8.
    solution: 'Step 1: side × side = 64. Step 2: 8 × 8 = 64, so side = 8 cm.'
    mistakes:
      '16': c6m6_back
      '32': c6m6_back
  - prompt: A room is 5 m by 4 m. Tiles of 1 sq m cost ₹300 each. What does tiling the floor cost (in ₹)?
    answer: '6000'
    check: 5*4*300
    difficulty: 2
    hints:
    - 'First find how many tiles: the area.'
    - Then multiply by ₹300.
    solution: 'Step 1: area = 5 × 4 = 20 sq m, so 20 tiles. Step 2: 20 × 300 = ₹6,000.'
    mistakes:
      '5400': c6m6_mix
      '2700': c6m6_mix
  - prompt: A rectangle has area 54 sq m and breadth 6 m. What is its length (in m)?
    answer: '9'
    check: 54/6
    difficulty: 2
    hints:
    - Area = length × breadth.
    - 54 ÷ 6.
    solution: 'Step 1: length = area ÷ breadth. Step 2: 54 ÷ 6 = 9 m.'
    mistakes:
      '48': c6m6_back
      '21': c6m6_back
  - prompt: On squared paper a leaf covers 10 full squares, 6 more-than-half squares and 4 less-than-half squares. Estimate its area (sq units).
    answer: '16'
    check: 10+6
    difficulty: 2
    hints:
    - More than half counts as 1.
    - Less than half counts as 0.
    solution: 'Step 1: 10 full + 6 more-than-half = 16. Step 2: the 4 small bits count 0, so about 16 sq units.'
    mistakes:
      '20': c6m6_half
      '13': c6m6_half
  - prompt: A 10 m × 8 m garden has a 4 m × 3 m pond. What area is left for grass (in sq m)?
    answer: '68'
    check: 10*8-4*3
    difficulty: 3
    hints:
    - Find the whole area, then the pond's area.
    - Subtract.
    solution: 'Step 1: garden = 80 sq m, pond = 12 sq m. Step 2: 80 − 12 = 68 sq m.'
    mistakes:
      '92': c6m6_inside
      '11': c6m6_mix
  - prompt: Which unit is right for the area of a classroom floor?
    options:
    - Square metres
    - Metres
    - Kilograms
    answer: Square metres
    difficulty: 1
    hints:
    - Area counts squares.
    - A floor is measured in metres.
    solution: 'Step 1: area is in square units. Step 2: for a floor, square metres fit.'
    mistakes:
      Metres: c6m6_mix
      Kilograms: c6m6_mix
  - prompt: A square of side 6 cm and a rectangle 9 cm × 4 cm. Which statement is true?
    options:
    - Same area, the rectangle has the bigger perimeter
    - Same perimeter, different area
    - The square has the bigger area
    answer: Same area, the rectangle has the bigger perimeter
    difficulty: 3
    hints:
    - Work out both areas.
    - Then both perimeters.
    solution: 'Step 1: areas: 36 and 36 sq cm. Step 2: perimeters: 24 cm and 26 cm, so the rectangle''s is bigger.'
    mistakes:
      Same perimeter, different area: c6m6_mix
      The square has the bigger area: c6m6_inside
