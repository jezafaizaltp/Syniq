# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 9. Format: content/README.md.
subject: cbse6-math
chapter: 9
title: Symmetry
tips:
  c6_letter_symmetry: 'Fold the letter in your mind along the line: both halves must match exactly. Try both a vertical and a horizontal fold.'
  c6_rotation_count: Count how many times the shape looks the same during one full turn, including the full turn itself.
  t6_angle_of_turn: "Share 360° equally among the 3 blades."
  t6_chakra: "Share 360° among 24 spokes."
  t6_hexagon_symmetry: "A regular polygon has as many lines of symmetry as it has sides."
  t6_order3: "Turn each shape by 120°. Which looks exactly the same three times in one full turn?"
  t6_order_from_angle: "How many 60° turns make a full turn of 360°?"
  t6_rectangle_symmetry: "Fold a rectangle: the diagonal folds don't match. Only the middle folds do."
  t6_rotation_order: "Turn the square slowly. How many times in one full turn does it look the same?"
  t6_square_symmetry: "Fold a paper square: across the middle both ways, and along both diagonals."
  t6_triangle_symmetry: "Each line goes from a corner to the middle of the opposite side."
  c6m9_fold: 'Imagine folding along the line: do the two halves land exactly on each other?'
  c6m9_regular: A regular shape has as many lines of symmetry as it has sides.
  c6m9_letters: Check the letter for a standing (up-down) mirror line and a lying (left-right) one separately.
  c6m9_order: Count how many times the shape looks the same during one full turn.
  c6m9_angle: The smallest turn times the order makes one full turn of 360°.
  c6m9_mirror: In a mirror image, each point is the same distance from the line, on the other side.
concepts:
- code: cbse6m.sym.line
  title: Line symmetry
  notes: |
    A figure has line (reflection) symmetry if a line divides it into two halves that match exactly when folded; the
    line is the line of symmetry (mirror line). Square: 4 lines. Rectangle: 2. Equilateral triangle: 3. Isosceles
    triangle: 1. Circle: infinitely many. Regular polygon with n sides: n lines. Letters: A, M, T, U, V, W, Y have a
    vertical line; B, C, D, E, K have a horizontal line; H, I, O, X have both. Rangoli and kolam use symmetry.
  explanations:
    text: A shape has line symmetry if you can fold it along a line and both halves match exactly. That line is a line of symmetry. A square has 4, a rectangle has 2 and a circle has endlessly many.
    visual: 'Fold a paper heart down the middle: the two halves sit exactly on top of each other. The fold is the line of symmetry. Try folding a square: across, down, and along both diagonals. That makes 4.'
    step_by_step: 'Step 1: Imagine a fold line. Step 2: Picture flipping one half over the line. Step 3: If it covers the other half exactly, it is a line of symmetry. Step 4: Try all directions: vertical, horizontal, diagonal.'
    real_world: Butterflies, leaves, the Taj Mahal and many rangoli designs have a line of symmetry down the middle.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Square
      - Rectangle
      - Equilateral triangle
    - title: Lines of symmetry
      points:
      - '4'
      - '2'
      - '3'
    alt: A square has 4 lines of symmetry, a rectangle 2 and an equilateral triangle 3.
  activity:
    type: mirror
    left:
    - ..#
    - .##
    - '###'
    - .##
    - ..#
    prompt: The dashed line is a mirror. Tap squares on the right to finish the shape so both halves match.
  lesson:
    - teach: A shape has line symmetry if a line splits it into two halves that match exactly when folded. That line is the line of symmetry, or mirror line. A butterfly and a leaf have one.
      picture:
        kind: geometry
        points:
          A:
          - 5
          - 9
          B:
          - 2
          - 2
          C:
          - 8
          - 2
          M:
          - 5
          - 2
        segments:
        - - A
          - B
        - - B
          - C
        - - C
          - A
        - - A
          - M
          - fold
        alt: An isosceles triangle with its fold line from the top corner down to the middle of the base; the two halves match.
      check:
        prompt: 'A shape is folded along a line and the halves match exactly. The line is a:'
        options:
        - Line of symmetry
        - Diagonal only
        - Radius
        answer: Line of symmetry
        why: Matching halves on folding is what line symmetry means.
    - teach: 'Count the lines for common shapes: a rectangle has 2, a square 4, an equilateral triangle 3, an isosceles triangle 1, a circle endlessly many. A regular shape with n equal sides has n lines.'
      picture:
        kind: compare
        columns:
        - title: Rectangle
          points:
          - 2 lines
          - through the middles of the sides
        - title: Square
          points:
          - 4 lines
          - 2 through middles, 2 diagonals
        - title: Circle
          points:
          - endless lines
          - any line through the centre
        alt: A rectangle has 2 lines of symmetry, a square 4, and a circle endlessly many.
      check:
        prompt: How many lines of symmetry does a regular pentagon have?
        options:
        - '5'
        - '1'
        - '10'
        answer: '5'
        why: A regular shape with 5 sides has 5 lines.
    - teach: Letters can be symmetric too. A, M, T have a standing line; B, C, D, E have a lying line; H, I, O, X have both. Rangoli and kolam designs are drawn with symmetry, so each half mirrors the other.
      check:
        prompt: Which letter has a horizontal (lying) line of symmetry?
        options:
        - E
        - A
        - L
        answer: E
        why: The top half of E folds onto the bottom half.
  items:
  - prompt: How many lines of symmetry does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Fold across, down and along both diagonals.
    - Count them.
    solution: A square has 4 lines of symmetry.
    mistakes: {"2": "t6_square_symmetry", "8": "t6_square_symmetry"}
  - prompt: How many lines of symmetry does a rectangle (not a square) have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Diagonal folds do not match.
    - Only across and down.
    solution: A rectangle has 2 lines of symmetry.
    mistakes: {"4": "t6_rectangle_symmetry", "1": "t6_rectangle_symmetry"}
  - prompt: How many lines of symmetry does an equilateral triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - One from each corner to the middle of the opposite side.
    - 3 corners.
    solution: An equilateral triangle has 3.
    mistakes: {"1": "t6_triangle_symmetry", "6": "t6_triangle_symmetry"}
  - prompt: Which letter has a vertical line of symmetry?
    options:
    - A
    - F
    - J
    - R
    answer: A
    difficulty: 1
    hints:
    - Fold it down the middle.
    - Left and right halves match.
    solution: A's left and right halves match.
    mistakes:
      F: c6_letter_symmetry
  - prompt: Which letter has both a vertical and a horizontal line of symmetry?
    options:
    - H
    - A
    - B
    - M
    answer: H
    difficulty: 2
    hints:
    - Try both folds.
    - Top and bottom match too.
    solution: H matches when folded both ways.
    mistakes:
      B: c6_letter_symmetry
  - prompt: A regular hexagon has how many lines of symmetry?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - A regular polygon with n sides has n lines.
    - 6 sides.
    solution: A regular hexagon has 6.
    mistakes: {"3": "t6_hexagon_symmetry", "12": "t6_hexagon_symmetry"}
  - prompt: How many lines of symmetry does an isosceles triangle (only two sides equal) have?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Fold it from the top corner between the equal sides.
    - Is there any other fold that works?
    solution: 'Step 1: one fold from the top corner to the middle of the base works. Step 2: no other fold matches, so 1 line.'
    mistakes:
      '3': c6m9_fold
      '2': c6m9_fold
  - prompt: How many lines of symmetry does a regular octagon have?
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - Count its sides.
    - Regular shapes have as many lines as sides.
    solution: 'Step 1: an octagon has 8 equal sides. Step 2: so it has 8 lines of symmetry.'
    mistakes:
      '4': c6m9_regular
      '16': c6m9_regular
  - prompt: Which shape has no line of symmetry?
    options:
    - A scalene triangle (all sides different)
    - A square
    - A circle
    answer: A scalene triangle (all sides different)
    difficulty: 2
    hints:
    - Try folding each one.
    - Which one has no two equal sides?
    solution: 'Step 1: squares and circles fold neatly. Step 2: a triangle with all sides different has no fold that matches.'
    mistakes:
      A square: c6m9_fold
      A circle: c6m9_fold
  - prompt: Which letter has no line of symmetry?
    options:
    - F
    - A
    - H
    answer: F
    difficulty: 2
    hints:
    - Try a standing line and a lying line.
    - Which letter changes both ways?
    solution: 'Step 1: A has a standing line and H has both. Step 2: F matches neither way.'
    mistakes:
      A: c6m9_letters
      H: c6m9_letters
  - prompt: Which word has a vertical (standing) line of symmetry when written in capitals?
    options:
    - TOT
    - TOP
    - BOX
    answer: TOT
    difficulty: 3
    hints:
    - Each letter must be symmetric on its own.
    - The word must also read the same backwards.
    solution: 'Step 1: T and O each have a standing line. Step 2: TOT reads the same from both sides, so the whole word is symmetric.'
    mistakes:
      TOP: c6m9_letters
      BOX: c6m9_letters
  - prompt: Point P is 3 squares to the left of a vertical mirror line. Where is its mirror image?
    options:
    - 3 squares to the right of the line
    - 6 squares to the right of the line
    - On the line
    answer: 3 squares to the right of the line
    difficulty: 2
    hints:
    - The image is the same distance from the line.
    - It is on the other side.
    solution: 'Step 1: a reflection keeps the distance from the mirror. Step 2: so the image is 3 squares to the right.'
    mistakes:
      6 squares to the right of the line: c6m9_mirror
      On the line: c6m9_mirror
  - prompt: How many lines of symmetry does the number 8 have, drawn as two equal circles stacked?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Fold it top to bottom.
    - Fold it left to right.
    solution: 'Step 1: a standing line splits it into left and right halves. Step 2: a lying line splits the two circles. So 2.'
    mistakes:
      '1': c6m9_fold
      '4': c6m9_fold
  - prompt: A rangoli design has 6 lines of symmetry. If you draw one petal, how many matching petals will the full design have, one between each pair of neighbouring lines?
    answer: '12'
    check: '12'
    difficulty: 3
    hints:
    - 6 lines cut the circle into how many equal slices?
    - Each line through the centre makes 2 cuts.
    solution: 'Step 1: 6 lines through the centre make 12 equal slices. Step 2: one petal per slice gives 12 petals.'
    mistakes:
      '6': c6m9_mirror
      '3': c6m9_mirror
  - prompt: Is the diagonal of a rectangle (not a square) a line of symmetry?
    options:
    - No, the halves don't fold onto each other
    - Yes, it cuts it into two equal triangles
    - Yes, always
    answer: No, the halves don't fold onto each other
    difficulty: 3
    hints:
    - Cut a paper rectangle and fold along the diagonal.
    - Equal pieces is not the same as matching when folded.
    solution: 'Step 1: the diagonal makes two equal triangles. Step 2: but folding along it does not lay one on the other, so it is not a line of symmetry.'
    mistakes:
      Yes, it cuts it into two equal triangles: c6m9_fold
      Yes, always: c6m9_fold
- code: cbse6m.sym.rotation
  title: Rotational symmetry
  after:
  - cbse6m.sym.line
  notes: |
    A figure has rotational symmetry if it looks exactly the same after turning less than a full turn about its centre.
    Angles of symmetry: the smallest such turn; order = how many times it looks the same in one full turn (360°).
    Square: 90°, order 4. Equilateral triangle: 120°, order 3. Regular hexagon: 60°, order 6. Rectangle: 180°, order 2.
    Smallest angle × order = 360°. A pinwheel and the Ashoka Chakra (24 spokes, order 24) show rotational symmetry.
  explanations:
    text: Some shapes look the same after you turn them part of the way round. A square looks the same after a quarter turn (90°), so during a full turn it matches 4 times. That number is its order of rotational symmetry.
    visual: 'Put a paper square on a pin through its centre. Turn it slowly. After 90° it looks the same; again at 180°, 270° and 360°. Four matches: order 4.'
    step_by_step: 'Step 1: Find the centre. Step 2: Turn the shape slowly. Step 3: Note each angle where it looks the same. Step 4: Count the matches in a full 360°: that is the order. Step 5: 360 ÷ order = smallest angle.'
    real_world: A ceiling fan with 3 blades looks the same every 120° of turning. The Ashoka Chakra with 24 spokes looks the same every 15°.
  picture:
    kind: flow
    steps:
    - 'Start: square'
    - 'Turn 90°: same'
    - 'Turn 180°: same'
    - 'Turn 270°: same'
    - 'Turn 360°: same (order 4)'
    alt: A square looks the same after turns of 90°, 180°, 270° and 360°, so its order of rotational symmetry is 4.
  activity:
    type: angle
    prompt: 'Rotational symmetry: the smallest turn that makes a shape look the same again. Turn the arm by that angle.'
    goals:
    - prompt: A square looks the same after a quarter turn. Make that angle.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: 180° is a half turn. A square already looks the same after a smaller turn.
    - prompt: An equilateral triangle looks the same after a third of a full turn.
      degrees: 120
      hint: A full turn is 360°.
      mistakes:
      - when:
          degrees: 90
        say: After a quarter turn (90°) a triangle points a different way. A third of 360° is more than a quarter.
      - when:
          degrees: 60
        say: '60° is a sixth of a turn: a hexagon''s turn, not a triangle''s.'
    - prompt: 'A regular hexagon (6 equal sides): the smallest turn.'
      degrees: 60
      mistakes:
      - when:
          degrees: 120
        say: '120° is a third of a turn: the triangle''s turn. A hexagon has 6 sides, so its turn is a sixth of 360°.'
  lesson:
    - teach: A shape has rotational symmetry if it looks exactly the same after turning less than a full turn about its centre. A square looks the same after a quarter turn of 90°.
      picture:
        kind: flow
        steps:
        - 0°
        - '90°: same'
        - '180°: same'
        - '270°: same'
        - '360°: back'
        alt: A square turned 90, 180 and 270 degrees looks the same each time, then a full turn brings it back.
      check:
        prompt: Does the letter S look the same after a half turn (180°)?
        options:
        - 'Yes'
        - 'No'
        answer: 'Yes'
        why: 'Turn a page with S upside down: it still reads S.'
    - teach: 'The order of rotational symmetry is how many times the shape looks the same in one full turn. A square: 4. An equilateral triangle: 3. A rectangle: 2. A regular hexagon: 6.'
      check:
        prompt: A windmill has 4 equal blades. What is its order of rotational symmetry?
        options:
        - '4'
        - '2'
        - '8'
        answer: '4'
        why: It looks the same 4 times in one full turn.
    - teach: The smallest angle of symmetry × order = 360°. For order 3, the angle is 360 ÷ 3 = 120°. For order 5, it is 72°.
      check:
        prompt: A shape has order 8. What is its smallest angle of symmetry?
        options:
        - 45°
        - 8°
        - 90°
        answer: 45°
        why: 360 ÷ 8 = 45.
  items:
  - prompt: What is the order of rotational symmetry of a square?
    answer: '4'
    check: 360/90
    difficulty: 1
    hints:
    - It matches every 90°.
    - 360 ÷ 90.
    solution: 360 ÷ 90 = 4.
    mistakes: {"2": "t6_rotation_order", "90": "t6_rotation_order"}
  - prompt: A ceiling fan has 3 equally spaced blades. What is the smallest angle of turn that makes it look the same (in degrees)?
    answer: '120'
    check: 360/3
    difficulty: 1
    hints:
    - 360 ÷ 3.
    - Order 3.
    solution: 360 ÷ 3 = 120°.
    mistakes: {"3": "t6_angle_of_turn", "90": "t6_angle_of_turn"}
  - prompt: What is the order of rotational symmetry of a rectangle?
    answer: '2'
    check: 360/180
    difficulty: 2
    hints:
    - It matches at 180° and 360°.
    - 360 ÷ 180.
    solution: "A rectangle looks the same after a half turn (180°) and a full turn, so it fits onto itself 2 times: order 2."
    mistakes:
      '4': c6_rotation_count
  - prompt: A shape looks the same every 60°. What is its order of rotational symmetry?
    answer: '6'
    check: 360/60
    difficulty: 2
    hints:
    - 360 ÷ 60.
    - Count matches in a full turn.
    solution: 360 ÷ 60 = 6.
    mistakes: {"60": "t6_order_from_angle", "3": "t6_order_from_angle"}
  - prompt: The Ashoka Chakra has 24 equally spaced spokes. What is its smallest angle of symmetry (in degrees)?
    answer: '15'
    check: 360/24
    difficulty: 2
    hints:
    - 360 ÷ 24.
    - Divide.
    solution: 360 ÷ 24 = 15°.
    mistakes: {"24": "t6_chakra", "30": "t6_chakra"}
  - prompt: Which shape has rotational symmetry of order 3?
    options:
    - Equilateral triangle
    - Square
    - Rectangle
    - Isosceles triangle
    answer: Equilateral triangle
    difficulty: 1
    hints:
    - It matches every 120°.
    - 3 equal sides.
    solution: 'An equilateral triangle matches every 120°: order 3.'
    mistakes: {"Square": "t6_order3", "Isosceles triangle": "t6_order3"}
  - prompt: What is the order of rotational symmetry of a regular hexagon?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Count how often it looks the same in a full turn.
    - A regular shape has the same order as its number of sides.
    solution: 'Step 1: it looks the same every 60°. Step 2: 360 ÷ 60 = 6.'
    mistakes:
      '3': c6m9_order
      '12': c6m9_order
  - prompt: A flower has 5 identical petals equally spaced. What is its smallest angle of symmetry (in degrees)?
    answer: '72'
    check: 360/5
    difficulty: 2
    hints:
    - The order is 5.
    - 360 ÷ 5.
    solution: 'Step 1: order 5. Step 2: 360 ÷ 5 = 72°.'
    mistakes:
      '5': c6m9_angle
      '60': c6m9_angle
  - prompt: A shape looks the same every 90°. What is its order?
    answer: '4'
    check: 360/90
    difficulty: 1
    hints:
    - How many 90° turns make a full turn?
    - 360 ÷ 90.
    solution: 'Step 1: 360 ÷ 90 = 4. Step 2: so the order is 4.'
    mistakes:
      '90': c6m9_angle
      '2': c6m9_angle
  - prompt: A shape has order 2. What is its smallest angle of symmetry (in degrees)?
    answer: '180'
    check: 360/2
    difficulty: 1
    hints:
    - Order times angle is 360.
    - 360 ÷ 2.
    solution: 'Step 1: 360 ÷ 2. Step 2: = 180°, a half turn.'
    mistakes:
      '90': c6m9_angle
      '2': c6m9_angle
  - prompt: Which letter has rotational symmetry of order 2?
    options:
    - Z
    - A
    - T
    answer: Z
    difficulty: 2
    hints:
    - Turn each letter upside down.
    - Which one still looks the same?
    solution: 'Step 1: Z turned 180° is still Z. Step 2: A and T look different after a half turn.'
    mistakes:
      A: c6m9_order
      T: c6m9_order
  - prompt: A wheel has 12 equally spaced spokes. What is its smallest angle of symmetry (in degrees)?
    answer: '30'
    check: 360/12
    difficulty: 2
    hints:
    - The order is 12.
    - 360 ÷ 12.
    solution: 'Step 1: 12 spokes give order 12. Step 2: 360 ÷ 12 = 30°.'
    mistakes:
      '12': c6m9_angle
      '36': c6m9_angle
  - prompt: Which shape has NO rotational symmetry (order 1)?
    options:
    - An isosceles triangle (only two sides equal)
    - A square
    - A circle
    answer: An isosceles triangle (only two sides equal)
    difficulty: 2
    hints:
    - Turn each shape less than a full turn.
    - Which one only fits back after 360°?
    solution: 'Step 1: squares and circles fit back many times. Step 2: the isosceles triangle fits only after a full turn.'
    mistakes:
      A square: c6m9_order
      A circle: c6m9_order
  - prompt: A design looks the same every 40°. What is its order of rotational symmetry?
    answer: '9'
    check: 360/40
    difficulty: 3
    hints:
    - How many 40° turns make 360°?
    - 360 ÷ 40.
    solution: 'Step 1: 360 ÷ 40. Step 2: = 9.'
    mistakes:
      '40': c6m9_angle
      '8': c6m9_angle
  - prompt: A square tile pattern is turned 90° and looks the same. Turned 45°, it does not. Which is true?
    options:
    - Its order is 4
    - Its order is 8
    - It has no rotational symmetry
    answer: Its order is 4
    difficulty: 3
    hints:
    - The smallest working turn is 90°.
    - 360 ÷ 90.
    solution: 'Step 1: the smallest turn that works is 90°. Step 2: 360 ÷ 90 = 4, so order 4.'
    mistakes:
      Its order is 8: c6m9_angle
      It has no rotational symmetry: c6m9_order
