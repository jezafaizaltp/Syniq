# CBSE Class 6 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 9. Format: content/README.md.
subject: cbse6-math
chapter: 9
title: Symmetry
tips:
  c6_letter_symmetry: 'Fold the letter in your mind along the line: both halves must match exactly. Try both a vertical and a horizontal fold.'
  c6_rotation_count: Count how many times the shape looks the same during one full turn, including the full turn itself.
concepts:
- code: cbse6m.sym.line
  title: Line symmetry
  notes: |
    A figure has line (reflection) symmetry if a line divides it into two halves that match exactly when folded; the
    line is the line of symmetry (mirror line). Square: 4 lines. Rectangle: 2. Equilateral triangle: 3. Isosceles
    triangle: 1. Circle: infinitely many. Regular polygon with n sides: n lines. Letters: A, M, T, U, V, W, Y have a
    vertical line; B, C, D, E, K have a horizontal line; H, I, O, X have both. Rangoli and kolam use symmetry.
  explanations:
    text: A shape has line symmetry if you can fold it along a line and both halves match exactly. That line is a line of symmetry. A square has 4, a rectangle has 2 and a circle has endlessly many.
    visual: 'Fold a paper heart down the middle: the two halves sit exactly on top of each other. The fold is the line of symmetry. Try folding a square: across, down, and along both diagonals. That makes 4.'
    step_by_step: 'Step 1: Imagine a fold line. Step 2: Picture flipping one half over the line. Step 3: If it covers the other half exactly, it is a line of symmetry. Step 4: Try all directions: vertical, horizontal, diagonal.'
    real_world: Butterflies, leaves, the Taj Mahal and many rangoli designs have a line of symmetry down the middle.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Square
      - Rectangle
      - Equilateral triangle
    - title: Lines of symmetry
      points:
      - '4'
      - '2'
      - '3'
    alt: A square has 4 lines of symmetry, a rectangle 2 and an equilateral triangle 3.
  items:
  - prompt: How many lines of symmetry does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Fold across, down and along both diagonals.
    - Count them.
    solution: A square has 4 lines of symmetry.
  - prompt: How many lines of symmetry does a rectangle (not a square) have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Diagonal folds do not match.
    - Only across and down.
    solution: A rectangle has 2 lines of symmetry.
  - prompt: How many lines of symmetry does an equilateral triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - One from each corner to the middle of the opposite side.
    - 3 corners.
    solution: An equilateral triangle has 3.
  - prompt: Which letter has a vertical line of symmetry?
    options:
    - A
    - F
    - J
    - R
    answer: A
    difficulty: 1
    hints:
    - Fold it down the middle.
    - Left and right halves match.
    solution: A's left and right halves match.
    mistakes:
      F: c6_letter_symmetry
  - prompt: Which letter has both a vertical and a horizontal line of symmetry?
    options:
    - H
    - A
    - B
    - M
    answer: H
    difficulty: 2
    hints:
    - Try both folds.
    - Top and bottom match too.
    solution: H matches when folded both ways.
    mistakes:
      B: c6_letter_symmetry
  - prompt: A regular hexagon has how many lines of symmetry?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - A regular polygon with n sides has n lines.
    - 6 sides.
    solution: A regular hexagon has 6.
- code: cbse6m.sym.rotation
  title: Rotational symmetry
  after:
  - cbse6m.sym.line
  notes: |
    A figure has rotational symmetry if it looks exactly the same after turning less than a full turn about its centre.
    Angles of symmetry: the smallest such turn; order = how many times it looks the same in one full turn (360°).
    Square: 90°, order 4. Equilateral triangle: 120°, order 3. Regular hexagon: 60°, order 6. Rectangle: 180°, order 2.
    Smallest angle × order = 360°. A pinwheel and the Ashoka Chakra (24 spokes, order 24) show rotational symmetry.
  explanations:
    text: Some shapes look the same after you turn them part of the way round. A square looks the same after a quarter turn (90°), so during a full turn it matches 4 times. That number is its order of rotational symmetry.
    visual: 'Put a paper square on a pin through its centre. Turn it slowly. After 90° it looks the same; again at 180°, 270° and 360°. Four matches: order 4.'
    step_by_step: 'Step 1: Find the centre. Step 2: Turn the shape slowly. Step 3: Note each angle where it looks the same. Step 4: Count the matches in a full 360°: that is the order. Step 5: 360 ÷ order = smallest angle.'
    real_world: A ceiling fan with 3 blades looks the same every 120° of turning. The Ashoka Chakra with 24 spokes looks the same every 15°.
  picture:
    kind: flow
    steps:
    - 'Start: square'
    - 'Turn 90°: same'
    - 'Turn 180°: same'
    - 'Turn 270°: same'
    - 'Turn 360°: same (order 4)'
    alt: A square looks the same after turns of 90°, 180°, 270° and 360°, so its order of rotational symmetry is 4.
  items:
  - prompt: What is the order of rotational symmetry of a square?
    answer: '4'
    check: 360/90
    difficulty: 1
    hints:
    - It matches every 90°.
    - 360 ÷ 90.
    solution: 360 ÷ 90 = 4.
  - prompt: A ceiling fan has 3 equally spaced blades. What is the smallest angle of turn that makes it look the same (in degrees)?
    answer: '120'
    check: 360/3
    difficulty: 1
    hints:
    - 360 ÷ 3.
    - Order 3.
    solution: 360 ÷ 3 = 120°.
  - prompt: What is the order of rotational symmetry of a rectangle?
    answer: '2'
    check: 360/180
    difficulty: 2
    hints:
    - It matches at 180° and 360°.
    - 360 ÷ 180.
    solution: Order 2.
    mistakes:
      '4': c6_rotation_count
  - prompt: A shape looks the same every 60°. What is its order of rotational symmetry?
    answer: '6'
    check: 360/60
    difficulty: 2
    hints:
    - 360 ÷ 60.
    - Count matches in a full turn.
    solution: 360 ÷ 60 = 6.
  - prompt: The Ashoka Chakra has 24 equally spaced spokes. What is its smallest angle of symmetry (in degrees)?
    answer: '15'
    check: 360/24
    difficulty: 2
    hints:
    - 360 ÷ 24.
    - Divide.
    solution: 360 ÷ 24 = 15°.
  - prompt: Which shape has rotational symmetry of order 3?
    options:
    - Equilateral triangle
    - Square
    - Rectangle
    - Isosceles triangle
    answer: Equilateral triangle
    difficulty: 1
    hints:
    - It matches every 120°.
    - 3 equal sides.
    solution: 'An equilateral triangle matches every 120°: order 3.'
