- code: cbse6e.u4.yoga
  title: 'Yoga: A Way of Life'
  notes: |
    An informative chapter on yoga, an ancient Indian practice for body, mind and breath. The sage Patanjali compiled the
    Yoga Sutras. Parts: asanas (postures: tadasana, vrikshasana), pranayama (breath control), dhyana (meditation). Benefits:
    flexibility, strength, balance, better concentration, calmness, less stress. Practise on an empty stomach, slowly, on a
    mat, without forcing. The United Nations declared 21 June International Day of Yoga (first held 2015).
  explanations:
    text: Yoga is an ancient Indian practice that keeps the body, mind and breath healthy. The sage Patanjali wrote the Yoga Sutras. Yoga includes postures (asanas), breathing exercises (pranayama) and meditation. It makes us flexible, strong and calm. The world celebrates International Day of Yoga on 21 June.
    visual: Picture a child on a mat in vrikshasana (tree pose), standing on one leg, hands joined above the head, eyes calm, breathing slowly.
    step_by_step: 'Step 1: Find a quiet place and a mat. Step 2: Start slowly with simple asanas. Step 3: Breathe deeply and steadily. Step 4: Never force a pose. Step 5: End with a few minutes of quiet sitting.'
    real_world: Many Indian schools start the day with a few minutes of yoga and pranayama to help students focus.
  picture:
    kind: compare
    columns:
    - title: Part of yoga
      points:
      - Asana
      - Pranayama
      - Dhyana
    - title: What it is
      points:
      - body postures
      - breath control
      - meditation
    alt: Asanas are body postures, pranayama is breath control and dhyana is meditation.
  activity:
    type: sort
    prompt: 'Yoga: A Way of Life: which part of yoga?'
    bins:
    - Asana
    - Pranayama
    - Dhyana
    items:
    - label: Tadasana
      bin: Asana
      clue: A standing posture.
      why: 'Tadasana (mountain pose) is a posture: an asana.'
    - label: Slow, deep breathing in and out
      bin: Pranayama
      clue: Controlling the breath.
      why: Breath control is pranayama.
    - label: Sitting still with a calm mind
      bin: Dhyana
      clue: Meditation.
      why: Calm focus of the mind is dhyana.
    - label: Vrikshasana
      bin: Asana
      clue: Tree pose, standing on one leg.
      why: 'Vrikshasana is a balancing posture: an asana.'
    - label: Focusing on one thought quietly
      bin: Dhyana
      clue: The mind, not the body.
      why: Quiet focus is meditation, dhyana.
  lesson:
    - teach: Yoga is an ancient Indian practice for body, mind and breath. Sage Patanjali compiled the Yoga Sutras, an old guide to yoga.
      check:
        prompt: 'Yoga works on:'
        options:
        - Body, mind and breath
        - Only muscles
        - Only diet
        answer: Body, mind and breath
        why: Yoga joins all three.
      ways:
      - style: visual
        teach: 'Yoga works on three things together: body, breath and mind.'
        picture:
          kind: compare
          columns:
          - title: Body
            points:
            - Asanas (postures)
            - Build strength and balance
          - title: Breath
            points:
            - Pranayama
            - Slow, controlled breathing
          - title: Mind
            points:
            - Dhyana (meditation)
            - Quiet focus
          alt: Yoga works on the body through asanas, which build strength and balance; on the breath through pranayama, slow controlled breathing; and on the mind through dhyana, quiet focus.
      - style: real_world
        teach: Long before books were printed, yoga was taught from teacher to student. Sage Patanjali gathered its ideas into short sayings called the Yoga Sutras, a little like a careful set of notes that later students could follow.
    - teach: 'Yoga has parts: asanas (postures such as tadasana, the mountain pose, and vrikshasana, the tree pose), pranayama (breath control) and dhyana (meditation).'
      picture:
        kind: compare
        columns:
        - title: Asanas
          points:
          - postures
          - tadasana, vrikshasana
        - title: Pranayama
          points:
          - breath control
        - title: Dhyana
          points:
          - meditation
          - quiet mind
        alt: Asanas are postures, pranayama is breath control, dhyana is meditation.
      check:
        prompt: 'Vrikshasana, standing on one leg like a tree, is:'
        options:
        - An asana
        - Pranayama
        - Dhyana
        answer: An asana
        why: It is a body posture.
      ways:
      - style: step_by_step
        teach: 'Step 1: Stand straight with feet together for the mountain pose, tadasana. Step 2: Breathe in slowly and stretch the arms up. Step 3: Hold still for a few breaths. Step 4: Breathe out and lower the arms. Moving and breathing slowly together is the heart of an asana.'
      - style: real_world
        teach: Before a race, some athletes stand still and take a few slow, deep breaths to settle their nerves. That simple habit is close to pranayama, and it shows how breath can calm the body.
    - teach: Yoga brings flexibility, strength, balance, better concentration and calm. Practise on an empty stomach, on a mat, slowly, without forcing. The United Nations made 21 June the International Day of Yoga; it was first held in 2015.
      check:
        prompt: Why is yoga done on an empty stomach?
        options:
        - Bending and twisting after a meal can be uncomfortable
        - Food is banned
        - It makes you hungry
        answer: Bending and twisting after a meal can be uncomfortable
        why: A full stomach makes postures hard and uncomfortable.
      ways:
      - style: visual
        teach: Four simple habits that make yoga practice safe.
        picture:
          kind: flow
          steps:
          - Practise on an empty stomach
          - Use a mat in a calm, airy place
          - Move slowly into each pose
          - Stop if anything hurts; never force
          alt: Practise on an empty stomach, use a mat in a calm, airy place, move slowly into each pose and stop if anything hurts; never force.
      - style: real_world
        teach: Each year on the International Day of Yoga, people gather in parks, schools and even on ships to practise together. The day was declared by the United Nations and has been held every year since 2015.
