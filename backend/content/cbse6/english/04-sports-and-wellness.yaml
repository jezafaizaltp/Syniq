# CBSE Class 6 English (NCERT Poorvi, 2024-25), unit 4. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse6-eng
chapter: 4
title: 'Sports and Wellness: Change of Heart · The Winner · Yoga: A Way of Life'
tips:
  e6_asanas: "Ragas are in music. Yoga poses have a Sanskrit name ending in '-asana', like padmasana."
  e6_badminton: "The game in the story uses rackets and a shuttle."
  e6_cheat: "Prabhat did not win fairly. What did he do with the score?"
  e6_empty_stomach: "Bending and twisting after a big meal would be uncomfortable."
  e6_guilt: "Prabhat knew he had cheated. How would that feel at night?"
  e6_imagery: "Words that make a picture in your mind. The word has 'image' inside it."
  e6_kho_kho: "Ice hockey needs ice rinks. The Indian game is a running and chasing game."
  e6_personification: "Rhyme is about sounds at line ends. Here the sun and wind act like people. What is that called?"
  e6_play_benefit: "The poem shows children playing together outdoors. How do they feel?"
  e6_play_joy: "The poem is full of games, sun and running."
  e6_pranayama: "'Prana' means breath or life force."
  e6_sportsmanship: "A good sport is fair and kind whether they win or lose."
  e6_yoga_benefit: "Yoga is practised to feel calmer, not worse."
  e6_yoga_day: "15 August is Independence Day. Yoga Day falls on the longest day of the year in India."
  c6e4_events: Go back to the part of the story and check exactly what happened and in what order.
  c6e4_feel: 'Look at how the character behaves afterwards: sleep, mood, actions show the feeling inside.'
  c6e4_fair: Ask whether the win was earned honestly and whether the player respected the other.
  c6e4_poem: 'Think about the poet''s idea of winning: is it only about coming first?'
  c6e4_device: Ask whether a thing is acting like a person, or whether the words help you see, hear or feel the scene.
  c6e4_yoga: 'Match each part of yoga to what it works on: body postures, breathing, or the quiet mind.'

concepts:
- code: cbse6e.u4.heart
  title: Change of Heart
  notes: |
    Prabhat cannot bear to lose; he plays only games he is sure to win. A new student, Surya, plays badminton well and enjoys
    every game, win or lose. In a friendly match (held by the coach on the last Friday of the month), Prabhat changes the
    score while Surya is distracted and 'wins'. Classmates praise him, but he feels unhappy and cannot sleep. Watching Surya
    enjoy games he is not good at, like basketball, Prabhat realises that enjoying the game matters more than winning. He
    begins to play for fun and honestly. Moral: sportsmanship and fair play matter more than victory.
  explanations:
    text: Prabhat hates losing. In a badminton match against Surya, a new student, he secretly changes the score and wins. But the win doesn't make him happy; he can't even sleep. Watching Surya enjoy games whether he wins or loses, Prabhat realises that playing fair and having fun matter more than winning.
    visual: 'Picture a badminton court: Surya turned away, and Prabhat quietly changing the scoreboard. Then Prabhat lying awake at night, and later laughing during a game of hide and seek.'
    step_by_step: 'Step 1: Prabhat''s problem: he must win. Step 2: The match and the cheating. Step 3: His unhappiness. Step 4: Learning from Surya. Step 5: His change of heart.'
    real_world: 'Great athletes are remembered for fair play too: shaking hands with opponents and accepting results gracefully.'
  picture:
    kind: flow
    steps:
    - Prabhat must always win
    - Badminton match with Surya
    - Prabhat changes the score
    - He feels unhappy, can't sleep
    - He learns to play for fun
    alt: Prabhat must win, cheats in a badminton match with Surya, feels miserable, and learns to play for fun.
  activity:
    type: order
    prompt: 'Change of Heart: put Prabhat''s change in order.'
    steps:
    - Prabhat plays only games he can win
    - Surya joins and enjoys every game
    - Prabhat changes the score and 'wins'
    - He feels unhappy and cannot sleep
    - He sees Surya enjoy games he is bad at
    - He starts to play honestly, for fun
    reasons:
      Surya joins and enjoys every game: A new boy shows a different way to play.
      Prabhat changes the score and 'wins': Afraid to lose the match, he cheats.
      He feels unhappy and cannot sleep: His win was not honest.
      He sees Surya enjoy games he is bad at: He watches Surya play basketball for fun.
      He starts to play honestly, for fun: Surya shows him joy matters more than winning.
  lesson:
    - teach: In 'Change of Heart', Prabhat cannot bear to lose, so he only plays games he is sure to win. A new student, Surya, plays badminton well and enjoys every game, win or lose.
      check:
        prompt: How is Surya different from Prabhat?
        options:
        - Surya enjoys playing whether he wins or loses
        - Surya never plays
        - Surya cheats
        answer: Surya enjoys playing whether he wins or loses
        why: Surya plays for fun; Prabhat plays only to win.
    - teach: 'In a friendly badminton match, Prabhat changes the score while Surya is distracted, and ''wins''. Classmates praise him, but he feels unhappy and cannot sleep: he feels guilty.'
      picture:
        kind: flow
        steps:
        - Match begins
        - Surya distracted
        - Prabhat changes score
        - Prabhat 'wins'
        - Feels guilty, can't sleep
        alt: Prabhat changes the score to win, but then feels guilty and cannot sleep.
      check:
        prompt: Why couldn't Prabhat enjoy his win?
        options:
        - He knew he had cheated
        - He was ill
        - He lost the match
        answer: He knew he had cheated
        why: A dishonest win brings guilt, not joy.
    - teach: 'Watching Surya happily play basketball, a game he isn''t good at, Prabhat realises that enjoying the game matters more than winning. He starts playing honestly and for fun. This is sportsmanship: fair play and respect, win or lose.'
      check:
        prompt: What is the 'change of heart' in the title?
        options:
        - Prabhat learns to value fair play over winning
        - Prabhat gets a heart illness
        - Surya starts cheating
        answer: Prabhat learns to value fair play over winning
        why: His attitude to games changes.
  items:
  - prompt: What was Prabhat's problem?
    options:
    - He could not bear to lose
    - He could not run
    - He had no racket
    - He hated school
    answer: He could not bear to lose
    difficulty: 1
    hints:
    - Winning obsession.
    - Only safe games.
    solution: He couldn't accept losing.
    mistakes:
      He had no racket: eng6_read_again
  - prompt: Which game did Prabhat and Surya play in the match?
    options:
    - Badminton
    - Cricket
    - Football
    - Chess
    answer: Badminton
    difficulty: 1
    hints:
    - Shuttlecock.
    - Rackets.
    solution: They played badminton.
    mistakes: {"Cricket": "e6_badminton"}
  - prompt: How did Prabhat win the match?
    options:
    - He changed the score when Surya was distracted
    - He played very well
    - Surya let him win
    - It rained
    answer: He changed the score when Surya was distracted
    difficulty: 1
    hints:
    - Not fair.
    - Cheating.
    solution: He cheated by changing the score.
    mistakes: {"He played very well": "e6_cheat"}
  - prompt: How did Prabhat feel after winning?
    options:
    - Unhappy and unable to sleep
    - Proud and peaceful
    - Hungry
    - Sleepy
    answer: Unhappy and unable to sleep
    difficulty: 2
    hints:
    - Guilt.
    - Night.
    solution: He felt guilty and couldn't sleep.
    mistakes: {"Proud and peaceful": "e6_guilt"}
  - prompt: What did Prabhat learn from Surya?
    options:
    - Enjoying the game matters more than winning
    - Cheating is clever
    - Badminton is boring
    - Never play basketball
    answer: Enjoying the game matters more than winning
    difficulty: 2
    hints:
    - Surya enjoyed games he lost.
    - Fun.
    solution: He learned to value enjoyment and fair play.
    mistakes:
      Cheating is clever: eng6_whole_story
  - prompt: '''Sportsmanship'' means:'
    options:
    - playing fairly and respecting others, win or lose
    - always winning
    - buying sports shoes
    - shouting at referees
    answer: playing fairly and respecting others, win or lose
    difficulty: 2
    hints:
    - Fair play.
    - Grace.
    solution: Sportsmanship is fair, respectful play.
    mistakes: {"always winning": "e6_sportsmanship"}
  - prompt: Why did Prabhat avoid some games?
    options:
    - He was afraid of losing them
    - He was too tired
    - His parents stopped him
    answer: He was afraid of losing them
    difficulty: 1
    hints:
    - He played only games he was sure to win.
    - What did he fear?
    solution: 'Step 1: Prabhat chose only sure wins. Step 2: so he avoided games he might lose.'
    mistakes:
      He was too tired: c6e4_events
      His parents stopped him: c6e4_events
  - prompt: Who was the new student?
    options:
    - Surya
    - Mario
    - Gajaraj
    answer: Surya
    difficulty: 1
    hints:
    - He was good at badminton.
    - Mario and Gajaraj are from other stories.
    solution: 'Step 1: a new boy joined who loved games. Step 2: his name was Surya.'
    mistakes:
      Mario: c6e4_events
      Gajaraj: c6e4_events
  - prompt: Which word describes Prabhat's feeling after cheating?
    options:
    - Guilty
    - Proud
    - Excited
    answer: Guilty
    difficulty: 1
    hints:
    - He couldn't sleep.
    - He knew he did wrong.
    solution: 'Step 1: he was unhappy despite praise. Step 2: knowing you did wrong makes you feel guilty.'
    mistakes:
      Proud: c6e4_feel
      Excited: c6e4_feel
  - prompt: Surya happily played basketball though he wasn't good at it. What did this show Prabhat?
    options:
    - You can enjoy a game without being the best
    - Basketball is easy
    - Surya wanted to show off
    answer: You can enjoy a game without being the best
    difficulty: 2
    hints:
    - Surya might lose at basketball.
    - Yet he was happy.
    solution: 'Step 1: Surya wasn''t good at basketball. Step 2: he still enjoyed it, showing fun matters more than winning.'
    mistakes:
      Basketball is easy: c6e4_events
      Surya wanted to show off: c6e4_events
  - prompt: Which is an example of good sportsmanship?
    options:
    - Shaking hands with the winner after losing
    - Changing the score
    - Shouting at the referee
    answer: Shaking hands with the winner after losing
    difficulty: 1
    hints:
    - Sportsmanship means respect, win or lose.
    - Which action is respectful?
    solution: 'Step 1: cheating and shouting are unfair. Step 2: congratulating the winner shows sportsmanship.'
    mistakes:
      Changing the score: c6e4_fair
      Shouting at the referee: c6e4_fair
  - prompt: Why did the classmates praise Prabhat?
    options:
    - They didn't know he had cheated
    - He played honestly
    - He lost bravely
    answer: They didn't know he had cheated
    difficulty: 2
    hints:
    - Surya was distracted when it happened.
    - Did others see?
    solution: 'Step 1: Prabhat changed the score secretly. Step 2: so classmates thought he won fairly.'
    mistakes:
      He played honestly: c6e4_fair
      He lost bravely: c6e4_fair
  - prompt: 'In the story, ''distracted'' means:'
    options:
    - Not paying attention
    - Very angry
    - Fast asleep
    answer: Not paying attention
    difficulty: 2
    hints:
    - Surya didn't notice the score change.
    - His attention was elsewhere.
    solution: 'Step 1: Surya missed what Prabhat did. Step 2: being distracted means not paying attention.'
    mistakes:
      Very angry: c6e4_feel
      Fast asleep: c6e4_feel
  - prompt: What is the best ending for a person like Prabhat in real life?
    options:
    - Admit the cheating and play fairly next time
    - Cheat again to win more
    - Stop playing forever
    answer: Admit the cheating and play fairly next time
    difficulty: 3
    hints:
    - What made him unhappy?
    - How can he feel at peace?
    solution: 'Step 1: dishonesty made him guilty. Step 2: owning up and playing fairly brings peace and respect.'
    mistakes:
      Cheat again to win more: c6e4_fair
      Stop playing forever: c6e4_fair
  - prompt: Who held the friendly match?
    options:
    - The coach
    - Prabhat's father
    - The principal
    answer: The coach
    difficulty: 2
    hints:
    - It was a school sports event.
    - Held on the last Friday of the month.
    solution: 'Step 1: the match was part of games practice. Step 2: the coach organised it.'
    mistakes:
      Prabhat's father: c6e4_events
      The principal: c6e4_events
- code: cbse6e.u4.winner
  title: The Winner (poem)
  notes: |
    A poem about the joy of play and traditional (indigenous) Indian games. It uses imagery and personification to show
    children playing freely outdoors, with sun, wind and grass joining in. The poem suggests that everyone who plays with
    joy is a winner: what matters is taking part, effort and fun, not just coming first. Themes: play, joy, togetherness,
    traditional games.
  explanations:
    text: This poem celebrates playing outdoors and traditional games. It describes the fun so vividly that even the sun and wind seem to join in. Its message is that playing with joy and effort makes everyone a winner, not just the one who comes first.
    visual: Picture children playing kho-kho and gilli-danda in a dusty field, the sun smiling down and the wind racing alongside them.
    step_by_step: 'Step 1: Find what the children are doing. Step 2: Spot the images: sights, sounds, movement. Step 3: Find where nature acts like a person (personification). Step 4: Work out who the ''winner'' really is.'
    real_world: Traditional games like kho-kho and kabaddi are now played in national leagues, but they started as village games anyone could play.
  picture:
    kind: compare
    columns:
    - title: In the poem
      points:
      - children playing outdoors
      - nature joins in
      - traditional games
    - title: The message
      points:
      - joy of play
      - effort matters
      - everyone can win
    alt: The poem shows children playing traditional games outdoors with nature joining in; its message is that joy and effort make everyone a winner.
  activity:
    type: sort
    prompt: 'The Winner: what makes someone a winner in the poem?'
    bins:
    - Makes a winner
    - Not the point
    items:
    - label: Playing with joy
      bin: Makes a winner
      clue: What the children feel.
      why: The poem says those who play with joy win.
    - label: Coming first
      bin: Not the point
      clue: Is that all that matters?
      why: The poem says winning isn't only coming first.
    - label: Taking part
      bin: Makes a winner
      clue: Joining in.
      why: Taking part makes you a winner here.
    - label: Beating everyone else
      bin: Not the point
      clue: Compare with 'togetherness'.
      why: Beating others goes against the poem's idea of playing together.
    - label: Effort and fun together
      bin: Makes a winner
      clue: Trying, and enjoying it.
      why: Effort and fun are what the poem praises.
  lesson:
    - teach: '''The Winner'' is a poem about the joy of play and traditional Indian games like kho-kho and kabaddi. Children play freely outdoors and have fun together.'
      check:
        prompt: Which is a traditional Indian game?
        options:
        - Kabaddi
        - Ice hockey
        - Baseball
        answer: Kabaddi
        why: Kabaddi is an old Indian game.
    - teach: 'The poet uses personification, giving human actions to things: the sun smiles, the wind joins the race. The poem also uses imagery: words that help you see, hear and feel the scene, like green grass and shouting voices.'
      picture:
        kind: compare
        columns:
        - title: Personification
          points:
          - the sun smiles
          - the wind runs along
        - title: Imagery
          points:
          - soft green grass
          - happy shouts
        alt: Personification makes the sun smile and the wind run; imagery helps us see the grass and hear the shouts.
      check:
        prompt: '''The breeze whispered to the trees'' is an example of:'
        options:
        - Personification
        - A fact
        - A recipe
        answer: Personification
        why: A breeze cannot really whisper; it is given a human action.
    - teach: 'The poem''s message: everyone who plays with joy and effort is a winner. Taking part, trying hard and having fun matter more than coming first.'
      check:
        prompt: According to the poem, who is a winner?
        options:
        - Everyone who plays with joy and effort
        - Only the one who comes first
        - Nobody
        answer: Everyone who plays with joy and effort
        why: The poet redefines winning.
  items:
  - prompt: 'The poem is mainly about:'
    options:
    - the joy of playing
    - doing homework
    - a royal palace
    - cooking food
    answer: the joy of playing
    difficulty: 1
    hints:
    - Games.
    - Fun.
    solution: It celebrates the joy of play.
    mistakes: {"doing homework": "e6_play_joy"}
  - prompt: 'Giving human actions to things like the sun or wind is called:'
    options:
    - personification
    - rhyme
    - a simile only
    - a full stop
    answer: personification
    difficulty: 2
    hints:
    - Person-ify.
    - Acting like people.
    solution: That is personification.
    mistakes: {"rhyme": "e6_personification"}
  - prompt: According to the poem, who is a 'winner'?
    options:
    - Anyone who plays with joy and effort
    - Only the one who comes first
    - Only adults
    - Nobody
    answer: Anyone who plays with joy and effort
    difficulty: 2
    hints:
    - Think beyond prizes.
    - Joy.
    solution: Everyone who plays joyfully is a winner.
    mistakes:
      Only the one who comes first: eng6_poem_meaning
  - prompt: Which is a traditional Indian game?
    options:
    - Kho-kho
    - Ice hockey
    - Baseball
    - Rugby
    answer: Kho-kho
    difficulty: 1
    hints:
    - Played in schools.
    - Chasing game.
    solution: Kho-kho is a traditional Indian game.
    mistakes: {"Ice hockey": "e6_kho_kho"}
  - prompt: 'Words that help you see, hear or feel a scene are called:'
    options:
    - imagery
    - grammar
    - spelling
    - numbers
    answer: imagery
    difficulty: 2
    hints:
    - Pictures in words.
    - Images.
    solution: That is imagery.
    mistakes: {"grammar": "e6_imagery"}
  - prompt: What is one benefit of outdoor play shown in the poem?
    options:
    - Joy and togetherness
    - Loneliness
    - Sadness
    - Boredom
    answer: Joy and togetherness
    difficulty: 1
    hints:
    - Playing with others.
    - Happiness.
    solution: Outdoor play brings joy and togetherness.
    mistakes: {"Loneliness": "e6_play_benefit"}
  - prompt: 'In kho-kho, players mainly need to:'
    options:
    - Chase and dodge quickly
    - Swim
    - Throw a heavy ball far
    answer: Chase and dodge quickly
    difficulty: 2
    hints:
    - One team chases, the other runs.
    - Quick turns matter.
    solution: 'Step 1: kho-kho is a chasing game. Step 2: players must run, chase and dodge.'
    mistakes:
      Swim: c6e4_poem
      Throw a heavy ball far: c6e4_poem
  - prompt: '''The sun laughed down on the players'' uses:'
    options:
    - Personification
    - A question
    - A number
    answer: Personification
    difficulty: 1
    hints:
    - Can the sun really laugh?
    - A human action given to a thing.
    solution: 'Step 1: the sun cannot laugh. Step 2: giving it a human action is personification.'
    mistakes:
      A question: c6e4_device
      A number: c6e4_device
  - prompt: '''Muddy feet and dusty knees'' is an example of:'
    options:
    - Imagery
    - Personification
    - A rule
    answer: Imagery
    difficulty: 2
    hints:
    - It helps you picture the players.
    - Nothing acts like a person here.
    solution: 'Step 1: the words create a picture in your mind. Step 2: that is imagery.'
    mistakes:
      Personification: c6e4_device
      A rule: c6e4_device
  - prompt: Which feeling fills the poem?
    options:
    - Joy
    - Fear
    - Sadness
    answer: Joy
    difficulty: 1
    hints:
    - Children are playing freely.
    - Laughter and fun.
    solution: 'Step 1: the poem shows happy play. Step 2: its main feeling is joy.'
    mistakes:
      Fear: c6e4_poem
      Sadness: c6e4_poem
  - prompt: Why might the poet call the game's last runner a winner too?
    options:
    - She played with full effort and joy
    - She cheated
    - She didn't play
    answer: She played with full effort and joy
    difficulty: 2
    hints:
    - Winning here is not only first place.
    - What makes a winner in the poem?
    solution: 'Step 1: the poem values effort and joy. Step 2: so even the last runner who tried happily is a winner.'
    mistakes:
      She cheated: c6e4_poem
      She didn't play: c6e4_poem
  - prompt: Which benefit of outdoor games does the poem suggest?
    options:
    - Fitness, friendship and happiness
    - Less time with friends
    - Staying indoors more
    answer: Fitness, friendship and happiness
    difficulty: 1
    hints:
    - Children play together outside.
    - Think body, friends and mood.
    solution: 'Step 1: outdoor play moves the body. Step 2: it also brings friends together and joy.'
    mistakes:
      Less time with friends: c6e4_poem
      Staying indoors more: c6e4_poem
  - prompt: How are 'The Winner' and 'Change of Heart' connected?
    options:
    - Both say joy and fair play matter more than just winning
    - Both are about cooking
    - Both praise cheating
    answer: Both say joy and fair play matter more than just winning
    difficulty: 3
    hints:
    - What did Prabhat learn?
    - Who is a winner in the poem?
    solution: 'Step 1: Prabhat learns that enjoying the game matters most. Step 2: the poem says anyone who plays with joy wins: same idea.'
    mistakes:
      Both are about cooking: c6e4_poem
      Both praise cheating: c6e4_fair
  - prompt: 'Kabaddi, kho-kho and gilli-danda are called indigenous games. ''Indigenous'' means:'
    options:
    - Belonging to a place from long ago
    - Played only on computers
    - Brought from another country recently
    answer: Belonging to a place from long ago
    difficulty: 2
    hints:
    - These games are old Indian games.
    - They started here.
    solution: 'Step 1: these games began in India long ago. Step 2: ''indigenous'' means native to a place.'
    mistakes:
      Played only on computers: c6e4_device
      Brought from another country recently: c6e4_device
  - prompt: '''The wind raced with the children'' gives the wind a human action. What does it make you feel?'
    options:
    - That nature is joining the fun
    - That the wind is dangerous
    - That the game stopped
    answer: That nature is joining the fun
    difficulty: 3
    hints:
    - Racing is something children do.
    - The wind becomes a playmate.
    solution: 'Step 1: the wind is shown racing like a child. Step 2: this makes nature seem part of the happy game.'
    mistakes:
      That the wind is dangerous: c6e4_device
      That the game stopped: c6e4_device
- code: cbse6e.u4.yoga
  title: 'Yoga: A Way of Life'
  notes: |
    An informative chapter on yoga, an ancient Indian practice for body, mind and breath. The sage Patanjali compiled the
    Yoga Sutras. Parts: asanas (postures: tadasana, vrikshasana), pranayama (breath control), dhyana (meditation). Benefits:
    flexibility, strength, balance, better concentration, calmness, less stress. Practise on an empty stomach, slowly, on a
    mat, without forcing. The United Nations declared 21 June International Day of Yoga (first held 2015).
  explanations:
    text: Yoga is an ancient Indian practice that keeps the body, mind and breath healthy. The sage Patanjali wrote the Yoga Sutras. Yoga includes postures (asanas), breathing exercises (pranayama) and meditation. It makes us flexible, strong and calm. The world celebrates International Day of Yoga on 21 June.
    visual: Picture a child on a mat in vrikshasana (tree pose), standing on one leg, hands joined above the head, eyes calm, breathing slowly.
    step_by_step: 'Step 1: Find a quiet place and a mat. Step 2: Start slowly with simple asanas. Step 3: Breathe deeply and steadily. Step 4: Never force a pose. Step 5: End with a few minutes of quiet sitting.'
    real_world: Many Indian schools start the day with a few minutes of yoga and pranayama to help students focus.
  picture:
    kind: compare
    columns:
    - title: Part of yoga
      points:
      - Asana
      - Pranayama
      - Dhyana
    - title: What it is
      points:
      - body postures
      - breath control
      - meditation
    alt: Asanas are body postures, pranayama is breath control and dhyana is meditation.
  activity:
    type: sort
    prompt: 'Yoga: A Way of Life: which part of yoga?'
    bins:
    - Asana
    - Pranayama
    - Dhyana
    items:
    - label: Tadasana
      bin: Asana
      clue: A standing posture.
      why: 'Tadasana (mountain pose) is a posture: an asana.'
    - label: Slow, deep breathing in and out
      bin: Pranayama
      clue: Controlling the breath.
      why: Breath control is pranayama.
    - label: Sitting still with a calm mind
      bin: Dhyana
      clue: Meditation.
      why: Calm focus of the mind is dhyana.
    - label: Vrikshasana
      bin: Asana
      clue: Tree pose, standing on one leg.
      why: 'Vrikshasana is a balancing posture: an asana.'
    - label: Focusing on one thought quietly
      bin: Dhyana
      clue: The mind, not the body.
      why: Quiet focus is meditation, dhyana.
  lesson:
    - teach: Yoga is an ancient Indian practice for body, mind and breath. Sage Patanjali compiled the Yoga Sutras, an old guide to yoga.
      check:
        prompt: 'Yoga works on:'
        options:
        - Body, mind and breath
        - Only muscles
