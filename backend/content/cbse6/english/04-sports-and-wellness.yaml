concepts:
- code: cbse6e.u4.heart
  title: Change of Heart
  notes: |
    Prabhat cannot bear to lose; he plays only games he is sure to win. A new student, Surya, plays badminton well and enjoys
    every game, win or lose. In a friendly match (held by the coach on the last Friday of the month), Prabhat changes the
    score while Surya is distracted and 'wins'. Classmates praise him, but he feels unhappy and cannot sleep. Watching Surya
    enjoy games he is not good at, like basketball, Prabhat realises that enjoying the game matters more than winning. He
    begins to play for fun and honestly. Moral: sportsmanship and fair play matter more than victory.
  explanations:
    text: Prabhat hates losing. In a badminton match against Surya, a new student, he secretly changes the score and wins. But the win doesn't make him happy; he can't even sleep. Watching Surya enjoy games whether he wins or loses, Prabhat realises that playing fair and having fun matter more than winning.
    visual: 'Picture a badminton court: Surya turned away, and Prabhat quietly changing the scoreboard. Then Prabhat lying awake at night, and later laughing during a game of hide and seek.'
    step_by_step: 'Step 1: Prabhat''s problem: he must win. Step 2: The match and the cheating. Step 3: His unhappiness. Step 4: Learning from Surya. Step 5: His change of heart.'
    real_world: 'Great athletes are remembered for fair play too: shaking hands with opponents and accepting results gracefully.'
  picture:
    kind: flow
    steps:
    - Prabhat must always win
    - Badminton match with Surya
    - Prabhat changes the score
    - He feels unhappy, can't sleep
    - He learns to play for fun
    alt: Prabhat must win, cheats in a badminton match with Surya, feels miserable, and learns to play for fun.
  activity:
    type: order
    prompt: 'Change of Heart: put Prabhat''s change in order.'
    steps:
    - Prabhat plays only games he can win
    - Surya joins and enjoys every game
    - Prabhat changes the score and 'wins'
    - He feels unhappy and cannot sleep
    - He sees Surya enjoy games he is bad at
    - He starts to play honestly, for fun
    reasons:
      Surya joins and enjoys every game: A new boy shows a different way to play.
      Prabhat changes the score and 'wins': Afraid to lose the match, he cheats.
      He feels unhappy and cannot sleep: His win was not honest.
      He sees Surya enjoy games he is bad at: He watches Surya play basketball for fun.
      He starts to play honestly, for fun: Surya shows him joy matters more than winning.
  lesson:
    - teach: In 'Change of Heart', Prabhat cannot bear to lose, so he only plays games he is sure to win. A new student, Surya, plays badminton well and enjoys every game, win or lose.
      check:
        prompt: How is Surya different from Prabhat?
        options:
        - Surya enjoys playing whether he wins or loses
        - Surya never plays
        - Surya cheats
        answer: Surya enjoys playing whether he wins or loses
        why: Surya plays for fun; Prabhat plays only to win.
      ways:
      - style: visual
        teach: Two players at the start of 'Change of Heart', side by side.
        picture:
          kind: compare
          columns:
          - title: Prabhat
            points:
            - Cannot bear to lose
            - Plays only games he is sure to win
          - title: Surya
            points:
            - New to the school
            - Plays badminton well
            - Enjoys every game, win or lose
          alt: Prabhat cannot bear to lose and plays only games he is sure to win. Surya, new to the school, plays badminton well and enjoys every game, win or lose.
      - style: real_world
        teach: Some children will only play a board game they always win, and walk away from any game they might lose. They miss a lot of fun, and they never get better at the new games. That is where Prabhat is at the start.
    - teach: 'In a friendly badminton match, Prabhat changes the score while Surya is distracted, and ''wins''. Classmates praise him, but he feels unhappy and cannot sleep: he feels guilty.'
      picture:
        kind: flow
        steps:
        - Match begins
        - Surya distracted
        - Prabhat changes score
        - Prabhat 'wins'
        - Feels guilty, can't sleep
        alt: Prabhat changes the score to win, but then feels guilty and cannot sleep.
      check:
        prompt: Why couldn't Prabhat enjoy his win?
        options:
        - He knew he had cheated
        - He was ill
        - He lost the match
        answer: He knew he had cheated
        why: A dishonest win brings guilt, not joy.
      ways:
      - style: visual
        teach: What happens after Prabhat's dishonest 'win'.
        picture:
          kind: flow
          steps:
          - Prabhat changes the score while Surya looks away
          - He 'wins' the match
          - Classmates praise him
          - At night he cannot sleep
          - Guilt shows him the win was empty
          alt: Prabhat changes the score while Surya looks away and wins the match. Classmates praise him, but at night he cannot sleep; guilt shows him the win was empty.
      - style: real_world
        teach: Imagine copying answers in a class quiz and getting full marks. The teacher praises you in front of everyone, but the praise feels uncomfortable, because you know it was not earned. That uneasy feeling is guilt, the same feeling that keeps Prabhat awake.
    - teach: 'Watching Surya happily play basketball, a game he isn''t good at, Prabhat realises that enjoying the game matters more than winning. He starts playing honestly and for fun. This is sportsmanship: fair play and respect, win or lose.'
      check:
        prompt: What is the 'change of heart' in the title?
        options:
        - Prabhat learns to value fair play over winning
        - Prabhat gets a heart illness
        - Surya starts cheating
        answer: Prabhat learns to value fair play over winning
        why: His attitude to games changes.
      ways:
      - style: step_by_step
        teach: 'Step 1: Prabhat watches Surya play basketball, a game Surya is not good at. Step 2: Surya is laughing and having fun anyway. Step 3: Prabhat sees that joy in a game does not depend on winning. Step 4: He begins to play honestly and for fun. His heart has changed, which gives the story its title.'
      - style: visual
        teach: Prabhat before and after his change of heart.
        picture:
          kind: compare
          columns:
          - title: Before
            points:
            - Plays only games he is sure to win
            - Changes the score to win
            - Feels guilty
          - title: After
            points:
            - Plays honestly
            - Plays for fun
            - Enjoys the game, win or lose
          alt: Before, Prabhat plays only games he is sure to win, changes the score and feels guilty. After his change of heart, he plays honestly and for fun and enjoys the game, win or lose.
  items:
  - prompt: What was Prabhat's problem?
    options:
    - "He could not bear to lose"
    - "He could not run very fast"
    - "He had no racket of his own"
    - "He hated going to school"
    answer: He could not bear to lose
    difficulty: 1
    hints:
    - Winning obsession.
    - Only safe games.
    solution: "Prabhat could not bear to lose and got upset whenever a game went against him."
    mistakes:
      "He had no racket of his own": eng6_read_again
  - prompt: Which game did Prabhat and Surya play in the match?
    options:
    - Badminton
    - Cricket
    - Football
    - Chess
    answer: Badminton
    difficulty: 1
    hints:
    - Shuttlecock.
    - Rackets.
    solution: "Prabhat and Surya faced each other in a badminton match."
    mistakes: {"Cricket": "e6_badminton"}
  - prompt: How did Prabhat win the match?
    options:
    - "He changed the score when Surya was distracted"
    - "He played very well and won the match fairly"
    - "Surya let him win on purpose, to be kind"
    - "It rained, and the match was stopped early"
    answer: He changed the score when Surya was distracted
    difficulty: 1
    hints:
    - Not fair.
    - Cheating.
    solution: He cheated by changing the score.
    mistakes: {"He played very well and won the match fairly": "e6_cheat"}
  - prompt: How did Prabhat feel after winning?
    options:
    - "Unhappy and unable to sleep"
    - "Proud and peaceful inside"
    - "Hungry and ready for dinner"
    - "Sleepy and tired from playing"
    answer: Unhappy and unable to sleep
    difficulty: 2
    hints:
    - Guilt.
    - Night.
    solution: He felt guilty and couldn't sleep.
    mistakes: {"Proud and peaceful inside": "e6_guilt"}
  - prompt: What did Prabhat learn from Surya?
    options:
    - "Enjoying the game matters more than winning"
    - "Cheating is a clever way to win any game"
    - "Badminton is a boring game for children"
    - "Never play basketball if you are not good"
    answer: Enjoying the game matters more than winning
    difficulty: 2
    hints:
    - Surya enjoyed games he lost.
    - Fun.
    solution: He learned to value enjoyment and fair play.
    mistakes:
      "Cheating is a clever way to win any game": eng6_whole_story
  - prompt: '''Sportsmanship'' means:'
    options:
    - "playing fairly and respecting others, win or lose"
    - "always winning every game, whatever it takes"
    - "buying the best sports shoes in the shop"
    - "shouting at the referees when you lose"
    answer: playing fairly and respecting others, win or lose
    difficulty: 2
    hints:
    - Fair play.
    - Grace.
    solution: Sportsmanship is fair, respectful play.
    mistakes: {"always winning every game, whatever it takes": "e6_sportsmanship"}
  - prompt: Why did Prabhat avoid some games?
    options:
    - He was afraid of losing them
    - He was too tired
    - His parents stopped him
    answer: He was afraid of losing them
    difficulty: 1
    hints:
    - He played only games he was sure to win.
    - What did he fear?
    solution: 'Step 1: Prabhat chose only sure wins. Step 2: so he avoided games he might lose.'
    mistakes:
      He was too tired: c6e4_events
      His parents stopped him: c6e4_events
  - prompt: Who was the new student?
    options:
    - Surya
    - Mario
    - Gajaraj
    answer: Surya
    difficulty: 1
    hints:
    - He was good at badminton.
    - Mario and Gajaraj are from other stories.
    solution: 'Step 1: a new boy joined who loved games. Step 2: his name was Surya.'
    mistakes:
      Mario: c6e4_events
      Gajaraj: c6e4_events
  - prompt: Which word describes Prabhat's feeling after cheating?
    options:
    - Guilty
    - Proud
    - Excited
    answer: Guilty
    difficulty: 1
    hints:
    - He couldn't sleep.
    - He knew he did wrong.
    solution: 'Step 1: he was unhappy despite praise. Step 2: knowing you did wrong makes you feel guilty.'
    mistakes:
      Proud: c6e4_feel
      Excited: c6e4_feel
  - prompt: Surya happily played basketball though he wasn't good at it. What did this show Prabhat?
    options:
    - "You can enjoy a game without being the best"
    - "Basketball is a very easy game for anyone"
    - "Surya only wanted to show off to others"
    answer: You can enjoy a game without being the best
    difficulty: 2
    hints:
    - Surya might lose at basketball.
    - Yet he was happy.
    solution: 'Step 1: Surya wasn''t good at basketball. Step 2: he still enjoyed it, showing fun matters more than winning.'
    mistakes:
      "Basketball is a very easy game for anyone": c6e4_events
      "Surya only wanted to show off to others": c6e4_events
  - prompt: Which is an example of good sportsmanship?
    options:
    - "Shaking hands with the winner after losing"
    - "Changing the score when nobody is looking"
    - "Shouting at the referee after a bad call"
    answer: Shaking hands with the winner after losing
    difficulty: 1
    hints:
    - Sportsmanship means respect, win or lose.
    - Which action is respectful?
    solution: 'Step 1: cheating and shouting are unfair. Step 2: congratulating the winner shows sportsmanship.'
    mistakes:
      "Changing the score when nobody is looking": c6e4_fair
      "Shouting at the referee after a bad call": c6e4_fair
  - prompt: Why did the classmates praise Prabhat?
    options:
    - "They didn't know he had cheated"
    - "He had played honestly all through"
    - "He had lost the match bravely"
    answer: They didn't know he had cheated
    difficulty: 2
    hints:
    - Surya was distracted when it happened.
    - Did others see?
    solution: 'Step 1: Prabhat changed the score secretly. Step 2: so classmates thought he won fairly.'
    mistakes:
      "He had played honestly all through": c6e4_fair
      "He had lost the match bravely": c6e4_fair
  - prompt: 'In the story, ''distracted'' means:'
    options:
    - Not paying attention
    - Very angry
    - Fast asleep
    answer: Not paying attention
    difficulty: 2
    hints:
    - Surya didn't notice the score change.
    - His attention was elsewhere.
    solution: 'Step 1: Surya missed what Prabhat did. Step 2: being distracted means not paying attention.'
    mistakes:
      Very angry: c6e4_feel
      Fast asleep: c6e4_feel
  - prompt: What is the best ending for a person like Prabhat in real life?
    options:
    - "Admit the cheating and play fairly next time"
    - "Cheat again next time to win even more"
    - "Stop playing any games for ever after"
    answer: Admit the cheating and play fairly next time
    difficulty: 3
    hints:
    - What made him unhappy?
    - How can he feel at peace?
    solution: 'Step 1: dishonesty made him guilty. Step 2: owning up and playing fairly brings peace and respect.'
    mistakes:
      "Cheat again next time to win even more": c6e4_fair
      "Stop playing any games for ever after": c6e4_fair
  - prompt: Who held the friendly match?
    options:
    - The coach
    - Prabhat's father
    - The principal
    answer: The coach
    difficulty: 2
    hints:
    - It was a school sports event.
    - Held on the last Friday of the month.
    solution: 'Step 1: the match was part of games practice. Step 2: the coach organised it.'
    mistakes:
      Prabhat's father: c6e4_events
      The principal: c6e4_events
  - prompt: 'Assertion (A): Prabhat could not sleep after the badminton match.

      Reason (R): He knew he had won by changing the score.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. His guilt about the dishonest win kept him awake; R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Surya enjoyed only the games he could win.

      Reason (R): Surya happily played basketball, a game he was not good at.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: Surya enjoyed games whether he won or not, as R shows. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In a chess match at school, Arjun sees that the opponent has left the room and quietly moves a piece back to escape a checkmate. Later Arjun wins but feels uneasy all evening. Which character in the story is Arjun like?'
    options:
    - "Prabhat after the badminton match"
    - "Surya playing his game of basketball"
    - "The coach watching from the side"
    answer: Prabhat after the badminton match
    hints:
    - What did Arjun do while the opponent was away?
    - Who in the story won unfairly and then felt bad?
    solution: Arjun cheated while the opponent was away and then felt uneasy. Prabhat did the same in badminton and could not sleep because of guilt.
    mistakes:
      "Surya playing his game of basketball": c6e4_fair
      "The coach watching from the side": c6e4_fair
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your team loses the final of a football match by one goal. Which action best shows sportsmanship?'
    options:
    - "Congratulating the other team and resolving to practise more"
    - "Blaming the referee loudly in front of everyone at the ground"
    - "Refusing ever to play football again after losing the final"
    answer: Congratulating the other team and resolving to practise more
    hints:
    - What does sportsmanship ask of you when you lose?
    - Which choice is fair and respectful?
    solution: Sportsmanship means fair play and respect, win or lose. Congratulating the winners and planning to improve shows both.
    mistakes:
      "Blaming the referee loudly in front of everyone at the ground": c6e4_fair
      "Refusing ever to play football again after losing the final": c6e4_fair
    exam: competency
    difficulty: 2
- code: cbse6e.u4.winner
  title: The Winner (poem)
  notes: |
    A poem about the joy of play and traditional (indigenous) Indian games. It uses imagery and personification to show
    children playing freely outdoors, with sun, wind and grass joining in. The poem suggests that everyone who plays with
    joy is a winner: what matters is taking part, effort and fun, not just coming first. Themes: play, joy, togetherness,
    traditional games.
  explanations:
    text: This poem celebrates playing outdoors and traditional games. It describes the fun so vividly that even the sun and wind seem to join in. Its message is that playing with joy and effort makes everyone a winner, not just the one who comes first.
    visual: Picture children playing kho-kho and gilli-danda in a dusty field, the sun smiling down and the wind racing alongside them.
    step_by_step: 'Step 1: Find what the children are doing. Step 2: Spot the images: sights, sounds, movement. Step 3: Find where nature acts like a person (personification). Step 4: Work out who the ''winner'' really is.'
    real_world: Traditional games like kho-kho and kabaddi are now played in national leagues, but they started as village games anyone could play.
  picture:
    kind: compare
    columns:
    - title: In the poem
      points:
      - children playing outdoors
      - nature joins in
      - traditional games
    - title: The message
      points:
      - joy of play
      - effort matters
      - everyone can win
    alt: The poem shows children playing traditional games outdoors with nature joining in; its message is that joy and effort make everyone a winner.
  activity:
    type: sort
    prompt: 'The Winner: what makes someone a winner in the poem?'
    bins:
    - Makes a winner
    - Not the point
    items:
    - label: Playing with joy
      bin: Makes a winner
      clue: What the children feel.
      why: The poem says those who play with joy win.
    - label: Coming first
      bin: Not the point
      clue: Is that all that matters?
      why: The poem says winning isn't only coming first.
    - label: Taking part
      bin: Makes a winner
      clue: Joining in.
      why: Taking part makes you a winner here.
    - label: Beating everyone else
      bin: Not the point
      clue: Compare with 'togetherness'.
      why: Beating others goes against the poem's idea of playing together.
    - label: Effort and fun together
      bin: Makes a winner
      clue: Trying, and enjoying it.
      why: Effort and fun are what the poem praises.
  lesson:
    - teach: '''The Winner'' is a poem about the joy of play and traditional Indian games like kho-kho and kabaddi. Children play freely outdoors and have fun together.'
      check:
        prompt: 'Quick check: Which is a traditional Indian game?'
        options:
        - Kabaddi
        - Ice hockey
        - Baseball
        answer: Kabaddi
        why: Kabaddi is an old Indian game.
      ways:
      - style: visual
        teach: The scene the poem paints, from the end of school to going home.
        picture:
          kind: flow
          steps:
          - School ends for the day
          - Children run out to an open field
          - Games of kho-kho and kabaddi begin
          - Shouts and laughter fill the air
          - Everyone goes home tired and happy
          alt: School ends, children run out to an open field, games of kho-kho and kabaddi begin, shouts and laughter fill the air, and everyone goes home tired and happy.
      - style: real_world
        teach: Many grandparents remember long summer evenings of gilli-danda, kho-kho and hide-and-seek, played outdoors until it was too dark to see. Those games needed only friends and an open space. The poem celebrates that same joy.
    - teach: 'The poet uses personification, giving human actions to things: the sun smiles, the wind joins the race. The poem also uses imagery: words that help you see, hear and feel the scene, like green grass and shouting voices.'
      picture:
        kind: compare
        columns:
        - title: Personification
          points:
          - the sun smiles
          - the wind runs along
        - title: Imagery
          points:
          - soft green grass
          - happy shouts
        alt: Personification makes the sun smile and the wind run; imagery helps us see the grass and hear the shouts.
      check:
        prompt: '''The breeze whispered to the trees'' is an example of:'
        options:
        - Personification
        - A fact
        - A recipe
        answer: Personification
        why: A breeze cannot really whisper; it is given a human action.
      ways:
      - style: visual
        teach: Two tools the poet uses in the poem, side by side.
        picture:
          kind: compare
          columns:
          - title: Personification
            points:
            - A thing acts like a person
            - 'Example: the trees clapped their leaves'
          - title: Imagery
            points:
            - Words you can see, hear or feel
            - 'Example: the thud of running feet'
          alt: Personification makes a thing act like a person, for example the trees clapped their leaves. Imagery uses words you can see, hear or feel, for example the thud of running feet.
      - style: step_by_step
        teach: 'Step 1: Read the line. Step 2: Ask whether something that is not a person is doing a person''s action, such as smiling or racing. If so, it is personification. Step 3: Ask whether the words make you see a colour, hear a sound or feel a touch. If so, it is imagery. Step 4: Some lines do both.'
    - teach: 'The poem''s message: everyone who plays with joy and effort is a winner. Taking part, trying hard and having fun matter more than coming first.'
      check:
        prompt: According to the poem, who is a winner?
        options:
        - Everyone who plays with joy and effort
        - Only the one who comes first
        - Nobody
        answer: Everyone who plays with joy and effort
        why: The poet redefines winning.
      ways:
      - style: visual
        teach: What makes someone a winner, in the poem's view.
        picture:
          kind: compare
          columns:
          - title: A winner only by result
            points:
            - Comes first
            - Gets the prize
          - title: A winner in the poem
            points:
            - Takes part
            - Tries hard
            - Plays with joy
          alt: A winner only by result comes first and gets the prize. A winner in the poem takes part, tries hard and plays with joy.
      - style: real_world
        teach: At a school sports day, a child who has been ill all month still runs the race and finishes, smiling, well behind the others. The poem would call that child a winner too, for taking part and trying.
  items:
  - prompt: 'The poem is mainly about:'
    options:
    - the joy of playing
    - doing homework
    - a royal palace
    - cooking food
    answer: the joy of playing
    difficulty: 1
    hints:
    - Games.
    - Fun.
    solution: It celebrates the joy of play.
    mistakes: {"doing homework": "e6_play_joy"}
  - prompt: 'Giving human actions to things like the sun or wind is called:'
    options:
    - personification
    - rhyme
    - a simile only
    - a full stop
    answer: personification
    difficulty: 2
    hints:
    - Person-ify.
    - Acting like people.
    solution: "Writing as if things like the sun or wind act like people ('the wind whispered') is personification."
    mistakes: {"rhyme": "e6_personification"}
  - prompt: According to the poem, who is a 'winner'?
    options:
