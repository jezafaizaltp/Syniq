# CBSE Class 6 English (NCERT Poorvi, 2024-25), unit 2. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse6-eng
chapter: 2
title: 'Friendship: The Unlikely Best Friends · A Friend''s Prayer · The Chair'
tips:
  e6_buntee: "Buntee is a small animal that barks."
  e6_classmates_laugh: "Most classmates did not help. Only a few did. What did the rest do?"
  e6_empathy: "Empathy is about feelings, not strength. It means feeling with someone else."
  e6_gajaraj: "Gajaraj had plenty to eat. What was missing in his life before Buntee came?"
  e6_hard_times: "The speaker loves the friend. What would they wish for in bad times?"
  e6_invisible_chair: "Grandpa's test was a strange object that no one could see."
  e6_prayer_form: "The poem is a wish spoken for a friend, as if asking a higher power."
  e6_prayer_message: "The whole poem is about caring for a friend. What does it say a good friend wants?"
  e6_quality: "Mario learned he had only a few real friends, and that was enough."
  e6_separated: "They missed each other so much that it showed in how they ate."
  e6_three_friends: "Only a few children stood by Mario. Count them in the story."
  e6_true_friend: "The poem praises a friend who stays close in sad times."
  e6_unlikely_friends: "An elephant and a small dog became close friends. What does that show?"
  c6e2_events: Go back to the part of the story the question is about and check who did what.
  c6e2_feel: 'Look at what the character does: eating, playing, crying. Actions show feelings.'
  c6e2_word: Use the words around it to work out the meaning.
  c6e2_theme: Ask what the whole story or poem is saying about friends, not just one event.
  c6e2_poem: Read the poem as one person speaking to or about a friend. What do they wish and value?

concepts:
- code: cbse6e.u2.unlikely
  title: The Unlikely Best Friends
  notes: |
    Gajaraj, an elephant in a royal stable, has comfort and food but no friend; his mahout feeds and bathes him but does not
    play. One evening a hungry stray dog, Buntee, wanders in; Gajaraj shares his food and they become best friends, playing
    and splashing at bath time. A farmer, who owns Buntee, takes him away. Both friends are heartbroken and stop eating.
    Seeing Buntee so sad, the farmer lets him go back. The friends reunite joyfully, and the mahout and farmer become
    friends too. Theme: friendship across differences; kindness and empathy.
  explanations:
    text: Gajaraj the royal elephant has everything except a friend. When a hungry little dog, Buntee, wanders into his stable, Gajaraj shares his food and they become best friends. When Buntee is taken away, both stop eating. The farmer sees how sad Buntee is and lets him return. The friends are happy again.
    visual: Picture a huge grey elephant and a tiny brown dog sharing a heap of food, then splashing together at the river while the mahout laughs.
    step_by_step: 'Step 1: Gajaraj''s loneliness. Step 2: Buntee arrives; friendship begins. Step 3: Separation: both stop eating. Step 4: The farmer''s kindness. Step 5: Reunion.'
    real_world: Animals of different kinds sometimes become close friends, like the dog and elephant pairs people film in sanctuaries.
  picture:
    kind: flow
    steps:
    - Gajaraj is lonely
    - Buntee arrives; they share food
    - Buntee is taken away
    - Both stop eating
    - Farmer lets Buntee return
    alt: Gajaraj is lonely, befriends Buntee, they are separated and stop eating, and the farmer lets Buntee go back.
  activity:
    type: order
    prompt: 'The Unlikely Best Friends: put the story in order.'
    steps:
    - Gajaraj has food but no friend
    - Buntee wanders in and Gajaraj shares his food
    - They play and splash together at bath time
    - The farmer takes Buntee away
    - Both friends stop eating
    - The farmer lets Buntee go back
    reasons:
      Buntee wanders in and Gajaraj shares his food: A hungry dog arrives at the lonely elephant's stable.
      They play and splash together at bath time: Sharing food starts the friendship.
      The farmer takes Buntee away: Buntee's owner comes for him.
      Both friends stop eating: Being apart makes them both sad.
      The farmer lets Buntee go back: He sees how sad Buntee is.
  lesson:
    - teach: Gajaraj is an elephant in a royal stable. He has food and comfort, and a mahout who feeds and bathes him, but no friend to play with. He is lonely.
      check:
        prompt: What did Gajaraj lack?
        options:
        - A friend
        - Food
        - A home
        answer: A friend
        why: He had comfort but nobody to play with.
    - teach: One evening a hungry stray dog, Buntee, wanders in. Gajaraj shares his food, and the two become best friends who play and splash together at bath time.
      check:
        prompt: How did the friendship begin?
        options:
        - Gajaraj shared his food with hungry Buntee
        - Buntee rescued Gajaraj
        - The mahout brought a dog
        answer: Gajaraj shared his food with hungry Buntee
        why: A kind act started the friendship.
    - teach: A farmer who owns Buntee takes him away. Both friends stop eating. Seeing Buntee's sadness, the farmer lets him go back, and the friends reunite. The mahout and the farmer become friends too. Friendship can join very different beings.
      picture:
        kind: flow
        steps:
        - Lonely Gajaraj
        - Buntee arrives
        - Best friends
        - 'Separated: both stop eating'
        - Reunited
        alt: Lonely Gajaraj meets Buntee, they become friends, are separated and stop eating, then are reunited.
      check:
        prompt: What did the farmer learn?
        options:
        - Buntee needed his friend to be happy
        - Dogs don't like elephants
        - Elephants eat dogs
        answer: Buntee needed his friend to be happy
        why: Buntee's sadness showed how much the friendship mattered.
  items:
  - prompt: Who is Gajaraj?
    options:
    - A royal elephant
    - A stray dog
    - A farmer
    - A mahout
    answer: A royal elephant
    difficulty: 1
    hints:
    - Lives in a royal stable.
    - Big animal.
    solution: Gajaraj is an elephant.
    mistakes:
      A stray dog: eng6_read_again
  - prompt: Why was Gajaraj sad at first?
    options:
    - He had no friend
    - He had no food
    - He was ill
    - He was lost
    answer: He had no friend
    difficulty: 1
    hints:
    - He had comforts.
    - Lonely.
    solution: He had everything but a friend.
    mistakes: {"He had no food": "e6_gajaraj"}
  - prompt: Who is Buntee?
    options:
    - A dog
    - A cat
    - A horse
    - A parrot
    answer: A dog
    difficulty: 1
    hints:
    - Wandered into the stable.
    - Hungry.
    solution: Buntee is a dog.
    mistakes: {"A cat": "e6_buntee"}
  - prompt: What did Gajaraj and Buntee both do after being separated?
    options:
    - Stopped eating
    - Started dancing
    - Ran away together
    - Forgot each other
    answer: Stopped eating
    difficulty: 2
    hints:
    - They were heartbroken.
    - Food.
    solution: Both refused to eat.
    mistakes: {"Forgot each other": "e6_separated"}
  - prompt: Why did the farmer let Buntee go back?
    options:
    - He saw how unhappy Buntee was
    - Buntee bit him
    - The king ordered him
    - He did not like dogs
    answer: He saw how unhappy Buntee was
    difficulty: 2
    hints:
    - Empathy.
    - Buntee wouldn't eat.
    solution: The farmer cared about Buntee's happiness.
    mistakes:
      The king ordered him: eng6_whole_story
  - prompt: What does the story teach about friendship?
    options:
    - Friends can be very different from each other
    - Friends must be the same size
    - Only humans can be friends
    - Friendship doesn't matter
    answer: Friends can be very different from each other
    difficulty: 2
    hints:
    - An elephant and a dog.
    - Unlikely.
    solution: Friendship can cross every difference.
    mistakes: {"Friends must be the same size": "e6_unlikely_friends"}
  - prompt: Who looks after Gajaraj in the stable?
    options:
    - A mahout
    - A farmer
    - A teacher
    answer: A mahout
    difficulty: 1
    hints:
    - He feeds and bathes the elephant.
    - Elephant keepers have a special name.
    solution: 'Step 1: someone feeds and bathes Gajaraj. Step 2: an elephant keeper is a mahout.'
    mistakes:
      A farmer: c6e2_events
      A teacher: c6e2_events
  - prompt: 'In the story, ''stray'' (as in stray dog) means:'
    options:
    - Without a home, wandering
    - Very large
    - Well trained
    answer: Without a home, wandering
    difficulty: 1
    hints:
    - Buntee wandered in hungry.
    - Nobody seemed to look after him.
    solution: 'Step 1: Buntee was hungry and wandering. Step 2: a stray animal has no proper home.'
    mistakes:
      Very large: c6e2_word
      Well trained: c6e2_word
  - prompt: What did the friends enjoy doing together at bath time?
    options:
    - Playing and splashing
    - Sleeping
    - Fighting
    answer: Playing and splashing
    difficulty: 1
    hints:
    - Bath time means water.
    - Friends have fun.
    solution: 'Step 1: bath time had water. Step 2: they played and splashed together.'
    mistakes:
      Sleeping: c6e2_events
      Fighting: c6e2_events
  - prompt: How did Gajaraj feel when Buntee was taken away?
    options:
    - Heartbroken
    - Relieved
    - Excited
    answer: Heartbroken
    difficulty: 1
    hints:
    - He stopped eating.
    - He missed his friend.
    solution: 'Step 1: he stopped eating. Step 2: this shows he was heartbroken.'
    mistakes:
      Relieved: c6e2_feel
      Excited: c6e2_feel
  - prompt: Who took Buntee away from the stable?
    options:
    - A farmer
    - The mahout
    - The king
    answer: A farmer
    difficulty: 2
    hints:
    - Buntee turned out to have an owner.
    - He worked on the land.
    solution: 'Step 1: Buntee had an owner. Step 2: that owner, a farmer, took him away.'
    mistakes:
      The mahout: c6e2_events
      The king: c6e2_events
  - prompt: Why is the title 'The Unlikely Best Friends'?
    options:
    - An elephant and a dog are very different, yet became best friends
    - They never met
    - They were both dogs
    answer: An elephant and a dog are very different, yet became best friends
    difficulty: 2
    hints:
    - '''Unlikely'' means not expected.'
    - Think about their size and kind.
    solution: 'Step 1: a huge elephant and a small dog seem an odd pair. Step 2: so their friendship is ''unlikely''.'
    mistakes:
      They never met: c6e2_theme
      They were both dogs: c6e2_theme
  - prompt: What happened between the mahout and the farmer at the end?
    options:
    - They became friends too
    - They fought
    - They never met
    answer: They became friends too
    difficulty: 2
    hints:
    - The animals' friendship spread.
    - A happy ending for everyone.
    solution: 'Step 1: the animals reunited. Step 2: the two men also became friends.'
    mistakes:
      They fought: c6e2_events
      They never met: c6e2_events
  - prompt: Which quality did the farmer show by letting Buntee return?
    options:
    - Empathy
    - Greed
    - Anger
    answer: Empathy
    difficulty: 3
    hints:
    - He understood the dog's sadness.
    - He put Buntee's feelings first.
    solution: 'Step 1: he saw Buntee was unhappy. Step 2: understanding another''s feelings is empathy.'
    mistakes:
      Greed: c6e2_feel
      Anger: c6e2_feel
  - prompt: What can we learn from Gajaraj?
    options:
    - Sharing can begin a friendship
    - Never share food
    - Big animals don't need friends
    answer: Sharing can begin a friendship
    difficulty: 2
    hints:
    - What did Gajaraj do when Buntee arrived?
    - That act changed everything.
    solution: 'Step 1: Gajaraj shared his food. Step 2: that kindness started their friendship.'
    mistakes:
      Never share food: c6e2_theme
      Big animals don't need friends: c6e2_theme
- code: cbse6e.u2.prayer
  title: A Friend's Prayer (poem)
  notes: |
    A poem in the form of a prayer for a friend. The speaker is thankful for a friend and wishes good things for them:
    happiness, strength in hard times, success. It lists qualities of a true friend: listening, sharing joys and sorrows,
    standing by you, forgiving, being honest and kind. Themes: gratitude, empathy, loyalty; a good friend thinks of the
    other's well-being.
  explanations:
    text: 'In this poem, the speaker prays for their friend: for happiness, strength in difficult times and success. It shows what a true friend is like: someone who listens, shares joys and sorrows, stays loyal and is thankful for the friendship.'
    visual: 'Picture two friends sitting together; one is sad and the other has an arm around them, quietly listening. Above, soft words: ''May you be happy, may you be strong.'''
    step_by_step: 'Step 1: Who is speaking and to whom? Step 2: What does the speaker wish for the friend? Step 3: What qualities of friendship are shown? Step 4: What feeling runs through the poem: gratitude.'
    real_world: Making a card or saying 'thank you' to a friend who helped you is a small way of showing the same gratitude as the poem.
  picture:
    kind: compare
    columns:
    - title: A true friend
      points:
      - listens
      - shares joys and sorrows
      - stays loyal
    - title: The speaker wishes
      points:
      - happiness
      - strength in hard times
      - success
    alt: A true friend listens, shares joys and sorrows and stays loyal; the speaker wishes the friend happiness, strength and success.
  activity:
    type: sort
    prompt: 'A Friend''s Prayer: a wish for the friend, or what a true friend does?'
    bins:
    - Wish for the friend
    - What a true friend does
    items:
    - label: May you be happy
      bin: Wish for the friend
      clue: '''May you…'' hopes for something.'
      why: '''May you…'' is a wish for the friend''s well-being.'
    - label: Listens when you speak
      bin: What a true friend does
      clue: An action, not a hope.
      why: Listening is something a true friend does.
    - label: Strength in hard times
      bin: Wish for the friend
      clue: Something hoped for in difficulty.
      why: Hoping they are strong is a wish for them.
    - label: Stands by you
      bin: What a true friend does
      clue: Loyalty.
      why: Standing by someone is a friend's action.
    - label: Forgives and is honest
      bin: What a true friend does
      clue: Qualities shown in how they act.
      why: Forgiveness and honesty are how a true friend behaves.
    - label: Success in what you do
      bin: Wish for the friend
      clue: Something hoped for the future.
      why: Success is a good thing the speaker hopes for the friend.
  lesson:
    - teach: 'A Friend''s Prayer is a poem written as a prayer. The speaker thanks God for a friend and wishes good things for that friend: happiness, success and strength in hard times.'
      check:
        prompt: 'In this poem, the speaker mainly prays for:'
        options:
        - Their friend's well-being
        - Their own exam marks
        - More money
        answer: Their friend's well-being
        why: The wishes are all for the friend.
    - teach: 'The poem lists what a true friend does: listens, shares joys and sorrows, stands by you, forgives, and is honest and kind.'
      picture:
        kind: compare
        columns:
        - title: A true friend
          points:
          - listens
          - shares joys and sorrows
          - stands by you
        - title: Also
          points:
          - forgives
          - is honest
          - is kind
        alt: A true friend listens, shares joys and sorrows, stands by you, forgives, and is honest and kind.
      check:
        prompt: Which is a true friend's act from the poem?
        options:
        - Forgiving mistakes
        - Laughing when you fall
        - Keeping secrets from you to hurt you
        answer: Forgiving mistakes
        why: The poem values forgiveness.
    - teach: The main feelings are gratitude (thankfulness) and empathy (understanding another's feelings). A good friend thinks about the other's happiness, not only their own.
      check:
        prompt: '''Gratitude'' means:'
        options:
        - Thankfulness
        - Jealousy
        - Anger
        answer: Thankfulness
        why: The speaker is thankful for the friend.
  items:
  - prompt: 'The poem is written in the form of a:'
    options:
    - prayer
    - letter of complaint
    - recipe
    - news report
    answer: prayer
    difficulty: 1
    hints:
    - See the title.
    - Wishing good things.
    solution: It is a prayer for a friend.
    mistakes: {"letter of complaint": "e6_prayer_form"}
  - prompt: Which is a quality of a true friend shown in the poem?
    options:
    - Listening and sharing sorrows
    - Making fun of you
    - Leaving in hard times
    - Telling lies
    answer: Listening and sharing sorrows
    difficulty: 1
    hints:
    - Support.
    - Empathy.
    solution: A true friend listens and shares your sorrows.
    mistakes: {"Making fun of you": "e6_true_friend"}
  - prompt: What main feeling does the speaker show?
    options:
    - Gratitude for the friend
    - Anger
    - Jealousy
    - Fear
    answer: Gratitude for the friend
    difficulty: 1
    hints:
    - Thankful.
    - Prayer.
    solution: The speaker is grateful for the friend.
    mistakes:
      Jealousy: eng6_poem_meaning
  - prompt: '''Empathy'' means:'
    options:
    - understanding and sharing another's feelings
    - being very strong
    - winning a race
    - being alone
    answer: understanding and sharing another's feelings
    difficulty: 2
    hints:
    - Putting yourself in their shoes.
    - Feelings.
    solution: Empathy is feeling with someone.
    mistakes: {"being very strong": "e6_empathy"}
  - prompt: What does the speaker wish for the friend in hard times?
    options:
    - Strength and support
    - More trouble
    - Loneliness
    - Bad luck
    answer: Strength and support
    difficulty: 1
    hints:
    - Good wishes.
    - Courage.
    solution: The speaker wishes the friend strength.
    mistakes: {"Loneliness": "e6_hard_times"}
  - prompt: What is the main message of the poem?
    options:
    - A good friend cares about the other's happiness
    - Friends are not needed
    - Only rich people have friends
    - Prayers are for exams only
    answer: A good friend cares about the other's happiness
    difficulty: 2
    hints:
    - Whole poem.
    - Caring.
    solution: True friendship means caring about the other's well-being.
    mistakes: {"Friends are not needed": "e6_prayer_message"}
  - prompt: Who is the poem addressed to, as a prayer?
    options:
    - God
    - A teacher
    - A shopkeeper
    answer: God
    difficulty: 1
    hints:
    - It is written as a prayer.
    - Prayers are spoken to a higher power.
    solution: 'Step 1: the poem is a prayer. Step 2: prayers are addressed to God.'
    mistakes:
      A teacher: c6e2_poem
      A shopkeeper: c6e2_poem
  - prompt: Which word means 'sharing and understanding another's feelings'?
    options:
    - Empathy
    - Gratitude
    - Flattery
    answer: Empathy
    difficulty: 1
    hints:
    - It is about feeling with someone.
    - Not the same as thankfulness.
    solution: 'Step 1: gratitude is thankfulness; flattery is false praise. Step 2: feeling with others is empathy.'
    mistakes:
      Gratitude: c6e2_word
      Flattery: c6e2_word
  - prompt: Your friend is sad about losing a match. What would the speaker of the poem do?
    options:
    - Listen and comfort them
    - Laugh at them
    - Ignore them
    answer: Listen and comfort them
    difficulty: 1
    hints:
    - A true friend shares sorrows.
    - Which action is kind?
    solution: 'Step 1: the poem says friends share sorrows. Step 2: so listen and comfort.'
    mistakes:
      Laugh at them: c6e2_theme
      Ignore them: c6e2_theme
  - prompt: '''Loyal'' as used for a friend means:'
    options:
    - Faithful, staying by your side
    - Very rich
    - Always busy
    answer: Faithful, staying by your side
    difficulty: 2
    hints:
    - A true friend stands by you.
    - Even in hard times.
    solution: 'Step 1: the poem praises friends who stand by you. Step 2: that is being loyal.'
    mistakes:
      Very rich: c6e2_word
      Always busy: c6e2_word
  - prompt: Why might the speaker pray for a friend instead of for themselves?
    options:
    - Because they care deeply about the friend's happiness
    - Because they want something from the friend
    - Because they have no wishes
    answer: Because they care deeply about the friend's happiness
    difficulty: 3
    hints:
    - Think about selfless love.
    - The wishes are all for the friend.
    solution: 'Step 1: the poem wishes good things only for the friend. Step 2: this shows deep, selfless care.'
    mistakes:
      Because they want something from the friend: c6e2_poem
      Because they have no wishes: c6e2_poem
  - prompt: Which quality does NOT belong to a true friend in the poem?
    options:
    - Being jealous of your success
    - Being honest
    - Being kind
    answer: Being jealous of your success
    difficulty: 2
    hints:
    - The speaker wishes the friend success.
    - Which one is the opposite?
    solution: 'Step 1: honesty and kindness are praised. Step 2: jealousy is not part of true friendship.'
    mistakes:
      Being honest: c6e2_poem
      Being kind: c6e2_poem
  - prompt: What is the tone of the poem?
    options:
    - Warm and thankful
    - Angry
    - Frightening
    answer: Warm and thankful
    difficulty: 2
    hints:
    - How does the speaker feel about the friend?
    - Prayers of thanks.
    solution: 'Step 1: the speaker thanks God for the friend. Step 2: the tone is warm and thankful.'
    mistakes:
      Angry: c6e2_feel
      Frightening: c6e2_feel
  - prompt: Which line could fit this poem?
    options:
    - '''Keep my friend strong when the days are hard.'''
    - '''I want all the prizes for myself.'''
    - '''Friends are a waste of time.'''
    answer: '''Keep my friend strong when the days are hard.'''
    difficulty: 3
    hints:
    - It is a prayer for a friend.
    - Which line wishes them well?
    solution: 'Step 1: the poem wishes strength for the friend in hard times. Step 2: only the first line fits.'
    mistakes:
      '''I want all the prizes for myself.''': c6e2_poem
      '''Friends are a waste of time.''': c6e2_poem
  - prompt: How is 'A Friend's Prayer' different from 'The Unlikely Best Friends'?
    options:
    - One is a poem, the other is a story
    - Both are poems
    - Neither is about friendship
    answer: One is a poem, the other is a story
    difficulty: 2
    hints:
    - Look at the form of each.
    - Lines and verses, or paragraphs?
    solution: 'Step 1: the prayer is written in verse. Step 2: the elephant and dog tale is a prose story.'
    mistakes:
      Both are poems: c6e2_theme
      Neither is about friendship: c6e2_theme
- code: cbse6e.u2.chair
  title: The Chair
  notes: |
    Mario boasts about having many friends. His grandfather bets that most are only companions, not true friends, and
    gives him an 'invisible chair' as a test. Mario takes it to school and tries to sit on it in front of his classmates;
    he keeps falling and many laugh. But a few (Guneet, Asma and Deepa) help hold him up. In the end Mario 'balances' on the
    chair with their support and learns who his true friends are. He visits his grandfather, and they enjoy stories and fruit
    chaat. Moral: true friends stand by you; quality matters more than quantity.
  explanations:
    text: Mario thinks he has lots of friends. His grandfather gives him an 'invisible chair' as a test. When Mario tries to sit on it at school, he keeps falling. Most classmates laugh, but a few, Guneet, Asma and Deepa, help hold him up. Mario learns that a few true friends matter more than many companions.
    visual: Picture a boy crouching in the air above an empty spot, laughing classmates around him, and three friends kneeling to support him so he doesn't fall.
    step_by_step: 'Step 1: Mario''s boast. Step 2: Grandpa''s bet and the invisible chair. Step 3: Mario falls; many laugh. Step 4: Three friends help. Step 5: Mario''s lesson.'
    real_world: In real life, true friends are the ones who help when you are struggling, not just when things are fun.
  picture:
    kind: compare
    columns:
    - title: Companions
      points:
      - laughed when Mario fell
      - only around for fun
      - many of them
    - title: True friends
      points:
      - helped hold him up
      - stood by him
      - Guneet, Asma, Deepa
    alt: Companions laughed when Mario fell; true friends like Guneet, Asma and Deepa held him up.
  activity:
    type: sort
    prompt: 'The Chair: what does each part show?'
    bins:
    - Many companions
    - True friends
    - The test
    items:
    - label: Mario boasts of many friends
      bin: Many companions
      clue: Grandfather says most are not what Mario thinks.
      why: Counting lots of friends is about companions; grandfather doubts they are true.
    - label: An invisible chair
      bin: The test
      clue: Grandfather's gift.
      why: The invisible chair is how grandfather tests the friendships.
    - label: Classmates laugh when he falls
      bin: Many companions
      clue: Do they help?
      why: Laughing at him shows they are only companions.
    - label: Guneet, Asma and Deepa hold him up
      bin: True friends
      clue: They help instead of laughing.
      why: Helping him is what true friends do.
    - label: Mario balances with their support
      bin: True friends
      clue: Who makes it possible?
      why: He 'sits' only because true friends hold him.
  lesson:
    - teach: 'In The Chair, Mario boasts that he has many friends. His grandfather says many of them are only companions, not true friends, and gives him a test: an ''invisible chair''.'
      check:
        prompt: What did Grandpa doubt?
        options:
        - That all of Mario's 'friends' were true friends
        - That Mario could read
        - That chairs exist
        answer: That all of Mario's 'friends' were true friends
        why: He thought many were only companions.
