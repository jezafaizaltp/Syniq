- code: cbse6e.u2.chair
  title: The Chair
  notes: |
    Mario boasts about having many friends. His grandfather bets that most are only companions, not true friends, and
    gives him an 'invisible chair' as a test. Mario takes it to school and tries to sit on it in front of his classmates;
    he keeps falling and many laugh. But a few (Guneet, Asma and Deepa) help hold him up. In the end Mario 'balances' on the
    chair with their support and learns who his true friends are. He visits his grandfather, and they enjoy stories and fruit
    chaat. Moral: true friends stand by you; quality matters more than quantity.
  explanations:
    text: Mario thinks he has lots of friends. His grandfather gives him an 'invisible chair' as a test. When Mario tries to sit on it at school, he keeps falling. Most classmates laugh, but a few, Guneet, Asma and Deepa, help hold him up. Mario learns that a few true friends matter more than many companions.
    visual: Picture a boy crouching in the air above an empty spot, laughing classmates around him, and three friends kneeling to support him so he doesn't fall.
    step_by_step: 'Step 1: Mario''s boast. Step 2: Grandpa''s bet and the invisible chair. Step 3: Mario falls; many laugh. Step 4: Three friends help. Step 5: Mario''s lesson.'
    real_world: In real life, true friends are the ones who help when you are struggling, not just when things are fun.
  picture:
    kind: compare
    columns:
    - title: Companions
      points:
      - laughed when Mario fell
      - only around for fun
      - many of them
    - title: True friends
      points:
      - helped hold him up
      - stood by him
      - Guneet, Asma, Deepa
    alt: Companions laughed when Mario fell; true friends like Guneet, Asma and Deepa held him up.
  activity:
    type: sort
    prompt: 'The Chair: what does each part show?'
    bins:
    - Many companions
    - True friends
    - The test
    items:
    - label: Mario boasts of many friends
      bin: Many companions
      clue: Grandfather says most are not what Mario thinks.
      why: Counting lots of friends is about companions; grandfather doubts they are true.
    - label: An invisible chair
      bin: The test
      clue: Grandfather's gift.
      why: The invisible chair is how grandfather tests the friendships.
    - label: Classmates laugh when he falls
      bin: Many companions
      clue: Do they help?
      why: Laughing at him shows they are only companions.
    - label: Guneet, Asma and Deepa hold him up
      bin: True friends
      clue: They help instead of laughing.
      why: Helping him is what true friends do.
    - label: Mario balances with their support
      bin: True friends
      clue: Who makes it possible?
      why: He 'sits' only because true friends hold him.
  lesson:
    - teach: 'In The Chair, Mario boasts that he has many friends. His grandfather says many of them are only companions, not true friends, and gives him a test: an ''invisible chair''.'
      check:
        prompt: What did Grandpa doubt?
        options:
        - That all of Mario's 'friends' were true friends
        - That Mario could read
        - That chairs exist
        answer: That all of Mario's 'friends' were true friends
        why: He thought many were only companions.
      ways:
      - style: visual
        teach: How Grandfather's test in 'The Chair' begins.
        picture:
          kind: flow
          steps:
          - Mario boasts of having many friends
          - Grandfather says many are only companions
          - Grandfather sets a test
          - The test is an 'invisible chair'
          alt: 'Mario boasts of having many friends. Grandfather says many are only companions and sets a test: an invisible chair.'
      - style: real_world
        teach: Someone may have five hundred contacts on a phone. On the day they fall ill, perhaps only a handful call to ask how they are. The number on the screen and the number who care are not the same, and Mario's grandfather wants Mario to see the difference.
    - teach: At school Mario tries to sit on the invisible chair and keeps falling. Many classmates laugh. But Guneet, Asma and Deepa help hold him up, so he can 'balance' on the chair with their support.
      picture:
        kind: compare
        columns:
        - title: Most classmates
          points:
          - laughed
          - only companions
        - title: Guneet, Asma, Deepa
          points:
          - held him up
          - true friends
        alt: 'Most classmates laughed at Mario, but Guneet, Asma and Deepa held him up: they were his true friends.'
      check:
        prompt: What did the invisible chair really test?
        options:
        - Who would support Mario
        - How strong the chair was
        - Mario's maths
        answer: Who would support Mario
        why: True friends helped instead of laughing.
      ways:
      - style: step_by_step
        teach: 'Step 1: At school Mario tries to sit on a chair that is not there. Step 2: He falls, again and again. Step 3: Many classmates laugh. Step 4: Guneet, Asma and Deepa come and hold him up. Step 5: With their support he can ''sit'': the friends themselves are the chair.'
      - style: real_world
        teach: Think of a student whose voice breaks while singing on stage. Some in the hall giggle. A few classmates start clapping in time to help the singer go on. An awkward moment sorts the hall into those who laugh and those who help.
    - teach: 'Mario learns who his true friends are. He visits his grandfather, and they enjoy stories and fruit chaat. Moral: in friendship, quality matters more than quantity.'
      check:
        prompt: What does 'quality, not quantity' mean here?
        options:
        - A few true friends are worth more than many companions
        - Have as many friends as possible
        - Friends don't matter
        answer: A few true friends are worth more than many companions
        why: Mario's three helpers proved worth more than all the laughers.
      ways:
      - style: visual
        teach: Quantity and quality in friendship, side by side.
        picture:
          kind: compare
          columns:
          - title: Quantity
            points:
            - How many friends you can count
            - Easy to boast about
          - title: Quality
            points:
            - How true each friend is
            - Seen when you need help
          alt: Quantity is how many friends you can count; it is easy to boast about. Quality is how true each friend is; it is seen when you need help.
      - style: real_world
        teach: 'A cupboard may hold twenty umbrellas, but if only two of them open properly, only two are of use in the rain. Mario finds this out about friends: the few who held him up matter more than the many who laughed.'
