concepts:
- code: cbse6e.u2.unlikely
  title: The Unlikely Best Friends
  notes: |
    Gajaraj, an elephant in a royal stable, has comfort and food but no friend; his mahout feeds and bathes him but does not
    play. One evening a hungry stray dog, Buntee, wanders in; Gajaraj shares his food and they become best friends, playing
    and splashing at bath time. A farmer, who owns Buntee, takes him away. Both friends are heartbroken and stop eating.
    Seeing Buntee so sad, the farmer lets him go back. The friends reunite joyfully, and the mahout and farmer become
    friends too. Theme: friendship across differences; kindness and empathy.
  explanations:
    text: Gajaraj the royal elephant has everything except a friend. When a hungry little dog, Buntee, wanders into his stable, Gajaraj shares his food and they become best friends. When Buntee is taken away, both stop eating. The farmer sees how sad Buntee is and lets him return. The friends are happy again.
    visual: Picture a huge grey elephant and a tiny brown dog sharing a heap of food, then splashing together at the river while the mahout laughs.
    step_by_step: 'Step 1: Gajaraj''s loneliness. Step 2: Buntee arrives; friendship begins. Step 3: Separation: both stop eating. Step 4: The farmer''s kindness. Step 5: Reunion.'
    real_world: Animals of different kinds sometimes become close friends, like the dog and elephant pairs people film in sanctuaries.
  picture:
    kind: flow
    steps:
    - Gajaraj is lonely
    - Buntee arrives; they share food
    - Buntee is taken away
    - Both stop eating
    - Farmer lets Buntee return
    alt: Gajaraj is lonely, befriends Buntee, they are separated and stop eating, and the farmer lets Buntee go back.
  activity:
    type: order
    prompt: 'The Unlikely Best Friends: put the story in order.'
    steps:
    - Gajaraj has food but no friend
    - Buntee wanders in and Gajaraj shares his food
    - They play and splash together at bath time
    - The farmer takes Buntee away
    - Both friends stop eating
    - The farmer lets Buntee go back
    reasons:
      Buntee wanders in and Gajaraj shares his food: A hungry dog arrives at the lonely elephant's stable.
      They play and splash together at bath time: Sharing food starts the friendship.
      The farmer takes Buntee away: Buntee's owner comes for him.
      Both friends stop eating: Being apart makes them both sad.
      The farmer lets Buntee go back: He sees how sad Buntee is.
  items:
  - prompt: Who is Gajaraj?
    options:
    - A royal elephant
    - A stray dog
    - A farmer
    - A mahout
    answer: A royal elephant
    difficulty: 1
    hints:
    - Lives in a royal stable.
    - Big animal.
    solution: Gajaraj is an elephant.
    mistakes:
      A stray dog: eng6_read_again
  - prompt: Why was Gajaraj sad at first?
    options:
    - He had no friend
    - He had no food
    - He was ill
    - He was lost
    answer: He had no friend
    difficulty: 1
    hints:
    - He had comforts.
    - Lonely.
    solution: He had everything but a friend.
    mistakes: {"He had no food": "e6_gajaraj"}
  - prompt: Who is Buntee?
    options:
    - A dog
    - A cat
    - A horse
    - A parrot
    answer: A dog
    difficulty: 1
    hints:
    - Wandered into the stable.
    - Hungry.
    solution: Buntee is a dog.
    mistakes: {"A cat": "e6_buntee"}
  - prompt: What did Gajaraj and Buntee both do after being separated?
    options:
    - Stopped eating
    - Started dancing
    - Ran away together
    - Forgot each other
    answer: Stopped eating
    difficulty: 2
    hints:
    - They were heartbroken.
    - Food.
    solution: Both refused to eat.
    mistakes: {"Forgot each other": "e6_separated"}
  - prompt: Why did the farmer let Buntee go back?
    options:
    - He saw how unhappy Buntee was
    - Buntee bit him
    - The king ordered him
    - He did not like dogs
    answer: He saw how unhappy Buntee was
    difficulty: 2
    hints:
    - Empathy.
    - Buntee wouldn't eat.
    solution: The farmer cared about Buntee's happiness.
    mistakes:
      The king ordered him: eng6_whole_story
  - prompt: What does the story teach about friendship?
    options:
    - Friends can be very different from each other
    - Friends must be the same size
    - Only humans can be friends
    - Friendship doesn't matter
    answer: Friends can be very different from each other
    difficulty: 2
    hints:
    - An elephant and a dog.
    - Unlikely.
    solution: Friendship can cross every difference.
    mistakes: {"Friends must be the same size": "e6_unlikely_friends"}
- code: cbse6e.u2.prayer
  title: A Friend's Prayer (poem)
  notes: |
    A poem in the form of a prayer for a friend. The speaker is thankful for a friend and wishes good things for them:
    happiness, strength in hard times, success. It lists qualities of a true friend: listening, sharing joys and sorrows,
    standing by you, forgiving, being honest and kind. Themes: gratitude, empathy, loyalty; a good friend thinks of the
    other's well-being.
  explanations:
    text: 'In this poem, the speaker prays for their friend: for happiness, strength in difficult times and success. It shows what a true friend is like: someone who listens, shares joys and sorrows, stays loyal and is thankful for the friendship.'
    visual: 'Picture two friends sitting together; one is sad and the other has an arm around them, quietly listening. Above, soft words: ''May you be happy, may you be strong.'''
    step_by_step: 'Step 1: Who is speaking and to whom? Step 2: What does the speaker wish for the friend? Step 3: What qualities of friendship are shown? Step 4: What feeling runs through the poem: gratitude.'
    real_world: Making a card or saying 'thank you' to a friend who helped you is a small way of showing the same gratitude as the poem.
  picture:
    kind: compare
    columns:
    - title: A true friend
      points:
      - listens
      - shares joys and sorrows
      - stays loyal
    - title: The speaker wishes
      points:
      - happiness
      - strength in hard times
      - success
    alt: A true friend listens, shares joys and sorrows and stays loyal; the speaker wishes the friend happiness, strength and success.
  activity:
    type: sort
    prompt: 'A Friend''s Prayer: a wish for the friend, or what a true friend does?'
    bins:
    - Wish for the friend
    - What a true friend does
    items:
    - label: May you be happy
      bin: Wish for the friend
      clue: '''May you…'' hopes for something.'
      why: '''May you…'' is a wish for the friend''s well-being.'
    - label: Listens when you speak
      bin: What a true friend does
      clue: An action, not a hope.
      why: Listening is something a true friend does.
    - label: Strength in hard times
      bin: Wish for the friend
      clue: Something hoped for in difficulty.
      why: Hoping they are strong is a wish for them.
    - label: Stands by you
      bin: What a true friend does
      clue: Loyalty.
      why: Standing by someone is a friend's action.
    - label: Forgives and is honest
      bin: What a true friend does
      clue: Qualities shown in how they act.
      why: Forgiveness and honesty are how a true friend behaves.
    - label: Success in what you do
      bin: Wish for the friend
      clue: Something hoped for the future.
      why: Success is a good thing the speaker hopes for the friend.
  items:
  - prompt: 'The poem is written in the form of a:'
    options:
    - prayer
    - letter of complaint
    - recipe
    - news report
    answer: prayer
    difficulty: 1
    hints:
    - See the title.
    - Wishing good things.
    solution: It is a prayer for a friend.
    mistakes: {"letter of complaint": "e6_prayer_form"}
  - prompt: Which is a quality of a true friend shown in the poem?
    options:
    - Listening and sharing sorrows
    - Making fun of you
    - Leaving in hard times
    - Telling lies
    answer: Listening and sharing sorrows
    difficulty: 1
    hints:
    - Support.
    - Empathy.
    solution: A true friend listens and shares your sorrows.
    mistakes: {"Making fun of you": "e6_true_friend"}
  - prompt: What main feeling does the speaker show?
    options:
    - Gratitude for the friend
    - Anger
    - Jealousy
    - Fear
    answer: Gratitude for the friend
    difficulty: 1
    hints:
    - Thankful.
    - Prayer.
    solution: The speaker is grateful for the friend.
    mistakes:
      Jealousy: eng6_poem_meaning
  - prompt: '''Empathy'' means:'
    options:
    - understanding and sharing another's feelings
    - being very strong
    - winning a race
    - being alone
    answer: understanding and sharing another's feelings
    difficulty: 2
    hints:
    - Putting yourself in their shoes.
    - Feelings.
    solution: Empathy is feeling with someone.
    mistakes: {"being very strong": "e6_empathy"}
  - prompt: What does the speaker wish for the friend in hard times?
    options:
    - Strength and support
    - More trouble
    - Loneliness
    - Bad luck
    answer: Strength and support
    difficulty: 1
    hints:
    - Good wishes.
    - Courage.
    solution: The speaker wishes the friend strength.
    mistakes: {"Loneliness": "e6_hard_times"}
  - prompt: What is the main message of the poem?
    options:
    - A good friend cares about the other's happiness
    - Friends are not needed
    - Only rich people have friends
    - Prayers are for exams only
    answer: A good friend cares about the other's happiness
    difficulty: 2
    hints:
    - Whole poem.
    - Caring.
    solution: True friendship means caring about the other's well-being.
    mistakes: {"Friends are not needed": "e6_prayer_message"}
- code: cbse6e.u2.chair
  title: The Chair
  notes: |
    Mario boasts about having many friends. His grandfather bets that most are only companions, not true friends, and
    gives him an 'invisible chair' as a test. Mario takes it to school and tries to sit on it in front of his classmates;
    he keeps falling and many laugh. But a few (Guneet, Asma and Deepa) help hold him up. In the end Mario 'balances' on the
    chair with their support and learns who his true friends are. He visits his grandfather, and they enjoy stories and fruit
    chaat. Moral: true friends stand by you; quality matters more than quantity.
  explanations:
    text: Mario thinks he has lots of friends. His grandfather gives him an 'invisible chair' as a test. When Mario tries to sit on it at school, he keeps falling. Most classmates laugh, but a few, Guneet, Asma and Deepa, help hold him up. Mario learns that a few true friends matter more than many companions.
    visual: Picture a boy crouching in the air above an empty spot, laughing classmates around him, and three friends kneeling to support him so he doesn't fall.
    step_by_step: 'Step 1: Mario''s boast. Step 2: Grandpa''s bet and the invisible chair. Step 3: Mario falls; many laugh. Step 4: Three friends help. Step 5: Mario''s lesson.'
    real_world: In real life, true friends are the ones who help when you are struggling, not just when things are fun.
  picture:
    kind: compare
    columns:
    - title: Companions
      points:
      - laughed when Mario fell
      - only around for fun
      - many of them
    - title: True friends
      points:
      - helped hold him up
      - stood by him
      - Guneet, Asma, Deepa
    alt: Companions laughed when Mario fell; true friends like Guneet, Asma and Deepa held him up.
  activity:
    type: sort
    prompt: 'The Chair: what does each part show?'
    bins:
    - Many companions
    - True friends
    - The test
    items:
    - label: Mario boasts of many friends
      bin: Many companions
      clue: Grandfather says most are not what Mario thinks.
      why: Counting lots of friends is about companions; grandfather doubts they are true.
    - label: An invisible chair
      bin: The test
      clue: Grandfather's gift.
      why: The invisible chair is how grandfather tests the friendships.
    - label: Classmates laugh when he falls
      bin: Many companions
      clue: Do they help?
      why: Laughing at him shows they are only companions.
    - label: Guneet, Asma and Deepa hold him up
      bin: True friends
      clue: They help instead of laughing.
      why: Helping him is what true friends do.
    - label: Mario balances with their support
      bin: True friends
      clue: Who makes it possible?
      why: He 'sits' only because true friends hold him.
  items:
  - prompt: What did Mario boast about?
    options:
    - Having many friends
    - Being the fastest runner
    - Owning a big house
    - Having a pet elephant
    answer: Having many friends
    difficulty: 1
    hints:
    - The bet was about this.
    - Friends.
    solution: He boasted of his many friends.
    mistakes:
      Being the fastest runner: eng6_read_again
  - prompt: What did Grandpa give Mario as a test?
    options:
    - An invisible chair
    - A gold watch
    - A new bicycle
    - A letter
    answer: An invisible chair
    difficulty: 1
    hints:
    - Title of the story.
    - You can't see it.
    solution: Grandpa gave him an 'invisible chair'.
    mistakes: {"A gold watch": "e6_invisible_chair"}
  - prompt: What did most classmates do when Mario fell?
    options:
    - Laughed
    - Helped him
    - Called a doctor
    - Went home
    answer: Laughed
    difficulty: 1
    hints:
    - Not true friends.
    - Mocked.
    solution: Most of them laughed.
    mistakes: {"Helped him": "e6_classmates_laugh"}
  - prompt: Who helped Mario?
    options:
    - Guneet, Asma and Deepa
    - The whole class
    - Nobody
    - His teacher only
    answer: Guneet, Asma and Deepa
    difficulty: 2
    hints:
    - Three friends.
    - Names.
    solution: Guneet, Asma and Deepa supported him.
    mistakes: {"The whole class": "e6_three_friends"}
  - prompt: What was the invisible chair really testing?
    options:
    - Who his true friends were
    - How strong his legs were
    - Whether chairs can be invisible
    - His maths skills
    answer: Who his true friends were
    difficulty: 2
    hints:
    - The bet.
    - Friendship.
    solution: It tested who would stand by him.
    mistakes:
      How strong his legs were: eng6_whole_story
  - prompt: What is the moral of the story?
    options:
    - True friendship is about quality, not quantity
    - Never trust grandparents
    - Chairs are dangerous
    - Laughing at others is fine
    answer: True friendship is about quality, not quantity
    difficulty: 2
    hints:
    - A few true friends.
    - Not many companions.
    solution: A few true friends are worth more than many companions.
    mistakes: {"Laughing at others is fine": "e6_quality"}
