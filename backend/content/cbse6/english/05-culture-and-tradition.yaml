- code: cbse6e.u5.ila
  title: 'Ila Sachani: Embroidering Dreams with her Feet'
  notes: |
    The true story of Ila Sachani, an embroidery artist (from Gujarat, according to study notes) who cannot use her hands for
    fine work and learned to embroider beautifully with her feet. Her family (mother and grandmother) supported and taught
    her; she practised for years with great patience. Her work earned recognition and awards, and she became independent,
    earning from her craft. Themes: determination, finding your own way, family support, ability rather than limits.
  explanations:
    text: Ila Sachani is an embroidery artist who cannot use her hands for fine work, so she learned to embroider with her feet. With patience, years of practice and her family's support, she became a skilled artist, won recognition and now earns from her own work. Her story shows that there's more than one way to do something.
    visual: Picture a woman sitting on the floor, a cloth stretched in a frame, a needle held between her toes, stitching a colourful pattern while her mother watches proudly.
    step_by_step: 'Step 1: Who is Ila Sachani? Step 2: What challenge did she face? Step 3: How did she find her own way? Step 4: Who supported her? Step 5: What did she achieve?'
    real_world: Many artists and athletes find their own ways of working; India's Paralympic champions, like Avani Lekhara, inspire millions.
  picture:
    kind: flow
    steps:
    - Cannot use hands for fine work
    - Learns to embroider with her feet
    - Years of patient practice
    - Family support
    - Recognition and independence
    alt: Ila learned to embroider with her feet, practised patiently with her family's support, and earned recognition and independence.
  activity:
    type: order
    prompt: 'Ila Sachani: put her story in order.'
    steps:
    - She cannot use her hands for fine work
    - Her mother and grandmother teach her
    - She practises embroidery with her feet for years
    - Her work wins recognition and awards
    - She earns from her craft, independent
    reasons:
      Her mother and grandmother teach her: Her family helps her find another way.
      She practises embroidery with her feet for years: Learning a new way takes patience.
      Her work wins recognition and awards: Years of practice make her skilful.
      She earns from her craft, independent: Recognition brings work and income.
  lesson:
