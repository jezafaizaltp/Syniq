- code: cbse6e.u5.kites
  title: The Kites (poem)
  notes: |
    A poem (and chapter) about kites rising up in the air: their bright colours, how they dance and soar in the wind, the
    string held from the ground. It includes the parts of a kite (sail, spine/frame, string, tail) and kite festivals in
    India (Makar Sankranti/Uttarayan in Gujarat in January, the International Kite Festival in Ahmedabad; Independence Day
    kite flying in Delhi). Themes: freedom, joy, celebration.
  explanations:
    text: This poem shows kites rising high, dancing in the wind in bright colours, while children hold the strings below. It celebrates freedom and joy. India has big kite festivals, like Uttarayan (Makar Sankranti) in Gujarat every January.
    visual: Picture a blue sky full of red, yellow and green kites, tails fluttering, strings stretching down to children on rooftops.
    step_by_step: 'Step 1: Picture what the kites do in the poem. Step 2: Name the parts of a kite. Step 3: Name a kite festival and when it happens. Step 4: Think what kites stand for: freedom, joy.'
    real_world: During Uttarayan in Gujarat, families fly kites from rooftops all day and the sky fills with colour.
  picture:
    kind: compare
    columns:
    - title: Kite part
      points:
      - sail
      - frame (spine)
      - string
      - tail
    - title: Job
      points:
      - catches the wind
      - holds the shape
      - controls the kite
      - keeps it steady
    alt: The sail catches the wind, the frame holds the shape, the string controls the kite and the tail keeps it steady.
  activity:
    type: sort
    prompt: 'The Kites: which part of the kite?'
    bins:
    - Sail
    - Spine (frame)
    - String
    - Tail
    items:
    - label: The bright paper the wind pushes
      bin: Sail
      clue: The big flat part.
      why: The sail catches the wind.
    - label: The sticks that keep its shape
      bin: Spine (frame)
      clue: Thin sticks inside.
      why: The spine and frame hold it in shape.
    - label: What you hold from the ground
      bin: String
      clue: Connects you to the kite.
      why: You hold the string.
    - label: Long strips that keep it steady
      bin: Tail
      clue: Hangs at the bottom.
      why: The tail balances the kite.
  items:
  - prompt: 'Kites fly because of:'
    options:
    - the wind
    - fire
    - magnets
    - rain
    answer: the wind
    difficulty: 1
    hints:
    - Moving air.
    - Lift.
    solution: Wind lifts kites.
    mistakes: {"magnets": "e6_wind"}
  - prompt: 'Uttarayan, a famous kite festival, is celebrated in:'
    options:
    - Gujarat
    - Kerala
    - Assam
    - Goa
    answer: Gujarat
    difficulty: 1
    hints:
    - Ahmedabad.
    - January.
    solution: Uttarayan is famous in Gujarat.
    mistakes: {"Kerala": "e6_uttarayan"}
  - prompt: Which part of a kite helps keep it steady?
    options:
    - The tail
    - The colour
    - The shop
    - The box
    answer: The tail
    difficulty: 2
    hints:
    - It hangs below.
    - Balance.
    solution: The tail keeps it steady.
    mistakes: {"The colour": "e6_kite_tail"}
  - prompt: 'Kite festivals in Gujarat happen around:'
    options:
    - Makar Sankranti in January
    - Diwali in November
    - Christmas
    - Onam in August
    answer: Makar Sankranti in January
    difficulty: 2
    hints:
    - Winter.
    - Harvest festival.
    solution: They are around Makar Sankranti in January.
    mistakes: {"Diwali in November": "e6_sankranti"}
  - prompt: 'Kites in the poem mainly suggest:'
    options:
    - freedom and joy
    - fear
    - anger
    - sleep
    answer: freedom and joy
    difficulty: 2
    hints:
    - Soaring high.
    - Happy.
    solution: Kites suggest freedom and joy.
    mistakes: {"fear": "e6_kites_freedom"}
  - prompt: What controls the kite from the ground?
    options:
    - The string
    - The tail
    - The colour
    - The sky
    answer: The string
    difficulty: 1
    hints:
    - Held in your hand.
    - Line.
    solution: The string controls the kite.
    mistakes: {"The tail": "e6_kite_string"}
- code: cbse6e.u5.ila
  title: 'Ila Sachani: Embroidering Dreams with her Feet'
  notes: |
    The true story of Ila Sachani, an embroidery artist (from Gujarat, according to study notes) who cannot use her hands for
    fine work and learned to embroider beautifully with her feet. Her family (mother and grandmother) supported and taught
    her; she practised for years with great patience. Her work earned recognition and awards, and she became independent,
    earning from her craft. Themes: determination, finding your own way, family support, ability rather than limits.
  explanations:
    text: Ila Sachani is an embroidery artist who cannot use her hands for fine work, so she learned to embroider with her feet. With patience, years of practice and her family's support, she became a skilled artist, won recognition and now earns from her own work. Her story shows that there's more than one way to do something.
    visual: Picture a woman sitting on the floor, a cloth stretched in a frame, a needle held between her toes, stitching a colourful pattern while her mother watches proudly.
    step_by_step: 'Step 1: Who is Ila Sachani? Step 2: What challenge did she face? Step 3: How did she find her own way? Step 4: Who supported her? Step 5: What did she achieve?'
    real_world: Many artists and athletes find their own ways of working; India's Paralympic champions, like Avani Lekhara, inspire millions.
  picture:
    kind: flow
    steps:
    - Cannot use hands for fine work
    - Learns to embroider with her feet
    - Years of patient practice
    - Family support
    - Recognition and independence
    alt: Ila learned to embroider with her feet, practised patiently with her family's support, and earned recognition and independence.
  activity:
    type: order
    prompt: 'Ila Sachani: put her story in order.'
    steps:
    - She cannot use her hands for fine work
    - Her mother and grandmother teach her
    - She practises embroidery with her feet for years
    - Her work wins recognition and awards
    - She earns from her craft, independent
    reasons:
      Her mother and grandmother teach her: Her family helps her find another way.
      She practises embroidery with her feet for years: Learning a new way takes patience.
      Her work wins recognition and awards: Years of practice make her skilful.
      She earns from her craft, independent: Recognition brings work and income.
  items:
  - prompt: What is Ila Sachani known for?
    options:
    - Embroidering with her feet
    - Singing
    - Running races
    - Writing poems
    answer: Embroidering with her feet
    difficulty: 1
    hints:
    - See the title.
    - Needle and thread.
    solution: She embroiders with her feet.
    mistakes:
      Singing: eng6_read_again
  - prompt: Who supported and taught Ila?
    options:
    - Her family
    - Nobody
    - A film star
    - A king
    answer: Her family
    difficulty: 1
    hints:
    - Mother and grandmother.
    - Home.
    solution: Her family supported her.
    mistakes: {"A film star": "e6_ila_family"}
  - prompt: Which quality helped Ila most?
    options:
    - Determination and patience
