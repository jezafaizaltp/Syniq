      June: c6e5_fest
      October: c6e5_fest
  - prompt: Which part of a kite gives it its shape?
    options:
    - The frame (spine)
    - The tail
    - The wind
    answer: The frame (spine)
    difficulty: 1
    hints:
    - Sticks hold the sail tight.
    - Like a skeleton.
    solution: 'Step 1: the sail needs support. Step 2: the frame of sticks holds the shape.'
    mistakes:
      The tail: c6e5_kite
      The wind: c6e5_kite
  - prompt: A kite keeps spinning and diving. What might help?
    options:
    - Adding a longer tail
    - Cutting the string
    - Removing the sail
    answer: Adding a longer tail
    difficulty: 3
    hints:
    - One part keeps a kite steady.
    - It hangs at the bottom.
    solution: 'Step 1: the tail steadies a kite. Step 2: a longer tail can stop spinning and diving.'
    mistakes:
      Cutting the string: c6e5_kite
      Removing the sail: c6e5_kite
  - prompt: 'In the poem, kites ''dance'' in the sky. This is an example of:'
