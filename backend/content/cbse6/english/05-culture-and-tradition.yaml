- code: cbse6e.u5.kites
  title: The Kites (poem)
  notes: |
    A poem (and chapter) about kites rising up in the air: their bright colours, how they dance and soar in the wind, the
    string held from the ground. It includes the parts of a kite (sail, spine/frame, string, tail) and kite festivals in
    India (Makar Sankranti/Uttarayan in Gujarat in January, the International Kite Festival in Ahmedabad; Independence Day
    kite flying in Delhi). Themes: freedom, joy, celebration.
  explanations:
    text: This poem shows kites rising high, dancing in the wind in bright colours, while children hold the strings below. It celebrates freedom and joy. India has big kite festivals, like Uttarayan (Makar Sankranti) in Gujarat every January.
    visual: Picture a blue sky full of red, yellow and green kites, tails fluttering, strings stretching down to children on rooftops.
    step_by_step: 'Step 1: Picture what the kites do in the poem. Step 2: Name the parts of a kite. Step 3: Name a kite festival and when it happens. Step 4: Think what kites stand for: freedom, joy.'
    real_world: During Uttarayan in Gujarat, families fly kites from rooftops all day and the sky fills with colour.
  picture:
    kind: compare
    columns:
    - title: Kite part
      points:
      - sail
      - frame (spine)
      - string
      - tail
    - title: Job
      points:
      - catches the wind
      - holds the shape
      - controls the kite
      - keeps it steady
    alt: The sail catches the wind, the frame holds the shape, the string controls the kite and the tail keeps it steady.
  activity:
    type: sort
    prompt: 'The Kites: which part of the kite?'
    bins:
    - Sail
    - Spine (frame)
    - String
    - Tail
    items:
    - label: The bright paper the wind pushes
      bin: Sail
      clue: The big flat part.
      why: The sail catches the wind.
    - label: The sticks that keep its shape
      bin: Spine (frame)
      clue: Thin sticks inside.
      why: The spine and frame hold it in shape.
    - label: What you hold from the ground
      bin: String
      clue: Connects you to the kite.
      why: You hold the string.
    - label: Long strips that keep it steady
      bin: Tail
      clue: Hangs at the bottom.
      why: The tail balances the kite.
  lesson:
    - teach: '''The Kites'' shows bright kites rising, dancing and soaring in the wind, held by a string from the ground. The kites suggest freedom and joy.'
      check:
        prompt: What do the kites in the poem stand for?
        options:
        - Freedom and joy
        - Fear
        - Anger
        answer: Freedom and joy
        why: Soaring kites suggest freedom.
      ways:
      - style: visual
        teach: How the kites move in the poem, and what they make us feel.
        picture:
          kind: compare
          columns:
          - title: What the kites do
            points:
            - Rise
            - Dance
            - Soar in the wind
          - title: What they suggest
            points:
            - Freedom
            - Joy
          alt: In the poem the kites rise, dance and soar in the wind. They suggest freedom and joy.
      - style: real_world
        teach: 'Watch a kite on a breezy afternoon: it dips, swings and climbs as if it were alive and happy. Yet a thin string still joins it to a child on the ground. The poem enjoys that picture of something free and joyful, high above us.'
    - teach: 'A kite has parts: the sail (the paper or cloth that catches the wind), the spine or frame (sticks that hold its shape), the string (to control it from the ground) and the tail (to keep it steady).'
      picture:
        kind: compare
        columns:
        - title: Sail
          points:
          - catches the wind
        - title: Frame and string
          points:
          - holds the shape
          - controls from the ground
        - title: Tail
          points:
          - keeps it steady
        alt: The sail catches the wind, the frame holds the shape, the string controls the kite and the tail keeps it steady.
      check:
        prompt: Which part catches the wind?
        options:
        - The sail
        - The tail
        - The string
        answer: The sail
        why: The wide sail is pushed by the wind.
      ways:
      - style: visual
        teach: The four parts of a kite and the job each one does.
        picture:
          kind: compare
          columns:
          - title: Sail and frame
            points:
            - 'Sail: catches the wind'
            - 'Frame (spine): holds the shape'
          - title: String and tail
            points:
            - 'String: controls it from the ground'
            - 'Tail: keeps it steady'
          alt: The sail catches the wind and the frame, or spine, holds the shape. The string controls the kite from the ground and the tail keeps it steady.
      - style: step_by_step
        teach: 'Step 1: Stand with your back to the wind. Step 2: Let the wind push against the sail. Step 3: Let out string slowly as the kite climbs. Step 4: Pull gently on the string to steer. Each part of the kite has a job in this flight.'
    - teach: 'India has kite festivals: Makar Sankranti or Uttarayan in Gujarat in January, with the International Kite Festival in Ahmedabad, and kite flying on Independence Day in Delhi.'
      check:
        prompt: Delhi's sky fills with kites on which day?
        options:
        - Independence Day
        - Christmas
        - Teachers' Day
        answer: Independence Day
        why: Kite flying is an Independence Day tradition in Delhi.
      ways:
      - style: visual
        teach: Kite flying through the year in India, two famous times.
        picture:
          kind: compare
          columns:
          - title: January
            points:
            - Makar Sankranti, Uttarayan
            - Gujarat
            - International Kite Festival, Ahmedabad
          - title: 15 August
            points:
            - Independence Day
            - Delhi
          alt: In January, Makar Sankranti or Uttarayan is celebrated in Gujarat with the International Kite Festival in Ahmedabad. On 15 August, Independence Day, kites fly in Delhi.
      - style: real_world
        teach: On Uttarayan, families in Gujarat climb onto their rooftops from early morning. The sky fills with colourful kites, friendly kite-fights break out between neighbours, and the shout of a winning flyer carries across the roofs.
  items:
