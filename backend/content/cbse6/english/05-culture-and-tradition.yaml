- code: cbse6e.u5.memorial
  title: National War Memorial
  notes: |
    An informative chapter on the National War Memorial in New Delhi, near India Gate, opened in 2019 to honour the soldiers
    who gave their lives for India since Independence. Names of the fallen are engraved on granite tablets. Its design has
    concentric circles: Amar Chakra (circle of immortality, with the eternal flame), Veerta Chakra (circle of bravery),
    Tyag Chakra (circle of sacrifice) and Rakshak Chakra (circle of protection, rows of trees). In 2022 the Amar Jawan Jyoti
    flame from India Gate was merged with its flame. Theme: honouring sacrifice, gratitude to the armed forces.
  explanations:
    text: 'The National War Memorial in New Delhi, near India Gate, honours the soldiers who died for India after Independence. Their names are carved on stone. It is built as circles: the circle of immortality with an eternal flame, then the circles of bravery, sacrifice and protection. It opened in 2019.'
    visual: 'Picture rings of stone seen from above: in the centre a tall pillar with a flame, then rings of walls with engraved names, and an outer ring of trees standing like soldiers.'
    step_by_step: 'Step 1: Where it is and when it opened. Step 2: Whom it honours. Step 3: Name the circles from the centre outwards. Step 4: Why the eternal flame matters.'
    real_world: Families of soldiers visit the memorial to see their loved ones' names, and visitors lay flowers on special days like Republic Day.
  picture:
    kind: flow
    steps:
    - Amar Chakra (immortality, eternal flame)
    - Veerta Chakra (bravery)
    - Tyag Chakra (sacrifice)
    - Rakshak Chakra (protection, trees)
    alt: 'The memorial''s circles from the centre: Amar Chakra with the eternal flame, Veerta Chakra, Tyag Chakra and Rakshak Chakra.'
  activity:
    type: order
    prompt: 'National War Memorial: put the circles in order, from the centre outwards.'
    steps:
    - Amar Chakra, with the eternal flame
    - Veerta Chakra, circle of bravery
    - Tyag Chakra, circle of sacrifice
    - Rakshak Chakra, rows of trees
    reasons:
      Veerta Chakra, circle of bravery: Around the flame comes the circle of bravery.
      Tyag Chakra, circle of sacrifice: Next, the names of the fallen on granite.
      Rakshak Chakra, rows of trees: The outer circle is the trees that protect, like soldiers.
  lesson:
    - teach: The National War Memorial stands in New Delhi near India Gate. It was opened in 2019 to honour soldiers who gave their lives for India since Independence. Their names are engraved on granite tablets.
      check:
        prompt: Why are names engraved on the memorial?
        options:
        - To remember each soldier who died for India
        - To list visitors
        - To show shop prices
        answer: To remember each soldier who died for India
        why: Each name honours a fallen soldier.
    - teach: The memorial is built as circles inside circles. Amar Chakra (immortality) holds the eternal flame. Around it are the Veerta Chakra (bravery), the Tyag Chakra (sacrifice) and the outer Rakshak Chakra (protection), made of rows of trees.
      picture:
        kind: flow
        steps:
        - 'Amar Chakra: eternal flame'
        - 'Veerta Chakra: bravery'
        - 'Tyag Chakra: sacrifice'
        - 'Rakshak Chakra: trees, protection'
        alt: 'From the centre out: Amar Chakra with the flame, Veerta Chakra for bravery, Tyag Chakra for sacrifice, Rakshak Chakra of trees for protection.'
      check:
        prompt: What does 'Tyag' mean?
        options:
        - Sacrifice
        - Bravery
        - Protection
        answer: Sacrifice
        why: Tyag Chakra is the circle of sacrifice.
    - teach: In 2022 the Amar Jawan Jyoti flame from India Gate was merged with the memorial's eternal flame. Visitors come to show gratitude and respect for the armed forces.
      check:
