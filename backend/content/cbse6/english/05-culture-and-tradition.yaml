    solution: Ek Bharat Shreshtha Bharat pairs states.
    mistakes: {"Swachh Bharat": "e6_ebsb"}
  - prompt: What is the main idea of the chapter?
    options:
    - India has great diversity united as one nation
    - All Indians speak one language
    - India has no crafts
    - Only one festival matters
    answer: India has great diversity united as one nation
    difficulty: 2
    hints:
    - Unity in diversity.
    - Many and one.
    solution: India is diverse yet united.
    mistakes: {"All Indians speak one language": "e6_diversity"}
  - prompt: 'Dhokra objects are made by:'
    options:
    - Casting metal with the lost-wax method
    - Weaving grass
    - Painting on walls
    answer: Casting metal with the lost-wax method
    difficulty: 2
    hints:
    - Dhokra is a metal craft.
    - A wax model is melted away.
    solution: 'Step 1: a wax model is covered in clay and heated. Step 2: the wax melts out and molten metal takes its place.'
    mistakes:
      Weaving grass: c6e5_craft
      Painting on walls: c6e5_craft
  - prompt: Which state is known for coconut shell craft?
    options:
    - Kerala
    - Uttarakhand
    - Rajasthan
    answer: Kerala
    difficulty: 1
    hints:
    - Coconut palms grow along its coast.
    - A south-western state.
    solution: 'Step 1: coconut shells are plentiful where palms grow. Step 2: Kerala is famous for this craft.'
    mistakes:
      Uttarakhand: c6e5_craft
      Rajasthan: c6e5_craft
  - prompt: 'Aipan is usually drawn on:'
    options:
    - Floors and walls
    - Paper kites
    - Metal pots
    answer: Floors and walls
    difficulty: 2
    hints:
    - It is ritual art at home.
    - Drawn for festivals.
    solution: 'Step 1: Aipan decorates homes for rituals. Step 2: it is drawn on floors and walls.'
    mistakes:
      Paper kites: c6e5_craft
      Metal pots: c6e5_craft
  - prompt: '''Heritage'' means:'
    options:
    - Traditions and things passed down from the past
    - A new invention
    - A kind of food
    answer: Traditions and things passed down from the past
    difficulty: 2
    hints:
    - The chapter talks of pride in old crafts.
    - Received from earlier generations.
    solution: 'Step 1: crafts like Dhokra are very old. Step 2: what we inherit from the past is our heritage.'
    mistakes:
      A new invention: c6e5_word
      A kind of food: c6e5_word
  - prompt: Why does the chapter call India 'incredible'?
    options:
    - It has amazing variety in one nation
    - It is the smallest country
    - Everyone speaks one language
    answer: It has amazing variety in one nation
    difficulty: 1
    hints:
    - Think of languages, crafts and festivals.
    - So many differences, still one country.
    solution: 'Step 1: India has great diversity. Step 2: all of it united in one nation is ''incredible''.'
    mistakes:
      It is the smallest country: c6e5_idea
      Everyone speaks one language: c6e5_idea
  - prompt: 'Under Ek Bharat Shreshtha Bharat, a Kerala school learns songs from its partner state. This helps students to:'
    options:
