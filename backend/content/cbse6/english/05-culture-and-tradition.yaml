concepts:
- code: cbse6e.u5.bharat
  title: 'Hamara Bharat: Incredible India!'
  notes: |
    An informative chapter on India's diversity and unity: many languages, festivals, landscapes and crafts, joined in one
    nation (Ek Bharat Shreshtha Bharat programme pairs states to learn each other's culture). Crafts: Aipan (ritual floor and
    wall art in red and white, Uttarakhand), Dhokra (ancient lost-wax metal casting, tribal craft of central and eastern
    India), coconut shell craft (Kerala), Kondapalli toys (light wooden toys, Andhra Pradesh). Theme: unity in diversity,
    pride in heritage.
  explanations:
    text: 'India is incredibly diverse: many languages, foods, festivals and crafts. Aipan art from Uttarakhand, Dhokra metal figures from central and eastern India, coconut shell craft from Kerala and Kondapalli wooden toys from Andhra Pradesh all show this. The Ek Bharat Shreshtha Bharat programme helps states learn about each other.'
    visual: Picture a market stall with a red-and-white Aipan pattern, a small Dhokra horse, a carved coconut-shell cup from Kerala and brightly painted Kondapalli toys.
    step_by_step: 'Step 1: Name the craft. Step 2: Name its state or region. Step 3: Note the material: paint, metal, coconut shell, wood. Step 4: See how all are part of one India.'
    real_world: Kerala's coconut-shell craft turns waste shells into cups, lamps and ornaments sold at handicraft fairs across India.
  picture:
    kind: compare
    columns:
    - title: Craft
      points:
      - Aipan
      - Dhokra
      - Coconut shell craft
      - Kondapalli toys
    - title: Region
      points:
      - Uttarakhand
      - central and eastern India
      - Kerala
      - Andhra Pradesh
    alt: Aipan comes from Uttarakhand, Dhokra from central and eastern India, coconut shell craft from Kerala and Kondapalli toys from Andhra Pradesh.
  activity:
    type: sort
    prompt: 'Hamara Bharat: which craft is it?'
    bins:
    - Aipan
    - Dhokra
    - Kondapalli toys
    items:
    - label: Red and white floor and wall art
      bin: Aipan
      clue: From Uttarakhand.
      why: Red and white ritual art is Aipan.
    - label: Lost-wax metal casting
      bin: Dhokra
      clue: A very old tribal metal craft.
      why: Lost-wax casting is Dhokra.
    - label: Light wooden toys
      bin: Kondapalli toys
      clue: From Andhra Pradesh.
      why: Light wooden toys from Andhra are Kondapalli toys.
    - label: Made in Uttarakhand homes
      bin: Aipan
      clue: Hill state.
      why: Aipan comes from Uttarakhand.
    - label: Tribal craft of central and eastern India
      bin: Dhokra
      clue: Metal, not paint or wood.
      why: Dhokra is the tribal metal craft.
  lesson:
    - teach: '''Hamara Bharat: Incredible India!'' celebrates India''s many languages, festivals, landscapes and crafts, joined in one nation. The Ek Bharat Shreshtha Bharat programme pairs states so people learn about each other''s culture.'
      check:
        prompt: What does Ek Bharat Shreshtha Bharat do?
        options:
        - Pairs states to learn each other's culture
        - Builds railways
        - Holds cricket matches
        answer: Pairs states to learn each other's culture
        why: It links states so people understand one another.
    - teach: Indian crafts differ by region. Aipan is red-and-white ritual floor and wall art from Uttarakhand. Dhokra is ancient metal casting by the lost-wax method, a tribal craft of central and eastern India.
      picture:
        kind: compare
        columns:
        - title: Aipan
          points:
          - Uttarakhand
          - red and white floor art
        - title: Dhokra
          points:
          - central and eastern India
          - lost-wax metal casting
        alt: Aipan is red and white art from Uttarakhand; Dhokra is metal casting from central and eastern India.
      check:
        prompt: Which colours are typical of Aipan?
        options:
        - Red and white
        - Blue and gold
        - Black and green
        answer: Red and white
        why: Aipan uses white patterns on a red base.
    - teach: Kerala is known for coconut shell craft, and Andhra Pradesh for Kondapalli toys, made of light wood. Together these crafts show unity in diversity and give us pride in our heritage.
      check:
        prompt: 'Kondapalli toys are made of:'
        options:
        - Light wood
        - Glass
        - Plastic
        answer: Light wood
        why: They are carved from a soft, light wood.
  items:
  - prompt: 'Aipan art comes from:'
    options:
    - Uttarakhand
    - Kerala
    - Gujarat
    - Assam
    answer: Uttarakhand
    difficulty: 1
    hints:
    - Hill state.
    - Red and white patterns.
    solution: Aipan is from Uttarakhand.
    mistakes: {"Kerala": "e6_aipan"}
  - prompt: 'Kondapalli toys come from:'
    options:
    - Andhra Pradesh
    - Punjab
    - Kerala
    - Bihar
    answer: Andhra Pradesh
    difficulty: 1
    hints:
    - South India.
    - Wooden toys.
    solution: Kondapalli toys are from Andhra Pradesh.
    mistakes: {"Kerala": "e6_kondapalli"}
  - prompt: 'Dhokra is a craft made of:'
    options:
    - metal
    - paper
    - glass
    - cloth
    answer: metal
    difficulty: 2
    hints:
    - Lost-wax casting.
    - Brass figures.
    solution: Dhokra is metal casting.
    mistakes: {"paper": "e6_dhokra"}
  - prompt: 'Coconut shell craft is a well-known craft of:'
    options:
    - Kerala
    - Rajasthan
    - Himachal Pradesh
    - Delhi
    answer: Kerala
    difficulty: 1
    hints:
    - Coconut land.
    - Our state.
    solution: It is well known in Kerala.
    mistakes: {"Rajasthan": "e6_coconut_craft"}
  - prompt: 'The programme that pairs states to learn about each other is:'
    options:
    - Ek Bharat Shreshtha Bharat
    - Swachh Bharat
    - Digital India
    - Make in India
    answer: Ek Bharat Shreshtha Bharat
    difficulty: 2
    hints:
    - '''One India, Great India''.'
