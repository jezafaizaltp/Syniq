    - Film stars
    - Cricket players
    - Kings
    answer: Soldiers who died for India
    difficulty: 1
    hints:
    - War memorial.
    - Sacrifice.
    solution: It honours fallen soldiers.
    mistakes: {"Kings": "e6_memorial_honour"}
  - prompt: In which year was the National War Memorial opened?
    options:
    - '2019'
    - '1947'
    - '1950'
    - '2001'
    answer: '2019'
    difficulty: 1
    hints:
    - Recent.
    - Not at Independence.
    solution: It opened in 2019.
