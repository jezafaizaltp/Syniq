    mistakes:
      Kochi: c6e5_fest
      Shimla: c6e5_fest
  - prompt: Which month is Uttarayan celebrated in?
    options:
    - January
    - June
    - October
    answer: January
    difficulty: 1
    hints:
    - It falls on Makar Sankranti.
