- code: cbse6e.u1.dew
  title: A Bottle of Dew (Sudha Murty)
  notes: |
    Rama Natha, son of a rich landlord, neglects his land and wastes money searching for a potion that turns things to
    gold. His wife Madhumati worries. A sage, Mahipati, says he knows how to make it: Rama Natha must plant banana plants,
    water them with his own hands, and collect the morning dew from their leaves until he has five litres; then the sage
    will chant the magic words. Rama Natha plants many rows and works for about six years. Madhumati sells the bananas and
    they grow rich. When he returns with the dew, the sage reveals there is no magic potion: their wealth came from hard
    work. Moral: there is no shortcut to success; hard work is the real 'magic'.
  explanations:
    text: 'Rama Natha wants a magic potion that turns things into gold. A sage tells him to grow banana plants and collect five litres of dew from their leaves. He works for years. When he brings the dew, the sage explains there''s no potion: the bananas he grew and sold have already made him rich. Hard work was the real magic.'
    visual: Picture rows of banana plants at dawn, dew drops shining on the big leaves, and Rama Natha carefully tipping each drop into a bottle while Madhumati carries bananas to the market.
    step_by_step: 'Step 1: Rama Natha''s wish: easy gold. Step 2: The sage''s task: grow bananas and collect dew. Step 3: Years of work; the bananas are sold. Step 4: The revelation: no potion, the wealth came from work. Step 5: The lesson.'
    real_world: Shortcuts like 'get rich quick' schemes rarely work; steady effort, like a farmer tending crops season after season, builds real success.
  picture:
    kind: flow
    steps:
    - Rama Natha wants a gold-making potion
    - 'Sage: grow bananas, collect 5 litres of dew'
    - Years of hard work; bananas sold
    - 'Sage: there is no potion'
    - Hard work made them rich
    alt: Rama Natha seeks a potion, the sage sets him to grow bananas and collect dew, years of work follow, and he learns the wealth came from hard work.
  items:
  - prompt: What was Rama Natha searching for?
    options:
    - A potion to turn things into gold
    - A lost ring
    - A new house
    - A cure for an illness
    answer: A potion to turn things into gold
    difficulty: 1
    hints:
    - He wanted easy wealth.
    - Magic.
    solution: He wanted a potion that would make gold.
    mistakes:
      A lost ring: eng6_read_again
  - prompt: What did the sage ask him to collect?
    options:
    - Dew from banana leaves
    - Rainwater from the roof
    - River sand
    - Gold dust
    answer: Dew from banana leaves
    difficulty: 1
    hints:
    - In the early morning.
    - From plants he grew.
    solution: He had to collect dew from banana leaves.
  - prompt: Who was Madhumati?
    options:
    - Rama Natha's wife
    - The sage's daughter
    - A neighbour
    - A queen
    answer: Rama Natha's wife
    difficulty: 1
    hints:
    - She worried about money.
    - She sold the bananas.
    solution: Madhumati was his wife.
  - prompt: How did Rama Natha and Madhumati actually become rich?
    options:
    - By growing and selling bananas
    - By finding the potion
    - By winning a prize
    - By selling the dew
    answer: By growing and selling bananas
    difficulty: 2
    hints:
    - What did they sell every season?
    - Plantation.
    solution: Their banana plantation earned them money.
    mistakes:
      By finding the potion: eng6_whole_story
  - prompt: What did the sage reveal at the end?
    options:
    - There was no magic potion; their hard work made them rich
    - The dew was gold
    - He was a king
    - The bananas were magic
    answer: There was no magic potion; their hard work made them rich
    difficulty: 2
    hints:
    - The surprise.
    - No magic.
    solution: 'The sage admitted there was no potion: work was the real magic.'
  - prompt: What is the main lesson of the story?
    options:
    - There is no shortcut to success; hard work pays
    - Never trust farmers
    - Bananas are magic
    - Always look for potions
    answer: There is no shortcut to success; hard work pays
    difficulty: 2
    hints:
    - Think about how things changed.
    - Effort.
    solution: The story shows hard work, not magic, brings success.
- code: cbse6e.u1.raven
  title: The Raven and the Fox (poem)
  notes: |
    A poem based on the old fable. A raven sits on a branch with a piece of cheese (food) in its beak. A hungry fox wants it
    and flatters the raven, praising its fine feathers and saying its voice must be lovely; he asks it to sing. The proud
    raven opens its beak to caw, the cheese falls, and the fox grabs it and runs off. Moral: beware of flatterers; praise can
    be used to trick you. Literary features: rhyme, dialogue, characters who are animals (fable).
  explanations:
    text: 'A raven sits in a tree with a piece of cheese. A clever fox praises the raven''s beauty and asks it to sing. The raven, pleased, opens its beak to caw, and the cheese drops straight to the fox. The lesson: don''t be fooled by flattery.'
    visual: 'Picture a black raven on a branch, cheese in its beak, and a smiling fox below with its paws together, saying ''Sing for me!''. Next frame: the beak open, cheese falling into the fox''s mouth.'
    step_by_step: 'Step 1: What the raven has. Step 2: What the fox wants. Step 3: How the fox tricks it: flattery. Step 4: What happens when the raven sings. Step 5: The moral.'
    real_world: If someone praises you a lot just before asking for something, it is wise to stop and think, like the raven should have.
  picture:
    kind: flow
    steps:
    - Raven has cheese
    - Fox flatters the raven
    - Fox asks it to sing
    - Raven caws; cheese falls
    - Fox runs off with it
    alt: 'The fable in five steps: the raven has cheese, the fox flatters it, asks it to sing, the cheese falls when it caws, and the fox runs away.'
  items:
  - prompt: What did the raven have in its beak?
    options:
    - A piece of cheese
    - A worm
    - A leaf
    - A stone
    answer: A piece of cheese
    difficulty: 1
    hints:
    - The fox wanted it.
    - Food.
    solution: The raven had a piece of cheese.
  - prompt: How did the fox trick the raven?
    options:
    - By flattering it and asking it to sing
    - By climbing the tree
    - By shouting loudly
    - By offering money
    answer: By flattering it and asking it to sing
    difficulty: 1
    hints:
    - Sweet words.
    - Praise.
    solution: The fox praised the raven and asked it to sing.
  - prompt: What happened when the raven opened its beak?
    options:
    - The cheese fell and the fox took it
    - It flew away
    - The fox sang too
    - It ate the cheese
    answer: The cheese fell and the fox took it
    difficulty: 1
    hints:
    - Open beak.
    - Gravity.
    solution: The cheese dropped and the fox grabbed it.
  - prompt: What does 'flattery' mean?
    options:
    - Praise that is not sincere, used to get something
    - An honest warning
    - A loud noise
    - A kind of bird
    answer: Praise that is not sincere, used to get something
    difficulty: 2
    hints:
    - The fox's sweet words.
    - Not meant truly.
    solution: Flattery is insincere praise to get something.
  - prompt: What is the moral of the poem?
    options:
    - Beware of flatterers
    - Always sing loudly
    - Foxes are kind
    - Cheese is healthy
    answer: Beware of flatterers
    difficulty: 1
    hints:
    - What did the raven lose?
    - Why?
    solution: Don't be fooled by flattery.
    mistakes:
      Always sing loudly: eng6_poem_meaning
  - prompt: 'A story where animals talk and teach a lesson is called a:'
    options:
    - fable
    - biography
    - news report
    - recipe
    answer: fable
    difficulty: 2
    hints:
    - Aesop and Panchatantra.
    - Moral at the end.
    solution: Such a story is a fable.
- code: cbse6e.u1.rama
  title: Rama to the Rescue
  notes: |
    A humorous folk-style tale. One night a man and his wife hear strange noises and realise a thief is trying to break into
    their house. The wife alerts her husband ("Ssssh! Listen!"). They call out for help, Rama hears his name and comes
    running, and with quick, clever thinking the thief is caught. Themes: staying alert, keeping calm, asking for help,
    quick thinking, and neighbours keeping each other safe. (Details, including who exactly Rama is, differ in the study
    notes used; check against the book.)
  explanations:
    text: One night a couple hear a thief trying to break into their house. Instead of panicking, they call out for help. Rama hears and rushes to them, and with some quick, clever thinking the thief is caught. The story shows how staying calm and asking for help can save the day.
    visual: Picture a dark house at night, a couple sitting up in bed listening, a shadowy figure at the window, and then lamps lighting up as Rama rushes in.
    step_by_step: 'Step 1: The problem: noises at night, a thief. Step 2: The couple''s reaction: listen, stay calm, call for help. Step 3: Rama comes to help. Step 4: The thief is caught. Step 5: The lesson.'
    real_world: 'If you notice something wrong at night, wake an adult, stay calm and call for help: neighbours or the police (112 in India).'
  picture:
    kind: flow
    steps:
    - Noises at night
    - Couple realise it is a thief
    - They call for help
    - Rama rushes in
    - Thief is caught
    alt: Noises at night, the couple realise it is a thief, call for help, Rama rushes in and the thief is caught.
  items:
  - prompt: What did the couple hear at night?
    options:
    - Someone trying to break into the house
    - A wedding band
    - Rain on the roof
    - Their baby crying
    answer: Someone trying to break into the house
    difficulty: 1
    hints:
    - Strange noises.
    - A thief.
    solution: They heard a thief breaking in.
    mistakes:
      Rain on the roof: eng6_read_again
  - prompt: Who first noticed the noises and alerted the other?
    options:
    - The wife
    - The thief
    - Rama
    - A dog
    answer: The wife
    difficulty: 1
    hints:
    - '''Ssssh! Listen!'''
    - She whispered.
    solution: The wife alerted her husband.
  - prompt: What did the couple do when they realised there was a thief?
    options:
    - Called for help
    - Went back to sleep
    - Opened the door for him
    - Ran away from the village
    answer: Called for help
    difficulty: 1
    hints:
    - Rama heard his name.
    - Shouted.
    solution: They called out for help.
  - prompt: What happens to the thief at the end?
    options:
    - He is caught
    - He becomes rich
    - He marries Rama
    - He becomes the king
    answer: He is caught
    difficulty: 1
    hints:
    - Rama helps.
    - Rescue.
    solution: The thief is caught.
  - prompt: Which quality helps solve the problem in the story?
    options:
    - Quick, calm thinking
    - Being careless
    - Shouting at each other
    - Hiding under the bed forever
    answer: Quick, calm thinking
    difficulty: 2
    hints:
    - They didn't panic.
    - Clever.
    solution: Calm, quick thinking saves the day.
  - prompt: What is the emergency number for help in India?
    options:
    - '112'
    - '500'
    - '1000'
    - '007'
    answer: '112'
    difficulty: 2
    hints:
    - One number for police, fire, ambulance.
    - Three digits.
    solution: 112 is India's emergency number.
