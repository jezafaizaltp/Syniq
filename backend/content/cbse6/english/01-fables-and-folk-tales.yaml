# CBSE Class 6 English (NCERT Poorvi, 2024-25), unit 1. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse6-eng
chapter: 1
title: 'Fables and Folk Tales: A Bottle of Dew · The Raven and the Fox · Rama to the Rescue'
tips:
  eng6_read_again: 'Go back to the chapter: the answer is in the text. Find the part about that person or event.'
  eng6_poem_meaning: Poems often mean more than they say. Ask what the picture in the poem stands for in life.
  eng6_whole_story: 'Think about the whole story, not just one line: what changes from the start to the end?'
  e6_beak_open: "You can't sing with your mouth closed. What drops when a beak opens?"
  e6_calm: "The couple did not panic. They thought of a clever plan quickly."
  e6_dew: "The sage's task sounded strange on purpose: something tiny, gathered from the leaves of a fruit plant."
  e6_fable: "A biography is a true life story of a real person. Stories with talking animals and a moral have another name."
  e6_flattery: "The fox's praise was not true. He said it only to get something."
  e6_flattery_trick: "Foxes can't climb well. The fox used sweet words instead."
  e6_madhumati: "Madhumati worked alongside Rama Natha on the farm. How were they related?"
  e6_no_potion: "The dew was never turned into anything. What did all that work on the banana plants give them?"
  e6_no_shortcut: "Rama Natha wanted an easy way to get rich. What did he get instead, and how?"
  e6_rama_loud: "They kept shouting the same name on purpose. Who were they hoping would come?"
  e6_rama_who: "The couple called out a name hoping someone on night duty would hear."
  e6_raven_cheese: "The fox wanted what the raven was holding. Foxes don't want worms; think of a food from milk."
  e6_thief_end: "The couple's trick worked. Who arrived at the house?"
  c6e1_events: Go back to the order of events in the story and find the part the question is about.
  c6e1_why: 'Ask why the character acted this way: what did they want, and what did they really get?'
  c6e1_word: Use the sentence around the word to work out its meaning.
  c6e1_moral: A moral is the lesson the whole story teaches, not just one event in it.
  c6e1_trait: Judge the character by what they do, not only what they say.
concepts:
- code: cbse6e.u1.dew
  title: A Bottle of Dew (Sudha Murty)
  notes: |
    Rama Natha, son of a rich landlord, neglects his land and wastes money searching for a potion that turns things to
    gold. His wife Madhumati worries. A sage, Mahipati, says he knows how to make it: Rama Natha must plant banana plants,
    water them with his own hands, and collect the morning dew from their leaves until he has five litres; then the sage
    will chant the magic words. Rama Natha plants many rows and works for about six years. Madhumati sells the bananas and
    they grow rich. When he returns with the dew, the sage reveals there is no magic potion: their wealth came from hard
    work. Moral: there is no shortcut to success; hard work is the real 'magic'.
  explanations:
    text: 'Rama Natha wants a magic potion that turns things into gold. A sage tells him to grow banana plants and collect five litres of dew from their leaves. He works for years. When he brings the dew, the sage explains there''s no potion: the bananas he grew and sold have already made him rich. Hard work was the real magic.'
    visual: Picture rows of banana plants at dawn, dew drops shining on the big leaves, and Rama Natha carefully tipping each drop into a bottle while Madhumati carries bananas to the market.
    step_by_step: 'Step 1: Rama Natha''s wish: easy gold. Step 2: The sage''s task: grow bananas and collect dew. Step 3: Years of work; the bananas are sold. Step 4: The revelation: no potion, the wealth came from work. Step 5: The lesson.'
    real_world: Shortcuts like 'get rich quick' schemes rarely work; steady effort, like a farmer tending crops season after season, builds real success.
  picture:
    kind: flow
    steps:
    - Rama Natha wants a gold-making potion
    - 'Sage: grow bananas, collect 5 litres of dew'
    - Years of hard work; bananas sold
    - 'Sage: there is no potion'
    - Hard work made them rich
    alt: Rama Natha seeks a potion, the sage sets him to grow bananas and collect dew, years of work follow, and he learns the wealth came from hard work.
  activity:
    type: order
    prompt: 'A Bottle of Dew: put the story in order.'
    steps:
    - Rama Natha wastes money looking for a gold potion
    - The sage Mahipati says he knows the secret
    - Rama Natha plants banana plants and collects dew
    - Madhumati sells the bananas and they grow rich
    - The sage says there is no magic potion
    reasons:
      The sage Mahipati says he knows the secret: Rama Natha's search brings him to the sage.
      Rama Natha plants banana plants and collects dew: The sage's 'recipe' needs dew from banana leaves.
      Madhumati sells the bananas and they grow rich: Years of planting give a huge crop of bananas.
      The sage says there is no magic potion: When the dew is ready, the sage tells the truth.
  lesson:
    - teach: A Bottle of Dew by Sudha Murty is about Rama Natha, a rich landlord's son who neglects his land. He wastes money chasing a magic potion that would turn things into gold. His wife Madhumati worries about him.
      check:
        prompt: What was Rama Natha's problem at the start?
        options:
        - He chased a magic potion and neglected his land
        - He worked too hard
        - He had no land
        answer: He chased a magic potion and neglected his land
        why: He wasted time and money on a dream of easy gold.
    - teach: A sage, Mahipati, agrees to help. Rama Natha must plant banana plants, water them with his own hands, and collect five litres of morning dew from their leaves. For about six years he works hard, while Madhumati sells the bananas.
      picture:
        kind: flow
        steps:
        - Plant bananas
        - Water them daily
        - Collect the dew
        - Madhumati sells bananas
        - They grow rich
        alt: Rama Natha plants and waters bananas and collects dew; Madhumati sells the bananas and they become rich.
      check:
        prompt: Why did the sage ask for dew from banana leaves?
        options:
        - To make Rama Natha work on his land
        - Because dew is gold
        - To make tea
        answer: To make Rama Natha work on his land
        why: The task kept him farming for years.
    - teach: 'When Rama Natha brings the dew, the sage reveals there is no magic potion. The bananas made them rich: hard work was the real magic. Moral: there is no shortcut to success.'
      check:
        prompt: Was the sage dishonest in a bad way?
        options:
        - No, he tricked Rama Natha into a better life
        - Yes, he stole their money
        - Yes, he wanted the dew
        answer: No, he tricked Rama Natha into a better life
        why: His plan led Rama Natha to work and prosper.
  items:
  - prompt: What was Rama Natha searching for?
    options:
    - A potion to turn things into gold
    - A lost ring
    - A new house
    - A cure for an illness
    answer: A potion to turn things into gold
    difficulty: 1
    hints:
    - He wanted easy wealth.
    - Magic.
    solution: He wanted a potion that would make gold.
    mistakes:
      A lost ring: eng6_read_again
  - prompt: What did the sage ask him to collect?
    options:
    - Dew from banana leaves
    - Rainwater from the roof
    - River sand
    - Gold dust
    answer: Dew from banana leaves
    difficulty: 1
    hints:
    - In the early morning.
    - From plants he grew.
    solution: He had to collect dew from banana leaves.
    mistakes: {"Gold dust": "e6_dew"}
  - prompt: Who was Madhumati?
    options:
    - Rama Natha's wife
    - The sage's daughter
    - A neighbour
    - A queen
    answer: Rama Natha's wife
    difficulty: 1
    hints:
    - She worried about money.
    - She sold the bananas.
    solution: Madhumati was his wife.
    mistakes: {"The sage's daughter": "e6_madhumati"}
  - prompt: How did Rama Natha and Madhumati actually become rich?
    options:
    - By growing and selling bananas
    - By finding the potion
    - By winning a prize
    - By selling the dew
    answer: By growing and selling bananas
    difficulty: 2
    hints:
    - What did they sell every season?
    - Plantation.
    solution: Their banana plantation earned them money.
    mistakes:
      By finding the potion: eng6_whole_story
  - prompt: What did the sage reveal at the end?
    options:
    - There was no magic potion; their hard work made them rich
    - The dew was gold
    - He was a king
    - The bananas were magic
    answer: There was no magic potion; their hard work made them rich
    difficulty: 2
    hints:
    - The surprise.
    - No magic.
    solution: 'The sage admitted there was no potion: work was the real magic.'
    mistakes: {"The dew was gold": "e6_no_potion"}
  - prompt: What is the main lesson of the story?
    options:
    - There is no shortcut to success; hard work pays
    - Never trust farmers
    - Bananas are magic
    - Always look for potions
    answer: There is no shortcut to success; hard work pays
    difficulty: 2
    hints:
    - Think about how things changed.
    - Effort.
    solution: The story shows hard work, not magic, brings success.
    mistakes: {"Always look for potions": "e6_no_shortcut"}
  - prompt: Who wrote 'A Bottle of Dew'?
    options:
    - Sudha Murty
    - Ruskin Bond
    - R. K. Narayan
    answer: Sudha Murty
    difficulty: 1
    hints:
    - She is a well-known Indian writer of stories for children.
    - Her name is in the chapter title line.
    solution: 'Step 1: the story is by an Indian author known for simple moral tales. Step 2: it is Sudha Murty.'
    mistakes:
      Ruskin Bond: c6e1_events
      R. K. Narayan: c6e1_events
  - prompt: What was the sage's name?
    options:
    - Mahipati
    - Rama Natha
    - Gajaraj
    answer: Mahipati
    difficulty: 1
    hints:
    - Rama Natha is the main character.
    - Gajaraj is an elephant in another story.
    solution: 'Step 1: Rama Natha visits a wise man. Step 2: that sage is Mahipati.'
    mistakes:
      Rama Natha: c6e1_events
      Gajaraj: c6e1_events
  - prompt: How many litres of dew did Rama Natha have to collect?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - It was a lot of dew.
    - The sage named a number of litres.
    solution: 'Step 1: the sage asked for a fixed amount. Step 2: it was five litres.'
    mistakes:
      '1': c6e1_events
      '10': c6e1_events
  - prompt: About how many years did Rama Natha work on the bananas?
    options:
    - About six
    - About one
    - About twenty
    answer: About six
    difficulty: 2
    hints:
    - Collecting dew was very slow.
    - It took several years.
    solution: 'Step 1: dew gathers only a little each morning. Step 2: it took him about six years.'
    mistakes:
      About one: c6e1_events
      About twenty: c6e1_events
  - prompt: What did Madhumati do while her husband collected dew?
    options:
    - Sold the bananas
    - Searched for gold
    - Left the village
    answer: Sold the bananas
    difficulty: 2
    hints:
    - The plants gave fruit.
    - Someone had to sell it.
    solution: 'Step 1: the banana plants gave fruit. Step 2: Madhumati sold it and saved the money.'
    mistakes:
      Searched for gold: c6e1_events
      Left the village: c6e1_events
  - prompt: Which word best describes Madhumati?
    options:
    - Sensible
    - Lazy
    - Greedy
    answer: Sensible
    difficulty: 2
    hints:
    - She worried about wasted money.
    - She sold the bananas wisely.
    solution: 'Step 1: she worried about her husband''s foolish search. Step 2: she managed the banana money well: sensible.'
    mistakes:
      Lazy: c6e1_trait
      Greedy: c6e1_trait
  - prompt: 'In the story, ''potion'' means:'
    options:
    - A magic liquid
    - A type of banana
    - A farm tool
    answer: A magic liquid
    difficulty: 1
    hints:
    - Rama Natha wanted it to turn things into gold.
    - It is something you could keep in a bottle.
    solution: 'Step 1: he wanted something that makes gold. Step 2: a potion is a (magic) liquid.'
    mistakes:
      A type of banana: c6e1_word
      A farm tool: c6e1_word
  - prompt: Why did the sage insist Rama Natha water the plants with his own hands?
    options:
    - So he would work hard himself
    - Because servants were banned
    - Because water was magic
    answer: So he would work hard himself
    difficulty: 3
    hints:
    - What did Rama Natha avoid before?
    - The sage wanted to change that.
    solution: 'Step 1: Rama Natha had neglected work. Step 2: watering by hand made him do the hard work himself.'
    mistakes:
      Because servants were banned: c6e1_why
      Because water was magic: c6e1_why
  - prompt: Which saying fits this story best?
    options:
    - Hard work is the key to success
    - Money grows on trees
    - Magic solves all problems
    answer: Hard work is the key to success
    difficulty: 2
    hints:
    - What really made them rich?
    - There was no magic.
    solution: 'Step 1: years of farming made them rich. Step 2: so hard work, not magic, is the key.'
    mistakes:
      Money grows on trees: c6e1_moral
      Magic solves all problems: c6e1_moral
- code: cbse6e.u1.raven
  title: The Raven and the Fox (poem)
  notes: |
    A poem based on the old fable. A raven sits on a branch with a piece of cheese (food) in its beak. A hungry fox wants it
    and flatters the raven, praising its fine feathers and saying its voice must be lovely; he asks it to sing. The proud
    raven opens its beak to caw, the cheese falls, and the fox grabs it and runs off. Moral: beware of flatterers; praise can
    be used to trick you. Literary features: rhyme, dialogue, characters who are animals (fable).
  explanations:
    text: 'A raven sits in a tree with a piece of cheese. A clever fox praises the raven''s beauty and asks it to sing. The raven, pleased, opens its beak to caw, and the cheese drops straight to the fox. The lesson: don''t be fooled by flattery.'
    visual: 'Picture a black raven on a branch, cheese in its beak, and a smiling fox below with its paws together, saying ''Sing for me!''. Next frame: the beak open, cheese falling into the fox''s mouth.'
    step_by_step: 'Step 1: What the raven has. Step 2: What the fox wants. Step 3: How the fox tricks it: flattery. Step 4: What happens when the raven sings. Step 5: The moral.'
    real_world: If someone praises you a lot just before asking for something, it is wise to stop and think, like the raven should have.
  picture:
    kind: flow
    steps:
    - Raven has cheese
    - Fox flatters the raven
    - Fox asks it to sing
    - Raven caws; cheese falls
    - Fox runs off with it
    alt: 'The fable in five steps: the raven has cheese, the fox flatters it, asks it to sing, the cheese falls when it caws, and the fox runs away.'
  activity:
    type: sort
    prompt: 'The Raven and the Fox: what is each line really about?'
    bins:
    - Flattery
    - Pride
    - The trick works
    items:
    - label: Your feathers are so fine
      bin: Flattery
      clue: Does the fox mean it, or want something?
      why: 'The fox praises the feathers only to get the cheese: that''s flattery.'
    - label: Your voice must be lovely; sing for me
      bin: Flattery
      clue: Ravens are not famous singers.
      why: Asking a raven to sing is false praise with a purpose.
    - label: The raven opens its beak to caw
      bin: Pride
      clue: Why does it want to show off?
      why: Pleased by the praise, the raven wants to prove it can sing.
    - label: The cheese falls to the ground
      bin: The trick works
      clue: What happens when the beak opens?
      why: 'Opening the beak drops the cheese: the fox''s plan has worked.'
    - label: The fox grabs it and runs off
      bin: The trick works
      clue: Who ends up with the food?
      why: The fox gets what it wanted all along.
  lesson:
    - teach: The Raven and the Fox is a fable in verse. A raven sits on a branch with a piece of cheese in its beak. A hungry fox below wants the cheese.
      check:
        prompt: Where is the raven at the start?
        options:
        - On a branch
        - In a river
        - In a cage
        answer: On a branch
        why: The fox is below, the raven up on a branch.
    - teach: 'The fox flatters the raven: he praises its fine feathers and says its voice must be lovely, and asks it to sing. Flattery is praise that isn''t sincere, used to get something.'
      check:
        prompt: Why does the fox praise the raven?
        options:
        - To trick it into dropping the cheese
        - Because he truly loves its voice
        - To make friends
        answer: To trick it into dropping the cheese
        why: His praise is a trick to get the food.
    - teach: 'The proud raven opens its beak to caw, the cheese falls, and the fox runs off with it. The moral: beware of flatterers. A fable is a short story, often with talking animals, that teaches a lesson; this one uses rhyme and dialogue.'
      picture:
        kind: flow
        steps:
        - Raven holds cheese
        - Fox flatters
        - Raven caws
        - Cheese falls
        - Fox runs off
        alt: The fox flatters the raven, the raven caws, the cheese falls and the fox takes it.
      check:
        prompt: What made the raven open its beak?
        options:
        - Pride in its 'lovely voice'
        - Fear of the fox
        - Hunger
        answer: Pride in its 'lovely voice'
        why: It believed the flattery and wanted to show off.
  items:
  - prompt: What did the raven have in its beak?
    options:
    - A piece of cheese
    - A worm
    - A leaf
    - A stone
    answer: A piece of cheese
    difficulty: 1
    hints:
    - The fox wanted it.
    - Food.
    solution: The raven had a piece of cheese.
    mistakes: {"A worm": "e6_raven_cheese"}
  - prompt: How did the fox trick the raven?
    options:
    - By flattering it and asking it to sing
    - By climbing the tree
    - By shouting loudly
    - By offering money
    answer: By flattering it and asking it to sing
    difficulty: 1
    hints:
    - Sweet words.
    - Praise.
    solution: The fox praised the raven and asked it to sing.
    mistakes: {"By climbing the tree": "e6_flattery_trick"}
  - prompt: What happened when the raven opened its beak?
    options:
    - The cheese fell and the fox took it
    - It flew away
    - The fox sang too
    - It ate the cheese
    answer: The cheese fell and the fox took it
    difficulty: 1
    hints:
    - Open beak.
    - Gravity.
    solution: The cheese dropped and the fox grabbed it.
    mistakes: {"It ate the cheese": "e6_beak_open"}
  - prompt: What does 'flattery' mean?
    options:
    - Praise that is not sincere, used to get something
    - An honest warning
    - A loud noise
    - A kind of bird
    answer: Praise that is not sincere, used to get something
    difficulty: 2
    hints:
    - The fox's sweet words.
    - Not meant truly.
    solution: Flattery is insincere praise to get something.
    mistakes: {"An honest warning": "e6_flattery"}
  - prompt: What is the moral of the poem?
    options:
    - Beware of flatterers
    - Always sing loudly
    - Foxes are kind
    - Cheese is healthy
    answer: Beware of flatterers
    difficulty: 1
    hints:
    - What did the raven lose?
    - Why?
    solution: Don't be fooled by flattery.
    mistakes:
      Always sing loudly: eng6_poem_meaning
  - prompt: 'A story where animals talk and teach a lesson is called a:'
    options:
    - fable
    - biography
    - news report
    - recipe
    answer: fable
    difficulty: 2
    hints:
    - Aesop and Panchatantra.
    - Moral at the end.
    solution: Such a story is a fable.
    mistakes: {"biography": "e6_fable"}
  - prompt: Which animal tricks the other in the poem?
    options:
    - The fox
    - The raven
    - A dog
    answer: The fox
    difficulty: 1
    hints:
    - One animal wants the food.
    - It uses sweet words.
    solution: 'Step 1: the fox wants the cheese. Step 2: he tricks the raven with flattery.'
    mistakes:
      The raven: c6e1_events
      A dog: c6e1_events
  - prompt: Which part of the raven does the fox praise?
    options:
    - Its feathers and voice
    - Its nest
    - Its cheese
    answer: Its feathers and voice
    difficulty: 1
    hints:
    - He wants the raven to sing.
    - He also admires how it looks.
    solution: 'Step 1: the fox praises its fine feathers. Step 2: and says its voice must be lovely.'
    mistakes:
      Its nest: c6e1_events
      Its cheese: c6e1_events
  - prompt: Which word describes the raven after the fox's praise?
    options:
    - Proud
    - Wise
    - Angry
    answer: Proud
    difficulty: 2
    hints:
    - It believed the praise.
    - It wanted to show off.
    solution: 'Step 1: the praise made the raven feel grand. Step 2: it became proud and opened its beak.'
    mistakes:
      Wise: c6e1_trait
      Angry: c6e1_trait
  - prompt: Which word describes the fox?
    options:
    - Cunning
    - Honest
    - Shy
    answer: Cunning
    difficulty: 1
    hints:
    - He uses a trick.
    - Clever in a sneaky way.
    solution: 'Step 1: the fox plans a trick. Step 2: someone clever and sneaky is cunning.'
    mistakes:
      Honest: c6e1_trait
      Shy: c6e1_trait
  - prompt: What should the raven have done?
    options:
    - Kept its beak shut and ignored the praise
    - Sung louder
    - Thrown the cheese to the fox
    answer: Kept its beak shut and ignored the praise
    difficulty: 2
    hints:
    - Opening its beak lost the cheese.
    - The praise was a trick.
    solution: 'Step 1: the cheese fell when it opened its beak. Step 2: it should have ignored the flattery.'
    mistakes:
      Sung louder: c6e1_why
      Thrown the cheese to the fox: c6e1_why
  - prompt: 'In the poem, ''caw'' is:'
    options:
    - The sound a raven makes
    - A kind of cheese
    - A tree branch
    answer: The sound a raven makes
    difficulty: 1
    hints:
    - The raven 'sings'.
    - Crows and ravens make this sound.
    solution: 'Step 1: the raven tries to sing. Step 2: its call is ''caw''.'
    mistakes:
      A kind of cheese: c6e1_word
      A tree branch: c6e1_word
  - prompt: Why is this poem called a fable?
    options:
    - Animals talk and it teaches a lesson
    - It is about a real raven in a zoo
    - It has no characters
    answer: Animals talk and it teaches a lesson
    difficulty: 2
    hints:
    - What do the animals do?
    - What do we learn at the end?
    solution: 'Step 1: the fox speaks to the raven. Step 2: and the story teaches a moral, so it is a fable.'
    mistakes:
      It is about a real raven in a zoo: c6e1_moral
      It has no characters: c6e1_moral
  - prompt: A classmate praises your new pen a lot and then asks to keep it. What does the poem teach you to do?
    options:
    - 'Be careful: the praise may be to get something'
    - Give it at once
    - Believe every compliment
    answer: 'Be careful: the praise may be to get something'
    difficulty: 3
    hints:
    - Remember why the fox praised the raven.
    - Praise followed by a request...
    solution: 'Step 1: the fox praised to get the cheese. Step 2: so be careful when praise comes with a request.'
    mistakes:
      Give it at once: c6e1_moral
      Believe every compliment: c6e1_moral
  - prompt: Who ends up with the cheese?
    options:
    - The fox
    - The raven
    - Nobody
    answer: The fox
    difficulty: 1
    hints:
    - The cheese fell.
    - Who was waiting below?
    solution: 'Step 1: the cheese dropped from the raven''s beak. Step 2: the fox grabbed it.'
    mistakes:
      The raven: c6e1_events
      Nobody: c6e1_events
- code: cbse6e.u1.rama
  title: Rama to the Rescue
  notes: |
    A humorous folk tale. One night a tired man and his wife hear noises and realise a thief is in or near their house.
    Instead of panicking, the wife tells her husband to lie still, and they begin a loud, made-up conversation about the
    child they will have and what to name him: Rama. As they keep calling "Rama! Rama!", the thief grows confused. Rama is
    the village watchman (kotwal); he hears his name called again and again, comes running, and catches the thief.
    Themes: quick, calm thinking and cleverness in a tight spot.
  explanations:
    text: A couple realise a thief is in their house at night. Instead of screaming, they start a loud pretend chat about naming their future son Rama, and keep calling 'Rama!'. Rama is the village watchman. He hears his name, comes running and catches the thief. Clever, calm thinking saves the day.
    visual: 'Picture a dark house at night: a couple lying in bed talking loudly about baby names, a thief crouching in the shadows looking puzzled, and the watchman Rama running up the lane with a lantern.'
    step_by_step: 'Step 1: The problem: a thief at night. Step 2: The plan: stay calm and talk loudly about naming a child Rama. Step 3: They keep calling ''Rama!''. Step 4: Rama, the watchman, hears and comes. Step 5: The thief is caught.'
    real_world: 'If you notice something wrong at night, stay calm, wake an adult and get help: neighbours or the police (112 in India).'
  picture:
    kind: flow
    steps:
    - A thief at night
    - Couple stay calm
    - Loud talk about naming a child Rama
    - Rama the watchman hears his name
    - Thief is caught
