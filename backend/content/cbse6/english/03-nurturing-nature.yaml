concepts:
- code: cbse6e.u3.neem
  title: Neem Baba
  notes: |
    A chapter about the neem tree, the 'village pharmacy' of India, presented as Neem Baba talking about itself. Neem has been
    used for thousands of years. Uses: medicinal (leaves and oil are antiseptic, help skin problems; neem twigs used as a
    toothbrush, datun), agricultural (neem cake and oil as natural pesticide and fertiliser, protects stored grain),
    environmental (hardy in dry areas, gives shade, cleans air). India worked to protect neem knowledge as traditional
    knowledge. Theme: respect and care for nature.
  explanations:
    text: 'Neem Baba is the neem tree, telling us about itself. For thousands of years, people in India have used neem: its leaves and oil fight germs, its twigs clean teeth, and farmers use it to keep insects away from crops. It grows even in dry places and gives cool shade. Neem reminds us to value and protect trees.'
    visual: Picture a big, wise old neem tree with a kind face in its bark, children sitting in its shade, a grandmother breaking a twig to brush her teeth, and a farmer spraying neem oil on plants.
    step_by_step: 'Step 1: Who is speaking: the neem tree. Step 2: List its medicinal uses. Step 3: List its farming uses. Step 4: List its environmental benefits. Step 5: Why we should protect it.'
    real_world: Many Indian homes put dried neem leaves in rice or wheat bins to keep insects away.
  picture:
    kind: compare
    columns:
    - title: Medicine
      points:
      - fights germs
      - skin care
      - twig toothbrush
    - title: Farming
      points:
      - natural pesticide
      - fertiliser
      - protects stored grain
    alt: Neem is used in medicine to fight germs, for skin care and as a twig toothbrush, and in farming as a natural pesticide, fertiliser and grain protector.
  activity:
    type: sort
    prompt: 'Neem Baba: how is neem used?'
    bins:
    - Medicine
    - Farming
    - Environment
    items:
    - label: Twigs as a toothbrush (datun)
      bin: Medicine
      clue: Keeps teeth and gums healthy.
      why: 'Neem datun is for health: a medicinal use.'
    - label: Leaves on skin problems
      bin: Medicine
      clue: Neem is antiseptic.
      why: 'Antiseptic leaves heal skin: medicine.'
    - label: Neem cake as fertiliser
      bin: Farming
      clue: Put in the soil for crops.
      why: 'Fertiliser helps crops grow: a farming use.'
    - label: Leaves keep insects from stored grain
      bin: Farming
      clue: A natural pesticide.
      why: Protecting grain from pests is a farming use.
    - label: Grows in dry areas and gives shade
      bin: Environment
      clue: What the tree does for the place around it.
      why: Shade and growing in dry land help the environment.
    - label: Cleans the air
      bin: Environment
      clue: Trees and the air we breathe.
      why: Cleaner air is an environmental benefit.
  items:
  - prompt: Who is 'Neem Baba'?
    options:
    - The neem tree
    - A doctor
    - A farmer
    - A sage
    answer: The neem tree
    difficulty: 1
    hints:
    - It talks about itself.
    - A tree.
    solution: Neem Baba is the neem tree.
    mistakes:
      A doctor: eng6_read_again
  - prompt: 'A neem twig used to clean teeth is called a:'
    options:
    - datun
    - danda
    - dal
    - dupatta
    answer: datun
    difficulty: 1
    hints:
    - Chewed and brushed.
    - Traditional.
    solution: It is called a datun.
    mistakes: {"danda": "e6_datun"}
  - prompt: How do farmers use neem?
    options:
    - As a natural pesticide
    - As cattle feed only
    - To build houses
    - As fuel for tractors
    answer: As a natural pesticide
    difficulty: 1
    hints:
    - Keeps insects away.
    - Safe for soil.
    solution: Neem is a natural pesticide.
    mistakes: {"As fuel for tractors": "e6_neem_pest"}
  - prompt: 'Neem is often called the:'
    options:
    - village pharmacy
    - village school
    - village market
    - village well
    answer: village pharmacy
    difficulty: 2
    hints:
    - Many medicines.
    - Pharmacy.
    solution: It is called the village pharmacy.
    mistakes: {"village school": "e6_pharmacy"}
  - prompt: Why can neem grow in many parts of India?
    options:
    - It is hardy and survives dry conditions
    - It needs snow
    - It grows only in water
    - It needs no sunlight
    answer: It is hardy and survives dry conditions
    difficulty: 2
    hints:
    - Tough tree.
    - Little water.
    solution: Neem survives heat and dryness.
    mistakes: {"It grows only in water": "e6_hardy"}
  - prompt: What is the main message of the chapter?
    options:
    - Value and protect useful trees like neem
    - Cut trees for wood
    - Neem is useless
    - Only use chemical medicines
    answer: Value and protect useful trees like neem
    difficulty: 2
    hints:
    - Respect nature.
    - Care.
    solution: We should value and protect trees like neem.
    mistakes: {"Cut trees for wood": "e6_neem_message"}
- code: cbse6e.u3.bird
  title: What a Bird Thought (poem)
  notes: |
    A poem told by a young bird. First home: inside a small, round, pale blue egg shell, it thinks the whole world is made
    of pale blue shell. Second home: in a straw nest with its mother, warm and safe, it thinks the world is made of straw.
    Then it flutters out of the nest, sees leaves and the wide world, and realises "I have been very blind": the world is far
    bigger than it thought. It also notices that others still don't know how the world is made. Theme: growing up,
    discovery, the world is bigger than our small experience.
  explanations:
    text: 'A baby bird tells its story. Inside the egg, it thought the world was a small blue shell. In the nest, it thought the world was made of straw. When it finally flew out and saw the leaves and sky, it realised it had been ''very blind'': the world is much bigger than it knew.'
    visual: 'Draw three circles getting bigger: a small blue egg, a straw nest, and a huge sky with trees. The bird grows in each picture and its eyes get wider.'
    step_by_step: 'Step 1: First home and first idea: shell. Step 2: Second home and idea: straw nest. Step 3: Flying out: the big world. Step 4: What the bird learns about itself.'
    real_world: 'Moving from a small village school to a big city, or reading a new book, can make us feel like the bird: the world is bigger than we thought.'
  picture:
    kind: flow
    steps:
    - 'In the egg: ''the world is a pale blue shell'''
    - 'In the nest: ''the world is made of straw'''
    - 'Out among leaves: ''the world is huge'''
    - '''I have been very blind'''
    alt: The bird thinks the world is a blue shell, then a straw nest, then sees how huge it is and says it had been very blind.
  activity:
    type: order
    prompt: 'What a Bird Thought: put the bird''s ''worlds'' in order.'
    steps:
    - The world is made of pale blue shell
    - The world is made of straw
    - It flutters out and sees the leaves
    - '"I have been very blind"'
    reasons:
      The world is made of straw: After hatching, it lives in the nest.
      It flutters out and sees the leaves: It leaves the nest for the first time.
      '"I have been very blind"': Seeing the wide world, it knows it was wrong before.
  items:
  - prompt: Who is the speaker of the poem?
    options:
    - A young bird
    - A tree
    - A boy
    - The sky
    answer: A young bird
    difficulty: 1
    hints:
    - Title.
    - It hatches.
    solution: A young bird speaks.
    mistakes: {"A boy": "e6_bird_speaker"}
  - prompt: What colour was the bird's first home?
    options:
    - Pale blue
    - Bright red
    - Black
    - Green
    answer: Pale blue
    difficulty: 1
    hints:
    - The egg shell.
    - Light colour.
    solution: The shell was pale blue.
    mistakes: {"Bright red": "e6_blue_shell"}
  - prompt: 'When it lived in the nest, the bird thought the world was made of:'
    options:
    - straw
    - shell
    - water
    - stone
    answer: straw
    difficulty: 1
    hints:
    - Nest material.
    - Dry grass.
    solution: It thought the world was made of straw.
    mistakes: {"stone": "e6_straw"}
  - prompt: What did the bird realise when it left the nest?
    options:
    - The world was much bigger than it thought
    - The world was a shell
    - It could not fly
    - Leaves are blue
    answer: The world was much bigger than it thought
    difficulty: 2
    hints:
    - Leaves, sky.
    - Big.
    solution: It saw the world was far bigger.
    mistakes:
      The world was a shell: eng6_poem_meaning
  - prompt: What does 'I have been very blind' mean here?
    options:
    - I did not understand how big the world was
    - My eyes were hurt
    - It was dark outside
    - I was sleeping
    answer: I did not understand how big the world was
    difficulty: 2
    hints:
    - Not real blindness.
    - Ignorance.
    solution: It means it hadn't understood the world.
    mistakes: {"My eyes were hurt": "e6_blind"}
  - prompt: What is the poem mainly about?
    options:
    - Growing up and discovering the world
    - Building nests
    - Bird food
    - Winter weather
    answer: Growing up and discovering the world
    difficulty: 2
    hints:
    - Stages of life.
    - Learning.
    solution: It's about growing and discovering.
    mistakes: {"Building nests": "e6_growing_up"}
- code: cbse6e.u3.spices
  title: Spices that Heal Us
  notes: |
    An informative chapter on Indian spices that are also used as home remedies. Turmeric (haldi): antiseptic, helps heal
    wounds, haldi doodh for colds. Ginger (adrak): soothes cough and cold, aids digestion. Cumin (jeera): digestion.
    Asafoetida (hing): relieves gas and stomach-ache. Fenugreek (methi): seeds good for digestion. Clove (laung): eases
    toothache. Cardamom (elaichi): freshens breath. Cinnamon (dalchini) and fennel (saunf): digestion, flavour. India has
    traded spices for thousands of years (Kerala's Malabar coast: pepper, cardamom). Use in moderation; see a doctor for
    serious illness.
  explanations:
    text: Indian kitchens are full of spices that are also home remedies. Turmeric helps wounds heal, ginger soothes colds, clove eases toothache, and hing helps a stomach-ache. India, especially Kerala's Malabar coast, has traded spices with the world for thousands of years. Spices help, but serious illness needs a doctor.
    visual: 'Picture a steel masala box (masala dabba) with little bowls: yellow turmeric, brown cumin, green cardamom, black pepper and cloves, each labelled with what it helps.'
    step_by_step: 'Step 1: Name the spice. Step 2: Note its Hindi or local name. Step 3: Note how it helps health. Step 4: Remember: use small amounts and see a doctor when really ill.'
    real_world: Many families give children warm turmeric milk (haldi doodh) for a cold, and chew saunf after meals.
  picture:
    kind: compare
    columns:
    - title: Spice
      points:
      - Turmeric
      - Clove
      - Ginger
      - Asafoetida (hing)
    - title: Helps with
      points:
      - healing wounds
      - toothache
      - cough and cold
      - stomach-ache
    alt: Turmeric helps heal wounds, clove eases toothache, ginger soothes a cough and cold, and hing helps a stomach-ache.
  activity:
    type: sort
    prompt: 'Spices that Heal Us: which spice helps?'
    bins:
    - Turmeric
    - Clove
    - Asafoetida
    - Cardamom
    items:
    - label: Helps heal a wound
      bin: Turmeric
      clue: Haldi is an antiseptic.
      why: Haldi (turmeric) is used on wounds because it is antiseptic.
    - label: Eases a toothache
      bin: Clove
      clue: Laung.
      why: Clove (laung) is the toothache remedy.
    - label: Relieves gas and stomach-ache
      bin: Asafoetida
      clue: Hing.
      why: Hing (asafoetida) is used for gas.
    - label: Freshens breath
      bin: Cardamom
      clue: Elaichi.
      why: Elaichi (cardamom) freshens breath.
    - label: Haldi doodh for a cold
      bin: Turmeric
      clue: Yellow milk.
      why: Haldi doodh is milk with turmeric.
  items:
  - prompt: Which spice is known for helping wounds heal?
    options:
    - Turmeric
    - Cardamom
    - Cinnamon
    - Fennel
    answer: Turmeric
    difficulty: 1
    hints:
    - Yellow spice.
    - Haldi.
    solution: Turmeric is antiseptic.
    mistakes: {"Cardamom": "e6_turmeric"}
  - prompt: Which spice is traditionally used for toothache?
    options:
    - Clove
    - Cumin
    - Turmeric
    - Fenugreek
    answer: Clove
    difficulty: 1
    hints:
    - Laung.
    - Small, nail-shaped.
    solution: Clove eases toothache.
    mistakes:
      Turmeric: eng6_read_again
  - prompt: '''Hing'' is the Hindi name for:'
    options:
    - asafoetida
    - ginger
    - pepper
    - cardamom
    answer: asafoetida
