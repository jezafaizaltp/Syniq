# CBSE Class 6 English (NCERT Poorvi, 2024-25), unit 3. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse6-eng
chapter: 3
title: 'Nurturing Nature: Neem Baba · What a Bird Thought · Spices that Heal Us'
tips:
  e6_bird_speaker: "The speaker talks about a shell and a nest. Who lives there first?"
  e6_blind: "The bird's eyes were fine. 'Blind' here means not knowing something."
  e6_blue_shell: "The first home is the egg. Think of the colour of a robin's egg."
  e6_datun: "A danda is a stick for hitting. The twig used for teeth has its own name, also starting with 'd'."
  e6_doctor: "Spices help with small things. For serious illness, who should you see?"
  e6_ginger: "Ginger tea is a home remedy for a sore throat."
  e6_growing_up: "The bird moves from shell to nest to the whole world. What is it doing?"
  e6_hardy: "Much of India is hot and dry. Neem survives there because it is tough."
  e6_hing: "Ginger is 'adrak'. Hing has a strong smell and a long English name."
  e6_malabar: "The Coromandel coast is on the east side of India. Kerala is on the west."
  e6_neem_message: "The chapter lists many uses of neem. Would it ask us to cut such a tree?"
  e6_neem_pest: "Neem is bitter and keeps insects away. How would farmers use that on crops?"
  e6_pharmacy: "Neem treats skin, teeth and more. Where do you go to get medicines?"
  e6_straw: "In the nest, everything the bird saw was the nest. What is a nest made of?"
  e6_turmeric: "A yellow spice is put on cuts at home in many Indian families."
  c6e3_use: 'Sort the use into its group: health, farming, or the environment.'
  c6e3_fact: Go back to the information in the chapter and match each item to what it is used for.
  c6e3_word: Use the sentence around the word, and what you know of the topic, to find its meaning.
  c6e3_poem: Follow the bird's homes in order and what it thought the world was made of in each.
  c6e3_theme: Ask what the whole piece wants us to feel or do, not just one detail.

concepts:
- code: cbse6e.u3.neem
  title: Neem Baba
  notes: |
    A chapter about the neem tree, the 'village pharmacy' of India, presented as Neem Baba talking about itself. Neem has been
    used for thousands of years. Uses: medicinal (leaves and oil are antiseptic, help skin problems; neem twigs used as a
    toothbrush, datun), agricultural (neem cake and oil as natural pesticide and fertiliser, protects stored grain),
    environmental (hardy in dry areas, gives shade, cleans air). India worked to protect neem knowledge as traditional
    knowledge. Theme: respect and care for nature.
  explanations:
    text: 'Neem Baba is the neem tree, telling us about itself. For thousands of years, people in India have used neem: its leaves and oil fight germs, its twigs clean teeth, and farmers use it to keep insects away from crops. It grows even in dry places and gives cool shade. Neem reminds us to value and protect trees.'
    visual: Picture a big, wise old neem tree with a kind face in its bark, children sitting in its shade, a grandmother breaking a twig to brush her teeth, and a farmer spraying neem oil on plants.
    step_by_step: 'Step 1: Who is speaking: the neem tree. Step 2: List its medicinal uses. Step 3: List its farming uses. Step 4: List its environmental benefits. Step 5: Why we should protect it.'
    real_world: Many Indian homes put dried neem leaves in rice or wheat bins to keep insects away.
  picture:
    kind: compare
    columns:
    - title: Medicine
      points:
      - fights germs
      - skin care
      - twig toothbrush
    - title: Farming
      points:
      - natural pesticide
      - fertiliser
      - protects stored grain
    alt: Neem is used in medicine to fight germs, for skin care and as a twig toothbrush, and in farming as a natural pesticide, fertiliser and grain protector.
  activity:
    type: sort
    prompt: 'Neem Baba: how is neem used?'
    bins:
    - Medicine
    - Farming
    - Environment
    items:
    - label: Twigs as a toothbrush (datun)
      bin: Medicine
      clue: Keeps teeth and gums healthy.
      why: 'Neem datun is for health: a medicinal use.'
    - label: Leaves on skin problems
      bin: Medicine
      clue: Neem is antiseptic.
      why: 'Antiseptic leaves heal skin: medicine.'
    - label: Neem cake as fertiliser
      bin: Farming
      clue: Put in the soil for crops.
      why: 'Fertiliser helps crops grow: a farming use.'
    - label: Leaves keep insects from stored grain
      bin: Farming
      clue: A natural pesticide.
      why: Protecting grain from pests is a farming use.
    - label: Grows in dry areas and gives shade
      bin: Environment
      clue: What the tree does for the place around it.
      why: Shade and growing in dry land help the environment.
    - label: Cleans the air
      bin: Environment
      clue: Trees and the air we breathe.
      why: Cleaner air is an environmental benefit.
  lesson:
    - teach: In 'Neem Baba', the neem tree speaks about itself. Neem has been used in India for thousands of years and is called the 'village pharmacy' because so many of its parts help health.
      check:
        prompt: Why is neem called the 'village pharmacy'?
        options:
        - Its parts are used as medicines
        - It sells medicines in shops
        - It grows only in pharmacies
        answer: Its parts are used as medicines
        why: Leaves, oil and twigs are used as remedies.
    - teach: Neem leaves and oil are antiseptic and help skin problems. Neem twigs are chewed as a toothbrush (datun). Farmers use neem cake and oil as a natural pesticide and fertiliser, and to protect stored grain.
      picture:
        kind: compare
        columns:
        - title: Health
          points:
          - antiseptic leaves and oil
          - datun for teeth
        - title: Farming
          points:
          - natural pesticide
          - protects stored grain
          - neem cake fertiliser
        - title: Environment
          points:
          - grows in dry areas
          - gives shade
          - cleans air
        alt: Neem helps health, farming and the environment.
      check:
        prompt: 'Putting dry neem leaves in a grain store helps to:'
        options:
        - Keep insects away
        - Make the grain sweet
        - Grow more grain
        answer: Keep insects away
        why: Neem is a natural pesticide.
    - teach: 'Neem is hardy: it grows even in dry areas, gives shade and helps clean the air. India worked to protect neem as traditional knowledge so others could not claim it. The message: value and protect useful trees.'
      check:
        prompt: '''Hardy'' (about a tree) means:'
        options:
        - Able to survive difficult conditions
        - Very soft
        - Easy to break
        answer: Able to survive difficult conditions
        why: Neem survives even dry places.
  items:
  - prompt: Who is 'Neem Baba'?
    options:
    - The neem tree
    - A doctor
    - A farmer
    - A sage
    answer: The neem tree
    difficulty: 1
    hints:
    - It talks about itself.
    - A tree.
    solution: Neem Baba is the neem tree.
    mistakes:
      A doctor: eng6_read_again
  - prompt: 'A neem twig used to clean teeth is called a:'
    options:
    - datun
    - danda
    - dal
    - dupatta
    answer: datun
    difficulty: 1
    hints:
    - Chewed and brushed.
    - Traditional.
    solution: It is called a datun.
    mistakes: {"danda": "e6_datun"}
  - prompt: How do farmers use neem?
    options:
    - As a natural pesticide
    - As cattle feed only
    - To build houses
    - As fuel for tractors
    answer: As a natural pesticide
    difficulty: 1
    hints:
    - Keeps insects away.
    - Safe for soil.
    solution: Neem is a natural pesticide.
    mistakes: {"As fuel for tractors": "e6_neem_pest"}
  - prompt: 'Neem is often called the:'
    options:
    - village pharmacy
    - village school
    - village market
    - village well
    answer: village pharmacy
    difficulty: 2
    hints:
    - Many medicines.
    - Pharmacy.
    solution: It is called the village pharmacy.
    mistakes: {"village school": "e6_pharmacy"}
  - prompt: Why can neem grow in many parts of India?
    options:
    - It is hardy and survives dry conditions
    - It needs snow
    - It grows only in water
    - It needs no sunlight
    answer: It is hardy and survives dry conditions
    difficulty: 2
    hints:
    - Tough tree.
    - Little water.
    solution: Neem survives heat and dryness.
    mistakes: {"It grows only in water": "e6_hardy"}
  - prompt: What is the main message of the chapter?
    options:
    - Value and protect useful trees like neem
    - Cut trees for wood
    - Neem is useless
    - Only use chemical medicines
    answer: Value and protect useful trees like neem
    difficulty: 2
    hints:
    - Respect nature.
    - Care.
    solution: We should value and protect trees like neem.
    mistakes: {"Cut trees for wood": "e6_neem_message"}
  - prompt: Who is the speaker in 'Neem Baba'?
    options:
    - The neem tree itself
    - A farmer
    - A doctor
    answer: The neem tree itself
    difficulty: 1
    hints:
    - '''Baba'' is a respectful name.'
    - The tree tells its own story.
    solution: 'Step 1: Neem Baba is the neem tree. Step 2: it speaks about itself.'
    mistakes:
      A farmer: c6e3_fact
      A doctor: c6e3_fact
  - prompt: Neem used to treat skin problems belongs to which group of uses?
    options:
    - Medicinal
    - Agricultural
    - Building
    answer: Medicinal
    difficulty: 1
    hints:
    - Skin problems are about health.
    - Medicine.
    solution: 'Step 1: treating skin is a health use. Step 2: so it is medicinal.'
    mistakes:
      Agricultural: c6e3_use
      Building: c6e3_use
  - prompt: '''Antiseptic'' means something that:'
    options:
    - Stops germs from growing
    - Makes food spicy
    - Helps plants flower
    answer: Stops germs from growing
    difficulty: 2
    hints:
    - Neem is used on skin and wounds.
    - It fights infection.
    solution: 'Step 1: neem helps wounds and skin. Step 2: an antiseptic stops germs and infection.'
    mistakes:
      Makes food spicy: c6e3_word
      Helps plants flower: c6e3_word
  - prompt: 'Neem cake spread in fields is used as:'
    options:
    - Fertiliser and pesticide
    - Food for people
    - Fuel for cars
    answer: Fertiliser and pesticide
    difficulty: 2
    hints:
    - It is a farming use.
    - It feeds soil and keeps pests away.
    solution: 'Step 1: neem cake is what is left after pressing oil from seeds. Step 2: farmers use it as fertiliser and pesticide.'
    mistakes:
      Food for people: c6e3_use
      Fuel for cars: c6e3_use
  - prompt: Giving shade and cleaning the air are which kind of neem use?
    options:
    - Environmental
    - Medicinal
    - Musical
    answer: Environmental
    difficulty: 1
    hints:
    - They help the surroundings.
    - Not medicine, not farming.
    solution: 'Step 1: shade and clean air help our surroundings. Step 2: these are environmental benefits.'
    mistakes:
      Medicinal: c6e3_use
      Musical: c6e3_use
  - prompt: Why did India work to protect neem knowledge?
    options:
    - So others could not wrongly claim it as their own invention
    - To stop people planting neem
    - To sell all neem trees
    answer: So others could not wrongly claim it as their own invention
    difficulty: 3
    hints:
    - Indians have used neem for centuries.
    - That knowledge belongs to them.
    solution: 'Step 1: neem''s uses are old Indian traditional knowledge. Step 2: India protected it so no one could wrongly claim it.'
    mistakes:
      To stop people planting neem: c6e3_theme
      To sell all neem trees: c6e3_theme
  - prompt: Which word best describes how the chapter feels about neem?
    options:
    - Respectful
    - Angry
    - Bored
    answer: Respectful
    difficulty: 2
    hints:
    - The tree is called 'Baba'.
    - Its uses are praised.
    solution: 'Step 1: ''Baba'' is a respectful name. Step 2: the chapter praises neem with respect.'
    mistakes:
      Angry: c6e3_theme
      Bored: c6e3_theme
  - prompt: 'A datun is used for:'
    options:
    - Cleaning teeth
    - Washing clothes
    - Lighting lamps
    answer: Cleaning teeth
    difficulty: 1
    hints:
    - It is a neem twig.
    - Chewed in the morning.
    solution: 'Step 1: a datun is a twig that is chewed. Step 2: it cleans teeth.'
    mistakes:
      Washing clothes: c6e3_use
      Lighting lamps: c6e3_use
  - prompt: What can students do after reading 'Neem Baba'?
    options:
    - Plant and care for trees like neem
    - Cut down neem trees
    - Ignore trees
    answer: Plant and care for trees like neem
    difficulty: 1
    hints:
    - What is the chapter's message?
    - Protect useful trees.
    solution: 'Step 1: the chapter asks us to value trees. Step 2: planting and caring for them puts that into action.'
    mistakes:
      Cut down neem trees: c6e3_theme
      Ignore trees: c6e3_theme
- code: cbse6e.u3.bird
  title: What a Bird Thought (poem)
  notes: |
    A poem told by a young bird. First home: inside a small, round, pale blue egg shell, it thinks the whole world is made
    of pale blue shell. Second home: in a straw nest with its mother, warm and safe, it thinks the world is made of straw.
    Then it flutters out of the nest, sees leaves and the wide world, and realises "I have been very blind": the world is far
    bigger than it thought. It also notices that others still don't know how the world is made. Theme: growing up,
    discovery, the world is bigger than our small experience.
  explanations:
    text: 'A baby bird tells its story. Inside the egg, it thought the world was a small blue shell. In the nest, it thought the world was made of straw. When it finally flew out and saw the leaves and sky, it realised it had been ''very blind'': the world is much bigger than it knew.'
    visual: 'Draw three circles getting bigger: a small blue egg, a straw nest, and a huge sky with trees. The bird grows in each picture and its eyes get wider.'
    step_by_step: 'Step 1: First home and first idea: shell. Step 2: Second home and idea: straw nest. Step 3: Flying out: the big world. Step 4: What the bird learns about itself.'
    real_world: 'Moving from a small village school to a big city, or reading a new book, can make us feel like the bird: the world is bigger than we thought.'
  picture:
    kind: flow
    steps:
    - 'In the egg: ''the world is a pale blue shell'''
    - 'In the nest: ''the world is made of straw'''
    - 'Out among leaves: ''the world is huge'''
    - '''I have been very blind'''
    alt: The bird thinks the world is a blue shell, then a straw nest, then sees how huge it is and says it had been very blind.
  activity:
    type: order
    prompt: 'What a Bird Thought: put the bird''s ''worlds'' in order.'
    steps:
    - The world is made of pale blue shell
    - The world is made of straw
    - It flutters out and sees the leaves
    - '"I have been very blind"'
    reasons:
      The world is made of straw: After hatching, it lives in the nest.
      It flutters out and sees the leaves: It leaves the nest for the first time.
      '"I have been very blind"': Seeing the wide world, it knows it was wrong before.
  lesson:
    - teach: '''What a Bird Thought'' is told by a young bird. Its first home is inside a small, round, pale blue egg shell, so it thinks the whole world is made of pale blue shell.'
      check:
        prompt: Why did the bird think the world was pale blue?
        options:
        - It had only seen the inside of its egg
        - The sky was always blue
        - It was colour-blind
        answer: It had only seen the inside of its egg
        why: Its whole world was the shell.
    - teach: 'After hatching, it lives in a warm straw nest with its mother and now thinks the world is made of straw. Then it flutters out, sees leaves and the wide world, and says, ''I have been very blind'': the world is far bigger than it knew.'
      picture:
        kind: flow
        steps:
        - 'Egg: world is pale blue shell'
        - 'Nest: world is straw'
        - 'Out: world is huge'
        alt: Inside the egg the bird thinks the world is shell, in the nest it thinks it is straw, outside it sees the world is huge.
      check:
        prompt: What does the bird think the world is made of while in the nest?
        options:
        - Straw
        - Pale blue shell
        - Leaves and sky
        answer: Straw
        why: The nest was all it knew then.
    - teach: 'The poem is about growing up: as we see more, our ideas of the world grow. The bird also notices that others still haven''t discovered how big the world is.'
      check:
        prompt: What is the poem's big idea?
        options:
        - The world is bigger than our small experience
        - Birds should never fly
        - Nests are better than trees
        answer: The world is bigger than our small experience
        why: Each new home showed the bird more.
  items:
  - prompt: Who is the speaker of the poem?
    options:
    - A young bird
    - A tree
    - A boy
    - The sky
    answer: A young bird
    difficulty: 1
    hints:
    - Title.
    - It hatches.
    solution: A young bird speaks.
    mistakes: {"A boy": "e6_bird_speaker"}
  - prompt: What colour was the bird's first home?
    options:
    - Pale blue
    - Bright red
    - Black
    - Green
    answer: Pale blue
    difficulty: 1
    hints:
    - The egg shell.
    - Light colour.
    solution: The shell was pale blue.
    mistakes: {"Bright red": "e6_blue_shell"}
  - prompt: 'When it lived in the nest, the bird thought the world was made of:'
    options:
    - straw
    - shell
    - water
    - stone
    answer: straw
    difficulty: 1
    hints:
    - Nest material.
    - Dry grass.
    solution: It thought the world was made of straw.
    mistakes: {"stone": "e6_straw"}
  - prompt: What did the bird realise when it left the nest?
    options:
    - The world was much bigger than it thought
    - The world was a shell
    - It could not fly
    - Leaves are blue
    answer: The world was much bigger than it thought
    difficulty: 2
    hints:
    - Leaves, sky.
    - Big.
    solution: It saw the world was far bigger.
    mistakes:
      The world was a shell: eng6_poem_meaning
  - prompt: What does 'I have been very blind' mean here?
    options:
    - I did not understand how big the world was
    - My eyes were hurt
    - It was dark outside
    - I was sleeping
    answer: I did not understand how big the world was
    difficulty: 2
    hints:
    - Not real blindness.
    - Ignorance.
    solution: It means it hadn't understood the world.
    mistakes: {"My eyes were hurt": "e6_blind"}
  - prompt: What is the poem mainly about?
    options:
    - Growing up and discovering the world
    - Building nests
    - Bird food
    - Winter weather
    answer: Growing up and discovering the world
    difficulty: 2
    hints:
    - Stages of life.
    - Learning.
    solution: It's about growing and discovering.
    mistakes: {"Building nests": "e6_growing_up"}
  - prompt: How many homes does the bird describe before it sees the wide world?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - First the egg.
    - Then the nest.
    solution: 'Step 1: home one is the egg, home two the nest. Step 2: that is 2 homes.'
    mistakes:
      '3': c6e3_poem
      '1': c6e3_poem
  - prompt: Which word describes the egg shell in the poem?
    options:
    - Pale blue
    - Bright red
    - Golden
    answer: Pale blue
    difficulty: 1
    hints:
    - Think of the colour the bird believed the whole world was.
    - A soft colour.
    solution: 'Step 1: the egg shell was small and round. Step 2: its colour was pale blue.'
    mistakes:
      Bright red: c6e3_poem
      Golden: c6e3_poem
  - prompt: How did the bird feel in the nest?
    options:
    - Warm and safe
    - Cold and scared
    - Angry
    answer: Warm and safe
    difficulty: 1
    hints:
    - Its mother was with it.
    - A cosy straw nest.
    solution: 'Step 1: the nest was cosy and mother was near. Step 2: the bird felt warm and safe.'
    mistakes:
      Cold and scared: c6e3_poem
      Angry: c6e3_poem
  - prompt: 'In the poem, ''fluttered'' means:'
    options:
    - Flapped its wings lightly
    - Swam
    - Slept deeply
    answer: Flapped its wings lightly
    difficulty: 2
    hints:
    - The young bird left the nest.
    - Its first try at flying.
    solution: 'Step 1: the bird left the nest by moving its wings. Step 2: fluttering is light, quick flapping.'
    mistakes:
      Swam: c6e3_word
      Slept deeply: c6e3_word
  - prompt: Who is like the bird in real life?
    options:
    - A child who learns more about the world as they grow
    - A rock that never changes
    - A clock
    answer: A child who learns more about the world as they grow
    difficulty: 2
    hints:
    - The bird's world grows bigger.
    - Who else discovers more as they grow?
    solution: 'Step 1: the bird learns step by step. Step 2: children too discover more as they grow.'
    mistakes:
      A rock that never changes: c6e3_theme
      A clock: c6e3_theme
  - prompt: 'When the bird says it ''has been very blind'', it really means:'
    options:
    - It knew very little about the world
    - It could not see at all
    - Its eyes were hurt
    answer: It knew very little about the world
    difficulty: 2
    hints:
    - The bird could see.
    - '''Blind'' is used in a different sense.'
    solution: 'Step 1: the bird''s eyes worked. Step 2: ''blind'' here means it didn''t understand how big the world was.'
    mistakes:
      It could not see at all: c6e3_word
      Its eyes were hurt: c6e3_word
  - prompt: Put the bird's discoveries in order.
    options:
    - Shell, straw, wide world
    - Straw, shell, wide world
    - Wide world, straw, shell
    answer: Shell, straw, wide world
    difficulty: 2
    hints:
    - Begin inside the egg.
    - End outside the nest.
    solution: 'Step 1: first the egg shell, then the nest. Step 2: finally the wide world outside.'
    mistakes:
      Straw, shell, wide world: c6e3_poem
      Wide world, straw, shell: c6e3_poem
  - prompt: Why does each new place change what the bird thinks?
    options:
    - It can only judge by what it has seen so far
    - It forgets everything
    - Someone tells it lies
    answer: It can only judge by what it has seen so far
    difficulty: 3
    hints:
    - Inside the egg, the shell is everything.
    - More experience means a bigger picture.
    solution: 'Step 1: the bird''s ideas come from what it has seen. Step 2: each new place shows it more, so its idea grows.'
    mistakes:
      It forgets everything: c6e3_theme
      Someone tells it lies: c6e3_theme
  - prompt: What kind of poem is this, judging by who speaks?
    options:
    - A poem in the bird's own voice
    - A news report
    - A recipe
    answer: A poem in the bird's own voice
    difficulty: 1
    hints:
    - Who says 'I'?
    - The bird tells us.
    solution: 'Step 1: the bird says ''I'' in the poem. Step 2: so it is told in the bird''s own voice.'
    mistakes:
      A news report: c6e3_poem
      A recipe: c6e3_poem
- code: cbse6e.u3.spices
  title: Spices that Heal Us
  notes: |
    An informative chapter on Indian spices that are also used as home remedies. Turmeric (haldi): antiseptic, helps heal
    wounds, haldi doodh for colds. Ginger (adrak): soothes cough and cold, aids digestion. Cumin (jeera): digestion.
    Asafoetida (hing): relieves gas and stomach-ache. Fenugreek (methi): seeds good for digestion. Clove (laung): eases
    toothache. Cardamom (elaichi): freshens breath. Cinnamon (dalchini) and fennel (saunf): digestion, flavour. India has
    traded spices for thousands of years (Kerala's Malabar coast: pepper, cardamom). Use in moderation; see a doctor for
    serious illness.
  explanations:
    text: Indian kitchens are full of spices that are also home remedies. Turmeric helps wounds heal, ginger soothes colds, clove eases toothache, and hing helps a stomach-ache. India, especially Kerala's Malabar coast, has traded spices with the world for thousands of years. Spices help, but serious illness needs a doctor.
    visual: 'Picture a steel masala box (masala dabba) with little bowls: yellow turmeric, brown cumin, green cardamom, black pepper and cloves, each labelled with what it helps.'
    step_by_step: 'Step 1: Name the spice. Step 2: Note its Hindi or local name. Step 3: Note how it helps health. Step 4: Remember: use small amounts and see a doctor when really ill.'
    real_world: Many families give children warm turmeric milk (haldi doodh) for a cold, and chew saunf after meals.
  picture:
    kind: compare
    columns:
    - title: Spice
      points:
      - Turmeric
      - Clove
      - Ginger
      - Asafoetida (hing)
    - title: Helps with
      points:
      - healing wounds
      - toothache
      - cough and cold
      - stomach-ache
    alt: Turmeric helps heal wounds, clove eases toothache, ginger soothes a cough and cold, and hing helps a stomach-ache.
  activity:
    type: sort
    prompt: 'Spices that Heal Us: which spice helps?'
    bins:
    - Turmeric
    - Clove
    - Asafoetida
    - Cardamom
    items:
    - label: Helps heal a wound
      bin: Turmeric
      clue: Haldi is an antiseptic.
      why: Haldi (turmeric) is used on wounds because it is antiseptic.
    - label: Eases a toothache
      bin: Clove
      clue: Laung.
      why: Clove (laung) is the toothache remedy.
    - label: Relieves gas and stomach-ache
      bin: Asafoetida
      clue: Hing.
      why: Hing (asafoetida) is used for gas.
    - label: Freshens breath
      bin: Cardamom
      clue: Elaichi.
      why: Elaichi (cardamom) freshens breath.
