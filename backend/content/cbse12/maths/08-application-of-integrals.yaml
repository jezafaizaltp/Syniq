# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse12-math
chapter: 8
title: Application of Integrals
tips:
  c12_area: 'Area between a curve and the x-axis is ∫|y| dx: split where the curve crosses the axis so parts below don''t cancel.'
  m12_area: "Area = ∫ y dx between the limits."
  m12_circle_area: "Area = πr². Here r² = 4."
  m12_ellipse_area: "Ellipse area = πab, with a and b the semi-axes (square roots of 9 and 4)."
  m12_horizontal_strip: "Pick the strip that makes the boundary easier to write."
  m12_integral_sign: "Leibniz drew the sign as a stretched letter: an integral is a sum of tiny strips."
  m12_quadrant: "x² + y² = 16 is a circle of radius 4; its area is πr². A quadrant is a quarter of the circle."
  m12_rectangle_area: "y = 3 is a horizontal line, so the region is a rectangle: width × height."
  m12_sqrt_area: "∫√x dx = (2/3)x^(3/2). Evaluate at 4."
  m12_strip: "A vertical strip has width dx and height y."
  c12m8_set: Sketch the region first, decide the limits from where it starts and stops, then integrate y dx (or x dy).
  c12m8_known: 'Use the known formula: circle πa², ellipse πab, quadrant πa²/4.'
  c12m8_below: Parts below the x-axis give a negative integral; take the absolute value of each part separately.
  pq12m8_mirror: Is the region the same on both sides of the y-axis? If so, how does one half compare with the whole?
concepts:
- code: cbse12m.area.curve
  title: Area under simple curves
  notes: |
    Area bounded by y = f(x), the x-axis and x = a, x = b: ∫ₐᵇ y dx (take absolute values for parts below the axis). Area
    with the y-axis: ∫ x dy. Areas of circles (x² + y² = a²: πa²), parabolas (y² = 4ax), ellipses (πab). (Area between two
    curves is removed in some rationalised years; kept simple.)
  explanations:
    text: To find the area under a curve, integrate the curve between the two x-values. If part of the curve dips below the x-axis, treat that part separately so it doesn't cancel out the area above.
    visual: Shade the region under y = x² from x = 0 to 3. Its area is ∫₀³ x² dx = 9 square units.
    step_by_step: 'Step 1: Sketch the curve and region. Step 2: Find the limits. Step 3: Integrate y with respect to x. Step 4: Use absolute values for parts below the axis.'
    real_world: Architects calculate the area of curved windows and arches using integration.
  picture:
    kind: flow
    steps:
    - Sketch the region
    - Find the limits
    - Integrate y dx
    - Add parts, taking absolute values
    alt: Steps to find the area under a curve.
  activity:
    type: formula
    prompt: The area under y = x² from x = a to x = b is (b³ − a³)/3.
    inputs:
    - name: a
      label: From a
      min: 0
      max: 5
      step: 1
      start: 0
    - name: b
      label: To b
      min: 0
      max: 6
      step: 1
      start: 1
    outputs:
    - name: area
      label: Area under y = x²
      expr: (b^3-a^3)/3
      places: 3
    - name: line
      label: Area under y = x, same limits
      expr: (b^2-a^2)/2
      places: 2
    goals:
    - prompt: Keep a = 0. Make the area 9.
      want:
        a: 0
        area: 9
      mistakes:
      - when:
          a: 0
          b:
          - 4
          - 6
        say: 'Too big: area = b³/3, so b³ = 27.'
      - when:
          a: 0
          b:
          - 1
          - 2
        say: 'Too small: area = b³/3, so b³ = 27.'
    - prompt: Keep a = 1. Make the area 7/3 ≈ 2.333.
      want:
        a: 1
        area:
        - 2.33
        - 2.34
      mistakes:
      - when:
          a: 1
          b: 3
        say: 'That''s (27 − 1)/3 ≈ 8.67. Start counting at 1: (b³ − 1)/3 = 7/3.'
    - prompt: From 0 to 3, which is bigger, the area under y = x² or under y = x? Set the limits and compare.
      want:
        a: 0
        b: 3
      mistakes:
      - when:
          a: 0
          b: 1
        say: From 0 to 1, x² is below x. Go on to 3 and compare again.
  lesson:
    - teach: The area between the curve y = f(x) (with f ≥ 0), the x-axis, and the lines x = a and x = b is ∫ₐᵇ y dx. Think of it as adding up many thin vertical strips, each of area y × dx.
      picture:
        kind: bars
        bars:
        - label: x=0.5
          value: 0.25
        - label: x=1
          value: 1
        - label: x=1.5
          value: 2.25
        - label: x=2
          value: 4
        alt: Thin strips under y = x² whose heights grow with x; adding them gives the area.
      check:
        prompt: Area under y = x from x = 0 to x = 2?
        options:
        - '2'
        - '4'
        - '1'
        answer: '2'
        why: ∫₀² x dx = 4/2 = 2.
      ways:
      - style: step_by_step
        teach: 'Area under y = x² + 1 from x = 0 to x = 2. Step 1: The curve stays above the x-axis, so area = ∫₀² (x² + 1)dx. Step 2: Antiderivative x³/3 + x. Step 3: At 2: 8/3 + 2 = 14/3; at 0: 0. Step 4: Area = 14/3 square units.'
      - style: real_world
        teach: To find how much paint a curved arch needs, a painter could cut it into many thin vertical strips, each almost a rectangle, and add their areas. The integral ∫ y dx does exactly that with strips so thin the error vanishes.
    - teach: If part of the curve is below the x-axis, the integral there is negative. For total area, split at the crossing points and add the absolute values. Area against the y-axis uses ∫ x dy between y = c and y = d.
      check:
        prompt: ∫₋₁⁰ x dx = −1/2. What is the area of that region?
        options:
        - 1/2
        - -1/2
        - '0'
        answer: 1/2
        why: 'Area is always positive: take the absolute value.'
      ways:
      - style: visual
        teach: Signed integral versus total area for y = x − 1 from x = 0 to x = 3.
        picture:
          kind: compare
          columns:
          - title: Signed integral
            points:
            - ∫₀¹ (x − 1)dx = −½
            - ∫₁³ (x − 1)dx = 2
            - 'Sum: 1.5'
          - title: Total area
            points:
            - '|−½| = ½'
            - '2'
            - 'Sum: 2.5'
          alt: 'For y equals x minus 1 from 0 to 3: the part from 0 to 1 integrates to minus one half and the part from 1 to 3 to 2. The signed integral is 1.5, but the total area adds one half and 2 to get 2.5.'
      - style: step_by_step
        teach: 'Area between x = 3y² and the y-axis from y = 0 to y = 2. Step 1: Use horizontal strips of length x and height dy. Step 2: Area = ∫₀² 3y² dy. Step 3: Antiderivative y³. Step 4: Area = 8 − 0 = 8 square units.'
    - teach: 'Known areas help you check: circle x² + y² = a² has area πa²; ellipse x²/a² + y²/b² = 1 has area πab. These come from integrating the upper half and using symmetry.'
      check:
        prompt: Area of the ellipse x²/25 + y²/16 = 1, as a multiple of π?
        options:
        - '20'
        - '41'
        - '9'
        answer: '20'
        why: πab = π × 5 × 4 = 20π.
      ways:
      - style: visual
        teach: The two known areas side by side, with an example of each.
        picture:
          kind: compare
          columns:
          - title: Circle x² + y² = a²
            points:
            - Area πa²
            - 'x² + y² = 25: area 25π'
          - title: Ellipse x²/a² + y²/b² = 1
            points:
            - Area πab
            - 'x²/16 + y²/9 = 1: area 12π'
          alt: A circle x squared plus y squared equals a squared has area pi a squared, so radius 5 gives 25 pi. An ellipse with semi-axes a and b has area pi a b, so semi-axes 4 and 3 give 12 pi.
      - style: step_by_step
        teach: 'Where πa² comes from. Step 1: The upper half of x² + y² = a² is y = √(a² − x²). Step 2: The first-quadrant area is ∫₀ᵃ √(a² − x²)dx. Step 3: With the standard formula this gives πa²/4. Step 4: Four equal quadrants make πa².'
  items:
  - prompt: Find the area under y = x² from x = 0 to x = 3.
    answer: '9'
    check: Rational(27,3)
    difficulty: 1
    hints:
    - x³/3.
    - 27/3.
    solution: "∫₀³ x² dx = [x³/3]₀³ = 27/3 = 9 square units."
    mistakes: {"27": "m12_area", "3": "m12_area", "6": "m12_area"}
  - prompt: Find the area under y = 2x from x = 0 to x = 4.
    answer: '16'
    check: 4**2
    difficulty: 1
    hints:
    - x².
    - '16.'
    solution: "∫₀⁴ 2x dx = [x²]₀⁴ = 16 square units (a triangle of base 4, height 8)."
    mistakes: {"8": "m12_area", "32": "m12_area"}
  - prompt: Find the area under y = 3 from x = 1 to x = 5.
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - Rectangle.
    - 3 × 4.
    solution: "∫₁⁵ 3 dx = 3 × (5 − 1) = 12 square units (a rectangle)."
    mistakes: {"15": "m12_rectangle_area", "4": "m12_rectangle_area", "3": "m12_rectangle_area"}
  - prompt: Find the area between y = x and the x-axis from x = −2 to x = 2.
    answer: '4'
    check: 2+2
    difficulty: 2
    hints:
    - Two triangles of area 2.
    - Don't let them cancel.
    solution: "Area counts both parts as positive: ∫₀² x dx + |∫₋₂⁰ x dx| = 2 + 2 = 4 square units."
    mistakes:
      '0': c12_area
  - prompt: 'The area enclosed by the circle x² + y² = 4 is:'
    options:
    - 4π
    - 2π
    - 16π
    - π
    answer: 4π
    difficulty: 1
    hints:
    - πr².
    - r = 2.
    solution: "Area = πr² with r² = 4, so 4π square units. (By integration: 4∫₀² √(4 − x²) dx = 4π.)"
    mistakes: {"2π": "m12_circle_area", "16π": "m12_circle_area", "π": "m12_circle_area"}
  - prompt: 'The area enclosed by the ellipse x²/9 + y²/4 = 1 is:'
    options:
    - 6π
    - 13π
    - 36π
    - 5π
    answer: 6π
    difficulty: 2
    hints:
    - πab.
    - a = 3, b = 2.
    solution: "Area of an ellipse = πab with a = 3 and b = 2: 6π square units."
    mistakes: {"13π": "m12_ellipse_area", "36π": "m12_ellipse_area", "5π": "m12_ellipse_area"}
  - prompt: Find the area under y = x² from x = 0 to x = 1, as a fraction.
    answer: 1/3
    check: Rational(1,3)
    difficulty: 1
    hints:
    - Integrate x².
    - x³/3 from 0 to 1.
    solution: 'Step 1: 1/3 − 0. Step 2: 1/3.'
    mistakes:
      '1': c12m8_set
      1/2: c12m8_set
  - prompt: Find the area under y = 4 from x = 0 to x = 3.
    answer: '12'
    check: 4*3
    difficulty: 1
    hints:
    - The region is a rectangle.
    - Height times width.
    solution: 'Step 1: 4 × 3. Step 2: 12.'
    mistakes:
      '7': c12m8_set
      '4': c12m8_set
  - prompt: Area enclosed by x² + y² = 9, as a multiple of π.
    answer: '9'
    check: 3**2
    difficulty: 1
    hints:
    - The radius is √9.
    - Use πa².
    solution: 'Step 1: a = 3. Step 2: 9π.'
    mistakes:
      '3': c12m8_known
      '6': c12m8_known
  - prompt: Find the area under y = x + 1 from x = 0 to x = 2.
    answer: '4'
    check: 2**2/2 + 2
    difficulty: 2
    hints:
    - Antiderivative x²/2 + x.
    - Evaluate from 0 to 2.
    solution: 'Step 1: 2 + 2. Step 2: 4.'
    mistakes:
      '3': c12m8_set
      '6': c12m8_set
  - prompt: Find the total area between y = x³ and the x-axis from x = −1 to x = 1, as a fraction.
    answer: 1/2
    check: 2*Rational(1,4)
    difficulty: 2
    hints:
    - The integral over [−1, 1] is 0, but area is not.
    - Find the area on [0, 1] and double it.
    solution: 'Step 1: ∫₀¹ x³ = 1/4. Step 2: 2 × 1/4 = 1/2.'
    mistakes:
      '0': c12m8_below
      1/4: c12m8_below
  - prompt: Area of the ellipse x²/4 + y² = 1, as a multiple of π.
    answer: '2'
    check: 2*1
    difficulty: 2
    hints:
    - a² = 4 and b² = 1.
    - Use πab.
    solution: 'Step 1: a = 2, b = 1. Step 2: 2π.'
    mistakes:
      '4': c12m8_known
      '5': c12m8_known
  - prompt: Find the area between the y-axis and x = y² from y = 0 to y = 3.
    answer: '9'
    check: 3**3/3
    difficulty: 2
    hints:
    - 'Use horizontal strips: ∫ x dy.'
    - ∫₀³ y² dy.
    solution: 'Step 1: y³/3 from 0 to 3. Step 2: 9.'
    mistakes:
      '27': c12m8_set
      '3': c12m8_set
  - prompt: Find the total area between y = sin x and the x-axis from x = 0 to x = 2π.
    answer: '4'
    check: 2 + 2
    difficulty: 3
    hints:
    - The integral over 0 to 2π is 0; split at π.
    - Each hump has area 2.
    solution: 'Step 1: ∫₀^π sin x = 2, ∫_π^(2π) sin x = −2. Step 2: 2 + 2 = 4.'
    mistakes:
      '0': c12m8_below
      '2': c12m8_below
  - prompt: Find the area under y = 1/x from x = 1 to x = e.
    answer: '1'
    check: log(E)
    difficulty: 3
    hints:
    - ∫1/x dx = ln x.
    - ln e − ln 1.
    solution: 'Step 1: 1 − 0. Step 2: 1.'
    mistakes:
      '0': c12m8_set
      '2': c12m8_set
  - prompt: 'Assertion (A): The area enclosed by the ellipse x²/25 + y²/16 = 1 is 20π.

      Reason (R): The area of an ellipse with semi-axes a and b is πab.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Here a = 5 and b = 4, so by R the area is π × 5 × 4 = 20π. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A lawn is bounded by the curve y = 6x − x² and the x-axis, with lengths in metres. What is the lawn''s area in m²?'
    options:
    - '36'
    - '72'
    - '18'
    answer: '36'
    hints:
    - The curve meets the x-axis where 6x − x² = 0.
    - Area = ∫₀⁶ (6x − x²)dx.
    solution: The curve cuts the axis at 0 and 6. Area = [3x² − x³/3]₀⁶ = 108 − 72 = 36 m².
    mistakes:
      '72': c12m8_set
      '18': c12m8_set
    exam: case
    difficulty: 2
  - prompt: A student finds the area between y = x and the x-axis from x = −1 to x = 2 by computing ∫₋₁² x dx = 1.5. What is the actual area?
    options:
    - '2.5'
    - '1.5'
    - '2'
    answer: '2.5'
    hints:
    - Where is y = x below the x-axis in this interval?
    - Find each part separately and take its size.
    solution: From −1 to 0 the integral is −0.5, area 0.5; from 0 to 2 it is 2. Area = 0.5 + 2 = 2.5. The student's 1.5 let the negative part cancel.
    mistakes:
      '1.5': c12m8_below
      '2': c12m8_below
    exam: competency
    difficulty: 2
- code: cbse12m.area.region
  title: Setting up area integrals
  after:
  - cbse12m.area.curve
  notes: |
    Choosing horizontal or vertical strips; area of a strip y·dx; summing strips gives the integral. Regions bounded by a
    line and a parabola, quadrant of a circle (πa²/4). Symmetry halves the work. Interpreting the integral sign as a sum.
  explanations:
    text: Think of the area as made of very thin vertical strips. Each strip's area is height y times width dx, and the integral adds them all. Sometimes horizontal strips are easier.
    visual: Draw thin rectangles under a curve, each of width dx and height y. As they get thinner, their total becomes the exact area.
    step_by_step: 'Step 1: Pick strips (vertical: dx; horizontal: dy). Step 2: Write the strip''s area. Step 3: Find the limits. Step 4: Integrate.'
    real_world: Map-makers estimate the areas of lakes by adding thin strips across them.
  picture:
    kind: bars
    bars:
    - label: strip 1
      value: 1
    - label: strip 2
      value: 4
    - label: strip 3
      value: 9
    - label: strip 4
      value: 16
    alt: 'Thin strips under y = x² at x = 1, 2, 3, 4: their heights 1, 4, 9 and 16 add up to approximate the area.'
    unit: height
  activity:
    type: sort
    prompt: 'To find each area, which strips are simpler: vertical (∫ y dx) or horizontal (∫ x dy)?'
    bins:
    - Vertical strips, ∫ y dx
    - Horizontal strips, ∫ x dy
    items:
    - label: Under y = x² from x = 0 to 2, above the x-axis
      bin: Vertical strips, ∫ y dx
      clue: Is the curve given as y in terms of x? Are the limits in x?
      why: 'y = x² and x-limits: stand each strip up from the x-axis.'
    - label: Between x = y² and the y-axis, from y = 0 to 2
      bin: Horizontal strips, ∫ x dy
      clue: Is the curve given as x in terms of y? Which axis bounds it?
      why: 'x = y² with y-limits: lay strips across from the y-axis.'
    - label: Under y = sin x from 0 to π
      bin: Vertical strips, ∫ y dx
      clue: Which axis is the region sitting on?
      why: The region sits on the x-axis, with x-limits.
    - label: Bounded by y = 3x, the x-axis and x = 2
      bin: Vertical strips, ∫ y dx
      clue: 'Which line closes the region: x = 2 or y = something?'
      why: x-limits 0 to 2 and the x-axis below.
    - label: Bounded by x = 2y, the y-axis and y = 3
      bin: Horizontal strips, ∫ x dy
      clue: Which axis and which line close the region?
      why: y-limits 0 to 3 against the y-axis.
    - label: Between the y-axis, y = 1, y = 4 and x = √y
      bin: Horizontal strips, ∫ x dy
      clue: The limits are y = 1 and y = 4. Which variable do you integrate in?
      why: Integrate √y dy from 1 to 4.
    - label: Right of the y-axis, inside x = 4 − y²
      bin: Horizontal strips, ∫ x dy
      clue: Solve for the variable that's alone. Which is it?
      why: x = 4 − y², with y from −2 to 2.
    - label: Under y = eˣ from x = 0 to 1
      bin: Vertical strips, ∫ y dx
      clue: Is it y in terms of x?
      why: ∫₀¹ eˣ dx = e − 1.
  lesson:
    - teach: 'To set up an area, sketch the region and choose strips. Vertical strips: width dx, height = top curve − bottom curve. Horizontal strips: height dy, width = right curve − left curve. Pick whichever needs one integral, not two.'
      check:
        prompt: 'For a vertical strip, the strip''s height is:'
        options:
        - top y minus bottom y
        - right x minus left x
        - always 1
        answer: top y minus bottom y
        why: A vertical strip stretches from the lower boundary to the upper one.
      ways:
      - style: visual
        teach: 'Vertical strips or horizontal strips: what each one needs.'
        picture:
          kind: compare
          columns:
          - title: Vertical strips
            points:
            - Width dx
            - Height = top curve − bottom curve
            - Integrate over x
          - title: Horizontal strips
            points:
            - Height dy
            - Width = right curve − left curve
            - Integrate over y
          alt: Vertical strips have width dx and height top curve minus bottom curve, integrated over x. Horizontal strips have height dy and width right curve minus left curve, integrated over y.
      - style: step_by_step
        teach: 'Area between y = 3x and y = x². Step 1: They meet where 3x = x², at x = 0 and x = 3. Step 2: Between them 3x is on top. Step 3: Area = ∫₀³ (3x − x²)dx = [3x²/2 − x³/3]₀³. Step 4: = 13.5 − 9 = 4.5 square units.'
    - teach: 'Example: the region between y = x and y = x² from 0 to 1. Top is y = x, bottom is y = x². Area = ∫₀¹ (x − x²)dx = 1/2 − 1/3 = 1/6.'
      picture:
        kind: flow
        steps:
        - Sketch both curves
        - Find where they meet
        - Top − bottom
        - Integrate between meeting points
        alt: Steps for setting up the area between two curves.
      check:
        prompt: Where do y = x and y = x² meet?
        options:
        - x = 0 and x = 1
        - x = 1 only
        - x = 0 and x = 2
        answer: x = 0 and x = 1
        why: x = x² gives x(x − 1) = 0.
      ways:
      - style: real_world
        teach: A crescent-shaped flower bed lies between two curved paths. Its area is the area under the outer path minus the area under the inner path, the same top-minus-bottom rule used for the region between two curves.
      - style: step_by_step
        teach: 'Setting up, not yet solving. Step 1: Sketch both curves. Step 2: Find where they meet: these are the limits. Step 3: Pick one x between the limits and check which curve is higher. Step 4: Integrate (higher − lower) between the limits.'
    - teach: 'Use symmetry to halve work: the region under y² = 4x from x = 0 to x = a is symmetric about the x-axis, so find the upper half and double it. A quadrant of x² + y² = a² has area πa²/4.'
      check:
        prompt: 'Quadrant of x² + y² = 36: area as a multiple of π?'
        options:
        - '9'
        - '36'
        - '6'
        answer: '9'
        why: π × 36/4 = 9π.
      ways:
      - style: visual
        teach: Using symmetry for the region inside y² = 9x up to x = 1.
        picture:
          kind: flow
          steps:
          - 'Upper half: y = 3√x'
          - Upper area = ∫₀¹ 3√x dx = 2
          - Region is symmetric about the x-axis
          - Total area = 2 × 2 = 4
          alt: The upper half of y squared equals 9x is y equals 3 root x; its area from 0 to 1 is 2. The region is symmetric about the x-axis, so the total area is 4.
      - style: step_by_step
        teach: 'Quadrant of x² + y² = 36. Step 1: The radius is √36 = 6. Step 2: The whole circle has area π × 6² = 36π. Step 3: A quadrant is one quarter. Step 4: Area = 9π square units.'
  items:
  - prompt: Find the area of a quadrant of the circle x² + y² = 16, as a multiple of π.
    answer: '4'
    check: 16/4
    difficulty: 1
    hints:
    - πa²/4.
    - 16π/4.
    solution: "Whole circle πr² = 16π; a quadrant is a quarter: 16π/4 = 4π."
    mistakes: {"16": "m12_quadrant", "8": "m12_quadrant", "2": "m12_quadrant"}
  - prompt: Find the area under y = √x from 0 to 4, as a fraction.
    answer: 16/3
    check: Rational(2,3)*8
    difficulty: 2
    hints:
    - (2/3)x^(3/2).
    - (2/3) × 8.
    solution: "∫₀⁴ x^(1/2) dx = [(2/3)x^(3/2)]₀⁴ = (2/3) × 8 = 16/3."
    mistakes: {"8/3": "m12_sqrt_area", "2": "m12_sqrt_area", "8": "m12_sqrt_area"}
  - prompt: Find the area under y = x³ from 0 to 2.
    answer: '4'
    check: Rational(16,4)
    difficulty: 2
    hints:
