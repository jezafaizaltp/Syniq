# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse12-math
chapter: 8
title: Application of Integrals
tips:
  c12_area: 'Area between a curve and the x-axis is ∫|y| dx: split where the curve crosses the axis so parts below don''t cancel.'
  m12_area: "Area = ∫ y dx between the limits."
  m12_circle_area: "Area = πr². Here r² = 4."
  m12_ellipse_area: "Ellipse area = πab, with a and b the semi-axes (square roots of 9 and 4)."
  m12_horizontal_strip: "Pick the strip that makes the boundary easier to write."
  m12_integral_sign: "Leibniz drew the sign as a stretched letter: an integral is a sum of tiny strips."
  m12_quadrant: "A quadrant is a quarter of the circle, radius 4."
  m12_rectangle_area: "y = 3 is a horizontal line, so the region is a rectangle: width × height."
  m12_sqrt_area: "∫√x dx = (2/3)x^(3/2). Evaluate at 4."
  m12_strip: "A vertical strip has width dx and height y."
concepts:
- code: cbse12m.area.curve
  title: Area under simple curves
  notes: |
    Area bounded by y = f(x), the x-axis and x = a, x = b: ∫ₐᵇ y dx (take absolute values for parts below the axis). Area
    with the y-axis: ∫ x dy. Areas of circles (x² + y² = a²: πa²), parabolas (y² = 4ax), ellipses (πab). (Area between two
    curves is removed in some rationalised years; kept simple.)
  explanations:
    text: To find the area under a curve, integrate the curve between the two x-values. If part of the curve dips below the x-axis, treat that part separately so it doesn't cancel out the area above.
    visual: Shade the region under y = x² from x = 0 to 3. Its area is ∫₀³ x² dx = 9 square units.
    step_by_step: 'Step 1: Sketch the curve and region. Step 2: Find the limits. Step 3: Integrate y with respect to x. Step 4: Use absolute values for parts below the axis.'
    real_world: Architects calculate the area of curved windows and arches using integration.
  picture:
    kind: flow
    steps:
    - Sketch the region
    - Find the limits
    - Integrate y dx
    - Add parts, taking absolute values
    alt: Steps to find the area under a curve.
  activity:
    type: formula
    prompt: The area under y = x² from x = a to x = b is (b³ − a³)/3.
    inputs:
    - name: a
      label: From a
      min: 0
      max: 5
      step: 1
      start: 0
    - name: b
      label: To b
      min: 0
      max: 6
      step: 1
      start: 1
    outputs:
    - name: area
      label: Area under y = x²
      expr: (b^3-a^3)/3
      places: 3
    - name: line
      label: Area under y = x, same limits
      expr: (b^2-a^2)/2
      places: 2
    goals:
    - prompt: Keep a = 0. Make the area 9.
      want:
        a: 0
        area: 9
      mistakes:
      - when:
          a: 0
          b:
          - 4
          - 6
        say: 'Too big: area = b³/3, so b³ = 27.'
      - when:
          a: 0
          b:
          - 1
          - 2
        say: 'Too small: area = b³/3, so b³ = 27.'
    - prompt: Keep a = 1. Make the area 7/3 ≈ 2.333.
      want:
        a: 1
        area:
        - 2.33
        - 2.34
      mistakes:
      - when:
          a: 1
          b: 3
        say: 'That''s (27 − 1)/3 ≈ 8.67. Start counting at 1: (b³ − 1)/3 = 7/3.'
    - prompt: From 0 to 3, which is bigger, the area under y = x² or under y = x? Set the limits and compare.
      want:
        a: 0
        b: 3
      mistakes:
      - when:
          a: 0
          b: 1
        say: From 0 to 1, x² is below x. Go on to 3 and compare again.
  items:
  - prompt: Find the area under y = x² from x = 0 to x = 3.
    answer: '9'
    check: Rational(27,3)
    difficulty: 1
    hints:
    - x³/3.
    - 27/3.
    solution: 9 square units.
    mistakes: {"27": "m12_area", "3": "m12_area", "6": "m12_area"}
  - prompt: Find the area under y = 2x from x = 0 to x = 4.
    answer: '16'
    check: 4**2
    difficulty: 1
    hints:
    - x².
    - '16.'
    solution: 16 square units.
    mistakes: {"8": "m12_area", "32": "m12_area"}
  - prompt: Find the area under y = 3 from x = 1 to x = 5.
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - Rectangle.
    - 3 × 4.
    solution: 12 square units.
    mistakes: {"15": "m12_rectangle_area", "4": "m12_rectangle_area", "3": "m12_rectangle_area"}
  - prompt: Find the area between y = x and the x-axis from x = −2 to x = 2.
    answer: '4'
    check: 2+2
    difficulty: 2
    hints:
    - Two triangles of area 2.
    - Don't let them cancel.
    solution: 4 square units.
    mistakes:
      '0': c12_area
  - prompt: 'The area enclosed by the circle x² + y² = 4 is:'
    options:
    - 4π
    - 2π
    - 16π
    - π
    answer: 4π
    difficulty: 1
    hints:
    - πr².
    - r = 2.
    solution: 4π square units.
    mistakes: {"2π": "m12_circle_area", "16π": "m12_circle_area", "π": "m12_circle_area"}
  - prompt: 'The area enclosed by the ellipse x²/9 + y²/4 = 1 is:'
    options:
    - 6π
    - 13π
    - 36π
    - 5π
    answer: 6π
    difficulty: 2
    hints:
    - πab.
    - a = 3, b = 2.
    solution: 6π square units.
    mistakes: {"13π": "m12_ellipse_area", "36π": "m12_ellipse_area", "5π": "m12_ellipse_area"}
- code: cbse12m.area.region
  title: Setting up area integrals
  after:
  - cbse12m.area.curve
  notes: |
    Choosing horizontal or vertical strips; area of a strip y·dx; summing strips gives the integral. Regions bounded by a
    line and a parabola, quadrant of a circle (πa²/4). Symmetry halves the work. Interpreting the integral sign as a sum.
  explanations:
    text: Think of the area as made of very thin vertical strips. Each strip's area is height y times width dx, and the integral adds them all. Sometimes horizontal strips are easier.
    visual: Draw thin rectangles under a curve, each of width dx and height y. As they get thinner, their total becomes the exact area.
    step_by_step: 'Step 1: Pick strips (vertical: dx; horizontal: dy). Step 2: Write the strip''s area. Step 3: Find the limits. Step 4: Integrate.'
    real_world: Map-makers estimate the areas of lakes by adding thin strips across them.
  picture:
    kind: bars
    bars:
    - label: strip 1
      value: 1
    - label: strip 2
      value: 4
    - label: strip 3
      value: 9
    - label: strip 4
      value: 16
    alt: 'Thin strips under y = x² at x = 1, 2, 3, 4: their heights 1, 4, 9 and 16 add up to approximate the area.'
    unit: height
  activity:
    type: sort
    prompt: 'To find each area, which strips are simpler: vertical (∫ y dx) or horizontal (∫ x dy)?'
    bins:
    - Vertical strips, ∫ y dx
    - Horizontal strips, ∫ x dy
    items:
    - label: Under y = x² from x = 0 to 2, above the x-axis
      bin: Vertical strips, ∫ y dx
      clue: Is the curve given as y in terms of x? Are the limits in x?
      why: 'y = x² and x-limits: stand each strip up from the x-axis.'
    - label: Between x = y² and the y-axis, from y = 0 to 2
      bin: Horizontal strips, ∫ x dy
      clue: Is the curve given as x in terms of y? Which axis bounds it?
      why: 'x = y² with y-limits: lay strips across from the y-axis.'
    - label: Under y = sin x from 0 to π
      bin: Vertical strips, ∫ y dx
      clue: Which axis is the region sitting on?
      why: The region sits on the x-axis, with x-limits.
    - label: Bounded by y = 3x, the x-axis and x = 2
      bin: Vertical strips, ∫ y dx
      clue: 'Which line closes the region: x = 2 or y = something?'
      why: x-limits 0 to 2 and the x-axis below.
    - label: Bounded by x = 2y, the y-axis and y = 3
      bin: Horizontal strips, ∫ x dy
      clue: Which axis and which line close the region?
      why: y-limits 0 to 3 against the y-axis.
    - label: Between the y-axis, y = 1, y = 4 and x = √y
      bin: Horizontal strips, ∫ x dy
      clue: The limits are y = 1 and y = 4. Which variable do you integrate in?
      why: Integrate √y dy from 1 to 4.
    - label: Right of the y-axis, inside x = 4 − y²
      bin: Horizontal strips, ∫ x dy
      clue: Solve for the variable that's alone. Which is it?
      why: x = 4 − y², with y from −2 to 2.
    - label: Under y = eˣ from x = 0 to 1
      bin: Vertical strips, ∫ y dx
      clue: Is it y in terms of x?
      why: ∫₀¹ eˣ dx = e − 1.
  items:
  - prompt: Find the area of a quadrant of the circle x² + y² = 16, as a multiple of π.
    answer: '4'
    check: 16/4
    difficulty: 1
    hints:
    - πa²/4.
    - 16π/4.
    solution: 4π.
    mistakes: {"16": "m12_quadrant", "8": "m12_quadrant", "2": "m12_quadrant"}
  - prompt: Find the area under y = √x from 0 to 4, as a fraction.
    answer: 16/3
    check: Rational(2,3)*8
    difficulty: 2
    hints:
    - (2/3)x^(3/2).
    - (2/3) × 8.
    solution: 16/3.
    mistakes: {"8/3": "m12_sqrt_area", "2": "m12_sqrt_area", "8": "m12_sqrt_area"}
  - prompt: Find the area under y = x³ from 0 to 2.
    answer: '4'
    check: Rational(16,4)
    difficulty: 2
    hints:
    - x⁴/4.
    - 16/4.
    solution: '4.'
    mistakes: {"8": "m12_area", "2": "m12_area", "16": "m12_area"}
  - prompt: 'For area with vertical strips, each strip has area:'
    options:
    - y dx
    - x dy
    - dx dy
    - y²dx
    answer: y dx
    difficulty: 1
    hints:
    - Height × width.
    - Vertical.
    solution: y dx.
    mistakes: {"x dy": "m12_strip", "dx dy": "m12_strip", "y²dx": "m12_strip"}
  - prompt: When is it easier to use horizontal strips?
    options:
    - When the region is easier to describe as x in terms of y
    - Always
    - Never
    - Only for circles
    answer: When the region is easier to describe as x in terms of y
    difficulty: 2
    hints:
    - e.g. y² = 4x.
    - Choose the simpler integral.
    solution: When x as a function of y is simpler.
    mistakes: {"Always": "m12_horizontal_strip", "Never": "m12_horizontal_strip", "Only for circles": "m12_horizontal_strip"}
  - prompt: 'The integral sign ∫ originally stood for:'
    options:
    - a long S, for sum
    - integer
    - infinity
    - slope
    answer: a long S, for sum
    difficulty: 2
    hints:
    - Leibniz.
    - Adding strips.
    solution: A long S, meaning sum.
    mistakes: {"integer": "m12_integral_sign", "infinity": "m12_integral_sign", "slope": "m12_integral_sign"}
