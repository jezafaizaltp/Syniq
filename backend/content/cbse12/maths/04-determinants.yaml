# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse12-math
chapter: 4
title: Determinants
tips:
  c12_det: For [[a, b], [c, d]] the determinant is ad − bc. Expand a 3 × 3 along a row using signs + − +.
  c12_singular: "A matrix with determinant 0 has no inverse. The word for such a matrix means 'odd' or 'unusual'; invertible ones are 'non-' that word."
  m12_area_det: "Area = ½|x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|. Or: it is a right triangle."
  m12_cofactor: "A₁₁ = (−1)¹⁺¹ × minor; delete row 1 and column 1."
  m12_collinear: "A triangle of zero area is squashed flat. What does that say about the points?"
  m12_diag_det: "For a diagonal matrix, the determinant is the product of the diagonal."
  m12_solve_system: "Subtract the second equation from the first to remove y."
  m12_unique: "A non-zero determinant means A⁻¹ exists, so X = A⁻¹B has one answer."
  c12m4_exp: Expand along a row with the sign pattern + − +; each entry multiplies the 2 × 2 determinant left after crossing out its row and column.
  c12m4_prop: 'Use the property: |kA| = kⁿ|A| for an n × n matrix, |AB| = |A||B|, |Aᵀ| = |A|.'
  c12m4_cof: Cofactor Aᵢⱼ = (−1)^(i+j) × minor. Check the sign from the position before you finish.
  c12m4_solve: Write the system as AX = B, find |A|, then use X = A⁻¹B (or elimination to check).
  pq12m4_which_unknown: 'Check which letter stands for which item before you choose: the two unknowns give two different prices.'
  pq12m4_check_det: Before using the inverse recipe, work out ad − bc. What happens if you have to divide by that number?
concepts:
- code: cbse12m.det.value
  title: Determinant values and area
  notes: |
    Determinant of a square matrix: |A|. 2 × 2: ad − bc. 3 × 3: expansion along any row or column with cofactors (signs
    + − + / − + − / + − +). Properties (some deleted in rationalised syllabus but useful): |Aᵀ| = |A|; swapping rows changes
    sign; equal rows give 0; |kA| = kⁿ|A| for n × n; |AB| = |A||B|. Area of a triangle with vertices (x₁, y₁), (x₂, y₂),
    (x₃, y₃) = ½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|; zero area means collinear points.
  explanations:
    text: A determinant is a single number worked out from a square matrix. For a 2 × 2 matrix it's ad − bc. Determinants tell whether a matrix can be inverted, and they give the area of a triangle from its corners.
    visual: Draw a triangle on grid paper with corners (0, 0), (4, 0) and (0, 3). The formula gives ½ × 12 = 6, the same as ½ × base × height.
    step_by_step: 'Step 1: For 2 × 2, compute ad − bc. Step 2: For 3 × 3, expand along a row with + − + signs. Step 3: For area, use the formula and take the absolute value.'
    real_world: Surveyors find land areas from corner coordinates using the same determinant formula.
  picture:
    kind: flow
    steps:
    - Write the matrix
    - Choose a row
    - Multiply each entry by its cofactor (+ − +)
    - Add the results
    alt: Expanding a 3 × 3 determinant along a row.
  activity:
    type: formula
    prompt: A(1, 2) and B(4, 6) are fixed. Move C(x, y). Area of ABC = ½ |determinant|, where the determinant here is 3y − 4x − 2.
    inputs:
    - name: x
      label: C's x
      min: -6
      max: 10
      step: 1
      start: 0
    - name: y
      label: C's y
      min: -6
      max: 12
      step: 1
      start: 0
    outputs:
    - name: dv
      label: Determinant
      expr: 3*y-4*x-2
    - name: area
      label: Area of triangle ABC
      expr: abs(3*y-4*x-2)/2
      places: 1
    goals:
    - prompt: Make C collinear with A and B (area 0), with x negative.
      want:
        area: 0
        x:
        - -6
        - -1
      mistakes:
      - when:
          area:
          - 0.5
          - 3
        say: 'Close, but A, B and C still make a thin triangle. Collinear means the determinant is exactly 0: 3y = 4x + 2.'
    - prompt: Make the area exactly 5.
      want:
        area: 5
      mistakes:
      - when:
          dv: 5
        say: The determinant is 5, but the area is HALF of it. You need |determinant| = 10.
      - when:
          dv: -5
        say: The determinant is −5, but the area is half its size. You need |determinant| = 10.
    - prompt: 'Area 5 again, but with the determinant negative: C on the other side of AB.'
      want:
        dv: -10
      mistakes:
      - when:
          dv: 10
        say: That's +10. The sign shows which side of AB C is on; the area ignores it. Move C to the other side.
  lesson:
    - teach: 'Every square matrix A has a number called its determinant, |A|. For 2 × 2, |[[a, b], [c, d]]| = ad − bc. For 3 × 3, expand along any row or column: each entry times its cofactor, with signs in the pattern + − + / − + − / + − +.'
      check:
        prompt: Find |[[5, 2], [3, 4]]|.
        options:
        - '14'
        - '26'
        - '7'
        answer: '14'
        why: 5 × 4 − 2 × 3 = 20 − 6 = 14.
      ways:
      - style: visual
        teach: Expanding a 3 × 3 determinant along row 1, shown on [[2, 1, 3], [0, 4, 1], [1, 0, 2]].
        picture:
          kind: flow
          steps:
          - 'Signs along row 1: + − +'
          - +2 × |[[4, 1], [0, 2]]| = 2 × 8 = 16
          - −1 × |[[0, 1], [1, 2]]| = −1 × (−1) = 1
          - +3 × |[[0, 4], [1, 0]]| = 3 × (−4) = −12
          - 'Total: 16 + 1 − 12 = 5'
          alt: 'Expand along row 1 with signs plus, minus, plus: 2 times 8 is 16, minus 1 times minus 1 is 1, 3 times minus 4 is minus 12; the determinant is 5.'
      - style: real_world
        teach: A determinant measures how much a matrix stretches area. [[2, 0], [0, 5]] stretches a 1 × 1 tile into a 2 × 5 rectangle, and its determinant 2 × 5 − 0 = 10 is exactly that area. A determinant of 0 squashes the tile flat.
    - teach: 'Useful properties: |Aᵀ| = |A|; swapping two rows changes the sign; two equal rows give 0; |AB| = |A||B|; for an n × n matrix, |kA| = kⁿ|A|. A triangular matrix has determinant equal to the product of its diagonal.'
      check:
        prompt: A is 3 × 3 with |A| = 2. Find |3A|.
        options:
        - '54'
        - '6'
        - '18'
        answer: '54'
        why: '|3A| = 3³ × 2 = 27 × 2 = 54.'
      ways:
      - style: visual
        teach: Which row changes leave the determinant alone, and which change it.
        picture:
          kind: compare
          columns:
          - title: Leaves |A| the same
            points:
            - 'Transpose: |Aᵀ| = |A|'
            - Add a multiple of one row to another row
          - title: Changes |A|
            points:
            - 'Swap two rows: sign flips'
            - 'Multiply one row by k: × k'
            - 'Multiply the whole n × n matrix by k: × kⁿ'
          alt: Transposing, or adding a multiple of one row to another, leaves the determinant the same. Swapping two rows flips the sign, multiplying one row by k multiplies it by k, and multiplying the whole n by n matrix by k multiplies it by k to the power n.
      - style: step_by_step
        teach: 'B is 3 × 3 with |B| = 2. Find |5B|. Step 1: 5B multiplies every one of the 3 rows by 5. Step 2: Each row multiplies the determinant by 5. Step 3: So |5B| = 5³ × 2 = 125 × 2 = 250. Step 4: Not 5 × 2 = 10: that would scale only one row.'
    - teach: Area of a triangle with vertices (x₁, y₁), (x₂, y₂), (x₃, y₃) = ½|x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|. If this is 0, the three points lie on one line (collinear).
      picture:
        kind: geometry
        points:
          O:
          - 0
          - 0
          A:
          - 6
          - 0
          B:
          - 0
          - 4
        segments:
        - - O
          - A
        - - A
          - B
        - - B
          - O
        labels:
          OA: '6'
          OB: '4'
        alt: Right triangle with vertices (0, 0), (6, 0) and (0, 4).
      check:
        prompt: Area of the triangle with vertices (0, 0), (6, 0), (0, 4)?
        options:
        - '12'
        - '24'
        - '10'
        answer: '12'
        why: ½|0 + 6(4 − 0) + 0| = ½ × 24 = 12.
      ways:
      - style: step_by_step
        teach: 'Area of the triangle with vertices (2, 1), (5, 1), (2, 4). Step 1: x₁(y₂ − y₃) = 2(1 − 4) = −6. Step 2: x₂(y₃ − y₁) = 5(4 − 1) = 15. Step 3: x₃(y₁ − y₂) = 2(1 − 1) = 0. Step 4: Area = ½|−6 + 15 + 0| = 4.5 square units.'
      - style: real_world
        teach: 'Three bus stops sit at (1, 1), (2, 3) and (3, 5) on a town map. The area formula gives 1(3 − 5) + 2(5 − 1) + 3(1 − 3) = −2 + 8 − 6 = 0, so the stops lie on one straight road: one bus route can pass all three.'
  items:
  - prompt: Find the determinant of [[3, 4], [1, 2]].
    answer: '2'
    check: 3*2-4*1
    difficulty: 1
    hints:
    - ad − bc.
    - 6 − 4.
    solution: '2.'
    mistakes:
      '10': c12_det
  - prompt: Find the determinant of [[2, 0, 0], [0, 3, 0], [0, 0, 4]].
    answer: '24'
    check: 2*3*4
    difficulty: 1
    hints:
    - Diagonal matrix.
    - 2 × 3 × 4.
    solution: '24.'
    mistakes: {"9": "m12_diag_det", "0": "m12_diag_det", "4": "m12_diag_det"}
  - prompt: Find the area of the triangle with vertices (0, 0), (4, 0) and (0, 3).
    answer: '6'
    check: Rational(1,2)*abs(0*(0-3)+4*(3-0)+0*(0-0))
    difficulty: 1
    hints:
    - ½|x₁(y₂−y₃)+...|.
    - ½ × 12.
    solution: 6 square units.
    mistakes: {"12": "m12_area_det", "7": "m12_area_det"}
  - prompt: If |A| = 3 for a 2 × 2 matrix A, find |2A|.
    answer: '12'
    check: 2**2*3
    difficulty: 2
    hints:
    - '|kA| = k²|A| for 2 × 2.'
    - 4 × 3.
    solution: '12.'
    mistakes:
      '6': c12_det
  - prompt: Find the determinant of [[1, 2, 3], [0, 1, 4], [0, 0, 2]].
    answer: '2'
    check: 1*1*2
    difficulty: 2
    hints:
    - Upper triangular.
    - Product of diagonal.
    solution: '2.'
    mistakes: {"6": "m12_diag_det", "1": "m12_diag_det", "8": "m12_diag_det"}
  - prompt: 'If the area formula gives 0 for three points, the points are:'
    options:
    - collinear
    - a right triangle
    - equidistant
    - on a circle
    answer: collinear
    difficulty: 2
    hints:
    - No triangle formed.
    - On one line.
    solution: Collinear.
    mistakes: {"a right triangle": "m12_collinear", "equidistant": "m12_collinear", "on a circle": "m12_collinear"}
  - prompt: Find the determinant of [[7, 3], [2, 1]].
    answer: '1'
    check: 7*1 - 3*2
    difficulty: 1
    hints:
    - Main diagonal product minus the other.
    - 7 × 1 and 3 × 2.
    solution: 'Step 1: 7 − 6. Step 2: 1.'
    mistakes:
      '13': c12m4_exp
      '-1': c12m4_exp
  - prompt: Find the determinant of [[2, 5], [4, 10]].
    answer: '0'
    check: 2*10 - 5*4
    difficulty: 1
    hints:
    - Compute ad − bc.
    - Notice the second row is twice the first.
    solution: 'Step 1: 20 − 20. Step 2: 0 (rows proportional).'
    mistakes:
      '40': c12m4_exp
      '-40': c12m4_exp
  - prompt: Find the determinant of [[1, 0, 0], [5, 2, 0], [7, 8, 3]].
    answer: '6'
    check: 1*2*3
    difficulty: 1
    hints:
    - Everything above the diagonal is 0.
    - The matrix is triangular.
    solution: 'Step 1: product of diagonal. Step 2: 1 × 2 × 3 = 6.'
    mistakes:
      '26': c12m4_exp
      '0': c12m4_exp
  - prompt: Find the determinant of [[1, 2, 0], [3, 1, 0], [0, 0, 2]].
    answer: '-10'
    check: 2*(1*1 - 2*3)
    difficulty: 2
    hints:
    - Expand along the third row or column.
    - Only the entry 2 contributes.
    solution: 'Step 1: 2 × |[[1, 2], [3, 1]]|. Step 2: 2 × (1 − 6) = −10.'
    mistakes:
      '10': c12m4_cof
      '-5': c12m4_exp
  - prompt: '|A| = 4 and |B| = −2 for 2 × 2 matrices. Find |AB|.'
    answer: '-8'
    check: 4*(-2)
    difficulty: 2
    hints:
    - The determinant of a product…
    - …is the product of the determinants.
    solution: 'Step 1: |AB| = |A||B|. Step 2: 4 × (−2) = −8.'
    mistakes:
      '2': c12m4_prop
      '8': c12m4_prop
  - prompt: A is 3 × 3 with |A| = 5. Find |Aᵀ|.
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Transposing swaps rows and columns.
    - Does that change the determinant?
    solution: 'Step 1: |Aᵀ| = |A|. Step 2: 5.'
    mistakes:
      '-5': c12m4_prop
      '125': c12m4_prop
  - prompt: Find the area of the triangle with vertices (1, 1), (4, 1) and (1, 5).
    answer: '6'
    check: Rational(1,2)*abs(1*(1-5) + 4*(5-1) + 1*(1-1))
    difficulty: 2
    hints:
    - Use the area formula with x₁ = 1, y₁ = 1.
    - Or notice the base and height lines.
    solution: 'Step 1: 1(1 − 5) + 4(5 − 1) + 1(0) = −4 + 16 = 12. Step 2: ½ × 12 = 6.'
    mistakes:
      '12': c12m4_exp
      '3': c12m4_exp
  - prompt: Find k if (1, 2), (3, 6) and (k, 10) are collinear.
    answer: '5'
    check: 10/2
    difficulty: 3
    hints:
    - Collinear means the area is 0.
    - Or note y = 2x passes through the first two points.
    solution: 'Step 1: the line through (1, 2) and (3, 6) is y = 2x. Step 2: 10 = 2k, k = 5.'
    mistakes:
      '4': c12m4_exp
      '6': c12m4_exp
  - prompt: 'Swapping two rows of a 3 × 3 matrix with |A| = 7 gives a determinant of:'
    answer: '-7'
    check: '-7'
    difficulty: 3
    hints:
    - One swap of rows…
    - …changes only the sign.
    solution: 'Step 1: a row swap multiplies by −1. Step 2: −7.'
    mistakes:
      '7': c12m4_prop
      '0': c12m4_prop
  - prompt: 'Assertion (A): If two rows of a 3 × 3 matrix are identical, its determinant is 0.

      Reason (R): Swapping two rows of a matrix changes the sign of its determinant.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Swap the two identical rows: the matrix does not change, but by R the determinant changes sign, so D = −D and D = 0. A is true because of R.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A surveyor marks the corners of a triangular plot at (0, 0), (6, 0) and (2, 5) on a grid where each unit is 10 m. Using determinants, what is the area of the plot in square units?'
    options:
    - '15'
    - '30'
    - '12'
    answer: '15'
    hints:
    - Use Area = ½|x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|.
    - 'Only the middle term is non-zero here: 6 × (5 − 0).'
    solution: Area = ½|0(0 − 5) + 6(5 − 0) + 2(0 − 0)| = ½ × 30 = 15 square units.
    mistakes:
      '30': m12_area_det
      '12': m12_area_det
    exam: case
    difficulty: 2
  - prompt: A is a 3 × 3 matrix with |A| = 2. A student says |3A| = 6. What is the correct value of |3A|?
    options:
    - '54'
    - '6'
    - '18'
    answer: '54'
    hints:
    - 3A multiplies every row of A by 3.
    - How many rows does a 3 × 3 matrix have?
    solution: Each of the 3 rows is multiplied by 3, so |3A| = 3³ × |A| = 27 × 2 = 54.
    mistakes:
      '6': c12m4_prop
      '18': c12m4_prop
    exam: competency
    difficulty: 2
- code: cbse12m.det.systems
  title: Adjoint, inverse and solving equations
  after:
  - cbse12m.det.value
  notes: |
    Minor Mᵢⱼ, cofactor Aᵢⱼ = (−1)^(i+j) Mᵢⱼ. Adjoint: transpose of the cofactor matrix. A(adj A) = |A| I. A⁻¹ = adj A / |A|
    if |A| ≠ 0. Solving AX = B: X = A⁻¹B. Consistency: |A| ≠ 0 → unique solution; |A| = 0 → check (adj A)B: if not zero,
    inconsistent (no solution); if zero, infinitely many or none.
  explanations:
    text: To solve several linear equations at once, write them as AX = B. If the determinant of A isn't zero, multiply by A⁻¹ to get X. The inverse comes from the adjoint divided by the determinant.
    visual: 'Write 2x + y = 5 and x + y = 3 as [[2, 1], [1, 1]][x; y] = [5; 3]. The determinant is 1, so there''s exactly one solution: x = 2, y = 1.'
    step_by_step: 'Step 1: Write AX = B. Step 2: Find |A|. Step 3: If |A| ≠ 0, find A⁻¹ = adj A / |A|. Step 4: X = A⁻¹B.'
    real_world: Economists solve systems of equations with matrices to balance supply and demand across many goods.
  picture:
    kind: compare
    columns:
    - title: '|A|'
      points:
      - ≠ 0
      - = 0, (adj A)B ≠ 0
      - = 0, (adj A)B = 0
    - title: System
      points:
      - unique solution
      - no solution
      - none or infinitely many
    alt: How the determinant decides whether a system has a unique, no or many solutions.
  activity:
    type: formula
    prompt: The system x + 2y = 3 and 2x + ky = m has |A| = k − 4. If |A| ≠ 0 there is one solution; if |A| = 0, there are none or infinitely many.
    inputs:
    - name: k
      label: k
      min: -6
      max: 10
      step: 1
      start: 0
    - name: m
      label: m
      min: -6
      max: 12
      step: 1
      start: 0
    outputs:
    - name: det
      label: '|A| = k − 4'
      expr: k-4
    - name: gap
      label: 'If |A| = 0: |m − 6|'
      expr: abs(m-6)
    - name: r
      label: Does (1, 1) fit eq. 2? 2 + k − m
      expr: 2+k-m
    goals:
    - prompt: Make the system have no solution.
      want:
        det: 0
        gap:
        - 1
        - 18
      mistakes:
      - when:
          det: 0
          gap: 0
        say: 'With m = 6 the second equation is twice the first: the same line, infinitely many solutions. Parallel lines need a different right side.'
      - when:
          det:
          - -10
          - -1
        say: '|A| ≠ 0 means exactly one solution. Make |A| = 0.'
      - when:
          det:
          - 1
          - 6
        say: '|A| ≠ 0 means exactly one solution. Make |A| = 0.'
    - prompt: Make it have infinitely many solutions.
      want:
        det: 0
        gap: 0
      mistakes:
      - when:
          det: 0
          gap:
          - 1
          - 18
        say: 'Same slope but a different right side: parallel lines, no solution. Make equation 2 exactly twice equation 1.'
    - prompt: Make (1, 1) the one and only solution, with k > 4.
      want:
        r: 0
        k:
        - 5
        - 10
      mistakes:
      - when:
          r: 0
          k: 4
        say: 'k = 4 makes |A| = 0: (1, 1) fits, but so do infinitely many other points.'
      - when:
          k:
          - 5
          - 10
          r:
          - -10
          - -1
        say: '(1, 1) doesn''t satisfy equation 2 yet: 2(1) + k(1) must equal m.'
      - when:
          k:
          - 5
          - 10
          r:
          - 1
          - 20
        say: '(1, 1) doesn''t satisfy equation 2 yet: 2(1) + k(1) must equal m.'
  lesson:
    - teach: 'Minor Mᵢⱼ: the determinant left after deleting row i and column j. Cofactor Aᵢⱼ = (−1)^(i+j) Mᵢⱼ. For [[a, b], [c, d]]: A₁₁ = d, A₁₂ = −c, A₂₁ = −b, A₂₂ = a.'
      check:
        prompt: For [[2, 7], [5, 3]], find the cofactor A₂₁.
        options:
        - '-7'
        - '7'
        - '-5'
        answer: '-7'
        why: 'Delete row 2, column 1: minor 7; sign (−1)³ = −1.'
      ways:
      - style: visual
        teach: Minors and cofactors of A = [[5, 2], [3, 4]], one position at a time.
        picture:
          kind: flow
          steps:
          - A = [[5, 2], [3, 4]]
          - 'Minors: M₁₁ = 4, M₁₂ = 3, M₂₁ = 2, M₂₂ = 5'
          - 'Sign pattern: + − / − +'
          - 'Cofactors: A₁₁ = 4, A₁₂ = −3, A₂₁ = −2, A₂₂ = 5'
          alt: For A equals 5, 2, 3, 4 the minors are 4, 3, 2, 5; applying the sign pattern plus minus, minus plus gives cofactors 4, minus 3, minus 2, 5.
      - style: step_by_step
        teach: 'Find the cofactor A₂₃ of [[1, 2, 0], [3, 1, 4], [0, 5, 2]]. Step 1: Delete row 2 and column 3, leaving [[1, 2], [0, 5]]. Step 2: Its determinant is 1 × 5 − 2 × 0 = 5, the minor. Step 3: The sign is (−1)^(2+3) = −1. Step 4: A₂₃ = −5.'
    - teach: The adjoint adj A is the transpose of the matrix of cofactors. A(adj A) = |A|I, so A⁻¹ = adj A / |A| when |A| ≠ 0.
      check:
        prompt: 'A is 2 × 2 with |A| = 3. A(adj A) equals:'
        options:
        - 3I
        - I
        - 9I
        answer: 3I
        why: A(adj A) = |A|I.
      ways:
      - style: visual
        teach: From A to A⁻¹ through the adjoint, shown on A = [[5, 2], [3, 4]].
        picture:
          kind: flow
          steps:
          - '|A| = 20 − 6 = 14'
          - Cofactor matrix [[4, −3], [−2, 5]]
          - 'Transpose: adj A = [[4, −2], [−3, 5]]'
          - A⁻¹ = adj A ÷ 14
          alt: 'For A equals 5, 2, 3, 4: the determinant is 14, the cofactor matrix is 4, minus 3, minus 2, 5, its transpose adj A is 4, minus 2, minus 3, 5, and A inverse is adj A divided by 14.'
      - style: step_by_step
        teach: 'Check that A(adj A) = |A|I for A = [[5, 2], [3, 4]], adj A = [[4, −2], [−3, 5]]. Step 1: Row 1 × column 1: 20 − 6 = 14. Step 2: Row 1 × column 2: −10 + 10 = 0. Step 3: Row 2 × column 1: 12 − 12 = 0. Step 4: Row 2 × column 2: −6 + 20 = 14. So the product is 14I.'
    - teach: 'A system like 2x + 3y = 8, x + y = 3 can be written AX = B. If |A| ≠ 0 there is exactly one solution, X = A⁻¹B. If |A| = 0, compute (adj A)B: if it is not zero, there is no solution; if it is zero, there may be infinitely many or none.'
      picture:
        kind: flow
        steps:
        - Write AX = B
        - Find |A|
        - '|A| ≠ 0: X = A⁻¹B'
        - '|A| = 0: check (adj A)B'
        alt: Deciding and solving a system of linear equations with matrices.
      check:
        prompt: 'If |A| = 0 and (adj A)B ≠ 0, the system has:'
        options:
        - no solution
        - a unique solution
        - exactly two solutions
        answer: no solution
        why: The system is inconsistent.
      ways:
      - style: step_by_step
        teach: 'Solve 4x + 3y = 18, x + 2y = 7. Step 1: A = [[4, 3], [1, 2]], |A| = 8 − 3 = 5, so there is one solution. Step 2: A⁻¹ = ⅕[[2, −3], [−1, 4]]. Step 3: X = ⅕[2 × 18 − 3 × 7, −18 + 4 × 7] = ⅕[15, 10]. Step 4: x = 3, y = 2.'
      - style: real_world
        teach: 'Two straight roads x + y = 2 and 2x + 2y = 5 never meet: they are parallel. Their coefficient matrix [[1, 1], [2, 2]] has determinant 0, and (adj A)B is not zero, so the system has no solution, just as the two roads have no crossing.'
  items:
  - prompt: Solve 2x + y = 5, x + y = 3. Find x.
    answer: '2'
    check: 5-3
    difficulty: 1
    hints:
    - Subtract.
    - x = 2.
    solution: x = 2.
    mistakes: {"1": "m12_solve_system", "3": "m12_solve_system"}
  - prompt: In the same system, find y.
    answer: '1'
    check: 3-2
    difficulty: 1
    hints:
    - 3 − x.
    - 3 − 2.
    solution: y = 1.
    mistakes: {"2": "m12_solve_system", "3": "m12_solve_system"}
  - prompt: Find the cofactor A₁₁ of [[3, 4], [1, 2]].
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Delete row 1, column 1.
    - Sign +.
    solution: '2.'
    mistakes: {"3": "m12_cofactor", "-2": "m12_cofactor", "4": "m12_cofactor"}
  - prompt: Find the cofactor A₁₂ of [[3, 4], [1, 2]].
    answer: '-1'
    check: -1*1
    difficulty: 2
    hints:
    - Minor = 1.
    - Sign (−1)³.
    solution: −1.
    mistakes: {"1": "m12_cofactor", "4": "m12_cofactor", "-4": "m12_cofactor"}
  - prompt: 'If |A| ≠ 0, the system AX = B has:'
    options:
    - a unique solution
    - no solution
    - infinitely many solutions
    - exactly two solutions
    answer: a unique solution
    difficulty: 1
    hints:
    - A⁻¹ exists.
    - X = A⁻¹B.
    solution: A unique solution.
    mistakes: {"no solution": "m12_unique", "infinitely many solutions": "m12_unique", "exactly two solutions": "m12_unique"}
  - prompt: 'A matrix with determinant zero is called:'
    options:
    - singular
    - non-singular
    - identity
    - orthogonal
    answer: singular
    difficulty: 1
    hints:
    - No inverse.
    - Special case.
    solution: Singular.
    mistakes:
      non-singular: c12_singular
  - prompt: Solve 3x + y = 7, x + y = 3. Find x.
    answer: '2'
    check: (7 - 3)/2
    difficulty: 1
    hints:
    - Subtract the second equation from the first.
    - That removes y.
    solution: 'Step 1: 2x = 4. Step 2: x = 2.'
    mistakes:
      '1': c12m4_solve
      '4': c12m4_solve
  - prompt: Solve 3x + y = 7, x + y = 3. Find y.
    answer: '1'
    check: 3 - 2
    difficulty: 1
    hints:
    - Find x first.
    - Put it into x + y = 3.
    solution: 'Step 1: x = 2. Step 2: y = 1.'
    mistakes:
      '2': c12m4_solve
      '3': c12m4_solve
  - prompt: For [[4, 1], [6, 2]], find the cofactor A₂₂.
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Delete row 2 and column 2.
    - Sign (−1)⁴ is +.
    solution: 'Step 1: minor is 4. Step 2: cofactor 4.'
    mistakes:
      '2': c12m4_cof
      '-4': c12m4_cof
  - prompt: For [[4, 1], [6, 2]], find the cofactor A₁₂.
    answer: '-6'
    check: '-6'
    difficulty: 2
    hints:
    - Delete row 1, column 2.
    - Then apply (−1)^(1+2).
    solution: 'Step 1: minor is 6. Step 2: sign −, so −6.'
    mistakes:
      '6': c12m4_cof
      '-1': c12m4_cof
  - prompt: A is 3 × 3 with |A| = 2. Find |adj A|.
    answer: '4'
    check: 2**2
    difficulty: 3
    hints:
    - '|adj A| = |A|^(n − 1).'
    - Here n = 3.
    solution: 'Step 1: |adj A| = 2². Step 2: 4.'
    mistakes:
      '2': c12m4_prop
      '8': c12m4_prop
  - prompt: Solve x + 2y = 7, 2x − y = 4. Find x.
    answer: '3'
    check: (7 + 2*4)/5
    difficulty: 2
    hints:
    - Double the second equation and add to the first to remove y.
    - x + 2y + 4x − 2y = 7 + 8.
    solution: 'Step 1: 5x = 15. Step 2: x = 3.'
    mistakes:
      '2': c12m4_solve
      '5': c12m4_solve
  - prompt: Solve x + 2y = 7, 2x − y = 4. Find y.
    answer: '2'
    check: (7 - 3)/2
    difficulty: 2
    hints:
    - Use x = 3.
    - 3 + 2y = 7.
    solution: 'Step 1: 2y = 4. Step 2: y = 2.'
    mistakes:
      '3': c12m4_solve
      '4': c12m4_solve
  - prompt: For which k does the system x + 2y = 3, 2x + ky = 5 fail to have a unique solution?
    answer: '4'
    check: 2*2
    difficulty: 3
    hints:
    - A unique solution needs |A| ≠ 0.
    - Set 1 × k − 2 × 2 = 0.
    solution: 'Step 1: |A| = k − 4. Step 2: k = 4.'
    mistakes:
      '2': c12m4_solve
      '1': c12m4_solve
  - prompt: 'With k = 4 in x + 2y = 3, 2x + 4y = 5, the system has:'
    options:
    - no solution
    - infinitely many solutions
    - a unique solution
    answer: no solution
    difficulty: 3
    hints:
    - Double the first equation.
    - 'Compare with the second: 2x + 4y = 6 vs 5.'
    solution: 'Step 1: 2x + 4y would equal both 6 and 5. Step 2: impossible, so no solution.'
    mistakes:
      infinitely many solutions: c12m4_solve
      a unique solution: c12m4_solve
  - prompt: 'Assertion (A): The system x + y = 2, 2x + 2y = 6 has no solution.

      Reason (R): For this system, the determinant of the coefficient matrix is 0.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, but R does not explain A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Both are true: the lines are parallel (2x + 2y = 6 means x + y = 3), and |A| = 2 − 2 = 0. But |A| = 0 alone does not decide it: x + y = 2, 2x + 2y = 4 also has |A| = 0 and infinitely many solutions. So R does not explain A.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A canteen sells tea at ₹x a cup and samosas at ₹y each. Order 1: 2 teas and 3 samosas cost ₹70. Order 2: 3 teas and 2 samosas cost ₹80. Solving with matrices, what is the price of one tea?'
    options:
    - ₹20
    - ₹10
    - ₹15
    answer: ₹20
    hints:
    - Write 2x + 3y = 70 and 3x + 2y = 80 as AX = B.
    - '|A| = 2 × 2 − 3 × 3 = −5.'
    solution: '|A| = 4 − 9 = −5. x = (70 × 2 − 3 × 80) ÷ (−5) = (−100) ÷ (−5) = 20 and y = (2 × 80 − 3 × 70) ÷ (−5) = 10. A tea costs ₹20.'
    mistakes:
      ₹10: pq12m4_which_unknown
      ₹15: c12m4_solve
    exam: case
    difficulty: 2
  - prompt: A student tries to find A⁻¹ for A = [[2, 6], [1, 3]] using the adjoint formula. What should the teacher say?
    options:
    - No inverse exists, because |A| = 0
    - The inverse is [[3, −6], [−1, 2]]
    - The inverse is [[3, 6], [1, 2]]
    answer: No inverse exists, because |A| = 0
    hints:
    - Work out ad − bc first.
    - A⁻¹ = adj A ÷ |A|.
    solution: '|A| = 2 × 3 − 6 × 1 = 0, so A is singular and A⁻¹ = adj A ÷ |A| cannot be formed.'
    mistakes:
      The inverse is [[3, −6], [−1, 2]]: pq12m4_check_det
      The inverse is [[3, 6], [1, 2]]: pq12m4_check_det
    exam: competency
    difficulty: 2
