# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse12-math
chapter: 5
title: Continuity and Differentiability
tips:
  c12_chain: 'Chain rule: differentiate the outer function, keep the inside, then multiply by the derivative of the inside.'
  c12_cont: Continuous at a means the left limit, right limit and f(a) all exist and are equal.
  m12_diff_cont: "Can a curve have a slope at a point where it is broken?"
  m12_factor_limit: "Factor x² − 9 as (x − 3)(x + 3), cancel, then substitute."
  m12_floor_jump: "[x] stays flat and then jumps. Where does it jump?"
  m12_log_chain: "ln(x²) = 2 ln x. Differentiate, then put x = 1."
  m12_mod_corner: "The graph of |x| has no break at 0 but a sharp corner there."
  m12_one_over_x: "Where is 1/x undefined?"
  m12_parametric: "dy/dx = (dy/dt)/(dx/dt). Find each, then put t = 2."
  m12_power_rule: "d/dx xⁿ = nxⁿ⁻¹. Then substitute x = 2."
  m12_tan_inv_deriv: "sin⁻¹x gives 1/√(1 − x²). For tan⁻¹, differentiate tan y = x and use 1 + tan² y = sec² y."
concepts:
- code: cbse12m.cont.continuity
  title: Continuity
  notes: |
    f is continuous at x = a if lim(x→a) f(x) = f(a) (left-hand limit = right-hand limit = value). Continuous on an interval
    if continuous at every point. Polynomials, sin, cos, eˣ, |x| are continuous everywhere; rational functions except where
    the denominator is 0; tan x except odd multiples of π/2. Sums, products, quotients (non-zero denominator) and
    compositions of continuous functions are continuous. Every differentiable function is continuous; |x| is continuous
    but not differentiable at 0. Greatest integer function [x] is discontinuous at integers.
  explanations:
    text: A function is continuous if you can draw its graph without lifting your pen. At a point, the value from the left, the value from the right and the actual value must all agree. Jumps and holes break continuity.
    visual: 'Draw |x|: a V shape with no break, so it''s continuous. Draw the greatest integer function [x]: steps that jump at every integer, so it''s broken there.'
    step_by_step: 'Step 1: Find the left-hand limit. Step 2: Find the right-hand limit. Step 3: Find f(a). Step 4: All equal → continuous.'
    real_world: A taxi meter that jumps from ₹100 to ₹110 at each kilometre is like a discontinuous function.
  picture:
    kind: number_line
    from: -2
    to: 3
    step: 1
    points:
    - at: 0
      label: jump
    - at: 1
      label: jump
    - at: 2
      label: jump
    alt: The greatest integer function jumps at every integer, so it is discontinuous there.
  activity:
    type: formula
    prompt: f(x) = kx + c for x ≤ 2, and 3x − 1 for x > 2. Continuous at 2 needs both pieces to meet there; differentiable needs the same slope too.
    inputs:
    - name: k
      label: Left slope k
      min: -5
      max: 5
      step: 0.5
      start: 0
    - name: c
      label: Left intercept c
      min: -10
      max: 10
      step: 1
      start: 0
    outputs:
    - name: lv
      label: Left piece at x = 2
      expr: 2*k+c
      places: 1
    - name: rv
      label: Right piece reaches
      expr: 5+0*k
    - name: jump
      label: Jump at x = 2 (right − left)
      expr: 5-2*k-c
      places: 1
    - name: kink
      label: Slope difference 3 − k
      expr: 3-k
      places: 1
    goals:
    - prompt: Keep c = 1. Choose k so f is continuous at x = 2.
      want:
        c: 1
        jump: 0
      mistakes:
      - when:
          c: 1
          k: 3
        say: 'Same slope as the right piece, but the left piece reaches 7 at x = 2, not 5: a jump.'
      - when:
          c: 1
          jump:
          - 0.5
          - 20
        say: 'The left piece ends below 5: there''s a gap. Raise k.'
    - prompt: Make f continuous AND smooth (no corner) at x = 2.
      want:
        jump: 0
        kink: 0
      mistakes:
      - when:
          jump: 0
          kink:
          - -10
          - -0.5
        say: 'Joined, but with a corner: the slopes differ, so f isn''t differentiable there.'
      - when:
          jump: 0
          kink:
          - 0.5
          - 10
        say: 'Joined, but with a corner: the slopes differ, so f isn''t differentiable there.'
    - prompt: Keep k = 1. Make a jump of exactly 3 at x = 2, with the left piece below.
      want:
        k: 1
        jump: 3
      mistakes:
      - when:
          k: 1
          jump: -3
        say: 'That''s a jump of 3 the other way: the left piece ends above the right. It must reach only 2.'
  items:
  - prompt: f(x) = kx + 1 for x ≤ 2 and 3x − 1 for x > 2. Find k so that f is continuous at 2.
    answer: '2'
    check: (3*2-1-1)/2
    difficulty: 2
    hints:
    - 2k + 1 = 6 − 1.
    - 2k = 4.
    solution: k = 2.
    mistakes:
      '5': c12_cont
  - prompt: Find lim(x→3) (x² − 9)/(x − 3), the value that makes the function continuous at 3.
    answer: '6'
    check: limit((x**2-9)/(x-3), x, 3)
    difficulty: 2
    hints:
    - 'Factor: x + 3.'
    - 3 + 3.
    solution: '6.'
    mistakes: {"0": "m12_factor_limit", "3": "m12_factor_limit", "9": "m12_factor_limit"}
  - prompt: '|x| at x = 0 is:'
    options:
    - continuous but not differentiable
    - differentiable but not continuous
    - neither
    - both
    answer: continuous but not differentiable
    difficulty: 2
    hints:
    - 'V shape: no break.'
    - Sharp corner.
    solution: Continuous but not differentiable.
    mistakes: {"differentiable but not continuous": "m12_mod_corner", "neither": "m12_mod_corner", "both": "m12_mod_corner"}
  - prompt: 'The greatest integer function [x] is discontinuous at:'
    options:
    - every integer
    - no point
    - only 0
    - every non-integer
    answer: every integer
    difficulty: 2
    hints:
    - Steps.
    - Jumps at integers.
    solution: Every integer.
    mistakes: {"no point": "m12_floor_jump", "only 0": "m12_floor_jump", "every non-integer": "m12_floor_jump"}
  - prompt: 'Every differentiable function is:'
    options:
    - continuous
    - discontinuous
    - constant
    - a polynomial
    answer: continuous
    difficulty: 1
    hints:
    - Smooth implies unbroken.
    - Converse is false.
    solution: Continuous.
    mistakes: {"discontinuous": "m12_diff_cont", "constant": "m12_diff_cont", "a polynomial": "m12_diff_cont"}
  - prompt: 'f(x) = 1/x is discontinuous at:'
    options:
    - x = 0
    - x = 1
    - every point
    - no point
    answer: x = 0
    difficulty: 1
    hints:
    - Denominator zero.
    - Not defined.
    solution: x = 0.
    mistakes: {"x = 1": "m12_one_over_x", "every point": "m12_one_over_x", "no point": "m12_one_over_x"}
- code: cbse12m.cont.derivatives
  title: Differentiation rules
  after:
  - cbse12m.cont.continuity
  notes: |
    Chain rule: d/dx f(g(x)) = f′(g(x))·g′(x). Derivatives: d(sin x) = cos x; d(cos x) = −sin x; d(tan x) = sec²x; d(eˣ) = eˣ;
    d(ln x) = 1/x; d(sin⁻¹x) = 1/√(1 − x²); d(tan⁻¹x) = 1/(1 + x²). Implicit differentiation. Logarithmic differentiation
    (for xˣ, products). Parametric: dy/dx = (dy/dt)/(dx/dt). Second-order derivatives.
  explanations:
    text: 'Differentiation finds how fast a function changes. The chain rule handles functions inside functions: differentiate the outside, then multiply by the derivative of the inside. There are standard results for sin, cos, eˣ and ln x.'
    visual: 'Think of y = sin(3x) as an outer box (sin) with 3x inside. Derivative: cos(3x) for the box, times 3 for the inside: 3cos(3x).'
    step_by_step: 'Step 1: Spot the outer and inner functions. Step 2: Differentiate the outer, keeping the inner. Step 3: Multiply by the derivative of the inner. Step 4: Simplify.'
    real_world: Car speedometers show the derivative of distance with respect to time.
  picture:
    kind: flow
    steps:
    - y = f(g(x))
    - 'Differentiate outer: f′(g(x))'
    - 'Differentiate inner: g′(x)'
    - Multiply
    alt: 'The chain rule: differentiate the outer function, then multiply by the derivative of the inner.'
  activity:
    type: sort
    prompt: Find the derivative of each function. Use the chain rule where one function sits inside another.
    bins:
    - cos x
    - −sin x
    - eˣ
    - 1/x
    - 2x
    items:
    - label: sin x
      bin: cos x
      clue: Which function's slope does the sine curve have?
      why: d/dx sin x = cos x.
    - label: sin x + 10
      bin: cos x
      clue: What is the derivative of a constant?
      why: The 10 disappears; sin x gives cos x.
    - label: cos x
      bin: −sin x
      clue: Does cos x go up or down just after 0?
      why: d/dx cos x = −sin x.
    - label: cos(−x)
      bin: −sin x
      clue: 'Chain rule: differentiate the outside, then times d/dx(−x).'
      why: '−sin(−x) × (−1) = sin(−x) = −sin x. (Or: cos(−x) = cos x.)'
    - label: eˣ
      bin: eˣ
      clue: Which function is its own slope?
      why: d/dx eˣ = eˣ.
    - label: eˣ + 4
      bin: eˣ
      clue: What happens to the + 4?
      why: 'Constants vanish: eˣ stays.'
    - label: ln x
      bin: 1/x
      clue: Which function's slope is the reciprocal of x?
      why: d/dx ln x = 1/x.
    - label: ln(5x)
      bin: 1/x
      clue: 'Chain rule: (1/(5x)) × 5. Or split: ln 5 + ln x.'
      why: '5/(5x) = 1/x: ln 5 is just a constant.'
    - label: ½ ln(x²)
      bin: 1/x
      clue: 'Simplify first: ln(x²) = ? ln x.'
      why: ½ × 2 ln x = ln x, whose derivative is 1/x (for x > 0).
    - label: x²
      bin: 2x
      clue: 'Power rule: bring the power down, lower it by one.'
      why: d/dx x² = 2x.
    - label: x² + 7
      bin: 2x
      clue: Does the 7 change the slope?
      why: The 7 vanishes.
  items:
  - prompt: If y = x³, find dy/dx at x = 2.
    answer: '12'
    check: diff(x**3, x).subs(x, 2)
    difficulty: 1
    hints:
    - 3x².
    - 3 × 4.
    solution: '12.'
    mistakes: {"8": "m12_power_rule", "6": "m12_power_rule", "4": "m12_power_rule"}
  - prompt: If y = sin(3x), find dy/dx at x = 0.
    answer: '3'
    check: diff(sin(3*x), x).subs(x, 0)
    difficulty: 1
    hints:
    - 3cos 3x.
    - cos 0 = 1.
    solution: '3.'
    mistakes:
      '1': c12_chain
  - prompt: If y = (2x + 1)⁵, find dy/dx at x = 0.
    answer: '10'
    check: diff((2*x+1)**5, x).subs(x, 0)
    difficulty: 2
    hints:
    - 5(2x + 1)⁴ × 2.
    - 5 × 1 × 2.
    solution: '10.'
    mistakes:
      '5': c12_chain
  - prompt: If y = ln(x²), find dy/dx at x = 1.
    answer: '2'
    check: 2/1
    difficulty: 2
    hints:
    - 2x/x² = 2/x.
    - At x = 1.
    solution: '2.'
    mistakes: {"1": "m12_log_chain", "0": "m12_log_chain"}
  - prompt: If x = t² and y = t³, find dy/dx at t = 2.
    answer: '3'
    check: Rational(3,2)*2
    difficulty: 2
    hints:
    - (3t²)/(2t) = 3t/2.
    - At t = 2.
    solution: '3.'
    mistakes: {"2": "m12_parametric", "12": "m12_parametric", "2/3": "m12_parametric"}
  - prompt: 'd/dx (tan⁻¹x) equals:'
    options:
    - 1/(1 + x²)
    - 1/√(1 − x²)
    - sec²x
    - −1/(1 + x²)
    answer: 1/(1 + x²)
    difficulty: 2
    hints:
    - Standard result.
    - Never zero denominator.
    solution: 1/(1 + x²).
    mistakes: {"1/√(1 − x²)": "m12_tan_inv_deriv", "sec²x": "m12_tan_inv_deriv", "−1/(1 + x²)": "m12_tan_inv_deriv"}
