# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse12-math
chapter: 5
title: Continuity and Differentiability
tips:
  c12_chain: 'Chain rule: differentiate the outer function, keep the inside, then multiply by the derivative of the inside.'
  c12_cont: Continuous at a means the left limit, right limit and f(a) all exist and are equal.
  m12_diff_cont: "Can a curve have a slope at a point where it is broken?"
  m12_factor_limit: "Factor x² − 9 as (x − 3)(x + 3), cancel, then substitute."
  m12_floor_jump: "[x] stays flat and then jumps. Where does it jump?"
  m12_log_chain: "ln(x²) = 2 ln x. Differentiate, then put x = 1."
  m12_mod_corner: "The graph of |x| has no break at 0 but a sharp corner there."
  m12_one_over_x: "Where is 1/x undefined?"
  m12_parametric: "dy/dx = (dy/dt)/(dx/dt). Find each, then put t = 2."
  m12_power_rule: "d/dx xⁿ = nxⁿ⁻¹. Then substitute x = 2."
  m12_tan_inv_deriv: "Let y = tan⁻¹x, so tan y = x. Differentiate both sides: sec²y · dy/dx = 1, and use sec²y = 1 + tan²y = 1 + x²."
  c12m5_lim: 'Continuity at a needs three things to agree: the left-hand limit, the right-hand limit and f(a).'
  c12m5_chain: Differentiate the outside function, keep the inside, then multiply by the derivative of the inside.
  c12m5_rule: Recall the standard derivative exactly before substituting a value.
  c12m5_param: For parametric curves, divide dy/dt by dx/dt.
  pq12m5_how_fast: The question asks how fast, which is a rate of change. Is that the height itself, or its derivative?
  pq12m5_corner: A smooth curve has one slope at every point. Look for a graph with a sharp corner but no break.
concepts:
- code: cbse12m.cont.continuity
  title: Continuity
  notes: |
    f is continuous at x = a if lim(x→a) f(x) = f(a) (left-hand limit = right-hand limit = value). Continuous on an interval
    if continuous at every point. Polynomials, sin, cos, eˣ, |x| are continuous everywhere; rational functions except where
    the denominator is 0; tan x except odd multiples of π/2. Sums, products, quotients (non-zero denominator) and
    compositions of continuous functions are continuous. Every differentiable function is continuous; |x| is continuous
    but not differentiable at 0. Greatest integer function [x] is discontinuous at integers.
  explanations:
    text: A function is continuous if you can draw its graph without lifting your pen. At a point, the value from the left, the value from the right and the actual value must all agree. Jumps and holes break continuity.
    visual: 'Draw |x|: a V shape with no break, so it''s continuous. Draw the greatest integer function [x]: steps that jump at every integer, so it''s broken there.'
    step_by_step: 'Step 1: Find the left-hand limit. Step 2: Find the right-hand limit. Step 3: Find f(a). Step 4: All equal → continuous.'
    real_world: A taxi meter that jumps from ₹100 to ₹110 at each kilometre is like a discontinuous function.
  picture:
    kind: number_line
    from: -2
    to: 3
    step: 1
    points:
    - at: 0
      label: jump
    - at: 1
      label: jump
    - at: 2
      label: jump
    alt: The greatest integer function jumps at every integer, so it is discontinuous there.
  activity:
    type: formula
    prompt: f(x) = kx + c for x ≤ 2, and 3x − 1 for x > 2. Continuous at 2 needs both pieces to meet there; differentiable needs the same slope too.
    inputs:
    - name: k
      label: Left slope k
      min: -5
      max: 5
      step: 0.5
      start: 0
    - name: c
      label: Left intercept c
      min: -10
      max: 10
      step: 1
      start: 0
    outputs:
    - name: lv
      label: Left piece at x = 2
      expr: 2*k+c
      places: 1
    - name: rv
      label: Right piece reaches
      expr: 5+0*k
    - name: jump
      label: Jump at x = 2 (right − left)
      expr: 5-2*k-c
      places: 1
    - name: kink
      label: Slope difference 3 − k
      expr: 3-k
      places: 1
    goals:
    - prompt: Keep c = 1. Choose k so f is continuous at x = 2.
      want:
        c: 1
        jump: 0
      mistakes:
      - when:
          c: 1
          k: 3
        say: 'Same slope as the right piece, but the left piece reaches 7 at x = 2, not 5: a jump.'
      - when:
          c: 1
          jump:
          - 0.5
          - 20
        say: 'The left piece ends below 5: there''s a gap. Raise k.'
    - prompt: Make f continuous AND smooth (no corner) at x = 2.
      want:
        jump: 0
        kink: 0
      mistakes:
      - when:
          jump: 0
          kink:
          - -10
          - -0.5
        say: 'Joined, but with a corner: the slopes differ, so f isn''t differentiable there.'
      - when:
          jump: 0
          kink:
          - 0.5
          - 10
        say: 'Joined, but with a corner: the slopes differ, so f isn''t differentiable there.'
    - prompt: Keep k = 1. Make a jump of exactly 3 at x = 2, with the left piece below.
      want:
        k: 1
        jump: 3
      mistakes:
      - when:
          k: 1
          jump: -3
        say: 'That''s a jump of 3 the other way: the left piece ends above the right. It must reach only 2.'
  lesson:
    - teach: 'f is continuous at x = a if you can draw through that point without lifting your pen. Exactly: the left-hand limit, the right-hand limit and f(a) all exist and are equal: lim(x→a) f(x) = f(a).'
      check:
        prompt: f(x) = x + 1 for x < 1 and f(x) = 3 for x ≥ 1. Is f continuous at 1?
        options:
        - no, the left limit is 2 but f(1) = 3
        - yes, both pieces are lines
        - yes, f(1) exists
        answer: no, the left limit is 2 but f(1) = 3
        why: The two sides do not meet, so there is a jump.
      ways:
      - style: visual
        teach: 'Three things can happen at x = a: the graph joins up, jumps, or has a hole.'
        picture:
          kind: compare
          columns:
          - title: Continuous
            points:
            - Left limit = right limit = f(a)
            - Draw without lifting the pen
          - title: Jump
            points:
            - Left and right limits differ
            - 'Example: [x] at x = 1'
          - title: Hole
            points:
            - Limits agree, but f(a) is missing or different
            - 'Example: (x² − 16)/(x − 4) at x = 4'
          alt: 'Continuous: left limit, right limit and f(a) are equal. Jump: left and right limits differ, as with the greatest integer function at 1. Hole: the limits agree but f(a) is missing or different, as with x squared minus 16 over x minus 4 at 4.'
      - style: step_by_step
        teach: 'Is f(x) = 2x + 1 for x ≤ 1 and 4x − 1 for x > 1 continuous at 1? Step 1: Left-hand limit: 2(1) + 1 = 3. Step 2: Right-hand limit: 4(1) − 1 = 3. Step 3: f(1) = 2(1) + 1 = 3. Step 4: All three agree, so f is continuous at 1.'
    - teach: Polynomials, sin x, cos x, eˣ and |x| are continuous everywhere. A rational function is continuous except where its denominator is 0; tan x fails at odd multiples of π/2. Sums, products, quotients (non-zero denominator) and compositions of continuous functions are continuous.
      check:
        prompt: Where is f(x) = 1/(x − 4) discontinuous?
        options:
        - x = 4
        - x = 0
        - x = −4
        answer: x = 4
        why: The denominator is zero there.
      ways:
      - style: visual
        teach: Which common functions are continuous everywhere, and where others break.
        picture:
          kind: compare
          columns:
          - title: Continuous everywhere
            points:
            - Polynomials
            - sin x, cos x, eˣ
            - '|x|'
          - title: Break somewhere
            points:
            - 1/(x − 2) at x = 2
            - tan x at odd multiples of π/2
            - '[x] at every integer'
          alt: Polynomials, sine, cosine, e to the x and the modulus function are continuous everywhere. 1 over x minus 2 breaks at 2, tan x at odd multiples of pi by 2, and the greatest integer function at every integer.
      - style: step_by_step
        teach: 'Where is f(x) = (x + 1)/(x² − 5x + 4) not continuous? Step 1: A rational function breaks only where its denominator is 0. Step 2: x² − 5x + 4 = (x − 1)(x − 4). Step 3: This is 0 at x = 1 and x = 4. Step 4: f is continuous at every other real number.'
    - teach: 'Differentiable at a point means continuous there, but not the other way round: |x| is continuous at 0 but has a sharp corner, so it is not differentiable there. The greatest integer function [x] jumps at every integer.'
      picture:
        kind: compare
        columns:
        - title: Continuous
          points:
          - no jumps or holes
          - e.g. |x| at 0
        - title: Differentiable
          points:
          - smooth, no corners
          - e.g. x² everywhere
        alt: Continuity versus differentiability.
      check:
        prompt: 'f(x) = |x − 3| is not differentiable at:'
        options:
        - x = 3
        - x = 0
        - x = −3
        answer: x = 3
        why: The corner of the V shape is where x − 3 = 0.
      ways:
      - style: step_by_step
        teach: 'Why |x| has no derivative at 0. Step 1: For x < 0, |x| = −x, with slope −1. Step 2: For x > 0, |x| = x, with slope +1. Step 3: At 0 the left slope −1 and the right slope +1 disagree. Step 4: So there is no single slope: continuous, but not differentiable.'
      - style: real_world
        teach: 'A road with a sharp V-shaped bend has no gap: a car can drive straight through it, so the road is continuous. But the direction changes in an instant, with no single heading at the tip. That is what a corner like |x| at 0 looks like to calculus.'
  items:
  - prompt: f(x) = kx + 1 for x ≤ 2 and 3x − 1 for x > 2. Find k so that f is continuous at 2.
    answer: '2'
    check: (3*2-1-1)/2
    difficulty: 2
    hints:
    - 2k + 1 = 6 − 1.
    - 2k = 4.
    solution: "Left value 2k + 1 must equal the right limit 3 × 2 − 1 = 5, so 2k = 4 and k = 2."
    mistakes:
      '5': c12_cont
  - prompt: Find lim(x→3) (x² − 9)/(x − 3), the value that makes the function continuous at 3.
    answer: '6'
    check: limit((x**2-9)/(x-3), x, 3)
    difficulty: 2
    hints:
    - 'Factor: x + 3.'
    - 3 + 3.
    solution: "(x² − 9)/(x − 3) = (x − 3)(x + 3)/(x − 3) = x + 3 for x ≠ 3, which tends to 3 + 3 = 6."
    mistakes: {"0": "m12_factor_limit", "3": "m12_factor_limit", "9": "m12_factor_limit"}
  - prompt: '|x| at x = 0 is:'
    options:
    - continuous but not differentiable
    - differentiable but not continuous
    - neither
    - both
    answer: continuous but not differentiable
    difficulty: 2
    hints:
    - 'V shape: no break.'
    - Sharp corner.
    solution: "|x| → 0 from both sides, so it is continuous. Its slope is −1 on the left and +1 on the right, so it is not differentiable at 0."
    mistakes: {"differentiable but not continuous": "m12_mod_corner", "neither": "m12_mod_corner", "both": "m12_mod_corner"}
  - prompt: 'The greatest integer function [x] is discontinuous at:'
    options:
    - every integer
    - no point
    - only 0
    - every non-integer
    answer: every integer
    difficulty: 2
    hints:
    - Steps.
    - Jumps at integers.
    solution: "[x] jumps by 1 at each integer (for example, [x] = 0 just left of 1 and 1 at 1), so it breaks at every integer."
    mistakes: {"no point": "m12_floor_jump", "only 0": "m12_floor_jump", "every non-integer": "m12_floor_jump"}
  - prompt: 'Every differentiable function is:'
    options:
    - continuous
    - discontinuous
    - constant
    - a polynomial
    answer: continuous
    difficulty: 1
    hints:
    - Smooth implies unbroken.
    - Converse is false.
    solution: "If f′(a) exists, f(a + h) − f(a) = h × (difference quotient) → 0 × f′(a) = 0, so f is continuous at a."
    mistakes: {"discontinuous": "m12_diff_cont", "constant": "m12_diff_cont", "a polynomial": "m12_diff_cont"}
  - prompt: 'f(x) = 1/x is discontinuous at:'
    options:
    - x = 0
    - x = 1
    - every point
    - no point
    answer: x = 0
    difficulty: 1
    hints:
    - Denominator zero.
    - Not defined.
    solution: "1/x is not defined at x = 0 and grows without bound near it, so it breaks there."
    mistakes: {"x = 1": "m12_one_over_x", "every point": "m12_one_over_x", "no point": "m12_one_over_x"}
  - prompt: f(x) = kx for x ≤ 1 and x + 3 for x > 1. Find k so f is continuous at 1.
    answer: '4'
    check: 1 + 3
    difficulty: 1
    hints:
    - Match the two pieces at x = 1.
    - k × 1 must equal 1 + 3.
    solution: 'Step 1: left value k, right limit 4. Step 2: k = 4.'
    mistakes:
      '3': c12m5_lim
      '1': c12m5_lim
  - prompt: Find lim(x→2) (x² − 4)/(x − 2).
    answer: '4'
    check: 2 + 2
    difficulty: 1
    hints:
    - Factor the top as a difference of squares.
    - Cancel the common factor.
    solution: 'Step 1: (x − 2)(x + 2)/(x − 2) = x + 2. Step 2: at x = 2, 4.'
    mistakes:
      '0': c12m5_lim
      '2': c12m5_lim
  - prompt: tan x is discontinuous at x = π/2. How many degrees is that?
    answer: '90'
    check: 180/2
    difficulty: 1
    hints:
    - π radians is 180°.
    - Halve it.
    solution: 'Step 1: π/2 = 180°/2. Step 2: 90°.'
    mistakes:
      '45': c12m5_rule
      '180': c12m5_rule
  - prompt: f(x) = (x² − 1)/(x − 1) for x ≠ 1 and f(1) = k. Find k for continuity at 1.
    answer: '2'
    check: 1 + 1
    difficulty: 2
    hints:
    - Simplify the fraction for x ≠ 1.
    - Then let x approach 1.
    solution: 'Step 1: (x − 1)(x + 1)/(x − 1) = x + 1. Step 2: limit 2, so k = 2.'
    mistakes:
      '0': c12m5_lim
      '1': c12m5_lim
  - prompt: f(x) = ax + 1 for x ≤ 3 and bx + 3 for x > 3, continuous at 3, with a = 2. Find b.
    answer: 4/3
    check: (2*3 + 1 - 3)/3
    difficulty: 2
    hints:
    - Find the left value at 3 with a = 2.
    - Set 3b + 3 equal to it.
    solution: 'Step 1: left value 7. Step 2: 3b + 3 = 7, b = 4/3.'
    mistakes:
      '2': c12m5_lim
      7/3: c12m5_lim
  - prompt: How many points of discontinuity does [x] have in the interval (0, 4)?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - '[x] jumps at integers.'
    - List the integers strictly between 0 and 4.
    solution: 'Step 1: 1, 2, 3. Step 2: 3 points.'
    mistakes:
      '4': c12m5_lim
      '5': c12m5_lim
  - prompt: f(x) = (x² − 9)/(x² − 5x + 6) is undefined at how many real points?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Find where the denominator is zero.
    - Factor x² − 5x + 6.
    solution: 'Step 1: (x − 2)(x − 3) = 0. Step 2: x = 2 and 3: 2 points.'
    mistakes:
      '1': c12m5_lim
      '0': c12m5_lim
  - prompt: f(x) = |x| + |x − 1| is not differentiable at how many points?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - Each |…| has a corner where it is zero.
    - Find where x = 0 and x − 1 = 0.
    solution: 'Step 1: corners at x = 0 and x = 1. Step 2: 2 points.'
    mistakes:
      '1': c12m5_lim
      '0': c12m5_lim
  - prompt: f(x) = x² sin(1/x) for x ≠ 0 and f(0) = 0. What is lim(x→0) f(x)?
    answer: '0'
    check: '0'
    difficulty: 3
    hints:
    - sin(1/x) stays between −1 and 1.
    - So |f(x)| ≤ x².
    solution: 'Step 1: −x² ≤ f(x) ≤ x². Step 2: both sides go to 0, so the limit is 0 = f(0).'
    mistakes:
      '1': c12m5_lim
      '-1': c12m5_lim
  - prompt: 'Assertion (A): f(x) = |x − 2| is differentiable at x = 2.

      Reason (R): f(x) = |x − 2| is continuous at x = 2.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'R is true: both one-sided limits and f(2) are 0. A is false: the left slope is −1 and the right slope is +1, so there is a corner at 2.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A courier charges ₹50 for any parcel up to 2 kg and ₹(20w + k) for a parcel of w kg above 2 kg. For the charge to have no sudden jump at 2 kg, what must k be?'
    options:
    - '10'
    - '50'
    - '30'
    answer: '10'
    hints:
    - No jump means the two rules give the same charge at w = 2.
    - Set 20 × 2 + k equal to 50.
    solution: Continuity at 2 kg needs 20 × 2 + k = 50, so 40 + k = 50 and k = 10.
    mistakes:
      '50': c12m5_lim
      '30': c12m5_lim
    exam: case
    difficulty: 2
  - prompt: Which of these functions is continuous at x = 0 but not differentiable there?
    options:
    - '|x| + 2'
    - x² + 2
    - 1/x
    answer: '|x| + 2'
    hints:
    - First rule out a function that is not even defined at 0.
    - Of the other two, which graph has a corner at 0?
    solution: '1/x is not defined at 0. x² + 2 is smooth with slope 0 there. |x| + 2 is |x| moved up by 2: no break, but a sharp corner at 0.'
    mistakes:
      x² + 2: pq12m5_corner
      1/x: m12_one_over_x
    exam: competency
    difficulty: 2
- code: cbse12m.cont.derivatives
  title: Differentiation rules
  after:
  - cbse12m.cont.continuity
  notes: |
    Chain rule: d/dx f(g(x)) = f′(g(x))·g′(x). Derivatives: d(sin x) = cos x; d(cos x) = −sin x; d(tan x) = sec²x; d(eˣ) = eˣ;
    d(ln x) = 1/x; d(sin⁻¹x) = 1/√(1 − x²); d(tan⁻¹x) = 1/(1 + x²). Implicit differentiation. Logarithmic differentiation
    (for xˣ, products). Parametric: dy/dx = (dy/dt)/(dx/dt). Second-order derivatives.
  explanations:
    text: 'Differentiation finds how fast a function changes. The chain rule handles functions inside functions: differentiate the outside, then multiply by the derivative of the inside. There are standard results for sin, cos, eˣ and ln x.'
    visual: 'Think of y = sin(3x) as an outer box (sin) with 3x inside. Derivative: cos(3x) for the box, times 3 for the inside: 3cos(3x).'
    step_by_step: 'Step 1: Spot the outer and inner functions. Step 2: Differentiate the outer, keeping the inner. Step 3: Multiply by the derivative of the inner. Step 4: Simplify.'
    real_world: Car speedometers show the derivative of distance with respect to time.
  picture:
    kind: flow
    steps:
    - y = f(g(x))
    - 'Differentiate outer: f′(g(x))'
    - 'Differentiate inner: g′(x)'
    - Multiply
    alt: 'The chain rule: differentiate the outer function, then multiply by the derivative of the inner.'
  activity:
    type: sort
    prompt: Find the derivative of each function. Use the chain rule where one function sits inside another.
    bins:
    - cos x
    - −sin x
    - eˣ
    - 1/x
    - 2x
    items:
    - label: sin x
      bin: cos x
      clue: Which function's slope does the sine curve have?
      why: d/dx sin x = cos x.
    - label: sin x + 10
      bin: cos x
      clue: What is the derivative of a constant?
      why: The 10 disappears; sin x gives cos x.
    - label: cos x
      bin: −sin x
      clue: Does cos x go up or down just after 0?
      why: d/dx cos x = −sin x.
    - label: cos(−x)
      bin: −sin x
      clue: 'Chain rule: differentiate the outside, then times d/dx(−x).'
      why: '−sin(−x) × (−1) = sin(−x) = −sin x. (Or: cos(−x) = cos x.)'
    - label: eˣ
      bin: eˣ
      clue: Which function is its own slope?
      why: d/dx eˣ = eˣ.
    - label: eˣ + 4
      bin: eˣ
      clue: What happens to the + 4?
      why: 'Constants vanish: eˣ stays.'
    - label: ln x
      bin: 1/x
      clue: Which function's slope is the reciprocal of x?
      why: d/dx ln x = 1/x.
    - label: ln(5x)
      bin: 1/x
      clue: 'Chain rule: (1/(5x)) × 5. Or split: ln 5 + ln x.'
      why: '5/(5x) = 1/x: ln 5 is just a constant.'
    - label: ½ ln(x²)
      bin: 1/x
      clue: 'Simplify first: ln(x²) = ? ln x.'
      why: ½ × 2 ln x = ln x, whose derivative is 1/x (for x > 0).
    - label: x²
      bin: 2x
      clue: 'Power rule: bring the power down, lower it by one.'
      why: d/dx x² = 2x.
    - label: x² + 7
      bin: 2x
      clue: Does the 7 change the slope?
      why: The 7 vanishes.
  lesson:
    - teach: 'Chain rule: for y = f(g(x)), dy/dx = f′(g(x)) × g′(x). Differentiate the outside, keep the inside, multiply by the inside''s derivative. Example: y = (3x + 2)⁴ gives 4(3x + 2)³ × 3.'
      picture:
        kind: flow
        steps:
        - Spot outside and inside
        - Differentiate outside
        - Keep inside unchanged
        - Multiply by inside's derivative
        alt: Steps of the chain rule.
      check:
        prompt: y = (x² + 1)³. Find dy/dx at x = 1.
        options:
        - '24'
        - '12'
        - '6'
        answer: '24'
        why: 3(x² + 1)² × 2x = 3 × 4 × 2 = 24.
      ways:
      - style: step_by_step
        teach: 'Differentiate y = sin(x²). Step 1: The outside is sin, the inside is x². Step 2: Differentiate the outside and keep the inside: cos(x²). Step 3: Multiply by the inside''s derivative, 2x. Step 4: dy/dx = 2x cos(x²).'
      - style: real_world
        teach: Gears show the chain rule. If gear A turns 3 times for each turn of gear B, and B turns 2 times for each turn of gear C, then A turns 3 × 2 = 6 times for each turn of C. Rates of linked changes multiply.
    - teach: 'Standard derivatives: sin x → cos x; cos x → −sin x; tan x → sec²x; eˣ → eˣ; ln x → 1/x; sin⁻¹x → 1/√(1 − x²); tan⁻¹x → 1/(1 + x²). Combine them with the chain rule.'
      check:
        prompt: y = e^(2x). dy/dx at x = 0?
        options:
        - '2'
        - '1'
        - '0'
        answer: '2'
        why: dy/dx = 2e^(2x); at 0 it is 2.
      ways:
      - style: visual
        teach: The standard derivatives side by side, to learn as pairs.
        picture:
          kind: compare
          columns:
          - title: Function
            points:
            - sin x
            - cos x
            - tan x
            - eˣ
            - ln x
          - title: Derivative
            points:
            - cos x
            - −sin x
            - sec²x
            - eˣ
            - 1/x
          alt: sin x gives cos x; cos x gives minus sin x; tan x gives sec squared x; e to the x gives e to the x; ln x gives 1 over x.
      - style: step_by_step
        teach: 'Differentiate y = e^(sin x). Step 1: The outside is eᵘ, whose derivative is itself: e^(sin x). Step 2: The inside is sin x, with derivative cos x. Step 3: Multiply: dy/dx = e^(sin x) cos x. Step 4: At x = 0 this is e⁰ × 1 = 1.'
    - teach: 'Other techniques: implicit differentiation (differentiate both sides, treating y as a function of x), logarithmic differentiation (take ln first, for xˣ or long products), parametric dy/dx = (dy/dt)/(dx/dt), and second derivatives (differentiate twice).'
      check:
        prompt: x = 2t, y = t². Find dy/dx at t = 3.
        options:
        - '3'
        - '6'
        - '2'
        answer: '3'
        why: dy/dt = 2t = 6, dx/dt = 2, so 6/2 = 3.
      ways:
      - style: visual
        teach: Implicit differentiation on the curve xy = 6 at the point (2, 3).
        picture:
          kind: flow
          steps:
          - xy = 6
          - 'Product rule: y + x · dy/dx = 0'
          - dy/dx = −y/x
          - 'At (2, 3): dy/dx = −3/2'
          alt: Start with xy equals 6; differentiate with the product rule to get y plus x dy by dx equals 0; so dy by dx is minus y over x, which is minus 3 over 2 at the point 2, 3.
      - style: real_world
        teach: A drone flies along x = 2t, y = 4t − t², with t in seconds. Its path's slope is dy/dx = (dy/dt)/(dx/dt) = (4 − 2t)/2. At t = 1 the slope is 1, so it is climbing at 45°; at t = 2 the slope is 0, the top of its path.
  items:
  - prompt: If y = x³, find dy/dx at x = 2.
    answer: '12'
    check: diff(x**3, x).subs(x, 2)
    difficulty: 1
    hints:
    - 3x².
    - 3 × 4.
    solution: "dy/dx = 3x² = 3 × 4 = 12."
    mistakes: {"8": "m12_power_rule", "6": "m12_power_rule", "4": "m12_power_rule"}
  - prompt: If y = sin(3x), find dy/dx at x = 0.
    answer: '3'
    check: diff(sin(3*x), x).subs(x, 0)
    difficulty: 1
    hints:
    - 3cos 3x.
    - cos 0 = 1.
    solution: "By the chain rule dy/dx = 3cos(3x) = 3 × cos 0 = 3."
    mistakes:
      '1': c12_chain
  - prompt: If y = (2x + 1)⁵, find dy/dx at x = 0.
    answer: '10'
    check: diff((2*x+1)**5, x).subs(x, 0)
    difficulty: 2
    hints:
    - 5(2x + 1)⁴ × 2.
    - 5 × 1 × 2.
    solution: "Chain rule: dy/dx = 5(2x + 1)⁴ × 2 = 10 × 1⁴ = 10."
    mistakes:
      '5': c12_chain
  - prompt: If y = ln(x²), find dy/dx at x = 1.
    answer: '2'
    check: 2/1
    difficulty: 2
    hints:
    - 2x/x² = 2/x.
    - At x = 1.
    solution: "y = 2 ln x, so dy/dx = 2/x = 2/1 = 2."
    mistakes: {"1": "m12_log_chain", "0": "m12_log_chain"}
  - prompt: If x = t² and y = t³, find dy/dx at t = 2.
    answer: '3'
    check: Rational(3,2)*2
    difficulty: 2
    hints:
    - (3t²)/(2t) = 3t/2.
    - At t = 2.
    solution: "dy/dx = (dy/dt)/(dx/dt) = 3t²/(2t) = 3t/2 = 3 × 2/2 = 3."
    mistakes: {"2": "m12_parametric", "12": "m12_parametric", "2/3": "m12_parametric"}
  - prompt: 'd/dx (tan⁻¹x) equals:'
    options:
    - 1/(1 + x²)
    - 1/√(1 − x²)
    - sec²x
    - −1/(1 + x²)
    answer: 1/(1 + x²)
    difficulty: 2
    hints:
    - Standard result.
    - Never zero denominator.
    solution: "If y = tan⁻¹x then x = tan y, dx/dy = sec²y = 1 + x², so dy/dx = 1/(1 + x²)."
    mistakes: {"1/√(1 − x²)": "m12_tan_inv_deriv", "sec²x": "m12_tan_inv_deriv", "−1/(1 + x²)": "m12_tan_inv_deriv"}
  - prompt: y = x⁴. Find dy/dx at x = 1.
    answer: '4'
    check: 4*1**3
    difficulty: 1
    hints:
    - Bring down the power, reduce it by one.
    - Then put x = 1.
    solution: 'Step 1: 4x³. Step 2: 4.'
    mistakes:
      '1': c12m5_rule
      '3': c12m5_rule
  - prompt: y = cos(2x). Find dy/dx at x = 0.
    answer: '0'
    check: -2*sin(0)
    difficulty: 1
    hints:
    - Derivative of cos is −sin, times the inside's derivative.
    - sin 0 = 0.
    solution: 'Step 1: −2 sin 2x. Step 2: at 0, 0.'
    mistakes:
      '-2': c12m5_chain
      '2': c12m5_chain
  - prompt: y = (3x − 1)⁴. Find dy/dx at x = 1.
    answer: '96'
    check: 4*(3*1 - 1)**3*3
    difficulty: 1
    hints:
    - 'Outside: power 4. Inside: 3x − 1.'
    - Multiply by 3 at the end.
    solution: 'Step 1: 4(3x − 1)³ × 3. Step 2: 4 × 8 × 3 = 96.'
    mistakes:
      '32': c12m5_chain
      '12': c12m5_chain
  - prompt: y = ln(3x). Find dy/dx at x = 2 as a fraction.
    answer: 1/2
    check: 1/2
    difficulty: 2
    hints:
    - ln(3x) = ln 3 + ln x.
    - The constant ln 3 has derivative 0.
    solution: 'Step 1: dy/dx = 1/x. Step 2: at 2, 1/2.'
    mistakes:
      3/2: c12m5_chain
      1/6: c12m5_chain
  - prompt: y = sin⁻¹x. Find dy/dx at x = 0.
    answer: '1'
    check: 1/sqrt(1 - 0**2)
    difficulty: 2
    hints:
    - Use 1/√(1 − x²).
    - Put x = 0.
    solution: 'Step 1: 1/√1. Step 2: 1.'
    mistakes:
      '0': c12m5_rule
      '-1': c12m5_rule
  - prompt: x² + y² = 25. Find dy/dx at the point (3, 4) as a fraction.
    answer: -3/4
    check: -3/4
    difficulty: 2
    hints:
    - 'Differentiate both sides: 2x + 2y dy/dx = 0.'
    - Solve for dy/dx = −x/y.
    solution: 'Step 1: dy/dx = −x/y. Step 2: −3/4.'
    mistakes:
      3/4: c12m5_rule
      -4/3: c12m5_rule
  - prompt: y = x³. Find d²y/dx² at x = 2.
    answer: '12'
    check: 6*2
    difficulty: 2
    hints:
    - Differentiate twice.
    - First 3x², then again.
    solution: 'Step 1: y″ = 6x. Step 2: 12.'
    mistakes:
      '24': c12m5_rule
      '8': c12m5_rule
  - prompt: x = t³, y = t². Find dy/dx at t = 2 as a fraction.
    answer: 1/3
    check: (2*2)/(3*2**2)
    difficulty: 3
    hints:
    - Find dy/dt and dx/dt.
    - Divide, then put t = 2.
    solution: 'Step 1: dy/dt = 2t = 4, dx/dt = 3t² = 12. Step 2: 4/12 = 1/3.'
    mistakes:
      '3': c12m5_param
      4/3: c12m5_param
  - prompt: y = xˣ. Find dy/dx at x = 1.
    answer: '1'
    check: 1**1*(log(1) + 1)
    difficulty: 3
    hints:
    - 'Take ln: ln y = x ln x.'
    - 'Differentiate: (1/y) dy/dx = ln x + 1.'
    solution: 'Step 1: dy/dx = xˣ(ln x + 1). Step 2: at 1, 1 × (0 + 1) = 1.'
    mistakes:
      '0': c12m5_rule
      '2': c12m5_rule
  - prompt: 'Assertion (A): d/dx (sin 2x) = cos 2x.

      Reason (R): By the chain rule, the derivative of sin(g(x)) is cos(g(x)) × g′(x).'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'R is the chain rule, so it is true. Using it, d/dx (sin 2x) = cos 2x × 2 = 2 cos 2x, so A is false: it misses the factor 2.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A balloon''s height after t minutes is h(t) = t³ − 3t² + 5t metres. How fast, in metres per minute, is it rising at t = 2?'
    options:
    - '5'
    - '6'
    - '2'
    answer: '5'
    hints:
    - Rate of rising is h′(t).
    - h′(t) = 3t² − 6t + 5.
    solution: h′(t) = 3t² − 6t + 5, so h′(2) = 12 − 12 + 5 = 5 m per minute. (The height itself at t = 2 is 6 m.)
    mistakes:
      '6': pq12m5_how_fast
      '2': c12m5_rule
    exam: case
    difficulty: 2
  - prompt: A student differentiates y = cos(x²) and writes dy/dx = −sin(x²). What is wrong?
    options:
    - The factor 2x from the inside is missing
    - The minus sign should not be there
    - Nothing; it is correct
    answer: The factor 2x from the inside is missing
    hints:
    - cos(x²) is a function of a function.
    - What does the chain rule multiply by at the end?
    solution: 'The derivative of cos u is −sin u, so the sign is right, but u = x² needs its derivative 2x: dy/dx = −2x sin(x²).'
    mistakes:
      The minus sign should not be there: c12m5_rule
      Nothing; it is correct: c12m5_chain
    exam: competency
    difficulty: 2
