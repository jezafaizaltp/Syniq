# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse12-math
chapter: 7
title: Integrals
tips:
  c12_constant: An indefinite integral always needs + C, because every constant differentiates to zero.
  c12_limits: 'Definite integral: find the antiderivative F, then F(upper) − F(lower). No + C needed.'
  m12_definite: "Find the antiderivative, then F(upper) − F(lower)."
  m12_even_function: "An even function is mirror-symmetric about the y-axis. Compare the left half with the right half."
  m12_ilate: "ILATE: Inverse, Log, Algebraic, Trig, Exponential. Pick u from the earlier letter."
  m12_int_cos: "Differentiate each option. Which one gives cos x back?"
  m12_int_reciprocal: "The power rule fails for x⁻¹ (it would divide by zero). Which function has derivative 1/x?"
  m12_integrate_power: "∫xⁿ dx = xⁿ⁺¹/(n + 1). Then evaluate at 2."
  m12_odd_function: "x³ is odd: the area on the left cancels the area on the right."
  c12m7_power: For xⁿ, raise the power by one and divide by the new power. Check by differentiating your answer.
  c12m7_sub: Look for an inside function whose derivative is also present; substitute t for it.
  c12m7_eval: 'Find the antiderivative first, then subtract: F(upper) − F(lower).'
  c12m7_prop: 'Check symmetry first: an odd function over [−a, a] gives 0; an even one gives twice the half.'
  pq12m7_check_back: Differentiate each option. Which one gives back exactly the function inside the integral?
  pq12m7_area_vs_net: Over a full wave, the parts above and below the axis may cancel. Does the question ask for net change?
concepts:
- code: cbse12m.int.indefinite
  title: Indefinite integrals and methods
  notes: |
    Integration as the inverse of differentiation: ∫f(x)dx = F(x) + C where F′ = f. Standard forms: ∫xⁿ dx = xⁿ⁺¹/(n + 1)
    (n ≠ −1); ∫1/x dx = ln|x|; ∫eˣ = eˣ; ∫sin x = −cos x; ∫cos x = sin x; ∫sec²x = tan x. Methods: substitution, partial
    fractions, by parts ∫u v dx = u∫v − ∫(u′∫v) (ILATE order), special integrals like ∫dx/(x² + a²) = (1/a)tan⁻¹(x/a).
  explanations:
    text: Integration undoes differentiation. If the derivative of F is f, then the integral of f is F plus any constant C. Standard results and methods like substitution and integration by parts handle harder cases.
    visual: 'Check ∫2x dx = x² + C by differentiating back: d/dx(x² + C) = 2x. Integration is the reverse journey.'
    step_by_step: 'Step 1: Look for a standard form. Step 2: If there''s a function and its derivative, substitute. Step 3: For a product, try by parts. Step 4: Add + C and check by differentiating.'
    real_world: Engineers integrate a rate of flow to get the total amount of water through a pipe.
  picture:
    kind: compare
    columns:
    - title: Function
      points:
      - xⁿ
      - 1/x
      - eˣ
      - cos x
    - title: Integral
      points:
      - xⁿ⁺¹/(n + 1) + C
      - ln|x| + C
      - eˣ + C
      - sin x + C
    alt: 'Standard integrals: powers, 1/x, eˣ and cos x.'
  activity:
    type: sort
    prompt: 'Integrate each one. Then check: differentiating your answer must give back what''s inside the integral.'
    bins:
    - x³/3 + C
    - −cos x + C
    - sin x + C
    - ln|x| + C
    - eˣ + C
    items:
    - label: ∫ x² dx
      bin: x³/3 + C
      clue: 'Power rule: raise the power by 1, divide by the new power.'
      why: 'x³/3; check: d/dx(x³/3) = x².'
    - label: ∫ x · x dx
      bin: x³/3 + C
      clue: 'Multiply first: x · x = ?'
      why: x · x = x², so it's x³/3.
    - label: ∫ sin x dx
      bin: −cos x + C
      clue: Which function differentiates to sin x? Mind the sign.
      why: d/dx(−cos x) = sin x. A common slip is to write +cos x.
    - label: ∫ cos x dx
      bin: sin x + C
      clue: Which function differentiates to cos x?
      why: d/dx sin x = cos x.
    - label: ∫ sin(π/2 − x) dx
      bin: sin x + C
      clue: 'Simplify first: sin(π/2 − x) = ?'
      why: sin(π/2 − x) = cos x, which integrates to sin x.
    - label: ∫ 1/x dx
      bin: ln|x| + C
      clue: Which function has derivative 1/x?
      why: ln|x|.
    - label: ∫ x⁻¹ dx
      bin: ln|x| + C
      clue: The power rule gives x⁰/0. Does that work?
      why: 'n = −1 is the one exception to the power rule: the answer is ln|x|.'
    - label: ∫ eˣ dx
      bin: eˣ + C
      clue: Which function is its own derivative?
      why: eˣ.
    - label: ∫ (eˣ · eˣ) ÷ eˣ dx
      bin: eˣ + C
      clue: 'Simplify first: eˣ · eˣ ÷ eˣ = ?'
      why: It simplifies to eˣ.
  lesson:
    - teach: 'Integration reverses differentiation. If F′(x) = f(x), then ∫f(x)dx = F(x) + C. The + C is there because constants differentiate to 0. Standard forms: ∫xⁿdx = xⁿ⁺¹/(n + 1) (n ≠ −1), ∫1/x dx = ln|x|, ∫eˣdx = eˣ, ∫cos x dx = sin x, ∫sin x dx = −cos x, ∫sec²x dx = tan x.'
      check:
        prompt: '∫x⁴ dx equals:'
        options:
        - x⁵/5 + C
        - 4x³ + C
        - x⁵ + C
        answer: x⁵/5 + C
        why: Raise the power to 5 and divide by 5.
      ways:
      - style: visual
        teach: Differentiation and integration undo each other, shown as a there-and-back pair.
        picture:
          kind: compare
          columns:
          - title: Differentiate
            points:
            - x⁵ → 5x⁴
            - sin x → cos x
            - eˣ → eˣ
            - ln x → 1/x
          - title: Integrate back
            points:
            - 5x⁴ → x⁵ + C
            - cos x → sin x + C
            - eˣ → eˣ + C
            - 1/x → ln|x| + C
          alt: Differentiating x to the 5 gives 5x to the 4, sin x gives cos x, e to the x gives itself, ln x gives 1 over x. Integrating each result gives back the original function plus C.
      - style: step_by_step
        teach: 'Find ∫(5x⁴ − 2x + 7)dx. Step 1: Integrate term by term. Step 2: 5x⁴ → 5 × x⁵/5 = x⁵. Step 3: −2x → −2 × x²/2 = −x², and 7 → 7x. Step 4: Answer: x⁵ − x² + 7x + C. Check by differentiating: 5x⁴ − 2x + 7.'
    - teach: 'Substitution: if the integrand contains g(x) and g′(x), put t = g(x), dt = g′(x)dx. Example: ∫2x(x² + 1)³dx, with t = x² + 1, becomes ∫t³dt = t⁴/4 + C = (x² + 1)⁴/4 + C.'
      picture:
        kind: flow
        steps:
        - Spot inside g(x)
        - Put t = g(x)
        - Replace dx using dt = g′(x)dx
        - Integrate in t
        - Put g(x) back
        alt: Steps for integration by substitution.
      check:
        prompt: For ∫cos(3x)dx, what is a good substitution?
        options:
        - t = 3x
        - t = cos x
        - t = x³
        answer: t = 3x
        why: dt = 3dx, giving (1/3)∫cos t dt = (1/3)sin 3x + C.
      ways:
      - style: step_by_step
        teach: 'Find ∫cos x · e^(sin x) dx. Step 1: The inside function sin x has derivative cos x, which is present. Step 2: Put t = sin x, dt = cos x dx. Step 3: The integral becomes ∫eᵗ dt = eᵗ + C. Step 4: Put back t: e^(sin x) + C.'
      - style: real_world
        teach: Substitution is like renaming a long street name to 'the road' while giving directions, then putting the full name back at the end. Calling x² + 1 just t makes the integral short; you rewrite it in x only when you finish.
    - teach: 'By parts: ∫u v dx = u∫v dx − ∫(u′ ∫v dx)dx. Choose u by ILATE (Inverse trig, Log, Algebraic, Trig, Exponential). Partial fractions split rational functions, and special forms like ∫dx/(x² + a²) = (1/a)tan⁻¹(x/a) + C.'
      check:
        prompt: 'For ∫x ln x dx by parts, u should be:'
        options:
        - ln x
        - x
        - x ln x
        answer: ln x
        why: In ILATE, L (log) comes before A (algebraic).
      ways:
      - style: visual
        teach: ILATE decides which factor to call u in integration by parts.
        picture:
          kind: flow
          steps:
          - 'I: inverse trig (tan⁻¹x)'
          - 'L: log (ln x)'
          - 'A: algebraic (x, x²)'
          - 'T: trig (sin x, cos x)'
          - 'E: exponential (eˣ)'
          alt: 'ILATE order: inverse trigonometric, then logarithmic, then algebraic, then trigonometric, then exponential. The factor earlier in the list is chosen as u.'
      - style: step_by_step
        teach: 'Find ∫x cos x dx by parts. Step 1: ILATE: x is algebraic, cos x is trig, so u = x. Step 2: ∫cos x dx = sin x. Step 3: ∫x cos x dx = x sin x − ∫1 × sin x dx. Step 4: = x sin x + cos x + C.'
  items:
  - prompt: If F(x) = ∫3x² dx with F(0) = 0, find F(2).
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - F = x³.
    - 2³.
    solution: "F(x) = x³ + C, and F(0) = 0 gives C = 0, so F(2) = 2³ = 8."
    mistakes: {"12": "m12_integrate_power", "6": "m12_integrate_power", "24": "m12_integrate_power"}
  - prompt: If F(x) = ∫(2x + 3) dx with F(0) = 0, find F(1).
    answer: '4'
    check: 1+3
    difficulty: 1
    hints:
    - x² + 3x.
    - 1 + 3.
    solution: "F(x) = x² + 3x + C with C = 0, so F(1) = 1 + 3 = 4."
    mistakes: {"5": "m12_integrate_power", "2": "m12_integrate_power", "3": "m12_integrate_power"}
  - prompt: '∫cos x dx equals:'
    options:
    - sin x + C
    - −sin x + C
    - cos x + C
    - tan x + C
    answer: sin x + C
    difficulty: 1
    hints:
    - Derivative of sin is cos.
    - Reverse.
    solution: "d/dx(sin x) = cos x, so ∫cos x dx = sin x + C."
    mistakes: {"−sin x + C": "m12_int_cos", "cos x + C": "m12_int_cos", "tan x + C": "m12_int_cos"}
  - prompt: '∫(1/x) dx equals:'
    options:
    - ln|x| + C
    - x⁰/0
    - 1/x² + C
    - eˣ + C
    answer: ln|x| + C
    difficulty: 1
    hints:
    - Special case n = −1.
    - Logarithm.
    solution: "d/dx(ln|x|) = 1/x for x ≠ 0, so ∫(1/x) dx = ln|x| + C. (The power rule fails for n = −1.)"
    mistakes: {"x⁰/0": "m12_int_reciprocal", "1/x² + C": "m12_int_reciprocal", "eˣ + C": "m12_int_reciprocal"}
  - prompt: 'For ∫x eˣ dx by parts (ILATE), u should be:'
    options:
    - x
    - eˣ
    - x eˣ
    - '1'
    answer: x
    difficulty: 2
    hints:
    - Algebraic before exponential.
    - Differentiates to 1.
    solution: "ILATE puts Algebraic (x) before Exponential (eˣ), so u = x. Then du = dx, which makes the new integral simpler."
    mistakes: {"eˣ": "m12_ilate", "x eˣ": "m12_ilate", "1": "m12_ilate"}
  - prompt: Why do indefinite integrals include + C?
    options:
    - "Constants differentiate to zero, so many functions share a derivative"
    - "C makes the answer longer, which examiners expect to see in working"
    - "C always equals 1, so adding it gives the correct final value"
    - "Adding C is optional and changes nothing about the answer"
    answer: Constants differentiate to zero, so many functions share a derivative
    difficulty: 2
    hints:
    - x² + 5 and x² − 2.
    - Same derivative.
    solution: Because adding any constant gives the same derivative.
    mistakes:
      "Adding C is optional and changes nothing about the answer": c12_constant
  - prompt: F(x) = ∫4x³ dx with F(0) = 0. Find F(2).
    answer: '16'
    check: 2**4
    difficulty: 1
    hints:
    - Raise the power by one, divide by the new power.
    - Then put x = 2.
    solution: 'Step 1: F(x) = x⁴. Step 2: F(2) = 16.'
    mistakes:
      '32': c12m7_power
      '24': c12m7_power
  - prompt: F(x) = ∫(6x² − 2) dx with F(0) = 0. Find F(1).
    answer: '0'
    check: 2*1**3 - 2*1
    difficulty: 1
    hints:
    - Integrate each term.
    - ∫6x² = 2x³, ∫2 = 2x.
    solution: 'Step 1: F(x) = 2x³ − 2x. Step 2: F(1) = 0.'
    mistakes:
      '4': c12m7_power
      '10': c12m7_power
  - prompt: '∫sec²x dx equals:'
    options:
    - tan x + C
    - sec x + C
    - −tan x + C
    answer: tan x + C
    difficulty: 1
    hints:
    - Which function has derivative sec²x?
    - Think of differentiation tables.
    solution: 'Step 1: d(tan x)/dx = sec²x. Step 2: tan x + C.'
    mistakes:
      sec x + C: c12m7_power
      −tan x + C: c12m7_power
  - prompt: F(x) = ∫eˣ dx with F(0) = 1. Find F(0) + F′(0).
    answer: '2'
    check: 1 + 1
    difficulty: 2
    hints:
    - F(x) = eˣ + C; use F(0) = 1 to find C.
    - F′(x) is the integrand.
    solution: 'Step 1: F(x) = eˣ, C = 0. Step 2: F(0) + F′(0) = 1 + 1 = 2.'
    mistakes:
      '1': c12m7_power
      '0': c12m7_power
  - prompt: F(x) = ∫2x(x² + 1)³ dx with F(0) = 1/4. Find F(1).
    answer: '4'
    check: (1**2 + 1)**4/4
    difficulty: 2
    hints:
    - Substitute t = x² + 1.
    - The antiderivative is (x² + 1)⁴/4.
    solution: 'Step 1: F(x) = (x² + 1)⁴/4 (C = 0). Step 2: F(1) = 16/4 = 4.'
    mistakes:
      '16': c12m7_sub
      '2': c12m7_sub
  - prompt: '∫dx/(x² + 9) equals:'
    options:
    - (1/3)tan⁻¹(x/3) + C
    - tan⁻¹(x/3) + C
    - (1/9)tan⁻¹x + C
    answer: (1/3)tan⁻¹(x/3) + C
    difficulty: 2
    hints:
    - Use the form ∫dx/(x² + a²).
    - Here a = 3.
    solution: 'Step 1: (1/a)tan⁻¹(x/a). Step 2: a = 3.'
    mistakes:
      tan⁻¹(x/3) + C: c12m7_sub
      (1/9)tan⁻¹x + C: c12m7_sub
  - prompt: '∫x eˣ dx equals:'
    options:
    - eˣ(x − 1) + C
    - x eˣ + C
    - eˣ(x + 1) + C
    answer: eˣ(x − 1) + C
    difficulty: 2
    hints:
    - Use by parts with u = x.
    - x eˣ − ∫eˣ dx.
    solution: 'Step 1: x eˣ − eˣ. Step 2: eˣ(x − 1) + C.'
    mistakes:
      x eˣ + C: c12m7_sub
      eˣ(x + 1) + C: c12m7_sub
  - prompt: 1/((x − 1)(x + 1)) = A/(x − 1) + B/(x + 1). Find A as a fraction.
    answer: 1/2
    check: 1/(1 + 1)
    difficulty: 3
    hints:
    - 'Multiply out: 1 = A(x + 1) + B(x − 1).'
    - Put x = 1.
    solution: 'Step 1: x = 1 gives 1 = 2A. Step 2: A = 1/2.'
    mistakes:
      '1': c12m7_sub
      -1/2: c12m7_sub
  - prompt: F(x) = ∫sin(2x) dx with F(0) = −1/2. Find F(π/2).
    answer: 1/2
    check: -cos(pi)/2
    difficulty: 3
    hints:
    - Substitute t = 2x.
    - F(x) = −cos(2x)/2.
    solution: 'Step 1: F(x) = −cos 2x / 2 (C = 0 since F(0) = −1/2). Step 2: F(π/2) = −cos π / 2 = 1/2.'
    mistakes:
      -1/2: c12m7_sub
      '1': c12m7_sub
  - prompt: 'Assertion (A): ∫(1/x)dx = x⁰/0 + C.

      Reason (R): ∫xⁿdx = xⁿ⁺¹/(n + 1) + C for every real n.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Can you divide by 0?
    - Does the power rule have an exception?
    solution: Both are false. The power rule needs n ≠ −1, so R is false, and A divides by 0, so A is false too; the correct integral is ln|x| + C.
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A tank fills at a rate of r(t) = 6t + 2 litres per minute, and it is empty at t = 0. Integrating the rate, how many litres are in the tank after 3 minutes?'
    options:
    - '33'
    - '20'
    - '29'
    answer: '33'
    hints:
    - Volume V(t) = ∫(6t + 2)dt = 3t² + 2t + C.
    - Empty at t = 0 means C = 0.
    solution: V(t) = 3t² + 2t, so V(3) = 27 + 6 = 33 litres.
    mistakes:
      '20': c12m7_power
      '29': c12m7_power
    exam: case
    difficulty: 2
  - prompt: A student claims ∫2x e^(x²) dx = e^(x²) + C. How can you test the claim most quickly?
    options:
    - Differentiate e^(x²) + C and see if you get 2x e^(x²)
    - Integrate 2x and e^(x²) separately and multiply
    - Substitute x = 0 into both sides
    answer: Differentiate e^(x²) + C and see if you get 2x e^(x²)
    hints:
    - Integration and differentiation undo each other.
    - Which test works for every x, not just one value?
    solution: By the chain rule, d/dx e^(x²) = 2x e^(x²), so the claim is right. Integrating factors separately is not a valid rule, and one value of x cannot prove an identity.
    mistakes:
      Integrate 2x and e^(x²) separately and multiply: pq12m7_check_back
      Substitute x = 0 into both sides: pq12m7_check_back
    exam: competency
    difficulty: 2
- code: cbse12m.int.definite
  title: Definite integrals
  after:
  - cbse12m.int.indefinite
  notes: |
    Definite integral ∫ₐᵇ f(x)dx = F(b) − F(a) (fundamental theorem of calculus). Area interpretation. Properties: ∫ₐᵇ =
    −∫ᵦₐ; ∫ₐᵇ f(x)dx = ∫ₐᵇ f(a + b − x)dx; ∫₋ₐᵃ f = 2∫₀ᵃ f for even f, 0 for odd f; ∫₀²ᵃ f splitting. (Limit of sum method
    removed in rationalised syllabus.)
  explanations:
    text: 'A definite integral gives a number: the antiderivative at the top limit minus at the bottom. It measures the net area under a curve. Symmetry properties can make some integrals very quick.'
    visual: 'Shade the area under y = x from 0 to 2: a triangle with base 2 and height 2, area 2. The integral of x from 0 to 2 is x²/2 = 2. Same answer.'
    step_by_step: 'Step 1: Find the antiderivative F. Step 2: Compute F(b). Step 3: Compute F(a). Step 4: Subtract.'
    real_world: Physicists integrate velocity over a time interval to find the distance travelled.
  picture:
    kind: flow
    steps:
    - Find antiderivative F(x)
    - Evaluate F(upper)
    - Evaluate F(lower)
    - Subtract
    alt: 'Evaluating a definite integral: F(upper) minus F(lower).'
  activity:
    type: formula
    prompt: '∫ₐᵇ x dx = (b² − a²)/2: area above the x-axis counts +, below it counts −. The geometric area counts both as +.'
    inputs:
    - name: a
      label: Lower limit a
      min: -4
      max: 4
      step: 1
      start: 0
    - name: b
      label: Upper limit b
      min: -4
      max: 4
      step: 1
      start: 1
    outputs:
    - name: val
      label: ∫ₐᵇ x dx
      expr: (b^2-a^2)/2
      places: 1
    - name: area
      label: Area between y = x and the axis
      expr: abs(b*abs(b)-a*abs(a))/2
      places: 1
    - name: w
      label: b − a
      expr: b-a
    goals:
    - prompt: Make ∫ₐᵇ x dx = 0 with b greater than a.
      want:
        val: 0
        w:
        - 1
        - 8
      mistakes:
      - when:
          w:
          - 1
          - 8
          val:
          - 0.5
          - 8
        say: 'Still positive: more of the line is above the axis. Let a go negative so the part below cancels it.'
      - when:
          w:
          - 1
          - 8
          val:
          - -8
          - -0.5
        say: 'Now the part below the axis wins. Balance them: a = −b.'
    - prompt: Keep a = −2. Make the AREA between y = x and the axis equal 4.
      want:
        a: -2
        area: 4
      mistakes:
      - when:
          a: -2
          b: 0
        say: 'From −2 to 0 the area is only 2: one triangle. Keep going past 0.'
      - when:
          a: -2
          b: 4
        say: From −2 to 4 the area is 2 + 8 = 10. Stop sooner.
    - prompt: Make ∫ₐᵇ x dx = −4 with b BELOW a.
      want:
        val: -4
        w:
        - -8
        - -1
      mistakes:
      - when:
          val: 4
        say: '+4: going from a to b backwards flips the sign: ∫ₐᵇ = −∫ᵇₐ.'
      - when:
          val: -4
          w:
          - 1
          - 8
        say: That's −4, but with b above a. Here, put b below a.
  lesson:
    - teach: 'The fundamental theorem: ∫ₐᵇ f(x)dx = F(b) − F(a), where F is any antiderivative (the + C cancels). For f ≥ 0, this is the area under the curve between x = a and x = b.'
      check:
        prompt: Evaluate ∫₀³ 2x dx.
        options:
        - '9'
        - '6'
        - '3'
        answer: '9'
        why: F(x) = x², so 9 − 0 = 9.
      ways:
      - style: visual
        teach: The area under y = x + 2 from x = 0 to x = 2, as a trapezium you can check by geometry.
        picture:
          kind: flow
          steps:
          - Antiderivative F(x) = x²/2 + 2x
          - F(2) = 2 + 4 = 6
          - F(0) = 0
          - ∫₀² (x + 2)dx = 6
          - 'Trapezium: ½ × (2 + 4) × 2 = 6'
          alt: F of x is x squared over 2 plus 2x; F of 2 is 6 and F of 0 is 0, so the integral is 6, the same as the trapezium area one half times 2 plus 4 times 2.
      - style: real_world
        teach: If a car's speed is v(t), then ∫ₐᵇ v(t)dt is the distance covered from time a to time b. A speedometer gives the rate; the definite integral adds up all the little pieces of distance.
    - teach: 'Properties: ∫ₐᵇ f = −∫ᵦₐ f; ∫ₐᵇ f(x)dx = ∫ₐᵇ f(a + b − x)dx; you can split at any point c. These often turn a hard integral into an easy one.'
      check:
        prompt: If ∫₀² f = 5, what is ∫₂⁰ f?
        options:
        - '-5'
        - '5'
        - '0'
        answer: '-5'
        why: Swapping the limits changes the sign.
      ways:
      - style: visual
        teach: 'The reflection property: ∫ₐᵇ f(x)dx = ∫ₐᵇ f(a + b − x)dx, used to avoid expanding a power.'
        picture:
          kind: flow
          steps:
          - I = ∫₀¹ x(1 − x)⁴ dx
          - 'Replace x by 1 − x: I = ∫₀¹ (1 − x)x⁴ dx'
          - = ∫₀¹ (x⁴ − x⁵) dx
          - = 1/5 − 1/6 = 1/30
          alt: I is the integral from 0 to 1 of x times 1 minus x to the 4. Replacing x with 1 minus x gives the integral of 1 minus x times x to the 4, which is x to the 4 minus x to the 5, giving 1 over 5 minus 1 over 6, which is 1 over 30.
      - style: step_by_step
        teach: 'Split at a point. Evaluate ∫₀³ |x − 1| dx. Step 1: |x − 1| changes form at x = 1. Step 2: ∫₀¹ (1 − x)dx = 1 − ½ = ½. Step 3: ∫₁³ (x − 1)dx = [x²/2 − x]₁³ = (4.5 − 3) − (0.5 − 1) = 2. Step 4: Total = ½ + 2 = 2.5.'
    - teach: 'Symmetry: on [−a, a], an odd function (f(−x) = −f(x), like x³ or sin x) integrates to 0; an even function (f(−x) = f(x), like x² or cos x) gives 2∫₀ᵃ f.'
      picture:
        kind: compare
        columns:
        - title: Odd f
          points:
          - f(−x) = −f(x)
          - x³, sin x
          - ∫₋ₐᵃ f = 0
        - title: Even f
          points:
          - f(−x) = f(x)
          - x², cos x
          - ∫₋ₐᵃ f = 2∫₀ᵃ f
        alt: Odd and even functions and their integrals over a symmetric interval.
      check:
        prompt: Evaluate ∫₋₁¹ sin x dx.
        options:
        - '0'
        - '2'
        - 2 sin 1
        answer: '0'
        why: sin x is odd, so the two halves cancel.
      ways:
      - style: step_by_step
        teach: 'Evaluate ∫₋₁¹ (x³ + 3x²)dx. Step 1: x³ is odd, so ∫₋₁¹ x³ dx = 0. Step 2: 3x² is even, so ∫₋₁¹ 3x² dx = 2∫₀¹ 3x² dx. Step 3: 2 × [x³]₀¹ = 2. Step 4: Total = 0 + 2 = 2.'
      - style: real_world
        teach: 'Think of a seesaw balanced at the centre: an odd function puts equal weight up on one side and down on the other, so the total is 0. An even function is a mirror image, so one side is exactly half the total.'
  items:
  - prompt: Evaluate ∫₀² x dx.
    answer: '2'
    check: Rational(2**2,2)
    difficulty: 1
    hints:
    - x²/2.
    - 4/2 − 0.
    solution: "[x²/2]₀² = 4/2 − 0 = 2."
    mistakes: {"4": "m12_definite", "1": "m12_definite"}
  - prompt: Evaluate ∫₁³ 2x dx.
    answer: '8'
    check: 3**2-1**2
    difficulty: 1
    hints:
    - x².
    - 9 − 1.
    solution: "[x²]₁³ = 9 − 1 = 8."
    mistakes:
      '9': c12_limits
  - prompt: Evaluate ∫₀¹ 3x² dx.
    answer: '1'
    check: 1**3-0
    difficulty: 1
    hints:
    - x³.
    - 1 − 0.
    solution: "[x³]₀¹ = 1 − 0 = 1."
    mistakes: {"3": "m12_definite", "6": "m12_definite"}
  - prompt: Evaluate ∫₋₂² x³ dx.
    answer: '0'
    check: Rational(2**4,4)-Rational((-2)**4,4)
    difficulty: 2
    hints:
    - Odd function.
    - Symmetric limits.
    solution: "x³ is odd, so the area below the axis on [−2, 0] cancels the area above on [0, 2]: [x⁴/4]₋₂² = 4 − 4 = 0."
    mistakes: {"8": "m12_odd_function", "16": "m12_odd_function", "4": "m12_odd_function"}
  - prompt: Evaluate ∫₀^π sin x dx.
    answer: '2'
    check: -(-1)+1
    difficulty: 2
    hints:
    - −cos x.
    - −(−1) − (−1).
    solution: "[−cos x]₀^π = −cos π + cos 0 = 1 + 1 = 2."
    mistakes: {"0": "m12_definite", "1": "m12_definite", "-2": "m12_definite"}
  - prompt: 'For an even function f, ∫₋ₐᵃ f(x)dx equals:'
    options:
    - 2∫₀ᵃ f(x)dx
    - '0'
    - ∫₀ᵃ f(x)dx
    - −∫₀ᵃ f(x)dx
    answer: 2∫₀ᵃ f(x)dx
    difficulty: 2
    hints:
    - Symmetric about y-axis.
    - Two equal halves.
    solution: "An even function is symmetric about the y-axis, so the area on [−a, 0] equals the area on [0, a]: 2∫₀ᵃ f(x)dx."
    mistakes: {"0": "m12_even_function", "∫₀ᵃ f(x)dx": "m12_even_function", "−∫₀ᵃ f(x)dx": "m12_even_function"}
  - prompt: Evaluate ∫₁² 3x² dx.
    answer: '7'
    check: 2**3 - 1**3
    difficulty: 1
    hints:
    - Antiderivative of 3x² is x³.
    - Upper minus lower.
    solution: 'Step 1: 8 − 1. Step 2: 7.'
    mistakes:
      '8': c12m7_eval
      '9': c12m7_eval
  - prompt: Evaluate ∫₀⁴ (x + 1) dx.
    answer: '12'
    check: 4**2/2 + 4
    difficulty: 1
    hints:
    - 'Antiderivative: x²/2 + x.'
    - Put in 4, subtract value at 0.
    solution: 'Step 1: 8 + 4. Step 2: 12.'
    mistakes:
      '20': c12m7_eval
      '5': c12m7_eval
  - prompt: Evaluate ∫₀^(π/2) cos x dx.
    answer: '1'
    check: sin(pi/2) - sin(0)
    difficulty: 1
    hints:
    - ∫cos x = sin x.
    - sin(π/2) − sin 0.
    solution: 'Step 1: 1 − 0. Step 2: 1.'
    mistakes:
      '0': c12m7_eval
      '-1': c12m7_eval
  - prompt: Evaluate ∫₁^e (1/x) dx.
    answer: '1'
    check: log(E) - log(1)
    difficulty: 2
    hints:
    - ∫1/x = ln x.
    - ln e = 1, ln 1 = 0.
    solution: 'Step 1: ln e − ln 1. Step 2: 1.'
    mistakes:
      '0': c12m7_eval
      '-1': c12m7_eval
  - prompt: Evaluate ∫₋₃³ x⁵ dx.
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - Is x⁵ odd or even?
    - Symmetric limits.
    solution: 'Step 1: x⁵ is odd. Step 2: the integral is 0.'
    mistakes:
      '243': c12m7_prop
      '486': c12m7_prop
  - prompt: Evaluate ∫₋₂² x² dx as a fraction.
    answer: 16/3
    check: 2*(2**3)/3
    difficulty: 2
    hints:
    - x² is even.
    - Double ∫₀² x² dx.
    solution: 'Step 1: ∫₀² x² = 8/3. Step 2: 2 × 8/3 = 16/3.'
    mistakes:
      '0': c12m7_prop
      8/3: c12m7_prop
  - prompt: Evaluate ∫₀¹ eˣ dx. Give the answer in terms of e.
    options:
    - e − 1
    - e
    - '1'
    answer: e − 1
    difficulty: 2
    hints:
    - ∫eˣ = eˣ.
    - Remember e⁰ = 1.
    solution: 'Step 1: e¹ − e⁰. Step 2: e − 1.'
    mistakes:
      e: c12m7_eval
      '1': c12m7_eval
  - prompt: Evaluate ∫₀^(π/2) sin²x dx + ∫₀^(π/2) cos²x dx, as a multiple of π.
    answer: 1/2
    check: Rational(1,2)
    difficulty: 3
    hints:
    - Add the integrands first.
    - sin²x + cos²x = 1.
    solution: 'Step 1: ∫₀^(π/2) 1 dx = π/2. Step 2: (1/2)π.'
    mistakes:
      '1': c12m7_prop
      1/4: c12m7_prop
  - prompt: Using ∫ₐᵇ f(x)dx = ∫ₐᵇ f(a + b − x)dx, ∫₀^(π/2) sin x/(sin x + cos x) dx equals what multiple of π?
    answer: 1/4
    check: Rational(1,4)
    difficulty: 3
    hints:
    - Replace x by π/2 − x to get cos x/(cos x + sin x).
    - 'Add the two forms: 2I = ∫₀^(π/2) 1 dx.'
    solution: 'Step 1: 2I = π/2. Step 2: I = π/4.'
    mistakes:
      1/2: c12m7_prop
      '1': c12m7_prop
  - prompt: 'Assertion (A): ∫₋π^π sin x dx = 0.

      Reason (R): sin x is an odd function.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: sin(−x) = −sin x, so sin x is odd, and an odd function over [−a, a] integrates to 0. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A cyclist''s speed is v(t) = 3t² metres per second for the first 4 seconds after starting. How many metres does the cyclist cover in those 4 seconds?'
    options:
    - '64'
    - '48'
    - '16'
    answer: '64'
    hints:
    - Distance = ∫₀⁴ v(t)dt.
    - ∫3t² dt = t³.
    solution: Distance = ∫₀⁴ 3t² dt = [t³]₀⁴ = 64 − 0 = 64 m.
    mistakes:
      '48': c12m7_eval
      '16': c12m7_eval
    exam: case
    difficulty: 2
  - prompt: An alternating current gives I(t) = sin t. A student computes ∫₀^(2π) sin t dt to find the total charge that has flowed forwards, and gets 0. What is the best explanation?
    options:
    - The forward and backward flows cancel, so the net charge is 0
    - The student made an arithmetic slip; the answer is 2
    - Sine cannot be integrated over 2π
    answer: The forward and backward flows cancel, so the net charge is 0
    hints:
    - Where is sin t positive, and where negative, on [0, 2π]?
    - A definite integral counts parts below the axis as negative.
    solution: '∫₀^(2π) sin t dt = [−cos t]₀^(2π) = −1 + 1 = 0. The positive half (0 to π) and negative half (π to 2π) cancel: the net charge is 0, though charge did flow both ways.'
    mistakes:
      The student made an arithmetic slip; the answer is 2: pq12m7_area_vs_net
      Sine cannot be integrated over 2π: c12m7_eval
    exam: competency
    difficulty: 2
