# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse12-math
chapter: 7
title: Integrals
tips:
  c12_constant: An indefinite integral always needs + C, because every constant differentiates to zero.
  c12_limits: 'Definite integral: find the antiderivative F, then F(upper) − F(lower). No + C needed.'
concepts:
- code: cbse12m.int.indefinite
  title: Indefinite integrals and methods
  notes: |
    Integration as the inverse of differentiation: ∫f(x)dx = F(x) + C where F′ = f. Standard forms: ∫xⁿ dx = xⁿ⁺¹/(n + 1)
    (n ≠ −1); ∫1/x dx = ln|x|; ∫eˣ = eˣ; ∫sin x = −cos x; ∫cos x = sin x; ∫sec²x = tan x. Methods: substitution, partial
    fractions, by parts ∫u v dx = u∫v − ∫(u′∫v) (ILATE order), special integrals like ∫dx/(x² + a²) = (1/a)tan⁻¹(x/a).
  explanations:
    text: Integration undoes differentiation. If the derivative of F is f, then the integral of f is F plus any constant C. Standard results and methods like substitution and integration by parts handle harder cases.
    visual: 'Check ∫2x dx = x² + C by differentiating back: d/dx(x² + C) = 2x. Integration is the reverse journey.'
    step_by_step: 'Step 1: Look for a standard form. Step 2: If there''s a function and its derivative, substitute. Step 3: For a product, try by parts. Step 4: Add + C and check by differentiating.'
    real_world: Engineers integrate a rate of flow to get the total amount of water through a pipe.
  picture:
    kind: compare
    columns:
    - title: Function
      points:
      - xⁿ
      - 1/x
      - eˣ
      - cos x
    - title: Integral
      points:
      - xⁿ⁺¹/(n + 1) + C
      - ln|x| + C
      - eˣ + C
      - sin x + C
    alt: 'Standard integrals: powers, 1/x, eˣ and cos x.'
  activity:
    type: sort
    prompt: 'Integrate each one. Then check: differentiating your answer must give back what''s inside the integral.'
    bins:
    - x³/3 + C
    - −cos x + C
    - sin x + C
    - ln|x| + C
    - eˣ + C
    items:
    - label: ∫ x² dx
      bin: x³/3 + C
      clue: 'Power rule: raise the power by 1, divide by the new power.'
      why: 'x³/3; check: d/dx(x³/3) = x².'
    - label: ∫ x · x dx
      bin: x³/3 + C
      clue: 'Multiply first: x · x = ?'
      why: x · x = x², so it's x³/3.
    - label: ∫ sin x dx
      bin: −cos x + C
      clue: Which function differentiates to sin x? Mind the sign.
      why: d/dx(−cos x) = sin x. A common slip is to write +cos x.
    - label: ∫ cos x dx
      bin: sin x + C
      clue: Which function differentiates to cos x?
      why: d/dx sin x = cos x.
    - label: ∫ sin(π/2 − x) dx
      bin: sin x + C
      clue: 'Simplify first: sin(π/2 − x) = ?'
      why: sin(π/2 − x) = cos x, which integrates to sin x.
    - label: ∫ 1/x dx
      bin: ln|x| + C
      clue: Which function has derivative 1/x?
      why: ln|x|.
    - label: ∫ x⁻¹ dx
      bin: ln|x| + C
      clue: The power rule gives x⁰/0. Does that work?
      why: 'n = −1 is the one exception to the power rule: the answer is ln|x|.'
    - label: ∫ eˣ dx
      bin: eˣ + C
      clue: Which function is its own derivative?
      why: eˣ.
    - label: ∫ (eˣ · eˣ) ÷ eˣ dx
      bin: eˣ + C
      clue: 'Simplify first: eˣ · eˣ ÷ eˣ = ?'
      why: It simplifies to eˣ.
  items:
  - prompt: If F(x) = ∫3x² dx with F(0) = 0, find F(2).
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - F = x³.
    - 2³.
    solution: '8.'
  - prompt: If F(x) = ∫(2x + 3) dx with F(0) = 0, find F(1).
    answer: '4'
    check: 1+3
    difficulty: 1
    hints:
    - x² + 3x.
    - 1 + 3.
    solution: '4.'
  - prompt: '∫cos x dx equals:'
    options:
    - sin x + C
    - −sin x + C
    - cos x + C
    - tan x + C
    answer: sin x + C
    difficulty: 1
    hints:
    - Derivative of sin is cos.
    - Reverse.
    solution: sin x + C.
  - prompt: '∫(1/x) dx equals:'
    options:
    - ln|x| + C
    - x⁰/0
    - 1/x² + C
    - eˣ + C
    answer: ln|x| + C
    difficulty: 1
    hints:
    - Special case n = −1.
    - Logarithm.
    solution: ln|x| + C.
  - prompt: 'For ∫x eˣ dx by parts (ILATE), u should be:'
    options:
    - x
    - eˣ
    - x eˣ
    - '1'
    answer: x
    difficulty: 2
    hints:
    - Algebraic before exponential.
    - Differentiates to 1.
    solution: u = x.
  - prompt: Why do indefinite integrals include + C?
    options:
    - Constants differentiate to zero, so many functions share a derivative
    - To make answers longer
    - Because C is always 1
    - It is optional
    answer: Constants differentiate to zero, so many functions share a derivative
    difficulty: 2
    hints:
    - x² + 5 and x² − 2.
    - Same derivative.
    solution: Because adding any constant gives the same derivative.
    mistakes:
      It is optional: c12_constant
- code: cbse12m.int.definite
  title: Definite integrals
  after:
  - cbse12m.int.indefinite
  notes: |
    Definite integral ∫ₐᵇ f(x)dx = F(b) − F(a) (fundamental theorem of calculus). Area interpretation. Properties: ∫ₐᵇ =
    −∫ᵦₐ; ∫ₐᵇ f(x)dx = ∫ₐᵇ f(a + b − x)dx; ∫₋ₐᵃ f = 2∫₀ᵃ f for even f, 0 for odd f; ∫₀²ᵃ f splitting. (Limit of sum method
    removed in rationalised syllabus.)
  explanations:
    text: 'A definite integral gives a number: the antiderivative at the top limit minus at the bottom. It measures the net area under a curve. Symmetry properties can make some integrals very quick.'
    visual: 'Shade the area under y = x from 0 to 2: a triangle with base 2 and height 2, area 2. The integral of x from 0 to 2 is x²/2 = 2. Same answer.'
    step_by_step: 'Step 1: Find the antiderivative F. Step 2: Compute F(b). Step 3: Compute F(a). Step 4: Subtract.'
    real_world: Physicists integrate velocity over a time interval to find the distance travelled.
  picture:
    kind: flow
    steps:
    - Find antiderivative F(x)
    - Evaluate F(upper)
    - Evaluate F(lower)
    - Subtract
    alt: 'Evaluating a definite integral: F(upper) minus F(lower).'
  activity:
    type: formula
    prompt: '∫ₐᵇ x dx = (b² − a²)/2: area above the x-axis counts +, below it counts −. The geometric area counts both as +.'
    inputs:
    - name: a
      label: Lower limit a
      min: -4
      max: 4
      step: 1
      start: 0
    - name: b
      label: Upper limit b
      min: -4
      max: 4
      step: 1
      start: 1
    outputs:
    - name: val
      label: ∫ₐᵇ x dx
      expr: (b^2-a^2)/2
      places: 1
    - name: area
      label: Area between y = x and the axis
      expr: abs(b*abs(b)-a*abs(a))/2
      places: 1
    - name: w
      label: b − a
      expr: b-a
    goals:
    - prompt: Make ∫ₐᵇ x dx = 0 with b greater than a.
      want:
        val: 0
        w:
        - 1
        - 8
      mistakes:
      - when:
          w:
          - 1
          - 8
          val:
          - 0.5
          - 8
        say: 'Still positive: more of the line is above the axis. Let a go negative so the part below cancels it.'
      - when:
          w:
          - 1
          - 8
          val:
          - -8
          - -0.5
        say: 'Now the part below the axis wins. Balance them: a = −b.'
    - prompt: Keep a = −2. Make the AREA between y = x and the axis equal 4.
      want:
        a: -2
        area: 4
      mistakes:
      - when:
          a: -2
          b: 0
        say: 'From −2 to 0 the area is only 2: one triangle. Keep going past 0.'
      - when:
          a: -2
          b: 4
        say: From −2 to 4 the area is 2 + 8 = 10. Stop sooner.
    - prompt: Make ∫ₐᵇ x dx = −4 with b BELOW a.
      want:
        val: -4
        w:
        - -8
        - -1
      mistakes:
      - when:
          val: 4
        say: '+4: going from a to b backwards flips the sign: ∫ₐᵇ = −∫ᵇₐ.'
      - when:
          val: -4
          w:
          - 1
          - 8
        say: That's −4, but with b above a. Here, put b below a.
  items:
  - prompt: Evaluate ∫₀² x dx.
    answer: '2'
    check: Rational(2**2,2)
    difficulty: 1
    hints:
    - x²/2.
    - 4/2 − 0.
    solution: '2.'
  - prompt: Evaluate ∫₁³ 2x dx.
    answer: '8'
    check: 3**2-1**2
    difficulty: 1
    hints:
    - x².
    - 9 − 1.
    solution: '8.'
    mistakes:
      '9': c12_limits
  - prompt: Evaluate ∫₀¹ 3x² dx.
    answer: '1'
    check: 1**3-0
    difficulty: 1
    hints:
    - x³.
    - 1 − 0.
    solution: '1.'
  - prompt: Evaluate ∫₋₂² x³ dx.
    answer: '0'
    check: Rational(2**4,4)-Rational((-2)**4,4)
    difficulty: 2
    hints:
    - Odd function.
    - Symmetric limits.
    solution: '0.'
  - prompt: Evaluate ∫₀^π sin x dx.
    answer: '2'
    check: -(-1)+1
    difficulty: 2
    hints:
    - −cos x.
    - −(−1) − (−1).
    solution: '2.'
  - prompt: 'For an even function f, ∫₋ₐᵃ f(x)dx equals:'
    options:
    - 2∫₀ᵃ f(x)dx
    - '0'
    - ∫₀ᵃ f(x)dx
    - −∫₀ᵃ f(x)dx
    answer: 2∫₀ᵃ f(x)dx
    difficulty: 2
    hints:
    - Symmetric about y-axis.
    - Two equal halves.
    solution: 2∫₀ᵃ f(x)dx.
