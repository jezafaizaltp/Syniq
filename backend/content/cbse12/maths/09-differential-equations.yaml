# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse12-math
chapter: 9
title: Differential Equations
tips:
  c12_de_order: Order = the highest derivative present. Degree = the power of that highest derivative (when the equation is a polynomial in derivatives).
  c12_if: For dy/dx + Py = Q, the integrating factor is e^(∫P dx).
  m12_constants: "An nth-order equation has n arbitrary constants."
  m12_de_integrate: "Integrate both sides to get y plus a constant C. Use the starting value to find C, then substitute."
  m12_degree_de: "Degree = power of the highest-order derivative."
  m12_degree_undefined: "Degree is defined only when the equation is a polynomial in the derivatives. Is sin(y′) a polynomial?"
  m12_exp_growth: "The rate is proportional to the amount itself, and k > 0. Think of compound interest."
  m12_homogeneous: "Homogeneous equations depend on the ratio y/x. Make that ratio the new variable."
  m12_if: "IF = e^(∫P dx) with P = 1/x, and e^(ln x) = x."
  m12_order_de: "Order = highest derivative present. The power on dy/dx doesn't matter."
  m12_particular: "A general solution has constants; giving them values makes it specific."
concepts:
- code: cbse12m.de.basics
  title: Order, degree and solutions
  notes: |
    Differential equation: involves derivatives of a dependent variable. Order: highest derivative; degree: power of the
    highest derivative when polynomial in derivatives (undefined otherwise, e.g. containing sin(y′)). General solution
    (arbitrary constants = order) and particular solution (constants fixed by initial conditions). Verifying a solution by
    substitution. (Forming DEs removed in rationalised syllabus.)
  explanations:
    text: A differential equation links a function with its derivatives. Its order is the highest derivative that appears, and its degree is the power of that derivative. Solving it means finding the function; a general solution has constants, a particular solution fixes them.
    visual: For d²y/dx² + 3(dy/dx)³ = 0, the highest derivative is the second one (order 2), and it appears to the first power (degree 1).
    step_by_step: 'Step 1: Find the highest derivative (order). Step 2: Find its power (degree). Step 3: To verify a solution, substitute it in.'
    real_world: Population growth, cooling of tea and radioactive decay are all described by differential equations.
  picture:
    kind: compare
    columns:
    - title: Equation
      points:
      - dy/dx = 2x
      - y″ + y = 0
      - (y″)³ + y′ = 0
    - title: Order
      points:
      - '1'
      - '2'
      - '2'
    - title: Degree
      points:
      - '1'
      - '1'
      - '3'
    alt: Examples of differential equations with their order and degree.
  activity:
    type: sort
    prompt: Order = the highest derivative. Degree = its power, once the equation is a polynomial in derivatives.
    bins:
    - Order 1, degree 1
    - Order 2, degree 1
    - Order 1, degree 2
    - Degree not defined
    items:
    - label: dy/dx + y = eˣ
      bin: Order 1, degree 1
      clue: Highest derivative? Its power?
      why: Only dy/dx, to the power 1.
    - label: x dy/dx = y
      bin: Order 1, degree 1
      clue: Is there any second derivative?
      why: First derivative only, power 1.
    - label: d²y/dx² + y = 0
      bin: Order 2, degree 1
      clue: What is the highest derivative?
      why: d²y/dx² is the highest, to the power 1.
    - label: d²y/dx² + (dy/dx)³ = 0
      bin: Order 2, degree 1
      clue: 'Degree comes from which derivative: the highest, or the one with the biggest power?'
      why: The cube is on dy/dx, but the highest derivative is d²y/dx², power 1.
    - label: (dy/dx)² + y = x
      bin: Order 1, degree 2
      clue: What power is the highest derivative raised to?
      why: 'dy/dx squared: order 1, degree 2.'
    - label: (dy/dx)² = 1 + x²
      bin: Order 1, degree 2
      clue: Highest derivative and its power?
      why: Order 1, degree 2.
    - label: sin(dy/dx) + y = 0
      bin: Degree not defined
      clue: Is it a polynomial in dy/dx?
      why: 'dy/dx sits inside sin, so it isn''t a polynomial: no degree.'
    - label: y″ + sin(y′) = 0
      bin: Degree not defined
      clue: Is every derivative only raised to whole powers?
      why: 'y′ is inside sin: not a polynomial, so the degree is not defined.'
    - label: e^(dy/dx) = x
      bin: Degree not defined
      clue: Is dy/dx in a power or an exponent?
      why: 'dy/dx is in an exponent: no degree.'
  items:
  - prompt: Find the order of d²y/dx² + 3(dy/dx)³ = 0.
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Highest derivative.
    - Second.
    solution: '2.'
    mistakes: {"3": "m12_order_de", "1": "m12_order_de"}
  - prompt: Find the degree of d²y/dx² + 3(dy/dx)³ = 0.
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - Power of the highest derivative.
    - y″ to power 1.
    solution: '1.'
    mistakes:
      '3': c12_de_order
  - prompt: Find the degree of (d²y/dx²)³ + dy/dx = 0.
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - y″ cubed.
    - Power 3.
    solution: '3.'
    mistakes: {"2": "m12_degree_de", "1": "m12_degree_de"}
  - prompt: How many arbitrary constants does the general solution of a 2nd-order equation have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Equals the order.
    - Two.
    solution: '2.'
    mistakes: {"1": "m12_constants", "0": "m12_constants"}
  - prompt: 'The degree of y′ + sin(y′) = 0 is:'
    options:
    - not defined
    - '1'
    - '0'
    - '2'
    answer: not defined
    difficulty: 2
    hints:
    - Not a polynomial in y′.
    - sin(y′).
    solution: Not defined.
    mistakes: {"1": "m12_degree_undefined", "0": "m12_degree_undefined", "2": "m12_degree_undefined"}
  - prompt: 'A solution with no arbitrary constants is called:'
    options:
    - a particular solution
    - a general solution
    - an order
    - a degree
    answer: a particular solution
    difficulty: 1
    hints:
    - Constants fixed.
    - Initial condition.
    solution: A particular solution.
    mistakes: {"a general solution": "m12_particular", "an order": "m12_particular", "a degree": "m12_particular"}
- code: cbse12m.de.solve
  title: Separable, homogeneous and linear equations
  after:
  - cbse12m.de.basics
  notes: |
    Variables separable: g(y)dy = f(x)dx; integrate both sides. Homogeneous: dy/dx = F(y/x), substitute y = vx. Linear first
    order: dy/dx + Py = Q; integrating factor IF = e^(∫P dx); solution y·IF = ∫Q·IF dx + C. Applications: growth/decay dy/dt =
    ky gives y = y₀e^(kt).
  explanations:
    text: Some differential equations can be solved by separating the variables, putting all y terms on one side and x terms on the other, then integrating. Linear equations of the form dy/dx + Py = Q use an integrating factor.
    visual: 'For dy/dx = 2x: separate to dy = 2x dx, integrate to y = x² + C. With y(0) = 1, C = 1, so y = x² + 1.'
    step_by_step: 'Step 1: Identify the type. Step 2: Separable: rearrange and integrate. Step 3: Linear: find IF = e^(∫P dx), then y·IF = ∫Q·IF dx. Step 4: Use the initial condition.'
    real_world: Bank interest compounded continuously follows dy/dt = ky, giving exponential growth.
  picture:
    kind: flow
    steps:
    - Write dy/dx + Py = Q
    - IF = e^(∫P dx)
    - Multiply through by IF
    - y·IF = ∫Q·IF dx + C
    alt: Solving a linear first-order differential equation with an integrating factor.
  activity:
    type: formula
    prompt: 'dN/dt = kN is separable; its solution is exponential. With a doubling time d: N = N₀ × 2^(t/d). A decay with half-life d: N₀ × 2^(−t/d).'
    inputs:
    - name: n0
      label: Start amount N₀
      min: 10
      max: 100
      step: 10
      start: 10
    - name: d
      label: Doubling time or half-life d
      min: 0.5
      max: 10
      step: 0.5
      start: 0.5
      unit: h
    - name: t
      label: Time t
      min: 0
      max: 40
      step: 1
      start: 0
      unit: h
    outputs:
    - name: n
      label: 'If doubling: N'
      expr: n0*2^(t/d)
      places: 1
    - name: half
      label: 'If halving: N'
      expr: n0*2^(-t/d)
      places: 2
    goals:
    - prompt: 100 bacteria become 800 in 6 hours. Set the doubling time.
      want:
        n0: 100
        t: 6
        n: 800
      mistakes:
      - when:
          n0: 100
          t: 6
          d: 3
        say: 'd = 3 gives two doublings: 400. 800 is 8 = 2³ times 100: three doublings in 6 hours.'
      - when:
          n0: 100
          t: 6
          d:
          - 0.5
          - 1.5
        say: 'Too fast: the colony shoots past 800.'
    - prompt: Doubling time 3 h. How long until 50 grow to 400?
      want:
        n0: 50
        d: 3
        n: 400
      mistakes:
      - when:
          n0: 50
          d: 3
          t: 24
        say: 'That''s 8 × 3 hours. 400 is 50 × 8 = 2³: three doublings, not eight.'
    - prompt: A substance has a half-life of 5 years (read h as years). How long until 80 g falls to 10 g?
      want:
        n0: 80
        d: 5
        half: 10
      mistakes:
      - when:
          n0: 80
          d: 5
          t: 10
        say: Two half-lives leave 20 g. One more halves it again.
      - when:
          n0: 80
          d: 5
          t: 35
        say: '80 − 10 = 70, but decay isn''t subtraction: it halves every 5 years. 80 → 40 → 20 → 10.'
  items:
  - prompt: Solve dy/dx = 2x with y(0) = 1. Find y(2).
    answer: '5'
    check: 2**2+1
    difficulty: 1
    hints:
    - y = x² + C.
    - C = 1.
    solution: '5.'
    mistakes: {"4": "m12_de_integrate", "3": "m12_de_integrate"}
  - prompt: Solve dy/dx = 3x² with y(0) = 0. Find y(1).
    answer: '1'
    check: 1**3
    difficulty: 1
    hints:
    - y = x³ + C.
    - C = 0.
    solution: '1.'
    mistakes: {"3": "m12_de_integrate", "0": "m12_de_integrate"}
  - prompt: 'The integrating factor of dy/dx + y = x is:'
    options:
    - eˣ
    - e⁻ˣ
    - x
    - ln x
    answer: eˣ
    difficulty: 2
    hints:
    - P = 1.
    - e^(∫1 dx).
    solution: eˣ.
    mistakes:
      x: c12_if
  - prompt: 'The integrating factor of dy/dx + (1/x)y = x² (x > 0) is:'
    options:
    - x
    - 1/x
    - eˣ
    - ln x
    answer: x
    difficulty: 2
    hints:
    - e^(ln x).
    - = x.
    solution: x.
    mistakes: {"1/x": "m12_if", "eˣ": "m12_if", "ln x": "m12_if"}
  - prompt: 'To solve a homogeneous equation dy/dx = F(y/x), substitute:'
    options:
    - y = vx
    - y = x + v
    - x = y²
    - y = eˣ
    answer: y = vx
    difficulty: 2
    hints:
    - Ratio y/x.
    - v = y/x.
    solution: y = vx.
    mistakes: {"y = x + v": "m12_homogeneous", "x = y²": "m12_homogeneous", "y = eˣ": "m12_homogeneous"}
  - prompt: 'dy/dt = ky with k > 0 describes:'
    options:
    - exponential growth
    - linear growth
    - decay
    - oscillation
    answer: exponential growth
    difficulty: 1
    hints:
    - Rate ∝ amount.
    - y = y₀e^(kt).
    solution: Exponential growth.
    mistakes: {"linear growth": "m12_exp_growth", "decay": "m12_exp_growth", "oscillation": "m12_exp_growth"}
