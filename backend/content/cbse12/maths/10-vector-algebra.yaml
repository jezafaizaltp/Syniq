    difficulty: 2
    hints:
    - a·b = |a||b| cos θ.
    - cos 60° = 1/2.
    solution: 'Step 1: 6 × 1/2. Step 2: 3.'
    mistakes:
      '6': c12m10_dot
      9/2: c12m10_dot
  - prompt: Find the area of the parallelogram with sides i + j and i − j.
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Compute (i + j) × (i − j).
    - i × (−j) = −k, j × i = −k.
    solution: 'Step 1: −k − k = −2k. Step 2: |−2k| = 2.'
    mistakes:
      '0': c12m10_cross
      '1': c12m10_cross
  - prompt: Find the area of the triangle with sides a = 2i + 2j and b = 3j.
    answer: '3'
    check: Rational(1,2)*6
    difficulty: 3
    hints:
    - a × b = (2i + 2j) × 3j.
    - 2i × 3j = 6k, 2j × 3j = 0.
    solution: 'Step 1: |a × b| = 6. Step 2: half is 3.'
    mistakes:
      '6': c12m10_cross
      '12': c12m10_cross
  - prompt: '|a| = 3, |b| = 4, a·b = 6. Find |a × b|² .'
    answer: '108'
    check: 3**2*4**2 - 6**2
    difficulty: 3
    hints:
    - '|a × b|² + (a·b)² = |a|²|b|².'
    - 144 − 36.
    solution: 'Step 1: 9 × 16 − 36. Step 2: 108.'
    mistakes:
      '144': c12m10_cross
      '36': c12m10_cross
  - prompt: 'Assertion (A): a × b = b × a for all vectors a and b.

      Reason (R): a · b = b · a for all vectors a and b.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'R is true: the dot product does not depend on order. A is false: a × b = −(b × a), so swapping the order flips the direction.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A force F = 2i + 3j + k newtons pushes a crate through a displacement d = 4i + j + 2k metres. How much work, in joules, does the force do?'
    options:
    - '13'
    - '24'
    - '9'
    answer: '13'
    hints:
    - Work = F · d.
    - Multiply matching components and add.
    solution: W = 2 × 4 + 3 × 1 + 1 × 2 = 8 + 3 + 2 = 13 J.
    mistakes:
      '24': c12m10_dot
      '9': c12m10_dot
    exam: case
    difficulty: 2
  - prompt: A plot is a parallelogram whose sides from one corner are a = 4i + 2j and b = i + 3j (in metres). What is its area in m²?
    options:
    - '10'
    - '14'
    - '5'
    answer: '10'
    hints:
    - Area = |a × b|.
    - For vectors in the xy-plane, a × b = (a₁b₂ − a₂b₁)k.
    solution: a × b = (4 × 3 − 2 × 1)k = 10k, so the area is 10 m².
    mistakes:
      '14': c12m10_cross
      '5': c12m10_cross
    exam: competency
    difficulty: 2
