# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse12-math
chapter: 10
title: Vector Algebra
tips:
  c12_dot: a · b = |a||b|cos θ gives a number; a × b gives a vector of size |a||b|sin θ perpendicular to both.
  c12_mag: Magnitude of xi + yj + zk is √(x² + y² + z²).
  m12_cross_area: "Area of parallelogram = |a × b|. Here the sides are perpendicular."
  m12_dir_cos: "l, m, n are cosines of the angles with the axes. They come from a unit vector."
  m12_dot: "Dot product: multiply matching components and add."
  m12_ijk: "Go round i → j → k: forward gives the next one with a plus sign."
  m12_unit_vector: "'Unit' means one."
  m12_vec_add: "Add matching components: j-part of a + j-part of b."
  m12_vec_mag: "|v| = √(x² + y²)."
concepts:
- code: cbse12m.vec.basics
  title: Vectors and their addition
  notes: |
    Vector: magnitude and direction; position vector; zero, unit, coinitial, collinear, equal, negative vectors. Components:
    r = xi + yj + zk, |r| = √(x² + y² + z²); direction cosines l, m, n with l² + m² + n² = 1. Addition: triangle and
    parallelogram laws; commutative and associative. Scalar multiplication; unit vector â = a/|a|. Section formula:
    (mb + na)/(m + n). Vector joining two points: B − A.
  explanations:
    text: A vector has both size and direction, like a displacement or a force. In 3D we write it with components along i, j and k. Vectors add head to tail, and their size comes from Pythagoras.
    visual: 'Draw arrow a, then from its tip draw arrow b. The arrow from the start of a to the end of b is a + b: the triangle law.'
    step_by_step: 'Step 1: Write vectors in i, j, k form. Step 2: Add or subtract component by component. Step 3: Magnitude = √(sum of squares). Step 4: Unit vector = vector ÷ magnitude.'
    real_world: Pilots add the plane's velocity vector and the wind's vector to find the real path over the ground.
  picture:
    kind: flow
    steps:
    - Draw a
    - From a's tip draw b
    - Join start of a to tip of b
    - That arrow is a + b
    alt: The triangle law of vector addition.
  activity:
    type: formula
    prompt: r = xi + yj + zk has magnitude |r| = √(x² + y² + z²). Its direction cosines are l = x/|r|, m = y/|r|.
    inputs:
    - name: x
      label: x
      min: -6
      max: 6
      step: 1
      start: 0
    - name: y
      label: y
      min: -6
      max: 6
      step: 1
      start: 0
    - name: z
      label: z
      min: -6
      max: 6
      step: 1
      start: 0
    outputs:
    - name: mag
      label: '|r|'
      expr: sqrt(x^2+y^2+z^2)
      places: 2
    - name: s
      label: x + y + z
      expr: x+y+z
    - name: l
      label: l = cos α (with x-axis)
      expr: x/max(0.0001,sqrt(x^2+y^2+z^2))
      places: 3
    - name: m
      label: m = cos β (with y-axis)
      expr: y/max(0.0001,sqrt(x^2+y^2+z^2))
      places: 3
    goals:
    - prompt: Make a vector of magnitude 7 with all three components positive.
      want:
        mag: 7
        x:
        - 1
        - 6
        y:
        - 1
        - 6
        z:
        - 1
        - 6
      hint: Which three squares add to 49? Try 2, 3 and 6.
      mistakes:
      - when:
          s: 7
          x:
          - 1
          - 6
          y:
          - 1
          - 6
          z:
          - 1
          - 6
        say: 'The components add to 7, but magnitude isn''t a sum: |r| = √(x² + y² + z²).'
    - prompt: Make a vector in the xy-plane making equal angles with the x- and y-axes, pointing between +x and +y.
      want:
        z: 0
        l:
        - 0.7
        - 0.71
        m:
        - 0.7
        - 0.71
      mistakes:
      - when:
          z: 0
          l: 1
        say: 'That lies along the x-axis: 0° with x and 90° with y. Equal angles need x = y.'
      - when:
          l:
          - 0.7
          - 0.71
          m:
          - 0.7
          - 0.71
          z:
          - -6
          - -1
        say: x = y, but the vector is tilted out of the plane. Keep z = 0.
      - when:
          l:
          - 0.7
          - 0.71
          m:
          - 0.7
          - 0.71
          z:
          - 1
          - 6
        say: x = y, but the vector is tilted out of the plane. Keep z = 0.
    - prompt: Make a vector whose direction cosine with the x-axis is −1.
      want:
        l: -1
      mistakes:
      - when:
          l: 1
        say: '+1 points along +x. cos α = −1 means α = 180°: the negative x-axis.'
  items:
  - prompt: Find the magnitude of 3i + 4j.
    answer: '5'
    check: sqrt(3**2+4**2)
    difficulty: 1
    hints:
    - √(9 + 16).
    - √25.
    solution: '5.'
    mistakes: {"7": "m12_vec_mag", "25": "m12_vec_mag"}
  - prompt: Find the magnitude of 2i + 3j + 6k.
    answer: '7'
    check: sqrt(2**2+3**2+6**2)
    difficulty: 1
    hints:
    - √(4 + 9 + 36).
    - √49.
    solution: '7.'
    mistakes:
      '11': c12_mag
  - prompt: a = 2i + j, b = i + 3j. Find the j-component of a + b.
    answer: '4'
    check: 1+3
    difficulty: 1
    hints:
    - Add j parts.
    - 1 + 3.
    solution: '4.'
    mistakes: {"3": "m12_vec_add", "5": "m12_vec_add"}
  - prompt: A = (1, 2, 3) and B = (4, 6, 3). Find |AB|.
    answer: '5'
    check: sqrt(3**2+4**2+0)
    difficulty: 2
    hints:
    - B − A = (3, 4, 0).
    - √25.
    solution: '5.'
    mistakes: {"13": "m12_vec_mag", "25": "m12_vec_mag", "7": "m12_vec_mag"}
  - prompt: 'A vector of magnitude 1 is called a:'
    options:
    - unit vector
    - zero vector
    - position vector
    - collinear vector
    answer: unit vector
    difficulty: 1
    hints:
    - Size one.
    - â.
    solution: A unit vector.
    mistakes: {"zero vector": "m12_unit_vector", "position vector": "m12_unit_vector", "collinear vector": "m12_unit_vector"}
  - prompt: 'Direction cosines l, m, n always satisfy:'
    options:
    - l² + m² + n² = 1
    - l + m + n = 1
    - lmn = 1
    - l = m = n
    answer: l² + m² + n² = 1
    difficulty: 2
    hints:
    - Cosines of angles with axes.
    - Unit vector components.
    solution: l² + m² + n² = 1.
    mistakes: {"l + m + n = 1": "m12_dir_cos", "lmn = 1": "m12_dir_cos", "l = m = n": "m12_dir_cos"}
- code: cbse12m.vec.products
  title: Dot and cross products
  after:
  - cbse12m.vec.basics
  notes: |
    Scalar (dot) product a·b = |a||b|cos θ = a₁b₁ + a₂b₂ + a₃b₃; a·b = 0 ⇔ perpendicular; projection of a on b = a·b/|b|.
    Vector (cross) product a × b = |a||b| sin θ n̂ (right-hand rule); a × b = −b × a; parallel vectors give 0; |a × b| = area
    of parallelogram; ½|a × b| = area of triangle. i·i = 1, i·j = 0; i × j = k, j × k = i, k × i = j.
  explanations:
    text: The dot product of two vectors is a number that measures how much they point the same way; it's zero if they're perpendicular. The cross product is a new vector at right angles to both, and its size gives the area of the parallelogram they make.
    visual: Picture two arrows from one point. The dot product is big when they point together and zero at 90°. The cross product sticks straight out of the plane they lie in.
    step_by_step: 'Step 1: Dot product: multiply matching components and add. Step 2: Angle: cos θ = a·b/(|a||b|). Step 3: Cross product: use the determinant with i, j, k. Step 4: Area = |a × b|.'
    real_world: In physics, work done = force · displacement (a dot product), and torque = r × F (a cross product).
  picture:
    kind: compare
    columns:
    - title: Product
      points:
      - dot a·b
      - cross a × b
    - title: Result
      points:
      - a number
      - a vector
    - title: Zero when
      points:
      - perpendicular
      - parallel
    alt: 'Dot and cross products compared: what they give and when they are zero.'
  activity:
    type: formula
    prompt: a = i + 2j + 2k is fixed (|a| = 3). Choose b. a·b = b₁ + 2b₂ + 2b₃; the projection of b on a is a·b ÷ |a|.
    inputs:
    - name: x
      label: b₁
      min: -6
      max: 6
      step: 1
      start: 0
    - name: y
      label: b₂
      min: -6
      max: 6
      step: 1
      start: 0
    - name: z
      label: b₃
      min: -6
      max: 6
      step: 1
      start: 0
    outputs:
    - name: dot
      label: a·b
      expr: x+2*y+2*z
    - name: mag
      label: '|b|'
      expr: sqrt(x^2+y^2+z^2)
      places: 2
    - name: proj
      label: Projection of b on a
      expr: (x+2*y+2*z)/3
      places: 2
    goals:
    - prompt: Make b perpendicular to a, with b₁ positive and b₂ negative.
      want:
        dot: 0
        x:
        - 1
        - 6
        y:
        - -6
        - -1
      mistakes:
      - when:
          dot:
          - 1
          - 40
        say: 'a·b > 0: the angle is less than 90°. Perpendicular needs a·b = 0.'
      - when:
          dot:
          - -40
          - -1
        say: 'a·b < 0: the angle is more than 90°. Perpendicular needs a·b = 0.'
    - prompt: Make the projection of b on a equal 3.
      want:
        proj: 3
      mistakes:
      - when:
          dot: 3
        say: 'a·b = 3 gives a projection of only 1: divide a·b by |a| = 3. You need a·b = 9.'
    - prompt: Make b parallel to a and pointing the same way, with |b| = 6.
      want:
        mag: 6
        dot: 18
      mistakes:
      - when:
          x: -2
          y: -4
          z: -4
        say: 'That''s antiparallel: on the same line, but pointing the other way.'
      - when:
          x: 1
          y: 2
          z: 2
        say: That's a itself, with |a| = 3. Double it.
  items:
  - prompt: Find (2i + 3j)·(4i − j).
    answer: '5'
    check: 2*4+3*(-1)
    difficulty: 1
    hints:
    - 2×4 + 3×(−1).
    - 8 − 3.
    solution: '5.'
    mistakes: {"11": "m12_dot", "8": "m12_dot", "-3": "m12_dot"}
  - prompt: Find (i + 2j + 3k)·(3i − 3j + k).
    answer: '0'
    check: 1*3+2*(-3)+3*1
    difficulty: 1
    hints:
    - 3 − 6 + 3.
    - Perpendicular.
    solution: '0.'
    mistakes: {"3": "m12_dot", "6": "m12_dot", "-6": "m12_dot"}
  - prompt: Find the area of the parallelogram with sides a = 3i and b = 4j.
    answer: '12'
    check: 3*4
    difficulty: 2
    hints:
    - '|a × b| = 12|k|.'
    - 3 × 4.
    solution: 12 square units.
    mistakes: {"6": "m12_cross_area", "7": "m12_cross_area"}
  - prompt: Find the area of the triangle with sides a = 3i and b = 4j.
    answer: '6'
    check: Rational(1,2)*12
    difficulty: 2
    hints:
    - ½|a × b|.
    - ½ × 12.
    solution: 6 square units.
    mistakes: {"12": "m12_cross_area", "7": "m12_cross_area"}
  - prompt: 'i × j equals:'
    options:
    - k
    - −k
    - '0'
    - '1'
    answer: k
    difficulty: 1
    hints:
    - Cyclic order i, j, k.
    - Right-hand rule.
    solution: k.
    mistakes: {"−k": "m12_ijk", "0": "m12_ijk", "1": "m12_ijk"}
  - prompt: 'If a·b = 0 for non-zero vectors, they are:'
    options:
    - perpendicular
    - parallel
    - equal
    - opposite
    answer: perpendicular
    difficulty: 1
    hints:
    - cos 90° = 0.
    - Right angle.
    solution: Perpendicular.
    mistakes:
      parallel: c12_dot
