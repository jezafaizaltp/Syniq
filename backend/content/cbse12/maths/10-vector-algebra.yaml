# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse12-math
chapter: 10
title: Vector Algebra
tips:
  c12_dot: a · b = |a||b|cos θ gives a number; a × b gives a vector of size |a||b|sin θ perpendicular to both.
  c12_mag: Magnitude of xi + yj + zk is √(x² + y² + z²).
concepts:
- code: cbse12m.vec.basics
  title: Vectors and their addition
  notes: |
    Vector: magnitude and direction; position vector; zero, unit, coinitial, collinear, equal, negative vectors. Components:
    r = xi + yj + zk, |r| = √(x² + y² + z²); direction cosines l, m, n with l² + m² + n² = 1. Addition: triangle and
    parallelogram laws; commutative and associative. Scalar multiplication; unit vector â = a/|a|. Section formula:
    (mb + na)/(m + n). Vector joining two points: B − A.
  explanations:
    text: A vector has both size and direction, like a displacement or a force. In 3D we write it with components along i, j and k. Vectors add head to tail, and their size comes from Pythagoras.
    visual: 'Draw arrow a, then from its tip draw arrow b. The arrow from the start of a to the end of b is a + b: the triangle law.'
    step_by_step: 'Step 1: Write vectors in i, j, k form. Step 2: Add or subtract component by component. Step 3: Magnitude = √(sum of squares). Step 4: Unit vector = vector ÷ magnitude.'
    real_world: Pilots add the plane's velocity vector and the wind's vector to find the real path over the ground.
  picture:
    kind: flow
    steps:
    - Draw a
    - From a's tip draw b
    - Join start of a to tip of b
    - That arrow is a + b
    alt: The triangle law of vector addition.
  items:
  - prompt: Find the magnitude of 3i + 4j.
    answer: '5'
    check: sqrt(3**2+4**2)
    difficulty: 1
    hints:
    - √(9 + 16).
    - √25.
    solution: '5.'
  - prompt: Find the magnitude of 2i + 3j + 6k.
    answer: '7'
    check: sqrt(2**2+3**2+6**2)
    difficulty: 1
    hints:
    - √(4 + 9 + 36).
    - √49.
    solution: '7.'
    mistakes:
      '11': c12_mag
  - prompt: a = 2i + j, b = i + 3j. Find the j-component of a + b.
    answer: '4'
    check: 1+3
    difficulty: 1
    hints:
    - Add j parts.
    - 1 + 3.
    solution: '4.'
  - prompt: A = (1, 2, 3) and B = (4, 6, 3). Find |AB|.
    answer: '5'
    check: sqrt(3**2+4**2+0)
    difficulty: 2
    hints:
    - B − A = (3, 4, 0).
    - √25.
    solution: '5.'
  - prompt: 'A vector of magnitude 1 is called a:'
    options:
    - unit vector
    - zero vector
    - position vector
    - collinear vector
    answer: unit vector
    difficulty: 1
    hints:
    - Size one.
    - â.
    solution: A unit vector.
  - prompt: 'Direction cosines l, m, n always satisfy:'
    options:
    - l² + m² + n² = 1
    - l + m + n = 1
    - lmn = 1
    - l = m = n
    answer: l² + m² + n² = 1
    difficulty: 2
    hints:
    - Cosines of angles with axes.
    - Unit vector components.
    solution: l² + m² + n² = 1.
- code: cbse12m.vec.products
  title: Dot and cross products
  after:
  - cbse12m.vec.basics
  notes: |
    Scalar (dot) product a·b = |a||b|cos θ = a₁b₁ + a₂b₂ + a₃b₃; a·b = 0 ⇔ perpendicular; projection of a on b = a·b/|b|.
    Vector (cross) product a × b = |a||b| sin θ n̂ (right-hand rule); a × b = −b × a; parallel vectors give 0; |a × b| = area
    of parallelogram; ½|a × b| = area of triangle. i·i = 1, i·j = 0; i × j = k, j × k = i, k × i = j.
  explanations:
    text: The dot product of two vectors is a number that measures how much they point the same way; it's zero if they're perpendicular. The cross product is a new vector at right angles to both, and its size gives the area of the parallelogram they make.
    visual: Picture two arrows from one point. The dot product is big when they point together and zero at 90°. The cross product sticks straight out of the plane they lie in.
    step_by_step: 'Step 1: Dot product: multiply matching components and add. Step 2: Angle: cos θ = a·b/(|a||b|). Step 3: Cross product: use the determinant with i, j, k. Step 4: Area = |a × b|.'
    real_world: In physics, work done = force · displacement (a dot product), and torque = r × F (a cross product).
  picture:
    kind: compare
    columns:
    - title: Product
      points:
      - dot a·b
      - cross a × b
    - title: Result
      points:
      - a number
      - a vector
    - title: Zero when
      points:
      - perpendicular
      - parallel
    alt: 'Dot and cross products compared: what they give and when they are zero.'
  items:
  - prompt: Find (2i + 3j)·(4i − j).
    answer: '5'
    check: 2*4+3*(-1)
    difficulty: 1
    hints:
    - 2×4 + 3×(−1).
    - 8 − 3.
    solution: '5.'
  - prompt: Find (i + 2j + 3k)·(3i − 3j + k).
    answer: '0'
    check: 1*3+2*(-3)+3*1
    difficulty: 1
    hints:
    - 3 − 6 + 3.
    - Perpendicular.
    solution: '0.'
  - prompt: Find the area of the parallelogram with sides a = 3i and b = 4j.
    answer: '12'
    check: 3*4
    difficulty: 2
    hints:
    - '|a × b| = 12|k|.'
    - 3 × 4.
    solution: 12 square units.
  - prompt: Find the area of the triangle with sides a = 3i and b = 4j.
    answer: '6'
    check: Rational(1,2)*12
    difficulty: 2
    hints:
    - ½|a × b|.
    - ½ × 12.
    solution: 6 square units.
  - prompt: 'i × j equals:'
    options:
    - k
    - −k
    - '0'
    - '1'
    answer: k
    difficulty: 1
    hints:
    - Cyclic order i, j, k.
    - Right-hand rule.
    solution: k.
  - prompt: 'If a·b = 0 for non-zero vectors, they are:'
    options:
    - perpendicular
    - parallel
    - equal
    - opposite
    answer: perpendicular
    difficulty: 1
    hints:
    - cos 90° = 0.
    - Right angle.
    solution: Perpendicular.
    mistakes:
      parallel: c12_dot
