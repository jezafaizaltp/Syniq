# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 12. Format: content/README.md.
subject: cbse12-math
chapter: 12
title: Linear Programming
tips:
  c12_corner: 'The best value of a linear objective over a bounded feasible region is always at a corner point: test every corner.'
concepts:
- code: cbse12m.lp.formulate
  title: Formulating linear programming problems
  notes: |
    LPP: optimise (maximise/minimise) a linear objective function Z = ax + by subject to linear constraints and non-negativity
    (x, y ≥ 0). Decision variables. Types: manufacturing, diet, transportation problems. Constraints come from limited
    resources (time, material, money).
  explanations:
    text: Linear programming finds the best way to use limited resources. You choose decision variables (like how many of each product to make), write the goal as a linear function, and write each limit as a linear inequality.
    visual: 'A baker makes cakes (x) and pies (y). Each cake needs 2 hours of oven time, each pie 1 hour, with 10 hours available: 2x + y ≤ 10. Profit Z = 30x + 20y is what to maximise.'
    step_by_step: 'Step 1: Define the decision variables. Step 2: Write the objective function. Step 3: Write each constraint as an inequality. Step 4: Add x ≥ 0, y ≥ 0.'
    real_world: Airlines use linear programming to schedule planes and crews at the lowest cost.
  picture:
    kind: flow
    steps:
    - Choose variables x, y
    - Objective Z = ax + by
    - Constraints from limited resources
    - Non-negativity x, y ≥ 0
    alt: Setting up a linear programming problem.
  activity:
    type: sort
    prompt: A dealer buys x tables (₹2500 each) and y chairs (₹500 each), has ₹50 000 and space for 60 items. Profit is ₹250 per table and ₹75 per chair. Sort each line.
    bins:
    - Objective function
    - Constraint
    - Non-negativity
    items:
    - label: Maximise Z = 250x + 75y
      bin: Objective function
      clue: Is this the thing the dealer wants as large as possible?
      why: 'Profit is what''s being maximised: the objective.'
    - label: 2500x + 500y ≤ 50 000
      bin: Constraint
      clue: Is it a limit set by money?
      why: The budget limits the cost of what's bought.
    - label: x + y ≤ 60
      bin: Constraint
      clue: Is it a limit set by space?
      why: Only 60 items fit.
    - label: 5x + y ≤ 100
      bin: Constraint
      clue: Divide 2500x + 500y ≤ 50 000 by 500. What do you get?
      why: The budget inequality, simplified.
    - label: x ≥ 0
      bin: Non-negativity
      clue: Can the dealer buy a negative number of tables?
      why: Quantities can't be negative.
    - label: y ≥ 0
      bin: Non-negativity
      clue: Can there be −3 chairs?
      why: Quantities can't be negative.
    - label: Minimise C = 2500x + 500y
      bin: Objective function
      clue: Is it a quantity to make as small as possible?
      why: A cost to minimise is also an objective function, just in a different problem.
  items:
  - prompt: 'In an LPP, the function to maximise or minimise is called the:'
    options:
    - objective function
    - constraint
    - feasible region
    - corner point
    answer: objective function
    difficulty: 1
    hints:
    - The goal.
    - Z = ax + by.
    solution: The objective function.
  - prompt: 'The conditions x ≥ 0, y ≥ 0 are called:'
    options:
    - non-negativity constraints
    - objective functions
    - optimal solutions
    - corner points
    answer: non-negativity constraints
    difficulty: 1
    hints:
    - Can't make negative items.
    - Always included.
    solution: Non-negativity constraints.
  - prompt: Each cake needs 2 hours and each pie 1 hour; 10 hours are available. If 3 cakes are made, what is the most pies?
    answer: '4'
    check: 10-2*3
    difficulty: 1
    hints:
    - 2(3) + y ≤ 10.
    - y ≤ 4.
    solution: 4 pies.
  - prompt: Profit Z = 30x + 20y. Find Z when x = 3 and y = 4.
    answer: '170'
    check: 30*3+20*4
    difficulty: 1
    hints:
    - 90 + 80.
    - Substitute.
    solution: ₹170.
  - prompt: 'A diet problem usually aims to:'
    options:
    - minimise cost while meeting nutrient needs
    - maximise cost
    - maximise calories only
    - ignore constraints
    answer: minimise cost while meeting nutrient needs
    difficulty: 2
    hints:
    - Cheapest healthy diet.
    - Minimise.
    solution: Minimise cost while meeting nutrient requirements.
  - prompt: 'In an LPP, the constraints and objective must be:'
    options:
    - linear
    - quadratic
    - exponential
    - trigonometric
    answer: linear
    difficulty: 2
    hints:
    - Straight lines.
    - Name of the method.
    solution: Linear.
- code: cbse12m.lp.graphical
  title: Graphical method and corner points
  after:
  - cbse12m.lp.formulate
  notes: |
    Graphical method: draw each constraint line, shade the feasible region (all constraints satisfied). Corner point theorem:
    if the feasible region is bounded, the optimal value of Z occurs at a corner point. Evaluate Z at each corner. For an
    unbounded region, check whether the optimum exists (draw Z = value half-plane). Infeasible problems have no region.
  explanations:
    text: 'Draw each constraint as a line and shade the region where all are true: the feasible region. The best value of the objective always occurs at one of the region''s corners, so you just test each corner.'
    visual: Shade the region x ≥ 0, y ≥ 0, x + y ≤ 4. Its corners are (0, 0), (4, 0) and (0, 4). For Z = 3x + 2y, the corners give 0, 12 and 8, so the maximum is 12 at (4, 0).
    step_by_step: 'Step 1: Draw each constraint line. Step 2: Shade the feasible region. Step 3: Find the corner points. Step 4: Evaluate Z at each and pick the best.'
    real_world: Factories use the corner point method to decide how much of each product to make for the highest profit.
  picture:
    kind: bars
    bars:
    - label: (0, 0)
      value: 0
    - label: (4, 0)
      value: 12
    - label: (0, 4)
      value: 8
    alt: 'Z = 3x + 2y at the corners of x + y ≤ 4: 0, 12 and 8; the maximum is 12 at (4, 0).'
    unit: Z
  activity:
    type: formula
    prompt: 'Feasible region: x + y ≤ 4, x + 3y ≤ 6, x ≥ 0, y ≥ 0. Its corners are (0, 0), (4, 0), (3, 1) and (0, 2).'
    inputs:
    - name: x
      label: x
      min: 0
      max: 6
      step: 1
      start: 0
    - name: y
      label: y
      min: 0
      max: 6
      step: 1
      start: 0
    outputs:
    - name: ok
      label: Feasible? (1 yes, 0 no)
      expr: min(1,max(0,min(4-x-y,6-x-3*y)+1))
    - name: z
      label: Z = 3x + 2y
      expr: 3*x+2*y
    - name: z2
      label: Z₂ = x + 3y
      expr: x+3*y
    goals:
    - prompt: Find the corner where Z = 3x + 2y is largest.
      want:
        x: 4
        y: 0
      mistakes:
      - when:
          ok: 0
        say: 'That point breaks a constraint: it''s outside the feasible region. Only feasible points count.'
      - when:
          x: 3
          y: 1
        say: 'Z = 11 at (3, 1). Check every corner: one gives more.'
      - when:
          x: 0
          y: 2
        say: Z = 4 at (0, 2). Check the other corners.
    - prompt: Now make Z₂ = x + 3y as large as possible, staying feasible.
      want:
        ok: 1
        z2: 6
      mistakes:
      - when:
          ok: 0
          z2:
          - 7
          - 30
        say: Higher Z₂, but outside the feasible region.
      - when:
          x: 4
          y: 0
        say: Z₂ = 4 at (4, 0). A different objective can peak at a different corner.
    - prompt: Make Z = 3x + 2y equal 9 at a feasible point that is NOT a corner.
      want:
        ok: 1
        z: 9
      mistakes:
      - when:
          z: 9
          ok: 0
        say: Z = 9, but the point is outside the region.
  items:
  - prompt: Maximise Z = 3x + 2y with x + y ≤ 4, x, y ≥ 0. Find the maximum Z.
    answer: '12'
    check: max(0, 3*4, 2*4)
    difficulty: 1
    hints:
    - Corners (0,0), (4,0), (0,4).
    - Z = 0, 12, 8.
    solution: 12, at (4, 0).
    mistakes:
      '8': c12_corner
  - prompt: Minimise Z = x + 2y with x + y ≥ 2, x, y ≥ 0. Find the minimum Z.
    answer: '2'
    check: min(2, 4)
    difficulty: 2
    hints:
    - Corners (2,0), (0,2).
    - Z = 2, 4.
    solution: 2, at (2, 0).
  - prompt: Maximise Z = 5x + 4y with x ≤ 3, y ≤ 2, x, y ≥ 0. Find the maximum Z.
    answer: '23'
    check: 5*3+4*2
    difficulty: 2
    hints:
    - Best corner (3, 2).
    - 15 + 8.
    solution: '23.'
  - prompt: 'The optimal value of a linear objective on a bounded feasible region occurs at:'
    options:
    - a corner point
    - the centre
    - any interior point
    - the origin always
    answer: a corner point
    difficulty: 1
    hints:
    - Corner point theorem.
    - Vertices.
    solution: A corner point.
  - prompt: 'The feasible region is the set of points that:'
    options:
    - satisfy all constraints
    - give the maximum Z
    - lie on the axes
    - satisfy one constraint
    answer: satisfy all constraints
    difficulty: 1
    hints:
    - Shaded area.
    - All at once.
    solution: Satisfy all the constraints.
  - prompt: 'If no point satisfies all constraints, the problem is:'
    options:
    - infeasible
    - unbounded
    - optimal
    - linear
    answer: infeasible
    difficulty: 2
    hints:
    - Empty region.
    - No solution.
    solution: Infeasible.
