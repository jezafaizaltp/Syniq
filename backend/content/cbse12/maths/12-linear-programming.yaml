# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 12. Format: content/README.md.
subject: cbse12-math
chapter: 12
title: Linear Programming
tips:
  c12_corner: 'The best value of a linear objective over a bounded feasible region is always at a corner point: test every corner.'
  m12_corner: "The best value of Z is always at a corner of the feasible region. List every corner, put each into Z, and pick the smallest or largest."
  m12_corner_theorem: "Z is linear, so it grows steadily in one direction until it hits an edge, ending at a corner."
  m12_diet: "A family wants enough nutrition while spending as little as possible."
  m12_evaluate_z: "Substitute x and y into Z."
  m12_feasible: "'Feasible' means allowed. Which points break no rule?"
  m12_infeasible: "If no point is allowed, the problem cannot be done."
  m12_linear: "The 'L' in LPP stands for this."
  m12_lp_count: "3 cakes use 6 hours. How many hours are left for pies?"
  m12_lp_terms: "The thing we want to make as large or small as possible is the 'objective'."
  m12_nonneg: "You cannot make a negative number of items. Which constraints say x and y are not negative?"
  c12m12_form: "Name the unknowns whose values you get to choose first, then turn each limited resource into one inequality."
  c12m12_corner: List every corner of the feasible region, work out Z at each, then pick the largest or smallest.
  c12m12_region: A point is feasible only if it satisfies every constraint, including x ≥ 0 and y ≥ 0.
concepts:
- code: cbse12m.lp.formulate
  title: Formulating linear programming problems
  notes: |
    LPP: optimise (maximise/minimise) a linear objective function Z = ax + by subject to linear constraints and non-negativity
    (x, y ≥ 0). Decision variables. Types: manufacturing, diet, transportation problems. Constraints come from limited
    resources (time, material, money).
  explanations:
    text: Linear programming finds the best way to use limited resources. You choose decision variables (like how many of each product to make), write the goal as a linear function, and write each limit as a linear inequality.
    visual: 'A baker makes cakes (x) and pies (y). Each cake needs 2 hours of oven time, each pie 1 hour, with 10 hours available: 2x + y ≤ 10. Profit Z = 30x + 20y is what to maximise.'
    step_by_step: 'Step 1: Define the decision variables. Step 2: Write the objective function. Step 3: Write each constraint as an inequality. Step 4: Add x ≥ 0, y ≥ 0.'
    real_world: Airlines use linear programming to schedule planes and crews at the lowest cost.
  picture:
    kind: flow
    steps:
    - Choose variables x, y
    - Objective Z = ax + by
    - Constraints from limited resources
    - Non-negativity x, y ≥ 0
    alt: Setting up a linear programming problem.
  activity:
    type: sort
    prompt: A dealer buys x tables (₹2500 each) and y chairs (₹500 each), has ₹50 000 and space for 60 items. Profit is ₹250 per table and ₹75 per chair. Sort each line.
    bins:
    - Objective function
    - Constraint
    - Non-negativity
    items:
    - label: Maximise Z = 250x + 75y
      bin: Objective function
      clue: Is this the thing the dealer wants as large as possible?
      why: 'Profit is what''s being maximised: the objective.'
    - label: 2500x + 500y ≤ 50 000
      bin: Constraint
      clue: Is it a limit set by money?
      why: The budget limits the cost of what's bought.
    - label: x + y ≤ 60
      bin: Constraint
      clue: Is it a limit set by space?
      why: Only 60 items fit.
    - label: 5x + y ≤ 100
      bin: Constraint
      clue: Divide 2500x + 500y ≤ 50 000 by 500. What do you get?
      why: The budget inequality, simplified.
    - label: x ≥ 0
      bin: Non-negativity
      clue: Can the dealer buy a negative number of tables?
      why: Quantities can't be negative.
    - label: y ≥ 0
      bin: Non-negativity
      clue: Can there be −3 chairs?
      why: Quantities can't be negative.
    - label: Minimise C = 2500x + 500y
      bin: Objective function
      clue: Is it a quantity to make as small as possible?
      why: A cost to minimise is also an objective function, just in a different problem.
  lesson:
    - teach: A linear programming problem (LPP) asks for the best value (maximum or minimum) of a linear objective Z = ax + by. The unknowns x and y are decision variables, such as how many chairs and tables to make.
      check:
        prompt: Which of these is a linear objective function?
        options:
        - Z = 4x + 7y
        - Z = x² + y
        - Z = xy
        answer: Z = 4x + 7y
        why: Only first powers of x and y, with no products.
    - teach: 'Constraints come from limited resources: hours, material, money, space. Each becomes a linear inequality. Example: a chair takes 2 h and a table 3 h, with 12 h available: 2x + 3y ≤ 12. You cannot make negative items, so x ≥ 0, y ≥ 0.'
      picture:
        kind: flow
        steps:
        - Choose variables x, y
        - Write Z to maximise or minimise
        - One inequality per resource
        - Add x ≥ 0, y ≥ 0
        alt: Steps for turning a word problem into a linear programming problem.
      check:
        prompt: Each kg of A costs ₹5 and each kg of B ₹8; the budget is ₹40. Which constraint fits?
        options:
        - 5x + 8y ≤ 40
        - 5x + 8y ≥ 40
        - x + y ≤ 40
        answer: 5x + 8y ≤ 40
        why: Total spending cannot go over the budget.
    - teach: 'Common types: manufacturing (maximise profit within machine hours), diet (minimise cost while meeting nutrient minimums, so ≥ constraints), transportation (minimise shipping cost).'
      check:
        prompt: 'In a diet problem, nutrient constraints usually use:'
        options:
        - ≥
        - ≤
        - '='
        answer: ≥
        why: The diet must provide at least the needed amount.
  items:
  - prompt: 'In an LPP, the function to maximise or minimise is called the:'
    options:
    - objective function
    - constraint
    - feasible region
    - corner point
    answer: objective function
    difficulty: 1
    hints:
    - The goal.
    - Z = ax + by.
    solution: The objective function.
    mistakes: {"constraint": "m12_lp_terms", "feasible region": "m12_lp_terms", "corner point": "m12_lp_terms"}
  - prompt: 'The conditions x ≥ 0, y ≥ 0 are called:'
    options:
    - non-negativity constraints
    - objective functions
    - optimal solutions
    - corner points
    answer: non-negativity constraints
    difficulty: 1
    hints:
    - Can't make negative items.
    - Always included.
    solution: Non-negativity constraints.
    mistakes: {"objective functions": "m12_nonneg", "optimal solutions": "m12_nonneg", "corner points": "m12_nonneg"}
  - prompt: Each cake needs 2 hours and each pie 1 hour; 10 hours are available. If 3 cakes are made, what is the most pies?
    answer: '4'
    check: 10-2*3
    difficulty: 1
    hints:
    - 2(3) + y ≤ 10.
    - y ≤ 4.
    solution: 4 pies.
    mistakes: {"7": "m12_lp_count", "10": "m12_lp_count", "2": "m12_lp_count"}
  - prompt: Profit Z = 30x + 20y. Find Z when x = 3 and y = 4.
    answer: '170'
    check: 30*3+20*4
    difficulty: 1
    hints:
    - 90 + 80.
    - Substitute.
    solution: ₹170.
    mistakes: {"90": "m12_evaluate_z", "80": "m12_evaluate_z", "50": "m12_evaluate_z"}
  - prompt: 'A diet problem usually aims to:'
    options:
    - minimise cost while meeting nutrient needs
    - maximise cost
    - maximise calories only
    - ignore constraints
    answer: minimise cost while meeting nutrient needs
    difficulty: 2
    hints:
    - Cheapest healthy diet.
    - Minimise.
    solution: Minimise cost while meeting nutrient requirements.
    mistakes: {"maximise cost": "m12_diet", "maximise calories only": "m12_diet", "ignore constraints": "m12_diet"}
  - prompt: 'In an LPP, the constraints and objective must be:'
    options:
    - linear
    - quadratic
    - exponential
    - trigonometric
    answer: linear
    difficulty: 2
    hints:
    - Straight lines.
    - Name of the method.
    solution: Linear.
    mistakes: {"quadratic": "m12_linear", "exponential": "m12_linear", "trigonometric": "m12_linear"}
  - prompt: A toy needs 3 hours; 15 hours are available. What is the most toys that can be made?
    answer: '5'
    check: 15/3
    difficulty: 1
    hints:
    - Write 3x ≤ 15.
    - Solve for x.
    solution: 'Step 1: 3x ≤ 15. Step 2: x ≤ 5.'
    mistakes:
      '45': c12m12_form
      '12': c12m12_form
  - prompt: Profit Z = 50x + 40y. Find Z when x = 2 and y = 5.
    answer: '300'
    check: 50*2 + 40*5
    difficulty: 1
    hints:
    - Substitute both values.
    - Add the two products.
    solution: 'Step 1: 100 + 200. Step 2: 300.'
    mistakes:
      '90': c12m12_form
      '450': c12m12_form
  - prompt: 'The unknowns x and y in an LPP are called:'
    options:
    - decision variables
    - constraints
    - corner points
    answer: decision variables
    difficulty: 1
    hints:
    - They are what we choose.
    - Their values decide Z.
    solution: 'Step 1: we decide x and y. Step 2: decision variables.'
    mistakes:
      constraints: c12m12_form
      corner points: c12m12_form
  - prompt: Food A has 2 units of vitamin per kg, food B has 1 unit; at least 8 units are needed. Which constraint is right?
    options:
    - 2x + y ≥ 8
    - 2x + y ≤ 8
    - x + 2y ≥ 8
    answer: 2x + y ≥ 8
    difficulty: 2
    hints:
    - Vitamin from A is 2x, from B is y.
    - '''At least'' means the total cannot fall below 8.'
    solution: 'Step 1: total vitamin 2x + y. Step 2: ≥ 8.'
    mistakes:
      2x + y ≤ 8: c12m12_form
      x + 2y ≥ 8: c12m12_form
  - prompt: A bag needs 4 m of cloth and a cap 1 m; 20 m are available. If 3 bags are made, what is the most caps?
    answer: '8'
    check: 20 - 4*3
    difficulty: 2
    hints:
    - Cloth used by 3 bags.
    - The rest goes to caps.
    solution: 'Step 1: 12 m for bags. Step 2: 8 m left, 8 caps.'
    mistakes:
      '5': c12m12_form
      '17': c12m12_form
  - prompt: Is (2, 3) feasible for x + y ≤ 6, x ≤ 3, x, y ≥ 0?
    options:
    - 'yes'
    - no, x + y is too big
    - no, x is too big
    answer: 'yes'
    difficulty: 2
    hints:
    - Check each inequality in turn.
    - 2 + 3 = 5.
    solution: 'Step 1: 5 ≤ 6, 2 ≤ 3, both non-negative. Step 2: feasible.'
    mistakes:
      no, x + y is too big: c12m12_region
      no, x is too big: c12m12_region
  - prompt: Cost Z = 6x + 4y. Find Z at (1, 4).
    answer: '22'
    check: 6*1 + 4*4
    difficulty: 2
    hints:
    - Put x = 1, y = 4.
    - 6 + 16.
    solution: 'Step 1: 6 + 16. Step 2: 22.'
    mistakes:
      '28': c12m12_form
      '10': c12m12_form
  - prompt: 'A firm makes x chairs (profit ₹30) and y tables (profit ₹50). Machine time: chair 1 h, table 2 h, 40 h available. Which pair is the full model?'
    options:
    - Max Z = 30x + 50y; x + 2y ≤ 40; x, y ≥ 0
    - Min Z = 30x + 50y; x + 2y ≥ 40
    - Max Z = x + 2y; 30x + 50y ≤ 40
    answer: Max Z = 30x + 50y; x + 2y ≤ 40; x, y ≥ 0
    difficulty: 3
    hints:
    - Profit goes in the objective.
    - Hours go in the constraint.
    solution: 'Step 1: maximise profit 30x + 50y. Step 2: hours x + 2y ≤ 40, with x, y ≥ 0.'
    mistakes:
      Min Z = 30x + 50y; x + 2y ≥ 40: c12m12_form
      Max Z = x + 2y; 30x + 50y ≤ 40: c12m12_form
  - prompt: With the chair-table model above, how many tables can be made if no chairs are made?
    answer: '20'
    check: 40/2
    difficulty: 3
    hints:
    - Put x = 0 in the hours constraint.
    - 2y ≤ 40.
    solution: 'Step 1: 2y ≤ 40. Step 2: y ≤ 20.'
    mistakes:
      '40': c12m12_form
      '80': c12m12_form
- code: cbse12m.lp.graphical
  title: Graphical method and corner points
  after:
  - cbse12m.lp.formulate
  notes: |
    Graphical method: draw each constraint line, shade the feasible region (all constraints satisfied). Corner point theorem:
    if the feasible region is bounded, the optimal value of Z occurs at a corner point. Evaluate Z at each corner. For an
    unbounded region, check whether the optimum exists (draw Z = value half-plane). Infeasible problems have no region.
  explanations:
    text: 'Draw each constraint as a line and shade the region where all are true: the feasible region. The best value of the objective always occurs at one of the region''s corners, so you just test each corner.'
    visual: Shade the region x ≥ 0, y ≥ 0, x + y ≤ 4. Its corners are (0, 0), (4, 0) and (0, 4). For Z = 3x + 2y, the corners give 0, 12 and 8, so the maximum is 12 at (4, 0).
    step_by_step: 'Step 1: Draw each constraint line. Step 2: Shade the feasible region. Step 3: Find the corner points. Step 4: Evaluate Z at each and pick the best.'
    real_world: Factories use the corner point method to decide how much of each product to make for the highest profit.
  picture:
    kind: bars
    bars:
    - label: (0, 0)
      value: 0
    - label: (4, 0)
      value: 12
    - label: (0, 4)
      value: 8
    alt: 'Z = 3x + 2y at the corners of x + y ≤ 4: 0, 12 and 8; the maximum is 12 at (4, 0).'
    unit: Z
  activity:
    type: formula
    prompt: 'Feasible region: x + y ≤ 4, x + 3y ≤ 6, x ≥ 0, y ≥ 0. Its corners are (0, 0), (4, 0), (3, 1) and (0, 2).'
    inputs:
    - name: x
      label: x
      min: 0
      max: 6
      step: 1
      start: 0
    - name: y
      label: y
      min: 0
      max: 6
      step: 1
      start: 0
    outputs:
    - name: ok
      label: Feasible? (1 yes, 0 no)
      expr: min(1,max(0,min(4-x-y,6-x-3*y)+1))
    - name: z
      label: Z = 3x + 2y
      expr: 3*x+2*y
    - name: z2
      label: Z₂ = x + 3y
      expr: x+3*y
    goals:
    - prompt: Find the corner where Z = 3x + 2y is largest.
      want:
        x: 4
        y: 0
      mistakes:
      - when:
          ok: 0
        say: 'That point breaks a constraint: it''s outside the feasible region. Only feasible points count.'
      - when:
          x: 3
          y: 1
        say: 'Z = 11 at (3, 1). Check every corner: one gives more.'
      - when:
          x: 0
          y: 2
        say: Z = 4 at (0, 2). Check the other corners.
    - prompt: Now make Z₂ = x + 3y as large as possible, staying feasible.
      want:
        ok: 1
        z2: 6
      mistakes:
      - when:
          ok: 0
          z2:
          - 7
          - 30
        say: Higher Z₂, but outside the feasible region.
      - when:
          x: 4
          y: 0
        say: Z₂ = 4 at (4, 0). A different objective can peak at a different corner.
    - prompt: Make Z = 3x + 2y equal 9 at a feasible point that is NOT a corner.
      want:
        ok: 1
        z: 9
      mistakes:
      - when:
          z: 9
          ok: 0
        say: Z = 9, but the point is outside the region.
  lesson:
    - teach: 'Graphical method: draw each constraint as a line, shade the side that satisfies it, and find the region where all shadings overlap: the feasible region. Every point there is a possible plan.'
      check:
        prompt: Which side of x + y = 4 is x + y ≤ 4?
        options:
        - the side containing the origin
        - the side away from the origin
        - only the line itself
        answer: the side containing the origin
        why: At (0, 0), 0 ≤ 4 is true.
    - teach: 'Corner point theorem: if the feasible region is bounded, the maximum and minimum of Z occur at corner points. So find all corners (where boundary lines meet), compute Z at each, and compare.'
      picture:
        kind: compare
        columns:
        - title: Corner
          points:
          - (0, 0)
          - (4, 0)
          - (0, 3)
          - (2, 2)
        - title: Z = 3x + 4y
          points:
          - '0'
          - '12'
          - '12'
          - '14'
        alt: Table of corner points with the value of Z at each; the largest is 14 at (2, 2).
      check:
        prompt: In the table, where is Z = 3x + 4y largest?
        options:
        - (2, 2)
        - (4, 0)
        - (0, 3)
        answer: (2, 2)
        why: Z = 6 + 8 = 14, the largest value.
    - teach: If the region is unbounded, a max or min may not exist; check by drawing Z greater (or less) than the candidate value and seeing whether it meets the region. If no point satisfies all constraints, the problem is infeasible.
      check:
        prompt: 'Constraints x + y ≤ 2 and x + y ≥ 5 together give:'
        options:
        - no feasible region
        - a bounded region
        - an unbounded region
        answer: no feasible region
        why: No (x, y) can make the sum both ≤ 2 and ≥ 5.
  items:
  - prompt: Maximise Z = 3x + 2y with x + y ≤ 4, x, y ≥ 0. Find the maximum Z.
    answer: '12'
    check: max(0, 3*4, 2*4)
    difficulty: 1
    hints:
    - Corners (0,0), (4,0), (0,4).
    - Z = 0, 12, 8.
    solution: 12, at (4, 0).
    mistakes:
      '8': c12_corner
  - prompt: Minimise Z = x + 2y with x + y ≥ 2, x, y ≥ 0. Find the minimum Z.
    answer: '2'
    check: min(2, 4)
    difficulty: 2
    hints:
    - Corners (2,0), (0,2).
    - Z = 2, 4.
    solution: 2, at (2, 0).
    mistakes: {"4": "m12_corner", "0": "m12_corner"}
  - prompt: Maximise Z = 5x + 4y with x ≤ 3, y ≤ 2, x, y ≥ 0. Find the maximum Z.
    answer: '23'
    check: 5*3+4*2
    difficulty: 2
    hints:
    - Best corner (3, 2).
    - 15 + 8.
    solution: '23.'
    mistakes: {"15": "m12_corner", "8": "m12_corner", "20": "m12_corner"}
  - prompt: 'The optimal value of a linear objective on a bounded feasible region occurs at:'
    options:
    - a corner point
    - the centre
    - any interior point
    - the origin always
    answer: a corner point
    difficulty: 1
    hints:
    - Corner point theorem.
    - Vertices.
    solution: A corner point.
    mistakes: {"the centre": "m12_corner_theorem", "any interior point": "m12_corner_theorem", "the origin always": "m12_corner_theorem"}
  - prompt: 'The feasible region is the set of points that:'
    options:
    - satisfy all constraints
    - give the maximum Z
    - lie on the axes
    - satisfy one constraint
    answer: satisfy all constraints
    difficulty: 1
    hints:
    - Shaded area.
    - All at once.
    solution: Satisfy all the constraints.
    mistakes: {"give the maximum Z": "m12_feasible", "lie on the axes": "m12_feasible", "satisfy one constraint": "m12_feasible"}
  - prompt: 'If no point satisfies all constraints, the problem is:'
    options:
    - infeasible
    - unbounded
    - optimal
    - linear
    answer: infeasible
    difficulty: 2
    hints:
    - Empty region.
    - No solution.
    solution: Infeasible.
    mistakes: {"unbounded": "m12_infeasible", "optimal": "m12_infeasible", "linear": "m12_infeasible"}
  - prompt: Maximise Z = 2x + 5y with x + y ≤ 6, x, y ≥ 0. Find the maximum Z.
    answer: '30'
    check: 5*6
    difficulty: 1
    hints:
    - 'Corners: (0, 0), (6, 0), (0, 6).'
    - Compute Z at each.
    solution: 'Step 1: Z = 0, 12, 30. Step 2: max 30 at (0, 6).'
    mistakes:
      '12': c12m12_corner
      '42': c12m12_corner
  - prompt: Minimise Z = 3x + y with x + y ≥ 3, x, y ≥ 0. Find the minimum Z.
    answer: '3'
    check: 0*3 + 3
    difficulty: 1
    hints:
    - 'Corners of the region: (3, 0) and (0, 3).'
    - Compare Z at both.
    solution: 'Step 1: Z(3, 0) = 9, Z(0, 3) = 3. Step 2: minimum 3 (Z grows elsewhere).'
    mistakes:
      '9': c12m12_corner
      '0': c12m12_region
  - prompt: Maximise Z = x + 3y with x ≤ 4, y ≤ 5, x, y ≥ 0. Find the maximum Z.
    answer: '19'
    check: 4 + 3*5
    difficulty: 1
    hints:
    - The region is a rectangle.
    - Try the corner (4, 5).
    solution: 'Step 1: Z(4, 5) = 4 + 15. Step 2: 19.'
    mistakes:
      '15': c12m12_corner
      '4': c12m12_corner
  - prompt: Where do x + 2y = 8 and 3x + 2y = 12 meet? Give x.
    answer: '2'
    check: (12 - 8)/2
    difficulty: 2
    hints:
    - Subtract the first equation from the second.
    - 2x = 4.
    solution: 'Step 1: 2x = 4, x = 2. Step 2: y = 3.'
    mistakes:
      '3': c12m12_corner
      '4': c12m12_corner
  - prompt: Maximise Z = x + y with x + 2y ≤ 8, 3x + 2y ≤ 12, x, y ≥ 0. Find the maximum Z.
    answer: '5'
    check: 2 + 3
    difficulty: 2
    hints:
    - 'Corners: (0, 0), (4, 0), (2, 3), (0, 4).'
    - Find Z at each.
    solution: 'Step 1: Z = 0, 4, 5, 4. Step 2: max 5 at (2, 3).'
    mistakes:
      '4': c12m12_corner
      '7': c12m12_corner
  - prompt: Is (3, 3) in the feasible region of x + 2y ≤ 8, 3x + 2y ≤ 12?
    options:
    - 'no'
    - 'yes'
    - only on the boundary
    answer: 'no'
    difficulty: 2
    hints:
    - Test x + 2y.
    - 3 + 6 = 9.
    solution: 'Step 1: 9 > 8, so the first constraint fails. Step 2: not feasible.'
    mistakes:
      'yes': c12m12_region
      only on the boundary: c12m12_region
  - prompt: How many corner points does the region x + y ≤ 5, x ≤ 3, x, y ≥ 0 have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - List where the boundary lines meet.
    - (0, 0), (3, 0), (3, 2), (0, 5).
    solution: 'Step 1: four corners. Step 2: 4.'
    mistakes:
      '3': c12m12_corner
      '5': c12m12_corner
  - prompt: Maximise Z = 4x + 3y on that region (x + y ≤ 5, x ≤ 3, x, y ≥ 0). Find the maximum.
    answer: '18'
    check: 4*3 + 3*2
    difficulty: 3
    hints:
    - Evaluate Z at (0, 0), (3, 0), (3, 2), (0, 5).
    - Compare.
    solution: 'Step 1: Z = 0, 12, 18, 15. Step 2: max 18 at (3, 2).'
    mistakes:
      '15': c12m12_corner
      '12': c12m12_corner
  - prompt: 'Maximise Z = x + y with x − y ≥ 0, x, y ≥ 0 (no other limits). The maximum:'
    options:
    - does not exist; the region is unbounded
    - is 0
    - is 1
    answer: does not exist; the region is unbounded
    difficulty: 3
    hints:
    - Try large points like (100, 50).
    - Is there any ceiling?
    solution: 'Step 1: Z keeps growing as x grows. Step 2: no maximum.'
    mistakes:
      is 0: c12m12_region
      is 1: c12m12_region
