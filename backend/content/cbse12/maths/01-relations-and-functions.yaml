# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse12-math
chapter: 1
title: Relations and Functions
tips:
  c12_equiv: An equivalence relation must be reflexive, symmetric AND transitive; check all three.
  c12_onto: 'One-one: different inputs give different outputs. Onto: every element of the codomain is an output.'
  m12_bijections: "A bijection of a set onto itself is a rearrangement. Count arrangements of 3 objects."
  m12_bijective: "To undo f, every output must come from exactly one input, and every value must be hit."
  m12_composition: "(g∘f)(1) = g(f(1)). Apply f first, then g."
  m12_equivalence: "Check all three: is a line parallel to itself? If a ∥ b, is b ∥ a? If a ∥ b and b ∥ c, is a ∥ c?"
  m12_inverse_value: "f⁻¹(0) is the x that f sends to 0. Solve 3x − 6 = 0."
  m12_less_than: "Is 2 < 2? If 2 < 3, is 3 < 2? If 2 < 3 and 3 < 5, is 2 < 5?"
  m12_mod_classes: "List the possible remainders when an integer is divided by 3. Each remainder gives one class. Count them."
  m12_relations_count: "A relation on A is any subset of A × A. A × A has 4 pairs; count the subsets."
  m12_universal: "A × A contains every possible pair. Which relation relates everything to everything?"
concepts:
- code: cbse12m.rel.types
  title: Types of relations
  notes: |
    Relation R from A to A is a subset of A × A. Empty relation (no pairs), universal relation (A × A). Reflexive: (a, a)
    ∈ R for every a. Symmetric: (a, b) ∈ R ⇒ (b, a) ∈ R. Transitive: (a, b), (b, c) ∈ R ⇒ (a, c) ∈ R. Equivalence relation:
    all three; it splits A into disjoint equivalence classes (e.g. congruence modulo 3 on integers gives classes [0], [1],
    [2]). Number of relations on a set with n elements = 2^(n²).
  explanations:
    text: A relation pairs up elements of a set. It's reflexive if every element is related to itself, symmetric if the pairing works both ways, and transitive if a link from a to b and b to c gives a to c. A relation with all three is an equivalence relation, and it sorts the set into groups.
    visual: 'Picture students related by ''same birth month''. Everyone matches themselves (reflexive), if A matches B then B matches A (symmetric), and matches chain (transitive). The 12 months make 12 groups: the equivalence classes.'
    step_by_step: 'Step 1: Check (a, a) for every a. Step 2: For each (a, b), look for (b, a). Step 3: For each chain (a, b), (b, c), look for (a, c). Step 4: All three hold → equivalence relation.'
    real_world: 'Clocks use ''congruent modulo 12'': 3 o''clock and 15:00 fall in the same class.'
  picture:
    kind: compare
    columns:
    - title: Property
      points:
      - reflexive
      - symmetric
      - transitive
    - title: Test
      points:
      - (a, a) for all a
      - (a, b) ⇒ (b, a)
      - (a, b), (b, c) ⇒ (a, c)
    alt: The three properties of a relation and how to test each.
  activity:
    type: sort
    prompt: An equivalence relation is reflexive, symmetric AND transitive. Which of these are?
    bins:
    - Equivalence relation
    - Not an equivalence relation
    items:
    - label: 'On ℤ: a R b if a − b is divisible by 3'
      bin: Equivalence relation
      clue: Is a − a divisible by 3? If 3 divides a − b, does it divide b − a?
      why: a − a = 0 works; b − a = −(a − b) works; and (a − b) + (b − c) = a − c, so all three hold.
    - label: 'On ℝ: a R b if a ≤ b'
      bin: Not an equivalence relation
      clue: If 2 ≤ 5, is 5 ≤ 2?
      why: 'Reflexive and transitive, but not symmetric: 2 ≤ 5 doesn''t give 5 ≤ 2.'
    - label: 'People: a R b if a and b are the same age'
      bin: Equivalence relation
      clue: Check each property in turn. Does any fail?
      why: 'Same age as yourself, both ways, and passes along a chain: all three hold.'
    - label: 'People: a R b if a is a brother of b'
      bin: Not an equivalence relation
      clue: Is anyone their own brother?
      why: 'Not reflexive: nobody is their own brother. (It isn''t symmetric either: a sister''s brother isn''t her brother back.)'
    - label: 'Lines: L₁ R L₂ if L₁ ∥ L₂ (L ∥ L counts)'
      bin: Equivalence relation
      clue: If L₁ ∥ L₂ and L₂ ∥ L₃, what about L₁ and L₃?
      why: 'Reflexive (given), symmetric, and transitive: parallel to parallel is parallel.'
    - label: 'Lines: L₁ R L₂ if L₁ ⊥ L₂'
      bin: Not an equivalence relation
      clue: Is a line perpendicular to itself?
      why: Not reflexive; and two lines perpendicular to a third are parallel to each other, so not transitive.
    - label: 'On ℝ: a R b if |a − b| ≤ 1'
      bin: Not an equivalence relation
      clue: Try 0, 1 and 2. Is 0 related to 2?
      why: '0 R 1 and 1 R 2, but |0 − 2| = 2: not transitive.'
    - label: 'On {1, 2, 3}: {(1, 1), (2, 2), (3, 3)}'
      bin: Equivalence relation
      clue: Is every element related to itself? Any pairs to reverse?
      why: 'The identity relation: reflexive, and symmetric and transitive with nothing to break them.'
    - label: 'On {1, 2, 3}: {(1, 1), (2, 2), (3, 3), (1, 2)}'
      bin: Not an equivalence relation
      clue: (1, 2) is there. Is (2, 1)?
      why: 'Not symmetric: (1, 2) is in R but (2, 1) isn''t.'
    - label: 'Triangles: T₁ R T₂ if T₁ is similar to T₂'
      bin: Equivalence relation
      clue: Is a triangle similar to itself? Does similarity pass along a chain?
      why: Similarity is reflexive, symmetric and transitive.
  items:
  - prompt: How many relations are possible on a set with 2 elements?
    answer: '16'
    check: 2**(2**2)
    difficulty: 2
    hints:
    - 2^(n²).
    - 2⁴.
    solution: '16.'
    mistakes: {"4": "m12_relations_count", "8": "m12_relations_count", "2": "m12_relations_count"}
  - prompt: Congruence modulo 3 on the integers gives how many equivalence classes?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Remainders 0, 1, 2.
    - Three.
    solution: '3.'
    mistakes: {"2": "m12_mod_classes", "1": "m12_mod_classes"}
  - prompt: 'R = {(1,1), (2,2), (3,3), (1,2)} on {1, 2, 3} is:'
    options:
    - reflexive but not symmetric
    - symmetric but not reflexive
    - an equivalence relation
    - empty
    answer: reflexive but not symmetric
    difficulty: 2
    hints:
    - All (a, a) present.
    - (1,2) but no (2,1).
    solution: Reflexive, but not symmetric.
    mistakes:
      an equivalence relation: c12_equiv
  - prompt: '''Is parallel to'' on lines in a plane (counting a line parallel to itself) is:'
    options:
    - an equivalence relation
    - only symmetric
    - only reflexive
    - not a relation
    answer: an equivalence relation
    difficulty: 2
    hints:
    - Check all three.
    - Chains of parallels.
    solution: It's an equivalence relation.
    mistakes: {"only symmetric": "m12_equivalence", "only reflexive": "m12_equivalence", "not a relation": "m12_equivalence"}
  - prompt: '''Is less than'' on real numbers is:'
    options:
    - transitive but not symmetric
    - symmetric
    - reflexive
    - an equivalence relation
    answer: transitive but not symmetric
    difficulty: 1
    hints:
    - a < b doesn't give b < a.
    - a < b < c ⇒ a < c.
    solution: Transitive, not symmetric or reflexive.
    mistakes: {"symmetric": "m12_less_than", "reflexive": "m12_less_than", "an equivalence relation": "m12_less_than"}
  - prompt: 'The relation A × A on a set A is called the:'
    options:
    - universal relation
    - empty relation
    - identity relation
    - inverse relation
    answer: universal relation
    difficulty: 1
    hints:
    - Every pair.
    - Largest relation.
    solution: The universal relation.
    mistakes: {"empty relation": "m12_universal", "identity relation": "m12_universal", "inverse relation": "m12_universal"}
- code: cbse12m.rel.functions
  title: Types of functions and composition
  after:
  - cbse12m.rel.types
  notes: |
    Function f: A → B. One-one (injective): f(x₁) = f(x₂) ⇒ x₁ = x₂. Onto (surjective): range = codomain. Bijective: both.
    Horizontal line test on graphs. f(x) = 2x on ℝ is bijective; f(x) = x² on ℝ is neither. Composition (g∘f)(x) = g(f(x)).
    Invertible iff bijective; f⁻¹ undoes f. Number of bijections from a set of n elements onto itself is n!.
  explanations:
    text: 'A function is one-one if no two inputs share an output, and onto if every possible output is used. A function that is both (bijective) can be reversed: its inverse undoes it. Composition means applying one function, then another.'
    visual: 'Draw arrows from inputs to outputs. One-one: no two arrows hit the same target. Onto: every target gets an arrow. Bijective: perfect pairing.'
    step_by_step: 'Step 1: Set f(x₁) = f(x₂) and see if x₁ = x₂ (one-one). Step 2: Solve y = f(x) for x and check it''s in the domain for every y (onto). Step 3: For composition, work from the inside out.'
    real_world: 'Roll numbers and students in a class form a bijection: each student has exactly one number and each number belongs to one student.'
  picture:
    kind: flow
    steps:
    - Input x
    - Apply f
    - f(x)
    - Apply g
    - g(f(x))
    alt: 'Composition: apply f first, then g, to get g(f(x)).'
  activity:
    type: sort
    prompt: 'One-one: no two inputs share an output. Onto: every element of the codomain is hit. Sort each function.'
    bins:
    - One-one and onto
    - One-one, not onto
    - Onto, not one-one
    - Neither
    items:
    - label: f(x) = 2x, ℝ → ℝ
      bin: One-one and onto
      clue: Can two x give the same 2x? Is every real y = 2x for some x?
      why: '2x₁ = 2x₂ forces x₁ = x₂, and y comes from x = y/2: a bijection.'
    - label: f(x) = 2x, ℕ → ℕ
      bin: One-one, not onto
      clue: Which natural numbers are never doubles?
      why: Distinct inputs give distinct outputs, but odd numbers like 3 are never reached.
    - label: f(x) = x + 1, ℕ → ℕ
      bin: One-one, not onto
      clue: Which natural number is never x + 1?
      why: 1 is never reached, though no two inputs collide.
    - label: f(x) = eˣ, ℝ → ℝ
      bin: One-one, not onto
      clue: Can eˣ ever be negative or 0?
      why: eˣ is always positive, so negatives are never hit; but it never repeats a value.
    - label: f(x) = x³, ℝ → ℝ
      bin: One-one and onto
      clue: Does x³ ever repeat? Does every real have a cube root?
      why: 'x³ always increases, and every real y has a cube root: a bijection.'
    - label: f(x) = x², [0, ∞) → [0, ∞)
      bin: One-one and onto
      clue: With no negative inputs, can two x share an x²?
      why: Restricting the domain removes −x, so it's one-one, and every y ≥ 0 is √y squared.
    - label: f(x) = x², ℝ → [0, ∞)
      bin: Onto, not one-one
      clue: Do 2 and −2 give the same output?
      why: Every y ≥ 0 is hit, but 2 and −2 both give 4.
    - label: f(x) = |x|, ℝ → [0, ∞)
      bin: Onto, not one-one
      clue: Compare |3| and |−3|.
      why: Every y ≥ 0 is reached, but 3 and −3 share 3.
    - label: f(x) = sin x, ℝ → [−1, 1]
      bin: Onto, not one-one
      clue: Does sin x repeat its values?
      why: Every value from −1 to 1 is hit, many times over.
    - label: f(x) = x², ℝ → ℝ
      bin: Neither
      clue: Do ±2 share an output? Is −1 ever reached?
      why: 2 and −2 share 4, and negatives are never reached.
    - label: f(x) = ⌊x⌋ (greatest integer), ℝ → ℝ
      bin: Neither
      clue: Is 0.5 ever an output? Do 1.2 and 1.7 share one?
      why: Only integers come out, and many inputs share each one.
  items:
  - prompt: If f(x) = 2x + 1 and g(x) = x², find (g∘f)(1).
    answer: '9'
    check: (2*1+1)**2
    difficulty: 1
    hints:
    - f(1) = 3.
    - g(3) = 9.
    solution: '9.'
    mistakes: {"3": "m12_composition", "4": "m12_composition"}
  - prompt: If f(x) = 2x + 1 and g(x) = x², find (f∘g)(1).
    answer: '3'
    check: 2*1**2+1
    difficulty: 1
    hints:
    - g(1) = 1.
    - f(1) = 3.
    solution: '3.'
    mistakes: {"9": "m12_composition", "4": "m12_composition"}
  - prompt: If f(x) = 3x − 6, find f⁻¹(0).
    answer: '2'
    check: 6/3
    difficulty: 2
    hints:
    - Solve 3x − 6 = 0.
    - x = 2.
    solution: '2.'
    mistakes: {"-6": "m12_inverse_value", "-2": "m12_inverse_value", "6": "m12_inverse_value"}
  - prompt: How many bijections are there from a set of 3 elements onto itself?
    answer: '6'
    check: factorial(3)
    difficulty: 2
    hints:
    - n!.
    - 3!.
    solution: '6.'
    mistakes: {"3": "m12_bijections", "9": "m12_bijections", "27": "m12_bijections"}
  - prompt: 'f(x) = x² from ℝ to ℝ is:'
    options:
    - neither one-one nor onto
    - one-one only
    - onto only
    - bijective
    answer: neither one-one nor onto
    difficulty: 2
    hints:
    - f(2) = f(−2).
    - No negative outputs.
    solution: Neither one-one nor onto.
    mistakes:
      bijective: c12_onto
  - prompt: 'A function has an inverse exactly when it is:'
    options:
    - bijective
    - one-one only
    - onto only
    - constant
    answer: bijective
    difficulty: 1
    hints:
    - Both one-one and onto.
    - Perfect pairing.
    solution: Bijective.
    mistakes: {"one-one only": "m12_bijective", "onto only": "m12_bijective", "constant": "m12_bijective"}
