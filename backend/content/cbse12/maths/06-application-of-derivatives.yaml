# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse12-math
chapter: 6
title: Application of Derivatives
tips:
  c12_maxmin: At a maximum f′ = 0 and f″ < 0; at a minimum f′ = 0 and f″ > 0.
  c12_rate: 'Related rates: write the formula linking the quantities first, then differentiate with respect to time.'
  m12_critical: "f′(x) = 3x² − 3. Set it to zero."
  m12_decreasing: "f is decreasing where f′(x) < 0. Where is 3x² − 3 negative?"
  m12_endpoints: "On a closed interval, check critical points and both ends."
  m12_exp_inc: "The derivative of eˣ is eˣ, which is always positive."
  m12_increasing: "A positive slope means the graph goes up from left to right."
  m12_max_product: "For a fixed sum, the product is largest when the numbers are equal."
  m12_related_rates: "A = s², so dA/dt = 2s · ds/dt."
  m12_vertex: "Complete the square, or find where f′(x) = 0, then substitute that x back into f."
  c12m6_rate: Write the formula linking the quantities, differentiate with respect to time, then substitute the values given at that instant.
  c12m6_sign: 'Find where f′(x) = 0, then test the sign of f′ in each interval: positive means increasing.'
  c12m6_opt: Set f′(x) = 0 to find the critical point, check it is a max or min, then find the value of f there (not just x).
concepts:
- code: cbse12m.appder.rates
  title: Rate of change and increasing functions
  notes: |
    dy/dx as rate of change; related rates using the chain rule (dA/dt = dA/dr × dr/dt). Increasing on an interval if f′(x)
    > 0, decreasing if f′(x) < 0 (strictly). Critical points where f′ = 0 split the line into intervals to test.
    (Tangents and normals, approximations removed in the rationalised syllabus.)
  explanations:
    text: The derivative tells how fast one quantity changes as another does. If it's positive, the function is going up; if negative, going down. Related-rates problems link the speed of change of two connected quantities.
    visual: 'Picture a circle of ripples spreading on a pond. As the radius grows at 2 cm/s, the area grows faster and faster: dA/dt = 2πr × dr/dt.'
    step_by_step: 'Step 1: Write the formula connecting the quantities. Step 2: Differentiate with respect to time. Step 3: Substitute known values. Step 4: For increasing/decreasing, find where f′ is positive or negative.'
    real_world: Weather forecasters use rates of change of pressure to predict storms.
  picture:
    kind: number_line
    from: -3
    to: 3
    step: 1
    points:
    - at: -1
      label: f′ = 0
    - at: 1
      label: f′ = 0
    alt: 'For f(x) = x³ − 3x, critical points at −1 and 1 split the line: increasing, decreasing, increasing.'
    jumps:
    - from: -3
      to: -1
      label: up
    - from: -1
      to: 1
      label: down
    - from: 1
      to: 3
      label: up
  activity:
    type: formula
    prompt: A ripple's radius r grows at dr/dt. Its area A = πr² grows at dA/dt = 2πr × dr/dt (chain rule).
    inputs:
    - name: r
      label: Radius r
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    - name: v
      label: dr/dt
      min: 0.1
      max: 2
      step: 0.1
      start: 0.1
      unit: cm/s
    outputs:
    - name: area
      label: Area
      expr: pi*r^2
      unit: cm²
      places: 1
    - name: rate
      label: dA/dt
      expr: 2*pi*r*v
      unit: cm²/s
      places: 2
    goals:
    - prompt: When r = 10 cm, make the area grow at 20π ≈ 62.83 cm²/s.
      want:
        r: 10
        rate:
        - 62.8
        - 62.9
      mistakes:
      - when:
          r: 10
          v: 2
        say: 'That''s 125.7: twice as fast. dA/dt = 2π × 10 × dr/dt = 20π means dr/dt = 1.'
      - when:
          r: 10
          v:
          - 0.1
          - 0.9
        say: 'Too slow: you need 2π × 10 × dr/dt = 20π.'
    - prompt: Keep dr/dt = 0.5 cm/s. Find r where the area grows at 10π ≈ 31.42 cm²/s.
      want:
        v: 0.5
        rate:
        - 31.4
        - 31.5
      mistakes:
      - when:
          v: 0.5
          r: 5
        say: r = 5 gives 5π. With dr/dt = 0.5, dA/dt = 2πr × 0.5 = πr, so r = 10.
      - when:
          v: 0.5
          r: 20
        say: r = 20 gives 20π. dA/dt = πr here, so r = 10.
    - prompt: Same dr/dt = 0.5, but r = 20 cm. How fast does the area grow now?
      want:
        v: 0.5
        r: 20
      mistakes:
      - when:
          v: 1
          r: 10
        say: 'That''s a different ripple. Keep dr/dt = 0.5 and let r = 20: the same push on the radius moves twice the rim.'
  lesson:
    - teach: 'dy/dx measures how fast y changes as x changes. When both depend on time t, use the chain rule: dA/dt = dA/dr × dr/dt. For a circle, A = πr², so dA/dt = 2πr × dr/dt.'
      check:
        prompt: r grows at 1 cm/s. How fast does a circle's area grow when r = 3 cm? (multiple of π)
        options:
        - '6'
        - '9'
        - '3'
        answer: '6'
        why: dA/dt = 2π × 3 × 1 = 6π.
    - teach: f is increasing on an interval if f′(x) > 0 there and decreasing if f′(x) < 0. To find these intervals, solve f′(x) = 0 to get critical points, which split the number line; test the sign of f′ in each piece.
      picture:
        kind: number_line
        from: -3
        to: 3
        points:
        - at: -1
          label: critical point
        - at: 1
          label: critical point
        alt: Number line with critical points −1 and 1 splitting it into three intervals to test.
      check:
        prompt: f(x) = x² − 2x. On which interval is f increasing?
        options:
        - (1, ∞)
        - (−∞, 1)
        - (0, 2)
        answer: (1, ∞)
        why: f′(x) = 2x − 2 > 0 when x > 1.
    - teach: 'Tips: a function whose derivative is always positive (like eˣ or x³ + x) is increasing everywhere. A critical point is only where the sign might change; always test both sides.'
      check:
        prompt: f(x) = x³ + x. Is it increasing everywhere?
        options:
        - yes, f′(x) = 3x² + 1 > 0
        - no, it decreases near 0
        - only for x > 0
        answer: yes, f′(x) = 3x² + 1 > 0
        why: 3x² + 1 is never zero or negative.
  items:
  - prompt: The radius of a circle grows at 2 cm/s. How fast (in cm²/s, as a multiple of π) is the area growing when r = 5 cm?
    answer: '20'
    check: 2*5*2
    difficulty: 2
    hints:
    - dA/dt = 2πr dr/dt.
    - 2π × 5 × 2.
    solution: 20π cm²/s.
    mistakes:
      '10': c12_rate
  - prompt: The side of a square grows at 3 cm/s. How fast (cm²/s) is the area growing when the side is 4 cm?
    answer: '24'
    check: 2*4*3
    difficulty: 2
    hints:
    - A = s².
    - 2s × 3.
    solution: 24 cm²/s.
    mistakes: {"12": "m12_related_rates", "48": "m12_related_rates", "9": "m12_related_rates"}
  - prompt: f(x) = x³ − 3x. At what positive x is f′(x) = 0?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - 3x² − 3 = 0.
    - x² = 1.
    solution: x = 1.
    mistakes: {"3": "m12_critical", "0": "m12_critical", "-1": "m12_critical"}
  - prompt: 'f(x) = x³ − 3x is decreasing on:'
    options:
    - (−1, 1)
    - (1, ∞)
    - (−∞, −1)
    - everywhere
    answer: (−1, 1)
    difficulty: 2
    hints:
    - f′ = 3x² − 3.
    - Negative between the roots.
    solution: (−1, 1).
    mistakes: {"(1, ∞)": "m12_decreasing", "(−∞, −1)": "m12_decreasing", "everywhere": "m12_decreasing"}
  - prompt: 'If f′(x) > 0 on an interval, f is:'
    options:
    - increasing there
    - decreasing there
    - constant there
    - zero there
    answer: increasing there
    difficulty: 1
    hints:
    - Positive slope.
    - Going up.
    solution: Increasing.
    mistakes: {"decreasing there": "m12_increasing", "constant there": "m12_increasing", "zero there": "m12_increasing"}
  - prompt: 'f(x) = eˣ is:'
    options:
    - increasing everywhere
    - decreasing everywhere
    - constant
    - increasing only for x > 0
    answer: increasing everywhere
    difficulty: 1
    hints:
    - f′ = eˣ > 0.
    - Always positive.
    solution: Increasing on all reals.
    mistakes: {"decreasing everywhere": "m12_exp_inc", "constant": "m12_exp_inc", "increasing only for x > 0": "m12_exp_inc"}
  - prompt: The side of a cube grows at 1 cm/s. How fast (cm³/s) is the volume growing when the side is 2 cm?
    answer: '12'
    check: 3*2**2*1
    difficulty: 1
    hints:
    - V = s³.
    - dV/dt = 3s² × ds/dt.
    solution: 'Step 1: 3 × 4 × 1. Step 2: 12.'
    mistakes:
      '8': c12m6_rate
      '6': c12m6_rate
  - prompt: y = x² + 3x. Find the rate of change of y with respect to x at x = 2.
    answer: '7'
    check: 2*2 + 3
    difficulty: 1
    hints:
    - Rate of change is the derivative.
    - Differentiate, then put x = 2.
    solution: 'Step 1: 2x + 3. Step 2: 7.'
    mistakes:
      '10': c12m6_rate
      '4': c12m6_rate
  - prompt: f(x) = x² − 6x. At what x is f′(x) = 0?
    answer: '3'
    check: 6/2
    difficulty: 1
    hints:
    - Differentiate.
    - Solve 2x − 6 = 0.
    solution: 'Step 1: f′(x) = 2x − 6. Step 2: x = 3.'
    mistakes:
      '6': c12m6_sign
      '-3': c12m6_sign
  - prompt: 'f(x) = x² − 6x is decreasing on:'
    options:
    - (−∞, 3)
    - (3, ∞)
    - (0, 6)
    answer: (−∞, 3)
    difficulty: 2
    hints:
    - f′(x) = 2x − 6.
    - Where is it negative?
    solution: 'Step 1: 2x − 6 < 0. Step 2: x < 3.'
    mistakes:
      (3, ∞): c12m6_sign
      (0, 6): c12m6_sign
  - prompt: A sphere's radius grows at 0.5 cm/s. How fast (cm³/s, as a multiple of π) is the volume growing when r = 2 cm?
    answer: '8'
    check: 4*2**2*Rational(1,2)
    difficulty: 2
    hints:
    - V = (4/3)πr³.
    - dV/dt = 4πr² × dr/dt.
    solution: 'Step 1: 4π × 4 × 0.5. Step 2: 8π.'
    mistakes:
      '16': c12m6_rate
      '4': c12m6_rate
  - prompt: f(x) = 2x³ − 6x. Find the larger critical point.
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - f′(x) = 6x² − 6.
    - Solve 6x² = 6.
    solution: 'Step 1: x² = 1. Step 2: x = ±1; larger is 1.'
    mistakes:
      '-1': c12m6_sign
      '3': c12m6_sign
  - prompt: 'f(x) = e^(−x) is:'
    options:
    - decreasing everywhere
    - increasing everywhere
    - increasing for x > 0 only
    answer: decreasing everywhere
    difficulty: 2
    hints:
    - Differentiate.
    - Is −e^(−x) ever positive?
    solution: 'Step 1: f′(x) = −e^(−x) < 0. Step 2: decreasing everywhere.'
    mistakes:
      increasing everywhere: c12m6_sign
      increasing for x > 0 only: c12m6_sign
  - prompt: A ladder's foot slides away at 2 m/s. The ladder is 5 m long. How fast (m/s) is the top sliding down when the foot is 3 m from the wall? Give the magnitude as a fraction.
    answer: 3/2
    check: 3*2/4
    difficulty: 3
    hints:
    - x² + y² = 25; when x = 3, y = 4.
    - 'Differentiate: 2x dx/dt + 2y dy/dt = 0.'
    solution: 'Step 1: 3 × 2 + 4 dy/dt = 0. Step 2: dy/dt = −3/2, so 3/2 m/s down.'
    mistakes:
      '2': c12m6_rate
      8/3: c12m6_rate
  - prompt: For which values of x is f(x) = x³ − 12x increasing?
    options:
    - x < −2 or x > 2
    - −2 < x < 2
    - x > 0 only
    answer: x < −2 or x > 2
    difficulty: 3
    hints:
    - f′(x) = 3x² − 12.
    - When is x² > 4?
    solution: 'Step 1: 3x² − 12 > 0 ⇔ x² > 4. Step 2: x < −2 or x > 2.'
    mistakes:
      −2 < x < 2: c12m6_sign
      x > 0 only: c12m6_sign
- code: cbse12m.appder.maxmin
  title: Maxima and minima
  after:
  - cbse12m.appder.rates
  notes: |
    Local maximum/minimum. First derivative test: f′ changes + to − (max) or − to + (min). Second derivative test: f′(c) = 0
    and f″(c) < 0 → local max; f″(c) > 0 → local min; = 0 inconclusive. Absolute max/min on a closed interval: compare
    values at critical points and end points. Word problems: maximise area for fixed perimeter (square), minimise material,
    etc.
  explanations:
    text: 'To find the highest or lowest point of a function, look where the slope is zero. The second derivative tells which it is: negative means a peak (maximum), positive means a valley (minimum). On a closed interval, also check the end points.'
    visual: 'Picture a hill: walking up, the slope is positive; at the top it''s zero; going down it''s negative. That change from + to − marks a maximum.'
    step_by_step: 'Step 1: Find f′(x) and solve f′ = 0. Step 2: Find f″ at each point. Step 3: f″ < 0 → max, f″ > 0 → min. Step 4: On a closed interval, compare with the end values.'
    real_world: Companies use maxima and minima to find the price that gives the most profit or the box shape that uses the least cardboard.
  picture:
    kind: flow
    steps:
    - Find f′(x)
    - Solve f′(x) = 0
    - Find f″ at each point
    - 'f″ < 0: maximum; f″ > 0: minimum'
    alt: The second derivative test for maxima and minima.
  activity:
    type: formula
    prompt: Cut a square of side x from each corner of an 18 cm square sheet and fold up the sides. V = x(18 − 2x)², and V′ = (18 − 2x)(18 − 6x).
    inputs:
    - name: x
      label: Cut x
      min: 0.5
      max: 8.5
      step: 0.5
      start: 0.5
      unit: cm
    outputs:
    - name: v
      label: Volume V
      expr: x*(18-2*x)^2
      unit: cm³
      places: 1
    - name: dv
      label: Slope V′
      expr: (18-2*x)*(18-6*x)
      places: 1
    goals:
    - prompt: Choose the cut that gives the biggest box.
      want:
        x: 3
      mistakes:
      - when:
          x:
          - 0.5
          - 2.5
        say: 'V′ is still positive: a bigger cut still increases V. Keep going until V′ = 0.'
      - when:
          x:
          - 3.5
          - 8.5
        say: 'V′ is negative: you''ve gone past the top. Cut smaller.'
      - when:
          x: 4.5
        say: '4.5 cm leaves a 9 × 9 base but only 364.5 cm³. Watch V′: it''s already negative.'
  lesson:
    - teach: At a local maximum the graph turns from going up to going down, so f′ changes from + to −; at a local minimum it changes from − to +. At both, f′(c) = 0 for a smooth curve.
      check:
        prompt: f′ changes from − to + at x = 2. What does f have at 2?
        options:
        - a local minimum
        - a local maximum
        - neither
        answer: a local minimum
        why: 'Going down, then up: a valley.'
    - teach: 'Second derivative test: if f′(c) = 0 and f″(c) < 0, local max; if f″(c) > 0, local min; if f″(c) = 0, the test does not decide. On a closed interval, the absolute max and min are among the critical points and the end points: compare all those values.'
      picture:
        kind: flow
        steps:
        - Solve f′(x) = 0
        - Check f″ at each point
        - Add the end points
        - Compare f-values
        alt: Steps to find maxima and minima.
      check:
        prompt: f(x) = x² on [−3, 1]. Absolute maximum?
        options:
        - '9'
        - '1'
        - '0'
        answer: '9'
        why: Compare f(−3) = 9, f(0) = 0, f(1) = 1.
    - teach: 'Word problems: write the quantity to optimise as a function of one variable using the constraint, then find its max or min. A rectangle with a fixed perimeter has the largest area when it is a square.'
      check:
        prompt: Perimeter 40 m. Which rectangle has the largest area?
        options:
        - 10 m × 10 m
        - 15 m × 5 m
        - 18 m × 2 m
        answer: 10 m × 10 m
        why: The square gives 100 m², more than 75 or 36.
  items:
  - prompt: Find the minimum value of f(x) = x² − 4x + 7.
    answer: '3'
    check: 2**2-4*2+7
    difficulty: 1
    hints:
    - f′ = 2x − 4 = 0 at x = 2.
    - f(2) = 4 − 8 + 7.
    solution: '3.'
    mistakes: {"2": "m12_vertex", "7": "m12_vertex", "0": "m12_vertex"}
  - prompt: Find the maximum value of f(x) = −x² + 6x.
    answer: '9'
    check: -3**2+6*3
    difficulty: 1
    hints:
    - x = 3.
    - −9 + 18.
    solution: '9.'
    mistakes: {"3": "m12_vertex", "6": "m12_vertex", "36": "m12_vertex"}
  - prompt: Two positive numbers add to 10. What is the largest possible product?
    answer: '25'
    check: 5*5
    difficulty: 2
    hints:
    - x(10 − x).
    - Max at x = 5.
    solution: '25.'
    mistakes: {"24": "m12_max_product", "50": "m12_max_product", "10": "m12_max_product"}
  - prompt: A rectangle has perimeter 20 m. Find the largest possible area (m²).
    answer: '25'
    check: 5*5
    difficulty: 2
    hints:
    - Square gives max.
    - 5 × 5.
    solution: 25 m².
    mistakes: {"20": "m12_max_product", "100": "m12_max_product", "24": "m12_max_product"}
  - prompt: 'If f′(c) = 0 and f″(c) > 0, then at c f has a:'
    options:
    - local minimum
    - local maximum
    - point of inflection always
    - discontinuity
    answer: local minimum
    difficulty: 1
    hints:
    - Concave up.
    - Valley.
    solution: A local minimum.
    mistakes:
      local maximum: c12_maxmin
  - prompt: Find the absolute maximum of f(x) = x² on [−1, 2].
    answer: '4'
    check: max(1, 0, 4)
    difficulty: 2
    hints:
    - Check ends and critical point 0.
    - f(2) = 4.
    solution: '4.'
    mistakes: {"1": "m12_endpoints", "0": "m12_endpoints"}
  - prompt: Find the minimum value of f(x) = x² − 6x + 10.
    answer: '1'
    check: 3**2 - 6*3 + 10
    difficulty: 1
    hints:
    - Solve f′(x) = 0 first.
    - Then put that x back into f.
    solution: 'Step 1: 2x − 6 = 0, x = 3. Step 2: f(3) = 9 − 18 + 10 = 1.'
    mistakes:
      '3': c12m6_opt
      '10': c12m6_opt
  - prompt: Find the maximum value of f(x) = −x² + 4x + 1.
    answer: '5'
    check: -(2**2) + 4*2 + 1
    difficulty: 1
    hints:
    - f′(x) = −2x + 4.
    - Find x, then f(x).
    solution: 'Step 1: x = 2. Step 2: f(2) = −4 + 8 + 1 = 5.'
    mistakes:
      '2': c12m6_opt
      '1': c12m6_opt
  - prompt: Two positive numbers add to 16. What is the largest possible product?
    answer: '64'
    check: 8*8
    difficulty: 1
    hints:
    - Let the numbers be x and 16 − x.
    - Maximise x(16 − x).
    solution: 'Step 1: 16 − 2x = 0, x = 8. Step 2: 8 × 8 = 64.'
    mistakes:
      '8': c12m6_opt
      '63': c12m6_opt
  - prompt: f(x) = x³ − 3x. Find the local maximum value.
    answer: '2'
    check: (-1)**3 - 3*(-1)
    difficulty: 2
    hints:
    - Critical points from 3x² − 3 = 0.
    - f″(x) = 6x is negative at the maximum.
    solution: 'Step 1: x = ±1; f″(−1) < 0. Step 2: f(−1) = −1 + 3 = 2.'
    mistakes:
      '-2': c12m6_opt
      '-1': c12m6_opt
  - prompt: f(x) = x³ − 3x. Find the local minimum value.
    answer: '-2'
    check: 1 - 3
    difficulty: 2
    hints:
    - Use the critical point where f″ > 0.
    - f″(1) = 6.
    solution: 'Step 1: x = 1. Step 2: f(1) = 1 − 3 = −2.'
    mistakes:
      '2': c12m6_opt
      '1': c12m6_opt
  - prompt: Find the absolute minimum of f(x) = x² − 2x on [0, 3].
    answer: '-1'
    check: 1 - 2
    difficulty: 2
    hints:
    - Critical point from 2x − 2 = 0.
    - Compare it with f(0) and f(3).
    solution: 'Step 1: f(1) = −1, f(0) = 0, f(3) = 3. Step 2: minimum −1.'
    mistakes:
      '0': c12m6_opt
      '1': c12m6_opt
  - prompt: Find the absolute maximum of f(x) = x² − 2x on [0, 3].
    answer: '3'
    check: 9 - 6
    difficulty: 2
    hints:
    - The critical point is a minimum here.
    - Check the end points.
    solution: 'Step 1: f(0) = 0, f(3) = 3. Step 2: maximum 3.'
    mistakes:
      '-1': c12m6_opt
      '0': c12m6_opt
  - prompt: A rectangle has area 36 m². Find the least possible perimeter (m).
    answer: '24'
    check: 4*6
    difficulty: 3
    hints:
    - P = 2(x + 36/x).
    - Set dP/dx = 0.
    solution: 'Step 1: 1 − 36/x² = 0, x = 6. Step 2: a 6 × 6 square, P = 24.'
    mistakes:
      '36': c12m6_opt
      '12': c12m6_opt
  - prompt: An open box is made from a 12 cm square sheet by cutting equal squares of side x from the corners. Which x gives the largest volume?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - V = x(12 − 2x)².
    - V′ = (12 − 2x)(12 − 6x) = 0.
    solution: 'Step 1: x = 6 gives zero volume; x = 2 is the other root. Step 2: V(2) = 2 × 64 = 128 cm³, the maximum.'
    mistakes:
      '6': c12m6_opt
      '3': c12m6_opt
