# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse12-math
chapter: 13
title: Probability
tips:
  c12_cond: 'P(A|B) = P(A ∩ B) ÷ P(B): divide by the probability of what you already know happened.'
  c12_indep: 'Independent: P(A ∩ B) = P(A) × P(B). Mutually exclusive: P(A ∩ B) = 0. They are different ideas.'
  m12_bayes: "P(B|faulty) = P(B)P(faulty|B) ÷ P(faulty). Use the total from the last question."
  m12_bayes_use: "Bayes reasons backwards: we see an effect and ask what probably caused it."
  m12_conditional: "P(A|B) = P(A ∩ B) ÷ P(B)."
  m12_expectation: "E(X) = Σ x·p(x)."
  m12_given: "The sample space shrinks to outcomes with at least one head: HH, HT, TH."
  m12_independent: "For independent events, P(A ∩ B) = P(A) × P(B)."
  m12_sum_one: "All probabilities in a distribution add to 1."
  m12_total_prob: "P(red) = P(bag 1)P(red|1) + P(bag 2)P(red|2)."
concepts:
- code: cbse12m.prob.conditional
  title: Conditional probability and independence
  notes: |
    Conditional probability P(A|B) = P(A ∩ B)/P(B), P(B) ≠ 0. Multiplication theorem P(A ∩ B) = P(B)P(A|B). Independent events:
    P(A ∩ B) = P(A)P(B), equivalently P(A|B) = P(A). Mutually exclusive ≠ independent. Total probability: P(A) = Σ P(Eᵢ)P(A|Eᵢ)
    for a partition E₁…Eₙ.
  explanations:
    text: 'Conditional probability is the chance of A when you already know B has happened: P(A|B) = P(A and B) ÷ P(B). Events are independent if knowing one doesn''t change the chance of the other.'
    visual: Roll a die and you're told the number is even (2, 4 or 6). The chance it's a 6 is now 1 out of 3, not 1 out of 6.
    step_by_step: 'Step 1: Find P(A ∩ B). Step 2: Find P(B). Step 3: Divide. Step 4: For independence, check P(A ∩ B) = P(A)P(B).'
    real_world: Doctors use conditional probability to judge how likely a disease is given a positive test result.
  picture:
    kind: flow
    steps:
    - Know B happened
    - Restrict to outcomes in B
    - Count those also in A
    - P(A|B) = P(A ∩ B)/P(B)
    alt: 'Conditional probability: restrict to B, then find the share that is also in A.'
  activity:
    type: formula
    prompt: P(A|B) = P(A ∩ B) ÷ P(B). A and B are independent when P(A ∩ B) = P(A) × P(B), so P(A|B) = P(A).
    inputs:
    - name: pa
      label: P(A)
      min: 0
      max: 1
      step: 0.05
      start: 0
    - name: pb
      label: P(B)
      min: 0.05
      max: 1
      step: 0.05
      start: 0.05
    - name: pab
      label: P(A ∩ B)
      min: 0
      max: 1
      step: 0.05
      start: 0
    outputs:
    - name: cond
      label: P(A|B)
      expr: pab/pb
      places: 2
    - name: prod
      label: P(A) × P(B)
      expr: pa*pb
      places: 3
    goals:
    - prompt: P(A) = 0.5 and P(B) = 0.4. Make A and B independent.
      want:
        pa: 0.5
        pb: 0.4
        pab: 0.2
      mistakes:
      - when:
          pa: 0.5
          pb: 0.4
          pab: 0
        say: 'P(A ∩ B) = 0 makes them mutually exclusive, almost the opposite of independent: if B happens, A can''t.'
      - when:
          pa: 0.5
          pb: 0.4
          pab: 0.9
        say: 0.9 is P(A) + P(B). Independent means P(A ∩ B) = P(A) × P(B).
    - prompt: P(A|B) = 0.6 and P(B) = 0.5. Set P(A ∩ B).
      want:
        pb: 0.5
        cond: 0.6
      mistakes:
      - when:
          pb: 0.5
          pab: 0.6
        say: 0.6 is P(A|B), the chance of A among the B cases. P(A ∩ B) = P(B) × P(A|B).
    - prompt: 'P(A) = 0.3 and P(B) = 0.5. Make B make A MORE likely: P(A|B) > P(A).'
      want:
        pa: 0.3
        pb: 0.5
        cond:
        - 0.35
        - 1
      mistakes:
      - when:
          pa: 0.3
          pb: 0.5
          pab: 0.15
        say: 'That''s exactly independent: P(A|B) = P(A) = 0.3.'
      - when:
          pa: 0.3
          pb: 0.5
          cond:
          - 0
          - 0.29
        say: B makes A LESS likely here. Raise the overlap.
  items:
  - prompt: A die is rolled; the result is even. Find the probability it is 6, as a fraction.
    answer: 1/3
    check: Rational(1,3)
    difficulty: 1
    hints:
    - 'Even: 2, 4, 6.'
    - One of three.
    solution: 1/3.
    mistakes:
      1/6: c12_cond
  - prompt: P(A ∩ B) = 0.2 and P(B) = 0.5. Find P(A|B) as a fraction.
    answer: 2/5
    check: Rational(2,10)/Rational(5,10)
    difficulty: 1
    hints:
    - 0.2 ÷ 0.5.
    - = 0.4.
    solution: 2/5.
    mistakes: {"1/10": "m12_conditional", "1/2": "m12_conditional"}
  - prompt: A and B are independent with P(A) = 1/2, P(B) = 1/3. Find P(A ∩ B).
    answer: 1/6
    check: Rational(1,2)*Rational(1,3)
    difficulty: 1
    hints:
    - Multiply.
    - 1/2 × 1/3.
    solution: 1/6.
    mistakes: {"5/6": "m12_independent", "1/2": "m12_independent"}
  - prompt: Two coins are tossed. Find P(both heads | at least one head) as a fraction.
    answer: 1/3
    check: Rational(1,3)
    difficulty: 2
    hints:
    - 'At least one head: HH, HT, TH.'
    - HH is one of three.
    solution: 1/3.
    mistakes: {"1/4": "m12_given", "1/2": "m12_given"}
  - prompt: 'If A and B are mutually exclusive with non-zero probabilities, they are:'
    options:
    - not independent
    - independent
    - equal
    - certain
    answer: not independent
    difficulty: 2
    hints:
    - P(A ∩ B) = 0 ≠ P(A)P(B).
    - Knowing A rules out B.
    solution: Not independent.
    mistakes:
      independent: c12_indep
  - prompt: Bag 1 is chosen with probability 1/2 and has 3 red of 5; bag 2 likewise has 1 red of 5. Find P(red).
    answer: 2/5
    check: Rational(1,2)*Rational(3,5)+Rational(1,2)*Rational(1,5)
    difficulty: 2
    hints:
    - ½ × 3/5 + ½ × 1/5.
    - Total probability.
    solution: 2/5.
    mistakes: {"4/5": "m12_total_prob", "3/5": "m12_total_prob", "1/5": "m12_total_prob"}
- code: cbse12m.prob.bayes
  title: Bayes' theorem and random variables
  after:
  - cbse12m.prob.conditional
  notes: |
    Bayes' theorem: P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σ P(Eⱼ)P(A|Eⱼ): reverse conditional probability. Random variable: numerical outcome;
    probability distribution (Σ pᵢ = 1). Mean (expectation) E(X) = Σ xᵢpᵢ. (Variance and binomial distribution removed in
    rationalised syllabus.)
  explanations:
    text: 'Bayes'' theorem lets you work backwards: given that something happened, how likely was each possible cause? A random variable gives a number to each outcome, and its mean (expected value) is the long-run average.'
    visual: 'Two machines make bulbs: A makes 60% (2% faulty), B 40% (5% faulty). Given a faulty bulb, Bayes tells you the chance it came from B.'
    step_by_step: 'Step 1: List the causes and their probabilities. Step 2: Find P(event | each cause). Step 3: Multiply and add for the total. Step 4: Divide the cause''s share by the total.'
    real_world: Spam filters use Bayes' theorem to decide whether an email with certain words is likely to be spam.
  picture:
    kind: compare
    columns:
    - title: Cause
      points:
      - Machine A
      - Machine B
    - title: Share of bulbs
      points:
      - 60%
      - 40%
    - title: Faulty rate
      points:
      - 2%
      - 5%
    alt: 'Two machines making bulbs: their shares and faulty rates, used in Bayes'' theorem.'
  activity:
    type: formula
    prompt: 'Machine A makes a share of the bolts; the rest come from B. Bayes: P(A|faulty) = P(A)P(F|A) ÷ [P(A)P(F|A) + P(B)P(F|B)].'
    inputs:
    - name: pa
      label: Share from A
      min: 0
      max: 1
      step: 0.05
      start: 0.5
    - name: da
      label: A's faulty rate
      min: 0
      max: 0.1
      step: 0.01
      start: 0.01
    - name: db
      label: B's faulty rate
      min: 0
      max: 0.1
      step: 0.01
      start: 0.01
    outputs:
    - name: pf
      label: P(faulty)
      expr: pa*da+(1-pa)*db
      places: 4
    - name: post
      label: P(A | faulty)
      expr: pa*da/(pa*da+(1-pa)*db)
      places: 3
    goals:
    - prompt: A makes 60% with 2% faulty; B makes 40% with 5% faulty. Set it up and read P(A | faulty).
      want:
        pa: 0.6
        da: 0.02
        db: 0.05
      mistakes:
      - when:
          pa: 0.6
          da: 0.05
          db: 0.02
        say: 'Rates swapped: A''s faulty rate is 2%, B''s is 5%.'
      - when:
          pa: 0.4
          da: 0.02
          db: 0.05
        say: A makes 60%, not 40%.
    - prompt: A makes 80% of bolts. Choose the faulty rates so a faulty bolt is equally likely to come from A or B.
      want:
        pa: 0.8
        post: 0.5
      mistakes:
      - when:
          pa: 0.8
          post:
          - 0.51
          - 1
        say: 'A still gets most of the blame: it makes 80% of bolts. B must be much worse to balance: 0.8 × P(F|A) = 0.2 × P(F|B).'
      - when:
          pa: 0.8
          post:
          - 0
          - 0.49
        say: 'Now B gets more of the blame. Balance them: 0.8 × P(F|A) = 0.2 × P(F|B).'
    - prompt: A makes 90% of bolts. Make P(A | faulty) below 0.5.
      want:
        pa: 0.9
        post:
        - 0
        - 0.49
      mistakes:
      - when:
          pa: 0.9
          post:
          - 0.5
          - 1
        say: Still 0.5 or more. A big machine can rarely be to blame only if its faulty rate is tiny compared with B's.
  items:
  - prompt: Machine A makes 60% of bulbs (2% faulty), B 40% (5% faulty). Find P(faulty) as a fraction.
    answer: 4/125
    check: Rational(6,10)*Rational(2,100)+Rational(4,10)*Rational(5,100)
    difficulty: 2
    hints:
    - 0.6 × 0.02 + 0.4 × 0.05.
    - 0.012 + 0.02.
    solution: 0.032 = 4/125.
    mistakes: {"7/100": "m12_total_prob", "7/200": "m12_total_prob"}
  - prompt: In the same case, find P(from B | faulty) as a fraction.
    answer: 5/8
    check: (Rational(4,10)*Rational(5,100))/(Rational(6,10)*Rational(2,100)+Rational(4,10)*Rational(5,100))
    difficulty: 2
    hints:
    - 0.02 ÷ 0.032.
    - Bayes.
    solution: 5/8.
    mistakes: {"2/5": "m12_bayes", "3/8": "m12_bayes"}
  - prompt: X takes values 0, 1, 2 with probabilities 1/4, 1/2, 1/4. Find E(X).
    answer: '1'
    check: 0*Rational(1,4)+1*Rational(1,2)+2*Rational(1,4)
    difficulty: 1
    hints:
    - Σ x p.
    - 0 + 1/2 + 1/2.
    solution: '1.'
    mistakes: {"1/2": "m12_expectation", "2": "m12_expectation"}
  - prompt: Find the expected value of the number shown on a fair die, as a fraction.
    answer: 7/2
    check: Rational(21,6)
    difficulty: 1
    hints:
    - (1 + ... + 6)/6.
    - 21/6.
    solution: 3.5.
    mistakes: {"3": "m12_expectation", "21": "m12_expectation", "6": "m12_expectation"}
  - prompt: Probabilities in a distribution are 0.2, 0.5 and k. Find k as a fraction.
    answer: 3/10
    check: 1-Rational(7,10)
    difficulty: 1
    hints:
    - They add to 1.
    - 1 − 0.7.
    solution: 0.3.
    mistakes: {"7/10": "m12_sum_one", "1/2": "m12_sum_one"}
  - prompt: 'Bayes'' theorem is used to find:'
    options:
    - the probability of a cause given an observed result
    - the mean only
    - the number of outcomes
    - areas
    answer: the probability of a cause given an observed result
    difficulty: 2
    hints:
    - Reverse conditional.
    - Posterior.
    solution: The probability of a cause given what was observed.
    mistakes: {"the mean only": "m12_bayes_use", "the number of outcomes": "m12_bayes_use", "areas": "m12_bayes_use"}
