# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse12-math
chapter: 13
title: Probability
tips:
  c12_cond: 'P(A|B) = P(A ∩ B) ÷ P(B): divide by the probability of what you already know happened.'
  c12_indep: "Independent means P(A ∩ B) = P(A) × P(B). If A and B are mutually exclusive, P(A ∩ B) = 0. Can a product of two non-zero numbers be 0?"
  m12_bayes: "P(B|faulty) = P(B)P(faulty|B) ÷ P(faulty). Use the total from the last question."
  m12_bayes_use: "Bayes reasons backwards: we see an effect and ask what probably caused it."
  m12_conditional: "P(A|B) = P(A ∩ B) ÷ P(B)."
  m12_expectation: "E(X) = Σ x·p(x)."
  m12_given: "The sample space shrinks to outcomes with at least one head: HH, HT, TH."
  m12_independent: "For independent events, P(A ∩ B) = P(A) × P(B)."
  m12_sum_one: "All probabilities in a distribution add to 1."
  m12_total_prob: "P(red) = P(bag 1)P(red|1) + P(bag 2)P(red|2)."
  c12m13_cond: 'Given B means B is now the whole sample space: count only outcomes inside B, then see how many are also in A.'
  c12m13_ind: Independent means P(A ∩ B) = P(A) × P(B). Mutually exclusive means P(A ∩ B) = 0. They are different ideas.
  c12m13_bayes: 'Bayes: the cause''s share of the total. Top = P(cause) × P(result | cause); bottom = the sum of that over all causes.'
  c12m13_ev: E(X) = Σ x × p. Multiply each value by its probability, then add.
concepts:
- code: cbse12m.prob.conditional
  title: Conditional probability and independence
  notes: |
    Conditional probability P(A|B) = P(A ∩ B)/P(B), P(B) ≠ 0. Multiplication theorem P(A ∩ B) = P(B)P(A|B). Independent events:
    P(A ∩ B) = P(A)P(B), equivalently P(A|B) = P(A). Mutually exclusive ≠ independent. Total probability: P(A) = Σ P(Eᵢ)P(A|Eᵢ)
    for a partition E₁…Eₙ.
  explanations:
    text: 'Conditional probability is the chance of A when you already know B has happened: P(A|B) = P(A and B) ÷ P(B). Events are independent if knowing one doesn''t change the chance of the other.'
    visual: Roll a die and you're told the number is even (2, 4 or 6). The chance it's a 6 is now 1 out of 3, not 1 out of 6.
    step_by_step: 'Step 1: Find P(A ∩ B). Step 2: Find P(B). Step 3: Divide. Step 4: For independence, check P(A ∩ B) = P(A)P(B).'
    real_world: Doctors use conditional probability to judge how likely a disease is given a positive test result.
  picture:
    kind: flow
    steps:
    - Know B happened
    - Restrict to outcomes in B
    - Count those also in A
    - P(A|B) = P(A ∩ B)/P(B)
    alt: 'Conditional probability: restrict to B, then find the share that is also in A.'
  activity:
    type: formula
    prompt: P(A|B) = P(A ∩ B) ÷ P(B). A and B are independent when P(A ∩ B) = P(A) × P(B), so P(A|B) = P(A).
    inputs:
    - name: pa
      label: P(A)
      min: 0
      max: 1
      step: 0.05
      start: 0
    - name: pb
      label: P(B)
      min: 0.05
      max: 1
      step: 0.05
      start: 0.05
    - name: pab
      label: P(A ∩ B)
      min: 0
      max: 1
      step: 0.05
      start: 0
    outputs:
    - name: cond
      label: P(A|B)
      expr: pab/pb
      places: 2
    - name: prod
      label: P(A) × P(B)
      expr: pa*pb
      places: 3
    goals:
    - prompt: P(A) = 0.5 and P(B) = 0.4. Make A and B independent.
      want:
        pa: 0.5
        pb: 0.4
        pab: 0.2
      mistakes:
      - when:
          pa: 0.5
          pb: 0.4
          pab: 0
        say: 'P(A ∩ B) = 0 makes them mutually exclusive, almost the opposite of independent: if B happens, A can''t.'
      - when:
          pa: 0.5
          pb: 0.4
          pab: 0.9
        say: 0.9 is P(A) + P(B). Independent means P(A ∩ B) = P(A) × P(B).
    - prompt: P(A|B) = 0.6 and P(B) = 0.5. Set P(A ∩ B).
      want:
        pb: 0.5
        cond: 0.6
      mistakes:
      - when:
          pb: 0.5
          pab: 0.6
        say: 0.6 is P(A|B), the chance of A among the B cases. P(A ∩ B) = P(B) × P(A|B).
    - prompt: 'P(A) = 0.3 and P(B) = 0.5. Make B make A MORE likely: P(A|B) > P(A).'
      want:
        pa: 0.3
        pb: 0.5
        cond:
        - 0.35
        - 1
      mistakes:
      - when:
          pa: 0.3
          pb: 0.5
          pab: 0.15
        say: 'That''s exactly independent: P(A|B) = P(A) = 0.3.'
      - when:
          pa: 0.3
          pb: 0.5
          cond:
          - 0
          - 0.29
        say: B makes A LESS likely here. Raise the overlap.
  lesson:
    - teach: 'P(A|B), read ''A given B'', is the probability of A when we already know B happened. B becomes the new sample space: P(A|B) = P(A ∩ B)/P(B), with P(B) ≠ 0.'
      check:
        prompt: A die shows a number greater than 3. Probability it is 5?
        options:
        - 1/3
        - 1/6
        - 1/2
        answer: 1/3
        why: Given {4, 5, 6}, one of three outcomes is 5.
    - teach: 'Multiplication rule: P(A ∩ B) = P(B) × P(A|B). A and B are independent if knowing B does not change A: P(A|B) = P(A), or P(A ∩ B) = P(A)P(B). Mutually exclusive events (cannot both happen) with non-zero probabilities are never independent.'
      picture:
        kind: compare
        columns:
        - title: Independent
          points:
          - P(A ∩ B) = P(A)P(B)
          - one doesn't affect the other
          - two coin tosses
        - title: Mutually exclusive
          points:
          - P(A ∩ B) = 0
          - cannot happen together
          - a die shows 1 or 2
        alt: Independent events compared with mutually exclusive events.
      check:
        prompt: P(A) = 0.4, P(B) = 0.5, independent. P(A ∩ B)?
        options:
        - '0.2'
        - '0.9'
        - '0.1'
        answer: '0.2'
        why: 0.4 × 0.5 = 0.2.
    - teach: 'Total probability: if E₁, E₂, … split the sample space (one and only one happens), then P(A) = P(E₁)P(A|E₁) + P(E₂)P(A|E₂) + … Draw a tree: multiply along branches, add the branches that end in A.'
      check:
        prompt: P(E₁) = P(E₂) = 1/2, P(A|E₁) = 1/2, P(A|E₂) = 1/4. P(A)?
        options:
        - 3/8
        - 3/4
        - 1/8
        answer: 3/8
        why: 1/4 + 1/8 = 3/8.
  items:
  - prompt: A die is rolled; the result is even. Find the probability it is 6, as a fraction.
    answer: 1/3
    check: Rational(1,3)
    difficulty: 1
    hints:
    - 'Even: 2, 4, 6.'
    - One of three.
    solution: 1/3.
    mistakes:
      1/6: c12_cond
  - prompt: P(A ∩ B) = 0.2 and P(B) = 0.5. Find P(A|B) as a fraction.
    answer: 2/5
    check: Rational(2,10)/Rational(5,10)
    difficulty: 1
    hints:
    - 0.2 ÷ 0.5.
    - = 0.4.
    solution: 2/5.
    mistakes: {"1/10": "m12_conditional", "1/2": "m12_conditional"}
  - prompt: A and B are independent with P(A) = 1/2, P(B) = 1/3. Find P(A ∩ B).
    answer: 1/6
    check: Rational(1,2)*Rational(1,3)
    difficulty: 1
    hints:
    - Multiply.
    - 1/2 × 1/3.
    solution: 1/6.
    mistakes: {"5/6": "m12_independent", "1/2": "m12_independent"}
  - prompt: Two coins are tossed. Find P(both heads | at least one head) as a fraction.
    answer: 1/3
    check: Rational(1,3)
    difficulty: 2
    hints:
    - 'At least one head: HH, HT, TH.'
    - HH is one of three.
    solution: 1/3.
    mistakes: {"1/4": "m12_given", "1/2": "m12_given"}
  - prompt: 'If A and B are mutually exclusive with non-zero probabilities, they are:'
    options:
    - not independent
    - independent
    - equal
    - certain
    answer: not independent
    difficulty: 2
    hints:
    - P(A ∩ B) = 0 ≠ P(A)P(B).
    - Knowing A rules out B.
    solution: Not independent.
    mistakes:
      independent: c12_indep
  - prompt: Bag 1 is chosen with probability 1/2 and has 3 red of 5; bag 2 likewise has 1 red of 5. Find P(red).
    answer: 2/5
    check: Rational(1,2)*Rational(3,5)+Rational(1,2)*Rational(1,5)
    difficulty: 2
    hints:
    - ½ × 3/5 + ½ × 1/5.
    - Total probability.
    solution: 2/5.
    mistakes: {"4/5": "m12_total_prob", "3/5": "m12_total_prob", "1/5": "m12_total_prob"}
  - prompt: A card is drawn from 1 to 10; it is even. Find the probability it is 4, as a fraction.
    answer: 1/5
    check: Rational(1,5)
    difficulty: 1
    hints:
    - The evens are 2, 4, 6, 8, 10.
    - How many of these are 4?
    solution: 'Step 1: 5 evens. Step 2: 1/5.'
    mistakes:
      1/10: c12m13_cond
      1/2: c12m13_cond
  - prompt: P(A ∩ B) = 0.3 and P(B) = 0.6. Find P(A|B) as a fraction.
    answer: 1/2
    check: Rational(3,6)
    difficulty: 1
    hints:
    - Divide the joint probability by P(B).
    - 0.3/0.6.
    solution: 'Step 1: 0.3/0.6. Step 2: 1/2.'
    mistakes:
      9/50: c12m13_cond
      1/5: c12m13_cond
  - prompt: A and B are independent with P(A) = 1/4, P(B) = 2/3. Find P(A ∩ B) as a fraction.
    answer: 1/6
    check: Rational(1,4)*Rational(2,3)
    difficulty: 1
    hints:
    - 'Independent: multiply.'
    - 1/4 × 2/3.
    solution: 'Step 1: 2/12. Step 2: 1/6.'
    mistakes:
      11/12: c12m13_ind
      3/7: c12m13_ind
  - prompt: Two dice are rolled; the sum is 4. Find the probability both show 2, as a fraction.
    answer: 1/3
    check: Rational(1,3)
    difficulty: 2
    hints:
    - List outcomes with sum 4.
    - (1, 3), (2, 2), (3, 1).
    solution: 'Step 1: 3 outcomes. Step 2: one is (2, 2): 1/3.'
    mistakes:
      1/36: c12m13_cond
      1/12: c12m13_cond
  - prompt: P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.2. Are A and B independent?
    options:
    - 'yes'
    - 'no'
    - cannot tell
    answer: 'yes'
    difficulty: 2
    hints:
    - Compare P(A)P(B) with P(A ∩ B).
    - 0.5 × 0.4 = ?
    solution: 'Step 1: P(A)P(B) = 0.2. Step 2: equals P(A ∩ B), so independent.'
    mistakes:
      'no': c12m13_ind
      cannot tell: c12m13_ind
  - prompt: Two cards are drawn without replacement from 3 red and 2 black. Find P(both red) as a fraction.
    answer: 3/10
    check: Rational(3,5)*Rational(2,4)
    difficulty: 2
    hints:
    - 'First red: 3/5.'
    - 'Second red given the first was red: 2/4.'
    solution: 'Step 1: 3/5 × 2/4. Step 2: 6/20 = 3/10.'
    mistakes:
      9/25: c12m13_cond
      1/2: c12m13_cond
  - prompt: P(A) = 0.6, P(B) = 0.5, independent. Find P(A ∪ B) as a fraction.
    answer: 4/5
    check: Rational(6,10) + Rational(5,10) - Rational(3,10)
    difficulty: 2
    hints:
    - P(A ∪ B) = P(A) + P(B) − P(A ∩ B).
    - P(A ∩ B) = 0.3.
    solution: 'Step 1: 0.6 + 0.5 − 0.3. Step 2: 0.8 = 4/5.'
    mistakes:
      11/10: c12m13_ind
      3/10: c12m13_ind
  - prompt: Bag 1 (chosen with probability 1/3) has 2 white of 4; bag 2 (probability 2/3) has 1 white of 4. Find P(white) as a fraction.
    answer: 1/3
    check: Rational(1,3)*Rational(2,4) + Rational(2,3)*Rational(1,4)
    difficulty: 3
    hints:
    - Use total probability.
    - 1/3 × 1/2 + 2/3 × 1/4.
    solution: 'Step 1: 1/6 + 1/6. Step 2: 1/3.'
    mistakes:
      3/8: c12m13_cond
      1/2: c12m13_cond
  - prompt: A family has two children; at least one is a girl. Find P(both are girls) as a fraction (each child equally likely girl or boy).
    answer: 1/3
    check: Rational(1,3)
    difficulty: 3
    hints:
    - List GG, GB, BG, BB.
    - Remove the one that has no girl.
    solution: 'Step 1: GG, GB, BG remain. Step 2: 1/3.'
    mistakes:
      1/2: c12m13_cond
      1/4: c12m13_cond
- code: cbse12m.prob.bayes
  title: Bayes' theorem and random variables
  after:
  - cbse12m.prob.conditional
  notes: |
    Bayes' theorem: P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σ P(Eⱼ)P(A|Eⱼ): reverse conditional probability. Random variable: numerical outcome;
    probability distribution (Σ pᵢ = 1). Mean (expectation) E(X) = Σ xᵢpᵢ. (Variance and binomial distribution removed in
    rationalised syllabus.)
  explanations:
    text: 'Bayes'' theorem lets you work backwards: given that something happened, how likely was each possible cause? A random variable gives a number to each outcome, and its mean (expected value) is the long-run average.'
    visual: 'Two machines make bulbs: A makes 60% (2% faulty), B 40% (5% faulty). Given a faulty bulb, Bayes tells you the chance it came from B.'
    step_by_step: 'Step 1: List the causes and their probabilities. Step 2: Find P(event | each cause). Step 3: Multiply and add for the total. Step 4: Divide the cause''s share by the total.'
    real_world: Spam filters use Bayes' theorem to decide whether an email with certain words is likely to be spam.
  picture:
    kind: compare
    columns:
    - title: Cause
      points:
      - Machine A
      - Machine B
    - title: Share of bulbs
      points:
      - 60%
      - 40%
    - title: Faulty rate
      points:
      - 2%
      - 5%
    alt: 'Two machines making bulbs: their shares and faulty rates, used in Bayes'' theorem.'
  activity:
    type: formula
    prompt: 'Machine A makes a share of the bolts; the rest come from B. Bayes: P(A|faulty) = P(A)P(F|A) ÷ [P(A)P(F|A) + P(B)P(F|B)].'
    inputs:
    - name: pa
      label: Share from A
      min: 0
      max: 1
      step: 0.05
      start: 0.5
    - name: da
      label: A's faulty rate
      min: 0
      max: 0.1
      step: 0.01
      start: 0.01
    - name: db
      label: B's faulty rate
      min: 0
      max: 0.1
      step: 0.01
      start: 0.01
    outputs:
    - name: pf
      label: P(faulty)
      expr: pa*da+(1-pa)*db
      places: 4
    - name: post
      label: P(A | faulty)
      expr: pa*da/(pa*da+(1-pa)*db)
      places: 3
    goals:
    - prompt: A makes 60% with 2% faulty; B makes 40% with 5% faulty. Set it up and read P(A | faulty).
      want:
        pa: 0.6
        da: 0.02
        db: 0.05
      mistakes:
      - when:
          pa: 0.6
          da: 0.05
          db: 0.02
        say: 'Rates swapped: A''s faulty rate is 2%, B''s is 5%.'
      - when:
          pa: 0.4
          da: 0.02
          db: 0.05
        say: A makes 60%, not 40%.
    - prompt: A makes 80% of bolts. Choose the faulty rates so a faulty bolt is equally likely to come from A or B.
      want:
        pa: 0.8
        post: 0.5
      mistakes:
      - when:
          pa: 0.8
          post:
          - 0.51
          - 1
        say: 'A still gets most of the blame: it makes 80% of bolts. B must be much worse to balance: 0.8 × P(F|A) = 0.2 × P(F|B).'
      - when:
          pa: 0.8
          post:
          - 0
          - 0.49
        say: 'Now B gets more of the blame. Balance them: 0.8 × P(F|A) = 0.2 × P(F|B).'
    - prompt: A makes 90% of bolts. Make P(A | faulty) below 0.5.
      want:
        pa: 0.9
        post:
        - 0
        - 0.49
      mistakes:
      - when:
          pa: 0.9
          post:
          - 0.5
          - 1
        say: Still 0.5 or more. A big machine can rarely be to blame only if its faulty rate is tiny compared with B's.
  lesson:
    - teach: 'Bayes'' theorem reverses a conditional: from P(result | cause) it finds P(cause | result). P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σ P(Eⱼ)P(A|Eⱼ). The bottom is just total probability P(A).'
      check:
        prompt: 'Bayes'' theorem finds:'
        options:
        - the chance of a cause, given what was observed
        - the mean of a random variable
        - the number of outcomes
        answer: the chance of a cause, given what was observed
        why: It works backwards from the result to the cause.
    - teach: 'Example: bag I (chosen with probability 1/2) has 3 red of 4; bag II (1/2) has 1 red of 4. A red ball is drawn. P(red) = 3/8 + 1/8 = 1/2. P(bag I | red) = (3/8)/(1/2) = 3/4.'
      picture:
        kind: flow
        steps:
        - 'Branch: P(cause)'
        - Times P(result | cause)
        - 'Add all branches: P(result)'
        - Your branch ÷ total
        alt: Steps of Bayes' theorem on a probability tree.
      check:
        prompt: In the example, find P(bag II | red).
        options:
        - 1/4
        - 1/8
        - 1/2
        answer: 1/4
        why: (1/8)/(1/2) = 1/4, and 3/4 + 1/4 = 1.
    - teach: A random variable X assigns a number to each outcome. Its probability distribution lists values xᵢ with probabilities pᵢ, all ≥ 0 and adding to 1. The mean or expectation is E(X) = Σ xᵢpᵢ.
      check:
        prompt: X = 1 or 3 with probabilities 1/2 each. E(X)?
        options:
        - '2'
        - '4'
        - 3/2
        answer: '2'
        why: 1 × 1/2 + 3 × 1/2 = 2.
  items:
  - prompt: Machine A makes 60% of bulbs (2% faulty), B 40% (5% faulty). Find P(faulty) as a fraction.
    answer: 4/125
    check: Rational(6,10)*Rational(2,100)+Rational(4,10)*Rational(5,100)
    difficulty: 2
    hints:
    - 0.6 × 0.02 + 0.4 × 0.05.
    - 0.012 + 0.02.
    solution: 0.032 = 4/125.
    mistakes: {"7/100": "m12_total_prob", "7/200": "m12_total_prob"}
  - prompt: In the same case, find P(from B | faulty) as a fraction.
    answer: 5/8
    check: (Rational(4,10)*Rational(5,100))/(Rational(6,10)*Rational(2,100)+Rational(4,10)*Rational(5,100))
    difficulty: 2
    hints:
    - 0.02 ÷ 0.032.
    - Bayes.
    solution: 5/8.
    mistakes: {"2/5": "m12_bayes", "3/8": "m12_bayes"}
  - prompt: X takes values 0, 1, 2 with probabilities 1/4, 1/2, 1/4. Find E(X).
    answer: '1'
    check: 0*Rational(1,4)+1*Rational(1,2)+2*Rational(1,4)
    difficulty: 1
    hints:
    - Σ x p.
    - 0 + 1/2 + 1/2.
    solution: '1.'
    mistakes: {"1/2": "m12_expectation", "2": "m12_expectation"}
  - prompt: Find the expected value of the number shown on a fair die, as a fraction.
    answer: 7/2
    check: Rational(21,6)
    difficulty: 1
    hints:
    - (1 + ... + 6)/6.
    - 21/6.
    solution: 3.5.
    mistakes: {"3": "m12_expectation", "21": "m12_expectation", "6": "m12_expectation"}
  - prompt: Probabilities in a distribution are 0.2, 0.5 and k. Find k as a fraction.
    answer: 3/10
    check: 1-Rational(7,10)
    difficulty: 1
    hints:
    - They add to 1.
    - 1 − 0.7.
    solution: 0.3.
    mistakes: {"7/10": "m12_sum_one", "1/2": "m12_sum_one"}
  - prompt: 'Bayes'' theorem is used to find:'
    options:
    - the probability of a cause given an observed result
    - the mean only
    - the number of outcomes
    - areas
    answer: the probability of a cause given an observed result
    difficulty: 2
    hints:
    - Reverse conditional.
    - Posterior.
    solution: The probability of a cause given what was observed.
    mistakes: {"the mean only": "m12_bayes_use", "the number of outcomes": "m12_bayes_use", "areas": "m12_bayes_use"}
  - prompt: Bag I (prob 1/2) has 2 red of 5; bag II (prob 1/2) has 4 red of 5. A red is drawn. Find P(bag II | red) as a fraction.
    answer: 2/3
    check: (Rational(1,2)*Rational(4,5))/(Rational(1,2)*Rational(2,5) + Rational(1,2)*Rational(4,5))
    difficulty: 1
    hints:
    - 'Bag II''s branch: 1/2 × 4/5.'
    - Divide by the total of both branches.
    solution: 'Step 1: 2/5 ÷ (1/5 + 2/5) = 2/5 ÷ 3/5. Step 2: 2/3.'
    mistakes:
      4/5: c12m13_bayes
      1/3: c12m13_bayes
  - prompt: X takes 1, 2, 3 with probabilities 1/2, 1/3, 1/6. Find E(X) as a fraction.
    answer: 5/3
    check: 1*Rational(1,2) + 2*Rational(1,3) + 3*Rational(1,6)
    difficulty: 1
    hints:
    - Multiply each value by its probability.
    - 1/2 + 2/3 + 1/2.
    solution: 'Step 1: 3/6 + 4/6 + 3/6 = 10/6. Step 2: 5/3.'
    mistakes:
      '2': c12m13_ev
      '1': c12m13_ev
  - prompt: A distribution has probabilities 1/4, 1/4 and k. Find k as a fraction.
    answer: 1/2
    check: 1 - Rational(1,4) - Rational(1,4)
    difficulty: 1
    hints:
    - The probabilities must add to 1.
    - 1 − 1/4 − 1/4.
    solution: 'Step 1: 1 − 1/2. Step 2: 1/2.'
    mistakes:
      1/4: c12m13_ev
      3/4: c12m13_ev
  - prompt: A coin is tossed twice; X = number of heads. Find E(X).
    answer: '1'
    check: 0*Rational(1,4) + 1*Rational(1,2) + 2*Rational(1,4)
    difficulty: 2
    hints:
    - P(X = 0) = 1/4, P(X = 1) = 1/2, P(X = 2) = 1/4.
    - Multiply and add.
    solution: 'Step 1: 0 + 1/2 + 1/2. Step 2: 1.'
    mistakes:
      '2': c12m13_ev
