# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse12-math
chapter: 13
title: Probability
tips:
  c12_cond: 'P(A|B) = P(A ∩ B) ÷ P(B): divide by the probability of what you already know happened.'
  c12_indep: "Independent means P(A ∩ B) = P(A) × P(B). If A and B are mutually exclusive, P(A ∩ B) = 0. Can a product of two non-zero numbers be 0?"
  m12_bayes: "P(B|faulty) = P(B)P(faulty|B) ÷ P(faulty). Use the total from the last question."
  m12_bayes_use: "Bayes reasons backwards: we see an effect and ask what probably caused it."
  m12_conditional: "P(A|B) = P(A ∩ B) ÷ P(B)."
  m12_expectation: "E(X) = Σ x·p(x)."
  m12_given: "The sample space shrinks to outcomes with at least one head: HH, HT, TH."
  m12_independent: "For independent events, P(A ∩ B) = P(A) × P(B)."
  m12_sum_one: "All probabilities in a distribution add to 1."
  m12_total_prob: "P(red) = P(bag 1)P(red|1) + P(bag 2)P(red|2)."
  c12m13_cond: 'Given B means B is now the whole sample space: count only outcomes inside B, then see how many are also in A.'
  c12m13_ind: Independent means P(A ∩ B) = P(A) × P(B). Mutually exclusive means P(A ∩ B) = 0. They are different ideas.
  c12m13_bayes: 'Bayes: the cause''s share of the total. Top = P(cause) × P(result | cause); bottom = the sum of that over all causes.'
  c12m13_ev: E(X) = Σ x × p. Multiply each value by its probability, then add.
  pq12m13_base_rate: Think about how few people have the condition to begin with. Which group produces most of the positive results?
concepts:
- code: cbse12m.prob.conditional
  title: Conditional probability and independence
  notes: |
    Conditional probability P(A|B) = P(A ∩ B)/P(B), P(B) ≠ 0. Multiplication theorem P(A ∩ B) = P(B)P(A|B). Independent events:
    P(A ∩ B) = P(A)P(B), equivalently P(A|B) = P(A). Mutually exclusive ≠ independent. Total probability: P(A) = Σ P(Eᵢ)P(A|Eᵢ)
    for a partition E₁…Eₙ.
  explanations:
    text: 'Conditional probability is the chance of A when you already know B has happened: P(A|B) = P(A and B) ÷ P(B). Events are independent if knowing one doesn''t change the chance of the other.'
    visual: Roll a die and you're told the number is even (2, 4 or 6). The chance it's a 6 is now 1 out of 3, not 1 out of 6.
    step_by_step: 'Step 1: Find P(A ∩ B). Step 2: Find P(B). Step 3: Divide. Step 4: For independence, check P(A ∩ B) = P(A)P(B).'
    real_world: Doctors use conditional probability to judge how likely a disease is given a positive test result.
  picture:
    kind: flow
    steps:
    - Know B happened
    - Restrict to outcomes in B
    - Count those also in A
    - P(A|B) = P(A ∩ B)/P(B)
    alt: 'Conditional probability: restrict to B, then find the share that is also in A.'
  activity:
    type: formula
    prompt: P(A|B) = P(A ∩ B) ÷ P(B). A and B are independent when P(A ∩ B) = P(A) × P(B), so P(A|B) = P(A).
    inputs:
    - name: pa
      label: P(A)
      min: 0
      max: 1
      step: 0.05
      start: 0
    - name: pb
      label: P(B)
      min: 0.05
      max: 1
      step: 0.05
      start: 0.05
    - name: pab
      label: P(A ∩ B)
      min: 0
      max: 1
      step: 0.05
      start: 0
    outputs:
    - name: cond
      label: P(A|B)
      expr: pab/pb
      places: 2
    - name: prod
      label: P(A) × P(B)
      expr: pa*pb
      places: 3
    goals:
    - prompt: P(A) = 0.5 and P(B) = 0.4. Make A and B independent.
      want:
        pa: 0.5
        pb: 0.4
        pab: 0.2
      mistakes:
      - when:
          pa: 0.5
          pb: 0.4
          pab: 0
        say: 'P(A ∩ B) = 0 makes them mutually exclusive, almost the opposite of independent: if B happens, A can''t.'
      - when:
          pa: 0.5
          pb: 0.4
          pab: 0.9
        say: 0.9 is P(A) + P(B). Independent means P(A ∩ B) = P(A) × P(B).
    - prompt: P(A|B) = 0.6 and P(B) = 0.5. Set P(A ∩ B).
      want:
        pb: 0.5
        cond: 0.6
      mistakes:
      - when:
          pb: 0.5
          pab: 0.6
        say: 0.6 is P(A|B), the chance of A among the B cases. P(A ∩ B) = P(B) × P(A|B).
    - prompt: 'P(A) = 0.3 and P(B) = 0.5. Make B make A MORE likely: P(A|B) > P(A).'
      want:
        pa: 0.3
        pb: 0.5
        cond:
        - 0.35
        - 1
      mistakes:
      - when:
          pa: 0.3
          pb: 0.5
          pab: 0.15
        say: 'That''s exactly independent: P(A|B) = P(A) = 0.3.'
      - when:
          pa: 0.3
          pb: 0.5
          cond:
          - 0
          - 0.29
        say: B makes A LESS likely here. Raise the overlap.
  lesson:
    - teach: 'P(A|B), read ''A given B'', is the probability of A when we already know B happened. B becomes the new sample space: P(A|B) = P(A ∩ B)/P(B), with P(B) ≠ 0.'
      check:
        prompt: A die shows a number greater than 3. Probability it is 5?
        options:
        - 1/3
        - 1/6
        - 1/2
        answer: 1/3
        why: Given {4, 5, 6}, one of three outcomes is 5.
      ways:
      - style: visual
        teach: 'Conditional probability as a smaller sample space: cards 1 to 12, given a multiple of 3.'
        picture:
          kind: flow
          steps:
          - 'B = multiple of 3: {3, 6, 9, 12}'
          - A = even number
          - A ∩ B = {6, 12}
          - P(A|B) = 2/4 = 1/2
          alt: Given the card is a multiple of 3, only 3, 6, 9 and 12 remain. Two of them, 6 and 12, are even, so the probability of even given a multiple of 3 is 2 out of 4, one half.
      - style: real_world
        teach: The chance of rain on any day might be 20%, but if the morning is dark and cloudy, the chance given that is much higher. Knowing B changes the world you are counting in, which is what P(A|B) measures.
    - teach: 'Multiplication rule: P(A ∩ B) = P(B) × P(A|B). A and B are independent if knowing B does not change A: P(A|B) = P(A), or P(A ∩ B) = P(A)P(B). Mutually exclusive events (cannot both happen) with non-zero probabilities are never independent.'
      picture:
        kind: compare
        columns:
        - title: Independent
          points:
          - P(A ∩ B) = P(A)P(B)
          - one doesn't affect the other
          - two coin tosses
        - title: Mutually exclusive
          points:
          - P(A ∩ B) = 0
          - cannot happen together
          - a die shows 1 or 2
        alt: Independent events compared with mutually exclusive events.
      check:
        prompt: P(A) = 0.4, P(B) = 0.5, independent. P(A ∩ B)?
        options:
        - '0.2'
        - '0.9'
        - '0.1'
        answer: '0.2'
        why: 0.4 × 0.5 = 0.2.
      ways:
      - style: step_by_step
        teach: 'Check independence. Step 1: P(A) = 0.3, P(B) = 0.5, P(A ∩ B) = 0.15. Step 2: P(A) × P(B) = 0.15. Step 3: This equals P(A ∩ B). Step 4: So A and B are independent: knowing B leaves P(A) at 0.3.'
      - style: real_world
        teach: 'Rolling a red die and a blue die: the red result tells you nothing about the blue, so the events are independent. Drawing two cards without putting the first back is different: the first card changes what is left.'
    - teach: 'Total probability: if E₁, E₂, … split the sample space (one and only one happens), then P(A) = P(E₁)P(A|E₁) + P(E₂)P(A|E₂) + … Draw a tree: multiply along branches, add the branches that end in A.'
      check:
        prompt: P(E₁) = P(E₂) = 1/2, P(A|E₁) = 1/2, P(A|E₂) = 1/4. P(A)?
        options:
        - 3/8
        - 3/4
        - 1/8
        answer: 3/8
        why: 1/4 + 1/8 = 3/8.
      ways:
      - style: visual
        teach: 'A probability tree for being late: by bus or on foot.'
        picture:
          kind: flow
          steps:
          - 'Bus 0.7 → late 0.1: 0.07'
          - 'Walk 0.3 → late 0.2: 0.06'
          - Add the late branches
          - P(late) = 0.13
          alt: Bus with probability 0.7 and late 0.1 gives 0.07; walking with probability 0.3 and late 0.2 gives 0.06; adding the late branches gives 0.13.
      - style: step_by_step
        teach: 'Total probability for a match. Step 1: P(rain) = 0.4, P(no rain) = 0.6. Step 2: P(cancelled | rain) = 0.5, P(cancelled | no rain) = 0.1. Step 3: Multiply along branches: 0.2 and 0.06. Step 4: P(cancelled) = 0.26.'
  items:
  - prompt: A die is rolled; the result is even. Find the probability it is 6, as a fraction.
    answer: 1/3
    check: Rational(1,3)
    difficulty: 1
    hints:
    - 'Even: 2, 4, 6.'
    - One of three.
    solution: "Even outcomes are {2, 4, 6}; only one is 6, so P = 1/3."
    mistakes:
      1/6: c12_cond
  - prompt: P(A ∩ B) = 0.2 and P(B) = 0.5. Find P(A|B) as a fraction.
    answer: 2/5
    check: Rational(2,10)/Rational(5,10)
    difficulty: 1
    hints:
    - 0.2 ÷ 0.5.
    - = 0.4.
    solution: "P(A|B) = P(A ∩ B)/P(B) = 0.2/0.5 = 2/5."
    mistakes: {"1/10": "m12_conditional", "1/2": "m12_conditional"}
  - prompt: A and B are independent with P(A) = 1/2, P(B) = 1/3. Find P(A ∩ B).
    answer: 1/6
    check: Rational(1,2)*Rational(1,3)
    difficulty: 1
    hints:
    - Multiply.
    - 1/2 × 1/3.
    solution: "For independent events P(A ∩ B) = P(A)P(B) = 1/2 × 1/3 = 1/6."
    mistakes: {"5/6": "m12_independent", "1/2": "m12_independent"}
  - prompt: Two coins are tossed. Find P(both heads | at least one head) as a fraction.
    answer: 1/3
    check: Rational(1,3)
    difficulty: 2
    hints:
    - 'At least one head: HH, HT, TH.'
    - HH is one of three.
    solution: "At least one head: {HH, HT, TH}, 3 outcomes; both heads is 1 of them, so P = 1/3."
    mistakes: {"1/4": "m12_given", "1/2": "m12_given"}
  - prompt: 'If A and B are mutually exclusive with non-zero probabilities, they are:'
    options:
    - not independent
    - independent
    - equal
    - certain
    answer: not independent
    difficulty: 2
    hints:
    - P(A ∩ B) = 0 ≠ P(A)P(B).
    - Knowing A rules out B.
    solution: "Mutually exclusive means P(A ∩ B) = 0, but P(A)P(B) > 0, so P(A ∩ B) ≠ P(A)P(B): not independent."
    mistakes:
      independent: c12_indep
  - prompt: Bag 1 is chosen with probability 1/2 and has 3 red of 5; bag 2 likewise has 1 red of 5. Find P(red).
    answer: 2/5
    check: Rational(1,2)*Rational(3,5)+Rational(1,2)*Rational(1,5)
    difficulty: 2
    hints:
    - ½ × 3/5 + ½ × 1/5.
    - Total probability.
    solution: "P(red) = 1/2 × 3/5 + 1/2 × 1/5 = 3/10 + 1/10 = 4/10 = 2/5."
    mistakes: {"4/5": "m12_total_prob", "3/5": "m12_total_prob", "1/5": "m12_total_prob"}
  - prompt: A card is drawn from 1 to 10; it is even. Find the probability it is 4, as a fraction.
    answer: 1/5
    check: Rational(1,5)
    difficulty: 1
    hints:
    - The evens are 2, 4, 6, 8, 10.
    - How many of these are 4?
    solution: 'Step 1: 5 evens. Step 2: 1/5.'
    mistakes:
      1/10: c12m13_cond
      1/2: c12m13_cond
  - prompt: P(A ∩ B) = 0.3 and P(B) = 0.6. Find P(A|B) as a fraction.
    answer: 1/2
    check: Rational(3,6)
    difficulty: 1
    hints:
    - Divide the joint probability by P(B).
    - 0.3/0.6.
    solution: 'Step 1: 0.3/0.6. Step 2: 1/2.'
    mistakes:
      9/50: c12m13_cond
      1/5: c12m13_cond
  - prompt: A and B are independent with P(A) = 1/4, P(B) = 2/3. Find P(A ∩ B) as a fraction.
    answer: 1/6
    check: Rational(1,4)*Rational(2,3)
    difficulty: 1
    hints:
    - 'Independent: multiply.'
    - 1/4 × 2/3.
    solution: 'Step 1: 2/12. Step 2: 1/6.'
    mistakes:
      11/12: c12m13_ind
      3/7: c12m13_ind
  - prompt: Two dice are rolled; the sum is 4. Find the probability both show 2, as a fraction.
    answer: 1/3
    check: Rational(1,3)
    difficulty: 2
    hints:
    - List outcomes with sum 4.
    - (1, 3), (2, 2), (3, 1).
    solution: 'Step 1: 3 outcomes. Step 2: one is (2, 2): 1/3.'
    mistakes:
      1/36: c12m13_cond
      1/12: c12m13_cond
  - prompt: P(A) = 0.5, P(B) = 0.4, P(A ∩ B) = 0.2. Are A and B independent?
    options:
    - 'yes'
    - 'no'
    - cannot tell
    answer: 'yes'
    difficulty: 2
    hints:
    - Compare P(A)P(B) with P(A ∩ B).
    - 0.5 × 0.4 = ?
    solution: 'Step 1: P(A)P(B) = 0.2. Step 2: equals P(A ∩ B), so independent.'
    mistakes:
      'no': c12m13_ind
      cannot tell: c12m13_ind
  - prompt: Two cards are drawn without replacement from 3 red and 2 black. Find P(both red) as a fraction.
    answer: 3/10
    check: Rational(3,5)*Rational(2,4)
    difficulty: 2
    hints:
    - 'First red: 3/5.'
    - 'Second red given the first was red: 2/4.'
    solution: 'Step 1: 3/5 × 2/4. Step 2: 6/20 = 3/10.'
    mistakes:
      9/25: c12m13_cond
      1/2: c12m13_cond
  - prompt: P(A) = 0.6, P(B) = 0.5, independent. Find P(A ∪ B) as a fraction.
    answer: 4/5
    check: Rational(6,10) + Rational(5,10) - Rational(3,10)
    difficulty: 2
    hints:
    - P(A ∪ B) = P(A) + P(B) − P(A ∩ B).
    - P(A ∩ B) = 0.3.
    solution: 'Step 1: 0.6 + 0.5 − 0.3. Step 2: 0.8 = 4/5.'
    mistakes:
      11/10: c12m13_ind
      3/10: c12m13_ind
  - prompt: Bag 1 (chosen with probability 1/3) has 2 white of 4; bag 2 (probability 2/3) has 1 white of 4. Find P(white) as a fraction.
    answer: 1/3
    check: Rational(1,3)*Rational(2,4) + Rational(2,3)*Rational(1,4)
    difficulty: 3
    hints:
    - Use total probability.
    - 1/3 × 1/2 + 2/3 × 1/4.
    solution: 'Step 1: 1/6 + 1/6. Step 2: 1/3.'
    mistakes:
      3/8: c12m13_cond
      1/2: c12m13_cond
  - prompt: A family has two children; at least one is a girl. Find P(both are girls) as a fraction (each child equally likely girl or boy).
    answer: 1/3
    check: Rational(1,3)
    difficulty: 3
    hints:
    - List GG, GB, BG, BB.
    - Remove the one that has no girl.
    solution: 'Step 1: GG, GB, BG remain. Step 2: 1/3.'
    mistakes:
      1/2: c12m13_cond
      1/4: c12m13_cond
  - prompt: 'Assertion (A): If P(A) = 0.4, P(B) = 0.5 and P(A ∩ B) = 0.2, then A and B are independent.

      Reason (R): A and B are independent when P(A ∩ B) = P(A) × P(B).'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: P(A) × P(B) = 0.4 × 0.5 = 0.2 = P(A ∩ B), so by R the events are independent. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In a class of 40, 25 play cricket, 15 play football and 10 play both. A student picked at random plays football. What is the probability they also play cricket?'
    options:
    - 2/3
    - 1/4
    - 2/5
    answer: 2/3
    hints:
    - The sample space is now only the football players.
    - How many of those 15 play cricket too?
    solution: Given football, there are 15 students, of whom 10 play cricket. P = 10/15 = 2/3.
    mistakes:
      1/4: c12m13_cond
      2/5: c12m13_cond
    exam: case
    difficulty: 2
  - prompt: A and B are mutually exclusive, with P(A) = 0.3 and P(B) = 0.4. A student says they must be independent. Which is correct?
    options:
    - 'Not independent: P(A ∩ B) = 0 but P(A)P(B) = 0.12'
    - Independent, because they cannot affect each other
    - Independent, because P(A ∪ B) = 0.7
    answer: 'Not independent: P(A ∩ B) = 0 but P(A)P(B) = 0.12'
    hints:
    - Mutually exclusive means they cannot both happen.
    - Compare P(A ∩ B) with P(A) × P(B).
    solution: Mutually exclusive gives P(A ∩ B) = 0, but P(A)P(B) = 0.12 ≠ 0. If one happens, the other certainly does not, so they are dependent.
    mistakes:
      Independent, because they cannot affect each other: c12m13_ind
      Independent, because P(A ∪ B) = 0.7: c12m13_ind
    exam: competency
    difficulty: 2
- code: cbse12m.prob.bayes
  title: Bayes' theorem and random variables
  after:
  - cbse12m.prob.conditional
  notes: |
    Bayes' theorem: P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σ P(Eⱼ)P(A|Eⱼ): reverse conditional probability. Random variable: numerical outcome;
    probability distribution (Σ pᵢ = 1). Mean (expectation) E(X) = Σ xᵢpᵢ. (Variance and binomial distribution removed in
    rationalised syllabus.)
  explanations:
    text: 'Bayes'' theorem lets you work backwards: given that something happened, how likely was each possible cause? A random variable gives a number to each outcome, and its mean (expected value) is the long-run average.'
    visual: 'Two machines make bulbs: A makes 60% (2% faulty), B 40% (5% faulty). Given a faulty bulb, Bayes tells you the chance it came from B.'
    step_by_step: 'Step 1: List the causes and their probabilities. Step 2: Find P(event | each cause). Step 3: Multiply and add for the total. Step 4: Divide the cause''s share by the total.'
    real_world: Spam filters use Bayes' theorem to decide whether an email with certain words is likely to be spam.
  picture:
    kind: compare
    columns:
    - title: Cause
      points:
      - Machine A
      - Machine B
    - title: Share of bulbs
      points:
      - 60%
      - 40%
    - title: Faulty rate
      points:
      - 2%
      - 5%
    alt: 'Two machines making bulbs: their shares and faulty rates, used in Bayes'' theorem.'
  activity:
    type: formula
    prompt: 'Machine A makes a share of the bolts; the rest come from B. Bayes: P(A|faulty) = P(A)P(F|A) ÷ [P(A)P(F|A) + P(B)P(F|B)].'
    inputs:
    - name: pa
      label: Share from A
      min: 0
      max: 1
      step: 0.05
      start: 0.5
    - name: da
      label: A's faulty rate
      min: 0
      max: 0.1
      step: 0.01
      start: 0.01
    - name: db
      label: B's faulty rate
      min: 0
      max: 0.1
      step: 0.01
      start: 0.01
    outputs:
    - name: pf
      label: P(faulty)
      expr: pa*da+(1-pa)*db
      places: 4
    - name: post
      label: P(A | faulty)
      expr: pa*da/(pa*da+(1-pa)*db)
      places: 3
    goals:
    - prompt: A makes 60% with 2% faulty; B makes 40% with 5% faulty. Set it up and read P(A | faulty).
      want:
        pa: 0.6
        da: 0.02
        db: 0.05
      mistakes:
      - when:
          pa: 0.6
          da: 0.05
          db: 0.02
        say: 'Rates swapped: A''s faulty rate is 2%, B''s is 5%.'
      - when:
          pa: 0.4
          da: 0.02
          db: 0.05
        say: A makes 60%, not 40%.
    - prompt: A makes 80% of bolts. Choose the faulty rates so a faulty bolt is equally likely to come from A or B.
      want:
        pa: 0.8
        post: 0.5
      mistakes:
      - when:
          pa: 0.8
          post:
          - 0.51
          - 1
        say: 'A still gets most of the blame: it makes 80% of bolts. B must be much worse to balance: 0.8 × P(F|A) = 0.2 × P(F|B).'
      - when:
          pa: 0.8
          post:
          - 0
          - 0.49
        say: 'Now B gets more of the blame. Balance them: 0.8 × P(F|A) = 0.2 × P(F|B).'
    - prompt: A makes 90% of bolts. Make P(A | faulty) below 0.5.
      want:
        pa: 0.9
        post:
        - 0
        - 0.49
      mistakes:
      - when:
          pa: 0.9
          post:
          - 0.5
          - 1
        say: Still 0.5 or more. A big machine can rarely be to blame only if its faulty rate is tiny compared with B's.
  lesson:
    - teach: 'Bayes'' theorem reverses a conditional: from P(result | cause) it finds P(cause | result). P(Eᵢ|A) = P(Eᵢ)P(A|Eᵢ) / Σ P(Eⱼ)P(A|Eⱼ). The bottom is just total probability P(A).'
      check:
        prompt: 'Bayes'' theorem finds:'
        options:
        - the chance of a cause, given what was observed
        - the mean of a random variable
        - the number of outcomes
        answer: the chance of a cause, given what was observed
        why: It works backwards from the result to the cause.
      ways:
      - style: visual
        teach: Bayes' theorem turns a forward probability into a backward one.
        picture:
          kind: compare
          columns:
          - title: Known (forward)
            points:
            - P(result | cause)
            - e.g. P(fever | flu)
          - title: Wanted (backward)
            points:
            - P(cause | result)
            - e.g. P(flu | fever)
          alt: We usually know the forward probability of a result given a cause, such as fever given flu. Bayes' theorem finds the backward probability of the cause given the result, such as flu given fever.
      - style: real_world
        teach: A detective sees muddy boots and asks who probably went outside. Each suspect has a chance of going out and a chance of muddy boots if they did. Bayes' theorem weighs both to rank the suspects, reasoning backwards from the clue.
    - teach: 'Example: bag I (chosen with probability 1/2) has 3 red of 4; bag II (1/2) has 1 red of 4. A red ball is drawn. P(red) = 3/8 + 1/8 = 1/2. P(bag I | red) = (3/8)/(1/2) = 3/4.'
      picture:
        kind: flow
        steps:
        - 'Branch: P(cause)'
        - Times P(result | cause)
        - 'Add all branches: P(result)'
        - Your branch ÷ total
        alt: Steps of Bayes' theorem on a probability tree.
      check:
        prompt: In the example, find P(bag II | red).
        options:
        - 1/4
        - 1/8
        - 1/2
        answer: 1/4
        why: (1/8)/(1/2) = 1/4, and 3/4 + 1/4 = 1.
      ways:
      - style: step_by_step
        teach: 'Box A (chosen with probability 1/3) has 2 faulty of 10; box B (2/3) has 1 faulty of 10. A faulty item is drawn. Step 1: P(A)P(F|A) = 1/3 × 1/5 = 1/15. Step 2: P(B)P(F|B) = 2/3 × 1/10 = 1/15. Step 3: P(F) = 2/15. Step 4: P(A|F) = (1/15)/(2/15) = 1/2.'
      - style: real_world
        teach: An email filter learns how often words like 'prize' appear in spam and in normal mail. When a new email contains 'prize', Bayes' theorem turns those rates into the chance that this email is spam.
    - teach: A random variable X assigns a number to each outcome. Its probability distribution lists values xᵢ with probabilities pᵢ, all ≥ 0 and adding to 1. The mean or expectation is E(X) = Σ xᵢpᵢ.
      check:
        prompt: X = 1 or 3 with probabilities 1/2 each. E(X)?
        options:
        - '2'
        - '4'
        - 3/2
        answer: '2'
        why: 1 × 1/2 + 3 × 1/2 = 2.
      ways:
      - style: visual
        teach: The distribution of X = number of heads in 3 tosses of a fair coin, counted out of 8 outcomes.
        picture:
          kind: bars
          unit: outcomes out of 8
          bars:
          - label: 0 heads
            value: 1
          - label: 1 head
            value: 3
          - label: 2 heads
            value: 3
          - label: 3 heads
            value: 1
          alt: Out of 8 equally likely outcomes, 0 heads happens once, 1 head three times, 2 heads three times and 3 heads once. The mean is 12 over 8, which is 1.5.
      - style: step_by_step
        teach: 'Expected gain of a game. Step 1: Win ₹20 with probability 1/10. Step 2: Otherwise (9/10) lose ₹3. Step 3: E = 20 × 1/10 + (−3) × 9/10 = 2 − 2.7. Step 4: E = −₹0.70: on average a player loses 70 paise a game.'
  items:
  - prompt: Machine A makes 60% of bulbs (2% faulty), B 40% (5% faulty). Find P(faulty) as a fraction.
    answer: 4/125
    check: Rational(6,10)*Rational(2,100)+Rational(4,10)*Rational(5,100)
    difficulty: 2
    hints:
    - 0.6 × 0.02 + 0.4 × 0.05.
    - 0.012 + 0.02.
    solution: "P(faulty) = 0.6 × 0.02 + 0.4 × 0.05 = 0.012 + 0.020 = 0.032 = 4/125."
    mistakes: {"7/100": "m12_total_prob", "7/200": "m12_total_prob"}
  - prompt: In the same case, find P(from B | faulty) as a fraction.
    answer: 5/8
    check: (Rational(4,10)*Rational(5,100))/(Rational(6,10)*Rational(2,100)+Rational(4,10)*Rational(5,100))
    difficulty: 2
    hints:
    - 0.02 ÷ 0.032.
    - Bayes.
    solution: "Bayes: P(B | faulty) = 0.020/0.032 = 20/32 = 5/8."
    mistakes: {"2/5": "m12_bayes", "3/8": "m12_bayes"}
  - prompt: X takes values 0, 1, 2 with probabilities 1/4, 1/2, 1/4. Find E(X).
    answer: '1'
    check: 0*Rational(1,4)+1*Rational(1,2)+2*Rational(1,4)
    difficulty: 1
    hints:
    - Σ x p.
    - 0 + 1/2 + 1/2.
    solution: "E(X) = 0 × 1/4 + 1 × 1/2 + 2 × 1/4 = 0 + 1/2 + 1/2 = 1."
    mistakes: {"1/2": "m12_expectation", "2": "m12_expectation"}
  - prompt: Find the expected value of the number shown on a fair die, as a fraction.
    answer: 7/2
    check: Rational(21,6)
    difficulty: 1
    hints:
    - (1 + ... + 6)/6.
    - 21/6.
    solution: "E = (1 + 2 + 3 + 4 + 5 + 6)/6 = 21/6 = 7/2 = 3.5."
    mistakes: {"3": "m12_expectation", "21": "m12_expectation", "6": "m12_expectation"}
  - prompt: Probabilities in a distribution are 0.2, 0.5 and k. Find k as a fraction.
    answer: 3/10
    check: 1-Rational(7,10)
    difficulty: 1
    hints:
    - They add to 1.
    - 1 − 0.7.
    solution: "Probabilities add to 1: 0.2 + 0.5 + k = 1, so k = 0.3 = 3/10."
    mistakes: {"7/10": "m12_sum_one", "1/2": "m12_sum_one"}
  - prompt: 'Bayes'' theorem is used to find:'
    options:
    - "the probability of a cause given an observed result"
    - "the mean value of a probability distribution"
    - "the total number of outcomes in an experiment"
    - "areas under a curve between two limits"
    answer: the probability of a cause given an observed result
    difficulty: 2
    hints:
    - Reverse conditional.
    - Posterior.
    solution: The probability of a cause given what was observed.
    mistakes: {"the mean value of a probability distribution": "m12_bayes_use", "the total number of outcomes in an experiment": "m12_bayes_use", "areas under a curve between two limits": "m12_bayes_use"}
  - prompt: Bag I (prob 1/2) has 2 red of 5; bag II (prob 1/2) has 4 red of 5. A red is drawn. Find P(bag II | red) as a fraction.
    answer: 2/3
    check: (Rational(1,2)*Rational(4,5))/(Rational(1,2)*Rational(2,5) + Rational(1,2)*Rational(4,5))
    difficulty: 1
    hints:
    - 'Bag II''s branch: 1/2 × 4/5.'
    - Divide by the total of both branches.
    solution: 'Step 1: 2/5 ÷ (1/5 + 2/5) = 2/5 ÷ 3/5. Step 2: 2/3.'
    mistakes:
      4/5: c12m13_bayes
      1/3: c12m13_bayes
  - prompt: X takes 1, 2, 3 with probabilities 1/2, 1/3, 1/6. Find E(X) as a fraction.
    answer: 5/3
    check: 1*Rational(1,2) + 2*Rational(1,3) + 3*Rational(1,6)
    difficulty: 1
    hints:
    - Multiply each value by its probability.
    - 1/2 + 2/3 + 1/2.
    solution: 'Step 1: 3/6 + 4/6 + 3/6 = 10/6. Step 2: 5/3.'
    mistakes:
      '2': c12m13_ev
      '1': c12m13_ev
  - prompt: A distribution has probabilities 1/4, 1/4 and k. Find k as a fraction.
    answer: 1/2
    check: 1 - Rational(1,4) - Rational(1,4)
    difficulty: 1
    hints:
    - The probabilities must add to 1.
    - 1 − 1/4 − 1/4.
    solution: 'Step 1: 1 − 1/2. Step 2: 1/2.'
    mistakes:
      1/4: c12m13_ev
      3/4: c12m13_ev
  - prompt: A coin is tossed twice; X = number of heads. Find E(X).
    answer: '1'
    check: 0*Rational(1,4) + 1*Rational(1,2) + 2*Rational(1,4)
    difficulty: 2
    hints:
    - P(X = 0) = 1/4, P(X = 1) = 1/2, P(X = 2) = 1/4.
    - Multiply and add.
    solution: 'Step 1: 0 + 1/2 + 1/2. Step 2: 1.'
    mistakes:
      '2': c12m13_ev
      1/2: c12m13_ev
  - prompt: Factory A makes 70% of items (1% faulty), B makes 30% (4% faulty). Find P(faulty) as a fraction.
    answer: 19/1000
    check: Rational(70,100)*Rational(1,100) + Rational(30,100)*Rational(4,100)
    difficulty: 2
    hints:
    - Total probability over the two factories.
    - 0.7 × 0.01 + 0.3 × 0.04.
    solution: 'Step 1: 0.007 + 0.012. Step 2: 0.019 = 19/1000.'
    mistakes:
      1/20: c12m13_bayes
      1/40: c12m13_bayes
  - prompt: With factories A (70%, 1% faulty) and B (30%, 4% faulty), find P(made by B | faulty) as a fraction.
    answer: 12/19
    check: Rational(12,1000)/Rational(19,1000)
    difficulty: 2
    hints:
    - 'B''s branch: 0.3 × 0.04 = 0.012.'
    - Divide by 0.019.
    solution: 'Step 1: 12/1000 ÷ 19/1000. Step 2: 12/19.'
    mistakes:
      7/19: c12m13_bayes
      3/10: c12m13_bayes
  - prompt: A test spots a condition in 90% of people who have it and wrongly flags 10% who do not; 10% of people have it. Find P(has it | flagged) as a fraction.
    answer: 1/2
    check: (Rational(1,10)*Rational(9,10))/(Rational(1,10)*Rational(9,10) + Rational(9,10)*Rational(1,10))
    difficulty: 3
    hints:
    - 'Branch 1: 0.1 × 0.9; branch 2: 0.9 × 0.1.'
    - They are equal.
    solution: 'Step 1: 0.09 ÷ (0.09 + 0.09). Step 2: 1/2.'
    mistakes:
      9/10: c12m13_bayes
      1/10: c12m13_bayes
  - prompt: 'A game: win ₹10 with probability 1/5, else lose ₹2. Find the expected gain in ₹ as a fraction.'
    answer: 2/5
    check: 10*Rational(1,5) + (-2)*Rational(4,5)
    difficulty: 3
    hints:
    - Losing has probability 4/5.
    - 10 × 1/5 + (−2) × 4/5.
    solution: 'Step 1: 2 − 8/5. Step 2: 2/5.'
    mistakes:
      '2': c12m13_ev
      '8': c12m13_ev
  - prompt: Three urns, each chosen with probability 1/3, hold 1, 2 and 3 white balls out of 4. A white ball is drawn. Find P(urn 3 | white) as a fraction.
    answer: 1/2
    check: Rational(3,4)/(Rational(1,4) + Rational(2,4) + Rational(3,4))
    difficulty: 3
    hints:
    - Equal priors cancel.
    - 3/4 ÷ (1/4 + 2/4 + 3/4).
    solution: 'Step 1: 3/4 ÷ 6/4. Step 2: 1/2.'
    mistakes:
      3/4: c12m13_bayes
      1/3: c12m13_bayes
  - prompt: 'Assertion (A): The numbers 0.3, 0.5 and 0.4 can be the probabilities of a probability distribution.

      Reason (R): Every probability lies between 0 and 1.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: R is true. But in a distribution the probabilities must also add to 1, and 0.3 + 0.5 + 0.4 = 1.2, so A is false.
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: 30% of students come by school bus and 70% walk. On a rainy day 10% of bus riders and 2% of walkers are late. A late student is chosen. What is the probability they came by bus?'
    options:
    - 15/22
    - 3/10
    - 1/10
    answer: 15/22
    hints:
    - P(late) = 0.3 × 0.1 + 0.7 × 0.02.
    - P(bus | late) = P(bus)P(late | bus) ÷ P(late).
    solution: P(late) = 0.03 + 0.014 = 0.044. P(bus | late) = 0.03/0.044 = 30/44 = 15/22.
    mistakes:
      3/10: c12m13_bayes
      1/10: c12m13_bayes
    exam: case
    difficulty: 2
  - prompt: A screening test detects a condition in 95% of people who have it and wrongly flags 5% of people who do not. Only 1% of people have the condition. Someone tests positive. Which statement is best?
    options:
    - "The chance they have it is only about 16%"
    - "The chance they have it is 95%, the test's accuracy"
    - "The chance they have it is 1%, the base rate"
    answer: The chance they have it is only about 16%
    hints:
    - P(positive) = 0.01 × 0.95 + 0.99 × 0.05.
    - Then divide the 'has it' part by that total.
    solution: P(positive) = 0.0095 + 0.0495 = 0.059. P(has it | positive) = 0.0095/0.059 ≈ 0.16. Most positives come from the large group without the condition.
    mistakes:
      "The chance they have it is 95%, the test's accuracy": pq12m13_base_rate
      "The chance they have it is 1%, the base rate": c12m13_bayes
    exam: competency
    difficulty: 2
