# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse12-math
chapter: 3
title: Matrices
tips:
  c12_order: To multiply AB, the number of columns of A must equal the number of rows of B. The result has A's rows and B's columns.
  c12_commute: 'Matrix multiplication is usually not commutative: AB and BA are generally different.'
  m12_det2: "ad − bc: multiply along the main diagonal, then subtract the product along the other diagonal."
  m12_inverse2: "A⁻¹ = (1/det) × [[d, −b], [−c, a]]. Swap a and d first."
  m12_matrix_square: "Entry (1, 2) of A² = row 1 of A · column 2 of A."
  m12_order: "An m × n matrix has m rows of n entries each."
  m12_reverse_order: "Like socks then shoes: to undo, take off the shoes first. The order reverses."
  m12_row_col: "Multiply matching entries and add: 1×3 + 2×4."
  m12_singular: "A matrix has no inverse when its determinant is zero. Work out ad − bc for each."
  m12_skew: "Skew-symmetric means aᵢⱼ = −aⱼᵢ. On the diagonal, i = j, so aᵢᵢ = −aᵢᵢ."
  c12m3_order: Order is rows × columns. For AB, the columns of A must equal the rows of B; AB has A's rows and B's columns.
  c12m3_mult: 'Entry (i, j) of AB = row i of A times column j of B: multiply matching entries and add.'
  c12m3_inv: 'For [[a, b], [c, d]]: swap a and d, change the signs of b and c, divide by ad − bc.'
  c12m3_trans: 'Transpose swaps rows and columns: entry (i, j) moves to (j, i).'
  pq12m3_order_product: AB has as many rows as A and as many columns as B.
  pq12m3_mult_rule: 'Entry (1, 1) of AB is row 1 of A times column 1 of B: multiply pairs and add.'
  pq12m3_inverse_swap: Swap a and d, change the signs of b and c, then divide by ad − bc.
  pq12m3_order_reverses: 'Undo the last step first: (AB)⁻¹ puts the inverses in the opposite order.'
concepts:
- code: cbse12m.mat.basics
  title: Types of matrices and operations
  notes: |
    A matrix is a rectangular array; order m × n (rows × columns). Types: row, column, square, diagonal, scalar, identity
    I, zero. Equality: same order and equal entries. Addition (same order), scalar multiplication. Multiplication: (AB)ᵢⱼ =
    Σ aᵢₖbₖⱼ; needs columns of A = rows of B; not commutative; associative, distributive. Transpose Aᵀ; (AB)ᵀ = BᵀAᵀ.
    Symmetric (Aᵀ = A), skew-symmetric (Aᵀ = −A, diagonal zeros); any square matrix = symmetric + skew-symmetric part.
  explanations:
    text: 'A matrix is a grid of numbers with rows and columns. You add matrices entry by entry, but multiply them row by column. The order matters: AB is usually not the same as BA.'
    visual: 'Multiply [1 2] by the column [3; 4]: go along the row and down the column, 1×3 + 2×4 = 11.'
    step_by_step: 'Step 1: Check the orders fit (columns of A = rows of B). Step 2: Each entry = row of A · column of B. Step 3: The result has A''s row count and B''s column count.'
    real_world: Spreadsheets of marks or prices are matrices; multiplying a quantity table by a price column gives total costs.
  picture:
    kind: compare
    columns:
    - title: Type
      points:
      - identity
      - diagonal
      - symmetric
      - skew-symmetric
    - title: Meaning
      points:
      - 1s on diagonal, 0 elsewhere
      - zeros off the diagonal
      - Aᵀ = A
      - Aᵀ = −A
    alt: Kinds of square matrices and what each means.
  activity:
    type: formula
    prompt: A is m × n and B is p × q. AB exists only when A's columns match B's rows (n = p); then AB is m × q.
    inputs:
    - name: m
      label: A's rows m
      min: 1
      max: 5
      step: 1
      start: 1
    - name: n
      label: A's columns n
      min: 1
      max: 5
      step: 1
      start: 1
    - name: p
      label: B's rows p
      min: 1
      max: 5
      step: 1
      start: 1
    - name: q
      label: B's columns q
      min: 1
      max: 5
      step: 1
      start: 1
    outputs:
    - name: ab
      label: AB possible? (1 yes, 0 no)
      expr: 1-min(1,abs(n-p))
    - name: ba
      label: BA possible? (1 yes, 0 no)
      expr: 1-min(1,abs(q-m))
    - name: gap
      label: AB and BA differ in size by
      expr: abs(m-n)
    goals:
    - prompt: A is 2 × 4. Choose B so AB is a 2 × 3 matrix.
      want:
        m: 2
        n: 4
        ab: 1
        q: 3
      mistakes:
      - when:
          m: 2
          n: 4
          p: 2
        say: 'B''s rows must match A''s COLUMNS, not its rows: p = 4.'
      - when:
          m: 2
          n: 4
          p: 3
          q: 4
        say: 'B is 3 × 4, but its rows (3) don''t match A''s columns (4). Flip it: B should be 4 × 3.'
    - prompt: Make AB possible but BA impossible.
      want:
        ab: 1
        ba: 0
      mistakes:
      - when:
          ab: 1
          ba: 1
        say: 'Both work here. For BA, B''s columns q must match A''s rows m: make them different.'
      - when:
          ab: 0
        say: 'AB doesn''t work yet: A''s columns n must equal B''s rows p.'
    - prompt: Make both AB and BA possible, but of different sizes.
      want:
        ab: 1
        ba: 1
        gap:
        - 1
        - 4
      mistakes:
      - when:
          ab: 1
          ba: 1
          gap: 0
        say: 'With A square (m = n), AB and BA are the same size. Try A as 2 × 3 and B as 3 × 2: AB is 2 × 2, BA is 3 × 3.'
  lesson:
    - teach: 'A matrix is a rectangular array of numbers. Its order is m × n: m rows and n columns, so it has mn entries. Special types: row, column, square, diagonal, scalar, identity I (1s on the diagonal, 0s elsewhere) and zero matrix.'
      check:
        prompt: A matrix has 2 rows and 5 columns. What is its order?
        options:
        - 2 × 5
        - 5 × 2
        - '10'
        answer: 2 × 5
        why: Order is written rows × columns.
      ways:
      - style: visual
        teach: 'A 2 × 3 matrix: 2 rows across, 3 columns down, 6 entries. The entry in row 2, column 3 is called a₂₃.'
        picture:
          kind: area_grid
          cols:
          - size: 2
            label: col 1
          - size: 2
            label: col 2
          - size: 2
            label: col 3
          rows:
          - size: 2
            label: row 1
          - size: 2
            label: row 2
          cells:
          - - a₁₁
            - a₁₂
            - a₁₃
          - - a₂₁
            - a₂₂
            - a₂₃
          alt: A grid of 2 rows and 3 columns, with entries a11 to a23.
      - style: real_world
        teach: 'A shop''s sales table is a matrix: rows for days, columns for items. Monday''s sales of pens, pencils and erasers sit in row 1. A 7 × 3 matrix holds a week of sales of 3 items: 21 numbers.'
    - teach: Add matrices of the same order entry by entry. To multiply AB, the number of columns of A must equal the number of rows of B. Entry (i, j) of AB is row i of A times column j of B. In general AB ≠ BA.
      picture:
        kind: flow
        steps:
        - Row i of A
        - Column j of B
        - Multiply matching entries
        - Add the products
        - Entry (i, j) of AB
        alt: How one entry of a matrix product is calculated.
      check:
        prompt: Multiply the row [2 3] by the column [4; 1].
        options:
        - '11'
        - '8'
        - '14'
        answer: '11'
        why: 2 × 4 + 3 × 1 = 8 + 3 = 11.
      ways:
      - style: step_by_step
        teach: 'Multiply A = [[1, 2], [3, 4]] by B = [[5, 6], [7, 8]]. Step 1: Row 1 of A × column 1 of B: 1×5 + 2×7 = 19. Step 2: Row 1 × column 2: 1×6 + 2×8 = 22. Step 3: Row 2 × column 1: 3×5 + 4×7 = 43. Step 4: Row 2 × column 2: 3×6 + 4×8 = 50. So AB = [[19, 22], [43, 50]].'
      - style: real_world
        teach: 'Prices × quantities is matrix multiplication. Quantities bought by two people (rows) times a price column for each item: each person''s row times the price column gives their bill. That is why the columns of the first must match the rows of the second: one price for each item.'
    - teach: The transpose Aᵀ swaps rows and columns, and (AB)ᵀ = BᵀAᵀ. A is symmetric if Aᵀ = A and skew-symmetric if Aᵀ = −A (so its diagonal is all zero). Every square matrix is ½(A + Aᵀ) (symmetric) plus ½(A − Aᵀ) (skew-symmetric).
      check:
        prompt: A is skew-symmetric with a₁₂ = 5. What is a₂₁?
        options:
        - '-5'
        - '5'
        - '0'
        answer: '-5'
        why: Aᵀ = −A means a₂₁ = −a₁₂.
      ways:
      - style: visual
        teach: Any square matrix splits into a symmetric part and a skew-symmetric part.
        picture:
          kind: flow
          steps:
          - A = [[1, 5], [3, 2]]
          - Aᵀ = [[1, 3], [5, 2]]
          - ½(A + Aᵀ) = [[1, 4], [4, 2]]
          - ½(A − Aᵀ) = [[0, 1], [−1, 0]]
          - 'Add them: back to A'
          alt: A equals 1, 5, 3, 2 splits into the symmetric part 1, 4, 4, 2 and the skew-symmetric part 0, 1, minus 1, 0.
      - style: step_by_step
        teach: 'Step 1: Write Aᵀ by turning rows into columns. Step 2: Symmetric means Aᵀ = A: the matrix mirrors across its diagonal. Step 3: Skew-symmetric means Aᵀ = −A: mirrored entries are negatives. Step 4: On the diagonal aᵢᵢ = −aᵢᵢ, so every diagonal entry of a skew-symmetric matrix is 0.'
  items:
  - prompt: How many entries does a 3 × 4 matrix have?
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - rows × columns.
    - 3 × 4.
    solution: "3 rows × 4 columns = 12 entries."
    mistakes: {"7": "m12_order", "34": "m12_order"}
  - prompt: Multiply the row [1 2] by the column [3; 4]. What single number do you get?
    answer: '11'
    check: 1*3+2*4
    difficulty: 1
    hints:
    - 1×3 + 2×4.
    - 3 + 8.
    solution: "1 × 3 + 2 × 4 = 3 + 8 = 11."
    mistakes: {"10": "m12_row_col", "14": "m12_row_col", "24": "m12_row_col"}
  - prompt: A is 2 × 3 and B is 3 × 5. How many columns does AB have?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - 'Result: A''s rows × B''s columns.'
    - 2 × 5.
    solution: "(2 × 3)(3 × 5) gives a 2 × 5 matrix, so AB has 5 columns."
    mistakes:
      '3': c12_order
  - prompt: For A = [[1, 2], [3, 4]], what is the (1, 2) entry of A²?
    answer: '10'
    check: 1*2+2*4
    difficulty: 2
    hints:
    - Row 1 · column 2.
    - 1×2 + 2×4.
    solution: "Row 1 of A times column 2 of A: 1 × 2 + 2 × 4 = 2 + 8 = 10."
    mistakes: {"4": "m12_matrix_square", "8": "m12_matrix_square", "22": "m12_matrix_square"}
  - prompt: Which statement is generally true for matrices?
    options:
    - AB ≠ BA
    - AB = BA always
    - A + B ≠ B + A
    - (AB)ᵀ = AᵀBᵀ
    answer: AB ≠ BA
    difficulty: 1
    hints:
    - Order matters.
    - Not commutative.
    solution: AB is generally not equal to BA.
    mistakes:
      AB = BA always: c12_commute
  - prompt: 'The diagonal entries of a skew-symmetric matrix are:'
    options:
    - all zero
    - all one
    - equal
    - negative
    answer: all zero
    difficulty: 2
    hints:
    - aᵢᵢ = −aᵢᵢ.
    - So aᵢᵢ = 0.
    solution: "Skew-symmetric means aᵢⱼ = −aⱼᵢ. On the diagonal aᵢᵢ = −aᵢᵢ, so 2aᵢᵢ = 0 and aᵢᵢ = 0."
    mistakes: {"all one": "m12_skew", "equal": "m12_skew", "negative": "m12_skew"}
  - prompt: How many entries does a 4 × 5 matrix have?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - Count rows and columns.
    - Multiply them.
    solution: 'Step 1: 4 rows, 5 columns. Step 2: 20 entries.'
    mistakes:
      '9': c12m3_order
      '45': c12m3_order
  - prompt: A is 3 × 2 and B is 2 × 4. How many rows does AB have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - AB takes its rows from one matrix.
    - Which one comes first?
    solution: 'Step 1: AB is 3 × 4. Step 2: 3 rows.'
    mistakes:
      '2': c12m3_order
      '4': c12m3_order
  - prompt: A = [[1, 2], [3, 4]], B = [[2, 0], [1, 3]]. Find the (1, 1) entry of A + B.
    answer: '3'
    check: 1 + 2
    difficulty: 1
    hints:
    - Add matching entries.
    - Look at the top-left of each.
    solution: 'Step 1: 1 + 2. Step 2: 3.'
    mistakes:
      '2': c12m3_mult
      '4': c12m3_mult
  - prompt: A = [[1, 2], [3, 4]], B = [[2, 0], [1, 3]]. Find the (1, 1) entry of AB.
    answer: '4'
    check: 1*2 + 2*1
    difficulty: 2
    hints:
    - Row 1 of A is [1 2].
    - Column 1 of B is [2; 1].
    solution: 'Step 1: 1 × 2 + 2 × 1. Step 2: 4.'
    mistakes:
      '2': c12m3_mult
      '3': c12m3_mult
  - prompt: A = [[1, 2], [3, 4]], B = [[2, 0], [1, 3]]. Find the (1, 1) entry of BA.
    answer: '2'
    check: 2*1 + 0*3
    difficulty: 2
    hints:
    - Now B comes first.
    - Row 1 of B times column 1 of A.
    solution: 'Step 1: [2 0]·[1; 3] = 2 + 0. Step 2: 2. (Compare AB''s 4: AB ≠ BA.)'
    mistakes:
      '4': c12m3_mult
      '3': c12m3_mult
  - prompt: If A is 2 × 3, what is the order of Aᵀ?
    options:
    - 3 × 2
    - 2 × 3
    - 3 × 3
    answer: 3 × 2
    difficulty: 1
    hints:
    - Rows become columns.
    - Swap the two numbers.
    solution: 'Step 1: transpose swaps rows and columns. Step 2: 3 × 2.'
    mistakes:
      2 × 3: c12m3_trans
      3 × 3: c12m3_trans
  - prompt: A = [[2, 1], [0, 3]]. Find the (1, 2) entry of A².
    answer: '5'
    check: 2*1 + 1*3
    difficulty: 2
    hints:
    - A² = A × A.
    - Row 1 of A times column 2 of A.
    solution: 'Step 1: [2 1]·[1; 3] = 2 + 3. Step 2: 5.'
    mistakes:
      '1': c12m3_mult
      '2': c12m3_mult
  - prompt: A = [[1, 4], [2, 3]]. Find the (1, 2) entry of the symmetric part ½(A + Aᵀ).
    answer: '3'
    check: (4 + 2)/2
    difficulty: 3
    hints:
    - Aᵀ's (1, 2) entry is A's (2, 1) entry.
    - Average the two.
    solution: 'Step 1: (A + Aᵀ)₁₂ = 4 + 2 = 6. Step 2: half is 3.'
    mistakes:
      '4': c12m3_trans
      '6': c12m3_trans
  - prompt: A = [[1, 4], [2, 3]]. Find the (1, 2) entry of the skew-symmetric part ½(A − Aᵀ).
    answer: '1'
    check: (4 - 2)/2
    difficulty: 3
    hints:
    - Subtract the transposed entry.
    - Then halve.
    solution: 'Step 1: 4 − 2 = 2. Step 2: half is 1.'
    mistakes:
      '2': c12m3_trans
      '-1': c12m3_trans
  - prompt: 'Assertion (A): If A is 2 × 3 and B is 3 × 4, then AB is defined and is 2 × 4.

      Reason (R): AB is defined when the number of columns of A equals the number of rows of B.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: A has 3 columns and B has 3 rows, so by R the product is defined; it takes A's 2 rows and B's 4 columns. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): The diagonal entries of a skew-symmetric matrix are all zero.

      Reason (R): For a skew-symmetric matrix, aᵢⱼ = −aⱼᵢ for all i and j.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Put j = i in R: aᵢᵢ = −aᵢᵢ, so aᵢᵢ = 0. A is true because of R.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: If A is 3 × 2 and B is 2 × 5, the order of AB is
    options:
    - 3 × 5
    - 2 × 2
    - 5 × 3
    answer: 3 × 5
    hints:
    - The inner numbers must match; the outer numbers give the order.
    - 'Outer numbers: 3 and 5.'
    solution: 'A has 2 columns and B has 2 rows, so AB is defined, with A''s 3 rows and B''s 5 columns: 3 × 5.'
    mistakes:
      2 × 2: pq12m3_order_product
      5 × 3: pq12m3_order_product
    exam: one_mark
    difficulty: 1
  - prompt: 'Case study: A stationery shop sells to two schools. School P buys 10 pens and 20 notebooks; school Q buys 15 pens and 5 notebooks. A pen costs ₹10 and a notebook ₹40. Using matrices, what is school P''s bill?'
    options:
    - ₹900
    - ₹750
    - ₹1,300
    answer: ₹900
    hints:
    - Write the quantity matrix [[10, 20], [15, 5]] and the price column [10, 40].
    - P's bill is row 1 times the price column.
    solution: Row P × prices = 10 × 10 + 20 × 40 = 100 + 800 = ₹900. (Q's bill is 15 × 10 + 5 × 40 = ₹350.)
    mistakes:
      ₹1,300: pq12m3_mult_rule
    exam: case
    difficulty: 2
- code: cbse12m.mat.inverse
  title: Transpose, symmetry and inverse
  after:
  - cbse12m.mat.basics
  notes: |
    Inverse: A⁻¹ such that AA⁻¹ = A⁻¹A = I; exists only for square, non-singular matrices; unique. (AB)⁻¹ = B⁻¹A⁻¹. For a 2 × 2
    matrix [[a, b], [c, d]], inverse = 1/(ad − bc) × [[d, −b], [−c, a]] when ad − bc ≠ 0. Elementary operations (row/column)
    (method removed from some rationalised years; 2 × 2 formula kept). A = ½(A + Aᵀ) + ½(A − Aᵀ).
  explanations:
    text: 'The inverse of a matrix is like the reciprocal of a number: multiplying by it gives the identity matrix. Only square matrices whose determinant isn''t zero have an inverse. For a 2 × 2 matrix there''s a quick formula.'
    visual: 'For [[a, b], [c, d]]: swap a and d, change the signs of b and c, then divide everything by ad − bc.'
    step_by_step: 'Step 1: Find ad − bc. Step 2: If zero, no inverse. Step 3: Swap a and d, negate b and c. Step 4: Divide by ad − bc.'
    real_world: Matrix inverses are used to solve systems of equations in engineering and computer graphics.
  picture:
    kind: flow
    steps:
    - Find ad − bc
    - Check it's not zero
    - Swap a and d
    - Negate b and c
    - Divide by ad − bc
    alt: Finding the inverse of a 2 × 2 matrix.
  activity:
    type: formula
    prompt: A = [[a, b], [c, d]]. A⁻¹ exists only when |A| = ad − bc ≠ 0; then A⁻¹ = (1/|A|) [[d, −b], [−c, a]].
    inputs:
    - name: a
      label: a
      min: -5
      max: 5
      step: 1
      start: 0
    - name: b
      label: b
      min: -5
      max: 5
      step: 1
      start: 0
    - name: c
      label: c
      min: -5
      max: 5
      step: 1
      start: 0
    - name: d
      label: d
      min: -5
      max: 5
      step: 1
      start: 0
    outputs:
    - name: det
      label: '|A| = ad − bc'
      expr: a*d-b*c
    - name: asym
      label: b − c (0 if symmetric)
      expr: b-c
    goals:
    - prompt: Make a matrix with no inverse, with every entry from 1 to 5.
      want:
        det: 0
        a:
        - 1
        - 5
        b:
        - 1
        - 5
        c:
        - 1
        - 5
        d:
        - 1
        - 5
      mistakes:
      - when:
          a:
          - 1
          - 5
          b:
          - 1
          - 5
          c:
          - 1
          - 5
          d:
          - 1
          - 5
          det:
          - 1
          - 25
        say: '|A| ≠ 0, so A⁻¹ exists. Make the rows proportional, so ad = bc.'
      - when:
          a:
          - 1
          - 5
          b:
          - 1
          - 5
          c:
          - 1
          - 5
          d:
          - 1
          - 5
          det:
          - -25
          - -1
        say: '|A| ≠ 0, so A⁻¹ exists. Make the rows proportional, so ad = bc.'
    - prompt: Keep b = 1 and c = 2. Make |A| = 1, so A⁻¹ has whole-number entries.
      want:
        b: 1
        c: 2
        det: 1
      mistakes:
      - when:
          b: 1
          c: 2
          det: -1
        say: '|A| = ad − bc = −1: ad is only 1. You need ad − 2 = 1, so ad = 3.'
      - when:
          b: 1
          c: 2
          det:
          - 2
          - 30
        say: '|A| is too big. ad − 2 must equal 1.'
    - prompt: Make A symmetric (b = c) and singular, with a = 4 and b not 0.
      want:
        a: 4
        asym: 0
        det: 0
        b:
        - 1
        - 5
      mistakes:
      - when:
          a: 4
          det: 0
          asym:
          - -10
          - -1
        say: 'Singular, but not symmetric: b and c must be equal (A = Aᵀ).'
      - when:
          a: 4
          det: 0
          asym:
          - 1
          - 10
        say: 'Singular, but not symmetric: b and c must be equal (A = Aᵀ).'
  lesson:
    - teach: The inverse A⁻¹ of a square matrix A satisfies AA⁻¹ = A⁻¹A = I. It exists only when A is non-singular, which for 2 × 2 means ad − bc ≠ 0. If an inverse exists, it is unique.
      check:
        prompt: A = [[2, 4], [1, 2]]. Does A have an inverse?
        options:
        - no, because ad − bc = 0
        - yes, every square matrix does
        - yes, because all entries are positive
        answer: no, because ad − bc = 0
        why: 2 × 2 − 4 × 1 = 0, so A is singular.
      ways:
      - style: step_by_step
        teach: 'Step 1: Work out ad − bc. Step 2: If it is 0, stop: no inverse. Step 3: If not, an inverse exists, and only one. Example: [[2, 4], [1, 2]] has 4 − 4 = 0, so it has no inverse; [[2, 1], [5, 3]] has 6 − 5 = 1, so it has one.'
      - style: visual
        teach: When a square matrix has an inverse, and when it does not.
        picture:
          kind: compare
          columns:
          - title: '|A| ≠ 0 (non-singular)'
            points:
            - Inverse exists
            - AA⁻¹ = A⁻¹A = I
          - title: '|A| = 0 (singular)'
            points:
            - No inverse
            - Rows are multiples of each other
          alt: If the determinant of A is not zero, A is non-singular and its inverse exists, with A times A inverse equal to the identity. If the determinant is zero, A is singular, has no inverse, and its rows are multiples of each other.
    - teach: 'For A = [[a, b], [c, d]] with ad − bc ≠ 0: A⁻¹ = 1/(ad − bc) × [[d, −b], [−c, a]]. Swap a and d, change the signs of b and c, divide every entry by ad − bc.'
      picture:
        kind: flow
        steps:
        - Find ad − bc
        - Swap a and d
        - Negate b and c
        - Divide by ad − bc
        alt: Steps to find the inverse of a 2 by 2 matrix.
      check:
        prompt: A = [[3, 1], [5, 2]]. What is the bottom-left entry of A⁻¹?
        options:
        - '-5'
        - '5'
        - '3'
        answer: '-5'
        why: ad − bc = 6 − 5 = 1; bottom-left is −c/1 = −5.
      ways:
      - style: visual
        teach: The 2 × 2 inverse recipe, shown on A = [[2, 1], [5, 3]].
        picture:
          kind: flow
          steps:
          - A = [[2, 1], [5, 3]]
          - ad − bc = 6 − 5 = 1
          - 'Swap a, d: [[3, ·], [·, 2]]'
          - 'Flip b, c: [[3, −1], [−5, 2]]'
          - 'Divide by 1: A⁻¹'
          alt: 'For A equals 2, 1, 5, 3: ad minus bc is 1; swap 2 and 3 and change the signs of 1 and 5, giving 3, minus 1, minus 5, 2.'
      - style: step_by_step
        teach: 'Check the answer. Step 1: A = [[2, 1], [5, 3]], A⁻¹ = [[3, −1], [−5, 2]]. Step 2: Row 1 × column 1: 2×3 + 1×(−5) = 1. Step 3: Row 1 × column 2: 2×(−1) + 1×2 = 0. Step 4: The rest give 0 and 1 too, so AA⁻¹ = I.'
    - teach: 'Useful rules: (AB)⁻¹ = B⁻¹A⁻¹ (order reverses, like taking off socks and shoes), (A⁻¹)⁻¹ = A, and (Aᵀ)⁻¹ = (A⁻¹)ᵀ. Check an inverse by multiplying: you should get I.'
      check:
        prompt: '(ABC)⁻¹ equals:'
        options:
        - C⁻¹B⁻¹A⁻¹
        - A⁻¹B⁻¹C⁻¹
        - B⁻¹A⁻¹C⁻¹
        answer: C⁻¹B⁻¹A⁻¹
        why: The order reverses completely.
      ways:
      - style: step_by_step
        teach: 'Step 1: (AB)⁻¹ must undo AB. Step 2: AB means do B first, then A. Step 3: To undo, undo A first, then B: B⁻¹A⁻¹. Step 4: Check: (AB)(B⁻¹A⁻¹) = A(BB⁻¹)A⁻¹ = AA⁻¹ = I.'
      - style: visual
        teach: Key rules for inverses and transposes of products.
        picture:
          kind: flow
          steps:
          - '(AB)⁻¹ = B⁻¹A⁻¹: order reverses'
          - (A⁻¹)⁻¹ = A
          - (A′)⁻¹ = (A⁻¹)′
          - '(AB)′ = B′A′: order reverses too'
          alt: The inverse of AB is B inverse times A inverse, with the order reversed. The inverse of A inverse is A. The inverse of the transpose is the transpose of the inverse. The transpose of AB is B transpose times A transpose, again reversing order.
  items:
  - prompt: For A = [[2, 1], [5, 3]], find ad − bc.
    answer: '1'
    check: 2*3-1*5
    difficulty: 1
    hints:
    - 2×3 − 1×5.
    - 6 − 5.
    solution: "ad − bc = 2 × 3 − 1 × 5 = 6 − 5 = 1."
    mistakes: {"11": "m12_det2", "-1": "m12_det2", "6": "m12_det2"}
  - prompt: For A = [[2, 1], [5, 3]], what is the top-left entry of A⁻¹?
    answer: '3'
    check: 3/1
    difficulty: 2
    hints:
    - Swap a and d.
    - Divide by 1.
    solution: 3 (A⁻¹ = [[3, −1], [−5, 2]]).
    mistakes: {"2": "m12_inverse2", "-1": "m12_inverse2", "1/2": "m12_inverse2"}
  - prompt: For A = [[4, 2], [3, 2]], find ad − bc.
    answer: '2'
    check: 4*2-2*3
    difficulty: 1
    hints:
    - 8 − 6.
    - Determinant.
    solution: "ad − bc = 4 × 2 − 2 × 3 = 8 − 6 = 2."
    mistakes: {"14": "m12_det2", "8": "m12_det2", "-2": "m12_det2"}
  - prompt: For A = [[4, 2], [3, 2]], what is the top-right entry of A⁻¹?
    answer: '-1'
    check: -2/2
    difficulty: 2
    hints:
    - −b/(ad − bc).
    - −2/2.
    solution: "A⁻¹ = (1/|A|)[[d, −b], [−c, a]] = (1/2)[[2, −2], [−3, 4]], so the top-right entry is −2/2 = −1."
    mistakes: {"2": "m12_inverse2", "1": "m12_inverse2", "-2": "m12_inverse2"}
  - prompt: Which matrix has no inverse?
    options:
    - '[[1, 2], [2, 4]]'
    - '[[1, 0], [0, 1]]'
    - '[[2, 1], [5, 3]]'
    - '[[3, 0], [0, 2]]'
    answer: '[[1, 2], [2, 4]]'
    difficulty: 2
    hints:
    - Check ad − bc.
    - 4 − 4 = 0.
    solution: '[[1, 2], [2, 4]], since ad − bc = 0.'
    mistakes: {"[[1, 0], [0, 1]]": "m12_singular", "[[2, 1], [5, 3]]": "m12_singular", "[[3, 0], [0, 2]]": "m12_singular"}
  - prompt: '(AB)⁻¹ equals:'
    options:
    - B⁻¹A⁻¹
    - A⁻¹B⁻¹
    - AB
    - BA
    answer: B⁻¹A⁻¹
    difficulty: 2
    hints:
    - Reverse order.
    - Like socks and shoes.
    solution: "(AB)(B⁻¹A⁻¹) = A(BB⁻¹)A⁻¹ = AA⁻¹ = I, so the inverse is B⁻¹A⁻¹ (the order reverses)."
    mistakes: {"A⁻¹B⁻¹": "m12_reverse_order", "AB": "m12_reverse_order", "BA": "m12_reverse_order"}
  - prompt: A = [[5, 2], [7, 3]]. Find ad − bc.
    answer: '1'
    check: 5*3 - 2*7
    difficulty: 1
    hints:
    - Multiply the main diagonal, then the other diagonal.
    - Subtract.
    solution: 'Step 1: 15 − 14. Step 2: 1.'
    mistakes:
      '29': c12m3_inv
      '-1': c12m3_inv
  - prompt: A = [[5, 2], [7, 3]]. Find the top-right entry of A⁻¹.
    answer: '-2'
    check: -2/1
    difficulty: 1
    hints:
    - The top-right entry comes from b.
    - Change its sign and divide by ad − bc.
    solution: 'Step 1: ad − bc = 1. Step 2: −b/1 = −2.'
    mistakes:
      '2': c12m3_inv
      '7': c12m3_inv
  - prompt: A = [[5, 2], [7, 3]]. Find the top-left entry of A⁻¹.
    answer: '3'
    check: 3/1
    difficulty: 1
    hints:
    - The top-left entry comes from d.
    - Divide by ad − bc.
    solution: 'Step 1: d/(ad − bc) = 3/1. Step 2: 3.'
    mistakes:
      '5': c12m3_inv
      '-3': c12m3_inv
  - prompt: A = [[4, 3], [2, 2]]. Find the bottom-right entry of A⁻¹.
    answer: '2'
    check: 4/(4*2 - 3*2)
    difficulty: 2
    hints:
    - ad − bc first.
    - Bottom-right comes from a.
    solution: 'Step 1: ad − bc = 8 − 6 = 2. Step 2: a/2 = 4/2 = 2.'
    mistakes:
      '1': c12m3_inv
      '4': c12m3_inv
  - prompt: A = [[4, 3], [2, 2]]. Find the top-right entry of A⁻¹ as a fraction.
    answer: -3/2
    check: -3/2
    difficulty: 2
    hints:
    - ad − bc = 2.
    - Change the sign of b, then divide.
    solution: 'Step 1: −b = −3. Step 2: −3/2.'
    mistakes:
      3/2: c12m3_inv
      '-3': c12m3_inv
  - prompt: For which k is [[k, 2], [3, 6]] singular?
    answer: '1'
    check: 6/6
    difficulty: 2
    hints:
    - Singular means ad − bc = 0.
    - Solve 6k − 6 = 0.
    solution: 'Step 1: 6k − 6 = 0. Step 2: k = 1.'
    mistakes:
      '2': c12m3_inv
      '0': c12m3_inv
  - prompt: '(Aᵀ)⁻¹ equals:'
    options:
    - (A⁻¹)ᵀ
    - A
    - −A
    answer: (A⁻¹)ᵀ
    difficulty: 2
    hints:
    - Transpose AA⁻¹ = I.
    - Use (XY)ᵀ = YᵀXᵀ.
    solution: 'Step 1: (A⁻¹)ᵀAᵀ = (AA⁻¹)ᵀ = I. Step 2: so (Aᵀ)⁻¹ = (A⁻¹)ᵀ.'
    mistakes:
      A: c12m3_trans
      −A: c12m3_trans
  - prompt: A = [[2, 1], [1, 1]]. Find the sum of all entries of A⁻¹.
    answer: '1'
    check: (1 - 1 - 1 + 2)/1
    difficulty: 3
    hints:
    - ad − bc = 2 − 1.
    - A⁻¹ = [[1, −1], [−1, 2]].
    solution: 'Step 1: A⁻¹ = [[1, −1], [−1, 2]]. Step 2: 1 − 1 − 1 + 2 = 1.'
    mistakes:
      '5': c12m3_inv
      '3': c12m3_inv
  - prompt: If A⁻¹ = [[1, 2], [0, 1]], what is the (1, 2) entry of A?
    answer: '-2'
    check: -2/1
    difficulty: 3
    hints:
    - A = (A⁻¹)⁻¹.
    - Invert [[1, 2], [0, 1]]; its ad − bc is 1.
    solution: 'Step 1: inverse of [[1, 2], [0, 1]] is [[1, −2], [0, 1]]. Step 2: entry −2.'
    mistakes:
      '2': c12m3_inv
      1/2: c12m3_inv
  - prompt: 'Assertion (A): The matrix [[2, 4], [1, 2]] has no inverse.

      Reason (R): A 2 × 2 matrix has an inverse only when ad − bc ≠ 0.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: ad − bc = 4 − 4 = 0, so by R there is no inverse. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: The inverse of [[3, 2], [4, 3]] is
    options:
    - '[[3, −2], [−4, 3]]'
    - '[[−3, 2], [4, −3]]'
    - '[[3, 4], [2, 3]]'
    answer: '[[3, −2], [−4, 3]]'
    hints:
    - First find ad − bc.
    - ad − bc = 9 − 8 = 1. Now swap and change signs.
    solution: 'ad − bc = 1. Swap 3 and 3, change the signs of 2 and 4: A⁻¹ = [[3, −2], [−4, 3]]. Check: 3×3 + 2×(−4) = 1.'
    mistakes:
      '[[−3, 2], [4, −3]]': pq12m3_inverse_swap
      '[[3, 4], [2, 3]]': pq12m3_inverse_swap
    exam: short
    difficulty: 2
  - prompt: If A and B are invertible matrices of the same order, (AB)⁻¹ equals
    options:
    - B⁻¹A⁻¹
    - A⁻¹B⁻¹
    - BA
    answer: B⁻¹A⁻¹
    hints:
    - Think of undoing two steps.
    - Which step was done last?
    solution: (AB)(B⁻¹A⁻¹) = A(BB⁻¹)A⁻¹ = AA⁻¹ = I, so (AB)⁻¹ = B⁻¹A⁻¹.
    mistakes:
      A⁻¹B⁻¹: pq12m3_order_reverses
    exam: one_mark
    difficulty: 1
