# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse12-math
chapter: 3
title: Matrices
tips:
  c12_order: To multiply AB, the number of columns of A must equal the number of rows of B. The result has A's rows and B's columns.
  c12_commute: 'Matrix multiplication is usually not commutative: AB and BA are generally different.'
  m12_det2: "ad − bc: multiply along the main diagonal, then subtract the product along the other diagonal."
  m12_inverse2: "A⁻¹ = (1/det) × [[d, −b], [−c, a]]. Swap a and d first."
  m12_matrix_square: "Entry (1, 2) of A² = row 1 of A · column 2 of A."
  m12_order: "An m × n matrix has m rows of n entries each."
  m12_reverse_order: "Like socks then shoes: to undo, take off the shoes first. The order reverses."
  m12_row_col: "Multiply matching entries and add: 1×3 + 2×4."
  m12_singular: "A matrix has no inverse when its determinant is zero. Work out ad − bc for each."
  m12_skew: "Skew-symmetric means aᵢⱼ = −aⱼᵢ. On the diagonal, i = j, so aᵢᵢ = −aᵢᵢ."
concepts:
- code: cbse12m.mat.basics
  title: Types of matrices and operations
  notes: |
    A matrix is a rectangular array; order m × n (rows × columns). Types: row, column, square, diagonal, scalar, identity
    I, zero. Equality: same order and equal entries. Addition (same order), scalar multiplication. Multiplication: (AB)ᵢⱼ =
    Σ aᵢₖbₖⱼ; needs columns of A = rows of B; not commutative; associative, distributive. Transpose Aᵀ; (AB)ᵀ = BᵀAᵀ.
    Symmetric (Aᵀ = A), skew-symmetric (Aᵀ = −A, diagonal zeros); any square matrix = symmetric + skew-symmetric part.
  explanations:
    text: 'A matrix is a grid of numbers with rows and columns. You add matrices entry by entry, but multiply them row by column. The order matters: AB is usually not the same as BA.'
    visual: 'Multiply [1 2] by the column [3; 4]: go along the row and down the column, 1×3 + 2×4 = 11.'
    step_by_step: 'Step 1: Check the orders fit (columns of A = rows of B). Step 2: Each entry = row of A · column of B. Step 3: The result has A''s row count and B''s column count.'
    real_world: Spreadsheets of marks or prices are matrices; multiplying a quantity table by a price column gives total costs.
  picture:
    kind: compare
    columns:
    - title: Type
      points:
      - identity
      - diagonal
      - symmetric
      - skew-symmetric
    - title: Meaning
      points:
      - 1s on diagonal, 0 elsewhere
      - zeros off the diagonal
      - Aᵀ = A
      - Aᵀ = −A
    alt: Kinds of square matrices and what each means.
  activity:
    type: formula
    prompt: A is m × n and B is p × q. AB exists only when A's columns match B's rows (n = p); then AB is m × q.
    inputs:
    - name: m
      label: A's rows m
      min: 1
      max: 5
      step: 1
      start: 1
    - name: n
      label: A's columns n
      min: 1
      max: 5
      step: 1
      start: 1
    - name: p
      label: B's rows p
      min: 1
      max: 5
      step: 1
      start: 1
    - name: q
      label: B's columns q
      min: 1
      max: 5
      step: 1
      start: 1
    outputs:
    - name: ab
      label: AB possible? (1 yes, 0 no)
      expr: 1-min(1,abs(n-p))
    - name: ba
      label: BA possible? (1 yes, 0 no)
      expr: 1-min(1,abs(q-m))
    - name: gap
      label: AB and BA differ in size by
      expr: abs(m-n)
    goals:
    - prompt: A is 2 × 4. Choose B so AB is a 2 × 3 matrix.
      want:
        m: 2
        n: 4
        ab: 1
        q: 3
      mistakes:
      - when:
          m: 2
          n: 4
          p: 2
        say: 'B''s rows must match A''s COLUMNS, not its rows: p = 4.'
      - when:
          m: 2
          n: 4
          p: 3
          q: 4
        say: 'B is 3 × 4, but its rows (3) don''t match A''s columns (4). Flip it: B should be 4 × 3.'
    - prompt: Make AB possible but BA impossible.
      want:
        ab: 1
        ba: 0
      mistakes:
      - when:
          ab: 1
          ba: 1
        say: 'Both work here. For BA, B''s columns q must match A''s rows m: make them different.'
      - when:
          ab: 0
        say: 'AB doesn''t work yet: A''s columns n must equal B''s rows p.'
    - prompt: Make both AB and BA possible, but of different sizes.
      want:
        ab: 1
        ba: 1
        gap:
        - 1
        - 4
      mistakes:
      - when:
          ab: 1
          ba: 1
          gap: 0
        say: 'With A square (m = n), AB and BA are the same size. Try A as 2 × 3 and B as 3 × 2: AB is 2 × 2, BA is 3 × 3.'
  items:
  - prompt: How many entries does a 3 × 4 matrix have?
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - rows × columns.
    - 3 × 4.
    solution: '12.'
    mistakes: {"7": "m12_order", "34": "m12_order"}
  - prompt: Multiply the row [1 2] by the column [3; 4]. What single number do you get?
    answer: '11'
    check: 1*3+2*4
    difficulty: 1
    hints:
    - 1×3 + 2×4.
    - 3 + 8.
    solution: '11.'
    mistakes: {"10": "m12_row_col", "14": "m12_row_col", "24": "m12_row_col"}
  - prompt: A is 2 × 3 and B is 3 × 5. How many columns does AB have?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - 'Result: A''s rows × B''s columns.'
    - 2 × 5.
    solution: '5.'
    mistakes:
      '3': c12_order
  - prompt: For A = [[1, 2], [3, 4]], what is the (1, 2) entry of A²?
    answer: '10'
    check: 1*2+2*4
    difficulty: 2
    hints:
    - Row 1 · column 2.
    - 1×2 + 2×4.
    solution: '10.'
    mistakes: {"4": "m12_matrix_square", "8": "m12_matrix_square", "22": "m12_matrix_square"}
  - prompt: Which statement is generally true for matrices?
    options:
    - AB ≠ BA
    - AB = BA always
    - A + B ≠ B + A
    - (AB)ᵀ = AᵀBᵀ
    answer: AB ≠ BA
    difficulty: 1
    hints:
    - Order matters.
    - Not commutative.
    solution: AB is generally not equal to BA.
    mistakes:
      AB = BA always: c12_commute
  - prompt: 'The diagonal entries of a skew-symmetric matrix are:'
    options:
    - all zero
    - all one
    - equal
    - negative
    answer: all zero
    difficulty: 2
    hints:
    - aᵢᵢ = −aᵢᵢ.
    - So aᵢᵢ = 0.
    solution: All zero.
    mistakes: {"all one": "m12_skew", "equal": "m12_skew", "negative": "m12_skew"}
- code: cbse12m.mat.inverse
  title: Transpose, symmetry and inverse
  after:
  - cbse12m.mat.basics
  notes: |
    Inverse: A⁻¹ such that AA⁻¹ = A⁻¹A = I; exists only for square, non-singular matrices; unique. (AB)⁻¹ = B⁻¹A⁻¹. For a 2 × 2
    matrix [[a, b], [c, d]], inverse = 1/(ad − bc) × [[d, −b], [−c, a]] when ad − bc ≠ 0. Elementary operations (row/column)
    (method removed from some rationalised years; 2 × 2 formula kept). A = ½(A + Aᵀ) + ½(A − Aᵀ).
  explanations:
    text: 'The inverse of a matrix is like the reciprocal of a number: multiplying by it gives the identity matrix. Only square matrices whose determinant isn''t zero have an inverse. For a 2 × 2 matrix there''s a quick formula.'
    visual: 'For [[a, b], [c, d]]: swap a and d, change the signs of b and c, then divide everything by ad − bc.'
    step_by_step: 'Step 1: Find ad − bc. Step 2: If zero, no inverse. Step 3: Swap a and d, negate b and c. Step 4: Divide by ad − bc.'
    real_world: Matrix inverses are used to solve systems of equations in engineering and computer graphics.
  picture:
    kind: flow
    steps:
    - Find ad − bc
    - Check it's not zero
    - Swap a and d
    - Negate b and c
    - Divide by ad − bc
    alt: Finding the inverse of a 2 × 2 matrix.
  activity:
    type: formula
    prompt: A = [[a, b], [c, d]]. A⁻¹ exists only when |A| = ad − bc ≠ 0; then A⁻¹ = (1/|A|) [[d, −b], [−c, a]].
    inputs:
    - name: a
      label: a
      min: -5
      max: 5
      step: 1
      start: 0
    - name: b
      label: b
      min: -5
      max: 5
      step: 1
      start: 0
    - name: c
      label: c
      min: -5
      max: 5
      step: 1
      start: 0
    - name: d
      label: d
      min: -5
      max: 5
      step: 1
      start: 0
    outputs:
    - name: det
      label: '|A| = ad − bc'
      expr: a*d-b*c
    - name: asym
      label: b − c (0 if symmetric)
      expr: b-c
    goals:
    - prompt: Make a matrix with no inverse, with every entry from 1 to 5.
      want:
        det: 0
        a:
        - 1
        - 5
        b:
        - 1
        - 5
        c:
        - 1
        - 5
        d:
        - 1
        - 5
      mistakes:
      - when:
          a:
          - 1
          - 5
          b:
          - 1
          - 5
          c:
          - 1
          - 5
          d:
          - 1
          - 5
          det:
          - 1
          - 25
        say: '|A| ≠ 0, so A⁻¹ exists. Make the rows proportional, so ad = bc.'
      - when:
          a:
          - 1
          - 5
          b:
          - 1
          - 5
          c:
          - 1
          - 5
          d:
          - 1
          - 5
          det:
          - -25
          - -1
        say: '|A| ≠ 0, so A⁻¹ exists. Make the rows proportional, so ad = bc.'
    - prompt: Keep b = 1 and c = 2. Make |A| = 1, so A⁻¹ has whole-number entries.
      want:
        b: 1
        c: 2
        det: 1
      mistakes:
      - when:
          b: 1
          c: 2
          det: -1
        say: '|A| = ad − bc = −1: ad is only 1. You need ad − 2 = 1, so ad = 3.'
      - when:
          b: 1
          c: 2
          det:
          - 2
          - 30
        say: '|A| is too big. ad − 2 must equal 1.'
    - prompt: Make A symmetric (b = c) and singular, with a = 4 and b not 0.
      want:
        a: 4
        asym: 0
        det: 0
        b:
        - 1
        - 5
      mistakes:
      - when:
          a: 4
          det: 0
          asym:
          - -10
          - -1
        say: 'Singular, but not symmetric: b and c must be equal (A = Aᵀ).'
      - when:
          a: 4
          det: 0
          asym:
          - 1
          - 10
        say: 'Singular, but not symmetric: b and c must be equal (A = Aᵀ).'
  items:
  - prompt: For A = [[2, 1], [5, 3]], find ad − bc.
    answer: '1'
    check: 2*3-1*5
    difficulty: 1
    hints:
    - 2×3 − 1×5.
    - 6 − 5.
    solution: '1.'
    mistakes: {"11": "m12_det2", "-1": "m12_det2", "6": "m12_det2"}
  - prompt: For A = [[2, 1], [5, 3]], what is the top-left entry of A⁻¹?
    answer: '3'
    check: 3/1
    difficulty: 2
    hints:
    - Swap a and d.
    - Divide by 1.
    solution: 3 (A⁻¹ = [[3, −1], [−5, 2]]).
    mistakes: {"2": "m12_inverse2", "-1": "m12_inverse2", "1/2": "m12_inverse2"}
  - prompt: For A = [[4, 2], [3, 2]], find ad − bc.
    answer: '2'
    check: 4*2-2*3
    difficulty: 1
    hints:
    - 8 − 6.
    - Determinant.
    solution: '2.'
    mistakes: {"14": "m12_det2", "8": "m12_det2", "-2": "m12_det2"}
  - prompt: For A = [[4, 2], [3, 2]], what is the top-right entry of A⁻¹?
    answer: '-1'
    check: -2/2
    difficulty: 2
    hints:
    - −b/(ad − bc).
    - −2/2.
    solution: −1.
    mistakes: {"2": "m12_inverse2", "1": "m12_inverse2", "-2": "m12_inverse2"}
  - prompt: Which matrix has no inverse?
    options:
    - '[[1, 2], [2, 4]]'
    - '[[1, 0], [0, 1]]'
    - '[[2, 1], [5, 3]]'
    - '[[3, 0], [0, 2]]'
    answer: '[[1, 2], [2, 4]]'
    difficulty: 2
    hints:
    - Check ad − bc.
    - 4 − 4 = 0.
    solution: '[[1, 2], [2, 4]], since ad − bc = 0.'
    mistakes: {"[[1, 0], [0, 1]]": "m12_singular", "[[2, 1], [5, 3]]": "m12_singular", "[[3, 0], [0, 2]]": "m12_singular"}
  - prompt: '(AB)⁻¹ equals:'
    options:
    - B⁻¹A⁻¹
    - A⁻¹B⁻¹
    - AB
    - BA
    answer: B⁻¹A⁻¹
    difficulty: 2
    hints:
    - Reverse order.
    - Like socks and shoes.
    solution: B⁻¹A⁻¹.
    mistakes: {"A⁻¹B⁻¹": "m12_reverse_order", "AB": "m12_reverse_order", "BA": "m12_reverse_order"}
