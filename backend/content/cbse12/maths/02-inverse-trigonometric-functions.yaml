  - prompt: Using tan⁻¹x + tan⁻¹y = π + tan⁻¹((x + y)/(1 − xy)) for x, y > 0 with xy > 1, find tan⁻¹2 + tan⁻¹3.
    options:
    - 3π/4
    - −π/4
    - π/4
    answer: 3π/4
    hints:
    - Here xy = 6 > 1, so the extra π is needed.
    - (2 + 3)/(1 − 6) = −1, and tan⁻¹(−1) = −π/4.
    solution: xy = 6 > 1, so the sum = π + tan⁻¹(5/(−5)) = π + tan⁻¹(−1) = π − π/4 = 3π/4. Both angles are between 45° and 90°, so the sum is between 90° and 180°, as 3π/4 is.
