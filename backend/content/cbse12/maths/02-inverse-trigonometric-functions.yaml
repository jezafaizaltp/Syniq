# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse12-math
chapter: 2
title: Inverse Trigonometric Functions
tips:
  c12_principal: 'Principal ranges: sin⁻¹ in [−π/2, π/2], cos⁻¹ in [0, π], tan⁻¹ in (−π/2, π/2).'
  c12_notpower: sin⁻¹x is the inverse function, not 1/sin x. The reciprocal is cosec x.
  m12_inverse_undo: "sin and sin⁻¹ undo each other. Write 0.4 as a fraction."
  m12_invtrig_value: "Which angle in the principal range has sine 1/2?"
  m12_principal_cos: "cos x takes every value in [−1, 1] once between 0 and the angle where it reaches −1."
  m12_sin_cos_inv: "sin⁻¹x + cos⁻¹x is the same for every x in [−1, 1]. Try x = 0."
  m12_tan_cot: "tan⁻¹x + cot⁻¹x is constant. Try x = 1: each part is 45°."
  m12_tan_sum: "tan⁻¹a + tan⁻¹b = tan⁻¹[(a + b)/(1 − ab)]. Work it out, then convert."
  c12m2_range: "The answer must lie in the principal range: for sin⁻¹ and tan⁻¹ from −π/2 to π/2, for cos⁻¹ from 0 to π."
  c12m2_neg: "For a negative input, sin⁻¹ and tan⁻¹ just take the minus sign outside, but cos⁻¹(−x) = π − cos⁻¹x."
  c12m2_ident: "Look for the identity that pairs these two functions: an inverse function plus its co-function always makes a right angle."
  pq12m2_outside_range: That angle has the right sine, but it is outside the principal range. Find the one inside it.
  pq12m2_cos_negative: 'For a negative input, cos⁻¹ lands in the second quadrant: cos⁻¹(−x) = π − cos⁻¹x.'
  pq12m2_add_rule: Use tan⁻¹x + tan⁻¹y = tan⁻¹((x + y)/(1 − xy)). Work out the top and the bottom separately.
concepts:
- code: cbse12m.invtrig.basics
  title: Domains and principal values
  notes: |
    Trigonometric functions are not one-one on ℝ, so their domains are restricted to make inverses. sin⁻¹: [−1, 1] →
    [−π/2, π/2]; cos⁻¹: [−1, 1] → [0, π]; tan⁻¹: ℝ → (−π/2, π/2); cosec⁻¹, sec⁻¹, cot⁻¹ similarly. Principal value: the value
    in the principal range. sin⁻¹(1/2) = π/6; cos⁻¹(−1/2) = 2π/3; tan⁻¹(1) = π/4. Graphs are reflections in y = x.
  explanations:
    text: Sine, cosine and tangent repeat, so to undo them we restrict them to one stretch where they don't repeat. The inverse gives the angle in that stretch, called the principal value. For example, sin⁻¹(1/2) = π/6.
    visual: 'Draw sin x between −π/2 and π/2: it rises steadily from −1 to 1. Flip it over the line y = x to get sin⁻¹x.'
    step_by_step: 'Step 1: Recall the principal range. Step 2: Find the angle in that range with the given ratio. Step 3: Check its sign matches the range.'
    real_world: 'Calculators give principal values: press sin⁻¹(0.5) and you get 30°, never 150°.'
  picture:
    kind: compare
    columns:
    - title: Function
      points:
      - sin⁻¹x
      - cos⁻¹x
      - tan⁻¹x
    - title: Domain
      points:
      - '[−1, 1]'
      - '[−1, 1]'
      - all reals
    - title: Principal range
      points:
      - '[−π/2, π/2]'
      - '[0, π]'
      - (−π/2, π/2)
    alt: Domains and principal ranges of sin⁻¹, cos⁻¹ and tan⁻¹.
  activity:
    type: angle
    prompt: Turn the arm to each principal value. sin⁻¹ gives −90° to 90°, cos⁻¹ gives 0° to 180°, tan⁻¹ gives between −90° and 90°.
    goals:
    - prompt: cos⁻¹(−½)
      degrees: 120
      mistakes:
      - when:
          degrees: 60
        say: 60° is cos⁻¹(+½). For a negative input, cos⁻¹(−x) = 180° − cos⁻¹x.
      - when:
          degrees: 240
        say: cos 240° is −½ too, but it isn't in 0° to 180°, the principal range of cos⁻¹.
    - prompt: sin⁻¹(√3/2)
      degrees: 60
      mistakes:
      - when:
          degrees: 120
        say: sin 120° is √3/2 too, but sin⁻¹ only gives angles from −90° to 90°.
      - when:
          degrees: 30
        say: sin 30° is ½. √3/2 belongs to a larger angle.
    - prompt: tan⁻¹(1)
      degrees: 45
      mistakes:
      - when:
          degrees: 225
        say: tan 225° is 1 as well, but the principal value lies between −90° and 90°.
    - prompt: cos⁻¹(cos 300°)
      degrees: 60
      mistakes:
      - when:
          degrees: 300
        say: 300° isn't in 0° to 180°, so cos⁻¹ can't give it back. cos 300° = cos 60° = ½, and cos⁻¹(½) = 60°.
  lesson:
    - teach: 'sin x is not one-one on ℝ: sin 30° = sin 150°. To get an inverse we restrict the domain to a piece where it is one-one. For sine we use [−π/2, π/2]; then sin⁻¹: [−1, 1] → [−π/2, π/2]. The value in this range is the principal value.'
      check:
        prompt: Why must the domain of sin x be restricted before inverting?
        options:
        - sin x repeats values, so it is not one-one
        - sin x is undefined at 0
        - sin x is always positive
        answer: sin x repeats values, so it is not one-one
        why: Only a one-one function can have an inverse.
      ways:
      - style: visual
        teach: Many angles have sine 1/2, so sin⁻¹ has to pick one. It picks the angle between −90° and 90°.
        picture:
          kind: number_line
          from: -90
          to: 180
          step: 30
          points:
          - at: -90
            label: −90°
          - at: 30
            label: 30° (chosen)
          - at: 90
            label: 90°
          - at: 150
            label: 150°
          jumps:
          - from: -90
            to: 90
            label: principal range of sin⁻¹
          alt: A line of angles from minus 90 to 180 degrees. Both 30 and 150 degrees have sine one half, but only 30 lies in the principal range from minus 90 to 90.
      - style: step_by_step
        teach: 'Step 1: Ask which angles have sin θ = 1/2: 30°, 150°, 390°, … Step 2: An inverse must give one answer, so restrict sine to [−90°, 90°], where it is one-one. Step 3: The only angle there is 30°. Step 4: So sin⁻¹(1/2) = 30° = π/6.'
    - teach: 'Principal ranges: sin⁻¹ → [−π/2, π/2], cos⁻¹ → [0, π], tan⁻¹ → (−π/2, π/2). So sin⁻¹(1/2) = π/6 (30°), cos⁻¹(1/2) = π/3 (60°), tan⁻¹(√3) = π/3 (60°).'
      picture:
        kind: compare
        columns:
        - title: Function
          points:
          - sin⁻¹x
          - cos⁻¹x
          - tan⁻¹x
        - title: Domain
          points:
          - '[−1, 1]'
          - '[−1, 1]'
          - all reals
        - title: Principal range
          points:
          - '[−90°, 90°]'
          - '[0°, 180°]'
          - (−90°, 90°)
        alt: Domains and principal ranges of the three main inverse trigonometric functions.
      check:
        prompt: Find cos⁻¹(1/2) in degrees.
        options:
        - '60'
        - '30'
        - '120'
        answer: '60'
        why: cos 60° = 1/2, and 60° is in [0°, 180°].
      ways:
      - style: step_by_step
        teach: 'Step 1: Name the function and its range: cos⁻¹ gives answers in [0, π]. Step 2: Ask which angle in that range has the given cosine. Step 3: cos⁻¹(1/2): cos 60° = 1/2 and 60° is in [0°, 180°], so the answer is π/3. Step 4: Always check the answer sits in the range.'
      - style: real_world
        teach: 'A calculator''s sin⁻¹ key works this way: type 0.5 and press sin⁻¹, and it shows 30, never 150. It has been built to give the principal value, so everyone gets the same single answer.'
    - teach: For negative inputs, stay inside the range. sin⁻¹(−1/2) = −30° (not 210°). cos⁻¹(−1/2) = 180° − 60° = 120°. The graph of each inverse is the reflection of the restricted trig graph in the line y = x.
      check:
        prompt: Find tan⁻¹(−1) in degrees.
        options:
        - '-45'
        - '135'
        - '45'
        answer: '-45'
        why: tan(−45°) = −1, and −45° is in (−90°, 90°).
      ways:
      - style: visual
        teach: For a negative input, sin⁻¹ goes below zero but cos⁻¹ goes past 90°.
        picture:
          kind: compare
          columns:
          - title: sin⁻¹(−1/2)
            points:
            - Range [−90°, 90°]
            - Stay on the negative side
            - = −30°
          - title: cos⁻¹(−1/2)
            points:
            - Range [0°, 180°]
            - Use 180° − 60°
            - = 120°
          alt: sin inverse of minus a half is minus 30 degrees; cos inverse of minus a half is 180 minus 60, which is 120 degrees.
      - style: step_by_step
        teach: 'Step 1: Find the angle for the positive input: sin⁻¹(1/2) = 30°, cos⁻¹(1/2) = 60°. Step 2: For sin⁻¹ and tan⁻¹, just make it negative: −30°. Step 3: For cos⁻¹, subtract from 180°: 180° − 60° = 120°. Step 4: Check both are in their ranges.'
  items:
  - prompt: Find sin⁻¹(1/2) in degrees.
    answer: '30'
    check: '30'
    difficulty: 1
    hints:
    - "Recall the sines of the special angles 0°, 30°, 45°, 60° and 90°."
    - In range.
    solution: 30° (π/6).
    mistakes: {"60": "m12_invtrig_value", "45": "m12_invtrig_value", "150": "m12_invtrig_value"}
  - prompt: Find cos⁻¹(−1/2) in degrees.
    answer: '120'
    check: '120'
    difficulty: 2
    hints:
    - Range 0 to 180°.
    - cos 120° = −1/2.
    solution: 120° (2π/3).
    mistakes:
      '-60': c12_principal
  - prompt: Find tan⁻¹(1) in degrees.
    answer: '45'
    check: '45'
    difficulty: 1
    hints:
    - "tan is sin ÷ cos. At which special angle are sin and cos equal?"
    - π/4.
    solution: 45°.
    mistakes: {"90": "m12_invtrig_value", "60": "m12_invtrig_value", "1": "m12_invtrig_value"}
  - prompt: Find sin⁻¹(−1/2) in degrees.
    answer: '-30'
    check: '-30'
    difficulty: 2
    hints:
    - Range −90° to 90°.
    - Negative angle.
    solution: −30°.
    mistakes:
      '330': c12_principal
  - prompt: 'The principal range of cos⁻¹x is:'
    options:
    - '[0, π]'
    - '[−π/2, π/2]'
    - (−π/2, π/2)
    - '[0, 2π]'
    answer: '[0, π]'
    difficulty: 1
    hints:
    - Includes obtuse angles.
    - Non-negative.
    solution: '[0, π].'
    mistakes: {"[−π/2, π/2]": "m12_principal_cos", "(−π/2, π/2)": "m12_principal_cos", "[0, 2π]": "m12_principal_cos"}
  - prompt: 'sin⁻¹x means:'
    options:
    - the angle whose sine is x
    - 1/sin x
    - sin x squared
    - −sin x
    answer: the angle whose sine is x
    difficulty: 1
    hints:
    - Inverse function.
    - Not a reciprocal.
    solution: The angle whose sine is x.
    mistakes:
      1/sin x: c12_notpower
  - prompt: Find sin⁻¹(1) in degrees.
    answer: '90'
    check: '90'
    difficulty: 1
    hints:
    - Which angle has sine 1?
    - It must be in [−90°, 90°].
    solution: 'Step 1: sin 90° = 1. Step 2: 90° is in range.'
    mistakes:
      '0': c12m2_range
      '180': c12m2_range
  - prompt: Find cos⁻¹(0) in degrees.
    answer: '90'
    check: '90'
    difficulty: 1
    hints:
    - Where is cosine zero?
    - Choose the one in [0°, 180°].
    solution: 'Step 1: cos 90° = 0. Step 2: 90°.'
    mistakes:
      '0': c12m2_range
      '270': c12m2_range
  - prompt: Find tan⁻¹(√3) in degrees.
    answer: '60'
    check: '60'
    difficulty: 1
    hints:
    - Recall the tangents of the standard angles.
    - Which one gives √3?
    solution: 'Step 1: tan 60° = √3. Step 2: 60°.'
    mistakes:
      '30': c12m2_range
      '240': c12m2_range
  - prompt: Find cos⁻¹(−√3/2) in degrees.
    answer: '150'
    check: 180 - 30
    difficulty: 2
    hints:
    - First find cos⁻¹(√3/2).
    - For a negative input of cos⁻¹, subtract from 180°.
    solution: 'Step 1: cos⁻¹(√3/2) = 30°. Step 2: 180° − 30° = 150°.'
    mistakes:
      '-30': c12m2_neg
      '210': c12m2_neg
  - prompt: Find sin⁻¹(−√3/2) in degrees.
    answer: '-60'
    check: '-60'
    difficulty: 2
    hints:
    - sin 60° = √3/2.
    - Sine's range lets the angle be negative.
    solution: 'Step 1: sin⁻¹(√3/2) = 60°. Step 2: sin⁻¹(−x) = −sin⁻¹x = −60°.'
    mistakes:
      '120': c12m2_neg
      '240': c12m2_neg
  - prompt: Find tan⁻¹(−1/√3) in degrees.
    answer: '-30'
    check: '-30'
    difficulty: 2
    hints:
    - tan 30° = 1/√3.
    - Keep the answer in (−90°, 90°).
    solution: 'Step 1: tan⁻¹(1/√3) = 30°. Step 2: −30°.'
    mistakes:
      '150': c12m2_neg
      '330': c12m2_neg
  - prompt: 'The domain of cos⁻¹x is:'
    options:
    - '[−1, 1]'
    - all real numbers
    - '[0, π]'
    answer: '[−1, 1]'
    difficulty: 2
    hints:
    - Inputs of cos⁻¹ are cosine values.
    - Cosine never goes beyond ±1.
    solution: 'Step 1: cos x takes values in [−1, 1]. Step 2: so cos⁻¹ accepts only those.'
    mistakes:
      all real numbers: c12m2_range
      '[0, π]': c12m2_range
  - prompt: Find cos⁻¹(1/2) + sin⁻¹(−1/2) in degrees.
    answer: '30'
    check: 60 + (-30)
    difficulty: 3
    hints:
    - Find each value separately.
    - Mind the sign of the second.
    solution: 'Step 1: cos⁻¹(1/2) = 60°. Step 2: sin⁻¹(−1/2) = −30°. Step 3: 30°.'
    mistakes:
      '90': c12m2_neg
      '-90': c12m2_neg
  - prompt: Find cos⁻¹(−1/√2) − tan⁻¹(1) in degrees.
    answer: '90'
    check: 135 - 45
    difficulty: 3
    hints:
    - cos⁻¹(1/√2) is 45°.
    - Use 180° minus for the negative input.
    solution: 'Step 1: cos⁻¹(−1/√2) = 135°. Step 2: tan⁻¹1 = 45°. Step 3: 90°.'
    mistakes:
      '-90': c12m2_neg
      '0': c12m2_neg
  - prompt: 'Assertion (A): sin⁻¹(sin 150°) = 30°.

      Reason (R): The principal value of sin⁻¹ lies in [−90°, 90°].'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: sin 150° = 1/2, and the angle in [−90°, 90°] with sine 1/2 is 30°. Because of R the answer cannot be 150°. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: The principal value of cos⁻¹(−√3/2) is
    options:
    - 5π/6
    - −π/6
    - π/6
    answer: 5π/6
    hints:
    - First find cos⁻¹(√3/2).
    - Then use cos⁻¹(−x) = π − cos⁻¹x.
    solution: cos⁻¹(√3/2) = π/6, so cos⁻¹(−√3/2) = π − π/6 = 5π/6, which lies in [0, π].
    mistakes:
      −π/6: pq12m2_cos_negative
      π/6: pq12m2_cos_negative
    exam: one_mark
    difficulty: 1
- code: cbse12m.invtrig.properties
  title: Properties and simplification
  after:
  - cbse12m.invtrig.basics
  notes: |
    sin(sin⁻¹x) = x for x ∈ [−1, 1]; sin⁻¹(sin x) = x only for x in [−π/2, π/2]. sin⁻¹(−x) = −sin⁻¹x; cos⁻¹(−x) = π − cos⁻¹x;
    tan⁻¹(−x) = −tan⁻¹x. sin⁻¹x + cos⁻¹x = π/2; tan⁻¹x + cot⁻¹x = π/2. tan⁻¹x + tan⁻¹y = tan⁻¹((x + y)/(1 − xy)) for xy < 1.
    sin⁻¹(1/x) = cosec⁻¹x.
  explanations:
    text: Inverse trig functions follow neat rules. For example, sin⁻¹x + cos⁻¹x is always π/2, and the inverse of a negative number relates simply to the positive one. These rules let you simplify complicated expressions.
    visual: Draw a right triangle with angle θ where sin θ = x. The other angle is π/2 − θ, and its cosine is also x. So sin⁻¹x + cos⁻¹x = π/2.
    step_by_step: 'Step 1: Spot a known identity. Step 2: Watch the principal range when removing inverses. Step 3: Simplify step by step.'
    real_world: Engineers use tan⁻¹ to find the angle of a ramp from its rise and run.
  picture:
    kind: flow
    steps:
    - sin θ = x
    - Complementary angle π/2 − θ
    - cos(π/2 − θ) = x
    - sin⁻¹x + cos⁻¹x = π/2
    alt: Why sin⁻¹x + cos⁻¹x = π/2, using complementary angles.
  activity:
    type: sort
    prompt: Is each statement true wherever both sides are defined?
    bins:
    - Always true (in its domain)
    - Not always true
    items:
    - label: sin(sin⁻¹x) = x, for x in [−1, 1]
      bin: Always true (in its domain)
      clue: sin⁻¹x is an angle whose sine is x. Take its sine.
      why: sin⁻¹x is the angle with sine x, so its sine is x.
    - label: sin⁻¹(sin x) = x, for every real x
      bin: Not always true
      clue: Try x = 180°. What is sin⁻¹(sin 180°)?
      why: sin 180° = 0 and sin⁻¹0 = 0°, not 180°. It only works for x in −90° to 90°.
    - label: sin⁻¹(−x) = −sin⁻¹x
      bin: Always true (in its domain)
      clue: Is sine an odd function?
      why: sin is odd and its principal range is symmetric about 0, so this holds.
    - label: cos⁻¹(−x) = −cos⁻¹x
      bin: Not always true
      clue: Can cos⁻¹ ever give a negative angle?
      why: cos⁻¹ gives 0° to 180°, never negative. The rule is cos⁻¹(−x) = π − cos⁻¹x.
    - label: cos⁻¹(−x) = π − cos⁻¹x
      bin: Always true (in its domain)
      clue: 'Try x = ½: is 120° = 180° − 60°?'
      why: Reflecting across the y-axis turns θ into 180° − θ.
    - label: sin⁻¹x + cos⁻¹x = π/2, for x in [−1, 1]
      bin: Always true (in its domain)
      clue: If sin θ = x, what is cos(90° − θ)?
      why: The two angles are complements.
    - label: tan⁻¹x + cot⁻¹x = π/2
      bin: Always true (in its domain)
      clue: Complementary angles swap tan and cot. Does that fit?
      why: If tan θ = x, then cot(90° − θ) = x.
    - label: sin⁻¹x = 1 / sin x
      bin: Not always true
      clue: Does the −1 mean 'inverse function' or 'reciprocal'?
      why: sin⁻¹ is the inverse function (an angle), not 1/sin x, which is cosec x.
    - label: tan⁻¹(−x) = −tan⁻¹x
      bin: Always true (in its domain)
      clue: Is tan an odd function with a symmetric range?
      why: 'Yes: tan is odd and its range is symmetric about 0.'
    - label: cos⁻¹(cos x) = x, for every real x
      bin: Not always true
      clue: Try x = 300°.
      why: cos⁻¹(cos 300°) = 60°. It's only x when x is in 0° to 180°.
  lesson:
    - teach: 'sin(sin⁻¹x) = x for every x in [−1, 1]. But sin⁻¹(sin x) = x only when x is already in [−π/2, π/2]. Otherwise find the angle in the principal range with the same sine. Example: sin⁻¹(sin 150°) = 30°.'
      check:
        prompt: Find sin⁻¹(sin 120°) in degrees.
        options:
        - '60'
        - '120'
        - '-60'
        answer: '60'
        why: sin 120° = sin 60°, and 60° is in [−90°, 90°].
      ways:
      - style: step_by_step
        teach: 'Simplify sin⁻¹(sin 2π/3). Step 1: 2π/3 = 120° is outside [−90°, 90°]. Step 2: sin 120° = sin 60°, because sin(180° − θ) = sin θ. Step 3: 60° is inside the range. Step 4: So sin⁻¹(sin 2π/3) = π/3, not 2π/3.'
      - style: real_world
        teach: 'Think of a clock that only shows times from 6 to 12. Ask it for 3 o''clock and it shows the matching time in its own window instead. sin⁻¹ is the same: it always answers inside its own window, so sin⁻¹(sin x) gives back x only if x was already in the window.'
    - teach: 'Complementary identities: sin⁻¹x + cos⁻¹x = π/2 and tan⁻¹x + cot⁻¹x = π/2. Negatives: sin⁻¹(−x) = −sin⁻¹x, tan⁻¹(−x) = −tan⁻¹x, cos⁻¹(−x) = π − cos⁻¹x.'
      check:
        prompt: Find sin⁻¹(0.7) + cos⁻¹(0.7) in degrees.
        options:
        - '90'
        - '180'
        - '126'
        answer: '90'
        why: The two always add to π/2 = 90°.
      ways:
      - style: visual
        teach: In a right triangle, if one acute angle is sin⁻¹x, the other is cos⁻¹x, and the two acute angles of a right triangle add to 90°.
        picture:
          kind: geometry
          points:
            A:
            - 1
            - 1
            B:
            - 8
            - 1
            C:
            - 8
            - 6
          segments:
          - - A
            - B
          - - B
            - C
            - x
          - - A
            - C
            - '1'
          angles:
          - at: A
            from: B
            to: C
            label: sin⁻¹x
          - at: C
            from: A
            to: B
            label: cos⁻¹x
          - at: B
            from: A
            to: C
            label: 90°
          alt: A right triangle with hypotenuse 1 and one side x. The angle opposite x is sin inverse x and the other acute angle is cos inverse x; together they make 90 degrees.
      - style: step_by_step
        teach: 'Step 1: Find sin⁻¹(1/3) + cos⁻¹(1/3). Step 2: The inputs are the same, so use sin⁻¹x + cos⁻¹x = π/2. Step 3: The answer is π/2 without finding either angle. Step 4: Spot pairs like this before reaching for a table.'
    - teach: 'Addition rule: tan⁻¹x + tan⁻¹y = tan⁻¹((x + y)/(1 − xy)) when xy < 1. Example: tan⁻¹(1/2) + tan⁻¹(1/3) = tan⁻¹((5/6)/(5/6)) = tan⁻¹1 = 45°.'
      picture:
        kind: flow
        steps:
        - 'Add: x + y'
        - 'Multiply: 1 − xy'
        - Divide
        - Take tan⁻¹
        alt: Steps for adding two inverse tangents with the formula.
      check:
        prompt: 'tan⁻¹(1/2) + tan⁻¹(1/3): what is (x + y)/(1 − xy)?'
        options:
        - '1'
        - 5/6
        - 6/5
        answer: '1'
        why: (5/6) ÷ (1 − 1/6) = (5/6) ÷ (5/6) = 1.
      ways:
      - style: step_by_step
        teach: 'Step 1: Check xy < 1: (1/2)(1/3) = 1/6. Step 2: Top: x + y = 1/2 + 1/3 = 5/6. Step 3: Bottom: 1 − xy = 1 − 1/6 = 5/6. Step 4: tan⁻¹(5/6 ÷ 5/6) = tan⁻¹1 = π/4.'
      - style: real_world
        teach: A ramp rises 1 in 2, then turns up more steeply by an extra angle whose tan is 1/3. The total angle above the ground is tan⁻¹(1/2) + tan⁻¹(1/3), which the addition rule shows is exactly 45°.
