# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse12-math
chapter: 2
title: Inverse Trigonometric Functions
tips:
  c12_principal: 'Principal ranges: sin⁻¹ in [−π/2, π/2], cos⁻¹ in [0, π], tan⁻¹ in (−π/2, π/2).'
  c12_notpower: sin⁻¹x is the inverse function, not 1/sin x. The reciprocal is cosec x.
  m12_inverse_undo: "sin and sin⁻¹ undo each other. Write 0.4 as a fraction."
  m12_invtrig_value: "Which angle in the principal range has sine 1/2?"
  m12_principal_cos: "cos x takes every value in [−1, 1] once between 0 and the angle where it reaches −1."
  m12_sin_cos_inv: "sin⁻¹x + cos⁻¹x is the same for every x in [−1, 1]. Try x = 0."
  m12_tan_cot: "tan⁻¹x + cot⁻¹x is constant. Try x = 1: each part is 45°."
  m12_tan_sum: "tan⁻¹a + tan⁻¹b = tan⁻¹[(a + b)/(1 − ab)]. Work it out, then convert."
concepts:
- code: cbse12m.invtrig.basics
  title: Domains and principal values
  notes: |
    Trigonometric functions are not one-one on ℝ, so their domains are restricted to make inverses. sin⁻¹: [−1, 1] →
    [−π/2, π/2]; cos⁻¹: [−1, 1] → [0, π]; tan⁻¹: ℝ → (−π/2, π/2); cosec⁻¹, sec⁻¹, cot⁻¹ similarly. Principal value: the value
    in the principal range. sin⁻¹(1/2) = π/6; cos⁻¹(−1/2) = 2π/3; tan⁻¹(1) = π/4. Graphs are reflections in y = x.
  explanations:
    text: Sine, cosine and tangent repeat, so to undo them we restrict them to one stretch where they don't repeat. The inverse gives the angle in that stretch, called the principal value. For example, sin⁻¹(1/2) = π/6.
    visual: 'Draw sin x between −π/2 and π/2: it rises steadily from −1 to 1. Flip it over the line y = x to get sin⁻¹x.'
    step_by_step: 'Step 1: Recall the principal range. Step 2: Find the angle in that range with the given ratio. Step 3: Check its sign matches the range.'
    real_world: 'Calculators give principal values: press sin⁻¹(0.5) and you get 30°, never 150°.'
  picture:
    kind: compare
    columns:
    - title: Function
      points:
      - sin⁻¹x
      - cos⁻¹x
      - tan⁻¹x
    - title: Domain
      points:
      - '[−1, 1]'
      - '[−1, 1]'
      - all reals
    - title: Principal range
      points:
      - '[−π/2, π/2]'
      - '[0, π]'
      - (−π/2, π/2)
    alt: Domains and principal ranges of sin⁻¹, cos⁻¹ and tan⁻¹.
  activity:
    type: angle
    prompt: Turn the arm to each principal value. sin⁻¹ gives −90° to 90°, cos⁻¹ gives 0° to 180°, tan⁻¹ gives between −90° and 90°.
    goals:
    - prompt: cos⁻¹(−½)
      degrees: 120
      mistakes:
      - when:
          degrees: 60
        say: 60° is cos⁻¹(+½). For a negative input, cos⁻¹(−x) = 180° − cos⁻¹x.
      - when:
          degrees: 240
        say: cos 240° is −½ too, but it isn't in 0° to 180°, the principal range of cos⁻¹.
    - prompt: sin⁻¹(√3/2)
      degrees: 60
      mistakes:
      - when:
          degrees: 120
        say: sin 120° is √3/2 too, but sin⁻¹ only gives angles from −90° to 90°.
      - when:
          degrees: 30
        say: sin 30° is ½. √3/2 belongs to a larger angle.
    - prompt: tan⁻¹(1)
      degrees: 45
      mistakes:
      - when:
          degrees: 225
        say: tan 225° is 1 as well, but the principal value lies between −90° and 90°.
    - prompt: cos⁻¹(cos 300°)
      degrees: 60
      mistakes:
      - when:
          degrees: 300
        say: 300° isn't in 0° to 180°, so cos⁻¹ can't give it back. cos 300° = cos 60° = ½, and cos⁻¹(½) = 60°.
  items:
  - prompt: Find sin⁻¹(1/2) in degrees.
    answer: '30'
    check: '30'
    difficulty: 1
    hints:
    - sin 30° = 1/2.
    - In range.
    solution: 30° (π/6).
    mistakes: {"60": "m12_invtrig_value", "45": "m12_invtrig_value", "150": "m12_invtrig_value"}
  - prompt: Find cos⁻¹(−1/2) in degrees.
    answer: '120'
    check: '120'
    difficulty: 2
    hints:
    - Range 0 to 180°.
    - cos 120° = −1/2.
    solution: 120° (2π/3).
    mistakes:
      '-60': c12_principal
  - prompt: Find tan⁻¹(1) in degrees.
    answer: '45'
    check: '45'
    difficulty: 1
    hints:
    - tan 45° = 1.
    - π/4.
    solution: 45°.
    mistakes: {"90": "m12_invtrig_value", "60": "m12_invtrig_value", "1": "m12_invtrig_value"}
  - prompt: Find sin⁻¹(−1/2) in degrees.
    answer: '-30'
    check: '-30'
    difficulty: 2
    hints:
    - Range −90° to 90°.
    - Negative angle.
    solution: −30°.
    mistakes:
      '330': c12_principal
  - prompt: 'The principal range of cos⁻¹x is:'
    options:
    - '[0, π]'
    - '[−π/2, π/2]'
    - (−π/2, π/2)
    - '[0, 2π]'
    answer: '[0, π]'
    difficulty: 1
    hints:
    - Includes obtuse angles.
    - Non-negative.
    solution: '[0, π].'
    mistakes: {"[−π/2, π/2]": "m12_principal_cos", "(−π/2, π/2)": "m12_principal_cos", "[0, 2π]": "m12_principal_cos"}
  - prompt: 'sin⁻¹x means:'
    options:
    - the angle whose sine is x
    - 1/sin x
    - sin x squared
    - −sin x
    answer: the angle whose sine is x
    difficulty: 1
    hints:
    - Inverse function.
    - Not a reciprocal.
    solution: The angle whose sine is x.
    mistakes:
      1/sin x: c12_notpower
- code: cbse12m.invtrig.properties
  title: Properties and simplification
  after:
  - cbse12m.invtrig.basics
  notes: |
    sin(sin⁻¹x) = x for x ∈ [−1, 1]; sin⁻¹(sin x) = x only for x in [−π/2, π/2]. sin⁻¹(−x) = −sin⁻¹x; cos⁻¹(−x) = π − cos⁻¹x;
    tan⁻¹(−x) = −tan⁻¹x. sin⁻¹x + cos⁻¹x = π/2; tan⁻¹x + cot⁻¹x = π/2. tan⁻¹x + tan⁻¹y = tan⁻¹((x + y)/(1 − xy)) for xy < 1.
    sin⁻¹(1/x) = cosec⁻¹x.
  explanations:
    text: Inverse trig functions follow neat rules. For example, sin⁻¹x + cos⁻¹x is always π/2, and the inverse of a negative number relates simply to the positive one. These rules let you simplify complicated expressions.
    visual: Draw a right triangle with angle θ where sin θ = x. The other angle is π/2 − θ, and its cosine is also x. So sin⁻¹x + cos⁻¹x = π/2.
    step_by_step: 'Step 1: Spot a known identity. Step 2: Watch the principal range when removing inverses. Step 3: Simplify step by step.'
    real_world: Engineers use tan⁻¹ to find the angle of a ramp from its rise and run.
  picture:
    kind: flow
    steps:
    - sin θ = x
    - Complementary angle π/2 − θ
    - cos(π/2 − θ) = x
    - sin⁻¹x + cos⁻¹x = π/2
    alt: Why sin⁻¹x + cos⁻¹x = π/2, using complementary angles.
  activity:
    type: sort
    prompt: Is each statement true wherever both sides are defined?
    bins:
    - Always true (in its domain)
    - Not always true
    items:
    - label: sin(sin⁻¹x) = x, for x in [−1, 1]
      bin: Always true (in its domain)
      clue: sin⁻¹x is an angle whose sine is x. Take its sine.
      why: sin⁻¹x is the angle with sine x, so its sine is x.
    - label: sin⁻¹(sin x) = x, for every real x
      bin: Not always true
      clue: Try x = 180°. What is sin⁻¹(sin 180°)?
      why: sin 180° = 0 and sin⁻¹0 = 0°, not 180°. It only works for x in −90° to 90°.
    - label: sin⁻¹(−x) = −sin⁻¹x
      bin: Always true (in its domain)
      clue: Is sine an odd function?
      why: sin is odd and its principal range is symmetric about 0, so this holds.
    - label: cos⁻¹(−x) = −cos⁻¹x
      bin: Not always true
      clue: Can cos⁻¹ ever give a negative angle?
      why: cos⁻¹ gives 0° to 180°, never negative. The rule is cos⁻¹(−x) = π − cos⁻¹x.
    - label: cos⁻¹(−x) = π − cos⁻¹x
      bin: Always true (in its domain)
      clue: 'Try x = ½: is 120° = 180° − 60°?'
      why: Reflecting across the y-axis turns θ into 180° − θ.
    - label: sin⁻¹x + cos⁻¹x = π/2, for x in [−1, 1]
      bin: Always true (in its domain)
      clue: If sin θ = x, what is cos(90° − θ)?
      why: The two angles are complements.
    - label: tan⁻¹x + cot⁻¹x = π/2
      bin: Always true (in its domain)
      clue: Complementary angles swap tan and cot. Does that fit?
      why: If tan θ = x, then cot(90° − θ) = x.
    - label: sin⁻¹x = 1 / sin x
      bin: Not always true
      clue: Does the −1 mean 'inverse function' or 'reciprocal'?
      why: sin⁻¹ is the inverse function (an angle), not 1/sin x, which is cosec x.
    - label: tan⁻¹(−x) = −tan⁻¹x
      bin: Always true (in its domain)
      clue: Is tan an odd function with a symmetric range?
      why: 'Yes: tan is odd and its range is symmetric about 0.'
    - label: cos⁻¹(cos x) = x, for every real x
      bin: Not always true
      clue: Try x = 300°.
      why: cos⁻¹(cos 300°) = 60°. It's only x when x is in 0° to 180°.
  items:
  - prompt: Find sin⁻¹(0.3) + cos⁻¹(0.3) in degrees.
    answer: '90'
    check: '90'
    difficulty: 1
    hints:
    - Identity.
    - π/2.
    solution: 90°.
    mistakes: {"0": "m12_sin_cos_inv", "0.6": "m12_sin_cos_inv", "180": "m12_sin_cos_inv"}
  - prompt: Find tan⁻¹(1/2) + tan⁻¹(1/3) in degrees.
    answer: '45'
    check: '45'
    difficulty: 2
    hints:
    - (1/2 + 1/3)/(1 − 1/6).
    - = 1.
    solution: 45°.
    mistakes: {"30": "m12_tan_sum", "60": "m12_tan_sum", "90": "m12_tan_sum"}
  - prompt: Find cos⁻¹(−1) in degrees.
    answer: '180'
    check: '180'
    difficulty: 1
    hints:
    - π − cos⁻¹(1).
    - π − 0.
    solution: 180°.
    mistakes: {"0": "m12_principal_cos", "-180": "m12_principal_cos", "90": "m12_principal_cos"}
  - prompt: Find sin(sin⁻¹(0.4)) as a fraction.
    answer: 2/5
    check: Rational(2,5)
    difficulty: 1
    hints:
    - They cancel.
    - 0.4 is in [−1, 1].
    solution: 2/5.
    mistakes: {"3/5": "m12_inverse_undo", "5/2": "m12_inverse_undo"}
  - prompt: 'sin⁻¹(sin(2π/3)) equals:'
    options:
    - π/3
    - 2π/3
    - −π/3
    - π/6
    answer: π/3
    difficulty: 2
    hints:
    - 2π/3 is outside [−π/2, π/2].
    - sin(2π/3) = sin(π/3).
    solution: π/3.
    mistakes:
      2π/3: c12_principal
  - prompt: 'tan⁻¹x + cot⁻¹x equals:'
    options:
    - π/2
    - π
    - '0'
    - π/4
    answer: π/2
    difficulty: 1
    hints:
    - Complementary.
    - Like sin and cos.
    solution: π/2.
    mistakes: {"π": "m12_tan_cot", "0": "m12_tan_cot", "π/4": "m12_tan_cot"}
