# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 11. Format: content/README.md.
subject: cbse12-math
chapter: 11
title: Three Dimensional Geometry
tips:
  c12_line: 'A line through a with direction b: r = a + λb. In Cartesian form (x − x₁)/a = (y − y₁)/b = (z − z₁)/c.'
  c12_skew: Skew lines are neither parallel nor intersecting; the shortest distance between them is along their common perpendicular.
  m12_angle_lines: "cos θ = (a₁a₂ + b₁b₂ + c₁c₂)/(|a||b|). Here the dot product is zero."
  m12_common_perp: "The shortest segment between two lines meets both at right angles."
  m12_dir_ratios: "Direction ratios = differences of coordinates: (4 − 1, 6 − 2, 3 − 3)."
  m12_intersect: "Zero distance means the lines share a point."
  m12_parallel_distance: "Both lines run along i. How far apart are the points (0, 0, 0) and (0, 1, 0), sideways?"
  m12_skew_distance: "Shortest distance = |(a₂ − a₁) · (b₁ × b₂)| / |b₁ × b₂|. One line is the x-axis."
concepts:
- code: cbse12m.3d.lines
  title: Direction ratios and equation of a line
  notes: |
    Direction cosines l, m, n and direction ratios a, b, c (proportional to l, m, n). Line through two points: direction
    ratios x₂ − x₁ etc. Equation of a line through point a parallel to b: r = a + λb; Cartesian (x − x₁)/a = (y − y₁)/b =
    (z − z₁)/c. Angle between lines: cos θ = |a₁a₂ + b₁b₂ + c₁c₂| / (√(a₁² + b₁² + c₁²) √(a₂² + b₂² + c₂²)); perpendicular if
    a₁a₂ + b₁b₂ + c₁c₂ = 0. (Planes removed in rationalised syllabus.)
  explanations:
    text: A line in space is fixed by a point on it and a direction. The direction is given by direction ratios. Two lines are perpendicular if the dot product of their direction ratios is zero.
    visual: 'Picture a laser pointer: where it starts is the point a, and the way it points is the direction b. Every point on the beam is a + λb for some λ.'
    step_by_step: 'Step 1: Find a point on the line. Step 2: Find direction ratios (from two points, subtract coordinates). Step 3: Write r = a + λb or the Cartesian form. Step 4: For angles, use the dot product formula.'
    real_world: Air traffic controllers describe flight paths as lines in 3D space to keep planes apart.
  picture:
    kind: flow
    steps:
    - Point a on the line
    - Direction b
    - r = a + λb
    - 'Cartesian: (x − x₁)/a = (y − y₁)/b = (z − z₁)/c'
    alt: Writing the equation of a line in space from a point and a direction.
  activity:
    type: formula
    prompt: P is (1, 2, 3). Move Q. The line PQ has direction ratios x − 1, y − 2, z − 3.
    inputs:
    - name: x
      label: Q's x
      min: -4
      max: 8
      step: 1
      start: 0
    - name: y
      label: Q's y
      min: -4
      max: 8
      step: 1
      start: 0
    - name: z
      label: Q's z
      min: -4
      max: 10
      step: 1
      start: 0
    outputs:
    - name: pq
      label: '|PQ|'
      expr: sqrt((x-1)^2+(y-2)^2+(z-3)^2)
      places: 2
    - name: cross
      label: How far from parallel to (2, −1, 2)
      expr: sqrt((2*(y-2)+(z-3))^2+(2*(z-3)-2*(x-1))^2+(-(x-1)-2*(y-2))^2)
      places: 2
    - name: dot
      label: Dot with (2, −1, 2)
      expr: 2*(x-1)-(y-2)+2*(z-3)
    goals:
    - prompt: Make PQ have direction ratios proportional to 2, −1, 2.
      want:
        cross: 0
        pq:
        - 0.5
        - 30
      mistakes:
      - when:
          x: 2
          y: -1
          z: 2
        say: 'That puts Q AT (2, −1, 2). Direction ratios are the differences Q − P: x − 1, y − 2, z − 3.'
      - when:
          cross:
          - 0.01
          - 3
        say: Close, but not parallel yet. Make x − 1, y − 2, z − 3 a multiple of 2, −1, 2.
    - prompt: Make PQ parallel to the z-axis.
      want:
        x: 1
        y: 2
        pq:
        - 0.5
        - 30
      mistakes:
      - when:
          z: 3
          pq:
          - 0.5
          - 30
        say: With z unchanged, PQ lies flat, at right angles to the z-axis. Keep x and y as P's and change z.
    - prompt: Make PQ perpendicular to the direction (2, −1, 2), with Q not on P.
      want:
        dot: 0
        pq:
        - 0.5
        - 30
      mistakes:
      - when:
          cross: 0
          pq:
          - 0.5
          - 30
        say: That's parallel to (2, −1, 2), the opposite of perpendicular. You need 2(x − 1) − (y − 2) + 2(z − 3) = 0.
  items:
  - prompt: The line through (1, 2, 3) and (4, 6, 3) has direction ratios (3, 4, k). Find k.
    answer: '0'
    check: 3-3
    difficulty: 1
    hints:
    - 3 − 3.
    - Subtract z.
    solution: '0.'
    mistakes: {"3": "m12_dir_ratios", "6": "m12_dir_ratios"}
  - prompt: 'Lines with direction ratios (1, 2, 3) and (3, −3, 1): find a₁a₂ + b₁b₂ + c₁c₂.'
    answer: '0'
    check: 1*3+2*(-3)+3*1
    difficulty: 1
    hints:
    - 3 − 6 + 3.
    - Sum.
    solution: 0, so they're perpendicular.
    mistakes: {"3": "m12_dot", "6": "m12_dot", "-6": "m12_dot"}
  - prompt: Find the angle (degrees) between lines with direction ratios (1, 0, 0) and (0, 1, 0).
    answer: '90'
    check: '90'
    difficulty: 1
    hints:
    - Dot product 0.
    - Axes.
    solution: 90°.
    mistakes: {"0": "m12_angle_lines", "45": "m12_angle_lines"}
  - prompt: Find the angle (degrees) between lines with direction ratios (1, 1, 0) and (1, 0, 0).
    answer: '45'
    check: '45'
    difficulty: 2
    hints:
    - cos θ = 1/√2.
    - 45°.
    solution: 45°.
    mistakes: {"90": "m12_angle_lines", "30": "m12_angle_lines", "60": "m12_angle_lines"}
  - prompt: 'Two lines in space that are neither parallel nor intersecting are:'
    options:
    - skew lines
    - coplanar lines
    - perpendicular lines
    - identical lines
    answer: skew lines
    difficulty: 2
    hints:
    - Different planes.
    - Don't meet.
    solution: Skew lines.
    mistakes:
      perpendicular lines: c12_skew
  - prompt: 'In r = a + λb, the vector b gives the line''s:'
    options:
    - direction
    - starting point
    - length
    - distance from origin
    answer: direction
    difficulty: 1
    hints:
    - λ moves along b.
    - Parallel vector.
    solution: Direction.
    mistakes:
      starting point: c12_line
- code: cbse12m.3d.distance
  title: Shortest distance between lines
  after:
  - cbse12m.3d.lines
  notes: |
    Shortest distance between skew lines r = a₁ + λb₁ and r = a₂ + μb₂: d = |(b₁ × b₂)·(a₂ − a₁)| / |b₁ × b₂|. Parallel lines
    r = a₁ + λb and a₂ + μb: d = |b × (a₂ − a₁)| / |b|. Lines intersect if d = 0. Distance of a point from the origin
    √(x² + y² + z²); between two points √(Δx² + Δy² + Δz²).
  explanations:
    text: The shortest distance between two lines in space is measured along a line perpendicular to both. For skew lines there's a formula using the cross and dot products; if the distance is zero, the lines meet.
    visual: Picture two rods in a room, one along the floor and one across the ceiling at an angle. The shortest gap between them is the vertical drop where they cross over.
    step_by_step: 'Step 1: Find b₁ × b₂. Step 2: Find a₂ − a₁. Step 3: Dot them and take the absolute value. Step 4: Divide by |b₁ × b₂|.'
    real_world: Engineers check minimum distances between pipes and cables running through buildings.
  picture:
    kind: compare
    columns:
    - title: Lines
      points:
      - skew
      - parallel
      - intersecting
    - title: Shortest distance
      points:
      - '|(b₁ × b₂)·(a₂ − a₁)|/|b₁ × b₂|'
      - '|b × (a₂ − a₁)|/|b|'
      - '0'
    alt: 'Shortest distance between lines: skew, parallel and intersecting.'
  activity:
    type: formula
    prompt: Line 1 is the x-axis (direction i). Line 2 runs along j through the point (x, y, z). b₁ × b₂ = k, so the shortest distance is |(a₂ − a₁)·k| = |z|.
    inputs:
    - name: x
      label: x
      min: -6
      max: 6
      step: 1
      start: 0
    - name: y
      label: y
      min: -6
      max: 6
      step: 1
      start: 0
    - name: z
      label: z
      min: -6
      max: 6
      step: 1
      start: 1
    outputs:
    - name: sd
      label: Shortest distance |z|
      expr: abs(z)
    - name: oa
      label: Distance between the chosen points
      expr: sqrt(x^2+y^2+z^2)
      places: 2
    goals:
    - prompt: Make the shortest distance 4, with the point (x, y, z) 5 from the origin.
      want:
        sd: 4
        oa: 5
      mistakes:
      - when:
          oa: 4
        say: 4 is the gap between the two chosen points. The shortest distance only counts the part along b₁ × b₂, here the z-direction.
      - when:
          sd: 4
          oa:
          - 4.1
          - 4.9
        say: 'The shortest distance is 4, but the point is not yet 5 from the origin: x² + y² must be 9.'
    - prompt: Make the two lines meet.
      want:
        sd: 0
      mistakes:
      - when:
          x: 0
          y: 0
          sd:
          - 1
          - 6
        say: 'Moving the point onto the z-axis doesn''t help: the lines still pass one above the other. Only z decides.'
    - prompt: Keep the point at x = 3, y = 3. Make the lines exactly 2 apart.
      want:
        x: 3
        y: 3
        sd: 2
      mistakes:
      - when:
          x: 3
          y: 3
          sd:
          - 3
          - 6
        say: 'Too far apart. Only z sets the gap here: the shortest distance is |z|.'
  items:
  - prompt: Find the distance between (1, 2, 2) and the origin.
    answer: '3'
    check: sqrt(1+4+4)
    difficulty: 1
    hints:
    - √(1 + 4 + 4).
    - √9.
    solution: '3.'
    mistakes: {"5": "m12_vec_mag", "9": "m12_vec_mag"}
  - prompt: Find the distance between (1, 1, 1) and (3, 3, 2).
    answer: '3'
    check: sqrt(2**2+2**2+1**2)
    difficulty: 1
    hints:
    - (2, 2, 1).
    - √9.
    solution: '3.'
    mistakes: {"9": "m12_vec_mag", "5": "m12_vec_mag"}
  - prompt: Lines r = λi and r = j + μk (along x-axis and parallel to z-axis through (0,1,0)). Find their shortest distance.
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - b₁ × b₂ = i × k = −j.
    - '|(−j)·j| / 1.'
    solution: '1.'
    mistakes: {"0": "m12_skew_distance", "2": "m12_skew_distance"}
  - prompt: 'If the shortest distance between two lines is 0, they:'
    options:
    - intersect
    - are skew
    - are parallel and distinct
    - are perpendicular always
    answer: intersect
    difficulty: 1
    hints:
    - No gap.
    - Meet.
    solution: They intersect.
    mistakes: {"are skew": "m12_intersect", "are parallel and distinct": "m12_intersect", "are perpendicular always": "m12_intersect"}
  - prompt: 'The shortest distance between skew lines is along their:'
    options:
    - common perpendicular
    - common direction
    - x-axis
    - first line
    answer: common perpendicular
    difficulty: 2
    hints:
    - Perpendicular to both.
    - b₁ × b₂.
    solution: Their common perpendicular.
    mistakes: {"common direction": "m12_common_perp", "x-axis": "m12_common_perp", "first line": "m12_common_perp"}
  - prompt: Parallel lines r = λi and r = j + μi. Find the distance between them.
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - Both along i.
    - Gap along j.
    solution: '1.'
    mistakes: {"0": "m12_parallel_distance", "2": "m12_parallel_distance"}
