# CBSE Class 12 Mathematics (NCERT, rationalised syllabus), chapter 11. Format: content/README.md.
subject: cbse12-math
chapter: 11
title: Three Dimensional Geometry
tips:
  c12_line: "In r = a + λb, a is a fixed point on the line and λ slides you along it by multiples of b. What does b fix?"
  c12_skew: "In space, two lines can be parallel, meet, or do neither. Lines that do neither have a special name, from an old word for slanting."
  m12_angle_lines: "cos θ = (a₁a₂ + b₁b₂ + c₁c₂)/(|a||b|). Here the dot product is zero."
  m12_common_perp: "The shortest segment between two lines meets both at right angles."
  m12_dir_ratios: "Direction ratios = differences of coordinates: (4 − 1, 6 − 2, 3 − 3)."
  m12_intersect: "Zero distance means the lines share a point."
  m12_parallel_distance: "Both lines run along i. How far apart are the points (0, 0, 0) and (0, 1, 0) in the sideways direction?"
  m12_skew_distance: "Shortest distance = |(a₂ − a₁) · (b₁ × b₂)| / |b₁ × b₂|. One line is the x-axis."
  c12m11_dr: Direction ratios of the line through two points are the differences of their coordinates, in the same order.
  c12m11_angle: cos θ = |a₁a₂ + b₁b₂ + c₁c₂| divided by the product of the two lengths. A zero numerator means perpendicular.
  c12m11_dist: 'Use the right formula: skew lines need (b₁ × b₂)·(a₂ − a₁); parallel lines need b × (a₂ − a₁).'
  pq12m11_lambda: 'Each value of λ gives one point: multiply the direction vector by λ, then add it to the starting point.'
  pq12m11_check_parallel: Compare the two direction vectors first. Are they multiples of each other? Then think what b₁ × b₂ would be.
concepts:
- code: cbse12m.3d.lines
  title: Direction ratios and equation of a line
  notes: |
    Direction cosines l, m, n and direction ratios a, b, c (proportional to l, m, n). Line through two points: direction
    ratios x₂ − x₁ etc. Equation of a line through point a parallel to b: r = a + λb; Cartesian (x − x₁)/a = (y − y₁)/b =
    (z − z₁)/c. Angle between lines: cos θ = |a₁a₂ + b₁b₂ + c₁c₂| / (√(a₁² + b₁² + c₁²) √(a₂² + b₂² + c₂²)); perpendicular if
    a₁a₂ + b₁b₂ + c₁c₂ = 0. (Planes removed in rationalised syllabus.)
  explanations:
    text: A line in space is fixed by a point on it and a direction. The direction is given by direction ratios. Two lines are perpendicular if the dot product of their direction ratios is zero.
    visual: 'Picture a laser pointer: where it starts is the point a, and the way it points is the direction b. Every point on the beam is a + λb for some λ.'
    step_by_step: 'Step 1: Find a point on the line. Step 2: Find direction ratios (from two points, subtract coordinates). Step 3: Write r = a + λb or the Cartesian form. Step 4: For angles, use the dot product formula.'
    real_world: Air traffic controllers describe flight paths as lines in 3D space to keep planes apart.
  picture:
    kind: flow
    steps:
    - Point a on the line
    - Direction b
    - r = a + λb
    - 'Cartesian: (x − x₁)/a = (y − y₁)/b = (z − z₁)/c'
    alt: Writing the equation of a line in space from a point and a direction.
  activity:
    type: formula
    prompt: P is (1, 2, 3). Move Q. The line PQ has direction ratios x − 1, y − 2, z − 3.
    inputs:
    - name: x
      label: Q's x
      min: -4
      max: 8
      step: 1
      start: 0
    - name: y
      label: Q's y
      min: -4
      max: 8
      step: 1
      start: 0
    - name: z
      label: Q's z
      min: -4
      max: 10
      step: 1
      start: 0
    outputs:
    - name: pq
      label: '|PQ|'
      expr: sqrt((x-1)^2+(y-2)^2+(z-3)^2)
      places: 2
    - name: cross
      label: How far from parallel to (2, −1, 2)
      expr: sqrt((2*(y-2)+(z-3))^2+(2*(z-3)-2*(x-1))^2+(-(x-1)-2*(y-2))^2)
      places: 2
    - name: dot
      label: Dot with (2, −1, 2)
      expr: 2*(x-1)-(y-2)+2*(z-3)
    goals:
    - prompt: Make PQ have direction ratios proportional to 2, −1, 2.
      want:
        cross: 0
        pq:
        - 0.5
        - 30
      mistakes:
      - when:
          x: 2
          y: -1
          z: 2
        say: 'That puts Q AT (2, −1, 2). Direction ratios are the differences Q − P: x − 1, y − 2, z − 3.'
      - when:
          cross:
          - 0.01
          - 3
        say: Close, but not parallel yet. Make x − 1, y − 2, z − 3 a multiple of 2, −1, 2.
    - prompt: Make PQ parallel to the z-axis.
      want:
        x: 1
        y: 2
        pq:
        - 0.5
        - 30
      mistakes:
      - when:
          z: 3
          pq:
          - 0.5
          - 30
        say: With z unchanged, PQ lies flat, at right angles to the z-axis. Keep x and y as P's and change z.
    - prompt: Make PQ perpendicular to the direction (2, −1, 2), with Q not on P.
      want:
        dot: 0
        pq:
        - 0.5
        - 30
      mistakes:
      - when:
          cross: 0
          pq:
          - 0.5
          - 30
        say: That's parallel to (2, −1, 2), the opposite of perpendicular. You need 2(x − 1) − (y − 2) + 2(z − 3) = 0.
  lesson:
    - teach: A line's direction is described by direction ratios (a, b, c), any numbers proportional to its direction cosines. For the line through (x₁, y₁, z₁) and (x₂, y₂, z₂), take (x₂ − x₁, y₂ − y₁, z₂ − z₁).
      check:
        prompt: Direction ratios of the line through (1, 0, 2) and (3, 1, 5)?
        options:
        - (2, 1, 3)
        - (4, 1, 7)
        - (1, 0, 2)
        answer: (2, 1, 3)
        why: 'Subtract: (3 − 1, 1 − 0, 5 − 2).'
      ways:
      - style: visual
        teach: Direction ratios and direction cosines of the line through (2, −1, 3) and (5, 3, −1).
        picture:
          kind: flow
          steps:
          - 'Differences: (5 − 2, 3 − (−1), −1 − 3)'
          - Direction ratios (3, 4, −4)
          - Length √(9 + 16 + 16) = √41
          - Direction cosines (3/√41, 4/√41, −4/√41)
          alt: Subtract the coordinates to get direction ratios 3, 4, minus 4. Their length is root 41, so the direction cosines are 3, 4 and minus 4, each over root 41.
      - style: real_world
        teach: A zip-line runs straight from a platform at (0, 0, 20) to a landing point at (30, 40, 0) metres. Its direction ratios (30, 40, −20), or more simply (3, 4, −2), say how far it goes east and north for every drop.
    - teach: 'Equation of a line through point a parallel to vector b: r = a + λb. In Cartesian form, through (x₁, y₁, z₁) with direction ratios (a, b, c): (x − x₁)/a = (y − y₁)/b = (z − z₁)/c. Each value of λ gives one point.'
      picture:
        kind: flow
        steps:
        - Pick a point a on the line
        - Pick a direction b
        - r = a + λb
        - λ = 0, 1, 2, … gives points
        alt: Building the vector equation of a line.
      check:
        prompt: r = (1, 2, 0) + λ(1, 1, 1). Point at λ = 2?
        options:
        - (3, 4, 2)
        - (2, 3, 1)
        - (1, 2, 2)
        answer: (3, 4, 2)
        why: (1 + 2, 2 + 2, 0 + 2).
      ways:
      - style: step_by_step
        teach: 'Line through (1, 2, −1) parallel to 2i − j + 3k. Step 1: Vector form r = (i + 2j − k) + λ(2i − j + 3k). Step 2: Cartesian form (x − 1)/2 = (y − 2)/(−1) = (z + 1)/3. Step 3: λ = 1 gives the point (3, 1, 2). Step 4: Check: (3 − 1)/2 = (1 − 2)/(−1) = (2 + 1)/3 = 1.'
      - style: real_world
        teach: 'A plane flying straight has position = start point + time × velocity. That is r = a + λb: a is where it took off, b is its velocity vector, and λ is the time. Each moment gives one point on its path.'
    - teach: 'Angle between lines with direction ratios (a₁, b₁, c₁) and (a₂, b₂, c₂): cos θ = |a₁a₂ + b₁b₂ + c₁c₂| / (√(a₁² + b₁² + c₁²) √(a₂² + b₂² + c₂²)). They are perpendicular when a₁a₂ + b₁b₂ + c₁c₂ = 0 and parallel when the ratios are proportional.'
      check:
        prompt: 'Lines with direction ratios (1, 2, 3) and (2, 4, 6) are:'
        options:
        - parallel
        - perpendicular
        - skew
        answer: parallel
        why: (2, 4, 6) = 2 × (1, 2, 3).
      ways:
      - style: visual
        teach: Testing two lines for perpendicular or parallel from their direction ratios.
        picture:
          kind: compare
          columns:
          - title: Perpendicular
            points:
            - (1, 2, −1) and (3, −1, 1)
            - 3 − 2 − 1 = 0
          - title: Parallel
            points:
            - (1, 2, −1) and (2, 4, −2)
            - Second = 2 × first
          alt: Direction ratios 1, 2, minus 1 and 3, minus 1, 1 give a sum of products 0, so the lines are perpendicular. 1, 2, minus 1 and 2, 4, minus 2 are in proportion, so the lines are parallel.
      - style: step_by_step
        teach: 'Angle between lines with direction ratios (2, 2, 1) and (1, 0, 0). Step 1: Sum of products: 2 + 0 + 0 = 2. Step 2: Lengths: √(4 + 4 + 1) = 3 and 1. Step 3: cos θ = 2/(3 × 1) = 2/3. Step 4: θ = cos⁻¹(2/3), about 48°.'
  items:
  - prompt: The line through (1, 2, 3) and (4, 6, 3) has direction ratios (3, 4, k). Find k.
    answer: '0'
    check: 3-3
    difficulty: 1
    hints:
    - 3 − 3.
    - Subtract z.
    solution: "Direction ratios = (4 − 1, 6 − 2, 3 − 3) = (3, 4, 0), so k = 0."
    mistakes: {"3": "m12_dir_ratios", "6": "m12_dir_ratios"}
  - prompt: 'Lines with direction ratios (1, 2, 3) and (3, −3, 1): find a₁a₂ + b₁b₂ + c₁c₂.'
    answer: '0'
    check: 1*3+2*(-3)+3*1
    difficulty: 1
    hints:
    - 3 − 6 + 3.
    - Sum.
    solution: "1 × 3 + 2 × (−3) + 3 × 1 = 3 − 6 + 3 = 0, so the lines are perpendicular."
    mistakes: {"3": "m12_dot", "6": "m12_dot", "-6": "m12_dot"}
  - prompt: Find the angle (degrees) between lines with direction ratios (1, 0, 0) and (0, 1, 0).
    answer: '90'
    check: '90'
    difficulty: 1
    hints:
    - Dot product 0.
    - Axes.
    solution: "cos θ = (0 + 0 + 0)/(1 × 1) = 0, so θ = 90°."
    mistakes: {"0": "m12_angle_lines", "45": "m12_angle_lines"}
  - prompt: Find the angle (degrees) between lines with direction ratios (1, 1, 0) and (1, 0, 0).
    answer: '45'
    check: '45'
    difficulty: 2
    hints:
    - cos θ = 1/√2.
    - 45°.
    solution: "cos θ = (1 + 0 + 0)/(√2 × 1) = 1/√2, so θ = 45°."
    mistakes: {"90": "m12_angle_lines", "30": "m12_angle_lines", "60": "m12_angle_lines"}
  - prompt: 'Two lines in space that are neither parallel nor intersecting are:'
    options:
    - skew lines
    - coplanar lines
    - perpendicular lines
    - identical lines
    answer: skew lines
    difficulty: 2
    hints:
    - Different planes.
    - Don't meet.
    solution: "Lines that do not meet and are not parallel cannot lie in one plane; they are called skew lines."
    mistakes:
      perpendicular lines: c12_skew
  - prompt: 'In r = a + λb, the vector b gives the line''s:'
    options:
    - direction
    - starting point
    - length
    - distance from origin
    answer: direction
    difficulty: 1
    hints:
    - λ moves along b.
    - Parallel vector.
    solution: "a is a fixed point on the line; as λ changes you move along b, so b gives the direction."
    mistakes:
      starting point: c12_line
  - prompt: The line through (2, 1, 0) and (5, 1, 4) has direction ratios (3, k, 4). Find k.
    answer: '0'
    check: 1 - 1
    difficulty: 1
    hints:
    - Subtract the y-coordinates.
    - 1 − 1.
    solution: 'Step 1: y₂ − y₁ = 0. Step 2: k = 0.'
    mistakes:
      '1': c12m11_dr
      '2': c12m11_dr
  - prompt: r = (0, 1, 2) + λ(2, 0, 1). Find the x-coordinate when λ = 3.
    answer: '6'
    check: 0 + 3*2
    difficulty: 1
    hints:
    - x = 0 + 2λ.
    - Put λ = 3.
    solution: 'Step 1: 0 + 6. Step 2: 6.'
    mistakes:
      '5': c12m11_dr
      '3': c12m11_dr
  - prompt: 'Direction ratios (2, 3, 6): find the length √(a² + b² + c²).'
    answer: '7'
    check: sqrt(4 + 9 + 36)
    difficulty: 1
    hints:
    - Square and add.
    - Then take the root.
    solution: 'Step 1: 49. Step 2: 7.'
    mistakes:
      '11': c12m11_dr
      '49': c12m11_dr
  - prompt: Lines with direction ratios (2, −1, 1) and (1, k, −1) are perpendicular. Find k.
    answer: '1'
    check: 2 - 1
    difficulty: 2
    hints:
    - Set a₁a₂ + b₁b₂ + c₁c₂ = 0.
    - 2 − k − 1 = 0.
    solution: 'Step 1: 1 − k = 0. Step 2: k = 1.'
    mistakes:
      '-1': c12m11_angle
      '3': c12m11_angle
  - prompt: Find the angle (degrees) between lines with direction ratios (1, 1, 0) and (0, 1, 1).
    answer: '60'
    check: '60'
    difficulty: 2
    hints:
    - 'Dot of ratios: 0 + 1 + 0.'
    - Lengths √2 and √2.
    solution: 'Step 1: cos θ = 1/2. Step 2: θ = 60°.'
    mistakes:
      '45': c12m11_angle
      '90': c12m11_angle
  - prompt: Lines have direction ratios (1, 2, 2) and (2, 2, 1). Find cos θ as a fraction.
    answer: 8/9
    check: Rational(8,9)
    difficulty: 2
    hints:
    - 'Numerator: 2 + 4 + 2.'
    - Both lengths are 3.
    solution: 'Step 1: 8/(3 × 3). Step 2: 8/9.'
    mistakes:
      8/3: c12m11_angle
      1/9: c12m11_angle
  - prompt: In (x − 1)/2 = (y + 3)/4 = (z − 5)/(−1), what is the y-coordinate of the point the line passes through?
    answer: '-3'
    check: '-3'
    difficulty: 2
    hints:
    - The form is (y − y₁)/b.
    - y + 3 = y − (−3).
    solution: 'Step 1: y₁ = −3. Step 2: the point is (1, −3, 5).'
    mistakes:
      '3': c12m11_dr
      '4': c12m11_dr
  - prompt: Lines with direction ratios (3, k, 6) and (1, 2, 2) are parallel. Find k.
    answer: '6'
    check: 3*2
    difficulty: 3
    hints:
    - Parallel lines have proportional ratios.
    - 3/1 = k/2 = 6/2.
    solution: 'Step 1: the multiplier is 3. Step 2: k = 6.'
    mistakes:
      '2': c12m11_angle
      '4': c12m11_angle
  - prompt: Do r = λ(1, 0, 0) and r = (0, 0, 1) + μ(0, 1, 0) intersect?
    options:
    - no, they are skew
    - yes, at the origin
    - yes, they are parallel
    answer: no, they are skew
    difficulty: 3
    hints:
    - The first has z = 0 always; the second z = 1 always.
    - Are the directions parallel?
    solution: 'Step 1: z-values never match, so no meeting point. Step 2: directions are not parallel, so the lines are skew.'
    mistakes:
      yes, at the origin: c12m11_dist
      yes, they are parallel: c12m11_dist
  - prompt: 'Assertion (A): Lines with direction ratios (1, −2, 3) and (2, −4, 6) are parallel.

      Reason (R): Two lines are parallel when their direction ratios are proportional.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: (2, −4, 6) = 2 × (1, −2, 3), so the ratios are proportional and by R the lines are parallel. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A drone flies in a straight line given by r = (1, 0, 2) + λ(3, 6, 2), with λ = 0 at take-off. Where is it when λ = 0.5?'
    options:
    - (2.5, 3, 3)
    - (4, 6, 4)
    - (1.5, 3, 1)
    answer: (2.5, 3, 3)
    hints:
    - Find 0.5 × (3, 6, 2) first.
    - Then add (1, 0, 2).
    solution: 0.5 × (3, 6, 2) = (1.5, 3, 1), and adding (1, 0, 2) gives (2.5, 3, 3).
    mistakes:
      (4, 6, 4): pq12m11_lambda
      (1.5, 3, 1): pq12m11_lambda
    exam: case
    difficulty: 2
  - prompt: Lines with direction ratios (2, k, −1) and (3, 2, 4) are perpendicular. Find k.
    options:
    - −1
    - '1'
    - '5'
    answer: −1
    hints:
    - Perpendicular means a₁a₂ + b₁b₂ + c₁c₂ = 0.
    - 6 + 2k − 4 = 0.
    solution: 2 × 3 + k × 2 + (−1) × 4 = 0 gives 2 + 2k = 0, so k = −1.
    mistakes:
      '1': c12m11_angle
      '5': c12m11_angle
    exam: competency
    difficulty: 2
- code: cbse12m.3d.distance
  title: Shortest distance between lines
  after:
  - cbse12m.3d.lines
  notes: |
    Shortest distance between skew lines r = a₁ + λb₁ and r = a₂ + μb₂: d = |(b₁ × b₂)·(a₂ − a₁)| / |b₁ × b₂|. Parallel lines
    r = a₁ + λb and a₂ + μb: d = |b × (a₂ − a₁)| / |b|. Lines intersect if d = 0. Distance of a point from the origin
    √(x² + y² + z²); between two points √(Δx² + Δy² + Δz²).
  explanations:
    text: The shortest distance between two lines in space is measured along a line perpendicular to both. For skew lines there's a formula using the cross and dot products; if the distance is zero, the lines meet.
    visual: Picture two rods in a room, one along the floor and one across the ceiling at an angle. The shortest gap between them is the vertical drop where they cross over.
    step_by_step: 'Step 1: Find b₁ × b₂. Step 2: Find a₂ − a₁. Step 3: Dot them and take the absolute value. Step 4: Divide by |b₁ × b₂|.'
    real_world: Engineers check minimum distances between pipes and cables running through buildings.
  picture:
    kind: compare
    columns:
    - title: Lines
      points:
      - skew
      - parallel
      - intersecting
    - title: Shortest distance
      points:
      - '|(b₁ × b₂)·(a₂ − a₁)|/|b₁ × b₂|'
      - '|b × (a₂ − a₁)|/|b|'
      - '0'
    alt: 'Shortest distance between lines: skew, parallel and intersecting.'
  activity:
    type: formula
    prompt: Line 1 is the x-axis (direction i). Line 2 runs along j through the point (x, y, z). b₁ × b₂ = k, so the shortest distance is |(a₂ − a₁)·k| = |z|.
    inputs:
    - name: x
      label: x
      min: -6
      max: 6
      step: 1
      start: 0
    - name: y
      label: y
      min: -6
      max: 6
      step: 1
      start: 0
    - name: z
      label: z
      min: -6
      max: 6
      step: 1
      start: 1
    outputs:
    - name: sd
      label: Shortest distance |z|
      expr: abs(z)
    - name: oa
      label: Distance between the chosen points
      expr: sqrt(x^2+y^2+z^2)
      places: 2
    goals:
    - prompt: Make the shortest distance 4, with the point (x, y, z) 5 from the origin.
      want:
        sd: 4
        oa: 5
      mistakes:
      - when:
          oa: 4
        say: 4 is the gap between the two chosen points. The shortest distance only counts the part along b₁ × b₂, here the z-direction.
      - when:
          sd: 4
          oa:
          - 4.1
          - 4.9
        say: 'The shortest distance is 4, but the point is not yet 5 from the origin: x² + y² must be 9.'
    - prompt: Make the two lines meet.
      want:
        sd: 0
      mistakes:
      - when:
          x: 0
          y: 0
          sd:
          - 1
          - 6
        say: 'Moving the point onto the z-axis doesn''t help: the lines still pass one above the other. Only z decides.'
    - prompt: Keep the point at x = 3, y = 3. Make the lines exactly 2 apart.
      want:
        x: 3
        y: 3
        sd: 2
      mistakes:
      - when:
          x: 3
          y: 3
          sd:
          - 3
          - 6
        say: 'Too far apart. Only z sets the gap here: the shortest distance is |z|.'
  lesson:
    - teach: Distance between points (x₁, y₁, z₁) and (x₂, y₂, z₂) is √((x₂ − x₁)² + (y₂ − y₁)² + (z₂ − z₁)²). From the origin, it is just √(x² + y² + z²).
      check:
        prompt: Distance from the origin to (2, 3, 6)?
        options:
        - '7'
        - '11'
        - '49'
        answer: '7'
        why: √(4 + 9 + 36) = 7.
      ways:
      - style: visual
        teach: Distance between (1, −2, 3) and (4, 2, 15), one coordinate at a time.
        picture:
          kind: flow
          steps:
          - 'Differences: 3, 4, 12'
          - 'Squares: 9, 16, 144'
          - 'Sum: 169'
          - Distance = √169 = 13
          alt: The coordinate differences 3, 4 and 12 square to 9, 16 and 144, which add to 169, so the distance is 13.
      - style: real_world
        teach: 'A rope stretched from a corner of a classroom floor to the opposite top corner of a 6 m by 8 m room that is 3 m high has length √(36 + 64 + 9) = √109, a bit over 10 m: the 3D distance formula.'
    - teach: 'In space, two lines can be parallel, intersecting, or skew (neither). The shortest distance between skew lines is along their common perpendicular: for r = a₁ + λb₁ and r = a₂ + μb₂, d = |(b₁ × b₂)·(a₂ − a₁)| / |b₁ × b₂|.'
      picture:
        kind: flow
        steps:
        - Find b₁ × b₂
        - Find a₂ − a₁
        - Dot them, take |…|
        - Divide by |b₁ × b₂|
        alt: Steps for the shortest distance between skew lines.
      check:
        prompt: 'If d = 0 for two non-parallel lines, they:'
        options:
        - intersect
        - are skew
        - are parallel
        answer: intersect
        why: Zero gap means they meet.
      ways:
      - style: step_by_step
        teach: 'Skew lines r = λ(i + k) and r = (i + j) + μ(j + k). Step 1: b₁ × b₂ = (i + k) × (j + k) = −i − j + k, with length √3. Step 2: a₂ − a₁ = i + j. Step 3: (b₁ × b₂)·(a₂ − a₁) = −1 − 1 + 0 = −2. Step 4: d = |−2|/√3 = 2/√3.'
      - style: real_world
        teach: 'Two flyovers cross at different heights: they never meet, and they are not parallel, so they are skew. The clearance between them, measured straight up and down where one passes over the other, is the shortest distance, along their common perpendicular.'
    - teach: For parallel lines r = a₁ + λb and r = a₂ + μb, use d = |b × (a₂ − a₁)| / |b|. (b₁ × b₂ would be 0, so the skew formula cannot be used.)
      check:
        prompt: Why can't the skew formula be used for parallel lines?
        options:
        - b₁ × b₂ = 0, so we would divide by zero
        - parallel lines always meet
        - the dot product is negative
        answer: b₁ × b₂ = 0, so we would divide by zero
        why: Parallel directions have zero cross product.
      ways:
      - style: visual
        teach: Distance between parallel lines r = i + λk and r = 7i + 8j + μk.
        picture:
          kind: flow
          steps:
          - b = k, a₂ − a₁ = 6i + 8j
          - b × (a₂ − a₁) = 6j − 8i
          - '|b × (a₂ − a₁)| = 10, |b| = 1'
          - Distance = 10
          alt: With b equal to k and a2 minus a1 equal to 6i plus 8j, the cross product is 6j minus 8i, of length 10; dividing by the length of b, which is 1, gives a distance of 10.
      - style: step_by_step
        teach: 'Why the skew formula fails for parallel lines. Step 1: Parallel lines share a direction b. Step 2: Then b₁ × b₂ = b × b = 0. Step 3: The skew formula divides by |b₁ × b₂| = 0, which is impossible. Step 4: So use |b × (a₂ − a₁)|/|b| instead.'
  items:
  - prompt: Find the distance between (1, 2, 2) and the origin.
    answer: '3'
    check: sqrt(1+4+4)
    difficulty: 1
    hints:
    - √(1 + 4 + 4).
    - √9.
    solution: "√(1² + 2² + 2²) = √9 = 3."
    mistakes: {"5": "m12_vec_mag", "9": "m12_vec_mag"}
  - prompt: Find the distance between (1, 1, 1) and (3, 3, 2).
    answer: '3'
    check: sqrt(2**2+2**2+1**2)
    difficulty: 1
    hints:
    - (2, 2, 1).
    - √9.
    solution: "√(2² + 2² + 1²) = √9 = 3."
    mistakes: {"9": "m12_vec_mag", "5": "m12_vec_mag"}
  - prompt: Lines r = λi and r = j + μk (along x-axis and parallel to z-axis through (0,1,0)). Find their shortest distance.
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - b₁ × b₂ = i × k = −j.
    - '|(−j)·j| / 1.'
    solution: "d = |(a₂ − a₁)·(b₁ × b₂)|/|b₁ × b₂|. b₁ × b₂ = i × k = −j, a₂ − a₁ = j, so d = |j·(−j)|/1 = 1."
    mistakes: {"0": "m12_skew_distance", "2": "m12_skew_distance"}
  - prompt: 'If the shortest distance between two lines is 0, they:'
    options:
    - intersect
    - are skew
    - are parallel and distinct
    - are perpendicular always
    answer: intersect
    difficulty: 1
    hints:
    - No gap.
    - Meet.
    solution: "Zero gap means the lines have a common point: they intersect."
    mistakes: {"are skew": "m12_intersect", "are parallel and distinct": "m12_intersect", "are perpendicular always": "m12_intersect"}
  - prompt: 'The shortest distance between skew lines is along their:'
    options:
    - common perpendicular
    - common direction
    - x-axis
    - first line
    answer: common perpendicular
    difficulty: 2
    hints:
    - Perpendicular to both.
    - b₁ × b₂.
    solution: "The shortest segment joining two skew lines is perpendicular to both of them: their common perpendicular."
    mistakes: {"common direction": "m12_common_perp", "x-axis": "m12_common_perp", "first line": "m12_common_perp"}
  - prompt: Parallel lines r = λi and r = j + μi. Find the distance between them.
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - Both along i.
    - Gap along j.
    solution: "d = |b × (a₂ − a₁)|/|b| = |i × j|/1 = |k| = 1."
    mistakes: {"0": "m12_parallel_distance", "2": "m12_parallel_distance"}
  - prompt: Find the distance between (2, 3, 1) and (5, 7, 1).
    answer: '5'
    check: sqrt(9 + 16)
    difficulty: 1
    hints:
    - 'Differences: 3, 4, 0.'
    - Square, add, root.
    solution: 'Step 1: √(9 + 16 + 0). Step 2: 5.'
    mistakes:
      '7': c12m11_dist
      '25': c12m11_dist
  - prompt: Find the distance from the origin to (4, 4, 2).
    answer: '6'
    check: sqrt(16 + 16 + 4)
    difficulty: 1
    hints:
    - Square each coordinate.
    - √36.
    solution: 'Step 1: 36. Step 2: 6.'
    mistakes:
      '10': c12m11_dist
      '36': c12m11_dist
  - prompt: Find the distance between (0, 0, 0) and (1, 1, 1), squared.
    answer: '3'
    check: 1 + 1 + 1
    difficulty: 1
    hints:
    - Squared distance skips the root.
    - Add the squares.
    solution: 'Step 1: 1 + 1 + 1. Step 2: 3.'
    mistakes:
      '1': c12m11_dist
      '9': c12m11_dist
  - prompt: Parallel lines r = λk and r = 2i + μk. Find the distance between them.
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Both are parallel to the z-axis.
    - One passes through the origin, the other through (2, 0, 0).
    solution: 'Step 1: b = k, a₂ − a₁ = 2i; k × 2i = 2j. Step 2: |2j|/1 = 2.'
    mistakes:
      '0': c12m11_dist
      '4': c12m11_dist
  - prompt: Lines r = λi and r = 3k + μj. Find the shortest distance.
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - b₁ × b₂ = i × j = k.
    - a₂ − a₁ = 3k.
    solution: 'Step 1: k·3k = 3. Step 2: |k| = 1, so d = 3.'
    mistakes:
      '0': c12m11_dist
      '1': c12m11_dist
  - prompt: For lines with b₁ = i + j and b₂ = i − j, find |b₁ × b₂|.
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - (i + j) × (i − j).
    - = −k − k.
    solution: 'Step 1: −2k. Step 2: 2.'
    mistakes:
      '0': c12m11_dist
      '1': c12m11_dist
  - prompt: With b₁ = i + j, b₂ = i − j, a₁ = 0 and a₂ = 4k, find the shortest distance.
    answer: '4'
    check: Abs(-2*4)/2
    difficulty: 3
    hints:
    - b₁ × b₂ = −2k.
    - (−2k)·(4k) = −8.
    solution: 'Step 1: |−8| = 8. Step 2: 8/2 = 4.'
    mistakes:
      '8': c12m11_dist
      '2': c12m11_dist
  - prompt: Parallel lines r = λi and r = (0, 3, 4) + μi. Find the distance between them.
    answer: '5'
    check: sqrt(9 + 16)
    difficulty: 3
    hints:
    - b = i, a₂ − a₁ = 3j + 4k.
    - i × (3j + 4k) = 3k − 4j.
    solution: 'Step 1: |3k − 4j| = 5. Step 2: divide by |i| = 1: 5.'
    mistakes:
      '7': c12m11_dist
      '25': c12m11_dist
  - prompt: 'The shortest distance between two lines is 0 and they are not parallel. They are:'
    options:
    - intersecting
    - skew
    - coincident and parallel
    answer: intersecting
    difficulty: 3
    hints:
    - Zero distance means a shared point.
    - Not parallel rules out coincident lines.
    solution: 'Step 1: they meet. Step 2: intersecting.'
    mistakes:
      skew: c12m11_dist
      coincident and parallel: c12m11_dist
  - prompt: 'Assertion (A): The lines r = i + λ(2i + j) and r = j + μ(4i + 2j) are parallel.

      Reason (R): Their direction vectors are proportional.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 4i + 2j = 2(2i + j), so the directions are proportional, which is why the lines are parallel. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: One cable runs along the x-axis, r = λi. A second runs straight up through (0, 2, 0), r = 2j + 3k + μk. What is the shortest gap between them?'
    options:
    - '2'
    - '3'
    - √13
    answer: '2'
    hints:
    - b₁ × b₂ = i × k = −j.
    - Dot it with a₂ − a₁ = 2j + 3k.
    solution: b₁ × b₂ = −j, with length 1. (a₂ − a₁)·(−j) = −2, so d = |−2|/1 = 2.
    mistakes:
      '3': c12m11_dist
      √13: m12_common_perp
    exam: case
    difficulty: 2
  - prompt: Which formula gives the distance between r = (1, 2, 0) + λ(2, 1, 2) and r = (0, 1, 3) + μ(4, 2, 4)?
    options:
    - '|b × (a₂ − a₁)|/|b|'
    - '|(b₁ × b₂)·(a₂ − a₁)|/|b₁ × b₂|'
    - '|a₂ − a₁|'
    answer: '|b × (a₂ − a₁)|/|b|'
    hints:
    - Compare (2, 1, 2) and (4, 2, 4).
    - If the lines are parallel, what is b₁ × b₂?
    solution: (4, 2, 4) = 2(2, 1, 2), so the lines are parallel and b₁ × b₂ = 0. The parallel-lines formula |b × (a₂ − a₁)|/|b| must be used.
    mistakes:
      '|(b₁ × b₂)·(a₂ − a₁)|/|b₁ × b₂|': pq12m11_check_parallel
      '|a₂ − a₁|': pq12m11_check_parallel
    exam: competency
    difficulty: 2
