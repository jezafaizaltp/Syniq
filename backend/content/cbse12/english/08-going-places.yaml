# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 8.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 8
title: Going Places (A.R. Barton)
tips:
  e12_gp_came: "The meeting happens only in Sophie's imagination. Did she really see him there?"
  e12_gp_canal: "Sophie sits alone on a wooden bench near water in the evening. Where in the town is it?"
  e12_gp_hero: "Sophie pins a photo on her wall and tells Geoff about meeting him. He plays for United. What sport?"
  e12_gp_work: "Jansie is practical: girls from their background go into factory work after school. Which factory is named?"
  e12x08_who: 'Match the character: Sophie (dreamer), Jansie (practical friend), Geoff (quiet older brother, mechanic), Dad (dismissive), Danny Casey (football star).'
  e12x08_theme: Ask how the story shows the gap between Sophie's dreams and her real life.

concepts:
- code: cbse12e.f8.goingplaces
  title: Going Places (A.R. Barton)
  notes: |
    Sophie, a school-leaver from a poor family, dreams of owning a boutique, becoming an actress or a fashion designer; her friend
    Jansie is practical and knows they're likely to end up at the biscuit factory. Sophie hero-worships Danny Casey, a young Irish
    football star, as does her brother Geoff, a mechanic. She tells Geoff she met Casey in the arcade and that he promised to meet
    her again; Geoff is doubtful, her father dismissive. She goes to wait by the canal, but Casey never comes; she feels sad but
    still imagines it was real. Themes: adolescent fantasy, hero worship, the gap between dreams and reality, family.
  explanations:
    text: Sophie, a working-class teenager, dreams of a glamorous life and worships the young football star Danny Casey. She tells her family she met him and that he'll see her again, but he never turns up. The story shows how teenage dreams can drift away from reality.
    visual: Picture Sophie waiting alone by the canal in the evening, hoping Danny Casey will come, as the light fades and nobody arrives.
    step_by_step: 'Step 1: Sophie''s dreams versus Jansie''s realism. Step 2: The family: Geoff and her father. Step 3: Danny Casey, the hero. Step 4: Sophie''s ''meeting'' story. Step 5: Waiting by the canal.'
    real_world: Teenagers who follow celebrities closely online may recognise Sophie's mix of hope and fantasy.
  picture:
    kind: compare
    columns:
    - title: Character
      points:
      - Sophie
      - Jansie
    - title: Attitude
      points:
      - dreamy, ambitious
      - practical, realistic
    - title: Future she sees
      points:
      - boutique, actress, designer
      - the biscuit factory
    alt: 'Sophie and Jansie compared: dreams and realism.'
  activity:
    type: sort
    prompt: 'Going Places: Sophie''s dream or what really happens?'
    bins:
    - Sophie's dreams
    - What really happens
    items:
    - label: Owning a boutique
      bin: Sophie's dreams
      clue: Does she have money for a shop?
      why: 'She has no money for it: it''s a dream, as Jansie points out.'
    - label: Work at the biscuit factory
      bin: What really happens
      clue: Jansie is the practical one.
      why: Jansie knows school-leavers like them usually end up at the factory.
    - label: Danny Casey promising to meet her
      bin: Sophie's dreams
      clue: Geoff doubts the story. Did anyone else see it?
      why: 'No one saw it, and Casey never comes: she imagined the meeting.'
    - label: Waiting alone by the canal
      bin: What really happens
      clue: This part she actually does.
      why: She really goes and waits, but no one comes. The waiting is real; the date was not.
    - label: Becoming an actress or a designer
      bin: Sophie's dreams
      clue: She keeps changing her plan.
      why: 'These wishes change from day to day: dreams, not plans.'
  lesson:
    - teach: 'In A.R. Barton''s ''Going Places'', Sophie and her friend Jansie walk home from school. Sophie dreams big: owning a boutique, becoming an actress or a fashion designer. Jansie is practical and reminds her that girls like them are earmarked for the biscuit factory, and that a boutique needs money.'
      check:
        prompt: How is Jansie different from Sophie?
        options:
        - she is practical and realistic
        - she is a dreamer too
        - she is very rich
        answer: she is practical and realistic
        why: She knows their families' limits.
      ways:
      - style: visual
        teach: Sophie and Jansie, two friends with very different outlooks.
        picture:
          kind: compare
          columns:
          - title: Sophie
            points:
            - Dreams of a boutique, acting, fashion
            - Ignores money and reality
          - title: Jansie
            points:
            - Practical and realistic
            - Knows they're headed for the biscuit factory
          alt: Sophie dreams of a boutique, acting or fashion design and ignores money and reality. Jansie is practical and realistic, knowing they are headed for the biscuit factory.
      - style: real_world
        teach: 'Every class has a dreamer who plans to be a film star or cricketer, and a friend who says ''be practical''. Both matter: dreams give energy, and realism helps plan the steps.'
    - teach: Sophie's family is poor and crowded. Her father is a heavy man who is dismissive of her stories; her mother is tired; her older brother Geoff is a quiet apprentice mechanic whose silence fascinates her. Sophie and Geoff both admire Danny Casey, a young Irish football star who plays for United. Sophie tells Geoff she met Casey in the arcade and that he wants to meet her again.
      picture:
        kind: compare
        columns:
        - title: Sophie's dreams
          points:
          - boutique
          - actress
          - meeting Danny Casey
        - title: Her reality
          points:
          - biscuit factory likely
          - poor home
          - Casey never comes
        alt: Sophie's dreams set against her real life.
      check:
        prompt: How does Sophie's father react to her story about Casey?
        options:
        - he does not believe her and mocks it
        - he is delighted
        - he goes to meet Casey
        answer: he does not believe her and mocks it
        why: He thinks it is another of her tales.
      ways:
      - style: step_by_step
        teach: 'Step 1: Note how Sophie''s father brushes off her stories. Step 2: Note Geoff''s silence, which she finds mysterious. Step 3: She tells Geoff, not her father, about meeting Danny. Step 4: She wants someone to believe her dreams.'
      - style: real_world
        teach: 'Many teenagers have a sports or film hero and imagine meeting them. Posters on the wall, collecting every news item: hero worship is a normal part of growing up, as with Sophie and Danny Casey.'
    - teach: Sophie goes to the canal by the park to wait for Danny. He never comes. She feels a hollow sadness, but still clings to the memory she imagined of him in the arcade, and worries about how she will tell Geoff. The story shows adolescent fantasy and hero worship, and the gap between dreams and reality.
      check:
        prompt: What does the ending suggest about the meeting with Casey?
        options:
        - it probably only happened in Sophie's imagination
        - Casey was ill that day
        - Geoff stopped him
        answer: it probably only happened in Sophie's imagination
        why: Her fantasy is so vivid she half-believes it.
      ways:
      - style: visual
        teach: 'Sophie''s wait by the canal: dream and reality.'
        picture:
          kind: compare
          columns:
          - title: What she imagined
            points:
            - Danny will come
            - A secret meeting
            - Proof her dream is real
          - title: What happened
            points:
            - He never comes
            - Hollow sadness
            - Worry about telling Geoff
          alt: Sophie imagined Danny would come to a secret meeting that would prove her dream real. In reality he never came; she felt a hollow sadness and worried about telling Geoff.
      - style: step_by_step
        teach: 'Step 1: Ask whether the arcade meeting really happened. Step 2: Notice that no one else saw it. Step 3: See how Danny never turns up. Step 4: The story hints the meeting was her fantasy, though she still clings to it.'
  items:
  - prompt: Who is Sophie's hero?
    options:
    - Danny Casey, a football player
    - Geoff, her brother
    - a film actor
    - her teacher
    answer: Danny Casey, a football player
    difficulty: 1
    hints:
    - Young Irish player.
    - United team.
    solution: "Sophie idolises Danny Casey, a young Irish footballer who plays for United."
    mistakes: {"Geoff, her brother": "e12_gp_hero", "a film actor": "e12_gp_hero", "her teacher": "e12_gp_hero"}
  - prompt: 'Jansie is Sophie''s:'
    options:
    - practical friend
    - sister
    - teacher
    - mother
    answer: practical friend
    difficulty: 1
    hints:
    - Realistic.
    - Biscuit factory.
    solution: "Jansie is Sophie's friend, practical and down-to-earth, who knows they will both end up at the biscuit factory."
    mistakes:
      sister: eng12_read_again
  - prompt: Where do Sophie and Jansie expect to work after school?
    options:
    - the biscuit factory
    - a boutique
    - a film studio
    - a bank
    answer: the biscuit factory
    difficulty: 2
    hints:
    - Jansie says so.
    - Realistic job.
    solution: "Their families are poor, so both girls are expected to work at the biscuit factory after school."
    mistakes: {"a boutique": "e12_gp_work", "a film studio": "e12_gp_work", "a bank": "e12_gp_work"}
  - prompt: Where does Sophie wait for Danny Casey?
    options:
    - by the canal
    - at the stadium
    - at her school
    - at the station
    answer: by the canal
    difficulty: 2
    hints:
    - Evening.
    - Alone.
    solution: "Sophie waits for Danny by the canal in the evening, a meeting that exists only in her imagination."
    mistakes: {"at the stadium": "e12_gp_canal", "at her school": "e12_gp_canal", "at the station": "e12_gp_canal"}
  - prompt: Did Danny Casey come to meet Sophie?
    options:
    - 'No'
    - 'Yes'
    - He sent a letter
    - He phoned
    answer: 'No'
    difficulty: 1
    hints:
    - She waited.
    - Nobody came.
    solution: "No. Danny never comes, which shows the meeting was only Sophie's fantasy."
    mistakes: {"Yes": "e12_gp_came", "He sent a letter": "e12_gp_came", "He phoned": "e12_gp_came"}
  - prompt: 'The story mainly explores:'
    options:
    - the gap between teenage dreams and reality
    - football tactics
    - factory work
    - travel
    answer: the gap between teenage dreams and reality
    difficulty: 2
    hints:
    - Fantasy.
    - Hero worship.
    solution: "Sophie's dreams of fame and romance clash with her family's poverty and plain future: dreams versus reality."
    mistakes:
      football tactics: eng12_theme
  - prompt: Which job does Sophie NOT dream of?
    options:
    - working in a biscuit factory
    - owning a boutique
    - being a fashion designer
    answer: working in a biscuit factory
    difficulty: 1
    hints:
    - Jansie mentions it as their likely future.
    - It is the opposite of a dream.
    solution: 'Step 1: Sophie dreams of glamour. Step 2: the factory is reality, not a dream.'
    mistakes:
      owning a boutique: e12x08_who
      being a fashion designer: e12x08_who
  - prompt: What is Geoff's job?
    options:
    - apprentice mechanic
    - football player
    - shopkeeper
    answer: apprentice mechanic
    difficulty: 1
    hints:
    - He has left school.
    - He works with machines.
    solution: 'Step 1: training under a mechanic. Step 2: apprentice mechanic.'
    mistakes:
      football player: e12x08_who
      shopkeeper: e12x08_who
  - prompt: Why is Sophie drawn to Geoff's silence?
    options:
    - she imagines he has a wonderful secret world outside home
    - she is angry with him
    - he never speaks to anyone
    answer: she imagines he has a wonderful secret world outside home
    difficulty: 2
    hints:
    - She longs for a place in his life.
    - She thinks he knows exciting people.
    solution: 'Step 1: he says little about his life. Step 2: she imagines a secret world.'
    mistakes:
      she is angry with him: e12x08_theme
      he never speaks to anyone: e12x08_theme
  - prompt: Danny Casey is from which country?
    options:
    - Ireland
    - England
    - Scotland
    answer: Ireland
    difficulty: 2
    hints:
    - He is a young football star.
    - Think of his name.
    solution: 'Step 1: young star of United. Step 2: Irish.'
    mistakes:
      England: e12x08_who
      Scotland: e12x08_who
  - prompt: Why does Sophie not want Jansie to know about Danny Casey?
    options:
    - Jansie would tell the whole neighbourhood
    - Jansie dislikes football
    - Jansie is jealous
    answer: Jansie would tell the whole neighbourhood
    difficulty: 2
    hints:
    - Sophie asks Geoff to keep it secret.
    - Jansie loves gossip.
    solution: 'Step 1: Jansie is nosy. Step 2: she would spread it.'
    mistakes:
      Jansie dislikes football: e12x08_who
      Jansie is jealous: e12x08_who
  - prompt: Where does Sophie say she met Danny Casey?
    options:
    - in the arcade
    - at the biscuit factory
    - at school
    answer: in the arcade
    difficulty: 1
    hints:
    - She tells Geoff about it at home.
    - It is a covered row of shops.
    solution: 'Step 1: her story to Geoff. Step 2: in the arcade.'
    mistakes:
      at the biscuit factory: e12x08_theme
      at school: e12x08_theme
  - prompt: How does Sophie feel when Danny does not come?
    options:
    - sad, but she still treasures the imagined meeting
    - relieved
    - angry with Geoff
    answer: sad, but she still treasures the imagined meeting
    difficulty: 2
    hints:
    - Her dreams do not die easily.
    - She thinks of how to tell Geoff.
    solution: 'Step 1: hollow disappointment. Step 2: but she keeps the fantasy.'
    mistakes:
      relieved: e12x08_theme
      angry with Geoff: e12x08_theme
  - prompt: What does the title 'Going Places' suggest?
    options:
    - dreams of success and moving up in life
    - a travel guide
    - a football tour
    answer: dreams of success and moving up in life
    difficulty: 3
    hints:
    - '''Going places'' is an idiom.'
    - Someone who is 'going places' will succeed.
    solution: 'Step 1: idiom for success. Step 2: Sophie''s hopes of a better life.'
    mistakes:
      a travel guide: e12x08_theme
      a football tour: e12x08_theme
  - prompt: 'Sophie''s dreams are mainly a reaction to:'
    options:
    - her poor, limited life at home
    - her wealth
    - her love of school
    answer: her poor, limited life at home
    difficulty: 2
    hints:
    - Look at her home and family.
    - Dreams offer an escape.
    solution: 'Step 1: cramped, poor home. Step 2: dreams as escape.'
    mistakes:
      her wealth: e12x08_theme
      her love of school: e12x08_theme
  - prompt: 'Assertion (A): Sophie tells Geoff, not her father, about meeting Danny Casey.

      Reason (R): Her father dismisses her stories, while she hopes Geoff will share her excitement.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Her father scoffs at her fantasies, so she turns to Geoff, whom she admires and who also loves Danny. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Sophie waits at the canal and Danny never arrives. How does she react?'
    options:
    - She feels sad but still holds on to her dream
    - She decides to work at the biscuit factory at once
    - She tells her father the truth and laughs
    answer: She feels sad but still holds on to her dream
    hints:
    - What feeling does she have?
    - Does she give up the memory?
    solution: She feels a hollow sadness and worries about Geoff, but still clings to the imagined meeting.
    mistakes:
      She decides to work at the biscuit factory at once: e12x08_theme
      She tells her father the truth and laughs: e12x08_who
    exam: case
    difficulty: 2
  - prompt: 'Situation: A friend dreams of becoming a famous designer but has made no plans. Which advice draws best on the story''s lesson?'
    options:
    - Keep the dream, but take real steps towards it
    - Give up dreaming altogether
    - Wait for luck to bring a famous person to help
    answer: Keep the dream, but take real steps towards it
    hints:
    - What was missing from Sophie's dreams?
    - Was dreaming itself the problem?
    solution: The story shows the gap between dreams and reality; dreams need planning and effort to come true.
    mistakes:
      Give up dreaming altogether: e12x08_theme
      Wait for luck to bring a famous person to help: e12x08_theme
    exam: competency
    difficulty: 2
