subject: cbse12-eng
chapter: 8
title: Going Places (A.R. Barton)
concepts:
- code: cbse12e.f8.goingplaces
  title: Going Places (A.R. Barton)
  notes: |
    Sophie, a school-leaver from a poor family, dreams of owning a boutique, becoming an actress or a fashion designer; her friend
    Jansie is practical and knows they're likely to end up at the biscuit factory. Sophie hero-worships Danny Casey, a young Irish
    football star, as does her brother Geoff, a mechanic. She tells Geoff she met Casey in the arcade and that he promised to meet
    her again; Geoff is doubtful, her father dismissive. She goes to wait by the canal, but Casey never comes; she feels sad but
    still imagines it was real. Themes: adolescent fantasy, hero worship, the gap between dreams and reality, family.
  explanations:
    text: Sophie, a working-class teenager, dreams of a glamorous life and worships the young football star Danny Casey. She tells her family she met him and that he'll see her again, but he never turns up. The story shows how teenage dreams can drift away from reality.
    visual: Picture Sophie waiting alone by the canal in the evening, hoping Danny Casey will come, as the light fades and nobody arrives.
    step_by_step: 'Step 1: Sophie''s dreams versus Jansie''s realism. Step 2: The family: Geoff and her father. Step 3: Danny Casey, the hero. Step 4: Sophie''s ''meeting'' story. Step 5: Waiting by the canal.'
    real_world: Teenagers who follow celebrities closely online may recognise Sophie's mix of hope and fantasy.
