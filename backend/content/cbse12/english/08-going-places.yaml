# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 8.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 8
title: Going Places (A.R. Barton)
tips:
  e12_gp_came: "The meeting happens only in Sophie's imagination. Did she really see him there?"
  e12_gp_canal: "Sophie sits alone on a wooden bench near water in the evening. Where in the town is it?"
  e12_gp_hero: "Sophie pins a photo on her wall and tells Geoff about meeting him. He plays for United. What sport?"
  e12_gp_work: "Jansie is practical: girls from their background go into factory work after school. Which factory is named?"
  e12x08_who: 'Match the character: Sophie (dreamer), Jansie (practical friend), Geoff (quiet older brother, mechanic), Dad (dismissive), Danny Casey (football star).'
  e12x08_theme: Ask how the story shows the gap between Sophie's dreams and her real life.

concepts:
- code: cbse12e.f8.goingplaces
  title: Going Places (A.R. Barton)
  notes: |
    Sophie, a school-leaver from a poor family, dreams of owning a boutique, becoming an actress or a fashion designer; her friend
    Jansie is practical and knows they're likely to end up at the biscuit factory. Sophie hero-worships Danny Casey, a young Irish
    football star, as does her brother Geoff, a mechanic. She tells Geoff she met Casey in the arcade and that he promised to meet
    her again; Geoff is doubtful, her father dismissive. She goes to wait by the canal, but Casey never comes; she feels sad but
    still imagines it was real. Themes: adolescent fantasy, hero worship, the gap between dreams and reality, family.
  explanations:
    text: Sophie, a working-class teenager, dreams of a glamorous life and worships the young football star Danny Casey. She tells her family she met him and that he'll see her again, but he never turns up. The story shows how teenage dreams can drift away from reality.
    visual: Picture Sophie waiting alone by the canal in the evening, hoping Danny Casey will come, as the light fades and nobody arrives.
    step_by_step: 'Step 1: Sophie''s dreams versus Jansie''s realism. Step 2: The family: Geoff and her father. Step 3: Danny Casey, the hero. Step 4: Sophie''s ''meeting'' story. Step 5: Waiting by the canal.'
    real_world: Teenagers who follow celebrities closely online may recognise Sophie's mix of hope and fantasy.
  picture:
    kind: compare
    columns:
    - title: Character
      points:
      - Sophie
      - Jansie
    - title: Attitude
      points:
      - dreamy, ambitious
      - practical, realistic
    - title: Future she sees
      points:
      - boutique, actress, designer
      - the biscuit factory
    alt: 'Sophie and Jansie compared: dreams and realism.'
  activity:
    type: sort
    prompt: 'Going Places: Sophie''s dream or what really happens?'
    bins:
    - Sophie's dreams
    - What really happens
    items:
    - label: Owning a boutique
      bin: Sophie's dreams
      clue: Does she have money for a shop?
      why: 'She has no money for it: it''s a dream, as Jansie points out.'
    - label: Work at the biscuit factory
      bin: What really happens
      clue: Jansie is the practical one.
      why: Jansie knows school-leavers like them usually end up at the factory.
    - label: Danny Casey promising to meet her
      bin: Sophie's dreams
      clue: Geoff doubts the story. Did anyone else see it?
      why: 'No one saw it, and Casey never comes: she imagined the meeting.'
    - label: Waiting alone by the canal
      bin: What really happens
      clue: This part she actually does.
      why: She really goes and waits, but no one comes. The waiting is real; the date was not.
    - label: Becoming an actress or a designer
      bin: Sophie's dreams
      clue: She keeps changing her plan.
      why: 'These wishes change from day to day: dreams, not plans.'
  lesson:
    - teach: 'In A.R. Barton''s ''Going Places'', Sophie and her friend Jansie walk home from school. Sophie dreams big: owning a boutique, becoming an actress or a fashion designer. Jansie is practical and reminds her that girls like them are earmarked for the biscuit factory, and that a boutique needs money.'
      check:
        prompt: How is Jansie different from Sophie?
        options:
        - she is practical and realistic
        - she is a dreamer too
        - she is very rich
        answer: she is practical and realistic
        why: She knows their families' limits.
    - teach: Sophie's family is poor and crowded. Her father is a heavy man who is dismissive of her stories; her mother is tired; her older brother Geoff is a quiet apprentice mechanic whose silence fascinates her. Sophie and Geoff both admire Danny Casey, a young Irish football star who plays for United. Sophie tells Geoff she met Casey in the arcade and that he wants to meet her again.
      picture:
        kind: compare
        columns:
        - title: Sophie's dreams
          points:
          - boutique
          - actress
          - meeting Danny Casey
        - title: Her reality
          points:
          - biscuit factory likely
          - poor home
          - Casey never comes
        alt: Sophie's dreams set against her real life.
      check:
        prompt: How does Sophie's father react to her story about Casey?
        options:
        - he does not believe her and mocks it
        - he is delighted
        - he goes to meet Casey
        answer: he does not believe her and mocks it
        why: He thinks it is another of her tales.
    - teach: Sophie goes to the canal by the park to wait for Danny. He never comes. She feels a hollow sadness, but still clings to the memory she imagined of him in the arcade, and worries about how she will tell Geoff. The story shows adolescent fantasy and hero worship, and the gap between dreams and reality.
      check:
        prompt: What does the ending suggest about the meeting with Casey?
        options:
        - it probably only happened in Sophie's imagination
        - Casey was ill that day
        - Geoff stopped him
        answer: it probably only happened in Sophie's imagination
        why: Her fantasy is so vivid she half-believes it.
  items:
