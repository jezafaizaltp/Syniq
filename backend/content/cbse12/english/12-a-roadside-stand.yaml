# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 12.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 12
title: A Roadside Stand (Robert Frost)
tips:
  e12_rs_cars: "The poor family wants city money, but the cars are in a hurry. Do they stop or not?"
  e12_rs_gooddoers: "Frost is bitter that the 'kind' planners want to take the families away. Where would they put them?"
  e12_rs_poet: "The poet is American and wrote about New England farms, like 'Stopping by Woods'. Who?"
  e12_rs_sell: "The stand is at a farm, so they sell things they grow or pick. Which option is farm produce?"
  e12x12_who: 'Separate the groups: the poor farm family at the stand, the city people in passing cars, and the ''good-doers'' with their plans.'
  e12x12_feel: 'Ask what the poet feels: sympathy for the family''s unanswered hope, anger at city indifference.'

concepts:
- code: cbse12e.f12.roadside
  title: A Roadside Stand (Robert Frost)
  notes: |
    A poor farm family has built a little shed by the road, hoping city people in "polished traffic" will stop and buy wild berries
    and golden squash, so they can have some city money. Most cars rush past, or stop only to ask the way, use the yard to turn, or
    complain that the landscape is spoiled by the unpainted sign. The poet hears that "good-doers" plan to move these people into
    villages near theatres and stores, where they'll be cared for and lose the ability to think for themselves. He feels the pain of
    their unanswered longing and, in despair, wonders whether it would be kinder to put them out of their pain at one stroke—then
    asks how he would feel if someone offered the same to him. Themes: rural poverty, the rich-poor divide, insensitivity of urban
    people and governments.
  explanations:
    text: Robert Frost describes a poor family's roadside stand, where they wait hopefully for city drivers to buy their produce. Most cars speed by, and the few who stop are rude. The poet feels deeply for these neglected rural people and criticises both careless city folk and so-called helpers who exploit them.
    visual: Picture a small, unpainted shed by a country road with berries and squash on display, and shiny cars rushing past without a glance while the family waits by the window.
    step_by_step: 'Step 1: The stand and the family''s hope. Step 2: The traffic that ignores them. Step 3: The ''good-doers'' and their plans. Step 4: The poet''s pain and outburst. Step 5: The theme of rural neglect.'
    real_world: Farmers selling fruit by highways in India often wait all day as cars rush by, just like the family in Frost's poem.
  picture:
    kind: compare
    columns:
    - title: Rural family
      points:
      - hopeful
      - sells berries and squash
      - wants city money
    - title: City travellers
      points:
      - in a hurry
      - rarely stop
      - complain about the sign
    alt: The rural family and the city travellers in A Roadside Stand.
  activity:
    type: sort
    prompt: 'A Roadside Stand: what do the city people do?'
    bins:
    - Drive past
    - Stop, but don't buy
    - Complain
    items:
    - label: Rush by in polished traffic
      bin: Drive past
      clue: Their eyes stay on the road ahead.
      why: 'They don''t even look: they drive past.'
    - label: Ask the way somewhere else
      bin: Stop, but don't buy
      clue: They stop, but why?
      why: They stop only for directions, not for berries.
    - label: Use the yard to turn the car
      bin: Stop, but don't buy
      clue: Their car needs space.
      why: They use the family's yard and buy nothing.
    - label: Say the sign spoils the landscape
      bin: Complain
      clue: An unpainted sign.
      why: 'They complain the poor family''s sign is ugly: insensitivity.'
    - label: Never look aside at the stand
      bin: Drive past
      clue: Not even a glance.
      why: Not looking at all is driving past.
  lesson:
    - teach: In Robert Frost's poem, a poor farm family has put up a little new shed in front of an old house by the road. They hope city people in passing cars will stop and buy wild berries in wooden quarts and crookedly painted golden squash, so they can earn some city money and feel the life of cities and movies.
      check:
        prompt: What does the family hope to gain from the stand?
        options:
        - some city money to improve their lives
        - fame
        - a new car
        answer: some city money to improve their lives
        why: They want a share of the prosperity they see passing by.
      ways:
      - style: visual
        teach: What the farm family hopes for from the roadside stand.
        picture:
          kind: compare
          columns:
          - title: What they sell
            points:
            - Wild berries in wooden quarts
            - Golden squash, crookedly painted sign
          - title: What they hope for
            points:
            - Some city money
            - A share in city life and movies
          alt: The family sells wild berries in wooden quarts and golden squash under a crookedly painted sign. They hope for some city money and a share in the life of cities and movies.
      - style: real_world
        teach: On highways in India, families sell fruit, tender coconuts or handicrafts at small stalls. Most cars speed past. Each car that doesn't stop is a small disappointment, just like at Frost's roadside stand.
    - teach: But the 'polished traffic' rushes past with mind ahead. If a car stops, it is to ask the way, to turn around in the yard, or to complain that the crude, unpainted sign spoils the landscape. The poet notes how city people ignore the family's hope.
      picture:
        kind: compare
        columns:
        - title: Family hopes
          points:
          - cars will stop
          - berries and squash sold
          - city money
        - title: What cars do
          points:
          - rush past
          - ask the way
          - turn in the yard
          - complain about the sign
        alt: What the roadside family hopes for and what city drivers actually do.
      check:
        prompt: Why are the city people annoyed by the stand?
        options:
        - the unpainted sign spoils the view
        - the prices are too high
        - the stand blocks the road
        answer: the unpainted sign spoils the view
        why: They care about scenery more than the people.
      ways:
      - style: step_by_step
        teach: 'Step 1: List why cars stop: to ask the way, to turn around, to complain. Step 2: Note that none stop to buy. Step 3: Notice the word ''polished'' for the traffic. Step 4: The city people are wealthy but careless of the poor family''s hope.'
      - style: real_world
        teach: 'When we grumble that a hand-painted village sign ''spoils the view'', we''re doing what Frost''s city drivers do: judging the poor by our own comfort instead of their need.'
    - teach: The poet hears that 'good-doers' plan to buy up the land and move these people into villages near theatres and stores, where they will be cared for and no longer think for themselves. He cannot bear the open window sadly waiting for a car to stop. In despair he wonders if it would be kinder to end their pain at one stroke, then asks how he would feel if someone offered to do the same to him.
      check:
        prompt: What does the poet's final question show?
        options:
        - he realises such 'relief' would be cruel and wrong
        - he wants to hurt them
        - he will buy all the berries
        answer: he realises such 'relief' would be cruel and wrong
        why: Putting himself in their place, he sees the idea is unacceptable.
      ways:
      - style: visual
        teach: The 'good-doers' and the poet's view of their plan.
        picture:
          kind: compare
          columns:
          - title: The plan
            points:
            - Buy up the farmers' land
            - Move them near theatres and stores
            - Care for them
          - title: The poet's doubt
            points:
            - They'll stop thinking for themselves
            - Help that takes away dignity
            - Profit for the 'helpers'
          alt: 'The good-doers plan to buy up the farmers'' land, move them near theatres and stores and take care of them. The poet doubts it: they would stop thinking for themselves, the help takes away dignity, and it profits the helpers.'
      - style: step_by_step
        teach: 'Step 1: Note the poet''s despair at the window waiting in vain. Step 2: He wonders if ending their pain at one stroke would be kinder. Step 3: He then imagines someone offering that to him. Step 4: The turn shows sympathy, not cruelty: he rejects his own dark thought.'
  items:
  - prompt: What does the family sell at the stand?
    options:
    - wild berries and golden squash
    - clothes
    - newspapers
    - toys
    answer: wild berries and golden squash
    difficulty: 1
    hints:
    - Farm produce.
    - Fruit and vegetables.
    solution: Wild berries and golden squash.
    mistakes: {"clothes": "e12_rs_sell", "newspapers": "e12_rs_sell", "toys": "e12_rs_sell"}
  - prompt: '''Polished traffic'' refers to:'
    options:
    - city people's shiny cars
    - clean roads
    - traffic police
    - farm carts
    answer: city people's shiny cars
    difficulty: 2
    hints:
    - Wealthy travellers.
    - Shiny.
    solution: The shiny cars of city people.
    mistakes:
      clean roads: eng12_poem_meaning
  - prompt: What do most passing cars do?
    options:
    - rush past without stopping
    - buy everything
    - stop to help
    - give gifts
    answer: rush past without stopping
    difficulty: 1
    hints:
    - Ignore the stand.
    - Hurry.
    solution: "City people drive past without stopping or buying, which hurts the poor rural sellers."
    mistakes: {"buy everything": "e12_rs_cars", "stop to help": "e12_rs_cars", "give gifts": "e12_rs_cars"}
  - prompt: What do the 'good-doers' plan to do?
    options:
    - move the families into villages near theatres and stores
    - build them a school
    - buy their farms at a good price
    - nothing
    answer: move the families into villages near theatres and stores
    difficulty: 2
    hints:
    - Make them dependent.
    - Greedy good-doers.
    solution: Move them near theatres and stores, making them dependent.
    mistakes: {"build them a school": "e12_rs_gooddoers", "buy their farms at a good price": "e12_rs_gooddoers", "nothing": "e12_rs_gooddoers"}
  - prompt: Who wrote 'A Roadside Stand'?
    options:
    - Robert Frost
    - John Keats
    - Pablo Neruda
    - Adrienne Rich
    answer: Robert Frost
    difficulty: 1
    hints:
    - American poet.
    - Stopping by Woods.
    solution: "'A Roadside Stand' is a poem by the American poet Robert Frost."
    mistakes: {"John Keats": "e12_rs_poet", "Pablo Neruda": "e12_rs_poet", "Adrienne Rich": "e12_rs_poet"}
  - prompt: 'The poem mainly highlights:'
    options:
    - neglect of the rural poor
    - the beauty of cars
    - the joy of shopping
    - city festivals
    answer: neglect of the rural poor
    difficulty: 2
    hints:
    - Rich-poor divide.
    - Insensitivity.
    solution: The neglect of the rural poor.
    mistakes:
      the beauty of cars: eng12_theme
  - prompt: What is wrong with the way the squash is described on the sign?
    options:
    - it is crookedly painted
    - it is written in French
    - it is invisible
    answer: it is crookedly painted
    difficulty: 1
    hints:
    - The family is not skilled at signs.
    - City people dislike it.
    solution: 'Step 1: rough, home-made sign. Step 2: crooked painting.'
    mistakes:
      it is written in French: e12x12_who
      it is invisible: e12x12_who
  - prompt: In what containers are the wild berries sold?
    options:
    - wooden quarts
    - plastic bags
    - glass jars
    answer: wooden quarts
    difficulty: 2
    hints:
    - Simple country packaging.
    - A quart is a unit of volume.
    solution: 'Step 1: rustic measure. Step 2: wooden quarts.'
    mistakes:
      plastic bags: e12x12_who
      glass jars: e12x12_who
  - prompt: Why does the poet say the cars have their 'mind ahead'?
    options:
    - drivers think only of where they are going
    - the cars are driverless
    - the drivers are clever
    answer: drivers think only of where they are going
    difficulty: 2
    hints:
    - They do not notice the roadside.
    - They are in a hurry.
    solution: 'Step 1: focused on destination. Step 2: ignore the stand.'
    mistakes:
      the cars are driverless: e12x12_who
      the drivers are clever: e12x12_who
  - prompt: What does the family's longing for 'the life of cities' show?
    options:
    - they want the comforts they see others enjoy
    - they hate the country
    - they are rich
    answer: they want the comforts they see others enjoy
    difficulty: 2
    hints:
    - They see cars and movies only from afar.
    - It is a natural human wish.
    solution: 'Step 1: city life seems better. Step 2: they want a share.'
    mistakes:
      they hate the country: e12x12_feel
      they are rich: e12x12_feel
  - prompt: What does the poet say the 'good-doers' would make the family do?
    options:
    - sleep at night and no longer think for themselves
    - work harder
    - start a business
    answer: sleep at night and no longer think for themselves
    difficulty: 3
    hints:
    - Their 'help' takes away independence.
    - The poet sees it as harmful.
    solution: 'Step 1: cared for like dependants. Step 2: their minds dulled.'
    mistakes:
      work harder: e12x12_who
      start a business: e12x12_who
  - prompt: Who are the 'greedy good-doers' and 'beneficent beasts of prey'?
    options:
    - people who pretend to help but exploit the poor
    - wild animals
    - the farm family
    answer: people who pretend to help but exploit the poor
    difficulty: 2
    hints:
    - The poet is being ironic.
    - They seem kind but act for gain.
    solution: 'Step 1: seem helpful. Step 2: actually prey on the poor.'
    mistakes:
      wild animals: e12x12_who
      the farm family: e12x12_who
  - prompt: What does the 'open window' waiting for a car show?
    options:
    - the family's patient, unfulfilled hope
    - a robbery
    - good weather
    answer: the family's patient, unfulfilled hope
    difficulty: 2
    hints:
    - Someone keeps looking out.
    - The car rarely stops.
    solution: 'Step 1: waiting for buyers. Step 2: hope not met.'
    mistakes:
      a robbery: e12x12_feel
      good weather: e12x12_feel
  - prompt: 'The poet''s tone towards the city people is:'
    options:
    - critical of their indifference
    - admiring
    - neutral and cold
    answer: critical of their indifference
    difficulty: 1
    hints:
    - They complain about a sign.
    - They do not care for the family.
    solution: 'Step 1: they ignore the poor. Step 2: the poet criticises them.'
    mistakes:
      admiring: e12x12_feel
      neutral and cold: e12x12_feel
  - prompt: What does the family NOT want, according to the poet?
    options:
    - charity or pity; they want fair trade
    - money
    - customers
    answer: charity or pity; they want fair trade
    difficulty: 2
    hints:
    - They are selling, not begging.
    - Dignity matters.
    solution: 'Step 1: they offer goods. Step 2: they want a fair chance, not pity.'
    mistakes:
      money: e12x12_feel
      customers: e12x12_feel
  - prompt: 'Assertion (A): The poet is critical of the ''good-doers'' who plan to resettle the farmers.

      Reason (R): Their plan would make the farmers dependent and take away their ability to think for themselves.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Frost suggests such 'help' benefits the planners and strips the poor of independence. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A car stops at the stand, but only so the driver can turn around in the yard. What does this suggest about city people in the poem?'
    options:
    - They are indifferent to the family's hopes
    - They want to buy everything
    - They are lost and frightened
    answer: They are indifferent to the family's hopes
    hints:
    - Did the driver buy anything?
    - How does the family feel when a car stops?
    solution: Stopping only for their own convenience shows the city people don't care about the family waiting to sell.
    mistakes:
      They want to buy everything: e12x12_who
      They are lost and frightened: e12x12_who
    exam: case
    difficulty: 2
  - prompt: 'Situation: A town wants to help poor roadside sellers. Which approach would Frost''s poem favour?'
    options:
    - Buy from them and respect their independence
    - Move them away from the road for their own good
    - Ban roadside stands as untidy
    answer: Buy from them and respect their independence
    hints:
    - What did the family want?
    - Why did the poet dislike the good-doers?
    solution: The family wanted trade and a share of prosperity, not charity that removes their choice.
    mistakes:
      Move them away from the road for their own good: e12x12_feel
      Ban roadside stands as untidy: e12x12_feel
    exam: competency
    difficulty: 2
