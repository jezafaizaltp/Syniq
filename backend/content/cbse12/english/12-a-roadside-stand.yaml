# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 12.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 12
title: A Roadside Stand (Robert Frost)
concepts:
- code: cbse12e.f12.roadside
  title: A Roadside Stand (Robert Frost)
  notes: |
    A poor farm family has built a little shed by the road, hoping city people in "polished traffic" will stop and buy wild berries
    and golden squash, so they can have some city money. Most cars rush past, or stop only to ask the way, use the yard to turn, or
    complain that the landscape is spoiled by the unpainted sign. The poet hears that "good-doers" plan to move these people into
    villages near theatres and stores, where they'll be cared for and lose the ability to think for themselves. He feels the pain of
    their unanswered longing and, in despair, wonders whether it would be kinder to put them out of their pain at one stroke—then
    asks how he would feel if someone offered the same to him. Themes: rural poverty, the rich-poor divide, insensitivity of urban
    people and governments.
  explanations:
    text: Robert Frost describes a poor family's roadside stand, where they wait hopefully for city drivers to buy their produce. Most cars speed by, and the few who stop are rude. The poet feels deeply for these neglected rural people and criticises both careless city folk and so-called helpers who exploit them.
    visual: Picture a small, unpainted shed by a country road with berries and squash on display, and shiny cars rushing past without a glance while the family waits by the window.
    step_by_step: 'Step 1: The stand and the family''s hope. Step 2: The traffic that ignores them. Step 3: The ''good-doers'' and their plans. Step 4: The poet''s pain and outburst. Step 5: The theme of rural neglect.'
    real_world: Farmers selling fruit by highways in India often wait all day as cars rush by, just like the family in Frost's poem.
  picture:
    kind: compare
    columns:
    - title: Rural family
      points:
      - hopeful
      - sells berries and squash
      - wants city money
    - title: City travellers
      points:
      - in a hurry
      - rarely stop
      - complain about the sign
    alt: The rural family and the city travellers in A Roadside Stand.
  activity:
    type: sort
    prompt: 'A Roadside Stand: what do the city people do?'
    bins:
    - Drive past
    - Stop, but don't buy
    - Complain
    items:
    - label: Rush by in polished traffic
      bin: Drive past
      clue: Their eyes stay on the road ahead.
      why: 'They don''t even look: they drive past.'
    - label: Ask the way somewhere else
      bin: Stop, but don't buy
      clue: They stop, but why?
      why: They stop only for directions, not for berries.
    - label: Use the yard to turn the car
      bin: Stop, but don't buy
      clue: Their car needs space.
      why: They use the family's yard and buy nothing.
    - label: Say the sign spoils the landscape
      bin: Complain
      clue: An unpainted sign.
      why: 'They complain the poor family''s sign is ugly: insensitivity.'
    - label: Never look aside at the stand
      bin: Drive past
      clue: Not even a glance.
      why: Not looking at all is driving past.
  items:
  - prompt: What does the family sell at the stand?
    options:
    - wild berries and golden squash
    - clothes
    - newspapers
    - toys
    answer: wild berries and golden squash
    difficulty: 1
    hints:
    - Farm produce.
    - Fruit and vegetables.
    solution: Wild berries and golden squash.
  - prompt: '''Polished traffic'' refers to:'
    options:
    - city people's shiny cars
    - clean roads
    - traffic police
    - farm carts
    answer: city people's shiny cars
    difficulty: 2
    hints:
    - Wealthy travellers.
    - Shiny.
    solution: The shiny cars of city people.
    mistakes:
      clean roads: eng12_poem_meaning
  - prompt: What do most passing cars do?
    options:
    - rush past without stopping
    - buy everything
    - stop to help
    - give gifts
    answer: rush past without stopping
    difficulty: 1
    hints:
    - Ignore the stand.
    - Hurry.
    solution: Rush past without stopping.
  - prompt: What do the 'good-doers' plan to do?
    options:
    - move the families into villages near theatres and stores
    - build them a school
    - buy their farms at a good price
    - nothing
    answer: move the families into villages near theatres and stores
    difficulty: 2
    hints:
    - Make them dependent.
    - Greedy good-doers.
    solution: Move them near theatres and stores, making them dependent.
  - prompt: Who wrote 'A Roadside Stand'?
    options:
    - Robert Frost
    - John Keats
    - Pablo Neruda
    - Adrienne Rich
    answer: Robert Frost
    difficulty: 1
    hints:
    - American poet.
    - Stopping by Woods.
    solution: Robert Frost.
  - prompt: 'The poem mainly highlights:'
    options:
    - neglect of the rural poor
    - the beauty of cars
    - the joy of shopping
    - city festivals
    answer: neglect of the rural poor
    difficulty: 2
    hints:
    - Rich-poor divide.
    - Insensitivity.
    solution: The neglect of the rural poor.
    mistakes:
      the beauty of cars: eng12_theme
