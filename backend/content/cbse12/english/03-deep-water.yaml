concepts:
- code: cbse12e.f3.deepwater
  title: Deep Water (William Douglas)
  notes: |
    William O. Douglas recalls his fear of water. At three or four, a wave knocked him down at a California beach. At about ten or
    eleven he began swimming at the YMCA pool in Yakima, using water wings. A big boy of about eighteen picked him up and threw him
    into the deep end; he sank, tried to spring up from the bottom three times, swallowed water, panicked and lost consciousness,
    then woke up being helped. The fear stayed for years, spoiling canoeing and fishing. He hired an instructor who taught him bit by
    bit (a rope and pulley around him, exhaling under water, kicking). He tested himself in Lake Wentworth in New Hampshire and Warm
    Lake, and finally conquered his fear. He quotes Roosevelt: "All we have to fear is fear itself." Themes: fear, determination,
    courage.
  explanations:
    text: As a boy, William Douglas was thrown into the deep end of a pool and nearly drowned. His terror of water lasted for years, until he hired an instructor and, step by step, learnt to swim. By facing his fear, he finally conquered it.
    visual: Picture a small boy on the bottom of a deep pool, looking up at the light through yellowish water, trying to spring upward. Years later, the same man swims confidently across a lake.
    step_by_step: 'Step 1: Early fear at the beach. Step 2: The YMCA pool incident. Step 3: Years of lasting fear. Step 4: Training with the instructor. Step 5: Testing himself in lakes and conquering fear.'
    real_world: Many people have fears, like of exams or speaking on stage; Douglas's method of tackling them in small steps works for those too.
