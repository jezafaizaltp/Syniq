# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 3.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 3
title: Deep Water (William Douglas)
tips:
  e12_dw_boy: "Douglas was waiting alone at the YMCA pool when someone much older and bigger picked him up. Was it family, staff, or a stranger?"
  e12_dw_overcome: "Douglas did not just wish the fear away. Think about the slow, piece-by-piece method he used with someone teaching him."
  e12_dw_quote: "The quote is 'All we have to fear is fear itself', spoken by a US President in the 1930s. Which one?"
  e12x03_stage: 'Place the event in Douglas''s life: the beach as a small child, the YMCA pool at about ten or eleven, the lessons with the instructor, or the lake tests.'
  e12x03_theme: 'Ask what the essay says about fear: it can be faced and beaten step by step.'

concepts:
- code: cbse12e.f3.deepwater
  title: Deep Water (William Douglas)
  notes: |
    William O. Douglas recalls his fear of water. At three or four, a wave knocked him down at a California beach. At about ten or
    eleven he began swimming at the YMCA pool in Yakima, using water wings. A big boy of about eighteen picked him up and threw him
    into the deep end; he sank, tried again and again to spring up from the bottom, swallowed water, panicked and lost consciousness,
    then woke up being helped. The fear stayed for years, spoiling canoeing and fishing. He hired an instructor who taught him bit by
    bit (a rope and pulley around him, exhaling under water, kicking). He tested himself in Lake Wentworth in New Hampshire and Warm
    Lake, and finally conquered his fear. He quotes Roosevelt: "All we have to fear is fear itself." Themes: fear, determination,
    courage.
  explanations:
    text: As a boy, William Douglas was thrown into the deep end of a pool and nearly drowned. His terror of water lasted for years, until he hired an instructor and, step by step, learnt to swim. By facing his fear, he finally conquered it.
    visual: Picture a small boy on the bottom of a deep pool, looking up at the light through yellowish water, trying to spring upward. Years later, the same man swims confidently across a lake.
    step_by_step: 'Step 1: Early fear at the beach. Step 2: The YMCA pool incident. Step 3: Years of lasting fear. Step 4: Training with the instructor. Step 5: Testing himself in lakes and conquering fear.'
    real_world: Many people have fears, like of exams or speaking on stage; Douglas's method of tackling them in small steps works for those too.
  picture:
    kind: flow
    steps:
    - Knocked down by a wave as a child
    - Thrown into the deep end at the YMCA
    - Fear lasts for years
    - Instructor trains him step by step
    - Swims in Lake Wentworth, fear conquered
    alt: 'Deep Water: how Douglas''s fear of water began and how he overcame it.'
  activity:
    type: order
    prompt: 'Deep Water: put Douglas''s story in order.'
    steps:
    - A wave knocks him down at a beach
    - He learns at the YMCA pool with water wings
    - A big boy throws him into the deep end
    - He fears water for years
    - An instructor trains him bit by bit
    - He swims Lake Wentworth and Warm Lake
    reasons:
      He learns at the YMCA pool with water wings: Years later, he starts swimming.
      A big boy throws him into the deep end: At the pool.
      He fears water for years: The near-drowning stays with him.
      An instructor trains him bit by bit: He decides to beat the fear.
      He swims Lake Wentworth and Warm Lake: He tests himself.
  lesson:
    - teach: In 'Deep Water', from William O. Douglas's book 'Of Men and Mountains', he tells how a fear of water held him back. At three or four, a wave at a California beach knocked him down and buried him. Years later, at about ten or eleven, he started to learn swimming at the YMCA pool in Yakima, using water wings, because the deep end frightened him.
      check:
        prompt: Why did Douglas choose the YMCA pool to learn swimming?
        options:
        - it was safe, only 2 to 3 feet deep at the shallow end
        - it had the best coach
        - it was free for children
        answer: it was safe, only 2 to 3 feet deep at the shallow end
        why: The Yakima River was considered dangerous.
    - teach: One day a big boy of about eighteen picked him up and tossed him into the deep end (nine feet). He planned to jump up from the bottom, but rising slowly he panicked, swallowed water and sank three times. As he went down again, his terror ended; he felt peaceful and lost consciousness. He woke up being helped beside the pool.
      picture:
        kind: flow
        steps:
        - thrown in the deep end
        - sinks to the bottom
        - springs up, panics
        - sinks again
        - loses consciousness
        alt: What happened to Douglas after he was thrown into the pool.
      check:
        prompt: What was Douglas's plan when he sank to the bottom?
        options:
        - spring up from the bottom to the surface
        - swim to the side underwater
        - shout for help
        answer: spring up from the bottom to the surface
        why: He planned a big jump that would bring him up.
    - teach: 'The fear stayed for years and spoiled canoeing, fishing and swimming. He hired an instructor who taught him piece by piece over months: with a rope and pulley around him, he learnt to put his face in, exhale under water, kick his legs. Then he swam alone in Lake Wentworth in New Hampshire, and in Warm Lake, and finally knew he had conquered the fear. He quotes Roosevelt: all we have to fear is fear itself.'
      check:
        prompt: How did the instructor build Douglas into a swimmer?
        options:
        - piece by piece, one skill at a time
        - by throwing him in again
        - by talking only about fear
        answer: piece by piece, one skill at a time
        why: Small steps let him master each part before the next.
  items:
  - prompt: Where did the near-drowning happen?
    options:
    - the YMCA pool
    - a river
    - the sea
    - a lake in Canada
    answer: the YMCA pool
    difficulty: 1
    hints:
    - In Yakima.
    - Swimming pool.
    solution: The YMCA pool.
    mistakes:
      the sea: eng12_read_again
  - prompt: Who threw Douglas into the pool?
    options:
    - a big boy of about eighteen
    - his father
    - the instructor
    - his friend
    answer: a big boy of about eighteen
    difficulty: 1
    hints:
    - A bully.
    - Teenager.
    solution: A big boy of about eighteen.
    mistakes: {"his father": "e12_dw_boy", "the instructor": "e12_dw_boy", "his friend": "e12_dw_boy"}
  - prompt: How did Douglas's fear of water first begin, before the YMCA pool?
    options:
    - a wave knocked him down at a California beach
    - he fell into a well
    - his boat overturned on a lake
    - a friend pushed him into a river
    answer: a wave knocked him down at a California beach
    difficulty: 2
    hints:
    - He was only three or four.
    - He was on holiday with his father.
    solution: At three or four, a wave knocked him down at a beach in California and he was frightened.
    mistakes:
      his boat overturned on a lake: eng12_read_again
  - prompt: How did Douglas finally overcome his fear?
    options:
    - by hiring an instructor and training step by step
    - by avoiding water forever
    - by taking medicine
    - by moving to a desert
    answer: by hiring an instructor and training step by step
    difficulty: 1
    hints:
    - Rope and pulley.
    - Practice.
    solution: Training step by step with an instructor.
    mistakes: {"by avoiding water forever": "e12_dw_overcome", "by taking medicine": "e12_dw_overcome", "by moving to a desert": "e12_dw_overcome"}
  - prompt: Whose words does Douglas quote about fear?
    options:
    - Franklin Roosevelt
    - Abraham Lincoln
    - Gandhi
    - Shakespeare
    answer: Franklin Roosevelt
    difficulty: 2
    hints:
    - US President.
    - '''All we have to fear is fear itself.'''
    solution: Franklin D. Roosevelt.
    mistakes: {"Abraham Lincoln": "e12_dw_quote", "Gandhi": "e12_dw_quote", "Shakespeare": "e12_dw_quote"}
  - prompt: 'The main message of the essay is that:'
    options:
    - fear can be overcome with determination
    - swimming is dangerous
    - bullies always win
    - water should be avoided
    answer: fear can be overcome with determination
    difficulty: 2
    hints:
    - He succeeded.
    - Courage.
    solution: Fear can be conquered with will and effort.
    mistakes:
      swimming is dangerous: eng12_theme
  - prompt: What did Douglas use when he first went into the YMCA pool?
    options:
    - water wings
    - a life jacket
    - a rope
    answer: water wings
    difficulty: 1
    hints:
    - They help a beginner float.
    - Worn on the arms.
    solution: 'Step 1: he was a beginner. Step 2: water wings.'
    mistakes:
      a life jacket: e12x03_stage
      a rope: e12x03_stage
  - prompt: How deep was the deep end of the YMCA pool?
    options:
    - nine feet
    - three feet
    - twenty feet
    answer: nine feet
    difficulty: 1
    hints:
    - Much deeper than his height.
    - A single-digit number of feet.
    solution: 'Step 1: he was thrown in the deep end. Step 2: nine feet.'
    mistakes:
      three feet: e12x03_stage
      twenty feet: e12x03_stage
  - prompt: During the lessons, what held Douglas as he swam back and forth across the pool?
    options:
    - a belt with a rope through a pulley
    - water wings
    - the big boy
    answer: a belt with a rope through a pulley
    difficulty: 2
    hints:
    - The instructor kept control from above.
    - It ran along an overhead cable.
    solution: 'Step 1: the instructor held the rope. Step 2: belt, rope and pulley.'
    mistakes:
      water wings: e12x03_stage
      the big boy: e12x03_stage
  - prompt: What did Douglas feel just before he lost consciousness?
    options:
    - a calm, peaceful feeling
    - anger at the boy
    - great pain
    answer: a calm, peaceful feeling
    difficulty: 2
    hints:
    - The terror ended.
    - He was no longer struggling.
    solution: 'Step 1: no more panic. Step 2: a peaceful, drowsy feeling.'
    mistakes:
      anger at the boy: e12x03_stage
      great pain: e12x03_stage
  - prompt: Which activities did the fear of water spoil for Douglas?
    options:
    - canoeing, fishing and swimming
    - reading and writing
    - running and climbing
    answer: canoeing, fishing and swimming
    difficulty: 1
    hints:
    - All happen on or in water.
    - He loved the Cascades' lakes.
    solution: 'Step 1: water-based joys. Step 2: canoeing, fishing, swimming.'
    mistakes:
      reading and writing: e12x03_theme
      running and climbing: e12x03_theme
  - prompt: In which lake in New Hampshire did Douglas test himself?
    options:
    - Lake Wentworth
    - Lake Victoria
    - Warm River
    answer: Lake Wentworth
    difficulty: 2
    hints:
    - He swam two miles across it.
    - Named after a person.
    solution: 'Step 1: after the lessons. Step 2: Lake Wentworth.'
    mistakes:
      Lake Victoria: e12x03_stage
      Warm River: e12x03_stage
  - prompt: Why did Douglas take lessons even after he could swim a little?
    options:
    - he wanted to be sure the terror was gone
    - he wanted to win races
    - his parents forced him
    answer: he wanted to be sure the terror was gone
    difficulty: 2
    hints:
    - Some fear stayed after the first lessons.
    - He tested himself again and again.
    solution: 'Step 1: residual terror remained. Step 2: he wanted it fully gone.'
    mistakes:
      he wanted to win races: e12x03_theme
      his parents forced him: e12x03_theme
  - prompt: Who later became Douglas's guide and teacher in the essay?
    options:
    - a hired swimming instructor
    - the big boy
    - his mother
    answer: a hired swimming instructor
    difficulty: 1
    hints:
    - He decided to get help.
    - He paid for it.
    solution: 'Step 1: he chose to learn properly. Step 2: an instructor.'
    mistakes:
      the big boy: e12x03_stage
      his mother: e12x03_stage
  - prompt: What does Douglas say he learnt about death and fear?
    options:
    - the fear of death is worse than death itself
    - death is never peaceful
    - fear can never be beaten
    answer: the fear of death is worse than death itself
    difficulty: 3
    hints:
    - Recall how calm he felt when sinking.
    - It connects to Roosevelt's words.
    solution: 'Step 1: dying felt peaceful. Step 2: the terror was the worse part.'
    mistakes:
      death is never peaceful: e12x03_theme
      fear can never be beaten: e12x03_theme
