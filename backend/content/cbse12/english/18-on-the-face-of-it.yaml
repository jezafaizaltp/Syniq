      why: Derry's face was burnt, so he hides from people.
    - label: A tin leg from the war
      bin: Mr Lamb
      clue: The old man.
      why: Mr Lamb lost a leg in the war.
    - label: Leaves his gate open to everyone
      bin: Mr Lamb
      clue: Welcoming.
      why: Mr Lamb welcomes all; he is not afraid of people.
    - label: Expects people to be repelled
      bin: Derry
      clue: Bitter and withdrawn.
      why: Derry thinks everyone is disgusted by him.
    - label: Called 'Lamey-Lamb' by children
      bin: Mr Lamb
      clue: A nickname about a leg.
      why: Children tease him for his leg, yet he stays cheerful.
    - label: Decides to go back to the garden
      bin: Derry
      clue: Against his mother's wish.
      why: 'Derry chooses to return: Mr Lamb has changed him.'
