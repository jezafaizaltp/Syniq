# CBSE Class 12 English (NCERT Vistas, supplementary reader, rationalised syllabus), chapter 18.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 18
title: On the Face of It (Susan Hill)
tips:
  e12_fa_derry: "Derry is a teenager, not yet grown up. Recall his age from the play."
  e12_fa_end: "Derry returns to find Mr Lamb hurt while picking fruit up high. What happened?"
  e12_fa_fruit: "Mr Lamb picks small sour fruit to make jelly. Which fruit fits an English garden?"
  e12_fa_lamb: "Mr Lamb lost a limb in the war, and children call him a name for it. Which body part is not real?"
  e12x18_who: 'Match the speaker or idea: Derry (bitter, hurt, withdrawn) or Mr Lamb (warm, open, cheerful despite his tin leg).'
  e12x18_theme: 'Ask what the play says about appearances: what matters is how you see the world and yourself, not how you look.'

concepts:
- code: cbse12e.v5.face
  title: On the Face of It (Susan Hill)
  notes: |
    A one-act play. Derry, a fourteen-year-old boy with one side of his face burnt by acid, is bitter, withdrawn and expects people
    to be repelled by him. He climbs into the garden of Mr Lamb, an old man with a tin leg (lost in the war), who welcomes everyone,
    leaves his gate open, gathers crab apples to make jelly, and listens to bees and the sounds of growing things. Mr Lamb teaches
    Derry to look at the world positively and not to care what others think; he says some people are called names (Lamey-Lamb).
    Derry's mother doesn't want him to visit, but he decides to go back. When he returns, Mr Lamb has fallen from a ladder and lies
    still (implying death); Derry weeps. Themes: disability, loneliness, attitude, friendship.
  explanations:
    text: Derry, a teenager with a face scarred by acid, hides from the world because people stare at him. He meets Mr Lamb, an old man with a tin leg who is cheerful and welcoming. Mr Lamb teaches him to look beyond appearances and enjoy life. When Derry comes back, he finds Mr Lamb has fallen from a ladder.
    visual: Picture an overgrown garden full of crab apple trees and humming bees, where an old man with a tin leg chats warmly with a scarred boy who has slipped in over the wall.
    step_by_step: 'Step 1: Derry''s bitterness about his face. Step 2: Meeting Mr Lamb in the garden. Step 3: Mr Lamb''s positive outlook. Step 4: Derry''s mother''s objection and his choice. Step 5: Mr Lamb''s fall.'
    real_world: People with visible differences often face stares and unkindness; the play asks us to look past faces to the person.
  picture:
    kind: compare
    columns:
    - title: Character
      points:
      - Derry
      - Mr Lamb
    - title: Disability
      points:
      - face burnt by acid
      - tin leg
    - title: Attitude
      points:
      - bitter, withdrawn
      - cheerful, welcoming
    alt: Derry and Mr Lamb compared.
  activity:
    type: sort
    prompt: 'On the Face of It: Derry or Mr Lamb?'
    bins:
    - Derry
    - Mr Lamb
    items:
    - label: One side of his face burnt by acid
      bin: Derry
      clue: The fourteen-year-old.
      why: Derry's face was burnt, so he hides from people.
    - label: A tin leg from the war
      bin: Mr Lamb
      clue: The old man.
      why: Mr Lamb lost a leg in the war.
    - label: Leaves his gate open to everyone
      bin: Mr Lamb
      clue: Welcoming.
      why: Mr Lamb welcomes all; he is not afraid of people.
    - label: Expects people to be repelled
      bin: Derry
      clue: Bitter and withdrawn.
      why: Derry thinks everyone is disgusted by him.
    - label: Called 'Lamey-Lamb' by children
      bin: Mr Lamb
      clue: A nickname about a leg.
      why: Children tease him for his leg, yet he stays cheerful.
    - label: Decides to go back to the garden
      bin: Derry
      clue: Against his mother's wish.
      why: 'Derry chooses to return: Mr Lamb has changed him.'
  lesson:
    - teach: Susan Hill's one-act play 'On the Face of It' has two characters. Derry, a fourteen-year-old boy, has one side of his face burnt by acid. He is bitter and lonely, and expects people to be scared of him or pity him. He climbs into the garden of Mr Lamb, an old man with a tin leg, thinking it is empty.
      check:
        prompt: Why does Derry avoid people?
        options:
        - he thinks they are frightened or disgusted by his face
        - he is very busy
        - he is shy of animals
        answer: he thinks they are frightened or disgusted by his face
        why: His scar has made him feel rejected.
      ways:
      - style: visual
        teach: Derry and Mr Lamb, both marked, but facing life very differently.
        picture:
          kind: compare
          columns:
          - title: Derry
            points:
            - Face burnt by acid
            - Bitter, withdrawn
            - Expects fear or pity
          - title: Mr Lamb
            points:
            - Lost a leg in the war
            - Warm, open gate
            - Ignores cruel names
          alt: Derry's face was burnt by acid; he is bitter, withdrawn and expects fear or pity. Mr Lamb lost a leg in the war; he is warm, keeps his gate open and ignores cruel names.
      - style: real_world
        teach: People with visible differences, scars or disabilities often say the hardest part isn't the condition but others' staring and pity. Derry's anger comes from that daily hurt.
    - teach: Mr Lamb welcomes him. His gate is always open; he gathers crab apples to make jelly and listens to bees and to things growing. He lost his leg in the war, and children call him 'Lamey-Lamb', but he does not let it make him bitter. He tells Derry that what matters is what's inside, and that he should not care what other people say.
      picture:
        kind: compare
        columns:
        - title: Derry
          points:
          - young
          - burnt face
          - bitter, withdrawn
          - shuts people out
        - title: Mr Lamb
          points:
          - old
          - tin leg
          - cheerful, curious
          - gate always open
        alt: Derry and Mr Lamb compared.
      check:
        prompt: What does Mr Lamb's open gate show?
        options:
        - he welcomes everyone
        - he forgot to lock it
        - he wants to sell his garden
        answer: he welcomes everyone
        why: He chooses openness over loneliness.
      ways:
      - style: step_by_step
        teach: 'Step 1: Mr Lamb''s gate is always open: he welcomes everyone. Step 2: He listens to bees and growing things. Step 3: He refuses to let ''Lamey-Lamb'' make him bitter. Step 4: He shows Derry another way to live.'
      - style: real_world
        teach: A good mentor doesn't lecture; they show by example. Mr Lamb never tells Derry to cheer up. He just lives fully despite his loss, and Derry begins to notice.
    - teach: Derry's mother does not want him to visit the old man, but Derry insists on going back, for the first time wanting to be somewhere. When he returns, he finds Mr Lamb has fallen from the ladder while picking crab apples and lies still. Derry weeps. Even so, Mr Lamb has changed how Derry sees the world.
      check:
        prompt: How has Derry changed by the end?
        options:
        - he has learnt to want to be with others and face the world
        - he hates everyone more
        - he has forgotten Mr Lamb
        answer: he has learnt to want to be with others and face the world
        why: Mr Lamb's friendship gave him hope.
      ways:
      - style: visual
        teach: How Derry changes from the start to the end of the play.
        picture:
          kind: compare
          columns:
          - title: At the start
            points:
            - Hides from people
            - Nowhere he wants to be
          - title: At the end
            points:
            - Defies his mother to go back
            - Wants to be somewhere
            - Grieves for Mr Lamb
          alt: At the start Derry hides from people and has nowhere he wants to be. At the end he defies his mother to go back, wants to be somewhere for the first time, and grieves for Mr Lamb.
      - style: step_by_step
        teach: 'Step 1: Derry''s mother doesn''t want him to go. Step 2: He insists, the first time he wants to be anywhere. Step 3: He finds Mr Lamb has fallen. Step 4: He weeps, but the change in him stays.'
  items:
  - prompt: How old is Derry?
    answer: '14'
    check: '14'
    difficulty: 1
    hints:
    - A teenager.
    - Fourteen.
    solution: "Derry is fourteen, and acid burnt one side of his face."
    mistakes: {"16": "e12_fa_derry", "12": "e12_fa_derry", "18": "e12_fa_derry", "10": "e12_fa_derry"}
  - prompt: What happened to Derry's face?
    options:
    - it was burnt by acid
    - it was hurt in a fall
    - it was bitten by a dog
    - it was injured in a war
    answer: it was burnt by acid
    difficulty: 1
    hints:
    - One side.
    - Acid.
    solution: It was burnt by acid.
    mistakes:
      it was injured in a war: eng12_read_again
  - prompt: 'Mr Lamb has a:'
    options:
    - tin leg
    - glass eye
    - burnt face
    - broken arm
    answer: tin leg
    difficulty: 1
    hints:
    - Lost in the war.
    - Children call him Lamey-Lamb.
    solution: "Mr Lamb lost a leg in the war and has a tin leg."
    mistakes: {"glass eye": "e12_fa_lamb", "burnt face": "e12_fa_lamb", "broken arm": "e12_fa_lamb"}
  - prompt: What fruit does Mr Lamb gather in the garden?
    options:
    - crab apples
    - mangoes
    - oranges
    - grapes
    answer: crab apples
    difficulty: 2
    hints:
    - For jelly.
    - Small apples.
    solution: "Mr Lamb gathers crab apples in his garden to make jelly."
    mistakes: {"mangoes": "e12_fa_fruit", "oranges": "e12_fa_fruit", "grapes": "e12_fa_fruit"}
  - prompt: What happens to Mr Lamb at the end?
    options:
    - he falls from a ladder
    - he moves away
    - he gets married
    - he becomes rich
    answer: he falls from a ladder
    difficulty: 2
    hints:
    - Derry returns.
    - Lies still.
    solution: He falls from a ladder.
    mistakes: {"he moves away": "e12_fa_end", "he gets married": "e12_fa_end", "he becomes rich": "e12_fa_end"}
  - prompt: What does Mr Lamb teach Derry?
    options:
    - "to look beyond appearances and enjoy life"
    - "to hide from people who stare at him"
    - "to fight the bullies who call him names"
    - "to build ladders and pick apples"
    answer: to look beyond appearances and enjoy life
    difficulty: 2
    hints:
    - Positive outlook.
    - Don't mind what others think.
    solution: To look past appearances and live fully.
    mistakes:
      "to hide from people who stare at him": eng12_theme
  - prompt: What does Mr Lamb make with his crab apples?
    options:
    - jelly
    - juice to sell
    - pies for the market
    answer: jelly
    difficulty: 1
    hints:
    - Something to spread on bread.
    - Cooked with sugar.
    solution: 'Step 1: he gathers crab apples. Step 2: makes jelly.'
    mistakes:
      juice to sell: e12x18_who
      pies for the market: e12x18_who
  - prompt: How did Mr Lamb lose his leg?
    options:
    - in the war
    - in a car accident
    - from a fall
    answer: in the war
    difficulty: 1
    hints:
    - It happened long ago.
    - He is a former soldier.
    solution: 'Step 1: old wound. Step 2: lost in the war.'
    mistakes:
      in a car accident: e12x18_who
      from a fall: e12x18_who
  - prompt: What do children call Mr Lamb?
    options:
    - Lamey-Lamb
    - Old Tin
    - Grandpa Jelly
    answer: Lamey-Lamb
    difficulty: 2
    hints:
    - It mocks how he walks.
    - It plays on his surname.
    solution: 'Step 1: limp from tin leg. Step 2: Lamey-Lamb.'
    mistakes:
      Old Tin: e12x18_who
      Grandpa Jelly: e12x18_who
  - prompt: 'Mr Lamb says the bees in his garden are:'
    options:
    - worth listening to
    - dangerous
    - a nuisance
    answer: worth listening to
    difficulty: 2
    hints:
    - He enjoys small things in nature.
    - He sits and listens.
    solution: 'Step 1: he finds wonder in nature. Step 2: listening to bees.'
    mistakes:
      dangerous: e12x18_theme
      a nuisance: e12x18_theme
  - prompt: Why does Derry's mother not want him to visit Mr Lamb?
    options:
    - "she has heard gossip about the old man"
    - "Mr Lamb is her old enemy from school"
    - "she wants Derry to stay home and study"
    answer: she has heard gossip about the old man
    difficulty: 2
    hints:
    - She is protective.
    - People say things about him.
    solution: 'Step 1: she fears for her son. Step 2: she trusts rumours.'
    mistakes:
      "Mr Lamb is her old enemy from school": e12x18_who
      "she wants Derry to stay home and study": e12x18_who
  - prompt: What does Derry say people do when they see his face?
    options:
    - "stare, or look away, or pity him"
    - "ask him for his autograph"
    - "ignore him completely, every time"
    answer: stare, or look away, or pity him
    difficulty: 1
    hints:
    - He feels judged.
    - He hates being pitied.
    solution: 'Step 1: reactions he has faced. Step 2: staring and pity.'
    mistakes:
      "ask him for his autograph": e12x18_who
      "ignore him completely, every time": e12x18_who
  - prompt: Why does Derry promise to come back?
    options:
    - "he feels understood and wants to help Mr Lamb"
    - "he wants more apples from Mr Lamb's garden"
    - "his mother tells him he must go back"
    answer: he feels understood and wants to help Mr Lamb
    difficulty: 2
    hints:
    - For once someone treated him normally.
    - He offers to help pick crab apples.
    solution: 'Step 1: friendship formed. Step 2: he wants to return.'
    mistakes:
      "he wants more apples from Mr Lamb's garden": e12x18_theme
      "his mother tells him he must go back": e12x18_theme
  - prompt: 'The title ''On the Face of It'' suggests:'
    options:
    - "things are not as they first appear"
    - "a story about make-up and faces"
    - "a story about a mirror on the wall"
    answer: things are not as they first appear
    difficulty: 3
    hints:
    - It is an idiom.
    - It also points to Derry's face.
    solution: 'Step 1: idiom for ''on the surface''. Step 2: look beyond appearances.'
    mistakes:
      "a story about make-up and faces": e12x18_theme
      "a story about a mirror on the wall": e12x18_theme
  - prompt: How does Mr Lamb treat Derry from the start?
    options:
    - as a normal boy, without pity
    - with fear
    - with anger for trespassing
    answer: as a normal boy, without pity
    difficulty: 1
    hints:
    - Derry expected to be scolded.
    - Mr Lamb talks to him freely.
    solution: 'Step 1: no fear or pity. Step 2: he treats him normally.'
    mistakes:
      with fear: e12x18_who
      with anger for trespassing: e12x18_who
  - prompt: 'Assertion (A): Derry decides to go back to Mr Lamb''s garden against his mother''s wishes.

      Reason (R): Mr Lamb had helped him see that he could live fully despite his scarred face.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: For the first time someone valued him beyond his face, so Derry wants to return. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Mr Lamb says children call him ''Lamey-Lamb'' but it does not trouble him. What is the play suggesting?'
    options:
    - "We can choose not to let others' words define us"
    - "Mr Lamb did not hear them, as he is deaf"
    - "Name-calling is harmless fun among children"
    answer: We can choose not to let others' words define us
    hints:
    - How does Mr Lamb respond to cruelty?
    - What does he want Derry to learn?
    solution: Mr Lamb shows that one's attitude, not others' taunts, decides how one lives.
    mistakes:
      "Mr Lamb did not hear them, as he is deaf": e12x18_who
      "Name-calling is harmless fun among children": e12x18_theme
    exam: case
    difficulty: 2
  - prompt: 'Situation: A new student with a visible scar keeps to themselves. Which response best follows the play''s message?'
    options:
    - Treat them warmly as a person, not as their scar
    - Ask them repeatedly about the scar
    - Leave them alone so they are not bothered
    answer: Treat them warmly as a person, not as their scar
    hints:
    - What did Mr Lamb do for Derry?
    - What did Derry hate about others?
    solution: Like Mr Lamb, seeing the person rather than the injury helps someone feel accepted.
    mistakes:
      Ask them repeatedly about the scar: e12x18_theme
      Leave them alone so they are not bothered: e12x18_theme
    exam: competency
    difficulty: 2
