subject: cbse12-eng
chapter: 18
title: On the Face of It (Susan Hill)
concepts:
- code: cbse12e.v5.face
  title: On the Face of It (Susan Hill)
  notes: |
    A one-act play. Derry, a fourteen-year-old boy with one side of his face burnt by acid, is bitter, withdrawn and expects people
    to be repelled by him. He climbs into the garden of Mr Lamb, an old man with a tin leg (lost in the war), who welcomes everyone,
    leaves his gate open, gathers crab apples to make jelly, and listens to bees and the sounds of growing things. Mr Lamb teaches
    Derry to look at the world positively and not to care what others think; he says some people are called names (Lamey-Lamb).
    Derry's mother doesn't want him to visit, but he decides to go back. When he returns, Mr Lamb has fallen from a ladder and lies
    still (implying death); Derry weeps. Themes: disability, loneliness, attitude, friendship.
  explanations:
    text: Derry, a teenager with a face scarred by acid, hides from the world because people stare at him. He meets Mr Lamb, an old man with a tin leg who is cheerful and welcoming. Mr Lamb teaches him to look beyond appearances and enjoy life. When Derry comes back, he finds Mr Lamb has fallen from a ladder.
    visual: Picture an overgrown garden full of crab apple trees and humming bees, where an old man with a tin leg chats warmly with a scarred boy who has slipped in over the wall.
    step_by_step: 'Step 1: Derry''s bitterness about his face. Step 2: Meeting Mr Lamb in the garden. Step 3: Mr Lamb''s positive outlook. Step 4: Derry''s mother''s objection and his choice. Step 5: Mr Lamb''s fall.'
    real_world: People with visible differences often face stares and unkindness; the play asks us to look past faces to the person.
