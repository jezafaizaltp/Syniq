# CBSE Class 12 English (NCERT Vistas, supplementary reader, rationalised syllabus), chapter 16.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 16
title: Journey to the End of the Earth (Tishani Doshi)
concepts:
- code: cbse12e.v3.journey
  title: Journey to the End of the Earth (Tishani Doshi)
  notes: |
    Tishani Doshi travels to Antarctica aboard the Russian research vessel Akademik Shokalskiy with the Students on Ice programme
    (led by Geoff Green), which takes high school students to the ends of the earth to inspire them to protect the planet. Starting
    from Madras, the journey covers over 100 hours by car, aeroplane and ship, crossing nine time zones, six checkpoints, three
    bodies of water and three ecospheres. She describes Antarctica as part of Gondwana, the supercontinent that existed about 650
    million years ago, and the place to understand Earth's past and future. She discusses climate change, the ozone layer,
    melting ice, and phytoplankton (tiny grasses of the sea that feed the food chain). She walks on sea ice with crabeater seals
    around. Theme: environmental awareness; small changes can have big effects.
  explanations:
    text: Tishani Doshi joins the Students on Ice programme on a voyage to Antarctica. There, among glaciers and seals, she learns how Antarctica holds clues to Earth's past and future, and how climate change, the ozone hole and threats to tiny phytoplankton could affect the whole planet.
    visual: Picture a Russian ship pushing through icy seas, students in bright jackets standing on a vast white sheet of sea ice, with seals basking nearby.
    step_by_step: 'Step 1: The journey from Madras to Antarctica. Step 2: Antarctica and Gondwana. Step 3: The Students on Ice programme. Step 4: Climate change and the ozone layer. Step 5: Phytoplankton and the food chain.'
    real_world: Melting Antarctic ice could raise sea levels and threaten coastal places like Kerala and Mumbai.
  picture:
    kind: flow
    steps:
    - Leaves Madras
    - Over 100 hours of travel
    - Reaches Antarctica on Akademik Shokalskiy
    - Learns about Gondwana and climate
    - Sees why phytoplankton matter
    alt: 'Journey to the End of the Earth: the voyage and what the author learns.'
  activity:
    type: sort
    prompt: 'Journey to the End of the Earth: which idea is it?'
    bins:
    - Earth's past
    - Climate change
    - The trip itself
    items:
    - label: Gondwana, 650 million years ago
      bin: Earth's past
      clue: A supercontinent.
      why: 'Gondwana is about how the continents once were: the Earth''s past.'
    - label: Melting polar ice
      bin: Climate change
      clue: Warming makes it shrink.
      why: Melting ice is a sign of warming, a climate change worry.
    - label: Akademik Shokalskiy
      bin: The trip itself
      clue: A Russian research ship.
      why: 'This is the vessel she sailed on: part of the trip.'
    - label: A thinning ozone layer
      bin: Climate change
      clue: Protection from the sun's rays.
      why: Damage to the ozone layer is one of the warnings she gives.
    - label: Nine time zones, six checkpoints
      bin: The trip itself
      clue: Counting the distance.
      why: These numbers describe how far she travelled.
    - label: Phytoplankton feeding the food chain
      bin: Climate change
      clue: Tiny grasses of the sea.
      why: Small changes to phytoplankton can upset the whole food chain.
  items:
