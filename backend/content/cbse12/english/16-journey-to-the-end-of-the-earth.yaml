subject: cbse12-eng
chapter: 16
title: Journey to the End of the Earth (Tishani Doshi)
tips:
  e12_jo_gondwana: "Gondwana was a supercontinent hundreds of millions of years ago. Recall the figure in the chapter."
  e12_jo_plankton: "Tiny sea plants make food from sunlight. What do the other sea animals depend on them for?"
  e12_jo_programme: "The programme's name tells you who goes (young learners) and where they go (the frozen continent). Which option says both?"
  e12_jo_where: "Tishani Doshi went to the coldest place on Earth, around the South Pole. Which continent?"
