concepts:
- code: cbse12e.v3.journey
  title: Journey to the End of the Earth (Tishani Doshi)
  notes: |
    Tishani Doshi travels to Antarctica aboard the Russian research vessel Akademik Shokalskiy with the Students on Ice programme
    (led by Geoff Green), which takes high school students to the ends of the earth to inspire them to protect the planet. Starting
    from Madras, the journey covers over 100 hours by car, aeroplane and ship, crossing nine time zones, six checkpoints, three
    bodies of water and three ecospheres. She describes Antarctica as part of Gondwana, the supercontinent that existed about 650
    million years ago, and the place to understand Earth's past and future. She discusses climate change, the ozone layer,
    melting ice, and phytoplankton (tiny grasses of the sea that feed the food chain). She walks on sea ice with crabeater seals
    around. Theme: environmental awareness; small changes can have big effects.
  explanations:
    text: Tishani Doshi joins the Students on Ice programme on a voyage to Antarctica. There, among glaciers and seals, she learns how Antarctica holds clues to Earth's past and future, and how climate change, the ozone hole and threats to tiny phytoplankton could affect the whole planet.
    visual: Picture a Russian ship pushing through icy seas, students in bright jackets standing on a vast white sheet of sea ice, with seals basking nearby.
    step_by_step: 'Step 1: The journey from Madras to Antarctica. Step 2: Antarctica and Gondwana. Step 3: The Students on Ice programme. Step 4: Climate change and the ozone layer. Step 5: Phytoplankton and the food chain.'
    real_world: Melting Antarctic ice could raise sea levels and threaten coastal places like Kerala and Mumbai.
  picture:
    kind: flow
    steps:
    - Leaves Madras
    - Over 100 hours of travel
    - Reaches Antarctica on Akademik Shokalskiy
    - Learns about Gondwana and climate
    - Sees why phytoplankton matter
    alt: 'Journey to the End of the Earth: the voyage and what the author learns.'
  activity:
    type: sort
    prompt: 'Journey to the End of the Earth: which idea is it?'
    bins:
    - Earth's past
    - Climate change
    - The trip itself
    items:
    - label: Gondwana, 650 million years ago
      bin: Earth's past
      clue: A supercontinent.
      why: 'Gondwana is about how the continents once were: the Earth''s past.'
    - label: Melting polar ice
      bin: Climate change
      clue: Warming makes it shrink.
      why: Melting ice is a sign of warming, a climate change worry.
    - label: Akademik Shokalskiy
      bin: The trip itself
      clue: A Russian research ship.
      why: 'This is the vessel she sailed on: part of the trip.'
    - label: A thinning ozone layer
      bin: Climate change
      clue: Protection from the sun's rays.
      why: Damage to the ozone layer is one of the warnings she gives.
    - label: Nine time zones, six checkpoints
      bin: The trip itself
      clue: Counting the distance.
      why: These numbers describe how far she travelled.
    - label: Phytoplankton feeding the food chain
      bin: Climate change
      clue: Tiny grasses of the sea.
      why: Small changes to phytoplankton can upset the whole food chain.
  lesson:
    - teach: Tishani Doshi travelled to Antarctica on a Russian research ship, the Akademik Shokalskiy, with 'Students on Ice', a programme led by Geoff Green that takes high school students to the ends of the earth. From Madras, her journey took over 100 hours by car, aeroplane and ship, crossing nine time zones, six checkpoints, three bodies of water and three ecospheres.
      check:
        prompt: Why does 'Students on Ice' take high school students to Antarctica?
        options:
        - to inspire them to understand and protect the planet
        - to win a race
        - to find oil
        answer: to inspire them to understand and protect the planet
        why: Young people will make the policy decisions of the future.
      ways:
      - style: visual
        teach: The scale of the journey from Madras to Antarctica.
        picture:
          kind: compare
          columns:
          - title: Travel
            points:
            - Car, aeroplane, ship
            - Over 100 hours
          - title: Crossings
            points:
            - Nine time zones
            - Six checkpoints
            - Three bodies of water, three ecospheres
          alt: The journey used car, aeroplane and ship over more than 100 hours, crossing nine time zones, six checkpoints, three bodies of water and three ecospheres.
      - style: real_world
        teach: School science expeditions, like trips to the Himalayas or coral reefs, let students see climate change with their own eyes. 'Students on Ice' takes this idea to Antarctica, hoping young people will act.
    - teach: About 650 million years ago, Antarctica was part of Gondwana, a giant supercontinent centred roughly around present-day Antarctica. The climate was warmer and life flourished. Gondwana later split into the southern continents, including India. Antarctica's ice holds records of Earth's past, so it is the place to understand where we came from and where we may be going.
      picture:
        kind: flow
        steps:
        - Gondwana (650 million years ago)
        - warm climate, rich life
        - supercontinent breaks up
        - Antarctica covered in ice
        - ice holds Earth's history
        alt: From Gondwana to today's icy Antarctica.
      check:
        prompt: Why is Antarctica useful for studying Earth's history?
        options:
        - its layers of ice hold records of the past
        - it has the most people
        - it has the tallest mountains
        answer: its layers of ice hold records of the past
        why: Trapped air and layers show past climates.
      ways:
      - style: step_by_step
        teach: 'Step 1: Picture Gondwana, a giant warm landmass. Step 2: India and Antarctica were once joined in it. Step 3: It broke into the southern continents. Step 4: So studying Antarctica''s rocks and ice tells us about India''s past too.'
      - style: real_world
        teach: Ice cores drilled from Antarctica hold tiny air bubbles trapped thousands of years ago. Scientists read them like pages of a diary, learning what the air and climate were like long before humans.
    - teach: 'The author warns about global warming: melting ice sheets, the ozone hole, and rising seas. Phytoplankton, single-celled plants of the sea, use the sun''s energy to make food and feed the whole Southern Ocean food chain; a small loss of them could affect everything. Walking on sea ice with crabeater seals nearby, she feels the earth''s fragility. The lesson: small changes can have big effects.'
      check:
        prompt: Why does the author describe phytoplankton as so important?
        options:
        - they feed the whole Southern Ocean food chain
        - they are tasty
        - they make ice
        answer: they feed the whole Southern Ocean food chain
        why: Changes in them affect every animal above.
      ways:
      - style: visual
        teach: How a small loss of phytoplankton can affect everything.
        picture:
          kind: flow
          steps:
          - Phytoplankton use sunlight to make food
          - Krill and small animals eat them
          - Fish, penguins, seals, whales follow
          - A small drop at the base shakes the whole chain
          alt: Phytoplankton use sunlight to make food. Krill and small animals eat them, followed by fish, penguins, seals and whales. A small drop at the base shakes the whole food chain.
      - style: step_by_step
        teach: 'Step 1: Note the ozone hole lets in more UV. Step 2: UV can harm phytoplankton. Step 3: Fewer phytoplankton means less food for the ocean. Step 4: So a small change causes big effects, the chapter''s key lesson.'
