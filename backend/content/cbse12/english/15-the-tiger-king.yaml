# CBSE Class 12 English (NCERT Vistas, supplementary reader, rationalised syllabus), chapter 15.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 15
title: The Tiger King (Kalki)
tips:
  e12_tk_death: "The irony is that a toy, not a live tiger, killed him. How could a toy hurt someone?"
  e12_tk_killed: "The last tiger was really shot by someone else. So the king's own count was one short of the target."
  e12_tk_rings: "He tried to please the officer's wife with expensive jewels. What did he send, many at a time?"
  e12_tk_which: "The astrologer said the king could kill many tigers, but the last one, a round number, would kill him."
  e12x15_text: 'Place the event: the prophecy at birth, the tiger hunts and the British officer, the marriage, the 100th tiger, or the toy tiger.'
  e12x15_irony: 'Look for the irony: the king tries to defeat fate, but fate wins in the most unexpected, almost silly way.'

concepts:
- code: cbse12e.v2.tigerking
  title: The Tiger King (Kalki)
  notes: |
    A satire by Kalki (R. Krishnamurthy). The Maharaja of Pratibandapuram, Sir Jilani Jung Jung Bahadur ('the Tiger King'), was
    told by astrologers at birth that he would die because of a tiger, specifically the hundredth. At ten days old he spoke! To
    defy fate he began killing tigers, banned tiger hunting by others, risked his throne by refusing a British officer a hunt (then
    appeased him with expensive diamond rings for his wife), and married a princess from a state with many tigers. After killing 99
    tigers, he couldn't find the hundredth; the dewan secretly released an old tiger from the People's Park in Madras; the king's
    shot missed but the tiger fainted and a hunter killed it. For his son's third birthday the king bought a cheap wooden toy tiger;
    a sliver from it pricked his hand, the wound became infected, and he died: the hundredth tiger took its revenge. Themes: satire on
    vanity and power, fate, cruelty to animals.
  explanations:
    text: The Maharaja of Pratibandapuram is told he will be killed by his hundredth tiger. Determined to defy fate, he slaughters 99 tigers, risking his throne and wasting fortunes. But he dies from an infected splinter from a wooden toy tiger, the 'hundredth tiger', in a darkly comic twist.
    visual: Picture a proud king posing beside 99 dead tigers, then frowning at a cheap little wooden tiger in a toyshop, unaware that its splinter will be his end.
    step_by_step: 'Step 1: The prophecy at birth. Step 2: The king''s tiger hunts and their costs. Step 3: The British officer and the diamond rings. Step 4: The search for the hundredth tiger. Step 5: The wooden toy tiger and his death.'
    real_world: The story mocks rulers who misuse power and harm wildlife for pride; India's tiger population fell badly from such hunts before protection laws.
  picture:
    kind: flow
    steps:
    - 'Prophecy: death by the 100th tiger'
    - King kills 99 tigers
    - Can't find the 100th
    - Buys a wooden toy tiger
    - 'Splinter infects his hand: he dies'
    alt: 'The Tiger King: the prophecy, the hunts and the ironic end.'
  activity:
    type: number_line
    min: 80
    max: 110
    step: 1
    start: 80
    prompt: 'The Tiger King: count the tigers.'
    goals:
    - prompt: How many tigers had he killed before he couldn't find another?
      target: 99
      mistakes:
      - when:
          v: 100
        say: That's the tiger he was waiting for. He got stuck one short of it.
      - when:
          v: 90
        say: He kept going past 90, until he was just one short of a hundred.
    - prompt: Which tiger did astrologers say would kill him?
      target: 100
      mistakes:
      - when:
          v: 99
        say: He reached 99. The hundredth was the fatal one.
  lesson:
    - teach: 'Kalki''s ''The Tiger King'' is a satire. The Maharaja of Pratibandapuram, Sir Jilani Jung Jung Bahadur, was told by astrologers at his birth that he would die because of a tiger. The ten-day-old baby, amazingly, spoke: ''Let tigers beware!'' The astrologer said the hundredth tiger would be his end.'
      check:
        prompt: What did the astrologers predict about the king?
        options:
        - he would die because of a tiger
        - he would become a great hunter
        - he would never marry
        answer: he would die because of a tiger
        why: Later it was narrowed to the hundredth tiger.
      ways:
      - style: visual
        teach: The prophecy that sets the story in motion.
        picture:
          kind: flow
          steps:
          - 'Astrologers: he will die because of a tiger'
          - 'The baby ''speaks'': Let tigers beware!'
          - 'Astrologer: the hundredth tiger will be his end'
          - The king vows to kill a hundred tigers
          alt: Astrologers say the prince will die because of a tiger. The ten-day-old baby is said to speak, warning tigers to beware. The astrologer adds that the hundredth tiger will be his end, so the king vows to kill a hundred tigers.
      - style: real_world
        teach: Satire laughs at power to make a point. The baby speaking, the king's long name and the rings for the officer's wife are meant to be funny, showing how silly and selfish such rulers could be.
    - teach: To beat fate, the king set out to kill one hundred tigers and banned tiger hunting by anyone else. When a British officer wanted to hunt a tiger, he refused, risking his throne, and then saved it by sending the officer's wife expensive diamond rings. He married a princess from a state with many tigers so he could keep hunting.
      picture:
        kind: flow
        steps:
        - prophecy at birth
        - ban on hunting by others
        - rings to save the throne
        - marries for more tigers
        - 99 tigers killed
        alt: The Tiger King's steps towards killing one hundred tigers.
      check:
        prompt: Why did the Tiger King choose to marry that princess?
        options:
        - her state had many tigers
        - she was very rich
        - the British ordered it
        answer: her state had many tigers
        why: He needed more tigers to reach one hundred.
      ways:
      - style: step_by_step
        teach: 'Step 1: The king bans tiger hunting for everyone else. Step 2: A British officer wants a tiger photo. Step 3: The king refuses and risks his throne. Step 4: He saves it by sending costly diamond rings: power and bribery side by side.'
      - style: real_world
        teach: 'When people in power chase one goal at any cost, others pay for it. The king risks his throne and spends lavishly to protect a private obsession: the story mocks leaders who serve their own vanity.'
    - teach: After 99 tigers, none were left. The dewan secretly brought an old tiger from the People's Park in Madras. The king fired and thought he had killed it, but the tiger had only fainted from fright, and a hunter quietly killed it. Later, for his son's third birthday, the king bought a cheap wooden toy tiger. A sliver from it pricked his right hand; the wound became infected and he died. The hundredth tiger had its revenge.
      check:
        prompt: Why is the king's death ironic?
        options:
        - a cheap toy tiger killed the man who killed real ones
        - he died in a great battle
        - he died of old age
        answer: a cheap toy tiger killed the man who killed real ones
        why: Fate struck through the least dangerous 'tiger'.
      ways:
      - style: visual
        teach: 'The irony of the hundredth tiger: belief and reality.'
        picture:
          kind: compare
          columns:
          - title: What everyone believed
            points:
            - The king shot the hundredth tiger
            - The prophecy was beaten
          - title: What really happened
            points:
            - That tiger only fainted; a hunter killed it
            - A wooden toy tiger's sliver killed the king
          alt: Everyone believed the king shot the hundredth tiger and beat the prophecy. In reality that tiger only fainted and a hunter killed it, and a sliver from a wooden toy tiger killed the king.
      - style: step_by_step
        teach: 'Step 1: Note the toy tiger is cheap and carelessly made. Step 2: A sliver pricks the king''s hand. Step 3: The wound becomes infected. Step 4: He dies: the ''hundredth tiger'' was a toy, a final ironic twist.'
  items:
  - prompt: According to the astrologers, which tiger would kill the king?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - The hundredth.
    - One hundred.
    solution: "The astrologers foretold that the hundredth tiger would bring the king's death."
    mistakes: {"99": "e12_tk_which", "1": "e12_tk_which", "50": "e12_tk_which", "1000": "e12_tk_which"}
  - prompt: How many tigers did the king actually kill himself?
    answer: '99'
    check: '99'
    difficulty: 2
    hints:
    - The last one fainted.
    - One short.
    solution: 99 (the 100th only fainted).
    mistakes: {"100": "e12_tk_killed", "50": "e12_tk_killed", "70": "e12_tk_killed", "101": "e12_tk_killed"}
  - prompt: How did the king finally die?
    options:
    - from an infected splinter of a wooden toy tiger
    - killed by a real tiger
    - in a war
    - of old age
    answer: from an infected splinter of a wooden toy tiger
    difficulty: 1
    hints:
    - Son's birthday gift.
    - Irony.
    solution: From a splinter of a toy tiger.
    mistakes: {"killed by a real tiger": "e12_tk_death", "in a war": "e12_tk_death", "of old age": "e12_tk_death"}
  - prompt: What did the king send to the British officer's wife to save his throne?
    options:
    - diamond rings
    - a tiger cub
    - gold coins only
    - silk saris
    answer: diamond rings
    difficulty: 2
    hints:
    - Expensive.
    - Fifty of them.
    solution: "To keep his throne the king sent diamond rings to the British officer's wife."
    mistakes: {"a tiger cub": "e12_tk_rings", "gold coins only": "e12_tk_rings", "silk saris": "e12_tk_rings"}
  - prompt: Why did the king marry a particular princess?
    options:
    - Her state had many tigers
    - She was very rich
    - She was a famous hunter
    - The British ordered it
    answer: Her state had many tigers
    difficulty: 2
    hints:
    - More tigers to kill.
    - Tiger population.
    solution: Her state had a large tiger population.
    mistakes:
      She was very rich: eng12_read_again
  - prompt: 'The story is mainly a:'
    options:
    - satire on vanity and misuse of power
    - true history
    - love story
    - science fiction tale
    answer: satire on vanity and misuse of power
    difficulty: 2
    hints:
    - Mocking.
    - Kalki.
    solution: A satire on vanity and power.
    mistakes:
      true history: eng12_theme
  - prompt: Who wrote 'The Tiger King'?
    options:
    - Kalki (R. Krishnamurthy)
    - R.K. Narayan
    - Anees Jung
    answer: Kalki (R. Krishnamurthy)
    difficulty: 1
    hints:
    - A Tamil writer.
    - His pen name is also the name of a Hindu avatar.
    solution: 'Step 1: Tamil satirist. Step 2: Kalki.'
    mistakes:
      R.K. Narayan: e12x15_text
      Anees Jung: e12x15_text
  - prompt: What were the first words the ten-day-old king spoke?
    options:
    - '''Let tigers beware!'''
    - '''I am the king'''
    - '''Bring me food'''
    answer: '''Let tigers beware!'''
    difficulty: 2
    hints:
    - It was a warning.
    - It was about the animal in the prophecy.
    solution: 'Step 1: a miracle baby speaks. Step 2: a warning to tigers.'
    mistakes:
      '''I am the king''': e12x15_irony
      '''Bring me food''': e12x15_irony
  - prompt: How old was the king's son when he got the toy tiger?
    options:
    - three
    - ten
    - one
    answer: three
    difficulty: 1
    hints:
    - It was a birthday present.
    - He was still a small child.
    solution: 'Step 1: the prince''s birthday. Step 2: his third.'
    mistakes:
      ten: e12x15_text
      one: e12x15_text
  - prompt: Where did the dewan get the hundredth tiger?
    options:
    - the People's Park in Madras
    - a forest in Africa
    - the British officer
    answer: the People's Park in Madras
    difficulty: 2
    hints:
    - It was an old, captive tiger.
    - A city park.
    solution: 'Step 1: no wild tigers left. Step 2: brought from Madras.'
    mistakes:
      a forest in Africa: e12x15_text
      the British officer: e12x15_text
  - prompt: Why did the hundredth tiger fall when the king shot at it?
    options:
    - it fainted from the noise of the shot
    - the bullet hit its heart
    - it tripped
    answer: it fainted from the noise of the shot
    difficulty: 2
    hints:
    - The king's shot missed.
    - The tiger was old and timid.
    solution: 'Step 1: the bullet missed. Step 2: the tiger fainted in fright.'
    mistakes:
      the bullet hit its heart: e12x15_irony
      it tripped: e12x15_irony
  - prompt: Why did the hunters hide the truth about the hundredth tiger?
    options:
    - they feared losing their jobs
    - they wanted the tiger as a pet
    - the king told them to
    answer: they feared losing their jobs
    difficulty: 2
    hints:
    - The king believed he had shot it.
    - Telling him the truth was risky.
    solution: 'Step 1: the king''s anger. Step 2: jobs at stake.'
    mistakes:
      they wanted the tiger as a pet: e12x15_text
      the king told them to: e12x15_text
  - prompt: What gift did the king want for his son's third birthday?
    options:
    - a wooden toy tiger
    - a real tiger cub
    - a gold crown
    answer: a wooden toy tiger
    difficulty: 1
    hints:
    - It was cheap.
    - It came from a toy shop.
    solution: 'Step 1: a birthday present. Step 2: a toy tiger.'
    mistakes:
      a real tiger cub: e12x15_text
      a gold crown: e12x15_text
  - prompt: Which of these does the story mainly satirise?
    options:
    - the vanity and cruelty of those in power
    - kindness to animals
    - honest rulers
    answer: the vanity and cruelty of those in power
    difficulty: 2
    hints:
    - Look at how the king behaves.
    - Think of the tigers he kills.
    solution: 'Step 1: proud, cruel king. Step 2: satire of power.'
    mistakes:
      kindness to animals: e12x15_irony
      honest rulers: e12x15_irony
  - prompt: 'The story also shows a concern for:'
    options:
    - wildlife conservation
    - city planning
    - space travel
    answer: wildlife conservation
    difficulty: 1
    hints:
    - Tigers were wiped out in the state.
    - Written long before Project Tiger.
    solution: 'Step 1: mass killing of tigers. Step 2: the need to protect wildlife.'
    mistakes:
      city planning: e12x15_irony
      space travel: e12x15_irony
  - prompt: 'Assertion (A): The Maharaja married a princess from a state with many tigers.

      Reason (R): He wanted to continue his mission of killing a hundred tigers after tigers ran out in his own state.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: His marriage was a strategic move to find more tigers to kill. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: The king, who killed 99 tigers to escape fate, dies from a sliver of a wooden toy tiger. What is the main effect of this ending?'
    options:
    - 'Irony: fate wins in the most unexpected way'
    - It shows toys are dangerous
    - It proves astrologers are always wrong
    answer: 'Irony: fate wins in the most unexpected way'
    hints:
    - What was the king trying to avoid?
    - What actually killed him?
    solution: 'After all his effort to beat the prophecy, a toy tiger causes his death: dramatic irony.'
    mistakes:
      It shows toys are dangerous: e12x15_irony
      It proves astrologers are always wrong: e12x15_irony
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student says the story is only about tigers. What wider target does the satire have?'
    options:
    - The vanity and misuse of power by rulers
    - Wildlife photography
    - The life of astrologers
    answer: The vanity and misuse of power by rulers
    hints:
    - How does the king treat his people and the British?
    - Whose interests come first for him?
    solution: Kalki mocks rulers who misuse power for personal pride, while also hinting at the cruel killing of wildlife.
    mistakes:
      Wildlife photography: e12x15_irony
      The life of astrologers: e12x15_text
    exam: competency
    difficulty: 2
