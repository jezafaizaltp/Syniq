subject: cbse12-eng
chapter: 15
title: The Tiger King (Kalki)
concepts:
- code: cbse12e.v2.tigerking
  title: The Tiger King (Kalki)
  notes: |
    A satire by Kalki (R. Krishnamurthy). The Maharaja of Pratibandapuram, Sir Jilani Jung Jung Bahadur ('the Tiger King'), was
    told by astrologers at birth that he would die because of a tiger, specifically the hundredth. At ten days old he spoke! To
    defy fate he began killing tigers, banned tiger hunting by others, risked his throne by refusing a British officer a hunt (then
    appeased him with expensive diamond rings for his wife), and married a princess from a state with many tigers. After killing 99
    tigers, he couldn't find the hundredth; the dewan secretly released an old tiger from the People's Park in Madras; the king's
    shot missed but the tiger fainted and a hunter killed it. For his son's third birthday the king bought a cheap wooden toy tiger;
    a sliver from it pricked his hand, the wound became infected, and he died: the hundredth tiger took its revenge. Themes: satire on
    vanity and power, fate, cruelty to animals.
  explanations:
    text: The Maharaja of Pratibandapuram is told he will be killed by his hundredth tiger. Determined to defy fate, he slaughters 99 tigers, risking his throne and wasting fortunes. But he dies from an infected splinter from a wooden toy tiger, the 'hundredth tiger', in a darkly comic twist.
    visual: Picture a proud king posing beside 99 dead tigers, then frowning at a cheap little wooden tiger in a toyshop, unaware that its splinter will be his end.
    step_by_step: 'Step 1: The prophecy at birth. Step 2: The king''s tiger hunts and their costs. Step 3: The British officer and the diamond rings. Step 4: The search for the hundredth tiger. Step 5: The wooden toy tiger and his death.'
    real_world: The story mocks rulers who misuse power and harm wildlife for pride; India's tiger population fell badly from such hunts before protection laws.
  picture:
    kind: flow
    steps:
    - 'Prophecy: death by the 100th tiger'
    - King kills 99 tigers
    - Can't find the 100th
    - Buys a wooden toy tiger
    - 'Splinter infects his hand: he dies'
    alt: 'The Tiger King: the prophecy, the hunts and the ironic end.'
  activity:
    type: number_line
    min: 80
    max: 110
    step: 1
    start: 80
    prompt: 'The Tiger King: count the tigers.'
    goals:
    - prompt: How many tigers had he killed before he couldn't find another?
      target: 99
      mistakes:
      - when:
          v: 100
        say: That's the target. He got stuck at 99 before the dewan's old tiger.
      - when:
          v: 90
        say: He kept going past 90. He reached 99 and then could find no more tigers.
    - prompt: Which tiger did astrologers say would kill him?
      target: 100
      mistakes:
      - when:
          v: 99
        say: He reached 99. The hundredth was the fatal one.
  items:
  - prompt: According to the astrologers, which tiger would kill the king?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - The hundredth.
    - One hundred.
    solution: The hundredth.
  - prompt: How many tigers did the king actually kill himself?
    answer: '99'
    check: '99'
    difficulty: 2
    hints:
    - The last one fainted.
    - One short.
    solution: 99 (the 100th only fainted).
  - prompt: How did the king finally die?
    options:
    - from an infected splinter of a wooden toy tiger
    - killed by a real tiger
    - in a war
    - of old age
    answer: from an infected splinter of a wooden toy tiger
    difficulty: 1
    hints:
    - Son's birthday gift.
    - Irony.
    solution: From a splinter of a toy tiger.
  - prompt: What did the king send to the British officer's wife to save his throne?
    options:
    - diamond rings
    - a tiger cub
    - gold coins only
    - silk saris
    answer: diamond rings
    difficulty: 2
    hints:
    - Expensive.
    - Fifty of them.
    solution: Expensive diamond rings.
  - prompt: Why did the king marry a particular princess?
    options:
    - Her state had many tigers
    - She was very rich
    - She was a famous hunter
    - The British ordered it
    answer: Her state had many tigers
    difficulty: 2
    hints:
    - More tigers to kill.
    - Tiger population.
    solution: Her state had a large tiger population.
    mistakes:
      She was very rich: eng12_read_again
  - prompt: 'The story is mainly a:'
    options:
    - satire on vanity and misuse of power
    - true history
    - love story
    - science fiction tale
    answer: satire on vanity and misuse of power
    difficulty: 2
    hints:
    - Mocking.
    - Kalki.
    solution: A satire on vanity and power.
    mistakes:
      true history: eng12_theme
