concepts:
- code: cbse12e.v1.thirdlevel
  title: The Third Level (Jack Finney)
  notes: |
    Charley, 31, says Grand Central Station in New York has a third level, though officials say only two exist. Taking a short cut
    one night, he wanders into an old-fashioned station: gas lamps, brass spittoons, people in 1890s clothes, a newspaper (The World)
    dated June 11, 1894. He tries to buy two tickets to Galesburg, Illinois (a peaceful town with big old houses, lawns and summer
    evenings) for himself and his wife Louisa, but the clerk rejects his modern money as fake. Next day he withdraws $300 and buys
    old-style currency, but cannot find the third level again. His psychiatrist friend Sam says it's a waking-dream wish fulfilment,
    an escape from modern worries (war, insecurity); stamp collecting is also an escape. Later Sam disappears; Charley finds, in his
    grandfather's stamp collection, a first-day cover dated July 18, 1894, from Sam in Galesburg, saying he found the third level.
    Themes: escapism, the stress of modern life, fantasy and reality.
  explanations:
    text: Charley claims he once stumbled onto a hidden third level at Grand Central Station, where it was still 1894. He wanted to escape there with his wife to peaceful Galesburg, but could never find it again. His psychiatrist says it's escapism, but in the end Charley finds a letter from that very psychiatrist, Sam, sent from Galesburg in 1894.
    visual: Picture a modern commuter turning a corner in a busy station and stepping into a gaslit hall with brass spittoons, men in derby hats and a newspaper dated 1894.
    step_by_step: 'Step 1: Charley''s claim about the third level. Step 2: What he saw there (1894). Step 3: Trying to buy tickets to Galesburg. Step 4: Sam''s explanation of escapism. Step 5: The twist: Sam''s letter from 1894.'
    real_world: People today escape stress with games, films and nostalgia for 'simpler times', the same urge the story explores.
  picture:
    kind: flow
    steps:
    - Charley takes a short cut
    - 'Finds the third level: 1894'
    - Tries to buy tickets to Galesburg
    - Can't find it again; Sam calls it escapism
    - Sam's 1894 letter from Galesburg
    alt: 'The Third Level: Charley''s discovery, his failed escape and the twist ending.'
  activity:
    type: order
    prompt: 'The Third Level: put the events in order.'
    steps:
    - Charley takes a short cut in Grand Central
    - He finds a station from 1894
    - The clerk rejects his money
    - He buys old-style currency
    - He can't find the third level again
    - Sam's 1894 letter from Galesburg
    reasons:
      He finds a station from 1894: The short cut leads to the third level.
      The clerk rejects his money: He tries to buy tickets.
      He buys old-style currency: He wants to go back.
      He can't find the third level again: Next time, it's gone.
      Sam's 1894 letter from Galesburg: Sam has found it.
  lesson:
    - teach: 'In Jack Finney''s ''The Third Level'', Charley, 31, insists that Grand Central Station in New York has a third level, though officials say there are only two. One night, taking a short cut, he walks down a corridor and finds himself in an old station: gas lamps, brass spittoons, people dressed as in the 1890s, and a newspaper, The World, dated June 11, 1894.'
      picture:
        kind: flow
        steps:
        - short cut in Grand Central
        - long corridor and stairs
        - old station with gas lamps
        - newspaper dated 1894
        alt: How Charley reaches the third level.
      check:
        prompt: What told Charley he was in 1894?
        options:
        - the date on a newspaper
        - a calendar on his phone
        - a clock tower
        answer: the date on a newspaper
        why: The World was dated June 11, 1894.
    - teach: Charley tries to buy two tickets to Galesburg, Illinois, a peaceful town with big old frame houses, huge lawns and long summer evenings, for himself and his wife Louisa. The clerk looks at his modern money and thinks it is fake. Charley flees. The next day he takes $300 from the bank and buys old-style currency, but he can never find the third level again.
      check:
        prompt: Why did the clerk refuse Charley's money?
        options:
        - it was a modern design he had never seen
        - it was torn
        - it was foreign money
        answer: it was a modern design he had never seen
        why: Notes from Charley's time looked fake in 1894.
    - teach: 'His psychiatrist friend Sam says the third level is a ''waking-dream wish fulfilment'': an escape from modern insecurity, fear and war. He says Charley''s stamp collecting is also an escape. Later Sam disappears. In his grandfather''s stamp collection, Charley finds a first-day cover, posted July 18, 1894, from Sam in Galesburg: Sam had found the third level and was happy there.'
      picture:
        kind: compare
        columns:
        - title: Modern New York
          points:
          - worry
          - insecurity
          - war
        - title: Galesburg 1894
          points:
          - peace
          - big lawns
          - summer evenings
        alt: What Charley wanted to escape from and what he longed for.
      check:
        prompt: What twist does the ending give?
        options:
        - the sceptic Sam himself escaped to 1894
        - Charley went to jail
        - the third level was a dream
        answer: the sceptic Sam himself escaped to 1894
        why: His letter to Charley's grandfather proves it.
