subject: cbse12-eng
chapter: 10
title: Keeping Quiet (Pablo Neruda)
concepts:
- code: cbse12e.f10.quiet
  title: Keeping Quiet (Pablo Neruda)
  notes: |
    The poet asks us to count to twelve and keep still, without speaking any language and without moving our arms. In that sudden
    strangeness we could understand each other: fishermen would not harm whales, the man gathering salt would look at his hurt
    hands, those preparing wars (green wars, wars with gas and fire) would put on clean clothes and walk with their brothers. He
    clarifies he doesn't want total inactivity ("Life is what it is about; I want no truck with death"). If we weren't so single-
    minded about keeping our lives moving, a huge silence might end the sadness of never understanding ourselves. The earth teaches:
    everything seems dead in winter and later proves to be alive. Themes: introspection, peace, environment.
  explanations:
    text: Pablo Neruda asks everyone in the world to stay silent and still for a moment, counting to twelve. In that pause, people might stop harming nature and each other, end wars, and understand themselves better. He doesn't mean doing nothing forever, just stopping to reflect, like the earth that seems dead in winter but comes back to life.
    visual: 'Picture the whole world frozen for a moment: fishermen lower their nets, soldiers stand still, and in the silence people look at each other as brothers.'
    step_by_step: 'Step 1: The request to count to twelve and keep still. Step 2: What could change (fishermen, salt gatherer, wars). Step 3: Not total inactivity. Step 4: The earth as an example of life in apparent stillness.'
    real_world: Silent minutes of reflection, like a moment of silence on Martyrs' Day, give people a chance to think about peace.
  picture:
    kind: flow
    steps:
    - Count to twelve
    - Keep still and silent
    - No harm to nature or others
    - Not inactivity, but reflection
    - 'Like the earth: alive under stillness'
    alt: 'Keeping Quiet: the pause, its effects and its meaning.'
  activity:
    type: sort
    prompt: 'Keeping Quiet: if we kept still, what would change?'
    bins:
    - How we treat nature
    - How we treat ourselves
    - How we treat others
    items:
    - label: Fishermen would not harm whales
      bin: How we treat nature
      clue: Whales live in the sea.
      why: 'Stopping our rush would spare whales: kindness to nature.'
    - label: The salt gatherer looks at his hurt hands
      bin: How we treat ourselves
      clue: He has never stopped to notice.
      why: Pausing, he would see the harm his own work does to him.
    - label: No more green wars, wars with gas
      bin: How we treat others
      clue: Wars are fought against other people.
      why: If we paused, we would stop fighting each other.
    - label: Walking in clean clothes with their brothers
      bin: How we treat others
      clue: Enemies become…
      why: 'Those who prepared wars would walk together as brothers: peace with others.'
    - label: Understanding ourselves at last
      bin: How we treat ourselves
      clue: The sadness the poet wants to end.
      why: Silence could end 'the sadness of never understanding ourselves'.
  items:
  - prompt: To what number does the poet ask us to count?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - A clock's hours.
    - Twelve.
    solution: Twelve.
  - prompt: 'The poet asks us to keep still and:'
    options:
    - not speak in any language
    - sing loudly
    - run fast
    - write letters
    answer: not speak in any language
    difficulty: 1
    hints:
    - Silence.
    - No language.
    solution: Not speak in any language.
  - prompt: Who would 'not harm whales' in the quiet moment?
    options:
    - fishermen
    - soldiers
    - children
    - farmers
    answer: fishermen
    difficulty: 1
    hints:
    - Cold sea.
    - Nets.
    solution: Fishermen.
  - prompt: Does the poet want total inactivity?
    options:
    - No, he wants reflection, not death-like stillness
    - Yes, forever
    - Yes, for a year
    - He doesn't say
    answer: No, he wants reflection, not death-like stillness
    difficulty: 2
    hints:
    - '''Life is what it is about.'''
    - No truck with death.
    solution: No, he wants a pause to reflect.
    mistakes:
      Yes, forever: eng12_poem_meaning
  - prompt: What example does the earth give?
    options:
    - things that seem dead later prove to be alive
    - everything stays dead
    - earth never changes
    - only summer matters
    answer: things that seem dead later prove to be alive
    difficulty: 2
    hints:
    - Winter and spring.
    - Rebirth.
    solution: Things that seem dead come back to life.
  - prompt: 'Pablo Neruda was a poet from:'
    options:
    - Chile
    - Spain
    - Mexico
    - India
    answer: Chile
    difficulty: 2
    hints:
    - South America.
    - Nobel Prize 1971.
    solution: Chile.
