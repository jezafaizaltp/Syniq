# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 10.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 10
title: Keeping Quiet (Pablo Neruda)
tips:
  e12_kq_chile: "Neruda won the Nobel Prize and served his South American country. Which country, long and thin on the Pacific coast?"
  e12_kq_count: "Neruda asks us to count to a number like the hours on a clock face. Which number?"
  e12_kq_earth: "In winter the earth looks lifeless, then spring comes. What does that teach about things that seem dead?"
  e12_kq_still: "Keeping quiet means stopping all noise, even talk. What does the poet ask us not to use?"
  e12_kq_whales: "Think of who hurts whales at sea in the cold. Who would stop for a moment?"
  e12x10_idea: 'Remember what the silence is for: to stop and reflect together, not to be lazy or dead.'
  e12x10_img: "Ask whom each image shows harming something: the fishermen, the salt gatherer, and a third group. Which of them gains most from stopping?"

concepts:
- code: cbse12e.f10.quiet
  title: Keeping Quiet (Pablo Neruda)
  notes: |
    The poet asks us to count to twelve and keep still, without speaking any language and without moving our arms. In that sudden
    strangeness we could understand each other: fishermen would not harm whales, the man gathering salt would look at his hurt
    hands, those preparing wars (green wars, wars with gas and fire) would put on clean clothes and walk with their brothers. He
    clarifies he doesn't want total inactivity ("Life is what it is about; I want no truck with death"). If we weren't so single-
    minded about keeping our lives moving, a huge silence might end the sadness of never understanding ourselves. The earth teaches:
    everything seems dead in winter and later proves to be alive. Themes: introspection, peace, environment.
  explanations:
    text: Pablo Neruda asks everyone in the world to stay silent and still for a moment, counting to twelve. In that pause, people might stop harming nature and each other, end wars, and understand themselves better. He doesn't mean doing nothing forever, just stopping to reflect, like the earth that seems dead in winter but comes back to life.
    visual: 'Picture the whole world frozen for a moment: fishermen lower their nets, soldiers stand still, and in the silence people look at each other as brothers.'
    step_by_step: 'Step 1: The request to count to twelve and keep still. Step 2: What could change (fishermen, salt gatherer, wars). Step 3: Not total inactivity. Step 4: The earth as an example of life in apparent stillness.'
    real_world: Silent minutes of reflection, like a moment of silence on Martyrs' Day, give people a chance to think about peace.
  picture:
    kind: flow
    steps:
    - Count to twelve
    - Keep still and silent
    - No harm to nature or others
    - Not inactivity, but reflection
    - 'Like the earth: alive under stillness'
    alt: 'Keeping Quiet: the pause, its effects and its meaning.'
  activity:
    type: sort
    prompt: 'Keeping Quiet: if we kept still, what would change?'
    bins:
    - How we treat nature
    - How we treat ourselves
    - How we treat others
    items:
    - label: Fishermen would not harm whales
      bin: How we treat nature
      clue: Whales live in the sea.
      why: 'Stopping our rush would spare whales: kindness to nature.'
    - label: The salt gatherer looks at his hurt hands
      bin: How we treat ourselves
      clue: He has never stopped to notice.
      why: Pausing, he would see the harm his own work does to him.
    - label: No more green wars, wars with gas
      bin: How we treat others
      clue: Wars are fought against other people.
      why: If we paused, we would stop fighting each other.
    - label: Walking in clean clothes with their brothers
      bin: How we treat others
      clue: Enemies become…
      why: 'Those who prepared wars would walk together as brothers: peace with others.'
    - label: Understanding ourselves at last
      bin: How we treat ourselves
      clue: The sadness the poet wants to end.
      why: Silence could end 'the sadness of never understanding ourselves'.
  lesson:
    - teach: Pablo Neruda, the Chilean poet, asks us to count to twelve and keep still for once on the face of the earth. We should not speak in any language and not move our arms so much. In this 'exotic moment' without rush or engines, we would all be together in a sudden strangeness.
      check:
        prompt: Why does the poet ask us not to speak in any language?
        options:
        - silence removes what divides us
        - he dislikes talking
        - languages are too hard
        answer: silence removes what divides us
        why: Without language barriers, people can feel together.
      ways:
      - style: visual
        teach: What the poet asks us to do while we count to twelve.
        picture:
          kind: compare
          columns:
          - title: Stop
            points:
            - Speaking in any language
            - Moving our arms so much
            - Rushing and engines
          - title: Gain
            points:
            - A shared, strange calm
            - Togetherness
            - Time to reflect
          alt: While counting to twelve, the poet asks us to stop speaking in any language, stop moving our arms so much, and stop rushing and engines. In return we gain a shared, strange calm, togetherness and time to reflect.
      - style: real_world
        teach: 'A two-minute silence on Martyrs'' Day, when a whole nation stops at once, is close to what Neruda imagines: strangers standing still together, thinking instead of rushing.'
    - teach: In that quiet, fishermen would not harm whales, the man gathering salt would look at his hurt hands, and those preparing green wars, wars with gas and fire, and victories with no survivors, would put on clean clothes and walk about with their brothers in the shade, doing nothing.
      picture:
        kind: compare
        columns:
        - title: Who
          points:
          - fishermen
          - salt gatherer
          - makers of war
        - title: In the quiet
          points:
          - stop harming whales
          - look at his hurt hands
          - walk with their brothers
        alt: What different people would do in the moment of silence.
      check:
        prompt: '''Victory with no survivors'' shows that war is:'
        options:
        - pointless, since everyone loses
        - glorious
        - easy to win
        answer: pointless, since everyone loses
        why: If none survive, nobody really wins.
      ways:
      - style: step_by_step
        teach: 'Step 1: List the people in stanza three: fishermen, the salt gatherer, those who make war. Step 2: Ask what each is doing to nature, to themselves or to others. Step 3: Imagine them pausing. Step 4: The poet suggests quiet reflection could stop the harm.'
      - style: real_world
        teach: 'Think of a heated argument in class that ends when someone says ''let''s all take a breath''. A pause lets people see each other as people again: the war-makers walking with their brothers in the shade.'
    - teach: 'The poet says he does not mean total inactivity: life is what it is about, and he wants no truck with death. If we were not so single-minded about keeping our lives moving, a huge silence might stop the sadness of never understanding ourselves. The earth teaches this: everything seems dead in winter and later proves to be alive. He ends: now I''ll count up to twelve, and you keep quiet, and I will go.'
      check:
        prompt: What does the earth's example teach?
        options:
        - what seems still and dead can come back to life
        - winter lasts forever
        - nothing ever changes
        answer: what seems still and dead can come back to life
        why: Spring follows winter; quiet can renew us.
      ways:
      - style: visual
        teach: Silence in the poem is not death but renewal.
        picture:
          kind: compare
          columns:
          - title: Not this
            points:
            - Total inactivity
            - Death
          - title: This
            points:
            - A pause for reflection
            - Like earth in winter, alive underneath
          alt: The poet does not mean total inactivity or death. He means a pause for reflection, like the earth in winter, which seems dead but is alive underneath.
      - style: step_by_step
        teach: 'Step 1: Notice the poet clears a misreading: he doesn''t mean doing nothing. Step 2: He says we are too single-minded about keeping busy. Step 3: That busyness hides our own sadness from us. Step 4: A pause might let us understand ourselves.'
  items:
  - prompt: To what number does the poet ask us to count?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - A clock's hours.
    - Twelve.
    solution: "Neruda asks us to count to twelve, like the twelve hours on a clock or the twelve months, and then stay still."
    mistakes: {"10": "e12_kq_count", "100": "e12_kq_count", "7": "e12_kq_count", "24": "e12_kq_count"}
  - prompt: 'The poet asks us to keep still and:'
    options:
    - not speak in any language
    - sing loudly
    - run fast
    - write letters
    answer: not speak in any language
    difficulty: 1
    hints:
    - Silence.
    - No language.
    solution: Not speak in any language.
    mistakes: {"sing loudly": "e12_kq_still", "run fast": "e12_kq_still", "write letters": "e12_kq_still"}
  - prompt: Who would 'not harm whales' in the quiet moment?
    options:
    - fishermen
    - soldiers
    - children
    - farmers
    answer: fishermen
    difficulty: 1
    hints:
    - Cold sea.
    - Nets.
    solution: "In the quiet moment, fishermen in the cold sea would stop harming whales."
    mistakes: {"soldiers": "e12_kq_whales", "children": "e12_kq_whales", "farmers": "e12_kq_whales"}
  - prompt: Does the poet want total inactivity?
    options:
    - No, he wants reflection, not death-like stillness
    - Yes, forever
    - Yes, for a year
    - He doesn't say
    answer: No, he wants reflection, not death-like stillness
    difficulty: 2
    hints:
    - '''Life is what it is about.'''
    - No truck with death.
    solution: No, he wants a pause to reflect.
    mistakes:
      Yes, forever: eng12_poem_meaning
  - prompt: What example does the earth give?
    options:
    - things that seem dead later prove to be alive
    - everything stays dead
    - earth never changes
    - only summer matters
    answer: things that seem dead later prove to be alive
    difficulty: 2
    hints:
    - Winter and spring.
    - Rebirth.
    solution: Things that seem dead come back to life.
    mistakes: {"everything stays dead": "e12_kq_earth", "earth never changes": "e12_kq_earth", "only summer matters": "e12_kq_earth"}
  - prompt: 'Pablo Neruda was a poet from:'
    options:
    - Chile
    - Spain
    - Mexico
    - India
    answer: Chile
    difficulty: 2
    hints:
    - South America.
    - Nobel Prize 1971.
    solution: "Pablo Neruda was from Chile and won the Nobel Prize in Literature in 1971."
    mistakes: {"Spain": "e12_kq_chile", "Mexico": "e12_kq_chile", "India": "e12_kq_chile"}
  - prompt: Why does the poet choose the number twelve?
    options:
    - it suggests the twelve hours on a clock or twelve months, a full cycle
    - it is his age
    - it is a lucky number in Chile
    answer: it suggests the twelve hours on a clock or twelve months, a full cycle
    difficulty: 3
    hints:
    - Think of how we measure time.
    - Clocks and calendars.
    solution: 'Step 1: twelve marks units of time. Step 2: a full cycle for reflection.'
    mistakes:
      it is his age: e12x10_idea
      it is a lucky number in Chile: e12x10_idea
  - prompt: What does 'green wars' refer to?
    options:
    - wars against nature and the environment
    - wars fought in forests only
    - wars about the colour green
    answer: wars against nature and the environment
    difficulty: 2
    hints:
    - Green is the colour of nature.
    - Humans harm the planet.
    solution: 'Step 1: green = nature. Step 2: destruction of the environment.'
    mistakes:
      wars fought in forests only: e12x10_img
      wars about the colour green: e12x10_img
  - prompt: 'The man gathering salt would ''look at his hurt hands''. This shows:'
    options:
    - he would notice the harm he does to himself
    - he is lazy
    - salt is valuable
    answer: he would notice the harm he does to himself
    difficulty: 2
    hints:
    - Busy people ignore their own pain.
    - The quiet makes him notice.
    solution: 'Step 1: work hurts him. Step 2: silence lets him see it.'
    mistakes:
      he is lazy: e12x10_img
      salt is valuable: e12x10_img
  - prompt: '''I want no truck with death'' means the poet:'
    options:
    - does not want death-like total stillness
    - is afraid of trucks
    - wants war
    answer: does not want death-like total stillness
    difficulty: 2
    hints:
    - '''No truck with'' means no dealings with.'
    - He values life.
    solution: 'Step 1: idiom for ''nothing to do with''. Step 2: not inactivity.'
    mistakes:
      is afraid of trucks: e12x10_idea
      wants war: e12x10_idea
  - prompt: What sadness could the 'huge silence' end?
    options:
    - never understanding ourselves
    - losing a game
    - missing a train
    answer: never understanding ourselves
    difficulty: 2
    hints:
    - We are too busy to think about ourselves.
    - Introspection is the cure.
    solution: 'Step 1: constant activity. Step 2: no self-understanding.'
    mistakes:
      losing a game: e12x10_idea
      missing a train: e12x10_idea
  - prompt: Who would walk about with their brothers in clean clothes?
    options:
    - those who prepare wars
    - the fishermen
    - the poet's children
    answer: those who prepare wars
    difficulty: 2
    hints:
    - Clean clothes suggest a clean conscience.
    - They stop destruction.
    solution: 'Step 1: war-makers pause. Step 2: brotherhood instead.'
    mistakes:
      the fishermen: e12x10_img
      the poet's children: e12x10_img
  - prompt: 'The ''exotic moment'' is exotic because it is:'
    options:
    - rare and unusual in our busy lives
    - foreign and expensive
    - very noisy
    answer: rare and unusual in our busy lives
    difficulty: 1
    hints:
    - Exotic means strange or unfamiliar.
    - We seldom stop.
    solution: 'Step 1: people rarely stop together. Step 2: it would be strange and special.'
    mistakes:
      foreign and expensive: e12x10_idea
      very noisy: e12x10_idea
  - prompt: 'The poem''s main message is about:'
    options:
    - silence, reflection and peace
    - the joy of counting
    - the importance of speed
    answer: silence, reflection and peace
    difficulty: 1
    hints:
    - Look at the title.
    - What does keeping quiet lead to?
    solution: 'Step 1: stop and think. Step 2: peace and understanding.'
    mistakes:
      the joy of counting: e12x10_idea
      the importance of speed: e12x10_idea
  - prompt: Why would there be 'no rush, no engines' in the moment of quiet?
    options:
    - all activity and machines would pause
    - engines were banned
    - people had no cars
    answer: all activity and machines would pause
    difficulty: 1
    hints:
    - The poet asks everyone to keep still.
    - Machines stand for busy life.
    solution: 'Step 1: everyone stops. Step 2: no noise or hurry.'
    mistakes:
      engines were banned: e12x10_idea
      people had no cars: e12x10_idea
  - prompt: 'Assertion (A): The poet says that keeping quiet should not be confused with total inactivity.

      Reason (R): He wants a pause for reflection, and says he wants nothing to do with death.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'Neruda separates stillness from death: the silence is meant for thinking and renewal. R explains A.'
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: The poet uses the image of the earth in winter, when everything seems dead but later comes alive. What does this show?'
    options:
    - Stillness can lead to new life and understanding
    - Winter is the poet's favourite season
    - Everything that stops will die
    answer: Stillness can lead to new life and understanding
    hints:
    - What happens after winter?
    - How does this link to keeping quiet?
    solution: Just as the earth rests and then revives, a human pause can bring reflection and renewal.
    mistakes:
      Winter is the poet's favourite season: e12x10_idea
      Everything that stops will die: e12x10_idea
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your school plans a ''quiet minute'' each morning. How would Neruda''s poem support the idea?'
    options:
    - A shared pause helps people reflect and feel together
    - Silence is a punishment that keeps order
    - Quiet minutes are a waste of time
    answer: A shared pause helps people reflect and feel together
    hints:
    - What happens when everyone is still in the poem?
    - Is the silence forced or chosen?
    solution: The poem imagines a shared stillness bringing calm, unity and self-reflection.
    mistakes:
      Silence is a punishment that keeps order: e12x10_idea
      Quiet minutes are a waste of time: e12x10_idea
    exam: competency
    difficulty: 2
