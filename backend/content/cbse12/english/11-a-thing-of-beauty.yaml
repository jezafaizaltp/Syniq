# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 11.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 11
title: A Thing of Beauty (John Keats)
tips:
  e12_tb_flowers: "Keats names flowers 'with the green world they live in'. Wordsworth also wrote about these yellow flowers."
  e12_tb_fountain: "At the end Keats pictures beauty pouring down from heaven without end. What kind of drink-giving source is it?"
  e12_tb_grows: "Keats says a thing of beauty never passes into nothingness. Think: over time, does its loveliness get smaller or bigger?"
  e12_tb_idea: "Keats admits life has gloom and sorrow. What does beauty do for us in those dark times?"
  e12_tb_poem: "Keats's line opens a long poem named after a shepherd from Greek myth. Which title is a person's name?"
  e12x11_idea: 'Remember Keats''s claim: beauty gives lasting joy and lifts the gloom of hard times.'
  e12x11_img: 'Find where the image sits in the poem: nature (sun, moon, trees, daffodils, rills, musk-roses) or human greatness (dooms of the mighty dead, lovely tales).'

concepts:
- code: cbse12e.f11.beauty
  title: A Thing of Beauty (John Keats)
  notes: |
    An extract from Keats's long poem Endymion. "A thing of beauty is a joy for ever": its loveliness increases and never passes into
    nothingness; it keeps a quiet bower for us, full of sweet dreams, health and quiet breathing. Despite despondence, gloomy days and
    unhealthy ways, some shape of beauty removes the pall from our dark spirits. Examples: the sun, the moon, trees giving shade to
    sheep, daffodils and the green world, clear rills, the mid-forest brake with musk-rose blooms, the grandeur of the dooms of the
    mighty dead, lovely tales. Beauty is "an endless fountain of immortal drink" pouring from heaven. Theme: beauty gives lasting joy
    and helps us bear life's sorrows.
  explanations:
    text: 'John Keats says that a beautiful thing gives joy forever: its beauty grows and never fades. Even when life is sad and hard, the beauty of nature, like the sun, moon, trees, daffodils and streams, lifts the gloom from our spirits, like an endless fountain of heavenly drink.'
    visual: 'Picture a dark, cloudy sky (our sorrows) lifting to show the moon, shady trees with sheep, golden daffodils and a cool stream: beauty pulling back the ''pall'' from our spirit.'
    step_by_step: 'Step 1: The opening claim: beauty is a joy forever. Step 2: Beauty as a bower of rest. Step 3: Life''s sorrows. Step 4: Examples of beauty in nature. Step 5: The endless fountain image.'
    real_world: A walk by the backwaters or a sunset at the beach can lift a stressed student's mood, just as Keats describes.
  picture:
    kind: flow
    steps:
    - 'A thing of beauty: a joy forever'
    - Its loveliness grows, never fades
    - Life brings gloom and sorrow
    - Nature's beauty lifts the pall
    - An endless fountain of immortal drink
    alt: 'A Thing of Beauty: how beauty gives lasting joy despite life''s sorrows.'
  activity:
    type: sort
    prompt: 'A Thing of Beauty: a thing of beauty, or a sorrow it helps us bear?'
    bins:
    - Thing of beauty
    - Sorrow
    items:
    - label: Daffodils and the green world
      bin: Thing of beauty
      clue: Bright flowers among green leaves.
      why: Daffodils are one of Keats's examples of lasting beauty.
    - label: Despondence
      bin: Sorrow
      clue: A feeling of hopelessness.
      why: 'Despondence is low spirits: one of the sorrows beauty lifts.'
    - label: Clear rills
      bin: Thing of beauty
      clue: Small streams of clean water.
      why: Clear streams that cool us are beautiful things.
    - label: Gloomy days
      bin: Sorrow
      clue: Dark, heavy times.
      why: Gloomy days are the dark side; beauty removes the pall from our spirits.
    - label: Lovely tales we have heard or read
      bin: Thing of beauty
      clue: Stories can be beautiful too.
      why: Keats counts lovely tales among things of beauty, not only nature.
    - label: Unhealthy and o'er-darkened ways
      bin: Sorrow
      clue: Paths that harm us.
      why: These are the troubles we live through; beauty helps us bear them.
  lesson:
    - teach: In this extract from 'Endymion', John Keats says a thing of beauty is a joy for ever. Its loveliness increases; it will never pass into nothingness. It keeps a quiet bower for us, full of sweet dreams, health and quiet breathing.
      check:
        prompt: 'Keats says a thing of beauty will never:'
        options:
        - pass into nothingness
        - be seen again
        - give joy
        answer: pass into nothingness
        why: Its joy lasts and grows.
    - teach: Every morning we weave a 'flowery band' that binds us to the earth, despite despondence, the lack of noble natures, gloomy days and unhealthy, darkened ways. Some shape of beauty moves away the pall (dark covering) from our dark spirits.
      check:
        prompt: 'The ''flowery band'' binds us to:'
        options:
        - the earth
        - the sky
        - our homes
        answer: the earth
        why: Beauty gives us reasons to keep living despite sorrow.
    - teach: 'Examples of beauty: the sun, the moon, old and young trees giving shady boon for simple sheep, daffodils with the green world they live in, clear rills that make a cooling covert against the hot season, the mid-forest brake rich with fair musk-rose blooms, the grandeur of the dooms of the mighty dead, and lovely tales. Beauty is an endless fountain of immortal drink pouring from heaven''s brink.'
      picture:
        kind: compare
        columns:
        - title: Nature
          points:
          - sun and moon
          - trees and sheep
          - daffodils
          - clear rills
          - musk-roses
        - title: Human
          points:
          - the mighty dead
          - lovely tales
        alt: Sources of beauty in the poem, from nature and from human life.
      check:
        prompt: '''An endless fountain of immortal drink'' describes beauty as:'
        options:
        - a never-ending gift from heaven
        - a drink sold in shops
        - a river that dries up
        answer: a never-ending gift from heaven
        why: It keeps flowing and refreshing us.
  items:
  - prompt: '''A thing of beauty is a joy for ever'' is the first line of:'
    options:
    - Endymion
    - Ode to a Nightingale
    - Keeping Quiet
    - A Roadside Stand
    answer: Endymion
    difficulty: 2
    hints:
    - Long poem by Keats.
    - Greek myth.
    solution: Endymion.
    mistakes: {"Ode to a Nightingale": "e12_tb_poem", "Keeping Quiet": "e12_tb_poem", "A Roadside Stand": "e12_tb_poem"}
  - prompt: 'According to Keats, a thing of beauty''s loveliness:'
    options:
    - increases and never fades
    - lasts a day
    - is forgotten quickly
    - makes us sad
    answer: increases and never fades
    difficulty: 1
    hints:
    - Never passes into nothingness.
    - Grows.
    solution: It increases and never fades.
    mistakes: {"lasts a day": "e12_tb_grows", "is forgotten quickly": "e12_tb_grows", "makes us sad": "e12_tb_grows"}
  - prompt: Which flowers does Keats mention?
    options:
    - daffodils
    - roses only
    - lotus
    - tulips
    answer: daffodils
    difficulty: 1
    hints:
    - With the green world.
    - Yellow.
    solution: Daffodils (and musk-roses).
    mistakes: {"roses only": "e12_tb_flowers", "lotus": "e12_tb_flowers", "tulips": "e12_tb_flowers"}
  - prompt: What does beauty remove from our spirits?
    options:
    - the pall (gloom)
    - our memories
    - our hopes
    - our health
    answer: the pall (gloom)
    difficulty: 2
    hints:
    - Dark covering.
    - Sadness.
    solution: The pall of gloom.
    mistakes:
      our memories: eng12_poem_meaning
  - prompt: 'Keats compares beauty to:'
    options:
    - an endless fountain of immortal drink
    - a locked box
    - a heavy stone
    - a storm
    answer: an endless fountain of immortal drink
    difficulty: 2
    hints:
    - From heaven's brink.
    - Never runs dry.
    solution: An endless fountain of immortal drink.
    mistakes: {"a locked box": "e12_tb_fountain", "a heavy stone": "e12_tb_fountain", "a storm": "e12_tb_fountain"}
  - prompt: 'The poem''s main idea is that beauty:'
    options:
    - gives lasting joy and helps us bear sorrow
    - is useless
    - is only in cities
    - fades quickly
    answer: gives lasting joy and helps us bear sorrow
    difficulty: 1
    hints:
    - Joy forever.
    - Comfort.
    solution: It gives lasting joy and comfort.
    mistakes: {"is useless": "e12_tb_idea", "is only in cities": "e12_tb_idea", "fades quickly": "e12_tb_idea"}
  - prompt: What does the 'pall' over our dark spirits stand for?
    options:
    - sadness and gloom
    - a flower
    - a bright light
    answer: sadness and gloom
    difficulty: 2
    hints:
    - A pall is a cloth over a coffin.
    - Beauty lifts it.
    solution: 'Step 1: covering of death. Step 2: sadness and gloom.'
    mistakes:
      a flower: e12x11_img
      a bright light: e12x11_img
  - prompt: What do the trees provide for the 'simple sheep'?
    options:
    - a shady boon
    - food
    - water
    answer: a shady boon
    difficulty: 1
    hints:
    - Trees protect from the sun.
    - A boon is a blessing.
    solution: 'Step 1: shade in heat. Step 2: shady boon.'
    mistakes:
      food: e12x11_img
      water: e12x11_img
  - prompt: What do the clear rills make 'for themselves'?
    options:
    - a cooling covert against the hot season
    - a waterfall
    - a lake
    answer: a cooling covert against the hot season
    difficulty: 2
    hints:
    - Rills are small streams.
    - A covert is a shelter.
    solution: 'Step 1: shelter from heat. Step 2: cooling covert.'
    mistakes:
      a waterfall: e12x11_img
      a lake: e12x11_img
  - prompt: What is the 'mid-forest brake' rich with?
    options:
    - fair musk-rose blooms
    - tall pines
    - ripe fruit
    answer: fair musk-rose blooms
    difficulty: 2
    hints:
    - A brake is a thicket.
    - Fragrant flowers.
    solution: 'Step 1: thicket in a forest. Step 2: musk-roses.'
    mistakes:
      tall pines: e12x11_img
      ripe fruit: e12x11_img
  - prompt: 'The ''dooms of the mighty dead'' refers to:'
    options:
    - the grandeur of great people's lives and deaths
    - graveyards only
    - a war
    answer: the grandeur of great people's lives and deaths
    difficulty: 3
    hints:
    - Doom here means fate or judgement.
    - Their stories inspire us.
    solution: 'Step 1: fate of great people. Step 2: grand and inspiring.'
    mistakes:
      graveyards only: e12x11_img
      a war: e12x11_img
  - prompt: Why do we weave a 'flowery band' each morning?
    options:
    - to stay bound to the earth despite our troubles
    - to decorate our homes
    - for a festival
    answer: to stay bound to the earth despite our troubles
    difficulty: 2
    hints:
    - It is a metaphor.
    - Beauty keeps us attached to life.
    solution: 'Step 1: daily beauty. Step 2: keeps us tied to life.'
    mistakes:
      to decorate our homes: e12x11_idea
      for a festival: e12x11_idea
  - prompt: Which troubles does Keats list?
    options:
    - despondence, gloomy days and unhealthy ways
    - storms and floods
    - hunger and thirst
    answer: despondence, gloomy days and unhealthy ways
    difficulty: 2
    hints:
    - They are mostly of the spirit.
    - Despondence means hopelessness.
    solution: 'Step 1: inner gloom. Step 2: despondence, gloomy days, unhealthy ways.'
    mistakes:
      storms and floods: e12x11_idea
      hunger and thirst: e12x11_idea
  - prompt: John Keats was a poet of which movement?
    options:
    - English Romanticism
    - Modernism
    - the Elizabethan age
    answer: English Romanticism
    difficulty: 2
    hints:
    - Early 19th century.
    - Nature, beauty and imagination.
    solution: 'Step 1: like Wordsworth and Shelley. Step 2: Romantic poet.'
    mistakes:
      Modernism: e12x11_idea
      the Elizabethan age: e12x11_idea
  - prompt: '''A quiet bower'' suggests a place of:'
    options:
    - peace and rest
    - noise and crowds
    - danger
    answer: peace and rest
    difficulty: 1
    hints:
    - A bower is a shady shelter.
    - Full of sweet dreams.
    solution: 'Step 1: shaded shelter. Step 2: peace and rest.'
    mistakes:
      noise and crowds: e12x11_img
      danger: e12x11_img
