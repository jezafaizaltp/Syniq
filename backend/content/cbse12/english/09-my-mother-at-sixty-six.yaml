  - prompt: Why does the poet smile at the end?
    options:
    - to hide her fear and sadness
    - because she is happy to leave
    - because her mother told a joke
    - she isn't really smiling
    answer: to hide her fear and sadness
    difficulty: 2
    hints:
    - Familiar ache.
    - Brave face.
    solution: To hide her fear of losing her mother.
