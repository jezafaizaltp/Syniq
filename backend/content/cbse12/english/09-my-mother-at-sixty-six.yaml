# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 9.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 9
title: My Mother at Sixty-six (Kamala Das)
tips:
  e12_mo_age: "Kamala Das notices her mother looks old and pale. The poem names her age in the sixties."
  e12_mo_contrast: "Trees and children outside are young and full of life. What inside the car is the opposite of youth?"
  e12_mo_parting: "The poet hides her fear behind a short, hopeful promise to meet again, using the Malayalam word for mother."
  e12_mo_smile: "The smile is not real happiness. What feeling is the poet covering up?"
  e12_mo_where: "The poet is leaving after a visit, sitting beside her mother in the car. Where would she catch a flight in Kerala?"
  e12x09_img: 'Ask what each image stands for: the mother''s pale face (age, nearness to death) or the trees and children outside (youth and life).'
  e12x09_feel: 'Read the poet''s feelings under her words: pain and fear of loss, hidden behind a smile.'

concepts:
- code: cbse12e.f9.mother
  title: My Mother at Sixty-six (Kamala Das)
  notes: |
    The poet drives from her parents' home to Cochin airport with her mother beside her, dozing, open-mouthed, her face "ashen like
    that of a corpse". She realises with pain that her mother is old and may die soon, and fears losing her. She looks away at young
    trees sprinting and merry children spilling out of their homes (images of youth and life). At the airport, after security, she
    looks again at her mother, "wan, pale as a late winter's moon", and feels her old familiar ache, her childhood fear, but says
    only "see you soon, Amma", and smiles, hiding her feelings. Themes: ageing, fear of losing a parent, love. Single sentence,
    free verse; similes.
  explanations:
    text: On a drive to Cochin airport, Kamala Das looks at her elderly mother sleeping beside her and is struck by how old and pale she looks. Afraid of losing her, she looks away at lively trees and children. At parting she hides her fear behind a smile and says, 'See you soon, Amma'.
    visual: 'Picture a car speeding to the airport: inside, an old mother asleep with a grey, tired face; outside, trees rushing past and children running out to play; then a daughter smiling bravely at the departure gate.'
    step_by_step: 'Step 1: The drive and the mother asleep. Step 2: The simile of the corpse. Step 3: The contrast of trees and children. Step 4: The ''late winter''s moon''. Step 5: The parting smile hiding her fear.'
    real_world: Many people working away from home, like Keralites in the Gulf, feel this ache when saying goodbye to ageing parents.
  picture:
    kind: flow
    steps:
    - Driving to Cochin airport
    - Mother dozing, face like a corpse
    - Looks out at trees and children
    - At the airport, mother pale as a winter moon
    - '''See you soon, Amma'', with a smile'
    alt: 'My Mother at Sixty-six: the drive, the poet''s fear and her brave farewell.'
  activity:
    type: sort
    prompt: 'My Mother at Sixty-six: an image of age or of life?'
    bins:
    - Age and death
    - Youth and life
    items:
    - label: Face ashen like a corpse
      bin: Age and death
      clue: Ashen means grey, without colour.
      why: A grey face like a corpse is the image that makes her fear her mother's death.
    - label: Young trees sprinting
      bin: Youth and life
      clue: Seen through the car window, moving fast.
      why: 'She looks away to sprinting trees: fast, young and alive, the opposite of her mother.'
    - label: Pale as a late winter's moon
      bin: Age and death
      clue: Late winter is the end of the year.
      why: A pale moon at the year's end shows her mother fading.
    - label: Merry children spilling out of homes
      bin: Youth and life
      clue: Happy, noisy, full of energy.
      why: Playing children are life at its start, a contrast with her old mother.
    - label: Dozing, open-mouthed
      bin: Age and death
      clue: How her mother sits in the car.
      why: Asleep with her mouth open, her mother looks old and lifeless; that is what frightens the poet.
  lesson:
    - teach: In Kamala Das's poem, the poet drives to Cochin airport with her mother beside her. Seeing her mother dozing, open-mouthed, her face ashen like a corpse's, the poet realises with pain that her mother is old and may soon die. The whole poem is one long sentence in free verse.
      check:
        prompt: What does the poet suddenly realise in the car?
        options:
        - her mother is old and may not live long
        - she has missed her flight
        - her mother is angry
        answer: her mother is old and may not live long
        why: The pale, sleeping face reminds her of death.
      ways:
      - style: visual
        teach: What the poet sees in the car and what she realises.
        picture:
          kind: flow
          steps:
          - Driving to the airport, mother beside her
          - Mother dozing, mouth open
          - Face pale and ashen
          - 'Painful thought: she is old and may die'
          alt: Driving to the airport with her mother beside her, the poet sees her dozing with her mouth open, her face pale and ashen, and realises painfully that her mother is old and may die.
      - style: real_world
        teach: Many people feel a sudden pang when they notice a parent or grandparent looking tired or frail, maybe when visiting after months away. The poem captures that exact moment of realisation.
    - teach: To escape the painful thought, she looks out at young trees sprinting past and merry children spilling out of their homes. These images of youth, energy and life contrast sharply with her mother's age and stillness.
      picture:
        kind: compare
        columns:
        - title: Inside the car
          points:
          - mother dozing
          - ashen face
          - old age, decay
        - title: Outside the window
          points:
          - young trees sprinting
          - merry children
          - youth, life
        alt: Images inside and outside the car contrasted.
      check:
        prompt: Why does the poet look out of the window?
        options:
        - to push away the thought of losing her mother
        - to read the road signs
        - to count the trees
        answer: to push away the thought of losing her mother
        why: The lively scenes distract her from her pain.
      ways:
      - style: step_by_step
        teach: 'Step 1: Note what the poet looks at outside: young trees, children. Step 2: Ask what they stand for: youth, energy, life. Step 3: Compare with her mother''s stillness. Step 4: The contrast sharpens her sense of her mother''s age.'
      - style: real_world
        teach: 'When we''re worried, we often look away or distract ourselves: scrolling a phone, looking out of a window. The poet does the same, turning to the lively scene outside to escape a painful thought.'
    - teach: At the airport, after the security check, she looks at her mother again, 'wan, pale as a late winter's moon', and feels her old familiar ache, her childhood fear of losing her mother. But all she says is 'see you soon, Amma', and all she does is smile, smile and smile, hiding her feelings.
      check:
        prompt: 'The repeated ''smile and smile and smile'' shows the poet is:'
        options:
        - hiding her fear behind cheerfulness
        - very happy
        - laughing at her mother
        answer: hiding her fear behind cheerfulness
        why: She does not want her mother to see her sorrow.
      ways:
      - style: visual
        teach: What the poet feels and what she shows at the airport.
        picture:
          kind: compare
          columns:
          - title: Inside
            points:
            - Old childhood fear
            - Ache of possible loss
          - title: Outside
            points:
            - A simple goodbye
            - Smiling again and again
          alt: Inside, the poet feels her old childhood fear and the ache of possible loss. Outside, she says a simple goodbye and keeps smiling.
      - style: step_by_step
        teach: 'Step 1: Read the simile comparing her mother to a late winter''s moon. Step 2: Ask what such a moon looks like: pale, faint. Step 3: Link it to age and fading life. Step 4: The image shows her mother''s frailty without stating it.'
  items:
  - prompt: How old is the poet's mother in the poem?
    answer: '66'
    check: '66'
    difficulty: 1
    hints:
    - In the title.
    - Sixty-six.
    solution: '66.'
    mistakes: {"60": "e12_mo_age", "70": "e12_mo_age", "56": "e12_mo_age", "76": "e12_mo_age"}
  - prompt: Where is the poet driving to?
    options:
    - Cochin airport
    - Mumbai station
    - her school
    - a hospital
    answer: Cochin airport
    difficulty: 1
    hints:
    - Kerala.
    - Flight.
    solution: Cochin airport.
    mistakes: {"Mumbai station": "e12_mo_where", "her school": "e12_mo_where", "a hospital": "e12_mo_where"}
  - prompt: To what does the poet compare her mother's face?
    options:
    - a corpse
    - a flower
    - the sun
    - a child
    answer: a corpse
    difficulty: 2
    hints:
    - Ashen.
    - Simile of death.
    solution: A corpse (ashen like a corpse).
    mistakes:
      a flower: eng12_poem_meaning
  - prompt: 'The ''young trees sprinting'' and ''merry children'' contrast with:'
    options:
    - the mother's old age
    - the airport
    - the poet's car
    - the weather
    answer: the mother's old age
    difficulty: 2
    hints:
    - Youth versus age.
    - Contrast.
    solution: The mother's old age.
    mistakes: {"the airport": "e12_mo_contrast", "the poet's car": "e12_mo_contrast", "the weather": "e12_mo_contrast"}
  - prompt: What does the poet say when parting?
    options:
    - See you soon, Amma
    - Goodbye forever
    - Take care of yourself
    - Don't cry
    answer: See you soon, Amma
    difficulty: 1
    hints:
    - Last line.
    - Amma.
    solution: '''See you soon, Amma.'''
    mistakes: {"Goodbye forever": "e12_mo_parting", "Take care of yourself": "e12_mo_parting", "Don't cry": "e12_mo_parting"}
  - prompt: Why does the poet smile at the end?
    options:
    - to hide her fear and sadness
    - because she is happy to leave
    - because her mother told a joke
    - she isn't really smiling
    answer: to hide her fear and sadness
    difficulty: 2
    hints:
    - Familiar ache.
    - Brave face.
    solution: To hide her fear of losing her mother.
    mistakes: {"because she is happy to leave": "e12_mo_smile", "because her mother told a joke": "e12_mo_smile", "she isn't really smiling": "e12_mo_smile"}
  - prompt: '''Pale as a late winter''s moon'' is a:'
    options:
    - simile
    - metaphor
    - personification
    answer: simile
    difficulty: 1
    hints:
    - Look for the comparing word.
    - It uses 'as'.
    solution: 'Step 1: comparison with ''as''. Step 2: simile.'
    mistakes:
      metaphor: e12x09_img
      personification: e12x09_img
  - prompt: Why is the moon described as a 'late winter's' moon?
    options:
    - it is dim and pale, like the ageing mother
    - it is very bright
    - it is full and round
    answer: it is dim and pale, like the ageing mother
    difficulty: 2
    hints:
    - Winter suggests the end of a cycle.
    - Late winter is the end of the end.
    solution: 'Step 1: winter = old age. Step 2: hazy, lifeless moon = the mother.'
    mistakes:
      it is very bright: e12x09_img
      it is full and round: e12x09_img
  - prompt: '''Young trees sprinting'' is an example of:'
    options:
    - personification
    - simile
    - alliteration
    answer: personification
    difficulty: 2
    hints:
    - Trees cannot really run.
    - A human action is given to a thing.
    solution: 'Step 1: trees given a human action. Step 2: personification.'
    mistakes:
      simile: e12x09_img
      alliteration: e12x09_img
  - prompt: What is the 'old familiar ache' the poet feels?
    options:
    - her childhood fear of losing her mother
    - a headache from travel
    - pain in her leg
    answer: her childhood fear of losing her mother
    difficulty: 2
    hints:
    - It is an emotional pain.
    - She has felt it since she was young.
    solution: 'Step 1: familiar since childhood. Step 2: fear of separation.'
    mistakes:
      a headache from travel: e12x09_feel
      pain in her leg: e12x09_feel
  - prompt: Where were the poet and her mother travelling from?
    options:
    - her parents' home
    - a hospital
    - a school
    answer: her parents' home
    difficulty: 1
    hints:
    - It was the start of the drive.
    - She had been visiting family.
    solution: 'Step 1: drove to the airport. Step 2: from her parents'' home.'
    mistakes:
      a hospital: e12x09_feel
      a school: e12x09_feel
  - prompt: 'The poem is written as:'
    options:
    - a single long sentence in free verse
    - four rhyming stanzas
    - a sonnet
    answer: a single long sentence in free verse
    difficulty: 2
    hints:
    - Look at the punctuation and rhyme.
    - There is no regular rhyme.
    solution: 'Step 1: no rhyme scheme. Step 2: one sentence.'
    mistakes:
      four rhyming stanzas: e12x09_img
      a sonnet: e12x09_img
  - prompt: What feeling does the poet hide in 'see you soon, Amma'?
    options:
    - fear that she may not see her mother again
    - anger
    - boredom
    answer: fear that she may not see her mother again
    difficulty: 2
    hints:
    - Her words are cheerful.
    - Her thoughts are not.
    solution: 'Step 1: hopeful words. Step 2: hiding fear of loss.'
    mistakes:
      anger: e12x09_feel
      boredom: e12x09_feel
  - prompt: '''Merry children spilling out of their homes'' suggests:'
    options:
    - energy and the joy of youth
    - children running from danger
    - a crowded city
    answer: energy and the joy of youth
    difficulty: 1
    hints:
    - Spilling suggests overflowing.
    - Contrast with the mother.
    solution: 'Step 1: lively images. Step 2: youth and joy.'
    mistakes:
      children running from danger: e12x09_img
      a crowded city: e12x09_img
  - prompt: 'The main theme of the poem is:'
    options:
    - ageing and the fear of losing a parent
    - the beauty of airports
    - the joy of travel
    answer: ageing and the fear of losing a parent
    difficulty: 1
    hints:
    - Think of what the poet keeps noticing.
    - And what she fears.
    solution: 'Step 1: mother''s age. Step 2: fear of separation.'
    mistakes:
      the beauty of airports: e12x09_feel
      the joy of travel: e12x09_feel
  - prompt: 'Assertion (A): The poet smiles repeatedly while saying goodbye to her mother.

      Reason (R): She hides her fear and sadness so that her mother is not upset.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: The repeated smiling masks her pain and keeps the parting cheerful. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: The poet looks out of the car at young trees and happy children. Why does the poem include this image?'
    options:
    - It contrasts youth and life with her mother's age
    - It describes the road to the airport
    - It shows the poet loved trees
    answer: It contrasts youth and life with her mother's age
    hints:
    - What do the trees and children have in common?
    - What is the mother like at that moment?
    solution: Lively trees and children stand for youth and energy, highlighting the mother's ageing.
    mistakes:
      It describes the road to the airport: e12x09_img
      It shows the poet loved trees: e12x09_img
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student says the poet''s smile shows she felt happy. How would you respond?'
    options:
    - The smile hides her fear and pain from her mother
    - She was glad to leave
    - She smiled at the airport staff
    answer: The smile hides her fear and pain from her mother
    hints:
    - What did she feel just before?
    - Why might she hide it?
    solution: She feels her old fear of losing her mother, but smiles to keep the goodbye cheerful.
    mistakes:
      She was glad to leave: e12x09_feel
      She smiled at the airport staff: e12x09_feel
    exam: competency
    difficulty: 2
