    solution: A corpse (ashen like a corpse).
    mistakes:
      a flower: eng12_poem_meaning
  - prompt: 'The ''young trees sprinting'' and ''merry children'' contrast with:'
    options:
    - the mother's old age
    - the airport
    - the poet's car
    - the weather
    answer: the mother's old age
    difficulty: 2
    hints:
    - Youth versus age.
    - Contrast.
    solution: The mother's old age.
  - prompt: What does the poet say when parting?
    options:
    - See you soon, Amma
    - Goodbye forever
    - Take care of yourself
    - Don't cry
    answer: See you soon, Amma
    difficulty: 1
    hints:
