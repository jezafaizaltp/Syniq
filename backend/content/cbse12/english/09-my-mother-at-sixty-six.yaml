subject: cbse12-eng
chapter: 9
title: My Mother at Sixty-six (Kamala Das)
concepts:
- code: cbse12e.f9.mother
  title: My Mother at Sixty-six (Kamala Das)
  notes: |
    The poet drives from her parents' home to Cochin airport with her mother beside her, dozing, open-mouthed, her face "ashen like
    that of a corpse". She realises with pain that her mother is old and may die soon, and fears losing her. She looks away at young
    trees sprinting and merry children spilling out of their homes (images of youth and life). At the airport, after security, she
    looks again at her mother, "wan, pale as a late winter's moon", and feels her old familiar ache, her childhood fear, but says
    only "see you soon, Amma", and smiles, hiding her feelings. Themes: ageing, fear of losing a parent, love. Single sentence,
    free verse; similes.
  explanations:
    text: On a drive to Cochin airport, Kamala Das looks at her elderly mother sleeping beside her and is struck by how old and pale she looks. Afraid of losing her, she looks away at lively trees and children. At parting she hides her fear behind a smile and says, 'See you soon, Amma'.
    visual: 'Picture a car speeding to the airport: inside, an old mother asleep with a grey, tired face; outside, trees rushing past and children running out to play; then a daughter smiling bravely at the departure gate.'
    step_by_step: 'Step 1: The drive and the mother asleep. Step 2: The simile of the corpse. Step 3: The contrast of trees and children. Step 4: The ''late winter''s moon''. Step 5: The parting smile hiding her fear.'
    real_world: Many people working away from home, like Keralites in the Gulf, feel this ache when saying goodbye to ageing parents.
  picture:
    kind: flow
    steps:
    - Driving to Cochin airport
    - Mother dozing, face like a corpse
    - Looks out at trees and children
    - At the airport, mother pale as a winter moon
    - '''See you soon, Amma'', with a smile'
    alt: 'My Mother at Sixty-six: the drive, the poet''s fear and her brave farewell.'
  activity:
    type: sort
    prompt: 'My Mother at Sixty-six: an image of age or of life?'
    bins:
    - Age and death
    - Youth and life
    items:
    - label: Face ashen like a corpse
      bin: Age and death
      clue: Ashen means grey, without colour.
      why: A grey face like a corpse is the image that makes her fear her mother's death.
    - label: Young trees sprinting
      bin: Youth and life
      clue: Seen through the car window, moving fast.
      why: 'She looks away to sprinting trees: fast, young and alive, the opposite of her mother.'
    - label: Pale as a late winter's moon
      bin: Age and death
      clue: Late winter is the end of the year.
      why: A pale moon at the year's end shows her mother fading.
    - label: Merry children spilling out of homes
      bin: Youth and life
      clue: Happy, noisy, full of energy.
      why: Playing children are life at its start, a contrast with her old mother.
    - label: Dozing, open-mouthed
      bin: Age and death
      clue: How her mother sits in the car.
      why: Asleep with her mouth open, her mother looks old and lifeless; that is what frightens the poet.
  items:
