title: The Rattrap (Selma Lagerlöf)
concepts:
- code: cbse12e.f4.rattrap
  title: The Rattrap (Selma Lagerlöf)
  notes: |
    Set in Sweden. A poor peddler sells small rattraps and begs or steals. He thinks the world is a rattrap: it offers riches,
    food and shelter as bait, and once you touch them you are caught. A lonely old crofter shelters him and shows him thirty kronor
    earned from his cow's milk; the peddler steals the money, then, lost in the forest, feels trapped himself. At Ramsjö ironworks
    the ironmaster mistakes him for an old regimental comrade, Captain von Stahle, and invites him home for Christmas. The peddler
    refuses at first; the ironmaster's daughter, Edla Willmansson, persuades him. Next day the ironmaster realises the mistake, but
    Edla insists he stay for Christmas because of her kindness. He leaves a small rattrap as a gift with the thirty kronor for the
    crofter and a letter signing himself Captain von Ståhle, because she treated him like one. Theme: kindness can redeem people; the
    world as a trap.
  explanations:
    text: A poor peddler believes the whole world is a rattrap that baits people with riches. He steals from a kind old man, then is mistaken for a captain by an ironmaster. The ironmaster's daughter, Edla, treats him with such kindness that he returns the stolen money and escapes his own 'trap'.
    visual: Picture a ragged man in a dark Swedish forest, feeling like a rat in a trap; then a warm Christmas table where a young woman treats him like an honoured guest; then a small rattrap left behind with stolen money and a thank-you letter.
    step_by_step: 'Step 1: The peddler and his rattrap idea. Step 2: Stealing the crofter''s thirty kronor. Step 3: Lost in the forest. Step 4: Mistaken identity at Ramsjö. Step 5: Edla''s kindness and his change of heart.'
    real_world: Kindness shown to someone who expects only suspicion can change them, as Edla's trust changes the peddler.
