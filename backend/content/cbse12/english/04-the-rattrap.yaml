# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 4.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 4
title: The Rattrap (Selma Lagerlöf)
tips:
  e12_rt_country: "Kronor are the money and Selma Lagerlöf is the writer. Which Scandinavian country do both belong to?"
  e12_rt_gift: "The peddler wanted to show he was changed by kindness. What would he return, and what small object would he leave as a joke about himself?"
  e12_rt_kronor: "The crofter proudly showed the peddler the money he got for his cow's milk. Recall how many notes and their value."
  e12_rt_persuade: "Someone treated the peddler kindly even after learning who he was. Who was it in the ironmaster's family?"
  e12x04_text: 'Go back to the part of the story the question names: the crofter''s cottage, the forest, the forge, or the manor house at Christmas.'
  e12x04_theme: Ask what the rattrap stands for, and what finally helps the peddler escape it.

concepts:
- code: cbse12e.f4.rattrap
  title: The Rattrap (Selma Lagerlöf)
  notes: |
    Set in Sweden. A poor peddler sells small rattraps and begs or steals. He thinks the world is a rattrap: it offers riches,
    food and shelter as bait, and once you touch them you are caught. A lonely old crofter shelters him and shows him thirty kronor
    earned from his cow's milk; the peddler steals the money, then, lost in the forest, feels trapped himself. At Ramsjö ironworks
    the ironmaster mistakes him for an old regimental comrade, Captain von Stahle, and invites him home for Christmas. The peddler
    refuses at first; the ironmaster's daughter, Edla Willmansson, persuades him. Next day the ironmaster realises the mistake, but
    Edla insists he stay for Christmas because of her kindness. He leaves a small rattrap as a gift with the thirty kronor for the
    crofter and a letter signing himself Captain von Ståhle, because she treated him like one. Theme: kindness can redeem people; the
    world as a trap.
  explanations:
    text: A poor peddler believes the whole world is a rattrap that baits people with riches. He steals from a kind old man, then is mistaken for a captain by an ironmaster. The ironmaster's daughter, Edla, treats him with such kindness that he returns the stolen money and escapes his own 'trap'.
    visual: Picture a ragged man in a dark Swedish forest, feeling like a rat in a trap; then a warm Christmas table where a young woman treats him like an honoured guest; then a small rattrap left behind with stolen money and a thank-you letter.
    step_by_step: 'Step 1: The peddler and his rattrap idea. Step 2: Stealing the crofter''s thirty kronor. Step 3: Lost in the forest. Step 4: Mistaken identity at Ramsjö. Step 5: Edla''s kindness and his change of heart.'
    real_world: Kindness shown to someone who expects only suspicion can change them, as Edla's trust changes the peddler.
  picture:
    kind: flow
    steps:
    - Peddler sees the world as a rattrap
    - Steals 30 kronor from the crofter
    - Mistaken for Captain von Stahle
    - Edla treats him kindly
    - Returns the money with a rattrap gift
    alt: 'The Rattrap: from theft to redemption through kindness.'
  activity:
    type: order
    prompt: 'The Rattrap: put the peddler''s story in order.'
    steps:
    - The crofter shelters him
    - He steals the thirty kronor
    - He gets lost in the forest
    - The ironmaster mistakes him for a comrade
    - Edla invites him for Christmas
    - He leaves a rattrap and the money
    reasons:
      He steals the thirty kronor: The crofter showed him the money.
      He gets lost in the forest: Avoiding the road after the theft.
      The ironmaster mistakes him for a comrade: At Ramsjö ironworks.
      Edla invites him for Christmas: Even after the mistake is found.
      He leaves a rattrap and the money: Her kindness changes him.
  lesson:
    - teach: 'A poor peddler in Sweden sells little rattraps of wire and begs or steals to survive. One day an idea amuses him: the whole world is a big rattrap. It offers riches, joys, shelter and food as bait, and as soon as a person touches the bait, the trap closes on them.'
      check:
        prompt: 'In the peddler''s idea, the ''bait'' in the world''s rattrap is:'
        options:
        - riches, joys, shelter and food
        - only cheese
        - hard work
        answer: riches, joys, shelter and food
        why: These tempt people, who are then trapped.
      ways:
      - style: visual
        teach: 'The peddler''s idea: the world as a rattrap.'
        picture:
          kind: compare
          columns:
          - title: The bait
            points:
            - Riches and joys
            - Shelter and food
            - Warmth and clothing
          - title: The trap
            points:
            - Touch the bait
            - The trap closes
            - Everything is lost
          alt: In the peddler's idea, the world offers bait such as riches, joys, shelter, food, warmth and clothing. Anyone who touches the bait is caught as the trap closes, and everything is lost.
      - style: step_by_step
        teach: 'Step 1: Note how poor and lonely the peddler is. Step 2: See why he enjoys imagining the whole world as a trap. Step 3: It lets him feel others are as trapped as he is. Step 4: This bitter idea will be tested by the kindness he meets.'
    - teach: A lonely old crofter welcomes him, gives him supper and tobacco, plays cards, and proudly shows him thirty kronor from selling his cow's milk. Next morning the peddler comes back, breaks the window and steals the money. Avoiding the main road, he gets lost in the forest and realises he has been caught by the bait himself.
      picture:
        kind: flow
        steps:
        - crofter shelters him
        - shows 30 kronor
        - peddler steals it
        - lost in the forest
        - feels trapped
        alt: How the peddler falls into his own 'rattrap'.
      check:
        prompt: Why did the peddler feel trapped in the forest?
        options:
        - he had taken the bait (the money) and could not find his way out
        - wolves surrounded him
        - the crofter chased him
        answer: he had taken the bait (the money) and could not find his way out
        why: His own idea of the rattrap came true for him.
      ways:
      - style: real_world
        teach: 'Sometimes the thing that tempts us most traps us: a stolen exam paper, a shortcut that hurts others. The peddler steals the crofter''s money and then finds himself lost and hunted: caught by his own bait.'
      - style: step_by_step
        teach: 'Step 1: The crofter trusts him and shows his savings. Step 2: The peddler steals them. Step 3: Afraid, he avoids the road and loses his way. Step 4: He realises he has walked into the very trap he described.'
    - teach: At the Ramsjö ironworks, the ironmaster mistakes him for an old regimental comrade, Captain von Ståhle, and invites him home. His daughter Edla Willmansson persuades him to come. When the truth comes out, Edla still lets him stay for Christmas out of kindness. He leaves the stolen money for the crofter and a small rattrap for her, with a letter signed 'Captain von Ståhle', because she treated him like a captain.
      check:
        prompt: What finally helps the peddler escape the 'rattrap'?
        options:
        - Edla's kindness and trust
        - the ironmaster's anger
        - the police
        answer: Edla's kindness and trust
        why: Being treated with dignity wakes his goodness.
      ways:
      - style: visual
        teach: How Edla's kindness changes the peddler, from exposure to gift.
        picture:
          kind: flow
          steps:
          - Treated as a captain; then exposed
          - Edla still invites him for Christmas
          - He is treated as a guest, not a thief
          - He returns the money; leaves a rattrap gift
          alt: He is treated as a captain and then exposed. Edla still invites him for Christmas, treating him as a guest, not a thief. He returns the stolen money and leaves her a small rattrap as a gift.
      - style: real_world
        teach: 'Teachers and coaches often see what the story suggests: when someone is treated as worthy of trust, they often try to live up to it. Edla''s respect lets the peddler see himself as more than a thief.'
  items:
  - prompt: How many kronor did the peddler steal from the crofter?
    answer: '30'
    check: '30'
    difficulty: 1
    hints:
    - From selling milk.
    - Thirty.
    solution: "The crofter proudly showed the peddler the thirty kronor earned from his cow's milk, and the peddler later stole them."
    mistakes: {"10": "e12_rt_kronor", "20": "e12_rt_kronor", "50": "e12_rt_kronor", "100": "e12_rt_kronor"}
  - prompt: 'The ironmaster mistook the peddler for:'
    options:
    - an old army comrade, Captain von Stahle
    - his long-lost son
    - a famous singer
    - a thief he knew
    answer: an old army comrade, Captain von Stahle
    difficulty: 1
    hints:
    - Regiment.
    - Captain.
    solution: Captain von Stahle, an old comrade.
    mistakes:
      his long-lost son: eng12_read_again
  - prompt: Who persuaded the peddler to stay for Christmas?
    options:
    - Edla Willmansson
    - the crofter
    - the blacksmith
    - the ironmaster's wife
    answer: Edla Willmansson
    difficulty: 1
    hints:
    - The ironmaster's daughter.
    - Kind.
    solution: "Edla Willmansson, the ironmaster's daughter, persuaded him to stay even after learning he was not her father's old comrade."
    mistakes: {"the crofter": "e12_rt_persuade", "the blacksmith": "e12_rt_persuade", "the ironmaster's wife": "e12_rt_persuade"}
  - prompt: In which country is the story set?
    options:
    - Sweden
    - Germany
    - England
    - Russia
    answer: Sweden
    difficulty: 2
    hints:
    - Selma Lagerlöf.
    - Kronor.
    solution: "The story is by the Swedish writer Selma Lagerlöf and takes place among the ironworks of Sweden."
    mistakes: {"Germany": "e12_rt_country", "England": "e12_rt_country", "Russia": "e12_rt_country"}
  - prompt: What did the peddler leave for Edla?
    options:
    - a small rattrap, the stolen money and a letter
    - a diamond ring
    - nothing
    - his coat
    answer: a small rattrap, the stolen money and a letter
    difficulty: 2
    hints:
    - Christmas present.
    - Return of money.
    solution: A rattrap, the thirty kronor and a letter.
    mistakes: {"a diamond ring": "e12_rt_gift", "nothing": "e12_rt_gift", "his coat": "e12_rt_gift"}
  - prompt: What changes the peddler?
    options:
    - Edla's kindness and trust
    - fear of the police
    - a large reward
    - the crofter's anger
    answer: Edla's kindness and trust
    difficulty: 2
    hints:
    - Treated like a captain.
    - Redemption.
    solution: "Edla treated the peddler with kindness and trust, so he returned the stolen money and signed himself 'Captain'."
    mistakes:
      fear of the police: eng12_theme
  - prompt: Where did the crofter keep the thirty kronor?
    options:
    - in a leather pouch hanging on a nail by the window
    - under his bed
    - in a bank
    answer: in a leather pouch hanging on a nail by the window
    difficulty: 2
    hints:
    - He showed the peddler where.
    - The peddler later broke the window pane to get it.
    solution: 'Step 1: the crofter took it down to show him. Step 2: pouch on a nail in the window frame.'
    mistakes:
      under his bed: e12x04_text
      in a bank: e12x04_text
  - prompt: How did the crofter earn his money?
    options:
    - by selling his cow's milk to the creamery
    - by selling rattraps
    - by working at the forge
    answer: by selling his cow's milk to the creamery
    difficulty: 1
    hints:
    - He was too old to work the land.
    - He had one animal left.
    solution: 'Step 1: his cow gave milk. Step 2: sold at the creamery.'
    mistakes:
      by selling rattraps: e12x04_text
      by working at the forge: e12x04_text
  - prompt: Why did the peddler refuse the ironmaster's first invitation?
    options:
    - he feared being caught with the stolen money
    - he disliked Christmas
    - he had another invitation
    answer: he feared being caught with the stolen money
    difficulty: 2
    hints:
    - Going to the manor felt like walking into a lion's den.
    - What was in his pocket?
    solution: 'Step 1: a guilty conscience. Step 2: fear of discovery.'
    mistakes:
      he disliked Christmas: e12x04_theme
      he had another invitation: e12x04_theme
  - prompt: Why did the ironmaster think the peddler was his old comrade?
    options:
    - he only saw him in the dim light of the forge
    - the peddler said so at once
    - they had met yesterday
    answer: he only saw him in the dim light of the forge
    difficulty: 2
    hints:
    - The forge was dark except for the furnace glow.
    - The peddler did not correct him.
    solution: 'Step 1: poor light and ragged look. Step 2: mistaken identity.'
    mistakes:
      the peddler said so at once: e12x04_text
      they had met yesterday: e12x04_text
  - prompt: When did the ironmaster realise his mistake?
    options:
    - the next morning, when he saw the man washed and dressed in daylight
    - at the forge
    - at church
    answer: the next morning, when he saw the man washed and dressed in daylight
    difficulty: 2
    hints:
    - Clean clothes and good light showed his face.
    - It was at breakfast time.
    solution: 'Step 1: daylight. Step 2: he saw it was not his comrade.'
    mistakes:
      at the forge: e12x04_text
      at church: e12x04_text
  - prompt: What did the family learn at church on Christmas morning?
    options:
    - that an old crofter had been robbed by a rattrap peddler
    - that the captain had arrived
    - that the forge had burnt down
    answer: that an old crofter had been robbed by a rattrap peddler
    difficulty: 2
    hints:
    - News spread in the village.
    - It made the ironmaster angry.
    solution: 'Step 1: the theft was reported. Step 2: they guessed who did it.'
    mistakes:
      that the captain had arrived: e12x04_text
      that the forge had burnt down: e12x04_text
  - prompt: 'In his letter, the peddler calls himself a rat who would have been caught had he not been:'
    options:
    - raised to captain
    - given money
    - sent to jail
    answer: raised to captain
    difficulty: 3
    hints:
    - Think about how Edla treated him.
    - It is the name he signs with.
    solution: 'Step 1: treated with respect. Step 2: ''raised to captain'' saved him.'
    mistakes:
      given money: e12x04_theme
      sent to jail: e12x04_theme
  - prompt: How does the crofter treat the peddler at first?
    options:
    - warmly, as a welcome companion
    - with suspicion
    - as a servant
    answer: warmly, as a welcome companion
    difficulty: 1
    hints:
    - He was lonely.
    - He shared food, tobacco and cards.
    solution: 'Step 1: lonely old man. Step 2: glad of company.'
    mistakes:
      with suspicion: e12x04_text
      as a servant: e12x04_text
  - prompt: 'The story''s message is best put as:'
    options:
    - kindness can bring out the good in a person
    - everyone is a thief
    - money brings happiness
    answer: kindness can bring out the good in a person
    difficulty: 1
    hints:
    - Look at the change in the peddler.
    - What caused it?
    solution: 'Step 1: Edla''s trust. Step 2: the peddler returns the money.'
    mistakes:
      everyone is a thief: e12x04_theme
      money brings happiness: e12x04_theme
  - prompt: 'Assertion (A): The peddler signs his letter as Captain von Ståhle.

      Reason (R): Edla had treated him like a captain, and he wanted to be worthy of that respect.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Her kindness awakened his better self; signing as a captain shows he accepts the dignity she gave him. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: When the ironmaster learns the truth, he wants to send the peddler away. Edla still insists he stay for Christmas. Why?'
    options:
    - She wants him to enjoy one day of peace, as promised
    - She hopes he will repay a debt
    - She thinks he is still her father's friend
    answer: She wants him to enjoy one day of peace, as promised
    hints:
    - What had they invited him for?
    - What kind of person is Edla?
    solution: 'Edla is compassionate: they had promised him Christmas cheer, and she will not take it back because he is poor.'
    mistakes:
      She hopes he will repay a debt: e12x04_text
      She thinks he is still her father's friend: e12x04_text
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your class discusses what finally frees the peddler from the ''rattrap''. Which answer fits the story best?'
    options:
    - Kindness and trust shown to him without conditions
    - Fear of the police
    - The money he stole
    answer: Kindness and trust shown to him without conditions
    hints:
    - What did the money do to him?
    - Who treated him as a person of worth?
    solution: Edla's kindness, given even after she knew the truth, awakened his goodness so he returned the money.
    mistakes:
      Fear of the police: e12x04_theme
      The money he stole: e12x04_theme
    exam: competency
    difficulty: 2
