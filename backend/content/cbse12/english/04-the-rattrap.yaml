    prompt: 'The Rattrap: put the peddler''s story in order.'
    steps:
    - The crofter shelters him
    - He steals the thirty kronor
    - He gets lost in the forest
    - The ironmaster mistakes him for a comrade
    - Edla invites him for Christmas
    - He leaves a rattrap and the money
    reasons:
      He steals the thirty kronor: The crofter showed him the money.
      He gets lost in the forest: Avoiding the road after the theft.
      The ironmaster mistakes him for a comrade: At Ramsjö ironworks.
      Edla invites him for Christmas: Even after the mistake is found.
      He leaves a rattrap and the money: Her kindness changes him.
