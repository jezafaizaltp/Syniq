# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 2.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 2
title: Lost Spring (Anees Jung)
concepts:
- code: cbse12e.f2.lostspring
  title: Lost Spring (Anees Jung)
  notes: |
    Subtitle: "Stories of Stolen Childhood". Saheb-e-Alam, a ragpicker in Seemapuri on the edge of Delhi, came from Dhaka,
    Bangladesh, after storms swept away their fields; for children like him, garbage is gold. He goes barefoot ("a tradition").
    The author offers to start a school; later he works at a tea stall for 800 rupees and a meal, losing his freedom (the steel
    canister is heavier than his plastic bag). Mukesh lives in Firozabad, the centre of India's glass-bangle industry, where
    families have made bangles for generations in dark, hot workshops, and children lose their eyesight; a vicious circle of the
    sahukar, middlemen, police and politicians. Mukesh dreams of becoming a motor mechanic. Themes: child labour, poverty,
    exploitation, dreams.
  explanations:
    text: Anees Jung tells the stories of two poor children. Saheb, a ragpicker in Delhi whose family fled floods in Bangladesh, searches garbage for anything useful. Mukesh, in Firozabad's bangle-making industry, is trapped in a cycle of poverty but dares to dream of becoming a motor mechanic.
    visual: Picture barefoot children picking through rubbish heaps at dawn in Seemapuri; then a dark, hot workshop in Firozabad where families bend over flames, making glass bangles.
    step_by_step: 'Step 1: Saheb''s background and life in Seemapuri. Step 2: Saheb''s tea-stall job and lost freedom. Step 3: Mukesh and the bangle industry. Step 4: The vicious circle that traps families. Step 5: Mukesh''s dream.'
    real_world: India's laws ban hazardous child labour, yet children still work in many industries; schooling is the way out the essay points to.
  picture:
    kind: compare
    columns:
    - title: Child
      points:
      - Saheb
      - Mukesh
    - title: Place and work
      points:
      - 'Seemapuri, Delhi: ragpicking, then a tea stall'
      - 'Firozabad: bangle-making family'
    - title: Dream
      points:
      - going to school
      - becoming a motor mechanic
    alt: 'Saheb and Mukesh compared: where they live, their work and their dreams.'
  items:
  - prompt: Where did Saheb's family come from?
    options:
    - Dhaka, Bangladesh
    - Mumbai
    - Kerala
    - Nepal
    answer: Dhaka, Bangladesh
    difficulty: 1
    hints:
    - Storms swept away their fields.
    - Across the border.
    solution: Dhaka, Bangladesh.
  - prompt: 'Firozabad is famous for making:'
    options:
    - glass bangles
    - carpets
    - silk
    - toys
    answer: glass bangles
    difficulty: 1
    hints:
    - Bangle industry.
    - Glass.
    solution: Glass bangles.
  - prompt: How much did Saheb earn per month at the tea stall (rupees)?
    answer: '800'
    check: '800'
    difficulty: 2
    hints:
    - Plus meals.
    - Eight hundred.
    solution: ₹800.
  - prompt: What does Mukesh dream of becoming?
    options:
    - a motor mechanic
    - a doctor
    - a teacher
    - a bangle-maker
    answer: a motor mechanic
    difficulty: 1
    hints:
    - Cars.
    - Garage.
    solution: A motor mechanic.
    mistakes:
      a bangle-maker: eng12_read_again
  - prompt: Why did Saheb lose his freedom when he got a job?
    options:
    - He was no longer his own master
    - He was put in jail
    - He moved to another country
    - He became ill
    answer: He was no longer his own master
    difficulty: 2
    hints:
    - The canister is heavier than the bag.
    - Works for someone else.
    solution: He now worked for someone else and lost his carefree life.
  - prompt: 'The ''vicious circle'' in Firozabad includes:'
    options:
    - the sahukars, middlemen, police and politicians
    - only the children
    - the weather
    - foreign companies only
    answer: the sahukars, middlemen, police and politicians
    difficulty: 2
    hints:
    - They keep families poor.
    - Trap.
    solution: Moneylenders, middlemen, police and politicians.
    mistakes:
      only the children: eng12_theme
