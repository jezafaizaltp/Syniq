# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 2.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 2
title: Lost Spring (Anees Jung)
tips:
  e12_ls_firozabad: "Mukesh's family work in hot furnaces with glass. Which glass item, worn on the wrist, is Firozabad known for?"
  e12_ls_freedom: "Compare Saheb carrying a steel canister with Saheb carrying his own plastic bag. Whose wishes does he follow now?"
  e12_ls_home: "Saheb's family left their homeland after storms swept away their fields. Which neighbouring country's capital does the author name?"
  e12_ls_wage: "The tea-stall job pays a monthly wage plus meals. Recall the figure in the chapter; it is in hundreds, not thousands."
  e12x02_who: 'Check which child the question is about: Saheb the ragpicker in Seemapuri, or Mukesh the bangle-maker''s son in Firozabad.'
  e12x02_theme: 'Ask what keeps these children poor: poverty, tradition, and the people who profit from them.'

concepts:
- code: cbse12e.f2.lostspring
  title: Lost Spring (Anees Jung)
  notes: |
    Subtitle: "Stories of Stolen Childhood". Saheb-e-Alam, a ragpicker in Seemapuri on the edge of Delhi, came from Dhaka,
    Bangladesh, after storms swept away their fields; for children like him, garbage is gold. He goes barefoot ("a tradition").
    The author offers to start a school; later he works at a tea stall for 800 rupees and a meal, losing his freedom (the steel
    canister is heavier than his plastic bag). Mukesh lives in Firozabad, the centre of India's glass-bangle industry, where
    families have made bangles for generations in dark, hot workshops, and children lose their eyesight; a vicious circle of the
    sahukar, middlemen, police and politicians. Mukesh dreams of becoming a motor mechanic. Themes: child labour, poverty,
    exploitation, dreams.
  explanations:
    text: Anees Jung tells the stories of two poor children. Saheb, a ragpicker in Delhi whose family fled floods in Bangladesh, searches garbage for anything useful. Mukesh, in Firozabad's bangle-making industry, is trapped in a cycle of poverty but dares to dream of becoming a motor mechanic.
    visual: Picture barefoot children picking through rubbish heaps at dawn in Seemapuri; then a dark, hot workshop in Firozabad where families bend over flames, making glass bangles.
    step_by_step: 'Step 1: Saheb''s background and life in Seemapuri. Step 2: Saheb''s tea-stall job and lost freedom. Step 3: Mukesh and the bangle industry. Step 4: The vicious circle that traps families. Step 5: Mukesh''s dream.'
    real_world: India's laws ban hazardous child labour, yet children still work in many industries; schooling is the way out the essay points to.
  picture:
    kind: compare
    columns:
    - title: Child
      points:
      - Saheb
      - Mukesh
    - title: Place and work
      points:
      - 'Seemapuri, Delhi: ragpicking, then a tea stall'
      - 'Firozabad: bangle-making family'
    - title: Dream
      points:
      - going to school
      - becoming a motor mechanic
    alt: 'Saheb and Mukesh compared: where they live, their work and their dreams.'
  activity:
    type: sort
    prompt: 'Lost Spring: Saheb or Mukesh?'
    bins:
    - Saheb
    - Mukesh
    items:
    - label: A ragpicker in Seemapuri
      bin: Saheb
      clue: Delhi.
      why: Saheb picks rags in Seemapuri.
    - label: Wants to be a motor mechanic
      bin: Mukesh
      clue: A dream.
      why: Mukesh dreams of being a mechanic.
    - label: Family came from Dhaka
      bin: Saheb
      clue: Storms swept fields away.
      why: Saheb's family left Bangladesh.
    - label: Lives in Firozabad, the bangle town
      bin: Mukesh
      clue: Glass.
      why: Mukesh's family makes bangles in Firozabad.
    - label: Works at a tea stall for 800 rupees
      bin: Saheb
      clue: Steel canister.
      why: Saheb loses his freedom at the tea stall.
  lesson:
    - teach: '''Lost Spring: Stories of Stolen Childhood'' by Anees Jung describes children whose childhood is taken by poverty. Saheb-e-Alam scrounges in the garbage of Seemapuri, on the edge of Delhi. His family came from Dhaka, Bangladesh, after storms swept away their fields and homes. For the children of Seemapuri, garbage is gold: it means daily bread and, sometimes, a surprise coin.'
      check:
        prompt: Why did Saheb's family leave Dhaka?
        options:
        - storms swept away their fields and homes
        - they wanted to see Delhi
        - they won land in Delhi
        answer: storms swept away their fields and homes
        why: Poverty and disaster forced them to migrate.
      ways:
      - style: visual
        teach: What 'garbage' means to adults and to children in Seemapuri.
        picture:
          kind: compare
          columns:
          - title: For adults
            points:
            - A means of survival
            - Daily bread
          - title: For children
            points:
            - Wrapped in wonder
            - A chance of a coin or treasure
          alt: For the adults of Seemapuri, garbage is a means of survival and daily bread. For the children it is wrapped in wonder, with the chance of finding a coin or some small treasure.
      - style: step_by_step
        teach: 'Step 1: Note where Saheb''s family came from and why they left. Step 2: Note where they live now. Step 3: Note what they do to earn. Step 4: Together these show how poverty and disaster push families into ragpicking.'
    - teach: 'Saheb goes barefoot; the children say it is ''a tradition'', but the author sees it as perpetual poverty. When the author half-jokingly offers to start a school, he is eager. Later he works at a tea stall for 800 rupees and all his meals, but he has lost his carefree look: the steel canister he carries is heavier than the plastic bag he once swung over his shoulder, because now he is not his own master.'
      picture:
        kind: compare
        columns:
        - title: Ragpicking
          points:
          - plastic bag
          - free to roam
          - his own master
        - title: Tea stall job
          points:
          - steel canister
          - 800 rupees and meals
          - works for someone else
        alt: Saheb's life before and after his tea stall job.
      check:
        prompt: Why does the steel canister seem heavier than the plastic bag?
        options:
        - Saheb has lost his freedom
        - it is full of water
        - he is ill
        answer: Saheb has lost his freedom
        why: The weight is of being someone's servant.
      ways:
      - style: real_world
        teach: Think of a child you've seen working at a roadside dhaba instead of attending school. A wage and meals may seem better than nothing, but the child loses play, study and the freedom to choose, just as Saheb does.
      - style: step_by_step
        teach: 'Step 1: Compare Saheb with a plastic bag and with a steel canister. Step 2: The bag was his own. Step 3: The canister belongs to the tea-stall owner. Step 4: So the heavier load is not weight: it is the loss of freedom.'
    - teach: 'Mukesh lives in Firozabad, the centre of India''s glass-bangle industry. Families work around hot furnaces in dark, airless rooms, and many children lose their eyesight. They are trapped in a vicious circle of the sahukars, middlemen, police, bureaucrats and politicians, and believe making bangles is their karam (destiny). Yet Mukesh dares to dream: he wants to be a motor mechanic and drive a car.'
      check:
        prompt: What makes Mukesh different from the others in his family?
        options:
        - he dares to dream of another life
        - he is the oldest
        - he owns a car
        answer: he dares to dream of another life
        why: He insists on being his own master as a mechanic.
      ways:
      - style: visual
        teach: The vicious circle that keeps Firozabad's bangle-makers poor.
        picture:
          kind: flow
          steps:
          - Sahukars and middlemen
          - Police and bureaucrats
          - Politicians
          - Families too afraid to organise, stuck in debt
          alt: The sahukars and middlemen, the police and bureaucrats, and the politicians together form a circle that keeps families too afraid to organise and stuck in debt.
      - style: real_world
        teach: Child labour laws in India ban children from hazardous work like glass furnaces. But laws help only when enforced and when families have other ways to earn, which is the gap the chapter exposes.
  items:
  - prompt: Where did Saheb's family come from?
    options:
    - Dhaka, Bangladesh
    - Mumbai
    - Kerala
    - Nepal
    answer: Dhaka, Bangladesh
    difficulty: 1
    hints:
    - Storms swept away their fields.
    - Across the border.
    solution: "Saheb's family came from Dhaka, Bangladesh, after storms swept away their fields and homes."
    mistakes: {"Mumbai": "e12_ls_home", "Kerala": "e12_ls_home", "Nepal": "e12_ls_home"}
  - prompt: 'Firozabad is famous for making:'
    options:
    - glass bangles
    - carpets
    - silk
    - toys
    answer: glass bangles
    difficulty: 1
    hints:
    - Bangle industry.
    - Glass.
    solution: "Firozabad is the centre of India's glass bangle industry, where families like Mukesh's work at the furnaces."
    mistakes: {"carpets": "e12_ls_firozabad", "silk": "e12_ls_firozabad", "toys": "e12_ls_firozabad"}
  - prompt: How much did Saheb earn per month at the tea stall (rupees)?
    answer: '800'
    check: '800'
    difficulty: 2
    hints:
    - Plus meals.
    - Eight hundred.
    solution: "Saheb was paid ₹800 a month and his meals, but he lost his freedom: he was no longer his own master."
    mistakes: {"80": "e12_ls_wage", "8000": "e12_ls_wage", "500": "e12_ls_wage", "1000": "e12_ls_wage"}
  - prompt: What does Mukesh dream of becoming?
    options:
    - a motor mechanic
    - a doctor
    - a teacher
    - a bangle-maker
    answer: a motor mechanic
    difficulty: 1
    hints:
    - Cars.
    - Garage.
    solution: "Mukesh wants to be a motor mechanic and drive a car, unlike the others who accept bangle-making as fate."
    mistakes:
      a bangle-maker: eng12_read_again
  - prompt: Why did Saheb lose his freedom when he got a job?
    options:
    - He was no longer his own master
    - He was put in jail
    - He moved to another country
    - He became ill
    answer: He was no longer his own master
    difficulty: 2
    hints:
    - The canister is heavier than the bag.
    - Works for someone else.
    solution: He now worked for someone else and lost his carefree life.
    mistakes: {"He was put in jail": "e12_ls_freedom", "He moved to another country": "e12_ls_freedom", "He became ill": "e12_ls_freedom"}
  - prompt: 'The ''vicious circle'' in Firozabad includes:'
    options:
    - "the sahukars, middlemen, police and politicians"
    - "only the children who work in the glass furnaces"
    - "the hot weather and the dust of the town"
    - "foreign companies that buy the bangles"
    answer: the sahukars, middlemen, police and politicians
    difficulty: 2
    hints:
    - They keep families poor.
    - Trap.
    solution: Moneylenders, middlemen, police and politicians.
    mistakes:
      "only the children who work in the glass furnaces": eng12_theme
  - prompt: What does Saheb's full name, Saheb-e-Alam, mean?
    options:
    - lord of the universe
    - son of the soil
    - the poor one
    answer: lord of the universe
    difficulty: 2
    hints:
    - The author points out the irony.
    - His name is grand; his life is not.
    solution: 'Step 1: ''Alam'' means world. Step 2: lord of the universe.'
    mistakes:
      son of the soil: e12x02_who
      the poor one: e12x02_who
  - prompt: What did Saheb say when asked why he went barefoot?
    options:
    - "his mother did not bring his shoes down from the shelf"
    - "he liked the feel of cool grass under his feet"
    - "shoes were not allowed on the garbage dumps"
    answer: his mother did not bring his shoes down from the shelf
    difficulty: 2
    hints:
    - It was one of the excuses given.
    - The others said it was a tradition.
    solution: 'Step 1: excuses hide poverty. Step 2: mother had not brought them down.'
    mistakes:
      "he liked the feel of cool grass under his feet": e12x02_who
      "shoes were not allowed on the garbage dumps": e12x02_who
  - prompt: What does garbage mean to the elders of Seemapuri?
    options:
    - a means of survival
    - a hobby
    - something to sell abroad
    answer: a means of survival
    difficulty: 1
    hints:
    - For children it is wrapped in wonder.
    - For adults it is daily bread.
    solution: 'Step 1: children find surprises. Step 2: for elders it means survival.'
    mistakes:
      a hobby: e12x02_theme
      something to sell abroad: e12x02_theme
  - prompt: Why do many children in Firozabad lose their eyesight?
    options:
    - "they work near hot furnaces in dim light"
    - "they read too much in poor light at night"
    - "they play in the bright sun all day long"
    answer: they work near hot furnaces in dim light
    difficulty: 1
    hints:
    - Think of their workplaces.
    - Dark rooms and high heat.
    solution: 'Step 1: welding glass in dingy cells. Step 2: eyes are harmed.'
    mistakes:
      "they read too much in poor light at night": e12x02_who
      "they play in the bright sun all day long": e12x02_who
  - prompt: What is the bangle for the women of Firozabad besides an ornament?
    options:
    - "a sign of a woman's marriage"
    - "a prize won at the town fair"
    - "a toy for children to play with"
    answer: a sign of a woman's marriage
    difficulty: 2
    hints:
    - Savita works on bangles she may never wear herself.
    - Think of what bangles mean in Indian tradition.
    solution: 'Step 1: bangles are suhaag. Step 2: a sign of marriage.'
    mistakes:
      "a prize won at the town fair": e12x02_who
      "a toy for children to play with": e12x02_who
  - prompt: Why don't the bangle-makers organise themselves into a cooperative?
    options:
    - "they fear being beaten and jailed"
    - "they are rich enough already"
    - "they do not need any more money"
    answer: they fear being beaten and jailed
    difficulty: 2
    hints:
    - The vicious circle is powerful.
    - The police would act against them.
    solution: 'Step 1: middlemen and police trap them. Step 2: fear stops them.'
    mistakes:
      "they are rich enough already": e12x02_theme
      "they do not need any more money": e12x02_theme
  - prompt: Which two burdens does the author say the bangle-makers carry?
    options:
    - their caste and poverty
    - their wealth and fame
    - school and homework
    answer: their caste and poverty
    difficulty: 3
    hints:
    - One is a social label they are born with.
    - The other is lack of money.
    solution: 'Step 1: born into the bangle-maker caste. Step 2: and into poverty.'
    mistakes:
      their wealth and fame: e12x02_theme
      school and homework: e12x02_theme
  - prompt: What does 'Lost Spring' stand for in the title?
    options:
    - childhood that is taken away
    - a missing water source
    - a season with no rain
    answer: childhood that is taken away
    difficulty: 1
    hints:
    - Spring is the start of the year.
    - Read the subtitle.
    solution: 'Step 1: spring means youth. Step 2: stolen childhood.'
    mistakes:
      a missing water source: e12x02_theme
      a season with no rain: e12x02_theme
  - prompt: How does Mukesh plan to reach the garage to learn?
    options:
    - he will walk
    - by train
    - on his father's bike
    answer: he will walk
    difficulty: 2
    hints:
    - The garage is far from home.
    - He is determined.
    solution: 'Step 1: no money for transport. Step 2: he will walk there.'
    mistakes:
      by train: e12x02_who
      on his father's bike: e12x02_who
  - prompt: 'Assertion (A): The bangle-makers of Firozabad do not organise themselves into a cooperative.

      Reason (R): They fear being hauled up by the police and jailed, and are trapped by the middlemen and moneylenders.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: The chapter says they are too frightened and too trapped to organise. That fear and pressure is the reason. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Mukesh says he wants to be a motor mechanic and will learn to drive a car. Why is this dream remarkable?'
    options:
    - "He dares to break away from the family's bangle-making 'destiny'"
    - "His family already owns a garage, so it is an easy choice"
    - "Every child in Firozabad wants the same, so it is ordinary"
    answer: He dares to break away from the family's bangle-making 'destiny'
    hints:
    - What do most families believe about their work?
    - What does choosing a different job show?
    solution: Most families see bangle-making as their karam. Mukesh's wish to be a mechanic shows courage to break the cycle.
    mistakes:
      "His family already owns a garage, so it is an easy choice": e12x02_who
      "Every child in Firozabad wants the same, so it is ordinary": e12x02_theme
    exam: case
    difficulty: 2
  - prompt: 'Situation: A debate asks what most keeps children like Saheb and Mukesh from a real childhood. Which answer is closest to the chapter''s view?'
    options:
    - "Poverty, tradition and a system that profits from their labour"
    - "Their own laziness and unwillingness to work hard at school"
    - "A lack of interest in school and in learning to read"
    answer: Poverty, tradition and a system that profits from their labour
    hints:
    - Is Saheb unwilling to study?
    - Who gains from keeping the families poor?
    solution: The children want to learn; it is poverty, beliefs about destiny and exploiters like middlemen that steal their childhood.
    mistakes:
      "Their own laziness and unwillingness to work hard at school": e12x02_theme
      "A lack of interest in school and in learning to read": e12x02_theme
    exam: competency
    difficulty: 2
