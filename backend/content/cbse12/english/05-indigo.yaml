# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 5.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 5
title: Indigo (Louis Fischer)
tips:
  e12_in_disobey: "Gandhi refused an official order to leave, peacefully. What do we call refusing to obey an unjust law without violence?"
  e12_in_refund: "Gandhi accepted less than half, because the point was the landlords giving in. Recall the figure that was agreed."
  e12_in_share: "Under the sharecropping deal, a fixed part of every holding was for indigo. Recall the percentage; it is under a fifth."
  e12_in_year: "Gandhi met Rajkumar Shukla at the Lucknow Congress in December 1916 and reached Champaran soon after. Which year follows?"
  e12x05_text: "Place the event in the story's order: the Lucknow meeting, the journey with Shukla, Muzaffarpur, the court case, then the settlement. Where was the court?"
  e12x05_theme: 'Ask what Gandhi wanted most: for the peasants to lose their fear and learn to rely on themselves.'

concepts:
- code: cbse12e.f5.indigo
  title: Indigo (Louis Fischer)
  notes: |
    From Louis Fischer's The Life of Mahatma Gandhi. At the Congress session in Lucknow (December 1916), Rajkumar Shukla, a poor
    sharecropper from Champaran, Bihar, begs Gandhi to come. Indigo sharecroppers had to grow indigo on 15% of their land (the
    tinkathia system) and give the crop as rent. When synthetic indigo made the crop unprofitable, English landlords demanded
    compensation for releasing them. In 1917 Gandhi went to Champaran, met lawyers (including Rajendra Prasad), and at Motihari was
    ordered to leave; he refused, accepting punishment—the first act of civil disobedience in India. The case was dropped. An
    inquiry led landlords to agree to refund 25% of the money; Gandhi accepted, saying the important thing was that peasants had
    lost their fear. He also worked on schools, hygiene and health in the villages. Lessons: self-reliance, courage, non-violence.
  explanations:
    text: A poor farmer, Rajkumar Shukla, persuaded Gandhi to visit Champaran in Bihar, where British landlords forced peasants to grow indigo. Gandhi refused an order to leave, leading to India's first civil disobedience. The landlords agreed to refund part of the money, and the peasants learnt courage and self-reliance.
    visual: Picture Gandhi in Motihari, surrounded by thousands of peasants outside the court, calmly refusing to obey an unjust order to leave the district.
    step_by_step: 'Step 1: Shukla''s persistence in Lucknow. Step 2: The tinkathia system and the landlords'' trick. Step 3: Gandhi in Champaran and Motihari. Step 4: Civil disobedience and the case dropped. Step 5: The 25% settlement and its meaning.'
    real_world: Champaran showed that ordinary people, organised peacefully, could stand up to powerful rulers, a lesson used in freedom struggles everywhere.
  picture:
    kind: flow
    steps:
    - Shukla meets Gandhi in Lucknow (1916)
    - Gandhi goes to Champaran (1917)
    - Ordered to leave Motihari, he refuses
    - Case dropped; inquiry held
    - Landlords refund 25%; peasants lose fear
    alt: 'Indigo: the Champaran episode step by step.'
  activity:
    type: number_line
    min: 0
    max: 50
    step: 5
    start: 0
    prompt: 'Indigo: mark the percentages.'
    goals:
    - prompt: Share of land sharecroppers had to plant with indigo.
      target: 15
      mistakes:
      - when:
          v: 25
        say: 'That''s the refund. Tinkathia means 3 parts in 20 (kathas): turn 3/20 into a percentage.'
      - when:
          v: 50
        say: 'Too much. Tinkathia is 3 parts out of 20: what percentage is that?'
    - prompt: Refund the landlords agreed to.
      target: 25
      mistakes:
      - when:
          v: 50
        say: Gandhi was asked for 50% but accepted half of that.
      - when:
          v: 15
        say: That's the land share. The refund was a quarter of the money.
  lesson:
    - teach: This chapter is from Louis Fischer's 'The Life of Mahatma Gandhi'. At the Congress session in Lucknow in December 1916, Rajkumar Shukla, a poor sharecropper from Champaran in Bihar, asked Gandhi to come and see the farmers' plight. He followed Gandhi from place to place until Gandhi agreed.
      check:
        prompt: What quality of Shukla made Gandhi agree to go?
        options:
        - his determination
        - his wealth
        - his political power
        answer: his determination
        why: He kept following Gandhi until he said yes.
    - teach: Most land in Champaran belonged to English landlords. Indian tenants had to grow indigo on 15% of their land and give it as rent. When Germany made synthetic indigo, the landlords demanded compensation for freeing the tenants from the deal. Gandhi reached Muzaffarpur and then Motihari in 1917. Ordered to leave, he disobeyed and was ready to be punished; crowds gathered, and the case was dropped. This was the first civil disobedience in India.
      picture:
        kind: flow
        steps:
        - 'Lucknow 1916: Shukla asks'
        - 'Muzaffarpur: lawyers meet him'
        - 'Motihari: ordered to leave'
        - Gandhi disobeys
        - case dropped
        alt: Steps of Gandhi's Champaran campaign.
      check:
        prompt: Why did the landlords want compensation from the peasants?
        options:
        - synthetic indigo made the crop less valuable
        - the peasants had stolen land
        - the British government ordered it
        answer: synthetic indigo made the crop less valuable
        why: They wanted money before releasing the peasants from a now-useless deal.
    - teach: An official inquiry found against the planters. They agreed to refund money; Gandhi accepted 25%, saying the amount mattered less than the fact that the landlords had to give up money and prestige, and the peasants had learnt courage. He also opened primary schools, taught hygiene and arranged a doctor. He refused C.F. Andrews's help to teach self-reliance.
      check:
        prompt: Why did Gandhi not want C.F. Andrews to stay in Champaran?
        options:
        - he wanted Indians to rely on themselves
        - he disliked Andrews
        - Andrews was needed in Fiji
        answer: he wanted Indians to rely on themselves
        why: Leaning on an Englishman would show weakness of heart.
  items:
  - prompt: Who persuaded Gandhi to go to Champaran?
    options:
    - Rajkumar Shukla
    - Rajendra Prasad
    - Jawaharlal Nehru
    - C.F. Andrews
    answer: Rajkumar Shukla
    difficulty: 1
    hints:
    - A poor sharecropper.
    - Followed him everywhere.
    solution: Rajkumar Shukla.
    mistakes:
      Rajendra Prasad: eng12_read_again
  - prompt: On what percentage of their land were peasants forced to grow indigo?
    answer: '15'
    check: '15'
    difficulty: 1
    hints:
    - Tinkathia.
    - Fifteen.
    solution: 15%.
    mistakes: {"50": "e12_in_share", "25": "e12_in_share", "20": "e12_in_share", "10": "e12_in_share"}
  - prompt: What percentage refund did Gandhi accept?
    answer: '25'
    check: '25'
    difficulty: 2
    hints:
    - Not the full amount.
    - Twenty-five.
    solution: 25%.
    mistakes: {"50": "e12_in_refund", "15": "e12_in_refund", "100": "e12_in_refund", "10": "e12_in_refund"}
  - prompt: In which year did Gandhi go to Champaran?
    answer: '1917'
    check: '1917'
    difficulty: 2
    hints:
    - After the 1916 Lucknow Congress.
    - '1917.'
    solution: '1917.'
    mistakes: {"1916": "e12_in_year", "1920": "e12_in_year", "1930": "e12_in_year", "1947": "e12_in_year"}
  - prompt: 'Gandhi refusing to leave Motihari is described as the first act of:'
    options:
    - civil disobedience in India
    - violence
    - the Quit India Movement
    - the Salt March
    answer: civil disobedience in India
    difficulty: 2
    hints:
    - Peaceful refusal.
    - First.
    solution: Civil disobedience in India.
    mistakes: {"violence": "e12_in_disobey", "the Quit India Movement": "e12_in_disobey", "the Salt March": "e12_in_disobey"}
  - prompt: Why did Gandhi accept a smaller refund?
    options:
    - Breaking the peasants' fear mattered more than the money
    - He was tired
    - The landlords threatened him
    - He didn't care
    answer: Breaking the peasants' fear mattered more than the money
    difficulty: 2
    hints:
    - Prestige of landlords broken.
    - Courage.
    solution: The peasants had learnt courage; that mattered more than the amount.
    mistakes:
      He was tired: eng12_theme
  - prompt: In which town was Gandhi ordered to leave Champaran?
    options:
    - Motihari
    - Lucknow
    - Patna
    answer: Motihari
    difficulty: 1
    hints:
    - It was the capital of Champaran district.
    - A notice was served on him there.
    solution: 'Step 1: he went to see a peasant who had been ill-treated. Step 2: served the notice in Motihari.'
    mistakes:
      Lucknow: e12x05_text
      Patna: e12x05_text
  - prompt: Why did Rajendra Prasad's servants let Gandhi stay only on the grounds?
    options:
    - they thought he was a poor peasant
    - he asked to stay outside
    - the house was full
    answer: they thought he was a poor peasant
    difficulty: 2
    hints:
    - Gandhi came with Shukla in simple clothes.
    - Prasad was away.
    solution: 'Step 1: simple dress and company. Step 2: taken for an untouchable peasant.'
    mistakes:
      he asked to stay outside: e12x05_text
      the house was full: e12x05_text
  - prompt: What was the 'tinkathia' system?
    options:
    - growing indigo on 3 of every 20 parts of land for the landlord
    - a tax on salt
    - a type of school
    answer: growing indigo on 3 of every 20 parts of land for the landlord
    difficulty: 3
    hints:
    - A katha is a unit of land.
    - Three out of twenty is the same as 15%.
    solution: 'Step 1: 3/20 = 15%. Step 2: indigo grown as rent.'
    mistakes:
      a tax on salt: e12x05_theme
      a type of school: e12x05_theme
  - prompt: Who received Gandhi with a crowd of students at Muzaffarpur station?
    options:
    - Professor J.B. Kripalani
    - Rajendra Prasad
    - the Lieutenant-Governor
    answer: Professor J.B. Kripalani
    difficulty: 2
    hints:
    - He was a teacher at a college there.
    - Gandhi then stayed two days at Professor Malkani's home.
    solution: 'Step 1: a professor met him late at night with students. Step 2: J.B. Kripalani.'
    mistakes:
      Rajendra Prasad: e12x05_text
      the Lieutenant-Governor: e12x05_text
  - prompt: What did Gandhi say about the lawyers' fees in Champaran?
    options:
    - they charged peasants too much and should help freely
    - they were too low
    - they should be paid by the British
    answer: they charged peasants too much and should help freely
    difficulty: 2
    hints:
    - He was shocked at what poor sharecroppers paid.
    - He asked the lawyers to do it as service.
    solution: 'Step 1: high fees from poor clients. Step 2: help without charge.'
    mistakes:
      they were too low: e12x05_theme
      they should be paid by the British: e12x05_theme
  - prompt: 'Gandhi said the real relief for the peasants was learning to be:'
    options:
    - free from fear
    - rich
    - obedient
    answer: free from fear
    difficulty: 1
    hints:
    - Think of why he accepted only 25%.
    - Courage mattered more than money.
    solution: 'Step 1: landlords had to give back money and prestige. Step 2: peasants lost their fear.'
    mistakes:
      rich: e12x05_theme
      obedient: e12x05_theme
  - prompt: Who taught in the schools Gandhi opened in Champaran?
    options:
    - volunteers including Kasturba Gandhi and Mahadev Desai
    - British officers
    - the landlords
    answer: volunteers including Kasturba Gandhi and Mahadev Desai
    difficulty: 2
    hints:
    - Gandhi asked for teachers to come.
    - His wife was one of them.
    solution: 'Step 1: social work alongside the campaign. Step 2: volunteers like Kasturba and Mahadev Desai.'
    mistakes:
      British officers: e12x05_text
      the landlords: e12x05_text
  - prompt: 'Gandhi called the Champaran episode a turning point because it:'
    options:
    - showed the British could be challenged in India
    - ended British rule
    - made indigo profitable
    answer: showed the British could be challenged in India
    difficulty: 3
    hints:
    - The peasants won their case.
    - It was a lesson in courage for the nation.
    solution: 'Step 1: the British gave way. Step 2: the British could not order Indians about in their own country.'
    mistakes:
      ended British rule: e12x05_theme
      made indigo profitable: e12x05_theme
  - prompt: What happened when Gandhi appeared in court at Motihari?
    options:
    - thousands of peasants gathered, and the case was later dropped
    - he was jailed for a year
    - he paid a fine
    answer: thousands of peasants gathered, and the case was later dropped
    difficulty: 1
    hints:
    - The officials were baffled.
    - The Lieutenant-Governor stepped in.
    solution: 'Step 1: spontaneous crowds. Step 2: the case was dropped.'
    mistakes:
      he was jailed for a year: e12x05_text
      he paid a fine: e12x05_text
