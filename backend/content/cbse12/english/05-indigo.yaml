title: Indigo (Louis Fischer)
concepts:
- code: cbse12e.f5.indigo
  title: Indigo (Louis Fischer)
  notes: |
    From Louis Fischer's The Life of Mahatma Gandhi. At the Congress session in Lucknow (December 1916), Rajkumar Shukla, a poor
    sharecropper from Champaran, Bihar, begs Gandhi to come. Indigo sharecroppers had to grow indigo on 15% of their land (the
    tinkathia system) and give the crop as rent. When synthetic indigo made the crop unprofitable, English landlords demanded
    compensation for releasing them. In 1917 Gandhi went to Champaran, met lawyers (including Rajendra Prasad), and at Motihari was
    ordered to leave; he refused, accepting punishment—the first act of civil disobedience in India. The case was dropped. An
    inquiry led landlords to agree to refund 25% of the money; Gandhi accepted, saying the important thing was that peasants had
    lost their fear. He also worked on schools, hygiene and health in the villages. Lessons: self-reliance, courage, non-violence.
  explanations:
    text: A poor farmer, Rajkumar Shukla, persuaded Gandhi to visit Champaran in Bihar, where British landlords forced peasants to grow indigo. Gandhi refused an order to leave, leading to India's first civil disobedience. The landlords agreed to refund part of the money, and the peasants learnt courage and self-reliance.
    visual: Picture Gandhi in Motihari, surrounded by thousands of peasants outside the court, calmly refusing to obey an unjust order to leave the district.
    step_by_step: 'Step 1: Shukla''s persistence in Lucknow. Step 2: The tinkathia system and the landlords'' trick. Step 3: Gandhi in Champaran and Motihari. Step 4: Civil disobedience and the case dropped. Step 5: The 25% settlement and its meaning.'
    real_world: Champaran showed that ordinary people, organised peacefully, could stand up to powerful rulers, a lesson used in freedom struggles everywhere.
