concepts:
- code: cbse12e.f6.poets
  title: Poets and Pancakes (Asokamitran)
  notes: |
    From Asokamitran's book My Years with Boss, about his years at Gemini Studios, Madras (1940s). "Pancake" was the make-up brand
    used heavily in the make-up department, which had a strict hierarchy and was a model of national integration (a Bengali chief,
    then a Maharashtrian, with Kannada, Andhra, Madras Christian and Anglo-Burmese staff). The office boy, a would-be actor/poet,
    blamed Subbu for his failure. Kothamangalam Subbu, the Boss's number two, was talented and loyal. The story department had
    poets. The Boss was S.S. Vasan. A group from the Moral Re-Armament (MRA) movement visited (1952). Later, Stephen Spender, editor
    of The Encounter, visited; nobody understood his English. Years later the author learnt of The God That Failed, in which Spender
    had an essay. Humour, irony, satire.
  explanations:
    text: Asokamitran recalls with gentle humour his years at Gemini Studios in Madras. He describes the make-up department and its 'Pancake' make-up, the talented Subbu, an office boy who wanted to be a poet, and the visit of the English poet Stephen Spender, whose speech nobody understood.
    visual: 'Picture a busy film studio in old Madras: actors'' faces plastered with Pancake make-up under hot lights, an office boy grumbling, and a puzzled audience listening to an English poet nobody can follow.'
    step_by_step: 'Step 1: Gemini Studios and Pancake make-up. Step 2: The office boy''s grievances. Step 3: Kothamangalam Subbu. Step 4: The MRA visit. Step 5: Stephen Spender''s visit and The God That Failed.'
    real_world: The humour of office life, with its rivalries and misunderstandings, is familiar in any workplace today.
  picture:
    kind: flow
    steps:
    - Gemini Studios, Madras
    - Make-up department and 'Pancake'
    - Office boy blames Subbu
    - MRA visitors
    - Stephen Spender's puzzling visit
    alt: 'Poets and Pancakes: scenes from Gemini Studios.'
  activity:
    type: sort
    prompt: 'Poets and Pancakes: where in the story does it belong?'
    bins:
    - Make-up department
    - Story department
    - Visitors
    items:
    - label: Pancake
      bin: Make-up department
      clue: It's the brand in the title. What did they put on actors' faces?
      why: Pancake was the make-up brand the studio bought by the truckload, so it belongs to make-up, not to the poets.
    - label: Poets on the payroll
      bin: Story department
      clue: Gemini paid writers to work on film scripts.
      why: The poets sat in the story department; the make-up room had painters of faces, not words.
    - label: Moral Re-Armament group
      bin: Visitors
      clue: They came in 1952 and put on two plays.
      why: The MRA group came from outside and left; they were guests, not staff.
    - label: Stephen Spender
      bin: Visitors
      clue: An English poet and editor of The Encounter.
      why: Spender came once to speak; nobody understood his accent. He was a guest, not a worker.
    - label: Staff from all over India
      bin: Make-up department
      clue: A Bengali boss, then a Maharashtrian, with Kannada, Andhra and Christian staff.
      why: The writer jokes that the make-up room was a model of national integration.
    - label: Kothamangalam Subbu
      bin: Story department
      clue: The Boss's number two, a poet and actor.
      why: Subbu worked with the story writers; the office boy blamed him, but he was not in make-up.
