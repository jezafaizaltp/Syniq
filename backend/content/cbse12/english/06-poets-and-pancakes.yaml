# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 6.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 6
title: Poets and Pancakes (Asokamitran)
tips:
  e12_pp_book: "Years later the writer found the visitor's name in a book of essays by ex-communists. The title is about a god that let people down."
  e12_pp_boss: "Subbu was the Boss's right-hand man, Spender the visitor, Asokamitran the writer. Who owned and ran the studio?"
  e12_pp_place: "Asokamitran's Gemini Studios was in a southern city in Tamil Nadu. What was its old name?"
  e12_pp_spender: "The visitor was an English poet and editor of The Encounter. His name appears in the book The God That Failed. Who?"
  e12x06_who: "Match each person to their role at Gemini Studios. Whom did the office boy see doing well while he stayed stuck?"
  e12x06_tone: 'Read for the gentle humour and irony: the writer laughs at the studio''s ways, and at himself.'

concepts:
- code: cbse12e.f6.poets
  title: Poets and Pancakes (Asokamitran)
  notes: |
    From Asokamitran's book My Years with Boss, about his years at Gemini Studios, Madras (1940s). "Pancake" was the make-up brand
    used heavily in the make-up department, which had a strict hierarchy and was a model of national integration (a Bengali chief,
    then a Maharashtrian, with Kannada, Andhra, Madras Christian and Anglo-Burmese staff). The office boy, a would-be actor/poet,
    blamed Subbu for his failure. Kothamangalam Subbu, the Boss's number two, was talented and loyal. The story department had
    poets. The Boss was S.S. Vasan. A group from the Moral Re-Armament (MRA) movement visited (1952). Later, Stephen Spender, editor
    of The Encounter, visited; nobody understood his English. Years later the author learnt of The God That Failed, in which Spender
    had an essay. Humour, irony, satire.
  explanations:
    text: Asokamitran recalls with gentle humour his years at Gemini Studios in Madras. He describes the make-up department and its 'Pancake' make-up, the talented Subbu, an office boy who wanted to be a poet, and the visit of the English poet Stephen Spender, whose speech nobody understood.
    visual: 'Picture a busy film studio in old Madras: actors'' faces plastered with Pancake make-up under hot lights, an office boy grumbling, and a puzzled audience listening to an English poet nobody can follow.'
    step_by_step: 'Step 1: Gemini Studios and Pancake make-up. Step 2: The office boy''s grievances. Step 3: Kothamangalam Subbu. Step 4: The MRA visit. Step 5: Stephen Spender''s visit and The God That Failed.'
    real_world: The humour of office life, with its rivalries and misunderstandings, is familiar in any workplace today.
  picture:
    kind: flow
    steps:
    - Gemini Studios, Madras
    - Make-up department and 'Pancake'
    - Office boy blames Subbu
    - MRA visitors
    - Stephen Spender's puzzling visit
    alt: 'Poets and Pancakes: scenes from Gemini Studios.'
  activity:
    type: sort
    prompt: 'Poets and Pancakes: where in the story does it belong?'
    bins:
    - Make-up department
    - Story department
    - Visitors
    items:
    - label: Pancake
      bin: Make-up department
      clue: It's the brand in the title. What did they put on actors' faces?
      why: Pancake was the make-up brand the studio bought by the truckload, so it belongs to make-up, not to the poets.
    - label: Poets on the payroll
      bin: Story department
      clue: Gemini paid writers to work on film scripts.
      why: The poets sat in the story department; the make-up room had painters of faces, not words.
    - label: Moral Re-Armament group
      bin: Visitors
      clue: They came in 1952 and put on two plays.
      why: The MRA group came from outside and left; they were guests, not staff.
    - label: Stephen Spender
      bin: Visitors
      clue: An English poet and editor of The Encounter.
      why: Spender came once to speak; nobody understood his accent. He was a guest, not a worker.
    - label: Staff from all over India
      bin: Make-up department
      clue: A Bengali boss, then a Maharashtrian, with Kannada, Andhra and Christian staff.
      why: The writer jokes that the make-up room was a model of national integration.
    - label: Kothamangalam Subbu
      bin: Story department
      clue: The Boss's number two, a poet and actor.
      why: Subbu worked with the story writers; the office boy blamed him, but he was not in make-up.
  lesson:
    - teach: 'Asokamitran worked at Gemini Studios in Madras in the 1940s, and this chapter comes from his book ''My Years with Boss''. Pancake was the brand of make-up the studio bought in truckloads. The make-up department, in a building said to have been Robert Clive''s stables, had a strict hierarchy and staff from all over India: a picture of national integration.'
      check:
        prompt: Why does the writer call the make-up department a model of national integration?
        options:
        - its staff came from many regions of India
        - it made national flags
        - it was run by the government
        answer: its staff came from many regions of India
        why: A Bengali, then a Maharashtrian head, with Kannada, Andhra, Christian and Anglo-Burmese staff.
      ways:
      - style: visual
        teach: The make-up department at Gemini Studios, from top to bottom.
        picture:
          kind: flow
          steps:
          - Chief make-up man
          - Senior assistants
          - Junior assistants
          - The office boy, who made up the crowd players
          alt: At the top was the chief make-up man, then senior assistants, then junior assistants, and at the bottom the office boy, who made up the crowd players.
      - style: real_world
        teach: 'Think of a film set today: make-up artists from Kerala, Punjab, Bengal and elsewhere working side by side. Asokamitran saw the same mix in the 1940s and jokingly called it a picture of national integration.'
    - teach: The office boy in the make-up department had come hoping to be a star or a poet and blamed Subbu for his failure. Kothamangalam Subbu, the Boss's number two, was clever, loyal and full of ideas for films. The writer's own job was to cut out newspaper clippings and file them, which others thought was doing nothing.
      check:
        prompt: What was the writer's job at Gemini Studios?
        options:
        - cutting and filing newspaper clippings
        - doing make-up
        - acting in films
        answer: cutting and filing newspaper clippings
        why: He sat in a cubicle tearing up newspapers, so others thought he was idle.
      ways:
      - style: visual
        teach: Subbu and the office boy, two very different men at the studio.
        picture:
          kind: compare
          columns:
          - title: Kothamangalam Subbu
            points:
            - The Boss's number two
            - Clever, loyal, full of film ideas
            - Kind and generous
          - title: The office boy
            points:
            - Came hoping to be a star or poet
            - Stuck mixing make-up
            - Bitter; blamed Subbu
          alt: Kothamangalam Subbu was the Boss's number two, clever, loyal, full of film ideas, kind and generous. The office boy had come hoping to be a star or poet, was stuck mixing make-up, and bitterly blamed Subbu.
      - style: step_by_step
        teach: 'Step 1: Note the writer''s real job: cutting and filing newspaper clippings. Step 2: Note that others thought he did nothing. Step 3: Notice how he tells this with a smile. Step 4: His gentle self-mockery is part of the chapter''s humour.'
    - teach: Two visits stand out. The Moral Re-Armament (MRA) group came in 1952 and staged plays the studio later borrowed ideas from. Then Stephen Spender, an English poet and editor of 'The Encounter', spoke at the studio, and nobody there understood his accent or why he had come. Years later the writer found 'The God That Failed', six essays by writers disillusioned with communism, with one by Spender.
      picture:
        kind: compare
        columns:
        - title: Visit
          points:
          - MRA group (1952)
          - Stephen Spender
        - title: What happened
          points:
          - plays seen and borrowed from
          - nobody understood his English
        alt: The two visits to Gemini Studios and how they went.
      check:
        prompt: Why did the Gemini staff feel puzzled by Spender's visit?
        options:
        - he was a poet at a Tamil film studio and they could not follow his accent
        - he refused to speak
        - he came to buy the studio
        answer: he was a poet at a Tamil film studio and they could not follow his accent
        why: His world and theirs seemed far apart.
      ways:
      - style: real_world
        teach: Imagine a famous foreign poet invited to speak at a busy film studio in Chennai, where few know who he is or follow his accent. Everyone claps politely and wonders why he came. That is the comedy of Spender's visit.
      - style: step_by_step
        teach: 'Step 1: Spender visits; no one understands him. Step 2: Years later the writer finds ''The God That Failed''. Step 3: He sees Spender was one of its writers. Step 4: The mystery is solved, with a quiet joke at everyone''s expense.'
  items:
  - prompt: '''Pancake'' in the title refers to:'
    options:
    - a brand of make-up
    - a breakfast dish
    - a poet's name
    - a film
    answer: a brand of make-up
    difficulty: 1
    hints:
    - Used on actors.
    - Make-up department.
    solution: "Pancake was the brand of make-up that Gemini Studios bought in large amounts for its actors."
    mistakes:
      a breakfast dish: eng12_read_again
  - prompt: 'Gemini Studios was in:'
    options:
    - Madras (Chennai)
    - Bombay
    - Calcutta
    - Delhi
    answer: Madras (Chennai)
    difficulty: 1
    hints:
    - South India.
    - Tamil films.
    solution: "Gemini Studios, where Asokamitran worked, was in Madras (now Chennai)."
    mistakes: {"Bombay": "e12_pp_place", "Calcutta": "e12_pp_place", "Delhi": "e12_pp_place"}
  - prompt: Who was the Boss of Gemini Studios?
    options:
    - S.S. Vasan
    - Subbu
    - Stephen Spender
    - Asokamitran
    answer: S.S. Vasan
    difficulty: 2
    hints:
    - Founder.
    - Film producer.
    solution: "S.S. Vasan, the founder, was the Boss of Gemini Studios."
    mistakes: {"Subbu": "e12_pp_boss", "Stephen Spender": "e12_pp_boss", "Asokamitran": "e12_pp_boss"}
  - prompt: Which English poet visited the studio?
    options:
    - Stephen Spender
    - T.S. Eliot
    - W.H. Auden
    - Ted Hughes
    answer: Stephen Spender
    difficulty: 1
    hints:
    - Editor of The Encounter.
    - Spender.
    solution: "Stephen Spender, an English poet, visited; nobody at the studio could follow his English or knew who he was."
    mistakes: {"T.S. Eliot": "e12_pp_spender", "W.H. Auden": "e12_pp_spender", "Ted Hughes": "e12_pp_spender"}
  - prompt: 'The book in which Spender had an essay was:'
    options:
    - The God That Failed
    - My Years with Boss
    - Animal Farm
    - The Encounter Annual
    answer: The God That Failed
    difficulty: 2
    hints:
    - About communism.
    - Six writers.
    solution: "Years later the author found Spender's name in The God That Failed, a book of essays by writers who had turned away from communism."
    mistakes: {"My Years with Boss": "e12_pp_book", "Animal Farm": "e12_pp_book", "The Encounter Annual": "e12_pp_book"}
  - prompt: 'The tone of the chapter is mainly:'
    options:
    - humorous and gently satirical
    - tragic
    - angry
    - scientific
    answer: humorous and gently satirical
    difficulty: 2
    hints:
    - Self-mockery.
    - Irony.
    solution: "Asokamitran laughs gently at the studio and its people, so the tone is humorous and lightly satirical."
    mistakes:
      tragic: eng12_theme
  - prompt: Where was the make-up department said to be housed?
    options:
    - in what had been Robert Clive's stables
    - in the Boss's house
    - in a cinema hall
    answer: in what had been Robert Clive's stables
    difficulty: 2
    hints:
    - A historical British figure.
    - The building once kept horses.
    solution: 'Step 1: upstairs of an old building. Step 2: believed to be Clive''s stables.'
    mistakes:
      in the Boss's house: e12x06_who
      in a cinema hall: e12x06_who
  - prompt: Whom did the office boy blame for his failure in films?
    options:
    - Subbu
    - the Boss
    - the legal adviser
    answer: Subbu
    difficulty: 1
    hints:
    - The man closest to the Boss.
    - The office boy thought he blocked talent.
    solution: 'Step 1: he resented the number two. Step 2: Subbu.'
    mistakes:
      the Boss: e12x06_who
      the legal adviser: e12x06_who
  - prompt: Why do others think the writer is doing nothing at work?
    options:
    - he sits tearing up newspapers
    - he sleeps all day
    - he never comes to office
    answer: he sits tearing up newspapers
    difficulty: 1
    hints:
    - Think of his cubicle.
    - His real job was clippings.
    solution: 'Step 1: cutting newspapers looks idle. Step 2: so people think he does nothing.'
    mistakes:
      he sleeps all day: e12x06_tone
      he never comes to office: e12x06_tone
  - prompt: What does 'The God That Failed' refer to?
    options:
    - communism, which disillusioned six writers
    - a failed film
    - a religious book
    answer: communism, which disillusioned six writers
    difficulty: 3
    hints:
    - It is a collection of essays.
    - The 'god' was a political idea.
    solution: 'Step 1: six writers on their journey into and out of it. Step 2: communism.'
    mistakes:
      a failed film: e12x06_tone
      a religious book: e12x06_tone
  - prompt: Spender was the editor of which journal?
    options:
    - The Encounter
    - The Hindu
    - Gemini Times
    answer: The Encounter
    difficulty: 2
    hints:
    - A British literary magazine.
    - It was published in London.
    solution: 'Step 1: English magazine. Step 2: The Encounter.'
    mistakes:
      The Hindu: e12x06_who
      Gemini Times: e12x06_who
  - prompt: Why were Gemini Studios people said to be against communism?
    options:
    - they were ordinary people who loved Gandhi and khadi and disliked political extremes
    - the Boss was a communist
    - they had never heard of it
    answer: they were ordinary people who loved Gandhi and khadi and disliked political extremes
    difficulty: 3
    hints:
    - Think of the MRA visit.
    - The writer gently mocks their idea of communists.
    solution: 'Step 1: Congress-minded, simple people. Step 2: wary of communism.'
    mistakes:
      the Boss was a communist: e12x06_tone
      they had never heard of it: e12x06_tone
  - prompt: 'Kothamangalam Subbu is shown as:'
    options:
    - talented, loyal and generous
    - lazy and selfish
    - a foreign visitor
    answer: talented, loyal and generous
    difficulty: 1
    hints:
    - He had many ideas for the Boss.
    - His house was open to many relatives and friends.
    solution: 'Step 1: gifted in films and poetry. Step 2: loyal to the Boss.'
    mistakes:
      lazy and selfish: e12x06_who
      a foreign visitor: e12x06_who
  - prompt: How many essays did 'The God That Failed' contain?
    options:
    - six
    - three
    - twelve
    answer: six
    difficulty: 2
    hints:
    - One was by Spender.
    - Others included Koestler and Gide.
    solution: 'Step 1: six writers. Step 2: six essays.'
    mistakes:
      three: e12x06_who
      twelve: e12x06_who
  - prompt: Why did the make-up men use so much Pancake on actors?
    options:
    - to make them look good under strong studio lights
    - to save money
    - because actors asked for less
    answer: to make them look good under strong studio lights
    difficulty: 2
    hints:
    - The writer jokes that it turned decent people into monsters.
    - Heavy lights and heat were used.
    solution: 'Step 1: studio lights were harsh. Step 2: thick make-up.'
    mistakes:
      to save money: e12x06_tone
      because actors asked for less: e12x06_tone
  - prompt: 'Assertion (A): The office boy in the make-up department was bitter towards Subbu.

      Reason (R): He had come to the studio hoping to become a star or a poet, and blamed Subbu''s success for his own failure.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: His disappointment at being stuck in a lowly job turned into resentment of Subbu. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Stephen Spender spoke at Gemini Studios, and the audience did not understand his accent or why he had come. What effect does the writer create with this episode?'
    options:
    - Gentle irony about how out of place the visit was
    - Anger at the poet
    - Praise for English poetry
    answer: Gentle irony about how out of place the visit was
    hints:
    - How does the writer describe the audience's reaction?
    - Is he angry, or amused?
    solution: The writer smiles at the gap between a serious English poet and a film studio that had no idea who he was.
    mistakes:
      Anger at the poet: e12x06_tone
      Praise for English poetry: e12x06_tone
    exam: case
    difficulty: 2
  - prompt: 'Situation: A reader says the chapter is only about make-up. What else does it show?'
    options:
    - Life, people and humour inside a 1940s film studio
    - How to apply film make-up
    - The history of Robert Clive
    answer: Life, people and humour inside a 1940s film studio
    hints:
    - Which people does the writer describe?
    - What tone does he use?
    solution: Through the make-up room, Subbu, the office boy and the visitors, the writer gives a humorous picture of studio life.
    mistakes:
      How to apply film make-up: e12x06_tone
      The history of Robert Clive: e12x06_who
    exam: competency
    difficulty: 2
