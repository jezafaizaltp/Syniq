# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 7.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 7
title: The Interview (Christopher Silvester)
tips:
  e12_iv_copies: "The interviewer says the novel sold far more than expected for a serious book. Recall the round figure in millions."
  e12_iv_gaps: "Eco explains the word himself: small gaps of time, like waiting for a lift. Which option means small spaces?"
  e12_iv_job: "Eco says he is a university man first and writes novels on Sundays. What did he teach and study?"
  e12_iv_kipling: "Christopher Silvester lists writers who disliked interviews. Which author of The Jungle Book used words like 'crime'?"
  e12_iv_novel: "Eco's famous novel is a medieval murder mystery set in a monastery. Which title has a flower in it?"
  e12x07_part: 'Check which part the question is from: Part I (views on interviews in general) or Part II (Mukund Padmanabhan''s interview with Umberto Eco).'
  e12x07_view: 'Sort the views: some praise the interview as an art and a source of truth; others feel it invades their privacy.'

concepts:
- code: cbse12e.f7.interview
  title: The Interview (Christopher Silvester)
  notes: |
    Part I, from Christopher Silvester's introduction to the Penguin Book of Interviews: the interview, invented about 130 years ago,
    is now common; opinions differ. Some see it as an art and a source of truth; others (V.S. Naipaul, Lewis Carroll, Rudyard
    Kipling, H.G. Wells) disliked it: Kipling called it immoral, a crime, an assault. Part II: an extract from an interview of
    Umberto Eco (Italian professor, semiotician, author of The Name of the Rose, which sold over 10 million copies) by Mukund
    Padmanabhan of The Hindu. Eco explains he writes in "interstices"—empty spaces in his day—and that his novels follow scholarly
    interests; he writes in a playful, narrative way.
  explanations:
    text: 'The first part discusses interviews: some people value them as a way to learn the truth, while famous writers like Kipling and Naipaul hated being interviewed. The second part is an interview with the Italian writer Umberto Eco, who explains how he gets so much done by using the small gaps in his day.'
    visual: Picture a reporter with a notepad facing a nervous famous writer; then Umberto Eco smiling and explaining that he writes in the 'interstices', the empty minutes between other tasks.
    step_by_step: 'Step 1: Part I: what interviews are and different views on them. Step 2: Writers who disliked interviews. Step 3: Part II: Eco''s work habits. Step 4: Eco''s novel The Name of the Rose.'
    real_world: Today's podcasts and YouTube interviews continue the form that Silvester describes.
  picture:
    kind: compare
    columns:
    - title: View of interviews
      points:
      - positive
      - negative
    - title: Who
      points:
      - many readers and journalists
      - Naipaul, Kipling, Lewis Carroll
    - title: Reason
      points:
      - source of truth, an art
      - intrusion, loss of privacy
    alt: Positive and negative views of interviews in the chapter.
  activity:
    type: sort
    prompt: 'The Interview: does each view see interviews as good or bad?'
    bins:
    - Good
    - Bad
    items:
    - label: A source of truth
      bin: Good
      clue: What does an interview help us learn?
      why: Seeing it as a way to reach truth is a positive view.
    - label: Kipling called it immoral, a crime
      bin: Bad
      clue: Crime is a strong word.
      why: Calling it a crime and an assault is clearly against interviews.
    - label: An art form
      bin: Good
      clue: A skill worth respecting.
      why: Calling it an art praises the interview.
    - label: Naipaul felt people lose a part of themselves
      bin: Bad
      clue: Something is taken away.
      why: Losing part of yourself is harm, so this view is against it.
    - label: Lewis Carroll would not give them
      bin: Bad
      clue: He kept away from interviewers.
      why: Refusing to be interviewed shows he disliked them.
    - label: Eco explains 'interstices' in his day
      bin: Good
      clue: He talks happily about his writing habits.
      why: 'Eco uses the interview to share how he works: an interview going well.'
  lesson:
    - teach: Part I comes from Christopher Silvester's introduction to 'The Penguin Book of Interviews'. The interview was invented a little over 130 years ago and is now very common. Some think it is an art and a valuable source of truth about people; others see it as an unwanted intrusion.
      check:
        prompt: 'Part I of ''The Interview'' is mainly about:'
        options:
        - different views on interviews
        - Eco's novels
        - how to get a job
        answer: different views on interviews
        why: It sets out praise and criticism of the interview.
    - teach: Many celebrities disliked interviews. V.S. Naipaul felt people are wounded by them and lose a part of themselves. Lewis Carroll had a horror of interviewers and never agreed to one. Rudyard Kipling called interviewing immoral, a crime and an assault. H.G. Wells spoke of 'the interviewing ordeal' but later interviewed Stalin. Saul Bellow described interviews as thumbprints on his windpipe.
      picture:
        kind: compare
        columns:
        - title: Writer
          points:
          - V.S. Naipaul
          - Lewis Carroll
          - Rudyard Kipling
          - Saul Bellow
        - title: View
          points:
          - people lose part of themselves
          - never consented
          - immoral, a crime
          - thumbprints on his windpipe
        alt: Writers who disliked interviews and what each felt.
      check:
        prompt: Which writer said people are 'wounded' by interviews?
        options:
        - V.S. Naipaul
        - Umberto Eco
        - Denis Brian
        answer: V.S. Naipaul
        why: He felt they lose a part of themselves.
    - teach: Part II is from an interview of Umberto Eco by Mukund Padmanabhan of The Hindu. Eco, an Italian professor and semiotician, wrote scholarly works and novels, including 'The Name of the Rose'. He says he writes in the 'interstices', the empty spaces in his day, and calls himself a university professor who writes novels on Sundays. He thinks the novel's success is a mystery, but shows that readers do not always want easy reading.
      check:
        prompt: What does Eco think the success of 'The Name of the Rose' shows?
        options:
        - readers can enjoy demanding books
        - people only like easy books
        - only professors buy novels
        answer: readers can enjoy demanding books
        why: The novel was dense, yet sold millions.
  items:
  - prompt: Who interviewed Umberto Eco?
    options:
    - Mukund Padmanabhan
    - Christopher Silvester
    - Rudyard Kipling
    - V.S. Naipaul
    answer: Mukund Padmanabhan
    difficulty: 1
    hints:
    - From The Hindu.
    - Indian journalist.
    solution: Mukund Padmanabhan.
    mistakes:
      Christopher Silvester: eng12_read_again
  - prompt: 'Eco''s best-known novel is:'
    options:
    - The Name of the Rose
    - The God That Failed
    - A Suitable Boy
    - The Citadel
    answer: The Name of the Rose
    difficulty: 1
    hints:
    - Medieval mystery.
    - Bestseller.
    solution: The Name of the Rose.
    mistakes: {"The God That Failed": "e12_iv_novel", "A Suitable Boy": "e12_iv_novel", "The Citadel": "e12_iv_novel"}
  - prompt: 'Eco says he writes in ''interstices'', meaning:'
    options:
    - the empty spaces in his day
    - large libraries
    - noisy cafés
    - only at night
    answer: the empty spaces in his day
    difficulty: 2
    hints:
    - Gaps.
    - Waiting for a lift.
    solution: The small gaps of time in his day.
    mistakes: {"large libraries": "e12_iv_gaps", "noisy cafés": "e12_iv_gaps", "only at night": "e12_iv_gaps"}
  - prompt: Which writer called interviews 'immoral' and 'a crime'?
    options:
    - Rudyard Kipling
    - Umberto Eco
    - Lewis Carroll
    - H.G. Wells
    answer: Rudyard Kipling
    difficulty: 2
    hints:
    - Wrote The Jungle Book.
    - Hated interviews.
    solution: Rudyard Kipling.
    mistakes: {"Umberto Eco": "e12_iv_kipling", "Lewis Carroll": "e12_iv_kipling", "H.G. Wells": "e12_iv_kipling"}
  - prompt: About how many million copies did The Name of the Rose sell (per the chapter)?
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - Over ten.
    - Million.
    solution: Over 10 million.
    mistakes: {"1": "e12_iv_copies", "5": "e12_iv_copies", "50": "e12_iv_copies", "100": "e12_iv_copies"}
  - prompt: 'Eco was by profession mainly a:'
    options:
    - professor and semiotician
    - film director
    - politician
    - journalist
    answer: professor and semiotician
    difficulty: 2
    hints:
    - University.
    - Study of signs.
    solution: A professor and semiotician.
    mistakes: {"film director": "e12_iv_job", "politician": "e12_iv_job", "journalist": "e12_iv_job"}
  - prompt: About how many years ago was the interview invented, per the chapter?
    answer: '130'
    check: '130'
    difficulty: 2
    hints:
    - A little over a century.
    - Between 100 and 150.
    solution: 'Step 1: Silvester''s estimate. Step 2: about 130 years.'
    mistakes:
      '30': e12x07_part
      '300': e12x07_part
  - prompt: Which writer described interviews as 'thumbprints on his windpipe'?
    options:
    - Saul Bellow
    - Lewis Carroll
    - H.G. Wells
    answer: Saul Bellow
    difficulty: 2
    hints:
    - An American novelist.
    - He agreed to many but disliked them.
    solution: 'Step 1: feeling of being choked. Step 2: Saul Bellow.'
    mistakes:
      Lewis Carroll: e12x07_view
      H.G. Wells: e12x07_view
  - prompt: Whom did H.G. Wells later interview himself?
    options:
    - Joseph Stalin
    - Kipling
    - Gandhi
    answer: Joseph Stalin
    difficulty: 2
    hints:
    - A powerful Soviet leader.
    - Ironic, since Wells called it an ordeal.
    solution: 'Step 1: in 1934. Step 2: Stalin.'
    mistakes:
      Kipling: e12x07_view
      Gandhi: e12x07_view
  - prompt: 'Lewis Carroll''s attitude to interviews was:'
    options:
    - he had a horror of them and never gave one
    - he loved them
    - he gave one a week
    answer: he had a horror of them and never gave one
    difficulty: 1
    hints:
    - He also disliked being photographed as a celebrity.
    - He protected his privacy.
    solution: 'Step 1: horror of the interviewer. Step 2: never consented.'
    mistakes:
      he loved them: e12x07_view
      he gave one a week: e12x07_view
  - prompt: How does Eco describe himself in the interview?
    options:
    - a university professor who writes novels on Sundays
    - a full-time novelist
    - a journalist
    answer: a university professor who writes novels on Sundays
    difficulty: 2
    hints:
    - Novels are not his main job.
    - He thinks of himself as an academic first.
    solution: 'Step 1: academic identity. Step 2: novels are a weekend activity.'
    mistakes:
      a full-time novelist: e12x07_part
      a journalist: e12x07_part
  - prompt: 'Eco says his scholarly works are different from other scholars'' because he writes them:'
    options:
    - in a narrative, playful way
    - very briefly
    - only in Latin
    answer: in a narrative, playful way
    difficulty: 2
    hints:
    - He tells the story of his research.
    - That is why he moved easily to novels.
    solution: 'Step 1: he narrates how he reached his ideas. Step 2: narrative, playful.'
    mistakes:
      very briefly: e12x07_part
      only in Latin: e12x07_part
  - prompt: For which newspaper did Mukund Padmanabhan work?
    options:
    - The Hindu
    - The Times
    - The Encounter
    answer: The Hindu
    difficulty: 1
    hints:
    - An Indian national daily.
    - Based in Chennai.
    solution: 'Step 1: Indian journalist. Step 2: The Hindu.'
    mistakes:
      The Times: e12x07_part
      The Encounter: e12x07_part
  - prompt: 'Denis Brian praised interviews because:'
    options:
    - through them we know much more about people
    - they are short
    - they are always polite
    answer: through them we know much more about people
    difficulty: 2
    hints:
    - He took the positive view.
    - Think of what we learn about famous people.
    solution: 'Step 1: interviews reveal people. Step 2: we know more about them.'
    mistakes:
      they are short: e12x07_view
      they are always polite: e12x07_view
  - prompt: '''The Name of the Rose'' is best described as:'
    options:
    - a serious, demanding novel with a detective story
    - a children's picture book
    - a cookbook
    answer: a serious, demanding novel with a detective story
    difficulty: 1
    hints:
    - It mixes history, philosophy and crime.
    - Set in a medieval monastery.
    solution: 'Step 1: detective plot. Step 2: dense with ideas.'
    mistakes:
      a children's picture book: e12x07_part
      a cookbook: e12x07_part
