# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 7.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 7
title: The Interview (Christopher Silvester)
tips:
  e12_iv_copies: "The interviewer says the novel sold far more than expected for a serious book. Recall the round figure in millions."
  e12_iv_gaps: "Eco explains the word himself: small gaps of time, like waiting for a lift. Which option means small spaces?"
  e12_iv_job: "Eco says he is a university man first and writes novels on Sundays. What did he teach and study?"
  e12_iv_kipling: "Christopher Silvester lists writers who disliked interviews. Which author of The Jungle Book used words like 'crime'?"
  e12_iv_novel: "Eco's famous novel is a medieval murder mystery set in a monastery. Which title has a flower in it?"

concepts:
- code: cbse12e.f7.interview
  title: The Interview (Christopher Silvester)
  notes: |
    Part I, from Christopher Silvester's introduction to the Penguin Book of Interviews: the interview, invented about 130 years ago,
    is now common; opinions differ. Some see it as an art and a source of truth; others (V.S. Naipaul, Lewis Carroll, Rudyard
    Kipling, H.G. Wells) disliked it: Kipling called it immoral, a crime, an assault. Part II: an extract from an interview of
    Umberto Eco (Italian professor, semiotician, author of The Name of the Rose, which sold over 10 million copies) by Mukund
    Padmanabhan of The Hindu. Eco explains he writes in "interstices"—empty spaces in his day—and that his novels follow scholarly
    interests; he writes in a playful, narrative way.
  explanations:
    text: 'The first part discusses interviews: some people value them as a way to learn the truth, while famous writers like Kipling and Naipaul hated being interviewed. The second part is an interview with the Italian writer Umberto Eco, who explains how he gets so much done by using the small gaps in his day.'
    visual: Picture a reporter with a notepad facing a nervous famous writer; then Umberto Eco smiling and explaining that he writes in the 'interstices', the empty minutes between other tasks.
    step_by_step: 'Step 1: Part I: what interviews are and different views on them. Step 2: Writers who disliked interviews. Step 3: Part II: Eco''s work habits. Step 4: Eco''s novel The Name of the Rose.'
    real_world: Today's podcasts and YouTube interviews continue the form that Silvester describes.
  picture:
    kind: compare
    columns:
    - title: View of interviews
      points:
      - positive
      - negative
    - title: Who
      points:
      - many readers and journalists
      - Naipaul, Kipling, Lewis Carroll
    - title: Reason
      points:
      - source of truth, an art
      - intrusion, loss of privacy
    alt: Positive and negative views of interviews in the chapter.
  activity:
    type: sort
    prompt: 'The Interview: does each view see interviews as good or bad?'
    bins:
    - Good
    - Bad
    items:
    - label: A source of truth
      bin: Good
      clue: What does an interview help us learn?
      why: Seeing it as a way to reach truth is a positive view.
    - label: Kipling called it immoral, a crime
      bin: Bad
      clue: Crime is a strong word.
      why: Calling it a crime and an assault is clearly against interviews.
    - label: An art form
      bin: Good
      clue: A skill worth respecting.
      why: Calling it an art praises the interview.
    - label: Naipaul felt people lose a part of themselves
      bin: Bad
      clue: Something is taken away.
      why: Losing part of yourself is harm, so this view is against it.
    - label: Lewis Carroll would not give them
      bin: Bad
      clue: He kept away from interviewers.
      why: Refusing to be interviewed shows he disliked them.
    - label: Eco explains 'interstices' in his day
      bin: Good
      clue: He talks happily about his writing habits.
      why: 'Eco uses the interview to share how he works: an interview going well.'
  items:
  - prompt: Who interviewed Umberto Eco?
    options:
    - Mukund Padmanabhan
    - Christopher Silvester
    - Rudyard Kipling
    - V.S. Naipaul
    answer: Mukund Padmanabhan
    difficulty: 1
    hints:
    - From The Hindu.
    - Indian journalist.
    solution: Mukund Padmanabhan.
    mistakes:
      Christopher Silvester: eng12_read_again
  - prompt: 'Eco''s best-known novel is:'
    options:
    - The Name of the Rose
    - The God That Failed
    - A Suitable Boy
    - The Citadel
    answer: The Name of the Rose
    difficulty: 1
    hints:
    - Medieval mystery.
    - Bestseller.
    solution: The Name of the Rose.
    mistakes: {"The God That Failed": "e12_iv_novel", "A Suitable Boy": "e12_iv_novel", "The Citadel": "e12_iv_novel"}
  - prompt: 'Eco says he writes in ''interstices'', meaning:'
    options:
    - the empty spaces in his day
    - large libraries
    - noisy cafés
    - only at night
    answer: the empty spaces in his day
    difficulty: 2
    hints:
    - Gaps.
    - Waiting for a lift.
    solution: The small gaps of time in his day.
    mistakes: {"large libraries": "e12_iv_gaps", "noisy cafés": "e12_iv_gaps", "only at night": "e12_iv_gaps"}
  - prompt: Which writer called interviews 'immoral' and 'a crime'?
    options:
    - Rudyard Kipling
    - Umberto Eco
    - Lewis Carroll
    - H.G. Wells
    answer: Rudyard Kipling
    difficulty: 2
    hints:
    - Wrote The Jungle Book.
    - Hated interviews.
    solution: Rudyard Kipling.
    mistakes: {"Umberto Eco": "e12_iv_kipling", "Lewis Carroll": "e12_iv_kipling", "H.G. Wells": "e12_iv_kipling"}
  - prompt: About how many million copies did The Name of the Rose sell (per the chapter)?
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - Over ten.
    - Million.
    solution: Over 10 million.
    mistakes: {"1": "e12_iv_copies", "5": "e12_iv_copies", "50": "e12_iv_copies", "100": "e12_iv_copies"}
  - prompt: 'Eco was by profession mainly a:'
    options:
    - professor and semiotician
    - film director
    - politician
    - journalist
    answer: professor and semiotician
    difficulty: 2
    hints:
    - University.
    - Study of signs.
    solution: A professor and semiotician.
    mistakes: {"film director": "e12_iv_job", "politician": "e12_iv_job", "journalist": "e12_iv_job"}
