# CBSE Class 12 English (NCERT Vistas, supplementary reader, rationalised syllabus), chapter 19.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 19
title: Memories of Childhood (Zitkala-Sa and Bama)
tips:
  e12_mc_brother: "Annan told Bama that people would respect them through learning. What did he advise?"
  e12_mc_herd: "Zitkala-Sa felt she lost her dignity, like a creature with no choice. What is driven by a herder?"
  e12_mc_vadai: "Bama laughed at first, then understood he would not touch it because of caste. How did he hold it?"
  e12_mc_zitkala: "For her people, long hair mattered and only cowards had it shorn. What was done to her at the school?"
  e12x19_who: "Check which extract the question is from: the boarding-school story of the cut hair, or the village story of the vadai packet."
  e12x19_theme: 'Ask how each child meets injustice: Zitkala-Sa resists, Bama learns that education can win dignity.'

concepts:
- code: cbse12e.v6.memories
  title: Memories of Childhood (Zitkala-Sa and Bama)
  notes: |
    Two autobiographical extracts by women from marginalised communities. 'The Cutting of My Long Hair' by Zitkala-Sa (Gertrude
    Simmons Bonnin), a Native American (Sioux) writer: on her first day at the Carlisle Indian School she is shocked by the tight
    clothes, the noisy dining-hall rules and the plan to shingle (cut) her long hair, which among her people only cowards or mourners
    had. She hides under a bed but is dragged out, tied to a chair and her hair is cut; she feels like an animal driven by a herder,
    her spirit crushed. 'We Too Are Human Beings' by Bama, a Tamil Dalit writer: as a child in the third grade she sees an elder of
    her community carrying a packet of vadai by its string, not touching it, for a landlord, and learns from her elder brother
    (Annan) that this is because of untouchability. He tells her that education is the way to earn respect; she studies hard and
    comes first. Themes: discrimination, cultural oppression, resistance.
  explanations:
    text: Two women recall childhood experiences of discrimination. Zitkala-Sa, a Native American girl, has her long hair forcibly cut at a boarding school that tried to erase her culture. Bama, a Dalit girl in Tamil Nadu, sees an elder carry food by a string to avoid 'polluting' it, and her brother tells her that education is the way to win respect.
    visual: Picture a small Native American girl hiding under a bed as teachers search for her with scissors; then a Tamil village street where a girl watches an elderly man holding a packet of vadai by its string, at arm's length.
    step_by_step: 'Step 1: Zitkala-Sa''s first day at school. Step 2: The cutting of her hair and what it meant. Step 3: Bama sees the elder with the vadai. Step 4: Annan explains untouchability. Step 5: Bama''s resolve to study.'
    real_world: India's Constitution abolished untouchability, but stories like Bama's show why education and awareness are still needed.
  picture:
    kind: compare
    columns:
    - title: Writer
      points:
      - Zitkala-Sa
      - Bama
    - title: Community
      points:
      - Native American (Sioux)
      - Dalit, Tamil Nadu
    - title: Experience
      points:
      - long hair forcibly cut
      - seeing untouchability practised
    alt: The two writers in Memories of Childhood and what each experienced.
  activity:
    type: sort
    prompt: 'Memories of Childhood: Zitkala-Sa or Bama?'
    bins:
    - Zitkala-Sa
    - Bama
    items:
    - label: Hair cut at the Carlisle school
      bin: Zitkala-Sa
      clue: A Native American girl.
      why: Zitkala-Sa's long hair was cut against her will.
    - label: An elder carrying vadai by its string
      bin: Bama
      clue: A Tamil village.
      why: Bama sees untouchability in how he carries the food.
    - label: Hides under a bed
      bin: Zitkala-Sa
      clue: Trying to escape the scissors.
      why: She hid to avoid the haircut, but was dragged out.
    - label: Her elder brother says study hard
      bin: Bama
      clue: Annan.
      why: Annan tells Bama education will earn her respect.
    - label: Comes first in her class
      bin: Bama
      clue: After her brother's advice.
      why: Bama studies hard and comes first.
    - label: Feels like an animal driven by a herder
      bin: Zitkala-Sa
      clue: Tied to a chair.
      why: Losing her hair, Zitkala-Sa feels her spirit crushed.
  lesson:
    - teach: '''Memories of Childhood'' has two autobiographical extracts by women from marginalised communities. In ''The Cutting of My Long Hair'', Zitkala-Sa, a Native American writer, recalls her first day at the Carlisle Indian School. The tight-fitting clothes felt immodest, the bells and rules of the noisy dining hall confused her, and she did not know the customs.'
      check:
        prompt: What did Zitkala-Sa feel on her first day at school?
        options:
        - confused, ashamed and frightened
        - excited and happy
        - bored
        answer: confused, ashamed and frightened
        why: Everything was strange and against her culture.
      ways:
      - style: visual
        teach: The two extracts and the injustice each child faces.
        picture:
          kind: compare
          columns:
          - title: Zitkala-Sa
            points:
            - Native American girl
            - Boarding school forces new customs
            - Loss of culture and dignity
          - title: Bama
            points:
            - Tamil Dalit girl
            - Sees caste untouchability
            - Humiliation of her community
          alt: Zitkala-Sa is a Native American girl whose boarding school forces new customs on her, causing a loss of culture and dignity. Bama is a Tamil Dalit girl who sees caste untouchability and the humiliation of her community.
      - style: step_by_step
        teach: 'Step 1: Note Zitkala-Sa''s first day: strange clothes, bells, rules. Step 2: She does not know the customs. Step 3: Everyone watches when she makes mistakes. Step 4: The school treats her culture as something to be erased.'
    - teach: Her friend Judéwin warned that the school would cut their long hair. Among her people, short hair was worn by cowards and mourners. Zitkala-Sa hid under a bed in a dark room, but was found, dragged out, tied to a chair, and her long hair was shingled. She cried for her mother and felt like one of many little animals driven by a herder.
      picture:
        kind: flow
        steps:
        - warning from Judéwin
        - hides under a bed
        - found and dragged out
        - tied to a chair
        - hair cut, spirit hurt
        alt: What happened to Zitkala-Sa on the day her hair was cut.
      check:
        prompt: Why was cutting her hair so painful for Zitkala-Sa?
        options:
        - in her culture short hair meant cowardice or mourning
        - it was her birthday
        - the scissors were cold
        answer: in her culture short hair meant cowardice or mourning
        why: It attacked her identity and dignity.
      ways:
      - style: real_world
        teach: Being forced to give up something that carries your identity, your language, dress or hair, can feel like losing part of yourself. Zitkala-Sa's long hair meant dignity to her people.
      - style: step_by_step
        teach: 'Step 1: Judéwin warns about the haircut. Step 2: Zitkala-Sa knows short hair means cowardice or mourning among her people. Step 3: She hides but is found and tied down. Step 4: Her resistance shows courage, even though she loses.'
    - teach: In 'We Too Are Human Beings', Bama, a Tamil Dalit writer, remembers walking home in the third grade. She laughed at an elder of her street carrying a packet of vadai by its string without touching it, to give to a landlord. Her elder brother, Annan, explained that it was because of untouchability. He told her that if she studied and made progress, she could throw away such indignities. She studied hard and stood first in her class.
      picture:
        kind: compare
        columns:
        - title: Zitkala-Sa
          points:
          - Native American
          - school cuts her hair
          - resists, hides
        - title: Bama
          points:
          - Tamil Dalit
          - sees the vadai packet
          - studies to win respect
        alt: The two writers and how each faced discrimination.
      check:
        prompt: What did Annan say was the way to earn respect?
        options:
        - study and get educated
        - fight the landlord
        - leave the village
        answer: study and get educated
        why: Education could free her from humiliation.
      ways:
      - style: real_world
        teach: Bama's brother saw education as a way to win respect. Many first-generation learners in India today, from families once denied schooling, study hard for the same reason.
      - style: step_by_step
        teach: 'Step 1: Bama laughs at an elder holding a packet by its string. Step 2: Her brother explains it is because of untouchability. Step 3: She feels anger and hurt. Step 4: She decides to study hard, turning pain into determination.'
  items:
  - prompt: What was done to Zitkala-Sa at school that hurt her deeply?
    options:
    - her long hair was cut
    - she was not given food
    - she was sent home
    - her books were taken
    answer: her long hair was cut
    difficulty: 1
    hints:
    - Shingled.
    - Sign of cowards in her culture.
    solution: Her long hair was cut.
    mistakes: {"she was not given food": "e12_mc_zitkala", "she was sent home": "e12_mc_zitkala", "her books were taken": "e12_mc_zitkala"}
  - prompt: Bama belongs to which community?
    options:
    - Dalit
    - Brahmin
    - Native American
    - Sioux
    answer: Dalit
    difficulty: 1
    hints:
    - Tamil writer.
    - Faced untouchability.
    solution: "Bama is a Tamil writer from the Dalit community, and her memory shows how caste divides people."
    mistakes:
      Native American: eng12_read_again
  - prompt: How was the elder carrying the vadai?
    options:
    - by its string, without touching the packet
    - in his pocket
    - on his head
    - in a basket
    answer: by its string, without touching the packet
    difficulty: 2
    hints:
    - For a landlord.
    - Untouchability.
    solution: Holding it by the string so as not to touch it.
    mistakes: {"in his pocket": "e12_mc_vadai", "on his head": "e12_mc_vadai", "in a basket": "e12_mc_vadai"}
  - prompt: What advice did Bama's brother give her?
    options:
    - study hard, because education wins respect
    - leave the village
    - fight the landlord
    - stop going to school
    answer: study hard, because education wins respect
    difficulty: 2
    hints:
    - Annan.
    - Education.
    solution: To study hard and earn respect through education.
    mistakes: {"leave the village": "e12_mc_brother", "fight the landlord": "e12_mc_brother", "stop going to school": "e12_mc_brother"}
  - prompt: 'Zitkala-Sa felt that cutting her hair was like being treated as:'
    options:
    - an animal driven by a herder
    - a queen
    - a teacher
    - a soldier
    answer: an animal driven by a herder
    difficulty: 2
    hints:
    - Lost her spirit.
    - Herded.
    solution: An animal driven by a herder.
    mistakes: {"a queen": "e12_mc_herd", "a teacher": "e12_mc_herd", "a soldier": "e12_mc_herd"}
  - prompt: 'Both extracts deal with:'
    options:
    - discrimination against marginalised communities
    - travel adventures
    - sports
    - science
    answer: discrimination against marginalised communities
    difficulty: 1
    hints:
    - Oppression.
    - Resistance.
    solution: Discrimination and the struggle against it.
    mistakes:
      travel adventures: eng12_theme
  - prompt: Which friend warned Zitkala-Sa about the hair-cutting?
    options:
    - Judéwin
    - Annan
    - Louisa
    answer: Judéwin
    difficulty: 2
    hints:
    - She knew a little English.
    - She overheard the plan.
    solution: 'Step 1: a friend at school. Step 2: Judéwin.'
    mistakes:
      Annan: e12x19_who
      Louisa: e12x19_who
  - prompt: Where did Zitkala-Sa hide?
    options:
    - under a bed in a dark room
    - in a tree
    - in the kitchen
    answer: under a bed in a dark room
    difficulty: 1
    hints:
    - Upstairs, in a large room.
    - She crawled into a corner.
    solution: 'Step 1: she ran away. Step 2: hid under a bed.'
    mistakes:
      in a tree: e12x19_who
      in the kitchen: e12x19_who
  - prompt: Why did Zitkala-Sa feel embarrassed at the dining table?
    options:
    - she did not know the rules and began eating too early
    - the food was cold
    - she sat alone
    answer: she did not know the rules and began eating too early
    difficulty: 2
    hints:
    - A bell rang several times.
    - Others sat while she stood, or the other way round.
    solution: 'Step 1: new customs. Step 2: she started eating before the signal.'
    mistakes:
      the food was cold: e12x19_who
      she sat alone: e12x19_who
  - prompt: In which grade was Bama when she saw the elder with the vadai?
    options:
    - third
    - tenth
    - first
    answer: third
    difficulty: 2
    hints:
    - She was a young child.
    - Old enough to walk home alone, not yet in high school.
    solution: 'Step 1: primary school. Step 2: third grade.'
    mistakes:
      tenth: e12x19_who
      first: e12x19_who
  - prompt: Why did Bama first laugh at the elder?
    options:
    - the way he held the packet looked funny to her
    - he fell down
    - he told a joke
    answer: the way he held the packet looked funny to her
    difficulty: 1
    hints:
    - She did not understand yet.
    - He held it by a string.
    solution: 'Step 1: odd sight. Step 2: she later understood the insult.'
    mistakes:
      he fell down: e12x19_theme
      he told a joke: e12x19_theme
  - prompt: What did Bama feel after Annan explained the reason?
    options:
    - anger and a provoked sense of injustice
    - joy
    - nothing
    answer: anger and a provoked sense of injustice
    difficulty: 2
    hints:
    - She no longer found it funny.
    - She wanted to snatch the packet herself.
    solution: 'Step 1: understanding untouchability. Step 2: anger.'
    mistakes:
      joy: e12x19_theme
      nothing: e12x19_theme
  - prompt: Which community did Zitkala-Sa belong to?
    options:
    - Native American (Sioux)
    - Tamil Dalit
    - Japanese
    answer: Native American (Sioux)
    difficulty: 1
    hints:
    - She went to the Carlisle Indian School.
    - Not Indian as in India.
    solution: 'Step 1: American Indian tribe. Step 2: Sioux.'
    mistakes:
      Tamil Dalit: e12x19_who
      Japanese: e12x19_who
  - prompt: How did Bama do in school after Annan's advice?
    options:
    - she studied hard and stood first
    - she left school
    - she failed
    answer: she studied hard and stood first
    difficulty: 1
    hints:
    - She took his words to heart.
    - People came to respect her.
    solution: 'Step 1: determination. Step 2: first in class.'
    mistakes:
      she left school: e12x19_theme
      she failed: e12x19_theme
  - prompt: What do the two extracts have in common?
    options:
    - both show children facing discrimination and responding to it
    - both are set in India
    - both are about food
    answer: both show children facing discrimination and responding to it
    difficulty: 2
    hints:
    - One is in America, one in India.
    - Both are from marginalised communities.
    solution: 'Step 1: racial and caste prejudice. Step 2: resistance and dignity.'
    mistakes:
      both are set in India: e12x19_theme
      both are about food: e12x19_theme
  - prompt: 'Assertion (A): Bama studied hard after her brother''s advice.

      Reason (R): Annan told her that through education she could earn respect and throw away such indignities.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Her brother's words showed her a path to dignity, so she worked hard and came first. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Zitkala-Sa hides under a bed to avoid having her hair cut. What does this show about her?'
    options:
    - She resists the loss of her identity, even as a child
    - She was playing a game
    - She disliked her friend Judéwin
    answer: She resists the loss of her identity, even as a child
    hints:
    - What did long hair mean to her people?
    - Was she afraid or playful?
    solution: Her hiding is an act of resistance against having her culture stripped away.
    mistakes:
      She was playing a game: e12x19_who
      She disliked her friend Judéwin: e12x19_who
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your class discusses how each girl responds to injustice. Which comparison is accurate?'
    options:
    - Zitkala-Sa resists openly; Bama chooses education to fight it
    - Both accept it quietly
    - Both run away from school
    answer: Zitkala-Sa resists openly; Bama chooses education to fight it
    hints:
    - What does Zitkala-Sa do about the haircut?
    - What does Bama decide after talking to her brother?
    solution: Zitkala-Sa physically resists the haircut; Bama channels her anger into studying hard to earn respect.
    mistakes:
      Both accept it quietly: e12x19_theme
      Both run away from school: e12x19_theme
    exam: competency
    difficulty: 2
