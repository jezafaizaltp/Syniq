concepts:
- code: cbse12e.v6.memories
  title: Memories of Childhood (Zitkala-Sa and Bama)
  notes: |
    Two autobiographical extracts by women from marginalised communities. 'The Cutting of My Long Hair' by Zitkala-Sa (Gertrude
    Simmons Bonnin), a Native American (Sioux) writer: on her first day at the Carlisle Indian School she is shocked by the tight
    clothes, the noisy dining-hall rules and the plan to shingle (cut) her long hair, which among her people only cowards or mourners
    had. She hides under a bed but is dragged out, tied to a chair and her hair is cut; she feels like an animal driven by a herder,
    her spirit crushed. 'We Too Are Human Beings' by Bama, a Tamil Dalit writer: as a child in the third grade she sees an elder of
    her community carrying a packet of vadai by its string, not touching it, for a landlord, and learns from her elder brother
    (Annan) that this is because of untouchability. He tells her that education is the way to earn respect; she studies hard and
    comes first. Themes: discrimination, cultural oppression, resistance.
  explanations:
    text: Two women recall childhood experiences of discrimination. Zitkala-Sa, a Native American girl, has her long hair forcibly cut at a boarding school that tried to erase her culture. Bama, a Dalit girl in Tamil Nadu, sees an elder carry food by a string to avoid 'polluting' it, and her brother tells her that education is the way to win respect.
    visual: Picture a small Native American girl hiding under a bed as teachers search for her with scissors; then a Tamil village street where a girl watches an elderly man holding a packet of vadai by its string, at arm's length.
    step_by_step: 'Step 1: Zitkala-Sa''s first day at school. Step 2: The cutting of her hair and what it meant. Step 3: Bama sees the elder with the vadai. Step 4: Annan explains untouchability. Step 5: Bama''s resolve to study.'
    real_world: India's Constitution abolished untouchability, but stories like Bama's show why education and awareness are still needed.
