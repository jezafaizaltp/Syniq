subject: cbse12-eng
chapter: 13
title: Aunt Jennifer's Tigers (Adrienne Rich)
tips:
  e12_aj_after: "Art lasts beyond the artist. What will the tigers still be doing on the panel?"
  e12_aj_colour: "The poet calls them a gemstone colour. Which stone, and what colour is it?"
  e12_aj_make: "Aunt Jennifer's fingers move through wool on a panel. What does she sew, and which animals are on it?"
  e12_aj_poet: "The poet is an American woman writing about a woman trapped in marriage. Which name fits?"
  e12_aj_tigers: "The tigers are the opposite of Aunt Jennifer, who is scared of her husband. How do the tigers feel?"

concepts:
- code: cbse12e.f13.tigers
  title: Aunt Jennifer's Tigers (Adrienne Rich)
  notes: |
    Aunt Jennifer embroiders tigers on a screen (panel): bright topaz denizens of a world of green, prancing proud and unafraid,
    pacing in chivalric certainty, not fearing the men beneath the tree. Her fingers flutter through the wool and find even the ivory
    needle hard to pull; "the massive weight of Uncle's wedding band sits heavily upon Aunt Jennifer's hand". When she dies, her
    terrified hands will still lie ringed with the ordeals she was mastered by, while the tigers she made will go on prancing, proud
    and unafraid. Themes: oppression of women in marriage, art as escape and self-expression; contrast between the timid aunt and the
    fearless tigers. Rhyming couplets (aabb).
  explanations:
    text: Aunt Jennifer stitches bold, fearless tigers on a screen, but she herself is timid and weighed down by an unhappy marriage, symbolised by her husband's heavy wedding ring. The tigers express the freedom and courage she lacks, and they will live on after her.
    visual: Picture trembling hands with a heavy gold ring, slowly stitching bright yellow tigers that leap proudly across a green panel.
    step_by_step: 'Step 1: The tigers: bright, proud, fearless. Step 2: Aunt Jennifer''s fluttering, weak hands. Step 3: The heavy wedding band as a symbol. Step 4: Her death, hands still ''ringed with ordeals''. Step 5: The tigers going on forever.'
    real_world: Art and craft have long been a way for women to express feelings they couldn't say aloud.
  picture:
    kind: compare
    columns:
    - title: Aunt Jennifer
      points:
      - timid, terrified
      - weighed down by marriage
      - will die
    - title: Her tigers
      points:
      - proud, unafraid
      - free in a green world
      - will go on prancing
    alt: Aunt Jennifer and her tigers contrasted.
  activity:
    type: sort
    prompt: 'Aunt Jennifer''s Tigers: Aunt Jennifer or the tigers she sews?'
    bins:
    - Aunt Jennifer
    - Her tigers
    items:
    - label: Prancing proud and unafraid
      bin: Her tigers
      clue: Bright topaz animals on the screen.
      why: 'The tigers she makes are fearless: everything she can''t be.'
    - label: Fingers fluttering through the wool
      bin: Aunt Jennifer
      clue: Shaky, nervous movement.
      why: Her hands tremble; she is timid.
    - label: Not fearing the men beneath the tree
      bin: Her tigers
      clue: Who is unafraid of men?
      why: The tigers don't fear men; she does.
    - label: Weighed down by Uncle's wedding band
      bin: Aunt Jennifer
      clue: A ring that feels heavy.
      why: The heavy ring shows the weight of her marriage on her.
    - label: Will go on after she dies
      bin: Her tigers
      clue: Art outlasts the artist.
      why: 'When she dies the tigers keep prancing: her art outlives her.'
    - label: Ringed with ordeals she was mastered by
      bin: Aunt Jennifer
      clue: Even in death.
      why: 'Her dead hands still wear the ring: she was ruled all her life.'
  items:
  - prompt: What does Aunt Jennifer make?
    options:
    - an embroidered screen with tigers
    - a painting of lions
    - a wooden carving
    - a poem
    answer: an embroidered screen with tigers
    difficulty: 1
    hints:
    - Needlework.
    - Panel.
    solution: An embroidered screen of tigers.
    mistakes: {"a painting of lions": "e12_aj_make", "a wooden carving": "e12_aj_make", "a poem": "e12_aj_make"}
  - prompt: 'The tigers are described as:'
    options:
    - proud and unafraid
    - sleepy and lazy
    - hungry and angry
    - small and scared
    answer: proud and unafraid
    difficulty: 1
    hints:
    - Prancing.
    - Fearless.
    solution: Proud and unafraid.
    mistakes: {"sleepy and lazy": "e12_aj_tigers", "hungry and angry": "e12_aj_tigers", "small and scared": "e12_aj_tigers"}
  - prompt: What does 'Uncle's wedding band' symbolise?
    options:
    - the burden of an oppressive marriage
    - wealth and happiness
    - a family heirloom only
    - love and freedom
    answer: the burden of an oppressive marriage
    difficulty: 2
    hints:
    - '''Massive weight''.'
    - Heavy on her hand.
    solution: The burden of an oppressive marriage.
    mistakes:
      wealth and happiness: eng12_poem_meaning
  - prompt: What colour are the tigers?
    options:
    - topaz (bright yellow)
    - white
    - black
    - blue
    answer: topaz (bright yellow)
    difficulty: 2
    hints:
    - A gemstone.
    - Golden.
    solution: Topaz, bright yellow.
    mistakes: {"white": "e12_aj_colour", "black": "e12_aj_colour", "blue": "e12_aj_colour"}
  - prompt: 'After Aunt Jennifer dies, the tigers will:'
    options:
    - go on prancing, proud and unafraid
    - fade away
    - be burnt
    - turn grey
    answer: go on prancing, proud and unafraid
    difficulty: 1
    hints:
    - Art outlives the artist.
    - Final lines.
    solution: Keep prancing, proud and unafraid.
    mistakes: {"fade away": "e12_aj_after", "be burnt": "e12_aj_after", "turn grey": "e12_aj_after"}
  - prompt: Who wrote 'Aunt Jennifer's Tigers'?
    options:
    - Adrienne Rich
    - Kamala Das
    - Elizabeth Jennings
    - Robert Frost
    answer: Adrienne Rich
    difficulty: 2
    hints:
    - American feminist poet.
    - Adrienne.
    solution: Adrienne Rich.
    mistakes: {"Kamala Das": "e12_aj_poet", "Elizabeth Jennings": "e12_aj_poet", "Robert Frost": "e12_aj_poet"}
