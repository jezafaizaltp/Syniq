# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 13.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 13
title: Aunt Jennifer's Tigers (Adrienne Rich)
tips:
  e12_aj_after: "Art lasts beyond the artist. What will the tigers still be doing on the panel?"
  e12_aj_colour: "The poet calls them a gemstone colour. Which stone, and what colour is it?"
  e12_aj_make: "Aunt Jennifer's fingers move through wool on a panel. What does she sew, and which animals are on it?"
  e12_aj_poet: "The poet is an American woman writing about a woman trapped in marriage. Which name fits?"
  e12_aj_tigers: "The tigers are the opposite of Aunt Jennifer, who is scared of her husband. How do the tigers feel?"
  e12x13_contrast: 'Contrast the two: the tigers are proud, free and unafraid; Aunt Jennifer is timid, weighed down and afraid.'
  e12x13_symbol: 'Ask what each symbol stands for: the tigers (her wish for freedom), the wedding band (the weight of marriage), the needle (her struggle).'

concepts:
- code: cbse12e.f13.tigers
  title: Aunt Jennifer's Tigers (Adrienne Rich)
  notes: |
    Aunt Jennifer embroiders tigers on a screen (panel): bright topaz denizens of a world of green, prancing proud and unafraid,
    pacing in chivalric certainty, not fearing the men beneath the tree. Her fingers flutter through the wool and find even the ivory
    needle hard to pull; "the massive weight of Uncle's wedding band sits heavily upon Aunt Jennifer's hand". When she dies, her
    terrified hands will still lie ringed with the ordeals she was mastered by, while the tigers she made will go on prancing, proud
    and unafraid. Themes: oppression of women in marriage, art as escape and self-expression; contrast between the timid aunt and the
    fearless tigers. Rhyming couplets (aabb).
  explanations:
    text: Aunt Jennifer stitches bold, fearless tigers on a screen, but she herself is timid and weighed down by an unhappy marriage, symbolised by her husband's heavy wedding ring. The tigers express the freedom and courage she lacks, and they will live on after her.
    visual: Picture trembling hands with a heavy gold ring, slowly stitching bright yellow tigers that leap proudly across a green panel.
    step_by_step: 'Step 1: The tigers: bright, proud, fearless. Step 2: Aunt Jennifer''s fluttering, weak hands. Step 3: The heavy wedding band as a symbol. Step 4: Her death, hands still ''ringed with ordeals''. Step 5: The tigers going on forever.'
    real_world: Art and craft have long been a way for women to express feelings they couldn't say aloud.
  picture:
    kind: compare
    columns:
    - title: Aunt Jennifer
      points:
      - timid, terrified
      - weighed down by marriage
      - will die
    - title: Her tigers
      points:
      - proud, unafraid
      - free in a green world
      - will go on prancing
    alt: Aunt Jennifer and her tigers contrasted.
  activity:
    type: sort
    prompt: 'Aunt Jennifer''s Tigers: Aunt Jennifer or the tigers she sews?'
    bins:
    - Aunt Jennifer
    - Her tigers
    items:
    - label: Prancing proud and unafraid
      bin: Her tigers
      clue: Bright topaz animals on the screen.
      why: 'The tigers she makes are fearless: everything she can''t be.'
    - label: Fingers fluttering through the wool
      bin: Aunt Jennifer
      clue: Shaky, nervous movement.
      why: Her hands tremble; she is timid.
    - label: Not fearing the men beneath the tree
      bin: Her tigers
      clue: Who is unafraid of men?
      why: The tigers don't fear men; she does.
    - label: Weighed down by Uncle's wedding band
      bin: Aunt Jennifer
      clue: A ring that feels heavy.
      why: The heavy ring shows the weight of her marriage on her.
    - label: Will go on after she dies
      bin: Her tigers
      clue: Art outlasts the artist.
      why: 'When she dies the tigers keep prancing: her art outlives her.'
    - label: Ringed with ordeals she was mastered by
      bin: Aunt Jennifer
      clue: Even in death.
      why: 'Her dead hands still wear the ring: she was ruled all her life.'
  lesson:
    - teach: 'In Adrienne Rich''s poem, Aunt Jennifer embroiders tigers on a screen. They prance across it, bright topaz denizens of a world of green. They do not fear the men beneath the tree; they pace in sleek chivalric certainty. The tigers are everything she is not: bold, proud and free.'
      check:
        prompt: Why are the tigers described as not fearing 'the men beneath the tree'?
        options:
        - they are confident and free, unlike Aunt Jennifer
        - the men are friends
        - the men are asleep
        answer: they are confident and free, unlike Aunt Jennifer
        why: They show the freedom she lacks.
      ways:
      - style: visual
        teach: The tigers and Aunt Jennifer, side by side.
        picture:
          kind: compare
          columns:
          - title: The tigers
            points:
            - Bold, bright, proud
            - Unafraid of men
            - Free
          - title: Aunt Jennifer
            points:
            - Timid, fluttering fingers
            - Weighed down by marriage
            - Not free
          alt: The tigers are bold, bright and proud, unafraid of men, and free. Aunt Jennifer has timid, fluttering fingers, is weighed down by her marriage, and is not free.
      - style: real_world
        teach: 'People sometimes express in art what they can''t say aloud: a quiet student who writes brave stories, or someone who paints bright colours during a hard time. Aunt Jennifer''s tigers are her hidden courage.'
    - teach: Aunt Jennifer's fingers flutter through the wool; she finds even the ivory needle hard to pull. The massive weight of Uncle's wedding band sits heavily upon her hand. The ring stands for the burden and control of an unhappy marriage.
      picture:
        kind: compare
        columns:
        - title: Tigers
          points:
          - proud
          - unafraid
          - free
          - prancing
        - title: Aunt Jennifer
          points:
          - timid
          - terrified hands
          - weighed down
          - fluttering fingers
        alt: The tigers and Aunt Jennifer contrasted.
      check:
        prompt: Why are Aunt Jennifer's fingers 'fluttering'?
        options:
        - she is nervous and afraid
        - she is cold
        - she is dancing
        answer: she is nervous and afraid
        why: Her life has made her timid.
      ways:
      - style: step_by_step
        teach: 'Step 1: Notice the wedding band is ''massive'' and heavy. Step 2: A ring is light, so the weight is not physical. Step 3: It stands for the burden of an unhappy marriage. Step 4: Even pulling the needle feels hard because of it.'
      - style: real_world
        teach: 'We say a person ''carries the weight of the world'' when they''re stressed. Rich uses the ring the same way: a small object made heavy by what it represents.'
    - teach: When she dies, her terrified hands will still lie ringed with the ordeals she was mastered by. But the tigers in the panel she made will go on prancing, proud and unafraid. Art outlives the artist and expresses the freedom she never had. The poem is in rhyming couplets (aabb).
      check:
        prompt: What does the poem suggest about art?
        options:
        - it outlives the artist and expresses hidden dreams
        - it is useless
        - it dies with the artist
        answer: it outlives the artist and expresses hidden dreams
        why: The tigers live on after her.
      ways:
      - style: visual
        teach: 'What lasts after Aunt Jennifer dies: her ringed hands and her tigers.'
        picture:
          kind: compare
          columns:
          - title: Aunt Jennifer
            points:
            - Hands still ringed
            - Marked by her ordeals
            - Mastered even in death
          - title: Her tigers
            points:
            - Go on prancing
            - Proud and unafraid
            - Her art outlives her
          alt: 'Aunt Jennifer''s hands are still ringed and marked by her ordeals, mastered even in death. Her tigers go on prancing, proud and unafraid: her art outlives her.'
      - style: step_by_step
        teach: 'Step 1: Note the rhyming couplets (aabb). Step 2: Their neat, regular pattern feels controlled. Step 3: Compare with the bold content about freedom. Step 4: Form and meaning together mirror her controlled life and free imagination.'
  items:
  - prompt: What does Aunt Jennifer make?
    options:
    - an embroidered screen with tigers
    - a painting of lions
    - a wooden carving
    - a poem
    answer: an embroidered screen with tigers
    difficulty: 1
    hints:
    - Needlework.
    - Panel.
    solution: An embroidered screen of tigers.
    mistakes: {"a painting of lions": "e12_aj_make", "a wooden carving": "e12_aj_make", "a poem": "e12_aj_make"}
  - prompt: 'The tigers are described as:'
    options:
    - proud and unafraid
    - sleepy and lazy
    - hungry and angry
    - small and scared
    answer: proud and unafraid
    difficulty: 1
    hints:
    - Prancing.
    - Fearless.
    solution: Proud and unafraid.
    mistakes: {"sleepy and lazy": "e12_aj_tigers", "hungry and angry": "e12_aj_tigers", "small and scared": "e12_aj_tigers"}
  - prompt: What does 'Uncle's wedding band' symbolise?
    options:
    - the burden of an oppressive marriage
    - wealth and happiness
    - a family heirloom only
    - love and freedom
    answer: the burden of an oppressive marriage
    difficulty: 2
    hints:
    - '''Massive weight''.'
    - Heavy on her hand.
    solution: The burden of an oppressive marriage.
    mistakes:
      wealth and happiness: eng12_poem_meaning
  - prompt: What colour are the tigers?
    options:
    - topaz (bright yellow)
    - white
    - black
    - blue
    answer: topaz (bright yellow)
    difficulty: 2
    hints:
    - A gemstone.
    - Golden.
    solution: Topaz, bright yellow.
    mistakes: {"white": "e12_aj_colour", "black": "e12_aj_colour", "blue": "e12_aj_colour"}
  - prompt: 'After Aunt Jennifer dies, the tigers will:'
    options:
    - go on prancing, proud and unafraid
    - fade away
    - be burnt
    - turn grey
    answer: go on prancing, proud and unafraid
    difficulty: 1
    hints:
    - Art outlives the artist.
    - Final lines.
    solution: Keep prancing, proud and unafraid.
    mistakes: {"fade away": "e12_aj_after", "be burnt": "e12_aj_after", "turn grey": "e12_aj_after"}
  - prompt: Who wrote 'Aunt Jennifer's Tigers'?
    options:
    - Adrienne Rich
    - Kamala Das
    - Elizabeth Jennings
    - Robert Frost
    answer: Adrienne Rich
    difficulty: 2
    hints:
    - American feminist poet.
    - Adrienne.
    solution: Adrienne Rich.
    mistakes: {"Kamala Das": "e12_aj_poet", "Elizabeth Jennings": "e12_aj_poet", "Robert Frost": "e12_aj_poet"}
  - prompt: '''Denizens'' in ''topaz denizens of a world of green'' means:'
    options:
    - inhabitants
    - enemies
    - colours
    answer: inhabitants
    difficulty: 2
    hints:
    - The tigers live in the green world.
    - It is a formal word for residents.
    solution: 'Step 1: those who live there. Step 2: inhabitants.'
    mistakes:
      enemies: e12x13_symbol
      colours: e12x13_symbol
  - prompt: What does 'chivalric certainty' suggest about the tigers?
    options:
    - they move with the confidence of knights
    - they are uncertain
    - they are hunting
    answer: they move with the confidence of knights
    difficulty: 3
    hints:
    - Chivalry belongs to knights.
    - Certainty means no doubt.
    solution: 'Step 1: noble, sure movement. Step 2: like knights.'
    mistakes:
      they are uncertain: e12x13_contrast
      they are hunting: e12x13_contrast
  - prompt: Why does Aunt Jennifer find the needle hard to pull?
    options:
    - the burden of her marriage weighs on her
    - the needle is broken
    - the cloth is too thick
    answer: the burden of her marriage weighs on her
    difficulty: 2
    hints:
    - Look at the next line about the ring.
    - The weight is not physical.
    solution: 'Step 1: emotional weight. Step 2: her marriage''s burden.'
    mistakes:
      the needle is broken: e12x13_symbol
      the cloth is too thick: e12x13_symbol
  - prompt: What material is the needle made of?
    options:
    - ivory
    - steel
    - gold
    answer: ivory
    difficulty: 1
    hints:
    - It is light, yet she finds it heavy.
    - It comes from elephant tusks.
    solution: 'Step 1: a light needle. Step 2: ivory.'
    mistakes:
      steel: e12x13_symbol
      gold: e12x13_symbol
  - prompt: '''Ringed with ordeals'' suggests her hands are:'
    options:
    - marked by the hardships of her married life
    - covered in jewellery
    - full of tools
    answer: marked by the hardships of her married life
    difficulty: 2
    hints:
    - The ring is the wedding band.
    - Ordeals are painful experiences.
    solution: 'Step 1: ring = marriage. Step 2: ordeals = suffering.'
    mistakes:
      covered in jewellery: e12x13_symbol
      full of tools: e12x13_symbol
  - prompt: 'The tigers mainly symbolise:'
    options:
    - Aunt Jennifer's hidden wish for freedom and courage
    - danger in the forest
    - Uncle's power
    answer: Aunt Jennifer's hidden wish for freedom and courage
    difficulty: 2
    hints:
    - She creates them.
    - They are what she cannot be.
    solution: 'Step 1: her art expresses her. Step 2: wish for freedom.'
    mistakes:
      danger in the forest: e12x13_symbol
      Uncle's power: e12x13_symbol
  - prompt: 'The poem''s rhyme scheme is:'
    options:
    - aabb
    - abab
    - no rhyme
    answer: aabb
    difficulty: 2
    hints:
    - Look at the end words of lines 1 and 2.
    - They are rhyming couplets.
    solution: 'Step 1: lines rhyme in pairs. Step 2: aabb.'
    mistakes:
      abab: e12x13_contrast
      no rhyme: e12x13_contrast
  - prompt: 'A major theme of the poem is:'
    options:
    - the oppression of women in marriage
    - tiger conservation
    - the joy of sewing
    answer: the oppression of women in marriage
    difficulty: 1
    hints:
    - Think of the wedding band.
    - And of her terrified hands.
    solution: 'Step 1: marriage weighs her down. Step 2: oppression.'
    mistakes:
      tiger conservation: e12x13_contrast
      the joy of sewing: e12x13_contrast
  - prompt: Who is the speaker of the poem, most likely?
    options:
    - a niece or nephew observing Aunt Jennifer
    - Uncle
    - a tiger
    answer: a niece or nephew observing Aunt Jennifer
    difficulty: 2
    hints:
    - Look at how she is named.
    - The speaker calls her 'Aunt'.
    solution: 'Step 1: she is called Aunt. Step 2: a younger relative watching.'
    mistakes:
      Uncle: e12x13_contrast
      a tiger: e12x13_contrast
  - prompt: 'Assertion (A): Aunt Jennifer''s tigers will continue prancing after her death.

      Reason (R): Art outlives the artist and keeps expressing the freedom she longed for.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: The embroidered tigers survive her, carrying her spirit of freedom. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Aunt Jennifer''s fingers find even the ivory needle hard to pull. What does this detail show?'
    options:
    - She is weighed down and nervous in her married life
    - The needle is broken
    - She is a beginner at embroidery
    answer: She is weighed down and nervous in her married life
    hints:
    - What sits heavily on her hand?
    - Is the problem the needle or her life?
    solution: The difficulty comes from the heavy burden of her marriage, symbolised by the wedding band.
    mistakes:
      The needle is broken: e12x13_symbol
      She is a beginner at embroidery: e12x13_symbol
    exam: case
    difficulty: 2
  - prompt: 'Situation: A reader asks why the poet chose tigers rather than, say, flowers. Which answer is best?'
    options:
    - Tigers stand for strength and fearlessness that she lacks
    - Tigers are easy to embroider
    - She had seen tigers in a zoo
    answer: Tigers stand for strength and fearlessness that she lacks
    hints:
    - How are the tigers described?
    - How is Aunt Jennifer described?
    solution: The tigers' boldness contrasts with her timidity, expressing the free self she cannot be.
    mistakes:
      Tigers are easy to embroider: e12x13_contrast
      She had seen tigers in a zoo: e12x13_contrast
    exam: competency
    difficulty: 2
