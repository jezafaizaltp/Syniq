# CBSE Class 12 English (NCERT Vistas, supplementary reader, rationalised syllabus), chapter 17.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 17
title: The Enemy (Pearl S. Buck)
tips:
  e12_en_escape: "Sadao gave the man food and pointed him to a nearby place across the water. How would he get there?"
  e12_en_hana: "Sadao's wife is Japanese too, and helped wash the soldier. Which is a Japanese name?"
  e12_en_sadao: "The enemy is an American sailor washed up near Sadao's house in wartime. So what is Sadao?"
  e12_en_servants: "The servants feared trouble for hiding the enemy. Was their reason money, illness or loyalty to Japan?"
  e12x17_text: 'Place the event: finding the man on the shore, the operation, the servants leaving, the General''s promise, or the escape by boat.'
  e12x17_theme: 'Weigh Sadao''s two duties: as a Japanese citizen at war, and as a doctor sworn to save life.'

concepts:
- code: cbse12e.v4.enemy
  title: The Enemy (Pearl S. Buck)
  notes: |
    During the Second World War, Dr Sadao Hoki, a Japanese surgeon trained in America, lives by the sea with his wife Hana. One misty
    evening they find a wounded American prisoner of war washed up on the shore. Torn between duty to his country and his duty as a
    doctor, Sadao operates and saves him; Hana nurses him. The servants (Yumi refuses to wash him) leave in protest. Sadao tells the
    old General, whom he is treating, and the General promises to send assassins, but forgets, being preoccupied with his own health.
    Sadao helps the American escape by boat to a nearby island, giving him food, clothes and a flashlight signal plan. The man
    escapes. Themes: humanity versus patriotism, professional ethics, compassion.
  explanations:
    text: 'Dr Sadao, a Japanese surgeon, finds a wounded American soldier, an enemy, washed up near his house during the Second World War. His duty as a doctor wins over his duty to his country: he saves the man''s life, risking his own, and then helps him escape by boat.'
    visual: Picture a misty Japanese beach at dusk, a doctor and his wife kneeling over a wounded stranger in an American uniform, deciding whether to help or hand him over.
    step_by_step: 'Step 1: Sadao and Hana find the American. Step 2: The dilemma: doctor or patriot? Step 3: The operation and the servants leaving. Step 4: The General''s promise of assassins. Step 5: Sadao helps the man escape.'
    real_world: Doctors in war zones today treat wounded people from all sides, following the same ethic as Sadao.
  picture:
    kind: flow
    steps:
    - Wounded American washes ashore
    - Sadao operates and saves him
    - Servants leave in protest
    - General forgets to send assassins
    - Sadao helps him escape by boat
    alt: 'The Enemy: Sadao saves the enemy soldier and helps him escape.'
  activity:
    type: sort
    prompt: 'The Enemy: which duty is Sadao or his household following?'
    bins:
    - Duty as a doctor
    - Duty to country
    items:
    - label: Operating on the wounded American
      bin: Duty as a doctor
      clue: Saving a life.
      why: 'A doctor saves any life, even an enemy''s: medical duty.'
    - label: Telling the General about him
      bin: Duty to country
      clue: Reporting a prisoner.
      why: Reporting an enemy is a citizen's duty to Japan.
    - label: Hana washing and nursing him
      bin: Duty as a doctor
      clue: Care for the sick.
      why: Nursing continues the care Sadao began.
    - label: The servants leaving in protest
      bin: Duty to country
      clue: They won't help an enemy.
      why: The servants put country first.
    - label: Helping him escape by boat
      bin: Duty as a doctor
      clue: Protecting the life he saved.
      why: He saved the man once; letting him be killed would undo that.
  lesson:
    - teach: Pearl S. Buck's 'The Enemy' is set in Japan during the Second World War. Dr Sadao Hoki, a surgeon who studied in America, lives in a house by the sea with his wife Hana. One misty evening they see a man washed up on the shore, badly wounded. From his cap and clothes they realise he is an American prisoner of war who has escaped.
      check:
        prompt: Why was finding the American a dangerous problem for Sadao?
        options:
        - sheltering an enemy in wartime could get him arrested
        - the man was a famous doctor
        - the sea was too rough
        answer: sheltering an enemy in wartime could get him arrested
        why: Japan and America were at war.
      ways:
      - style: visual
        teach: 'The two sides of Dr Sadao''s dilemma: citizen at war and doctor.'
        picture:
          kind: compare
          columns:
          - title: As a Japanese citizen
            points:
            - The man is an enemy
            - Should hand him over
            - Risk of arrest for helping
          - title: As a doctor
            points:
            - A wounded man needs help
            - Duty to save life
            - Cannot let him die
          alt: As a Japanese citizen, Sadao sees the man as an enemy to hand over and risks arrest for helping. As a doctor, he sees a wounded man needing help and feels a duty to save life.
      - style: real_world
        teach: Doctors in war zones today, like those working with the Red Cross, treat injured soldiers from both sides. Their oath puts saving life above taking sides, the same choice Sadao makes.
    - teach: 'Sadao''s duty as a doctor wins: he brings the man home and operates to remove a bullet. Hana nurses him and even washes him when the maid Yumi refuses. The servants, afraid and disapproving, leave the house. Sadao is torn between patriotism and his professional duty to save life.'
      picture:
        kind: compare
        columns:
        - title: Duty to country
          points:
          - he is the enemy
          - hand him over
          - servants agree
        - title: Duty as doctor
          points:
          - he is wounded
          - save his life
          - Hana helps
        alt: Sadao's two conflicting duties.
      check:
        prompt: Why did Hana wash the American herself?
        options:
        - the maid Yumi refused to
        - Sadao ordered her to
        - she wanted to hurt him
        answer: the maid Yumi refused to
        why: Yumi would not touch an enemy.
      ways:
      - style: step_by_step
        teach: 'Step 1: Sadao operates to remove the bullet. Step 2: Hana helps despite her fear. Step 3: The servants leave in protest. Step 4: The couple''s humanity costs them the comfort and approval of their household.'
      - style: real_world
        teach: Sometimes doing the right thing makes you unpopular, like standing up for a classmate being bullied when friends disagree. Hana and Sadao face the servants' anger but continue.
    - teach: 'Sadao tells the old General, whom he is treating. The General, who needs Sadao for his surgery, promises to send private assassins to kill the man quietly, but forgets, busy with his own illness. Sadao then helps the American escape: he gives him his boat, food, clothes and a flashlight, and tells him to row to a nearby island and wait for a Korean fishing boat. The man escapes.'
      picture:
        kind: flow
        steps:
        - man found on shore
        - Sadao operates
        - servants leave
        - General promises assassins, forgets
        - escape by boat
        alt: The main events of 'The Enemy'.
      check:
        prompt: Why did the General forget to send the assassins?
        options:
        - he was too absorbed in his own illness
        - Sadao bribed him
        - he liked Americans
        answer: he was too absorbed in his own illness
        why: His self-interest outweighed the matter.
      ways:
      - style: step_by_step
        teach: 'Step 1: Sadao reports the man to the General. Step 2: The General promises assassins but forgets. Step 3: Sadao plans the escape himself: boat, food, clothes, a light. Step 4: He chooses life for the man while keeping his own position safe.'
      - style: real_world
        teach: The General needs Sadao for his own operation, so he protects him. This shows how self-interest, not principle, often guides those in power, in contrast to Sadao's quiet conscience.
  items:
  - prompt: What is Dr Sadao's nationality?
    options:
    - Japanese
    - American
    - Chinese
    - British
    answer: Japanese
    difficulty: 1
    hints:
    - Lives by the sea in Japan.
    - Trained in America.
    solution: "Dr Sadao Hoki is Japanese, and the story takes place in Japan during the war with America."
    mistakes: {"American": "e12_en_sadao", "Chinese": "e12_en_sadao", "British": "e12_en_sadao"}
  - prompt: Who was the man found on the shore?
    options:
    - "a wounded American prisoner of war"
    - "a badly wounded Japanese soldier"
    - "a fisherman lost at sea in a storm"
    - "a spy sent secretly from China"
    answer: a wounded American prisoner of war
    difficulty: 1
    hints:
    - Enemy.
    - Escaped prisoner.
    solution: "The man washed up on the shore was an American prisoner of war who had escaped, badly wounded."
    mistakes:
      "a badly wounded Japanese soldier": eng12_read_again
  - prompt: What is Sadao's wife's name?
    options:
    - Hana
    - Yumi
    - Louisa
    - Edla
    answer: Hana
    difficulty: 1
    hints:
    - Helps nurse him.
    - Her name has four letters and begins with H.
    solution: "Sadao's wife is Hana; together they care for the wounded American."
    mistakes: {"Yumi": "e12_en_hana", "Louisa": "e12_en_hana", "Edla": "e12_en_hana"}
  - prompt: Why did the servants leave?
    options:
    - "They didn't want to shelter an enemy"
    - "They weren't paid for many months"
    - "They were ill and had to go home"
    - "The General sent them all away"
    answer: They didn't want to shelter an enemy
    difficulty: 2
    hints:
    - Patriotic.
    - Protest.
    solution: They refused to serve in a house hiding an enemy.
    mistakes: {"They weren't paid for many months": "e12_en_servants", "They were ill and had to go home": "e12_en_servants", "The General sent them all away": "e12_en_servants"}
  - prompt: How did the American escape?
    options:
    - "by boat to a nearby island"
    - "by aeroplane from Tokyo"
    - "by train to the north"
    - "he didn't escape at all"
    answer: by boat to a nearby island
    difficulty: 2
    hints:
    - Sadao's plan.
    - Flashlight signal.
    solution: By boat to a nearby island.
    mistakes: {"by aeroplane from Tokyo": "e12_en_escape", "by train to the north": "e12_en_escape", "he didn't escape at all": "e12_en_escape"}
  - prompt: 'The story''s central conflict is between:'
    options:
    - "duty as a doctor and loyalty to one's country"
    - "the rich and the poor of the town"
    - "two brothers who want the same house"
    - "life in the town and in the village"
    answer: duty as a doctor and loyalty to one's country
    difficulty: 2
    hints:
    - Humanity versus patriotism.
    - Dilemma.
    solution: Professional duty and humanity versus patriotism.
    mistakes:
      "the rich and the poor of the town": eng12_theme
  - prompt: Where had Sadao studied medicine?
    options:
    - America
    - Germany
    - Korea
    answer: America
    difficulty: 1
    hints:
    - It made the situation more painful.
    - He had met Hana there.
    solution: 'Step 1: trained abroad. Step 2: in America.'
    mistakes:
      Germany: e12x17_text
      Korea: e12x17_text
  - prompt: How did Sadao and Hana know the man was an American prisoner?
    options:
    - "from his cap marked with prison letters and his clothes"
    - "he told them at once, in English, as soon as he woke up"
    - "a soldier came to the house that morning and told them"
    answer: from his cap marked with prison letters and his clothes
    difficulty: 2
    hints:
    - He was unconscious.
    - Clues on his clothing.
    solution: 'Step 1: he could not speak. Step 2: the cap and clothes gave him away.'
    mistakes:
      "he told them at once, in English, as soon as he woke up": e12x17_text
      "a soldier came to the house that morning and told them": e12x17_text
  - prompt: Why did the General not want Sadao arrested?
    options:
    - "only Sadao could perform his operation"
    - "Sadao was his own son"
    - "the General was himself American"
    answer: only Sadao could perform his operation
    difficulty: 2
    hints:
    - The General was ill.
    - He trusted no other surgeon.
    solution: 'Step 1: Sadao was indispensable. Step 2: so he was protected.'
    mistakes:
      "Sadao was his own son": e12x17_theme
      "the General was himself American": e12x17_theme
  - prompt: What signal did Sadao give the American to use if he needed help?
    options:
    - flash a light at sunset
    - send a pigeon
    - light a fire on the beach
    answer: flash a light at sunset
    difficulty: 2
    hints:
    - He gave him a flashlight.
    - Only at a particular time of day.
    solution: 'Step 1: flashlight given. Step 2: signal at sunset if in need.'
    mistakes:
      send a pigeon: e12x17_text
      light a fire on the beach: e12x17_text
  - prompt: Why did the servants leave the house?
    options:
    - "they disapproved of saving an enemy"
    - "they had not been paid for months"
    - "the house was flooded by the sea"
    answer: they disapproved of saving an enemy
    difficulty: 1
    hints:
    - They were loyal to Japan.
    - They also feared punishment.
    solution: 'Step 1: patriotism and fear. Step 2: they left.'
    mistakes:
      "they had not been paid for months": e12x17_text
      "the house was flooded by the sea": e12x17_text
  - prompt: What does the title 'The Enemy' make us ask?
    options:
    - "who the real enemy is: a person, or hatred and war"
    - "which army won the war in the end"
    - "who owned the boat that the man escaped in"
    answer: 'who the real enemy is: a person, or hatred and war'
    difficulty: 3
    hints:
    - The American is called the enemy.
    - But Sadao treats him as a patient.
    solution: 'Step 1: humanity crosses borders. Step 2: the real enemy is war and prejudice.'
    mistakes:
      "which army won the war in the end": e12x17_theme
      "who owned the boat that the man escaped in": e12x17_theme
  - prompt: Where did Sadao tell the American to go?
    options:
    - "to a small island nearby to wait for a Korean fishing boat"
    - "to the General's house, to ask him for help and safety"
    - "to Tokyo, to give himself up to the police there"
    answer: to a small island nearby to wait for a Korean fishing boat
    difficulty: 2
    hints:
    - He would row there.
    - A boat would pass by.
    solution: 'Step 1: island off the coast. Step 2: wait for a Korean fishing boat.'
    mistakes:
      "to the General's house, to ask him for help and safety": e12x17_text
      "to Tokyo, to give himself up to the police there": e12x17_text
  - prompt: What does Sadao's decision show about him?
    options:
    - he puts human life above prejudice
    - he does not love his country
    - he wanted a reward
    answer: he puts human life above prejudice
    difficulty: 1
    hints:
    - He still loved Japan.
    - But he could not let a man die.
    solution: 'Step 1: doctor''s ethics. Step 2: humanity first.'
    mistakes:
      he does not love his country: e12x17_theme
      he wanted a reward: e12x17_theme
  - prompt: Who wrote 'The Enemy'?
    options:
    - Pearl S. Buck
    - Susan Hill
    - Jack Finney
    answer: Pearl S. Buck
    difficulty: 1
    hints:
    - An American writer who grew up in China.
    - She won the Nobel Prize for Literature.
    solution: 'Step 1: Nobel laureate 1938. Step 2: Pearl S. Buck.'
    mistakes:
      Susan Hill: e12x17_text
      Jack Finney: e12x17_text
  - prompt: 'Assertion (A): The General did not have Sadao arrested for sheltering the American.

      Reason (R): The General needed Sadao, a skilled surgeon, for his own operation.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Self-interest made the General protect Sadao. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: The servants leave the house because Sadao is treating an enemy. What does their reaction show?'
    options:
    - "Wartime hatred and fear made them see the man only as an enemy"
    - "They had not been paid for months and wanted to leave anyway"
    - "They wanted to help the American but were afraid to say so"
    answer: Wartime hatred and fear made them see the man only as an enemy
    hints:
    - Who is the wounded man?
    - What did the servants fear?
    solution: War had taught them to hate Americans and fear punishment, so they refused to stay.
    mistakes:
      "They had not been paid for months and wanted to leave anyway": e12x17_text
      "They wanted to help the American but were afraid to say so": e12x17_text
    exam: case
    difficulty: 2
  - prompt: 'Situation: A debate asks whether Sadao was a traitor. Which answer best reflects the story''s view?'
    options:
    - "He served humanity, which is above national hatred"
    - "Yes, he betrayed Japan completely and deserved punishment"
    - "He only helped the American because of money"
    answer: He served humanity, which is above national hatred
    hints:
    - What duty did he follow?
    - Did he also report the man?
    solution: Sadao reports the man but saves his life as a doctor; the story shows humanity rising above war's divisions.
    mistakes:
      "Yes, he betrayed Japan completely and deserved punishment": e12x17_theme
      "He only helped the American because of money": e12x17_theme
    exam: competency
    difficulty: 2
