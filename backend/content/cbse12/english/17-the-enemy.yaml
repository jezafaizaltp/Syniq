subject: cbse12-eng
chapter: 17
title: The Enemy (Pearl S. Buck)
concepts:
- code: cbse12e.v4.enemy
  title: The Enemy (Pearl S. Buck)
  notes: |
    During the Second World War, Dr Sadao Hoki, a Japanese surgeon trained in America, lives by the sea with his wife Hana. One misty
    evening they find a wounded American prisoner of war washed up on the shore. Torn between duty to his country and his duty as a
    doctor, Sadao operates and saves him; Hana nurses him. The servants (Yumi refuses to wash him) leave in protest. Sadao tells the
    old General, whom he is treating, and the General promises to send assassins, but forgets, being preoccupied with his own health.
    Sadao helps the American escape by boat to a nearby island, giving him food, clothes and a flashlight signal plan. The man
    escapes. Themes: humanity versus patriotism, professional ethics, compassion.
  explanations:
    text: 'Dr Sadao, a Japanese surgeon, finds a wounded American soldier, an enemy, washed up near his house during the Second World War. His duty as a doctor wins over his duty to his country: he saves the man''s life, risking his own, and then helps him escape by boat.'
    visual: Picture a misty Japanese beach at dusk, a doctor and his wife kneeling over a wounded stranger in an American uniform, deciding whether to help or hand him over.
    step_by_step: 'Step 1: Sadao and Hana find the American. Step 2: The dilemma: doctor or patriot? Step 3: The operation and the servants leaving. Step 4: The General''s promise of assassins. Step 5: Sadao helps the man escape.'
    real_world: Doctors in war zones today treat wounded people from all sides, following the same ethic as Sadao.
  picture:
    kind: flow
    steps:
    - Wounded American washes ashore
    - Sadao operates and saves him
    - Servants leave in protest
    - General forgets to send assassins
    - Sadao helps him escape by boat
    alt: 'The Enemy: Sadao saves the enemy soldier and helps him escape.'
