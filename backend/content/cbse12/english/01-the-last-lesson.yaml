# CBSE Class 12 English (NCERT Flamingo, rationalised syllabus), chapter 1.
# Written from memory of the NCERT texts, not from the printed book: check names and details against it.
subject: cbse12-eng
chapter: 1
title: The Last Lesson (Alphonse Daudet)
tips:
  eng12_read_again: 'Go back to the text: the answer is there. Find the part about that person or moment.'
  eng12_poem_meaning: Poems say more than their words. Ask what the picture in the poem stands for in life.
  eng12_theme: Ask what the writer wants us to feel or learn, not only what happens.
  e12_ll_board: "At the end M. Hamel cannot speak, so he writes something showing his love for his own country. What would a patriot write?"
  e12_ll_fear: "Go back to the opening: Franz is late and dreads one grammar topic he had not learnt. Which grammar word fits?"
  e12_ll_order: "Think about why it is the 'last' French lesson. What did the order from Berlin change about the language taught in Alsace schools?"
  e12_ll_years: "M. Hamel says he has served the school for a very long time, measured in decades. Recall the exact figure he gives."
  e12x01_text: 'Go back to the moment the question names: Franz on the way, the quiet classroom, M. Hamel''s speech, or the end at noon.'
  e12x01_theme: 'Ask what the story says about language: losing the right to learn your own language is losing part of your freedom.'
concepts:
- code: cbse12e.f1.lastlesson
  title: The Last Lesson (Alphonse Daudet)
  notes: |
    Set in 1870 in Alsace, France, during the Franco-Prussian War. Little Franz is late for school and fears a scolding about
    participles, which he hasn't learnt. Instead he finds the class unusually quiet; M. Hamel is in his best clothes, and old
    villagers, including old Hauser, sit at the back. M. Hamel announces an order from Berlin: only German is to be taught in the
    schools of Alsace and Lorraine; this is the last French lesson. Franz regrets wasting time; M. Hamel says French is the most
    beautiful, clearest language and that holding on to one's language is like having the key to a prison. He blames everyone,
    himself included, for putting off learning. At noon the Prussian trumpets sound; overcome, he writes "Vive La France!" on the
    board. He had taught there forty years. Themes: linguistic chauvinism, the value of one's mother tongue, procrastination.
  explanations:
    text: In Alsace, after the Prussians win the war, an order comes that only German may be taught. Little Franz, who never cared about his French lessons, arrives late to find it is his teacher M. Hamel's last French lesson. He realises too late how much his language means.
    visual: Picture a quiet classroom where M. Hamel stands in his best coat, old villagers sit on the back benches, and at the end he writes 'Vive La France!' on the blackboard as Prussian trumpets sound outside.
    step_by_step: 'Step 1: Franz late and afraid. Step 2: The strange, solemn classroom. Step 3: The order from Berlin. Step 4: Franz''s regret and M. Hamel''s words about language. Step 5: ''Vive La France!'''
    real_world: Many people only realise the value of their mother tongue, like Malayalam, when they move away and stop hearing it.
  picture:
    kind: flow
    steps:
    - Franz is late, fears a scolding
    - Classroom is silent and solemn
    - 'Order from Berlin: only German'
    - Franz regrets wasting time
    - M. Hamel writes 'Vive La France!'
    alt: 'The Last Lesson: from Franz arriving late to M. Hamel''s farewell.'
  activity:
    type: sort
    prompt: 'The Last Lesson: who is it?'
    bins:
    - Franz
    - M. Hamel
    - Old Hauser
    items:
    - label: Late and hasn't learnt participles
      bin: Franz
      clue: The boy.
      why: Franz is late and unprepared.
    - label: In his best clothes
      bin: M. Hamel
      clue: The teacher.
      why: M. Hamel dresses up for his last lesson.
    - label: Sits at the back of the class
      bin: Old Hauser
      clue: An old villager.
      why: Hauser and other villagers sit at the back.
    - label: Writes 'Vive La France!'
      bin: M. Hamel
      clue: On the board at the end.
      why: Overcome, M. Hamel writes this.
    - label: Regrets wasting time
      bin: Franz
      clue: Too late to learn.
      why: Franz regrets not learning French.
  lesson:
    - teach: The story is set in 1870 in Alsace, France, during the Franco-Prussian War. Little Franz is late and afraid of being questioned on participles. On the way he sees a crowd at the bulletin board, where bad news has been posted for two years. At school there is no usual noise; it is as quiet as a Sunday morning.
      check:
        prompt: Why was Franz afraid of going to school that morning?
        options:
        - he had not learnt participles
        - he had lost his books
        - he had been ill
        answer: he had not learnt participles
        why: M. Hamel had said he would question them on participles.
    - teach: 'M. Hamel wears his fine green coat, frilled shirt and embroidered black silk cap, kept for inspections and prize days. Old villagers, including old Hauser with his primer, sit on the back benches. M. Hamel tells the class that an order from Berlin allows only German in the schools of Alsace and Lorraine: this is their last French lesson.'
      picture:
        kind: flow
        steps:
        - Franz late, fears participles
        - quiet classroom
        - villagers at the back
        - order from Berlin announced
        - last French lesson
        alt: Events leading to the announcement of the last French lesson.
      check:
        prompt: Why had the village elders come to the class?
        options:
        - to thank M. Hamel and show respect for their language
        - to punish Franz
        - to learn German
        answer: to thank M. Hamel and show respect for their language
        why: They regretted not going to school more and honoured his forty years.
    - teach: Franz suddenly regrets wasting time; his books now feel like old friends. M. Hamel says French is the most beautiful, clearest language, and that a people who hold on to their language hold the key to their prison. He blames parents, pupils and himself for always putting learning off till tomorrow. At noon, as the Prussian trumpets sound, he writes 'Vive La France!' on the board and dismisses the class.
      check:
        prompt: What does M. Hamel compare holding on to one's language to?
        options:
        - having the key to one's prison
        - winning a war
        - a long journey
        answer: having the key to one's prison
        why: Language keeps a people's identity alive even under rule by others.
  items:
  - prompt: Where is 'The Last Lesson' set?
    options:
    - Alsace, France
    - Berlin
    - Paris
    - London
    answer: Alsace, France
    difficulty: 1
    hints:
    - Alsace and Lorraine.
    - Taken by Prussia.
    solution: Alsace, France.
    mistakes:
      Berlin: eng12_read_again
  - prompt: What lesson was Franz afraid of being asked about?
    options:
    - participles
    - geography
    - maths tables
    - history dates
    answer: participles
    difficulty: 1
    hints:
    - Grammar.
    - He hadn't learnt them.
    solution: Participles.
    mistakes: {"geography": "e12_ll_fear", "maths tables": "e12_ll_fear", "history dates": "e12_ll_fear"}
  - prompt: What order came from Berlin?
    options:
    - Only German would be taught in the schools
    - Schools would close
    - M. Hamel was promoted
    - French would be compulsory
    answer: Only German would be taught in the schools
    difficulty: 1
    hints:
    - Language.
    - Last French lesson.
    solution: Only German was to be taught.
    mistakes: {"Schools would close": "e12_ll_order", "M. Hamel was promoted": "e12_ll_order", "French would be compulsory": "e12_ll_order"}
  - prompt: For how many years had M. Hamel taught at the school?
    answer: '40'
    check: '40'
    difficulty: 2
    hints:
    - A long career.
    - Forty.
    solution: Forty years.
    mistakes: {"20": "e12_ll_years", "30": "e12_ll_years", "50": "e12_ll_years", "10": "e12_ll_years"}
  - prompt: What did M. Hamel write on the board at the end?
    options:
    - Vive La France!
    - Goodbye children
    - Learn German
    - The End
    answer: Vive La France!
    difficulty: 1
    hints:
    - Long live France.
    - Overcome with emotion.
    solution: '''Vive La France!'''
    mistakes: {"Goodbye children": "e12_ll_board", "Learn German": "e12_ll_board", "The End": "e12_ll_board"}
  - prompt: What is a central theme of the story?
    options:
    - the importance of one's mother tongue
    - the joy of holidays
    - the value of money
    - sports
    answer: the importance of one's mother tongue
    difficulty: 2
    hints:
    - Losing French.
    - Language as identity.
    solution: The value of one's own language.
    mistakes:
      the joy of holidays: eng12_theme
  - prompt: Why did Franz think of not going to school that day?
    options:
    - it was warm and bright, and he feared the lesson
    - he was ill
    - the school was closed
    answer: it was warm and bright, and he feared the lesson
    difficulty: 1
    hints:
    - He could hear the birds and see soldiers drilling.
    - He was also unprepared.
    solution: 'Step 1: tempting weather. Step 2: fear of participles.'
    mistakes:
      he was ill: e12x01_text
      the school was closed: e12x01_text
  - prompt: What usually happened at the start of school that was missing that day?
    options:
    - a great bustle of desks, lessons and rulers
    - a prayer song
    - a bell from the church
    answer: a great bustle of desks, lessons and rulers
    difficulty: 1
    hints:
    - Franz had hoped to slip in unseen.
    - The noise could be heard in the street.
    solution: 'Step 1: usual noise of lessons repeated aloud. Step 2: that day all was still.'
    mistakes:
      a prayer song: e12x01_text
      a bell from the church: e12x01_text
  - prompt: What had been posted on the bulletin board for the last two years?
    options:
    - 'all the bad news: lost battles, the draft, orders'
    - school results
    - market prices
    answer: 'all the bad news: lost battles, the draft, orders'
    difficulty: 2
    hints:
    - It was at the town hall.
    - The war had brought it.
    solution: 'Step 1: news from the commanding officer. Step 2: bad news of the war.'
    mistakes:
      school results: e12x01_text
      market prices: e12x01_text
  - prompt: How did M. Hamel speak to Franz when he arrived late?
    options:
    - very kindly
    - angrily, with the ruler
    - he ignored him
    answer: very kindly
    difficulty: 1
    hints:
    - Franz expected a scolding.
    - It surprised him.
    solution: 'Step 1: he said to go to his place quickly. Step 2: kindly.'
    mistakes:
      angrily, with the ruler: e12x01_text
      he ignored him: e12x01_text
  - prompt: Who brought an old primer and sat at the back?
    options:
    - old Hauser
    - the blacksmith Wachter
    - Franz's father
    answer: old Hauser
    difficulty: 2
    hints:
    - A former mayor and postmaster were also there.
    - He wore a three-cornered hat.
    solution: 'Step 1: the elderly villager with the primer. Step 2: old Hauser.'
    mistakes:
      the blacksmith Wachter: e12x01_text
      Franz's father: e12x01_text
  - prompt: Whom did M. Hamel blame for the children's poor French?
    options:
    - everyone, including himself
    - only the pupils
    - only the Prussians
    answer: everyone, including himself
    difficulty: 2
    hints:
    - Parents sent children to work on farms or mills.
    - He gave holidays when he wanted to go fishing.
    solution: 'Step 1: parents, pupils and teacher all put it off. Step 2: everyone.'
    mistakes:
      only the pupils: e12x01_theme
      only the Prussians: e12x01_theme
  - prompt: What did Franz wonder about the pigeons cooing on the roof?
    options:
    - whether they would be made to sing in German too
    - whether they were hungry
    - whether they would fly away
    answer: whether they would be made to sing in German too
    difficulty: 2
    hints:
    - It shows how complete the order felt.
    - A child's sad irony.
    solution: 'Step 1: language forced on everything. Step 2: would pigeons sing in German?'
    mistakes:
      whether they were hungry: e12x01_theme
      whether they would fly away: e12x01_theme
  - prompt: '''Linguistic chauvinism'' in the story means:'
    options:
    - forcing one's own language on others
    - loving all languages equally
    - learning many languages
    answer: forcing one's own language on others
    difficulty: 3
    hints:
    - Think of the order from Berlin.
    - Chauvinism is excessive pride in one's own group.
    solution: 'Step 1: Prussia banned French. Step 2: imposing German.'
    mistakes:
      loving all languages equally: e12x01_theme
      learning many languages: e12x01_theme
  - prompt: Why could M. Hamel not finish his words at the end?
    options:
    - he was overcome with emotion
    - the pupils were too noisy
    - he forgot what to say
    answer: he was overcome with emotion
    difficulty: 1
    hints:
    - The trumpets of the Prussians sounded.
    - He turned very pale.
    solution: 'Step 1: something choked him. Step 2: he wrote on the board instead.'
    mistakes:
      the pupils were too noisy: e12x01_text
      he forgot what to say: e12x01_text
