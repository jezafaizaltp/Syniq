chapter: 1
title: The Last Lesson (Alphonse Daudet)
tips:
  eng12_read_again: 'Go back to the text: the answer is there. Find the part about that person or moment.'
  eng12_poem_meaning: Poems say more than their words. Ask what the picture in the poem stands for in life.
  eng12_theme: Ask what the writer wants us to feel or learn, not only what happens.
  e12_ll_board: "At the end M. Hamel cannot speak, so he writes something showing his love for his own country. What would a patriot write?"
  e12_ll_fear: "Go back to the opening: Franz is late and dreads one grammar topic he had not learnt. Which grammar word fits?"
  e12_ll_order: "Think about why it is the 'last' French lesson. What did the order from Berlin change about the language taught in Alsace schools?"
  e12_ll_years: "M. Hamel says he has served the school for a very long time, measured in decades. Recall the exact figure he gives."
concepts:
- code: cbse12e.f1.lastlesson
  title: The Last Lesson (Alphonse Daudet)
  notes: |
    Set in 1870 in Alsace, France, during the Franco-Prussian War. Little Franz is late for school and fears a scolding about
    participles, which he hasn't learnt. Instead he finds the class unusually quiet; M. Hamel is in his best clothes, and old
    villagers, including old Hauser, sit at the back. M. Hamel announces an order from Berlin: only German is to be taught in the
    schools of Alsace and Lorraine; this is the last French lesson. Franz regrets wasting time; M. Hamel says French is the most
    beautiful, clearest language and that holding on to one's language is like having the key to a prison. He blames everyone,
    himself included, for putting off learning. At noon the Prussian trumpets sound; overcome, he writes "Vive La France!" on the
    board. He had taught there forty years. Themes: linguistic chauvinism, the value of one's mother tongue, procrastination.
  explanations:
    text: In Alsace, after the Prussians win the war, an order comes that only German may be taught. Little Franz, who never cared about his French lessons, arrives late to find it is his teacher M. Hamel's last French lesson. He realises too late how much his language means.
    visual: Picture a quiet classroom where M. Hamel stands in his best coat, old villagers sit on the back benches, and at the end he writes 'Vive La France!' on the blackboard as Prussian trumpets sound outside.
    step_by_step: 'Step 1: Franz late and afraid. Step 2: The strange, solemn classroom. Step 3: The order from Berlin. Step 4: Franz''s regret and M. Hamel''s words about language. Step 5: ''Vive La France!'''
    real_world: Many people only realise the value of their mother tongue, like Malayalam, when they move away and stop hearing it.
  picture:
    kind: flow
    steps:
    - Franz is late, fears a scolding
    - Classroom is silent and solemn
    - 'Order from Berlin: only German'
    - Franz regrets wasting time
    - M. Hamel writes 'Vive La France!'
    alt: 'The Last Lesson: from Franz arriving late to M. Hamel''s farewell.'
  activity:
    type: sort
    prompt: 'The Last Lesson: who is it?'
    bins:
    - Franz
    - M. Hamel
    - Old Hauser
    items:
    - label: Late and hasn't learnt participles
      bin: Franz
      clue: The boy.
      why: Franz is late and unprepared.
    - label: In his best clothes
      bin: M. Hamel
      clue: The teacher.
      why: M. Hamel dresses up for his last lesson.
    - label: Sits at the back of the class
      bin: Old Hauser
      clue: An old villager.
      why: Hauser and other villagers sit at the back.
    - label: Writes 'Vive La France!'
      bin: M. Hamel
      clue: On the board at the end.
      why: Overcome, M. Hamel writes this.
    - label: Regrets wasting time
      bin: Franz
      clue: Too late to learn.
      why: Franz regrets not learning French.
  items:
  - prompt: Where is 'The Last Lesson' set?
    options:
    - Alsace, France
    - Berlin
    - Paris
    - London
    answer: Alsace, France
    difficulty: 1
    hints:
    - Alsace and Lorraine.
    - Taken by Prussia.
    solution: Alsace, France.
    mistakes:
      Berlin: eng12_read_again
  - prompt: What lesson was Franz afraid of being asked about?
    options:
    - participles
    - geography
    - maths tables
    - history dates
    answer: participles
    difficulty: 1
    hints:
    - Grammar.
    - He hadn't learnt them.
    solution: Participles.
    mistakes: {"geography": "e12_ll_fear", "maths tables": "e12_ll_fear", "history dates": "e12_ll_fear"}
  - prompt: What order came from Berlin?
    options:
    - Only German would be taught in the schools
    - Schools would close
    - M. Hamel was promoted
    - French would be compulsory
    answer: Only German would be taught in the schools
    difficulty: 1
    hints:
    - Language.
    - Last French lesson.
    solution: Only German was to be taught.
    mistakes: {"Schools would close": "e12_ll_order", "M. Hamel was promoted": "e12_ll_order", "French would be compulsory": "e12_ll_order"}
  - prompt: For how many years had M. Hamel taught at the school?
    answer: '40'
    check: '40'
    difficulty: 2
    hints:
    - A long career.
    - Forty.
    solution: Forty years.
    mistakes: {"20": "e12_ll_years", "30": "e12_ll_years", "50": "e12_ll_years", "10": "e12_ll_years"}
  - prompt: What did M. Hamel write on the board at the end?
    options:
    - Vive La France!
    - Goodbye children
    - Learn German
    - The End
    answer: Vive La France!
    difficulty: 1
    hints:
    - Long live France.
    - Overcome with emotion.
    solution: '''Vive La France!'''
    mistakes: {"Goodbye children": "e12_ll_board", "Learn German": "e12_ll_board", "The End": "e12_ll_board"}
  - prompt: What is a central theme of the story?
    options:
    - the importance of one's mother tongue
    - the joy of holidays
    - the value of money
    - sports
    answer: the importance of one's mother tongue
    difficulty: 2
    hints:
    - Losing French.
    - Language as identity.
    solution: The value of one's own language.
    mistakes:
      the joy of holidays: eng12_theme
