# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse12-bio
chapter: 4
title: Principles of Inheritance and Variation
tips:
  c12b_ratio: 'Monohybrid F₂: phenotype 3 : 1, genotype 1 : 2 : 1. Dihybrid F₂: phenotype 9 : 3 : 3 : 1.'
  c12b_sexlinked: X-linked recessive traits (haemophilia, colour blindness) show up more often in males, who have only one X.
  b12_abo: "A and B both show in AB blood (co-dominance), and there are three alleles."
  b12_genotype_ratio: "3 : 1 is the phenotype ratio. Genotypes: TT, Tt, tt."
  b12_incomplete: "Pink is a blend; in co-dominance both colours show separately."
  b12_linkage: "Genes close together on a chromosome travel together."
  b12_monohybrid: "F₂ ratio is 3 : 1, so one quarter show the recessive trait."
  b12_monosomy: "Turner's syndrome is missing one sex chromosome."
  b12_sex_determination: "Eggs always carry X. Sperm carry either X or Y."
  b12_sickle: "A single base change, GAG → GUG, swaps the amino acid at position 6 of the β chain."
  b12_test_cross: "Tt × tt gives Tt and tt in equal numbers."
  b12_trisomy: "Down's syndrome has one extra copy of chromosome 21."
concepts:
- code: cbse12b.inh.mendel
  title: Mendel's laws
  notes: |
    Mendel's experiments on garden pea (7 contrasting traits). Monohybrid cross: F₁ all dominant; F₂ phenotypic 3:1, genotypic
    1:2:1. Law of dominance, law of segregation. Test cross (with homozygous recessive). Incomplete dominance (snapdragon: red ×
    white → pink; F₂ 1:2:1), co-dominance (ABO blood groups: Iᴬ, Iᴮ codominant, i recessive; multiple alleles). Dihybrid cross:
    F₂ 9:3:3:1; law of independent assortment. Punnett squares.
  explanations:
    text: 'Mendel crossed pea plants and found that traits are passed on by factors (genes) that come in pairs. One version can hide the other (dominance), the pair separates when gametes form (segregation), and different genes sort independently. A monohybrid cross gives a 3 : 1 ratio in the second generation.'
    visual: 'Draw a Punnett square for Tt × Tt: TT, Tt, Tt, tt. Three tall to one dwarf.'
    step_by_step: 'Step 1: Write the parents'' genotypes. Step 2: List the gametes. Step 3: Fill a Punnett square. Step 4: Count genotypes and phenotypes.'
    real_world: Blood group testing before transfusions relies on knowing how ABO alleles are inherited.
  picture:
    kind: compare
    columns:
    - title: Cross
      points:
      - monohybrid F₂
      - dihybrid F₂
      - test cross (Tt × tt)
    - title: Phenotype ratio
      points:
      - '3 : 1'
      - '9 : 3 : 3 : 1'
      - '1 : 1'
    alt: Phenotype ratios for monohybrid, dihybrid and test crosses.
  activity:
    type: formula
    prompt: 'Pea height: T (tall) is dominant over t (dwarf). Set how many T alleles each parent has. Each parent passes on one allele at random.'
    inputs:
    - name: p1
      label: Parent 1's T alleles (0–2)
      min: 0
      max: 2
      step: 1
      start: 2
    - name: p2
      label: Parent 2's T alleles (0–2)
      min: 0
      max: 2
      step: 1
      start: 0
    outputs:
    - name: dom
      label: Tall offspring
      expr: 100*(1-(1-p1/2)*(1-p2/2))
      unit: '%'
      places: 1
    - name: tt
      label: TT offspring
      expr: 100*(p1/2)*(p2/2)
      unit: '%'
      places: 1
    - name: rec
      label: tt (dwarf) offspring
      expr: 100*(1-p1/2)*(1-p2/2)
      unit: '%'
      places: 1
    goals:
    - prompt: 'Make a cross that gives 3 tall : 1 dwarf.'
      want:
        dom: 75
      mistakes:
      - when:
          p1: 2
          p2: 0
        say: 'TT × tt gives all tall Tt: that''s the F₁. The 3 : 1 comes from crossing two F₁ hybrids, Tt × Tt.'
      - when:
          p1: 0
          p2: 2
        say: 'tt × TT gives all tall Tt: that''s the F₁. The 3 : 1 comes from Tt × Tt.'
      - when:
          dom: 100
        say: Every child gets at least one T here. For dwarfs to appear, both parents must carry t.
    - prompt: 'Test cross: a tall plant × a dwarf gives 1 tall : 1 dwarf. Set both parents.'
      want:
        dom: 50
      mistakes:
      - when:
          dom: 100
        say: 'All tall means the tall parent was TT. Half dwarf means it carries a t: it''s Tt.'
      - when:
          dom: 75
        say: That's Tt × Tt. A test cross uses a dwarf (tt) parent.
    - prompt: Make every offspring dwarf.
      want:
        dom: 0
      mistakes:
      - when:
          dom:
          - 25
          - 100
        say: Some offspring still get a T. Dwarf parents (tt) can only pass on t.
  items:
  - prompt: In a monohybrid F₂ of 400 plants, how many are expected to show the recessive trait?
    answer: '100'
    check: 400/4
    difficulty: 1
    hints:
    - 1/4 of them.
    - 400/4.
    solution: '100.'
    mistakes: {"300": "b12_monohybrid", "200": "b12_monohybrid", "25": "b12_monohybrid"}
  - prompt: In a dihybrid F₂ of 160 plants, how many are expected to show both dominant traits?
    answer: '90'
    check: 160*Rational(9,16)
    difficulty: 2
    hints:
    - 9/16.
    - 160 × 9/16.
    solution: '90.'
    mistakes:
      '40': c12b_ratio
  - prompt: A cross Tt × tt gives what percentage of tall plants?
    answer: '50'
    check: '50'
    difficulty: 1
    hints:
    - Test cross.
    - '1 : 1.'
    solution: 50%.
    mistakes: {"75": "b12_test_cross", "25": "b12_test_cross", "100": "b12_test_cross"}
  - prompt: 'Red × white snapdragons giving pink F₁ shows:'
    options:
    - incomplete dominance
    - co-dominance
    - complete dominance
    - linkage
    answer: incomplete dominance
    difficulty: 2
    hints:
    - A blend.
    - Neither dominates fully.
    solution: Incomplete dominance.
    mistakes: {"co-dominance": "b12_incomplete", "complete dominance": "b12_incomplete", "linkage": "b12_incomplete"}
  - prompt: 'ABO blood groups show:'
    options:
    - co-dominance and multiple alleles
    - incomplete dominance
    - sex linkage
    - polygenic inheritance
    answer: co-dominance and multiple alleles
    difficulty: 2
    hints:
    - Iᴬ and Iᴮ both expressed.
    - Three alleles.
    solution: Co-dominance and multiple alleles.
    mistakes: {"incomplete dominance": "b12_abo", "sex linkage": "b12_abo", "polygenic inheritance": "b12_abo"}
  - prompt: 'The F₂ genotype ratio of a monohybrid cross is:'
    options:
    - '1 : 2 : 1'
    - '3 : 1'
    - '9 : 3 : 3 : 1'
    - '1 : 1'
    answer: '1 : 2 : 1'
    difficulty: 1
    hints:
    - TT, Tt, tt.
    - Punnett square.
    solution: '1 : 2 : 1.'
    mistakes: {"3 : 1": "b12_genotype_ratio", "9 : 3 : 3 : 1": "b12_genotype_ratio", "1 : 1": "b12_genotype_ratio"}
- code: cbse12b.inh.chromosomes
  title: Chromosomal theory, sex determination and disorders
  after:
  - cbse12b.inh.mendel
  notes: |
    Chromosomal theory of inheritance (Sutton, Boveri); Morgan's Drosophila work: linkage and recombination. Polygenic
    inheritance (skin colour), pleiotropy (phenylketonuria). Sex determination: XX–XY (humans; father determines sex), XX–XO
    (grasshopper), ZW–ZZ (birds). Mutation (point, frameshift). Pedigree analysis. Mendelian disorders: haemophilia, colour
    blindness (X-linked recessive), sickle-cell anaemia (autosomal recessive, Glu→Val), phenylketonuria, thalassemia.
    Chromosomal disorders: Down's syndrome (trisomy 21), Klinefelter's (XXY), Turner's (XO).
  explanations:
    text: Genes are carried on chromosomes. Genes close together on the same chromosome tend to be inherited together (linkage). In humans, the father's sperm carrying X or Y decides the baby's sex. Some disorders come from a single faulty gene, others from an extra or missing chromosome.
    visual: Draw XX (mother) × XY (father). The mother's eggs all carry X; half the father's sperm carry X (girl) and half Y (boy).
    step_by_step: 'Step 1: Identify autosomal or sex-linked. Step 2: For X-linked recessive, sons get the trait from carrier mothers. Step 3: For chromosomal disorders, count the chromosomes (trisomy, monosomy).'
    real_world: Sickle-cell anaemia is common in some tribal communities in India; screening helps families make informed choices.
  picture:
    kind: compare
    columns:
    - title: Disorder
      points:
      - haemophilia
      - sickle-cell anaemia
      - Down's syndrome
      - Turner's syndrome
    - title: Cause
      points:
      - X-linked recessive gene
      - autosomal recessive gene
      - extra chromosome 21
      - one X missing (XO)
    alt: Genetic disorders and their causes.
  activity:
    type: sort
    prompt: Which kind of sex determination is it?
    bins:
    - XX–XY
    - XX–XO
    - ZW–ZZ
    - Haplo-diploid
    items:
    - label: Humans
      bin: XX–XY
      clue: Females XX, males XY. Which kind?
      why: 'XY: the male makes two kinds of sperm.'
    - label: Drosophila (fruit fly)
      bin: XX–XY
      clue: Males have X and Y. Which kind?
      why: XY.
    - label: The father's sperm decides the baby's sex
      bin: XX–XY
      clue: Which kind has the male making X and Y gametes?
      why: 'Male heterogamety: XY.'
    - label: Grasshopper
      bin: XX–XO
      clue: Males have one X and no partner. Which kind?
      why: XO.
    - label: Males have one X and no Y
      bin: XX–XO
      clue: One sex chromosome alone. Which kind?
      why: XO.
    - label: Birds
      bin: ZW–ZZ
      clue: Here the female has two different sex chromosomes. Which kind?
      why: ZW females, ZZ males.
    - label: Females make two kinds of eggs
      bin: ZW–ZZ
      clue: Which kind has the female heterogametic?
      why: ZW.
    - label: Honey bee
      bin: Haplo-diploid
      clue: Drones come from unfertilised eggs. Which kind?
      why: Males are haploid, females diploid.
    - label: Males develop from unfertilised eggs
      bin: Haplo-diploid
      clue: Haploid males, diploid females. Which kind?
      why: Haplo-diploid.
  items:
  - prompt: How many chromosomes does a person with Down's syndrome have?
    answer: '47'
    check: 46+1
    difficulty: 1
    hints:
    - Trisomy 21.
    - 46 + 1.
    solution: '47.'
    mistakes: {"46": "b12_trisomy", "45": "b12_trisomy", "48": "b12_trisomy"}
  - prompt: How many chromosomes does a person with Turner's syndrome (XO) have?
    answer: '45'
    check: 46-1
    difficulty: 2
    hints:
    - One X missing.
    - 46 − 1.
    solution: '45.'
    mistakes: {"46": "b12_monosomy", "47": "b12_monosomy"}
  - prompt: A carrier mother (XᴴXʰ) and normal father (XᴴY) have a son. What percentage chance is he haemophilic?
    answer: '50'
    check: '50'
    difficulty: 2
    hints:
    - Son gets X from mother.
    - Half carry Xʰ.
    solution: 50%.
    mistakes:
      '25': c12b_sexlinked
  - prompt: 'In humans, the sex of the child is decided by the:'
    options:
    - father's sperm (X or Y)
    - mother's egg
    - both equally
    - environment
    answer: father's sperm (X or Y)
    difficulty: 1
    hints:
    - Eggs all carry X.
    - Sperm X or Y.
    solution: The father's sperm.
    mistakes: {"mother's egg": "b12_sex_determination", "both equally": "b12_sex_determination", "environment": "b12_sex_determination"}
  - prompt: 'Sickle-cell anaemia results from a change of glutamic acid to:'
    options:
    - valine
    - glycine
    - lysine
    - alanine
    answer: valine
    difficulty: 2
    hints:
    - Sixth position of β-globin.
    - Point mutation.
    solution: Valine.
    mistakes: {"glycine": "b12_sickle", "lysine": "b12_sickle", "alanine": "b12_sickle"}
  - prompt: 'Genes on the same chromosome that tend to be inherited together are:'
    options:
    - linked
    - independent
    - dominant
    - recessive
    answer: linked
    difficulty: 1
    hints:
    - Morgan's flies.
    - Close together.
    solution: Linked.
    mistakes: {"independent": "b12_linkage", "dominant": "b12_linkage", "recessive": "b12_linkage"}
