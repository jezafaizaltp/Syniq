# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse12-bio
chapter: 3
title: Reproductive Health
tips:
  c12b_mtp: In India, MTP is legal up to 20 weeks (extended to 24 weeks in some cases under the 2021 amendment) on medical advice.
  c12b_ivf: "'In vitro' is Latin for 'in glass', like a lab dish. Where does fertilisation take place?"
  b12_amniocentesis: "The test is meant to find genetic disorders; the ban stops it being misused against girls."
  b12_condom: "A physical barrier stops body fluids being exchanged."
  b12_copper_t: "Copper ions affect sperm movement and ability to fertilise."
  b12_emergency: "Emergency pills must be taken within a few days, before implantation."
  b12_hepatitis_b: "Like HIV, this virus spreads through blood as well as sexual contact."
  b12_icsi: "Intra-Cytoplasmic Sperm Injection: read the name."
  b12_iui: "Intra-uterine insemination: semen goes into the uterus."
  b12_saheli: "Saheli is a non-steroidal once-a-week pill. Its name is a Hindi word for 'friend'. Where was it developed?"
  b12_sti_harm: "Untreated infections can damage the reproductive tract."
  b12_tubectomy: "'Tub-' refers to the fallopian tubes; vasectomy is the male operation."
  b12_zift: "ZIFT moves an early embryo into the fallopian tube. Embryos with more cells go to the uterus instead."
concepts:
- code: cbse12b.rh.contraception
  title: Reproductive health and contraception
  notes: |
    Reproductive health: physical, emotional, behavioural and social well-being in reproduction. India: Family planning (1951),
    RCH programmes; sex education; amniocentesis misuse (sex determination banned). Population growth: falling death rate, MMR,
    IMR. Contraceptives: natural (periodic abstinence, withdrawal, lactational amenorrhea), barrier (condoms, diaphragms),
    IUDs (copper-T: Cu ions suppress sperm; hormonal: LNG-20), oral pills (progestogens/oestrogen; Saheli, non-steroidal, once a
    week), injections/implants, surgical (vasectomy, tubectomy). Emergency contraception within 72 hours. Medical termination
    of pregnancy (MTP).
  explanations:
    text: 'Reproductive health means people can have a safe, healthy reproductive life and make informed choices. Contraceptive methods let couples plan when to have children: barrier methods, pills, intrauterine devices and surgical methods each work in different ways.'
    visual: 'Draw a table of methods: barriers stop sperm meeting the egg; pills stop ovulation; a copper-T makes the uterus unsuitable for sperm; vasectomy or tubectomy blocks the tubes.'
    step_by_step: 'Step 1: Name the method. Step 2: How does it work (blocks sperm, stops ovulation, prevents implantation)? Step 3: Is it reversible? Step 4: Does it also protect against infections (condoms do)?'
    real_world: Saheli, a once-a-week contraceptive pill, was developed by CDRI in Lucknow, India.
  picture:
    kind: compare
    columns:
    - title: Method
      points:
      - condom
      - copper-T
      - oral pill
      - vasectomy
    - title: How it works
      points:
      - blocks sperm (barrier)
      - Cu ions reduce sperm movement
      - stops ovulation
      - cuts the vas deferens
    alt: Contraceptive methods and how each works.
  activity:
    type: sort
    prompt: What kind of contraceptive method is each one?
    bins:
    - Barrier
    - Hormonal pill or implant
    - IUD
    - Surgical
    - Natural
    items:
    - label: Condom
      bin: Barrier
      clue: Does it stop sperm physically meeting the egg?
      why: A physical barrier.
    - label: Diaphragm or cervical cap
      bin: Barrier
      clue: It covers the cervix. How does it work?
      why: A barrier in front of the cervix.
    - label: Oral pills
      bin: Hormonal pill or implant
      clue: Do they change hormone levels to stop ovulation?
      why: Progestogens, with or without oestrogen, stop ovulation.
    - label: Saheli, a weekly pill
      bin: Hormonal pill or implant
      clue: Taken by mouth once a week. Which group?
      why: An oral contraceptive developed in India.
    - label: Implants under the skin
      bin: Hormonal pill or implant
      clue: They release progestogens slowly. Which group?
      why: Hormonal.
    - label: Copper-T (CuT)
      bin: IUD
      clue: Placed inside the uterus. Which group?
      why: A copper-releasing intrauterine device.
    - label: LNG-20
      bin: IUD
      clue: Placed inside the uterus, it releases a hormone. Which group?
      why: A hormone-releasing IUD.
    - label: Vasectomy
      bin: Surgical
      clue: Is the vas deferens cut and tied?
      why: A permanent surgical method in males.
    - label: Tubectomy
      bin: Surgical
      clue: Are the fallopian tubes cut and tied?
      why: A permanent surgical method in females.
    - label: Periodic abstinence
      bin: Natural
      clue: 'No devices or drugs: avoiding the fertile days. Which group?'
      why: A natural method.
    - label: Lactational amenorrhoea
      bin: Natural
      clue: Breastfeeding delays ovulation for a while. Which group?
      why: Natural (and only reliable for a short time).
  items:
  - prompt: Emergency contraceptives work if taken within how many hours of intercourse?
    answer: '72'
    check: '72'
    difficulty: 1
    hints:
    - Three days.
    - '72.'
    solution: 72 hours.
    mistakes: {"24": "b12_emergency", "48": "b12_emergency", "120": "b12_emergency"}
  - prompt: 'Copper-releasing IUDs work mainly by:'
    options:
    - copper ions reducing sperm motility
    - stopping ovulation
    - killing the egg
    - blocking the vagina
    answer: copper ions reducing sperm motility
    difficulty: 2
    hints:
    - Cu ions.
    - Sperm can't swim well.
    solution: Copper ions suppress sperm motility and fertilising ability.
    mistakes: {"stopping ovulation": "b12_copper_t", "killing the egg": "b12_copper_t", "blocking the vagina": "b12_copper_t"}
  - prompt: Which method also protects against sexually transmitted infections?
    options:
    - condoms
    - oral pills
    - copper-T
    - vasectomy
    answer: condoms
    difficulty: 1
    hints:
    - Barrier.
    - Physical block.
    solution: Condoms.
    mistakes: {"oral pills": "b12_condom", "copper-T": "b12_condom", "vasectomy": "b12_condom"}
  - prompt: '''Saheli'', the weekly pill, was developed in:'
    options:
    - India (CDRI, Lucknow)
    - USA
    - China
    - UK
    answer: India (CDRI, Lucknow)
    difficulty: 2
    hints:
    - Non-steroidal.
    - Indian institute.
    solution: India, at CDRI Lucknow.
    mistakes: {"USA": "b12_saheli", "China": "b12_saheli", "UK": "b12_saheli"}
  - prompt: 'Tubectomy involves:'
    options:
    - cutting and tying the fallopian tubes
    - removing the uterus
    - cutting the vas deferens
    - inserting a copper-T
    answer: cutting and tying the fallopian tubes
    difficulty: 2
    hints:
    - Female surgical method.
    - Tubes.
    solution: Cutting and tying the fallopian tubes.
    mistakes: {"removing the uterus": "b12_tubectomy", "cutting the vas deferens": "b12_tubectomy", "inserting a copper-T": "b12_tubectomy"}
  - prompt: Why is amniocentesis for sex determination banned in India?
    options:
    - to prevent female foeticide
    - because it doesn't work
    - it is too expensive
    - it harms the mother always
    answer: to prevent female foeticide
    difficulty: 2
    hints:
    - Misuse.
    - Sex ratio.
    solution: To stop female foeticide.
    mistakes: {"because it doesn't work": "b12_amniocentesis", "it is too expensive": "b12_amniocentesis", "it harms the mother always": "b12_amniocentesis"}
- code: cbse12b.rh.sti
  title: STIs and infertility
  after:
  - cbse12b.rh.contraception
  notes: |
    Sexually transmitted infections: gonorrhoea, syphilis, genital herpes, chlamydiasis, genital warts, trichomoniasis, hepatitis
    B, HIV/AIDS; prevention (safe sex, avoiding shared needles, early treatment); complications (PID, infertility, ectopic
    pregnancy). Infertility and assisted reproductive technologies (ART): IVF with embryo transfer—ZIFT (zygote/embryo up to 8
    blastomeres into the fallopian tube), IUT (embryos with more than 8 blastomeres into the uterus); GIFT (ovum into the
    fallopian tube); ICSI (sperm injected into the ovum); artificial insemination (AI/IUI).
  explanations:
    text: Sexually transmitted infections spread through sexual contact; some, like hepatitis B and HIV, also spread through shared needles or blood. Most can be prevented and many cured if treated early. Couples who can't conceive can be helped by technologies like IVF.
    visual: 'Draw IVF: eggs and sperm are combined in a lab dish; the resulting early embryo is placed back into the woman''s oviduct or uterus.'
    step_by_step: 'Step 1: Name the infection or technique. Step 2: For STIs: how it spreads and how to prevent it. Step 3: For ART: where fertilisation happens and where the embryo is placed.'
    real_world: India's first IVF baby, Durga (Kanupriya Agarwal), was born in Kolkata in 1978.
  picture:
    kind: flow
    steps:
    - Collect eggs and sperm
    - Fertilise in the lab (in vitro)
    - Early embryo forms
    - Transfer to oviduct (ZIFT) or uterus (IUT)
    alt: IVF with embryo transfer, step by step.
  activity:
    type: sort
    prompt: What causes each sexually transmitted infection?
    bins:
    - Bacteria
    - Viruses
    - A protozoan
    items:
    - label: Gonorrhoea
      bin: Bacteria
      clue: Caused by Neisseria. Which kind of microbe is that?
      why: Neisseria gonorrhoeae is a bacterium, treatable with antibiotics.
    - label: Syphilis
      bin: Bacteria
      clue: Caused by Treponema pallidum. Which kind?
      why: A spiral bacterium.
    - label: Chlamydiasis
      bin: Bacteria
      clue: Caused by Chlamydia trachomatis. Which kind?
      why: A bacterium.
    - label: Genital herpes
      bin: Viruses
      clue: Caused by herpes simplex. Can antibiotics cure it?
      why: 'A virus: antibiotics don''t work.'
    - label: Genital warts
      bin: Viruses
      clue: Caused by HPV. Which kind?
      why: Human papilloma virus.
    - label: Hepatitis B
      bin: Viruses
      clue: There's a vaccine made from its surface protein. Which kind?
      why: A virus.
    - label: HIV/AIDS
      bin: Viruses
      clue: A retrovirus that attacks helper T cells. Which kind?
      why: A virus.
    - label: Trichomoniasis
      bin: A protozoan
      clue: Caused by Trichomonas vaginalis, a single-celled eukaryote. Which kind?
      why: A protozoan.
  items:
  - prompt: In ZIFT, the embryo transferred has up to how many blastomeres?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - Into the fallopian tube.
    - Eight.
    solution: Up to 8.
    mistakes: {"16": "b12_zift", "32": "b12_zift", "4": "b12_zift"}
  - prompt: Which STI can also spread through shared needles and blood transfusion?
    options:
    - hepatitis B
    - genital warts
    - trichomoniasis
    - chlamydiasis
    answer: hepatitis B
    difficulty: 2
    hints:
    - Blood-borne.
    - Like HIV.
    solution: Hepatitis B (and HIV).
    mistakes: {"genital warts": "b12_hepatitis_b", "trichomoniasis": "b12_hepatitis_b", "chlamydiasis": "b12_hepatitis_b"}
  - prompt: 'In ICSI:'
    options:
    - a sperm is injected directly into the ovum
    - the ovum is put in the tube
    - semen is placed in the uterus
    - the embryo is frozen only
    answer: a sperm is injected directly into the ovum
    difficulty: 2
    hints:
    - Intra-cytoplasmic.
    - Injection.
    solution: A sperm is injected into the ovum.
    mistakes: {"the ovum is put in the tube": "b12_icsi", "semen is placed in the uterus": "b12_icsi", "the embryo is frozen only": "b12_icsi"}
  - prompt: 'IVF means fertilisation:'
    options:
    - outside the body
    - inside the uterus
    - without sperm
    - by injection of hormones only
    answer: outside the body
    difficulty: 1
    hints:
    - In vitro = in glass.
    - Lab.
    solution: Outside the body.
    mistakes:
      inside the uterus: c12b_ivf
  - prompt: 'Untreated STIs can lead to:'
    options:
    - infertility and pelvic inflammatory disease
    - stronger immunity
    - taller height
    - nothing
    answer: infertility and pelvic inflammatory disease
    difficulty: 1
    hints:
    - Complications.
    - PID.
    solution: Infertility, PID and ectopic pregnancy.
    mistakes: {"stronger immunity": "b12_sti_harm", "taller height": "b12_sti_harm", "nothing": "b12_sti_harm"}
  - prompt: 'Placing semen artificially into the uterus is called:'
    options:
    - intrauterine insemination (IUI)
    - ZIFT
    - GIFT
    - IVF
    answer: intrauterine insemination (IUI)
    difficulty: 2
    hints:
    - Artificial insemination.
    - Into uterus.
    solution: Intrauterine insemination.
    mistakes: {"ZIFT": "b12_iui", "GIFT": "b12_iui", "IVF": "b12_iui"}
