# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse12-bio
chapter: 3
title: Reproductive Health
tips:
  c12b_mtp: In India, MTP is legal up to 20 weeks (extended to 24 weeks in some cases under the 2021 amendment) on medical advice.
  c12b_ivf: "'In vitro' is Latin for 'in glass', like a lab dish. Where does fertilisation take place?"
  b12_amniocentesis: "The test is meant to find genetic disorders; the ban stops it being misused against girls."
  b12_condom: "A physical barrier stops body fluids being exchanged."
  b12_copper_t: "Copper ions affect sperm movement and ability to fertilise."
  b12_emergency: "Emergency pills must be taken within a few days, before implantation."
  b12_hepatitis_b: "Like HIV, this virus spreads through blood as well as sexual contact."
  b12_icsi: "Intra-Cytoplasmic Sperm Injection: read the name."
  b12_iui: "Intra-uterine insemination: semen goes into the uterus."
  b12_saheli: "Saheli is a non-steroidal once-a-week pill. Its name is a Hindi word for 'friend'. Where was it developed?"
  b12_sti_harm: "Untreated infections can damage the reproductive tract."
  b12_tubectomy: "'Tub-' refers to the fallopian tubes; vasectomy is the male operation."
  b12_zift: "ZIFT moves an early embryo into the fallopian tube. Embryos with more cells go to the uterus instead."
  c12b3_method: 'Sort the method by how it works: natural (timing), barrier (blocks sperm), IUD (in the uterus), hormonal (stops ovulation or changes mucus), surgical (blocks the tubes).'
  c12b3_art: "Match the technique by what is placed where: an early embryo, a later embryo, a single egg, or a sperm injected into an egg. Read the letters of the name."
  c12b3_sti: STIs spread through sexual contact, and some (HIV, hepatitis B) also through blood and shared needles. Early treatment prevents complications.
  c12b3_tube: Ask where the sperm and ovum normally meet, and whether that place is still reachable.
  c12b3_rev: A good choice must be reversible for someone planning children later. Which options are permanent?
concepts:
- code: cbse12b.rh.contraception
  title: Reproductive health and contraception
  notes: |
    Reproductive health: physical, emotional, behavioural and social well-being in reproduction. India: Family planning (1951),
    RCH programmes; sex education; amniocentesis misuse (sex determination banned). Population growth: falling death rate, MMR,
    IMR. Contraceptives: natural (periodic abstinence, withdrawal, lactational amenorrhea), barrier (condoms, diaphragms),
    IUDs (copper-T: Cu ions suppress sperm; hormonal: LNG-20), oral pills (progestogens/oestrogen; Saheli, non-steroidal, once a
    week), injections/implants, surgical (vasectomy, tubectomy). Emergency contraception within 72 hours. Medical termination
    of pregnancy (MTP).
  explanations:
    text: 'Reproductive health means people can have a safe, healthy reproductive life and make informed choices. Contraceptive methods let couples plan when to have children: barrier methods, pills, intrauterine devices and surgical methods each work in different ways.'
    visual: 'Draw a table of methods: barriers stop sperm meeting the egg; pills stop ovulation; a copper-T makes the uterus unsuitable for sperm; vasectomy or tubectomy blocks the tubes.'
    step_by_step: 'Step 1: Name the method. Step 2: How does it work (blocks sperm, stops ovulation, prevents implantation)? Step 3: Is it reversible? Step 4: Does it also protect against infections (condoms do)?'
    real_world: Saheli, a once-a-week contraceptive pill, was developed by CDRI in Lucknow, India.
  picture:
    kind: compare
    columns:
    - title: Method
      points:
      - condom
      - copper-T
      - oral pill
      - vasectomy
    - title: How it works
      points:
      - blocks sperm (barrier)
      - Cu ions reduce sperm movement
      - stops ovulation
      - cuts the vas deferens
    alt: Contraceptive methods and how each works.
  activity:
    type: sort
    prompt: What kind of contraceptive method is each one?
    bins:
    - Barrier
    - Hormonal pill or implant
    - IUD
    - Surgical
    - Natural
    items:
    - label: Condom
      bin: Barrier
      clue: Does it stop sperm physically meeting the egg?
      why: A physical barrier.
    - label: Diaphragm or cervical cap
      bin: Barrier
      clue: It covers the cervix. How does it work?
      why: A barrier in front of the cervix.
    - label: Oral pills
      bin: Hormonal pill or implant
      clue: Do they change hormone levels to stop ovulation?
      why: Progestogens, with or without oestrogen, stop ovulation.
    - label: Saheli, a weekly pill
      bin: Hormonal pill or implant
      clue: Taken by mouth once a week. Which group?
      why: An oral contraceptive developed in India.
    - label: Implants under the skin
      bin: Hormonal pill or implant
      clue: They release progestogens slowly. Which group?
      why: Hormonal.
    - label: Copper-T (CuT)
      bin: IUD
      clue: Placed inside the uterus. Which group?
      why: A copper-releasing intrauterine device.
    - label: LNG-20
      bin: IUD
      clue: Placed inside the uterus, it releases a hormone. Which group?
      why: A hormone-releasing IUD.
    - label: Vasectomy
      bin: Surgical
      clue: Is the vas deferens cut and tied?
      why: A permanent surgical method in males.
    - label: Tubectomy
      bin: Surgical
      clue: Are the fallopian tubes cut and tied?
      why: A permanent surgical method in females.
    - label: Periodic abstinence
      bin: Natural
      clue: 'No devices or drugs: avoiding the fertile days. Which group?'
      why: A natural method.
    - label: Lactational amenorrhoea
      bin: Natural
      clue: Breastfeeding delays ovulation for a while. Which group?
      why: Natural (and only reliable for a short time).
  lesson:
    - teach: Reproductive health means physical, emotional, behavioural and social well-being in all aspects of reproduction. India started a national family planning programme in 1951; Reproductive and Child Health (RCH) programmes spread awareness, correct information and better care. Amniocentesis for sex determination is banned to prevent female foeticide.
      check:
        prompt: 'Reproductive health includes:'
        options:
        - physical, emotional, behavioural and social well-being
        - only physical fitness
        - only having children
        answer: physical, emotional, behavioural and social well-being
        why: The definition is broad, like WHO's idea of health.
      ways:
      - style: visual
        teach: What reproductive health covers, beyond just the absence of disease.
        picture:
          kind: compare
          columns:
          - title: Physical
            points:
            - Healthy organs
            - Safe pregnancy and birth
          - title: Emotional and social
            points:
            - Correct information
            - Freedom from stigma and force
          - title: Programmes
            points:
            - Family planning (1951)
            - 'RCH: awareness and care'
          alt: Reproductive health covers the physical side, such as healthy organs and safe pregnancy and birth; the emotional and social side, such as correct information and freedom from stigma and force; and programmes such as family planning from 1951 and Reproductive and Child Health for awareness and care.
      - style: real_world
        teach: School health clubs and Adolescent Friendly Health Clinics in India give teenagers a safe place to ask questions about puberty and the body. Correct information early prevents myths, fear and risky choices later.
    - teach: 'Contraceptive methods: natural (periodic abstinence, withdrawal, lactational amenorrhea), barrier (condoms, diaphragms), IUDs (copper-T releases Cu ions that lower sperm motility; hormonal IUDs), oral pills (Saheli, a once-a-week non-steroidal pill developed at CDRI Lucknow), injections and implants, and surgical (vasectomy, tubectomy). Emergency pills work within 72 hours.'
      picture:
        kind: compare
        columns:
        - title: Method
          points:
          - condom
          - copper-T
          - pill
          - vasectomy
        - title: How it works
          points:
          - blocks sperm
          - Cu ions affect sperm
          - stops ovulation
          - blocks vas deferens
        alt: Four contraceptive methods and how each works.
      check:
        prompt: 'Vasectomy blocks the:'
        options:
        - vas deferens
        - fallopian tubes
        - urethra
        answer: vas deferens
        why: Sperm can no longer travel out.
      ways:
      - style: step_by_step
        teach: 'Sort a contraceptive by how it works. Step 1: Does it rely on timing? Natural method. Step 2: Does it physically block sperm? Barrier. Step 3: Does it sit in the uterus? IUD. Step 4: Does it change hormones to stop ovulation, or is it surgery? Pill or injection, or permanent method.'
      - style: real_world
        teach: Choosing a contraceptive is a medical decision a couple makes with a doctor, based on health, age and whether they want children later. No single method suits everyone, which is why so many types exist.
    - teach: Medical termination of pregnancy (MTP) is legal in India under set conditions, and is safest early in pregnancy. A good contraceptive is user-friendly, effective, reversible and has few side effects; only condoms also protect against STIs.
      check:
        prompt: Which feature is wanted in an ideal contraceptive?
        options:
        - reversible with few side effects
        - permanent for everyone
        - painful to use
        answer: reversible with few side effects
        why: People should be able to plan children later.
      ways:
      - style: visual
        teach: The qualities that make a contraceptive ideal, and the one extra only some give.
        picture:
          kind: compare
          columns:
          - title: Should be
            points:
            - Easy to use
            - Effective
            - Reversible
            - Few side effects
          - title: Bonus
            points:
            - Also blocks STIs
            - Only barrier methods do this
          alt: An ideal contraceptive should be easy to use, effective, reversible and have few side effects. As a bonus, it would also block sexually transmitted infections, which only barrier methods do.
      - style: step_by_step
        teach: 'Why early MTP is safer. Step 1: Early in pregnancy the embryo is small. Step 2: The procedure is simpler, often by medicine. Step 3: There is less bleeding and risk. Step 4: So law and doctors favour the first trimester, done by trained providers.'
  items:
  - prompt: Emergency contraceptives work if taken within how many hours of intercourse?
    answer: '72'
    check: '72'
    difficulty: 1
    hints:
    - Three days.
    - '72.'
    solution: 72 hours.
    mistakes: {"24": "b12_emergency", "48": "b12_emergency", "120": "b12_emergency"}
  - prompt: 'Copper-releasing IUDs work mainly by:'
    options:
    - copper ions reducing sperm motility
    - stopping ovulation
    - killing the egg
    - blocking the vagina
    answer: copper ions reducing sperm motility
    difficulty: 2
    hints:
    - Cu ions.
    - Sperm can't swim well.
    solution: Copper ions suppress sperm motility and fertilising ability.
    mistakes: {"stopping ovulation": "b12_copper_t", "killing the egg": "b12_copper_t", "blocking the vagina": "b12_copper_t"}
  - prompt: Which method also protects against sexually transmitted infections?
    options:
    - condoms
    - oral pills
    - copper-T
    - vasectomy
    answer: condoms
    difficulty: 1
    hints:
    - Barrier.
    - Physical block.
    solution: Condoms.
    mistakes: {"oral pills": "b12_condom", "copper-T": "b12_condom", "vasectomy": "b12_condom"}
  - prompt: '''Saheli'', the weekly pill, was developed in:'
    options:
    - India (CDRI, Lucknow)
    - USA
    - China
    - UK
    answer: India (CDRI, Lucknow)
    difficulty: 2
    hints:
    - Non-steroidal.
    - Indian institute.
    solution: India, at CDRI Lucknow.
    mistakes: {"USA": "b12_saheli", "China": "b12_saheli", "UK": "b12_saheli"}
  - prompt: 'Tubectomy involves:'
    options:
    - cutting and tying the fallopian tubes
    - removing the uterus
    - cutting the vas deferens
    - inserting a copper-T
    answer: cutting and tying the fallopian tubes
    difficulty: 2
    hints:
    - Female surgical method.
    - Tubes.
    solution: Cutting and tying the fallopian tubes.
    mistakes: {"removing the uterus": "b12_tubectomy", "cutting the vas deferens": "b12_tubectomy", "inserting a copper-T": "b12_tubectomy"}
  - prompt: Why is amniocentesis for sex determination banned in India?
    options:
    - to prevent female foeticide
    - because it doesn't work
    - it is too expensive
    - it harms the mother always
    answer: to prevent female foeticide
    difficulty: 2
    hints:
    - Misuse.
    - Sex ratio.
    solution: To stop female foeticide.
    mistakes: {"because it doesn't work": "b12_amniocentesis", "it is too expensive": "b12_amniocentesis", "it harms the mother always": "b12_amniocentesis"}
  - prompt: In which year did India launch its national family planning programme?
    answer: '1951'
    check: '1951'
    difficulty: 1
    hints:
    - Soon after independence.
    - Early 1950s.
    solution: 'Step 1: one of the first countries. Step 2: 1951.'
    mistakes:
      '1947': c12b3_method
      '1975': c12b3_method
  - prompt: Which is a barrier method?
    options:
    - diaphragm
    - copper-T
    - oral pill
    answer: diaphragm
    difficulty: 1
    hints:
    - Barrier methods physically stop sperm.
    - Placed over the cervix.
    solution: 'Step 1: physical block. Step 2: diaphragm.'
    mistakes:
      copper-T: c12b3_method
      oral pill: c12b3_method
  - prompt: Lactational amenorrhea is reliable for up to about how many months after birth (with full breastfeeding)?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Intense breastfeeding delays ovulation.
    - About half a year.
    solution: 'Step 1: effective while fully breastfeeding. Step 2: up to 6 months.'
    mistakes:
      '12': c12b3_method
      '2': c12b3_method
  - prompt: 'Oral contraceptive pills mainly work by:'
    options:
    - stopping ovulation
    - killing sperm in the vagina
    - blocking the tubes
    answer: stopping ovulation
    difficulty: 2
    hints:
    - They contain hormones.
    - They act on the ovary.
    solution: 'Step 1: progestogens/oestrogens. Step 2: inhibit ovulation (and implantation).'
    mistakes:
      killing sperm in the vagina: c12b3_method
      blocking the tubes: c12b3_method
  - prompt: How often is Saheli taken?
    options:
    - once a week
    - every day
    - once a year
    answer: once a week
    difficulty: 2
    hints:
    - It is a non-steroidal pill.
    - Not daily.
    solution: 'Step 1: developed at CDRI. Step 2: weekly.'
    mistakes:
      every day: c12b3_method
      once a year: c12b3_method
  - prompt: Which method is permanent?
    options:
    - tubectomy
    - copper-T
    - condom
    answer: tubectomy
    difficulty: 2
    hints:
    - It is surgical.
    - Very hard to reverse.
    solution: 'Step 1: tubes cut and tied. Step 2: tubectomy.'
    mistakes:
      copper-T: c12b3_method
      condom: c12b3_method
  - prompt: Periodic abstinence avoids intercourse around which days of a 28-day cycle?
    options:
    - days 10 to 17
    - days 1 to 5
    - days 20 to 28
    answer: days 10 to 17
    difficulty: 2
    hints:
    - Avoid the fertile period.
    - Ovulation is about day 14.
    solution: 'Step 1: fertile window around ovulation. Step 2: days 10–17.'
    mistakes:
      days 1 to 5: c12b3_method
      days 20 to 28: c12b3_method
  - prompt: Why is a falling infant mortality rate linked with population growth?
    options:
    - more children survive, so population rises faster
    - fewer babies are born
    - it raises the death rate
    answer: more children survive, so population rises faster
    difficulty: 3
    hints:
    - Births minus deaths decides growth.
    - Fewer infant deaths.
    solution: 'Step 1: deaths fall. Step 2: births stay high, so population grows.'
    mistakes:
      fewer babies are born: c12b3_method
      it raises the death rate: c12b3_method
  - prompt: Why are hormonal IUDs like LNG-20 said to make the uterus unsuitable for implantation?
    options:
    - their hormones change the lining and cervical mucus
    - they dissolve the embryo
    - they raise body temperature
    answer: their hormones change the lining and cervical mucus
    difficulty: 3
    hints:
    - They release a progestogen.
    - Think of the endometrium and cervix.
    solution: 'Step 1: progestogen released. Step 2: lining less receptive, mucus hostile to sperm.'
    mistakes:
      they dissolve the embryo: c12b3_method
      they raise body temperature: c12b3_method
  - prompt: 'Assertion (A): Copper-T is an effective contraceptive.

      Reason (R): Copper ions released by it reduce sperm motility and their ability to fertilise.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Copper ions act on sperm in the uterus, reducing motility and fertilising capacity, so Copper-T prevents pregnancy. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A newly married couple wants to delay their first child for two years and then have children. Which method suits them best?'
    options:
    - A reversible method such as an IUD or pills, chosen with a doctor
    - Vasectomy
    - Tubectomy
    answer: A reversible method such as an IUD or pills, chosen with a doctor
    hints:
    - They want children later.
    - Which methods are hard or impossible to undo?
    solution: Surgical methods are meant to be permanent. A reversible method lets them plan a child later.
    mistakes:
      Vasectomy: c12b3_rev
      Tubectomy: c12b3_rev
    exam: case
    difficulty: 2
  - prompt: A health worker must explain which method protects against both pregnancy and STIs. Which one?
    options:
    - Condoms
    - Copper-T
    - Oral pills
    answer: Condoms
    hints:
    - STIs pass through body fluids.
    - Which method is a physical barrier?
    solution: Only barrier methods like condoms stop the exchange of body fluids, so they protect against STIs as well as pregnancy.
    mistakes:
      Copper-T: b12_condom
      Oral pills: b12_condom
    exam: competency
    difficulty: 2
- code: cbse12b.rh.sti
  title: STIs and infertility
  after:
  - cbse12b.rh.contraception
  notes: |
    Sexually transmitted infections: gonorrhoea, syphilis, genital herpes, chlamydiasis, genital warts, trichomoniasis, hepatitis
    B, HIV/AIDS; prevention (safe sex, avoiding shared needles, early treatment); complications (PID, infertility, ectopic
    pregnancy). Infertility and assisted reproductive technologies (ART): IVF with embryo transfer—ZIFT (zygote/embryo up to 8
    blastomeres into the fallopian tube), IUT (embryos with more than 8 blastomeres into the uterus); GIFT (ovum into the
    fallopian tube); ICSI (sperm injected into the ovum); artificial insemination (AI/IUI).
  explanations:
    text: Sexually transmitted infections spread through sexual contact; some, like hepatitis B and HIV, also spread through shared needles or blood. Most can be prevented and many cured if treated early. Couples who can't conceive can be helped by technologies like IVF.
    visual: 'Draw IVF: eggs and sperm are combined in a lab dish; the resulting early embryo is placed back into the woman''s oviduct or uterus.'
    step_by_step: 'Step 1: Name the infection or technique. Step 2: For STIs: how it spreads and how to prevent it. Step 3: For ART: where fertilisation happens and where the embryo is placed.'
    real_world: India's first IVF baby, Durga (Kanupriya Agarwal), was born in Kolkata in 1978.
  picture:
    kind: flow
    steps:
    - Collect eggs and sperm
    - Fertilise in the lab (in vitro)
    - Early embryo forms
    - Transfer to oviduct (ZIFT) or uterus (IUT)
    alt: IVF with embryo transfer, step by step.
  activity:
    type: sort
    prompt: What causes each sexually transmitted infection?
    bins:
    - Bacteria
    - Viruses
    - A protozoan
    items:
    - label: Gonorrhoea
      bin: Bacteria
      clue: Caused by Neisseria. Which kind of microbe is that?
      why: Neisseria gonorrhoeae is a bacterium, treatable with antibiotics.
    - label: Syphilis
      bin: Bacteria
      clue: Caused by Treponema pallidum. Which kind?
      why: A spiral bacterium.
    - label: Chlamydiasis
      bin: Bacteria
      clue: Caused by Chlamydia trachomatis. Which kind?
      why: A bacterium.
    - label: Genital herpes
      bin: Viruses
      clue: Caused by herpes simplex. Can antibiotics cure it?
      why: 'A virus: antibiotics don''t work.'
    - label: Genital warts
      bin: Viruses
      clue: Caused by HPV. Which kind?
      why: Human papilloma virus.
    - label: Hepatitis B
      bin: Viruses
      clue: There's a vaccine made from its surface protein. Which kind?
      why: A virus.
    - label: HIV/AIDS
      bin: Viruses
      clue: A retrovirus that attacks helper T cells. Which kind?
      why: A virus.
    - label: Trichomoniasis
      bin: A protozoan
      clue: Caused by Trichomonas vaginalis, a single-celled eukaryote. Which kind?
      why: A protozoan.
  lesson:
    - teach: Sexually transmitted infections (STIs) include gonorrhoea, syphilis, genital herpes, chlamydiasis, genital warts, trichomoniasis, hepatitis B and HIV/AIDS. Hepatitis B and HIV also spread through shared needles and transfusion of infected blood. Many are curable if found early.
      check:
        prompt: Which two STIs also spread by shared needles?
        options:
        - HIV and hepatitis B
        - syphilis and gonorrhoea
        - herpes and warts
        answer: HIV and hepatitis B
        why: They are carried in blood.
      ways:
      - style: visual
        teach: 'How common STIs spread: sexual contact only, or also through blood.'
        picture:
          kind: compare
          columns:
          - title: Mainly sexual contact
            points:
            - Gonorrhoea, syphilis
            - Chlamydiasis, trichomoniasis
            - Genital herpes, warts
          - title: Also through blood
            points:
            - Hepatitis B
            - HIV
            - Shared needles, unsafe transfusion
          alt: Gonorrhoea, syphilis, chlamydiasis, trichomoniasis, genital herpes and genital warts spread mainly by sexual contact. Hepatitis B and HIV also spread through blood, such as shared needles and unsafe transfusion.
      - style: real_world
        teach: Blood banks in India test every donated unit for HIV, hepatitis B, hepatitis C and syphilis before use. That screening is why transfusion has become far safer than it was a few decades ago.
    - teach: 'Untreated STIs can cause pelvic inflammatory disease, still births, ectopic pregnancy and infertility. Prevention: avoid unknown or multiple partners, use condoms, never share needles, and get checked and treated early.'
      picture:
        kind: flow
        steps:
        - Infection
        - Few or no symptoms at first
        - Not treated
        - PID, ectopic pregnancy
        - Infertility
        alt: How an untreated STI can progress to infertility.
      check:
        prompt: Why do many people not seek treatment for STIs early?
        options:
        - early symptoms may be mild or absent
        - they always heal alone
        - there is no treatment
        answer: early symptoms may be mild or absent
        why: Many STIs are silent at first; stigma also delays care.
      ways:
      - style: step_by_step
        teach: 'Why early treatment matters. Step 1: Many STIs show mild or no signs at first. Step 2: Untreated infection can spread up the reproductive tract. Step 3: This can cause pelvic inflammatory disease and scarring. Step 4: Scarred tubes can lead to ectopic pregnancy or infertility.'
      - style: real_world
        teach: A free check-up at a government STI clinic (Suraksha clinics) is confidential. Shame stops many people seeking help, so health campaigns stress that STIs are common, treatable infections, not something to hide.
    - teach: 'Assisted reproductive technologies help couples with infertility. IVF: fertilisation outside the body, then embryo transfer. ZIFT puts an embryo of up to 8 blastomeres into the fallopian tube; IUT puts a later embryo into the uterus. GIFT places an ovum from a donor into the tube. ICSI injects a sperm into the ovum. IUI places semen into the uterus.'
      check:
        prompt: 'An embryo with 16 cells is transferred directly into the uterus. This is:'
        options:
        - IUT
        - ZIFT
        - GIFT
        answer: IUT
        why: More than 8 blastomeres go to the uterus.
      ways:
      - style: visual
        teach: Assisted reproduction techniques sorted by what is placed where.
        picture:
          kind: compare
          columns:
          - title: Into the tube
            points:
            - 'ZIFT: early embryo'
            - 'GIFT: donor ovum'
          - title: Into the uterus
            points:
            - 'IUT: later embryo'
            - 'IUI: semen'
          - title: Into the ovum
            points:
            - 'ICSI: one sperm injected'
          alt: 'Into the fallopian tube: ZIFT places an early embryo and GIFT a donor ovum. Into the uterus: IUT places a later embryo and IUI places semen. Into the ovum: ICSI injects a single sperm.'
      - style: real_world
        teach: Louise Brown, born in 1978 in England, was the first IVF baby. Since then millions of children worldwide have been born through assisted reproduction, and India has many fertility clinics offering it.
  items:
  - prompt: In ZIFT, the embryo transferred has up to how many blastomeres?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - Into the fallopian tube.
    - Eight.
    solution: Up to 8.
    mistakes: {"16": "b12_zift", "32": "b12_zift", "4": "b12_zift"}
  - prompt: Which STI can also spread through shared needles and blood transfusion?
    options:
    - hepatitis B
    - genital warts
    - trichomoniasis
    - chlamydiasis
    answer: hepatitis B
    difficulty: 2
    hints:
    - Blood-borne.
    - Like HIV.
    solution: Hepatitis B (and HIV).
    mistakes: {"genital warts": "b12_hepatitis_b", "trichomoniasis": "b12_hepatitis_b", "chlamydiasis": "b12_hepatitis_b"}
  - prompt: 'In ICSI:'
    options:
    - a sperm is injected directly into the ovum
    - the ovum is put in the tube
    - semen is placed in the uterus
    - the embryo is frozen only
    answer: a sperm is injected directly into the ovum
    difficulty: 2
    hints:
    - Intra-cytoplasmic.
    - Injection.
