# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse12-bio
chapter: 5
title: Molecular Basis of Inheritance
tips:
  c12b_pair: 'Base pairing: A with T (2 hydrogen bonds), G with C (3). In RNA, A pairs with U. So %A = %T and %G = %C (Chargaff).'
  c12b_flow: 'Central dogma: DNA → (transcription) → RNA → (translation) → protein.'
concepts:
- code: cbse12b.mol.dna
  title: DNA structure and replication
  notes: |
    DNA: polynucleotide; nucleotide = nitrogenous base + deoxyribose + phosphate; phosphodiester bonds; Watson–Crick double
    helix (1953): antiparallel strands, A=T (2 H bonds), G≡C (3 H bonds), 10 bp per turn (3.4 nm), 0.34 nm between bp;
    Chargaff's rules. Human DNA ~6.6 × 10⁹ bp, length ~2.2 m; packaging: nucleosome (histone octamer), chromatin
    (euchromatin, heterochromatin). DNA as genetic material: Griffith (transformation), Avery–MacLeod–McCarty, Hershey–Chase
    (radioactive phage). Replication: semi-conservative (Meselson–Stahl, ¹⁵N); DNA polymerase 5′→3′, leading and lagging
    strands (Okazaki fragments, ligase).
  explanations:
    text: 'DNA is a double helix: two strands twisted together, held by base pairs, A with T and G with C. When a cell divides, DNA copies itself semi-conservatively: each new molecule keeps one old strand and builds one new one.'
    visual: 'Draw a ladder twisted into a spiral: the sides are sugar–phosphate backbones, the rungs are base pairs. Unzip it, and each half serves as a template for a new partner.'
    step_by_step: 'Step 1: Use base pairing (A–T, G–C). Step 2: If you know one base''s percentage, find the others with Chargaff''s rule. Step 3: Replication: each daughter DNA has one old and one new strand.'
    real_world: DNA fingerprinting in crime cases and paternity tests relies on DNA's base sequence.
  picture:
    kind: flow
    steps:
    - DNA unwinds
    - Strands separate
    - Each strand is a template
    - New complementary strands built
    - Two DNA molecules, each half old
    alt: Semi-conservative DNA replication.
  items:
  - prompt: A DNA sample has 30% adenine. What percentage is guanine?
    answer: '20'
    check: (100-2*30)/2
    difficulty: 2
    hints:
    - A = T = 30%.
    - G = C = 20%.
    solution: 20%.
    mistakes:
      '30': c12b_pair
  - prompt: How many hydrogen bonds join G and C?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Stronger pair.
    - Three.
    solution: '3.'
  - prompt: How many base pairs are in one turn of the B-DNA helix?
    answer: '10'
    check: Rational(34,10)/Rational(34,100)
    difficulty: 1
    hints:
    - 3.4 nm per turn.
    - 0.34 nm each.
    solution: '10.'
  - prompt: Who showed DNA replication is semi-conservative?
    options:
    - Meselson and Stahl
    - Watson and Crick
    - Hershey and Chase
    - Griffith
    answer: Meselson and Stahl
    difficulty: 2
    hints:
    - Heavy nitrogen ¹⁵N.
    - E. coli.
    solution: Meselson and Stahl.
  - prompt: 'Short DNA pieces made on the lagging strand are:'
    options:
    - Okazaki fragments
    - nucleosomes
    - introns
    - codons
    answer: Okazaki fragments
    difficulty: 2
    hints:
    - Joined by ligase.
    - Discontinuous.
    solution: Okazaki fragments.
  - prompt: 'Hershey and Chase proved that the genetic material of phages is:'
    options:
    - DNA
    - protein
    - RNA
    - lipid
    answer: DNA
    difficulty: 1
    hints:
    - Radioactive P entered.
    - Not S.
    solution: DNA.
- code: cbse12b.mol.expression
  title: Transcription, translation and regulation
  after:
  - cbse12b.mol.dna
  notes: |
    Central dogma DNA → RNA → protein (reverse transcription in retroviruses). Transcription: RNA polymerase; template strand
    3′→5′, coding strand; promoter, terminator; in eukaryotes hnRNA processed by splicing (introns removed, exons joined),
    capping, tailing. Genetic code: triplet, 64 codons, 61 for amino acids, AUG start (Met), UAA/UAG/UGA stop; degenerate,
    unambiguous, universal, non-overlapping. tRNA (anticodon, adapter). Translation on ribosomes: initiation, elongation,
    termination. Gene regulation: lac operon (inducer lactose; repressor; z, y, a genes). Human Genome Project (~3 × 10⁹ bp,
    ~20,000–25,000 genes); DNA fingerprinting (VNTRs, Alec Jeffreys).
  explanations:
    text: 'Genes are expressed in two steps: transcription copies DNA into messenger RNA, then translation reads the mRNA in three-letter codons to build a protein. The lac operon in bacteria shows how genes can be switched on only when needed.'
    visual: Draw mRNA as a tape running through a ribosome. tRNAs bring amino acids, matching their anticodons to each codon, and the ribosome links the amino acids into a chain.
    step_by_step: 'Step 1: Transcription: DNA template → mRNA (A pairs with U). Step 2: Split mRNA into codons. Step 3: Use the code table: AUG starts, UAA/UAG/UGA stop. Step 4: Count amino acids.'
    real_world: The Human Genome Project mapped all our genes, helping doctors understand inherited diseases.
  picture:
    kind: flow
    steps:
    - DNA
    - Transcription → mRNA
    - mRNA to ribosome
    - Translation → protein
    alt: 'The central dogma: DNA is transcribed to mRNA, which is translated into protein.'
  items:
  - prompt: How many codons are there in the genetic code?
    answer: '64'
    check: 4**3
    difficulty: 1
    hints:
    - 4³.
    - Four bases, triplets.
    solution: '64.'
  - prompt: How many of them code for amino acids?
    answer: '61'
    check: 64-3
    difficulty: 2
    hints:
    - Three are stop codons.
    - 64 − 3.
    solution: '61.'
  - prompt: An mRNA has 300 bases in its coding region (excluding the stop codon). How many amino acids does it code?
    answer: '100'
    check: 300/3
    difficulty: 2
    hints:
    - 3 bases per codon.
    - 300/3.
    solution: '100.'
  - prompt: 'The start codon is:'
    options:
    - AUG
    - UAA
    - UGA
    - UAG
    answer: AUG
    difficulty: 1
    hints:
    - Methionine.
    - Begins translation.
    solution: AUG.
  - prompt: 'Removing introns and joining exons is called:'
    options:
    - splicing
    - capping
    - tailing
    - translation
    answer: splicing
    difficulty: 2
    hints:
    - Eukaryotic processing.
    - Cut and join.
    solution: Splicing.
  - prompt: 'In the lac operon, the inducer is:'
    options:
    - lactose (allolactose)
    - glucose
    - the repressor
    - RNA polymerase
    answer: lactose (allolactose)
    difficulty: 2
    hints:
    - Binds the repressor.
    - Switches genes on.
    solution: Lactose.
    mistakes:
      glucose: c12b_flow
