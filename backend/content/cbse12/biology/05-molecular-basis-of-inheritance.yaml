# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse12-bio
chapter: 5
title: Molecular Basis of Inheritance
tips:
  c12b_pair: 'Base pairing: A with T (2 hydrogen bonds), G with C (3). In RNA, A pairs with U. So %A = %T and %G = %C (Chargaff).'
  c12b_flow: 'Central dogma: DNA → (transcription) → RNA → (translation) → protein.'
  b12_codon_count: "Each amino acid needs one codon of 3 bases."
  b12_codons: "Each codon is 3 bases from 4 possible: 4 × 4 × 4."
  b12_gc_bonds: "A–T has two hydrogen bonds; G–C has one more."
  b12_helix_turn: "One turn of B-DNA is 3.4 nm and bases are 0.34 nm apart."
  b12_hershey: "Radioactive phosphorus entered the bacteria; radioactive sulfur did not."
  b12_meselson: "They used heavy nitrogen (¹⁵N) and density gradients in 1958."
  b12_okazaki: "Lagging-strand fragments are named after the Japanese scientist who found them."
  b12_sense_codons: "Total codons minus the three stop codons."
  b12_splicing: "Capping and tailing add to the ends. Cutting out introns is a different step."
  b12_start_codon: "UAA, UAG and UGA are stop codons. The start codon codes for methionine."
  c12b5_pair: 'Use base pairing: A pairs with T (U in RNA) and G pairs with C, so A = T and G = C in double-stranded DNA.'
  c12b5_code: Codons are read three bases at a time; stop codons code for no amino acid.
  c12b5_exp: 'Link each classic experiment to what it showed: Griffith (transformation), Hershey–Chase (DNA is genetic material), Meselson–Stahl (semi-conservative).'
  c12b5_hc: Ask which part of the phage carried the label that ended up inside the bacteria.
  c12b5_mut: 'Count what changes downstream: does one codon change, or does every later codon shift?'
concepts:
- code: cbse12b.mol.dna
  title: DNA structure and replication
  notes: |
    DNA: polynucleotide; nucleotide = nitrogenous base + deoxyribose + phosphate; phosphodiester bonds; Watson–Crick double
    helix (1953): antiparallel strands, A=T (2 H bonds), G≡C (3 H bonds), 10 bp per turn (3.4 nm), 0.34 nm between bp;
    Chargaff's rules. Human DNA ~6.6 × 10⁹ bp, length ~2.2 m; packaging: nucleosome (histone octamer), chromatin
    (euchromatin, heterochromatin). DNA as genetic material: Griffith (transformation), Avery–MacLeod–McCarty, Hershey–Chase
    (radioactive phage). Replication: semi-conservative (Meselson–Stahl, ¹⁵N); DNA polymerase 5′→3′, leading and lagging
    strands (Okazaki fragments, ligase).
  explanations:
    text: 'DNA is a double helix: two strands twisted together, held by base pairs, A with T and G with C. When a cell divides, DNA copies itself semi-conservatively: each new molecule keeps one old strand and builds one new one.'
    visual: 'Draw a ladder twisted into a spiral: the sides are sugar–phosphate backbones, the rungs are base pairs. Unzip it, and each half serves as a template for a new partner.'
    step_by_step: 'Step 1: Use base pairing (A–T, G–C). Step 2: If you know one base''s percentage, find the others with Chargaff''s rule. Step 3: Replication: each daughter DNA has one old and one new strand.'
    real_world: DNA fingerprinting in crime cases and paternity tests relies on DNA's base sequence.
  picture:
    kind: flow
    steps:
    - DNA unwinds
    - Strands separate
    - Each strand is a template
    - New complementary strands built
    - Two DNA molecules, each half old
    alt: Semi-conservative DNA replication.
  activity:
    type: formula
    prompt: 'Chargaff''s rule: A pairs with T and G with C, so A = T and G = C. A–T pairs have 2 hydrogen bonds; G–C pairs have 3.'
    inputs:
    - name: a
      label: Adenine
      min: 0
      max: 50
      step: 1
      start: 25
      unit: '%'
    outputs:
    - name: t
      label: Thymine
      expr: a
      unit: '%'
    - name: g
      label: Guanine
      expr: (100-2*a)/2
      unit: '%'
    - name: h
      label: H bonds in 100 base pairs
      expr: 2*(2*a)+3*(100-2*a)
    goals:
    - prompt: Make DNA that is 30% guanine.
      want:
        g: 30
      mistakes:
      - when:
          a: 30
        say: That makes A = T = 30% and G only 20%. G = C = 30% leaves 40% for A and T together.
      - when:
          a: 40
        say: A = 40% makes T 40% too, leaving only 10% G.
    - prompt: 100 base pairs held by 240 hydrogen bonds. Set the adenine %.
      want:
        h: 240
      mistakes:
      - when:
          a: 20
        say: A = 20% gives 260 bonds. A–T pairs have only 2 bonds, so more A–T means FEWER bonds.
      - when:
          a:
          - 0
          - 19
        say: 'Too many bonds: that''s rich in G–C. More A–T lowers the count.'
    - prompt: Make DNA held together as strongly as possible.
      want:
        a: 0
      mistakes:
      - when:
          a: 50
        say: 'All A–T: only 2 bonds per pair, the weakest. G–C pairs have 3.'
  lesson:
    - teach: 'A nucleotide has a nitrogenous base, a deoxyribose sugar and a phosphate. Nucleotides join by phosphodiester bonds. Watson and Crick (1953) showed DNA is a double helix of two antiparallel strands; A pairs with T by 2 hydrogen bonds and G with C by 3. One turn has 10 base pairs and is 3.4 nm long. Chargaff''s rule: A = T and G = C.'
      picture:
        kind: compare
        columns:
        - title: Pair
          points:
          - A–T
          - G–C
        - title: H bonds
          points:
          - '2'
          - '3'
        alt: Base pairs of DNA and the number of hydrogen bonds in each.
      check:
        prompt: 'In double-stranded DNA, the amount of A equals the amount of:'
        options:
        - T
        - G
        - C
        answer: T
        why: Every A on one strand pairs with a T on the other.
      ways:
      - style: step_by_step
        teach: 'A DNA strand has 5′-GGATC-3′. Step 1: Pair each base: G–C, A–T. Step 2: Complement in order: CCTAG. Step 3: The new strand runs the other way. Step 4: Written 3′→5′ it is 3′-CCTAG-5′.'
      - style: real_world
        teach: 'DNA''s two strands are like the two sides of a zip: the teeth (bases) only fit their own partner. Unzip it and each side carries enough information to rebuild the other, which is why the pairing rule matters so much.'
    - teach: Griffith showed a 'transforming principle' turned harmless R strain Pneumococcus into deadly S strain. Avery, MacLeod and McCarty showed this principle is DNA. Hershey and Chase grew phages with radioactive phosphorus (DNA) or sulphur (protein); only the phosphorus entered bacteria, proving DNA is the genetic material. Human DNA is about 2.2 m long and is packed around histone octamers as nucleosomes.
      check:
        prompt: 'In Hershey and Chase''s experiment, the label that entered bacteria was:'
        options:
        - ³²P in DNA
        - ³⁵S in protein
        - ¹⁵N in protein
        answer: ³²P in DNA
        why: DNA has phosphorus; protein coats stayed outside.
      ways:
      - style: visual
        teach: Three experiments that pinned down the genetic material.
        picture:
          kind: flow
          steps:
          - 'Griffith (1928): heat-killed S turns live R deadly'
          - 'Avery, MacLeod, McCarty: the transforming principle is DNA'
          - 'Hershey–Chase (1952): ³²P (DNA) enters bacteria, ³⁵S (protein) stays out'
          - 'Conclusion: DNA is the genetic material'
          alt: In 1928 Griffith found heat-killed S bacteria could turn live R bacteria deadly. Avery, MacLeod and McCarty showed the transforming principle is DNA. In 1952 Hershey and Chase showed labelled phosphorus in DNA enters bacteria while labelled sulphur in protein stays out. So DNA is the genetic material.
      - style: real_world
        teach: Each of your cells packs about two metres of DNA into a nucleus a few micrometres wide. It's like fitting 40 km of thread into a tennis ball. Winding it round histone spools (nucleosomes) makes this possible.
    - teach: 'DNA replication is semi-conservative: each new molecule keeps one old strand. Meselson and Stahl showed this using heavy ¹⁵N and light ¹⁴N in E. coli. DNA polymerase adds nucleotides only 5′→3′, so the leading strand is made continuously and the lagging strand in short Okazaki fragments joined by DNA ligase.'
      picture:
        kind: flow
        steps:
        - parent DNA (old + old)
        - strands separate
        - each strand is a template
        - two DNAs (old + new each)
        alt: 'Semi-conservative replication: each daughter DNA keeps one old strand.'
      check:
        prompt: 'Okazaki fragments are joined by:'
        options:
        - DNA ligase
        - helicase
        - RNA polymerase
        answer: DNA ligase
        why: Ligase seals the gaps between fragments.
      ways:
      - style: real_world
        teach: Photocopying a two-page letter by separating the pages, then copying each onto a blank sheet, gives two sets each with one original and one new page. That is semi-conservative replication.
      - style: step_by_step
        teach: 'Meselson–Stahl after two generations in ¹⁴N. Step 1: Start: all heavy (¹⁵N/¹⁵N). Step 2: Generation 1: all hybrid (¹⁵N/¹⁴N). Step 3: Generation 2: each hybrid gives one hybrid and one light. Step 4: So half hybrid, half light.'
  items:
  - prompt: A DNA sample has 30% adenine. What percentage is guanine?
    answer: '20'
    check: (100-2*30)/2
    difficulty: 2
    hints:
    - A = T = 30%.
    - G = C = 20%.
    solution: "Chargaff: A = T = 30%, so G + C = 100 − 60 = 40%, and G = C = 20%."
    mistakes:
      '30': c12b_pair
  - prompt: How many hydrogen bonds join G and C?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Stronger pair.
    - Three.
    solution: "G pairs with C by 3 hydrogen bonds (A pairs with T by 2)."
    mistakes: {"2": "b12_gc_bonds", "4": "b12_gc_bonds"}
  - prompt: How many base pairs are in one turn of the B-DNA helix?
    answer: '10'
    check: Rational(34,10)/Rational(34,100)
    difficulty: 1
    hints:
    - 3.4 nm per turn.
    - 0.34 nm each.
    solution: "One turn of B-DNA is 3.4 nm long with 0.34 nm between pairs: 3.4/0.34 = 10 base pairs."
    mistakes: {"3.4": "b12_helix_turn", "20": "b12_helix_turn"}
  - prompt: Who showed DNA replication is semi-conservative?
    options:
    - Meselson and Stahl
    - Watson and Crick
    - Hershey and Chase
    - Griffith
    answer: Meselson and Stahl
    difficulty: 2
    hints:
    - Heavy nitrogen ¹⁵N.
    - E. coli.
    solution: "Meselson and Stahl grew E. coli in ¹⁵N then ¹⁴N; the hybrid DNA band showed each new molecule keeps one old strand."
    mistakes: {"Watson and Crick": "b12_meselson", "Hershey and Chase": "b12_meselson", "Griffith": "b12_meselson"}
  - prompt: 'Short DNA pieces made on the lagging strand are:'
    options:
    - Okazaki fragments
    - nucleosomes
    - introns
    - codons
    answer: Okazaki fragments
    difficulty: 2
    hints:
    - Joined by ligase.
    - Discontinuous.
    solution: "DNA polymerase works only 5′→3′, so the lagging strand is made in short pieces, Okazaki fragments, later joined by ligase."
    mistakes: {"nucleosomes": "b12_okazaki", "introns": "b12_okazaki", "codons": "b12_okazaki"}
  - prompt: 'Hershey and Chase proved that the genetic material of phages is:'
    options:
    - DNA
    - protein
    - RNA
    - lipid
    answer: DNA
    difficulty: 1
    hints:
    - Radioactive P entered.
    - Not S.
    solution: "Radioactive phosphorus (in DNA) entered the bacteria while radioactive sulphur (in protein) stayed outside, so DNA is the genetic material."
    mistakes: {"protein": "b12_hershey", "RNA": "b12_hershey", "lipid": "b12_hershey"}
  - prompt: A DNA molecule has 1,000 base pairs, of which 300 are G–C pairs. How many hydrogen bonds hold the strands together?
    answer: '2300'
    check: '2300'
    difficulty: 3
    hints:
    - Find the number of A–T pairs first.
    - Multiply each kind of pair by its hydrogen bonds and add.
    solution: 'Step 1: A–T pairs = 700; 700 × 2 = 1400. Step 2: 300 × 3 = 900; total 2300.'
    mistakes:
      '2000': c12b5_pair
      '2500': c12b5_pair
      '3000': c12b5_pair
  - prompt: 'One strand reads 5′-ATGC-3′. The complementary strand read 3′→5′ is:'
    options:
    - TACG
    - ATGC
    - GCAT
    answer: TACG
    difficulty: 1
    hints:
    - Pair each base with its partner.
    - Keep the order, just swap partners.
    solution: 'Step 1: A–T, T–A, G–C, C–G. Step 2: 3′-TACG-5′.'
    mistakes:
      ATGC: c12b5_pair
      GCAT: c12b5_pair
  - prompt: How long (in nm) is one turn of the DNA helix?
    options:
    - '3.4'
    - '0.34'
    - '34'
    answer: '3.4'
    difficulty: 2
    hints:
    - Base pairs are 0.34 nm apart.
    - Multiply by the base pairs in one turn.
    solution: 'Step 1: 10 × 0.34 nm. Step 2: 3.4 nm.'
    mistakes:
      '0.34': c12b5_pair
      '34': c12b5_pair
  - prompt: 'The two strands of DNA run in opposite directions. They are:'
    options:
    - antiparallel
    - parallel
    - identical
    answer: antiparallel
    difficulty: 1
    hints:
    - One runs 5′→3′, the other 3′→5′.
    - Anti means opposite.
    solution: 'Step 1: opposite directions. Step 2: antiparallel.'
    mistakes:
      parallel: c12b5_pair
      identical: c12b5_pair
  - prompt: 'Griffith''s experiment showed:'
    options:
    - "transformation of R strain bacteria into S strain"
    - "that DNA replicates in a semi-conservative way"
    - "that the genetic code is read in triplets"
    answer: transformation of R strain bacteria into S strain
    difficulty: 1
    hints:
    - He worked with Streptococcus pneumoniae and mice.
    - Heat-killed S plus live R killed the mice.
    solution: 'Step 1: something passed from dead S to live R. Step 2: transformation.'
    mistakes:
      "that DNA replicates in a semi-conservative way": c12b5_exp
      "that the genetic code is read in triplets": c12b5_exp
  - prompt: A nucleosome core has how many histone molecules?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - It is a histone octamer.
    - Octa means…
    solution: 'Step 1: two each of four histones. Step 2: 8.'
    mistakes:
      '4': c12b5_pair
      '2': c12b5_pair
  - prompt: 'In Meselson–Stahl''s experiment, after one generation in ¹⁴N, the DNA was:'
    options:
    - "all hybrid (intermediate density)"
    - "half heavy and half light DNA"
    - "all light, with no ¹⁵N left"
    answer: all hybrid (intermediate density)
    difficulty: 3
    hints:
    - Each new DNA keeps one old strand.
    - Old strands had ¹⁵N, new ones ¹⁴N.
    solution: 'Step 1: every molecule = one ¹⁵N + one ¹⁴N strand. Step 2: all hybrid.'
    mistakes:
      "half heavy and half light DNA": c12b5_exp
      "all light, with no ¹⁵N left": c12b5_exp
  - prompt: 'Loosely packed, active chromatin is called:'
    options:
    - euchromatin
    - heterochromatin
    - nucleosome
    answer: euchromatin
    difficulty: 1
    hints:
    - It stains lightly.
    - It is transcriptionally active.
    solution: 'Step 1: loose and active. Step 2: euchromatin.'
    mistakes:
      heterochromatin: c12b5_exp
      nucleosome: c12b5_exp
  - prompt: DNA polymerase adds new nucleotides in which direction?
    options:
    - 5′→3′
    - 3′→5′
    - both directions
    answer: 5′→3′
    difficulty: 2
    hints:
    - It needs a free 3′-OH end.
    - This is why the lagging strand is made in pieces.
    solution: 'Step 1: adds to the 3′ end. Step 2: grows 5′→3′.'
    mistakes:
      3′→5′: c12b5_exp
      both directions: c12b5_exp
  - prompt: 'Assertion (A): DNA with a higher proportion of G–C pairs needs more heat to separate its strands.

      Reason (R): A G–C pair is held by three hydrogen bonds, while an A–T pair is held by two.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: More hydrogen bonds per pair means more energy is needed to pull the strands apart. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In a Hershey–Chase style experiment, a student labels phage protein coats with ³⁵S. After infection and blending, where is most of the radioactivity found?'
    options:
    - In the liquid outside the bacteria
    - Inside the bacteria
    - In the new phages made inside
    answer: In the liquid outside the bacteria
    hints:
    - Which part of the phage contains sulphur?
    - Does that part enter the bacterium?
    solution: ³⁵S labels protein, which stays outside as the empty coat. Blending knocks the coats off, so the label stays in the liquid.
    mistakes:
      Inside the bacteria: c12b5_hc
      In the new phages made inside: c12b5_hc
    exam: case
    difficulty: 2
  - prompt: In a DNA sample, 18% of bases are thymine. What percentage are cytosine?
    options:
    - 32%
    - 18%
    - 64%
    answer: 32%
    hints:
    - A = T, so A is also 18%.
    - Share the rest equally between G and C.
    solution: A + T = 36%, leaving 64% for G + C. C = 32%.
    mistakes:
      18%: c12b5_pair
      64%: c12b5_pair
    exam: competency
    difficulty: 2
- code: cbse12b.mol.expression
  title: Transcription, translation and regulation
  after:
  - cbse12b.mol.dna
  notes: |
    Central dogma DNA → RNA → protein (reverse transcription in retroviruses). Transcription: RNA polymerase; template strand
    3′→5′, coding strand; promoter, terminator; in eukaryotes hnRNA processed by splicing (introns removed, exons joined),
    capping, tailing. Genetic code: triplet, 64 codons, 61 for amino acids, AUG start (Met), UAA/UAG/UGA stop; degenerate,
    unambiguous, universal, non-overlapping. tRNA (anticodon, adapter). Translation on ribosomes: initiation, elongation,
    termination. Gene regulation: lac operon (inducer lactose; repressor; z, y, a genes). Human Genome Project (~3 × 10⁹ bp,
    ~20,000–25,000 genes); DNA fingerprinting (VNTRs, Alec Jeffreys).
  explanations:
    text: 'Genes are expressed in two steps: transcription copies DNA into messenger RNA, then translation reads the mRNA in three-letter codons to build a protein. The lac operon in bacteria shows how genes can be switched on only when needed.'
    visual: Draw mRNA as a tape running through a ribosome. tRNAs bring amino acids, matching their anticodons to each codon, and the ribosome links the amino acids into a chain.
    step_by_step: 'Step 1: Transcription: DNA template → mRNA (A pairs with U). Step 2: Split mRNA into codons. Step 3: Use the code table: AUG starts, UAA/UAG/UGA stop. Step 4: Count amino acids.'
    real_world: The Human Genome Project mapped all our genes, helping doctors understand inherited diseases.
  picture:
    kind: flow
    steps:
    - DNA
    - Transcription → mRNA
    - mRNA to ribosome
    - Translation → protein
    alt: 'The central dogma: DNA is transcribed to mRNA, which is translated into protein.'
  activity:
    type: order
    prompt: Put the steps from gene to protein in a eukaryote in order.
    steps:
    - RNA polymerase binds the promoter
    - mRNA is copied from the template strand
    - Introns are spliced out; a cap and tail are added
    - The mRNA moves to the cytoplasm
    - A ribosome starts at AUG with tRNA carrying methionine
    - tRNAs bring amino acids; peptide bonds join them
    - A stop codon ends translation
    reasons:
      mRNA is copied from the template strand: Copying can only start once RNA polymerase is bound at the promoter.
      Introns are spliced out; a cap and tail are added: Processing needs the primary transcript to be made first.
      The mRNA moves to the cytoplasm: Only processed mRNA leaves the nucleus.
      A ribosome starts at AUG with tRNA carrying methionine: Translation happens in the cytoplasm, so the mRNA must be there first.
      tRNAs bring amino acids; peptide bonds join them: The chain grows only after the start codon sets the reading frame.
      A stop codon ends translation: The stop codon is reached at the end, after the chain has been built.
  lesson:
    - teach: 'The central dogma: DNA → RNA → protein (retroviruses also copy RNA back to DNA). In transcription, RNA polymerase reads the template strand (3′→5′) between a promoter and a terminator. The other strand is the coding strand: its sequence matches the mRNA except U replaces T. In eukaryotes the first copy (hnRNA) is processed: introns are spliced out, a cap and a poly-A tail are added.'
      picture:
        kind: flow
        steps:
        - DNA
        - transcription
        - mRNA
        - translation
        - protein
        alt: The central dogma from DNA to protein.
      check:
        prompt: Which strand has the same sequence as the mRNA (with T for U)?
        options:
        - coding strand
        - template strand
        - neither
        answer: coding strand
        why: The mRNA is copied from the template, so it matches the coding strand.
      ways:
      - style: step_by_step
        teach: 'A template strand reads 3′-TACGGA-5′. Step 1: RNA pairs with the template: T→A, A→U, C→G, G→C. Step 2: mRNA is 5′-AUGCCU-3′. Step 3: It matches the coding strand, 5′-ATGCCT-3′, with U for T. Step 4: Codons: AUG (start), CCU.'
      - style: real_world
        teach: A recipe book (DNA) stays safely in the library (nucleus). You photocopy one recipe (mRNA), take it to the kitchen (ribosome), and cook (make protein). Cutting out the ads between recipe steps is splicing.
    - teach: 'The genetic code is triplet: 64 codons, 61 for amino acids and 3 stop codons (UAA, UAG, UGA). AUG codes for methionine and is the start codon. The code is degenerate (several codons for one amino acid), unambiguous, nearly universal and non-overlapping. tRNA is the adapter: its anticodon pairs with a codon, and it carries the matching amino acid to the ribosome.'
      check:
        prompt: How many stop codons are there?
        options:
        - '3'
        - '1'
        - '4'
        answer: '3'
        why: UAA, UAG and UGA.
      ways:
      - style: visual
        teach: 'The main features of the genetic code: how it is read and what it means.'
        picture:
          kind: compare
          columns:
          - title: How it's read
            points:
            - 'Triplet: 3 bases = 1 codon'
            - Non-overlapping
            - AUG starts; 3 codons stop
          - title: What it means
            points:
            - 'Degenerate: many codons, one amino acid'
            - 'Unambiguous: one codon, one amino acid'
            - Nearly universal
          alt: The code is read as triplets, three bases per codon, without overlap; AUG starts and three codons stop. It is degenerate, with many codons for one amino acid, unambiguous, with each codon meaning one amino acid, and nearly universal.
      - style: step_by_step
        teach: 'Read mRNA 5′-AUG UUU GGC UAG-3′. Step 1: AUG: start, methionine. Step 2: UUU: phenylalanine. Step 3: GGC: glycine. Step 4: UAG: stop. The peptide has 3 amino acids.'
    - teach: Genes are switched on and off as needed. In E. coli's lac operon, a repressor blocks the operator; lactose (the inducer) binds the repressor so the z, y and a genes are transcribed. The Human Genome Project found about 3 × 10⁹ bp and roughly 20,000–25,000 genes. DNA fingerprinting compares repeat regions (VNTRs) and is used in forensics and paternity tests.
      check:
        prompt: 'When lactose is absent, the lac genes are:'
        options:
        - switched off by the repressor
        - always on
        - deleted
        answer: switched off by the repressor
        why: The repressor sits on the operator.
      ways:
      - style: visual
        teach: The lac operon in E. coli, switched off without lactose and on with it.
        picture:
          kind: compare
          columns:
          - title: No lactose
            points:
            - Repressor binds the operator
            - RNA polymerase blocked
            - z, y, a genes off
          - title: Lactose present
            points:
            - Inducer binds the repressor
            - Repressor leaves the operator
            - z, y, a genes transcribed
          alt: With no lactose, the repressor binds the operator, blocking RNA polymerase, so genes z, y and a are off. With lactose present, the inducer binds the repressor, which leaves the operator, and the genes are transcribed.
      - style: real_world
        teach: DNA fingerprinting helped identify victims after disasters and reunite lost children with families. Repeat regions (VNTRs) vary so much between people that, apart from identical twins, no two patterns match.
  items:
  - prompt: How many codons are there in the genetic code?
    answer: '64'
    check: 4**3
    difficulty: 1
    hints:
    - 4³.
    - Four bases, triplets.
    solution: "Each codon is 3 bases chosen from 4: 4³ = 64 codons."
    mistakes: {"61": "b12_codons", "20": "b12_codons", "12": "b12_codons"}
  - prompt: How many of them code for amino acids?
    answer: '61'
    check: 64-3
    difficulty: 2
    hints:
    - Three are stop codons.
    - 64 − 3.
