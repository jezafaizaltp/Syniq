# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse12-bio
chapter: 8
title: Microbes in Human Welfare
tips:
  c12b_bod: 'BOD measures how much oxygen microbes use to break down organic matter: high BOD = more polluted water.'
concepts:
- code: cbse12b.microbes.industry
  title: Microbes in household and industrial products
  notes: |
    Household: Lactobacillus (milk → curd; lactic acid; vitamin B₁₂), yeast (bread dough; Saccharomyces cerevisiae), idli/dosa
    fermentation, Swiss cheese (Propionibacterium shermanii; large holes from CO₂), Roquefort cheese (fungi). Industrial:
    beverages (yeast; wine, beer without distillation; whisky, rum with distillation), antibiotics (penicillin—Alexander Fleming,
    Penicillium notatum; Chain and Florey), organic acids (Aspergillus niger—citric; Acetobacter aceti—acetic; Clostridium
    butylicum—butyric; Lactobacillus—lactic), ethanol (yeast), enzymes (lipases in detergents, pectinases for clearing juices,
    streptokinase—clot buster from Streptococcus), cyclosporin A (Trichoderma polysporum, immunosuppressant), statins (Monascus
    purpureus, lower cholesterol).
  explanations:
    text: Microbes help make curd, bread, idli, cheese, medicines and industrial chemicals. Lactobacillus turns milk into curd; yeast makes bread rise and ferments drinks; the fungus Penicillium gave us penicillin, the first antibiotic.
    visual: 'Picture a kitchen: warm milk plus a spoon of curd overnight gives curd (Lactobacillus); dough rises with yeast (CO₂ bubbles); idli batter puffs up overnight.'
    step_by_step: 'Step 1: Name the product. Step 2: Identify the microbe. Step 3: Name what it makes (acid, CO₂, alcohol, enzyme, drug).'
    real_world: Streptokinase, a microbe-made enzyme, is used in hospitals to dissolve clots in heart attack patients.
  picture:
    kind: compare
    columns:
    - title: Product
      points:
      - curd
      - penicillin
      - citric acid
      - streptokinase
    - title: Microbe
      points:
      - Lactobacillus
      - Penicillium notatum
      - Aspergillus niger
      - Streptococcus
    alt: Products and the microbes that make them.
  items:
  - prompt: 'Milk is turned into curd by:'
    options:
    - Lactobacillus
    - yeast
    - Penicillium
    - Aspergillus
    answer: Lactobacillus
    difficulty: 1
    hints:
    - Lactic acid bacteria.
    - LAB.
    solution: Lactobacillus.
  - prompt: 'Penicillin was discovered by:'
    options:
    - Alexander Fleming
    - Louis Pasteur
    - Robert Koch
    - Edward Jenner
    answer: Alexander Fleming
    difficulty: 1
    hints:
    - '1928.'
    - Mould on a plate.
    solution: Alexander Fleming.
  - prompt: 'The large holes in Swiss cheese are made by:'
    options:
    - CO₂ from Propionibacterium shermanii
    - air pumped in
    - yeast alcohol
    - mice
    answer: CO₂ from Propionibacterium shermanii
    difficulty: 2
    hints:
    - Gas bubbles.
    - A bacterium.
    solution: CO₂ from Propionibacterium shermanii.
  - prompt: 'Citric acid is produced industrially by:'
    options:
    - Aspergillus niger
    - Acetobacter aceti
    - Clostridium butylicum
    - Lactobacillus
    answer: Aspergillus niger
    difficulty: 2
    hints:
    - A fungus.
    - Black mould.
    solution: Aspergillus niger.
  - prompt: 'Statins, which lower blood cholesterol, come from:'
    options:
    - Monascus purpureus (yeast)
    - Trichoderma
    - Streptococcus
    - Penicillium
    answer: Monascus purpureus (yeast)
    difficulty: 2
    hints:
    - Competitive inhibitor.
    - A yeast.
    solution: Monascus purpureus.
  - prompt: 'Cyclosporin A is used in organ transplants as:'
    options:
    - an immunosuppressant
    - an antibiotic
    - a clot buster
    - a vitamin
    answer: an immunosuppressant
    difficulty: 2
    hints:
    - Stops rejection.
    - From Trichoderma.
    solution: An immunosuppressant.
- code: cbse12b.microbes.environment
  title: Microbes in sewage, biogas, biocontrol and biofertilisers
  after:
  - cbse12b.microbes.industry
  notes: |
    Sewage treatment: primary (physical: filtration, sedimentation; primary sludge), secondary/biological (aerobic microbes in
    aeration tanks form flocs, reduce BOD; activated sludge; anaerobic sludge digesters make biogas). BOD. Ganga and Yamuna
    Action Plans. Biogas: methanogens (Methanobacterium) in cattle dung; gobar gas plants (KVIC, IARI). Biocontrol: ladybird and
    dragonflies eat pests; Bacillus thuringiensis (Bt) against caterpillars; Trichoderma (fungal); baculoviruses
    (Nucleopolyhedrovirus) species-specific; IPM. Biofertilisers: Rhizobium (root nodules), Azotobacter, Azospirillum (free-
    living N₂ fixers), mycorrhiza (Glomus; phosphorus), cyanobacteria (Anabaena, Nostoc, Oscillatoria in paddy fields).
  explanations:
    text: Microbes clean sewage by eating its organic matter, make biogas from dung, control pests without harmful chemicals, and enrich soil as biofertilisers by fixing nitrogen.
    visual: 'Draw a sewage plant: screens remove solids, settling tanks drop sludge, aeration tanks let microbes feed on waste (lowering BOD), and digesters turn sludge into biogas.'
    step_by_step: 'Step 1: Primary treatment removes solids physically. Step 2: Secondary treatment uses microbes to lower BOD. Step 3: Biogas: methanogens make methane. Step 4: Biofertilisers fix nitrogen or help absorb phosphorus.'
    real_world: Gobar gas plants in Indian villages give cooking gas and leave behind manure.
  picture:
    kind: flow
    steps:
    - Raw sewage
    - 'Primary: screens and settling'
    - 'Secondary: aerobic microbes in aeration tanks'
    - Sludge digested anaerobically → biogas
    - Cleaner water released
    alt: Stages of sewage treatment.
  items:
  - prompt: 'High BOD in a water sample means it:'
    options:
    - contains a lot of organic pollution
    - is very clean
    - has lots of fish
    - is salty
    answer: contains a lot of organic pollution
    difficulty: 1
    hints:
    - Microbes use more oxygen.
    - Polluted.
    solution: It's heavily polluted with organic matter.
    mistakes:
      is very clean: c12b_bod
  - prompt: 'Biogas is produced mainly by:'
    options:
    - methanogens
    - Lactobacillus
    - Rhizobium
    - Penicillium
    answer: methanogens
    difficulty: 1
    hints:
    - Methane makers.
    - Anaerobic.
    solution: Methanogenic bacteria.
  - prompt: 'The main gas in biogas is:'
    options:
    - methane
    - oxygen
    - nitrogen
    - hydrogen sulfide only
    answer: methane
    difficulty: 1
    hints:
    - Burns cleanly.
    - CH₄.
    solution: Methane.
  - prompt: 'Bt toxin used against caterpillars comes from:'
    options:
    - Bacillus thuringiensis
    - Trichoderma
    - Rhizobium
    - Anabaena
    answer: Bacillus thuringiensis
    difficulty: 2
    hints:
    - Bt.
    - Bacterium.
    solution: Bacillus thuringiensis.
  - prompt: 'Mycorrhizal fungi like Glomus help plants absorb:'
    options:
    - phosphorus
    - oxygen
    - light
    - carbon dioxide
    answer: phosphorus
    difficulty: 2
    hints:
    - Symbiosis with roots.
    - Mineral.
    solution: Phosphorus.
  - prompt: 'Cyanobacteria such as Anabaena serve as biofertilisers in:'
    options:
    - paddy fields
    - deserts
    - glaciers
    - the open ocean only
    answer: paddy fields
    difficulty: 2
    hints:
    - Water-logged.
    - Rice.
    solution: Paddy fields.
