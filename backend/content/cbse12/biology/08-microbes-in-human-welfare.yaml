# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse12-bio
chapter: 8
title: Microbes in Human Welfare
tips:
  c12b_bod: 'BOD measures how much oxygen microbes use to break down organic matter: high BOD = more polluted water.'
  b12_biogas: "Biogas burns with a blue flame; its main gas is the simplest hydrocarbon."
  b12_bt: "'Bt' is short for the bacterium's name."
  b12_citric: "Acetobacter makes acetic acid; a black mould makes citric acid."
  b12_cyanobacteria: "Cyanobacteria need water and light; rice is grown in flooded fields."
  b12_cyclosporin: "Transplant patients need a drug that stops their immune system rejecting the organ."
  b12_fleming: "Penicillin came from mould contaminating a culture plate in 1928."
  b12_lab: "Lactic acid bacteria sour the milk."
  b12_methanogens: "The bacteria are named after the gas they make."
  b12_mycorrhiza: "Mycorrhizae absorb a soil nutrient that roots find hard to take up."
  b12_statins: "Statins come from a yeast named for its purple colour."
  b12_swiss_cheese: "A bacterium releases a gas that forms bubbles."
  c12b8_product: 'Link each product to its microbe: curd (Lactobacillus), bread (yeast), citric acid (Aspergillus niger), acetic acid (Acetobacter), streptokinase (Streptococcus), statins (Monascus).'
  c12b8_env: "Sort microbes by their job: cleaning sewage, making biogas, killing pests or feeding plants. Then recall what each group forms or makes."
  c12b8_holes: Ask what bubbles of gas leave behind in a soft solid.
  c12b8_clot: A clot is made of protein threads. Which enzyme breaks those, rather than fats or plant cell walls?
  c12b8_bod: Clean water has little for microbes to eat. What does a big drop in oxygen tell you?
concepts:
- code: cbse12b.microbes.industry
  title: Microbes in household and industrial products
  notes: |
    Household: Lactobacillus (milk → curd; lactic acid; vitamin B₁₂), yeast (bread dough; Saccharomyces cerevisiae), idli/dosa
    fermentation, Swiss cheese (Propionibacterium shermanii; large holes from CO₂), Roquefort cheese (fungi). Industrial:
    beverages (yeast; wine, beer without distillation; whisky, rum with distillation), antibiotics (penicillin—Alexander Fleming,
    Penicillium notatum; Chain and Florey), organic acids (Aspergillus niger—citric; Acetobacter aceti—acetic; Clostridium
    butylicum—butyric; Lactobacillus—lactic), ethanol (yeast), enzymes (lipases in detergents, pectinases for clearing juices,
    streptokinase—clot buster from Streptococcus), cyclosporin A (Trichoderma polysporum, immunosuppressant), statins (Monascus
    purpureus, lower cholesterol).
  explanations:
    text: Microbes help make curd, bread, idli, cheese, medicines and industrial chemicals. Lactobacillus turns milk into curd; yeast makes bread rise and ferments drinks; the fungus Penicillium gave us penicillin, the first antibiotic.
    visual: 'Picture a kitchen: warm milk plus a spoon of curd overnight gives curd (Lactobacillus); dough rises with yeast (CO₂ bubbles); idli batter puffs up overnight.'
    step_by_step: 'Step 1: Name the product. Step 2: Identify the microbe. Step 3: Name what it makes (acid, CO₂, alcohol, enzyme, drug).'
    real_world: Streptokinase, a microbe-made enzyme, is used in hospitals to dissolve clots in heart attack patients.
  picture:
    kind: compare
    columns:
    - title: Product
      points:
      - curd
      - penicillin
      - citric acid
      - streptokinase
    - title: Microbe
      points:
      - Lactobacillus
      - Penicillium notatum
      - Aspergillus niger
      - Streptococcus
    alt: Products and the microbes that make them.
  activity:
    type: sort
    prompt: Which microbe makes it?
    bins:
    - Lactobacillus
    - Yeast (Saccharomyces)
    - Aspergillus niger
    - Propionibacterium
    - Penicillium
    items:
    - label: Curd from milk
      bin: Lactobacillus
      clue: Which bacterium turns milk sour?
      why: Lactic acid bacteria.
    - label: More vitamin B₁₂ in curd
      bin: Lactobacillus
      clue: Which curd-making bacterium adds it?
      why: Lactobacillus.
    - label: Bread that rises
      bin: Yeast (Saccharomyces)
      clue: Which microbe gives off CO₂ in dough?
      why: Baker's yeast.
    - label: Ethanol for drinks
      bin: Yeast (Saccharomyces)
      clue: Which microbe ferments sugar to alcohol?
      why: Brewer's yeast.
    - label: Citric acid
      bin: Aspergillus niger
      clue: Which fungus makes this organic acid?
      why: Aspergillus niger.
    - label: Big holes in Swiss cheese
      bin: Propionibacterium
      clue: Which bacterium makes lots of CO₂ in cheese?
      why: Propionibacterium sharmanii.
    - label: Penicillin
      bin: Penicillium
      clue: Fleming saw it stop bacteria on a plate. Which mould?
      why: Penicillium notatum.
    - label: Roquefort cheese's flavour
      bin: Penicillium
      clue: A blue-green mould ripens it. Which?
      why: A Penicillium species.
  lesson:
    - teach: 'At home, lactic acid bacteria (Lactobacillus) turn milk into curd and add vitamin B₁₂. Baker''s yeast (Saccharomyces cerevisiae) ferments dough, releasing CO₂ that makes bread rise; idli and dosa batter also ferments. Cheeses use microbes: Propionibacterium shermanii makes the big holes in Swiss cheese, and fungi ripen Roquefort.'
      check:
        prompt: 'Bread dough rises because yeast releases:'
        options:
        - carbon dioxide
        - oxygen
        - lactic acid
        answer: carbon dioxide
        why: The gas puffs up the dough.
      ways:
      - style: visual
        teach: The microbes behind everyday kitchen foods, and what each one does.
        picture:
          kind: compare
          columns:
          - title: Curd
            points:
            - Lactic acid bacteria
            - Sour taste, vitamin B₁₂
          - title: Bread, idli, dosa
            points:
            - Yeast and bacteria ferment batter
            - CO₂ makes it puff up
          - title: Cheese
            points:
            - Bacteria and fungi ripen it
            - Flavour and texture
          alt: Curd is made by lactic acid bacteria, which add sour taste and vitamin B12. Bread, idli and dosa batter are fermented by yeast and bacteria, whose carbon dioxide makes them puff up. Cheese is ripened by bacteria and fungi for flavour and texture.
      - style: real_world
        teach: A spoonful of old curd added to warm milk overnight gives fresh curd. That spoonful is a 'starter' full of Lactobacillus, which multiplies and turns the milk sour and thick.
    - teach: 'Industry grows microbes in large fermenters. Yeast makes alcoholic drinks (wine and beer without distillation, whisky and rum with distillation). Fleming found penicillin from Penicillium notatum; Chain and Florey made it a useful medicine. Organic acids: citric (Aspergillus niger), acetic (Acetobacter aceti), butyric (Clostridium butylicum), lactic (Lactobacillus).'
      picture:
        kind: compare
        columns:
        - title: Product
          points:
          - citric acid
          - acetic acid
          - butyric acid
          - penicillin
        - title: Microbe
          points:
          - Aspergillus niger
          - Acetobacter aceti
          - Clostridium butylicum
          - Penicillium notatum
        alt: Industrial products and the microbes that make them.
      check:
        prompt: 'Penicillin comes from a:'
        options:
        - fungus
        - bacterium
        - virus
        answer: fungus
        why: Penicillium is a mould.
      ways:
      - style: step_by_step
        teach: 'How penicillin was found. Step 1: Fleming saw mould growing on a dish of Staphylococcus. Step 2: Around the mould, bacteria had died. Step 3: The mould, Penicillium, made a substance that killed them. Step 4: Chain and Florey later purified it as a medicine.'
      - style: real_world
        teach: Big fermenters in factories are steel tanks of thousands of litres, kept at the right temperature, stirred and fed with nutrients. Antibiotics, citric acid and alcohol are all made this way, like a giant, controlled kitchen.
    - teach: 'Microbial enzymes and medicines: lipases in detergents remove oily stains; pectinases and proteases clear fruit juices; streptokinase from Streptococcus dissolves blood clots in heart-attack patients; cyclosporin A from the fungus Trichoderma polysporum suppresses immunity after organ transplants; statins from the yeast Monascus purpureus lower blood cholesterol.'
      check:
        prompt: 'Streptokinase is used to:'
        options:
        - dissolve blood clots
        - lower cholesterol
        - make bread
        answer: dissolve blood clots
        why: It is a 'clot buster' for heart attacks.
      ways:
      - style: visual
        teach: Microbe-made medicines and what each treats.
        picture:
          kind: compare
          columns:
          - title: Streptokinase
            points:
            - From Streptococcus
            - Dissolves blood clots
          - title: Cyclosporin A
            points:
            - From a fungus
            - Stops transplant rejection
          - title: Statins
            points:
            - From a yeast
            - Lower blood cholesterol
          alt: Streptokinase, from Streptococcus, dissolves blood clots. Cyclosporin A, from a fungus, stops transplant rejection. Statins, from a yeast, lower blood cholesterol.
      - style: real_world
        teach: Washing powder adverts talk about 'enzyme action'. Those enzymes, lipases and proteases, are made by microbes and break down grease and food stains even in cool water.
  items:
  - prompt: 'Milk is turned into curd by:'
    options:
    - Lactobacillus
    - yeast
    - Penicillium
    - Aspergillus
    answer: Lactobacillus
    difficulty: 1
    hints:
    - Lactic acid bacteria.
    - LAB.
    solution: "Lactobacillus (lactic acid bacteria) turns milk sugar into lactic acid, which makes the milk proteins set into curd."
    mistakes: {"yeast": "b12_lab", "Penicillium": "b12_lab", "Aspergillus": "b12_lab"}
  - prompt: 'Penicillin was discovered by:'
    options:
    - Alexander Fleming
    - Louis Pasteur
    - Robert Koch
    - Edward Jenner
    answer: Alexander Fleming
    difficulty: 1
    hints:
    - '1928.'
    - Mould on a plate.
    solution: "Alexander Fleming noticed in 1928 that a Penicillium mould stopped Staphylococcus growing around it."
    mistakes: {"Louis Pasteur": "b12_fleming", "Robert Koch": "b12_fleming", "Edward Jenner": "b12_fleming"}
  - prompt: 'The large holes in Swiss cheese are made by:'
    options:
    - CO₂ from Propionibacterium shermanii
    - air pumped in
    - yeast alcohol
    - mice
    answer: CO₂ from Propionibacterium shermanii
    difficulty: 2
    hints:
    - Gas bubbles.
    - A bacterium.
    solution: "Propionibacterium shermanii releases a lot of CO₂ as it grows in the cheese, leaving large holes."
    mistakes: {"air pumped in": "b12_swiss_cheese", "yeast alcohol": "b12_swiss_cheese", "mice": "b12_swiss_cheese"}
  - prompt: 'Citric acid is produced industrially by:'
    options:
    - Aspergillus niger
    - Acetobacter aceti
    - Clostridium butylicum
    - Lactobacillus
    answer: Aspergillus niger
    difficulty: 2
    hints:
    - A fungus.
    - Black mould.
    solution: "The fungus Aspergillus niger is grown in large fermenters to make citric acid."
    mistakes: {"Acetobacter aceti": "b12_citric", "Clostridium butylicum": "b12_citric", "Lactobacillus": "b12_citric"}
  - prompt: 'Statins, which lower blood cholesterol, come from:'
    options:
    - Monascus purpureus (yeast)
    - Trichoderma
    - Streptococcus
    - Penicillium
    answer: Monascus purpureus (yeast)
    difficulty: 2
    hints:
    - Competitive inhibitor.
    - A yeast.
    solution: "Statins come from the yeast Monascus purpureus; they block an enzyme the body uses to make cholesterol."
    mistakes: {"Trichoderma": "b12_statins", "Streptococcus": "b12_statins", "Penicillium": "b12_statins"}
  - prompt: 'Cyclosporin A is used in organ transplants as:'
    options:
    - an immunosuppressant
    - an antibiotic
    - a clot buster
    - a vitamin
    answer: an immunosuppressant
    difficulty: 2
    hints:
    - Stops rejection.
    - From Trichoderma.
    solution: "Cyclosporin A (from Trichoderma polysporum) suppresses the immune system so it does not reject the new organ."
    mistakes: {"an antibiotic": "b12_cyclosporin", "a clot buster": "b12_cyclosporin", "a vitamin": "b12_cyclosporin"}
  - prompt: 'Lactobacillus improves curd''s nutrition by adding:'
    options:
    - vitamin B₁₂
    - vitamin C
    - iron
    answer: vitamin B₁₂
    difficulty: 1
    hints:
    - It is one of the B vitamins.
    - The one with the highest number.
    solution: 'Step 1: LAB make a B vitamin. Step 2: B₁₂.'
    mistakes:
      vitamin C: c12b8_product
      iron: c12b8_product
  - prompt: 'Acetic acid (vinegar) is produced by:'
    options:
    - Acetobacter aceti
    - Aspergillus niger
    - Clostridium butylicum
    answer: Acetobacter aceti
    difficulty: 1
    hints:
    - The name matches the acid.
    - It is a bacterium.
    solution: 'Step 1: aceti → acetic. Step 2: Acetobacter aceti.'
    mistakes:
      Aspergillus niger: c12b8_product
      Clostridium butylicum: c12b8_product
  - prompt: 'Lipases are added to detergents to remove:'
    options:
    - oily stains
    - rust
    - ink only
    answer: oily stains
    difficulty: 1
    hints:
    - Lipases break down lipids.
    - Lipids are fats and oils.
    solution: 'Step 1: digest fats. Step 2: oily stains.'
    mistakes:
      rust: c12b8_product
      ink only: c12b8_product
  - prompt: Which drinks are made WITH distillation of the fermented broth?
    options:
    - whisky and rum
    - wine and beer
    - curd and buttermilk
    answer: whisky and rum
    difficulty: 2
    hints:
    - Distillation raises the alcohol content.
    - Wine and beer are not distilled.
    solution: 'Step 1: distilled spirits. Step 2: whisky, brandy, rum.'
    mistakes:
      wine and beer: c12b8_product
      curd and buttermilk: c12b8_product
  - prompt: Who, with Fleming, developed penicillin into a useful medicine?
    options:
    - Chain and Florey
    - Watson and Crick
    - Miller and Urey
    answer: Chain and Florey
    difficulty: 2
    hints:
    - They shared the 1945 Nobel Prize with Fleming.
    - They purified it during the Second World War.
    solution: 'Step 1: showed its full potential. Step 2: Ernst Chain and Howard Florey.'
    mistakes:
      Watson and Crick: c12b8_product
      Miller and Urey: c12b8_product
  - prompt: 'Bottled fruit juices are made clearer using:'
    options:
    - pectinases and proteases
    - lipases
    - streptokinase
    answer: pectinases and proteases
    difficulty: 2
    hints:
    - Juices are cloudy from plant cell-wall material.
    - Pectin binds plant cells together.
    solution: 'Step 1: break pectin and proteins. Step 2: pectinases and proteases.'
    mistakes:
      lipases: c12b8_product
      streptokinase: c12b8_product
  - prompt: 'Cyclosporin A is produced by the fungus:'
    options:
    - Trichoderma polysporum
    - Monascus purpureus
    - Penicillium notatum
    answer: Trichoderma polysporum
    difficulty: 2
    hints:
    - It suppresses the immune system.
    - Not the statin source.
    solution: 'Step 1: used in transplants. Step 2: Trichoderma polysporum.'
    mistakes:
      Monascus purpureus: c12b8_product
      Penicillium notatum: c12b8_product
  - prompt: 'Statins lower cholesterol by:'
    options:
    - blocking the enzyme that makes cholesterol
    - dissolving fat in blood
    - killing bacteria
    answer: blocking the enzyme that makes cholesterol
    difficulty: 3
    hints:
    - They are competitive inhibitors.
    - They act in the body's own synthesis pathway.
    solution: 'Step 1: inhibit cholesterol synthesis. Step 2: less cholesterol made.'
    mistakes:
      dissolving fat in blood: c12b8_product
      killing bacteria: c12b8_product
  - prompt: 'Butyric acid is produced industrially by:'
    options:
    - Clostridium butylicum
    - Lactobacillus
    - Acetobacter aceti
    answer: Clostridium butylicum
    difficulty: 1
    hints:
    - The microbe's name matches the acid.
    - It is an anaerobic bacterium.
    solution: 'Step 1: butylicum → butyric. Step 2: Clostridium butylicum.'
    mistakes:
      Lactobacillus: c12b8_product
      Acetobacter aceti: c12b8_product
  - prompt: 'Assertion (A): Whisky has a much higher alcohol content than wine.

      Reason (R): Whisky is distilled after fermentation, while wine is not.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Yeast stops working at about 12–15% alcohol, so wine stays there. Distillation concentrates the alcohol in whisky. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A heart-attack patient reaches hospital quickly. Doctors give a microbial enzyme to dissolve the clot blocking a coronary artery. Which one?'
    options:
    - Streptokinase
    - Lipase
    - Pectinase
    answer: Streptokinase
    hints:
    - Which enzyme acts on blood clots?
    - The others act on fats or fruit cell walls.
    solution: Streptokinase, from Streptococcus, is a clot buster used to clear blocked blood vessels.
    mistakes:
      Lipase: c12b8_clot
      Pectinase: c12b8_clot
    exam: case
    difficulty: 2
  - prompt: A cheese maker wants large holes in the cheese. Which microbe and process are responsible?
    options:
    - A bacterium releasing CO₂ during ripening
    - A fungus eating holes in the cheese
    - Air pumped in by machines
    answer: A bacterium releasing CO₂ during ripening
    hints:
    - The holes are bubbles, not bites.
    - Which gas do fermenting microbes release?
    solution: Propionibacterium shermanii releases CO₂ during ripening; the trapped gas leaves large holes.
    mistakes:
      A fungus eating holes in the cheese: c12b8_holes
      Air pumped in by machines: c12b8_holes
    exam: competency
    difficulty: 2
- code: cbse12b.microbes.environment
  title: Microbes in sewage, biogas, biocontrol and biofertilisers
  after:
  - cbse12b.microbes.industry
  notes: |
    Sewage treatment: primary (physical: filtration, sedimentation; primary sludge), secondary/biological (aerobic microbes in
    aeration tanks form flocs, reduce BOD; activated sludge; anaerobic sludge digesters make biogas). BOD. Ganga and Yamuna
    Action Plans. Biogas: methanogens (Methanobacterium) in cattle dung; gobar gas plants (KVIC, IARI). Biocontrol: ladybird and
    dragonflies eat pests; Bacillus thuringiensis (Bt) against caterpillars; Trichoderma (fungal); baculoviruses
    (Nucleopolyhedrovirus) species-specific; IPM. Biofertilisers: Rhizobium (root nodules), Azotobacter, Azospirillum (free-
    living N₂ fixers), mycorrhiza (Glomus; phosphorus), cyanobacteria (Anabaena, Nostoc, Oscillatoria in paddy fields).
  explanations:
    text: Microbes clean sewage by eating its organic matter, make biogas from dung, control pests without harmful chemicals, and enrich soil as biofertilisers by fixing nitrogen.
    visual: 'Draw a sewage plant: screens remove solids, settling tanks drop sludge, aeration tanks let microbes feed on waste (lowering BOD), and digesters turn sludge into biogas.'
    step_by_step: 'Step 1: Primary treatment removes solids physically. Step 2: Secondary treatment uses microbes to lower BOD. Step 3: Biogas: methanogens make methane. Step 4: Biofertilisers fix nitrogen or help absorb phosphorus.'
    real_world: Gobar gas plants in Indian villages give cooking gas and leave behind manure.
  picture:
    kind: flow
    steps:
    - Raw sewage
    - 'Primary: screens and settling'
    - 'Secondary: aerobic microbes in aeration tanks'
    - Sludge digested anaerobically → biogas
    - Cleaner water released
    alt: Stages of sewage treatment.
  activity:
    type: order
    prompt: Put the steps of sewage treatment in order.
    steps:
    - Floating debris is filtered out
    - Grit settles; primary sludge forms
    - The primary effluent goes to aeration tanks
    - Aerobic microbes form flocs and lower the BOD
    - Activated sludge settles; some returns to the tanks
    - Leftover sludge is digested anaerobically (biogas)
    - Treated water goes into a river
    reasons:
      Grit settles; primary sludge forms: Large objects are removed first so they don't clog the settling tanks.
      The primary effluent goes to aeration tanks: Only the liquid left after settling goes on to the aeration tanks.
      Aerobic microbes form flocs and lower the BOD: Microbes can only work once the effluent is in the aerated tank.
      Activated sludge settles; some returns to the tanks: The flocs settle only after they have done their work.
      Leftover sludge is digested anaerobically (biogas): Digesters take the sludge left over after settling.
      Treated water goes into a river: The water is released last, once its BOD is low enough.
  lesson:
    - teach: 'Sewage treatment: primary treatment removes floating and settling solids physically (filtration, sedimentation) to leave primary sludge. Secondary (biological) treatment pumps the effluent into aeration tanks where aerobic microbes form flocs that eat organic matter, lowering BOD. The settled activated sludge is partly reused; the rest goes to anaerobic sludge digesters, where bacteria make biogas.'
      picture:
        kind: flow
        steps:
        - raw sewage
        - 'primary: filter and settle'
        - aeration tank (flocs)
        - settling tank
        - clean effluent to river
        alt: The steps of sewage treatment.
      check:
        prompt: 'Lower BOD after treatment means the water has:'
        options:
        - less organic matter
        - more organic matter
        - more bacteria to eat
        answer: less organic matter
        why: BOD measures oxygen microbes need to break down organic matter.
      ways:
      - style: step_by_step
        teach: 'Follow sewage through a treatment plant. Step 1: Screens and settling tanks remove solids (primary). Step 2: Aeration tanks let aerobic microbes eat organic matter as flocs (secondary). Step 3: Sludge settles; some is sent back. Step 4: The rest goes to anaerobic digesters that make biogas.'
      - style: real_world
        teach: When untreated sewage enters a river, microbes feeding on it use up the dissolved oxygen. Fish suffocate and die. Measuring BOD tells engineers how much 'food' for microbes, and so how much pollution, the water carries.
    - teach: Methanogens such as Methanobacterium live in cattle rumen and sludge and make biogas, mainly methane with CO₂ and H₂. Gobar gas plants (developed by KVIC and IARI) use cattle dung and give fuel for cooking and lighting, with the spent slurry used as manure.
      check:
        prompt: 'Methanogens work in:'
        options:
        - the absence of oxygen
        - bright sunlight
        - boiling water
        answer: the absence of oxygen
        why: They are anaerobic bacteria.
      ways:
      - style: visual
        teach: How a gobar gas plant turns dung into fuel and manure.
        picture:
          kind: flow
          steps:
          - Dung + water slurry fed in
          - Methanogens break it down without air
          - Gas (mostly methane) collects under the cover
          - Gas piped to stoves; spent slurry used as manure
          alt: Dung mixed with water is fed in as slurry. Methanogens break it down without air. Gas, mostly methane, collects under the floating cover. It is piped to stoves, and the spent slurry is used as manure.
      - style: real_world
        teach: A family biogas plant in a village replaces firewood with a clean blue flame. Women and children breathe less smoke, fewer trees are cut, and the leftover slurry fertilises the fields.
    - teach: 'Biocontrol uses living things instead of chemical pesticides: ladybirds and dragonflies eat aphids and mosquitoes; Bacillus thuringiensis (Bt) kills caterpillars; Trichoderma fungi fight plant pathogens; baculoviruses (Nucleopolyhedrovirus) kill specific insects only. Biofertilisers add nutrients: Rhizobium in legume root nodules, free-living Azotobacter and Azospirillum fix nitrogen; mycorrhiza (Glomus) helps take up phosphorus; cyanobacteria (Anabaena, Nostoc) enrich paddy fields.'
      picture:
        kind: compare
        columns:
        - title: Biocontrol
          points:
          - ladybird
          - Bt
          - Trichoderma
          - baculovirus
        - title: Biofertiliser
          points:
          - Rhizobium
          - Azotobacter
          - Glomus
          - Anabaena
        alt: Examples of biocontrol agents and biofertilisers.
      check:
        prompt: 'Rhizobium lives in the root nodules of:'
        options:
        - legumes
        - wheat
        - pine trees
        answer: legumes
        why: It fixes nitrogen in a symbiosis with pea-family plants.
      ways:
      - style: real_world
        teach: Organic farmers release ladybirds in greenhouses to eat aphids instead of spraying chemicals. The ladybirds keep pests low, and the vegetables stay free of pesticide residue.
      - style: step_by_step
        teach: 'Why Bt kills only some insects. Step 1: Bt bacteria make an inactive toxin crystal. Step 2: In a caterpillar''s alkaline gut, it becomes active. Step 3: It binds to the gut lining and makes holes. Step 4: Insects with a different gut chemistry, and humans, are not affected.'
  items:
  - prompt: 'High BOD in a water sample means it:'
    options:
    - contains a lot of organic pollution
    - is very clean
    - has lots of fish
    - is salty
    answer: contains a lot of organic pollution
    difficulty: 1
    hints:
    - Microbes use more oxygen.
    - Polluted.
    solution: It's heavily polluted with organic matter.
    mistakes:
      is very clean: c12b_bod
  - prompt: 'Biogas is produced mainly by:'
    options:
    - methanogens
    - Lactobacillus
    - Rhizobium
    - Penicillium
    answer: methanogens
    difficulty: 1
    hints:
    - Methane makers.
    - Anaerobic.
    solution: "Methanogens, such as Methanobacterium, break down organic matter without oxygen and release methane."
    mistakes: {"Lactobacillus": "b12_methanogens", "Rhizobium": "b12_methanogens", "Penicillium": "b12_methanogens"}
  - prompt: 'The main gas in biogas is:'
    options:
    - methane
    - oxygen
    - nitrogen
    - hydrogen sulfide only
    answer: methane
    difficulty: 1
