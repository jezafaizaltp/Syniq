# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse12-bio
chapter: 8
title: Microbes in Human Welfare
tips:
  c12b_bod: 'BOD measures how much oxygen microbes use to break down organic matter: high BOD = more polluted water.'
  b12_biogas: "Biogas burns with a blue flame; its main gas is the simplest hydrocarbon."
  b12_bt: "'Bt' is short for the bacterium's name."
  b12_citric: "Acetobacter makes acetic acid; a black mould makes citric acid."
  b12_cyanobacteria: "Cyanobacteria need water and light; rice is grown in flooded fields."
  b12_cyclosporin: "Transplant patients need a drug that stops their immune system rejecting the organ."
  b12_fleming: "Penicillin came from mould contaminating a culture plate in 1928."
  b12_lab: "Lactic acid bacteria sour the milk."
  b12_methanogens: "The bacteria are named after the gas they make."
  b12_mycorrhiza: "Mycorrhizae absorb a soil nutrient that roots find hard to take up."
  b12_statins: "Statins come from a yeast named for its purple colour."
  b12_swiss_cheese: "A bacterium releases a gas that forms bubbles."
concepts:
- code: cbse12b.microbes.industry
  title: Microbes in household and industrial products
  notes: |
    Household: Lactobacillus (milk → curd; lactic acid; vitamin B₁₂), yeast (bread dough; Saccharomyces cerevisiae), idli/dosa
    fermentation, Swiss cheese (Propionibacterium shermanii; large holes from CO₂), Roquefort cheese (fungi). Industrial:
    beverages (yeast; wine, beer without distillation; whisky, rum with distillation), antibiotics (penicillin—Alexander Fleming,
    Penicillium notatum; Chain and Florey), organic acids (Aspergillus niger—citric; Acetobacter aceti—acetic; Clostridium
    butylicum—butyric; Lactobacillus—lactic), ethanol (yeast), enzymes (lipases in detergents, pectinases for clearing juices,
    streptokinase—clot buster from Streptococcus), cyclosporin A (Trichoderma polysporum, immunosuppressant), statins (Monascus
    purpureus, lower cholesterol).
  explanations:
    text: Microbes help make curd, bread, idli, cheese, medicines and industrial chemicals. Lactobacillus turns milk into curd; yeast makes bread rise and ferments drinks; the fungus Penicillium gave us penicillin, the first antibiotic.
    visual: 'Picture a kitchen: warm milk plus a spoon of curd overnight gives curd (Lactobacillus); dough rises with yeast (CO₂ bubbles); idli batter puffs up overnight.'
    step_by_step: 'Step 1: Name the product. Step 2: Identify the microbe. Step 3: Name what it makes (acid, CO₂, alcohol, enzyme, drug).'
    real_world: Streptokinase, a microbe-made enzyme, is used in hospitals to dissolve clots in heart attack patients.
  picture:
    kind: compare
    columns:
    - title: Product
      points:
      - curd
      - penicillin
      - citric acid
      - streptokinase
    - title: Microbe
      points:
      - Lactobacillus
      - Penicillium notatum
      - Aspergillus niger
      - Streptococcus
    alt: Products and the microbes that make them.
  activity:
    type: sort
    prompt: Which microbe makes it?
    bins:
    - Lactobacillus
    - Yeast (Saccharomyces)
    - Aspergillus niger
    - Propionibacterium
    - Penicillium
    items:
    - label: Curd from milk
      bin: Lactobacillus
      clue: Which bacterium turns milk sour?
      why: Lactic acid bacteria.
    - label: More vitamin B₁₂ in curd
      bin: Lactobacillus
      clue: Which curd-making bacterium adds it?
      why: Lactobacillus.
    - label: Bread that rises
      bin: Yeast (Saccharomyces)
      clue: Which microbe gives off CO₂ in dough?
      why: Baker's yeast.
    - label: Ethanol for drinks
      bin: Yeast (Saccharomyces)
      clue: Which microbe ferments sugar to alcohol?
      why: Brewer's yeast.
    - label: Citric acid
      bin: Aspergillus niger
      clue: Which fungus makes this organic acid?
      why: Aspergillus niger.
    - label: Big holes in Swiss cheese
      bin: Propionibacterium
      clue: Which bacterium makes lots of CO₂ in cheese?
      why: Propionibacterium sharmanii.
    - label: Penicillin
      bin: Penicillium
      clue: Fleming saw it stop bacteria on a plate. Which mould?
      why: Penicillium notatum.
    - label: Roquefort cheese's flavour
      bin: Penicillium
      clue: A blue-green mould ripens it. Which?
      why: A Penicillium species.
  items:
  - prompt: 'Milk is turned into curd by:'
    options:
    - Lactobacillus
    - yeast
    - Penicillium
    - Aspergillus
    answer: Lactobacillus
    difficulty: 1
    hints:
    - Lactic acid bacteria.
    - LAB.
    solution: Lactobacillus.
    mistakes: {"yeast": "b12_lab", "Penicillium": "b12_lab", "Aspergillus": "b12_lab"}
  - prompt: 'Penicillin was discovered by:'
    options:
    - Alexander Fleming
    - Louis Pasteur
    - Robert Koch
    - Edward Jenner
