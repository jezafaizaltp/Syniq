# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse12-bio
chapter: 2
title: Human Reproduction
tips:
  c12b_cycle: "A typical menstrual cycle is about four weeks, and ovulation happens around halfway, triggered by an LH surge."
  c12b_gameto: "One primary spermatocyte gives 4 sperm. In females, each meiotic division gives one big cell and one tiny polar body. How many big, functional cells remain?"
  b12_ampulla: "The egg meets sperm in the wide part of the oviduct, before reaching the uterus."
  b12_colostrum: "The first yellowish milk after birth gives the baby ready-made antibodies."
  b12_corpus_luteum: "The corpus luteum keeps the uterine lining ready for pregnancy."
  b12_implantation: "The lining of the uterus thickens to receive the embryo."
  b12_leydig: "Sertoli cells nourish sperm. The interstitial cells between tubules make the hormone."
  b12_lh_surge: "A sharp rise of the pituitary hormone mid-cycle releases the egg."
  b12_menstrual: "About a lunar month."
  b12_middle_piece: "The sperm's swimming needs energy. Where are the powerhouses packed?"
  b12_scrotum: "The scrotum keeps the testes a little cooler than the body, by a range given in the textbook. Read which end of the range the question asks for."
  b12_spermatogenesis: "Meiosis turns one primary spermatocyte into four spermatids."
  c12b2_part: Place the structure in its system first (testis, duct, gland, ovary, oviduct, uterus), then recall what it does.
  c12b2_gam: 'Spermatogenesis: one primary spermatocyte → 4 sperm. Oogenesis: one primary oocyte → 1 ovum + polar bodies.'
  c12b2_cycle: 'Follow the cycle in order: menstrual phase, follicular phase, LH surge and ovulation (about day 14), luteal phase with progesterone.'
  c12b2_temp: Sperm production needs a temperature a little below the body's. What would happen if the testes stayed inside?
  c12b2_luteum: Ask which structure makes progesterone after ovulation, and what keeps it going if pregnancy begins.
concepts:
- code: cbse12b.hrep.systems
  title: Reproductive systems and gametogenesis
  notes: |
    Male system: testes in scrotum (2–2.5 °C below body temperature), seminiferous tubules (spermatogonia, Sertoli cells),
    Leydig cells (androgens), ducts (rete testis, vasa efferentia, epididymis, vas deferens, ejaculatory duct, urethra),
    accessory glands (seminal vesicles, prostate, bulbourethral). Female: ovaries, oviducts (infundibulum, ampulla, isthmus),
    uterus (perimetrium, myometrium, endometrium), cervix, vagina; mammary glands. Spermatogenesis (from puberty; 4 sperm per
    primary spermatocyte; GnRH, LH, FSH) and sperm structure (head with acrosome, neck, middle piece with mitochondria, tail).
    Oogenesis (begins before birth; primary oocytes arrested in prophase I; one ovum + polar bodies); Graafian follicle.
  explanations:
    text: Humans reproduce sexually. Testes make sperm and the hormone testosterone; ovaries make eggs and hormones like oestrogen. Sperm production makes four sperm from each starting cell, while egg production makes just one egg.
    visual: 'Draw a sperm: a head with the nucleus and an acrosome cap, a middle piece packed with mitochondria for energy, and a long tail for swimming.'
    step_by_step: 'Step 1: Name each organ and its job. Step 2: Spermatogenesis: 1 primary spermatocyte → 4 sperm. Step 3: Oogenesis: 1 primary oocyte → 1 ovum + polar bodies. Step 4: Link hormones (LH, FSH) to each stage.'
    real_world: The testes hang outside the body because sperm develop best slightly below body temperature.
  picture:
    kind: compare
    columns:
    - title: Process
      points:
      - spermatogenesis
      - oogenesis
    - title: Starts
      points:
      - at puberty
      - before birth
    - title: Gametes per primary cell
      points:
      - 4 sperm
      - 1 ovum
    alt: Spermatogenesis and oogenesis compared.
  activity:
    type: order
    prompt: Trace a sperm's path out of the body.
    steps:
    - Seminiferous tubules (where sperms form)
    - Rete testis
    - Vasa efferentia
    - Epididymis (where sperms mature and are stored)
    - Vas deferens
    - Ejaculatory duct
    - Urethra
    reasons:
      Rete testis: Sperms leave the tubules first; the rete testis collects them inside the testis.
      Vasa efferentia: These small ducts lead out of the rete testis.
      Epididymis (where sperms mature and are stored): The vasa efferentia open into the epididymis.
      Vas deferens: From the epididymis the vas deferens carries sperms up into the body.
      Ejaculatory duct: The vas deferens joins the seminal vesicle's duct to form the ejaculatory duct.
      Urethra: The ejaculatory ducts open into the urethra, the last part of the path.
  lesson:
    - teach: 'Male system: testes sit in the scrotum, about 2–2.5 °C cooler than the body, which sperm production needs. Inside, seminiferous tubules make sperm (Sertoli cells nourish them); Leydig cells between tubules make testosterone. Ducts: rete testis → vasa efferentia → epididymis → vas deferens → ejaculatory duct → urethra. Glands: seminal vesicles, prostate, bulbourethral.'
      check:
        prompt: Why are the testes outside the abdomen?
        options:
        - sperm production needs a slightly lower temperature
        - to make them grow faster
        - to protect them from blood
        answer: sperm production needs a slightly lower temperature
        why: The scrotum keeps them about 2–2.5 °C cooler.
      ways:
      - style: visual
        teach: The path sperm take from where they are made to the outside.
        picture:
          kind: flow
          steps:
          - Seminiferous tubules (made)
          - Rete testis → vasa efferentia
          - Epididymis (stored, mature)
          - Vas deferens → ejaculatory duct → urethra
          alt: Sperm are made in the seminiferous tubules, pass through the rete testis and vasa efferentia, are stored and mature in the epididymis, then travel through the vas deferens and ejaculatory duct to the urethra.
      - style: real_world
        teach: Sperm need a cooler place to develop, which is why the testes hang outside the body in the scrotum. Doctors advise against very tight clothing and long hot baths for men trying to have children for this reason.
    - teach: 'Female system: ovaries make ova and hormones. Each oviduct has a funnel (infundibulum), a wide ampulla (where fertilisation usually happens) and a narrow isthmus. The uterus wall has perimetrium, muscular myometrium and the lining endometrium, which changes every cycle. Then cervix and vagina.'
      check:
        prompt: Which uterine layer is shed during menstruation?
        options:
        - endometrium
        - myometrium
        - perimetrium
        answer: endometrium
        why: The inner lining builds up and breaks down each cycle.
      ways:
      - style: visual
        teach: The parts of the female reproductive tract and the job of each.
        picture:
          kind: compare
          columns:
          - title: Ovary
            points:
            - Makes ova
            - Makes oestrogen and progesterone
          - title: Oviduct
            points:
            - Infundibulum catches the ovum
            - 'Ampulla: fertilisation'
            - Isthmus to uterus
          - title: Uterus
            points:
            - 'Endometrium: implantation'
            - 'Myometrium: contractions at birth'
          alt: The ovary makes ova and the hormones oestrogen and progesterone. The oviduct's infundibulum catches the ovum, its ampulla is where fertilisation happens, and its isthmus leads to the uterus. In the uterus the endometrium receives the embryo and the myometrium contracts at birth.
      - style: real_world
        teach: The uterus muscle layer, the myometrium, is among the strongest muscles in the body for its size. During childbirth it contracts in waves to push the baby out, while the lining (endometrium) is what changes every month.
    - teach: 'Spermatogenesis starts at puberty: spermatogonia → primary spermatocytes → (meiosis) → 4 spermatids → sperm, controlled by GnRH, LH and FSH. A sperm has a head (nucleus + acrosome), neck, middle piece (mitochondria for energy) and tail. Oogenesis starts before birth; one primary oocyte gives one ovum and polar bodies.'
      picture:
        kind: compare
        columns:
        - title: Spermatogenesis
          points:
          - starts at puberty
          - continuous
          - 1 → 4 sperm
        - title: Oogenesis
          points:
          - starts before birth
          - one ovum per cycle
          - 1 → 1 ovum + polar bodies
        alt: Spermatogenesis and oogenesis compared.
      check:
        prompt: Why does the sperm's middle piece have many mitochondria?
        options:
        - to supply energy for swimming
        - to carry genes
        - to dissolve the egg coat
        answer: to supply energy for swimming
        why: Mitochondria make ATP for the tail.
      ways:
      - style: step_by_step
        teach: 'Oogenesis in order. Step 1: Before birth, oogonia make primary oocytes, which pause in meiosis I. Step 2: At puberty, one finishes meiosis I each cycle, giving a secondary oocyte and a polar body. Step 3: Meiosis II finishes only if a sperm enters. Step 4: The result: one large ovum and small polar bodies.'
      - style: real_world
        teach: A girl is born with all the primary oocytes she will ever have, about two million, which shrink to a few lakh by puberty. A boy makes new sperm daily from puberty onward. This difference in timing is one of biology's biggest contrasts.
  items:
  - prompt: How many sperm develop from one primary spermatocyte?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Meiosis gives four.
    - All functional.
    solution: '4.'
    mistakes: {"2": "b12_spermatogenesis", "1": "b12_spermatogenesis"}
  - prompt: How many functional ova develop from one primary oocyte?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Polar bodies degenerate.
    - One.
    solution: '1.'
    mistakes:
      '4': c12b_gameto
  - prompt: By about how many °C is scrotal temperature below body temperature (lower value of 2–2.5)?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 2–2.5 °C.
    - Lower value.
    solution: About 2–2.5 °C.
    mistakes: {"2.5": "b12_scrotum", "5": "b12_scrotum"}
  - prompt: 'Testosterone is made by the:'
    options:
    - Leydig cells
    - Sertoli cells
    - spermatogonia
    - prostate
    answer: Leydig cells
    difficulty: 2
    hints:
    - Interstitial cells.
    - Between tubules.
    solution: Leydig (interstitial) cells.
    mistakes: {"Sertoli cells": "b12_leydig", "spermatogonia": "b12_leydig", "prostate": "b12_leydig"}
  - prompt: 'The part of the sperm full of mitochondria is the:'
    options:
    - middle piece
    - head
    - tail
    - acrosome
    answer: middle piece
    difficulty: 1
    hints:
    - Energy for swimming.
    - Middle.
    solution: The middle piece.
    mistakes: {"head": "b12_middle_piece", "tail": "b12_middle_piece", "acrosome": "b12_middle_piece"}
  - prompt: 'Fertilisation normally takes place in the:'
    options:
    - ampulla of the oviduct
    - uterus
    - ovary
    - cervix
    answer: ampulla of the oviduct
    difficulty: 2
    hints:
    - Fallopian tube.
    - Wide region.
    solution: The ampulla of the oviduct.
    mistakes: {"uterus": "b12_ampulla", "ovary": "b12_ampulla", "cervix": "b12_ampulla"}
  - prompt: How many sperm come from 10 primary spermatocytes?
    answer: '40'
    check: 10*4
    difficulty: 1
    hints:
    - Each gives 4 sperm.
    - Multiply.
    solution: 'Step 1: 10 × 4. Step 2: 40.'
    mistakes:
      '10': c12b2_gam
      '20': c12b2_gam
  - prompt: Which cells nourish developing sperm?
    options:
    - Sertoli cells
    - Leydig cells
    - red blood cells
    answer: Sertoli cells
    difficulty: 1
    hints:
    - They line the seminiferous tubules.
    - Leydig cells make hormones.
    solution: 'Step 1: inside tubules. Step 2: Sertoli cells.'
    mistakes:
      Leydig cells: c12b2_part
      red blood cells: c12b2_part
  - prompt: 'Sperm are stored and mature in the:'
    options:
    - epididymis
    - prostate
    - urethra
    answer: epididymis
    difficulty: 1
    hints:
    - A coiled tube on the testis.
    - Before the vas deferens.
    solution: 'Step 1: coiled duct. Step 2: epididymis.'
    mistakes:
      prostate: c12b2_part
      urethra: c12b2_part
  - prompt: 'The acrosome in the sperm head helps to:'
    options:
    - penetrate the ovum's coverings
    - swim
    - store food
    answer: penetrate the ovum's coverings
    difficulty: 2
    hints:
    - It contains enzymes.
    - The egg has a zona pellucida.
    solution: 'Step 1: enzymes in the acrosome. Step 2: digest a path into the ovum.'
    mistakes:
      swim: c12b2_part
      store food: c12b2_part
  - prompt: A human sperm or ovum has how many chromosomes?
    answer: '23'
    check: 46/2
    difficulty: 2
    hints:
    - Body cells have 46.
    - Gametes are haploid.
    solution: 'Step 1: 46/2. Step 2: 23.'
    mistakes:
      '46': c12b2_gam
      '22': c12b2_gam
  - prompt: 'The funnel-shaped end of the oviduct near the ovary is the:'
    options:
    - infundibulum
    - isthmus
    - cervix
    answer: infundibulum
    difficulty: 2
    hints:
    - It has finger-like fimbriae.
    - It collects the ovum.
    solution: 'Step 1: funnel near ovary. Step 2: infundibulum.'
    mistakes:
      isthmus: c12b2_part
      cervix: c12b2_part
  - prompt: Primary oocytes are arrested in which stage until puberty?
    options:
    - prophase I of meiosis
    - metaphase of mitosis
    - telophase II
    answer: prophase I of meiosis
    difficulty: 2
    hints:
    - Meiosis begins before birth.
    - It pauses very early.
    solution: 'Step 1: meiosis starts in the foetus. Step 2: stops at prophase I.'
    mistakes:
      metaphase of mitosis: c12b2_gam
      telophase II: c12b2_gam
  - prompt: Which hormone from the pituitary acts on Leydig cells to make testosterone?
    options:
    - LH
    - FSH
    - oxytocin
    answer: LH
    difficulty: 3
    hints:
    - FSH acts on Sertoli cells.
    - The other gonadotropin.
    solution: 'Step 1: LH stimulates Leydig cells. Step 2: LH.'
    mistakes:
      FSH: c12b2_part
      oxytocin: c12b2_part
  - prompt: Why does oogenesis produce polar bodies?
    options:
    - the ovum keeps most cytoplasm while extra chromosomes are discarded
    - to make more ova
    - to feed sperm
    answer: the ovum keeps most cytoplasm while extra chromosomes are discarded
    difficulty: 3
    hints:
    - Divisions are unequal.
    - One large cell, small ones.
    solution: 'Step 1: unequal cytoplasm division. Step 2: ovum stays large; polar bodies carry extra nuclei.'
    mistakes:
      to make more ova: c12b2_gam
      to feed sperm: c12b2_gam
  - prompt: 'Assertion (A): The testes are located outside the abdominal cavity in the scrotum.

      Reason (R): Sperm formation needs a temperature about 2–2.5 °C lower than normal body temperature.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: The scrotum keeps the testes cooler than the body core, which spermatogenesis needs. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In a baby boy, a doctor finds that one testis has not descended into the scrotum. If left untreated, what is the main risk for adult life?'
    options:
    - That testis may not produce sperm
    - He will make too much testosterone
    - His sperm will have extra chromosomes
    answer: That testis may not produce sperm
    hints:
    - What is different about the temperature inside the abdomen?
    - Which process needs the lower temperature?
    solution: Inside the abdomen the testis is too warm for spermatogenesis, so it may not produce sperm. Surgery brings it down into the scrotum.
    mistakes:
      He will make too much testosterone: c12b2_temp
      His sperm will have extra chromosomes: c12b2_temp
    exam: case
    difficulty: 2
  - prompt: A sperm sample shows good numbers but very weak swimming. Which part of the sperm is most likely faulty?
    options:
    - Middle piece
    - Acrosome
    - Head nucleus
    answer: Middle piece
    hints:
    - Swimming needs energy.
    - Where are the mitochondria?
    solution: The middle piece is packed with mitochondria that power the tail. Poor energy supply gives weak motility.
    mistakes:
      Acrosome: b12_middle_piece
      Head nucleus: b12_middle_piece
    exam: competency
    difficulty: 2
- code: cbse12b.hrep.cycle
  title: Menstrual cycle, fertilisation and pregnancy
  after:
  - cbse12b.hrep.systems
  notes: |
    Menstrual cycle (~28 days; menarche to menopause): menstrual phase (days 1–5), follicular phase (FSH, LH, oestrogen;
    endometrium thickens), ovulation (~day 14, LH surge), luteal phase (corpus luteum makes progesterone; maintains
    endometrium); without fertilisation corpus luteum degenerates. Fertilisation in ampulla (acrosome reaction, zona pellucida);
    cleavage, morula, blastocyst (trophoblast, inner cell mass) implants in endometrium. Placenta (exchange; hormones hCG, hPL,
    progesterone, oestrogen); embryonic development (heart at 1 month); parturition (~9 months; oxytocin, foetal ejection
    reflex); lactation (colostrum with antibodies).
  explanations:
    text: The menstrual cycle lasts about 28 days. Hormones build up the lining of the uterus and release an egg around day 14. If the egg is fertilised, the embryo implants in the uterus and the placenta forms to nourish it for about nine months.
    visual: 'Draw a 28-day circle: days 1–5 menstruation, then the lining thickens, ovulation at day 14, then the corpus luteum phase until day 28.'
    step_by_step: 'Step 1: Follicular phase: FSH and oestrogen. Step 2: LH surge → ovulation. Step 3: Luteal phase: progesterone. Step 4: Fertilisation → implantation of the blastocyst → placenta.'
    real_world: Colostrum, the first milk, is rich in antibodies that protect newborn babies; doctors encourage breastfeeding from the first hour.
  picture:
    kind: flow
    steps:
    - Fertilisation in oviduct
    - Cleavage → morula
    - Blastocyst
    - Implantation in uterus
    - Placenta forms
    alt: From fertilisation to implantation and placenta formation.
  activity:
    type: number_line
    min: 0
    max: 28
    step: 1
    start: 0
    prompt: A typical 28-day menstrual cycle. Day 1 is the first day of menstruation. Mark each day.
    goals:
    - prompt: Ovulation, after the LH surge.
      target: 14
      mistakes:
      - when:
          v: 1
        say: Day 1 is when menstruation begins. Ovulation is in the middle of the cycle.
      - when:
          v: 28
        say: Day 28 is the end of the cycle. The egg is released halfway through.
    - prompt: The last day of the menstrual phase.
      target: 5
      mistakes:
      - when:
          v: 14
        say: Day 14 is ovulation. Menstruation lasts about 3–5 days.
      - when:
          v:
          - 8
          - 13
        say: By then the follicular phase is building the uterus lining again. Menstruation lasts about 3–5 days.
    - prompt: The first day of the luteal phase.
      target: 15
      mistakes:
      - when:
          v: 14
        say: Day 14 is ovulation itself. The luteal phase starts right after, when the corpus luteum forms.
      - when:
          v:
          - 6
          - 13
        say: 'Still the follicular phase: the follicle hasn''t released the egg yet.'
  lesson:
    - teach: 'The menstrual cycle repeats about every 28 days from menarche to menopause. Days 1–5: menstrual phase (endometrium shed). Then the follicular phase: FSH and LH help a follicle grow, and oestrogen rebuilds the endometrium.'
      check:
        prompt: 'During the follicular phase, the endometrium:'
        options:
        - thickens
        - is shed
        - disappears
        answer: thickens
        why: Oestrogen from the growing follicle rebuilds it.
      ways:
      - style: visual
        teach: The phases of a 28-day menstrual cycle in order.
        picture:
          kind: flow
          steps:
          - 'Days 1–5: menstrual phase'
          - 'Days 6–13: follicular phase, oestrogen rises'
          - 'Day 14: LH surge, ovulation'
          - 'Days 15–28: luteal phase, progesterone'
          alt: Days 1 to 5 are the menstrual phase. Days 6 to 13 are the follicular phase, when oestrogen rises. On day 14 an LH surge causes ovulation. Days 15 to 28 are the luteal phase, dominated by progesterone.
      - style: real_world
        teach: Many girls track their cycle in an app or calendar. It helps them know when the next period is likely and notice changes worth discussing with a doctor, like very irregular cycles, which can have treatable causes.
    - teach: 'Around day 14 an LH surge triggers ovulation: the Graafian follicle releases an ovum. In the luteal phase the empty follicle becomes the corpus luteum, making progesterone to keep the endometrium ready. Without fertilisation the corpus luteum breaks down, progesterone falls, and menstruation begins.'
      picture:
        kind: flow
        steps:
        - 'Days 1–5: menstruation'
        - 'Follicular phase: oestrogen'
        - 'Day ~14: LH surge, ovulation'
        - 'Luteal phase: progesterone'
        - 'No fertilisation: cycle restarts'
        alt: The phases of a 28-day menstrual cycle.
      check:
        prompt: Why does menstruation start when the corpus luteum breaks down?
        options:
        - progesterone falls, so the lining can't be maintained
        - oestrogen rises
        - the ovum grows
        answer: progesterone falls, so the lining can't be maintained
        why: Progesterone keeps the endometrium in place.
      ways:
      - style: step_by_step
        teach: 'If fertilisation happens. Step 1: The embryo implants and its trophoblast forms part of the placenta. Step 2: The placenta releases hCG. Step 3: hCG keeps the corpus luteum making progesterone. Step 4: The lining stays, so no period occurs.'
      - style: real_world
        teach: A home pregnancy test strip changes colour when hCG is present in urine. Since only a placenta makes hCG, its presence signals pregnancy within about two weeks of conception.
    - teach: Fertilisation happens in the ampulla. The zygote divides (cleavage) into a morula, then a blastocyst (outer trophoblast, inner cell mass) that implants in the endometrium. The placenta exchanges food, gases and wastes and makes hormones (hCG, hPL, progesterone, oestrogen). Birth after about 9 months is driven by oxytocin; the first milk, colostrum, carries antibodies.
      check:
        prompt: Which part of the blastocyst becomes the embryo?
        options:
        - inner cell mass
        - trophoblast
        - zona pellucida
        answer: inner cell mass
        why: The trophoblast forms part of the placenta.
      ways:
      - style: visual
        teach: The early embryo, from zygote in the oviduct to implantation in the uterus.
        picture:
          kind: flow
          steps:
          - Zygote in the ampulla
          - 'Cleavage: 2, 4, 8 cells… morula'
          - 'Blastocyst: trophoblast + inner cell mass'
          - Implants in the endometrium
          alt: The zygote forms in the ampulla. Cleavage divides it into 2, 4, 8 cells and then a morula. It becomes a blastocyst with an outer trophoblast and an inner cell mass, which implants in the endometrium.
      - style: step_by_step
        teach: 'What the placenta does. Step 1: It passes food and oxygen from mother to foetus. Step 2: It removes CO₂ and wastes. Step 3: It makes hormones like hCG, hPL and progesterone. Step 4: The umbilical cord connects it to the foetus.'
  items:
  - prompt: A typical menstrual cycle lasts about how many days?
    answer: '28'
    check: '28'
    difficulty: 1
    hints:
    - About four weeks.
    - '28.'
    solution: 28 days.
    mistakes: {"30": "b12_menstrual", "14": "b12_menstrual", "21": "b12_menstrual"}
  - prompt: On about which day of a 28-day cycle does ovulation occur?
    answer: '14'
    check: '14'
    difficulty: 1
    hints:
    - Middle.
    - LH surge.
    solution: Day 14.
    mistakes:
      '28': c12b_cycle
  - prompt: 'Ovulation is triggered by a surge of:'
    options:
    - LH
    - progesterone
    - oxytocin
    - prolactin
    answer: LH
    difficulty: 2
    hints:
    - Luteinising hormone.
    - Mid-cycle.
    solution: LH.
    mistakes: {"progesterone": "b12_lh_surge", "oxytocin": "b12_lh_surge", "prolactin": "b12_lh_surge"}
  - prompt: 'The corpus luteum mainly secretes:'
    options:
    - progesterone
    - FSH
    - oxytocin
    - testosterone
    answer: progesterone
    difficulty: 2
    hints:
    - Keeps the lining.
    - Luteal phase.
    solution: Progesterone.
    mistakes: {"FSH": "b12_corpus_luteum", "oxytocin": "b12_corpus_luteum", "testosterone": "b12_corpus_luteum"}
  - prompt: 'The blastocyst implants in the:'
    options:
    - endometrium of the uterus
    - ovary
    - oviduct
    - cervix
    answer: endometrium of the uterus
    difficulty: 1
    hints:
    - Inner lining.
    - Uterus.
    solution: The endometrium.
    mistakes: {"ovary": "b12_implantation", "oviduct": "b12_implantation", "cervix": "b12_implantation"}
  - prompt: 'The first milk, rich in antibodies, is called:'
    options:
    - colostrum
    - lactose
    - plasma
    - amniotic fluid
    answer: colostrum
    difficulty: 1
    hints:
    - First days.
    - Protects the baby.
    solution: Colostrum.
    mistakes: {"lactose": "b12_colostrum", "plasma": "b12_colostrum", "amniotic fluid": "b12_colostrum"}
  - prompt: In a 28-day cycle, the menstrual phase lasts about how many days?
    answer: '5'
    check: '5'
    difficulty: 1
