# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse12-bio
chapter: 2
title: Human Reproduction
tips:
  c12b_cycle: Menstrual cycle is about 28 days; ovulation is around day 14, triggered by an LH surge.
  c12b_gameto: One primary spermatocyte gives 4 sperm; one primary oocyte gives 1 ovum (plus polar bodies).
  b12_ampulla: "The egg meets sperm in the wide part of the oviduct, before reaching the uterus."
  b12_colostrum: "The first yellowish milk after birth gives the baby ready-made antibodies."
  b12_corpus_luteum: "The corpus luteum keeps the uterine lining ready for pregnancy."
  b12_implantation: "The lining of the uterus thickens to receive the embryo."
  b12_leydig: "Sertoli cells nourish sperm. The interstitial cells between tubules make the hormone."
  b12_lh_surge: "A sharp rise of the pituitary hormone mid-cycle releases the egg."
  b12_menstrual: "About a lunar month."
  b12_middle_piece: "The sperm's swimming needs energy. Where are the powerhouses packed?"
  b12_scrotum: "The range given is 2–2.5 °C; the question asks for the lower value."
  b12_spermatogenesis: "Meiosis turns one primary spermatocyte into four spermatids."
concepts:
- code: cbse12b.hrep.systems
  title: Reproductive systems and gametogenesis
  notes: |
    Male system: testes in scrotum (2–2.5 °C below body temperature), seminiferous tubules (spermatogonia, Sertoli cells),
    Leydig cells (androgens), ducts (rete testis, vasa efferentia, epididymis, vas deferens, ejaculatory duct, urethra),
    accessory glands (seminal vesicles, prostate, bulbourethral). Female: ovaries, oviducts (infundibulum, ampulla, isthmus),
    uterus (perimetrium, myometrium, endometrium), cervix, vagina; mammary glands. Spermatogenesis (from puberty; 4 sperm per
    primary spermatocyte; GnRH, LH, FSH) and sperm structure (head with acrosome, neck, middle piece with mitochondria, tail).
    Oogenesis (begins before birth; primary oocytes arrested in prophase I; one ovum + polar bodies); Graafian follicle.
  explanations:
    text: Humans reproduce sexually. Testes make sperm and the hormone testosterone; ovaries make eggs and hormones like oestrogen. Sperm production makes four sperm from each starting cell, while egg production makes just one egg.
    visual: 'Draw a sperm: a head with the nucleus and an acrosome cap, a middle piece packed with mitochondria for energy, and a long tail for swimming.'
    step_by_step: 'Step 1: Name each organ and its job. Step 2: Spermatogenesis: 1 primary spermatocyte → 4 sperm. Step 3: Oogenesis: 1 primary oocyte → 1 ovum + polar bodies. Step 4: Link hormones (LH, FSH) to each stage.'
    real_world: The testes hang outside the body because sperm develop best slightly below body temperature.
  picture:
    kind: compare
    columns:
    - title: Process
      points:
      - spermatogenesis
      - oogenesis
    - title: Starts
      points:
      - at puberty
      - before birth
    - title: Gametes per primary cell
      points:
      - 4 sperm
      - 1 ovum
    alt: Spermatogenesis and oogenesis compared.
  activity:
    type: order
    prompt: Trace a sperm's path out of the body.
    steps:
    - Seminiferous tubules (where sperms form)
    - Rete testis
    - Vasa efferentia
    - Epididymis (where sperms mature and are stored)
    - Vas deferens
    - Ejaculatory duct
    - Urethra
    reasons:
      Rete testis: Sperms leave the tubules first; the rete testis collects them inside the testis.
      Vasa efferentia: These small ducts lead out of the rete testis.
      Epididymis (where sperms mature and are stored): The vasa efferentia open into the epididymis.
      Vas deferens: From the epididymis the vas deferens carries sperms up into the body.
      Ejaculatory duct: The vas deferens joins the seminal vesicle's duct to form the ejaculatory duct.
      Urethra: The ejaculatory ducts open into the urethra, the last part of the path.
  items:
  - prompt: How many sperm develop from one primary spermatocyte?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Meiosis gives four.
    - All functional.
    solution: '4.'
    mistakes: {"2": "b12_spermatogenesis", "1": "b12_spermatogenesis"}
  - prompt: How many functional ova develop from one primary oocyte?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Polar bodies degenerate.
    - One.
    solution: '1.'
    mistakes:
      '4': c12b_gameto
  - prompt: By about how many °C is scrotal temperature below body temperature (lower value of 2–2.5)?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 2–2.5 °C.
    - Lower value.
    solution: About 2–2.5 °C.
    mistakes: {"2.5": "b12_scrotum", "5": "b12_scrotum"}
  - prompt: 'Testosterone is made by the:'
    options:
    - Leydig cells
    - Sertoli cells
    - spermatogonia
    - prostate
    answer: Leydig cells
    difficulty: 2
    hints:
    - Interstitial cells.
    - Between tubules.
    solution: Leydig (interstitial) cells.
    mistakes: {"Sertoli cells": "b12_leydig", "spermatogonia": "b12_leydig", "prostate": "b12_leydig"}
  - prompt: 'The part of the sperm full of mitochondria is the:'
    options:
    - middle piece
    - head
    - tail
    - acrosome
    answer: middle piece
    difficulty: 1
    hints:
    - Energy for swimming.
    - Middle.
    solution: The middle piece.
    mistakes: {"head": "b12_middle_piece", "tail": "b12_middle_piece", "acrosome": "b12_middle_piece"}
  - prompt: 'Fertilisation normally takes place in the:'
    options:
    - ampulla of the oviduct
    - uterus
    - ovary
    - cervix
    answer: ampulla of the oviduct
    difficulty: 2
    hints:
    - Fallopian tube.
    - Wide region.
    solution: The ampulla of the oviduct.
    mistakes: {"uterus": "b12_ampulla", "ovary": "b12_ampulla", "cervix": "b12_ampulla"}
- code: cbse12b.hrep.cycle
  title: Menstrual cycle, fertilisation and pregnancy
  after:
  - cbse12b.hrep.systems
  notes: |
    Menstrual cycle (~28 days; menarche to menopause): menstrual phase (days 1–5), follicular phase (FSH, LH, oestrogen;
    endometrium thickens), ovulation (~day 14, LH surge), luteal phase (corpus luteum makes progesterone; maintains
    endometrium); without fertilisation corpus luteum degenerates. Fertilisation in ampulla (acrosome reaction, zona pellucida);
    cleavage, morula, blastocyst (trophoblast, inner cell mass) implants in endometrium. Placenta (exchange; hormones hCG, hPL,
    progesterone, oestrogen); embryonic development (heart at 1 month); parturition (~9 months; oxytocin, foetal ejection
    reflex); lactation (colostrum with antibodies).
  explanations:
    text: The menstrual cycle lasts about 28 days. Hormones build up the lining of the uterus and release an egg around day 14. If the egg is fertilised, the embryo implants in the uterus and the placenta forms to nourish it for about nine months.
    visual: 'Draw a 28-day circle: days 1–5 menstruation, then the lining thickens, ovulation at day 14, then the corpus luteum phase until day 28.'
    step_by_step: 'Step 1: Follicular phase: FSH and oestrogen. Step 2: LH surge → ovulation. Step 3: Luteal phase: progesterone. Step 4: Fertilisation → implantation of the blastocyst → placenta.'
    real_world: Colostrum, the first milk, is rich in antibodies that protect newborn babies; doctors encourage breastfeeding from the first hour.
  picture:
    kind: flow
    steps:
    - Fertilisation in oviduct
    - Cleavage → morula
    - Blastocyst
    - Implantation in uterus
    - Placenta forms
    alt: From fertilisation to implantation and placenta formation.
  activity:
    type: number_line
    min: 0
    max: 28
    step: 1
    start: 0
    prompt: A typical 28-day menstrual cycle. Day 1 is the first day of menstruation. Mark each day.
    goals:
    - prompt: Ovulation, after the LH surge.
      target: 14
      mistakes:
      - when:
          v: 1
        say: Day 1 is when menstruation begins. Ovulation is in the middle of the cycle.
      - when:
          v: 28
        say: Day 28 is the end of the cycle. The egg is released halfway through.
    - prompt: The last day of the menstrual phase.
      target: 5
      mistakes:
      - when:
          v: 14
        say: Day 14 is ovulation. Menstruation lasts about 3–5 days.
      - when:
          v:
          - 8
          - 13
        say: By then the follicular phase is building the uterus lining again. Menstruation lasts about 3–5 days.
    - prompt: The first day of the luteal phase.
      target: 15
      mistakes:
      - when:
          v: 14
        say: Day 14 is ovulation itself. The luteal phase starts right after, when the corpus luteum forms.
      - when:
          v:
          - 6
          - 13
        say: 'Still the follicular phase: the follicle hasn''t released the egg yet.'
  items:
  - prompt: A typical menstrual cycle lasts about how many days?
    answer: '28'
    check: '28'
    difficulty: 1
    hints:
    - About four weeks.
    - '28.'
    solution: 28 days.
    mistakes: {"30": "b12_menstrual", "14": "b12_menstrual", "21": "b12_menstrual"}
  - prompt: On about which day of a 28-day cycle does ovulation occur?
    answer: '14'
    check: '14'
    difficulty: 1
    hints:
    - Middle.
    - LH surge.
    solution: Day 14.
    mistakes:
      '28': c12b_cycle
  - prompt: 'Ovulation is triggered by a surge of:'
    options:
    - LH
    - progesterone
    - oxytocin
    - prolactin
    answer: LH
    difficulty: 2
    hints:
    - Luteinising hormone.
    - Mid-cycle.
    solution: LH.
    mistakes: {"progesterone": "b12_lh_surge", "oxytocin": "b12_lh_surge", "prolactin": "b12_lh_surge"}
  - prompt: 'The corpus luteum mainly secretes:'
    options:
    - progesterone
    - FSH
    - oxytocin
    - testosterone
    answer: progesterone
    difficulty: 2
    hints:
    - Keeps the lining.
    - Luteal phase.
    solution: Progesterone.
    mistakes: {"FSH": "b12_corpus_luteum", "oxytocin": "b12_corpus_luteum", "testosterone": "b12_corpus_luteum"}
  - prompt: 'The blastocyst implants in the:'
    options:
    - endometrium of the uterus
    - ovary
    - oviduct
    - cervix
    answer: endometrium of the uterus
    difficulty: 1
    hints:
    - Inner lining.
    - Uterus.
    solution: The endometrium.
    mistakes: {"ovary": "b12_implantation", "oviduct": "b12_implantation", "cervix": "b12_implantation"}
  - prompt: 'The first milk, rich in antibodies, is called:'
    options:
    - colostrum
    - lactose
    - plasma
    - amniotic fluid
    answer: colostrum
    difficulty: 1
    hints:
    - First days.
    - Protects the baby.
    solution: Colostrum.
    mistakes: {"lactose": "b12_colostrum", "plasma": "b12_colostrum", "amniotic fluid": "b12_colostrum"}
