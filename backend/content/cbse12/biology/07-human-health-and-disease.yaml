# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse12-bio
chapter: 7
title: Human Health and Disease
tips:
  c12b_immunity: 'Active immunity: your body makes antibodies (infection or vaccine), slow but long-lasting. Passive: ready-made antibodies given (colostrum, antiserum), fast but short.'
  c12b_pathogen: 'Match disease to pathogen type: typhoid and pneumonia (bacteria), common cold (virus), malaria and amoebiasis (protozoa), ringworm (fungi), ascariasis and filariasis (worms).'
concepts:
- code: cbse12b.health.diseases
  title: Common diseases in humans
  notes: |
    Health: physical, mental and social well-being. Infectious diseases: typhoid (Salmonella typhi; Widal test), pneumonia
    (Streptococcus pneumoniae, Haemophilus influenzae), common cold (rhinoviruses), malaria (Plasmodium vivax, P. malariae, P.
    falciparum—most serious; female Anopheles; haemozoin causes chills and fever; life cycle in human liver and RBCs, sexual stage
    in mosquito), amoebiasis (Entamoeba histolytica; houseflies), ascariasis (Ascaris), filariasis/elephantiasis (Wuchereria;
    Culex), ringworm (Microsporum, Trichophyton, Epidermophyton). Prevention: hygiene, clean water, vector control (Gambusia
    fish eat larvae).
  explanations:
    text: 'Infectious diseases are caused by pathogens: bacteria, viruses, protozoa, fungi and worms. Malaria, for example, is caused by the protozoan Plasmodium and spread by female Anopheles mosquitoes. Good hygiene, clean water and controlling mosquitoes prevent many of these diseases.'
    visual: 'Draw the malaria cycle: a mosquito bites and injects sporozoites, which multiply in the liver, then burst red blood cells, causing fever; another mosquito picks them up when it bites.'
    step_by_step: 'Step 1: Name the disease. Step 2: Identify the pathogen type. Step 3: Identify how it spreads (water, air, vector). Step 4: Match the prevention method.'
    real_world: Kerala's fight against dengue and leptospirosis relies on removing standing water and cleaning drains after the monsoon.
  picture:
    kind: compare
    columns:
    - title: Disease
      points:
      - typhoid
      - malaria
      - common cold
      - ringworm
    - title: Pathogen
      points:
      - Salmonella (bacterium)
      - Plasmodium (protozoan)
      - rhinovirus (virus)
      - fungi
    alt: Common diseases and the type of pathogen that causes each.
  activity:
    type: sort
    prompt: What causes each disease?
    bins:
    - Bacteria
    - Virus
    - Protozoan
    - Worm
    - Fungus
    items:
    - label: Typhoid
      bin: Bacteria
      clue: Salmonella typhi, confirmed by the Widal test. What kind?
      why: A bacterium.
    - label: Pneumonia
      bin: Bacteria
      clue: Streptococcus pneumoniae. What kind?
      why: A bacterium.
    - label: Common cold
      bin: Virus
      clue: Rhinoviruses. What kind?
      why: 'A virus: antibiotics don''t help.'
    - label: Malaria
      bin: Protozoan
      clue: Plasmodium, spread by female Anopheles. What kind?
      why: A protozoan.
    - label: Amoebiasis
      bin: Protozoan
      clue: Entamoeba histolytica. What kind?
      why: A protozoan.
    - label: Ascariasis
      bin: Worm
      clue: Ascaris, the roundworm. What kind?
      why: A helminth (worm).
    - label: Elephantiasis (filariasis)
      bin: Worm
      clue: Wuchereria, spread by Culex mosquitoes. What kind?
      why: A filarial worm.
    - label: Ringworm
      bin: Fungus
      clue: Microsporum and Trichophyton. Despite the name, what kind?
      why: A fungus, not a worm.
  items:
  - prompt: 'Malaria is spread by the:'
    options:
    - female Anopheles mosquito
    - male Anopheles mosquito
    - Culex mosquito
    - housefly
    answer: female Anopheles mosquito
    difficulty: 1
    hints:
    - Only females bite.
    - Anopheles.
    solution: The female Anopheles mosquito.
  - prompt: 'Typhoid is confirmed by the:'
    options:
    - Widal test
    - ELISA
    - PCR only
    - Mantoux test
    answer: Widal test
    difficulty: 2
    hints:
    - Salmonella typhi.
    - Blood test.
    solution: The Widal test.
  - prompt: 'The common cold is caused by:'
    options:
    - rhinoviruses
    - bacteria
    - protozoa
    - fungi
    answer: rhinoviruses
    difficulty: 1
    hints:
    - Virus.
    - Nose and airways.
    solution: Rhinoviruses.
    mistakes:
      bacteria: c12b_pathogen
  - prompt: 'The chills and fever of malaria are caused by the release of:'
    options:
    - haemozoin
    - histamine
    - insulin
    - haemoglobin
    answer: haemozoin
    difficulty: 2
    hints:
    - Toxin from burst RBCs.
    - Every 3–4 days.
    solution: Haemozoin.
  - prompt: 'Elephantiasis is caused by:'
    options:
    - Wuchereria (filarial worm)
    - Ascaris
    - Plasmodium
    - Trichophyton
    answer: Wuchereria (filarial worm)
    difficulty: 2
    hints:
    - Swollen limbs.
    - Culex spreads it.
    solution: Wuchereria.
  - prompt: 'Gambusia fish are used to control mosquitoes because they:'
    options:
    - eat mosquito larvae
    - repel adults
    - poison water
    - eat adult mosquitoes
    answer: eat mosquito larvae
    difficulty: 1
    hints:
    - Biological control.
    - In ponds.
    solution: They eat mosquito larvae.
- code: cbse12b.health.immunity
  title: Immunity, AIDS, cancer and drugs
  after:
  - cbse12b.health.diseases
  notes: |
    Immunity: innate (barriers: physical—skin; physiological—stomach acid, tears; cellular—neutrophils, macrophages, NK cells;
    cytokine—interferons) and acquired (memory; primary and secondary responses; B-lymphocytes → antibodies (humoral; IgA, IgM,
    IgE, IgG; H₂L₂ structure), T-lymphocytes (cell-mediated; graft rejection)). Active and passive immunity; vaccination,
    recombinant vaccines (hepatitis B). Allergies (IgE, histamine; antihistamines). Autoimmunity (rheumatoid arthritis). Lymphoid
    organs: primary (bone marrow, thymus), secondary (spleen, lymph nodes, MALT). AIDS: HIV (retrovirus) infects helper T cells;
    diagnosed by ELISA; antiretroviral therapy; prevention. Cancer: loss of contact inhibition; benign and malignant tumours,
    metastasis; carcinogens; detection (biopsy, MRI, CT); treatment. Drugs and alcohol abuse: opioids (heroin), cannabinoids,
    cocaine; adolescence; prevention.
  explanations:
    text: Our immune system defends us. Innate immunity works on every invader from birth; acquired immunity learns specific invaders and remembers them, which is how vaccines work. HIV attacks the helper T cells that coordinate immunity, causing AIDS. Cancer happens when cells divide out of control.
    visual: 'Picture a vaccine as a ''wanted poster'' shown to the immune system: it learns what the germ looks like, so when the real germ arrives, memory cells recognise and destroy it fast.'
    step_by_step: 'Step 1: Innate (general) or acquired (specific)? Step 2: Active (body makes antibodies) or passive (antibodies given)? Step 3: For HIV, remember it targets helper T cells. Step 4: Benign tumours stay put; malignant ones spread (metastasis).'
    real_world: India's Universal Immunisation Programme protects millions of children each year against diseases like measles and polio.
  picture:
    kind: flow
    steps:
    - HIV enters the body
    - Infects macrophages
    - Infects helper T cells
    - T cell numbers fall
    - Immune system weakens (AIDS)
    alt: How HIV leads to AIDS by destroying helper T cells.
  activity:
    type: sort
    prompt: Innate or acquired immunity?
    bins:
    - Innate
    - Acquired
    items:
    - label: Skin
      bin: Innate
      clue: Is it there from birth and the same against every germ?
      why: 'A physical barrier: innate.'
    - label: Stomach acid
      bin: Innate
      clue: Does it target a particular germ?
      why: 'A physiological barrier: innate.'
    - label: Lysozyme in tears
      bin: Innate
      clue: Does it need to have met the germ before?
      why: Innate.
    - label: Neutrophils and macrophages eating germs
      bin: Innate
      clue: Do they recognise one specific germ?
      why: 'Cellular barriers: innate.'
    - label: Interferons from virus-infected cells
      bin: Innate
      clue: Do they protect nearby cells against any virus?
      why: 'Cytokine barrier: innate.'
    - label: Antibodies made by B cells
      bin: Acquired
      clue: Are they made for one particular antigen?
      why: 'Specific: acquired.'
    - label: Memory cells
      bin: Acquired
      clue: Do they remember a germ met before?
      why: Memory is the mark of acquired immunity.
    - label: A faster, stronger second response
      bin: Acquired
      clue: Why is the second meeting with a germ handled better?
      why: 'Memory cells: acquired.'
    - label: Vaccination
      bin: Acquired
      clue: Does it teach the body one specific germ?
      why: Active acquired immunity.
    - label: T cells killing infected cells
      bin: Acquired
      clue: Do they recognise a specific antigen?
      why: Cell-mediated acquired immunity.
  items:
  - prompt: How many polypeptide chains does an antibody molecule have?
    answer: '4'
    check: 2+2
    difficulty: 1
    hints:
    - H₂L₂.
    - 2 heavy + 2 light.
    solution: '4.'
  - prompt: 'Antibodies passed to a baby through colostrum give:'
    options:
    - passive immunity
    - active immunity
    - innate immunity
    - autoimmunity
    answer: passive immunity
    difficulty: 2
    hints:
    - Ready-made.
    - Baby doesn't make them.
    solution: Passive immunity.
    mistakes:
      active immunity: c12b_immunity
  - prompt: 'HIV mainly destroys:'
    options:
    - helper T lymphocytes
    - red blood cells
    - platelets
    - B cells only
    answer: helper T lymphocytes
    difficulty: 1
    hints:
    - CD4 cells.
    - Coordinate immunity.
    solution: Helper T lymphocytes.
  - prompt: 'The test commonly used to diagnose HIV infection is:'
    options:
    - ELISA
    - Widal
    - Mantoux
    - biopsy
    answer: ELISA
    difficulty: 2
    hints:
    - Enzyme-linked.
    - Detects antibodies.
    solution: ELISA.
  - prompt: 'The spread of cancer cells to other parts of the body is called:'
    options:
    - metastasis
    - contact inhibition
    - mitosis
    - immunity
    answer: metastasis
    difficulty: 1
    hints:
    - Malignant tumours.
    - Travel in blood.
    solution: Metastasis.
  - prompt: 'Allergies are mainly due to the release of:'
    options:
    - histamine
    - insulin
    - interferon
    - thyroxine
    answer: histamine
    difficulty: 2
    hints:
    - Mast cells.
    - IgE.
    solution: Histamine.
