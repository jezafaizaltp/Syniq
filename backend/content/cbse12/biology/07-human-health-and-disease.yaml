# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse12-bio
chapter: 7
title: Human Health and Disease
tips:
  c12b_immunity: 'Active immunity: your body makes antibodies (infection or vaccine), slow but long-lasting. Passive: ready-made antibodies given (colostrum, antiserum), fast but short.'
  c12b_pathogen: 'Match disease to pathogen type: typhoid and pneumonia (bacteria), common cold (virus), malaria and amoebiasis (protozoa), ringworm (fungi), ascariasis and filariasis (worms).'
  b12_anopheles: "Only females bite for blood; Culex spreads filaria."
  b12_antibody: "An antibody has two heavy and two light chains."
  b12_elisa: "Widal is for typhoid, Mantoux for TB."
  b12_filaria: "The swelling is caused by a worm that blocks lymph vessels."
  b12_gambusia: "Gambusia are small fish that feed in water. Which mosquito stage lives in water?"
  b12_haemozoin: "A toxin released when infected RBCs burst causes the fever."
  b12_histamine: "Allergy tablets are named after the chemical they block, released by mast cells."
  b12_hiv: "HIV attacks the cells that coordinate the immune response."
  b12_metastasis: "'Meta' means change of place."
  b12_widal: "ELISA is for HIV, Mantoux for TB."
  c12b7_cause: "First decide the kind of cause (bacteria, virus, protozoa, worms or fungi), then how it spreads: air, water, food, insects or contact."
  c12b7_imm: "Ask whether the body made the antibodies itself or received ready-made ones, and whether the protection is inborn or built after exposure."
  c12b7_drug: "Group drugs by the plant they come from and their effect: do they slow the body down or speed it up? Which plant's latex gives morphine?"
concepts:
- code: cbse12b.health.diseases
  title: Common diseases in humans
  notes: |
    Health: physical, mental and social well-being. Infectious diseases: typhoid (Salmonella typhi; Widal test), pneumonia
    (Streptococcus pneumoniae, Haemophilus influenzae), common cold (rhinoviruses), malaria (Plasmodium vivax, P. malariae, P.
    falciparum—most serious; female Anopheles; haemozoin causes chills and fever; life cycle in human liver and RBCs, sexual stage
    in mosquito), amoebiasis (Entamoeba histolytica; houseflies), ascariasis (Ascaris), filariasis/elephantiasis (Wuchereria;
    Culex), ringworm (Microsporum, Trichophyton, Epidermophyton). Prevention: hygiene, clean water, vector control (Gambusia
    fish eat larvae).
  explanations:
    text: 'Infectious diseases are caused by pathogens: bacteria, viruses, protozoa, fungi and worms. Malaria, for example, is caused by the protozoan Plasmodium and spread by female Anopheles mosquitoes. Good hygiene, clean water and controlling mosquitoes prevent many of these diseases.'
    visual: 'Draw the malaria cycle: a mosquito bites and injects sporozoites, which multiply in the liver, then burst red blood cells, causing fever; another mosquito picks them up when it bites.'
    step_by_step: 'Step 1: Name the disease. Step 2: Identify the pathogen type. Step 3: Identify how it spreads (water, air, vector). Step 4: Match the prevention method.'
    real_world: Kerala's fight against dengue and leptospirosis relies on removing standing water and cleaning drains after the monsoon.
  picture:
    kind: compare
    columns:
    - title: Disease
      points:
      - typhoid
      - malaria
      - common cold
      - ringworm
    - title: Pathogen
      points:
      - Salmonella (bacterium)
      - Plasmodium (protozoan)
      - rhinovirus (virus)
      - fungi
    alt: Common diseases and the type of pathogen that causes each.
  activity:
    type: sort
    prompt: What causes each disease?
    bins:
    - Bacteria
    - Virus
    - Protozoan
    - Worm
    - Fungus
    items:
    - label: Typhoid
      bin: Bacteria
      clue: Salmonella typhi, confirmed by the Widal test. What kind?
      why: A bacterium.
    - label: Pneumonia
      bin: Bacteria
      clue: Streptococcus pneumoniae. What kind?
      why: A bacterium.
    - label: Common cold
      bin: Virus
      clue: Rhinoviruses. What kind?
      why: 'A virus: antibiotics don''t help.'
    - label: Malaria
      bin: Protozoan
      clue: Plasmodium, spread by female Anopheles. What kind?
      why: A protozoan.
    - label: Amoebiasis
      bin: Protozoan
      clue: Entamoeba histolytica. What kind?
      why: A protozoan.
    - label: Ascariasis
      bin: Worm
      clue: Ascaris, the roundworm. What kind?
      why: A helminth (worm).
    - label: Elephantiasis (filariasis)
      bin: Worm
      clue: Wuchereria, spread by Culex mosquitoes. What kind?
      why: A filarial worm.
    - label: Ringworm
      bin: Fungus
      clue: Microsporum and Trichophyton. Despite the name, what kind?
      why: A fungus, not a worm.
  lesson:
    - teach: 'Health is physical, mental and social well-being, not just the absence of disease. Pathogens cause infectious diseases. Bacteria: typhoid (Salmonella typhi, spread by contaminated food and water, confirmed by the Widal test) and pneumonia (Streptococcus pneumoniae, Haemophilus influenzae; affects the alveoli). Viruses: the common cold (rhinoviruses; nose and airway, not lungs).'
      picture:
        kind: compare
        columns:
        - title: Disease
          points:
          - typhoid
          - pneumonia
          - common cold
          - malaria
          - ringworm
        - title: Cause
          points:
          - bacterium
          - bacterium
          - virus
          - protozoan
          - fungus
        alt: Common diseases and the kind of pathogen behind each.
      check:
        prompt: 'Pneumonia mainly affects the:'
        options:
        - alveoli of the lungs
        - intestine
        - skin
        answer: alveoli of the lungs
        why: They fill with fluid, making breathing hard.
    - teach: Malaria is caused by Plasmodium (P. falciparum causes the most serious form) and spread by the female Anopheles mosquito. Sporozoites enter the blood, multiply in liver cells, then in red blood cells; when RBCs burst they release haemozoin, causing chills and high fever. The sexual stage (gametocytes fusing) happens in the mosquito's gut.
      picture:
        kind: flow
        steps:
        - mosquito bite (sporozoites)
        - liver cells
        - red blood cells
        - RBCs burst (haemozoin)
        - mosquito takes gametocytes
        alt: The malaria parasite's path through the human and back to the mosquito.
      check:
        prompt: 'In the human body, Plasmodium first multiplies in the:'
        options:
        - liver
        - brain
        - stomach
        answer: liver
        why: Sporozoites reach the liver before the RBCs.
    - teach: 'Amoebiasis (Entamoeba histolytica) spreads through food contaminated by houseflies. Ascariasis (Ascaris roundworm) spreads through soil and water with eggs. Filariasis or elephantiasis (Wuchereria) is spread by Culex mosquitoes and swells the limbs. Ringworm (fungi like Trichophyton) causes dry scaly patches. Prevention: personal and public hygiene, clean water, and controlling vectors, e.g. Gambusia fish eating mosquito larvae.'
      check:
        prompt: 'Houseflies carry the cause of:'
        options:
        - amoebiasis
        - malaria
        - filariasis
        answer: amoebiasis
        why: Flies carry cysts from faeces to food.
  items:
  - prompt: 'Malaria is spread by the:'
    options:
    - female Anopheles mosquito
    - male Anopheles mosquito
    - Culex mosquito
    - housefly
    answer: female Anopheles mosquito
    difficulty: 1
    hints:
    - Only females bite.
    - Anopheles.
    solution: The female Anopheles mosquito.
    mistakes: {"male Anopheles mosquito": "b12_anopheles", "Culex mosquito": "b12_anopheles", "housefly": "b12_anopheles"}
  - prompt: 'Typhoid is confirmed by the:'
    options:
    - Widal test
    - ELISA
    - PCR only
    - Mantoux test
    answer: Widal test
    difficulty: 2
    hints:
    - Salmonella typhi.
    - Blood test.
    solution: The Widal test.
    mistakes: {"ELISA": "b12_widal", "PCR only": "b12_widal", "Mantoux test": "b12_widal"}
  - prompt: 'The common cold is caused by:'
    options:
    - rhinoviruses
    - bacteria
    - protozoa
    - fungi
    answer: rhinoviruses
    difficulty: 1
    hints:
    - Virus.
    - Nose and airways.
    solution: Rhinoviruses.
    mistakes:
      bacteria: c12b_pathogen
  - prompt: 'The chills and fever of malaria are caused by the release of:'
    options:
    - haemozoin
    - histamine
    - insulin
    - haemoglobin
    answer: haemozoin
    difficulty: 2
    hints:
    - Toxin from burst RBCs.
    - Every 3–4 days.
    solution: Haemozoin.
    mistakes: {"histamine": "b12_haemozoin", "insulin": "b12_haemozoin", "haemoglobin": "b12_haemozoin"}
  - prompt: 'Elephantiasis is caused by:'
    options:
    - Wuchereria (filarial worm)
    - Ascaris
    - Plasmodium
    - Trichophyton
    answer: Wuchereria (filarial worm)
    difficulty: 2
    hints:
    - Swollen limbs.
    - Culex spreads it.
    solution: Wuchereria.
    mistakes: {"Ascaris": "b12_filaria", "Plasmodium": "b12_filaria", "Trichophyton": "b12_filaria"}
  - prompt: 'Gambusia fish are used to control mosquitoes because they:'
    options:
    - eat mosquito larvae
    - repel adults
    - poison water
    - eat adult mosquitoes
    answer: eat mosquito larvae
    difficulty: 1
    hints:
    - Biological control.
    - In ponds.
    solution: They eat mosquito larvae.
    mistakes: {"repel adults": "b12_gambusia", "poison water": "b12_gambusia", "eat adult mosquitoes": "b12_gambusia"}
  - prompt: Which Plasmodium species causes the most serious malaria?
    options:
    - P. falciparum
    - P. vivax
    - P. malariae
    answer: P. falciparum
    difficulty: 1
    hints:
    - It can cause cerebral malaria.
    - Its name comes from 'sickle' shaped gametocytes.
    solution: 'Step 1: most deadly species. Step 2: P. falciparum.'
    mistakes:
      P. vivax: c12b7_cause
      P. malariae: c12b7_cause
  - prompt: Elephantiasis is spread by which mosquito?
    options:
    - Culex
    - Anopheles
    - Aedes
    answer: Culex
    difficulty: 2
    hints:
    - Not the malaria mosquito.
    - A common house mosquito.
    solution: 'Step 1: Wuchereria larvae carried by. Step 2: Culex.'
    mistakes:
      Anopheles: c12b7_cause
      Aedes: c12b7_cause
  - prompt: 'Ringworm is caused by a:'
    options:
    - fungus
    - worm
    - virus
    answer: fungus
    difficulty: 1
    hints:
    - The name is misleading.
    - Trichophyton and Microsporum.
    solution: 'Step 1: Microsporum, Trichophyton, Epidermophyton. Step 2: fungi.'
    mistakes:
      worm: c12b7_cause
      virus: c12b7_cause
  - prompt: 'Typhoid is caused by:'
    options:
    - Salmonella typhi
    - Entamoeba histolytica
    - rhinovirus
    answer: Salmonella typhi
    difficulty: 1
    hints:
    - It is a bacterium.
    - Its name contains the disease.
    solution: 'Step 1: bacterial disease of the intestine. Step 2: Salmonella typhi.'
    mistakes:
      Entamoeba histolytica: c12b7_cause
      rhinovirus: c12b7_cause
  - prompt: In which host does the sexual stage of Plasmodium happen?
    options:
    - female Anopheles mosquito
    - human
    - housefly
    answer: female Anopheles mosquito
    difficulty: 2
    hints:
    - Gametocytes fuse there.
    - It is the host that carries it to humans.
    solution: 'Step 1: gametes fuse in the gut of the vector. Step 2: mosquito.'
    mistakes:
      human: c12b7_cause
      housefly: c12b7_cause
  - prompt: 'Ascaris eggs enter the body mainly through:'
    options:
    - contaminated water, vegetables and fruits
    - mosquito bites
    - air
    answer: contaminated water, vegetables and fruits
    difficulty: 2
    hints:
    - Eggs pass out in faeces.
    - They reach food grown in polluted soil.
    solution: 'Step 1: soil and water contamination. Step 2: food and water.'
    mistakes:
      mosquito bites: c12b7_cause
      air: c12b7_cause
  - prompt: 'The common cold mainly infects the:'
    options:
    - nose and respiratory passages
    - lungs' alveoli
    - liver
    answer: nose and respiratory passages
    difficulty: 1
    hints:
    - Rhinoviruses; 'rhino' means nose.
    - It does not reach deep into the lungs.
    solution: 'Step 1: upper airway infection. Step 2: nose and passages.'
    mistakes:
      lungs' alveoli: c12b7_cause
      liver: c12b7_cause
  - prompt: Which disease is spread through droplets from an infected person's cough?
    options:
    - pneumonia
    - amoebiasis
    - filariasis
    answer: pneumonia
    difficulty: 2
    hints:
    - It is a respiratory infection.
    - The others spread by food or mosquitoes.
    solution: 'Step 1: airborne droplets, shared utensils. Step 2: pneumonia.'
    mistakes:
      amoebiasis: c12b7_cause
      filariasis: c12b7_cause
  - prompt: 'Draining stagnant water near homes helps prevent:'
    options:
    - mosquito-borne diseases
    - ringworm
    - typhoid only
    answer: mosquito-borne diseases
    difficulty: 1
    hints:
    - Which insect lays eggs in still water?
    - Its larvae grow there.
    solution: 'Step 1: removes breeding sites. Step 2: fewer mosquitoes, less malaria, dengue, filariasis.'
    mistakes:
      ringworm: c12b7_cause
      typhoid only: c12b7_cause
- code: cbse12b.health.immunity
  title: Immunity, AIDS, cancer and drugs
  after:
  - cbse12b.health.diseases
  notes: |
    Immunity: innate (barriers: physical—skin; physiological—stomach acid, tears; cellular—neutrophils, macrophages, NK cells;
    cytokine—interferons) and acquired (memory; primary and secondary responses; B-lymphocytes → antibodies (humoral; IgA, IgM,
    IgE, IgG; H₂L₂ structure), T-lymphocytes (cell-mediated; graft rejection)). Active and passive immunity; vaccination,
    recombinant vaccines (hepatitis B). Allergies (IgE, histamine; antihistamines). Autoimmunity (rheumatoid arthritis). Lymphoid
    organs: primary (bone marrow, thymus), secondary (spleen, lymph nodes, MALT). AIDS: HIV (retrovirus) infects helper T cells;
    diagnosed by ELISA; antiretroviral therapy; prevention. Cancer: loss of contact inhibition; benign and malignant tumours,
    metastasis; carcinogens; detection (biopsy, MRI, CT); treatment. Drugs and alcohol abuse: opioids (heroin), cannabinoids,
    cocaine; adolescence; prevention.
  explanations:
    text: Our immune system defends us. Innate immunity works on every invader from birth; acquired immunity learns specific invaders and remembers them, which is how vaccines work. HIV attacks the helper T cells that coordinate immunity, causing AIDS. Cancer happens when cells divide out of control.
    visual: 'Picture a vaccine as a ''wanted poster'' shown to the immune system: it learns what the germ looks like, so when the real germ arrives, memory cells recognise and destroy it fast.'
    step_by_step: 'Step 1: Innate (general) or acquired (specific)? Step 2: Active (body makes antibodies) or passive (antibodies given)? Step 3: For HIV, remember it targets helper T cells. Step 4: Benign tumours stay put; malignant ones spread (metastasis).'
    real_world: India's Universal Immunisation Programme protects millions of children each year against diseases like measles and polio.
  picture:
    kind: flow
    steps:
    - HIV enters the body
    - Infects macrophages
    - Infects helper T cells
    - T cell numbers fall
    - Immune system weakens (AIDS)
    alt: How HIV leads to AIDS by destroying helper T cells.
  activity:
    type: sort
    prompt: Innate or acquired immunity?
    bins:
    - Innate
    - Acquired
    items:
    - label: Skin
      bin: Innate
      clue: Is it there from birth and the same against every germ?
      why: 'A physical barrier: innate.'
    - label: Stomach acid
      bin: Innate
      clue: Does it target a particular germ?
      why: 'A physiological barrier: innate.'
    - label: Lysozyme in tears
      bin: Innate
      clue: Does it need to have met the germ before?
      why: Innate.
    - label: Neutrophils and macrophages eating germs
      bin: Innate
      clue: Do they recognise one specific germ?
      why: 'Cellular barriers: innate.'
    - label: Interferons from virus-infected cells
      bin: Innate
      clue: Do they protect nearby cells against any virus?
      why: 'Cytokine barrier: innate.'
    - label: Antibodies made by B cells
      bin: Acquired
      clue: Are they made for one particular antigen?
      why: 'Specific: acquired.'
    - label: Memory cells
      bin: Acquired
      clue: Do they remember a germ met before?
      why: Memory is the mark of acquired immunity.
    - label: A faster, stronger second response
      bin: Acquired
      clue: Why is the second meeting with a germ handled better?
      why: 'Memory cells: acquired.'
    - label: Vaccination
      bin: Acquired
      clue: Does it teach the body one specific germ?
      why: Active acquired immunity.
    - label: T cells killing infected cells
      bin: Acquired
      clue: Do they recognise a specific antigen?
      why: Cell-mediated acquired immunity.
  lesson:
    - teach: 'Innate immunity is present from birth: physical barriers (skin, mucus), physiological (stomach acid, tears, saliva), cellular (neutrophils, macrophages, natural killer cells) and cytokine barriers (interferons from virus-infected cells). Acquired immunity develops after meeting a pathogen and has memory: the second (secondary) response is faster and stronger than the first (primary).'
      check:
        prompt: Acid in the stomach is which barrier?
        options:
        - physiological
        - physical
        - cytokine
        answer: physiological
        why: It is a body secretion that kills microbes.
    - teach: 'B-lymphocytes make antibodies (humoral immunity); an antibody has 4 chains, H₂L₂, and types include IgA, IgM, IgE, IgG. T-lymphocytes give cell-mediated immunity, including graft rejection. Active immunity: the body makes its own antibodies (infection, vaccines). Passive immunity: ready-made antibodies are given (colostrum, anti-venom). Allergies involve IgE and histamine; autoimmunity is the body attacking itself (rheumatoid arthritis). Bone marrow and thymus are primary lymphoid organs; spleen, lymph nodes and MALT are secondary.'
      picture:
        kind: compare
        columns:
        - title: Active
          points:
          - body makes antibodies
          - slow to start
          - long-lasting
          - vaccine
        - title: Passive
          points:
          - antibodies given
          - immediate
          - short-lived
          - colostrum, anti-venom
        alt: Active and passive immunity compared.
      check:
        prompt: 'An anti-tetanus injection of ready antibodies gives:'
        options:
        - passive immunity
        - active immunity
        - innate immunity
        answer: passive immunity
        why: The antibodies were made elsewhere.
    - teach: AIDS is caused by HIV, a retrovirus that infects helper T cells and macrophages, slowly weakening immunity. It spreads by unprotected sex, infected blood, shared needles and from mother to child; it is diagnosed with ELISA and slowed by antiretroviral drugs. Cancer cells lose contact inhibition and divide without control; malignant tumours spread (metastasis). Drugs like opioids, cannabinoids and cocaine and alcohol harm health; adolescents need support, not blame, and early help.
      check:
        prompt: 'Normal cells stop dividing when they touch other cells. Cancer cells have lost this:'
        options:
        - contact inhibition
        - metastasis
        - immunity
        answer: contact inhibition
        why: So they pile up into tumours.
  items:
  - prompt: How many polypeptide chains does an antibody molecule have?
    answer: '4'
    check: 2+2
    difficulty: 1
    hints:
    - H₂L₂.
    - 2 heavy + 2 light.
    solution: '4.'
    mistakes: {"2": "b12_antibody", "3": "b12_antibody"}
  - prompt: 'Antibodies passed to a baby through colostrum give:'
    options:
    - passive immunity
    - active immunity
    - innate immunity
    - autoimmunity
    answer: passive immunity
    difficulty: 2
    hints:
    - Ready-made.
    - Baby doesn't make them.
    solution: Passive immunity.
    mistakes:
      active immunity: c12b_immunity
  - prompt: 'HIV mainly destroys:'
    options:
    - helper T lymphocytes
    - red blood cells
    - platelets
    - B cells only
    answer: helper T lymphocytes
    difficulty: 1
    hints:
    - CD4 cells.
    - Coordinate immunity.
    solution: Helper T lymphocytes.
    mistakes: {"red blood cells": "b12_hiv", "platelets": "b12_hiv", "B cells only": "b12_hiv"}
  - prompt: 'The test commonly used to diagnose HIV infection is:'
    options:
    - ELISA
    - Widal
    - Mantoux
    - biopsy
    answer: ELISA
    difficulty: 2
    hints:
    - Enzyme-linked.
    - Detects antibodies.
    solution: ELISA.
    mistakes: {"Widal": "b12_elisa", "Mantoux": "b12_elisa", "biopsy": "b12_elisa"}
  - prompt: 'The spread of cancer cells to other parts of the body is called:'
    options:
    - metastasis
    - contact inhibition
    - mitosis
    - immunity
    answer: metastasis
    difficulty: 1
    hints:
    - Malignant tumours.
    - Travel in blood.
    solution: Metastasis.
    mistakes: {"contact inhibition": "b12_metastasis", "mitosis": "b12_metastasis", "immunity": "b12_metastasis"}
  - prompt: 'Allergies are mainly due to the release of:'
    options:
    - histamine
    - insulin
    - interferon
    - thyroxine
    answer: histamine
    difficulty: 2
    hints:
    - Mast cells.
    - IgE.
    solution: Histamine.
    mistakes: {"insulin": "b12_histamine", "interferon": "b12_histamine", "thyroxine": "b12_histamine"}
  - prompt: 'Interferons are released by:'
    options:
    - virus-infected cells
    - bacteria
    - red blood cells
    answer: virus-infected cells
    difficulty: 2
    hints:
    - They are a cytokine barrier.
    - They protect nearby cells from a virus.
    solution: 'Step 1: infected cells signal. Step 2: protect neighbours.'
    mistakes:
      bacteria: c12b7_imm
      red blood cells: c12b7_imm
  - prompt: Which is a primary lymphoid organ?
    options:
    - thymus
    - spleen
    - lymph node
    answer: thymus
    difficulty: 1
    hints:
    - Primary organs are where lymphocytes mature.
    - T cells mature here.
    solution: 'Step 1: bone marrow and thymus are primary. Step 2: thymus.'
    mistakes:
      spleen: c12b7_imm
      lymph node: c12b7_imm
  - prompt: 'Rejection of a transplanted organ is mainly due to:'
    options:
    - T-lymphocytes
    - red blood cells
    - platelets
    answer: T-lymphocytes
    difficulty: 2
    hints:
    - It is cell-mediated immunity.
    - The cells recognise 'non-self'.
    solution: 'Step 1: cell-mediated response. Step 2: T cells.'
    mistakes:
      red blood cells: c12b7_imm
      platelets: c12b7_imm
  - prompt: A vaccine gives which kind of immunity?
    options:
    - active
    - passive
    - none
    answer: active
    difficulty: 1
    hints:
    - It contains weakened or inactivated pathogens or their parts.
    - Who makes the antibodies?
    solution: 'Step 1: the body responds and builds memory. Step 2: active.'
    mistakes:
      passive: c12b7_imm
      none: c12b7_imm
  - prompt: 'Rheumatoid arthritis is an example of:'
    options:
    - autoimmune disease
    - allergy
    - infectious disease
    answer: autoimmune disease
    difficulty: 2
    hints:
    - The immune system attacks the body's own joints.
    - Auto means self.
    solution: 'Step 1: self cells attacked. Step 2: autoimmune.'
    mistakes:
      allergy: c12b7_imm
      infectious disease: c12b7_imm
  - prompt: 'HIV is a retrovirus. Its genetic material is:'
    options:
    - RNA
    - DNA
    - protein
    answer: RNA
    difficulty: 2
    hints:
    - Retroviruses use reverse transcriptase.
    - They copy their genes back into DNA.
    solution: 'Step 1: reverse transcription RNA → DNA. Step 2: RNA.'
    mistakes:
      DNA: c12b7_imm
      protein: c12b7_imm
  - prompt: Which antibody is linked with allergies?
    options:
    - IgE
    - IgG
    - IgA
    answer: IgE
    difficulty: 2
    hints:
    - It triggers mast cells.
    - Mast cells release histamine.
    solution: 'Step 1: allergy response. Step 2: IgE.'
    mistakes:
      IgG: c12b7_imm
      IgA: c12b7_imm
  - prompt: 'Heroin (smack) is obtained from:'
    options:
    - poppy (Papaver somniferum)
    - hemp (Cannabis)
    - coca plant
    answer: poppy (Papaver somniferum)
    difficulty: 2
    hints:
    - It is an opioid.
    - Made from morphine.
    solution: 'Step 1: morphine from poppy latex. Step 2: poppy.'
    mistakes:
      hemp (Cannabis): c12b7_drug
      coca plant: c12b7_drug
  - prompt: 'A tumour that stays in one place and does not spread is:'
    options:
    - benign
    - malignant
    - metastatic
    answer: benign
    difficulty: 1
    hints:
    - It is the less harmful kind.
    - It does not invade other tissues.
    solution: 'Step 1: confined to its site. Step 2: benign.'
    mistakes:
      malignant: c12b7_imm
      metastatic: c12b7_imm
