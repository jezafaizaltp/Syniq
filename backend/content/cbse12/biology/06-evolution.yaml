# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse12-bio
chapter: 6
title: Evolution
tips:
  c12b_homo: "Ask: same origin or same use? Whale flippers and bat wings have the same bones but different jobs. Homo = same (origin); ana = similar (function)."
  c12b_hw: 'Hardy–Weinberg: p² + 2pq + q² = 1 when there is no mutation, migration, selection, drift or non-random mating.'
  b12_adaptive_radiation: "One ancestor spread into many forms for different foods on the Galápagos."
  b12_analogous: "Same function, different structure and origin = analogous."
  b12_drift: "Chance effects matter most in small populations."
  b12_fittest: "In evolution, 'fit' means leaving more offspring."
  b12_habilis: "'Habilis' means handy."
  b12_hardy: "p + q = 1."
  b12_lamarck: "The giraffe-neck idea of use and disuse came before Darwin."
  b12_melanism: "Soot darkened tree bark; dark moths were then hidden from birds."
  b12_miller: "Miller passed sparks through methane, ammonia, hydrogen and water: small building blocks formed."
  b12_pasteur: "Pasteur's swan-neck flasks stayed free of life."
  c12b6_organ: "Ask two things about the organs: do they share an origin, and do they share a use? Do the lines of descent move apart or come together?"
  c12b6_hw: 'In Hardy–Weinberg, p + q = 1 and p² + 2pq + q² = 1: p² and q² are the two homozygotes, 2pq the heterozygotes.'
  c12b6_idea: "Separate the thinkers by their key idea: use and disuse, natural selection, sudden mutations, or the chemical origin of life. Which idea is in the question?"
  c12b6_sel: Ask which individuals survive and reproduce more, and how that changes the next generation.
  c12b6_lam: Can a change gained during an animal's life be passed on through its gametes?
concepts:
- code: cbse12b.evo.origin
  title: Origin of life and evidence for evolution
  notes: |
    Origin of universe (Big Bang ~20 billion years per NCERT), Earth (~4.5 billion years). Theories: special creation,
    spontaneous generation (disproved by Pasteur), chemical evolution (Oparin–Haldane); Miller–Urey experiment (CH₄, NH₃, H₂,
    water vapour, electric discharge → amino acids). Evidence: palaeontological (fossils), comparative anatomy (homologous organs
    —forelimbs of whale, bat, cheetah, human; analogous—wings of butterfly and bird, eye of octopus and mammal), biochemical,
    adaptive radiation (Darwin's finches, Australian marsupials), industrial melanism (peppered moth), antibiotic and pesticide
    resistance.
  explanations:
    text: Life probably began from simple chemicals reacting in the early Earth's atmosphere and seas, as Miller's experiment suggested. Fossils, similar body structures and molecules in different organisms show that living things have changed over time and share common ancestors.
    visual: 'Draw the forelimbs of a human, a bat and a whale: the same set of bones arranged differently for grasping, flying and swimming. They''re homologous organs.'
    step_by_step: 'Step 1: Identify the evidence type (fossil, anatomy, molecular). Step 2: Same structure, different use → homologous (divergent). Step 3: Different structure, same use → analogous (convergent).'
    real_world: Bacteria becoming resistant to antibiotics is evolution happening in our lifetime, which is why doctors warn against overusing them.
  picture:
    kind: compare
    columns:
    - title: Organs
      points:
      - homologous
      - analogous
    - title: Origin and function
      points:
      - same origin, different function
      - different origin, same function
    - title: Example
      points:
      - forelimbs of whale and bat
      - wings of bird and butterfly
    alt: Homologous and analogous organs compared.
  activity:
    type: order
    prompt: Put these events in the order they happened.
    steps:
    - The Big Bang
    - The Earth forms (about 4.5 billion years ago)
    - The first cellular life appears in water
    - Invertebrates appear
    - Jawless fishes appear
    - Lobefins give rise to the first amphibians
    - Reptiles appear
    - Modern humans appear
    reasons:
      The Earth forms (about 4.5 billion years ago): The Earth formed long after the universe began.
      The first cellular life appears in water: Life needed the Earth, and its water, to exist first.
      Invertebrates appear: Many-celled animals came long after the first single cells.
      Jawless fishes appear: Vertebrates came after invertebrates.
      Lobefins give rise to the first amphibians: Fish had to exist before some could move onto land.
      Reptiles appear: Reptiles came from amphibian ancestors and laid shelled eggs on land.
      Modern humans appear: Homo sapiens came last, very recently.
  lesson:
    - teach: 'Early Earth had no free oxygen. Oparin and Haldane proposed that life arose by chemical evolution: simple molecules formed complex organic ones using energy from lightning and UV. Miller (1953) passed electric sparks through CH₄, NH₃, H₂ and water vapour and got amino acids. Pasteur''s swan-neck flask experiment disproved spontaneous generation of life from non-living matter.'
      picture:
        kind: flow
        steps:
        - simple gases + water
        - energy (lightning, UV)
        - organic molecules
        - first cell-like forms
        alt: Chemical evolution from simple gases to the first life forms.
      check:
        prompt: 'Miller''s experiment supported the idea of:'
        options:
        - chemical evolution
        - special creation
        - spontaneous generation
        answer: chemical evolution
        why: Organic molecules formed from simple gases.
      ways:
      - style: visual
        teach: 'Life from non-life: the chemical evolution idea, step by step.'
        picture:
          kind: flow
          steps:
          - 'Early air: CH₄, NH₃, H₂, water vapour, no free O₂'
          - Energy from lightning and UV
          - Simple organic molecules form
          - These join into larger molecules and, in time, the first cells
          alt: The early atmosphere had methane, ammonia, hydrogen and water vapour but no free oxygen. Lightning and UV supplied energy. Simple organic molecules formed, then joined into larger molecules and, in time, the first cells.
      - style: real_world
        teach: Pasteur's swan-neck flasks are still kept in Paris, and the broth in some has stayed clear for over a century. Dust and microbes get trapped in the bent neck, so nothing grows unless the neck is broken.
    - teach: 'Evidence for evolution: fossils in rock layers show changes over time. Homologous organs (forelimbs of whale, bat, cheetah and human) have the same basic bones but different uses: divergent evolution. Analogous organs (wings of butterfly and bird, eyes of octopus and mammal) do the same job but have different origins: convergent evolution.'
      picture:
        kind: compare
        columns:
        - title: Homologous
          points:
          - same origin
          - different use
          - whale flipper, bat wing
        - title: Analogous
          points:
          - different origin
          - same use
          - butterfly wing, bird wing
        alt: Homologous and analogous organs compared.
      check:
        prompt: 'Analogous organs are a result of:'
        options:
        - convergent evolution
        - divergent evolution
        - no evolution
        answer: convergent evolution
        why: Different lines arrive at similar solutions.
      ways:
      - style: step_by_step
        teach: 'Are a dog''s foreleg and a seal''s flipper homologous? Step 1: Look at the bones: both have humerus, radius-ulna, carpals and digits. Step 2: So they share an origin. Step 3: Their uses differ: running versus swimming. Step 4: Yes: homologous, showing divergent evolution.'
      - style: real_world
        teach: 'Sharks (fish) and dolphins (mammals) have the same streamlined body shape though they are not close relatives. Living in water shaped both the same way: convergent evolution giving analogous features.'
    - teach: 'Adaptive radiation is one ancestor spreading into many habitats and forming many species: Darwin''s finches on the Galapagos with different beaks, and Australian marsupials. Natural selection is seen today: dark peppered moths increased in soot-covered England (industrial melanism), and bacteria and insects become resistant to antibiotics and pesticides.'
      check:
        prompt: 'Antibiotic-resistant bacteria increase because:'
        options:
        - the antibiotic kills the non-resistant ones
        - the antibiotic creates resistance on purpose
        - bacteria learn
        answer: the antibiotic kills the non-resistant ones
        why: Resistant variants already present survive and multiply.
      ways:
      - style: visual
        teach: Peppered moths before and after soot covered the trees.
        picture:
          kind: compare
          columns:
          - title: Before industry
            points:
            - Light, lichen-covered bark
            - Light moths hidden
            - Light moths common
          - title: After industry
            points:
            - Bark darkened by soot
            - Dark moths hidden
            - Dark moths common
          alt: Before industry, tree bark was light and covered in lichen, so light moths were hidden and common. After industry, soot darkened the bark, so dark moths were hidden and became common.
      - style: real_world
        teach: When people stop an antibiotic course early, the few bacteria that resist it survive and multiply. Over time, whole strains become resistant. Doctors ask patients to finish the course to keep this natural selection from winning.
  items:
  - prompt: 'Miller''s experiment produced:'
    options:
    - amino acids
    - DNA
    - cells
    - proteins only
    answer: amino acids
    difficulty: 1
    hints:
    - From simple gases.
    - Electric sparks.
    solution: "Sparks passed through CH₄, NH₃, H₂ and water vapour produced simple organic molecules such as amino acids."
    mistakes: {"DNA": "b12_miller", "cells": "b12_miller", "proteins only": "b12_miller"}
  - prompt: 'Forelimbs of a whale and a bat are:'
    options:
    - homologous organs
    - analogous organs
    - vestigial organs
    - unrelated
    answer: homologous organs
    difficulty: 1
    hints:
    - Same bones.
    - Different uses.
    solution: "They have the same bone plan (from a common ancestor) but different uses: homologous organs."
    mistakes:
      analogous organs: c12b_homo
  - prompt: 'Wings of a butterfly and a bird are:'
    options:
    - analogous organs
    - homologous organs
    - vestigial organs
    - the same structure
    answer: analogous organs
    difficulty: 1
    hints:
    - Same job.
    - Different origin.
    solution: "They do the same job (flying) but are built differently, with different origins: analogous organs."
    mistakes: {"homologous organs": "b12_analogous", "vestigial organs": "b12_analogous", "the same structure": "b12_analogous"}
  - prompt: 'Darwin''s finches are an example of:'
    options:
    - adaptive radiation
    - convergent evolution
    - spontaneous generation
    - industrial melanism
    answer: adaptive radiation
    difficulty: 2
    hints:
    - Many forms from one ancestor.
    - Different beaks.
    solution: "From one ancestral finch many species evolved, each suited to a different food: adaptive radiation."
    mistakes: {"convergent evolution": "b12_adaptive_radiation", "spontaneous generation": "b12_adaptive_radiation", "industrial melanism": "b12_adaptive_radiation"}
  - prompt: Who disproved spontaneous generation?
    options:
    - Louis Pasteur
    - Charles Darwin
    - Stanley Miller
    - Oparin
    answer: Louis Pasteur
    difficulty: 2
    hints:
    - Swan-neck flasks.
    - Life from life.
    solution: "Pasteur showed that boiled broth in a swan-neck flask stayed free of microbes, so life comes only from existing life."
    mistakes: {"Charles Darwin": "b12_pasteur", "Stanley Miller": "b12_pasteur", "Oparin": "b12_pasteur"}
  - prompt: 'Dark moths becoming common in polluted England is called:'
    options:
    - industrial melanism
    - adaptive radiation
    - genetic drift
    - mutation pressure
    answer: industrial melanism
    difficulty: 2
    hints:
    - Soot-covered trees.
    - Peppered moth.
    solution: "Soot darkened tree trunks, so birds ate the light moths more; dark moths survived and increased: industrial melanism."
    mistakes: {"adaptive radiation": "b12_melanism", "genetic drift": "b12_melanism", "mutation pressure": "b12_melanism"}
  - prompt: Which gas was NOT used in Miller's experiment?
    options:
    - oxygen
    - methane
    - ammonia
    answer: oxygen
    difficulty: 2
    hints:
    - He copied the early atmosphere.
    - Early Earth had no free form of one gas.
    solution: 'Step 1: CH₄, NH₃, H₂, H₂O used. Step 2: no free O₂.'
    mistakes:
      methane: c12b6_idea
      ammonia: c12b6_idea
  - prompt: 'Homologous organs show:'
    options:
    - divergent evolution
    - convergent evolution
    - special creation
    answer: divergent evolution
    difficulty: 1
    hints:
    - Same ancestor, different uses.
    - The lines spread apart.
    solution: 'Step 1: one origin, many uses. Step 2: divergent evolution.'
    mistakes:
      convergent evolution: c12b6_organ
      special creation: c12b6_organ
  - prompt: 'Eyes of an octopus and a mammal are:'
    options:
    - analogous
    - homologous
    - vestigial
    answer: analogous
    difficulty: 2
    hints:
    - They see in similar ways.
    - But they developed in unrelated lines.
    solution: 'Step 1: same function, different origin. Step 2: analogous.'
    mistakes:
      homologous: c12b6_organ
      vestigial: c12b6_organ
  - prompt: 'Thorns of Bougainvillea and tendrils of Cucurbita are:'
    options:
    - homologous
    - analogous
    - unrelated
    answer: homologous
    difficulty: 3
    hints:
    - Both grow from the same position on the stem.
    - 'Their uses differ: defence and climbing.'
    solution: 'Step 1: both modified axillary structures. Step 2: homologous.'
    mistakes:
      analogous: c12b6_organ
      unrelated: c12b6_organ
  - prompt: 'Australian marsupials evolving into many forms is an example of:'
    options:
    - adaptive radiation
    - industrial melanism
    - spontaneous generation
    answer: adaptive radiation
    difficulty: 1
    hints:
    - One ancestor, many habitats.
    - Like Darwin's finches.
    solution: 'Step 1: spread into many niches. Step 2: adaptive radiation.'
    mistakes:
      industrial melanism: c12b6_idea
      spontaneous generation: c12b6_idea
  - prompt: 'Pasteur showed that life comes only from:'
    options:
    - pre-existing life
    - rotting matter
    - air alone
    answer: pre-existing life
    difficulty: 1
    hints:
    - Sterilised broth stayed clear in a swan-neck flask.
    - Microbes had to get in from outside.
    solution: 'Step 1: no microbes reached the broth. Step 2: life from life.'
    mistakes:
      rotting matter: c12b6_idea
      air alone: c12b6_idea
  - prompt: Before industrialisation, which peppered moths were more common in England?
    options:
    - light-coloured
    - dark-coloured
    - both equally
    answer: light-coloured
    difficulty: 2
    hints:
    - Tree trunks were covered with pale lichen.
    - Birds catch moths that stand out.
    solution: 'Step 1: pale moths hidden on pale bark. Step 2: light-coloured.'
    mistakes:
      dark-coloured: c12b6_idea
      both equally: c12b6_idea
  - prompt: About how old is the Earth, in billion years?
    answer: '4.5'
    check: Rational(9,2)
    difficulty: 1
    hints:
    - Much younger than the universe.
    - Between 4 and 5 billion years.
    solution: 'Step 1: dated from rocks and meteorites. Step 2: about 4.5 billion years.'
    mistakes:
      '20': c12b6_idea
      '2': c12b6_idea
  - prompt: 'Fossils are mostly found in:'
    options:
    - sedimentary rocks
    - volcanic lava only
    - the Earth's core
    answer: sedimentary rocks
    difficulty: 1
    hints:
    - Layers settle over time.
    - Each layer marks an age.
    solution: 'Step 1: remains buried in layers. Step 2: sedimentary rocks.'
    mistakes:
      volcanic lava only: c12b6_idea
      the Earth's core: c12b6_idea
  - prompt: 'Assertion (A): The wings of a bat and the wings of a housefly are analogous organs.

      Reason (R): Analogous organs perform the same function but have different structures and origins.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both wings are for flight, but a bat wing is a modified forelimb with bones while an insect wing has no bones. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: After years of spraying the same pesticide, a farmer finds it no longer kills the pests. What explains this?'
    options:
    - The few resistant pests survived and multiplied
    - The pests learned to avoid the spray in their lifetime
    - The pesticide changed chemically
    answer: The few resistant pests survived and multiplied
    hints:
    - Were all the pests identical at the start?
    - Which ones left offspring?
    solution: 'A few pests already carried resistance. Spraying killed the others, so resistant ones bred and their trait spread: natural selection.'
    mistakes:
      The pests learned to avoid the spray in their lifetime: c12b6_lam
      The pesticide changed chemically: c12b6_sel
    exam: case
    difficulty: 2
  - prompt: 'Sweet potato (a root) and potato (a stem) are both used to store food. These organs are:'
    options:
    - Analogous
    - Homologous
    - Vestigial
    answer: Analogous
    hints:
    - 'Same job: storage.'
    - Same origin? A root versus a stem.
    solution: They do the same job but come from different organs (root versus stem), so they are analogous.
    mistakes:
      Homologous: c12b6_organ
      Vestigial: c12b6_organ
    exam: competency
    difficulty: 2
- code: cbse12b.evo.mechanism
  title: Mechanisms of evolution and human evolution
  after:
  - cbse12b.evo.origin
  notes: |
    Lamarckism (use and disuse; inheritance of acquired characters—rejected). Darwinism: overproduction, variation, struggle for
    existence, natural selection, survival of the fittest (fitness = reproductive success). de Vries: mutation (saltation).
    Hardy–Weinberg principle p² + 2pq + q² = 1; factors disturbing it: gene flow, genetic drift (founder effect), mutation,
    recombination, natural selection (stabilising, directional, disruptive). Human evolution: Dryopithecus, Ramapithecus,
    Australopithecus, Homo habilis, Homo erectus, Neanderthal man, Homo sapiens (Africa, ~75,000–10,000 years ago spread).
  explanations:
    text: 'Darwin explained evolution by natural selection: individuals vary, more are born than survive, and those best suited to their surroundings survive and reproduce more. Over many generations, populations change. Humans evolved over millions of years from ape-like ancestors in Africa.'
    visual: Draw a population of beetles, green and brown, on brown soil. Birds spot and eat the green ones, so brown beetles leave more offspring, and the population becomes mostly brown.
    step_by_step: 'Step 1: Variation exists. Step 2: More offspring than can survive. Step 3: Best-suited survive and reproduce. Step 4: Their traits become common. Step 5: For Hardy–Weinberg, use p + q = 1.'
    real_world: Hospitals rotate antibiotics because natural selection quickly favours resistant bacteria.
  picture:
    kind: flow
    steps:
    - Dryopithecus
    - Australopithecus
    - Homo habilis
    - Homo erectus
    - Homo sapiens
    alt: A simplified sequence of human evolution.
  activity:
    type: sort
    prompt: Whose idea is it?
    bins:
    - Lamarck
    - Darwin
    - Hugo de Vries
    items:
    - label: Use and disuse of organs
      bin: Lamarck
      clue: Organs grow with use and shrink without it. Whose idea?
      why: Lamarck's.
    - label: Characters gained in life are inherited
      bin: Lamarck
      clue: Can stretching your neck change your children? Whose idea said yes?
      why: 'Lamarck: later rejected.'
    - label: Giraffes got long necks by stretching for leaves
      bin: Lamarck
      clue: Whose famous example?
      why: Lamarck's.
    - label: Natural selection
      bin: Darwin
      clue: The best-suited survive and breed more. Whose idea?
      why: Darwin (and Wallace).
    - label: Survival of the fittest
      bin: Darwin
      clue: Fitness means leaving more offspring. Whose theory?
      why: Darwin's.
    - label: Small, gradual variations add up over time
      bin: Darwin
      clue: Slow, continuous change. Whose view?
      why: Darwin.
    - label: Branching descent from common ancestors
      bin: Darwin
      clue: Whose tree of life?
      why: Darwin.
    - label: 'Mutations: large, sudden changes (saltation)'
      bin: Hugo de Vries
      clue: Big jumps, not small steps. Whose idea?
      why: de Vries.
    - label: Studied the evening primrose
      bin: Hugo de Vries
      clue: Whose plant showed sudden new forms?
      why: de Vries, on Oenothera.
  lesson:
    - teach: 'Lamarck said organs grow with use and shrink with disuse, and that acquired characters are inherited (e.g. giraffe necks); this was rejected. Darwin''s natural selection: organisms overproduce, vary, and struggle for existence; those best suited survive and reproduce more, so their traits spread. Fitness means reproductive success. de Vries added mutation: large sudden changes (saltation) in Oenothera.'
      check:
        prompt: 'In Darwin''s sense, ''fitness'' means:'
        options:
        - leaving more offspring
        - being physically strongest
        - living longest
        answer: leaving more offspring
        why: Traits spread only if they are passed on.
      ways:
      - style: visual
        teach: Lamarck and Darwin explain the long giraffe neck differently.
        picture:
          kind: compare
          columns:
          - title: Lamarck
            points:
            - Giraffes stretched their necks
            - Stretched necks passed on
            - 'Rejected: acquired traits aren''t inherited'
          - title: Darwin
            points:
            - Neck length varied naturally
            - Longer-necked ones fed and bred more
            - Their offspring inherited long necks
          alt: Lamarck said giraffes stretched their necks and passed the stretched necks on, an idea rejected because acquired traits are not inherited. Darwin said neck length varied naturally, longer-necked giraffes fed and bred more, and their offspring inherited long necks.
      - style: real_world
        teach: A bodybuilder's big muscles are not passed to their children; the muscle came from exercise, not from changed genes. This everyday fact is why Lamarck's idea of inherited acquired traits was rejected.
    - teach: 'Hardy–Weinberg: in a large, randomly mating population with no outside forces, allele frequencies stay constant. If p and q are allele frequencies, p + q = 1 and genotype frequencies are p² + 2pq + q² = 1. Gene flow, genetic drift (the founder effect in small groups), mutation, recombination and natural selection change these frequencies, which is evolution.'
      picture:
        kind: bars
        bars:
        - label: AA (p²)
          value: 49
        - label: Aa (2pq)
          value: 42
        - label: aa (q²)
          value: 9
        alt: Genotype percentages for p = 0.7 and q = 0.3.
      check:
        prompt: If q² = 0.04, what is q?
        options:
        - '0.2'
        - '0.04'
        - '0.4'
        answer: '0.2'
        why: q is the square root of q².
      ways:
      - style: step_by_step
        teach: 'Hardy–Weinberg with q² = 0.09. Step 1: q = √0.09 = 0.3. Step 2: p = 1 − 0.3 = 0.7. Step 3: p² = 0.49. Step 4: So 49% are expected to be homozygous dominant in an unchanging population.'
      - style: real_world
        teach: 'Some isolated communities, founded by a few families, have a much higher rate of certain inherited conditions than the wider population. This founder effect is genetic drift: chance, not selection, shaped their gene pool.'
    - teach: 'Natural selection can be stabilising (favours the middle), directional (favours one extreme) or disruptive (favours both extremes). Human evolution: Dryopithecus and Ramapithecus (~15 million years ago), Australopithecus (Africa, stone weapons), Homo habilis (~2 million years ago, brain 650–800 cc), Homo erectus (~900 cc, ate meat), Neanderthal man (~1400 cc, buried the dead), Homo sapiens (Africa, spread across continents).'
      picture:
        kind: flow
        steps:
        - Dryopithecus
        - Australopithecus
        - Homo habilis
        - Homo erectus
        - Neanderthal man
        - Homo sapiens
        alt: Main stages in human evolution in order.
      check:
        prompt: 'Selection that favours both extremes is:'
        options:
        - disruptive
        - stabilising
        - directional
        answer: disruptive
        why: The middle loses out and the population splits.
      ways:
      - style: real_world
        teach: 'Birds with medium-sized clutches tend to raise the most chicks; too few eggs waste the season, too many starve. That keeps clutch size near the middle: stabilising selection.'
      - style: step_by_step
        teach: 'Spot the type of selection. Step 1: Medium values favoured? Stabilising. Step 2: One extreme favoured and the average shifts? Directional. Step 3: Both extremes favoured over the middle? Disruptive. Step 4: Match the graph''s shape to the step that fits.'
  items:
  - prompt: In a population, q (recessive allele frequency) = 0.3. Find p as a fraction.
    answer: 7/10
    check: 1-Rational(3,10)
    difficulty: 1
    hints:
    - p + q = 1.
    - 1 − 0.3.
    solution: "p + q = 1, so p = 1 − 0.3 = 0.7 = 7/10."
    mistakes: {"3/10": "b12_hardy", "9/100": "b12_hardy"}
  - prompt: With p = 0.7 and q = 0.3, find the frequency of heterozygotes (2pq) as a fraction.
    answer: 21/50
    check: 2*Rational(7,10)*Rational(3,10)
    difficulty: 2
    hints:
    - 2 × 0.7 × 0.3.
    - 0.42.
    solution: "2pq = 2 × 0.7 × 0.3 = 0.42 = 21/50."
    mistakes:
      21/100: c12b_hw
  - prompt: '''Survival of the fittest'' really means survival and:'
    options:
    - "more reproduction by the best-suited"
    - "victory of the strongest only"
    - "growth of the biggest only"
    - "long life of the oldest only"
    answer: more reproduction by the best-suited
    difficulty: 2
    hints:
    - Fitness = offspring.
    - Not just strength.
    solution: Greater reproductive success of the best-suited.
    mistakes: {"victory of the strongest only": "b12_fittest", "growth of the biggest only": "b12_fittest", "long life of the oldest only": "b12_fittest"}
  - prompt: 'The idea that acquired characters are inherited was proposed by:'
    options:
    - Lamarck
    - Darwin
    - de Vries
    - Mendel
    answer: Lamarck
    difficulty: 1
    hints:
    - Giraffe necks.
