# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse12-bio
chapter: 6
title: Evolution
tips:
  c12b_homo: "Ask: same origin or same use? Whale flippers and bat wings have the same bones but different jobs. Homo = same (origin); ana = similar (function)."
  c12b_hw: 'Hardy–Weinberg: p² + 2pq + q² = 1 when there is no mutation, migration, selection, drift or non-random mating.'
  b12_adaptive_radiation: "One ancestor spread into many forms for different foods on the Galápagos."
  b12_analogous: "Same function, different structure and origin = analogous."
  b12_drift: "Chance effects matter most in small populations."
  b12_fittest: "In evolution, 'fit' means leaving more offspring."
  b12_habilis: "'Habilis' means handy."
  b12_hardy: "p + q = 1."
  b12_lamarck: "The giraffe-neck idea of use and disuse came before Darwin."
  b12_melanism: "Soot darkened tree bark; dark moths were then hidden from birds."
  b12_miller: "Miller passed sparks through methane, ammonia, hydrogen and water: small building blocks formed."
  b12_pasteur: "Pasteur's swan-neck flasks stayed free of life."
concepts:
- code: cbse12b.evo.origin
  title: Origin of life and evidence for evolution
  notes: |
    Origin of universe (Big Bang ~20 billion years per NCERT), Earth (~4.5 billion years). Theories: special creation,
    spontaneous generation (disproved by Pasteur), chemical evolution (Oparin–Haldane); Miller–Urey experiment (CH₄, NH₃, H₂,
    water vapour, electric discharge → amino acids). Evidence: palaeontological (fossils), comparative anatomy (homologous organs
    —forelimbs of whale, bat, cheetah, human; analogous—wings of butterfly and bird, eye of octopus and mammal), biochemical,
    adaptive radiation (Darwin's finches, Australian marsupials), industrial melanism (peppered moth), antibiotic and pesticide
    resistance.
  explanations:
    text: Life probably began from simple chemicals reacting in the early Earth's atmosphere and seas, as Miller's experiment suggested. Fossils, similar body structures and molecules in different organisms show that living things have changed over time and share common ancestors.
    visual: 'Draw the forelimbs of a human, a bat and a whale: the same set of bones arranged differently for grasping, flying and swimming. They''re homologous organs.'
    step_by_step: 'Step 1: Identify the evidence type (fossil, anatomy, molecular). Step 2: Same structure, different use → homologous (divergent). Step 3: Different structure, same use → analogous (convergent).'
    real_world: Bacteria becoming resistant to antibiotics is evolution happening in our lifetime, which is why doctors warn against overusing them.
  picture:
    kind: compare
    columns:
    - title: Organs
      points:
      - homologous
      - analogous
    - title: Origin and function
      points:
      - same origin, different function
      - different origin, same function
    - title: Example
      points:
      - forelimbs of whale and bat
      - wings of bird and butterfly
    alt: Homologous and analogous organs compared.
  activity:
    type: order
    prompt: Put these events in the order they happened.
    steps:
    - The Big Bang
    - The Earth forms (about 4.5 billion years ago)
    - The first cellular life appears in water
    - Invertebrates appear
    - Jawless fishes appear
    - Lobefins give rise to the first amphibians
    - Reptiles appear
    - Modern humans appear
    reasons:
      The Earth forms (about 4.5 billion years ago): The Earth formed long after the universe began.
      The first cellular life appears in water: Life needed the Earth, and its water, to exist first.
      Invertebrates appear: Many-celled animals came long after the first single cells.
      Jawless fishes appear: Vertebrates came after invertebrates.
      Lobefins give rise to the first amphibians: Fish had to exist before some could move onto land.
      Reptiles appear: Reptiles came from amphibian ancestors and laid shelled eggs on land.
      Modern humans appear: Homo sapiens came last, very recently.
  items:
  - prompt: 'Miller''s experiment produced:'
    options:
    - amino acids
    - DNA
    - cells
    - proteins only
    answer: amino acids
    difficulty: 1
    hints:
    - From simple gases.
    - Electric sparks.
    solution: Amino acids.
    mistakes: {"DNA": "b12_miller", "cells": "b12_miller", "proteins only": "b12_miller"}
  - prompt: 'Forelimbs of a whale and a bat are:'
    options:
    - homologous organs
    - analogous organs
    - vestigial organs
    - unrelated
    answer: homologous organs
    difficulty: 1
    hints:
    - Same bones.
    - Different uses.
    solution: Homologous organs.
    mistakes:
      analogous organs: c12b_homo
  - prompt: 'Wings of a butterfly and a bird are:'
    options:
    - analogous organs
    - homologous organs
    - vestigial organs
    - the same structure
    answer: analogous organs
    difficulty: 1
    hints:
    - Same job.
    - Different origin.
    solution: Analogous organs.
    mistakes: {"homologous organs": "b12_analogous", "vestigial organs": "b12_analogous", "the same structure": "b12_analogous"}
  - prompt: 'Darwin''s finches are an example of:'
    options:
    - adaptive radiation
    - convergent evolution
    - spontaneous generation
    - industrial melanism
    answer: adaptive radiation
    difficulty: 2
    hints:
    - Many forms from one ancestor.
    - Different beaks.
    solution: Adaptive radiation.
    mistakes: {"convergent evolution": "b12_adaptive_radiation", "spontaneous generation": "b12_adaptive_radiation", "industrial melanism": "b12_adaptive_radiation"}
  - prompt: Who disproved spontaneous generation?
    options:
    - Louis Pasteur
    - Charles Darwin
    - Stanley Miller
    - Oparin
    answer: Louis Pasteur
    difficulty: 2
    hints:
    - Swan-neck flasks.
    - Life from life.
    solution: Louis Pasteur.
    mistakes: {"Charles Darwin": "b12_pasteur", "Stanley Miller": "b12_pasteur", "Oparin": "b12_pasteur"}
  - prompt: 'Dark moths becoming common in polluted England is called:'
    options:
    - industrial melanism
    - adaptive radiation
    - genetic drift
    - mutation pressure
    answer: industrial melanism
    difficulty: 2
    hints:
    - Soot-covered trees.
    - Peppered moth.
    solution: Industrial melanism.
    mistakes: {"adaptive radiation": "b12_melanism", "genetic drift": "b12_melanism", "mutation pressure": "b12_melanism"}
- code: cbse12b.evo.mechanism
  title: Mechanisms of evolution and human evolution
  after:
  - cbse12b.evo.origin
  notes: |
    Lamarckism (use and disuse; inheritance of acquired characters—rejected). Darwinism: overproduction, variation, struggle for
    existence, natural selection, survival of the fittest (fitness = reproductive success). de Vries: mutation (saltation).
    Hardy–Weinberg principle p² + 2pq + q² = 1; factors disturbing it: gene flow, genetic drift (founder effect), mutation,
    recombination, natural selection (stabilising, directional, disruptive). Human evolution: Dryopithecus, Ramapithecus,
    Australopithecus, Homo habilis, Homo erectus, Neanderthal man, Homo sapiens (Africa, ~75,000–10,000 years ago spread).
  explanations:
    text: 'Darwin explained evolution by natural selection: individuals vary, more are born than survive, and those best suited to their surroundings survive and reproduce more. Over many generations, populations change. Humans evolved over millions of years from ape-like ancestors in Africa.'
    visual: Draw a population of beetles, green and brown, on brown soil. Birds spot and eat the green ones, so brown beetles leave more offspring, and the population becomes mostly brown.
    step_by_step: 'Step 1: Variation exists. Step 2: More offspring than can survive. Step 3: Best-suited survive and reproduce. Step 4: Their traits become common. Step 5: For Hardy–Weinberg, use p + q = 1.'
    real_world: Hospitals rotate antibiotics because natural selection quickly favours resistant bacteria.
  picture:
    kind: flow
    steps:
    - Dryopithecus
    - Australopithecus
    - Homo habilis
    - Homo erectus
    - Homo sapiens
    alt: A simplified sequence of human evolution.
  activity:
    type: sort
    prompt: Whose idea is it?
    bins:
    - Lamarck
    - Darwin
    - Hugo de Vries
    items:
    - label: Use and disuse of organs
      bin: Lamarck
      clue: Organs grow with use and shrink without it. Whose idea?
      why: Lamarck's.
    - label: Characters gained in life are inherited
      bin: Lamarck
      clue: Can stretching your neck change your children? Whose idea said yes?
      why: 'Lamarck: later rejected.'
    - label: Giraffes got long necks by stretching for leaves
      bin: Lamarck
      clue: Whose famous example?
      why: Lamarck's.
    - label: Natural selection
      bin: Darwin
      clue: The best-suited survive and breed more. Whose idea?
      why: Darwin (and Wallace).
    - label: Survival of the fittest
      bin: Darwin
      clue: Fitness means leaving more offspring. Whose theory?
      why: Darwin's.
    - label: Small, gradual variations add up over time
      bin: Darwin
      clue: Slow, continuous change. Whose view?
      why: Darwin.
    - label: Branching descent from common ancestors
      bin: Darwin
      clue: Whose tree of life?
      why: Darwin.
    - label: 'Mutations: large, sudden changes (saltation)'
      bin: Hugo de Vries
      clue: Big jumps, not small steps. Whose idea?
      why: de Vries.
    - label: Studied the evening primrose
      bin: Hugo de Vries
      clue: Whose plant showed sudden new forms?
      why: de Vries, on Oenothera.
  items:
  - prompt: In a population, q (recessive allele frequency) = 0.3. Find p as a fraction.
    answer: 7/10
    check: 1-Rational(3,10)
    difficulty: 1
    hints:
    - p + q = 1.
    - 1 − 0.3.
    solution: 0.7.
    mistakes: {"3/10": "b12_hardy", "9/100": "b12_hardy"}
  - prompt: With p = 0.7 and q = 0.3, find the frequency of heterozygotes (2pq) as a fraction.
    answer: 21/50
    check: 2*Rational(7,10)*Rational(3,10)
    difficulty: 2
    hints:
    - 2 × 0.7 × 0.3.
    - 0.42.
    solution: 0.42.
    mistakes:
      21/100: c12b_hw
  - prompt: '''Survival of the fittest'' really means survival and:'
    options:
    - more reproduction by the best-suited
    - the strongest only
    - the biggest only
    - the oldest
    answer: more reproduction by the best-suited
    difficulty: 2
    hints:
    - Fitness = offspring.
    - Not just strength.
    solution: Greater reproductive success of the best-suited.
    mistakes: {"the strongest only": "b12_fittest", "the biggest only": "b12_fittest", "the oldest": "b12_fittest"}
  - prompt: 'The idea that acquired characters are inherited was proposed by:'
    options:
    - Lamarck
    - Darwin
    - de Vries
    - Mendel
    answer: Lamarck
    difficulty: 1
    hints:
    - Giraffe necks.
    - Use and disuse.
    solution: Lamarck.
    mistakes: {"Darwin": "b12_lamarck", "de Vries": "b12_lamarck", "Mendel": "b12_lamarck"}
  - prompt: Which early human was the first to make stone tools (handy man)?
    options:
    - Homo habilis
    - Homo erectus
    - Australopithecus
    - Neanderthal
    answer: Homo habilis
    difficulty: 2
    hints:
    - Habilis = handy.
    - ~2 million years ago.
    solution: Homo habilis.
    mistakes: {"Homo erectus": "b12_habilis", "Australopithecus": "b12_habilis", "Neanderthal": "b12_habilis"}
  - prompt: 'A sudden change in allele frequency by chance in a small population is:'
    options:
    - genetic drift
    - natural selection
    - gene flow
    - mutation
    answer: genetic drift
    difficulty: 2
    hints:
    - Random.
    - Founder effect.
    solution: Genetic drift.
    mistakes: {"natural selection": "b12_drift", "gene flow": "b12_drift", "mutation": "b12_drift"}
