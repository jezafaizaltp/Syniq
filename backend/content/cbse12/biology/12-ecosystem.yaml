# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 12. Format: content/README.md.
subject: cbse12-bio
chapter: 12
title: Ecosystem
tips:
  c12b_ten: '10% law: only about 10% of energy passes from one trophic level to the next.'
  c12b_pyramid: Pyramids of energy are always upright. Pyramids of biomass can be inverted (sea), and pyramids of number too (one tree, many insects).
concepts:
- code: cbse12b.eco.energy
  title: Structure, productivity and energy flow
  notes: |
    Ecosystem: biotic and abiotic components; stratification. Productivity: gross primary productivity (GPP), net primary
    productivity NPP = GPP − R; secondary productivity; annual NPP of biosphere ~170 billion tonnes (oceans ~55 billion).
    Decomposition: fragmentation (detritivores like earthworm), leaching, catabolism, humification, mineralisation; faster in warm,
    moist, aerobic conditions. Energy flow: unidirectional; only ~2–10% of PAR captured; food chains (grazing and detritus), food
    webs; trophic levels; 10% law. Ecological pyramids: number, biomass, energy (always upright); limitations.
  explanations:
    text: An ecosystem is living things together with their non-living surroundings. Energy from the Sun flows one way through food chains, with only about 10% passing from each level to the next. Decomposers recycle nutrients from dead matter.
    visual: 'Draw a pyramid: 10,000 J in plants at the base, 1,000 J in herbivores, 100 J in carnivores, 10 J in top carnivores. Each step keeps about a tenth.'
    step_by_step: 'Step 1: Identify producers, consumers and decomposers. Step 2: Apply the 10% law up each level. Step 3: NPP = GPP − respiration. Step 4: Energy pyramids are always upright.'
    real_world: Eating lower on the food chain (more plant food) uses far less land and energy than eating meat.
  picture:
    kind: bars
    bars:
    - label: producers
      value: 10000
    - label: herbivores
      value: 1000
    - label: carnivores
      value: 100
    - label: top carnivores
      value: 10
    alt: 'A pyramid of energy following the 10% law: 10,000, 1,000, 100 and 10 joules.'
    unit: J
  activity:
    type: formula
    prompt: Plants fix GPP; they burn some in respiration R. What's left, NPP = GPP − R, is food for herbivores, who keep about 10% of it.
    inputs:
    - name: gpp
      label: GPP
      min: 0
      max: 1000
      step: 10
      start: 0
    - name: r
      label: Plants' respiration R
      min: 0
      max: 1000
      step: 10
      start: 0
    outputs:
    - name: npp
      label: NPP = GPP − R
      expr: gpp-r
    - name: herb
      label: Herbivores (10% of NPP)
      expr: (gpp-r)*0.1
      places: 1
    goals:
    - prompt: GPP is 800 units and NPP is 500. Set R.
      want:
        gpp: 800
        npp: 500
      mistakes:
      - when:
          gpp: 800
          r: 500
        say: '500 is the NPP. R is what the plants burn: GPP − NPP.'
    - prompt: Herbivores need 40 units. The plants' R is 200. Set GPP.
      want:
        r: 200
        herb: 40
      mistakes:
      - when:
          r: 200
          gpp: 400
        say: 'That makes NPP only 200, and herbivores get 20. Herbivores eat from NPP, after R is spent: NPP must be 400.'
      - when:
          r: 200
          gpp: 40
        say: 40 units is the herbivores' share, only 10% of NPP.
    - prompt: 'Make NPP 0: plants burning everything they fix, with GPP 600.'
      want:
        gpp: 600
        npp: 0
      mistakes:
      - when:
          gpp: 600
          npp:
          - 10
          - 600
        say: NPP is still positive. R must equal GPP.
  items:
  - prompt: Plants capture 10,000 J. How much energy (J) reaches the carnivores that eat the herbivores?
    answer: '100'
    check: 10000*Rational(1,10)**2
    difficulty: 1
    hints:
    - 10% each step.
    - 10000 → 1000 → 100.
    solution: 100 J.
    mistakes:
      '1000': c12b_ten
  - prompt: GPP is 500 units and respiration uses 200 units. Find NPP.
    answer: '300'
    check: 500-200
    difficulty: 1
    hints:
    - GPP − R.
    - 500 − 200.
    solution: 300 units.
  - prompt: About how many billion tonnes is the annual NPP of the whole biosphere?
    answer: '170'
    check: '170'
    difficulty: 2
    hints:
    - Oceans are about 55.
    - Total.
    solution: About 170 billion tonnes.
  - prompt: Which ecological pyramid is always upright?
    options:
    - pyramid of energy
    - pyramid of biomass
    - pyramid of numbers
    - none
    answer: pyramid of energy
    difficulty: 2
    hints:
    - Energy is lost at each level.
    - Can't increase.
    solution: The pyramid of energy.
    mistakes:
      pyramid of biomass: c12b_pyramid
  - prompt: 'Energy flow in an ecosystem is:'
    options:
    - unidirectional
    - cyclic
    - random
    - two-way
    answer: unidirectional
    difficulty: 1
    hints:
    - Sun → producers → consumers.
    - Lost as heat.
    solution: One-way.
  - prompt: 'Decomposition is fastest in conditions that are:'
    options:
    - warm and moist
    - cold and dry
    - frozen
    - oxygen-free
    answer: warm and moist
    difficulty: 2
    hints:
    - Microbes active.
    - Tropical.
    solution: Warm and moist.
- code: cbse12b.eco.succession
  title: Ecological succession and nutrient cycles
  after:
  - cbse12b.eco.energy
  notes: |
    Ecological succession: gradual, predictable change in species composition; pioneer species (lichens on rock, phytoplankton in
    water), seral stages, climax community. Primary succession (bare rock, new pond) and secondary (abandoned farm, after fire);
    hydrarch and xerarch, both reach mesic climax. Nutrient (biogeochemical) cycles: gaseous (carbon, nitrogen) and sedimentary
    (phosphorus, sulfur). Carbon cycle: ~71% of carbon dissolved in oceans; photosynthesis fixes 4 × 10¹³ kg/year; human impact
    (fossil fuels, deforestation). Phosphorus cycle: weathering of rocks; no respiratory release. Ecosystem services (Robert
    Costanza estimated about US$33 trillion a year).
  explanations:
    text: Ecosystems change over time in a predictable sequence called succession, from pioneer species like lichens on bare rock to a stable climax community like a forest. Nutrients like carbon and phosphorus cycle between living things and the environment.
    visual: Draw bare rock → lichens → mosses → grasses → shrubs → trees. Each stage changes the soil and conditions for the next.
    step_by_step: 'Step 1: Primary (no soil) or secondary (soil present)? Step 2: Name the pioneer species. Step 3: Trace stages to the climax. Step 4: For cycles, identify the reservoir (air or rocks).'
    real_world: Forests, wetlands and coral reefs provide free 'services' like clean water and pollination, worth trillions of dollars a year.
  picture:
    kind: flow
    steps:
    - Bare rock
    - Lichens (pioneers)
    - Mosses
    - Grasses and shrubs
    - Climax forest
    alt: Primary succession on bare rock, from lichens to a climax forest.
  activity:
    type: order
    prompt: 'Hydrarch succession: put the stages in order, from open water to forest.'
    steps:
    - Phytoplankton in open water
    - Submerged plants (rooted)
    - Floating plants
    - Reed swamp
    - Marsh meadow (sedges, grasses)
    - Shrubs
    - 'Forest: the climax community'
    reasons:
      Submerged plants (rooted): Pioneer plankton add organic matter first, so rooted plants can take hold in the mud.
      Floating plants: As silt builds up and the water gets shallower, floating plants follow.
      Reed swamp: Reeds need much shallower water, so they come after the floating stage.
      Marsh meadow (sedges, grasses): The swamp fills in and becomes wet land.
      Shrubs: Shrubs need drier, firmer soil.
      'Forest: the climax community': Trees come last, once soil has built up.
  items:
  - prompt: 'The first organisms to colonise bare rock are usually:'
    options:
    - lichens
    - trees
    - grasses
    - shrubs
    answer: lichens
    difficulty: 1
    hints:
    - Pioneer species.
    - Break down rock.
    solution: Lichens.
  - prompt: 'Succession on an abandoned farm is:'
    options:
    - secondary succession
    - primary succession
    - no succession
    - climax only
    answer: secondary succession
    difficulty: 2
    hints:
    - Soil already present.
    - Faster.
    solution: Secondary succession.
  - prompt: Which nutrient cycle has no gaseous phase in the atmosphere?
    options:
    - phosphorus
    - carbon
    - nitrogen
    - oxygen
    answer: phosphorus
    difficulty: 2
    hints:
    - Sedimentary.
    - Rocks.
    solution: Phosphorus.
  - prompt: About what percentage of the Earth's carbon is dissolved in the oceans?
    answer: '71'
    check: '71'
    difficulty: 2
    hints:
    - Most of it.
    - Seventy-one.
    solution: About 71%.
  - prompt: 'The final stable community in succession is the:'
    options:
    - climax community
    - pioneer community
    - seral stage
    - detritus
    answer: climax community
    difficulty: 1
    hints:
    - End point.
    - Stable.
    solution: The climax community.
  - prompt: 'Burning fossil fuels mainly affects the:'
    options:
    - carbon cycle
    - phosphorus cycle
    - water table only
    - sulfur cycle only
    answer: carbon cycle
    difficulty: 1
    hints:
    - Releases CO₂.
    - Global warming.
    solution: The carbon cycle.
