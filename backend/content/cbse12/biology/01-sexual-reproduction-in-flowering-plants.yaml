# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse12-bio
chapter: 1
title: Sexual Reproduction in Flowering Plants
tips:
  c12b_double: 'Double fertilisation: one male gamete + egg → zygote (2n); the other + two polar nuclei → endosperm (3n).'
  c12b_ploidy: "In the embryo sac the egg is n. The primary endosperm nucleus forms from two polar nuclei (n + n) joining one male gamete (n). Add them."
  b12_anther: "A typical anther is bilobed, with two pollen sacs in each lobe."
  b12_apomixis: "Parthenocarpy gives a seedless fruit; here a seed forms without fertilisation."
  b12_egg_apparatus: "The egg apparatus sits at the micropylar end: the egg and its two helpers."
  b12_emasculation: "The step removes the male parts, before bagging."
  b12_embryo_nuclei: "Three mitoses from one megaspore nucleus: 2, then 4, then …"
  b12_embryo_sac: "Count the cells: 3 at one end (egg apparatus), 3 antipodals, and 1 central cell with two polar nuclei."
  b12_male_gametes: "One fuses with the egg, the other with the polar nuclei."
  b12_pollination_types: "Auto = same flower, geitono = neighbour flower on the same plant, xeno = another plant."
  b12_sporopollenin: "The most resistant organic material known lets pollen survive as fossils."
  b12_tapetum: "The innermost wall layer, next to the pollen, feeds the developing grains."
  c12b1_part: 'Place the structure first: is it in the anther (male) or the ovule/pistil (female)? Then recall its job.'
  c12b1_count: 'Count carefully: anther has 4 microsporangia; the embryo sac has 7 cells and 8 nuclei; each meiosis gives 4 cells.'
  c12b1_poll: 'Ask where the pollen comes from: same flower (autogamy), another flower on the same plant (geitonogamy) or a different plant (xenogamy).'
  c12b1_fert: 'Double fertilisation has two fusions: one male gamete + egg → zygote (2n); the other + two polar nuclei → endosperm nucleus (3n).'
  c12b1_cross: Think about where the pollen comes from in each option, and which source brings genes from a different plant.
  c12b1_bag: Ask what could still reach the stigma if one of the two steps were skipped.
concepts:
- code: cbse12b.flower.gametes
  title: Flower structure, pollen and the embryo sac
  notes: |
    Pre-fertilisation: stamen (anther, filament); anther bilobed, dithecous, tetrasporangiate; microsporangium wall (epidermis,
    endothecium, middle layers, tapetum); microsporogenesis (meiosis → microspore tetrads); pollen grain: exine (sporopollenin,
    germ pores) and intine; 2-celled (vegetative + generative) or 3-celled at shedding. Pistil: stigma, style, ovary; ovule
    (funicle, hilum, integuments, micropyle, nucellus, chalaza); megasporogenesis → functional megaspore → embryo sac (7-celled,
    8-nucleate: egg apparatus of egg + 2 synergids, 3 antipodals, central cell with 2 polar nuclei).
  explanations:
    text: Flowers make male and female gametes. Pollen grains, made in the anthers, carry the male gametes. Inside each ovule, a female gametophyte called the embryo sac develops, with 7 cells and 8 nuclei, including the egg.
    visual: 'Draw an embryo sac: three cells at the micropyle end (egg plus two synergids), three antipodal cells at the other end, and a big central cell with two polar nuclei in the middle.'
    step_by_step: 'Step 1: Male side: anther → microspore mother cell → meiosis → pollen. Step 2: Female side: ovule → megaspore mother cell → meiosis → one functional megaspore. Step 3: Three mitoses → 8-nucleate embryo sac.'
    real_world: Pollen grains have a tough sporopollenin coat, which is why pollen survives as fossils for millions of years and helps scientists study past climates.
  picture:
    kind: flow
    steps:
    - Megaspore mother cell (2n)
    - 'Meiosis: 4 megaspores'
    - One survives
    - Three mitoses
    - 'Embryo sac: 7 cells, 8 nuclei'
    alt: How the embryo sac forms from the megaspore mother cell.
  activity:
    type: order
    prompt: Put the making of the embryo sac in order.
    steps:
    - The megaspore mother cell divides by meiosis
    - Four megaspores form; three of them die
    - One megaspore's nucleus divides three times by mitosis
    - Eight nuclei are arranged into seven cells
    - A 7-celled, 8-nucleate embryo sac is ready
    reasons:
      Four megaspores form; three of them die: Four megaspores can only exist after meiosis has split the mother cell.
      One megaspore's nucleus divides three times by mitosis: Only the one functional megaspore goes on; the others have already died.
      Eight nuclei are arranged into seven cells: There must be 8 nuclei (after three mitoses) before cell walls form around them.
      A 7-celled, 8-nucleate embryo sac is ready: This mature 7-celled, 8-nucleate sac is the end of the process.
  lesson:
    - teach: 'The stamen has a filament and an anther. A typical anther has two lobes, each with two pollen sacs: four microsporangia. The wall has layers; the innermost, the tapetum, feeds the developing pollen. Inside, microspore mother cells undergo meiosis to form tetrads of microspores, which become pollen grains.'
      check:
        prompt: What is the job of the tapetum?
        options:
        - it nourishes developing pollen
        - it forms the pollen tube
        - it attracts insects
        answer: it nourishes developing pollen
        why: It is the nutritive inner layer of the anther wall.
      ways:
      - style: visual
        teach: From a cell inside the anther to pollen grains, step by step.
        picture:
          kind: flow
          steps:
          - Microspore mother cell (2n) in a pollen sac
          - Meiosis gives a tetrad of microspores (n)
          - Microspores separate
          - Each matures into a pollen grain
          alt: A diploid microspore mother cell inside a pollen sac undergoes meiosis to give a tetrad of haploid microspores. The microspores separate and each matures into a pollen grain.
      - style: real_world
        teach: In spring, many people sneeze and get itchy eyes because pollen from grasses and trees like Parthenium floats in the air. Pollen grains are so tough and light that they travel far, and some people's immune systems overreact to them.
    - teach: A pollen grain has a tough outer exine made of sporopollenin, among the most resistant natural materials, with germ pores where the tube emerges, and an inner intine. At shedding it is usually 2-celled (vegetative + generative cell) or 3-celled.
      check:
        prompt: Why are pollen grains found well preserved as fossils?
        options:
        - sporopollenin in the exine resists decay
        - they are made of stone
        - they contain no water
        answer: sporopollenin in the exine resists decay
        why: Few chemicals or enzymes can break sporopollenin.
      ways:
      - style: visual
        teach: The two layers of a pollen grain wall and what each does.
        picture:
          kind: compare
          columns:
          - title: Exine (outer)
            points:
            - Made of sporopollenin
            - Resists heat, acid, decay
            - Has germ pores
          - title: Intine (inner)
            points:
            - Thin, of cellulose and pectin
            - Soft and stretchy
            - Grows out as the pollen tube
          alt: The outer exine is made of sporopollenin, resists heat, acid and decay, and has germ pores. The inner intine is thin, made of cellulose and pectin, soft and stretchy, and grows out as the pollen tube.
      - style: real_world
        teach: Pollen grains from millions of years ago are found in rocks, still recognisable. Scientists use these fossil pollens to learn which plants grew in a place long ago. Only a material as tough as sporopollenin could survive that long.
    - teach: 'The pistil has stigma, style and ovary. An ovule has a stalk (funicle), integuments with an opening (micropyle), nucellus and chalaza. A megaspore mother cell undergoes meiosis; one functional megaspore divides to form the embryo sac: 7 cells, 8 nuclei (egg + 2 synergids at the micropylar end, 3 antipodals, a central cell with 2 polar nuclei).'
      picture:
        kind: compare
        columns:
        - title: Micropylar end
          points:
          - egg cell
          - 2 synergids
        - title: Centre
          points:
          - central cell
          - 2 polar nuclei
        - title: Chalazal end
          points:
          - 3 antipodals
        alt: The seven cells of a typical embryo sac and where they sit.
      check:
        prompt: How many cells make up the egg apparatus?
        options:
        - '3'
        - '2'
        - '7'
        answer: '3'
        why: One egg cell and two synergids.
      ways:
      - style: step_by_step
        teach: 'Follow the female side. Step 1: A megaspore mother cell (2n) in the nucellus undergoes meiosis. Step 2: Four haploid megaspores form in a row. Step 3: Three degenerate; one survives. Step 4: Its nucleus divides by mitosis to build the embryo sac.'
      - style: real_world
        teach: 'Think of the ovule as a house: the integuments are the walls, the micropyle the front door the pollen tube uses, the funicle the path joining it to the street (the placenta), and the embryo sac the room where the family starts.'
  items:
  - prompt: How many cells does a typical angiosperm embryo sac have?
    answer: '7'
    check: 3+3+1
    difficulty: 1
    hints:
    - 3 + 3 + 1.
    - Seven.
    solution: "The 7 cells are: 3 at the micropylar end (egg + 2 synergids), 3 antipodals, and 1 large central cell."
    mistakes: {"8": "b12_embryo_sac", "6": "b12_embryo_sac"}
  - prompt: How many nuclei does it have?
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - Central cell has two.
    - '8.'
    solution: "Three mitotic divisions of the functional megaspore give 2³ = 8 nuclei; the central cell holds 2 of them (polar nuclei)."
    mistakes: {"7": "b12_embryo_nuclei", "4": "b12_embryo_nuclei"}
  - prompt: How many microsporangia does a typical anther have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Tetrasporangiate.
    - Four.
    solution: "A typical anther has 2 lobes with 2 microsporangia each: 2 × 2 = 4 (tetrasporangiate)."
    mistakes: {"2": "b12_anther", "8": "b12_anther"}
  - prompt: 'The tough outer wall of pollen is made of:'
    options:
    - sporopollenin
    - cellulose
    - lignin
    - chitin
    answer: sporopollenin
    difficulty: 2
    hints:
    - Very resistant.
    - Exine.
    solution: "The exine is made of sporopollenin, which resists high temperature, strong acids and alkalis, and enzymes."
    mistakes: {"cellulose": "b12_sporopollenin", "lignin": "b12_sporopollenin", "chitin": "b12_sporopollenin"}
  - prompt: 'The nutritive layer of the anther wall is the:'
    options:
    - tapetum
    - endothecium
    - epidermis
    - middle layer
    answer: tapetum
    difficulty: 2
    hints:
    - Innermost.
    - Feeds pollen.
    solution: "The tapetum is the innermost wall layer and feeds the developing pollen grains."
    mistakes: {"endothecium": "b12_tapetum", "epidermis": "b12_tapetum", "middle layer": "b12_tapetum"}
  - prompt: 'The egg apparatus consists of:'
    options:
    - "an egg cell and two synergids"
    - "three antipodal cells at the chalazal end"
    - "two polar nuclei in the central cell"
    - "the nucellus and the integuments"
    answer: an egg cell and two synergids
    difficulty: 2
    hints:
    - Micropylar end.
    - Three cells.
    solution: An egg and two synergids.
    mistakes: {"three antipodal cells at the chalazal end": "b12_egg_apparatus", "two polar nuclei in the central cell": "b12_egg_apparatus", "the nucellus and the integuments": "b12_egg_apparatus"}
  - prompt: How many lobes does a typical anther have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - It is described as bilobed.
    - Each lobe has two pollen sacs.
    solution: 'Step 1: bilobed. Step 2: 2.'
    mistakes:
      '4': c12b1_count
      '1': c12b1_count
  - prompt: How many microspores come from one microspore mother cell?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - It divides by meiosis.
    - They form a tetrad.
    solution: 'Step 1: meiosis gives four cells. Step 2: 4.'
    mistakes:
      '2': c12b1_count
      '8': c12b1_count
  - prompt: How many antipodal cells are in the embryo sac?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - They sit at the chalazal end.
    - Opposite the egg apparatus.
    solution: 'Step 1: chalazal group. Step 2: 3.'
    mistakes:
      '2': c12b1_count
      '1': c12b1_count
  - prompt: 'The opening in the integuments of an ovule is the:'
    options:
    - micropyle
    - chalaza
    - hilum
    answer: micropyle
    difficulty: 2
    hints:
    - The pollen tube usually enters through it.
    - A 'small gate'.
    solution: 'Step 1: gap in integuments. Step 2: micropyle.'
    mistakes:
      chalaza: c12b1_part
      hilum: c12b1_part
  - prompt: Of the four megaspores formed by meiosis, how many usually stay functional?
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - The other three degenerate.
    - Monosporic development.
    solution: 'Step 1: three degenerate. Step 2: 1.'
    mistakes:
      '4': c12b1_count
      '2': c12b1_count
  - prompt: 'The generative cell of a pollen grain divides to form:'
    options:
    - two male gametes
    - the pollen tube
    - the exine
    answer: two male gametes
    difficulty: 2
    hints:
    - The vegetative cell makes the tube.
    - The generative cell gives the sperm cells.
    solution: 'Step 1: mitosis of generative cell. Step 2: two male gametes.'
    mistakes:
      the pollen tube: c12b1_part
      the exine: c12b1_part
  - prompt: How many nuclei does the central cell of the embryo sac contain?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - They are the polar nuclei.
    - One came from each end.
    solution: 'Step 1: two polar nuclei. Step 2: 2.'
    mistakes:
      '3': c12b1_count
      '1': c12b1_count
  - prompt: Why do germ pores lack sporopollenin?
    options:
    - "so the pollen tube can grow out through them"
    - "so the pollen grain can store extra food there"
    - "so the pollen grain can attract bees by scent"
    answer: so the pollen tube can grow out through them
    difficulty: 3
    hints:
    - Sporopollenin is very hard.
    - The tube needs a weak spot.
    solution: 'Step 1: exine is tough. Step 2: pores let the tube emerge.'
    mistakes:
      "so the pollen grain can store extra food there": c12b1_part
      "so the pollen grain can attract bees by scent": c12b1_part
  - prompt: The embryo sac is formed by how many mitotic divisions of the functional megaspore?
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - 1 nucleus → 8 nuclei.
    - 2³ = 8.
    solution: 'Step 1: 1 → 2 → 4 → 8. Step 2: 3 divisions.'
    mistakes:
      '8': c12b1_count
      '2': c12b1_count
  - prompt: 'Assertion (A): Pollen grains can be stored for years in liquid nitrogen at −196 °C for crop breeding.

      Reason (R): The exine of pollen is made of sporopollenin, which resists high temperatures, strong acids and alkalis.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, but R does not explain A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both statements are true. But storage in liquid nitrogen works because extreme cold stops metabolism; sporopollenin's resistance to heat and chemicals is not the reason. So R does not explain A.
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Archaeologists find pollen grains in a 10,000-year-old lake bed and identify the plants. Why did the pollen survive so long?'
    options:
    - "Its exine is made of sporopollenin, which resists decay"
    - "Its intine is made of cellulose, which lasts for ever"
    - "Pollen is alive and keeps repairing itself over time"
    answer: Its exine is made of sporopollenin, which resists decay
    hints:
    - Which layer is on the outside?
    - Which material is among the most resistant in nature?
    solution: The outer exine is made of sporopollenin, which resists heat, acids, alkalis and enzymes, so the grains keep their shape for thousands of years.
    mistakes:
      "Its intine is made of cellulose, which lasts for ever": c12b1_part
      "Pollen is alive and keeps repairing itself over time": b12_sporopollenin
    exam: case
    difficulty: 2
  - prompt: A botanist sees an anther whose innermost wall layer has broken down early. What problem should they expect?
    options:
    - "Pollen grains develop poorly from lack of nourishment"
    - "The anther will produce far more pollen than usual"
    - "The ovules of the same flower will not form at all"
    answer: Pollen grains develop poorly from lack of nourishment
    hints:
    - What is the innermost anther wall layer called?
    - What is its job?
    solution: The tapetum, the innermost layer, feeds developing pollen. If it breaks down too early, pollen grains are poorly nourished.
    mistakes:
      "The anther will produce far more pollen than usual": b12_tapetum
      "The ovules of the same flower will not form at all": c12b1_part
    exam: competency
    difficulty: 2
- code: cbse12b.flower.fertilisation
  title: Pollination, double fertilisation and seeds
  after:
  - cbse12b.flower.gametes
  notes: |
    Pollination: autogamy (cleistogamous flowers), geitonogamy, xenogamy; agents: wind (light pollen, feathery stigma: maize),
    water (Vallisneria, Zostera), animals (insects, birds, bats; nectar, colour, scent). Outbreeding devices: self-incompatibility,
    dioecy, timing. Pollen–pistil interaction; artificial hybridisation (emasculation, bagging). Double fertilisation: syngamy
    (egg + male gamete → zygote, 2n) + triple fusion (polar nuclei + male gamete → PEN, 3n). Post-fertilisation: endosperm,
    embryo, seed (albuminous/non-albuminous), fruit (true/false; parthenocarpy). Apomixis and polyembryony.
  explanations:
    text: 'Pollination moves pollen from anther to stigma, by wind, water or animals. In flowering plants, fertilisation is double: one male gamete fuses with the egg to make the zygote, and the other fuses with the two polar nuclei to make the endosperm, the seed''s food store.'
    visual: 'Draw a pollen tube growing down the style into the ovule, releasing two male gametes: one heading for the egg, the other for the central cell.'
    step_by_step: 'Step 1: Pollination type (self or cross). Step 2: Pollen tube carries two male gametes. Step 3: Syngamy → zygote (2n). Step 4: Triple fusion → endosperm (3n). Step 5: Ovule → seed; ovary → fruit.'
    real_world: Plant breeders cross varieties by removing a flower's anthers (emasculation) and bagging it, then dusting it with chosen pollen.
  picture:
    kind: compare
    columns:
    - title: Fusion
      points:
      - syngamy
      - triple fusion
    - title: Partners
      points:
      - egg + male gamete
      - 2 polar nuclei + male gamete
    - title: Product
      points:
      - zygote (2n)
      - endosperm (3n)
    alt: 'Double fertilisation: syngamy and triple fusion.'
  activity:
    type: sort
    prompt: How is each flower pollinated?
    bins:
    - Wind
    - Water
    - Insects or animals
    items:
    - label: Maize
      bin: Wind
      clue: Its tassels shed clouds of light pollen. What carries it?
      why: 'Maize is wind-pollinated: light pollen, feathery stigmas.'
    - label: Grasses
      bin: Wind
      clue: Small dull flowers with lots of light pollen. Carried by?
      why: Wind.
    - label: Light, non-sticky pollen and a feathery stigma
      bin: Wind
      clue: Which carrier needs pollen that floats and a stigma that catches?
      why: Wind pollination.
    - label: Vallisneria
      bin: Water
      clue: Its female flowers rise on long stalks; pollen drifts to them. Carried by?
      why: Pollen floats on the water.
    - label: Zostera (sea grass)
      bin: Water
      clue: It flowers under the sea. Carried by?
      why: Long pollen grains carried inside the water.
    - label: Hydrilla
      bin: Water
      clue: It lives fully underwater. Carried by?
      why: Water.
    - label: Pollen with a mucilage coat that resists wetting
      bin: Water
      clue: Why would pollen need protection from getting wet?
      why: Water-pollinated plants protect their pollen this way.
    - label: Large, colourful flowers with nectar
      bin: Insects or animals
      clue: Who are the colours and nectar for?
      why: Rewards and signals for animal visitors.
    - label: Amorphophallus, the tallest flower
      bin: Insects or animals
      clue: It gives off a strong smell. Who is it calling?
      why: Insects pollinate it, and some lay eggs in it.
    - label: Sticky, rough pollen
      bin: Insects or animals
      clue: Pollen that clings to bodies suits which carrier?
      why: Insects and other animals.
  lesson:
    - teach: 'Pollination moves pollen to a stigma. Autogamy: same flower (cleistogamous flowers never open, so they always self-pollinate). Geitonogamy: another flower on the same plant (genetically like selfing). Xenogamy: a different plant, giving new gene combinations. Agents: wind (light pollen, feathery stigmas: maize), water (Vallisneria), animals (colour, scent, nectar).'
      check:
        prompt: Which pollination brings genetically different pollen?
        options:
        - xenogamy
        - geitonogamy
        - autogamy
        answer: xenogamy
        why: Pollen comes from a different plant.
      ways:
      - style: visual
        teach: Three kinds of pollination, sorted by where the pollen comes from.
        picture:
          kind: compare
          columns:
          - title: Autogamy
            points:
            - Same flower
            - No new genes
          - title: Geitonogamy
            points:
            - Another flower, same plant
            - Needs an agent, but no new genes
          - title: Xenogamy
            points:
            - Flower on another plant
            - New gene combinations
          alt: 'Autogamy uses pollen from the same flower and brings no new genes. Geitonogamy uses another flower on the same plant: it needs an agent, but brings no new genes. Xenogamy uses a flower on another plant and brings new gene combinations.'
      - style: real_world
        teach: A honeybee visiting mustard flowers picks up pollen on its hairy body while sipping nectar, then rubs it onto the next flower's stigma. Bright yellow petals and sweet nectar are the 'advertisement' and 'payment' for this service.
    - teach: 'Plants avoid self-pollination by self-incompatibility, separate male and female plants, or releasing pollen and readying the stigma at different times. Breeders do artificial hybridisation: emasculation (removing anthers) and bagging to stop unwanted pollen.'
      check:
        prompt: Why is a flower bagged after emasculation?
        options:
        - to keep out unwanted pollen
        - to keep it warm
        - to make it grow faster
        answer: to keep out unwanted pollen
        why: Only the chosen pollen should reach the stigma.
      ways:
      - style: step_by_step
        teach: 'Artificial cross of two wheat varieties. Step 1: Choose parents with the traits you want. Step 2: Remove the anthers of the female parent before they open (emasculation). Step 3: Cover the flower with a bag. Step 4: When the stigma is ready, dust it with the chosen pollen and re-bag it.'
      - style: visual
        teach: Three ways flowering plants avoid pollinating themselves.
        picture:
          kind: compare
          columns:
          - title: Timing
            points:
            - Pollen released before or after
            - the stigma is ready
          - title: Position
            points:
            - Anther and stigma
            - placed apart
          - title: Chemistry and sexes
            points:
            - Self-incompatibility
            - Separate male and female plants (papaya)
          alt: Plants avoid self-pollination by timing, releasing pollen before or after the stigma is ready; by position, placing anther and stigma apart; and by self-incompatibility or by having separate male and female plants, as in papaya.
    - teach: 'Double fertilisation: the pollen tube brings two male gametes. One fuses with the egg (syngamy) → zygote (2n). The other fuses with two polar nuclei (triple fusion) → primary endosperm nucleus (3n), which forms food-storing endosperm. The ovule becomes the seed, the ovary the fruit. Apomixis makes seeds without fertilisation.'
      picture:
        kind: flow
        steps:
        - Pollen tube enters
        - 2 male gametes released
        - Gamete 1 + egg → zygote (2n)
        - Gamete 2 + 2 polar nuclei → PEN (3n)
        - Seed and fruit form
        alt: The steps of double fertilisation in flowering plants.
      check:
        prompt: 'After fertilisation, the ovary becomes the:'
        options:
        - fruit
        - seed
        - embryo
        answer: fruit
        why: The ovule becomes the seed; the ovary around it becomes the fruit.
      ways:
      - style: real_world
        teach: 'The white flesh of a coconut and its water are both endosperm: food stored for the embryo. Every time you eat rice or wheat, you are eating mostly endosperm made by triple fusion.'
      - style: step_by_step
        teach: 'Trace a seed from fertilisation. Step 1: The zygote grows into the embryo. Step 2: The primary endosperm nucleus forms endosperm. Step 3: The integuments harden into the seed coat. Step 4: The ovary wall ripens into the fruit around the seed.'
  items:
  - prompt: What is the ploidy of the primary endosperm nucleus?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Triple fusion.
    - n + n + n.
    solution: "One male gamete (n) fuses with two polar nuclei (n + n): n + n + n = 3n."
    mistakes:
      '2': c12b_ploidy
  - prompt: How many male gametes does one pollen tube deliver?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
