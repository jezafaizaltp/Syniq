# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse12-bio
chapter: 1
title: Sexual Reproduction in Flowering Plants
tips:
  c12b_double: 'Double fertilisation: one male gamete + egg → zygote (2n); the other + two polar nuclei → endosperm (3n).'
  c12b_ploidy: In the embryo sac the egg is haploid (n); the endosperm is triploid (3n); the zygote is diploid (2n).
concepts:
- code: cbse12b.flower.gametes
  title: Flower structure, pollen and the embryo sac
  notes: |
    Pre-fertilisation: stamen (anther, filament); anther bilobed, dithecous, tetrasporangiate; microsporangium wall (epidermis,
    endothecium, middle layers, tapetum); microsporogenesis (meiosis → microspore tetrads); pollen grain: exine (sporopollenin,
    germ pores) and intine; 2-celled (vegetative + generative) or 3-celled at shedding. Pistil: stigma, style, ovary; ovule
    (funicle, hilum, integuments, micropyle, nucellus, chalaza); megasporogenesis → functional megaspore → embryo sac (7-celled,
    8-nucleate: egg apparatus of egg + 2 synergids, 3 antipodals, central cell with 2 polar nuclei).
  explanations:
    text: Flowers make male and female gametes. Pollen grains, made in the anthers, carry the male gametes. Inside each ovule, a female gametophyte called the embryo sac develops, with 7 cells and 8 nuclei, including the egg.
    visual: 'Draw an embryo sac: three cells at the micropyle end (egg plus two synergids), three antipodal cells at the other end, and a big central cell with two polar nuclei in the middle.'
    step_by_step: 'Step 1: Male side: anther → microspore mother cell → meiosis → pollen. Step 2: Female side: ovule → megaspore mother cell → meiosis → one functional megaspore. Step 3: Three mitoses → 8-nucleate embryo sac.'
    real_world: Pollen grains have a tough sporopollenin coat, which is why pollen survives as fossils for millions of years and helps scientists study past climates.
  picture:
    kind: flow
    steps:
    - Megaspore mother cell (2n)
    - 'Meiosis: 4 megaspores'
    - One survives
    - Three mitoses
    - 'Embryo sac: 7 cells, 8 nuclei'
    alt: How the embryo sac forms from the megaspore mother cell.
  items:
  - prompt: How many cells does a typical angiosperm embryo sac have?
    answer: '7'
    check: 3+3+1
    difficulty: 1
    hints:
    - 3 + 3 + 1.
    - Seven.
    solution: 7 cells.
  - prompt: How many nuclei does it have?
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - Central cell has two.
    - '8.'
    solution: 8 nuclei.
  - prompt: How many microsporangia does a typical anther have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Tetrasporangiate.
    - Four.
    solution: '4.'
  - prompt: 'The tough outer wall of pollen is made of:'
    options:
    - sporopollenin
    - cellulose
    - lignin
    - chitin
    answer: sporopollenin
    difficulty: 2
    hints:
    - Very resistant.
    - Exine.
    solution: Sporopollenin.
  - prompt: 'The nutritive layer of the anther wall is the:'
    options:
    - tapetum
    - endothecium
    - epidermis
    - middle layer
    answer: tapetum
    difficulty: 2
    hints:
    - Innermost.
    - Feeds pollen.
    solution: The tapetum.
  - prompt: 'The egg apparatus consists of:'
    options:
    - an egg cell and two synergids
    - three antipodals
    - two polar nuclei
    - the nucellus
    answer: an egg cell and two synergids
    difficulty: 2
    hints:
    - Micropylar end.
    - Three cells.
    solution: An egg and two synergids.
- code: cbse12b.flower.fertilisation
  title: Pollination, double fertilisation and seeds
  after:
  - cbse12b.flower.gametes
  notes: |
    Pollination: autogamy (cleistogamous flowers), geitonogamy, xenogamy; agents: wind (light pollen, feathery stigma: maize),
    water (Vallisneria, Zostera), animals (insects, birds, bats; nectar, colour, scent). Outbreeding devices: self-incompatibility,
    dioecy, timing. Pollen–pistil interaction; artificial hybridisation (emasculation, bagging). Double fertilisation: syngamy
    (egg + male gamete → zygote, 2n) + triple fusion (polar nuclei + male gamete → PEN, 3n). Post-fertilisation: endosperm,
    embryo, seed (albuminous/non-albuminous), fruit (true/false; parthenocarpy). Apomixis and polyembryony.
  explanations:
    text: 'Pollination moves pollen from anther to stigma, by wind, water or animals. In flowering plants, fertilisation is double: one male gamete fuses with the egg to make the zygote, and the other fuses with the two polar nuclei to make the endosperm, the seed''s food store.'
    visual: 'Draw a pollen tube growing down the style into the ovule, releasing two male gametes: one heading for the egg, the other for the central cell.'
    step_by_step: 'Step 1: Pollination type (self or cross). Step 2: Pollen tube carries two male gametes. Step 3: Syngamy → zygote (2n). Step 4: Triple fusion → endosperm (3n). Step 5: Ovule → seed; ovary → fruit.'
    real_world: Plant breeders cross varieties by removing a flower's anthers (emasculation) and bagging it, then dusting it with chosen pollen.
  picture:
    kind: compare
    columns:
    - title: Fusion
      points:
      - syngamy
      - triple fusion
    - title: Partners
      points:
      - egg + male gamete
      - 2 polar nuclei + male gamete
    - title: Product
      points:
      - zygote (2n)
      - endosperm (3n)
    alt: 'Double fertilisation: syngamy and triple fusion.'
  items:
  - prompt: What is the ploidy of the primary endosperm nucleus?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Triple fusion.
    - n + n + n.
    solution: 3n.
    mistakes:
      '2': c12b_ploidy
  - prompt: How many male gametes does one pollen tube deliver?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Double fertilisation.
    - Two.
    solution: '2.'
  - prompt: 'Pollination between flowers of the same plant is:'
    options:
    - geitonogamy
    - autogamy
    - xenogamy
    - cleistogamy
    answer: geitonogamy
    difficulty: 2
    hints:
    - Same plant, different flower.
    - Genetically like selfing.
    solution: Geitonogamy.
  - prompt: 'Fusion of a male gamete with the two polar nuclei is called:'
    options:
    - triple fusion
    - syngamy
    - apomixis
    - polyembryony
    answer: triple fusion
    difficulty: 1
    hints:
    - Three nuclei.
    - Makes endosperm.
    solution: Triple fusion.
    mistakes:
      syngamy: c12b_double
  - prompt: 'Removing anthers before they shed pollen is called:'
    options:
    - emasculation
    - bagging
    - pollination
    - apomixis
    answer: emasculation
    difficulty: 2
    hints:
    - For crossing.
    - Stops selfing.
    solution: Emasculation.
  - prompt: 'Seed formation without fertilisation is called:'
    options:
    - apomixis
    - parthenocarpy
    - polyembryony
    - syngamy
    answer: apomixis
    difficulty: 2
    hints:
    - Asexual seeds.
    - Some grasses.
    solution: Apomixis.
