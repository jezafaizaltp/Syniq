# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse12-bio
chapter: 1
title: Sexual Reproduction in Flowering Plants
tips:
  c12b_double: 'Double fertilisation: one male gamete + egg → zygote (2n); the other + two polar nuclei → endosperm (3n).'
  c12b_ploidy: "In the embryo sac the egg is n. The primary endosperm nucleus forms from two polar nuclei (n + n) joining one male gamete (n). Add them."
  b12_anther: "A typical anther is bilobed, with two pollen sacs in each lobe."
  b12_apomixis: "Parthenocarpy gives a seedless fruit; here a seed forms without fertilisation."
  b12_egg_apparatus: "The egg apparatus sits at the micropylar end: the egg and its two helpers."
  b12_emasculation: "The step removes the male parts, before bagging."
  b12_embryo_nuclei: "Three mitoses from one megaspore nucleus: 2, then 4, then …"
  b12_embryo_sac: "Count the cells: 3 at one end (egg apparatus), 3 antipodals, and 1 central cell with two polar nuclei."
  b12_male_gametes: "One fuses with the egg, the other with the polar nuclei."
  b12_pollination_types: "Auto = same flower, geitono = neighbour flower on the same plant, xeno = another plant."
  b12_sporopollenin: "The most resistant organic material known lets pollen survive as fossils."
  b12_tapetum: "The innermost wall layer, next to the pollen, feeds the developing grains."
concepts:
- code: cbse12b.flower.gametes
  title: Flower structure, pollen and the embryo sac
  notes: |
    Pre-fertilisation: stamen (anther, filament); anther bilobed, dithecous, tetrasporangiate; microsporangium wall (epidermis,
    endothecium, middle layers, tapetum); microsporogenesis (meiosis → microspore tetrads); pollen grain: exine (sporopollenin,
    germ pores) and intine; 2-celled (vegetative + generative) or 3-celled at shedding. Pistil: stigma, style, ovary; ovule
    (funicle, hilum, integuments, micropyle, nucellus, chalaza); megasporogenesis → functional megaspore → embryo sac (7-celled,
    8-nucleate: egg apparatus of egg + 2 synergids, 3 antipodals, central cell with 2 polar nuclei).
  explanations:
    text: Flowers make male and female gametes. Pollen grains, made in the anthers, carry the male gametes. Inside each ovule, a female gametophyte called the embryo sac develops, with 7 cells and 8 nuclei, including the egg.
    visual: 'Draw an embryo sac: three cells at the micropyle end (egg plus two synergids), three antipodal cells at the other end, and a big central cell with two polar nuclei in the middle.'
    step_by_step: 'Step 1: Male side: anther → microspore mother cell → meiosis → pollen. Step 2: Female side: ovule → megaspore mother cell → meiosis → one functional megaspore. Step 3: Three mitoses → 8-nucleate embryo sac.'
    real_world: Pollen grains have a tough sporopollenin coat, which is why pollen survives as fossils for millions of years and helps scientists study past climates.
  picture:
    kind: flow
    steps:
    - Megaspore mother cell (2n)
    - 'Meiosis: 4 megaspores'
    - One survives
    - Three mitoses
    - 'Embryo sac: 7 cells, 8 nuclei'
    alt: How the embryo sac forms from the megaspore mother cell.
  activity:
    type: order
    prompt: Put the making of the embryo sac in order.
    steps:
    - The megaspore mother cell divides by meiosis
    - Four megaspores form; three of them die
    - One megaspore's nucleus divides three times by mitosis
    - Eight nuclei are arranged into seven cells
    - A 7-celled, 8-nucleate embryo sac is ready
    reasons:
      Four megaspores form; three of them die: Four megaspores can only exist after meiosis has split the mother cell.
      One megaspore's nucleus divides three times by mitosis: Only the one functional megaspore goes on; the others have already died.
      Eight nuclei are arranged into seven cells: There must be 8 nuclei (after three mitoses) before cell walls form around them.
      A 7-celled, 8-nucleate embryo sac is ready: This mature 7-celled, 8-nucleate sac is the end of the process.
  items:
  - prompt: How many cells does a typical angiosperm embryo sac have?
    answer: '7'
    check: 3+3+1
    difficulty: 1
    hints:
    - 3 + 3 + 1.
    - Seven.
    solution: 7 cells.
    mistakes: {"8": "b12_embryo_sac", "6": "b12_embryo_sac"}
  - prompt: How many nuclei does it have?
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - Central cell has two.
    - '8.'
    solution: 8 nuclei.
    mistakes: {"7": "b12_embryo_nuclei", "4": "b12_embryo_nuclei"}
  - prompt: How many microsporangia does a typical anther have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Tetrasporangiate.
    - Four.
    solution: '4.'
    mistakes: {"2": "b12_anther", "8": "b12_anther"}
  - prompt: 'The tough outer wall of pollen is made of:'
    options:
    - sporopollenin
    - cellulose
    - lignin
    - chitin
    answer: sporopollenin
    difficulty: 2
    hints:
    - Very resistant.
    - Exine.
    solution: Sporopollenin.
    mistakes: {"cellulose": "b12_sporopollenin", "lignin": "b12_sporopollenin", "chitin": "b12_sporopollenin"}
  - prompt: 'The nutritive layer of the anther wall is the:'
    options:
    - tapetum
    - endothecium
    - epidermis
    - middle layer
    answer: tapetum
    difficulty: 2
    hints:
    - Innermost.
    - Feeds pollen.
    solution: The tapetum.
    mistakes: {"endothecium": "b12_tapetum", "epidermis": "b12_tapetum", "middle layer": "b12_tapetum"}
  - prompt: 'The egg apparatus consists of:'
    options:
    - an egg cell and two synergids
    - three antipodals
    - two polar nuclei
    - the nucellus
    answer: an egg cell and two synergids
    difficulty: 2
    hints:
    - Micropylar end.
    - Three cells.
    solution: An egg and two synergids.
    mistakes: {"three antipodals": "b12_egg_apparatus", "two polar nuclei": "b12_egg_apparatus", "the nucellus": "b12_egg_apparatus"}
- code: cbse12b.flower.fertilisation
  title: Pollination, double fertilisation and seeds
  after:
  - cbse12b.flower.gametes
  notes: |
    Pollination: autogamy (cleistogamous flowers), geitonogamy, xenogamy; agents: wind (light pollen, feathery stigma: maize),
    water (Vallisneria, Zostera), animals (insects, birds, bats; nectar, colour, scent). Outbreeding devices: self-incompatibility,
    dioecy, timing. Pollen–pistil interaction; artificial hybridisation (emasculation, bagging). Double fertilisation: syngamy
    (egg + male gamete → zygote, 2n) + triple fusion (polar nuclei + male gamete → PEN, 3n). Post-fertilisation: endosperm,
    embryo, seed (albuminous/non-albuminous), fruit (true/false; parthenocarpy). Apomixis and polyembryony.
  explanations:
    text: 'Pollination moves pollen from anther to stigma, by wind, water or animals. In flowering plants, fertilisation is double: one male gamete fuses with the egg to make the zygote, and the other fuses with the two polar nuclei to make the endosperm, the seed''s food store.'
    visual: 'Draw a pollen tube growing down the style into the ovule, releasing two male gametes: one heading for the egg, the other for the central cell.'
    step_by_step: 'Step 1: Pollination type (self or cross). Step 2: Pollen tube carries two male gametes. Step 3: Syngamy → zygote (2n). Step 4: Triple fusion → endosperm (3n). Step 5: Ovule → seed; ovary → fruit.'
    real_world: Plant breeders cross varieties by removing a flower's anthers (emasculation) and bagging it, then dusting it with chosen pollen.
  picture:
    kind: compare
    columns:
    - title: Fusion
      points:
      - syngamy
      - triple fusion
    - title: Partners
      points:
      - egg + male gamete
      - 2 polar nuclei + male gamete
    - title: Product
      points:
      - zygote (2n)
      - endosperm (3n)
    alt: 'Double fertilisation: syngamy and triple fusion.'
  activity:
    type: sort
    prompt: How is each flower pollinated?
    bins:
    - Wind
    - Water
    - Insects or animals
    items:
    - label: Maize
      bin: Wind
      clue: Its tassels shed clouds of light pollen. What carries it?
      why: 'Maize is wind-pollinated: light pollen, feathery stigmas.'
    - label: Grasses
      bin: Wind
      clue: Small dull flowers with lots of light pollen. Carried by?
      why: Wind.
    - label: Light, non-sticky pollen and a feathery stigma
      bin: Wind
      clue: Which carrier needs pollen that floats and a stigma that catches?
      why: Wind pollination.
    - label: Vallisneria
      bin: Water
      clue: Its female flowers rise on long stalks; pollen drifts to them. Carried by?
      why: Pollen floats on the water.
    - label: Zostera (sea grass)
      bin: Water
      clue: It flowers under the sea. Carried by?
      why: Long pollen grains carried inside the water.
    - label: Hydrilla
      bin: Water
      clue: It lives fully underwater. Carried by?
      why: Water.
    - label: Pollen with a mucilage coat that resists wetting
      bin: Water
      clue: Why would pollen need protection from getting wet?
      why: Water-pollinated plants protect their pollen this way.
    - label: Large, colourful flowers with nectar
      bin: Insects or animals
      clue: Who are the colours and nectar for?
      why: Rewards and signals for animal visitors.
    - label: Amorphophallus, the tallest flower
      bin: Insects or animals
      clue: It gives off a strong smell. Who is it calling?
      why: Insects pollinate it, and some lay eggs in it.
    - label: Sticky, rough pollen
      bin: Insects or animals
      clue: Pollen that clings to bodies suits which carrier?
      why: Insects and other animals.
  items:
  - prompt: What is the ploidy of the primary endosperm nucleus?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Triple fusion.
    - n + n + n.
    solution: 3n.
    mistakes:
      '2': c12b_ploidy
  - prompt: How many male gametes does one pollen tube deliver?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Double fertilisation.
    - Two.
    solution: '2.'
    mistakes: {"1": "b12_male_gametes", "3": "b12_male_gametes"}
  - prompt: 'Pollination between flowers of the same plant is:'
    options:
    - geitonogamy
    - autogamy
    - xenogamy
    - cleistogamy
    answer: geitonogamy
    difficulty: 2
    hints:
    - Same plant, different flower.
    - Genetically like selfing.
    solution: Geitonogamy.
    mistakes: {"autogamy": "b12_pollination_types", "xenogamy": "b12_pollination_types", "cleistogamy": "b12_pollination_types"}
  - prompt: 'Fusion of a male gamete with the two polar nuclei is called:'
    options:
    - triple fusion
    - syngamy
    - apomixis
    - polyembryony
    answer: triple fusion
    difficulty: 1
    hints:
    - Three nuclei.
    - Makes endosperm.
    solution: Triple fusion.
    mistakes:
      syngamy: c12b_double
  - prompt: 'Removing anthers before they shed pollen is called:'
    options:
    - emasculation
    - bagging
    - pollination
    - apomixis
    answer: emasculation
    difficulty: 2
    hints:
    - For crossing.
    - Stops selfing.
    solution: Emasculation.
    mistakes: {"bagging": "b12_emasculation", "pollination": "b12_emasculation", "apomixis": "b12_emasculation"}
  - prompt: 'Seed formation without fertilisation is called:'
    options:
    - apomixis
    - parthenocarpy
    - polyembryony
    - syngamy
    answer: apomixis
    difficulty: 2
    hints:
    - Asexual seeds.
    - Some grasses.
    solution: Apomixis.
    mistakes: {"parthenocarpy": "b12_apomixis", "polyembryony": "b12_apomixis", "syngamy": "b12_apomixis"}
