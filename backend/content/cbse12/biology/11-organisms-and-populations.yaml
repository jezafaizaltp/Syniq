# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 11. Format: content/README.md.
subject: cbse12-bio
chapter: 11
title: Organisms and Populations
tips:
  c12b_interact: Mutualism (+,+), competition (−,−), predation and parasitism (+,−), commensalism (+,0), amensalism (−,0).
  c12b_growth: 'Exponential growth: J-shaped curve (unlimited resources). Logistic growth: S-shaped curve that levels off at carrying capacity K.'
concepts:
- code: cbse12b.pop.attributes
  title: Populations and growth
  notes: |
    Ecology levels: organism, population, community, biome. (Organism and environment section trimmed in rationalised
    syllabus.) Population attributes: birth rate (natality), death rate (mortality), sex ratio, age pyramids (expanding
    triangular, stable bell, declining urn). Population density (N) changes by natality, mortality, immigration, emigration.
    Growth models: exponential dN/dt = rN, Nₜ = N₀e^(rt) (J-curve); logistic (Verhulst–Pearl) dN/dt = rN(K − N)/K (S-curve);
    carrying capacity K; intrinsic rate r. Life history variation.
  explanations:
    text: A population is a group of the same species in an area. It grows through births and immigration and shrinks through deaths and emigration. With unlimited resources it grows exponentially (J-curve); with limits it levels off at the carrying capacity (S-curve).
    visual: 'Draw two curves: one shooting up steeply like a J (unlimited growth), one rising then flattening like an S at the carrying capacity K.'
    step_by_step: 'Step 1: Change = (births + immigration) − (deaths + emigration). Step 2: Birth rate = births ÷ population. Step 3: Exponential: J-curve. Step 4: Logistic: S-curve, levels at K.'
    real_world: Age pyramids help India plan schools for a young population and pensions for an ageing one.
  picture:
    kind: compare
    columns:
    - title: Age pyramid
      points:
      - triangular
      - bell-shaped
      - urn-shaped
    - title: Population
      points:
      - expanding
      - stable
      - declining
    alt: Shapes of age pyramids and what they show about a population.
  items:
  - prompt: A pond has 20 lotus plants; 8 new ones are added in a year. Find the birth rate per plant per year as a fraction.
    answer: 2/5
    check: Rational(8,20)
    difficulty: 1
    hints:
    - 8/20.
    - Per individual.
    solution: 0.4 per year.
  - prompt: In a lab of 40 fruit flies, 4 die in a week. Find the death rate per fly per week as a fraction.
    answer: 1/10
    check: Rational(4,40)
    difficulty: 1
    hints:
    - 4/40.
    - 0.1.
    solution: 0.1 per week.
  - prompt: A population of 100 gains 30 births and 10 immigrants and loses 20 deaths and 5 emigrants. Find the new size.
    answer: '115'
    check: 100+30+10-20-5
    difficulty: 2
    hints:
    - 100 + 40 − 25.
    - Add and subtract.
    solution: '115.'
  - prompt: 'Growth with unlimited resources gives a:'
    options:
    - J-shaped curve
    - S-shaped curve
    - straight line
    - bell curve
    answer: J-shaped curve
    difficulty: 1
    hints:
    - Exponential.
    - Shoots up.
    solution: A J-shaped curve.
    mistakes:
      S-shaped curve: c12b_growth
  - prompt: 'The maximum population an environment can support is its:'
    options:
    - carrying capacity (K)
    - intrinsic rate (r)
    - natality
    - biome
    answer: carrying capacity (K)
    difficulty: 1
    hints:
    - Logistic levels off here.
    - K.
    solution: Carrying capacity.
  - prompt: 'An urn-shaped age pyramid shows a population that is:'
    options:
    - declining
    - expanding
    - stable
    - exploding
    answer: declining
    difficulty: 2
    hints:
    - Few young.
    - Narrow base.
    solution: Declining.
- code: cbse12b.pop.interactions
  title: Population interactions
  after:
  - cbse12b.pop.attributes
  notes: |
    Interactions: mutualism (+/+: lichens, mycorrhizae, fig and wasp, orchid Ophrys and bee—sexual deceit), competition (−/−:
    Gause's competitive exclusion principle; resource partitioning in MacArthur's warblers; Abingdon tortoise vs goats in
    Galapagos), predation (+/−: keeps prey in check; prickly pear in Australia controlled by moth; defences—camouflage, monarch
    butterfly toxic, cardiac glycosides in Calotropis), parasitism (+/−: ectoparasites like lice, endoparasites like tapeworm,
    brood parasitism—cuckoo lays eggs in crow's nest), commensalism (+/0: orchid on mango branch, barnacles on whale, cattle
    egret and grazing cattle, clownfish and sea anemone), amensalism (−/0: Penicillium inhibiting bacteria).
  explanations:
    text: Species in a community interact in different ways. In mutualism both gain; in competition both lose; in predation and parasitism one gains and the other loses; in commensalism one gains and the other is unaffected.
    visual: 'Draw a table of signs: + + mutualism, − − competition, + − predation and parasitism, + 0 commensalism, − 0 amensalism.'
    step_by_step: 'Step 1: Ask what each species gains or loses. Step 2: Mark +, − or 0 for each. Step 3: Name the interaction from the pair of signs.'
    real_world: 'Cattle egrets follow grazing cows in Indian fields to catch insects the cattle disturb: commensalism.'
  picture:
    kind: compare
    columns:
    - title: Interaction
      points:
      - mutualism
      - competition
      - parasitism
      - commensalism
    - title: Signs
      points:
      - + / +
      - − / −
      - + / −
      - + / 0
    - title: Example
      points:
      - lichen (alga + fungus)
      - two species sharing food
      - cuckoo and crow
      - orchid on a mango tree
    alt: Population interactions, their signs and examples.
  items:
  - prompt: 'An orchid growing on a mango branch shows:'
    options:
    - commensalism
    - parasitism
    - mutualism
    - predation
    answer: commensalism
    difficulty: 2
    hints:
    - Orchid gains support.
    - Mango unaffected.
    solution: Commensalism.
    mistakes:
      parasitism: c12b_interact
  - prompt: 'The cuckoo laying eggs in a crow''s nest is an example of:'
    options:
    - brood parasitism
    - mutualism
    - commensalism
    - competition
    answer: brood parasitism
    difficulty: 2
    hints:
    - Crow raises cuckoo chicks.
    - Parasite.
    solution: Brood parasitism.
  - prompt: 'Lichens show:'
    options:
    - mutualism
    - parasitism
    - amensalism
    - predation
    answer: mutualism
    difficulty: 1
    hints:
    - Alga + fungus.
    - Both benefit.
    solution: Mutualism.
  - prompt: 'Gause''s principle says two species competing for the same resources:'
    options:
    - cannot coexist indefinitely
    - always coexist
    - become one species
    - help each other
    answer: cannot coexist indefinitely
    difficulty: 2
    hints:
    - Competitive exclusion.
    - One wins.
    solution: Cannot coexist indefinitely.
  - prompt: 'Monarch butterflies are distasteful to predators because they:'
    options:
    - store chemicals from the plants they ate as caterpillars
    - are brightly coloured only
    - fly fast
    - bite
    answer: store chemicals from the plants they ate as caterpillars
    difficulty: 2
    hints:
    - Milkweed.
    - Defence.
    solution: They store toxic chemicals from their food plants.
  - prompt: 'Penicillium releasing a substance that kills bacteria shows:'
    options:
    - amensalism
    - mutualism
    - commensalism
    - parasitism
    answer: amensalism
    difficulty: 2
    hints:
    - − / 0.
    - Penicillium unaffected.
    solution: Amensalism.
