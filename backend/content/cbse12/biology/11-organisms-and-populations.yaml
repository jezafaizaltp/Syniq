# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 11. Format: content/README.md.
subject: cbse12-bio
chapter: 11
title: Organisms and Populations
tips:
  c12b_interact: "Orchids grow on branches only for support and light; the mango tree is neither helped nor harmed. Which interaction is (+, 0)?"
  c12b_growth: "Unlimited resources let a population keep multiplying faster and faster. Picture that curve: which letter does it look like?"
  b12_age_pyramid: "An urn shape has fewer young than older individuals."
  b12_amensalism: "One species is harmed, the other is not affected."
  b12_birth_rate: "Birth rate = new individuals ÷ starting population."
  b12_brood: "The crow raises the cuckoo's chicks: one species uses another's parenting."
  b12_carrying_capacity: "K is the ceiling set by the habitat's resources."
  b12_death_rate: "Death rate = deaths ÷ starting population."
  b12_gause: "The 'competitive exclusion' principle."
  b12_monarch: "Monarch caterpillars feed on milkweed, which contains poison."
  b12_mutualism: "Alga gives food, fungus gives shelter and water. Both gain."
  b12_pop_change: "N = N₀ + births + immigration − deaths − emigration."
  c12b11_rate: 'Rates are ''per individual'': divide the number born, died or moved by the starting population.'
  c12b11_curve: "Compare unlimited and limited resources: one gives a J-curve, the other levels off at K. When N is tiny compared with K, how much does the limit matter?"
  c12b11_int: "Score each species: + benefits, − harmed, 0 unaffected. Then match the pair of scores to the name of the interaction."
concepts:
- code: cbse12b.pop.attributes
  title: Populations and growth
  notes: |
    Ecology levels: organism, population, community, biome. (Organism and environment section trimmed in rationalised
    syllabus.) Population attributes: birth rate (natality), death rate (mortality), sex ratio, age pyramids (expanding
    triangular, stable bell, declining urn). Population density (N) changes by natality, mortality, immigration, emigration.
    Growth models: exponential dN/dt = rN, Nₜ = N₀e^(rt) (J-curve); logistic (Verhulst–Pearl) dN/dt = rN(K − N)/K (S-curve);
    carrying capacity K; intrinsic rate r. Life history variation.
  explanations:
    text: A population is a group of the same species in an area. It grows through births and immigration and shrinks through deaths and emigration. With unlimited resources it grows exponentially (J-curve); with limits it levels off at the carrying capacity (S-curve).
    visual: 'Draw two curves: one shooting up steeply like a J (unlimited growth), one rising then flattening like an S at the carrying capacity K.'
    step_by_step: 'Step 1: Change = (births + immigration) − (deaths + emigration). Step 2: Birth rate = births ÷ population. Step 3: Exponential: J-curve. Step 4: Logistic: S-curve, levels at K.'
    real_world: Age pyramids help India plan schools for a young population and pensions for an ageing one.
  picture:
    kind: compare
    columns:
    - title: Age pyramid
      points:
      - triangular
      - bell-shaped
      - urn-shaped
    - title: Population
      points:
      - expanding
      - stable
      - declining
    alt: Shapes of age pyramids and what they show about a population.
  activity:
    type: formula
    prompt: 'Logistic growth: dN/dt = rN(K − N) ÷ K. Exponential growth would be rN, with no limit.'
    inputs:
    - name: n
      label: Population N
      min: 0
      max: 1000
      step: 50
      start: 0
    - name: r
      label: Growth rate r
      min: 0.1
      max: 1
      step: 0.1
      start: 0.1
    - name: k
      label: Carrying capacity K
      min: 200
      max: 1000
      step: 100
      start: 200
    outputs:
    - name: g
      label: Logistic dN/dt
      expr: r*n*(k-n)/k
      places: 1
    - name: e
      label: Exponential dN/dt
      expr: r*n
      places: 1
    goals:
    - prompt: K = 1000. Find the N where the population grows fastest.
      want:
        k: 1000
        n: 500
      mistakes:
      - when:
          k: 1000
          n: 1000
        say: 'At K the growth stops: no room left.'
      - when:
          k: 1000
          n:
          - 0
          - 150
        say: 'Few individuals, so few births: growth is still slow.'
      - when:
          k: 1000
          n:
          - 600
          - 950
        say: Past half of K, crowding slows the growth.
    - prompt: Make the logistic growth rate 0, with N not 0.
      want:
        g: 0
        n:
        - 50
        - 1000
      mistakes:
      - when:
          n:
          - 50
          - 1000
          g:
          - -1000
          - -0.1
        say: 'Negative growth: N is above K, so the population shrinks back.'
      - when:
          n:
          - 50
          - 1000
          g:
          - 0.1
          - 1000
        say: Still growing. Growth stops when N reaches K.
    - prompt: K = 1000, r = 0.4. Find N where logistic growth is only half the exponential rate.
      want:
        k: 1000
        r: 0.4
        n: 500
      mistakes:
      - when:
          k: 1000
          r: 0.4
          n:
          - 550
          - 1000
        say: 'Logistic is now less than half: (K − N)/K is below ½.'
      - when:
          k: 1000
          r: 0.4
          n:
          - 50
          - 450
        say: Logistic is still more than half the exponential rate.
  lesson:
    - teach: 'A population is a group of the same species in an area. It has features a single organism does not: birth rate (natality), death rate (mortality), sex ratio and age structure. Rates are per individual: if 8 of 80 die in a year, the death rate is 8/80 = 0.1 per individual per year.'
      check:
        prompt: 50 deer give birth to 10 fawns in a year. What is the birth rate per deer per year?
        options:
        - '0.2'
        - '10'
        - '5'
        answer: '0.2'
        why: 10 ÷ 50 = 0.2.
    - teach: 'Age pyramids show pre-reproductive, reproductive and post-reproductive groups. A triangle with a wide base means many young: an expanding population. A bell shape means stable. An urn shape (narrow base) means declining. Population size changes by births (B) and immigration (I) adding, deaths (D) and emigration (E) removing: Nₜ₊₁ = Nₜ + (B + I) − (D + E).'
      picture:
        kind: compare
        columns:
        - title: Shape
          points:
          - triangle
          - bell
          - urn
        - title: Population
          points:
          - expanding
          - stable
          - declining
        alt: Age pyramid shapes and what they show about a population.
      check:
        prompt: Which two processes add to a population?
        options:
        - natality and immigration
        - mortality and emigration
        - natality and emigration
        answer: natality and immigration
        why: Births and arrivals add individuals.
    - teach: 'With unlimited resources a population grows exponentially, dN/dt = rN, giving a J-shaped curve; r is the intrinsic rate of natural increase. In nature resources run out, so growth slows and levels off at the carrying capacity K: the logistic (Verhulst–Pearl) model dN/dt = rN(K − N)/K gives an S-shaped (sigmoid) curve.'
      picture:
        kind: compare
        columns:
        - title: Exponential
          points:
          - unlimited resources
          - dN/dt = rN
          - J-curve
        - title: Logistic
          points:
          - limited resources
          - dN/dt = rN(K − N)/K
          - S-curve levelling at K
        alt: Exponential and logistic growth compared.
      check:
        prompt: 'In the logistic model, growth stops when N equals:'
        options:
        - K
        - 0.5 K
        - r
        answer: K
        why: Then (K − N)/K = 0.
  items:
  - prompt: A pond has 20 lotus plants; 8 new ones are added in a year. Find the birth rate per plant per year as a fraction.
    answer: 2/5
    check: Rational(8,20)
    difficulty: 1
    hints:
    - 8/20.
    - Per individual.
    solution: 0.4 per year.
    mistakes: {"8/28": "b12_birth_rate", "5/2": "b12_birth_rate"}
  - prompt: In a lab of 40 fruit flies, 4 die in a week. Find the death rate per fly per week as a fraction.
    answer: 1/10
    check: Rational(4,40)
    difficulty: 1
    hints:
    - 4/40.
    - 0.1.
    solution: 0.1 per week.
    mistakes: {"4": "b12_death_rate", "1/9": "b12_death_rate"}
  - prompt: A population of 100 gains 30 births and 10 immigrants and loses 20 deaths and 5 emigrants. Find the new size.
    answer: '115'
    check: 100+30+10-20-5
    difficulty: 2
    hints:
    - 100 + 40 − 25.
    - Add and subtract.
    solution: '115.'
    mistakes: {"135": "b12_pop_change", "125": "b12_pop_change", "105": "b12_pop_change"}
  - prompt: 'Growth with unlimited resources gives a:'
    options:
    - J-shaped curve
    - S-shaped curve
    - straight line
    - bell curve
    answer: J-shaped curve
    difficulty: 1
    hints:
    - Exponential.
    - Shoots up.
    solution: A J-shaped curve.
    mistakes:
      S-shaped curve: c12b_growth
  - prompt: 'The maximum population an environment can support is its:'
    options:
    - carrying capacity (K)
    - intrinsic rate (r)
    - natality
    - biome
    answer: carrying capacity (K)
    difficulty: 1
    hints:
    - Logistic levels off here.
    - K.
    solution: Carrying capacity.
    mistakes: {"intrinsic rate (r)": "b12_carrying_capacity", "natality": "b12_carrying_capacity", "biome": "b12_carrying_capacity"}
  - prompt: 'An urn-shaped age pyramid shows a population that is:'
    options:
    - declining
    - expanding
    - stable
    - exploding
    answer: declining
    difficulty: 2
    hints:
    - Few young.
    - Narrow base.
    solution: Declining.
    mistakes: {"expanding": "b12_age_pyramid", "stable": "b12_age_pyramid", "exploding": "b12_age_pyramid"}
  - prompt: A population of 200 has 30 births, 10 deaths, 5 immigrants and 15 emigrants in a year. What is its new size?
    answer: '210'
    check: '210'
    difficulty: 2
    hints:
    - Add births and immigrants.
    - Subtract deaths and emigrants.
    solution: 'Step 1: 200 + 35 = 235. Step 2: 235 − 25 = 210.'
    mistakes:
      '230': c12b11_rate
      '250': c12b11_rate
      '190': c12b11_rate
  - prompt: In a herd of 60 deer, 12 die in a year. Find the death rate per deer per year.
    answer: 1/5
    check: Rational(12,60)
    difficulty: 1
    hints:
    - Divide deaths by the starting number.
    - Simplify the fraction.
    solution: 'Step 1: 12/60. Step 2: 1/5 = 0.2.'
    mistakes:
      '12': c12b11_rate
      '5': c12b11_rate
  - prompt: 'In the logistic equation, when N is very small compared with K, growth is nearly:'
    options:
    - exponential
    - zero
    - negative
    answer: exponential
    difficulty: 3
    hints:
    - Look at (K − N)/K when N is tiny.
    - That factor is close to 1.
    solution: 'Step 1: (K − N)/K ≈ 1. Step 2: dN/dt ≈ rN, exponential.'
    mistakes:
      zero: c12b11_curve
      negative: c12b11_curve
  - prompt: 'A bell-shaped age pyramid shows a population that is:'
    options:
    - stable
    - expanding
    - declining
    answer: stable
    difficulty: 1
    hints:
    - Young and reproductive groups are about equal.
    - Neither wide nor narrow base.
    solution: 'Step 1: balanced age groups. Step 2: stable.'
    mistakes:
      expanding: c12b11_curve
      declining: c12b11_curve
  - prompt: 'r in dN/dt = rN stands for the:'
    options:
    - intrinsic rate of natural increase
    - carrying capacity
    - number of deaths
    answer: intrinsic rate of natural increase
    difficulty: 2
    hints:
    - It is birth rate minus death rate per individual.
    - K is a different symbol.
    solution: 'Step 1: b − d. Step 2: intrinsic rate of natural increase.'
    mistakes:
      carrying capacity: c12b11_curve
      number of deaths: c12b11_curve
  - prompt: Which model is more realistic for most natural populations?
    options:
    - logistic
    - exponential
    - neither
    answer: logistic
    difficulty: 1
    hints:
    - Resources are finite.
    - Growth slows near a limit.
    solution: 'Step 1: limits exist. Step 2: logistic.'
    mistakes:
      exponential: c12b11_curve
      neither: c12b11_curve
  - prompt: 'The ratio of males to females in a population is its:'
    options:
    - sex ratio
    - natality
    - density
    answer: sex ratio
    difficulty: 1
    hints:
    - It is a population feature.
    - Compares the two sexes.
    solution: 'Step 1: e.g. 60% female, 40% male. Step 2: sex ratio.'
    mistakes:
      natality: c12b11_rate
      density: c12b11_rate
  - prompt: A pond of 50 frogs has 25 tadpoles become frogs and 5 frogs die in a year. What is the net growth rate per frog?
    answer: 2/5
    check: Rational(20,50)
    difficulty: 3
    hints:
    - Net change = births − deaths.
    - Divide by the starting number.
    solution: 'Step 1: 25 − 5 = 20. Step 2: 20/50 = 2/5.'
    mistakes:
      '20': c12b11_rate
      1/2: c12b11_rate
  - prompt: 'The population density of trees is often better measured by:'
    options:
    - percent cover or biomass
    - counting leaves
    - weighing the soil
    answer: percent cover or biomass
    difficulty: 2
    hints:
    - A huge tree and a tiny one should not count the same.
    - Think about area covered.
    solution: 'Step 1: individuals differ in size. Step 2: percent cover or biomass.'
    mistakes:
      counting leaves: c12b11_rate
      weighing the soil: c12b11_rate
- code: cbse12b.pop.interactions
  title: Population interactions
  after:
  - cbse12b.pop.attributes
  notes: |
    Interactions: mutualism (+/+: lichens, mycorrhizae, fig and wasp, orchid Ophrys and bee—sexual deceit), competition (−/−:
    Gause's competitive exclusion principle; resource partitioning in MacArthur's warblers; Abingdon tortoise vs goats in
    Galapagos), predation (+/−: keeps prey in check; prickly pear in Australia controlled by moth; defences—camouflage, monarch
    butterfly toxic, cardiac glycosides in Calotropis), parasitism (+/−: ectoparasites like lice, endoparasites like tapeworm,
    brood parasitism—cuckoo lays eggs in crow's nest), commensalism (+/0: orchid on mango branch, barnacles on whale, cattle
    egret and grazing cattle, clownfish and sea anemone), amensalism (−/0: Penicillium inhibiting bacteria).
  explanations:
    text: Species in a community interact in different ways. In mutualism both gain; in competition both lose; in predation and parasitism one gains and the other loses; in commensalism one gains and the other is unaffected.
    visual: 'Draw a table of signs: + + mutualism, − − competition, + − predation and parasitism, + 0 commensalism, − 0 amensalism.'
    step_by_step: 'Step 1: Ask what each species gains or loses. Step 2: Mark +, − or 0 for each. Step 3: Name the interaction from the pair of signs.'
    real_world: 'Cattle egrets follow grazing cows in Indian fields to catch insects the cattle disturb: commensalism.'
  picture:
    kind: compare
    columns:
    - title: Interaction
      points:
      - mutualism
      - competition
      - parasitism
      - commensalism
    - title: Signs
      points:
      - + / +
      - − / −
      - + / −
      - + / 0
    - title: Example
      points:
      - lichen (alga + fungus)
      - two species sharing food
      - cuckoo and crow
      - orchid on a mango tree
    alt: Population interactions, their signs and examples.
  activity:
    type: sort
    prompt: Which interaction is it?
    bins:
    - Mutualism (+/+)
    - Competition (−/−)
    - Predation (+/−)
    - Parasitism (+/−)
    - Commensalism (+/0)
    items:
    - label: 'Lichen: a fungus with an alga'
      bin: Mutualism (+/+)
      clue: Does each partner gain?
      why: The alga makes food; the fungus gives shelter and water.
    - label: 'Mycorrhiza: fungus with plant roots'
      bin: Mutualism (+/+)
      clue: 'Who gains: the fungus, the plant, or both?'
      why: The fungus gets sugars; the plant gets phosphorus.
    - label: Fig tree and fig wasp
      bin: Mutualism (+/+)
      clue: The wasp pollinates and lays eggs in the fig. Who gains?
      why: Both.
    - label: Galapagos goats and tortoises
      bin: Competition (−/−)
      clue: Do they eat the same plants?
      why: Both lose food; the tortoises declined.
    - label: Flamingos and fish feeding on zooplankton
      bin: Competition (−/−)
      clue: Same food. Who wins?
      why: 'Both lose some of the food: competition.'
    - label: Tiger and deer
      bin: Predation (+/−)
      clue: One eats the other. Who gains?
      why: Predator gains; prey loses.
    - label: Cuscuta growing on hedge plants
      bin: Parasitism (+/−)
      clue: Cuscuta has no chlorophyll. Where does its food come from?
      why: 'It drains the host: a parasite.'
    - label: Lice on humans
      bin: Parasitism (+/−)
      clue: Who gains, and who is harmed?
      why: Lice feed on the host.
    - label: A cuckoo laying eggs in a crow's nest
      bin: Parasitism (+/−)
      clue: Who raises the chicks?
      why: 'Brood parasitism: the crow is harmed.'
    - label: An orchid growing on a mango branch
      bin: Commensalism (+/0)
      clue: Does the orchid take food from the mango?
      why: The orchid gets a perch; the mango is unaffected.
    - label: Barnacles on a whale
      bin: Commensalism (+/0)
      clue: Does the whale gain or lose?
      why: Barnacles get a ride; the whale barely notices.
    - label: Cattle egret and grazing cattle
      bin: Commensalism (+/0)
      clue: The egret eats insects the cattle stir up. Does it cost the cattle?
      why: Egret gains; cattle unaffected.
  lesson:
    - teach: 'Populations of different species interact. Mutualism helps both (+/+): lichens (fungus and alga), mycorrhizae, fig and its wasp pollinator. Some orchids like Ophrys trick male bees with a flower petal that looks like a female bee (sexual deceit). Competition harms both (−/−); Gause''s principle says two species competing for exactly the same resource cannot coexist indefinitely. Species can share by resource partitioning, like MacArthur''s warblers feeding in different parts of a tree.'
      picture:
        kind: compare
        columns:
        - title: Interaction
          points:
          - mutualism
          - competition
          - predation
          - parasitism
          - commensalism
          - amensalism
        - title: Signs
          points:
          - + / +
          - − / −
          - + / −
          - + / −
          - + / 0
          - − / 0
        alt: Types of population interactions and their plus and minus signs.
      check:
        prompt: 'Warblers feeding at different heights of the same tree show:'
        options:
        - resource partitioning
        - parasitism
        - commensalism
        answer: resource partitioning
        why: They split the resource and avoid competing.
    - teach: 'Predation (+/−) transfers energy and keeps prey numbers in check; prickly pear cactus spread in Australia until a cactus-eating moth was brought in. Prey defend themselves: camouflage, toxins (the monarch butterfly stores poison from the plant it ate as a caterpillar), and plant chemicals like cardiac glycosides in Calotropis, or thorns.'
      check:
        prompt: 'Calotropis is avoided by cattle because it has:'
        options:
        - cardiac glycosides (toxic)
        - sweet nectar
        - no leaves
        answer: cardiac glycosides (toxic)
        why: Its chemicals are poisonous to grazers.
    - teach: 'Parasitism (+/−): ectoparasites live outside (lice, ticks, Cuscuta on plants), endoparasites inside (tapeworm, liver fluke); brood parasites like the cuckoo lay eggs in a crow''s nest. Commensalism (+/0): orchid on a mango branch, barnacles on a whale, cattle egrets catching insects stirred up by grazing cattle, clownfish among sea anemones. Amensalism (−/0): Penicillium harms bacteria without gaining.'
      check:
        prompt: 'Cattle egrets and grazing cattle show:'
        options:
        - commensalism
        - parasitism
        - competition
        answer: commensalism
        why: Egrets gain insects; cattle neither gain nor lose.
  items:
  - prompt: 'An orchid growing on a mango branch shows:'
    options:
    - commensalism
    - parasitism
    - mutualism
    - predation
    answer: commensalism
    difficulty: 2
    hints:
    - Orchid gains support.
    - Mango unaffected.
    solution: Commensalism.
    mistakes:
      parasitism: c12b_interact
  - prompt: 'The cuckoo laying eggs in a crow''s nest is an example of:'
    options:
    - brood parasitism
    - mutualism
    - commensalism
    - competition
    answer: brood parasitism
    difficulty: 2
    hints:
    - Crow raises cuckoo chicks.
    - Parasite.
    solution: Brood parasitism.
    mistakes: {"mutualism": "b12_brood", "commensalism": "b12_brood", "competition": "b12_brood"}
  - prompt: 'Lichens show:'
    options:
    - mutualism
    - parasitism
    - amensalism
    - predation
    answer: mutualism
    difficulty: 1
    hints:
    - Alga + fungus.
    - Both benefit.
    solution: Mutualism.
    mistakes: {"parasitism": "b12_mutualism", "amensalism": "b12_mutualism", "predation": "b12_mutualism"}
  - prompt: 'Gause''s principle says two species competing for the same resources:'
    options:
    - cannot coexist indefinitely
    - always coexist
    - become one species
    - help each other
    answer: cannot coexist indefinitely
    difficulty: 2
    hints:
    - Competitive exclusion.
    - One wins.
    solution: Cannot coexist indefinitely.
    mistakes: {"always coexist": "b12_gause", "become one species": "b12_gause", "help each other": "b12_gause"}
  - prompt: 'Monarch butterflies are distasteful to predators because they:'
    options:
    - store chemicals from the plants they ate as caterpillars
    - are brightly coloured only
    - fly fast
    - bite
    answer: store chemicals from the plants they ate as caterpillars
    difficulty: 2
    hints:
    - Milkweed.
    - Defence.
    solution: They store toxic chemicals from their food plants.
    mistakes: {"are brightly coloured only": "b12_monarch", "fly fast": "b12_monarch", "bite": "b12_monarch"}
  - prompt: 'Penicillium releasing a substance that kills bacteria shows:'
    options:
    - amensalism
    - mutualism
    - commensalism
    - parasitism
    answer: amensalism
    difficulty: 2
    hints:
    - − / 0.
    - Penicillium unaffected.
    solution: Amensalism.
    mistakes: {"mutualism": "b12_amensalism", "commensalism": "b12_amensalism", "parasitism": "b12_amensalism"}
  - prompt: 'Cuscuta (dodder) growing on hedge plants is an example of:'
    options:
    - parasitism
    - mutualism
    - commensalism
    answer: parasitism
    difficulty: 1
    hints:
    - Cuscuta has no chlorophyll.
    - It takes food from the host.
    solution: 'Step 1: gains at host''s cost. Step 2: parasitism.'
    mistakes:
      mutualism: c12b11_int
      commensalism: c12b11_int
  - prompt: 'The fig and its wasp show:'
    options:
    - mutualism
    - predation
    - amensalism
    answer: mutualism
    difficulty: 1
    hints:
    - The wasp pollinates the fig.
    - The fig gives the wasp a place to lay eggs.
    solution: 'Step 1: both benefit. Step 2: mutualism.'
    mistakes:
      predation: c12b11_int
      amensalism: c12b11_int
  - prompt: 'The prickly pear cactus in Australia was controlled by introducing a:'
    options:
    - cactus-feeding moth
    - goat
    - fungus
    answer: cactus-feeding moth
    difficulty: 2
    hints:
    - Its natural predator was missing in Australia.
    - An insect from its home range.
    solution: 'Step 1: biological control by a predator. Step 2: moth.'
    mistakes:
      goat: c12b11_int
      fungus: c12b11_int
  - prompt: 'Barnacles growing on a whale''s back show:'
    options:
    - commensalism
    - parasitism
    - mutualism
    answer: commensalism
    difficulty: 2
    hints:
    - Barnacles get a ride and food access.
    - The whale is not affected much.
    solution: 'Step 1: +/0. Step 2: commensalism.'
    mistakes:
      parasitism: c12b11_int
      mutualism: c12b11_int
  - prompt: 'Ophrys orchids get pollinated by:'
    options:
    - sexual deceit of male bees
    - wind
    - birds eating nectar
    answer: sexual deceit of male bees
    difficulty: 2
    hints:
    - One petal looks like a female bee.
    - The male 'pseudocopulates' with it.
    solution: 'Step 1: bee carries pollen between flowers. Step 2: sexual deceit.'
    mistakes:
      wind: c12b11_int
      birds eating nectar: c12b11_int
  - prompt: 'Goats introduced to the Galapagos harmed the Abingdon tortoise by:'
    options:
    - out-competing it for food
    - eating its eggs
    - spreading disease
    answer: out-competing it for food
    difficulty: 2
    hints:
    - Both eat plants.
    - The goats were better at browsing.
    solution: 'Step 1: same food. Step 2: competition led to extinction.'
