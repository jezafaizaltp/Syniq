# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse12-bio
chapter: 10
title: Biotechnology and its Applications
tips:
  c12b_bt: "The Cry protein is inactive until it meets the pH in the larva's gut. Our stomach is acidic and doesn't activate it. So the insect gut must be the other kind."
  b12_ada: "The first patient had a defective immune-system enzyme."
  b12_agrobacterium: "A soil bacterium that naturally puts its DNA into plants, causing galls."
  b12_biopiracy: "'Piracy' means taking what belongs to others."
  b12_bt_cotton: "Bt toxin kills insect larvae that bore into cotton bolls."
  b12_geac: "The Genetic Engineering Appraisal Committee is Indian and decides on GM crops."
  b12_gene_therapy_year: "The first gene therapy, on a 4-year-old girl with ADA deficiency, came after recombinant DNA (1972) and before the Human Genome Project finished (2003)."
  b12_golden_rice: "The golden colour comes from the precursor of vitamin A."
  b12_insulin_chains: "Insulin has an A chain and a B chain, linked by disulfide bridges."
  b12_rnai: "RNAi silences genes of a root-knot nematode that attacks tobacco roots."
  b12_rosie: "Rosie's milk had a human protein that made it more nutritious for babies."
  b12_transgenic: "'Trans-gene' means a gene moved across from another organism."
concepts:
- code: cbse12b.bioapp.agri
  title: Biotechnology in agriculture
  notes: |
    Green revolution, then GM (transgenic) crops: tolerance to stress, less pesticide, reduced post-harvest losses, better
    mineral use, enhanced nutrition (Golden rice—vitamin A). Bt cotton: Bacillus thuringiensis cry genes (cryIAc, cryIIAb against
    cotton bollworms; cryIAb against corn borer); protoxin activated in alkaline insect gut, creates pores in midgut cells. Pest-
    resistant plants by RNA interference (RNAi): tobacco resistant to nematode Meloidogyne incognita (dsRNA silences parasite
    mRNA), using Agrobacterium vectors.
  explanations:
    text: Biotechnology has created genetically modified crops. Bt cotton carries a bacterial gene that makes a protein toxic to bollworm caterpillars, so farmers spray less pesticide. RNA interference can protect plants by silencing genes in pests.
    visual: 'Picture a bollworm biting a Bt cotton boll: the Cry protein switches on in its alkaline gut and punches holes in it, so the caterpillar dies. In our acidic stomach, the protein stays harmless.'
    step_by_step: 'Step 1: Identify the problem (pest, nutrition). Step 2: Identify the gene (cry, vitamin A pathway, dsRNA). Step 3: Explain how it works. Step 4: Weigh benefits and concerns.'
    real_world: Bt cotton is widely grown in India and has cut pesticide use on cotton farms.
  picture:
    kind: flow
    steps:
    - Insect eats Bt cotton
    - Inactive Cry protein in gut
    - Alkaline gut activates toxin
    - Toxin makes pores in gut cells
    - Insect dies
    alt: How Bt cotton protects itself against insect pests.
  activity:
    type: sort
    prompt: Which biotechnology in agriculture is it?
    bins:
    - Bt crops
    - RNA interference
    - Better nutrition
    items:
    - label: cry genes from Bacillus thuringiensis
      bin: Bt crops
      clue: Which bacterium's genes make insect toxins?
      why: Bt toxin genes.
    - label: A protoxin turned active by an insect's alkaline gut
      bin: Bt crops
      clue: Which toxin is harmless until an insect eats it?
      why: The Bt toxin.
    - label: Cotton protected from bollworms
      bin: Bt crops
      clue: Which GM crop kills the bollworm?
      why: Bt cotton.
    - label: Tobacco protected from the nematode Meloidogyne
      bin: RNA interference
      clue: Which method silences a gene of the parasite?
      why: 'RNAi: the plant makes dsRNA against the nematode''s mRNA.'
    - label: dsRNA silences a matching mRNA
      bin: RNA interference
      clue: Which method stops a gene from being translated?
      why: RNA interference.
    - label: Agrobacterium carries nematode-specific genes into the host
      bin: RNA interference
      clue: Which method puts the parasite's own genes in, as sense and antisense?
      why: RNAi in nematode-resistant tobacco.
    - label: Golden rice, rich in vitamin A
      bin: Better nutrition
      clue: Is it about pests or about food value?
      why: Engineered to make β-carotene.
    - label: Crops with more iron or protein
      bin: Better nutrition
      clue: Is it about pests or about food value?
      why: 'Biofortification: better nutrition.'
  items:
  - prompt: 'Bt cotton is resistant to:'
    options:
    - bollworms
    - fungi
    - drought
    - frost
    answer: bollworms
    difficulty: 1
    hints:
    - Caterpillars.
    - Cry toxin.
    solution: Bollworms.
    mistakes: {"fungi": "b12_bt_cotton", "drought": "b12_bt_cotton", "frost": "b12_bt_cotton"}
  - prompt: 'The Bt toxin becomes active in the insect because the insect gut is:'
    options:
    - alkaline
    - acidic
    - neutral
    - cold
    answer: alkaline
    difficulty: 2
    hints:
    - High pH.
    - Solubilises crystals.
    solution: Alkaline.
    mistakes:
      acidic: c12b_bt
  - prompt: 'Golden rice is rich in:'
    options:
    - β-carotene (provitamin A)
    - vitamin C
    - iron only
    - protein only
    answer: β-carotene (provitamin A)
    difficulty: 2
    hints:
    - Yellow colour.
    - Night blindness.
    solution: β-carotene.
    mistakes: {"vitamin C": "b12_golden_rice", "iron only": "b12_golden_rice", "protein only": "b12_golden_rice"}
  - prompt: 'RNA interference protects tobacco plants from:'
    options:
    - the nematode Meloidogyne incognita
    - aphids
    - bacteria
    - drought
    answer: the nematode Meloidogyne incognita
    difficulty: 2
    hints:
    - Root worm.
    - dsRNA silences its gene.
    solution: The nematode Meloidogyne incognita.
    mistakes: {"aphids": "b12_rnai", "bacteria": "b12_rnai", "drought": "b12_rnai"}
  - prompt: 'The vector often used to introduce genes into plants is:'
    options:
    - Agrobacterium tumefaciens
    - E. coli
    - yeast
    - a retrovirus
    answer: Agrobacterium tumefaciens
    difficulty: 2
    hints:
    - Ti plasmid.
    - Crown gall.
    solution: Agrobacterium tumefaciens.
    mistakes: {"E. coli": "b12_agrobacterium", "yeast": "b12_agrobacterium", "a retrovirus": "b12_agrobacterium"}
  - prompt: 'Plants with an added foreign gene are called:'
    options:
    - transgenic (GM) plants
    - hybrids
    - mutants
    - clones only
    answer: transgenic (GM) plants
    difficulty: 1
    hints:
    - Genetically modified.
    - Foreign gene.
    solution: Transgenic plants.
    mistakes: {"hybrids": "b12_transgenic", "mutants": "b12_transgenic", "clones only": "b12_transgenic"}
- code: cbse12b.bioapp.medicine
  title: Biotechnology in medicine and ethics
  after:
  - cbse12b.bioapp.agri
  notes: |
    Genetically engineered insulin (Eli Lilly, 1983): A and B chains made separately in E. coli and joined by disulfide bonds
    (proinsulin's C-peptide not needed). Gene therapy: first in 1990 for ADA deficiency (adenosine deaminase; lymphocytes with
    functional gene; permanent cure if inserted in early embryonic cells). Molecular diagnosis: PCR, ELISA, recombinant probes.
    Transgenic animals: research, vaccine and chemical safety testing, biological products (Rosie the cow, α-lactalbumin-rich
    milk, 1997). Ethical issues: GEAC in India; biopiracy (basmati rice, turmeric, neem patents); Indian Patents Bill.
  explanations:
    text: Biotechnology now makes human insulin in bacteria, tries to cure genetic diseases by gene therapy, diagnoses infections early, and creates transgenic animals for research. It also raises ethical questions, like biopiracy of traditional Indian plants.
    visual: Draw insulin as two short chains, A and B, linked by disulfide bridges. Bacteria make each chain separately; scientists join them to make human insulin.
    step_by_step: 'Step 1: Name the product or technique. Step 2: How was it made (gene, host)? Step 3: What problem does it solve? Step 4: What ethical issues arise?'
    real_world: India's GEAC (Genetic Engineering Appraisal Committee) decides whether GM crops and products are safe to release.
  picture:
    kind: compare
    columns:
    - title: Application
      points:
      - human insulin
      - gene therapy
      - transgenic cow Rosie
    - title: Detail
      points:
      - A and B chains made in E. coli
      - first for ADA deficiency (1990)
      - milk rich in α-lactalbumin
    alt: Medical applications of biotechnology.
  activity:
    type: order
    prompt: Put the making of human insulin by genetic engineering in order.
    steps:
    - DNA sequences for chains A and B are prepared
    - Each is put into a plasmid
    - The plasmids are put into E. coli
    - The bacteria make chains A and B separately
    - The chains are extracted and purified
    - The chains are joined by disulfide bonds
    reasons:
      Each is put into a plasmid: You need the DNA for each chain before you can insert it.
      The plasmids are put into E. coli: The plasmids carry the genes, so they must be made first.
      The bacteria make chains A and B separately: E. coli can only make the chains after it has the genes.
      The chains are extracted and purified: There's nothing to extract until the bacteria have made it.
      The chains are joined by disulfide bonds: The chains have to be purified before they can be joined into insulin.
  items:
  - prompt: In which year was gene therapy first used (for ADA deficiency)?
    answer: '1990'
    check: '1990'
    difficulty: 2
    hints:
    - Late twentieth century.
    - '1990.'
    solution: '1990.'
    mistakes: {"1980": "b12_gene_therapy_year", "2000": "b12_gene_therapy_year", "1995": "b12_gene_therapy_year"}
  - prompt: How many polypeptide chains make up mature insulin?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - A and B.
    - Two.
    solution: '2.'
    mistakes: {"1": "b12_insulin_chains", "4": "b12_insulin_chains"}
  - prompt: 'The first gene therapy treated a deficiency of:'
    options:
    - adenosine deaminase (ADA)
    - insulin
    - haemoglobin
    - vitamin A
    answer: adenosine deaminase (ADA)
    difficulty: 2
    hints:
    - Immune disorder.
    - Lymphocytes.
    solution: Adenosine deaminase.
    mistakes: {"insulin": "b12_ada", "haemoglobin": "b12_ada", "vitamin A": "b12_ada"}
  - prompt: 'Rosie, the first transgenic cow, produced milk rich in:'
    options:
    - human α-lactalbumin
    - insulin
    - vitamin D
    - fat only
    answer: human α-lactalbumin
    difficulty: 2
    hints:
    - '1997.'
    - Better for babies.
    solution: Human α-lactalbumin.
    mistakes: {"insulin": "b12_rosie", "vitamin D": "b12_rosie", "fat only": "b12_rosie"}
  - prompt: 'Using a country''s biological resources without permission or fair payment is:'
    options:
    - biopiracy
    - bioremediation
    - biofortification
    - bioprospecting with consent
    answer: biopiracy
    difficulty: 1
    hints:
    - Basmati, neem.
    - Patents.
    solution: Biopiracy.
    mistakes: {"bioremediation": "b12_biopiracy", "biofortification": "b12_biopiracy", "bioprospecting with consent": "b12_biopiracy"}
  - prompt: 'In India, approval of GM organisms for public use is given by the:'
    options:
    - GEAC
    - WHO
    - ISRO
    - RBI
    answer: GEAC
    difficulty: 2
    hints:
    - Genetic Engineering Appraisal Committee.
    - Indian body.
    solution: The GEAC.
    mistakes: {"WHO": "b12_geac", "ISRO": "b12_geac", "RBI": "b12_geac"}
