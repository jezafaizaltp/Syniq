# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse12-bio
chapter: 10
title: Biotechnology and its Applications
tips:
  c12b_bt: "The Cry protein is inactive until it meets the pH in the larva's gut. Our stomach is acidic and doesn't activate it. So the insect gut must be the other kind."
  b12_ada: "The first patient had a defective immune-system enzyme."
  b12_agrobacterium: "A soil bacterium that naturally puts its DNA into plants, causing galls."
  b12_biopiracy: "'Piracy' means taking what belongs to others."
  b12_bt_cotton: "Bt toxin kills insect larvae that bore into cotton bolls."
  b12_geac: "The Genetic Engineering Appraisal Committee is Indian and decides on GM crops."
  b12_gene_therapy_year: "The first gene therapy, on a 4-year-old girl with ADA deficiency, came after recombinant DNA (1972) and before the Human Genome Project finished (2003)."
  b12_golden_rice: "The golden colour comes from the precursor of vitamin A."
  b12_insulin_chains: "Insulin has an A chain and a B chain, linked by disulfide bridges."
  b12_rnai: "RNAi silences genes of a root-knot nematode that attacks tobacco roots."
  b12_rosie: "Rosie's milk had a human protein that made it more nutritious for babies."
  b12_transgenic: "'Trans-gene' means a gene moved across from another organism."
  c12b10_agri: 'Link each GM crop to what it fixes: Bt cotton (bollworms), RNAi tobacco (nematodes), Golden rice (vitamin A).'
  c12b10_med: 'Link each medical use to its method: insulin (two chains made in E. coli), gene therapy (working gene into cells), diagnosis (PCR, ELISA, probes).'
  c12b10_eth: 'Ethics: GEAC checks GM safety; biopiracy is taking bioresources or traditional knowledge without permission or fair payment.'
  c12b10_proto: 'Ask where the toxin becomes active: in the plant cell, or only in the insect''s gut?'
  c12b10_patent: Ask who first used the resource and whether they agreed to, or benefit from, its commercial use.
concepts:
- code: cbse12b.bioapp.agri
  title: Biotechnology in agriculture
  notes: |
    Green revolution, then GM (transgenic) crops: tolerance to stress, less pesticide, reduced post-harvest losses, better
    mineral use, enhanced nutrition (Golden rice—vitamin A). Bt cotton: Bacillus thuringiensis cry genes (cryIAc, cryIIAb against
    cotton bollworms; cryIAb against corn borer); protoxin activated in alkaline insect gut, creates pores in midgut cells. Pest-
    resistant plants by RNA interference (RNAi): tobacco resistant to nematode Meloidogyne incognita (dsRNA silences parasite
    mRNA), using Agrobacterium vectors.
  explanations:
    text: Biotechnology has created genetically modified crops. Bt cotton carries a bacterial gene that makes a protein toxic to bollworm caterpillars, so farmers spray less pesticide. RNA interference can protect plants by silencing genes in pests.
    visual: 'Picture a bollworm biting a Bt cotton boll: the Cry protein switches on in its alkaline gut and punches holes in it, so the caterpillar dies. In our acidic stomach, the protein stays harmless.'
    step_by_step: 'Step 1: Identify the problem (pest, nutrition). Step 2: Identify the gene (cry, vitamin A pathway, dsRNA). Step 3: Explain how it works. Step 4: Weigh benefits and concerns.'
    real_world: Bt cotton is widely grown in India and has cut pesticide use on cotton farms.
  picture:
    kind: flow
    steps:
    - Insect eats Bt cotton
    - Inactive Cry protein in gut
    - Alkaline gut activates toxin
    - Toxin makes pores in gut cells
    - Insect dies
    alt: How Bt cotton protects itself against insect pests.
  activity:
    type: sort
    prompt: Which biotechnology in agriculture is it?
    bins:
    - Bt crops
    - RNA interference
    - Better nutrition
    items:
    - label: cry genes from Bacillus thuringiensis
      bin: Bt crops
      clue: Which bacterium's genes make insect toxins?
      why: Bt toxin genes.
    - label: A protoxin turned active by an insect's alkaline gut
      bin: Bt crops
      clue: Which toxin is harmless until an insect eats it?
      why: The Bt toxin.
    - label: Cotton protected from bollworms
      bin: Bt crops
      clue: Which GM crop kills the bollworm?
      why: Bt cotton.
    - label: Tobacco protected from the nematode Meloidogyne
      bin: RNA interference
      clue: Which method silences a gene of the parasite?
      why: 'RNAi: the plant makes dsRNA against the nematode''s mRNA.'
    - label: dsRNA silences a matching mRNA
      bin: RNA interference
      clue: Which method stops a gene from being translated?
      why: RNA interference.
    - label: Agrobacterium carries nematode-specific genes into the host
      bin: RNA interference
      clue: Which method puts the parasite's own genes in, as sense and antisense?
      why: RNAi in nematode-resistant tobacco.
    - label: Golden rice, rich in vitamin A
      bin: Better nutrition
      clue: Is it about pests or about food value?
      why: Engineered to make β-carotene.
    - label: Crops with more iron or protein
      bin: Better nutrition
      clue: Is it about pests or about food value?
      why: 'Biofortification: better nutrition.'
  lesson:
    - teach: The Green Revolution raised food output but relied on fertilisers and pesticides. Genetically modified (GM) crops can be more tolerant of drought, cold and salt, need fewer pesticides, lose less after harvest, use minerals better and carry more nutrients, like Golden rice rich in β-carotene (provitamin A).
      check:
        prompt: 'Golden rice was made to fight a shortage of:'
        options:
        - vitamin A
        - iron
        - protein
        answer: vitamin A
        why: β-carotene is turned into vitamin A in the body.
      ways:
      - style: visual
        teach: Three routes to more food, and their trade-offs.
        picture:
          kind: compare
          columns:
          - title: Agro-chemicals
            points:
            - Fertilisers, pesticides
            - Costly; harm soil and water
          - title: Organic farming
            points:
            - Manure, biocontrol
            - Safer; lower yield often
          - title: GM crops
            points:
            - Built-in traits
            - Fewer sprays; biosafety checks needed
          alt: Agro-chemicals like fertilisers and pesticides raise output but are costly and harm soil and water. Organic farming with manure and biocontrol is safer but often yields less. GM crops have built-in traits and need fewer sprays, but require biosafety checks.
      - style: real_world
        teach: Golden rice was engineered to make β-carotene, which the body turns into vitamin A. In places where rice is the main food, it was designed to help prevent the night blindness caused by vitamin A deficiency.
    - teach: Bt cotton carries cry genes from Bacillus thuringiensis. The bacterium makes an inactive protoxin; in the alkaline gut of a caterpillar it becomes active, binds the midgut cells and makes pores, so the insect dies. cryIAc and cryIIAb protect cotton from bollworms; cryIAb protects corn from corn borers. The bacterium is not harmed because its toxin stays inactive inside it.
      picture:
        kind: flow
        steps:
        - insect eats Bt cotton
        - inactive protoxin in gut
        - alkaline pH activates it
        - pores in midgut cells
        - insect dies
        alt: How Bt toxin kills a caterpillar.
      check:
        prompt: Why does the Bt toxin not kill the bacterium that makes it?
        options:
        - it is stored as an inactive protoxin
        - the bacterium is immune to all toxins
        - it is made outside the cell
        answer: it is stored as an inactive protoxin
        why: It only turns active in the insect's alkaline gut.
      ways:
      - style: step_by_step
        teach: 'How Bt cotton stops a bollworm. Step 1: The plant makes the inactive Bt protoxin. Step 2: A bollworm eats the leaf. Step 3: Its alkaline gut activates the toxin. Step 4: The toxin pierces the gut lining and the insect dies.'
      - style: real_world
        teach: Bt cotton farmers in India sprayed less pesticide in the early years. But bollworms can evolve resistance, so farmers are told to plant some non-Bt 'refuge' rows to slow it down.
    - teach: RNA interference (RNAi) silences a specific mRNA with matching double-stranded RNA. Tobacco was protected from the root nematode Meloidogyne incognita by adding nematode genes through Agrobacterium so the plant makes dsRNA; the nematode's own mRNA is silenced inside the plant and it cannot survive.
      check:
        prompt: 'RNAi works by:'
        options:
        - silencing a specific mRNA
        - adding a toxin gene
        - killing all soil microbes
        answer: silencing a specific mRNA
        why: dsRNA blocks translation of the matching mRNA.
      ways:
      - style: visual
        teach: RNA interference protecting tobacco from a nematode.
        picture:
          kind: flow
          steps:
          - Nematode genes added to tobacco by Agrobacterium
          - Plant makes matching double-stranded RNA
          - Nematode feeds and takes in the dsRNA
          - Nematode's own mRNA is silenced; it dies
          alt: Nematode genes are added to tobacco using Agrobacterium. The plant makes matching double-stranded RNA. The nematode feeds and takes it in. Its own matching messenger RNA is silenced and the nematode dies.
      - style: step_by_step
        teach: 'RNAi in general. Step 1: Double-stranded RNA that matches a gene enters the cell. Step 2: It binds to that gene''s mRNA. Step 3: The mRNA is destroyed or blocked. Step 4: The protein is not made: the gene is silenced.'
  items:
  - prompt: 'Bt cotton is resistant to:'
    options:
    - bollworms
    - fungi
    - drought
    - frost
    answer: bollworms
    difficulty: 1
    hints:
    - Caterpillars.
    - Cry toxin.
    solution: "Bt cotton carries cry genes whose toxin kills bollworms that eat the plant."
    mistakes: {"fungi": "b12_bt_cotton", "drought": "b12_bt_cotton", "frost": "b12_bt_cotton"}
  - prompt: 'The Bt toxin becomes active in the insect because the insect gut is:'
    options:
    - alkaline
    - acidic
    - neutral
    - cold
    answer: alkaline
    difficulty: 2
    hints:
    - High pH.
    - Solubilises crystals.
    solution: "The toxin is made as an inactive protoxin; the alkaline pH of the insect gut dissolves and activates it."
    mistakes:
      acidic: c12b_bt
  - prompt: 'Golden rice is rich in:'
    options:
    - "β-carotene (provitamin A)"
    - "vitamin C (ascorbic acid)"
    - "iron, and nothing else"
    - "protein, and nothing else"
    answer: β-carotene (provitamin A)
    difficulty: 2
    hints:
    - Yellow colour.
    - Night blindness.
    solution: "Golden rice was engineered to make β-carotene (provitamin A) in the grain, which gives it its colour."
    mistakes: {"vitamin C (ascorbic acid)": "b12_golden_rice", "iron, and nothing else": "b12_golden_rice", "protein, and nothing else": "b12_golden_rice"}
  - prompt: 'RNA interference protects tobacco plants from:'
    options:
    - "the nematode Meloidogyne incognita"
    - "aphids that suck the sap"
    - "bacteria that rot the roots"
    - "drought in the dry season"
    answer: the nematode Meloidogyne incognita
    difficulty: 2
    hints:
    - Root worm.
    - dsRNA silences its gene.
    solution: "Nematode-specific genes were added so the plant makes double-stranded RNA that silences the nematode's mRNA; this protects against Meloidogyne incognita."
    mistakes: {"aphids that suck the sap": "b12_rnai", "bacteria that rot the roots": "b12_rnai", "drought in the dry season": "b12_rnai"}
  - prompt: 'The vector often used to introduce genes into plants is:'
    options:
    - "Agrobacterium tumefaciens"
    - "Escherichia coli bacteria"
    - "Saccharomyces (baker's yeast)"
    - "an HIV-like retrovirus"
    answer: Agrobacterium tumefaciens
    difficulty: 2
    hints:
    - Ti plasmid.
    - Crown gall.
    solution: "Agrobacterium tumefaciens naturally moves a piece of DNA (T-DNA) into plant cells, so it is used to carry useful genes."
    mistakes: {"Escherichia coli bacteria": "b12_agrobacterium", "Saccharomyces (baker's yeast)": "b12_agrobacterium", "an HIV-like retrovirus": "b12_agrobacterium"}
  - prompt: 'Plants with an added foreign gene are called:'
    options:
    - transgenic (GM) plants
    - hybrids
    - mutants
    - clones only
    answer: transgenic (GM) plants
    difficulty: 1
    hints:
    - Genetically modified.
    - Foreign gene.
    solution: "Plants whose genes were altered by adding a foreign gene are transgenic, or GM, plants."
    mistakes: {"hybrids": "b12_transgenic", "mutants": "b12_transgenic", "clones only": "b12_transgenic"}
  - prompt: Which cry genes protect cotton against bollworms?
    options:
    - cryIAc and cryIIAb
    - cryIAb only
    - lacZ
    answer: cryIAc and cryIIAb
    difficulty: 2
    hints:
    - Two genes are used for cotton.
    - cryIAb alone is for corn.
    solution: 'Step 1: cotton bollworms. Step 2: cryIAc and cryIIAb.'
    mistakes:
      cryIAb only: c12b10_agri
      lacZ: c12b10_agri
  - prompt: The Bt toxin damages which part of the insect?
    options:
    - midgut epithelial cells
    - wings
    - brain
    answer: midgut epithelial cells
    difficulty: 2
    hints:
    - It acts where food is absorbed.
    - It makes pores, so cells swell and burst.
    solution: 'Step 1: binds gut lining. Step 2: midgut cells lyse.'
    mistakes:
      wings: c12b10_agri
      brain: c12b10_agri
  - prompt: Meloidogyne incognita attacks which part of tobacco plants?
    options:
    - roots
    - flowers
    - seeds
    answer: roots
    difficulty: 2
    hints:
    - It is a soil nematode.
    - It lives below ground.
    solution: 'Step 1: root-knot nematode. Step 2: roots.'
    mistakes:
      flowers: c12b10_agri
      seeds: c12b10_agri
  - prompt: 'Bt crops reduce the use of:'
    options:
    - chemical insecticides
    - water
    - sunlight
    answer: chemical insecticides
    difficulty: 1
    hints:
    - The plant makes its own protection.
    - Against insects.
    solution: 'Step 1: built-in toxin. Step 2: fewer sprays.'
    mistakes:
      water: c12b10_agri
      sunlight: c12b10_agri
  - prompt: Which GM benefit means less food is lost during storage?
    options:
    - "reduced post-harvest losses"
    - "better use of soil minerals"
    - "tolerance of drought"
    answer: reduced post-harvest losses
    difficulty: 1
    hints:
    - It happens after harvesting.
    - Food stays fresh longer.
    solution: 'Step 1: after harvest. Step 2: fewer losses.'
    mistakes:
      "better use of soil minerals": c12b10_agri
      "tolerance of drought": c12b10_agri
  - prompt: 'The source of the dsRNA in RNAi-protected tobacco is the:'
    options:
    - "nematode genes added to the plant"
    - "Bt bacterium's toxin gene"
    - "rice genome added to tobacco"
    answer: nematode genes added to the plant
    difficulty: 3
    hints:
    - The dsRNA must match the parasite's mRNA.
    - So its genes are used.
    solution: 'Step 1: nematode-specific genes introduced. Step 2: plant makes matching dsRNA.'
    mistakes:
      "Bt bacterium's toxin gene": c12b10_agri
      "rice genome added to tobacco": c12b10_agri
  - prompt: cryIAb protects which crop?
    options:
    - corn
    - cotton
    - tobacco
    answer: corn
    difficulty: 2
    hints:
    - It targets the borer of a cereal crop, not cotton bollworms.
    - Not the cotton genes.
    solution: 'Step 1: corn borer. Step 2: corn.'
    mistakes:
      cotton: c12b10_agri
      tobacco: c12b10_agri
  - prompt: 'The protoxin in Bt is activated by:'
    options:
    - "alkaline pH in the insect gut"
    - "acid in the plant's cells"
    - "sunlight falling on the leaf"
    answer: alkaline pH in the insect gut
    difficulty: 2
    hints:
    - Activation happens only after it is eaten.
    - The insect gut is not acidic.
    solution: 'Step 1: solubilised in gut. Step 2: alkaline pH activates.'
    mistakes:
      "acid in the plant's cells": c12b10_agri
      "sunlight falling on the leaf": c12b10_agri
  - prompt: 'Bacillus thuringiensis is a:'
    options:
    - soil bacterium
    - fungus
    - virus
    answer: soil bacterium
    difficulty: 1
    hints:
    - Bacillus is a genus of rod-shaped cells.
    - It lives in soil.
    solution: 'Step 1: Bacillus = bacterium. Step 2: soil bacterium.'
    mistakes:
      fungus: c12b10_agri
      virus: c12b10_agri
  - prompt: 'Assertion (A): Bt toxin does not kill the Bacillus thuringiensis bacterium that makes it.

      Reason (R): The toxin is stored as an inactive protoxin that becomes active only in the alkaline gut of an insect.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Inside the bacterium the protein is inactive; it is switched on only at high pH in the insect gut. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Farmers ask whether eating Bt cotton seed oil could poison people the way the toxin kills bollworms. What does the science say?'
    options:
    - "The toxin needs an alkaline insect gut to become active, which humans don't have"
    - "Humans digest the Bt toxin into vitamins, so it does them good"
    - "Bt toxin is not present in any part of the plant, only in the soil"
    answer: The toxin needs an alkaline insect gut to become active, which humans don't have
    hints:
    - Is the toxin made in active or inactive form?
    - What does the stomach's pH look like in humans?
    solution: The protoxin is activated only at high pH and binds receptors in specific insect guts. Human stomachs are acidic and lack those receptors.
    mistakes:
      "Humans digest the Bt toxin into vitamins, so it does them good": c12b10_proto
      "Bt toxin is not present in any part of the plant, only in the soil": c12b10_proto
    exam: case
    difficulty: 2
  - prompt: A crop is attacked by a nematode that damages its roots. Which biotech approach directly silences the pest's genes?
    options:
    - RNA interference
    - Adding Bt cry genes
    - Using Ti plasmid alone
    answer: RNA interference
    hints:
    - Bt cry toxins mainly target insect guts.
    - Which method blocks a specific mRNA?
    solution: RNAi uses matching dsRNA to destroy the nematode's mRNA, silencing an essential gene.
    mistakes:
      Adding Bt cry genes: c12b10_agri
      Using Ti plasmid alone: c12b10_agri
    exam: competency
    difficulty: 2
- code: cbse12b.bioapp.medicine
  title: Biotechnology in medicine and ethics
  after:
  - cbse12b.bioapp.agri
  notes: |
    Genetically engineered insulin (Eli Lilly, 1983): A and B chains made separately in E. coli and joined by disulfide bonds
    (proinsulin's C-peptide not needed). Gene therapy: first in 1990 for ADA deficiency (adenosine deaminase; lymphocytes with
    functional gene; permanent cure if inserted in early embryonic cells). Molecular diagnosis: PCR, ELISA, recombinant probes.
    Transgenic animals: research, vaccine and chemical safety testing, biological products (Rosie the cow, α-lactalbumin-rich
    milk, 1997). Ethical issues: GEAC in India; biopiracy (basmati rice, turmeric, neem patents); Indian Patents Bill.
  explanations:
    text: Biotechnology now makes human insulin in bacteria, tries to cure genetic diseases by gene therapy, diagnoses infections early, and creates transgenic animals for research. It also raises ethical questions, like biopiracy of traditional Indian plants.
    visual: Draw insulin as two short chains, A and B, linked by disulfide bridges. Bacteria make each chain separately; scientists join them to make human insulin.
    step_by_step: 'Step 1: Name the product or technique. Step 2: How was it made (gene, host)? Step 3: What problem does it solve? Step 4: What ethical issues arise?'
    real_world: India's GEAC (Genetic Engineering Appraisal Committee) decides whether GM crops and products are safe to release.
  picture:
    kind: compare
    columns:
    - title: Application
      points:
      - human insulin
      - gene therapy
      - transgenic cow Rosie
    - title: Detail
      points:
      - A and B chains made in E. coli
      - first for ADA deficiency (1990)
      - milk rich in α-lactalbumin
    alt: Medical applications of biotechnology.
  activity:
    type: order
    prompt: Put the making of human insulin by genetic engineering in order.
    steps:
    - DNA sequences for chains A and B are prepared
    - Each is put into a plasmid
    - The plasmids are put into E. coli
    - The bacteria make chains A and B separately
    - The chains are extracted and purified
    - The chains are joined by disulfide bonds
    reasons:
      Each is put into a plasmid: You need the DNA for each chain before you can insert it.
      The plasmids are put into E. coli: The plasmids carry the genes, so they must be made first.
      The bacteria make chains A and B separately: E. coli can only make the chains after it has the genes.
      The chains are extracted and purified: There's nothing to extract until the bacteria have made it.
      The chains are joined by disulfide bonds: The chains have to be purified before they can be joined into insulin.
  lesson:
    - teach: Insulin is made of two short chains, A and B, joined by disulfide bridges; in the body it is first made as proinsulin with an extra C-peptide. In 1983 Eli Lilly made the A and B chains separately in E. coli and joined them, giving human insulin without using animal pancreas or causing allergic reactions.
      picture:
        kind: flow
        steps:
        - gene for A chain in E. coli
        - gene for B chain in E. coli
        - extract both chains
        - join by disulfide bonds
        - human insulin
        alt: Making human insulin with recombinant DNA.
      check:
        prompt: Recombinant insulin did not need which part of proinsulin?
        options:
        - C-peptide
        - A chain
        - B chain
        answer: C-peptide
        why: The two chains were made separately and joined.
      ways:
      - style: real_world
        teach: Before genetic engineering, diabetics used insulin taken from slaughtered cattle and pigs. Some people reacted badly to it. Insulin made by E. coli carrying the human gene is identical to human insulin and plentiful.
      - style: step_by_step
        teach: 'How recombinant human insulin was made. Step 1: DNA for chain A and chain B was made separately. Step 2: Each was put into plasmids in E. coli. Step 3: The bacteria made chain A and chain B. Step 4: The chains were extracted and joined by disulfide bonds.'
    - teach: 'Gene therapy corrects a faulty gene by adding a working copy. The first case (1990) treated a 4-year-old with adenosine deaminase (ADA) deficiency: lymphocytes were grown outside the body, given a working ADA gene with a retroviral vector, and returned. This must be repeated because lymphocytes die; adding the gene to early embryonic cells could be a permanent cure.'
      check:
        prompt: Why must lymphocyte-based ADA gene therapy be repeated?
        options:
        - the modified cells are not immortal
        - the gene is lost in urine
        - the virus kills the patient
        answer: the modified cells are not immortal
        why: New lymphocytes made later still lack the gene.
      ways:
      - style: visual
        teach: 'Gene therapy for ADA deficiency: two approaches.'
        picture:
          kind: compare
          columns:
          - title: Using lymphocytes
            points:
            - Take lymphocytes out
            - Add working ADA gene (retrovirus)
            - Return them; repeat as cells die
          - title: Using early stem cells
            points:
            - Add the gene to bone-marrow cells
            - They keep making new cells
            - Could be a lasting cure
          alt: 'Using lymphocytes: take them out, add a working ADA gene with a retroviral vector, and return them, repeating as the cells die. Using early bone-marrow stem cells: add the gene, and since they keep making new cells it could be a lasting cure.'
      - style: real_world
        teach: Gene therapy research has grown since 1990, and some inherited blindness and blood disorders now have approved gene treatments. These are expensive and carefully checked for safety.
    - teach: 'Molecular diagnosis finds diseases early: PCR spots very small amounts of a pathogen''s DNA, ELISA detects antigens or antibodies, and labelled probes find mutated genes. Transgenic animals help study diseases, test vaccine and chemical safety and make products: Rosie the cow (1997) gave milk with human α-lactalbumin. India''s GEAC decides on GM research and release. Biopiracy (e.g. patents on basmati, turmeric, neem) uses others'' bioresources without permission or fair payment.'
      check:
        prompt: 'Patenting a country''s traditional plant knowledge without permission is:'
        options:
        - biopiracy
        - gene therapy
        - transformation
        answer: biopiracy
        why: It takes bioresources without consent or benefit-sharing.
      ways:
      - style: visual
        teach: Uses of transgenic animals, and the ethics around biotech.
        picture:
          kind: compare
          columns:
          - title: Uses
            points:
            - Study diseases
            - Test vaccines and chemical safety
            - Make medicines in milk (Rosie the cow)
          - title: Ethics and law
            points:
            - GEAC checks GM safety in India
            - Patents on traditional resources
            - 'Biopiracy: using them without consent or sharing'
          alt: Transgenic animals are used to study diseases, test vaccines and chemical safety, and make medicines in milk, as Rosie the cow did. On ethics and law, India's GEAC checks GM safety, there are patents on traditional resources, and biopiracy means using them without consent or fair sharing.
      - style: step_by_step
        teach: 'Why PCR helps early diagnosis. Step 1: Early in infection there are few pathogen cells. Step 2: Symptoms may not show yet. Step 3: PCR copies even a few DNA molecules to detectable levels. Step 4: So infection can be found before it spreads.'
  items:
  - prompt: In which year was gene therapy first used (for ADA deficiency)?
    answer: '1990'
    check: '1990'
    difficulty: 2
    hints:
    - Late twentieth century.
    - '1990.'
    solution: "In 1990 a 4-year-old with ADA deficiency was the first to receive gene therapy."
    mistakes: {"1980": "b12_gene_therapy_year", "2000": "b12_gene_therapy_year", "1995": "b12_gene_therapy_year"}
  - prompt: How many polypeptide chains make up mature insulin?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - A and B.
    - Two.
    solution: "Mature insulin has an A chain and a B chain joined by disulphide bridges: 2 chains."
    mistakes: {"1": "b12_insulin_chains", "4": "b12_insulin_chains"}
  - prompt: 'The first gene therapy treated a deficiency of:'
    options:
    - "adenosine deaminase (ADA)"
    - "insulin from the pancreas"
    - "haemoglobin in red cells"
    - "vitamin A in the diet"
    answer: adenosine deaminase (ADA)
    difficulty: 2
    hints:
    - Immune disorder.
    - Lymphocytes.
