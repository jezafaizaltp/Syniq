      hydrogen bonds only: c12b10_med
  - prompt: Which vector was used to put the ADA gene into lymphocytes?
    options:
    - retroviral vector
    - Ti plasmid
    - pBR322
    answer: retroviral vector
    difficulty: 2
    hints:
    - It must enter human cells.
    - A disarmed virus that inserts into the genome.
    solution: 'Step 1: animal cells need a viral carrier. Step 2: retroviral vector.'
    mistakes:
      Ti plasmid: c12b10_med
      pBR322: c12b10_med
  - prompt: Which test detects a pathogen's DNA when only a few copies are present?
    options:
    - PCR
    - Widal test
    - blood sugar test
    answer: PCR
    difficulty: 1
    hints:
    - It amplifies DNA.
    - Used to detect HIV in suspected AIDS patients early.
    solution: 'Step 1: makes many copies. Step 2: PCR.'
    mistakes:
      Widal test: c12b10_med
      blood sugar test: c12b10_med
  - prompt: What percentage of all transgenic animals are mice?
    answer: '95'
    check: '95'
    difficulty: 3
    hints:
    - Mice are the most common by far.
    - Well over nine out of ten.
    solution: 'Step 1: NCERT figure. Step 2: over 95%.'
    mistakes:
      '50': c12b10_med
      '75': c12b10_med
  - prompt: In which year was Rosie, the transgenic cow, produced?
    answer: '1997'
    check: '1997'
    difficulty: 2
    hints:
    - Late 1990s.
    - Same year Dolly the sheep was announced.
    solution: 'Step 1: human gene for α-lactalbumin. Step 2: 1997.'
    mistakes:
      '1983': c12b10_med
      '1990': c12b10_med
  - prompt: 'Transgenic animals are used to test the safety of:'
    options:
    - vaccines and chemicals
    - cars
    - rocks
    answer: vaccines and chemicals
    difficulty: 1
    hints:
    - Before use in humans.
    - e.g. polio vaccine on transgenic mice.
    solution: 'Step 1: safety testing. Step 2: vaccines and chemicals.'
    mistakes:
      cars: c12b10_eth
      rocks: c12b10_eth
  - prompt: Which of these was the subject of a biopiracy patent case?
    options:
    - turmeric
    - wheat flour
    - salt
    answer: turmeric
    difficulty: 2
    hints:
    - A traditional Indian medicinal plant.
    - Used on wounds for centuries.
    solution: 'Step 1: US patent on wound healing. Step 2: turmeric (also neem, basmati).'
    mistakes:
      wheat flour: c12b10_eth
      salt: c12b10_eth
  - prompt: 'The Indian Parliament amended the patents law to prevent:'
    options:
    - unauthorised exploitation of bioresources
    - all GM research
    - all exports
    answer: unauthorised exploitation of bioresources
    difficulty: 2
    hints:
    - It deals with patent terms and biopiracy.
    - Protects traditional knowledge.
    solution: 'Step 1: Indian Patents Bill amendment. Step 2: against biopiracy.'
    mistakes:
      all GM research: c12b10_eth
      all exports: c12b10_eth
