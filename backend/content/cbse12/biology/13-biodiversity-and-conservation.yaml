# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse12-bio
chapter: 13
title: Biodiversity and Conservation
tips:
  c12b_hotspot: 'In-situ: protecting species where they live (national parks, sanctuaries, biosphere reserves, sacred groves). Ex-situ: outside (zoos, seed banks, botanical gardens).'
  c12b_evil: "The 'evil quartet' of biodiversity loss: habitat loss, over-exploitation, species brought in from elsewhere, and co-extinctions. The Nile perch was brought into Lake Victoria."
  b12_earth_summit: "The 1992 Earth Summit was in Brazil."
  b12_hotspots: "Myers first named 10 hotspots in 1988; the list has since grown to more than thirty."
  b12_humboldt: "A German explorer of South American jungles described it."
  b12_india_hotspots: "Western Ghats–Sri Lanka, Indo-Burma and Himalaya."
  b12_india_land: "India is large but holds a small fraction of the world's land."
  b12_india_species: "India's share of species is more than three times its share of land."
  b12_megadiversity: "India is one of a small group of countries that together hold most of the world's species."
  b12_rivet: "The rivet popper analogy is by a Stanford ecologist also known for 'The Population Bomb'."
  b12_sacred_grove: "Communities protect them for religious reasons."
  b12_tropics: "Warm, stable climates over long times allow more species."
  c12b13_level: 'Biodiversity has three levels: genetic (variety within a species), species (number of species), ecological (variety of ecosystems).'
  c12b13_cons: In-situ protects species where they live (parks, sanctuaries, hotspots, sacred groves); ex-situ protects them elsewhere (zoos, gardens, seed banks, cryopreservation).
  c12b13_evil: "Recall the four big causes of biodiversity loss and ask which fits the story: losing homes, taking too many, invaders, or partners dying out."
concepts:
- code: cbse12b.biodiv.patterns
  title: Biodiversity and its patterns
  notes: |
    Biodiversity: genetic (Rauwolfia vomitoria reserpine variation; >50,000 rice strains, 1,000 mango varieties in India),
    species, ecological diversity. Number of species: ~1.5 million described; estimated ~7 million (Robert May). India: 2.4% of
    world land area, ~8.1% of species; one of 12 mega-diversity countries. Patterns: latitudinal gradient (more species towards
    tropics—stable, long evolutionary time, more solar energy); species–area relationship (Humboldt: log S = log C + Z log A;
    Z 0.1–0.2, steeper 0.6–1.2 for very large areas). Importance: rivet popper hypothesis (Paul Ehrlich); stable, productive
    communities (David Tilman).
  explanations:
    text: 'Biodiversity is the variety of life: genetic diversity within species, the number of species, and the variety of ecosystems. It is highest near the tropics. India is one of the world''s 12 mega-diversity countries.'
    visual: 'Draw a globe with species numbers rising from the poles to the equator: few at the poles, the most in tropical rainforests.'
    step_by_step: 'Step 1: Identify the level of diversity (genetic, species, ecological). Step 2: Latitudinal gradient: more species toward the equator. Step 3: Species–area: more area, more species.'
    real_world: India has more than 50,000 varieties of rice and about 1,000 varieties of mango.
  picture:
    kind: compare
    columns:
    - title: Level
      points:
      - genetic
      - species
      - ecological
    - title: Example
      points:
      - 50,000 rice strains
      - number of bird species
      - forests, wetlands, deserts
    alt: Three levels of biodiversity with examples.
  activity:
    type: formula
    prompt: 'Species–area relation: S = C × A^Z. Here C = 10. Z is usually 0.1–0.2 for small areas; near 1 for whole continents.'
    inputs:
    - name: a
      label: Area A
      min: 1
      max: 100
      step: 1
      start: 1
    - name: z
      label: Z
      min: 0.1
      max: 1.2
      step: 0.05
      start: 0.1
    outputs:
    - name: s
      label: Species S
      expr: 10*a^z
      places: 1
    goals:
    - prompt: Z = 0.2. How much area gives twice the species of A = 1?
      want:
        z: 0.2
        s:
        - 19.9
        - 20.1
      mistakes:
      - when:
          z: 0.2
          a: 2
        say: Twice the area gives only 2^0.2 ≈ 1.15 times the species. With Z = 0.2, doubling S needs 2⁵ = 32 times the area.
      - when:
          z: 0.2
          a:
          - 3
          - 31
        say: 'Not enough area yet: with Z = 0.2, doubling S needs 32 times the area.'
    - prompt: Make doubling the area double the species, with A = 2.
      want:
        a: 2
        s: 20
      mistakes:
      - when:
          a: 2
          z:
          - 0.1
          - 0.5
        say: With a small Z, doubling area adds only a few species. For S to double with A, Z must be 1.
    - prompt: Z = 0.15. Make S about 18.
      want:
        z: 0.15
        s:
        - 17.7
        - 18.3
      mistakes:
      - when:
          z: 0.15
          a: 18
        say: 18 is the species count you want, not the area. S = 10 × A^0.15.
  lesson:
    - teach: 'Biodiversity exists at three levels. Genetic diversity: one species varies, like Rauwolfia vomitoria making different amounts of reserpine in different places, or India''s more than 50,000 rice strains. Species diversity: the number and kinds of species. Ecological diversity: the variety of ecosystems, like India''s deserts, rainforests, mangroves, coral reefs and alpine meadows.'
      check:
        prompt: India's many rice strains show which level of biodiversity?
        options:
        - genetic
        - species
        - ecological
        answer: genetic
        why: They are variations within one species.
    - teach: About 1.5 million species are described; Robert May estimated about 7 million in total. India has only 2.4% of the world's land but about 8.1% of its species, and is one of 12 mega-diversity countries. Species increase from the poles towards the equator (latitudinal gradient), because the tropics have had a long undisturbed time to evolve, steady seasons and more solar energy.
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 0
          label: 'pole: few species'
        - at: 5
          label: temperate
        - at: 10
          label: 'equator: most species'
        alt: Species numbers rise from the poles towards the equator.
      check:
        prompt: Why do the tropics have more species?
        options:
        - long undisturbed time and more solar energy
        - they are colder
        - they have fewer habitats
        answer: long undisturbed time and more solar energy
        why: More time to diversify and more energy for productivity.
    - teach: 'Humboldt found species richness rises with area but at a slowing rate: log S = log C + Z log A, where Z (the slope) is usually 0.1–0.2, and steeper (0.6–1.2) for very large areas like whole continents. Diverse communities are more stable and productive (David Tilman). Ehrlich''s rivet popper idea compares species to rivets on a plane: losing a few may not matter, but losing key ones can crash the ecosystem.'
      check:
        prompt: 'In log S = log C + Z log A, Z is the:'
        options:
        - slope (regression coefficient)
        - number of species
        - area
        answer: slope (regression coefficient)
        why: It shows how fast species rise with area.
  items:
  - prompt: India has about what percentage of the world's land area (to one decimal)?
    answer: '2.4'
    check: Rational(24,10)
    difficulty: 1
    hints:
    - Small share.
    - 2.4.
    solution: 2.4%.
    mistakes: {"8.1": "b12_india_land", "12": "b12_india_land"}
  - prompt: India has about what percentage of the world's recorded species (to one decimal)?
    answer: '8.1'
    check: Rational(81,10)
    difficulty: 2
    hints:
    - Much more than its land share.
    - 8.1.
    solution: About 8.1%.
    mistakes: {"2.4": "b12_india_species", "12": "b12_india_species"}
  - prompt: How many mega-diversity countries are there?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - India is one.
    - Twelve.
    solution: '12.'
    mistakes: {"34": "b12_megadiversity", "3": "b12_megadiversity", "17": "b12_megadiversity"}
  - prompt: 'Species diversity is highest in:'
    options:
    - tropical regions
    - polar regions
    - deserts
    - high mountains
    answer: tropical regions
    difficulty: 1
    hints:
    - Latitudinal gradient.
    - Rainforests.
    solution: Tropical regions.
    mistakes: {"polar regions": "b12_tropics", "deserts": "b12_tropics", "high mountains": "b12_tropics"}
  - prompt: 'The ''rivet popper'' hypothesis was proposed by:'
    options:
    - Paul Ehrlich
    - Alexander von Humboldt
    - David Tilman
    - Robert May
    answer: Paul Ehrlich
    difficulty: 2
    hints:
    - Aeroplane rivets.
    - Losing species weakens ecosystems.
    solution: Paul Ehrlich.
    mistakes: {"Alexander von Humboldt": "b12_rivet", "David Tilman": "b12_rivet", "Robert May": "b12_rivet"}
  - prompt: 'The species–area relationship was described by:'
    options:
    - Alexander von Humboldt
    - Charles Darwin
    - Gregor Mendel
    - Paul Ehrlich
    answer: Alexander von Humboldt
    difficulty: 2
    hints:
    - German naturalist.
    - South America.
    solution: Alexander von Humboldt.
    mistakes: {"Charles Darwin": "b12_humboldt", "Gregor Mendel": "b12_humboldt", "Paul Ehrlich": "b12_humboldt"}
  - prompt: About how many species have been described worldwide (in millions)?
    answer: '1.5'
    check: Rational(3,2)
    difficulty: 1
    hints:
    - Far fewer than the estimated total.
    - Between 1 and 2 million.
    solution: 'Step 1: recorded species. Step 2: about 1.5 million.'
    mistakes:
      '7': c12b13_level
      '50': c12b13_level
  - prompt: Robert May estimated the total number of species on Earth at about how many million?
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - Much more than the described number.
    - He used ratios from well-studied groups.
    solution: 'Step 1: extrapolation. Step 2: about 7 million.'
    mistakes:
      '1.5': c12b13_level
      '70': c12b13_level
  - prompt: 'India''s variety of deserts, rainforests, mangroves and coral reefs shows:'
    options:
    - ecological diversity
    - genetic diversity
    - species diversity
    answer: ecological diversity
    difficulty: 1
    hints:
    - These are whole ecosystems.
    - Not species, not genes.
    solution: 'Step 1: ecosystem variety. Step 2: ecological diversity.'
    mistakes:
      genetic diversity: c12b13_level
      species diversity: c12b13_level
  - prompt: 'Rauwolfia vomitoria in different Himalayan ranges varies in its amount of:'
    options:
    - reserpine
    - chlorophyll
    - starch
    answer: reserpine
    difficulty: 2
    hints:
    - It is an active medicinal chemical.
    - This shows genetic diversity.
    solution: 'Step 1: variation within a species. Step 2: reserpine.'
    mistakes:
      chlorophyll: c12b13_level
      starch: c12b13_level
  - prompt: 'For very large areas like whole continents, Z in the species–area relationship is about:'
    options:
    - 0.6–1.2
    - 0.1–0.2
    - '0'
    answer: 0.6–1.2
    difficulty: 3
    hints:
    - The line gets steeper.
    - Higher than the usual small-area range.
    solution: 'Step 1: large regions. Step 2: Z of 0.6–1.2.'
    mistakes:
      0.1–0.2: c12b13_level
      '0': c12b13_level
  - prompt: About how many mango varieties are there in India?
    answer: '1000'
    check: '1000'
    difficulty: 2
    hints:
    - Far fewer than rice strains.
    - A round number in the thousands.
    solution: 'Step 1: genetic diversity in mango. Step 2: about 1,000.'
    mistakes:
      '50000': c12b13_level
      '100': c12b13_level
  - prompt: Which group has the most described species?
    options:
    - insects
    - mammals
    - birds
    answer: insects
    difficulty: 1
    hints:
    - More than 70% of animals.
    - They are small and very varied.
    solution: 'Step 1: most numerous group. Step 2: insects.'
    mistakes:
      mammals: c12b13_level
      birds: c12b13_level
  - prompt: 'David Tilman''s experiments showed that plots with more species:'
    options:
    - varied less in total biomass year to year
    - always had fewer plants
    - had no productivity
    answer: varied less in total biomass year to year
    difficulty: 2
    hints:
    - He studied stability.
    - Diversity buffers change.
    solution: 'Step 1: more species, more stable. Step 2: less variation, higher productivity.'
    mistakes:
      always had fewer plants: c12b13_level
      had no productivity: c12b13_level
  - prompt: 'The latitudinal gradient means species diversity:'
    options:
    - decreases from equator to poles
    - increases from equator to poles
    - is the same everywhere
    answer: decreases from equator to poles
    difficulty: 1
    hints:
    - The Amazon has the most species.
    - Polar regions have very few.
    solution: 'Step 1: highest in tropics. Step 2: falls towards the poles.'
    mistakes:
      increases from equator to poles: c12b13_level
      is the same everywhere: c12b13_level
- code: cbse12b.biodiv.conservation
  title: Loss of biodiversity and conservation
  after:
  - cbse12b.biodiv.patterns
  notes: |
    Loss: IUCN Red List (2004) 784 extinctions in 500 years (dodo, quagga, thylacine, Steller's sea cow; three subspecies of
    tiger); causes—evil quartet: habitat loss and fragmentation (rainforests from 14% to 6% of land), over-exploitation (Steller's
    sea cow, passenger pigeon), alien species invasions (Nile perch in Lake Victoria; Parthenium, Lantana, water hyacinth; African
    catfish Clarias gariepinus), co-extinctions. Conservation: reasons—narrowly utilitarian, broadly utilitarian (Amazon produces
    ~20% of oxygen by photosynthesis), ethical. In-situ: biodiversity hotspots (34 globally; India has Western Ghats and Sri Lanka,
    Indo-Burma, Himalaya), biosphere reserves (14), national parks (90), wildlife sanctuaries (448), sacred groves (Khasi and
    Jaintia hills, Western Ghats, Aravalli). Ex-situ: zoos, botanical gardens, cryopreservation, seed banks. Earth Summit Rio
    1992; World Summit Johannesburg 2002.
  explanations:
    text: 'Biodiversity is being lost fast, mainly through habitat loss, over-exploitation, invasive alien species and co-extinctions. We conserve it in place (in-situ: national parks, sanctuaries, hotspots, sacred groves) and outside its home (ex-situ: zoos, seed banks).'
    visual: 'Draw two boxes: in-situ (a tiger in a national park in its own forest) and ex-situ (seeds frozen in a seed bank, animals in a zoo).'
    step_by_step: 'Step 1: Identify the threat (evil quartet). Step 2: Choose a conservation method. Step 3: In place → in-situ; outside → ex-situ.'
    real_world: Kerala's Western Ghats, part of a global biodiversity hotspot, include Silent Valley National Park, saved from a dam project in the 1980s.
  picture:
    kind: compare
    columns:
    - title: Method
      points:
      - in-situ
      - ex-situ
    - title: Where
      points:
      - in the natural habitat
      - outside the natural habitat
    - title: Examples
      points:
      - national parks, sacred groves
      - zoos, seed banks
    alt: In-situ and ex-situ conservation compared.
  activity:
    type: sort
    prompt: In situ (in its home) or ex situ (taken out of it)?
    bins:
    - In situ
    - Ex situ
    items:
    - label: National parks
      bin: In situ
      clue: Are the animals protected where they live?
      why: Protected in their natural habitat.
    - label: Wildlife sanctuaries
      bin: In situ
      clue: Do the animals stay in the wild?
      why: In situ.
    - label: Biosphere reserves
      bin: In situ
      clue: Is the whole ecosystem protected where it is?
      why: In situ.
    - label: Sacred groves
      bin: In situ
      clue: Forests protected by communities, where they grow. Which kind?
      why: In situ.
    - label: Biodiversity hotspots
      bin: In situ
      clue: Protecting rich regions as they are. Which kind?
      why: In situ.
    - label: Zoological parks
      bin: Ex situ
      clue: Are the animals taken out of their habitat?
      why: Ex situ.
    - label: Botanical gardens
      bin: Ex situ
      clue: Plants grown away from their home. Which kind?
      why: Ex situ.
    - label: Seed banks
      bin: Ex situ
      clue: Seeds stored away from where they grow. Which kind?
      why: Ex situ.
    - label: Cryopreservation of gametes
      bin: Ex situ
      clue: Frozen at −196 °C in a lab. Which kind?
      why: Ex situ.
    - label: Tissue culture of rare plants
      bin: Ex situ
      clue: Grown in a lab. Which kind?
      why: Ex situ.
  lesson:
    - teach: 'Extinctions are speeding up: the IUCN Red List (2004) records 784 extinctions in the last 500 years, including the dodo, quagga, thylacine, Steller''s sea cow and three tiger subspecies. The ''evil quartet'' of causes: habitat loss and fragmentation (rainforests fell from 14% to 6% of land), over-exploitation (Steller''s sea cow, passenger pigeon), alien species invasions (Nile perch in Lake Victoria, Parthenium, Lantana, water hyacinth, African catfish) and co-extinctions (a parasite dies with its host).'
      picture:
        kind: compare
        columns:
        - title: Cause
          points:
          - habitat loss
          - over-exploitation
          - alien species
          - co-extinction
        - title: Example
          points:
          - rainforest clearing
          - Steller's sea cow
          - Nile perch
          - parasite of a lost host
        alt: The four main causes of biodiversity loss with examples.
      check:
        prompt: 'Water hyacinth choking Indian ponds is an example of:'
        options:
        - alien species invasion
        - over-exploitation
        - co-extinction
        answer: alien species invasion
        why: It was brought from elsewhere and spread unchecked.
    - teach: 'Why conserve? Narrowly utilitarian: food, fibre, medicines. Broadly utilitarian: services like oxygen (the Amazon makes about 20% of Earth''s oxygen by photosynthesis), pollination and flood control. Ethical: every species has a right to exist. In-situ conservation protects whole ecosystems: biodiversity hotspots (34 worldwide; India shares the Western Ghats and Sri Lanka, Indo-Burma and Himalaya), biosphere reserves (14), national parks (90), wildlife sanctuaries (448) and sacred groves.'
      check:
        prompt: Protecting forests because they give oxygen and pollination is which argument?
        options:
        - broadly utilitarian
        - narrowly utilitarian
        - ethical
        answer: broadly utilitarian
        why: These are ecosystem services, not direct products.
    - teach: 'Ex-situ conservation keeps threatened species outside their habitat: zoos, botanical gardens, wildlife safari parks, and storing gametes in cryopreservation (−196 °C) or seeds in seed banks. International action: the Earth Summit in Rio de Janeiro (1992) agreed on the Convention on Biological Diversity; the World Summit in Johannesburg (2002) pledged to reduce biodiversity loss by 2010.'
      picture:
        kind: compare
        columns:
        - title: In-situ
          points:
          - in natural habitat
          - national parks
          - sacred groves
        - title: Ex-situ
          points:
          - outside habitat
          - zoos, botanical gardens
          - seed banks, cryopreservation
        alt: In-situ and ex-situ conservation compared.
      check:
        prompt: 'Storing gametes at very low temperature is:'
        options:
        - cryopreservation
        - a sacred grove
        - a national park
        answer: cryopreservation
        why: Liquid nitrogen keeps cells alive for a long time.
  items:
  - prompt: How many biodiversity hotspots are there worldwide?
    answer: '34'
    check: '34'
    difficulty: 1
    hints:
    - India has three.
    - Thirty-four.
    solution: '34.'
    mistakes: {"3": "b12_hotspots", "12": "b12_hotspots"}
  - prompt: How many global biodiversity hotspots include parts of India?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Western Ghats, Indo-Burma, Himalaya.
    - Three.
    solution: '3.'
    mistakes: {"4": "b12_india_hotspots", "34": "b12_india_hotspots", "2": "b12_india_hotspots"}
  - prompt: 'A seed bank is an example of:'
    options:
    - ex-situ conservation
    - in-situ conservation
    - a hotspot
    - a sacred grove
    answer: ex-situ conservation
    difficulty: 1
    hints:
    - Outside habitat.
    - Stored.
    solution: Ex-situ conservation.
    mistakes:
      in-situ conservation: c12b_hotspot
  - prompt: 'The Nile perch introduced into Lake Victoria shows the threat of:'
    options:
    - alien species invasion
    - co-extinction
    - habitat loss
    - over-exploitation
    answer: alien species invasion
    difficulty: 2
    hints:
    - Ate native cichlids.
    - Introduced fish.
    solution: Alien species invasion.
    mistakes:
      habitat loss: c12b_evil
  - prompt: 'Sacred groves are:'
    options:
    - forest patches protected by local communities for religious reasons
    - zoos
    - seed banks
    - botanical gardens
    answer: forest patches protected by local communities for religious reasons
    difficulty: 2
    hints:
    - Khasi hills, Western Ghats.
    - Community.
    solution: Forest patches protected by communities for religious reasons.
    mistakes: {"zoos": "b12_sacred_grove", "seed banks": "b12_sacred_grove", "botanical gardens": "b12_sacred_grove"}
  - prompt: 'The Earth Summit on biodiversity was held in 1992 in:'
    options:
    - Rio de Janeiro
    - Johannesburg
    - Kyoto
    - Paris
    answer: Rio de Janeiro
    difficulty: 2
    hints:
    - Brazil.
    - Convention on Biological Diversity.
    solution: Rio de Janeiro.
    mistakes: {"Johannesburg": "b12_earth_summit", "Kyoto": "b12_earth_summit", "Paris": "b12_earth_summit"}
  - prompt: How many extinctions in the last 500 years did the 2004 IUCN Red List record?
    answer: '784'
    check: '784'
    difficulty: 2
    hints:
    - A three-digit number.
    - Between 700 and 800.
    solution: 'Step 1: IUCN 2004. Step 2: 784 species.'
    mistakes:
      '338': c12b13_evil
      '87': c12b13_evil
  - prompt: Rainforests once covered 14% of Earth's land. What percentage do they cover now?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Less than half of the original.
    - A single digit.
    solution: 'Step 1: heavy clearing. Step 2: about 6%.'
    mistakes:
      '14': c12b13_evil
      '10': c12b13_evil
  - prompt: 'The passenger pigeon became extinct mainly because of:'
    options:
    - over-exploitation (hunting)
    - alien species
    - co-extinction
    answer: over-exploitation (hunting)
    difficulty: 1
    hints:
    - Huge flocks were shot in North America.
    - Humans took too many.
    solution: 'Step 1: mass hunting. Step 2: over-exploitation.'
    mistakes:
      alien species: c12b13_evil
      co-extinction: c12b13_evil
  - prompt: 'When a host fish dies out, its unique parasite also dies out. This is:'
    options:
    - co-extinction
    - habitat loss
    - over-exploitation
    answer: co-extinction
    difficulty: 1
    hints:
    - Two species linked together.
    - Co means together.
    solution: 'Step 1: obligate link. Step 2: co-extinction.'
    mistakes:
      habitat loss: c12b13_evil
      over-exploitation: c12b13_evil
  - prompt: About what percentage of Earth's oxygen does the Amazon forest produce?
    answer: '20'
    check: '20'
    difficulty: 2
    hints:
    - It is called the lungs of the planet.
    - About a fifth.
    solution: 'Step 1: huge photosynthesis. Step 2: about 20%.'
    mistakes:
      '50': c12b13_cons
      '5': c12b13_cons
  - prompt: How many biosphere reserves does India have (as in NCERT)?
    answer: '14'
    check: '14'
    difficulty: 2
    hints:
    - Fewer than the national parks.
    - Between 10 and 20.
    solution: 'Step 1: NCERT count. Step 2: 14.'
    mistakes:
      '90': c12b13_cons
      '448': c12b13_cons
  - prompt: 'A botanical garden is an example of:'
    options:
    - ex-situ conservation
    - in-situ conservation
    - a hotspot
    answer: ex-situ conservation
    difficulty: 1
    hints:
    - Plants are grown away from their natural home.
    - Ex means outside.
    solution: 'Step 1: outside habitat. Step 2: ex-situ.'
    mistakes:
      in-situ conservation: c12b13_cons
      a hotspot: c12b13_cons
  - prompt: 'Sacred groves in Meghalaya are found in the:'
    options:
    - Khasi and Jaintia hills
    - Thar desert
    - Sundarbans
    answer: Khasi and Jaintia hills
    difficulty: 2
    hints:
    - Hills of north-east India.
    - Named after local communities.
    solution: 'Step 1: Meghalaya hills. Step 2: Khasi and Jaintia.'
    mistakes:
      Thar desert: c12b13_cons
      Sundarbans: c12b13_cons
  - prompt: 'The 2002 World Summit on Sustainable Development was held in:'
    options:
    - Johannesburg
    - Rio de Janeiro
    - Kyoto
    answer: Johannesburg
    difficulty: 2
    hints:
