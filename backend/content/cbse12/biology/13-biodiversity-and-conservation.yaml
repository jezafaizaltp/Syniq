# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse12-bio
chapter: 13
title: Biodiversity and Conservation
tips:
  c12b_hotspot: 'In-situ: protecting species where they live (national parks, sanctuaries, biosphere reserves, sacred groves). Ex-situ: outside (zoos, seed banks, botanical gardens).'
  c12b_evil: 'The ''evil quartet'' of biodiversity loss: habitat loss and fragmentation, over-exploitation, alien species invasions, co-extinctions.'
  b12_earth_summit: "The 1992 Earth Summit was in Brazil."
  b12_hotspots: "Myers first named 10 hotspots in 1988; the list has since grown to more than thirty."
  b12_humboldt: "A German explorer of South American jungles described it."
  b12_india_hotspots: "Western Ghats–Sri Lanka, Indo-Burma and Himalaya."
  b12_india_land: "India is large but holds a small fraction of the world's land."
  b12_india_species: "India's share of species is more than three times its share of land."
  b12_megadiversity: "India is one of a small group of countries that together hold most of the world's species."
  b12_rivet: "The rivet popper analogy is by a Stanford ecologist also known for 'The Population Bomb'."
  b12_sacred_grove: "Communities protect them for religious reasons."
  b12_tropics: "Warm, stable climates over long times allow more species."
concepts:
- code: cbse12b.biodiv.patterns
  title: Biodiversity and its patterns
  notes: |
    Biodiversity: genetic (Rauwolfia vomitoria reserpine variation; >50,000 rice strains, 1,000 mango varieties in India),
    species, ecological diversity. Number of species: ~1.5 million described; estimated ~7 million (Robert May). India: 2.4% of
    world land area, ~8.1% of species; one of 12 mega-diversity countries. Patterns: latitudinal gradient (more species towards
    tropics—stable, long evolutionary time, more solar energy); species–area relationship (Humboldt: log S = log C + Z log A;
    Z 0.1–0.2, steeper 0.6–1.2 for very large areas). Importance: rivet popper hypothesis (Paul Ehrlich); stable, productive
    communities (David Tilman).
  explanations:
    text: 'Biodiversity is the variety of life: genetic diversity within species, the number of species, and the variety of ecosystems. It is highest near the tropics. India is one of the world''s 12 mega-diversity countries.'
    visual: 'Draw a globe with species numbers rising from the poles to the equator: few at the poles, the most in tropical rainforests.'
    step_by_step: 'Step 1: Identify the level of diversity (genetic, species, ecological). Step 2: Latitudinal gradient: more species toward the equator. Step 3: Species–area: more area, more species.'
    real_world: India has more than 50,000 varieties of rice and about 1,000 varieties of mango.
  picture:
    kind: compare
    columns:
    - title: Level
      points:
      - genetic
      - species
      - ecological
    - title: Example
      points:
      - 50,000 rice strains
      - number of bird species
      - forests, wetlands, deserts
    alt: Three levels of biodiversity with examples.
  activity:
    type: formula
    prompt: 'Species–area relation: S = C × A^Z. Here C = 10. Z is usually 0.1–0.2 for small areas; near 1 for whole continents.'
    inputs:
    - name: a
      label: Area A
      min: 1
      max: 100
      step: 1
      start: 1
    - name: z
      label: Z
      min: 0.1
      max: 1.2
      step: 0.05
      start: 0.1
    outputs:
    - name: s
      label: Species S
      expr: 10*a^z
      places: 1
    goals:
    - prompt: Z = 0.2. How much area gives twice the species of A = 1?
      want:
        z: 0.2
        s:
        - 19.9
        - 20.1
      mistakes:
      - when:
          z: 0.2
          a: 2
        say: Twice the area gives only 2^0.2 ≈ 1.15 times the species. With Z = 0.2, doubling S needs 2⁵ = 32 times the area.
      - when:
          z: 0.2
          a:
          - 3
          - 31
        say: 'Not enough area yet: with Z = 0.2, doubling S needs 32 times the area.'
    - prompt: Make doubling the area double the species, with A = 2.
      want:
        a: 2
        s: 20
      mistakes:
      - when:
          a: 2
          z:
          - 0.1
          - 0.5
        say: With a small Z, doubling area adds only a few species. For S to double with A, Z must be 1.
    - prompt: Z = 0.15. Make S about 18.
      want:
        z: 0.15
        s:
        - 17.7
        - 18.3
      mistakes:
      - when:
          z: 0.15
          a: 18
        say: 18 is the species count you want, not the area. S = 10 × A^0.15.
  items:
  - prompt: India has about what percentage of the world's land area (to one decimal)?
    answer: '2.4'
    check: Rational(24,10)
    difficulty: 1
    hints:
    - Small share.
    - 2.4.
    solution: 2.4%.
    mistakes: {"8.1": "b12_india_land", "12": "b12_india_land"}
  - prompt: India has about what percentage of the world's recorded species (to one decimal)?
    answer: '8.1'
    check: Rational(81,10)
    difficulty: 2
    hints:
    - Much more than its land share.
    - 8.1.
    solution: About 8.1%.
    mistakes: {"2.4": "b12_india_species", "12": "b12_india_species"}
  - prompt: How many mega-diversity countries are there?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - India is one.
    - Twelve.
    solution: '12.'
    mistakes: {"34": "b12_megadiversity", "3": "b12_megadiversity", "17": "b12_megadiversity"}
  - prompt: 'Species diversity is highest in:'
    options:
    - tropical regions
    - polar regions
    - deserts
    - high mountains
    answer: tropical regions
    difficulty: 1
    hints:
    - Latitudinal gradient.
    - Rainforests.
    solution: Tropical regions.
    mistakes: {"polar regions": "b12_tropics", "deserts": "b12_tropics", "high mountains": "b12_tropics"}
  - prompt: 'The ''rivet popper'' hypothesis was proposed by:'
    options:
    - Paul Ehrlich
    - Alexander von Humboldt
    - David Tilman
    - Robert May
    answer: Paul Ehrlich
    difficulty: 2
    hints:
    - Aeroplane rivets.
    - Losing species weakens ecosystems.
    solution: Paul Ehrlich.
    mistakes: {"Alexander von Humboldt": "b12_rivet", "David Tilman": "b12_rivet", "Robert May": "b12_rivet"}
  - prompt: 'The species–area relationship was described by:'
    options:
    - Alexander von Humboldt
    - Charles Darwin
    - Gregor Mendel
    - Paul Ehrlich
    answer: Alexander von Humboldt
    difficulty: 2
    hints:
    - German naturalist.
    - South America.
    solution: Alexander von Humboldt.
    mistakes: {"Charles Darwin": "b12_humboldt", "Gregor Mendel": "b12_humboldt", "Paul Ehrlich": "b12_humboldt"}
- code: cbse12b.biodiv.conservation
  title: Loss of biodiversity and conservation
  after:
  - cbse12b.biodiv.patterns
  notes: |
    Loss: IUCN Red List (2004) 784 extinctions in 500 years (dodo, quagga, thylacine, Steller's sea cow; three subspecies of
    tiger); causes—evil quartet: habitat loss and fragmentation (rainforests from 14% to 6% of land), over-exploitation (Steller's
    sea cow, passenger pigeon), alien species invasions (Nile perch in Lake Victoria; Parthenium, Lantana, water hyacinth; African
    catfish Clarias gariepinus), co-extinctions. Conservation: reasons—narrowly utilitarian, broadly utilitarian (Amazon produces
    ~20% of oxygen by photosynthesis), ethical. In-situ: biodiversity hotspots (34 globally; India has Western Ghats and Sri Lanka,
    Indo-Burma, Himalaya), biosphere reserves (14), national parks (90), wildlife sanctuaries (448), sacred groves (Khasi and
    Jaintia hills, Western Ghats, Aravalli). Ex-situ: zoos, botanical gardens, cryopreservation, seed banks. Earth Summit Rio
    1992; World Summit Johannesburg 2002.
  explanations:
    text: 'Biodiversity is being lost fast, mainly through habitat loss, over-exploitation, invasive alien species and co-extinctions. We conserve it in place (in-situ: national parks, sanctuaries, hotspots, sacred groves) and outside its home (ex-situ: zoos, seed banks).'
    visual: 'Draw two boxes: in-situ (a tiger in a national park in its own forest) and ex-situ (seeds frozen in a seed bank, animals in a zoo).'
    step_by_step: 'Step 1: Identify the threat (evil quartet). Step 2: Choose a conservation method. Step 3: In place → in-situ; outside → ex-situ.'
    real_world: Kerala's Western Ghats, part of a global biodiversity hotspot, include Silent Valley National Park, saved from a dam project in the 1980s.
  picture:
    kind: compare
    columns:
    - title: Method
      points:
      - in-situ
      - ex-situ
    - title: Where
      points:
      - in the natural habitat
      - outside the natural habitat
    - title: Examples
      points:
      - national parks, sacred groves
      - zoos, seed banks
    alt: In-situ and ex-situ conservation compared.
  activity:
    type: sort
    prompt: In situ (in its home) or ex situ (taken out of it)?
    bins:
    - In situ
    - Ex situ
    items:
    - label: National parks
      bin: In situ
      clue: Are the animals protected where they live?
      why: Protected in their natural habitat.
    - label: Wildlife sanctuaries
      bin: In situ
      clue: Do the animals stay in the wild?
      why: In situ.
    - label: Biosphere reserves
      bin: In situ
      clue: Is the whole ecosystem protected where it is?
      why: In situ.
    - label: Sacred groves
      bin: In situ
      clue: Forests protected by communities, where they grow. Which kind?
      why: In situ.
    - label: Biodiversity hotspots
      bin: In situ
      clue: Protecting rich regions as they are. Which kind?
      why: In situ.
    - label: Zoological parks
      bin: Ex situ
      clue: Are the animals taken out of their habitat?
      why: Ex situ.
    - label: Botanical gardens
      bin: Ex situ
      clue: Plants grown away from their home. Which kind?
      why: Ex situ.
    - label: Seed banks
      bin: Ex situ
      clue: Seeds stored away from where they grow. Which kind?
      why: Ex situ.
    - label: Cryopreservation of gametes
      bin: Ex situ
      clue: Frozen at −196 °C in a lab. Which kind?
      why: Ex situ.
    - label: Tissue culture of rare plants
      bin: Ex situ
      clue: Grown in a lab. Which kind?
      why: Ex situ.
  items:
  - prompt: How many biodiversity hotspots are there worldwide?
    answer: '34'
    check: '34'
    difficulty: 1
    hints:
    - India has three.
    - Thirty-four.
    solution: '34.'
    mistakes: {"3": "b12_hotspots", "12": "b12_hotspots"}
  - prompt: How many global biodiversity hotspots include parts of India?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Western Ghats, Indo-Burma, Himalaya.
    - Three.
    solution: '3.'
    mistakes: {"4": "b12_india_hotspots", "34": "b12_india_hotspots", "2": "b12_india_hotspots"}
  - prompt: 'A seed bank is an example of:'
    options:
    - ex-situ conservation
    - in-situ conservation
    - a hotspot
    - a sacred grove
    answer: ex-situ conservation
    difficulty: 1
    hints:
    - Outside habitat.
    - Stored.
    solution: Ex-situ conservation.
    mistakes:
      in-situ conservation: c12b_hotspot
  - prompt: 'The Nile perch introduced into Lake Victoria shows the threat of:'
    options:
    - alien species invasion
    - co-extinction
    - habitat loss
    - over-exploitation
    answer: alien species invasion
    difficulty: 2
    hints:
    - Ate native cichlids.
    - Introduced fish.
    solution: Alien species invasion.
    mistakes:
      habitat loss: c12b_evil
  - prompt: 'Sacred groves are:'
    options:
    - forest patches protected by local communities for religious reasons
    - zoos
    - seed banks
    - botanical gardens
    answer: forest patches protected by local communities for religious reasons
    difficulty: 2
    hints:
    - Khasi hills, Western Ghats.
    - Community.
    solution: Forest patches protected by communities for religious reasons.
    mistakes: {"zoos": "b12_sacred_grove", "seed banks": "b12_sacred_grove", "botanical gardens": "b12_sacred_grove"}
  - prompt: 'The Earth Summit on biodiversity was held in 1992 in:'
    options:
    - Rio de Janeiro
    - Johannesburg
    - Kyoto
    - Paris
    answer: Rio de Janeiro
    difficulty: 2
    hints:
    - Brazil.
    - Convention on Biological Diversity.
    solution: Rio de Janeiro.
    mistakes: {"Johannesburg": "b12_earth_summit", "Kyoto": "b12_earth_summit", "Paris": "b12_earth_summit"}
