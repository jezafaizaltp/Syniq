# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse12-bio
chapter: 9
title: 'Biotechnology: Principles and Processes'
tips:
  c12b_re: Restriction enzymes cut DNA at specific palindromic sequences (EcoRI cuts GAATTC), often leaving sticky ends.
  c12b_select: 'Insertional inactivation: inserting a gene into lacZ stops blue colour, so recombinant colonies are white.'
  b12_cohen_boyer: "Recombinant DNA was first made in 1972 by two American scientists."
  b12_downstream: "Upstream is before fermentation, downstream is after."
  b12_ecori: "Count the letters in GAATTC."
  b12_ethanol_ppt: "DNA is insoluble in cold alcohol and comes out as threads."
  b12_gel: "DNA is negatively charged, so it moves towards the opposite charge."
  b12_marker: "Only bacteria that took up the vector survive on the antibiotic: the gene lets you select them."
  b12_pcr: "Each cycle doubles the DNA: 2ⁿ copies after n cycles."
  b12_scissors: "Restriction enzymes cut DNA at specific places."
  b12_taq: "PCR heats DNA to about 94 °C every cycle. The enzyme comes from a hot-spring bacterium."
concepts:
- code: cbse12b.biotech.tools
  title: Tools of recombinant DNA technology
  notes: |
    Principles: genetic engineering and bioprocess engineering. First recombinant DNA: Cohen and Boyer (1972), antibiotic
    resistance gene in Salmonella plasmid. Tools: restriction enzymes (molecular scissors; EcoRI from E. coli RY13; recognise
    palindromes like 5′-GAATTC-3′; sticky ends), DNA ligase (molecular glue), gel electrophoresis (DNA moves to anode; smaller
    fragments travel further; stained with ethidium bromide, seen under UV), cloning vectors (plasmids, bacteriophages; features:
    ori, selectable markers like ampicillin/tetracycline resistance, cloning sites; pBR322; Ti plasmid of Agrobacterium; disarmed
    retroviruses). Competent hosts (CaCl₂, heat shock; microinjection; gene gun/biolistics).
  explanations:
    text: Genetic engineering moves genes between organisms. Restriction enzymes cut DNA at specific sequences, DNA ligase joins pieces, and vectors like plasmids carry the new gene into a host cell, which then copies it.
    visual: Draw EcoRI cutting GAATTC between G and A on both strands, leaving short single-stranded 'sticky ends' that can pair with any DNA cut by the same enzyme.
    step_by_step: 'Step 1: Cut the gene and plasmid with the same restriction enzyme. Step 2: Join with DNA ligase. Step 3: Insert into a competent host. Step 4: Select cells carrying the plasmid using a marker.'
    real_world: Human insulin for diabetics is now made by bacteria carrying the human insulin gene.
  picture:
    kind: flow
    steps:
    - Cut DNA with restriction enzyme
    - Cut plasmid with same enzyme
    - Join with DNA ligase
    - Insert into host bacterium
    - Select transformed cells
    alt: Making recombinant DNA and putting it into a host.
  activity:
    type: sort
    prompt: Which tool of recombinant DNA technology is it?
    bins:
    - Restriction enzyme
    - DNA ligase
    - Vector
    - Selectable marker
    items:
    - label: EcoRI
      bin: Restriction enzyme
      clue: Named after E. coli RY13, it cuts at GAATTC. What does it do?
      why: 'A molecular scissor: restriction enzyme.'
    - label: Cuts at a palindromic sequence
      bin: Restriction enzyme
      clue: Which tool recognises a sequence that reads the same both ways?
      why: A restriction endonuclease.
    - label: Leaves sticky ends
      bin: Restriction enzyme
      clue: Which tool cuts DNA leaving single-stranded overhangs?
      why: A restriction enzyme cutting off-centre.
    - label: Joins DNA fragments
      bin: DNA ligase
      clue: Which tool is the molecular glue?
      why: DNA ligase.
    - label: Seals the sugar–phosphate backbone
      bin: DNA ligase
      clue: Which enzyme forms the final phosphodiester bond?
      why: DNA ligase.
    - label: pBR322
      bin: Vector
      clue: A plasmid that carries foreign DNA into E. coli. Which tool?
      why: A cloning vector.
    - label: Has an ori, where copying starts
      bin: Vector
      clue: Which tool must copy itself inside the host?
      why: A vector needs an origin of replication.
    - label: Ti plasmid of Agrobacterium
      bin: Vector
      clue: Used to carry genes into plants. Which tool?
      why: A vector (disarmed so it no longer causes tumours).
    - label: Ampicillin-resistance gene, ampR
      bin: Selectable marker
      clue: Lets only cells with the plasmid survive ampicillin. Which tool?
      why: A selectable marker.
    - label: Lets only transformed cells grow on an antibiotic
      bin: Selectable marker
      clue: Which tool sorts transformed cells from the rest?
      why: A selectable marker.
  items:
  - prompt: How many base pairs long is the EcoRI recognition site GAATTC?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Count the letters.
    - Six.
    solution: '6.'
    mistakes: {"4": "b12_ecori", "8": "b12_ecori", "3": "b12_ecori"}
  - prompt: 'Restriction enzymes are called molecular:'
    options:
    - scissors
    - glue
    - taxis
    - copiers
    answer: scissors
    difficulty: 1
    hints:
    - They cut.
    - Ligase is glue.
    solution: Scissors.
    mistakes: {"glue": "b12_scissors", "taxis": "b12_scissors", "copiers": "b12_scissors"}
  - prompt: 'In gel electrophoresis, DNA fragments move towards the:'
    options:
    - anode (positive electrode)
    - cathode
    - centre
    - top
    answer: anode (positive electrode)
    difficulty: 2
    hints:
    - DNA is negatively charged.
    - Phosphates.
    solution: The anode.
    mistakes: {"cathode": "b12_gel", "centre": "b12_gel", "top": "b12_gel"}
  - prompt: 'Restriction enzymes recognise sequences that are:'
    options:
    - palindromic
    - random
    - always 20 bp
    - made of RNA
    answer: palindromic
    difficulty: 2
    hints:
    - Read the same both ways on two strands.
    - GAATTC.
    solution: Palindromic.
    mistakes:
      random: c12b_re
  - prompt: 'A gene for antibiotic resistance in a vector acts as a:'
    options:
    - selectable marker
    - origin of replication
    - restriction site
    - promoter only
    answer: selectable marker
    difficulty: 2
    hints:
    - Picks out transformants.
    - Survive on antibiotic.
    solution: A selectable marker.
    mistakes: {"origin of replication": "b12_marker", "restriction site": "b12_marker", "promoter only": "b12_marker"}
  - prompt: 'The first recombinant DNA was made by:'
    options:
    - Cohen and Boyer
    - Watson and Crick
    - Mendel and Morgan
    - Fleming and Florey
    answer: Cohen and Boyer
    difficulty: 2
    hints:
    - '1972.'
    - Plasmid of Salmonella.
    solution: Stanley Cohen and Herbert Boyer.
    mistakes: {"Watson and Crick": "b12_cohen_boyer", "Mendel and Morgan": "b12_cohen_boyer", "Fleming and Florey": "b12_cohen_boyer"}
- code: cbse12b.biotech.process
  title: Processes of recombinant DNA technology
  after:
  - cbse12b.biotech.tools
  notes: |
    Isolation of DNA (lysozyme, cellulase, chitinase; RNase, protease; chilled ethanol precipitation). Cutting at specific
    locations; amplification by PCR (Kary Mullis; denaturation ~94 °C, primer annealing, extension by thermostable Taq
    polymerase from Thermus aquaticus; ~1 billion copies after 30 cycles). Ligation into vector; insertion into host;
    selection: antibiotic resistance, insertional inactivation (blue–white screening with lacZ / β-galactosidase). Obtaining the
    foreign gene product: bioreactors (stirred-tank; sterile, controlled temperature, pH, oxygen); downstream processing
    (separation, purification, formulation, quality control).
  explanations:
    text: 'Recombinant DNA technology follows clear steps: isolate DNA, cut it, copy the gene many times by PCR, join it into a vector, put it into a host, and grow the host in big bioreactors to make the product, which is then purified.'
    visual: 'Draw a PCR cycle: heat to split DNA strands, cool so primers stick, warm so Taq polymerase builds new strands. Each cycle doubles the DNA.'
    step_by_step: 'Step 1: PCR doubles DNA each cycle: copies = 2ⁿ. Step 2: Blue–white screening: white colonies have the insert. Step 3: Bioreactors grow cells at scale. Step 4: Downstream processing purifies the product.'
    real_world: PCR tests were used worldwide to detect the COVID-19 virus quickly.
  picture:
    kind: compare
    columns:
    - title: PCR step
      points:
      - denaturation
      - annealing
      - extension
    - title: What happens
      points:
      - heat splits DNA strands
      - primers bind
      - Taq polymerase builds new DNA
    alt: The three steps of each PCR cycle.
  activity:
    type: order
    prompt: Put the steps of making a product by recombinant DNA technology in order.
    steps:
    - Isolate the DNA
    - Cut it with a restriction enzyme
    - Separate the fragments by gel electrophoresis
    - Ligate the gene into a vector
    - Put the recombinant DNA into a host (transformation)
    - Select the recombinant cells
    - Grow them in a bioreactor
    - 'Downstream processing: purify the product'
    reasons:
      Cut it with a restriction enzyme: You can't cut DNA until it has been isolated.
      Separate the fragments by gel electrophoresis: Fragments exist only after cutting.
      Ligate the gene into a vector: You need the gene fragment (purified from the gel) before you can join it into a vector.
      Put the recombinant DNA into a host (transformation): The recombinant DNA has to be made before it can go into a host.
      Select the recombinant cells: Selection sorts the host cells, so they must be transformed first.
      Grow them in a bioreactor: Only the selected recombinants are scaled up.
      'Downstream processing: purify the product': The product can only be purified after it has been made.
  items:
  - prompt: Starting with one DNA molecule, how many copies are there after 10 PCR cycles?
    answer: '1024'
    check: 2**10
    difficulty: 2
    hints:
    - 2ⁿ.
    - 2¹⁰.
    solution: 1,024.
    mistakes: {"20": "b12_pcr", "100": "b12_pcr", "512": "b12_pcr"}
  - prompt: How many copies after 3 PCR cycles, starting from one?
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - Doubles each time.
    - 2³.
    solution: '8.'
    mistakes: {"6": "b12_pcr", "3": "b12_pcr", "9": "b12_pcr"}
  - prompt: 'Taq polymerase is used in PCR because it is:'
    options:
    - heat-stable
    - cheap only
    - red in colour
    - an RNA enzyme
    answer: heat-stable
    difficulty: 2
    hints:
    - From hot-spring bacteria.
    - Survives 94 °C.
    solution: Heat-stable.
    mistakes: {"cheap only": "b12_taq", "red in colour": "b12_taq", "an RNA enzyme": "b12_taq"}
  - prompt: 'In blue–white screening, recombinant colonies are:'
    options:
    - white
    - blue
    - red
    - invisible
    answer: white
    difficulty: 2
    hints:
    - Insert disrupts lacZ.
    - No blue colour.
    solution: White.
    mistakes:
      blue: c12b_select
  - prompt: 'DNA is precipitated out of solution by adding:'
    options:
    - chilled ethanol
    - hot water
    - salt only
    - sugar
    answer: chilled ethanol
    difficulty: 2
    hints:
    - Fine threads appear.
    - Cold alcohol.
    solution: Chilled ethanol.
    mistakes: {"hot water": "b12_ethanol_ppt", "salt only": "b12_ethanol_ppt", "sugar": "b12_ethanol_ppt"}
  - prompt: 'Separation and purification of the product after fermentation is called:'
    options:
    - downstream processing
    - upstream processing
    - transformation
    - ligation
    answer: downstream processing
    difficulty: 1
    hints:
    - After the bioreactor.
    - Purify.
    solution: Downstream processing.
    mistakes: {"upstream processing": "b12_downstream", "transformation": "b12_downstream", "ligation": "b12_downstream"}
