# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse12-bio
chapter: 9
title: 'Biotechnology: Principles and Processes'
tips:
  c12b_re: Restriction enzymes cut DNA at specific palindromic sequences (EcoRI cuts GAATTC), often leaving sticky ends.
  c12b_select: 'Insertional inactivation: inserting a gene into lacZ stops blue colour, so recombinant colonies are white.'
concepts:
- code: cbse12b.biotech.tools
  title: Tools of recombinant DNA technology
  notes: |
    Principles: genetic engineering and bioprocess engineering. First recombinant DNA: Cohen and Boyer (1972), antibiotic
    resistance gene in Salmonella plasmid. Tools: restriction enzymes (molecular scissors; EcoRI from E. coli RY13; recognise
    palindromes like 5′-GAATTC-3′; sticky ends), DNA ligase (molecular glue), gel electrophoresis (DNA moves to anode; smaller
    fragments travel further; stained with ethidium bromide, seen under UV), cloning vectors (plasmids, bacteriophages; features:
    ori, selectable markers like ampicillin/tetracycline resistance, cloning sites; pBR322; Ti plasmid of Agrobacterium; disarmed
    retroviruses). Competent hosts (CaCl₂, heat shock; microinjection; gene gun/biolistics).
  explanations:
    text: Genetic engineering moves genes between organisms. Restriction enzymes cut DNA at specific sequences, DNA ligase joins pieces, and vectors like plasmids carry the new gene into a host cell, which then copies it.
    visual: Draw EcoRI cutting GAATTC between G and A on both strands, leaving short single-stranded 'sticky ends' that can pair with any DNA cut by the same enzyme.
    step_by_step: 'Step 1: Cut the gene and plasmid with the same restriction enzyme. Step 2: Join with DNA ligase. Step 3: Insert into a competent host. Step 4: Select cells carrying the plasmid using a marker.'
    real_world: Human insulin for diabetics is now made by bacteria carrying the human insulin gene.
  picture:
    kind: flow
    steps:
    - Cut DNA with restriction enzyme
    - Cut plasmid with same enzyme
    - Join with DNA ligase
    - Insert into host bacterium
    - Select transformed cells
    alt: Making recombinant DNA and putting it into a host.
  items:
  - prompt: How many base pairs long is the EcoRI recognition site GAATTC?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Count the letters.
    - Six.
    solution: '6.'
  - prompt: 'Restriction enzymes are called molecular:'
    options:
    - scissors
    - glue
    - taxis
    - copiers
    answer: scissors
    difficulty: 1
    hints:
    - They cut.
    - Ligase is glue.
    solution: Scissors.
  - prompt: 'In gel electrophoresis, DNA fragments move towards the:'
    options:
    - anode (positive electrode)
    - cathode
    - centre
    - top
    answer: anode (positive electrode)
    difficulty: 2
    hints:
    - DNA is negatively charged.
    - Phosphates.
    solution: The anode.
  - prompt: 'Restriction enzymes recognise sequences that are:'
    options:
    - palindromic
    - random
    - always 20 bp
    - made of RNA
    answer: palindromic
    difficulty: 2
    hints:
    - Read the same both ways on two strands.
    - GAATTC.
    solution: Palindromic.
    mistakes:
      random: c12b_re
  - prompt: 'A gene for antibiotic resistance in a vector acts as a:'
    options:
    - selectable marker
    - origin of replication
    - restriction site
    - promoter only
    answer: selectable marker
    difficulty: 2
    hints:
    - Picks out transformants.
    - Survive on antibiotic.
    solution: A selectable marker.
  - prompt: 'The first recombinant DNA was made by:'
    options:
    - Cohen and Boyer
    - Watson and Crick
    - Mendel and Morgan
    - Fleming and Florey
    answer: Cohen and Boyer
    difficulty: 2
    hints:
    - '1972.'
    - Plasmid of Salmonella.
    solution: Stanley Cohen and Herbert Boyer.
- code: cbse12b.biotech.process
  title: Processes of recombinant DNA technology
  after:
  - cbse12b.biotech.tools
  notes: |
    Isolation of DNA (lysozyme, cellulase, chitinase; RNase, protease; chilled ethanol precipitation). Cutting at specific
    locations; amplification by PCR (Kary Mullis; denaturation ~94 °C, primer annealing, extension by thermostable Taq
    polymerase from Thermus aquaticus; ~1 billion copies after 30 cycles). Ligation into vector; insertion into host;
    selection: antibiotic resistance, insertional inactivation (blue–white screening with lacZ / β-galactosidase). Obtaining the
    foreign gene product: bioreactors (stirred-tank; sterile, controlled temperature, pH, oxygen); downstream processing
    (separation, purification, formulation, quality control).
  explanations:
    text: 'Recombinant DNA technology follows clear steps: isolate DNA, cut it, copy the gene many times by PCR, join it into a vector, put it into a host, and grow the host in big bioreactors to make the product, which is then purified.'
    visual: 'Draw a PCR cycle: heat to split DNA strands, cool so primers stick, warm so Taq polymerase builds new strands. Each cycle doubles the DNA.'
    step_by_step: 'Step 1: PCR doubles DNA each cycle: copies = 2ⁿ. Step 2: Blue–white screening: white colonies have the insert. Step 3: Bioreactors grow cells at scale. Step 4: Downstream processing purifies the product.'
    real_world: PCR tests were used worldwide to detect the COVID-19 virus quickly.
  picture:
    kind: compare
    columns:
    - title: PCR step
      points:
      - denaturation
      - annealing
      - extension
    - title: What happens
      points:
      - heat splits DNA strands
      - primers bind
      - Taq polymerase builds new DNA
    alt: The three steps of each PCR cycle.
  items:
  - prompt: Starting with one DNA molecule, how many copies are there after 10 PCR cycles?
    answer: '1024'
    check: 2**10
    difficulty: 2
    hints:
    - 2ⁿ.
    - 2¹⁰.
    solution: 1,024.
  - prompt: How many copies after 3 PCR cycles, starting from one?
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - Doubles each time.
    - 2³.
    solution: '8.'
  - prompt: 'Taq polymerase is used in PCR because it is:'
    options:
    - heat-stable
    - cheap only
    - red in colour
    - an RNA enzyme
    answer: heat-stable
    difficulty: 2
    hints:
    - From hot-spring bacteria.
    - Survives 94 °C.
    solution: Heat-stable.
  - prompt: 'In blue–white screening, recombinant colonies are:'
    options:
    - white
    - blue
    - red
    - invisible
    answer: white
    difficulty: 2
    hints:
    - Insert disrupts lacZ.
    - No blue colour.
    solution: White.
    mistakes:
      blue: c12b_select
  - prompt: 'DNA is precipitated out of solution by adding:'
    options:
    - chilled ethanol
    - hot water
    - salt only
    - sugar
    answer: chilled ethanol
    difficulty: 2
    hints:
    - Fine threads appear.
    - Cold alcohol.
    solution: Chilled ethanol.
  - prompt: 'Separation and purification of the product after fermentation is called:'
    options:
    - downstream processing
    - upstream processing
    - transformation
    - ligation
    answer: downstream processing
    difficulty: 1
    hints:
    - After the bioreactor.
    - Purify.
    solution: Downstream processing.
