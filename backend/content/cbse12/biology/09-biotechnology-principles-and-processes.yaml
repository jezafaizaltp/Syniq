# CBSE Class 12 Biology (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse12-bio
chapter: 9
title: 'Biotechnology: Principles and Processes'
tips:
  c12b_re: "EcoRI cuts GAATTC. Read it forward on one strand and backward on the other: it is the same. What do you call words like 'madam'?"
  c12b_select: "The gene for blue colour is lacZ. If a new gene is inserted into lacZ, it stops working. What colour are those colonies then?"
  b12_cohen_boyer: "Recombinant DNA was first made in 1972 by two American scientists."
  b12_downstream: "Upstream is before fermentation, downstream is after."
  b12_ecori: "Count the letters in GAATTC."
  b12_ethanol_ppt: "DNA is insoluble in cold alcohol and comes out as threads."
  b12_gel: "DNA is negatively charged, so it moves towards the opposite charge."
  b12_marker: "Only bacteria that took up the vector survive on the antibiotic: the gene lets you select them."
  b12_pcr: "Each cycle doubles the DNA: 2ⁿ copies after n cycles."
  b12_scissors: "Restriction enzymes cut DNA at specific places."
  b12_taq: "PCR heats DNA to about 94 °C every cycle. The enzyme comes from a hot-spring bacterium."
  c12b9_tool: 'Match the tool to its job: restriction enzyme cuts, ligase joins, vector carries, gel separates by size, PCR copies.'
  c12b9_pcr: Each PCR cycle doubles the DNA, so after n cycles one molecule becomes 2ⁿ copies.
  c12b9_step: 'Put rDNA steps in order: isolate DNA, cut, amplify (PCR), ligate into vector, insert into host, select, grow and purify the product.'
  c12b9_blue: An insert inside lacZ breaks the enzyme that makes the blue colour. Which colonies lost that enzyme?
  c12b9_ori: Ask which part of a vector lets it be copied inside the host, so many copies are made.
concepts:
- code: cbse12b.biotech.tools
  title: Tools of recombinant DNA technology
  notes: |
    Principles: genetic engineering and bioprocess engineering. First recombinant DNA: Cohen and Boyer (1972), antibiotic
    resistance gene in Salmonella plasmid. Tools: restriction enzymes (molecular scissors; EcoRI from E. coli RY13; recognise
    palindromes like 5′-GAATTC-3′; sticky ends), DNA ligase (molecular glue), gel electrophoresis (DNA moves to anode; smaller
    fragments travel further; stained with ethidium bromide, seen under UV), cloning vectors (plasmids, bacteriophages; features:
    ori, selectable markers like ampicillin/tetracycline resistance, cloning sites; pBR322; Ti plasmid of Agrobacterium; disarmed
    retroviruses). Competent hosts (CaCl₂, heat shock; microinjection; gene gun/biolistics).
  explanations:
    text: Genetic engineering moves genes between organisms. Restriction enzymes cut DNA at specific sequences, DNA ligase joins pieces, and vectors like plasmids carry the new gene into a host cell, which then copies it.
    visual: Draw EcoRI cutting GAATTC between G and A on both strands, leaving short single-stranded 'sticky ends' that can pair with any DNA cut by the same enzyme.
    step_by_step: 'Step 1: Cut the gene and plasmid with the same restriction enzyme. Step 2: Join with DNA ligase. Step 3: Insert into a competent host. Step 4: Select cells carrying the plasmid using a marker.'
    real_world: Human insulin for diabetics is now made by bacteria carrying the human insulin gene.
  picture:
    kind: flow
    steps:
    - Cut DNA with restriction enzyme
    - Cut plasmid with same enzyme
    - Join with DNA ligase
    - Insert into host bacterium
    - Select transformed cells
    alt: Making recombinant DNA and putting it into a host.
  activity:
    type: sort
    prompt: Which tool of recombinant DNA technology is it?
    bins:
    - Restriction enzyme
    - DNA ligase
    - Vector
    - Selectable marker
    items:
    - label: EcoRI
      bin: Restriction enzyme
      clue: Named after E. coli RY13, it cuts at GAATTC. What does it do?
      why: 'A molecular scissor: restriction enzyme.'
    - label: Cuts at a palindromic sequence
      bin: Restriction enzyme
      clue: Which tool recognises a sequence that reads the same both ways?
      why: A restriction endonuclease.
    - label: Leaves sticky ends
      bin: Restriction enzyme
      clue: Which tool cuts DNA leaving single-stranded overhangs?
      why: A restriction enzyme cutting off-centre.
    - label: Joins DNA fragments
      bin: DNA ligase
      clue: Which tool is the molecular glue?
      why: DNA ligase.
    - label: Seals the sugar–phosphate backbone
      bin: DNA ligase
      clue: Which enzyme forms the final phosphodiester bond?
      why: DNA ligase.
    - label: pBR322
      bin: Vector
      clue: A plasmid that carries foreign DNA into E. coli. Which tool?
      why: A cloning vector.
    - label: Has an ori, where copying starts
      bin: Vector
      clue: Which tool must copy itself inside the host?
      why: A vector needs an origin of replication.
    - label: Ti plasmid of Agrobacterium
      bin: Vector
      clue: Used to carry genes into plants. Which tool?
      why: A vector (disarmed so it no longer causes tumours).
    - label: Ampicillin-resistance gene, ampR
      bin: Selectable marker
      clue: Lets only cells with the plasmid survive ampicillin. Which tool?
      why: A selectable marker.
    - label: Lets only transformed cells grow on an antibiotic
      bin: Selectable marker
      clue: Which tool sorts transformed cells from the rest?
      why: A selectable marker.
  lesson:
    - teach: Biotechnology rests on genetic engineering (changing DNA) and bioprocess engineering (growing cells in sterile, large-scale conditions). Cohen and Boyer made the first recombinant DNA in 1972 by linking an antibiotic-resistance gene to a Salmonella plasmid. Restriction enzymes cut DNA at specific palindromic sequences; EcoRI cuts GAATTC, leaving single-stranded sticky ends that pair with matching ends. DNA ligase joins them.
      picture:
        kind: flow
        steps:
        - DNA with GAATTC
        - EcoRI cuts
        - sticky ends
        - matching ends pair
        - ligase seals
        alt: How a restriction enzyme and ligase make recombinant DNA.
      check:
        prompt: 'A palindromic DNA sequence reads the same:'
        options:
        - on both strands in the 5′→3′ direction
        - forwards and backwards on one strand only
        - only after cutting
        answer: on both strands in the 5′→3′ direction
        why: GAATTC on one strand matches GAATTC on the other, read 5′→3′.
      ways:
      - style: step_by_step
        teach: 'Is 5′-GGATCC-3′ a palindrome? Step 1: Write its partner strand 3′→5′: CCTAGG. Step 2: Read the partner 5′→3′: GGATCC. Step 3: Both strands read the same in the 5′→3′ direction. Step 4: Yes: this is the BamHI site.'
      - style: real_world
        teach: Restriction enzymes first evolved in bacteria as a defence. When a virus injects its DNA, the enzyme chops it at its sites, while the bacterium's own DNA is protected by chemical tags. Scientists borrowed these 'scissors'.
    - teach: 'Gel electrophoresis separates DNA pieces by size: DNA is negative, so it moves to the anode through agarose gel; smaller pieces move further. Ethidium bromide stains DNA, which glows orange under UV light. Bands are cut out and the DNA extracted (elution).'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 0
          label: well (−)
        - at: 3
          label: large piece
        - at: 8
          label: small piece
        - at: 10
          label: anode (+)
        alt: In a gel, small DNA pieces travel further from the well towards the anode than large ones.
      check:
        prompt: 'In a gel, the band furthest from the well holds the:'
        options:
        - smallest DNA pieces
        - largest DNA pieces
        - proteins only
        answer: smallest DNA pieces
        why: Small pieces slip through the gel more easily.
      ways:
      - style: real_world
        teach: 'Running a gel is like a race through a crowded market: small children (short DNA) slip through quickly and go far, while big adults (long DNA) push slowly. After the race you read who went how far.'
      - style: step_by_step
        teach: 'Read a gel. Step 1: Load DNA in wells at the negative end. Step 2: Switch on the current; DNA moves to the positive end. Step 3: Stain and view under UV. Step 4: Bands farthest from the well are the smallest pieces.'
    - teach: 'A cloning vector (plasmid or phage) needs: an origin of replication (ori) to copy itself, selectable markers (e.g. ampicillin or tetracycline resistance in pBR322) to pick out transformed cells, and unique cloning sites. Agrobacterium''s Ti plasmid carries genes into plants; disarmed retroviruses into animal cells. Host cells are made competent with CaCl₂ and heat shock, or DNA is added by microinjection or a gene gun.'
      check:
        prompt: 'The ''ori'' in a vector is needed for:'
        options:
        - starting replication
        - cutting DNA
        - killing bacteria
        answer: starting replication
        why: Without ori, the plasmid cannot be copied.
      ways:
      - style: visual
        teach: What a good cloning vector needs, and why.
        picture:
          kind: compare
          columns:
          - title: ori
            points:
            - Starts copying
            - Sets copy number
          - title: Selectable marker
            points:
            - e.g. antibiotic resistance
            - Picks out transformed cells
          - title: Cloning site
            points:
            - One site per enzyme
            - Insert goes in cleanly
          alt: The origin of replication starts copying and sets how many copies form. A selectable marker such as antibiotic resistance picks out transformed cells. A cloning site, with one site per enzyme, lets the insert go in cleanly.
      - style: real_world
        teach: 'Agrobacterium is nature''s own genetic engineer: it inserts part of its Ti plasmid into plant cells and makes them form galls. Scientists remove the gall-causing genes and use the ''disarmed'' plasmid to carry useful genes into crops.'
  items:
  - prompt: How many base pairs long is the EcoRI recognition site GAATTC?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Count the letters.
    - Six.
    solution: "G-A-A-T-T-C has 6 bases, so the site is 6 bp long."
    mistakes: {"4": "b12_ecori", "8": "b12_ecori", "3": "b12_ecori"}
  - prompt: 'Restriction enzymes are called molecular:'
    options:
    - scissors
    - glue
    - taxis
    - copiers
    answer: scissors
    difficulty: 1
    hints:
    - They cut.
    - Ligase is glue.
    solution: "They cut DNA at specific sequences, like scissors; ligase is the 'glue'."
    mistakes: {"glue": "b12_scissors", "taxis": "b12_scissors", "copiers": "b12_scissors"}
  - prompt: 'In gel electrophoresis, DNA fragments move towards the:'
    options:
    - anode (positive electrode)
    - cathode
    - centre
    - top
    answer: anode (positive electrode)
    difficulty: 2
    hints:
    - DNA is negatively charged.
    - Phosphates.
    solution: "DNA is negatively charged (phosphate groups), so it moves towards the positive anode."
    mistakes: {"cathode": "b12_gel", "centre": "b12_gel", "top": "b12_gel"}
  - prompt: 'Restriction enzymes recognise sequences that are:'
    options:
    - palindromic
    - random
    - always 20 bp
    - made of RNA
    answer: palindromic
    difficulty: 2
    hints:
    - Read the same both ways on two strands.
    - GAATTC.
    solution: "The site reads the same on both strands in the 5′→3′ direction (GAATTC / CTTAAG reversed): a palindrome."
    mistakes:
      random: c12b_re
  - prompt: 'A gene for antibiotic resistance in a vector acts as a:'
    options:
    - selectable marker
    - origin of replication
    - restriction site
    - promoter only
    answer: selectable marker
    difficulty: 2
    hints:
    - Picks out transformants.
    - Survive on antibiotic.
    solution: "Only cells that took up the vector survive the antibiotic, so the gene lets us select them: a selectable marker."
    mistakes: {"origin of replication": "b12_marker", "restriction site": "b12_marker", "promoter only": "b12_marker"}
  - prompt: 'The first recombinant DNA was made by:'
    options:
    - Cohen and Boyer
    - Watson and Crick
    - Mendel and Morgan
    - Fleming and Florey
    answer: Cohen and Boyer
    difficulty: 2
    hints:
    - '1972.'
    - Plasmid of Salmonella.
    solution: Stanley Cohen and Herbert Boyer.
    mistakes: {"Watson and Crick": "b12_cohen_boyer", "Mendel and Morgan": "b12_cohen_boyer", "Fleming and Florey": "b12_cohen_boyer"}
  - prompt: EcoRI is obtained from which bacterium?
    options:
    - Escherichia coli
    - Thermus aquaticus
    - Agrobacterium
    answer: Escherichia coli
    difficulty: 1
    hints:
    - Its name is built from the bacterium's name.
    - E-co for the genus and species.
    solution: 'Step 1: E + co + R strain RY13 + I. Step 2: E. coli.'
    mistakes:
      Thermus aquaticus: c12b9_tool
      Agrobacterium: c12b9_tool
  - prompt: 'DNA ligase is called molecular:'
    options:
    - glue
    - scissors
    - taxi
    answer: glue
    difficulty: 1
    hints:
    - It joins pieces together.
    - Scissors cut; this does the opposite.
    solution: 'Step 1: seals the sugar-phosphate backbone. Step 2: molecular glue.'
    mistakes:
      scissors: c12b9_tool
      taxi: c12b9_tool
  - prompt: 'DNA is stained in a gel with:'
    options:
    - ethidium bromide
    - iodine
    - safranin
    answer: ethidium bromide
    difficulty: 1
    hints:
    - It glows under UV light.
    - It slips between DNA bases.
    solution: 'Step 1: intercalating dye. Step 2: ethidium bromide.'
    mistakes:
      iodine: c12b9_tool
      safranin: c12b9_tool
  - prompt: Which plasmid of Agrobacterium tumefaciens is used to carry genes into plants?
    options:
    - Ti plasmid
    - pBR322
    - λ phage
    answer: Ti plasmid
    difficulty: 2
    hints:
    - It naturally causes tumours.
    - The name stands for tumour-inducing.
    solution: 'Step 1: disarmed tumour plasmid. Step 2: Ti.'
    mistakes:
      pBR322: c12b9_tool
      λ phage: c12b9_tool
  - prompt: 'Bacterial cells are made competent to take up DNA by treating them with:'
    options:
    - calcium chloride and heat shock
    - ethidium bromide
    - Taq polymerase
    answer: calcium chloride and heat shock
    difficulty: 2
    hints:
    - A divalent cation is used.
    - Then ice, then 42 °C, then ice.
    solution: 'Step 1: Ca²⁺ ions. Step 2: heat shock lets DNA in.'
    mistakes:
      ethidium bromide: c12b9_tool
      Taq polymerase: c12b9_tool
  - prompt: 'Shooting DNA-coated gold or tungsten particles into plant cells uses a:'
    options:
    - gene gun (biolistics)
    - microinjection needle
    - gel
    answer: gene gun (biolistics)
    difficulty: 2
    hints:
    - High-velocity microparticles.
    - Bio + ballistics.
    solution: 'Step 1: particles fired into cells. Step 2: gene gun.'
    mistakes:
      microinjection needle: c12b9_tool
      gel: c12b9_tool
  - prompt: Which is the complementary strand of 5′-GAATTC-3′ (read 5′→3′)?
    options:
    - GAATTC
    - CTTAAG
    - GTTAAC
    answer: GAATTC
    difficulty: 3
    hints:
    - Write the partner of each base, then read it backwards.
    - Palindromes give the same answer.
    solution: 'Step 1: complement 3′-CTTAAG-5′. Step 2: read 5′→3′: GAATTC.'
    mistakes:
      CTTAAG: c12b9_tool
      GTTAAC: c12b9_tool
  - prompt: 'In pBR322, the selectable markers are resistance to:'
    options:
    - ampicillin and tetracycline
    - penicillin and streptomycin
    - kanamycin only
    answer: ampicillin and tetracycline
    difficulty: 2
    hints:
    - Two antibiotic genes.
    - Written as ampᴿ and tetᴿ.
    solution: 'Step 1: two resistance genes. Step 2: ampicillin, tetracycline.'
    mistakes:
      penicillin and streptomycin: c12b9_tool
      kanamycin only: c12b9_tool
  - prompt: Why must the same restriction enzyme cut both the vector and the foreign DNA?
    options:
    - so their sticky ends match
    - so DNA moves to the anode
    - so bacteria die
    answer: so their sticky ends match
    difficulty: 2
    hints:
    - Think about how the pieces join.
    - Overhangs must pair.
    solution: 'Step 1: same enzyme, same overhang. Step 2: ends pair and ligase seals.'
    mistakes:
      so DNA moves to the anode: c12b9_tool
      so bacteria die: c12b9_tool
  - prompt: 'Assertion (A): A vector with two or more sites for the same restriction enzyme is not suitable for cloning.

      Reason (R): Cutting at several sites breaks the vector into many fragments, making it hard to insert the gene correctly.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: A unique site lets the enzyme open the vector once, so the insert goes into one known place. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In blue–white screening, a researcher sees both blue and white colonies on a plate with X-gal. Which colonies carry the inserted gene?'
    options:
    - White colonies
    - Blue colonies
    - Both equally
    answer: White colonies
    hints:
    - The gene was inserted into lacZ.
    - Without working β-galactosidase, can colonies turn X-gal blue?
    solution: The insert disrupts lacZ, so no β-galactosidase is made and the colonies stay white. Blue colonies have no insert.
    mistakes:
      Blue colonies: c12b9_blue
      Both equally: c12b9_blue
    exam: case
    difficulty: 2
  - prompt: A student builds a plasmid with an insert and a marker but forgets the origin of replication. What will happen in the host?
    options:
    - The plasmid won't be copied, so it is lost as cells divide
    - It will be copied normally
    - The host cell will die
    answer: The plasmid won't be copied, so it is lost as cells divide
    hints:
    - Which part of a vector starts its copying?
    - What happens to a non-copied plasmid after cell divisions?
    solution: Without ori, the plasmid cannot replicate. Each division dilutes it until it disappears from the population.
    mistakes:
      It will be copied normally: c12b9_ori
      The host cell will die: c12b9_ori
    exam: competency
    difficulty: 2
- code: cbse12b.biotech.process
  title: Processes of recombinant DNA technology
  after:
  - cbse12b.biotech.tools
  notes: |
    Isolation of DNA (lysozyme, cellulase, chitinase; RNase, protease; chilled ethanol precipitation). Cutting at specific
    locations; amplification by PCR (Kary Mullis; denaturation ~94 °C, primer annealing, extension by thermostable Taq
    polymerase from Thermus aquaticus; ~1 billion copies after 30 cycles). Ligation into vector; insertion into host;
    selection: antibiotic resistance, insertional inactivation (blue–white screening with lacZ / β-galactosidase). Obtaining the
    foreign gene product: bioreactors (stirred-tank; sterile, controlled temperature, pH, oxygen); downstream processing
    (separation, purification, formulation, quality control).
  explanations:
    text: 'Recombinant DNA technology follows clear steps: isolate DNA, cut it, copy the gene many times by PCR, join it into a vector, put it into a host, and grow the host in big bioreactors to make the product, which is then purified.'
    visual: 'Draw a PCR cycle: heat to split DNA strands, cool so primers stick, warm so Taq polymerase builds new strands. Each cycle doubles the DNA.'
    step_by_step: 'Step 1: PCR doubles DNA each cycle: copies = 2ⁿ. Step 2: Blue–white screening: white colonies have the insert. Step 3: Bioreactors grow cells at scale. Step 4: Downstream processing purifies the product.'
    real_world: PCR tests were used worldwide to detect the COVID-19 virus quickly.
  picture:
    kind: compare
    columns:
    - title: PCR step
      points:
      - denaturation
      - annealing
      - extension
    - title: What happens
      points:
      - heat splits DNA strands
      - primers bind
      - Taq polymerase builds new DNA
    alt: The three steps of each PCR cycle.
  activity:
    type: order
    prompt: Put the steps of making a product by recombinant DNA technology in order.
    steps:
    - Isolate the DNA
    - Cut it with a restriction enzyme
    - Separate the fragments by gel electrophoresis
    - Ligate the gene into a vector
    - Put the recombinant DNA into a host (transformation)
    - Select the recombinant cells
    - Grow them in a bioreactor
    - 'Downstream processing: purify the product'
    reasons:
      Cut it with a restriction enzyme: You can't cut DNA until it has been isolated.
      Separate the fragments by gel electrophoresis: Fragments exist only after cutting.
      Ligate the gene into a vector: You need the gene fragment (purified from the gel) before you can join it into a vector.
      Put the recombinant DNA into a host (transformation): The recombinant DNA has to be made before it can go into a host.
      Select the recombinant cells: Selection sorts the host cells, so they must be transformed first.
      Grow them in a bioreactor: Only the selected recombinants are scaled up.
      'Downstream processing: purify the product': The product can only be purified after it has been made.
  lesson:
    - teach: 'First, DNA is isolated: enzymes break cell walls (lysozyme for bacteria, cellulase for plants, chitinase for fungi), RNase and protease remove RNA and proteins, and chilled ethanol makes pure DNA come out as fine threads. It is cut with restriction enzymes and checked on a gel.'
      picture:
        kind: flow
        steps:
        - break cells (lysozyme etc.)
        - remove RNA and protein
        - add chilled ethanol
        - DNA threads spooled out
        alt: Steps to isolate DNA from cells.
      check:
        prompt: 'Cell walls of fungi are broken with:'
        options:
        - chitinase
        - cellulase
        - lysozyme
        answer: chitinase
        why: Fungal walls contain chitin.
      ways:
      - style: step_by_step
        teach: 'Isolate DNA from a plant leaf. Step 1: Break cell walls with cellulase. Step 2: Remove RNA with ribonuclease and proteins with protease. Step 3: Add chilled ethanol. Step 4: White DNA threads appear and are spooled out.'
      - style: real_world
        teach: 'You can see DNA at home: mash strawberries with salt and dish soap, filter, and pour cold alcohol on top. White strands rise into the alcohol. It''s the same chilled-ethanol step used in labs.'
    - teach: 'PCR (Kary Mullis) makes millions of copies of a gene. Each cycle: denaturation (~94 °C, strands separate), annealing (primers bind), extension (heat-stable Taq polymerase from Thermus aquaticus builds new strands). Each cycle doubles the DNA, so n cycles give 2ⁿ copies.'
      picture:
        kind: flow
        steps:
        - denature ~94 °C
        - anneal primers
        - extend with Taq
        - DNA doubled
        - repeat
        alt: One cycle of PCR.
      check:
        prompt: How many copies after 5 PCR cycles, starting from one?
        options:
        - '32'
        - '10'
        - '25'
        answer: '32'
        why: 2 × 2 × 2 × 2 × 2 = 32.
      ways:
      - style: real_world
        teach: PCR lets forensic teams copy DNA from a single hair root or a tiny blood drop until there's enough to test. It's like turning one photocopy into a million in a couple of hours.
      - style: step_by_step
        teach: 'PCR doubling. Step 1: Start with 1 DNA molecule. Step 2: After 1 cycle: 2. Step 3: After 6 cycles: 2⁶ = 64. Step 4: So n cycles give 2ⁿ copies; about 30 cycles give over a billion.'
    - teach: 'The gene is ligated into a vector and put into a host. Transformed cells are picked by antibiotic resistance or by insertional inactivation: in blue–white screening, a gene inserted into lacZ stops β-galactosidase, so recombinant colonies stay white. Hosts are grown in large bioreactors (stirred-tank) with controlled temperature, pH and oxygen, then the product goes through downstream processing: separation, purification, formulation and quality testing.'
      check:
        prompt: 'In blue–white screening, blue colonies are:'
        options:
        - non-recombinant
        - recombinant
        - dead
        answer: non-recombinant
        why: Their lacZ gene still works.
      ways:
      - style: visual
        teach: Steps from a cloned gene to a finished product.
        picture:
          kind: flow
          steps:
          - Ligate gene into vector
          - Transform host; select recombinants
          - Grow in a bioreactor (stirred-tank)
          - 'Downstream processing: separate, purify, test, pack'
          alt: Ligate the gene into a vector. Transform the host and select recombinant cells. Grow them in a bioreactor such as a stirred-tank. Then downstream processing separates, purifies, tests and packs the product.
      - style: real_world
        teach: A bioreactor is like a smart cooker that keeps temperature, pH, oxygen and stirring perfect around the clock. Thousands of litres of cells grow inside, each making the target protein, such as insulin.
  items:
  - prompt: Starting with one DNA molecule, how many copies are there after 10 PCR cycles?
    answer: '1024'
    check: 2**10
    difficulty: 2
    hints:
    - 2ⁿ.
    - 2¹⁰.
    solution: "Each cycle doubles the DNA: 2¹⁰ = 1,024 copies."
    mistakes: {"20": "b12_pcr", "100": "b12_pcr", "512": "b12_pcr"}
  - prompt: How many copies after 3 PCR cycles, starting from one?
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - Doubles each time.
    - 2³.
    solution: "Each cycle doubles the DNA: 1 → 2 → 4 → 8, so 2³ = 8."
    mistakes: {"6": "b12_pcr", "3": "b12_pcr", "9": "b12_pcr"}
  - prompt: 'Taq polymerase is used in PCR because it is:'
    options:
    - heat-stable
    - cheap only
    - red in colour
    - an RNA enzyme
    answer: heat-stable
    difficulty: 2
    hints:
    - From hot-spring bacteria.
    - Survives 94 °C.
    solution: "PCR heats DNA to about 94 °C to separate strands; Taq (from a hot-spring bacterium) survives this heat."
    mistakes: {"cheap only": "b12_taq", "red in colour": "b12_taq", "an RNA enzyme": "b12_taq"}
  - prompt: 'In blue–white screening, recombinant colonies are:'
    options:
    - white
    - blue
    - red
    - invisible
    answer: white
    difficulty: 2
    hints:
    - Insert disrupts lacZ.
    - No blue colour.
    solution: "The insert breaks the lacZ gene, so no β-galactosidase is made and the colony stays white; non-recombinants turn blue."
    mistakes:
      blue: c12b_select
  - prompt: 'DNA is precipitated out of solution by adding:'
    options:
    - chilled ethanol
    - hot water
    - salt only
    - sugar
    answer: chilled ethanol
    difficulty: 2
    hints:
    - Fine threads appear.
