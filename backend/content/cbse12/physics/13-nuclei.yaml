# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse12-phy
chapter: 13
title: Nuclei
tips:
  c12p_be: Binding energy = mass defect × c² (1 u ≈ 931.5 MeV). Higher binding energy per nucleon means a more stable nucleus.
  c12p_fission: Fission splits a heavy nucleus; fusion joins light nuclei. Both release energy because products are more tightly bound.
  p12_be_per_nucleon: "BE per nucleon = total BE ÷ A."
  p12_chain: "Generation 1 has 1 fission, generation 2 has 3, generation 3 multiplies again."
  p12_control_rods: "Cadmium and boron rods are pushed in to slow the chain. What do they do to neutrons?"
  p12_fission_energy: "Fission of one U-235 nucleus releases far more than chemical reactions (a few eV): it's in the hundreds of MeV."
  p12_fusion: "Two positive nuclei repel. Only very fast nuclei get close enough to fuse."
  p12_mass_energy: "E = Δm × 931.5 MeV."
  p12_moderator: "Slow neutrons cause fission more easily. Water and graphite do this job."
  p12_neutrons: "N = A − Z."
  p12_nuclear_force: "It holds protons together against repulsion, but only over about a femtometre."
  p12_nuclear_radius: "R ∝ A^(1/3). Find the number that, multiplied by itself three times, gives A."
  c12p13_count: A is the mass number (protons + neutrons), Z the atomic number (protons). Neutrons N = A − Z.
  c12p13_be: 'Binding energy = mass defect × 931.5 MeV per u. Per nucleon: divide by A.'
  c12p13_react: Fission splits heavy nuclei; fusion joins light ones. Moderators slow neutrons; control rods absorb them.
concepts:
- code: cbse12p.nuclei.structure
  title: Nuclear structure and binding energy
  notes: |
    Atomic masses in u (1/12 of C-12 = 1.66 × 10⁻²⁷ kg). Nucleus: Z protons, N neutrons, A = Z + N; isotopes, isobars, isotones.
    Size R = R₀A^(1/3) (R₀ ≈ 1.2 fm); nuclear density constant (~2.3 × 10¹⁷ kg/m³). Mass–energy E = mc². Mass defect ΔM =
    [Zm_p + Nm_n] − M; binding energy E_b = ΔMc² (1 u ↔ 931.5 MeV). Binding energy per nucleon curve: peak ~8.75 MeV near
    A = 56 (iron); nuclear force: strong, short-range, charge independent. (Radioactivity removed in rationalised syllabus.)
  explanations:
    text: The nucleus holds protons and neutrons together with the strong nuclear force. A nucleus weighs a little less than its separate parts; this missing mass became the binding energy that holds it together (E = mc²). Iron's nucleus is the most tightly bound.
    visual: 'Draw the binding-energy-per-nucleon curve: it rises steeply for light nuclei, peaks near iron (A ≈ 56), then slowly falls for heavy ones.'
    step_by_step: 'Step 1: Add the masses of the separate protons and neutrons. Step 2: Subtract the nucleus''s mass to get the mass defect. Step 3: Multiply by 931.5 MeV/u. Step 4: Divide by A for energy per nucleon.'
    real_world: The Sun shines because hydrogen nuclei fuse into helium, turning a little mass into a lot of energy.
  picture:
    kind: flow
    steps:
    - Separate protons + neutrons
    - Combine into nucleus
    - Mass decreases (mass defect)
    - 'Energy released: ΔMc²'
    alt: 'Binding energy: when nucleons combine, the lost mass becomes energy.'
  activity:
    type: formula
    prompt: A nucleus of mass number A has radius R = 1.2 A^(1/3) fm. Its density doesn't depend on A.
    inputs:
    - name: a
      label: Mass number A
      min: 1
      max: 250
      step: 1
      start: 1
    outputs:
    - name: r
      label: Radius R
      expr: 1.2*a^(1/3)
      unit: fm
      places: 2
    - name: rho
      label: Density (× 10¹⁷ kg/m³)
      expr: a*1.66/(4/3*pi*(1.2*a^(1/3))^3)*10
      places: 2
    goals:
    - prompt: ¹⁶O has R ≈ 3.02 fm. Find a nucleus with twice that radius.
      want:
        a: 128
      mistakes:
      - when:
          a: 32
        say: 'Twice the mass number gives only 1.26 × the radius: R ∝ A^(1/3). Double R needs 2³ = 8 times A.'
      - when:
          a: 64
        say: 4 times A gives 1.59 × R. You need 8 times.
    - prompt: Make R = 6 fm.
      want:
        r:
        - 5.99
        - 6.01
      mistakes:
      - when:
          a: 5
        say: A = 5 is the cube root. R = 1.2 × A^(1/3) = 6 means A^(1/3) = 5, so A = 5³.
    - prompt: Make a nucleus whose radius is 3 times hydrogen's (A = 1).
      want:
        r:
        - 3.59
        - 3.61
      mistakes:
      - when:
          a: 3
        say: 'Three times A gives only 1.44 × the radius: R ∝ A^(1/3).'
      - when:
          a: 9
        say: '9 = 3², but R goes as the CUBE root of A: A = 3³.'
  lesson:
    - teach: A nucleus has Z protons and N neutrons; mass number A = Z + N. Isotopes share Z (same element), isobars share A, isotones share N. Atomic masses are measured in u, where 1 u = 1/12 of a carbon-12 atom = 1.66 × 10⁻²⁷ kg.
      check:
        prompt: '¹²C and ¹⁴C are:'
        options:
        - isotopes
        - isobars
        - isotones
        answer: isotopes
        why: Same Z = 6, different A.
    - teach: Nuclear radius R = R₀A^(1/3) with R₀ ≈ 1.2 fm, so volume ∝ A and nuclear density is about the same for all nuclei (≈ 2.3 × 10¹⁷ kg/m³). The nuclear force holding nucleons together is very strong, short-range, and does not depend on charge.
      check:
        prompt: A nucleus has 8 times the mass number of another. Its radius is how many times larger?
        options:
        - '2'
        - '8'
        - '4'
        answer: '2'
        why: 8^(1/3) = 2.
    - teach: 'A nucleus weighs less than its separate nucleons: the mass defect ΔM. Binding energy E_b = ΔMc², with 1 u ↔ 931.5 MeV. Binding energy per nucleon peaks at about 8.75 MeV near A = 56 (iron), so iron is the most stable; very light and very heavy nuclei can release energy by moving towards it.'
      picture:
        kind: bars
        bars:
        - label: ²H
          value: 1.1
        - label: ⁴He
          value: 7.1
        - label: ⁵⁶Fe
          value: 8.8
        - label: ²³⁵U
          value: 7.6
        alt: 'Binding energy per nucleon: low for deuterium, high for helium, highest for iron-56, slightly lower for uranium-235.'
      check:
        prompt: 'Which releases energy: splitting U-235 or splitting Fe-56?'
        options:
        - splitting U-235
        - splitting Fe-56
        - both
        answer: splitting U-235
        why: U-235's pieces have higher binding energy per nucleon; iron is already at the peak.
  items:
  - prompt: How many neutrons are in ²³⁵U (Z = 92)?
    answer: '143'
    check: 235-92
    difficulty: 1
    hints:
    - A − Z.
    - 235 − 92.
    solution: '143.'
    mistakes: {"92": "p12_neutrons", "235": "p12_neutrons", "327": "p12_neutrons"}
  - prompt: A mass defect of 0.1 u corresponds to how much energy (MeV), using 931.5 MeV/u?
    answer: '93.15'
    check: Rational(9315,100)
    difficulty: 2
    hints:
    - 0.1 × 931.5.
    - Multiply.
    solution: 93.15 MeV.
    mistakes: {"931.5": "p12_mass_energy", "9.315": "p12_mass_energy"}
  - prompt: A nucleus with A = 8 has binding energy 56 MeV. Find the binding energy per nucleon (MeV).
    answer: '7'
    check: 56/8
    difficulty: 1
    hints:
    - E_b/A.
    - 56/8.
    solution: 7 MeV.
    mistakes: {"448": "p12_be_per_nucleon", "64": "p12_be_per_nucleon"}
  - prompt: If R = R₀A^(1/3), by what factor is a nucleus with A = 27 larger in radius than one with A = 1?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - 27^(1/3).
    - '3.'
    solution: 3 times.
    mistakes: {"27": "p12_nuclear_radius", "9": "p12_nuclear_radius"}
  - prompt: Which nucleus is the most stable (highest binding energy per nucleon)?
    options:
    - iron-56
    - uranium-235
    - helium-4
    - hydrogen-1
    answer: iron-56
    difficulty: 2
    hints:
    - Peak of the curve.
    - A ≈ 56.
    solution: Iron-56.
    mistakes:
      uranium-235: c12p_be
  - prompt: 'The nuclear force is:'
    options:
    - strong and short-range
    - weak and long-range
    - the same as gravity
    - only between protons
    answer: strong and short-range
    difficulty: 1
    hints:
    - Holds nucleus together.
    - About 2–3 fm.
    solution: Strong and short-range.
    mistakes: {"weak and long-range": "p12_nuclear_force", "the same as gravity": "p12_nuclear_force", "only between protons": "p12_nuclear_force"}
  - prompt: How many neutrons are in ⁵⁶Fe (Z = 26)?
    answer: '30'
    check: 56 - 26
    difficulty: 1
    hints:
    - N = A − Z.
    - 56 − 26.
    solution: 'Step 1: 56 − 26. Step 2: 30.'
    mistakes:
      '26': c12p13_count
      '82': c12p13_count
  - prompt: A mass defect of 0.02 u gives how much energy (MeV)? Use 931.5 MeV/u, as a fraction.
    answer: 1863/100
    check: Rational(2,100)*Rational(9315,10)
    difficulty: 1
    hints:
    - E = ΔM × 931.5.
    - 0.02 × 931.5.
    solution: 'Step 1: 18.63 MeV. Step 2: 1863/100.'
    mistakes:
      9315/2: c12p13_be
      1863/10: c12p13_be
  - prompt: A nucleus with A = 20 has binding energy 160 MeV. Binding energy per nucleon (MeV)?
    answer: '8'
    check: 160/20
    difficulty: 1
    hints:
    - Divide by A.
    - 160/20.
    solution: 'Step 1: 160/20. Step 2: 8 MeV.'
    mistakes:
      '3200': c12p13_be
      '180': c12p13_be
  - prompt: If R = R₀A^(1/3), how many times larger is the radius of A = 64 than A = 1?
    answer: '4'
    check: 64**Rational(1,3)
    difficulty: 2
    hints:
    - Take the cube root of 64.
    - 4 × 4 × 4 = 64.
    solution: 'Step 1: 64^(1/3). Step 2: 4.'
    mistakes:
      '8': c12p13_count
      '64': c12p13_count
  - prompt: '¹⁴C and ¹⁴N are:'
    options:
    - isobars
    - isotopes
    - isotones
    answer: isobars
    difficulty: 2
    hints:
    - Compare A and Z.
    - Same A = 14, different Z.
    solution: 'Step 1: equal mass numbers. Step 2: isobars.'
    mistakes:
      isotopes: c12p13_count
      isotones: c12p13_count
  - prompt: 'Nuclear density compared for a light and a heavy nucleus is:'
    options:
    - about the same
    - much larger for heavy nuclei
    - much larger for light nuclei
    answer: about the same
    difficulty: 2
    hints:
    - Volume ∝ R³ ∝ A.
    - Mass ∝ A too.
    solution: 'Step 1: mass/volume ∝ A/A. Step 2: constant.'
    mistakes:
      much larger for heavy nuclei: c12p13_count
      much larger for light nuclei: c12p13_count
  - prompt: Helium-4 has binding energy about 28 MeV. Binding energy per nucleon (MeV)?
    answer: '7'
    check: 28/4
    difficulty: 2
    hints:
    - Divide by the number of nucleons.
    - 28/4.
    solution: 'Step 1: 4 nucleons. Step 2: 7 MeV.'
    mistakes:
      '14': c12p13_be
      '112': c12p13_be
  - prompt: 'Deuterium: m_p + m_n − m_D = 0.0024 u. Binding energy (MeV) using 931.5, rounded to 1 decimal place?'
    options:
    - '2.2'
    - '22.4'
    - '0.2'
    answer: '2.2'
    difficulty: 3
    hints:
    - E = 0.0024 × 931.5.
    - About 2.24.
    solution: 'Step 1: 0.0024 × 931.5 ≈ 2.24 MeV. Step 2: 2.2.'
    mistakes:
      '22.4': c12p13_be
      '0.2': c12p13_be
  - prompt: 'The nuclear force between two protons compared with between two neutrons at the same distance is:'
    options:
    - about the same
    - much stronger
    - zero
    answer: about the same
    difficulty: 3
    hints:
    - The nuclear force ignores charge.
    - Charge independence.
    solution: 'Step 1: charge independent. Step 2: about equal.'
    mistakes:
      much stronger: c12p13_count
      zero: c12p13_count
- code: cbse12p.nuclei.energy
  title: Nuclear fission and fusion
  after:
  - cbse12p.nuclei.structure
  notes: |
    Nuclear fission: heavy nucleus (²³⁵U + n) splits into two medium nuclei + 2–3 neutrons + ~200 MeV; chain reaction;
    controlled in reactors (moderator slows neutrons: heavy water, graphite; control rods: cadmium, boron absorb neutrons;
    coolant), uncontrolled in bombs. Nuclear fusion: light nuclei combine (hydrogen → helium) at very high temperatures
    (thermonuclear); source of stellar energy; releases more energy per nucleon. India's nuclear programme (Tarapur, Kudankulam).
  explanations:
    text: Nuclear fission splits a heavy nucleus like uranium into smaller ones, releasing energy and neutrons that can split more nuclei in a chain reaction. Nuclear fusion joins light nuclei like hydrogen into helium, which powers the Sun.
    visual: 'Draw a neutron hitting a uranium nucleus: it splits into two pieces plus three neutrons, each heading off to split another nucleus: a chain reaction.'
    step_by_step: 'Step 1: Fission: heavy → medium nuclei + neutrons + energy. Step 2: Chain reaction controlled by rods. Step 3: Fusion: light → heavier, needs very high temperature.'
    real_world: India's Kudankulam power plant in Tamil Nadu produces electricity using controlled fission.
  picture:
    kind: compare
    columns:
    - title: Process
      points:
      - fission
      - fusion
    - title: Nuclei
      points:
      - heavy nucleus splits
      - light nuclei join
    - title: Example
      points:
      - uranium-235 in reactors
      - hydrogen in the Sun
    alt: Fission and fusion compared.
  activity:
    type: sort
    prompt: Fission or fusion?
    bins:
    - Fission
    - Fusion
    items:
    - label: A heavy nucleus splits into two medium ones
      bin: Fission
      clue: Does the nucleus break apart or join with another?
      why: Splitting a heavy nucleus is fission.
    - label: ²³⁵U absorbs a neutron and splits
      bin: Fission
      clue: Is uranium heavy or light?
      why: Neutron-induced fission of U-235.
    - label: A chain reaction carried on by neutrons
      bin: Fission
      clue: Each event releases 2–3 neutrons. Which process?
      why: Fission releases neutrons that cause more fissions.
    - label: Today's nuclear power stations
      bin: Fission
      clue: Do power reactors split or join nuclei?
      why: All working power reactors use controlled fission.
    - label: Cadmium control rods and a moderator
      bin: Fission
      clue: 'What do they control: neutrons or temperature?'
      why: They control the neutrons in a fission chain.
    - label: Light nuclei join to make a heavier one
      bin: Fusion
      clue: Do nuclei join or split?
      why: Joining light nuclei is fusion.
    - label: What powers the Sun
      bin: Fusion
      clue: What happens to hydrogen in the Sun's core?
      why: Hydrogen fuses into helium.
    - label: Needs temperatures around 10⁷ K
      bin: Fusion
      clue: Why must nuclei move very fast to react?
      why: 'Light nuclei must overcome their repulsion to fuse: thermonuclear fusion.'
    - label: Deuterium + tritium → helium + neutron
      bin: Fusion
      clue: Two light nuclei make a heavier one. Which process?
      why: A fusion reaction.
  lesson:
    - teach: 'Nuclear fission: a slow neutron hits ²³⁵U, which splits into two medium nuclei plus 2–3 neutrons and about 200 MeV. Those neutrons can split more nuclei: a chain reaction.'
      picture:
        kind: flow
        steps:
        - Neutron hits U-235
        - U-236 splits
        - Two fragments + 2–3 neutrons
        - ~200 MeV released
        - Neutrons cause more fissions
        alt: Steps in a fission chain reaction.
      check:
        prompt: Why can fission sustain itself?
        options:
        - each fission releases more neutrons
        - uranium heats up
        - the fragments fuse again
        answer: each fission releases more neutrons
        why: The new neutrons trigger further fissions.
    - teach: In a reactor the chain is controlled. A moderator (heavy water, graphite) slows neutrons so they cause fission. Control rods (cadmium, boron) absorb neutrons to keep the rate steady. A coolant carries heat away to make steam for turbines. India has reactors at Tarapur, Kudankulam and elsewhere.
      check:
        prompt: 'Pushing control rods further in makes the reaction rate:'
        options:
        - fall
        - rise
        - stay the same
        answer: fall
        why: More neutrons are absorbed.
    - teach: 'Nuclear fusion: light nuclei join (hydrogen into helium), releasing even more energy per nucleon. It needs temperatures of millions of kelvin so nuclei can overcome their electrical repulsion. Fusion powers the Sun and stars.'
      check:
        prompt: 'Fusion happens naturally in:'
        options:
        - the core of stars
        - uranium mines
        - car engines
        answer: the core of stars
        why: Only there are temperature and pressure high enough.
  items:
  - prompt: About how much energy (MeV) is released per fission of uranium-235?
    answer: '200'
    check: '200'
    difficulty: 1
    hints:
    - Typical value.
    - Two hundred.
    solution: About 200 MeV.
    mistakes: {"20": "p12_fission_energy", "2000": "p12_fission_energy"}
  - prompt: Each fission releases 3 neutrons, each causing another fission. How many fissions are in the 3rd generation (starting from 1)?
    answer: '9'
    check: 3**2
    difficulty: 2
    hints:
    - 1, 3, 9.
    - 3².
    solution: '9.'
    mistakes: {"27": "p12_chain", "3": "p12_chain", "6": "p12_chain"}
  - prompt: 'In a nuclear reactor, control rods are made of materials that:'
    options:
    - absorb neutrons
    - speed up neutrons
    - produce neutrons
    - cool the reactor
    answer: absorb neutrons
    difficulty: 2
    hints:
    - Cadmium, boron.
    - Slow the chain.
    solution: Absorb neutrons.
    mistakes: {"speed up neutrons": "p12_control_rods", "produce neutrons": "p12_control_rods", "cool the reactor": "p12_control_rods"}
  - prompt: 'A moderator in a reactor:'
    options:
    - slows down neutrons
    - absorbs all neutrons
    - stops the reaction
    - makes uranium
    answer: slows down neutrons
    difficulty: 2
    hints:
    - Heavy water, graphite.
    - Slow neutrons cause fission better.
    solution: Slows neutrons down.
    mistakes: {"absorbs all neutrons": "p12_moderator", "stops the reaction": "p12_moderator", "makes uranium": "p12_moderator"}
  - prompt: 'The Sun''s energy comes from:'
    options:
    - nuclear fusion
    - nuclear fission
    - chemical burning
    - radioactive decay of uranium
    answer: nuclear fusion
    difficulty: 1
    hints:
    - Hydrogen into helium.
    - Very hot core.
    solution: Nuclear fusion.
    mistakes:
      nuclear fission: c12p_fission
  - prompt: 'Fusion needs very high temperatures because:'
    options:
    - nuclei must overcome their electrical repulsion
    - it needs light
    - it absorbs energy
    - neutrons are slow
    answer: nuclei must overcome their electrical repulsion
    difficulty: 2
    hints:
    - Both positive.
    - Thermonuclear.
    solution: Positive nuclei must move fast enough to overcome repulsion.
    mistakes: {"it needs light": "p12_fusion", "it absorbs energy": "p12_fusion", "neutrons are slow": "p12_fusion"}
  - prompt: Each fission releases 200 MeV. Energy (MeV) from 50 fissions?
    answer: '10000'
    check: 200*50
    difficulty: 1
    hints:
    - Multiply.
    - 200 × 50.
    solution: 'Step 1: 200 × 50. Step 2: 10000 MeV.'
    mistakes:
      '250': c12p13_react
      '4': c12p13_react
  - prompt: Each fission releases 2 neutrons, each causing another fission. Fissions in the 4th generation (starting with 1)?
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - 1, 2, 4, …
    - Double each generation.
    solution: 'Step 1: 1, 2, 4, 8. Step 2: 8.'
    mistakes:
      '16': c12p13_react
      '6': c12p13_react
  - prompt: Which material is used as a moderator?
    options:
    - heavy water
    - cadmium
    - lead
    answer: heavy water
    difficulty: 1
    hints:
    - It slows neutrons without absorbing them much.
    - Cadmium absorbs them.
    solution: 'Step 1: moderators slow neutrons. Step 2: heavy water.'
    mistakes:
      cadmium: c12p13_react
      lead: c12p13_react
  - prompt: Which is used in control rods?
    options:
    - boron
    - graphite
    - heavy water
    answer: boron
    difficulty: 2
    hints:
    - Control rods absorb neutrons.
    - Cadmium is another.
    solution: 'Step 1: strong neutron absorbers. Step 2: boron.'
    mistakes:
      graphite: c12p13_react
      heavy water: c12p13_react
  - prompt: 200 MeV in joules, in units of 10⁻¹¹ J (1 MeV = 1.6 × 10⁻¹³ J)?
    answer: 16/5
    check: 200*Rational(16,10)*10**-13*10**11
    difficulty: 2
    hints:
    - Multiply by 1.6 × 10⁻¹³.
    - 200 × 1.6 = 320.
    solution: 'Step 1: 3.2 × 10⁻¹¹ J. Step 2: 16/5.'
    mistakes:
      '32': c12p13_react
      '16': c12p13_react
  - prompt: Why are neutrons, not protons, used to start fission?
    options:
    - neutrons are not repelled by the nucleus
    - neutrons are heavier than uranium
    - protons are too slow
    answer: neutrons are not repelled by the nucleus
    difficulty: 2
    hints:
    - The nucleus is positive.
    - What charge does a neutron have?
    solution: 'Step 1: neutrons are neutral. Step 2: no repulsion, so they reach the nucleus easily.'
    mistakes:
      neutrons are heavier than uranium: c12p13_react
      protons are too slow: c12p13_react
  - prompt: 'In the Sun, fusion turns hydrogen into:'
    options:
    - helium
    - uranium
    - iron
    answer: helium
    difficulty: 2
    hints:
    - The next light element.
    - Four hydrogens make one.
    solution: 'Step 1: light nuclei combine. Step 2: helium.'
    mistakes:
      uranium: c12p13_react
      iron: c12p13_react
  - prompt: Why is uncontrolled fission dangerous?
    options:
    - the number of fissions grows extremely fast, releasing huge energy
    - it uses up all the oxygen
    - it freezes the reactor
    answer: the number of fissions grows extremely fast, releasing huge energy
    difficulty: 3
    hints:
    - Think of the doubling chain.
    - No neutrons are absorbed.
    solution: 'Step 1: exponential growth. Step 2: explosive energy release.'
    mistakes:
      it uses up all the oxygen: c12p13_react
      it freezes the reactor: c12p13_react
  - prompt: Per kilogram of fuel, which releases more energy?
    options:
    - fusion
    - fission
    - burning coal
    answer: fusion
    difficulty: 3
    hints:
    - Compare energy per nucleon.
    - The binding energy curve rises steeply for light nuclei.
    solution: 'Step 1: fusion gains more MeV per nucleon. Step 2: fusion.'
    mistakes:
      fission: c12p13_react
      burning coal: c12p13_react
