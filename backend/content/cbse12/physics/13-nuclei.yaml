# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 13. Format: content/README.md.
subject: cbse12-phy
chapter: 13
title: Nuclei
tips:
  c12p_be: Binding energy = mass defect × c² (1 u ≈ 931.5 MeV). Higher binding energy per nucleon means a more stable nucleus.
  c12p_fission: Fission splits a heavy nucleus; fusion joins light nuclei. Both release energy because products are more tightly bound.
concepts:
- code: cbse12p.nuclei.structure
  title: Nuclear structure and binding energy
  notes: |
    Atomic masses in u (1/12 of C-12 = 1.66 × 10⁻²⁷ kg). Nucleus: Z protons, N neutrons, A = Z + N; isotopes, isobars, isotones.
    Size R = R₀A^(1/3) (R₀ ≈ 1.2 fm); nuclear density constant (~2.3 × 10¹⁷ kg/m³). Mass–energy E = mc². Mass defect ΔM =
    [Zm_p + Nm_n] − M; binding energy E_b = ΔMc² (1 u ↔ 931.5 MeV). Binding energy per nucleon curve: peak ~8.75 MeV near
    A = 56 (iron); nuclear force: strong, short-range, charge independent. (Radioactivity removed in rationalised syllabus.)
  explanations:
    text: The nucleus holds protons and neutrons together with the strong nuclear force. A nucleus weighs a little less than its separate parts; this missing mass became the binding energy that holds it together (E = mc²). Iron's nucleus is the most tightly bound.
    visual: 'Draw the binding-energy-per-nucleon curve: it rises steeply for light nuclei, peaks near iron (A ≈ 56), then slowly falls for heavy ones.'
    step_by_step: 'Step 1: Add the masses of the separate protons and neutrons. Step 2: Subtract the nucleus''s mass to get the mass defect. Step 3: Multiply by 931.5 MeV/u. Step 4: Divide by A for energy per nucleon.'
    real_world: The Sun shines because hydrogen nuclei fuse into helium, turning a little mass into a lot of energy.
  picture:
    kind: flow
    steps:
    - Separate protons + neutrons
    - Combine into nucleus
    - Mass decreases (mass defect)
    - 'Energy released: ΔMc²'
    alt: 'Binding energy: when nucleons combine, the lost mass becomes energy.'
  items:
  - prompt: How many neutrons are in ²³⁵U (Z = 92)?
    answer: '143'
    check: 235-92
    difficulty: 1
    hints:
    - A − Z.
    - 235 − 92.
    solution: '143.'
  - prompt: A mass defect of 0.1 u corresponds to how much energy (MeV), using 931.5 MeV/u?
    answer: '93.15'
    check: Rational(9315,100)
    difficulty: 2
    hints:
    - 0.1 × 931.5.
    - Multiply.
    solution: 93.15 MeV.
  - prompt: A nucleus with A = 8 has binding energy 56 MeV. Find the binding energy per nucleon (MeV).
    answer: '7'
    check: 56/8
    difficulty: 1
    hints:
    - E_b/A.
    - 56/8.
    solution: 7 MeV.
  - prompt: If R = R₀A^(1/3), by what factor is a nucleus with A = 27 larger in radius than one with A = 1?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - 27^(1/3).
    - '3.'
    solution: 3 times.
  - prompt: Which nucleus is the most stable (highest binding energy per nucleon)?
    options:
    - iron-56
    - uranium-235
    - helium-4
    - hydrogen-1
    answer: iron-56
    difficulty: 2
    hints:
    - Peak of the curve.
    - A ≈ 56.
    solution: Iron-56.
    mistakes:
      uranium-235: c12p_be
  - prompt: 'The nuclear force is:'
    options:
    - strong and short-range
    - weak and long-range
    - the same as gravity
    - only between protons
    answer: strong and short-range
    difficulty: 1
    hints:
    - Holds nucleus together.
    - About 2–3 fm.
    solution: Strong and short-range.
- code: cbse12p.nuclei.energy
  title: Nuclear fission and fusion
  after:
  - cbse12p.nuclei.structure
  notes: |
    Nuclear fission: heavy nucleus (²³⁵U + n) splits into two medium nuclei + 2–3 neutrons + ~200 MeV; chain reaction;
    controlled in reactors (moderator slows neutrons: heavy water, graphite; control rods: cadmium, boron absorb neutrons;
    coolant), uncontrolled in bombs. Nuclear fusion: light nuclei combine (hydrogen → helium) at very high temperatures
    (thermonuclear); source of stellar energy; releases more energy per nucleon. India's nuclear programme (Tarapur, Kudankulam).
  explanations:
    text: Nuclear fission splits a heavy nucleus like uranium into smaller ones, releasing energy and neutrons that can split more nuclei in a chain reaction. Nuclear fusion joins light nuclei like hydrogen into helium, which powers the Sun.
    visual: 'Draw a neutron hitting a uranium nucleus: it splits into two pieces plus three neutrons, each heading off to split another nucleus: a chain reaction.'
    step_by_step: 'Step 1: Fission: heavy → medium nuclei + neutrons + energy. Step 2: Chain reaction controlled by rods. Step 3: Fusion: light → heavier, needs very high temperature.'
    real_world: India's Kudankulam power plant in Tamil Nadu produces electricity using controlled fission.
  picture:
    kind: compare
    columns:
    - title: Process
      points:
      - fission
      - fusion
    - title: Nuclei
      points:
      - heavy nucleus splits
      - light nuclei join
    - title: Example
      points:
      - uranium-235 in reactors
      - hydrogen in the Sun
    alt: Fission and fusion compared.
  items:
  - prompt: About how much energy (MeV) is released per fission of uranium-235?
    answer: '200'
    check: '200'
    difficulty: 1
    hints:
    - Typical value.
    - Two hundred.
    solution: About 200 MeV.
  - prompt: Each fission releases 3 neutrons, each causing another fission. How many fissions are in the 3rd generation (starting from 1)?
    answer: '9'
    check: 3**2
    difficulty: 2
    hints:
    - 1, 3, 9.
    - 3².
    solution: '9.'
  - prompt: 'In a nuclear reactor, control rods are made of materials that:'
    options:
    - absorb neutrons
    - speed up neutrons
    - produce neutrons
    - cool the reactor
    answer: absorb neutrons
    difficulty: 2
    hints:
    - Cadmium, boron.
    - Slow the chain.
    solution: Absorb neutrons.
  - prompt: 'A moderator in a reactor:'
    options:
    - slows down neutrons
    - absorbs all neutrons
    - stops the reaction
    - makes uranium
    answer: slows down neutrons
    difficulty: 2
    hints:
    - Heavy water, graphite.
    - Slow neutrons cause fission better.
    solution: Slows neutrons down.
  - prompt: 'The Sun''s energy comes from:'
    options:
    - nuclear fusion
    - nuclear fission
    - chemical burning
    - radioactive decay of uranium
    answer: nuclear fusion
    difficulty: 1
    hints:
    - Hydrogen into helium.
    - Very hot core.
    solution: Nuclear fusion.
    mistakes:
      nuclear fission: c12p_fission
  - prompt: 'Fusion needs very high temperatures because:'
    options:
    - nuclei must overcome their electrical repulsion
    - it needs light
    - it absorbs energy
    - neutrons are slow
    answer: nuclei must overcome their electrical repulsion
    difficulty: 2
    hints:
    - Both positive.
    - Thermonuclear.
    solution: Positive nuclei must move fast enough to overcome repulsion.
