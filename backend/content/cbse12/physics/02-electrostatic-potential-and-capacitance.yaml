# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse12-phy
chapter: 2
title: Electrostatic Potential and Capacitance
tips:
  c12p_cap_series: 'Capacitors in series: 1/C = 1/C₁ + 1/C₂ (smaller total). In parallel: C = C₁ + C₂ (larger total). Opposite of resistors.'
  c12p_potential: 'Potential V = kq/r falls as 1/r, while the field falls as 1/r². Potential is a scalar: just add values.'
  p12_cap_d: "C = ε₀A/d. What happens when d grows?"
  p12_cap_energy: "U = ½CV²."
  p12_cap_parallel: "Capacitors in parallel add directly, like resistors in series."
  p12_capacitance: "C = Q/V."
  p12_conductor_inside: "Free charges in a conductor move until they feel no force inside."
  p12_dielectric: "A dielectric multiplies the capacitance by K."
  p12_equipotential: "No work is done moving along an equipotential, so the field has no component along it."
  p12_potential: "V = kq/r, with q in coulombs."
  p12_potential_sum: "Potential is a scalar: add kq/r for each charge, with signs."
  p12_work_pd: "W = qV."
  c12p2_v: 'Potential is a scalar: V = kq/r, falls as 1/r, and potentials from several charges simply add (with signs).'
  c12p2_work: Work = charge × potential difference, W = qΔV. Along an equipotential, ΔV = 0.
  c12p2_comb: 'Parallel capacitors add directly. Series: add the reciprocals, then flip.'
  c12p2_energy: Energy stored U = ½CV² = Q²/(2C) = ½QV. Pick the form that uses what you know.
concepts:
- code: cbse12p.pot.potential
  title: Electric potential and potential energy
  notes: |
    Electrostatic potential V = work done per unit charge bringing a test charge from infinity: V = kq/r (scalar; volt =
    J/C). Potential difference; E = −dV/dr. Equipotential surfaces: perpendicular to field lines, no work moving along them.
    Potential of a dipole kp cos θ/r²; system of charges: add potentials. Potential energy of two charges U = kq₁q₂/r; of a
    dipole in a field U = −pE cos θ. Conductors: field zero inside, surface is equipotential, charge on surface.
  explanations:
    text: Electric potential is the energy per unit charge at a point, measured in volts. Unlike field, it's a plain number, so potentials from several charges just add. Charges move from high to low potential, like water flowing downhill.
    visual: 'Picture contour lines on a map: equipotential surfaces are like contours, and the field points downhill, crossing them at right angles.'
    step_by_step: 'Step 1: V = kq/r for each charge. Step 2: Add the values (watch signs). Step 3: Work = qΔV. Step 4: Potential energy of a pair = kq₁q₂/r.'
    real_world: A 9 V battery gives each coulomb of charge 9 joules of energy as it moves round a circuit.
  picture:
    kind: flow
    steps:
    - Charge q at a point
    - V = kq/r (a scalar)
    - Add potentials of all charges
    - Work = charge × potential difference
    alt: 'Electric potential: find V for each charge, add them, and use W = qΔV.'
  activity:
    type: formula
    prompt: '+4 nC sits at x = 0 and q₂ at x = 10 cm. The potential at a point between them is V = k(q₁/r₁ + q₂/r₂): a scalar sum, signs included.'
    inputs:
    - name: q2
      label: q₂
      min: -10
      max: 10
      step: 1
      start: 1
      unit: nC
    - name: x
      label: Point at x
      min: 1
      max: 9
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: v
      label: Potential V
      expr: 900*(4/x+q2/(10-x))
      unit: V
      places: 1
    goals:
    - prompt: With q₂ = −4 nC, find the point between them where V = 0.
      want:
        q2: -4
        v: 0
      mistakes:
      - when:
          q2: -4
          x:
          - 1
          - 4
        say: 'Nearer the +4 nC charge its potential wins: V > 0. Equal and opposite charges cancel at the middle.'
      - when:
          q2: -4
          x:
          - 6
          - 9
        say: 'Nearer the −4 nC charge: V < 0.'
    - prompt: Choose a negative q₂ so that V = 0 at x = 8 cm.
      want:
        x: 8
        v: 0
      mistakes:
      - when:
          x: 8
          q2: -4
        say: Equal charges cancel only at the middle. At 8 cm you're 4 times nearer q₂ than q₁, so q₂ can be 4 times smaller.
      - when:
          x: 8
          q2:
          - 1
          - 10
        say: A positive q₂ adds to the potential. To cancel, q₂ must be negative.
    - prompt: Make q₂ = +4 nC. Can V be 0 anywhere between them? Find where V is smallest.
      want:
        q2: 4
        x: 5
      mistakes:
      - when:
          q2: 4
          x:
          - 1
          - 4
        say: 'V grows close to either charge. Two positive potentials never cancel: the smallest is midway.'
      - when:
          q2: 4
          x:
          - 6
          - 9
        say: 'V grows close to either charge. Two positive potentials never cancel: the smallest is midway.'
  lesson:
    - teach: Electrostatic potential V at a point is the work done per unit positive charge to bring a test charge from infinity to that point. For a point charge V = kq/r. It is a scalar, measured in volts (J/C).
      check:
        prompt: Is potential a scalar or a vector?
        options:
        - scalar
        - vector
        - neither
        answer: scalar
        why: It is work per charge, and work is a scalar.
      ways:
      - style: visual
        teach: What 'potential at a point' means, built up one idea at a time.
        picture:
          kind: flow
          steps:
          - Start a +1 C test charge far away (infinity)
          - Bring it slowly to the point
          - Work done per coulomb = potential V
          - 'For a point charge: V = kq/r'
          alt: Start a unit positive test charge at infinity, bring it slowly to the point, and the work done per coulomb is the potential, which for a point charge is kq over r.
      - style: real_world
        teach: Electric potential is like height for a ball. A ball rolls from high ground to low ground, and a positive charge moves from high potential to low potential. A 9 V battery lifts each coulomb of charge through 9 J of 'electrical height'.
    - teach: 'For several charges, add their potentials, keeping signs. Potential energy of two charges is U = kq₁q₂/r. Moving charge q through potential difference ΔV takes work W = qΔV. The field points towards decreasing potential: E = −dV/dr.'
      picture:
        kind: bars
        bars:
        - label: r
          value: 4
        - label: 2r
          value: 2
        - label: 4r
          value: 1
        alt: 'Potential of a point charge at r, 2r and 4r: it halves each time the distance doubles.'
      check:
        prompt: Work to move 3 C between points 5 V apart?
        options:
        - 15 J
        - 8 J
        - 5/3 J
        answer: 15 J
        why: W = qΔV = 3 × 5.
      ways:
      - style: step_by_step
        teach: 'Potential at P from +8 μC at 2 m and −1 μC at 3 m. Step 1: V₁ = 9 × 10⁹ × 8 × 10⁻⁶ / 2 = 36 × 10³ V. Step 2: V₂ = 9 × 10⁹ × (−1 × 10⁻⁶) / 3 = −3 × 10³ V. Step 3: Potential is a scalar: just add. Step 4: V = 33 × 10³ V.'
      - style: real_world
        teach: 'A 1.5 V cell gives each coulomb 1.5 J of energy; a 230 V mains socket gives each coulomb 230 J. That is why W = qΔV: the same charge does far more work when pushed through a bigger potential difference.'
    - teach: Equipotential surfaces join points of equal potential. They are always perpendicular to field lines, and no work is needed to move a charge along them. Inside a conductor E = 0, and the whole conductor is at one potential; extra charge sits on the surface.
      check:
        prompt: Work to move 2 C along an equipotential at 10 V?
        options:
        - 0 J
        - 20 J
        - 5 J
        answer: 0 J
        why: ΔV = 0 along an equipotential.
      ways:
      - style: visual
        teach: Equipotential surfaces for two simple fields, always at right angles to the field lines.
        picture:
          kind: compare
          columns:
          - title: Point charge
            points:
            - 'Field lines: straight out from the charge'
            - 'Equipotentials: spheres around it'
          - title: Uniform field
            points:
            - 'Field lines: parallel, evenly spaced'
            - 'Equipotentials: flat planes across them'
          alt: Around a point charge the field lines go straight out and the equipotentials are spheres. In a uniform field the lines are parallel and the equipotentials are flat planes across them, always at right angles.
      - style: step_by_step
        teach: 'Work on a 3 C charge. Step 1: Moving along one equipotential: ΔV = 0, so W = 0. Step 2: Moving from the 10 V surface to the 4 V surface: ΔV = 6 V. Step 3: W = qΔV = 3 × 6. Step 4: The field does 18 J of work on it.'
  items:
  - prompt: Find the potential (in units of 10³ V) 1 m from a 1 μC charge (k = 9 × 10⁹).
    answer: '9'
    check: 9*10**9*10**-6/10**3
    difficulty: 1
    hints:
    - V = kq/r.
    - 9 × 10⁹ × 10⁻⁶.
    solution: 9 × 10³ V.
    mistakes: {"9000": "p12_potential", "0.009": "p12_potential"}
  - prompt: How much work (J) moves 2 C through a potential difference of 12 V?
    answer: '24'
    check: 2*12
    difficulty: 1
    hints:
    - W = qV.
    - 2 × 12.
    solution: 24 J.
    mistakes: {"6": "p12_work_pd", "14": "p12_work_pd"}
  - prompt: The distance from a point charge is doubled. By what factor does the potential fall?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - V ∝ 1/r.
    - Halves.
    solution: It halves.
    mistakes:
      '4': c12p_potential
  - prompt: Charges +2 μC and −2 μC are 1 m and 1 m from a point P. Find the potential at P (V).
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - Add scalars.
    - Equal and opposite.
    solution: 0 V.
    mistakes: {"36000": "p12_potential_sum", "18000": "p12_potential_sum"}
  - prompt: 'Equipotential surfaces are always:'
    options:
    - perpendicular to field lines
    - parallel to field lines
    - circles only
    - inside conductors only
    answer: perpendicular to field lines
    difficulty: 1
    hints:
    - No work along them.
    - Right angles.
    solution: Perpendicular to field lines.
    mistakes: {"parallel to field lines": "p12_equipotential", "circles only": "p12_equipotential", "inside conductors only": "p12_equipotential"}
  - prompt: 'Inside a charged conductor, the electric field is:'
    options:
    - zero
    - maximum
    - equal to the surface field
    - infinite
    answer: zero
    difficulty: 1
    hints:
    - Charges move to the surface.
    - Electrostatic shielding.
    solution: Zero.
    mistakes: {"maximum": "p12_conductor_inside", "equal to the surface field": "p12_conductor_inside", "infinite": "p12_conductor_inside"}
  - prompt: Find the potential (in units of 10³ V) 3 m from a 2 μC charge (k = 9 × 10⁹).
    answer: '6'
    check: 9*2/3
    difficulty: 1
    hints:
    - V = kq/r.
    - 9 × 10⁹ × 2 × 10⁻⁶ / 3.
    solution: 'Step 1: 18 × 10³ / 3. Step 2: 6 × 10³ V.'
    mistakes:
      '2': c12p2_v
      '18': c12p2_v
  - prompt: How much work (J) moves 0.5 C through a potential difference of 40 V?
    answer: '20'
    check: Rational(1,2)*40
    difficulty: 1
    hints:
    - W = qΔV.
    - 0.5 × 40.
    solution: 'Step 1: 0.5 × 40. Step 2: 20 J.'
    mistakes:
      '80': c12p2_work
      '40': c12p2_work
  - prompt: Distance from a point charge is tripled. By what factor does the potential fall?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - V ∝ 1/r.
    - Not 1/r².
    solution: 'Step 1: r → 3r. Step 2: V → V/3.'
    mistakes:
      '9': c12p2_v
      '6': c12p2_v
  - prompt: +3 μC at 1 m and −1 μC at 1 m from point P. Find V at P in units of 10³ V (k = 9 × 10⁹).
    answer: '18'
    check: 9*(3 - 1)
    difficulty: 2
    hints:
    - Add potentials with signs.
    - k(3 − 1) × 10⁻⁶ / 1.
    solution: 'Step 1: 9 × 10⁹ × 2 × 10⁻⁶. Step 2: 18 × 10³ V.'
    mistakes:
      '36': c12p2_v
      '27': c12p2_v
  - prompt: Potential energy (J) of two 1 μC charges 0.1 m apart? Give in units of 10⁻² J (k = 9 × 10⁹).
    answer: '9'
    check: 9*1*1/Rational(1,10)/10
    difficulty: 2
    hints:
    - U = kq₁q₂/r.
    - 9 × 10⁹ × 10⁻¹² / 0.1.
    solution: 'Step 1: 9 × 10⁻³ / 0.1 = 9 × 10⁻² J. Step 2: 9.'
    mistakes:
      '90': c12p2_v
      '1': c12p2_v
  - prompt: V changes from 50 V to 20 V over 0.1 m along a line. Find the field magnitude (V/m).
    answer: '300'
    check: (50 - 20)/Rational(1,10)
    difficulty: 2
    hints:
    - E = −dV/dr.
    - 30 V over 0.1 m.
    solution: 'Step 1: ΔV = 30 V. Step 2: 30/0.1 = 300 V/m.'
    mistakes:
      '3': c12p2_work
      '700': c12p2_work
  - prompt: 'The field inside a charged hollow metal sphere is:'
    options:
    - zero
    - kq/r²
    - largest at the centre
    answer: zero
    difficulty: 2
    hints:
    - The sphere is a conductor.
    - Charges move until the inside is field-free.
    solution: 'Step 1: conductor in equilibrium. Step 2: E = 0 inside.'
    mistakes:
      kq/r²: c12p2_v
      largest at the centre: c12p2_v
  - prompt: An electron (charge 1.6 × 10⁻¹⁹ C) is accelerated through 100 V. Find its energy gain in units of 10⁻¹⁷ J.
    answer: 8/5
    check: Rational(16,10)*100/100
    difficulty: 3
    hints:
    - W = qV.
    - 1.6 × 10⁻¹⁹ × 100.
    solution: 'Step 1: 1.6 × 10⁻¹⁷ J. Step 2: 8/5 (= 1.6).'
    mistakes:
      '16': c12p2_work
      '100': c12p2_work
  - prompt: 'A dipole in a uniform field has least potential energy when θ (between p and E) is:'
    options:
    - 0°
    - 90°
    - 180°
    answer: 0°
    difficulty: 3
    hints:
    - U = −pE cos θ.
    - When is −cos θ smallest?
    solution: 'Step 1: cos 0° = 1. Step 2: U = −pE, the least.'
    mistakes:
      90°: c12p2_v
      180°: c12p2_v
  - prompt: 'Assertion (A): No work is done in moving a charge along an equipotential surface.

      Reason (R): The electric field is perpendicular to an equipotential surface.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Since E is perpendicular to the surface (R), the force on the charge has no component along the motion, so W = 0. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In an old TV tube, an electron (charge 1.6 × 10⁻¹⁹ C) starts from rest and is accelerated through 2000 V. How much kinetic energy does it gain?'
    options:
    - 3.2 × 10⁻¹⁶ J
    - 1.6 × 10⁻¹⁹ J
    - 2000 J
    answer: 3.2 × 10⁻¹⁶ J
    hints:
    - Energy gained = qΔV.
    - Multiply 1.6 × 10⁻¹⁹ by 2000.
    solution: W = qΔV = 1.6 × 10⁻¹⁹ × 2000 = 3.2 × 10⁻¹⁶ J.
    mistakes:
      1.6 × 10⁻¹⁹ J: c12p2_work
      2000 J: c12p2_work
    exam: case
    difficulty: 2
  - prompt: At a point P, the electric field due to two charges is zero. Must the potential at P also be zero?
    options:
    - 'No: midway between two equal positive charges E = 0 but V = 2kq/r'
    - Yes, always
    - Yes, because V = E × r
    answer: 'No: midway between two equal positive charges E = 0 but V = 2kq/r'
    hints:
    - Field is a vector; potential is a scalar.
    - Try two equal positive charges and the midpoint between them.
    solution: 'At the midpoint the two fields are equal and opposite, so E = 0. The potentials are both positive and add: V = 2kq/r ≠ 0.'
    mistakes:
      Yes, always: c12p2_v
      Yes, because V = E × r: c12p2_v
    exam: competency
    difficulty: 2
- code: cbse12p.pot.capacitance
  title: Capacitors and dielectrics
  after:
  - cbse12p.pot.potential
  notes: |
    Capacitor: two conductors separated by an insulator; C = Q/V (farad). Parallel plate: C = ε₀A/d; with dielectric of
    constant K: C = Kε₀A/d. Dielectrics reduce the field (polarisation). Combinations: series 1/C = Σ1/Cᵢ (same charge);
    parallel C = ΣCᵢ (same voltage). Energy stored U = ½CV² = Q²/(2C) = ½QV; energy density ½ε₀E².
  explanations:
    text: A capacitor stores charge and energy between two plates. Its capacitance grows with plate area and shrinks with gap; filling the gap with a dielectric increases it. Capacitors in parallel add up; in series, their reciprocals add.
    visual: Draw two parallel plates with + charges on one and − on the other, and field lines straight across the gap. Insert a slab of glass and the field inside weakens, so more charge can be stored.
    step_by_step: 'Step 1: C = Q/V or ε₀KA/d. Step 2: For parallel, add C values. Step 3: For series, add 1/C values. Step 4: Energy = ½CV².'
    real_world: Camera flashes charge a capacitor slowly and then dump its energy in a fraction of a second.
  picture:
    kind: compare
    columns:
    - title: Combination
      points:
      - series
      - parallel
    - title: Total
      points:
      - 1/C = 1/C₁ + 1/C₂
      - C = C₁ + C₂
    - title: Same for each
      points:
      - charge
      - voltage
    alt: 'Capacitors in series and parallel: how they combine and what they share.'
  activity:
    type: formula
    prompt: 'A parallel-plate capacitor: C = Kε₀A ÷ d.'
    inputs:
    - name: a
      label: Plate area A
      min: 10
      max: 200
      step: 10
      start: 10
      unit: cm²
    - name: d
      label: Gap d
      min: 0.5
      max: 5
      step: 0.5
      start: 0.5
      unit: mm
    - name: k
      label: Dielectric constant K
      min: 1
      max: 10
      step: 1
      start: 1
    outputs:
    - name: c
      label: Capacitance
      expr: 0.885*k*a/d
      unit: pF
      places: 2
    goals:
    - prompt: A = 100 cm² and K = 1 (air). Set the gap so C = 17.7 pF.
      want:
        a: 100
        k: 1
        c: 17.7
      mistakes:
      - when:
          a: 100
          k: 1
          d:
          - 0.5
          - 4.5
        say: 'Plates closer together give MORE capacitance: C ∝ 1/d. Widen the gap.'
    - prompt: Keep A = 100 cm² and d = 5 mm. Fill the gap with a dielectric to make C = 88.5 pF.
      want:
        a: 100
        d: 5
        c: 88.5
      mistakes:
      - when:
          a: 100
          d: 5
          k:
          - 6
          - 10
        say: 'Too much: C is K times the air value of 17.7 pF.'
    - prompt: Keep A = 100 cm² and K = 1. Double the 17.7 pF.
      want:
        a: 100
        k: 1
        c: 35.4
      mistakes:
      - when:
          a: 100
          k: 1
          d: 5
        say: 'That''s still 17.7 pF. Halve the gap: C ∝ 1/d.'
      - when:
          a: 100
          k: 1
          d:
          - 0.5
          - 2
        say: 'Too close: C has more than doubled.'
  lesson:
    - teach: 'A capacitor is two conductors separated by an insulator. It stores charge: C = Q/V, in farads. A parallel-plate capacitor has C = ε₀A/d: bigger plates or a smaller gap give more capacitance.'
      check:
        prompt: 'Doubling the plate area of a parallel-plate capacitor makes C:'
        options:
        - double
        - half
        - four times
        answer: double
        why: C ∝ A.
      ways:
      - style: visual
        teach: How changing the plates changes a parallel-plate capacitor, C = ε₀A/d.
        picture:
          kind: flow
          steps:
          - 'Start: capacitance C'
          - 'Double the plate area A: 2C'
          - 'Halve the gap d: 2C'
          - 'Do both: 4C'
          alt: Starting from capacitance C, doubling the plate area gives 2C, halving the gap gives 2C, and doing both gives 4C.
      - style: real_world
        teach: A phone's touch screen is a grid of tiny capacitors. A finger near the glass changes the capacitance at that spot, and the phone senses where the change happened. That is why gloves, which keep the finger away, often do not work.
    - teach: A dielectric (insulator) of constant K between the plates becomes polarised and weakens the field, so C rises to Kε₀A/d. In parallel, capacitors share the same voltage and C = C₁ + C₂ + …; in series they carry the same charge and 1/C = 1/C₁ + 1/C₂ + …
      picture:
        kind: compare
        columns:
        - title: Series
          points:
          - same charge
          - 1/C = Σ1/Cᵢ
          - total smaller than each
        - title: Parallel
          points:
          - same voltage
          - C = ΣCᵢ
          - total larger than each
        alt: Capacitors in series and in parallel compared.
      check:
        prompt: 'Two 4 μF capacitors in series give:'
        options:
        - 2 μF
        - 8 μF
        - 4 μF
        answer: 2 μF
        why: 1/C = 1/4 + 1/4 = 1/2.
      ways:
      - style: step_by_step
        teach: 'Combine 4 μF and 12 μF. Step 1: In series: 1/C = 1/4 + 1/12 = 4/12. Step 2: So C = 3 μF, smaller than either. Step 3: In parallel: C = 4 + 12 = 16 μF. Step 4: Series shrinks, parallel adds: the opposite of resistors.'
      - style: real_world
        teach: A camera flash charges a capacitor slowly from a small battery, then empties it through the bulb in a thousandth of a second. The capacitor stores energy so it can be released much faster than the battery could supply it.
    - teach: 'Energy stored: U = ½CV² = Q²/(2C) = ½QV. It sits in the electric field between the plates, with energy density ½ε₀E².'
      check:
        prompt: Energy in a 4 F capacitor at 2 V?
        options:
        - 8 J
        - 16 J
        - 4 J
        answer: 8 J
        why: ½ × 4 × 2² = 8.
      ways:
      - style: visual
        teach: Energy stored in a 5 μF capacitor charged to 100 V.
        picture:
          kind: flow
          steps:
          - U = ½CV²
          - C = 5 × 10⁻⁶ F, V = 100 V
          - U = ½ × 5 × 10⁻⁶ × 10⁴
          - U = 0.025 J
          alt: Use U equals one half C V squared with C equal to 5 times 10 to the minus 6 farad and V equal to 100 volts, giving 0.025 joule.
      - style: step_by_step
        teach: 'What happens to U if V is doubled? Step 1: U = ½CV². Step 2: C stays the same. Step 3: V² becomes (2V)² = 4V². Step 4: So the stored energy becomes 4 times as large.'
  items:
  - prompt: A capacitor holds 20 μC at 10 V. Find its capacitance in μF.
    answer: '2'
    check: 20/10
    difficulty: 1
    hints:
    - C = Q/V.
    - 20/10.
    solution: 2 μF.
    mistakes: {"200": "p12_capacitance", "0.5": "p12_capacitance"}
  - prompt: Find the total capacitance (μF) of 2 μF and 3 μF in parallel.
    answer: '5'
    check: 2+3
    difficulty: 1
    hints:
    - Add.
    - 2 + 3.
    solution: 5 μF.
    mistakes: {"6/5": "p12_cap_parallel", "6": "p12_cap_parallel"}
  - prompt: Find the total capacitance (μF) of 3 μF and 6 μF in series.
    answer: '2'
    check: 1/(Rational(1,3)+Rational(1,6))
