# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse12-phy
chapter: 2
title: Electrostatic Potential and Capacitance
tips:
  c12p_series: 'Capacitors in series: 1/C = 1/C₁ + 1/C₂ (smaller total). In parallel: C = C₁ + C₂ (larger total). Opposite of resistors.'
  c12p_potential: 'Potential V = kq/r falls as 1/r, while the field falls as 1/r². Potential is a scalar: just add values.'
concepts:
- code: cbse12p.pot.potential
  title: Electric potential and potential energy
  notes: |
    Electrostatic potential V = work done per unit charge bringing a test charge from infinity: V = kq/r (scalar; volt =
    J/C). Potential difference; E = −dV/dr. Equipotential surfaces: perpendicular to field lines, no work moving along them.
    Potential of a dipole kp cos θ/r²; system of charges: add potentials. Potential energy of two charges U = kq₁q₂/r; of a
    dipole in a field U = −pE cos θ. Conductors: field zero inside, surface is equipotential, charge on surface.
  explanations:
    text: Electric potential is the energy per unit charge at a point, measured in volts. Unlike field, it's a plain number, so potentials from several charges just add. Charges move from high to low potential, like water flowing downhill.
    visual: 'Picture contour lines on a map: equipotential surfaces are like contours, and the field points downhill, crossing them at right angles.'
    step_by_step: 'Step 1: V = kq/r for each charge. Step 2: Add the values (watch signs). Step 3: Work = qΔV. Step 4: Potential energy of a pair = kq₁q₂/r.'
    real_world: A 9 V battery gives each coulomb of charge 9 joules of energy as it moves round a circuit.
  picture:
    kind: flow
    steps:
    - Charge q at a point
    - V = kq/r (a scalar)
    - Add potentials of all charges
    - Work = charge × potential difference
    alt: 'Electric potential: find V for each charge, add them, and use W = qΔV.'
  activity:
    type: formula
    prompt: '+4 nC sits at x = 0 and q₂ at x = 10 cm. The potential at a point between them is V = k(q₁/r₁ + q₂/r₂): a scalar sum, signs included.'
    inputs:
    - name: q2
      label: q₂
      min: -10
      max: 10
      step: 1
      start: 1
      unit: nC
    - name: x
      label: Point at x
      min: 1
      max: 9
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: v
      label: Potential V
      expr: 900*(4/x+q2/(10-x))
      unit: V
      places: 1
    goals:
    - prompt: With q₂ = −4 nC, find the point between them where V = 0.
      want:
        q2: -4
        v: 0
      mistakes:
      - when:
          q2: -4
          x:
          - 1
          - 4
        say: 'Nearer the +4 nC charge its potential wins: V > 0. Equal and opposite charges cancel at the middle.'
      - when:
          q2: -4
          x:
          - 6
          - 9
        say: 'Nearer the −4 nC charge: V < 0.'
    - prompt: Choose a negative q₂ so that V = 0 at x = 8 cm.
      want:
        x: 8
        v: 0
      mistakes:
      - when:
          x: 8
          q2: -4
        say: Equal charges cancel only at the middle. At 8 cm you're 4 times nearer q₂ than q₁, so q₂ can be 4 times smaller.
      - when:
          x: 8
          q2:
          - 1
          - 10
        say: A positive q₂ adds to the potential. To cancel, q₂ must be negative.
    - prompt: Make q₂ = +4 nC. Can V be 0 anywhere between them? Find where V is smallest.
      want:
        q2: 4
        x: 5
      mistakes:
      - when:
          q2: 4
          x:
          - 1
          - 4
        say: 'V grows close to either charge. Two positive potentials never cancel: the smallest is midway.'
      - when:
          q2: 4
          x:
          - 6
          - 9
        say: 'V grows close to either charge. Two positive potentials never cancel: the smallest is midway.'
  items:
  - prompt: Find the potential (in units of 10³ V) 1 m from a 1 μC charge (k = 9 × 10⁹).
    answer: '9'
    check: 9*10**9*10**-6/10**3
    difficulty: 1
    hints:
    - V = kq/r.
    - 9 × 10⁹ × 10⁻⁶.
    solution: 9 × 10³ V.
  - prompt: How much work (J) moves 2 C through a potential difference of 12 V?
    answer: '24'
    check: 2*12
    difficulty: 1
    hints:
    - W = qV.
    - 2 × 12.
    solution: 24 J.
  - prompt: The distance from a point charge is doubled. By what factor does the potential fall?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - V ∝ 1/r.
    - Halves.
    solution: It halves.
    mistakes:
      '4': c12p_potential
  - prompt: Charges +2 μC and −2 μC are 1 m and 1 m from a point P. Find the potential at P (V).
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - Add scalars.
    - Equal and opposite.
    solution: 0 V.
  - prompt: 'Equipotential surfaces are always:'
    options:
    - perpendicular to field lines
    - parallel to field lines
    - circles only
    - inside conductors only
    answer: perpendicular to field lines
    difficulty: 1
    hints:
    - No work along them.
    - Right angles.
    solution: Perpendicular to field lines.
  - prompt: 'Inside a charged conductor, the electric field is:'
    options:
    - zero
    - maximum
    - equal to the surface field
    - infinite
    answer: zero
    difficulty: 1
    hints:
    - Charges move to the surface.
    - Electrostatic shielding.
    solution: Zero.
- code: cbse12p.pot.capacitance
  title: Capacitors and dielectrics
  after:
  - cbse12p.pot.potential
  notes: |
    Capacitor: two conductors separated by an insulator; C = Q/V (farad). Parallel plate: C = ε₀A/d; with dielectric of
    constant K: C = Kε₀A/d. Dielectrics reduce the field (polarisation). Combinations: series 1/C = Σ1/Cᵢ (same charge);
    parallel C = ΣCᵢ (same voltage). Energy stored U = ½CV² = Q²/(2C) = ½QV; energy density ½ε₀E².
  explanations:
    text: A capacitor stores charge and energy between two plates. Its capacitance grows with plate area and shrinks with gap; filling the gap with a dielectric increases it. Capacitors in parallel add up; in series, their reciprocals add.
    visual: Draw two parallel plates with + charges on one and − on the other, and field lines straight across the gap. Insert a slab of glass and the field inside weakens, so more charge can be stored.
    step_by_step: 'Step 1: C = Q/V or ε₀KA/d. Step 2: For parallel, add C values. Step 3: For series, add 1/C values. Step 4: Energy = ½CV².'
    real_world: Camera flashes charge a capacitor slowly and then dump its energy in a fraction of a second.
  picture:
    kind: compare
    columns:
    - title: Combination
      points:
      - series
      - parallel
    - title: Total
      points:
      - 1/C = 1/C₁ + 1/C₂
      - C = C₁ + C₂
    - title: Same for each
      points:
      - charge
      - voltage
    alt: 'Capacitors in series and parallel: how they combine and what they share.'
  activity:
    type: formula
    prompt: 'A parallel-plate capacitor: C = Kε₀A ÷ d.'
    inputs:
    - name: a
      label: Plate area A
      min: 10
      max: 200
      step: 10
      start: 10
      unit: cm²
    - name: d
      label: Gap d
      min: 0.5
      max: 5
      step: 0.5
      start: 0.5
      unit: mm
    - name: k
      label: Dielectric constant K
      min: 1
      max: 10
      step: 1
      start: 1
    outputs:
    - name: c
      label: Capacitance
      expr: 0.885*k*a/d
      unit: pF
      places: 2
    goals:
    - prompt: A = 100 cm² and K = 1 (air). Set the gap so C = 17.7 pF.
      want:
        a: 100
        k: 1
        c: 17.7
      mistakes:
      - when:
          a: 100
          k: 1
          d:
          - 0.5
          - 4.5
        say: 'Plates closer together give MORE capacitance: C ∝ 1/d. Widen the gap.'
    - prompt: Keep A = 100 cm² and d = 5 mm. Fill the gap with a dielectric to make C = 88.5 pF.
      want:
        a: 100
        d: 5
        c: 88.5
      mistakes:
      - when:
          a: 100
          d: 5
          k:
          - 6
          - 10
        say: 'Too much: C is K times the air value of 17.7 pF.'
    - prompt: Keep A = 100 cm² and K = 1. Double the 17.7 pF.
      want:
        a: 100
        k: 1
        c: 35.4
      mistakes:
      - when:
          a: 100
          k: 1
          d: 5
        say: 'That''s still 17.7 pF. Halve the gap: C ∝ 1/d.'
      - when:
          a: 100
          k: 1
          d:
          - 0.5
          - 2
        say: 'Too close: C has more than doubled.'
  items:
  - prompt: A capacitor holds 20 μC at 10 V. Find its capacitance in μF.
    answer: '2'
    check: 20/10
    difficulty: 1
    hints:
    - C = Q/V.
    - 20/10.
    solution: 2 μF.
  - prompt: Find the total capacitance (μF) of 2 μF and 3 μF in parallel.
    answer: '5'
    check: 2+3
    difficulty: 1
    hints:
    - Add.
    - 2 + 3.
    solution: 5 μF.
  - prompt: Find the total capacitance (μF) of 3 μF and 6 μF in series.
    answer: '2'
    check: 1/(Rational(1,3)+Rational(1,6))
    difficulty: 2
    hints:
    - 1/C = 1/3 + 1/6.
    - = 1/2.
    solution: 2 μF.
    mistakes:
      '9': c12p_series
  - prompt: Find the energy stored (J) in a 2 F capacitor at 3 V.
    answer: '9'
    check: Rational(1,2)*2*3**2
    difficulty: 1
    hints:
    - ½CV².
    - ½ × 2 × 9.
    solution: 9 J.
  - prompt: A dielectric with K = 5 fills a 2 μF air capacitor. Find the new capacitance (μF).
    answer: '10'
    check: 5*2
    difficulty: 2
    hints:
    - C' = KC.
    - 5 × 2.
    solution: 10 μF.
  - prompt: 'Increasing the plate separation of a parallel-plate capacitor:'
    options:
    - decreases its capacitance
    - increases its capacitance
    - has no effect
    - makes it a resistor
    answer: decreases its capacitance
    difficulty: 2
    hints:
    - C = ε₀A/d.
    - d in the denominator.
    solution: It decreases the capacitance.
