    - P = I²R.
    - 10⁴ × 10 W.
    solution: 'Step 1: 10⁵ W. Step 2: 100 kW.'
    mistakes:
      '1': c12p7_power
      '1000': c12p7_power
  - prompt: Same power sent at 10 times the voltage. The loss becomes how many times smaller?
    answer: '100'
    check: 10**2
    difficulty: 3
    hints:
    - Current falls by 10.
    - Loss ∝ I².
    solution: 'Step 1: I → I/10. Step 2: I² → I²/100.'
    mistakes:
      '10': c12p7_power
      '1000': c12p7_power
  - prompt: An LC circuit has L = 0.01 H and C = 1 μF. Find its angular frequency ω (rad/s).
    answer: '10000'
    check: 1/sqrt(Rational(1,100)*10**-6)
    difficulty: 3
    hints:
    - ω = 1/√(LC).
    - LC = 10⁻⁸.
    solution: 'Step 1: √(10⁻⁸) = 10⁻⁴. Step 2: 10⁴ rad/s.'
    mistakes:
      '1000': c12p7_react
      '100000': c12p7_react
  - prompt: 'Assertion (A): A transformer cannot work on steady DC.

      Reason (R): A transformer works by mutual induction, which needs a changing flux.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Steady DC gives a constant flux in the core, so no EMF is induced in the secondary. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A power station sends 1 MW along a line of resistance 10 Ω. How much power is lost in the line if it is sent at 10 kV?'
    options:
    - 100 kW
    - 10 kW
    - 1 MW
    answer: 100 kW
    hints:
    - I = P/V.
    - Loss = I²R.
    solution: I = 10⁶/10⁴ = 100 A. Loss = 100² × 10 = 10⁵ W = 100 kW, a tenth of the power sent.
    mistakes:
      10 kW: c12p7_power
      1 MW: c12p7_power
    exam: case
    difficulty: 2
  - prompt: A student connects a 12 V car battery to the primary of a step-up transformer, hoping to get 240 V. The output is zero. Why?
    options:
    - "Steady DC gives no changing flux, so nothing is induced"
    - "The transformer needs many more turns on the secondary"
    - "The battery's voltage is too low to drive the transformer"
    answer: Steady DC gives no changing flux, so nothing is induced
    hints:
    - How does the secondary get its EMF?
    - What does DC do to the flux in the core?
    solution: A transformer works by mutual induction, which needs a changing current and flux. Steady DC gives a constant flux, so the secondary EMF is zero.
    mistakes:
      "The transformer needs many more turns on the secondary": c12p7_trans
      "The battery's voltage is too low to drive the transformer": c12p7_trans
    exam: competency
    difficulty: 2
