# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse12-phy
chapter: 7
title: Alternating Current
tips:
  c12p_rms: rms value = peak ÷ √2. Mains 230 V in India is the rms value; the peak is about 325 V.
  c12p_transformer: 'Transformer: Vs/Vp = Ns/Np. Step-up raises voltage but lowers current; power stays about the same.'
  p12_ac_power: "P = V_rms I_rms cos φ."
  p12_impedance: "Z = √(R² + (X_L − X_C)²)."
  p12_inductor_phase: "An inductor resists changes in current, so the current falls behind the voltage."
  p12_power_factor: "In a pure inductor, the phase difference is 90°. What is cos 90°?"
  p12_resonance: "At resonance X_L = X_C, so they cancel."
  p12_transformer: "Vs/Vp = Ns/Np."
  p12_transmission: "For the same power, higher voltage means lower current. Loss in wires is I²R."
  p12_xc: "X_C = 1/(ωC). Convert μF to F."
  p12_xl: "X_L = ωL."
  c12p7_rms: rms = peak/√2. Meters and supply ratings (like 220 V) are rms values.
  c12p7_react: X_L = ωL grows with frequency; X_C = 1/(ωC) shrinks with frequency. Z = √(R² + (X_L − X_C)²).
  c12p7_trans: 'Ideal transformer: Vs/Vp = Ns/Np = Ip/Is. More secondary turns means higher voltage and lower current.'
  c12p7_power: Average power = V_rms × I_rms × cos φ. Pure L or C gives cos φ = 0, so no average power.
concepts:
- code: cbse12p.ac.circuits
  title: AC circuits and reactance
  notes: |
    AC voltage v = v_m sin ωt; rms values I_rms = I_m/√2, V_rms = V_m/√2. Resistor: V and I in phase. Inductor: current lags
    by π/2; inductive reactance X_L = ωL. Capacitor: current leads by π/2; capacitive reactance X_C = 1/(ωC). Series LCR:
    impedance Z = √(R² + (X_L − X_C)²); phase angle tan φ = (X_L − X_C)/R. Resonance when X_L = X_C: ω₀ = 1/√(LC), Z = R,
    current maximum; quality factor. Phasors.
  explanations:
    text: Alternating current keeps reversing direction. Its effective value (rms) is the peak divided by √2. Inductors and capacitors oppose AC in a way that depends on frequency (reactance), and in an LCR circuit the current is biggest at the resonant frequency.
    visual: 'Picture a radio tuner: turning the knob changes the capacitance until the circuit resonates with one station''s frequency, and that station comes through loudly.'
    step_by_step: 'Step 1: Find X_L = ωL and X_C = 1/(ωC). Step 2: Z = √(R² + (X_L − X_C)²). Step 3: I = V/Z. Step 4: Resonance when X_L = X_C.'
    real_world: Indian household supply is 230 V rms at 50 Hz.
  picture:
    kind: compare
    columns:
    - title: Component
      points:
      - resistor
      - inductor
      - capacitor
    - title: Opposition
      points:
      - R
      - X_L = ωL
      - X_C = 1/(ωC)
    - title: Current vs voltage
      points:
      - in phase
      - lags by 90°
      - leads by 90°
    alt: How a resistor, inductor and capacitor behave in an AC circuit.
  activity:
    type: formula
    prompt: In an AC circuit, X_L = 2πfL grows with frequency and X_C = 1 ÷ (2πfC) shrinks with it. They match at resonance.
    inputs:
    - name: f
      label: Frequency f
      min: 10
      max: 1000
      step: 10
      start: 1000
      unit: Hz
    - name: l
      label: Inductance L
      min: 10
      max: 500
      step: 10
      start: 10
      unit: mH
    - name: c
      label: Capacitance C
      min: 1
      max: 50
      step: 1
      start: 1
      unit: μF
    outputs:
    - name: xl
      label: X_L
      expr: 2*pi*f*l/1000
      unit: Ω
      places: 1
    - name: xc
      label: X_C
      expr: 1000000/(2*pi*f*c)
      unit: Ω
      places: 1
    - name: dx
      label: X_L − X_C
      expr: 2*pi*f*l/1000-1000000/(2*pi*f*c)
      unit: Ω
      places: 1
    goals:
    - prompt: With L = 100 mH and C = 10 μF, find the frequency closest to resonance.
      want:
        l: 100
        c: 10
        dx:
        - -2
        - 2
      mistakes:
      - when:
          l: 100
          c: 10
          f:
          - 10
          - 150
        say: 'X_C is still bigger: at low frequency the capacitor blocks more. Go higher.'
      - when:
          l: 100
          c: 10
          f:
          - 170
          - 1000
        say: 'X_L now wins: too high.'
    - prompt: At 50 Hz, choose L so X_L = 31.4 Ω.
      want:
        f: 50
        xl:
        - 31.3
        - 31.5
      mistakes:
      - when:
          f: 50
          xl:
          - 0.1
          - 31.2
        say: Too small. X_L = 2πfL, so L = 31.4 ÷ (2π × 50).
      - when:
          f: 50
          xl:
          - 31.6
          - 160
        say: Too big. X_L = 2πfL.
    - prompt: At 50 Hz, choose C so X_C = 318 Ω (about).
      want:
        f: 50
        xc:
        - 315
        - 321
      mistakes:
      - when:
          f: 50
          c:
          - 11
          - 50
        say: 'A bigger capacitor lets AC through more easily: X_C is smaller. Choose a smaller C.'
      - when:
          f: 50
          c:
          - 1
          - 9
        say: 'A smaller capacitor blocks more: X_C is too big.'
  lesson:
    - teach: 'AC voltage varies as v = v_m sin ωt. Because it keeps changing sign, we use rms values: V_rms = V_m/√2, I_rms = I_m/√2. Household 220 V is an rms value, so its peak is about 311 V.'
      check:
        prompt: Peak current 10√2 A. rms current?
        options:
        - 10 A
        - 20 A
        - 10√2 A
        answer: 10 A
        why: I_rms = I_m/√2.
    - teach: 'In a resistor V and I are in phase. In an inductor I lags V by 90°, with reactance X_L = ωL. In a capacitor I leads V by 90°, with reactance X_C = 1/(ωC). Series LCR: Z = √(R² + (X_L − X_C)²), tan φ = (X_L − X_C)/R.'
      picture:
        kind: compare
        columns:
        - title: Element
          points:
          - R
          - L
          - C
        - title: Opposition
          points:
          - R
          - X_L = ωL
          - X_C = 1/(ωC)
        - title: Current vs V
          points:
          - in phase
          - lags 90°
          - leads 90°
        alt: 'Resistor, inductor and capacitor in AC: opposition and phase.'
      check:
        prompt: 'Raising the frequency makes X_C:'
        options:
        - smaller
        - larger
        - unchanged
        answer: smaller
        why: X_C = 1/(ωC) falls as ω rises.
    - teach: 'Resonance: when X_L = X_C, they cancel, so Z = R and the current is largest. This happens at ω₀ = 1/√(LC). Radios tune stations this way.'
      check:
        prompt: L = 1 H, C = 1 μF. ω₀?
        options:
        - 1000 rad/s
        - 1 rad/s
        - 10⁶ rad/s
        answer: 1000 rad/s
        why: 1/√(10⁻⁶) = 1000.
  items:
  - prompt: The peak voltage is 200√2 V. Find the rms voltage (V).
    answer: '200'
    check: '200'
    difficulty: 1
    hints:
    - V_rms = V_m/√2.
    - 200√2/√2.
    solution: 200 V.
    mistakes:
      '400': c12p_rms
  - prompt: Find X_L (Ω) for L = 0.1 H at ω = 100 rad/s.
    answer: '10'
    check: 100*Rational(1,10)
    difficulty: 1
    hints:
    - ωL.
    - 100 × 0.1.
    solution: 10 Ω.
    mistakes: {"1000": "p12_xl", "0.001": "p12_xl"}
  - prompt: Find X_C (Ω) for C = 100 μF at ω = 100 rad/s.
    answer: '100'
    check: 1/(100*100*10**-6)
    difficulty: 2
    hints:
    - 1/(ωC).
    - 1/(10⁻²).
    solution: 100 Ω.
    mistakes: {"0.01": "p12_xc", "10000": "p12_xc"}
  - prompt: A series circuit has R = 3 Ω and X_L − X_C = 4 Ω. Find Z (Ω).
    answer: '5'
    check: sqrt(3**2+4**2)
    difficulty: 2
    hints:
    - √(9 + 16).
    - '5.'
    solution: 5 Ω.
    mistakes: {"7": "p12_impedance", "25": "p12_impedance"}
  - prompt: 'At resonance in a series LCR circuit, the impedance equals:'
    options:
    - R
    - zero
    - X_L + X_C
    - infinity
    answer: R
    difficulty: 2
    hints:
    - X_L = X_C cancel.
    - Only R left.
    solution: R.
    mistakes: {"zero": "p12_resonance", "X_L + X_C": "p12_resonance", "infinity": "p12_resonance"}
  - prompt: 'In a pure inductor, the current:'
    options:
    - lags the voltage by 90°
    - leads the voltage by 90°
    - is in phase
    - is zero
    answer: lags the voltage by 90°
    difficulty: 2
    hints:
    - Opposes change.
    - Lags.
    solution: Lags the voltage by 90°.
    mistakes: {"leads the voltage by 90°": "p12_inductor_phase", "is in phase": "p12_inductor_phase", "is zero": "p12_inductor_phase"}
  - prompt: Peak voltage 100√2 V. Find V_rms (V).
    answer: '100'
    check: 100*sqrt(2)/sqrt(2)
    difficulty: 1
    hints:
    - Divide the peak by √2.
    - The √2 cancels.
    solution: 'Step 1: 100√2/√2. Step 2: 100 V.'
    mistakes:
      '200': c12p7_rms
      '141': c12p7_rms
  - prompt: Find X_L (Ω) for L = 0.5 H at ω = 200 rad/s.
    answer: '100'
    check: Rational(1,2)*200
    difficulty: 1
    hints:
    - X_L = ωL.
    - 200 × 0.5.
    solution: 'Step 1: 200 × 0.5. Step 2: 100 Ω.'
    mistakes:
      '400': c12p7_react
      1/100: c12p7_react
  - prompt: Find X_C (Ω) for C = 10 μF at ω = 1000 rad/s.
    answer: '100'
    check: 1/(1000*10*10**-6)
    difficulty: 1
    hints:
    - X_C = 1/(ωC).
    - 1/(1000 × 10⁻⁵).
    solution: 'Step 1: 1/0.01. Step 2: 100 Ω.'
    mistakes:
      1/100: c12p7_react
      '10': c12p7_react
  - prompt: 'Series circuit: R = 6 Ω, X_L = 10 Ω, X_C = 2 Ω. Find Z (Ω).'
    answer: '10'
    check: sqrt(6**2 + (10 - 2)**2)
    difficulty: 2
    hints:
    - X_L − X_C = 8.
    - √(36 + 64).
    solution: 'Step 1: √100. Step 2: 10 Ω.'
    mistakes:
      '18': c12p7_react
      '14': c12p7_react
  - prompt: Same circuit with 50 V rms supply. Find I_rms (A).
    answer: '5'
    check: 50/10
    difficulty: 2
    hints:
    - I = V/Z.
    - Z = 10 Ω.
    solution: 'Step 1: 50/10. Step 2: 5 A.'
    mistakes:
      25/9: c12p7_react
      50/6: c12p7_react
  - prompt: L = 0.1 H and C = 10 μF. Find the resonant ω (rad/s).
    answer: '1000'
    check: 1/sqrt(Rational(1,10)*10*10**-6)
    difficulty: 2
    hints:
    - ω₀ = 1/√(LC).
    - LC = 10⁻⁶.
    solution: 'Step 1: √(10⁻⁶) = 10⁻³. Step 2: 1000 rad/s.'
    mistakes:
      '100': c12p7_react
      '10000': c12p7_react
  - prompt: 'In a pure capacitor, the current:'
    options:
    - leads the voltage by 90°
    - lags the voltage by 90°
    - is in phase
    answer: leads the voltage by 90°
    difficulty: 2
    hints:
    - Charge must flow before the voltage builds.
    - Opposite of the inductor.
    solution: 'Step 1: i = C dv/dt peaks when v crosses zero. Step 2: leads by 90°.'
    mistakes:
      lags the voltage by 90°: c12p7_react
      is in phase: c12p7_react
  - prompt: R = 4 Ω, X_L = 7 Ω, X_C = 3 Ω. Find the phase angle φ (degrees).
    answer: '45'
    check: '45'
    difficulty: 3
    hints:
    - tan φ = (X_L − X_C)/R.
    - 4/4.
    solution: 'Step 1: tan φ = 1. Step 2: φ = 45°.'
    mistakes:
      '60': c12p7_react
      '30': c12p7_react
  - prompt: 'At resonance, a series LCR circuit with R = 20 Ω on 220 V rms draws I_rms (A) of:'
    answer: '11'
    check: 220/20
    difficulty: 3
    hints:
    - At resonance Z = R.
    - 220/20.
    solution: 'Step 1: Z = 20 Ω. Step 2: 11 A.'
    mistakes:
      '0': c12p7_react
      '22': c12p7_react
- code: cbse12p.ac.power
  title: Power in AC and transformers
  after:
  - cbse12p.ac.circuits
  notes: |
    Average power P = V_rms I_rms cos φ; power factor cos φ (1 for pure R, 0 for pure L or C: wattless current). LC oscillations
    ω = 1/√(LC). Transformer: Vs/Vp = Ns/Np = Ip/Is (ideal); step-up and step-down; losses: copper (I²R), eddy currents,
    hysteresis, flux leakage. Power transmission at high voltage to reduce I²R loss.
  explanations:
    text: 'In AC circuits, the real power used depends on the power factor, cos φ: a pure resistor uses all of it, while a pure inductor or capacitor uses none on average. Transformers change AC voltage using the ratio of turns in two coils.'
    visual: 'Draw a transformer: two coils on an iron ring. If the second coil has 10 times as many turns, the voltage is 10 times higher, but the current is 10 times smaller.'
    step_by_step: 'Step 1: P = V_rms I_rms cos φ. Step 2: For a transformer, Vs/Vp = Ns/Np. Step 3: In an ideal transformer, VpIp = VsIs.'
    real_world: Electricity is sent across the country at very high voltages (like 400 kV) so the current, and the heating loss, is small.
  picture:
    kind: flow
    steps:
    - Power station
    - Step-up transformer (high V, low I)
    - Long transmission lines
    - Step-down transformer
    - Homes at 230 V
    alt: 'Power transmission: stepping voltage up for the long lines, then down for homes.'
  activity:
    type: formula
    prompt: 'An ideal transformer on 220 V mains: Vs ÷ Vp = Ns ÷ Np, and the power in equals the power out.'
    inputs:
    - name: np
      label: Primary turns Np
      min: 100
      max: 1000
      step: 100
      start: 100
    - name: ns
      label: Secondary turns Ns
      min: 10
      max: 2000
      step: 10
      start: 10
    - name: is
      label: Secondary current
      min: 1
      max: 20
      step: 1
      start: 1
      unit: A
    outputs:
    - name: vs
      label: Secondary voltage
      expr: 220*ns/np
      unit: V
      places: 1
    - name: ip
      label: Primary current
      expr: (220*ns/np)*is/220
      unit: A
      places: 2
    goals:
    - prompt: Step 220 V down to 11 V with 1000 primary turns.
      want:
        np: 1000
        vs: 11
      mistakes:
      - when:
          np: 1000
          ns:
          - 60
          - 2000
        say: 'More secondary turns give more volts. Stepping DOWN needs fewer turns: Ns = 1000 × 11 ÷ 220.'
    - prompt: Step up to 440 V using 500 primary turns.
      want:
        np: 500
        vs: 440
      mistakes:
      - when:
          np: 500
          ns: 250
        say: 'Fewer secondary turns step DOWN: 110 V. Twice the voltage needs twice the turns.'
    - prompt: 'The 1000 : 50 transformer delivers 10 A at 11 V. Read the primary current.'
      want:
        np: 1000
        ns: 50
        is: 10
      mistakes:
      - when:
          np: 1000
          ns: 50
          is:
          - 1
          - 9
        say: The secondary delivers 10 A.
  lesson:
    - teach: 'Average AC power is P = V_rms I_rms cos φ, where cos φ is the power factor. For a pure resistor cos φ = 1. For a pure inductor or capacitor cos φ = 0: current flows but no average power is used (wattless current).'
      check:
        prompt: V_rms = 100 V, I_rms = 2 A, cos φ = 0.5. P?
        options:
        - 100 W
        - 200 W
        - 50 W
        answer: 100 W
        why: 100 × 2 × 0.5.
    - teach: 'A transformer changes AC voltage using mutual induction. Ideal: Vs/Vp = Ns/Np = Ip/Is. Step-up (Ns > Np) raises voltage and lowers current; step-down does the opposite. Losses: copper (I²R), eddy currents, hysteresis, flux leakage.'
      picture:
        kind: flow
        steps:
        - AC in primary
        - Changing flux in core
        - EMF in secondary
        - Vs = Vp × Ns/Np
        alt: How a transformer passes energy from primary to secondary.
      check:
        prompt: Np = 200, Ns = 50, Vp = 240 V. Vs?
        options:
        - 60 V
        - 960 V
        - 240 V
        answer: 60 V
        why: 240 × 50/200.
    - teach: Power is sent over long lines at very high voltage. For the same power P = VI, higher V means lower I, and line loss I²R falls sharply. Step-down transformers bring it back to 220 V near homes. An LC circuit oscillates at ω = 1/√(LC), swapping energy between C and L.
      check:
        prompt: 'Doubling transmission voltage (same power) makes I²R loss:'
        options:
        - a quarter
        - half
        - double
        answer: a quarter
        why: I halves, so I² is a quarter.
  items:
  - prompt: A transformer has 100 primary and 500 secondary turns, with 220 V in. Find the output voltage (V).
    answer: '1100'
    check: 220*500/100
    difficulty: 1
    hints:
    - Vs = Vp × Ns/Np.
    - 220 × 5.
    solution: 1,100 V.
    mistakes: {"44": "p12_transformer", "500": "p12_transformer"}
  - prompt: A step-down transformer changes 220 V to 11 V. Find Np/Ns.
    answer: '20'
    check: 220/11
    difficulty: 1
    hints:
    - Ratio of voltages.
    - 220/11.
    solution: '20.'
    mistakes: {"1/20": "p12_transformer", "11": "p12_transformer"}
  - prompt: V_rms = 200 V, I_rms = 5 A, cos φ = 0.8. Find the average power (W).
    answer: '800'
    check: 200*5*Rational(8,10)
    difficulty: 1
    hints:
    - P = VI cos φ.
    - 200 × 5 × 0.8.
    solution: 800 W.
    mistakes: {"1000": "p12_ac_power", "640": "p12_ac_power"}
  - prompt: An ideal transformer has 220 V, 2 A in and 44 V out. Find the output current (A).
    answer: '10'
    check: 220*2/44
    difficulty: 2
    hints:
    - VpIp = VsIs.
    - 440/44.
    solution: 10 A.
    mistakes:
      '0.4': c12p_transformer
  - prompt: 'The power factor of a pure inductor is:'
    options:
    - '0'
    - '1'
    - '0.5'
    - infinite
    answer: '0'
    difficulty: 2
    hints:
    - φ = 90°.
    - cos 90°.
    solution: '0.'
    mistakes: {"1": "p12_power_factor", "0.5": "p12_power_factor", "infinite": "p12_power_factor"}
  - prompt: 'Power is transmitted at high voltage to:'
    options:
    - reduce I²R losses
    - increase the current
    - make it safer at home
    - increase resistance
    answer: reduce I²R losses
    difficulty: 2
    hints:
    - Same power, less current.
    - Heat loss ∝ I².
    solution: To reduce I²R heating losses.
    mistakes: {"increase the current": "p12_transmission", "make it safer at home": "p12_transmission", "increase resistance": "p12_transmission"}
  - prompt: 'Transformer: 50 primary turns, 1000 secondary, 12 V in. Output voltage (V)?'
    answer: '240'
    check: 12*1000/50
    difficulty: 1
    hints:
    - Vs = Vp × Ns/Np.
    - 12 × 20.
    solution: 'Step 1: ratio 20. Step 2: 240 V.'
    mistakes:
      3/5: c12p7_trans
      '600': c12p7_trans
  - prompt: A transformer turns 240 V into 12 V. Find Np/Ns.
    answer: '20'
    check: 240/12
    difficulty: 1
    hints:
    - Vp/Vs = Np/Ns.
    - 240/12.
    solution: 'Step 1: 240/12. Step 2: 20.'
    mistakes:
      1/20: c12p7_trans
      '12': c12p7_trans
  - prompt: V_rms = 220 V, I_rms = 10 A, cos φ = 1. Average power (W)?
    answer: '2200'
    check: 220*10
    difficulty: 1
    hints:
    - P = V I cos φ.
    - cos φ = 1.
    solution: 'Step 1: 220 × 10. Step 2: 2200 W.'
    mistakes:
      '0': c12p7_power
      '230': c12p7_power
  - prompt: 'Ideal transformer: 220 V, 5 A in; 1100 V out. Output current (A)?'
    answer: '1'
    check: 220*5/1100
    difficulty: 2
    hints:
    - Power in = power out.
    - 220 × 5 = 1100 × Is.
    solution: 'Step 1: 1100 W. Step 2: Is = 1 A.'
    mistakes:
      '25': c12p7_trans
      '5': c12p7_trans
  - prompt: 'The power factor of a pure resistor is:'
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - V and I are in phase.
    - cos 0°.
    solution: 'Step 1: φ = 0. Step 2: cos φ = 1.'
    mistakes:
      '0': c12p7_power
      '-1': c12p7_power
  - prompt: R = 3 Ω, Z = 5 Ω. Find the power factor as a fraction.
    answer: 3/5
    check: Rational(3,5)
    difficulty: 2
    hints:
    - cos φ = R/Z.
    - 3/5.
    solution: 'Step 1: R/Z. Step 2: 3/5.'
    mistakes:
      4/5: c12p7_power
      5/3: c12p7_power
  - prompt: A line of resistance 10 Ω carries 100 A. Power lost (kW)?
    answer: '100'
    check: 100**2*10/1000
    difficulty: 2
    hints:
    - P = I²R.
    - 10⁴ × 10 W.
    solution: 'Step 1: 10⁵ W. Step 2: 100 kW.'
    mistakes:
      '1': c12p7_power
      '1000': c12p7_power
  - prompt: Same power sent at 10 times the voltage. The loss becomes how many times smaller?
    answer: '100'
    check: 10**2
    difficulty: 3
    hints:
    - Current falls by 10.
    - Loss ∝ I².
    solution: 'Step 1: I → I/10. Step 2: I² → I²/100.'
    mistakes:
      '10': c12p7_power
      '1000': c12p7_power
  - prompt: An LC circuit has L = 0.01 H and C = 1 μF. Find its angular frequency ω (rad/s).
    answer: '10000'
    check: 1/sqrt(Rational(1,100)*10**-6)
    difficulty: 3
    hints:
    - ω = 1/√(LC).
    - LC = 10⁻⁸.
    solution: 'Step 1: √(10⁻⁸) = 10⁻⁴. Step 2: 10⁴ rad/s.'
    mistakes:
      '1000': c12p7_react
      '100000': c12p7_react
