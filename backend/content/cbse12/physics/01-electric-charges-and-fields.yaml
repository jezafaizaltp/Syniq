# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse12-phy
chapter: 1
title: Electric Charges and Fields
tips:
  c12p_coulomb: 'Coulomb''s force F = kq₁q₂/r²: doubling the distance makes the force four times smaller.'
  c12p_flux: "Gauss's law: total flux = enclosed charge ÷ ε₀. A charge outside sends as many field lines in as out. Work out what's enclosed."
  p12_coulomb: "F = kq₁q₂/r². 1 μC = 10⁻⁶ C, and the two powers multiply."
  p12_field: "E = F/q. Convert μC to C first."
  p12_field_lines: "At any point the field has one direction. If two lines crossed, which way would it point?"
  p12_flux: "Flux = E A cos θ, and here θ = 0."
  p12_quantisation: "n = q/e. Divide the powers of ten carefully."
  p12_quantised: "Quantised means it comes in packets of a fixed smallest size."
  p12_sheet: "E = σ/2ε₀ for an infinite sheet. Is r in that formula?"
  p12_shell: "Gauss's law: a surface inside the shell encloses no charge."
  c12p1_inv: 'Coulomb''s law is an inverse-square law: F depends on 1/r², so doubling r divides F by 4.'
  c12p1_units: Convert μC to C (× 10⁻⁶) before using k = 9 × 10⁹, then match the units the question asks for.
  c12p1_gauss: 'Gauss''s law: flux depends only on the charge inside the closed surface, Φ = q_in/ε₀.'
  c12p1_dipole: For a dipole, p = q × (separation). Torque τ = pE sin θ is largest at 90° and zero when p is along E.
  pq12p1_induced: Neutral paper still has charges inside that can shift a little. Which kind of charge ends up on the side nearer the comb?
  pq12p1_one_face: That would be the flux through the whole closed box. How many identical faces share it equally?
  pq12p1_inside: Draw a closed surface just inside the metal shell. How much charge does that surface enclose?
concepts:
- code: cbse12p.charge.coulomb
  title: Charge and Coulomb's law
  notes: |
    Electric charge: two kinds; like charges repel. Charging by friction, conduction, induction. Properties: additive,
    conserved, quantised (q = ne, e = 1.6 × 10⁻¹⁹ C). Coulomb's law F = kq₁q₂/r², k = 1/(4πε₀) = 9 × 10⁹ N m² C⁻². Vector form;
    principle of superposition for many charges. Electric field E = F/q₀; field of a point charge kq/r²; field lines (start on
    +, end on −, never cross). Electric dipole: dipole moment p = q × 2a; field on axis 2kp/r³, on equatorial line kp/r³;
    torque in uniform field τ = pE sin θ.
  explanations:
    text: 'Charges come in two kinds: like charges repel, unlike attract. Coulomb''s law says the force grows with the charges and falls with the square of the distance. An electric field describes the force a charge would feel at each point.'
    visual: Draw field lines from a positive charge pointing outward like spokes, and into a negative charge. Lines close together mean a strong field.
    step_by_step: 'Step 1: Write F = kq₁q₂/r². Step 2: Put charges in coulombs and distance in metres. Step 3: For many charges, add forces as vectors. Step 4: E = F/q.'
    real_world: Photocopiers use electric charges to make toner powder stick to paper in the right pattern.
  picture:
    kind: flow
    steps:
    - Charges q₁ and q₂
    - Distance r apart
    - F = kq₁q₂/r²
    - Like charges repel, unlike attract
    alt: 'Coulomb''s law: the force between two charges depends on their sizes and the square of their distance.'
  activity:
    type: formula
    prompt: Two point charges r apart. F = kq₁q₂ ÷ r². A positive F repels; a negative F attracts.
    inputs:
    - name: q1
      label: q₁
      min: -5
      max: 5
      step: 1
      start: 1
      unit: μC
    - name: q2
      label: q₂
      min: -5
      max: 5
      step: 1
      start: 1
      unit: μC
    - name: r
      label: Distance r
      min: 1
      max: 40
      step: 1
      start: 40
      unit: cm
    outputs:
    - name: f
      label: Force (+ repel, − attract)
      expr: 90*q1*q2/r^2
      unit: N
      places: 2
    goals:
    - prompt: Two 2 μC charges 10 cm apart push with 3.6 N. Keep the charges and make the force 0.9 N.
      want:
        q1: 2
        q2: 2
        f: 0.9
      mistakes:
      - when:
          q1: 2
          q2: 2
          r: 40
        say: '4 times as far gives 1/16 of the force. F ∝ 1/r²: a quarter of the force needs twice the distance.'
      - when:
          q1: 2
          q2: 2
          r:
          - 11
          - 19
        say: Not far enough yet. A quarter of the force needs twice the distance.
    - prompt: Make the charges ATTRACT with 9 N at 10 cm.
      want:
        r: 10
        f: -9
      mistakes:
      - when:
          r: 10
          f: 9
        say: '+9 N is repulsion: like charges. Attraction needs one positive and one negative.'
    - prompt: Keep r = 10 cm. Make the force zero without moving the charges.
      want:
        r: 10
        f: 0
      mistakes:
      - when:
          r: 10
          f:
          - -30
          - -0.1
        say: 'Still a pull. With any charge on both, there''s a force: one charge must be 0.'
      - when:
          r: 10
          f:
          - 0.1
          - 30
        say: Still a push. One of the charges must be 0.
  lesson:
    - teach: 'Charge comes in two kinds; like charges repel and unlike attract. It is conserved (never created or destroyed overall), additive, and quantised: any charge is a whole number of electron charges, q = ne, e = 1.6 × 10⁻¹⁹ C.'
      check:
        prompt: Which charge is impossible on an object?
        options:
        - 0.8 × 10⁻¹⁹ C
        - 3.2 × 10⁻¹⁹ C
        - 1.6 × 10⁻¹⁸ C
        answer: 0.8 × 10⁻¹⁹ C
        why: It is half of e, not a whole multiple.
      ways:
      - style: visual
        teach: The three basic properties of electric charge, side by side.
        picture:
          kind: compare
          columns:
          - title: Conserved
            points:
            - Total charge never changes
            - Rubbing only moves electrons
          - title: Additive
            points:
            - Add charges with their signs
            - +3 μC and −1 μC make +2 μC
          - title: Quantised
            points:
            - q = ne, n a whole number
            - e = 1.6 × 10⁻¹⁹ C
          alt: 'Charge is conserved: the total never changes, rubbing only moves electrons. It is additive: add with signs, so plus 3 and minus 1 microcoulomb make plus 2. It is quantised: q equals n times e, with e equal to 1.6 times 10 to the minus 19 coulomb.'
      - style: real_world
        teach: 'Rub a balloon on dry hair: electrons move from the hair to the balloon. The balloon becomes negative and the hair equally positive, so the total is still zero. Charge was moved, not made.'
    - teach: 'Coulomb''s law: F = kq₁q₂/r², with k = 9 × 10⁹ N m² C⁻². Force is along the line joining the charges. With several charges, add the force vectors from each one (superposition).'
      picture:
        kind: bars
        bars:
        - label: r
          value: 16
        - label: 2r
          value: 4
        - label: 4r
          value: 1
        alt: 'Force between two charges at distances r, 2r and 4r: it falls to a quarter each time the distance doubles.'
      check:
        prompt: 'The distance between two charges is halved. The force becomes:'
        options:
        - 4 times larger
        - 2 times larger
        - half
        answer: 4 times larger
        why: 'F ∝ 1/r²: (1/2)² in the bottom gives × 4.'
      ways:
      - style: step_by_step
        teach: 'Two forces act on a charge: 3 N east from one charge and 4 N north from another. Step 1: Superposition says add them as vectors. Step 2: They are at right angles. Step 3: Size = √(3² + 4²) = 5 N. Step 4: Direction: between east and north, nearer north.'
      - style: real_world
        teach: Car factories spray paint as charged droplets onto an oppositely charged car body. Coulomb attraction pulls the paint onto every surface, even round corners, wasting less paint than ordinary spraying.
    - teach: Electric field E = F/q₀ is force per unit positive test charge; for a point charge E = kq/r². Field lines start on + and end on −, never cross. A dipole (charges ±q a distance 2a apart) has moment p = q × 2a; in a uniform field it feels torque τ = pE sin θ.
      check:
        prompt: When is the torque on a dipole in a uniform field zero?
        options:
        - when p is along E
        - when p is at 90° to E
        - never
        answer: when p is along E
        why: sin 0° = 0.
      ways:
      - style: visual
        teach: An electric dipole and the torque it feels in a uniform field.
        picture:
          kind: flow
          steps:
          - Charges +q and −q, 2a apart
          - Dipole moment p = q × 2a, from − to +
          - 'In field E at angle θ: τ = pE sin θ'
          - Largest at 90°, zero when p lines up with E
          alt: A dipole is charges plus q and minus q a distance 2a apart. Its moment p equals q times 2a, pointing from minus to plus. In a field E at angle theta it feels torque p E sin theta, largest at 90 degrees and zero when p lines up with E.
      - style: step_by_step
        teach: 'Field 2 m from a 4 μC charge. Step 1: Convert: q = 4 × 10⁻⁶ C. Step 2: E = kq/r² = 9 × 10⁹ × 4 × 10⁻⁶ / 2². Step 3: = 36 × 10³ / 4. Step 4: E = 9 × 10³ N/C, pointing away from the charge.'
  items:
  - prompt: How many electrons make a charge of 1.6 × 10⁻¹⁸ C? (e = 1.6 × 10⁻¹⁹ C)
    answer: '10'
    check: Rational(16,10)*10**-18/(Rational(16,10)*10**-19)
    difficulty: 1
    hints:
    - n = q/e.
    - 10⁻¹⁸/10⁻¹⁹.
    solution: "n = q/e = (1.6 × 10⁻¹⁸)/(1.6 × 10⁻¹⁹) = 10 electrons."
    mistakes: {"1": "p12_quantisation", "100": "p12_quantisation"}
  - prompt: Two charges of 1 μC each are 1 m apart. Find the force in units of 10⁻³ N (k = 9 × 10⁹).
    answer: '9'
    check: 9*10**9*10**-6*10**-6/10**-3
    difficulty: 1
    hints:
    - k × 10⁻⁶ × 10⁻⁶ / 1.
    - 9 × 10⁻³ N.
    solution: "F = kq₁q₂/r² = 9 × 10⁹ × 10⁻⁶ × 10⁻⁶ / 1² = 9 × 10⁻³ N."
    mistakes: {"9000": "p12_coulomb", "0.009": "p12_coulomb"}
  - prompt: The distance between two charges is doubled. By what factor does the force become smaller?
    answer: '4'
    check: 2**2
    difficulty: 1
    hints:
    - Inverse square.
    - 2².
    solution: "F ∝ 1/r². Doubling r gives 1/2² = 1/4, so the force is 4 times smaller."
    mistakes:
      '2': c12p_coulomb
  - prompt: A 2 μC charge feels a force of 4 N. Find the field in units of 10⁶ N/C.
    answer: '2'
    check: 4/(2*10**-6)/10**6
    difficulty: 2
    hints:
    - E = F/q.
    - 4 ÷ 2 × 10⁻⁶.
    solution: "E = F/q = 4 / (2 × 10⁻⁶) = 2 × 10⁶ N/C."
    mistakes: {"8": "p12_field", "0.5": "p12_field"}
  - prompt: 'Electric field lines:'
    options:
    - never cross each other
    - form closed loops around charges
    - start on negative charges
    - are always straight
    answer: never cross each other
    difficulty: 1
    hints:
    - One direction at each point.
    - Unique.
    solution: "If two lines crossed, the field would point two ways at one point, which is impossible. So field lines never cross."
    mistakes: {"form closed loops around charges": "p12_field_lines", "start on negative charges": "p12_field_lines", "are always straight": "p12_field_lines"}
  - prompt: 'Charge is quantised, meaning:'
    options:
    - "it comes in whole multiples of e"
    - "it is always positive, never negative"
    - "it can't be transferred between bodies"
    - "it can take any value, however small"
    answer: it comes in whole multiples of e
    difficulty: 2
    hints:
    - q = ne.
    - Smallest unit.
    solution: It exists only as whole multiples of e.
    mistakes: {"it is always positive, never negative": "p12_quantised", "it can't be transferred between bodies": "p12_quantised", "it can take any value, however small": "p12_quantised"}
  - prompt: How many electrons make a charge of 3.2 × 10⁻¹⁸ C? (e = 1.6 × 10⁻¹⁹ C)
    answer: '20'
    check: 32/Rational(16,10)
    difficulty: 1
    hints:
    - n = q/e.
    - Compare 3.2 × 10⁻¹⁸ with 1.6 × 10⁻¹⁹.
    solution: 'Step 1: 3.2 × 10⁻¹⁸ / 1.6 × 10⁻¹⁹. Step 2: 2 × 10 = 20.'
    mistakes:
      '2': c12p1_units
      '200': c12p1_units
  - prompt: Two 2 μC charges are 1 m apart. Find the force in units of 10⁻³ N (k = 9 × 10⁹).
    answer: '36'
    check: 9*2*2
    difficulty: 1
    hints:
    - F = kq₁q₂/r².
    - 2 × 10⁻⁶ × 2 × 10⁻⁶ = 4 × 10⁻¹².
    solution: 'Step 1: 9 × 10⁹ × 4 × 10⁻¹² = 36 × 10⁻³ N. Step 2: 36.'
    mistakes:
      '18': c12p1_units
      '9': c12p1_units
  - prompt: The distance between two charges is tripled. By what factor does the force become smaller?
    answer: '9'
    check: 3**2
    difficulty: 1
    hints:
    - Force depends on 1/r².
    - Square the factor.
    solution: 'Step 1: r → 3r. Step 2: F → F/9.'
    mistakes:
      '3': c12p1_inv
      '6': c12p1_inv
  - prompt: Find the field (in units of 10³ N/C) 3 m from a 1 μC charge (k = 9 × 10⁹).
    answer: '1'
    check: 9*1/9
    difficulty: 2
    hints:
    - E = kq/r².
    - 9 × 10⁹ × 10⁻⁶ / 9.
    solution: 'Step 1: 9 × 10³ / 9. Step 2: 1 × 10³ N/C.'
    mistakes:
      '3': c12p1_inv
      '9': c12p1_inv
  - prompt: A dipole has charges ±3 μC, 2 mm apart. Find p in units of 10⁻⁹ C m.
    answer: '6'
    check: 3*2
    difficulty: 2
    hints:
    - p = q × separation.
    - 3 × 10⁻⁶ × 2 × 10⁻³.
    solution: 'Step 1: 6 × 10⁻⁹ C m. Step 2: 6.'
    mistakes:
      '3': c12p1_dipole
      '12': c12p1_dipole
  - prompt: A dipole with p = 2 × 10⁻⁸ C m sits at 30° to a field of 10⁴ N/C. Find the torque in units of 10⁻⁴ N m.
    answer: '1'
    check: 2*Rational(1,2)
    difficulty: 2
    hints:
    - τ = pE sin θ.
    - sin 30° = 1/2.
    solution: 'Step 1: 2 × 10⁻⁸ × 10⁴ × 1/2 = 10⁻⁴. Step 2: 1.'
    mistakes:
      '2': c12p1_dipole
      '0': c12p1_dipole
  - prompt: 'Charging a body by touching it with a charged body is called:'
    options:
    - conduction
    - induction
    - friction
    answer: conduction
    difficulty: 1
    hints:
    - Contact is involved.
    - Charge flows across.
    solution: 'Step 1: touching transfers charge. Step 2: conduction.'
    mistakes:
      induction: c12p1_units
      friction: c12p1_units
  - prompt: Field on the axis of a dipole at distance r is 2kp/r³. On the equatorial line at the same r, it is how many times smaller?
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - Equatorial field is kp/r³.
    - Divide the two.
    solution: 'Step 1: (2kp/r³)/(kp/r³). Step 2: 2.'
    mistakes:
      '4': c12p1_dipole
      '1': c12p1_dipole
  - prompt: +4 μC and +1 μC are 3 m apart. How far (m) from the 4 μC charge, between them, is the field zero?
    answer: '2'
    check: 3*2/(2 + 1)
    difficulty: 3
    hints:
    - Set k(4)/x² = k(1)/(3 − x)².
    - 'Take square roots: 2/x = 1/(3 − x).'
    solution: 'Step 1: 2(3 − x) = x. Step 2: x = 2 m.'
    mistakes:
      '1': c12p1_inv
      3/2: c12p1_inv
  - prompt: 'Assertion (A): A charge of 2.4 × 10⁻¹⁹ C cannot exist on an isolated body.

      Reason (R): Charge is quantised in whole multiples of e = 1.6 × 10⁻¹⁹ C.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 2.4 × 10⁻¹⁹ ÷ 1.6 × 10⁻¹⁹ = 1.5, not a whole number. Because charge is quantised (R), such a charge is impossible. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Two small charged spheres in a lab push each other with 0.8 N. The distance between them is halved and one charge is doubled. What is the new force?'
    options:
    - 6.4 N
    - 1.6 N
    - 3.2 N
    answer: 6.4 N
    hints:
    - Halving r multiplies F by 4.
    - Doubling one charge multiplies F by 2.
    solution: F ∝ q₁q₂/r². The new force is 0.8 × 2 × 4 = 6.4 N.
    mistakes:
      1.6 N: c12p1_inv
      3.2 N: c12p1_inv
    exam: case
    difficulty: 2
  - prompt: A plastic comb rubbed on dry hair picks up small bits of neutral paper. Which explanation is best?
    options:
    - "The charged comb polarises the paper and attracts the opposite charge on its near side"
    - "Rubbing magnetises the comb, and the magnet then attracts the bits of paper"
    - "The paper already carries a large charge of its own before the comb comes near"
    answer: The charged comb polarises the paper and attracts the opposite charge on its near side
    hints:
    - The paper starts neutral.
    - Attraction to the near side is stronger than repulsion from the far side. Why?
    solution: The comb's charge pulls opposite charge in the paper slightly towards it and pushes like charge away. The nearer opposite charge feels a stronger force, so the paper is attracted.
    mistakes:
      "Rubbing magnetises the comb, and the magnet then attracts the bits of paper": pq12p1_induced
      "The paper already carries a large charge of its own before the comb comes near": pq12p1_induced
    exam: competency
    difficulty: 2
- code: cbse12p.charge.gauss
  title: Electric flux and Gauss's law
  after:
  - cbse12p.charge.coulomb
  notes: |
    Electric flux Φ = E·ΔS = EΔS cos θ (N m² C⁻¹). Gauss's law: total flux through a closed surface = q_enclosed/ε₀,
    independent of the surface's shape. Applications: field of an infinitely long straight wire E = λ/(2πε₀r); infinite plane
    sheet E = σ/(2ε₀), independent of distance; thin spherical shell: outside kq/r², inside zero. Continuous charge
    distributions: linear λ, surface σ, volume ρ.
  explanations:
    text: Electric flux counts how many field lines pass through a surface. Gauss's law says the total flux out of any closed surface depends only on the charge inside it. This makes it easy to find fields for symmetric shapes like wires, sheets and spheres.
    visual: Imagine a balloon around a charge. However you squash the balloon, the same number of field lines poke out of it, because the same charge is inside.
    step_by_step: 'Step 1: Choose a Gaussian surface that matches the symmetry. Step 2: Find the flux in terms of E. Step 3: Set it equal to q_enclosed/ε₀. Step 4: Solve for E.'
    real_world: 'Charges on a car''s metal body stay on the outside, so the field inside is zero: that''s why sitting in a car protects you from lightning.'
  picture:
    kind: compare
    columns:
    - title: Charge shape
      points:
      - long wire
      - plane sheet
      - spherical shell (outside)
      - spherical shell (inside)
    - title: Field
      points:
      - λ/(2πε₀r)
      - σ/(2ε₀)
      - kq/r²
      - '0'
    alt: Fields from Gauss's law for a wire, a sheet and a spherical shell.
  activity:
    type: sort
    prompt: 'A charge of +2 μC sits inside a closed surface. Gauss: the total flux = q_enclosed ÷ ε₀. Which changes alter the total flux?'
    bins:
    - Changes the total flux
    - Leaves it the same
    items:
    - label: Double the charge inside
      bin: Changes the total flux
      clue: Does the enclosed charge change?
      why: Twice the enclosed charge, twice the flux.
    - label: Add −2 μC inside too
      bin: Changes the total flux
      clue: What is the net charge inside now?
      why: Net enclosed charge is 0, so the total flux becomes 0.
    - label: Move the charge outside the surface
      bin: Changes the total flux
      clue: Is it still enclosed?
      why: 'Nothing enclosed: zero total flux.'
    - label: Make the surface a bigger sphere
      bin: Leaves it the same
      clue: Same charge inside?
      why: 'Field weakens as 1/r² but the area grows as r²: the flux is unchanged.'
    - label: Change the sphere into a cube around the charge
      bin: Leaves it the same
      clue: Does Gauss's law care about the surface's shape?
      why: Only the enclosed charge matters.
    - label: Add a charge OUTSIDE the surface
      bin: Leaves it the same
      clue: Its field lines enter and leave. Net effect?
      why: 'Every line from an outside charge that goes in also comes out: net flux unchanged.'
    - label: Move the charge to another spot inside
      bin: Leaves it the same
      clue: Is it still enclosed?
      why: Still enclosed, so the same total flux.
  lesson:
    - teach: 'Electric flux through a small area: Φ = E ΔS cos θ, where θ is the angle between E and the area''s normal. It counts how much field passes through. Unit: N m² C⁻¹.'
      check:
        prompt: E is parallel to the surface (θ = 90° with the normal). Flux?
        options:
        - '0'
        - E ΔS
        - half of E ΔS
        answer: '0'
        why: 'cos 90° = 0: no field passes through.'
      ways:
      - style: visual
        teach: Flux through the same area at three different angles to the field.
        picture:
          kind: compare
          columns:
          - title: θ = 0°
            points:
            - Field straight through
            - Φ = EA, the largest
          - title: θ = 60°
            points:
            - Field slanted
            - Φ = EA cos 60° = EA/2
          - title: θ = 90°
            points:
            - Field skims along the surface
            - Φ = 0
          alt: When the field goes straight through, theta is 0 and the flux is E A, the largest. At 60 degrees the flux is half of that. At 90 degrees the field skims along the surface and the flux is zero.
      - style: real_world
        teach: Hold a window frame out in steady vertical rain. Held flat, it catches the most rain; tilted, less; held edge-on, none. Electric flux works the same way with field lines instead of raindrops, which is why cos θ appears.
    - teach: 'Gauss''s law: total flux through any closed surface = q_enclosed/ε₀. Shape and size don''t matter; charges outside add nothing to the total. Choose a symmetric ''Gaussian surface'' to find fields quickly.'
      picture:
        kind: flow
        steps:
        - Spot the symmetry
        - Pick a Gaussian surface
        - Flux = E × area
        - Set equal to q_in/ε₀
        - Solve for E
        alt: Steps for using Gauss's law to find a field.
      check:
        prompt: A closed surface encloses +q and −q. Total flux?
        options:
        - '0'
        - 2q/ε₀
        - q/ε₀
        answer: '0'
        why: Net enclosed charge is zero.
      ways:
      - style: step_by_step
        teach: 'A closed surface holds +5 μC and −2 μC; a 7 μC charge sits outside. Step 1: Only enclosed charge counts. Step 2: q_enclosed = 5 − 2 = 3 μC. Step 3: Φ = q_enclosed/ε₀. Step 4: Φ = 3 × 10⁻⁶/ε₀; the outside 7 μC adds nothing.'
      - style: real_world
        teach: Count people crossing a fence around a field. Anyone who walks in from outside and out again adds zero to the net count. Only people who start inside change it. Gauss's law treats field lines from outside charges the same way.
    - teach: 'Results: long straight wire E = λ/(2πε₀r); infinite plane sheet E = σ/(2ε₀), the same at any distance; thin spherical shell: E = kq/r² outside, zero inside.'
      check:
        prompt: 'For a long wire, doubling r makes E:'
        options:
        - half
        - a quarter
        - unchanged
        answer: half
        why: E ∝ 1/r for a line of charge.
      ways:
      - style: visual
        teach: How the field changes with distance for the three Gauss's-law results.
        picture:
          kind: compare
          columns:
          - title: Long wire
            points:
            - E = λ/(2πε₀r)
            - E ∝ 1/r
          - title: Infinite sheet
            points:
            - E = σ/(2ε₀)
            - Same at every distance
          - title: Thin shell
            points:
            - 'Outside: E = kq/r²'
            - 'Inside: E = 0'
          alt: A long wire gives E equal to lambda over 2 pi epsilon nought r, falling as 1 over r. An infinite sheet gives sigma over 2 epsilon nought, the same at every distance. A thin shell gives kq over r squared outside and zero inside.
      - style: step_by_step
        teach: 'A long charged wire gives 1200 N/C at 1 cm. Find E at 3 cm. Step 1: For a wire, E ∝ 1/r. Step 2: Distance grows 3 times. Step 3: So E falls to one third. Step 4: E = 1200 ÷ 3 = 400 N/C.'
  items:
  - prompt: A field of 100 N/C passes straight through an area of 0.5 m². Find the flux (N m²/C).
    answer: '50'
    check: 100*Rational(1,2)
    difficulty: 1
    hints:
    - Φ = EA cos 0.
    - 100 × 0.5.
    solution: "Φ = EA cos 0° = 100 × 0.5 × 1 = 50 N m²/C."
    mistakes: {"200": "p12_flux", "100": "p12_flux"}
  - prompt: The same field makes 60° with the normal. Find the flux (N m²/C).
    answer: '25'
    check: 100*Rational(1,2)*Rational(1,2)
    difficulty: 2
    hints:
    - cos 60° = 1/2.
    - 50 × 1/2.
    solution: "Φ = EA cos 60° = 100 × 0.5 × ½ = 25 N m²/C."
    mistakes: {"50": "p12_flux", "43.3": "p12_flux"}
  - prompt: A closed surface encloses no charge. What is the total flux through it?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - q_enclosed = 0.
    - In = out.
    solution: "Gauss's law: Φ = q_enclosed/ε₀. With no charge inside, Φ = 0: every line that enters also leaves."
    mistakes:
      '1': c12p_flux
  - prompt: 'Inside a uniformly charged thin spherical shell, the field is:'
    options:
    - zero
    - kq/r²
    - σ/ε₀
    - infinite
    answer: zero
    difficulty: 1
    hints:
    - No charge enclosed.
    - Gauss.
    solution: "A Gaussian sphere inside the shell encloses no charge, so by Gauss's law E = 0 everywhere inside."
    mistakes: {"kq/r²": "p12_shell", "σ/ε₀": "p12_shell", "infinite": "p12_shell"}
  - prompt: 'The field of an infinite plane sheet of charge:'
    options:
    - "does not depend on distance"
    - "falls as 1/r with distance"
    - "falls as 1/r² with distance"
    - "is zero at every point"
    answer: does not depend on distance
    difficulty: 2
    hints:
    - σ/(2ε₀).
    - No r.
    solution: "Gauss's law gives E = σ/2ε₀, which has no r in it, so the field is the same at every distance."
    mistakes: {"falls as 1/r with distance": "p12_sheet", "falls as 1/r² with distance": "p12_sheet", "is zero at every point": "p12_sheet"}
  - prompt: 'A charge outside a closed surface contributes to the total flux:'
    options:
    - nothing
    - q/ε₀
    - 2q/ε₀
    - −q/ε₀
    answer: nothing
    difficulty: 2
    hints:
    - Lines enter and leave.
    - Net zero.
    solution: "Its field lines enter the surface and leave it again, so its net flux is zero; only enclosed charge counts."
    mistakes:
      q/ε₀: c12p_flux
  - prompt: A field of 200 N/C passes straight through 0.2 m². Find the flux (N m²/C).
    answer: '40'
    check: 200*Rational(2,10)
    difficulty: 1
    hints:
    - Φ = EΔS cos θ.
    - Straight through means θ = 0.
    solution: 'Step 1: 200 × 0.2 × 1. Step 2: 40.'
    mistakes:
      '1000': c12p1_gauss
      '20': c12p1_gauss
  - prompt: A field of 80 N/C makes 60° with the normal of a 0.5 m² area. Find the flux (N m²/C).
    answer: '20'
    check: 80*Rational(1,2)*Rational(1,2)
    difficulty: 1
    hints:
    - Use cos 60°.
    - 80 × 0.5 × 0.5.
    solution: 'Step 1: 40 × 1/2. Step 2: 20.'
    mistakes:
      '40': c12p1_gauss
      '35': c12p1_gauss
  - prompt: A closed surface encloses charges 3q, −q and 2q. The flux is how many times q/ε₀?
    answer: '4'
    check: 3 - 1 + 2
    difficulty: 1
    hints:
    - Add the enclosed charges.
    - Mind the sign.
    solution: 'Step 1: 3q − q + 2q = 4q. Step 2: 4q/ε₀.'
    mistakes:
      '6': c12p1_gauss
      '2': c12p1_gauss
  - prompt: 'A charge q sits at the centre of a cube. The flux through one face is q/ε₀ divided by:'
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Total flux is q/ε₀.
    - By symmetry, it is shared equally by the faces.
    solution: 'Step 1: 6 equal faces. Step 2: q/(6ε₀).'
    mistakes:
      '4': c12p1_gauss
      '8': c12p1_gauss
  - prompt: Field of a charged shell (radius 1 m, q = 1 μC) at 3 m from the centre, in units of 10³ N/C (k = 9 × 10⁹).
    answer: '1'
    check: 9/9
    difficulty: 2
    hints:
    - Outside, the shell acts like a point charge.
    - kq/r² with r = 3.
    solution: 'Step 1: 9 × 10³/9. Step 2: 1 × 10³ N/C.'
    mistakes:
      '0': c12p1_gauss
      '3': c12p1_inv
  - prompt: 'The same shell: field at 0.5 m from the centre?'
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - 0.5 m is inside the shell.
    - What charge does a Gaussian sphere there enclose?
    solution: 'Step 1: no charge enclosed. Step 2: E = 0.'
    mistakes:
      '36': c12p1_gauss
      '4': c12p1_gauss
  - prompt: 'An infinite sheet has field E at 1 cm. Its field at 10 cm is:'
    options:
    - E
    - E/10
    - E/100
    answer: E
    difficulty: 2
    hints:
    - Look at the sheet formula σ/(2ε₀).
    - Does r appear?
    solution: 'Step 1: no r in the formula. Step 2: still E.'
    mistakes:
      E/10: c12p1_gauss
      E/100: c12p1_inv
  - prompt: A long wire gives 600 N/C at 2 cm. Find the field (N/C) at 6 cm.
    answer: '200'
    check: 600*2/6
    difficulty: 3
    hints:
    - For a line, E ∝ 1/r.
    - r is tripled.
    solution: 'Step 1: E → E/3. Step 2: 200 N/C.'
    mistakes:
      '67': c12p1_inv
      '1800': c12p1_inv
  - prompt: Flux through a closed surface is 2 × 10⁵ N m²/C. With ε₀ = 8.85 × 10⁻¹², the enclosed charge is about how many μC? (round to the nearest whole number)
    answer: '2'
    check: round(2*10**5*885/10**14*10**6)
    difficulty: 3
    hints:
    - q = ε₀Φ.
    - 8.85 × 10⁻¹² × 2 × 10⁵.
    solution: 'Step 1: 17.7 × 10⁻⁷ C ≈ 1.77 μC. Step 2: about 2 μC.'
    mistakes:
      '18': c12p1_units
      '1': c12p1_units
  - prompt: 'Assertion (A): The total electric flux through a closed surface surrounding an electric dipole is zero.

      Reason (R): The net charge enclosed by the surface is zero.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: A dipole has +q and −q, so the enclosed charge is 0 and by Gauss's law the total flux is 0. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A small charge of 8.85 μC is placed at the centre of a cubical box. What is the electric flux through one face? (ε₀ = 8.85 × 10⁻¹² C² N⁻¹ m⁻²)'
    options:
    - 1.67 × 10⁵ N m²/C
    - 10⁶ N m²/C
    - 6 × 10⁶ N m²/C
    answer: 1.67 × 10⁵ N m²/C
    hints:
    - Total flux = q/ε₀.
    - By symmetry, each face gets an equal share.
    solution: Total flux = 8.85 × 10⁻⁶ / 8.85 × 10⁻¹² = 10⁶ N m²/C. Each of the 6 faces gets 10⁶/6 ≈ 1.67 × 10⁵ N m²/C.
    mistakes:
      10⁶ N m²/C: pq12p1_one_face
      6 × 10⁶ N m²/C: c12p1_gauss
    exam: case
    difficulty: 2
  - prompt: A student says the field inside a charged hollow metal sphere is strongest at the centre. Which reasoning corrects this?
    options:
    - "A Gaussian sphere inside encloses no charge, so the field inside is zero"
    - "The field doubles at the centre, as charges from all sides add up"
    - "The field inside equals kq/R² everywhere, the same as at the surface"
    answer: A Gaussian sphere inside encloses no charge, so the field inside is zero
    hints:
    - Where does the charge on a conductor sit?
    - Apply Gauss's law to a sphere smaller than the shell.
    solution: The charge sits on the outer surface. A Gaussian sphere inside it encloses no charge, so by symmetry and Gauss's law E = 0 everywhere inside.
    mistakes:
      "The field doubles at the centre, as charges from all sides add up": pq12p1_inside
      "The field inside equals kq/R² everywhere, the same as at the surface": pq12p1_inside
    exam: competency
    difficulty: 2
