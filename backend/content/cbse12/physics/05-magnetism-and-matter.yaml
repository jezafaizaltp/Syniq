# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse12-phy
chapter: 5
title: Magnetism and Matter
tips:
  c12p_dia: 'Diamagnetic: weakly repelled (χ small, negative). Paramagnetic: weakly attracted. Ferromagnetic: strongly attracted.'
  c12p_bar: 'Magnetic field lines form closed loops: outside a magnet N → S, inside S → N. Monopoles don''t exist.'
  p12_curie: "Heat scrambles domains, leaving weak alignment only in a field."
  p12_cut_magnet: "Magnetic poles always come in pairs. Cutting makes two new magnets."
  p12_dip: "Declination is the horizontal angle from true north. The vertical tilt is the other one."
  p12_domains: "Iron contains tiny regions where atomic magnets already line up."
  p12_gauss_magnetism: "There are no magnetic monopoles: every line that leaves a closed surface comes back in."
  p12_magnet_pe: "U = −mB cos θ. Aligned means θ = 0."
  p12_meissner: "Superconductors push magnetic fields out completely (χ = −1)."
  p12_mu_r: "μr = 1 + χ."
  p12_soft_iron: "A core must magnetise and demagnetise easily each cycle with little loss."
  p12_torque_magnet: "τ = mB sin θ."
concepts:
- code: cbse12p.magmat.bar
  title: Bar magnets and the Earth's magnetism
  notes: |
    Bar magnet as an equivalent solenoid; magnetic dipole moment m; field lines are closed loops (no monopoles); field on
    axis 2(μ₀/4π)m/r³, equatorial (μ₀/4π)m/r³. Torque in a uniform field τ = mB sin θ; potential energy U = −mB cos θ. Gauss's
    law for magnetism: net flux through any closed surface = 0. Earth's magnetism: magnetic declination, inclination (dip),
    horizontal component. (Some topics on Earth's field trimmed in rationalised syllabus.)
  explanations:
    text: 'A bar magnet behaves like a small current loop or solenoid. Its field lines form closed loops from north to south outside and south to north inside. You can''t isolate a single pole: cut a magnet and you get two smaller magnets.'
    visual: 'Sprinkle iron filings around a bar magnet: they trace loops from one end to the other, crowding near the poles.'
    step_by_step: 'Step 1: Treat the magnet as a dipole with moment m. Step 2: Torque = mB sin θ. Step 3: Energy = −mB cos θ (lowest when aligned). Step 4: Remember net magnetic flux through a closed surface is zero.'
    real_world: A compass needle is a tiny bar magnet that lines up with the Earth's magnetic field.
  picture:
    kind: flow
    steps:
    - Field leaves the north pole
    - Curves round outside
    - Enters the south pole
    - Runs S → N inside
    - Closed loop
    alt: Magnetic field lines of a bar magnet form closed loops.
  activity:
    type: formula
    prompt: A short bar magnet (m = 1 A m²). At distance r its field on the axis is 2 × (μ₀/4π)m/r³; on the equator it is half that.
    inputs:
    - name: r
      label: Distance r
      min: 5
      max: 50
      step: 1
      start: 5
      unit: cm
    outputs:
    - name: ax
      label: Field on the axis
      expr: 200000/r^3
      unit: μT
      places: 2
    - name: eq
      label: Field on the equator
      expr: 100000/r^3
      unit: μT
      places: 2
    goals:
    - prompt: Find where the axial field is 1/8 of its value at 10 cm.
      want:
        r: 20
      mistakes:
      - when:
          r: 40
        say: '4 times as far gives 1/64: B ∝ 1/r³. 1/8 = (1/2)³ needs only twice the distance.'
      - when:
          r: 30
        say: 3 times as far gives 1/27.
    - prompt: Find where the axial field is 8 times its value at 40 cm.
      want:
        r: 20
      mistakes:
      - when:
          r: 5
        say: '8 times closer gives 512 times the field. 8 = 2³: halve the distance.'
      - when:
          r: 10
        say: 4 times closer gives 64 times the field.
    - prompt: Find where the EQUATORIAL field equals the axial field at 10 cm (200 μT).
      want:
        eq:
        - 190
        - 210
      mistakes:
      - when:
          r: 10
        say: At the same distance the equatorial field is only half the axial field. Come closer.
  items:
  - prompt: A magnet of moment 2 A m² is at 90° to a 0.5 T field. Find the torque (N m).
    answer: '1'
    check: 2*Rational(1,2)*1
    difficulty: 1
    hints:
    - τ = mB sin θ.
    - 2 × 0.5 × 1.
    solution: 1 N m.
    mistakes: {"0.5": "p12_torque_magnet", "4": "p12_torque_magnet"}
  - prompt: Find the potential energy (J) of a 2 A m² magnet aligned with a 0.5 T field.
    answer: '-1'
    check: -2*Rational(1,2)
    difficulty: 2
    hints:
    - U = −mB cos 0.
    - −1.
    solution: −1 J.
    mistakes: {"1": "p12_magnet_pe", "0": "p12_magnet_pe"}
  - prompt: A bar magnet is cut in half. How many poles does each piece have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - No monopoles.
    - N and S.
    solution: 2 (a north and a south).
    mistakes: {"1": "p12_cut_magnet", "4": "p12_cut_magnet"}
  - prompt: 'Magnetic field lines:'
    options:
    - form closed loops
    - start at N and end at S
    - cross each other
    - exist only outside magnets
    answer: form closed loops
    difficulty: 1
    hints:
    - No monopoles.
    - Continuous.
    solution: They form closed loops.
    mistakes:
      start at N and end at S: c12p_bar
  - prompt: 'Net magnetic flux through any closed surface is:'
    options:
    - zero
    - μ₀I
    - q/ε₀
    - infinite
    answer: zero
    difficulty: 2
    hints:
    - Gauss's law for magnetism.
    - No monopoles.
    solution: Zero.
    mistakes: {"μ₀I": "p12_gauss_magnetism", "q/ε₀": "p12_gauss_magnetism", "infinite": "p12_gauss_magnetism"}
  - prompt: 'The angle between the Earth''s field and the horizontal is the:'
    options:
    - dip (inclination)
    - declination
    - latitude
    - azimuth
    answer: dip (inclination)
    difficulty: 2
    hints:
    - Needle tilts.
    - Vertical plane.
    solution: The angle of dip.
    mistakes: {"declination": "p12_dip", "latitude": "p12_dip", "azimuth": "p12_dip"}
- code: cbse12p.magmat.materials
  title: Magnetic properties of materials
  after:
  - cbse12p.magmat.bar
  notes: |
    Magnetisation M, magnetic intensity H; B = μ₀(H + M) = μH; susceptibility χ = M/H; relative permeability μr = 1 + χ.
    Diamagnetic (χ small negative: Bi, Cu, water, superconductors—perfect diamagnets, Meissner effect), paramagnetic (χ small
    positive: Al, Na, O₂; Curie's law χ ∝ 1/T), ferromagnetic (χ large: Fe, Co, Ni; domains; become paramagnetic above Curie
    temperature). Hysteresis: retentivity, coercivity; soft iron for electromagnets/transformers, steel for permanent
    magnets.
  explanations:
    text: Materials respond differently to magnets. Diamagnetic materials are weakly pushed away, paramagnetic ones weakly pulled in, and ferromagnetic materials like iron are strongly attracted because their tiny magnetic domains line up.
    visual: Picture iron as a patchwork of tiny magnets (domains) pointing every which way. A magnetic field swings them into line, making the iron a strong magnet.
    step_by_step: 'Step 1: Check the sign and size of χ. Step 2: Negative → diamagnetic; small positive → paramagnetic; large positive → ferromagnetic. Step 3: Above the Curie temperature a ferromagnet becomes paramagnetic.'
    real_world: Transformer cores use soft iron because it magnetises and demagnetises easily, wasting little energy.
  picture:
    kind: compare
    columns:
    - title: Type
      points:
      - diamagnetic
      - paramagnetic
      - ferromagnetic
    - title: Susceptibility χ
      points:
      - small, negative
      - small, positive
      - large, positive
    - title: Example
      points:
      - bismuth, copper
      - aluminium, oxygen
      - iron, nickel
    alt: Diamagnetic, paramagnetic and ferromagnetic materials compared.
  activity:
    type: sort
    prompt: How does each material behave in a magnetic field?
    bins:
    - Diamagnetic
    - Paramagnetic
    - Ferromagnetic
    items:
    - label: Bismuth
      bin: Diamagnetic
      clue: Is it pushed weakly out of a strong field?
      why: 'Bismuth is weakly repelled: χ small and negative.'
    - label: Copper
      bin: Diamagnetic
      clue: Does a copper wire stick to a magnet?
      why: Copper is weakly repelled.
    - label: Water
      bin: Diamagnetic
      clue: Water is pushed slightly away by strong magnets. Which kind?
      why: Diamagnetic.
    - label: A superconductor
      bin: Diamagnetic
      clue: It throws the field out completely (Meissner effect). Which kind?
      why: 'A perfect diamagnet: χ = −1.'
    - label: Aluminium
      bin: Paramagnetic
      clue: Is it pulled weakly toward a strong field?
      why: 'Weakly attracted: paramagnetic.'
    - label: Sodium
      bin: Paramagnetic
      clue: Weakly pulled in, and loses it when the field goes. Which kind?
      why: Paramagnetic.
    - label: Liquid oxygen
      bin: Paramagnetic
      clue: It clings weakly between magnet poles. Which kind?
      why: O₂ is paramagnetic.
    - label: Iron
      bin: Ferromagnetic
      clue: Is it pulled strongly and can stay magnetised?
      why: 'Ferromagnetic: domains line up.'
    - label: Nickel
      bin: Ferromagnetic
      clue: Strongly attracted. Which kind?
      why: Ferromagnetic.
    - label: Cobalt
      bin: Ferromagnetic
      clue: Used in strong permanent magnets. Which kind?
      why: Ferromagnetic.
    - label: Gadolinium
      bin: Ferromagnetic
      clue: Strongly magnetic below about 20 °C. Which kind?
      why: Ferromagnetic (below its Curie temperature).
  items:
  - prompt: A material has χ = 0.5. Find its relative permeability μr.
    answer: '1.5'
    check: 1+Rational(1,2)
    difficulty: 1
    hints:
    - μr = 1 + χ.
    - 1 + 0.5.
    solution: 1.5.
    mistakes: {"0.5": "p12_mu_r", "-0.5": "p12_mu_r"}
  - prompt: 'Bismuth placed near a strong magnet is:'
    options:
    - weakly repelled
    - strongly attracted
    - weakly attracted
    - unaffected always
    answer: weakly repelled
    difficulty: 2
    hints:
    - Diamagnetic.
    - χ negative.
    solution: Weakly repelled.
    mistakes:
      weakly attracted: c12p_dia
  - prompt: 'A ferromagnet heated above its Curie temperature becomes:'
    options:
    - paramagnetic
    - diamagnetic
    - more strongly magnetic
    - a superconductor
    answer: paramagnetic
    difficulty: 2
    hints:
    - Domains break up.
    - Heat disorders them.
    solution: Paramagnetic.
    mistakes: {"diamagnetic": "p12_curie", "more strongly magnetic": "p12_curie", "a superconductor": "p12_curie"}
  - prompt: Which material is best for the core of a transformer?
    options:
    - soft iron
    - steel
    - copper
    - bismuth
    answer: soft iron
    difficulty: 2
    hints:
    - Low coercivity.
    - Little hysteresis loss.
    solution: Soft iron.
    mistakes: {"steel": "p12_soft_iron", "copper": "p12_soft_iron", "bismuth": "p12_soft_iron"}
  - prompt: 'Superconductors show perfect:'
    options:
    - diamagnetism
    - paramagnetism
    - ferromagnetism
    - resistance
    answer: diamagnetism
    difficulty: 2
    hints:
    - Meissner effect.
    - Expel fields.
    solution: Diamagnetism.
    mistakes: {"paramagnetism": "p12_meissner", "ferromagnetism": "p12_meissner", "resistance": "p12_meissner"}
  - prompt: 'Iron is strongly magnetic because of its:'
    options:
    - domains
    - free protons
    - high density
    - colour
    answer: domains
    difficulty: 1
    hints:
    - Regions of aligned atoms.
    - They line up.
    solution: Its magnetic domains.
    mistakes: {"free protons": "p12_domains", "high density": "p12_domains", "colour": "p12_domains"}
