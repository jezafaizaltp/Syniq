# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 14. Format: content/README.md.
subject: cbse12-phy
chapter: 14
title: Semiconductor Electronics
tips:
  c12p_doping: "p-type comes from trivalent dopants, which leave a gap where an electron is missing. Which carrier is then in the majority?"
  c12p_bias: Forward bias (p to +) makes the depletion layer thin and current flows; reverse bias widens it and almost no current flows.
  p12_band_gap: "Conductors have no gap; semiconductors have a small one."
  p12_barrier: "Germanium is about 0.3 V; silicon is a bit more than double."
  p12_full_wave: "A full-wave rectifier uses both halves of each cycle."
  p12_half_wave: "A half-wave rectifier passes one half per cycle."
  p12_mass_action: "nₑnₕ = nᵢ². Square nᵢ, then divide by nₑ."
  p12_ntype: "n-type has extra electrons. Silicon has 4 valence electrons; the dopant has one more."
  p12_ptype: "p-type has holes. The dopant has one fewer valence electron than silicon."
  p12_rectifier: "Phone chargers plug into the alternating mains and fill a battery, which needs current in one direction only. A rectifier does that conversion."
  p12_reverse_bias: "Reverse bias pulls carriers away from the junction."
  p12_semi_temp: "Heat frees more electrons across the band gap."
  c12p14_band: 'Compare band gaps: conductors have none (bands overlap), semiconductors about 1 eV, insulators more than 3 eV.'
  c12p14_dope: "Count the dopant's valence electrons: one more than silicon gives spare electrons, one fewer leaves holes. Then name the type by its majority carrier."
  c12p14_bias: 'Forward bias: p to +, barrier lowered, current flows. Reverse bias: p to −, barrier raised, almost no current.'
concepts:
- code: cbse12p.semi.materials
  title: Semiconductors and doping
  notes: |
    Classification by conductivity and energy bands: conductors (overlapping bands), insulators (large gap > 3 eV),
    semiconductors (small gap ~1 eV: Si 1.1 eV, Ge 0.7 eV). Intrinsic semiconductors: nₑ = nₕ; electrons and holes. Extrinsic:
    n-type (pentavalent donor, electrons majority), p-type (trivalent acceptor, holes majority); nₑnₕ = nᵢ². Conductivity rises
    with temperature (unlike metals).
  explanations:
    text: 'Semiconductors like silicon conduct electricity better than insulators but worse than metals. Adding tiny amounts of other elements (doping) greatly increases conductivity: adding phosphorus gives extra electrons (n-type); adding boron gives holes (p-type).'
    visual: 'Draw energy bands: for a metal they overlap, for an insulator there''s a big gap, and for a semiconductor there''s a small gap that electrons can jump with a little heat.'
    step_by_step: 'Step 1: Look at the band gap to classify. Step 2: Pentavalent dopant → n-type. Step 3: Trivalent dopant → p-type. Step 4: Majority carriers: electrons in n, holes in p.'
    real_world: Every phone and computer chip is made from doped silicon.
  picture:
    kind: compare
    columns:
    - title: Type
      points:
      - n-type
      - p-type
    - title: Dopant
      points:
      - pentavalent (P, As)
      - trivalent (B, Al)
    - title: Majority carriers
      points:
      - electrons
      - holes
    alt: 'n-type and p-type semiconductors: their dopants and majority carriers.'
  activity:
    type: sort
    prompt: Is each one n-type, p-type or intrinsic?
    bins:
    - n-type
    - p-type
    - Intrinsic
    items:
    - label: Silicon doped with phosphorus
      bin: n-type
      clue: Phosphorus has 5 valence electrons. What does the 5th do?
      why: 'The extra electron is free: electrons are the majority carriers.'
    - label: Silicon doped with arsenic
      bin: n-type
      clue: How many valence electrons does arsenic have?
      why: 'Pentavalent: donates electrons.'
    - label: Germanium doped with antimony
      bin: n-type
      clue: Antimony is in group 15. Donor or acceptor?
      why: 'A donor: extra electrons.'
    - label: A pentavalent dopant
      bin: n-type
      clue: Five valence electrons, four bonds. What's left over?
      why: One spare electron per atom.
    - label: Silicon doped with boron
      bin: p-type
      clue: Boron has 3 valence electrons. What is missing from the fourth bond?
      why: 'A hole: holes are the majority carriers.'
    - label: Silicon doped with aluminium
      bin: p-type
      clue: Aluminium is in group 13. Donor or acceptor?
      why: 'An acceptor: makes holes.'
    - label: Germanium doped with indium
      bin: p-type
      clue: How many valence electrons does indium have?
      why: 'Trivalent: holes.'
    - label: Holes are the majority carriers
      bin: p-type
      clue: Which dopant leaves bonds short of an electron?
      why: Trivalent doping gives mostly holes.
    - label: 'Pure silicon: nₑ = nₕ'
      bin: Intrinsic
      clue: Has anything been added?
      why: 'Pure semiconductor: equal electrons and holes.'
  lesson:
    - teach: 'Solids are sorted by energy bands. In conductors, the valence and conduction bands overlap. Insulators have a big gap (more than 3 eV). Semiconductors have a small gap: silicon 1.1 eV, germanium 0.7 eV, so some electrons can jump across at room temperature.'
      check:
        prompt: Which has the smallest band gap?
        options:
        - germanium
        - silicon
        - diamond
        answer: germanium
        why: 0.7 eV, less than silicon's 1.1 eV.
      ways:
      - style: visual
        teach: Conductors, semiconductors and insulators sorted by their energy bands.
        picture:
          kind: compare
          columns:
          - title: Conductor
            points:
            - Bands overlap
            - 'No gap: e.g. copper'
          - title: Semiconductor
            points:
            - Small gap, about 1 eV
            - Si 1.1 eV, Ge 0.7 eV
          - title: Insulator
            points:
            - Large gap, over 3 eV
            - Diamond about 6 eV
          alt: In a conductor like copper the bands overlap and there is no gap. A semiconductor has a small gap of about 1 eV, 1.1 for silicon and 0.7 for germanium. An insulator has a gap over 3 eV, about 6 for diamond.
      - style: real_world
        teach: Think of the band gap as a wall electrons must jump to become free. In copper there is no wall; in silicon a low wall that some electrons clear at room temperature; in diamond a wall so high almost none clear it.
    - teach: In a pure (intrinsic) semiconductor, each electron that jumps leaves a hole, so nₑ = nₕ = nᵢ. Heating frees more carriers, so conductivity rises with temperature, unlike metals.
      check:
        prompt: 'Heating pure silicon makes its resistance:'
        options:
        - fall
        - rise
        - stay the same
        answer: fall
        why: More electron-hole pairs carry current.
      ways:
      - style: visual
        teach: How heating changes a metal and a semiconductor in opposite ways.
        picture:
          kind: compare
          columns:
          - title: Metal, heated
            points:
            - Same number of free electrons
            - More collisions with vibrating ions
            - Conductivity falls
          - title: Semiconductor, heated
            points:
            - Many more electrons cross the gap
            - 'Each leaves a hole: more carriers'
            - Conductivity rises
          alt: A heated metal keeps the same number of free electrons but they collide more with vibrating ions, so conductivity falls. A heated semiconductor gains many electrons across the gap, each leaving a hole, so conductivity rises.
      - style: step_by_step
        teach: 'In pure silicon at room temperature. Step 1: Some electrons gain enough energy to jump the 1.1 eV gap. Step 2: Each leaves behind a hole in the valence band. Step 3: So nₑ = nₕ = nᵢ. Step 4: Both electrons and holes carry current, in opposite directions.'
    - teach: 'Doping adds a tiny amount of impurity. A pentavalent atom (P, As) donates an extra electron: n-type, electrons are majority carriers. A trivalent atom (B, Al) accepts an electron, leaving a hole: p-type, holes are majority carriers. Always nₑnₕ = nᵢ².'
      picture:
        kind: compare
        columns:
        - title: n-type
          points:
          - dopant valency 5
          - e.g. phosphorus
          - 'majority: electrons'
        - title: p-type
          points:
          - dopant valency 3
          - e.g. boron
          - 'majority: holes'
        alt: n-type and p-type semiconductors compared.
      check:
        prompt: 'Arsenic added to silicon makes it:'
        options:
        - n-type
        - p-type
        - an insulator
        answer: n-type
        why: Arsenic is pentavalent, a donor.
      ways:
      - style: step_by_step
        teach: 'Doped silicon with nᵢ = 1.5 × 10¹⁶ m⁻³ and nₑ = 4.5 × 10²² m⁻³. Step 1: nₑnₕ = nᵢ². Step 2: nₕ = (1.5 × 10¹⁶)² / 4.5 × 10²². Step 3: nₕ = 2.25 × 10³² / 4.5 × 10²² = 5 × 10⁹ m⁻³. Step 4: Electrons far outnumber holes: n-type.'
      - style: real_world
        teach: A single drop of ink colours a whole glass of water. In the same way, about one phosphorus atom per million silicon atoms multiplies silicon's free electrons thousands of times. That tiny 'ink' is doping.
  items:
  - prompt: What is the valency of an atom used to make n-type silicon?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Pentavalent.
    - Phosphorus.
    solution: "A pentavalent atom (valency 5, such as arsenic or phosphorus) uses 4 electrons for bonds and gives the 5th as a free electron."
    mistakes: {"3": "p12_ntype", "4": "p12_ntype"}
  - prompt: What is the valency of an atom used to make p-type silicon?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Trivalent.
    - Boron.
    solution: "A trivalent atom (valency 3, such as boron or indium) leaves one bond short, which creates a hole."
    mistakes: {"5": "p12_ptype", "4": "p12_ptype"}
  - prompt: In a semiconductor, nᵢ = 10¹⁰ per cm³ and nₑ = 10¹² per cm³. Find nₕ as a power of 10.
    answer: '8'
    check: 20-12
    difficulty: 2
    hints:
    - nₑnₕ = nᵢ².
    - 10²⁰/10¹².
    solution: 10⁸ per cm³ (power 8).
    mistakes: {"10": "p12_mass_action", "12": "p12_mass_action", "20": "p12_mass_action"}
  - prompt: 'In a p-type semiconductor, the majority carriers are:'
    options:
    - holes
    - electrons
    - protons
    - ions
    answer: holes
    difficulty: 1
    hints:
    - Trivalent dopant.
    - Missing electrons.
    solution: "Trivalent impurities create holes, so in p-type material holes are the majority carriers."
    mistakes:
      electrons: c12p_doping
  - prompt: 'When a semiconductor is heated, its conductivity:'
    options:
    - increases
    - decreases
    - stays the same
    - becomes zero
    answer: increases
    difficulty: 2
    hints:
    - More electrons jump the gap.
    - Opposite to metals.
    solution: "Heat breaks more bonds, freeing more electrons and holes, so conductivity increases."
    mistakes: {"decreases": "p12_semi_temp", "stays the same": "p12_semi_temp", "becomes zero": "p12_semi_temp"}
  - prompt: Which material has the largest band gap?
    options:
    - "an insulator like diamond"
    - "silicon, a semiconductor"
    - "germanium, a semiconductor"
    - "copper, a good conductor"
    answer: an insulator like diamond
    difficulty: 1
    hints:
    - Electrons can't jump.
    - Over 3 eV.
    solution: An insulator such as diamond.
    mistakes: {"silicon, a semiconductor": "p12_band_gap", "germanium, a semiconductor": "p12_band_gap", "copper, a good conductor": "p12_band_gap"}
  - prompt: 'Silicon atoms have valency:'
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Silicon is in group 14.
    - It forms four bonds in the crystal.
    solution: 'Step 1: group 14. Step 2: valency 4.'
    mistakes:
      '3': c12p14_dope
      '5': c12p14_dope
  - prompt: 'Boron added to silicon gives:'
    options:
    - p-type
    - n-type
    - an intrinsic semiconductor
    answer: p-type
    difficulty: 1
    hints:
    - Boron has valency 3.
    - One bond is left short of an electron.
    solution: 'Step 1: trivalent acceptor. Step 2: p-type.'
    mistakes:
      n-type: c12p14_dope
      an intrinsic semiconductor: c12p14_dope
  - prompt: Band gap of silicon (eV), as a fraction?
    answer: 11/10
    check: Rational(11,10)
    difficulty: 1
    hints:
    - It is a little over 1 eV.
    - Germanium's is 0.7 eV.
    solution: 'Step 1: Si ≈ 1.1 eV. Step 2: 11/10.'
    mistakes:
      7/10: c12p14_band
      '3': c12p14_band
  - prompt: nᵢ = 10¹⁰ cm⁻³ and nₕ = 10¹⁴ cm⁻³. Find nₑ as a power of 10.
    answer: '6'
    check: 20 - 14
    difficulty: 2
    hints:
    - nₑnₕ = nᵢ² = 10²⁰.
    - Divide by 10¹⁴.
    solution: 'Step 1: 10²⁰/10¹⁴. Step 2: 10⁶, power 6.'
    mistakes:
      '14': c12p14_dope
      '4': c12p14_dope
  - prompt: In that sample, which type is it?
    options:
    - p-type
    - n-type
    - intrinsic
    answer: p-type
    difficulty: 2
    hints:
    - Compare nₕ with nₑ.
    - Holes are far more numerous.
    solution: 'Step 1: nₕ ≫ nₑ. Step 2: p-type.'
    mistakes:
      n-type: c12p14_dope
      intrinsic: c12p14_dope
  - prompt: Is an n-type semiconductor negatively charged overall?
    options:
    - no, it is neutral
    - yes, it has extra electrons
    - it is positive
    answer: no, it is neutral
    difficulty: 2
    hints:
    - Each donor atom that gives an electron becomes a positive ion.
    - Charges balance.
    solution: 'Step 1: free electron + fixed positive ion. Step 2: overall neutral.'
    mistakes:
      yes, it has extra electrons: c12p14_dope
      it is positive: c12p14_dope
  - prompt: Photon energy (eV) needed to make an electron-hole pair in germanium, as a fraction?
    answer: 7/10
    check: Rational(7,10)
    difficulty: 2
    hints:
    - It must cross the band gap.
    - Germanium's gap.
    solution: 'Step 1: Eg(Ge) = 0.7 eV. Step 2: 7/10.'
    mistakes:
      11/10: c12p14_band
      '0': c12p14_band
  - prompt: Why does a metal's conductivity fall when heated, while a semiconductor's rises?
    options:
    - "metals' carriers are fixed in number but scatter more; semiconductors gain many carriers"
    - "metals lose their free electrons when hot; semiconductors gain them from the metal"
    - "semiconductors melt when heated, so their electrons move freely like a liquid's"
    answer: metals' carriers are fixed in number but scatter more; semiconductors gain many carriers
    difficulty: 3
    hints:
    - Think about the number of carriers in each.
    - And about collisions.
    solution: 'Step 1: metals: more collisions, same carriers. Step 2: semiconductors: many more carriers outweigh collisions.'
    mistakes:
      "metals lose their free electrons when hot; semiconductors gain them from the metal": c12p14_band
      "semiconductors melt when heated, so their electrons move freely like a liquid's": c12p14_band
  - prompt: 'Diamond''s band gap is about 6 eV. It is a:'
    options:
    - insulator
    - semiconductor
    - conductor
    answer: insulator
    difficulty: 3
    hints:
    - Compare with 3 eV.
    - Very few electrons can jump.
    solution: 'Step 1: 6 eV > 3 eV. Step 2: insulator.'
    mistakes:
      semiconductor: c12p14_band
      conductor: c12p14_band
  - prompt: 'Assertion (A): An n-type semiconductor is electrically neutral overall.

      Reason (R): Each donor atom that gives up an electron becomes a positive ion that stays in the crystal.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Every extra free electron is matched by a fixed positive donor ion, so total charge stays zero. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A chip maker adds arsenic to pure silicon. What kind of material results, and what are its majority carriers?'
    options:
    - n-type, electrons
    - p-type, holes
    - n-type, holes
    answer: n-type, electrons
    hints:
    - How many valence electrons does arsenic have?
    - Silicon has 4; one extra is free.
    solution: 'Arsenic is pentavalent: four electrons bond with silicon and the fifth is free. So the material is n-type, with electrons as majority carriers.'
    mistakes:
      p-type, holes: c12p14_dope
      n-type, holes: c12p14_dope
    exam: case
    difficulty: 2
  - prompt: A light sensor uses a semiconductor with a 2 eV band gap. Which light will make it conduct? (hc = 1240 eV nm)
    options:
    - Light shorter than about 620 nm
    - Light longer than about 620 nm
    - Any light, whatever its wavelength
    answer: Light shorter than about 620 nm
    hints:
    - A photon must carry at least 2 eV.
    - λ = 1240/E.
    solution: λ = 1240/2 = 620 nm. Shorter wavelengths have more energy per photon than 2 eV and can lift electrons across the gap.
    mistakes:
      Light longer than about 620 nm: c12p14_band
      Any light, whatever its wavelength: c12p14_band
    exam: competency
    difficulty: 2
- code: cbse12p.semi.diode
  title: p-n junction and diodes
  after:
  - cbse12p.semi.materials
  notes: |
    p-n junction: diffusion and drift; depletion region; barrier potential (~0.7 V Si, 0.3 V Ge). Forward bias (p to +):
    barrier lowered, current flows (mA). Reverse bias: barrier raised, tiny current (μA) until breakdown. Diode I–V
    characteristic. Rectifiers: half-wave (one diode, output frequency = input), full-wave (two diodes or bridge, output
    frequency = 2 × input); filters with capacitors. (Special diodes and transistors removed in rationalised syllabus.)
  explanations:
    text: Joining p-type and n-type material makes a p-n junction diode, which lets current flow easily one way (forward bias) but hardly at all the other way (reverse bias). Diodes turn AC into DC in a rectifier.
    visual: 'Draw a diode as an arrow with a bar: current flows in the arrow''s direction. In a half-wave rectifier only the top halves of the AC wave get through; in full-wave, the bottom halves are flipped up too.'
    step_by_step: 'Step 1: Check the bias: p side positive → forward. Step 2: Forward: current flows after ~0.7 V (Si). Step 3: Reverse: almost no current. Step 4: Rectifier output frequency: half-wave = f, full-wave = 2f.'
    real_world: Phone chargers use diode rectifiers to turn 230 V AC into the low-voltage DC a battery needs.
  picture:
    kind: flow
    steps:
    - AC input
    - Diodes conduct one way
    - Pulsing DC
    - Capacitor filter smooths it
    - Steady DC
    alt: 'A rectifier: diodes turn AC into pulsing DC, and a capacitor smooths it.'
  activity:
    type: sort
    prompt: A p-n junction diode. Forward or reverse bias?
    bins:
    - Forward bias
    - Reverse bias
    items:
    - label: p side connected to the + terminal
      bin: Forward bias
      clue: Does + on p push holes toward the junction?
      why: 'That lowers the barrier: forward bias.'
    - label: The depletion region narrows
      bin: Forward bias
      clue: Which bias pushes carriers into the junction?
      why: Forward bias shrinks the depletion layer.
    - label: Current of several mA flows
      bin: Forward bias
      clue: When does a diode conduct well?
      why: In forward bias above about 0.7 V (Si).
    - label: An LED gives out light
      bin: Forward bias
      clue: Light comes when electrons and holes meet. Which bias?
      why: LEDs work in forward bias.
    - label: p side connected to the − terminal
      bin: Reverse bias
      clue: Does − on p pull holes away from the junction?
      why: 'The barrier rises: reverse bias.'
    - label: The depletion region widens
      bin: Reverse bias
      clue: Which bias pulls carriers away from the junction?
      why: Reverse bias.
    - label: Only a tiny current of μA flows
      bin: Reverse bias
      clue: Which bias lets only minority carriers through?
      why: Reverse bias.
    - label: A Zener diode regulating voltage
      bin: Reverse bias
      clue: Zener breakdown happens in which bias?
      why: Zeners are used in reverse breakdown.
    - label: A photodiode detecting light
      bin: Reverse bias
      clue: Which bias makes the current depend on the light falling on it?
      why: Photodiodes are operated in reverse bias.
  lesson:
    - teach: Joining p-type and n-type makes a p-n junction. Electrons and holes diffuse across and recombine, leaving a depletion region of fixed ions with no free carriers. This creates a barrier potential, about 0.7 V for silicon and 0.3 V for germanium.
      check:
        prompt: 'The depletion region contains:'
        options:
        - fixed ions and almost no free carriers
        - many free electrons
        - many holes
        answer: fixed ions and almost no free carriers
        why: Carriers near the junction have recombined.
      ways:
      - style: visual
        teach: How a depletion region and barrier form when p-type and n-type meet.
        picture:
          kind: flow
          steps:
          - Electrons diffuse from n to p, holes from p to n
          - They recombine near the junction
          - 'Fixed ions are left: + on n side, − on p side'
          - Their field forms a barrier, about 0.7 V in Si
          alt: Electrons diffuse from the n side to the p side and holes the other way; they recombine near the junction, leaving fixed positive ions on the n side and negative ions on the p side, whose field forms a barrier of about 0.7 volt in silicon.
      - style: real_world
        teach: 'Picture two crowded rooms with a door: people drift through and some pair off near the doorway, leaving a strip where nobody is free to move. That empty strip is like the depletion region, and its fixed charges push back on anyone else crossing.'
    - teach: 'Forward bias (p to +, n to −) lowers the barrier: current (mA) flows once the voltage passes about 0.7 V for Si. Reverse bias widens the depletion region: only a tiny current (μA) flows, until breakdown at a large voltage.'
      picture:
        kind: compare
        columns:
        - title: Forward bias
          points:
          - p to +
          - barrier lowered
          - large current (mA)
        - title: Reverse bias
          points:
          - p to −
          - barrier raised
          - tiny current (μA)
        alt: Forward and reverse bias of a p-n junction diode.
      check:
        prompt: 'A silicon diode with 0.3 V forward bias conducts:'
        options:
        - very little
        - strongly
        - in reverse
        answer: very little
        why: 0.3 V is below silicon's 0.7 V barrier.
      ways:
      - style: step_by_step
        teach: 'A silicon LED circuit: 9 V supply, 2 V across the LED, 20 mA wanted. Step 1: Voltage left for the resistor: 9 − 2 = 7 V. Step 2: R = V/I. Step 3: R = 7/0.02. Step 4: R = 350 Ω, so a 330 Ω or 390 Ω resistor is used.'
      - style: real_world
        teach: A diode is a one-way valve for current, like the valve in a bicycle pump that lets air in but not out. Connect it the right way (forward bias) and current flows; turn it round and almost nothing gets through.
    - teach: 'A diode lets current pass one way, so it can rectify AC. Half-wave (one diode) passes one half of each cycle: output frequency equals input. Full-wave (two diodes or a bridge) uses both halves: output ripple frequency is twice the input. A capacitor filter smooths the output.'
      check:
        prompt: 'A full-wave rectifier on 60 Hz gives ripple at:'
        options:
        - 120 Hz
        - 60 Hz
        - 30 Hz
        answer: 120 Hz
        why: 'Both halves give a pulse: 2 × 60.'
      ways:
      - style: visual
        teach: Half-wave and full-wave rectifiers compared.
        picture:
          kind: compare
          columns:
          - title: Half-wave
            points:
            - One diode
            - Passes only one half of each cycle
            - 50 Hz in, 50 Hz pulses out
          - title: Full-wave
            points:
            - Two diodes or a four-diode bridge
            - Uses both halves
            - 50 Hz in, 100 Hz pulses out
          alt: A half-wave rectifier uses one diode, passes only one half of each cycle, and gives 50 hertz pulses from 50 hertz AC. A full-wave rectifier uses two diodes or a bridge, uses both halves, and gives 100 hertz pulses.
      - style: step_by_step
        teach: 'Turning mains into smooth DC for a phone. Step 1: A transformer steps 230 V AC down. Step 2: A bridge rectifier turns both halves positive. Step 3: A capacitor charges at each peak and fills the dips. Step 4: A regulator holds the output steady at 5 V.'
  items:
  - prompt: A full-wave rectifier runs on 50 Hz AC. Find the output ripple frequency (Hz).
    answer: '100'
    check: 2*50
    difficulty: 2
    hints:
    - Twice the input.
    - 2 × 50.
    solution: "A full-wave rectifier uses both halves of each cycle, so the output repeats twice per cycle: 2 × 50 = 100 Hz."
    mistakes: {"50": "p12_full_wave", "25": "p12_full_wave"}
  - prompt: A half-wave rectifier runs on 50 Hz AC. Find the output frequency (Hz).
    answer: '50'
    check: '50'
    difficulty: 1
    hints:
    - Same as input.
    - One pulse per cycle.
    solution: "A half-wave rectifier passes one half of each cycle, so the output repeats once per cycle: 50 Hz."
    mistakes: {"100": "p12_half_wave", "25": "p12_half_wave"}
  - prompt: The barrier potential of a silicon diode is about how many volts? Give one decimal place.
    answer: '0.7'
    check: Rational(7,10)
    difficulty: 1
    hints:
    - Silicon.
    - Germanium is 0.3.
