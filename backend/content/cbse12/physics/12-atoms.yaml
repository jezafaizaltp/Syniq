# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 12. Format: content/README.md.
subject: cbse12-phy
chapter: 12
title: Atoms
tips:
  c12p_bohr: Bohr hydrogen energy Eₙ = −13.6/n² eV. A jump from higher to lower n releases a photon with the energy difference.
  c12p_series: Lyman series ends on n = 1 (ultraviolet); Balmer on n = 2 (visible); Paschen on n = 3 (infrared).
  p12_angular_momentum: "Bohr quantised L = nh/2π."
  p12_bohr_energy: "Eₙ = −13.6/n² eV."
  p12_bohr_radius: "rₙ = n² a₀."
  p12_closest_approach: "At this point all the α particle's KE has become potential energy."
  p12_empty_space: "Most α particles met nothing at all. What does that say about the atom?"
  p12_gold_foil: "The metal can be beaten into sheets only a few atoms thick."
  p12_ionisation: "To free the electron you raise it from n = 1 to n = ∞ (energy 0)."
  p12_nucleus: "Only a very few bounced back, so whatever repelled them was tiny, heavy and positive."
  p12_rutherford_weak: "Classical physics says an accelerating charge radiates. Orbiting means accelerating."
  p12_size_ratio: "Divide the sizes: 10⁻¹⁰ ÷ 10⁻¹⁵. Subtract the powers."
  p12_transition: "Photon energy = E_upper − E_lower = (−3.4) − (−13.6)."
concepts:
- code: cbse12p.atoms.rutherford
  title: Rutherford's model
  notes: |
    Thomson's model. Geiger–Marsden α-particle scattering: most pass straight, a few deflected through large angles (about 1
    in 8000 bounce back) → tiny dense positive nucleus (about 10⁻¹⁵ m vs atom 10⁻¹⁰ m). Distance of closest approach;
    impact parameter. Limitations: classical orbiting electron would radiate and spiral in; can't explain line spectra.
  explanations:
    text: Rutherford fired α particles at thin gold foil. Most went straight through, but a few bounced back. He concluded that the atom is mostly empty space with a tiny, heavy, positive nucleus at the centre.
    visual: 'Picture a cricket stadium as an atom: the nucleus would be a small marble at the centre, with electrons far out in the stands.'
    step_by_step: 'Step 1: Most α particles pass through → mostly empty space. Step 2: Few large deflections → tiny, dense, positive nucleus. Step 3: Atom size ~10⁻¹⁰ m, nucleus ~10⁻¹⁵ m.'
    real_world: Rutherford's discovery opened the way to nuclear power and medical isotopes.
  picture:
    kind: flow
    steps:
    - α particles fired at gold foil
    - Most pass straight through
    - A few deflected strongly
    - A tiny dense positive nucleus
    alt: Rutherford's gold-foil experiment and what it showed.
  activity:
    type: sort
    prompt: Geiger and Marsden fired α-particles at gold foil. What does each result tell us?
    bins:
    - Most of the atom is empty
    - A tiny, dense, positive nucleus
    - A problem with the model
    items:
    - label: Most α-particles pass straight through
      bin: Most of the atom is empty
      clue: If most go through without bending, what must they be passing through?
      why: 'Nothing much is in their way: the atom is mostly empty space.'
    - label: The foil barely slows most of them
      bin: Most of the atom is empty
      clue: What does that say about what they meet?
      why: 'Little in their path: mostly empty space.'
    - label: A few are bent through large angles
      bin: A tiny, dense, positive nucleus
      clue: What could bend a fast α-particle sharply?
      why: A strong repulsion from concentrated positive charge.
    - label: About 1 in 8000 bounces straight back
      bin: A tiny, dense, positive nucleus
      clue: Why so rare, and why so violent?
      why: Only a direct hit on a tiny, heavy nucleus can turn it right round.
    - label: Large bends need a force very close up
      bin: A tiny, dense, positive nucleus
      clue: What size must the charge's home be?
      why: The charge must be packed into about 10⁻¹⁵ m.
    - label: An orbiting electron should radiate and spiral in
      bin: A problem with the model
      clue: Accelerating charges radiate. What would that do to the orbit?
      why: 'Classically the atom would collapse: Rutherford''s model can''t explain stability.'
    - label: It predicts a continuous spectrum, not lines
      bin: A problem with the model
      clue: Hydrogen shows sharp lines. Does the model explain them?
      why: 'A spiralling electron would give all frequencies: Bohr''s model was needed.'
  items:
  - prompt: An atom is about 10⁻¹⁰ m across and its nucleus 10⁻¹⁵ m. How many times larger is the atom? Give the power of 10.
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - 10⁻¹⁰/10⁻¹⁵.
    - 10⁵.
    solution: 10⁵ times (power 5).
    mistakes: {"25": "p12_size_ratio", "-5": "p12_size_ratio"}
  - prompt: 'Most α particles passed straight through the gold foil because:'
    options:
    - the atom is mostly empty space
    - gold is soft
    - α particles have no charge
    - the foil was too thin to matter
    answer: the atom is mostly empty space
    difficulty: 1
    hints:
    - Nothing in the way.
    - Tiny nucleus.
    solution: The atom is mostly empty space.
    mistakes: {"gold is soft": "p12_empty_space", "α particles have no charge": "p12_empty_space", "the foil was too thin to matter": "p12_empty_space"}
  - prompt: 'Large-angle scattering showed that the nucleus is:'
    options:
    - small, dense and positive
    - large and negative
    - evenly spread
    - neutral
    answer: small, dense and positive
    difficulty: 1
    hints:
    - Repels α particles.
    - Concentrated.
    solution: Small, dense and positive.
    mistakes: {"large and negative": "p12_nucleus", "evenly spread": "p12_nucleus", "neutral": "p12_nucleus"}
  - prompt: 'A weakness of Rutherford''s model was that:'
    options:
    - orbiting electrons should radiate energy and spiral in
    - it had no nucleus
    - it explained spectra too well
    - electrons were inside the nucleus
    answer: orbiting electrons should radiate energy and spiral in
    difficulty: 2
    hints:
    - Accelerating charge radiates.
    - Atoms would collapse.
    solution: Orbiting electrons should lose energy and fall in.
    mistakes: {"it had no nucleus": "p12_rutherford_weak", "it explained spectra too well": "p12_rutherford_weak", "electrons were inside the nucleus": "p12_rutherford_weak"}
  - prompt: Rutherford's experiment used which metal foil?
    options:
    - gold
    - silver
    - copper
    - aluminium
    answer: gold
    difficulty: 1
    hints:
    - Very thin sheets.
    - Malleable.
    solution: Gold.
    mistakes: {"silver": "p12_gold_foil", "copper": "p12_gold_foil", "aluminium": "p12_gold_foil"}
  - prompt: 'The minimum distance an α particle reaches from the nucleus is the:'
    options:
    - distance of closest approach
    - impact parameter
    - wavelength
    - Bohr radius
    answer: distance of closest approach
    difficulty: 2
    hints:
    - Head-on collision.
    - KE = PE.
    solution: Distance of closest approach.
    mistakes: {"impact parameter": "p12_closest_approach", "wavelength": "p12_closest_approach", "Bohr radius": "p12_closest_approach"}
- code: cbse12p.atoms.bohr
  title: Bohr model and hydrogen spectrum
  after:
  - cbse12p.atoms.rutherford
  notes: |
    Bohr's postulates: stationary orbits, angular momentum mvr = nh/2π, radiation only in jumps hν = Eᵢ − E_f. Radius rₙ = n²a₀
    (a₀ = 0.53 Å); energy Eₙ = −13.6/n² eV; ionisation energy 13.6 eV. Line spectra: Lyman (to n = 1, UV), Balmer (to n = 2,
    visible), Paschen (to n = 3, IR), Brackett, Pfund; 1/λ = R(1/n_f² − 1/n_i²). de Broglie explanation: orbit holds whole
    number of wavelengths. Limitations (only hydrogen-like atoms).
  explanations:
    text: Bohr proposed that electrons orbit only in certain allowed levels. Jumping down from a higher level to a lower one releases a photon whose energy equals the difference. This explains the sharp lines in hydrogen's spectrum.
    visual: 'Draw energy levels like a ladder with rungs closer together near the top: n = 1 at −13.6 eV, n = 2 at −3.4 eV, n = 3 at −1.51 eV. An arrow from n = 3 to n = 2 is a red Balmer line.'
    step_by_step: 'Step 1: Eₙ = −13.6/n² eV. Step 2: Photon energy = E_upper − E_lower. Step 3: Name the series from the lower level. Step 4: λ = hc/E.'
    real_world: Astronomers identify hydrogen in distant stars by the exact colours of its spectral lines.
  picture:
    kind: compare
    columns:
    - title: Series
      points:
      - Lyman
      - Balmer
      - Paschen
    - title: Ends on
      points:
      - n = 1
      - n = 2
      - n = 3
    - title: Region
      points:
      - ultraviolet
      - visible
      - infrared
    alt: Hydrogen spectral series, the level each ends on, and the region of the spectrum.
  activity:
    type: formula
    prompt: 'Bohr''s hydrogen atom: radius rₙ = 0.53 n² Å, energy Eₙ = −13.6 ÷ n² eV.'
    inputs:
    - name: n
      label: Orbit n
      min: 1
      max: 10
      step: 1
      start: 5
    outputs:
    - name: r
      label: Radius
      expr: 0.53*n^2
      unit: Å
      places: 2
    - name: en
      label: Energy
      expr: -13.6/n^2
      unit: eV
      places: 2
    - name: ion
      label: Energy to ionise from here
      expr: 13.6/n^2
      unit: eV
      places: 2
    goals:
    - prompt: Find the orbit with radius 4.77 Å.
      want:
        n: 3
      mistakes:
      - when:
          n: 9
        say: 'r grows as n²: n = 9 gives 42.9 Å. 4.77 ÷ 0.53 = 9 = n², so n = 3.'
    - prompt: Find the orbit from which 3.4 eV ionises the atom.
      want:
        ion: 3.4
      mistakes:
      - when:
          n: 4
        say: 'n = 4 needs only 0.85 eV: E ∝ 1/n². 13.6 ÷ 3.4 = 4 = n², so n = 2.'
    - prompt: Find the orbit where the electron is most tightly held.
      want:
        n: 1
      mistakes:
      - when:
          n: 10
        say: Energy −0.136 eV is almost free. The most negative energy is the innermost orbit.
  items:
  - prompt: Find the energy (eV) of hydrogen's n = 2 level.
    answer: '-3.4'
    check: Rational(-136,10)/4
    difficulty: 1
    hints:
    - −13.6/4.
    - −3.4.
    solution: −3.4 eV.
    mistakes: {"-6.8": "p12_bohr_energy", "3.4": "p12_bohr_energy"}
  - prompt: Find the photon energy (eV) for a jump from n = 2 to n = 1.
    answer: '10.2'
    check: Rational(-136,10)/4 - Rational(-136,10)
    difficulty: 2
    hints:
    - −3.4 − (−13.6).
    - 10.2.
    solution: 10.2 eV.
    mistakes: {"3.4": "p12_transition", "13.6": "p12_transition", "-10.2": "p12_transition"}
  - prompt: How much energy (eV) is needed to ionise hydrogen from its ground state?
    answer: '13.6'
    check: Rational(136,10)
    difficulty: 1
    hints:
    - From −13.6 to 0.
    - 13.6.
    solution: 13.6 eV.
    mistakes: {"-13.6": "p12_ionisation", "3.4": "p12_ionisation"}
  - prompt: If a₀ = 0.53 Å, find the radius (Å) of the n = 3 orbit, to two decimals.
    answer: '4.77'
    check: 9*Rational(53,100)
    difficulty: 2
    hints:
    - n²a₀.
    - 9 × 0.53.
    solution: 4.77 Å.
    mistakes: {"1.59": "p12_bohr_radius", "0.53": "p12_bohr_radius"}
  - prompt: 'Visible lines of hydrogen belong to the:'
    options:
    - Balmer series
    - Lyman series
    - Paschen series
    - Pfund series
    answer: Balmer series
    difficulty: 1
    hints:
    - Ends on n = 2.
    - Red, blue-green, violet.
    solution: The Balmer series.
    mistakes:
      Lyman series: c12p_series
  - prompt: 'In Bohr''s model, an electron''s angular momentum is:'
    options:
    - a whole multiple of h/2π
    - zero
    - any value
    - always h
    answer: a whole multiple of h/2π
    difficulty: 2
    hints:
    - Quantised.
    - mvr = nh/2π.
    solution: nh/2π.
    mistakes: {"zero": "p12_angular_momentum", "any value": "p12_angular_momentum", "always h": "p12_angular_momentum"}
