# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 12. Format: content/README.md.
subject: cbse12-phy
chapter: 12
title: Atoms
tips:
  c12p_bohr: Bohr hydrogen energy Eₙ = −13.6/n² eV. A jump from higher to lower n releases a photon with the energy difference.
  c12p_series: Lyman series ends on n = 1 (ultraviolet); Balmer on n = 2 (visible); Paschen on n = 3 (infrared).
  p12_angular_momentum: "Bohr quantised L = nh/2π."
  p12_bohr_energy: "Eₙ = −13.6/n² eV."
  p12_bohr_radius: "rₙ = n² a₀."
  p12_closest_approach: "At this point all the α particle's KE has become potential energy."
  p12_empty_space: "Most α particles met nothing at all. What does that say about the atom?"
  p12_gold_foil: "The metal can be beaten into sheets only a few atoms thick."
  p12_ionisation: "To free the electron you raise it from n = 1 to n = ∞ (energy 0)."
  p12_nucleus: "Only a very few bounced back, so whatever repelled them was tiny, heavy and positive."
  p12_rutherford_weak: "Classical physics says an accelerating charge radiates. Orbiting means accelerating."
  p12_size_ratio: "Divide the sizes: 10⁻¹⁰ ÷ 10⁻¹⁵. Subtract the powers."
  p12_transition: "Photon energy = E_upper − E_lower = (−3.4) − (−13.6)."
  c12p12_ruth: "Link each observation to its meaning: most go straight, a few bounce back. What charge must the centre carry to push alpha particles back?"
  c12p12_bohr: Eₙ = −13.6/n² eV and rₙ = n² × 0.53 Å. Photon energy = difference between the two levels.
  c12p12_series: 'Series by lower level: Lyman n = 1 (UV), Balmer n = 2 (visible), Paschen n = 3 (IR).'
concepts:
- code: cbse12p.atoms.rutherford
  title: Rutherford's model
  notes: |
    Thomson's model. Geiger–Marsden α-particle scattering: most pass straight, a few deflected through large angles (about 1
    in 8000 bounce back) → tiny dense positive nucleus (about 10⁻¹⁵ m vs atom 10⁻¹⁰ m). Distance of closest approach;
    impact parameter. Limitations: classical orbiting electron would radiate and spiral in; can't explain line spectra.
  explanations:
    text: Rutherford fired α particles at thin gold foil. Most went straight through, but a few bounced back. He concluded that the atom is mostly empty space with a tiny, heavy, positive nucleus at the centre.
    visual: 'Picture a cricket stadium as an atom: the nucleus would be a small marble at the centre, with electrons far out in the stands.'
    step_by_step: 'Step 1: Most α particles pass through → mostly empty space. Step 2: Few large deflections → tiny, dense, positive nucleus. Step 3: Atom size ~10⁻¹⁰ m, nucleus ~10⁻¹⁵ m.'
    real_world: Rutherford's discovery opened the way to nuclear power and medical isotopes.
  picture:
    kind: flow
    steps:
    - α particles fired at gold foil
    - Most pass straight through
    - A few deflected strongly
    - A tiny dense positive nucleus
    alt: Rutherford's gold-foil experiment and what it showed.
  activity:
    type: sort
    prompt: Geiger and Marsden fired α-particles at gold foil. What does each result tell us?
    bins:
    - Most of the atom is empty
    - A tiny, dense, positive nucleus
    - A problem with the model
    items:
    - label: Most α-particles pass straight through
      bin: Most of the atom is empty
      clue: If most go through without bending, what must they be passing through?
      why: 'Nothing much is in their way: the atom is mostly empty space.'
    - label: The foil barely slows most of them
      bin: Most of the atom is empty
      clue: What does that say about what they meet?
      why: 'Little in their path: mostly empty space.'
    - label: A few are bent through large angles
      bin: A tiny, dense, positive nucleus
      clue: What could bend a fast α-particle sharply?
      why: A strong repulsion from concentrated positive charge.
    - label: About 1 in 8000 bounces straight back
      bin: A tiny, dense, positive nucleus
      clue: Why so rare, and why so violent?
      why: Only a direct hit on a tiny, heavy nucleus can turn it right round.
    - label: Large bends need a force very close up
      bin: A tiny, dense, positive nucleus
      clue: What size must the charge's home be?
      why: The charge must be packed into about 10⁻¹⁵ m.
    - label: An orbiting electron should radiate and spiral in
      bin: A problem with the model
      clue: Accelerating charges radiate. What would that do to the orbit?
      why: 'Classically the atom would collapse: Rutherford''s model can''t explain stability.'
    - label: It predicts a continuous spectrum, not lines
      bin: A problem with the model
      clue: Hydrogen shows sharp lines. Does the model explain them?
      why: 'A spiralling electron would give all frequencies: Bohr''s model was needed.'
  lesson:
    - teach: Thomson pictured the atom as a positive sphere with electrons embedded in it. Geiger and Marsden, guided by Rutherford, fired α-particles at thin gold foil to test this.
      check:
        prompt: What did Geiger and Marsden fire at the gold foil?
        options:
        - α-particles
        - electrons
        - light
        answer: α-particles
        why: Heavy, positive α-particles probe the atom's charge.
    - teach: 'Most α-particles went straight through; a few were deflected through large angles, and about 1 in 8000 bounced back. Conclusion: the atom is mostly empty, with a tiny, dense, positive nucleus (about 10⁻¹⁵ m) inside an atom about 10⁻¹⁰ m across.'
      picture:
        kind: compare
        columns:
        - title: Observation
          points:
          - most pass straight
          - a few deflect a lot
          - about 1 in 8000 bounce back
        - title: Meaning
          points:
          - mostly empty space
          - strong positive centre
          - tiny, dense nucleus
        alt: Results of the gold foil experiment and what each shows.
      check:
        prompt: Why did a few α-particles bounce back?
        options:
        - they came close to a tiny, dense positive nucleus
        - they hit electrons
        - the foil was too thick
        answer: they came close to a tiny, dense positive nucleus
        why: Only a concentrated positive charge could push them back.
    - teach: 'The distance of closest approach is where all of an α-particle''s kinetic energy turns into electrical potential energy. Rutherford''s model had a flaw: an orbiting electron accelerates, so by classical physics it should radiate, lose energy and spiral into the nucleus; nor could it explain line spectra.'
      check:
        prompt: 'Rutherford''s model could not explain:'
        options:
        - the stability of atoms and line spectra
        - the existence of the nucleus
        - the positive charge
        answer: the stability of atoms and line spectra
        why: Classical orbits would collapse and give continuous spectra.
  items:
  - prompt: An atom is about 10⁻¹⁰ m across and its nucleus 10⁻¹⁵ m. How many times larger is the atom? Give the power of 10.
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - 10⁻¹⁰/10⁻¹⁵.
    - 10⁵.
    solution: 10⁵ times (power 5).
    mistakes: {"25": "p12_size_ratio", "-5": "p12_size_ratio"}
  - prompt: 'Most α particles passed straight through the gold foil because:'
    options:
    - the atom is mostly empty space
    - gold is soft
    - α particles have no charge
    - the foil was too thin to matter
    answer: the atom is mostly empty space
    difficulty: 1
    hints:
    - Nothing in the way.
    - Tiny nucleus.
    solution: The atom is mostly empty space.
    mistakes: {"gold is soft": "p12_empty_space", "α particles have no charge": "p12_empty_space", "the foil was too thin to matter": "p12_empty_space"}
  - prompt: 'Large-angle scattering showed that the nucleus is:'
    options:
    - small, dense and positive
    - large and negative
    - evenly spread
    - neutral
    answer: small, dense and positive
    difficulty: 1
    hints:
    - Repels α particles.
    - Concentrated.
    solution: Small, dense and positive.
    mistakes: {"large and negative": "p12_nucleus", "evenly spread": "p12_nucleus", "neutral": "p12_nucleus"}
  - prompt: 'A weakness of Rutherford''s model was that:'
    options:
    - orbiting electrons should radiate energy and spiral in
    - it had no nucleus
    - it explained spectra too well
    - electrons were inside the nucleus
    answer: orbiting electrons should radiate energy and spiral in
    difficulty: 2
    hints:
    - Accelerating charge radiates.
    - Atoms would collapse.
    solution: Orbiting electrons should lose energy and fall in.
    mistakes: {"it had no nucleus": "p12_rutherford_weak", "it explained spectra too well": "p12_rutherford_weak", "electrons were inside the nucleus": "p12_rutherford_weak"}
  - prompt: Rutherford's experiment used which metal foil?
    options:
    - gold
    - silver
    - copper
    - aluminium
    answer: gold
    difficulty: 1
    hints:
    - Very thin sheets.
    - Malleable.
    solution: Gold.
    mistakes: {"silver": "p12_gold_foil", "copper": "p12_gold_foil", "aluminium": "p12_gold_foil"}
  - prompt: 'The minimum distance an α particle reaches from the nucleus is the:'
    options:
    - distance of closest approach
    - impact parameter
    - wavelength
    - Bohr radius
    answer: distance of closest approach
    difficulty: 2
    hints:
    - Head-on collision.
    - KE = PE.
    solution: Distance of closest approach.
    mistakes: {"impact parameter": "p12_closest_approach", "wavelength": "p12_closest_approach", "Bohr radius": "p12_closest_approach"}
  - prompt: About 1 in how many α-particles bounced back?
    answer: '8000'
    check: '8000'
    difficulty: 1
    hints:
    - It was a very small fraction.
    - Thousands went through for each one.
    solution: 'Step 1: very rare. Step 2: about 1 in 8000.'
    mistakes:
      '80': c12p12_ruth
      '800': c12p12_ruth
  - prompt: 'Thomson''s model of the atom is often compared to:'
    options:
    - a plum pudding
    - a solar system
    - an empty box
    answer: a plum pudding
    difficulty: 1
    hints:
    - Electrons are dotted in a positive sphere.
    - Like fruit in a pudding.
    solution: 'Step 1: positive sphere with embedded electrons. Step 2: plum pudding.'
    mistakes:
      a solar system: c12p12_ruth
      an empty box: c12p12_ruth
  - prompt: The nucleus carries which charge?
    options:
    - positive
    - negative
    - none
    answer: positive
    difficulty: 1
    hints:
    - Think about what it did to the α-particles, and their charge.
    - Like charges repel.
    solution: 'Step 1: α is positive. Step 2: nucleus is positive.'
    mistakes:
      negative: c12p12_ruth
      none: c12p12_ruth
  - prompt: If a nucleus were 1 cm across, how many metres across would the atom be (ratio 10⁵)?
    answer: '1000'
    check: 10**5/100
    difficulty: 2
    hints:
    - 1 cm × 10⁵.
    - Convert cm to m.
    solution: 'Step 1: 10⁵ cm. Step 2: 1000 m.'
    mistakes:
      '100000': c12p12_ruth
      '100': c12p12_ruth
  - prompt: 'At the distance of closest approach, the α-particle''s kinetic energy is:'
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - It momentarily stops.
    - All energy is now potential.
    solution: 'Step 1: it stops before turning back. Step 2: K = 0.'
    mistakes:
      '1': c12p12_ruth
      '-1': c12p12_ruth
  - prompt: Why was very thin gold foil used?
    options:
    - so most α-particles meet only one nucleus at a time
    - gold is cheap
    - to stop all α-particles
    answer: so most α-particles meet only one nucleus at a time
    difficulty: 2
    hints:
    - Thicker foil causes many small deflections.
    - Gold can be beaten very thin.
    solution: 'Step 1: thin foil limits multiple scattering. Step 2: single encounters are clear.'
    mistakes:
      gold is cheap: c12p12_ruth
      to stop all α-particles: c12p12_ruth
  - prompt: 'Doubling the α-particle''s kinetic energy makes the distance of closest approach:'
    options:
    - half
    - double
    - unchanged
    answer: half
    difficulty: 2
    hints:
    - K = kZe(2e)/r₀.
    - r₀ ∝ 1/K.
    solution: 'Step 1: more energy, closer approach. Step 2: r₀ halves.'
    mistakes:
      double: c12p12_ruth
      unchanged: c12p12_ruth
  - prompt: 'The impact parameter is large for an α-particle. Its deflection is:'
    options:
    - small
    - large
    - always 180°
    answer: small
    difficulty: 3
    hints:
    - Impact parameter is the sideways miss distance.
    - Far from the nucleus, the push is weak.
    solution: 'Step 1: large miss distance. Step 2: small deflection.'
    mistakes:
      large: c12p12_ruth
      always 180°: c12p12_ruth
  - prompt: Which α-particles bounce straight back (180°)?
    options:
    - those heading straight at the nucleus (impact parameter zero)
    - those passing far away
    - all of them
    answer: those heading straight at the nucleus (impact parameter zero)
    difficulty: 3
    hints:
    - Think of a head-on collision.
    - Zero sideways offset.
    solution: 'Step 1: head-on approach. Step 2: reverses direction.'
    mistakes:
      those passing far away: c12p12_ruth
      all of them: c12p12_ruth
- code: cbse12p.atoms.bohr
  title: Bohr model and hydrogen spectrum
  after:
  - cbse12p.atoms.rutherford
  notes: |
    Bohr's postulates: stationary orbits, angular momentum mvr = nh/2π, radiation only in jumps hν = Eᵢ − E_f. Radius rₙ = n²a₀
    (a₀ = 0.53 Å); energy Eₙ = −13.6/n² eV; ionisation energy 13.6 eV. Line spectra: Lyman (to n = 1, UV), Balmer (to n = 2,
    visible), Paschen (to n = 3, IR), Brackett, Pfund; 1/λ = R(1/n_f² − 1/n_i²). de Broglie explanation: orbit holds whole
    number of wavelengths. Limitations (only hydrogen-like atoms).
  explanations:
    text: Bohr proposed that electrons orbit only in certain allowed levels. Jumping down from a higher level to a lower one releases a photon whose energy equals the difference. This explains the sharp lines in hydrogen's spectrum.
    visual: 'Draw energy levels like a ladder with rungs closer together near the top: n = 1 at −13.6 eV, n = 2 at −3.4 eV, n = 3 at −1.51 eV. An arrow from n = 3 to n = 2 is a red Balmer line.'
    step_by_step: 'Step 1: Eₙ = −13.6/n² eV. Step 2: Photon energy = E_upper − E_lower. Step 3: Name the series from the lower level. Step 4: λ = hc/E.'
    real_world: Astronomers identify hydrogen in distant stars by the exact colours of its spectral lines.
  picture:
    kind: compare
    columns:
    - title: Series
      points:
      - Lyman
      - Balmer
      - Paschen
    - title: Ends on
      points:
      - n = 1
      - n = 2
      - n = 3
    - title: Region
      points:
      - ultraviolet
      - visible
      - infrared
    alt: Hydrogen spectral series, the level each ends on, and the region of the spectrum.
  activity:
    type: formula
    prompt: 'Bohr''s hydrogen atom: radius rₙ = 0.53 n² Å, energy Eₙ = −13.6 ÷ n² eV.'
    inputs:
    - name: n
      label: Orbit n
      min: 1
      max: 10
      step: 1
      start: 5
    outputs:
    - name: r
      label: Radius
      expr: 0.53*n^2
      unit: Å
      places: 2
    - name: en
      label: Energy
      expr: -13.6/n^2
      unit: eV
      places: 2
    - name: ion
      label: Energy to ionise from here
      expr: 13.6/n^2
      unit: eV
      places: 2
    goals:
    - prompt: Find the orbit with radius 4.77 Å.
      want:
        n: 3
      mistakes:
      - when:
          n: 9
        say: 'r grows as n²: n = 9 gives 42.9 Å. 4.77 ÷ 0.53 = 9 = n², so n = 3.'
    - prompt: Find the orbit from which 3.4 eV ionises the atom.
      want:
        ion: 3.4
      mistakes:
      - when:
          n: 4
        say: 'n = 4 needs only 0.85 eV: E ∝ 1/n². 13.6 ÷ 3.4 = 4 = n², so n = 2.'
    - prompt: Find the orbit where the electron is most tightly held.
      want:
        n: 1
      mistakes:
      - when:
          n: 10
        say: Energy −0.136 eV is almost free. The most negative energy is the innermost orbit.
  lesson:
    - teach: 'Bohr''s postulates: electrons move only in certain stationary orbits without radiating; in these, angular momentum mvr = nh/2π; light is emitted or absorbed only when an electron jumps between orbits: hν = Eᵢ − E_f.'
      check:
        prompt: 'In Bohr''s model, an electron radiates when it:'
        options:
        - jumps between orbits
        - stays in an orbit
        - moves faster in its orbit
        answer: jumps between orbits
        why: Stationary orbits do not radiate.
    - teach: 'For hydrogen: rₙ = n² × 0.53 Å and Eₙ = −13.6/n² eV. Ground state −13.6 eV; ionisation energy 13.6 eV. Higher n means a bigger orbit and less tightly bound electron.'
      picture:
        kind: bars
        bars:
        - label: n=1
          value: 13.6
        - label: n=2
          value: 3.4
        - label: n=3
          value: 1.51
        - label: n=4
          value: 0.85
        alt: 'Binding energy of hydrogen''s levels: 13.6, 3.4, 1.51 and 0.85 eV for n = 1 to 4.'
      check:
        prompt: Radius of hydrogen's n = 2 orbit in units of a₀?
        options:
        - '4'
        - '2'
        - 1/4
        answer: '4'
        why: rₙ = n²a₀.
    - teach: 'Line spectra: jumps ending on n = 1 give the Lyman series (UV), on n = 2 Balmer (visible), on n = 3 Paschen (IR). 1/λ = R(1/n_f² − 1/n_i²). Bohr''s model works for hydrogen-like atoms only.'
      check:
        prompt: A jump from n = 4 to n = 2 belongs to which series?
        options:
        - Balmer
        - Lyman
        - Paschen
        answer: Balmer
        why: It ends on n = 2.
  items:
  - prompt: Find the energy (eV) of hydrogen's n = 2 level.
    answer: '-3.4'
    check: Rational(-136,10)/4
    difficulty: 1
    hints:
    - −13.6/4.
    - −3.4.
    solution: −3.4 eV.
    mistakes: {"-6.8": "p12_bohr_energy", "3.4": "p12_bohr_energy"}
  - prompt: Find the photon energy (eV) for a jump from n = 2 to n = 1.
    answer: '10.2'
    check: Rational(-136,10)/4 - Rational(-136,10)
    difficulty: 2
    hints:
    - −3.4 − (−13.6).
    - 10.2.
    solution: 10.2 eV.
    mistakes: {"3.4": "p12_transition", "13.6": "p12_transition", "-10.2": "p12_transition"}
  - prompt: How much energy (eV) is needed to ionise hydrogen from its ground state?
    answer: '13.6'
    check: Rational(136,10)
    difficulty: 1
    hints:
    - From −13.6 to 0.
    - 13.6.
    solution: 13.6 eV.
    mistakes: {"-13.6": "p12_ionisation", "3.4": "p12_ionisation"}
  - prompt: If a₀ = 0.53 Å, find the radius (Å) of the n = 3 orbit, to two decimals.
    answer: '4.77'
    check: 9*Rational(53,100)
    difficulty: 2
    hints:
    - n²a₀.
    - 9 × 0.53.
    solution: 4.77 Å.
    mistakes: {"1.59": "p12_bohr_radius", "0.53": "p12_bohr_radius"}
  - prompt: 'Visible lines of hydrogen belong to the:'
    options:
    - Balmer series
    - Lyman series
    - Paschen series
    - Pfund series
    answer: Balmer series
    difficulty: 1
    hints:
    - Ends on n = 2.
    - Red, blue-green, violet.
    solution: The Balmer series.
    mistakes:
      Lyman series: c12p_series
  - prompt: 'In Bohr''s model, an electron''s angular momentum is:'
    options:
    - a whole multiple of h/2π
    - zero
    - any value
    - always h
    answer: a whole multiple of h/2π
    difficulty: 2
    hints:
    - Quantised.
    - mvr = nh/2π.
    solution: nh/2π.
    mistakes: {"zero": "p12_angular_momentum", "any value": "p12_angular_momentum", "always h": "p12_angular_momentum"}
  - prompt: Energy (eV) of hydrogen's n = 4 level, as a fraction?
    answer: -17/20
    check: Rational(-136,10)/16
    difficulty: 1
    hints:
    - Eₙ = −13.6/n².
    - −13.6/16.
    solution: 'Step 1: −0.85 eV. Step 2: −17/20.'
    mistakes:
      -17/5: c12p12_bohr
      17/20: c12p12_bohr
  - prompt: Radius of the n = 2 orbit (Å) if a₀ = 0.53 Å?
    options:
    - '2.12'
    - '1.06'
    - '0.53'
    answer: '2.12'
    difficulty: 1
    hints:
    - rₙ = n²a₀.
    - 4 × 0.53.
    solution: 'Step 1: 4 × 0.53. Step 2: 2.12 Å.'
    mistakes:
      '1.06': c12p12_bohr
      '0.53': c12p12_bohr
  - prompt: Photon energy (eV) for a jump from n = 3 to n = 2, given E₃ = −1.51 eV and E₂ = −3.4 eV, as a fraction?
    answer: 189/100
    check: Rational(-151,100) - Rational(-34,10)
    difficulty: 1
    hints:
    - hν = Eᵢ − E_f.
    - −1.51 − (−3.4).
    solution: 'Step 1: 1.89 eV. Step 2: 189/100.'
    mistakes:
      491/100: c12p12_bohr
      151/100: c12p12_bohr
  - prompt: Energy (eV) to ionise hydrogen from n = 2, as a fraction?
    answer: 17/5
    check: Rational(136,10)/4
    difficulty: 2
    hints:
    - Bring it from E₂ to 0.
    - 13.6/4.
    solution: 'Step 1: 3.4 eV. Step 2: 17/5.'
    mistakes:
      68/5: c12p12_bohr
      34/5: c12p12_bohr
  - prompt: Electron's angular momentum in the n = 3 orbit equals how many times h/2π?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - mvr = nh/2π.
    - n = 3.
    solution: 'Step 1: n = 3. Step 2: 3h/2π.'
    mistakes:
      '9': c12p12_bohr
      '1': c12p12_bohr
  - prompt: 'Lines of the Paschen series lie in the:'
    options:
    - infrared
    - ultraviolet
    - visible
    answer: infrared
    difficulty: 2
    hints:
    - They end on n = 3.
    - Small energy gaps, long wavelengths.
    solution: 'Step 1: small jumps to n = 3. Step 2: infrared.'
    mistakes:
      ultraviolet: c12p12_series
      visible: c12p12_series
  - prompt: Which jump gives the shortest-wavelength line among these?
    options:
    - n = 2 to n = 1
    - n = 3 to n = 2
    - n = 4 to n = 3
    answer: n = 2 to n = 1
    difficulty: 2
    hints:
    - Shortest λ means largest energy.
    - Gaps are biggest near n = 1.
    solution: 'Step 1: 10.2 eV vs 1.89 vs 0.66. Step 2: n = 2 → 1.'
    mistakes:
      n = 3 to n = 2: c12p12_series
      n = 4 to n = 3: c12p12_series
  - prompt: How many different spectral lines can hydrogen atoms emit falling from n = 4 down to n = 1 (all routes)?
    answer: '6'
    check: 4*3/2
    difficulty: 3
    hints:
    - Count all pairs of levels among 4 levels.
    - n(n − 1)/2.
    solution: 'Step 1: 4 × 3/2. Step 2: 6 lines.'
    mistakes:
      '3': c12p12_series
      '4': c12p12_series
  - prompt: In de Broglie's picture, the n = 3 Bohr orbit's circumference holds how many electron wavelengths?
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - 2πr = nλ.
    - n = 3.
    solution: 'Step 1: a standing wave fits n wavelengths. Step 2: 3.'
    mistakes:
      '9': c12p12_bohr
      '6': c12p12_bohr
