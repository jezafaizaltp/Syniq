# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 11. Format: content/README.md.
subject: cbse12-phy
chapter: 11
title: Dual Nature of Radiation and Matter
tips:
  c12p_photo: 'Photoelectric equation: K_max = hν − φ. Below the threshold frequency no electrons come out, however bright the light.'
  c12p_debroglie: 'de Broglie wavelength λ = h/p = h/(mv): heavier or faster particles have shorter wavelengths.'
concepts:
- code: cbse12p.dual.photoelectric
  title: Photoelectric effect
  notes: |
    Electron emission: thermionic, field, photoelectric. Hertz, Hallwachs, Lenard observations. Photoelectric effect: emission
    only above threshold frequency ν₀ (depends on metal); photocurrent ∝ intensity; maximum kinetic energy depends on frequency
    not intensity; stopping potential eV₀ = K_max; instantaneous. Wave theory fails. Einstein: light as photons E = hν;
    K_max = hν − φ₀, φ₀ = hν₀ (work function). Photon momentum p = h/λ. h = 6.63 × 10⁻³⁴ J s; 1 eV = 1.6 × 10⁻¹⁹ J.
  explanations:
    text: 'Light shining on a metal can knock electrons out, but only if its frequency is high enough, however bright it is. Einstein explained this: light comes in packets called photons, each with energy hν. A photon must have at least the work function''s energy to free an electron.'
    visual: Picture photons as balls thrown at a wall of electrons. Weak throws (low frequency) never knock any out, no matter how many you throw. A strong enough single throw knocks one out, and any extra energy becomes its speed.
    step_by_step: 'Step 1: Photon energy E = hν (or hc/λ). Step 2: Compare with the work function φ. Step 3: K_max = E − φ. Step 4: Stopping potential V₀ = K_max/e.'
    real_world: Solar panels and automatic doors with light sensors rely on light freeing electrons.
  picture:
    kind: flow
    steps:
    - Photon of energy hν hits metal
    - Uses φ to free an electron
    - Leftover energy = K_max
    - K_max = hν − φ
    alt: 'Einstein''s photoelectric equation: photon energy minus work function gives the electron''s maximum kinetic energy.'
  items:
  - prompt: Photons of 5 eV hit a metal with work function 2 eV. Find K_max (eV).
    answer: '3'
    check: 5-2
    difficulty: 1
    hints:
    - hν − φ.
    - 5 − 2.
    solution: 3 eV.
  - prompt: In the same case, find the stopping potential (V).
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - eV₀ = K_max.
    - 3 eV → 3 V.
    solution: 3 V.
  - prompt: A metal has work function 4 eV. Light of 3 eV falls on it. How many electrons are emitted?
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - Below threshold.
    - 3 < 4.
    solution: None.
    mistakes:
      '1': c12p_photo
  - prompt: 'Increasing the intensity of light (above threshold) increases:'
    options:
    - the number of photoelectrons
    - their maximum kinetic energy
    - the work function
    - the threshold frequency
    answer: the number of photoelectrons
    difficulty: 2
    hints:
    - More photons.
    - Same energy each.
    solution: The number of electrons (the photocurrent).
  - prompt: 'The work function of a metal is:'
    options:
    - the minimum energy to free an electron
    - the energy of a photon
    - the kinetic energy of an electron
    - the stopping potential
    answer: the minimum energy to free an electron
    difficulty: 1
    hints:
    - φ₀ = hν₀.
    - Depends on the metal.
    solution: The minimum energy needed to free an electron.
  - prompt: Which fact could the wave theory of light NOT explain?
    options:
    - the threshold frequency
    - interference
    - diffraction
    - reflection
    answer: the threshold frequency
    difficulty: 2
    hints:
    - Waves should work at any frequency if bright.
    - Photon idea needed.
    solution: The existence of a threshold frequency.
- code: cbse12p.dual.matter
  title: Matter waves
  after:
  - cbse12p.dual.photoelectric
  notes: |
    de Broglie hypothesis: moving particles have wavelength λ = h/p = h/(mv). For an electron accelerated through V volts:
    λ = h/√(2meV) ≈ 1.227/√V nm. Wave nature noticeable only for tiny masses. Davisson–Germer experiment (electron
    diffraction) confirmed it (removed in some rationalised years). Electron microscopes use short electron wavelengths.
  explanations:
    text: 'de Broglie suggested that if light waves can act like particles, particles might act like waves. A moving particle has a wavelength h/(mv). For everyday objects it''s far too small to notice, but for electrons it matters: electron microscopes use it.'
    visual: Compare a cricket ball (heavy, so its wavelength is unimaginably tiny) with an electron (so light that its wavelength is about the size of an atom).
    step_by_step: 'Step 1: Find momentum p = mv. Step 2: λ = h/p. Step 3: For electrons through V volts, λ ≈ 1.227/√V nm.'
    real_world: Electron microscopes can see viruses because electron waves are much shorter than light waves.
  picture:
    kind: compare
    columns:
    - title: Particle
      points:
      - electron at 100 V
      - cricket ball at 30 m/s
    - title: de Broglie wavelength
      points:
      - about 0.12 nm
      - about 10⁻³⁴ m
    alt: 'de Broglie wavelengths of an electron and a cricket ball: noticeable for the electron, negligible for the ball.'
  items:
  - prompt: An electron is accelerated through 100 V. Find its wavelength (nm) using 1.227/√V, to three decimals.
    answer: '0.123'
    check: round(Rational(1227,1000)/10, 3)
    difficulty: 2
    hints:
    - 1.227/10.
    - 0.1227.
    solution: About 0.123 nm.
  - prompt: A particle's speed doubles. By what factor does its de Broglie wavelength change? (as a fraction)
    answer: 1/2
    check: Rational(1,2)
    difficulty: 1
    hints:
    - λ ∝ 1/v.
    - Halves.
    solution: It halves (×1/2).
    mistakes:
      '2': c12p_debroglie
  - prompt: A particle has momentum 6.63 × 10⁻²⁴ kg m/s. Find its wavelength in units of 10⁻¹⁰ m (h = 6.63 × 10⁻³⁴).
    answer: '1'
    check: '1'
    difficulty: 2
    hints:
    - λ = h/p.
    - 10⁻¹⁰ m.
    solution: 1 × 10⁻¹⁰ m.
  - prompt: Why don't we notice the wave nature of a cricket ball?
    options:
    - its wavelength is far too small
    - it has no momentum
    - it moves too slowly
    - it is not made of atoms
    answer: its wavelength is far too small
    difficulty: 1
    hints:
    - Large mass.
    - h is tiny.
    solution: Its wavelength is vanishingly small.
  - prompt: 'Matter waves of electrons are used in:'
    options:
    - electron microscopes
    - radio sets
    - solar cookers
    - loudspeakers
    answer: electron microscopes
    difficulty: 1
    hints:
    - Short wavelength.
    - High resolution.
    solution: Electron microscopes.
  - prompt: 'de Broglie''s hypothesis says that:'
    options:
    - moving particles have wave properties
    - light is only a wave
    - electrons have no mass
    - atoms can't be split
    answer: moving particles have wave properties
    difficulty: 1
    hints:
    - Wave–particle duality.
    - λ = h/p.
    solution: Moving particles behave like waves.
