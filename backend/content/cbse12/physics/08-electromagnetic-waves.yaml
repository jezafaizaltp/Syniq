# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse12-phy
chapter: 8
title: Electromagnetic Waves
tips:
  c12p_em: All electromagnetic waves travel at c = 3 × 10⁸ m/s in vacuum; they differ only in wavelength and frequency.
  c12p_order: 'Spectrum by increasing wavelength: gamma, X-rays, ultraviolet, visible, infrared, microwaves, radio waves.'
concepts:
- code: cbse12p.emw.nature
  title: Displacement current and nature of EM waves
  notes: |
    Maxwell's displacement current i_d = ε₀ dΦ_E/dt: a changing electric field produces a magnetic field, completing
    Ampère's law (capacitor charging). EM waves: oscillating E and B fields, perpendicular to each other and to the direction
    of travel (transverse); produced by accelerating charges; no medium needed; speed c = 1/√(μ₀ε₀) = 3 × 10⁸ m/s; E₀/B₀ = c.
    Carry energy and momentum (radiation pressure). Hertz produced them experimentally.
  explanations:
    text: Maxwell realised that a changing electric field makes a magnetic field, just as a changing magnetic field makes an electric one. Together they can travel through empty space as electromagnetic waves at the speed of light. Light itself is one of these waves.
    visual: 'Draw two waves at right angles: the electric field going up and down, the magnetic field going side to side, both moving forward together.'
    step_by_step: 'Step 1: Speed in vacuum is c = 3 × 10⁸ m/s. Step 2: c = fλ. Step 3: E₀ = cB₀. Step 4: E, B and direction of travel are mutually perpendicular.'
    real_world: Your phone sends and receives information as electromagnetic waves through the air.
  picture:
    kind: flow
    steps:
    - Accelerating charge
    - Changing E field
    - Changing B field
    - Wave travels at c
    alt: 'Electromagnetic waves: an accelerating charge makes changing electric and magnetic fields that travel at the speed of light.'
  items:
  - prompt: An EM wave has frequency 3 × 10⁸ Hz. Find its wavelength in vacuum (m).
    answer: '1'
    check: 3*10**8/(3*10**8)
    difficulty: 1
    hints:
    - λ = c/f.
    - 3 × 10⁸ / 3 × 10⁸.
    solution: 1 m.
  - prompt: An EM wave has wavelength 600 m. Find its frequency in units of 10⁵ Hz.
    answer: '5'
    check: 3*10**8/600/10**5
    difficulty: 2
    hints:
    - f = c/λ.
    - 3 × 10⁸/600 = 5 × 10⁵.
    solution: 5 × 10⁵ Hz.
  - prompt: In an EM wave, B₀ = 2 × 10⁻⁸ T. Find E₀ (V/m).
    answer: '6'
    check: 3*10**8*2*10**-8
    difficulty: 2
    hints:
    - E₀ = cB₀.
    - 3 × 10⁸ × 2 × 10⁻⁸.
    solution: 6 V/m.
  - prompt: 'Electromagnetic waves are:'
    options:
    - transverse
    - longitudinal
    - mechanical
    - standing only
    answer: transverse
    difficulty: 1
    hints:
    - E and B ⟂ to travel.
    - Like light.
    solution: Transverse.
  - prompt: Who first produced EM waves in the laboratory?
    options:
    - Heinrich Hertz
    - James Clerk Maxwell
    - Michael Faraday
    - J.C. Bose
    answer: Heinrich Hertz
    difficulty: 2
    hints:
    - Unit of frequency.
    - '1887.'
    solution: Hertz (J.C. Bose later made very short waves).
  - prompt: 'In vacuum, all EM waves have the same:'
    options:
    - speed
    - wavelength
    - frequency
    - energy
    answer: speed
    difficulty: 1
    hints:
    - c.
    - 3 × 10⁸ m/s.
    solution: Speed.
    mistakes:
      wavelength: c12p_em
- code: cbse12p.emw.spectrum
  title: The electromagnetic spectrum
  after:
  - cbse12p.emw.nature
  notes: |
    Spectrum (decreasing wavelength): radio waves (> 0.1 m; broadcasting), microwaves (radar, ovens), infrared (heat,
    remote controls, greenhouse effect), visible light (400–700 nm), ultraviolet (absorbed by ozone; sterilisation; skin
    damage), X-rays (medical imaging), gamma rays (nuclear origin; cancer treatment). Sources and detectors of each.
  explanations:
    text: 'Electromagnetic waves range from long radio waves to tiny gamma rays. Visible light is just a narrow band in the middle. Each type has its own uses: radio for broadcasting, microwaves for cooking, X-rays for seeing bones.'
    visual: 'Draw a long band from left to right: radio, microwave, infrared, visible (rainbow), ultraviolet, X-ray, gamma. Wavelength shrinks and frequency and energy grow as you go right.'
    step_by_step: 'Step 1: Recall the order. Step 2: Shorter wavelength means higher frequency and energy. Step 3: Match each type to its use.'
    real_world: Ultraviolet lamps are used to sterilise water and hospital equipment.
  picture:
    kind: compare
    columns:
    - title: Wave
      points:
      - radio
      - microwave
      - infrared
      - ultraviolet
      - X-ray
      - gamma
    - title: Use
      points:
      - broadcasting
      - ovens, radar
      - remote controls
      - sterilising
      - seeing bones
      - cancer treatment
    alt: Types of electromagnetic waves and a use of each.
  items:
  - prompt: Which EM waves have the shortest wavelength?
    options:
    - gamma rays
    - radio waves
    - infrared
    - microwaves
    answer: gamma rays
    difficulty: 1
    hints:
    - Highest energy.
    - Nuclear.
    solution: Gamma rays.
    mistakes:
      radio waves: c12p_order
  - prompt: 'TV remote controls use:'
    options:
    - infrared
    - ultraviolet
    - X-rays
    - gamma rays
    answer: infrared
    difficulty: 1
    hints:
    - Invisible heat waves.
    - Short range.
    solution: Infrared.
  - prompt: 'The ozone layer protects us from:'
    options:
    - ultraviolet rays
    - radio waves
    - infrared
    - microwaves
    answer: ultraviolet rays
    difficulty: 1
    hints:
    - Causes sunburn.
    - Absorbed high up.
    solution: Ultraviolet.
  - prompt: Visible light ranges from about 400 nm to how many nm?
    answer: '700'
    check: '700'
    difficulty: 1
    hints:
    - Violet to red.
    - Red end.
    solution: About 700 nm.
  - prompt: Doctors use which waves to see broken bones?
    options:
    - X-rays
    - infrared
    - radio
    - microwaves
    answer: X-rays
    difficulty: 1
    hints:
    - Pass through flesh.
    - Röntgen.
    solution: X-rays.
  - prompt: Which has the lowest frequency?
    options:
    - radio waves
    - visible light
    - X-rays
    - ultraviolet
    answer: radio waves
    difficulty: 2
    hints:
    - Longest wavelength.
    - f = c/λ.
    solution: Radio waves.
