# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse12-phy
chapter: 8
title: Electromagnetic Waves
tips:
  c12p_em: All electromagnetic waves travel at c = 3 × 10⁸ m/s in vacuum; they differ only in wavelength and frequency.
  c12p_order: 'Spectrum by increasing wavelength: gamma, X-rays, ultraviolet, visible, infrared, microwaves, radio waves.'
  p12_c_flambda: "c = fλ, so λ = c/f."
  p12_e_b: "E₀ = cB₀."
  p12_em_transverse: "E and B oscillate at right angles to the direction of travel."
  p12_frequency_order: "Order by frequency: radio < microwave < infrared < visible < UV < X-ray < gamma."
  p12_hertz: "Maxwell predicted EM waves on paper; who made and detected them in 1887?"
  p12_ir: "A remote's beam is invisible and just below red in frequency."
  p12_uv: "Ozone absorbs radiation that causes sunburn."
  p12_visible: "Visible light runs from violet (~400 nm) to red."
  p12_xray: "These pass through soft tissue but are stopped by bone."
  c12p8_c: "All EM waves travel at the speed of light in vacuum, and c = fλ. Put λ in metres first, then divide."
  c12p8_order: "Order the bands by wavelength, longest first, and place the given wavelength among them. Frequency goes the opposite way."
  c12p8_use: "Match each band with its typical use, from the longest waves to the shortest. Which band reflects well off aircraft and also heats food?"
concepts:
- code: cbse12p.emw.nature
  title: Displacement current and nature of EM waves
  notes: |
    Maxwell's displacement current i_d = ε₀ dΦ_E/dt: a changing electric field produces a magnetic field, completing
    Ampère's law (capacitor charging). EM waves: oscillating E and B fields, perpendicular to each other and to the direction
    of travel (transverse); produced by accelerating charges; no medium needed; speed c = 1/√(μ₀ε₀) = 3 × 10⁸ m/s; E₀/B₀ = c.
    Carry energy and momentum (radiation pressure). Hertz produced them experimentally.
  explanations:
    text: Maxwell realised that a changing electric field makes a magnetic field, just as a changing magnetic field makes an electric one. Together they can travel through empty space as electromagnetic waves at the speed of light. Light itself is one of these waves.
    visual: 'Draw two waves at right angles: the electric field going up and down, the magnetic field going side to side, both moving forward together.'
    step_by_step: 'Step 1: Speed in vacuum is c = 3 × 10⁸ m/s. Step 2: c = fλ. Step 3: E₀ = cB₀. Step 4: E, B and direction of travel are mutually perpendicular.'
    real_world: Your phone sends and receives information as electromagnetic waves through the air.
  picture:
    kind: flow
    steps:
    - Accelerating charge
    - Changing E field
    - Changing B field
    - Wave travels at c
    alt: 'Electromagnetic waves: an accelerating charge makes changing electric and magnetic fields that travel at the speed of light.'
  activity:
    type: sort
    prompt: Which statements about electromagnetic waves are correct?
    bins:
    - Correct
    - Wrong
    items:
    - label: They travel through a vacuum at 3 × 10⁸ m/s
      bin: Correct
      clue: Does light from the Sun need air to reach us?
      why: EM waves need no medium; in a vacuum they all travel at c.
    - label: E ⊥ B, and both ⊥ the direction of travel
      bin: Correct
      clue: Are EM waves transverse?
      why: E, B and the direction of travel are all mutually perpendicular.
    - label: They need a medium such as air
      bin: Wrong
      clue: How does sunlight cross empty space?
      why: They travel through a vacuum.
    - label: They are longitudinal
      bin: Wrong
      clue: Do E and B vibrate along the direction of travel?
      why: 'They vibrate across it: EM waves are transverse.'
    - label: They carry energy and momentum
      bin: Correct
      clue: Does sunlight warm you and push (very slightly) on surfaces?
      why: 'They carry both: radiation pressure.'
    - label: They are made by accelerating charges
      bin: Correct
      clue: Does a steadily moving charge radiate?
      why: Only accelerating (oscillating) charges radiate.
    - label: E and B are 90° out of phase
      bin: Wrong
      clue: Do E and B reach their peaks together?
      why: In a travelling EM wave they are in phase.
    - label: Their speed in a vacuum is 1/√(μ₀ε₀)
      bin: Correct
      clue: Maxwell found c from two constants. Which?
      why: c = 1/√(μ₀ε₀).
    - label: A steady current gives off EM waves
      bin: Wrong
      clue: Is a steady current accelerating its charges?
      why: Steady currents make static fields, not waves.
  lesson:
    - teach: 'While a capacitor charges, no charge crosses the gap, yet a magnetic field appears there. Maxwell explained this with displacement current i_d = ε₀ dΦ_E/dt: a changing electric field produces a magnetic field, just as a changing magnetic field produces an electric field.'
      check:
        prompt: 'Displacement current exists between capacitor plates because:'
        options:
        - the electric field there is changing
        - electrons jump across
        - the plates touch
        answer: the electric field there is changing
        why: i_d depends on dΦ_E/dt, not on moving charge.
      ways:
      - style: visual
        teach: Why Maxwell needed displacement current, shown around a charging capacitor.
        picture:
          kind: flow
          steps:
          - Current flows in the wires to the plates
          - No charge crosses the gap
          - Yet a magnetic field is found in the gap
          - 'Changing E there acts as a current: i_d = ε₀ dΦ_E/dt'
          alt: Current flows in the wires, but no charge crosses the capacitor gap. A magnetic field is still found there, because the changing electric field in the gap acts as a displacement current, epsilon nought times the rate of change of electric flux.
      - style: real_world
        teach: 'Faraday showed a changing magnetic field makes an electric field. Maxwell added the mirror image: a changing electric field makes a magnetic field. Together they let each field keep re-creating the other, which is how light travels from the Sun through empty space.'
    - teach: 'So changing E and B fields can keep creating each other and travel through space: an electromagnetic wave. E and B oscillate at right angles to each other and to the direction of travel (transverse). Accelerating charges produce them, and they need no medium.'
      picture:
        kind: compare
        columns:
        - title: E field
          points:
          - along y
          - E₀ = cB₀
        - title: B field
          points:
          - along z
          - in phase with E
        - title: Wave
          points:
          - travels along x
          - speed c
        alt: In an EM wave, E, B and the direction of travel are mutually perpendicular.
      check:
        prompt: 'EM waves can travel through:'
        options:
        - vacuum
        - only air
        - only solids
        answer: vacuum
        why: They are self-sustaining fields and need no medium.
      ways:
      - style: step_by_step
        teach: 'Picture an EM wave travelling along x. Step 1: E oscillates along y. Step 2: B oscillates along z. Step 3: Both are at right angles to x, so the wave is transverse. Step 4: E and B rise and fall together, in phase.'
      - style: real_world
        teach: 'Sunlight reaches Earth across 150 million km of vacuum, where there is no air or water to carry a wave. EM waves need no medium: their changing fields are the wave itself, unlike sound, which stops in a vacuum.'
    - teach: In vacuum all EM waves travel at c = 1/√(μ₀ε₀) = 3 × 10⁸ m/s, and c = fλ. Peak fields are linked by E₀ = cB₀. EM waves carry energy and momentum, so they exert radiation pressure. Hertz first produced and detected them in the laboratory.
      check:
        prompt: E₀ = 300 V/m. B₀?
        options:
        - 10⁻⁶ T
        - 10⁶ T
        - 300 T
        answer: 10⁻⁶ T
        why: B₀ = E₀/c = 300/(3 × 10⁸).
      ways:
      - style: visual
        teach: The key numbers that link an EM wave's quantities.
        picture:
          kind: compare
          columns:
          - title: Speed
            points:
            - c = 1/√(μ₀ε₀)
            - 3 × 10⁸ m/s in vacuum
          - title: Wave equation
            points:
            - c = fλ
            - Higher f means shorter λ
          - title: Field link
            points:
            - E₀ = cB₀
            - B₀ is tiny compared with E₀
          alt: Speed c equals 1 over root mu nought epsilon nought, 3 times 10 to the 8 metres per second. c equals f lambda, so higher frequency means shorter wavelength. E nought equals c B nought, so B nought is tiny compared with E nought.
      - style: step_by_step
        teach: 'A microwave oven works at 2.5 GHz. Step 1: f = 2.5 × 10⁹ Hz. Step 2: λ = c/f. Step 3: λ = 3 × 10⁸ / 2.5 × 10⁹. Step 4: λ = 0.12 m = 12 cm.'
  items:
  - prompt: An EM wave has frequency 3 × 10⁸ Hz. Find its wavelength in vacuum (m).
    answer: '1'
    check: 3*10**8/(3*10**8)
    difficulty: 1
    hints:
    - λ = c/f.
    - 3 × 10⁸ / 3 × 10⁸.
    solution: 1 m.
    mistakes: {"3": "p12_c_flambda", "9": "p12_c_flambda"}
  - prompt: An EM wave has wavelength 600 m. Find its frequency in units of 10⁵ Hz.
    answer: '5'
    check: 3*10**8/600/10**5
    difficulty: 2
    hints:
    - f = c/λ.
    - 3 × 10⁸/600 = 5 × 10⁵.
    solution: 5 × 10⁵ Hz.
    mistakes: {"2": "p12_c_flambda", "50": "p12_c_flambda"}
  - prompt: In an EM wave, B₀ = 2 × 10⁻⁸ T. Find E₀ (V/m).
    answer: '6'
    check: 3*10**8*2*10**-8
    difficulty: 2
    hints:
    - E₀ = cB₀.
    - 3 × 10⁸ × 2 × 10⁻⁸.
    solution: 6 V/m.
    mistakes: {"0.6": "p12_e_b", "60": "p12_e_b"}
  - prompt: 'Electromagnetic waves are:'
    options:
    - transverse
    - longitudinal
    - mechanical
    - standing only
    answer: transverse
    difficulty: 1
    hints:
    - E and B ⟂ to travel.
    - Like light.
    solution: Transverse.
    mistakes: {"longitudinal": "p12_em_transverse", "mechanical": "p12_em_transverse", "standing only": "p12_em_transverse"}
  - prompt: Who first produced EM waves in the laboratory?
    options:
    - Heinrich Hertz
    - James Clerk Maxwell
    - Michael Faraday
    - J.C. Bose
    answer: Heinrich Hertz
    difficulty: 2
    hints:
    - Unit of frequency.
    - '1887.'
    solution: Hertz (J.C. Bose later made very short waves).
    mistakes: {"James Clerk Maxwell": "p12_hertz", "Michael Faraday": "p12_hertz", "J.C. Bose": "p12_hertz"}
  - prompt: 'In vacuum, all EM waves have the same:'
    options:
    - speed
    - wavelength
    - frequency
    - energy
    answer: speed
    difficulty: 1
    hints:
    - c.
    - 3 × 10⁸ m/s.
    solution: Speed.
    mistakes:
      wavelength: c12p_em
  - prompt: An EM wave has frequency 1.5 × 10⁸ Hz. Find its wavelength in vacuum (m).
    answer: '2'
    check: 3*10**8/(Rational(15,10)*10**8)
    difficulty: 1
    hints:
    - λ = c/f.
    - 3 × 10⁸ / 1.5 × 10⁸.
    solution: 'Step 1: 3/1.5. Step 2: 2 m.'
    mistakes:
      1/2: c12p8_c
      '4': c12p8_c
  - prompt: An EM wave has wavelength 3 cm. Find its frequency in GHz (10⁹ Hz).
    answer: '10'
    check: 3*10**8/Rational(3,100)/10**9
    difficulty: 1
    hints:
    - f = c/λ.
    - λ = 0.03 m.
    solution: 'Step 1: 3 × 10⁸/0.03 = 10¹⁰ Hz. Step 2: 10 GHz.'
    mistakes:
      '1': c12p8_c
      '100': c12p8_c
  - prompt: E₀ = 90 V/m in an EM wave. Find B₀ in units of 10⁻⁷ T.
    answer: '3'
    check: 90/(3*10**8)*10**7
    difficulty: 1
    hints:
    - B₀ = E₀/c.
    - 90/(3 × 10⁸).
    solution: 'Step 1: 3 × 10⁻⁷ T. Step 2: 3.'
    mistakes:
      '30': c12p8_c
      '27': c12p8_c
  - prompt: 'EM waves are produced by charges that are:'
    options:
    - accelerating
    - at rest
    - moving at constant velocity
    answer: accelerating
    difficulty: 2
    hints:
    - A steady current makes only a steady field.
    - The fields must change in time.
    solution: 'Step 1: changing fields need changing motion. Step 2: accelerating charges.'
    mistakes:
      at rest: c12p8_c
      moving at constant velocity: c12p8_c
  - prompt: 'In an EM wave, the angle (degrees) between E and B is:'
    answer: '90'
    check: '90'
    difficulty: 2
    hints:
    - The fields are mutually perpendicular.
    - Both are also perpendicular to the motion.
    solution: 'Step 1: E ⟂ B. Step 2: 90°.'
    mistakes:
      '0': c12p8_c
      '180': c12p8_c
  - prompt: Maxwell's displacement current completed which law?
    options:
    - Ampère's circuital law
    - Ohm's law
    - Coulomb's law
    answer: Ampère's circuital law
    difficulty: 2
    hints:
    - The law relates B around a loop to current.
    - It failed for a charging capacitor.
    solution: 'Step 1: ∮B·dl = μ₀(i + i_d). Step 2: Ampère''s law.'
    mistakes:
      Ohm's law: c12p8_c
      Coulomb's law: c12p8_c
  - prompt: A radio station broadcasts at 100 MHz. Wavelength (m)?
    answer: '3'
    check: 3*10**8/(100*10**6)
    difficulty: 2
    hints:
    - 100 MHz = 10⁸ Hz.
    - λ = c/f.
    solution: 'Step 1: 3 × 10⁸/10⁸. Step 2: 3 m.'
    mistakes:
      '30': c12p8_c
      1/3: c12p8_c
  - prompt: Light takes about 500 s to reach Earth from the Sun. Distance in units of 10¹¹ m?
    answer: 3/2
    check: 3*10**8*500/10**11
    difficulty: 3
    hints:
    - distance = c × t.
    - 3 × 10⁸ × 500.
    solution: 'Step 1: 1.5 × 10¹¹ m. Step 2: 3/2.'
    mistakes:
      '15': c12p8_c
      '3': c12p8_c
  - prompt: Why can EM waves exert pressure on a surface?
    options:
    - they carry momentum
    - they have mass like particles of dust
    - they are made of air
    answer: they carry momentum
    difficulty: 3
    hints:
    - Pressure comes from a change of momentum.
    - Absorbing the wave transfers it.
    solution: 'Step 1: EM waves carry momentum. Step 2: absorbing or reflecting it gives a force.'
    mistakes:
      they have mass like particles of dust: c12p8_c
      they are made of air: c12p8_c
  - prompt: 'Assertion (A): Electromagnetic waves can travel through a vacuum.

      Reason (R): Electromagnetic waves are made of changing electric and magnetic fields that sustain each other and need no medium.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: The fields themselves carry the wave, each change producing the other, so no material medium is needed. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A mobile tower sends signals at 900 MHz. What is the wavelength of these waves?'
    options:
    - 0.33 m
    - 3.3 m
    - 2.7 m
    answer: 0.33 m
    hints:
    - λ = c/f.
    - 900 MHz = 9 × 10⁸ Hz.
    solution: λ = 3 × 10⁸ / 9 × 10⁸ = 1/3 m ≈ 0.33 m.
    mistakes:
      3.3 m: c12p8_c
      2.7 m: c12p8_c
    exam: case
    difficulty: 2
  - prompt: Sound from a ringing bell in a jar fades as the air is pumped out, but the bell can still be seen clearly. What does this show?
    options:
    - Light (an EM wave) needs no medium, but sound does
    - Light slows down in a vacuum
    - Sound and light both need air
    answer: Light (an EM wave) needs no medium, but sound does
    hints:
    - What carries a sound wave?
    - What carries an EM wave?
    solution: Sound is a vibration of the air and stops when the air is removed. Light is an EM wave of changing fields, which travels through vacuum.
    mistakes:
      Light slows down in a vacuum: c12p8_c
      Sound and light both need air: c12p8_c
    exam: competency
    difficulty: 2
- code: cbse12p.emw.spectrum
  title: The electromagnetic spectrum
  after:
  - cbse12p.emw.nature
  notes: |
    Spectrum (decreasing wavelength): radio waves (> 0.1 m; broadcasting), microwaves (radar, ovens), infrared (heat,
    remote controls, greenhouse effect), visible light (400–700 nm), ultraviolet (absorbed by ozone; sterilisation; skin
    damage), X-rays (medical imaging), gamma rays (nuclear origin; cancer treatment). Sources and detectors of each.
  explanations:
    text: 'Electromagnetic waves range from long radio waves to tiny gamma rays. Visible light is just a narrow band in the middle. Each type has its own uses: radio for broadcasting, microwaves for cooking, X-rays for seeing bones.'
    visual: 'Draw a long band from left to right: radio, microwave, infrared, visible (rainbow), ultraviolet, X-ray, gamma. Wavelength shrinks and frequency and energy grow as you go right.'
    step_by_step: 'Step 1: Recall the order. Step 2: Shorter wavelength means higher frequency and energy. Step 3: Match each type to its use.'
    real_world: Ultraviolet lamps are used to sterilise water and hospital equipment.
  picture:
    kind: compare
    columns:
    - title: Wave
      points:
      - radio
      - microwave
      - infrared
      - ultraviolet
      - X-ray
      - gamma
    - title: Use
      points:
      - broadcasting
      - ovens, radar
      - remote controls
      - sterilising
      - seeing bones
      - cancer treatment
    alt: Types of electromagnetic waves and a use of each.
  activity:
    type: order
    prompt: Put the electromagnetic spectrum in order, longest wavelength first.
    steps:
    - Radio waves
    - Microwaves
    - Infrared
    - Visible light (400–700 nm)
    - Ultraviolet
    - X-rays
    - Gamma rays
    reasons:
      Microwaves: Microwaves are shorter than radio waves (mm to cm, not metres).
      Infrared: 'Infrared is shorter than microwaves: around a micrometre to a millimetre.'
      Visible light (400–700 nm): 'Visible light is shorter than infrared: red light borders infrared.'
      Ultraviolet: 'UV is just beyond violet: shorter than visible light.'
      X-rays: X-rays are shorter than UV, around 1 nm and below.
      Gamma rays: Gamma rays from nuclei are the shortest of all.
  lesson:
    - teach: 'All EM waves are the same kind of wave, differing only in wavelength (and frequency). In order of decreasing wavelength: radio, microwaves, infrared, visible, ultraviolet, X-rays, gamma rays. Frequency and photon energy increase in the same order.'
      picture:
        kind: flow
        steps:
        - Radio
        - Microwave
        - Infrared
        - Visible
        - Ultraviolet
        - X-rays
        - Gamma
        alt: The EM spectrum from longest wavelength (radio) to shortest (gamma).
      check:
        prompt: Which has a longer wavelength than visible light?
        options:
        - infrared
        - ultraviolet
        - X-rays
        answer: infrared
        why: Infrared sits just beyond red, at longer wavelengths.
      ways:
      - style: step_by_step
        teach: 'Place λ = 10⁻¹⁰ m on the spectrum. Step 1: Visible light is 4 to 7 × 10⁻⁷ m. Step 2: 10⁻¹⁰ m is about a thousand times shorter. Step 3: That is beyond ultraviolet. Step 4: It is in the X-ray region.'
      - style: real_world
        teach: Your radio, phone, TV remote, eyes, tanning lamp, hospital X-ray and a cancer clinic's machine all use the same kind of wave. Only the wavelength differs, from metres for radio down to less than a trillionth of a metre for gamma rays.
    - teach: 'Uses: radio for broadcasting; microwaves for radar, mobile phones and ovens; infrared for heating, remote controls and night vision (it keeps the Earth warm by the greenhouse effect); visible light, 400–700 nm, for seeing.'
      check:
        prompt: 'Microwave ovens heat food mainly because microwaves:'
        options:
        - make water molecules vibrate
        - contain hot air
        - are radioactive
        answer: make water molecules vibrate
        why: The energy goes into water molecules' motion.
      ways:
      - style: visual
        teach: Everyday uses of the longer-wavelength bands.
        picture:
          kind: compare
          columns:
          - title: Radio
            points:
            - Broadcasting
            - Longest waves
          - title: Microwaves
            points:
            - Radar, mobile phones
            - Microwave ovens
          - title: Infrared
            points:
            - Remote controls, night vision
            - Heating, greenhouse effect
          alt: Radio waves, the longest, are used for broadcasting. Microwaves are used for radar, mobile phones and ovens. Infrared is used for remote controls, night vision and heating, and drives the greenhouse effect.
      - style: real_world
        teach: A night-vision camera sees people in the dark because warm bodies give off infrared. Firefighters use the same idea to find people through smoke, which blocks visible light more than infrared.
    - teach: Ultraviolet from the Sun is mostly absorbed by the ozone layer; it can damage skin and eyes but is used to sterilise. X-rays pass through soft tissue and show bones. Gamma rays come from nuclei and are used to treat cancer.
      check:
        prompt: Which rays come from atomic nuclei?
        options:
        - gamma rays
        - infrared
        - radio waves
        answer: gamma rays
        why: They are emitted in nuclear reactions and decay.
      ways:
      - style: visual
        teach: Uses and dangers of the shorter-wavelength bands.
        picture:
          kind: compare
          columns:
          - title: Ultraviolet
            points:
            - Sterilising water and tools
            - Mostly stopped by ozone
          - title: X-rays
            points:
            - Show bones, check luggage
            - Pass through soft tissue
          - title: Gamma rays
            points:
            - From nuclei
            - Cancer treatment
          alt: Ultraviolet sterilises water and tools and is mostly stopped by the ozone layer. X-rays pass through soft tissue to show bones and check luggage. Gamma rays come from nuclei and are used in cancer treatment.
      - style: step_by_step
        teach: 'Why shorter waves are more harmful. Step 1: Photon energy E = hf. Step 2: Shorter λ means higher f. Step 3: UV, X-ray and gamma photons carry enough energy to break molecules such as DNA. Step 4: Radio and infrared photons do not, so they only warm things.'
  items:
  - prompt: Which EM waves have the shortest wavelength?
    options:
    - gamma rays
    - radio waves
    - infrared
    - microwaves
    answer: gamma rays
    difficulty: 1
    hints:
    - Highest energy.
    - Nuclear.
    solution: Gamma rays.
    mistakes:
      radio waves: c12p_order
  - prompt: 'TV remote controls use:'
    options:
    - infrared
    - ultraviolet
    - X-rays
    - gamma rays
    answer: infrared
    difficulty: 1
    hints:
    - Invisible heat waves.
    - Short range.
    solution: Infrared.
    mistakes: {"ultraviolet": "p12_ir", "X-rays": "p12_ir", "gamma rays": "p12_ir"}
  - prompt: 'The ozone layer protects us from:'
    options:
    - ultraviolet rays
    - radio waves
    - infrared
    - microwaves
    answer: ultraviolet rays
    difficulty: 1
    hints:
    - Causes sunburn.
    - Absorbed high up.
    solution: Ultraviolet.
    mistakes: {"radio waves": "p12_uv", "infrared": "p12_uv", "microwaves": "p12_uv"}
  - prompt: Visible light ranges from about 400 nm to how many nm?
    answer: '700'
    check: '700'
    difficulty: 1
    hints:
    - Violet to red.
    - Red end.
    solution: About 700 nm.
    mistakes: {"800": "p12_visible", "500": "p12_visible", "1000": "p12_visible"}
  - prompt: Doctors use which waves to see broken bones?
    options:
    - X-rays
    - infrared
    - radio
    - microwaves
    answer: X-rays
    difficulty: 1
    hints:
    - Pass through flesh.
    - Röntgen.
    solution: X-rays.
    mistakes: {"infrared": "p12_xray", "radio": "p12_xray", "microwaves": "p12_xray"}
  - prompt: Which has the lowest frequency?
    options:
    - radio waves
    - visible light
    - X-rays
    - ultraviolet
    answer: radio waves
    difficulty: 2
    hints:
    - Longest wavelength.
    - f = c/λ.
    solution: Radio waves.
    mistakes: {"visible light": "p12_frequency_order", "X-rays": "p12_frequency_order", "ultraviolet": "p12_frequency_order"}
  - prompt: Which has the highest frequency?
    options:
    - gamma rays
    - X-rays
    - ultraviolet
    answer: gamma rays
    difficulty: 1
    hints:
    - Highest frequency means shortest wavelength.
    - The very end of the spectrum.
    solution: 'Step 1: shortest λ. Step 2: gamma rays.'
    mistakes:
      X-rays: c12p8_order
      ultraviolet: c12p8_order
  - prompt: 'Radar uses:'
    options:
    - microwaves
    - gamma rays
    - ultraviolet
    answer: microwaves
    difficulty: 1
    hints:
    - Short radio-like waves that reflect off aircraft.
    - Also used in ovens.
    solution: 'Step 1: radar needs cm-scale waves. Step 2: microwaves.'
    mistakes:
      gamma rays: c12p8_use
      ultraviolet: c12p8_use
  - prompt: Visible light has wavelengths from about 400 nm to 700 nm. Find the width of this band (nm).
    answer: '300'
