# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse12-phy
chapter: 6
title: Electromagnetic Induction
tips:
  c12p_faraday: 'Induced EMF = −dΦ/dt: it depends on how FAST the flux changes, not on how big the flux is.'
  c12p_lenz: 'Lenz''s law: the induced current flows so as to OPPOSE the change in flux that causes it.'
  p12_faraday: "EMF = N ΔΦ/Δt."
  p12_flux_mag: "Φ = BA when the field is perpendicular to the loop."
  p12_generator: "A turbine turns the coil. What kind of energy goes in?"
  p12_inductor_energy: "U = ½LI²."
  p12_lamination: "Thin insulated sheets break up the loops of induced current in the core."
  p12_motional: "EMF = BLv."
  p12_mutual: "EMF = M dI/dt."
  p12_peak_emf: "e₀ = NBAω."
  p12_self_emf: "EMF = L dI/dt."
  p12_units: "Tesla is field, weber flux, farad capacitance. Inductance is named after the American who studied self-induction."
  c12p6_flux: Flux Φ = BA cos θ, with θ between B and the area's normal. EMF depends on how fast Φ changes, not on Φ itself.
  c12p6_lenz: 'Lenz: the induced current makes a field that opposes the change in flux (it does not simply oppose the field).'
  c12p6_L: Self-induced EMF = L × (rate of change of current); energy = ½LI²; generator peak EMF = NBAω.
concepts:
- code: cbse12p.emi.faraday
  title: Faraday's and Lenz's laws
  notes: |
    Experiments of Faraday and Henry. Magnetic flux Φ = B·A = BA cos θ (weber). Faraday's law: ε = −N dΦ/dt. Lenz's law (sign):
    induced current opposes the change; consequence of energy conservation. Motional EMF ε = Blv for a rod moving across a
    field. Eddy currents (braking, induction furnaces; reduced by laminated cores). (Energy considerations kept briefly.)
  explanations:
    text: 'Changing the magnetic field through a coil makes a voltage in it: that''s electromagnetic induction. The faster the change, the bigger the voltage. Lenz''s law says the induced current always tries to oppose the change that made it.'
    visual: 'Push a magnet into a coil: the meter needle flicks one way. Pull it out: it flicks the other way. Hold it still: nothing.'
    step_by_step: 'Step 1: Find the flux Φ = BA cos θ. Step 2: Find how much it changes and how fast. Step 3: ε = −N ΔΦ/Δt. Step 4: Use Lenz''s law for direction.'
    real_world: Bicycle dynamos and power-station generators make electricity by spinning coils near magnets.
  picture:
    kind: flow
    steps:
    - Magnet moves into coil
    - Flux through coil changes
    - 'EMF induced: ε = −N dΦ/dt'
    - Current opposes the change (Lenz)
    alt: 'Electromagnetic induction: changing flux induces an EMF whose current opposes the change.'
  activity:
    type: formula
    prompt: 'Faraday: a coil of N turns gets an EMF ε = N × ΔΦ ÷ Δt, with Φ = BA.'
    inputs:
    - name: n
      label: Turns N
      min: 10
      max: 100
      step: 10
      start: 10
    - name: b
      label: Change in B
      min: 0.1
      max: 2
      step: 0.1
      start: 0.1
      unit: T
    - name: a
      label: Coil area A
      min: 10
      max: 200
      step: 10
      start: 10
      unit: cm²
    - name: t
      label: Time taken Δt
      min: 0.1
      max: 2
      step: 0.1
      start: 2
      unit: s
    outputs:
    - name: emf
      label: EMF
      expr: n*b*a*0.0001/t
      unit: V
      places: 3
    goals:
    - prompt: 50 turns, area 100 cm², B changes by 0.4 T. How quickly must it change to give 2 V?
      want:
        n: 50
        b: 0.4
        a: 100
        emf: 2
      mistakes:
      - when:
          n: 50
          b: 0.4
          a: 100
          t:
          - 0.2
          - 2
        say: 'A slower change gives a smaller EMF: ε = NΔΦ ÷ Δt. Make the change faster.'
    - prompt: Keep Δt = 0.1 s, B change 0.4 T and area 100 cm². Choose N for 4 V.
      want:
        t: 0.1
        b: 0.4
        a: 100
        emf: 4
      mistakes:
      - when:
          t: 0.1
          b: 0.4
          a: 100
          n:
          - 10
          - 90
        say: 'Not enough turns: each turn adds the same EMF, 0.04 V here.'
    - prompt: 10 turns, Δt = 1 s, B changes by 1 T. Choose the coil's area to make 0.1 V.
      want:
        n: 10
        t: 1
        b: 1
        emf: 0.1
      mistakes:
      - when:
          n: 10
          t: 1
          b: 1
          a:
          - 10
          - 90
        say: 'Too small. Use A in m² in Φ = BA: 0.1 = 10 × 1 × A ÷ 1 gives A = 0.01 m² = 100 cm².'
      - when:
          n: 10
          t: 1
          b: 1
          a:
          - 110
          - 200
        say: 'Too big: A = 0.01 m² = 100 cm².'
  lesson:
    - teach: 'Faraday and Henry found that a changing magnetic flux through a coil induces an EMF. Flux Φ = BA cos θ (weber). Faraday''s law: ε = −N dΦ/dt. Only change matters: a magnet resting inside a coil induces nothing.'
      check:
        prompt: A magnet is pushed into a coil, then held still. When is there an EMF?
        options:
        - only while it is moving
        - only while it is still
        - all the time
        answer: only while it is moving
        why: EMF needs a changing flux.
    - teach: 'Lenz''s law gives the direction: the induced current opposes the change that produced it. Push a N pole in and the coil''s near face becomes N, pushing back. This is energy conservation: you must do work to make the current.'
      picture:
        kind: flow
        steps:
        - Flux changes
        - EMF induced (Faraday)
        - Current flows
        - Its field opposes the change (Lenz)
        alt: Chain of events in electromagnetic induction.
      check:
        prompt: 'A N pole is pulled away from a coil. The near face of the coil becomes:'
        options:
        - S, attracting it back
        - N, pushing it away
        - neither
        answer: S, attracting it back
        why: It opposes the decrease in flux by trying to keep the magnet close.
    - teach: 'A rod of length l moving at speed v across field B has motional EMF ε = Blv. Changing flux in a solid metal sets up swirling eddy currents: useful in magnetic braking and induction furnaces, wasteful in transformer cores (so cores are laminated).'
      check:
        prompt: Why are transformer cores made of thin insulated sheets?
        options:
        - to reduce eddy currents
        - to make them lighter
        - to increase resistance of the coils
        answer: to reduce eddy currents
        why: Thin sheets break up the paths for eddy currents.
  items:
  - prompt: Flux through a 100-turn coil changes by 0.02 Wb in 0.1 s. Find the induced EMF (V).
    answer: '20'
    check: 100*Rational(2,100)/Rational(1,10)
    difficulty: 1
    hints:
    - ε = N ΔΦ/Δt.
    - 100 × 0.2.
    solution: 20 V.
    mistakes: {"0.2": "p12_faraday", "2": "p12_faraday", "200": "p12_faraday"}
  - prompt: A 0.5 m rod moves at 4 m/s across a 0.2 T field. Find the EMF (V).
    answer: '0.4'
    check: Rational(2,10)*Rational(1,2)*4
    difficulty: 1
    hints:
    - ε = Blv.
    - 0.2 × 0.5 × 4.
    solution: 0.4 V.
    mistakes: {"4": "p12_motional", "0.04": "p12_motional"}
  - prompt: A field of 0.5 T passes straight through a 0.2 m² loop. Find the flux (Wb).
    answer: '0.1'
    check: Rational(1,2)*Rational(2,10)
    difficulty: 1
    hints:
    - Φ = BA.
    - 0.5 × 0.2.
    solution: 0.1 Wb.
    mistakes: {"2.5": "p12_flux_mag", "1": "p12_flux_mag"}
  - prompt: 'A magnet held still inside a coil induces:'
    options:
    - no EMF
    - a steady EMF
    - a large EMF
    - an alternating EMF
    answer: no EMF
    difficulty: 1
    hints:
    - No change in flux.
    - dΦ/dt = 0.
    solution: No EMF.
    mistakes:
      a large EMF: c12p_faraday
  - prompt: 'Lenz''s law is a consequence of conservation of:'
    options:
    - energy
    - charge
    - momentum
    - mass
    answer: energy
    difficulty: 2
    hints:
    - "If the induced current helped the change, you would get something for nothing. Which law would that break?"
    - Opposition needs work.
    solution: Energy.
    mistakes:
      charge: c12p_lenz
  - prompt: 'Transformer cores are laminated to reduce:'
    options:
    - eddy currents
    - voltage
    - magnetic field
    - number of turns
    answer: eddy currents
    difficulty: 2
    hints:
    - Thin insulated sheets.
    - Less heating.
    solution: Eddy currents.
    mistakes: {"voltage": "p12_lamination", "magnetic field": "p12_lamination", "number of turns": "p12_lamination"}
  - prompt: Flux through a 50-turn coil changes by 0.04 Wb in 0.2 s. Find the EMF (V).
    answer: '10'
    check: 50*Rational(4,100)/Rational(2,10)
    difficulty: 1
    hints:
    - ε = N ΔΦ/Δt.
    - 50 × 0.04/0.2.
    solution: 'Step 1: 2/0.2. Step 2: 10 V.'
    mistakes:
      2/5: c12p6_flux
      1/5: c12p6_flux
  - prompt: A 1 m rod moves at 5 m/s across a 0.4 T field. Find the EMF (V).
    answer: '2'
    check: Rational(4,10)*1*5
    difficulty: 1
    hints:
    - ε = Blv.
    - 0.4 × 1 × 5.
    solution: 'Step 1: 0.4 × 5. Step 2: 2 V.'
    mistakes:
      '10': c12p6_flux
      4/5: c12p6_flux
  - prompt: B = 2 T makes 60° with the normal to a 0.5 m² loop. Find the flux (Wb) as a fraction.
    answer: 1/2
    check: 2*Rational(1,2)*Rational(1,2)
    difficulty: 1
    hints:
    - Φ = BA cos θ.
    - cos 60° = 1/2.
    solution: 'Step 1: 2 × 0.5 × 0.5. Step 2: 1/2 Wb.'
    mistakes:
      '1': c12p6_flux
      '0': c12p6_flux
  - prompt: A loop's flux falls from 0.6 Wb to 0.2 Wb in 2 s (1 turn). Find the EMF (V) as a fraction.
    answer: 1/5
    check: (Rational(6,10) - Rational(2,10))/2
    difficulty: 2
    hints:
    - ΔΦ = 0.4 Wb.
    - Divide by the time.
    solution: 'Step 1: 0.4/2. Step 2: 0.2 = 1/5 V.'
    mistakes:
      2/5: c12p6_flux
      4/5: c12p6_flux
  - prompt: A 0.2 m² loop sits in a field rising from 0 to 0.5 T in 0.1 s (field along the normal). EMF (V)?
    answer: '1'
    check: Rational(2,10)*Rational(5,10)/Rational(1,10)
    difficulty: 2
    hints:
    - ΔΦ = A × ΔB.
    - 0.2 × 0.5 = 0.1 Wb.
    solution: 'Step 1: 0.1 Wb / 0.1 s. Step 2: 1 V.'
    mistakes:
      1/10: c12p6_flux
      '10': c12p6_flux
  - prompt: 'Lenz''s law says the induced current:'
    options:
    - opposes the change in flux causing it
    - always opposes the magnetic field
    - always flows clockwise
    answer: opposes the change in flux causing it
    difficulty: 2
    hints:
    - It is about the change, not the field itself.
    - Think of a magnet being pulled away.
    solution: 'Step 1: opposition is to the change. Step 2: that keeps energy conserved.'
    mistakes:
      always opposes the magnetic field: c12p6_lenz
      always flows clockwise: c12p6_lenz
  - prompt: 'A rod moves parallel to a magnetic field. The motional EMF is:'
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - It must cut field lines to make an EMF.
    - Moving along B cuts none.
    solution: 'Step 1: no flux cutting. Step 2: 0.'
    mistakes:
      '1': c12p6_flux
      '-1': c12p6_lenz
  - prompt: A 0.5 m rod moves at 2 m/s across 1 T, in a circuit of 0.5 Ω. Find the current (A).
    answer: '2'
    check: 1*Rational(1,2)*2/Rational(1,2)
    difficulty: 3
    hints:
    - EMF = Blv = 1 V.
    - I = ε/R.
    solution: 'Step 1: ε = 1 V. Step 2: I = 1/0.5 = 2 A.'
    mistakes:
      '1': c12p6_flux
      1/2: c12p6_flux
  - prompt: 'A copper plate swinging between magnet poles slows down quickly because of:'
    options:
    - eddy currents
    - friction with air only
    - gravity
    answer: eddy currents
    difficulty: 3
    hints:
    - Flux through the plate changes as it swings.
    - The induced currents oppose the motion.
    solution: 'Step 1: changing flux makes swirling currents. Step 2: they brake the plate (Lenz).'
    mistakes:
      friction with air only: c12p6_lenz
      gravity: c12p6_lenz
- code: cbse12p.emi.inductance
  title: Inductance and the AC generator
  after:
  - cbse12p.emi.faraday
  notes: |
    Self-inductance L: Φ = LI, ε = −L dI/dt (henry); solenoid L = μ₀n²Al. Mutual inductance M: Φ₂ = MI₁, ε₂ = −M dI₁/dt.
    Energy stored in an inductor ½LI². AC generator: coil rotating in a field, ε = NBAω sin ωt, peak ε₀ = NBAω.
  explanations:
    text: An inductor resists changes in current through it, because the changing current induces an opposing voltage in itself. Two coils near each other can induce voltages in one another (mutual inductance). Spinning a coil in a magnetic field gives an alternating voltage.
    visual: Draw a coil spinning between two magnet poles. As it turns, the flux through it rises and falls, so the induced voltage swings up and down like a sine wave.
    step_by_step: 'Step 1: Self-induced EMF = L × rate of change of current. Step 2: Energy = ½LI². Step 3: Generator peak EMF = NBAω.'
    real_world: Wireless phone chargers use mutual inductance between a coil in the pad and one in the phone.
  picture:
    kind: number_line
    from: 0
    to: 4
    step: 1
    points:
    - at: 0
      label: ε = 0
    - at: 1
      label: peak +
    - at: 2
      label: ε = 0
    - at: 3
      label: peak −
    - at: 4
      label: ε = 0
    alt: 'An AC generator''s EMF over one turn, in quarter turns: zero, positive peak, zero, negative peak, zero.'
  activity:
    type: formula
    prompt: A coil of inductance L carrying current I stores ½LI². Switch the current off in 0.01 s and it pushes back with EMF L × I ÷ 0.01.
    inputs:
    - name: l
      label: Inductance L
      min: 0.1
      max: 2
      step: 0.1
      start: 0.1
      unit: H
    - name: i
      label: Current I
      min: 0.5
      max: 10
      step: 0.5
      start: 0.5
      unit: A
    outputs:
    - name: en
      label: Energy stored
      expr: 0.5*l*i^2
      unit: J
      places: 2
    - name: emf
      label: Back EMF when switched off in 0.01 s
      expr: l*i/0.01
      unit: V
      places: 1
    goals:
    - prompt: Store 4 J in a 0.5 H coil.
      want:
        l: 0.5
        en: 4
      mistakes:
      - when:
          l: 0.5
          i: 8
        say: 'Doubling I stores 4 times the energy: 16 J. E = ½LI², so I² = 16.'
      - when:
          l: 0.5
          i: 2
        say: 2 A stores only 1 J. E grows with I².
    - prompt: Switch off 2 A in 0.01 s. Choose L so the back EMF is 100 V.
      want:
        i: 2
        emf: 100
      mistakes:
      - when:
          i: 2
          l:
          - 0.6
          - 2
        say: 'Too big a kick: ε = L × 2 ÷ 0.01 = 200L.'
      - when:
          i: 2
          l:
          - 0.1
          - 0.4
        say: 'Not enough: ε = 200L here.'
    - prompt: 'A 2 H coil: find the current that stores 25 J.'
      want:
        l: 2
        en: 25
      mistakes:
      - when:
          l: 2
          i: 10
        say: 10 A stores 100 J.
      - when:
          l: 2
          i:
          - 5.5
          - 9.5
        say: 'Too much: ½ × 2 × I² = 25.'
  lesson:
    - teach: 'Self-inductance: a coil''s own changing current changes its flux, so it induces an EMF opposing the change: ε = −L dI/dt. Φ = LI. Unit: henry (H). A long solenoid has L = μ₀n²Al.'
      check:
        prompt: Current in a 3 H coil changes at 2 A/s. EMF size?
        options:
        - 6 V
        - 1.5 V
        - 5 V
        answer: 6 V
        why: L × dI/dt = 3 × 2.
    - teach: 'Mutual inductance: a changing current in coil 1 induces an EMF in a nearby coil 2: ε₂ = −M dI₁/dt. An inductor stores energy U = ½LI² in its magnetic field.'
      check:
        prompt: Energy in a 2 H inductor with 2 A?
        options:
        - 4 J
        - 8 J
        - 2 J
        answer: 4 J
        why: ½ × 2 × 2² = 4.
    - teach: 'AC generator: a coil of N turns, area A, rotates at ω in field B. Flux NBA cos ωt changes, giving ε = NBAω sin ωt, with peak ε₀ = NBAω. Mechanical energy becomes electrical energy.'
      picture:
        kind: flow
        steps:
        - Turbine turns coil
        - Flux NBA cos ωt changes
        - EMF NBAω sin ωt
        - AC output
        alt: How an AC generator turns rotation into alternating EMF.
      check:
        prompt: 'Doubling the rotation speed of a generator makes the peak EMF:'
        options:
        - double
        - half
        - the same
        answer: double
        why: ε₀ ∝ ω.
  items:
  - prompt: Current in a 2 H inductor changes by 3 A in 1 s. Find the induced EMF (V).
    answer: '6'
    check: 2*3
    difficulty: 1
    hints:
    - ε = L dI/dt.
    - 2 × 3.
    solution: 6 V.
    mistakes: {"2/3": "p12_self_emf", "5": "p12_self_emf", "3/2": "p12_self_emf"}
  - prompt: Find the energy (J) stored in a 4 H inductor carrying 3 A.
    answer: '18'
    check: Rational(1,2)*4*3**2
    difficulty: 1
    hints:
    - ½LI².
    - ½ × 4 × 9.
    solution: 18 J.
    mistakes: {"36": "p12_inductor_energy", "12": "p12_inductor_energy", "6": "p12_inductor_energy"}
  - prompt: A generator coil has N = 100, B = 0.1 T, A = 0.1 m², ω = 50 rad/s. Find the peak EMF (V).
    answer: '50'
    check: 100*Rational(1,10)*Rational(1,10)*50
    difficulty: 2
    hints:
    - NBAω.
    - 100 × 0.1 × 0.1 × 50.
    solution: 50 V.
    mistakes: {"5": "p12_peak_emf", "500": "p12_peak_emf"}
  - prompt: Current in coil 1 changes at 5 A/s, and M = 0.4 H. Find the EMF in coil 2 (V).
    answer: '2'
    check: Rational(4,10)*5
    difficulty: 2
    hints:
    - ε = M dI/dt.
    - 0.4 × 5.
    solution: 2 V.
    mistakes: {"12.5": "p12_mutual", "5.4": "p12_mutual"}
  - prompt: 'The unit of inductance is the:'
    options:
    - henry
    - tesla
    - weber
    - farad
    answer: henry
    difficulty: 1
    hints:
    - "It is named after an American scientist who discovered self-induction around the time of Faraday."
    - H.
    solution: The henry.
    mistakes: {"tesla": "p12_units", "weber": "p12_units", "farad": "p12_units"}
  - prompt: 'An AC generator converts:'
    options:
    - mechanical energy into electrical energy
    - electrical into mechanical
    - heat into light
    - chemical into electrical
    answer: mechanical energy into electrical energy
    difficulty: 1
    hints:
    - Spinning coil.
    - Dynamo.
    solution: Mechanical energy into electrical.
    mistakes: {"electrical into mechanical": "p12_generator", "heat into light": "p12_generator", "chemical into electrical": "p12_generator"}
  - prompt: Current in a 0.5 H coil changes by 4 A in 0.1 s. Find the EMF (V).
    answer: '20'
    check: Rational(1,2)*4/Rational(1,10)
    difficulty: 1
    hints:
    - ε = L ΔI/Δt.
    - 0.5 × 40.
    solution: 'Step 1: rate 40 A/s. Step 2: 20 V.'
    mistakes:
      '2': c12p6_L
      1/5: c12p6_L
  - prompt: Energy (J) stored in a 0.2 H inductor with 10 A.
    answer: '10'
    check: Rational(1,2)*Rational(2,10)*10**2
    difficulty: 1
    hints:
    - U = ½LI².
    - ½ × 0.2 × 100.
    solution: 'Step 1: 0.1 × 100. Step 2: 10 J.'
    mistakes:
      '20': c12p6_L
      '1': c12p6_L
  - prompt: 'Generator: N = 200, B = 0.05 T, A = 0.1 m², ω = 100 rad/s. Peak EMF (V)?'
    answer: '100'
    check: 200*Rational(5,100)*Rational(1,10)*100
    difficulty: 1
    hints:
    - ε₀ = NBAω.
    - 200 × 0.05 × 0.1 × 100.
    solution: 'Step 1: 1 × 100. Step 2: 100 V.'
    mistakes:
      '10': c12p6_L
      '1000': c12p6_L
  - prompt: M = 0.2 H; coil 1's current changes at 10 A/s. EMF in coil 2 (V)?
    answer: '2'
    check: Rational(2,10)*10
    difficulty: 2
    hints:
    - ε₂ = M dI₁/dt.
    - 0.2 × 10.
    solution: 'Step 1: 0.2 × 10. Step 2: 2 V.'
    mistakes:
      '50': c12p6_L
      1/50: c12p6_L
  - prompt: A coil's flux is 0.6 Wb when it carries 3 A. Find L (H) as a fraction.
    answer: 1/5
    check: Rational(6,10)/3
    difficulty: 2
    hints:
    - Φ = LI.
    - L = Φ/I.
    solution: 'Step 1: 0.6/3. Step 2: 0.2 = 1/5 H.'
    mistakes:
      9/5: c12p6_L
      '5': c12p6_L
  - prompt: The number of turns per metre of a solenoid is doubled (same length and area). L becomes how many times larger?
    answer: '4'
    check: 2**2
    difficulty: 2
    hints:
    - L = μ₀n²Al.
    - n is squared.
    solution: 'Step 1: n → 2n. Step 2: L × 4.'
    mistakes:
      '2': c12p6_L
      '8': c12p6_L
  - prompt: Current in an inductor doubles. Stored energy becomes how many times larger?
    answer: '4'
    check: 2**2
    difficulty: 2
    hints:
    - U ∝ I².
    - Square the factor.
    solution: 'Step 1: (2)² = 4. Step 2: 4 times.'
    mistakes:
      '2': c12p6_L
      '8': c12p6_L
  - prompt: At what angle (degrees) between the coil's normal and B is the generator's EMF largest?
    answer: '90'
    check: '90'
    difficulty: 3
    hints:
    - ε ∝ sin ωt while Φ ∝ cos ωt.
    - Flux changes fastest when it is zero.
    solution: 'Step 1: Φ = 0 at 90°. Step 2: dΦ/dt is largest there, so EMF peaks at 90°.'
    mistakes:
      '0': c12p6_L
      '45': c12p6_L
  - prompt: A switch suddenly breaks the current in a big coil, and a spark jumps. Why?
    options:
    - the fast drop in current induces a large self-EMF
    - the coil runs out of charge
    - the battery voltage rises
    answer: the fast drop in current induces a large self-EMF
    difficulty: 3
    hints:
    - ε = L dI/dt.
    - dI/dt is huge when current stops suddenly.
    solution: 'Step 1: rapid change gives a large EMF. Step 2: it can jump the gap as a spark.'
    mistakes:
      the coil runs out of charge: c12p6_lenz
      the battery voltage rises: c12p6_lenz
