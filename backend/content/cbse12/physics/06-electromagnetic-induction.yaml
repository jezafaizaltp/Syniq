# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse12-phy
chapter: 6
title: Electromagnetic Induction
tips:
  c12p_faraday: 'Induced EMF = −dΦ/dt: it depends on how FAST the flux changes, not on how big the flux is.'
  c12p_lenz: 'Lenz''s law: the induced current flows so as to OPPOSE the change in flux that causes it.'
  p12_faraday: "EMF = N ΔΦ/Δt."
  p12_flux_mag: "Φ = BA when the field is perpendicular to the loop."
  p12_generator: "A turbine turns the coil. What kind of energy goes in?"
  p12_inductor_energy: "U = ½LI²."
  p12_lamination: "Thin insulated sheets break up the loops of induced current in the core."
  p12_motional: "EMF = BLv."
  p12_mutual: "EMF = M dI/dt."
  p12_peak_emf: "e₀ = NBAω."
  p12_self_emf: "EMF = L dI/dt."
  p12_units: "Tesla is field, weber flux, farad capacitance. Inductance is named after the American who studied self-induction."
concepts:
- code: cbse12p.emi.faraday
  title: Faraday's and Lenz's laws
  notes: |
    Experiments of Faraday and Henry. Magnetic flux Φ = B·A = BA cos θ (weber). Faraday's law: ε = −N dΦ/dt. Lenz's law (sign):
    induced current opposes the change; consequence of energy conservation. Motional EMF ε = Blv for a rod moving across a
    field. Eddy currents (braking, induction furnaces; reduced by laminated cores). (Energy considerations kept briefly.)
  explanations:
    text: 'Changing the magnetic field through a coil makes a voltage in it: that''s electromagnetic induction. The faster the change, the bigger the voltage. Lenz''s law says the induced current always tries to oppose the change that made it.'
    visual: 'Push a magnet into a coil: the meter needle flicks one way. Pull it out: it flicks the other way. Hold it still: nothing.'
    step_by_step: 'Step 1: Find the flux Φ = BA cos θ. Step 2: Find how much it changes and how fast. Step 3: ε = −N ΔΦ/Δt. Step 4: Use Lenz''s law for direction.'
    real_world: Bicycle dynamos and power-station generators make electricity by spinning coils near magnets.
  picture:
    kind: flow
    steps:
    - Magnet moves into coil
    - Flux through coil changes
    - 'EMF induced: ε = −N dΦ/dt'
    - Current opposes the change (Lenz)
    alt: 'Electromagnetic induction: changing flux induces an EMF whose current opposes the change.'
  activity:
    type: formula
    prompt: 'Faraday: a coil of N turns gets an EMF ε = N × ΔΦ ÷ Δt, with Φ = BA.'
    inputs:
    - name: n
      label: Turns N
      min: 10
      max: 100
      step: 10
      start: 10
    - name: b
      label: Change in B
      min: 0.1
      max: 2
      step: 0.1
      start: 0.1
      unit: T
    - name: a
      label: Coil area A
      min: 10
      max: 200
      step: 10
      start: 10
      unit: cm²
    - name: t
      label: Time taken Δt
      min: 0.1
      max: 2
      step: 0.1
      start: 2
      unit: s
    outputs:
    - name: emf
      label: EMF
      expr: n*b*a*0.0001/t
      unit: V
      places: 3
    goals:
    - prompt: 50 turns, area 100 cm², B changes by 0.4 T. How quickly must it change to give 2 V?
      want:
        n: 50
        b: 0.4
        a: 100
        emf: 2
      mistakes:
      - when:
          n: 50
          b: 0.4
          a: 100
          t:
          - 0.2
          - 2
        say: 'A slower change gives a smaller EMF: ε = NΔΦ ÷ Δt. Make the change faster.'
    - prompt: Keep Δt = 0.1 s, B change 0.4 T and area 100 cm². Choose N for 4 V.
      want:
        t: 0.1
        b: 0.4
        a: 100
        emf: 4
      mistakes:
      - when:
          t: 0.1
          b: 0.4
          a: 100
          n:
          - 10
          - 90
        say: 'Not enough turns: each turn adds the same EMF, 0.04 V here.'
    - prompt: 10 turns, Δt = 1 s, B changes by 1 T. Choose the coil's area to make 0.1 V.
      want:
        n: 10
        t: 1
        b: 1
        emf: 0.1
      mistakes:
      - when:
          n: 10
          t: 1
          b: 1
          a:
          - 10
          - 90
        say: 'Too small. Use A in m² in Φ = BA: 0.1 = 10 × 1 × A ÷ 1 gives A = 0.01 m² = 100 cm².'
      - when:
          n: 10
          t: 1
          b: 1
          a:
          - 110
          - 200
        say: 'Too big: A = 0.01 m² = 100 cm².'
  items:
  - prompt: Flux through a 100-turn coil changes by 0.02 Wb in 0.1 s. Find the induced EMF (V).
    answer: '20'
    check: 100*Rational(2,100)/Rational(1,10)
    difficulty: 1
    hints:
    - ε = N ΔΦ/Δt.
    - 100 × 0.2.
    solution: 20 V.
    mistakes: {"0.2": "p12_faraday", "2": "p12_faraday", "200": "p12_faraday"}
  - prompt: A 0.5 m rod moves at 4 m/s across a 0.2 T field. Find the EMF (V).
    answer: '0.4'
    check: Rational(2,10)*Rational(1,2)*4
    difficulty: 1
    hints:
    - ε = Blv.
    - 0.2 × 0.5 × 4.
    solution: 0.4 V.
    mistakes: {"4": "p12_motional", "0.04": "p12_motional"}
  - prompt: A field of 0.5 T passes straight through a 0.2 m² loop. Find the flux (Wb).
    answer: '0.1'
    check: Rational(1,2)*Rational(2,10)
    difficulty: 1
    hints:
    - Φ = BA.
    - 0.5 × 0.2.
    solution: 0.1 Wb.
    mistakes: {"2.5": "p12_flux_mag", "1": "p12_flux_mag"}
  - prompt: 'A magnet held still inside a coil induces:'
    options:
    - no EMF
    - a steady EMF
    - a large EMF
    - an alternating EMF
    answer: no EMF
    difficulty: 1
    hints:
    - No change in flux.
    - dΦ/dt = 0.
    solution: No EMF.
    mistakes:
      a large EMF: c12p_faraday
  - prompt: 'Lenz''s law is a consequence of conservation of:'
    options:
    - energy
    - charge
    - momentum
    - mass
    answer: energy
    difficulty: 2
    hints:
    - "If the induced current helped the change, you would get something for nothing. Which law would that break?"
    - Opposition needs work.
    solution: Energy.
    mistakes:
      charge: c12p_lenz
  - prompt: 'Transformer cores are laminated to reduce:'
    options:
    - eddy currents
    - voltage
    - magnetic field
    - number of turns
    answer: eddy currents
    difficulty: 2
    hints:
    - Thin insulated sheets.
    - Less heating.
    solution: Eddy currents.
    mistakes: {"voltage": "p12_lamination", "magnetic field": "p12_lamination", "number of turns": "p12_lamination"}
- code: cbse12p.emi.inductance
  title: Inductance and the AC generator
  after:
  - cbse12p.emi.faraday
  notes: |
    Self-inductance L: Φ = LI, ε = −L dI/dt (henry); solenoid L = μ₀n²Al. Mutual inductance M: Φ₂ = MI₁, ε₂ = −M dI₁/dt.
    Energy stored in an inductor ½LI². AC generator: coil rotating in a field, ε = NBAω sin ωt, peak ε₀ = NBAω.
  explanations:
    text: An inductor resists changes in current through it, because the changing current induces an opposing voltage in itself. Two coils near each other can induce voltages in one another (mutual inductance). Spinning a coil in a magnetic field gives an alternating voltage.
    visual: Draw a coil spinning between two magnet poles. As it turns, the flux through it rises and falls, so the induced voltage swings up and down like a sine wave.
    step_by_step: 'Step 1: Self-induced EMF = L × rate of change of current. Step 2: Energy = ½LI². Step 3: Generator peak EMF = NBAω.'
    real_world: Wireless phone chargers use mutual inductance between a coil in the pad and one in the phone.
  picture:
    kind: number_line
    from: 0
    to: 4
    step: 1
    points:
    - at: 0
      label: ε = 0
    - at: 1
      label: peak +
    - at: 2
      label: ε = 0
    - at: 3
      label: peak −
    - at: 4
      label: ε = 0
    alt: 'An AC generator''s EMF over one turn, in quarter turns: zero, positive peak, zero, negative peak, zero.'
  activity:
    type: formula
    prompt: A coil of inductance L carrying current I stores ½LI². Switch the current off in 0.01 s and it pushes back with EMF L × I ÷ 0.01.
    inputs:
    - name: l
      label: Inductance L
      min: 0.1
      max: 2
      step: 0.1
      start: 0.1
      unit: H
    - name: i
      label: Current I
      min: 0.5
      max: 10
      step: 0.5
      start: 0.5
      unit: A
    outputs:
    - name: en
      label: Energy stored
      expr: 0.5*l*i^2
      unit: J
      places: 2
    - name: emf
      label: Back EMF when switched off in 0.01 s
      expr: l*i/0.01
      unit: V
      places: 1
    goals:
    - prompt: Store 4 J in a 0.5 H coil.
      want:
        l: 0.5
        en: 4
      mistakes:
      - when:
          l: 0.5
          i: 8
        say: 'Doubling I stores 4 times the energy: 16 J. E = ½LI², so I² = 16.'
      - when:
          l: 0.5
          i: 2
        say: 2 A stores only 1 J. E grows with I².
    - prompt: Switch off 2 A in 0.01 s. Choose L so the back EMF is 100 V.
      want:
        i: 2
        emf: 100
      mistakes:
      - when:
          i: 2
          l:
          - 0.6
          - 2
        say: 'Too big a kick: ε = L × 2 ÷ 0.01 = 200L.'
      - when:
          i: 2
          l:
          - 0.1
          - 0.4
        say: 'Not enough: ε = 200L here.'
    - prompt: 'A 2 H coil: find the current that stores 25 J.'
      want:
        l: 2
        en: 25
      mistakes:
      - when:
          l: 2
          i: 10
        say: 10 A stores 100 J.
      - when:
          l: 2
          i:
          - 5.5
          - 9.5
        say: 'Too much: ½ × 2 × I² = 25.'
  items:
  - prompt: Current in a 2 H inductor changes by 3 A in 1 s. Find the induced EMF (V).
    answer: '6'
    check: 2*3
    difficulty: 1
    hints:
    - ε = L dI/dt.
    - 2 × 3.
    solution: 6 V.
    mistakes: {"2/3": "p12_self_emf", "5": "p12_self_emf", "3/2": "p12_self_emf"}
  - prompt: Find the energy (J) stored in a 4 H inductor carrying 3 A.
    answer: '18'
    check: Rational(1,2)*4*3**2
    difficulty: 1
    hints:
    - ½LI².
    - ½ × 4 × 9.
    solution: 18 J.
    mistakes: {"36": "p12_inductor_energy", "12": "p12_inductor_energy", "6": "p12_inductor_energy"}
  - prompt: A generator coil has N = 100, B = 0.1 T, A = 0.1 m², ω = 50 rad/s. Find the peak EMF (V).
    answer: '50'
    check: 100*Rational(1,10)*Rational(1,10)*50
    difficulty: 2
    hints:
    - NBAω.
    - 100 × 0.1 × 0.1 × 50.
    solution: 50 V.
    mistakes: {"5": "p12_peak_emf", "500": "p12_peak_emf"}
  - prompt: Current in coil 1 changes at 5 A/s, and M = 0.4 H. Find the EMF in coil 2 (V).
    answer: '2'
    check: Rational(4,10)*5
    difficulty: 2
    hints:
    - ε = M dI/dt.
    - 0.4 × 5.
    solution: 2 V.
    mistakes: {"12.5": "p12_mutual", "5.4": "p12_mutual"}
  - prompt: 'The unit of inductance is the:'
    options:
    - henry
    - tesla
    - weber
    - farad
    answer: henry
    difficulty: 1
    hints:
    - "It is named after an American scientist who discovered self-induction around the time of Faraday."
    - H.
    solution: The henry.
    mistakes: {"tesla": "p12_units", "weber": "p12_units", "farad": "p12_units"}
  - prompt: 'An AC generator converts:'
    options:
    - mechanical energy into electrical energy
    - electrical into mechanical
    - heat into light
    - chemical into electrical
    answer: mechanical energy into electrical energy
    difficulty: 1
    hints:
    - Spinning coil.
    - Dynamo.
    solution: Mechanical energy into electrical.
    mistakes: {"electrical into mechanical": "p12_generator", "heat into light": "p12_generator", "chemical into electrical": "p12_generator"}
