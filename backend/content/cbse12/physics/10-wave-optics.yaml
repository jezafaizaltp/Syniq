# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse12-phy
chapter: 10
title: Wave Optics
tips:
  c12p_ydse: 'Fringe width β = λD/d: it grows with wavelength and screen distance, and shrinks as the slits move apart.'
  c12p_polar: Malus's law I = I₀cos²θ. Unpolarised light through one polariser loses half its intensity.
concepts:
- code: cbse12p.wave.huygens
  title: Huygens' principle and interference
  notes: |
    Wavefront: surface of equal phase; Huygens' principle: every point is a source of secondary wavelets; explains reflection
    and refraction (n = v₁/v₂). Coherent sources (constant phase difference). Interference: constructive when path difference =
    nλ, destructive when (n + ½)λ. Young's double-slit experiment: fringe width β = λD/d; bright and dark fringes equally
    spaced; intensity I = 4I₀cos²(φ/2).
  explanations:
    text: 'Light behaves like a wave. Huygens imagined each point on a wavefront sending out tiny wavelets. When light from two slits overlaps, the waves add up in some places (bright fringes) and cancel in others (dark fringes): interference.'
    visual: Draw two slits with circular waves spreading from each. Where crests meet crests, bright bands; where crests meet troughs, dark bands appear on the screen.
    step_by_step: 'Step 1: Path difference nλ → bright; (n + ½)λ → dark. Step 2: Fringe width β = λD/d. Step 3: Keep units consistent (metres).'
    real_world: The colours on soap bubbles and oil films come from interference of light reflected from the two surfaces.
  picture:
    kind: flow
    steps:
    - Light passes two slits
    - Two coherent waves spread out
    - 'Path difference nλ: bright'
    - 'Path difference (n + ½)λ: dark'
    alt: 'Young''s double-slit experiment: bright and dark fringes from interfering waves.'
  items:
  - prompt: In Young's experiment λ = 600 nm, D = 1 m, d = 1 mm. Find the fringe width (mm).
    answer: '0.6'
    check: 600*10**-9*1/10**-3*1000
    difficulty: 2
    hints:
    - β = λD/d.
    - 600 × 10⁻⁹ × 1/10⁻³ m.
    solution: 0.6 mm.
  - prompt: The slit separation is halved. By what factor does the fringe width change?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - β ∝ 1/d.
    - Doubles.
    solution: It doubles.
    mistakes:
      '0.5': c12p_ydse
  - prompt: For constructive interference, the path difference is nλ. Find it for n = 3 and λ = 500 nm (nm).
    answer: '1500'
    check: 3*500
    difficulty: 1
    hints:
    - 3 × 500.
    - nλ.
    solution: 1,500 nm.
  - prompt: 'Sources that keep a constant phase difference are called:'
    options:
    - coherent
    - incoherent
    - polarised
    - monochromatic only
    answer: coherent
    difficulty: 1
    hints:
    - Needed for steady fringes.
    - Same source split.
    solution: Coherent sources.
  - prompt: 'Huygens'' principle says every point on a wavefront:'
    options:
    - acts as a source of secondary wavelets
    - stops moving
    - reflects light
    - absorbs light
    answer: acts as a source of secondary wavelets
    difficulty: 2
    hints:
    - Wavelets spread.
    - New wavefront is their envelope.
    solution: Acts as a source of secondary wavelets.
  - prompt: 'Dark fringes occur where the path difference is:'
    options:
    - an odd multiple of λ/2
    - a whole multiple of λ
    - zero
    - 2λ only
    answer: an odd multiple of λ/2
    difficulty: 2
    hints:
    - Crest meets trough.
    - (n + ½)λ.
    solution: (n + ½)λ.
- code: cbse12p.wave.diffraction
  title: Diffraction and polarisation
  after:
  - cbse12p.wave.huygens
  notes: |
    Diffraction: bending around obstacles comparable to λ. Single slit: central bright maximum of angular width 2λ/a; minima
    at a sin θ = nλ. Resolving power (removed partly). Polarisation shows light is transverse: polaroids; Malus's law I =
    I₀cos²θ; unpolarised light through a polaroid → I₀/2. Brewster's law tan iₚ = n (reflected light fully polarised).
  explanations:
    text: Diffraction is light spreading as it passes through a narrow gap. Polarisation filters light so its vibrations are in one direction, which shows that light waves are transverse.
    visual: 'Picture two polaroid sheets: turn one until they''re crossed at 90° and almost no light gets through. In between, the brightness falls as cos²θ.'
    step_by_step: 'Step 1: Single slit minima: a sin θ = nλ. Step 2: Polariser: unpolarised light → half intensity. Step 3: Second polariser: I = I₀cos²θ.'
    real_world: Polarising sunglasses cut glare reflected from roads and water.
  picture:
    kind: compare
    columns:
    - title: Angle between polaroids
      points:
      - 0°
      - 45°
      - 60°
      - 90°
    - title: Fraction passed (cos²θ)
      points:
      - '1'
      - 1/2
      - 1/4
      - '0'
    alt: 'Malus''s law: fraction of polarised light passing a second polaroid at different angles.'
  items:
  - prompt: Unpolarised light of intensity 100 units passes one polaroid. Find the transmitted intensity.
    answer: '50'
    check: 100/2
    difficulty: 1
    hints:
    - Half passes.
    - 100/2.
    solution: 50 units.
  - prompt: Polarised light of intensity 80 units meets a polaroid at 60°. Find the transmitted intensity.
    answer: '20'
    check: 80*Rational(1,4)
    difficulty: 2
    hints:
    - I₀cos²θ.
    - 80 × 1/4.
    solution: 20 units.
    mistakes:
      '40': c12p_polar
  - prompt: Find the Brewster angle (degrees) for a medium with n = √3.
    answer: '60'
    check: '60'
    difficulty: 2
    hints:
    - tan iₚ = √3.
    - 60°.
    solution: 60°.
  - prompt: 'Polarisation shows that light waves are:'
    options:
    - transverse
    - longitudinal
    - mechanical
    - stationary
    answer: transverse
    difficulty: 1
    hints:
    - Vibrations ⟂ to travel.
    - Sound can't be polarised.
    solution: Transverse.
  - prompt: 'Diffraction is noticeable when the slit width is:'
    options:
    - comparable to the wavelength
    - much larger than the wavelength
    - zero
    - infinite
    answer: comparable to the wavelength
    difficulty: 2
    hints:
    - Narrow gaps.
    - Similar size.
    solution: Comparable to the wavelength.
  - prompt: 'In single-slit diffraction, the central maximum is:'
    options:
    - the brightest and widest
    - dark
    - the narrowest
    - absent
    answer: the brightest and widest
    difficulty: 2
    hints:
    - Twice as wide.
    - Most light.
    solution: The brightest and widest.
