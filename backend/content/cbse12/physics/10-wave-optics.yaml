# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse12-phy
chapter: 10
title: Wave Optics
tips:
  c12p_ydse: 'Fringe width β = λD/d: it grows with wavelength and screen distance, and shrinks as the slits move apart.'
  c12p_polar: Malus's law I = I₀cos²θ. Unpolarised light through one polariser loses half its intensity.
  p12_brewster: "tan θ_B = n. Which angle has tangent √3?"
  p12_central_max: "The central maximum is twice as wide as the others and carries most of the light."
  p12_coherent: "Two bulbs can't make steady fringes because their phase keeps changing."
  p12_dark_fringe: "Darkness needs waves to arrive exactly out of step: a crest on a trough."
  p12_diffraction_size: "Light bends noticeably only through very narrow gaps."
  p12_fringe_width: "β = λD/d. Convert nm and mm to metres."
  p12_huygens: "Huygens imagined each point as a tiny new source of waves."
  p12_path_diff: "Path difference = nλ."
  p12_polarisation: "Only waves that vibrate sideways can be filtered by direction."
  p12_polaroid: "An ideal polaroid passes half of unpolarised light."
  c12p10_int: 'Bright: path difference nλ. Dark: (n + ½)λ. Fringe width β = λD/d, so it grows with λ and D and shrinks with d.'
  c12p10_pol: "Ask what a polaroid does to each kind of light: one kind is just halved at any angle; the other follows I₀cos²θ and changes as you turn it."
  c12p10_diff: 'Single slit: minima at a sin θ = nλ; the central maximum is twice as wide as the others, angular width 2λ/a.'
concepts:
- code: cbse12p.wave.huygens
  title: Huygens' principle and interference
  notes: |
    Wavefront: surface of equal phase; Huygens' principle: every point is a source of secondary wavelets; explains reflection
    and refraction (n = v₁/v₂). Coherent sources (constant phase difference). Interference: constructive when path difference =
    nλ, destructive when (n + ½)λ. Young's double-slit experiment: fringe width β = λD/d; bright and dark fringes equally
    spaced; intensity I = 4I₀cos²(φ/2).
  explanations:
    text: 'Light behaves like a wave. Huygens imagined each point on a wavefront sending out tiny wavelets. When light from two slits overlaps, the waves add up in some places (bright fringes) and cancel in others (dark fringes): interference.'
    visual: Draw two slits with circular waves spreading from each. Where crests meet crests, bright bands; where crests meet troughs, dark bands appear on the screen.
    step_by_step: 'Step 1: Path difference nλ → bright; (n + ½)λ → dark. Step 2: Fringe width β = λD/d. Step 3: Keep units consistent (metres).'
    real_world: The colours on soap bubbles and oil films come from interference of light reflected from the two surfaces.
  picture:
    kind: flow
    steps:
    - Light passes two slits
    - Two coherent waves spread out
    - 'Path difference nλ: bright'
    - 'Path difference (n + ½)λ: dark'
    alt: 'Young''s double-slit experiment: bright and dark fringes from interfering waves.'
  activity:
    type: formula
    prompt: 'Young''s double slit: the fringe width is β = λD ÷ d.'
    inputs:
    - name: lam
      label: Wavelength λ
      min: 400
      max: 700
      step: 10
      start: 400
      unit: nm
    - name: dd
      label: Screen distance D
      min: 0.5
      max: 2
      step: 0.1
      start: 0.5
      unit: m
    - name: d
      label: Slit gap d
      min: 0.1
      max: 1
      step: 0.05
      start: 1
      unit: mm
    outputs:
    - name: beta
      label: Fringe width β
      expr: lam*dd/d/1000
      unit: mm
      places: 2
    goals:
    - prompt: λ = 600 nm and D = 1 m. Choose d so the fringes are 6 mm wide.
      want:
        lam: 600
        dd: 1
        beta: 6
      mistakes:
      - when:
          lam: 600
          dd: 1
          d:
          - 0.15
          - 1
        say: 'Slits further apart give NARROWER fringes: β = λD ÷ d. Bring them closer.'
    - prompt: D = 1 m and d = 0.2 mm. Choose the colour that makes 3.5 mm fringes.
      want:
        dd: 1
        d: 0.2
        beta: 3.5
      mistakes:
      - when:
          dd: 1
          d: 0.2
          lam:
          - 400
          - 690
        say: A shorter wavelength gives narrower fringes. Go redder.
    - prompt: λ = 500 nm, d = 0.25 mm. Move the screen so β = 4 mm.
      want:
        lam: 500
        d: 0.25
        beta: 4
      mistakes:
      - when:
          lam: 500
          d: 0.25
          dd:
          - 0.5
          - 1.9
        say: 'The fringes spread out further from the slits: β ∝ D. Move the screen back.'
  lesson:
    - teach: 'A wavefront joins points vibrating in the same phase. Huygens'' principle: every point on a wavefront acts as a source of secondary wavelets; their common tangent a moment later is the new wavefront. This explains reflection and refraction, with n = v₁/v₂.'
      check:
        prompt: 'Light goes from air into glass. According to Huygens'' construction, the wavelets in glass are:'
        options:
        - smaller, because light is slower
        - larger, because light is faster
        - the same size
        answer: smaller, because light is slower
        why: In the same time they travel a shorter distance.
      ways:
      - style: visual
        teach: 'Huygens'' construction: getting the next wavefront from the present one.'
        picture:
          kind: flow
          steps:
          - Take the wavefront now
          - Every point sends out a small spherical wavelet
          - After time t each wavelet has radius vt
          - Their common tangent is the new wavefront
          alt: Take the present wavefront; every point on it sends out a small spherical wavelet; after time t each has radius v t; the surface touching all of them is the new wavefront.
      - style: real_world
        teach: Drop a stone in a pond and a circular ripple spreads. If that ripple passes a row of posts, each gap starts its own small circle of ripples. Huygens imagined every point on a wave doing exactly this.
    - teach: Two coherent sources (constant phase difference) overlap to give interference. Bright (constructive) where the path difference is nλ; dark (destructive) where it is (n + ½)λ. Ordinary bulbs are not coherent; two slits lit by one source are.
      check:
        prompt: 'Path difference 2.5λ gives:'
        options:
        - a dark fringe
        - a bright fringe
        - no light at all anywhere
        answer: a dark fringe
        why: 2.5λ = (2 + ½)λ.
      ways:
      - style: visual
        teach: Where bright and dark fringes form, by path difference.
        picture:
          kind: compare
          columns:
          - title: Bright (constructive)
            points:
            - Path difference 0, λ, 2λ, …
            - Crests meet crests
          - title: Dark (destructive)
            points:
            - Path difference λ/2, 3λ/2, …
            - Crests meet troughs
          alt: Bright fringes form where the path difference is 0, lambda, 2 lambda and so on, so crests meet crests. Dark fringes form where it is half a wavelength, 3 halves and so on, so crests meet troughs.
      - style: step_by_step
        teach: 'Light of λ = 450 nm from two coherent slits. Step 1: At point P the path difference is 1350 nm. Step 2: 1350/450 = 3, a whole number. Step 3: So the waves arrive in step. Step 4: P is the 3rd bright fringe from the centre.'
    - teach: 'Young''s double slit: fringes are equally spaced with fringe width β = λD/d (D = screen distance, d = slit gap). Intensity I = 4I₀cos²(φ/2): bright fringes are four times one slit''s intensity.'
      picture:
        kind: bars
        bars:
        - label: −2β
          value: 4
        - label: −β
          value: 4
        - label: '0'
          value: 4
        - label: β
          value: 4
        - label: 2β
          value: 4
        alt: Bright fringes of equal brightness spaced evenly at distances β apart on the screen.
      check:
        prompt: 'Doubling D makes β:'
        options:
        - double
        - half
        - the same
        answer: double
        why: β ∝ D.
      ways:
      - style: step_by_step
        teach: 'Young''s experiment with λ = 700 nm, D = 1.5 m, d = 0.5 mm. Step 1: β = λD/d. Step 2: β = 700 × 10⁻⁹ × 1.5 / 0.5 × 10⁻³. Step 3: β = 2.1 × 10⁻³ m. Step 4: Fringes are 2.1 mm apart.'
      - style: real_world
        teach: 'Noise-cancelling headphones use destructive interference: they play a sound wave exactly half a wavelength out of step with the outside noise, so crests meet troughs and the noise fades. Young''s dark fringes work the same way with light.'
  items:
  - prompt: In Young's experiment λ = 600 nm, D = 1 m, d = 1 mm. Find the fringe width (mm).
    answer: '0.6'
    check: 600*10**-9*1/10**-3*1000
    difficulty: 2
    hints:
    - β = λD/d.
    - 600 × 10⁻⁹ × 1/10⁻³ m.
    solution: "β = λD/d = (600 × 10⁻⁹ × 1)/(1 × 10⁻³) = 6 × 10⁻⁴ m = 0.6 mm."
    mistakes: {"6": "p12_fringe_width", "0.06": "p12_fringe_width"}
  - prompt: The slit separation is halved. By what factor does the fringe width change?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - β ∝ 1/d.
    - Doubles.
    solution: "β = λD/d, so β is inversely proportional to d. Halving d doubles β: the factor is 2."
    mistakes:
      '0.5': c12p_ydse
  - prompt: For constructive interference, the path difference is nλ. Find it for n = 3 and λ = 500 nm (nm).
    answer: '1500'
    check: 3*500
    difficulty: 1
    hints:
    - 3 × 500.
    - nλ.
    solution: "Path difference = nλ = 3 × 500 = 1,500 nm."
    mistakes: {"500": "p12_path_diff", "1000": "p12_path_diff", "1500.5": "p12_path_diff"}
  - prompt: 'Sources that keep a constant phase difference are called:'
    options:
    - coherent
    - incoherent
    - polarised
    - monochromatic only
    answer: coherent
    difficulty: 1
    hints:
    - Needed for steady fringes.
    - Same source split.
    solution: "Coherent sources keep a fixed phase difference, so the bright and dark fringes stay still and can be seen."
    mistakes: {"incoherent": "p12_coherent", "polarised": "p12_coherent", "monochromatic only": "p12_coherent"}
  - prompt: 'Huygens'' principle says every point on a wavefront:'
    options:
    - acts as a source of secondary wavelets
    - stops moving
    - reflects light
    - absorbs light
    answer: acts as a source of secondary wavelets
    difficulty: 2
    hints:
    - Wavelets spread.
    - New wavefront is their envelope.
    solution: Acts as a source of secondary wavelets.
    mistakes: {"stops moving": "p12_huygens", "reflects light": "p12_huygens", "absorbs light": "p12_huygens"}
  - prompt: 'Dark fringes occur where the path difference is:'
    options:
    - an odd multiple of λ/2
    - a whole multiple of λ
    - zero
    - 2λ only
    answer: an odd multiple of λ/2
    difficulty: 2
    hints:
    - Crest meets trough.
    - (n + ½)λ.
    solution: "Dark fringes need crest meeting trough: path difference = (n + ½)λ, an odd multiple of λ/2."
    mistakes: {"a whole multiple of λ": "p12_dark_fringe", "zero": "p12_dark_fringe", "2λ only": "p12_dark_fringe"}
  - prompt: 'Young''s experiment: λ = 500 nm, D = 2 m, d = 1 mm. Find β (mm).'
    answer: '1'
    check: 500*10**-9*2/(10**-3)*1000
    difficulty: 1
    hints:
    - β = λD/d.
    - 5 × 10⁻⁷ × 2 / 10⁻³.
    solution: 'Step 1: 10⁻³ m. Step 2: 1 mm.'
    mistakes:
      '2': c12p10_int
      1/2: c12p10_int
  - prompt: The wavelength is doubled (same D and d). By what factor does β change?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - β ∝ λ.
    - Double λ.
    solution: 'Step 1: β ∝ λ. Step 2: factor 2.'
    mistakes:
      '4': c12p10_int
      1/2: c12p10_int
  - prompt: For destructive interference with n = 1 and λ = 600 nm, find the path difference (nm).
    answer: '900'
    check: Rational(3,2)*600
    difficulty: 1
    hints:
    - 'Dark: (n + ½)λ.'
    - 1.5 × 600.
    solution: 'Step 1: 1.5 × 600. Step 2: 900 nm.'
    mistakes:
      '600': c12p10_int
      '1200': c12p10_int
  - prompt: Light speeds are 3 × 10⁸ m/s in air and 2 × 10⁸ m/s in glass. By Huygens, n of glass as a fraction?
    answer: 3/2
    check: Rational(3,2)
    difficulty: 2
    hints:
    - n = v₁/v₂.
    - 3/2.
    solution: 'Step 1: 3 × 10⁸/2 × 10⁸. Step 2: 3/2.'
    mistakes:
      2/3: c12p10_int
      '1': c12p10_int
  - prompt: Each slit alone gives intensity I₀. Intensity at a bright fringe, in units of I₀?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Amplitudes add, then square.
    - (2A)² = 4A².
    solution: 'Step 1: amplitude doubles. Step 2: intensity × 4.'
    mistakes:
      '2': c12p10_int
      '1': c12p10_int
  - prompt: Distance of the 3rd bright fringe from the centre, if β = 0.5 mm (mm), as a fraction?
    answer: 3/2
    check: 3*Rational(1,2)
    difficulty: 2
    hints:
    - Bright fringes are at nβ.
    - 3 × 0.5.
    solution: 'Step 1: 3β. Step 2: 1.5 mm.'
    mistakes:
      5/4: c12p10_int
      '1': c12p10_int
  - prompt: The whole Young's apparatus is put in water (n = 4/3). β becomes what fraction of its value in air?
    answer: 3/4
    check: Rational(3,4)
    difficulty: 2
    hints:
    - λ in water = λ/n.
    - β ∝ λ.
    solution: 'Step 1: λ → 3λ/4. Step 2: β → 3β/4.'
    mistakes:
      4/3: c12p10_int
      '1': c12p10_int
  - prompt: Why don't two separate torch bulbs give a steady interference pattern?
    options:
    - they are not coherent
    - their light is too bright
    - they are too far apart to shine
    answer: they are not coherent
    difficulty: 3
    hints:
    - Their phase difference changes randomly.
    - The fringes would shift too fast to see.
    solution: 'Step 1: independent sources have random phases. Step 2: not coherent, so no steady pattern.'
    mistakes:
      their light is too bright: c12p10_int
      they are too far apart to shine: c12p10_int
  - prompt: At a point the phase difference is 120° (2π/3). Intensity in units of I₀ (single-slit intensity)?
    answer: '1'
    check: 4*cos(pi/3)**2
    difficulty: 3
    hints:
    - I = 4I₀cos²(φ/2).
    - cos 60° = 1/2.
    solution: 'Step 1: 4 × 1/4. Step 2: I₀.'
    mistakes:
      '2': c12p10_int
      '3': c12p10_int
  - prompt: 'Assertion (A): Two separate sodium lamps cannot produce a steady interference pattern.

      Reason (R): Light from two independent sources does not keep a constant phase difference.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Each lamp's phase changes randomly millions of times a second, so the fringes shift too fast to see. Coherence needs a constant phase difference, which is why A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A physics lab sets up Young''s experiment with a red laser (λ = 650 nm), slits 0.25 mm apart and a screen 2 m away. How far apart are the bright fringes?'
    options:
    - 5.2 mm
    - 2.6 mm
    - 0.52 mm
    answer: 5.2 mm
    hints:
    - β = λD/d.
    - 650 × 10⁻⁹ × 2 / 0.25 × 10⁻³.
    solution: β = 650 × 10⁻⁹ × 2 / (0.25 × 10⁻³) = 5.2 × 10⁻³ m = 5.2 mm.
    mistakes:
      2.6 mm: c12p10_int
      0.52 mm: c12p10_int
    exam: case
    difficulty: 2
  - prompt: A student wants wider fringes in Young's experiment. Which change works?
    options:
    - Move the screen further from the slits
    - Move the slits further apart
    - Use blue light instead of red
    answer: Move the screen further from the slits
    hints:
    - β = λD/d.
    - Which change makes λD/d larger?
    solution: β grows with D, so moving the screen away widens the fringes. A larger d or the shorter λ of blue light would make them narrower.
    mistakes:
      Move the slits further apart: c12p10_int
      Use blue light instead of red: c12p10_int
    exam: competency
    difficulty: 2
- code: cbse12p.wave.diffraction
  title: Diffraction and polarisation
  after:
  - cbse12p.wave.huygens
  notes: |
    Diffraction: bending around obstacles comparable to λ. Single slit: central bright maximum of angular width 2λ/a; minima
    at a sin θ = nλ. Resolving power (removed partly). Polarisation shows light is transverse: polaroids; Malus's law I =
    I₀cos²θ; unpolarised light through a polaroid → I₀/2. Brewster's law tan iₚ = n (reflected light fully polarised).
  explanations:
    text: Diffraction is light spreading as it passes through a narrow gap. Polarisation filters light so its vibrations are in one direction, which shows that light waves are transverse.
    visual: 'Picture two polaroid sheets: turn one until they''re crossed at 90° and almost no light gets through. In between, the brightness falls as cos²θ.'
    step_by_step: 'Step 1: Single slit minima: a sin θ = nλ. Step 2: Polariser: unpolarised light → half intensity. Step 3: Second polariser: I = I₀cos²θ.'
    real_world: Polarising sunglasses cut glare reflected from roads and water.
  picture:
    kind: compare
    columns:
    - title: Angle between polaroids
      points:
      - 0°
      - 45°
      - 60°
      - 90°
    - title: Fraction passed (cos²θ)
      points:
      - '1'
      - 1/2
      - 1/4
      - '0'
    alt: 'Malus''s law: fraction of polarised light passing a second polaroid at different angles.'
  activity:
    type: formula
    prompt: 'Single slit of width a: the central bright band is 2λD ÷ a wide. Here D = 1 m.'
    inputs:
    - name: lam
      label: Wavelength λ
      min: 400
      max: 700
      step: 10
      start: 400
      unit: nm
    - name: a
      label: Slit width a
      min: 0.05
      max: 1
      step: 0.05
      start: 1
      unit: mm
    outputs:
    - name: w
      label: Central band width
      expr: 2*lam/a/1000
      unit: mm
      places: 2
    goals:
    - prompt: λ = 500 nm. Choose the slit width so the central band is 4 mm wide.
      want:
        lam: 500
        w: 4
      mistakes:
      - when:
          lam: 500
          a: 0.5
        say: 'That gives 2 mm. A NARROWER slit spreads the light more: w = 2λD ÷ a.'
      - when:
          lam: 500
          a:
          - 0.3
          - 1
        say: 'Too wide a slit: the band is too narrow.'
    - prompt: Keep a = 0.25 mm. Which wavelength makes the band 5.6 mm wide?
      want:
        a: 0.25
        w: 5.6
      mistakes:
      - when:
          a: 0.25
          lam:
          - 400
          - 690
        say: A shorter wavelength spreads less. Go redder.
    - prompt: Make diffraction as strong as possible with red light (700 nm).
      want:
        lam: 700
        a: 0.05
      mistakes:
      - when:
          lam: 700
          a:
          - 0.1
          - 1
        say: A narrower slit spreads the light further.
  lesson:
    - teach: Diffraction is the bending of waves round edges and through openings. It is noticeable when the opening is comparable to the wavelength. Light's tiny wavelength is why we usually see sharp shadows; sound bends easily round doors.
      check:
        prompt: Why do we hear round corners but not see round them?
        options:
        - sound's wavelength is much larger than light's
        - light is faster
        - sound is a particle
        answer: sound's wavelength is much larger than light's
        why: Diffraction is large when the gap is comparable to λ.
      ways:
      - style: visual
        teach: 'When diffraction is easy to notice: opening size compared with wavelength.'
        picture:
          kind: compare
          columns:
          - title: Sound through a door
            points:
            - λ ≈ 1 m, door ≈ 1 m
            - 'Bends easily: heard round corners'
          - title: Light through a door
            points:
            - λ ≈ 5 × 10⁻⁷ m, door ≈ 1 m
            - 'Hardly bends: sharp shadows'
          alt: Sound has a wavelength of about a metre, similar to a doorway, so it bends easily and is heard round corners. Light's wavelength is about half a millionth of a metre, far smaller, so it hardly bends and casts sharp shadows.
      - style: real_world
        teach: You can hear people talking in the next room through an open door, but you cannot see them round the corner. Sound waves are about as wide as the doorway and bend through it; light waves are millions of times smaller and barely bend.
    - teach: 'Single slit of width a: minima where a sin θ = nλ (n = 1, 2, …). The central maximum is the brightest and twice as wide as the others, with angular width 2λ/a: a narrower slit spreads light more.'
      picture:
        kind: bars
        bars:
        - label: 2nd side
          value: 1
        - label: 1st side
          value: 4
        - label: central
          value: 100
        - label: 1st side
          value: 4
        - label: 2nd side
          value: 1
        alt: 'Single-slit pattern: a very bright central maximum with much weaker side maxima.'
      check:
        prompt: 'Halving the slit width makes the central maximum:'
        options:
        - twice as wide
        - half as wide
        - unchanged
        answer: twice as wide
        why: Width ∝ 1/a.
      ways:
      - style: step_by_step
        teach: 'Single slit, a = 0.2 mm, λ = 500 nm, screen 2 m away. Step 1: First minimum: sin θ ≈ θ = λ/a = 2.5 × 10⁻³ rad. Step 2: Distance on the screen = θ × 2 m = 5 mm. Step 3: The central maximum runs from −5 mm to +5 mm. Step 4: So it is 10 mm wide.'
      - style: real_world
        teach: 'Squint at a street light through your eyelashes or a fine cloth: you see a spread of light and coloured fringes. The narrow gaps diffract the light, and the narrower the gap, the wider the spread.'
    - teach: 'Polarisation shows light is transverse. A polaroid passes only one direction of vibration: unpolarised light comes out at half intensity, polarised. A second polaroid at angle θ passes I = I₀cos²θ (Malus''s law). Reflected light is fully polarised at Brewster''s angle, tan iₚ = n.'
      check:
        prompt: 'Two polaroids crossed at 90°: transmitted intensity?'
        options:
        - zero
        - half
        - a quarter
        answer: zero
        why: cos² 90° = 0.
      ways:
      - style: visual
        teach: What polaroids do to unpolarised and polarised light.
        picture:
          kind: flow
          steps:
          - Unpolarised light, intensity I
          - 'First polaroid: I/2, now polarised'
          - 'Second polaroid at angle θ: (I/2)cos²θ'
          - 'At θ = 90°: no light gets through'
          alt: Unpolarised light of intensity I passes the first polaroid and comes out polarised at half intensity. A second polaroid at angle theta passes I over 2 times cos squared theta, and at 90 degrees no light gets through.
      - style: step_by_step
        teach: 'Brewster''s angle for water, n = 1.33. Step 1: tan iₚ = n. Step 2: iₚ = tan⁻¹(1.33). Step 3: iₚ ≈ 53°. Step 4: Light reflected off a lake at 53° is fully polarised, which is why polaroid sunglasses cut that glare.'
  items:
  - prompt: Unpolarised light of intensity 100 units passes one polaroid. Find the transmitted intensity.
    answer: '50'
    check: 100/2
    difficulty: 1
    hints:
    - Half passes.
    - 100/2.
    solution: "A polaroid passes half of unpolarised light: I = I₀/2 = 100/2 = 50 units."
    mistakes: {"100": "p12_polaroid", "25": "p12_polaroid"}
  - prompt: Polarised light of intensity 80 units meets a polaroid at 60°. Find the transmitted intensity.
    answer: '20'
    check: 80*Rational(1,4)
    difficulty: 2
    hints:
    - I₀cos²θ.
    - 80 × 1/4.
    solution: "Malus's law: I = I₀ cos²θ = 80 × (1/2)² = 80 × 1/4 = 20 units."
    mistakes:
      '40': c12p_polar
  - prompt: Find the Brewster angle (degrees) for a medium with n = √3.
    answer: '60'
    check: '60'
    difficulty: 2
    hints:
    - tan iₚ = √3.
    - 60°.
    solution: "tan θ_B = n = √3, so θ_B = 60°."
