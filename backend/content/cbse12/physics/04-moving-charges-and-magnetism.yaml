# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse12-phy
chapter: 4
title: Moving Charges and Magnetism
tips:
  c12p_force: 'Force on a moving charge F = qvB sin θ: zero when it moves along the field, greatest at right angles.'
  c12p_rhr: Use Fleming's left-hand rule (or the right-hand palm rule) for the force direction on a current.
  p12_ammeter: "An ammeter must have very low resistance. A shunt lets most current bypass the galvanometer."
  p12_constants: "9 × 10⁹ is Coulomb's k, 8.85 × 10⁻¹² is ε₀, 1.6 × 10⁻¹⁹ is e. μ₀ involves π."
  p12_force_wire: "F = BIL sin θ, with θ = 90°."
  p12_moment: "m = NIA."
  p12_no_work: "Work = F·d. If the force is always at 90° to the motion, what is the dot product?"
  p12_parallel_wires: "Like currents attract; unlike currents repel. (The opposite of charges!)"
  p12_solenoid: "B = μ₀nI = 4π × 10⁻⁷ × n × I."
  p12_solenoid_uniform: "Inside a long solenoid, field lines are straight, parallel and evenly spaced."
  p12_wire_field: "B = μ₀I/(2πr)."
  p12_wire_inverse: "B ∝ 1/r for a long wire, not 1/r²."
  c12p4_force: Magnetic force on a charge is qvB sin θ and on a wire IlB sin θ; θ is the angle between v (or I) and B.
  c12p4_circle: In a uniform field a charge circles with r = mv/(qB); the period 2πm/(qB) does not depend on speed.
  c12p4_field: 'Pick the right formula for the shape: wire μ₀I/(2πr), loop centre μ₀NI/(2R), solenoid μ₀nI.'
  c12p4_meter: 'Ammeter: small shunt in parallel. Voltmeter: large resistance in series.'
concepts:
- code: cbse12p.mag.force
  title: Magnetic force and motion of charges
  notes: |
    Oersted's experiment: currents make magnetic fields. Lorentz force F = q(E + v × B); magnetic force qvB sin θ,
    perpendicular to v (does no work). Charge in a uniform field: circular path r = mv/(qB), period T = 2πm/(qB)
    (independent of speed); helical if v has a component along B. Force on a current-carrying conductor F = IlB sin θ
    (Fleming's left-hand rule). Force between parallel currents: attract if same direction (definition of ampere). Torque on
    a current loop τ = NIAB sin θ; magnetic moment m = NIA. Moving coil galvanometer; conversion to ammeter (shunt) and
    voltmeter (series resistance).
  explanations:
    text: A magnetic field pushes on moving charges and on wires carrying current. The push is sideways to the motion, so a charge in a uniform field goes round in a circle. Coils in a field feel a turning force, which is how meters and motors work.
    visual: 'Hold your left hand with thumb, first and second fingers at right angles: First finger = Field, seCond finger = Current, thuMb = Motion (force).'
    step_by_step: 'Step 1: Write F = qvB sin θ or IlB sin θ. Step 2: Find the direction with the left-hand rule. Step 3: For circles, r = mv/(qB).'
    real_world: Electric motors in fans and mixers turn because current-carrying coils feel forces in a magnetic field.
  picture:
    kind: flow
    steps:
    - Charge moves in field B
    - Force qvB at right angles
    - Path bends into a circle
    - r = mv/(qB)
    alt: A charge moving across a uniform magnetic field is pushed sideways into a circular path.
  activity:
    type: formula
    prompt: A charged particle in a magnetic field moves in a circle of radius r = mv ÷ (qB). Mass in proton masses, charge in units of e.
    inputs:
    - name: v
      label: Speed (× 10⁶ m/s)
      min: 1
      max: 10
      step: 1
      start: 1
    - name: b
      label: Field B
      min: 0.1
      max: 2
      step: 0.1
      start: 0.1
      unit: T
    - name: m
      label: Mass (proton masses)
      min: 1
      max: 4
      step: 1
      start: 1
    - name: q
      label: Charge (units of e)
      min: 1
      max: 2
      step: 1
      start: 1
    outputs:
    - name: r
      label: Radius
      expr: 1.044*m*v/(q*b)
      unit: cm
      places: 2
    goals:
    - prompt: A proton at 2 × 10⁶ m/s in 0.5 T circles at 4.18 cm. Change only the speed to make the radius 8.35 cm.
      want:
        b: 0.5
        m: 1
        q: 1
        r:
        - 8.3
        - 8.4
      mistakes:
      - when:
          b: 0.5
          m: 1
          q: 1
          v: 8
        say: '4 times the speed gives 4 times the radius: r ∝ v, not v². Twice the radius needs twice the speed.'
      - when:
          b: 0.5
          m: 1
          q: 1
          v: 3
        say: 1.5 times the speed gives 1.5 times the radius. Twice the radius needs twice the speed.
    - prompt: The same proton at 2 × 10⁶ m/s. Change only B so the radius is 2.09 cm.
      want:
        m: 1
        q: 1
        v: 2
        r:
        - 2.08
        - 2.1
      mistakes:
      - when:
          m: 1
          q: 1
          v: 2
          b: 0.3
        say: 'A weaker field bends less: a bigger circle. r ∝ 1/B, so halve the radius by doubling B.'
      - when:
          m: 1
          q: 1
          v: 2
          b: 0.2
        say: 'A weaker field bends less: a bigger circle. r ∝ 1/B, so halve the radius by doubling B.'
    - prompt: An α-particle (4 proton masses, charge 2e) at 2 × 10⁶ m/s in 0.5 T. Set it up.
      want:
        m: 4
        q: 2
        v: 2
        b: 0.5
      mistakes:
      - when:
          m: 4
          q: 1
        say: 'An α-particle carries charge 2e: two protons.'
      - when:
          m: 2
          q: 2
        say: 'An α-particle has 2 protons AND 2 neutrons: mass 4.'
  lesson:
    - teach: 'Oersted found that a current deflects a compass: moving charges make magnetic fields. A charge q moving with velocity v in field B feels F = qvB sin θ, at right angles to both v and B. Since the force is always perpendicular to v, it does no work and never changes the speed.'
      check:
        prompt: 'A charge moves at 90° to B. Its speed:'
        options:
        - stays the same
        - increases
        - decreases
        answer: stays the same
        why: The force is perpendicular to motion, so no work is done.
      ways:
      - style: visual
        teach: How the magnetic force on a moving charge depends on its direction to the field.
        picture:
          kind: compare
          columns:
          - title: Along B (θ = 0°)
            points:
            - sin 0° = 0
            - No force
          - title: At an angle θ
            points:
            - F = qvB sin θ
            - Part of the full force
          - title: At right angles (θ = 90°)
            points:
            - sin 90° = 1
            - Largest force, qvB
          alt: Moving along the field there is no force. At an angle theta the force is q v B sin theta. At right angles the force is largest, q v B.
      - style: step_by_step
        teach: 'A proton moves at 10⁶ m/s at right angles to a 0.5 T field. Step 1: q = 1.6 × 10⁻¹⁹ C, sin 90° = 1. Step 2: F = qvB. Step 3: F = 1.6 × 10⁻¹⁹ × 10⁶ × 0.5. Step 4: F = 8 × 10⁻¹⁴ N.'
    - teach: 'In a uniform field, a charge moving at right angles to B goes in a circle: qvB = mv²/r, so r = mv/(qB) and period T = 2πm/(qB), the same at any speed. If v also has a part along B, the path is a helix.'
      picture:
        kind: flow
        steps:
        - Force qvB ⟂ v
        - Acts as centripetal force
        - qvB = mv²/r
        - r = mv/(qB)
        - T = 2πm/(qB)
        alt: How the magnetic force produces circular motion and its radius.
      check:
        prompt: 'Doubling a proton''s speed in the same field makes its circle radius:'
        options:
        - double
        - half
        - the same
        answer: double
        why: r ∝ v.
      ways:
      - style: step_by_step
        teach: 'Radius of that proton''s circle. Step 1: r = mv/(qB). Step 2: m = 1.67 × 10⁻²⁷ kg, v = 10⁶ m/s. Step 3: r = 1.67 × 10⁻²¹ / (8 × 10⁻²⁰). Step 4: r ≈ 0.021 m, about 2 cm.'
      - style: real_world
        teach: 'A cyclotron speeds up particles by kicking them each half-turn. It works because the time for one circle, T = 2πm/(qB), does not depend on speed: faster particles go in bigger circles but arrive back at the same moment.'
    - teach: 'A wire of length l carrying current I in field B feels F = IlB sin θ (Fleming''s left-hand rule). Parallel currents in the same direction attract. A coil of N turns, area A has magnetic moment m = NIA and feels torque τ = NIAB sin θ: this turns a galvanometer''s coil.'
      check:
        prompt: 'Two parallel wires carry currents in opposite directions. They:'
        options:
        - repel
        - attract
        - feel no force
        answer: repel
        why: Opposite currents repel; like currents attract.
      ways:
      - style: visual
        teach: How a moving-coil galvanometer turns a current into a pointer reading.
        picture:
          kind: flow
          steps:
          - Current I flows in the coil
          - Field gives torque τ = NIAB
          - Spring twists back until it balances
          - Deflection is proportional to I
          alt: Current flows in the coil, the magnetic field gives a torque N I A B, a spring twists back until it balances, and the deflection is proportional to the current.
      - style: step_by_step
        teach: 'Force on a wire. Step 1: l = 0.4 m, I = 5 A, B = 0.25 T, at 90°. Step 2: F = IlB sin θ. Step 3: F = 5 × 0.4 × 0.25 × 1. Step 4: F = 0.5 N, direction by Fleming''s left-hand rule.'
  items:
  - prompt: A 2 m wire carries 5 A at right angles to a 0.3 T field. Find the force (N).
    answer: '3'
    check: 5*2*Rational(3,10)
    difficulty: 1
    hints:
    - F = IlB.
    - 5 × 2 × 0.3.
    solution: 3 N.
    mistakes: {"30": "p12_force_wire", "7.5": "p12_force_wire"}
  - prompt: A charge moves parallel to a magnetic field. What is the magnetic force on it?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - sin 0 = 0.
    - Along the field.
    solution: '0.'
    mistakes:
      '1': c12p_force
  - prompt: A coil of 100 turns, area 0.01 m², carries 2 A. Find its magnetic moment (A m²).
    answer: '2'
    check: 100*2*Rational(1,100)
    difficulty: 2
    hints:
    - m = NIA.
    - 100 × 2 × 0.01.
    solution: 2 A m².
    mistakes: {"0.02": "p12_moment", "200": "p12_moment"}
  - prompt: 'Two parallel wires carrying currents in the same direction:'
    options:
    - attract each other
    - repel each other
    - feel no force
    - twist
    answer: attract each other
    difficulty: 2
    hints:
    - Like currents attract.
    - Opposite to charges.
    solution: They attract.
    mistakes: {"repel each other": "p12_parallel_wires", "feel no force": "p12_parallel_wires", "twist": "p12_parallel_wires"}
  - prompt: 'The magnetic force on a moving charge does no work because:'
    options:
    - it is always perpendicular to the velocity
    - it is zero
    - it acts along the motion
    - charges have no mass
    answer: it is always perpendicular to the velocity
    difficulty: 2
    hints:
    - W = F·d.
    - 90°.
    solution: It's perpendicular to the motion, so speed doesn't change.
    mistakes: {"it is zero": "p12_no_work", "it acts along the motion": "p12_no_work", "charges have no mass": "p12_no_work"}
  - prompt: 'A galvanometer is converted into an ammeter by connecting:'
    options:
    - a low resistance in parallel (shunt)
    - a high resistance in series
    - a capacitor
    - a battery
    answer: a low resistance in parallel (shunt)
    difficulty: 2
    hints:
    - Most current bypasses.
    - Shunt.
    solution: A low shunt resistance in parallel.
    mistakes: {"a high resistance in series": "p12_ammeter", "a capacitor": "p12_ammeter", "a battery": "p12_ammeter"}
  - prompt: A 0.5 m wire carries 4 A at right angles to a 0.2 T field. Find the force (N) as a fraction.
    answer: 2/5
    check: 4*Rational(1,2)*Rational(2,10)
    difficulty: 1
    hints:
    - F = IlB.
    - 4 × 0.5 × 0.2.
    solution: 'Step 1: 0.4 N. Step 2: 2/5.'
    mistakes:
      '4': c12p4_force
      1/10: c12p4_force
  - prompt: A wire carries 2 A at 30° to a 0.5 T field; length 1 m. Find the force (N) as a fraction.
    answer: 1/2
    check: 2*1*Rational(1,2)*Rational(1,2)
    difficulty: 1
    hints:
    - F = IlB sin θ.
    - sin 30° = 1/2.
    solution: 'Step 1: 2 × 1 × 0.5 × 0.5. Step 2: 1/2 N.'
    mistakes:
      '1': c12p4_force
      1/4: c12p4_force
  - prompt: A coil of 50 turns, area 0.02 m², carries 3 A. Find its magnetic moment (A m²).
    answer: '3'
    check: 50*Rational(2,100)*3
    difficulty: 1
    hints:
    - m = NIA.
    - 50 × 3 × 0.02.
    solution: 'Step 1: 150 × 0.02. Step 2: 3 A m².'
    mistakes:
      '300': c12p4_force
      '1': c12p4_force
  - prompt: A coil with m = 2 A m² sits at 90° to a 0.4 T field. Torque (N m) as a fraction?
    answer: 4/5
    check: 2*Rational(4,10)
    difficulty: 2
    hints:
    - τ = mB sin θ.
    - sin 90° = 1.
    solution: 'Step 1: 2 × 0.4. Step 2: 0.8 = 4/5.'
    mistakes:
      '0': c12p4_force
      1/5: c12p4_force
  - prompt: A charge 2 × 10⁻⁶ C moves at 10⁴ m/s at right angles to a 0.5 T field. Force in units of 10⁻² N?
    answer: '1'
    check: 2*10**-6*10**4*Rational(1,2)*100
    difficulty: 2
    hints:
    - F = qvB.
    - 2 × 10⁻⁶ × 10⁴ × 0.5.
    solution: 'Step 1: 10⁻² N. Step 2: 1.'
    mistakes:
      '2': c12p4_force
      '10': c12p4_force
  - prompt: A particle circles in a magnetic field with radius 4 cm. Its speed is halved. New radius (cm)?
    answer: '2'
    check: 4/2
    difficulty: 2
    hints:
    - r = mv/(qB).
    - r ∝ v.
    solution: 'Step 1: v → v/2. Step 2: r → 2 cm.'
    mistakes:
      '8': c12p4_circle
      '1': c12p4_circle
  - prompt: 'Its speed is doubled instead. The time for one revolution:'
    options:
    - stays the same
    - doubles
    - halves
    answer: stays the same
    difficulty: 2
    hints:
    - T = 2πm/(qB).
    - Does v appear?
    solution: 'Step 1: T has no v. Step 2: unchanged (bigger circle, faster).'
    mistakes:
      doubles: c12p4_circle
      halves: c12p4_circle
  - prompt: 'A galvanometer becomes a voltmeter by connecting:'
    options:
    - a high resistance in series
    - a low resistance in parallel
    - a capacitor in series
    answer: a high resistance in series
    difficulty: 3
    hints:
    - A voltmeter should draw very little current.
    - It is placed across a component.
    solution: 'Step 1: large series resistance limits current. Step 2: high R in series.'
    mistakes:
      a low resistance in parallel: c12p4_meter
      a capacitor in series: c12p4_meter
  - prompt: A galvanometer (G = 99 Ω) gives full deflection at 1 mA. What shunt (Ω) makes it read up to 100 mA?
    answer: '1'
    check: Rational(1,1000)*99/(Rational(100,1000) - Rational(1,1000))
    difficulty: 3
    hints:
    - Shunt carries the extra 99 mA.
    - 'Same voltage: 1 mA × 99 Ω = 99 mA × S.'
    solution: 'Step 1: 0.099 V across both. Step 2: S = 0.099/0.099 = 1 Ω.'
    mistakes:
      '99': c12p4_meter
      '100': c12p4_meter
  - prompt: 'Assertion (A): A charged particle moving in a uniform magnetic field keeps the same speed.

      Reason (R): The magnetic force on it is always perpendicular to its velocity.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: A force at right angles to the velocity does no work, so the kinetic energy and speed stay constant; only the direction changes. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: In a mass spectrometer, two ions with the same charge and the same speed enter a uniform magnetic field. Ion A has twice the mass of ion B. What is the ratio of the radii r_A : r_B?'
    options:
    - '2 : 1'
    - '1 : 2'
    - '4 : 1'
    answer: '2 : 1'
    hints:
    - r = mv/(qB).
    - Only m differs between the two ions.
    solution: 'With v, q and B the same, r ∝ m. Ion A has twice the mass, so r_A : r_B = 2 : 1.'
    mistakes:
      '1 : 2': c12p4_circle
      '4 : 1': c12p4_circle
    exam: case
    difficulty: 2
  - prompt: A galvanometer of resistance 20 Ω gives full-scale deflection at 10 mA. What must be done to turn it into a voltmeter reading up to 10 V?
    options:
    - Add 980 Ω in series
    - Add 980 Ω in parallel
    - Add 1000 Ω in series
    answer: Add 980 Ω in series
    hints:
    - Total resistance needed = 10 V ÷ 0.01 A.
    - Subtract the galvanometer's own resistance.
    solution: Total R = 10/0.01 = 1000 Ω. The galvanometer already has 20 Ω, so add 980 Ω in series.
    mistakes:
      Add 980 Ω in parallel: c12p4_meter
      Add 1000 Ω in series: c12p4_meter
    exam: competency
    difficulty: 2
- code: cbse12p.mag.field
  title: Biot–Savart and Ampère's laws
  after:
  - cbse12p.mag.force
  notes: |
    Biot–Savart law dB = (μ₀/4π) I dl sin θ / r². Field at the centre of a circular loop B = μ₀NI/(2R); on its axis
    μ₀IR²/(2(x² + R²)^(3/2)). Ampère's circuital law ∮B·dl = μ₀I. Long straight wire B = μ₀I/(2πr). Solenoid B = μ₀nI inside
    (uniform), ~0 outside; toroid B = μ₀NI/(2πr). μ₀ = 4π × 10⁻⁷ T m A⁻¹. Right-hand thumb rule for direction.
  explanations:
    text: Currents create magnetic fields. Around a straight wire the field circles the wire and weakens with distance. Inside a long coil (solenoid) the field is strong and uniform, like a bar magnet's.
    visual: 'Grip a wire with your right hand, thumb along the current: your curled fingers show the field''s direction circling the wire.'
    step_by_step: 'Step 1: Pick the formula for the shape (wire, loop, solenoid). Step 2: Put in μ₀ = 4π × 10⁻⁷. Step 3: Use the right-hand rule for direction.'
    real_world: Electromagnets in scrap yards and MRI scanners are big solenoids carrying large currents.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - long straight wire
      - circular loop (centre)
      - solenoid (inside)
    - title: Field B
      points:
      - μ₀I/(2πr)
      - μ₀NI/(2R)
      - μ₀nI
    alt: Magnetic fields of a straight wire, a loop and a solenoid.
  activity:
    type: formula
    prompt: The field at the centre of a circular coil is B = μ₀NI ÷ (2R).
    inputs:
    - name: n
      label: Turns N
      min: 1
      max: 100
      step: 1
      start: 1
    - name: i
      label: Current I
      min: 0.5
      max: 10
      step: 0.5
      start: 0.5
      unit: A
    - name: r
      label: Radius R
      min: 1
      max: 20
      step: 1
      start: 20
      unit: cm
    outputs:
    - name: b
      label: Field at the centre
      expr: 62.83*n*i/r
      unit: μT
      places: 1
    goals:
    - prompt: 10 turns, 1 A and R = 10 cm give 62.8 μT. Keep N and I, and change only R to double B.
      want:
        n: 10
        i: 1
        b:
        - 125
        - 126
      mistakes:
      - when:
          n: 10
          i: 1
          r: 20
        say: 'A bigger loop gives a WEAKER field at its centre: B ∝ 1/R. Make it smaller.'
    - prompt: Keep I = 1 A and R = 10 cm. Choose N for 314 μT.
      want:
        i: 1
        r: 10
        b:
        - 314
        - 314.3
      mistakes:
      - when:
          i: 1
          r: 10
          n:
          - 1
          - 40
        say: 'Not enough turns: each turn adds 6.28 μT here.'
      - when:
          i: 1
          r: 10
          n:
          - 60
          - 100
        say: Too many turns.
    - prompt: Keep N = 10 and R = 10 cm. Make the field 314 μT by changing the current.
      want:
        n: 10
        r: 10
        b:
        - 314
        - 314.3
      mistakes:
      - when:
          n: 10
          r: 10
          i:
          - 0.5
          - 4.5
        say: 'Not enough current: B ∝ I.'
      - when:
          n: 10
          r: 10
          i:
          - 5.5
          - 10
        say: Too much current.
  lesson:
    - teach: 'Biot–Savart law: a small current element I dl produces dB = (μ₀/4π) I dl sin θ / r². Adding these up for a circular loop gives B = μ₀NI/(2R) at the centre. μ₀ = 4π × 10⁻⁷ T m A⁻¹.'
      check:
        prompt: 'Doubling the current in a loop makes the field at its centre:'
        options:
        - double
        - four times
        - half
        answer: double
        why: B ∝ I.
      ways:
      - style: visual
        teach: 'Field at the centre of a circular coil: 50 turns, radius 0.2 m, current 2 A.'
        picture:
          kind: flow
          steps:
          - B = μ₀NI/(2R)
          - μ₀ = 4π × 10⁻⁷, N = 50, I = 2 A, R = 0.2 m
          - B = 4π × 10⁻⁷ × 100 / 0.4
          - B = π × 10⁻⁴ T
          alt: 'Use B equals mu nought N I over 2R with 50 turns, 2 amperes and radius 0.2 metre: B is 4 pi times 10 to the minus 7 times 100 over 0.4, which is pi times 10 to the minus 4 tesla.'
      - style: real_world
        teach: An MRI scanner uses huge coils carrying large currents to make a strong, steady magnetic field through the patient's body. The Biot–Savart law is how engineers work out the field each part of the coil adds.
    - teach: 'Ampère''s circuital law: ∮B·dl = μ₀I_enclosed. It gives the field of a long straight wire, B = μ₀I/(2πr), circling the wire (right-hand thumb rule). For a long solenoid with n turns per metre, B = μ₀nI inside, uniform, and nearly zero outside.'
      picture:
        kind: compare
        columns:
        - title: Long wire
          points:
          - B = μ₀I/(2πr)
          - falls as 1/r
          - circles the wire
        - title: Solenoid
          points:
          - B = μ₀nI
          - uniform inside
          - ≈ 0 outside
        - title: Loop centre
          points:
          - B = μ₀NI/(2R)
          - along the axis
        alt: Magnetic field formulas for a long wire, a solenoid and the centre of a loop.
      check:
        prompt: 'Inside a long solenoid, moving from the axis towards the wall, B:'
        options:
        - stays the same
        - increases
        - falls to zero
        answer: stays the same
        why: The field inside is uniform.
      ways:
      - style: step_by_step
        teach: 'Field 4 cm from a long wire carrying 20 A. Step 1: B = μ₀I/(2πr) = 2 × 10⁻⁷ × I/r. Step 2: = 2 × 10⁻⁷ × 20 / 0.04. Step 3: = 10⁻⁴ T. Step 4: That is about twice the Earth''s field, enough to swing a compass nearby.'
      - style: real_world
        teach: 'Hold a compass under a wire joined to a battery: the needle swings when the current flows. Grip the wire with your right thumb along the current, and your curled fingers show which way the needle''s north end points.'
    - teach: 'A toroid (solenoid bent into a ring) has B = μ₀NI/(2πr) inside its core and zero outside. Directions: curl right-hand fingers with the current; the thumb gives B for a loop or solenoid.'
      check:
        prompt: Field outside an ideal toroid?
        options:
        - zero
        - μ₀NI/(2πr)
        - μ₀nI
        answer: zero
        why: The field is confined to the core.
      ways:
      - style: visual
        teach: 'Solenoid and toroid compared: where the field is and how strong.'
        picture:
          kind: compare
          columns:
          - title: Long solenoid
            points:
            - 'Inside: B = μ₀nI, uniform'
            - 'Outside: nearly zero'
          - title: Toroid
            points:
            - 'Inside core: B = μ₀NI/(2πr)'
            - 'Outside and in the hole: zero'
          alt: A long solenoid has a uniform field mu nought n I inside and almost none outside. A toroid has mu nought N I over 2 pi r inside its core and zero outside and in the central hole.
      - style: step_by_step
        teach: 'Direction of B inside a solenoid. Step 1: Look at the end of the coil. Step 2: Curl your right-hand fingers along the current in the turns. Step 3: Your thumb points along B inside. Step 4: That end acts as the north pole.'
  items:
  - prompt: Find B (in units of 10⁻⁵ T) 0.1 m from a long wire carrying 5 A.
    answer: '1'
    check: 2*10**-7*5/Rational(1,10)/10**-5
    difficulty: 2
    hints:
    - μ₀I/(2πr).
    - 2 × 10⁻⁷ × 5/0.1.
    solution: 10⁻⁵ T.
    mistakes: {"10": "p12_wire_field", "0.1": "p12_wire_field"}
  - prompt: A solenoid has 1000 turns per metre and carries 2 A. Find B in units of π × 10⁻⁴ T.
    answer: '8'
    check: 4*1000*2*10**-7/10**-4
    difficulty: 2
    hints:
    - μ₀nI = 4π × 10⁻⁷ × 1000 × 2.
    - 8π × 10⁻⁴.
    solution: 8π × 10⁻⁴ T.
    mistakes: {"2": "p12_solenoid", "4": "p12_solenoid"}
  - prompt: The distance from a long wire is doubled. By what factor does B fall?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - B ∝ 1/r.
    - Halves.
    solution: It halves.
    mistakes: {"4": "p12_wire_inverse", "1/2": "p12_wire_inverse"}
  - prompt: 'The field inside a long solenoid is:'
    options:
    - uniform
    - zero
    - circular
    - strongest at the ends
    answer: uniform
    difficulty: 1
    hints:
    - Parallel lines.
    - μ₀nI.
    solution: Uniform.
    mistakes: {"zero": "p12_solenoid_uniform", "circular": "p12_solenoid_uniform", "strongest at the ends": "p12_solenoid_uniform"}
  - prompt: 'The direction of the field around a straight current is given by the:'
    options:
    - right-hand thumb rule
    - left-hand rule
    - Lenz's law
    - Ohm's law
    answer: right-hand thumb rule
    difficulty: 1
    hints:
    - Grip the wire.
    - Fingers curl.
    solution: The right-hand thumb rule.
    mistakes:
      left-hand rule: c12p_rhr
  - prompt: 'The value of μ₀ is:'
    options:
    - 4π × 10⁻⁷ T m/A
    - 9 × 10⁹ N m²/C²
    - 8.85 × 10⁻¹² F/m
    - 1.6 × 10⁻¹⁹ C
    answer: 4π × 10⁻⁷ T m/A
    difficulty: 2
    hints:
    - Permeability of free space.
    - Has π.
    solution: 4π × 10⁻⁷ T m/A.
    mistakes: {"9 × 10⁹ N m²/C²": "p12_constants", "8.85 × 10⁻¹² F/m": "p12_constants", "1.6 × 10⁻¹⁹ C": "p12_constants"}
  - prompt: Find B (in units of 10⁻⁵ T) 0.2 m from a long wire carrying 10 A.
    answer: '1'
    check: 2*10**-7*10/Rational(2,10)*10**5
    difficulty: 1
    hints:
    - B = μ₀I/(2πr) = 2 × 10⁻⁷ I/r.
    - 2 × 10⁻⁷ × 10/0.2.
    solution: 'Step 1: 10⁻⁵ T. Step 2: 1.'
    mistakes:
      '2': c12p4_field
      '5': c12p4_field
  - prompt: A solenoid has 500 turns per metre and 4 A. Find B in units of π × 10⁻⁴ T.
    answer: '8'
    check: 4*500*4*10**-7*10**4
    difficulty: 1
    hints:
    - B = μ₀nI = 4π × 10⁻⁷ × 500 × 4.
    - Collect the π.
    solution: 'Step 1: 4π × 10⁻⁷ × 2000 = 8π × 10⁻⁴. Step 2: 8.'
    mistakes:
      '2': c12p4_field
      '16': c12p4_field
  - prompt: Distance from a long wire is tripled. By what factor does B fall?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - B ∝ 1/r for a wire.
    - Not 1/r².
    solution: 'Step 1: r → 3r. Step 2: B → B/3.'
    mistakes:
      '9': c12p4_field
      '6': c12p4_field
  - prompt: A loop of radius 0.1 m, 1 turn, carries 1 A. Find B at the centre in units of π × 10⁻⁶ T.
    answer: '2'
    check: 4*10**-7*1/(2*Rational(1,10))*10**6
    difficulty: 2
    hints:
    - B = μ₀I/(2R).
    - 4π × 10⁻⁷/0.2.
    solution: 'Step 1: 2π × 10⁻⁶ T. Step 2: 2.'
    mistakes:
      '4': c12p4_field
      '1': c12p4_field
  - prompt: The same loop is wound with 10 turns. B at the centre in units of π × 10⁻⁶ T?
    answer: '20'
    check: 2*10
    difficulty: 2
    hints:
    - B ∝ N.
    - Multiply by 10.
    solution: 'Step 1: 10 × 2π × 10⁻⁶. Step 2: 20.'
    mistakes:
      '2': c12p4_field
      '200': c12p4_field
  - prompt: 'Ampère''s law: a closed path encloses currents 5 A up and 2 A down. ∮B·dl equals μ₀ times:'
    answer: '3'
    check: 5 - 2
    difficulty: 2
    hints:
    - Only enclosed current counts, with direction.
    - Net upward current.
    solution: 'Step 1: 5 − 2. Step 2: 3 A.'
    mistakes:
      '7': c12p4_field
      '10': c12p4_field
  - prompt: Two long parallel wires 0.1 m apart each carry 5 A. Force per metre in units of 10⁻⁵ N/m?
    answer: '5'
    check: 2*10**-7*5*5/Rational(1,10)*10**5
    difficulty: 3
    hints:
    - F/l = μ₀I₁I₂/(2πd) = 2 × 10⁻⁷ I₁I₂/d.
    - 2 × 10⁻⁷ × 25/0.1.
    solution: 'Step 1: 5 × 10⁻⁵ N/m. Step 2: 5.'
    mistakes:
      '25': c12p4_field
      '1': c12p4_field
  - prompt: A toroid has 400 turns and carries 2 A; mean radius 0.2 m. B in units of 10⁻⁴ T?
    answer: '8'
    check: 2*10**-7*400*2/Rational(2,10)*10**4
    difficulty: 3
    hints:
    - B = μ₀NI/(2πr) = 2 × 10⁻⁷ NI/r.
    - 2 × 10⁻⁷ × 800/0.2.
    solution: 'Step 1: 8 × 10⁻⁴ T. Step 2: 8.'
    mistakes:
      '16': c12p4_field
      '4': c12p4_field
  - prompt: 'The direction of B at the centre of a loop with counter-clockwise current (seen from above) is:'
    options:
    - upward, towards the viewer
    - downward, away from the viewer
    - along the wire
    answer: upward, towards the viewer
    difficulty: 3
    hints:
    - Curl right-hand fingers with the current.
    - Your thumb points along B.
    solution: 'Step 1: counter-clockwise curl. Step 2: thumb up, towards the viewer.'
    mistakes:
      downward, away from the viewer: c12p4_field
      along the wire: c12p4_field
  - prompt: 'Assertion (A): The magnetic field outside an ideal toroid is zero.

      Reason (R): An Ampère loop drawn outside the toroid encloses zero net current.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: A loop outside the toroid is crossed by each turn twice, in and out, so the net enclosed current is 0 and ∮B·dl = 0, giving B = 0 by symmetry. A is true because of R.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A long straight power line carries 100 A. What is the magnetic field it produces 5 m below it, at ground level? (μ₀ = 4π × 10⁻⁷ T m/A)'
    options:
    - 4 × 10⁻⁶ T
    - 4 × 10⁻⁵ T
    - 2 × 10⁻⁵ T
    answer: 4 × 10⁻⁶ T
    hints:
    - B = μ₀I/(2πr).
    - μ₀/(2π) = 2 × 10⁻⁷.
    solution: B = 2 × 10⁻⁷ × 100 / 5 = 4 × 10⁻⁶ T, about a tenth of the Earth's field.
    mistakes:
      4 × 10⁻⁵ T: c12p4_field
      2 × 10⁻⁵ T: c12p4_field
    exam: case
    difficulty: 2
  - prompt: You need to double the field inside a long solenoid without changing the current. What can you do?
    options:
    - Double the number of turns per metre
    - Stretch it to twice the length with the same turns
    - Double its radius
    answer: Double the number of turns per metre
    hints:
    - Inside a long solenoid, B = μ₀nI.
    - Which change doubles n?
    solution: B = μ₀nI, so doubling n doubles B. Stretching with the same turns halves n, and the radius does not appear in the formula.
    mistakes:
      Stretch it to twice the length with the same turns: c12p4_field
      Double its radius: c12p4_field
    exam: competency
    difficulty: 2
