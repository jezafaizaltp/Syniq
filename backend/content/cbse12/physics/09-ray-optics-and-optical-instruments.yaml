# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse12-phy
chapter: 9
title: Ray Optics and Optical Instruments
tips:
  c12p_sign: 'Cartesian sign convention: distances measured from the pole/optical centre; along the incoming light are positive, against it negative.'
  c12p_tir: Total internal reflection needs light going from denser to rarer medium AND an angle of incidence greater than the critical angle.
concepts:
- code: cbse12p.optics.mirrors
  title: Reflection, refraction and lenses
  notes: |
    Mirrors: f = R/2; mirror formula 1/v + 1/u = 1/f; magnification m = −v/u. Refraction: Snell's law n₁ sin i = n₂ sin r;
    refractive index n = c/v; apparent depth = real depth/n. Total internal reflection: critical angle sin C = 1/n (denser to
    rarer); optical fibres, mirages, diamond sparkle. Refraction at a spherical surface; lens maker's formula 1/f = (n − 1)(1/R₁
    − 1/R₂); thin lens formula 1/v − 1/u = 1/f; power P = 1/f (dioptre, f in m); lenses in contact P = P₁ + P₂.
  explanations:
    text: Mirrors and lenses form images by reflecting or bending light. The mirror and lens formulas link object distance, image distance and focal length. Total internal reflection traps light inside glass when it hits the surface at a steep angle, which is how optical fibres work.
    visual: 'Draw a convex lens with a candle beyond 2F: rays through the centre go straight; rays parallel to the axis bend through F. Where they meet is a smaller, upside-down image.'
    step_by_step: 'Step 1: Use the sign convention. Step 2: Lens: 1/v − 1/u = 1/f; mirror: 1/v + 1/u = 1/f. Step 3: Solve for the unknown. Step 4: Magnification gives size and whether it''s upright.'
    real_world: Internet data travels under oceans as light bouncing along optical fibres by total internal reflection.
  picture:
    kind: compare
    columns:
    - title: Device
      points:
      - concave mirror
      - convex mirror
      - convex lens
      - concave lens
    - title: Focal length sign
      points:
      - negative
      - positive
      - positive
      - negative
    alt: Sign of focal length for mirrors and lenses under the Cartesian convention.
  activity:
    type: formula
    prompt: 'A convex lens of focal length f. Object at u (negative, on the left). Lens formula: 1/v − 1/u = 1/f, magnification m = v/u.'
    inputs:
    - name: u
      label: Object distance u
      min: -60
      max: -5
      step: 5
      start: -60
      unit: cm
    - name: f
      label: Focal length f
      min: 5
      max: 30
      step: 5
      start: 30
      unit: cm
    outputs:
    - name: v
      label: Image distance v
      expr: 1/(1/f+1/u)
      unit: cm
      places: 1
    - name: m
      label: Magnification m
      expr: (1/(1/f+1/u))/u
      places: 2
    goals:
    - prompt: f = 10 cm. Place the object so a real image forms 30 cm behind the lens.
      want:
        f: 10
        v: 30
      mistakes:
      - when:
          f: 10
          u: -30
        say: 'Object and image swapped: an object at 30 cm images at 15 cm. 1/u = 1/30 − 1/10.'
      - when:
          f: 10
          u: -20
        say: At 2f the image is also at 2f, 20 cm. Move nearer to f to push the image further out.
    - prompt: f = 15 cm. Make a real image the same size as the object.
      want:
        f: 15
        m: -1
      mistakes:
      - when:
          f: 15
          u:
          - -60
          - -35
        say: 'Object beyond 2f: the image is smaller (|m| < 1). Same size needs the object at 2f.'
      - when:
          f: 15
          u:
          - -25
          - -20
        say: Between f and 2f the image is bigger.
    - prompt: 'f = 20 cm. Make a magnifying glass: an upright, enlarged image.'
      want:
        f: 20
        m:
        - 1.1
        - 10
      mistakes:
      - when:
          f: 20
          m:
          - -100
          - -0.01
        say: 'm is negative: a real, inverted image. A magnifier needs the object inside f.'
  items:
  - prompt: A lens has focal length 0.5 m. Find its power (dioptre).
    answer: '2'
    check: 1/Rational(1,2)
    difficulty: 1
    hints:
    - P = 1/f.
    - 1/0.5.
    solution: 2 D.
  - prompt: Lenses of +2 D and +3 D are in contact. Find the total power (D).
    answer: '5'
    check: 2+3
    difficulty: 1
    hints:
    - Add.
    - 2 + 3.
    solution: 5 D.
  - prompt: Light travels at 2 × 10⁸ m/s in glass. Find the refractive index (c = 3 × 10⁸).
    answer: 3/2
    check: Rational(3,2)
    difficulty: 1
    hints:
    - n = c/v.
    - 3/2.
    solution: 1.5.
  - prompt: A convex lens of f = 10 cm forms an image of an object at u = −30 cm. Find v (cm).
    answer: '15'
    check: 1/(Rational(1,10)+Rational(1,-30))
    difficulty: 2
    hints:
    - 1/v = 1/f + 1/u.
    - 1/10 − 1/30 = 1/15.
    solution: 15 cm.
    mistakes:
      '-15': c12p_sign
  - prompt: A pool is 3 m deep. With n = 3/2, find its apparent depth (m).
    answer: '2'
    check: 3/Rational(3,2)
    difficulty: 2
    hints:
    - real/n.
    - 3 ÷ 1.5.
    solution: 2 m.
  - prompt: 'Total internal reflection can happen when light goes:'
    options:
    - from glass into air at a large angle
    - from air into glass
    - from air into water
    - along the normal
    answer: from glass into air at a large angle
    difficulty: 2
    hints:
    - Denser to rarer.
    - Beyond the critical angle.
    solution: From a denser to a rarer medium beyond the critical angle.
    mistakes:
      from air into glass: c12p_tir
- code: cbse12p.optics.instruments
  title: Prisms and optical instruments
  after:
  - cbse12p.optics.mirrors
  notes: |
    Prism: deviation; minimum deviation n = sin((A + δm)/2)/sin(A/2); thin prism δ = (n − 1)A; dispersion (removed in some
    rationalised years). Optical instruments: simple microscope m = 1 + D/f (D = 25 cm); compound microscope m = (L/f₀)(D/fₑ)
    approximately; astronomical telescope m = f₀/fₑ, length f₀ + fₑ (normal adjustment); reflecting telescopes (no chromatic
    aberration, larger apertures).
  explanations:
    text: A prism bends light and can split white light into colours. Microscopes use lenses to make tiny things look big; telescopes make far things look closer. Their magnifying power comes from the focal lengths of their lenses.
    visual: 'Draw a telescope: a big objective lens of long focal length and a small eyepiece of short focal length. Magnification = f(objective) ÷ f(eyepiece).'
    step_by_step: 'Step 1: Identify the instrument. Step 2: Pick the formula (telescope f₀/fₑ; simple microscope 1 + D/f). Step 3: Substitute in consistent units.'
    real_world: The Giant Metrewave Radio Telescope near Pune and optical telescopes in Ladakh help Indian astronomers study the universe.
  picture:
    kind: flow
    steps:
    - Light from distant object
    - Objective lens forms image
    - Eyepiece magnifies that image
    - Eye sees enlarged view
    alt: 'How an astronomical telescope works: the objective forms an image and the eyepiece magnifies it.'
  activity:
    type: formula
    prompt: 'An astronomical telescope in normal adjustment: magnifying power fₒ ÷ fₑ, tube length fₒ + fₑ.'
    inputs:
    - name: fo
      label: Objective fₒ
      min: 10
      max: 200
      step: 10
      start: 10
      unit: cm
    - name: fe
      label: Eyepiece fₑ
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: m
      label: Magnifying power
      expr: fo/fe
      places: 1
    - name: len
      label: Tube length
      expr: fo+fe
      unit: cm
    goals:
    - prompt: Make a telescope with magnifying power 20 and fₑ = 5 cm.
      want:
        fe: 5
        m: 20
      mistakes:
      - when:
          fe: 5
          fo:
          - 10
          - 90
        say: 'Not enough: a long objective focal length gives the magnification. fₒ = 20 × 5.'
      - when:
          fe: 5
          fo:
          - 110
          - 200
        say: Too much.
    - prompt: Make a telescope 105 cm long with magnifying power 20.
      want:
        len: 105
        m: 20
      mistakes:
      - when:
          len: 105
          m:
          - 1
          - 19
        say: 'Right length, but put more of it in the objective: m = fₒ ÷ fₑ.'
      - when:
          m: 20
          len:
          - 21
          - 104
        say: 'Right power, but too short: scale both focal lengths up.'
    - prompt: Make magnifying power 10 with a 110 cm tube.
      want:
        len: 110
        m: 10
      mistakes:
      - when:
          len: 110
          m:
          - 1
          - 9
        say: 'Right length, but too little power: give more of the length to the objective.'
      - when:
          m: 10
          len:
          - 11
          - 109
        say: 'Right power, but too short: scale both focal lengths up.'
  items:
  - prompt: A telescope has f₀ = 100 cm and fₑ = 5 cm. Find its magnifying power.
    answer: '20'
    check: 100/5
    difficulty: 1
    hints:
    - f₀/fₑ.
    - 100/5.
    solution: '20.'
  - prompt: For that telescope in normal adjustment, find its length (cm).
    answer: '105'
    check: 100+5
    difficulty: 1
    hints:
    - f₀ + fₑ.
    - 100 + 5.
    solution: 105 cm.
  - prompt: A simple microscope has f = 5 cm. Find its magnifying power with the image at D = 25 cm.
    answer: '6'
    check: 1+25/5
    difficulty: 2
    hints:
    - 1 + D/f.
    - 1 + 5.
    solution: '6.'
  - prompt: A thin prism has A = 5° and n = 1.5. Find its deviation (degrees), as a fraction.
    answer: 5/2
    check: Rational(1,2)*5
    difficulty: 2
    hints:
    - δ = (n − 1)A.
    - 0.5 × 5.
    solution: 2.5°.
  - prompt: 'Reflecting telescopes are preferred for large apertures because they:'
    options:
    - have no chromatic aberration and need lighter supports
    - are cheaper to paint
    - use no mirrors
    - magnify less
    answer: have no chromatic aberration and need lighter supports
    difficulty: 2
    hints:
    - Mirrors don't split colours.
    - Supported from the back.
    solution: No chromatic aberration and easier to support.
  - prompt: 'Splitting of white light into colours by a prism is called:'
    options:
    - dispersion
    - reflection
    - diffraction
    - polarisation
    answer: dispersion
    difficulty: 1
    hints:
    - Rainbow.
    - Different n for each colour.
    solution: Dispersion.
