# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse12-phy
chapter: 9
title: Ray Optics and Optical Instruments
tips:
  c12p_sign: 'Cartesian sign convention: distances measured from the pole/optical centre; along the incoming light are positive, against it negative.'
  c12p_tir: Total internal reflection needs light going from denser to rarer medium AND an angle of incidence greater than the critical angle.
  p12_apparent_depth: "Apparent depth = real depth ÷ n."
  p12_dispersion: "Each colour bends by a different amount and spreads out."
  p12_power_add: "Powers of lenses in contact add."
  p12_power_lens: "P = 1/f, with f in metres."
  p12_prism: "For a thin prism, δ = (n − 1)A."
  p12_reflector: "Lenses split colours and are heavy; a big mirror can be supported from the back."
  p12_refractive_index: "n = c/v."
  p12_simple_microscope: "Image at D: m = 1 + D/f."
  p12_telescope: "m = f₀/fₑ."
  p12_telescope_length: "In normal adjustment, length = f₀ + fₑ."
  c12p9_sign: 'Use the sign convention: distances measured from the pole or optical centre; along the incoming light is +, against it is −. A real object has u negative.'
  c12p9_refr: 'n = c/v, and Snell: n₁ sin i = n₂ sin r. Total internal reflection needs denser to rarer and i > C, with sin C = 1/n.'
  c12p9_power: 'Power P = 1/f with f in metres. Lenses in contact: add powers.'
  c12p9_inst: Telescope m = f₀/fₑ, length f₀ + fₑ. Simple microscope m = 1 + D/f with D = 25 cm.
concepts:
- code: cbse12p.optics.mirrors
  title: Reflection, refraction and lenses
  notes: |
    Mirrors: f = R/2; mirror formula 1/v + 1/u = 1/f; magnification m = −v/u. Refraction: Snell's law n₁ sin i = n₂ sin r;
    refractive index n = c/v; apparent depth = real depth/n. Total internal reflection: critical angle sin C = 1/n (denser to
    rarer); optical fibres, mirages, diamond sparkle. Refraction at a spherical surface; lens maker's formula 1/f = (n − 1)(1/R₁
    − 1/R₂); thin lens formula 1/v − 1/u = 1/f; power P = 1/f (dioptre, f in m); lenses in contact P = P₁ + P₂.
  explanations:
    text: Mirrors and lenses form images by reflecting or bending light. The mirror and lens formulas link object distance, image distance and focal length. Total internal reflection traps light inside glass when it hits the surface at a steep angle, which is how optical fibres work.
    visual: 'Draw a convex lens with a candle beyond 2F: rays through the centre go straight; rays parallel to the axis bend through F. Where they meet is a smaller, upside-down image.'
    step_by_step: 'Step 1: Use the sign convention. Step 2: Lens: 1/v − 1/u = 1/f; mirror: 1/v + 1/u = 1/f. Step 3: Solve for the unknown. Step 4: Magnification gives size and whether it''s upright.'
    real_world: Internet data travels under oceans as light bouncing along optical fibres by total internal reflection.
  picture:
    kind: compare
    columns:
    - title: Device
      points:
      - concave mirror
      - convex mirror
      - convex lens
      - concave lens
    - title: Focal length sign
      points:
      - negative
      - positive
      - positive
      - negative
    alt: Sign of focal length for mirrors and lenses under the Cartesian convention.
  activity:
    type: formula
    prompt: 'A convex lens of focal length f. Object at u (negative, on the left). Lens formula: 1/v − 1/u = 1/f, magnification m = v/u.'
    inputs:
    - name: u
      label: Object distance u
      min: -60
      max: -5
      step: 5
      start: -60
      unit: cm
    - name: f
      label: Focal length f
      min: 5
      max: 30
      step: 5
      start: 30
      unit: cm
    outputs:
    - name: v
      label: Image distance v
      expr: 1/(1/f+1/u)
      unit: cm
      places: 1
    - name: m
      label: Magnification m
      expr: (1/(1/f+1/u))/u
      places: 2
    goals:
    - prompt: f = 10 cm. Place the object so a real image forms 30 cm behind the lens.
      want:
        f: 10
        v: 30
      mistakes:
      - when:
          f: 10
          u: -30
        say: 'Object and image swapped: an object at 30 cm images at 15 cm. 1/u = 1/30 − 1/10.'
      - when:
          f: 10
          u: -20
        say: At 2f the image is also at 2f, 20 cm. Move nearer to f to push the image further out.
    - prompt: f = 15 cm. Make a real image the same size as the object.
      want:
        f: 15
        m: -1
      mistakes:
      - when:
          f: 15
          u:
          - -60
          - -35
        say: 'Object beyond 2f: the image is smaller (|m| < 1). Same size needs the object at 2f.'
      - when:
          f: 15
          u:
          - -25
          - -20
        say: Between f and 2f the image is bigger.
    - prompt: 'f = 20 cm. Make a magnifying glass: an upright, enlarged image.'
      want:
        f: 20
        m:
        - 1.1
        - 10
      mistakes:
      - when:
          f: 20
          m:
          - -100
          - -0.01
        say: 'm is negative: a real, inverted image. A magnifier needs the object inside f.'
  lesson:
    - teach: 'Spherical mirrors: focal length f = R/2. Mirror formula 1/v + 1/u = 1/f, magnification m = −v/u. With the Cartesian sign convention, a concave mirror has negative f and a real object has negative u.'
      check:
        prompt: A mirror has radius of curvature 30 cm. Size of its focal length?
        options:
        - 15 cm
        - 60 cm
        - 30 cm
        answer: 15 cm
        why: f = R/2.
    - teach: 'Refraction: light bends because its speed changes. n = c/v; Snell''s law n₁ sin i = n₂ sin r. A pool looks shallower: apparent depth = real depth/n. Going from denser to rarer, beyond the critical angle C (sin C = 1/n) light is totally internally reflected: optical fibres, mirages, sparkling diamonds.'
      picture:
        kind: flow
        steps:
        - Light in glass meets air
        - 'i < C: refracts out'
        - 'i = C: grazes the surface'
        - 'i > C: totally reflected'
        alt: What happens as the angle inside glass increases past the critical angle.
      check:
        prompt: n = 2. Critical angle?
        options:
        - 30°
        - 60°
        - 45°
        answer: 30°
        why: sin C = 1/2.
    - teach: 'Thin lens formula: 1/v − 1/u = 1/f, m = v/u. Lens maker''s formula 1/f = (n − 1)(1/R₁ − 1/R₂). Power P = 1/f (f in metres) in dioptres; convex lenses have positive power. Lenses in contact: P = P₁ + P₂.'
      check:
        prompt: f = +25 cm. Power?
        options:
        - +4 D
        - +25 D
        - +0.25 D
        answer: +4 D
        why: 1/0.25 m = 4 D.
  items:
  - prompt: A lens has focal length 0.5 m. Find its power (dioptre).
    answer: '2'
    check: 1/Rational(1,2)
    difficulty: 1
    hints:
    - P = 1/f.
    - 1/0.5.
    solution: 2 D.
    mistakes: {"0.5": "p12_power_lens", "50": "p12_power_lens"}
  - prompt: Lenses of +2 D and +3 D are in contact. Find the total power (D).
    answer: '5'
    check: 2+3
    difficulty: 1
    hints:
    - Add.
    - 2 + 3.
    solution: 5 D.
    mistakes: {"6": "p12_power_add", "6/5": "p12_power_add"}
  - prompt: Light travels at 2 × 10⁸ m/s in glass. Find the refractive index (c = 3 × 10⁸).
    answer: 3/2
    check: Rational(3,2)
    difficulty: 1
    hints:
    - n = c/v.
    - 3/2.
    solution: 1.5.
    mistakes: {"2/3": "p12_refractive_index", "6": "p12_refractive_index"}
  - prompt: A convex lens of f = 10 cm forms an image of an object at u = −30 cm. Find v (cm).
    answer: '15'
    check: 1/(Rational(1,10)+Rational(1,-30))
    difficulty: 2
    hints:
    - 1/v = 1/f + 1/u.
    - 1/10 − 1/30 = 1/15.
    solution: 15 cm.
    mistakes:
      '-15': c12p_sign
  - prompt: A pool is 3 m deep. With n = 3/2, find its apparent depth (m).
    answer: '2'
    check: 3/Rational(3,2)
    difficulty: 2
    hints:
    - real/n.
    - 3 ÷ 1.5.
    solution: 2 m.
    mistakes: {"9/2": "p12_apparent_depth", "3/2": "p12_apparent_depth"}
  - prompt: 'Total internal reflection can happen when light goes:'
    options:
    - from glass into air at a large angle
    - from air into glass
    - from air into water
    - along the normal
    answer: from glass into air at a large angle
    difficulty: 2
    hints:
    - Denser to rarer.
    - Beyond the critical angle.
    solution: From a denser to a rarer medium beyond the critical angle.
    mistakes:
      from air into glass: c12p_tir
  - prompt: A lens has focal length 0.25 m. Find its power (D).
    answer: '4'
    check: 1/Rational(1,4)
    difficulty: 1
    hints:
    - P = 1/f in metres.
    - 1/0.25.
    solution: 'Step 1: 1/0.25. Step 2: 4 D.'
    mistakes:
      '25': c12p9_power
      1/4: c12p9_power
  - prompt: Lenses of +5 D and −2 D are in contact. Total power (D)?
    answer: '3'
    check: 5 - 2
    difficulty: 1
    hints:
    - Add powers with signs.
    - 5 + (−2).
    solution: 'Step 1: 5 − 2. Step 2: 3 D.'
    mistakes:
      '7': c12p9_power
      '-3': c12p9_power
  - prompt: Light travels at 2.25 × 10⁸ m/s in water. Find n as a fraction (c = 3 × 10⁸).
    answer: 4/3
    check: 3/Rational(225,100)
    difficulty: 1
    hints:
    - n = c/v.
    - 3/2.25.
    solution: 'Step 1: 3/2.25. Step 2: 4/3.'
    mistakes:
      3/4: c12p9_refr
      3/2: c12p9_refr
  - prompt: A convex lens (f = 20 cm) has an object at u = −60 cm. Find v (cm).
    answer: '30'
    check: 1/(Rational(1,20) - Rational(1,60))
    difficulty: 2
    hints:
    - 1/v = 1/f + 1/u.
    - 1/20 − 1/60.
    solution: 'Step 1: 1/v = 2/60. Step 2: v = 30 cm.'
    mistakes:
      '15': c12p9_sign
      '-30': c12p9_sign
  - prompt: For that image, find the magnification m = v/u as a fraction.
    answer: -1/2
    check: 30/(-60)
    difficulty: 2
    hints:
    - m = v/u.
    - 30/(−60).
    solution: 'Step 1: −1/2. Step 2: inverted, half size.'
    mistakes:
      1/2: c12p9_sign
      '-2': c12p9_sign
  - prompt: A concave mirror (f = −10 cm) has an object at u = −30 cm. Find v (cm).
    answer: '-15'
    check: 1/(Rational(-1,10) + Rational(1,30))
    difficulty: 2
    hints:
    - 1/v = 1/f − 1/u.
    - −1/10 + 1/30.
    solution: 'Step 1: 1/v = −2/30. Step 2: v = −15 cm (real, in front).'
    mistakes:
      '15': c12p9_sign
      '-30': c12p9_sign
  - prompt: A coin under 4 m of water (n = 4/3) appears at what depth (m)?
    answer: '3'
    check: 4/Rational(4,3)
    difficulty: 2
    hints:
    - Apparent = real/n.
    - 4 ÷ 4/3.
    solution: 'Step 1: 4 × 3/4. Step 2: 3 m.'
    mistakes:
      16/3: c12p9_refr
      '4': c12p9_refr
  - prompt: A biconvex lens (n = 1.5) has R₁ = 20 cm, R₂ = −20 cm. Find f (cm).
    answer: '20'
    check: 1/(Rational(1,2)*(Rational(1,20) + Rational(1,20)))
    difficulty: 3
    hints:
    - 1/f = (n − 1)(1/R₁ − 1/R₂).
    - 0.5 × (1/20 + 1/20).
    solution: 'Step 1: 0.5 × 1/10 = 1/20. Step 2: f = 20 cm.'
    mistakes:
      '10': c12p9_power
      '40': c12p9_power
  - prompt: Light in glass (n = √2) meets air at 50°. What happens?
    options:
    - total internal reflection
    - it refracts out
    - it stops
    answer: total internal reflection
    difficulty: 3
    hints:
    - sin C = 1/√2, so C = 45°.
    - Compare 50° with C.
    solution: 'Step 1: C = 45°. Step 2: 50° > 45°, so it is totally reflected.'
    mistakes:
      it refracts out: c12p9_refr
      it stops: c12p9_refr
- code: cbse12p.optics.instruments
  title: Prisms and optical instruments
  after:
  - cbse12p.optics.mirrors
  notes: |
    Prism: deviation; minimum deviation n = sin((A + δm)/2)/sin(A/2); thin prism δ = (n − 1)A; dispersion (removed in some
    rationalised years). Optical instruments: simple microscope m = 1 + D/f (D = 25 cm); compound microscope m = (L/f₀)(D/fₑ)
    approximately; astronomical telescope m = f₀/fₑ, length f₀ + fₑ (normal adjustment); reflecting telescopes (no chromatic
    aberration, larger apertures).
  explanations:
    text: A prism bends light and can split white light into colours. Microscopes use lenses to make tiny things look big; telescopes make far things look closer. Their magnifying power comes from the focal lengths of their lenses.
    visual: 'Draw a telescope: a big objective lens of long focal length and a small eyepiece of short focal length. Magnification = f(objective) ÷ f(eyepiece).'
    step_by_step: 'Step 1: Identify the instrument. Step 2: Pick the formula (telescope f₀/fₑ; simple microscope 1 + D/f). Step 3: Substitute in consistent units.'
    real_world: The Giant Metrewave Radio Telescope near Pune and optical telescopes in Ladakh help Indian astronomers study the universe.
  picture:
    kind: flow
    steps:
    - Light from distant object
    - Objective lens forms image
    - Eyepiece magnifies that image
    - Eye sees enlarged view
    alt: 'How an astronomical telescope works: the objective forms an image and the eyepiece magnifies it.'
  activity:
    type: formula
    prompt: 'An astronomical telescope in normal adjustment: magnifying power fₒ ÷ fₑ, tube length fₒ + fₑ.'
    inputs:
    - name: fo
      label: Objective fₒ
      min: 10
      max: 200
      step: 10
      start: 10
      unit: cm
    - name: fe
      label: Eyepiece fₑ
      min: 1
      max: 20
      step: 1
      start: 1
      unit: cm
    outputs:
    - name: m
      label: Magnifying power
      expr: fo/fe
      places: 1
    - name: len
      label: Tube length
      expr: fo+fe
      unit: cm
    goals:
    - prompt: Make a telescope with magnifying power 20 and fₑ = 5 cm.
      want:
        fe: 5
        m: 20
      mistakes:
      - when:
          fe: 5
          fo:
          - 10
          - 90
        say: 'Not enough: a long objective focal length gives the magnification. fₒ = 20 × 5.'
      - when:
          fe: 5
          fo:
          - 110
          - 200
        say: Too much.
    - prompt: Make a telescope 105 cm long with magnifying power 20.
      want:
        len: 105
        m: 20
      mistakes:
      - when:
          len: 105
          m:
          - 1
          - 19
        say: 'Right length, but put more of it in the objective: m = fₒ ÷ fₑ.'
      - when:
          m: 20
          len:
          - 21
          - 104
        say: 'Right power, but too short: scale both focal lengths up.'
    - prompt: Make magnifying power 10 with a 110 cm tube.
      want:
        len: 110
        m: 10
      mistakes:
      - when:
          len: 110
          m:
          - 1
          - 9
        say: 'Right length, but too little power: give more of the length to the objective.'
      - when:
          m: 10
          len:
          - 11
          - 109
        say: 'Right power, but too short: scale both focal lengths up.'
  lesson:
    - teach: 'A prism bends light twice. The deviation first falls, then rises as the angle of incidence grows; at minimum deviation δm, n = sin((A + δm)/2)/sin(A/2). For a thin prism, δ = (n − 1)A. Different colours have slightly different n, so white light splits: dispersion.'
      check:
        prompt: Thin prism, A = 4°, n = 1.5. Deviation?
        options:
        - 2°
        - 6°
        - 4°
        answer: 2°
        why: (1.5 − 1) × 4.
    - teach: 'Simple microscope (magnifying glass): m = 1 + D/f with the image at D = 25 cm. Compound microscope: objective forms a real enlarged image, eyepiece magnifies it again; m ≈ (L/f₀)(D/fₑ).'
      picture:
        kind: compare
        columns:
        - title: Microscope
          points:
          - small f₀
          - views near tiny things
          - m ≈ (L/f₀)(D/fₑ)
        - title: Telescope
          points:
          - large f₀
          - views far things
          - m = f₀/fₑ
        alt: Compound microscope and astronomical telescope compared.
      check:
        prompt: Simple microscope with f = 25 cm, image at D. m?
        options:
        - '2'
        - '1'
        - '25'
        answer: '2'
        why: 1 + 25/25 = 2.
    - teach: 'Astronomical telescope in normal adjustment: m = f₀/fₑ, tube length f₀ + fₑ. A large objective gathers more light. Reflecting telescopes use a mirror: no chromatic aberration, and a mirror is easier to support than a huge lens.'
      check:
        prompt: f₀ = 150 cm, fₑ = 5 cm. Magnifying power?
        options:
        - '30'
        - '155'
        - '750'
        answer: '30'
        why: 150/5 = 30.
  items:
  - prompt: A telescope has f₀ = 100 cm and fₑ = 5 cm. Find its magnifying power.
    answer: '20'
    check: 100/5
    difficulty: 1
    hints:
    - f₀/fₑ.
    - 100/5.
    solution: '20.'
    mistakes: {"105": "p12_telescope", "95": "p12_telescope", "1/20": "p12_telescope"}
  - prompt: For that telescope in normal adjustment, find its length (cm).
    answer: '105'
    check: 100+5
    difficulty: 1
    hints:
    - f₀ + fₑ.
    - 100 + 5.
    solution: 105 cm.
    mistakes: {"95": "p12_telescope_length", "20": "p12_telescope_length"}
  - prompt: A simple microscope has f = 5 cm. Find its magnifying power with the image at D = 25 cm.
    answer: '6'
    check: 1+25/5
    difficulty: 2
    hints:
    - 1 + D/f.
    - 1 + 5.
    solution: '6.'
    mistakes: {"5": "p12_simple_microscope", "125": "p12_simple_microscope"}
  - prompt: A thin prism has A = 5° and n = 1.5. Find its deviation (degrees), as a fraction.
    answer: 5/2
    check: Rational(1,2)*5
    difficulty: 2
    hints:
    - δ = (n − 1)A.
    - 0.5 × 5.
    solution: 2.5°.
    mistakes: {"15/2": "p12_prism", "5": "p12_prism"}
  - prompt: 'Reflecting telescopes are preferred for large apertures because they:'
    options:
    - have no chromatic aberration and need lighter supports
    - are cheaper to paint
    - use no mirrors
    - magnify less
    answer: have no chromatic aberration and need lighter supports
    difficulty: 2
    hints:
    - Mirrors don't split colours.
    - Supported from the back.
    solution: No chromatic aberration and easier to support.
    mistakes: {"are cheaper to paint": "p12_reflector", "use no mirrors": "p12_reflector", "magnify less": "p12_reflector"}
  - prompt: 'Splitting of white light into colours by a prism is called:'
    options:
    - dispersion
    - reflection
    - diffraction
    - polarisation
    answer: dispersion
    difficulty: 1
    hints:
    - Rainbow.
    - Different n for each colour.
    solution: Dispersion.
    mistakes: {"reflection": "p12_dispersion", "diffraction": "p12_dispersion", "polarisation": "p12_dispersion"}
  - prompt: A telescope has f₀ = 120 cm and fₑ = 4 cm. Magnifying power?
    answer: '30'
    check: 120/4
    difficulty: 1
    hints:
    - m = f₀/fₑ.
    - 120/4.
    solution: 'Step 1: 120/4. Step 2: 30.'
    mistakes:
      '124': c12p9_inst
      '480': c12p9_inst
  - prompt: Its length in normal adjustment (cm)?
    answer: '124'
    check: 120 + 4
    difficulty: 1
    hints:
    - Length = f₀ + fₑ.
    - 120 + 4.
    solution: 'Step 1: add. Step 2: 124 cm.'
    mistakes:
      '116': c12p9_inst
      '30': c12p9_inst
  - prompt: Simple microscope f = 2.5 cm, image at D = 25 cm. Magnifying power?
    answer: '11'
    check: 1 + 25/Rational(5,2)
    difficulty: 1
    hints:
    - m = 1 + D/f.
    - 25/2.5 = 10.
    solution: 'Step 1: 1 + 10. Step 2: 11.'
    mistakes:
      '10': c12p9_inst
      '9': c12p9_inst
  - prompt: Thin prism A = 6°, n = 1.6. Deviation (degrees) as a fraction?
    answer: 18/5
    check: Rational(6,10)*6
    difficulty: 2
    hints:
    - δ = (n − 1)A.
    - 0.6 × 6.
    solution: 'Step 1: 3.6°. Step 2: 18/5.'
    mistakes:
      48/5: c12p9_refr
      '6': c12p9_refr
  - prompt: Equilateral prism (A = 60°) has minimum deviation 30°. Find n as a surd.
    options:
    - √2
    - √3
    - 3/2
    answer: √2
    difficulty: 2
    hints:
    - n = sin((A + δm)/2)/sin(A/2).
    - sin 45°/sin 30°.
    solution: 'Step 1: (1/√2)/(1/2). Step 2: √2.'
    mistakes:
      √3: c12p9_refr
      3/2: c12p9_refr
  - prompt: 'Compound microscope: L = 15 cm, f₀ = 1 cm, fₑ = 5 cm, D = 25 cm. m ≈ ?'
    answer: '75'
    check: 15/1*25/5
    difficulty: 2
    hints:
    - m ≈ (L/f₀)(D/fₑ).
    - 15 × 5.
    solution: 'Step 1: 15 × 5. Step 2: 75.'
    mistakes:
      '21': c12p9_inst
      '375': c12p9_inst
  - prompt: Which lens should a telescope's objective have?
    options:
    - large focal length and large aperture
    - small focal length
    - small aperture
    answer: large focal length and large aperture
    difficulty: 2
    hints:
    - m = f₀/fₑ.
    - More light from faint stars.
    solution: 'Step 1: large f₀ gives magnification. Step 2: large aperture gathers light.'
    mistakes:
      small focal length: c12p9_inst
      small aperture: c12p9_inst
  - prompt: A telescope has length 105 cm and m = 20 in normal adjustment. Find fₑ (cm).
    answer: '5'
    check: 105/21
    difficulty: 3
    hints:
    - f₀ = 20fₑ.
    - f₀ + fₑ = 21fₑ = 105.
    solution: 'Step 1: 21fₑ = 105. Step 2: fₑ = 5 cm.'
    mistakes:
      '100': c12p9_inst
      '21': c12p9_inst
  - prompt: Why does a prism spread white light into colours?
    options:
    - n is different for different colours
    - the prism adds colour
    - light slows to zero
    answer: n is different for different colours
    difficulty: 3
    hints:
    - Each colour bends by a different amount.
    - Violet bends most.
    solution: 'Step 1: n depends on wavelength. Step 2: colours deviate differently: dispersion.'
    mistakes:
      the prism adds colour: c12p9_refr
      light slows to zero: c12p9_refr
