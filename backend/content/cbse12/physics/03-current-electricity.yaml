# CBSE Class 12 Physics (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse12-phy
chapter: 3
title: Current Electricity
tips:
  c12p_ohm: Ohm's law V = IR. Resistors in series add; in parallel, 1/R = 1/R₁ + 1/R₂.
  c12p_kirchhoff: 'Kirchhoff: currents into a junction = currents out; around any loop, the sum of EMFs = sum of IR drops.'
  p12_bulb_r: "P = V²/R, so R = V²/P."
  p12_cells_series: "Cells in series add their EMFs."
  p12_internal: "I = E/(R + r). Include the internal resistance."
  p12_kirchhoff: "At a junction, current in = current out: nothing piles up or vanishes."
  p12_ohm: "I = V/R."
  p12_r_length: "R = ρL/A: R is proportional to length."
  p12_resistivity_temp: "Heated metal ions vibrate more and get in the electrons' way."
  p12_series: "Resistors in series add directly."
  p12_terminal: "V = E − Ir. Some voltage is lost inside the cell."
  p12_wheatstone: "Balance: P/Q = R/S."
concepts:
- code: cbse12p.current.ohm
  title: Current, resistance and Ohm's law
  notes: |
    Current I = dq/dt (ampere). Drift velocity of electrons v_d = eEτ/m; I = neAv_d. Ohm's law V = IR. Resistance R = ρl/A;
    resistivity ρ depends on material and temperature (ρ_T = ρ₀[1 + α(T − T₀)]); conductivity σ = 1/ρ. Ohmic and non-ohmic
    devices. Combinations: series R = ΣRᵢ, parallel 1/R = Σ1/Rᵢ. Electrical energy and power P = VI = I²R = V²/R. (Colour
    code removed in rationalised syllabus.)
  explanations:
    text: 'Current is the flow of charge. Ohm''s law says the current through a conductor is proportional to the voltage across it: V = IR. Resistance depends on the material, length and thickness of the wire.'
    visual: 'Picture water in a pipe: voltage is the pressure, current the flow rate, and resistance a narrow section that slows the flow.'
    step_by_step: 'Step 1: Find the total resistance (series add; parallel use reciprocals). Step 2: I = V/R. Step 3: Power P = VI or I²R.'
    real_world: 'A heater has a high-resistance coil that turns electrical energy into heat: P = V²/R.'
  picture:
    kind: compare
    columns:
    - title: Combination
      points:
      - series
      - parallel
    - title: Total resistance
      points:
      - R₁ + R₂
      - R₁R₂/(R₁ + R₂)
    - title: Same for each
      points:
      - current
      - voltage
    alt: 'Resistors in series and parallel: how they combine and what they share.'
  activity:
    type: formula
    prompt: 'A 10 Ω wire is stretched to n times its length. Its volume stays the same, so it also gets thinner: R becomes 10n².'
    inputs:
    - name: n
      label: Stretched to n × the length
      min: 1
      max: 10
      step: 0.5
      start: 1
    - name: v
      label: Voltage
      min: 0
      max: 24
      step: 1
      start: 0
      unit: V
    outputs:
    - name: r
      label: Resistance
      expr: 10*n^2
      unit: Ω
      places: 1
    - name: i
      label: Current
      expr: v/(10*n^2)
      unit: A
      places: 3
    goals:
    - prompt: Stretch the wire until R = 90 Ω.
      want:
        r: 90
      mistakes:
      - when:
          n: 9
        say: 'Stretching 9 times gives 810 Ω: the wire also gets thinner, so R ∝ n². 90 = 10 × n².'
      - when:
          n:
          - 1
          - 2.5
        say: 'Not stretched enough: R = 10n².'
    - prompt: Stretch it to twice its length. What voltage drives 0.5 A?
      want:
        n: 2
        i: 0.5
      mistakes:
      - when:
          n: 2
          v: 5
        say: '5 V suits the unstretched 10 Ω wire. Stretched to twice the length it''s 40 Ω: V = IR.'
      - when:
          n: 2
          v: 10
        say: '10 V assumes R doubled to 20 Ω. It''s 40 Ω: longer AND thinner.'
    - prompt: Keep 12 V. Stretch the wire so the current is 0.3 A.
      want:
        v: 12
        i: 0.3
      mistakes:
      - when:
          v: 12
          n: 4
        say: n = 4 gives 160 Ω and only 0.075 A. You need R = 40 Ω.
  items:
  - prompt: A 12 V battery drives current through 4 Ω. Find the current (A).
    answer: '3'
    check: 12/4
    difficulty: 1
    hints:
    - I = V/R.
    - 12/4.
    solution: 3 A.
    mistakes: {"48": "p12_ohm", "1/3": "p12_ohm"}
  - prompt: Find the total resistance (Ω) of 4 Ω and 6 Ω in series.
    answer: '10'
    check: 4+6
    difficulty: 1
    hints:
    - Add.
    - 4 + 6.
    solution: 10 Ω.
    mistakes: {"12/5": "p12_series", "24": "p12_series"}
  - prompt: Find the total resistance (Ω) of 6 Ω and 3 Ω in parallel.
    answer: '2'
    check: 6*3/(6+3)
    difficulty: 2
    hints:
    - Product/sum.
    - 18/9.
    solution: 2 Ω.
    mistakes:
      '9': c12p_ohm
  - prompt: A 100 W bulb runs on 200 V. Find its resistance (Ω).
    answer: '400'
    check: 200**2/100
    difficulty: 2
    hints:
    - R = V²/P.
    - 40000/100.
    solution: 400 Ω.
    mistakes: {"2": "p12_bulb_r", "20000": "p12_bulb_r"}
  - prompt: A wire's length is doubled (same material and area). By what factor does its resistance grow?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - R ∝ l.
    - Doubles.
    solution: '2.'
    mistakes: {"4": "p12_r_length", "1/2": "p12_r_length"}
  - prompt: 'The resistivity of a metal, when heated:'
    options:
    - increases
    - decreases
    - stays the same
    - becomes zero
    answer: increases
    difficulty: 2
    hints:
    - More collisions.
    - Positive α.
    solution: It increases.
    mistakes: {"decreases": "p12_resistivity_temp", "stays the same": "p12_resistivity_temp", "becomes zero": "p12_resistivity_temp"}
- code: cbse12p.current.circuits
  title: Cells, Kirchhoff's rules and the Wheatstone bridge
  after:
  - cbse12p.current.ohm
  notes: |
    EMF ε and internal resistance r: V = ε − Ir (discharging). Cells in series (ε add, r add) and parallel. Kirchhoff's
    junction rule (charge conservation) and loop rule (energy conservation). Wheatstone bridge balanced when P/Q = R/S (no
    current through the galvanometer). (Meter bridge and potentiometer removed in rationalised syllabus.)
  explanations:
    text: 'A cell''s EMF is its total voltage, but some is lost inside it (internal resistance), so the terminal voltage is a little less when current flows. Kirchhoff''s rules let you solve any circuit: currents balance at junctions, and voltages balance around loops.'
    visual: 'Draw a Wheatstone bridge: four resistors in a diamond with a galvanometer across the middle. When P/Q = R/S, no current flows through the middle.'
    step_by_step: 'Step 1: Mark currents at each junction (in = out). Step 2: Go round each loop: Σε = ΣIR. Step 3: Solve the equations. Step 4: For a bridge, check P/Q = R/S.'
    real_world: Electronic weighing scales use a Wheatstone bridge of strain gauges to measure tiny changes in resistance.
  picture:
    kind: flow
    steps:
    - Label currents
    - 'Junction rule: in = out'
    - 'Loop rule: ΣEMF = ΣIR'
    - Solve the equations
    alt: Using Kirchhoff's rules to solve a circuit.
  activity:
    type: formula
    prompt: A cell with EMF ε and internal resistance r drives a resistor R. I = ε ÷ (R + r); the terminal voltage is V = ε − Ir.
    inputs:
    - name: e
      label: EMF ε
      min: 1
      max: 12
      step: 1
      start: 1
      unit: V
    - name: r
      label: Internal resistance r
      min: 0
      max: 5
      step: 0.5
      start: 0
      unit: Ω
    - name: rr
      label: External R
      min: 1
      max: 20
      step: 1
      start: 1
      unit: Ω
    outputs:
    - name: i
      label: Current
      expr: e/(rr+r)
      unit: A
      places: 2
    - name: vt
      label: Terminal voltage
      expr: e-r*e/(rr+r)
      unit: V
      places: 2
    - name: p
      label: Power in R
      expr: rr*(e/(rr+r))^2
      unit: W
      places: 2
    goals:
    - prompt: ε = 6 V and R = 4 Ω give a terminal voltage of 4.8 V. Find r.
      want:
        e: 6
        rr: 4
        vt: 4.8
      mistakes:
      - when:
          e: 6
          rr: 4
          r: 0
        say: 'With no internal resistance the terminal voltage would be the full 6 V. The missing 1.2 V is lost inside the cell: Ir.'
    - prompt: ε = 12 V and r = 2 Ω. Choose R so the terminal voltage is 10 V.
      want:
        e: 12
        r: 2
        vt: 10
      mistakes:
      - when:
          e: 12
          r: 2
          rr:
          - 1
          - 9
        say: 'A smaller R draws more current, so more is lost inside: V drops below 10.'
      - when:
          e: 12
          r: 2
          rr:
          - 11
          - 20
        say: 'Now less is lost inside: V is above 10.'
    - prompt: ε = 12 V and r = 2 Ω. Deliver the most power to R.
      want:
        e: 12
        r: 2
        rr: 2
      mistakes:
      - when:
          e: 12
          r: 2
          rr: 1
        say: 'R = 1 Ω gives 16 W: lots of current, but too much is lost inside.'
      - when:
          e: 12
          r: 2
          rr:
          - 3
          - 20
        say: A bigger R takes less current, so the power falls. The most power flows when R = r.
  items:
  - prompt: A cell of EMF 2 V and internal resistance 0.5 Ω gives 1 A. Find its terminal voltage (V).
    answer: '1.5'
    check: 2-Rational(1,2)
    difficulty: 1
    hints:
    - V = ε − Ir.
    - 2 − 0.5.
    solution: 1.5 V.
    mistakes: {"2": "p12_terminal", "2.5": "p12_terminal"}
  - prompt: A cell of EMF 6 V and internal resistance 1 Ω is connected to 2 Ω. Find the current (A).
    answer: '2'
    check: 6/(2+1)
    difficulty: 2
    hints:
    - I = ε/(R + r).
    - 6/3.
    solution: 2 A.
    mistakes: {"3": "p12_internal", "6": "p12_internal"}
  - prompt: Currents of 3 A and 2 A enter a junction. One wire leaves; find its current (A).
    answer: '5'
    check: 3+2
    difficulty: 1
    hints:
    - In = out.
    - 3 + 2.
    solution: 5 A.
    mistakes:
      '1': c12p_kirchhoff
  - prompt: A Wheatstone bridge has P = 2 Ω, Q = 4 Ω, R = 3 Ω. Find S (Ω) for balance.
    answer: '6'
    check: 3*4/2
    difficulty: 2
    hints:
    - P/Q = R/S.
    - S = RQ/P.
    solution: 6 Ω.
    mistakes: {"3/2": "p12_wheatstone", "8": "p12_wheatstone"}
  - prompt: 'Kirchhoff''s junction rule is based on conservation of:'
    options:
    - charge
    - energy
    - momentum
    - mass
    answer: charge
    difficulty: 2
    hints:
    - Charge doesn't pile up.
    - In = out.
    solution: Charge.
    mistakes: {"energy": "p12_kirchhoff", "momentum": "p12_kirchhoff", "mass": "p12_kirchhoff"}
  - prompt: 'Three 2 V cells in series give a total EMF of:'
    options:
    - 6 V
    - 2 V
    - 2/3 V
    - 8 V
    answer: 6 V
    difficulty: 1
    hints:
    - Add EMFs.
    - 3 × 2.
    solution: 6 V.
    mistakes: {"2 V": "p12_cells_series", "2/3 V": "p12_cells_series", "8 V": "p12_cells_series"}
