# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse12-chem
chapter: 8
title: Aldehydes, Ketones and Carboxylic Acids
tips:
  c12c_tollens: Tollens' (silver mirror) and Fehling's tests are given by aldehydes, not ketones (aromatic aldehydes fail Fehling's).
  c12c_acidity: Electron-withdrawing groups (like –Cl, –NO₂) make carboxylic acids stronger; electron-donating groups make them weaker.
concepts:
- code: cbse12c.carb.carbonyl
  title: Aldehydes and ketones
  notes: |
    Carbonyl group C=O (sp², polar). Nomenclature (-al, -one). Preparation: oxidation of alcohols, ozonolysis, Rosenmund
    reduction, Stephen reaction, Friedel–Crafts acylation. Nucleophilic addition: HCN, NaHSO₃, Grignard, alcohols (acetals);
    aldehydes more reactive than ketones (steric and electronic). Addition–elimination with ammonia derivatives (oximes,
    hydrazones, 2,4-DNP). Reduction: Clemmensen (Zn-Hg/HCl), Wolff–Kishner. Oxidation: aldehydes easily oxidised—Tollens'
    (silver mirror), Fehling's (red Cu₂O); iodoform test for CH₃CO– groups. Aldol condensation (α-H), Cannizzaro reaction (no
    α-H).
  explanations:
    text: Aldehydes and ketones contain the C=O carbonyl group. Its carbon is slightly positive, so nucleophiles add to it. Aldehydes are easily oxidised, which is how Tollens' and Fehling's tests tell them apart from ketones.
    visual: 'Picture Tollens'' test: warm an aldehyde with Tollens'' reagent and a shiny silver mirror coats the inside of the test tube.'
    step_by_step: 'Step 1: Identify aldehyde (–CHO) or ketone (C=O in chain). Step 2: Tollens''/Fehling''s positive → aldehyde. Step 3: CH₃CO– group → iodoform test positive. Step 4: α-H present → aldol; absent → Cannizzaro.'
    real_world: Formalin (formaldehyde solution) preserves biological specimens; acetone is nail polish remover.
  picture:
    kind: compare
    columns:
    - title: Test
      points:
      - Tollens'
      - Fehling's
      - iodoform
    - title: Positive result
      points:
      - silver mirror
      - red precipitate
      - yellow precipitate
    - title: Given by
      points:
      - aldehydes
      - aliphatic aldehydes
      - CH₃CO– compounds
    alt: Tests for carbonyl compounds and what each shows.
  activity:
    type: sort
    prompt: Aldehyde or ketone?
    bins:
    - Aldehyde
    - Ketone
    items:
    - label: Ethanal, CH₃CHO
      bin: Aldehyde
      clue: Is the C=O at the end of the chain, with an H on it?
      why: '–CHO: an aldehyde.'
    - label: Benzaldehyde, C₆H₅CHO
      bin: Aldehyde
      clue: Does the C=O carbon carry an H?
      why: 'Yes: an aromatic aldehyde (it doesn''t reduce Fehling''s, but it does reduce Tollens'').'
    - label: Propanone, CH₃COCH₃
      bin: Ketone
      clue: Is the C=O between two carbons?
      why: 'Yes: a ketone.'
    - label: Acetophenone, C₆H₅COCH₃
      bin: Ketone
      clue: What sits on either side of the C=O?
      why: 'A ring and a methyl: a ketone.'
    - label: Gives a silver mirror with Tollens' reagent
      bin: Aldehyde
      clue: Which group is easily oxidised to –COOH?
      why: Aldehydes reduce Ag⁺ to silver.
    - label: Resists mild oxidising agents
      bin: Ketone
      clue: Which C=O has no H on it to oxidise?
      why: Ketones need strong oxidants that break C–C bonds.
    - label: Made by oxidising a secondary alcohol
      bin: Ketone
      clue: A 2° alcohol's carbon has two C neighbours. What does it become?
      why: R₂CHOH → R₂C=O, a ketone.
    - label: Made by Rosenmund reduction of an acid chloride
      bin: Aldehyde
      clue: RCOCl + H₂ over poisoned Pd gives what?
      why: RCHO, an aldehyde.
    - label: From toluene by the Etard reaction
      bin: Aldehyde
      clue: Chromyl chloride oxidises –CH₃ on the ring only partly. To what?
      why: Benzaldehyde.
  items:
  - prompt: Which gives a silver mirror with Tollens' reagent?
    options:
    - ethanal
    - propanone
    - ethanol
    - ethanoic acid
    answer: ethanal
    difficulty: 1
    hints:
    - Aldehyde.
    - Easily oxidised.
    solution: Ethanal.
    mistakes:
      propanone: c12c_tollens
  - prompt: Which gives a positive iodoform test?
    options:
    - propanone
    - methanal
    - benzaldehyde
    - methanol
    answer: propanone
    difficulty: 2
    hints:
    - Has CH₃CO–.
    - Yellow precipitate.
    solution: Propanone.
  - prompt: 'Clemmensen reduction converts C=O into:'
    options:
    - CH₂
    - CH–OH
    - COOH
    - C≡C
    answer: CH₂
    difficulty: 2
    hints:
    - Zn-Hg + HCl.
    - Removes oxygen.
    solution: CH₂.
  - prompt: 'Aldehydes without α-hydrogens, like HCHO, undergo:'
    options:
    - Cannizzaro reaction
    - aldol condensation
    - Rosenmund reduction
    - Hell–Volhard–Zelinsky
    answer: Cannizzaro reaction
    difficulty: 2
    hints:
    - No α-H.
    - Self oxidation–reduction.
    solution: The Cannizzaro reaction.
  - prompt: 'Aldehydes are more reactive than ketones in nucleophilic addition because:'
    options:
    - they are less hindered and their carbonyl carbon is more positive
    - they are heavier
    - they have no oxygen
    - they are gases
    answer: they are less hindered and their carbonyl carbon is more positive
    difficulty: 2
    hints:
    - One alkyl group only.
    - Less electron donation.
    solution: Less steric hindrance and a more positive carbonyl carbon.
  - prompt: How many carbon atoms are in propanone?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - prop = 3.
    - Acetone.
    solution: '3.'
- code: cbse12c.carb.acids
  title: Carboxylic acids
  after:
  - cbse12c.carb.carbonyl
  notes: |
    Carboxylic acids –COOH: nomenclature (-oic acid); preparation (oxidation of alcohols/aldehydes, from nitriles, Grignard +
    CO₂, alkylbenzenes with KMnO₄). Physical properties: dimers by hydrogen bonding, high boiling points. Acidity: stronger than
    phenols and alcohols (carboxylate resonance); effect of substituents (Cl₃CCOOH strongest; electron-withdrawing increase);
    react with NaHCO₃ releasing CO₂ (test). Reactions: esterification, acid chlorides (SOCl₂), amides, anhydrides; reduction
    (LiAlH₄), decarboxylation (soda lime), Hell–Volhard–Zelinsky α-halogenation; ring substitution in benzoic acid (meta).
  explanations:
    text: Carboxylic acids have the –COOH group. They're stronger acids than alcohols and phenols because the negative charge left behind is shared between two oxygens. They fizz with sodium bicarbonate, giving off carbon dioxide.
    visual: Draw the carboxylate ion with its charge shared equally across both oxygens by resonance. That sharing makes it stable, so the acid gives up H⁺ readily.
    step_by_step: 'Step 1: Acid strength: carboxylic acid > phenol > alcohol. Step 2: Electron-withdrawing groups near –COOH increase strength. Step 3: NaHCO₃ test: fizz of CO₂ means a carboxylic acid.'
    real_world: Vinegar is a dilute (about 6–8%) solution of ethanoic (acetic) acid in water.
  picture:
    kind: flow
    steps:
    - Acid + alcohol
    - Warm with conc. H₂SO₄
    - Ester + water
    - Fruity smell
    alt: 'Esterification: a carboxylic acid and an alcohol form a sweet-smelling ester.'
  activity:
    type: order
    prompt: Put these acids in order of strength, weakest first.
    steps:
    - CH₃COOH, ethanoic acid
    - HCOOH, methanoic acid
    - ClCH₂COOH, chloroethanoic acid
    - FCH₂COOH, fluoroethanoic acid
    - Cl₂CHCOOH, dichloroethanoic acid
    - Cl₃CCOOH, trichloroethanoic acid
    reasons:
      HCOOH, methanoic acid: Ethanoic acid's CH₃ pushes electrons in (+I), destabilising its anion, so methanoic acid is stronger.
      ClCH₂COOH, chloroethanoic acid: Cl pulls electrons away (−I) and spreads the negative charge, so it is stronger still.
      FCH₂COOH, fluoroethanoic acid: 'F is more electronegative than Cl: a stronger −I pull.'
      Cl₂CHCOOH, dichloroethanoic acid: Two Cl atoms pull more than one F.
      Cl₃CCOOH, trichloroethanoic acid: 'Three Cl atoms: the strongest pull, the strongest acid here.'
  items:
  - prompt: Which is the strongest acid?
    options:
    - CCl₃COOH
    - CH₃COOH
    - CH₂ClCOOH
    - HCOOH
    answer: CCl₃COOH
    difficulty: 2
    hints:
    - Three –Cl.
    - Strong pull.
    solution: Trichloroacetic acid.
    mistakes:
      CH₃COOH: c12c_acidity
  - prompt: 'A test that distinguishes a carboxylic acid from phenol is:'
    options:
    - effervescence with NaHCO₃
    - reaction with Na
    - burning
    - colour with litmus only
    answer: effervescence with NaHCO₃
    difficulty: 1
    hints:
    - CO₂ bubbles.
    - Phenol too weak.
    solution: Fizzing with sodium bicarbonate.
  - prompt: 'Carboxylic acids have high boiling points because they form:'
    options:
    - hydrogen-bonded dimers
    - ionic lattices
    - metallic bonds
    - no intermolecular forces
    answer: hydrogen-bonded dimers
    difficulty: 2
    hints:
    - Two H bonds.
    - Pairs.
    solution: Hydrogen-bonded dimers.
  - prompt: 'Heating sodium ethanoate with soda lime gives:'
    options:
    - methane
    - ethane
    - ethanol
    - propane
    answer: methane
    difficulty: 2
    hints:
    - Decarboxylation.
    - Loses CO₂.
    solution: Methane.
  - prompt: 'Acid + alcohol with conc. H₂SO₄ gives a(n):'
    options:
    - ester
    - ether
    - aldehyde
    - amine
    answer: ester
    difficulty: 1
    hints:
    - Esterification.
    - Fruity smell.
    solution: An ester.
  - prompt: Vinegar is a dilute solution of which acid?
    options:
    - ethanoic acid
    - methanoic acid
    - benzoic acid
    - oxalic acid
    answer: ethanoic acid
    difficulty: 1
    hints:
    - Its common name is acetic acid.
    - Two carbon atoms.
    solution: Vinegar is a dilute (about 6–8%) solution of ethanoic (acetic) acid in water.
    mistakes:
      methanoic acid: c12c_acidity
