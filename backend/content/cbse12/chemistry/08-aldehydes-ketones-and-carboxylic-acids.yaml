# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 8. Format: content/README.md.
subject: cbse12-chem
chapter: 8
title: Aldehydes, Ketones and Carboxylic Acids
tips:
  c12c_tollens: Tollens' (silver mirror) and Fehling's tests are given by aldehydes, not ketones (aromatic aldehydes fail Fehling's).
  c12c_acidity: Electron-withdrawing groups (like –Cl, –NO₂) make carboxylic acids stronger; electron-donating groups make them weaker.
  c12_aldehyde_reactive: "Ketones have two alkyl groups crowding and feeding electrons to the C=O."
  c12_bicarbonate: "Phenol is too weak an acid to release CO₂ from bicarbonate."
  c12_cannizzaro: "Without α-H, there can be no aldol. In strong base the aldehyde reduces and oxidises itself."
  c12_clemmensen: "Clemmensen (Zn–Hg/HCl) removes the oxygen completely."
  c12_decarboxylation: "Soda lime removes CO₂: one carbon is lost from ethanoate."
  c12_dimer: "Two acid molecules pair up through two hydrogen bonds."
  c12_esterification: "Acid + alcohol → sweet-smelling product + water."
  c12_iodoform_test: "The iodoform test needs a CH₃–C=O group (or CH₃–CH(OH)–)."
  c12_prop: "Count up the prefixes: meth, eth, prop, but."
  c12c8_test: 'Match the test: Tollens'' and Fehling''s oxidise aldehydes (not ketones); iodoform needs a CH₃CO– group; NaHCO₃ fizzes only with carboxylic acids.'
  c12c8_rxn: Aldol needs an α-hydrogen; Cannizzaro happens only without one. Clemmensen and Wolff–Kishner turn C=O into CH₂.
  c12c8_acid: Acid strength rises with electron-withdrawing groups near –COOH (more Cl, closer Cl) and falls with electron-donating groups.
concepts:
- code: cbse12c.carb.carbonyl
  title: Aldehydes and ketones
  notes: |
    Carbonyl group C=O (sp², polar). Nomenclature (-al, -one). Preparation: oxidation of alcohols, ozonolysis, Rosenmund
    reduction, Stephen reaction, Friedel–Crafts acylation. Nucleophilic addition: HCN, NaHSO₃, Grignard, alcohols (acetals);
    aldehydes more reactive than ketones (steric and electronic). Addition–elimination with ammonia derivatives (oximes,
    hydrazones, 2,4-DNP). Reduction: Clemmensen (Zn-Hg/HCl), Wolff–Kishner. Oxidation: aldehydes easily oxidised—Tollens'
    (silver mirror), Fehling's (red Cu₂O); iodoform test for CH₃CO– groups. Aldol condensation (α-H), Cannizzaro reaction (no
    α-H).
  explanations:
    text: Aldehydes and ketones contain the C=O carbonyl group. Its carbon is slightly positive, so nucleophiles add to it. Aldehydes are easily oxidised, which is how Tollens' and Fehling's tests tell them apart from ketones.
    visual: 'Picture Tollens'' test: warm an aldehyde with Tollens'' reagent and a shiny silver mirror coats the inside of the test tube.'
    step_by_step: 'Step 1: Identify aldehyde (–CHO) or ketone (C=O in chain). Step 2: Tollens''/Fehling''s positive → aldehyde. Step 3: CH₃CO– group → iodoform test positive. Step 4: α-H present → aldol; absent → Cannizzaro.'
    real_world: Formalin (formaldehyde solution) preserves biological specimens; acetone is nail polish remover.
  picture:
    kind: compare
    columns:
    - title: Test
      points:
      - Tollens'
      - Fehling's
      - iodoform
    - title: Positive result
      points:
      - silver mirror
      - red precipitate
      - yellow precipitate
    - title: Given by
      points:
      - aldehydes
      - aliphatic aldehydes
      - CH₃CO– compounds
    alt: Tests for carbonyl compounds and what each shows.
  activity:
    type: sort
    prompt: Aldehyde or ketone?
    bins:
    - Aldehyde
    - Ketone
    items:
    - label: Ethanal, CH₃CHO
      bin: Aldehyde
      clue: Is the C=O at the end of the chain, with an H on it?
      why: '–CHO: an aldehyde.'
    - label: Benzaldehyde, C₆H₅CHO
      bin: Aldehyde
      clue: Does the C=O carbon carry an H?
      why: 'Yes: an aromatic aldehyde (it doesn''t reduce Fehling''s, but it does reduce Tollens'').'
    - label: Propanone, CH₃COCH₃
      bin: Ketone
      clue: Is the C=O between two carbons?
      why: 'Yes: a ketone.'
    - label: Acetophenone, C₆H₅COCH₃
      bin: Ketone
      clue: What sits on either side of the C=O?
      why: 'A ring and a methyl: a ketone.'
    - label: Gives a silver mirror with Tollens' reagent
      bin: Aldehyde
      clue: Which group is easily oxidised to –COOH?
      why: Aldehydes reduce Ag⁺ to silver.
    - label: Resists mild oxidising agents
      bin: Ketone
      clue: Which C=O has no H on it to oxidise?
      why: Ketones need strong oxidants that break C–C bonds.
    - label: Made by oxidising a secondary alcohol
      bin: Ketone
      clue: A 2° alcohol's carbon has two C neighbours. What does it become?
      why: R₂CHOH → R₂C=O, a ketone.
    - label: Made by Rosenmund reduction of an acid chloride
      bin: Aldehyde
      clue: RCOCl + H₂ over poisoned Pd gives what?
      why: RCHO, an aldehyde.
    - label: From toluene by the Etard reaction
      bin: Aldehyde
      clue: Chromyl chloride oxidises –CH₃ on the ring only partly. To what?
      why: Benzaldehyde.
  lesson:
    - teach: 'Aldehydes (–CHO, names end in -al) and ketones (C=O between two carbons, names end in -one) contain the polar carbonyl group: C is δ+, O is δ−. Nucleophiles attack the carbon: HCN, NaHSO₃, Grignard reagents, alcohols. Aldehydes react faster: less crowded and their carbon is more positive.'
      check:
        prompt: 'Which is more reactive to nucleophiles: ethanal or propanone?'
        options:
        - ethanal
        - propanone
        - equal
        answer: ethanal
        why: 'Fewer alkyl groups: less crowding and less electron donation.'
    - teach: 'Ammonia derivatives add and then lose water: hydroxylamine gives oximes, hydrazine hydrazones, 2,4-DNP orange precipitates. Reduction: Clemmensen (Zn-Hg/HCl) or Wolff–Kishner (NH₂NH₂, KOH) turn C=O into CH₂. Aldehydes are easily oxidised: Tollens'' gives a silver mirror, Fehling''s a red Cu₂O precipitate.'
      picture:
        kind: compare
        columns:
        - title: Test
          points:
          - Tollens'
          - Fehling's
          - Iodoform
        - title: Aldehyde
          points:
          - silver mirror
          - red precipitate
          - only ethanal
        - title: Ketone
          points:
          - no change
          - no change
          - methyl ketones only
        alt: How aldehydes and ketones respond to three common tests.
      check:
        prompt: Which test tells ethanal from propanone?
        options:
        - Tollens' test
        - iodoform test
        - both give the same result in every test
        answer: Tollens' test
        why: Only the aldehyde reduces Tollens' reagent.
    - teach: 'With an α-hydrogen, aldehydes and ketones undergo aldol condensation in dilute alkali. Without one (HCHO, C₆H₅CHO), concentrated alkali causes the Cannizzaro reaction: one molecule is oxidised to an acid salt, another reduced to an alcohol. Iodoform test (I₂/NaOH, yellow CHI₃) shows a CH₃CO– group.'
      check:
        prompt: 'Benzaldehyde with conc. NaOH undergoes:'
        options:
        - Cannizzaro reaction
        - aldol condensation
        - no reaction
        answer: Cannizzaro reaction
        why: It has no α-hydrogen.
  items:
  - prompt: Which gives a silver mirror with Tollens' reagent?
    options:
    - ethanal
    - propanone
    - ethanol
    - ethanoic acid
    answer: ethanal
    difficulty: 1
    hints:
    - Aldehyde.
    - Easily oxidised.
    solution: Ethanal.
    mistakes:
      propanone: c12c_tollens
  - prompt: Which gives a positive iodoform test?
    options:
    - propanone
    - methanal
    - benzaldehyde
    - methanol
    answer: propanone
    difficulty: 2
    hints:
    - Has CH₃CO–.
    - Yellow precipitate.
    solution: Propanone.
    mistakes: {"methanal": "c12_iodoform_test", "benzaldehyde": "c12_iodoform_test", "methanol": "c12_iodoform_test"}
  - prompt: 'Clemmensen reduction converts C=O into:'
    options:
    - CH₂
    - CH–OH
    - COOH
    - C≡C
    answer: CH₂
    difficulty: 2
    hints:
    - Zn-Hg + HCl.
    - Removes oxygen.
    solution: CH₂.
    mistakes: {"CH–OH": "c12_clemmensen", "COOH": "c12_clemmensen", "C≡C": "c12_clemmensen"}
  - prompt: 'Aldehydes without α-hydrogens, like HCHO, undergo:'
    options:
    - Cannizzaro reaction
    - aldol condensation
    - Rosenmund reduction
    - Hell–Volhard–Zelinsky
    answer: Cannizzaro reaction
    difficulty: 2
    hints:
    - No α-H.
    - Self oxidation–reduction.
    solution: The Cannizzaro reaction.
    mistakes: {"aldol condensation": "c12_cannizzaro", "Rosenmund reduction": "c12_cannizzaro", "Hell–Volhard–Zelinsky": "c12_cannizzaro"}
  - prompt: 'Aldehydes are more reactive than ketones in nucleophilic addition because:'
    options:
    - they are less hindered and their carbonyl carbon is more positive
    - they are heavier
    - they have no oxygen
    - they are gases
    answer: they are less hindered and their carbonyl carbon is more positive
    difficulty: 2
    hints:
    - One alkyl group only.
    - Less electron donation.
    solution: Less steric hindrance and a more positive carbonyl carbon.
    mistakes: {"they are heavier": "c12_aldehyde_reactive", "they have no oxygen": "c12_aldehyde_reactive", "they are gases": "c12_aldehyde_reactive"}
  - prompt: How many carbon atoms are in propanone?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - prop = 3.
    - Acetone.
    solution: '3.'
    mistakes: {"2": "c12_prop", "4": "c12_prop"}
  - prompt: Which gives a red precipitate with Fehling's solution?
    options:
    - propanal
    - propanone
    - benzoic acid
    answer: propanal
    difficulty: 1
    hints:
    - Fehling's is reduced by aliphatic aldehydes.
    - Ketones do not react.
    solution: 'Step 1: aldehyde. Step 2: propanal.'
    mistakes:
      propanone: c12c8_test
      benzoic acid: c12c8_test
  - prompt: How many carbon atoms are in butanal?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - but- means 4 carbons.
    - The –CHO carbon counts.
    solution: 'Step 1: but-. Step 2: 4.'
    mistakes:
      '3': c12c8_rxn
      '5': c12c8_rxn
  - prompt: Which undergoes aldol condensation?
    options:
    - ethanal
    - methanal
    - benzaldehyde
    answer: ethanal
    difficulty: 1
    hints:
    - Aldol needs an α-hydrogen.
    - Check the carbon next to C=O.
    solution: 'Step 1: CH₃CHO has α-H. Step 2: ethanal.'
    mistakes:
      methanal: c12c8_rxn
      benzaldehyde: c12c8_rxn
  - prompt: 'Wolff–Kishner reduction of propanone gives:'
    options:
    - propane
    - propan-2-ol
    - propanal
    answer: propane
    difficulty: 2
    hints:
    - C=O becomes CH₂.
    - No oxygen left.
    solution: 'Step 1: C=O → CH₂. Step 2: CH₃CH₂CH₃.'
    mistakes:
      propan-2-ol: c12c8_rxn
      propanal: c12c8_rxn
  - prompt: Which gives a yellow precipitate with I₂ and NaOH?
    options:
    - ethanal
    - propanal
    - methanal
    answer: ethanal
    difficulty: 2
    hints:
    - Iodoform needs CH₃CO–.
    - Only one aldehyde has it.
    solution: 'Step 1: CH₃CHO has CH₃CO–. Step 2: ethanal.'
    mistakes:
      propanal: c12c8_test
      methanal: c12c8_test
  - prompt: 'Ethanal + HCN gives a:'
    options:
    - cyanohydrin
    - oxime
    - acetal
    answer: cyanohydrin
    difficulty: 2
    hints:
    - CN⁻ adds to the carbon.
    - –OH and –CN on one carbon.
    solution: 'Step 1: nucleophilic addition. Step 2: cyanohydrin.'
    mistakes:
      oxime: c12c8_rxn
      acetal: c12c8_rxn
  - prompt: 'HCHO with conc. NaOH gives methanol and:'
    options:
    - sodium methanoate
    - ethanal
    - methane
    answer: sodium methanoate
    difficulty: 2
    hints:
    - 'Cannizzaro: one oxidised, one reduced.'
    - The oxidised one forms a salt.
    solution: 'Step 1: one HCHO → CH₃OH. Step 2: the other → HCOONa.'
    mistakes:
      ethanal: c12c8_rxn
      methane: c12c8_rxn
  - prompt: 'Benzene + CH₃COCl with anhydrous AlCl₃ gives:'
    options:
    - acetophenone
    - benzaldehyde
    - toluene
    answer: acetophenone
    difficulty: 3
    hints:
    - Friedel–Crafts acylation.
    - C₆H₅COCH₃.
    solution: 'Step 1: acyl group adds. Step 2: acetophenone.'
    mistakes:
      benzaldehyde: c12c8_rxn
      toluene: c12c8_rxn
  - prompt: Which test distinguishes pentan-2-one from pentan-3-one?
    options:
    - iodoform test
    - Tollens' test
    - Fehling's test
    answer: iodoform test
    difficulty: 3
    hints:
    - Both are ketones.
    - Only one has CH₃CO–.
    solution: 'Step 1: pentan-2-one is a methyl ketone. Step 2: gives CHI₃.'
    mistakes:
      Tollens' test: c12c8_test
      Fehling's test: c12c8_test
- code: cbse12c.carb.acids
  title: Carboxylic acids
  after:
  - cbse12c.carb.carbonyl
  notes: |
    Carboxylic acids –COOH: nomenclature (-oic acid); preparation (oxidation of alcohols/aldehydes, from nitriles, Grignard +
    CO₂, alkylbenzenes with KMnO₄). Physical properties: dimers by hydrogen bonding, high boiling points. Acidity: stronger than
    phenols and alcohols (carboxylate resonance); effect of substituents (Cl₃CCOOH strongest; electron-withdrawing increase);
    react with NaHCO₃ releasing CO₂ (test). Reactions: esterification, acid chlorides (SOCl₂), amides, anhydrides; reduction
    (LiAlH₄), decarboxylation (soda lime), Hell–Volhard–Zelinsky α-halogenation; ring substitution in benzoic acid (meta).
  explanations:
    text: Carboxylic acids have the –COOH group. They're stronger acids than alcohols and phenols because the negative charge left behind is shared between two oxygens. They fizz with sodium bicarbonate, giving off carbon dioxide.
    visual: Draw the carboxylate ion with its charge shared equally across both oxygens by resonance. That sharing makes it stable, so the acid gives up H⁺ readily.
    step_by_step: 'Step 1: Acid strength: carboxylic acid > phenol > alcohol. Step 2: Electron-withdrawing groups near –COOH increase strength. Step 3: NaHCO₃ test: fizz of CO₂ means a carboxylic acid.'
    real_world: Vinegar is a dilute (about 6–8%) solution of ethanoic (acetic) acid in water.
  picture:
    kind: flow
    steps:
    - Acid + alcohol
    - Warm with conc. H₂SO₄
    - Ester + water
    - Fruity smell
    alt: 'Esterification: a carboxylic acid and an alcohol form a sweet-smelling ester.'
  activity:
    type: order
    prompt: Put these acids in order of strength, weakest first.
    steps:
    - CH₃COOH, ethanoic acid
    - HCOOH, methanoic acid
    - ClCH₂COOH, chloroethanoic acid
    - FCH₂COOH, fluoroethanoic acid
    - Cl₂CHCOOH, dichloroethanoic acid
    - Cl₃CCOOH, trichloroethanoic acid
    reasons:
      HCOOH, methanoic acid: Ethanoic acid's CH₃ pushes electrons in (+I), destabilising its anion, so methanoic acid is stronger.
      ClCH₂COOH, chloroethanoic acid: Cl pulls electrons away (−I) and spreads the negative charge, so it is stronger still.
      FCH₂COOH, fluoroethanoic acid: 'F is more electronegative than Cl: a stronger −I pull.'
      Cl₂CHCOOH, dichloroethanoic acid: Two Cl atoms pull more than one F.
      Cl₃CCOOH, trichloroethanoic acid: 'Three Cl atoms: the strongest pull, the strongest acid here.'
  lesson:
    - teach: Carboxylic acids contain –COOH; names end in -oic acid. They can be made by oxidising primary alcohols or aldehydes, hydrolysing nitriles, adding CO₂ to Grignard reagents, or oxidising alkylbenzenes with KMnO₄ (giving benzoic acid). They form hydrogen-bonded dimers, so they boil high.
      check:
        prompt: 'Toluene with hot KMnO₄ gives:'
        options:
        - benzoic acid
        - benzaldehyde
        - phenol
        answer: benzoic acid
        why: The side chain is oxidised to –COOH.
    - teach: 'They are stronger acids than phenols and alcohols because the carboxylate ion is resonance-stabilised with the charge shared over two O atoms. They fizz with NaHCO₃, giving CO₂ (phenols do not). Electron-withdrawing groups increase acidity: CCl₃COOH > CHCl₂COOH > CH₂ClCOOH > CH₃COOH.'
      picture:
        kind: flow
        steps:
        - CH₃COOH
        - ClCH₂COOH
        - Cl₂CHCOOH
        - Cl₃CCOOH (strongest)
        alt: Acid strength rises as more chlorine atoms are added.
      check:
        prompt: 'Which is the stronger acid: CH₃COOH or FCH₂COOH?'
        options:
        - FCH₂COOH
        - CH₃COOH
        - equal
        answer: FCH₂COOH
        why: F withdraws electrons, stabilising the anion.
    - teach: 'Reactions: with alcohols (acid catalyst) to esters; with SOCl₂ to acid chlorides; to amides and anhydrides; LiAlH₄ reduces to alcohols; soda lime removes CO₂ (decarboxylation) to give an alkane with one less carbon; Hell–Volhard–Zelinsky adds Cl or Br at the α-carbon. In benzoic acid, –COOH directs to meta.'
      check:
        prompt: 'Sodium propanoate with soda lime gives:'
        options:
        - ethane
        - propane
        - methane
        answer: ethane
        why: Decarboxylation removes one carbon.
  items:
  - prompt: Which is the strongest acid?
    options:
    - CCl₃COOH
    - CH₃COOH
    - CH₂ClCOOH
    - HCOOH
    answer: CCl₃COOH
    difficulty: 2
    hints:
    - Three –Cl.
    - Strong pull.
    solution: Trichloroacetic acid.
    mistakes:
      CH₃COOH: c12c_acidity
  - prompt: 'A test that distinguishes a carboxylic acid from phenol is:'
    options:
    - effervescence with NaHCO₃
    - reaction with Na
    - burning
    - colour with litmus only
    answer: effervescence with NaHCO₃
    difficulty: 1
    hints:
    - CO₂ bubbles.
    - Phenol too weak.
    solution: Fizzing with sodium bicarbonate.
    mistakes: {"reaction with Na": "c12_bicarbonate", "burning": "c12_bicarbonate", "colour with litmus only": "c12_bicarbonate"}
  - prompt: 'Carboxylic acids have high boiling points because they form:'
    options:
    - hydrogen-bonded dimers
    - ionic lattices
    - metallic bonds
    - no intermolecular forces
    answer: hydrogen-bonded dimers
    difficulty: 2
    hints:
    - Two H bonds.
    - Pairs.
    solution: Hydrogen-bonded dimers.
    mistakes: {"ionic lattices": "c12_dimer", "metallic bonds": "c12_dimer", "no intermolecular forces": "c12_dimer"}
  - prompt: 'Heating sodium ethanoate with soda lime gives:'
    options:
    - methane
    - ethane
    - ethanol
    - propane
    answer: methane
    difficulty: 2
    hints:
    - Decarboxylation.
    - Loses CO₂.
    solution: Methane.
    mistakes: {"ethane": "c12_decarboxylation", "ethanol": "c12_decarboxylation", "propane": "c12_decarboxylation"}
  - prompt: 'Acid + alcohol with conc. H₂SO₄ gives a(n):'
    options:
    - ester
    - ether
    - aldehyde
    - amine
    answer: ester
    difficulty: 1
    hints:
    - Esterification.
    - Fruity smell.
    solution: An ester.
    mistakes: {"ether": "c12_esterification", "aldehyde": "c12_esterification", "amine": "c12_esterification"}
  - prompt: Vinegar is a dilute solution of which acid?
    options:
    - ethanoic acid
    - methanoic acid
    - benzoic acid
    - oxalic acid
    answer: ethanoic acid
    difficulty: 1
    hints:
    - Its common name is acetic acid.
    - Two carbon atoms.
    solution: Vinegar is a dilute (about 6–8%) solution of ethanoic (acetic) acid in water.
    mistakes:
      methanoic acid: c12c_acidity
  - prompt: How many carbon atoms are in butanoic acid?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - but- = 4.
    - The –COOH carbon counts.
    solution: 'Step 1: but-. Step 2: 4.'
    mistakes:
      '3': c12c8_acid
      '5': c12c8_acid
  - prompt: 'Ethanoic acid + ethanol (conc. H₂SO₄) gives:'
    options:
    - ethyl ethanoate
    - ethanal
    - ethene
    answer: ethyl ethanoate
    difficulty: 1
    hints:
    - Acid + alcohol → ester.
    - 'Name: alkyl from the alcohol + -oate.'
    solution: 'Step 1: esterification. Step 2: CH₃COOC₂H₅.'
    mistakes:
      ethanal: c12c8_rxn
      ethene: c12c8_rxn
  - prompt: Which gas is given off when an acid reacts with NaHCO₃?
    options:
    - carbon dioxide
    - hydrogen
    - oxygen
    answer: carbon dioxide
    difficulty: 1
    hints:
    - Bicarbonate breaks down.
    - It turns limewater milky.
    solution: 'Step 1: H⁺ + HCO₃⁻. Step 2: CO₂ + H₂O.'
    mistakes:
      hydrogen: c12c8_test
      oxygen: c12c8_test
  - prompt: Which of these chloro acids is the strongest?
    options:
    - Cl₂CHCOOH
    - ClCH₂COOH
    - CH₃COOH
    answer: Cl₂CHCOOH
    difficulty: 2
    hints:
    - More chlorine, more electron withdrawal.
    - Count the Cl atoms.
    solution: 'Step 1: two Cl atoms. Step 2: strongest of these.'
    mistakes:
      ClCH₂COOH: c12c8_acid
      CH₃COOH: c12c8_acid
  - prompt: 'CH₃MgBr + CO₂, then acid, gives:'
    options:
    - ethanoic acid
    - methanoic acid
    - propanoic acid
    answer: ethanoic acid
    difficulty: 2
    hints:
    - CO₂ adds one carbon.
    - CH₃ + COOH.
    solution: 'Step 1: CH₃COOMgBr. Step 2: CH₃COOH.'
    mistakes:
      methanoic acid: c12c8_rxn
      propanoic acid: c12c8_rxn
  - prompt: 'Ethanoic acid + SOCl₂ gives:'
    options:
    - ethanoyl chloride
    - chloroethane
    - ethanal
    answer: ethanoyl chloride
    difficulty: 2
    hints:
    - –OH of –COOH is replaced by Cl.
    - An acid chloride.
    solution: 'Step 1: –COOH → –COCl. Step 2: CH₃COCl.'
    mistakes:
      chloroethane: c12c8_rxn
      ethanal: c12c8_rxn
  - prompt: 'Nitration of benzoic acid gives mainly:'
    options:
    - m-nitrobenzoic acid
    - o-nitrobenzoic acid
    - p-nitrobenzoic acid
    answer: m-nitrobenzoic acid
    difficulty: 2
    hints:
    - –COOH withdraws electrons.
    - It is a meta director.
    solution: 'Step 1: deactivating group. Step 2: meta product.'
    mistakes:
      o-nitrobenzoic acid: c12c8_acid
      p-nitrobenzoic acid: c12c8_acid
  - prompt: Why is ethanoic acid a stronger acid than phenol?
    options:
    - the carboxylate charge is shared equally over two O atoms
    - phenol has no –OH
    - ethanoic acid is a gas
    answer: the carboxylate charge is shared equally over two O atoms
    difficulty: 3
    hints:
    - Compare the two anions.
    - Phenoxide puts charge on carbon atoms too.
    solution: 'Step 1: carboxylate has two equal resonance forms on O. Step 2: more stable, stronger acid.'
    mistakes:
      phenol has no –OH: c12c8_acid
      ethanoic acid is a gas: c12c8_acid
  - prompt: 'CH₃COOH + Cl₂ with red phosphorus gives:'
    options:
    - ClCH₂COOH
    - CH₃COCl
    - CH₃Cl
    answer: ClCH₂COOH
    difficulty: 3
    hints:
    - Hell–Volhard–Zelinsky reaction.
    - Halogen goes to the α-carbon.
