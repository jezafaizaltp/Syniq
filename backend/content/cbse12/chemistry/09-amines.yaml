# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse12-chem
chapter: 9
title: Amines
tips:
  c12c_basic: 'In water, basicity of ethylamines: 2° > 3° > 1° > NH₃; aniline is much weaker because its lone pair is spread into the ring.'
  c12c_hinsberg: 'Hinsberg test: 1° amine gives a product soluble in alkali, 2° gives an insoluble one, 3° doesn''t react.'
concepts:
- code: cbse12c.amine.basicity
  title: Structure, preparation and basicity
  notes: |
    Amines: derivatives of NH₃; 1°, 2°, 3°; pyramidal N with a lone pair. Nomenclature. Preparation: reduction of nitro
    compounds (Sn/HCl, Fe/HCl), ammonolysis of alkyl halides, reduction of nitriles and amides, Gabriel phthalimide synthesis
    (pure 1° amines), Hoffmann bromamide degradation (one carbon fewer). Basicity: lone pair; alkylamines stronger than NH₃
    (+I); in water order 2° > 3° > 1° (solvation, steric); aryl amines weaker (lone pair delocalised). pKb values.
  explanations:
    text: Amines are like ammonia with some hydrogens replaced by carbon groups. The lone pair on nitrogen makes them bases. Alkyl groups push electrons onto nitrogen, making alkylamines stronger bases than ammonia, while aniline is weaker because its lone pair spreads into the benzene ring.
    visual: 'Draw aniline with the nitrogen''s lone pair drawn into the ring by resonance: less available to grab a proton, so aniline is a weak base.'
    step_by_step: 'Step 1: Classify the amine (1°, 2°, 3°). Step 2: Alkyl groups raise basicity. Step 3: Aryl groups lower it. Step 4: Smaller pKb = stronger base.'
    real_world: Many medicines, like paracetamol and antihistamines, contain amine groups.
  picture:
    kind: compare
    columns:
    - title: Amine
      points:
      - 1°
      - 2°
      - 3°
    - title: Groups on N
      points:
      - one
      - two
      - three
    - title: Example
      points:
      - CH₃NH₂
      - (CH₃)₂NH
      - (CH₃)₃N
    alt: Primary, secondary and tertiary amines.
  items:
  - prompt: Which is the weakest base?
    options:
    - aniline
    - methylamine
    - ammonia
    - dimethylamine
    answer: aniline
    difficulty: 1
    hints:
    - Lone pair in the ring.
    - Aryl amine.
    solution: Aniline.
    mistakes:
      ammonia: c12c_basic
  - prompt: Which is the strongest base in water?
    options:
    - (C₂H₅)₂NH
    - C₂H₅NH₂
    - (C₂H₅)₃N
    - NH₃
    answer: (C₂H₅)₂NH
    difficulty: 2
    hints:
    - 2° > 3° > 1° in water.
    - Solvation and +I.
    solution: Diethylamine.
  - prompt: 'Gabriel phthalimide synthesis gives:'
    options:
    - pure primary amines
    - secondary amines
    - tertiary amines
    - aromatic amines
    answer: pure primary amines
    difficulty: 2
    hints:
    - No over-alkylation.
    - 1° only.
    solution: Pure primary amines.
  - prompt: Hoffmann bromamide degradation of a 3-carbon amide gives an amine with how many carbons?
    answer: '2'
    check: 3-1
    difficulty: 2
    hints:
    - One carbon fewer.
    - 3 − 1.
    solution: '2.'
  - prompt: 'Nitrobenzene reduced with Sn/HCl gives:'
    options:
    - aniline
    - phenol
    - benzoic acid
    - benzene
    answer: aniline
    difficulty: 1
    hints:
    - –NO₂ → –NH₂.
    - Reduction.
    solution: Aniline.
  - prompt: 'Amines are basic because of:'
    options:
    - the lone pair on nitrogen
    - the hydrogen atoms
    - the carbon chain
    - oxygen atoms
    answer: the lone pair on nitrogen
    difficulty: 1
    hints:
    - Accepts H⁺.
    - Like NH₃.
    solution: The lone pair on nitrogen.
- code: cbse12c.amine.reactions
  title: Reactions of amines and diazonium salts
  after:
  - cbse12c.amine.basicity
  notes: |
    Reactions: alkylation, acylation (amides; protects –NH₂), carbylamine test (1° amines + CHCl₃ + KOH → foul isocyanide),
    reaction with nitrous acid (1° aliphatic → alcohol + N₂; 1° aromatic at 0–5 °C → diazonium salt), Hinsberg's reagent
    (benzenesulfonyl chloride: distinguishes 1°, 2°, 3°). Aniline: very reactive ring (bromine water → 2,4,6-tribromoaniline);
    nitration gives meta product too (anilinium ion); acetylation controls it. Diazonium salts ArN₂⁺Cl⁻: Sandmeyer (CuCl, CuBr,
    CuCN), replacement by –OH, –H (H₃PO₂), –I (KI); coupling reactions to azo dyes (orange/yellow).
  explanations:
    text: Amines react with many reagents, and simple tests tell primary, secondary and tertiary amines apart. Aromatic primary amines like aniline form diazonium salts in the cold, which are used to make many compounds, including bright azo dyes.
    visual: 'Picture adding a diazonium salt to phenol in alkali: a bright orange dye forms instantly. That''s a coupling reaction.'
    step_by_step: 'Step 1: Carbylamine test (foul smell) → 1° amine. Step 2: Hinsberg: soluble in alkali → 1°, insoluble → 2°, no reaction → 3°. Step 3: Aniline + HNO₂ at 0–5 °C → diazonium salt. Step 4: Diazonium + phenol → azo dye.'
    real_world: Many food colours and textile dyes are azo compounds made from diazonium salts.
  picture:
    kind: flow
    steps:
    - Aniline
    - NaNO₂ + HCl at 0–5 °C
    - Benzenediazonium chloride
    - Couple with phenol
    - Orange azo dye
    alt: Making an azo dye from aniline via a diazonium salt.
  items:
  - prompt: 'The carbylamine test (foul smell) is given by:'
    options:
    - primary amines
    - secondary amines
    - tertiary amines
    - all amines
    answer: primary amines
    difficulty: 1
    hints:
    - Isocyanide forms.
    - Only 1°.
    solution: Primary amines.
  - prompt: 'Aniline with NaNO₂ and HCl at 0–5 °C gives:'
    options:
    - benzenediazonium chloride
    - phenol
    - nitrobenzene
    - benzene
    answer: benzenediazonium chloride
    difficulty: 2
    hints:
    - Diazotisation.
    - Must be cold.
    solution: Benzenediazonium chloride.
  - prompt: 'In the Hinsberg test, a tertiary amine:'
    options:
    - does not react
    - gives an alkali-soluble product
    - gives an insoluble product
    - explodes
    answer: does not react
    difficulty: 2
    hints:
    - No N–H.
    - No sulfonamide.
    solution: Does not react.
    mistakes:
      gives an insoluble product: c12c_hinsberg
  - prompt: 'Aniline with bromine water gives:'
    options:
    - 2,4,6-tribromoaniline
    - bromobenzene
    - no reaction
    - 4-bromoaniline only
    answer: 2,4,6-tribromoaniline
    difficulty: 2
    hints:
    - Very reactive ring.
    - White precipitate.
    solution: 2,4,6-tribromoaniline.
  - prompt: 'Replacing –N₂⁺ by –Cl using CuCl is the:'
    options:
    - Sandmeyer reaction
    - Gabriel synthesis
    - Hoffmann reaction
    - Wurtz reaction
    answer: Sandmeyer reaction
    difficulty: 2
    hints:
    - Copper(I) salt.
    - Diazonium.
    solution: The Sandmeyer reaction.
  - prompt: 'Azo dyes are made by:'
    options:
    - coupling diazonium salts with phenols or amines
    - burning amines
    - oxidising alcohols
    - polymerising ethene
    answer: coupling diazonium salts with phenols or amines
    difficulty: 1
    hints:
    - –N=N–.
    - Bright colours.
    solution: Coupling diazonium salts with phenols or amines.
