# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse12-chem
chapter: 9
title: Amines
tips:
  c12c_basic: "A base is stronger when its N lone pair is free. In one compound the lone pair is spread into a benzene ring and less free. Which one?"
  c12c_hinsberg: 'Hinsberg test: 1° amine gives a product soluble in alkali, 2° gives an insoluble one, 3° doesn''t react.'
  c12_amine_base: "In water, inductive effect and solvation both matter. For ethyl groups, the secondary amine wins."
  c12_azo: "Azo dyes have –N=N– joining two rings: a diazonium salt couples with an activated ring."
  c12_bromine_aniline: "–NH₂ activates the ring as strongly as –OH in phenol."
  c12_carbylamine: "The carbylamine test needs two H atoms on N."
  c12_diazotisation: "Aromatic primary amines with cold nitrous acid give diazonium salts."
  c12_gabriel: "Gabriel synthesis stops at one alkyl group on N."
  c12_hoffmann: "Hoffmann bromamide removes one carbon (as CO₂)."
  c12_lone_pair: "A base accepts H⁺. Which part of the amine can share electrons with it?"
  c12_nitro_reduction: "Reducing –NO₂ gives –NH₂ on the benzene ring."
  c12_sandmeyer: "Copper(I) salts replace the diazo group: the reaction is named after its discoverer."
concepts:
- code: cbse12c.amine.basicity
  title: Structure, preparation and basicity
  notes: |
    Amines: derivatives of NH₃; 1°, 2°, 3°; pyramidal N with a lone pair. Nomenclature. Preparation: reduction of nitro
    compounds (Sn/HCl, Fe/HCl), ammonolysis of alkyl halides, reduction of nitriles and amides, Gabriel phthalimide synthesis
    (pure 1° amines), Hoffmann bromamide degradation (one carbon fewer). Basicity: lone pair; alkylamines stronger than NH₃
    (+I); in water order 2° > 3° > 1° (solvation, steric); aryl amines weaker (lone pair delocalised). pKb values.
  explanations:
    text: Amines are like ammonia with some hydrogens replaced by carbon groups. The lone pair on nitrogen makes them bases. Alkyl groups push electrons onto nitrogen, making alkylamines stronger bases than ammonia, while aniline is weaker because its lone pair spreads into the benzene ring.
    visual: 'Draw aniline with the nitrogen''s lone pair drawn into the ring by resonance: less available to grab a proton, so aniline is a weak base.'
    step_by_step: 'Step 1: Classify the amine (1°, 2°, 3°). Step 2: Alkyl groups raise basicity. Step 3: Aryl groups lower it. Step 4: Smaller pKb = stronger base.'
    real_world: Many medicines, like paracetamol and antihistamines, contain amine groups.
  picture:
    kind: compare
    columns:
    - title: Amine
      points:
      - 1°
      - 2°
      - 3°
    - title: Groups on N
      points:
      - one
      - two
      - three
    - title: Example
      points:
      - CH₃NH₂
      - (CH₃)₂NH
      - (CH₃)₃N
    alt: Primary, secondary and tertiary amines.
  activity:
    type: order
    prompt: Put these in order of basic strength in water, weakest first.
    steps:
    - Aniline, C₆H₅NH₂
    - Ammonia, NH₃
    - Trimethylamine, (CH₃)₃N
    - Methylamine, CH₃NH₂
    - Dimethylamine, (CH₃)₂NH
    reasons:
      Ammonia, NH₃: Aniline's lone pair is spread into the ring by resonance, so ammonia holds its lone pair more freely.
      Trimethylamine, (CH₃)₃N: Methyl groups push electrons onto N, but three of them crowd it and its ion is poorly solvated by water.
      Methylamine, CH₃NH₂: One methyl pushes electrons in, and its ion is well solvated by water.
      Dimethylamine, (CH₃)₂NH: Two methyls give the best balance of electron push and solvation in water.
  items:
  - prompt: Which is the weakest base?
    options:
    - aniline
    - methylamine
    - ammonia
    - dimethylamine
    answer: aniline
    difficulty: 1
    hints:
    - Lone pair in the ring.
    - Aryl amine.
    solution: Aniline.
    mistakes:
      ammonia: c12c_basic
  - prompt: Which is the strongest base in water?
    options:
    - (C₂H₅)₂NH
    - C₂H₅NH₂
    - (C₂H₅)₃N
    - NH₃
    answer: (C₂H₅)₂NH
    difficulty: 2
    hints:
    - 2° > 3° > 1° in water.
    - Solvation and +I.
    solution: Diethylamine.
    mistakes: {"C₂H₅NH₂": "c12_amine_base", "(C₂H₅)₃N": "c12_amine_base", "NH₃": "c12_amine_base"}
  - prompt: 'Gabriel phthalimide synthesis gives:'
    options:
    - pure primary amines
    - secondary amines
    - tertiary amines
    - aromatic amines
    answer: pure primary amines
    difficulty: 2
    hints:
    - No over-alkylation.
    - 1° only.
    solution: Pure primary amines.
    mistakes: {"secondary amines": "c12_gabriel", "tertiary amines": "c12_gabriel", "aromatic amines": "c12_gabriel"}
  - prompt: Hoffmann bromamide degradation of a 3-carbon amide gives an amine with how many carbons?
    answer: '2'
    check: 3-1
    difficulty: 2
    hints:
    - One carbon fewer.
    - 3 − 1.
    solution: '2.'
    mistakes: {"3": "c12_hoffmann", "4": "c12_hoffmann"}
  - prompt: 'Nitrobenzene reduced with Sn/HCl gives:'
    options:
    - aniline
    - phenol
    - benzoic acid
    - benzene
    answer: aniline
    difficulty: 1
    hints:
    - –NO₂ → –NH₂.
    - Reduction.
    solution: Aniline.
    mistakes: {"phenol": "c12_nitro_reduction", "benzoic acid": "c12_nitro_reduction", "benzene": "c12_nitro_reduction"}
  - prompt: 'Amines are basic because of:'
    options:
    - the lone pair on nitrogen
    - the hydrogen atoms
    - the carbon chain
    - oxygen atoms
    answer: the lone pair on nitrogen
    difficulty: 1
    hints:
    - Accepts H⁺.
    - Like NH₃.
    solution: The lone pair on nitrogen.
    mistakes: {"the hydrogen atoms": "c12_lone_pair", "the carbon chain": "c12_lone_pair", "oxygen atoms": "c12_lone_pair"}
- code: cbse12c.amine.reactions
  title: Reactions of amines and diazonium salts
  after:
  - cbse12c.amine.basicity
  notes: |
    Reactions: alkylation, acylation (amides; protects –NH₂), carbylamine test (1° amines + CHCl₃ + KOH → foul isocyanide),
    reaction with nitrous acid (1° aliphatic → alcohol + N₂; 1° aromatic at 0–5 °C → diazonium salt), Hinsberg's reagent
    (benzenesulfonyl chloride: distinguishes 1°, 2°, 3°). Aniline: very reactive ring (bromine water → 2,4,6-tribromoaniline);
    nitration gives meta product too (anilinium ion); acetylation controls it. Diazonium salts ArN₂⁺Cl⁻: Sandmeyer (CuCl, CuBr,
    CuCN), replacement by –OH, –H (H₃PO₂), –I (KI); coupling reactions to azo dyes (orange/yellow).
  explanations:
    text: Amines react with many reagents, and simple tests tell primary, secondary and tertiary amines apart. Aromatic primary amines like aniline form diazonium salts in the cold, which are used to make many compounds, including bright azo dyes.
    visual: 'Picture adding a diazonium salt to phenol in alkali: a bright orange dye forms instantly. That''s a coupling reaction.'
    step_by_step: 'Step 1: Carbylamine test (foul smell) → 1° amine. Step 2: Hinsberg: soluble in alkali → 1°, insoluble → 2°, no reaction → 3°. Step 3: Aniline + HNO₂ at 0–5 °C → diazonium salt. Step 4: Diazonium + phenol → azo dye.'
    real_world: Many food colours and textile dyes are azo compounds made from diazonium salts.
  picture:
    kind: flow
    steps:
    - Aniline
    - NaNO₂ + HCl at 0–5 °C
    - Benzenediazonium chloride
    - Couple with phenol
    - Orange azo dye
    alt: Making an azo dye from aniline via a diazonium salt.
  activity:
    type: sort
    prompt: Primary, secondary or tertiary amine?
    bins:
    - Primary (1°)
    - Secondary (2°)
    - Tertiary (3°)
    items:
    - label: 'Carbylamine test: foul isocyanide smell'
      bin: Primary (1°)
      clue: This test needs two H atoms on N. Which amine has them?
      why: Only RNH₂ gives the carbylamine reaction.
    - label: 'Hinsberg: product dissolves in alkali'
      bin: Primary (1°)
      clue: The sulfonamide still has an N–H. How many H did N start with?
      why: RNHSO₂Ar keeps an acidic H, so it dissolves in KOH.
    - label: 'Hinsberg: product won''t dissolve in alkali'
      bin: Secondary (2°)
      clue: The sulfonamide has no N–H left. How many H did N start with?
      why: R₂NSO₂Ar has no acidic H.
    - label: No reaction with Hinsberg's reagent
      bin: Tertiary (3°)
      clue: Does N have any H to lose?
      why: R₃N has no N–H.
    - label: 'Aliphatic: N₂ gas bubbles off with nitrous acid'
      bin: Primary (1°)
      clue: Which amine forms an unstable diazonium salt?
      why: RNH₂ + HNO₂ → ROH + N₂.
    - label: Yellow oily nitrosamine with nitrous acid
      bin: Secondary (2°)
      clue: Which amine gives R₂N–N=O?
      why: Secondary amines.
    - label: Ethylamine
      bin: Primary (1°)
      clue: How many carbon groups on N?
      why: 'One: primary.'
    - label: Aniline
      bin: Primary (1°)
      clue: –NH₂ on a ring. How many carbon groups on N?
      why: 'One: primary.'
    - label: Dimethylamine
      bin: Secondary (2°)
      clue: How many methyl groups on N?
      why: 'Two: secondary.'
    - label: N-Methylaniline
      bin: Secondary (2°)
      clue: A ring and a methyl on N. How many carbon groups?
      why: 'Two: secondary.'
    - label: Trimethylamine
      bin: Tertiary (3°)
      clue: How many methyl groups on N?
      why: 'Three: tertiary.'
  items:
  - prompt: 'The carbylamine test (foul smell) is given by:'
    options:
    - primary amines
    - secondary amines
    - tertiary amines
    - all amines
    answer: primary amines
    difficulty: 1
    hints:
    - Isocyanide forms.
    - Only 1°.
    solution: Primary amines.
    mistakes: {"secondary amines": "c12_carbylamine", "tertiary amines": "c12_carbylamine", "all amines": "c12_carbylamine"}
  - prompt: 'Aniline with NaNO₂ and HCl at 0–5 °C gives:'
    options:
    - benzenediazonium chloride
    - phenol
    - nitrobenzene
    - benzene
    answer: benzenediazonium chloride
    difficulty: 2
    hints:
    - Diazotisation.
    - Must be cold.
    solution: Benzenediazonium chloride.
    mistakes: {"phenol": "c12_diazotisation", "nitrobenzene": "c12_diazotisation", "benzene": "c12_diazotisation"}
  - prompt: 'In the Hinsberg test, a tertiary amine:'
    options:
    - does not react
    - gives an alkali-soluble product
    - gives an insoluble product
    - explodes
    answer: does not react
    difficulty: 2
    hints:
    - No N–H.
    - No sulfonamide.
    solution: Does not react.
    mistakes:
      gives an insoluble product: c12c_hinsberg
  - prompt: 'Aniline with bromine water gives:'
    options:
    - 2,4,6-tribromoaniline
    - bromobenzene
    - no reaction
    - 4-bromoaniline only
    answer: 2,4,6-tribromoaniline
    difficulty: 2
    hints:
    - Very reactive ring.
    - White precipitate.
    solution: 2,4,6-tribromoaniline.
    mistakes: {"bromobenzene": "c12_bromine_aniline", "no reaction": "c12_bromine_aniline", "4-bromoaniline only": "c12_bromine_aniline"}
  - prompt: 'Replacing –N₂⁺ by –Cl using CuCl is the:'
    options:
    - Sandmeyer reaction
    - Gabriel synthesis
    - Hoffmann reaction
    - Wurtz reaction
    answer: Sandmeyer reaction
    difficulty: 2
    hints:
    - Copper(I) salt.
    - Diazonium.
    solution: The Sandmeyer reaction.
    mistakes: {"Gabriel synthesis": "c12_sandmeyer", "Hoffmann reaction": "c12_sandmeyer", "Wurtz reaction": "c12_sandmeyer"}
  - prompt: 'Azo dyes are made by:'
    options:
    - coupling diazonium salts with phenols or amines
    - burning amines
    - oxidising alcohols
    - polymerising ethene
    answer: coupling diazonium salts with phenols or amines
    difficulty: 1
    hints:
    - –N=N–.
    - Bright colours.
    solution: Coupling diazonium salts with phenols or amines.
    mistakes: {"burning amines": "c12_azo", "oxidising alcohols": "c12_azo", "polymerising ethene": "c12_azo"}
