# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 9. Format: content/README.md.
subject: cbse12-chem
chapter: 9
title: Amines
tips:
  c12c_basic: "A base is stronger when its N lone pair is free. In one compound the lone pair is spread into a benzene ring and less free. Which one?"
  c12c_hinsberg: 'Hinsberg test: 1° amine gives a product soluble in alkali, 2° gives an insoluble one, 3° doesn''t react.'
  c12_amine_base: "In water, inductive effect and solvation both matter. For ethyl groups, the secondary amine wins."
  c12_azo: "Azo dyes have –N=N– joining two rings: a diazonium salt couples with an activated ring."
  c12_bromine_aniline: "–NH₂ activates the ring as strongly as –OH in phenol."
  c12_carbylamine: "The carbylamine test needs two H atoms on N."
  c12_diazotisation: "Aromatic primary amines with cold nitrous acid give diazonium salts."
  c12_gabriel: "Gabriel synthesis stops at one alkyl group on N."
  c12_hoffmann: "Hoffmann bromamide removes one carbon (as CO₂)."
  c12_lone_pair: "A base accepts H⁺. Which part of the amine can share electrons with it?"
  c12_nitro_reduction: "Reducing –NO₂ gives –NH₂ on the benzene ring."
  c12_sandmeyer: "Copper(I) salts replace the diazo group: the reaction is named after its discoverer."
  c12c9_base: 'Basicity depends on how free the N lone pair is: alkyl groups push electrons in (stronger), an aryl ring pulls the pair into resonance (weaker).'
  c12c9_class: 'Classify an amine by how many carbon groups are on N: one is 1°, two is 2°, three is 3°.'
  c12c9_rxn: 'Match the reagent to the test: CHCl₃/KOH (carbylamine) for 1° only; Hinsberg''s reagent separates 1°, 2°, 3°; NaNO₂/HCl at 0–5 °C makes diazonium salts from aryl 1° amines.'
concepts:
- code: cbse12c.amine.basicity
  title: Structure, preparation and basicity
  notes: |
    Amines: derivatives of NH₃; 1°, 2°, 3°; pyramidal N with a lone pair. Nomenclature. Preparation: reduction of nitro
    compounds (Sn/HCl, Fe/HCl), ammonolysis of alkyl halides, reduction of nitriles and amides, Gabriel phthalimide synthesis
    (pure 1° amines), Hoffmann bromamide degradation (one carbon fewer). Basicity: lone pair; alkylamines stronger than NH₃
    (+I); in water order 2° > 3° > 1° (solvation, steric); aryl amines weaker (lone pair delocalised). pKb values.
  explanations:
    text: Amines are like ammonia with some hydrogens replaced by carbon groups. The lone pair on nitrogen makes them bases. Alkyl groups push electrons onto nitrogen, making alkylamines stronger bases than ammonia, while aniline is weaker because its lone pair spreads into the benzene ring.
    visual: 'Draw aniline with the nitrogen''s lone pair drawn into the ring by resonance: less available to grab a proton, so aniline is a weak base.'
    step_by_step: 'Step 1: Classify the amine (1°, 2°, 3°). Step 2: Alkyl groups raise basicity. Step 3: Aryl groups lower it. Step 4: Smaller pKb = stronger base.'
    real_world: Many medicines, like paracetamol and antihistamines, contain amine groups.
  picture:
    kind: compare
    columns:
    - title: Amine
      points:
      - 1°
      - 2°
      - 3°
    - title: Groups on N
      points:
      - one
      - two
      - three
    - title: Example
      points:
      - CH₃NH₂
      - (CH₃)₂NH
      - (CH₃)₃N
    alt: Primary, secondary and tertiary amines.
  activity:
    type: order
    prompt: Put these in order of basic strength in water, weakest first.
    steps:
    - Aniline, C₆H₅NH₂
    - Ammonia, NH₃
    - Trimethylamine, (CH₃)₃N
    - Methylamine, CH₃NH₂
    - Dimethylamine, (CH₃)₂NH
    reasons:
      Ammonia, NH₃: Aniline's lone pair is spread into the ring by resonance, so ammonia holds its lone pair more freely.
      Trimethylamine, (CH₃)₃N: Methyl groups push electrons onto N, but three of them crowd it and its ion is poorly solvated by water.
      Methylamine, CH₃NH₂: One methyl pushes electrons in, and its ion is well solvated by water.
      Dimethylamine, (CH₃)₂NH: Two methyls give the best balance of electron push and solvation in water.
  lesson:
    - teach: 'Amines are derived from ammonia by replacing H atoms with alkyl or aryl groups: primary (1°, RNH₂), secondary (2°, R₂NH), tertiary (3°, R₃N). Nitrogen is pyramidal with a lone pair, which makes amines basic.'
      check:
        prompt: '(CH₃)₂NH is a:'
        options:
        - secondary amine
        - primary amine
        - tertiary amine
        answer: secondary amine
        why: Two carbon groups on N.
    - teach: 'Preparation: reduce nitro compounds (Sn/HCl or Fe/HCl), ammonolysis of alkyl halides (gives a mixture), reduce nitriles or amides, Gabriel phthalimide synthesis (pure 1° aliphatic amines), Hoffmann bromamide degradation (amide → amine with one carbon fewer).'
      picture:
        kind: flow
        steps:
        - RCONH₂
        - + Br₂ + NaOH
        - loses C=O carbon
        - RNH₂ (one C fewer)
        alt: Hoffmann bromamide degradation shortens the chain by one carbon.
      check:
        prompt: 'Hoffmann degradation of ethanamide (CH₃CONH₂) gives:'
        options:
        - methanamine
        - ethanamine
        - propanamine
        answer: methanamine
        why: 'One carbon is lost: CH₃NH₂.'
    - teach: 'Basicity: alkyl groups push electrons to N (+I), so alkylamines are stronger bases than NH₃. In water the order is 2° > 3° > 1° for ethylamines, balancing +I, solvation and crowding. Aryl amines like aniline are weaker than NH₃ because the lone pair is spread into the ring.'
      check:
        prompt: 'Which is the weaker base: aniline or ammonia?'
        options:
        - aniline
        - ammonia
        - equal
        answer: aniline
        why: Its lone pair is delocalised into the benzene ring.
  items:
  - prompt: Which is the weakest base?
    options:
    - aniline
    - methylamine
    - ammonia
    - dimethylamine
    answer: aniline
    difficulty: 1
    hints:
    - Lone pair in the ring.
    - Aryl amine.
    solution: Aniline.
    mistakes:
      ammonia: c12c_basic
  - prompt: Which is the strongest base in water?
    options:
    - (C₂H₅)₂NH
    - C₂H₅NH₂
    - (C₂H₅)₃N
    - NH₃
    answer: (C₂H₅)₂NH
    difficulty: 2
    hints:
    - 2° > 3° > 1° in water.
    - Solvation and +I.
    solution: Diethylamine.
    mistakes: {"C₂H₅NH₂": "c12_amine_base", "(C₂H₅)₃N": "c12_amine_base", "NH₃": "c12_amine_base"}
  - prompt: 'Gabriel phthalimide synthesis gives:'
    options:
    - pure primary amines
    - secondary amines
    - tertiary amines
    - aromatic amines
    answer: pure primary amines
    difficulty: 2
    hints:
    - No over-alkylation.
    - 1° only.
    solution: Pure primary amines.
    mistakes: {"secondary amines": "c12_gabriel", "tertiary amines": "c12_gabriel", "aromatic amines": "c12_gabriel"}
  - prompt: Hoffmann bromamide degradation of a 3-carbon amide gives an amine with how many carbons?
    answer: '2'
    check: 3-1
    difficulty: 2
    hints:
    - One carbon fewer.
    - 3 − 1.
    solution: '2.'
    mistakes: {"3": "c12_hoffmann", "4": "c12_hoffmann"}
  - prompt: 'Nitrobenzene reduced with Sn/HCl gives:'
    options:
    - aniline
    - phenol
    - benzoic acid
    - benzene
    answer: aniline
    difficulty: 1
    hints:
    - –NO₂ → –NH₂.
    - Reduction.
    solution: Aniline.
    mistakes: {"phenol": "c12_nitro_reduction", "benzoic acid": "c12_nitro_reduction", "benzene": "c12_nitro_reduction"}
  - prompt: 'Amines are basic because of:'
    options:
    - the lone pair on nitrogen
    - the hydrogen atoms
    - the carbon chain
    - oxygen atoms
    answer: the lone pair on nitrogen
    difficulty: 1
    hints:
    - Accepts H⁺.
    - Like NH₃.
    solution: The lone pair on nitrogen.
    mistakes: {"the hydrogen atoms": "c12_lone_pair", "the carbon chain": "c12_lone_pair", "oxygen atoms": "c12_lone_pair"}
  - prompt: How many hydrogen atoms are on N in a primary amine?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - RNH₂.
    - Read the subscript.
    solution: 'Step 1: –NH₂. Step 2: 2.'
    mistakes:
      '1': c12c9_class
      '3': c12c9_class
  - prompt: '(C₂H₅)₃N is a:'
    options:
    - tertiary amine
    - secondary amine
    - primary amine
    answer: tertiary amine
    difficulty: 1
    hints:
    - Count the ethyl groups on N.
    - There are three.
    solution: 'Step 1: three C groups on N. Step 2: tertiary.'
    mistakes:
      secondary amine: c12c9_class
      primary amine: c12c9_class
  - prompt: Which is a stronger base than ammonia?
    options:
    - methylamine
    - aniline
    - p-nitroaniline
    answer: methylamine
    difficulty: 1
    hints:
    - Alkyl groups push electrons in.
    - Aryl groups pull them away.
    solution: 'Step 1: +I effect of CH₃. Step 2: methylamine.'
    mistakes:
      aniline: c12c9_base
      p-nitroaniline: c12c9_base
  - prompt: Hoffmann degradation of butanamide gives an amine with how many carbons?
    answer: '3'
    check: 4 - 1
    difficulty: 2
    hints:
    - Butanamide has 4 carbons.
    - One is lost.
    solution: 'Step 1: 4 − 1. Step 2: propanamine, 3 carbons.'
    mistakes:
      '4': c12c9_rxn
      '5': c12c9_rxn
  - prompt: Why can't Gabriel synthesis make aniline?
    options:
    - aryl halides do not undergo SN2 with phthalimide
    - aniline is a gas
    - phthalimide contains no nitrogen
    answer: aryl halides do not undergo SN2 with phthalimide
    difficulty: 2
    hints:
    - Gabriel needs nucleophilic substitution on the halide.
    - Aryl C–X bonds resist it.
    solution: 'Step 1: aryl halide is unreactive. Step 2: no aromatic amine forms.'
    mistakes:
      aniline is a gas: c12c9_rxn
      phthalimide contains no nitrogen: c12c9_rxn
  - prompt: 'CH₃CN reduced with LiAlH₄ gives:'
    options:
    - ethanamine
    - methanamine
    - ethanamide
    answer: ethanamine
    difficulty: 2
    hints:
    - –CN becomes –CH₂NH₂.
    - No carbon is lost.
    solution: 'Step 1: CH₃–CH₂NH₂. Step 2: ethanamine.'
    mistakes:
      methanamine: c12c9_rxn
      ethanamide: c12c9_rxn
  - prompt: 'Arrange in water by increasing basicity: C₂H₅NH₂, (C₂H₅)₂NH, (C₂H₅)₃N.'
    options:
    - C₂H₅NH₂ < (C₂H₅)₃N < (C₂H₅)₂NH
    - (C₂H₅)₃N < (C₂H₅)₂NH < C₂H₅NH₂
    - C₂H₅NH₂ < (C₂H₅)₂NH < (C₂H₅)₃N
    answer: C₂H₅NH₂ < (C₂H₅)₃N < (C₂H₅)₂NH
    difficulty: 2
    hints:
    - In water, 2° is strongest.
    - 1° is weakest of the three.
    solution: 'Step 1: 2° > 3° > 1°. Step 2: written in increasing order.'
    mistakes:
      (C₂H₅)₃N < (C₂H₅)₂NH < C₂H₅NH₂: c12c9_base
      C₂H₅NH₂ < (C₂H₅)₂NH < (C₂H₅)₃N: c12c9_base
  - prompt: 'Which is the weaker base: aniline or p-methylaniline?'
    options:
    - aniline
    - p-methylaniline
    - equal
    answer: aniline
    difficulty: 3
    hints:
    - –CH₃ pushes electrons into the ring.
    - That makes the lone pair more available.
    solution: 'Step 1: CH₃ is electron-donating. Step 2: p-toluidine is stronger, so aniline is weaker.'
    mistakes:
      p-methylaniline: c12c9_base
      equal: c12c9_base
  - prompt: 'Ammonolysis of an alkyl halide is a poor way to make pure 1° amines because:'
    options:
    - the product reacts further to give 2°, 3° amines and salts
    - no reaction happens
    - it gives only alkenes
    answer: the product reacts further to give 2°, 3° amines and salts
    difficulty: 3
    hints:
    - The amine formed is itself a nucleophile.
    - It attacks more alkyl halide.
    solution: 'Step 1: RNH₂ reacts with RX. Step 2: a mixture forms.'
    mistakes:
      no reaction happens: c12c9_rxn
      it gives only alkenes: c12c9_rxn
- code: cbse12c.amine.reactions
  title: Reactions of amines and diazonium salts
  after:
  - cbse12c.amine.basicity
  notes: |
    Reactions: alkylation, acylation (amides; protects –NH₂), carbylamine test (1° amines + CHCl₃ + KOH → foul isocyanide),
    reaction with nitrous acid (1° aliphatic → alcohol + N₂; 1° aromatic at 0–5 °C → diazonium salt), Hinsberg's reagent
    (benzenesulfonyl chloride: distinguishes 1°, 2°, 3°). Aniline: very reactive ring (bromine water → 2,4,6-tribromoaniline);
    nitration gives meta product too (anilinium ion); acetylation controls it. Diazonium salts ArN₂⁺Cl⁻: Sandmeyer (CuCl, CuBr,
    CuCN), replacement by –OH, –H (H₃PO₂), –I (KI); coupling reactions to azo dyes (orange/yellow).
  explanations:
    text: Amines react with many reagents, and simple tests tell primary, secondary and tertiary amines apart. Aromatic primary amines like aniline form diazonium salts in the cold, which are used to make many compounds, including bright azo dyes.
    visual: 'Picture adding a diazonium salt to phenol in alkali: a bright orange dye forms instantly. That''s a coupling reaction.'
    step_by_step: 'Step 1: Carbylamine test (foul smell) → 1° amine. Step 2: Hinsberg: soluble in alkali → 1°, insoluble → 2°, no reaction → 3°. Step 3: Aniline + HNO₂ at 0–5 °C → diazonium salt. Step 4: Diazonium + phenol → azo dye.'
    real_world: Many food colours and textile dyes are azo compounds made from diazonium salts.
  picture:
    kind: flow
    steps:
    - Aniline
    - NaNO₂ + HCl at 0–5 °C
    - Benzenediazonium chloride
    - Couple with phenol
    - Orange azo dye
    alt: Making an azo dye from aniline via a diazonium salt.
  activity:
    type: sort
    prompt: Primary, secondary or tertiary amine?
    bins:
    - Primary (1°)
    - Secondary (2°)
    - Tertiary (3°)
    items:
    - label: 'Carbylamine test: foul isocyanide smell'
      bin: Primary (1°)
      clue: This test needs two H atoms on N. Which amine has them?
      why: Only RNH₂ gives the carbylamine reaction.
    - label: 'Hinsberg: product dissolves in alkali'
      bin: Primary (1°)
      clue: The sulfonamide still has an N–H. How many H did N start with?
      why: RNHSO₂Ar keeps an acidic H, so it dissolves in KOH.
    - label: 'Hinsberg: product won''t dissolve in alkali'
      bin: Secondary (2°)
      clue: The sulfonamide has no N–H left. How many H did N start with?
      why: R₂NSO₂Ar has no acidic H.
    - label: No reaction with Hinsberg's reagent
      bin: Tertiary (3°)
      clue: Does N have any H to lose?
      why: R₃N has no N–H.
    - label: 'Aliphatic: N₂ gas bubbles off with nitrous acid'
      bin: Primary (1°)
      clue: Which amine forms an unstable diazonium salt?
      why: RNH₂ + HNO₂ → ROH + N₂.
    - label: Yellow oily nitrosamine with nitrous acid
      bin: Secondary (2°)
      clue: Which amine gives R₂N–N=O?
      why: Secondary amines.
    - label: Ethylamine
      bin: Primary (1°)
      clue: How many carbon groups on N?
      why: 'One: primary.'
    - label: Aniline
      bin: Primary (1°)
      clue: –NH₂ on a ring. How many carbon groups on N?
      why: 'One: primary.'
    - label: Dimethylamine
      bin: Secondary (2°)
      clue: How many methyl groups on N?
      why: 'Two: secondary.'
    - label: N-Methylaniline
      bin: Secondary (2°)
      clue: A ring and a methyl on N. How many carbon groups?
      why: 'Two: secondary.'
    - label: Trimethylamine
      bin: Tertiary (3°)
      clue: How many methyl groups on N?
      why: 'Three: tertiary.'
  lesson:
    - teach: 'Tests: primary amines (aliphatic and aromatic) heated with CHCl₃ and alcoholic KOH give foul-smelling isocyanides (carbylamine test). Hinsberg''s reagent (benzenesulfonyl chloride): 1° gives a product soluble in alkali, 2° gives an insoluble product, 3° does not react.'
      picture:
        kind: compare
        columns:
        - title: Amine
          points:
          - 1°
          - 2°
          - 3°
        - title: Hinsberg result
          points:
          - product dissolves in KOH
          - insoluble product
          - no reaction
        alt: How primary, secondary and tertiary amines respond to Hinsberg's reagent.
      check:
        prompt: 'An amine gives a foul smell with CHCl₃ and KOH. It is:'
        options:
        - primary
        - secondary
        - tertiary
        answer: primary
        why: Only 1° amines give the carbylamine reaction.
    - teach: 'Aniline''s –NH₂ strongly activates the ring: bromine water at once gives 2,4,6-tribromoaniline. Acetylation (to acetanilide) tones this down to get a single substitution. In strong acid, aniline becomes anilinium ion, which directs meta, so nitration gives some meta product.'
      check:
        prompt: Why acetylate aniline before nitration?
        options:
        - to control the reactivity and protect –NH₂
        - to make it a gas
        - to make it more basic
        answer: to control the reactivity and protect –NH₂
        why: Acetanilide is less activating and is not oxidised.
    - teach: 'Aromatic 1° amines with NaNO₂ + HCl at 0–5 °C give diazonium salts, ArN₂⁺Cl⁻. These are very useful: Sandmeyer (CuCl, CuBr, CuCN), warming with water (→ phenol), KI (→ iodobenzene), H₃PO₂ (→ benzene), and coupling with phenols or amines to make coloured azo dyes.'
      check:
        prompt: 'Benzenediazonium chloride + KI gives:'
        options:
        - iodobenzene
        - phenol
        - benzene
        answer: iodobenzene
        why: I⁻ replaces –N₂⁺, releasing N₂.
  items:
  - prompt: 'The carbylamine test (foul smell) is given by:'
    options:
    - primary amines
    - secondary amines
    - tertiary amines
    - all amines
    answer: primary amines
    difficulty: 1
    hints:
    - Isocyanide forms.
    - Only 1°.
    solution: Primary amines.
    mistakes: {"secondary amines": "c12_carbylamine", "tertiary amines": "c12_carbylamine", "all amines": "c12_carbylamine"}
  - prompt: 'Aniline with NaNO₂ and HCl at 0–5 °C gives:'
    options:
    - benzenediazonium chloride
    - phenol
    - nitrobenzene
    - benzene
    answer: benzenediazonium chloride
    difficulty: 2
    hints:
    - Diazotisation.
    - Must be cold.
    solution: Benzenediazonium chloride.
    mistakes: {"phenol": "c12_diazotisation", "nitrobenzene": "c12_diazotisation", "benzene": "c12_diazotisation"}
  - prompt: 'In the Hinsberg test, a tertiary amine:'
    options:
    - does not react
    - gives an alkali-soluble product
    - gives an insoluble product
    - explodes
    answer: does not react
    difficulty: 2
    hints:
    - No N–H.
    - No sulfonamide.
    solution: Does not react.
    mistakes:
      gives an insoluble product: c12c_hinsberg
  - prompt: 'Aniline with bromine water gives:'
    options:
    - 2,4,6-tribromoaniline
    - bromobenzene
    - no reaction
    - 4-bromoaniline only
    answer: 2,4,6-tribromoaniline
    difficulty: 2
    hints:
    - Very reactive ring.
    - White precipitate.
    solution: 2,4,6-tribromoaniline.
    mistakes: {"bromobenzene": "c12_bromine_aniline", "no reaction": "c12_bromine_aniline", "4-bromoaniline only": "c12_bromine_aniline"}
  - prompt: 'Replacing –N₂⁺ by –Cl using CuCl is the:'
    options:
    - Sandmeyer reaction
    - Gabriel synthesis
    - Hoffmann reaction
    - Wurtz reaction
    answer: Sandmeyer reaction
    difficulty: 2
    hints:
    - Copper(I) salt.
    - Diazonium.
    solution: The Sandmeyer reaction.
    mistakes: {"Gabriel synthesis": "c12_sandmeyer", "Hoffmann reaction": "c12_sandmeyer", "Wurtz reaction": "c12_sandmeyer"}
  - prompt: 'Azo dyes are made by:'
    options:
    - coupling diazonium salts with phenols or amines
    - burning amines
    - oxidising alcohols
    - polymerising ethene
    answer: coupling diazonium salts with phenols or amines
    difficulty: 1
    hints:
    - –N=N–.
    - Bright colours.
    solution: Coupling diazonium salts with phenols or amines.
    mistakes: {"burning amines": "c12_azo", "oxidising alcohols": "c12_azo", "polymerising ethene": "c12_azo"}
  - prompt: Diazotisation is carried out at about which temperature range?
    options:
    - 0–5 °C
    - 100 °C
    - room temperature only
    answer: 0–5 °C
    difficulty: 1
    hints:
    - Diazonium salts break down when warm.
    - An ice bath is used.
    solution: 'Step 1: unstable salts. Step 2: 0–5 °C.'
    mistakes:
      100 °C: c12c9_rxn
      room temperature only: c12c9_rxn
  - prompt: 'Benzenediazonium chloride warmed with water gives:'
    options:
    - phenol
    - aniline
    - chlorobenzene
    answer: phenol
    difficulty: 1
    hints:
    - –OH replaces –N₂⁺.
    - N₂ escapes.
    solution: 'Step 1: hydrolysis. Step 2: phenol.'
    mistakes:
      aniline: c12c9_rxn
      chlorobenzene: c12c9_rxn
  - prompt: 'Benzenediazonium chloride + CuCN gives:'
    options:
    - benzonitrile
    - benzene
    - phenol
    answer: benzonitrile
    difficulty: 1
    hints:
    - Sandmeyer with cyanide.
    - –CN replaces –N₂⁺.
    solution: 'Step 1: Sandmeyer. Step 2: C₆H₅CN.'
    mistakes:
      benzene: c12c9_rxn
      phenol: c12c9_rxn
  - prompt: Which reagent replaces –N₂⁺ with –H, giving benzene?
    options:
    - H₃PO₂
    - KI
    - CuCl
    answer: H₃PO₂
    difficulty: 2
    hints:
    - A mild reducing agent.
    - Hypophosphorous acid.
    solution: 'Step 1: reduction removes N₂. Step 2: H₃PO₂.'
    mistakes:
      KI: c12c9_rxn
      CuCl: c12c9_rxn
  - prompt: 'Ethylamine with nitrous acid gives mainly:'
    options:
    - ethanol and nitrogen gas
    - a stable diazonium salt
    - no reaction
    answer: ethanol and nitrogen gas
    difficulty: 2
    hints:
    - Aliphatic diazonium salts are very unstable.
    - N₂ bubbles off.
    solution: 'Step 1: unstable diazonium forms. Step 2: gives alcohol + N₂.'
    mistakes:
      a stable diazonium salt: c12c9_rxn
      no reaction: c12c9_rxn
  - prompt: 'Aniline + acetyl chloride gives:'
    options:
    - acetanilide
    - anilinium chloride only
    - benzamide
    answer: acetanilide
    difficulty: 2
    hints:
    - Acylation of –NH₂.
    - An amide forms.
    solution: 'Step 1: –NH₂ → –NHCOCH₃. Step 2: acetanilide.'
    mistakes:
      anilinium chloride only: c12c9_rxn
      benzamide: c12c9_rxn
  - prompt: 'A secondary amine with Hinsberg''s reagent gives a product that is:'
    options:
    - insoluble in alkali
    - soluble in alkali
    - not formed at all
    answer: insoluble in alkali
    difficulty: 2
    hints:
    - The sulphonamide has no H left on N.
    - Without that H it cannot form a salt.
    solution: 'Step 1: no acidic N–H. Step 2: insoluble in KOH.'
    mistakes:
      soluble in alkali: c12c9_rxn
      not formed at all: c12c9_rxn
  - prompt: 'Direct nitration of aniline gives a good amount of meta product because:'
    options:
    - in acid, –NH₂ becomes –NH₃⁺, a meta director
    - –NH₂ is always meta directing
    - nitric acid is weak
    answer: in acid, –NH₂ becomes –NH₃⁺, a meta director
    difficulty: 3
    hints:
