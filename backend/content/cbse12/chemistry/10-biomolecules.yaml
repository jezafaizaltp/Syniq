# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse12-chem
chapter: 10
title: Biomolecules
tips:
  c12c_sugar: "A reducing sugar has a free aldehyde or ketone group. In one common disaccharide, both reducing ends are tied up in the glycosidic bond: table sugar."
  c12c_vitamin: "Fat-soluble vitamins are stored in body fat and can build up; water-soluble ones (the B group and C) must be eaten regularly. Which choice is not in the water-soluble group?"
  c12_aldohexose: "Glucose has an aldehyde group and six carbons."
  c12_cellulose: "Humans can't digest cellulose because of the linkage of its units: the other form from starch."
  c12_glucose_c: "C₆H₁₂O₆."
  c12_glycosidic: "Sugar links are named after 'glycose'; peptide bonds are for proteins."
  c12_lactose: "'Lact' means milk."
  c12_peptide: "Amino acid links: –CO–NH–."
  c12_protein_levels: "Primary, secondary, tertiary, quaternary."
  c12_vitamin_c: "Sailors without fresh fruit got bleeding gums."
  c12c10_sugar: "Sort sugars by size (mono, di, poly), then recall the two units in each common disaccharide: sucrose, maltose and lactose."
  c12c10_prot: Proteins are chains of amino acids joined by peptide bonds; their shape has four levels, and heat or acid can unfold it (denaturation).
  c12c10_vit: Fat-soluble vitamins are A, D, E, K; water-soluble are B and C. Match each with its deficiency disease.
  c12c10_dna: "Compare DNA and RNA one feature at a time: the sugar (one has an oxygen missing), the bases and the strands."
concepts:
- code: cbse12c.biomol.carbs
  title: Carbohydrates
  notes: |
    Carbohydrates: polyhydroxy aldehydes or ketones; monosaccharides (glucose—aldohexose; fructose—ketohexose), oligosaccharides
    (sucrose = glucose + fructose, non-reducing; maltose = 2 glucose; lactose = glucose + galactose), polysaccharides (starch—
    amylose and amylopectin; cellulose—β-glucose; glycogen). Glucose structure: open chain evidence (reactions with HI, HCN,
    Br₂ water, acetylation) and cyclic (α and β anomers, pyranose; mutarotation). Glycosidic linkage. Reducing and non-reducing
    sugars. Importance.
  explanations:
    text: Carbohydrates are sugars and their chains. Glucose and fructose are simple sugars; sucrose (table sugar) is two joined together; starch and cellulose are long chains of glucose. Sugars that can reduce Fehling's or Tollens' reagent are called reducing sugars.
    visual: Draw glucose as a hexagon ring (five carbons and an oxygen) with –OH groups sticking out. Link two through an oxygen bridge (glycosidic bond) to make a disaccharide.
    step_by_step: 'Step 1: Classify by size (mono-, di-, poly-). Step 2: Identify the units. Step 3: Free aldehyde/ketone group → reducing sugar. Step 4: Sucrose''s link blocks both, so it''s non-reducing.'
    real_world: Cotton is almost pure cellulose; humans can't digest it, but cows can, thanks to microbes in their stomachs.
  picture:
    kind: compare
    columns:
    - title: Sugar
      points:
      - glucose
      - sucrose
      - lactose
      - starch
    - title: Made of
      points:
      - one unit
      - glucose + fructose
      - glucose + galactose
      - many glucose units
    alt: Carbohydrates and the sugar units they are made of.
  activity:
    type: sort
    prompt: Reducing or non-reducing sugar? Reducing sugars have a free aldehyde or ketone group that reduces Fehling's and Tollens'.
    bins:
    - Reducing sugar
    - Non-reducing sugar
    items:
    - label: Glucose
      bin: Reducing sugar
      clue: Does it have a free –CHO group?
      why: 'An aldohexose: reducing.'
    - label: Fructose
      bin: Reducing sugar
      clue: It's a ketose. Does it still reduce Tollens' in alkali?
      why: 'Yes: fructose reduces Fehling''s and Tollens''.'
    - label: Maltose
      bin: Reducing sugar
      clue: Glucose joined to glucose via C1–C4. Is one C1 left free?
      why: 'The second glucose''s C1 is free: reducing.'
    - label: Lactose
      bin: Reducing sugar
      clue: Galactose + glucose through C1–C4. Is a free C1 left?
      why: 'Glucose''s C1 is free: reducing.'
    - label: Sucrose
      bin: Non-reducing sugar
      clue: Glucose C1 joins fructose C2. Is any reducing group left free?
      why: 'Both reducing groups are used in the bond: non-reducing.'
    - label: Starch
      bin: Non-reducing sugar
      clue: A huge chain of glucose units. Does one end group make much difference?
      why: 'Practically non-reducing: almost every C1 is bonded.'
    - label: Cellulose
      bin: Non-reducing sugar
      clue: Long β-glucose chains. Reducing groups free?
      why: Non-reducing.
    - label: Glycogen
      bin: Non-reducing sugar
      clue: Highly branched glucose chains. Reducing?
      why: Non-reducing.
  lesson:
    - teach: 'Carbohydrates are polyhydroxy aldehydes or ketones. Monosaccharides cannot be split further: glucose (an aldohexose, C₆H₁₂O₆) and fructose (a ketohexose). Two units make a disaccharide; many make a polysaccharide.'
      check:
        prompt: 'Fructose is a:'
        options:
        - ketohexose
        - aldohexose
        - disaccharide
        answer: ketohexose
        why: Six carbons with a ketone group.
    - teach: 'Disaccharides: sucrose = glucose + fructose (non-reducing, both reducing ends used in the bond), maltose = glucose + glucose, lactose = glucose + galactose (milk sugar). Units are joined by glycosidic linkages. Polysaccharides: starch (amylose + amylopectin, α-glucose), cellulose (β-glucose, plant walls), glycogen (animal store).'
      picture:
        kind: compare
        columns:
        - title: Sugar
          points:
          - sucrose
          - maltose
          - lactose
        - title: Made of
          points:
          - glucose + fructose
          - glucose + glucose
          - glucose + galactose
        alt: Units that make up three common disaccharides.
      check:
        prompt: 'Hydrolysis of maltose gives:'
        options:
        - two glucose
        - glucose and fructose
        - glucose and galactose
        answer: two glucose
        why: Maltose is made of two glucose units.
    - teach: 'Glucose''s open-chain form explains reactions with HI (gives n-hexane), HCN, bromine water (gluconic acid) and acetylation (five –OH). But it does not react with NaHSO₃ or Schiff''s reagent, showing a cyclic form: α and β anomers (six-membered pyranose rings) that interconvert in water (mutarotation).'
      check:
        prompt: 'Glucose with HI forms n-hexane. This shows:'
        options:
        - its six carbons are in a straight chain
        - it has a ring of five carbons
        - it is a ketone
        answer: its six carbons are in a straight chain
        why: HI fully reduces it to an unbranched C₆ alkane.
  items:
  - prompt: How many carbon atoms does glucose have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Hexose.
    - C₆H₁₂O₆.
    solution: '6.'
    mistakes: {"5": "c12_glucose_c", "12": "c12_glucose_c"}
  - prompt: Which sugar is non-reducing?
    options:
    - sucrose
    - glucose
    - maltose
    - lactose
    answer: sucrose
    difficulty: 2
    hints:
    - Both reducing ends tied up.
    - Table sugar.
    solution: Sucrose.
    mistakes:
      maltose: c12c_sugar
  - prompt: 'Milk sugar is:'
    options:
    - lactose
    - sucrose
    - maltose
    - fructose
    answer: lactose
    difficulty: 1
    hints:
    - Lact = milk.
    - Glucose + galactose.
    solution: Lactose.
    mistakes: {"sucrose": "c12_lactose", "maltose": "c12_lactose", "fructose": "c12_lactose"}
  - prompt: 'Cellulose is a polymer of:'
    options:
    - β-glucose
    - α-glucose
    - fructose
    - amino acids
    answer: β-glucose
    difficulty: 2
    hints:
    - Straight chains.
    - Starch is α.
    solution: β-glucose.
    mistakes: {"α-glucose": "c12_cellulose", "fructose": "c12_cellulose", "amino acids": "c12_cellulose"}
  - prompt: 'The bond joining sugar units is the:'
    options:
    - glycosidic linkage
    - peptide bond
    - ester bond
    - hydrogen bond
    answer: glycosidic linkage
    difficulty: 1
    hints:
    - C–O–C.
    - Between sugars.
    solution: The glycosidic linkage.
    mistakes: {"peptide bond": "c12_glycosidic", "ester bond": "c12_glycosidic", "hydrogen bond": "c12_glycosidic"}
  - prompt: 'Glucose is an:'
    options:
    - aldohexose
    - ketohexose
    - aldopentose
    - ketopentose
    answer: aldohexose
    difficulty: 2
    hints:
    - Aldehyde group.
    - Six carbons.
    solution: An aldohexose.
    mistakes: {"ketohexose": "c12_aldohexose", "aldopentose": "c12_aldohexose", "ketopentose": "c12_aldohexose"}
  - prompt: How many –OH groups does open-chain glucose have (shown by acetylation)?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - It forms a pentaacetate.
    - Penta- means five.
    solution: 'Step 1: pentaacetate. Step 2: 5.'
    mistakes:
      '6': c12c10_sugar
      '4': c12c10_sugar
  - prompt: 'Hydrolysis of sucrose gives glucose and:'
    options:
    - fructose
    - galactose
    - maltose
    answer: fructose
    difficulty: 1
    hints:
    - Cane sugar is made of two different sugars.
    - One is a ketohexose.
    solution: 'Step 1: sucrose = glucose + fructose. Step 2: fructose.'
    mistakes:
      galactose: c12c10_sugar
      maltose: c12c10_sugar
  - prompt: 'Animals store glucose as:'
    options:
    - glycogen
    - cellulose
    - sucrose
    answer: glycogen
    difficulty: 1
    hints:
    - It is in liver and muscles.
    - Sometimes called animal starch.
    solution: 'Step 1: animal storage polysaccharide. Step 2: glycogen.'
    mistakes:
      cellulose: c12c10_sugar
      sucrose: c12c10_sugar
  - prompt: 'Glucose with bromine water gives:'
    options:
    - gluconic acid
    - n-hexane
    - glucose oxime
    answer: gluconic acid
    difficulty: 2
    hints:
    - Bromine water is a mild oxidant.
    - –CHO becomes –COOH.
    solution: 'Step 1: aldehyde oxidised. Step 2: gluconic acid.'
    mistakes:
      n-hexane: c12c10_sugar
      glucose oxime: c12c10_sugar
  - prompt: Why is sucrose a non-reducing sugar?
    options:
    - both sugar units' reducing groups are tied up in the glycosidic bond
    - it has no oxygen
    - it is a polysaccharide
    answer: both sugar units' reducing groups are tied up in the glycosidic bond
    difficulty: 2
    hints:
    - Look at which carbons link the units.
    - C1 of glucose and C2 of fructose.
    solution: 'Step 1: no free aldehyde or ketone group. Step 2: non-reducing.'
    mistakes:
      it has no oxygen: c12c10_sugar
      it is a polysaccharide: c12c10_sugar
  - prompt: Starch is made of which two components?
    options:
    - amylose and amylopectin
    - glucose and fructose
    - cellulose and glycogen
    answer: amylose and amylopectin
    difficulty: 2
    hints:
    - One is straight-chain, one branched.
    - Both are α-glucose polymers.
    solution: 'Step 1: amylose (unbranched) + amylopectin (branched). Step 2: starch.'
    mistakes:
      glucose and fructose: c12c10_sugar
      cellulose and glycogen: c12c10_sugar
  - prompt: How many carbon atoms form the ring in the pyranose form of glucose?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - A pyranose ring has six atoms in all.
    - One of them is oxygen.
    solution: 'Step 1: six-membered ring with one O. Step 2: 5 carbons.'
    mistakes:
      '6': c12c10_sugar
      '4': c12c10_sugar
  - prompt: Why can't humans digest cellulose?
    options:
    - we lack the enzyme to break its β-glycosidic links
    - it has no glucose
    - it is a protein
    answer: we lack the enzyme to break its β-glycosidic links
    difficulty: 3
    hints:
    - Cellulose is made of glucose too.
    - The link type differs from starch.
    solution: 'Step 1: β-links. Step 2: no human enzyme for them.'
    mistakes:
      it has no glucose: c12c10_sugar
      it is a protein: c12c10_sugar
  - prompt: 'Glucose does not react with NaHSO₃ although it has –CHO. This supports:'
    options:
    - a cyclic structure
    - a ketone structure
    - a branched chain
    answer: a cyclic structure
    difficulty: 3
    hints:
    - A free aldehyde would react.
    - The –CHO is mostly locked in a ring.
    solution: 'Step 1: little free –CHO. Step 2: cyclic hemiacetal form.'
    mistakes:
      a ketone structure: c12c10_sugar
      a branched chain: c12c10_sugar
- code: cbse12c.biomol.proteins
  title: Proteins, enzymes, vitamins and nucleic acids
  after:
  - cbse12c.biomol.carbs
  notes: |
    Amino acids: α-amino acids; essential and non-essential; zwitterion. Proteins: polypeptides with peptide bonds; fibrous
    (keratin, myosin) and globular (insulin, albumin); structure: primary, secondary (α-helix, β-pleated sheet), tertiary,
    quaternary; denaturation (boiling egg, curdling milk). Enzymes: biological catalysts, specific. Vitamins: fat-soluble (A,
    D, E, K) and water-soluble (B, C); deficiency diseases (A—night blindness, B₁—beriberi, C—scurvy, D—rickets, K—poor
    clotting). Nucleic acids: nucleotides (base + pentose sugar + phosphate); DNA (deoxyribose, A, G, C, T; double helix) and RNA
    (ribose, A, G, C, U); roles in heredity and protein synthesis. (Hormones removed in rationalised syllabus.)
  explanations:
    text: Proteins are long chains of amino acids joined by peptide bonds; their shape decides their job, and heat can destroy that shape (denaturation). Vitamins are needed in small amounts to avoid deficiency diseases. DNA and RNA carry genetic information.
    visual: 'Picture boiling an egg: the clear runny white turns solid and white because heat unfolds (denatures) its proteins.'
    step_by_step: 'Step 1: Proteins: peptide bonds, four levels of structure. Step 2: Vitamins: match each to its deficiency disease. Step 3: Nucleic acids: DNA has T and deoxyribose; RNA has U and ribose.'
    real_world: Rickets from lack of vitamin D can be prevented by sunlight and fortified foods.
  picture:
    kind: compare
    columns:
    - title: Vitamin
      points:
      - A
      - B₁
      - C
      - D
    - title: Deficiency disease
      points:
      - night blindness
      - beriberi
      - scurvy
      - rickets
    alt: Vitamins and the diseases their deficiency causes.
  activity:
    type: sort
    prompt: Which level of protein structure is it?
    bins:
    - Primary
    - Secondary
    - Tertiary
    - Quaternary
    items:
    - label: The order of amino acids in the chain
      bin: Primary
      clue: Is this about the sequence or the shape?
      why: The sequence itself is the primary structure.
    - label: Insulin's sequence of 51 amino acids
      bin: Primary
      clue: A sequence. Which level?
      why: Primary.
    - label: Held together only by peptide bonds
      bin: Primary
      clue: Which level is just the chain of linked amino acids?
      why: Peptide bonds make the primary structure.
    - label: α-helix
      bin: Secondary
      clue: A coil held by H bonds along the backbone. Which level?
      why: Secondary.
    - label: β-pleated sheet
      bin: Secondary
      clue: Strands side by side, H-bonded. Which level?
      why: Secondary.
    - label: H bonds between N–H and C=O of the backbone
      bin: Secondary
      clue: These make helices and sheets. Which level?
      why: Secondary.
    - label: Folding of the whole chain into a globular shape
      bin: Tertiary
      clue: Is it one chain's overall 3-D shape?
      why: Tertiary.
    - label: Disulfide bridges and side-chain attractions
      bin: Tertiary
      clue: These hold one chain's 3-D folds. Which level?
      why: Tertiary.
    - label: Haemoglobin's four sub-units fitting together
      bin: Quaternary
      clue: More than one chain. Which level?
      why: 'Quaternary: how sub-units pack together.'
  lesson:
    - teach: Proteins are polymers of α-amino acids joined by peptide bonds (–CO–NH–). Essential amino acids must come from food. In water, amino acids exist as zwitterions (both + and − charges). Fibrous proteins (keratin, myosin) are long; globular ones (insulin, albumin) are folded.
      check:
        prompt: 'A peptide bond joins:'
        options:
        - the –COOH of one amino acid to the –NH₂ of the next
        - two sugars
        - two phosphates
        answer: the –COOH of one amino acid to the –NH₂ of the next
        why: Water is lost and –CO–NH– forms.
    - teach: 'Protein structure has four levels: primary (sequence), secondary (α-helix, β-pleated sheet), tertiary (overall folding) and quaternary (several chains together). Heat or acid can destroy the higher levels: denaturation, as when an egg is boiled or milk curdles. Enzymes are protein catalysts, very specific.'
      picture:
        kind: flow
        steps:
        - 'Primary: sequence'
        - 'Secondary: helix or sheet'
        - 'Tertiary: folding'
        - 'Quaternary: chains together'
        alt: The four levels of protein structure.
      check:
        prompt: Denaturation leaves which level intact?
        options:
        - primary
        - secondary
        - tertiary
        answer: primary
        why: Peptide bonds are not broken.
    - teach: 'Vitamins: fat-soluble A, D, E, K; water-soluble B group and C. Deficiencies: A night blindness, B₁ beriberi, C scurvy, D rickets, K poor clotting. Nucleic acids are chains of nucleotides (base + pentose sugar + phosphate): DNA (deoxyribose; A, G, C, T; double helix) carries heredity; RNA (ribose; A, G, C, U) helps make proteins.'
      check:
        prompt: 'Lack of vitamin D causes:'
        options:
        - rickets
        - scurvy
        - beriberi
        answer: rickets
        why: Vitamin D is needed for calcium use in bones.
  items:
  - prompt: 'Lack of vitamin C causes:'
    options:
    - scurvy
    - rickets
    - beriberi
    - night blindness
    answer: scurvy
    difficulty: 1
    hints:
    - Bleeding gums.
    - Citrus fruits.
    solution: Scurvy.
    mistakes: {"rickets": "c12_vitamin_c", "beriberi": "c12_vitamin_c", "night blindness": "c12_vitamin_c"}
  - prompt: Which vitamin is fat-soluble?
    options:
    - vitamin D
    - vitamin C
    - vitamin B₁
    - vitamin B₁₂
    answer: vitamin D
    difficulty: 2
    hints:
    - A, D, E, K.
    - Stored in fat.
    solution: Vitamin D.
    mistakes:
      vitamin C: c12c_vitamin
  - prompt: 'Amino acids in proteins are joined by:'
    options:
    - peptide bonds
    - glycosidic bonds
    - phosphodiester bonds
    - ionic bonds
    answer: peptide bonds
    difficulty: 1
    hints:
    - –CO–NH–.
    - Amide link.
    solution: Peptide bonds.
    mistakes: {"glycosidic bonds": "c12_peptide", "phosphodiester bonds": "c12_peptide", "ionic bonds": "c12_peptide"}
  - prompt: Which base is in RNA but not DNA?
    options:
    - uracil
    - thymine
    - adenine
    - cytosine
    answer: uracil
    difficulty: 1
    hints:
    - U replaces T.
    - Pyrimidine.
    solution: Uracil.
    mistakes: {"thymine": "b11_uracil", "adenine": "b11_uracil", "cytosine": "b11_uracil"}
  - prompt: 'Boiling an egg hardens its white because the proteins are:'
    options:
    - denatured
    - hydrolysed to sugars
    - turned into fats
    - made into DNA
    answer: denatured
    difficulty: 1
    hints:
    - Shape lost.
    - Heat.
    solution: Denatured.
    mistakes: {"hydrolysed to sugars": "b11_denature", "turned into fats": "b11_denature", "made into DNA": "b11_denature"}
  - prompt: How many levels of protein structure are there?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Primary to quaternary.
    - Four.
    solution: '4.'
    mistakes: {"3": "c12_protein_levels", "2": "c12_protein_levels"}
  - prompt: 'Lack of vitamin A causes:'
    options:
    - night blindness
    - scurvy
    - rickets
    answer: night blindness
    difficulty: 1
    hints:
    - Vitamin A is needed for vision.
    - Carrots are a source.
    solution: 'Step 1: vision vitamin. Step 2: night blindness.'
    mistakes:
      scurvy: c12c10_vit
      rickets: c12c10_vit
  - prompt: Which vitamin is water-soluble?
    options:
    - vitamin C
    - vitamin A
    - vitamin K
    answer: vitamin C
    difficulty: 1
    hints:
    - 'Fat-soluble: A, D, E, K.'
    - The other group is B and C.
    solution: 'Step 1: B and C dissolve in water. Step 2: vitamin C.'
    mistakes:
      vitamin A: c12c10_vit
      vitamin K: c12c10_vit
  - prompt: Which sugar is in DNA?
    options:
    - deoxyribose
    - ribose
    - glucose
    answer: deoxyribose
    difficulty: 1
    hints:
    - The name DNA tells you.
    - It lacks one oxygen.
    solution: 'Step 1: deoxyribonucleic acid. Step 2: deoxyribose.'
    mistakes:
      ribose: c12c10_dna
      glucose: c12c10_dna
  - prompt: How many peptide bonds are in a tripeptide?
    answer: '2'
    check: 3 - 1
    difficulty: 2
    hints:
    - Bonds join neighbours.
    - Three units, gaps between them.
    solution: 'Step 1: 3 amino acids. Step 2: 2 bonds.'
    mistakes:
      '3': c12c10_prot
      '1': c12c10_prot
  - prompt: 'Keratin (in hair) is a:'
    options:
    - fibrous protein
    - globular protein
    - carbohydrate
    answer: fibrous protein
    difficulty: 2
    hints:
    - Long thread-like chains.
    - Insoluble in water.
    solution: 'Step 1: thread-like. Step 2: fibrous.'
    mistakes:
      globular protein: c12c10_prot
      carbohydrate: c12c10_sugar
  - prompt: 'In DNA, adenine pairs with:'
    options:
    - thymine
    - uracil
    - guanine
    answer: thymine
    difficulty: 2
    hints:
    - Uracil is only in RNA.
    - A pairs with T, G with C.
    solution: 'Step 1: base pairing rule. Step 2: thymine.'
    mistakes:
      uracil: c12c10_dna
      guanine: c12c10_dna
  - prompt: 'Lack of vitamin B₁ causes:'
    options:
    - beriberi
    - scurvy
    - night blindness
    answer: beriberi
    difficulty: 2
    hints:
    - B₁ is thiamine.
    - Common where polished rice is the main food.
    solution: 'Step 1: thiamine deficiency. Step 2: beriberi.'
    mistakes:
      scurvy: c12c10_vit
      night blindness: c12c10_vit
  - prompt: Why can't vitamin C be stored in the body for long?
    options:
    - it is water-soluble and passes out in urine
    - it is a fat
    - it is made by the body every hour
    answer: it is water-soluble and passes out in urine
    difficulty: 3
    hints:
    - Compare with fat-soluble vitamins.
    - Those are stored in fat tissue.
    solution: 'Step 1: water-soluble. Step 2: excreted, so needed regularly.'
    mistakes:
      it is a fat: c12c10_vit
      it is made by the body every hour: c12c10_vit
  - prompt: A double-stranded DNA sample has 30% adenine. What percentage is guanine?
    answer: '20'
    check: (100 - 2*30)/2
    difficulty: 3
    hints:
    - A = T, so A + T = 60%.
    - G = C share the rest.
    solution: 'Step 1: G + C = 40%. Step 2: G = 20%.'
    mistakes:
      '30': c12c10_dna
      '40': c12c10_dna
