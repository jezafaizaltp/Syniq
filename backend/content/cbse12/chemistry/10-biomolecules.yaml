# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 10. Format: content/README.md.
subject: cbse12-chem
chapter: 10
title: Biomolecules
tips:
  c12c_sugar: Reducing sugars (glucose, fructose, maltose, lactose) reduce Tollens'/Fehling's; sucrose is non-reducing.
  c12c_vitamin: 'Fat-soluble vitamins: A, D, E, K (stored in the body). Water-soluble: B group and C (need regular intake).'
concepts:
- code: cbse12c.biomol.carbs
  title: Carbohydrates
  notes: |
    Carbohydrates: polyhydroxy aldehydes or ketones; monosaccharides (glucose—aldohexose; fructose—ketohexose), oligosaccharides
    (sucrose = glucose + fructose, non-reducing; maltose = 2 glucose; lactose = glucose + galactose), polysaccharides (starch—
    amylose and amylopectin; cellulose—β-glucose; glycogen). Glucose structure: open chain evidence (reactions with HI, HCN,
    Br₂ water, acetylation) and cyclic (α and β anomers, pyranose; mutarotation). Glycosidic linkage. Reducing and non-reducing
    sugars. Importance.
  explanations:
    text: Carbohydrates are sugars and their chains. Glucose and fructose are simple sugars; sucrose (table sugar) is two joined together; starch and cellulose are long chains of glucose. Sugars that can reduce Fehling's or Tollens' reagent are called reducing sugars.
    visual: Draw glucose as a hexagon ring (five carbons and an oxygen) with –OH groups sticking out. Link two through an oxygen bridge (glycosidic bond) to make a disaccharide.
    step_by_step: 'Step 1: Classify by size (mono-, di-, poly-). Step 2: Identify the units. Step 3: Free aldehyde/ketone group → reducing sugar. Step 4: Sucrose''s link blocks both, so it''s non-reducing.'
    real_world: Cotton is almost pure cellulose; humans can't digest it, but cows can, thanks to microbes in their stomachs.
  picture:
    kind: compare
    columns:
    - title: Sugar
      points:
      - glucose
      - sucrose
      - lactose
      - starch
    - title: Made of
      points:
      - one unit
      - glucose + fructose
      - glucose + galactose
      - many glucose units
    alt: Carbohydrates and the sugar units they are made of.
  activity:
    type: sort
    prompt: Reducing or non-reducing sugar? Reducing sugars have a free aldehyde or ketone group that reduces Fehling's and Tollens'.
    bins:
    - Reducing sugar
    - Non-reducing sugar
    items:
    - label: Glucose
      bin: Reducing sugar
      clue: Does it have a free –CHO group?
      why: 'An aldohexose: reducing.'
    - label: Fructose
      bin: Reducing sugar
      clue: It's a ketose. Does it still reduce Tollens' in alkali?
      why: 'Yes: fructose reduces Fehling''s and Tollens''.'
    - label: Maltose
      bin: Reducing sugar
      clue: Glucose joined to glucose via C1–C4. Is one C1 left free?
      why: 'The second glucose''s C1 is free: reducing.'
    - label: Lactose
      bin: Reducing sugar
      clue: Galactose + glucose through C1–C4. Is a free C1 left?
      why: 'Glucose''s C1 is free: reducing.'
    - label: Sucrose
      bin: Non-reducing sugar
      clue: Glucose C1 joins fructose C2. Is any reducing group left free?
      why: 'Both reducing groups are used in the bond: non-reducing.'
    - label: Starch
      bin: Non-reducing sugar
      clue: A huge chain of glucose units. Does one end group make much difference?
      why: 'Practically non-reducing: almost every C1 is bonded.'
    - label: Cellulose
      bin: Non-reducing sugar
      clue: Long β-glucose chains. Reducing groups free?
      why: Non-reducing.
    - label: Glycogen
      bin: Non-reducing sugar
      clue: Highly branched glucose chains. Reducing?
      why: Non-reducing.
  items:
  - prompt: How many carbon atoms does glucose have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Hexose.
    - C₆H₁₂O₆.
    solution: '6.'
  - prompt: Which sugar is non-reducing?
    options:
    - sucrose
    - glucose
    - maltose
    - lactose
    answer: sucrose
    difficulty: 2
    hints:
    - Both reducing ends tied up.
    - Table sugar.
    solution: Sucrose.
    mistakes:
      maltose: c12c_sugar
  - prompt: 'Milk sugar is:'
    options:
    - lactose
    - sucrose
    - maltose
    - fructose
    answer: lactose
    difficulty: 1
    hints:
    - Lact = milk.
    - Glucose + galactose.
    solution: Lactose.
  - prompt: 'Cellulose is a polymer of:'
    options:
    - β-glucose
    - α-glucose
    - fructose
    - amino acids
    answer: β-glucose
    difficulty: 2
    hints:
    - Straight chains.
    - Starch is α.
    solution: β-glucose.
  - prompt: 'The bond joining sugar units is the:'
    options:
    - glycosidic linkage
    - peptide bond
    - ester bond
    - hydrogen bond
    answer: glycosidic linkage
    difficulty: 1
    hints:
    - C–O–C.
    - Between sugars.
    solution: The glycosidic linkage.
  - prompt: 'Glucose is an:'
    options:
    - aldohexose
    - ketohexose
    - aldopentose
    - ketopentose
    answer: aldohexose
    difficulty: 2
    hints:
    - Aldehyde group.
    - Six carbons.
    solution: An aldohexose.
- code: cbse12c.biomol.proteins
  title: Proteins, enzymes, vitamins and nucleic acids
  after:
  - cbse12c.biomol.carbs
  notes: |
    Amino acids: α-amino acids; essential and non-essential; zwitterion. Proteins: polypeptides with peptide bonds; fibrous
    (keratin, myosin) and globular (insulin, albumin); structure: primary, secondary (α-helix, β-pleated sheet), tertiary,
    quaternary; denaturation (boiling egg, curdling milk). Enzymes: biological catalysts, specific. Vitamins: fat-soluble (A,
    D, E, K) and water-soluble (B, C); deficiency diseases (A—night blindness, B₁—beriberi, C—scurvy, D—rickets, K—poor
    clotting). Nucleic acids: nucleotides (base + pentose sugar + phosphate); DNA (deoxyribose, A, G, C, T; double helix) and RNA
    (ribose, A, G, C, U); roles in heredity and protein synthesis. (Hormones removed in rationalised syllabus.)
  explanations:
    text: Proteins are long chains of amino acids joined by peptide bonds; their shape decides their job, and heat can destroy that shape (denaturation). Vitamins are needed in small amounts to avoid deficiency diseases. DNA and RNA carry genetic information.
    visual: 'Picture boiling an egg: the clear runny white turns solid and white because heat unfolds (denatures) its proteins.'
    step_by_step: 'Step 1: Proteins: peptide bonds, four levels of structure. Step 2: Vitamins: match each to its deficiency disease. Step 3: Nucleic acids: DNA has T and deoxyribose; RNA has U and ribose.'
    real_world: Rickets from lack of vitamin D can be prevented by sunlight and fortified foods.
  picture:
    kind: compare
    columns:
    - title: Vitamin
      points:
      - A
      - B₁
      - C
      - D
    - title: Deficiency disease
      points:
      - night blindness
      - beriberi
      - scurvy
      - rickets
    alt: Vitamins and the diseases their deficiency causes.
  activity:
    type: sort
    prompt: Which level of protein structure is it?
    bins:
    - Primary
    - Secondary
    - Tertiary
    - Quaternary
    items:
    - label: The order of amino acids in the chain
      bin: Primary
      clue: Is this about the sequence or the shape?
      why: The sequence itself is the primary structure.
    - label: Insulin's sequence of 51 amino acids
      bin: Primary
      clue: A sequence. Which level?
      why: Primary.
    - label: Held together only by peptide bonds
      bin: Primary
      clue: Which level is just the chain of linked amino acids?
      why: Peptide bonds make the primary structure.
    - label: α-helix
      bin: Secondary
      clue: A coil held by H bonds along the backbone. Which level?
      why: Secondary.
    - label: β-pleated sheet
      bin: Secondary
      clue: Strands side by side, H-bonded. Which level?
      why: Secondary.
    - label: H bonds between N–H and C=O of the backbone
      bin: Secondary
      clue: These make helices and sheets. Which level?
      why: Secondary.
    - label: Folding of the whole chain into a globular shape
      bin: Tertiary
      clue: Is it one chain's overall 3-D shape?
      why: Tertiary.
    - label: Disulfide bridges and side-chain attractions
      bin: Tertiary
      clue: These hold one chain's 3-D folds. Which level?
      why: Tertiary.
    - label: Haemoglobin's four sub-units fitting together
      bin: Quaternary
      clue: More than one chain. Which level?
      why: 'Quaternary: how sub-units pack together.'
  items:
  - prompt: 'Lack of vitamin C causes:'
    options:
    - scurvy
    - rickets
    - beriberi
    - night blindness
    answer: scurvy
    difficulty: 1
    hints:
    - Bleeding gums.
    - Citrus fruits.
    solution: Scurvy.
  - prompt: Which vitamin is fat-soluble?
    options:
    - vitamin D
    - vitamin C
    - vitamin B₁
    - vitamin B₁₂
    answer: vitamin D
    difficulty: 2
    hints:
    - A, D, E, K.
    - Stored in fat.
    solution: Vitamin D.
    mistakes:
      vitamin C: c12c_vitamin
  - prompt: 'Amino acids in proteins are joined by:'
    options:
    - peptide bonds
    - glycosidic bonds
    - phosphodiester bonds
    - ionic bonds
    answer: peptide bonds
    difficulty: 1
    hints:
    - –CO–NH–.
    - Amide link.
    solution: Peptide bonds.
  - prompt: Which base is in RNA but not DNA?
    options:
    - uracil
    - thymine
    - adenine
    - cytosine
    answer: uracil
    difficulty: 1
    hints:
    - U replaces T.
    - Pyrimidine.
    solution: Uracil.
  - prompt: 'Boiling an egg hardens its white because the proteins are:'
    options:
    - denatured
    - hydrolysed to sugars
    - turned into fats
    - made into DNA
    answer: denatured
    difficulty: 1
    hints:
    - Shape lost.
    - Heat.
    solution: Denatured.
  - prompt: How many levels of protein structure are there?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Primary to quaternary.
    - Four.
    solution: '4.'
