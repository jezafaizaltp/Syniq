# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse12-chem
chapter: 4
title: The d- and f-Block Elements
tips:
  c12c_unpaired: Magnetic moment μ = √(n(n + 2)) BM, where n is the number of unpaired electrons.
  c12c_lanth: 'Lanthanoid contraction: sizes shrink steadily from La to Lu because 4f electrons shield the nucleus poorly.'
  c12_actinoids: "Actinoids are all heavy elements beyond actinium with unstable nuclei."
  c12_colourless: "Colour needs a partly filled d subshell. Write the d-electron count of each ion and look for the one that is full."
  c12_kmno4: "Potassium permanganate solution is a deep violet-pink colour."
  c12_lanthanoids: "Ce to Lu fills the 4f subshell one electron at a time. How many electrons can an f subshell hold?"
  c12_ln_contraction: "4f electrons screen nuclear charge poorly, so the outer electrons are pulled in harder."
  c12_ln_ox: "Lanthanoids most commonly form M³⁺ ions."
  c12_mischmetall: "'Misch' means mixed: a mix of rare earth metals plus a common metal."
  c12_mn_max: "Mn has 3d⁵4s²: the most it can use is all of these."
  c12_tm_catalyst: "Transition metals can switch between oxidation states and bind reactants."
  c12_unpaired_d5: "d⁵ fills each of the five d orbitals with one electron first (Hund's rule)."
concepts:
- code: cbse12c.df.transition
  title: Properties of transition elements
  notes: |
    d-block: groups 3–12; general configuration (n − 1)d¹⁻¹⁰ns¹⁻². Zn, Cd, Hg not typical transition elements (full d¹⁰).
    Properties: metallic, high melting points, variable oxidation states (Mn up to +7), coloured ions (d–d transitions;
    colourless if d⁰ or d¹⁰), paramagnetism (μ = √(n(n + 2)) BM), catalytic activity (Fe in Haber, V₂O₅ in contact process,
    Ni in hydrogenation), complex formation, interstitial compounds, alloys. Trends in atomic radii, ionisation enthalpy,
    E° values. Important compounds: K₂Cr₂O₇ (orange, oxidising agent), KMnO₄ (purple).
  explanations:
    text: Transition metals fill d orbitals. They show many oxidation states, form coloured compounds, are often magnetic, and make excellent catalysts. Iron, copper and chromium are familiar examples.
    visual: 'Picture a row of test tubes with transition metal solutions: blue copper sulfate, green nickel, purple permanganate, orange dichromate. The colours come from d electrons jumping between levels.'
    step_by_step: 'Step 1: Write the d configuration of the ion. Step 2: Count unpaired electrons n. Step 3: μ = √(n(n + 2)) BM. Step 4: d⁰ or d¹⁰ ions are colourless.'
    real_world: Iron is the catalyst in the Haber process that makes ammonia for fertilisers.
  picture:
    kind: compare
    columns:
    - title: Ion
      points:
      - Ti⁴⁺ (d⁰)
      - Cu²⁺ (d⁹)
      - Zn²⁺ (d¹⁰)
    - title: Colour
      points:
      - colourless
      - blue
      - colourless
    alt: 'Colour of transition metal ions depends on their d electrons: d⁰ and d¹⁰ ions are colourless.'
  activity:
    type: sort
    prompt: Coloured or colourless in water? Colour needs d electrons that can jump between split d levels (1 to 9 d electrons).
    bins:
    - Coloured
    - Colourless
    items:
    - label: Cu²⁺ (3d⁹)
      bin: Coloured
      clue: How many d electrons? Is there a gap to jump into?
      why: 'd⁹: one gap, so it absorbs light. Blue.'
    - label: Fe³⁺ (3d⁵)
      bin: Coloured
      clue: Is the d subshell empty, full or in between?
      why: 'Partly filled: coloured (yellow-brown).'
    - label: Ni²⁺ (3d⁸)
      bin: Coloured
      clue: Partly filled d?
      why: Green in solution.
    - label: V³⁺ (3d²)
      bin: Coloured
      clue: Any d electrons to promote?
      why: 'Two d electrons: green.'
    - label: Cr³⁺ (3d³)
      bin: Coloured
      clue: Partly filled d?
      why: Violet/green complexes.
    - label: Mn²⁺ (3d⁵)
      bin: Coloured
      clue: Is d⁵ empty or full?
      why: 'Partly filled: a very pale pink.'
    - label: Sc³⁺ (3d⁰)
      bin: Colourless
      clue: How many d electrons are there to jump?
      why: 'No d electrons: no d–d jumps, no colour.'
    - label: Ti⁴⁺ (3d⁰)
      bin: Colourless
      clue: Any d electrons?
      why: 'd⁰: colourless.'
    - label: Zn²⁺ (3d¹⁰)
      bin: Colourless
      clue: Is there any empty d level to jump into?
      why: 'd¹⁰ is full: no d–d jumps.'
    - label: Cu⁺ (3d¹⁰)
      bin: Colourless
      clue: Compare with Cu²⁺. Is the d subshell full now?
      why: 'Full d¹⁰: colourless.'
  items:
  - prompt: How many unpaired electrons does Mn²⁺ (3d⁵) have?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Hund's rule.
    - All five single.
    solution: '5.'
    mistakes: {"0": "c12_unpaired_d5", "3": "c12_unpaired_d5"}
  - prompt: Find the magnetic moment (BM) of an ion with 2 unpaired electrons, as √ of a number. Give that number.
    answer: '8'
    check: 2*(2+2)
    difficulty: 2
    hints:
    - √(n(n + 2)).
    - √(2 × 4).
    solution: √8 ≈ 2.83 BM.
    mistakes:
      '4': c12c_unpaired
  - prompt: What is the highest oxidation state of manganese?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - In KMnO₄.
    - '+7.'
    solution: '+7.'
    mistakes: {"2": "c12_mn_max", "4": "c12_mn_max", "6": "c12_mn_max"}
  - prompt: Which ion is colourless?
    options:
    - Zn²⁺
    - Cu²⁺
    - Fe³⁺
    - Mn²⁺
    answer: Zn²⁺
    difficulty: 2
    hints:
    - d¹⁰.
    - No d–d transition.
    solution: Zn²⁺.
    mistakes: {"Cu²⁺": "c12_colourless", "Fe³⁺": "c12_colourless", "Mn²⁺": "c12_colourless"}
  - prompt: 'Transition metals make good catalysts mainly because they:'
    options:
    - have variable oxidation states and can form complexes
    - are heavy
    - are shiny
    - melt easily
    answer: have variable oxidation states and can form complexes
    difficulty: 2
    hints:
    - Change oxidation state easily.
    - Surface sites.
    solution: They show variable oxidation states and form intermediates.
    mistakes: {"are heavy": "c12_tm_catalyst", "are shiny": "c12_tm_catalyst", "melt easily": "c12_tm_catalyst"}
  - prompt: 'The colour of KMnO₄ is:'
    options:
    - purple
    - orange
    - green
    - blue
    answer: purple
    difficulty: 1
    hints:
    - Permanganate.
    - Deep.
    solution: Purple.
    mistakes: {"orange": "c12_kmno4", "green": "c12_kmno4", "blue": "c12_kmno4"}
- code: cbse12c.df.inner
  title: Lanthanoids and actinoids
  after:
  - cbse12c.df.transition
  notes: |
    f-block: lanthanoids (Ce–Lu, 4f) and actinoids (Th–Lr, 5f). Lanthanoids: common oxidation state +3 (some +2, +4); lanthanoid
    contraction (steady decrease in size; consequences: Zr and Hf similar size, difficulty separating lanthanoids). Actinoids:
    radioactive, wider range of oxidation states, actinoid contraction greater. Uses: mischmetall (flints), uranium fuel.
  explanations:
    text: The f-block elements fill f orbitals. Lanthanoids usually show a +3 oxidation state and get steadily smaller across the row (lanthanoid contraction). Actinoids are all radioactive and show more varied oxidation states.
    visual: 'Draw the two rows usually printed under the periodic table: the lanthanoids on top, the actinoids below, each 14 elements long.'
    step_by_step: 'Step 1: Lanthanoids → 4f; actinoids → 5f. Step 2: Lanthanoids mostly +3. Step 3: Lanthanoid contraction explains Zr–Hf similarity.'
    real_world: Rare-earth (lanthanoid) magnets are used in phone speakers, earphones and electric car motors.
  picture:
    kind: compare
    columns:
    - title: Series
      points:
      - lanthanoids
      - actinoids
    - title: Orbitals filling
      points:
      - 4f
      - 5f
    - title: Key feature
      points:
      - mostly +3, lanthanoid contraction
      - radioactive, many oxidation states
    alt: Lanthanoids and actinoids compared.
  activity:
    type: sort
    prompt: Lanthanoids, actinoids, or true of both?
    bins:
    - Lanthanoids
    - Actinoids
    - Both
    items:
    - label: Fill the 4f orbitals
      bin: Lanthanoids
      clue: Which series follows lanthanum?
      why: Ce to Lu fill 4f.
    - label: Make Zr and Hf almost the same size
      bin: Lanthanoids
      clue: Which contraction comes before hafnium?
      why: The lanthanoid contraction shrinks Hf to Zr's size.
    - label: Misch metal, used in lighter flints
      bin: Lanthanoids
      clue: It's an alloy of which series?
      why: About 95% lanthanoid metals.
    - label: Fill the 5f orbitals
      bin: Actinoids
      clue: Which series follows actinium?
      why: Th to Lr fill 5f.
    - label: All are radioactive
      bin: Actinoids
      clue: Which series includes uranium and plutonium?
      why: Every actinoid is radioactive.
    - label: Show many oxidation states, up to +7
      bin: Actinoids
      clue: Whose 5f, 6d and 7s energies are close?
      why: Actinoids show a wider range of oxidation states.
    - label: Most are made artificially
      bin: Actinoids
      clue: Which series has elements beyond uranium?
      why: The transuranic elements are made in reactors.
    - label: Most common oxidation state +3
      bin: Both
      clue: Is +3 found in only one of the two series?
      why: Both series commonly show +3.
    - label: Size shrinks steadily across the series
      bin: Both
      clue: Is there a contraction in each series?
      why: Both show a contraction (larger for actinoids).
  items:
  - prompt: How many elements are in the lanthanoid series (Ce to Lu)?
    answer: '14'
    check: '14'
    difficulty: 1
    hints:
    - f holds 14 electrons.
    - Fourteen.
    solution: '14.'
    mistakes: {"15": "c12_lanthanoids", "10": "c12_lanthanoids"}
  - prompt: What is the most common oxidation state of lanthanoids?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Ln³⁺.
    - Three.
    solution: '+3.'
    mistakes: {"2": "c12_ln_ox", "4": "c12_ln_ox"}
  - prompt: 'Zirconium and hafnium have almost the same size because of:'
    options:
    - lanthanoid contraction
    - actinoid contraction
    - hydrogen bonding
    - alloy formation
    answer: lanthanoid contraction
    difficulty: 2
    hints:
    - Hf comes after the lanthanoids.
    - Shrinking cancels new shell.
    solution: Lanthanoid contraction.
    mistakes:
      actinoid contraction: c12c_lanth
  - prompt: 'All actinoids are:'
    options:
    - radioactive
    - gases
    - colourless
    - non-metals
    answer: radioactive
    difficulty: 1
    hints:
    - Uranium, plutonium.
    - Unstable nuclei.
    solution: Radioactive.
    mistakes: {"gases": "c12_actinoids", "colourless": "c12_actinoids", "non-metals": "c12_actinoids"}
  - prompt: 'Lanthanoid contraction is caused by:'
    options:
    - poor shielding by 4f electrons
    - extra protons only
    - loss of electrons
    - hydrogen bonds
    answer: poor shielding by 4f electrons
    difficulty: 2
    hints:
    - f orbitals diffuse.
    - Nucleus pulls harder.
    solution: Poor shielding by 4f electrons.
    mistakes: {"extra protons only": "c12_ln_contraction", "loss of electrons": "c12_ln_contraction", "hydrogen bonds": "c12_ln_contraction"}
  - prompt: 'Mischmetall, used in lighter flints, is an alloy of:'
    options:
    - lanthanoid metals with iron
    - copper and zinc
    - lead and tin
    - gold and silver
    answer: lanthanoid metals with iron
    difficulty: 2
    hints:
    - Rare earths.
    - Sparks.
    solution: Lanthanoid metals with a little iron.
    mistakes: {"copper and zinc": "c12_mischmetall", "lead and tin": "c12_mischmetall", "gold and silver": "c12_mischmetall"}
