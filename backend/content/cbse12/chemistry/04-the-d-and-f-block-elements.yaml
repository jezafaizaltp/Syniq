# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 4. Format: content/README.md.
subject: cbse12-chem
chapter: 4
title: The d- and f-Block Elements
tips:
  c12c_unpaired: Magnetic moment μ = √(n(n + 2)) BM, where n is the number of unpaired electrons.
  c12c_lanth: "Between Zr (period 5) and Hf (period 6), the 14 lanthanoids fill 4f orbitals, which shield poorly. The size shrinks steadily across them, cancelling the extra shell."
  c12_actinoids: "Actinoids are all heavy elements beyond actinium with unstable nuclei."
  c12_colourless: "Colour needs a partly filled d subshell. Write the d-electron count of each ion and look for the one that is full."
  c12_kmno4: "Potassium permanganate solution is a deep violet-pink colour."
  c12_lanthanoids: "Ce to Lu fills the 4f subshell one electron at a time. How many electrons can an f subshell hold?"
  c12_ln_contraction: "4f electrons screen nuclear charge poorly, so the outer electrons are pulled in harder."
  c12_ln_ox: "Lanthanoids most commonly form M³⁺ ions."
  c12_mischmetall: "'Misch' means mixed: a mix of rare earth metals plus a common metal."
  c12_mn_max: "Mn has 3d⁵4s²: the most it can use is all of these."
  c12_tm_catalyst: "Transition metals can switch between oxidation states and bind reactants."
  c12_unpaired_d5: "d⁵ fills each of the five d orbitals with one electron first (Hund's rule)."
  c12c4_config: Write the ion's d-electron count first (remove 4s electrons before 3d), then fill the five d orbitals one at a time before pairing.
  c12c4_prop: 'Link each property to its cause: partly filled d orbitals give colour, magnetism, variable oxidation states and catalysis.'
  c12c4_f: 'Lanthanoids: 4f, mostly +3, steady shrinking (lanthanoid contraction). Actinoids: 5f, all radioactive, more oxidation states.'
  c12c4_colour: Colour needs an electron that can jump between d levels. Count the d electrons in each ion.
  c12c4_sep: Neighbours in this series have nearly the same size and the same usual charge. What would that do to separation?
concepts:
- code: cbse12c.df.transition
  title: Properties of transition elements
  notes: |
    d-block: groups 3–12; general configuration (n − 1)d¹⁻¹⁰ns¹⁻². Zn, Cd, Hg not typical transition elements (full d¹⁰).
    Properties: metallic, high melting points, variable oxidation states (Mn up to +7), coloured ions (d–d transitions;
    colourless if d⁰ or d¹⁰), paramagnetism (μ = √(n(n + 2)) BM), catalytic activity (Fe in Haber, V₂O₅ in contact process,
    Ni in hydrogenation), complex formation, interstitial compounds, alloys. Trends in atomic radii, ionisation enthalpy,
    E° values. Important compounds: K₂Cr₂O₇ (orange, oxidising agent), KMnO₄ (purple).
  explanations:
    text: Transition metals fill d orbitals. They show many oxidation states, form coloured compounds, are often magnetic, and make excellent catalysts. Iron, copper and chromium are familiar examples.
    visual: 'Picture a row of test tubes with transition metal solutions: blue copper sulfate, green nickel, purple permanganate, orange dichromate. The colours come from d electrons jumping between levels.'
    step_by_step: 'Step 1: Write the d configuration of the ion. Step 2: Count unpaired electrons n. Step 3: μ = √(n(n + 2)) BM. Step 4: d⁰ or d¹⁰ ions are colourless.'
    real_world: Iron is the catalyst in the Haber process that makes ammonia for fertilisers.
  picture:
    kind: compare
    columns:
    - title: Ion
      points:
      - Ti⁴⁺ (d⁰)
      - Cu²⁺ (d⁹)
      - Zn²⁺ (d¹⁰)
    - title: Colour
      points:
      - colourless
      - blue
      - colourless
    alt: 'Colour of transition metal ions depends on their d electrons: d⁰ and d¹⁰ ions are colourless.'
  activity:
    type: sort
    prompt: Coloured or colourless in water? Colour needs d electrons that can jump between split d levels (1 to 9 d electrons).
    bins:
    - Coloured
    - Colourless
    items:
    - label: Cu²⁺ (3d⁹)
      bin: Coloured
      clue: How many d electrons? Is there a gap to jump into?
      why: 'd⁹: one gap, so it absorbs light. Blue.'
    - label: Fe³⁺ (3d⁵)
      bin: Coloured
      clue: Is the d subshell empty, full or in between?
      why: 'Partly filled: coloured (yellow-brown).'
    - label: Ni²⁺ (3d⁸)
      bin: Coloured
      clue: Partly filled d?
      why: Green in solution.
    - label: V³⁺ (3d²)
      bin: Coloured
      clue: Any d electrons to promote?
      why: 'Two d electrons: green.'
    - label: Cr³⁺ (3d³)
      bin: Coloured
      clue: Partly filled d?
      why: Violet/green complexes.
    - label: Mn²⁺ (3d⁵)
      bin: Coloured
      clue: Is d⁵ empty or full?
      why: 'Partly filled: a very pale pink.'
    - label: Sc³⁺ (3d⁰)
      bin: Colourless
      clue: How many d electrons are there to jump?
      why: 'No d electrons: no d–d jumps, no colour.'
    - label: Ti⁴⁺ (3d⁰)
      bin: Colourless
      clue: Any d electrons?
      why: 'd⁰: colourless.'
    - label: Zn²⁺ (3d¹⁰)
      bin: Colourless
      clue: Is there any empty d level to jump into?
      why: 'd¹⁰ is full: no d–d jumps.'
    - label: Cu⁺ (3d¹⁰)
      bin: Colourless
      clue: Compare with Cu²⁺. Is the d subshell full now?
      why: 'Full d¹⁰: colourless.'
  lesson:
    - teach: Transition elements are in groups 3–12 with configuration (n − 1)d¹⁻¹⁰ ns¹⁻². They have partly filled d orbitals in the atom or a common ion. Zn, Cd and Hg have full d¹⁰ and are not typical transition elements.
      check:
        prompt: Why is zinc not treated as a typical transition element?
        options:
        - its d orbitals are full in the atom and its ions
        - it is not a metal
        - it has no 4s electrons
        answer: its d orbitals are full in the atom and its ions
        why: Zn and Zn²⁺ are both 3d¹⁰.
      ways:
      - style: visual
        teach: Which group-3-to-12 metals count as transition elements, by their d electrons.
        picture:
          kind: compare
          columns:
          - title: Typical transition
            points:
            - Partly filled d in atom or ion
            - e.g. Fe (3d⁶), Cu²⁺ (3d⁹)
          - title: Not typical
            points:
            - Full d¹⁰ in atom and ions
            - Zn, Cd, Hg
          alt: Typical transition elements have partly filled d orbitals in the atom or a common ion, for example iron 3d6 and copper two plus 3d9. Zinc, cadmium and mercury have full d10 in the atom and ions, so they are not typical.
      - style: step_by_step
        teach: 'Write Fe³⁺''s configuration. Step 1: Fe is [Ar] 3d⁶ 4s². Step 2: Remove 4s electrons first: 3d⁶. Step 3: Remove one more from 3d: 3d⁵. Step 4: Fe³⁺ is [Ar] 3d⁵, a stable half-filled set.'
    - teach: 'Partly filled d orbitals explain their properties. Variable oxidation states (Mn shows +2 to +7). Coloured ions from d–d transitions (d⁰ and d¹⁰ ions are colourless). Paramagnetism from unpaired electrons: μ = √(n(n + 2)) BM.'
      picture:
        kind: compare
        columns:
        - title: Ion
          points:
          - Sc³⁺ (3d⁰)
          - Ti³⁺ (3d¹)
          - Mn²⁺ (3d⁵)
          - Zn²⁺ (3d¹⁰)
        - title: Unpaired e⁻
          points:
          - '0'
          - '1'
          - '5'
          - '0'
        - title: Coloured?
          points:
          - 'no'
          - 'yes'
          - pale
          - 'no'
        alt: Unpaired electrons and colour for four first-row ions.
      check:
        prompt: Fe³⁺ is 3d⁵. Unpaired electrons?
        options:
        - '5'
        - '3'
        - '1'
        answer: '5'
        why: One in each of the five d orbitals.
      ways:
      - style: real_world
        teach: 'Gemstones get colour from transition metal ions: ruby is red because of a little Cr³⁺, and blue copper sulphate crystals owe their colour to Cu²⁺. The d electrons absorb part of visible light and we see the rest.'
      - style: step_by_step
        teach: 'Magnetic moment of Ti³⁺ (3d¹). Step 1: One d electron, so n = 1. Step 2: μ = √(n(n + 2)). Step 3: μ = √(1 × 3) = √3. Step 4: About 1.73 BM, weakly paramagnetic.'
    - teach: 'They are good catalysts (Fe in the Haber process, V₂O₅ in the contact process, Ni in hydrogenation), form complexes, interstitial compounds and alloys, and have high melting points. Important compounds: K₂Cr₂O₇ (orange) and KMnO₄ (purple), both strong oxidising agents.'
      check:
        prompt: Which catalyst is used in the Haber process for ammonia?
        options:
        - iron
        - nickel
        - platinum only
        answer: iron
        why: Finely divided iron catalyses N₂ + 3H₂ → 2NH₃.
      ways:
      - style: visual
        teach: Transition metals as industrial catalysts.
        picture:
          kind: compare
          columns:
          - title: Haber process
            points:
            - Iron
            - N₂ + H₂ → NH₃
          - title: Contact process
            points:
            - V₂O₅
            - SO₂ → SO₃
          - title: Hydrogenation
            points:
            - Nickel
            - Oils → fats
          alt: Iron catalyses the Haber process making ammonia from nitrogen and hydrogen. Vanadium pentoxide catalyses the contact process turning sulphur dioxide into sulphur trioxide. Nickel catalyses hydrogenation of oils into fats.
      - style: real_world
        teach: 'Steel and brass are alloys: transition metal atoms are similar in size, so they swap into each other''s lattice easily. That is why so many useful alloys are made from them.'
  items:
  - prompt: How many unpaired electrons does Mn²⁺ (3d⁵) have?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Hund's rule.
    - All five single.
    solution: '5.'
    mistakes: {"0": "c12_unpaired_d5", "3": "c12_unpaired_d5"}
  - prompt: Find the magnetic moment (BM) of an ion with 2 unpaired electrons, as √ of a number. Give that number.
    answer: '8'
    check: 2*(2+2)
    difficulty: 2
    hints:
    - √(n(n + 2)).
    - √(2 × 4).
    solution: √8 ≈ 2.83 BM.
    mistakes:
      '4': c12c_unpaired
  - prompt: What is the highest oxidation state of manganese?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - In KMnO₄.
    - '+7.'
    solution: '+7.'
    mistakes: {"2": "c12_mn_max", "4": "c12_mn_max", "6": "c12_mn_max"}
  - prompt: Which ion is colourless?
    options:
    - Zn²⁺
    - Cu²⁺
    - Fe³⁺
    - Mn²⁺
    answer: Zn²⁺
    difficulty: 2
    hints:
    - d¹⁰.
    - No d–d transition.
    solution: Zn²⁺.
    mistakes: {"Cu²⁺": "c12_colourless", "Fe³⁺": "c12_colourless", "Mn²⁺": "c12_colourless"}
  - prompt: 'Transition metals make good catalysts mainly because they:'
    options:
    - have variable oxidation states and can form complexes
    - are heavy
    - are shiny
    - melt easily
    answer: have variable oxidation states and can form complexes
    difficulty: 2
    hints:
    - Change oxidation state easily.
    - Surface sites.
    solution: They show variable oxidation states and form intermediates.
    mistakes: {"are heavy": "c12_tm_catalyst", "are shiny": "c12_tm_catalyst", "melt easily": "c12_tm_catalyst"}
  - prompt: 'The colour of KMnO₄ is:'
    options:
    - purple
    - orange
    - green
    - blue
    answer: purple
    difficulty: 1
    hints:
    - Permanganate.
    - Deep.
    solution: Purple.
    mistakes: {"orange": "c12_kmno4", "green": "c12_kmno4", "blue": "c12_kmno4"}
  - prompt: How many unpaired electrons does Cr³⁺ (3d³) have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Three electrons in five orbitals.
    - Fill singly first.
    solution: 'Step 1: no pairing needed. Step 2: 3.'
    mistakes:
      '1': c12c4_config
      '0': c12c4_config
  - prompt: Fe²⁺ is 3d⁶. How many unpaired electrons (high spin)?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Five go in singly, the sixth pairs.
    - 6 − 2 × 1 = ?
    solution: 'Step 1: one pair, four single. Step 2: 4.'
    mistakes:
      '6': c12c4_config
      '2': c12c4_config
  - prompt: Magnetic moment of an ion with 3 unpaired electrons, as √ of a number. Give that number.
    answer: '15'
    check: 3*(3 + 2)
    difficulty: 1
    hints:
    - μ = √(n(n + 2)).
    - 3 × 5.
    solution: 'Step 1: n(n + 2) = 15. Step 2: μ = √15 BM.'
    mistakes:
      '9': c12c4_config
      '6': c12c4_config
  - prompt: Oxidation state of Cr in K₂Cr₂O₇?
    answer: '6'
    check: (14 - 2)/2
    difficulty: 2
    hints:
    - K is +1, O is −2.
    - 2 + 2x − 14 = 0.
    solution: 'Step 1: 2x = 12. Step 2: +6.'
    mistakes:
      '7': c12c4_prop
      '3': c12c4_prop
  - prompt: Oxidation state of Mn in KMnO₄?
    answer: '7'
    check: 8 - 1
    difficulty: 2
    hints:
    - K is +1, O is −2.
    - 1 + x − 8 = 0.
    solution: 'Step 1: x = 7. Step 2: +7.'
    mistakes:
      '6': c12c4_prop
      '4': c12c4_prop
  - prompt: Which of these ions gives a colourless solution?
    options:
    - Sc³⁺
    - Cu²⁺
    - Ni²⁺
    answer: Sc³⁺
    difficulty: 2
    hints:
    - Colour needs d–d transitions.
    - Which has no d electrons?
    solution: 'Step 1: Sc³⁺ is 3d⁰. Step 2: colourless.'
    mistakes:
      Cu²⁺: c12c4_prop
      Ni²⁺: c12c4_prop
  - prompt: 'Ni is used as a catalyst in:'
    options:
    - hydrogenation of oils
    - making sulphuric acid
    - making ammonia
    answer: hydrogenation of oils
    difficulty: 2
    hints:
    - It helps add hydrogen.
    - Vegetable ghee is made this way.
    solution: 'Step 1: Ni adsorbs H₂. Step 2: hydrogenation.'
    mistakes:
      making sulphuric acid: c12c4_prop
      making ammonia: c12c4_prop
  - prompt: Which of Mn²⁺ (3d⁵) and Cu⁺ (3d¹⁰) is paramagnetic?
    options:
    - Mn²⁺
    - Cu⁺
    - both
    answer: Mn²⁺
    difficulty: 3
    hints:
    - Paramagnetism needs unpaired electrons.
    - d¹⁰ has none.
    solution: 'Step 1: Mn²⁺ has 5 unpaired; Cu⁺ none. Step 2: Mn²⁺.'
    mistakes:
      Cu⁺: c12c4_config
      both: c12c4_config
  - prompt: Why do transition metals form interstitial compounds?
    options:
    - small atoms like H, C, N fit in the gaps of their lattices
    - they are very soft
    - they have no d electrons
    answer: small atoms like H, C, N fit in the gaps of their lattices
    difficulty: 3
    hints:
    - Think of the metal crystal as packed spheres.
    - Tiny atoms can sit between them.
    solution: 'Step 1: lattice has voids. Step 2: small atoms are trapped there.'
    mistakes:
      they are very soft: c12c4_prop
      they have no d electrons: c12c4_prop
  - prompt: 'Assertion (A): Zn²⁺ salts are white.

      Reason (R): Zn²⁺ has a completely filled 3d¹⁰ configuration, so no d–d transition is possible.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Without a vacancy in the d set, no electron can jump by absorbing visible light, so the salts are colourless or white. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A teacher shows three solutions: CuSO₄ (blue), ZnSO₄ and ScCl₃. Students expect all three to be coloured. Which two are actually colourless?'
    options:
    - ZnSO₄ and ScCl₃
    - CuSO₄ and ZnSO₄
    - CuSO₄ and ScCl₃
    answer: ZnSO₄ and ScCl₃
    hints:
    - Write the d-electron count of Cu²⁺, Zn²⁺ and Sc³⁺.
    - d⁰ and d¹⁰ cannot do d–d jumps.
    solution: Zn²⁺ is d¹⁰ and Sc³⁺ is d⁰, so neither can absorb visible light by a d–d transition. Cu²⁺ is d⁹, which is coloured.
    mistakes:
      CuSO₄ and ZnSO₄: c12c4_colour
      CuSO₄ and ScCl₃: c12c4_colour
    exam: case
    difficulty: 2
  - prompt: A lab needs a strong oxidising agent that also acts as its own indicator in titrations. Which should it choose?
    options:
    - KMnO₄
    - ZnSO₄
    - NaCl
    answer: KMnO₄
    hints:
    - Which compound is deeply coloured and changes colour when reduced?
    - Mn is in its highest oxidation state there.
    solution: Purple KMnO₄ (Mn +7) is a strong oxidiser; it turns colourless when reduced, so the first lasting pink marks the end point.
    mistakes:
      ZnSO₄: c12c4_prop
      NaCl: c12c4_prop
    exam: competency
    difficulty: 2
- code: cbse12c.df.inner
  title: Lanthanoids and actinoids
  after:
  - cbse12c.df.transition
  notes: |
    f-block: lanthanoids (Ce–Lu, 4f) and actinoids (Th–Lr, 5f). Lanthanoids: common oxidation state +3 (some +2, +4); lanthanoid
    contraction (steady decrease in size; consequences: Zr and Hf similar size, difficulty separating lanthanoids). Actinoids:
    radioactive, wider range of oxidation states, actinoid contraction greater. Uses: mischmetall (flints), uranium fuel.
  explanations:
    text: The f-block elements fill f orbitals. Lanthanoids usually show a +3 oxidation state and get steadily smaller across the row (lanthanoid contraction). Actinoids are all radioactive and show more varied oxidation states.
    visual: 'Draw the two rows usually printed under the periodic table: the lanthanoids on top, the actinoids below, each 14 elements long.'
    step_by_step: 'Step 1: Lanthanoids → 4f; actinoids → 5f. Step 2: Lanthanoids mostly +3. Step 3: Lanthanoid contraction explains Zr–Hf similarity.'
    real_world: Rare-earth (lanthanoid) magnets are used in phone speakers, earphones and electric car motors.
  picture:
    kind: compare
    columns:
    - title: Series
      points:
      - lanthanoids
      - actinoids
    - title: Orbitals filling
      points:
      - 4f
      - 5f
    - title: Key feature
      points:
      - mostly +3, lanthanoid contraction
      - radioactive, many oxidation states
    alt: Lanthanoids and actinoids compared.
  activity:
    type: sort
    prompt: Lanthanoids, actinoids, or true of both?
    bins:
    - Lanthanoids
    - Actinoids
    - Both
    items:
    - label: Fill the 4f orbitals
      bin: Lanthanoids
      clue: Which series follows lanthanum?
      why: Ce to Lu fill 4f.
    - label: Make Zr and Hf almost the same size
      bin: Lanthanoids
      clue: Which contraction comes before hafnium?
      why: The lanthanoid contraction shrinks Hf to Zr's size.
    - label: Misch metal, used in lighter flints
      bin: Lanthanoids
      clue: It's an alloy of which series?
      why: About 95% lanthanoid metals.
    - label: Fill the 5f orbitals
      bin: Actinoids
      clue: Which series follows actinium?
      why: Th to Lr fill 5f.
    - label: All are radioactive
      bin: Actinoids
      clue: Which series includes uranium and plutonium?
      why: Every actinoid is radioactive.
    - label: Show many oxidation states, up to +7
      bin: Actinoids
      clue: Whose 5f, 6d and 7s energies are close?
      why: Actinoids show a wider range of oxidation states.
    - label: Most are made artificially
      bin: Actinoids
      clue: Which series has elements beyond uranium?
      why: The transuranic elements are made in reactors.
    - label: Most common oxidation state +3
      bin: Both
      clue: Is +3 found in only one of the two series?
      why: Both series commonly show +3.
    - label: Size shrinks steadily across the series
      bin: Both
      clue: Is there a contraction in each series?
      why: Both show a contraction (larger for actinoids).
  lesson:
    - teach: The f-block has two series. Lanthanoids (Ce to Lu) fill 4f; actinoids (Th to Lr) fill 5f. Each series has 14 elements, one for each f electron.
      check:
        prompt: Lanthanoids fill which orbitals?
        options:
        - 4f
        - 5f
        - 3d
        answer: 4f
        why: Ce to Lu add electrons to 4f.
      ways:
      - style: visual
        teach: 'The two f-block series side by side: what they fill and how they behave.'
        picture:
          kind: compare
          columns:
          - title: Lanthanoids
            points:
            - Ce to Lu
            - Fill 4f
            - Mostly +3
            - Few are radioactive
          - title: Actinoids
            points:
            - Th to Lr
            - Fill 5f
            - Many oxidation states
            - All radioactive
          alt: Lanthanoids run from cerium to lutetium, fill 4f, mostly show plus three and few are radioactive. Actinoids run from thorium to lawrencium, fill 5f, show many oxidation states and are all radioactive.
      - style: real_world
        teach: 'Your phone has lanthanoids inside: neodymium magnets in the speaker and vibration motor, and europium or terbium in the screen''s colours. These ''rare earths'' are now traded as key resources.'
    - teach: 'Lanthanoids mostly show +3 (some +2 or +4). Across the series, size shrinks steadily: the lanthanoid contraction, because 4f electrons shield poorly so nuclear pull grows. Results: Zr and Hf are almost the same size, and lanthanoids are hard to separate.'
      picture:
        kind: flow
        steps:
        - Add proton + 4f electron
        - 4f shields poorly
        - Outer electrons pulled in
        - Size shrinks steadily
        alt: Why lanthanoid contraction happens.
      check:
        prompt: Why are Zr (4d) and Hf (5d) so similar?
        options:
        - lanthanoid contraction makes Hf as small as Zr
        - they have the same number of electrons
        - they are both radioactive
        answer: lanthanoid contraction makes Hf as small as Zr
        why: Hf comes after the lanthanoids, which cancel the expected size increase.
      ways:
      - style: step_by_step
        teach: 'Why lanthanoids shrink. Step 1: Across the series, protons rise by one each step. Step 2: Each new electron enters a 4f orbital. Step 3: 4f electrons shield the outer ones poorly. Step 4: The extra nuclear pull wins, so atoms and ions get smaller.'
      - style: real_world
        teach: Imagine a room where each new guest also adds a weak curtain. The host (nucleus) gets louder each time, but the curtains (4f electrons) barely block the sound, so people at the edge are pulled closer and closer.
    - teach: 'Actinoids are all radioactive, show a wider range of oxidation states, and their contraction is even greater. Uses: mischmetall (lanthanoids with iron) in lighter flints; uranium and plutonium as nuclear fuels.'
      check:
        prompt: Which property do all actinoids share?
        options:
        - they are radioactive
        - they are gases
        - they show only +3
        answer: they are radioactive
        why: Their nuclei are unstable.
      ways:
      - style: visual
        teach: Everyday and industrial uses of lanthanoid and actinoid metals.
        picture:
          kind: compare
          columns:
          - title: Lanthanoids
            points:
            - Mischmetall in lighter flints
            - Magnets, lasers, phosphors
          - title: Actinoids
            points:
            - 'Uranium: nuclear fuel'
            - 'Plutonium: fuel and weapons'
          alt: Lanthanoids go into mischmetall for lighter flints and into magnets, lasers and phosphors. Uranium is a nuclear fuel, and plutonium is used as fuel and in weapons.
      - style: step_by_step
        teach: 'Why the Gd³⁺ ion is extra stable. Step 1: Gd is [Xe] 4f⁷ 5d¹ 6s². Step 2: Remove 6s² and 5d¹ to make Gd³⁺. Step 3: That leaves 4f⁷. Step 4: A half-filled f set is especially stable, so +3 is Gd''s state.'
  items:
  - prompt: How many elements are in the lanthanoid series (Ce to Lu)?
    answer: '14'
    check: '14'
    difficulty: 1
    hints:
    - "The lanthanoids fill the 4f subshell. How many electrons can an f subshell hold?"
    - Fourteen.
    solution: '14.'
    mistakes: {"15": "c12_lanthanoids", "10": "c12_lanthanoids"}
  - prompt: What is the most common oxidation state of lanthanoids?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Ln³⁺.
