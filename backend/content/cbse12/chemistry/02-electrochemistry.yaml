# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse12-chem
chapter: 2
title: Electrochemistry
tips:
  c12_anode_where: "Electrons flow out of the electrode where the metal loses them. Which electrode do electrons leave the cell from?"
  c12c_ecell: E°cell = E°cathode − E°anode (both as reduction potentials). Positive E°cell means the cell reaction is spontaneous.
  c12c_faraday: 'Faraday: 1 F = 96,500 C is the charge of one mole of electrons.'
  c12_charge: "Q = I × t."
  c12_corrosion: "Rusting has tiny anodes and cathodes on the iron surface, with water as electrolyte."
  c12_delta_g: "ΔG° = −nFE°cell. Convert J to kJ; the sign is negative for a working cell."
  c12_ecell_sign: "ΔG = −nFE. A positive E makes ΔG negative."
  c12_molar_cond: "Λm = 1000κ/c."
  c12_salt_bridge: "Without it, charge builds up in each beaker and the current stops."
  c12_secondary: "A car battery is recharged again and again."
  c12_she: "The hydrogen electrode is the reference that all others are measured against."
  c12_weak_dilution: "Dilution lets a weak electrolyte dissociate much more."
concepts:
- code: cbse12c.ec.cells
  title: Galvanic cells and Nernst equation
  notes: |
    Galvanic (voltaic) cell: chemical → electrical energy; Daniell cell Zn|Zn²⁺||Cu²⁺|Cu, E° = 1.10 V; anode oxidation
    (negative), cathode reduction (positive); salt bridge. Standard hydrogen electrode (0 V); electrochemical series.
    E°cell = E°cathode − E°anode. Nernst equation E = E° − (0.059/n) log Q at 298 K. ΔG° = −nFE°cell; relation to equilibrium
    constant: E° = (0.059/n) log K.
  explanations:
    text: A galvanic cell turns a chemical reaction into electricity. Oxidation happens at the anode and reduction at the cathode, and electrons flow through the wire. The cell's voltage comes from the difference in the two electrodes' standard potentials.
    visual: 'Draw the Daniell cell: zinc in zinc sulfate on the left, copper in copper sulfate on the right, a salt bridge between them, and electrons flowing from zinc to copper through the wire.'
    step_by_step: 'Step 1: Identify cathode (higher E°) and anode (lower E°). Step 2: E°cell = E°cathode − E°anode. Step 3: For non-standard conditions use the Nernst equation. Step 4: ΔG° = −nFE°.'
    real_world: Batteries in torches and phones are galvanic cells.
  picture:
    kind: flow
    steps:
    - 'Anode: oxidation (Zn → Zn²⁺)'
    - Electrons flow through wire
    - 'Cathode: reduction (Cu²⁺ → Cu)'
    - Salt bridge balances charge
    alt: How a Daniell cell works.
  activity:
    type: formula
    prompt: 'E°cell = E°(cathode) − E°(anode). Reduction happens at the cathode, the electrode with the higher E°. Some E° values: Mg −2.37, Zn −0.76, Cu +0.34, Ag +0.80 V.'
    inputs:
    - name: c
      label: Cathode E°
      min: -2.5
      max: 1
      step: 0.01
      start: 0
      unit: V
    - name: a
      label: Anode E°
      min: -2.5
      max: 1
      step: 0.01
      start: 0
      unit: V
    outputs:
    - name: e
      label: E°cell
      expr: c-a
      unit: V
      places: 2
    goals:
    - prompt: 'Make the Daniell cell: Zn | Zn²⁺ || Cu²⁺ | Cu.'
      want:
        c: 0.34
        a: -0.76
      mistakes:
      - when:
          c: -0.76
          a: 0.34
        say: 'Negative E°cell: swapped. Copper, with the higher E°, is reduced: it is the cathode.'
      - when:
          e:
          - -0.43
          - -0.41
        say: −0.76 − 0.34? E°cell = E°cathode − E°anode, not a sum.
    - prompt: Make a working cell from magnesium and silver.
      want:
        c: 0.8
        a: -2.37
      mistakes:
      - when:
          c: -2.37
          a: 0.8
        say: A negative E°cell means it won't run. Silver, with the higher E°, is the cathode.
    - prompt: Make a working cell from copper and silver.
      want:
        c: 0.8
        a: 0.34
      mistakes:
      - when:
          c: 0.34
          a: 0.8
        say: 'Swapped: silver (+0.80) is more easily reduced than copper (+0.34), so silver is the cathode.'
  items:
  - prompt: E°(Cu²⁺/Cu) = 0.34 V and E°(Zn²⁺/Zn) = −0.76 V. Find E°cell (V).
    answer: '1.1'
    check: Rational(34,100)+Rational(76,100)
    difficulty: 1
    hints:
    - 0.34 − (−0.76).
    - 1.10.
    solution: 1.10 V.
    mistakes:
      '-0.42': c12c_ecell
  - prompt: For the same cell, n = 2. Find ΔG° in kJ/mol (F = 96,500), to one decimal.
    answer: '-212.3'
    check: -2*96500*Rational(11,10)/1000
    difficulty: 2
    hints:
    - −nFE°.
    - −2 × 96500 × 1.1 J.
    solution: −212.3 kJ/mol.
    mistakes: {"212.3": "c12_delta_g", "-106.2": "c12_delta_g"}
  - prompt: What is the standard potential (V) of the hydrogen electrode?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Reference.
    - Defined.
    solution: 0 V.
    mistakes: {"1": "c12_she", "-0.76": "c12_she"}
  - prompt: 'In a galvanic cell, oxidation takes place at the:'
    options:
    - anode
    - cathode
    - salt bridge
    - voltmeter
    answer: anode
    difficulty: 1
    hints:
    - An Ox.
    - Zinc.
    solution: The anode.
    mistakes: {"cathode": "c12_anode_where", "salt bridge": "c12_anode_where", "voltmeter": "c12_anode_where"}
  - prompt: 'The salt bridge:'
    options:
    - keeps the solutions electrically neutral
    - supplies electrons
    - is where oxidation happens
    - stops the reaction
    answer: keeps the solutions electrically neutral
    difficulty: 2
    hints:
    - Ions move through it.
    - Completes the circuit.
    solution: Keeps both solutions neutral by letting ions flow.
    mistakes: {"supplies electrons": "c12_salt_bridge", "is where oxidation happens": "c12_salt_bridge", "stops the reaction": "c12_salt_bridge"}
  - prompt: 'A positive E°cell means the cell reaction is:'
    options:
    - spontaneous
    - non-spontaneous
    - at equilibrium
    - impossible
    answer: spontaneous
    difficulty: 2
    hints:
    - ΔG° = −nFE°.
    - Negative ΔG.
    solution: Spontaneous.
    mistakes: {"non-spontaneous": "c12_ecell_sign", "at equilibrium": "c12_ecell_sign", "impossible": "c12_ecell_sign"}
- code: cbse12c.ec.conductance
  title: Conductance, electrolysis and batteries
  after:
  - cbse12c.ec.cells
  notes: |
    Resistance, resistivity; conductivity κ (S/m); molar conductivity Λm = κ/c; strong electrolytes: Λm decreases slightly with
    concentration (Debye–Hückel–Onsager); weak: sharply; Kohlrausch's law of independent migration Λ°m = ν₊λ°₊ + ν₋λ°₋.
    Electrolytic cells; Faraday's laws: m = ZIt; 1 F = 96,500 C/mol e⁻. Products of electrolysis. Batteries: primary (dry
    cell), secondary (lead storage), fuel cells (H₂–O₂). Corrosion as electrochemical process; prevention.
  explanations:
    text: Electrolytes conduct electricity through moving ions. Electrolysis uses electricity to drive a chemical change, and Faraday's laws tell how much substance is produced. Batteries and fuel cells are practical electrochemical cells, while rusting is an unwanted one.
    visual: 'Draw electrolysis of molten NaCl: Na⁺ moves to the negative cathode and becomes sodium metal; Cl⁻ moves to the positive anode and becomes chlorine gas.'
    step_by_step: 'Step 1: Charge Q = It. Step 2: Moles of electrons = Q/96,500. Step 3: Use the half-equation to find moles of product. Step 4: Multiply by molar mass.'
    real_world: Hydrogen fuel cells power some buses and spacecraft, giving only water as exhaust.
  picture:
    kind: compare
    columns:
    - title: Battery
      points:
      - dry cell
      - lead storage
      - fuel cell
    - title: Type
      points:
      - primary (not rechargeable)
      - secondary (rechargeable)
      - continuous fuel supply
    alt: 'Kinds of batteries: dry cell, lead storage battery and fuel cell.'
  activity:
    type: formula
    prompt: 'Faraday: 96 500 C (1 F) is one mole of electrons. Cu²⁺ + 2e⁻ → Cu (63.5 g/mol); Ag⁺ + e⁻ → Ag (108 g/mol).'
    inputs:
    - name: i
      label: Current
      min: 0.5
      max: 10
      step: 0.5
      start: 0.5
      unit: A
    - name: t
      label: Time
      min: 0
      max: 4000
      step: 5
      start: 0
      unit: s
    outputs:
    - name: q
      label: Charge
      expr: i*t
      unit: C
      places: 0
    - name: cu
      label: Copper deposited
      expr: 63.5*i*t/(2*96500)
      unit: g
      places: 3
    - name: ag
      label: Silver deposited
      expr: 108*i*t/96500
      unit: g
      places: 3
    goals:
    - prompt: With 1 A, deposit 0.635 g of copper.
      want:
        i: 1
        cu:
        - 0.634
        - 0.636
      mistakes:
      - when:
          i: 1
          t:
          - 960
          - 970
        say: That's enough charge for 0.01 mol of electrons, but each Cu²⁺ needs TWO. Twice the time.
      - when:
          i: 1
          t:
          - 3850
          - 3870
        say: 'Too long: that''s 1.27 g.'
    - prompt: With 2 A, deposit 2.16 g of silver.
      want:
        i: 2
        ag:
        - 2.15
        - 2.17
      mistakes:
      - when:
          i: 2
          t: 1930
        say: 'That''s twice the charge needed: 4.32 g. Doubling the current halves the time.'
      - when:
          i: 2
          t:
          - 480
          - 490
        say: 'Only half: Ag⁺ takes one electron each, so 0.02 mol of Ag needs 0.02 F = 1930 C.'
    - prompt: The same charge flows through a copper cell and a silver cell in series. Pass 1930 C with 1 A, and compare the masses.
      want:
        q: 1930
        i: 1
      mistakes:
      - when:
          q: 965
        say: That's half the charge. 1930 s at 1 A.
  items:
  - prompt: A current of 2 A flows for 965 s. Find the charge (C).
    answer: '1930'
    check: 2*965
    difficulty: 1
    hints:
    - Q = It.
    - 2 × 965.
    solution: 1,930 C.
    mistakes: {"482.5": "c12_charge", "965": "c12_charge"}
  - prompt: How many moles of electrons is 1930 C? Give a fraction (F = 96,500).
    answer: 1/50
    check: Rational(1930,96500)
    difficulty: 2
    hints:
    - 1930/96500.
    - 0.02.
    solution: 0.02 mol.
    mistakes:
      '50': c12c_faraday
  - prompt: κ = 0.02 S/cm for a 0.1 mol/L solution. Find Λm (S cm² mol⁻¹) using Λm = 1000κ/c.
    answer: '200'
    check: 1000*Rational(2,100)/Rational(1,10)
    difficulty: 2
    hints:
    - 1000 × 0.02/0.1.
    - '200.'
    solution: 200 S cm² mol⁻¹.
    mistakes: {"2": "c12_molar_cond", "20": "c12_molar_cond"}
  - prompt: 'A lead storage battery is a:'
    options:
    - secondary cell
    - primary cell
    - fuel cell
    - solar cell
    answer: secondary cell
    difficulty: 1
    hints:
    - Rechargeable.
    - Cars.
    solution: A secondary (rechargeable) cell.
    mistakes: {"primary cell": "c12_secondary", "fuel cell": "c12_secondary", "solar cell": "c12_secondary"}
  - prompt: 'Rusting of iron is an example of:'
    options:
    - electrochemical corrosion
    - electrolysis
    - a fuel cell
    - fermentation
    answer: electrochemical corrosion
    difficulty: 2
    hints:
    - Tiny cells on the surface.
    - Iron oxidised.
    solution: Electrochemical corrosion.
    mistakes: {"electrolysis": "c12_corrosion", "a fuel cell": "c12_corrosion", "fermentation": "c12_corrosion"}
  - prompt: 'The molar conductivity of a weak electrolyte on dilution:'
    options:
    - increases sharply
    - decreases
    - stays constant
    - becomes zero
    answer: increases sharply
    difficulty: 2
    hints:
    - More dissociation.
    - Acetic acid.
    solution: Increases sharply.
    mistakes: {"decreases": "c12_weak_dilution", "stays constant": "c12_weak_dilution", "becomes zero": "c12_weak_dilution"}
