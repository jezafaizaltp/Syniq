# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 2. Format: content/README.md.
subject: cbse12-chem
chapter: 2
title: Electrochemistry
tips:
  c12_anode_where: "Electrons flow out of the electrode where the metal loses them. Which electrode do electrons leave the cell from?"
  c12c_ecell: E°cell = E°cathode − E°anode (both as reduction potentials). Positive E°cell means the cell reaction is spontaneous.
  c12c_faraday: 'Faraday: 1 F = 96,500 C is the charge of one mole of electrons.'
  c12_charge: "Q = I × t."
  c12_corrosion: "Rusting has tiny anodes and cathodes on the iron surface, with water as electrolyte."
  c12_delta_g: "ΔG° = −nFE°cell. Convert J to kJ; the sign is negative for a working cell."
  c12_ecell_sign: "ΔG = −nFE. A positive E makes ΔG negative."
  c12_molar_cond: "Λm = 1000κ/c."
  c12_salt_bridge: "Without it, charge builds up in each beaker and the current stops."
  c12_secondary: "A car battery is recharged again and again."
  c12_she: "The hydrogen electrode is the reference that all others are measured against."
  c12_weak_dilution: "Dilution lets a weak electrolyte dissociate much more."
  c12c2_cell: E°cell = E°cathode − E°anode, using reduction potentials. The electrode with the higher E° is the cathode.
  c12c2_g: "Use ΔG° = −nFE°cell. The minus sign means ΔG° and E°cell always have opposite signs."
  c12c2_far: Charge Q = It; moles of electrons = Q/96500; then use the ion's charge to get moles of substance.
  c12c2_cond: 'Λm = κ × 1000/c (κ in S/cm, c in mol/L). Kohlrausch: Λ°m is the sum of the ions'' limiting values.'
concepts:
- code: cbse12c.ec.cells
  title: Galvanic cells and Nernst equation
  notes: |
    Galvanic (voltaic) cell: chemical → electrical energy; Daniell cell Zn|Zn²⁺||Cu²⁺|Cu, E° = 1.10 V; anode oxidation
    (negative), cathode reduction (positive); salt bridge. Standard hydrogen electrode (0 V); electrochemical series.
    E°cell = E°cathode − E°anode. Nernst equation E = E° − (0.059/n) log Q at 298 K. ΔG° = −nFE°cell; relation to equilibrium
    constant: E° = (0.059/n) log K.
  explanations:
    text: A galvanic cell turns a chemical reaction into electricity. Oxidation happens at the anode and reduction at the cathode, and electrons flow through the wire. The cell's voltage comes from the difference in the two electrodes' standard potentials.
    visual: 'Draw the Daniell cell: zinc in zinc sulfate on the left, copper in copper sulfate on the right, a salt bridge between them, and electrons flowing from zinc to copper through the wire.'
    step_by_step: 'Step 1: Identify cathode (higher E°) and anode (lower E°). Step 2: E°cell = E°cathode − E°anode. Step 3: For non-standard conditions use the Nernst equation. Step 4: ΔG° = −nFE°.'
    real_world: Batteries in torches and phones are galvanic cells.
  picture:
    kind: flow
    steps:
    - 'Anode: oxidation (Zn → Zn²⁺)'
    - Electrons flow through wire
    - 'Cathode: reduction (Cu²⁺ → Cu)'
    - Salt bridge balances charge
    alt: How a Daniell cell works.
  activity:
    type: formula
    prompt: 'E°cell = E°(cathode) − E°(anode). Reduction happens at the cathode, the electrode with the higher E°. Some E° values: Mg −2.37, Zn −0.76, Cu +0.34, Ag +0.80 V.'
    inputs:
    - name: c
      label: Cathode E°
      min: -2.5
      max: 1
      step: 0.01
      start: 0
      unit: V
    - name: a
      label: Anode E°
      min: -2.5
      max: 1
      step: 0.01
      start: 0
      unit: V
    outputs:
    - name: e
      label: E°cell
      expr: c-a
      unit: V
      places: 2
    goals:
    - prompt: 'Make the Daniell cell: Zn | Zn²⁺ || Cu²⁺ | Cu.'
      want:
        c: 0.34
        a: -0.76
      mistakes:
      - when:
          c: -0.76
          a: 0.34
        say: 'Negative E°cell: swapped. Copper, with the higher E°, is reduced: it is the cathode.'
      - when:
          e:
          - -0.43
          - -0.41
        say: −0.76 − 0.34? E°cell = E°cathode − E°anode, not a sum.
    - prompt: Make a working cell from magnesium and silver.
      want:
        c: 0.8
        a: -2.37
      mistakes:
      - when:
          c: -2.37
          a: 0.8
        say: A negative E°cell means it won't run. Silver, with the higher E°, is the cathode.
    - prompt: Make a working cell from copper and silver.
      want:
        c: 0.8
        a: 0.34
      mistakes:
      - when:
          c: 0.34
          a: 0.8
        say: 'Swapped: silver (+0.80) is more easily reduced than copper (+0.34), so silver is the cathode.'
  lesson:
    - teach: A galvanic cell turns chemical energy into electrical energy. In the Daniell cell, Zn|Zn²⁺||Cu²⁺|Cu, zinc is oxidised at the anode (negative) and Cu²⁺ is reduced at the cathode (positive). A salt bridge keeps both solutions neutral. E° = 1.10 V.
      check:
        prompt: In the Daniell cell, which electrode loses mass?
        options:
        - zinc
        - copper
        - neither
        answer: zinc
        why: Zinc is oxidised to Zn²⁺ ions that go into solution.
      ways:
      - style: visual
        teach: The Daniell cell, followed from zinc to copper.
        picture:
          kind: flow
          steps:
          - Zn → Zn²⁺ + 2e⁻ at the anode (−)
          - Electrons travel through the wire
          - Cu²⁺ + 2e⁻ → Cu at the cathode (+)
          - Salt bridge ions balance the charge
          alt: Zinc loses two electrons at the negative anode. The electrons travel through the wire to the positive cathode, where copper ions gain them and become copper. Ions from the salt bridge balance the charge in each beaker.
      - style: real_world
        teach: 'A lemon battery: push a zinc nail and a copper coin into a lemon and join them with wire. Zinc gives up electrons, they flow through the wire to copper, and a tiny LED can glow. The lemon juice is the electrolyte.'
    - teach: Electrode potentials are measured against the standard hydrogen electrode (0 V). E°cell = E°cathode − E°anode. The more positive reduction potential becomes the cathode. A positive E°cell means the reaction is spontaneous, since ΔG° = −nFE°cell.
      picture:
        kind: flow
        steps:
        - Look up both E°(reduction)
        - Higher E° → cathode
        - E°cell = E°cath − E°anode
        - ΔG° = −nFE°cell
        alt: Steps to find a cell's standard EMF and free energy change.
      check:
        prompt: E°(Ag⁺/Ag) = 0.80 V, E°(Cu²⁺/Cu) = 0.34 V. Which is the cathode?
        options:
        - silver
        - copper
        - neither
        answer: silver
        why: Silver has the higher reduction potential.
      ways:
      - style: step_by_step
        teach: 'Cell Mg | Mg²⁺ || Ni²⁺ | Ni with E°(Mg²⁺/Mg) = −2.37 V, E°(Ni²⁺/Ni) = −0.25 V. Step 1: Nickel''s value is higher, so it is the cathode. Step 2: E°cell = −0.25 − (−2.37). Step 3: E°cell = 2.12 V. Step 4: Positive, so the reaction runs on its own.'
      - style: real_world
        teach: The electrochemical series is like a tug of war for electrons. Whoever has the more positive reduction potential pulls harder and wins the electrons, becoming the cathode. The bigger the difference, the stronger the push in the wire.
    - teach: 'Nernst equation at 298 K: E = E° − (0.059/n) log Q. As the reaction proceeds, Q grows and E falls; at equilibrium E = 0 and E° = (0.059/n) log K.'
      check:
        prompt: 'At equilibrium, a cell''s E is:'
        options:
        - '0'
        - E°
        - maximum
        answer: '0'
        why: No net reaction, so no driving force.
      ways:
      - style: visual
        teach: How a cell's voltage changes as it runs down.
        picture:
          kind: flow
          steps:
          - 'Fresh cell: Q small, E above E°'
          - Reactants used, products build up
          - Q grows, E falls
          - 'Equilibrium: E = 0, cell is dead'
          alt: In a fresh cell Q is small and E can be above E standard. As reactants are used and products build up, Q grows and E falls. At equilibrium E is zero and the cell is dead.
      - style: step_by_step
        teach: 'A cell with E° = 0.59 V and n = 1. Step 1: At equilibrium E = 0. Step 2: So E° = 0.059 log K. Step 3: log K = 0.59 ÷ 0.059 = 10. Step 4: K = 10¹⁰: the reaction goes almost to completion.'
  items:
  - prompt: E°(Cu²⁺/Cu) = 0.34 V and E°(Zn²⁺/Zn) = −0.76 V. Find E°cell (V).
    answer: '1.1'
    check: Rational(34,100)+Rational(76,100)
    difficulty: 1
    hints:
    - 0.34 − (−0.76).
    - 1.10.
    solution: "E°cell = E°cathode − E°anode = 0.34 − (−0.76) = 1.10 V."
    mistakes:
      '-0.42': c12c_ecell
  - prompt: For the same cell, n = 2. Find ΔG° in kJ/mol (F = 96,500), to one decimal.
    answer: '-212.3'
    check: -2*96500*Rational(11,10)/1000
    difficulty: 2
    hints:
    - −nFE°.
    - −2 × 96500 × 1.1 J.
    solution: "ΔG° = −nFE° = −2 × 96,500 × 1.10 = −212,300 J/mol = −212.3 kJ/mol."
    mistakes: {"212.3": "c12_delta_g", "-106.2": "c12_delta_g"}
  - prompt: What is the standard potential (V) of the hydrogen electrode?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - Reference.
    - Defined.
    solution: "The standard hydrogen electrode is the reference, given 0 V by agreement."
    mistakes: {"1": "c12_she", "-0.76": "c12_she"}
  - prompt: 'In a galvanic cell, oxidation takes place at the:'
    options:
    - anode
    - cathode
    - salt bridge
    - voltmeter
    answer: anode
    difficulty: 1
    hints:
    - An Ox.
    - Zinc.
    solution: "Oxidation (loss of electrons) happens at the anode; reduction at the cathode."
    mistakes: {"cathode": "c12_anode_where", "salt bridge": "c12_anode_where", "voltmeter": "c12_anode_where"}
  - prompt: 'The salt bridge:'
    options:
    - "keeps the solutions electrically neutral"
    - "supplies electrons to the cathode"
    - "is where oxidation takes place"
    - "stops the reaction when it is full"
    answer: keeps the solutions electrically neutral
    difficulty: 2
    hints:
    - Ions move through it.
    - Completes the circuit.
    solution: Keeps both solutions neutral by letting ions flow.
    mistakes: {"supplies electrons to the cathode": "c12_salt_bridge", "is where oxidation takes place": "c12_salt_bridge", "stops the reaction when it is full": "c12_salt_bridge"}
  - prompt: 'A positive E°cell means the cell reaction is:'
    options:
    - spontaneous
    - non-spontaneous
    - at equilibrium
    - impossible
    answer: spontaneous
    difficulty: 2
    hints:
    - ΔG° = −nFE°.
    - Negative ΔG.
    solution: "ΔG° = −nFE°, so E° > 0 gives ΔG° < 0: the reaction is spontaneous."
    mistakes: {"non-spontaneous": "c12_ecell_sign", "at equilibrium": "c12_ecell_sign", "impossible": "c12_ecell_sign"}
  - prompt: E°(Ag⁺/Ag) = 0.80 V and E°(Cu²⁺/Cu) = 0.34 V. Find E°cell (V) as a fraction.
    answer: 23/50
    check: Rational(80,100) - Rational(34,100)
    difficulty: 1
    hints:
    - Cathode is the higher one.
    - 0.80 − 0.34.
    solution: 'Step 1: 0.46 V. Step 2: 23/50.'
    mistakes:
      57/50: c12c2_cell
      -23/50: c12c2_cell
  - prompt: E°(Zn²⁺/Zn) = −0.76 V and SHE = 0 V. E°cell (V) for Zn | SHE, as a fraction?
    answer: 19/25
    check: 0 - Rational(-76,100)
    difficulty: 1
    hints:
    - Zinc is the anode.
    - 0 − (−0.76).
    solution: 'Step 1: 0.76 V. Step 2: 19/25.'
    mistakes:
      -19/25: c12c2_cell
      '0': c12c2_cell
  - prompt: In a galvanic cell, the cathode carries which sign?
    options:
    - positive
    - negative
    - no charge
    answer: positive
    difficulty: 1
    hints:
    - Electrons arrive there from the outside wire.
    - They are used up by reduction.
    solution: 'Step 1: reduction pulls electrons. Step 2: cathode is positive.'
    mistakes:
      negative: c12c2_cell
      no charge: c12c2_cell
  - prompt: n = 1, E°cell = 1 V. ΔG° in kJ/mol (F = 96,500), as a fraction?
    answer: -193/2
    check: -1*96500*1/1000
    difficulty: 2
    hints:
    - ΔG° = −nFE°.
    - −96500 J.
    solution: 'Step 1: −96.5 kJ/mol. Step 2: −193/2.'
    mistakes:
      193/2: c12c2_g
      '-96500': c12c2_g
  - prompt: 'A cell reaction has ΔG° > 0. Its E°cell is:'
    options:
    - negative
    - positive
    - zero
    answer: negative
    difficulty: 2
    hints:
    - ΔG° = −nFE°.
    - Signs are opposite.
    solution: 'Step 1: positive ΔG° gives negative E°. Step 2: non-spontaneous.'
    mistakes:
      positive: c12c2_g
      zero: c12c2_g
  - prompt: For a cell with n = 2, E° = 0.059 V. Find log K.
    answer: '2'
    check: Rational(59,1000)*2/Rational(59,1000)
    difficulty: 2
    hints:
    - E° = (0.059/n) log K.
    - log K = nE°/0.059.
    solution: 'Step 1: 2 × 0.059/0.059. Step 2: 2 (K = 100).'
    mistakes:
      '1': c12c2_g
      '4': c12c2_g
  - prompt: 'Nernst: E° = 1.10 V, n = 2, Q = 10. Find E (V) as a fraction (use 0.059).'
    answer: 2141/2000
    check: Rational(110,100) - Rational(59,1000)/2*1
    difficulty: 2
    hints:
    - log 10 = 1.
    - 1.10 − 0.0295.
    solution: 'Step 1: 1.10 − 0.0295 = 1.0705 V. Step 2: 2141/2000.'
    mistakes:
      1041/1000: c12c2_cell
      1159/1000: c12c2_cell
  - prompt: Can a copper vessel safely store a silver nitrate solution? (E° Cu²⁺/Cu = 0.34, Ag⁺/Ag = 0.80)
    options:
    - "no, copper displaces silver"
    - "yes, copper does not react"
    - "yes, if the solution is cold"
    answer: no, copper displaces silver
    difficulty: 3
    hints:
    - Which way is E°cell positive?
    - Cu → Cu²⁺ with Ag⁺ → Ag.
    solution: 'Step 1: E° = 0.80 − 0.34 > 0. Step 2: Cu reacts, silver deposits.'
    mistakes:
      "yes, copper does not react": c12c2_cell
      "yes, if the solution is cold": c12c2_cell
  - prompt: Why does a cell's voltage fall as it is used?
    options:
    - "Q grows, so E = E° − (0.059/n) log Q falls"
    - "E° itself falls steadily as time passes"
    - "the salt bridge slowly disappears with use"
    answer: Q grows, so E = E° − (0.059/n) log Q falls
    difficulty: 3
    hints:
    - Products build up.
    - Look at the Nernst equation.
    solution: 'Step 1: products increase, reactants decrease. Step 2: Q rises, E falls until 0.'
    mistakes:
      "E° itself falls steadily as time passes": c12c2_cell
      "the salt bridge slowly disappears with use": c12c2_cell
  - prompt: 'Assertion (A): Copper does not displace zinc from zinc sulphate solution.

      Reason (R): Zinc has a lower (more negative) standard reduction potential than copper.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: For Cu + Zn²⁺, E°cell = −0.76 − 0.34 = −1.10 V, which is negative, so the reaction is not spontaneous. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A student stores copper sulphate solution in an iron can. After a day, reddish metal appears inside. Why? (E° Fe²⁺/Fe = −0.44 V, Cu²⁺/Cu = 0.34 V)'
    options:
    - Iron displaces copper because its reduction potential is lower
    - Copper displaces iron because its reduction potential is higher
    - The can rusts and the rust is red
    answer: Iron displaces copper because its reduction potential is lower
    hints:
    - Which metal loses electrons more easily?
    - Find E°cell = E°cathode − E°anode with Cu²⁺ being reduced.
    solution: E°cell = 0.34 − (−0.44) = 0.78 V, positive. Iron is oxidised and Cu²⁺ is reduced, depositing red copper on the can.
    mistakes:
      Copper displaces iron because its reduction potential is higher: c12c2_cell
      The can rusts and the rust is red: c12_corrosion
    exam: case
    difficulty: 2
  - prompt: 'An engineer wants the highest-voltage cell from three electrodes: A (E° = −1.66 V), B (E° = −0.13 V), C (E° = +0.80 V). Which pair?'
    options:
    - A as anode, C as cathode
    - B as anode, C as cathode
    - A as anode, B as cathode
    answer: A as anode, C as cathode
    hints:
    - E°cell = E°cathode − E°anode.
    - Pick the biggest gap between two values.
    solution: The largest difference is 0.80 − (−1.66) = 2.46 V, using A as anode and C as cathode.
    mistakes:
      B as anode, C as cathode: c12c2_cell
      A as anode, B as cathode: c12c2_cell
    exam: competency
    difficulty: 2
- code: cbse12c.ec.conductance
  title: Conductance, electrolysis and batteries
  after:
  - cbse12c.ec.cells
  notes: |
    Resistance, resistivity; conductivity κ (S/m); molar conductivity Λm = κ/c; strong electrolytes: Λm decreases slightly with
    concentration (Debye–Hückel–Onsager); weak: sharply; Kohlrausch's law of independent migration Λ°m = ν₊λ°₊ + ν₋λ°₋.
    Electrolytic cells; Faraday's laws: m = ZIt; 1 F = 96,500 C/mol e⁻. Products of electrolysis. Batteries: primary (dry
    cell), secondary (lead storage), fuel cells (H₂–O₂). Corrosion as electrochemical process; prevention.
  explanations:
    text: Electrolytes conduct electricity through moving ions. Electrolysis uses electricity to drive a chemical change, and Faraday's laws tell how much substance is produced. Batteries and fuel cells are practical electrochemical cells, while rusting is an unwanted one.
    visual: 'Draw electrolysis of molten NaCl: Na⁺ moves to the negative cathode and becomes sodium metal; Cl⁻ moves to the positive anode and becomes chlorine gas.'
    step_by_step: 'Step 1: Charge Q = It. Step 2: Moles of electrons = Q/96,500. Step 3: Use the half-equation to find moles of product. Step 4: Multiply by molar mass.'
    real_world: Hydrogen fuel cells power some buses and spacecraft, giving only water as exhaust.
  picture:
    kind: compare
    columns:
    - title: Battery
      points:
      - dry cell
      - lead storage
      - fuel cell
    - title: Type
      points:
      - primary (not rechargeable)
      - secondary (rechargeable)
      - continuous fuel supply
    alt: 'Kinds of batteries: dry cell, lead storage battery and fuel cell.'
  activity:
    type: formula
    prompt: 'Faraday: 96 500 C (1 F) is one mole of electrons. Cu²⁺ + 2e⁻ → Cu (63.5 g/mol); Ag⁺ + e⁻ → Ag (108 g/mol).'
    inputs:
    - name: i
      label: Current
      min: 0.5
      max: 10
      step: 0.5
      start: 0.5
      unit: A
    - name: t
      label: Time
      min: 0
      max: 4000
      step: 5
      start: 0
      unit: s
    outputs:
    - name: q
      label: Charge
      expr: i*t
      unit: C
      places: 0
    - name: cu
      label: Copper deposited
      expr: 63.5*i*t/(2*96500)
      unit: g
      places: 3
    - name: ag
      label: Silver deposited
      expr: 108*i*t/96500
      unit: g
      places: 3
    goals:
    - prompt: With 1 A, deposit 0.635 g of copper.
      want:
        i: 1
        cu:
        - 0.634
        - 0.636
      mistakes:
      - when:
          i: 1
          t:
          - 960
          - 970
        say: That's enough charge for 0.01 mol of electrons, but each Cu²⁺ needs TWO. Twice the time.
      - when:
          i: 1
          t:
          - 3850
          - 3870
        say: 'Too long: that''s 1.27 g.'
    - prompt: With 2 A, deposit 2.16 g of silver.
      want:
        i: 2
        ag:
        - 2.15
        - 2.17
      mistakes:
      - when:
          i: 2
          t: 1930
        say: 'That''s twice the charge needed: 4.32 g. Doubling the current halves the time.'
      - when:
          i: 2
          t:
          - 480
          - 490
        say: 'Only half: Ag⁺ takes one electron each, so 0.02 mol of Ag needs 0.02 F = 1930 C.'
    - prompt: The same charge flows through a copper cell and a silver cell in series. Pass 1930 C with 1 A, and compare the masses.
      want:
        q: 1930
        i: 1
      mistakes:
      - when:
          q: 965
        say: That's half the charge. 1930 s at 1 A.
  lesson:
    - teach: 'Electrolyte solutions conduct by moving ions. Conductivity κ (S/cm) is the conductance of a 1 cm cube. Molar conductivity Λm = κ × 1000/c (c in mol/L) compares solutions fairly. On dilution, Λm rises: slightly for strong electrolytes, sharply for weak ones (more ionisation).'
      check:
        prompt: 'Diluting acetic acid makes its Λm:'
        options:
        - rise sharply
        - fall
        - stay the same
        answer: rise sharply
        why: A weak acid ionises much more on dilution.
      ways:
      - style: visual
        teach: How molar conductivity changes on dilution for strong and weak electrolytes.
        picture:
          kind: compare
          columns:
          - title: Strong (KCl)
            points:
            - Fully ionised already
            - Λm rises slowly on dilution
            - Straight line vs √c
          - title: Weak (CH₃COOH)
            points:
            - Only partly ionised
            - Λm rises sharply on dilution
            - Steep curve near zero
          alt: A strong electrolyte like KCl is already fully ionised, so molar conductivity rises slowly on dilution and gives a straight line against the square root of concentration. A weak electrolyte like acetic acid is only partly ionised, so molar conductivity rises sharply on dilution, curving steeply near zero.
      - style: step_by_step
        teach: 'κ = 0.006 S/cm for a 0.04 mol/L solution. Step 1: Λm = κ × 1000 / c. Step 2: κ × 1000 = 6. Step 3: 6 ÷ 0.04 = 150. Step 4: Λm = 150 S cm² mol⁻¹.'
    - teach: 'Kohlrausch''s law: at infinite dilution, Λ°m = ν₊λ°₊ + ν₋λ°₋, each ion contributing independently. It lets us find Λ°m for weak electrolytes from strong ones.'
      check:
        prompt: λ°(Na⁺) = 50, λ°(Cl⁻) = 76 S cm² mol⁻¹. Λ°m(NaCl)?
        options:
        - '126'
        - '26'
        - '3800'
        answer: '126'
        why: 50 + 76.
      ways:
      - style: visual
        teach: 'Kohlrausch''s law: build the weak acid from three strong electrolytes.'
        picture:
          kind: flow
          steps:
          - Λ°(HCl) gives H⁺ + Cl⁻
          - + Λ°(CH₃COONa) gives CH₃COO⁻ + Na⁺
          - − Λ°(NaCl) removes Na⁺ + Cl⁻
          - '= Λ°(CH₃COOH): H⁺ + CH₃COO⁻'
          alt: Add the limiting molar conductivity of hydrochloric acid and of sodium acetate, then subtract that of sodium chloride. The sodium and chloride parts cancel, leaving hydrogen ion plus acetate ion, which is acetic acid.
      - style: real_world
        teach: 'Like working out a single item''s price from bills: if tea + biscuit costs ₹30 and biscuit + cake costs ₹50, and cake + tea costs ₹40, you can separate each item. Kohlrausch lets each ion carry its own fixed ''price''.'
    - teach: 'Electrolysis uses current to drive a reaction. Faraday: m = ZIt; 1 F = 96,500 C per mole of electrons. Batteries: primary (dry cell, not rechargeable), secondary (lead storage, rechargeable), fuel cells (H₂ + O₂ → water). Rusting is electrochemical corrosion; paint, galvanising and sacrificial zinc prevent it.'
      picture:
        kind: flow
        steps:
        - Q = I × t
        - mol e⁻ = Q/96500
