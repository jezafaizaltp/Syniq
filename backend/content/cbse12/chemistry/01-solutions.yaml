# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse12-chem
chapter: 1
title: Solutions
tips:
  c12c_vhf: 'van ''t Hoff factor i: NaCl gives 2 ions (i ≈ 2), CaCl₂ gives 3 (i ≈ 3), glucose doesn''t split (i = 1).'
  c12c_raoult: 'Raoult''s law: partial vapour pressure = mole fraction × pure vapour pressure.'
concepts:
- code: cbse12c.sol.conc
  title: Concentration, solubility and Raoult's law
  notes: |
    Types of solutions; concentration: mass %, ppm, mole fraction, molarity, molality. Solubility of solids (temperature) and
    gases: Henry's law p = K_H x (scuba diving, soft drinks). Vapour pressure of solutions: Raoult's law p₁ = x₁p₁°; ideal
    solutions (ΔH_mix = 0, ΔV_mix = 0); non-ideal: positive deviation (ethanol + acetone), negative deviation (chloroform +
    acetone, HNO₃ + water); azeotropes (minimum and maximum boiling).
  explanations:
    text: A solution's concentration can be given in several ways, like molarity or molality. Raoult's law says each liquid in a mixture contributes vapour pressure in proportion to its mole fraction. Henry's law says more gas dissolves at higher pressure.
    visual: 'Picture a fizzy drink: sealed under pressure, lots of CO₂ is dissolved (Henry''s law). Open it, the pressure drops, and bubbles escape.'
    step_by_step: 'Step 1: Find moles of each component. Step 2: Mole fraction x = moles ÷ total moles. Step 3: Raoult: p = x p°. Step 4: Total pressure = sum of partial pressures.'
    real_world: Scuba divers rise slowly so dissolved nitrogen leaves their blood gently, avoiding 'the bends' (Henry's law).
  picture:
    kind: compare
    columns:
    - title: Deviation
      points:
      - positive
      - negative
    - title: Forces between unlike molecules
      points:
      - weaker
      - stronger
    - title: Example
      points:
      - ethanol + acetone
      - chloroform + acetone
    alt: Positive and negative deviations from Raoult's law.
  items:
  - prompt: A solution has 2 mol of A and 3 mol of B. Find the mole fraction of A as a fraction.
    answer: 2/5
    check: Rational(2,5)
    difficulty: 1
    hints:
    - 2/(2 + 3).
    - 2/5.
    solution: 2/5.
  - prompt: Pure A has vapour pressure 100 mm Hg; x_A = 0.4. Find its partial pressure (mm Hg).
    answer: '40'
    check: Rational(4,10)*100
    difficulty: 1
    hints:
    - p = x p°.
    - 0.4 × 100.
    solution: 40 mm Hg.
    mistakes:
      '60': c12c_raoult
  - prompt: Find the molality of 0.5 mol of solute in 250 g of water.
    answer: '2'
    check: Rational(1,2)/Rational(1,4)
    difficulty: 1
    hints:
    - mol/kg.
    - 0.5/0.25.
    solution: 2 m.
  - prompt: 'A and B form an ideal solution: p_A = 40, p_B = 30 mm Hg. Find the total vapour pressure.'
    answer: '70'
    check: 40+30
    difficulty: 1
    hints:
    - Dalton.
    - Add.
    solution: 70 mm Hg.
  - prompt: 'Henry''s law relates gas solubility to:'
    options:
    - the partial pressure of the gas
    - the colour of the liquid
    - the volume of the container
    - the boiling point
    answer: the partial pressure of the gas
    difficulty: 1
    hints:
    - p = K_H x.
    - Fizzy drinks.
    solution: The partial pressure of the gas.
  - prompt: 'A mixture that boils at constant temperature with unchanged composition is a(n):'
    options:
    - azeotrope
    - ideal solution
    - colloid
    - suspension
    answer: azeotrope
    difficulty: 2
    hints:
    - Can't separate by distillation.
    - Ethanol–water at 95%.
    solution: An azeotrope.
- code: cbse12c.sol.colligative
  title: Colligative properties
  after:
  - cbse12c.sol.conc
  notes: |
    Colligative properties depend on the number of solute particles: relative lowering of vapour pressure (= x_solute),
    elevation of boiling point ΔT_b = K_b m, depression of freezing point ΔT_f = K_f m, osmotic pressure π = CRT (reverse
    osmosis for desalination; isotonic, hypertonic, hypotonic). Molar mass from colligative data. Abnormal molar masses:
    van 't Hoff factor i (dissociation i > 1, association i < 1); ΔT_f = iK_f m.
  explanations:
    text: Colligative properties depend only on how many solute particles are dissolved, not what they are. Dissolving something raises the boiling point, lowers the freezing point and creates osmotic pressure. Salts that split into ions have a bigger effect.
    visual: 'Picture salt spread on icy roads: the dissolved ions lower the freezing point of water, so the ice melts even below 0 °C.'
    step_by_step: 'Step 1: Find the molality m. Step 2: Find i (number of particles per formula unit). Step 3: ΔT = iKm. Step 4: Osmotic pressure π = iCRT.'
    real_world: Hospitals use saline that is isotonic with blood (0.9% NaCl) so cells neither swell nor shrink.
  picture:
    kind: flow
    steps:
    - Add solute
    - Fewer solvent molecules at the surface
    - Vapour pressure falls
    - Boiling point rises, freezing point falls
    alt: Why dissolving a solute raises the boiling point and lowers the freezing point.
  items:
  - prompt: Kf of water is 1.86 K kg/mol. Find ΔTf (K) for a 1 m glucose solution, to two decimals.
    answer: '1.86'
    check: Rational(186,100)
    difficulty: 1
    hints:
    - i = 1.
    - 1.86 × 1.
    solution: 1.86 K.
  - prompt: Find ΔTf (K) for a 1 m NaCl solution (assume full dissociation), to two decimals.
    answer: '3.72'
    check: 2*Rational(186,100)
    difficulty: 2
    hints:
    - i = 2.
    - 2 × 1.86.
    solution: 3.72 K.
    mistakes:
      '1.86': c12c_vhf
  - prompt: What is the van 't Hoff factor for CaCl₂ assuming full dissociation?
    answer: '3'
    check: 1+2
    difficulty: 1
    hints:
    - Ca²⁺ + 2Cl⁻.
    - Three ions.
    solution: '3.'
  - prompt: Kb of water is 0.52 K kg/mol. Find ΔTb (K) for a 2 m glucose solution, to two decimals.
    answer: '1.04'
    check: Rational(52,100)*2
    difficulty: 1
    hints:
    - Kb m.
    - 0.52 × 2.
    solution: 1.04 K.
  - prompt: 'Removing salt from sea water by applying pressure is called:'
    options:
    - reverse osmosis
    - osmosis
    - distillation
    - diffusion
    answer: reverse osmosis
    difficulty: 1
    hints:
    - Push water through a membrane.
    - Opposite way.
    solution: Reverse osmosis.
  - prompt: 'A cell placed in a hypertonic solution:'
    options:
    - shrinks
    - swells
    - stays the same
    - bursts
    answer: shrinks
    difficulty: 2
    hints:
    - Water moves out.
    - Higher concentration outside.
    solution: Shrinks.
