# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 1. Format: content/README.md.
subject: cbse12-chem
chapter: 1
title: Solutions
tips:
  c12c_vhf: 'van ''t Hoff factor i: NaCl gives 2 ions (i ≈ 2), CaCl₂ gives 3 (i ≈ 3), glucose doesn''t split (i = 1).'
  c12c_raoult: 'Raoult''s law: partial vapour pressure = mole fraction × pure vapour pressure.'
  c12_azeotrope: "Such a mixture can't be separated by distillation because vapour and liquid have the same make-up."
  c12_boiling: "ΔTb = Kb × m."
  c12_freezing: "ΔTf = Kf × m. Glucose does not dissociate."
  c12_henry: "Soda fizzes when opened: the pressure of CO₂ above it drops."
  c12_hypertonic: "Water moves out of the cell towards the more concentrated solution."
  c12_molality: "Molality = moles ÷ kg of solvent. 250 g = 0.25 kg."
  c12_mole_fraction: "x_A = moles of A ÷ total moles."
  c12_raoult_total: "For an ideal mixture, total pressure = sum of the partial pressures."
  c12_reverse_osmosis: "Normal osmosis moves water into the salty side. Pressure pushes it the other way."
  c12_vant_hoff: "Count the ions: CaCl₂ → Ca²⁺ + 2Cl⁻."
  c12c1_conc: Molality = moles of solute per kg of solvent; molarity = moles per litre of solution; mole fraction = moles of one part over total moles.
  c12c1_raoult: 'Raoult: partial pressure = mole fraction × pure vapour pressure. Total = sum of partial pressures.'
  c12c1_coll: 'Colligative effects count particles: ΔT = i × K × m. Salts split into ions, so i > 1.'
  c12c1_temp: Heating changes a liquid's volume but not its mass. Which unit divides only by a mass?
  c12c1_ions: 'Write each one splitting in water and count the particles: the more particles, the bigger the drop.'
concepts:
- code: cbse12c.sol.conc
  title: Concentration, solubility and Raoult's law
  notes: |
    Types of solutions; concentration: mass %, ppm, mole fraction, molarity, molality. Solubility of solids (temperature) and
    gases: Henry's law p = K_H x (scuba diving, soft drinks). Vapour pressure of solutions: Raoult's law p₁ = x₁p₁°; ideal
    solutions (ΔH_mix = 0, ΔV_mix = 0); non-ideal: positive deviation (ethanol + acetone), negative deviation (chloroform +
    acetone, HNO₃ + water); azeotropes (minimum and maximum boiling).
  explanations:
    text: A solution's concentration can be given in several ways, like molarity or molality. Raoult's law says each liquid in a mixture contributes vapour pressure in proportion to its mole fraction. Henry's law says more gas dissolves at higher pressure.
    visual: 'Picture a fizzy drink: sealed under pressure, lots of CO₂ is dissolved (Henry''s law). Open it, the pressure drops, and bubbles escape.'
    step_by_step: 'Step 1: Find moles of each component. Step 2: Mole fraction x = moles ÷ total moles. Step 3: Raoult: p = x p°. Step 4: Total pressure = sum of partial pressures.'
    real_world: Scuba divers rise slowly so dissolved nitrogen leaves their blood gently, avoiding 'the bends' (Henry's law).
  picture:
    kind: compare
    columns:
    - title: Deviation
      points:
      - positive
      - negative
    - title: Forces between unlike molecules
      points:
      - weaker
      - stronger
    - title: Example
      points:
      - ethanol + acetone
      - chloroform + acetone
    alt: Positive and negative deviations from Raoult's law.
  activity:
    type: formula
    prompt: Molarity M = moles of solute ÷ litres of solution. Moles = mass ÷ molar mass.
    inputs:
    - name: m
      label: Mass of solute
      min: 1
      max: 100
      step: 1
      start: 1
      unit: g
    - name: mm
      label: Molar mass
      min: 10
      max: 200
      step: 10
      start: 10
      unit: g/mol
    - name: v
      label: Volume of solution
      min: 50
      max: 1000
      step: 50
      start: 1000
      unit: mL
    outputs:
    - name: n
      label: Moles
      expr: m/mm
      unit: mol
      places: 3
    - name: mol
      label: Molarity
      expr: (m/mm)/(v/1000)
      unit: M
      places: 3
    goals:
    - prompt: Make 250 mL of 0.5 M NaOH (molar mass 40).
      want:
        mm: 40
        v: 250
        mol: 0.5
      mistakes:
      - when:
          mm: 40
          v: 250
          m: 20
        say: '20 g makes 1 L of 0.5 M. You only want 250 mL: a quarter of that.'
      - when:
          mm: 40
          v: 250
          m:
          - 1
          - 4
        say: 'Too dilute: you need 0.5 × 0.25 = 0.125 mol.'
    - prompt: Dissolve 18 g of glucose (molar mass 180) to make a 0.2 M solution. Set the volume.
      want:
        m: 18
        mm: 180
        mol: 0.2
      mistakes:
      - when:
          m: 18
          mm: 180
          v: 200
        say: 0.2 M doesn't mean 200 mL. 0.1 mol ÷ 0.2 mol/L = 0.5 L.
      - when:
          m: 18
          mm: 180
          v: 1000
        say: In 1 L it's only 0.1 M. Less water makes it stronger.
    - prompt: Make a 1 M solution of NaCl (molar mass about 60 here) in 500 mL.
      want:
        mm: 60
        v: 500
        mol: 1
      mistakes:
      - when:
          mm: 60
          v: 500
          m: 60
        say: 60 g is a mole, enough for 1 L of 1 M. Half a litre needs half a mole.
  lesson:
    - teach: 'A solution is a uniform mixture of solute and solvent. Ways to give concentration: mass %, ppm (for traces), mole fraction x (moles of one part ÷ total moles), molarity M (mol per litre of solution) and molality m (mol per kg of solvent). Molality does not change with temperature.'
      check:
        prompt: Why is molality preferred over molarity when temperature changes?
        options:
        - it uses mass of solvent, which does not change with temperature
        - it is always larger
        - it uses volume
        answer: it uses mass of solvent, which does not change with temperature
        why: Volume expands with heat; mass does not.
      ways:
      - style: visual
        teach: Four ways of giving concentration, and what each one divides by.
        picture:
          kind: compare
          columns:
          - title: Mole fraction x
            points:
            - moles of one part
            - ÷ total moles
            - no unit
          - title: Molarity M
            points:
            - moles of solute
            - ÷ litres of solution
            - changes with temperature
          - title: Molality m
            points:
            - moles of solute
            - ÷ kg of solvent
            - same at any temperature
          alt: Mole fraction is moles of one part divided by total moles and has no unit. Molarity is moles of solute per litre of solution and changes with temperature. Molality is moles of solute per kilogram of solvent and does not change with temperature.
      - style: step_by_step
        teach: '3 mol of solute in 1.5 kg of water. Step 1: Molality divides by kilograms of solvent, not litres of solution. Step 2: m = 3 ÷ 1.5. Step 3: m = 2 mol/kg. Step 4: Warming the solution changes its volume but not its mass, so this number stays put.'
    - teach: 'Gas solubility: Henry''s law p = K_H x: the higher the gas''s partial pressure, the more dissolves. Soft drinks are bottled under CO₂ pressure; divers risk ''bends'' when dissolved nitrogen comes out on rising too fast. Gases dissolve less in warm water.'
      check:
        prompt: 'Opening a soda bottle makes it fizz because:'
        options:
        - the CO₂ pressure above it drops, so less gas stays dissolved
        - it gets colder
        - sugar reacts with air
        answer: the CO₂ pressure above it drops, so less gas stays dissolved
        why: 'Henry''s law: lower p, lower solubility.'
      ways:
      - style: visual
        teach: What raises and lowers the amount of gas that dissolves in a liquid.
        picture:
          kind: compare
          columns:
          - title: More gas dissolves
            points:
            - Higher partial pressure of the gas
            - Colder liquid
          - title: Less gas dissolves
            points:
            - Pressure released (bottle opened)
            - Warmer liquid
          alt: More gas dissolves when its partial pressure is higher or the liquid is colder. Less dissolves when the pressure is released, as when a bottle is opened, or when the liquid is warmer.
      - style: real_world
        teach: 'At high mountains the air pressure is low, so less oxygen dissolves in the blood. Climbers can feel weak and confused: Henry''s law at work inside the body. Bottled oxygen raises the oxygen''s partial pressure again.'
    - teach: 'Raoult''s law: in a solution of volatile liquids, p₁ = x₁p₁°. Ideal solutions obey it (ΔH_mix = 0, ΔV_mix = 0). Positive deviation (ethanol + acetone): weaker attractions, higher vapour pressure. Negative deviation (chloroform + acetone): stronger attractions, lower vapour pressure. Large deviations give azeotropes.'
      picture:
        kind: compare
        columns:
        - title: Positive deviation
          points:
          - A–B weaker than A–A, B–B
          - p higher than Raoult
          - ethanol + acetone
        - title: Negative deviation
          points:
          - A–B stronger
          - p lower than Raoult
          - chloroform + acetone
        alt: Positive and negative deviations from Raoult's law compared.
      check:
        prompt: 'Mixing two liquids releases heat. The deviation is likely:'
        options:
        - negative
        - positive
        - none
        answer: negative
        why: Heat release means stronger new attractions.
      ways:
      - style: real_world
        teach: 'Nail-polish remover (acetone) mixed with a little chloroform smells weaker than you''d expect. The two molecules grab each other through hydrogen bonds, so fewer escape into the air: a negative deviation from Raoult''s law.'
      - style: step_by_step
        teach: 'Liquids P and Q, pure vapour pressures 200 and 50 mm Hg, x_P = 0.3. Step 1: p_P = 0.3 × 200 = 60. Step 2: x_Q = 0.7, so p_Q = 0.7 × 50 = 35. Step 3: Total = 95 mm Hg if the mixture is ideal. Step 4: A measured value above 95 would mean positive deviation.'
  items:
  - prompt: A solution has 2 mol of A and 3 mol of B. Find the mole fraction of A as a fraction.
    answer: 2/5
    check: Rational(2,5)
    difficulty: 1
    hints:
    - 2/(2 + 3).
    - 2/5.
    solution: "x_A = n_A/(n_A + n_B) = 2/(2 + 3) = 2/5."
    mistakes: {"2/3": "c12_mole_fraction", "3/5": "c12_mole_fraction"}
  - prompt: Pure A has vapour pressure 100 mm Hg; x_A = 0.4. Find its partial pressure (mm Hg).
    answer: '40'
    check: Rational(4,10)*100
    difficulty: 1
    hints:
    - p = x p°.
    - 0.4 × 100.
    solution: "Raoult's law: p_A = x_A p°_A = 0.4 × 100 = 40 mm Hg."
    mistakes:
      '60': c12c_raoult
  - prompt: Find the molality of 0.5 mol of solute in 250 g of water.
    answer: '2'
    check: Rational(1,2)/Rational(1,4)
    difficulty: 1
    hints:
    - mol/kg.
    - 0.5/0.25.
    solution: "m = moles of solute/kg of solvent = 0.5/0.250 = 2 mol/kg (2 m)."
    mistakes: {"0.125": "c12_molality", "0.5": "c12_molality"}
  - prompt: 'A and B form an ideal solution: p_A = 40, p_B = 30 mm Hg. Find the total vapour pressure.'
    answer: '70'
    check: 40+30
    difficulty: 1
    hints:
    - Dalton.
    - Add.
    solution: "Dalton's law: p_total = p_A + p_B = 40 + 30 = 70 mm Hg."
    mistakes: {"10": "c12_raoult_total", "35": "c12_raoult_total"}
  - prompt: 'Henry''s law relates gas solubility to:'
    options:
    - the partial pressure of the gas
    - the colour of the liquid
    - the volume of the container
    - the boiling point
    answer: the partial pressure of the gas
    difficulty: 1
    hints:
    - p = K_H x.
    - Fizzy drinks.
    solution: The partial pressure of the gas.
    mistakes: {"the colour of the liquid": "c12_henry", "the volume of the container": "c12_henry", "the boiling point": "c12_henry"}
  - prompt: 'A mixture that boils at constant temperature with unchanged composition is a(n):'
    options:
    - azeotrope
    - ideal solution
    - colloid
    - suspension
    answer: azeotrope
    difficulty: 2
    hints:
    - Can't separate by distillation.
    - Ethanol–water at 95%.
    solution: "An azeotrope boils with vapour of the same composition as the liquid, so distillation cannot separate it."
    mistakes: {"ideal solution": "c12_azeotrope", "colloid": "c12_azeotrope", "suspension": "c12_azeotrope"}
  - prompt: A solution has 1 mol of A and 4 mol of B. Mole fraction of B as a fraction?
    answer: 4/5
    check: Rational(4,5)
    difficulty: 1
    hints:
    - Total moles = 5.
    - Moles of B ÷ total.
    solution: 'Step 1: 4/5. Step 2: 4/5.'
    mistakes:
      1/5: c12c1_conc
      1/4: c12c1_conc
  - prompt: Find the molality of 1 mol of solute in 500 g of water.
    answer: '2'
    check: 1/Rational(1,2)
    difficulty: 1
    hints:
    - Convert grams to kilograms.
    - 1 mol ÷ 0.5 kg.
    solution: 'Step 1: 0.5 kg. Step 2: 2 mol/kg.'
    mistakes:
      1/2: c12c1_conc
      '500': c12c1_conc
  - prompt: Find the molarity of 0.2 mol of NaCl in 500 mL of solution, as a fraction.
    answer: 2/5
    check: Rational(2,10)/Rational(1,2)
    difficulty: 1
    hints:
    - Convert mL to L.
    - 0.2 ÷ 0.5.
    solution: 'Step 1: 0.5 L. Step 2: 0.4 = 2/5 M.'
    mistakes:
      1/10: c12c1_conc
      '100': c12c1_conc
  - prompt: 'Pure A: 120 mm Hg, x_A = 0.25. Pure B: 80 mm Hg. Find the total vapour pressure (mm Hg).'
    answer: '90'
    check: 120*Rational(1,4) + 80*Rational(3,4)
    difficulty: 2
    hints:
    - x_B = 0.75.
    - p = x_Ap_A° + x_Bp_B°.
    solution: 'Step 1: 30 + 60. Step 2: 90 mm Hg.'
    mistakes:
      '200': c12c1_raoult
      '100': c12c1_raoult
  - prompt: A 5 g sample in 1,000,000 g of water. Concentration in ppm?
    answer: '5'
    check: 5/10**6*10**6
    difficulty: 2
    hints:
    - ppm = parts per million.
    - 5 g in 10⁶ g.
    solution: 'Step 1: 5/10⁶. Step 2: 5 ppm.'
    mistakes:
      '5000': c12c1_conc
      1/2: c12c1_conc
  - prompt: 10 g of glucose is dissolved in 90 g of water. Mass percentage of glucose?
    answer: '10'
    check: 10/100*100
    difficulty: 2
    hints:
    - Total mass is 100 g.
    - Solute ÷ total × 100.
    solution: 'Step 1: 10/100. Step 2: 10%.'
    mistakes:
      100/9: c12c1_conc
      '9': c12c1_conc
  - prompt: 'Ethanol and water form a solution whose boiling point is lower than either liquid. It shows:'
    options:
    - "positive deviation (minimum-boiling azeotrope)"
    - "negative deviation (maximum-boiling azeotrope)"
    - "ideal behaviour, obeying Raoult's law exactly"
    answer: positive deviation (minimum-boiling azeotrope)
    difficulty: 2
    hints:
    - Lower boiling means higher vapour pressure.
    - Higher than Raoult predicts.
    solution: 'Step 1: higher vapour pressure. Step 2: positive deviation, minimum-boiling azeotrope.'
    mistakes:
      "negative deviation (maximum-boiling azeotrope)": c12c1_raoult
      "ideal behaviour, obeying Raoult's law exactly": c12c1_raoult
  - prompt: 'For an ideal solution, ΔV_mix equals:'
    answer: '0'
    check: '0'
    difficulty: 3
    hints:
    - Ideal means no change on mixing.
    - Volumes simply add.
    solution: 'Step 1: no expansion or contraction. Step 2: 0.'
    mistakes:
      '1': c12c1_raoult
      '-1': c12c1_raoult
  - prompt: Why do aquatic animals find warm water uncomfortable?
    options:
    - "less oxygen dissolves in warm water"
    - "warm water holds more dissolved salt"
    - "warm water is heavier than cold water"
    answer: less oxygen dissolves in warm water
    difficulty: 3
    hints:
    - Gas solubility depends on temperature.
    - Dissolving a gas is usually exothermic.
    solution: 'Step 1: solubility of gases falls with temperature. Step 2: less O₂ for animals.'
    mistakes:
      "warm water holds more dissolved salt": c12c1_conc
      "warm water is heavier than cold water": c12c1_conc
  - prompt: 'Assertion (A): Molality of a solution does not change when it is heated.

      Reason (R): Molality is defined using the mass of the solvent, and mass does not depend on temperature.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Heating changes volume but not mass. Molality uses kilograms of solvent, so it stays the same. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Scuba divers breathing compressed air may get the ''bends'' if they rise too fast. What causes it?'
    options:
    - "Nitrogen dissolved under high pressure comes out as bubbles in the blood"
    - "Oxygen dissolves more and more in the blood as the diver rises"
    - "Water pressure crushes the lungs as the diver rises to the surface"
    answer: Nitrogen dissolved under high pressure comes out as bubbles in the blood
    hints:
    - Deep underwater the pressure is high, so more gas dissolves.
    - What happens to dissolved gas when pressure drops fast?
    solution: By Henry's law, high pressure deep down dissolves more nitrogen in the blood. Rising quickly lowers the pressure and the extra nitrogen forms bubbles.
    mistakes:
      "Oxygen dissolves more and more in the blood as the diver rises": c12_henry
      "Water pressure crushes the lungs as the diver rises to the surface": c12_henry
    exam: case
    difficulty: 2
  - prompt: A lab assistant must make a solution whose concentration stays the same in a hot room and a cold room. Which unit should the label use?
    options:
    - Molality
    - Molarity
    - Grams per litre
    answer: Molality
    hints:
    - 'Which quantity changes when a liquid warms: its mass or its volume?'
    - Pick the unit that does not divide by volume.
    solution: Volume expands on warming, so molarity and g/L change. Molality uses the mass of solvent, which stays fixed.
    mistakes:
      Molarity: c12c1_temp
      Grams per litre: c12c1_temp
    exam: competency
    difficulty: 2
- code: cbse12c.sol.colligative
  title: Colligative properties
  after:
  - cbse12c.sol.conc
  notes: |
    Colligative properties depend on the number of solute particles: relative lowering of vapour pressure (= x_solute),
    elevation of boiling point ΔT_b = K_b m, depression of freezing point ΔT_f = K_f m, osmotic pressure π = CRT (reverse
    osmosis for desalination; isotonic, hypertonic, hypotonic). Molar mass from colligative data. Abnormal molar masses:
    van 't Hoff factor i (dissociation i > 1, association i < 1); ΔT_f = iK_f m.
  explanations:
    text: Colligative properties depend only on how many solute particles are dissolved, not what they are. Dissolving something raises the boiling point, lowers the freezing point and creates osmotic pressure. Salts that split into ions have a bigger effect.
    visual: 'Picture salt spread on icy roads: the dissolved ions lower the freezing point of water, so the ice melts even below 0 °C.'
    step_by_step: 'Step 1: Find the molality m. Step 2: Find i (number of particles per formula unit). Step 3: ΔT = iKm. Step 4: Osmotic pressure π = iCRT.'
    real_world: Hospitals use saline that is isotonic with blood (0.9% NaCl) so cells neither swell nor shrink.
  picture:
    kind: flow
    steps:
    - Add solute
    - Fewer solvent molecules at the surface
    - Vapour pressure falls
    - Boiling point rises, freezing point falls
    alt: Why dissolving a solute raises the boiling point and lowers the freezing point.
  activity:
    type: formula
    prompt: Freezing point depression ΔT_f = i × K_f × m. For water K_f = 1.86 K kg/mol. i counts the particles each formula unit gives.
    inputs:
    - name: i
      label: van 't Hoff factor i
      min: 1
      max: 3
      step: 1
      start: 1
    - name: m
      label: Molality m
      min: 0.1
      max: 2
      step: 0.1
      start: 0.1
      unit: mol/kg
    outputs:
    - name: dt
      label: Freezing point lowered by
      expr: i*1.86*m
      unit: K
      places: 2
    - name: fp
      label: New freezing point
      expr: -i*1.86*m
      unit: °C
      places: 2
    goals:
    - prompt: Use glucose (i = 1) to lower water's freezing point by 1.86 °C.
      want:
        i: 1
        dt: 1.86
      mistakes:
      - when:
          i: 1
          m:
          - 0.1
          - 0.9
        say: 'Not enough solute: ΔT_f = 1.86 × m, so m = 1.'
    - prompt: Use NaCl to freeze water at −3.72 °C.
      want:
        i: 2
        fp: -3.72
      mistakes:
      - when:
          i: 1
          m: 2
        say: 'That''s 2 molal of something that doesn''t split. NaCl splits into Na⁺ and Cl⁻: i = 2.'
      - when:
          i: 3
        say: NaCl gives two ions, not three.
    - prompt: Use CaCl₂ to lower the freezing point by 5.58 °C.
      want:
        i: 3
        dt: 5.58
      mistakes:
      - when:
          i: 2
        say: 'CaCl₂ gives three ions: one Ca²⁺ and two Cl⁻. i = 3.'
      - when:
          i: 3
          m: 2
        say: 'Too much: 3 × 1.86 × m = 5.58 means m = 1.'
  lesson:
    - teach: 'Colligative properties depend only on the number of solute particles, not on what they are. A non-volatile solute lowers vapour pressure: relative lowering (p° − p)/p° = x_solute.'
      check:
        prompt: 'Equal moles of glucose and urea in the same water lower its vapour pressure:'
        options:
        - equally
        - more for glucose
        - more for urea
        answer: equally
        why: Same number of particles.
      ways:
      - style: visual
        teach: 'Why a non-volatile solute lowers vapour pressure: it takes up room at the surface.'
        picture:
          kind: compare
          columns:
          - title: Pure solvent
            points:
            - Whole surface is solvent
            - Many molecules escape
            - Higher vapour pressure
          - title: Solution
            points:
            - Some surface taken by solute
            - Fewer solvent molecules escape
            - Lower vapour pressure
          alt: At the surface of a pure solvent every spot is solvent, so many molecules escape and vapour pressure is higher. In a solution some surface spots are taken by solute, fewer solvent molecules escape and vapour pressure is lower.
      - style: step_by_step
        teach: 'Solute mole fraction 0.02, pure solvent at 50 mm Hg. Step 1: Relative lowering = x_solute = 0.02. Step 2: Lowering = 0.02 × 50 = 1 mm Hg. Step 3: New vapour pressure = 49 mm Hg. Step 4: Only the number of solute particles mattered, not what they are.'
    - teach: 'Boiling point rises: ΔT_b = K_b m (water K_b = 0.52 K kg/mol). Freezing point falls: ΔT_f = K_f m (water K_f = 1.86). Osmotic pressure π = CRT: solvent moves through a semipermeable membrane towards the more concentrated side; reverse osmosis pushes it the other way to purify water.'
      picture:
        kind: flow
        steps:
        - Add solute particles
        - Vapour pressure falls
        - Boiling point rises
        - Freezing point falls
        - Osmotic pressure appears
        alt: How adding solute particles changes a solvent's properties.
      check:
        prompt: Why is salt spread on icy roads?
        options:
        - it lowers the freezing point of water
        - it raises the temperature of the air
        - it makes ice harder
        answer: it lowers the freezing point of water
        why: Salt water stays liquid below 0 °C.
      ways:
      - style: real_world
        teach: 'In cold places, salt is spread on icy roads. The dissolved ions lower water''s freezing point, so ice melts even below 0 °C. Car radiators use ethylene glycol for the same reason: the coolant won''t freeze in winter.'
      - style: step_by_step
        teach: 'A 0.5 m urea solution in water (K_b = 0.52). Step 1: Urea does not split, so i = 1. Step 2: ΔT_b = 0.52 × 0.5 = 0.26 K. Step 3: It boils at 100.26 °C. Step 4: Doubling the molality would double the rise.'
    - teach: 'Electrolytes break into ions, so they give more particles than expected. The van ''t Hoff factor i counts this: NaCl → i ≈ 2, CaCl₂ → i ≈ 3; association (like acetic acid in benzene) gives i < 1. Then ΔT_f = iK_f m.'
      check:
        prompt: i for K₂SO₄ assuming full dissociation?
        options:
        - '3'
        - '2'
        - '7'
        answer: '3'
        why: 2K⁺ + SO₄²⁻.
      ways:
      - style: visual
        teach: 'Counting particles: each formula unit can give a different number in water.'
        picture:
          kind: bars
          unit: particles per formula unit
          bars:
          - label: Urea
            value: 1
          - label: KCl
            value: 2
          - label: Na₂SO₄
            value: 3
          - label: AlCl₃
            value: 4
          alt: Urea gives 1 particle per formula unit, KCl gives 2, sodium sulphate gives 3 and aluminium chloride gives 4, so their effects on freezing point grow in that order.
      - style: real_world
        teach: Count people, not groups. If 10 families arrive and each family splits into 3 people at the door, the hall feels 30 arrivals. Colligative properties 'feel' the people (ions), so salts act stronger than their molality suggests.
  items:
  - prompt: Kf of water is 1.86 K kg/mol. Find ΔTf (K) for a 1 m glucose solution, to two decimals.
    answer: '1.86'
    check: Rational(186,100)
    difficulty: 1
    hints:
    - i = 1.
    - 1.86 × 1.
    solution: "Glucose does not dissociate (i = 1): ΔTf = iKf m = 1 × 1.86 × 1 = 1.86 K."
    mistakes: {"3.72": "c12_freezing", "0.93": "c12_freezing"}
  - prompt: Find ΔTf (K) for a 1 m NaCl solution (assume full dissociation), to two decimals.
    answer: '3.72'
    check: 2*Rational(186,100)
    difficulty: 2
    hints:
    - i = 2.
    - 2 × 1.86.
    solution: "NaCl → Na⁺ + Cl⁻, so i = 2: ΔTf = 2 × 1.86 × 1 = 3.72 K."
    mistakes:
      '1.86': c12c_vhf
  - prompt: What is the van 't Hoff factor for CaCl₂ assuming full dissociation?
    answer: '3'
    check: 1+2
    difficulty: 1
    hints:
    - Ca²⁺ + 2Cl⁻.
    - Three ions.
    solution: "CaCl₂ → Ca²⁺ + 2Cl⁻ gives 3 ions per formula unit, so i = 3."
    mistakes: {"2": "c12_vant_hoff", "1": "c12_vant_hoff", "4": "c12_vant_hoff"}
  - prompt: Kb of water is 0.52 K kg/mol. Find ΔTb (K) for a 2 m glucose solution, to two decimals.
    answer: '1.04'
    check: Rational(52,100)*2
    difficulty: 1
    hints:
    - Kb m.
    - 0.52 × 2.
    solution: "ΔTb = Kb m = 0.52 × 2 = 1.04 K."
    mistakes: {"0.52": "c12_boiling", "0.26": "c12_boiling"}
  - prompt: 'Removing salt from sea water by applying pressure is called:'
    options:
    - reverse osmosis
    - osmosis
    - distillation
    - diffusion
    answer: reverse osmosis
    difficulty: 1
    hints:
    - Push water through a membrane.
    - Opposite way.
    solution: "Pressure above the osmotic pressure pushes water out through the membrane, the reverse of normal flow: reverse osmosis."
    mistakes: {"osmosis": "c12_reverse_osmosis", "distillation": "c12_reverse_osmosis", "diffusion": "c12_reverse_osmosis"}
  - prompt: 'A cell placed in a hypertonic solution:'
    options:
    - shrinks
    - swells
    - stays the same
    - bursts
    answer: shrinks
    difficulty: 2
    hints:
    - Water moves out.
    - Higher concentration outside.
    solution: "The outside is more concentrated, so water leaves the cell by osmosis and the cell shrinks."
    mistakes: {"swells": "c12_hypertonic", "stays the same": "c12_hypertonic", "bursts": "c12_hypertonic"}
  - prompt: Find ΔTf (K) for a 2 m glucose solution in water (Kf = 1.86), as a fraction.
    answer: 93/25
    check: 2*Rational(186,100)
    difficulty: 1
    hints:
    - ΔTf = Kf m.
    - 1.86 × 2.
    solution: 'Step 1: 3.72 K. Step 2: 93/25.'
    mistakes:
      93/50: c12c1_coll
      '0': c12c1_coll
  - prompt: van 't Hoff factor for MgCl₂ assuming full dissociation?
    answer: '3'
    check: 1 + 2
    difficulty: 1
    hints:
    - Count the ions.
    - Mg²⁺ + 2Cl⁻.
    solution: 'Step 1: 1 + 2 ions. Step 2: i = 3.'
    mistakes:
      '2': c12c1_coll
      '1': c12c1_coll
  - prompt: Find ΔTb (K) for a 1 m NaCl solution (Kb = 0.52, full dissociation), as a fraction.
    answer: 26/25
    check: 2*Rational(52,100)*1
    difficulty: 1
    hints:
    - i = 2.
    - ΔTb = iKb m.
    solution: 'Step 1: 2 × 0.52. Step 2: 1.04 K = 26/25.'
    mistakes:
      13/25: c12c1_coll
      52/25: c12c1_coll
  - prompt: Mole fraction of solute is 0.05. Relative lowering of vapour pressure, as a fraction?
    answer: 1/20
    check: Rational(5,100)
    difficulty: 2
    hints:
    - Relative lowering equals x_solute.
    - 0.05.
    solution: 'Step 1: (p° − p)/p° = x₂. Step 2: 1/20.'
    mistakes:
      19/20: c12c1_coll
      '5': c12c1_coll
  - prompt: Pure water's vapour pressure is 100 mm Hg. A solution has x_solute = 0.1. Its vapour pressure (mm Hg)?
    answer: '90'
    check: 100*(1 - Rational(1,10))
    difficulty: 2
    hints:
    - p = x_solvent × p°.
    - x_solvent = 0.9.
    solution: 'Step 1: 0.9 × 100. Step 2: 90 mm Hg.'
    mistakes:
      '10': c12c1_coll
      '110': c12c1_coll
  - prompt: Osmotic pressure (atm) of a 0.1 M solution at 300 K, with R = 0.082 L atm/(K mol), as a fraction?
    answer: 123/50
    check: Rational(1,10)*Rational(82,1000)*300
    difficulty: 2
    hints:
    - π = CRT.
    - 0.1 × 0.082 × 300.
    solution: 'Step 1: 2.46 atm. Step 2: 123/50.'
    mistakes:
      41/50: c12c1_coll
      123/5: c12c1_coll
  - prompt: 'Which solution has the lowest freezing point: 0.1 m glucose, 0.1 m NaCl or 0.1 m CaCl₂?'
    options:
    - 0.1 m CaCl₂
    - 0.1 m NaCl
    - 0.1 m glucose
    answer: 0.1 m CaCl₂
    difficulty: 2
    hints:
    - Most particles, biggest drop.
    - 'Compare i: 1, 2, 3.'
    solution: 'Step 1: i(CaCl₂) = 3 is largest. Step 2: largest ΔTf, lowest freezing point.'
    mistakes:
      0.1 m NaCl: c12c1_coll
      0.1 m glucose: c12c1_coll
  - prompt: 1 g of a non-electrolyte in 100 g of water lowers the freezing point by 0.186 K (Kf = 1.86). Find its molar mass (g/mol).
    answer: '100'
    check: Rational(186,100)*1*1000/(Rational(186,1000)*100)
    difficulty: 3
    hints:
    - m = ΔTf/Kf = 0.1 mol/kg.
    - Moles = 0.1 × 0.1 kg = 0.01 mol.
    solution: 'Step 1: 0.01 mol in 1 g. Step 2: M = 100 g/mol.'
    mistakes:
      '10': c12c1_coll
      '1000': c12c1_coll
  - prompt: 'Acetic acid forms dimers in benzene. Its van ''t Hoff factor is:'
    options:
    - less than 1
    - exactly 2
    - greater than 1
    answer: less than 1
    difficulty: 3
    hints:
    - Two molecules join into one particle.
    - Fewer particles than expected.
    solution: 'Step 1: association. Step 2: i < 1 (about 1/2).'
    mistakes:
      exactly 2: c12c1_coll
      greater than 1: c12c1_coll
  - prompt: 'Assertion (A): A 0.1 m KCl solution has a lower freezing point than a 0.1 m glucose solution.

      Reason (R): Colligative properties depend on the number of solute particles in the solution.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: KCl splits into two ions, giving about twice the particles of glucose, so its freezing point falls more. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A hospital drip must have the same osmotic pressure as blood. What happens to red blood cells if pure water is dripped instead?'
    options:
    - They swell and may burst
    - They shrink
    - Nothing changes
    answer: They swell and may burst
    hints:
    - 'Which side is more concentrated: the cell or pure water?'
    - Water moves towards the more concentrated side.
    solution: Pure water is hypotonic to the cell. Water moves into the cell by osmosis, so the cell swells and may burst.
    mistakes:
      They shrink: c12_hypertonic
      Nothing changes: c12c1_coll
    exam: case
    difficulty: 2
  - prompt: A town must choose the best de-icer per mole spread on the roads. Which gives the biggest freezing point drop?
    options:
    - CaCl₂
    - NaCl
    - Sugar
    answer: CaCl₂
    hints:
    - Count the ions each one gives.
    - More particles, bigger drop.
    solution: CaCl₂ gives 3 ions, NaCl gives 2 and sugar gives 1 particle. So CaCl₂ lowers the freezing point most per mole.
    mistakes:
      NaCl: c12c1_ions
      Sugar: c12c1_ions
    exam: competency
    difficulty: 2
