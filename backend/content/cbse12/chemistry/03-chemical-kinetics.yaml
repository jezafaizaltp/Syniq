# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse12-chem
chapter: 3
title: Chemical Kinetics
tips:
  c12c_half: For a first-order reaction t½ = 0.693/k, independent of starting concentration.
  c12c_order: Order comes from experiment (the rate law); molecularity is the number of molecules in one elementary step.
concepts:
- code: cbse12c.kin.rate
  title: Rate, rate law and order
  notes: |
    Rate of reaction: change in concentration per unit time; average and instantaneous; rate = −(1/a)d[A]/dt for aA. Factors:
    concentration, temperature, catalyst, surface area. Rate law rate = k[A]ˣ[B]ʸ; order x + y (experimental; can be zero or
    fractional); molecularity (elementary step; whole numbers 1–3). Units of k depend on order: zero mol L⁻¹ s⁻¹, first s⁻¹,
    second L mol⁻¹ s⁻¹. Pseudo first order (hydrolysis of ester in excess water).
  explanations:
    text: Chemical kinetics studies how fast reactions go. The rate law shows how the rate depends on concentrations; the powers in it give the reaction's order, which must be found by experiment.
    visual: 'Picture lighting a sparkler versus rusting a nail: same idea (oxidation), very different rates.'
    step_by_step: 'Step 1: Write rate = k[A]ˣ[B]ʸ. Step 2: Compare experiments where one concentration changes. Step 3: If doubling [A] doubles the rate, x = 1; if it quadruples, x = 2. Step 4: Order = x + y.'
    real_world: Refrigerators slow the chemical reactions that spoil food.
  picture:
    kind: compare
    columns:
    - title: Order
      points:
      - zero
      - first
      - second
    - title: Units of k
      points:
      - mol L⁻¹ s⁻¹
      - s⁻¹
      - L mol⁻¹ s⁻¹
    alt: Units of the rate constant for zero, first and second order reactions.
  items:
  - prompt: Rate = k[A]²[B]. What is the overall order?
    answer: '3'
    check: 2+1
    difficulty: 1
    hints:
    - 2 + 1.
    - Add powers.
    solution: '3.'
  - prompt: Rate = k[A]². If [A] is doubled, by what factor does the rate increase?
    answer: '4'
    check: 2**2
    difficulty: 1
    hints:
    - 2².
    - Square.
    solution: '4.'
  - prompt: Rate = k[A]. If [A] is tripled, by what factor does the rate increase?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - First order.
    - Directly.
    solution: '3.'
  - prompt: 'The units of k for a first-order reaction are:'
    options:
    - s⁻¹
    - mol L⁻¹ s⁻¹
    - L mol⁻¹ s⁻¹
    - no units
    answer: s⁻¹
    difficulty: 2
    hints:
    - Rate/[A].
    - mol L⁻¹ s⁻¹ ÷ mol L⁻¹.
    solution: s⁻¹.
  - prompt: 'The order of a reaction is found:'
    options:
    - by experiment
    - from the balanced equation always
    - from molecularity
    - from the colour
    answer: by experiment
    difficulty: 2
    hints:
    - Not from coefficients.
    - Rate law.
    solution: By experiment.
    mistakes:
      from the balanced equation always: c12c_order
  - prompt: 'Hydrolysis of an ester in excess water is an example of a:'
    options:
    - pseudo first-order reaction
    - zero-order reaction
    - third-order reaction
    - fast reaction
    answer: pseudo first-order reaction
    difficulty: 2
    hints:
    - Water barely changes.
    - Acts first order.
    solution: A pseudo first-order reaction.
- code: cbse12c.kin.integrated
  title: Integrated rate laws and temperature
  after:
  - cbse12c.kin.rate
  notes: |
    Zero order: [A] = [A]₀ − kt; t½ = [A]₀/(2k). First order: k = (2.303/t) log([A]₀/[A]); t½ = 0.693/k (independent of [A]₀);
    radioactive decay is first order. Temperature: rate roughly doubles per 10 °C rise; Arrhenius equation k = Ae^(−Ea/RT);
    log(k₂/k₁) = (Ea/2.303R)(1/T₁ − 1/T₂). Activation energy; catalysts lower Ea; collision theory (effective collisions,
    orientation).
  explanations:
    text: Integrated rate laws tell how concentration falls with time. For first-order reactions the half-life is constant, whatever the starting amount. Raising temperature speeds reactions because more molecules have enough energy (activation energy) to react.
    visual: 'Draw an energy hill between reactants and products: activation energy is the hill''s height. A catalyst digs a tunnel through the hill, so more molecules get across.'
    step_by_step: 'Step 1: First order: t½ = 0.693/k. Step 2: After n half-lives, amount = initial ÷ 2ⁿ. Step 3: For temperature, use the Arrhenius equation. Step 4: Catalysts lower Ea.'
    real_world: Carbon dating uses the constant half-life of carbon-14 to find the age of old objects.
  picture:
    kind: bars
    bars:
    - label: start
      value: 100
    - label: 1 t½
      value: 50
    - label: 2 t½
      value: 25
    - label: 3 t½
      value: 12.5
    alt: 'A first-order reaction: amount left after each half-life: 100, 50, 25, 12.5.'
    unit: '%'
  items:
  - prompt: A first-order reaction has k = 0.0693 s⁻¹. Find t½ (s).
    answer: '10'
    check: Rational(693,1000)/Rational(693,10000)
    difficulty: 1
    hints:
    - 0.693/k.
    - 0.693/0.0693.
    solution: 10 s.
  - prompt: Starting with 80 g, how much (g) is left after 3 half-lives?
    answer: '10'
    check: 80/2**3
    difficulty: 1
    hints:
    - 80/2³.
    - 80/8.
    solution: 10 g.
  - prompt: A substance has t½ = 5 min. How many minutes until only 1/4 is left?
    answer: '10'
    check: 2*5
    difficulty: 2
    hints:
    - Two half-lives.
    - 2 × 5.
    solution: 10 min.
  - prompt: A rate doubles for each 10 °C rise. By what factor does it increase from 20 °C to 50 °C?
    answer: '8'
    check: 2**3
    difficulty: 2
    hints:
    - Three 10° steps.
    - 2³.
    solution: 8 times.
  - prompt: 'A catalyst speeds up a reaction by:'
    options:
    - lowering the activation energy
    - raising the temperature
    - changing ΔH
    - being used up
    answer: lowering the activation energy
    difficulty: 1
    hints:
    - Another path.
    - Lower hill.
    solution: Lowering the activation energy.
  - prompt: 'The half-life of a first-order reaction:'
    options:
    - does not depend on the starting concentration
    - doubles as concentration doubles
    - is always 1 s
    - depends on the volume
    answer: does not depend on the starting concentration
    difficulty: 2
    hints:
    - t½ = 0.693/k.
    - No [A]₀.
    solution: It doesn't depend on the initial concentration.
    mistakes:
      doubles as concentration doubles: c12c_half
