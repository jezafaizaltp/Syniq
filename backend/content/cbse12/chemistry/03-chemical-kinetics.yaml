# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse12-chem
chapter: 3
title: Chemical Kinetics
tips:
  c12_rxn_order: "Overall order = sum of the powers in the rate law."
  c12c_half: For a first-order reaction t½ = 0.693/k, independent of starting concentration.
  c12c_order: Order comes from experiment (the rate law); molecularity is the number of molecules in one elementary step.
  c12_catalyst_ea: "A catalyst gives an easier path over a lower energy hill."
  c12_half_life: "t½ = 0.693/k for first order."
  c12_half_lives: "Halve three times: 80 → 40 → …"
  c12_k_units: "For first order, rate = k[A]: mol L⁻¹ s⁻¹ ÷ mol L⁻¹."
  c12_pseudo: "Water is in such excess that its concentration barely changes; only the ester matters."
  c12_rate_factor: "Rate ∝ [A]². Square the change in [A]."
  c12_temp_factor: "50 − 20 = 30 °C is three 10-degree steps. Double for each step."
concepts:
- code: cbse12c.kin.rate
  title: Rate, rate law and order
  notes: |
    Rate of reaction: change in concentration per unit time; average and instantaneous; rate = −(1/a)d[A]/dt for aA. Factors:
    concentration, temperature, catalyst, surface area. Rate law rate = k[A]ˣ[B]ʸ; order x + y (experimental; can be zero or
    fractional); molecularity (elementary step; whole numbers 1–3). Units of k depend on order: zero mol L⁻¹ s⁻¹, first s⁻¹,
    second L mol⁻¹ s⁻¹. Pseudo first order (hydrolysis of ester in excess water).
  explanations:
    text: Chemical kinetics studies how fast reactions go. The rate law shows how the rate depends on concentrations; the powers in it give the reaction's order, which must be found by experiment.
    visual: 'Picture lighting a sparkler versus rusting a nail: same idea (oxidation), very different rates.'
    step_by_step: 'Step 1: Write rate = k[A]ˣ[B]ʸ. Step 2: Compare experiments where one concentration changes. Step 3: If doubling [A] doubles the rate, x = 1; if it quadruples, x = 2. Step 4: Order = x + y.'
    real_world: Refrigerators slow the chemical reactions that spoil food.
  picture:
    kind: compare
    columns:
    - title: Order
      points:
      - zero
      - first
      - second
    - title: Units of k
      points:
      - mol L⁻¹ s⁻¹
      - s⁻¹
      - L mol⁻¹ s⁻¹
    alt: Units of the rate constant for zero, first and second order reactions.
  activity:
    type: formula
    prompt: Rate = k[A]ˣ[B]ʸ. Doubling a concentration multiplies the rate by 2 to the power of its order.
    inputs:
    - name: x
      label: Order in A, x
      min: 0
      max: 4
      step: 1
      start: 0
    - name: y
      label: Order in B, y
      min: 0
      max: 4
      step: 1
      start: 0
    outputs:
    - name: ra
      label: Rate × when [A] doubles
      expr: 2^x
    - name: rb
      label: Rate × when [B] doubles
      expr: 2^y
    - name: r3
      label: Rate × when [A] triples
      expr: 3^x
    - name: tot
      label: Overall order
      expr: x+y
    goals:
    - prompt: Doubling [A] doubles the rate; doubling [B] makes it 4 times. Set the orders.
      want:
        ra: 2
        rb: 4
      mistakes:
      - when:
          rb: 16
        say: Order 4 would make it 2⁴ = 16 times. 4 = 2², so the order in B is 2.
      - when:
          ra: 4
        say: 'Order 2 in A would make doubling give 4 times. It only doubles: order 1.'
    - prompt: Doubling [A] leaves the rate unchanged; doubling [B] doubles it.
      want:
        ra: 1
        rb: 2
      mistakes:
      - when:
          x: 1
        say: 'If doubling [A] changed nothing, 2ˣ = 1: the order in A is zero.'
    - prompt: Overall order 3, and tripling [A] makes the rate 9 times.
      want:
        r3: 9
        tot: 3
      mistakes:
      - when:
          x: 3
        say: 'Tripling would then give 27 times. 9 = 3²: order 2 in A, leaving 1 for B.'
      - when:
          r3: 9
          tot: 2
        say: Order 2 in A is right, but the overall order must be 3.
  items:
  - prompt: Rate = k[A]²[B]. What is the overall order?
    answer: '3'
    check: 2+1
    difficulty: 1
    hints:
    - 2 + 1.
    - Add powers.
    solution: '3.'
    mistakes: {"2": "c12_rxn_order", "1": "c12_rxn_order"}
  - prompt: Rate = k[A]². If [A] is doubled, by what factor does the rate increase?
    answer: '4'
    check: 2**2
    difficulty: 1
    hints:
    - 2².
    - Square.
    solution: '4.'
    mistakes: {"2": "c12_rate_factor", "8": "c12_rate_factor"}
  - prompt: Rate = k[A]. If [A] is tripled, by what factor does the rate increase?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - First order.
    - Directly.
    solution: '3.'
    mistakes: {"9": "c12_rate_factor", "1": "c12_rate_factor"}
  - prompt: 'The units of k for a first-order reaction are:'
    options:
    - s⁻¹
    - mol L⁻¹ s⁻¹
    - L mol⁻¹ s⁻¹
    - no units
    answer: s⁻¹
    difficulty: 2
    hints:
    - Rate/[A].
    - mol L⁻¹ s⁻¹ ÷ mol L⁻¹.
    solution: s⁻¹.
    mistakes: {"mol L⁻¹ s⁻¹": "c12_k_units", "L mol⁻¹ s⁻¹": "c12_k_units", "no units": "c12_k_units"}
  - prompt: 'The order of a reaction is found:'
    options:
    - by experiment
    - from the balanced equation always
    - from molecularity
    - from the colour
    answer: by experiment
    difficulty: 2
    hints:
    - Not from coefficients.
    - Rate law.
    solution: By experiment.
    mistakes:
      from the balanced equation always: c12c_order
  - prompt: 'Hydrolysis of an ester in excess water is an example of a:'
    options:
    - pseudo first-order reaction
    - zero-order reaction
    - third-order reaction
    - fast reaction
    answer: pseudo first-order reaction
    difficulty: 2
    hints:
    - Water barely changes.
    - Acts first order.
    solution: A pseudo first-order reaction.
    mistakes: {"zero-order reaction": "c12_pseudo", "third-order reaction": "c12_pseudo", "fast reaction": "c12_pseudo"}
- code: cbse12c.kin.integrated
  title: Integrated rate laws and temperature
  after:
  - cbse12c.kin.rate
  notes: |
    Zero order: [A] = [A]₀ − kt; t½ = [A]₀/(2k). First order: k = (2.303/t) log([A]₀/[A]); t½ = 0.693/k (independent of [A]₀);
    radioactive decay is first order. Temperature: rate roughly doubles per 10 °C rise; Arrhenius equation k = Ae^(−Ea/RT);
    log(k₂/k₁) = (Ea/2.303R)(1/T₁ − 1/T₂). Activation energy; catalysts lower Ea; collision theory (effective collisions,
    orientation).
  explanations:
    text: Integrated rate laws tell how concentration falls with time. For first-order reactions the half-life is constant, whatever the starting amount. Raising temperature speeds reactions because more molecules have enough energy (activation energy) to react.
    visual: 'Draw an energy hill between reactants and products: activation energy is the hill''s height. A catalyst digs a tunnel through the hill, so more molecules get across.'
    step_by_step: 'Step 1: First order: t½ = 0.693/k. Step 2: After n half-lives, amount = initial ÷ 2ⁿ. Step 3: For temperature, use the Arrhenius equation. Step 4: Catalysts lower Ea.'
    real_world: Carbon dating uses the constant half-life of carbon-14 to find the age of old objects.
  picture:
    kind: bars
    bars:
    - label: start
      value: 100
    - label: 1 t½
      value: 50
    - label: 2 t½
      value: 25
    - label: 3 t½
      value: 12.5
    alt: 'A first-order reaction: amount left after each half-life: 100, 50, 25, 12.5.'
    unit: '%'
  activity:
    type: formula
    prompt: A first-order reaction halves every half-life, whatever amount you start with. Left = 100% × (½)^(t ÷ t½), and k = 0.693 ÷ t½.
    inputs:
    - name: h
      label: Half-life t½
      min: 1
      max: 20
      step: 1
      start: 1
      unit: min
    - name: t
      label: Time t
      min: 0
      max: 100
      step: 1
      start: 0
      unit: min
    outputs:
    - name: left
      label: Left
      expr: 100*0.5^(t/h)
      unit: '%'
      places: 2
    - name: k
      label: Rate constant k
      expr: 0.693/h
      unit: per min
      places: 4
    goals:
    - prompt: Half-life 10 min. How long until 12.5% is left?
      want:
        h: 10
        left: 12.5
      mistakes:
      - when:
          h: 10
          t: 20
        say: Two half-lives leave 25%. One more halves it again.
      - when:
          h: 10
          t: 40
        say: Four half-lives leave 6.25%.
    - prompt: k = 0.0693 per min. Set the half-life.
      want:
        k:
        - 0.0692
        - 0.0694
      mistakes:
      - when:
          h:
          - 1
          - 9
        say: A shorter half-life means a bigger k. t½ = 0.693 ÷ k.
    - prompt: Half-life 5 min. How long until only 6.25% is left?
      want:
        h: 5
        left: 6.25
      mistakes:
      - when:
          h: 5
          t: 15
        say: Three half-lives leave 12.5%. 6.25% is one more halving.
      - when:
          h: 5
          t:
          - 45
          - 50
        say: '94% gone isn''t 94% of the time: it halves each 5 minutes. 100 → 50 → 25 → 12.5 → 6.25.'
  items:
  - prompt: A first-order reaction has k = 0.0693 s⁻¹. Find t½ (s).
    answer: '10'
    check: Rational(693,1000)/Rational(693,10000)
    difficulty: 1
    hints:
    - 0.693/k.
    - 0.693/0.0693.
    solution: 10 s.
    mistakes: {"0.1": "c12_half_life", "100": "c12_half_life"}
  - prompt: Starting with 80 g, how much (g) is left after 3 half-lives?
    answer: '10'
    check: 80/2**3
    difficulty: 1
    hints:
    - 80/2³.
    - 80/8.
    solution: 10 g.
    mistakes: {"20": "c12_half_lives", "26.67": "c12_half_lives"}
  - prompt: A substance has t½ = 5 min. How many minutes until only 1/4 is left?
    answer: '10'
    check: 2*5
    difficulty: 2
    hints:
    - Two half-lives.
    - 2 × 5.
    solution: 10 min.
    mistakes: {"20": "c12_half_lives", "5": "c12_half_lives"}
  - prompt: A rate doubles for each 10 °C rise. By what factor does it increase from 20 °C to 50 °C?
    answer: '8'
    check: 2**3
    difficulty: 2
    hints:
    - Three 10° steps.
    - 2³.
    solution: 8 times.
    mistakes: {"6": "c12_temp_factor", "3": "c12_temp_factor"}
  - prompt: 'A catalyst speeds up a reaction by:'
    options:
    - lowering the activation energy
    - raising the temperature
    - changing ΔH
    - being used up
    answer: lowering the activation energy
    difficulty: 1
    hints:
    - Another path.
    - Lower hill.
    solution: Lowering the activation energy.
    mistakes: {"raising the temperature": "c12_catalyst_ea", "changing ΔH": "c12_catalyst_ea", "being used up": "c12_catalyst_ea"}
  - prompt: 'The half-life of a first-order reaction:'
    options:
    - does not depend on the starting concentration
    - doubles as concentration doubles
    - is always 1 s
    - depends on the volume
    answer: does not depend on the starting concentration
    difficulty: 2
    hints:
    - t½ = 0.693/k.
    - No [A]₀.
    solution: It doesn't depend on the initial concentration.
    mistakes:
      doubles as concentration doubles: c12c_half
