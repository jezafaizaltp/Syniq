# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 3. Format: content/README.md.
subject: cbse12-chem
chapter: 3
title: Chemical Kinetics
tips:
  c12_rxn_order: "Overall order = sum of the powers in the rate law."
  c12c_half: For a first-order reaction t½ = 0.693/k, independent of starting concentration.
  c12c_order: "Molecularity comes from one elementary step. The order comes from the rate law, which you can't read off the balanced equation. How is it found?"
  c12_catalyst_ea: "A catalyst gives an easier path over a lower energy hill."
  c12_half_life: "t½ = 0.693/k for first order."
  c12_half_lives: "Halve three times: 80 → 40 → …"
  c12_k_units: "For first order, rate = k[A]: mol L⁻¹ s⁻¹ ÷ mol L⁻¹."
  c12_pseudo: "Water is in such excess that its concentration barely changes; only the ester matters."
  c12_rate_factor: "Rate ∝ [A]². Square the change in [A]."
  c12_temp_factor: "50 − 20 = 30 °C is three 10-degree steps. Double for each step."
  c12c3_order: Order = sum of the powers in the experimental rate law. Rate changes by (factor)^(power) for each reactant.
  c12c3_half: 'First order: t½ = 0.693/k, the same at every stage. After n half-lives, (1/2)ⁿ is left.'
  c12c3_temp: Higher temperature or a catalyst means more molecules can pass the activation energy barrier.
  c12c3_fridge: Think about what a lower temperature does to the share of molecules with enough energy to react.
  c12c3_firstorder: Check whether the time to halve depends on how much you start with.
concepts:
- code: cbse12c.kin.rate
  title: Rate, rate law and order
  notes: |
    Rate of reaction: change in concentration per unit time; average and instantaneous; rate = −(1/a)d[A]/dt for aA. Factors:
    concentration, temperature, catalyst, surface area. Rate law rate = k[A]ˣ[B]ʸ; order x + y (experimental; can be zero or
    fractional); molecularity (elementary step; whole numbers 1–3). Units of k depend on order: zero mol L⁻¹ s⁻¹, first s⁻¹,
    second L mol⁻¹ s⁻¹. Pseudo first order (hydrolysis of ester in excess water).
  explanations:
    text: Chemical kinetics studies how fast reactions go. The rate law shows how the rate depends on concentrations; the powers in it give the reaction's order, which must be found by experiment.
    visual: 'Picture lighting a sparkler versus rusting a nail: same idea (oxidation), very different rates.'
    step_by_step: 'Step 1: Write rate = k[A]ˣ[B]ʸ. Step 2: Compare experiments where one concentration changes. Step 3: If doubling [A] doubles the rate, x = 1; if it quadruples, x = 2. Step 4: Order = x + y.'
    real_world: Refrigerators slow the chemical reactions that spoil food.
  picture:
    kind: compare
    columns:
    - title: Order
      points:
      - zero
      - first
      - second
    - title: Units of k
      points:
      - mol L⁻¹ s⁻¹
      - s⁻¹
      - L mol⁻¹ s⁻¹
    alt: Units of the rate constant for zero, first and second order reactions.
  activity:
    type: formula
    prompt: Rate = k[A]ˣ[B]ʸ. Doubling a concentration multiplies the rate by 2 to the power of its order.
    inputs:
    - name: x
      label: Order in A, x
      min: 0
      max: 4
      step: 1
      start: 0
    - name: y
      label: Order in B, y
      min: 0
      max: 4
      step: 1
      start: 0
    outputs:
    - name: ra
      label: Rate × when [A] doubles
      expr: 2^x
    - name: rb
      label: Rate × when [B] doubles
      expr: 2^y
    - name: r3
      label: Rate × when [A] triples
      expr: 3^x
    - name: tot
      label: Overall order
      expr: x+y
    goals:
    - prompt: Doubling [A] doubles the rate; doubling [B] makes it 4 times. Set the orders.
      want:
        ra: 2
        rb: 4
      mistakes:
      - when:
          rb: 16
        say: Order 4 would make it 2⁴ = 16 times. 4 = 2², so the order in B is 2.
      - when:
          ra: 4
        say: 'Order 2 in A would make doubling give 4 times. It only doubles: order 1.'
    - prompt: Doubling [A] leaves the rate unchanged; doubling [B] doubles it.
      want:
        ra: 1
        rb: 2
      mistakes:
      - when:
          x: 1
        say: 'If doubling [A] changed nothing, 2ˣ = 1: the order in A is zero.'
    - prompt: Overall order 3, and tripling [A] makes the rate 9 times.
      want:
        r3: 9
        tot: 3
      mistakes:
      - when:
          x: 3
        say: 'Tripling would then give 27 times. 9 = 3²: order 2 in A, leaving 1 for B.'
      - when:
          r3: 9
          tot: 2
        say: Order 2 in A is right, but the overall order must be 3.
  lesson:
    - teach: The rate of a reaction is how fast concentration changes. For aA → products, rate = −(1/a) d[A]/dt. The average rate is over an interval; the instantaneous rate is the slope at one moment. Rate depends on concentration, temperature, catalysts and surface area.
      check:
        prompt: 'For 2A → B, if [A] falls at 0.4 mol L⁻¹ s⁻¹, the reaction rate is:'
        options:
        - 0.2 mol L⁻¹ s⁻¹
        - 0.4 mol L⁻¹ s⁻¹
        - 0.8 mol L⁻¹ s⁻¹
        answer: 0.2 mol L⁻¹ s⁻¹
        why: Divide by the coefficient 2.
      ways:
      - style: visual
        teach: Average rate and instantaneous rate read from the same concentration curve.
        picture:
          kind: compare
          columns:
          - title: Average rate
            points:
            - Change in [A] ÷ time interval
            - Slope of a chord between two times
            - Hides changes inside the interval
          - title: Instantaneous rate
            points:
            - Rate at one moment
            - Slope of the tangent at that time
            - Falls as reactant is used up
          alt: Average rate is the change in concentration divided by the time interval, the slope of a chord between two times, and it hides changes inside the interval. Instantaneous rate is the rate at one moment, the slope of the tangent there, and it falls as reactant is used up.
      - style: real_world
        teach: 'A car trip of 120 km in 3 hours has an average speed of 40 km/h, but the speedometer shows the speed at each moment. Reaction rate works the same way: the average over an interval, or the ''speedometer'' reading at one instant.'
    - teach: 'Rate law: rate = k[A]ˣ[B]ʸ, found by experiment. The order is x + y and can be 0, a fraction or a whole number. Molecularity is the number of species colliding in one elementary step (1, 2 or 3).'
      picture:
        kind: compare
        columns:
        - title: Order
          points:
          - from experiment
          - can be 0 or fractional
          - for the overall reaction
        - title: Molecularity
          points:
          - from the mechanism
          - whole number 1–3
          - for one elementary step
        alt: Order and molecularity compared.
      check:
        prompt: rate = k[A]^(1/2)[B]. Overall order?
        options:
        - 3/2
        - '1'
        - '2'
        answer: 3/2
        why: 1/2 + 1.
      ways:
      - style: step_by_step
        teach: 'Find the order from data: [A] = 0.2 gives rate 5; [A] = 0.4 gives rate 10. Step 1: [A] doubled. Step 2: The rate also doubled. Step 3: 2ˣ = 2, so x = 1. Step 4: The reaction is first order in A.'
      - style: real_world
        teach: Order is like a recipe you discover by cooking, not by reading the label. The balanced equation may show two molecules of something, but only experiments tell how the speed actually responds when you add more of it.
    - teach: 'Units of k depend on order: zero order mol L⁻¹ s⁻¹, first order s⁻¹, second order L mol⁻¹ s⁻¹. A reaction like ester hydrolysis in a large excess of water behaves as first order (pseudo first order) because [water] barely changes.'
      check:
        prompt: 'k has units L mol⁻¹ s⁻¹. The order is:'
        options:
        - '2'
        - '1'
        - '0'
        answer: '2'
        why: That is the pattern for second order.
      ways:
      - style: visual
        teach: Units of k for each order, from rate = k[A]ⁿ.
        picture:
          kind: compare
          columns:
          - title: Zero order
            points:
            - rate = k
            - k in mol L⁻¹ s⁻¹
          - title: First order
            points:
            - rate = k[A]
            - k in s⁻¹
          - title: Second order
            points:
            - rate = k[A]²
            - k in L mol⁻¹ s⁻¹
          alt: For zero order, rate equals k and k has units mole per litre per second. For first order, rate equals k times A and k has units per second. For second order, rate equals k times A squared and k has units litre per mole per second.
      - style: step_by_step
        teach: 'Sucrose turns into glucose and fructose in lots of water. Step 1: True rate = k[sucrose][H₂O]. Step 2: Water is in huge excess, so [H₂O] hardly changes. Step 3: Fold it into k: k'' = k[H₂O]. Step 4: Rate = k''[sucrose], pseudo first order.'
  items:
  - prompt: Rate = k[A]²[B]. What is the overall order?
    answer: '3'
    check: 2+1
    difficulty: 1
    hints:
    - 2 + 1.
    - Add powers.
    solution: "Add the powers: 2 + 1 = 3."
    mistakes: {"2": "c12_rxn_order", "1": "c12_rxn_order"}
  - prompt: Rate = k[A]². If [A] is doubled, by what factor does the rate increase?
    answer: '4'
    check: 2**2
    difficulty: 1
    hints:
    - 2².
    - Square.
    solution: "Rate ∝ [A]², so doubling [A] multiplies the rate by 2² = 4."
    mistakes: {"2": "c12_rate_factor", "8": "c12_rate_factor"}
  - prompt: Rate = k[A]. If [A] is tripled, by what factor does the rate increase?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - First order.
    - Directly.
    solution: "Rate ∝ [A], so tripling [A] triples the rate: factor 3."
    mistakes: {"9": "c12_rate_factor", "1": "c12_rate_factor"}
  - prompt: 'The units of k for a first-order reaction are:'
    options:
    - s⁻¹
    - mol L⁻¹ s⁻¹
    - L mol⁻¹ s⁻¹
    - no units
    answer: s⁻¹
    difficulty: 2
    hints:
    - Rate/[A].
    - mol L⁻¹ s⁻¹ ÷ mol L⁻¹.
    solution: "k = rate/[A] = (mol L⁻¹ s⁻¹)/(mol L⁻¹) = s⁻¹."
    mistakes: {"mol L⁻¹ s⁻¹": "c12_k_units", "L mol⁻¹ s⁻¹": "c12_k_units", "no units": "c12_k_units"}
  - prompt: 'The order of a reaction is found:'
    options:
    - by experiment
    - from the balanced equation always
    - from molecularity
    - from the colour
    answer: by experiment
    difficulty: 2
    hints:
    - Not from coefficients.
    - Rate law.
    solution: "Order comes from how the measured rate changes with concentration, so it is found by experiment, not from the equation."
    mistakes:
      from the balanced equation always: c12c_order
  - prompt: 'Hydrolysis of an ester in excess water is an example of a:'
    options:
    - pseudo first-order reaction
    - zero-order reaction
    - third-order reaction
    - fast reaction
    answer: pseudo first-order reaction
    difficulty: 2
    hints:
    - Water barely changes.
    - Acts first order.
    solution: "Water is in such excess that its concentration barely changes, so the rate depends only on [ester]: pseudo first-order."
    mistakes: {"zero-order reaction": "c12_pseudo", "third-order reaction": "c12_pseudo", "fast reaction": "c12_pseudo"}
  - prompt: rate = k[A][B]². Overall order?
    answer: '3'
    check: 1 + 2
    difficulty: 1
    hints:
    - Add the powers.
    - 1 + 2.
    solution: 'Step 1: 1 + 2. Step 2: 3.'
    mistakes:
      '2': c12c3_order
      '1': c12c3_order
  - prompt: rate = k[A]³. [A] is doubled. Rate grows by what factor?
    answer: '8'
    check: 2**3
    difficulty: 1
    hints:
    - Raise the factor to the order.
    - 2³.
    solution: 'Step 1: 2³. Step 2: 8.'
    mistakes:
      '6': c12c3_order
      '2': c12c3_order
  - prompt: 'Zero-order reaction: [A] is tripled. Rate grows by what factor?'
    answer: '1'
    check: 3**0
    difficulty: 1
    hints:
    - Zero order means rate = k.
    - '[A]⁰ = 1.'
    solution: 'Step 1: rate does not depend on [A]. Step 2: factor 1.'
    mistakes:
      '3': c12c3_order
      '0': c12c3_order
  - prompt: rate = k[A][B]. [A] doubles and [B] triples. Rate factor?
    answer: '6'
    check: 2*3
    difficulty: 2
    hints:
    - Each is first order.
    - Multiply the factors.
    solution: 'Step 1: 2 × 3. Step 2: 6.'
    mistakes:
      '5': c12c3_order
      '36': c12c3_order
  - prompt: Doubling [A] makes the rate 4 times larger. Order with respect to A?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 2ˣ = 4.
    - Solve for x.
    solution: 'Step 1: 2ˣ = 4. Step 2: x = 2.'
    mistakes:
      '4': c12c3_order
      '1': c12c3_order
  - prompt: For N₂ + 3H₂ → 2NH₃, if [NH₃] rises at 0.2 mol L⁻¹ s⁻¹, [H₂] falls at what rate (mol L⁻¹ s⁻¹), as a fraction?
    answer: 3/10
    check: Rational(2,10)*3/2
    difficulty: 2
    hints:
    - Rate = (1/2)d[NH₃]/dt = −(1/3)d[H₂]/dt.
    - 0.1 × 3.
    solution: 'Step 1: reaction rate 0.1. Step 2: H₂ falls at 0.3.'
    mistakes:
      1/5: c12c3_order
      3/5: c12c3_order
  - prompt: 'The units of k for a zero-order reaction are:'
    options:
    - mol L⁻¹ s⁻¹
    - s⁻¹
    - L mol⁻¹ s⁻¹
    answer: mol L⁻¹ s⁻¹
    difficulty: 2
    hints:
    - rate = k.
    - Same units as rate.
    solution: 'Step 1: k = rate. Step 2: mol L⁻¹ s⁻¹.'
    mistakes:
      s⁻¹: c12c3_order
      L mol⁻¹ s⁻¹: c12c3_order
  - prompt: 'Experiments: [A] = 0.1 gives rate 2; [A] = 0.3 gives rate 18 (same units). Order in A?'
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - '[A] × 3, rate × 9.'
    - 3ˣ = 9.
    solution: 'Step 1: 3ˣ = 9. Step 2: x = 2.'
    mistakes:
      '3': c12c3_order
      '1': c12c3_order
  - prompt: Why can molecularity never be zero or fractional?
    options:
    - it counts actual molecules colliding in a step
    - it is found by experiment
    - it equals the order
    answer: it counts actual molecules colliding in a step
    difficulty: 3
    hints:
    - You cannot have half a molecule.
    - It describes one elementary step.
    solution: 'Step 1: it is a count. Step 2: always 1, 2 or 3.'
    mistakes:
      it is found by experiment: c12c3_order
      it equals the order: c12c3_order
  - prompt: 'Assertion (A): The order of a reaction can be a fraction.

      Reason (R): Order is found by experiment and need not match the coefficients of the balanced equation.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Because the rate law is experimental, the powers can be fractional, as in some gas-phase reactions. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: Milk kept in a fridge stays fresh for days, but sours in hours on a hot kitchen shelf. Why?'
    options:
    - Fewer molecules have enough energy to react at low temperature
    - The fridge removes the bacteria
    - Cold milk has a different rate law
    answer: Fewer molecules have enough energy to react at low temperature
    hints:
    - Souring is a set of chemical reactions.
    - How does temperature change the share of energetic collisions?
    solution: Lowering temperature cuts the fraction of molecules with energy above Ea, so the souring reactions slow right down.
    mistakes:
      The fridge removes the bacteria: c12c3_fridge
      Cold milk has a different rate law: c12c3_fridge
    exam: case
    difficulty: 2
  - prompt: A chemist doubles [B] and finds the rate unchanged. What can be concluded?
    options:
    - The reaction is zero order in B
    - B is not a reactant
    - The reaction is first order in B
    answer: The reaction is zero order in B
    hints:
    - Rate changes by 2ʸ when [B] doubles.
    - What power makes 2ʸ = 1?
    solution: 2ʸ = 1 gives y = 0. B can still be used up; its concentration just doesn't affect the rate.
    mistakes:
      B is not a reactant: c12c3_order
      The reaction is first order in B: c12c3_order
    exam: competency
    difficulty: 2
- code: cbse12c.kin.integrated
  title: Integrated rate laws and temperature
  after:
  - cbse12c.kin.rate
  notes: |
    Zero order: [A] = [A]₀ − kt; t½ = [A]₀/(2k). First order: k = (2.303/t) log([A]₀/[A]); t½ = 0.693/k (independent of [A]₀);
    radioactive decay is first order. Temperature: rate roughly doubles per 10 °C rise; Arrhenius equation k = Ae^(−Ea/RT);
    log(k₂/k₁) = (Ea/2.303R)(1/T₁ − 1/T₂). Activation energy; catalysts lower Ea; collision theory (effective collisions,
    orientation).
  explanations:
    text: Integrated rate laws tell how concentration falls with time. For first-order reactions the half-life is constant, whatever the starting amount. Raising temperature speeds reactions because more molecules have enough energy (activation energy) to react.
    visual: 'Draw an energy hill between reactants and products: activation energy is the hill''s height. A catalyst digs a tunnel through the hill, so more molecules get across.'
    step_by_step: 'Step 1: First order: t½ = 0.693/k. Step 2: After n half-lives, amount = initial ÷ 2ⁿ. Step 3: For temperature, use the Arrhenius equation. Step 4: Catalysts lower Ea.'
    real_world: Carbon dating uses the constant half-life of carbon-14 to find the age of old objects.
  picture:
    kind: bars
    bars:
    - label: start
      value: 100
    - label: 1 t½
      value: 50
    - label: 2 t½
      value: 25
    - label: 3 t½
      value: 12.5
    alt: 'A first-order reaction: amount left after each half-life: 100, 50, 25, 12.5.'
    unit: '%'
  activity:
    type: formula
    prompt: A first-order reaction halves every half-life, whatever amount you start with. Left = 100% × (½)^(t ÷ t½), and k = 0.693 ÷ t½.
    inputs:
    - name: h
      label: Half-life t½
      min: 1
      max: 20
      step: 1
      start: 1
      unit: min
    - name: t
      label: Time t
      min: 0
      max: 100
      step: 1
      start: 0
      unit: min
    outputs:
    - name: left
      label: Left
      expr: 100*0.5^(t/h)
      unit: '%'
      places: 2
    - name: k
      label: Rate constant k
      expr: 0.693/h
      unit: per min
      places: 4
    goals:
    - prompt: Half-life 10 min. How long until 12.5% is left?
      want:
        h: 10
        left: 12.5
      mistakes:
      - when:
          h: 10
          t: 20
        say: Two half-lives leave 25%. One more halves it again.
      - when:
          h: 10
          t: 40
        say: Four half-lives leave 6.25%.
    - prompt: k = 0.0693 per min. Set the half-life.
      want:
        k:
        - 0.0692
        - 0.0694
      mistakes:
      - when:
          h:
          - 1
          - 9
        say: A shorter half-life means a bigger k. t½ = 0.693 ÷ k.
    - prompt: Half-life 5 min. How long until only 6.25% is left?
      want:
        h: 5
        left: 6.25
      mistakes:
      - when:
          h: 5
          t: 15
        say: Three half-lives leave 12.5%. 6.25% is one more halving.
      - when:
          h: 5
          t:
          - 45
          - 50
        say: '94% gone isn''t 94% of the time: it halves each 5 minutes. 100 → 50 → 25 → 12.5 → 6.25.'
  lesson:
    - teach: 'Zero order: [A] = [A]₀ − kt, falling in a straight line; t½ = [A]₀/(2k). First order: k = (2.303/t) log([A]₀/[A]) and t½ = 0.693/k, which does not depend on how much you start with. Radioactive decay is first order.'
      check:
        prompt: First order, t½ = 20 min. Time for 100 g to become 50 g? Time for 50 g to become 25 g?
        options:
        - 20 min each
        - 20 then 10 min
        - 20 then 40 min
        answer: 20 min each
        why: First-order half-life is constant.
      ways:
      - style: visual
        teach: Zero and first order compared, side by side.
        picture:
          kind: compare
          columns:
          - title: Zero order
            points:
            - '[A] falls in a straight line'
            - t½ = [A]₀/2k
            - t½ shrinks as [A]₀ drops
          - title: First order
            points:
            - '[A] falls on a curve'
            - t½ = 0.693/k
            - t½ stays the same
          alt: In zero order the concentration falls in a straight line, half-life is A nought over 2k, and it shrinks as the starting amount drops. In first order the concentration falls on a curve, half-life is 0.693 over k, and it stays the same.
      - style: step_by_step
        teach: 'First order, k = 0.01 min⁻¹. How long to fall from 0.5 to 0.05 mol/L? Step 1: [A]₀/[A] = 10, log 10 = 1. Step 2: t = (2.303/k) × 1. Step 3: t = 2.303/0.01. Step 4: t = 230.3 min.'
    - teach: After n half-lives, the fraction left is (1/2)ⁿ. So 3 half-lives leave 1/8; 4 leave 1/16.
      picture:
        kind: bars
        bars:
        - label: '0'
          value: 100
        - label: 1 t½
          value: 50
        - label: 2 t½
          value: 25
        - label: 3 t½
          value: 12.5
        alt: 'Amount left halves every half-life: 100, 50, 25, 12.5.'
      check:
        prompt: Fraction left after 4 half-lives?
        options:
        - 1/16
        - 1/8
        - 1/4
        answer: 1/16
        why: (1/2)⁴.
      ways:
      - style: real_world
        teach: Carbon dating uses half-lives. Living things keep a steady amount of carbon-14; after death it halves every 5730 years. A bone with 1/4 of the living level is about two half-lives, roughly 11,460 years, old.
      - style: step_by_step
        teach: 'A drug has a 2-hour half-life. Step 1: After 2 h, 1/2 is left. Step 2: After 4 h, 1/4. Step 3: After 6 h, 1/8. Step 4: After 8 h, 1/16 of the dose remains, which is why doses are repeated.'
    - teach: 'Temperature: many reactions roughly double in rate per 10 °C. Arrhenius: k = Ae^(−Ea/RT). Only collisions with enough energy (≥ Ea) and the right orientation react. A catalyst gives a lower-Ea path, so more collisions succeed; it does not change ΔH.'
      check:
        prompt: 'A catalyst changes:'
        options:
        - the activation energy
        - the enthalpy change ΔH
        - the equilibrium constant
        answer: the activation energy
        why: It offers a new pathway with lower Ea.
      ways:
      - style: visual
        teach: How a catalyst changes the energy path but not the start or end.
        picture:
          kind: compare
          columns:
          - title: Without catalyst
            points:
            - High energy hill (Ea)
            - Few collisions succeed
            - Same ΔH
          - title: With catalyst
            points:
            - Lower hill
            - Many more collisions succeed
            - Same ΔH
          alt: Without a catalyst the energy hill Ea is high and few collisions succeed. With a catalyst the hill is lower and many more succeed. Reactants and products sit at the same levels, so ΔH is the same.
      - style: real_world
        teach: 'Crossing a mountain range: a catalyst is like a tunnel. You start and end in the same valleys (same ΔH), but you don''t have to climb the peak, so many more travellers make it across each hour.'
  items:
  - prompt: A first-order reaction has k = 0.0693 s⁻¹. Find t½ (s).
    answer: '10'
    check: Rational(693,1000)/Rational(693,10000)
    difficulty: 1
    hints:
    - 0.693/k.
    - 0.693/0.0693.
    solution: "t½ = 0.693/k = 0.693/0.0693 = 10 s."
