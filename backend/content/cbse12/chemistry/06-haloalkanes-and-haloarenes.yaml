# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 6. Format: content/README.md.
subject: cbse12-chem
chapter: 6
title: Haloalkanes and Haloarenes
tips:
  c12c_sn: 'SN2: one step, backside attack, inversion, fastest for primary halides. SN1: carbocation, racemisation, fastest for tertiary.'
  c12c_aryl: Aryl halides resist nucleophilic substitution because the C–X bond has partial double-bond character.
  c12_cfc: "Chlorine from refrigerator and aerosol gases breaks down ozone."
  c12_count_formula: "The subscript after Cl tells you how many."
  c12_ddt: "DDT is not broken down easily and is stored in fat."
  c12_grignard: "R–Mg–X compounds are named after the French chemist who made them."
  c12_halogen_direct: "Halogens deactivate the ring but still direct like –OH, through their lone pairs."
  c12_iodoform: "Iodoform releases iodine slowly and was used on wounds."
  c12_racemic: "Equal amounts of mirror images cancel each other's optical rotation."
  c12_saytzeff: "Saytzeff: the H is lost from the carbon with fewer H atoms, giving a more substituted double bond."
  c12_sn1: "SN1 goes through a carbocation. Which forms the most stable carbocation?"
  c12_sn2: "SN2 attack comes from the back, flipping the molecule like an umbrella in wind."
concepts:
- code: cbse12c.halo.substitution
  title: 'Haloalkanes: nature and nucleophilic substitution'
  notes: |
    Classification (primary, secondary, tertiary; allylic, benzylic, vinylic, aryl). Nomenclature. C–X bond polar. Preparation
    from alcohols (HX, PCl₃, PCl₅, SOCl₂), from alkenes (HX), halogen exchange (Finkelstein, Swarts). Physical properties:
    boiling points rise with size of halogen and chain. Nucleophilic substitution: SN2 (one step, bimolecular, inversion,
    1° > 2° > 3°), SN1 (two steps via carbocation, racemisation, 3° > 2° > 1°). Elimination (Saytzeff rule: more substituted
    alkene). Reaction with metals (Grignard reagent RMgX, Wurtz). Stereochemistry: chirality, optical activity, enantiomers,
    racemic mixture.
  explanations:
    text: Haloalkanes have a halogen on a carbon chain. Because the C–X bond is polar, nucleophiles can replace the halogen. SN2 happens in one step with the nucleophile attacking from behind; SN1 goes through a carbocation and is fastest for tertiary halides.
    visual: 'Draw SN2 like an umbrella turning inside out in the wind: the nucleophile pushes in from the back as the halide leaves from the front, flipping the molecule''s shape.'
    step_by_step: 'Step 1: Classify the halide (1°, 2°, 3°). Step 2: Primary → SN2 likely; tertiary → SN1. Step 3: SN2 gives inversion; SN1 gives a racemic mixture.'
    real_world: Chloroform was once an anaesthetic; it is now kept in dark bottles because light turns it into poisonous phosgene.
  picture:
    kind: compare
    columns:
    - title: Feature
      points:
      - steps
      - rate depends on
      - best substrate
      - stereochemistry
    - title: SN1
      points:
      - two (carbocation)
      - substrate only
      - tertiary
      - racemisation
    - title: SN2
      points:
      - one
      - substrate and nucleophile
      - primary
      - inversion
    alt: SN1 and SN2 reactions compared.
  activity:
    type: sort
    prompt: SN1 or SN2?
    bins:
    - SN1
    - SN2
    items:
    - label: (CH₃)₃CBr, a tertiary halide
      bin: SN1
      clue: Can a nucleophile reach the back of a carbon crowded by three CH₃ groups?
      why: 'No: it ionises instead to a stable 3° carbocation.'
    - label: CH₃Br, a methyl halide
      bin: SN2
      clue: Is the carbon crowded? Would its carbocation be stable?
      why: 'Uncrowded, with a very unstable cation: backside attack in one step.'
    - label: CH₃CH₂Br, a primary halide
      bin: SN2
      clue: Is a primary carbocation stable?
      why: 'No: primary halides react in one step.'
    - label: Goes through a carbocation
      bin: SN1
      clue: Which mechanism has two steps?
      why: 'SN1: ionise first, then the nucleophile attacks.'
    - label: One step, attack from the back
      bin: SN2
      clue: Which mechanism happens all at once?
      why: 'SN2: bond forming and breaking together.'
    - label: Inversion of configuration
      bin: SN2
      clue: Backside attack flips the molecule like an umbrella. Which mechanism?
      why: SN2 gives inversion.
    - label: Racemisation
      bin: SN1
      clue: A flat carbocation can be attacked from either face. Which mechanism?
      why: SN1 gives a mixture of both forms.
    - label: Rate = k[RX]
      bin: SN1
      clue: Does the nucleophile appear in the rate law?
      why: 'Only the halide: unimolecular.'
    - label: Rate = k[RX][Nu⁻]
      bin: SN2
      clue: Both in the rate law. Uni- or bimolecular?
      why: Bimolecular.
    - label: Benzyl chloride, C₆H₅CH₂Cl
      bin: SN1
      clue: Is its carbocation stabilised by the ring?
      why: Resonance stabilises the benzyl cation, so SN1 is easy.
  items:
  - prompt: Which reacts fastest by SN2?
    options:
    - CH₃Br
    - (CH₃)₃CBr
    - (CH₃)₂CHBr
    - C₆H₅Br
    answer: CH₃Br
    difficulty: 2
    hints:
    - Least crowded.
    - Backside attack.
    solution: CH₃Br.
    mistakes:
      (CH₃)₃CBr: c12c_sn
  - prompt: Which reacts fastest by SN1?
    options:
    - (CH₃)₃CBr
    - CH₃Br
    - CH₃CH₂Br
    - C₆H₅Br
    answer: (CH₃)₃CBr
    difficulty: 2
    hints:
    - Most stable carbocation.
    - Tertiary.
    solution: (CH₃)₃CBr.
    mistakes: {"CH₃Br": "c12_sn1", "CH₃CH₂Br": "c12_sn1", "C₆H₅Br": "c12_sn1"}
  - prompt: 'SN2 reactions give products with:'
    options:
    - inversion of configuration
    - racemisation
    - no change
    - a carbocation
    answer: inversion of configuration
    difficulty: 2
    hints:
    - Backside attack.
    - Walden inversion.
    solution: Inversion.
    mistakes: {"racemisation": "c12_sn2", "no change": "c12_sn2", "a carbocation": "c12_sn2"}
  - prompt: 'CH₃MgBr is an example of a:'
    options:
    - Grignard reagent
    - Swarts reagent
    - Finkelstein product
    - Lucas reagent
    answer: Grignard reagent
    difficulty: 1
    hints:
    - RMgX.
    - Made in dry ether.
    solution: A Grignard reagent.
    mistakes: {"Swarts reagent": "c12_grignard", "Finkelstein product": "c12_grignard", "Lucas reagent": "c12_grignard"}
  - prompt: 'An equal mixture of two enantiomers is called a:'
    options:
    - racemic mixture
    - meso compound
    - diastereomer
    - isomer pair only
    answer: racemic mixture
    difficulty: 1
    hints:
    - Optically inactive.
    - '50:50.'
    solution: A racemic mixture.
    mistakes: {"meso compound": "c12_racemic", "diastereomer": "c12_racemic", "isomer pair only": "c12_racemic"}
  - prompt: 'According to Saytzeff''s rule, elimination gives mainly:'
    options:
    - the more substituted alkene
    - the less substituted alkene
    - an alkyne
    - an alcohol
    answer: the more substituted alkene
    difficulty: 2
    hints:
    - More stable.
    - Fewer H on the double bond.
    solution: The more substituted alkene.
    mistakes: {"the less substituted alkene": "c12_saytzeff", "an alkyne": "c12_saytzeff", "an alcohol": "c12_saytzeff"}
- code: cbse12c.halo.arenes
  title: Haloarenes and environmental effects
  after:
  - cbse12c.halo.substitution
  notes: |
    Haloarenes: preparation (electrophilic substitution with FeCl₃; Sandmeyer from diazonium salts). Less reactive in
    nucleophilic substitution (resonance gives C–X partial double bond; sp² carbon; phenyl cation unstable); reactivity raised
    by –NO₂ at ortho/para. Electrophilic substitution: halogens are deactivating but o/p directing. Wurtz–Fittig, Fittig
    reactions. Polyhalogen compounds: CH₂Cl₂, CHCl₃, CHI₃ (iodoform antiseptic), CCl₄, freons (ozone depletion), DDT
    (persistent, bioaccumulation).
  explanations:
    text: In haloarenes the halogen is attached to a benzene ring. Resonance strengthens the C–X bond, so they resist nucleophilic substitution. Many polyhalogen compounds, like freons and DDT, are useful but harmful to the environment.
    visual: 'Draw chlorobenzene with a lone pair on Cl spreading into the ring: the C–Cl bond gains some double-bond character, so it''s harder to break.'
    step_by_step: 'Step 1: Aryl halide → slow nucleophilic substitution. Step 2: –NO₂ at ortho/para speeds it up. Step 3: In electrophilic substitution, halogens direct to ortho/para.'
    real_world: Freons from old fridges damaged the ozone layer, which is why they were banned under the Montreal Protocol.
  picture:
    kind: flow
    steps:
    - Freons released
    - Rise to the stratosphere
    - UV frees chlorine atoms
    - Cl destroys ozone
    alt: How freons damage the ozone layer.
  activity:
    type: sort
    prompt: In electrophilic substitution, where does the new group go?
    bins:
    - Ortho and para
    - Meta
    items:
    - label: Chlorobenzene (–Cl)
      bin: Ortho and para
      clue: Halogens pull by −I but give lone pairs by +R. Which decides the position?
      why: 'Resonance sends electrons to o and p: o/p directing, though deactivating.'
    - label: Phenol (–OH)
      bin: Ortho and para
      clue: Does –OH donate a lone pair to the ring?
      why: 'Strong +R: o/p, activating.'
    - label: Toluene (–CH₃)
      bin: Ortho and para
      clue: Does a methyl group push electrons in?
      why: '+I and hyperconjugation: o/p.'
    - label: Aniline (–NH₂)
      bin: Ortho and para
      clue: Does N have a lone pair to give?
      why: 'Strong +R: o/p.'
    - label: Anisole (–OCH₃)
      bin: Ortho and para
      clue: Does the O give a lone pair to the ring?
      why: '+R: o/p.'
    - label: Nitrobenzene (–NO₂)
      bin: Meta
      clue: Does –NO₂ pull electrons out of the ring?
      why: It drains o and p most, so attack goes to meta.
    - label: Benzoic acid (–COOH)
      bin: Meta
      clue: Does the C=O pull electrons from the ring?
      why: 'Electron-withdrawing: meta.'
    - label: Benzaldehyde (–CHO)
      bin: Meta
      clue: Is –CHO electron-withdrawing?
      why: 'Yes: meta.'
    - label: Benzonitrile (–CN)
      bin: Meta
      clue: Does –C≡N pull electrons?
      why: 'Strongly: meta.'
  items:
  - prompt: 'Chlorobenzene is less reactive than chloromethane towards nucleophiles because:'
    options:
    - the C–Cl bond has partial double-bond character
    - chlorine is bigger
    - benzene is a gas
    - it has no electrons
    answer: the C–Cl bond has partial double-bond character
    difficulty: 2
    hints:
    - Resonance.
    - Stronger bond.
    solution: Resonance gives the C–Cl bond partial double-bond character.
    mistakes:
      chlorine is bigger: c12c_aryl
  - prompt: Which compound damages the ozone layer?
    options:
    - freons (CFCs)
    - iodoform
    - glucose
    - ethanol
    answer: freons (CFCs)
    difficulty: 1
    hints:
    - Refrigerants.
    - Montreal Protocol.
    solution: Freons.
    mistakes: {"iodoform": "c12_cfc", "glucose": "c12_cfc", "ethanol": "c12_cfc"}
  - prompt: 'In electrophilic substitution, a halogen on benzene directs incoming groups to:'
    options:
    - ortho and para positions
    - meta position
    - the halogen itself
    - no position
    answer: ortho and para positions
    difficulty: 2
    hints:
    - Lone pairs.
    - Though deactivating.
    solution: Ortho and para.
    mistakes: {"meta position": "c12_halogen_direct", "the halogen itself": "c12_halogen_direct", "no position": "c12_halogen_direct"}
  - prompt: 'Iodoform (CHI₃) is used as an:'
    options:
    - antiseptic
    - anaesthetic
    - insecticide
    - refrigerant
    answer: antiseptic
    difficulty: 2
    hints:
    - Yellow, smelly.
    - Releases iodine.
    solution: Antiseptic.
    mistakes: {"anaesthetic": "c12_iodoform", "insecticide": "c12_iodoform", "refrigerant": "c12_iodoform"}
  - prompt: 'DDT is a problem because it:'
    options:
    - persists and builds up in food chains
    - evaporates instantly
    - is a nutrient
    - is too weak
    answer: persists and builds up in food chains
    difficulty: 2
    hints:
    - Not broken down.
    - Biomagnification.
    solution: It persists and accumulates in food chains.
    mistakes: {"evaporates instantly": "c12_ddt", "is a nutrient": "c12_ddt", "is too weak": "c12_ddt"}
  - prompt: How many chlorine atoms are in CCl₄?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Tetrachloro.
    - Four.
    solution: '4.'
    mistakes: {"1": "c12_count_formula", "3": "c12_count_formula"}
