# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 5. Format: content/README.md.
subject: cbse12-chem
chapter: 5
title: Coordination Compounds
tips:
  c12c_cn: Coordination number = number of donor atoms bonded to the central metal (not the number of ligands, if ligands are bidentate).
  c12c_ox: Oxidation state of the metal = overall charge − (sum of ligand charges).
concepts:
- code: cbse12c.coord.naming
  title: Werner's theory, terms and naming
  notes: |
    Werner's theory: primary valence (oxidation state, ionisable) and secondary valence (coordination number, directional).
    Terms: central atom, ligands (unidentate, bidentate like en, C₂O₄²⁻; polydentate like EDTA⁴⁻ hexadentate; ambidentate
    NO₂⁻/ONO⁻, SCN⁻), coordination number, coordination sphere, counter ions, homoleptic/heteroleptic. IUPAC naming: cation
    first; ligands alphabetically (anionic end in -o: chlorido, cyanido; neutral: aqua, ammine, carbonyl), metal with oxidation
    state in Roman numerals; anionic complex ends in -ate (ferrate, cuprate). Isomerism: structural (ionisation, linkage,
    coordination, solvate) and stereo (geometrical cis/trans, optical).
  explanations:
    text: A coordination compound has a central metal ion bonded to surrounding molecules or ions called ligands. The number of bonds to the metal is the coordination number. IUPAC names list ligands alphabetically, then the metal and its oxidation state.
    visual: 'Draw [Co(NH₃)₆]³⁺: a cobalt ion in the centre with six ammonia molecules around it at the corners of an octahedron.'
    step_by_step: 'Step 1: Identify the metal and ligands. Step 2: Count donor atoms for the coordination number. Step 3: Oxidation state = charge − ligand charges. Step 4: Name ligands alphabetically, then the metal.'
    real_world: Haemoglobin, chlorophyll and vitamin B₁₂ are coordination compounds of iron, magnesium and cobalt.
  picture:
    kind: compare
    columns:
    - title: Ligand
      points:
      - NH₃
      - Cl⁻
      - en
      - EDTA⁴⁻
    - title: Denticity
      points:
      - unidentate
      - unidentate
      - bidentate
      - hexadentate
    alt: Ligands and how many donor atoms each uses.
  activity:
    type: formula
    prompt: 'Call the central metal''s oxidation state x. Ligand charges: NH₃, CO and en are 0; Cl⁻ and CN⁻ are −1. Atoms'' charges add to the overall charge.'
    inputs:
    - name: x
      label: x
      min: -1
      max: 9
      step: 1
      start: -1
    outputs:
    - name: co
      label: '[Co(NH₃)₆]³⁺ charge'
      expr: x
    - name: fe
      label: K₄[Fe(CN)₆] total (x on Fe)
      expr: 4+x-6
    - name: ni
      label: '[Ni(CO)₄] total (x on Ni)'
      expr: x
    - name: cr
      label: '[Cr(en)₂Cl₂]⁺ charge'
      expr: x-2
    goals:
    - prompt: Find Co in [Co(NH₃)₆]³⁺.
      want:
        co: 3
      mistakes:
      - when:
          x: 6
        say: 6 is the coordination number (six NH₃), not the oxidation state. NH₃ is neutral, so Co carries the whole 3+.
    - prompt: Find Fe in K₄[Fe(CN)₆].
      want:
        fe: 0
      mistakes:
      - when:
          x: 6
        say: '6 is how many CN⁻ there are. Each is −1: x + 4 − 6 = 0.'
      - when:
          x: 3
        say: 'Fe³⁺ is in K₃[Fe(CN)₆]. Here there are 4 K⁺: x + 4 − 6 = 0.'
    - prompt: Find Ni in [Ni(CO)₄].
      want:
        ni: 0
      mistakes:
      - when:
          x: 4
        say: 4 is the number of CO ligands. CO is neutral, so Ni is 0.
    - prompt: Find Cr in [Cr(en)₂Cl₂]⁺.
      want:
        cr: 1
      mistakes:
      - when:
          x: 1
        say: 'en is neutral, but each Cl⁻ is −1: x − 2 = +1.'
      - when:
          x: 6
        say: '6 is the coordination number: each en binds twice (2 × 2) plus 2 Cl. x − 2 = +1.'
  items:
  - prompt: What is the coordination number of Co in [Co(NH₃)₆]³⁺?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Six NH₃.
    - Each unidentate.
    solution: '6.'
  - prompt: What is the oxidation state of Fe in [Fe(CN)₆]⁴⁻?
    answer: '2'
    check: -4+6
    difficulty: 1
    hints:
    - x + 6(−1) = −4.
    - x = 2.
    solution: '+2.'
    mistakes:
      '-4': c12c_ox
  - prompt: What is the coordination number of Co in [Co(en)₃]³⁺?
    answer: '6'
    check: 3*2
    difficulty: 2
    hints:
    - en is bidentate.
    - 3 × 2.
    solution: '6.'
    mistakes:
      '3': c12c_cn
  - prompt: What is the oxidation state of Pt in [Pt(NH₃)₂Cl₂]?
    answer: '2'
    check: 0+2
    difficulty: 2
    hints:
    - x + 0 + 2(−1) = 0.
    - x = 2.
    solution: '+2.'
  - prompt: 'EDTA⁴⁻ is a:'
    options:
    - hexadentate ligand
    - unidentate ligand
    - bidentate ligand
    - neutral ligand
    answer: hexadentate ligand
    difficulty: 2
    hints:
    - Six donor atoms.
    - Wraps around.
    solution: Hexadentate.
  - prompt: 'The IUPAC name of K₄[Fe(CN)₆] is potassium hexacyanido:'
    options:
    - ferrate(II)
    - iron(II)
    - ferrate(III)
    - iron(III)
    answer: ferrate(II)
    difficulty: 2
    hints:
    - Anionic complex → -ate.
    - Fe is +2.
    solution: Potassium hexacyanidoferrate(II).
- code: cbse12c.coord.bonding
  title: 'Bonding: VBT and crystal field theory'
  after:
  - cbse12c.coord.naming
  notes: |
    Valence bond theory: hybridisation (sp³ tetrahedral, dsp² square planar, d²sp³ inner orbital and sp³d² outer orbital
    octahedral); magnetic behaviour. Crystal field theory: splitting of d orbitals in octahedral field into t₂g (lower) and eg
    (higher) by Δ₀; strong-field ligands (CN⁻, CO) cause pairing (low spin), weak-field (I⁻, Cl⁻, H₂O) give high spin;
    spectrochemical series I⁻ < Br⁻ < Cl⁻ < F⁻ < OH⁻ < H₂O < NH₃ < en < CN⁻ < CO. Colour from d–d transitions (absorbed
    colour complementary). Metal carbonyls; uses (EDTA in water hardness, cisplatin anticancer, photography).
  explanations:
    text: Ligands split the metal's d orbitals into groups at different energies. Strong-field ligands split them a lot, forcing electrons to pair up (low spin); weak-field ligands split them a little (high spin). The light absorbed when electrons jump between them gives complexes their colour.
    visual: Draw five d orbitals as one level, then split into three lower (t₂g) and two higher (eg) when six ligands approach. The gap is Δ₀.
    step_by_step: 'Step 1: Count d electrons. Step 2: Strong or weak field ligand? Step 3: Fill t₂g then eg (high spin) or pair in t₂g first (low spin). Step 4: Count unpaired electrons for magnetism.'
    real_world: Cisplatin, a platinum complex, is used to treat some cancers.
  picture:
    kind: flow
    steps:
    - 'Free ion: five equal d orbitals'
    - Six ligands approach
    - Split into t₂g (lower) and eg (higher)
    - Gap Δ₀ decides colour and spin
    alt: Crystal field splitting in an octahedral complex.
  activity:
    type: order
    prompt: Put these ligands in order of the spectrochemical series, weakest field first.
    steps:
    - I⁻
    - Br⁻
    - Cl⁻
    - F⁻
    - H₂O
    - NH₃
    - en (ethane-1,2-diamine)
    - CN⁻
    reasons:
      Br⁻: Br⁻ splits the d orbitals a little more than I⁻.
      Cl⁻: Cl⁻ is a stronger-field ligand than Br⁻.
      F⁻: F⁻ is the strongest of the halides.
      H₂O: Water splits more than the halide ions.
      NH₃: NH₃ is a stronger-field ligand than water.
      en (ethane-1,2-diamine): en binds through two N atoms and splits more than NH₃.
      CN⁻: 'CN⁻ is one of the strongest-field ligands: it usually forces low-spin complexes.'
  items:
  - prompt: In an octahedral field, how many d orbitals are in the lower t₂g set?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - t₂g and eg.
    - 3 + 2.
    solution: '3.'
  - prompt: '[Fe(CN)₆]⁴⁻ is low-spin d⁶. How many unpaired electrons does it have?'
    answer: '0'
    check: '0'
    difficulty: 2
    hints:
    - All six in t₂g.
    - Paired.
    solution: 0 (diamagnetic).
  - prompt: '[CoF₆]³⁻ is high-spin d⁶. How many unpaired electrons does it have?'
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - t₂g⁴ eg².
    - Four single.
    solution: '4.'
  - prompt: Which is a strong-field ligand?
    options:
    - CN⁻
    - I⁻
    - Cl⁻
    - F⁻
    answer: CN⁻
    difficulty: 1
    hints:
    - End of spectrochemical series.
    - Causes pairing.
    solution: CN⁻.
  - prompt: 'The hybridisation in a square planar complex like [Ni(CN)₄]²⁻ is:'
    options:
    - dsp²
    - sp³
    - d²sp³
    - sp³d²
    answer: dsp²
    difficulty: 2
    hints:
    - Square planar.
    - Uses one d.
    solution: dsp².
  - prompt: 'The colour of a complex is due to:'
    options:
    - d–d transitions absorbing visible light
    - emission of X-rays
    - the ligands' own colour only
    - nuclear reactions
    answer: d–d transitions absorbing visible light
    difficulty: 2
    hints:
    - Electron jumps t₂g → eg.
    - Complementary colour seen.
    solution: d–d transitions.
