# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse12-chem
chapter: 7
title: Alcohols, Phenols and Ethers
tips:
  c12c_acid: Phenol is more acidic than alcohols because the phenoxide ion is stabilised by resonance with the ring.
  c12c_lucas: "The Lucas test is fastest for the alcohol that forms the most stable carbocation. Which carbocation is most stable: 1°, 2° or 3°?"
  c12_bromine_phenol: "–OH activates the ring strongly, so bromine adds at every ortho and para position."
  c12_count_prefix: "'Tri' means three."
  c12_dehydration: "Hot concentrated H₂SO₄ removes water from ethanol."
  c12_kolbe: "Kolbe's reaction adds –COOH next to –OH. The product is used to make aspirin."
  c12_methanol: "Methanol is a poison; it is converted in the body to formaldehyde."
  c12_phenol_acidity: "Electron-withdrawing groups stabilise the phenoxide ion."
  c12_secondary_ox: "A secondary carbon has two other carbons attached; after oxidation the C=O sits between them."
  c12_triol: "'Tri-ol' means three OH groups."
  c12_williamson: "Williamson: an alkoxide plus an alkyl halide gives R–O–R."
concepts:
- code: cbse12c.alc.alcohols
  title: Alcohols
  notes: |
    Classification (mono-, di-, tri-hydric; 1°, 2°, 3°). Nomenclature. Preparation: hydration of alkenes, hydroboration–
    oxidation, reduction of carbonyls (NaBH₄, LiAlH₄), Grignard reagents with aldehydes/ketones. Physical properties: hydrogen
    bonding gives high boiling points and solubility. Reactions: with Na (acidic), esterification, dehydration (conc. H₂SO₄,
    alkenes), oxidation (1° → aldehyde → acid; 2° → ketone; 3° resistant), Lucas test (ZnCl₂/HCl). Methanol (poisonous,
    blindness) and ethanol (fermentation, denatured spirit).
  explanations:
    text: Alcohols have an –OH group on a carbon chain. Hydrogen bonding makes them boil higher than similar hydrocarbons. Primary alcohols oxidise to aldehydes and acids, secondary to ketones, and tertiary resist oxidation.
    visual: 'Draw three alcohols: the –OH carbon attached to one other carbon (primary), two (secondary) or three (tertiary). The more carbons around it, the faster it reacts in the Lucas test.'
    step_by_step: 'Step 1: Classify the alcohol. Step 2: Oxidation: 1° → aldehyde → acid; 2° → ketone; 3° → no reaction. Step 3: Lucas test speed: 3° > 2° > 1°.'
    real_world: Ethanol is blended into petrol in India (E20) to reduce oil imports.
  picture:
    kind: compare
    columns:
    - title: Alcohol
      points:
      - primary
      - secondary
      - tertiary
    - title: Oxidation product
      points:
      - aldehyde, then acid
      - ketone
      - resists oxidation
    - title: Lucas test
      points:
      - no cloudiness at room temperature
      - cloudy in about 5 min
      - cloudy at once
    alt: 'Primary, secondary and tertiary alcohols: oxidation and Lucas test.'
  activity:
    type: sort
    prompt: Primary, secondary or tertiary alcohol? Count the carbons attached to the C that carries –OH.
    bins:
    - Primary (1°)
    - Secondary (2°)
    - Tertiary (3°)
    items:
    - label: Ethanol, CH₃CH₂OH
      bin: Primary (1°)
      clue: How many C atoms touch the C–OH carbon?
      why: 'One: primary.'
    - label: Butan-1-ol
      bin: Primary (1°)
      clue: The –OH is on the end carbon. How many neighbours?
      why: 'One carbon neighbour: primary.'
    - label: Benzyl alcohol, C₆H₅CH₂OH
      bin: Primary (1°)
      clue: The –OH carbon is CH₂. How many carbons are bonded to it?
      why: 'Only the ring carbon: primary.'
    - label: Propan-2-ol, (CH₃)₂CHOH
      bin: Secondary (2°)
      clue: How many C atoms touch the middle carbon?
      why: 'Two: secondary.'
    - label: Butan-2-ol
      bin: Secondary (2°)
      clue: The –OH is on carbon 2. How many carbon neighbours?
      why: 'Two: secondary.'
    - label: Cyclohexanol
      bin: Secondary (2°)
      clue: In the ring, how many carbons touch the C–OH?
      why: 'Two ring neighbours: secondary.'
    - label: 2-Methylpropan-2-ol, (CH₃)₃COH
      bin: Tertiary (3°)
      clue: How many CH₃ groups are on the C–OH carbon?
      why: 'Three: tertiary.'
    - label: 2-Methylbutan-2-ol
      bin: Tertiary (3°)
      clue: Count the carbons bonded to C-2.
      why: 'Three: tertiary.'
  items:
  - prompt: 'Oxidation of a secondary alcohol gives a(n):'
    options:
    - ketone
    - aldehyde
    - carboxylic acid
    - ether
    answer: ketone
    difficulty: 1
    hints:
    - One H on the carbinol carbon.
    - C=O in chain.
    solution: A ketone.
    mistakes: {"aldehyde": "c12_secondary_ox", "carboxylic acid": "c12_secondary_ox", "ether": "c12_secondary_ox"}
  - prompt: Which alcohol gives immediate cloudiness in the Lucas test?
    options:
    - tertiary
    - secondary
    - primary
    - methanol
    answer: tertiary
    difficulty: 2
    hints:
    - Stable carbocation.
    - Fastest.
    solution: Tertiary.
    mistakes:
      primary: c12c_lucas
  - prompt: 'Alcohols have higher boiling points than alkanes of similar mass because of:'
    options:
    - hydrogen bonding
    - ionic bonds
    - metallic bonding
    - lower mass
    answer: hydrogen bonding
    difficulty: 1
    hints:
    - O–H groups.
    - Intermolecular.
    solution: Hydrogen bonding.
    mistakes: {"ionic bonds": "c11_h_bond", "metallic bonding": "c11_h_bond", "lower mass": "c11_h_bond"}
  - prompt: 'Drinking methanol can cause:'
    options:
    - blindness or death
    - nothing harmful
    - only a cold
    - stronger eyesight
    answer: blindness or death
    difficulty: 1
    hints:
    - Poisonous.
    - Spurious liquor.
    solution: Blindness or death.
    mistakes: {"nothing harmful": "c12_methanol", "only a cold": "c12_methanol", "stronger eyesight": "c12_methanol"}
  - prompt: 'Heating ethanol with concentrated H₂SO₄ at 443 K gives:'
    options:
    - ethene
    - ethanal
    - ethanoic acid
    - methane
    answer: ethene
    difficulty: 2
    hints:
    - Dehydration.
    - Loses water.
    solution: Ethene.
    mistakes: {"ethanal": "c12_dehydration", "ethanoic acid": "c12_dehydration", "methane": "c12_dehydration"}
  - prompt: How many –OH groups does glycerol (propane-1,2,3-triol) have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Tri-ol.
    - Three.
    solution: '3.'
    mistakes: {"1": "c12_triol", "2": "c12_triol"}
- code: cbse12c.alc.phenols
  title: Phenols and ethers
  after:
  - cbse12c.alc.alcohols
  notes: |
    Phenol C₆H₅OH: preparation (from chlorobenzene—Dow's process, from benzenesulfonic acid, diazonium salts, cumene). Acidity:
    phenol > water > alcohols; electron-withdrawing groups (–NO₂) increase acidity; reacts with NaOH (alcohols don't).
    Electrophilic substitution (–OH activates, o/p): bromine water gives 2,4,6-tribromophenol (white precipitate); nitration;
    Kolbe's reaction (salicylic acid); Reimer–Tiemann (salicylaldehyde). Ethers R–O–R: Williamson synthesis (alkoxide + 1° alkyl
    halide); cleavage by HI; anisole electrophilic substitution.
  explanations:
    text: 'Phenols have –OH directly on a benzene ring. They''re more acidic than alcohols because the ring stabilises the ion left behind. The –OH also makes the ring very reactive: phenol decolourises bromine water instantly. Ethers have an oxygen between two carbon groups.'
    visual: 'Draw the phenoxide ion with its negative charge spreading into the ring at the ortho and para positions: that spreading makes it stable, so phenol gives up H⁺ more easily than ethanol.'
    step_by_step: 'Step 1: Compare acidity: phenol > water > alcohol. Step 2: –NO₂ groups raise acidity. Step 3: Phenol + bromine water → white precipitate. Step 4: Ethers by Williamson synthesis.'
    real_world: Dettol and many antiseptics contain phenol derivatives; aspirin is made from salicylic acid via Kolbe's reaction.
  picture:
    kind: flow
    steps:
    - Phenol loses H⁺
    - Phenoxide ion forms
    - Charge spreads round the ring
    - Ion stabilised → more acidic
    alt: 'Why phenol is more acidic than alcohols: resonance stabilises the phenoxide ion.'
  activity:
    type: order
    prompt: Put these in order of acid strength, weakest first.
    steps:
    - Ethanol
    - Water
    - p-Cresol (4-methylphenol)
    - Phenol
    - p-Nitrophenol
    - 2,4,6-Trinitrophenol (picric acid)
    reasons:
      Water: 'Water is slightly more acidic than ethanol: the ethyl group pushes electrons onto O⁻ and destabilises ethoxide.'
      p-Cresol (4-methylphenol): Phenoxide ions are stabilised by resonance with the ring, so even cresol beats water.
      Phenol: The methyl group in cresol pushes electrons in, destabilising its anion, so phenol is a little stronger.
      p-Nitrophenol: –NO₂ pulls electrons out and spreads the negative charge further, so the anion is more stable.
      2,4,6-Trinitrophenol (picric acid): Three –NO₂ groups make picric acid almost as strong as a mineral acid.
  items:
  - prompt: Which is most acidic?
    options:
    - p-nitrophenol
    - phenol
    - ethanol
    - water
    answer: p-nitrophenol
    difficulty: 2
    hints:
    - –NO₂ withdraws electrons.
    - Stabilises the ion.
    solution: p-Nitrophenol.
    mistakes: {"phenol": "c12_phenol_acidity", "ethanol": "c12_phenol_acidity", "water": "c12_phenol_acidity"}
  - prompt: 'Phenol is more acidic than ethanol because:'
    options:
    - the phenoxide ion is resonance stabilised
    - it is heavier
    - it has more hydrogens
    - it is a gas
    answer: the phenoxide ion is resonance stabilised
    difficulty: 2
    hints:
    - Charge spreads.
    - Ring.
    solution: The phenoxide ion is stabilised by resonance.
    mistakes:
      it is heavier: c12c_acid
  - prompt: 'Phenol with bromine water gives:'
    options:
    - a white precipitate of 2,4,6-tribromophenol
    - no reaction
    - a blue solution
    - ethene
    answer: a white precipitate of 2,4,6-tribromophenol
    difficulty: 2
    hints:
    - Very reactive ring.
    - Three Br.
    solution: 2,4,6-tribromophenol, a white precipitate.
    mistakes: {"no reaction": "c12_bromine_phenol", "a blue solution": "c12_bromine_phenol", "ethene": "c12_bromine_phenol"}
  - prompt: 'Kolbe''s reaction of sodium phenoxide with CO₂ gives:'
    options:
    - salicylic acid
    - benzoic acid
    - phenol
    - aspirin directly
    answer: salicylic acid
    difficulty: 2
    hints:
    - o-hydroxybenzoic acid.
    - Used to make aspirin.
    solution: Salicylic acid.
    mistakes: {"benzoic acid": "c12_kolbe", "phenol": "c12_kolbe", "aspirin directly": "c12_kolbe"}
  - prompt: 'Williamson synthesis makes:'
    options:
    - ethers
    - alcohols
    - phenols
    - aldehydes
    answer: ethers
    difficulty: 1
    hints:
    - Alkoxide + alkyl halide.
    - R–O–R.
    solution: Ethers.
    mistakes: {"alcohols": "c12_williamson", "phenols": "c12_williamson", "aldehydes": "c12_williamson"}
  - prompt: How many bromine atoms are in 2,4,6-tribromophenol?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Tri.
    - Three.
    solution: '3.'
    mistakes: {"1": "c12_count_prefix", "2": "c12_count_prefix", "6": "c12_count_prefix"}
