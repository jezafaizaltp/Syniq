# CBSE Class 12 Chemistry (NCERT, rationalised syllabus), chapter 7. Format: content/README.md.
subject: cbse12-chem
chapter: 7
title: Alcohols, Phenols and Ethers
tips:
  c12c_acid: Phenol is more acidic than alcohols because the phenoxide ion is stabilised by resonance with the ring.
  c12c_lucas: "The Lucas test is fastest for the alcohol that forms the most stable carbocation. Which carbocation is most stable: 1°, 2° or 3°?"
  c12_bromine_phenol: "–OH activates the ring strongly, so bromine adds at every ortho and para position."
  c12_count_prefix: "'Tri' means three."
  c12_dehydration: "Hot concentrated H₂SO₄ removes water from ethanol."
  c12_kolbe: "Kolbe's reaction adds –COOH next to –OH. The product is used to make aspirin."
  c12_methanol: "Methanol is a poison; it is converted in the body to formaldehyde."
  c12_phenol_acidity: "Electron-withdrawing groups stabilise the phenoxide ion."
  c12_secondary_ox: "A secondary carbon has two other carbons attached; after oxidation the C=O sits between them."
  c12_triol: "'Tri-ol' means three OH groups."
  c12_williamson: "Williamson: an alkoxide plus an alkyl halide gives R–O–R."
  c12c7_alc: 'Classify the alcohol by the carbon holding –OH, then recall: 1° oxidises to aldehyde then acid, 2° to ketone, 3° resists.'
  c12c7_phen: "Compare how stable each ion is after losing H⁺. An ion whose charge can spread over a ring by resonance is more stable, so its parent gives up H⁺ more easily."
  c12c7_name: "Match each named reaction with the group it puts on the ring: −CHO, −COOH, or an ether link."
  c12c7_grig: 'Count the carbons on the C=O you start with: the Grignard adds one more group to that carbon.'
  c12c7_toxic: The body oxidises each alcohol to an aldehyde. Which one gives the smallest, most toxic aldehyde?
  c12c7_williamson: Williamson is SN2. Which halide can be attacked without eliminating?
concepts:
- code: cbse12c.alc.alcohols
  title: Alcohols
  notes: |
    Classification (mono-, di-, tri-hydric; 1°, 2°, 3°). Nomenclature. Preparation: hydration of alkenes, hydroboration–
    oxidation, reduction of carbonyls (NaBH₄, LiAlH₄), Grignard reagents with aldehydes/ketones. Physical properties: hydrogen
    bonding gives high boiling points and solubility. Reactions: with Na (acidic), esterification, dehydration (conc. H₂SO₄,
    alkenes), oxidation (1° → aldehyde → acid; 2° → ketone; 3° resistant), Lucas test (ZnCl₂/HCl). Methanol (poisonous,
    blindness) and ethanol (fermentation, denatured spirit).
  explanations:
    text: Alcohols have an –OH group on a carbon chain. Hydrogen bonding makes them boil higher than similar hydrocarbons. Primary alcohols oxidise to aldehydes and acids, secondary to ketones, and tertiary resist oxidation.
    visual: 'Draw three alcohols: the –OH carbon attached to one other carbon (primary), two (secondary) or three (tertiary). The more carbons around it, the faster it reacts in the Lucas test.'
    step_by_step: 'Step 1: Classify the alcohol. Step 2: Oxidation: 1° → aldehyde → acid; 2° → ketone; 3° → no reaction. Step 3: Lucas test speed: 3° > 2° > 1°.'
    real_world: Ethanol is blended into petrol in India (E20) to reduce oil imports.
  picture:
    kind: compare
    columns:
    - title: Alcohol
      points:
      - primary
      - secondary
      - tertiary
    - title: Oxidation product
      points:
      - aldehyde, then acid
      - ketone
      - resists oxidation
    - title: Lucas test
      points:
      - no cloudiness at room temperature
      - cloudy in about 5 min
      - cloudy at once
    alt: 'Primary, secondary and tertiary alcohols: oxidation and Lucas test.'
  activity:
    type: sort
    prompt: Primary, secondary or tertiary alcohol? Count the carbons attached to the C that carries –OH.
    bins:
    - Primary (1°)
    - Secondary (2°)
    - Tertiary (3°)
    items:
    - label: Ethanol, CH₃CH₂OH
      bin: Primary (1°)
      clue: How many C atoms touch the C–OH carbon?
      why: 'One: primary.'
    - label: Butan-1-ol
      bin: Primary (1°)
      clue: The –OH is on the end carbon. How many neighbours?
      why: 'One carbon neighbour: primary.'
    - label: Benzyl alcohol, C₆H₅CH₂OH
      bin: Primary (1°)
      clue: The –OH carbon is CH₂. How many carbons are bonded to it?
      why: 'Only the ring carbon: primary.'
    - label: Propan-2-ol, (CH₃)₂CHOH
      bin: Secondary (2°)
      clue: How many C atoms touch the middle carbon?
      why: 'Two: secondary.'
    - label: Butan-2-ol
      bin: Secondary (2°)
      clue: The –OH is on carbon 2. How many carbon neighbours?
      why: 'Two: secondary.'
    - label: Cyclohexanol
      bin: Secondary (2°)
      clue: In the ring, how many carbons touch the C–OH?
      why: 'Two ring neighbours: secondary.'
    - label: 2-Methylpropan-2-ol, (CH₃)₃COH
      bin: Tertiary (3°)
      clue: How many CH₃ groups are on the C–OH carbon?
      why: 'Three: tertiary.'
    - label: 2-Methylbutan-2-ol
      bin: Tertiary (3°)
      clue: Count the carbons bonded to C-2.
      why: 'Three: tertiary.'
  lesson:
    - teach: Alcohols have –OH on an sp³ carbon. Classify by number of –OH groups (mono-, di-, trihydric) and by the carbon bearing –OH (1°, 2°, 3°). Hydrogen bonding gives them high boiling points and lets small alcohols mix with water.
      check:
        prompt: Why does ethanol boil far higher than propane of similar mass?
        options:
        - hydrogen bonding between ethanol molecules
        - ethanol is heavier
        - propane is ionic
        answer: hydrogen bonding between ethanol molecules
        why: –OH groups hold molecules together.
      ways:
      - style: visual
        teach: Why alcohols boil higher than alkanes of similar size.
        picture:
          kind: bars
          unit: boiling point (K)
          bars:
          - label: Propane (44 g/mol)
            value: 231
          - label: Ethanol (46 g/mol)
            value: 351
          alt: Propane, molar mass 44, boils at 231 kelvin. Ethanol, molar mass 46, boils at 351 kelvin, because its molecules hold each other by hydrogen bonds.
      - style: real_world
        teach: Hand sanitiser feels cold and dries quickly, yet doesn't vanish as fast as you'd expect for such a small molecule. Ethanol's hydrogen bonds hold it back. They also let it mix completely with water, which is why sanitiser gel is a single clear liquid.
    - teach: 'Preparation: hydration of alkenes, hydroboration–oxidation, reduction of aldehydes/ketones (NaBH₄, LiAlH₄), Grignard reagents with carbonyls (HCHO → 1°, other aldehydes → 2°, ketones → 3°). Ethanol is made by fermentation; methanol is poisonous.'
      picture:
        kind: compare
        columns:
        - title: 'Grignard + '
          points:
          - HCHO
          - other aldehyde
          - ketone
        - title: Alcohol formed
          points:
          - 1°
          - 2°
          - 3°
        alt: Which alcohol type each carbonyl gives with a Grignard reagent.
      check:
        prompt: CH₃MgBr + propanone, then water, gives which alcohol type?
        options:
        - 3°
        - 2°
        - 1°
        answer: 3°
        why: A ketone gives a tertiary alcohol.
      ways:
      - style: visual
        teach: Which Grignard reaction gives which kind of alcohol.
        picture:
          kind: compare
          columns:
          - title: HCHO + RMgX
            points:
            - Primary alcohol
            - RCH₂OH
          - title: R'CHO + RMgX
            points:
            - Secondary alcohol
            - R'CH(OH)R
          - title: Ketone + RMgX
            points:
            - Tertiary alcohol
            - three groups on C–OH
          alt: Methanal with a Grignard reagent gives a primary alcohol. Any other aldehyde gives a secondary alcohol. A ketone gives a tertiary alcohol with three groups on the carbon holding OH.
      - style: step_by_step
        teach: 'Make 2-methylbutan-2-ol. Step 1: The –OH carbon carries CH₃, CH₃ and C₂H₅: tertiary. Step 2: So start from a ketone. Step 3: Propanone + C₂H₅MgBr adds the ethyl group to the C=O carbon. Step 4: Add water to get 2-methylbutan-2-ol.'
    - teach: 'Reactions: with Na gives H₂ (alcohols are weakly acidic); with acids gives esters; with conc. H₂SO₄ when hot gives alkenes. Oxidation: 1° → aldehyde → carboxylic acid; 2° → ketone; 3° resists. Lucas test (ZnCl₂ + HCl): 3° cloudy at once, 2° in about 5 minutes, 1° not at room temperature.'
      check:
        prompt: 'Propan-2-ol on oxidation gives:'
        options:
        - propanone
        - propanal
        - propanoic acid
        answer: propanone
        why: It is a secondary alcohol, so it gives a ketone.
      ways:
      - style: visual
        teach: Primary, secondary and tertiary alcohols compared in oxidation and the Lucas test.
        picture:
          kind: compare
          columns:
          - title: Primary
            points:
            - Oxidised to aldehyde, then acid
            - 'Lucas: no cloudiness when cold'
          - title: Secondary
            points:
            - Oxidised to ketone
            - 'Lucas: cloudy in about 5 min'
          - title: Tertiary
            points:
            - Resists oxidation
            - 'Lucas: cloudy at once'
          alt: A primary alcohol oxidises to an aldehyde and then an acid, and stays clear in the Lucas test when cold. A secondary alcohol oxidises to a ketone and turns cloudy in about five minutes. A tertiary alcohol resists oxidation and turns cloudy at once.
      - style: step_by_step
        teach: 'Oxidise propan-1-ol step by step. Step 1: It is primary: –CH₂OH. Step 2: Mild oxidation (PCC) stops at propanal. Step 3: Strong oxidant (acidified KMnO₄) goes further. Step 4: Final product is propanoic acid.'
  items:
  - prompt: 'Oxidation of a secondary alcohol gives a(n):'
    options:
    - ketone
    - aldehyde
    - carboxylic acid
    - ether
    answer: ketone
    difficulty: 1
    hints:
    - One H on the carbinol carbon.
    - C=O in chain.
    solution: "R₂CH–OH loses its one C–H hydrogen and the O–H hydrogen to give R₂C=O, a ketone."
    mistakes: {"aldehyde": "c12_secondary_ox", "carboxylic acid": "c12_secondary_ox", "ether": "c12_secondary_ox"}
  - prompt: Which alcohol gives immediate cloudiness in the Lucas test?
    options:
    - tertiary
    - secondary
    - primary
    - methanol
    answer: tertiary
    difficulty: 2
    hints:
    - Stable carbocation.
    - Fastest.
    solution: "Tertiary alcohols form a stable carbocation fastest, so the insoluble chloride appears at once."
    mistakes:
      primary: c12c_lucas
  - prompt: 'Alcohols have higher boiling points than alkanes of similar mass because of:'
    options:
    - hydrogen bonding
    - ionic bonds
    - metallic bonding
    - lower mass
    answer: hydrogen bonding
    difficulty: 1
    hints:
    - O–H groups.
    - Intermolecular.
    solution: "The –OH groups hydrogen-bond to each other, which takes extra energy to break."
    mistakes: {"ionic bonds": "c11_h_bond", "metallic bonding": "c11_h_bond", "lower mass": "c11_h_bond"}
  - prompt: 'Drinking methanol can cause:'
    options:
    - blindness or death
    - nothing harmful
    - only a cold
    - stronger eyesight
    answer: blindness or death
    difficulty: 1
    hints:
    - Poisonous.
    - Spurious liquor.
    solution: "The body turns methanol into methanal and methanoic acid, which can cause blindness or death."
    mistakes: {"nothing harmful": "c12_methanol", "only a cold": "c12_methanol", "stronger eyesight": "c12_methanol"}
  - prompt: 'Heating ethanol with concentrated H₂SO₄ at 443 K gives:'
    options:
    - ethene
    - ethanal
    - ethanoic acid
    - methane
    answer: ethene
    difficulty: 2
    hints:
    - Dehydration.
    - Loses water.
    solution: "At 443 K the acid removes water from ethanol (dehydration): CH₃CH₂OH → CH₂=CH₂ + H₂O."
    mistakes: {"ethanal": "c12_dehydration", "ethanoic acid": "c12_dehydration", "methane": "c12_dehydration"}
  - prompt: How many –OH groups does glycerol (propane-1,2,3-triol) have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Tri-ol.
    - Three.
    solution: "Propane-1,2,3-triol has an –OH on each of carbons 1, 2 and 3: 3 groups."
    mistakes: {"1": "c12_triol", "2": "c12_triol"}
  - prompt: Ethanol is which type of alcohol?
    options:
    - primary
    - secondary
    - tertiary
    answer: primary
    difficulty: 1
    hints:
    - CH₃CH₂OH.
    - The –OH carbon has one other C.
    solution: 'Step 1: one C attached. Step 2: primary.'
    mistakes:
      secondary: c12c7_alc
      tertiary: c12c7_alc
  - prompt: 'Oxidation of a primary alcohol finally gives a(n):'
    options:
    - carboxylic acid
    - ketone
    - ether
    answer: carboxylic acid
    difficulty: 1
    hints:
    - First an aldehyde forms.
    - With strong oxidiser it goes further.
    solution: 'Step 1: alcohol → aldehyde. Step 2: → carboxylic acid.'
    mistakes:
      ketone: c12c7_alc
      ether: c12c7_alc
  - prompt: How many –OH groups does ethane-1,2-diol (glycol) have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Read 'diol'.
    - One on each carbon.
    solution: 'Step 1: diol. Step 2: 2.'
    mistakes:
      '1': c12c7_alc
      '3': c12c7_alc
  - prompt: 'Ethanol + sodium gives sodium ethoxide and:'
    options:
    - hydrogen gas
    - oxygen gas
    - water
    answer: hydrogen gas
    difficulty: 2
    hints:
    - Alcohols are weak acids here.
    - Like water with sodium.
    solution: 'Step 1: O–H hydrogen is replaced. Step 2: H₂ is released.'
    mistakes:
      oxygen gas: c12c7_alc
      water: c12c7_alc
  - prompt: 'HCHO + CH₃MgBr, then water, gives:'
    options:
    - ethanol
    - methanol
    - propan-2-ol
    answer: ethanol
    difficulty: 2
    hints:
    - HCHO gives a primary alcohol.
    - One carbon is added.
    solution: 'Step 1: CH₃ adds to C of HCHO. Step 2: CH₃CH₂OH.'
    mistakes:
      methanol: c12c7_alc
      propan-2-ol: c12c7_alc
  - prompt: Which reducing agent turns propanone into propan-2-ol?
    options:
    - NaBH₄
    - KMnO₄
    - conc. H₂SO₄
    answer: NaBH₄
    difficulty: 2
    hints:
    - We need to add hydrogen.
    - KMnO₄ oxidises.
    solution: 'Step 1: reduction of C=O. Step 2: NaBH₄.'
    mistakes:
      KMnO₄: c12c7_alc
      conc. H₂SO₄: c12c7_alc
  - prompt: 'Denatured spirit is ethanol made unfit to drink by adding:'
    options:
    - methanol and other substances
    - sugar
    - water only
    answer: methanol and other substances
    difficulty: 2
    hints:
    - It must be poisonous.
    - Often with a dye.
    solution: 'Step 1: to stop misuse. Step 2: methanol (and pyridine, dyes) is added.'
    mistakes:
      sugar: c12c7_alc
      water only: c12c7_alc
  - prompt: In the Lucas test, which turns cloudy in about 5 minutes?
    options:
    - a secondary alcohol
    - a tertiary alcohol
    - a primary alcohol
    answer: a secondary alcohol
    difficulty: 3
    hints:
    - Tertiary is immediate.
    - Primary does not react at room temperature.
    solution: 'Step 1: 3° fast, 1° no. Step 2: 2° in about 5 min.'
    mistakes:
      a tertiary alcohol: c12c7_alc
      a primary alcohol: c12c7_alc
  - prompt: Why do tertiary alcohols resist oxidation?
    options:
    - the –OH carbon has no hydrogen to lose
    - they have no –OH
    - they are gases
    answer: the –OH carbon has no hydrogen to lose
    difficulty: 3
    hints:
    - Oxidation removes H from the carbinol carbon.
    - Count the H on that carbon.
    solution: 'Step 1: 3° carbon has three C groups. Step 2: no H to remove.'
    mistakes:
      they have no –OH: c12c7_alc
      they are gases: c12c7_alc
  - prompt: 'Assertion (A): Ethanol dissolves in water in all proportions, but hexan-1-ol barely dissolves.

      Reason (R): As the alkyl chain gets longer, its water-repelling part outweighs the –OH group''s hydrogen bonding.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Short alcohols hydrogen bond with water easily; a long chain dominates in hexanol and makes it poorly soluble. R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A batch of illegal liquor caused blindness in many people. Lab tests found an alcohol in it. Which alcohol is the likely cause?'
    options:
    - Methanol
    - Ethanol
    - Glycerol
    answer: Methanol
    hints:
    - One small alcohol is converted in the body to a toxic aldehyde.
    - Which alcohol is added to denature spirit so people won't drink it?
    solution: Methanol is oxidised in the liver to methanal, which damages the optic nerve and can cause blindness or death.
    mistakes:
      Ethanol: c12c7_toxic
      Glycerol: c12c7_toxic
    exam: case
    difficulty: 2
  - prompt: A chemist wants to make a tertiary alcohol using CH₃MgBr. Which carbonyl compound should they start with?
    options:
    - Propanone
    - Ethanal
    - Methanal
    answer: Propanone
    hints:
    - A tertiary –OH carbon has three carbon groups.
    - Which starting carbonyl already has two?
    solution: A ketone already has two groups on its C=O carbon; the Grignard adds a third, giving a tertiary alcohol.
    mistakes:
      Ethanal: c12c7_grig
      Methanal: c12c7_grig
    exam: competency
    difficulty: 2
- code: cbse12c.alc.phenols
  title: Phenols and ethers
  after:
  - cbse12c.alc.alcohols
  notes: |
    Phenol C₆H₅OH: preparation (from chlorobenzene—Dow's process, from benzenesulfonic acid, diazonium salts, cumene). Acidity:
    phenol > water > alcohols; electron-withdrawing groups (–NO₂) increase acidity; reacts with NaOH (alcohols don't).
    Electrophilic substitution (–OH activates, o/p): bromine water gives 2,4,6-tribromophenol (white precipitate); nitration;
    Kolbe's reaction (salicylic acid); Reimer–Tiemann (salicylaldehyde). Ethers R–O–R: Williamson synthesis (alkoxide + 1° alkyl
    halide); cleavage by HI; anisole electrophilic substitution.
  explanations:
    text: 'Phenols have –OH directly on a benzene ring. They''re more acidic than alcohols because the ring stabilises the ion left behind. The –OH also makes the ring very reactive: phenol decolourises bromine water instantly. Ethers have an oxygen between two carbon groups.'
    visual: 'Draw the phenoxide ion with its negative charge spreading into the ring at the ortho and para positions: that spreading makes it stable, so phenol gives up H⁺ more easily than ethanol.'
    step_by_step: 'Step 1: Compare acidity: phenol > water > alcohol. Step 2: –NO₂ groups raise acidity. Step 3: Phenol + bromine water → white precipitate. Step 4: Ethers by Williamson synthesis.'
    real_world: Dettol and many antiseptics contain phenol derivatives; aspirin is made from salicylic acid via Kolbe's reaction.
  picture:
    kind: flow
    steps:
    - Phenol loses H⁺
    - Phenoxide ion forms
    - Charge spreads round the ring
    - Ion stabilised → more acidic
    alt: 'Why phenol is more acidic than alcohols: resonance stabilises the phenoxide ion.'
  activity:
    type: order
    prompt: Put these in order of acid strength, weakest first.
    steps:
    - Ethanol
    - Water
    - p-Cresol (4-methylphenol)
    - Phenol
    - p-Nitrophenol
    - 2,4,6-Trinitrophenol (picric acid)
    reasons:
      Water: 'Water is slightly more acidic than ethanol: the ethyl group pushes electrons onto O⁻ and destabilises ethoxide.'
      p-Cresol (4-methylphenol): Phenoxide ions are stabilised by resonance with the ring, so even cresol beats water.
      Phenol: The methyl group in cresol pushes electrons in, destabilising its anion, so phenol is a little stronger.
      p-Nitrophenol: –NO₂ pulls electrons out and spreads the negative charge further, so the anion is more stable.
      2,4,6-Trinitrophenol (picric acid): Three –NO₂ groups make picric acid almost as strong as a mineral acid.
  lesson:
    - teach: Phenol, C₆H₅OH, has –OH on a benzene ring. It is made from chlorobenzene (Dow's process), benzenesulfonic acid, diazonium salts or cumene. Phenol is more acidic than water and alcohols because the phenoxide ion is stabilised by resonance; it dissolves in NaOH, alcohols do not.
      check:
        prompt: Which dissolves in NaOH solution?
        options:
        - phenol
        - ethanol
        - both equally
        answer: phenol
        why: Phenol is acidic enough to form sodium phenoxide.
      ways:
      - style: visual
        teach: Ethanol, phenol and a carboxylic acid compared by acid strength, and why.
        picture:
          kind: compare
          columns:
          - title: Ethanol
            points:
            - Ethoxide charge stuck on O
            - Alkyl pushes electrons in
            - Weakest acid
          - title: Phenol
            points:
            - Phenoxide charge spread into the ring
            - Dissolves in NaOH
            - Weak acid
          - title: Carboxylic acid
            points:
            - Charge shared by two O atoms
            - Fizzes with NaHCO₃
            - Strongest of the three
          alt: Ethanol's ion keeps its charge stuck on oxygen and the alkyl group pushes electrons in, so it is the weakest acid. Phenol's ion spreads charge into the ring and phenol dissolves in sodium hydroxide. A carboxylic acid shares the charge over two oxygens and fizzes with sodium bicarbonate, the strongest of the three.
      - style: real_world
        teach: Phenol was the first hospital antiseptic. Joseph Lister sprayed 'carbolic acid' in operating rooms in the 1860s and deaths from infection fell. Its weak acidity and its ability to damage microbe proteins made it work, but it also burns skin.
    - teach: 'Electron-withdrawing groups (–NO₂) at ortho/para increase acidity; electron-donating groups (–CH₃) decrease it. The –OH group activates the ring and directs to ortho and para: bromine water gives white 2,4,6-tribromophenol at once; Kolbe''s reaction gives salicylic acid; Reimer–Tiemann gives salicylaldehyde.'
      picture:
        kind: flow
        steps:
        - p-cresol (least acidic)
        - phenol
        - p-nitrophenol
        - 2,4,6-trinitrophenol (most acidic)
        alt: Acidity rises as electron-withdrawing nitro groups are added.
      check:
        prompt: 'Which is more acidic: phenol or p-cresol?'
        options:
        - phenol
        - p-cresol
        - equal
        answer: phenol
        why: –CH₃ donates electrons, destabilising the anion.
      ways:
      - style: step_by_step
        teach: 'Rank o-cresol (methylphenol) and o-nitrophenol. Step 1: –CH₃ pushes electrons into the ring. Step 2: That destabilises the phenoxide ion. Step 3: –NO₂ pulls electrons out and spreads the charge. Step 4: So o-nitrophenol is more acidic than o-cresol.'
      - style: real_world
        teach: Aspirin starts with phenol. Kolbe's reaction puts –COOH on the ring next to –OH, making salicylic acid, and then an acetyl group is added. A pharmacy shelf traces back to this textbook reaction.
    - teach: 'Ethers R–O–R′ are made by Williamson synthesis: sodium alkoxide + primary alkyl halide (SN2). HI cleaves ethers into an alcohol and an alkyl iodide. Anisole (methoxybenzene) undergoes electrophilic substitution at ortho and para.'
      check:
        prompt: 'To make CH₃–O–C(CH₃)₃ by Williamson, use:'
        options:
        - (CH₃)₃CONa + CH₃Br
        - CH₃ONa + (CH₃)₃CBr
        - either works equally
        answer: (CH₃)₃CONa + CH₃Br
        why: A tertiary halide would eliminate instead of substituting.
      ways:
      - style: visual
        teach: 'Williamson synthesis: pick the right pair.'
        picture:
          kind: compare
          columns:
          - title: Works
            points:
            - (CH₃)₃C–O⁻Na⁺ + CH₃Br
            - SN2 on a methyl halide
            - Gives the ether
          - title: Fails
            points:
            - CH₃O⁻Na⁺ + (CH₃)₃CBr
            - Alkoxide acts as a base
            - Gives an alkene instead
          alt: To make tert-butyl methyl ether, sodium tert-butoxide with bromomethane works by SN2 on the methyl halide. Sodium methoxide with tert-butyl bromide fails because the alkoxide acts as a base, giving an alkene instead.
      - style: step_by_step
        teach: 'Methoxyethane with hot HI. Step 1: The ether O is protonated. Step 2: I⁻ attacks the less crowded carbon by SN2. Step 3: That is the methyl carbon. Step 4: Products: CH₃I and ethanol.'
  items:
  - prompt: Which is most acidic?
    options:
    - p-nitrophenol
    - phenol
    - ethanol
    - water
    answer: p-nitrophenol
    difficulty: 2
    hints:
    - –NO₂ withdraws electrons.
