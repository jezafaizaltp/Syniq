subject: cbse4-eng
chapter: 8
title: 'The Lagori Champions (Unit 3: Fun with Games)'
concepts:
- code: cbse4e.u3.lagori
  title: 'The Lagori Champions (Unit 3: Fun with Games)'
  notes: |
    A story about children playing lagori (also called pittu or seven stones), a traditional Indian team game. Seven flat
    stones are stacked; one team throws a ball to knock them down, then tries to rebuild the stack while the other team
    tries to hit them with the ball. It needs teamwork, aim and quick thinking. Exact story details are not reproduced
    here.
  explanations:
    text: Lagori is an old Indian game played with seven flat stones and a ball. One team knocks the pile down with the ball, then rushes to stack it again while the other team tries to tag them with the ball. Winning needs teamwork and quick thinking.
    visual: Draw a pile of seven flat stones, a ball flying towards it, and two teams of children ready to run.
    step_by_step: 1. Stack seven stones. 2. Throw the ball to knock them down. 3. Rebuild the stack. 4. Avoid being hit by the other team.
    real_world: Lagori is played in streets and schoolgrounds across India; it is also called pittu, sat-patthar or ezhu kallu.
  picture:
    kind: flow
    steps:
    - Stack seven stones
    - Knock them down with a ball
    - Team rebuilds the stack
    - Other team tries to hit them
    alt: 'Lagori: stack seven stones, knock them down with a ball, rebuild the stack while the other team tries to hit you.'
