# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 8. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 8
title: 'The Lagori Champions (Unit 3: Fun with Games)'
tips:
  e4_lagori_ball: "In lagori you throw something round at a pile of stones."
  e4_lagori_team: "Lagori is played outside with two sides."
  e4_lagori_win: "Lagori is played outdoors in teams. What helps a team win?"
  e4_spelling: "Say it slowly: st-o-n-e-s. Don't drop the silent e."
  c4e8_game: 'Picture a lagori game: the stack of stones, the ball, the two teams. What does each team try to do?'
  c4e8_play: Ask what helps a team win and still keeps the game fun and fair for everyone.
  c4e8_word: Put each choice into the sentence and read it aloud. Which keeps the meaning?

concepts:
- code: cbse4e.u3.lagori
  title: 'The Lagori Champions (Unit 3: Fun with Games)'
  notes: |
    A story about children playing lagori (also called pittu or seven stones), a traditional Indian team game. Seven flat
    stones are stacked; one team throws a ball to knock them down, then tries to rebuild the stack while the other team
    tries to hit them with the ball. It needs teamwork, aim and quick thinking. Exact story details are not reproduced
    here.
  explanations:
    text: Lagori is an old Indian game played with seven flat stones and a ball. One team knocks the pile down with the ball, then rushes to stack it again while the other team tries to tag them with the ball. Winning needs teamwork and quick thinking.
    visual: Draw a pile of seven flat stones, a ball flying towards it, and two teams of children ready to run.
    step_by_step: 1. Stack seven stones. 2. Throw the ball to knock them down. 3. Rebuild the stack. 4. Avoid being hit by the other team.
    real_world: Lagori is played in streets and schoolgrounds across India; it is also called pittu, sat-patthar or ezhu kallu.
  picture:
    kind: flow
    steps:
    - Stack seven stones
    - Knock them down with a ball
    - Team rebuilds the stack
    - Other team tries to hit them
    alt: 'Lagori: stack seven stones, knock them down with a ball, rebuild the stack while the other team tries to hit you.'
  activity:
    type: order
    prompt: 'The Lagori Champions: how is lagori played?'
    steps:
    - Stack seven flat stones
    - One team throws a ball to knock them down
    - They try to rebuild the stack
    - The other team tries to hit them with the ball
    reasons:
      One team throws a ball to knock them down: The stack must be built first.
      They try to rebuild the stack: Now the stones are scattered.
      The other team tries to hit them with the ball: While they rebuild, the others stop them.
  lesson:
    - teach: Lagori (also called pittu or seven stones) is a traditional Indian team game. Seven flat stones are stacked in a pile. One team throws a ball to knock the pile down.
      check:
        prompt: What do the players first try to knock down?
        options:
        - a pile of seven stones
        - a tree
        - a wall
        answer: a pile of seven stones
        why: The game starts by hitting the stack.
      ways:
      - style: visual
        teach: 'How a round of lagori begins: the stack, the ball and the throw.'
        picture:
          kind: flow
          steps:
          - Seven flat stones are stacked in a pile
          - Two teams stand ready
          - A player from one team throws the ball
          - The ball knocks the pile down
          alt: Seven flat stones are stacked in a pile. Two teams stand ready. A player from one team throws the ball and knocks the pile down.
      - style: real_world
        teach: 'Lagori needs no costly kit: a few flat stones and a soft ball. That is why children in villages and city lanes across India can play it almost anywhere.'
    - teach: Then that team rushes to rebuild the stack, while the other team tries to hit them with the ball to stop them. Rebuilding the stack wins the round.
      picture:
        kind: flow
        steps:
        - stack 7 stones
        - Team A knocks them down
        - Team A rebuilds the pile
        - Team B tries to tag them with the ball
        alt: How a round of lagori goes.
      check:
        prompt: What does the other team try to do while the stones are rebuilt?
        options:
        - hit the players with the ball
        - help stack the stones
        - sit and watch
        answer: hit the players with the ball
        why: That stops the rebuilding.
      ways:
      - style: step_by_step
        teach: 'Play a team''s turn after the stack falls. Step 1: The throwing team runs to rebuild the stones. Step 2: The other team picks up the ball. Step 3: They try to hit a rebuilder below the knees with it. Step 4: If the stack is rebuilt first, the throwing team wins the round.'
      - style: real_world
        teach: In lagori, some players are good at rebuilding fast while others are good at dodging. A clever team gives each player the job that suits them best.
    - teach: Lagori needs teamwork, good aim and quick thinking. A champion is a winner, but good champions also play fairly and respect the other team.
      check:
        prompt: Which skill helps most to knock down the stack?
        options:
        - good aim
        - loud shouting
        - sleeping well during the game
        answer: good aim
        why: You must hit a small pile from a distance.
      ways:
      - style: visual
        teach: What makes a good champion, beyond just winning.
        picture:
          kind: compare
          columns:
          - title: Skills to win
            points:
            - Teamwork
            - Good aim
            - Quick thinking
          - title: Being a good champion
            points:
            - Playing fairly
            - Respecting the other team
            - Shaking hands after the game
          alt: To win at lagori you need teamwork, good aim and quick thinking. A good champion also plays fairly, respects the other team and shakes hands after the game.
      - style: real_world
        teach: In big cricket and hockey matches, players line up and shake hands at the end, whoever wins. It shows the game matters, but respect matters more.
  items:
  - prompt: How many stones are used in lagori?
    options:
    - seven
    - two
    - ten
    - one
    answer: seven
    difficulty: 1
    hints:
    - "Count the flat stones piled up in the story."
    - Sat-patthar.
    solution: Lagori uses seven stones.
    mistakes:
      two: eng4_read_again
  - prompt: What is used to knock the stones down?
    options:
    - a ball
    - a bat
    - a kite
    - a stick only
    answer: a ball
    difficulty: 1
    hints:
    - You throw it.
    - Round.
    solution: A ball knocks the stones down.
    mistakes: {"a bat": "e4_lagori_ball"}
  - prompt: 'Lagori is a:'
    options:
    - team game
    - board game played alone
    - swimming race
    - card game
    answer: team game
    difficulty: 1
    hints:
    - Two sides.
    - Teams.
    solution: Lagori is played in teams.
    mistakes: {"board game played alone": "e4_lagori_team"}
  - prompt: What do you need to win at lagori?
    options:
    - "teamwork and quick thinking"
    - "a computer and a keyboard"
    - "a big swimming pool nearby"
    - "complete silence from all"
    answer: teamwork and quick thinking
    difficulty: 2
    hints:
    - Rebuild fast.
    - Help each other.
    solution: Teamwork and quick thinking win.
    mistakes: {"a computer and a keyboard": "e4_lagori_win"}
  - prompt: 'A ''champion'' is:'
    options:
    - a winner
    - a loser
    - a referee
    - a spectator
    answer: a winner
    difficulty: 1
    hints:
    - Title of the lesson.
    - First place.
    solution: A champion is a winner.
    mistakes:
      a loser: eng4_word
  - prompt: 'Choose the word with the correct spelling:'
    options:
    - stones
    - stons
    - stoness
    - stonez
    answer: stones
    difficulty: 1
    hints:
    - Stone + s.
    - Many stones.
    solution: Stones is correct.
    mistakes: {"stons": "e4_spelling"}
  - prompt: 'Lagori is also known as:'
    options:
    - pittu or seven stones
    - chess
    - kho-kho
    answer: pittu or seven stones
    difficulty: 1
    hints:
    - It is named after what you stack.
    - How many stones are there?
    solution: 'Step 1: The game uses seven stones. Step 2: It is also called pittu or seven stones.'
    mistakes:
      chess: c4e8_game
      kho-kho: c4e8_game
  - prompt: Why is lagori called a team game?
    options:
    - "players work together in teams"
    - "it is always played alone"
    - "it needs a computer to play"
    answer: players work together in teams
    difficulty: 1
    hints:
    - Two sides play against each other.
    - Do players help each other?
    solution: 'Step 1: Two teams play. Step 2: Players on each team work together.'
    mistakes:
      "it is always played alone": c4e8_game
      "it needs a computer to play": c4e8_game
  - prompt: What is 'aim'?
    options:
    - "pointing at a target before you throw"
    - "running away as fast as you can"
    - "a special kind of flat stone"
    answer: pointing at a target before you throw
    difficulty: 2
    hints:
    - Archers do this before shooting.
    - It helps you hit what you want.
    solution: 'Step 1: Before throwing you look at the target. Step 2: That is taking aim.'
    mistakes:
      "running away as fast as you can": c4e8_word
      "a special kind of flat stone": c4e8_word
  - prompt: Your team loses a lagori match. What should you do?
    options:
    - shake hands and congratulate the winners
    - throw the ball at them in anger
    - say they cheated
    answer: shake hands and congratulate the winners
    difficulty: 1
    hints:
    - Good players are good losers too.
    - What shows respect?
    solution: 'Step 1: Losing is part of games. Step 2: Congratulating the winners is good sport.'
    mistakes:
      throw the ball at them in anger: c4e8_play
      say they cheated: c4e8_play
  - prompt: Which word means the same as 'champions'?
    options:
    - winners
    - losers
    - watchers
    answer: winners
    difficulty: 1
    hints:
    - Champions get the trophy.
    - Who gets the trophy?
    solution: 'Step 1: Champions win. Step 2: They are winners.'
    mistakes:
      losers: c4e8_word
      watchers: c4e8_word
  - prompt: Why must players rebuild the stack quickly?
    options:
    - "before the other team tags them with the ball"
    - "because the stones melt if they lie on the ground"
    - "so that everybody can go home early for dinner"
    answer: before the other team tags them with the ball
    difficulty: 2
    hints:
    - The other team has the ball.
    - What happens if you are hit?
    solution: 'Step 1: The other team tries to hit them. Step 2: Speed stops them being tagged out.'
    mistakes:
      "because the stones melt if they lie on the ground": c4e8_game
      "so that everybody can go home early for dinner": c4e8_game
  - prompt: Choose the correct sentence.
    options:
    - The children were playing lagori.
    - The children was playing lagori.
    - The children is playing lagori.
    answer: The children were playing lagori.
    difficulty: 2
    hints:
    - '''Children'' means more than one.'
    - Use the helping verb for many people in the past.
    solution: 'Step 1: Children is plural. Step 2: Use ''were'': The children were playing lagori.'
    mistakes:
      The children was playing lagori.: c4e8_word
      The children is playing lagori.: c4e8_word
  - prompt: 'A soft ball is used in lagori because:'
    options:
    - "it should not hurt players when it hits them"
    - "soft balls fly much further than hard ones"
    - "hard balls are never really round in shape"
    answer: it should not hurt players when it hits them
    difficulty: 3
    hints:
    - Players are hit with the ball in the game.
    - What keeps players safe?
    solution: 'Step 1: Players get tagged with the ball. Step 2: A soft ball does not hurt them.'
    mistakes:
      "soft balls fly much further than hard ones": c4e8_play
      "hard balls are never really round in shape": c4e8_play
  - prompt: 'Lagori is a traditional game. ''Traditional'' means:'
    options:
    - "played for a very long time, passed down"
    - "brand new, made up only last week"
    - "played only on phones and computers"
    answer: played for a very long time, passed down
    difficulty: 2
    hints:
    - Grandparents played it too.
    - Is it old or new?
    solution: 'Step 1: Traditional games are old. Step 2: They are passed down from older people.'
    mistakes:
      "brand new, made up only last week": c4e8_word
      "played only on phones and computers": c4e8_word
  - prompt: 'Case: In a lagori game, one team keeps throwing the ball very hard at the other team''s faces to stop them rebuilding. What is wrong with this?'
    options:
    - "It is unfair and unsafe; the ball should be aimed low and gently"
    - "Nothing at all, because throwing it hard helps that team win"
    - "Only that they should throw the ball even harder at the faces"
    answer: It is unfair and unsafe; the ball should be aimed low and gently
    hints:
    - Is the game still fun and safe for everyone?
    - What does a good champion do?
    solution: Throwing hard at faces can hurt players. Good champions play fairly and safely, aiming low with a soft ball.
    mistakes:
      "Nothing at all, because throwing it hard helps that team win": c4e8_play
      "Only that they should throw the ball even harder at the faces": c4e8_play
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are telling a new friend the goal of the team that knocks down the stones. What do they try to do next?'
    options:
    - "Rebuild the stack before being hit by the ball"
    - "Hide all the stones so the others cannot find them"
    - "Throw the stones at the players of the other team"
    answer: Rebuild the stack before being hit by the ball
    hints:
    - What happens right after the pile falls?
    - How does the throwing team win the round?
    solution: After knocking the stones down, the team rushes to rebuild the stack while the other team tries to hit them with the ball.
    mistakes:
      "Hide all the stones so the others cannot find them": c4e8_game
      "Throw the stones at the players of the other team": c4e8_game
    exam: competency
    difficulty: 2
