# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 10. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 10
title: 'The Swing (Unit 4: Up High)'
concepts:
- code: cbse4e.u4.swing
  title: 'The Swing (Unit 4: Up High)'
  notes: |
    A poem about the joy of swinging, in the tradition of R. L. Stevenson's famous 'The Swing': 'How do you like to go up
    in a swing, up in the air so blue? Oh, I do think it the pleasantest thing ever a child can do!' Going up high, the
    child sees over the wall, rivers, trees, cattle and the countryside, then comes down again. Feelings: joy, freedom.
  explanations:
    text: 'The poem is about the fun of going up high on a swing. Up in the blue sky, the child can see far over the wall: rivers, trees and cattle. Then down they come, and up again. It''s the happiest feeling!'
    visual: Draw a child on a swing high in the air, looking over a garden wall at a river, trees and cows.
    step_by_step: 1. Read the poem aloud with rhythm. 2. Find what the child sees from up high. 3. Find the rhyming words. 4. How does the child feel?
    real_world: Swings on banyan trees during Onam (oonjal) are a favourite part of the festival in Kerala.
  picture:
    kind: flow
    steps:
    - Swing goes up
    - 'See over the wall: river, trees, cattle'
    - Swing comes down
    - Up again!
    alt: On the swing you go up and see over the wall to the river, trees and cattle, then come down and go up again.
  activity:
    type: sort
    prompt: 'The Swing: up high or down low?'
    bins:
    - Up in the air
    - Down on the ground
    items:
    - label: Seeing over the wall
      bin: Up in the air
      clue: High enough to see far.
      why: At the top you see over the wall.
    - label: Rivers, trees and cattle far away
      bin: Up in the air
      clue: The whole countryside.
      why: From up high you see the countryside.
    - label: Feet touching the grass
      bin: Down on the ground
      clue: Low.
      why: At the bottom your feet touch.
    - label: The air so blue
      bin: Up in the air
      clue: The sky.
      why: Up in the blue air.
  items:
  - prompt: How does the child feel on the swing?
    options:
    - very happy
    - scared and sad
    - bored
    - angry
    answer: very happy
    difficulty: 1
    hints:
    - '''The pleasantest thing''.'
    - Fun.
    solution: The child feels very happy.
    mistakes:
      scared and sad: eng4_read_again
  - prompt: 'Going up on the swing, the child can see:'
    options:
    - far over the wall
    - only the ground
    - inside the house
    - nothing
    answer: far over the wall
    difficulty: 1
    hints:
    - Up high.
    - View.
    solution: Up high, the child sees over the wall.
  - prompt: Which word rhymes with 'blue'?
    options:
    - do
    - swing
    - high
    - wall
    answer: do
    difficulty: 1
    hints:
    - Same ending sound.
    - -oo.
    solution: Blue and do rhyme.
  - prompt: What does 'pleasantest' mean?
    options:
    - most enjoyable
    - most boring
    - most painful
    - smallest
    answer: most enjoyable
    difficulty: 2
    hints:
    - Pleasant = nice.
    - -est = most.
    solution: Pleasantest means most enjoyable.
    mistakes:
      most boring: eng4_word
  - prompt: During which Kerala festival do children enjoy swings (oonjal)?
    options:
    - Onam
    - Holi
    - Lohri
    - Bihu
    answer: Onam
    difficulty: 2
    hints:
    - Pookalam.
    - Kerala.
    solution: Swings are part of Onam fun.
  - prompt: 'Choose the opposite of ''up'':'
    options:
    - down
    - high
    - over
    - top
    answer: down
    difficulty: 1
    hints:
    - The swing comes ...
    - Opposite.
    solution: Down is the opposite of up.
