# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 10. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 10
title: 'The Swing (Unit 4: Up High)'
tips:
  e4_onam_swing: "The Kerala harvest festival with pookalam also has swings."
  e4_opposite_up: "Up and ___: one goes to the sky, one goes to the ground."
  e4_rhyme_blue: "Rhyming words end with the same sound: bl-ue, d-?"
  e4_swing_see: "When you swing up high, you can see over things."
  c4e10_poem: 'Picture yourself on the swing: going up, what do you see? Coming down, where are you?'
  c4e10_rhyme: Say the words aloud and listen only to the ending sound.
  c4e10_word: Put each choice into the line and read it aloud. Which keeps the meaning?

concepts:
- code: cbse4e.u4.swing
  title: 'The Swing (Unit 4: Up High)'
  notes: |
    A poem about the joy of swinging, in the tradition of R. L. Stevenson's famous 'The Swing': 'How do you like to go up
    in a swing, up in the air so blue? Oh, I do think it the pleasantest thing ever a child can do!' Going up high, the
    child sees over the wall, rivers, trees, cattle and the countryside, then comes down again. Feelings: joy, freedom.
  explanations:
    text: 'The poem is about the fun of going up high on a swing. Up in the blue sky, the child can see far over the wall: rivers, trees and cattle. Then down they come, and up again. It''s the happiest feeling!'
    visual: Draw a child on a swing high in the air, looking over a garden wall at a river, trees and cows.
    step_by_step: 1. Read the poem aloud with rhythm. 2. Find what the child sees from up high. 3. Find the rhyming words. 4. How does the child feel?
    real_world: Swings on banyan trees during Onam (oonjal) are a favourite part of the festival in Kerala.
  picture:
    kind: flow
    steps:
    - Swing goes up
    - 'See over the wall: river, trees, cattle'
    - Swing comes down
    - Up again!
    alt: On the swing you go up and see over the wall to the river, trees and cattle, then come down and go up again.
  activity:
    type: sort
    prompt: 'The Swing: up high or down low?'
    bins:
    - Up in the air
    - Down on the ground
    items:
    - label: Seeing over the wall
      bin: Up in the air
      clue: High enough to see far.
      why: At the top you see over the wall.
    - label: Rivers, trees and cattle far away
      bin: Up in the air
      clue: The whole countryside.
      why: From up high you see the countryside.
    - label: Feet touching the grass
      bin: Down on the ground
      clue: Low.
      why: At the bottom your feet touch.
    - label: The air so blue
      bin: Up in the air
      clue: The sky.
      why: Up in the blue air.
  lesson:
    - teach: '''The Swing'' is a happy poem. The child asks: ''How do you like to go up in a swing, up in the air so blue?'' and says it is the pleasantest thing a child can do.'
      check:
        prompt: How does the child feel about swinging?
        options:
        - it is the most enjoyable thing
        - it is scary
        - it is boring
        answer: it is the most enjoyable thing
        why: '''Pleasantest'' means most pleasant.'
      ways:
      - style: visual
        teach: How the child in the poem feels while on the swing.
        picture:
          kind: compare
          columns:
          - title: What the child does
            points:
            - Goes up in the swing
            - Rises into the blue air
          - title: How the child feels
            points:
            - Very happy
            - Free
            - It is the most pleasant thing to do
          alt: The child goes up in the swing and rises into the blue air, feeling very happy and free. To the child, it is the most pleasant thing to do.
      - style: real_world
        teach: On a swing, you can feel your tummy flip at the very top and the wind rush past your face. Many children say it feels like flying.
    - teach: 'Going up high, the child sees over the wall: rivers, trees, cattle and the countryside. Then the swing comes down again into the garden. Up and down, again and again.'
      picture:
        kind: flow
        steps:
        - in the garden
        - up over the wall
        - see rivers, trees, cattle
        - down to the garden again
        alt: The swing goes up over the wall and comes back down.
      check:
        prompt: What can the child see from high on the swing?
        options:
        - rivers, trees and cattle far away
        - only the ground
        - the inside of the house
        answer: rivers, trees and cattle far away
        why: Being up high lets you see far.
      ways:
      - style: step_by_step
        teach: 'Read the poem like a swing. Step 1: Read the lines about going up slowly, in a rising voice. Step 2: Pause at the top, where the child sees far away. Step 3: Read the lines about coming down in a falling voice. Step 4: Notice how the poem swings up and down too.'
      - style: real_world
        teach: From the top of a Ferris wheel at a fair, you can see over the stalls, the roads and the houses. Going higher lets you see much further, just as the swing lets the child see over the wall.
    - teach: 'Poems use rhyme: blue/do, wall/all, brown/down. In Kerala, children enjoy swings called oonjal during Onam.'
      check:
        prompt: Which word rhymes with 'wall'?
        options:
        - all
        - well
        - wild
        answer: all
        why: Both end in '-all'.
      ways:
      - style: visual
        teach: Rhyming pairs from the poem, sorted by their ending sound.
        picture:
          kind: compare
          columns:
          - title: Ends in -oo sound
            points:
            - blue
            - do
          - title: Ends in -all
            points:
            - wall
            - all
          - title: Ends in -own
            points:
            - brown
            - down
          alt: Blue and do rhyme with an -oo sound, wall and all rhyme with -all, and brown and down rhyme with -own.
      - style: real_world
        teach: During Onam in Kerala, families hang an oonjal, a swing, from a strong tree branch. Children and grown-ups take turns, and songs are sung as the swing goes back and forth.
  items:
  - prompt: How does the child feel on the swing?
    options:
    - very happy
    - scared and sad
    - bored
    - angry
    answer: very happy
    difficulty: 1
    hints:
    - '''The pleasantest thing''.'
    - Fun.
    solution: The child feels very happy.
    mistakes:
      scared and sad: eng4_read_again
  - prompt: 'Going up on the swing, the child can see:'
    options:
    - far over the wall
    - only the ground
    - inside the house
    - nothing
    answer: far over the wall
    difficulty: 1
    hints:
    - Up high.
    - View.
    solution: Up high, the child sees over the wall.
    mistakes: {"only the ground": "e4_swing_see"}
  - prompt: Which word rhymes with 'blue'?
    options:
    - do
    - swing
    - high
    - wall
    answer: do
    difficulty: 1
    hints:
    - Same ending sound.
    - -oo.
    solution: Blue and do rhyme.
    mistakes: {"high": "e4_rhyme_blue"}
  - prompt: What does 'pleasantest' mean?
    options:
    - most enjoyable
    - most boring
    - most painful
    - smallest
    answer: most enjoyable
    difficulty: 2
    hints:
    - Pleasant = nice.
    - -est = most.
    solution: Pleasantest means most enjoyable.
    mistakes:
      most boring: eng4_word
  - prompt: During which Kerala festival do children enjoy swings (oonjal)?
    options:
    - Onam
    - Holi
    - Lohri
    - Bihu
    answer: Onam
    difficulty: 2
    hints:
    - Pookalam.
    - Kerala.
    solution: Swings are part of Onam fun.
    mistakes: {"Holi": "e4_onam_swing"}
  - prompt: 'Choose the opposite of ''up'':'
    options:
    - down
    - high
    - over
    - top
    answer: down
    difficulty: 1
    hints:
    - The swing comes ...
    - Opposite.
    solution: Down is the opposite of up.
    mistakes: {"high": "e4_opposite_up"}
  - prompt: Which word rhymes with 'down'?
    options:
    - brown
    - door
    - dog
    answer: brown
    difficulty: 1
    hints:
    - Listen to '-own'.
    - Say each word after 'down'.
    solution: 'Step 1: down ends in ''-own''. Step 2: brown also ends in ''-own''.'
    mistakes:
      door: c4e10_rhyme
      dog: c4e10_rhyme
  - prompt: Why can the child see over the wall only when the swing is up?
    options:
    - the swing lifts the child higher than the wall
    - the wall moves away
    - the child closes their eyes
    answer: the swing lifts the child higher than the wall
    difficulty: 2
    hints:
    - On the ground, the wall blocks the view.
    - What changes when the swing goes up?
    solution: 'Step 1: The wall is taller than the child on the ground. Step 2: The swing lifts the child above it.'
    mistakes:
      the wall moves away: c4e10_poem
      the child closes their eyes: c4e10_poem
  - prompt: 'In the poem, ''cattle'' are:'
    options:
    - cows and bulls
    - birds
    - boats
    answer: cows and bulls
    difficulty: 1
    hints:
    - They graze in fields.
    - Farm animals that give milk.
    solution: 'Step 1: Cattle graze in the countryside. Step 2: Cattle are cows and bulls.'
    mistakes:
      birds: c4e10_word
      boats: c4e10_word
  - prompt: What colour is the air (sky) in the poem?
    options:
    - blue
    - green
    - red
    answer: blue
    difficulty: 1
    hints:
    - '''Up in the air so ...'''
    - What colour is a clear sky?
    solution: 'Step 1: The line says ''up in the air so blue''. Step 2: The sky is blue.'
    mistakes:
      green: c4e10_poem
      red: c4e10_poem
  - prompt: Which feeling does the poem show most?
    options:
    - joy and freedom
    - fear
    - anger
    answer: joy and freedom
    difficulty: 2
    hints:
    - The child calls swinging the pleasantest thing.
    - How does flying up high feel?
    solution: 'Step 1: The child loves the swing. Step 2: The poem shows joy and freedom.'
    mistakes:
      fear: c4e10_poem
      anger: c4e10_poem
  - prompt: What does 'countryside' mean?
    options:
    - land with fields and villages, away from towns
    - a busy city road
    - the inside of a room
    answer: land with fields and villages, away from towns
    difficulty: 2
    hints:
    - The child sees rivers, trees and cattle there.
    - Is it a city or the open land?
    solution: 'Step 1: Rivers, trees and cattle are seen. Step 2: Countryside is open land with fields and villages.'
    mistakes:
      a busy city road: c4e10_word
      the inside of a room: c4e10_word
  - prompt: Choose the opposite of 'high'.
    options:
    - low
    - tall
    - far
    answer: low
    difficulty: 1
    hints:
    - The swing goes high and then ...
    - Near the ground is ...
    solution: 'Step 1: High is far above the ground. Step 2: The opposite is low.'
    mistakes:
      tall: c4e10_word
      far: c4e10_word
  - prompt: Why does the swing come back down after going up?
    options:
    - it falls back because of its weight
    - the wind pushes it to the river
    - the child jumps off
    answer: it falls back because of its weight
    difficulty: 3
    hints:
    - What pulls everything towards the ground?
    - A ball thrown up also comes down.
    solution: 'Step 1: Things are pulled down to the ground. Step 2: So the swing falls back and swings again.'
    mistakes:
      the wind pushes it to the river: c4e10_poem
      the child jumps off: c4e10_poem
  - prompt: Which line has a rhyming pair?
    options:
    - up in the air so blue / ever a child can do
    - up in the air / under the bed
    - the river / the tree
    answer: up in the air so blue / ever a child can do
    difficulty: 3
    hints:
    - Look at the last word of each part.
    - 'blue and do: do they sound alike?'
    solution: 'Step 1: The parts end in ''blue'' and ''do''. Step 2: They rhyme.'
    mistakes:
      up in the air / under the bed: c4e10_rhyme
      the river / the tree: c4e10_rhyme
  - prompt: 'Case: A child sits in a garden and can see only the wall. Then the child goes high on a swing and sees rivers, trees and cattle beyond the wall. Why can the child see more now?'
    options:
    - Being higher lets the child see over the wall
    - The wall became shorter
    - The trees moved closer
    answer: Being higher lets the child see over the wall
    hints:
    - What changes when the swing goes up?
    - What happens to how far you can see when you are higher?
    solution: When the swing lifts the child up high, the child is above the wall and can see far beyond it.
    mistakes:
      The wall became shorter: c4e10_poem
      The trees moved closer: c4e10_poem
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing your own swing poem. Your line ends with ''sky''. Which word should end the next line so that it rhymes?'
    options:
    - high
    - low
    - tree
    answer: high
    hints:
    - Say 'sky' aloud and listen to its ending sound.
    - Which word ends with the same sound?
    solution: '''Sky'' and ''high'' both end with the ''-igh'' sound, so they rhyme.'
    mistakes:
      low: c4e10_rhyme
      tree: c4e10_rhyme
    exam: competency
    difficulty: 2
