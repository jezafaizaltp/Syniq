# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 11. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 11
title: 'A Journey to the Magical Mountains (Unit 4: Up High)'
concepts:
- code: cbse4e.u4.mountains
  title: 'A Journey to the Magical Mountains (Unit 4: Up High)'
  notes: |
    A travel story set in the mountains (unit 'Up High'). Mountains such as the Himalayas have snowy peaks, pine forests,
    cold air, rivers that start from glaciers, terrace farms, yaks and woollen clothes. Exact story details are not
    reproduced here; questions focus on mountain words and describing a journey.
  explanations:
    text: 'The mountains feel magical: snowy peaks shine in the sun, pine trees stand tall, rivers rush down, and the air is cold and fresh. People there wear warm woollen clothes and farm on steps cut into the hills.'
    visual: Draw snowy peaks, pine trees, a winding road with a bus, and a stream rushing down.
    step_by_step: '1. Where does the journey go? 2. What do the travellers see? 3. How is the weather? 4. Use describing words: snowy, tall, cold, fresh.'
    real_world: Families visit hill stations like Munnar, Ooty, Shimla and Darjeeling to enjoy cool mountain air.
  picture:
    kind: compare
    columns:
    - title: In the mountains
      points:
      - snowy peaks
      - pine trees
      - cold air
    - title: People wear and do
      points:
      - woollen clothes
      - terrace farming
      - keep yaks
    alt: In the mountains there are snowy peaks, pine trees and cold air; people wear woollen clothes, farm on terraces and keep yaks.
  items:
  - prompt: 'The highest mountains in India are the:'
    options:
    - Himalayas
    - Western Ghats
    - Aravallis
    - Nilgiris
    answer: Himalayas
    difficulty: 1
    hints:
    - In the north.
    - Snowy.
    solution: The Himalayas are the highest.
  - prompt: 'The weather high in the mountains is usually:'
    options:
    - cold
    - very hot
    - always rainy
    - sandy
    answer: cold
    difficulty: 1
    hints:
    - Snow.
    - Sweaters.
    solution: Mountains are cold.
  - prompt: Which is a hill station in Kerala?
    options:
    - Munnar
    - Jaipur
    - Chennai
    - Patna
    answer: Munnar
    difficulty: 2
    hints:
    - Tea gardens.
    - Idukki.
    solution: Munnar is a hill station in Kerala.
  - prompt: Which describing word fits snowy peaks?
    options:
    - white
    - hot
    - sandy
    - salty
    answer: white
    difficulty: 1
    hints:
    - Colour of snow.
    - Bright.
    solution: Snowy peaks are white.
  - prompt: 'A ''journey'' is:'
    options:
    - a trip from one place to another
    - a type of food
    - a song
    - a game of cards
    answer: a trip from one place to another
    difficulty: 1
    hints:
    - Travel.
    - Going somewhere.
    solution: A journey is a trip.
    mistakes:
      a song: eng4_word
  - prompt: 'Rivers in the Himalayas start from:'
    options:
    - glaciers (rivers of ice)
    - the sea
    - deserts
    - wells
    answer: glaciers (rivers of ice)
    difficulty: 2
    hints:
    - Melting ice.
    - Gangotri.
    solution: Himalayan rivers start from glaciers.
