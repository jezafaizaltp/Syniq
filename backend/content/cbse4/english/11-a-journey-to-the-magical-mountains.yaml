# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 11. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 11
title: 'A Journey to the Magical Mountains (Unit 4: Up High)'
tips:
  e4_mountain_cold: "The higher you climb, the more the air chills. That is why peaks have snow."
  e4_munnar: "Kerala's hill station is famous for tea gardens in Idukki."
  e4_snowy: "What colour is snow?"
  c4e11_mount: 'Picture a high mountain: what is the weather, what covers the peaks, what do people wear?'
  c4e11_trip: 'Retell the journey in order: start, the way there, what was seen, coming home.'
  c4e11_word: Put each choice into the sentence and read it aloud. Which keeps the meaning?

concepts:
- code: cbse4e.u4.mountains
  title: 'A Journey to the Magical Mountains (Unit 4: Up High)'
  notes: |
    A travel story set in the mountains (unit 'Up High'). Mountains such as the Himalayas have snowy peaks, pine forests,
    cold air, rivers that start from glaciers, terrace farms, yaks and woollen clothes. Exact story details are not
    reproduced here; questions focus on mountain words and describing a journey.
  explanations:
    text: 'The mountains feel magical: snowy peaks shine in the sun, pine trees stand tall, rivers rush down, and the air is cold and fresh. People there wear warm woollen clothes and farm on steps cut into the hills.'
    visual: Draw snowy peaks, pine trees, a winding road with a bus, and a stream rushing down.
    step_by_step: '1. Where does the journey go? 2. What do the travellers see? 3. How is the weather? 4. Use describing words: snowy, tall, cold, fresh.'
    real_world: Families visit hill stations like Munnar, Ooty, Shimla and Darjeeling to enjoy cool mountain air.
  picture:
    kind: compare
    columns:
    - title: In the mountains
      points:
      - snowy peaks
      - pine trees
      - cold air
    - title: People wear and do
      points:
      - woollen clothes
      - terrace farming
      - keep yaks
    alt: In the mountains there are snowy peaks, pine trees and cold air; people wear woollen clothes, farm on terraces and keep yaks.
  activity:
    type: sort
    prompt: 'A Journey to the Magical Mountains: mountain or seaside?'
    bins:
    - Mountains
    - Seaside
    items:
    - label: Snowy peaks
      bin: Mountains
      clue: Cold and high.
      why: Snow on peaks is a mountain sight.
    - label: Terrace farms
      bin: Mountains
      clue: Steps cut in a hill.
      why: Terrace farms are on hillsides.
    - label: Waves and sand
      bin: Seaside
      clue: By the water.
      why: Waves are at the sea.
    - label: Yaks
      bin: Mountains
      clue: Hairy animals of the cold.
      why: Yaks live high in the mountains.
    - label: Fishing boats
      bin: Seaside
      clue: On the sea.
      why: Fishing boats belong to the coast.
  lesson:
    - teach: '''A Journey to the Magical Mountains'' is a travel story. Mountains like the Himalayas have snowy peaks, pine forests and cold, fresh air. A journey is a trip from one place to another.'
      check:
        prompt: What covers the tops of the high Himalayas?
        options:
        - snow
        - sand
        - grass only
        answer: snow
        why: It is very cold high up.
      ways:
      - style: visual
        teach: What you might find on a journey to the high mountains.
        picture:
          kind: compare
          columns:
          - title: Land
            points:
            - Snowy peaks
            - Pine forests
            - Winding roads
          - title: Air and weather
            points:
            - Cold
            - Fresh and clean
            - Snow in winter
          alt: In the high mountains you find snowy peaks, pine forests and winding roads. The air is cold, fresh and clean, with snow in winter.
      - style: real_world
        teach: On a long bus ride up to the hills, the air slowly gets cooler. Travellers often pull on a sweater halfway up, even if it was hot when they started.
    - teach: Higher up, the air gets colder. People wear woollen clothes, keep yaks, and farm on steps (terraces) cut into the hills. Rivers start from glaciers, rivers of ice.
      picture:
        kind: flow
        steps:
        - 'plains: warm'
        - 'hills: cooler, pine forests'
        - 'high slopes: cold, yaks'
        - 'peaks: snow and glaciers'
        alt: 'Going up a mountain: it gets colder from the plains to the snowy peaks.'
      check:
        prompt: 'As you climb higher, the air becomes:'
        options:
        - colder
        - hotter
        - sandier
        answer: colder
        why: High places are cold.
      ways:
      - style: step_by_step
        teach: 'See why it gets colder higher up. Step 1: Look at a picture of a tall mountain. Step 2: Notice the bottom: green fields and trees. Step 3: Look higher: fewer trees, rocky slopes. Step 4: At the very top: snow, because it is coldest there.'
      - style: real_world
        teach: In the Himalayas, people build stone walls to make flat steps on the hillsides. They grow rice, potatoes and barley on these terraces, and the steps stop the soil washing away.
    - teach: To describe a journey, use order words (first, then, finally) and describing words (snowy, tall, winding, fresh). Kerala has hill stations too, like Munnar with its tea gardens.
      check:
        prompt: Which describing word fits a mountain road with many turns?
        options:
        - winding
        - straight
        - flat
        answer: winding
        why: Winding means with many bends.
      ways:
      - style: visual
        teach: Order words and describing words for writing about a journey.
        picture:
          kind: compare
          columns:
          - title: Order words
            points:
            - First
            - Then
            - Finally
          - title: Describing words
            points:
            - snowy
            - tall
            - winding
            - fresh
          alt: Use order words like first, then and finally, and describing words like snowy, tall, winding and fresh, to write about a journey.
      - style: real_world
        teach: In Munnar, Kerala, hills are covered with neat rows of tea bushes. Early in the morning, the mist sits low over the green slopes, and the air is cool.
  items:
  - prompt: 'The highest mountains in India are the:'
    options:
    - Himalayas
    - Western Ghats
    - Aravallis
    - Nilgiris
    answer: Himalayas
    difficulty: 1
    hints:
    - In the north.
    - Snowy.
    solution: The Himalayas are the highest.
    mistakes: {"Western Ghats": "v5_himalayas"}
  - prompt: 'The weather high in the mountains is usually:'
    options:
    - cold
    - very hot
    - always rainy
    - sandy
    answer: cold
    difficulty: 1
    hints:
    - Snow.
    - Sweaters.
    solution: Mountains are cold.
    mistakes: {"very hot": "e4_mountain_cold"}
  - prompt: Which is a hill station in Kerala?
    options:
    - Munnar
    - Jaipur
    - Chennai
    - Patna
    answer: Munnar
    difficulty: 2
    hints:
    - Tea gardens.
    - Idukki.
    solution: Munnar is a hill station in Kerala.
    mistakes: {"Jaipur": "e4_munnar"}
  - prompt: Which describing word fits snowy peaks?
    options:
    - white
    - hot
    - sandy
    - salty
    answer: white
    difficulty: 1
    hints:
    - Colour of snow.
    - Bright.
    solution: Snowy peaks are white.
    mistakes: {"hot": "e4_snowy"}
  - prompt: 'A ''journey'' is:'
    options:
    - "a trip from one place to another"
    - "a type of food eaten at lunch"
    - "a song sung by a group"
    - "a game played with cards"
    answer: a trip from one place to another
    difficulty: 1
    hints:
    - Travel.
    - Going somewhere.
    solution: A journey is a trip.
    mistakes:
      "a song sung by a group": eng4_word
  - prompt: 'Rivers in the Himalayas start from:'
    options:
    - glaciers (rivers of ice)
    - the sea
    - deserts
    - wells
    answer: glaciers (rivers of ice)
    difficulty: 2
    hints:
    - Melting ice.
    - Gangotri.
    solution: Himalayan rivers start from glaciers.
    mistakes: {"the sea": "v5_gangotri"}
  - prompt: What is a 'peak'?
    options:
    - the top of a mountain
    - the bottom of a valley
    - a kind of bird
    answer: the top of a mountain
    difficulty: 1
    hints:
    - Climbers try to reach it.
    - It is the highest point.
    solution: 'Step 1: Climbers go up to the highest point. Step 2: That is the peak.'
    mistakes:
      the bottom of a valley: c4e11_word
      a kind of bird: c4e11_word
  - prompt: Why do people in the mountains wear woollen clothes?
    options:
    - to keep warm in the cold
    - to look tall
    - to keep cool
    answer: to keep warm in the cold
    difficulty: 1
    hints:
    - Mountains are cold.
    - What does wool do?
    solution: 'Step 1: It is cold in the mountains. Step 2: Wool keeps the body warm.'
    mistakes:
      to look tall: c4e11_mount
      to keep cool: c4e11_mount
  - prompt: What is a 'valley'?
    options:
    - low land between hills
    - the top of a hill
    - a snow storm
    answer: low land between hills
    difficulty: 2
    hints:
    - It is the opposite of a peak.
    - Rivers often flow through it.
    solution: 'Step 1: Hills rise on both sides. Step 2: The low land between them is a valley.'
    mistakes:
      the top of a hill: c4e11_word
      a snow storm: c4e11_word
  - prompt: 'Munnar in Kerala is famous for its:'
    options:
    - tea gardens
    - deserts
    - sea beaches
    answer: tea gardens
    difficulty: 2
    hints:
    - It is a hill station.
    - Green bushes cover its slopes.
    solution: 'Step 1: Munnar has cool hills. Step 2: Its slopes are covered with tea gardens.'
    mistakes:
      deserts: c4e11_mount
      sea beaches: c4e11_mount
  - prompt: 'Put the journey in order: ''reached the top'', ''started early'', ''climbed the path''.'
    options:
    - started early, climbed the path, reached the top
    - reached the top, started early, climbed the path
    - climbed the path, reached the top, started early
    answer: started early, climbed the path, reached the top
    difficulty: 2
    hints:
    - A journey begins with starting.
    - Reaching the top comes last.
    solution: 'Step 1: Start first, then climb. Step 2: Reach the top at the end.'
    mistakes:
      reached the top, started early, climbed the path: c4e11_trip
      climbed the path, reached the top, started early: c4e11_trip
  - prompt: Why is the word 'magical' used for the mountains?
    options:
    - "they are so beautiful they seem unreal"
    - "people do magic tricks on the mountains"
    - "the mountains disappear every night"
    answer: they are so beautiful they seem unreal
    difficulty: 3
    hints:
    - Magical can describe a feeling of wonder.
    - How do snowy peaks and clouds make you feel?
    solution: 'Step 1: Snowy peaks and clouds are amazing to see. Step 2: ''Magical'' shows that wonder.'
    mistakes:
      "people do magic tricks on the mountains": c4e11_word
      "the mountains disappear every night": c4e11_word
  - prompt: Which animal helps carry loads in the high Himalayas?
    options:
    - yak
    - camel
    - crocodile
    answer: yak
    difficulty: 1
    hints:
    - It has long thick hair.
    - Camels are for deserts.
    solution: 'Step 1: Thick hair keeps it warm. Step 2: The yak carries loads in the mountains.'
    mistakes:
      camel: c4e11_mount
      crocodile: c4e11_mount
  - prompt: Choose the correct sentence.
    options:
    - We went to the mountains last summer.
    - We go to the mountains last summer.
    - We going to the mountains last summer.
    answer: We went to the mountains last summer.
    difficulty: 2
    hints:
    - '''Last summer'' is the past.'
    - The past of 'go' is special.
    solution: 'Step 1: Last summer = past. Step 2: The past of ''go'' is ''went''.'
    mistakes:
      We go to the mountains last summer.: c4e11_word
      We going to the mountains last summer.: c4e11_word
  - prompt: What should travellers carry for a trip to snowy mountains?
    options:
    - "warm jackets and gloves"
    - "swimsuits"
    - "nothing at all"
    answer: warm jackets and gloves
    difficulty: 1
    hints:
    - Snow means very cold.
    - What keeps hands and body warm?
    solution: 'Step 1: Snowy places are very cold. Step 2: Warm jackets and gloves are needed.'
    mistakes:
      "swimsuits": c4e11_mount
      "nothing at all": c4e11_mount
  - prompt: 'Case: A family from Chennai is planning a trip to a snowy Himalayan village in January. Which list should they pack?'
    options:
    - "Woollen jackets, caps, gloves and warm socks"
    - "Swimsuits, sunhats and sunglasses only"
    - "Thin cotton shirts, shorts and sandals"
    answer: Woollen jackets, caps, gloves and warm socks
    hints:
    - What is the weather like high in the mountains in January?
    - What do people there wear to keep warm?
    solution: High mountains are cold, especially in winter. Woollen jackets, caps, gloves and warm socks keep the body warm.
    mistakes:
      "Swimsuits, sunhats and sunglasses only": c4e11_mount
      "Thin cotton shirts, shorts and sandals": c4e11_mount
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing about your trip to the hills. Which sentence uses describing words best?'
    options:
    - "We drove up a winding road past tall, green pine trees."
    - "We went up a road and then we went past some trees."
    - "Road, trees, hills, car, driver, journey, top."
    answer: We drove up a winding road past tall, green pine trees.
    hints:
    - Describing words tell us more about a naming word.
    - Which sentence helps the reader picture the journey?
    solution: '''Winding'', ''tall'' and ''green'' are describing words. They help the reader picture the road and the trees.'
    mistakes:
      "We went up a road and then we went past some trees.": c4e11_word
      "Road, trees, hills, car, driver, journey, top.": c4e11_word
    exam: competency
    difficulty: 2
