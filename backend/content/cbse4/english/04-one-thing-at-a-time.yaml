# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 4. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 4
title: 'One Thing at a Time (Unit 2: My Beautiful World)'
tips:
  e4_follows_advice: "Which child does one thing, finishes it, then starts the next?"
  e4_one_thing: "The poem's title is its rule."
  e4_why_one: "When your mind is on one job, how well do you do it?"

concepts:
- code: cbse4e.u2.onething
  title: 'One Thing at a Time (Unit 2: My Beautiful World)'
  notes: |
    A short poem with the well-known lines 'Work while you work, play while you play; that is the way to be cheerful and
    gay' and 'One thing each time, and that done well, is a very good rule, as many can tell' (traditional, often
    credited to M. A. Stodart). Message: give full attention to one task; doing things by halves is not useful; a moment
    is lost if you waste it.
  explanations:
    text: 'The poem says: work while you work, and play while you play. Do one thing at a time and do it well. If you try to do many things at once, none of them gets done well.'
    visual: 'Draw a clock split in two: one half shows a child doing homework, the other half shows the child playing football.'
    step_by_step: '1. Read the poem aloud. 2. Find the rule the poet gives. 3. Think: what happens if you do two things at once?'
    real_world: Doing homework with the TV on makes it slow and full of mistakes; finishing it first and then playing is better.
  picture:
    kind: flow
    steps:
    - Work while you work
    - Finish it well
    - Then play while you play
    - Happy and cheerful
    alt: Work while you work and finish it well, then play while you play, and you will be happy and cheerful.
  activity:
    type: sort
    prompt: 'One Thing at a Time: good habit or not?'
    bins:
    - One thing at a time
    - Doing things by halves
    items:
    - label: Homework first, then play
      bin: One thing at a time
      clue: Finish, then switch.
      why: Doing one task fully is the poem's rule.
    - label: TV while doing homework
      bin: Doing things by halves
      clue: Two at once.
      why: Splitting attention does both badly.
    - label: Play fully when you play
      bin: One thing at a time
      clue: Play while you play.
      why: '''Play while you play.'''
    - label: Half a drawing, then a game, then back
      bin: Doing things by halves
      clue: Nothing finished.
      why: Jumping between tasks leaves them half done.
  items:
  - prompt: What does the poem say to do when you work?
    options:
    - only work, not play
    - play
    - sleep
    - watch TV
    answer: only work, not play
    difficulty: 1
    hints:
    - Work while you ...
    - Focus.
    solution: Work while you work.
    mistakes:
      play: eng4_read_again
  - prompt: What is the poem's rule?
    options:
    - do one thing at a time and do it well
    - do many things at once
    - never play
    - never work
    answer: do one thing at a time and do it well
    difficulty: 1
    hints:
    - Title.
    - One thing ...
    solution: One thing at a time, done well.
    mistakes: {"do many things at once": "e4_one_thing"}
  - prompt: Which child follows the poem's advice?
    options:
    - Asha finishes homework, then plays
    - Ravi plays and does homework at the same time
    - Meena watches TV while writing
    - Sam does nothing
    answer: Asha finishes homework, then plays
    difficulty: 2
    hints:
    - One thing at a time.
    - Finish first.
    solution: Asha does one thing at a time.
    mistakes: {"Ravi plays and does homework at the same time": "e4_follows_advice"}
  - prompt: 'Choose the word that rhymes with ''play'':'
    options:
    - way
    - work
    - time
    - well
    answer: way
    difficulty: 1
    hints:
    - Same ending sound.
    - -ay.
    solution: Play and way rhyme.
    mistakes: {"work": "e3_rhyme_play"}
  - prompt: What does 'cheerful' mean?
    options:
    - happy
    - sad
    - tired
    - angry
    answer: happy
    difficulty: 1
    hints:
    - Full of cheer.
    - Smiling.
    solution: Cheerful means happy.
    mistakes:
      sad: eng4_word
  - prompt: Why is it good to do one thing at a time?
    options:
    - you do it better and faster
    - it takes longer always
    - it makes you tired
    - it is boring
    answer: you do it better and faster
    difficulty: 2
    hints:
    - Full attention.
    - Fewer mistakes.
    solution: Focusing helps you do it well.
    mistakes: {"it is boring": "e4_why_one"}
