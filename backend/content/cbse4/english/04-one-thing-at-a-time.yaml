# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 4. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 4
title: 'One Thing at a Time (Unit 2: My Beautiful World)'
tips:
  e4_follows_advice: "Which child does one thing, finishes it, then starts the next?"
  e4_one_thing: "The poem's title is its rule."
  e4_why_one: "When your mind is on one job, how well do you do it?"
  c4e4_poem: 'Read the poem''s rule again: what should you do while you work, and what while you play?'
  c4e4_rhyme: Say the words aloud and listen to the ending sound only.
  c4e4_word: Put each choice into the line and read it aloud. Which keeps the meaning?

concepts:
- code: cbse4e.u2.onething
  title: 'One Thing at a Time (Unit 2: My Beautiful World)'
  notes: |
    A short poem with the well-known lines 'Work while you work, play while you play; that is the way to be cheerful and
    gay' and 'One thing each time, and that done well, is a very good rule, as many can tell' (traditional, often
    credited to M. A. Stodart). Message: give full attention to one task; doing things by halves is not useful; a moment
    is lost if you waste it.
  explanations:
    text: 'The poem says: work while you work, and play while you play. Do one thing at a time and do it well. If you try to do many things at once, none of them gets done well.'
    visual: 'Draw a clock split in two: one half shows a child doing homework, the other half shows the child playing football.'
    step_by_step: '1. Read the poem aloud. 2. Find the rule the poet gives. 3. Think: what happens if you do two things at once?'
    real_world: Doing homework with the TV on makes it slow and full of mistakes; finishing it first and then playing is better.
  picture:
    kind: flow
    steps:
    - Work while you work
    - Finish it well
    - Then play while you play
    - Happy and cheerful
    alt: Work while you work and finish it well, then play while you play, and you will be happy and cheerful.
  activity:
    type: sort
    prompt: 'One Thing at a Time: good habit or not?'
    bins:
    - One thing at a time
    - Doing things by halves
    items:
    - label: Homework first, then play
      bin: One thing at a time
      clue: Finish, then switch.
      why: Doing one task fully is the poem's rule.
    - label: TV while doing homework
      bin: Doing things by halves
      clue: Two at once.
      why: Splitting attention does both badly.
    - label: Play fully when you play
      bin: One thing at a time
      clue: Play while you play.
      why: '''Play while you play.'''
    - label: Half a drawing, then a game, then back
      bin: Doing things by halves
      clue: Nothing finished.
      why: Jumping between tasks leaves them half done.
  lesson:
    - teach: '''One Thing at a Time'' is a short poem. It begins: ''Work while you work, play while you play; that is the way to be cheerful and gay.'' Here ''gay'' is an old word meaning happy.'
      check:
        prompt: 'In the poem, ''gay'' means:'
        options:
        - happy
        - tired
        - angry
        answer: happy
        why: It goes with 'cheerful' in the same line.
      ways:
      - style: visual
        teach: What the poem tells us to do at work time and at play time.
        picture:
          kind: compare
          columns:
          - title: At work time
            points:
            - Only work
            - Give it full attention
          - title: At play time
            points:
            - Only play
            - Enjoy it fully
          alt: At work time, only work and give it full attention. At play time, only play and enjoy it fully.
      - style: real_world
        teach: If you try to do homework while watching TV, the sums take twice as long and still have mistakes. Turning the TV off and finishing first leaves more time to enjoy it after.
    - teach: 'The poem''s rule: ''One thing each time, and that done well, is a very good rule, as many can tell.'' Doing things by halves (half work, half play) gets nothing done properly.'
      picture:
        kind: compare
        columns:
        - title: One thing at a time
          points:
          - full attention
          - done well
          - then free to play
        - title: Many things at once
          points:
          - half attention
          - mistakes
          - takes longer
        alt: Doing one thing at a time compared with doing many things at once.
      check:
        prompt: What happens when we do homework while watching TV?
        options:
        - we make more mistakes and take longer
        - we finish faster
        - we learn more
        answer: we make more mistakes and take longer
        why: Our attention is split.
      ways:
      - style: step_by_step
        teach: 'Plan your evening the poem''s way. Step 1: Write down the jobs: homework, reading, play. Step 2: Put them in order. Step 3: Do the first one fully before starting the next. Step 4: Tick each one off when it is done well.'
      - style: real_world
        teach: A cook who chops vegetables while chatting on the phone is more likely to cut a finger. Doing one thing at a time is often the safest way too.
    - teach: 'The poem also says a moment wasted is lost and cannot come back. Rhyming pairs help us remember it: play/way, gay/play, well/tell.'
      check:
        prompt: Which word rhymes with 'tell'?
        options:
        - well
        - talk
        - time
        answer: well
        why: Both end in '-ell'.
      ways:
      - style: visual
        teach: Rhyming pairs from the poem that help us remember it.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - play
            - gay
            - well
          - title: Rhymes with
            points:
            - way
            - play
            - tell
          alt: In the poem, play rhymes with way, gay rhymes with play, and well rhymes with tell.
      - style: step_by_step
        teach: 'Find a rhyme. Step 1: Say a word aloud, such as ''cat''. Step 2: Listen only to its ending sound: ''-at''. Step 3: Try other first sounds with the same ending: hat, mat, bat. Step 4: All of these rhyme with ''cat''.'
  items:
  - prompt: What does the poem say to do when you work?
    options:
    - only work, not play
    - play
    - sleep
    - watch TV
    answer: only work, not play
    difficulty: 1
    hints:
    - Work while you ...
    - Focus.
    solution: Work while you work.
    mistakes:
      play: eng4_read_again
  - prompt: What is the poem's rule?
    options:
    - do one thing at a time and do it well
    - do many things at once
    - never play
    - never work
    answer: do one thing at a time and do it well
    difficulty: 1
    hints:
    - Title.
    - One thing ...
    solution: One thing at a time, done well.
    mistakes: {"do many things at once": "e4_one_thing"}
  - prompt: Which child follows the poem's advice?
    options:
    - Asha finishes homework, then plays
    - Ravi plays and does homework at the same time
    - Meena watches TV while writing
    - Sam does nothing
    answer: Asha finishes homework, then plays
    difficulty: 2
    hints:
    - One thing at a time.
    - Finish first.
    solution: Asha does one thing at a time.
    mistakes: {"Ravi plays and does homework at the same time": "e4_follows_advice"}
  - prompt: 'Choose the word that rhymes with ''play'':'
    options:
    - way
    - work
    - time
    - well
    answer: way
    difficulty: 1
    hints:
    - Same ending sound.
    - -ay.
    solution: Play and way rhyme.
    mistakes: {"work": "e3_rhyme_play"}
  - prompt: What does 'cheerful' mean?
    options:
    - happy
    - sad
    - tired
    - angry
    answer: happy
    difficulty: 1
    hints:
    - Full of cheer.
    - Smiling.
    solution: Cheerful means happy.
    mistakes:
      sad: eng4_word
  - prompt: Why is it good to do one thing at a time?
    options:
    - you do it better and faster
    - it takes longer always
    - it makes you tired
    - it is boring
    answer: you do it better and faster
    difficulty: 2
    hints:
    - Full attention.
    - Fewer mistakes.
    solution: Focusing helps you do it well.
    mistakes: {"it is boring": "e4_why_one"}
  - prompt: What does the poem say you should do while you play?
    options:
    - only play, with full attention
    - do homework too
    - worry about work
    answer: only play, with full attention
    difficulty: 1
    hints:
    - '''Play while you play.'''
    - Does the poet want you to mix work in?
    solution: 'Step 1: The poem says ''play while you play''. Step 2: So only play then.'
    mistakes:
      do homework too: c4e4_poem
      worry about work: c4e4_poem
  - prompt: Which word rhymes with 'time'?
    options:
    - rhyme
    - team
    - tame
    answer: rhyme
    difficulty: 2
    hints:
    - Listen to the ending '-ime'.
    - Say each word after 'time'.
    solution: 'Step 1: time ends in ''-ime''. Step 2: rhyme also ends in ''-ime''.'
    mistakes:
      team: c4e4_rhyme
      tame: c4e4_rhyme
  - prompt: What does 'by halves' mean?
    options:
    - not completely
    - very well
    - twice
    answer: not completely
    difficulty: 3
    hints:
    - Half of something is not all of it.
    - If you do a job by halves, is it finished?
    solution: 'Step 1: A half is only part. Step 2: Doing things by halves means not completely.'
    mistakes:
      very well: c4e4_word
      twice: c4e4_word
  - prompt: Ravi reads a story and then goes out to play. Is Ravi following the poem?
    options:
    - 'yes'
    - 'no'
    - the poem does not say
    answer: 'yes'
    difficulty: 1
    hints:
    - One thing, then the next.
    - Did Ravi mix the two?
    solution: 'Step 1: Ravi finishes reading first. Step 2: Then plays: one thing at a time.'
    mistakes:
      'no': c4e4_poem
      the poem does not say: c4e4_poem
  - prompt: Why does the poet say a lost moment cannot be brought back?
    options:
    - time once gone never returns
    - clocks stop
    - moments are heavy
    answer: time once gone never returns
    difficulty: 2
    hints:
    - Can yesterday come again?
    - What kind of thing is a moment?
    solution: 'Step 1: A moment is a bit of time. Step 2: Time that has passed never returns.'
    mistakes:
      clocks stop: c4e4_poem
      moments are heavy: c4e4_poem
  - prompt: Choose the opposite of 'work' as used in the poem.
    options:
    - play
    - job
    - task
    answer: play
    difficulty: 1
    hints:
    - The poem uses two opposite activities.
    - Job and task mean the same as work.
    solution: 'Step 1: Job and task are like work. Step 2: The poem''s opposite is play.'
    mistakes:
      job: c4e4_word
      task: c4e4_word
  - prompt: Which word means the same as 'cheerful'?
    options:
    - joyful
    - sleepy
    - worried
    answer: joyful
    difficulty: 1
    hints:
    - Find 'cheer' in the word.
    - We cheer when we are glad.
    solution: 'Step 1: ''Cheer'' is a happy shout. Step 2: Cheerful means joyful.'
    mistakes:
      sleepy: c4e4_word
      worried: c4e4_word
  - prompt: Which is the best plan for an evening?
    options:
    - finish homework, then play, then sleep
    - play and do homework at the same time, then sleep late
    - watch TV while eating and reading
    answer: finish homework, then play, then sleep
    difficulty: 2
    hints:
    - Apply the poem's rule.
    - Which plan does one thing after another?
    solution: 'Step 1: The poem says one thing at a time. Step 2: Homework, then play, then sleep follows it.'
    mistakes:
      play and do homework at the same time, then sleep late: c4e4_poem
      watch TV while eating and reading: c4e4_poem
  - prompt: How many lines rhyme in 'Work while you work, play while you play; that is the way to be cheerful and gay'?
    options:
    - the line ends play, way and gay all rhyme
    - no words rhyme
    - only 'work' rhymes
    answer: the line ends play, way and gay all rhyme
    difficulty: 3
    hints:
    - Look at the last word of each part.
    - Say play, way, gay aloud.
    solution: 'Step 1: The parts end in play, way, gay. Step 2: All three end in ''-ay'', so they rhyme.'
    mistakes:
      no words rhyme: c4e4_rhyme
      only 'work' rhymes: c4e4_rhyme
  - prompt: 'Case: Neha starts homework, then stops to play a game, then goes back, then stops again to chat. At bedtime, the homework is still half done. What would the poem advise?'
    options:
    - Finish the homework first, then play
    - Do both at the same time to save time
    - Skip homework and only play
    answer: Finish the homework first, then play
    hints:
    - What is the poem's rule?
    - What happens when work is done by halves?
    solution: The poem says to do one thing at a time and do it well. Finishing homework first, then playing, gets both done properly.
    mistakes:
      Do both at the same time to save time: c4e4_poem
      Skip homework and only play: c4e4_poem
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing your own short poem and need a word that rhymes with ''day''. Which word works?'
    options:
    - stay
    - dog
    - deep
    answer: stay
    hints:
    - Listen to the ending sound of 'day'.
    - Which word ends with the same sound?
    solution: '''Day'' and ''stay'' both end with the ''-ay'' sound, so they rhyme.'
    mistakes:
      dog: c4e4_rhyme
      deep: c4e4_rhyme
    exam: competency
    difficulty: 2
