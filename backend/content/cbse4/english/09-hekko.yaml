# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 9. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 9
title: 'Hekko (Unit 3: Fun with Games)'
tips:
  e4_characters: "Characters do things in the story."
  e4_opposite_win: "At the end of a game, one side wins and the other side ..."
  e4_sequence: "A story makes sense when it goes first, next, then, last."
  c4e9_story: 'Ask the four story questions: who, where, what happened, and then what?'
  c4e9_fair: Think how you would feel if the other player did this to you. Is it fair?
  c4e9_gram: Look for time words like 'yesterday' or 'now'. They tell you which verb form fits.

concepts:
- code: cbse4e.u3.hekko
  title: 'Hekko (Unit 3: Fun with Games)'
  notes: |
    A lesson in the unit 'Fun with Games'. Exact story details are not reproduced here (no reliable source was found).
    Questions focus on reading skills for a story about play: characters, sequence of events, feelings, and words
    about games (player, turn, score, win, lose, fair play).
  explanations:
    text: When you read a story about games, look for who plays, how the game is played, who wins and how the players feel. Good players play fairly and are kind whether they win or lose.
    visual: 'Draw a story strip: three boxes for beginning, middle and end of a game, with how the players feel in each.'
    step_by_step: 1. Who are the characters? 2. What game do they play? 3. What happens first, next and last? 4. How do they feel at the end?
    real_world: Saying 'good game' and shaking hands after a match shows fair play.
  picture:
    kind: compare
    columns:
    - title: Fair play
      points:
      - take turns
      - follow rules
      - say 'good game'
    - title: Not fair play
      points:
      - cheating
      - pushing
      - teasing the loser
    alt: Fair play means taking turns, following rules and saying good game; cheating, pushing and teasing the loser are not fair play.
  activity:
    type: sort
    prompt: 'Game words: what does each mean?'
    bins:
    - Turn
    - Score
    - Fair play
    items:
    - label: Your chance to play
      bin: Turn
      clue: Waiting for it.
      why: Your turn is your chance.
    - label: Points you have won
      bin: Score
      clue: Counted.
      why: The score counts points.
    - label: Following the rules honestly
      bin: Fair play
      clue: No cheating.
      why: Fair play means honest play.
    - label: Now it's Riya's chance
      bin: Turn
      clue: Taking it in order.
      why: It's Riya's turn.
    - label: Shaking hands after losing
      bin: Fair play
      clue: Good manners.
      why: Being a good loser is fair play.
  lesson:
    - teach: '''Hekko'' is a story in the unit ''Fun with Games''. When we read a story, we find the characters (the people or animals in it), the setting (where and when), and the events (what happens).'
      check:
        prompt: 'The place where a story happens is called the:'
        options:
        - setting
        - character
        - title
        answer: setting
        why: Setting tells where and when.
      ways:
      - style: visual
        teach: 'Three things to find in any story: characters, setting and events.'
        picture:
          kind: compare
          columns:
          - title: Characters
            points:
            - Who is in the story?
            - People or animals
          - title: Setting
            points:
            - Where does it happen?
            - When does it happen?
          - title: Events
            points:
            - What happens?
            - In what order?
          alt: Characters are who is in the story, people or animals. The setting is where and when it happens. Events are what happens, and in what order.
      - style: step_by_step
        teach: 'Fill a story map. Step 1: Draw three boxes. Step 2: In the first box, draw the characters. Step 3: In the second, draw the place and write the time. Step 4: In the third, write the main thing that happens.'
    - teach: 'Story events happen in order: beginning, middle, end. Words like first, then, next, after that and finally help us tell events in order.'
      picture:
        kind: flow
        steps:
        - 'First: the game starts'
        - 'Then: someone takes a turn'
        - 'Next: a problem comes up'
        - 'Finally: it is sorted out'
        alt: Order words help tell a story from beginning to end.
      check:
        prompt: Which word tells the last event?
        options:
        - finally
        - first
        - then
        answer: finally
        why: '''Finally'' means at the end.'
      ways:
      - style: visual
        teach: Order words that help us tell the events of a story.
        picture:
          kind: flow
          steps:
          - First
          - Then
          - Next
          - After that
          - Finally
          alt: 'Order words help us tell a story in sequence: first, then, next, after that and finally.'
      - style: real_world
        teach: When you tell your family about your day, you probably say 'First we had assembly, then maths, after that lunch'. You are already using order words.
    - teach: 'Game words: player, turn, score, win, lose. Fair play means following rules, waiting for your turn, and being kind whether you win or lose.'
      check:
        prompt: Which of these is fair play?
        options:
        - following the rules
        - changing rules to win
        - hiding the ball
        answer: following the rules
        why: Rules keep the game fair for all.
      ways:
      - style: visual
        teach: Fair play and unfair play compared, side by side.
        picture:
          kind: compare
          columns:
          - title: Fair play
            points:
            - Following the rules
            - Waiting for your turn
            - Being kind if you win or lose
          - title: Unfair play
            points:
            - Changing rules to win
            - Taking extra turns
            - Teasing the other team
          alt: Fair play is following the rules, waiting for your turn and being kind whether you win or lose. Unfair play is changing the rules to win, taking extra turns and teasing the other team.
      - style: real_world
        teach: In many games, players shake hands at the start and at the end. Playing fair makes others want to play with you again tomorrow.
  items:
  - prompt: 'In a story, the characters are:'
    options:
    - the people or animals in it
    - the pages
    - the title
    - the pictures only
    answer: the people or animals in it
    difficulty: 1
    hints:
    - Who is in the story?
    - Players.
    solution: Characters are the people or animals in a story.
    mistakes: {"the pages": "e4_characters"}
  - prompt: Which shows fair play?
    options:
    - waiting for your turn
    - cheating to win
    - pushing others
    - teasing the losing team
    answer: waiting for your turn
    difficulty: 1
    hints:
    - Rules.
    - Turns.
    solution: Waiting for your turn is fair play.
    mistakes:
      cheating to win: eng4_read_again
  - prompt: 'After losing a game, a good player:'
    options:
    - congratulates the winner
    - cries and breaks things
    - shouts at everyone
    - never plays again
    answer: congratulates the winner
    difficulty: 1
    hints:
    - Good sport.
    - Kind.
    solution: Good players congratulate the winners.
    mistakes: {"cries and breaks things": "e6_sportsmanship"}
  - prompt: What is the opposite of 'win'?
    options:
    - lose
    - play
    - score
    - run
    answer: lose
    difficulty: 1
    hints:
    - When the other team wins.
    - Opposite.
    solution: Lose is the opposite of win.
    mistakes: {"score": "e4_opposite_win"}
  - prompt: 'Story events should be told in:'
    options:
    - the order they happen
    - any random order
    - backwards only
    - one word
    answer: the order they happen
    difficulty: 2
    hints:
    - First, next, last.
    - Sequence.
    solution: Tell events in the order they happen.
    mistakes: {"any random order": "e4_sequence"}
  - prompt: 'Choose the correct past tense: ''Yesterday we ___ a new game.'''
    options:
    - played
    - play
    - plays
    - playing
    answer: played
    difficulty: 2
    hints:
    - Yesterday = past.
    - Add -ed.
    solution: Yesterday we played.
    mistakes:
      play: eng4_grammar
  - prompt: Which word tells the first event in a story?
    options:
    - first
    - finally
    - after that
    answer: first
    difficulty: 1
    hints:
    - Which word is about the beginning?
    - It is also a number word for place 1.
    solution: 'Step 1: Finally and after that come later. Step 2: ''First'' starts the story.'
    mistakes:
      finally: c4e9_story
      after that: c4e9_story
  - prompt: What is a 'score' in a game?
    options:
    - the points a player or team gets
    - the ball
    - the playground
    answer: the points a player or team gets
    difficulty: 1
    hints:
    - Teams want a higher one.
    - It is written on a board.
    solution: 'Step 1: Games count points. Step 2: The count is the score.'
    mistakes:
      the ball: c4e9_story
      the playground: c4e9_story
  - prompt: 'A player keeps taking extra turns. This is:'
    options:
    - not fair
    - fair play
    - good teamwork
    answer: not fair
    difficulty: 1
    hints:
    - Turns are shared.
    - How do others feel?
    solution: 'Step 1: Everyone should get equal turns. Step 2: Extra turns are not fair.'
    mistakes:
      fair play: c4e9_fair
      good teamwork: c4e9_fair
  - prompt: 'Choose the correct sentence: ''Now it ___ my turn.'''
    options:
    - is
    - was
    - were
    answer: is
    difficulty: 2
    hints:
    - '''Now'' tells the time.'
    - Present time with one thing uses ...
    solution: 'Step 1: ''Now'' is the present. Step 2: ''It is my turn.'''
    mistakes:
      was: c4e9_gram
      were: c4e9_gram
  - prompt: Who is a 'player'?
    options:
    - someone who takes part in a game
    - someone who sells toys
    - someone who makes rules only
    answer: someone who takes part in a game
    difficulty: 1
    hints:
    - The word has 'play' in it.
    - Who plays?
    solution: 'Step 1: play + er = player. Step 2: A player takes part in a game.'
    mistakes:
      someone who sells toys: c4e9_story
      someone who makes rules only: c4e9_story
  - prompt: 'Choose the past tense: ''Yesterday Mina ___ the game.'''
    options:
    - won
    - wins
    - winning
    answer: won
    difficulty: 2
    hints:
    - '''Yesterday'' is in the past.'
    - Win has a special past form.
    solution: 'Step 1: Yesterday = past. Step 2: The past of ''win'' is ''won''.'
    mistakes:
      wins: c4e9_gram
      winning: c4e9_gram
  - prompt: Two friends both want to start a game. What is a fair way to decide?
    options:
    - toss a coin
    - the louder one starts
    - the older one always starts
    answer: toss a coin
    difficulty: 2
    hints:
    - A fair way gives both an equal chance.
    - Which choice depends only on luck?
    solution: 'Step 1: A coin gives both an equal chance. Step 2: Tossing a coin is fair.'
    mistakes:
      the louder one starts: c4e9_fair
      the older one always starts: c4e9_fair
  - prompt: How does a character usually feel after winning a hard game?
    options:
    - proud and happy
    - bored
    - sleepy
    answer: proud and happy
    difficulty: 1
    hints:
    - They worked hard.
    - Winning feels ...
    solution: 'Step 1: Hard work led to a win. Step 2: They feel proud and happy.'
    mistakes:
      bored: c4e9_story
      sleepy: c4e9_story
  - prompt: 'Put in order: ''We shook hands.'' ''We played the game.'' ''We chose teams.'''
    options:
    - chose teams, played the game, shook hands
    - shook hands, chose teams, played the game
    - played the game, chose teams, shook hands
    answer: chose teams, played the game, shook hands
    difficulty: 3
    hints:
    - You need teams before you play.
    - Shaking hands comes after the game.
    solution: 'Step 1: Choose teams first. Step 2: Then play, then shake hands.'
    mistakes:
      shook hands, chose teams, played the game: c4e9_story
      played the game, chose teams, shook hands: c4e9_story
  - prompt: 'Case: Mira wrote a story: ''The race ended. We got ready at the starting line. Then the whistle blew and we ran.'' What is wrong with it?'
    options:
    - The events are not in the right order
    - There are no characters
    - There is no setting at all
    answer: The events are not in the right order
    hints:
    - What should come first in a race story?
    - Does the ending come at the start of Mira's story?
    solution: 'The race ending is told first. The events should go: got ready, the whistle blew and we ran, then the race ended.'
    mistakes:
      There are no characters: c4e9_story
      There is no setting at all: c4e9_story
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing about a game you played last Sunday. Which sentence is correct?'
    options:
    - Last Sunday we played hopscotch.
    - Last Sunday we play hopscotch.
    - Last Sunday we will play hopscotch.
    answer: Last Sunday we played hopscotch.
    hints:
    - Does 'last Sunday' tell about the past, now or later?
    - Which verb form fits the past?
    solution: '''Last Sunday'' is in the past, so the verb is ''played''.'
    mistakes:
      Last Sunday we play hopscotch.: c4e9_gram
      Last Sunday we will play hopscotch.: c4e9_gram
    exam: competency
    difficulty: 2
