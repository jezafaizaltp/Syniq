subject: cbse4-eng
chapter: 9
title: 'Hekko (Unit 3: Fun with Games)'
tips:
  e4_characters: "Characters do things in the story."
  e4_opposite_win: "At the end of a game, one side wins and the other side ..."
  e4_sequence: "A story makes sense when it goes first, next, then, last."

concepts:
- code: cbse4e.u3.hekko
  title: 'Hekko (Unit 3: Fun with Games)'
  notes: |
    A lesson in the unit 'Fun with Games'. Exact story details are not reproduced here (no reliable source was found).
    Questions focus on reading skills for a story about play: characters, sequence of events, feelings, and words
    about games (player, turn, score, win, lose, fair play).
  explanations:
    text: When you read a story about games, look for who plays, how the game is played, who wins and how the players feel. Good players play fairly and are kind whether they win or lose.
    visual: 'Draw a story strip: three boxes for beginning, middle and end of a game, with how the players feel in each.'
    step_by_step: 1. Who are the characters? 2. What game do they play? 3. What happens first, next and last? 4. How do they feel at the end?
    real_world: Saying 'good game' and shaking hands after a match shows fair play.
  picture:
    kind: compare
    columns:
    - title: Fair play
      points:
      - take turns
      - follow rules
      - say 'good game'
    - title: Not fair play
      points:
      - cheating
      - pushing
      - teasing the loser
    alt: Fair play means taking turns, following rules and saying good game; cheating, pushing and teasing the loser are not fair play.
  activity:
    type: sort
    prompt: 'Game words: what does each mean?'
    bins:
    - Turn
    - Score
    - Fair play
    items:
    - label: Your chance to play
      bin: Turn
      clue: Waiting for it.
      why: Your turn is your chance.
    - label: Points you have won
      bin: Score
      clue: Counted.
      why: The score counts points.
    - label: Following the rules honestly
      bin: Fair play
      clue: No cheating.
      why: Fair play means honest play.
    - label: Now it's Riya's chance
      bin: Turn
      clue: Taking it in order.
      why: It's Riya's turn.
    - label: Shaking hands after losing
      bin: Fair play
      clue: Good manners.
      why: Being a good loser is fair play.
  items:
  - prompt: 'In a story, the characters are:'
    options:
    - the people or animals in it
    - the pages
    - the title
    - the pictures only
    answer: the people or animals in it
    difficulty: 1
    hints:
    - Who is in the story?
    - Players.
    solution: Characters are the people or animals in a story.
    mistakes: {"the pages": "e4_characters"}
  - prompt: Which shows fair play?
    options:
    - waiting for your turn
    - cheating to win
    - pushing others
    - teasing the losing team
    answer: waiting for your turn
    difficulty: 1
    hints:
    - Rules.
    - Turns.
    solution: Waiting for your turn is fair play.
    mistakes:
      cheating to win: eng4_read_again
  - prompt: 'After losing a game, a good player:'
    options:
    - congratulates the winner
    - cries and breaks things
    - shouts at everyone
    - never plays again
    answer: congratulates the winner
    difficulty: 1
    hints:
    - Good sport.
    - Kind.
    solution: Good players congratulate the winners.
    mistakes: {"cries and breaks things": "e6_sportsmanship"}
  - prompt: What is the opposite of 'win'?
    options:
    - lose
    - play
    - score
    - run
    answer: lose
    difficulty: 1
    hints:
    - When the other team wins.
    - Opposite.
    solution: Lose is the opposite of win.
    mistakes: {"score": "e4_opposite_win"}
  - prompt: 'Story events should be told in:'
    options:
    - the order they happen
    - any random order
    - backwards only
    - one word
    answer: the order they happen
    difficulty: 2
    hints:
    - First, next, last.
    - Sequence.
    solution: Tell events in the order they happen.
    mistakes: {"any random order": "e4_sequence"}
  - prompt: 'Choose the correct past tense: ''Yesterday we ___ a new game.'''
    options:
    - played
    - play
    - plays
    - playing
    answer: played
    difficulty: 2
    hints:
    - Yesterday = past.
    - Add -ed.
    solution: Yesterday we played.
    mistakes:
      play: eng4_grammar
