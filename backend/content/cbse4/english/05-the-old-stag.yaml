concepts:
- code: cbse4e.u2.stag
  title: 'The Old Stag (Unit 2: My Beautiful World)'
  notes: |
    A story about an old stag (a male deer with antlers) in the forest. Like many animal fables, it teaches a lesson about
    wisdom, experience and what truly matters. Exact story details are not reproduced here; questions focus on animal
    words (stag, doe, fawn, antlers, herd), reading a fable and its moral.
  explanations:
    text: A stag is a male deer with branching antlers. In animal stories, an old animal often has wisdom from experience. Fables end with a lesson, called the moral.
    visual: Draw an old stag with big branching antlers standing by a forest pool, with young deer listening to him.
    step_by_step: 1. Who is the main character? 2. What problem does it face? 3. What does it learn or teach? 4. What is the moral?
    real_world: Spotted deer (chital) live in herds in Indian forests such as Periyar and Bandipur.
  picture:
    kind: compare
    columns:
    - title: Word
      points:
      - stag
      - doe
      - fawn
    - title: Meaning
      points:
      - male deer
      - female deer
      - baby deer
    alt: A stag is a male deer, a doe is a female deer, and a fawn is a baby deer.
  activity:
    type: sort
    prompt: 'The Old Stag: which deer word?'
    bins:
    - Stag
    - Doe
    - Fawn
    - Herd
    items:
    - label: A male deer
      bin: Stag
      clue: Has antlers.
      why: A stag is a male deer.
    - label: A female deer
      bin: Doe
      clue: A mother deer.
      why: A doe is a female deer.
    - label: A baby deer
      bin: Fawn
      clue: Young and spotted.
      why: A fawn is a baby deer.
    - label: A group of deer
      bin: Herd
      clue: Many together.
      why: A group of deer is a herd.
  items:
  - prompt: What is a stag?
    options:
    - a male deer
    - a baby deer
    - a bird
    - a fish
    answer: a male deer
    difficulty: 1
    hints:
    - It has antlers.
    - Deer family.
    solution: A stag is a male deer.
    mistakes:
      a baby deer: eng4_word
  - prompt: 'A baby deer is called a:'
    options:
    - fawn
    - calf
    - kitten
    - puppy
    answer: fawn
    difficulty: 2
    hints:
    - Bambi was one.
    - Young deer.
    solution: A baby deer is a fawn.
    mistakes: {"calf": "e4_fawn"}
  - prompt: 'The branching horns on a stag''s head are called:'
    options:
    - antlers
    - tusks
    - feathers
    - fins
    answer: antlers
    difficulty: 1
    hints:
    - Like tree branches.
    - Deer.
    solution: They are antlers.
    mistakes: {"tusks": "e4_antlers"}
  - prompt: 'The lesson at the end of a fable is called the:'
    options:
    - moral
    - title
    - rhyme
    - chapter
    answer: moral
    difficulty: 2
    hints:
    - What we learn.
    - Lesson.
    solution: A fable's lesson is its moral.
    mistakes: {"title": "e4_moral"}
  - prompt: 'A group of deer is called a:'
    options:
    - herd
    - flock
    - school
    - swarm
    answer: herd
    difficulty: 2
    hints:
    - Like cows.
    - Many deer.
    solution: A group of deer is a herd.
    mistakes: {"flock": "e4_herd"}
  - prompt: 'Old animals in stories are often shown as:'
    options:
    - wise
    - silly
    - lazy
    - rude
    answer: wise
    difficulty: 1
    hints:
    - Experience.
    - Know a lot.
    solution: Old animals are often wise in stories.
    mistakes:
      silly: eng4_read_again
