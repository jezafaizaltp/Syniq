# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 5. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 5
title: 'The Old Stag (Unit 2: My Beautiful World)'
tips:
  e4_antlers: "Tusks are an elephant's long teeth. A stag's horns branch like a tree."
  e4_fawn: "A calf is a baby cow. A baby deer has its own short name."
  e4_herd: "A flock is for birds or sheep. Cows and deer move in a ..."
  e4_moral: "The lesson a fable teaches has a special name."
  c4e5_animal: 'Think of the family words for deer: the father, the mother, the baby, and the group.'
  c4e5_fable: Ask what the animal learned or taught by the end. That is the fable's lesson.
  c4e5_word: Put each choice into the sentence and read it aloud. Which keeps the meaning?

concepts:
- code: cbse4e.u2.stag
  title: 'The Old Stag (Unit 2: My Beautiful World)'
  notes: |
    A story about an old stag (a male deer with antlers) in the forest. Like many animal fables, it teaches a lesson about
    wisdom, experience and what truly matters. Exact story details are not reproduced here; questions focus on animal
    words (stag, doe, fawn, antlers, herd), reading a fable and its moral.
  explanations:
    text: A stag is a male deer with branching antlers. In animal stories, an old animal often has wisdom from experience. Fables end with a lesson, called the moral.
    visual: Draw an old stag with big branching antlers standing by a forest pool, with young deer listening to him.
    step_by_step: 1. Who is the main character? 2. What problem does it face? 3. What does it learn or teach? 4. What is the moral?
    real_world: Spotted deer (chital) live in herds in Indian forests such as Periyar and Bandipur.
  picture:
    kind: compare
    columns:
    - title: Word
      points:
      - stag
      - doe
      - fawn
    - title: Meaning
      points:
      - male deer
      - female deer
      - baby deer
    alt: A stag is a male deer, a doe is a female deer, and a fawn is a baby deer.
  activity:
    type: sort
    prompt: 'The Old Stag: which deer word?'
    bins:
    - Stag
    - Doe
    - Fawn
    - Herd
    items:
    - label: A male deer
      bin: Stag
      clue: Has antlers.
      why: A stag is a male deer.
    - label: A female deer
      bin: Doe
      clue: A mother deer.
      why: A doe is a female deer.
    - label: A baby deer
      bin: Fawn
      clue: Young and spotted.
      why: A fawn is a baby deer.
    - label: A group of deer
      bin: Herd
      clue: Many together.
      why: A group of deer is a herd.
  lesson:
    - teach: '''The Old Stag'' is a story about an old male deer in the forest. Deer words: a stag is a male deer, a doe is a female deer, a fawn is a baby deer, and a herd is a group of deer.'
      check:
        prompt: 'A doe is a:'
        options:
        - female deer
        - baby deer
        - male deer
        answer: female deer
        why: Stag is male, doe is female, fawn is the baby.
      ways:
      - style: visual
        teach: 'Family words for deer: the father, the mother, the baby and the group.'
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - Stag
            - Doe
            - Fawn
            - Herd
          - title: Means
            points:
            - Male deer
            - Female deer
            - Baby deer
            - Group of deer
          alt: A stag is a male deer, a doe is a female deer, a fawn is a baby deer and a herd is a group of deer.
      - style: real_world
        teach: Other animals have special family words too. A baby cow is a calf, a baby dog is a puppy, and a group of cows is a herd, just like deer.
    - teach: A stag has antlers, branching horns that fall off and grow back every year. Old stags in stories are often shown as wise, because they have seen many seasons.
      picture:
        kind: compare
        columns:
        - title: Stag
          points:
          - male deer
          - has antlers
        - title: Doe
          points:
          - female deer
          - no antlers
        - title: Fawn
          points:
          - baby deer
          - spotted coat
        alt: 'Deer family words: stag, doe and fawn.'
      check:
        prompt: Why are old animals in fables often wise?
        options:
        - they have lived long and learned a lot
        - they are the biggest
        - they never speak
        answer: they have lived long and learned a lot
        why: Long life brings experience.
      ways:
      - style: step_by_step
        teach: 'Describe a stag. Step 1: Look at a picture of a stag. Step 2: Notice the antlers: branching horns on its head. Step 3: Remember they fall off and grow back every year. Step 4: Write two sentences about the stag using the word ''antlers''.'
      - style: real_world
        teach: 'In stories from many countries, the oldest animal is the one others go to for advice: an old owl, an old elephant or an old stag. Long life means many lessons learned.'
    - teach: 'A fable is a short story, often with animals, that ends with a lesson called the moral. To find the moral, ask: what did a character learn, or what should we learn from what happened?'
      check:
        prompt: What is a moral?
        options:
        - the lesson of a story
        - the title
        - the first line
        answer: the lesson of a story
        why: Fables end with a moral.
      ways:
      - style: visual
        teach: How to find the moral of a fable, step by step.
        picture:
          kind: flow
          steps:
          - Read the whole fable
          - 'Ask: what problem came up?'
          - 'Ask: what did a character learn?'
          - Say it as a lesson for everyone
          - That lesson is the moral
          alt: To find the moral, read the whole fable, ask what problem came up and what a character learned, and say it as a lesson for everyone. That lesson is the moral.
      - style: real_world
        teach: Fables like the hare and the tortoise end with a lesson, such as 'slow and steady wins the race'. People still use these lessons as sayings in daily life.
  items:
  - prompt: What is a stag?
    options:
    - a male deer
    - a baby deer
    - a bird
    - a fish
    answer: a male deer
    difficulty: 1
    hints:
    - It has antlers.
    - Deer family.
    solution: A stag is a male deer.
    mistakes:
      a baby deer: eng4_word
  - prompt: 'A baby deer is called a:'
    options:
    - fawn
    - calf
    - kitten
    - puppy
    answer: fawn
    difficulty: 2
    hints:
    - Bambi was one.
    - Young deer.
    solution: A baby deer is a fawn.
    mistakes: {"calf": "e4_fawn"}
  - prompt: 'The branching horns on a stag''s head are called:'
    options:
    - antlers
    - tusks
    - feathers
    - fins
    answer: antlers
    difficulty: 1
    hints:
    - Like tree branches.
    - Deer.
    solution: They are antlers.
    mistakes: {"tusks": "e4_antlers"}
  - prompt: 'The lesson at the end of a fable is called the:'
    options:
    - moral
    - title
    - rhyme
    - chapter
    answer: moral
    difficulty: 2
    hints:
    - What we learn.
    - Lesson.
    solution: A fable's lesson is its moral.
    mistakes: {"title": "e4_moral"}
  - prompt: 'A group of deer is called a:'
    options:
    - herd
    - flock
    - school
    - swarm
    answer: herd
    difficulty: 2
    hints:
    - Like cows.
    - Many deer.
    solution: A group of deer is a herd.
    mistakes: {"flock": "e4_herd"}
  - prompt: 'Old animals in stories are often shown as:'
    options:
    - wise
    - silly
    - lazy
    - rude
    answer: wise
    difficulty: 1
    hints:
    - Experience.
    - Know a lot.
    solution: Old animals are often wise in stories.
    mistakes:
      silly: eng4_read_again
  - prompt: 'Deer belong to a group of animals that eat:'
    options:
    - "grass and leaves"
    - "meat"
    - "fish"
    answer: grass and leaves
    difficulty: 1
    hints:
    - Deer graze in forests and meadows.
    - Are they hunters or plant-eaters?
    solution: 'Step 1: Deer graze. Step 2: They eat grass and leaves.'
    mistakes:
      "meat": c4e5_animal
      "fish": c4e5_animal
  - prompt: 'Choose the correct plural: one deer, two ___'
    options:
    - deer
    - deers
    - deeres
    answer: deer
    difficulty: 3
    hints:
    - Some animal words do not change in the plural.
    - 'Think of ''sheep'': one sheep, two sheep.'
    solution: 'Step 1: ''Deer'' is like ''sheep''. Step 2: The plural stays ''deer''.'
    mistakes:
      deers: c4e5_word
      deeres: c4e5_word
  - prompt: Why do deer usually live in herds?
    options:
    - "it is safer from hunters in a group"
    - "they like to fight with each other"
    - "they are not able to walk alone"
    answer: it is safer from hunters in a group
    difficulty: 2
    hints:
    - Tigers hunt deer.
    - Many eyes and ears help spot danger.
    solution: 'Step 1: Many deer can watch for danger. Step 2: So herds are safer.'
    mistakes:
      "they like to fight with each other": c4e5_animal
      "they are not able to walk alone": c4e5_animal
  - prompt: Which animal story is a fable?
    options:
    - "a short tale where animals talk and there is a lesson"
    - "a news report about animals seen in a forest park"
    - "a shopping list of food to buy for pet animals"
    answer: a short tale where animals talk and there is a lesson
    difficulty: 1
    hints:
    - Fables often have talking animals.
    - They end with a moral.
    solution: 'Step 1: Fables are short tales. Step 2: They have talking animals and a lesson.'
    mistakes:
      "a news report about animals seen in a forest park": c4e5_fable
      "a shopping list of food to buy for pet animals": c4e5_fable
  - prompt: What does 'wise' mean?
    options:
    - "having good sense from experience"
    - "being able to run very fast"
    - "speaking in a very loud voice"
    answer: having good sense from experience
    difficulty: 2
    hints:
    - Grandparents are often called this.
    - It is about thinking, not speed.
    solution: 'Step 1: Wise people think well. Step 2: Wise means having good sense from experience.'
    mistakes:
      "being able to run very fast": c4e5_word
      "speaking in a very loud voice": c4e5_word
  - prompt: Choose the opposite of 'old'.
    options:
    - young
    - tall
    - wise
    answer: young
    difficulty: 1
    hints:
    - A fawn is not old.
    - What word describes a fawn?
    solution: 'Step 1: Old is about age. Step 2: The opposite is young.'
    mistakes:
      tall: c4e5_word
      wise: c4e5_word
  - prompt: 'A stag''s antlers are used to:'
    options:
    - "defend itself and compete with other stags"
    - "dig deep holes in the ground to find water"
    - "carry food and leaves back to the young deer"
    answer: defend itself and compete with other stags
    difficulty: 2
    hints:
    - Antlers are strong and pointed.
    - What do stags do in the mating season?
    solution: 'Step 1: Antlers are like weapons. Step 2: Stags use them to defend and compete.'
    mistakes:
      "dig deep holes in the ground to find water": c4e5_animal
      "carry food and leaves back to the young deer": c4e5_animal
  - prompt: 'Fill in: The young fawn stayed close ___ its mother.'
    options:
    - to
    - 'on'
    - at
    answer: to
    difficulty: 2
    hints:
    - We say 'close ___ something'.
    - Try 'close to the door'.
    solution: 'Step 1: The phrase is ''close to''. Step 2: The fawn stayed close to its mother.'
    mistakes:
      'on': c4e5_word
      at: c4e5_word
  - prompt: 'If a young deer ignores the old stag''s warning and gets into trouble, the moral is most likely:'
    options:
    - "listen to the advice of the experienced"
    - "stay inside your home and do not go out"
    - "always run as fast as you possibly can"
    answer: listen to the advice of the experienced
    difficulty: 3
    hints:
    - Who knew better in this story?
    - What should the young deer have done?
    solution: 'Step 1: The old stag knew the danger. Step 2: The lesson is to listen to experienced advice.'
    mistakes:
      "stay inside your home and do not go out": c4e5_fable
      "always run as fast as you possibly can": c4e5_fable
  - prompt: 'Case: In a fable, an ant works all summer storing grain, while a grasshopper only sings and laughs at the ant. When winter comes, the grasshopper has no food. What is the moral?'
    options:
    - Work hard and plan ahead for hard times
    - Singing is always bad
    - Ants are stronger than grasshoppers
    answer: Work hard and plan ahead for hard times
    hints:
    - What did the ant do that the grasshopper did not?
    - What lesson should we learn from what happened in winter?
    solution: The ant planned ahead and had food in winter; the grasshopper did not. The moral is to work hard and plan ahead.
    mistakes:
      Singing is always bad: c4e5_fable
      Ants are stronger than grasshoppers: c4e5_fable
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are labelling a picture of a deer family in the forest. What should you write under the baby deer?'
    options:
    - fawn
    - stag
    - herd
    answer: fawn
    hints:
    - Which word means a baby deer?
    - Stag and herd mean something else.
    solution: A baby deer is called a fawn. A stag is a male deer and a herd is a group of deer.
    mistakes:
      stag: c4e5_animal
      herd: c4e5_animal
    exam: competency
    difficulty: 2
