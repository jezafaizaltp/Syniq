# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 7. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 7
title: 'Fit Body, Fit Mind, Fit Nation (Unit 3: Fun with Games)'
concepts:
- code: cbse4e.u3.fit
  title: 'Fit Body, Fit Mind, Fit Nation (Unit 3: Fun with Games)'
  notes: |
    A lesson on fitness: exercise, sports, yoga and healthy food keep the body and mind strong; healthy people make a
    strong country. India's Fit India Movement began in 2019 (launched on National Sports Day, 29 August, Major Dhyan
    Chand's birthday). International Yoga Day is 21 June. Exact text is not reproduced here.
  explanations:
    text: Playing, exercising, doing yoga and eating healthy food keep both our body and our mind strong. When all people are healthy, the whole country is strong. That's why India started the Fit India Movement.
    visual: Draw children doing yoga, running and playing kabaddi, with a banner 'Fit India'.
    step_by_step: 1. Exercise every day. 2. Eat healthy food. 3. Sleep well. 4. Fit people make a fit nation.
    real_world: National Sports Day on 29 August honours hockey legend Major Dhyan Chand.
  picture:
    kind: flow
    steps:
    - Exercise and play
    - Fit body
    - Fresh, happy mind
    - Strong nation
    alt: Exercise and play give a fit body and a fresh, happy mind, and fit people make a strong nation.
  items:
  - prompt: Which keeps the body fit?
    options:
    - exercise and play
    - sitting all day
    - eating only sweets
    - no sleep
    answer: exercise and play
    difficulty: 1
    hints:
    - Move.
    - Games.
    solution: Exercise and play keep us fit.
  - prompt: What does 'fit' mean here?
    options:
    - healthy and strong
    - tiny
    - tired
    - angry
    answer: healthy and strong
    difficulty: 1
    hints:
    - Fit body.
    - Healthy.
    solution: Fit means healthy and strong.
    mistakes:
      tired: eng4_word
  - prompt: 'National Sports Day honours:'
    options:
    - Major Dhyan Chand
    - Louis Braille
    - Mahatma Gandhi only
    - a cricket ball
    answer: Major Dhyan Chand
    difficulty: 2
    hints:
    - Hockey wizard.
    - 29 August.
    solution: It honours Major Dhyan Chand.
  - prompt: When is International Yoga Day?
    options:
    - 21 June
    - 26 January
    - 2 October
    - 14 November
    answer: 21 June
    difficulty: 2
    hints:
    - Longest day.
    - June.
    solution: Yoga Day is 21 June.
  - prompt: How does exercise help the mind?
    options:
    - it makes us feel fresh and happy
    - it makes us sad
    - it makes us forget everything
    - it does nothing
    answer: it makes us feel fresh and happy
    difficulty: 1
    hints:
    - After playing you feel ...
    - Good.
    solution: Exercise makes us feel fresh and happy.
  - prompt: 'Choose the correct sentence:'
    options:
    - She plays football every day.
    - She play football every day.
    - She playing football every day.
    - She are play football.
    answer: She plays football every day.
    difficulty: 2
    hints:
    - '''She'' takes ''plays''.'
    - Add s.
    solution: '''She plays'' is correct.'
    mistakes:
      She play football every day.: eng4_grammar
