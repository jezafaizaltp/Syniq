# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 7. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 7
title: 'Fit Body, Fit Mind, Fit Nation (Unit 3: Fun with Games)'
tips:
  e4_exercise_mind: "How do you feel after running and playing?"
  e4_sports_day: "Sports Day is the birthday of India's greatest hockey player."
  c4e7_fit: 'Ask: does this make the body move, rest well or eat well? Or does it keep us still and tired?'
  c4e7_fact: 'Recall the special days and names from the lesson: Sports Day, Yoga Day, Fit India.'
  c4e7_gram: Look at who is doing the action and when. That tells you the verb form.

concepts:
- code: cbse4e.u3.fit
  title: 'Fit Body, Fit Mind, Fit Nation (Unit 3: Fun with Games)'
  notes: |
    A lesson on fitness: exercise, sports, yoga and healthy food keep the body and mind strong; healthy people make a
    strong country. India's Fit India Movement began in 2019 (launched on National Sports Day, 29 August, Major Dhyan
    Chand's birthday). International Yoga Day is 21 June. Exact text is not reproduced here.
  explanations:
    text: Playing, exercising, doing yoga and eating healthy food keep both our body and our mind strong. When all people are healthy, the whole country is strong. That's why India started the Fit India Movement.
    visual: Draw children doing yoga, running and playing kabaddi, with a banner 'Fit India'.
    step_by_step: 1. Exercise every day. 2. Eat healthy food. 3. Sleep well. 4. Fit people make a fit nation.
    real_world: National Sports Day on 29 August honours hockey legend Major Dhyan Chand.
  picture:
    kind: flow
    steps:
    - Exercise and play
    - Fit body
    - Fresh, happy mind
    - Strong nation
    alt: Exercise and play give a fit body and a fresh, happy mind, and fit people make a strong nation.
  activity:
    type: sort
    prompt: 'Fit Body, Fit Mind: what keeps you fit?'
    bins:
    - Keeps you fit
    - Doesn't help
    items:
    - label: Playing outdoors every day
      bin: Keeps you fit
      clue: Moving your body.
      why: Exercise builds strength.
    - label: Yoga in the morning
      bin: Keeps you fit
      clue: Body and mind.
      why: Yoga keeps body and mind healthy.
    - label: Fruit and vegetables
      bin: Keeps you fit
      clue: Healthy food.
      why: Healthy food helps.
    - label: Chips and fizzy drinks daily
      bin: Doesn't help
      clue: Junk food.
      why: Junk food doesn't make you fit.
    - label: Hours on a screen
      bin: Doesn't help
      clue: Sitting still.
      why: Long screen time means no movement.
  lesson:
    - teach: Being fit means being healthy and strong. Exercise, sports, yoga, good food and enough sleep keep the body fit. A fit body helps us study, play and work better.
      check:
        prompt: Which keeps you fit?
        options:
        - cycling and skipping
        - sitting all day
        - skipping meals
        answer: cycling and skipping
        why: Moving the body makes it strong.
      ways:
      - style: visual
        teach: Five things that keep the body fit, and what each one gives us.
        picture:
          kind: compare
          columns:
          - title: Keeps us fit
            points:
            - Exercise
            - Sports
            - Yoga
            - Good food
            - Enough sleep
          - title: Gives us
            points:
            - Strong muscles
            - Teamwork and stamina
            - Calm breathing
            - Energy to grow
            - Rest to start fresh
          alt: Exercise gives strong muscles, sports give teamwork and stamina, yoga gives calm breathing, good food gives energy to grow and enough sleep gives rest to start fresh.
      - style: step_by_step
        teach: 'Do a five-minute morning warm-up. Step 1: Stretch your arms up high and count to ten. Step 2: Touch your toes slowly five times. Step 3: Jog on the spot for one minute. Step 4: Breathe in deeply and breathe out slowly three times.'
    - teach: 'Exercise helps the mind too: after a game or a run we feel fresh, happy and calm. Yoga helps us breathe slowly and focus.'
      picture:
        kind: flow
        steps:
        - 'move: play, run, yoga'
        - body gets stronger
        - mind feels fresh
        - we learn and work better
        alt: How exercise helps both body and mind.
      check:
        prompt: How does yoga help the mind?
        options:
        - it helps us stay calm and focused
        - it makes us sleepy all day
        - it makes us angry
        answer: it helps us stay calm and focused
        why: Slow breathing calms the mind.
      ways:
      - style: step_by_step
        teach: 'Notice how exercise changes your mood. Step 1: Before playing, write one word for how you feel. Step 2: Play or run for 20 minutes. Step 3: Rest and drink water. Step 4: Write a new word for how you feel. Compare the two words.'
      - style: real_world
        teach: Many schools start the day with a short assembly exercise or yoga session. Teachers find that children settle down and focus better in the first class after moving their bodies.
    - teach: When people are fit, the whole country is stronger. India's Fit India Movement began on 29 August 2019, National Sports Day, the birthday of hockey star Major Dhyan Chand. International Yoga Day is 21 June.
      check:
        prompt: Major Dhyan Chand was famous for which sport?
        options:
        - hockey
        - chess
        - swimming
        answer: hockey
        why: He was India's great hockey player.
      ways:
      - style: visual
        teach: Important days and names linked with fitness in India.
        picture:
          kind: compare
          columns:
          - title: Day or name
            points:
            - National Sports Day
            - Fit India Movement
            - International Yoga Day
          - title: When and why
            points:
            - 29 August, Major Dhyan Chand's birthday
            - Began on 29 August 2019
            - 21 June every year
          alt: National Sports Day is on 29 August, Major Dhyan Chand's birthday. The Fit India Movement began on 29 August 2019. International Yoga Day is on 21 June every year.
      - style: real_world
        teach: When many people in a town walk, cycle and play, fewer fall ill. Doctors and hospitals are less crowded, and people can work, study and help each other more.
  items:
  - prompt: Which keeps the body fit?
    options:
    - exercise and play
    - sitting all day
    - eating only sweets
    - no sleep
    answer: exercise and play
    difficulty: 1
    hints:
    - Move.
    - Games.
    solution: Exercise and play keep us fit.
    mistakes: {"sitting all day": "v4_fit"}
  - prompt: What does 'fit' mean here?
    options:
    - healthy and strong
    - tiny
    - tired
    - angry
    answer: healthy and strong
    difficulty: 1
    hints:
    - Fit body.
    - Healthy.
    solution: Fit means healthy and strong.
    mistakes:
      tired: eng4_word
  - prompt: 'National Sports Day honours:'
    options:
    - Major Dhyan Chand
    - Louis Braille
    - Mahatma Gandhi only
    - a cricket ball
    answer: Major Dhyan Chand
    difficulty: 2
    hints:
    - Hockey wizard.
    - 29 August.
    solution: It honours Major Dhyan Chand.
    mistakes: {"Louis Braille": "e4_sports_day"}
  - prompt: When is International Yoga Day?
    options:
    - 21 June
    - 26 January
    - 2 October
    - 14 November
    answer: 21 June
    difficulty: 2
    hints:
    - Longest day.
    - June.
    solution: Yoga Day is 21 June.
    mistakes: {"26 January": "e6_yoga_day"}
  - prompt: How does exercise help the mind?
    options:
    - it makes us feel fresh and happy
    - it makes us sad
    - it makes us forget everything
    - it does nothing
    answer: it makes us feel fresh and happy
    difficulty: 1
    hints:
    - After playing you feel ...
    - Good.
    solution: Exercise makes us feel fresh and happy.
    mistakes: {"it makes us sad": "e4_exercise_mind"}
  - prompt: 'Choose the correct sentence:'
    options:
    - She plays football every day.
    - She play football every day.
    - She playing football every day.
    - She are play football.
    answer: She plays football every day.
    difficulty: 2
    hints:
    - '''She'' takes ''plays''.'
    - Add s.
    solution: '''She plays'' is correct.'
    mistakes:
      She play football every day.: eng4_grammar
  - prompt: In which year did the Fit India Movement begin?
    answer: '2019'
    check: '2019'
    difficulty: 2
    hints:
    - It began on National Sports Day.
    - It was a few years before 2020.
    solution: 'Step 1: It began on 29 August. Step 2: The year was 2019.'
    mistakes:
      '2009': c4e7_fact
      '2020': c4e7_fact
  - prompt: Which is a healthy habit?
    options:
    - "playing outdoors for an hour every day"
    - "eating a packet of chips every day"
    - "sleeping very late every single night"
    answer: playing outdoors for an hour every day
    difficulty: 1
    hints:
    - Healthy habits keep the body active.
    - Which one gets you moving?
    solution: 'Step 1: Chips and late nights are not healthy. Step 2: Daily outdoor play is.'
    mistakes:
      "eating a packet of chips every day": c4e7_fit
      "sleeping very late every single night": c4e7_fit
  - prompt: What does 'nation' mean?
    options:
    - a country and its people
    - a school
    - a game
    answer: a country and its people
    difficulty: 2
    hints:
    - Think of 'national flag'.
    - India is one of these.
    solution: 'Step 1: India is a nation. Step 2: A nation is a country and its people.'
    mistakes:
      a school: c4e7_fact
      a game: c4e7_fact
  - prompt: Choose the correct sentence.
    options:
    - We do yoga every morning.
    - We does yoga every morning.
    - We doing yoga every morning.
    answer: We do yoga every morning.
    difficulty: 2
    hints:
    - '''We'' is more than one person.'
    - With 'we', use 'do', not 'does'.
    solution: 'Step 1: ''We'' takes ''do''. Step 2: We do yoga every morning.'
    mistakes:
      We does yoga every morning.: c4e7_gram
      We doing yoga every morning.: c4e7_gram
  - prompt: Why should we drink water after playing?
    options:
    - we lose water when we sweat
    - water makes us run faster at once
    - it is a rule with no reason
    answer: we lose water when we sweat
    difficulty: 2
    hints:
    - Playing makes us sweat.
    - What is sweat mostly made of?
    solution: 'Step 1: Sweat is mostly water. Step 2: We drink to replace it.'
    mistakes:
      water makes us run faster at once: c4e7_fit
      it is a rule with no reason: c4e7_fit
  - prompt: Which word is the opposite of 'strong'?
    options:
    - weak
    - tall
    - fit
    answer: weak
    difficulty: 1
    hints:
    - Opposites mean the reverse.
    - A tired, ill person may feel ...
    solution: 'Step 1: Strong means having power. Step 2: The opposite is weak.'
    mistakes:
      tall: c4e7_gram
      fit: c4e7_gram
  - prompt: 'Fill in: Healthy children make a healthy ___.'
    options:
    - nation
    - pencil
    - cloud
    answer: nation
    difficulty: 1
    hints:
    - Think of the lesson's title.
    - Fit body, fit mind, fit ...
    solution: 'Step 1: The title ends ''Fit Nation''. Step 2: Healthy children make a healthy nation.'
    mistakes:
      pencil: c4e7_fact
      cloud: c4e7_fact
  - prompt: Which plan is best for staying fit?
    options:
    - "play, eat fresh food and sleep on time"
    - "watch TV all evening and skip playing"
    - "eat sweets instead of proper meals"
    answer: play, eat fresh food and sleep on time
    difficulty: 2
    hints:
    - Fitness needs movement, food and rest.
    - Which plan has all three?
    solution: 'Step 1: Fitness needs exercise, good food and sleep. Step 2: Only the first plan has all three.'
    mistakes:
      "watch TV all evening and skip playing": c4e7_fit
      "eat sweets instead of proper meals": c4e7_fit
  - prompt: 'National Sports Day is celebrated on:'
    options:
    - 29 August
    - 21 June
    - 15 August
    answer: 29 August
    difficulty: 3
    hints:
    - It is Major Dhyan Chand's birthday.
    - 21 June is Yoga Day; 15 August is Independence Day.
    solution: 'Step 1: 21 June and 15 August are other days. Step 2: Sports Day is 29 August.'
    mistakes:
      21 June: c4e7_fact
      15 August: c4e7_fact
  - prompt: 'Case: Arjun spends every evening sitting with a phone and eats chips for dinner. Arjun often feels tired and cannot focus in class. Which plan would help most?'
    options:
    - "Play outdoors for an hour, eat home food and sleep on time"
    - "Use the phone for even longer every evening before bed"
    - "Eat more chips for dinner to get more energy for the day"
    answer: Play outdoors for an hour, eat home food and sleep on time
    hints:
    - What keeps the body fit?
    - Which choice moves the body, feeds it well and rests it?
    solution: Exercise, good food and enough sleep keep the body and mind fit, so Arjun would feel fresh and focus better.
    mistakes:
      "Use the phone for even longer every evening before bed": c4e7_fit
      "Eat more chips for dinner to get more energy for the day": c4e7_fit
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing about your friend''s habit. Which sentence is correct?'
    options:
    - My friend runs in the park every morning.
    - My friend run in the park every morning.
    - My friend running in the park every morning.
    answer: My friend runs in the park every morning.
    hints:
    - Is 'my friend' one person or many?
    - What ending does the verb need for one person doing something every day?
    solution: '''My friend'' is one person, and it is a daily habit, so the verb is ''runs''.'
    mistakes:
      My friend run in the park every morning.: c4e7_gram
      My friend running in the park every morning.: c4e7_gram
    exam: competency
    difficulty: 2
