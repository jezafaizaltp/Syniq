concepts:
- code: cbse4e.u2.braille
  title: 'Braille (Unit 2: My Beautiful World)'
  notes: |
    About Louis Braille (born 1809, France), who lost his sight as a young boy after an accident in his father's workshop.
    At a school for blind children he found reading very hard, so as a teenager (about 15) he invented a system of raised
    dots that people read by touch. Each letter is a pattern in a cell of six dots. Braille is used worldwide, including
    in India (Bharati Braille for Indian languages). World Braille Day is 4 January, his birthday.
  explanations:
    text: 'Louis Braille lost his sight as a small boy. Reading was very hard for blind children then, so when he was about 15 he invented a way of reading with fingers: raised dots on paper. Each letter is a pattern of up to six dots. People everywhere still use Braille.'
    visual: 'Draw a Braille cell: two columns of three dots. Fill in one dot for the letter A and two dots side by side for C.'
    step_by_step: 1. Who was Louis Braille? 2. Why did he need a new way to read? 3. What did he invent? 4. How is it read? By touch.
    real_world: Lift buttons, medicine packs and Indian currency notes have raised marks so people who are blind can read them by touch.
  picture:
    kind: flow
    steps:
    - Louis loses his sight as a boy
    - Reading is very hard
    - At about 15 he invents raised dots
    - Braille is used all over the world
    alt: Louis Braille lost his sight as a boy, found reading very hard, invented raised dots at about 15, and Braille is now used all over the world.
  activity:
    type: order
    prompt: 'Braille: put Louis Braille''s story in order.'
    steps:
    - Born in France, 1809
    - Loses his sight after an accident
    - Finds reading hard at a school for the blind
    - Invents raised-dot letters
    - Braille used worldwide
    reasons:
      Loses his sight after an accident: As a young boy, in his father's workshop.
      Finds reading hard at a school for the blind: He goes to a special school.
      Invents raised-dot letters: At about 15, he finds a better way.
      Braille used worldwide: His system spreads.
  lesson:
    - teach: Louis Braille was born in France in 1809. As a small boy he hurt his eye with a tool in his father's workshop and later lost his sight in both eyes.
      check:
        prompt: Where was Louis Braille born?
        options:
        - France
        - India
        - Japan
        answer: France
        why: He was born in a small town in France in 1809.
      ways:
      - style: visual
        teach: Key facts about the early life of Louis Braille.
        picture:
          kind: compare
          columns:
          - title: Question
            points:
            - Where was he born?
            - When?
            - What happened?
          - title: Answer
            points:
            - France
            - '1809'
            - Hurt his eye in his father's workshop and later lost his sight
          alt: Louis Braille was born in France in 1809. As a small boy he hurt his eye in his father's workshop and later lost his sight.
      - style: real_world
        teach: Many inventions began with a problem in someone's own life. Louis Braille needed a way to read for himself, and his answer now helps millions of people.
    - teach: At a school for blind children, books had huge raised letters that were slow and hard to read. When he was about 15, Louis invented a system of raised dots that fingers can read quickly.
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: left
        - size: 1
          label: right
        rows:
        - size: 1
          label: top
        - size: 1
          label: middle
        - size: 1
          label: bottom
        cells:
        - - dot 1
          - dot 4
        - - dot 2
          - dot 5
        - - dot 3
          - dot 6
        alt: 'A Braille cell: two columns of three dot places, numbered 1 to 6.'
      check:
        prompt: How do people read Braille?
        options:
        - by touching raised dots
        - by listening to bells
        - by looking at colours
        answer: by touching raised dots
        why: Fingertips feel the dot patterns.
      ways:
      - style: step_by_step
        teach: 'Feel why raised dots are faster than raised letters. Step 1: Close your eyes. Step 2: A friend presses a big letter shape made of string onto your palm: it is hard to tell. Step 3: Now the friend makes two small dots with a pencil tip. Step 4: Dots are much easier and quicker to feel.'
      - style: real_world
        teach: Blind readers using Braille can read with their fingertips almost as fast as some sighted people read with their eyes, because their fingers learn the dot patterns well.
    - teach: Each Braille letter is a pattern of dots in a cell of six places. Braille is used all over the world; in India, Bharati Braille is used for Indian languages. World Braille Day, 4 January, is his birthday.
      check:
        prompt: How many dot places are in one Braille cell?
        options:
        - six
        - four
        - ten
        answer: six
        why: Two columns of three.
      ways:
      - style: visual
        teach: Facts about the Braille cell and how Braille is used today.
        picture:
          kind: compare
          columns:
          - title: The Braille cell
            points:
            - Six places for dots
            - Each letter is a pattern of dots
          - title: Braille today
            points:
            - Used all over the world
            - Bharati Braille in India
            - World Braille Day on 4 January
          alt: A Braille cell has six places for dots, and each letter is a pattern of dots. Braille is used all over the world, Bharati Braille is used for Indian languages, and World Braille Day is on 4 January.
      - style: step_by_step
        teach: 'Make a Braille cell. Step 1: Draw two columns of three circles on card: that is six places. Step 2: Pick a pattern, such as the top-left circle only. Step 3: Push a pencil through those circles from the back. Step 4: Close your eyes and feel the bump.'
  items:
  - prompt: Who invented Braille?
    options:
    - Louis Braille
    - Thomas Edison
    - Rabindranath Tagore
    - Isaac Newton
    answer: Louis Braille
    difficulty: 1
    hints:
    - The system has his name.
    - French boy.
    solution: Louis Braille invented it.
    mistakes:
      Thomas Edison: eng4_read_again
  - prompt: How is Braille read?
    options:
    - by touching raised dots
    - by listening to music
    - by smelling
    - by looking at colours
    answer: by touching raised dots
    difficulty: 1
    hints:
    - Fingers.
    - Raised.
    solution: Braille is read by touch.
    mistakes: {"by listening to music": "e2_braille"}
  - prompt: How many dots are in one Braille cell?
    options:
    - six
    - two
    - ten
    - twenty
    answer: six
    difficulty: 2
    hints:
    - Two columns of three.
    - 2 × 3.
    solution: A Braille cell has six dots.
    mistakes: {"ten": "e4_braille_cell"}
  - prompt: About how old was Louis Braille when he invented his system?
    options:
    - about 15
    - about 50
    - about 3
    - about 80
    answer: about 15
    difficulty: 2
    hints:
    - A teenager.
    - Still at school.
    solution: He was about 15.
    mistakes: {"about 50": "e4_braille_age"}
  - prompt: 'World Braille Day is on:'
    options:
    - 4 January
    - 15 August
    - 1 May
    - 25 December
    answer: 4 January
    difficulty: 2
    hints:
    - His birthday.
    - Start of the year.
    solution: World Braille Day is 4 January.
    mistakes: {"15 August": "e4_braille_day"}
  - prompt: What does 'invent' mean?
    options:
    - "make something new for the first time"
    - "lose something and not find it"
    - "copy something someone else made"
    - "break something into many pieces"
    answer: make something new for the first time
    difficulty: 1
    hints:
    - Inventors.
    - New idea.
    solution: To invent is to create something new.
    mistakes:
      "copy something someone else made": eng4_word
  - prompt: Why were the old raised-letter books hard for blind students?
    options:
    - "the letters were big, slow to feel and books were heavy"
    - "the books had far too many coloured pictures in them"
    - "the pages were printed in many bright colours"
    answer: the letters were big, slow to feel and books were heavy
    difficulty: 3
    hints:
    - Raised letters had to be traced one by one.
    - Think of size and speed.
    solution: 'Step 1: Each big letter took time to trace. Step 2: Books were heavy and reading was slow.'
    mistakes:
      "the books had far too many coloured pictures in them": c4e6_fact
      "the pages were printed in many bright colours": c4e6_fact
  - prompt: In which year was Louis Braille born?
    answer: '1809'
    check: '1809'
    difficulty: 2
    hints:
    - It was in the early 1800s.
    - Remember the year from the lesson.
    solution: 'Step 1: Louis Braille was born in France. Step 2: The year was 1809.'
    mistakes:
      '1909': c4e6_fact
      '1890': c4e6_fact
  - prompt: Which sense do Braille readers use?
    options:
    - touch
    - smell
    - taste
    answer: touch
    difficulty: 1
    hints:
    - They run their fingers along the dots.
    - Which sense uses fingers?
    solution: 'Step 1: Fingers feel the dots. Step 2: That is the sense of touch.'
    mistakes:
      smell: c4e6_touch
      taste: c4e6_touch
  - prompt: 'Louis Braille''s dots were an invention. An invention is:'
    options:
    - "something new that someone creates"
    - "something that has been lost"
    - "a copy of a very old thing"
    answer: something new that someone creates
    difficulty: 1
    hints:
    - Louis Braille did this with his dot system.
    - Was it there before him?
    solution: 'Step 1: Nobody had made his system before. Step 2: An invention is something new that someone creates.'
    mistakes:
      "something that has been lost": c4e6_word
      "a copy of a very old thing": c4e6_word
  - prompt: Where can you find Braille in daily life?
    options:
    - "on lift buttons and some medicine boxes"
    - "in the shapes of clouds in the sky"
    - "inside an egg when you crack it open"
    answer: on lift buttons and some medicine boxes
    difficulty: 2
    hints:
    - Look closely at buttons in a lift.
    - Small raised dots help blind people.
    solution: 'Step 1: Braille helps blind people in public places. Step 2: Lift buttons and medicine boxes often have it.'
    mistakes:
      "in the shapes of clouds in the sky": c4e6_touch
      "inside an egg when you crack it open": c4e6_touch
  - prompt: 'Louis Braille lost his sight after an accident in his father''s:'
    options:
    - workshop
    - garden
    - school
    answer: workshop
    difficulty: 1
    hints:
    - His father worked with leather and sharp tools.
    - Where were the tools kept?
    solution: 'Step 1: He played with a sharp tool. Step 2: It happened in his father''s workshop.'
    mistakes:
      garden: c4e6_fact
      school: c4e6_fact
  - prompt: What does Louis Braille's story teach us?
    options:
    - "a difficulty can lead to a great idea that helps millions"
    - "it is better never to go to school if learning is hard"
    - "tools are only toys and should not be used for work"
    answer: a difficulty can lead to a great idea that helps millions
    difficulty: 2
    hints:
    - He faced a hard problem.
    - What did he do about it, and who did it help?
    solution: 'Step 1: He could not read easily. Step 2: He invented Braille, which helps millions of people.'
    mistakes:
      "it is better never to go to school if learning is hard": c4e6_fact
      "tools are only toys and should not be used for work": c4e6_fact
  - prompt: Choose the correct sentence.
    options:
    - Louis invented Braille when he was young.
    - Louis invent Braille when he was young.
    - Louis inventing Braille when he was young.
    answer: Louis invented Braille when he was young.
    difficulty: 2
    hints:
    - It happened in the past.
    - Past tense verbs often end in '-ed'.
    solution: 'Step 1: The action is in the past. Step 2: Use ''invented''.'
    mistakes:
      Louis invent Braille when he was young.: c4e6_word
      Louis inventing Braille when he was young.: c4e6_word
  - prompt: 'A person who cannot see can also ''read'' a book by:'
    options:
    - "listening to an audiobook"
    - "smelling each of the pages"
    - "shaking the book up and down"
    answer: listening to an audiobook
    difficulty: 2
    hints:
    - Besides touch, which sense helps?
    - Someone reads it aloud as a recording.
    solution: 'Step 1: Ears can take in a story. Step 2: Audiobooks let people listen to books.'
    mistakes:
      "smelling each of the pages": c4e6_touch
      "shaking the book up and down": c4e6_touch
  - prompt: 'Case: A new student who is blind joins your school. The library has only printed books. What would help this student read the same stories as everyone else?'
    options:
    - Get Braille books and audiobooks for the library
    - Give the student books with bigger print only
    - Ask the student to look at the pictures
    answer: Get Braille books and audiobooks for the library
    hints:
    - Which senses can the student use to read?
    - What did Louis Braille invent?
    solution: Braille books let the student read by touch, and audiobooks let them read by listening.
    mistakes:
      Give the student books with bigger print only: c4e6_touch
      Ask the student to look at the pictures: c4e6_touch
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are making a poster for Louis Braille''s birthday. Which date should go on the poster?'
    options:
    - 4 January
    - 14 November
    - 15 August
    answer: 4 January
    hints:
    - World Braille Day is held on his birthday.
    - Which date is World Braille Day?
    solution: Louis Braille's birthday, 4 January, is World Braille Day.
    mistakes:
      14 November: c4e6_fact
      15 August: c4e6_fact
    exam: competency
    difficulty: 2
