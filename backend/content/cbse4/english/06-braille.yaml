subject: cbse4-eng
chapter: 6
title: 'Braille (Unit 2: My Beautiful World)'
tips:
  e4_braille_age: "Louis Braille made his system while he was still a student."
  e4_braille_cell: "A Braille cell is like a domino with two columns of three."
  e4_braille_day: "15 August is Independence Day. Braille Day is Louis Braille's birthday, early in the year."
