subject: cbse4-eng
chapter: 6
title: 'Braille (Unit 2: My Beautiful World)'
concepts:
- code: cbse4e.u2.braille
  title: 'Braille (Unit 2: My Beautiful World)'
  notes: |
    About Louis Braille (born 1809, France), who lost his sight as a young boy after an accident in his father's workshop.
    At a school for blind children he found reading very hard, so as a teenager (about 15) he invented a system of raised
    dots that people read by touch. Each letter is a pattern in a cell of six dots. Braille is used worldwide, including
    in India (Bharati Braille for Indian languages). World Braille Day is 4 January, his birthday.
  explanations:
    text: 'Louis Braille lost his sight as a small boy. Reading was very hard for blind children then, so when he was about 15 he invented a way of reading with fingers: raised dots on paper. Each letter is a pattern of up to six dots. People everywhere still use Braille.'
    visual: 'Draw a Braille cell: two columns of three dots. Fill in one dot for the letter A and two dots side by side for C.'
    step_by_step: 1. Who was Louis Braille? 2. Why did he need a new way to read? 3. What did he invent? 4. How is it read? By touch.
    real_world: Lift buttons, medicine packs and Indian currency notes have raised marks so people who are blind can read them by touch.
  picture:
    kind: flow
    steps:
    - Louis loses his sight as a boy
    - Reading is very hard
    - At about 15 he invents raised dots
    - Braille is used all over the world
    alt: Louis Braille lost his sight as a boy, found reading very hard, invented raised dots at about 15, and Braille is now used all over the world.
  activity:
    type: order
    prompt: 'Braille: put Louis Braille''s story in order.'
    steps:
    - Born in France, 1809
    - Loses his sight after an accident
    - Finds reading hard at a school for the blind
    - Invents raised-dot letters
    - Braille used worldwide
    reasons:
      Loses his sight after an accident: As a young boy, in his father's workshop.
      Finds reading hard at a school for the blind: He goes to a special school.
      Invents raised-dot letters: At about 15, he finds a better way.
      Braille used worldwide: His system spreads.
  items:
  - prompt: Who invented Braille?
    options:
    - Louis Braille
    - Thomas Edison
    - Rabindranath Tagore
    - Isaac Newton
    answer: Louis Braille
    difficulty: 1
    hints:
    - The system has his name.
    - French boy.
    solution: Louis Braille invented it.
    mistakes:
      Thomas Edison: eng4_read_again
  - prompt: How is Braille read?
    options:
    - by touching raised dots
    - by listening to music
    - by smelling
    - by looking at colours
    answer: by touching raised dots
    difficulty: 1
    hints:
    - Fingers.
    - Raised.
    solution: Braille is read by touch.
  - prompt: How many dots are in one Braille cell?
    options:
    - six
    - two
    - ten
    - twenty
    answer: six
    difficulty: 2
    hints:
    - Two columns of three.
    - 2 × 3.
    solution: A Braille cell has six dots.
  - prompt: About how old was Louis Braille when he invented his system?
    options:
    - about 15
    - about 50
    - about 3
    - about 80
    answer: about 15
    difficulty: 2
    hints:
    - A teenager.
    - Still at school.
    solution: He was about 15.
  - prompt: 'World Braille Day is on:'
    options:
    - 4 January
    - 15 August
    - 1 May
    - 25 December
    answer: 4 January
    difficulty: 2
    hints:
    - His birthday.
    - Start of the year.
    solution: World Braille Day is 4 January.
  - prompt: What does 'invent' mean?
    options:
    - make something new for the first time
    - lose something
    - copy something
    - break something
    answer: make something new for the first time
    difficulty: 1
    hints:
    - Inventors.
    - New idea.
    solution: To invent is to create something new.
    mistakes:
      copy something: eng4_word
