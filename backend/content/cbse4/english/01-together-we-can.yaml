# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 1. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 1
title: 'Together We Can (Unit 1: My Land)'
tips:
  eng4_read_again: Go back to the lesson and find the part about this. The answer is there.
  eng4_word: Say the word in your own sentence. Does the meaning fit?
  eng4_grammar: Read the sentence aloud with each choice. Which one sounds right?
  e4_opposite_together: "'Joined' means the same as together. The opposite means separate."
  e4_team: "Players on the same side in a game form a ..."
  e4_teamwork: "Teamwork needs more than one person working together."
concepts:
- code: cbse4e.u1.together
  title: 'Together We Can (Unit 1: My Land)'
  notes: |
    The first lesson of the unit 'My Land', about working together. Its message: when people join hands, they can do
    what one person cannot. Exact story details are not reproduced here; questions focus on teamwork, the message,
    and words like together, help, team, share.
  explanations:
    text: This lesson is about teamwork. One person alone may find a job too hard, but when everyone helps, the job becomes easy. Together we can do great things.
    visual: Draw many children pulling one long rope together to lift a heavy box.
    step_by_step: 1. What is the problem? 2. Can one person solve it alone? 3. What happens when everyone helps? 4. What is the message?
    real_world: Cleaning the classroom together, or villagers building a bridge together, shows teamwork.
  picture:
    kind: flow
    steps:
    - A big job
    - One person can't do it alone
    - Everyone joins in
    - The job gets done
    alt: A big job is too hard for one person, so everyone joins in and the job gets done.
  activity:
    type: sort
    prompt: 'Together We Can: words about teamwork or not?'
    bins:
    - Teamwork
    - Not teamwork
    items:
    - label: Share
      bin: Teamwork
      clue: Giving part to others.
      why: Sharing helps a team.
    - label: Help
      bin: Teamwork
      clue: Lending a hand.
      why: Helping is teamwork.
    - label: Keep it all for myself
      bin: Not teamwork
      clue: Alone.
      why: Keeping everything is the opposite of teamwork.
    - label: Join hands
      bin: Teamwork
      clue: The lesson's idea.
      why: Joining hands is working together.
    - label: Work only alone
      bin: Not teamwork
      clue: One person.
      why: Alone isn't together.
  items:
  - prompt: What does 'together' mean?
    options:
    - with each other
    - alone
    - far away
    - never
    answer: with each other
    difficulty: 1
    hints:
    - Not alone.
    - As a group.
    solution: Together means with each other.
    mistakes:
      alone: eng4_word
  - prompt: What is the main message of 'Together We Can'?
    options:
    - working together helps us do hard things
    - always work alone
    - never help others
    - only the strongest wins
    answer: working together helps us do hard things
    difficulty: 1
    hints:
    - Look at the title.
    - We can ... together.
    solution: Teamwork helps us do hard things.
    mistakes:
      always work alone: eng4_read_again
  - prompt: Which is an example of teamwork?
    options:
    - friends cleaning the classroom together
    - one child doing everything
    - fighting over a ball
    - hiding the broom
    answer: friends cleaning the classroom together
    difficulty: 1
    hints:
    - Many people, one job.
    - Helping.
    solution: Cleaning together is teamwork.
    mistakes: {"one child doing everything": "e4_teamwork"}
  - prompt: 'Choose the word that is the opposite of ''together'':'
    options:
    - apart
    - close
    - joined
    - united
    answer: apart
    difficulty: 2
    hints:
    - Separate.
    - Not together.
    solution: Apart is the opposite of together.
    mistakes: {"joined": "e4_opposite_together"}
  - prompt: 'A group of people working for the same goal is a:'
    options:
    - team
    - tree
    - toy
    - tune
    answer: team
    difficulty: 1
    hints:
    - Like in cricket.
    - Players.
    solution: That is a team.
    mistakes: {"tree": "e4_team"}
  - prompt: 'Choose the correct sentence:'
    options:
    - We work together.
    - We works together.
    - We working together.
    - We is work together.
    answer: We work together.
    difficulty: 2
    hints:
    - '''We'' takes ''work'', not ''works''.'
    - Read aloud.
    solution: '''We work together'' is correct.'
    mistakes:
      We works together.: eng4_grammar
