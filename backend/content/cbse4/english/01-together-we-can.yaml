# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 1. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 1
title: 'Together We Can (Unit 1: My Land)'
tips:
  eng4_read_again: Go back to the lesson and find the part about this. The answer is there.
  eng4_word: Say the word in your own sentence. Does the meaning fit?
  eng4_grammar: Read the sentence aloud with each choice. Which one sounds right?
  e4_opposite_together: "'Joined' means the same as together. The opposite means separate."
  e4_team: "Players on the same side in a game form a ..."
  e4_teamwork: "Teamwork needs more than one person working together."
  c4e1_team: Picture a big job, like moving a heavy table. Is it easier alone or with friends?
  c4e1_word: Put each choice into the sentence and read it aloud. Which keeps the meaning?
  c4e1_gram: Look at who is doing the action. One person or many? That decides the verb.
concepts:
- code: cbse4e.u1.together
  title: 'Together We Can (Unit 1: My Land)'
  notes: |
    The first lesson of the unit 'My Land', about working together. Its message: when people join hands, they can do
    what one person cannot. Exact story details are not reproduced here; questions focus on teamwork, the message,
    and words like together, help, team, share.
  explanations:
    text: This lesson is about teamwork. One person alone may find a job too hard, but when everyone helps, the job becomes easy. Together we can do great things.
    visual: Draw many children pulling one long rope together to lift a heavy box.
    step_by_step: 1. What is the problem? 2. Can one person solve it alone? 3. What happens when everyone helps? 4. What is the message?
    real_world: Cleaning the classroom together, or villagers building a bridge together, shows teamwork.
  picture:
    kind: flow
    steps:
    - A big job
    - One person can't do it alone
    - Everyone joins in
    - The job gets done
    alt: A big job is too hard for one person, so everyone joins in and the job gets done.
  activity:
    type: sort
    prompt: 'Together We Can: words about teamwork or not?'
    bins:
    - Teamwork
    - Not teamwork
    items:
    - label: Share
      bin: Teamwork
      clue: Giving part to others.
      why: Sharing helps a team.
    - label: Help
      bin: Teamwork
      clue: Lending a hand.
      why: Helping is teamwork.
    - label: Keep it all for myself
      bin: Not teamwork
      clue: Alone.
      why: Keeping everything is the opposite of teamwork.
    - label: Join hands
      bin: Teamwork
      clue: The lesson's idea.
      why: Joining hands is working together.
    - label: Work only alone
      bin: Not teamwork
      clue: One person.
      why: Alone isn't together.
  lesson:
    - teach: '''Together We Can'' is about teamwork. One person alone may not lift a heavy log, but many hands together can. Working together means helping each other for the same goal.'
      check:
        prompt: What is teamwork?
        options:
        - people working together for one goal
        - one person doing everything
        - people arguing
        answer: people working together for one goal
        why: A team shares the work and the goal.
    - teach: In a team, each person does a part. Some carry, some hold, some guide. When everyone does their part and listens to others, the job gets done.
      picture:
        kind: flow
        steps:
        - a big job
        - share the work
        - each does a part
        - job done together
        alt: 'Teamwork: share a big job, each does a part, the job is done.'
      check:
        prompt: 'In a team, every member should:'
        options:
        - do their part and listen
        - watch while others work
        - do only what they like
        answer: do their part and listen
        why: A team works when everyone helps.
    - teach: 'Useful words: together (with each other), apart (away from each other), share (give a part to others), help (make work easier for someone). ''We'' is used for a group: We work together.'
      check:
        prompt: Which word means 'give a part to others'?
        options:
        - share
        - hide
        - grab
        answer: share
        why: When we share, others get some too.
  items:
  - prompt: What does 'together' mean?
    options:
    - with each other
    - alone
    - far away
    - never
    answer: with each other
    difficulty: 1
    hints:
    - Not alone.
    - As a group.
    solution: Together means with each other.
    mistakes:
      alone: eng4_word
  - prompt: What is the main message of 'Together We Can'?
    options:
    - working together helps us do hard things
    - always work alone
    - never help others
    - only the strongest wins
    answer: working together helps us do hard things
    difficulty: 1
    hints:
    - Look at the title.
    - We can ... together.
    solution: Teamwork helps us do hard things.
    mistakes:
      always work alone: eng4_read_again
  - prompt: Which is an example of teamwork?
    options:
    - friends cleaning the classroom together
    - one child doing everything
    - fighting over a ball
    - hiding the broom
    answer: friends cleaning the classroom together
    difficulty: 1
    hints:
    - Many people, one job.
    - Helping.
    solution: Cleaning together is teamwork.
    mistakes: {"one child doing everything": "e4_teamwork"}
  - prompt: 'Choose the word that is the opposite of ''together'':'
    options:
    - apart
    - close
    - joined
    - united
    answer: apart
    difficulty: 2
    hints:
    - Separate.
    - Not together.
    solution: Apart is the opposite of together.
    mistakes: {"joined": "e4_opposite_together"}
  - prompt: 'A group of people working for the same goal is a:'
    options:
    - team
    - tree
    - toy
    - tune
    answer: team
    difficulty: 1
    hints:
    - Like in cricket.
    - Players.
    solution: That is a team.
    mistakes: {"tree": "e4_team"}
  - prompt: 'Choose the correct sentence:'
    options:
    - We work together.
    - We works together.
    - We working together.
    - We is work together.
    answer: We work together.
    difficulty: 2
    hints:
    - '''We'' takes ''work'', not ''works''.'
    - Read aloud.
    solution: '''We work together'' is correct.'
    mistakes:
      We works together.: eng4_grammar
  - prompt: 'Ten children clean the school garden in an hour. One child alone would take:'
    options:
    - much longer
    - much less time
    - the same time
    answer: much longer
    difficulty: 2
    hints:
    - Ten children share the work.
    - What happens when only one does it all?
    solution: 'Step 1: Ten children split the work. Step 2: One child alone would take much longer.'
    mistakes:
      much less time: c4e1_team
      the same time: c4e1_team
  - prompt: Which saying matches the lesson?
    options:
    - Many hands make light work.
    - Do it all alone.
    - Never ask for help.
    answer: Many hands make light work.
    difficulty: 2
    hints:
    - The lesson is about joining hands.
    - Which saying is about many people?
    solution: 'Step 1: The lesson says working together helps. Step 2: ''Many hands make light work'' says the same.'
    mistakes:
      Do it all alone.: c4e1_team
      Never ask for help.: c4e1_team
  - prompt: Choose the correct sentence.
    options:
    - They help each other.
    - They helps each other.
    - They helping each other.
    answer: They help each other.
    difficulty: 2
    hints:
    - '''They'' is more than one person.'
    - With 'they', the verb has no 's'.
    solution: 'Step 1: ''They'' is plural. Step 2: Use ''help'', not ''helps'': They help each other.'
    mistakes:
      They helps each other.: c4e1_gram
      They helping each other.: c4e1_gram
  - prompt: What does 'join hands' mean in the lesson?
    options:
    - work together
    - shake hands only
    - clap loudly
    answer: work together
    difficulty: 1
    hints:
    - It is about more than hands.
    - What do people do when they join hands for a task?
    solution: 'Step 1: ''Join hands'' is a way of speaking. Step 2: It means to work together.'
    mistakes:
      shake hands only: c4e1_word
      clap loudly: c4e1_word
  - prompt: Which is NOT teamwork?
    options:
    - one child grabbing all the crayons
    - friends building a sandcastle together
    - a class planting trees
    answer: one child grabbing all the crayons
    difficulty: 1
    hints:
    - Teamwork means sharing.
    - Which one does not share?
    solution: 'Step 1: Building and planting together are teamwork. Step 2: Grabbing everything is not.'
    mistakes:
      friends building a sandcastle together: c4e1_team
      a class planting trees: c4e1_team
  - prompt: 'Fill in: Let us work ___ to finish the poster.'
    options:
    - together
    - alone
    - apart
    answer: together
    difficulty: 1
    hints:
    - '''Let us'' means a group.'
    - Which word means with each other?
    solution: 'Step 1: ''Let us'' is about a group. Step 2: The group works together.'
    mistakes:
      alone: c4e1_word
      apart: c4e1_word
  - prompt: A team member is tired. What is a good team thing to do?
    options:
    - help them and share their part
    - laugh at them
    - stop the work forever
    answer: help them and share their part
    difficulty: 2
    hints:
    - A team looks after its members.
    - How can the others help?
    solution: 'Step 1: Teams care for each other. Step 2: Others help and share the tired member''s part.'
    mistakes:
      laugh at them: c4e1_team
      stop the work forever: c4e1_team
  - prompt: Which word is a naming word (noun)?
    options:
    - team
    - together
    - quickly
    answer: team
    difficulty: 3
    hints:
    - A naming word names a person, place, thing or group.
    - Can you say 'a ___'?
    solution: 'Step 1: ''a team'' makes sense; ''a together'' does not. Step 2: ''team'' is a noun.'
    mistakes:
      together: c4e1_gram
      quickly: c4e1_gram
  - prompt: What makes a team strong?
    options:
    - listening, sharing and helping
    - shouting and blaming
    - everyone working alone
    answer: listening, sharing and helping
    difficulty: 2
    hints:
    - Think of a good team you know.
    - What do its members do?
    solution: 'Step 1: Shouting and blaming break a team. Step 2: Listening, sharing and helping make it strong.'
    mistakes:
      shouting and blaming: c4e1_team
      everyone working alone: c4e1_team
