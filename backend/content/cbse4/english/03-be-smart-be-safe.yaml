# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 3. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 3
title: 'Be Smart, Be Safe (Unit 1: My Land)'
concepts:
- code: cbse4e.u1.safe
  title: 'Be Smart, Be Safe (Unit 1: My Land)'
  notes: |
    A lesson about staying safe: road safety (cross at a zebra crossing, look right, left, right again, obey traffic
    lights), safety with strangers (don't go with or take things from strangers; tell a trusted adult), safety at home
    (electricity, fire, sharp things). Emergency number 112. Exact text is not reproduced here.
  explanations:
    text: Being smart means staying safe. Cross roads at the zebra crossing when the light is green for walkers. Never go anywhere with a stranger. At home, keep away from sockets, fire and sharp things.
    visual: 'Draw a zebra crossing with a traffic light: red man (stop) and green man (walk), and a child holding an adult''s hand.'
    step_by_step: 1. Stop at the edge of the road. 2. Look right, left and right again. 3. Cross at the zebra crossing when it is safe. 4. Walk, don't run.
    real_world: Traffic police and school road-safety weeks teach children these rules.
  picture:
    kind: compare
    columns:
    - title: Traffic light
      points:
      - Red
      - Yellow
      - Green
    - title: Means
      points:
      - stop
      - get ready
      - go
    alt: On a traffic light, red means stop, yellow means get ready, and green means go.
  activity:
    type: order
    prompt: 'Be Smart, Be Safe: crossing the road.'
    steps:
    - Go to the zebra crossing
    - Wait for the green signal for walkers
    - Look right, left, right again
    - Cross straight, without running
    reasons:
      Wait for the green signal for walkers: Stop before stepping out.
      Look right, left, right again: Even with the signal, check the road.
      Cross straight, without running: Now it's safe to cross.
  items:
  - prompt: Where should you cross the road?
    options:
    - at the zebra crossing
    - anywhere you like
    - between parked cars
    - on a bend
    answer: at the zebra crossing
    difficulty: 1
    hints:
    - Black and white stripes.
    - Safe place.
    solution: Cross at a zebra crossing.
    mistakes: {"between parked cars": "e2_zebra"}
  - prompt: 'A red traffic light means:'
    options:
    - stop
    - go
    - run
    - dance
    answer: stop
    difficulty: 1
    hints:
    - Danger colour.
    - Wait.
    solution: Red means stop.
    mistakes: {"go": "e2_red_light"}
  - prompt: 'A stranger offers you sweets and a ride. You should:'
    options:
    - say no and tell a trusted adult
    - go with them
    - take the sweets
    - keep it secret
    answer: say no and tell a trusted adult
    difficulty: 1
    hints:
    - Strangers can be unsafe.
    - Tell.
    solution: Say no and tell a trusted adult.
    mistakes:
      go with them: eng4_read_again
  - prompt: 'Before crossing, you look:'
    options:
    - right, left and right again
    - only up
    - only down
    - nowhere
    answer: right, left and right again
    difficulty: 2
    hints:
    - Traffic comes from both sides.
    - Check twice.
    solution: Look right, left and right again.
    mistakes: {"only up": "e2_look_both"}
  - prompt: What is India's emergency number?
    options:
    - '112'
    - '786'
    - '999'
    - '321'
    answer: '112'
    difficulty: 2
    hints:
    - One-one-two.
    - Police, fire, ambulance.
    solution: 112 is the emergency number.
    mistakes: {"999": "v4_112"}
  - prompt: 'Choose the word that means ''free from danger'':'
    options:
    - safe
    - risky
    - broken
    - loud
    answer: safe
    difficulty: 1
    hints:
    - Title word.
    - Not in danger.
    solution: Safe means free from danger.
    mistakes:
      risky: eng4_word
