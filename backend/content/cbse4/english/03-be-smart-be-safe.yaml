# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 3. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 3
title: 'Be Smart, Be Safe (Unit 1: My Land)'
tips:
  c4e3_road: 'Think of the safe-road rules: where to cross, which way to look, and what each traffic light says.'
  c4e3_stranger: 'Ask: do I know this person well, and would my parents agree? If not, say no, move away and tell.'
  c4e3_word: Put each choice into the sentence and read it aloud. Which keeps the meaning?
concepts:
- code: cbse4e.u1.safe
  title: 'Be Smart, Be Safe (Unit 1: My Land)'
  notes: |
    A lesson about staying safe: road safety (cross at a zebra crossing, look right, left, right again, obey traffic
    lights), safety with strangers (don't go with or take things from strangers; tell a trusted adult), safety at home
    (electricity, fire, sharp things). Emergency number 112. Exact text is not reproduced here.
  explanations:
    text: Being smart means staying safe. Cross roads at the zebra crossing when the light is green for walkers. Never go anywhere with a stranger. At home, keep away from sockets, fire and sharp things.
    visual: 'Draw a zebra crossing with a traffic light: red man (stop) and green man (walk), and a child holding an adult''s hand.'
    step_by_step: 1. Stop at the edge of the road. 2. Look right, left and right again. 3. Cross at the zebra crossing when it is safe. 4. Walk, don't run.
    real_world: Traffic police and school road-safety weeks teach children these rules.
  picture:
    kind: compare
    columns:
    - title: Traffic light
      points:
      - Red
      - Yellow
      - Green
    - title: Means
      points:
      - stop
      - get ready
      - go
    alt: On a traffic light, red means stop, yellow means get ready, and green means go.
  activity:
    type: order
    prompt: 'Be Smart, Be Safe: crossing the road.'
    steps:
    - Go to the zebra crossing
    - Wait for the green signal for walkers
    - Look right, left, right again
    - Cross straight, without running
    reasons:
      Wait for the green signal for walkers: Stop before stepping out.
      Look right, left, right again: Even with the signal, check the road.
      Cross straight, without running: Now it's safe to cross.
  lesson:
    - teach: Be smart on the road. Cross only at a zebra crossing. Stop at the kerb and look right, left and right again. Walk, do not run.
      check:
        prompt: Where is the safest place to cross the road?
        options:
        - at the zebra crossing
        - between parked cars
        - on a bend
        answer: at the zebra crossing
        why: Drivers expect people to cross there.
      ways:
      - style: visual
        teach: Crossing the road safely, one step at a time.
        picture:
          kind: flow
          steps:
          - Go to a zebra crossing
          - Stop at the kerb
          - Look right, left and right again
          - When the road is clear, walk across
          - Keep looking while you cross
          alt: To cross safely, go to a zebra crossing, stop at the kerb, look right, left and right again, walk across when the road is clear, and keep looking while you cross.
      - style: real_world
        teach: Traffic police at busy crossings blow a whistle and hold up a hand to stop cars so that schoolchildren can cross on the zebra lines.
    - teach: 'Traffic lights tell us what to do: red means stop, yellow (amber) means get ready or wait, green means go, after looking both ways.'
      picture:
        kind: flow
        steps:
        - 'red: stop'
        - 'yellow: wait, get ready'
        - 'green: look, then go'
        alt: Traffic light colours and what they mean.
      check:
        prompt: The light turns yellow. What should you do?
        options:
        - wait and get ready
        - run across
        - close your eyes
        answer: wait and get ready
        why: Yellow means the light is about to change.
      ways:
      - style: visual
        teach: What each traffic light colour tells us to do.
        picture:
          kind: compare
          columns:
          - title: Red
            points:
            - Stop
          - title: Yellow (amber)
            points:
            - Get ready or wait
          - title: Green
            points:
            - Go, after looking both ways
          alt: Red means stop. Yellow, or amber, means get ready or wait. Green means go, after looking both ways.
      - style: step_by_step
        teach: 'Practise with a paper traffic light. Step 1: Cut three circles: red, yellow, green. Step 2: A friend holds one up. Step 3: Red: everyone stands still. Yellow: get ready. Green: look both ways, then walk. Step 4: Swap turns.'
    - teach: Be safe with strangers and at home. Never go with or take things from strangers; say no and tell a trusted adult. Keep away from sockets, fire and sharp knives. In an emergency, call 112.
      check:
        prompt: 'Someone you do not know says, ''Your parent sent me to pick you up.'' You should:'
        options:
        - say no and tell your teacher
        - go with them
        - give them your address
        answer: say no and tell your teacher
        why: Check with a trusted adult first.
      ways:
      - style: visual
        teach: Safe and unsafe choices with strangers and at home.
        picture:
          kind: compare
          columns:
          - title: Safe
            points:
            - Say no to a stranger's gift
            - Tell a trusted adult
            - Keep away from sockets and fire
          - title: Unsafe
            points:
            - Go somewhere with a stranger
            - Keep it a secret
            - Play with knives or matches
          alt: It is safe to say no to a stranger's gift, tell a trusted adult and keep away from sockets and fire. It is unsafe to go somewhere with a stranger, keep it a secret, or play with knives or matches.
      - style: real_world
        teach: Many families choose a secret family password. If someone says they have come to pick you up, ask for the password. If they do not know it, do not go with them.
  items:
  - prompt: Where should you cross the road?
    options:
    - at the zebra crossing
    - anywhere you like
    - between parked cars
    - on a bend
    answer: at the zebra crossing
    difficulty: 1
    hints:
    - Black and white stripes.
    - Safe place.
    solution: Cross at a zebra crossing.
    mistakes: {"between parked cars": "e2_zebra"}
  - prompt: 'A red traffic light means:'
    options:
    - stop
    - go
    - run
    - dance
    answer: stop
    difficulty: 1
    hints:
    - Danger colour.
    - Wait.
    solution: Red means stop.
    mistakes: {"go": "e2_red_light"}
  - prompt: 'A stranger offers you sweets and a ride. You should:'
    options:
    - say no and tell a trusted adult
    - go with them
    - take the sweets
    - keep it secret
    answer: say no and tell a trusted adult
    difficulty: 1
    hints:
    - Strangers can be unsafe.
    - Tell.
    solution: Say no and tell a trusted adult.
    mistakes:
      go with them: eng4_read_again
  - prompt: 'Before crossing, you look:'
    options:
    - right, left and right again
    - only up
    - only down
    - nowhere
    answer: right, left and right again
    difficulty: 2
    hints:
    - Traffic comes from both sides.
    - Check twice.
    solution: Look right, left and right again.
    mistakes: {"only up": "e2_look_both"}
  - prompt: What is India's emergency number?
    options:
    - '112'
    - '786'
    - '999'
    - '321'
    answer: '112'
    difficulty: 2
    hints:
    - One-one-two.
    - Police, fire, ambulance.
    solution: 112 is the emergency number.
    mistakes: {"999": "v4_112"}
  - prompt: 'Choose the word that means ''free from danger'':'
    options:
    - safe
    - risky
    - broken
    - loud
    answer: safe
    difficulty: 1
    hints:
    - Title word.
    - Not in danger.
    solution: Safe means free from danger.
    mistakes:
      risky: eng4_word
  - prompt: Before crossing, why do we look right first in India?
    options:
    - traffic on our side comes from the right
    - it is a lucky side
    - the sun is on the right
    answer: traffic on our side comes from the right
    difficulty: 3
    hints:
    - In India, vehicles drive on the left side of the road.
    - Which side do the nearest vehicles come from?
    solution: 'Step 1: Vehicles drive on the left in India. Step 2: The nearest lane''s traffic comes from the right.'
    mistakes:
      it is a lucky side: c4e3_road
      the sun is on the right: c4e3_road
  - prompt: 'A green light for walkers means:'
    options:
    - you may cross after looking both ways
    - you must stop
    - run fast
    answer: you may cross after looking both ways
    difficulty: 1
    hints:
    - Green means go.
    - Still be careful.
    solution: 'Step 1: Green means you may go. Step 2: Still look both ways first.'
    mistakes:
      you must stop: c4e3_road
      run fast: c4e3_road
  - prompt: Where should you walk if there is no footpath?
    options:
    - on the side, facing the oncoming traffic
    - in the middle of the road
    - on the road divider
    answer: on the side, facing the oncoming traffic
    difficulty: 3
    hints:
    - You want to see vehicles coming.
    - Stay at the edge, not the middle.
    solution: 'Step 1: Walk at the edge of the road. Step 2: Face the traffic so you can see it coming.'
    mistakes:
      in the middle of the road: c4e3_road
      on the road divider: c4e3_road
  - prompt: Someone online asks for your home address. What should you do?
    options:
    - not share it and tell a parent
    - share it quickly
    - send a photo of your house
    answer: not share it and tell a parent
    difficulty: 2
    hints:
    - Online strangers are still strangers.
    - Personal details must stay private.
    solution: 'Step 1: Never share personal details online. Step 2: Tell a parent.'
    mistakes:
      share it quickly: c4e3_stranger
      send a photo of your house: c4e3_stranger
  - prompt: Which is safe at home?
    options:
    - keeping away from a hot stove
    - putting a pin in a socket
    - playing with matches
    answer: keeping away from a hot stove
    difficulty: 1
    hints:
    - Fire and electricity are dangerous.
    - Which choice keeps you away from danger?
    solution: 'Step 1: Sockets and matches can hurt you. Step 2: Keeping away from the stove is safe.'
    mistakes:
      putting a pin in a socket: c4e3_stranger
      playing with matches: c4e3_stranger
  - prompt: What does 'danger' mean?
    options:
    - something that can hurt you
    - something tasty
    - a game
    answer: something that can hurt you
    difficulty: 1
    hints:
    - A 'Danger' sign is put near live wires.
    - Why do we keep away?
    solution: 'Step 1: Danger signs warn us. Step 2: Danger is something that can hurt us.'
    mistakes:
      something tasty: c4e3_word
      a game: c4e3_word
  - prompt: You get lost in a market. Whom is it best to ask for help?
    options:
    - a police officer or a shopkeeper at a counter
    - anyone who calls you
    - nobody, keep walking
    answer: a police officer or a shopkeeper at a counter
    difficulty: 2
    hints:
    - Pick a helper you can trust.
    - Who works there and can call your family?
    solution: 'Step 1: Police and shopkeepers at their counters are safe helpers. Step 2: Ask them to call your family.'
    mistakes:
      anyone who calls you: c4e3_stranger
      nobody, keep walking: c4e3_stranger
  - prompt: Choose the correct sentence.
    options:
    - Always wear a seat belt in a car.
    - Always wears a seat belt in a car.
    - Always wearing a seat belt in a car.
    answer: Always wear a seat belt in a car.
    difficulty: 2
    hints:
    - This is an instruction.
    - Instructions start with the plain verb.
    solution: 'Step 1: Instructions use the plain verb. Step 2: ''Always wear a seat belt.'''
    mistakes:
      Always wears a seat belt in a car.: c4e3_word
      Always wearing a seat belt in a car.: c4e3_word
  - prompt: Why should children not play on the road?
    options:
    - vehicles may not see them in time
    - roads are too smooth
    - it is boring
    answer: vehicles may not see them in time
    difficulty: 1
    hints:
    - Cars move fast.
    - Can a driver stop at once?
    solution: 'Step 1: Vehicles need time to stop. Step 2: Children on the road may be hit.'
    mistakes:
      roads are too smooth: c4e3_road
      it is boring: c4e3_road
  - prompt: 'Case: After school, a person you have never seen says, ''Your parent sent me. Come, I''ll take you home.'' Your parent did not tell you about this. What should you do?'
    options:
    - Say no, stay at school and tell a teacher
    - Go with the person because they know your parent
    - Go if they give you a chocolate
    answer: Say no, stay at school and tell a teacher
    hints:
    - Do you know this person well?
    - Would your parents have told you about it?
    solution: Never go with a stranger, even if they say a parent sent them. Stay where you are and tell a trusted adult.
    mistakes:
      Go with the person because they know your parent: c4e3_stranger
      Go if they give you a chocolate: c4e3_stranger
    exam: case
    difficulty: 2
  - prompt: 'Situation: You reach a crossing just as the traffic light turns yellow. What should you do?'
    options:
    - Wait at the kerb and get ready
    - Run across quickly
    - Walk across without looking
    answer: Wait at the kerb and get ready
    hints:
    - What does a yellow light mean?
    - Is it safe to start crossing now?
    solution: Yellow means get ready or wait. Stay at the kerb until it is safe to cross.
    mistakes:
      Run across quickly: c4e3_road
      Walk across without looking: c4e3_road
    exam: competency
    difficulty: 2
