  title: 'Maheshwar (Unit 4: Up High)'
  notes: |
    About Maheshwar, a historic town in Madhya Pradesh on the banks of the river Narmada. It was the capital of the wise
    queen Ahilyabai Holkar (18th century), who built ghats and temples and encouraged weavers. Maheshwar is famous for
    Maheshwari handloom saris, its fort and riverside ghats. Exact text is not reproduced here.
  explanations:
    text: Maheshwar is an old town in Madhya Pradesh on the river Narmada. Queen Ahilyabai Holkar ruled from here; she built steps (ghats) down to the river and temples, and helped weavers. Today Maheshwar is famous for its handwoven Maheshwari saris.
    visual: Draw a fort on a hill above the Narmada river, wide steps (ghats) leading down to the water, and a weaver at a loom.
    step_by_step: 1. Where is Maheshwar? 2. Which river flows past it? 3. Who was Ahilyabai Holkar? 4. What is the town famous for?
    real_world: Handloom towns like Maheshwar in Madhya Pradesh and Balaramapuram in Kerala keep traditional weaving alive.
