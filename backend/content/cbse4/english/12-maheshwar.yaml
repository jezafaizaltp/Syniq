concepts:
- code: cbse4e.u4.maheshwar
  title: 'Maheshwar (Unit 4: Up High)'
  notes: |
    About Maheshwar, a historic town in Madhya Pradesh on the banks of the river Narmada. It was the capital of the wise
    queen Ahilyabai Holkar (18th century), who built ghats and temples and encouraged weavers. Maheshwar is famous for
    Maheshwari handloom saris, its fort and riverside ghats. Exact text is not reproduced here.
  explanations:
    text: Maheshwar is an old town in Madhya Pradesh on the river Narmada. Queen Ahilyabai Holkar ruled from here; she built steps (ghats) down to the river and temples, and helped weavers. Today Maheshwar is famous for its handwoven Maheshwari saris.
    visual: Draw a fort on a hill above the Narmada river, wide steps (ghats) leading down to the water, and a weaver at a loom.
    step_by_step: 1. Where is Maheshwar? 2. Which river flows past it? 3. Who was Ahilyabai Holkar? 4. What is the town famous for?
    real_world: Handloom towns like Maheshwar in Madhya Pradesh and Balaramapuram in Kerala keep traditional weaving alive.
  picture:
    kind: compare
    columns:
    - title: Maheshwar
      points:
      - Madhya Pradesh
      - river Narmada
    - title: Famous for
      points:
      - Maheshwari saris
      - ghats and fort
      - Queen Ahilyabai Holkar
    alt: Maheshwar is in Madhya Pradesh on the river Narmada and is famous for Maheshwari saris, its ghats and fort, and Queen Ahilyabai Holkar.
  activity:
    type: sort
    prompt: 'Maheshwar: what is it famous for?'
    bins:
    - Maheshwar
    - Not Maheshwar
    items:
    - label: The river Narmada
      bin: Maheshwar
      clue: Its river.
      why: Maheshwar is on the Narmada.
    - label: Ahilyabai Holkar's capital
      bin: Maheshwar
      clue: A wise queen.
      why: She ruled from Maheshwar.
    - label: Maheshwari handloom saris
      bin: Maheshwar
      clue: Weaving.
      why: Its saris carry the town's name.
    - label: Snowy mountains
      bin: Not Maheshwar
      clue: It's on a riverbank.
      why: Maheshwar has no snow peaks.
    - label: Riverside ghats
      bin: Maheshwar
      clue: Steps to the water.
      why: Ahilyabai built ghats there.
  lesson:
    - teach: Maheshwar is an old town in Madhya Pradesh, on the banks of the river Narmada. It has a fort and many ghats, steps that lead down to the water.
      check:
        prompt: On which river's bank is Maheshwar?
        options:
        - Narmada
        - Brahmaputra
        - Periyar
        answer: Narmada
        why: Maheshwar sits on the Narmada.
    - teach: In the 1700s, Maheshwar was the capital of Ahilyabai Holkar, a wise queen. She built temples and ghats, cared for her people and invited weavers to settle there.
      picture:
        kind: flow
        steps:
        - queen Ahilyabai rules
        - builds ghats and temples
        - invites weavers
        - Maheshwari saris become famous
        alt: How Maheshwar became known for its saris.
      check:
        prompt: Why did weavers come to Maheshwar?
        options:
        - the queen invited and supported them
        - there was a desert
        - they were lost
        answer: the queen invited and supported them
        why: Ahilyabai encouraged weaving.
    - teach: Maheshwari saris are woven by hand on looms. Handloom work is slow and skilled, and each sari is special. Buying handloom supports the weavers' families.
      check:
        prompt: 'A handloom is used to:'
        options:
        - weave cloth by hand
        - cook food
        - build boats
        answer: weave cloth by hand
        why: Hand + loom = weaving by hand.
  items:
  - prompt: Maheshwar is on the banks of which river?
    options:
    - Narmada
    - Ganga
    - Periyar
    - Brahmaputra
    answer: Narmada
    difficulty: 1
    hints:
    - Central India.
    - Flows west.
    solution: Maheshwar is on the Narmada.
    mistakes:
      Ganga: eng4_read_again
  - prompt: Maheshwar is in which state?
    options:
    - Madhya Pradesh
    - Kerala
    - Assam
    - Punjab
    answer: Madhya Pradesh
    difficulty: 1
    hints:
    - Centre of India.
    - MP.
    solution: It is in Madhya Pradesh.
    mistakes: {"Kerala": "e4_maheshwar_state"}
  - prompt: Which queen ruled from Maheshwar?
    options:
    - Ahilyabai Holkar
    - Rani Lakshmibai
    - Razia Sultan
    - Rani Chennamma
    answer: Ahilyabai Holkar
    difficulty: 2
    hints:
    - She built ghats and temples.
    - Holkar.
    solution: Ahilyabai Holkar ruled from Maheshwar.
    mistakes: {"Rani Lakshmibai": "e4_ahilyabai"}
  - prompt: 'Maheshwar is famous for its:'
    options:
    - handloom saris
    - snow sports
    - deserts
    - coconut coir
    answer: handloom saris
    difficulty: 1
    hints:
    - Weavers.
    - Maheshwari.
    solution: It is famous for Maheshwari saris.
    mistakes: {"coconut coir": "e4_maheshwari"}
  - prompt: '''Ghats'' on a river are:'
    options:
    - steps leading down to the water
    - boats
    - fish
    - bridges in the air
    answer: steps leading down to the water
    difficulty: 2
    hints:
    - People bathe there.
    - Steps.
    solution: Ghats are steps down to the river.
    mistakes:
      boats: eng4_word
  - prompt: 'A person who makes cloth on a loom is a:'
    options:
    - weaver
    - potter
    - baker
    - driver
    answer: weaver
    difficulty: 1
    hints:
    - Weaving.
    - Loom.
    solution: A weaver makes cloth on a loom.
    mistakes: {"potter": "v3_weaver"}
  - prompt: What are 'ghats'?
    options:
    - wide steps going down to a river
    - mountain goats
    - small boats
    answer: wide steps going down to a river
    difficulty: 1
    hints:
    - People sit there by the water.
    - Varanasi also has many of them.
    solution: 'Step 1: Ghats are on river banks. Step 2: They are steps leading down to the water.'
    mistakes:
      mountain goats: c4e12_word
      small boats: c4e12_word
  - prompt: 'Ahilyabai Holkar is remembered as:'
    options:
    - a wise and caring queen
    - a famous cricketer
    - a scientist who went to space
    answer: a wise and caring queen
    difficulty: 1
    hints:
    - She ruled from Maheshwar.
    - She built ghats and helped weavers.
    solution: 'Step 1: She ruled in the 1700s. Step 2: She is remembered as a wise, caring queen.'
    mistakes:
      a famous cricketer: c4e12_place
      a scientist who went to space: c4e12_place
  - prompt: Why are handloom saris costly?
    options:
    - each one takes many days of skilled work
    - they are made by machines in seconds
    - they are made of paper
    answer: each one takes many days of skilled work
    difficulty: 2
    hints:
    - Weavers make every thread pass by hand.
    - How long would that take?
    solution: 'Step 1: Hand weaving is slow. Step 2: Many days of skill make each sari costly.'
    mistakes:
      they are made by machines in seconds: c4e12_craft
      they are made of paper: c4e12_craft
  - prompt: 'Maheshwar is in the state of Madhya Pradesh. ''Madhya'' means:'
    options:
    - middle
    - north
    - sea
    answer: middle
    difficulty: 3
    hints:
    - Look at where the state is on India's map.
    - It is in the centre of India.
    solution: 'Step 1: Madhya Pradesh is in the centre of India. Step 2: ''Madhya'' means middle.'
    mistakes:
      north: c4e12_place
      sea: c4e12_place
  - prompt: Which is a good way to help handloom weavers?
    options:
    - buy and wear handloom clothes
    - throw away old clothes every week
    - never visit their towns
    answer: buy and wear handloom clothes
    difficulty: 2
    hints:
    - Weavers earn by selling cloth.
    - What helps them earn?
    solution: 'Step 1: Weavers live by selling their work. Step 2: Buying handloom helps them.'
    mistakes:
      throw away old clothes every week: c4e12_craft
      never visit their towns: c4e12_craft
  - prompt: Choose the plural of 'temple'.
    options:
    - temples
    - templees
    - temple
    answer: temples
    difficulty: 1
    hints:
    - Most nouns add one letter for many.
    - ghat → ghats.
    solution: 'Step 1: Add ''s''. Step 2: temple → temples.'
    mistakes:
      templees: c4e12_word
      temple: c4e12_word
  - prompt: Which of these is NOT found in Maheshwar?
    options:
    - snowy glaciers
    - a fort
    - riverside ghats
    answer: snowy glaciers
    difficulty: 2
    hints:
    - Maheshwar is in central India by a river.
    - Glaciers are in very high mountains.
    solution: 'Step 1: Maheshwar has a fort and ghats. Step 2: Glaciers are only in high snowy mountains.'
    mistakes:
      a fort: c4e12_place
      riverside ghats: c4e12_place
  - prompt: What does 'historic' mean?
    options:
    - important in the past
    - very new
    - very small
    answer: important in the past
    difficulty: 2
    hints:
    - Think of the word 'history'.
    - Old forts and queens are part of it.
    solution: 'Step 1: History is about the past. Step 2: Historic means important in the past.'
    mistakes:
      very new: c4e12_word
      very small: c4e12_word
  - prompt: 'Fill in: The weaver ___ a beautiful sari on the loom.'
    options:
    - wove
    - swam
    - flew
    answer: wove
    difficulty: 2
    hints:
    - What does a weaver do?
    - The past of 'weave'.
    solution: 'Step 1: A weaver weaves. Step 2: Past tense: wove.'
    mistakes:
      swam: c4e12_craft
      flew: c4e12_craft
