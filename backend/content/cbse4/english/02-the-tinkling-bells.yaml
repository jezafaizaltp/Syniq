# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 2. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 2
title: 'The Tinkling Bells (Unit 1: My Land)'
tips:
  e4_cow_bell: "Cows wander while grazing. How can the farmer find them?"
  e4_cycle_bell: "Tick-tock is a clock. Say the cycle bell's sound out loud."
  e4_ghungroo: "Classical dancers tie ghungroos on their feet."
  e4_sound_word: "Which word sounds like the noise it names?"
  c4e2_sound: Say the word aloud. Does it sound like the noise it names?
  c4e2_where: 'Picture where in India you would hear that bell: temple, farm, road, school or dance stage.'
  c4e2_word: Put each choice into the sentence and read it aloud. Which one fits?

concepts:
- code: cbse4e.u1.bells
  title: 'The Tinkling Bells (Unit 1: My Land)'
  notes: |
    A lesson in the unit 'My Land'. Bells tinkle on temple doors, cows' necks, bicycles, school gates and anklets (ghungroo)
    across India. Exact story details are not reproduced here; questions focus on sound words (tinkle, ring, jingle),
    naming words and the lesson's theme of the sounds of our land.
  explanations:
    text: 'Bells make many sounds: a tinkle, a ring, a jingle. In India you hear bells on cows, bicycles, temple doors, school gates and dancers'' anklets. This lesson is about the sounds that fill our land.'
    visual: Draw a cow with a bell, a bicycle bell, a temple bell and a dancer's ankle bells.
    step_by_step: 1. Read the lesson. 2. Find the sound words. 3. Find where the bells are. 4. Think about the sounds around your home.
    real_world: Classical dancers like Bharatanatyam and Kathak dancers wear ghungroos, small bells on their ankles.
  picture:
    kind: compare
    columns:
    - title: Where
      points:
      - cow's neck
      - bicycle
      - dancer's ankle
    - title: Sound
      points:
      - ding-dong
      - tring-tring
      - tinkle-jingle
    alt: A cow's bell goes ding-dong, a bicycle bell tring-tring, and a dancer's ankle bells tinkle and jingle.
  activity:
    type: sort
    prompt: 'The Tinkling Bells: where is the bell?'
    bins:
    - Temple
    - Cow
    - Bicycle
    - Anklet
    items:
    - label: Rung before prayers
      bin: Temple
      clue: A place of worship.
      why: Temple bells ring at prayer time.
    - label: Tinkles round its neck in the field
      bin: Cow
      clue: An animal.
      why: Cows wear bells round their necks.
    - label: Rings to warn people on the road
      bin: Bicycle
      clue: Has two wheels.
      why: A bicycle bell warns walkers.
    - label: Ghungroo jingling on a dancer's feet
      bin: Anklet
      clue: Worn on feet.
      why: Ghungroo are ankle bells.
  lesson:
    - teach: 'Bells ring all over India: on temple doors, around cows'' necks, on bicycles, at school gates, and on a dancer''s ankles (ghungroo). Each bell has its own sound and job.'
      check:
        prompt: Why does a school ring a bell?
        options:
        - to tell everyone the time to start or stop
        - to scare birds
        - to call cows
        answer: to tell everyone the time to start or stop
        why: The bell marks the start and end of periods.
    - teach: 'Sound words copy the sound they name: tinkle (light, high ringing), ring, jingle (many small bells), ding-dong (a big bell), tring-tring (a bicycle bell).'
      picture:
        kind: compare
        columns:
        - title: Small, light
          points:
          - tinkle
          - jingle
        - title: Big, deep
          points:
          - ding-dong
          - gong
        - title: Bicycle
          points:
          - tring-tring
        alt: Sound words for small bells, big bells and a bicycle bell.
      check:
        prompt: Which sound word fits a big temple bell?
        options:
        - ding-dong
        - tinkle
        - buzz
        answer: ding-dong
        why: Big bells make a deep, slow sound.
    - teach: 'Bells help us: a cow bell tells a farmer where the cow is; a cycle bell warns people on the road; a temple bell starts prayers. The lesson shows the sounds of our land.'
      check:
        prompt: Why does a cyclist ring a bell?
        options:
        - to warn people ahead
        - to sing a song
        - to make the cycle faster
        answer: to warn people ahead
        why: The bell tells people to move aside safely.
  items:
  - prompt: What does 'tinkle' describe?
    options:
    - a light ringing sound
    - a loud bang
    - a smell
    - a colour
    answer: a light ringing sound
    difficulty: 1
    hints:
    - Small bells.
    - Soft sound.
    solution: Tinkle is a light, ringing sound.
    mistakes:
      a loud bang: eng4_word
  - prompt: Which of these has bells on the ankles?
    options:
    - a Kathak dancer
    - a fish
    - a tree
    - a cloud
    answer: a Kathak dancer
    difficulty: 1
    hints:
    - Ghungroo.
    - Dance.
    solution: Kathak dancers wear ankle bells.
    mistakes: {"a fish": "e4_ghungroo"}
  - prompt: Why do farmers tie bells on cows?
    options:
    - to hear where the cows are
    - to make them fly
    - to keep them cold
    - to change their colour
    answer: to hear where the cows are
    difficulty: 2
    hints:
    - Cows wander.
    - Sound tells where.
    solution: The bell's sound shows where the cow is.
    mistakes: {"to make them fly": "e4_cow_bell"}
  - prompt: Which is a sound word?
    options:
    - jingle
    - table
    - green
    - happy
    answer: jingle
    difficulty: 1
    hints:
    - It names a noise.
    - Bells.
    solution: Jingle is a sound word.
    mistakes: {"table": "e4_sound_word"}
  - prompt: 'A bicycle bell goes:'
    options:
    - tring-tring
    - moo-moo
    - quack-quack
    - tick-tock
    answer: tring-tring
    difficulty: 1
    hints:
    - Ring it.
    - Bicycle.
    solution: A bicycle bell goes tring-tring.
    mistakes: {"tick-tock": "e4_cycle_bell"}
  - prompt: 'Choose the plural of ''bell'':'
    options:
    - bells
    - belles
    - bellies
    - bell
    answer: bells
    difficulty: 1
    hints:
    - Add s.
    - More than one.
    solution: One bell, many bells.
    mistakes:
      bellies: eng4_grammar
  - prompt: Which of these makes a 'jingle'?
    options:
    - a bunch of small keys
    - a big drum
    - a lion
    answer: a bunch of small keys
    difficulty: 1
    hints:
    - Jingle is a light, clinking sound.
    - Many small metal things shaking together.
    solution: 'Step 1: Jingle is many small metal sounds. Step 2: Small keys jingle.'
    mistakes:
      a big drum: c4e2_sound
      a lion: c4e2_sound
  - prompt: 'Ghungroos are worn on the:'
    options:
    - ankles
    - head
    - fingers
    answer: ankles
    difficulty: 1
    hints:
    - Dancers wear them.
    - They ring when the feet stamp.
    solution: 'Step 1: Ghungroos ring as dancers move their feet. Step 2: They are worn on the ankles.'
    mistakes:
      head: c4e2_where
      fingers: c4e2_where
  - prompt: Which word is a sound word?
    options:
    - buzz
    - table
    - green
    answer: buzz
    difficulty: 1
    hints:
    - Say each word aloud.
    - Which one sounds like a bee?
    solution: 'Step 1: Table is a thing; green is a colour. Step 2: Buzz copies a sound.'
    mistakes:
      table: c4e2_sound
      green: c4e2_sound
  - prompt: 'Fill in: The cow bells ___ softly in the field.'
    options:
    - tinkled
    - barked
    - roared
    answer: tinkled
    difficulty: 2
    hints:
    - Bells do not bark or roar.
    - Which word is a light bell sound?
    solution: 'Step 1: Barking and roaring are animal sounds. Step 2: Bells tinkle.'
    mistakes:
      barked: c4e2_word
      roared: c4e2_word
  - prompt: In which place would you hear a bell before prayers?
    options:
    - a temple
    - a swimming pool
    - a library
    answer: a temple
    difficulty: 1
    hints:
    - Prayers happen at a place of worship.
    - People ring it as they enter.
    solution: 'Step 1: Prayers happen in temples. Step 2: People ring the temple bell.'
    mistakes:
      a swimming pool: c4e2_where
      a library: c4e2_where
  - prompt: Why are bells useful on cows grazing in hills?
    options:
    - the farmer can hear where the cow is
    - bells make cows give more milk
    - bells keep cows cool
    answer: the farmer can hear where the cow is
    difficulty: 2
    hints:
    - Hills have trees and bushes.
    - What if you cannot see the cow?
    solution: 'Step 1: Cows may be out of sight. Step 2: The bell''s sound shows where they are.'
    mistakes:
      bells make cows give more milk: c4e2_where
      bells keep cows cool: c4e2_where
  - prompt: Choose the plural of 'anklet'.
    options:
    - anklets
    - ankletes
    - anklet
    answer: anklets
    difficulty: 1
    hints:
    - Most plurals add one letter.
    - bell → bells.
    solution: 'Step 1: Add ''s'' for more than one. Step 2: anklet → anklets.'
    mistakes:
      ankletes: c4e2_word
      anklet: c4e2_word
  - prompt: Which pair of words rhyme?
    options:
    - bell, tell
    - bell, bus
    - ring, cow
    answer: bell, tell
    difficulty: 2
    hints:
    - Rhyming words end with the same sound.
    - Say each pair aloud.
    solution: 'Step 1: bell and tell both end in ''-ell''. Step 2: They rhyme.'
    mistakes:
      bell, bus: c4e2_word
      ring, cow: c4e2_word
  - prompt: Which bell sound would be loudest?
    options:
    - a big church or temple bell
    - a tiny anklet bell
    - a toy bell
    answer: a big church or temple bell
    difficulty: 2
    hints:
    - Bigger bells are heavier.
    - Which can be heard across a town?
    solution: 'Step 1: Small bells make soft sounds. Step 2: Big bells ring loudest.'
    mistakes:
      a tiny anklet bell: c4e2_sound
      a toy bell: c4e2_sound
