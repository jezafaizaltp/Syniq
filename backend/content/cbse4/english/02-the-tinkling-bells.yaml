# CBSE Class 4 English (NCERT Santoor, 2025-26), chapter 2. Format: content/README.md.
# Chapter list checked against NCERT's contents page; chapter details from general knowledge, kept general where unsure (see README).
subject: cbse4-eng
chapter: 2
title: 'The Tinkling Bells (Unit 1: My Land)'
concepts:
- code: cbse4e.u1.bells
  title: 'The Tinkling Bells (Unit 1: My Land)'
  notes: |
    A lesson in the unit 'My Land'. Bells tinkle on temple doors, cows' necks, bicycles, school gates and anklets (ghungroo)
    across India. Exact story details are not reproduced here; questions focus on sound words (tinkle, ring, jingle),
    naming words and the lesson's theme of the sounds of our land.
  explanations:
    text: 'Bells make many sounds: a tinkle, a ring, a jingle. In India you hear bells on cows, bicycles, temple doors, school gates and dancers'' anklets. This lesson is about the sounds that fill our land.'
    visual: Draw a cow with a bell, a bicycle bell, a temple bell and a dancer's ankle bells.
    step_by_step: 1. Read the lesson. 2. Find the sound words. 3. Find where the bells are. 4. Think about the sounds around your home.
    real_world: Classical dancers like Bharatanatyam and Kathak dancers wear ghungroos, small bells on their ankles.
  picture:
    kind: compare
    columns:
    - title: Where
      points:
      - cow's neck
      - bicycle
      - dancer's ankle
    - title: Sound
      points:
      - ding-dong
      - tring-tring
      - tinkle-jingle
    alt: A cow's bell goes ding-dong, a bicycle bell tring-tring, and a dancer's ankle bells tinkle and jingle.
  activity:
    type: sort
    prompt: 'The Tinkling Bells: where is the bell?'
    bins:
    - Temple
    - Cow
    - Bicycle
    - Anklet
    items:
    - label: Rung before prayers
      bin: Temple
      clue: A place of worship.
      why: Temple bells ring at prayer time.
    - label: Tinkles round its neck in the field
      bin: Cow
      clue: An animal.
      why: Cows wear bells round their necks.
    - label: Rings to warn people on the road
      bin: Bicycle
      clue: Has two wheels.
      why: A bicycle bell warns walkers.
    - label: Ghungroo jingling on a dancer's feet
      bin: Anklet
      clue: Worn on feet.
      why: Ghungroo are ankle bells.
  items:
  - prompt: What does 'tinkle' describe?
    options:
    - a light ringing sound
    - a loud bang
    - a smell
    - a colour
    answer: a light ringing sound
    difficulty: 1
    hints:
    - Small bells.
    - Soft sound.
    solution: Tinkle is a light, ringing sound.
    mistakes:
      a loud bang: eng4_word
  - prompt: Which of these has bells on the ankles?
    options:
    - a Kathak dancer
    - a fish
    - a tree
    - a cloud
    answer: a Kathak dancer
    difficulty: 1
    hints:
    - Ghungroo.
    - Dance.
    solution: Kathak dancers wear ankle bells.
  - prompt: Why do farmers tie bells on cows?
    options:
    - to hear where the cows are
    - to make them fly
    - to keep them cold
    - to change their colour
    answer: to hear where the cows are
    difficulty: 2
    hints:
    - Cows wander.
    - Sound tells where.
    solution: The bell's sound shows where the cow is.
  - prompt: Which is a sound word?
    options:
    - jingle
    - table
    - green
    - happy
    answer: jingle
    difficulty: 1
    hints:
    - It names a noise.
    - Bells.
    solution: Jingle is a sound word.
  - prompt: 'A bicycle bell goes:'
    options:
    - tring-tring
    - moo-moo
    - quack-quack
    - tick-tock
    answer: tring-tring
    difficulty: 1
    hints:
    - Ring it.
    - Bicycle.
    solution: A bicycle bell goes tring-tring.
  - prompt: 'Choose the plural of ''bell'':'
    options:
    - bells
    - belles
    - bellies
    - bell
    answer: bells
    difficulty: 1
    hints:
    - Add s.
    - More than one.
    solution: One bell, many bells.
    mistakes:
      bellies: eng4_grammar
