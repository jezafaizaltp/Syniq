# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 7
title: The Cleanest Village
tips:
  m4_paise_one: "Paise are the small parts of a rupee. Two 50-paise coins make one rupee. Count the paise in them."
  c4_carry_sub: 'When the top digit is smaller, borrow 1 from the next place: it becomes 10 more in this place.'
  m4_add_words: "'How many more' and 'left' are take-away words. Which words put things together?"
  m4_four_times: "Four children, ₹25 each: 25 + 25 + 25 + 25."
concepts:
- code: cbse4m.clean.addsub
  title: Adding and subtracting in real life
  notes: |
    Word problems with addition and subtraction: a village collects 1,245 kg of dry waste and 868 kg of wet waste; total
    2,113 kg. Find how many more or how many are left by subtracting. Key words: in all, altogether (add); how many
    more, left, difference (subtract).
  explanations:
    text: 'Story sums: read carefully to decide whether to add or subtract. ''In all'' and ''altogether'' mean add. ''How many more'', ''left'' and ''difference'' mean subtract.'
    visual: 'Draw two bins: dry waste 1,245 kg and wet waste 868 kg. An arrow joins them: total 2,113 kg.'
    step_by_step: 'Step 1: Read the question twice. Step 2: Underline the key words. Step 3: Decide add or subtract. Step 4: Work it out and check it makes sense.'
    real_world: Villages that separate waste and compost it (like those that won cleanliness awards under Swachh Bharat) count waste in kilograms.
  picture:
    kind: flow
    steps:
    - Read the story
    - Find the key words
    - Add or subtract?
    - Solve and check
    alt: 'Solving a word problem: read the story, find the key words, decide to add or subtract, then solve and check.'
  activity:
    type: sort
    prompt: Do you add or take away to solve it?
    bins:
    - Add
    - Subtract
    items:
    - label: 12 boys and 9 girls. How many children in all?
      bin: Add
      clue: '''In all'' puts the groups together.'
      why: 12 + 9.
    - label: Ravi has 15 shells and finds 8 more. How many altogether?
      bin: Add
      clue: Is the number growing?
      why: 15 + 8.
    - label: A bus has 30 people; 6 more get on. How many now?
      bin: Add
      clue: More people come.
      why: 30 + 6.
    - label: Meena had 20 sweets and ate 5. How many are left?
      bin: Subtract
      clue: '''Left'' means some went away.'
      why: 20 − 5.
    - label: A box has 40 pencils; 15 are used. How many remain?
      bin: Subtract
      clue: Some are gone.
      why: 40 − 15.
    - label: Asha is 12, her brother 8. How many more years is Asha?
      bin: Subtract
      clue: '''How many more'' compares two numbers.'
      why: 12 − 8.
    - label: Find the difference between 50 and 35
      bin: Subtract
      clue: Difference compares.
      why: 50 − 35.
  items:
  - prompt: A village collected 1,245 kg of dry waste and 868 kg of wet waste. How many kg in all?
    answer: '2113'
    check: 1245+868
    difficulty: 1
    hints:
    - '''In all'' means add.'
    - 1245 + 868.
    solution: 1,245 + 868 = 2,113 kg.
    mistakes: {"2013": "m5_add_carry", "377": "m5_add_carry"}
  - prompt: Children planted 520 trees. 136 did not survive. How many survived?
    answer: '384'
    check: 520-136
    difficulty: 2
    hints:
    - Take away.
    - 520 − 136.
    solution: 520 − 136 = 384 trees.
    mistakes:
      '416': c4_carry_sub
  - prompt: Ward A has 342 houses and Ward B has 279. How many more houses in Ward A?
    answer: '63'
    check: 342-279
    difficulty: 1
    hints:
    - '''How many more'' means subtract.'
    - 342 − 279.
    solution: 342 − 279 = 63.
    mistakes: {"621": "m5_subtract_borrow", "137": "m5_subtract_borrow"}
  - prompt: Which key words tell you to add?
    options:
    - in all, altogether
    - how many more, left
    - difference, fewer
    - taken away
    answer: in all, altogether
    difficulty: 1
    hints:
    - Putting together.
    - Total.
    solution: '''In all'' and ''altogether'' mean add.'
    mistakes: {"how many more, left": "m4_add_words"}
  - prompt: A village has 2,500 dustbins. It buys 750 more. How many now?
    answer: '3250'
    check: 2500+750
    difficulty: 1
    hints:
    - Add.
    - 2500 + 750.
    solution: 2,500 + 750 = 3,250.
    mistakes: {"2575": "m5_add_carry", "1750": "m5_add_carry"}
  - prompt: Out of 1,000 houses, 875 have a compost pit. How many do not?
    answer: '125'
    check: 1000-875
    difficulty: 2
    hints:
    - Take away.
    - 1000 − 875.
    solution: 1,000 − 875 = 125.
    mistakes: {"225": "m5_subtract_borrow", "1875": "m5_subtract_borrow"}
- code: cbse4m.clean.money
  title: 'Money: rupees and paise'
  after:
  - cbse4m.clean.addsub
  notes: |
    ₹1 = 100 paise. Write ₹12.50 for 12 rupees 50 paise. Add and subtract money like other numbers, keeping rupees and
    paise in line. Bills and change: paid ₹100 for ₹65 → change ₹35.
  explanations:
    text: 'Money is counted in rupees and paise. 100 paise make 1 rupee. When you pay more than the price, the shopkeeper gives back change: money paid minus the price.'
    visual: 'Draw a ₹100 note, a ₹65 bill, and the change: three ₹10 notes and one ₹5 coin.'
    step_by_step: 'Step 1: Find the total cost. Step 2: Find what you paid. Step 3: Change = paid − cost.'
    real_world: Buying a broom and a dustbin for a cleanliness drive and checking the change.
  picture:
    kind: bars
    bars:
    - label: Paid
      value: 100
    - label: Cost
      value: 65
    - label: Change
      value: 35
    alt: Paying 100 rupees for something costing 65 gives 35 rupees change.
    unit: ₹
  activity:
    type: formula
    prompt: You pay with a ₹100 note. Set the price.
    inputs:
    - name: x
      label: Price
      min: 0
      max: 100
      step: 5
      start: 0
      unit: ₹
    outputs:
    - name: chg
      label: Change
      expr: 100-x
      unit: ₹
    goals:
    - prompt: You get ₹35 change. What did it cost?
      want:
        chg: 35
      mistakes:
      - when:
          x: 35
        say: ₹35 is the change. The price is what you paid minus the change.
    - prompt: You get ₹20 change.
      want:
        chg: 20
      mistakes:
      - when:
          x: 20
        say: ₹20 came back to you. The price is 100 − 20.
    - prompt: You buy two toys at ₹25 each. Set the total price.
      want:
        x: 50
      mistakes:
      - when:
          x: 25
        say: That's one toy. There are two.
      - when:
          x: 75
        say: That's three toys.
  items:
  - prompt: How many paise are in ₹1?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - Paise are small parts of a rupee.
    - 100 of them.
    solution: ₹1 = 100 paise.
    mistakes: {"10": "m4_paise_one", "1000": "m4_paise_one"}
  - prompt: A broom costs ₹65. You pay with ₹100. How much change in rupees?
    answer: '35'
    check: 100-65
    difficulty: 1
    hints:
    - Paid − cost.
    - 100 − 65.
    solution: 100 − 65 = ₹35.
    mistakes: {"45": "m5_subtract_borrow", "165": "m5_subtract_borrow"}
  - prompt: A dustbin costs ₹120 and gloves cost ₹45. What is the total in rupees?
    answer: '165'
    check: 120+45
    difficulty: 1
    hints:
    - Add.
    - 120 + 45.
    solution: 120 + 45 = ₹165.
    mistakes: {"155": "m5_add_carry", "75": "m5_add_carry"}
  - prompt: How many paise are in ₹5?
    answer: '500'
    check: 5*100
    difficulty: 1
    hints:
    - 5 × 100.
    - Each rupee is 100 paise.
    solution: 5 × 100 = 500 paise.
    mistakes: {"50": "m5_paise", "5000": "m5_paise"}
  - prompt: Four children each give ₹25 for a cleanliness drive. How many rupees in all?
    answer: '100'
    check: 25*4
    difficulty: 1
    hints:
    - 25 × 4.
    - Four 25s.
    solution: 25 × 4 = ₹100.
    mistakes: {"29": "m4_four_times", "80": "m4_four_times"}
  - prompt: You have ₹200 and buy things for ₹145. How many rupees are left?
    answer: '55'
    check: 200-145
    difficulty: 2
    hints:
    - Take away.
    - 200 − 145.
    solution: 200 − 145 = ₹55.
    mistakes: {"65": "m5_subtract_borrow", "345": "m5_subtract_borrow"}
