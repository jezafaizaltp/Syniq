# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 2
title: Hide and Seek
tips:
  c4_view: Imagine you are standing where the person is. What is in front of them, behind them, to their left?
  m4_above: "Look up at the ceiling. Is the fan higher or lower than the table?"
  m4_ball_view: "Turn a ball any way you like. Does its outline change?"
  m4_behind: "To hide, the cupboard must be between you and the seeker."
  m4_below: "'Under' means the same as ...?"
  m4_between: "'Between' means in the middle of two things. M is first and T is last."
  m4_cone_front: "From the top, a cone looks round. From the front it has a point at the top."
  m4_glass_top: "Look down into a glass. What shape is its rim?"
  m4_matchbox: "A matchbox has flat faces with straight edges, longer than wide."
  m4_queue: "3rd comes before 4th. Who is nearer the front?"
concepts:
- code: cbse4m.hide.position
  title: Position and direction words
  notes: |
    Words for position: in front of, behind, beside (next to), between, above, below, near, far, left, right, inside,
    outside. In hide and seek, a child behind a tree cannot be seen from the front. What is on your left is on the
    right of someone facing you.
  explanations:
    text: 'Position words tell us where things are: in front of, behind, beside, between, above and below. If someone faces you, their left hand is opposite your left hand.'
    visual: Draw a tree, a child behind it, a dog in front of it and a bird above it.
    step_by_step: 'Step 1: Find the object you are describing. Step 2: Find what it is next to. Step 3: Choose the word: in front, behind, beside, above, below or between.'
    real_world: When playing hide and seek you hide behind a door or under a bed so the seeker cannot see you.
  picture:
    kind: flow
    steps:
    - 'Bird: above the tree'
    - Tree
    - 'Child: behind the tree'
    - 'Dog: in front of the tree'
    alt: A bird is above the tree, a child hides behind it, and a dog sits in front of it.
  activity:
    type: sort
    prompt: Where is it? Use the picture in your head.
    bins:
    - Above
    - Below
    - Beside
    items:
    - label: The fan, when you look up from your bed
      bin: Above
      clue: Do you look up or down?
      why: 'Up: above you.'
    - label: A bird flying over the house
      bin: Above
      clue: Higher than the roof.
      why: Above.
    - label: The clock on the wall over the board
      bin: Above
      clue: Higher than the board.
      why: Above.
    - label: Your shoes under the bed
      bin: Below
      clue: Do you bend down to find them?
      why: Below.
    - label: Roots under the soil
      bin: Below
      clue: Deep in the ground.
      why: Below.
    - label: The mat under the table
      bin: Below
      clue: On the floor, lower than the table.
      why: Below.
    - label: Your friend sitting next to you
      bin: Beside
      clue: Same height, at your side.
      why: Beside.
    - label: A cup next to the plate
      bin: Beside
      clue: Side by side.
      why: Beside.
  items:
  - prompt: Riya hides so the seeker cannot see her. She is most likely ___ the cupboard.
    options:
    - behind
    - in front of
    - on top of in full view
    - far away in the open
    answer: behind
    difficulty: 1
    hints:
    - The seeker looks from the front.
    - Hidden side.
    solution: Hiding behind the cupboard keeps her out of sight.
    mistakes: {"in front of": "m4_behind"}
  - prompt: In the word 'MAT', which letter is between M and T?
    options:
    - A
    - M
    - T
    - none
    answer: A
    difficulty: 1
    hints:
    - Look in the middle.
    - M _ T.
    solution: A is between M and T.
    mistakes: {"M": "m4_between"}
  - prompt: A fan on the ceiling is ___ the table.
    options:
    - above
    - below
    - inside
    - behind
    answer: above
    difficulty: 1
    hints:
    - It is high up.
    - Ceiling.
    solution: The fan is above the table.
    mistakes: {"below": "m4_above"}
  - prompt: Your friend faces you and raises their right hand. On which side of you is that hand?
    options:
    - your left
    - your right
    - behind you
    - above you
    answer: your left
    difficulty: 2
    hints:
    - Facing people are mirror images.
    - Try it with a friend.
    solution: Facing you, their right hand is on your left.
    mistakes:
      your right: c4_view
  - prompt: Shoes kept under the bed are ___ the bed.
    options:
    - below
    - above
    - 'on'
    - beside
    answer: below
    difficulty: 1
    hints:
    - Under means ...
    - Lower down.
    solution: Under the bed means below it.
    mistakes: {"above": "m4_below"}
  - prompt: In a queue, Ali is 3rd and Sara is 4th. Sara is ___ Ali.
    options:
    - behind
    - in front of
    - above
    - below
    answer: behind
    difficulty: 2
    hints:
    - Who comes first?
    - Bigger number is further back.
    solution: Sara is behind Ali.
    mistakes: {"in front of": "m4_queue"}
- code: cbse4m.hide.views
  title: Seeing from different sides
  after:
  - cbse4m.hide.position
  notes: |
    Objects look different from the top, front and side. A cylinder (glass) looks like a circle from the top and a
    rectangle from the front. A cone looks like a circle from the top and a triangle from the front. Maps show the top
    view.
  explanations:
    text: Things look different depending on where you look from. A glass seen from above looks like a circle. From the side it looks like a rectangle.
    visual: Draw a glass from the side (a rectangle) and from the top (a circle).
    step_by_step: 'Step 1: Imagine standing where the viewer is. Step 2: Picture only what faces you. Step 3: Draw that flat shape.'
    real_world: A bird sees our house roof from the top; we see the front door from the street.
  picture:
    kind: compare
    columns:
    - title: Object
      points:
      - Glass (cylinder)
      - Party hat (cone)
      - Ball (sphere)
    - title: Top view
      points:
      - circle
      - circle with a dot
      - circle
    - title: Front view
      points:
      - rectangle
      - triangle
      - circle
    alt: A glass looks like a circle from the top and a rectangle from the front; a party hat a circle and a triangle; a ball a circle both ways.
  activity:
    type: sort
    prompt: What shape do you see?
    bins:
    - Circle
    - Rectangle
    - Square
    items:
    - label: A glass, looking down from the top
      bin: Circle
      clue: Look at its mouth.
      why: A circle.
    - label: A tin, looking down from the top
      bin: Circle
      clue: The lid.
      why: A circle.
    - label: A coin lying flat
      bin: Circle
      clue: Round.
      why: A circle.
    - label: A glass, seen from the side
      bin: Rectangle
      clue: Straight sides, flat top and bottom.
      why: A rectangle.
    - label: A brick, seen from the top
      bin: Rectangle
      clue: Long and thin.
      why: A rectangle.
    - label: A book cover
      bin: Rectangle
      clue: Taller than wide.
      why: A rectangle.
    - label: A dice, seen from any side
      bin: Square
      clue: All faces are the same.
      why: A square.
    - label: A carrom board, seen from the top
      bin: Square
      clue: Every side the same length.
      why: A square.
  items:
  - prompt: 'A glass seen from directly above looks like a:'
    options:
    - circle
    - square
    - triangle
    - star
    answer: circle
    difficulty: 1
    hints:
    - Look down into a glass.
    - Round rim.
    solution: From the top, a glass looks like a circle.
    mistakes: {"square": "m4_glass_top"}
  - prompt: 'A party hat (cone) seen from the front looks like a:'
    options:
    - triangle
    - circle
    - square
    - rectangle
    answer: triangle
    difficulty: 2
    hints:
    - Pointed top, wide bottom.
    - Three sides.
    solution: From the front, a cone looks like a triangle.
    mistakes: {"circle": "m4_cone_front"}
  - prompt: 'A ball looks like a circle from:'
    options:
    - every side
    - only the top
    - only the front
    - no side
    answer: every side
    difficulty: 2
    hints:
    - It is round all over.
    - Turn it.
    solution: A sphere looks like a circle from every side.
    mistakes: {"only the top": "m4_ball_view"}
  - prompt: 'A map shows places as seen from:'
    options:
    - above
    - below
    - behind
    - inside
    answer: above
    difficulty: 1
    hints:
    - Like a bird.
    - Top view.
    solution: Maps are top views.
    mistakes: {"below": "v4_map_above"}
  - prompt: 'A matchbox seen from the top looks like a:'
    options:
    - rectangle
    - circle
    - triangle
    - pentagon
    answer: rectangle
    difficulty: 1
    hints:
    - Long and narrow.
    - Four corners.
    solution: From the top, a matchbox looks like a rectangle.
    mistakes: {"circle": "m4_matchbox"}
  - prompt: 'A tin can seen from the front looks like a:'
    options:
    - rectangle
    - circle
    - triangle
    - hexagon
    answer: rectangle
    difficulty: 2
    hints:
    - Straight sides.
    - Flat top and bottom.
    solution: From the front, a cylinder looks like a rectangle.
    mistakes:
      circle: c4_view
