# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 2
title: Hide and Seek
tips:
  c4_view: Imagine you are standing where the person is. What is in front of them, behind them, to their left?
  m4_above: "Look up at the ceiling. Is the fan higher or lower than the table?"
  m4_ball_view: "Turn a ball any way you like. Does its outline change?"
  m4_behind: "To hide, the cupboard must be between you and the seeker."
  m4_below: "'Under' means the same as ...?"
  m4_between: "'Between' means in the middle of two things. M is first and T is last."
  m4_cone_front: "From the top, a cone looks round. From the front it has a point at the top."
  m4_glass_top: "Look down into a glass. What shape is its rim?"
  m4_matchbox: "A matchbox has flat faces with straight edges, longer than wide."
  m4_queue: "3rd comes before 4th. Who is nearer the front?"
  c4m2_stand: Stand where the person in the question stands and point. Which way does your hand go?
  c4m2_order: Draw the line with a dot for each person, in order, then look at the dots on each side.
  c4m2_view: Hold the object in your mind and look straight down at it, then straight from the front. What outline do you see?
concepts:
- code: cbse4m.hide.position
  title: Position and direction words
  notes: |
    Words for position: in front of, behind, beside (next to), between, above, below, near, far, left, right, inside,
    outside. In hide and seek, a child behind a tree cannot be seen from the front. What is on your left is on the
    right of someone facing you.
  explanations:
    text: 'Position words tell us where things are: in front of, behind, beside, between, above and below. If someone faces you, their left hand is opposite your left hand.'
    visual: Draw a tree, a child behind it, a dog in front of it and a bird above it.
    step_by_step: 'Step 1: Find the object you are describing. Step 2: Find what it is next to. Step 3: Choose the word: in front, behind, beside, above, below or between.'
    real_world: When playing hide and seek you hide behind a door or under a bed so the seeker cannot see you.
  picture:
    kind: flow
    steps:
    - 'Bird: above the tree'
    - Tree
    - 'Child: behind the tree'
    - 'Dog: in front of the tree'
    alt: A bird is above the tree, a child hides behind it, and a dog sits in front of it.
  activity:
    type: sort
    prompt: Where is it? Use the picture in your head.
    bins:
    - Above
    - Below
    - Beside
    items:
    - label: The fan, when you look up from your bed
      bin: Above
      clue: Do you look up or down?
      why: 'Up: above you.'
    - label: A bird flying over the house
      bin: Above
      clue: Higher than the roof.
      why: Above.
    - label: The clock on the wall over the board
      bin: Above
      clue: Higher than the board.
      why: Above.
    - label: Your shoes under the bed
      bin: Below
      clue: Do you bend down to find them?
      why: Below.
    - label: Roots under the soil
      bin: Below
      clue: Deep in the ground.
      why: Below.
    - label: The mat under the table
      bin: Below
      clue: On the floor, lower than the table.
      why: Below.
    - label: Your friend sitting next to you
      bin: Beside
      clue: Same height, at your side.
      why: Beside.
    - label: A cup next to the plate
      bin: Beside
      clue: Side by side.
      why: Beside.
  lesson:
    - teach: 'Position words tell where something is: in front of, behind, beside, between, above, below, inside, outside. In hide and seek you hide behind something so the seeker cannot see you.'
      check:
        prompt: A cat sits under the table. The cat is ___ the table.
        options:
        - below
        - above
        - beside
        answer: below
        why: Under means lower than, which is below.
    - teach: Between means in the middle of two things. In a line A, B, C, B is between A and C. To find who is between, list the order first.
      picture:
        kind: flow
        steps:
        - Asha
        - Ben
        - Chitra
        - Dev
        alt: 'Four children in a line: Asha, Ben, Chitra, Dev.'
      check:
        prompt: In the line Asha, Ben, Chitra, Dev, who is between Ben and Dev?
        options:
        - Chitra
        - Asha
        - Ben
        answer: Chitra
        why: Chitra stands in the middle of Ben and Dev.
    - teach: 'Left and right depend on where you face. If a friend faces you, their right hand is on your left side. So always ask: whose left?'
      check:
        prompt: You and a friend face each other. You raise your left hand. On which side of your friend is it?
        options:
        - their right
        - their left
        - above them
        answer: their right
        why: Facing each other swaps left and right.
  items:
  - prompt: Riya hides so the seeker cannot see her. She is most likely ___ the cupboard.
    options:
    - behind
    - in front of
    - on top of in full view
    - far away in the open
    answer: behind
    difficulty: 1
    hints:
    - The seeker looks from the front.
    - Hidden side.
    solution: Hiding behind the cupboard keeps her out of sight.
    mistakes: {"in front of": "m4_behind"}
  - prompt: In the word 'MAT', which letter is between M and T?
    options:
    - A
    - M
    - T
    - none
    answer: A
    difficulty: 1
    hints:
    - Look in the middle.
    - M _ T.
    solution: A is between M and T.
    mistakes: {"M": "m4_between"}
  - prompt: A fan on the ceiling is ___ the table.
    options:
    - above
    - below
    - inside
    - behind
    answer: above
    difficulty: 1
    hints:
    - It is high up.
    - Ceiling.
    solution: The fan is above the table.
    mistakes: {"below": "m4_above"}
  - prompt: Your friend faces you and raises their right hand. On which side of you is that hand?
    options:
    - your left
    - your right
    - behind you
    - above you
    answer: your left
    difficulty: 2
    hints:
    - Facing people are mirror images.
    - Try it with a friend.
    solution: Facing you, their right hand is on your left.
    mistakes:
      your right: c4_view
  - prompt: Shoes kept under the bed are ___ the bed.
    options:
    - below
    - above
    - 'on'
    - beside
    answer: below
    difficulty: 1
    hints:
    - Under means ...
    - Lower down.
    solution: Under the bed means below it.
    mistakes: {"above": "m4_below"}
  - prompt: In a queue, Ali is 3rd and Sara is 4th. Sara is ___ Ali.
    options:
    - behind
    - in front of
    - above
    - below
    answer: behind
    difficulty: 2
    hints:
    - Who comes first?
    - Bigger number is further back.
    solution: Sara is behind Ali.
    mistakes: {"in front of": "m4_queue"}
  - prompt: In a line of 7 children, Meena is 4th from the front. How many children are in front of Meena?
    answer: '3'
    check: 4-1
    difficulty: 2
    hints:
    - Draw 7 dots and circle the 4th.
    - Count the dots before the circle.
    solution: 'Step 1: Meena is in place 4. Step 2: Places 1, 2, 3 are in front: 3 children.'
    mistakes:
      '4': c4m2_order
      '2': c4m2_order
  - prompt: In a line of 7 children, Meena is 4th from the front. How many children are behind Meena?
    answer: '3'
    check: 7-4
    difficulty: 2
    hints:
    - Draw 7 dots and circle the 4th.
    - Count the dots after the circle.
    solution: 'Step 1: Places 5, 6, 7 come after place 4. Step 2: That is 7 − 4 = 3 children.'
    mistakes:
      '4': c4m2_order
      '2': c4m2_order
  - prompt: Books are on a shelf. The red book is above the blue book, and the green book is above the red book. Which book is at the top?
    options:
    - green
    - red
    - blue
    answer: green
    difficulty: 2
    hints:
    - Start from the bottom book.
    - Stack them one by one.
    solution: 'Step 1: Blue at the bottom, red above it. Step 2: Green is above red, so green is at the top.'
    mistakes:
      red: c4m2_order
      blue: c4m2_order
  - prompt: A pen is inside the box. Where is the pen?
    options:
    - in the box
    - on top of the box
    - next to the box
    answer: in the box
    difficulty: 1
    hints:
    - Inside means within something.
    - Can you see the pen without opening the box?
    solution: 'Step 1: Inside = within. Step 2: The pen is in the box.'
    mistakes:
      on top of the box: c4m2_stand
      next to the box: c4m2_stand
  - prompt: 'You face North. Your right hand points to:'
    options:
    - East
    - West
    - South
    answer: East
    difficulty: 3
    hints:
    - Picture a map with North at the top.
    - The sun rises on which side of that map?
    solution: 'Step 1: Facing North, the right side of the map is East. Step 2: Your right hand points East.'
    mistakes:
      West: c4m2_stand
      South: c4m2_stand
  - prompt: A tree is near your house and the school is far. Which takes more steps to reach?
    options:
    - the school
    - the tree
    - both the same
    answer: the school
    difficulty: 1
    hints:
    - Far means a long way away.
    - Longer way, more steps.
    solution: 'Step 1: Far places need more walking. Step 2: The school takes more steps.'
    mistakes:
      the tree: c4m2_stand
      both the same: c4m2_stand
  - prompt: In the number 5 8 3, which digit is between 5 and 3?
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - Read the digits from left to right.
    - Which digit sits in the middle?
    solution: 'Step 1: The digits are 5, 8, 3. Step 2: 8 is between 5 and 3.'
    mistakes:
      '5': c4m2_order
      '3': c4m2_order
  - prompt: Ravi is 2nd in a race and Tara finishes just behind Ravi. What place is Tara?
    answer: '3'
    check: 2+1
    difficulty: 1
    hints:
    - Just behind means the next place.
    - Add one place.
    solution: 'Step 1: Ravi is 2nd. Step 2: Just behind is 3rd.'
    mistakes:
      '1': c4m2_order
      '4': c4m2_order
  - prompt: A friend faces you and points with their left hand. Which side of you is that hand on?
    options:
    - your right
    - your left
    - behind you
    answer: your right
    difficulty: 3
    hints:
    - Face a mirror or a friend to try it.
    - Facing each other swaps the sides.
    solution: 'Step 1: Facing someone swaps left and right. Step 2: Their left hand is on your right.'
    mistakes:
      your left: c4m2_stand
      behind you: c4m2_stand
- code: cbse4m.hide.views
  title: Seeing from different sides
  after:
  - cbse4m.hide.position
  notes: |
    Objects look different from the top, front and side. A cylinder (glass) looks like a circle from the top and a
    rectangle from the front. A cone looks like a circle from the top and a triangle from the front. Maps show the top
    view.
  explanations:
    text: Things look different depending on where you look from. A glass seen from above looks like a circle. From the side it looks like a rectangle.
    visual: Draw a glass from the side (a rectangle) and from the top (a circle).
    step_by_step: 'Step 1: Imagine standing where the viewer is. Step 2: Picture only what faces you. Step 3: Draw that flat shape.'
    real_world: A bird sees our house roof from the top; we see the front door from the street.
  picture:
    kind: compare
    columns:
    - title: Object
      points:
      - Glass (cylinder)
      - Party hat (cone)
      - Ball (sphere)
    - title: Top view
      points:
      - circle
      - circle with a dot
      - circle
    - title: Front view
      points:
      - rectangle
      - triangle
      - circle
    alt: A glass looks like a circle from the top and a rectangle from the front; a party hat a circle and a triangle; a ball a circle both ways.
  activity:
    type: sort
    prompt: What shape do you see?
    bins:
    - Circle
    - Rectangle
    - Square
    items:
    - label: A glass, looking down from the top
      bin: Circle
      clue: Look at its mouth.
      why: A circle.
    - label: A tin, looking down from the top
      bin: Circle
      clue: The lid.
      why: A circle.
    - label: A coin lying flat
      bin: Circle
      clue: Round.
      why: A circle.
    - label: A glass, seen from the side
      bin: Rectangle
      clue: Straight sides, flat top and bottom.
      why: A rectangle.
    - label: A brick, seen from the top
      bin: Rectangle
      clue: Long and thin.
      why: A rectangle.
    - label: A book cover
      bin: Rectangle
      clue: Taller than wide.
      why: A rectangle.
    - label: A dice, seen from any side
      bin: Square
      clue: All faces are the same.
      why: A square.
    - label: A carrom board, seen from the top
      bin: Square
      clue: Every side the same length.
      why: A square.
  lesson:
    - teach: The same object looks different from different sides. From the top we see its top view; from the front, its front view. A glass from the top looks like a circle.
      check:
        prompt: 'A round plate seen from directly above looks like a:'
        options:
        - circle
        - rectangle
        - triangle
        answer: circle
        why: From above you see the full round shape.
    - teach: From the front, a glass (cylinder) looks like a rectangle, and a party hat (cone) looks like a triangle. A ball (sphere) looks like a circle from every side.
      picture:
        kind: compare
        columns:
        - title: From the top
          points:
          - 'glass: circle'
          - 'cone: circle'
          - 'box: rectangle'
        - title: From the front
          points:
          - 'glass: rectangle'
          - 'cone: triangle'
          - 'box: rectangle'
        alt: Top views and front views of a glass, a cone and a box.
      check:
        prompt: 'A cone seen from the front looks like a:'
        options:
        - triangle
        - circle
        - square
        answer: triangle
        why: It is wide at the bottom and comes to a point at the top.
    - teach: A map shows places from above, like a bird would see them. On a map, a round water tank shows as a circle and a house roof as a rectangle.
      check:
        prompt: 'On a map, a square playground shows as a:'
        options:
        - square
        - circle
        - triangle
        answer: square
        why: A map is a top view; the playground's outline stays a square.
  items:
  - prompt: 'A glass seen from directly above looks like a:'
    options:
    - circle
    - square
    - triangle
    - star
    answer: circle
    difficulty: 1
    hints:
    - Look down into a glass.
    - Round rim.
    solution: From the top, a glass looks like a circle.
    mistakes: {"square": "m4_glass_top"}
  - prompt: 'A party hat (cone) seen from the front looks like a:'
    options:
    - triangle
    - circle
    - square
    - rectangle
    answer: triangle
    difficulty: 2
    hints:
    - Pointed top, wide bottom.
    - Three sides.
    solution: From the front, a cone looks like a triangle.
    mistakes: {"circle": "m4_cone_front"}
  - prompt: 'A ball looks like a circle from:'
    options:
    - every side
    - only the top
    - only the front
    - no side
    answer: every side
    difficulty: 2
    hints:
    - It is round all over.
    - Turn it.
    solution: A sphere looks like a circle from every side.
    mistakes: {"only the top": "m4_ball_view"}
  - prompt: 'A map shows places as seen from:'
    options:
    - above
    - below
    - behind
    - inside
    answer: above
    difficulty: 1
    hints:
    - Like a bird.
    - Top view.
    solution: Maps are top views.
    mistakes: {"below": "v4_map_above"}
  - prompt: 'A matchbox seen from the top looks like a:'
    options:
    - rectangle
    - circle
    - triangle
    - pentagon
    answer: rectangle
    difficulty: 1
    hints:
    - Long and narrow.
    - Four corners.
    solution: From the top, a matchbox looks like a rectangle.
    mistakes: {"circle": "m4_matchbox"}
  - prompt: 'A tin can seen from the front looks like a:'
    options:
    - rectangle
    - circle
    - triangle
    - hexagon
    answer: rectangle
    difficulty: 2
    hints:
    - Straight sides.
    - Flat top and bottom.
    solution: From the front, a cylinder looks like a rectangle.
    mistakes:
      circle: c4_view
  - prompt: 'A dice seen from the top looks like a:'
    options:
    - square
    - circle
    - triangle
    answer: square
    difficulty: 1
    hints:
    - Every face of a dice is the same shape.
    - All 4 sides of that face are equal.
    solution: 'Step 1: Each face of a cube is a square. Step 2: From the top you see one face: a square.'
    mistakes:
      circle: c4m2_view
      triangle: c4m2_view
  - prompt: 'A bucket seen from directly above shows:'
    options:
    - a circle
    - a triangle
    - a square
    answer: a circle
    difficulty: 1
    hints:
    - Look at the rim of the bucket from above.
    - The rim is round.
    solution: 'Step 1: From above you see the round rim. Step 2: It looks like a circle.'
    mistakes:
      a triangle: c4m2_view
      a square: c4m2_view
  - prompt: Which object looks like a circle from the top AND a triangle from the front?
    options:
    - an ice-cream cone
    - a tin can
    - a brick
    answer: an ice-cream cone
    difficulty: 2
    hints:
    - Which one has a round top?
    - Of those, which comes to a point?
    solution: 'Step 1: Cone and tin have round tops. Step 2: Only the cone is a triangle from the front.'
    mistakes:
      a tin can: c4m2_view
      a brick: c4m2_view
  - prompt: Which object looks like a circle from every side?
    options:
    - a marble
    - a pencil
    - a book
    answer: a marble
    difficulty: 1
    hints:
    - Which one is shaped like a small ball?
    - A ball looks the same however you turn it.
    solution: 'Step 1: A marble is a sphere. Step 2: A sphere looks like a circle from every side.'
    mistakes:
      a pencil: c4m2_view
      a book: c4m2_view
  - prompt: 'A pencil standing straight up, seen from the top, looks like a:'
    options:
    - small hexagon or circle
    - long rectangle
    - triangle
    answer: small hexagon or circle
    difficulty: 3
    hints:
    - From the top you only see the end of the pencil.
    - What shape is the end of a pencil?
    solution: 'Step 1: Standing up, you see only its end. Step 2: The end is a small hexagon (or a circle for round pencils).'
    mistakes:
      long rectangle: c4m2_view
      triangle: c4m2_view
  - prompt: Why does a map use the view from above?
    options:
    - It shows where places are without hiding any
    - It makes buildings look taller
    - It shows the colour of doors
    answer: It shows where places are without hiding any
    difficulty: 2
    hints:
    - From the front, a tall building hides what is behind it.
    - From above, what can you see?
    solution: 'Step 1: From the front, things hide each other. Step 2: From above, every place is visible, so maps use the top view.'
    mistakes:
      It makes buildings look taller: c4m2_view
      It shows the colour of doors: c4m2_view
  - prompt: 'A lunch box shaped like a cuboid, seen from the side, looks like a:'
    options:
    - rectangle
    - circle
    - triangle
    answer: rectangle
    difficulty: 1
    hints:
    - Every face of a cuboid has 4 corners.
    - Which flat shape has 4 corners and opposite sides equal?
    solution: 'Step 1: Each face of a cuboid is a rectangle. Step 2: The side view is a rectangle.'
    mistakes:
      circle: c4m2_view
      triangle: c4m2_view
  - prompt: From the top you see a circle; from the front you see a rectangle. What could it be?
    options:
    - a drum
    - a ball
    - a party hat
    answer: a drum
    difficulty: 2
    hints:
    - A circle on top means a round top.
    - A rectangle from the front means straight sides, no point.
    solution: 'Step 1: Ball is a circle from the front; hat is a triangle. Step 2: A drum (cylinder) fits both views.'
    mistakes:
      a ball: c4m2_view
      a party hat: c4m2_view
  - prompt: A tent shaped like a triangle from the front is seen from the top. What do you see?
    options:
    - a rectangle
    - a circle
    - a triangle
    answer: a rectangle
    difficulty: 3
    hints:
    - A tent has a long roof ridge running front to back.
    - From above, you see its floor outline.
    solution: 'Step 1: The tent''s floor is a rectangle. Step 2: From the top, its outline is a rectangle.'
    mistakes:
      a circle: c4m2_view
      a triangle: c4m2_view
