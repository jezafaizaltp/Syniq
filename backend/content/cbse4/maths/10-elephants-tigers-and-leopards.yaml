# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 10
title: Elephants, Tigers and Leopards
tips:
  c4_double: Double means add the number to itself, or multiply by 2. Half means split into 2 equal parts.
concepts:
- code: cbse4m.animals.compare
  title: Comparing animal numbers
  notes: |
    Compare large numbers of animals: India has about 3,000+ tigers. Use greater than (>), less than (<), equal (=).
    Double and half: double 450 = 900; half of 900 = 450. Find differences by subtracting.
  explanations:
    text: To compare two numbers, look at the biggest place first. Use > for greater than and < for less than. Doubling means twice as many; halving means splitting into two equal parts.
    visual: 'Draw bars for animals in a park: elephants 120, tigers 45, leopards 60.'
    step_by_step: 'Step 1: Look at the thousands, then hundreds, then tens. Step 2: Decide which is bigger. Step 3: Write > or <.'
    real_world: Forest officers count tigers and elephants in national parks to know if numbers are growing.
  picture:
    kind: bars
    bars:
    - label: Elephants
      value: 120
    - label: Tigers
      value: 45
    - label: Leopards
      value: 60
    alt: 'Animals counted in a park: 120 elephants, 45 tigers and 60 leopards.'
    unit: animals
  items:
  - prompt: 'Which sign makes this true: 120 ___ 45?'
    options:
    - '>'
    - <
    - '='
    - +
    answer: '>'
    difficulty: 1
    hints:
    - Which is bigger?
    - 120 is bigger.
    solution: 120 > 45.
  - prompt: A park has 120 elephants and 45 tigers. How many more elephants than tigers?
    answer: '75'
    check: 120-45
    difficulty: 1
    hints:
    - Difference.
    - 120 − 45.
    solution: 120 − 45 = 75.
  - prompt: What is double 450?
    answer: '900'
    check: 450*2
    difficulty: 1
    hints:
    - 450 + 450.
    - 450 × 2.
    solution: 450 × 2 = 900.
    mistakes:
      '225': c4_double
  - prompt: What is half of 60?
    answer: '30'
    check: 60/2
    difficulty: 1
    hints:
    - 60 ÷ 2.
    - Split equally.
    solution: 60 ÷ 2 = 30.
  - prompt: Elephants 120, tigers 45, leopards 60. How many animals in all?
    answer: '225'
    check: 120+45+60
    difficulty: 2
    hints:
    - Add all three.
    - 120 + 45 + 60.
    solution: 120 + 45 + 60 = 225.
  - prompt: Which number is smallest?
    options:
    - 1,099
    - 1,909
    - 1,990
    - 9,011
    answer: 1,099
    difficulty: 2
    hints:
    - Compare place by place.
    - Same thousands, look at hundreds.
    solution: 1,099 has 0 hundreds, so it is smallest.
- code: cbse4m.animals.measure
  title: Big animal measurements
  after:
  - cbse4m.animals.compare
  notes: |
    An elephant eats about 150 kg of food a day; drinks about 100 L of water. A tiger can leap about 6 m. Multiply for
    many days: 150 kg × 7 = 1,050 kg in a week. Compare lengths and weights in the same unit.
  explanations:
    text: Big animals need lots of food. If an elephant eats 150 kg in one day, in a week it eats 7 times as much. Multiply to find totals for many days.
    visual: 'Draw an elephant with a speech bubble: ''150 kg of food a day!'' and a calendar with 7 days.'
    step_by_step: 'Step 1: Find the amount for one day. Step 2: Count the days. Step 3: Multiply.'
    real_world: Elephant camps like those in Kerala and Karnataka prepare huge amounts of food each day.
  picture:
    kind: flow
    steps:
    - '1 day: 150 kg'
    - × 7 days
    - = 1,050 kg in a week
    alt: An elephant eating 150 kilograms a day eats 1,050 kilograms in 7 days.
  items:
  - prompt: An elephant eats 150 kg of food a day. How many kg in 2 days?
    answer: '300'
    check: 150*2
    difficulty: 1
    hints:
    - 150 × 2.
    - Double.
    solution: 150 × 2 = 300 kg.
  - prompt: An elephant drinks 100 L of water a day. How many litres in 5 days?
    answer: '500'
    check: 100*5
    difficulty: 1
    hints:
    - 100 × 5.
    - Add a zero ...
    solution: 100 × 5 = 500 L.
  - prompt: A tiger leaps 6 m. How far in 4 leaps, in m?
    answer: '24'
    check: 6*4
    difficulty: 1
    hints:
    - 6 × 4.
    - Same leap each time.
    solution: 6 × 4 = 24 m.
  - prompt: A baby elephant weighs 120 kg. Its mother weighs 3,000 kg. How many kg heavier is the mother?
    answer: '2880'
    check: 3000-120
    difficulty: 2
    hints:
    - 3000 − 120.
    - Subtract.
    solution: 3,000 − 120 = 2,880 kg.
  - prompt: An elephant eats 150 kg a day. How many kg in a week (7 days)?
    answer: '1050'
    check: 150*7
    difficulty: 2
    hints:
    - 150 × 7.
    - 100 × 7 + 50 × 7.
    solution: 150 × 7 = 1,050 kg.
  - prompt: Which animal is heaviest?
    options:
    - elephant
    - leopard
    - tiger
    - deer
    answer: elephant
    difficulty: 1
    hints:
    - Largest land animal.
    - Big ears.
    solution: The elephant is heaviest.
