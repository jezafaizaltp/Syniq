# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 10
title: Elephants, Tigers and Leopards
tips:
  c4_double: Double means add the number to itself, or multiply by 2. Half means split into 2 equal parts.
  m4_greater: "The open mouth of > and < always eats the bigger number."
  m4_heaviest: "Which of these animals is the biggest land animal?"
  m4_smallest: "All start with 1. Compare the hundreds digit next."
concepts:
- code: cbse4m.animals.compare
  title: Comparing animal numbers
  notes: |
    Compare large numbers of animals: India has about 3,000+ tigers. Use greater than (>), less than (<), equal (=).
    Double and half: double 450 = 900; half of 900 = 450. Find differences by subtracting.
  explanations:
    text: To compare two numbers, look at the biggest place first. Use > for greater than and < for less than. Doubling means twice as many; halving means splitting into two equal parts.
    visual: 'Draw bars for animals in a park: elephants 120, tigers 45, leopards 60.'
    step_by_step: 'Step 1: Look at the thousands, then hundreds, then tens. Step 2: Decide which is bigger. Step 3: Write > or <.'
    real_world: Forest officers count tigers and elephants in national parks to know if numbers are growing.
  picture:
    kind: bars
    bars:
    - label: Elephants
      value: 120
    - label: Tigers
      value: 45
    - label: Leopards
      value: 60
    alt: 'Animals counted in a park: 120 elephants, 45 tigers and 60 leopards.'
    unit: animals
  activity:
    type: sort
    prompt: Compare the two numbers.
    bins:
    - First is bigger (>)
    - First is smaller (<)
    - Both the same (=)
    items:
    - label: 4,210 and 4,201
      bin: First is bigger (>)
      clue: Thousands and hundreds match. Look at the tens.
      why: 1 ten beats 0 tens.
    - label: 800 and 80
      bin: First is bigger (>)
      clue: Count the digits.
      why: 800 has more digits.
    - label: 1,000 and 999
      bin: First is bigger (>)
      clue: Which has 4 digits?
      why: 1,000 > 999.
    - label: 350 and 530
      bin: First is smaller (<)
      clue: Look at the hundreds first.
      why: 3 hundreds < 5 hundreds.
    - label: 45 and 54
      bin: First is smaller (<)
      clue: Look at the tens.
      why: 4 tens < 5 tens.
    - label: 999 and 1,000
      bin: First is smaller (<)
      clue: Which has fewer digits?
      why: 999 < 1,000.
    - label: Half of 50 and 25
      bin: Both the same (=)
      clue: Work out half of 50.
      why: 25 = 25.
    - label: Double 12 and 24
      bin: Both the same (=)
      clue: Work out double 12.
      why: 24 = 24.
  items:
  - prompt: 'Which sign makes this true: 120 ___ 45?'
    options:
    - '>'
    - <
    - '='
    - +
    answer: '>'
    difficulty: 1
    hints:
    - Which is bigger?
    - 120 is bigger.
    solution: 120 > 45.
    mistakes: {"<": "m4_greater"}
  - prompt: A park has 120 elephants and 45 tigers. How many more elephants than tigers?
    answer: '75'
    check: 120-45
    difficulty: 1
    hints:
    - Difference.
    - 120 − 45.
    solution: 120 − 45 = 75.
    mistakes: {"165": "m5_subtract_borrow", "85": "m5_subtract_borrow"}
  - prompt: What is double 450?
    answer: '900'
    check: 450*2
    difficulty: 1
    hints:
    - 450 + 450.
    - 450 × 2.
    solution: 450 × 2 = 900.
    mistakes:
      '225': c4_double
  - prompt: What is half of 60?
    answer: '30'
    check: 60/2
    difficulty: 1
    hints:
    - 60 ÷ 2.
    - Split equally.
    solution: 60 ÷ 2 = 30.
    mistakes: {"20": "m4_half", "120": "m4_half"}
  - prompt: Elephants 120, tigers 45, leopards 60. How many animals in all?
    answer: '225'
    check: 120+45+60
    difficulty: 2
    hints:
    - Add all three.
    - 120 + 45 + 60.
    solution: 120 + 45 + 60 = 225.
    mistakes: {"215": "m5_add_carry", "165": "m5_add_carry"}
  - prompt: Which number is smallest?
    options:
    - 1,099
    - 1,909
    - 1,990
    - 9,011
    answer: 1,099
    difficulty: 2
    hints:
    - Compare place by place.
    - Same thousands, look at hundreds.
    solution: 1,099 has 0 hundreds, so it is smallest.
    mistakes: {"1,909": "m4_smallest"}
- code: cbse4m.animals.measure
  title: Big animal measurements
  after:
  - cbse4m.animals.compare
  notes: |
    An elephant eats about 150 kg of food a day; drinks about 100 L of water. A tiger can leap about 6 m. Multiply for
    many days: 150 kg × 7 = 1,050 kg in a week. Compare lengths and weights in the same unit.
  explanations:
    text: Big animals need lots of food. If an elephant eats 150 kg in one day, in a week it eats 7 times as much. Multiply to find totals for many days.
    visual: 'Draw an elephant with a speech bubble: ''150 kg of food a day!'' and a calendar with 7 days.'
    step_by_step: 'Step 1: Find the amount for one day. Step 2: Count the days. Step 3: Multiply.'
    real_world: Elephant camps like those in Kerala and Karnataka prepare huge amounts of food each day.
  picture:
    kind: flow
    steps:
    - '1 day: 150 kg'
    - × 7 days
    - = 1,050 kg in a week
    alt: An elephant eating 150 kilograms a day eats 1,050 kilograms in 7 days.
  activity:
    type: formula
    prompt: An elephant eats 150 kg of food a day. Set the number of days.
    inputs:
    - name: d
      label: Days
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: tot
      label: Food eaten
      expr: 150*d
      unit: kg
    goals:
    - prompt: How much in one week?
      want:
        d: 7
      mistakes:
      - when:
          d: 5
        say: A week has 7 days, not 5.
    - prompt: How many days to eat 1,500 kg?
      want:
        tot: 1500
      mistakes:
      - when:
          d: 15
        say: 1500 ÷ 100 = 15, but it eats 150 kg a day, not 100.
    - prompt: How much in two weeks?
      want:
        d: 14
      mistakes:
      - when:
          d: 2
        say: 2 days isn't 2 weeks. Each week has 7 days.
  items:
  - prompt: An elephant eats 150 kg of food a day. How many kg in 2 days?
    answer: '300'
    check: 150*2
    difficulty: 1
    hints:
    - 150 × 2.
    - Double.
    solution: 150 × 2 = 300 kg.
    mistakes: {"152": "m5_times_carry", "250": "m5_times_carry"}
  - prompt: An elephant drinks 100 L of water a day. How many litres in 5 days?
    answer: '500'
    check: 100*5
    difficulty: 1
    hints:
    - 100 × 5.
    - Add a zero ...
    solution: 100 × 5 = 500 L.
    mistakes: {"105": "m5_times_carry", "50": "m5_times_carry"}
  - prompt: A tiger leaps 6 m. How far in 4 leaps, in m?
    answer: '24'
    check: 6*4
    difficulty: 1
    hints:
    - 6 × 4.
    - Same leap each time.
    solution: 6 × 4 = 24 m.
    mistakes: {"10": "m5_times_table", "20": "m5_times_table"}
  - prompt: A baby elephant weighs 120 kg. Its mother weighs 3,000 kg. How many kg heavier is the mother?
    answer: '2880'
    check: 3000-120
    difficulty: 2
    hints:
    - 3000 − 120.
    - Subtract.
    solution: 3,000 − 120 = 2,880 kg.
    mistakes: {"3120": "m5_subtract_borrow", "2980": "m5_subtract_borrow"}
  - prompt: An elephant eats 150 kg a day. How many kg in a week (7 days)?
    answer: '1050'
    check: 150*7
    difficulty: 2
    hints:
    - 150 × 7.
    - 100 × 7 + 50 × 7.
    solution: 150 × 7 = 1,050 kg.
    mistakes: {"157": "m5_times_carry", "750": "m5_times_carry"}
  - prompt: Which animal is heaviest?
    options:
    - elephant
    - leopard
    - tiger
    - deer
    answer: elephant
    difficulty: 1
    hints:
    - Largest land animal.
    - Big ears.
    solution: The elephant is heaviest.
    mistakes: {"tiger": "m4_heaviest"}
