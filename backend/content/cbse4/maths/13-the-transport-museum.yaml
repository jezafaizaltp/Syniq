# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 13. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 13
title: The Transport Museum
tips:
  c4_fare: Total fare = fare for one person × number of people.
  m4_auto_wheels: "An auto-rickshaw has one wheel in front and two at the back."
  m4_hours_count: "Count on from 8:00 to 11:00, one hour at a time."
  m4_timetable: "A timetable lists times. For buses and trains, which times?"
  m4_wheels_total: "Cars have 4 wheels and bicycles 2. Work out each group, then add."
concepts:
- code: cbse4m.trans.multiply
  title: Tickets, fares and seats
  notes: |
    Multiply for many people or rows: museum ticket ₹25 × 6 children = ₹150. Seats: a bus with 12 rows of 4 seats = 48.
    Divide to share: 48 children in buses of 16 = 3 buses. Read tables of vehicles and wheels: car 4, bicycle 2,
    auto-rickshaw 3.
  explanations:
    text: At the transport museum we see old and new vehicles. To find the cost of tickets for a group, multiply the price of one ticket by the number of people. To count seats, multiply rows by seats in a row.
    visual: 'Draw a bus with 12 rows and 4 seats in each row. Count: 4, 8, 12 ... 48.'
    step_by_step: 'Step 1: Find the amount for one. Step 2: Find how many. Step 3: Multiply (or divide to share).'
    real_world: Railway and transport museums show steam engines, old cars and bullock carts.
  picture:
    kind: compare
    columns:
    - title: Vehicle
      points:
      - Bicycle
      - Auto-rickshaw
      - Car
    - title: Wheels
      points:
      - '2'
      - '3'
      - '4'
    alt: A bicycle has 2 wheels, an auto-rickshaw 3, and a car 4.
  activity:
    type: formula
    prompt: Museum tickets cost ₹15 each. Set how many people go.
    inputs:
    - name: n
      label: People
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: tot
      label: Total cost
      expr: 15*n
      unit: ₹
    goals:
    - prompt: The tickets cost ₹120 in all.
      want:
        tot: 120
      mistakes:
      - when:
          n: 12
        say: 120 ÷ 10? Each ticket is ₹15, not ₹10.
    - prompt: The tickets cost ₹180 in all.
      want:
        tot: 180
      mistakes:
      - when:
          n: 18
        say: 180 ÷ 10? Each ticket is ₹15.
    - prompt: The tickets cost ₹300 in all.
      want:
        tot: 300
      mistakes:
      - when:
          n: 15
        say: 15 × 15 = 225, not 300. How many 15s make 300?
  items:
  - prompt: A museum ticket costs ₹25. How much for 6 children in rupees?
    answer: '150'
    check: 25*6
    difficulty: 1
    hints:
    - 25 × 6.
    - Six 25s.
    solution: 25 × 6 = ₹150.
    mistakes: {"31": "m5_times_carry", "120": "m5_times_carry"}
  - prompt: A bus has 12 rows of 4 seats. How many seats?
    answer: '48'
    check: 12*4
    difficulty: 1
    hints:
    - 12 × 4.
    - Count by 4s.
    solution: 12 × 4 = 48.
    mistakes: {"16": "m5_times_carry", "36": "m5_times_carry"}
  - prompt: 48 children go in buses of 16. How many buses?
    answer: '3'
    check: 48/16
    difficulty: 2
    hints:
    - 48 ÷ 16.
    - 16 + 16 + 16.
    solution: 48 ÷ 16 = 3.
    mistakes: {"4": "m5_divide_check", "32": "m5_divide_check"}
  - prompt: How many wheels do 5 auto-rickshaws have?
    answer: '15'
    check: 3*5
    difficulty: 1
    hints:
    - An auto has 3 wheels.
    - 3 × 5.
    solution: 3 × 5 = 15.
    mistakes: {"10": "m4_auto_wheels", "20": "m4_auto_wheels"}
  - prompt: How many wheels do 4 cars and 3 bicycles have altogether?
    answer: '22'
    check: 4*4+3*2
    difficulty: 2
    hints:
    - 'Cars: 4 × 4. Bicycles: 3 × 2.'
    - 16 + 6.
    solution: 16 + 6 = 22 wheels.
    mistakes: {"14": "m4_wheels_total", "28": "m4_wheels_total"}
  - prompt: A train has 8 coaches with 72 seats each. How many seats?
    answer: '576'
    check: 72*8
    difficulty: 2
    hints:
    - 72 × 8.
    - 70 × 8 + 2 × 8.
    solution: 72 × 8 = 576.
    mistakes:
      '80': c4_fare
- code: cbse4m.trans.time
  title: Journeys and timetables
  after:
  - cbse4m.trans.multiply
  notes: |
    Timetables show when buses and trains leave and arrive. Journey time = arrival − departure (8:15 to 10:45 = 2 h
    30 min). Distance travelled = speed × time (40 km each hour for 3 hours = 120 km).
  explanations:
    text: A timetable tells when a bus or train leaves and arrives. To find how long the journey takes, count from the leaving time to the arriving time.
    visual: 'Draw a timetable: Bus A leaves 8:15, arrives 10:45. Draw a line from 8:15 to 10:15 (2 hours), then 30 minutes more.'
    step_by_step: 'Step 1: Note the leaving time. Step 2: Count whole hours. Step 3: Add the extra minutes.'
    real_world: Railway stations show timetables on big boards; buses in Kerala list their times at bus stands.
  picture:
    kind: number_line
    from: 0
    to: 150
    step: 30
    points:
    - at: 0
      label: '8:15'
    - at: 120
      label: '10:15'
    - at: 150
      label: '10:45'
    alt: 'From 8:15, two hours brings you to 10:15 and 30 more minutes to 10:45: 150 minutes in all.'
    jumps:
    - from: 0
      to: 120
      label: 2 h
    - from: 120
      to: 150
      label: 30 min
  activity:
    type: number_line
    min: 0
    max: 180
    step: 5
    start: 0
    prompt: Count up from leaving to arriving. Mark how many minutes the journey takes.
    goals:
    - prompt: A bus leaves at 8:00 and arrives at 9:30.
      target: 90
      mistakes:
      - when:
          v: 130
        say: 9:30 − 8:00 like ordinary numbers gives 130, but an hour is 60 minutes.
      - when:
          v: 30
        say: That's just the 30 minutes. There is a whole hour too.
    - prompt: A train leaves at 10:15 and arrives at 11:00.
      target: 45
      mistakes:
      - when:
          v: 85
        say: 1100 − 1015 treats an hour as 100 minutes. 10:15 to 11:00 is 45 minutes.
    - prompt: A boat leaves at 2:30 and arrives at 5:00.
      target: 150
      mistakes:
      - when:
          v: 120
        say: 'Count up: 2:30 to 4:30 is 2 hours, then 30 more minutes.'
  items:
  - prompt: A bus leaves at 8:00 and arrives at 11:00. How many hours is the journey?
    answer: '3'
    check: 11-8
    difficulty: 1
    hints:
    - Count 8 → 9 → 10 → 11.
    - Hours.
    solution: 3 hours.
    mistakes: {"19": "m4_hours_count", "4": "m4_hours_count"}
  - prompt: A train leaves at 8:15 and arrives at 10:45. How many minutes is the journey?
    answer: '150'
    check: 2*60+30
    difficulty: 2
    hints:
    - 8:15 to 10:15 is 2 hours.
    - 120 + 30.
    solution: 2 h 30 min = 150 minutes.
    mistakes: {"230": "m5_time_minutes", "90": "m5_time_minutes"}
  - prompt: A bus goes 40 km each hour. How far in 3 hours, in km?
    answer: '120'
    check: 40*3
    difficulty: 1
    hints:
    - 40 × 3.
    - Each hour 40 km.
    solution: 40 × 3 = 120 km.
    mistakes: {"43": "m5_times_carry", "80": "m5_times_carry"}
  - prompt: 'A timetable tells you:'
    options:
    - when buses or trains leave and arrive
    - the price of food
    - the weather
    - the height of a bus
    answer: when buses or trains leave and arrive
    difficulty: 1
    hints:
    - Time + table.
    - Departures.
    solution: A timetable lists departure and arrival times.
    mistakes: {"the weather": "m4_timetable"}
  - prompt: A cycle ride starts at 4:30 p.m. and ends at 5:15 p.m. How many minutes?
    answer: '45'
    check: 30+15
    difficulty: 2
    hints:
    - 4:30 to 5:00 is 30.
    - Plus 15.
    solution: 30 + 15 = 45 minutes.
    mistakes: {"85": "m5_time_minutes", "75": "m5_time_minutes"}
  - prompt: An auto goes 20 km in one hour. How many hours to go 60 km?
    answer: '3'
    check: 60/20
    difficulty: 2
    hints:
    - 60 ÷ 20.
    - 20 + 20 + 20.
    solution: 60 ÷ 20 = 3 hours.
    mistakes: {"40": "m5_divide_check", "1200": "m5_divide_check"}
