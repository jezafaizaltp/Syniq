# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 13. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 13
title: The Transport Museum
tips:
  c4_fare: Total fare = fare for one person × number of people.
  m4_auto_wheels: "An auto-rickshaw has one wheel in front and two at the back."
  m4_hours_count: "Count on from 8:00 to 11:00, one hour at a time."
  m4_timetable: "A timetable lists times. For buses and trains, which times?"
  m4_wheels_total: "Cars have 4 wheels and bicycles 2. Work out each group, then add."
  c4m13_groups: 'Same number for each person, row or vehicle: multiply. Splitting into equal groups: divide.'
  c4m13_wheels: Write each vehicle's wheels first, multiply for each kind, then add the kinds together.
  c4m13_time: Count on from the start time to the next full hour, then on to the end time.
concepts:
- code: cbse4m.trans.multiply
  title: Tickets, fares and seats
  notes: |
    Multiply for many people or rows: museum ticket ₹25 × 6 children = ₹150. Seats: a bus with 12 rows of 4 seats = 48.
    Divide to share: 48 children in buses of 16 = 3 buses. Read tables of vehicles and wheels: car 4, bicycle 2,
    auto-rickshaw 3.
  explanations:
    text: At the transport museum we see old and new vehicles. To find the cost of tickets for a group, multiply the price of one ticket by the number of people. To count seats, multiply rows by seats in a row.
    visual: 'Draw a bus with 12 rows and 4 seats in each row. Count: 4, 8, 12 ... 48.'
    step_by_step: 'Step 1: Find the amount for one. Step 2: Find how many. Step 3: Multiply (or divide to share).'
    real_world: Railway and transport museums show steam engines, old cars and bullock carts.
  picture:
    kind: compare
    columns:
    - title: Vehicle
      points:
      - Bicycle
      - Auto-rickshaw
      - Car
    - title: Wheels
      points:
      - '2'
      - '3'
      - '4'
    alt: A bicycle has 2 wheels, an auto-rickshaw 3, and a car 4.
  activity:
    type: formula
    prompt: Museum tickets cost ₹15 each. Set how many people go.
    inputs:
    - name: n
      label: People
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: tot
      label: Total cost
      expr: 15*n
      unit: ₹
    goals:
    - prompt: The tickets cost ₹120 in all.
      want:
        tot: 120
      mistakes:
      - when:
          n: 12
        say: 120 ÷ 10? Each ticket is ₹15, not ₹10.
    - prompt: The tickets cost ₹180 in all.
      want:
        tot: 180
      mistakes:
      - when:
          n: 18
        say: 180 ÷ 10? Each ticket is ₹15.
    - prompt: The tickets cost ₹300 in all.
      want:
        tot: 300
      mistakes:
      - when:
          n: 15
        say: 15 × 15 = 225, not 300. How many 15s make 300?
  lesson:
    - teach: 'At a transport museum, many things come in equal groups. A ticket of ₹25 for 6 children: ₹25 × 6 = ₹150. A bus with 12 rows of 4 seats: 12 × 4 = 48 seats.'
      check:
        prompt: A van has 5 rows of 3 seats. How many seats?
        options:
        - '15'
        - '8'
        - '53'
        answer: '15'
        why: 5 × 3 = 15.
      ways:
      - style: visual
        teach: Equal groups at a transport museum, worked out by multiplying.
        picture:
          kind: compare
          columns:
          - title: Groups
            points:
            - 7 tickets of ₹20
            - 11 rows of 4 seats
          - title: Multiply
            points:
            - 20 × 7 = ₹140
            - 11 × 4 = 44 seats
          alt: 7 tickets of ₹20 cost 20 × 7 = ₹140. 11 rows of 4 seats make 11 × 4 = 44 seats.
      - style: real_world
        teach: 'Bus conductors used to carry a ticket book and add up the fares for a whole family by multiplying: 5 people at ₹12 each is ₹60, faster than adding 12 five times.'
    - teach: 'Different vehicles have different numbers of wheels: bicycle 2, auto-rickshaw 3, car 4. For a mix, multiply each kind and then add.'
      picture:
        kind: bars
        unit: wheels
        bars:
        - label: bicycle
          value: 2
        - label: auto-rickshaw
          value: 3
        - label: car
          value: 4
        alt: Wheels on a bicycle (2), an auto-rickshaw (3) and a car (4).
      check:
        prompt: How many wheels do 2 cars and 1 bicycle have?
        options:
        - '10'
        - '6'
        - '8'
        answer: '10'
        why: 2 × 4 = 8, plus 2 = 10.
      ways:
      - style: step_by_step
        teach: 'Count wheels for a mix of vehicles. Step 1: Write each kind: 2 cars, 3 autos, 4 bicycles. Step 2: Cars: 2 × 4 = 8. Autos: 3 × 3 = 9. Bicycles: 4 × 2 = 8. Step 3: Add: 8 + 9 + 8 = 25 wheels.'
      - style: real_world
        teach: In a parking lot you might see scooters with 2 wheels, autos with 3, cars with 4 and trucks with 6 or more. Counting wheels quickly means remembering each number first.
    - teach: 'To share people into vehicles, divide. 48 children in buses of 16 seats: 48 ÷ 16 = 3 buses. If it does not divide exactly, you need one more vehicle for the leftover people.'
      check:
        prompt: 50 children, buses of 16 seats. How many buses so nobody is left out?
        options:
        - '4'
        - '3'
        - '5'
        answer: '4'
        why: 3 buses take 48; 2 are left, so 1 more bus.
      ways:
      - style: visual
        teach: Sharing 50 children into vans of 11, with one more van for the leftover children.
        picture:
          kind: bars
          bars:
          - label: Van 1
            value: 11
          - label: Van 2
            value: 11
          - label: Van 3
            value: 11
          - label: Van 4
            value: 11
          - label: Van 5
            value: 6
          alt: '50 children in vans of 11: four vans hold 44 children, and the 6 left over need a fifth van.'
      - style: real_world
        teach: When a school plans a trip, it always rounds up the number of buses. Leaving even one child behind is not an option, so a part-full bus still counts as one more bus.
  items:
  - prompt: A museum ticket costs ₹25. How much for 6 children in rupees?
    answer: '150'
    check: 25*6
    difficulty: 1
    hints:
    - 25 × 6.
    - Six 25s.
    solution: 25 × 6 = ₹150.
    mistakes: {"31": "m5_times_carry", "120": "m5_times_carry"}
  - prompt: A bus has 12 rows of 4 seats. How many seats?
    answer: '48'
    check: 12*4
    difficulty: 1
    hints:
    - 12 × 4.
    - Count by 4s.
    solution: 12 × 4 = 48.
    mistakes: {"16": "m5_times_carry", "36": "m5_times_carry"}
  - prompt: 48 children go in buses of 16. How many buses?
    answer: '3'
    check: 48/16
    difficulty: 2
    hints:
    - 48 ÷ 16.
    - 16 + 16 + 16.
    solution: 48 ÷ 16 = 3.
    mistakes: {"4": "m5_divide_check", "32": "m5_divide_check"}
  - prompt: How many wheels do 5 auto-rickshaws have?
    answer: '15'
    check: 3*5
    difficulty: 1
    hints:
    - An auto has 3 wheels.
    - 3 × 5.
    solution: 3 × 5 = 15.
    mistakes: {"10": "m4_auto_wheels", "20": "m4_auto_wheels"}
  - prompt: How many wheels do 4 cars and 3 bicycles have altogether?
    answer: '22'
    check: 4*4+3*2
    difficulty: 2
    hints:
    - 'Cars: 4 × 4. Bicycles: 3 × 2.'
    - 16 + 6.
    solution: 16 + 6 = 22 wheels.
    mistakes: {"14": "m4_wheels_total", "28": "m4_wheels_total"}
  - prompt: A train has 8 coaches with 72 seats each. How many seats?
    answer: '576'
    check: 72*8
    difficulty: 2
    hints:
    - 72 × 8.
    - 70 × 8 + 2 × 8.
    solution: 72 × 8 = 576.
    mistakes:
      '80': c4_fare
  - prompt: A museum ticket costs ₹30. How much for 8 children in rupees?
    answer: '240'
    check: 30*8
    difficulty: 1
    hints:
    - 'Same price for each: multiply.'
    - 3 × 8, then add a zero.
    solution: 'Step 1: 3 × 8 = 24. Step 2: 30 × 8 = ₹240.'
    mistakes:
      '38': c4m13_groups
      '200': c4m13_groups
      '248': c4m13_groups
  - prompt: How many wheels do 6 bicycles have?
    answer: '12'
    check: 6*2
    difficulty: 1
    hints:
    - A bicycle has 2 wheels.
    - 6 × 2.
    solution: 'Step 1: 2 wheels each. Step 2: 6 × 2 = 12.'
    mistakes:
      '8': c4m13_wheels
      '6': c4m13_wheels
      '24': c4m13_wheels
  - prompt: How many wheels do 3 cars and 4 auto-rickshaws have altogether?
    answer: '24'
    check: 3*4+4*3
    difficulty: 3
    hints:
    - Cars have 4 wheels; autos have 3.
    - Find each total, then add.
    solution: 'Step 1: 3 cars × 4 = 12; 4 autos × 3 = 12. Step 2: 12 + 12 = 24.'
    mistakes:
      '7': c4m13_wheels
      '28': c4m13_wheels
      '21': c4m13_wheels
  - prompt: 72 visitors ride in groups of 9 on a toy train. How many rides?
    answer: '8'
    check: 72//9
    difficulty: 2
    hints:
    - How many 9s make 72?
    - Use the 9 times table.
    solution: 'Step 1: 72 ÷ 9. Step 2: = 8 rides.'
    mistakes:
      '63': c4m13_groups
      '81': c4m13_groups
      '9': c4m13_groups
  - prompt: A plane has 30 rows of 6 seats. How many seats?
    answer: '180'
    check: 30*6
    difficulty: 2
    hints:
    - Rows × seats in each row.
    - 3 × 6, then add a zero.
    solution: 'Step 1: 3 × 6 = 18. Step 2: 30 × 6 = 180.'
    mistakes:
      '36': c4m13_groups
      '18': c4m13_groups
      '1800': c4m13_groups
  - prompt: A train has 10 coaches. Each coach has 64 seats. How many seats?
    answer: '640'
    check: 64*10
    difficulty: 2
    hints:
    - Multiplying by 10 adds a zero.
    - 64 × 10.
    solution: 'Step 1: 64 × 10. Step 2: = 640.'
    mistakes:
      '74': c4m13_groups
      '6400': c4m13_groups
      '604': c4m13_groups
  - prompt: A parking lot has only cars. There are 28 wheels. How many cars?
    answer: '7'
    check: 28//4
    difficulty: 3
    hints:
    - Each car has 4 wheels.
    - How many 4s make 28?
    solution: 'Step 1: 28 ÷ 4. Step 2: = 7 cars.'
    mistakes:
      '24': c4m13_wheels
      '14': c4m13_wheels
      '112': c4m13_wheels
  - prompt: Bus fare is ₹15 a person. A family of 5 goes and comes back by bus. Total fare in rupees?
    answer: '150'
    check: 15*5*2
    difficulty: 3
    hints:
    - Find the fare for 5 people one way.
    - Going and coming back doubles it.
    solution: 'Step 1: 15 × 5 = ₹75 one way. Step 2: 75 × 2 = ₹150.'
    mistakes:
      '75': c4m13_groups
      '20': c4m13_groups
      '30': c4m13_groups
  - prompt: 'Which needs more wheels: 5 auto-rickshaws or 4 cars?'
    options:
    - 4 cars
    - 5 auto-rickshaws
    - both need the same
    answer: 4 cars
    difficulty: 2
    hints:
    - Find 5 × 3.
    - Find 4 × 4 and compare.
    solution: 'Step 1: 5 autos × 3 = 15 wheels; 4 cars × 4 = 16 wheels. Step 2: 16 > 15, so 4 cars need more.'
    mistakes:
      5 auto-rickshaws: c4m13_wheels
      both need the same: c4m13_wheels
  - prompt: 'Case: A museum car park has 5 cars, 1 auto-rickshaw and 2 bicycles. How many wheels are there altogether?'
    options:
    - '27'
    - '8'
    - '24'
    answer: '27'
    hints:
    - Write the wheels for each kind of vehicle first.
    - Multiply for each kind, then add.
    solution: 'Cars: 5 × 4 = 20. Auto: 1 × 3 = 3. Bicycles: 2 × 2 = 4. 20 + 3 + 4 = 27 wheels.'
    mistakes:
      '8': c4m13_wheels
      '24': c4m13_wheels
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are planning a trip for 34 children. Each van takes 8 children. How many vans should you book?'
    options:
    - '5'
    - '4'
    - '6'
    answer: '5'
    hints:
    - How many full vans of 8 can you make from 34?
    - What happens to the children left over?
    solution: 4 vans hold 32 children, and 2 are left over. They need one more van, so book 5.
    mistakes:
      '4': c4m13_groups
      '6': c4m13_groups
    exam: competency
    difficulty: 2
- code: cbse4m.trans.time
  title: Journeys and timetables
  after:
  - cbse4m.trans.multiply
  notes: |
    Timetables show when buses and trains leave and arrive. Journey time = arrival − departure (8:15 to 10:45 = 2 h
    30 min). Distance travelled = speed × time (40 km each hour for 3 hours = 120 km).
  explanations:
    text: A timetable tells when a bus or train leaves and arrives. To find how long the journey takes, count from the leaving time to the arriving time.
    visual: 'Draw a timetable: Bus A leaves 8:15, arrives 10:45. Draw a line from 8:15 to 10:15 (2 hours), then 30 minutes more.'
    step_by_step: 'Step 1: Note the leaving time. Step 2: Count whole hours. Step 3: Add the extra minutes.'
    real_world: Railway stations show timetables on big boards; buses in Kerala list their times at bus stands.
  picture:
    kind: number_line
    from: 0
    to: 150
    step: 30
    points:
    - at: 0
      label: '8:15'
    - at: 120
      label: '10:15'
    - at: 150
      label: '10:45'
    alt: 'From 8:15, two hours brings you to 10:15 and 30 more minutes to 10:45: 150 minutes in all.'
    jumps:
    - from: 0
      to: 120
      label: 2 h
    - from: 120
      to: 150
      label: 30 min
  activity:
    type: number_line
    min: 0
    max: 180
    step: 5
    start: 0
    prompt: Count up from leaving to arriving. Mark how many minutes the journey takes.
    goals:
    - prompt: A bus leaves at 8:00 and arrives at 9:30.
      target: 90
      mistakes:
      - when:
          v: 130
        say: 9:30 − 8:00 like ordinary numbers gives 130, but an hour is 60 minutes.
      - when:
          v: 30
        say: That's just the 30 minutes. There is a whole hour too.
    - prompt: A train leaves at 10:15 and arrives at 11:00.
      target: 45
      mistakes:
      - when:
          v: 85
        say: 1100 − 1015 treats an hour as 100 minutes. 10:15 to 11:00 is 45 minutes.
    - prompt: A boat leaves at 2:30 and arrives at 5:00.
      target: 150
      mistakes:
      - when:
          v: 120
        say: 'Count up: 2:30 to 4:30 is 2 hours, then 30 more minutes.'
  lesson:
    - teach: A timetable lists when buses or trains leave (departure) and reach (arrival). Journey time = arrival time − departure time.
      check:
        prompt: A bus leaves at 9:00 and arrives at 12:00. How long is the journey?
        options:
        - 3 hours
        - 21 hours
        - 9 hours
        answer: 3 hours
        why: 9 to 12 is 3 hours.
      ways:
      - style: visual
        teach: Reading a simple timetable row and finding the journey time.
        picture:
          kind: compare
          columns:
          - title: Departure
            points:
            - '7:20'
          - title: Arrival
            points:
            - '10:05'
          - title: Journey time
            points:
            - 2 h 45 min
          alt: A train departs at 7:20 and arrives at 10:05. The journey time is 2 hours 45 minutes.
      - style: real_world
        teach: Railway stations have big boards showing each train's departure and arrival times. Travellers check them to know when to reach the platform and when to expect to arrive.
    - teach: 'When minutes are not round, count on in two jumps: 8:15 to 10:00 is 1 h 45 min, then 10:00 to 10:45 is 45 min more: 2 h 30 min, or 150 minutes.'
      picture:
        kind: flow
        steps:
        - 8:15 departure
        - 'to 9:00: 45 min'
        - 'to 10:00: 1 h'
        - 'to 10:45: 45 min'
        - total 2 h 30 min
        alt: 'Counting on from 8:15 to 10:45 in jumps: 45 min, 1 hour, 45 min.'
      check:
        prompt: How many minutes from 4:40 to 5:10?
        options:
        - '30'
        - '70'
        - '50'
        answer: '30'
        why: 20 minutes to 5:00, then 10 more.
      ways:
      - style: step_by_step
        teach: 'Find the time from 6:50 to 9:25. Step 1: From 6:50 to 7:00 is 10 minutes. Step 2: From 7:00 to 9:00 is 2 hours. Step 3: From 9:00 to 9:25 is 25 minutes. Step 4: Total: 2 hours 35 minutes, or 155 minutes.'
      - style: real_world
        teach: 'When you know how long a journey takes, you can plan backwards: to reach a wedding by 11:00 with a 2-hour drive, the family must leave by 9:00.'
    - teach: 'Distance = speed × time. A bus that goes 40 km each hour travels 40 × 3 = 120 km in 3 hours. To find the time, divide: 120 km ÷ 40 km per hour = 3 hours.'
      check:
        prompt: A car goes 50 km each hour. How far in 2 hours?
        options:
        - 100 km
        - 52 km
        - 25 km
        answer: 100 km
        why: 50 × 2 = 100.
      ways:
      - style: visual
        teach: Distance covered by a bus that goes 25 km each hour.
        picture:
          kind: bars
          unit: km
          bars:
          - label: 1 hour
            value: 25
          - label: 2 hours
            value: 50
          - label: 3 hours
            value: 75
          alt: A bus going 25 km each hour covers 25 km in 1 hour, 50 km in 2 hours and 75 km in 3 hours.
      - style: real_world
        teach: A cyclist who rides about 15 km each hour can plan a 30 km ride to take about 2 hours. Hills or wind can make it slower, so riders add a little extra time.
  items:
  - prompt: A bus leaves at 8:00 and arrives at 11:00. How many hours is the journey?
    answer: '3'
    check: 11-8
    difficulty: 1
    hints:
    - Count 8 → 9 → 10 → 11.
    - Hours.
    solution: 3 hours.
    mistakes: {"19": "m4_hours_count", "4": "m4_hours_count"}
  - prompt: A train leaves at 8:15 and arrives at 10:45. How many minutes is the journey?
    answer: '150'
    check: 2*60+30
    difficulty: 2
    hints:
    - 8:15 to 10:15 is 2 hours.
    - 120 + 30.
    solution: 2 h 30 min = 150 minutes.
    mistakes: {"230": "m5_time_minutes", "90": "m5_time_minutes"}
  - prompt: A bus goes 40 km each hour. How far in 3 hours, in km?
    answer: '120'
    check: 40*3
    difficulty: 1
    hints:
    - 40 × 3.
    - Each hour 40 km.
    solution: 40 × 3 = 120 km.
    mistakes: {"43": "m5_times_carry", "80": "m5_times_carry"}
  - prompt: 'A timetable tells you:'
    options:
    - "when buses or trains leave and arrive"
    - "the price of food sold at the station"
    - "what the weather will be like today"
    - "how tall each bus or train is"
    answer: when buses or trains leave and arrive
    difficulty: 1
    hints:
    - Time + table.
    - Departures.
    solution: A timetable lists departure and arrival times.
    mistakes: {"what the weather will be like today": "m4_timetable"}
  - prompt: A cycle ride starts at 4:30 p.m. and ends at 5:15 p.m. How many minutes?
    answer: '45'
    check: 30+15
    difficulty: 2
    hints:
    - 4:30 to 5:00 is 30.
    - Plus 15.
    solution: 30 + 15 = 45 minutes.
    mistakes: {"85": "m5_time_minutes", "75": "m5_time_minutes"}
  - prompt: An auto goes 20 km in one hour. How many hours to go 60 km?
    answer: '3'
    check: 60/20
    difficulty: 2
    hints:
    - 60 ÷ 20.
    - 20 + 20 + 20.
    solution: 60 ÷ 20 = 3 hours.
    mistakes: {"40": "m5_divide_check", "1200": "m5_divide_check"}
  - prompt: A train leaves at 6:30 and arrives at 9:30. How many hours is the journey?
    answer: '3'
    check: 9-6
    difficulty: 1
    hints:
    - Both times end in :30.
    - Count the hours from 6 to 9.
    solution: 'Step 1: 6:30 → 9:30. Step 2: 3 hours.'
    mistakes:
      '4': c4m13_time
      '15': c4m13_time
      '2': c4m13_time
  - prompt: A bus leaves at 7:45 and arrives at 9:15. How many minutes is the journey?
    answer: '90'
    check: 15+60+15
    difficulty: 3
    hints:
    - 7:45 to 8:00 first.
    - Then 8:00 to 9:00, then to 9:15.
    solution: 'Step 1: 15 + 60 + 15. Step 2: = 90 minutes.'
    mistakes:
      '130': c4m13_time
      '70': c4m13_time
      '150': c4m13_time
  - prompt: A train goes 60 km each hour. How far in 4 hours?
    answer: '240'
    check: 60*4
    difficulty: 2
    hints:
    - Distance = speed × time.
    - 6 × 4, then add a zero.
    solution: 'Step 1: 60 × 4. Step 2: = 240 km.'
    mistakes:
      '64': c4m13_groups
      '15': c4m13_groups
      '200': c4m13_groups
  - prompt: A cycle goes 10 km each hour. How many hours to go 50 km?
    answer: '5'
    check: 50//10
    difficulty: 2
    hints:
    - How many 10s make 50?
    - Time = distance ÷ speed.
    solution: 'Step 1: 50 ÷ 10. Step 2: = 5 hours.'
    mistakes:
      '500': c4m13_groups
      '40': c4m13_groups
      '60': c4m13_groups
  - prompt: Bus 1 leaves at 9:10, bus 2 at 9:40. How many minutes apart are they?
    answer: '30'
    check: 40-10
    difficulty: 1
    hints:
    - Both are in the 9 o'clock hour.
    - Subtract the minutes.
    solution: 'Step 1: 40 − 10. Step 2: = 30 minutes.'
    mistakes:
      '50': c4m13_time
      '20': c4m13_time
  - prompt: A journey takes 2 hours 15 minutes. How many minutes is that?
    answer: '135'
    check: 2*60+15
    difficulty: 2
    hints:
    - Change hours into minutes first.
    - Then add the 15.
    solution: 'Step 1: 2 hours = 120 minutes. Step 2: 120 + 15 = 135 minutes.'
    mistakes:
      '215': c4m13_time
      '35': c4m13_time
      '125': c4m13_time
  - prompt: A train leaves at 10:20 a.m. The journey takes 3 hours. When does it arrive?
    options:
    - 1:20 p.m.
    - 1:20 a.m.
    - 12:20 p.m.
    answer: 1:20 p.m.
    difficulty: 3
    hints:
    - Add 3 hours to 10:20.
    - After 12 noon the clock starts again at 1, and it is p.m.
    solution: 'Step 1: 10:20 + 2 h = 12:20 p.m. Step 2: + 1 h = 1:20 p.m.'
    mistakes:
      1:20 a.m.: c4m13_time
      12:20 p.m.: c4m13_time
  - prompt: Which column of a timetable tells you when a train reaches the station?
    options:
    - arrival
    - departure
    - train number
    answer: arrival
    difficulty: 1
    hints:
    - Departure is when it leaves.
    - Which word means to come in?
    solution: 'Step 1: Departure = leaving. Step 2: Arrival = reaching the station.'
    mistakes:
      departure: c4m13_time
      train number: c4m13_time
  - prompt: A bus travels 45 km each hour for 2 hours, then 30 km more. How far altogether?
    answer: '120'
    check: 45*2+30
    difficulty: 3
    hints:
    - 'Distance in the first 2 hours: 45 × 2.'
    - Then add the extra 30.
    solution: 'Step 1: 45 × 2 = 90 km. Step 2: 90 + 30 = 120 km.'
    mistakes:
      '77': c4m13_groups
      '105': c4m13_groups
      '90': c4m13_groups
  - prompt: 'Case: A bus leaves the town at 2:50 p.m. and reaches the museum at 4:35 p.m. How many minutes is the journey?'
    options:
    - 105 minutes
    - 185 minutes
    - 85 minutes
    answer: 105 minutes
    hints:
    - Count on from 2:50 to 3:00, then to 4:00, then to 4:35.
