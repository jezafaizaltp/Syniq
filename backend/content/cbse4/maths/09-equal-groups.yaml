# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 9
title: Equal Groups
tips:
  c4_groups: Multiply when you know the groups and how many in each. Divide when you know the total and need the groups or the share.
  m4_times_10: "Multiplying by 10 puts one zero at the end."
concepts:
- code: cbse4m.groups.mult
  title: Multiplication as equal groups
  notes: |
    Equal groups: 4 groups of 5 = 4 × 5 = 20. Arrays: 3 rows of 6 = 18. Order does not matter: 3 × 6 = 6 × 3. Times
    tables up to 10. Multiply by 10: add a zero. 2-digit × 1-digit: 23 × 4 = 92 (20 × 4 + 3 × 4).
  explanations:
    text: Multiplication is a fast way to add equal groups. 4 plates with 5 laddoos each is 5 + 5 + 5 + 5 = 20, or 4 × 5 = 20.
    visual: 'Draw 4 plates with 5 dots each. Count by fives: 5, 10, 15, 20.'
    step_by_step: 'Step 1: Count the groups. Step 2: Count how many in each group. Step 3: Multiply.'
    real_world: Eggs come in trays of 6 or 12; chairs stand in rows in a hall.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 5
    points:
    - at: 5
      label: '5'
    - at: 10
      label: '10'
    - at: 15
      label: '15'
    - at: 20
      label: '20'
    alt: Four jumps of 5 on a number line reach 20, so 4 times 5 is 20.
    jumps:
    - from: 0
      to: 5
      label: '5'
    - from: 5
      to: 10
      label: '5'
    - from: 10
      to: 15
      label: '5'
    - from: 15
      to: 20
      label: '5'
  activity:
    type: formula
    prompt: Laddoos on plates. Set the plates and the laddoos on each.
    inputs:
    - name: p
      label: Plates
      min: 1
      max: 10
      step: 1
      start: 1
    - name: l
      label: Laddoos on each plate
      min: 1
      max: 20
      step: 1
      start: 1
    outputs:
    - name: tot
      label: Laddoos in all
      expr: p*l
    goals:
    - prompt: 20 laddoos on 4 plates, the same on each.
      want:
        p: 4
        tot: 20
      mistakes:
      - when:
          p: 4
          l: 16
        say: 4 + 16 = 20 adds. 4 plates with the same number each is 4 × that number.
    - prompt: 24 laddoos on 6 plates.
      want:
        p: 6
        tot: 24
      mistakes:
      - when:
          p: 6
          l: 18
        say: 6 + 18 adds. 6 plates of how many make 24?
    - prompt: 30 laddoos on 5 plates.
      want:
        p: 5
        tot: 30
      mistakes:
      - when:
          p: 5
          l:
          - 7
          - 20
        say: 'Too many: 5 × 7 = 35.'
  items:
  - prompt: 4 plates have 5 laddoos each. How many laddoos?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - 4 × 5.
    - 5 + 5 + 5 + 5.
    solution: 4 × 5 = 20.
    mistakes:
      '9': c4_groups
  - prompt: 3 rows of 6 chairs. How many chairs?
    answer: '18'
    check: 3*6
    difficulty: 1
    hints:
    - 3 × 6.
    - 6 + 6 + 6.
    solution: 3 × 6 = 18.
    mistakes: {"9": "m5_times_table", "24": "m5_times_table"}
  - prompt: What is 7 × 8?
    answer: '56'
    check: 7*8
    difficulty: 1
    hints:
    - 7 eights.
    - Times table of 8.
    solution: 7 × 8 = 56.
    mistakes: {"54": "m5_times_table", "15": "m5_times_table"}
  - prompt: What is 23 × 4?
    answer: '92'
    check: 23*4
    difficulty: 2
    hints:
    - 20 × 4 + 3 × 4.
    - 80 + 12.
    solution: 23 × 4 = 92.
    mistakes: {"82": "m5_times_carry", "27": "m5_times_carry"}
  - prompt: What is 15 × 10?
    answer: '150'
    check: 15*10
    difficulty: 1
    hints:
    - Multiplying by 10 adds a zero.
    - 15 then 0.
    solution: 15 × 10 = 150.
    mistakes: {"1500": "m4_times_10", "25": "m4_times_10"}
  - prompt: A tray holds 12 eggs. How many eggs are in 5 trays?
    answer: '60'
    check: 12*5
    difficulty: 2
    hints:
    - 12 × 5.
    - 10 × 5 + 2 × 5.
    solution: 12 × 5 = 60.
    mistakes: {"17": "m5_times_carry", "50": "m5_times_carry"}
- code: cbse4m.groups.div
  title: Division as sharing and grouping
  after:
  - cbse4m.groups.mult
  notes: |
    Division: 20 ÷ 4 = 5 (20 shared among 4, or how many 4s in 20). Division undoes multiplication: 4 × 5 = 20 so
    20 ÷ 4 = 5. Remainders: 17 ÷ 5 = 3 remainder 2.
  explanations:
    text: 'Division splits a total into equal groups. 20 sweets for 4 children: each gets 5, because 4 × 5 = 20. Use your times tables backwards.'
    visual: 'Draw 20 dots and circle groups of 4. Count the circles: 5.'
    step_by_step: 'Step 1: Find the total. Step 2: Find the size of each group (or the number of groups). Step 3: Use the times table backwards.'
    real_world: Putting students into teams, or packing mangoes into boxes.
  picture:
    kind: bars
    bars:
    - label: Team 1
      value: 6
    - label: Team 2
      value: 6
    - label: Team 3
      value: 6
    - label: Team 4
      value: 6
    alt: 24 students split into 4 equal teams gives 6 students in each team.
    unit: students
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Share or group equally. Mark the answer.
    goals:
    - prompt: 20 sweets for 4 children. How many does each get?
      target: 5
      mistakes:
      - when:
          v: 16
        say: '20 − 4 takes away. Share: 4 × ? = 20.'
      - when:
          v: 4
        say: 4 is the number of children.
    - prompt: 18 pencils in boxes of 3. How many boxes?
      target: 6
      mistakes:
      - when:
          v: 15
        say: 18 − 3 takes away once. How many 3s make 18?
      - when:
          v: 3
        say: 3 is how many go in each box.
    - prompt: 35 marbles shared by 5 friends. How many each?
      target: 7
      mistakes:
      - when:
          v: 5
        say: 5 is the number of friends. 5 × ? = 35.
  items:
  - prompt: 20 sweets are shared among 4 children. How many each?
    answer: '5'
    check: 20/4
    difficulty: 1
    hints:
    - 20 ÷ 4.
    - 4 × ? = 20.
    solution: 20 ÷ 4 = 5.
    mistakes: {"4": "m5_share", "80": "m5_share"}
  - prompt: 24 students make teams of 6. How many teams?
    answer: '4'
    check: 24/6
    difficulty: 1
    hints:
    - 24 ÷ 6.
    - 6 × 4 = 24.
    solution: 24 ÷ 6 = 4 teams.
    mistakes: {"6": "m5_divide_check", "30": "m5_divide_check"}
  - prompt: What is 56 ÷ 7?
    answer: '8'
    check: 56/7
    difficulty: 1
    hints:
    - 7 × 8 = 56.
    - Times table backwards.
    solution: 56 ÷ 7 = 8.
    mistakes: {"7": "m5_divide_check", "9": "m5_divide_check"}
  - prompt: 17 ÷ 5 gives 3 with what remainder?
    answer: '2'
    check: 17-15
    difficulty: 2
    hints:
    - 5 × 3 = 15.
    - 17 − 15.
    solution: Remainder 2.
    mistakes: {"3": "m5_remainder", "1": "m5_remainder"}
  - prompt: 36 mangoes are packed 9 to a box. How many boxes?
    answer: '4'
    check: 36/9
    difficulty: 1
    hints:
    - 36 ÷ 9.
    - 9 × 4 = 36.
    solution: 36 ÷ 9 = 4 boxes.
    mistakes: {"9": "m5_divide_check", "45": "m5_divide_check"}
  - prompt: If 6 × 7 = 42, what is 42 ÷ 6?
    answer: '7'
    check: 42/6
    difficulty: 2
    hints:
    - Division undoes multiplication.
    - Look at the fact.
    solution: 42 ÷ 6 = 7.
    mistakes:
      '6': c4_groups
