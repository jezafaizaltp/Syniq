# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 9
title: Equal Groups
tips:
  c4_groups: Multiply when you know the groups and how many in each. Divide when you know the total and need the groups or the share.
  m4_times_10: "Multiplying by 10 puts one zero at the end."
  c4m9_groups: Draw the groups as circles with dots inside. How many groups, and how many in each?
  c4m9_split: Split the bigger number into tens and ones, multiply each part, then add the two answers.
  c4m9_undo: 'Think of the times table backwards: which number times the divisor gives the total?'
concepts:
- code: cbse4m.groups.mult
  title: Multiplication as equal groups
  notes: |
    Equal groups: 4 groups of 5 = 4 × 5 = 20. Arrays: 3 rows of 6 = 18. Order does not matter: 3 × 6 = 6 × 3. Times
    tables up to 10. Multiply by 10: add a zero. 2-digit × 1-digit: 23 × 4 = 92 (20 × 4 + 3 × 4).
  explanations:
    text: Multiplication is a fast way to add equal groups. 4 plates with 5 laddoos each is 5 + 5 + 5 + 5 = 20, or 4 × 5 = 20.
    visual: 'Draw 4 plates with 5 dots each. Count by fives: 5, 10, 15, 20.'
    step_by_step: 'Step 1: Count the groups. Step 2: Count how many in each group. Step 3: Multiply.'
    real_world: Eggs come in trays of 6 or 12; chairs stand in rows in a hall.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 5
    points:
    - at: 5
      label: '5'
    - at: 10
      label: '10'
    - at: 15
      label: '15'
    - at: 20
      label: '20'
    alt: Four jumps of 5 on a number line reach 20, so 4 times 5 is 20.
    jumps:
    - from: 0
      to: 5
      label: '5'
    - from: 5
      to: 10
      label: '5'
    - from: 10
      to: 15
      label: '5'
    - from: 15
      to: 20
      label: '5'
  activity:
    type: formula
    prompt: Laddoos on plates. Set the plates and the laddoos on each.
    inputs:
    - name: p
      label: Plates
      min: 1
      max: 10
      step: 1
      start: 1
    - name: l
      label: Laddoos on each plate
      min: 1
      max: 20
      step: 1
      start: 1
    outputs:
    - name: tot
      label: Laddoos in all
      expr: p*l
    goals:
    - prompt: 20 laddoos on 4 plates, the same on each.
      want:
        p: 4
        tot: 20
      mistakes:
      - when:
          p: 4
          l: 16
        say: 4 + 16 = 20 adds. 4 plates with the same number each is 4 × that number.
    - prompt: 24 laddoos on 6 plates.
      want:
        p: 6
        tot: 24
      mistakes:
      - when:
          p: 6
          l: 18
        say: 6 + 18 adds. 6 plates of how many make 24?
    - prompt: 30 laddoos on 5 plates.
      want:
        p: 5
        tot: 30
      mistakes:
      - when:
          p: 5
          l:
          - 7
          - 20
        say: 'Too many: 5 × 7 = 35.'
  lesson:
    - teach: 'Multiplication is adding equal groups quickly. 4 plates with 5 laddoos each: 5 + 5 + 5 + 5 = 20, or 4 × 5 = 20.'
      check:
        prompt: 3 bags have 7 marbles each. Which shows this?
        options:
        - 3 × 7
        - 3 + 7
        - 7 − 3
        answer: 3 × 7
        why: 3 equal groups of 7.
    - teach: An array is rows and columns. 3 rows of 6 chairs = 3 × 6 = 18. Turn it sideways and it is 6 rows of 3, still 18. Order does not change the answer.
      picture:
        kind: area_grid
        cols:
        - size: 6
          label: 6 in each row
        rows:
        - size: 1
          label: row 1
        - size: 1
          label: row 2
        - size: 1
          label: row 3
        cells:
        - - ● ● ● ● ● ●
        - - ● ● ● ● ● ●
        - - ● ● ● ● ● ●
        alt: 'An array of 3 rows with 6 dots each: 18 dots.'
      check:
        prompt: If 4 × 9 = 36, what is 9 × 4?
        options:
        - '36'
        - '13'
        - '49'
        answer: '36'
        why: Order does not change the product.
    - teach: 'To multiply by 10, write a zero at the end: 15 × 10 = 150. For bigger numbers, split into tens and ones: 23 × 4 = 20 × 4 + 3 × 4 = 80 + 12 = 92.'
      check:
        prompt: What is 14 × 3 (think 10 × 3 + 4 × 3)?
        options:
        - '42'
        - '34'
        - '17'
        answer: '42'
        why: 30 + 12 = 42.
  items:
  - prompt: 4 plates have 5 laddoos each. How many laddoos?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - 4 × 5.
    - 5 + 5 + 5 + 5.
    solution: 4 × 5 = 20.
    mistakes:
      '9': c4_groups
  - prompt: 3 rows of 6 chairs. How many chairs?
    answer: '18'
    check: 3*6
    difficulty: 1
    hints:
    - 3 × 6.
    - 6 + 6 + 6.
    solution: 3 × 6 = 18.
    mistakes: {"9": "m5_times_table", "24": "m5_times_table"}
  - prompt: What is 7 × 8?
    answer: '56'
    check: 7*8
    difficulty: 1
    hints:
    - 7 eights.
    - Times table of 8.
    solution: 7 × 8 = 56.
    mistakes: {"54": "m5_times_table", "15": "m5_times_table"}
  - prompt: What is 23 × 4?
    answer: '92'
    check: 23*4
    difficulty: 2
    hints:
    - 20 × 4 + 3 × 4.
    - 80 + 12.
    solution: 23 × 4 = 92.
    mistakes: {"82": "m5_times_carry", "27": "m5_times_carry"}
  - prompt: What is 15 × 10?
    answer: '150'
    check: 15*10
    difficulty: 1
    hints:
    - Multiplying by 10 adds a zero.
    - 15 then 0.
    solution: 15 × 10 = 150.
    mistakes: {"1500": "m4_times_10", "25": "m4_times_10"}
  - prompt: A tray holds 12 eggs. How many eggs are in 5 trays?
    answer: '60'
    check: 12*5
    difficulty: 2
    hints:
    - 12 × 5.
    - 10 × 5 + 2 × 5.
    solution: 12 × 5 = 60.
    mistakes: {"17": "m5_times_carry", "50": "m5_times_carry"}
  - prompt: 6 boxes hold 8 pencils each. How many pencils?
    answer: '48'
    check: 6*8
    difficulty: 1
    hints:
    - 'Equal groups: multiply.'
    - 6 × 8.
    solution: 'Step 1: 6 groups of 8. Step 2: 6 × 8 = 48.'
    mistakes:
      '14': c4m9_groups
      '42': c4m9_groups
      '56': c4m9_groups
  - prompt: What is 9 × 6?
    answer: '54'
    check: 9*6
    difficulty: 1
    hints:
    - Use 10 × 6 and take one 6 away.
    - 60 − 6.
    solution: 'Step 1: 10 × 6 = 60. Step 2: 60 − 6 = 54.'
    mistakes:
      '56': c4m9_groups
      '45': c4m9_groups
      '15': c4m9_groups
  - prompt: What is 32 × 3?
    answer: '96'
    check: 32*3
    difficulty: 2
    hints:
    - Split 32 into 30 and 2.
    - Multiply each by 3 and add.
    solution: 'Step 1: 30 × 3 = 90 and 2 × 3 = 6. Step 2: 90 + 6 = 96.'
    mistakes:
      '35': c4m9_split
      '92': c4m9_split
      '66': c4m9_split
  - prompt: What is 27 × 10?
    answer: '270'
    check: 27*10
    difficulty: 1
    hints:
    - Multiplying by 10 moves each digit up one place.
    - Write a zero at the end.
    solution: 'Step 1: × 10 adds a zero. Step 2: 27 × 10 = 270.'
    mistakes:
      '37': c4m9_split
      '2710': c4m9_split
      '207': c4m9_split
  - prompt: A garden has 5 rows of 9 plants. How many plants?
    answer: '45'
    check: 5*9
    difficulty: 1
    hints:
    - 'Rows of equal size: multiply.'
    - 5 × 9.
    solution: 'Step 1: 5 rows × 9 plants. Step 2: = 45.'
    mistakes:
      '14': c4m9_groups
      '54': c4m9_groups
      '40': c4m9_groups
  - prompt: A bus has 4 wheels. How many wheels do 15 buses have?
    answer: '60'
    check: 15*4
    difficulty: 2
    hints:
    - Split 15 into 10 and 5.
    - 10 × 4 + 5 × 4.
    solution: 'Step 1: 10 × 4 = 40 and 5 × 4 = 20. Step 2: 40 + 20 = 60.'
    mistakes:
      '19': c4m9_groups
      '45': c4m9_split
      '54': c4m9_split
  - prompt: Which is the same as 7 × 5?
    options:
    - 5 × 7
    - 7 + 5
    - '75'
    answer: 5 × 7
    difficulty: 1
    hints:
    - Turn the array sideways.
    - Order does not change a product.
    solution: 'Step 1: 7 × 5 = 35. Step 2: 5 × 7 = 35 too.'
    mistakes:
      7 + 5: c4m9_groups
      '75': c4m9_groups
  - prompt: A book has 48 pages. How many pages in 3 such books?
    answer: '144'
    check: 48*3
    difficulty: 3
    hints:
    - Split 48 into 40 and 8.
    - Multiply each by 3 and add.
    solution: 'Step 1: 40 × 3 = 120 and 8 × 3 = 24. Step 2: 120 + 24 = 144.'
    mistakes:
      '124': c4m9_split
      '51': c4m9_groups
      '1224': c4m9_split
  - prompt: A ticket costs ₹25. How much do 4 tickets cost in rupees?
    answer: '100'
    check: 25*4
    difficulty: 2
    hints:
    - Think of 25 paise coins: how many make one rupee?
    - 25 + 25 + 25 + 25.
    solution: 'Step 1: 25 × 4. Step 2: = ₹100.'
    mistakes:
      '29': c4m9_groups
      '80': c4m9_split
      '120': c4m9_split
- code: cbse4m.groups.div
  title: Division as sharing and grouping
  after:
  - cbse4m.groups.mult
  notes: |
    Division: 20 ÷ 4 = 5 (20 shared among 4, or how many 4s in 20). Division undoes multiplication: 4 × 5 = 20 so
    20 ÷ 4 = 5. Remainders: 17 ÷ 5 = 3 remainder 2.
  explanations:
    text: 'Division splits a total into equal groups. 20 sweets for 4 children: each gets 5, because 4 × 5 = 20. Use your times tables backwards.'
    visual: 'Draw 20 dots and circle groups of 4. Count the circles: 5.'
    step_by_step: 'Step 1: Find the total. Step 2: Find the size of each group (or the number of groups). Step 3: Use the times table backwards.'
    real_world: Putting students into teams, or packing mangoes into boxes.
  picture:
    kind: bars
    bars:
    - label: Team 1
      value: 6
    - label: Team 2
      value: 6
    - label: Team 3
      value: 6
    - label: Team 4
      value: 6
    alt: 24 students split into 4 equal teams gives 6 students in each team.
    unit: students
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Share or group equally. Mark the answer.
    goals:
    - prompt: 20 sweets for 4 children. How many does each get?
      target: 5
      mistakes:
      - when:
          v: 16
        say: '20 − 4 takes away. Share: 4 × ? = 20.'
      - when:
          v: 4
        say: 4 is the number of children.
    - prompt: 18 pencils in boxes of 3. How many boxes?
      target: 6
      mistakes:
      - when:
          v: 15
        say: 18 − 3 takes away once. How many 3s make 18?
      - when:
          v: 3
        say: 3 is how many go in each box.
    - prompt: 35 marbles shared by 5 friends. How many each?
      target: 7
      mistakes:
      - when:
          v: 5
        say: 5 is the number of friends. 5 × ? = 35.
  lesson:
    - teach: 'Division answers two questions. Sharing: 20 sweets among 4 children, how many each? Grouping: how many groups of 4 in 20? Both give 20 ÷ 4 = 5.'
      check:
        prompt: 30 children make teams of 5. How many teams?
        options:
        - '6'
        - '5'
        - '25'
        answer: '6'
        why: There are 6 fives in 30.
    - teach: Division undoes multiplication. Since 6 × 7 = 42, we know 42 ÷ 6 = 7 and 42 ÷ 7 = 6. Use your times tables backwards.
      picture:
        kind: flow
        steps:
        - 6 groups of 7
        - 6 × 7 = 42
        - 42 ÷ 6 = 7
        - 42 ÷ 7 = 6
        alt: A multiplication fact and the two division facts it gives.
      check:
        prompt: Since 8 × 4 = 32, what is 32 ÷ 8?
        options:
        - '4'
        - '8'
        - '24'
        answer: '4'
        why: 8 × 4 = 32, so 32 ÷ 8 = 4.
    - teach: 'Sometimes something is left over: the remainder. 17 ÷ 5: three 5s make 15, and 2 are left. So 17 ÷ 5 = 3 remainder 2. The remainder is always smaller than the number you divide by.'
      check:
        prompt: What is the remainder when 22 is divided by 4?
        options:
        - '2'
        - '5'
        - '6'
        answer: '2'
        why: 4 × 5 = 20; 22 − 20 = 2.
  items:
  - prompt: 20 sweets are shared among 4 children. How many each?
    answer: '5'
    check: 20/4
    difficulty: 1
    hints:
    - 20 ÷ 4.
    - 4 × ? = 20.
    solution: 20 ÷ 4 = 5.
    mistakes: {"4": "m5_share", "80": "m5_share"}
  - prompt: 24 students make teams of 6. How many teams?
    answer: '4'
    check: 24/6
    difficulty: 1
    hints:
    - 24 ÷ 6.
    - 6 × 4 = 24.
    solution: 24 ÷ 6 = 4 teams.
    mistakes: {"6": "m5_divide_check", "30": "m5_divide_check"}
  - prompt: What is 56 ÷ 7?
    answer: '8'
    check: 56/7
    difficulty: 1
    hints:
    - 7 × 8 = 56.
    - Times table backwards.
    solution: 56 ÷ 7 = 8.
    mistakes: {"7": "m5_divide_check", "9": "m5_divide_check"}
  - prompt: 17 ÷ 5 gives 3 with what remainder?
    answer: '2'
    check: 17-15
    difficulty: 2
    hints:
    - 5 × 3 = 15.
    - 17 − 15.
    solution: Remainder 2.
    mistakes: {"3": "m5_remainder", "1": "m5_remainder"}
  - prompt: 36 mangoes are packed 9 to a box. How many boxes?
    answer: '4'
    check: 36/9
    difficulty: 1
    hints:
    - 36 ÷ 9.
    - 9 × 4 = 36.
    solution: 36 ÷ 9 = 4 boxes.
    mistakes: {"9": "m5_divide_check", "45": "m5_divide_check"}
  - prompt: If 6 × 7 = 42, what is 42 ÷ 6?
    answer: '7'
    check: 42/6
    difficulty: 2
    hints:
    - Division undoes multiplication.
    - Look at the fact.
    solution: 42 ÷ 6 = 7.
    mistakes:
      '6': c4_groups
  - prompt: What is 63 ÷ 9?
    answer: '7'
    check: 63//9
    difficulty: 1
    hints:
    - Which number times 9 is 63?
    - Use the 9 times table.
    solution: 'Step 1: 9 × 7 = 63. Step 2: So 63 ÷ 9 = 7.'
    mistakes:
      '6': c4m9_undo
      '8': c4m9_undo
      '54': c4m9_undo
  - prompt: 48 mangoes are shared equally among 6 baskets. How many in each?
    answer: '8'
    check: 48//6
    difficulty: 1
    hints:
    - Share means divide.
    - 6 × ? = 48.
    solution: 'Step 1: 48 ÷ 6. Step 2: = 8 mangoes.'
    mistakes:
      '42': c4m9_undo
      '7': c4m9_undo
      '54': c4m9_undo
  - prompt: What is the remainder when 29 is divided by 6?
    answer: '5'
    check: 29%6
    difficulty: 2
    hints:
    - Find the biggest 6-fact not more than 29.
    - Take it away from 29.
    solution: 'Step 1: 6 × 4 = 24. Step 2: 29 − 24 = 5.'
    mistakes:
      '4': c4m9_undo
      '3': c4m9_undo
      '23': c4m9_undo
  - prompt: A rope of 40 m is cut into pieces of 8 m. How many pieces?
    answer: '5'
    check: 40//8
    difficulty: 2
    hints:
    - How many 8s in 40?
    - Count by 8s.
    solution: 'Step 1: 40 ÷ 8. Step 2: = 5 pieces.'
    mistakes:
      '32': c4m9_undo
      '48': c4m9_undo
      '4': c4m9_undo
  - prompt: If 9 × 8 = 72, what is 72 ÷ 9?
    answer: '8'
    check: 72//9
    difficulty: 1
    hints:
    - Division undoes multiplication.
    - Look at the fact given.
    solution: 'Step 1: 9 × 8 = 72. Step 2: So 72 ÷ 9 = 8.'
    mistakes:
      '9': c4m9_undo
      '63': c4m9_undo
  - prompt: 25 children go on a trip. Each car takes 4 children. How many cars are needed so nobody is left behind?
    answer: '7'
    check: 25//4+1
    difficulty: 3
    hints:
    - 25 ÷ 4 = 6 with some left over.
    - The leftover children also need a car.
    solution: 'Step 1: 6 cars take 24 children; 1 is left. Step 2: One more car is needed: 7 cars.'
    mistakes:
      '6': c4m9_undo
      '1': c4m9_undo
      '100': c4m9_groups
  - prompt: Which division has no remainder?
    options:
    - 35 ÷ 5
    - 34 ÷ 5
    - 36 ÷ 5
    answer: 35 ÷ 5
    difficulty: 2
    hints:
    - No remainder means it shares exactly.
    - Which number is in the 5 times table?
    solution: 'Step 1: 5 × 7 = 35. Step 2: So 35 ÷ 5 shares exactly.'
    mistakes:
      34 ÷ 5: c4m9_undo
      36 ÷ 5: c4m9_undo
  - prompt: ₹81 is shared equally among 9 friends. How many rupees each?
    answer: '9'
    check: 81//9
    difficulty: 2
    hints:
    - 9 × ? = 81.
    - It is a square number.
    solution: 'Step 1: 9 × 9 = 81. Step 2: Each gets ₹9.'
    mistakes:
      '72': c4m9_undo
      '8': c4m9_undo
      '90': c4m9_undo
  - prompt: 60 eggs are packed in trays of 12. How many trays?
    answer: '5'
    check: 60//12
    difficulty: 3
    hints:
    - 'Count by 12s: 12, 24, 36 ...'
    - How many steps reach 60?
    solution: 'Step 1: 12 × 5 = 60. Step 2: So 5 trays.'
    mistakes:
      '48': c4m9_undo
      '6': c4m9_undo
      '4': c4m9_undo
