# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 6
title: Measuring Length
tips:
  c4_cm_m: "Centi means one hundredth: a centimetre is one hundredth of a metre. On a ruler, start counting from 0, not from 1."
  m4_cm_m: "1 m = 100 cm. 3 m = 3 × 100."
  m4_metres: "Metres are for long things you walk along."
  m4_ruler: "Start at 0 and count to where the pencil ends. The end mark is the length."
  m4_standard: "A grown-up's hand span and a child's are different sizes."
  m4_tallest: "Tallest means the biggest number. Compare 120, 132 and 128."
  c4m6_zero: Check where the object starts on the ruler. If it is not at 0, count the cm gaps from its start to its end.
  c4m6_unit: Change everything into the same unit first. Remember 1 m = 100 cm and 1 km = 1000 m.
  c4m6_size: Picture the thing next to a ruler (about 30 cm) or a door (about 2 m). Which unit fits?
concepts:
- code: cbse4m.len.cm
  title: Centimetres and metres
  notes: |
    Short lengths in centimetres (cm), longer in metres (m). 1 m = 100 cm. Measure with a ruler starting at 0. Hand
    span and steps are non-standard units (they differ from person to person), so we use cm and m to agree.
  explanations:
    text: Measure small things like a pencil in centimetres and bigger things like a room in metres. 1 metre is 100 centimetres. Always start measuring from the 0 mark on the ruler.
    visual: Draw a ruler from 0 to 15 cm and a pencil lying along it from 0 to 12.
    step_by_step: 'Step 1: Put the start of the object at 0. Step 2: Read the number at the other end. Step 3: Write the unit.'
    real_world: A tailor measures your arm in cm; the length of a classroom is measured in m.
  picture:
    kind: number_line
    from: 0
    to: 15
    step: 1
    points:
    - at: 0
      label: start
    - at: 12
      label: 'pencil ends: 12 cm'
    alt: A pencil placed from 0 on the ruler ends at 12, so it is 12 centimetres long.
  activity:
    type: number_line
    min: 0
    max: 200
    step: 5
    start: 0
    prompt: The line is in centimetres. 1 metre = 100 cm. Mark each length.
    goals:
    - prompt: 1 metre
      target: 100
      mistakes:
      - when:
          v: 10
        say: 1 metre is 100 cm, not 10.
    - prompt: 1 m 50 cm
      target: 150
      mistakes:
      - when:
          v: 105
        say: That's 1 m 5 cm. Here it's 50 cm more.
      - when:
          v: 50
        say: 'Don''t forget the 1 m: that''s 100 cm.'
    - prompt: Half a metre
      target: 50
      mistakes:
      - when:
          v: 5
        say: Half of 100 cm is 50 cm.
      - when:
          v: 100
        say: That's a whole metre.
  lesson:
    - teach: Hand spans and steps are different for different people, so two people may get different answers. Standard units like centimetres (cm) and metres (m) are the same everywhere.
      check:
        prompt: Why might two children get different lengths for the same table using hand spans?
        options:
        - Their hands are different sizes
        - The table changes size
        - Spans are always exact
        answer: Their hands are different sizes
        why: A span is not a fixed length.
      ways:
      - style: visual
        teach: Why hand spans give different answers but centimetres do not.
        picture:
          kind: compare
          columns:
          - title: Hand spans
            points:
            - A child's span is small
            - An adult's span is big
            - Same table, different answers
          - title: Centimetres
            points:
            - Same size everywhere
            - Every ruler agrees
            - Same table, same answer
          alt: 'Hand spans differ: a child''s is small and an adult''s big, so the same table gets different answers. Centimetres are the same everywhere, so every ruler gives the same answer.'
      - style: real_world
        teach: A tailor in Kochi and a tailor in Delhi both use a measuring tape in centimetres. That is why a shirt made to 40 cm across the shoulders fits the same in both cities.
    - teach: 'A ruler measures in cm. Put the start of the object at 0 and read where it ends. If it starts at another mark, take the start away from the end: from 3 to 11 is 11 − 3 = 8 cm.'
      picture:
        kind: number_line
        from: 0
        to: 12
        step: 1
        jumps:
        - from: 3
          to: 11
        alt: A ruler from 0 to 12 cm; an object lies from 3 to 11, which is 8 cm long.
      check:
        prompt: An eraser lies from 4 to 9 on a ruler. How long is it?
        options:
        - 5 cm
        - 9 cm
        - 13 cm
        answer: 5 cm
        why: 9 − 4 = 5 cm.
      ways:
      - style: step_by_step
        teach: 'Measure from a mark that is not 0. Step 1: A pen lies from 4 to 17 on a ruler. Step 2: Read the end mark: 17. Step 3: Read the start mark: 4. Step 4: Take away: 17 − 4 = 13. The pen is 13 cm long.'
      - style: real_world
        teach: 'Rulers often get chipped at the end. If yours is broken, you can still measure: just start the object at any clear mark and count the cm gaps to its end.'
    - teach: Short things are measured in cm (a pencil, a book). Longer things in metres (a room, a rope). 1 metre = 100 centimetres.
      check:
        prompt: Which is best measured in cm?
        options:
        - a notebook
        - a playground
        - a road
        answer: a notebook
        why: A notebook is short; cm fits.
      ways:
      - style: visual
        teach: Things we measure in centimetres and things we measure in metres.
        picture:
          kind: compare
          columns:
          - title: Centimetres
            points:
            - An eraser
            - A notebook
            - A spoon
          - title: Metres
            points:
            - A cricket pitch
            - A saree
            - A corridor
          alt: An eraser, a notebook and a spoon are measured in centimetres. A cricket pitch, a saree and a corridor are measured in metres.
      - style: real_world
        teach: A cricket pitch is about 20 metres long. Measuring it in centimetres would give a number over 2,000, which is why metres are the better unit for long things.
  items:
  - prompt: How many centimetres are in 1 metre?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - Centi means hundredth.
    - A metre stick has 100 marks.
    solution: 1 m = 100 cm.
    mistakes:
      '10': c4_cm_m
  - prompt: A pencil starts at 0 and ends at 12 on a ruler. How long is it in cm?
    answer: '12'
    check: 12-0
    difficulty: 1
    hints:
    - Read the end.
    - Start was 0.
    solution: It is 12 cm long.
    mistakes: {"11": "m4_ruler", "13": "m4_ruler"}
  - prompt: A crayon lies from 2 to 9 on a ruler. How long is it in cm?
    answer: '7'
    check: 9-2
    difficulty: 2
    hints:
    - It did not start at 0.
    - 9 − 2.
    solution: 9 − 2 = 7 cm.
    mistakes:
      '9': c4_cm_m
  - prompt: Which is best measured in metres?
    options:
    - "the length of a classroom"
    - "the length of an eraser"
    - "the width of a fingernail"
    - "the width of a small coin"
    answer: the length of a classroom
    difficulty: 1
    hints:
    - Which is longest?
    - Rooms.
    solution: A classroom is long, so metres.
    mistakes: {"the length of an eraser": "m4_metres"}
  - prompt: How many centimetres are in 3 metres?
    answer: '300'
    check: 3*100
    difficulty: 1
    hints:
    - 1 m = 100 cm.
    - 3 × 100.
    solution: 3 × 100 = 300 cm.
    mistakes: {"30": "m4_cm_m", "3000": "m4_cm_m"}
  - prompt: Why do we use cm and m instead of hand spans?
    options:
    - "hand spans are different for different people"
    - "hand spans are far too exact for daily use"
    - "one cm is always longer than a whole hand"
    - "rulers and tapes are always given out free"
    answer: hand spans are different for different people
    difficulty: 2
    hints:
    - Compare your span with a teacher's.
    - Not the same.
    solution: Hand spans vary, so standard units let everyone agree.
    mistakes: {"hand spans are far too exact for daily use": "m4_standard"}
  - prompt: A leaf lies from 2 to 10 on a ruler. How long is it in cm?
    answer: '8'
    check: 10-2
    difficulty: 1
    hints:
    - It does not start at 0.
    - Take the start away from the end.
    solution: 'Step 1: End 10, start 2. Step 2: 10 − 2 = 8 cm.'
    mistakes:
      '10': c4m6_zero
      '12': c4m6_zero
  - prompt: How many centimetres are in 5 metres?
    answer: '500'
    check: 5*100
    difficulty: 1
    hints:
    - 1 m = 100 cm.
    - Five lots of that.
    solution: 'Step 1: 1 m = 100 cm. Step 2: 5 × 100 = 500 cm.'
    mistakes:
      '50': c4m6_unit
      '105': c4m6_unit
      '5000': c4m6_unit
  - prompt: How many metres is 700 cm?
    answer: '7'
    check: 700//100
    difficulty: 2
    hints:
    - Every 100 cm makes 1 m.
    - How many hundreds in 700?
    solution: 'Step 1: 100 cm = 1 m. Step 2: 700 ÷ 100 = 7 m.'
    mistakes:
      '70': c4m6_unit
      '700': c4m6_unit
  - prompt: Which is about 1 metre long?
    options:
    - a big step of a grown-up
    - a matchstick
    - a fingernail
    answer: a big step of a grown-up
    difficulty: 2
    hints:
    - 1 m = 100 cm, more than three rulers.
    - Which one is much longer than a ruler?
    solution: 'Step 1: A matchstick and a fingernail are only a few cm. Step 2: A grown-up''s big step is about 1 m.'
    mistakes:
      a matchstick: c4m6_size
      a fingernail: c4m6_size
  - prompt: Which unit is best for the height of a door?
    options:
    - metres
    - centimetres only, no metres
    - kilometres
    answer: metres
    difficulty: 2
    hints:
    - A door is taller than a grown-up.
    - Kilometres are for distances between towns.
    solution: 'Step 1: A door is about 2 m tall. Step 2: Metres fit best.'
    mistakes:
      centimetres only, no metres: c4m6_size
      kilometres: c4m6_size
  - prompt: A pencil is 15 cm. How long are 4 such pencils laid end to end?
    answer: '60'
    check: 15*4
    difficulty: 2
    hints:
    - Add 15 four times.
    - Or multiply.
    solution: 'Step 1: 15 × 4. Step 2: = 60 cm.'
    mistakes:
      '19': c4m6_unit
      '45': c4m6_unit
      '75': c4m6_unit
  - prompt: A broken ruler starts at 5. A crayon lies from 5 to 13. How long is the crayon?
    answer: '8'
    check: 13-5
    difficulty: 2
    hints:
    - Do not just read the end number.
    - Count the cm gaps from 5 to 13.
    solution: 'Step 1: End 13, start 5. Step 2: 13 − 5 = 8 cm.'
    mistakes:
      '13': c4m6_zero
      '18': c4m6_zero
  - prompt: Mira measured a table as 8 hand spans. Mira's teacher measured it as 6 hand spans. Whose hand span is bigger?
    options:
    - the teacher's
    - Mira's
    - they are the same
    answer: the teacher's
    difficulty: 3
    hints:
    - Same table, fewer spans.
    - Fewer spans means each span covers more.
    solution: 'Step 1: The teacher needed fewer spans for the same length. Step 2: So the teacher''s span is bigger.'
    mistakes:
      Mira's: c4m6_size
      they are the same: c4m6_size
  - prompt: A 1 m stick is cut into pieces of 20 cm. How many pieces?
    answer: '5'
    check: 100//20
    difficulty: 3
    hints:
    - Change 1 m into cm.
    - How many 20s make that?
    solution: 'Step 1: 1 m = 100 cm. Step 2: 100 ÷ 20 = 5 pieces.'
    mistakes:
      '20': c4m6_unit
      '50': c4m6_unit
      '4': c4m6_unit
  - prompt: 'Case: Leela measures a notebook from the 6 cm mark of a broken ruler. The notebook ends at 27 cm. How long is it?'
    options:
    - 21 cm
    - 27 cm
    - 33 cm
    answer: 21 cm
    hints:
    - Where does the notebook start on the ruler?
    - Count the gaps from the start mark to the end mark.
    solution: It starts at 6 and ends at 27, so its length is 27 − 6 = 21 cm.
    mistakes:
      27 cm: c4m6_zero
      33 cm: c4m6_zero
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your class wants to measure the length of the school playground for sports day. Which unit should you use?'
    options:
    - Metres
    - Centimetres
    - Hand spans
    answer: Metres
    hints:
    - Is a playground short like a pencil or long like a road?
    - Which unit is the same for everyone and suits long lengths?
    solution: A playground is long, so metres are best. Hand spans are different for different people.
    mistakes:
      Centimetres: c4m6_size
      Hand spans: c4m6_size
    exam: competency
    difficulty: 2
- code: cbse4m.len.compare
  title: Comparing and adding lengths
  after:
  - cbse4m.len.cm
  notes: |
    Compare lengths in the same unit. 1 m 20 cm = 120 cm. Add: 45 cm + 38 cm = 83 cm; 1 m 50 cm + 70 cm = 2 m 20 cm.
    Heights of children are measured in cm. Kilometres (km) are for long distances: 1 km = 1000 m.
  explanations:
    text: To compare or add lengths, change them to the same unit first. 1 m 20 cm is 100 + 20 = 120 cm.
    visual: Draw three children of heights 120 cm, 132 cm and 128 cm as bars. The tallest bar is 132 cm.
    step_by_step: 'Step 1: Change all lengths to cm. Step 2: Compare or add. Step 3: Change back to m and cm if needed.'
    real_world: Marking children's heights on a wall each year shows how much they have grown.
  picture:
    kind: bars
    bars:
    - label: Anu
      value: 120
    - label: Ravi
      value: 132
    - label: Meera
      value: 128
    alt: 'Heights of three children: Anu 120 centimetres, Ravi 132, Meera 128. Ravi is tallest.'
    unit: cm
  activity:
    type: sort
    prompt: Is it longer than, shorter than, or the same as 1 metre (100 cm)?
    bins:
    - Longer than 1 m
    - Same as 1 m
    - Shorter than 1 m
    items:
    - label: 120 cm
      bin: Longer than 1 m
      clue: Is 120 more than 100?
      why: 'Yes: 20 cm longer.'
    - label: 1 m 5 cm
      bin: Longer than 1 m
      clue: 1 m and then a bit more.
      why: 105 cm.
    - label: 150 cm
      bin: Longer than 1 m
      clue: Compare 150 and 100.
      why: Longer.
    - label: 100 cm
      bin: Same as 1 m
      clue: How many cm in a metre?
      why: Exactly 1 m.
    - label: 50 cm + 50 cm
      bin: Same as 1 m
      clue: Add them first.
      why: 100 cm.
    - label: 99 cm
      bin: Shorter than 1 m
      clue: Just 1 cm short.
      why: Shorter.
    - label: 80 cm
      bin: Shorter than 1 m
      clue: Compare 80 and 100.
      why: Shorter.
    - label: 10 cm
      bin: Shorter than 1 m
      clue: Is 10 cm as long as 100 cm?
      why: Much shorter.
  lesson:
    - teach: To compare or add lengths, first use the same unit. 1 m 20 cm = 100 cm + 20 cm = 120 cm. Now it can be compared with 115 cm easily.
      check:
        prompt: How many cm is 1 m 45 cm?
        options:
        - '145'
        - '1045'
        - '46'
        answer: '145'
        why: 100 cm + 45 cm = 145 cm.
      ways:
      - style: visual
        teach: Change to the same unit before comparing two lengths.
        picture:
          kind: bars
          unit: cm
          bars:
          - label: 1 m 45 cm
            value: 145
          - label: 150 cm
            value: 150
          alt: 1 m 45 cm is 100 cm + 45 cm = 145 cm. Compared with 150 cm, the 150 cm length is 5 cm longer.
      - style: step_by_step
        teach: 'Turn metres and centimetres into centimetres. Step 1: Take 3 m 8 cm. Step 2: 3 m is 3 × 100 = 300 cm. Step 3: Add the 8 cm: 300 + 8. Step 4: So 3 m 8 cm = 308 cm.'
    - teach: 'Add and subtract lengths like numbers. 45 cm + 38 cm = 83 cm. If cm go past 100, make a metre: 1 m 50 cm + 70 cm = 1 m 120 cm = 2 m 20 cm.'
      picture:
        kind: bars
        unit: cm
        bars:
        - label: Anu
          value: 120
        - label: Meera
          value: 128
        - label: Ravi
          value: 132
        alt: 'Heights of three children in cm: Anu 120, Meera 128, Ravi 132.'
      check:
        prompt: Meera is 128 cm and Anu is 120 cm. How much taller is Meera?
        options:
        - 8 cm
        - 12 cm
        - 248 cm
        answer: 8 cm
        why: 128 − 120 = 8.
      ways:
      - style: step_by_step
        teach: 'Add 1 m 60 cm + 80 cm. Step 1: Add the cm: 60 + 80 = 140 cm. Step 2: 140 cm is more than 100, so make 1 m: 140 cm = 1 m 40 cm. Step 3: Add the metres: 1 m + 1 m = 2 m. Step 4: Answer: 2 m 40 cm.'
      - style: real_world
        teach: To hang a festive light string across a room, families join two shorter strings. They add the lengths to check the joined string reaches from one wall to the other.
    - teach: For long distances we use kilometres (km). 1 km = 1000 m. A walk to a nearby village may be 2 km = 2000 m.
      check:
        prompt: How many metres is 3 km?
        options:
        - '3000'
        - '300'
        - '30'
        answer: '3000'
        why: 3 × 1000 = 3000 m.
      ways:
      - style: visual
        teach: Building up to one kilometre from shorter distances.
        picture:
          kind: flow
          steps:
          - '250 m: once round a small ground'
          - '500 m: twice round'
          - '750 m: three times round'
          - '1000 m = 1 km: four times round'
          alt: Going round a 250 m ground once is 250 m, twice is 500 m, three times is 750 m and four times is 1000 m, which is 1 km.
      - style: real_world
        teach: Milestones beside highways show how many kilometres are left to the next town. Each small stone between them marks a shorter distance.
  items:
  - prompt: 1 m 20 cm is how many centimetres?
    answer: '120'
    check: 100+20
    difficulty: 1
    hints:
    - 1 m = 100 cm.
    - 100 + 20.
    solution: 100 + 20 = 120 cm.
    mistakes:
      '1020': c4_cm_m
  - prompt: Anu is 120 cm, Ravi 132 cm, Meera 128 cm. Who is tallest?
    options:
    - Ravi
    - Anu
    - Meera
    - all equal
    answer: Ravi
    difficulty: 1
    hints:
    - Biggest number.
    - '132.'
    solution: Ravi is tallest at 132 cm.
    mistakes: {"Meera": "m4_tallest"}
  - prompt: Ravi is 132 cm and Anu is 120 cm. How many cm taller is Ravi?
    answer: '12'
    check: 132-120
    difficulty: 1
    hints:
    - Difference.
    - 132 − 120.
    solution: 132 − 120 = 12 cm.
    mistakes: {"252": "m5_subtract_not_add", "22": "m5_subtract_not_add"}
  - prompt: A ribbon of 45 cm is joined to one of 38 cm. How long is it now in cm?
    answer: '83'
    check: 45+38
    difficulty: 1
    hints:
    - Add.
    - 45 + 38.
    solution: 45 + 38 = 83 cm.
    mistakes: {"73": "m5_add_carry", "7": "m5_add_carry"}
  - prompt: How many metres are in 2 km?
    answer: '2000'
    check: 2*1000
    difficulty: 2
    hints:
    - 1 km = 1000 m.
    - 2 × 1000.
    solution: 2 × 1000 = 2,000 m.
    mistakes: {"200": "m5_unit_convert", "20": "m5_unit_convert"}
  - prompt: A rope is 2 m long. 75 cm is cut off. How many cm are left?
    answer: '125'
    check: 200-75
    difficulty: 2
    hints:
    - 2 m = 200 cm.
    - 200 − 75.
    solution: 200 − 75 = 125 cm.
    mistakes:
      '1925': c4_cm_m
  - prompt: 2 m 5 cm is how many centimetres?
    answer: '205'
    check: 200+5
    difficulty: 2
    hints:
    - 2 m is how many cm?
    - Add the extra 5 cm.
    solution: 'Step 1: 2 m = 200 cm. Step 2: 200 + 5 = 205 cm.'
    mistakes:
      '25': c4m6_unit
      '250': c4m6_unit
      '2005': c4m6_unit
  - prompt: 'Which is longer: 1 m 30 cm or 125 cm?'
    options:
    - 1 m 30 cm
    - 125 cm
    - both are equal
    answer: 1 m 30 cm
    difficulty: 2
    hints:
    - Change both into cm.
    - 1 m = 100 cm.
    solution: 'Step 1: 1 m 30 cm = 130 cm. Step 2: 130 > 125, so 1 m 30 cm is longer.'
    mistakes:
      125 cm: c4m6_unit
      both are equal: c4m6_unit
  - prompt: A cloth of 90 cm and another of 65 cm are joined. How long is the cloth in cm?
    answer: '155'
    check: 90+65
    difficulty: 1
    hints:
    - Joined means add.
    - 90 + 65.
    solution: 'Step 1: 90 + 65. Step 2: = 155 cm (1 m 55 cm).'
    mistakes:
      '145': c4m6_unit
      '25': c4m6_unit
  - prompt: A wire is 3 m long. 1 m 40 cm is used. How many cm are left?
    answer: '160'
    check: 300-140
    difficulty: 3
    hints:
    - Change both lengths into cm.
    - Then take away.
    solution: 'Step 1: 3 m = 300 cm; 1 m 40 cm = 140 cm. Step 2: 300 − 140 = 160 cm.'
    mistakes:
      '260': c4m6_unit
      '140': c4m6_unit
      '1': c4m6_unit
  - prompt: Home to school is 800 m. How far is it there and back?
    answer: '1600'
    check: 800*2
    difficulty: 2
    hints:
    - There and back means the trip twice.
    - Add 800 twice.
    solution: 'Step 1: 800 + 800. Step 2: = 1,600 m (1 km 600 m).'
    mistakes:
      '800': c4m6_unit
      '1000': c4m6_unit
  - prompt: Which is the longest?
    options:
    - 2 km
    - 1500 m
    - 900 m
    answer: 2 km
    difficulty: 2
    hints:
    - Change km into m.
    - 1 km = 1000 m.
    solution: 'Step 1: 2 km = 2000 m. Step 2: 2000 > 1500 > 900, so 2 km is longest.'
    mistakes:
      1500 m: c4m6_unit
      900 m: c4m6_unit
  - prompt: Arjun is 1 m 25 cm tall. Last year Arjun was 118 cm. How many cm did Arjun grow?
    answer: '7'
    check: 125-118
    difficulty: 3
    hints:
    - Change 1 m 25 cm into cm.
    - Then find the difference.
    solution: 'Step 1: 1 m 25 cm = 125 cm. Step 2: 125 − 118 = 7 cm.'
    mistakes:
      '107': c4m6_unit
      '93': c4m6_unit
      '17': c4m6_unit
  - prompt: How many metres are in half a kilometre?
    answer: '500'
    check: 1000//2
    difficulty: 2
    hints:
    - 1 km = how many m?
    - Halve it.
    solution: 'Step 1: 1 km = 1000 m. Step 2: Half = 500 m.'
    mistakes:
      '50': c4m6_unit
      '250': c4m6_unit
  - prompt: A running track is 400 m around. How many rounds make 2 km?
    answer: '5'
    check: 2000//400
    difficulty: 3
    hints:
    - Change 2 km into metres.
    - How many 400s fit?
    solution: 'Step 1: 2 km = 2000 m. Step 2: 2000 ÷ 400 = 5 rounds.'
    mistakes:
      '2': c4m6_unit
      '4': c4m6_unit
      '8': c4m6_unit
  - prompt: 'Case: Priya''s jump in the long jump was 2 m 15 cm. Sam''s jump was 208 cm. Whose jump was longer, and by how much?'
    options:
    - Priya's, by 7 cm
    - Sam's, by 7 cm
    - Priya's, by 93 cm
    answer: Priya's, by 7 cm
    hints:
    - Change 2 m 15 cm into centimetres.
    - Then take away the smaller from the bigger.
    solution: 2 m 15 cm = 215 cm. 215 − 208 = 7, so Priya's jump was 7 cm longer.
    mistakes:
      Sam's, by 7 cm: c4m6_unit
      Priya's, by 93 cm: c4m6_unit
    exam: case
    difficulty: 2
  - prompt: 'Situation: You walk from home to the market, which is 1 km 300 m away, and back home again. How many metres do you walk?'
    options:
    - 2,600 m
    - 1,300 m
    - 2,300 m
    answer: 2,600 m
    hints:
    - Change 1 km 300 m into metres first.
    - 'You walk the distance twice: there and back.'
    solution: 1 km 300 m = 1000 + 300 = 1,300 m. There and back is 1,300 + 1,300 = 2,600 m.
