# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 6
title: Measuring Length
tips:
  c4_cm_m: 1 metre = 100 centimetres. Start measuring from 0 on the ruler, not from 1.
  m4_cm_m: "1 m = 100 cm. 3 m = 3 × 100."
  m4_metres: "Metres are for long things you walk along."
  m4_ruler: "Start at 0 and count to where the pencil ends. The end mark is the length."
  m4_standard: "A grown-up's hand span and a child's are different sizes."
  m4_tallest: "Tallest means the biggest number. Compare 120, 132 and 128."
concepts:
- code: cbse4m.len.cm
  title: Centimetres and metres
  notes: |
    Short lengths in centimetres (cm), longer in metres (m). 1 m = 100 cm. Measure with a ruler starting at 0. Hand
    span and steps are non-standard units (they differ from person to person), so we use cm and m to agree.
  explanations:
    text: Measure small things like a pencil in centimetres and bigger things like a room in metres. 1 metre is 100 centimetres. Always start measuring from the 0 mark on the ruler.
    visual: Draw a ruler from 0 to 15 cm and a pencil lying along it from 0 to 12.
    step_by_step: 'Step 1: Put the start of the object at 0. Step 2: Read the number at the other end. Step 3: Write the unit.'
    real_world: A tailor measures your arm in cm; the length of a classroom is measured in m.
  picture:
    kind: number_line
    from: 0
    to: 15
    step: 1
    points:
    - at: 0
      label: start
    - at: 12
      label: 'pencil ends: 12 cm'
    alt: A pencil placed from 0 on the ruler ends at 12, so it is 12 centimetres long.
  activity:
    type: number_line
    min: 0
    max: 200
    step: 5
    start: 0
    prompt: The line is in centimetres. 1 metre = 100 cm. Mark each length.
    goals:
    - prompt: 1 metre
      target: 100
      mistakes:
      - when:
          v: 10
        say: 1 metre is 100 cm, not 10.
    - prompt: 1 m 50 cm
      target: 150
      mistakes:
      - when:
          v: 105
        say: That's 1 m 5 cm. Here it's 50 cm more.
      - when:
          v: 50
        say: 'Don''t forget the 1 m: that''s 100 cm.'
    - prompt: Half a metre
      target: 50
      mistakes:
      - when:
          v: 5
        say: Half of 100 cm is 50 cm.
      - when:
          v: 100
        say: That's a whole metre.
  items:
  - prompt: How many centimetres are in 1 metre?
    answer: '100'
    check: '100'
    difficulty: 1
    hints:
    - Centi means hundredth.
    - A metre stick has 100 marks.
    solution: 1 m = 100 cm.
    mistakes:
      '10': c4_cm_m
  - prompt: A pencil starts at 0 and ends at 12 on a ruler. How long is it in cm?
    answer: '12'
    check: 12-0
    difficulty: 1
    hints:
    - Read the end.
    - Start was 0.
    solution: It is 12 cm long.
    mistakes: {"11": "m4_ruler", "13": "m4_ruler"}
  - prompt: A crayon lies from 2 to 9 on a ruler. How long is it in cm?
    answer: '7'
    check: 9-2
    difficulty: 2
    hints:
    - It did not start at 0.
    - 9 − 2.
    solution: 9 − 2 = 7 cm.
    mistakes:
      '9': c4_cm_m
  - prompt: Which is best measured in metres?
    options:
    - the length of a classroom
    - an eraser
    - a fingernail
    - a coin
    answer: the length of a classroom
    difficulty: 1
    hints:
    - Which is longest?
    - Rooms.
    solution: A classroom is long, so metres.
    mistakes: {"an eraser": "m4_metres"}
  - prompt: How many centimetres are in 3 metres?
    answer: '300'
    check: 3*100
    difficulty: 1
    hints:
    - 1 m = 100 cm.
    - 3 × 100.
    solution: 3 × 100 = 300 cm.
    mistakes: {"30": "m4_cm_m", "3000": "m4_cm_m"}
  - prompt: Why do we use cm and m instead of hand spans?
    options:
    - hand spans are different for different people
    - hand spans are too exact
    - cm is longer than a hand
    - rulers are free
    answer: hand spans are different for different people
    difficulty: 2
    hints:
    - Compare your span with a teacher's.
    - Not the same.
    solution: Hand spans vary, so standard units let everyone agree.
    mistakes: {"hand spans are too exact": "m4_standard"}
- code: cbse4m.len.compare
  title: Comparing and adding lengths
  after:
  - cbse4m.len.cm
  notes: |
    Compare lengths in the same unit. 1 m 20 cm = 120 cm. Add: 45 cm + 38 cm = 83 cm; 1 m 50 cm + 70 cm = 2 m 20 cm.
    Heights of children are measured in cm. Kilometres (km) are for long distances: 1 km = 1000 m.
  explanations:
    text: To compare or add lengths, change them to the same unit first. 1 m 20 cm is 100 + 20 = 120 cm.
    visual: Draw three children of heights 120 cm, 132 cm and 128 cm as bars. The tallest bar is 132 cm.
    step_by_step: 'Step 1: Change all lengths to cm. Step 2: Compare or add. Step 3: Change back to m and cm if needed.'
    real_world: Marking children's heights on a wall each year shows how much they have grown.
  picture:
    kind: bars
    bars:
    - label: Anu
      value: 120
    - label: Ravi
      value: 132
    - label: Meera
      value: 128
    alt: 'Heights of three children: Anu 120 centimetres, Ravi 132, Meera 128. Ravi is tallest.'
    unit: cm
  activity:
    type: sort
    prompt: Is it longer than, shorter than, or the same as 1 metre (100 cm)?
    bins:
    - Longer than 1 m
    - Same as 1 m
    - Shorter than 1 m
    items:
    - label: 120 cm
      bin: Longer than 1 m
      clue: Is 120 more than 100?
      why: 'Yes: 20 cm longer.'
    - label: 1 m 5 cm
      bin: Longer than 1 m
      clue: 1 m and then a bit more.
      why: 105 cm.
    - label: 150 cm
      bin: Longer than 1 m
      clue: Compare 150 and 100.
      why: Longer.
    - label: 100 cm
      bin: Same as 1 m
      clue: How many cm in a metre?
      why: Exactly 1 m.
    - label: 50 cm + 50 cm
      bin: Same as 1 m
      clue: Add them first.
      why: 100 cm.
    - label: 99 cm
      bin: Shorter than 1 m
      clue: Just 1 cm short.
      why: Shorter.
    - label: 80 cm
      bin: Shorter than 1 m
      clue: Compare 80 and 100.
      why: Shorter.
    - label: 10 cm
      bin: Shorter than 1 m
      clue: Is 10 cm as long as 100 cm?
      why: Much shorter.
  items:
  - prompt: 1 m 20 cm is how many centimetres?
    answer: '120'
    check: 100+20
    difficulty: 1
    hints:
    - 1 m = 100 cm.
    - 100 + 20.
    solution: 100 + 20 = 120 cm.
    mistakes:
      '1020': c4_cm_m
  - prompt: Anu is 120 cm, Ravi 132 cm, Meera 128 cm. Who is tallest?
    options:
    - Ravi
    - Anu
    - Meera
    - all equal
    answer: Ravi
    difficulty: 1
    hints:
    - Biggest number.
    - '132.'
    solution: Ravi is tallest at 132 cm.
    mistakes: {"Meera": "m4_tallest"}
  - prompt: Ravi is 132 cm and Anu is 120 cm. How many cm taller is Ravi?
    answer: '12'
    check: 132-120
    difficulty: 1
    hints:
    - Difference.
    - 132 − 120.
    solution: 132 − 120 = 12 cm.
    mistakes: {"252": "m5_subtract_not_add", "22": "m5_subtract_not_add"}
  - prompt: A ribbon of 45 cm is joined to one of 38 cm. How long is it now in cm?
    answer: '83'
    check: 45+38
    difficulty: 1
    hints:
    - Add.
    - 45 + 38.
    solution: 45 + 38 = 83 cm.
    mistakes: {"73": "m5_add_carry", "7": "m5_add_carry"}
  - prompt: How many metres are in 2 km?
    answer: '2000'
    check: 2*1000
    difficulty: 2
    hints:
    - 1 km = 1000 m.
    - 2 × 1000.
    solution: 2 × 1000 = 2,000 m.
    mistakes: {"200": "m5_unit_convert", "20": "m5_unit_convert"}
  - prompt: A rope is 2 m long. 75 cm is cut off. How many cm are left?
    answer: '125'
    check: 200-75
    difficulty: 2
    hints:
    - 2 m = 200 cm.
    - 200 − 75.
    solution: 200 − 75 = 125 cm.
    mistakes:
      '1925': c4_cm_m
