# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 3
title: Pattern Around Us
tips:
  c4_rule: 'Find what happens from one number to the next: add, take away, or double? Check it works every time.'
  m4_arrow_turn: "The arrow turns a quarter turn clockwise each time, like a clock hand. Turn it once more from 'right'."
  m4_core: "Find the part that repeats: ▲ ■ ■. After a ▲, what comes next?"
  m4_core_count: "The core is the part that repeats. Find the first time the pattern starts again."
  m4_odd: "Odd numbers end in 1, 3, 5, 7 or 9."
  m4_odd_odd: "Try it: 1 + 1, 3 + 5, 7 + 9. Are the answers odd or even?"
  m4_repeating: "A repeating pattern uses the same group again and again."
concepts:
- code: cbse4m.pat.shapes
  title: Shape and colour patterns
  notes: |
    Repeating patterns repeat a core: red-blue-red-blue; ▲■▲■. Find the core, then continue. Patterns appear in
    rangoli, sari borders, bangles, tiles and brick walls. Patterns can also turn: an arrow pointing up, right, down,
    left, up ...
  explanations:
    text: A pattern repeats in the same order again and again. Find the smallest part that repeats, the core. Then you can tell what comes next.
    visual: 'Draw beads on a string: red, blue, blue, red, blue, blue. Circle the core: red, blue, blue.'
    step_by_step: 'Step 1: Say the pattern aloud. Step 2: Find where it starts again. Step 3: Use the core to continue.'
    real_world: Kolam and rangoli, sari borders and tiled floors use repeating patterns.
  picture:
    kind: flow
    steps:
    - ↑
    - →
    - ↓
    - ←
    - ↑ again
    alt: 'An arrow pattern turns a quarter each time: up, right, down, left, then up again.'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Beads on a string follow a pattern. Count along and mark the bead number.
    goals:
    - prompt: Red, blue, blue, red, blue, blue … Which bead is the 3rd red?
      target: 7
      mistakes:
      - when:
          v: 3
        say: Bead 3 is blue. The reds are beads 1, 4, 7 …
      - when:
          v: 9
        say: 'Count again: the core is 3 beads, so reds come every 3.'
    - prompt: Triangle, square, triangle, square … Which bead is the 5th triangle?
      target: 9
      mistakes:
      - when:
          v: 5
        say: Bead 5 is the 3rd triangle. Triangles are beads 1, 3, 5, 7, 9.
      - when:
          v: 10
        say: Bead 10 is a square. Triangles are the odd beads.
    - prompt: Black, black, white, white repeats. How many beads in 4 full repeats?
      target: 16
      mistakes:
      - when:
          v: 4
        say: That's the number of repeats. Each repeat has 4 beads.
      - when:
          v: 8
        say: That's 2 repeats. You need 4.
  items:
  - prompt: 'What comes next: red, blue, red, blue, red, ...?'
    options:
    - blue
    - red
    - green
    - yellow
    answer: blue
    difficulty: 1
    hints:
    - Two colours take turns.
    - After red comes ...
    solution: The core is red-blue, so blue comes next.
    mistakes: {"red": "m5_alternate"}
  - prompt: 'What comes next: ▲ ■ ■ ▲ ■ ■ ▲ ...?'
    options:
    - ■
    - ▲
    - ●
    - ★
    answer: ■
    difficulty: 1
    hints:
    - The core is ▲ ■ ■.
    - After ▲ comes ■.
    solution: The core ▲■■ starts again, so ■ comes next.
    mistakes: {"▲": "m4_core"}
  - prompt: An arrow points up, right, down, left, up, right, ... What comes next?
    options:
    - down
    - left
    - up
    - right
    answer: down
    difficulty: 2
    hints:
    - It turns clockwise each time.
    - After right comes ...
    solution: 'The arrow turns clockwise: down comes next.'
    mistakes: {"left": "m4_arrow_turn"}
  - prompt: In the pattern A B C A B C A B C, how many letters are in the core?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Where does it start again?
    - A B C.
    solution: 'The core is A B C: 3 letters.'
    mistakes: {"9": "m4_core_count", "1": "m4_core_count"}
  - prompt: Which is a repeating pattern?
    options:
    - sun, moon, sun, moon
    - sun, moon, star, tree
    - 1, 5, 2, 9
    - cat, bat, dog, pen
    answer: sun, moon, sun, moon
    difficulty: 1
    hints:
    - Something must repeat.
    - Look for the same order again.
    solution: Sun, moon repeats in the same order.
    mistakes: {"sun, moon, star, tree": "m4_repeating"}
  - prompt: 'Bead pattern: ● ● ○ ● ● ○ ● ● ... What comes next?'
    options:
    - ○
    - ●
    - ■
    - ▲
    answer: ○
    difficulty: 2
    hints:
    - 'Core: ● ● ○.'
    - Two filled, then one empty.
    solution: After two filled beads comes an empty one.
    mistakes:
      ●: c4_rule
- code: cbse4m.pat.numbers
  title: Number patterns
  after:
  - cbse4m.pat.shapes
  notes: |
    Number patterns follow a rule: 5, 10, 15, 20 (add 5); 30, 27, 24 (take 3); 1, 2, 4, 8 (double). Even numbers
    end in 0, 2, 4, 6, 8; odd numbers end in 1, 3, 5, 7, 9. Odd + odd = even; even + even = even; odd + even = odd.
  explanations:
    text: Number patterns grow or shrink by a rule. Look at how each number changes to the next. Even numbers can be split into two equal groups; odd numbers always have one left over.
    visual: 'Draw a number line from 0 to 20 and hop in fives: 0, 5, 10, 15, 20.'
    step_by_step: 'Step 1: Find the change between two numbers. Step 2: Check it works for every pair. Step 3: Apply it to find the next number.'
    real_world: House numbers on one side of a street are often all odd, and on the other side all even.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 5
    points:
    - at: 5
      label: '5'
    - at: 10
      label: '10'
    - at: 15
      label: '15'
    - at: 20
      label: '20'
    alt: 'Skip counting by fives on a number line: 5, 10, 15, 20.'
    jumps:
    - from: 0
      to: 5
      label: '+5'
    - from: 5
      to: 10
      label: '+5'
    - from: 10
      to: 15
      label: '+5'
    - from: 15
      to: 20
      label: '+5'
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: Find the rule and mark the next number.
    goals:
    - prompt: 2, 5, 8, 11, …
      target: 14
      mistakes:
      - when:
          v: 13
        say: The numbers jump by 3 each time, not 2.
      - when:
          v: 12
        say: 11 + 1? The jump is 3.
    - prompt: 35, 30, 25, …
      target: 20
      mistakes:
      - when:
          v: 30
        say: The pattern is going down by 5.
      - when:
          v: 24
        say: Each step takes away 5, not 1.
    - prompt: 1, 2, 4, 8, …
      target: 16
      mistakes:
      - when:
          v: 10
        say: It isn't adding 2. Each number is double the one before.
      - when:
          v: 12
        say: 'Each number doubles: 8 + 8.'
  items:
  - prompt: 'What comes next: 5, 10, 15, 20, ...?'
    answer: '25'
    check: 20+5
    difficulty: 1
    hints:
    - Add 5 each time.
    - 20 + 5.
    solution: 20 + 5 = 25.
    mistakes: {"21": "m5_pattern_rule", "30": "m5_pattern_rule"}
  - prompt: 'What comes next: 30, 27, 24, 21, ...?'
    answer: '18'
    check: 21-3
    difficulty: 1
    hints:
    - Take away 3 each time.
    - 21 − 3.
    solution: 21 − 3 = 18.
    mistakes:
      '24': c4_rule
  - prompt: 'What comes next: 1, 2, 4, 8, ...?'
    answer: '16'
    check: 8*2
    difficulty: 2
    hints:
    - Each number doubles.
    - 8 × 2.
    solution: 8 × 2 = 16.
    mistakes:
      '12': c4_rule
  - prompt: Which number is odd?
    options:
    - '37'
    - '42'
    - '50'
    - '18'
    answer: '37'
    difficulty: 1
    hints:
    - Look at the last digit.
    - Odd ends in 1, 3, 5, 7, 9.
    solution: 37 ends in 7, so it is odd.
    mistakes: {"42": "m4_odd"}
  - prompt: 'Odd + odd always gives:'
    options:
    - an even number
    - an odd number
    - zero
    - a hundred
    answer: an even number
    difficulty: 2
    hints:
    - Try 3 + 5.
    - 8 is even.
    solution: Two leftover ones pair up, so the sum is even.
    mistakes: {"an odd number": "m4_odd_odd"}
  - prompt: 'What comes next: 100, 90, 80, 70, ...?'
    answer: '60'
    check: 70-10
    difficulty: 1
    hints:
    - Take 10 each time.
    - 70 − 10.
    solution: 70 − 10 = 60.
    mistakes: {"80": "m5_pattern_rule", "69": "m5_pattern_rule"}
