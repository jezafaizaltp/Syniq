# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 11
title: Fun with Symmetry
tips:
  c4_fold: Fold along the line in your mind. If both halves match exactly, the line is a line of symmetry.
concepts:
- code: cbse4m.sym.line
  title: Mirror halves
  notes: |
    A shape has a line of symmetry if folding along it makes both halves match. Butterfly, leaf, heart, letters A, H, M, O,
    T, U, V, W, X, Y. A square has 4 lines, a rectangle 2, a circle many. Ink-blot and paper-cut designs make symmetry.
  explanations:
    text: A shape is symmetrical if you can fold it so both halves match exactly. The fold is the line of symmetry. A butterfly's wings match on both sides.
    visual: 'Fold a paper, put a blob of paint near the fold, press and open: a symmetrical butterfly.'
    step_by_step: 'Step 1: Draw a line through the middle. Step 2: Imagine folding. Step 3: Do the halves match?'
    real_world: Rangoli, temple fronts, and many leaves and flowers are symmetrical.
  picture:
    kind: compare
    columns:
    - title: Symmetrical
      points:
      - A
      - H
      - O
    - title: Not symmetrical
      points:
      - F
      - G
      - J
    alt: The letters A, H and O are symmetrical; F, G and J are not.
  activity:
    type: sort
    prompt: Fold it down the middle. Do the two sides match?
    bins:
    - Sides match
    - Sides don't match
    items:
    - label: A butterfly
      bin: Sides match
      clue: Look at the two wings.
      why: The wings mirror each other.
    - label: A leaf
      bin: Sides match
      clue: Fold along the middle vein.
      why: The sides match.
    - label: Letter A
      bin: Sides match
      clue: Fold from top to bottom.
      why: Both legs line up.
    - label: A heart shape
      bin: Sides match
      clue: Fold down the middle.
      why: They match.
    - label: Letter F
      bin: Sides don't match
      clue: Try any fold.
      why: No fold works.
    - label: Letter G
      bin: Sides don't match
      clue: Fold it down the middle.
      why: The bar sticks out on one side only.
    - label: Number 7
      bin: Sides don't match
      clue: Fold down the middle.
      why: The top bar and slant don't line up.
    - label: Letter J
      bin: Sides don't match
      clue: Fold it.
      why: The hook is on one side only.
  items:
  - prompt: Which letter has a line of symmetry?
    options:
    - A
    - F
    - G
    - J
    answer: A
    difficulty: 1
    hints:
    - Draw a line down the middle.
    - Do both sides match?
    solution: A has a vertical line of symmetry.
  - prompt: Which has a line of symmetry?
    options:
    - a butterfly
    - a scribble
    - the letter G
    - a torn paper
    answer: a butterfly
    difficulty: 1
    hints:
    - Both wings match.
    - Fold it.
    solution: A butterfly is symmetrical.
  - prompt: How many lines of symmetry does a square have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Two middle lines.
    - And two diagonals.
    solution: A square has 4 lines of symmetry.
  - prompt: How many lines of symmetry does a rectangle (not a square) have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Diagonals don't work.
    - Only the middle lines.
    solution: A rectangle has 2.
    mistakes:
      '4': c4_fold
  - prompt: Which letter has NO line of symmetry?
    options:
    - F
    - H
    - O
    - X
    answer: F
    difficulty: 1
    hints:
    - Try folding each.
    - F has arms on one side.
    solution: F is not symmetrical.
  - prompt: Which shape has many lines of symmetry?
    options:
    - circle
    - triangle with different sides
    - letter F
    - letter J
    answer: circle
    difficulty: 1
    hints:
    - Any line through the centre works.
    - Round.
    solution: A circle has many lines of symmetry.
- code: cbse4m.sym.complete
  title: Completing symmetrical pictures
  after:
  - cbse4m.sym.line
  notes: |
    To complete half a picture, copy each point the same number of squares on the other side of the mirror line. On grid
    paper, count squares from the line. The mirror image is flipped: left becomes right.
  explanations:
    text: To finish a symmetrical picture, copy each part onto the other side, the same distance from the line. Count the squares to keep it exact.
    visual: On squared paper draw half a heart beside a line. Count squares and draw the matching half on the other side.
    step_by_step: 'Step 1: Pick a point. Step 2: Count squares to the line. Step 3: Count the same on the other side. Step 4: Join the points.'
    real_world: Kolam artists draw one half and copy it on the other side to make perfect designs.
  picture:
    kind: flow
    steps:
    - Point 3 squares left of line
    - Count 3 squares right
    - Mark the point
    - Join the points
    alt: To complete a picture, a point 3 squares left of the line is copied 3 squares to the right, and the points are joined.
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: The mirror line is at 10. Mark where each dot's partner goes.
    goals:
    - prompt: A dot at 7.
      target: 13
      mistakes:
      - when:
          v: 7
        say: That's the dot itself. Its partner is on the other side of 10.
      - when:
          v: 14
        say: 7 is 3 steps from 10. Go 3 steps past 10.
    - prompt: A dot at 2.
      target: 18
      mistakes:
      - when:
          v: 12
        say: 2 is 8 steps from the line, not 2.
      - when:
          v: 20
        say: One step too far. Count from 10.
    - prompt: A dot at 12.
      target: 8
      mistakes:
      - when:
          v: 12
        say: That's the dot itself.
      - when:
          v: 2
        say: 12 is just 2 steps from the line.
  items:
  - prompt: A point is 3 squares left of the mirror line. How many squares right is its partner?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Same distance.
    - Mirror.
    solution: 3 squares right.
  - prompt: A point is 5 squares above a sideways mirror line. How many squares below is its partner?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Same distance.
    - Other side.
    solution: 5 squares below.
  - prompt: 'In a mirror, the word ''LEFT'' written on a card looks:'
    options:
    - back to front
    - exactly the same
    - upside down
    - blank
    answer: back to front
    difficulty: 2
    hints:
    - Mirrors flip left and right.
    - Try it.
    solution: A mirror shows writing reversed.
  - prompt: A point is right on the mirror line. Where is its partner?
    options:
    - on the same point
    - far away
    - on the other edge
    - nowhere
    answer: on the same point
    difficulty: 2
    hints:
    - Distance from the line is 0.
    - It stays.
    solution: A point on the line is its own partner.
  - prompt: Which picture is easiest to complete by mirror copying?
    options:
    - half a butterfly
    - half a scribble
    - a random splash
    - a cloud
    answer: half a butterfly
    difficulty: 1
    hints:
    - Which is symmetrical?
    - Wings.
    solution: A butterfly is symmetrical, so copy the half.
  - prompt: A shape's half covers 6 squares. How many squares does the whole symmetrical shape cover?
    answer: '12'
    check: 6*2
    difficulty: 2
    hints:
    - Both halves are the same size.
    - 6 × 2.
    solution: 6 × 2 = 12 squares.
