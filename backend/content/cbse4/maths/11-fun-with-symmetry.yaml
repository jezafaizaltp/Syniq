# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 11
title: Fun with Symmetry
tips:
  c4_fold: Fold along the line in your mind. If both halves match exactly, the line is a line of symmetry.
  m4_double_half: "The other half is a mirror copy of the same size. Double it."
  m4_no_sym: "Fold each letter down the middle and across the middle. Which one never matches?"
  m4_on_line: "Its distance from the mirror line is zero. So its partner is zero away too."
  m4_square_lines: "Fold a paper square: across, down, and along both corners-to-corners. Count the folds."
  c4m11_fold: Imagine folding along the line. Would every part on one side land exactly on a part on the other side?
  c4m11_count: Count the squares from the point to the mirror line, then count the same number on the other side.
  c4m11_flip: A mirror swaps left and right but keeps top and bottom where they are.
  pqc4m11_beak: Picture the bird and its mirror twin facing each other across the line. Does the twin look the same way or the other way?
concepts:
- code: cbse4m.sym.line
  title: Mirror halves
  notes: |
    A shape has a line of symmetry if folding along it makes both halves match. Butterfly, leaf, heart, letters A, H, M, O,
    T, U, V, W, X, Y. A square has 4 lines, a rectangle 2, a circle many. Ink-blot and paper-cut designs make symmetry.
  explanations:
    text: A shape is symmetrical if you can fold it so both halves match exactly. The fold is the line of symmetry. A butterfly's wings match on both sides.
    visual: 'Fold a paper, put a blob of paint near the fold, press and open: a symmetrical butterfly.'
    step_by_step: 'Step 1: Draw a line through the middle. Step 2: Imagine folding. Step 3: Do the halves match?'
    real_world: Rangoli, temple fronts, and many leaves and flowers are symmetrical.
  picture:
    kind: compare
    columns:
    - title: Symmetrical
      points:
      - A
      - H
      - O
    - title: Not symmetrical
      points:
      - F
      - G
      - J
    alt: The letters A, H and O are symmetrical; F, G and J are not.
  activity:
    type: sort
    prompt: Fold it down the middle. Do the two sides match?
    bins:
    - Sides match
    - Sides don't match
    items:
    - label: A butterfly
      bin: Sides match
      clue: Look at the two wings.
      why: The wings mirror each other.
    - label: A leaf
      bin: Sides match
      clue: Fold along the middle vein.
      why: The sides match.
    - label: Letter A
      bin: Sides match
      clue: Fold from top to bottom.
      why: Both legs line up.
    - label: A heart shape
      bin: Sides match
      clue: Fold down the middle.
      why: They match.
    - label: Letter F
      bin: Sides don't match
      clue: Try any fold.
      why: No fold works.
    - label: Letter G
      bin: Sides don't match
      clue: Fold it down the middle.
      why: The bar sticks out on one side only.
    - label: Number 7
      bin: Sides don't match
      clue: Fold down the middle.
      why: The top bar and slant don't line up.
    - label: Letter J
      bin: Sides don't match
      clue: Fold it.
      why: The hook is on one side only.
  lesson:
    - teach: A shape has a line of symmetry if you can fold it along that line and both halves match exactly. A butterfly, a leaf and a heart each have one.
      check:
        prompt: You fold a heart down the middle. What happens?
        options:
        - the two halves match
        - one half is bigger
        - nothing lines up
        answer: the two halves match
        why: That middle fold is a line of symmetry.
      ways:
      - style: visual
        teach: Things that fold into matching halves, and things that do not.
        picture:
          kind: compare
          columns:
          - title: Halves match
            points:
            - A butterfly
            - A leaf
            - A heart
            - A face drawn from the front
          - title: Halves do not match
            points:
            - A hand
            - The letter G
            - A cup with one handle seen from the side
          alt: A butterfly, a leaf, a heart and a face drawn from the front fold into matching halves. A hand, the letter G and a cup with one handle seen from the side do not.
      - style: step_by_step
        teach: 'Test for a line of symmetry. Step 1: Draw or cut out the shape. Step 2: Fold it along the line you want to test. Step 3: Hold it up to the light. Step 4: If the two halves cover each other exactly, the fold is a line of symmetry.'
    - teach: Some shapes have more than one line of symmetry. A rectangle has 2, a square has 4, and a circle has very many (every line through the centre).
      picture:
        kind: compare
        columns:
        - title: Rectangle
          points:
          - 2 lines
          - across and down the middle
        - title: Square
          points:
          - 4 lines
          - across, down and 2 diagonals
        - title: Circle
          points:
          - very many lines
          - any line through the centre
        alt: Lines of symmetry of a rectangle, a square and a circle.
      check:
        prompt: Why does a square have more lines than a rectangle?
        options:
        - Its diagonals also fold into matching halves
        - It is bigger
        - It has more corners
        answer: Its diagonals also fold into matching halves
        why: All sides equal, so the corner-to-corner folds match too.
      ways:
      - style: step_by_step
        teach: 'Find all the lines in a rectangle. Step 1: Cut out a paper rectangle. Step 2: Fold it long side to long side: the halves match. Step 3: Fold it short side to short side: they match again. Step 4: Fold it corner to corner: they do not match. So a rectangle has 2 lines.'
      - style: real_world
        teach: Many temple gateways and palace fronts are built to be the same on the left and the right. Standing in the middle, you see each window matched by another on the other side.
    - teach: Letters can be symmetric too. A, M, T, U, V, W, Y fold left to right. B, C, D, E, K fold top to bottom. H, I, O, X fold both ways. F, G, J, L, P, R have none.
      check:
        prompt: Which letter folds both left-to-right and top-to-bottom?
        options:
        - H
        - A
        - C
        answer: H
        why: H matches when folded either way.
      ways:
      - style: visual
        teach: Capital letters sorted by the way each one folds.
        picture:
          kind: compare
          columns:
          - title: Left to right
            points:
            - A, M, T, U, V, W, Y
          - title: Top to bottom
            points:
            - B, C, D, E, K
          - title: Both ways
            points:
            - H, I, O, X
          alt: A, M, T, U, V, W and Y fold left to right. B, C, D, E and K fold top to bottom. H, I, O and X fold both ways.
      - style: real_world
        teach: Signs painted on the road or on the front of buses often use letters like A, T and O. Because these letters are symmetric, they look neat and balanced even from far away.
  items:
  - prompt: Which letter has a line of symmetry?
    options:
    - A
    - F
    - G
    - J
    answer: A
    difficulty: 1
    hints:
    - Draw a line down the middle.
    - Do both sides match?
    solution: A has a vertical line of symmetry.
    mistakes: {"F": "m5_letter_sym"}
  - prompt: Which has a line of symmetry?
    options:
    - a butterfly
    - a scribble
    - the letter G
    - a torn paper
    answer: a butterfly
    difficulty: 1
    hints:
    - Both wings match.
    - Fold it.
    solution: A butterfly is symmetrical.
    mistakes: {"the letter G": "m5_sym_object"}
  - prompt: How many lines of symmetry does a square have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Two middle lines.
    - And two diagonals.
    solution: A square has 4 lines of symmetry.
    mistakes: {"2": "m4_square_lines", "8": "m4_square_lines"}
  - prompt: How many lines of symmetry does a rectangle (not a square) have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Diagonals don't work.
    - Only the middle lines.
    solution: A rectangle has 2.
    mistakes:
      '4': c4_fold
  - prompt: Which letter has NO line of symmetry?
    options:
    - F
    - H
    - O
    - X
    answer: F
    difficulty: 1
    hints:
    - Try folding each.
    - F has arms on one side.
    solution: F is not symmetrical.
    mistakes: {"H": "m4_no_sym"}
  - prompt: Which shape has many lines of symmetry?
    options:
    - circle
    - triangle with different sides
    - letter F
    - letter J
    answer: circle
    difficulty: 1
    hints:
    - Any line through the centre works.
    - Round.
    solution: A circle has many lines of symmetry.
    mistakes: {"letter F": "m5_circle_sym"}
  - prompt: Which letter has no line of symmetry?
    options:
    - L
    - T
    - O
    answer: L
    difficulty: 1
    hints:
    - Try folding each letter in your head both ways.
    - Which one never matches?
    solution: 'Step 1: T folds down the middle; O folds both ways. Step 2: L does not match any way.'
    mistakes:
      T: c4m11_fold
      O: c4m11_fold
  - prompt: How many lines of symmetry does the letter H have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Try a fold down the middle.
    - Then try one across the middle.
    solution: 'Step 1: H folds left to right. Step 2: It also folds top to bottom: 2 lines.'
    mistakes:
      '1': c4m11_fold
      '4': c4m11_fold
      '0': c4m11_fold
  - prompt: Which of these has a line of symmetry?
    options:
    - a kite shape
    - the number 7
    - a question mark
    answer: a kite shape
    difficulty: 2
    hints:
    - Fold each in your head.
    - Which one matches down its middle?
    solution: 'Step 1: 7 and ? do not match when folded. Step 2: A kite folds down the middle into matching halves.'
    mistakes:
      the number 7: c4m11_fold
      a question mark: c4m11_fold
  - prompt: How many lines of symmetry does an equilateral triangle (3 equal sides) have?
    answer: '3'
    check: '3'
    difficulty: 3
    hints:
    - Fold from one corner to the middle of the opposite side.
    - Can you do that from each corner?
    solution: 'Step 1: Each corner can fold onto the middle of the opposite side. Step 2: 3 corners, 3 lines.'
    mistakes:
      '1': c4m11_fold
      '6': c4m11_fold
      '0': c4m11_fold
  - prompt: Which digit has a line of symmetry across the middle (top to bottom fold)?
    options:
    - '3'
    - '4'
    - '7'
    answer: '3'
    difficulty: 2
    hints:
    - Fold each digit so the top lands on the bottom.
    - Which one has a matching top and bottom bump?
    solution: 'Step 1: 4 and 7 do not match top to bottom. Step 2: 3 has matching top and bottom halves.'
    mistakes:
      '4': c4m11_fold
      '7': c4m11_fold
  - prompt: 'Rangoli designs usually have:'
    options:
    - many lines of symmetry
    - no symmetry
    - only curved lines
    answer: many lines of symmetry
    difficulty: 1
    hints:
    - Rangoli patterns repeat around the centre.
    - 'Fold one across the middle: does it match?'
    solution: 'Step 1: Rangoli repeats the same pattern around a centre. Step 2: So it has many lines of symmetry.'
    mistakes:
      no symmetry: c4m11_fold
      only curved lines: c4m11_fold
  - prompt: 'You fold paper, cut a shape on the fold, and open it. The design is:'
    options:
    - symmetrical about the fold
    - two different shapes
    - not connected
    answer: symmetrical about the fold
    difficulty: 2
    hints:
    - Both layers were cut at the same time.
    - What does the fold line become?
    solution: 'Step 1: Both halves were cut together. Step 2: So they match, and the fold is the line of symmetry.'
    mistakes:
      two different shapes: c4m11_fold
      not connected: c4m11_fold
  - prompt: How many lines of symmetry does a regular hexagon (6 equal sides) have?
    answer: '6'
    check: '6'
    difficulty: 3
    hints:
    - 'Fold corner to opposite corner: how many ways?'
    - 'Fold side-middle to opposite side-middle: how many ways?'
    solution: 'Step 1: 3 lines through opposite corners. Step 2: 3 lines through middles of opposite sides: 6 in all.'
    mistakes:
      '3': c4m11_fold
      '2': c4m11_fold
      '12': c4m11_fold
  - prompt: Which word reads the same when folded left to right?
    options:
    - MOM
    - CAT
    - DOG
    answer: MOM
    difficulty: 3
    hints:
    - Each letter must be symmetric.
    - The word must also read the same from both ends.
    solution: 'Step 1: M and O both fold left to right. Step 2: MOM is the same from both ends, so it matches.'
    mistakes:
      CAT: c4m11_fold
      DOG: c4m11_fold
  - prompt: 'Case: Riya cuts out a paper heart and folds it down the middle from top to bottom: the halves match. Then Riya folds it across the middle from side to side: the halves do not match. How many lines of symmetry does the heart have?'
    options:
    - '1'
    - '2'
    - '0'
    answer: '1'
    hints:
    - Which fold made the halves match?
    - Count only the folds where the halves match.
    solution: Only the fold down the middle makes matching halves, so the heart has 1 line of symmetry.
    mistakes:
      '2': c4m11_fold
      '0': c4m11_fold
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are making a name board where every letter must look the same when folded left to right. Which word should you choose?'
    options:
    - TOY
    - FUN
    - PEN
    answer: TOY
    hints:
    - Check each letter one by one.
    - Do F, N, P or E fold left to right into matching halves?
    solution: T, O and Y each fold left to right into matching halves. F, N, P and E do not.
    mistakes:
      FUN: c4m11_fold
      PEN: c4m11_fold
    exam: competency
    difficulty: 2
- code: cbse4m.sym.complete
  title: Completing symmetrical pictures
  after:
  - cbse4m.sym.line
  notes: |
    To complete half a picture, copy each point the same number of squares on the other side of the mirror line. On grid
    paper, count squares from the line. The mirror image is flipped: left becomes right.
  explanations:
    text: To finish a symmetrical picture, copy each part onto the other side, the same distance from the line. Count the squares to keep it exact.
    visual: On squared paper draw half a heart beside a line. Count squares and draw the matching half on the other side.
    step_by_step: 'Step 1: Pick a point. Step 2: Count squares to the line. Step 3: Count the same on the other side. Step 4: Join the points.'
    real_world: Kolam artists draw one half and copy it on the other side to make perfect designs.
  picture:
    kind: flow
    steps:
    - Point 3 squares left of line
    - Count 3 squares right
    - Mark the point
    - Join the points
    alt: To complete a picture, a point 3 squares left of the line is copied 3 squares to the right, and the points are joined.
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: The mirror line is at 10. Mark where each dot's partner goes.
    goals:
    - prompt: A dot at 7.
      target: 13
      mistakes:
      - when:
          v: 7
        say: That's the dot itself. Its partner is on the other side of 10.
      - when:
          v: 14
        say: 7 is 3 steps from 10. Go 3 steps past 10.
    - prompt: A dot at 2.
      target: 18
      mistakes:
      - when:
          v: 12
        say: 2 is 8 steps from the line, not 2.
      - when:
          v: 20
        say: One step too far. Count from 10.
    - prompt: A dot at 12.
      target: 8
      mistakes:
      - when:
          v: 12
        say: That's the dot itself.
      - when:
          v: 2
        say: 12 is just 2 steps from the line.
  lesson:
    - teach: To complete a symmetrical picture, copy each point to the other side of the mirror line at the same distance. On grid paper, count squares from the line.
      check:
        prompt: 'A point is 4 squares left of the line. Its partner is:'
        options:
        - 4 squares right
        - 4 squares left
        - 8 squares right
        answer: 4 squares right
        why: Same distance, other side.
      ways:
      - style: visual
        teach: 'Copying points across a mirror line: the same number of squares on each side.'
        picture:
          kind: compare
          columns:
          - title: Point in the half picture
            points:
            - 1 square left of the line
            - 4 squares left of the line
            - On the line
          - title: Its partner
            points:
            - 1 square right of the line
            - 4 squares right of the line
            - Stays on the line
          alt: A point 1 square left of the mirror line has its partner 1 square right. A point 4 squares left has its partner 4 squares right. A point on the line stays on the line.
      - style: real_world
        teach: Rangoli artists often draw one half or one quarter of a design first, then copy it across a line, dot by dot, so the finished pattern is perfectly balanced.
    - teach: 'Do it point by point: mark each corner''s partner, then join the partners in the same order. A point on the line stays where it is.'
      picture:
        kind: number_line
        from: -5
        to: 5
        step: 1
        points:
        - at: -3
          label: A
        - at: 3
          label: A′
        - at: 0
          label: mirror
        alt: Point A is 3 squares left of the mirror line; its partner A′ is 3 squares right.
      check:
        prompt: A point sits on the mirror line. Where is its partner?
        options:
        - at the same place
        - 1 square away
        - at the edge
        answer: at the same place
        why: Its distance from the line is 0.
      ways:
      - style: step_by_step
        teach: 'Complete a half house on squared paper. Step 1: Find the mirror line. Step 2: Mark the partner of each corner, the same number of squares on the other side. Step 3: The roof tip sits on the line, so it stays. Step 4: Join the new corners in the same order as the first half.'
      - style: real_world
        teach: Clothes are cut using symmetry. A tailor folds the cloth in half and cuts the shape of half a shirt front. When the cloth is opened, both sides match exactly.
    - teach: A mirror flips left and right. Something pointing left in the half picture points right in the mirror half. Top stays top and bottom stays bottom for an up-down mirror line.
      check:
        prompt: 'In the left half, a flag points left. In the mirror half it points:'
        options:
        - right
        - left
        - down
        answer: right
        why: A side-to-side mirror swaps left and right.
      ways:
      - style: visual
        teach: What a mirror changes and what it keeps the same.
        picture:
          kind: compare
          columns:
          - title: Mirror changes
            points:
            - Pointing left becomes pointing right
            - Writing looks back to front
          - title: Mirror keeps
            points:
            - Top stays top
            - Bottom stays bottom
            - Size stays the same
          alt: 'A mirror changes left and right: something pointing left points right, and writing looks back to front. It keeps top at the top, bottom at the bottom, and the same size.'
      - style: step_by_step
        teach: 'See a mirror flip. Step 1: Stand in front of a mirror. Step 2: Raise your right hand. Step 3: Look: your mirror image raises the hand on the same side as your right, but it is the image''s left. Step 4: Your head is still at the top: only left and right swap.'
  items:
  - prompt: A point is 3 squares left of the mirror line. How many squares right is its partner?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Same distance.
    - Mirror.
    solution: 3 squares right.
    mistakes: {"6": "m5_mirror_dist", "0": "m5_mirror_dist"}
  - prompt: A point is 5 squares above a sideways mirror line. How many squares below is its partner?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Same distance.
    - Other side.
    solution: 5 squares below.
    mistakes: {"10": "m5_mirror_dist", "0": "m5_mirror_dist"}
  - prompt: 'In a mirror, the word ''LEFT'' written on a card looks:'
    options:
    - back to front
    - exactly the same
    - upside down
    - blank
    answer: back to front
    difficulty: 2
    hints:
    - Mirrors flip left and right.
    - Try it.
    solution: A mirror shows writing reversed.
    mistakes: {"exactly the same": "m5_mirror_hand"}
  - prompt: A point is right on the mirror line. Where is its partner?
    options:
    - on the same point
    - far away
    - on the other edge
    - nowhere
    answer: on the same point
    difficulty: 2
    hints:
    - Distance from the line is 0.
    - It stays.
    solution: A point on the line is its own partner.
    mistakes: {"far away": "m4_on_line"}
  - prompt: Which picture is easiest to complete by mirror copying?
    options:
    - half a butterfly
    - half a scribble
    - a random splash
    - a cloud
    answer: half a butterfly
    difficulty: 1
    hints:
    - Which is symmetrical?
    - Wings.
    solution: A butterfly is symmetrical, so copy the half.
    mistakes: {"a random splash": "m5_sym_object"}
  - prompt: A shape's half covers 6 squares. How many squares does the whole symmetrical shape cover?
    answer: '12'
    check: 6*2
    difficulty: 2
    hints:
    - Both halves are the same size.
    - 6 × 2.
    solution: 6 × 2 = 12 squares.
    mistakes: {"6": "m4_double_half", "8": "m4_double_half"}
  - prompt: A point is 6 squares right of the mirror line. How many squares left is its partner?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - The partner is the same distance away.
    - It is on the other side.
    solution: 'Step 1: Same distance from the line. Step 2: 6 squares left.'
    mistakes:
      '12': c4m11_count
      '3': c4m11_count
      '0': c4m11_count
  - prompt: Two points are 2 and 5 squares left of the line. How far apart are their partners on the right?
    answer: '3'
    check: 5-2
    difficulty: 3
    hints:
    - Partners are 2 and 5 squares right.
    - Find the gap between them.
    solution: 'Step 1: Partners are at 2 and 5 squares right. Step 2: 5 − 2 = 3 squares apart.'
    mistakes:
      '7': c4m11_count
      '10': c4m11_count
  - prompt: A point is 4 squares left of the line. How far is it from its partner?
    answer: '8'
    check: 4*2
    difficulty: 2
    hints:
    - Go from the point to the line.
    - Then the same again to the partner.
    solution: 'Step 1: 4 squares to the line. Step 2: 4 more to the partner: 8 squares.'
    mistakes:
      '4': c4m11_count
      '0': c4m11_count
  - prompt: Half a symmetrical picture has 9 coloured squares. How many in the whole picture (none on the line)?
    answer: '18'
    check: 9*2
    difficulty: 2
    hints:
    - The other half is a copy.
    - Double it.
    solution: 'Step 1: The mirror half also has 9. Step 2: 9 + 9 = 18.'
    mistakes:
      '9': c4m11_count
      '81': c4m11_count
      '27': c4m11_count
  - prompt: 'The letter ''b'' seen in a side mirror looks like:'
    options:
    - d
    - p
    - q
    answer: d
    difficulty: 2
    hints:
    - A side mirror swaps left and right only.
    - The round part moves to the other side; the tall stick stays up.
    solution: 'Step 1: b''s round part is on the right; flipped it is on the left. Step 2: The stick stays up, so it looks like d.'
    mistakes:
      p: c4m11_flip
      q: c4m11_flip
  - prompt: Ambulances write AMBULANCE back to front on the front. Why?
    options:
    - "Drivers ahead read it the right way in their mirrors"
    - "It looks prettier when the letters are turned round"
    - "Writing it back to front uses up less paint"
    answer: Drivers ahead read it the right way in their mirrors
    difficulty: 3
    hints:
    - Drivers see the ambulance in their rear mirror.
    - What does a mirror do to writing?
    solution: 'Step 1: A mirror flips writing back to front. Step 2: Flipping the flipped word makes it readable.'
    mistakes:
      "It looks prettier when the letters are turned round": c4m11_flip
      "Writing it back to front uses up less paint": c4m11_flip
  - prompt: A point is 3 squares above a sideways mirror line. Where is its partner?
    options:
    - 3 squares below
    - 3 squares above
    - 6 squares below
    answer: 3 squares below
    difficulty: 2
    hints:
    - A sideways line flips top and bottom.
    - Same distance, other side.
    solution: 'Step 1: The other side of a sideways line is below. Step 2: Same distance: 3 squares below.'
    mistakes:
      3 squares above: c4m11_count
      6 squares below: c4m11_count
  - prompt: Half a butterfly has 3 spots. The whole butterfly has 7 spots. How many spots are on the body (the line)?
    answer: '1'
    check: 7-3*2
    difficulty: 3
    hints:
    - Both wings together have how many spots?
    - Spots on the line are counted only once.
    solution: 'Step 1: Two wings have 3 + 3 = 6 spots. Step 2: 7 − 6 = 1 spot on the body.'
    mistakes:
      '4': c4m11_count
      '2': c4m11_count
      '0': c4m11_count
  - prompt: When completing a symmetrical drawing, what should you do first?
    options:
    - find the mirror line
    - colour the picture
    - rub out the half
    answer: find the mirror line
