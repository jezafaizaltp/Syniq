# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 8
title: Weigh it, Pour it
tips:
  m4_ten_litres: "10 litres is a lot, about ten big water bottles. Which one would you carry with both hands?"
  c4_kg_g: "Kilo means a thousand: change kilograms to grams (or litres to millilitres) before adding."
  m4_balance: "Put a heavy bag on one side of a see-saw. Which side drops?"
  m4_two_halves: "Two 500s added together. 500 + 500 = ?"
  c4m8_kg: "Change the kilograms into grams first, then work with grams only."
  c4m8_litre: 'Change litres into mL first: 1 L = 1000 mL. Then work with mL only.'
  c4m8_feel: Imagine holding it in one hand. Light as a pencil means grams; heavy like a bag of rice means kilograms.
concepts:
- code: cbse4m.weigh.kg
  title: Kilograms and grams
  notes: |
    Weight in kilograms (kg) and grams (g): 1 kg = 1000 g; half kg = 500 g; quarter kg = 250 g. A balance compares
    weights: the heavier side goes down. Light things in grams, heavy in kilograms.
  explanations:
    text: We weigh heavy things in kilograms and light things in grams. 1 kilogram is 1000 grams. On a balance, the heavier side goes down.
    visual: 'Draw a balance: a 1 kg packet on one side and four 250 g packets on the other. It stays level.'
    step_by_step: 'Step 1: Change to grams if needed. Step 2: Compare or add. Step 3: Write the unit.'
    real_world: Vegetable sellers weigh onions and tomatoes on a balance in the market.
  picture:
    kind: bars
    bars:
    - label: 1/4 kg
      value: 250
    - label: 1/2 kg
      value: 500
    - label: 1 kg
      value: 1000
    alt: A quarter kilogram is 250 grams, half a kilogram 500 grams, and one kilogram 1000 grams.
    unit: g
  activity:
    type: sort
    prompt: Would you weigh it in kilograms or grams?
    bins:
    - Kilograms
    - Grams
    items:
    - label: A sack of rice
      bin: Kilograms
      clue: Heavy to lift.
      why: Kilograms.
    - label: A child
      bin: Kilograms
      clue: Too heavy for a kitchen scale.
      why: Kilograms.
    - label: A watermelon
      bin: Kilograms
      clue: Heavy fruit.
      why: A few kilograms.
    - label: A bag of cement
      bin: Kilograms
      clue: Very heavy.
      why: Kilograms.
    - label: A pencil
      bin: Grams
      clue: Very light.
      why: Grams.
    - label: An eraser
      bin: Grams
      clue: Tiny and light.
      why: Grams.
    - label: A letter
      bin: Grams
      clue: Just paper.
      why: Grams.
    - label: A spoon
      bin: Grams
      clue: Light in your hand.
      why: Grams.
  lesson:
    - teach: We measure how heavy things are in grams (g) and kilograms (kg). 1 kg = 1000 g. Light things like a pencil or an eraser are weighed in grams; heavy things like rice sacks in kg.
      check:
        prompt: Which is weighed in kilograms?
        options:
        - a sack of potatoes
        - a feather
        - a coin
        answer: a sack of potatoes
        why: A sack is heavy; kg fits.
    - teach: Half a kg = 500 g and a quarter kg = 250 g. So 4 packets of 250 g make 1 kg, and 2 packets of 500 g make 1 kg.
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: 250 g
        - size: 1
          label: 250 g
        - size: 1
          label: 250 g
        - size: 1
          label: 250 g
        rows:
        - size: 1
          label: 1 kg
        cells:
        - - half kg
          - half kg
          - half kg
          - half kg
        alt: 1 kg split into four 250 g parts; two parts make half a kg.
      check:
        prompt: How many 500 g packets make 2 kg?
        options:
        - '4'
        - '2'
        - '5'
        answer: '4'
        why: 2 kg = 2000 g; 2000 ÷ 500 = 4.
    - teach: A balance compares two weights. The heavier side goes down; when both sides are level, the weights are equal.
      check:
        prompt: 'A bag of salt and 1 kg weight are level on a balance. The salt weighs:'
        options:
        - 1 kg
        - more than 1 kg
        - less than 1 kg
        answer: 1 kg
        why: Level means equal weights.
  items:
  - prompt: How many grams are in 1 kg?
    answer: '1000'
    check: '1000'
    difficulty: 1
    hints:
    - Kilo means thousand.
    - '1000.'
    solution: 1 kg = 1000 g.
    mistakes:
      '100': c4_kg_g
  - prompt: How many grams are in half a kg?
    answer: '500'
    check: 1000/2
    difficulty: 1
    hints:
    - Half of 1000.
    - 1000 ÷ 2.
    solution: 500 g.
    mistakes: {"50": "m5_quarter_kg", "5000": "m5_quarter_kg"}
  - prompt: On a balance, which side goes down?
    options:
    - the heavier side
    - the lighter side
    - both sides
    - the left side always
    answer: the heavier side
    difficulty: 1
    hints:
    - Think of a see-saw.
    - Heavy sinks.
    solution: The heavier side goes down.
    mistakes: {"the lighter side": "m4_balance"}
  - prompt: Which is weighed in grams?
    options:
    - a pencil
    - a sack of rice
    - a goat
    - a scooter
    answer: a pencil
    difficulty: 1
    hints:
    - Grams are for light things.
    - Smallest.
    solution: 'A pencil is light: grams.'
    mistakes: {"a sack of rice": "m5_grams"}
  - prompt: How many 250 g packets make 1 kg?
    answer: '4'
    check: 1000/250
    difficulty: 2
    hints:
    - 1000 ÷ 250.
    - Four quarters.
    solution: 1000 ÷ 250 = 4.
    mistakes: {"5": "m5_packets", "2": "m5_packets"}
  - prompt: Amma buys 2 kg of rice and 500 g of dal. How many grams in all?
    answer: '2500'
    check: 2000+500
    difficulty: 2
    hints:
    - 2 kg = 2000 g.
    - 2000 + 500.
    solution: 2000 + 500 = 2,500 g.
    mistakes:
      '502': c4_kg_g
  - prompt: How many grams are in 3 kg?
    answer: '3000'
    check: 3*1000
    difficulty: 1
    hints:
    - 1 kg = 1000 g.
    - Three lots of that.
    solution: 'Step 1: 1 kg = 1000 g. Step 2: 3 × 1000 = 3000 g.'
    mistakes:
      '300': c4m8_kg
      '30': c4m8_kg
      '1003': c4m8_kg
  - prompt: 'Which is heavier: 1 kg 200 g or 1,150 g?'
    options:
    - 1 kg 200 g
    - 1,150 g
    - both are equal
    answer: 1 kg 200 g
    difficulty: 2
    hints:
    - Change 1 kg 200 g into grams.
    - Then compare.
    solution: 'Step 1: 1 kg 200 g = 1,200 g. Step 2: 1,200 > 1,150.'
    mistakes:
      1,150 g: c4m8_kg
      both are equal: c4m8_kg
  - prompt: A watermelon weighs 2 kg 500 g. How many grams is that?
    answer: '2500'
    check: 2000+500
    difficulty: 2
    hints:
    - 2 kg = how many g?
    - Add 500 g.
    solution: 'Step 1: 2 kg = 2000 g. Step 2: 2000 + 500 = 2,500 g.'
    mistakes:
      '2005': c4m8_kg
      '250': c4m8_kg
      '7': c4m8_kg
  - prompt: Which would weigh about 100 g?
    options:
    - a small packet of biscuits
    - a school bag full of books
    - a bicycle
    answer: a small packet of biscuits
    difficulty: 2
    hints:
    - 100 g is light.
    - Which one can you hold easily on one finger?
    solution: 'Step 1: A bag of books and a bicycle weigh kilograms. Step 2: A small biscuit packet is about 100 g.'
    mistakes:
      a school bag full of books: c4m8_feel
      a bicycle: c4m8_feel
  - prompt: Amma has 1 kg of sugar and uses 350 g. How many grams are left?
    answer: '650'
    check: 1000-350
    difficulty: 2
    hints:
    - Change 1 kg into grams.
    - Then take away 350.
    solution: 'Step 1: 1 kg = 1000 g. Step 2: 1000 − 350 = 650 g.'
    mistakes:
      '750': c4m8_kg
      '1350': c4m8_kg
      '350': c4m8_kg
  - prompt: On a balance, a box goes down and a ball goes up. Which is heavier?
    options:
    - the box
    - the ball
    - they are equal
    answer: the box
    difficulty: 1
    hints:
    - Which side goes down?
    - Heavier things pull their side down.
    solution: 'Step 1: The box''s side went down. Step 2: So the box is heavier.'
    mistakes:
      the ball: c4m8_feel
      they are equal: c4m8_feel
  - prompt: Five apples weigh 200 g each. What is their total weight in grams?
    answer: '1000'
    check: 200*5
    difficulty: 2
    hints:
    - Add 200 five times.
    - Or multiply.
    solution: 'Step 1: 200 × 5. Step 2: = 1,000 g = 1 kg.'
    mistakes:
      '205': c4m8_kg
      '800': c4m8_kg
      '100': c4m8_kg
  - prompt: Rice costs ₹60 per kg. How much does half a kg cost in rupees?
    answer: '30'
    check: 60//2
    difficulty: 3
    hints:
    - Half the weight costs half the price.
    - Half of ₹60.
    solution: 'Step 1: Half kg is half of 1 kg. Step 2: Half of ₹60 = ₹30.'
    mistakes:
      '120': c4m8_kg
      '50': c4m8_kg
      '15': c4m8_kg
  - prompt: A bag holds 3 kg of onions. They are packed into 500 g bags. How many bags?
    answer: '6'
    check: 3000//500
    difficulty: 3
    hints:
    - Change 3 kg into grams.
    - How many 500s make it?
    solution: 'Step 1: 3 kg = 3000 g. Step 2: 3000 ÷ 500 = 6 bags.'
    mistakes:
      '3': c4m8_kg
      '5': c4m8_kg
      '15': c4m8_kg
- code: cbse4m.weigh.litre
  title: Litres and millilitres
  after:
  - cbse4m.weigh.kg
  notes: |
    Capacity in litres (L) and millilitres (mL): 1 L = 1000 mL; a glass ≈ 200 mL; a bucket ≈ 10 L. Pouring tells how many
    small containers fill a big one: 1 L fills 5 glasses of 200 mL.
  explanations:
    text: Liquids are measured in litres and millilitres. 1 litre is 1000 millilitres. A glass holds about 200 mL, so a 1 litre bottle fills about 5 glasses.
    visual: Draw a 1 litre bottle and five glasses of 200 mL in a row.
    step_by_step: 'Step 1: Change both amounts to mL. Step 2: Divide the big amount by the small one.'
    real_world: Milk packets come in 500 mL and 1 L; water bottles often hold 1 L.
  picture:
    kind: flow
    steps:
    - 1 L bottle = 1000 mL
    - Glass = 200 mL
    - 1000 ÷ 200 = 5
    - Fills 5 glasses
    alt: A 1 litre bottle of 1000 millilitres fills 5 glasses of 200 millilitres.
  activity:
    type: number_line
    min: 0
    max: 2000
    step: 50
    start: 0
    prompt: The line is in millilitres (mL). 1 litre = 1000 mL. Mark each amount.
    goals:
    - prompt: 1 litre
      target: 1000
      mistakes:
      - when:
          v: 100
        say: 1 litre is 1000 mL, not 100.
      - when:
          v: 2000
        say: That's 2 litres.
    - prompt: Half a litre
      target: 500
      mistakes:
      - when:
          v: 50
        say: Half of 1000 mL is 500 mL.
      - when:
          v: 1000
        say: That's a whole litre.
    - prompt: 1 litre 500 mL
      target: 1500
      mistakes:
      - when:
          v: 1050
        say: That's 1 L 50 mL. Here it's 500 mL more.
      - when:
          v: 500
        say: 'Don''t forget the 1 litre: that''s 1000 mL.'
  lesson:
    - teach: How much a container holds is its capacity. We measure it in litres (L) and millilitres (mL). 1 L = 1000 mL. A spoon holds about 5 mL, a glass about 200 mL, a bucket about 10 L.
      check:
        prompt: Which holds about 200 mL?
        options:
        - a glass
        - a bucket
        - a spoon
        answer: a glass
        why: A glass is about 200 mL.
    - teach: Pouring shows how many small containers fill a big one. 1 L = 1000 mL fills 5 glasses of 200 mL, because 200 × 5 = 1000.
      picture:
        kind: bars
        unit: mL
        bars:
        - label: 1 glass
          value: 200
        - label: half litre
          value: 500
        - label: 1 litre
          value: 1000
        alt: Bars comparing a 200 mL glass, half a litre and one litre.
      check:
        prompt: A 1 L jug fills cups of 250 mL. How many cups?
        options:
        - '4'
        - '5'
        - '2'
        answer: '4'
        why: 250 × 4 = 1000.
    - teach: To add or take away capacities, use the same unit. 1 L 300 mL = 1300 mL. 2 L − 750 mL = 2000 − 750 = 1250 mL.
      check:
        prompt: How many mL is 1 L 500 mL?
        options:
        - '1500'
        - '1050'
        - '15'
        answer: '1500'
        why: 1000 + 500 = 1500 mL.
  items:
  - prompt: How many mL are in 1 litre?
    answer: '1000'
    check: '1000'
    difficulty: 1
    hints:
    - Milli means thousandth.
    - '1000.'
    solution: 1 L = 1000 mL.
    mistakes:
      '100': c4_kg_g
  - prompt: A 1 L bottle fills glasses of 200 mL. How many glasses?
    answer: '5'
    check: 1000/200
    difficulty: 1
    hints:
    - 1000 ÷ 200.
    - Count by 200s.
    solution: 1000 ÷ 200 = 5.
    mistakes: {"4": "m5_unit_convert", "50": "m5_unit_convert"}
  - prompt: Which holds about 10 litres?
    options:
    - a bucket
    - a spoon
    - a cup
    - a bottle cap
    answer: a bucket
    difficulty: 1
    hints:
    - Biggest.
    - For bathing.
    solution: A bucket holds about 10 L.
    mistakes: {"a cup": "m4_ten_litres"}
  - prompt: Two 500 mL milk packets make how many mL?
    answer: '1000'
    check: 500+500
    difficulty: 1
    hints:
    - 500 + 500.
    - That is 1 litre.
    solution: 500 + 500 = 1,000 mL.
    mistakes: {"500": "m4_two_halves", "100": "m4_two_halves"}
  - prompt: A jug has 1 L of juice. 300 mL is poured out. How many mL are left?
    answer: '700'
    check: 1000-300
    difficulty: 1
    hints:
    - 1000 − 300.
    - Take away.
    solution: 1,000 − 300 = 700 mL.
    mistakes: {"800": "m5_subtract_borrow", "1300": "m5_subtract_borrow"}
  - prompt: A family drinks 3 L of water each day. How many litres in a week?
    answer: '21'
    check: 3*7
    difficulty: 2
    hints:
    - 7 days.
    - 3 × 7.
    solution: 3 × 7 = 21 L.
    mistakes: {"10": "m5_week", "24": "m5_week"}
  - prompt: How many mL are in 4 litres?
    answer: '4000'
    check: 4*1000
    difficulty: 1
    hints:
    - 1 L = 1000 mL.
    - Four lots of that.
    solution: 'Step 1: 1 L = 1000 mL. Step 2: 4 × 1000 = 4000 mL.'
    mistakes:
      '400': c4m8_litre
      '40': c4m8_litre
  - prompt: A 2 L bottle fills glasses of 200 mL. How many glasses?
    answer: '10'
    check: 2000//200
    difficulty: 2
    hints:
    - Change 2 L into mL.
    - How many 200s make it?
    solution: 'Step 1: 2 L = 2000 mL. Step 2: 2000 ÷ 200 = 10 glasses.'
    mistakes:
      '5': c4m8_litre
      '20': c4m8_litre
      '100': c4m8_litre
  - prompt: Which holds about 1 litre?
    options:
    - a big water bottle
    - a teaspoon
    - a swimming pool
    answer: a big water bottle
    difficulty: 1
    hints:
    - 1 L is 5 glasses.
    - Which one can you carry in your school bag?
    solution: 'Step 1: A teaspoon is a few mL; a pool is thousands of L. Step 2: A big water bottle holds about 1 L.'
    mistakes:
      a teaspoon: c4m8_feel
      a swimming pool: c4m8_feel
  - prompt: A bucket has 10 L of water. 3 L 500 mL is used. How many mL are left?
    answer: '6500'
    check: 10000-3500
    difficulty: 3
    hints:
    - Change both into mL.
    - 10 L = 10,000 mL.
    solution: 'Step 1: 10,000 − 3,500. Step 2: = 6,500 mL (6 L 500 mL).'
    mistakes:
      '7500': c4m8_litre
      '6.5': c4m8_litre
      '7': c4m8_litre
  - prompt: A cow gives 6 L of milk a day. How many litres in 5 days?
    answer: '30'
    check: 6*5
    difficulty: 2
    hints:
    - 'Same amount each day: multiply.'
    - 6 × 5.
    solution: 'Step 1: 6 L × 5 days. Step 2: = 30 L.'
    mistakes:
      '11': c4m8_litre
      '25': c4m8_litre
      '35': c4m8_litre
  - prompt: 'Which is more: 3 glasses of 300 mL or 1 litre?'
    options:
    - 1 litre
    - 3 glasses of 300 mL
    - they are equal
    answer: 1 litre
    difficulty: 2
    hints:
    - Find the total of the glasses.
    - Compare with 1000 mL.
    solution: 'Step 1: 3 × 300 = 900 mL. Step 2: 1 L = 1000 mL is more.'
    mistakes:
      3 glasses of 300 mL: c4m8_litre
      they are equal: c4m8_litre
  - prompt: A jug has 750 mL of juice. 3 more glasses of 250 mL are added. How many mL now?
    answer: '1500'
    check: 750+3*250
    difficulty: 3
    hints:
    - Find how much the 3 glasses hold.
    - Add it to 750.
    solution: 'Step 1: 3 × 250 = 750 mL. Step 2: 750 + 750 = 1,500 mL.'
    mistakes:
      '1000': c4m8_litre
      '1003': c4m8_litre
      '1250': c4m8_litre
  - prompt: How many 500 mL packets make 3 litres?
    answer: '6'
    check: 3000//500
    difficulty: 2
    hints:
    - Two packets make 1 L.
    - How many for 3 L?
    solution: 'Step 1: 2 packets = 1 L. Step 2: 3 × 2 = 6 packets.'
    mistakes:
      '3': c4m8_litre
      '5': c4m8_litre
      '15': c4m8_litre
  - prompt: A water tank needs 20 L to fill. A tap gives 4 L each minute. How many minutes to fill it?
    answer: '5'
    check: 20//4
    difficulty: 3
    hints:
    - How many 4s make 20?
    - Use the 4 times table.
    solution: 'Step 1: 20 ÷ 4. Step 2: = 5 minutes.'
    mistakes:
      '80': c4m8_litre
      '16': c4m8_litre
      '4': c4m8_litre
