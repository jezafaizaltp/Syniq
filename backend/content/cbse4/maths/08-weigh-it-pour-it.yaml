# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 8
title: Weigh it, Pour it
tips:
  c4_kg_g: 1 kg = 1000 g and 1 L = 1000 mL. Change to the smaller unit before adding.
concepts:
- code: cbse4m.weigh.kg
  title: Kilograms and grams
  notes: |
    Weight in kilograms (kg) and grams (g): 1 kg = 1000 g; half kg = 500 g; quarter kg = 250 g. A balance compares
    weights: the heavier side goes down. Light things in grams, heavy in kilograms.
  explanations:
    text: We weigh heavy things in kilograms and light things in grams. 1 kilogram is 1000 grams. On a balance, the heavier side goes down.
    visual: 'Draw a balance: a 1 kg packet on one side and four 250 g packets on the other. It stays level.'
    step_by_step: 'Step 1: Change to grams if needed. Step 2: Compare or add. Step 3: Write the unit.'
    real_world: Vegetable sellers weigh onions and tomatoes on a balance in the market.
  picture:
    kind: bars
    bars:
    - label: 1/4 kg
      value: 250
    - label: 1/2 kg
      value: 500
    - label: 1 kg
      value: 1000
    alt: A quarter kilogram is 250 grams, half a kilogram 500 grams, and one kilogram 1000 grams.
    unit: g
  activity:
    type: sort
    prompt: Would you weigh it in kilograms or grams?
    bins:
    - Kilograms
    - Grams
    items:
    - label: A sack of rice
      bin: Kilograms
      clue: Heavy to lift.
      why: Kilograms.
    - label: A child
      bin: Kilograms
      clue: Too heavy for a kitchen scale.
      why: Kilograms.
    - label: A watermelon
      bin: Kilograms
      clue: Heavy fruit.
      why: A few kilograms.
    - label: A bag of cement
      bin: Kilograms
      clue: Very heavy.
      why: Kilograms.
    - label: A pencil
      bin: Grams
      clue: Very light.
      why: Grams.
    - label: An eraser
      bin: Grams
      clue: Tiny and light.
      why: Grams.
    - label: A letter
      bin: Grams
      clue: Just paper.
      why: Grams.
    - label: A spoon
      bin: Grams
      clue: Light in your hand.
      why: Grams.
  items:
  - prompt: How many grams are in 1 kg?
    answer: '1000'
    check: '1000'
    difficulty: 1
    hints:
    - Kilo means thousand.
    - '1000.'
    solution: 1 kg = 1000 g.
    mistakes:
      '100': c4_kg_g
  - prompt: How many grams are in half a kg?
    answer: '500'
    check: 1000/2
    difficulty: 1
    hints:
    - Half of 1000.
    - 1000 ÷ 2.
    solution: 500 g.
  - prompt: On a balance, which side goes down?
    options:
    - the heavier side
    - the lighter side
    - both sides
    - the left side always
    answer: the heavier side
    difficulty: 1
    hints:
    - Think of a see-saw.
    - Heavy sinks.
    solution: The heavier side goes down.
  - prompt: Which is weighed in grams?
    options:
    - a pencil
    - a sack of rice
    - a goat
    - a scooter
    answer: a pencil
    difficulty: 1
    hints:
    - Grams are for light things.
    - Smallest.
    solution: 'A pencil is light: grams.'
  - prompt: How many 250 g packets make 1 kg?
    answer: '4'
    check: 1000/250
    difficulty: 2
    hints:
    - 1000 ÷ 250.
    - Four quarters.
    solution: 1000 ÷ 250 = 4.
  - prompt: Amma buys 2 kg of rice and 500 g of dal. How many grams in all?
    answer: '2500'
    check: 2000+500
    difficulty: 2
    hints:
    - 2 kg = 2000 g.
    - 2000 + 500.
    solution: 2000 + 500 = 2,500 g.
    mistakes:
      '502': c4_kg_g
- code: cbse4m.weigh.litre
  title: Litres and millilitres
  after:
  - cbse4m.weigh.kg
  notes: |
    Capacity in litres (L) and millilitres (mL): 1 L = 1000 mL; a glass ≈ 200 mL; a bucket ≈ 10 L. Pouring tells how many
    small containers fill a big one: 1 L fills 5 glasses of 200 mL.
  explanations:
    text: Liquids are measured in litres and millilitres. 1 litre is 1000 millilitres. A glass holds about 200 mL, so a 1 litre bottle fills about 5 glasses.
    visual: Draw a 1 litre bottle and five glasses of 200 mL in a row.
    step_by_step: 'Step 1: Change both amounts to mL. Step 2: Divide the big amount by the small one.'
    real_world: Milk packets come in 500 mL and 1 L; water bottles often hold 1 L.
  picture:
    kind: flow
    steps:
    - 1 L bottle = 1000 mL
    - Glass = 200 mL
    - 1000 ÷ 200 = 5
    - Fills 5 glasses
    alt: A 1 litre bottle of 1000 millilitres fills 5 glasses of 200 millilitres.
  activity:
    type: number_line
    min: 0
    max: 2000
    step: 50
    start: 0
    prompt: The line is in millilitres (mL). 1 litre = 1000 mL. Mark each amount.
    goals:
    - prompt: 1 litre
      target: 1000
      mistakes:
      - when:
          v: 100
        say: 1 litre is 1000 mL, not 100.
      - when:
          v: 2000
        say: That's 2 litres.
    - prompt: Half a litre
      target: 500
      mistakes:
      - when:
          v: 50
        say: Half of 1000 mL is 500 mL.
      - when:
          v: 1000
        say: That's a whole litre.
    - prompt: 1 litre 500 mL
      target: 1500
      mistakes:
      - when:
          v: 1050
        say: That's 1 L 50 mL. Here it's 500 mL more.
      - when:
          v: 500
        say: 'Don''t forget the 1 litre: that''s 1000 mL.'
  items:
  - prompt: How many mL are in 1 litre?
    answer: '1000'
    check: '1000'
    difficulty: 1
    hints:
    - Milli means thousandth.
    - '1000.'
    solution: 1 L = 1000 mL.
    mistakes:
      '100': c4_kg_g
  - prompt: A 1 L bottle fills glasses of 200 mL. How many glasses?
    answer: '5'
    check: 1000/200
    difficulty: 1
    hints:
    - 1000 ÷ 200.
    - Count by 200s.
    solution: 1000 ÷ 200 = 5.
  - prompt: Which holds about 10 litres?
    options:
    - a bucket
    - a spoon
    - a cup
    - a bottle cap
    answer: a bucket
    difficulty: 1
    hints:
    - Biggest.
    - For bathing.
    solution: A bucket holds about 10 L.
  - prompt: Two 500 mL milk packets make how many mL?
    answer: '1000'
    check: 500+500
    difficulty: 1
    hints:
    - 500 + 500.
    - That is 1 litre.
    solution: 500 + 500 = 1,000 mL.
  - prompt: A jug has 1 L of juice. 300 mL is poured out. How many mL are left?
    answer: '700'
    check: 1000-300
    difficulty: 1
    hints:
    - 1000 − 300.
    - Take away.
    solution: 1,000 − 300 = 700 mL.
  - prompt: A family drinks 3 L of water each day. How many litres in a week?
    answer: '21'
    check: 3*7
    difficulty: 2
    hints:
    - 7 days.
    - 3 × 7.
    solution: 3 × 7 = 21 L.
