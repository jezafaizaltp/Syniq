# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 1
title: Shapes Around Us
tips:
  c4_count_once: Touch each side or corner as you count it, so you count every one exactly once.
  c4_place: 'Read the digits from the left: thousands, hundreds, tens, ones.'
  m4_cone: "Picture the shape of an ice-cream holder: round at the top, pointed at the bottom. Which solid is like that?"
  m4_cuboid: "A brick has 6 flat rectangular faces, like a box."
  m4_dice: "A dice has 6 flat square faces, all the same size."
  m4_door: "A door is tall and flat with 4 straight sides, longer than it is wide."
  m4_four_equal: "A long rectangle has two long sides and two short ones. Which shape's sides all match?"
  m4_roll_slide: "A sphere only rolls. To slide too, a shape needs a flat face as well as a curved one."
  m4_sphere: "A ball is round all over with no flat faces."
  m4_square_corners: "Touch each corner of a square book with your finger and count."
  m4_tri: "'Tri' means three, like a tricycle's wheels."
concepts:
- code: cbse4m.shape.flat
  title: 'Flat shapes: sides and corners'
  notes: |
    Flat (2D) shapes: triangle 3 sides and 3 corners; square 4 equal sides; rectangle 4 sides, opposite sides equal;
    circle no corners, no straight sides; pentagon 5; hexagon 6. Corners are also called vertices. Shapes are all
    around us: a roti is a circle, a door is a rectangle, a samosa looks like a triangle.
  explanations:
    text: Look at the edges and corners. A triangle has 3 straight sides and 3 corners. A square has 4 equal sides. A rectangle has 4 sides with the opposite sides equal. A circle is round, with no corners at all.
    visual: Draw a triangle, a square, a rectangle and a circle. Put a dot on every corner and count the dots.
    step_by_step: 'Step 1: Count the straight sides. Step 2: Count the corners. Step 3: Name the shape.'
    real_world: A roti is round like a circle, a door is a rectangle, a carrom board is a square.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Triangle
      - Square
      - Circle
    - title: Sides
      points:
      - '3'
      - 4 equal
      - none straight
    alt: A triangle has 3 sides, a square 4 equal sides, and a circle no straight sides.
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Triangle
    - Square
    - Rectangle
    - Circle
    items:
    - label: 3 straight sides
      bin: Triangle
      clue: Count the sides.
      why: '3 sides: a triangle.'
    - label: A slice of watermelon cut flat
      bin: Triangle
      clue: How many corners does the wedge have?
      why: 3 corners.
    - label: 4 equal sides, 4 corners like a book's
      bin: Square
      clue: Are all the sides the same?
      why: 'All equal: a square.'
    - label: A chessboard
      bin: Square
      clue: Every side the same length.
      why: A square.
    - label: 4 sides, the long ones opposite each other
      bin: Rectangle
      clue: Two long sides, two short ones.
      why: A rectangle.
    - label: A door
      bin: Rectangle
      clue: Taller than it is wide.
      why: A rectangle.
    - label: A round shape with no corners
      bin: Circle
      clue: Any corners at all?
      why: 'None: a circle.'
    - label: A one-rupee coin
      bin: Circle
      clue: Roll it on its edge.
      why: A circle.
  items:
  - prompt: How many sides does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Tri means three.
    - Count the straight lines.
    solution: A triangle has 3 sides.
    mistakes: {"4": "m4_tri", "2": "m4_tri"}
  - prompt: How many corners does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Look at a carrom board.
    - One in each corner.
    solution: A square has 4 corners.
    mistakes: {"3": "m4_square_corners", "8": "m4_square_corners"}
  - prompt: Which shape has no corners?
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - It is round.
    - Like a roti.
    solution: A circle has no corners.
    mistakes: {"triangle": "m5_no_corners"}
  - prompt: 'A door is usually shaped like a:'
    options:
    - rectangle
    - circle
    - triangle
    - hexagon
    answer: rectangle
    difficulty: 1
    hints:
    - It is longer than it is wide.
    - Four corners.
    solution: A door is a rectangle.
    mistakes: {"circle": "m4_door"}
  - prompt: How many sides does a hexagon have?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Think of a honeycomb cell.
    - Hex means six.
    solution: A hexagon has 6 sides.
    mistakes:
      '5': c4_count_once
  - prompt: Which shape has 4 equal sides?
    options:
    - square
    - rectangle that is long
    - triangle
    - circle
    answer: square
    difficulty: 1
    hints:
    - All sides the same.
    - Carrom board.
    solution: A square has 4 equal sides.
    mistakes: {"rectangle that is long": "m4_four_equal"}
- code: cbse4m.shape.solid
  title: Solid shapes
  after:
  - cbse4m.shape.flat
  notes: |
    Solid (3D) shapes: cube (dice, 6 square faces), cuboid (brick, matchbox), cylinder (a pipe or tin), cone (ice-cream
    cone, a party hat), sphere (a ball). Solids have faces (flat surfaces), edges (where faces meet) and corners. A
    sphere rolls; a cube slides; a cylinder can do both.
  explanations:
    text: Solid shapes are things you can hold. A dice is a cube, a brick is a cuboid, a ball is a sphere, a tin is a cylinder and an ice-cream cone is a cone. Some roll, some slide, and some do both.
    visual: Draw a dice, a ball, a tin can and an ice-cream cone. Label them cube, sphere, cylinder and cone.
    step_by_step: 'Step 1: Look at the object. Step 2: Does it have flat faces, curved faces or both? Step 3: Name the solid.'
    real_world: Laddoos are spheres, a tabla is like a cylinder, and a box of sweets is a cuboid.
  picture:
    kind: compare
    columns:
    - title: Solid
      points:
      - Cube
      - Sphere
      - Cylinder
    - title: Example
      points:
      - dice
      - ball, laddoo
      - tin, pipe
    alt: A cube is like a dice, a sphere like a ball or laddoo, and a cylinder like a tin or pipe.
  activity:
    type: sort
    prompt: Which solid shape is it?
    bins:
    - Cube
    - Cuboid
    - Sphere
    - Cylinder
    - Cone
    items:
    - label: A dice
      bin: Cube
      clue: All its faces are the same square.
      why: A cube.
    - label: A sugar cube
      bin: Cube
      clue: Same length every way.
      why: A cube.
    - label: A brick
      bin: Cuboid
      clue: Long and flat-faced.
      why: A cuboid.
    - label: A matchbox
      bin: Cuboid
      clue: Rectangle faces.
      why: A cuboid.
    - label: A football
      bin: Sphere
      clue: Round from every side.
      why: A sphere.
    - label: A laddoo
      bin: Sphere
      clue: Round all over.
      why: A sphere.
    - label: A tin of milk powder
      bin: Cylinder
      clue: Round top and bottom, straight sides.
      why: A cylinder.
    - label: An ice-cream cone
      bin: Cone
      clue: Round at the top, pointy at the bottom.
      why: A cone.
    - label: A birthday cap
      bin: Cone
      clue: Comes to a point.
      why: A cone.
  items:
  - prompt: 'A ball is a:'
    options:
    - sphere
    - cube
    - cone
    - cuboid
    answer: sphere
    difficulty: 1
    hints:
    - It is round all over.
    - It rolls everywhere.
    solution: A ball is a sphere.
    mistakes: {"cube": "m4_sphere"}
  - prompt: 'A dice is a:'
    options:
    - cube
    - sphere
    - cylinder
    - cone
    answer: cube
    difficulty: 1
    hints:
    - All faces are squares.
    - Six faces.
    solution: A dice is a cube.
    mistakes: {"cylinder": "m4_dice"}
  - prompt: How many faces does a cube have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - 'Think of a dice: 1 to 6.'
    - Count.
    solution: A cube has 6 faces.
    mistakes: {"4": "m5_cube_faces", "8": "m5_cube_faces"}
  - prompt: Which shape can both roll and slide?
    options:
    - cylinder
    - cube
    - cuboid
    - sphere
    answer: cylinder
    difficulty: 2
    hints:
    - It has flat ends and a curved side.
    - Like a tin.
    solution: A cylinder rolls on its side and slides on its flat end.
    mistakes: {"sphere": "m4_roll_slide"}
  - prompt: 'An ice-cream cone is shaped like a:'
    options:
    - cone
    - cylinder
    - cube
    - sphere
    answer: cone
    difficulty: 1
    hints:
    - Pointed at the bottom.
    - Round at the top.
    solution: It is a cone.
    mistakes: {"cylinder": "m4_cone"}
  - prompt: 'A brick is shaped like a:'
    options:
    - cuboid
    - sphere
    - cone
    - cylinder
    answer: cuboid
    difficulty: 1
    hints:
    - Like a box.
    - Rectangle faces.
    solution: A brick is a cuboid.
    mistakes: {"cylinder": "m4_cuboid"}
