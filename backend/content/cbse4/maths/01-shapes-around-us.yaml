# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 1
title: Shapes Around Us
tips:
  c4_count_once: Touch each side or corner as you count it, so you count every one exactly once.
  c4_shape_place: 'Read the digits from the left: thousands, hundreds, tens, ones.'
  m4_cone: "Picture the shape of an ice-cream holder: round at the top, pointed at the bottom. Which solid is like that?"
  m4_cuboid: "A brick has 6 flat rectangular faces, like a box."
  m4_dice: "A dice has 6 flat square faces, all the same size."
  m4_door: "A door is tall and flat with 4 straight sides, longer than it is wide."
  m4_four_equal: "A long rectangle has two long sides and two short ones. Which shape's sides all match?"
  m4_roll_slide: "A sphere only rolls. To slide too, a shape needs a flat face as well as a curved one."
  m4_sphere: "A ball is round all over with no flat faces."
  m4_square_corners: "Touch each corner of a square book with your finger and count."
  m4_tri: "'Tri' means three, like a tricycle's wheels."
  c4m1_trace: Trace the shape with your finger and count each straight side as you go.
  c4m1_corner: A corner is where two straight sides meet. Put a dot on each one, then count the dots.
  c4m1_solid: 'Think how the object feels in your hand: is it flat like paper, or does it have thickness?'
  c4m1_move: 'Try it in your head on a slope: does a curved surface let it roll? Does a flat face let it slide?'
concepts:
- code: cbse4m.shape.flat
  title: 'Flat shapes: sides and corners'
  notes: |
    Flat (2D) shapes: triangle 3 sides and 3 corners; square 4 equal sides; rectangle 4 sides, opposite sides equal;
    circle no corners, no straight sides; pentagon 5; hexagon 6. Corners are also called vertices. Shapes are all
    around us: a roti is a circle, a door is a rectangle, a samosa looks like a triangle.
  explanations:
    text: Look at the edges and corners. A triangle has 3 straight sides and 3 corners. A square has 4 equal sides. A rectangle has 4 sides with the opposite sides equal. A circle is round, with no corners at all.
    visual: Draw a triangle, a square, a rectangle and a circle. Put a dot on every corner and count the dots.
    step_by_step: 'Step 1: Count the straight sides. Step 2: Count the corners. Step 3: Name the shape.'
    real_world: A roti is round like a circle, a door is a rectangle, a carrom board is a square.
  picture:
    kind: compare
    columns:
    - title: Shape
      points:
      - Triangle
      - Square
      - Circle
    - title: Sides
      points:
      - '3'
      - 4 equal
      - none straight
    alt: A triangle has 3 sides, a square 4 equal sides, and a circle no straight sides.
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Triangle
    - Square
    - Rectangle
    - Circle
    items:
    - label: 3 straight sides
      bin: Triangle
      clue: Count the sides.
      why: '3 sides: a triangle.'
    - label: A slice of watermelon cut flat
      bin: Triangle
      clue: How many corners does the wedge have?
      why: 3 corners.
    - label: 4 equal sides, 4 corners like a book's
      bin: Square
      clue: Are all the sides the same?
      why: 'All equal: a square.'
    - label: A chessboard
      bin: Square
      clue: Every side the same length.
      why: A square.
    - label: 4 sides, the long ones opposite each other
      bin: Rectangle
      clue: Two long sides, two short ones.
      why: A rectangle.
    - label: A door
      bin: Rectangle
      clue: Taller than it is wide.
      why: A rectangle.
    - label: A round shape with no corners
      bin: Circle
      clue: Any corners at all?
      why: 'None: a circle.'
    - label: A one-rupee coin
      bin: Circle
      clue: Roll it on its edge.
      why: A circle.
  lesson:
    - teach: A flat (2D) shape lies flat on paper. We name it by counting its straight sides. 3 sides make a triangle, 4 sides a quadrilateral (like a square or rectangle), 5 a pentagon, 6 a hexagon.
      check:
        prompt: A shape has 5 straight sides. What is it called?
        options:
        - pentagon
        - hexagon
        - triangle
        answer: pentagon
        why: 'Penta means five: 5 sides make a pentagon.'
      ways:
      - style: visual
        teach: Flat shapes are named by how many straight sides they have.
        picture:
          kind: compare
          columns:
          - title: Straight sides
            points:
            - '3'
            - '4'
            - '5'
            - '6'
          - title: Name
            points:
            - Triangle
            - Quadrilateral
            - Pentagon
            - Hexagon
          alt: A flat shape with 3 straight sides is a triangle, 4 sides a quadrilateral, 5 sides a pentagon and 6 sides a hexagon.
      - style: step_by_step
        teach: 'Name a shape by counting. Step 1: Put your finger on one corner. Step 2: Slide along a side and count 1. Step 3: Keep going round, counting each straight side, until you are back where you started. Step 4: Match the count to a name.'
    - teach: Where two sides meet we get a corner (also called a vertex). In a shape made of straight sides, the number of corners is the same as the number of sides.
      picture:
        kind: compare
        columns:
        - title: Triangle
          points:
          - 3 sides
          - 3 corners
        - title: Square
          points:
          - 4 equal sides
          - 4 corners
        - title: Hexagon
          points:
          - 6 sides
          - 6 corners
        alt: 'Triangle, square and hexagon: sides and corners are equal in number.'
      check:
        prompt: A hexagon has 6 sides. How many corners does it have?
        options:
        - '6'
        - '5'
        - '8'
        answer: '6'
        why: Sides and corners match in straight-sided shapes.
      ways:
      - style: step_by_step
        teach: 'Check that sides and corners match. Step 1: Draw any shape with straight sides. Step 2: Put a dot on every corner and count the dots. Step 3: Count the sides. Step 4: The two counts are always the same.'
      - style: real_world
        teach: A road sign that says STOP has 8 sides and 8 corners. Signs come in different shapes so drivers can recognise them quickly, even from far away.
    - teach: 'A square has 4 equal sides. A rectangle has 4 sides with opposite sides equal. A circle has no straight sides and no corners. Look around: a roti is a circle, a door is a rectangle.'
      check:
        prompt: Which shape has no corners at all?
        options:
        - circle
        - square
        - triangle
        answer: circle
        why: A circle is one smooth curve; nowhere do two sides meet.
      ways:
      - style: visual
        teach: Square, rectangle and circle compared by their sides and corners.
        picture:
          kind: compare
          columns:
          - title: Square
            points:
            - 4 sides, all equal
            - 4 corners
          - title: Rectangle
            points:
            - 4 sides, opposite ones equal
            - 4 corners
          - title: Circle
            points:
            - No straight sides
            - No corners
          alt: A square has 4 equal sides and 4 corners. A rectangle has 4 sides with opposite sides equal, and 4 corners. A circle has no straight sides and no corners.
      - style: real_world
        teach: 'Look around your classroom: the blackboard and the window panes are rectangles, a wall clock is a circle, and many floor tiles are squares.'
  items:
  - prompt: How many sides does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Tri means three.
    - Count the straight lines.
    solution: A triangle has 3 sides.
    mistakes: {"4": "m4_tri", "2": "m4_tri"}
  - prompt: How many corners does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Look at a carrom board.
    - One in each corner.
    solution: A square has 4 corners.
    mistakes: {"3": "m4_square_corners", "8": "m4_square_corners"}
  - prompt: Which shape has no corners?
    options:
    - circle
    - square
    - triangle
    - rectangle
    answer: circle
    difficulty: 1
    hints:
    - It is round.
    - Like a roti.
    solution: A circle has no corners.
    mistakes: {"triangle": "m5_no_corners"}
  - prompt: 'A door is usually shaped like a:'
    options:
    - rectangle
    - circle
    - triangle
    - hexagon
    answer: rectangle
    difficulty: 1
    hints:
    - It is longer than it is wide.
    - Four corners.
    solution: A door is a rectangle.
    mistakes: {"circle": "m4_door"}
  - prompt: How many sides does a hexagon have?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Think of a honeycomb cell.
    - Hex means six.
    solution: A hexagon has 6 sides.
    mistakes:
      '5': c4_count_once
  - prompt: Which shape has 4 equal sides?
    options:
    - square
    - rectangle that is long
    - triangle
    - circle
    answer: square
    difficulty: 1
    hints:
    - All sides the same.
    - Carrom board.
    solution: A square has 4 equal sides.
    mistakes: {"rectangle that is long": "m4_four_equal"}
  - prompt: How many corners does a pentagon have?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count the sides first.
    - In straight-sided shapes, sides and corners match.
    solution: 'Step 1: A pentagon has 5 sides. Step 2: So it has 5 corners.'
    mistakes:
      '6': c4m1_corner
      '4': c4m1_corner
  - prompt: Two triangles together have how many sides in all?
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - How many sides does one triangle have?
    - Add that number twice.
    solution: 'Step 1: One triangle has 3 sides. Step 2: 3 + 3 = 6.'
    mistakes:
      '3': c4m1_trace
      '5': c4m1_trace
  - prompt: A rectangle has two long sides of 8 cm. How long is the other long side?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - Which sides of a rectangle are equal?
    - Opposite sides match.
    solution: 'Step 1: Opposite sides of a rectangle are equal. Step 2: The other long side is also 8 cm.'
    mistakes:
      '4': c4m1_trace
      '16': c4m1_trace
  - prompt: Which of these is shaped like a triangle?
    options:
    - a slice of watermelon cut from a round piece
    - a coin
    - a book cover
    answer: a slice of watermelon cut from a round piece
    difficulty: 2
    hints:
    - A coin is round; a book cover has 4 corners.
    - Which one comes to a point?
    solution: 'Step 1: A coin is a circle; a book cover is a rectangle. Step 2: The slice comes to a point like a triangle.'
    mistakes:
      a coin: c4m1_corner
      a book cover: c4m1_corner
  - prompt: A square has one side 5 cm. What is the total length of all its sides?
    answer: '20'
    check: 5*4
    difficulty: 2
    hints:
    - All sides of a square are equal.
    - How many sides are there to add?
    solution: 'Step 1: 4 equal sides of 5 cm. Step 2: 5 × 4 = 20 cm.'
    mistakes:
      '10': c4m1_trace
      '25': c4m1_trace
      '15': c4m1_trace
  - prompt: How many corners do a square and a triangle have together?
    answer: '7'
    check: 4+3
    difficulty: 2
    hints:
    - Count corners of each shape separately.
    - Then add.
    solution: 'Step 1: Square 4 corners, triangle 3. Step 2: 4 + 3 = 7.'
    mistakes:
      '6': c4m1_corner
      '8': c4m1_corner
  - prompt: Which shape is a rangoli tile with 6 equal sides?
    options:
    - hexagon
    - pentagon
    - rectangle
    answer: hexagon
    difficulty: 1
    hints:
    - 'Count: 6 sides.'
    - Honeycomb cells have this shape.
    solution: 'Step 1: 6 sides. Step 2: A 6-sided shape is a hexagon.'
    mistakes:
      pentagon: c4m1_trace
      rectangle: c4m1_trace
  - prompt: A fence goes around a triangle-shaped garden with sides 4 m, 5 m and 6 m. How long is the fence?
    answer: '15'
    check: 4+5+6
    difficulty: 3
    hints:
    - The fence covers every side once.
    - Add all three sides.
    solution: 'Step 1: Add the sides: 4 + 5 = 9. Step 2: 9 + 6 = 15 m.'
    mistakes:
      '11': c4m1_trace
      '120': c4m1_trace
      '9': c4m1_trace
  - prompt: Which is true about every square?
    options:
    - It is also a rectangle with all sides equal
    - It has 3 equal sides
    - It has curved sides
    answer: It is also a rectangle with all sides equal
    difficulty: 3
    hints:
    - A rectangle needs opposite sides equal and square corners.
    - Does a square have those too?
    solution: 'Step 1: A square has square corners and opposite sides equal, like a rectangle. Step 2: Plus all 4 sides are equal.'
    mistakes:
      It has 3 equal sides: c4m1_corner
      It has curved sides: c4m1_corner
  - prompt: 'Case: Asha makes a photo frame shaped like a square using sticks. Each stick is 7 cm long, and one stick makes one side. How many centimetres of stick does Asha use in all?'
    options:
    - 28 cm
    - 14 cm
    - 21 cm
    answer: 28 cm
    hints:
    - How many sides does a square have?
    - Are all the sides the same length?
    solution: A square has 4 equal sides. 7 + 7 + 7 + 7 = 28 cm.
    mistakes:
      14 cm: c4m1_trace
      21 cm: c4m1_trace
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are drawing a sign with 5 straight sides for a class play. How many corners will your sign have?'
    options:
    - '5'
    - '4'
    - '10'
    answer: '5'
    hints:
    - Where do two sides meet?
    - In a shape with straight sides, how do the counts of sides and corners compare?
    solution: In a shape with straight sides, there are as many corners as sides. 5 sides give 5 corners.
    mistakes:
      '4': c4m1_corner
      '10': c4m1_corner
    exam: competency
    difficulty: 2
- code: cbse4m.shape.solid
  title: Solid shapes
  after:
  - cbse4m.shape.flat
  notes: |
    Solid (3D) shapes: cube (dice, 6 square faces), cuboid (brick, matchbox), cylinder (a pipe or tin), cone (ice-cream
    cone, a party hat), sphere (a ball). Solids have faces (flat surfaces), edges (where faces meet) and corners. A
    sphere rolls; a cube slides; a cylinder can do both.
  explanations:
    text: Solid shapes are things you can hold. A dice is a cube, a brick is a cuboid, a ball is a sphere, a tin is a cylinder and an ice-cream cone is a cone. Some roll, some slide, and some do both.
    visual: Draw a dice, a ball, a tin can and an ice-cream cone. Label them cube, sphere, cylinder and cone.
    step_by_step: 'Step 1: Look at the object. Step 2: Does it have flat faces, curved faces or both? Step 3: Name the solid.'
    real_world: Laddoos are spheres, a tabla is like a cylinder, and a box of sweets is a cuboid.
  picture:
    kind: compare
    columns:
    - title: Solid
      points:
      - Cube
      - Sphere
      - Cylinder
    - title: Example
      points:
      - dice
      - ball, laddoo
      - tin, pipe
    alt: A cube is like a dice, a sphere like a ball or laddoo, and a cylinder like a tin or pipe.
  activity:
    type: sort
    prompt: Which solid shape is it?
    bins:
    - Cube
    - Cuboid
    - Sphere
    - Cylinder
    - Cone
    items:
    - label: A dice
      bin: Cube
      clue: All its faces are the same square.
      why: A cube.
    - label: A sugar cube
      bin: Cube
      clue: Same length every way.
      why: A cube.
    - label: A brick
      bin: Cuboid
      clue: Long and flat-faced.
      why: A cuboid.
    - label: A matchbox
      bin: Cuboid
      clue: Rectangle faces.
      why: A cuboid.
    - label: A football
      bin: Sphere
      clue: Round from every side.
      why: A sphere.
    - label: A laddoo
      bin: Sphere
      clue: Round all over.
      why: A sphere.
    - label: A tin of milk powder
      bin: Cylinder
      clue: Round top and bottom, straight sides.
      why: A cylinder.
    - label: An ice-cream cone
      bin: Cone
      clue: Round at the top, pointy at the bottom.
      why: A cone.
    - label: A birthday cap
      bin: Cone
      clue: Comes to a point.
      why: A cone.
  lesson:
    - teach: Solid (3D) shapes take up space; you can hold them. A dice is a cube, a brick is a cuboid, a tin is a cylinder, a party hat is a cone and a ball is a sphere.
      check:
        prompt: 'A tin of paint is shaped like a:'
        options:
        - cylinder
        - cone
        - cube
        answer: cylinder
        why: A tin has two flat round ends and a curved side.
      ways:
      - style: visual
        teach: Everyday objects and the solid shape that each one is.
        picture:
          kind: compare
          columns:
          - title: Object
            points:
            - Dice
            - Brick
            - Tin
            - Party hat
            - Ball
          - title: Solid shape
            points:
            - Cube
            - Cuboid
            - Cylinder
            - Cone
            - Sphere
          alt: A dice is a cube, a brick is a cuboid, a tin is a cylinder, a party hat is a cone and a ball is a sphere.
      - style: real_world
        teach: In the kitchen, a matchbox is a cuboid, a steel glass is close to a cylinder, a laddoo is a sphere and a funnel is shaped like a cone.
    - teach: A solid has faces (flat surfaces), edges (where two faces meet) and corners. A cube has 6 square faces, 12 edges and 8 corners.
      picture:
        kind: compare
        columns:
        - title: Cube (dice)
          points:
          - 6 faces
          - 12 edges
          - 8 corners
        - title: Cuboid (brick)
          points:
          - 6 faces
          - 12 edges
          - 8 corners
        - title: Sphere (ball)
          points:
          - no flat face
          - no edge
          - no corner
        alt: Faces, edges and corners of a cube, cuboid and sphere.
      check:
        prompt: How many corners does a cube have?
        options:
        - '8'
        - '6'
        - '12'
        answer: '8'
        why: 4 corners on top and 4 at the bottom.
      ways:
      - style: step_by_step
        teach: 'Count the parts of a cube. Step 1: Hold a dice and count its flat faces as you turn it. Step 2: Run a finger along each line where two faces meet: these are edges. Step 3: Touch each pointed corner. Write down all three counts.'
      - style: real_world
        teach: 'Building blocks are easy to stack because they have flat faces. Engineers use the same idea: most buildings are made of cuboid bricks that sit firmly on each other.'
    - teach: 'Curved surfaces roll; flat faces slide. A sphere only rolls. A cube only slides. A cylinder can do both: on its curved side it rolls, on its flat end it slides.'
      check:
        prompt: 'A cone lying on its side will mostly:'
        options:
        - roll in a circle
        - slide straight
        - stay still like a cube
        answer: roll in a circle
        why: Its curved side rolls, but the point stays in one place, so it goes round.
      ways:
      - style: visual
        teach: Which solids roll, which slide and which do both.
        picture:
          kind: compare
          columns:
          - title: Only rolls
            points:
            - Sphere
          - title: Only slides
            points:
            - Cube
            - Cuboid
          - title: Rolls and slides
            points:
            - Cylinder
          alt: A sphere only rolls. A cube and a cuboid only slide. A cylinder can both roll and slide.
      - style: real_world
        teach: To move a heavy drum, workers tip it on its side and roll it. To keep the same drum still on a truck, they stand it up on its flat end so it cannot roll away.
  items:
  - prompt: 'A ball is a:'
    options:
    - sphere
    - cube
    - cone
    - cuboid
    answer: sphere
    difficulty: 1
    hints:
    - It is round all over.
    - It rolls everywhere.
    solution: A ball is a sphere.
    mistakes: {"cube": "m4_sphere"}
  - prompt: 'A dice is a:'
    options:
    - cube
    - sphere
    - cylinder
    - cone
    answer: cube
    difficulty: 1
    hints:
    - All faces are squares.
    - Six faces.
    solution: A dice is a cube.
    mistakes: {"cylinder": "m4_dice"}
  - prompt: How many faces does a cube have?
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - 'Think of a dice: 1 to 6.'
    - Count.
    solution: A cube has 6 faces.
    mistakes: {"4": "m5_cube_faces", "8": "m5_cube_faces"}
  - prompt: Which shape can both roll and slide?
    options:
    - cylinder
    - cube
    - cuboid
    - sphere
    answer: cylinder
    difficulty: 2
    hints:
    - It has flat ends and a curved side.
    - Like a tin.
    solution: A cylinder rolls on its side and slides on its flat end.
    mistakes: {"sphere": "m4_roll_slide"}
  - prompt: 'An ice-cream cone is shaped like a:'
    options:
    - cone
    - cylinder
    - cube
    - sphere
    answer: cone
    difficulty: 1
    hints:
    - Pointed at the bottom.
    - Round at the top.
    solution: It is a cone.
    mistakes: {"cylinder": "m4_cone"}
  - prompt: 'A brick is shaped like a:'
    options:
    - cuboid
    - sphere
    - cone
    - cylinder
    answer: cuboid
    difficulty: 1
    hints:
    - Like a box.
    - Rectangle faces.
    solution: A brick is a cuboid.
    mistakes: {"cylinder": "m4_cuboid"}
  - prompt: How many edges does a cube have?
    answer: '12'
    check: '12'
    difficulty: 2
    hints:
    - Count the edges on top, then at the bottom.
    - Then count the standing edges in between.
    solution: 'Step 1: 4 on top + 4 at the bottom = 8. Step 2: plus 4 standing edges = 12.'
    mistakes:
      '8': c4m1_corner
      '6': c4m1_corner
  - prompt: How many faces do two dice have together?
    answer: '12'
    check: 6*2
    difficulty: 1
    hints:
    - How many faces on one dice?
    - Count them twice.
    solution: 'Step 1: One dice has 6 faces. Step 2: 6 + 6 = 12.'
    mistakes:
      '6': c4m1_solid
      '8': c4m1_solid
  - prompt: Which of these is a sphere?
    options:
    - an orange
    - a matchbox
    - a candle
    answer: an orange
    difficulty: 1
    hints:
    - A sphere is round from every side.
    - Which one is like a small ball?
    solution: 'Step 1: A matchbox is a cuboid; a candle is a cylinder. Step 2: An orange is a sphere.'
    mistakes:
      a matchbox: c4m1_solid
      a candle: c4m1_solid
  - prompt: Which solid has only one flat face and one pointed tip?
    options:
    - cone
    - cylinder
    - cuboid
    answer: cone
    difficulty: 2
    hints:
    - Think of a party hat.
    - Its bottom is a flat circle; the top ends in a point.
    solution: 'Step 1: A cylinder has 2 flat faces, a cuboid 6. Step 2: The cone has 1 flat face and a tip.'
    mistakes:
      cylinder: c4m1_solid
      cuboid: c4m1_solid
  - prompt: Which of these cannot roll at all?
    options:
    - a brick
    - a ball
    - a pipe
    answer: a brick
    difficulty: 1
    hints:
    - Rolling needs a curved surface.
    - Which object has only flat faces?
    solution: 'Step 1: A ball and a pipe have curved surfaces. Step 2: A brick has only flat faces, so it cannot roll.'
    mistakes:
      a ball: c4m1_move
      a pipe: c4m1_move
  - prompt: How many flat faces does a cylinder have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Look at a glass or a tin.
    - Count the top and the bottom.
    solution: 'Step 1: A cylinder has a flat top and a flat bottom. Step 2: That is 2 flat faces (its side is curved).'
    mistakes:
      '1': c4m1_solid
      '3': c4m1_solid
      '0': c4m1_solid
  - prompt: Each face of a cube is what flat shape?
    options:
    - square
    - circle
    - triangle
    answer: square
    difficulty: 1
    hints:
    - Press a dice into clay and look at the mark.
    - All 4 sides of that mark are equal.
    solution: 'Step 1: Every face of a cube has 4 equal sides. Step 2: So each face is a square.'
    mistakes:
      circle: c4m1_solid
      triangle: c4m1_solid
  - prompt: Riya stacks 3 bricks to build a tower. Why is a brick better than a ball for this?
    options:
    - Flat faces sit firmly on each other
    - Bricks roll better
    - Balls are heavier
    answer: Flat faces sit firmly on each other
    difficulty: 2
    hints:
    - What happens if you put one ball on another?
    - Which surfaces stay still on top of each other?
    solution: 'Step 1: A ball rolls off another ball. Step 2: Flat faces of bricks sit firmly, so they stack.'
    mistakes:
      Bricks roll better: c4m1_move
      Balls are heavier: c4m1_move
  - prompt: How many corners do 3 cubes have in all?
    answer: '24'
    check: 8*3
    difficulty: 3
    hints:
