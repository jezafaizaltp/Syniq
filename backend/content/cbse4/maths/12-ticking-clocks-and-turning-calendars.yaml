# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 12
title: Ticking Clocks and Turning Calendars
tips:
  c4_clock: The short hand shows the hour, the long hand the minutes. Each number on the clock means 5 minutes for the long hand.
concepts:
- code: cbse4m.time.clock
  title: Reading the clock
  notes: |
    Short hand = hour; long hand = minutes. Each number = 5 minutes for the long hand: at 3 it is 15 minutes (quarter
    past), at 6 it is 30 (half past), at 9 it is 45 (quarter to). 1 hour = 60 minutes. a.m. before noon, p.m. after
    noon. Duration: from 9:00 to 11:30 is 2 h 30 min.
  explanations:
    text: On a clock, the short hand shows the hour and the long hand shows the minutes. When the long hand points to 3, it is 15 minutes past; to 6, half past; to 9, quarter to the next hour.
    visual: 'Draw a clock showing half past 4: the short hand between 4 and 5, the long hand on 6.'
    step_by_step: 'Step 1: Read the short hand for the hour. Step 2: Count the long hand in fives. Step 3: Say the time.'
    real_world: School starts at 9 a.m.; lunch break at half past 12.
  picture:
    kind: number_line
    from: 0
    to: 60
    step: 15
    points:
    - at: 0
      label: o'clock
    - at: 15
      label: quarter past
    - at: 30
      label: half past
    - at: 45
      label: quarter to
    - at: 60
      label: next hour
    alt: 'Minutes in an hour on a line: 0 o''clock, 15 quarter past, 30 half past, 45 quarter to, 60 the next hour.'
  activity:
    type: number_line
    min: 0
    max: 60
    step: 3
    start: 0
    prompt: Where is the long hand? Mark how many minutes past the hour it shows.
    goals:
    - prompt: The long hand points to 3.
      target: 15
      mistakes:
      - when:
          v: 3
        say: Each number on the clock is 5 minutes. 3 × 5 = 15.
      - when:
          v: 45
        say: That's the 9. The 3 is a quarter of the way round.
    - prompt: The long hand points to 6.
      target: 30
      mistakes:
      - when:
          v: 6
        say: 'Each number is 5 minutes. 6 × 5 = 30: half past.'
    - prompt: The long hand points to 9.
      target: 45
      mistakes:
      - when:
          v: 9
        say: Each number is 5 minutes. 9 × 5.
      - when:
          v: 15
        say: 15 minutes is the 3. The 9 is three quarters of the way round.
  items:
  - prompt: How many minutes are in 1 hour?
    answer: '60'
    check: '60'
    difficulty: 1
    hints:
    - Count the long hand all the way round.
    - 12 × 5.
    solution: 60 minutes.
    mistakes:
      '100': c4_clock
  - prompt: The long hand points to 3. How many minutes past the hour is it?
    answer: '15'
    check: 3*5
    difficulty: 1
    hints:
    - Each number is 5 minutes.
    - 3 × 5.
    solution: 3 × 5 = 15 minutes.
    mistakes:
      '3': c4_clock
  - prompt: The long hand is on 6 and the short hand is between 4 and 5. What time is it?
    options:
    - half past 4
    - 6 o'clock
    - half past 5
    - quarter to 4
    answer: half past 4
    difficulty: 2
    hints:
    - Long hand on 6 = 30 minutes.
    - Short hand past 4.
    solution: It is 4:30, half past 4.
  - prompt: '2 p.m. is:'
    options:
    - in the afternoon
    - in the early morning
    - at midnight
    - before breakfast
    answer: in the afternoon
    difficulty: 1
    hints:
    - p.m. is after noon.
    - After lunch.
    solution: 2 p.m. is afternoon.
  - prompt: A class goes from 9:00 to 9:45. How many minutes is it?
    answer: '45'
    check: '45'
    difficulty: 1
    hints:
    - Count from 9:00.
    - Long hand to 9.
    solution: 45 minutes.
  - prompt: A picnic lasts from 10 a.m. to 1 p.m. How many hours?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - 10 → 11 → 12 → 1.
    - Count the hours.
    solution: 3 hours.
- code: cbse4m.time.calendar
  title: Days, weeks, months and years
  after:
  - cbse4m.time.clock
  notes: |
    1 week = 7 days; 1 year = 12 months = 365 days (366 in a leap year). Months have 30 or 31 days; February has 28 (29 in
    a leap year). Read a calendar: dates in rows of weeks. Find a date 7 days later by going straight down one row.
  explanations:
    text: A week has 7 days and a year has 12 months. Most months have 30 or 31 days, but February has 28, or 29 in a leap year. On a calendar, one week later is the date just below.
    visual: 'Draw a calendar page for one month with 7 columns: Sun to Sat. Circle the 5th and the 12th: one week apart.'
    step_by_step: 'Step 1: Find the date. Step 2: Move along the row for days, down a row for a week. Step 3: Read the new date.'
    real_world: Calendars help us remember birthdays, festivals and school holidays.
  picture:
    kind: bars
    bars:
    - label: Jan
      value: 31
    - label: Feb
      value: 28
    - label: Mar
      value: 31
    - label: Apr
      value: 30
    alt: 'Days in the months: January 31, February 28 (29 in a leap year), March 31, April 30.'
    unit: days
  activity:
    type: number_line
    min: 1
    max: 31
    step: 1
    start: 1
    prompt: Use the calendar. Mark the date.
    goals:
    - prompt: Today is 5 March. What date is one week later?
      target: 12
      mistakes:
      - when:
          v: 6
        say: That's tomorrow. A week is 7 days.
      - when:
          v: 11
        say: 'Count 7 days on from 5: 6, 7, 8, 9, 10, 11, 12.'
    - prompt: Today is the 20th. What date was it two weeks ago?
      target: 6
      mistakes:
      - when:
          v: 13
        say: That's one week ago. Two weeks is 14 days.
      - when:
          v: 18
        say: Two days ago, not two weeks.
    - prompt: Mark the last day of April.
      target: 30
      mistakes:
      - when:
          v: 31
        say: 'April has 30 days. Remember: 30 days have September, April, June and November.'
  items:
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: 7 days.
  - prompt: How many months are in a year?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - January to December.
    - Count them.
    solution: 12 months.
  - prompt: How many days does February have in a leap year?
    answer: '29'
    check: '29'
    difficulty: 2
    hints:
    - Usually 28.
    - One extra in a leap year.
    solution: 29 days.
  - prompt: Today is the 5th. What date is it one week later?
    answer: '12'
    check: 5+7
    difficulty: 1
    hints:
    - Add 7.
    - 5 + 7.
    solution: 5 + 7 = 12th.
  - prompt: How many days are in 3 weeks?
    answer: '21'
    check: 7*3
    difficulty: 1
    hints:
    - 7 × 3.
    - Each week has 7.
    solution: 21 days.
  - prompt: Which month has 30 days?
    options:
    - April
    - January
    - March
    - December
    answer: April
    difficulty: 2
    hints:
    - 30 days hath September, April, June and November.
    - Rhyme.
    solution: April has 30 days.
