# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 12
title: Ticking Clocks and Turning Calendars
tips:
  c4_clock: The short hand shows the hour, the long hand the minutes. Each number on the clock means 5 minutes for the long hand.
  m4_30_days: "Use your knuckles: months on knuckles have 31 days, months in the gaps have fewer."
  m4_hours_noon: "Count on from 10 a.m.: 11, 12 noon, 1 p.m. How many hours?"
  m4_leap: "In most years February has 28 days. A leap year adds one more day."
  m4_minutes_count: "From 9:00 to 9:45 the hour stays the same. Count only the minutes."
  m4_months: "Say the months: January to December. Count them."
  m4_pm: "p.m. means after noon."
  m4_short_hand: "The short hand shows the hour it has passed. Between 4 and 5 means it is after 4."
  m4_week_days: "Say the days: Monday to Sunday. Count them."
  m4_week_later: "A week is 7 days. Add 7 to the date."
  c4m12_hands: The short hand tells the hour; the long hand tells minutes, and each number it passes is 5 minutes.
  c4m12_count: 'Count on: first to the next full hour, then the rest of the minutes. Add the two parts.'
  c4m12_cal: 'Use the calendar facts: 7 days a week, 12 months a year, and the knuckle trick for 30 or 31 days.'
concepts:
- code: cbse4m.time.clock
  title: Reading the clock
  notes: |
    Short hand = hour; long hand = minutes. Each number = 5 minutes for the long hand: at 3 it is 15 minutes (quarter
    past), at 6 it is 30 (half past), at 9 it is 45 (quarter to). 1 hour = 60 minutes. a.m. before noon, p.m. after
    noon. Duration: from 9:00 to 11:30 is 2 h 30 min.
  explanations:
    text: On a clock, the short hand shows the hour and the long hand shows the minutes. When the long hand points to 3, it is 15 minutes past; to 6, half past; to 9, quarter to the next hour.
    visual: 'Draw a clock showing half past 4: the short hand between 4 and 5, the long hand on 6.'
    step_by_step: 'Step 1: Read the short hand for the hour. Step 2: Count the long hand in fives. Step 3: Say the time.'
    real_world: School starts at 9 a.m.; lunch break at half past 12.
  picture:
    kind: number_line
    from: 0
    to: 60
    step: 15
    points:
    - at: 0
      label: o'clock
    - at: 15
      label: quarter past
    - at: 30
      label: half past
    - at: 45
      label: quarter to
    - at: 60
      label: next hour
    alt: 'Minutes in an hour on a line: 0 o''clock, 15 quarter past, 30 half past, 45 quarter to, 60 the next hour.'
  activity:
    type: number_line
    min: 0
    max: 60
    step: 3
    start: 0
    prompt: Where is the long hand? Mark how many minutes past the hour it shows.
    goals:
    - prompt: The long hand points to 3.
      target: 15
      mistakes:
      - when:
          v: 3
        say: Each number on the clock is 5 minutes. 3 × 5 = 15.
      - when:
          v: 45
        say: That's the 9. The 3 is a quarter of the way round.
    - prompt: The long hand points to 6.
      target: 30
      mistakes:
      - when:
          v: 6
        say: 'Each number is 5 minutes. 6 × 5 = 30: half past.'
    - prompt: The long hand points to 9.
      target: 45
      mistakes:
      - when:
          v: 9
        say: Each number is 5 minutes. 9 × 5.
      - when:
          v: 15
        say: 15 minutes is the 3. The 9 is three quarters of the way round.
  lesson:
    - teach: 'A clock has two hands. The short hand shows the hour. The long hand shows minutes: each number on the clock is 5 minutes for the long hand, so at 4 it is 20 minutes past.'
      check:
        prompt: The long hand points to 8. How many minutes past the hour?
        options:
        - '40'
        - '8'
        - '45'
        answer: '40'
        why: 8 × 5 = 40 minutes.
      ways:
      - style: visual
        teach: Where the long hand points and how many minutes past the hour that is.
        picture:
          kind: compare
          columns:
          - title: Long hand at
            points:
            - '2'
            - '5'
            - '8'
            - '10'
          - title: Minutes past
            points:
            - '10'
            - '25'
            - '40'
            - '50'
          alt: When the long hand points at 2, it is 10 minutes past. At 5 it is 25 minutes past, at 8 it is 40 minutes past and at 10 it is 50 minutes past.
      - style: step_by_step
        teach: 'Read a clock. Step 1: Look at the short hand: it is just past 7, so the hour is 7. Step 2: Look at the long hand: it is on 7. Step 3: Count in fives up to 7: 5, 10, 15, 20, 25, 30, 35. Step 4: The time is 7:35.'
    - teach: 'Special times: long hand at 3 is quarter past (15 min), at 6 is half past (30 min), at 9 is quarter to (45 min). 1 hour = 60 minutes.'
      picture:
        kind: compare
        columns:
        - title: Long hand at 3
          points:
          - 15 minutes
          - quarter past
        - title: Long hand at 6
          points:
          - 30 minutes
          - half past
        - title: Long hand at 9
          points:
          - 45 minutes
          - quarter to
        alt: Where the long hand points for quarter past, half past and quarter to.
      check:
        prompt: 'Quarter to 7 is the same as:'
        options:
        - '6:45'
        - '7:15'
        - '7:45'
        answer: '6:45'
        why: 15 minutes before 7:00 is 6:45.
      ways:
      - style: visual
        teach: Quarter past, half past and quarter to, with where the long hand points.
        picture:
          kind: compare
          columns:
          - title: Long hand at 3
            points:
            - Quarter past
            - 15 minutes
          - title: Long hand at 6
            points:
            - Half past
            - 30 minutes
          - title: Long hand at 9
            points:
            - Quarter to
            - 45 minutes
          alt: When the long hand is at 3 it is quarter past, 15 minutes. At 6 it is half past, 30 minutes. At 9 it is quarter to, 45 minutes.
      - style: real_world
        teach: People often say 'quarter to eight' instead of 7:45. It means there are 15 minutes left before 8 o'clock, the time a school day might start.
    - teach: 'a.m. means before noon (morning); p.m. means after noon. To find how long something takes, count on: 9:00 to 11:30 is 2 hours, then 30 minutes more, so 2 h 30 min.'
      check:
        prompt: School starts at 8 a.m. and ends at 2 p.m. How many hours?
        options:
        - '6'
        - '10'
        - '4'
        answer: '6'
        why: '8 to 12 is 4 hours, 12 to 2 is 2 more: 6.'
      ways:
      - style: visual
        teach: Counting on from 7:20 to 9:10 in two jumps.
        picture:
          kind: flow
          steps:
          - Start at 7:20
          - To 9:00 is 1 hour 40 minutes
          - From 9:00 to 9:10 is 10 minutes
          - 'Total: 1 hour 50 minutes'
          alt: From 7:20 to 9:00 is 1 hour 40 minutes, and from 9:00 to 9:10 is 10 minutes more. The total is 1 hour 50 minutes.
      - style: real_world
        teach: Train tickets show times like 06:40 or 18:40. The evening times are written after 12, so 18:40 means 6:40 p.m. That is how railways avoid mixing up a.m. and p.m.
  items:
  - prompt: How many minutes are in 1 hour?
    answer: '60'
    check: '60'
    difficulty: 1
    hints:
    - Count the long hand all the way round.
    - 12 × 5.
    solution: 60 minutes.
    mistakes:
      '100': c4_clock
  - prompt: The long hand points to 3. How many minutes past the hour is it?
    answer: '15'
    check: 3*5
    difficulty: 1
    hints:
    - Each number is 5 minutes.
    - 3 × 5.
    solution: 3 × 5 = 15 minutes.
    mistakes:
      '3': c4_clock
  - prompt: The long hand is on 6 and the short hand is between 4 and 5. What time is it?
    options:
    - half past 4
    - 6 o'clock
    - half past 5
    - quarter to 4
    answer: half past 4
    difficulty: 2
    hints:
    - Long hand on 6 = 30 minutes.
    - Short hand past 4.
    solution: It is 4:30, half past 4.
    mistakes: {"half past 5": "m4_short_hand"}
  - prompt: '2 p.m. is:'
    options:
    - in the afternoon
    - in the early morning
    - at midnight
    - before breakfast
    answer: in the afternoon
    difficulty: 1
    hints:
    - p.m. is after noon.
    - After lunch.
    solution: 2 p.m. is afternoon.
    mistakes: {"at midnight": "m4_pm"}
  - prompt: A class goes from 9:00 to 9:45. How many minutes is it?
    answer: '45'
    check: '45'
    difficulty: 1
    hints:
    - Count from 9:00.
    - Long hand to 9.
    solution: 45 minutes.
    mistakes: {"945": "m4_minutes_count", "40": "m4_minutes_count"}
  - prompt: A picnic lasts from 10 a.m. to 1 p.m. How many hours?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - 10 → 11 → 12 → 1.
    - Count the hours.
    solution: 3 hours.
    mistakes: {"9": "m4_hours_noon", "11": "m4_hours_noon"}
  - prompt: The long hand points to 11. How many minutes past the hour?
    answer: '55'
    check: 11*5
    difficulty: 1
    hints:
    - Each number is 5 minutes.
    - Count by fives to 11.
    solution: 'Step 1: 11 × 5. Step 2: = 55 minutes.'
    mistakes:
      '11': c4m12_hands
      '50': c4m12_hands
      '60': c4m12_hands
  - prompt: How many minutes are in 3 hours?
    answer: '180'
    check: 3*60
    difficulty: 1
    hints:
    - 1 hour = 60 minutes.
    - Three lots of 60.
    solution: 'Step 1: 60 × 3. Step 2: = 180 minutes.'
    mistakes:
      '300': c4m12_count
      '120': c4m12_count
      '63': c4m12_count
  - prompt: Dinner is at quarter past 8 in the evening. Which is it?
    options:
    - 8:15 p.m.
    - 8:15 a.m.
    - 8:45 p.m.
    answer: 8:15 p.m.
    difficulty: 2
    hints:
    - Quarter past means 15 minutes after.
    - Evening is after noon.
    solution: 'Step 1: Quarter past 8 = 8:15. Step 2: Evening = p.m., so 8:15 p.m.'
    mistakes:
      8:15 a.m.: c4m12_hands
      8:45 p.m.: c4m12_hands
  - prompt: A film starts at 3:30 and ends at 5:00. How many minutes long is it?
    answer: '90'
    check: 30+60
    difficulty: 2
    hints:
    - 3:30 to 4:00 first.
    - Then 4:00 to 5:00.
    solution: 'Step 1: 3:30 to 4:00 = 30 min. Step 2: 4:00 to 5:00 = 60 min; total 90 minutes.'
    mistakes:
      '150': c4m12_count
      '70': c4m12_count
      '130': c4m12_count
  - prompt: The short hand is just past 2 and the long hand is on 4. What time is it?
    options:
    - '2:20'
    - '4:10'
    - '2:04'
    answer: '2:20'
    difficulty: 2
    hints:
    - The short hand gives the hour.
    - The long hand on 4 means 4 × 5 minutes.
    solution: 'Step 1: Hour = 2. Step 2: Minutes = 4 × 5 = 20, so 2:20.'
    mistakes:
      '4:10': c4m12_hands
      '2:04': c4m12_hands
  - prompt: It is 10:45 now. What time will it be in 30 minutes?
    options:
    - '11:15'
    - '11:45'
    - 10:75
    answer: '11:15'
    difficulty: 3
    hints:
    - 15 minutes takes you to 11:00.
    - Then add the rest.
    solution: 'Step 1: 10:45 + 15 min = 11:00. Step 2: 15 more minutes = 11:15.'
    mistakes:
      '11:45': c4m12_count
      10:75: c4m12_count
  - prompt: Which is in the morning?
    options:
    - 7:00 a.m.
    - 7:00 p.m.
    - 11:00 p.m.
    answer: 7:00 a.m.
    difficulty: 1
    hints:
    - a.m. is before noon.
    - Which one says a.m.?
    solution: 'Step 1: a.m. = before noon. Step 2: 7:00 a.m. is in the morning.'
    mistakes:
      7:00 p.m.: c4m12_hands
      11:00 p.m.: c4m12_hands
  - prompt: A train leaves at 11 a.m. and arrives at 3 p.m. How many hours is the journey?
    answer: '4'
    check: 1+3
    difficulty: 3
    hints:
    - 11 a.m. to 12 noon first.
    - Then noon to 3 p.m.
    solution: 'Step 1: 11 to 12 = 1 hour. Step 2: 12 to 3 = 3 hours; total 4 hours.'
    mistakes:
      '8': c4m12_count
      '14': c4m12_count
      '3': c4m12_count
  - prompt: How many minutes is a quarter of an hour plus half an hour?
    answer: '45'
    check: 15+30
    difficulty: 2
    hints:
    - A quarter hour is 15 minutes.
    - Half an hour is 30 minutes.
    solution: 'Step 1: 15 + 30. Step 2: = 45 minutes.'
    mistakes:
      '75': c4m12_count
      '35': c4m12_count
  - prompt: 'Case: The school bus picks up Anil at 7:35 a.m. and reaches school at 8:15 a.m. How long is the ride?'
    options:
    - 40 minutes
    - 1 hour 20 minutes
    - 80 minutes
    answer: 40 minutes
    hints:
    - Count on from 7:35 to 8:00 first.
    - Then add the minutes from 8:00 to 8:15.
    solution: 7:35 to 8:00 is 25 minutes, and 8:00 to 8:15 is 15 minutes. 25 + 15 = 40 minutes.
    mistakes:
      1 hour 20 minutes: c4m12_count
      80 minutes: c4m12_count
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your exam starts at 10:15 a.m. and lasts 2 hours. At what time does it end?'
    options:
    - 12:15 p.m.
    - 12:15 a.m.
    - 10:17 a.m.
    answer: 12:15 p.m.
    hints:
    - Add 2 hours to 10:15.
    - Is the new time before noon or after noon?
    solution: 10:15 + 2 hours = 12:15. That is just after noon, so it is 12:15 p.m.
    mistakes:
      12:15 a.m.: c4m12_hands
      10:17 a.m.: c4m12_hands
    exam: competency
    difficulty: 2
- code: cbse4m.time.calendar
  title: Days, weeks, months and years
  after:
  - cbse4m.time.clock
  notes: |
    1 week = 7 days; 1 year = 12 months = 365 days (366 in a leap year). Months have 30 or 31 days; February has 28 (29 in
    a leap year). Read a calendar: dates in rows of weeks. Find a date 7 days later by going straight down one row.
  explanations:
    text: A week has 7 days and a year has 12 months. Most months have 30 or 31 days, but February has 28, or 29 in a leap year. On a calendar, one week later is the date just below.
    visual: 'Draw a calendar page for one month with 7 columns: Sun to Sat. Circle the 5th and the 12th: one week apart.'
    step_by_step: 'Step 1: Find the date. Step 2: Move along the row for days, down a row for a week. Step 3: Read the new date.'
    real_world: Calendars help us remember birthdays, festivals and school holidays.
  picture:
    kind: bars
    bars:
    - label: Jan
      value: 31
    - label: Feb
      value: 28
    - label: Mar
      value: 31
    - label: Apr
      value: 30
    alt: 'Days in the months: January 31, February 28 (29 in a leap year), March 31, April 30.'
    unit: days
  activity:
    type: number_line
    min: 1
    max: 31
    step: 1
    start: 1
    prompt: Use the calendar. Mark the date.
    goals:
    - prompt: Today is 5 March. What date is one week later?
      target: 12
      mistakes:
      - when:
          v: 6
        say: That's tomorrow. A week is 7 days.
      - when:
          v: 11
        say: 'Count 7 days on from 5: 6, 7, 8, 9, 10, 11, 12.'
    - prompt: Today is the 20th. What date was it two weeks ago?
      target: 6
      mistakes:
      - when:
          v: 13
        say: That's one week ago. Two weeks is 14 days.
      - when:
          v: 18
        say: Two days ago, not two weeks.
    - prompt: Mark the last day of April.
      target: 30
      mistakes:
      - when:
          v: 31
        say: 'April has 30 days. Remember: 30 days have September, April, June and November.'
  lesson:
    - teach: 1 week = 7 days. 1 year = 12 months = 365 days. Every 4 years a leap year has 366 days, because February gets a 29th day.
      check:
        prompt: How many days does a leap year have?
        options:
        - '366'
        - '365'
        - '360'
        answer: '366'
        why: February has 29 days instead of 28.
      ways:
      - style: visual
        teach: Facts to remember about days, weeks, months and years.
        picture:
          kind: compare
          columns:
          - title: Unit
            points:
            - 1 week
            - 1 year
            - 1 year
            - 1 leap year
          - title: Is
            points:
            - 7 days
            - 12 months
            - 365 days
            - 366 days
          alt: 1 week is 7 days. 1 year is 12 months, or 365 days. A leap year has 366 days.
      - style: real_world
        teach: The Olympic Games come once every four years, the same as leap years. Children born on 29 February only see their real birthday date once every four years.
    - teach: 'Months have 30 or 31 days (February 28 or 29). The knuckle trick: on your fist, knuckles are 31-day months and dips are shorter months: Jan (knuckle), Feb (dip), Mar (knuckle), Apr (dip) ...'
      picture:
        kind: compare
        columns:
        - title: 31 days
          points:
          - Jan, Mar, May
          - Jul, Aug
          - Oct, Dec
        - title: 30 days
          points:
          - Apr, Jun
          - Sep, Nov
        - title: 28 or 29 days
          points:
          - Feb
        alt: Months grouped by number of days.
      check:
        prompt: How many days does June have?
        options:
        - '30'
        - '31'
        - '28'
        answer: '30'
        why: June is one of the four 30-day months.
      ways:
      - style: step_by_step
        teach: 'Use the knuckle trick. Step 1: Make a fist with your left hand. Step 2: Point to the first knuckle: January, 31 days. Step 3: The dip next to it: February, the short month. Step 4: Keep going knuckle, dip; after July on the last knuckle, start again on the first knuckle for August.'
      - style: real_world
        teach: Monthly bus passes and phone plans are sometimes for 28, 30 or 31 days. Knowing how many days a month has helps you check you are not paying for fewer days.
    - teach: 'On a calendar, each row is one week. To find the date one week later, go straight down one row: add 7. Two weeks later: add 14.'
      check:
        prompt: Today is the 9th. What date is it one week later?
        options:
        - 16th
        - 10th
        - 18th
        answer: 16th
        why: 9 + 7 = 16.
      ways:
      - style: visual
        teach: Going straight down a calendar column adds 7 days each row.
        picture:
          kind: flow
          steps:
          - '3rd: Wednesday'
          - '10th: Wednesday (3 + 7)'
          - '17th: Wednesday (10 + 7)'
          - '24th: Wednesday (17 + 7)'
          alt: If the 3rd is a Wednesday, then the 10th, 17th and 24th are also Wednesdays, because each row down adds 7 days.
      - style: real_world
        teach: A weekly music class on Saturdays falls on dates that are 7 apart. If the first class is on the 2nd, the rest of the month's classes are on the 9th, 16th, 23rd and 30th.
  items:
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: 7 days.
    mistakes: {"5": "m4_week_days", "30": "m4_week_days"}
  - prompt: How many months are in a year?
    answer: '12'
    check: '12'
    difficulty: 1
    hints:
    - January to December.
    - Count them.
    solution: 12 months.
    mistakes: {"10": "m4_months", "52": "m4_months"}
  - prompt: How many days does February have in a leap year?
    answer: '29'
    check: '29'
    difficulty: 2
    hints:
    - Usually 28.
    - One extra in a leap year.
    solution: 29 days.
    mistakes: {"28": "m4_leap", "30": "m4_leap"}
  - prompt: Today is the 5th. What date is it one week later?
    answer: '12'
    check: 5+7
    difficulty: 1
    hints:
    - Add 7.
    - 5 + 7.
    solution: 5 + 7 = 12th.
    mistakes: {"6": "m4_week_later", "13": "m4_week_later"}
  - prompt: How many days are in 3 weeks?
    answer: '21'
    check: 7*3
    difficulty: 1
    hints:
    - 7 × 3.
    - Each week has 7.
    solution: 21 days.
    mistakes: {"24": "m5_times_table", "10": "m5_times_table"}
  - prompt: Which month has 30 days?
    options:
    - April
    - January
    - March
    - December
    answer: April
    difficulty: 2
    hints:
    - "Use the knuckle trick: months that land in a dip between knuckles have 30 days or fewer."
    - Rhyme.
    solution: April has 30 days.
    mistakes: {"January": "m4_30_days"}
  - prompt: How many days are in 5 weeks?
    answer: '35'
    check: 7*5
    difficulty: 1
    hints:
    - 1 week = 7 days.
    - Five lots of 7.
    solution: 'Step 1: 7 × 5. Step 2: = 35 days.'
    mistakes:
      '12': c4m12_cal
      '30': c4m12_cal
      '25': c4m12_cal
  - prompt: Which month has 31 days?
    options:
    - August
    - September
    - November
    answer: August
    difficulty: 2
    hints:
    - Use the knuckle trick.
    - July and the month after both land on knuckles.
    solution: 'Step 1: September and November have 30 days. Step 2: August has 31.'
    mistakes:
      September: c4m12_cal
      November: c4m12_cal
  - prompt: Today is Monday. What day will it be after 3 days?
    options:
    - Thursday
    - Wednesday
    - Friday
    answer: Thursday
    difficulty: 1
    hints:
    - Count on 3 days from Monday.
    - Tuesday is 1, then ...
    solution: 'Step 1: Tuesday (1), Wednesday (2), Thursday (3). Step 2: Thursday.'
    mistakes:
      Wednesday: c4m12_cal
      Friday: c4m12_cal
  - prompt: How many days are there in January and February together in a year that is not a leap year?
    answer: '59'
    check: 31+28
    difficulty: 2
    hints:
    - January has 31 days.
    - February has 28 in an ordinary year.
    solution: 'Step 1: 31 + 28. Step 2: = 59 days.'
    mistakes:
      '60': c4m12_cal
      '61': c4m12_cal
      '62': c4m12_cal
  - prompt: A holiday starts on the 12th and lasts 2 weeks. On which date does it end (2 weeks later)?
    answer: '26'
    check: 12+14
    difficulty: 2
    hints:
    - 2 weeks = how many days?
    - Add that to 12.
    solution: 'Step 1: 2 weeks = 14 days. Step 2: 12 + 14 = 26.'
    mistakes:
      '14': c4m12_cal
      '19': c4m12_cal
      '24': c4m12_cal
  - prompt: How many months are in 3 years?
    answer: '36'
    check: 12*3
    difficulty: 2
    hints:
    - 1 year = 12 months.
    - Three lots of 12.
    solution: 'Step 1: 12 × 3. Step 2: = 36 months.'
    mistakes:
      '15': c4m12_cal
      '30': c4m12_cal
      '1095': c4m12_cal
  - prompt: If 1st March is a Sunday, what day is 8th March?
    options:
    - Sunday
    - Monday
    - Saturday
    answer: Sunday
    difficulty: 2
    hints:
    - 8 − 1 = 7 days later.
    - 7 days later is the same weekday.
    solution: 'Step 1: 8th March is 7 days after 1st. Step 2: 7 days later is the same weekday: Sunday.'
    mistakes:
      Monday: c4m12_cal
      Saturday: c4m12_cal
  - prompt: Which month comes just after the 6th month of the year?
    options:
    - July
    - June
    - August
    answer: July
    difficulty: 1
    hints:
    - Count Jan 1, Feb 2 ... to the 6th.
    - Then one more.
    solution: 'Step 1: The 6th month is June. Step 2: The next one is July.'
    mistakes:
      June: c4m12_cal
      August: c4m12_cal
  - prompt: A plant grows for 100 days. About how many weeks is that?
    options:
    - about 14 weeks
    - about 10 weeks
