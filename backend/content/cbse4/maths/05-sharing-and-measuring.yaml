# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 5
title: Sharing and Measuring
tips:
  c4_half: "A quarter is one of 4 equal parts. Count how many equal parts this roti has. To compare, fold a paper into 4 and see how many quarter pieces fill half of it."
  m4_half: "Half means 2 equal parts. Share 10 between 2."
  m4_half_hour: "1 hour = 60 minutes. Half of that is ...?"
  m4_leftover: "Find the biggest number each child can get so that 4 × it is 13 or less. The leftover can't be shared fairly."
  m4_quarter: "A quarter means 4 equal parts. Share 12 among 4."
  m4_third: "3 equal parts: each is one ___. Two parts would be halves."
  c4m5_equal: Draw the whole and split it into the number of EQUAL parts. How big is one part?
  c4m5_share: Deal them out one by one to each person, like cards. How many does each get, and is any left?
  c4m5_measure: 'Remember the full amount first: 1 kg = 1000 g, 1 L = 1000 mL, 1 hour = 60 minutes. Then split it.'
concepts:
- code: cbse4m.share.fractions
  title: Halves, quarters and thirds
  notes: |
    Sharing equally makes fractions. Half (1/2): 2 equal parts. Quarter (1/4): 4 equal parts. Third (1/3): 3 equal parts.
    Two quarters = one half. Half of 10 = 5; a quarter of 12 = 3. Parts must be equal to be called halves or quarters.
  explanations:
    text: 'When you share something fairly, each part is the same size. Cut a roti into 2 equal parts: each is a half. Into 4 equal parts: each is a quarter. Two quarters together make a half.'
    visual: 'Draw a circle and cut it into 4 equal parts. Shade 1 part: one quarter. Shade 2 parts: two quarters, which is one half.'
    step_by_step: 'Step 1: Count how many equal parts. Step 2: Count how many are taken. Step 3: Name the fraction.'
    real_world: Sharing a chocolate bar or a dosa fairly between friends uses halves and quarters.
  picture:
    kind: number_line
    from: 0
    to: 1
    step: 0.25
    points:
    - at: 0
      label: '0'
    - at: 0.25
      label: 1/4
    - at: 0.5
      label: 1/2
    - at: 0.75
      label: 3/4
    - at: 1
      label: '1'
    alt: 'A number line from 0 to 1 in quarters: 1/4, 1/2, 3/4 and 1.'
  activity:
    type: sort
    prompt: How big is each part?
    bins:
    - A half
    - A quarter
    - A third
    items:
    - label: 'A roti cut into 2 equal parts: one part'
      bin: A half
      clue: How many equal parts?
      why: '2 parts: each is one half.'
    - label: 30 minutes out of one hour
      bin: A half
      clue: 60 split into 2 equal parts.
      why: One half of an hour.
    - label: Two quarters of a cake together
      bin: A half
      clue: 2 of 4 equal pieces.
      why: Two quarters make one half.
    - label: 'A roti cut into 4 equal parts: one part'
      bin: A quarter
      clue: How many equal parts?
      why: '4 parts: each is one quarter.'
    - label: 15 minutes out of one hour
      bin: A quarter
      clue: 60 split into 4 equal parts.
      why: One quarter.
    - label: 'A chocolate cut into 3 equal pieces: one piece'
      bin: A third
      clue: How many equal pieces?
      why: '3 pieces: each is one third.'
    - label: 20 minutes out of one hour
      bin: A third
      clue: 60 split into 3 equal parts.
      why: One third.
    - label: One share when 3 friends share a mango fairly
      bin: A third
      clue: How many people share?
      why: '3 shares: one third each.'
  lesson:
    - teach: 'When we cut something into equal parts, each part is a fraction. 2 equal parts: each is one half (1/2). 4 equal parts: each is one quarter (1/4). 3 equal parts: each is one third (1/3).'
      check:
        prompt: 'A paper is folded into 4 equal parts. Each part is:'
        options:
        - one quarter
        - one half
        - one third
        answer: one quarter
        why: 4 equal parts make quarters.
    - teach: The parts must be equal. If a roti is torn into one big and one small piece, they are not halves. Two quarters together make one half.
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: 1/4
        - size: 1
          label: 1/4
        - size: 1
          label: 1/4
        - size: 1
          label: 1/4
        rows:
        - size: 1
          label: whole
        cells:
        - - half
          - half
          - other half
          - other half
        alt: A strip in 4 equal quarters; 2 of them together are marked as one half.
      check:
        prompt: How many quarters make one half?
        options:
        - '2'
        - '4'
        - '3'
        answer: '2'
        why: 2 of the 4 quarters cover half the strip.
    - teach: 'To find a fraction of a number, share it equally. Half of 10: share 10 into 2 groups, 5 each. A quarter of 12: share 12 into 4 groups, 3 each. A third of 9: 3 groups of 3.'
      check:
        prompt: What is a third of 15?
        options:
        - '5'
        - '3'
        - '10'
        answer: '5'
        why: 15 shared into 3 equal groups gives 5 each.
  items:
  - prompt: 'A roti is cut into 2 equal parts. Each part is:'
    options:
    - one half
    - one quarter
    - one third
    - one whole
    answer: one half
    difficulty: 1
    hints:
    - 2 equal parts.
    - Half.
    solution: Each of 2 equal parts is a half.
    mistakes:
      one quarter: c4_half
  - prompt: What is half of 10?
    answer: '5'
    check: Rational(10,2)
    difficulty: 1
    hints:
    - Share 10 between 2.
    - 10 ÷ 2.
    solution: 10 ÷ 2 = 5.
    mistakes: {"2": "m4_half", "20": "m4_half"}
  - prompt: What is a quarter of 12?
    answer: '3'
    check: Rational(12,4)
    difficulty: 1
    hints:
    - Share 12 among 4.
    - 12 ÷ 4.
    solution: 12 ÷ 4 = 3.
    mistakes: {"4": "m4_quarter", "48": "m4_quarter"}
  - prompt: How many quarters make one half?
    options:
    - '2'
    - '4'
    - '1'
    - '3'
    answer: '2'
    difficulty: 2
    hints:
    - 1/4 + 1/4.
    - Fold paper.
    solution: Two quarters make one half.
    mistakes:
      '4': c4_half
  - prompt: 'A cake is cut into 3 equal parts. Each part is:'
    options:
    - one third
    - one half
    - one quarter
    - one fifth
    answer: one third
    difficulty: 1
    hints:
    - 3 equal parts.
    - Third.
    solution: Each of 3 equal parts is a third.
    mistakes: {"one half": "m4_third"}
  - prompt: How many quarters make one whole?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Quarter = 4 equal parts.
    - All of them.
    solution: 4 quarters make 1 whole.
    mistakes: {"2": "m5_quarters", "1": "m5_quarters"}
  - prompt: What is half of 18?
    answer: '9'
    check: 18//2
    difficulty: 1
    hints:
    - Share 18 into 2 equal groups.
    - Which number added to itself makes 18?
    solution: 'Step 1: Half means 2 equal groups. Step 2: 18 ÷ 2 = 9.'
    mistakes:
      '8': c4m5_equal
      '36': c4m5_equal
  - prompt: What is a quarter of 20?
    answer: '5'
    check: 20//4
    difficulty: 1
    hints:
    - A quarter means 4 equal groups.
    - Halve 20, then halve again.
    solution: 'Step 1: Half of 20 is 10. Step 2: Half of 10 is 5.'
    mistakes:
      '4': c4m5_equal
      '10': c4m5_equal
      '16': c4m5_equal
  - prompt: A pizza is cut into 4 equal slices. Tom eats 2 slices. What fraction did Tom eat?
    options:
    - one half
    - one quarter
    - one third
    answer: one half
    difficulty: 2
    hints:
    - Each slice is one quarter.
    - How many quarters make a half?
    solution: 'Step 1: 2 slices = 2 quarters. Step 2: 2 quarters = one half.'
    mistakes:
      one quarter: c4m5_equal
      one third: c4m5_equal
  - prompt: Which picture shows halves?
    options:
    - a square cut by a line through the middle into 2 equal parts
    - a square cut into one big and one small part
    - a square cut into 3 equal strips
    answer: a square cut by a line through the middle into 2 equal parts
    difficulty: 2
    hints:
    - Halves need 2 parts.
    - Both parts must be the same size.
    solution: 'Step 1: Halves are 2 equal parts. Step 2: Only the middle cut gives 2 equal parts.'
    mistakes:
      a square cut into one big and one small part: c4m5_equal
      a square cut into 3 equal strips: c4m5_equal
  - prompt: There are 24 children. A third of them play football. How many play football?
    answer: '8'
    check: 24//3
    difficulty: 2
    hints:
    - A third means 3 equal groups.
    - 24 ÷ 3.
    solution: 'Step 1: Split 24 into 3 equal groups. Step 2: 24 ÷ 3 = 8.'
    mistakes:
      '3': c4m5_equal
      '12': c4m5_equal
      '6': c4m5_equal
  - prompt: How many thirds make one whole?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - A third is 1 of how many equal parts?
    - Put all those parts back together.
    solution: 'Step 1: A whole cut in thirds has 3 parts. Step 2: 3 thirds make one whole.'
    mistakes:
      '2': c4m5_equal
      '4': c4m5_equal
  - prompt: 'Which is bigger: one half of a cake or one quarter of the same cake?'
    options:
    - one half
    - one quarter
    - both the same
    answer: one half
    difficulty: 2
    hints:
    - Fewer pieces means bigger pieces.
    - 'Cut into 2 or cut into 4: which pieces are bigger?'
    solution: 'Step 1: Half = cake cut into 2; quarter = cake cut into 4. Step 2: Fewer cuts give bigger pieces, so one half is bigger.'
    mistakes:
      one quarter: c4m5_equal
      both the same: c4m5_equal
  - prompt: A ribbon is 40 cm long. How long is three quarters of it?
    answer: '30'
    check: 40//4*3
    difficulty: 3
    hints:
    - Find one quarter first.
    - Then take 3 of those.
    solution: 'Step 1: One quarter of 40 = 10 cm. Step 2: Three quarters = 3 × 10 = 30 cm.'
    mistakes:
      '10': c4m5_equal
      '20': c4m5_equal
      '120': c4m5_equal
  - prompt: Meena ate half of 16 grapes. Then Arjun ate half of what was left. How many grapes are left now?
    answer: '4'
    check: 16//2//2
    difficulty: 3
    hints:
    - First find half of 16.
    - Then halve the number that was left.
    solution: 'Step 1: Half of 16 = 8 eaten, 8 left. Step 2: Half of 8 = 4 eaten, 4 left.'
    mistakes:
      '8': c4m5_equal
      '0': c4m5_equal
      '12': c4m5_equal
- code: cbse4m.share.money
  title: Sharing money and things equally
  after:
  - cbse4m.share.fractions
  notes: |
    Share equally by dividing: ₹60 among 3 children = ₹20 each. Share with leftovers: 13 sweets among 4 = 3 each, 1 left.
    Measuring by sharing: half a litre is 500 mL, half a kg is 500 g, half an hour is 30 minutes.
  explanations:
    text: To share equally, give everyone the same amount. Divide the total by the number of people. Sometimes some are left over.
    visual: 'Draw 3 children and 6 ten-rupee notes. Give one note to each child in turn until all are gone: 2 notes (₹20) each.'
    step_by_step: 'Step 1: Count the total. Step 2: Count the people. Step 3: Give one to each in turn, or divide. Step 4: Note any left over.'
    real_world: Splitting the cost of a gift among friends, or sharing a packet of biscuits.
  picture:
    kind: bars
    bars:
    - label: Child 1
      value: 20
    - label: Child 2
      value: 20
    - label: Child 3
      value: 20
    alt: 60 rupees shared among 3 children gives each child 20 rupees.
    unit: ₹
  activity:
    type: formula
    prompt: Share ₹60 equally. Set how many people and how much each one gets.
    inputs:
    - name: k
      label: People
      min: 1
      max: 10
      step: 1
      start: 1
    - name: e
      label: Each gets
      min: 0
      max: 60
      step: 1
      start: 0
      unit: ₹
    outputs:
    - name: used
      label: Given out
      expr: k*e
      unit: ₹
    - name: left
      label: Left over
      expr: 60-k*e
      unit: ₹
    goals:
    - prompt: Share among 4 people, nothing left.
      want:
        k: 4
        left: 0
      mistakes:
      - when:
          k: 4
          e: 10
        say: 4 × 10 = 40. There's still ₹20 to share.
      - when:
          k: 4
          e:
          - 16
          - 60
        say: That's more than ₹60!
    - prompt: Share among 5 people, nothing left.
      want:
        k: 5
        left: 0
      mistakes:
      - when:
          k: 5
          e: 10
        say: '5 × 10 = 50. ₹10 is left: give each one more.'
    - prompt: Share among 7 people. Give as much as you can.
      want:
        k: 7
        e: 8
      mistakes:
      - when:
          k: 7
          e: 9
        say: '7 × 9 = 63: more than ₹60. Give ₹8 each; ₹4 is left over.'
      - when:
          k: 7
          e:
          - 1
          - 7
        say: You can still give each one more rupee.
  lesson:
    - teach: 'Sharing equally is dividing. ₹60 shared among 3 children: deal it out so each gets the same. 60 ÷ 3 = 20, so ₹20 each. Check: 20 × 3 = 60.'
      check:
        prompt: ₹40 is shared equally between 2 sisters. How much does each get?
        options:
        - ₹20
        - ₹10
        - ₹80
        answer: ₹20
        why: 40 ÷ 2 = 20.
    - teach: 'Sometimes things do not share exactly. 13 sweets among 4 children: each gets 3 (that uses 12), and 1 is left over. The leftover is smaller than the number of children.'
      picture:
        kind: compare
        columns:
        - title: Shared out
          points:
          - 4 children
          - 3 sweets each
          - 3 × 4 = 12 used
        - title: Left over
          points:
          - 13 − 12 = 1
          - 1 sweet left
        alt: '13 sweets shared among 4: 3 each, 1 left over.'
      check:
        prompt: 10 apples are shared among 3 friends. How many are left over?
        options:
        - '1'
        - '3'
        - '0'
        answer: '1'
        why: 3 each uses 9; 10 − 9 = 1 left.
    - teach: Measures can be shared too. Half a kilogram is 500 g (1000 ÷ 2). Half a litre is 500 mL. Half an hour is 30 minutes. A quarter of an hour is 15 minutes.
      check:
        prompt: How many minutes is a quarter of an hour?
        options:
        - '15'
        - '25'
        - '30'
        answer: '15'
        why: 60 minutes ÷ 4 = 15.
  items:
  - prompt: ₹60 is shared equally among 3 children. How many rupees does each get?
    answer: '20'
    check: 60/3
    difficulty: 1
    hints:
    - 60 ÷ 3.
    - 3 × 20 = 60.
    solution: 60 ÷ 3 = ₹20.
    mistakes: {"30": "m5_divide_check", "180": "m5_divide_check"}
  - prompt: 13 sweets are shared among 4 children. How many does each child get?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - 4 × 3 = 12.
    - One is left over.
    solution: Each gets 3 and 1 is left over.
    mistakes: {"4": "m4_leftover", "1": "m4_leftover"}
  - prompt: How many minutes is half an hour?
    answer: '30'
    check: 60/2
    difficulty: 1
    hints:
    - An hour has 60 minutes.
    - Half of 60.
    solution: Half of 60 = 30 minutes.
    mistakes: {"50": "m4_half_hour", "60": "m4_half_hour"}
  - prompt: How many grams is half a kilogram?
    answer: '500'
    check: 1000/2
    difficulty: 1
    hints:
    - 1 kg = 1000 g.
    - Half of 1000.
    solution: Half of 1000 g = 500 g.
    mistakes: {"50": "m5_quarter_kg", "5000": "m5_quarter_kg"}
  - prompt: 24 pencils are packed equally into 6 boxes. How many in each box?
    answer: '4'
    check: 24/6
    difficulty: 1
    hints:
    - 24 ÷ 6.
    - 6 × 4 = 24.
    solution: 24 ÷ 6 = 4.
    mistakes: {"6": "m5_divide_check", "144": "m5_divide_check"}
  - prompt: ₹100 is shared equally among 4 friends. How many rupees each?
    answer: '25'
    check: 100/4
    difficulty: 2
    hints:
    - 100 ÷ 4.
    - Four 25s make 100.
    solution: 100 ÷ 4 = ₹25.
    mistakes: {"20": "m5_divide_check", "400": "m5_divide_check"}
  - prompt: ₹90 is shared equally among 3 friends. How much does each get?
    answer: '30'
    check: 90//3
    difficulty: 1
    hints:
    - Share means divide.
    - Which number times 3 is 90?
    solution: 'Step 1: 90 ÷ 3. Step 2: = ₹30 each.'
    mistakes:
      '27': c4m5_share
      '93': c4m5_share
      '270': c4m5_share
  - prompt: 17 marbles are shared equally among 5 children. How many are left over?
    answer: '2'
    check: 17%5
    difficulty: 2
    hints:
    - How many does each child get first?
    - Take that total away from 17.
    solution: 'Step 1: Each gets 3, using 15. Step 2: 17 − 15 = 2 left over.'
    mistakes:
      '3': c4m5_share
      '12': c4m5_share
      '1': c4m5_share
  - prompt: How many millilitres is half a litre?
    answer: '500'
    check: 1000//2
    difficulty: 1
    hints:
    - How many mL make one litre?
    - Halve that.
    solution: 'Step 1: 1 L = 1000 mL. Step 2: Half = 500 mL.'
    mistakes:
      '50': c4m5_measure
      '250': c4m5_measure
      '100': c4m5_measure
  - prompt: How many grams is a quarter of a kilogram?
    answer: '250'
    check: 1000//4
    difficulty: 2
    hints:
    - 1 kg is how many grams?
    - Split that into 4 equal parts.
    solution: 'Step 1: 1 kg = 1000 g. Step 2: 1000 ÷ 4 = 250 g.'
    mistakes:
      '500': c4m5_measure
      '25': c4m5_measure
      '400': c4m5_measure
  - prompt: 36 eggs are packed equally into trays of 6. How many trays are needed?
    answer: '6'
    check: 36//6
    difficulty: 2
    hints:
    - How many 6s make 36?
    - Use the 6 times table.
    solution: 'Step 1: 36 ÷ 6. Step 2: = 6 trays.'
    mistakes:
      '30': c4m5_share
      '42': c4m5_share
      '5': c4m5_share
  - prompt: A 2-litre bottle of juice is shared equally among 4 glasses. How many mL in each glass?
    answer: '500'
    check: 2000//4
    difficulty: 3
    hints:
    - Change 2 litres into mL first.
    - Then share by 4.
    solution: 'Step 1: 2 L = 2000 mL. Step 2: 2000 ÷ 4 = 500 mL.'
    mistakes:
      '250': c4m5_measure
      '50': c4m5_measure
      '1000': c4m5_measure
  - prompt: Sam had ₹75 and spent half of ₹50 on a book. How much does Sam have left?
    answer: '50'
    check: 75-50//2
    difficulty: 3
    hints:
    - Find half of ₹50 first.
    - Then take that away from ₹75.
    solution: 'Step 1: Half of ₹50 = ₹25. Step 2: ₹75 − ₹25 = ₹50.'
    mistakes:
      '25': c4m5_share
      '37': c4m5_share
  - prompt: A class of 30 sits in groups of 4. How many full groups are there?
    answer: '7'
    check: 30//4
    difficulty: 3
    hints:
    - How many 4s fit into 30?
    - '8 × 4 is 32: too many.'
    solution: 'Step 1: 7 × 4 = 28, 8 × 4 = 32. Step 2: So 7 full groups (2 children left over).'
    mistakes:
      '8': c4m5_share
      '2': c4m5_share
      '6': c4m5_share
  - prompt: A movie lasts one and a half hours. How many minutes is that?
    answer: '90'
    check: 60+30
    difficulty: 2
    hints:
    - One hour is how many minutes?
    - Add half an hour.
    solution: 'Step 1: 1 hour = 60 minutes; half an hour = 30. Step 2: 60 + 30 = 90 minutes.'
    mistakes:
      '150': c4m5_measure
      '75': c4m5_measure
      '130': c4m5_measure
