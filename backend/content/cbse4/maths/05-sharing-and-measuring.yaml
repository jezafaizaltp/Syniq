# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 5
title: Sharing and Measuring
tips:
  c4_half: Half means 2 equal parts, a quarter means 4 equal parts. The parts must be the same size.
concepts:
- code: cbse4m.share.fractions
  title: Halves, quarters and thirds
  notes: |
    Sharing equally makes fractions. Half (1/2): 2 equal parts. Quarter (1/4): 4 equal parts. Third (1/3): 3 equal parts.
    Two quarters = one half. Half of 10 = 5; a quarter of 12 = 3. Parts must be equal to be called halves or quarters.
  explanations:
    text: 'When you share something fairly, each part is the same size. Cut a roti into 2 equal parts: each is a half. Into 4 equal parts: each is a quarter. Two quarters together make a half.'
    visual: 'Draw a circle and cut it into 4 equal parts. Shade 1 part: one quarter. Shade 2 parts: two quarters, which is one half.'
    step_by_step: 'Step 1: Count how many equal parts. Step 2: Count how many are taken. Step 3: Name the fraction.'
    real_world: Sharing a chocolate bar or a dosa fairly between friends uses halves and quarters.
  picture:
    kind: number_line
    from: 0
    to: 1
    step: 0.25
    points:
    - at: 0
      label: '0'
    - at: 0.25
      label: 1/4
    - at: 0.5
      label: 1/2
    - at: 0.75
      label: 3/4
    - at: 1
      label: '1'
    alt: 'A number line from 0 to 1 in quarters: 1/4, 1/2, 3/4 and 1.'
  activity:
    type: sort
    prompt: How big is each part?
    bins:
    - A half
    - A quarter
    - A third
    items:
    - label: 'A roti cut into 2 equal parts: one part'
      bin: A half
      clue: How many equal parts?
      why: '2 parts: each is one half.'
    - label: 30 minutes out of one hour
      bin: A half
      clue: 60 split into 2 equal parts.
      why: One half of an hour.
    - label: Two quarters of a cake together
      bin: A half
      clue: 2 of 4 equal pieces.
      why: Two quarters make one half.
    - label: 'A roti cut into 4 equal parts: one part'
      bin: A quarter
      clue: How many equal parts?
      why: '4 parts: each is one quarter.'
    - label: 15 minutes out of one hour
      bin: A quarter
      clue: 60 split into 4 equal parts.
      why: One quarter.
    - label: 'A chocolate cut into 3 equal pieces: one piece'
      bin: A third
      clue: How many equal pieces?
      why: '3 pieces: each is one third.'
    - label: 20 minutes out of one hour
      bin: A third
      clue: 60 split into 3 equal parts.
      why: One third.
    - label: One share when 3 friends share a mango fairly
      bin: A third
      clue: How many people share?
      why: '3 shares: one third each.'
  items:
  - prompt: 'A roti is cut into 2 equal parts. Each part is:'
    options:
    - one half
    - one quarter
    - one third
    - one whole
    answer: one half
    difficulty: 1
    hints:
    - 2 equal parts.
    - Half.
    solution: Each of 2 equal parts is a half.
    mistakes:
      one quarter: c4_half
  - prompt: What is half of 10?
    answer: '5'
    check: Rational(10,2)
    difficulty: 1
    hints:
    - Share 10 between 2.
    - 10 ÷ 2.
    solution: 10 ÷ 2 = 5.
  - prompt: What is a quarter of 12?
    answer: '3'
    check: Rational(12,4)
    difficulty: 1
    hints:
    - Share 12 among 4.
    - 12 ÷ 4.
    solution: 12 ÷ 4 = 3.
  - prompt: How many quarters make one half?
    options:
    - '2'
    - '4'
    - '1'
    - '3'
    answer: '2'
    difficulty: 2
    hints:
    - 1/4 + 1/4.
    - Fold paper.
    solution: Two quarters make one half.
    mistakes:
      '4': c4_half
  - prompt: 'A cake is cut into 3 equal parts. Each part is:'
    options:
    - one third
    - one half
    - one quarter
    - one fifth
    answer: one third
    difficulty: 1
    hints:
    - 3 equal parts.
    - Third.
    solution: Each of 3 equal parts is a third.
  - prompt: How many quarters make one whole?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Quarter = 4 equal parts.
    - All of them.
    solution: 4 quarters make 1 whole.
- code: cbse4m.share.money
  title: Sharing money and things equally
  after:
  - cbse4m.share.fractions
  notes: |
    Share equally by dividing: ₹60 among 3 children = ₹20 each. Share with leftovers: 13 sweets among 4 = 3 each, 1 left.
    Measuring by sharing: half a litre is 500 mL, half a kg is 500 g, half an hour is 30 minutes.
  explanations:
    text: To share equally, give everyone the same amount. Divide the total by the number of people. Sometimes some are left over.
    visual: 'Draw 3 children and 6 ten-rupee notes. Give one note to each child in turn until all are gone: 2 notes (₹20) each.'
    step_by_step: 'Step 1: Count the total. Step 2: Count the people. Step 3: Give one to each in turn, or divide. Step 4: Note any left over.'
    real_world: Splitting the cost of a gift among friends, or sharing a packet of biscuits.
  picture:
    kind: bars
    bars:
    - label: Child 1
      value: 20
    - label: Child 2
      value: 20
    - label: Child 3
      value: 20
    alt: 60 rupees shared among 3 children gives each child 20 rupees.
    unit: ₹
  activity:
    type: formula
    prompt: Share ₹60 equally. Set how many people and how much each one gets.
    inputs:
    - name: k
      label: People
      min: 1
      max: 10
      step: 1
      start: 1
    - name: e
      label: Each gets
      min: 0
      max: 60
      step: 1
      start: 0
      unit: ₹
    outputs:
    - name: used
      label: Given out
      expr: k*e
      unit: ₹
    - name: left
      label: Left over
      expr: 60-k*e
      unit: ₹
    goals:
    - prompt: Share among 4 people, nothing left.
      want:
        k: 4
        left: 0
      mistakes:
      - when:
          k: 4
          e: 10
        say: 4 × 10 = 40. There's still ₹20 to share.
      - when:
          k: 4
          e:
          - 16
          - 60
        say: That's more than ₹60!
    - prompt: Share among 5 people, nothing left.
      want:
        k: 5
        left: 0
      mistakes:
      - when:
          k: 5
          e: 10
        say: '5 × 10 = 50. ₹10 is left: give each one more.'
    - prompt: Share among 7 people. Give as much as you can.
      want:
        k: 7
        e: 8
      mistakes:
      - when:
          k: 7
          e: 9
        say: '7 × 9 = 63: more than ₹60. Give ₹8 each; ₹4 is left over.'
      - when:
          k: 7
          e:
          - 1
          - 7
        say: You can still give each one more rupee.
  items:
  - prompt: ₹60 is shared equally among 3 children. How many rupees does each get?
    answer: '20'
    check: 60/3
    difficulty: 1
    hints:
    - 60 ÷ 3.
    - 3 × 20 = 60.
    solution: 60 ÷ 3 = ₹20.
  - prompt: 13 sweets are shared among 4 children. How many does each child get?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - 4 × 3 = 12.
    - One is left over.
    solution: Each gets 3 and 1 is left over.
  - prompt: How many minutes is half an hour?
    answer: '30'
    check: 60/2
    difficulty: 1
    hints:
    - An hour has 60 minutes.
    - Half of 60.
    solution: Half of 60 = 30 minutes.
  - prompt: How many grams is half a kilogram?
    answer: '500'
    check: 1000/2
    difficulty: 1
    hints:
    - 1 kg = 1000 g.
    - Half of 1000.
    solution: Half of 1000 g = 500 g.
  - prompt: 24 pencils are packed equally into 6 boxes. How many in each box?
    answer: '4'
    check: 24/6
    difficulty: 1
    hints:
    - 24 ÷ 6.
    - 6 × 4 = 24.
    solution: 24 ÷ 6 = 4.
  - prompt: ₹100 is shared equally among 4 friends. How many rupees each?
    answer: '25'
    check: 100/4
    difficulty: 2
    hints:
    - 100 ÷ 4.
    - Four 25s make 100.
    solution: 100 ÷ 4 = ₹25.
