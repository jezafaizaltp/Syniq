# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 14. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 14
title: Data Handling
tips:
  c4_key: 'Read the key first: one picture may stand for more than one. Multiply the pictures by the key.'
  m4_bundles: "Each bundle shows 5. How many 5s make 15?"
  m4_half_picture: "Each whole picture is 2 children, so half a picture is 1 child."
  m4_pictures_needed: "Each picture shows 5 books. How many 5s make 20?"
  m4_read_key: "Before reading the rows, find what each picture stands for. It is in a small box by the graph."
  c4m14_tally: Count the bundles first (each bundle is 5), then add the single lines.
  c4m14_table: Read the table row by row. For 'how many more', subtract; for 'in all', add every row.
  c4m14_key: 'Read the key first: how many does one picture stand for? Then multiply by the number of pictures.'
concepts:
- code: cbse4m.data.tally
  title: Collecting data with tally marks
  notes: |
    Data are information we collect, like favourite fruits of a class. Tally marks: four lines and a fifth across make 5.
    Make a table of counts, then answer: most, least, total, difference.
  explanations:
    text: 'Data means facts we collect by asking or counting. Tally marks help us count fast: draw four lines and cross them with the fifth to make a bundle of 5.'
    visual: 'Draw a tally chart: Mango ||||̸ ||| (8), Banana ||||̸ (5), Apple ||| (3).'
    step_by_step: 'Step 1: Ask the question. Step 2: Make a tally for each answer. Step 3: Count the tallies. Step 4: Compare.'
    real_world: Teachers take attendance and count lunch choices, which is collecting data.
  picture:
    kind: bars
    bars:
    - label: Mango
      value: 8
    - label: Banana
      value: 5
    - label: Apple
      value: 3
    - label: Guava
      value: 4
    alt: 'Favourite fruits in a class: mango 8, banana 5, apple 3, guava 4.'
    unit: children
  activity:
    type: number_line
    min: 0
    max: 30
    step: 1
    start: 0
    prompt: A bundle of tally marks is 4 lines with a 5th line across. Count the marks.
    goals:
    - prompt: 2 bundles and 3 single lines.
      target: 13
      mistakes:
      - when:
          v: 5
        say: Each bundle is 5, not 1.
      - when:
          v: 11
        say: Each bundle has 5 lines, counting the one across.
    - prompt: 4 bundles.
      target: 20
      mistakes:
      - when:
          v: 4
        say: 'Each bundle is 5: count by fives.'
      - when:
          v: 16
        say: Don't forget the 5th line across each bundle.
    - prompt: 1 bundle and 1 single line.
      target: 6
      mistakes:
      - when:
          v: 2
        say: The bundle is 5 marks, not 1.
  lesson:
    - teach: 'Data is information we collect, like the favourite fruits of a class. We record it with tally marks: one line for each answer, and the fifth line goes across the four to make a bundle of 5.'
      check:
        prompt: How many does one full tally bundle show?
        options:
        - '5'
        - '4'
        - '10'
        answer: '5'
        why: 'Four lines and one across: 5.'
      ways:
      - style: step_by_step
        teach: 'Record answers with tally marks. Step 1: Ask each friend their favourite colour. Step 2: For each answer, draw one line next to that colour. Step 3: When there are four lines, draw the fifth across them to make a bundle. Step 4: Start a new bundle for the next answer.'
      - style: visual
        teach: How tally marks grow, one answer at a time, into a bundle of five.
        picture:
          kind: flow
          steps:
          - '1st answer: one line |'
          - '2nd: ||'
          - '3rd: |||'
          - '4th: ||||'
          - '5th: a line across the four makes a bundle of 5'
          - '6th: start a new line next to the bundle'
          alt: 'Each answer adds one line: one, two, three, four lines. The fifth answer is a line drawn across the four, making a bundle of 5. The sixth starts a new line next to the bundle.'
    - teach: Count tallies by fives, then add the extra lines. Two bundles and 3 lines = 5 + 5 + 3 = 13. Then make a table of counts.
      picture:
        kind: bars
        unit: children
        bars:
        - label: Mango
          value: 8
        - label: Banana
          value: 5
        - label: Guava
          value: 4
        - label: Apple
          value: 3
        alt: 'Favourite fruits: Mango 8, Banana 5, Guava 4, Apple 3.'
      check:
        prompt: 'Two bundles and 3 lines show:'
        options:
        - '13'
        - '5'
        - '23'
        answer: '13'
        why: 5 + 5 + 3 = 13.
      ways:
      - style: visual
        teach: 'Reading tallies: count the bundles of five, then the single lines.'
        picture:
          kind: compare
          columns:
          - title: Tally
            points:
            - 3 bundles + 4 lines
            - 1 bundle + 0 lines
            - 4 bundles + 1 line
          - title: Count
            points:
            - 5 + 5 + 5 + 4 = 19
            - '5'
            - 5 + 5 + 5 + 5 + 1 = 21
          alt: 3 bundles and 4 lines make 19. 1 bundle and no lines make 5. 4 bundles and 1 line make 21.
      - style: real_world
        teach: Election officers sometimes check counts with tallies. Grouping in fives means a long column of marks can be counted again quickly if anyone has a doubt.
    - teach: 'From the table we can answer: which is most or least, how many in all (add), and how many more (subtract).'
      check:
        prompt: Mango 8 and Banana 5. How many more chose Mango?
        options:
        - '3'
        - '13'
        - '2'
        answer: '3'
        why: 8 − 5 = 3.
      ways:
      - style: visual
        teach: A table of favourite pets, drawn as bars to answer questions.
        picture:
          kind: bars
          bars:
          - label: Dog
            value: 9
          - label: Cat
            value: 6
          - label: Fish
            value: 3
          - label: Parrot
            value: 5
          alt: Dog 9, cat 6, fish 3 and parrot 5. Dog is the most liked and fish the least. There are 23 children in all, and 3 more chose dog than cat.
      - style: step_by_step
        teach: 'Answer questions from a table. Step 1: For ''most'', find the biggest number. Step 2: For ''least'', find the smallest. Step 3: For ''in all'', add every row. Step 4: For ''how many more'', take the smaller number from the bigger.'
  items:
  - prompt: 'How many does this tally show: one bundle of five and two more lines?'
    answer: '7'
    check: 5+2
    difficulty: 1
    hints:
    - A bundle is 5.
    - 5 + 2.
    solution: 5 + 2 = 7.
    mistakes: {"3": "m5_tally", "52": "m5_tally"}
  - prompt: Mango 8, Banana 5, Apple 3, Guava 4. Which fruit is the favourite?
    options:
    - Mango
    - Banana
    - Apple
    - Guava
    answer: Mango
    difficulty: 1
    hints:
    - Most votes.
    - Biggest number.
    solution: 'Mango has the most: 8.'
    mistakes: {"Banana": "m5_most"}
  - prompt: Mango 8, Banana 5, Apple 3, Guava 4. How many children in all?
    answer: '20'
    check: 8+5+3+4
    difficulty: 1
    hints:
    - Add all.
    - 8 + 5 + 3 + 4.
    solution: 8 + 5 + 3 + 4 = 20.
    mistakes: {"16": "m5_add_all", "19": "m5_add_all"}
  - prompt: How many more children chose mango (8) than apple (3)?
    answer: '5'
    check: 8-3
    difficulty: 1
    hints:
    - Difference.
    - 8 − 3.
    solution: 8 − 3 = 5.
    mistakes: {"11": "m5_subtract_not_add", "3": "m5_subtract_not_add"}
  - prompt: Which fruit got the fewest votes?
    options:
    - Apple
    - Mango
    - Banana
    - Guava
    answer: Apple
    difficulty: 1
    hints:
    - Smallest number.
    - '3.'
    solution: 'Apple has the fewest: 3.'
    mistakes: {"Guava": "m5_least_popular"}
  - prompt: How many bundles of five do you draw to show 15?
    answer: '3'
    check: 15/5
    difficulty: 2
    hints:
    - 15 ÷ 5.
    - Each bundle is 5.
    solution: 15 ÷ 5 = 3 bundles.
    mistakes: {"5": "m4_bundles", "15": "m4_bundles"}
  - prompt: 'How many does this tally show: three bundles of five and one more line?'
    answer: '16'
    check: 5*3+1
    difficulty: 1
    hints:
    - Each bundle is 5.
    - Count the bundles by fives, then add the single line.
    solution: 'Step 1: 3 bundles = 15. Step 2: 15 + 1 = 16.'
    mistakes:
      '4': c4m14_tally
      '13': c4m14_tally
      '31': c4m14_tally
  - prompt: How many bundles and single lines show 12?
    options:
    - 2 bundles and 2 lines
    - 1 bundle and 7 lines
    - 12 bundles
    answer: 2 bundles and 2 lines
    difficulty: 2
    hints:
    - How many full 5s fit in 12?
    - What is left over?
    solution: 'Step 1: Two 5s make 10. Step 2: 12 − 10 = 2 single lines.'
    mistakes:
      1 bundle and 7 lines: c4m14_tally
      12 bundles: c4m14_tally
  - prompt: Red 6, Blue 9, Green 4, Yellow 7. Which colour is most liked?
    options:
    - Blue
    - Yellow
    - Red
    answer: Blue
    difficulty: 1
    hints:
    - Most liked = biggest number.
    - Compare 6, 9, 4, 7.
    solution: 'Step 1: The biggest number is 9. Step 2: Blue.'
    mistakes:
      Yellow: c4m14_table
      Red: c4m14_table
  - prompt: Red 6, Blue 9, Green 4, Yellow 7. How many children in all?
    answer: '26'
    check: 6+9+4+7
    difficulty: 2
    hints:
    - Add every row.
    - 6 + 4 make 10 first.
    solution: 'Step 1: 6 + 4 = 10, 9 + 7 = 16. Step 2: 10 + 16 = 26.'
    mistakes:
      '25': c4m14_table
      '9': c4m14_table
      '36': c4m14_table
  - prompt: Red 6, Blue 9, Green 4, Yellow 7. How many more chose Blue than Green?
    answer: '5'
    check: 9-4
    difficulty: 2
    hints:
    - '''How many more'' means subtract.'
    - Blue − Green.
    solution: 'Step 1: 9 − 4. Step 2: = 5.'
    mistakes:
      '13': c4m14_table
      '3': c4m14_table
  - prompt: Why do we make the fifth tally line go across?
    options:
    - to make counting by fives easy
    - to cross out a mistake
    - to show zero
    answer: to make counting by fives easy
    difficulty: 2
    hints:
    - Bundles are groups of the same size.
    - Counting in groups is quicker than one by one.
    solution: 'Step 1: Each crossed bundle is 5. Step 2: We can count 5, 10, 15 quickly.'
    mistakes:
      to cross out a mistake: c4m14_tally
      to show zero: c4m14_tally
  - prompt: Cricket 11, Football 8, Kabaddi 6. If 5 more children choose Kabaddi, how many choose Kabaddi now?
    answer: '11'
    check: 6+5
    difficulty: 2
    hints:
    - Find the Kabaddi number first.
    - Add the 5 new children.
    solution: 'Step 1: Kabaddi had 6. Step 2: 6 + 5 = 11.'
    mistakes:
      '16': c4m14_table
      '13': c4m14_table
      '30': c4m14_table
  - prompt: Cricket 11, Football 8, Kabaddi 6. Which game got the fewest votes?
    options:
    - Kabaddi
    - Football
    - Cricket
    answer: Kabaddi
    difficulty: 1
    hints:
    - Fewest = smallest number.
    - Compare 11, 8, 6.
    solution: 'Step 1: The smallest is 6. Step 2: Kabaddi.'
    mistakes:
      Football: c4m14_table
      Cricket: c4m14_table
  - prompt: A class of 30 voted. Tea 12, Milk 10, and the rest chose Juice. How many chose Juice?
    answer: '8'
    check: 30-12-10
    difficulty: 3
    hints:
    - Add Tea and Milk first.
    - The rest = total − that sum.
    solution: 'Step 1: 12 + 10 = 22. Step 2: 30 − 22 = 8.'
    mistakes:
      '18': c4m14_table
      '20': c4m14_table
      '52': c4m14_table
  - prompt: 'Case: A class voted for its favourite breakfast: Idli 7, Dosa 11, Puri 4. How many more children chose Dosa than Puri?'
    options:
    - '7'
    - '15'
    - '22'
    answer: '7'
    hints:
    - Does 'how many more' mean add or take away?
    - Take Puri's count from Dosa's count.
    solution: 11 − 4 = 7, so 7 more children chose Dosa.
    mistakes:
      '15': c4m14_table
      '22': c4m14_table
    exam: case
    difficulty: 2
  - prompt: 'Situation: You counted 18 children who walk to school. How should you show 18 with tally marks?'
    options:
    - 3 bundles of five and 3 single lines
    - 18 bundles
    - 1 bundle and 8 single lines
    answer: 3 bundles of five and 3 single lines
    hints:
    - Each bundle is 5.
    - How many fives fit in 18, and how many are left?
    solution: 3 bundles make 15, and 3 more lines make 18.
    mistakes:
      18 bundles: c4m14_tally
      1 bundle and 8 single lines: c4m14_tally
    exam: competency
    difficulty: 2
- code: cbse4m.data.picture
  title: Pictographs
  after:
  - cbse4m.data.tally
  notes: |
    A pictograph shows data with pictures. Key: 1 ☺ = 2 children. 4 pictures = 8 children; a half picture = 1. Read the
    key first, then multiply.
  explanations:
    text: 'A pictograph uses small pictures to show numbers. Always read the key: if one picture means 2 children, then 4 pictures mean 8 children.'
    visual: 'Draw a pictograph of how children come to school with key 1 picture = 2 children: Walk 4 pictures, Bus 3, Cycle 2.'
    step_by_step: 'Step 1: Read the key. Step 2: Count the pictures in a row. Step 3: Multiply by the key.'
    real_world: Class notice boards show pictographs of birthdays in each month or favourite games.
  picture:
    kind: bars
    bars:
    - label: Walk
      value: 8
    - label: Bus
      value: 6
    - label: Cycle
      value: 4
    alt: 'How children come to school: walk 8, bus 6, cycle 4.'
    unit: children
  activity:
    type: formula
    prompt: A pictograph. Each picture stands for k children.
    inputs:
    - name: k
      label: Children per picture (key)
      min: 1
      max: 10
      step: 1
      start: 1
    - name: p
      label: Pictures
      min: 0
      max: 20
      step: 1
      start: 0
    outputs:
    - name: tot
      label: Children shown
      expr: k*p
    goals:
    - prompt: 'Key: 1 picture = 2 children. Show 14 children.'
      want:
        k: 2
        tot: 14
      mistakes:
      - when:
          k: 2
          p: 14
        say: 14 pictures would show 28 children. Each picture is 2.
    - prompt: 6 pictures show 30 children. What is the key?
      want:
        p: 6
        tot: 30
      mistakes:
      - when:
          p: 6
          k: 6
        say: 6 × 6 = 36. Each picture stands for fewer.
    - prompt: 'Key: 1 picture = 10 children. Show 70 children.'
      want:
        k: 10
        tot: 70
      mistakes:
      - when:
          k: 10
          p:
          - 8
          - 20
        say: 'Too many pictures: 8 × 10 = 80.'
  lesson:
    - teach: A pictograph shows data with pictures. The key tells how many each picture stands for. Always read the key first.
      check:
        prompt: 'Key: 1 ☺ = 2 children. What do 3 pictures show?'
        options:
        - 6 children
        - 3 children
        - 5 children
        answer: 6 children
        why: 3 × 2 = 6.
      ways:
      - style: visual
        teach: The same pictures mean different numbers with different keys.
        picture:
          kind: compare
          columns:
          - title: Key
            points:
            - 1 picture = 1
            - 1 picture = 4
            - 1 picture = 10
          - title: 4 pictures mean
            points:
            - '4'
            - '16'
            - '40'
          alt: With a key of 1 picture = 1, four pictures mean 4. With 1 picture = 4, four pictures mean 16. With 1 picture = 10, four pictures mean 40.
      - style: step_by_step
        teach: 'Read a pictograph. Step 1: Find the key and write it down, for example 1 picture = 6 kites. Step 2: Count the pictures in a row: 3. Step 3: Multiply: 3 × 6 = 18 kites. Step 4: Do the same for each row.'
    - teach: A half picture stands for half the key value. If 1 ☺ = 2 children, half a ☺ = 1 child. If 1 ☺ = 10 books, half = 5 books.
      picture:
        kind: compare
        columns:
        - title: Key
          points:
          - 1 ☺ = 2 children
          - half ☺ = 1 child
        - title: 'Walk: ☺ ☺ ☺ ☺'
          points:
          - 4 × 2 = 8
        - title: 'Cycle: ☺ ☺ half'
          points:
          - 2 × 2 + 1 = 5
        alt: Reading a pictograph with a key of 2 children per picture, including a half picture.
      check:
        prompt: 'Key: 1 picture = 10 books. A row has 3 and a half pictures. How many books?'
        options:
        - '35'
        - '31'
        - '30'
        answer: '35'
        why: 3 × 10 = 30, plus half of 10 = 5.
      ways:
      - style: step_by_step
        teach: 'Read a half picture. Step 1: Read the key: 1 picture = 8 apples. Step 2: Half a picture is half of 8: 4 apples. Step 3: A row with 2 full pictures and a half: 8 + 8 + 4. Step 4: That makes 20 apples.'
      - style: real_world
        teach: Newspapers sometimes show how many trees a city planted using little tree pictures, where one tree picture might stand for 1,000 real trees.
    - teach: To draw a pictograph, divide by the key. 20 books with 1 picture = 5 books needs 20 ÷ 5 = 4 pictures.
      check:
        prompt: 'Key: 1 picture = 4 cars. How many pictures for 12 cars?'
        options:
        - '3'
        - '48'
        - '8'
        answer: '3'
        why: 12 ÷ 4 = 3.
      ways:
      - style: visual
        teach: Drawing a pictograph for 24 cars with the key 1 picture = 4 cars.
        picture:
          kind: bars
          bars:
          - label: Cars counted
            value: 24
          - label: Pictures needed (24 ÷ 4)
            value: 6
          alt: To show 24 cars with 1 picture = 4 cars, draw 24 ÷ 4 = 6 pictures.
      - style: real_world
        teach: When children make a pictograph of class birthdays by month, they choose a key like 1 cake = 2 children so the chart fits on one page.
  items:
  - prompt: 'Key: 1 picture = 2 children. ''Walk'' has 4 pictures. How many children walk?'
    answer: '8'
    check: 4*2
    difficulty: 1
    hints:
    - 4 × 2.
    - Use the key.
    solution: 4 × 2 = 8.
    mistakes:
      '4': c4_key
  - prompt: 'Key: 1 picture = 2 children. ''Bus'' has 3 pictures. How many children?'
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - 3 × 2.
    - Key.
    solution: 3 × 2 = 6.
    mistakes:
      '3': c4_key
  - prompt: 'Key: 1 picture = 2 children. A row has 2 and a half pictures. How many?'
    answer: '5'
    check: 2*2+1
    difficulty: 2
    hints:
    - Half a picture = 1 child.
    - 4 + 1.
    solution: 2 × 2 + 1 = 5.
    mistakes: {"2": "m4_half_picture", "6": "m4_half_picture"}
  - prompt: What should you read first in a pictograph?
    options:
    - the key
    - the last row
    - the title only
    - nothing
    answer: the key
    difficulty: 1
    hints:
    - It tells what one picture means.
    - Key.
    solution: The key tells you the value of each picture.
    mistakes: {"the last row": "m4_read_key"}
  - prompt: Walk 8, Bus 6, Cycle 4. How many children in all?
    answer: '18'
    check: 8+6+4
    difficulty: 1
    hints:
    - Add.
    - 8 + 6 + 4.
    solution: 8 + 6 + 4 = 18.
    mistakes: {"14": "m5_add_all", "17": "m5_add_all"}
  - prompt: 'Key: 1 picture = 5 books. How many pictures for 20 books?'
    answer: '4'
    check: 20/5
    difficulty: 2
    hints:
    - 20 ÷ 5.
    - Each picture is 5.
    solution: 20 ÷ 5 = 4 pictures.
    mistakes: {"20": "m4_pictures_needed", "100": "m4_pictures_needed"}
  - prompt: 'Key: 1 picture = 5 children. ''Bus'' has 6 pictures. How many children come by bus?'
    answer: '30'
    check: 5*6
    difficulty: 1
    hints:
    - Read the key first.
    - Multiply pictures by the key.
    solution: 'Step 1: 6 pictures × 5. Step 2: = 30 children.'
    mistakes:
      '6': c4m14_key
      '11': c4m14_key
      '35': c4m14_key
  - prompt: 'Key: 1 picture = 4 trees. A row has 2 and a half pictures. How many trees?'
    answer: '10'
    check: 2*4+4//2
    difficulty: 2
    hints:
    - Two full pictures first.
    - Half a picture = half of 4.
    solution: 'Step 1: 2 × 4 = 8. Step 2: Half of 4 = 2; 8 + 2 = 10.'
    mistakes:
      '8': c4m14_key
      '9': c4m14_key
      '12': c4m14_key
  - prompt: 'Key: 1 picture = 10 mangoes. How many pictures for 70 mangoes?'
    answer: '7'
    check: 70//10
    difficulty: 1
    hints:
    - Divide by the key.
    - How many 10s in 70?
    solution: 'Step 1: 70 ÷ 10. Step 2: = 7 pictures.'
    mistakes:
      '70': c4m14_key
      '700': c4m14_key
      '60': c4m14_key
  - prompt: 'Key: 1 picture = 2 children. Monday has 5 pictures and Tuesday 3. How many more children on Monday?'
    answer: '4'
    check: (5-3)*2
    difficulty: 3
    hints:
    - Find the picture difference first.
    - Then use the key.
    solution: 'Step 1: 5 − 3 = 2 pictures. Step 2: 2 × 2 = 4 children.'
    mistakes:
      '2': c4m14_key
      '16': c4m14_key
      '6': c4m14_key
  - prompt: 'Key: 1 picture = 3 kites. How many kites do 4 pictures show?'
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - Each picture is 3 kites.
    - 4 lots of 3.
    solution: 'Step 1: 4 × 3. Step 2: = 12 kites.'
    mistakes:
      '4': c4m14_key
      '7': c4m14_key
      '3': c4m14_key
  - prompt: 'Key: 1 picture = 2 children. How should you show 7 children?'
    options:
    - 3 and a half pictures
    - 7 pictures
    - 2 pictures
    answer: 3 and a half pictures
    difficulty: 2
    hints:
    - How many full pictures fit in 7?
    - What is left, and what is half of 2?
    solution: 'Step 1: 3 pictures = 6 children. Step 2: 1 more child = half a picture.'
    mistakes:
      7 pictures: c4m14_key
      2 pictures: c4m14_key
  - prompt: 'Key: 1 picture = 5 books. Class A has 4 pictures, Class B has 3. How many books in all?'
    answer: '35'
    check: (4+3)*5
    difficulty: 2
    hints:
    - Add the pictures first.
    - Then multiply by the key.
    solution: 'Step 1: 4 + 3 = 7 pictures. Step 2: 7 × 5 = 35 books.'
    mistakes:
      '7': c4m14_key
      '12': c4m14_key
      '40': c4m14_key
  - prompt: Why do we use a key like '1 picture = 10' for big numbers?
    options:
    - so we do not have to draw too many pictures
    - so the graph looks empty
    - to make numbers smaller
    answer: so we do not have to draw too many pictures
    difficulty: 2
    hints:
    - Imagine drawing 100 pictures.
    - With the key, how many would you draw?
    solution: 'Step 1: 100 things would need 100 pictures without a key. Step 2: With 1 = 10, only 10 pictures.'
    mistakes:
      so the graph looks empty: c4m14_key
      to make numbers smaller: c4m14_key
  - prompt: 'Key: 1 picture = 4 children. ''Walk'' has 3 pictures, ''Car'' has 1 and a half. How many children walk or come by car?'
    answer: '18'
    check: 3*4+4+2
    difficulty: 3
    hints:
    - 'Walk: 3 × 4.'
    - 'Car: 1 × 4 plus half of 4.'
    solution: 'Step 1: Walk 12, Car 4 + 2 = 6. Step 2: 12 + 6 = 18.'
    mistakes:
      '16': c4m14_key
      '4': c4m14_key
      '20': c4m14_key
  - prompt: 'Case: A pictograph shows museum visitors. The key is 1 picture = 10 visitors. Saturday''s row has 4 and a half pictures. How many visitors came on Saturday?'
    options:
    - '45'
    - '40'
    - '9'
    answer: '45'
    hints:
