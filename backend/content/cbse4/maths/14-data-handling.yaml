# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 14. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 14
title: Data Handling
tips:
  c4_key: 'Read the key first: one picture may stand for more than one. Multiply the pictures by the key.'
concepts:
- code: cbse4m.data.tally
  title: Collecting data with tally marks
  notes: |
    Data are information we collect, like favourite fruits of a class. Tally marks: four lines and a fifth across make 5.
    Make a table of counts, then answer: most, least, total, difference.
  explanations:
    text: 'Data means facts we collect by asking or counting. Tally marks help us count fast: draw four lines and cross them with the fifth to make a bundle of 5.'
    visual: 'Draw a tally chart: Mango ||||̸ ||| (8), Banana ||||̸ (5), Apple ||| (3).'
    step_by_step: 'Step 1: Ask the question. Step 2: Make a tally for each answer. Step 3: Count the tallies. Step 4: Compare.'
    real_world: Teachers take attendance and count lunch choices, which is collecting data.
  picture:
    kind: bars
    bars:
    - label: Mango
      value: 8
    - label: Banana
      value: 5
    - label: Apple
      value: 3
    - label: Guava
      value: 4
    alt: 'Favourite fruits in a class: mango 8, banana 5, apple 3, guava 4.'
    unit: children
  activity:
    type: number_line
    min: 0
    max: 30
    step: 1
    start: 0
    prompt: A bundle of tally marks is 4 lines with a 5th line across. Count the marks.
    goals:
    - prompt: 2 bundles and 3 single lines.
      target: 13
      mistakes:
      - when:
          v: 5
        say: Each bundle is 5, not 1.
      - when:
          v: 11
        say: Each bundle has 5 lines, counting the one across.
    - prompt: 4 bundles.
      target: 20
      mistakes:
      - when:
          v: 4
        say: 'Each bundle is 5: count by fives.'
      - when:
          v: 16
        say: Don't forget the 5th line across each bundle.
    - prompt: 1 bundle and 1 single line.
      target: 6
      mistakes:
      - when:
          v: 2
        say: The bundle is 5 marks, not 1.
  items:
  - prompt: 'How many does this tally show: one bundle of five and two more lines?'
    answer: '7'
    check: 5+2
    difficulty: 1
    hints:
    - A bundle is 5.
    - 5 + 2.
    solution: 5 + 2 = 7.
  - prompt: Mango 8, Banana 5, Apple 3, Guava 4. Which fruit is the favourite?
    options:
    - Mango
    - Banana
    - Apple
    - Guava
    answer: Mango
    difficulty: 1
    hints:
    - Most votes.
    - Biggest number.
    solution: 'Mango has the most: 8.'
  - prompt: Mango 8, Banana 5, Apple 3, Guava 4. How many children in all?
    answer: '20'
    check: 8+5+3+4
    difficulty: 1
    hints:
    - Add all.
    - 8 + 5 + 3 + 4.
    solution: 8 + 5 + 3 + 4 = 20.
  - prompt: How many more children chose mango (8) than apple (3)?
    answer: '5'
    check: 8-3
    difficulty: 1
    hints:
    - Difference.
    - 8 − 3.
    solution: 8 − 3 = 5.
  - prompt: Which fruit got the fewest votes?
    options:
    - Apple
    - Mango
    - Banana
    - Guava
    answer: Apple
    difficulty: 1
    hints:
    - Smallest number.
    - '3.'
    solution: 'Apple has the fewest: 3.'
  - prompt: How many bundles of five do you draw to show 15?
    answer: '3'
    check: 15/5
    difficulty: 2
    hints:
    - 15 ÷ 5.
    - Each bundle is 5.
    solution: 15 ÷ 5 = 3 bundles.
- code: cbse4m.data.picture
  title: Pictographs
  after:
  - cbse4m.data.tally
  notes: |
    A pictograph shows data with pictures. Key: 1 ☺ = 2 children. 4 pictures = 8 children; a half picture = 1. Read the
    key first, then multiply.
  explanations:
    text: 'A pictograph uses small pictures to show numbers. Always read the key: if one picture means 2 children, then 4 pictures mean 8 children.'
    visual: 'Draw a pictograph of how children come to school with key 1 picture = 2 children: Walk 4 pictures, Bus 3, Cycle 2.'
    step_by_step: 'Step 1: Read the key. Step 2: Count the pictures in a row. Step 3: Multiply by the key.'
    real_world: Class notice boards show pictographs of birthdays in each month or favourite games.
  picture:
    kind: bars
    bars:
    - label: Walk
      value: 8
    - label: Bus
      value: 6
    - label: Cycle
      value: 4
    alt: 'How children come to school: walk 8, bus 6, cycle 4.'
    unit: children
  activity:
    type: formula
    prompt: A pictograph. Each picture stands for k children.
    inputs:
    - name: k
      label: Children per picture (key)
      min: 1
      max: 10
      step: 1
      start: 1
    - name: p
      label: Pictures
      min: 0
      max: 20
      step: 1
      start: 0
    outputs:
    - name: tot
      label: Children shown
      expr: k*p
    goals:
    - prompt: 'Key: 1 picture = 2 children. Show 14 children.'
      want:
        k: 2
        tot: 14
      mistakes:
      - when:
          k: 2
          p: 14
        say: 14 pictures would show 28 children. Each picture is 2.
    - prompt: 6 pictures show 30 children. What is the key?
      want:
        p: 6
        tot: 30
      mistakes:
      - when:
          p: 6
          k: 6
        say: 6 × 6 = 36. Each picture stands for fewer.
    - prompt: 'Key: 1 picture = 10 children. Show 70 children.'
      want:
        k: 10
        tot: 70
      mistakes:
      - when:
          k: 10
          p:
          - 8
          - 20
        say: 'Too many pictures: 8 × 10 = 80.'
  items:
  - prompt: 'Key: 1 picture = 2 children. ''Walk'' has 4 pictures. How many children walk?'
    answer: '8'
    check: 4*2
    difficulty: 1
    hints:
    - 4 × 2.
    - Use the key.
    solution: 4 × 2 = 8.
    mistakes:
      '4': c4_key
  - prompt: 'Key: 1 picture = 2 children. ''Bus'' has 3 pictures. How many children?'
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - 3 × 2.
    - Key.
    solution: 3 × 2 = 6.
    mistakes:
      '3': c4_key
  - prompt: 'Key: 1 picture = 2 children. A row has 2 and a half pictures. How many?'
    answer: '5'
    check: 2*2+1
    difficulty: 2
    hints:
    - Half a picture = 1 child.
    - 4 + 1.
    solution: 2 × 2 + 1 = 5.
  - prompt: What should you read first in a pictograph?
    options:
    - the key
    - the last row
    - the title only
    - nothing
    answer: the key
    difficulty: 1
    hints:
    - It tells what one picture means.
    - Key.
    solution: The key tells you the value of each picture.
  - prompt: Walk 8, Bus 6, Cycle 4. How many children in all?
    answer: '18'
    check: 8+6+4
    difficulty: 1
    hints:
    - Add.
    - 8 + 6 + 4.
    solution: 8 + 6 + 4 = 18.
  - prompt: 'Key: 1 picture = 5 books. How many pictures for 20 books?'
    answer: '4'
    check: 20/5
    difficulty: 2
    hints:
    - 20 ÷ 5.
    - Each picture is 5.
    solution: 20 ÷ 5 = 4 pictures.
