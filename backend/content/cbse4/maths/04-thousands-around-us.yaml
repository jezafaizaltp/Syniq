# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 4
title: Thousands Around Us
tips:
  c4_place: 'Read the digits from the left: thousands, hundreds, tens, ones. A 0 holds an empty place.'
concepts:
- code: cbse4m.thou.place
  title: Numbers up to 9999
  notes: |
    1000 = 10 hundreds. Four-digit numbers: 3,452 = 3 thousands + 4 hundreds + 5 tens + 2 ones. Read: three thousand four
    hundred fifty-two. Zero keeps an empty place: 4,027. Compare from the left. Largest 4-digit number 9,999; smallest
    1,000.
  explanations:
    text: 'One thousand is ten hundreds. In a 4-digit number, the first digit tells how many thousands. Read each place from the left: thousands, hundreds, tens, ones.'
    visual: 'Draw a place value chart: Th | H | T | O. Write 3 | 4 | 5 | 2 for 3,452.'
    step_by_step: 'Step 1: Write the number in the chart. Step 2: Read each digit with its place. Step 3: To compare, start from the thousands.'
    real_world: A stadium may hold thousands of people; a school library may have over 1,000 books.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Thousands
      - Hundreds
      - Tens
      - Ones
    - title: In 3,452
      points:
      - 3 → 3000
      - 4 → 400
      - 5 → 50
      - 2 → 2
    alt: In 3,452 the 3 is worth 3000, the 4 is worth 400, the 5 is worth 50 and the 2 is worth 2.
  activity:
    type: formula
    prompt: Build a number from thousands, hundreds, tens and ones.
    inputs:
    - name: th
      label: Thousands
      min: 0
      max: 9
      step: 1
      start: 0
    - name: h
      label: Hundreds
      min: 0
      max: 9
      step: 1
      start: 0
    - name: te
      label: Tens
      min: 0
      max: 9
      step: 1
      start: 0
    - name: o
      label: Ones
      min: 0
      max: 9
      step: 1
      start: 0
    outputs:
    - name: val
      label: The number
      expr: 1000*th+100*h+10*te+o
    goals:
    - prompt: Make 3,056.
      want:
        val: 3056
      mistakes:
      - when:
          th: 3
          h: 5
          te: 6
          o: 0
        say: That's 3,560. There are 0 hundreds in 3,056.
    - prompt: Make 7,400.
      want:
        val: 7400
      mistakes:
      - when:
          th: 7
          h: 0
          te: 4
          o: 0
        say: That's 7,040. The 4 is in the hundreds place.
    - prompt: Make the smallest number from the digits 4, 1, 7 and 3.
      want:
        val: 1347
      mistakes:
      - when:
          val: 7431
        say: That's the biggest. Put the smallest digit first.
      - when:
          val: 1374
        say: Close! Put 4 before 7.
  items:
  - prompt: What is the value of 4 in 3,452?
    answer: '400'
    check: 4*100
    difficulty: 1
    hints:
    - Which place is the 4 in?
    - Hundreds.
    solution: 4 hundreds = 400.
    mistakes:
      '4': c4_place
      '40': c4_place
  - prompt: 'Write the number: 2 thousands + 0 hundreds + 6 tens + 5 ones.'
    answer: '2065'
    check: 2000+60+5
    difficulty: 1
    hints:
    - Put a 0 for no hundreds.
    - 2, 0, 6, 5.
    solution: 2000 + 60 + 5 = 2,065.
    mistakes:
      '265': c4_place
  - prompt: How many hundreds make one thousand?
    answer: '10'
    check: 1000/100
    difficulty: 1
    hints:
    - 1000 ÷ 100.
    - Ten hundreds.
    solution: 10 hundreds = 1000.
  - prompt: Which number is the biggest?
    options:
    - 4,120
    - 4,102
    - 1,420
    - 2,410
    answer: 4,120
    difficulty: 1
    hints:
    - Compare thousands first.
    - Then hundreds, then tens.
    solution: 4,120 beats 4,102 in the tens place.
  - prompt: What is the largest 4-digit number?
    answer: '9999'
    check: '9999'
    difficulty: 2
    hints:
    - Use the biggest digit in every place.
    - 9 everywhere.
    solution: 9,999 is the largest 4-digit number.
  - prompt: What number is 1 more than 2,999?
    answer: '3000'
    check: 2999+1
    difficulty: 2
    hints:
    - 9 ones + 1 makes a ten ...
    - It rolls over.
    solution: 2,999 + 1 = 3,000.
- code: cbse4m.thou.addsub
  title: Adding and taking away bigger numbers
  after:
  - cbse4m.thou.place
  notes: |
    Add 4-digit numbers place by place, carrying when a place passes 9 (2,345 + 1,278 = 3,623). Subtract with
    borrowing (5,000 − 1,250 = 3,750). Estimate by rounding to the nearest hundred or thousand to check.
  explanations:
    text: Line up the places and add from the ones. If a column makes 10 or more, carry 1 to the next place. To subtract, borrow from the next place when the top digit is too small.
    visual: 'Write 2,345 above 1,278. Ones: 5 + 8 = 13 → 3 carry 1. Tens: 4 + 7 + 1 = 12 → 2 carry 1. Hundreds: 3 + 2 + 1 = 6. Thousands: 2 + 1 = 3. Answer 3,623.'
    step_by_step: 'Step 1: Line up the places. Step 2: Start from the ones. Step 3: Carry or borrow. Step 4: Check by estimating.'
    real_world: Adding up the money collected at a school fair, or finding how many tickets are left.
  picture:
    kind: flow
    steps:
    - 'Ones: 5 + 8 = 13 → 3, carry 1'
    - 'Tens: 4 + 7 + 1 = 12 → 2, carry 1'
    - 'Hundreds: 3 + 2 + 1 = 6'
    - 'Thousands: 2 + 1 = 3 → 3,623'
    alt: Adding 2,345 and 1,278 place by place with carrying gives 3,623.
  activity:
    type: sort
    prompt: Add or take away. Which answer does each one make?
    bins:
    - '635'
    - '1635'
    - '2635'
    items:
    - label: 3000 − 2365
      bin: '635'
      clue: '0 − 5: borrow, all the way from the thousands.'
      why: '635. Check: 635 + 2365 = 3000.'
    - label: 500 + 135
      bin: '635'
      clue: Hundreds, tens, ones.
      why: '635.'
    - label: 1000 − 365
      bin: '635'
      clue: Borrow across the zeros.
      why: '635.'
    - label: 4000 − 2365
      bin: '1635'
      clue: Borrowing turns the zeros into 9s.
      why: 1635. Check by adding.
    - label: 1000 + 635
      bin: '1635'
      clue: One thousand more.
      why: '1635.'
    - label: 1700 − 65
      bin: '1635'
      clue: Take 65 away from 1700.
      why: '1635.'
    - label: 5000 − 2365
      bin: '2635'
      clue: 'Borrow across the zeros: 4 thousands, 9 hundreds, 9 tens, 10 ones.'
      why: '2635.'
    - label: 2000 + 635
      bin: '2635'
      clue: Two thousands and 635.
      why: '2635.'
    - label: 1365 + 1270
      bin: '2635'
      clue: 5 + 0, 6 + 7 (carry), 3 + 2 + 1, 1 + 1.
      why: '2635.'
  items:
  - prompt: What is 2,345 + 1,278?
    answer: '3623'
    check: 2345+1278
    difficulty: 1
    hints:
    - Start with the ones.
    - Carry when needed.
    solution: 2,345 + 1,278 = 3,623.
    mistakes:
      '3513': c4_place
  - prompt: What is 5,000 − 1,250?
    answer: '3750'
    check: 5000-1250
    difficulty: 2
    hints:
    - Borrow from the thousands.
    - 5000 − 1000 − 250.
    solution: 5,000 − 1,250 = 3,750.
  - prompt: A school fair sold 1,450 tickets on day 1 and 1,320 on day 2. How many in all?
    answer: '2770'
    check: 1450+1320
    difficulty: 1
    hints:
    - Add the two days.
    - 1450 + 1320.
    solution: 1,450 + 1,320 = 2,770 tickets.
  - prompt: A village has 3,200 people. 1,450 are children. How many are not children?
    answer: '1750'
    check: 3200-1450
    difficulty: 2
    hints:
    - Take away.
    - 3200 − 1450.
    solution: 3,200 − 1,450 = 1,750.
  - prompt: What is 999 + 1?
    answer: '1000'
    check: 999+1
    difficulty: 1
    hints:
    - One more than 999.
    - Every place rolls over.
    solution: 999 + 1 = 1,000.
  - prompt: Which is the best estimate for 2,980 + 1,020?
    options:
    - about 4,000
    - about 3,000
    - about 5,000
    - about 40,000
    answer: about 4,000
    difficulty: 1
    hints:
    - Round each to the nearest thousand.
    - 3,000 + 1,000.
    solution: About 3,000 + 1,000 = 4,000.
