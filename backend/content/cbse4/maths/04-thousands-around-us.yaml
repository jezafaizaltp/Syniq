# CBSE Class 4 Mathematics (NCERT Maths Mela, 2025-26), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude.
subject: cbse4-math
chapter: 4
title: Thousands Around Us
tips:
  c4_place: 'Read the digits from the left: thousands, hundreds, tens, ones. A 0 holds an empty place.'
  m4_hundreds: "Count in hundreds: 100, 200, ... up to 1000. How many steps?"
  m4_largest_4digit: "The largest digit is 9. Put it in every place."
  m4_one_more: "2,999 + 1: the 9s all roll over, like a car's meter."
  c4m4_place: 'Write the number in a place chart: Th | H | T | O. Which column is the digit in?'
  c4m4_carry: Work from the ones place leftwards. When a place reaches 10 or more, carry 1 to the next place.
  c4m4_borrow: Start at the ones. If the top digit is smaller, borrow 1 from the next place to make 10 more.
  c4m4_compare: 'Compare digits from the left: thousands first, then hundreds, and so on.'
  pqc4m4_round: Round each number to the nearest hundred, add the rounded numbers, and see how close that is to the guess.
concepts:
- code: cbse4m.thou.place
  title: Numbers up to 9999
  notes: |
    1000 = 10 hundreds. Four-digit numbers: 3,452 = 3 thousands + 4 hundreds + 5 tens + 2 ones. Read: three thousand four
    hundred fifty-two. Zero keeps an empty place: 4,027. Compare from the left. Largest 4-digit number 9,999; smallest
    1,000.
  explanations:
    text: 'One thousand is ten hundreds. In a 4-digit number, the first digit tells how many thousands. Read each place from the left: thousands, hundreds, tens, ones.'
    visual: 'Draw a place value chart: Th | H | T | O. Write 3 | 4 | 5 | 2 for 3,452.'
    step_by_step: 'Step 1: Write the number in the chart. Step 2: Read each digit with its place. Step 3: To compare, start from the thousands.'
    real_world: A stadium may hold thousands of people; a school library may have over 1,000 books.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Thousands
      - Hundreds
      - Tens
      - Ones
    - title: In 3,452
      points:
      - 3 → 3000
      - 4 → 400
      - 5 → 50
      - 2 → 2
    alt: In 3,452 the 3 is worth 3000, the 4 is worth 400, the 5 is worth 50 and the 2 is worth 2.
  activity:
    type: formula
    prompt: Build a number from thousands, hundreds, tens and ones.
    inputs:
    - name: th
      label: Thousands
      min: 0
      max: 9
      step: 1
      start: 0
    - name: h
      label: Hundreds
      min: 0
      max: 9
      step: 1
      start: 0
    - name: te
      label: Tens
      min: 0
      max: 9
      step: 1
      start: 0
    - name: o
      label: Ones
      min: 0
      max: 9
      step: 1
      start: 0
    outputs:
    - name: val
      label: The number
      expr: 1000*th+100*h+10*te+o
    goals:
    - prompt: Make 3,056.
      want:
        val: 3056
      mistakes:
      - when:
          th: 3
          h: 5
          te: 6
          o: 0
        say: That's 3,560. There are 0 hundreds in 3,056.
    - prompt: Make 7,400.
      want:
        val: 7400
      mistakes:
      - when:
          th: 7
          h: 0
          te: 4
          o: 0
        say: That's 7,040. The 4 is in the hundreds place.
    - prompt: Make the smallest number from the digits 4, 1, 7 and 3.
      want:
        val: 1347
      mistakes:
      - when:
          val: 7431
        say: That's the biggest. Put the smallest digit first.
      - when:
          val: 1374
        say: Close! Put 4 before 7.
  lesson:
    - teach: 10 ones make a ten, 10 tens make a hundred, and 10 hundreds make a thousand (1,000). Each place is 10 times the place to its right.
      check:
        prompt: How many tens make one hundred?
        options:
        - '10'
        - '100'
        - '1'
        answer: '10'
        why: 10 tens = 100.
      ways:
      - style: visual
        teach: How ten of one place make one of the next place up.
        picture:
          kind: flow
          steps:
          - 10 ones make 1 ten
          - 10 tens make 1 hundred
          - 10 hundreds make 1 thousand
          alt: 10 ones make 1 ten, 10 tens make 1 hundred and 10 hundreds make 1 thousand.
      - style: real_world
        teach: Shops pack pencils in boxes of 10, and 10 boxes in a carton. A carton holds 100 pencils, and 10 cartons hold 1,000. Packing in tens makes big numbers easy to count.
    - teach: 'A 4-digit number has thousands, hundreds, tens and ones. 3,452 = 3 thousands + 4 hundreds + 5 tens + 2 ones = 3000 + 400 + 50 + 2. A zero keeps an empty place: 4,027 has no hundreds.'
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: Th
        - size: 1
          label: H
        - size: 1
          label: T
        - size: 1
          label: O
        rows:
        - size: 1
          label: 3,452
        - size: 1
          label: 4,027
        cells:
        - - '3'
          - '4'
          - '5'
          - '2'
        - - '4'
          - '0'
          - '2'
          - '7'
        alt: 'Place chart: 3,452 is 3 thousands, 4 hundreds, 5 tens, 2 ones; 4,027 is 4 thousands, 0 hundreds, 2 tens, 7 ones.'
      check:
        prompt: What is the value of 5 in 3,452?
        options:
        - '50'
        - '5'
        - '500'
        answer: '50'
        why: '5 is in the tens place: 5 tens = 50.'
      ways:
      - style: step_by_step
        teach: 'Break a number into places. Step 1: Take 6,183. Step 2: The 6 is in the thousands place: 6000. Step 3: The 1 is hundreds: 100; the 8 is tens: 80; the 3 is ones: 3. Step 4: So 6,183 = 6000 + 100 + 80 + 3.'
      - style: real_world
        teach: On a train ticket or a house number like 2,706, the zero tells you there are no tens. Without it, the number would read 276, which is a very different house.
    - teach: 'To compare 4-digit numbers, start from the left. 4,120 vs 4,098: thousands are equal (4), hundreds 1 vs 0, so 4,120 is bigger. The smallest 4-digit number is 1,000; the largest is 9,999.'
      check:
        prompt: 'Which is bigger: 6,301 or 6,130?'
        options:
        - 6,301
        - 6,130
        - they are equal
        answer: 6,301
        why: Thousands equal; hundreds 3 is more than 1.
      ways:
      - style: visual
        teach: Comparing two 4-digit numbers place by place, from the left.
        picture:
          kind: compare
          columns:
          - title: 6,315
            points:
            - 'Thousands: 6'
            - 'Hundreds: 3'
          - title: 6,293
            points:
            - 'Thousands: 6'
            - 'Hundreds: 2'
          alt: 'To compare 6,315 and 6,293, look at the thousands first: both are 6. Then the hundreds: 3 is more than 2, so 6,315 is bigger.'
      - style: real_world
        teach: 'When two cricket grounds report crowds of 8,410 and 8,395, people check the thousands first: both 8. The hundreds decide it: 4 beats 3, so the first ground had more people.'
  items:
  - prompt: What is the value of 4 in 3,452?
    answer: '400'
    check: 4*100
    difficulty: 1
    hints:
    - Which place is the 4 in?
    - Hundreds.
    solution: 4 hundreds = 400.
    mistakes:
      '4': c4_place
      '40': c4_place
  - prompt: 'Write the number: 2 thousands + 0 hundreds + 6 tens + 5 ones.'
    answer: '2065'
    check: 2000+60+5
    difficulty: 1
    hints:
    - Put a 0 for no hundreds.
    - 2, 0, 6, 5.
    solution: 2000 + 60 + 5 = 2,065.
    mistakes:
      '265': c4_place
  - prompt: How many hundreds make one thousand?
    answer: '10'
    check: 1000/100
    difficulty: 1
    hints:
    - 1000 ÷ 100.
    - Ten hundreds.
    solution: 10 hundreds = 1000.
    mistakes: {"100": "m4_hundreds", "1000": "m4_hundreds"}
  - prompt: Which number is the biggest?
    options:
    - 4,120
    - 4,102
    - 1,420
    - 2,410
    answer: 4,120
    difficulty: 1
    hints:
    - Compare thousands first.
    - Then hundreds, then tens.
    solution: 4,120 beats 4,102 in the tens place.
    mistakes: {"4,102": "m5_compare_digits"}
  - prompt: What is the largest 4-digit number?
    answer: '9999'
    check: '9999'
    difficulty: 2
    hints:
    - Use the biggest digit in every place.
    - 9 everywhere.
    solution: 9,999 is the largest 4-digit number.
    mistakes: {"1000": "m4_largest_4digit", "9000": "m4_largest_4digit"}
  - prompt: What number is 1 more than 2,999?
    answer: '3000'
    check: 2999+1
    difficulty: 2
    hints:
    - 9 ones + 1 makes a ten ...
    - It rolls over.
    solution: 2,999 + 1 = 3,000.
    mistakes: {"2100": "m4_one_more", "3999": "m4_one_more"}
  - prompt: 'Write the number: 5 thousands + 3 hundreds + 0 tens + 8 ones.'
    answer: '5308'
    check: 5000+300+8
    difficulty: 1
    hints:
    - 'Put each digit in its place: Th, H, T, O.'
    - A zero fills the empty tens place.
    solution: 'Step 1: 5000 + 300 + 0 + 8. Step 2: = 5,308.'
    mistakes:
      '538': c4m4_place
      '5380': c4m4_place
  - prompt: What is the value of 7 in 7,215?
    answer: '7000'
    check: 7*1000
    difficulty: 1
    hints:
    - Which place is the 7 in?
    - It is the leftmost of four digits.
    solution: 'Step 1: 7 is in the thousands place. Step 2: Value = 7 × 1000 = 7,000.'
    mistakes:
      '7': c4m4_place
      '700': c4m4_place
  - prompt: What number is 1 less than 4,000?
    answer: '3999'
    check: 4000-1
    difficulty: 2
    hints:
    - Going back from a round thousand changes many digits.
    - What comes just before 4,000 when counting?
    solution: 'Step 1: 4,000 − 1. Step 2: = 3,999.'
    mistakes:
      '3000': c4m4_borrow
      '4001': c4m4_borrow
      '3900': c4m4_borrow
  - prompt: What is 100 more than 2,950?
    answer: '3050'
    check: 2950+100
    difficulty: 2
    hints:
    - Add 1 to the hundreds digit.
    - 9 hundreds + 1 hundred makes 10 hundreds.
    solution: 'Step 1: 2,950 + 100. Step 2: = 3,050.'
    mistakes:
      '2960': c4m4_place
      '3950': c4m4_place
      '2050': c4m4_place
  - prompt: Which is the smallest?
    options:
    - 3,089
    - 3,098
    - 3,809
    answer: 3,089
    difficulty: 2
    hints:
    - All start with 3 thousands.
    - Compare hundreds, then tens.
    solution: 'Step 1: 3,809 has 8 hundreds, the others 0. Step 2: 3,089 vs 3,098: tens 8 < 9, so 3,089 is smallest.'
    mistakes:
      3,098: c4m4_compare
      3,809: c4m4_compare
  - prompt: What is the smallest 4-digit number?
    answer: '1000'
    check: '1000'
    difficulty: 1
    hints:
    - It needs 4 digits.
    - The first digit cannot be 0.
    solution: 'Step 1: The first digit must be at least 1. Step 2: Then the smallest is 1,000.'
    mistakes:
      '0001': c4m4_place
      '999': c4m4_place
      '1111': c4m4_place
  - prompt: Using the digits 7, 2, 9, 4 once each, what is the biggest 4-digit number?
    answer: '9742'
    check: '9742'
    difficulty: 3
    hints:
    - Put the biggest digit in the biggest place.
    - Then the next biggest, and so on.
    solution: 'Step 1: Order the digits from biggest: 9, 7, 4, 2. Step 2: The number is 9,742.'
    mistakes:
      '2479': c4m4_compare
      '7294': c4m4_compare
      '9724': c4m4_compare
  - prompt: How many hundreds are there in 4,000?
    answer: '40'
    check: 4000//100
    difficulty: 3
    hints:
    - 1,000 = 10 hundreds.
    - There are 4 thousands.
    solution: 'Step 1: Each thousand is 10 hundreds. Step 2: 4 × 10 = 40 hundreds.'
    mistakes:
      '4': c4m4_place
      '400': c4m4_place
  - prompt: A stadium has 6,045 seats. How is this read?
    options:
    - six thousand forty-five
    - six thousand four hundred five
    - six hundred forty-five
    answer: six thousand forty-five
    difficulty: 2
    hints:
    - The hundreds digit is 0.
    - Read thousands, then the tens and ones.
    solution: 'Step 1: 6 thousands, 0 hundreds, 4 tens, 5 ones. Step 2: Read: six thousand forty-five.'
    mistakes:
      six thousand four hundred five: c4m4_place
      six hundred forty-five: c4m4_place
  - prompt: 'Case: Two schools collected old newspapers for recycling. School A collected 3,508 kg and School B collected 3,580 kg. Which school collected more?'
    options:
    - School B
    - School A
    - They collected the same
    answer: School B
    hints:
    - The thousands are the same. Look at the next place.
    - Then compare the tens.
    solution: Both have 3 thousands and 5 hundreds. In the tens, 8 is more than 0, so School B's 3,580 kg is more.
    mistakes:
      School A: c4m4_compare
      They collected the same: c4m4_compare
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing a cheque-style note for ''four thousand and sixty'' rupees. Which number should you write?'
    options:
    - 4,060
    - 4,600
    - 4,006
    answer: 4,060
    hints:
    - How many hundreds are there in 'four thousand and sixty'?
    - Sixty means 6 tens. Which place holds it?
    solution: 'Four thousand and sixty has 4 thousands, 0 hundreds, 6 tens and 0 ones: 4,060.'
    mistakes:
      4,600: c4m4_place
      4,006: c4m4_place
    exam: competency
    difficulty: 2
- code: cbse4m.thou.addsub
  title: Adding and taking away bigger numbers
  after:
  - cbse4m.thou.place
  notes: |
    Add 4-digit numbers place by place, carrying when a place passes 9 (2,345 + 1,278 = 3,623). Subtract with
    borrowing (5,000 − 1,250 = 3,750). Estimate by rounding to the nearest hundred or thousand to check.
  explanations:
    text: Line up the places and add from the ones. If a column makes 10 or more, carry 1 to the next place. To subtract, borrow from the next place when the top digit is too small.
    visual: 'Write 2,345 above 1,278. Ones: 5 + 8 = 13 → 3 carry 1. Tens: 4 + 7 + 1 = 12 → 2 carry 1. Hundreds: 3 + 2 + 1 = 6. Thousands: 2 + 1 = 3. Answer 3,623.'
    step_by_step: 'Step 1: Line up the places. Step 2: Start from the ones. Step 3: Carry or borrow. Step 4: Check by estimating.'
    real_world: Adding up the money collected at a school fair, or finding how many tickets are left.
  picture:
    kind: flow
    steps:
    - 'Ones: 5 + 8 = 13 → 3, carry 1'
    - 'Tens: 4 + 7 + 1 = 12 → 2, carry 1'
    - 'Hundreds: 3 + 2 + 1 = 6'
    - 'Thousands: 2 + 1 = 3 → 3,623'
    alt: Adding 2,345 and 1,278 place by place with carrying gives 3,623.
  activity:
    type: sort
    prompt: Add or take away. Which answer does each one make?
    bins:
    - '635'
    - '1635'
    - '2635'
    items:
    - label: 3000 − 2365
      bin: '635'
      clue: '0 − 5: borrow, all the way from the thousands.'
      why: '635. Check: 635 + 2365 = 3000.'
    - label: 500 + 135
      bin: '635'
      clue: Hundreds, tens, ones.
      why: '635.'
    - label: 1000 − 365
      bin: '635'
      clue: Borrow across the zeros.
      why: '635.'
    - label: 4000 − 2365
      bin: '1635'
      clue: Borrowing turns the zeros into 9s.
      why: 1635. Check by adding.
    - label: 1000 + 635
      bin: '1635'
      clue: One thousand more.
      why: '1635.'
    - label: 1700 − 65
      bin: '1635'
      clue: Take 65 away from 1700.
      why: '1635.'
    - label: 5000 − 2365
      bin: '2635'
      clue: 'Borrow across the zeros: 4 thousands, 9 hundreds, 9 tens, 10 ones.'
      why: '2635.'
    - label: 2000 + 635
      bin: '2635'
      clue: Two thousands and 635.
      why: '2635.'
    - label: 1365 + 1270
      bin: '2635'
      clue: 5 + 0, 6 + 7 (carry), 3 + 2 + 1, 1 + 1.
      why: '2635.'
  lesson:
    - teach: To add big numbers, line up the places and start from the ones. If a place adds to 10 or more, write the ones digit and carry 1 to the next place.
      check:
        prompt: In 1,346 + 1,227, the ones are 6 + 7 = 13. What do you write in the ones place?
        options:
        - '3'
        - '13'
        - '1'
        answer: '3'
        why: Write 3 and carry 1 ten to the tens place.
      ways:
      - style: step_by_step
        teach: 'Add 1,467 + 2,385. Step 1: Ones: 7 + 5 = 12, write 2, carry 1. Step 2: Tens: 6 + 8 + 1 = 15, write 5, carry 1. Step 3: Hundreds: 4 + 3 + 1 = 8. Step 4: Thousands: 1 + 2 = 3. The answer is 3,852.'
      - style: visual
        teach: Lining up the places before adding, so the carried 1 goes to the right column.
        picture:
          kind: compare
          columns:
          - title: Place
            points:
            - Thousands
            - Hundreds
            - Tens
            - Ones
          - title: 1,467 + 2,385
            points:
            - 1 + 2 = 3
            - 4 + 3 + 1 = 8
            - '6 + 8 + 1 = 15: write 5, carry 1'
            - '7 + 5 = 12: write 2, carry 1'
          alt: 'Adding 1,467 and 2,385 place by place: ones 7 + 5 = 12, write 2 and carry 1; tens 6 + 8 + 1 = 15, write 5 and carry 1; hundreds 4 + 3 + 1 = 8; thousands 1 + 2 = 3. The answer is 3,852.'
    - teach: 'To take away, also start from the ones. If the top digit is too small, borrow 1 from the next place: that adds 10 to the place you are working on. 5,000 − 1,250 = 3,750.'
      picture:
        kind: flow
        steps:
        - Line up Th H T O
        - Start at the ones
        - Too small? Borrow 1 from the left (+10)
        - Move left place by place
        alt: Steps for subtracting 4-digit numbers with borrowing.
      check:
        prompt: What is 3,000 − 1?
        options:
        - 2,999
        - 2,000
        - 3,001
        answer: 2,999
        why: Borrowing passes through every zero, leaving 9s.
      ways:
      - style: step_by_step
        teach: 'Take away 4,312 − 1,546. Step 1: Ones: 2 is less than 6, so borrow: 12 − 6 = 6. Step 2: Tens: 0 is less than 4, borrow: 10 − 4 = 6. Step 3: Hundreds: 2 is less than 5, borrow: 12 − 5 = 7. Step 4: Thousands: 3 − 1 = 2. The answer is 2,766.'
      - style: real_world
        teach: A shopkeeper who gets a ₹2,000 note for a ₹1,385 bill works out the change by taking away. Checking by adding back, 1,385 + 615 = 2,000, makes sure the change is right.
    - teach: 'Estimate to check: round to the nearest hundred or thousand. 2,980 + 1,020 is about 3,000 + 1,000 = 4,000. If your answer is far from the estimate, check again.'
      check:
        prompt: About how much is 4,910 + 2,080?
        options:
        - about 7,000
        - about 6,000
        - about 9,000
        answer: about 7,000
        why: Round to 5,000 + 2,000 = 7,000.
      ways:
      - style: visual
        teach: Estimating a sum by rounding each number to the nearest thousand.
        picture:
          kind: bars
          bars:
          - label: 3,940 rounds to
            value: 4000
          - label: 2,070 rounds to
            value: 2000
          - label: Estimate of the sum
            value: 6000
          alt: 3,940 rounds to 4,000 and 2,070 rounds to 2,000, so their sum is about 6,000.
      - style: real_world
        teach: Before going to a shop, people often round prices to get a quick total. If the bill comes out very different from that guess, it is worth checking for a mistake.
  items:
  - prompt: What is 2,345 + 1,278?
    answer: '3623'
    check: 2345+1278
    difficulty: 1
    hints:
    - Start with the ones.
    - Carry when needed.
    solution: 2,345 + 1,278 = 3,623.
    mistakes:
      '3513': c4_place
  - prompt: What is 5,000 − 1,250?
    answer: '3750'
    check: 5000-1250
    difficulty: 2
    hints:
    - Borrow from the thousands.
    - 5000 − 1000 − 250.
    solution: 5,000 − 1,250 = 3,750.
    mistakes: {"4250": "m5_subtract_borrow", "6250": "m5_subtract_borrow"}
  - prompt: A school fair sold 1,450 tickets on day 1 and 1,320 on day 2. How many in all?
    answer: '2770'
    check: 1450+1320
    difficulty: 1
    hints:
    - Add the two days.
    - 1450 + 1320.
    solution: 1,450 + 1,320 = 2,770 tickets.
    mistakes: {"2670": "m5_add_carry", "130": "m5_add_carry"}
  - prompt: A village has 3,200 people. 1,450 are children. How many are not children?
    answer: '1750'
    check: 3200-1450
    difficulty: 2
    hints:
    - Take away.
    - 3200 − 1450.
    solution: 3,200 − 1,450 = 1,750.
    mistakes: {"2250": "m5_subtract_borrow", "4650": "m5_subtract_borrow"}
  - prompt: What is 999 + 1?
    answer: '1000'
    check: 999+1
    difficulty: 1
    hints:
    - One more than 999.
    - Every place rolls over.
    solution: 999 + 1 = 1,000.
    mistakes: {"9910": "m4_one_more", "100": "m4_one_more"}
  - prompt: Which is the best estimate for 2,980 + 1,020?
    options:
    - about 4,000
    - about 3,000
    - about 5,000
    - about 40,000
    answer: about 4,000
    difficulty: 1
    hints:
    - Round each to the nearest thousand.
    - 3,000 + 1,000.
    solution: About 3,000 + 1,000 = 4,000.
    mistakes: {"about 3,000": "m5_estimate"}
  - prompt: What is 3,456 + 2,378?
    answer: '5834'
    check: 3456+2378
    difficulty: 2
    hints:
    - 'Start at the ones: 6 + 8.'
    - Remember each carry.
    solution: 'Step 1: Ones 6+8 = 14 (write 4, carry 1); tens 5+7+1 = 13 (write 3, carry 1). Step 2: Hundreds 4+3+1 = 8; thousands 3+2 = 5. Answer 5,834.'
    mistakes:
      '5724': c4m4_carry
      '5734': c4m4_carry
      '5824': c4m4_carry
  - prompt: What is 6,000 − 2,345?
    answer: '3655'
    check: 6000-2345
    difficulty: 3
    hints:
    - Borrowing must go through all the zeros.
    - 6,000 can be seen as 5 thousands, 9 hundreds, 9 tens, 10 ones.
    solution: 'Step 1: 6,000 = 5 Th 9 H 9 T 10 O. Step 2: 10−5=5, 9−4=5, 9−3=6, 5−2=3: 3,655.'
    mistakes:
      '4345': c4m4_borrow
      '3665': c4m4_borrow
      '4665': c4m4_borrow
  - prompt: A library had 2,450 books. It bought 875 more. How many books now?
    answer: '3325'
    check: 2450+875
    difficulty: 2
    hints:
    - Bought more means add.
    - 'Line up the places carefully: 875 has no thousands.'
    solution: 'Step 1: 2,450 + 875. Step 2: = 3,325.'
    mistakes:
      '3225': c4m4_carry
      '2325': c4m4_carry
      '11200': c4m4_place
  - prompt: A train has 1,200 seats. 965 are filled. How many are empty?
    answer: '235'
    check: 1200-965
    difficulty: 2
    hints:
    - Empty = total − filled.
    - Borrow across the zeros.
    solution: 'Step 1: 1,200 − 965. Step 2: = 235.'
    mistakes:
      '335': c4m4_borrow
      '245': c4m4_borrow
      '2165': c4m4_borrow
  - prompt: What is 4,999 + 1?
    answer: '5000'
    check: 4999+1
    difficulty: 1
    hints:
    - The ones become 10.
    - Every 9 carries over.
    solution: 'Step 1: Each 9 + carry makes 10. Step 2: 4,999 + 1 = 5,000.'
    mistakes:
