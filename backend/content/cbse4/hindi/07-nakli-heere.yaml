subject: cbse4-hin
chapter: 7
title: नकली हीरे
tips:
  h4_chamak: "कहानी में नकली हीरे भी चमक रहे थे। सिर्फ़ चमक देखकर क्या पता चलता है कि चीज़ असली है?"
  h4_heera: "अँगूठी में जड़ी, रोशनी में चमचमाती, बहुत महँगी चीज़ सोचो। वह खाई या खेली नहीं जाती।"
  h4_imaandar: "'ईमान' का अर्थ है सच्चाई। '-दार' जोड़ो: जिसके पास सच्चाई हो वह कैसा करेगा?"
  h4_keemat: "'कीमत' मतलब दाम। 'कीमती' चीज़ के लिए दुकान में कितने पैसे देने पड़ेंगे?"
  c4h7_parakh: 'सोचो: केवल चमक देखकर फ़ैसला करना ठीक है, या ध्यान से परखना चाहिए?'
  c4h7_imaan: 'सोचो: सच्चा और ईमानदार व्यक्ति इस हालत में क्या करेगा?'
  c4h7_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v7.heere
  title: नकली हीरे
  notes: |
    'नकली हीरे' नाम की कहानी, जिसमें असली और नकली की पहचान और समझदारी से सच का पता लगाने की बात है। ठीक पात्र और
    घटनाएँ यहाँ नहीं दी गई हैं (विश्वसनीय सार नहीं मिला)। अभ्यास: असली-नकली, ईमानदारी, लालच न करने की सीख और शब्द-अर्थ।
  explanations:
    text: जो चीज़ बाहर से चमकदार दिखे, ज़रूरी नहीं कि वह असली हो। समझदार व्यक्ति ध्यान से जाँचकर सच पता करता है। ईमानदारी और समझदारी लालच से बड़ी हैं।
    visual: 'चित्र बनाइए: दो चमकते पत्थर, एक के नीचे ''असली'', दूसरे के नीचे ''नकली'', और बीच में आवर्धक लेंस से देखता एक बच्चा।'
    step_by_step: 1. पात्र कौन हैं? 2. नकली हीरे की बात कैसे उठी? 3. सच कैसे पता चला? 4. सीख क्या है?
    real_world: बाज़ार में सामान लेते समय असली-नकली की पहचान के लिए मोहर और बिल देखते हैं।
  picture:
    kind: compare
    columns:
    - title: असली
      points:
      - सच्चा
      - भरोसेमंद
    - title: नकली
      points:
      - झूठा
      - धोखा
    alt: असली चीज़ सच्ची और भरोसेमंद होती है; नकली चीज़ झूठी और धोखा होती है।
  activity:
    type: sort
    prompt: कहानी की सीख के अनुसार, कौन-सा व्यवहार ठीक है?
    bins:
    - ठीक
    - ठीक नहीं
    items:
    - label: ध्यान से परखकर असली-नकली पहचानना
      bin: ठीक
      clue: बिना परखे चमक पर भरोसा?
      why: समझदारी से सच का पता लगता है।
    - label: ईमानदारी से सच बताना
      bin: ठीक
      clue: नकली को असली कहना ठीक?
      why: ईमानदारी।
    - label: लालच में बिना सोचे ख़रीद लेना
      bin: ठीक नहीं
      clue: लालच से क्या होता है?
      why: लालच धोखा दिलाता है।
    - label: नकली को असली बताकर बेचना
      bin: ठीक नहीं
      clue: यह ईमानदारी है?
      why: बेईमानी।
  lesson:
    - teach: '''नकली हीरे'' कहानी असली और नकली की पहचान के बारे में है। हीरा एक बहुत कीमती, चमकदार पत्थर है। पर काँच भी चमकता है। केवल चमक देखकर असली-नकली नहीं पहचाना जा सकता।'
      check:
        prompt: क्या हर चमकने वाला पत्थर असली हीरा होता है?
        options:
        - नहीं, काँच भी चमकता है
        - हाँ, हमेशा
        - चमकने वाले सब पत्थर सोना हैं
        answer: नहीं, काँच भी चमकता है
        why: चमक धोखा दे सकती है।
    - teach: 'समझदार व्यक्ति परखता है: ध्यान से देखता है, जानकार से पूछता है, और जल्दी में फ़ैसला नहीं करता। लालची व्यक्ति जल्दी अमीर बनने के चक्कर में धोखा खा सकता है।'
      picture:
        kind: compare
        columns:
        - title: समझदार
          points:
          - ध्यान से परखता है
          - जानकार से पूछता है
          - धोखा नहीं खाता
        - title: लालची
          points:
          - जल्दी में फ़ैसला
          - बस चमक देखता है
          - धोखा खा जाता है
        alt: समझदार और लालची व्यक्ति के व्यवहार की तुलना।
      check:
        prompt: धोखे से बचने के लिए क्या करना चाहिए?
        options:
        - ध्यान से परखना
        - जल्दी में ख़रीद लेना
        - केवल चमक देखना
        answer: ध्यान से परखना
        why: परखने से सच पता चलता है।
    - teach: 'कहानी की सीख: लालच मत करो, ईमानदार रहो, और हर बात को सोच-समझकर परखो। कहावत है: ''हर चमकती चीज़ सोना नहीं होती।'''
      check:
        prompt: ईमानदार व्यक्ति क्या करता है?
        options:
        - सच बोलता है और धोखा नहीं देता
        - नकली को असली बताकर बेचता है
        - झूठ बोलता है
        answer: सच बोलता है और धोखा नहीं देता
        why: ईमानदारी = सच्चाई।
  items:
  - prompt: '''नकली'' का विलोम शब्द है:'
    options:
    - असली
    - झूठा
    - पुराना
    - चमकदार
    answer: असली
    difficulty: 1
    hints:
    - सच्चा।
    - उलटा।
    solution: नकली का विलोम असली है।
    mistakes:
      झूठा: hin4_word
  - prompt: हीरा क्या है?
    options:
    - एक बहुत कीमती चमकदार पत्थर
    - एक फल
    - एक पक्षी
    - एक खेल
    answer: एक बहुत कीमती चमकदार पत्थर
    difficulty: 1
    hints:
    - गहनों में।
    - चमकता है।
    solution: हीरा कीमती पत्थर है।
    mistakes: {"एक फल": "h4_heera", "एक पक्षी": "h4_heera", "एक खेल": "h4_heera"}
  - prompt: '''हर चमकती चीज़ सोना नहीं होती'' का अर्थ है:'
    options:
    - जो सुंदर दिखे, ज़रूरी नहीं वह असली हो
    - सोना चमकता नहीं
    - सब कुछ सोना है
    - चमक बुरी है
    answer: जो सुंदर दिखे, ज़रूरी नहीं वह असली हो
    difficulty: 2
    hints:
    - बाहर से दिखना।
    - अंदर का सच।
    solution: दिखावे से धोखा न खाएँ।
    mistakes: {"सोना चमकता नहीं": "h4_chamak", "सब कुछ सोना है": "h4_chamak", "चमक बुरी है": "h4_chamak"}
  - prompt: इस तरह की कहानी से क्या सीख मिलती है?
    options:
    - लालच मत करो, सोच-समझकर परखो
    - जो दिखे, तुरंत ख़रीद लो
    - सबसे झूठ बोलो
    - कभी कुछ मत जाँचो
    answer: लालच मत करो, सोच-समझकर परखो
    difficulty: 2
    hints:
    - समझदारी।
    - ईमानदारी।
    solution: लालच से बचें और सोच-समझकर परखें।
    mistakes:
      जो दिखे, तुरंत ख़रीद लो: hin4_lesson
  - prompt: '''ईमानदार'' व्यक्ति कैसा होता है?'
    options:
    - जो सच बोले और धोखा न दे
    - जो झूठ बोले
    - जो चोरी करे
    - जो आलसी हो
    answer: जो सच बोले और धोखा न दे
    difficulty: 1
    hints:
    - सच्चा।
    - भरोसा।
    solution: ईमानदार व्यक्ति सच बोलता है।
    mistakes: {"जो झूठ बोले": "h4_imaandar", "जो चोरी करे": "h4_imaandar", "जो आलसी हो": "h4_imaandar"}
  - prompt: '''कीमती'' का अर्थ है:'
    options:
    - जिसका मूल्य बहुत अधिक हो
    - सस्ता
    - टूटा हुआ
    - हल्का
    answer: जिसका मूल्य बहुत अधिक हो
    difficulty: 2
    hints:
    - महँगा।
    - मूल्यवान।
    solution: कीमती यानी बहुत मूल्य वाला।
    mistakes: {"सस्ता": "h4_keemat", "टूटा हुआ": "h4_keemat", "हल्का": "h4_keemat"}
  - prompt: '''लालच'' का अर्थ है:'
    options:
    - ज़रूरत से ज़्यादा पाने की इच्छा
    - दूसरों की मदद
    - मेहनत करना
    answer: ज़रूरत से ज़्यादा पाने की इच्छा
    difficulty: 2
    hints:
    - लालची व्यक्ति कभी संतुष्ट नहीं होता।
    - उसे और-और चाहिए।
    solution: 'चरण 1: लालची व्यक्ति और चाहता है। चरण 2: लालच = ज़रूरत से ज़्यादा पाने की इच्छा।'
    mistakes:
      दूसरों की मदद: c4h7_shabd
      मेहनत करना: c4h7_shabd
  - prompt: दुकानदार ने गलती से तुम्हें ज़्यादा पैसे लौटा दिए। ईमानदार बच्चा क्या करेगा?
    options:
    - ज़्यादा पैसे वापस कर देगा
    - चुपचाप रख लेगा
    - और माँगेगा
    answer: ज़्यादा पैसे वापस कर देगा
    difficulty: 2
    hints:
    - वे पैसे किसके हैं?
    - ईमानदारी का मतलब याद करो।
    solution: 'चरण 1: ज़्यादा पैसे दुकानदार के हैं। चरण 2: ईमानदार बच्चा उन्हें लौटा देगा।'
    mistakes:
      चुपचाप रख लेगा: c4h7_imaan
      और माँगेगा: c4h7_imaan
  - prompt: '''असली'' का समान अर्थ वाला शब्द कौन-सा है?'
    options:
    - सच्चा
    - झूठा
    - टूटा
    answer: सच्चा
    difficulty: 1
    hints:
    - असली = जो नकली न हो।
    - झूठा इसका उलटा है।
    solution: 'चरण 1: असली = सच का। चरण 2: इसका समान शब्द सच्चा है।'
    mistakes:
      झूठा: c4h7_shabd
      टूटा: c4h7_shabd
  - prompt: कोई अनजान व्यक्ति बहुत सस्ते में 'हीरा' बेचे, तो क्या समझना चाहिए?
    options:
    - यह धोखा हो सकता है
    - यह ज़रूर असली है
    - तुरंत ख़रीद लेना चाहिए
    answer: यह धोखा हो सकता है
    difficulty: 3
    hints:
    - हीरा बहुत कीमती होता है।
    - कीमती चीज़ बहुत सस्ते में क्यों मिलेगी?
    solution: 'चरण 1: असली हीरा बहुत महँगा होता है। चरण 2: बहुत सस्ता हीरा नकली या धोखा हो सकता है।'
    mistakes:
      यह ज़रूर असली है: c4h7_parakh
      तुरंत ख़रीद लेना चाहिए: c4h7_parakh
  - prompt: '''चमकदार'' शब्द किसका गुण बताता है?'
    options:
    - जो चमकता हो
    - जो भारी हो
    - जो मीठा हो
    answer: जो चमकता हो
    difficulty: 1
    hints:
    - शब्द में 'चमक' छिपी है।
    - '''दार'' का अर्थ है वाला।'
    solution: 'चरण 1: चमक + दार = चमक वाला। चरण 2: जो चमकता हो।'
    mistakes:
      जो भारी हो: c4h7_shabd
      जो मीठा हो: c4h7_shabd
  - prompt: '''धोखा'' का अर्थ है:'
    options:
    - झूठ से किसी को ठगना
    - मदद करना
    - सच बताना
    answer: झूठ से किसी को ठगना
    difficulty: 2
    hints:
    - नकली को असली बताकर बेचना।
    - इससे सामने वाले का नुकसान होता है।
    solution: 'चरण 1: नकली को असली बताना झूठ है। चरण 2: धोखा = झूठ से ठगना।'
    mistakes:
      मदद करना: c4h7_shabd
      सच बताना: c4h7_shabd
  - prompt: असली हीरा पहचानने का सबसे सही तरीका क्या है?
    options:
    - किसी जानकार जौहरी से जाँच करवाना
    - बस चमक देखना
    - उसे दाँत से काटना
    answer: किसी जानकार जौहरी से जाँच करवाना
    difficulty: 2
    hints:
    - हीरे की पहचान कौन जानता है?
    - गहनों का काम करने वाला।
    solution: 'चरण 1: चमक से पता नहीं चलता। चरण 2: जानकार जौहरी ही ठीक जाँच कर सकता है।'
    mistakes:
      बस चमक देखना: c4h7_parakh
      उसे दाँत से काटना: c4h7_parakh
  - prompt: '''हर चमकती चीज़ सोना नहीं होती'' कहावत कब बोलते हैं?'
    options:
    - जब कोई चीज़ बाहर से अच्छी दिखे पर अंदर से न हो
    - जब सोना सस्ता हो
    - जब सूरज चमके
    answer: जब कोई चीज़ बाहर से अच्छी दिखे पर अंदर से न हो
    difficulty: 3
    hints:
    - कहावत का सीधा अर्थ नहीं, भाव समझो।
    - दिखावा और सच्चाई में फ़र्क़।
    solution: 'चरण 1: चमक बाहर का रूप है। चरण 2: कहावत तब बोलते हैं जब दिखावा सच्चाई से अलग हो।'
    mistakes:
      जब सोना सस्ता हो: c4h7_parakh
      जब सूरज चमके: c4h7_parakh
  - prompt: '''ईमानदार'' का विलोम शब्द है:'
    options:
    - बेईमान
    - समझदार
    - दुकानदार
    answer: बेईमान
    difficulty: 1
    hints:
    - विलोम = उलटा।
    - आगे 'बे' लगाकर देखो।
    solution: 'चरण 1: ईमानदार = सच्चा। चरण 2: उलटा बेईमान है।'
    mistakes:
      समझदार: c4h7_shabd
      दुकानदार: c4h7_shabd
