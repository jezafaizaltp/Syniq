subject: cbse4-hin
chapter: 7
title: नकली हीरे
tips:
  h4_chamak: "कहानी में नकली हीरे भी चमक रहे थे। सिर्फ़ चमक देखकर क्या पता चलता है कि चीज़ असली है?"
  h4_heera: "अँगूठी में जड़ी, रोशनी में चमचमाती, बहुत महँगी चीज़ सोचो। वह खाई या खेली नहीं जाती।"
  h4_imaandar: "'ईमान' का अर्थ है सच्चाई। '-दार' जोड़ो: जिसके पास सच्चाई हो वह कैसा करेगा?"
  h4_keemat: "'कीमत' मतलब दाम। 'कीमती' चीज़ के लिए दुकान में कितने पैसे देने पड़ेंगे?"

concepts:
- code: cbse4h.v7.heere
  title: नकली हीरे
  notes: |
    'नकली हीरे' नाम की कहानी, जिसमें असली और नकली की पहचान और समझदारी से सच का पता लगाने की बात है। ठीक पात्र और
    घटनाएँ यहाँ नहीं दी गई हैं (विश्वसनीय सार नहीं मिला)। अभ्यास: असली-नकली, ईमानदारी, लालच न करने की सीख और शब्द-अर्थ।
  explanations:
    text: जो चीज़ बाहर से चमकदार दिखे, ज़रूरी नहीं कि वह असली हो। समझदार व्यक्ति ध्यान से जाँचकर सच पता करता है। ईमानदारी और समझदारी लालच से बड़ी हैं।
    visual: 'चित्र बनाइए: दो चमकते पत्थर, एक के नीचे ''असली'', दूसरे के नीचे ''नकली'', और बीच में आवर्धक लेंस से देखता एक बच्चा।'
    step_by_step: 1. पात्र कौन हैं? 2. नकली हीरे की बात कैसे उठी? 3. सच कैसे पता चला? 4. सीख क्या है?
    real_world: बाज़ार में सामान लेते समय असली-नकली की पहचान के लिए मोहर और बिल देखते हैं।
  picture:
    kind: compare
    columns:
    - title: असली
      points:
      - सच्चा
      - भरोसेमंद
    - title: नकली
      points:
      - झूठा
      - धोखा
    alt: असली चीज़ सच्ची और भरोसेमंद होती है; नकली चीज़ झूठी और धोखा होती है।
  items:
  - prompt: '''नकली'' का विलोम शब्द है:'
    options:
    - असली
    - झूठा
    - पुराना
    - चमकदार
    answer: असली
    difficulty: 1
    hints:
    - सच्चा।
    - उलटा।
    solution: नकली का विलोम असली है।
    mistakes:
      झूठा: hin4_word
  - prompt: हीरा क्या है?
    options:
    - एक बहुत कीमती चमकदार पत्थर
    - एक फल
    - एक पक्षी
    - एक खेल
    answer: एक बहुत कीमती चमकदार पत्थर
    difficulty: 1
    hints:
    - गहनों में।
    - चमकता है।
    solution: हीरा कीमती पत्थर है।
    mistakes: {"एक फल": "h4_heera", "एक पक्षी": "h4_heera", "एक खेल": "h4_heera"}
  - prompt: '''हर चमकती चीज़ सोना नहीं होती'' का अर्थ है:'
    options:
    - जो सुंदर दिखे, ज़रूरी नहीं वह असली हो
    - सोना चमकता नहीं
    - सब कुछ सोना है
    - चमक बुरी है
    answer: जो सुंदर दिखे, ज़रूरी नहीं वह असली हो
    difficulty: 2
    hints:
    - बाहर से दिखना।
    - अंदर का सच।
    solution: दिखावे से धोखा न खाएँ।
    mistakes: {"सोना चमकता नहीं": "h4_chamak", "सब कुछ सोना है": "h4_chamak", "चमक बुरी है": "h4_chamak"}
  - prompt: इस तरह की कहानी से क्या सीख मिलती है?
    options:
    - लालच मत करो, सोच-समझकर परखो
    - जो दिखे, तुरंत ख़रीद लो
    - सबसे झूठ बोलो
    - कभी कुछ मत जाँचो
    answer: लालच मत करो, सोच-समझकर परखो
    difficulty: 2
    hints:
    - समझदारी।
    - ईमानदारी।
    solution: लालच से बचें और सोच-समझकर परखें।
    mistakes:
      जो दिखे, तुरंत ख़रीद लो: hin4_lesson
  - prompt: '''ईमानदार'' व्यक्ति कैसा होता है?'
    options:
    - जो सच बोले और धोखा न दे
    - जो झूठ बोले
    - जो चोरी करे
    - जो आलसी हो
    answer: जो सच बोले और धोखा न दे
    difficulty: 1
    hints:
    - सच्चा।
    - भरोसा।
    solution: ईमानदार व्यक्ति सच बोलता है।
    mistakes: {"जो झूठ बोले": "h4_imaandar", "जो चोरी करे": "h4_imaandar", "जो आलसी हो": "h4_imaandar"}
  - prompt: '''कीमती'' का अर्थ है:'
    options:
    - जिसका मूल्य बहुत अधिक हो
    - सस्ता
    - टूटा हुआ
    - हल्का
    answer: जिसका मूल्य बहुत अधिक हो
    difficulty: 2
    hints:
    - महँगा।
    - मूल्यवान।
    solution: कीमती यानी बहुत मूल्य वाला।
    mistakes: {"सस्ता": "h4_keemat", "टूटा हुआ": "h4_keemat", "हल्का": "h4_keemat"}
