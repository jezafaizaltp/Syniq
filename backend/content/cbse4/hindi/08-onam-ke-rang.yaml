      - style: real_world
        teach: जब खेत में धान पककर सुनहरा हो जाता है, तो किसान के महीनों की मेहनत पूरी होती है। इसी ख़ुशी में परिवार नए कपड़े पहनते हैं और मिलकर त्योहार मनाते हैं।
    - teach: घर के आगे फूलों से रंगोली बनती है, जिसे पूक्कलम कहते हैं। केले के पत्ते पर बहुत से व्यंजनों का भोज परोसा जाता है, जिसे ओणसद्या कहते हैं।
      picture:
