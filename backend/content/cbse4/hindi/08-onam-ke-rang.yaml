subject: cbse4-hin
chapter: 8
title: ओणम के रंग
concepts:
- code: cbse4h.v8.onam
  title: ओणम के रंग
  notes: |
    केरल के त्योहार ओणम पर पाठ। ओणम मलयालम महीने चिंगम (अगस्त-सितंबर) में मनाया जाता है; यह फ़सल का त्योहार है।
    मान्यता है कि दयालु राजा महाबली इस समय अपनी प्रजा से मिलने आते हैं। घरों के आगे फूलों की रंगोली (पूक्कलम) बनती है,
    केले के पत्ते पर कई व्यंजनों वाला भोज (ओणसद्या), नाव दौड़ (वल्लम कली), झूले, पुलिकली (बाघ नृत्य)। मुख्य दिन थिरुवोणम।
  explanations:
    text: ओणम केरल का सबसे बड़ा त्योहार है, जो फ़सल के समय चिंगम महीने में आता है। लोग मानते हैं कि राजा महाबली अपनी प्रजा से मिलने आते हैं। घरों के आगे फूलों का पूक्कलम बनता है, केले के पत्ते पर ओणसद्या परोसी जाती है और नाव दौड़ होती है।
    visual: 'चित्र बनाइए: घर के आँगन में गोल रंग-बिरंगा फूलों का पूक्कलम, केले के पत्ते पर कई व्यंजन, और नदी में लंबी साँप-नाव।'
    step_by_step: 1. त्योहार कहाँ का है? केरल। 2. कब? चिंगम महीने में। 3. किसकी याद में? राजा महाबली। 4. कैसे मनाते हैं? पूक्कलम, सद्या, नाव दौड़।
    real_world: ओणम पर केरल के सब लोग, हर धर्म के, मिलकर पूक्कलम बनाते और सद्या खाते हैं।
  picture:
    kind: compare
    columns:
    - title: ओणम की परंपरा
      points:
      - पूक्कलम
      - ओणसद्या
      - वल्लम कली
    - title: क्या है
      points:
      - फूलों की रंगोली
      - केले के पत्ते पर भोज
      - नाव दौड़
    alt: ओणम में पूक्कलम फूलों की रंगोली है, ओणसद्या केले के पत्ते पर भोज है, और वल्लम कली नाव दौड़ है।
  items:
  - prompt: ओणम किस राज्य का त्योहार है?
    options:
    - केरल
    - पंजाब
    - असम
    - गुजरात
    answer: केरल
    difficulty: 1
    hints:
    - हमारा राज्य।
    - महाबली।
    solution: ओणम केरल का त्योहार है।
    mistakes:
      पंजाब: hin4_read_again
  - prompt: ओणम पर किस राजा के आने की मान्यता है?
    options:
    - महाबली
    - अकबर
    - अशोक
    - विक्रमादित्य
    answer: महाबली
    difficulty: 1
    hints:
    - दयालु राजा।
    - प्रजा से मिलने।
    solution: माना जाता है कि राजा महाबली आते हैं।
  - prompt: फूलों से बनी रंगोली को क्या कहते हैं?
    options:
    - पूक्कलम
    - कोलम (चावल के आटे से)
    - मेहंदी
    - पतंग
    answer: पूक्कलम
    difficulty: 2
    hints:
    - पू = फूल।
    - आँगन में।
    solution: फूलों की रंगोली पूक्कलम है।
  - prompt: ओणसद्या किस पर परोसी जाती है?
    options:
    - केले के पत्ते पर
    - प्लास्टिक की थाली पर
    - अख़बार पर
    - काँच के गिलास में
    answer: केले के पत्ते पर
    difficulty: 1
    hints:
    - हरा, बड़ा पत्ता।
    - परंपरा।
    solution: ओणसद्या केले के पत्ते पर परोसी जाती है।
  - prompt: वल्लम कली क्या है?
    options:
    - नाव दौड़
    - पतंगबाज़ी
    - कुश्ती
    - शतरंज
    answer: नाव दौड़
    difficulty: 2
    hints:
    - नदी में।
    - लंबी नावें।
    solution: वल्लम कली नाव दौड़ है।
  - prompt: ओणम किस तरह का त्योहार है?
    options:
    - फ़सल का त्योहार
    - सर्दी का त्योहार
    - पतंगों का त्योहार
    - दीपों का त्योहार
    answer: फ़सल का त्योहार
    difficulty: 2
    hints:
    - चिंगम महीना।
    - खेतों की खुशी।
    solution: ओणम फ़सल का त्योहार है।
