        teach: 'पूक्कलम बनाओ। पहला: ज़मीन साफ़ करके बीच में एक गोला बनाओ। दूसरा: अलग-अलग रंगों के फूलों की पंखुड़ियाँ इकट्ठी करो। तीसरा: गोले के अंदर घेरे बनाकर हर घेरे में एक रंग भरो। चौथा: हर दिन एक नया घेरा जोड़ो, ताकि पूक्कलम बड़ा होता जाए।'
      - style: real_world
        teach: ओणसद्या में बीस से भी ज़्यादा व्यंजन होते हैं, जैसे अवियल, सांबर और पायसम। सब लोग एक साथ बैठते हैं और हर व्यंजन केले के पत्ते पर अपनी तय जगह पर परोसा जाता है।
    - teach: ओणम पर नावों की दौड़ (वल्लम कली), झूले, और पुलिकली (बाघ बनकर नाचना) होते हैं। मुख्य दिन थिरुवोणम है। सब लोग मिलकर खुशी मनाते हैं।
