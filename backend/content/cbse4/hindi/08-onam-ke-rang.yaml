subject: cbse4-hin
chapter: 8
title: ओणम के रंग
tips:
  h4_onam_fasal: "ओणम चिंगम महीने में, बारिश के बाद आता है, जब खेतों में धान पककर तैयार होता है।"
  h4_onam_raja: "केरल की कथा: एक दानी असुर राजा, जिसे वामन ने पाताल भेजा, साल में एक बार अपनी प्रजा से मिलने आता है।"
  h4_pookkalam: "कोलम चावल के आटे से बनता है। मलयालम में 'पू' का अर्थ फूल है: फूलों वाली रंगोली का नाम उसी से शुरू होता है।"
  h4_sadya: "केरल में भोज के लिए किसी पेड़ का बड़ा, चौड़ा हरा पत्ता बिछाते हैं।"
  h4_vallam: "'वल्लम' मलयालम में नाव को कहते हैं। केरल की नदियों में लंबी साँप जैसी नावें क्या करती हैं?"

concepts:
- code: cbse4h.v8.onam
  title: ओणम के रंग
  notes: |
    केरल के त्योहार ओणम पर पाठ। ओणम मलयालम महीने चिंगम (अगस्त-सितंबर) में मनाया जाता है; यह फ़सल का त्योहार है।
    मान्यता है कि दयालु राजा महाबली इस समय अपनी प्रजा से मिलने आते हैं। घरों के आगे फूलों की रंगोली (पूक्कलम) बनती है,
    केले के पत्ते पर कई व्यंजनों वाला भोज (ओणसद्या), नाव दौड़ (वल्लम कली), झूले, पुलिकली (बाघ नृत्य)। मुख्य दिन थिरुवोणम।
  explanations:
    text: ओणम केरल का सबसे बड़ा त्योहार है, जो फ़सल के समय चिंगम महीने में आता है। लोग मानते हैं कि राजा महाबली अपनी प्रजा से मिलने आते हैं। घरों के आगे फूलों का पूक्कलम बनता है, केले के पत्ते पर ओणसद्या परोसी जाती है और नाव दौड़ होती है।
    visual: 'चित्र बनाइए: घर के आँगन में गोल रंग-बिरंगा फूलों का पूक्कलम, केले के पत्ते पर कई व्यंजन, और नदी में लंबी साँप-नाव।'
    step_by_step: 1. त्योहार कहाँ का है? केरल। 2. कब? चिंगम महीने में। 3. किसकी याद में? राजा महाबली। 4. कैसे मनाते हैं? पूक्कलम, सद्या, नाव दौड़।
    real_world: ओणम पर केरल के सब लोग, हर धर्म के, मिलकर पूक्कलम बनाते और सद्या खाते हैं।
  picture:
    kind: compare
    columns:
    - title: ओणम की परंपरा
      points:
      - पूक्कलम
      - ओणसद्या
      - वल्लम कली
    - title: क्या है
      points:
      - फूलों की रंगोली
      - केले के पत्ते पर भोज
      - नाव दौड़
    alt: ओणम में पूक्कलम फूलों की रंगोली है, ओणसद्या केले के पत्ते पर भोज है, और वल्लम कली नाव दौड़ है।
  activity:
    type: sort
    prompt: ओणम से जुड़ी चीज़ें पहचानो।
    bins:
    - ओणम में होता है
    - ओणम से जुड़ा नहीं
    items:
    - label: पूक्कलम (फूलों की रंगोली)
      bin: ओणम में होता है
      clue: घरों के आगे फूलों से क्या बनता है?
      why: ओणम की पहचान।
    - label: ओणसद्या (केले के पत्ते पर भोज)
      bin: ओणम में होता है
      clue: ओणम का भोज कैसे परोसा जाता है?
      why: ओणम का भोज।
    - label: वल्लम कली (नाव दौड़)
      bin: ओणम में होता है
      clue: केरल की नदियों में कौन-सी दौड़?
      why: ओणम पर नाव दौड़।
    - label: राजा महाबली का आना
      bin: ओणम में होता है
      clue: मान्यता के अनुसार कौन प्रजा से मिलने आते हैं?
      why: ओणम की कथा।
    - label: एक-दूसरे पर पानी डालना
      bin: ओणम से जुड़ा नहीं
      clue: यह किस त्योहार की बात है?
      why: यह साङकेन जैसे त्योहारों की बात है।
  items:
  - prompt: ओणम किस राज्य का त्योहार है?
    options:
    - केरल
    - पंजाब
    - असम
    - गुजरात
    answer: केरल
    difficulty: 1
    hints:
    - हमारा राज्य।
    - महाबली।
    solution: ओणम केरल का त्योहार है।
    mistakes:
      पंजाब: hin4_read_again
  - prompt: ओणम पर किस राजा के आने की मान्यता है?
    options:
    - महाबली
    - अकबर
    - अशोक
    - विक्रमादित्य
    answer: महाबली
    difficulty: 1
    hints:
    - दयालु राजा।
    - प्रजा से मिलने।
    solution: माना जाता है कि राजा महाबली आते हैं।
    mistakes: {"अकबर": "h4_onam_raja", "अशोक": "h4_onam_raja", "विक्रमादित्य": "h4_onam_raja"}
  - prompt: फूलों से बनी रंगोली को क्या कहते हैं?
    options:
    - पूक्कलम
    - कोलम (चावल के आटे से)
    - मेहंदी
    - पतंग
    answer: पूक्कलम
    difficulty: 2
    hints:
    - पू = फूल।
    - आँगन में।
    solution: फूलों की रंगोली पूक्कलम है।
    mistakes: {"कोलम (चावल के आटे से)": "h4_pookkalam", "मेहंदी": "h4_pookkalam", "पतंग": "h4_pookkalam"}
  - prompt: ओणसद्या किस पर परोसी जाती है?
    options:
    - केले के पत्ते पर
    - प्लास्टिक की थाली पर
    - अख़बार पर
    - काँच के गिलास में
    answer: केले के पत्ते पर
    difficulty: 1
    hints:
    - हरा, बड़ा पत्ता।
    - परंपरा।
    solution: ओणसद्या केले के पत्ते पर परोसी जाती है।
    mistakes: {"प्लास्टिक की थाली पर": "h4_sadya", "अख़बार पर": "h4_sadya", "काँच के गिलास में": "h4_sadya"}
  - prompt: वल्लम कली क्या है?
    options:
    - नाव दौड़
    - पतंगबाज़ी
    - कुश्ती
    - शतरंज
    answer: नाव दौड़
    difficulty: 2
    hints:
    - नदी में।
    - लंबी नावें।
    solution: वल्लम कली नाव दौड़ है।
    mistakes: {"पतंगबाज़ी": "h4_vallam", "कुश्ती": "h4_vallam", "शतरंज": "h4_vallam"}
  - prompt: ओणम किस तरह का त्योहार है?
    options:
    - फ़सल का त्योहार
    - सर्दी का त्योहार
    - पतंगों का त्योहार
    - दीपों का त्योहार
    answer: फ़सल का त्योहार
    difficulty: 2
    hints:
    - चिंगम महीना।
    - खेतों की खुशी।
    solution: ओणम फ़सल का त्योहार है।
    mistakes: {"सर्दी का त्योहार": "h4_onam_fasal", "पतंगों का त्योहार": "h4_onam_fasal", "दीपों का त्योहार": "h4_onam_fasal"}
