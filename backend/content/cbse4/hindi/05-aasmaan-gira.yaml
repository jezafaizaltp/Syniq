subject: cbse4-hin
chapter: 5
title: आसमान गिरा
tips:
  h4_aasmaan_gira: "आसमान सच में गिर ही नहीं सकता। पेड़ के नीचे बैठे जानवर के सिर पर ऊपर से क्या टपक सकता है?"
  h4_bina_jaanche: "जानवर डरकर एक-दूसरे के पीछे भागे। क्या किसी ने रुककर देखा कि सच में क्या हुआ?"
  h4_paryay_vilom: "भय, चिंता, घबराहट डर के ही साथी (पर्यायवाची) हैं। विलोम वह है जो डर के बिल्कुल उलट हो।"

concepts:
- code: cbse4h.v5.aasmaan
  title: आसमान गिरा
  notes: |
    लोककथा (इसी तरह की प्रसिद्ध कथा): एक छोटा जीव (कहानी के अनुसार खरगोश/चूज़ा) पेड़ के नीचे बैठा था, अचानक ऊपर से कुछ
    (फल या पत्ता) गिरा और उसने सोचा 'आसमान गिर रहा है!' वह डरकर भागा और सबको बताया; एक-एक करके कई जानवर बिना
    सोचे साथ भागने लगे। अंत में किसी समझदार (शेर/बड़े जानवर) ने जाकर देखा तो पता चला कि बस एक फल गिरा था। सीख: बिना
    जाँचे अफ़वाह पर विश्वास न करें, घबराएँ नहीं। (पात्र छपी पुस्तक से मिलाने हैं।)
  explanations:
    text: एक छोटे जीव पर ऊपर से कुछ गिरा और उसने समझा कि आसमान गिर रहा है। वह डरकर भागा और सबको बताया। बहुत से जानवर बिना सोचे उसके साथ भागने लगे। आख़िर में किसी समझदार ने जाकर देखा, तो पता चला कि बस एक फल गिरा था।
    visual: 'चित्र बनाइए: पेड़ के नीचे गिरा एक फल, और डर से भागते जानवरों की एक लंबी कतार, सबसे आगे एक छोटा जीव।'
    step_by_step: 1. क्या हुआ? कुछ ऊपर से गिरा। 2. जीव ने क्या सोचा? आसमान गिरा। 3. बाकी जानवरों ने क्या किया? बिना सोचे भागे। 4. सच क्या निकला? 5. सीख।
    real_world: आज भी लोग बिना जाँचे संदेश आगे भेज देते हैं। पहले सच जानना चाहिए।
  picture:
    kind: flow
    steps:
    - ऊपर से फल गिरा
    - '''आसमान गिरा!'' सोचकर भागा'
    - सब बिना सोचे भागने लगे
    - 'समझदार ने जाँचा: बस फल था'
    alt: ऊपर से फल गिरा, छोटे जीव ने सोचा आसमान गिरा और भागा, सब बिना सोचे भागने लगे, और समझदार ने जाँचकर बताया कि बस एक फल था।
  items:
  - prompt: छोटे जीव ने क्या सोचा?
    options:
    - आसमान गिर रहा है
    - बारिश हो रही है
    - खाना आ गया
    - रात हो गई
    answer: आसमान गिर रहा है
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - डर।
    solution: उसने सोचा कि आसमान गिर रहा है।
    mistakes:
      बारिश हो रही है: hin4_read_again
  - prompt: असल में क्या गिरा था?
    options:
    - एक फल (या पत्ता)
    - आसमान
    - एक पहाड़
    - एक बादल
    answer: एक फल (या पत्ता)
    difficulty: 1
    hints:
    - पेड़ से।
    - छोटी-सी चीज़।
    solution: बस पेड़ से एक फल गिरा था।
    mistakes: {"आसमान": "h4_aasmaan_gira", "एक पहाड़": "h4_aasmaan_gira", "एक बादल": "h4_aasmaan_gira"}
  - prompt: बाकी जानवरों ने क्या गलती की?
    options:
    - बिना जाँचे बात मान ली
    - सच पता किया
    - शांत बैठे रहे
    - पेड़ पर चढ़ गए
    answer: बिना जाँचे बात मान ली
    difficulty: 2
    hints:
    - सब भागने लगे।
    - सोचा नहीं।
    solution: उन्होंने बिना जाँचे अफ़वाह मान ली।
    mistakes: {"सच पता किया": "h4_bina_jaanche", "शांत बैठे रहे": "h4_bina_jaanche", "पेड़ पर चढ़ गए": "h4_bina_jaanche"}
  - prompt: इस कहानी की सीख क्या है?
    options:
    - बिना जाँचे किसी बात पर विश्वास मत करो
    - हमेशा डरकर भागो
    - पेड़ के नीचे मत बैठो
    - फल मत खाओ
    answer: बिना जाँचे किसी बात पर विश्वास मत करो
    difficulty: 2
    hints:
    - सच क्या निकला?
    - पहले जाँचो।
    solution: पहले सच जाँचना चाहिए।
    mistakes:
      हमेशा डरकर भागो: hin4_lesson
  - prompt: '''अफ़वाह'' का अर्थ है:'
    options:
    - बिना जाँची, उड़ती हुई बात
    - सच्ची ख़बर
    - एक मिठाई
    - एक खेल
    answer: बिना जाँची, उड़ती हुई बात
    difficulty: 2
    hints:
    - जिसका सच पता न हो।
    - फैलती बात।
    solution: अफ़वाह बिना जाँची फैलती बात है।
    mistakes:
      सच्ची ख़बर: hin4_word
  - prompt: '''डर'' का विलोम शब्द है:'
    options:
    - साहस
    - भय
    - चिंता
    - घबराहट
    answer: साहस
    difficulty: 2
    hints:
    - हिम्मत।
    - उलटा।
    solution: डर का विलोम साहस है।
    mistakes: {"भय": "h4_paryay_vilom", "चिंता": "h4_paryay_vilom", "घबराहट": "h4_paryay_vilom"}
