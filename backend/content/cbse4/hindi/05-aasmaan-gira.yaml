subject: cbse4-hin
chapter: 5
title: आसमान गिरा
tips:
  h4_aasmaan_gira: "आसमान सच में गिर ही नहीं सकता। पेड़ के नीचे बैठे जानवर के सिर पर ऊपर से क्या टपक सकता है?"
  h4_bina_jaanche: "जानवर डरकर एक-दूसरे के पीछे भागे। क्या किसी ने रुककर देखा कि सच में क्या हुआ?"
  h4_paryay_vilom: "भय, चिंता, घबराहट डर के ही साथी (पर्यायवाची) हैं। विलोम वह है जो डर के बिल्कुल उलट हो।"
  c4h5_jaanch: 'सोचो: किसी ने अपनी आँखों से देखा था, या बस सुनी-सुनाई बात आगे बढ़ा दी?'
  c4h5_kahani: 'कहानी का क्रम याद करो: पहले क्या गिरा, फिर किसने क्या सोचा, अंत में क्या पता चला?'
  c4h5_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v5.aasmaan
  title: आसमान गिरा
  notes: |
    लोककथा (इसी तरह की प्रसिद्ध कथा): एक छोटा जीव (कहानी के अनुसार खरगोश/चूज़ा) पेड़ के नीचे बैठा था, अचानक ऊपर से कुछ
    (फल या पत्ता) गिरा और उसने सोचा 'आसमान गिर रहा है!' वह डरकर भागा और सबको बताया; एक-एक करके कई जानवर बिना
    सोचे साथ भागने लगे। अंत में किसी समझदार (शेर/बड़े जानवर) ने जाकर देखा तो पता चला कि बस एक फल गिरा था। सीख: बिना
    जाँचे अफ़वाह पर विश्वास न करें, घबराएँ नहीं। (पात्र छपी पुस्तक से मिलाने हैं।)
  explanations:
    text: एक छोटे जीव पर ऊपर से कुछ गिरा और उसने समझा कि आसमान गिर रहा है। वह डरकर भागा और सबको बताया। बहुत से जानवर बिना सोचे उसके साथ भागने लगे। आख़िर में किसी समझदार ने जाकर देखा, तो पता चला कि बस एक फल गिरा था।
    visual: 'चित्र बनाइए: पेड़ के नीचे गिरा एक फल, और डर से भागते जानवरों की एक लंबी कतार, सबसे आगे एक छोटा जीव।'
    step_by_step: 1. क्या हुआ? कुछ ऊपर से गिरा। 2. जीव ने क्या सोचा? आसमान गिरा। 3. बाकी जानवरों ने क्या किया? बिना सोचे भागे। 4. सच क्या निकला? 5. सीख।
    real_world: आज भी लोग बिना जाँचे संदेश आगे भेज देते हैं। पहले सच जानना चाहिए।
  picture:
    kind: flow
    steps:
    - ऊपर से फल गिरा
    - '''आसमान गिरा!'' सोचकर भागा'
    - सब बिना सोचे भागने लगे
    - 'समझदार ने जाँचा: बस फल था'
    alt: ऊपर से फल गिरा, छोटे जीव ने सोचा आसमान गिरा और भागा, सब बिना सोचे भागने लगे, और समझदार ने जाँचकर बताया कि बस एक फल था।
  activity:
    type: order
    prompt: '"आसमान गिरा!" वाली कहानी क्रम से लगाओ।'
    steps:
    - ऊपर से कुछ गिरता है
    - छोटा जीव सोचता है, आसमान गिर रहा है
    - सब जानवर बिना सोचे साथ भागते हैं
    - समझदार जानवर जाकर देखता है
    - पता चलता है, बस एक फल गिरा था
    reasons:
      छोटा जीव सोचता है, आसमान गिर रहा है: कुछ गिरा, तभी उसे डर लगा।
      सब जानवर बिना सोचे साथ भागते हैं: उसकी बात सुनकर ही बाकी भागे।
      समझदार जानवर जाकर देखता है: भगदड़ देखकर उसने जाँचने का सोचा।
      पता चलता है, बस एक फल गिरा था: जाँचने पर ही सच पता चला।
  lesson:
    - teach: '''आसमान गिरा'' एक लोककथा है। एक छोटा जीव पेड़ के नीचे बैठा था। अचानक ऊपर से कुछ गिरा और उसने सोचा: ''आसमान गिर रहा है!'' वह डरकर भागा।'
      check:
        prompt: छोटा जीव क्यों भागा?
        options:
        - उसे लगा आसमान गिर रहा है
        - उसे भूख लगी थी
        - बारिश हो रही थी
        answer: उसे लगा आसमान गिर रहा है
        why: वह बिना देखे डर गया।
      ways:
      - style: visual
        teach: 'कहानी की शुरुआत: क्या हुआ और छोटे जीव ने क्या सोचा।'
        picture:
          kind: flow
          steps:
          - एक छोटा जीव पेड़ के नीचे बैठा था
          - ऊपर से अचानक कुछ गिरा
          - 'उसने सोचा: आसमान गिर रहा है!'
          - वह डरकर भागा
          alt: एक छोटा जीव पेड़ के नीचे बैठा था। ऊपर से अचानक कुछ गिरा। उसने सोचा कि आसमान गिर रहा है और वह डरकर भागा।
      - style: real_world
        teach: कभी रात में खिड़की के बाहर अजीब आवाज़ सुनकर डर लगता है, और फिर पता चलता है कि बस हवा से कोई डाल हिल रही थी। डर अक्सर बिना देखे बड़ा हो जाता है।
    - teach: उसने रास्ते में सबको बताया। एक-एक करके कई जानवर बिना सोचे-समझे उसके साथ भागने लगे। बिना जाँची बात इसी तरह फैलती है, उसे अफ़वाह कहते हैं।
      picture:
        kind: flow
        steps:
        - कुछ गिरा
        - छोटा जीव डरा
        - सबको बताया
        - सब बिना जाँचे भागे
        - समझदार ने जाकर देखा
        alt: अफ़वाह कैसे फैली और कैसे सच पता चला।
      check:
        prompt: बिना जाँची, उड़ती हुई बात को क्या कहते हैं?
        options:
        - अफ़वाह
        - कविता
        - सच
        answer: अफ़वाह
        why: अफ़वाह जाँची हुई नहीं होती।
      ways:
      - style: step_by_step
        teach: 'अफ़वाह को पहचानो। पहला: कोई ख़बर सुनो तो पूछो: यह किसने अपनी आँखों से देखी? दूसरा: क्या यह किसी भरोसेमंद व्यक्ति ने बताई? तीसरा: ख़ुद जाँच सकते हो तो जाँचो। चौथा: पक्का पता न हो तो आगे मत फैलाओ।'
      - style: real_world
        teach: मोबाइल पर कई बार डराने वाले संदेश बहुत तेज़ी से फैल जाते हैं। समझदार लोग आगे भेजने से पहले किसी बड़े या भरोसेमंद ख़बर से जाँच करते हैं।
    - teach: 'अंत में एक समझदार जानवर ने जाकर देखा, तो पता चला कि बस एक फल गिरा था। सीख: घबराओ मत, पहले जाँचो, फिर विश्वास करो।'
      check:
        prompt: समझदार जानवर ने क्या किया?
        options:
        - जाकर ख़ुद देखा
        - और ज़ोर से भागा
        - सबको डराया
        answer: जाकर ख़ुद देखा
        why: जाँचने से सच पता चलता है।
      ways:
      - style: visual
        teach: 'घबराकर भागना और पहले जाँचना: दोनों का नतीजा।'
        picture:
          kind: compare
          columns:
          - title: घबराकर भागना
            points:
            - बिना देखे मान लेना
            - सबको डराना
            - बेकार की भगदड़
          - title: पहले जाँचना
            points:
            - जाकर देखना
            - सच पता चलना
            - सब शांत रहते हैं
          alt: घबराकर भागने में लोग बिना देखे मान लेते हैं, सबको डराते हैं और बेकार भगदड़ होती है। पहले जाँचने पर सच पता चलता है और सब शांत रहते हैं।
      - style: step_by_step
        teach: 'डर लगे तो क्या करें। पहला: रुको और गहरी साँस लो। दूसरा: चारों ओर ध्यान से देखो। तीसरा: किसी बड़े से पूछो। चौथा: सच जानने के बाद ही आगे कुछ करो।'
  items:
  - prompt: छोटे जीव ने क्या सोचा?
    options:
    - आसमान गिर रहा है
    - बारिश हो रही है
