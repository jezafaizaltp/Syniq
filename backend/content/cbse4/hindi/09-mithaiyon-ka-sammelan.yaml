subject: cbse4-hin
chapter: 9
title: मिठाइयों का सम्मेलन
tips:
  h4_jalebi: "बर्फ़ी चौकोर, लड्डू और रसगुल्ला गेंद जैसे। कौन-सी मिठाई टेढ़ी-मेढ़ी लपेटों वाली होती है?"
  h4_payasam: "ओणम की सद्या के अंत में दूध-गुड़ वाली खीर परोसी जाती है। उसका मलयालम नाम सोचो।"
  h4_rasgulla: "रसगुल्ला छेने से बनता है, और यह पूर्वी भारत की मिठाई है, जहाँ कोलकाता और पुरी हैं।"
  c4h9_mithai: 'मिठाई का रूप और स्वाद याद करो: गोल, घुमावदार, रस भरी, या दूध से बनी?'
  c4h9_sehat: 'सोचो: थोड़ी मिठाई ठीक है, पर बहुत ज़्यादा से दाँतों और शरीर का क्या होगा?'
  c4h9_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v9.mithai
  title: मिठाइयों का सम्मेलन
  notes: |
    हास्य-भरा पाठ जिसमें मिठाइयाँ (जैसे लड्डू, जलेबी, रसगुल्ला, बर्फ़ी, गुलाब जामुन) एक सम्मेलन (सभा) करती हैं और अपनी-अपनी
    ख़ूबियाँ बताती हैं। ठीक संवाद यहाँ नहीं दिए गए हैं। अभ्यास: मिठाइयों के नाम और राज्य, 'सम्मेलन' जैसे शब्द, संवाद पढ़ना,
    और यह समझ कि मिठाई कम मात्रा में ही खानी चाहिए।
  explanations:
    text: इस मज़ेदार पाठ में मिठाइयाँ एक सभा, यानी सम्मेलन, करती हैं। लड्डू, जलेबी, रसगुल्ला सब अपनी तारीफ़ करते हैं। मिठाइयाँ स्वादिष्ट हैं, पर ज़्यादा खाने से दाँत और सेहत ख़राब होती है।
    visual: 'चित्र बनाइए: मेज़ पर मंच, उस पर माइक के सामने बोलता गोल लड्डू, नीचे बैठी जलेबी, रसगुल्ला और बर्फ़ी।'
    step_by_step: '1. सम्मेलन में कौन-कौन है? 2. हर मिठाई क्या कहती है? 3. कौन-सी बात मज़ेदार है? 4. सीख: मिठाई कम खाएँ।'
    real_world: 'बंगाल का रसगुल्ला, उत्तर भारत की जलेबी और केरल का पायसम: हर जगह की अपनी मिठाई है।'
  picture:
    kind: compare
    columns:
    - title: मिठाई
      points:
      - रसगुल्ला
      - जलेबी
      - पायसम
    - title: कहाँ प्रसिद्ध
      points:
      - बंगाल / ओडिशा
      - उत्तर भारत
      - केरल
    alt: रसगुल्ला बंगाल और ओडिशा में, जलेबी उत्तर भारत में और पायसम केरल में प्रसिद्ध है।
  activity:
    type: sort
    prompt: मिठाई सम्मेलन में कौन-सी बात सही सीख है?
    bins:
    - अच्छी सीख
    - अच्छी सीख नहीं
    items:
    - label: मिठाई थोड़ी मात्रा में खाएँ
      bin: अच्छी सीख
      clue: बहुत मिठाई से दाँतों और सेहत का क्या?
      why: कम मात्रा में खाना ठीक।
    - label: हर राज्य की अपनी मिठाई
      bin: अच्छी सीख
      clue: भारत में अलग-अलग मिठाइयाँ?
      why: विविधता की पहचान।
    - label: रोज़ ढेर सारी जलेबी खाएँ
      bin: अच्छी सीख नहीं
      clue: रोज़ ज़्यादा मीठा ठीक है?
      why: ज़्यादा मीठा सेहत बिगाड़ता है।
    - label: खाना छोड़कर बस मिठाई
      bin: अच्छी सीख नहीं
      clue: क्या मिठाई से भरपूर पोषण मिलता है?
      why: मिठाई खाने की जगह नहीं ले सकती।
  lesson:
    - teach: '''मिठाइयों का सम्मेलन'' एक मज़ेदार पाठ है। इसमें मिठाइयाँ एक सभा (सम्मेलन) करती हैं और हर मिठाई अपनी ख़ूबी बताती है, जैसे लोग बातें करते हैं।'
      check:
        prompt: '''सम्मेलन'' का अर्थ क्या है?'
        options:
        - सभा, मिलकर बैठक
        - दौड़
        - खाना पकाना
        answer: सभा, मिलकर बैठक
        why: सम्मेलन में बहुत से लोग मिलते हैं।
    - teach: 'भारत के हर हिस्से की अपनी मिठाई है: बंगाल-ओडिशा का रसगुल्ला, केरल का पायसम, उत्तर भारत की जलेबी, महाराष्ट्र का मोदक, मैसूर का मैसूर पाक।'
      picture:
        kind: compare
        columns:
        - title: मिठाई
          points:
          - रसगुल्ला
          - पायसम
          - मोदक
        - title: जगह
          points:
          - बंगाल / ओडिशा
          - केरल
          - महाराष्ट्र
        alt: कुछ मिठाइयाँ और वे जगहें जहाँ वे प्रसिद्ध हैं।
      check:
        prompt: मोदक किस राज्य में गणेश चतुर्थी पर बहुत बनता है?
        options:
        - महाराष्ट्र
        - पंजाब
        - असम
        answer: महाराष्ट्र
        why: गणेश चतुर्थी पर महाराष्ट्र में मोदक बनते हैं।
    - teach: मिठाई स्वादिष्ट है, पर बहुत ज़्यादा खाने से दाँत ख़राब होते हैं और सेहत बिगड़ती है। इसलिए मिठाई थोड़ी और कभी-कभी खानी चाहिए।
      check:
        prompt: मिठाई कैसे खानी चाहिए?
        options:
        - थोड़ी और कभी-कभी
        - हर खाने की जगह
        - रात को सोते समय बहुत सारी
        answer: थोड़ी और कभी-कभी
        why: ज़्यादा चीनी शरीर के लिए ठीक नहीं।
  items:
  - prompt: '''सम्मेलन'' का अर्थ है:'
    options:
    - सभा, मिलकर बैठक
    - झगड़ा
    - दौड़
    - नींद
    answer: सभा, मिलकर बैठक
    difficulty: 1
    hints:
    - सब मिलते हैं।
    - मीटिंग।
    solution: सम्मेलन यानी सभा।
    mistakes:
      झगड़ा: hin4_word
  - prompt: कौन-सी मिठाई गोल-गोल घुमावदार होती है?
    options:
    - जलेबी
    - बर्फ़ी
    - लड्डू
    - रसगुल्ला
    answer: जलेबी
    difficulty: 1
    hints:
    - चाशनी में डूबी।
    - पेंच जैसी।
    solution: जलेबी घुमावदार होती है।
    mistakes: {"बर्फ़ी": "h4_jalebi", "लड्डू": "h4_jalebi", "रसगुल्ला": "h4_jalebi"}
  - prompt: केरल की प्रसिद्ध मीठी खीर कौन-सी है?
    options:
    - पायसम
    - रसमलाई
    - घेवर
    - पेठा
    answer: पायसम
    difficulty: 2
    hints:
    - ओणम सद्या में।
    - खीर जैसी।
    solution: केरल का पायसम प्रसिद्ध है।
    mistakes: {"रसमलाई": "h4_payasam", "घेवर": "h4_payasam", "पेठा": "h4_payasam"}
  - prompt: ज़्यादा मिठाई खाने से क्या होता है?
    options:
    - दाँत और सेहत ख़राब होते हैं
    - हम लंबे हो जाते हैं
    - आँखें तेज़ होती हैं
    - कुछ नहीं होता
    answer: दाँत और सेहत ख़राब होते हैं
    difficulty: 1
    hints:
    - चीनी।
    - दाँतों में कीड़े।
    solution: ज़्यादा मीठा सेहत को नुक़सान पहुँचाता है।
    mistakes:
      कुछ नहीं होता: hin4_lesson
  - prompt: '''मीठा'' का विलोम है:'
    options:
    - कड़वा
    - स्वादिष्ट
    - चीनी
    - गुड़
    answer: कड़वा
    difficulty: 1
    hints:
    - नीम जैसा।
    - उलटा।
    solution: मीठा का विलोम कड़वा है।
    mistakes: {"स्वादिष्ट": "h1_ulta", "चीनी": "h1_ulta", "गुड़": "h1_ulta"}
  - prompt: रसगुल्ला किस राज्य से जुड़ा माना जाता है?
    options:
    - बंगाल / ओडिशा
    - पंजाब
    - राजस्थान
    - कश्मीर
    answer: बंगाल / ओडिशा
    difficulty: 2
    hints:
    - पूर्व भारत।
    - चाशनी वाला सफ़ेद गोला।
    solution: रसगुल्ला बंगाल और ओडिशा से जुड़ा है।
    mistakes: {"पंजाब": "h4_rasgulla", "राजस्थान": "h4_rasgulla", "कश्मीर": "h4_rasgulla"}
  - prompt: रसगुल्ला कैसा होता है?
    options:
    - गोल, नरम और चाशनी में डूबा
    - सूखा और कड़ा
    - नमकीन
    answer: गोल, नरम और चाशनी में डूबा
    difficulty: 1
    hints:
    - नाम में 'रस' छिपा है।
    - यह छैने से बनता है।
    solution: 'चरण 1: रस = चाशनी। चरण 2: रसगुल्ला गोल, नरम और चाशनी में डूबा होता है।'
    mistakes:
      सूखा और कड़ा: c4h9_mithai
      नमकीन: c4h9_mithai
  - prompt: पायसम किससे बनता है?
    options:
    - दूध या नारियल के दूध, चावल और गुड़/चीनी से
    - बेसन और मिर्च से
    - आलू और नमक से
    answer: दूध या नारियल के दूध, चावल और गुड़/चीनी से
    difficulty: 2
    hints:
    - यह केरल की मीठी खीर है।
    - खीर किससे बनती है?
    solution: 'चरण 1: पायसम खीर जैसा है। चरण 2: यह दूध, चावल और गुड़ या चीनी से बनता है।'
    mistakes:
      बेसन और मिर्च से: c4h9_mithai
      आलू और नमक से: c4h9_mithai
  - prompt: मिठाई खाने के बाद क्या करना अच्छी आदत है?
    options:
    - कुल्ला करना या दाँत साफ़ करना
    - तुरंत सो जाना
    - और मिठाई खाना
    answer: कुल्ला करना या दाँत साफ़ करना
    difficulty: 1
    hints:
    - चीनी दाँतों पर चिपकती है।
    - उसे कैसे हटाएँ?
    solution: 'चरण 1: चीनी दाँतों को ख़राब करती है। चरण 2: कुल्ला करने या ब्रश करने से दाँत बचते हैं।'
    mistakes:
      तुरंत सो जाना: c4h9_sehat
      और मिठाई खाना: c4h9_sehat
  - prompt: '''स्वादिष्ट'' का अर्थ है:'
    options:
    - जिसका स्वाद अच्छा हो
    - जो कड़वा हो
    - जो दिखाई न दे
    answer: जिसका स्वाद अच्छा हो
    difficulty: 1
    hints:
    - शब्द में 'स्वाद' छिपा है।
    - खाने में मज़ा आए।
    solution: 'चरण 1: स्वाद = खाने का अनुभव। चरण 2: स्वादिष्ट = जिसका स्वाद अच्छा हो।'
    mistakes:
      जो कड़वा हो: c4h9_shabd
      जो दिखाई न दे: c4h9_shabd
  - prompt: पाठ में मिठाइयाँ लोगों की तरह बात करती हैं। ऐसी कहानी में क्या होता है?
    options:
    - चीज़ों को बोलते हुए दिखाया जाता है
    - सब कुछ सच्ची घटना होती है
    - कोई बात नहीं करता
    answer: चीज़ों को बोलते हुए दिखाया जाता है
    difficulty: 2
    hints:
    - क्या असल में मिठाई बोल सकती है?
    - यह कल्पना से लिखा गया है।
    solution: 'चरण 1: मिठाई असल में नहीं बोलती। चरण 2: कहानी में कल्पना से उन्हें बोलते दिखाया गया है।'
    mistakes:
      सब कुछ सच्ची घटना होती है: c4h9_shabd
      कोई बात नहीं करता: c4h9_shabd
  - prompt: इनमें से कौन-सी मिठाई नहीं है?
    options:
    - समोसा
    - लड्डू
    - बर्फ़ी
    answer: समोसा
    difficulty: 1
    hints:
    - दो चीज़ें मीठी हैं।
    - कौन-सी चीज़ नमकीन है?
    solution: 'चरण 1: लड्डू और बर्फ़ी मीठे हैं। चरण 2: समोसा नमकीन है, मिठाई नहीं।'
    mistakes:
      लड्डू: c4h9_mithai
      बर्फ़ी: c4h9_mithai
  - prompt: मिठाइयाँ बेचने वाले को क्या कहते हैं?
    options:
    - हलवाई
    - दर्ज़ी
    - माली
    answer: हलवाई
    difficulty: 2
    hints:
    - दर्ज़ी कपड़े सिलता है, माली बगीचा सँभालता है।
    - हलवा बनाने से जुड़ा नाम।
    solution: 'चरण 1: दर्ज़ी और माली अलग काम करते हैं। चरण 2: मिठाई बनाने-बेचने वाला हलवाई है।'
    mistakes:
      दर्ज़ी: c4h9_shabd
      माली: c4h9_shabd
  - prompt: हर दिन ढेर सारी मिठाई खाने से क्या हो सकता है?
    options:
    - दाँतों में कीड़े और वज़न बढ़ना
    - आँखें तेज़ होना
    - लंबाई तुरंत बढ़ना
    answer: दाँतों में कीड़े और वज़न बढ़ना
    difficulty: 2
    hints:
    - ज़्यादा चीनी का असर सोचो।
    - दाँत और शरीर दोनों पर।
    solution: 'चरण 1: ज़्यादा चीनी दाँत ख़राब करती है। चरण 2: वज़न भी बढ़ सकता है।'
    mistakes:
      आँखें तेज़ होना: c4h9_sehat
      लंबाई तुरंत बढ़ना: c4h9_sehat
  - prompt: '''मिठाई'' का बहुवचन क्या है?'
    options:
    - मिठाइयाँ
    - मिठाईयों
    - मिठाइएँ
    answer: मिठाइयाँ
    difficulty: 3
    hints:
    - पाठ के नाम में यही शब्द है।
    - लड़की से लड़कियाँ बनता है।
    solution: 'चरण 1: ''ई'' वाले शब्द का बहुवचन ''इयाँ'' से बनता है। चरण 2: मिठाई → मिठाइयाँ।'
    mistakes:
      मिठाईयों: c4h9_shabd
      मिठाइएँ: c4h9_shabd
