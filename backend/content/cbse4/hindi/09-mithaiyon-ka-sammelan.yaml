subject: cbse4-hin
chapter: 9
title: मिठाइयों का सम्मेलन
tips:
  h4_jalebi: "बर्फ़ी चौकोर, लड्डू और रसगुल्ला गेंद जैसे। कौन-सी मिठाई टेढ़ी-मेढ़ी लपेटों वाली होती है?"
  h4_payasam: "ओणम की सद्या के अंत में दूध-गुड़ वाली खीर परोसी जाती है। उसका मलयालम नाम सोचो।"
  h4_rasgulla: "रसगुल्ला छेने से बनता है, और यह पूर्वी भारत की मिठाई है, जहाँ कोलकाता और पुरी हैं।"

concepts:
- code: cbse4h.v9.mithai
  title: मिठाइयों का सम्मेलन
  notes: |
    हास्य-भरा पाठ जिसमें मिठाइयाँ (जैसे लड्डू, जलेबी, रसगुल्ला, बर्फ़ी, गुलाब जामुन) एक सम्मेलन (सभा) करती हैं और अपनी-अपनी
    ख़ूबियाँ बताती हैं। ठीक संवाद यहाँ नहीं दिए गए हैं। अभ्यास: मिठाइयों के नाम और राज्य, 'सम्मेलन' जैसे शब्द, संवाद पढ़ना,
    और यह समझ कि मिठाई कम मात्रा में ही खानी चाहिए।
  explanations:
    text: इस मज़ेदार पाठ में मिठाइयाँ एक सभा, यानी सम्मेलन, करती हैं। लड्डू, जलेबी, रसगुल्ला सब अपनी तारीफ़ करते हैं। मिठाइयाँ स्वादिष्ट हैं, पर ज़्यादा खाने से दाँत और सेहत ख़राब होती है।
    visual: 'चित्र बनाइए: मेज़ पर मंच, उस पर माइक के सामने बोलता गोल लड्डू, नीचे बैठी जलेबी, रसगुल्ला और बर्फ़ी।'
    step_by_step: '1. सम्मेलन में कौन-कौन है? 2. हर मिठाई क्या कहती है? 3. कौन-सी बात मज़ेदार है? 4. सीख: मिठाई कम खाएँ।'
    real_world: 'बंगाल का रसगुल्ला, उत्तर भारत की जलेबी और केरल का पायसम: हर जगह की अपनी मिठाई है।'
  picture:
    kind: compare
    columns:
    - title: मिठाई
      points:
      - रसगुल्ला
      - जलेबी
      - पायसम
    - title: कहाँ प्रसिद्ध
      points:
      - बंगाल / ओडिशा
      - उत्तर भारत
      - केरल
    alt: रसगुल्ला बंगाल और ओडिशा में, जलेबी उत्तर भारत में और पायसम केरल में प्रसिद्ध है।
  activity:
    type: sort
    prompt: मिठाई सम्मेलन में कौन-सी बात सही सीख है?
    bins:
    - अच्छी सीख
    - अच्छी सीख नहीं
    items:
    - label: मिठाई थोड़ी मात्रा में खाएँ
      bin: अच्छी सीख
      clue: बहुत मिठाई से दाँतों और सेहत का क्या?
      why: कम मात्रा में खाना ठीक।
    - label: हर राज्य की अपनी मिठाई
      bin: अच्छी सीख
      clue: भारत में अलग-अलग मिठाइयाँ?
      why: विविधता की पहचान।
    - label: रोज़ ढेर सारी जलेबी खाएँ
      bin: अच्छी सीख नहीं
      clue: रोज़ ज़्यादा मीठा ठीक है?
      why: ज़्यादा मीठा सेहत बिगाड़ता है।
    - label: खाना छोड़कर बस मिठाई
      bin: अच्छी सीख नहीं
      clue: क्या मिठाई से भरपूर पोषण मिलता है?
      why: मिठाई खाने की जगह नहीं ले सकती।
  items:
  - prompt: '''सम्मेलन'' का अर्थ है:'
    options:
    - सभा, मिलकर बैठक
    - झगड़ा
    - दौड़
    - नींद
    answer: सभा, मिलकर बैठक
    difficulty: 1
    hints:
    - सब मिलते हैं।
    - मीटिंग।
    solution: सम्मेलन यानी सभा।
    mistakes:
      झगड़ा: hin4_word
  - prompt: कौन-सी मिठाई गोल-गोल घुमावदार होती है?
    options:
    - जलेबी
    - बर्फ़ी
    - लड्डू
    - रसगुल्ला
    answer: जलेबी
    difficulty: 1
    hints:
    - चाशनी में डूबी।
    - पेंच जैसी।
    solution: जलेबी घुमावदार होती है।
    mistakes: {"बर्फ़ी": "h4_jalebi", "लड्डू": "h4_jalebi", "रसगुल्ला": "h4_jalebi"}
  - prompt: केरल की प्रसिद्ध मीठी खीर कौन-सी है?
    options:
    - पायसम
    - रसमलाई
    - घेवर
    - पेठा
    answer: पायसम
    difficulty: 2
    hints:
    - ओणम सद्या में।
    - खीर जैसी।
    solution: केरल का पायसम प्रसिद्ध है।
    mistakes: {"रसमलाई": "h4_payasam", "घेवर": "h4_payasam", "पेठा": "h4_payasam"}
  - prompt: ज़्यादा मिठाई खाने से क्या होता है?
    options:
    - दाँत और सेहत ख़राब होते हैं
    - हम लंबे हो जाते हैं
    - आँखें तेज़ होती हैं
    - कुछ नहीं होता
    answer: दाँत और सेहत ख़राब होते हैं
    difficulty: 1
    hints:
    - चीनी।
    - दाँतों में कीड़े।
    solution: ज़्यादा मीठा सेहत को नुक़सान पहुँचाता है।
    mistakes:
      कुछ नहीं होता: hin4_lesson
  - prompt: '''मीठा'' का विलोम है:'
    options:
    - कड़वा
    - स्वादिष्ट
    - चीनी
    - गुड़
    answer: कड़वा
    difficulty: 1
    hints:
    - नीम जैसा।
    - उलटा।
    solution: मीठा का विलोम कड़वा है।
    mistakes: {"स्वादिष्ट": "h1_ulta", "चीनी": "h1_ulta", "गुड़": "h1_ulta"}
  - prompt: रसगुल्ला किस राज्य से जुड़ा माना जाता है?
    options:
    - बंगाल / ओडिशा
    - पंजाब
    - राजस्थान
    - कश्मीर
    answer: बंगाल / ओडिशा
    difficulty: 2
    hints:
    - पूर्व भारत।
    - चाशनी वाला सफ़ेद गोला।
    solution: रसगुल्ला बंगाल और ओडिशा से जुड़ा है।
    mistakes: {"पंजाब": "h4_rasgulla", "राजस्थान": "h4_rasgulla", "कश्मीर": "h4_rasgulla"}
