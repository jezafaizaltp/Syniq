subject: cbse4-hin
chapter: 11
title: कविता का कमाल
tips:
  h4_kamaal: "'कमाल कर दिया!' यह हम कब कहते हैं: जब कोई कुछ गलत करे, या जब कुछ हैरान कर देने वाला अच्छा हो?"
  h4_kavi: "चित्र बनाने वाला चित्रकार। कविता लिखने वाले का नाम भी 'कविता' से ही छोटा करके बना है।"
  h4_lay: "कविता को गाकर पढ़ो: पंक्तियों के आखिरी शब्द आपस में कैसे मिलते हैं? गुनगुनाना याद रखने में मदद करता है।"
  h4_pankti: "अपनी किताब में कोई कविता खोलो: शब्द कैसे सजे हैं, एक के नीचे एक?"
  h4_tuk: "तुक में शब्दों का आखिरी हिस्सा एक जैसा बजता है: 'चि-ड़िया'। किसके अंत में भी '-ड़िया' है?"
  c4h11_tuk: दोनों शब्द ज़ोर से बोलो और केवल आख़िरी आवाज़ सुनो।
  c4h11_kavita: 'सोचो: कविता और कहानी लिखने के ढंग में क्या फ़र्क़ है? पंक्तियाँ, तुक, लय।'
  c4h11_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v11.kavita
  title: कविता का कमाल
  notes: |
    'कविता का कमाल' में कविता की ताक़त की बात है: तुक, लय और सुंदर शब्दों से कविता मन को छू लेती है और बातें याद रखना
    आसान बनाती है। ठीक घटनाएँ यहाँ नहीं दी गई हैं। अभ्यास: तुकांत शब्द, लय, कविता और कहानी का फ़र्क़, अपनी छोटी कविता।
  explanations:
    text: कविता में शब्द लय और तुक के साथ आते हैं, इसलिए उसे गाना और याद रखना आसान होता है। एक छोटी-सी कविता भी मन को खुश कर सकती है या कोई बड़ी बात सिखा सकती है। यही कविता का कमाल है।
    visual: 'चित्र बनाइए: एक बच्चा मंच पर कविता सुना रहा है और सामने बैठे सब ताली बजा रहे हैं, ऊपर तुकांत शब्दों के जोड़े: ''चिड़िया-गुड़िया'', ''पानी-नानी''।'
    step_by_step: 1. कविता लय से पढ़ें। 2. पंक्तियों के अंत में तुकांत शब्द खोजें। 3. कविता का भाव समझें। 4. अपने दो तुकांत शब्द जोड़ें।
    real_world: बच्चे गिनती और पहाड़े कविता की तरह गाकर जल्दी याद कर लेते हैं।
  picture:
    kind: compare
    columns:
    - title: कविता
      points:
      - लय और तुक
      - पंक्तियों में
      - गा सकते हैं
    - title: कहानी
      points:
      - घटनाएँ
      - अनुच्छेदों में
      - सुनाते हैं
    alt: कविता में लय और तुक होती है, वह पंक्तियों में होती है और गाई जा सकती है; कहानी में घटनाएँ होती हैं, वह अनुच्छेदों में होती है और सुनाई जाती है।
  activity:
    type: sort
    prompt: कौन-से शब्दों की जोड़ी तुकांत है?
    bins:
    - तुकांत
    - तुकांत नहीं
    items:
    - label: मोर – चोर
      bin: तुकांत
      clue: दोनों के अंत की आवाज़ एक-सी है?
      why: '''-ओर'' दोनों में।'
    - label: रानी – पानी
      bin: तुकांत
      clue: अंत में क्या मिलता है?
      why: '''-आनी'' दोनों में।'
    - label: गाना – खाना
      bin: तुकांत
      clue: अंत में '-आना'?
      why: तुकांत।
    - label: पेड़ – नदी
      bin: तुकांत नहीं
      clue: अंत की आवाज़ मिलती है?
      why: 'अंत अलग: तुक नहीं।'
    - label: घर – फूल
      bin: तुकांत नहीं
      clue: अंत की आवाज़?
      why: तुक नहीं।
  lesson:
    - teach: '''कविता का कमाल'' बताता है कि कविता में जादू जैसी ताक़त होती है। कविता छोटी-छोटी पंक्तियों में लिखी जाती है और उसमें तुक (मिलती आवाज़) और लय (ताल) होती है।'
      check:
        prompt: कविता की पंक्तियाँ कैसी होती हैं?
        options:
        - पंक्तियों में
        - केवल चित्रों में
        - केवल अंकों में
        answer: पंक्तियों में
        why: कविता की छोटी पंक्तियाँ होती हैं।
      ways:
      - style: visual
        teach: कहानी और कविता में क्या फ़र्क़ होता है, साथ रखकर देखो।
        picture:
          kind: compare
          columns:
          - title: कहानी
            points:
            - पैराग्राफ़ में लिखी जाती है
            - बोलकर सुनाई जाती है
          - title: कविता
            points:
            - छोटी पंक्तियों में लिखी जाती है
            - तुक और लय होती है
            - गाई जा सकती है
          alt: कहानी पैराग्राफ़ में लिखी जाती है और बोलकर सुनाई जाती है। कविता छोटी पंक्तियों में लिखी जाती है, उसमें तुक और लय होती है और वह गाई जा सकती है।
      - style: real_world
        teach: रेडियो या टीवी पर कोई विज्ञापन गाना एक बार सुनो, तो वह दिन भर दिमाग़ में घूमता रहता है। वह इसलिए, क्योंकि उसमें तुक और लय होती है, बिल्कुल कविता की तरह।
    - teach: 'तुकांत शब्दों की आख़िरी आवाज़ एक-सी होती है: पानी-नानी, चिड़िया-गुड़िया, मोर-शोर। तुक और लय के कारण कविता जल्दी याद हो जाती है।'
      picture:
        kind: compare
        columns:
        - title: शब्द
          points:
          - पानी
          - मोर
          - रेल
        - title: तुक
          points:
          - नानी
          - शोर
          - खेल
        alt: तुकांत शब्दों के जोड़े।
      check:
        prompt: '''रेल'' से तुक मिलाने वाला शब्द कौन-सा है?'
        options:
        - खेल
        - गाड़ी
        - पटरी
        answer: खेल
        why: दोनों का अंत 'एल' है।
      ways:
      - style: step_by_step
        teach: 'तुक वाला शब्द ढूँढो। पहला: शब्द लो, जैसे ''आम''। दूसरा: उसकी आख़िरी आवाज़ सुनो: ''आम''। तीसरा: ऐसे शब्द सोचो जिनके आख़िर में भी ''आम'' आए: शाम, काम, नाम। चौथा: इन्हें दो पंक्तियों के अंत में रखो।'
      - style: real_world
        teach: मेलों और बाज़ारों में कुछ फेरीवाले तुक मिलाकर आवाज़ लगाते हैं, ताकि लोग रुककर सुनें। तुक वाली बात कान को अच्छी लगती है और याद भी रहती है।
    - teach: कविता लिखने वाले को कवि कहते हैं। कहानी पैराग्राफ़ में चलती है, कविता पंक्तियों में गाई जा सकती है। तुम भी तुकांत शब्द जोड़कर अपनी छोटी कविता बना सकते हो।
      check:
        prompt: कविता और कहानी में एक फ़र्क़ क्या है?
        options:
        - कविता में तुक और लय होती है
        - कहानी में शब्द नहीं होते
        - कविता कभी पढ़ी नहीं जाती
        answer: कविता में तुक और लय होती है
        why: कविता गाई जा सकती है।
      ways:
      - style: visual
        teach: अपनी चार पंक्तियों की छोटी कविता बनाने के कदम।
        picture:
          kind: flow
          steps:
          - एक विषय चुनो, जैसे बारिश
          - उससे जुड़े शब्द लिखो
          - तुक वाले शब्दों के जोड़े बनाओ
          - हर जोड़े से दो पंक्तियाँ बनाओ
          - ताली बजाकर लय में पढ़ो
          alt: एक विषय चुनो, जैसे बारिश। उससे जुड़े शब्द लिखो, तुक वाले शब्दों के जोड़े बनाओ, हर जोड़े से दो पंक्तियाँ बनाओ और ताली बजाकर लय में पढ़ो।
      - style: real_world
        teach: सुभद्रा कुमारी चौहान, सोहनलाल द्विवेदी और हरिवंशराय बच्चन जैसे कवियों ने बच्चों के लिए भी कविताएँ लिखीं, जो आज भी स्कूलों में गाई जाती हैं।
  items:
  - prompt: '''पानी'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - नानी
    - पेड़
    - घर
    - आम
    answer: नानी
    difficulty: 1
    hints:
    - अंत की ध्वनि मिलाएँ।
    - -आनी।
    solution: पानी-नानी तुकांत हैं।
    mistakes:
      पेड़: hin4_word
  - prompt: कविता को याद रखना आसान क्यों होता है?
    options:
    - उसमें लय और तुक होती है
    - वह बहुत लंबी होती है
    - उसमें शब्द नहीं होते
    - वह अंग्रेज़ी में होती है
    answer: उसमें लय और तुक होती है
    difficulty: 1
    hints:
    - गा सकते हैं।
    - धुन।
    solution: लय और तुक से कविता याद रहती है।
    mistakes: {"वह बहुत लंबी होती है": "h4_lay", "उसमें शब्द नहीं होते": "h4_lay", "वह अंग्रेज़ी में होती है": "h4_lay"}
  - prompt: कविता लिखने वाले को क्या कहते हैं?
    options:
    - कवि
    - दर्ज़ी
    - किसान
    - चित्रकार
    answer: कवि
    difficulty: 1
    hints:
    - कविता का लेखक।
    - जैसे दिनकर।
    solution: कविता लिखने वाला कवि है।
    mistakes: {"दर्ज़ी": "h4_kavi", "किसान": "h4_kavi", "चित्रकार": "h4_kavi"}
  - prompt: '''कमाल'' का अर्थ है:'
    options:
    - अद्भुत बात, चमत्कार
    - ग़लती
    - थकान
    - डर
    answer: अद्भुत बात, चमत्कार
    difficulty: 2
    hints:
    - हैरान करने वाला।
    - वाह!
    solution: कमाल यानी अद्भुत बात।
    mistakes: {"ग़लती": "h4_kamaal", "थकान": "h4_kamaal", "डर": "h4_kamaal"}
  - prompt: '''चिड़िया'' से तुक मिलाने वाला शब्द है:'
    options:
    - गुड़िया
    - बादल
    - किताब
    - पहाड़
    answer: गुड़िया
    difficulty: 1
    hints:
    - -इया।
    - खिलौना।
    solution: चिड़िया-गुड़िया तुकांत हैं।
    mistakes: {"बादल": "h4_tuk", "किताब": "h4_tuk", "पहाड़": "h4_tuk"}
  - prompt: कविता किस रूप में लिखी जाती है?
    options:
    - पंक्तियों में
    - केवल एक शब्द में
    - अंकों में
    - चित्रों में ही
    answer: पंक्तियों में
    difficulty: 2
    hints:
    - छोटी-छोटी लाइनें।
    - छंद।
    solution: कविता पंक्तियों में लिखी जाती है।
    mistakes: {"केवल एक शब्द में": "h4_pankti", "अंकों में": "h4_pankti", "चित्रों में ही": "h4_pankti"}
  - prompt: '''मोर'' से तुक मिलाने वाला शब्द है:'
    options:
    - चोर
    - पंख
    - नाच
    answer: चोर
    difficulty: 1
    hints:
    - '''ओर'' की आवाज़ सुनो।'
    - दोनों शब्द ज़ोर से बोलो।
    solution: 'चरण 1: मोर का अंत ''ओर'' है। चरण 2: चोर का अंत भी ''ओर'' है।'
    mistakes:
      पंख: c4h11_tuk
      नाच: c4h11_tuk
  - prompt: '''लय'' का अर्थ है:'
    options:
    - ताल, जिसमें कविता गाई जा सके
    - रंग
    - आवाज़ बंद होना
    answer: ताल, जिसमें कविता गाई जा सके
    difficulty: 2
    hints:
    - कविता पढ़ते समय सिर अपने-आप हिलता है।
    - गाने में भी यह होती है।
    solution: 'चरण 1: कविता में एक ताल चलती है। चरण 2: उसी को लय कहते हैं।'
    mistakes:
      रंग: c4h11_shabd
      आवाज़ बंद होना: c4h11_shabd
  - prompt: कविता का एक हिस्सा (एक लाइन) क्या कहलाता है?
    options:
    - पंक्ति
    - पन्ना
    - किताब
    answer: पंक्ति
    difficulty: 1
    hints:
    - कविता इन्हीं में लिखी जाती है।
    - एक के नीचे एक।
    solution: 'चरण 1: कविता लाइनों में लिखी जाती है। चरण 2: एक लाइन को पंक्ति कहते हैं।'
    mistakes:
      पन्ना: c4h11_kavita
      किताब: c4h11_kavita
  - prompt: '''गाना'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - खाना
    - गीत
    - सुर
    answer: खाना
    difficulty: 1
    hints:
    - '''आना'' की आवाज़ सुनो।'
    - गीत और सुर अर्थ में मिलते हैं, आवाज़ में नहीं।
    solution: 'चरण 1: गाना का अंत ''आना'' है। चरण 2: खाना का अंत भी ''आना'' है।'
    mistakes:
      गीत: c4h11_tuk
      सुर: c4h11_tuk
  - prompt: बच्चे पहाड़े या गिनती कविता की तरह गाकर क्यों याद करते हैं?
    options:
    - लय से याद करना आसान होता है
    - गाना ज़रूरी नियम है
    - इससे गिनती बदल जाती है
    answer: लय से याद करना आसान होता है
    difficulty: 2
    hints:
    - कविता की ताक़त याद करो।
    - गाई हुई चीज़ मन में कैसे बैठती है?
    solution: 'चरण 1: लय और तुक दिमाग़ में जल्दी बैठते हैं। चरण 2: इसलिए गाकर याद करना आसान है।'
    mistakes:
      गाना ज़रूरी नियम है: c4h11_kavita
      इससे गिनती बदल जाती है: c4h11_kavita
  - prompt: '''कवि'' का स्त्रीलिंग शब्द क्या है?'
    options:
    - कवयित्री
    - कविता
    - कवीनी
    answer: कवयित्री
    difficulty: 3
    hints:
    - कविता एक रचना है, व्यक्ति नहीं।
    - महादेवी वर्मा को यही कहते हैं।
    solution: 'चरण 1: कविता रचना का नाम है। चरण 2: कविता लिखने वाली महिला कवयित्री कहलाती है।'
