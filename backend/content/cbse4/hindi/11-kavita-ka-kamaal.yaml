subject: cbse4-hin
chapter: 11
title: कविता का कमाल
tips:
  h4_kamaal: "'कमाल कर दिया!' यह हम कब कहते हैं: जब कोई कुछ गलत करे, या जब कुछ हैरान कर देने वाला अच्छा हो?"
  h4_kavi: "चित्र बनाने वाला चित्रकार। कविता लिखने वाले का नाम भी 'कविता' से ही छोटा करके बना है।"
  h4_lay: "कविता को गाकर पढ़ो: पंक्तियों के आखिरी शब्द आपस में कैसे मिलते हैं? गुनगुनाना याद रखने में मदद करता है।"
  h4_pankti: "अपनी किताब में कोई कविता खोलो: शब्द कैसे सजे हैं, एक के नीचे एक?"
  h4_tuk: "तुक में शब्दों का आखिरी हिस्सा एक जैसा बजता है: 'चि-ड़िया'। किसके अंत में भी '-ड़िया' है?"

concepts:
- code: cbse4h.v11.kavita
  title: कविता का कमाल
  notes: |
    'कविता का कमाल' में कविता की ताक़त की बात है: तुक, लय और सुंदर शब्दों से कविता मन को छू लेती है और बातें याद रखना
    आसान बनाती है। ठीक घटनाएँ यहाँ नहीं दी गई हैं। अभ्यास: तुकांत शब्द, लय, कविता और कहानी का फ़र्क़, अपनी छोटी कविता।
  explanations:
    text: कविता में शब्द लय और तुक के साथ आते हैं, इसलिए उसे गाना और याद रखना आसान होता है। एक छोटी-सी कविता भी मन को खुश कर सकती है या कोई बड़ी बात सिखा सकती है। यही कविता का कमाल है।
    visual: 'चित्र बनाइए: एक बच्चा मंच पर कविता सुना रहा है और सामने बैठे सब ताली बजा रहे हैं, ऊपर तुकांत शब्दों के जोड़े: ''चिड़िया-गुड़िया'', ''पानी-नानी''।'
    step_by_step: 1. कविता लय से पढ़ें। 2. पंक्तियों के अंत में तुकांत शब्द खोजें। 3. कविता का भाव समझें। 4. अपने दो तुकांत शब्द जोड़ें।
    real_world: बच्चे गिनती और पहाड़े कविता की तरह गाकर जल्दी याद कर लेते हैं।
  picture:
    kind: compare
    columns:
    - title: कविता
      points:
      - लय और तुक
      - पंक्तियों में
      - गा सकते हैं
    - title: कहानी
      points:
      - घटनाएँ
      - अनुच्छेदों में
      - सुनाते हैं
    alt: कविता में लय और तुक होती है, वह पंक्तियों में होती है और गाई जा सकती है; कहानी में घटनाएँ होती हैं, वह अनुच्छेदों में होती है और सुनाई जाती है।
  activity:
    type: sort
    prompt: कौन-से शब्दों की जोड़ी तुकांत है?
    bins:
    - तुकांत
    - तुकांत नहीं
    items:
    - label: मोर – चोर
      bin: तुकांत
      clue: दोनों के अंत की आवाज़ एक-सी है?
      why: '''-ओर'' दोनों में।'
    - label: रानी – पानी
      bin: तुकांत
      clue: अंत में क्या मिलता है?
      why: '''-आनी'' दोनों में।'
    - label: गाना – खाना
      bin: तुकांत
      clue: अंत में '-आना'?
      why: तुकांत।
    - label: पेड़ – नदी
      bin: तुकांत नहीं
      clue: अंत की आवाज़ मिलती है?
      why: 'अंत अलग: तुक नहीं।'
    - label: घर – फूल
      bin: तुकांत नहीं
      clue: अंत की आवाज़?
      why: तुक नहीं।
  items:
  - prompt: '''पानी'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - नानी
    - पेड़
    - घर
    - आम
    answer: नानी
    difficulty: 1
    hints:
    - अंत की ध्वनि मिलाएँ।
    - -आनी।
    solution: पानी-नानी तुकांत हैं।
    mistakes:
      पेड़: hin4_word
  - prompt: कविता को याद रखना आसान क्यों होता है?
    options:
    - उसमें लय और तुक होती है
    - वह बहुत लंबी होती है
    - उसमें शब्द नहीं होते
    - वह अंग्रेज़ी में होती है
    answer: उसमें लय और तुक होती है
    difficulty: 1
    hints:
    - गा सकते हैं।
    - धुन।
    solution: लय और तुक से कविता याद रहती है।
    mistakes: {"वह बहुत लंबी होती है": "h4_lay", "उसमें शब्द नहीं होते": "h4_lay", "वह अंग्रेज़ी में होती है": "h4_lay"}
  - prompt: कविता लिखने वाले को क्या कहते हैं?
    options:
    - कवि
    - दर्ज़ी
    - किसान
    - चित्रकार
    answer: कवि
    difficulty: 1
    hints:
    - कविता का लेखक।
    - जैसे दिनकर।
    solution: कविता लिखने वाला कवि है।
    mistakes: {"दर्ज़ी": "h4_kavi", "किसान": "h4_kavi", "चित्रकार": "h4_kavi"}
  - prompt: '''कमाल'' का अर्थ है:'
    options:
    - अद्भुत बात, चमत्कार
    - ग़लती
    - थकान
    - डर
    answer: अद्भुत बात, चमत्कार
    difficulty: 2
    hints:
    - हैरान करने वाला।
    - वाह!
    solution: कमाल यानी अद्भुत बात।
    mistakes: {"ग़लती": "h4_kamaal", "थकान": "h4_kamaal", "डर": "h4_kamaal"}
  - prompt: '''चिड़िया'' से तुक मिलाने वाला शब्द है:'
    options:
    - गुड़िया
    - बादल
    - किताब
    - पहाड़
    answer: गुड़िया
    difficulty: 1
    hints:
    - -इया।
    - खिलौना।
    solution: चिड़िया-गुड़िया तुकांत हैं।
    mistakes: {"बादल": "h4_tuk", "किताब": "h4_tuk", "पहाड़": "h4_tuk"}
  - prompt: कविता किस रूप में लिखी जाती है?
    options:
    - पंक्तियों में
    - केवल एक शब्द में
    - अंकों में
    - चित्रों में ही
    answer: पंक्तियों में
    difficulty: 2
    hints:
    - छोटी-छोटी लाइनें।
    - छंद।
    solution: कविता पंक्तियों में लिखी जाती है।
    mistakes: {"केवल एक शब्द में": "h4_pankti", "अंकों में": "h4_pankti", "चित्रों में ही": "h4_pankti"}
