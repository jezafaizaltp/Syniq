subject: cbse4-hin
chapter: 13
title: हमारा आदित्य
tips:
  h4_chand_mission: "आदित्य सूरज के लिए है, मंगलयान मंगल के लिए, गगनयान इंसानों को अंतरिक्ष ले जाएगा। किस मिशन के नाम में चाँद का संस्कृत शब्द है?"
  h4_aditya: "'आदित्य' सूरज का एक नाम है, जैसे 'रवि' और 'दिनकर'।"
  h4_aditya_varsh: "1947 में भारत आज़ाद हुआ था; तब अंतरिक्ष यान नहीं थे। आदित्य हाल का मिशन है, उसी साल गया जब चंद्रयान-3 चाँद पर उतरा।"
  h4_isro_bharat: "नासा अमेरिका की संस्था है। 'हमारा आदित्य' भारत का है, तो भारत की अंतरिक्ष संस्था कौन-सी?"
  c4h13_mission: 'आदित्य-एल1 की बातें याद करो: किसने भेजा, कब भेजा, कहाँ रहता है, किसे देखता है।'
  c4h13_surya: 'सोचो: सूरज हमें क्या देता है, और उसे सीधे देखना क्यों ख़तरनाक है?'
  c4h13_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v13.aditya
  title: हमारा आदित्य
  notes: |
    इसरो (भारतीय अंतरिक्ष अनुसंधान संगठन) के सूर्य मिशन 'आदित्य-एल1' पर पाठ। 'आदित्य' सूर्य का एक नाम है। यह भारत का
    पहला सूर्य अध्ययन मिशन है, 2 सितंबर 2023 को श्रीहरिकोटा से छोड़ा गया। यह धरती से लगभग 15 लाख किलोमीटर दूर 'एल1'
    बिंदु के पास रहकर सूर्य को लगातार देखता है। सूर्य को सीधे आँखों से कभी नहीं देखना चाहिए।
  explanations:
    text: आदित्य-एल1 भारत का पहला यान है जो सूर्य का अध्ययन करता है। 'आदित्य' सूर्य का ही एक नाम है। इसरो ने इसे 2023 में भेजा। यह धरती से लगभग 15 लाख किलोमीटर दूर रहकर सूर्य को लगातार देखता है।
    visual: 'चित्र बनाइए: बीच में बड़ा सूरज, एक ओर छोटी धरती, और दोनों के बीच धरती के पास ''एल1'' पर एक छोटा अंतरिक्ष यान।'
    step_by_step: '1. मिशन का नाम: आदित्य-एल1। 2. किसने भेजा? इसरो। 3. कब? 2023। 4. क्या करता है? सूर्य का अध्ययन।'
    real_world: चंद्रयान-3 ने चाँद पर और आदित्य-एल1 ने सूर्य की ओर जाकर भारत का नाम रोशन किया।
  picture:
    kind: flow
    steps:
    - श्रीहरिकोटा से उड़ान (2023)
    - धरती से दूर यात्रा
    - एल1 बिंदु पर पहुँचा
    - सूर्य को लगातार देखता है
    alt: आदित्य-एल1 2023 में श्रीहरिकोटा से उड़ा, धरती से दूर यात्रा करके एल1 बिंदु पर पहुँचा, और वहाँ से सूर्य को लगातार देखता है।
  activity:
    type: sort
    prompt: आदित्य-एल1 के बारे में कौन-सी बात सही है?
    bins:
    - सही
    - सही नहीं
    items:
    - label: सूर्य का अध्ययन करता है
      bin: सही
      clue: '''आदित्य'' किसका नाम है?'
      why: आदित्य = सूर्य; सूर्य मिशन।
    - label: श्रीहरिकोटा से छोड़ा गया
      bin: सही
      clue: इसरो अपने यान कहाँ से छोड़ता है?
      why: श्रीहरिकोटा।
    - label: लगभग 15 लाख किमी दूर एल1 के पास
      bin: सही
      clue: यह सूरज तक जाता है या बीच में रुकता है?
      why: एल1 बिंदु के पास से देखता है।
    - label: चाँद पर उतरा
      bin: सही नहीं
      clue: चाँद पर कौन-सा यान उतरा था?
      why: वह चंद्रयान-3 था।
    - label: सूर्य को सीधे आँखों से देखना ठीक
      bin: सही नहीं
      clue: पाठ इसके बारे में क्या चेतावनी देता है?
      why: सूर्य को कभी सीधे नहीं देखना।
  lesson:
    - teach: '''आदित्य'' सूर्य का एक नाम है। आदित्य-एल1 भारत का पहला सूर्य अध्ययन मिशन है। इसे इसरो (भारतीय अंतरिक्ष अनुसंधान संगठन) ने 2 सितंबर 2023 को श्रीहरिकोटा से भेजा।'
      check:
        prompt: आदित्य-एल1 को किस जगह से छोड़ा गया?
        options:
        - श्रीहरिकोटा
        - दिल्ली
        - मुंबई
        answer: श्रीहरिकोटा
        why: इसरो के रॉकेट श्रीहरिकोटा से छोड़े जाते हैं।
      ways:
      - style: visual
        teach: आदित्य-एल1 की यात्रा, धरती से एल1 तक, क्रम से।
        picture:
          kind: flow
          steps:
          - श्रीहरिकोटा से रॉकेट उड़ा
          - पहले यान धरती के चारों ओर घूमा
          - फिर एल1 बिंदु की ओर चल पड़ा
          - कई महीनों बाद एल1 के पास पहुँचा
          - वहाँ से सूरज को देखने लगा
          alt: श्रीहरिकोटा से रॉकेट उड़ा। पहले यान धरती के चारों ओर घूमा, फिर एल1 बिंदु की ओर चल पड़ा, कई महीनों बाद वहाँ पहुँचा और सूरज को देखने लगा।
      - style: real_world
        teach: श्रीहरिकोटा आंध्र प्रदेश में समुद्र के किनारे एक टापू है। भारत के बहुत से रॉकेट, जैसे चंद्रयान वाले, यहीं से उड़ते हैं।
    - teach: आदित्य-एल1 धरती से लगभग 15 लाख किलोमीटर दूर 'एल1' नाम के बिंदु के पास रहता है। वहाँ से वह बिना रुके सूरज को लगातार देख सकता है, कोई ग्रहण या रात बीच में नहीं आती।
      picture:
        kind: flow
        steps:
        - श्रीहरिकोटा से उड़ान
        - धरती से दूर यात्रा
        - एल1 बिंदु पर पहुँचना
        - सूरज को लगातार देखना
        alt: 'आदित्य-एल1 की यात्रा: उड़ान से एल1 तक और फिर सूरज का अध्ययन।'
      check:
        prompt: एल1 बिंदु से आदित्य क्या कर सकता है?
        options:
        - सूरज को बिना रुके देखना
        - चाँद पर उतरना
        - समुद्र में तैरना
        answer: सूरज को बिना रुके देखना
        why: वहाँ से सूरज कभी छिपता नहीं।
      ways:
      - style: step_by_step
        teach: 'समझो एल1 से सूरज लगातार क्यों दिखता है। पहला: धरती घूमती है, इसलिए धरती पर रात होती है और सूरज छिप जाता है। दूसरा: एल1 धरती से बहुत दूर, सूरज की ओर है। तीसरा: वहाँ धरती की छाया नहीं पहुँचती। चौथा: इसलिए वहाँ रहने वाला यान बिना रुके सूरज को देख सकता है।'
      - style: real_world
        teach: जब तुम खिड़की के पास पढ़ते हो और कोई सामने आकर खड़ा हो जाए, तो रोशनी रुक जाती है। धरती पर भी रात में धरती ख़ुद बीच में आ जाती है। एल1 पर कोई बीच में नहीं आता।
    - teach: 'सूरज हमें रोशनी और गर्मी देता है। उसकी आँधियाँ (सौर तूफ़ान) उपग्रहों को नुकसान पहुँचा सकती हैं, इसलिए उसका अध्ययन ज़रूरी है। याद रखो: सूरज को कभी सीधे आँखों से मत देखो।'
      check:
        prompt: सूरज को सीधे क्यों नहीं देखना चाहिए?
        options:
        - आँखों को नुकसान होता है
        - सूरज नाराज़ होता है
        - सूरज छिप जाता है
        answer: आँखों को नुकसान होता है
        why: तेज़ रोशनी आँखों के लिए ख़तरनाक है।
      ways:
      - style: visual
        teach: सूरज से हमें क्या मिलता है, और उसकी आँधियों से क्या ख़तरा है।
        picture:
          kind: compare
          columns:
          - title: सूरज देता है
            points:
            - रोशनी
            - गर्मी
            - पौधों को भोजन बनाने की ताक़त
          - title: सौर तूफ़ान से ख़तरा
            points:
            - उपग्रह ख़राब हो सकते हैं
            - मोबाइल और जीपीएस में गड़बड़
            - बिजली की लाइनों पर असर
          alt: सूरज हमें रोशनी, गर्मी और पौधों को भोजन बनाने की ताक़त देता है। सौर तूफ़ान से उपग्रह ख़राब हो सकते हैं, मोबाइल और जीपीएस में गड़बड़ हो सकती है और बिजली की लाइनों पर असर पड़ सकता है।
      - style: real_world
        teach: जैसे मौसम विभाग बारिश या आँधी की पहले से ख़बर देता है, वैसे ही सूरज को देखते रहने से वैज्ञानिक सौर तूफ़ान की पहले से चेतावनी दे सकते हैं, ताकि उपग्रहों को बचाया जा सके।
  items:
  - prompt: '''आदित्य'' किसका नाम है?'
    options:
    - सूर्य
    - चाँद
    - तारा
    - धरती
    answer: सूर्य
    difficulty: 1
    hints:
    - सूरज के कई नाम हैं।
    - दिनकर, भास्कर, आदित्य।
    solution: आदित्य सूर्य का एक नाम है।
    mistakes:
      चाँद: hin4_word
  - prompt: आदित्य-एल1 किसका अध्ययन करता है?
    options:
    - सूर्य
    - चाँद
    - समुद्र
    - पहाड़
    answer: सूर्य
    difficulty: 1
    hints:
    - नाम में ही है।
    - सूरज।
    solution: आदित्य-एल1 सूर्य का अध्ययन करता है।
    mistakes: {"चाँद": "h4_aditya", "समुद्र": "h4_aditya", "पहाड़": "h4_aditya"}
  - prompt: आदित्य-एल1 किस संस्था ने भेजा?
    options:
    - इसरो
    - नासा
    - रेलवे
    - डाकघर
    answer: इसरो
    difficulty: 1
    hints:
    - भारत की अंतरिक्ष संस्था।
    - बेंगलुरु।
    solution: इसे इसरो ने भेजा।
    mistakes: {"नासा": "h4_isro_bharat", "रेलवे": "h4_isro_bharat", "डाकघर": "h4_isro_bharat"}
  - prompt: आदित्य-एल1 किस वर्ष भेजा गया?
    options:
    - '2023'
    - '1947'
    - '2000'
    - '1990'
    answer: '2023'
    difficulty: 2
    hints:
    - चंद्रयान-3 वाले साल।
    - हाल ही में।
    solution: यह 2023 में भेजा गया।
    mistakes: {"1947": "h4_aditya_varsh", "2000": "h4_aditya_varsh", "1990": "h4_aditya_varsh"}
  - prompt: सूर्य को कभी कैसे नहीं देखना चाहिए?
    options:
    - सीधे आँखों से
    - चित्र में
    - किताब में
    - टीवी पर
    answer: सीधे आँखों से
    difficulty: 1
    hints:
    - बहुत तेज़ रोशनी।
    - आँखें।
    solution: सूर्य को सीधे आँखों से देखने से आँखें ख़राब हो सकती हैं।
    mistakes:
      किताब में: hin4_lesson
  - prompt: भारत का चाँद पर उतरने वाला मिशन कौन-सा है?
    options:
    - चंद्रयान-3
    - आदित्य-एल1
    - गगनयान
    - मंगलयान
    answer: चंद्रयान-3
    difficulty: 2
    hints:
    - चंद्र = चाँद।
    - 2023।
    solution: चंद्रयान-3 चाँद पर उतरा।
    mistakes: {"आदित्य-एल1": "h4_chand_mission", "गगनयान": "h4_chand_mission", "मंगलयान": "h4_chand_mission"}
  - prompt: इसरो का पूरा नाम क्या है?
    options:
    - "भारतीय अंतरिक्ष अनुसंधान संगठन"
    - "भारतीय रेल और यात्री संगठन"
    - "भारतीय खेल और व्यायाम संघ"
    answer: भारतीय अंतरिक्ष अनुसंधान संगठन
    difficulty: 2
    hints:
    - यह संस्था रॉकेट और उपग्रह भेजती है।
    - नाम में 'अंतरिक्ष' है।
    solution: 'चरण 1: इसरो अंतरिक्ष का काम करता है। चरण 2: पूरा नाम भारतीय अंतरिक्ष अनुसंधान संगठन है।'
    mistakes:
      "भारतीय रेल और यात्री संगठन": c4h13_mission
      "भारतीय खेल और व्यायाम संघ": c4h13_mission
  - prompt: '''सूर्य'' का समान अर्थ वाला शब्द कौन-सा है?'
    options:
    - रवि
    - चंद्र
    - तारा
    answer: रवि
    difficulty: 2
    hints:
    - '''आदित्य'' भी इसका नाम है।'
    - रविवार इसी के नाम पर है।
    solution: 'चरण 1: रविवार = सूर्य का दिन। चरण 2: सूर्य का समान शब्द रवि है।'
    mistakes:
      चंद्र: c4h13_shabd
      तारा: c4h13_shabd
  - prompt: सूरज हमें क्या देता है?
    options:
    - रोशनी और गर्मी
    - बर्फ़
    - अँधेरा
    answer: रोशनी और गर्मी
    difficulty: 1
    hints:
    - दिन में उजाला किससे होता है?
    - धूप में बैठकर कैसा लगता है?
    solution: 'चरण 1: दिन का उजाला सूरज से है। चरण 2: धूप गर्मी भी देती है।'
    mistakes:
      बर्फ़: c4h13_surya
      अँधेरा: c4h13_surya
  - prompt: '''अंतरिक्ष'' का अर्थ है:'
    options:
    - "धरती से बहुत ऊपर का खुला आकाश, जहाँ ग्रह-तारे हैं"
    - "ज़मीन के बहुत नीचे की वह जगह जहाँ पानी बहता है"
    - "समुद्र का सबसे गहरा तल, जहाँ मछलियाँ रहती हैं"
    answer: धरती से बहुत ऊपर का खुला आकाश, जहाँ ग्रह-तारे हैं
    difficulty: 2
    hints:
