subject: cbse4-hin
chapter: 13
title: हमारा आदित्य
concepts:
- code: cbse4h.v13.aditya
  title: हमारा आदित्य
  notes: |
    इसरो (भारतीय अंतरिक्ष अनुसंधान संगठन) के सूर्य मिशन 'आदित्य-एल1' पर पाठ। 'आदित्य' सूर्य का एक नाम है। यह भारत का
    पहला सूर्य अध्ययन मिशन है, 2 सितंबर 2023 को श्रीहरिकोटा से छोड़ा गया। यह धरती से लगभग 15 लाख किलोमीटर दूर 'एल1'
    बिंदु के पास रहकर सूर्य को लगातार देखता है। सूर्य को सीधे आँखों से कभी नहीं देखना चाहिए।
  explanations:
    text: आदित्य-एल1 भारत का पहला यान है जो सूर्य का अध्ययन करता है। 'आदित्य' सूर्य का ही एक नाम है। इसरो ने इसे 2023 में भेजा। यह धरती से लगभग 15 लाख किलोमीटर दूर रहकर सूर्य को लगातार देखता है।
    visual: 'चित्र बनाइए: बीच में बड़ा सूरज, एक ओर छोटी धरती, और दोनों के बीच धरती के पास ''एल1'' पर एक छोटा अंतरिक्ष यान।'
    step_by_step: '1. मिशन का नाम: आदित्य-एल1। 2. किसने भेजा? इसरो। 3. कब? 2023। 4. क्या करता है? सूर्य का अध्ययन।'
    real_world: चंद्रयान-3 ने चाँद पर और आदित्य-एल1 ने सूर्य की ओर जाकर भारत का नाम रोशन किया।
  picture:
    kind: flow
    steps:
    - श्रीहरिकोटा से उड़ान (2023)
    - धरती से दूर यात्रा
    - एल1 बिंदु पर पहुँचा
    - सूर्य को लगातार देखता है
    alt: आदित्य-एल1 2023 में श्रीहरिकोटा से उड़ा, धरती से दूर यात्रा करके एल1 बिंदु पर पहुँचा, और वहाँ से सूर्य को लगातार देखता है।
  items:
  - prompt: '''आदित्य'' किसका नाम है?'
    options:
    - सूर्य
    - चाँद
    - तारा
    - धरती
    answer: सूर्य
    difficulty: 1
    hints:
    - सूरज के कई नाम हैं।
    - दिनकर, भास्कर, आदित्य।
    solution: आदित्य सूर्य का एक नाम है।
    mistakes:
      चाँद: hin4_word
  - prompt: आदित्य-एल1 किसका अध्ययन करता है?
    options:
    - सूर्य
    - चाँद
    - समुद्र
    - पहाड़
    answer: सूर्य
    difficulty: 1
    hints:
    - नाम में ही है।
    - सूरज।
    solution: आदित्य-एल1 सूर्य का अध्ययन करता है।
  - prompt: आदित्य-एल1 किस संस्था ने भेजा?
    options:
    - इसरो
    - नासा
    - रेलवे
    - डाकघर
    answer: इसरो
    difficulty: 1
    hints:
    - भारत की अंतरिक्ष संस्था।
    - बेंगलुरु।
    solution: इसे इसरो ने भेजा।
  - prompt: आदित्य-एल1 किस वर्ष भेजा गया?
    options:
    - '2023'
    - '1947'
    - '2000'
    - '1990'
    answer: '2023'
    difficulty: 2
    hints:
    - चंद्रयान-3 वाले साल।
    - हाल ही में।
    solution: यह 2023 में भेजा गया।
  - prompt: सूर्य को कभी कैसे नहीं देखना चाहिए?
    options:
    - सीधे आँखों से
    - चित्र में
    - किताब में
    - टीवी पर
    answer: सीधे आँखों से
    difficulty: 1
    hints:
    - बहुत तेज़ रोशनी।
    - आँखें।
    solution: सूर्य को सीधे आँखों से देखने से आँखें ख़राब हो सकती हैं।
    mistakes:
      किताब में: hin4_lesson
  - prompt: भारत का चाँद पर उतरने वाला मिशन कौन-सा है?
    options:
    - चंद्रयान-3
    - आदित्य-एल1
    - गगनयान
    - मंगलयान
    answer: चंद्रयान-3
    difficulty: 2
    hints:
    - चंद्र = चाँद।
    - 2023।
    solution: चंद्रयान-3 चाँद पर उतरा।
