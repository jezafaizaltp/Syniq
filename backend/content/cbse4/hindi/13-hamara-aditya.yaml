subject: cbse4-hin
chapter: 13
title: हमारा आदित्य
tips:
  h4_chand_mission: "आदित्य सूरज के लिए है, मंगलयान मंगल के लिए, गगनयान इंसानों को अंतरिक्ष ले जाएगा। किस मिशन के नाम में चाँद का संस्कृत शब्द है?"
  h4_aditya: "'आदित्य' सूरज का एक नाम है, जैसे 'रवि' और 'दिनकर'।"
  h4_aditya_varsh: "1947 में भारत आज़ाद हुआ था; तब अंतरिक्ष यान नहीं थे। आदित्य हाल का मिशन है, उसी साल गया जब चंद्रयान-3 चाँद पर उतरा।"
  h4_isro_bharat: "नासा अमेरिका की संस्था है। 'हमारा आदित्य' भारत का है, तो भारत की अंतरिक्ष संस्था कौन-सी?"

concepts:
- code: cbse4h.v13.aditya
  title: हमारा आदित्य
  notes: |
    इसरो (भारतीय अंतरिक्ष अनुसंधान संगठन) के सूर्य मिशन 'आदित्य-एल1' पर पाठ। 'आदित्य' सूर्य का एक नाम है। यह भारत का
    पहला सूर्य अध्ययन मिशन है, 2 सितंबर 2023 को श्रीहरिकोटा से छोड़ा गया। यह धरती से लगभग 15 लाख किलोमीटर दूर 'एल1'
    बिंदु के पास रहकर सूर्य को लगातार देखता है। सूर्य को सीधे आँखों से कभी नहीं देखना चाहिए।
  explanations:
    text: आदित्य-एल1 भारत का पहला यान है जो सूर्य का अध्ययन करता है। 'आदित्य' सूर्य का ही एक नाम है। इसरो ने इसे 2023 में भेजा। यह धरती से लगभग 15 लाख किलोमीटर दूर रहकर सूर्य को लगातार देखता है।
    visual: 'चित्र बनाइए: बीच में बड़ा सूरज, एक ओर छोटी धरती, और दोनों के बीच धरती के पास ''एल1'' पर एक छोटा अंतरिक्ष यान।'
    step_by_step: '1. मिशन का नाम: आदित्य-एल1। 2. किसने भेजा? इसरो। 3. कब? 2023। 4. क्या करता है? सूर्य का अध्ययन।'
    real_world: चंद्रयान-3 ने चाँद पर और आदित्य-एल1 ने सूर्य की ओर जाकर भारत का नाम रोशन किया।
  picture:
    kind: flow
    steps:
    - श्रीहरिकोटा से उड़ान (2023)
    - धरती से दूर यात्रा
    - एल1 बिंदु पर पहुँचा
    - सूर्य को लगातार देखता है
    alt: आदित्य-एल1 2023 में श्रीहरिकोटा से उड़ा, धरती से दूर यात्रा करके एल1 बिंदु पर पहुँचा, और वहाँ से सूर्य को लगातार देखता है।
  activity:
    type: sort
    prompt: आदित्य-एल1 के बारे में कौन-सी बात सही है?
    bins:
    - सही
    - सही नहीं
    items:
    - label: सूर्य का अध्ययन करता है
      bin: सही
      clue: '''आदित्य'' किसका नाम है?'
      why: आदित्य = सूर्य; सूर्य मिशन।
    - label: श्रीहरिकोटा से छोड़ा गया
      bin: सही
      clue: इसरो अपने यान कहाँ से छोड़ता है?
      why: श्रीहरिकोटा।
    - label: लगभग 15 लाख किमी दूर एल1 के पास
      bin: सही
      clue: यह सूरज तक जाता है या बीच में रुकता है?
      why: एल1 बिंदु के पास से देखता है।
    - label: चाँद पर उतरा
      bin: सही नहीं
      clue: चाँद पर कौन-सा यान उतरा था?
      why: वह चंद्रयान-3 था।
    - label: सूर्य को सीधे आँखों से देखना ठीक
      bin: सही नहीं
      clue: पाठ इसके बारे में क्या चेतावनी देता है?
      why: सूर्य को कभी सीधे नहीं देखना।
  items:
  - prompt: '''आदित्य'' किसका नाम है?'
    options:
    - सूर्य
    - चाँद
    - तारा
    - धरती
    answer: सूर्य
    difficulty: 1
    hints:
    - सूरज के कई नाम हैं।
    - दिनकर, भास्कर, आदित्य।
    solution: आदित्य सूर्य का एक नाम है।
    mistakes:
      चाँद: hin4_word
  - prompt: आदित्य-एल1 किसका अध्ययन करता है?
    options:
    - सूर्य
    - चाँद
    - समुद्र
    - पहाड़
    answer: सूर्य
    difficulty: 1
    hints:
    - नाम में ही है।
    - सूरज।
    solution: आदित्य-एल1 सूर्य का अध्ययन करता है।
    mistakes: {"चाँद": "h4_aditya", "समुद्र": "h4_aditya", "पहाड़": "h4_aditya"}
  - prompt: आदित्य-एल1 किस संस्था ने भेजा?
    options:
    - इसरो
    - नासा
    - रेलवे
    - डाकघर
    answer: इसरो
    difficulty: 1
    hints:
    - भारत की अंतरिक्ष संस्था।
    - बेंगलुरु।
    solution: इसे इसरो ने भेजा।
    mistakes: {"नासा": "h4_isro_bharat", "रेलवे": "h4_isro_bharat", "डाकघर": "h4_isro_bharat"}
  - prompt: आदित्य-एल1 किस वर्ष भेजा गया?
    options:
    - '2023'
    - '1947'
    - '2000'
    - '1990'
    answer: '2023'
    difficulty: 2
    hints:
    - चंद्रयान-3 वाले साल।
    - हाल ही में।
    solution: यह 2023 में भेजा गया।
    mistakes: {"1947": "h4_aditya_varsh", "2000": "h4_aditya_varsh", "1990": "h4_aditya_varsh"}
  - prompt: सूर्य को कभी कैसे नहीं देखना चाहिए?
    options:
    - सीधे आँखों से
    - चित्र में
    - किताब में
    - टीवी पर
    answer: सीधे आँखों से
    difficulty: 1
    hints:
    - बहुत तेज़ रोशनी।
    - आँखें।
    solution: सूर्य को सीधे आँखों से देखने से आँखें ख़राब हो सकती हैं।
    mistakes:
      किताब में: hin4_lesson
  - prompt: भारत का चाँद पर उतरने वाला मिशन कौन-सा है?
    options:
    - चंद्रयान-3
    - आदित्य-एल1
    - गगनयान
    - मंगलयान
    answer: चंद्रयान-3
    difficulty: 2
    hints:
    - चंद्र = चाँद।
    - 2023।
    solution: चंद्रयान-3 चाँद पर उतरा।
    mistakes: {"आदित्य-एल1": "h4_chand_mission", "गगनयान": "h4_chand_mission", "मंगलयान": "h4_chand_mission"}
