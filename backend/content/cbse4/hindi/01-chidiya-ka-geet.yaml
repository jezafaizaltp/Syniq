subject: cbse4-hin
chapter: 1
title: चिड़िया का गीत
tips:
  h4_koyal_bol: "कोयल की आवाज़ मीठी और लंबी होती है। काँव-काँव तो कौआ करता है; कोयल की कूक कैसी सुनाई देती है?"
  hin4_read_again: पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है।
  hin4_word: शब्द को अपने वाक्य में बोलकर देखें। क्या अर्थ ठीक बैठता है?
  hin4_lesson: 'सोचें: इस पाठ से हमें क्या सीख मिलती है?'
  h4_chugna: "'चुगना' मतलब चोंच से एक-एक करके खाना। आँगन में बिखेरे गए छोटे-छोटे अनाज को क्या कहते हैं?"
  h4_geet: "'गीत' को 'संगीत' में ढूँढो। गीत गाया जाता है, खाया या पिया नहीं जाता।"
  h4_geet_bhav: "सुबह चिड़ियों की चहचहाहट सुनकर तुम्हारा मन कैसा हो जाता है?"
  c4h1_pakshi: 'सोचो: सुबह पेड़ पर चिड़िया क्या-क्या करती है? वह कहाँ रहती है, क्या खाती है, कैसे बोलती है?'
  c4h1_tuk: दोनों शब्द ज़ोर से बोलो और सिर्फ़ आख़िरी आवाज़ सुनो।
  c4h1_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?
concepts:
- code: cbse4h.v1.chidiya
  title: चिड़िया का गीत
  notes: |
    चिड़िया के गीत पर एक कविता। सुबह चिड़ियाँ चहचहाती हैं, पेड़ों पर घोंसले बनाती हैं, दाना चुगती हैं और आसमान में उड़ती हैं।
    कविता प्रकृति की सुंदरता और खुशी का भाव जगाती है। (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: पक्षियों के नाम,
    तुकांत शब्द, ध्वनि शब्द (चीं-चीं, कुहू-कुहू)।
  explanations:
    text: सुबह-सुबह चिड़ियाँ मीठे गीत गाती हैं। वे पेड़ों पर घोंसला बनाती हैं, दाना चुगती हैं और आसमान में उड़ती हैं। उनका गीत सुनकर मन खुश हो जाता है।
    visual: 'चित्र बनाइए: पेड़ की डाल पर घोंसला, उसमें चिड़िया के बच्चे, और ऊपर उड़ती चिड़िया जिसके मुँह से संगीत के निशान निकल रहे हैं।'
    step_by_step: '1. कविता लय से पढ़ें। 2. चिड़िया क्या-क्या करती है? 3. तुकांत शब्द खोजें। 4. कविता का भाव: खुशी।'
    real_world: गाँव में सुबह कोयल की कुहू-कुहू और गौरैया की चीं-चीं सुनाई देती है।
  picture:
    kind: compare
    columns:
    - title: पक्षी
      points:
      - कोयल
      - गौरैया
      - कौआ
    - title: आवाज़
      points:
      - कुहू-कुहू
      - चीं-चीं
      - काँव-काँव
    alt: कोयल कुहू-कुहू, गौरैया चीं-चीं और कौआ काँव-काँव करता है।
  activity:
    type: sort
    prompt: कौन-सी आवाज़ किसकी है?
    bins:
    - चिड़िया
    - कोयल
    - कौआ
    items:
    - label: चीं-चीं
      bin: चिड़िया
      clue: छोटी चिड़िया कैसे बोलती है?
      why: चिड़िया चीं-चीं करती है।
    - label: कुहू-कुहू
      bin: कोयल
      clue: आम के पेड़ पर मीठा कौन गाता है?
      why: कोयल कुहू-कुहू गाती है।
    - label: काँव-काँव
      bin: कौआ
      clue: काला पक्षी कैसे बोलता है?
      why: कौआ काँव-काँव करता है।
    - label: चूँ-चूँ
      bin: चिड़िया
      clue: यह छोटी चिड़िया जैसी आवाज़ है?
      why: चिड़िया की आवाज़।
  lesson:
    - teach: '''चिड़िया का गीत'' कविता में सुबह की चिड़ियों की बात है। चिड़ियाँ सुबह चहचहाती हैं, पेड़ पर घोंसला बनाती हैं, दाना चुगती हैं और आसमान में उड़ती हैं।'
      check:
        prompt: चिड़िया सुबह क्या करती है?
        options:
        - चहचहाती है
        - सो जाती है
        - तैरती है
        answer: चहचहाती है
        why: सुबह चिड़ियों की चहचहाहट सुनाई देती है।
      ways:
      - style: visual
        teach: सुबह चिड़िया क्या-क्या करती है, क्रम से देखो।
        picture:
          kind: flow
          steps:
          - सुबह-सुबह चहचहाती है
          - पेड़ पर घोंसला बनाती है
          - ज़मीन पर दाना चुगती है
          - आसमान में उड़ जाती है
          alt: सुबह चिड़िया चहचहाती है, पेड़ पर घोंसला बनाती है, ज़मीन पर दाना चुगती है और आसमान में उड़ जाती है।
      - style: real_world
        teach: सुबह जल्दी उठकर खिड़की खोलो, तो पेड़ों से चिड़ियों की आवाज़ें आती हैं। शहर में भी गौरैया और मैना छत पर दाना चुगने आ जाती हैं।
    - teach: 'हर पक्षी की अपनी आवाज़ होती है: चिड़िया चीं-चीं, कोयल कुहू-कुहू, कौआ काँव-काँव, मोर पीहू-पीहू। इन्हें ध्वनि शब्द कहते हैं।'
      picture:
        kind: compare
        columns:
        - title: पक्षी
          points:
          - चिड़िया
          - कौआ
          - मोर
        - title: आवाज़
          points:
          - चीं-चीं
          - काँव-काँव
          - पीहू-पीहू
        alt: पक्षी और उनकी आवाज़ें।
      check:
        prompt: कौआ कैसे बोलता है?
        options:
        - काँव-काँव
        - कुहू-कुहू
        - चीं-चीं
        answer: काँव-काँव
        why: कौए की आवाज़ काँव-काँव है।
      ways:
      - style: step_by_step
        teach: 'आवाज़ से पक्षी पहचानो। पहला: आँखें बंद करके बाहर की आवाज़ें सुनो। दूसरा: ''काँव-काँव'' सुनाई दे तो कौआ है। तीसरा: ''कुहू-कुहू'' सुनाई दे तो कोयल है। चौथा: जो आवाज़ें सुनीं, उनके ध्वनि शब्द कॉपी में लिखो।'
      - style: real_world
        teach: गर्मियों में कोयल की 'कुहू-कुहू' आम के पेड़ों से बहुत सुनाई देती है। बारिश से पहले मोर ज़ोर-ज़ोर से बोलते हैं और नाचते हैं।
    - teach: 'कविता में तुकांत शब्द आते हैं, जिनकी आख़िरी आवाज़ मिलती है: गाना-दाना, डाल-लाल। कविता हमें प्रकृति की सुंदरता और खुशी महसूस कराती है।'
      check:
        prompt: '''गाना'' से तुक मिलाने वाला शब्द कौन-सा है?'
        options:
        - दाना
        - पेड़
        - पानी
        answer: दाना
        why: दोनों के अंत में 'आना' की आवाज़ है।
      ways:
      - style: visual
        teach: 'तुकांत शब्दों के जोड़े: जिनकी आख़िरी आवाज़ एक जैसी होती है।'
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - गाना
            - डाल
            - पानी
          - title: तुक मिलाने वाला
            points:
            - दाना
            - लाल
            - रानी
          alt: गाना और दाना, डाल और लाल, पानी और रानी तुकांत शब्द हैं, क्योंकि इनकी आख़िरी आवाज़ एक जैसी है।
      - style: step_by_step
        teach: 'तुक वाला शब्द बनाओ। पहला: एक शब्द लो, जैसे ''मोर''। दूसरा: उसकी आख़िरी आवाज़ सुनो: ''ओर''। तीसरा: आगे का अक्षर बदलो: शोर, चोर, डोर। चौथा: ये सब ''मोर'' से तुक मिलाते हैं।'
  items:
  - prompt: चिड़िया अपना घर किसे बनाती है?
    options:
    - घोंसला
    - बिल
    - गुफ़ा
    - छत्ता
    answer: घोंसला
    difficulty: 1
    hints:
    - तिनकों से बना।
    - पेड़ पर।
    solution: चिड़िया घोंसला बनाती है।
    mistakes:
      छत्ता: hin4_word
  - prompt: कोयल कैसे बोलती है?
    options:
    - कुहू-कुहू
    - काँव-काँव
    - म्याऊँ-म्याऊँ
    - भौं-भौं
    answer: कुहू-कुहू
    difficulty: 1
    hints:
    - मीठी आवाज़।
    - आम के पेड़ पर।
    solution: कोयल कुहू-कुहू बोलती है।
    mistakes: {"काँव-काँव": "h4_koyal_bol", "म्याऊँ-म्याऊँ": "h4_koyal_bol", "भौं-भौं": "h4_koyal_bol"}
  - prompt: चिड़िया का गीत सुनकर कैसा लगता है?
    options:
    - खुशी
    - डर
    - गुस्सा
    - दुख
    answer: खुशी
    difficulty: 1
    hints:
    - मीठा गीत।
    - मन।
    solution: चिड़िया का गीत मन को खुश करता है।
    mistakes: {"डर": "h4_geet_bhav", "गुस्सा": "h4_geet_bhav", "दुख": "h4_geet_bhav"}
  - prompt: '''गीत'' का अर्थ है:'
    options:
    - गाना
    - खाना
    - पानी
    - पेड़
    answer: गाना
    difficulty: 1
    hints:
    - जो गाया जाए।
    - संगीत।
    solution: गीत यानी गाना।
    mistakes: {"खाना": "h4_geet", "पानी": "h4_geet", "पेड़": "h4_geet"}
  - prompt: '''उड़ना'' का उलटा क्या होगा?'
    options:
    - उतरना / बैठना
    - दौड़ना
    - गाना
    - खाना
    answer: उतरना / बैठना
    difficulty: 2
    hints:
    - ऊपर जाने का उलटा।
    - नीचे आना।
    solution: उड़ने के बाद चिड़िया उतरती या बैठती है।
    mistakes: {"दौड़ना": "h1_ulta", "गाना": "h1_ulta", "खाना": "h1_ulta"}
  - prompt: चिड़िया क्या चुगती है?
    options:
    - दाना
    - पत्थर
    - प्लास्टिक
    - लकड़ी
    answer: दाना
    difficulty: 1
    hints:
    - अनाज के छोटे दाने।
    - चोंच से।
    solution: चिड़िया दाना चुगती है।
    mistakes: {"पत्थर": "h4_chugna", "प्लास्टिक": "h4_chugna", "लकड़ी": "h4_chugna"}
  - prompt: मोर कैसे बोलता है?
    options:
    - पीहू-पीहू
    - म्याऊँ-म्याऊँ
    - भौं-भौं
    answer: पीहू-पीहू
    difficulty: 1
    hints:
    - म्याऊँ बिल्ली की आवाज़ है।
    - भौं-भौं कुत्ते की आवाज़ है।
    solution: 'चरण 1: बिल्ली म्याऊँ, कुत्ता भौं-भौं करता है। चरण 2: मोर पीहू-पीहू बोलता है।'
    mistakes:
      म्याऊँ-म्याऊँ: c4h1_pakshi
      भौं-भौं: c4h1_pakshi
  - prompt: '''डाल'' से तुक मिलाने वाला शब्द है:'
    options:
    - लाल
    - पेड़
    - घर
    answer: लाल
    difficulty: 1
    hints:
    - '''आल'' की आवाज़ सुनो।'
    - दोनों शब्द ज़ोर से बोलो।
    solution: 'चरण 1: डाल का अंत ''आल'' है। चरण 2: लाल का अंत भी ''आल'' है।'
    mistakes:
      पेड़: c4h1_tuk
      घर: c4h1_tuk
  - prompt: चिड़िया घोंसला किससे बनाती है?
    options:
    - तिनकों से
    - ईंटों से
    - लोहे से
    answer: तिनकों से
    difficulty: 1
    hints:
    - चिड़िया अपनी चोंच से हल्की चीज़ें उठाती है।
    - सूखी घास के छोटे टुकड़े।
    solution: 'चरण 1: चिड़िया भारी चीज़ें नहीं उठा सकती। चरण 2: वह तिनकों से घोंसला बनाती है।'
    mistakes:
      ईंटों से: c4h1_pakshi
      लोहे से: c4h1_pakshi
  - prompt: '''चहचहाना'' किसकी आवाज़ के लिए आता है?'
    options:
    - चिड़ियों की
    - शेर की
    - बादल की
    answer: चिड़ियों की
    difficulty: 1
    hints:
    - सुबह पेड़ों से यह आवाज़ आती है।
    - छोटे पक्षी ऐसे बोलते हैं।
    solution: 'चरण 1: छोटे पक्षी सुबह मीठा बोलते हैं। चरण 2: इसे चहचहाना कहते हैं।'
    mistakes:
      शेर की: c4h1_shabd
      बादल की: c4h1_shabd
  - prompt: '''आसमान'' का समान अर्थ वाला शब्द कौन-सा है?'
    options:
    - आकाश
    - धरती
    - पानी
    answer: आकाश
    difficulty: 2
    hints:
    - चिड़िया जहाँ उड़ती है, उसका दूसरा नाम।
    - धरती उसका उलटा है।
    solution: 'चरण 1: आसमान = ऊपर का नीला भाग। चरण 2: इसका समान शब्द आकाश है।'
    mistakes:
      धरती: c4h1_shabd
      पानी: c4h1_shabd
  - prompt: '''चिड़िया'' का बहुवचन क्या है?'
    options:
    - चिड़ियाँ
    - चिड़ियों
    - चिड़ियाएँ
    answer: चिड़ियाँ
    difficulty: 2
    hints:
    - गुड़िया से गुड़ियाँ बनता है।
    - '''या'' के बाद ''ँ'' लगाओ।'
    solution: 'चरण 1: ''इया'' वाले शब्दों में ''ँ'' लगता है। चरण 2: चिड़िया → चिड़ियाँ।'
    mistakes:
      चिड़ियों: c4h1_shabd
      चिड़ियाएँ: c4h1_shabd
  - prompt: पक्षियों के लिए गर्मी में हम क्या कर सकते हैं?
    options:
    - छत पर पानी का बर्तन रखना
    - घोंसले तोड़ना
    - पेड़ काटना
    answer: छत पर पानी का बर्तन रखना
    difficulty: 2
    hints:
    - गर्मी में पक्षियों को प्यास लगती है।
    - कौन-सा काम उनकी मदद करता है?
    solution: 'चरण 1: गर्मी में पानी कम मिलता है। चरण 2: पानी का बर्तन रखने से पक्षियों की मदद होती है।'
    mistakes:
