subject: cbse4-hin
chapter: 1
title: चिड़िया का गीत
tips:
  h4_koyal_bol: "कोयल की आवाज़ मीठी और लंबी होती है। काँव-काँव तो कौआ करता है; कोयल की कूक कैसी सुनाई देती है?"
  hin4_read_again: पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है।
  hin4_word: शब्द को अपने वाक्य में बोलकर देखें। क्या अर्थ ठीक बैठता है?
  hin4_lesson: 'सोचें: इस पाठ से हमें क्या सीख मिलती है?'
  h4_chugna: "'चुगना' मतलब चोंच से एक-एक करके खाना। आँगन में बिखेरे गए छोटे-छोटे अनाज को क्या कहते हैं?"
  h4_geet: "'गीत' को 'संगीत' में ढूँढो। गीत गाया जाता है, खाया या पिया नहीं जाता।"
  h4_geet_bhav: "सुबह चिड़ियों की चहचहाहट सुनकर तुम्हारा मन कैसा हो जाता है?"
concepts:
- code: cbse4h.v1.chidiya
  title: चिड़िया का गीत
  notes: |
    चिड़िया के गीत पर एक कविता। सुबह चिड़ियाँ चहचहाती हैं, पेड़ों पर घोंसले बनाती हैं, दाना चुगती हैं और आसमान में उड़ती हैं।
    कविता प्रकृति की सुंदरता और खुशी का भाव जगाती है। (ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।) अभ्यास: पक्षियों के नाम,
    तुकांत शब्द, ध्वनि शब्द (चीं-चीं, कुहू-कुहू)।
  explanations:
    text: सुबह-सुबह चिड़ियाँ मीठे गीत गाती हैं। वे पेड़ों पर घोंसला बनाती हैं, दाना चुगती हैं और आसमान में उड़ती हैं। उनका गीत सुनकर मन खुश हो जाता है।
    visual: 'चित्र बनाइए: पेड़ की डाल पर घोंसला, उसमें चिड़िया के बच्चे, और ऊपर उड़ती चिड़िया जिसके मुँह से संगीत के निशान निकल रहे हैं।'
    step_by_step: '1. कविता लय से पढ़ें। 2. चिड़िया क्या-क्या करती है? 3. तुकांत शब्द खोजें। 4. कविता का भाव: खुशी।'
    real_world: गाँव में सुबह कोयल की कुहू-कुहू और गौरैया की चीं-चीं सुनाई देती है।
  picture:
    kind: compare
    columns:
    - title: पक्षी
      points:
      - कोयल
      - गौरैया
      - कौआ
    - title: आवाज़
      points:
      - कुहू-कुहू
      - चीं-चीं
      - काँव-काँव
    alt: कोयल कुहू-कुहू, गौरैया चीं-चीं और कौआ काँव-काँव करता है।
  items:
  - prompt: चिड़िया अपना घर किसे बनाती है?
    options:
    - घोंसला
    - बिल
    - गुफ़ा
    - छत्ता
    answer: घोंसला
    difficulty: 1
    hints:
    - तिनकों से बना।
    - पेड़ पर।
    solution: चिड़िया घोंसला बनाती है।
    mistakes:
      छत्ता: hin4_word
  - prompt: कोयल कैसे बोलती है?
    options:
    - कुहू-कुहू
    - काँव-काँव
    - म्याऊँ-म्याऊँ
    - भौं-भौं
    answer: कुहू-कुहू
    difficulty: 1
    hints:
    - मीठी आवाज़।
    - आम के पेड़ पर।
    solution: कोयल कुहू-कुहू बोलती है।
    mistakes: {"काँव-काँव": "h4_koyal_bol", "म्याऊँ-म्याऊँ": "h4_koyal_bol", "भौं-भौं": "h4_koyal_bol"}
  - prompt: चिड़िया का गीत सुनकर कैसा लगता है?
    options:
    - खुशी
    - डर
    - गुस्सा
    - दुख
    answer: खुशी
    difficulty: 1
    hints:
    - मीठा गीत।
    - मन।
    solution: चिड़िया का गीत मन को खुश करता है।
    mistakes: {"डर": "h4_geet_bhav", "गुस्सा": "h4_geet_bhav", "दुख": "h4_geet_bhav"}
  - prompt: '''गीत'' का अर्थ है:'
    options:
    - गाना
    - खाना
    - पानी
    - पेड़
    answer: गाना
    difficulty: 1
    hints:
    - जो गाया जाए।
    - संगीत।
    solution: गीत यानी गाना।
    mistakes: {"खाना": "h4_geet", "पानी": "h4_geet", "पेड़": "h4_geet"}
  - prompt: '''उड़ना'' का उलटा क्या होगा?'
    options:
    - उतरना / बैठना
    - दौड़ना
    - गाना
    - खाना
    answer: उतरना / बैठना
    difficulty: 2
    hints:
    - ऊपर जाने का उलटा।
    - नीचे आना।
    solution: उड़ने के बाद चिड़िया उतरती या बैठती है।
    mistakes: {"दौड़ना": "h1_ulta", "गाना": "h1_ulta", "खाना": "h1_ulta"}
  - prompt: चिड़िया क्या चुगती है?
    options:
    - दाना
    - पत्थर
    - प्लास्टिक
    - लकड़ी
    answer: दाना
    difficulty: 1
    hints:
    - अनाज के छोटे दाने।
    - चोंच से।
    solution: चिड़िया दाना चुगती है।
    mistakes: {"पत्थर": "h4_chugna", "प्लास्टिक": "h4_chugna", "लकड़ी": "h4_chugna"}
