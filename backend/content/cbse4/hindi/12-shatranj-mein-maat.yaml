subject: cbse4-hin
chapter: 12
title: शतरंज में मात
tips:
  h4_anand: "सचिन क्रिकेट, उषा और मिल्खा दौड़ के सितारे हैं। चेन्नई के जिस खिलाड़ी को 'विशी' कहते हैं, वह किस खेल का है?"
  h4_chaturang: "शतरंज का पुराना नाम 'चतुरंग' है, संस्कृत का शब्द। संस्कृत किस देश की भाषा थी?"
  h4_shatranj_khel: "शतरंज बैठकर खेलते हैं, शरीर नहीं हिलता। हर चाल से पहले क्या चलता है?"
  h4_shatranj_khiladi: "शतरंज की बिसात पर मोहरे दो रंगों के होते हैं: सफ़ेद और काले। हर रंग को एक खिलाड़ी चलाता है।"
  c4h12_khel: 'शतरंज की बिसात और मोहरों को याद करो: कितने ख़ाने, कितने मोहरे, और खेल का लक्ष्य क्या है?'
  c4h12_soch: 'सोचो: यह खेल ताक़त से जीता जाता है या सोच-समझकर चाल चलने से?'
  c4h12_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v12.shatranj
  title: शतरंज में मात
  notes: |
    शतरंज के खेल पर आधारित पाठ। शतरंज की शुरुआत भारत में 'चतुरंग' के रूप में हुई मानी जाती है। 64 ख़ानों वाली बिसात, दो
    खिलाड़ी, हर ओर 16 मोहरे: राजा, रानी (वज़ीर), हाथी, ऊँट, घोड़ा, प्यादे। राजा को घेर लेना और बचने का रास्ता न रहना
    'शह और मात' कहलाता है। विश्वनाथन आनंद भारत के पहले ग्रैंडमास्टर हैं। ठीक कहानी यहाँ नहीं दी गई है।
  explanations:
    text: शतरंज दिमाग़ का खेल है, जिसकी शुरुआत भारत में 'चतुरंग' के नाम से हुई मानी जाती है। 64 ख़ानों की बिसात पर दो खिलाड़ी खेलते हैं। जब राजा घिर जाए और बच न सके, तो उसे 'मात' कहते हैं।
    visual: 'चित्र बनाइए: काले-सफ़ेद 64 ख़ानों वाली बिसात, उस पर राजा, रानी, घोड़ा और प्यादे।'
    step_by_step: 1. बिसात में कितने ख़ाने? 64। 2. कितने खिलाड़ी? दो। 3. खेल कब ख़त्म होता है? राजा को मात मिलने पर। 4. इसमें क्या चाहिए? सोच-समझ।
    real_world: विश्वनाथन आनंद, जो भारत के पहले ग्रैंडमास्टर हैं, ने बच्चों में शतरंज को लोकप्रिय बनाया।
  picture:
    kind: compare
    columns:
    - title: शतरंज
      points:
      - 64 ख़ाने
      - 2 खिलाड़ी
      - हर ओर 16 मोहरे
    - title: मोहरे
      points:
      - राजा, रानी
      - हाथी, ऊँट, घोड़ा
      - प्यादे
    alt: 'शतरंज में 64 ख़ाने, 2 खिलाड़ी और हर ओर 16 मोहरे होते हैं: राजा, रानी, हाथी, ऊँट, घोड़ा और प्यादे।'
  activity:
    type: sort
    prompt: शतरंज के बारे में कौन-सी बात सही है?
    bins:
    - सही
    - सही नहीं
    items:
    - label: 64 ख़ानों वाली बिसात
      bin: सही
      clue: 8 पंक्ति × 8 ख़ाने = ?
      why: बिसात में 64 ख़ाने।
    - label: हर ओर 16 मोहरे
      bin: सही
      clue: एक खिलाड़ी के पास कितने मोहरे?
      why: हर ओर 16।
    - label: शुरुआत भारत में चतुरंग से
      bin: सही
      clue: शतरंज का पुराना नाम?
      why: भारत का चतुरंग।
    - label: राजा को घेरना गोल कहलाता है
      bin: सही नहीं
      clue: राजा बच न सके तो क्या कहते हैं?
      why: इसे 'शह और मात' कहते हैं।
    - label: चार खिलाड़ी एक साथ
      bin: सही नहीं
      clue: शतरंज कितने खिलाड़ी खेलते हैं?
      why: दो खिलाड़ी।
  lesson:
    - teach: 'शतरंज दो खिलाड़ियों का दिमाग़ी खेल है। यह 64 ख़ानों वाली बिसात पर खेला जाता है: 8 पंक्तियाँ, हर पंक्ति में 8 ख़ाने। इसकी शुरुआत भारत में ''चतुरंग'' नाम से हुई मानी जाती है।'
      check:
        prompt: बिसात में 8 पंक्तियाँ और हर पंक्ति में 8 ख़ाने हैं। कुल ख़ाने कितने?
        options:
        - '64'
        - '16'
        - '88'
        answer: '64'
        why: 8 × 8 = 64।
      ways:
      - style: visual
        teach: 'शतरंज की बिसात कैसी दिखती है: ऊपर से नीचे की ओर।'
        picture:
          kind: flow
          steps:
          - बिसात चौकोर होती है
          - उसमें 8 पंक्तियाँ होती हैं
          - हर पंक्ति में 8 ख़ाने होते हैं
          - ख़ाने बारी-बारी से हल्के और गहरे रंग के होते हैं
          alt: शतरंज की बिसात चौकोर होती है। उसमें 8 पंक्तियाँ होती हैं, हर पंक्ति में 8 ख़ाने, और ख़ाने बारी-बारी से हल्के और गहरे रंग के होते हैं।
      - style: real_world
        teach: बहुत पुराने समय में राजा युद्ध की चालें समझने के लिए चतुरंग खेलते थे। धीरे-धीरे यह खेल भारत से फ़ारस और फिर दुनिया भर में पहुँचा और शतरंज बन गया।
    - teach: 'हर खिलाड़ी के पास 16 मोहरे होते हैं: 1 राजा, 1 रानी (वज़ीर), 2 हाथी, 2 ऊँट, 2 घोड़े और 8 प्यादे। हर मोहरा अलग ढंग से चलता है।'
      picture:
        kind: bars
        unit: मोहरे
        bars:
        - label: प्यादे
          value: 8
        - label: हाथी
          value: 2
        - label: ऊँट
          value: 2
        - label: घोड़े
          value: 2
        - label: रानी
          value: 1
        - label: राजा
          value: 1
        alt: 'एक खिलाड़ी के 16 मोहरे: 8 प्यादे, 2 हाथी, 2 ऊँट, 2 घोड़े, 1 रानी, 1 राजा।'
      check:
        prompt: एक खिलाड़ी के पास कितने प्यादे होते हैं?
        options:
        - '8'
        - '2'
        - '16'
        answer: '8'
        why: आगे की पूरी पंक्ति प्यादों की होती है।
      ways:
      - style: step_by_step
        teach: 'बिसात पर मोहरे सजाओ। पहला: बिसात ऐसे रखो कि तुम्हारी दाईं ओर नीचे का ख़ाना हल्का हो। दूसरा: अपनी दूसरी पंक्ति में सारे प्यादे रखो। तीसरा: पहली पंक्ति के दोनों कोनों पर हाथी, उनके पास घोड़े, फिर ऊँट रखो। चौथा: बीच के दो ख़ानों में राजा और रानी रखो; रानी अपने रंग के ख़ाने पर।'
      - style: real_world
        teach: शतरंज में हाथी सीधा चलता है, ऊँट तिरछा, और रानी दोनों तरह। जैसे टीम में हर खिलाड़ी का काम अलग होता है, वैसे ही हर मोहरे की अपनी चाल है।
    - teach: खेल का लक्ष्य है सामने वाले के राजा को ऐसे घेरना कि वह बच न सके। इसे 'शह और मात' कहते हैं। विश्वनाथन आनंद भारत के पहले ग्रैंडमास्टर हैं।
      check:
        prompt: '''मात'' होने पर क्या होता है?'
