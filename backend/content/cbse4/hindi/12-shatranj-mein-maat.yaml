        - प्यादा रानी बनता है
        answer: राजा घिर जाता है और खेल ख़त्म
        why: राजा न बच सके तो हार होती है।
      ways:
      - style: visual
        teach: शतरंज में केवल शह और शह-और-मात में क्या फ़र्क़ है।
        picture:
