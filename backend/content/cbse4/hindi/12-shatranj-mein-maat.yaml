subject: cbse4-hin
chapter: 12
title: शतरंज में मात
concepts:
- code: cbse4h.v12.shatranj
  title: शतरंज में मात
  notes: |
    शतरंज के खेल पर आधारित पाठ। शतरंज की शुरुआत भारत में 'चतुरंग' के रूप में हुई मानी जाती है। 64 ख़ानों वाली बिसात, दो
    खिलाड़ी, हर ओर 16 मोहरे: राजा, रानी (वज़ीर), हाथी, ऊँट, घोड़ा, प्यादे। राजा को घेर लेना और बचने का रास्ता न रहना
    'शह और मात' कहलाता है। विश्वनाथन आनंद भारत के पहले ग्रैंडमास्टर हैं। ठीक कहानी यहाँ नहीं दी गई है।
  explanations:
    text: शतरंज दिमाग़ का खेल है, जिसकी शुरुआत भारत में 'चतुरंग' के नाम से हुई मानी जाती है। 64 ख़ानों की बिसात पर दो खिलाड़ी खेलते हैं। जब राजा घिर जाए और बच न सके, तो उसे 'मात' कहते हैं।
    visual: 'चित्र बनाइए: काले-सफ़ेद 64 ख़ानों वाली बिसात, उस पर राजा, रानी, घोड़ा और प्यादे।'
    step_by_step: 1. बिसात में कितने ख़ाने? 64। 2. कितने खिलाड़ी? दो। 3. खेल कब ख़त्म होता है? राजा को मात मिलने पर। 4. इसमें क्या चाहिए? सोच-समझ।
    real_world: विश्वनाथन आनंद, जो भारत के पहले ग्रैंडमास्टर हैं, ने बच्चों में शतरंज को लोकप्रिय बनाया।
  picture:
    kind: compare
    columns:
    - title: शतरंज
      points:
      - 64 ख़ाने
      - 2 खिलाड़ी
      - हर ओर 16 मोहरे
    - title: मोहरे
      points:
      - राजा, रानी
      - हाथी, ऊँट, घोड़ा
      - प्यादे
    alt: 'शतरंज में 64 ख़ाने, 2 खिलाड़ी और हर ओर 16 मोहरे होते हैं: राजा, रानी, हाथी, ऊँट, घोड़ा और प्यादे।'
  items:
  - prompt: शतरंज की बिसात में कितने ख़ाने होते हैं?
    options:
    - '64'
    - '16'
    - '100'
    - '32'
    answer: '64'
    difficulty: 2
    hints:
    - 8 × 8।
    - काले-सफ़ेद।
    solution: बिसात में 64 ख़ाने होते हैं।
    mistakes:
      '16': hin4_read_again
  - prompt: शतरंज की शुरुआत कहाँ हुई मानी जाती है?
    options:
    - भारत में (चतुरंग)
    - चाँद पर
    - समुद्र में
    - रेगिस्तान में
    answer: भारत में (चतुरंग)
    difficulty: 2
    hints:
    - चतुरंग।
    - प्राचीन भारत।
    solution: शतरंज भारत के चतुरंग से निकला माना जाता है।
  - prompt: '''मात'' का अर्थ शतरंज में क्या है?'
    options:
    - राजा घिर जाए और बच न सके, हार
    - जीत की मिठाई
    - खेल शुरू
    - मोहरा ख़रीदना
    answer: राजा घिर जाए और बच न सके, हार
    difficulty: 2
    hints:
    - शह और मात।
    - खेल ख़त्म।
    solution: मात का अर्थ है राजा का घिर जाना यानी हार।
    mistakes:
      जीत की मिठाई: hin4_word
  - prompt: शतरंज किस तरह का खेल है?
    options:
    - दिमाग़ का खेल
    - दौड़ का खेल
    - तैराकी
    - कुश्ती
    answer: दिमाग़ का खेल
    difficulty: 1
    hints:
    - बैठकर सोचते हैं।
    - चालें।
    solution: शतरंज दिमाग़ का खेल है।
  - prompt: भारत के पहले शतरंज ग्रैंडमास्टर कौन हैं?
    options:
    - विश्वनाथन आनंद
    - सचिन तेंदुलकर
    - पी. टी. उषा
    - मिल्खा सिंह
    answer: विश्वनाथन आनंद
    difficulty: 2
    hints:
    - चेन्नई।
    - विशी।
    solution: विश्वनाथन आनंद पहले भारतीय ग्रैंडमास्टर हैं।
  - prompt: शतरंज खेलने के लिए कितने खिलाड़ी चाहिए?
    options:
    - दो
    - एक
    - ग्यारह
    - छह
    answer: दो
    difficulty: 1
    hints:
    - आमने-सामने।
    - काला और सफ़ेद।
    solution: शतरंज दो खिलाड़ी खेलते हैं।
