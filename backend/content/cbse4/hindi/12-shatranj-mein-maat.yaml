          alt: शह में राजा पर हमला होता है पर वह अभी बच सकता है, इसलिए खेल चलता रहता है। शह और मात में राजा के बचने का कोई रास्ता नहीं होता और खेल ख़त्म हो जाता है।
      - style: real_world
        teach: आज भारत में बहुत से युवा शतरंज खिलाड़ी हैं, जैसे डी. गुकेश, जो कम उम्र में विश्व चैंपियन बने। वे रोज़ घंटों अभ्यास करते हैं और हर हार से कुछ नया सीखते हैं।
