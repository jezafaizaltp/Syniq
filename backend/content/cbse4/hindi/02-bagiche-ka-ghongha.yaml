subject: cbse4-hin
chapter: 2
title: बगीचे का घोंघा
tips:
  h4_bagicha: "गाड़ियाँ सड़क पर, किताबें पुस्तकालय में। माली कहाँ काम करता है?"
  h4_ghongha_dar: "घोंघा न उड़ सकता है, न तेज़ भाग सकता है। उसके पास बचने के लिए सबसे पास क्या है?"
  h4_ghongha_ghar: "घोंघा जहाँ जाता है, अपना घर साथ ले जाता है। उसके शरीर पर गोल-गोल सख़्त चीज़ क्या है?"
  h4_ghongha_jagah: "घोंघे सबसे ज़्यादा बारिश के बाद दिखते हैं। तब मिट्टी और पत्ते कैसे होते हैं?"
  c4h2_ghongha: 'घोंघे की बातें याद करो: वह कैसे चलता है, पीठ पर क्या है, और उसे कौन-सी जगह पसंद है?'
  c4h2_seekh: 'सोचो: धीरे चलने वाला भी क्या अपनी जगह तक पहुँच सकता है?'
  c4h2_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v2.ghongha
  title: बगीचे का घोंघा
  notes: |
    बगीचे में रहने वाले घोंघे के बारे में पाठ। घोंघा बहुत धीरे चलता है, अपनी पीठ पर कड़ा खोल (घर) लेकर चलता है, डर
    लगने पर खोल में छिप जाता है, गीली जगह और पत्तियाँ पसंद करता है, और चलते समय चमकीली लकीर छोड़ता है। (पाठ की ठीक
    घटनाएँ यहाँ नहीं दी गई हैं।) सीख: धीरे चलने वाला भी अपनी मंज़िल तक पहुँचता है।
  explanations:
    text: घोंघा बगीचे का एक छोटा जीव है। वह बहुत धीरे-धीरे चलता है और अपना घर, यानी कड़ा खोल, पीठ पर लेकर घूमता है। डर लगने पर वह खोल में छिप जाता है।
    visual: 'चित्र बनाइए: एक पत्ती पर धीरे चलता घोंघा, पीठ पर गोल घुमावदार खोल, पीछे चमकीली लकीर।'
    step_by_step: 1. घोंघा कहाँ रहता है? बगीचे में। 2. कैसे चलता है? धीरे। 3. उसका घर कहाँ है? पीठ पर। 4. डर लगने पर क्या करता है? खोल में छिपता है।
    real_world: बारिश के मौसम में गीली दीवारों और पत्तियों पर घोंघे दिखाई देते हैं।
  picture:
    kind: flow
    steps:
    - घोंघा पत्ती पर चलता है
    - धीरे-धीरे आगे बढ़ता है
    - ख़तरा दिखा
    - खोल में छिप गया
    alt: घोंघा पत्ती पर धीरे-धीरे चलता है, और ख़तरा दिखते ही अपने खोल में छिप जाता है।
  activity:
    type: sort
    prompt: घोंघे के बारे में कौन-सी बात सही है?
    bins:
    - घोंघा
    - घोंघा नहीं
    items:
    - label: पीठ पर कड़ा खोल
      bin: घोंघा
      clue: घोंघा अपना घर कहाँ रखता है?
      why: खोल ही उसका घर है।
    - label: डर लगने पर खोल में छिपना
      bin: घोंघा
      clue: खतरा आने पर घोंघा क्या करता है?
      why: खोल में छिप जाता है।
    - label: चलते समय चमकीली लकीर
      bin: घोंघा
      clue: घोंघे के पीछे क्या दिखता है?
      why: चमकीली लकीर छोड़ता है।
    - label: बहुत तेज़ दौड़ना
      bin: घोंघा नहीं
      clue: घोंघा तेज़ चलता है या धीरे?
      why: घोंघा बहुत धीरे चलता है।
    - label: सूखी, गर्म जगह पसंद
      bin: घोंघा नहीं
      clue: घोंघे को कैसी जगह पसंद है?
      why: उसे गीली जगह पसंद है।
  lesson:
    - teach: घोंघा एक छोटा जीव है जो बगीचे में रहता है। वह अपनी पीठ पर एक कड़ा खोल लेकर चलता है। यह खोल ही उसका घर है।
      check:
        prompt: घोंघे का घर क्या है?
        options:
        - उसकी पीठ का खोल
        - पेड़ का घोंसला
        - मिट्टी का बिल
        answer: उसकी पीठ का खोल
        why: घोंघा अपना घर साथ लेकर चलता है।
    - teach: घोंघा बहुत धीरे चलता है और चलते समय एक चमकीली गीली लकीर छोड़ता है। उसे गीली जगह और पत्तियाँ पसंद हैं। डर लगने पर वह खोल में छिप जाता है।
      picture:
        kind: flow
        steps:
        - गीली पत्ती पर घोंघा
        - धीरे-धीरे चलता है
        - पीछे चमकीली लकीर
        - डर लगे तो खोल में छिपता है
        alt: घोंघा धीरे चलता है, लकीर छोड़ता है और डर लगने पर खोल में छिपता है।
      check:
        prompt: घोंघा चलते समय पीछे क्या छोड़ता है?
        options:
        - चमकीली गीली लकीर
        - पंख
        - पैरों के निशान
        answer: चमकीली गीली लकीर
        why: उसका शरीर गीला और चिकना होता है।
    - teach: 'पाठ की सीख: धीरे चलने वाला भी लगातार चलता रहे तो अपनी मंज़िल तक पहुँच जाता है। जल्दबाज़ी से ज़्यादा लगन ज़रूरी है।'
      check:
        prompt: घोंघे से हमें क्या सीख मिलती है?
        options:
        - धीरे-धीरे लगातार चलते रहो
        - हमेशा छिपे रहो
        - कभी मत चलो
        answer: धीरे-धीरे लगातार चलते रहो
        why: लगन से धीमा भी मंज़िल पाता है।
  items:
  - prompt: घोंघा कैसे चलता है?
    options:
    - बहुत धीरे
    - बहुत तेज़
    - उड़कर
    - कूदकर
    answer: बहुत धीरे
    difficulty: 1
    hints:
    - कछुए जैसा।
    - धीमा।
    solution: घोंघा बहुत धीरे चलता है।
    mistakes:
      बहुत तेज़: hin4_read_again
  - prompt: घोंघे का घर कहाँ होता है?
    options:
    - उसकी पीठ पर (खोल)
    - पेड़ के ऊपर
    - पानी के नीचे
    - बिल में
    answer: उसकी पीठ पर (खोल)
    difficulty: 1
    hints:
    - वह घर साथ लेकर चलता है।
    - खोल।
    solution: घोंघा अपना खोल पीठ पर रखता है।
    mistakes: {"पेड़ के ऊपर": "h4_ghongha_ghar", "पानी के नीचे": "h4_ghongha_ghar", "बिल में": "h4_ghongha_ghar"}
  - prompt: डर लगने पर घोंघा क्या करता है?
    options:
    - खोल में छिप जाता है
    - उड़ जाता है
    - चिल्लाता है
    - दौड़ जाता है
    answer: खोल में छिप जाता है
    difficulty: 1
    hints:
    - बचाव।
    - अंदर।
    solution: घोंघा खोल में छिप जाता है।
    mistakes: {"उड़ जाता है": "h4_ghongha_dar", "चिल्लाता है": "h4_ghongha_dar", "दौड़ जाता है": "h4_ghongha_dar"}
  - prompt: घोंघे को कैसी जगह पसंद है?
    options:
    - गीली
    - बहुत सूखी
    - बहुत गर्म
    - बर्फ़ीली
    answer: गीली
    difficulty: 2
    hints:
    - बारिश में दिखते हैं।
    - नमी।
    solution: घोंघे को गीली जगह पसंद है।
    mistakes: {"बहुत सूखी": "h4_ghongha_jagah", "बहुत गर्म": "h4_ghongha_jagah", "बर्फ़ीली": "h4_ghongha_jagah"}
  - prompt: '''धीरे'' का विलोम है:'
    options:
    - तेज़
    - धीमा
    - आराम
    - छोटा
    answer: तेज़
    difficulty: 1
    hints:
    - उलटा।
    - जल्दी।
    solution: धीरे का विलोम तेज़ है।
    mistakes:
      धीमा: hin4_word
  - prompt: '''बगीचा'' किसे कहते हैं?'
    options:
    - जहाँ पेड़-पौधे और फूल लगे हों
    - जहाँ गाड़ियाँ हों
    - जहाँ किताबें हों
    - जहाँ पानी ही पानी हो
    answer: जहाँ पेड़-पौधे और फूल लगे हों
    difficulty: 1
    hints:
    - बाग़।
    - फूल।
    solution: बगीचा पेड़-पौधों और फूलों की जगह है।
    mistakes: {"जहाँ गाड़ियाँ हों": "h4_bagicha", "जहाँ किताबें हों": "h4_bagicha", "जहाँ पानी ही पानी हो": "h4_bagicha"}
  - prompt: घोंघे का खोल कैसा होता है?
    options:
    - कड़ा
    - नरम रुई जैसा
    - पानी जैसा
    answer: कड़ा
    difficulty: 1
    hints:
    - खोल उसे बचाता है।
    - बचाने वाली चीज़ मज़बूत होनी चाहिए।
    solution: 'चरण 1: खोल घोंघे की रक्षा करता है। चरण 2: इसलिए वह कड़ा होता है।'
    mistakes:
      नरम रुई जैसा: c4h2_ghongha
      पानी जैसा: c4h2_ghongha
  - prompt: घोंघा बारिश के बाद ज़्यादा क्यों दिखता है?
    options:
    - उसे गीली जगह पसंद है
    - उसे धूप पसंद है
    - बारिश में वह उड़ता है
    answer: उसे गीली जगह पसंद है
    difficulty: 2
    hints:
    - बारिश के बाद ज़मीन कैसी होती है?
    - घोंघे को सूखी या गीली जगह पसंद है?
    solution: 'चरण 1: बारिश के बाद सब गीला होता है। चरण 2: घोंघे को गीली जगह पसंद है।'
    mistakes:
      उसे धूप पसंद है: c4h2_ghongha
      बारिश में वह उड़ता है: c4h2_ghongha
  - prompt: '''खोल'' का अर्थ है:'
    options:
    - कड़ा बाहरी आवरण
    - दरवाज़ा खोलना
    - खिलौना
    answer: कड़ा बाहरी आवरण
    difficulty: 2
    hints:
    - यहाँ यह घोंघे की पीठ की चीज़ है।
    - नारियल के ऊपर भी ऐसा ही होता है।
    solution: 'चरण 1: घोंघे की पीठ पर कड़ा घर है। चरण 2: खोल = कड़ा बाहरी आवरण।'
    mistakes:
      दरवाज़ा खोलना: c4h2_shabd
      खिलौना: c4h2_shabd
  - prompt: घोंघा क्या खाता है?
    options:
    - पत्तियाँ
    - मछली
    - दूध
    answer: पत्तियाँ
    difficulty: 1
    hints:
    - वह बगीचे में रहता है।
    - बगीचे में हरी-हरी क्या है?
    solution: 'चरण 1: बगीचे में पौधे हैं। चरण 2: घोंघा पत्तियाँ खाता है।'
    mistakes:
      मछली: c4h2_ghongha
      दूध: c4h2_ghongha
  - prompt: इनमें से कौन-सा जीव भी अपना घर पीठ पर लेकर चलता है?
    options:
    - कछुआ
    - बिल्ली
    - तोता
    answer: कछुआ
    difficulty: 2
    hints:
    - इसकी पीठ पर भी कड़ा कवच होता है।
    - यह भी धीरे चलता है।
    solution: 'चरण 1: कछुए की पीठ पर कवच होता है। चरण 2: वह भी घर साथ लेकर चलता है।'
    mistakes:
      बिल्ली: c4h2_ghongha
      तोता: c4h2_ghongha
  - prompt: '''मंज़िल'' शब्द का अर्थ है:'
    options:
    - जहाँ पहुँचना हो
    - रास्ते का पत्थर
    - घर की छत
    answer: जहाँ पहुँचना हो
    difficulty: 2
    hints:
    - यात्रा का आख़िरी स्थान।
    - घोंघा धीरे-धीरे वहाँ पहुँचता है।
    solution: 'चरण 1: यात्रा कहीं जाकर पूरी होती है। चरण 2: वह जगह मंज़िल है।'
    mistakes:
      रास्ते का पत्थर: c4h2_shabd
      घर की छत: c4h2_shabd
  - prompt: बगीचे में घोंघा दिखे तो हमें क्या करना चाहिए?
    options:
    - उसे बिना छेड़े देखना
    - उस पर नमक डालना
    - उसे पैर से दबाना
    answer: उसे बिना छेड़े देखना
    difficulty: 1
    hints:
    - घोंघा भी जीव है।
    - कौन-सा काम उसे नुकसान नहीं पहुँचाता?
    solution: 'चरण 1: जीवों को नुकसान नहीं पहुँचाना चाहिए। चरण 2: उसे बिना छेड़े देखना ठीक है।'
    mistakes:
      उस पर नमक डालना: c4h2_seekh
      उसे पैर से दबाना: c4h2_seekh
  - prompt: एक बच्चा पढ़ाई में धीरे सीखता है पर रोज़ अभ्यास करता है। घोंघे की सीख के अनुसार क्या होगा?
    options:
    - वह भी अच्छा सीख जाएगा
    - वह कभी नहीं सीखेगा
    - उसे पढ़ना छोड़ देना चाहिए
    answer: वह भी अच्छा सीख जाएगा
    difficulty: 3
    hints:
    - घोंघा धीमा है पर रुकता नहीं।
    - रोज़ अभ्यास से क्या होता है?
    solution: 'चरण 1: लगातार मेहनत से धीमा भी आगे बढ़ता है। चरण 2: वह बच्चा भी अच्छा सीख जाएगा।'
    mistakes:
      वह कभी नहीं सीखेगा: c4h2_seekh
      उसे पढ़ना छोड़ देना चाहिए: c4h2_seekh
  - prompt: '''बगीचा'' का समान अर्थ वाला शब्द कौन-सा है?'
    options:
    - उद्यान
    - बाज़ार
    - रसोई
    answer: उद्यान
    difficulty: 3
    hints:
    - यह शब्द अक्सर बड़े सरकारी बगीचों के नाम में आता है।
    - जहाँ फूल-पौधे लगे हों।
    solution: 'चरण 1: बगीचे में पेड़-पौधे होते हैं। चरण 2: इसका समान शब्द उद्यान है।'
    mistakes:
      बाज़ार: c4h2_shabd
      रसोई: c4h2_shabd
