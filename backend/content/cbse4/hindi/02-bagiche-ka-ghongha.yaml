subject: cbse4-hin
chapter: 2
title: बगीचे का घोंघा
tips:
  h4_bagicha: "गाड़ियाँ सड़क पर, किताबें पुस्तकालय में। माली कहाँ काम करता है?"
  h4_ghongha_dar: "घोंघा न उड़ सकता है, न तेज़ भाग सकता है। उसके पास बचने के लिए सबसे पास क्या है?"
  h4_ghongha_ghar: "घोंघा जहाँ जाता है, अपना घर साथ ले जाता है। उसके शरीर पर गोल-गोल सख़्त चीज़ क्या है?"
  h4_ghongha_jagah: "घोंघे सबसे ज़्यादा बारिश के बाद दिखते हैं। तब मिट्टी और पत्ते कैसे होते हैं?"

concepts:
- code: cbse4h.v2.ghongha
  title: बगीचे का घोंघा
  notes: |
    बगीचे में रहने वाले घोंघे के बारे में पाठ। घोंघा बहुत धीरे चलता है, अपनी पीठ पर कड़ा खोल (घर) लेकर चलता है, डर
    लगने पर खोल में छिप जाता है, गीली जगह और पत्तियाँ पसंद करता है, और चलते समय चमकीली लकीर छोड़ता है। (पाठ की ठीक
    घटनाएँ यहाँ नहीं दी गई हैं।) सीख: धीरे चलने वाला भी अपनी मंज़िल तक पहुँचता है।
  explanations:
    text: घोंघा बगीचे का एक छोटा जीव है। वह बहुत धीरे-धीरे चलता है और अपना घर, यानी कड़ा खोल, पीठ पर लेकर घूमता है। डर लगने पर वह खोल में छिप जाता है।
    visual: 'चित्र बनाइए: एक पत्ती पर धीरे चलता घोंघा, पीठ पर गोल घुमावदार खोल, पीछे चमकीली लकीर।'
    step_by_step: 1. घोंघा कहाँ रहता है? बगीचे में। 2. कैसे चलता है? धीरे। 3. उसका घर कहाँ है? पीठ पर। 4. डर लगने पर क्या करता है? खोल में छिपता है।
    real_world: बारिश के मौसम में गीली दीवारों और पत्तियों पर घोंघे दिखाई देते हैं।
  picture:
    kind: flow
    steps:
    - घोंघा पत्ती पर चलता है
    - धीरे-धीरे आगे बढ़ता है
    - ख़तरा दिखा
    - खोल में छिप गया
    alt: घोंघा पत्ती पर धीरे-धीरे चलता है, और ख़तरा दिखते ही अपने खोल में छिप जाता है।
  items:
  - prompt: घोंघा कैसे चलता है?
    options:
    - बहुत धीरे
    - बहुत तेज़
    - उड़कर
    - कूदकर
    answer: बहुत धीरे
    difficulty: 1
    hints:
    - कछुए जैसा।
    - धीमा।
    solution: घोंघा बहुत धीरे चलता है।
    mistakes:
      बहुत तेज़: hin4_read_again
  - prompt: घोंघे का घर कहाँ होता है?
    options:
    - उसकी पीठ पर (खोल)
    - पेड़ के ऊपर
    - पानी के नीचे
    - बिल में
    answer: उसकी पीठ पर (खोल)
    difficulty: 1
    hints:
    - वह घर साथ लेकर चलता है।
    - खोल।
    solution: घोंघा अपना खोल पीठ पर रखता है।
    mistakes: {"पेड़ के ऊपर": "h4_ghongha_ghar", "पानी के नीचे": "h4_ghongha_ghar", "बिल में": "h4_ghongha_ghar"}
  - prompt: डर लगने पर घोंघा क्या करता है?
    options:
    - खोल में छिप जाता है
    - उड़ जाता है
    - चिल्लाता है
    - दौड़ जाता है
    answer: खोल में छिप जाता है
    difficulty: 1
    hints:
    - बचाव।
    - अंदर।
    solution: घोंघा खोल में छिप जाता है।
    mistakes: {"उड़ जाता है": "h4_ghongha_dar", "चिल्लाता है": "h4_ghongha_dar", "दौड़ जाता है": "h4_ghongha_dar"}
  - prompt: घोंघे को कैसी जगह पसंद है?
    options:
    - गीली
    - बहुत सूखी
    - बहुत गर्म
    - बर्फ़ीली
    answer: गीली
    difficulty: 2
    hints:
    - बारिश में दिखते हैं।
    - नमी।
    solution: घोंघे को गीली जगह पसंद है।
    mistakes: {"बहुत सूखी": "h4_ghongha_jagah", "बहुत गर्म": "h4_ghongha_jagah", "बर्फ़ीली": "h4_ghongha_jagah"}
  - prompt: '''धीरे'' का विलोम है:'
    options:
    - तेज़
    - धीमा
    - आराम
    - छोटा
    answer: तेज़
    difficulty: 1
    hints:
    - उलटा।
    - जल्दी।
    solution: धीरे का विलोम तेज़ है।
    mistakes:
      धीमा: hin4_word
  - prompt: '''बगीचा'' किसे कहते हैं?'
    options:
    - जहाँ पेड़-पौधे और फूल लगे हों
    - जहाँ गाड़ियाँ हों
    - जहाँ किताबें हों
    - जहाँ पानी ही पानी हो
    answer: जहाँ पेड़-पौधे और फूल लगे हों
    difficulty: 1
    hints:
    - बाग़।
    - फूल।
    solution: बगीचा पेड़-पौधों और फूलों की जगह है।
    mistakes: {"जहाँ गाड़ियाँ हों": "h4_bagicha", "जहाँ किताबें हों": "h4_bagicha", "जहाँ पानी ही पानी हो": "h4_bagicha"}
