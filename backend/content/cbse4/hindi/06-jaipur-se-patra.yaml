    - आटे की गोल बाटी और दाल।
    solution: 'चरण 1: पुट्टु और ढोकला दूसरे राज्यों के हैं। चरण 2: राजस्थान का दाल-बाटी-चूरमा प्रसिद्ध है।'
    mistakes:
