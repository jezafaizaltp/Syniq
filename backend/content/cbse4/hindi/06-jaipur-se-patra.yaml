subject: cbse4-hin
chapter: 6
title: जयपुर से पत्र
tips:
  h4_hawa_mahal: "नाम में ही सुराग है: 'हवा' महल। हवा अंदर कैसे आती होगी?"
  h4_jaipur: "जयपुर की पुरानी इमारतें एक ख़ास रंग से रँगी हैं, कमल और गुलाब जैसा।"
  h4_jantar: "'यंत्र' और 'मंत्र' से बना नाम। राजा ने वहाँ आसमान और तारों को नापने के लिए बड़े ढाँचे बनवाए।"

concepts:
- code: cbse4h.v6.jaipur
  title: जयपुर से पत्र
  notes: |
    पत्र के रूप में पाठ: कोई जयपुर (राजस्थान की राजधानी) घूमने जाकर घर वालों को पत्र लिखता है। जयपुर 'गुलाबी नगर' कहलाता
    है क्योंकि पुराने शहर की इमारतें गुलाबी रंग की हैं। हवा महल (बहुत सारी खिड़कियों वाला महल), जंतर मंतर (खगोल वेधशाला,
    सवाई जय सिंह ने बनवाई), आमेर का किला, बाज़ार में बंधेज, कठपुतलियाँ, दाल-बाटी-चूरमा। पत्र के भाग: स्थान-तिथि, संबोधन,
    मुख्य बात, अंत में नाम। (पाठ की ठीक बातें यहाँ नहीं दी गई हैं।)
  explanations:
    text: इस पाठ में जयपुर घूमने गया कोई अपने घर पत्र लिखता है। जयपुर को गुलाबी नगर कहते हैं। वहाँ हवा महल, जंतर मंतर और आमेर का किला देखने लायक हैं। पत्र में तारीख़, संबोधन, बात और अंत में नाम लिखते हैं।
    visual: 'चित्र बनाइए: गुलाबी रंग का हवा महल जिसमें बहुत सारी छोटी खिड़कियाँ हैं, और उसके सामने एक लिफ़ाफ़ा और पत्र।'
    step_by_step: 1. पत्र कहाँ से लिखा गया? जयपुर। 2. जयपुर को क्या कहते हैं? गुलाबी नगर। 3. कौन-कौन सी जगहें देखीं? 4. पत्र के भाग पहचानें।
    real_world: राजस्थान में पर्यटक ऊँट की सवारी करते हैं और कठपुतली का खेल देखते हैं।
  picture:
    kind: compare
    columns:
    - title: जयपुर में
      points:
      - हवा महल
      - जंतर मंतर
      - आमेर का किला
    - title: ख़ास बात
      points:
      - बहुत सारी खिड़कियाँ
      - पुराने खगोल यंत्र
      - पहाड़ी पर बड़ा किला
    alt: जयपुर का हवा महल अपनी बहुत सारी खिड़कियों के लिए, जंतर मंतर पुराने खगोल यंत्रों के लिए और आमेर पहाड़ी पर बने बड़े किले के लिए प्रसिद्ध है।
  activity:
    type: order
    prompt: पत्र के भाग क्रम से लगाओ।
    steps:
    - स्थान और तिथि
    - संबोधन (प्रिय माँ)
    - मुख्य बात (जयपुर की सैर)
    - अंत में नाम
    reasons:
      संबोधन (प्रिय माँ): पत्र सबसे ऊपर स्थान-तिथि से शुरू होता है।
      मुख्य बात (जयपुर की सैर): पहले जिसे लिख रहे हैं उसे संबोधित करते हैं।
      अंत में नाम: नाम सबसे आख़िर में।
  items:
  - prompt: जयपुर किस राज्य की राजधानी है?
    options:
    - राजस्थान
    - केरल
    - पंजाब
    - बिहार
    answer: राजस्थान
    difficulty: 1
    hints:
    - रेगिस्तान वाला राज्य।
    - ऊँट।
    solution: जयपुर राजस्थान की राजधानी है।
    mistakes:
      केरल: hin4_read_again
  - prompt: जयपुर को क्या कहा जाता है?
    options:
    - गुलाबी नगर
    - नीला नगर
    - हरा नगर
    - सफ़ेद नगर
    answer: गुलाबी नगर
    difficulty: 1
    hints:
    - इमारतों का रंग।
    - Pink City।
    solution: जयपुर को गुलाबी नगर कहते हैं।
    mistakes: {"नीला नगर": "h4_jaipur", "हरा नगर": "h4_jaipur", "सफ़ेद नगर": "h4_jaipur"}
  - prompt: हवा महल की ख़ास बात क्या है?
    options:
    - बहुत सारी छोटी खिड़कियाँ
    - पानी में तैरता है
    - बर्फ़ से बना है
    - ज़मीन के नीचे है
    answer: बहुत सारी छोटी खिड़कियाँ
    difficulty: 2
    hints:
    - हवा आती है।
    - झरोखे।
    solution: हवा महल में बहुत सारी खिड़कियाँ हैं।
    mistakes: {"पानी में तैरता है": "h4_hawa_mahal", "बर्फ़ से बना है": "h4_hawa_mahal", "ज़मीन के नीचे है": "h4_hawa_mahal"}
  - prompt: पत्र के अंत में क्या लिखते हैं?
    options:
    - लिखने वाले का नाम
    - पहला शब्द
    - कोई गाना
    - कुछ नहीं
    answer: लिखने वाले का नाम
    difficulty: 1
    hints:
    - किसने लिखा?
    - नीचे।
    solution: पत्र के अंत में लिखने वाले का नाम होता है।
    mistakes: {"पहला शब्द": "h3_patra_ant", "कोई गाना": "h3_patra_ant", "कुछ नहीं": "h3_patra_ant"}
  - prompt: जंतर मंतर क्या है?
    options:
    - पुरानी खगोल वेधशाला (तारे देखने के यंत्र)
    - एक मिठाई की दुकान
    - एक नदी
    - एक जंगल
    answer: पुरानी खगोल वेधशाला (तारे देखने के यंत्र)
    difficulty: 2
    hints:
    - सूरज-तारों का अध्ययन।
    - बड़े यंत्र।
    solution: जंतर मंतर एक पुरानी खगोल वेधशाला है।
    mistakes: {"एक मिठाई की दुकान": "h4_jantar", "एक नदी": "h4_jantar", "एक जंगल": "h4_jantar"}
  - prompt: '''पत्र'' का अर्थ है:'
    options:
    - चिट्ठी
    - फूल
    - कलम
    - किताब
    answer: चिट्ठी
    difficulty: 1
    hints:
    - डाक से भेजते हैं।
    - लिफ़ाफ़ा।
    solution: पत्र यानी चिट्ठी।
    mistakes:
      कलम: hin4_word
