subject: cbse4-hin
chapter: 6
title: जयपुर से पत्र
tips:
  h4_hawa_mahal: "नाम में ही सुराग है: 'हवा' महल। हवा अंदर कैसे आती होगी?"
  h4_jaipur: "जयपुर की पुरानी इमारतें एक ख़ास रंग से रँगी हैं, कमल और गुलाब जैसा।"
  h4_jantar: "'यंत्र' और 'मंत्र' से बना नाम। राजा ने वहाँ आसमान और तारों को नापने के लिए बड़े ढाँचे बनवाए।"
  c4h6_jaipur: 'जयपुर की मुख्य बातें याद करो: किस राज्य में, शहर का रंग, और कौन-सी इमारतें प्रसिद्ध हैं।'
  c4h6_patra: 'पत्र के भाग क्रम से सोचो: ऊपर स्थान-तिथि, फिर संबोधन, फिर बात, अंत में नाम।'
  c4h6_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v6.jaipur
  title: जयपुर से पत्र
  notes: |
    पत्र के रूप में पाठ: कोई जयपुर (राजस्थान की राजधानी) घूमने जाकर घर वालों को पत्र लिखता है। जयपुर 'गुलाबी नगर' कहलाता
    है क्योंकि पुराने शहर की इमारतें गुलाबी रंग की हैं। हवा महल (बहुत सारी खिड़कियों वाला महल), जंतर मंतर (खगोल वेधशाला,
    सवाई जय सिंह ने बनवाई), आमेर का किला, बाज़ार में बंधेज, कठपुतलियाँ, दाल-बाटी-चूरमा। पत्र के भाग: स्थान-तिथि, संबोधन,
    मुख्य बात, अंत में नाम। (पाठ की ठीक बातें यहाँ नहीं दी गई हैं।)
  explanations:
    text: इस पाठ में जयपुर घूमने गया कोई अपने घर पत्र लिखता है। जयपुर को गुलाबी नगर कहते हैं। वहाँ हवा महल, जंतर मंतर और आमेर का किला देखने लायक हैं। पत्र में तारीख़, संबोधन, बात और अंत में नाम लिखते हैं।
    visual: 'चित्र बनाइए: गुलाबी रंग का हवा महल जिसमें बहुत सारी छोटी खिड़कियाँ हैं, और उसके सामने एक लिफ़ाफ़ा और पत्र।'
    step_by_step: 1. पत्र कहाँ से लिखा गया? जयपुर। 2. जयपुर को क्या कहते हैं? गुलाबी नगर। 3. कौन-कौन सी जगहें देखीं? 4. पत्र के भाग पहचानें।
    real_world: राजस्थान में पर्यटक ऊँट की सवारी करते हैं और कठपुतली का खेल देखते हैं।
  picture:
    kind: compare
    columns:
    - title: जयपुर में
      points:
      - हवा महल
      - जंतर मंतर
      - आमेर का किला
    - title: ख़ास बात
      points:
      - बहुत सारी खिड़कियाँ
      - पुराने खगोल यंत्र
      - पहाड़ी पर बड़ा किला
    alt: जयपुर का हवा महल अपनी बहुत सारी खिड़कियों के लिए, जंतर मंतर पुराने खगोल यंत्रों के लिए और आमेर पहाड़ी पर बने बड़े किले के लिए प्रसिद्ध है।
  activity:
    type: order
    prompt: पत्र के भाग क्रम से लगाओ।
    steps:
    - स्थान और तिथि
    - संबोधन (प्रिय माँ)
    - मुख्य बात (जयपुर की सैर)
    - अंत में नाम
    reasons:
      संबोधन (प्रिय माँ): पत्र सबसे ऊपर स्थान-तिथि से शुरू होता है।
      मुख्य बात (जयपुर की सैर): पहले जिसे लिख रहे हैं उसे संबोधित करते हैं।
      अंत में नाम: नाम सबसे आख़िर में।
  lesson:
    - teach: यह पाठ एक पत्र है। कोई बच्चा जयपुर घूमने गया और घर पर पत्र लिखा। जयपुर राजस्थान की राजधानी है। पुराने शहर की इमारतें गुलाबी रंग की हैं, इसलिए इसे 'गुलाबी नगर' कहते हैं।
      check:
        prompt: जयपुर को 'गुलाबी नगर' क्यों कहते हैं?
        options:
        - पुरानी इमारतें गुलाबी रंग की हैं
        - वहाँ गुलाब ही गुलाब हैं
        - वहाँ का आसमान गुलाबी है
        answer: पुरानी इमारतें गुलाबी रंग की हैं
        why: पुराने शहर की दीवारें गुलाबी रंगी हैं।
      ways:
      - style: visual
        teach: जयपुर के बारे में मुख्य बातें, सवाल और जवाब के रूप में।
        picture:
          kind: compare
          columns:
          - title: सवाल
            points:
            - किस राज्य की राजधानी?
            - क्या कहलाता है?
            - क्यों?
          - title: जवाब
            points:
            - राजस्थान
            - गुलाबी नगर
            - पुराने शहर की इमारतें गुलाबी हैं
          alt: जयपुर राजस्थान की राजधानी है। इसे गुलाबी नगर कहते हैं, क्योंकि पुराने शहर की इमारतें गुलाबी रंग की हैं।
      - style: real_world
        teach: जयपुर घूमने आने वाले लोग अक्सर गुलाबी इमारतों वाले पुराने बाज़ारों में घूमते हैं और वहाँ के रंग-बिरंगे कपड़े और चूड़ियाँ ख़रीदते हैं।
    - teach: जयपुर में हवा महल (बहुत सारी छोटी खिड़कियों वाला महल), जंतर मंतर (तारे और समय देखने के पुराने यंत्र) और आमेर का किला देखने लायक हैं। बाज़ार में बंधेज के कपड़े और कठपुतलियाँ मिलती हैं।
      picture:
        kind: compare
        columns:
        - title: जगह
          points:
          - हवा महल
          - जंतर मंतर
          - आमेर का किला
        - title: ख़ास बात
          points:
          - बहुत सारी छोटी खिड़कियाँ
          - समय और तारे देखने के यंत्र
          - पहाड़ी पर बड़ा किला
        alt: जयपुर की प्रसिद्ध जगहें और उनकी ख़ास बातें।
      check:
        prompt: बहुत सारी छोटी खिड़कियों वाला महल कौन-सा है?
        options:
        - हवा महल
        - लाल किला
        - ताज महल
        answer: हवा महल
        why: खिड़कियों से हवा आती-जाती है।
      ways:
      - style: step_by_step
        teach: 'जयपुर घूमने की योजना बनाओ। पहला: सुबह आमेर का किला देखो। दूसरा: फिर हवा महल की छोटी-छोटी खिड़कियाँ गिनने की कोशिश करो। तीसरा: दोपहर में जंतर मंतर के पुराने यंत्र देखो। चौथा: शाम को बाज़ार से एक कठपुतली ख़रीदो।'
      - style: real_world
        teach: राजस्थान के मेलों में कठपुतली का खेल बहुत पसंद किया जाता है। कलाकार धागों से कठपुतलियों को नचाते हैं और साथ में गीत गाकर कहानी सुनाते हैं।
    - teach: 'पत्र के भाग: सबसे ऊपर स्थान और तिथि, फिर संबोधन (प्रिय माँ), फिर मुख्य बात, और अंत में ''तुम्हारा/तुम्हारी'' लिखकर अपना नाम।'
      check:
        prompt: पत्र में 'प्रिय माँ' किस भाग में आता है?
        options:
        - संबोधन
        - अंत
        - तिथि
        answer: संबोधन
        why: संबोधन में हम जिसे लिख रहे हैं, उसे पुकारते हैं।
      ways:
      - style: visual
        teach: पत्र के सभी भाग, ऊपर से नीचे तक सही क्रम में।
        picture:
          kind: flow
          steps:
          - 'सबसे ऊपर: स्थान और तिथि'
          - फिर संबोधन, जैसे 'प्रिय माँ'
          - फिर मुख्य बात
          - अंत में 'तुम्हारा' या 'तुम्हारी'
          - सबसे नीचे अपना नाम
          alt: पत्र में सबसे ऊपर स्थान और तिथि, फिर संबोधन जैसे 'प्रिय माँ', फिर मुख्य बात, अंत में 'तुम्हारा' या 'तुम्हारी', और सबसे नीचे अपना नाम लिखते हैं।
      - style: real_world
        teach: आजकल लोग फ़ोन पर संदेश भेजते हैं, पर हाथ से लिखा पत्र आज भी ख़ास लगता है। कई लोग पुराने पत्रों को यादों की तरह सँभालकर रखते हैं।
  items:
  - prompt: जयपुर किस राज्य की राजधानी है?
    options:
    - राजस्थान
    - केरल
    - पंजाब
    - बिहार
    answer: राजस्थान
    difficulty: 1
    hints:
    - रेगिस्तान वाला राज्य।
    - ऊँट।
    solution: जयपुर राजस्थान की राजधानी है।
    mistakes:
      केरल: hin4_read_again
  - prompt: जयपुर को क्या कहा जाता है?
