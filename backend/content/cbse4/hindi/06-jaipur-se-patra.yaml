  - prompt: राजस्थान का प्रसिद्ध भोजन कौन-सा है?
    options:
    - दाल-बाटी-चूरमा
    - पुट्टु
    - ढोकला
    answer: दाल-बाटी-चूरमा
    difficulty: 2
    hints:
