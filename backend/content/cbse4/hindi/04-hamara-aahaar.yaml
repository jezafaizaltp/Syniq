subject: cbse4-hin
chapter: 4
title: हमारा आहार
tips:
  h4_junk: "जंक फ़ूड पैकेट में आता है, तला-भुना और नमक भरा होता है। इनमें से कौन-सा घर या पेड़ से नहीं, पैकेट से आता है?"
  h4_kerala_khana: "साग पंजाब का, ढोकला गुजरात का, लिट्टी-चोखा बिहार का। केरल के घरों में केले के पत्ते पर दाल-सब्ज़ी वाला कौन-सा खाना?"
  h4_mote_anaj: "रागी और बाजरा से रोटी बनती है, जैसे गेहूँ से। तो ये किस समूह के हैं? उनके दाने कैसे होते हैं?"
  h4_paani: "शरीर का बहुत बड़ा हिस्सा किससे बना है? मीठे पेय उसकी जगह नहीं ले सकते।"
  h4_santulit: "'संतुलित' मतलब तराज़ू के दोनों पलड़े बराबर। 'केवल' एक चीज़ से थाली संतुलित होगी?"
  c4h4_bhojan: 'सोचो: यह खाना शरीर को ताक़त देता है, बढ़ने में मदद करता है, या बीमारी से बचाता है?'
  c4h4_rajya: भारत के नक्शे पर राज्य याद करो और वहाँ के लोग रोज़ क्या खाते हैं।
  c4h4_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v4.aahaar
  title: हमारा आहार
  notes: |
    'आहार' यानी भोजन। पाठ हमारे भोजन के बारे में है: संतुलित आहार में अनाज (चावल, गेहूँ, रागी), दालें, दूध, फल और
    सब्ज़ियाँ होनी चाहिए; पानी भी ज़रूरी है। भारत के अलग-अलग राज्यों के भोजन अलग हैं: केरल में चावल और सांबर, पंजाब में
    रोटी और सरसों का साग। ताज़ा, घर का खाना अच्छा है; जंक फ़ूड कम खाएँ। (पाठ की ठीक बातें यहाँ नहीं दी गई हैं।)
  explanations:
    text: आहार यानी भोजन। अच्छे आहार में अनाज, दालें, दूध, फल और सब्ज़ियाँ होती हैं, इसे संतुलित आहार कहते हैं। हर राज्य का खाना अलग होता है, पर ताज़ा और घर का खाना सबसे अच्छा है।
    visual: 'चित्र बनाइए: एक थाली में चावल, दाल, सब्ज़ी, दही और एक फल, साथ में पानी का गिलास।'
    step_by_step: 1. अपनी थाली देखें। 2. अनाज, दाल, सब्ज़ी, फल हैं क्या? 3. जो कम है, उसे जोड़ें। 4. पानी पिएँ।
    real_world: स्कूल के मिड-डे मील में चावल या रोटी, दाल और सब्ज़ी दी जाती है।
  picture:
    kind: compare
    columns:
    - title: राज्य
      points:
      - केरल
      - पंजाब
      - गुजरात
    - title: प्रसिद्ध भोजन
      points:
      - चावल, सांबर, अवियल
      - रोटी, सरसों का साग
      - ढोकला, थेपला
    alt: केरल में चावल, सांबर और अवियल, पंजाब में रोटी और सरसों का साग, और गुजरात में ढोकला और थेपला प्रसिद्ध हैं।
  activity:
    type: sort
    prompt: संतुलित आहार की थाली में क्या ज़्यादा रखें, क्या कम?
    bins:
    - रोज़ ज़रूरी
    - कम खाएँ
    items:
    - label: चावल, गेहूँ, रागी
      bin: रोज़ ज़रूरी
      clue: अनाज से ताक़त मिलती है?
      why: अनाज संतुलित आहार का हिस्सा।
    - label: दालें
      bin: रोज़ ज़रूरी
      clue: दाल शरीर बनाने में मदद करती है?
      why: दालें ज़रूरी।
    - label: फल और सब्ज़ियाँ
      bin: रोज़ ज़रूरी
      clue: रंग-बिरंगी थाली में क्या होता है?
      why: फल-सब्ज़ी रोज़।
    - label: दूध
      bin: रोज़ ज़रूरी
      clue: हड्डियों के लिए क्या?
      why: दूध ज़रूरी।
    - label: जंक फ़ूड
      bin: कम खाएँ
      clue: पाठ जंक फ़ूड के बारे में क्या कहता है?
      why: जंक फ़ूड कम खाएँ।
  lesson:
    - teach: '''आहार'' का अर्थ है भोजन। हमारे शरीर को ठीक रहने के लिए अलग-अलग तरह का खाना चाहिए: अनाज ताक़त देते हैं, दाल और दूध शरीर बढ़ाते हैं, फल-सब्ज़ियाँ बीमारी से बचाते हैं।'
      check:
        prompt: दाल और दूध हमारे शरीर के लिए क्या करते हैं?
        options:
        - शरीर को बढ़ने में मदद करते हैं
        - नींद लाते हैं
        - दाँत ख़राब करते हैं
        answer: शरीर को बढ़ने में मदद करते हैं
        why: दाल और दूध शरीर बनाने वाले भोजन हैं।
    - teach: जिस भोजन में अनाज, दाल, दूध, फल और सब्ज़ियाँ सब हों, उसे संतुलित आहार कहते हैं। साथ में साफ़ पानी भी ज़रूरी है।
      picture:
        kind: compare
        columns:
        - title: ताक़त देने वाले
          points:
          - चावल, गेहूँ
          - रागी, बाजरा
        - title: शरीर बढ़ाने वाले
          points:
          - दाल
          - दूध, अंडा
        - title: बीमारी से बचाने वाले
          points:
          - फल
          - हरी सब्ज़ियाँ
        alt: भोजन के तीन समूह और उनके उदाहरण।
      check:
        prompt: संतुलित आहार में क्या होता है?
        options:
        - सब तरह का भोजन थोड़ा-थोड़ा
        - केवल मिठाई
        - केवल चावल
        answer: सब तरह का भोजन थोड़ा-थोड़ा
        why: शरीर को हर समूह की ज़रूरत है।
    - teach: 'भारत के हर राज्य का खाना अलग है: केरल में चावल-सांबर और पुट्टु, पंजाब में रोटी और सरसों का साग, गुजरात में ढोकला। घर का ताज़ा खाना अच्छा है; चिप्स जैसा जंक फ़ूड कम खाएँ।'
      check:
        prompt: ढोकला किस राज्य का प्रसिद्ध खाना है?
        options:
        - गुजरात
        - केरल
        - पंजाब
        answer: गुजरात
        why: ढोकला गुजरात का प्रसिद्ध नाश्ता है।
  items:
  - prompt: '''आहार'' का अर्थ है:'
    options:
    - भोजन
    - कपड़ा
    - घर
    - खेल
    answer: भोजन
    difficulty: 1
    hints:
    - जो हम खाते हैं।
    - खाना।
    solution: आहार यानी भोजन।
    mistakes:
      खेल: hin4_word
  - prompt: संतुलित आहार में क्या होना चाहिए?
    options:
    - अनाज, दाल, दूध, फल और सब्ज़ियाँ
    - केवल मिठाई
    - केवल चिप्स
