    - दाल-बाटी
    - सरसों का साग
    answer: पुट्टु या अप्पम
    difficulty: 2
    hints:
    - केरल में चावल और नारियल ज़्यादा होते हैं।
    - चावल के आटे से बने नाश्ते।
    solution: 'चरण 1: केरल में चावल और नारियल खूब होते हैं। चरण 2: पुट्टु और अप्पम वहाँ के नाश्ते हैं।'
    mistakes:
      दाल-बाटी: c4h4_rajya
      सरसों का साग: c4h4_rajya
  - prompt: '''ताज़ा'' का विलोम शब्द है:'
    options:
    - बासी
    - गरम
    - मीठा
    answer: बासी
    difficulty: 2
    hints:
    - कल का बचा खाना कैसा कहलाता है?
    - ताज़ा = अभी बना।
    solution: 'चरण 1: ताज़ा = अभी बना। चरण 2: पुराना रखा खाना बासी कहलाता है।'
    mistakes:
      गरम: c4h4_shabd
      मीठा: c4h4_shabd
  - prompt: एक दिन में बच्चे को लगभग कितने गिलास पानी पीना चाहिए?
    options:
    - 6 से 8 गिलास
    - एक भी नहीं
    - 50 गिलास
