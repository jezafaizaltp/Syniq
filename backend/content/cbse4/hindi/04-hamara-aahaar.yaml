    - कोल्ड ड्रिंक
    - केवल चाय
    - कुछ नहीं
    answer: साफ़ पानी
    difficulty: 1
    hints:
    - शरीर को चाहिए।
    - प्यास।
    solution: साफ़ पानी पीना ज़रूरी है।
    mistakes: {"कोल्ड ड्रिंक": "h4_paani", "केवल चाय": "h4_paani", "कुछ नहीं": "h4_paani"}
  - prompt: इनमें से कौन-सा भोजन बीमारी से बचाता है?
    options:
