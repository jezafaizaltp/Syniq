    - हम दिन में तीन बार इसे करते हैं।
    solution: 'चरण 1: आहार = भोजन। चरण 2: भोजन का समान शब्द खाना है।'
    mistakes:
      पानी: c4h4_shabd
      बर्तन: c4h4_shabd
  - prompt: रोज़ केवल चिप्स और ठंडा पेय लेने से क्या होगा?
    options:
    - शरीर कमज़ोर होगा
    - शरीर बहुत ताक़तवर होगा
    - कभी भूख नहीं लगेगी
    answer: शरीर कमज़ोर होगा
    difficulty: 2
    hints:
    - इनमें शरीर बढ़ाने और बचाने वाले भोजन नहीं हैं।
    - शरीर को जो चाहिए, वह नहीं मिलेगा।
    solution: 'चरण 1: जंक फ़ूड में ज़रूरी चीज़ें नहीं होतीं। चरण 2: इससे शरीर कमज़ोर होता है।'
    mistakes:
      शरीर बहुत ताक़तवर होगा: c4h4_bhojan
      कभी भूख नहीं लगेगी: c4h4_bhojan
  - prompt: खाना बर्बाद न हो, इसके लिए क्या करें?
    options:
    - थाली में उतना ही लें जितना खा सकें
    - आधा खाना फेंक दें
    - बहुत ज़्यादा बना लें
    answer: थाली में उतना ही लें जितना खा सकें
    difficulty: 1
    hints:
    - बचा हुआ खाना कहाँ जाता है?
    - पहले थोड़ा लो, ज़रूरत हो तो फिर लो।
    solution: 'चरण 1: ज़्यादा लेने से खाना बचता है और फेंका जाता है। चरण 2: उतना ही लो जितना खा सको।'
    mistakes:
      आधा खाना फेंक दें: c4h4_bhojan
      बहुत ज़्यादा बना लें: c4h4_bhojan
  - prompt: केरल के लोग नाश्ते में अक्सर क्या खाते हैं?
    options:
