subject: cbse4-hin
chapter: 4
title: हमारा आहार
tips:
  h4_junk: "जंक फ़ूड पैकेट में आता है, तला-भुना और नमक भरा होता है। इनमें से कौन-सा घर या पेड़ से नहीं, पैकेट से आता है?"
  h4_kerala_khana: "साग पंजाब का, ढोकला गुजरात का, लिट्टी-चोखा बिहार का। केरल के घरों में केले के पत्ते पर दाल-सब्ज़ी वाला कौन-सा खाना?"
  h4_mote_anaj: "रागी और बाजरा से रोटी बनती है, जैसे गेहूँ से। तो ये किस समूह के हैं? उनके दाने कैसे होते हैं?"
  h4_paani: "शरीर का बहुत बड़ा हिस्सा किससे बना है? मीठे पेय उसकी जगह नहीं ले सकते।"
  h4_santulit: "'संतुलित' मतलब तराज़ू के दोनों पलड़े बराबर। 'केवल' एक चीज़ से थाली संतुलित होगी?"

concepts:
- code: cbse4h.v4.aahaar
  title: हमारा आहार
  notes: |
    'आहार' यानी भोजन। पाठ हमारे भोजन के बारे में है: संतुलित आहार में अनाज (चावल, गेहूँ, रागी), दालें, दूध, फल और
    सब्ज़ियाँ होनी चाहिए; पानी भी ज़रूरी है। भारत के अलग-अलग राज्यों के भोजन अलग हैं: केरल में चावल और सांबर, पंजाब में
    रोटी और सरसों का साग। ताज़ा, घर का खाना अच्छा है; जंक फ़ूड कम खाएँ। (पाठ की ठीक बातें यहाँ नहीं दी गई हैं।)
  explanations:
    text: आहार यानी भोजन। अच्छे आहार में अनाज, दालें, दूध, फल और सब्ज़ियाँ होती हैं, इसे संतुलित आहार कहते हैं। हर राज्य का खाना अलग होता है, पर ताज़ा और घर का खाना सबसे अच्छा है।
    visual: 'चित्र बनाइए: एक थाली में चावल, दाल, सब्ज़ी, दही और एक फल, साथ में पानी का गिलास।'
    step_by_step: 1. अपनी थाली देखें। 2. अनाज, दाल, सब्ज़ी, फल हैं क्या? 3. जो कम है, उसे जोड़ें। 4. पानी पिएँ।
    real_world: स्कूल के मिड-डे मील में चावल या रोटी, दाल और सब्ज़ी दी जाती है।
  picture:
    kind: compare
    columns:
    - title: राज्य
      points:
      - केरल
      - पंजाब
      - गुजरात
    - title: प्रसिद्ध भोजन
      points:
      - चावल, सांबर, अवियल
      - रोटी, सरसों का साग
      - ढोकला, थेपला
    alt: केरल में चावल, सांबर और अवियल, पंजाब में रोटी और सरसों का साग, और गुजरात में ढोकला और थेपला प्रसिद्ध हैं।
  activity:
    type: sort
    prompt: संतुलित आहार की थाली में क्या ज़्यादा रखें, क्या कम?
    bins:
    - रोज़ ज़रूरी
    - कम खाएँ
    items:
    - label: चावल, गेहूँ, रागी
      bin: रोज़ ज़रूरी
      clue: अनाज से ताक़त मिलती है?
      why: अनाज संतुलित आहार का हिस्सा।
    - label: दालें
      bin: रोज़ ज़रूरी
      clue: दाल शरीर बनाने में मदद करती है?
      why: दालें ज़रूरी।
    - label: फल और सब्ज़ियाँ
      bin: रोज़ ज़रूरी
      clue: रंग-बिरंगी थाली में क्या होता है?
      why: फल-सब्ज़ी रोज़।
    - label: दूध
      bin: रोज़ ज़रूरी
      clue: हड्डियों के लिए क्या?
      why: दूध ज़रूरी।
    - label: जंक फ़ूड
      bin: कम खाएँ
      clue: पाठ जंक फ़ूड के बारे में क्या कहता है?
      why: जंक फ़ूड कम खाएँ।
  items:
  - prompt: '''आहार'' का अर्थ है:'
    options:
    - भोजन
    - कपड़ा
    - घर
    - खेल
    answer: भोजन
    difficulty: 1
    hints:
    - जो हम खाते हैं।
    - खाना।
    solution: आहार यानी भोजन।
    mistakes:
      खेल: hin4_word
  - prompt: संतुलित आहार में क्या होना चाहिए?
    options:
    - अनाज, दाल, दूध, फल और सब्ज़ियाँ
    - केवल मिठाई
    - केवल चिप्स
    - केवल चाय
    answer: अनाज, दाल, दूध, फल और सब्ज़ियाँ
    difficulty: 1
    hints:
    - सब कुछ थोड़ा-थोड़ा।
    - संतुलन।
    solution: संतुलित आहार में सभी प्रकार का भोजन होता है।
    mistakes: {"केवल मिठाई": "h4_santulit", "केवल चिप्स": "h4_santulit", "केवल चाय": "h4_santulit"}
  - prompt: केरल का प्रसिद्ध भोजन कौन-सा है?
    options:
    - चावल और सांबर
    - सरसों का साग
    - ढोकला
    - लिट्टी-चोखा
    answer: चावल और सांबर
    difficulty: 1
    hints:
    - दक्षिण भारत।
    - हमारा राज्य।
    solution: केरल में चावल और सांबर प्रसिद्ध हैं।
    mistakes: {"सरसों का साग": "h4_kerala_khana", "ढोकला": "h4_kerala_khana", "लिट्टी-चोखा": "h4_kerala_khana"}
  - prompt: इनमें से कौन-सा जंक फ़ूड है?
    options:
    - चिप्स
    - केला
    - दाल
    - दही
    answer: चिप्स
    difficulty: 1
    hints:
    - पैकेट वाला।
    - तला हुआ, नमकीन।
    solution: चिप्स जंक फ़ूड है।
    mistakes: {"केला": "h4_junk", "दाल": "h4_junk", "दही": "h4_junk"}
  - prompt: रागी और बाजरा क्या हैं?
    options:
    - मोटे अनाज
    - फल
    - मिठाई
    - सब्ज़ी
    answer: मोटे अनाज
    difficulty: 2
    hints:
    - अनाज के छोटे दाने।
    - मिलेट्स।
    solution: रागी और बाजरा मोटे अनाज हैं।
    mistakes: {"फल": "h4_mote_anaj", "मिठाई": "h4_mote_anaj", "सब्ज़ी": "h4_mote_anaj"}
  - prompt: भोजन के साथ हमें और क्या ज़रूरी है?
    options:
    - साफ़ पानी
    - कोल्ड ड्रिंक
    - केवल चाय
    - कुछ नहीं
    answer: साफ़ पानी
    difficulty: 1
    hints:
    - शरीर को चाहिए।
    - प्यास।
    solution: साफ़ पानी पीना ज़रूरी है।
    mistakes: {"कोल्ड ड्रिंक": "h4_paani", "केवल चाय": "h4_paani", "कुछ नहीं": "h4_paani"}
