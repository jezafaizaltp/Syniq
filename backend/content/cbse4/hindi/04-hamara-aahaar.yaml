    - सरसों के पत्तों से बनी सब्ज़ी।
    solution: 'चरण 1: पुट्टु केरल का, इडली दक्षिण का खाना है। चरण 2: पंजाब में मक्के की रोटी और सरसों का साग प्रसिद्ध है।'
    mistakes:
      पुट्टु और कडला करी: c4h4_rajya
      इडली-सांबर: c4h4_rajya
  - prompt: खाना खाने से पहले क्या करना चाहिए?
