subject: cbse4-hin
chapter: 10
title: कैमरा
tips:
  h4_lens: "चश्मे और सूक्ष्मदर्शी में भी ऐसा ही गोल, घुमावदार काँच होता है जो रोशनी को मोड़ता है।"
  h4_mobile: "आजकल लगभग सबकी जेब में एक छोटा यंत्र है जिससे बात भी होती है और फ़ोटो भी।"
  h4_tasveer: "सालों बाद पुराना एल्बम खोलो, तो बीते दिन कैसे लौट आते हैं?"
  c4h10_camera: 'सोचो: कैमरे में रोशनी कहाँ से अंदर जाती है और तस्वीर कहाँ बनती है?'
  c4h10_niyam: 'सोचो: अगर कोई बिना पूछे तुम्हारी फ़ोटो ले, तो तुम्हें कैसा लगेगा?'
  c4h10_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v10.camera
  title: कैमरा
  notes: |
    कैमरे के बारे में पाठ। कैमरा तस्वीरें (फ़ोटो) खींचता है; रोशनी लेंस से होकर अंदर जाती है और चित्र बनता है। पहले रील
    वाले कैमरे थे, अब डिजिटल कैमरे और मोबाइल फ़ोन के कैमरे हैं। तस्वीरें यादें सँभालती हैं। किसी की फ़ोटो लेने से पहले
    अनुमति लेनी चाहिए। (पाठ की ठीक बातें यहाँ नहीं दी गई हैं।)
  explanations:
    text: कैमरा तस्वीरें खींचने का यंत्र है। रोशनी उसके लेंस से अंदर जाती है और चित्र बन जाता है। पहले रील वाले कैमरे थे, अब फ़ोन में भी कैमरा होता है। तस्वीरें हमारी यादें सँभालकर रखती हैं।
    visual: 'चित्र बनाइए: एक कैमरा जिसका गोल लेंस आगे है, और सामने खड़ा परिवार मुस्कुरा रहा है।'
    step_by_step: 1. कैमरा क्या करता है? 2. रोशनी कहाँ से जाती है? लेंस से। 3. पुराने और नए कैमरे में क्या फ़र्क़ है? 4. फ़ोटो लेने से पहले क्या करें? अनुमति लें।
    real_world: शादी, जन्मदिन और स्कूल के कार्यक्रमों की तस्वीरें हम सालों तक देखते हैं।
  picture:
    kind: flow
    steps:
    - रोशनी चीज़ से टकराती है
    - लेंस से कैमरे में जाती है
    - चित्र बनता है
    - फ़ोटो तैयार
    alt: रोशनी चीज़ से टकराकर लेंस से कैमरे में जाती है, चित्र बनता है और फ़ोटो तैयार हो जाती है।
  activity:
    type: order
    prompt: कैमरे में चित्र कैसे बनता है? क्रम से लगाओ।
    steps:
    - रोशनी चीज़ से टकराती है
    - रोशनी लेंस से अंदर जाती है
    - अंदर चित्र बनता है
    - चित्र यादों में सँभल जाता है
    reasons:
      रोशनी लेंस से अंदर जाती है: चीज़ से आई रोशनी ही लेंस तक पहुँचती है।
      अंदर चित्र बनता है: लेंस से अंदर गई रोशनी ही चित्र बनाती है।
      चित्र यादों में सँभल जाता है: चित्र बनने के बाद ही उसे रखा जा सकता है।
  lesson:
    - teach: कैमरा तस्वीर (फ़ोटो) खींचने का यंत्र है। कैमरे के आगे एक गोल काँच होता है जिसे लेंस कहते हैं। रोशनी लेंस से होकर अंदर जाती है और तस्वीर बनती है।
      check:
        prompt: कैमरे में रोशनी किससे होकर अंदर जाती है?
        options:
        - लेंस से
        - बटन से
        - बैटरी से
        answer: लेंस से
        why: लेंस रोशनी को अंदर ले जाता है।
      ways:
      - style: visual
        teach: कैमरे के अंदर तस्वीर कैसे बनती है, एक-एक कदम क्रम से।
        picture:
          kind: flow
          steps:
          - किसी चीज़ पर रोशनी पड़ती है
          - रोशनी वहाँ से लौटकर लेंस में जाती है
          - लेंस रोशनी को अंदर एक जगह इकट्ठा करता है
          - अंदर तस्वीर बन जाती है
          alt: किसी चीज़ पर रोशनी पड़ती है, रोशनी लौटकर लेंस में जाती है, लेंस उसे अंदर एक जगह इकट्ठा करता है और तस्वीर बन जाती है।
      - style: real_world
        teach: हमारी आँख भी कैमरे जैसी है। आँख के आगे भी एक लेंस होता है। अँधेरे में आँख भी कुछ नहीं देख पाती, क्योंकि देखने के लिए रोशनी चाहिए।
    - teach: पहले रील वाले कैमरे होते थे; फ़ोटो धुलवानी पड़ती थी। अब डिजिटल कैमरे और मोबाइल फ़ोन हैं, जिनमें फ़ोटो तुरंत दिख जाती है।
      picture:
        kind: flow
        steps:
        - रील वाला कैमरा
        - डिजिटल कैमरा
        - मोबाइल फ़ोन का कैमरा
        alt: 'कैमरे का बदलता रूप: रील से डिजिटल और मोबाइल तक।'
      check:
        prompt: आजकल ज़्यादातर लोग किससे फ़ोटो लेते हैं?
        options:
        - मोबाइल फ़ोन से
        - रील वाले कैमरे से
        - दूरबीन से
        answer: मोबाइल फ़ोन से
        why: मोबाइल में कैमरा लगा होता है।
      ways:
      - style: step_by_step
        teach: 'मोबाइल से अच्छी फ़ोटो खींचो। पहला: लेंस को साफ़ कपड़े से पोंछो। दूसरा: ध्यान रखो कि रोशनी तुम्हारे पीछे से चीज़ पर पड़े। तीसरा: फ़ोन को दोनों हाथों से स्थिर पकड़ो। चौथा: चीज़ पर उँगली रखकर साफ़ करो, फिर बटन दबाओ।'
      - style: real_world
        teach: पुराने समय में फ़ोटो खिंचवाने स्टूडियो जाना पड़ता था, और फ़ोटो कई दिन बाद मिलती थी। इसलिए दादा-दादी के पास अपनी बचपन की बहुत कम तस्वीरें होती हैं।
    - teach: तस्वीरें हमारी यादें सँभालकर रखती हैं। पर किसी की फ़ोटो लेने से पहले उनसे अनुमति (इजाज़त) लेनी चाहिए, और बिना पूछे किसी की फ़ोटो किसी को नहीं भेजनी चाहिए।
      check:
        prompt: दोस्त की फ़ोटो लेने से पहले क्या करना चाहिए?
        options:
        - उससे पूछना
        - छिपकर लेना
        - सबको भेज देना
        answer: उससे पूछना
        why: हर किसी की अनुमति ज़रूरी है।
      ways:
      - style: visual
        teach: फ़ोटो खींचने और भेजने में क्या ठीक है और क्या ठीक नहीं।
        picture:
          kind: compare
          columns:
          - title: ठीक है
            points:
            - पूछकर फ़ोटो लेना
            - परिवार के साथ फ़ोटो देखना
            - कोई मना करे तो रुक जाना
          - title: ठीक नहीं
            points:
            - बिना पूछे किसी की फ़ोटो लेना
            - किसी का मज़ाक बनाने के लिए फ़ोटो भेजना
            - अनजान लोगों को अपनी फ़ोटो भेजना
          alt: पूछकर फ़ोटो लेना, परिवार के साथ फ़ोटो देखना और कोई मना करे तो रुक जाना ठीक है। बिना पूछे फ़ोटो लेना, मज़ाक बनाने के लिए फ़ोटो भेजना और अनजान लोगों को अपनी फ़ोटो भेजना ठीक नहीं।
      - style: real_world
        teach: जन्मदिन की पार्टी में कोई दोस्त कहे, 'मेरी यह फ़ोटो मत भेजना, मुझे अच्छी नहीं लगी', तो उसकी बात मानना ही दोस्ती है। हर किसी को अपनी तस्वीर पर हक़ है।
  items:
  - prompt: कैमरे से क्या करते हैं?
    options:
    - तस्वीर खींचते हैं
    - खाना पकाते हैं
    - कपड़े धोते हैं
    - गाना गाते हैं
    answer: तस्वीर खींचते हैं
    difficulty: 1
    hints:
    - फ़ोटो।
    - क्लिक।
    solution: कैमरे से तस्वीर खींचते हैं।
    mistakes:
      गाना गाते हैं: hin4_read_again
  - prompt: कैमरे के आगे लगे गोल काँच को क्या कहते हैं?
    options:
    - लेंस
    - पहिया
    - बटन
    - तार
    answer: लेंस
    difficulty: 2
    hints:
    - रोशनी यहाँ से जाती है।
    - चश्मे में भी।
    solution: उसे लेंस कहते हैं।
    mistakes: {"पहिया": "h4_lens", "बटन": "h4_lens", "तार": "h4_lens"}
  - prompt: किसी की फ़ोटो लेने से पहले क्या करना चाहिए?
    options:
    - उनसे अनुमति लेनी चाहिए
    - छिपकर लेनी चाहिए
    - कुछ नहीं
    - चिल्लाना चाहिए
    answer: उनसे अनुमति लेनी चाहिए
    difficulty: 1
    hints:
    - शिष्टाचार।
    - पूछना।
    solution: पहले अनुमति लेना अच्छा है।
    mistakes:
      छिपकर लेनी चाहिए: hin4_lesson
  - prompt: आजकल ज़्यादातर लोग फ़ोटो किससे खींचते हैं?
    options:
    - मोबाइल फ़ोन से
    - चम्मच से
    - किताब से
    - पेंसिल से
    answer: मोबाइल फ़ोन से
    difficulty: 1
    hints:
    - जेब में।
    - फ़ोन में कैमरा।
    solution: आजकल मोबाइल फ़ोन से फ़ोटो खींचते हैं।
    mistakes: {"चम्मच से": "h4_mobile", "किताब से": "h4_mobile", "पेंसिल से": "h4_mobile"}
  - prompt: तस्वीरें हमारे लिए क्यों ख़ास हैं?
    options:
    - वे यादें सँभालकर रखती हैं
    - वे खाने के काम आती हैं
    - वे गाना गाती हैं
    - वे बेकार हैं
    answer: वे यादें सँभालकर रखती हैं
    difficulty: 1
    hints:
    - पुरानी फ़ोटो देखना।
    - याद।
    solution: तस्वीरें यादें सँभालती हैं।
    mistakes: {"वे खाने के काम आती हैं": "h4_tasveer", "वे गाना गाती हैं": "h4_tasveer", "वे बेकार हैं": "h4_tasveer"}
  - prompt: '''तस्वीर'' का दूसरा शब्द है:'
    options:
    - चित्र
    - चिट्ठी
    - चक्कर
    - चटनी
    answer: चित्र
    difficulty: 1
    hints:
    - फ़ोटो।
    - Picture।
    solution: तस्वीर यानी चित्र।
    mistakes:
      चिट्ठी: hin4_word
  - prompt: '''अनुमति'' का अर्थ है:'
    options:
    - इजाज़त
    - इनाम
    - झगड़ा
    answer: इजाज़त
    difficulty: 1
    hints:
    - फ़ोटो लेने से पहले यह माँगते हैं।
    - '''हाँ, ले लो'' कहना।'
    solution: 'चरण 1: फ़ोटो से पहले पूछते हैं। चरण 2: अनुमति = इजाज़त।'
    mistakes:
      इनाम: c4h10_shabd
      झगड़ा: c4h10_shabd
  - prompt: अँधेरे कमरे में बिना रोशनी के फ़ोटो साफ़ क्यों नहीं आती?
    options:
    - तस्वीर बनाने के लिए रोशनी चाहिए
    - कैमरा सो जाता है
    - लेंस पिघल जाता है
    answer: तस्वीर बनाने के लिए रोशनी चाहिए
    difficulty: 2
    hints:
    - कैमरा कैसे तस्वीर बनाता है?
    - लेंस से क्या अंदर जाता है?
    solution: 'चरण 1: कैमरा रोशनी से तस्वीर बनाता है। चरण 2: अँधेरे में रोशनी कम है, इसलिए फ़ोटो साफ़ नहीं आती।'
    mistakes:
      कैमरा सो जाता है: c4h10_camera
      लेंस पिघल जाता है: c4h10_camera
  - prompt: किसी अनजान व्यक्ति को अपनी फ़ोटो ऑनलाइन भेजना कैसा है?
    options:
    - ठीक नहीं, ख़तरनाक हो सकता है
    - बहुत अच्छा
    - ज़रूरी है
    answer: ठीक नहीं, ख़तरनाक हो सकता है
    difficulty: 2
    hints:
    - अनजान व्यक्ति कौन है, हमें पता नहीं।
    - बड़ों से पूछे बिना कुछ न भेजो।
    solution: 'चरण 1: अनजान लोग भरोसे के नहीं होते। चरण 2: अपनी फ़ोटो भेजना ख़तरनाक हो सकता है।'
    mistakes:
      बहुत अच्छा: c4h10_niyam
      ज़रूरी है: c4h10_niyam
  - prompt: '''तस्वीर'' का बहुवचन क्या है?'
    options:
    - तस्वीरें
    - तस्वीरों
    - तस्वीरा
    answer: तस्वीरें
    difficulty: 1
    hints:
    - किताब से किताबें बनता है।
    - अंत में 'ें' लगाओ।
    solution: 'चरण 1: किताब → किताबें जैसा नियम। चरण 2: तस्वीर → तस्वीरें।'
    mistakes:
      तस्वीरों: c4h10_shabd
      तस्वीरा: c4h10_shabd
  - prompt: पुरानी पारिवारिक फ़ोटो देखकर हमें क्या मिलता है?
    options:
    - बीते दिनों की यादें
    - भूख
    - नींद
    answer: बीते दिनों की यादें
    difficulty: 1
    hints:
    - फ़ोटो किसी पल को सँभालती है।
    - उस पल की बातें मन में आती हैं।
    solution: 'चरण 1: फ़ोटो पुराने पल दिखाती है। चरण 2: इससे बीते दिनों की यादें ताज़ा होती हैं।'
    mistakes:
      भूख: c4h10_camera
      नींद: c4h10_camera
  - prompt: लेंस पर उँगली के निशान हों तो फ़ोटो कैसी आएगी?
    options:
    - धुँधली
    - और साफ़
    - रंगीन से काली-सफ़ेद
    answer: धुँधली
    difficulty: 3
    hints:
    - रोशनी लेंस से होकर जाती है।
    - गंदा काँच हो तो उसके पार कैसा दिखता है?
    solution: 'चरण 1: गंदा लेंस रोशनी बिगाड़ देता है। चरण 2: फ़ोटो धुँधली आती है।'
    mistakes:
