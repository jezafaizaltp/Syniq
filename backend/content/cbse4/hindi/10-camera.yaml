subject: cbse4-hin
chapter: 10
title: कैमरा
tips:
  h4_lens: "चश्मे और सूक्ष्मदर्शी में भी ऐसा ही गोल, घुमावदार काँच होता है जो रोशनी को मोड़ता है।"
  h4_mobile: "आजकल लगभग सबकी जेब में एक छोटा यंत्र है जिससे बात भी होती है और फ़ोटो भी।"
  h4_tasveer: "सालों बाद पुराना एल्बम खोलो, तो बीते दिन कैसे लौट आते हैं?"

concepts:
- code: cbse4h.v10.camera
  title: कैमरा
  notes: |
    कैमरे के बारे में पाठ। कैमरा तस्वीरें (फ़ोटो) खींचता है; रोशनी लेंस से होकर अंदर जाती है और चित्र बनता है। पहले रील
    वाले कैमरे थे, अब डिजिटल कैमरे और मोबाइल फ़ोन के कैमरे हैं। तस्वीरें यादें सँभालती हैं। किसी की फ़ोटो लेने से पहले
    अनुमति लेनी चाहिए। (पाठ की ठीक बातें यहाँ नहीं दी गई हैं।)
  explanations:
    text: कैमरा तस्वीरें खींचने का यंत्र है। रोशनी उसके लेंस से अंदर जाती है और चित्र बन जाता है। पहले रील वाले कैमरे थे, अब फ़ोन में भी कैमरा होता है। तस्वीरें हमारी यादें सँभालकर रखती हैं।
    visual: 'चित्र बनाइए: एक कैमरा जिसका गोल लेंस आगे है, और सामने खड़ा परिवार मुस्कुरा रहा है।'
    step_by_step: 1. कैमरा क्या करता है? 2. रोशनी कहाँ से जाती है? लेंस से। 3. पुराने और नए कैमरे में क्या फ़र्क़ है? 4. फ़ोटो लेने से पहले क्या करें? अनुमति लें।
    real_world: शादी, जन्मदिन और स्कूल के कार्यक्रमों की तस्वीरें हम सालों तक देखते हैं।
  picture:
    kind: flow
    steps:
    - रोशनी चीज़ से टकराती है
    - लेंस से कैमरे में जाती है
    - चित्र बनता है
    - फ़ोटो तैयार
    alt: रोशनी चीज़ से टकराकर लेंस से कैमरे में जाती है, चित्र बनता है और फ़ोटो तैयार हो जाती है।
  activity:
    type: order
    prompt: कैमरे में चित्र कैसे बनता है? क्रम से लगाओ।
    steps:
    - रोशनी चीज़ से टकराती है
    - रोशनी लेंस से अंदर जाती है
    - अंदर चित्र बनता है
    - चित्र यादों में सँभल जाता है
    reasons:
      रोशनी लेंस से अंदर जाती है: चीज़ से आई रोशनी ही लेंस तक पहुँचती है।
      अंदर चित्र बनता है: लेंस से अंदर गई रोशनी ही चित्र बनाती है।
      चित्र यादों में सँभल जाता है: चित्र बनने के बाद ही उसे रखा जा सकता है।
  items:
  - prompt: कैमरे से क्या करते हैं?
    options:
    - तस्वीर खींचते हैं
    - खाना पकाते हैं
    - कपड़े धोते हैं
    - गाना गाते हैं
    answer: तस्वीर खींचते हैं
    difficulty: 1
    hints:
    - फ़ोटो।
    - क्लिक।
    solution: कैमरे से तस्वीर खींचते हैं।
    mistakes:
      गाना गाते हैं: hin4_read_again
  - prompt: कैमरे के आगे लगे गोल काँच को क्या कहते हैं?
    options:
    - लेंस
    - पहिया
    - बटन
    - तार
    answer: लेंस
    difficulty: 2
    hints:
    - रोशनी यहाँ से जाती है।
    - चश्मे में भी।
    solution: उसे लेंस कहते हैं।
    mistakes: {"पहिया": "h4_lens", "बटन": "h4_lens", "तार": "h4_lens"}
  - prompt: किसी की फ़ोटो लेने से पहले क्या करना चाहिए?
    options:
    - उनसे अनुमति लेनी चाहिए
    - छिपकर लेनी चाहिए
    - कुछ नहीं
    - चिल्लाना चाहिए
    answer: उनसे अनुमति लेनी चाहिए
    difficulty: 1
    hints:
    - शिष्टाचार।
    - पूछना।
    solution: पहले अनुमति लेना अच्छा है।
    mistakes:
      छिपकर लेनी चाहिए: hin4_lesson
  - prompt: आजकल ज़्यादातर लोग फ़ोटो किससे खींचते हैं?
    options:
    - मोबाइल फ़ोन से
    - चम्मच से
    - किताब से
    - पेंसिल से
    answer: मोबाइल फ़ोन से
    difficulty: 1
    hints:
    - जेब में।
    - फ़ोन में कैमरा।
    solution: आजकल मोबाइल फ़ोन से फ़ोटो खींचते हैं।
    mistakes: {"चम्मच से": "h4_mobile", "किताब से": "h4_mobile", "पेंसिल से": "h4_mobile"}
  - prompt: तस्वीरें हमारे लिए क्यों ख़ास हैं?
    options:
    - वे यादें सँभालकर रखती हैं
    - वे खाने के काम आती हैं
    - वे गाना गाती हैं
    - वे बेकार हैं
    answer: वे यादें सँभालकर रखती हैं
    difficulty: 1
    hints:
    - पुरानी फ़ोटो देखना।
    - याद।
    solution: तस्वीरें यादें सँभालती हैं।
    mistakes: {"वे खाने के काम आती हैं": "h4_tasveer", "वे गाना गाती हैं": "h4_tasveer", "वे बेकार हैं": "h4_tasveer"}
  - prompt: '''तस्वीर'' का दूसरा शब्द है:'
    options:
    - चित्र
    - चिट्ठी
    - चक्कर
    - चटनी
    answer: चित्र
    difficulty: 1
    hints:
    - फ़ोटो।
    - Picture।
    solution: तस्वीर यानी चित्र।
    mistakes:
      चिट्ठी: hin4_word
