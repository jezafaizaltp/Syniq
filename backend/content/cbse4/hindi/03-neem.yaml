subject: cbse4-hin
chapter: 3
title: नीम
tips:
  h4_datun: "पुराने समय में टूथब्रश नहीं था। सुबह लोग नीम की टहनी चबाकर क्या करते थे?"
  h4_neem_anaj: "नीम कड़वा है और कीटाणुओं से लड़ता है। अनाज के डिब्बे में कौन घुसकर दाने खा जाता है?"
  h4_neem_chhaya: "दोपहर की धूप में घना नीम पेड़ ज़मीन पर क्या बिछा देता है?"
  c4h3_gun: 'नीम के हर भाग को याद करो: पत्ती, टहनी, छाल, तेल। हर भाग किस काम आता है?'
  c4h3_ped: 'सोचो: एक बड़ा पेड़ हमें और धरती को क्या-क्या देता है?'
  c4h3_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। कौन-सा अर्थ ठीक बैठता है?

concepts:
- code: cbse4h.v3.neem
  title: नीम
  notes: |
    नीम के पेड़ पर पाठ। नीम का पेड़ बड़ा और छायादार होता है। इसकी पत्तियाँ कड़वी होती हैं पर बहुत गुणकारी हैं: पत्तियाँ
    कीड़े दूर रखती हैं, अनाज और कपड़ों में रखी जाती हैं; टहनी से दातुन करते हैं; छाल और तेल दवा में काम आते हैं।
    नीम हवा को साफ़ रखने में मदद करता है। (पाठ की ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।)
  explanations:
    text: 'नीम एक बड़ा, छायादार पेड़ है। उसकी पत्तियाँ कड़वी होती हैं, पर बहुत काम की हैं: वे कीड़ों को दूर रखती हैं। नीम की टहनी से दातुन करते हैं और उसका तेल दवा में काम आता है।'
    visual: 'चित्र बनाइए: एक बड़ा नीम का पेड़, उसकी छाया में बैठे बच्चे, एक बच्चा नीम की टहनी से दातुन कर रहा है।'
    step_by_step: 1. नीम कैसा पेड़ है? बड़ा, छायादार। 2. पत्तियों का स्वाद? कड़वा। 3. नीम के उपयोग लिखें। 4. नीम से क्या सीखें?
    real_world: कई घरों में अनाज के डिब्बों में नीम की सूखी पत्तियाँ रखते हैं ताकि कीड़े न लगें।
  picture:
    kind: compare
    columns:
    - title: नीम का भाग
      points:
      - पत्ती
      - टहनी
      - तेल
    - title: उपयोग
      points:
      - कीड़े दूर रखना
      - दातुन
      - दवा
    alt: नीम की पत्ती कीड़े दूर रखती है, टहनी से दातुन होता है, और तेल दवा में काम आता है।
  activity:
    type: sort
    prompt: नीम का कौन-सा भाग किस काम आता है?
    bins:
    - पत्तियाँ
    - टहनी
    - तेल और छाल
    items:
    - label: कीड़े दूर रखना
      bin: पत्तियाँ
      clue: अनाज और कपड़ों में क्या रखते हैं?
      why: नीम की पत्तियाँ कीड़े दूर रखती हैं।
    - label: अनाज में रखना
      bin: पत्तियाँ
      clue: डिब्बे में अनाज के साथ क्या डालते हैं?
      why: पत्तियाँ।
    - label: दातुन
      bin: टहनी
      clue: दाँत साफ़ करने के लिए क्या तोड़ते हैं?
      why: नीम की टहनी से दातुन।
    - label: दवा
      bin: तेल और छाल
      clue: पेड़ का कौन-सा भाग दवा बनता है?
      why: छाल और तेल दवा में काम आते हैं।
  lesson:
    - teach: नीम एक बड़ा और छायादार पेड़ है। इसकी पत्तियाँ कड़वी होती हैं, पर बहुत गुणकारी हैं। गर्मी में लोग नीम की छाया में आराम करते हैं।
      check:
        prompt: नीम का पेड़ गर्मी में क्या देता है?
        options:
        - ठंडी छाया
        - बर्फ़
        - आग
        answer: ठंडी छाया
        why: बड़े, घने पेड़ धूप रोकते हैं।
    - teach: 'नीम के कई उपयोग हैं: पत्तियाँ अनाज और कपड़ों में रखते हैं ताकि कीड़े न लगें; टहनी से दातुन करते हैं; छाल और तेल दवा में काम आते हैं।'
      picture:
        kind: compare
        columns:
        - title: भाग
          points:
          - पत्तियाँ
          - टहनी
          - छाल और तेल
        - title: उपयोग
          points:
          - कीड़े दूर रखना
          - दातुन
          - दवा
        alt: नीम के भाग और उनके उपयोग।
      check:
        prompt: दातुन के लिए नीम का कौन-सा भाग काम आता है?
        options:
        - टहनी
        - फूल
        - जड़
        answer: टहनी
        why: पतली टहनी चबाकर दाँत साफ़ करते हैं।
    - teach: नीम हवा को साफ़ रखने में भी मदद करता है। इसीलिए गाँवों में घरों के पास नीम लगाया जाता है। पेड़ लगाना और उनकी रक्षा करना हमारा कर्तव्य है।
      check:
        prompt: गाँवों में घरों के पास नीम क्यों लगाते हैं?
        options:
        - छाया और साफ़ हवा के लिए
        - शोर के लिए
        - धूल के लिए
        answer: छाया और साफ़ हवा के लिए
        why: नीम छाया देता है और हवा साफ़ रखता है।
  items:
  - prompt: नीम की पत्तियों का स्वाद कैसा होता है?
    options:
    - कड़वा
    - मीठा
    - खट्टा
    - नमकीन
    answer: कड़वा
    difficulty: 1
    hints:
    - गुणकारी, पर अच्छा नहीं लगता।
    - करेले जैसा।
    solution: नीम की पत्तियाँ कड़वी होती हैं।
    mistakes:
      मीठा: hin4_read_again
  - prompt: नीम की टहनी से क्या करते हैं?
    options:
    - दातुन (दाँत साफ़)
    - खाना पकाना
    - कपड़े सिलना
    - पतंग उड़ाना
    answer: दातुन (दाँत साफ़)
    difficulty: 1
    hints:
    - सुबह।
    - दाँत।
    solution: नीम की टहनी से दातुन करते हैं।
    mistakes: {"खाना पकाना": "h4_datun", "कपड़े सिलना": "h4_datun", "पतंग उड़ाना": "h4_datun"}
  - prompt: अनाज में नीम की पत्तियाँ क्यों रखते हैं?
    options:
    - कीड़े दूर रखने के लिए
    - स्वाद के लिए
    - रंग के लिए
    - वज़न बढ़ाने के लिए
    answer: कीड़े दूर रखने के लिए
    difficulty: 2
    hints:
    - कीड़ों को नीम पसंद नहीं।
    - बचाव।
    solution: नीम कीड़ों को दूर रखता है।
    mistakes: {"स्वाद के लिए": "h4_neem_anaj", "रंग के लिए": "h4_neem_anaj", "वज़न बढ़ाने के लिए": "h4_neem_anaj"}
  - prompt: नीम का पेड़ हमें गर्मी में क्या देता है?
    options:
    - छाया
    - बर्फ़
    - बारिश
    - आग
    answer: छाया
    difficulty: 1
    hints:
    - पेड़ के नीचे।
    - ठंडक।
    solution: नीम घनी छाया देता है।
    mistakes: {"बर्फ़": "h4_neem_chhaya", "बारिश": "h4_neem_chhaya", "आग": "h4_neem_chhaya"}
  - prompt: '''कड़वा'' का विलोम शब्द है:'
    options:
    - मीठा
    - खट्टा
    - तीखा
    - फीका
    answer: मीठा
    difficulty: 1
    hints:
    - उलटा स्वाद।
    - चीनी।
    solution: कड़वा का विलोम मीठा है।
    mistakes: {"खट्टा": "h1_ulta", "तीखा": "h1_ulta", "फीका": "h1_ulta"}
  - prompt: नीम के बारे में कौन-सी बात सही है?
    options:
    - यह दवा के काम आता है
    - यह ज़हरीला खिलौना है
    - यह केवल रेगिस्तान में होता है
    - इसकी कोई उपयोगिता नहीं
    answer: यह दवा के काम आता है
    difficulty: 2
    hints:
    - गुणकारी।
    - तेल, छाल।
    solution: नीम के कई भाग दवा में काम आते हैं।
    mistakes:
      इसकी कोई उपयोगिता नहीं: hin4_lesson
  - prompt: कपड़ों की अलमारी में नीम की सूखी पत्तियाँ क्यों रखते हैं?
    options:
    - कीड़ों से बचाने के लिए
    - खुशबू के लिए
    - कपड़े रंगने के लिए
    answer: कीड़ों से बचाने के लिए
    difficulty: 2
    hints:
    - अनाज में भी इन्हें इसी कारण रखते हैं।
    - कड़वी पत्तियाँ किन्हें पसंद नहीं?
    solution: 'चरण 1: कीड़े नीम की कड़वाहट से दूर रहते हैं। चरण 2: इसलिए पत्तियाँ कपड़ों को बचाती हैं।'
    mistakes:
      खुशबू के लिए: c4h3_gun
      कपड़े रंगने के लिए: c4h3_gun
  - prompt: '''छायादार'' पेड़ कैसा होता है?'
    options:
    - जो घनी छाया दे
    - जो बहुत छोटा हो
    - जिसके पत्ते न हों
    answer: जो घनी छाया दे
    difficulty: 1
    hints:
    - शब्द में 'छाया' छिपी है।
    - '''दार'' का अर्थ है वाला।'
    solution: 'चरण 1: छाया + दार = छाया वाला। चरण 2: जो घनी छाया दे।'
    mistakes:
      जो बहुत छोटा हो: c4h3_shabd
      जिसके पत्ते न हों: c4h3_shabd
  - prompt: '''गुणकारी'' का अर्थ है:'
    options:
    - फ़ायदा देने वाला
    - नुकसान करने वाला
    - बेकार
    answer: फ़ायदा देने वाला
    difficulty: 2
    hints:
    - गुण = अच्छी बात।
    - नीम के कई फ़ायदे हैं।
    solution: 'चरण 1: गुण = अच्छाई। चरण 2: गुणकारी = फ़ायदा देने वाला।'
    mistakes:
      नुकसान करने वाला: c4h3_shabd
      बेकार: c4h3_shabd
  - prompt: पेड़ हमें इनमें से क्या देते हैं?
    options:
    - फल, छाया और साफ़ हवा
    - प्लास्टिक
    - धुआँ
    answer: फल, छाया और साफ़ हवा
    difficulty: 1
    hints:
    - प्लास्टिक और धुआँ कारख़ानों से आते हैं।
    - पेड़ों से मिलने वाली अच्छी चीज़ें सोचो।
    solution: 'चरण 1: पेड़ प्रकृति का हिस्सा हैं। चरण 2: वे फल, छाया और साफ़ हवा देते हैं।'
    mistakes:
      प्लास्टिक: c4h3_ped
      धुआँ: c4h3_ped
  - prompt: '''पेड़'' का समान अर्थ वाला शब्द कौन-सा है?'
    options:
    - वृक्ष
    - पत्ता
    - फूल
    answer: वृक्ष
    difficulty: 2
    hints:
    - पत्ता और फूल पेड़ के भाग हैं।
    - पूरे पेड़ का दूसरा नाम।
    solution: 'चरण 1: पत्ता और फूल केवल भाग हैं। चरण 2: पेड़ का पर्यायवाची वृक्ष है।'
    mistakes:
      पत्ता: c4h3_shabd
      फूल: c4h3_shabd
  - prompt: नीम का स्वाद कड़वा है, फिर भी लोग इसे क्यों पसंद करते हैं?
    options:
    - इसके बहुत गुण हैं
    - यह मीठा लगता है
    - इसका रंग नीला है
    answer: इसके बहुत गुण हैं
    difficulty: 2
    hints:
    - स्वाद अच्छा न हो, पर काम अच्छे हों।
    - दवा, दातुन, कीड़ों से बचाव।
    solution: 'चरण 1: नीम कड़वा है। चरण 2: पर इसके बहुत गुण हैं, इसलिए लोग इसे पसंद करते हैं।'
    mistakes:
      यह मीठा लगता है: c4h3_gun
      इसका रंग नीला है: c4h3_gun
  - prompt: स्कूल में पेड़ लगाने के बाद सबसे ज़रूरी काम क्या है?
    options:
    - रोज़ पानी देना और देखभाल करना
    - भूल जाना
    - पत्तियाँ तोड़ना
    answer: रोज़ पानी देना और देखभाल करना
    difficulty: 1
    hints:
    - छोटे पौधे को बढ़ने के लिए क्या चाहिए?
    - लगाकर छोड़ देने से क्या होगा?
    solution: 'चरण 1: छोटे पौधे को पानी और देखभाल चाहिए। चरण 2: तभी वह बड़ा पेड़ बनेगा।'
    mistakes:
      भूल जाना: c4h3_ped
      पत्तियाँ तोड़ना: c4h3_ped
  - prompt: '''दातुन'' किसे कहते हैं?'
    options:
    - दाँत साफ़ करने की टहनी
    - खाने की थाली
    - पानी का घड़ा
    answer: दाँत साफ़ करने की टहनी
    difficulty: 1
    hints:
    - शब्द में 'दात' (दाँत) छिपा है।
    - नीम की पतली टहनी चबाते हैं।
    solution: 'चरण 1: दातुन दाँतों से जुड़ा है। चरण 2: यह दाँत साफ़ करने की टहनी है।'
    mistakes:
      खाने की थाली: c4h3_shabd
      पानी का घड़ा: c4h3_shabd
  - prompt: एक पेड़ काटा जाए तो क्या-क्या कम होगा?
    options:
    - छाया, फल और पक्षियों के घर
    - धूप
    - सड़कें
    answer: छाया, फल और पक्षियों के घर
    difficulty: 3
    hints:
    - पेड़ हमें और जीवों को क्या देता है?
    - पेड़ पर कौन रहता है?
    solution: 'चरण 1: पेड़ छाया, फल देता है और पक्षी उस पर रहते हैं। चरण 2: पेड़ कटने से ये सब कम होंगे।'
    mistakes:
      धूप: c4h3_ped
      सड़कें: c4h3_ped
