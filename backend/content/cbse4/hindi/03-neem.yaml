subject: cbse4-hin
chapter: 3
title: नीम
tips:
  h4_datun: "पुराने समय में टूथब्रश नहीं था। सुबह लोग नीम की टहनी चबाकर क्या करते थे?"
  h4_neem_anaj: "नीम कड़वा है और कीटाणुओं से लड़ता है। अनाज के डिब्बे में कौन घुसकर दाने खा जाता है?"
  h4_neem_chhaya: "दोपहर की धूप में घना नीम पेड़ ज़मीन पर क्या बिछा देता है?"

concepts:
- code: cbse4h.v3.neem
  title: नीम
  notes: |
    नीम के पेड़ पर पाठ। नीम का पेड़ बड़ा और छायादार होता है। इसकी पत्तियाँ कड़वी होती हैं पर बहुत गुणकारी हैं: पत्तियाँ
    कीड़े दूर रखती हैं, अनाज और कपड़ों में रखी जाती हैं; टहनी से दातुन करते हैं; छाल और तेल दवा में काम आते हैं।
    नीम हवा को साफ़ रखने में मदद करता है। (पाठ की ठीक पंक्तियाँ यहाँ नहीं दी गई हैं।)
  explanations:
    text: 'नीम एक बड़ा, छायादार पेड़ है। उसकी पत्तियाँ कड़वी होती हैं, पर बहुत काम की हैं: वे कीड़ों को दूर रखती हैं। नीम की टहनी से दातुन करते हैं और उसका तेल दवा में काम आता है।'
    visual: 'चित्र बनाइए: एक बड़ा नीम का पेड़, उसकी छाया में बैठे बच्चे, एक बच्चा नीम की टहनी से दातुन कर रहा है।'
    step_by_step: 1. नीम कैसा पेड़ है? बड़ा, छायादार। 2. पत्तियों का स्वाद? कड़वा। 3. नीम के उपयोग लिखें। 4. नीम से क्या सीखें?
    real_world: कई घरों में अनाज के डिब्बों में नीम की सूखी पत्तियाँ रखते हैं ताकि कीड़े न लगें।
  picture:
    kind: compare
    columns:
    - title: नीम का भाग
      points:
      - पत्ती
      - टहनी
      - तेल
    - title: उपयोग
      points:
      - कीड़े दूर रखना
      - दातुन
      - दवा
    alt: नीम की पत्ती कीड़े दूर रखती है, टहनी से दातुन होता है, और तेल दवा में काम आता है।
  items:
  - prompt: नीम की पत्तियों का स्वाद कैसा होता है?
    options:
    - कड़वा
    - मीठा
    - खट्टा
    - नमकीन
    answer: कड़वा
    difficulty: 1
    hints:
    - गुणकारी, पर अच्छा नहीं लगता।
    - करेले जैसा।
    solution: नीम की पत्तियाँ कड़वी होती हैं।
    mistakes:
      मीठा: hin4_read_again
  - prompt: नीम की टहनी से क्या करते हैं?
    options:
    - दातुन (दाँत साफ़)
    - खाना पकाना
    - कपड़े सिलना
    - पतंग उड़ाना
    answer: दातुन (दाँत साफ़)
    difficulty: 1
    hints:
    - सुबह।
    - दाँत।
    solution: नीम की टहनी से दातुन करते हैं।
    mistakes: {"खाना पकाना": "h4_datun", "कपड़े सिलना": "h4_datun", "पतंग उड़ाना": "h4_datun"}
  - prompt: अनाज में नीम की पत्तियाँ क्यों रखते हैं?
    options:
    - कीड़े दूर रखने के लिए
    - स्वाद के लिए
    - रंग के लिए
    - वज़न बढ़ाने के लिए
    answer: कीड़े दूर रखने के लिए
    difficulty: 2
    hints:
    - कीड़ों को नीम पसंद नहीं।
    - बचाव।
    solution: नीम कीड़ों को दूर रखता है।
    mistakes: {"स्वाद के लिए": "h4_neem_anaj", "रंग के लिए": "h4_neem_anaj", "वज़न बढ़ाने के लिए": "h4_neem_anaj"}
  - prompt: नीम का पेड़ हमें गर्मी में क्या देता है?
    options:
    - छाया
    - बर्फ़
    - बारिश
    - आग
    answer: छाया
    difficulty: 1
    hints:
    - पेड़ के नीचे।
    - ठंडक।
    solution: नीम घनी छाया देता है।
    mistakes: {"बर्फ़": "h4_neem_chhaya", "बारिश": "h4_neem_chhaya", "आग": "h4_neem_chhaya"}
  - prompt: '''कड़वा'' का विलोम शब्द है:'
    options:
    - मीठा
    - खट्टा
    - तीखा
    - फीका
    answer: मीठा
    difficulty: 1
    hints:
    - उलटा स्वाद।
    - चीनी।
    solution: कड़वा का विलोम मीठा है।
    mistakes: {"खट्टा": "h1_ulta", "तीखा": "h1_ulta", "फीका": "h1_ulta"}
  - prompt: नीम के बारे में कौन-सी बात सही है?
    options:
    - यह दवा के काम आता है
    - यह ज़हरीला खिलौना है
    - यह केवल रेगिस्तान में होता है
    - इसकी कोई उपयोगिता नहीं
    answer: यह दवा के काम आता है
    difficulty: 2
    hints:
    - गुणकारी।
    - तेल, छाल।
    solution: नीम के कई भाग दवा में काम आते हैं।
    mistakes:
      इसकी कोई उपयोगिता नहीं: hin4_lesson
