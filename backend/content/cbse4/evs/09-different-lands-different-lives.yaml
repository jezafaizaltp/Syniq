# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 9
title: Different Lands, Different Lives
tips:
  v4_bajra: "Millets need very little water."
  v4_camel: "Yaks live in cold mountains. The 'ship of the desert' stores fat in its hump."
  v4_dal_lake: "Dal Lake is in Srinagar. People live on the water there."
  v4_fishermen: "The sea is right there. What would people catch?"
  v4_houseboat: "The word 'boat' is a clue."
  v4_mud_walls: "Deserts are very hot. Thick walls stop the heat getting in."
  v4_sloping_roof: "Kerala gets heavy monsoon rain. What does a slope do to water?"
  v4_stilts: "Stilts lift a house high above the ground. Why would you need that?"
  v4_tents: "People who move often need homes they can fold and carry."
  v4_terrace: "Terraces look like giant steps on a hill."
  v4_woollen: "In the cold, which clothes trap warm air?"
  v4_yak: "Camels like hot deserts. Ladakh's animal is shaggy and loves the cold."

concepts:
- code: cbse4v.lands.homes
  title: Homes in different places
  notes: |
    People build homes to suit the land and weather: houses on stilts in flood areas (Assam), sloping roofs in heavy rain
    (Kerala tiled roofs), flat roofs in dry places (Rajasthan), thick walls of mud in deserts to stay cool, wooden houses
    in cold hills, houseboats (Kerala backwaters, Kashmir's Dal Lake), tents for herders who move (Ladakh).
  explanations:
    text: Homes look different in different places because people build to suit the weather. In rainy Kerala roofs slope so rain runs off. In flood areas houses stand on stilts. In hot deserts thick mud walls keep homes cool.
    visual: 'Draw three homes: a Kerala house with a sloping tiled roof, an Assam house on bamboo stilts, and a Rajasthan mud house with a flat roof.'
    step_by_step: 'Step 1: Find the place. Step 2: What is the weather like? Step 3: How does the home help people live there?'
    real_world: Houseboats (kettuvallam) on Kerala's backwaters and shikaras on Dal Lake are homes on water.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Kerala
      - Assam (floods)
      - Rajasthan
    - title: Home
      points:
      - sloping roof for heavy rain
      - house on stilts
      - thick mud walls, flat roof
    alt: Kerala homes have sloping roofs for heavy rain, Assam homes stand on stilts against floods, and Rajasthan homes have thick mud walls and flat roofs.
  activity:
    type: sort
    prompt: Which place is this home built for?
    bins:
    - Rainy Kerala
    - Flood areas
    - Snowy mountains
    - Hot desert
    items:
    - label: A steep roof of tiles so heavy rain runs off
      bin: Rainy Kerala
      clue: Lots of rain every monsoon.
      why: Kerala.
    - label: A roof of coconut leaves that sheds the rain
      bin: Rainy Kerala
      clue: Coconut trees grow everywhere there.
      why: Kerala.
    - label: A house raised on tall bamboo legs
      bin: Flood areas
      clue: Water can rise under it.
      why: Flood areas, like parts of Assam.
    - label: A ladder up to the door from the ground
      bin: Flood areas
      clue: The floor is kept high.
      why: Flood areas.
    - label: Thick wooden walls to keep warm
      bin: Snowy mountains
      clue: Very cold winters.
      why: Mountains.
    - label: Small windows to keep the cold out
      bin: Snowy mountains
      clue: Freezing wind.
      why: Mountains.
    - label: Thick mud walls that keep the inside cool
      bin: Hot desert
      clue: Very hot days.
      why: The desert.
    - label: A flat roof, since it hardly rains
      bin: Hot desert
      clue: Rain is rare.
      why: The desert.
  items:
  - prompt: Why do Kerala houses have sloping roofs?
    options:
    - so heavy rain runs off
    - to keep snow on top
    - to look tall
    - for flying kites
    answer: so heavy rain runs off
    difficulty: 1
    hints:
    - Monsoon.
    - Water slides down.
    solution: Sloping roofs let rain run off.
    mistakes: {"to keep snow on top": "v4_sloping_roof"}
  - prompt: 'Houses on stilts are built in places with:'
    options:
    - floods
    - deserts
    - snow only
    - no water
    answer: floods
    difficulty: 1
    hints:
    - Water comes up.
    - Raised high.
    solution: Stilts keep homes above flood water.
    mistakes: {"deserts": "v4_stilts"}
  - prompt: 'Thick mud walls in deserts help to:'
    options:
    - keep the house cool
    - make it wet
    - let rain in
    - keep it bright
    answer: keep the house cool
    difficulty: 2
    hints:
    - Heat can't pass through easily.
    - Hot days.
    solution: Thick walls keep out the heat.
    mistakes: {"make it wet": "v4_mud_walls"}
  - prompt: 'A houseboat is a home:'
    options:
    - on water
    - under the ground
    - in a tree
    - in the desert
    answer: on water
    difficulty: 1
    hints:
    - Boat.
    - Backwaters.
    solution: Houseboats float on water.
    mistakes: {"under the ground": "v4_houseboat"}
  - prompt: 'Herders who move from place to place often live in:'
    options:
    - tents
    - skyscrapers
    - houseboats
    - castles
    answer: tents
    difficulty: 2
    hints:
    - Easy to carry.
    - Fold up.
    solution: Tents can be packed and moved.
    mistakes: {"skyscrapers": "v4_tents"}
  - prompt: 'Kashmir''s Dal Lake is famous for:'
    options:
    - houseboats
    - camels
    - sand dunes
    - coconut trees
    answer: houseboats
    difficulty: 2
    hints:
    - Shikaras too.
    - On the lake.
    solution: Dal Lake has famous houseboats.
    mistakes: {"camels": "v4_dal_lake"}
- code: cbse4v.lands.life
  title: Food, clothes and work in different lands
  after:
  - cbse4v.lands.homes
  notes: |
    Land and weather shape life. Coasts: fishing, coconut, rice, fish curry (Kerala, Goa). Deserts: camels, millets
    (bajra), water saving, loose cotton clothes. Mountains: woollen clothes, terrace farming, yaks in Ladakh, apples.
    Plains: farming wheat and rice. People adapt and also learn from each other.
  explanations:
    text: Where people live changes how they live. On coasts many people fish and eat rice and fish. In deserts people keep camels, grow millets and save water. In cold mountains people wear wool and farm on steps cut into hills.
    visual: 'Draw three panels: a fisherman''s boat on the Kerala coast, a camel in Rajasthan, and terrace fields with apple trees in the mountains.'
    step_by_step: 'Step 1: Name the land. Step 2: What grows there? Step 3: What work do people do? Step 4: What do they wear and eat?'
    real_world: Ladakh's people raise yaks and grow barley in short summers; Rajasthan's people collect rainwater in tankas.
  picture:
    kind: compare
    columns:
    - title: Land
      points:
      - coast
      - desert
      - mountains
    - title: Life
      points:
      - fishing, rice, coconut
      - camels, millets, saving water
      - wool, terrace farms, apples
    alt: On coasts people fish and grow rice and coconut; in deserts they keep camels, grow millets and save water; in mountains they wear wool, farm on terraces and grow apples.
  activity:
    type: sort
    prompt: Where do people live like this?
    bins:
    - Coast
    - Desert
    - Mountains
    items:
    - label: Going out to sea in fishing boats
      bin: Coast
      clue: Near the sea.
      why: The coast.
    - label: Eating rice and fish every day
      bin: Coast
      clue: Fish is easy to get.
      why: The coast.
    - label: Coconut trees all around
      bin: Coast
      clue: Sandy soil by the sea.
      why: The coast.
    - label: Keeping camels to travel
      bin: Desert
      clue: Sand everywhere.
      why: The desert.
    - label: Growing millets that need little water
      bin: Desert
      clue: Hardly any rain.
      why: The desert.
    - label: Saving every drop of water
      bin: Desert
      clue: Water is scarce.
      why: The desert.
    - label: Farming on steps cut into hillsides
      bin: Mountains
      clue: Steep slopes.
      why: The mountains.
    - label: Wearing woollen clothes most of the year
      bin: Mountains
      clue: Cold all year.
      why: The mountains.
  items:
  - prompt: Which animal helps people travel in the desert?
    options:
    - camel
    - yak
    - penguin
    - dolphin
    answer: camel
    difficulty: 1
    hints:
    - Ship of the desert.
    - Humps.
    solution: Camels carry people across deserts.
    mistakes: {"yak": "v4_camel"}
  - prompt: 'Many people living on the coast work as:'
    options:
    - fishermen
    - miners in snow
    - camel herders
    - apple growers
    answer: fishermen
    difficulty: 1
    hints:
    - Sea.
    - Boats.
    solution: Coastal people often fish.
    mistakes: {"apple growers": "v4_fishermen"}
  - prompt: 'In cold mountains people wear:'
    options:
    - woollen clothes
    - thin cotton only
    - raincoats only
    - swimsuits
    answer: woollen clothes
    difficulty: 1
    hints:
    - Keep warm.
    - Sweaters.
    solution: Wool keeps them warm.
    mistakes: {"thin cotton only": "v4_woollen"}
  - prompt: 'Terrace farming means farming:'
    options:
    - on steps cut into hillsides
    - in the sea
    - on rooftops in cities
    - in deserts only
    answer: on steps cut into hillsides
    difficulty: 2
    hints:
    - Hills are steep.
    - Steps.
    solution: Terraces are steps cut into hills.
    mistakes: {"in the sea": "v4_terrace"}
  - prompt: Which animal is used in Ladakh's cold mountains?
    options:
    - yak
    - camel
    - crocodile
    - elephant
    answer: yak
    difficulty: 2
    hints:
    - Furry, strong.
    - High mountains.
    solution: Yaks live in cold high places.
    mistakes: {"camel": "v4_yak"}
  - prompt: 'Bajra (a millet) grows well in:'
    options:
    - dry deserts
    - the sea
    - glaciers
    - swamps only
    answer: dry deserts
    difficulty: 2
    hints:
    - Needs little water.
    - Rajasthan.
    solution: Millets grow with little water.
    mistakes: {"the sea": "v4_bajra"}
