# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 9
title: Different Lands, Different Lives
tips:
  v4_bajra: "Millets need very little water."
  v4_camel: "Yaks live in cold mountains. The 'ship of the desert' stores fat in its hump."
  v4_dal_lake: "Dal Lake is in Srinagar. People live on the water there."
  v4_fishermen: "The sea is right there. What would people catch?"
  v4_houseboat: "The word 'boat' is a clue."
  v4_mud_walls: "Deserts are very hot. Thick walls stop the heat getting in."
  v4_sloping_roof: "Kerala gets heavy monsoon rain. What does a slope do to water?"
  v4_stilts: "Stilts lift a house high above the ground. Why would you need that?"
  v4_tents: "People who move often need homes they can fold and carry."
  v4_terrace: "Terraces look like giant steps on a hill."
  v4_woollen: "In the cold, which clothes trap warm air?"
  v4_yak: "Camels like hot deserts. Ladakh's animal is shaggy and loves the cold."
  c4v9_weather: 'First think about the weather there: lots of rain, floods, heat, cold or snow? Then think what the home or clothes must do about it.'
  c4v9_land: 'Picture the land: coast, desert, mountain or plain. What grows there and what work fits it?'
  c4v9_map: Find the place on the map of India and recall its land and weather.

concepts:
- code: cbse4v.lands.homes
  title: Homes in different places
  notes: |
    People build homes to suit the land and weather: houses on stilts in flood areas (Assam), sloping roofs in heavy rain
    (Kerala tiled roofs), flat roofs in dry places (Rajasthan), thick walls of mud in deserts to stay cool, wooden houses
    in cold hills, houseboats (Kerala backwaters, Kashmir's Dal Lake), tents for herders who move (Ladakh).
  explanations:
    text: Homes look different in different places because people build to suit the weather. In rainy Kerala roofs slope so rain runs off. In flood areas houses stand on stilts. In hot deserts thick mud walls keep homes cool.
    visual: 'Draw three homes: a Kerala house with a sloping tiled roof, an Assam house on bamboo stilts, and a Rajasthan mud house with a flat roof.'
    step_by_step: 'Step 1: Find the place. Step 2: What is the weather like? Step 3: How does the home help people live there?'
    real_world: Houseboats (kettuvallam) on Kerala's backwaters and shikaras on Dal Lake are homes on water.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Kerala
      - Assam (floods)
      - Rajasthan
    - title: Home
      points:
      - sloping roof for heavy rain
      - house on stilts
      - thick mud walls, flat roof
    alt: Kerala homes have sloping roofs for heavy rain, Assam homes stand on stilts against floods, and Rajasthan homes have thick mud walls and flat roofs.
  activity:
    type: sort
    prompt: Which place is this home built for?
    bins:
    - Rainy Kerala
    - Flood areas
    - Snowy mountains
    - Hot desert
    items:
    - label: A steep roof of tiles so heavy rain runs off
      bin: Rainy Kerala
      clue: Lots of rain every monsoon.
      why: Kerala.
    - label: A roof of coconut leaves that sheds the rain
      bin: Rainy Kerala
      clue: Coconut trees grow everywhere there.
      why: Kerala.
    - label: A house raised on tall bamboo legs
      bin: Flood areas
      clue: Water can rise under it.
      why: Flood areas, like parts of Assam.
    - label: A ladder up to the door from the ground
      bin: Flood areas
      clue: The floor is kept high.
      why: Flood areas.
    - label: Thick wooden walls to keep warm
      bin: Snowy mountains
      clue: Very cold winters.
      why: Mountains.
    - label: Small windows to keep the cold out
      bin: Snowy mountains
      clue: Freezing wind.
      why: Mountains.
    - label: Thick mud walls that keep the inside cool
      bin: Hot desert
      clue: Very hot days.
      why: The desert.
    - label: A flat roof, since it hardly rains
      bin: Hot desert
      clue: Rain is rare.
      why: The desert.
  lesson:
    - teach: People build homes to suit their land and weather. In Kerala, heavy rain falls, so houses have sloping roofs that let water run off. In dry Rajasthan, many houses have flat roofs.
      check:
        prompt: Why do houses in heavy-rain places have sloping roofs?
        options:
        - rain runs off quickly
        - to look tall
        - to keep birds away
        answer: rain runs off quickly
        why: Water slides down a slope instead of collecting.
      ways:
      - style: visual
        teach: How roofs suit the weather in rainy Kerala and dry Rajasthan.
        picture:
          kind: compare
          columns:
          - title: 'Kerala: heavy rain'
            points:
            - Sloping roof
            - Rain runs off quickly
            - Often clay tiles
          - title: 'Rajasthan: little rain'
            points:
            - Flat roof
            - Rain rarely collects
            - Space to sleep on hot nights
          alt: In Kerala, with heavy rain, houses have sloping roofs, often of clay tiles, so rain runs off quickly. In dry Rajasthan, many houses have flat roofs, since rain rarely collects, and people can sleep on them on hot nights.
      - style: step_by_step
        teach: 'Think like a house builder. Step 1: Ask about the weather: rainy, hot, cold or flooding? Step 2: Ask what the house must protect against. Step 3: Choose a roof, walls and floor that do that. Step 4: Check: will the family be safe and comfortable all year?'
    - teach: In flood areas like Assam, houses are built on stilts (tall poles) so water flows underneath. In hot deserts, thick mud walls keep homes cool. In cold hills, wooden houses keep warmth in.
      picture:
        kind: compare
        columns:
        - title: Problem
          points:
          - heavy rain
          - floods
          - desert heat
          - snow and cold
        - title: Home
          points:
          - sloping roof
          - house on stilts
          - thick mud walls
          - wooden house, small windows
        alt: Weather problems matched with the kind of home built for them.
      check:
        prompt: 'Houses on stilts keep people safe from:'
        options:
        - floods
        - sandstorms
        - snow
        answer: floods
        why: Water passes under the raised house.
      ways:
      - style: step_by_step
        teach: 'See why stilts work. Step 1: Put a small toy house on four pencils standing in a tray. Step 2: Put another toy house flat on the tray. Step 3: Pour water into the tray. Step 4: The water flows under the raised house but soaks the flat one.'
      - style: real_world
        teach: In Assam, many homes along the Brahmaputra stand on bamboo stilts. When the river floods in the monsoon, families and their belongings stay dry above the water.
    - teach: Some people live on water in houseboats (Kerala backwaters, Dal Lake in Kashmir). Herders who move with their animals, as in Ladakh, live in tents they can carry.
      check:
        prompt: Why do herders use tents?
        options:
        - tents can be packed and moved
        - tents are made of stone
        - tents never move
        answer: tents can be packed and moved
        why: Herders move from place to place with their animals.
      ways:
      - style: visual
        teach: Homes that move or float, and the people who live in them.
        picture:
          kind: compare
          columns:
          - title: Houseboat
            points:
            - Kerala backwaters
            - Dal Lake, Kashmir
            - Home on water
          - title: Tent
            points:
            - Herders in Ladakh
            - Can be packed and carried
            - Home that moves with the animals
          alt: Houseboats on the Kerala backwaters and Dal Lake in Kashmir are homes on water. Herders in Ladakh live in tents that can be packed and carried, so their home moves with their animals.
      - style: real_world
        teach: Herders who move with their sheep and goats go up to the high pastures in summer and come down to warmer valleys in winter. A tent lets them carry their home along.
  items:
  - prompt: Why do Kerala houses have sloping roofs?
    options:
    - so heavy rain runs off
    - to keep snow on top
    - to look tall
    - for flying kites
    answer: so heavy rain runs off
    difficulty: 1
    hints:
    - Monsoon.
    - Water slides down.
    solution: Sloping roofs let rain run off.
    mistakes: {"to keep snow on top": "v4_sloping_roof"}
  - prompt: 'Houses on stilts are built in places with:'
    options:
    - floods
    - deserts
    - snow only
    - no water
    answer: floods
    difficulty: 1
    hints:
    - Water comes up.
    - Raised high.
    solution: Stilts keep homes above flood water.
    mistakes: {"deserts": "v4_stilts"}
  - prompt: 'Thick mud walls in deserts help to:'
    options:
    - keep the house cool
    - make it wet
    - let rain in
    - keep it bright
    answer: keep the house cool
    difficulty: 2
    hints:
    - Heat can't pass through easily.
    - Hot days.
    solution: Thick walls keep out the heat.
    mistakes: {"make it wet": "v4_mud_walls"}
  - prompt: 'A houseboat is a home:'
    options:
    - on water
    - under the ground
    - in a tree
    - in the desert
    answer: on water
    difficulty: 1
    hints:
    - Boat.
    - Backwaters.
    solution: Houseboats float on water.
    mistakes: {"under the ground": "v4_houseboat"}
  - prompt: 'Herders who move from place to place often live in:'
    options:
    - tents
    - skyscrapers
    - houseboats
    - castles
    answer: tents
    difficulty: 2
    hints:
    - Easy to carry.
    - Fold up.
    solution: Tents can be packed and moved.
    mistakes: {"skyscrapers": "v4_tents"}
  - prompt: 'Kashmir''s Dal Lake is famous for:'
    options:
    - houseboats
    - camels
    - sand dunes
    - coconut trees
    answer: houseboats
    difficulty: 2
    hints:
    - Shikaras too.
    - On the lake.
    solution: Dal Lake has famous houseboats.
    mistakes: {"camels": "v4_dal_lake"}
  - prompt: 'Igloos are made of:'
    options:
    - blocks of snow
    - bamboo
    - bricks
    answer: blocks of snow
    difficulty: 2
    hints:
    - Igloos are built in very cold, icy lands.
    - What is everywhere there?
    solution: 'Step 1: Icy lands have lots of snow. Step 2: Igloos are built from snow blocks.'
    mistakes:
      bamboo: c4v9_weather
      bricks: c4v9_weather
  - prompt: Why do houses in cold places have small windows?
    options:
    - to keep the warmth inside
    - to let in more cold air
    - to see less
    answer: to keep the warmth inside
    difficulty: 2
    hints:
    - Big windows let heat escape.
    - What do people in cold places want to keep?
    solution: 'Step 1: Heat escapes through big windows. Step 2: Small windows keep warmth inside.'
    mistakes:
      to let in more cold air: c4v9_weather
      to see less: c4v9_weather
  - prompt: Houses in the Northeast are often made of bamboo. Why?
    options:
    - "bamboo grows plenty there and is light and strong"
    - "bamboo is a kind of stone that water cannot pass"
    - "bamboo is brought in from the bottom of the sea"
    answer: bamboo grows plenty there and is light and strong
    difficulty: 3
    hints:
    - People use what grows nearby.
    - What does bamboo feel like?
    solution: 'Step 1: Bamboo grows a lot in the Northeast. Step 2: It is light and strong for building.'
    mistakes:
      "bamboo is a kind of stone that water cannot pass": c4v9_land
      "bamboo is brought in from the bottom of the sea": c4v9_land
  - prompt: Where are houseboats found in Kerala?
    options:
    - on the backwaters
    - in the desert
    - on the mountain tops
    answer: on the backwaters
    difficulty: 1
    hints:
    - A houseboat floats.
    - Which place has calm water?
    solution: 'Step 1: Houseboats float on water. Step 2: Kerala''s backwaters have calm water for them.'
    mistakes:
      in the desert: c4v9_map
      on the mountain tops: c4v9_map
  - prompt: Why do desert houses often have small windows and thick walls?
    options:
    - to keep out heat and sand
    - to let in more sand
    - because there is too much rain
    answer: to keep out heat and sand
    difficulty: 2
    hints:
    - Deserts are hot and sandy.
    - What do people want to keep out?
    solution: 'Step 1: Deserts have heat and sandstorms. Step 2: Thick walls and small windows keep them out.'
    mistakes:
      to let in more sand: c4v9_weather
      because there is too much rain: c4v9_weather
  - prompt: A family lives where rivers flood every year. Which home is safest?
    options:
    - a house on stilts
    - a house in a pit
    - a tent by the river
    answer: a house on stilts
    difficulty: 1
    hints:
    - Floodwater rises from the ground.
    - Which home stays above it?
    solution: 'Step 1: Floods cover low ground. Step 2: A raised house stays dry.'
    mistakes:
      a house in a pit: c4v9_weather
      a tent by the river: c4v9_weather
  - prompt: Which is true about homes across India?
    options:
    - "they differ because land and weather differ"
    - "they are all exactly the same everywhere"
    - "they are all built only of glass and steel"
    answer: they differ because land and weather differ
    difficulty: 2
    hints:
    - Think of Kerala, Rajasthan and Ladakh.
    - Are their homes the same?
    solution: 'Step 1: Each place has different land and weather. Step 2: So homes differ to suit them.'
    mistakes:
      "they are all exactly the same everywhere": c4v9_land
      "they are all built only of glass and steel": c4v9_land
  - prompt: 'Kerala roofs are often covered with:'
    options:
    - clay tiles
    - snow
    - sand
    answer: clay tiles
    difficulty: 2
    hints:
    - They overlap so rain slides off.
    - They are baked from clay.
    solution: 'Step 1: Kerala has heavy rain. Step 2: Sloping clay-tile roofs let rain slide off.'
    mistakes:
      snow: c4v9_map
      sand: c4v9_map
  - prompt: 'A tent is best for people who:'
    options:
    - move from place to place
    - never travel
    - live in big cities
    answer: move from place to place
    difficulty: 1
    hints:
    - A tent can be folded.
    - Who needs a home that can travel?
    solution: 'Step 1: Tents can be packed. Step 2: They suit people who keep moving.'
    mistakes:
      never travel: c4v9_land
      live in big cities: c4v9_land
  - prompt: 'Case: A family is building a house in a village where the river floods the fields every monsoon. Which design would keep them safest?'
    options:
    - A house raised on strong stilts
    - A house with a flat roof on the ground
    - A tent near the riverbank
    answer: A house raised on strong stilts
    hints:
    - What happens to the ground in the monsoon?
    - How can the house stay above the water?
    solution: Stilts lift the house above the ground so floodwater can flow underneath without entering the home.
    mistakes:
      A house with a flat roof on the ground: c4v9_weather
      A tent near the riverbank: c4v9_weather
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are designing a home for a very cold mountain village. Which choice suits it best?'
    options:
    - "Thick walls, small windows and warm wooden floors"
    - "Large open windows on every side of the house"
    - "Walls made of thin cloth that lets the wind in"
    answer: Thick walls, small windows and warm wooden floors
    hints:
    - What does the house need to keep in?
    - Which choice lets the least warmth escape?
    solution: In the cold, thick walls, small windows and wooden floors keep warmth inside the home.
    mistakes:
      "Large open windows on every side of the house": c4v9_weather
      "Walls made of thin cloth that lets the wind in": c4v9_weather
    exam: competency
    difficulty: 2
- code: cbse4v.lands.life
  title: Food, clothes and work in different lands
  after:
  - cbse4v.lands.homes
  notes: |
    Land and weather shape life. Coasts: fishing, coconut, rice, fish curry (Kerala, Goa). Deserts: camels, millets
    (bajra), water saving, loose cotton clothes. Mountains: woollen clothes, terrace farming, yaks in Ladakh, apples.
    Plains: farming wheat and rice. People adapt and also learn from each other.
  explanations:
    text: Where people live changes how they live. On coasts many people fish and eat rice and fish. In deserts people keep camels, grow millets and save water. In cold mountains people wear wool and farm on steps cut into hills.
    visual: 'Draw three panels: a fisherman''s boat on the Kerala coast, a camel in Rajasthan, and terrace fields with apple trees in the mountains.'
    step_by_step: 'Step 1: Name the land. Step 2: What grows there? Step 3: What work do people do? Step 4: What do they wear and eat?'
    real_world: Ladakh's people raise yaks and grow barley in short summers; Rajasthan's people collect rainwater in tankas.
  picture:
    kind: compare
    columns:
    - title: Land
      points:
      - coast
      - desert
      - mountains
    - title: Life
      points:
      - fishing, rice, coconut
      - camels, millets, saving water
      - wool, terrace farms, apples
    alt: On coasts people fish and grow rice and coconut; in deserts they keep camels, grow millets and save water; in mountains they wear wool, farm on terraces and grow apples.
  activity:
    type: sort
    prompt: Where do people live like this?
    bins:
    - Coast
    - Desert
    - Mountains
    items:
    - label: Going out to sea in fishing boats
      bin: Coast
      clue: Near the sea.
      why: The coast.
    - label: Eating rice and fish every day
      bin: Coast
      clue: Fish is easy to get.
      why: The coast.
    - label: Coconut trees all around
      bin: Coast
      clue: Sandy soil by the sea.
      why: The coast.
    - label: Keeping camels to travel
      bin: Desert
      clue: Sand everywhere.
      why: The desert.
    - label: Growing millets that need little water
      bin: Desert
      clue: Hardly any rain.
      why: The desert.
    - label: Saving every drop of water
      bin: Desert
      clue: Water is scarce.
      why: The desert.
    - label: Farming on steps cut into hillsides
      bin: Mountains
      clue: Steep slopes.
      why: The mountains.
    - label: Wearing woollen clothes most of the year
      bin: Mountains
      clue: Cold all year.
      why: The mountains.
  lesson:
    - teach: Land and weather shape how people live. On the coast (Kerala, Goa), many people fish and grow coconut and rice; fish curry and rice are common foods.
      check:
        prompt: Which work is common on the coast?
        options:
        - fishing
        - herding yaks
        - growing apples on snow
        answer: fishing
        why: The sea is full of fish.
      ways:
      - style: visual
        teach: 'Life on the coast: the work, the crops and the food.'
        picture:
          kind: compare
          columns:
          - title: Work
            points:
            - Fishing
            - Boat building
          - title: Crops
            points:
            - Coconut
            - Rice
          - title: Food
            points:
            - Fish curry
            - Rice
            - Coconut dishes
          alt: On the coast, people work at fishing and boat building, grow coconut and rice, and eat fish curry, rice and coconut dishes.
      - style: real_world
        teach: In coastal villages, fishing boats go out before dawn and come back by morning. The catch is sold right on the beach, and families sort and dry some fish in the sun.
    - teach: In deserts (Rajasthan), water is scarce. People save water, grow millets like bajra, use camels to travel, and wear loose cotton clothes. In cold mountains (Ladakh, Himachal), people wear woollen clothes, keep yaks, and farm on terraces.
      picture:
        kind: compare
        columns:
        - title: Coast
          points:
          - fishing
          - rice, coconut
          - light cotton clothes
        - title: Desert
          points:
          - camels
          - bajra
          - save water
        - title: Mountains
          points:
          - yaks
          - terrace farms
          - woollen clothes
        alt: How life differs on the coast, in the desert and in the mountains.
      check:
        prompt: Why is the camel called the 'ship of the desert'?
        options:
        - it carries people across sand, like a ship across water
        - it can swim
        - it has sails
        answer: it carries people across sand, like a ship across water
        why: Camels walk easily on hot sand and need little water.
      ways:
      - style: visual
        teach: How people live in the desert compared with the cold mountains.
        picture:
          kind: compare
          columns:
          - title: Desert (Rajasthan)
            points:
            - Saves every drop of water
            - Grows bajra
            - Travels by camel
            - Loose cotton clothes
          - title: Cold mountains (Ladakh)
            points:
            - Farms on terraces
            - Keeps yaks
            - Woollen clothes
            - Stores food for winter
          alt: In the Rajasthan desert, people save every drop of water, grow bajra, travel by camel and wear loose cotton clothes. In the cold mountains of Ladakh, people farm on terraces, keep yaks, wear woollen clothes and store food for winter.
      - style: step_by_step
        teach: 'Make a ''land and life'' card. Step 1: Write the type of land: coast, desert, mountain or plain. Step 2: Write its weather. Step 3: Add one food, one kind of clothing and one job found there. Step 4: Explain how each one suits the land.'
    - teach: 'In the plains, flat land and rivers help farming of wheat and rice. People everywhere adapt to their land and also learn from each other: food, clothes and festivals travel across India.'
      check:
        prompt: 'Wheat and rice farming is easiest on:'
        options:
        - flat plains with rivers
        - steep rocky peaks
        - sand dunes
        answer: flat plains with rivers
        why: Flat land and water suit big fields.
      ways:
      - style: visual
        teach: Why the flat river plains are good for farming.
        picture:
          kind: flow
          steps:
          - Rivers flow across flat land
          - They leave rich soil on their banks
          - Flat fields are easy to plough and water
          - Farmers grow wheat and rice
          - This food reaches the whole country
          alt: Rivers flow across the flat plains and leave rich soil. Flat fields are easy to plough and water, so farmers grow wheat and rice, and this food reaches the whole country.
      - style: real_world
        teach: Idli and dosa from the south are now eaten all over India, and so are parathas from the north. Foods, clothes and festivals travel as people move and share.
  items:
  - prompt: Which animal helps people travel in the desert?
    options:
    - camel
    - yak
    - penguin
    - dolphin
    answer: camel
    difficulty: 1
    hints:
    - Ship of the desert.
    - Humps.
    solution: Camels carry people across deserts.
    mistakes: {"yak": "v4_camel"}
  - prompt: 'Many people living on the coast work as:'
    options:
    - fishermen
    - miners in snow
    - camel herders
    - apple growers
    answer: fishermen
    difficulty: 1
    hints:
    - Sea.
    - Boats.
    solution: Coastal people often fish.
    mistakes: {"apple growers": "v4_fishermen"}
  - prompt: 'In cold mountains people wear:'
    options:
    - woollen clothes
    - thin cotton only
    - raincoats only
    - swimsuits
    answer: woollen clothes
    difficulty: 1
    hints:
    - Keep warm.
    - Sweaters.
    solution: Wool keeps them warm.
    mistakes: {"thin cotton only": "v4_woollen"}
  - prompt: 'Terrace farming means farming:'
    options:
    - on steps cut into hillsides
    - in the sea
    - on rooftops in cities
    - in deserts only
    answer: on steps cut into hillsides
    difficulty: 2
    hints:
    - Hills are steep.
    - Steps.
    solution: Terraces are steps cut into hills.
    mistakes: {"in the sea": "v4_terrace"}
  - prompt: Which animal is used in Ladakh's cold mountains?
    options:
    - yak
    - camel
    - crocodile
    - elephant
    answer: yak
    difficulty: 2
    hints:
    - Furry, strong.
    - High mountains.
    solution: Yaks live in cold high places.
    mistakes: {"camel": "v4_yak"}
  - prompt: 'Bajra (a millet) grows well in:'
    options:
    - dry deserts
    - the sea
    - glaciers
    - swamps only
    answer: dry deserts
    difficulty: 2
    hints:
    - Needs little water.
    - Rajasthan.
    solution: Millets grow with little water.
    mistakes: {"the sea": "v4_bajra"}
  - prompt: Why do people in deserts wear loose cotton clothes?
    options:
    - they keep the body cool
    - they keep the body warm
    - they are waterproof
    answer: they keep the body cool
    difficulty: 2
    hints:
    - Deserts are very hot in the day.
    - Loose clothes let air move.
    solution: 'Step 1: Air flows through loose cotton. Step 2: This keeps the body cool.'
    mistakes:
      they keep the body warm: c4v9_weather
      they are waterproof: c4v9_weather
  - prompt: Why do farmers cut steps (terraces) into hillsides?
    options:
    - "so water and soil do not wash away"
    - "to make the hills look much taller"
    - "to keep all the animals far away"
    answer: so water and soil do not wash away
    difficulty: 2
    hints:
    - On a steep slope, rain runs down fast.
    - What does fast water carry away?
    solution: 'Step 1: Rain washes soil down steep slopes. Step 2: Flat steps hold water and soil.'
    mistakes:
      "to make the hills look much taller": c4v9_land
      "to keep all the animals far away": c4v9_land
  - prompt: Which fruit grows well in cold hilly places like Himachal Pradesh?
    options:
    - apple
    - coconut
    - date palm fruit
    answer: apple
    difficulty: 2
    hints:
    - Coconuts need hot coasts.
    - Dates grow in hot deserts.
    solution: 'Step 1: Coconut and dates need heat. Step 2: Apples grow in cool hills.'
    mistakes:
      coconut: c4v9_land
      date palm fruit: c4v9_land
  - prompt: Why do desert people store rainwater carefully?
    options:
    - rain is rare there
    - rain falls every day
    - water is not needed
    answer: rain is rare there
