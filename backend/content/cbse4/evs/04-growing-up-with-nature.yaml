# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 4
title: Growing Up With Nature
concepts:
- code: cbse4v.grow.seeds
  title: From seed to plant
  notes: |
    Seeds grow into plants (germination) when they get water, air and warmth; then sunlight helps them grow. Seeds
    spread by wind (cotton, dandelion), water (coconut), animals and birds, and bursting pods (balsam). We grow plants
    from seeds and also from stems (sugarcane, rose) and leaves (bryophyllum).
  explanations:
    text: A seed has a tiny baby plant inside. With water, air and warmth, it sprouts. Then sunlight helps the young plant grow strong. Seeds travel to new places by wind, water, animals or by bursting out of their pods.
    visual: 'Draw four stages in a row: seed, seed with a root, small sprout with two leaves, young plant.'
    step_by_step: 'Step 1: Soak a seed. Step 2: Plant it in soil. Step 3: Water it and keep it in light. Step 4: Watch the root and shoot appear.'
    real_world: Children often sprout green gram (moong) on wet cotton at home or in class.
  picture:
    kind: flow
    steps:
    - Seed
    - Soaks up water
    - Root comes out
    - Shoot and leaves grow
    - Young plant
    alt: 'From seed to plant: the seed soaks up water, a root comes out, then the shoot and leaves grow into a young plant.'
  items:
  - prompt: What does a seed need to sprout?
    options:
    - water, air and warmth
    - only darkness
    - salt
    - plastic
    answer: water, air and warmth
    difficulty: 1
    hints:
    - Think of soaking moong.
    - Three things.
    solution: Seeds need water, air and warmth.
  - prompt: What comes out of a sprouting seed first?
    options:
    - the root
    - the flower
    - the fruit
    - the trunk
    answer: the root
    difficulty: 2
    hints:
    - It grows downwards.
    - Holds the plant.
    solution: The root comes out first.
  - prompt: How does a coconut travel to new places?
    options:
    - by floating on water
    - by flying
    - by walking
    - by bursting
    answer: by floating on water
    difficulty: 2
    hints:
    - It has a hard, light shell.
    - Sea shores.
    solution: Coconuts float on water.
  - prompt: 'Cotton seeds spread mainly by:'
    options:
    - wind
    - water
    - bursting
    - rolling uphill
    answer: wind
    difficulty: 2
    hints:
    - They are fluffy and light.
    - Blown away.
    solution: Fluffy cotton seeds are carried by wind.
  - prompt: Which plant can grow from a piece of stem?
    options:
    - sugarcane
    - mango only from stone
    - coconut
    - pea
    answer: sugarcane
    difficulty: 2
    hints:
    - Farmers plant cut pieces.
    - Sweet stem.
    solution: Sugarcane grows from stem pieces.
  - prompt: What helps a young plant grow after it sprouts?
    options:
    - sunlight
    - darkness
    - smoke
    - noise
    answer: sunlight
    difficulty: 1
    hints:
    - Leaves need it.
    - Sun.
    solution: Sunlight helps plants make food and grow.
- code: cbse4v.grow.care
  title: Caring for plants and animals
  after:
  - cbse4v.grow.seeds
  notes: |
    Plants and animals grow and change, like us. Caring for plants: water, sunlight, good soil, removing weeds. Caring for
    pets: food, water, clean place, kindness, a vet when ill. Baby animals: some look like parents (kitten), some change a
    lot (tadpole to frog, caterpillar to butterfly).
  explanations:
    text: Plants and animals are living things that grow. Plants need water, sunlight and good soil. Pets need food, water, a clean home and kindness. Some babies look like their parents, while others, like caterpillars, change a lot as they grow.
    visual: 'Draw a butterfly''s life: egg on a leaf, caterpillar, pupa, butterfly.'
    step_by_step: 'Step 1: Find out what the plant or animal needs. Step 2: Give it regularly. Step 3: Watch how it grows and changes.'
    real_world: School gardens let children grow vegetables and learn to care for plants.
  picture:
    kind: compare
    columns:
    - title: Looks like parent
      points:
      - kitten
      - puppy
      - calf
    - title: Changes a lot
      points:
      - tadpole → frog
      - caterpillar → butterfly
    alt: Kittens, puppies and calves look like their parents; tadpoles become frogs and caterpillars become butterflies.
  items:
  - prompt: Which baby looks very different from its parent?
    options:
    - caterpillar
    - kitten
    - puppy
    - calf
    answer: caterpillar
    difficulty: 1
    hints:
    - It becomes a butterfly.
    - Changes a lot.
    solution: A caterpillar turns into a butterfly.
  - prompt: 'A pet dog needs:'
    options:
    - food, water, a clean place and kindness
    - only toys
    - no water
    - to be kept in a box
    answer: food, water, a clean place and kindness
    difficulty: 1
    hints:
    - Like us.
    - Care.
    solution: Pets need food, water, shelter and kindness.
  - prompt: 'A baby frog is called a:'
    options:
    - tadpole
    - kitten
    - chick
    - calf
    answer: tadpole
    difficulty: 1
    hints:
    - It swims in water.
    - Has a tail.
    solution: A baby frog is a tadpole.
  - prompt: 'Weeds should be removed from a garden because:'
    options:
    - they take water and food from the plants
    - they are pretty
    - they give fruits
    - they make soil better always
    answer: they take water and food from the plants
    difficulty: 2
    hints:
    - Unwanted plants.
    - Compete.
    solution: Weeds compete with crops for water and nutrients.
  - prompt: Whom do we take a sick pet to?
    options:
    - a vet (animal doctor)
    - a tailor
    - a dentist for people
    - a carpenter
    answer: a vet (animal doctor)
    difficulty: 1
    hints:
    - Animal doctor.
    - Veterinary.
    solution: A vet treats animals.
  - prompt: What comes after the caterpillar stage in a butterfly's life?
    options:
    - pupa
    - egg
    - tadpole
    - seed
    answer: pupa
    difficulty: 2
    hints:
    - It rests in a case.
    - Chrysalis.
    solution: Caterpillar → pupa → butterfly.
