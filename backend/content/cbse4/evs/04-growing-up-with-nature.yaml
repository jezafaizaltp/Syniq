# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 4
title: Growing Up With Nature
tips:
  v4_caterpillar: "A kitten looks like a small cat. Which baby looks nothing like its parent?"
  v4_coconut_float: "Coconuts grow by the sea and have a light, hairy husk."
  v4_cotton_wind: "Cotton seeds have fluffy hair, light as a feather."
  v4_pet_needs: "A dog is a living animal. What does it need every day?"
  v4_pupa: "The egg comes first. After eating a lot, the caterpillar wraps itself in a case."
  v4_root_first: "Watch a soaked moong seed: a tiny white tail grows down first."
  v4_stem_cutting: "Farmers plant short pieces of one tall, sweet, jointed stem."
  v4_sunlight: "Leaves make food using light."
  v4_tadpole: "A chick is a baby hen. The baby frog swims and has a tail."
  v4_vet: "Animals have their own doctor."
  v4_weeds: "Weeds grow fast among crops. What do they take from the plants?"
  v5_ankur_needs: "A seed needs several things to sprout. Which choice lists them?"
  c4v4_need: "List what a seed or plant gets in a healthy garden. Which of those is missing in the question?"
  c4v4_spread: 'Look at the seed: is it light and fluffy, can it float, does it stick, or does its pod burst?'
  c4v4_change: Some babies look like small adults; others change shape completely as they grow. Which kind is this?

concepts:
- code: cbse4v.grow.seeds
  title: From seed to plant
  notes: |
    Seeds grow into plants (germination) when they get water, air and warmth; then sunlight helps them grow. Seeds
    spread by wind (cotton, dandelion), water (coconut), animals and birds, and bursting pods (balsam). We grow plants
    from seeds and also from stems (sugarcane, rose) and leaves (bryophyllum).
  explanations:
    text: A seed has a tiny baby plant inside. With water, air and warmth, it sprouts. Then sunlight helps the young plant grow strong. Seeds travel to new places by wind, water, animals or by bursting out of their pods.
    visual: 'Draw four stages in a row: seed, seed with a root, small sprout with two leaves, young plant.'
    step_by_step: 'Step 1: Soak a seed. Step 2: Plant it in soil. Step 3: Water it and keep it in light. Step 4: Watch the root and shoot appear.'
    real_world: Children often sprout green gram (moong) on wet cotton at home or in class.
  picture:
    kind: flow
    steps:
    - Seed
    - Soaks up water
    - Root comes out
    - Shoot and leaves grow
    - Young plant
    alt: 'From seed to plant: the seed soaks up water, a root comes out, then the shoot and leaves grow into a young plant.'
  activity:
    type: order
    prompt: How does a seed grow into a plant? Put the steps in order.
    steps:
    - The seed soaks up water and swells
    - A tiny root comes out and goes down
    - A small shoot grows up out of the soil
    - The first leaves open
    - With sunlight, the young plant grows strong
    reasons:
      A tiny root comes out and goes down: The seed must swell with water before anything comes out.
      A small shoot grows up out of the soil: The root comes first to hold the plant and take in water.
      The first leaves open: Leaves grow on the shoot once it reaches the light.
      With sunlight, the young plant grows strong: Leaves use sunlight to make food for growing.
  lesson:
    - teach: A seed has a tiny plant inside. When it gets water, air and warmth, it sprouts (germinates). The root comes out first and grows down; then the shoot grows up towards light.
      check:
        prompt: Which grows downward from a sprouting seed?
        options:
        - the root
        - the shoot
        - the flower
        answer: the root
        why: Roots grow down into the soil.
      ways:
      - style: visual
        teach: What happens when a seed sprouts, step by step.
        picture:
          kind: flow
          steps:
          - The seed gets water, air and warmth
          - It swells and its coat splits
          - The root comes out and grows down
          - The shoot grows up towards light
          - The first leaves open
          alt: A seed that gets water, air and warmth swells and its coat splits. The root comes out and grows down, the shoot grows up towards light and the first leaves open.
      - style: step_by_step
        teach: 'Grow beans in a jar. Step 1: Line a glass jar with wet tissue paper. Step 2: Push two bean seeds between the paper and the glass. Step 3: Keep the paper damp and the jar in a warm place. Step 4: Watch each day and draw what you see.'
    - teach: Seeds travel to new places. Light, fluffy seeds fly with the wind (cotton, dandelion). Coconuts float on water. Some seeds stick to animal fur or are eaten by birds. Some pods burst and throw seeds out (balsam).
      picture:
        kind: compare
        columns:
        - title: Wind
          points:
          - cotton
          - dandelion
        - title: Water
          points:
          - coconut
          - lotus
        - title: Animals or bursting
          points:
          - sticky burrs
          - balsam pods burst
        alt: 'Ways seeds spread: wind, water, animals and bursting pods.'
      check:
        prompt: 'A seed with hooks that catch on a dog''s fur spreads by:'
        options:
        - animals
        - water
        - wind
        answer: animals
        why: The dog carries it to a new place.
      ways:
      - style: visual
        teach: Different ways seeds travel to new places.
        picture:
          kind: compare
          columns:
          - title: Way
            points:
            - Wind
            - Water
            - Animals
            - Bursting pods
          - title: Example
            points:
            - Cotton, dandelion
            - Coconut
            - Seeds stuck to fur, or eaten by birds
            - Balsam
          alt: Seeds travel by wind, like cotton and dandelion; by water, like coconut; by animals, sticking to fur or eaten by birds; and by bursting pods, like balsam.
      - style: real_world
        teach: After a walk through tall grass, you may find tiny spiky seeds stuck to your socks. You have just helped a plant carry its seeds to a new place.
    - teach: Not all plants need seeds. Sugarcane and rose grow from pieces of stem. Bryophyllum grows new plants from its leaves. Potato grows from the 'eyes' on the potato.
      check:
        prompt: Which plant can grow from its leaf?
        options:
        - bryophyllum
        - mango
        - wheat
        answer: bryophyllum
        why: Tiny plants grow from the edges of its leaves.
      ways:
      - style: visual
        teach: Plants that grow new plants without seeds, and the part they grow from.
        picture:
          kind: compare
          columns:
          - title: Plant
            points:
            - Sugarcane
            - Rose
            - Bryophyllum
            - Potato
          - title: Grows from
            points:
            - A piece of stem
            - A piece of stem
            - Its leaves
            - The eyes on the potato
          alt: Sugarcane and rose grow from a piece of stem, bryophyllum from its leaves and potato from the eyes on the potato.
      - style: real_world
        teach: Farmers plant sugarcane by laying short pieces of cane in rows in the field. Each piece has buds on it, and new shoots grow up from those buds.
  items:
  - prompt: What does a seed need to sprout?
    options:
    - water, air and warmth
    - only darkness
    - salt
    - plastic
    answer: water, air and warmth
    difficulty: 1
    hints:
    - Think of soaking moong.
    - Three things.
    solution: Seeds need water, air and warmth.
    mistakes: {"only darkness": "v5_ankur_needs"}
  - prompt: What comes out of a sprouting seed first?
    options:
    - the root
    - the flower
    - the fruit
    - the trunk
    answer: the root
    difficulty: 2
    hints:
    - It grows downwards.
    - Holds the plant.
    solution: The root comes out first.
    mistakes: {"the flower": "v4_root_first"}
  - prompt: How does a coconut travel to new places?
    options:
    - by floating on water
    - by flying
    - by walking
    - by bursting
    answer: by floating on water
    difficulty: 2
    hints:
    - It has a hard, light shell.
    - Sea shores.
    solution: Coconuts float on water.
    mistakes: {"by flying": "v4_coconut_float"}
  - prompt: 'Cotton seeds spread mainly by:'
    options:
    - wind
    - water
    - bursting
    - rolling uphill
    answer: wind
    difficulty: 2
    hints:
    - They are fluffy and light.
    - Blown away.
    solution: Fluffy cotton seeds are carried by wind.
    mistakes: {"water": "v4_cotton_wind"}
  - prompt: Which plant can grow from a piece of stem?
    options:
    - sugarcane
    - mango only from stone
    - coconut
    - pea
    answer: sugarcane
    difficulty: 2
    hints:
    - Farmers plant cut pieces.
    - Sweet stem.
    solution: Sugarcane grows from stem pieces.
    mistakes: {"pea": "v4_stem_cutting"}
  - prompt: What helps a young plant grow after it sprouts?
    options:
    - sunlight
    - darkness
    - smoke
    - noise
    answer: sunlight
    difficulty: 1
    hints:
    - Leaves need it.
    - Sun.
    solution: Sunlight helps plants make food and grow.
    mistakes: {"darkness": "v4_sunlight"}
  - prompt: Seeds kept in a dry box for months do not sprout. What is missing?
    options:
    - water
    - darkness
    - a lid
    answer: water
    difficulty: 2
    hints:
    - Seeds need three things to sprout.
    - What does 'dry' tell you?
    solution: 'Step 1: Seeds need water, air and warmth. Step 2: The dry box has no water.'
    mistakes:
      darkness: c4v4_need
      a lid: c4v4_need
  - prompt: Why does a seedling bend towards a window?
    options:
    - it grows towards sunlight
    - it is falling over
    - the wind pushes it
    answer: it grows towards sunlight
    difficulty: 2
    hints:
    - Light comes in through the window.
    - What do plants need to make food?
    solution: 'Step 1: Plants need light to make food. Step 2: So the shoot grows towards the light.'
    mistakes:
      it is falling over: c4v4_need
      the wind pushes it: c4v4_need
  - prompt: How does a dandelion seed travel?
    options:
    - it floats on the wind
    - it rolls on the ground
    - it swims
    answer: it floats on the wind
    difficulty: 1
    hints:
    - It has a tiny fluffy parachute.
    - What carries light, fluffy things?
    solution: 'Step 1: The seed is light with fluffy hairs. Step 2: The wind carries it.'
    mistakes:
      it rolls on the ground: c4v4_spread
      it swims: c4v4_spread
  - prompt: Birds eat fruits and drop the seeds far away. How does this help the plant?
    options:
    - new plants grow in new places
    - the plant dies
    - the seeds turn into birds
    answer: new plants grow in new places
    difficulty: 2
    hints:
    - Seeds under the parent tree get little light.
    - Where do the dropped seeds land?
    solution: 'Step 1: Birds carry seeds away. Step 2: New plants grow in new places with more space.'
    mistakes:
      the plant dies: c4v4_spread
      the seeds turn into birds: c4v4_spread
  - prompt: Which plant is grown from a piece of its stem?
    options:
    - rose
    - wheat
    - mustard
    answer: rose
    difficulty: 2
    hints:
    - Gardeners plant a cut stick of this plant.
    - Wheat and mustard are grown from seeds.
    solution: 'Step 1: Wheat and mustard come from seeds. Step 2: Rose grows from a stem cutting.'
    mistakes:
      wheat: c4v4_spread
      mustard: c4v4_spread
  - prompt: 'Soak moong seeds in water overnight and keep them in a wet cloth. After 2 days you see:'
    options:
    - tiny white roots coming out
    - the seeds turned black
    - nothing ever happens
    answer: tiny white roots coming out
    difficulty: 2
    hints:
    - They got water, air and warmth.
    - What appears first from a sprouting seed?
    solution: 'Step 1: The seeds sprouted. Step 2: Tiny roots came out first.'
    mistakes:
      the seeds turned black: c4v4_need
      nothing ever happens: c4v4_need
  - prompt: Why are seeds of the lotus able to spread through ponds?
    options:
    - they float on water
    - they fly
    - they stick to fur
    answer: they float on water
    difficulty: 3
    hints:
    - Lotus grows in water.
    - How would its seeds move to another part of the pond?
    solution: 'Step 1: Lotus lives in ponds. Step 2: Its seed heads float and carry seeds.'
    mistakes:
      they fly: c4v4_spread
      they stick to fur: c4v4_spread
  - prompt: 'A potato kept in a dark cupboard grows small shoots. They come from its:'
    options:
    - eyes
    - skin colour
    - roots
    answer: eyes
    difficulty: 3
    hints:
    - Look for small dents on the potato.
    - New shoots grow out of those dents.
    solution: 'Step 1: The small dents are called eyes. Step 2: New shoots grow from the eyes.'
    mistakes:
      skin colour: c4v4_spread
      roots: c4v4_spread
  - prompt: Ravi plants 4 rows of seeds with 6 seeds in each row. How many seeds?
    answer: '24'
    check: 4*6
    difficulty: 1
    hints:
    - 'Equal rows: multiply.'
    - 4 × 6.
    solution: 'Step 1: 4 rows × 6 seeds. Step 2: = 24 seeds.'
    mistakes:
      '10': c4v4_need
      '20': c4v4_need
      '18': c4v4_need
  - prompt: 'Case: A child plants seeds in a pot of soil and keeps it in a cupboard, watering it every day. After a week, nothing has come up. A friend''s pot on the warm windowsill has sprouted. What is the most likely difference?'
    options:
    - The windowsill pot got warmth
    - The cupboard pot got too much air
    - The cupboard pot had seeds that were too big
    answer: The windowsill pot got warmth
    hints:
    - What three things does a seed need to sprout?
    - Which of these might be missing in a cold, dark cupboard?
    solution: Seeds need water, air and warmth to sprout. The cold cupboard may not have been warm enough, while the windowsill was.
    mistakes:
      The cupboard pot got too much air: c4v4_need
      The cupboard pot had seeds that were too big: c4v4_need
    exam: case
    difficulty: 2
  - prompt: 'Situation: You find a seed with a soft, fluffy tuft of hairs on it. How does this seed most likely travel?'
    options:
    - It floats on the wind
    - It floats on water
    - Its pod bursts
    answer: It floats on the wind
    hints:
    - Is the seed heavy or light?
    - What could carry a light, fluffy seed far away?
    solution: Light, fluffy seeds are carried by the wind, like cotton and dandelion seeds.
    mistakes:
      It floats on water: c4v4_spread
      Its pod bursts: c4v4_spread
    exam: competency
    difficulty: 2
- code: cbse4v.grow.care
  title: Caring for plants and animals
  after:
  - cbse4v.grow.seeds
  notes: |
    Plants and animals grow and change, like us. Caring for plants: water, sunlight, good soil, removing weeds. Caring for
    pets: food, water, clean place, kindness, a vet when ill. Baby animals: some look like parents (kitten), some change a
    lot (tadpole to frog, caterpillar to butterfly).
  explanations:
    text: Plants and animals are living things that grow. Plants need water, sunlight and good soil. Pets need food, water, a clean home and kindness. Some babies look like their parents, while others, like caterpillars, change a lot as they grow.
    visual: 'Draw a butterfly''s life: egg on a leaf, caterpillar, pupa, butterfly.'
    step_by_step: 'Step 1: Find out what the plant or animal needs. Step 2: Give it regularly. Step 3: Watch how it grows and changes.'
    real_world: School gardens let children grow vegetables and learn to care for plants.
  picture:
    kind: compare
    columns:
    - title: Looks like parent
      points:
      - kitten
      - puppy
      - calf
    - title: Changes a lot
      points:
      - tadpole → frog
      - caterpillar → butterfly
    alt: Kittens, puppies and calves look like their parents; tadpoles become frogs and caterpillars become butterflies.
  activity:
    type: sort
    prompt: How is the baby born?
    bins:
    - Hatches from an egg
    - Born from the mother
    items:
    - label: Hen
      bin: Hatches from an egg
      clue: Chicks come out of shells.
      why: Eggs.
    - label: Sparrow
      bin: Hatches from an egg
      clue: It lays eggs in a nest.
      why: Eggs.
    - label: Crocodile
      bin: Hatches from an egg
      clue: Lays eggs on the river bank.
      why: Eggs.
    - label: Turtle
      bin: Hatches from an egg
      clue: Buries eggs in the sand.
      why: Eggs.
    - label: Snake
      bin: Hatches from an egg
      clue: Most snakes lay eggs.
      why: Eggs.
    - label: Cow
      bin: Born from the mother
      clue: A calf drinks its mother's milk.
      why: Born, not hatched.
    - label: Cat
      bin: Born from the mother
      clue: Kittens drink milk.
      why: Born.
    - label: Elephant
      bin: Born from the mother
      clue: A baby elephant stays close to its mother.
      why: Born.
  lesson:
    - teach: Plants grow and change like us. To care for them, give water, sunlight and good soil, and remove weeds that steal their water and food.
      check:
        prompt: Why do we remove weeds?
        options:
        - they take water and food from our plants
        - they are too pretty
        - they give fruit
        answer: they take water and food from our plants
        why: Weeds compete with our plants.
      ways:
      - style: visual
        teach: What a plant needs to grow well, and what harms it.
        picture:
          kind: compare
          columns:
          - title: Helps it grow
            points:
            - Water
            - Sunlight
            - Good soil
          - title: Harms it
            points:
            - Dry soil for days
            - Dark corners
            - Weeds taking its water and food
          alt: Water, sunlight and good soil help a plant grow. Dry soil for days, dark corners and weeds that take its water and food harm it.
      - style: step_by_step
        teach: 'Care for a school plant. Step 1: Touch the soil each morning: water it only if it feels dry. Step 2: Keep the pot where it gets sunlight. Step 3: Pull out any weeds by their roots. Step 4: Note how many new leaves appear each week.'
    - teach: Some baby animals look like their parents (a kitten, a calf). Others change a lot. A frog starts as an egg, becomes a tadpole that swims with a tail, then grows legs and becomes a frog. A butterfly goes egg, caterpillar, pupa, butterfly.
      picture:
        kind: flow
        steps:
        - egg
        - caterpillar
        - pupa
        - butterfly
        alt: 'Life cycle of a butterfly: egg, caterpillar, pupa, butterfly.'
      check:
        prompt: What hatches from a butterfly's egg?
        options:
        - caterpillar
        - tadpole
        - small butterfly
        answer: caterpillar
        why: The caterpillar comes first, then the pupa.
      ways:
      - style: step_by_step
        teach: 'Watch a frog grow. Step 1: Frog eggs float in a jelly clump in a pond. Step 2: Tadpoles hatch and swim with tails. Step 3: Back legs, then front legs appear. Step 4: The tail shrinks and a small frog hops out of the water.'
      - style: real_world
        teach: A calf can stand and walk a few hours after it is born, and it looks like a small cow. A butterfly's baby, a caterpillar, looks nothing like a butterfly at all.
    - teach: Pets need food, clean water, a clean place, exercise and kindness. When a pet is ill, take it to a vet. Never tease or hurt animals.
      check:
        prompt: 'A pet rabbit needs:'
        options:
        - food, water, a clean place and kindness
        - only toys
        - nothing
        answer: food, water, a clean place and kindness
        why: Pets need daily care like we do.
      ways:
      - style: visual
        teach: What a pet needs from the family that looks after it.
        picture:
          kind: compare
          columns:
          - title: Every day
            points:
            - Food
            - Clean water
            - A clean place to sleep
            - Exercise and play
          - title: When needed
            points:
            - A visit to the vet
            - Gentle care when it is ill
          alt: Every day a pet needs food, clean water, a clean place to sleep, and exercise and play. When needed, it needs a visit to the vet and gentle care when it is ill.
      - style: real_world
        teach: In summer, many families keep a bowl of clean water outside the gate for birds and street animals. It is a small act of kindness that helps them through the heat.
  items:
  - prompt: Which baby looks very different from its parent?
    options:
    - caterpillar
    - kitten
    - puppy
    - calf
    answer: caterpillar
    difficulty: 1
    hints:
    - It becomes a butterfly.
    - Changes a lot.
    solution: A caterpillar turns into a butterfly.
    mistakes: {"kitten": "v4_caterpillar"}
  - prompt: 'A pet dog needs:'
    options:
    - food, water, a clean place and kindness
    - only toys
    - no water
    - to be kept in a box
    answer: food, water, a clean place and kindness
    difficulty: 1
    hints:
    - Like us.
    - Care.
    solution: Pets need food, water, shelter and kindness.
    mistakes: {"only toys": "v4_pet_needs"}
  - prompt: 'A baby frog is called a:'
    options:
    - tadpole
    - kitten
    - chick
    - calf
    answer: tadpole
    difficulty: 1
    hints:
    - It swims in water.
    - Has a tail.
    solution: A baby frog is a tadpole.
    mistakes: {"chick": "v4_tadpole"}
  - prompt: 'Weeds should be removed from a garden because:'
    options:
    - they take water and food from the plants
    - they are pretty
    - they give fruits
    - they make soil better always
    answer: they take water and food from the plants
    difficulty: 2
    hints:
    - Unwanted plants.
    - Compete.
    solution: Weeds compete with crops for water and nutrients.
    mistakes: {"they give fruits": "v4_weeds"}
  - prompt: Whom do we take a sick pet to?
    options:
    - a vet (animal doctor)
    - a tailor
    - a dentist for people
    - a carpenter
    answer: a vet (animal doctor)
    difficulty: 1
    hints:
    - Animal doctor.
    - Veterinary.
    solution: A vet treats animals.
    mistakes: {"a dentist for people": "v4_vet"}
  - prompt: What comes after the caterpillar stage in a butterfly's life?
    options:
    - pupa
    - egg
    - tadpole
    - seed
    answer: pupa
    difficulty: 2
    hints:
    - It rests in a case.
    - Chrysalis.
    solution: Caterpillar → pupa → butterfly.
    mistakes: {"egg": "v4_pupa"}
  - prompt: What comes after the tadpole stage in a frog's life?
    options:
    - froglet with legs
    - egg
    - caterpillar
    answer: froglet with legs
    difficulty: 2
    hints:
    - A tadpole slowly grows something it did not have.
    - It needs these to hop on land.
    solution: 'Step 1: Tadpoles grow legs and lose their tail. Step 2: They become froglets, then frogs.'
    mistakes:
      egg: c4v4_change
      caterpillar: c4v4_change
  - prompt: Which baby animal looks like a small copy of its parent?
    options:
    - puppy
    - tadpole
    - caterpillar
    answer: puppy
    difficulty: 1
    hints:
    - Two of these change shape a lot.
    - Which baby already has fur, four legs and a tail like its parent?
    solution: 'Step 1: Tadpoles and caterpillars change a lot. Step 2: A puppy looks like a small dog.'
    mistakes:
      tadpole: c4v4_change
      caterpillar: c4v4_change
  - prompt: A plant's leaves are turning yellow and drooping in dry soil. What does it most likely need?
    options:
    - water
    - more weeds
    - a coat of paint
    answer: water
    difficulty: 1
    hints:
    - The soil is dry.
    - Drooping often means thirsty.
    solution: 'Step 1: Dry soil means no water for roots. Step 2: The plant needs water.'
    mistakes:
      more weeds: c4v4_need
      a coat of paint: c4v4_need
  - prompt: What does a caterpillar mostly eat?
    options:
    - leaves
    - fish
    - seeds of grass only
    answer: leaves
    difficulty: 1
    hints:
    - Look for chewed holes on garden plants where caterpillars live.
    - It munches on plants.
    solution: 'Step 1: Caterpillars live on plants. Step 2: They eat leaves to grow big.'
    mistakes:
      fish: c4v4_change
      seeds of grass only: c4v4_change
  - prompt: Which is kind behaviour towards street dogs?
    options:
    - give clean water and do not throw stones
    - chase them with sticks
    - pull their tails
    answer: give clean water and do not throw stones
    difficulty: 1
    hints:
    - Animals feel pain like us.
    - Which choice does not hurt them?
    solution: 'Step 1: Hurting animals is cruel. Step 2: Giving water and leaving them in peace is kind.'
    mistakes:
      chase them with sticks: c4v4_change
      pull their tails: c4v4_change
  - prompt: Inside the pupa, what is happening?
    options:
    - the caterpillar is changing into a butterfly
    - it is sleeping forever
    - it is laying eggs
    answer: the caterpillar is changing into a butterfly
    difficulty: 3
    hints:
    - What comes out of the pupa?
    - What went in?
    solution: 'Step 1: A caterpillar goes in; a butterfly comes out. Step 2: So inside, it changes into a butterfly.'
    mistakes:
      it is sleeping forever: c4v4_change
      it is laying eggs: c4v4_change
  - prompt: Why should a plant pot have a small hole at the bottom?
    options:
    - extra water can drain out
    - so ants can come in
    - to make it lighter
    answer: extra water can drain out
    difficulty: 3
    hints:
    - Too much water can harm roots.
    - Where does the extra water go?
    solution: 'Step 1: Roots need air too; standing water rots them. Step 2: The hole lets extra water out.'
