# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 6
title: Happy and Healthy Living
tips:
  v4_angry: "Anger passes if you slow down. What helps you calm your body?"
  v4_brush: "Brush when you wake up and before bed."
  v4_childline: "100 is the police. Childline's number has four digits and ends in 98."
  v4_fit: "Your body gets stronger when it moves."
  v4_good_friend: "A good friend thinks about others too."
  v4_medicine: "The wrong medicine can harm you. Who knows the right one?"
  v4_sad_friend: "How would you want someone to treat you when you're sad?"
  v4_sad_ok: "Feelings come and go for everyone, children and adults."
  v4_sleep: "Growing children need a long night's sleep, much longer than a short nap."
  v4_unsafe_touch: "It is never your fault. Say no, get away, and tell an adult you trust."
  c4v6_habit: 'Ask: does this keep the body clean, rested and active, or does it let germs and tiredness in?'
  c4v6_feel: Think how you would feel in that place. What would help you feel safe or better?
  c4v6_safe: 'Your body belongs to you. Think of the three steps: say no, move away, tell an adult you trust.'

concepts:
- code: cbse4v.health.habits
  title: Healthy habits
  notes: |
    Good habits: brush teeth twice a day, bathe daily, cut nails, wash hands, sleep 9–11 hours, play outdoors and exercise
    (yoga, games), drink enough water, limit screen time. Visit a doctor when unwell; take medicines only as advised.
  explanations:
    text: Healthy habits keep our body strong. Brush your teeth twice a day, bathe, keep nails short, wash hands, sleep well, drink water and play outside every day.
    visual: 'Draw a daily chart: morning brush and bath, school, outdoor play, homework, dinner, brush, sleep.'
    step_by_step: 'Step 1: List your daily habits. Step 2: Tick the healthy ones. Step 3: Choose one habit to improve.'
    real_world: Yoga in school assemblies and International Yoga Day (21 June) encourage fitness.
  picture:
    kind: flow
    steps:
    - Wake up, brush, bathe
    - Healthy breakfast
    - Play outdoors
    - Brush again, sleep early
    alt: 'A healthy day: wake up, brush and bathe, eat a healthy breakfast, play outdoors, brush again and sleep early.'
  activity:
    type: sort
    prompt: Is it a healthy habit?
    bins:
    - Healthy habit
    - Unhealthy habit
    items:
    - label: Brushing teeth twice a day
      bin: Healthy habit
      clue: Keeps teeth clean.
      why: Healthy.
    - label: Keeping nails short
      bin: Healthy habit
      clue: Dirt hides under long nails.
      why: Healthy.
    - label: Playing outside every day
      bin: Healthy habit
      clue: Moves your body.
      why: Healthy.
    - label: Drinking water often
      bin: Healthy habit
      clue: Your body needs it.
      why: Healthy.
    - label: Going to bed very late
      bin: Unhealthy habit
      clue: You need sleep to grow.
      why: Unhealthy.
    - label: Biting your nails
      bin: Unhealthy habit
      clue: Germs go into your mouth.
      why: Unhealthy.
    - label: Eating sweets all day
      bin: Unhealthy habit
      clue: Bad for teeth.
      why: Unhealthy.
    - label: Not washing hands after the toilet
      bin: Unhealthy habit
      clue: Germs spread.
      why: Unhealthy.
  lesson:
    - teach: Good habits keep us healthy. Brush teeth twice a day, bathe daily, keep nails short and clean, and wash hands before eating.
      check:
        prompt: Why do we brush our teeth before bed?
        options:
        - to remove food bits that cause decay
        - to feel sleepy
        - to make teeth longer
        answer: to remove food bits that cause decay
        why: Food left on teeth all night can rot them.
      ways:
      - style: visual
        teach: Daily healthy habits and why each one matters.
        picture:
          kind: compare
          columns:
          - title: Habit
            points:
            - Brush teeth twice a day
            - Bathe every day
            - Keep nails short
            - Wash hands before eating
          - title: Why
            points:
            - Stops tooth decay
            - Washes off sweat and dirt
            - Germs hide under long nails
            - Keeps germs out of the mouth
          alt: Brushing teeth twice a day stops tooth decay. Bathing every day washes off sweat and dirt. Keeping nails short stops germs hiding under them. Washing hands before eating keeps germs out of the mouth.
      - style: step_by_step
        teach: 'Brush your teeth well. Step 1: Put a pea-sized bit of toothpaste on the brush. Step 2: Brush the outside, inside and top of every tooth in small circles. Step 3: Brush gently for about two minutes. Step 4: Rinse and brush your tongue too.'
    - teach: Our body also needs rest and movement. Children need 9 to 11 hours of sleep. Play outdoors, do yoga or sports, and keep screen time short.
      picture:
        kind: bars
        unit: hours
        bars:
        - label: sleep
          value: 10
        - label: school and study
          value: 7
        - label: outdoor play
          value: 1
        - label: screen
          value: 1
        alt: 'A sample day for a child: about 10 hours sleep, 7 school and study, 1 outdoor play, 1 screen.'
      check:
        prompt: Which helps keep the body fit?
        options:
        - skipping and running games
        - watching TV all day
        - skipping meals
        answer: skipping and running games
        why: Active play makes muscles and heart strong.
      ways:
      - style: step_by_step
        teach: 'Plan a healthy day. Step 1: Wake up after a good night''s sleep. Step 2: Play outdoors or do yoga for at least an hour. Step 3: Keep screen time short, with breaks. Step 4: Switch off screens an hour before bed and sleep 9 to 11 hours.'
      - style: real_world
        teach: Children who sleep enough find it easier to concentrate in class and remember what they learn. Missing sleep for a few nights can make anyone tired, grumpy and slow.
    - teach: When unwell, tell an adult and see a doctor. Take medicine only when a doctor or parent gives it, in the right amount.
      check:
        prompt: You find some tablets on a table. What should you do?
        options:
        - leave them and tell an adult
        - eat them
        - share them with friends
        answer: leave them and tell an adult
        why: Medicines can be harmful if taken without advice.
      ways:
      - style: visual
        teach: Safe and unsafe ways to take any kind of medicine.
        picture:
          kind: compare
          columns:
          - title: Safe
            points:
            - A doctor or parent gives it
            - The right amount at the right time
            - Kept away from small children
          - title: Unsafe
            points:
            - Taking medicine on your own
            - Taking extra to get well faster
            - Eating tablets thinking they are sweets
          alt: It is safe to take medicine when a doctor or parent gives it, in the right amount at the right time, and to keep it away from small children. It is unsafe to take medicine on your own, to take extra to get well faster, or to eat tablets thinking they are sweets.
      - style: real_world
        teach: Some tablets are brightly coloured and look like sweets. That is why families keep medicines on a high shelf or in a locked box, out of reach of little children.
  items:
  - prompt: How many times a day should we brush our teeth?
    options:
    - twice
    - once a week
    - never
    - ten times
    answer: twice
    difficulty: 1
    hints:
    - Morning and night.
    - Two.
    solution: Brush twice a day.
    mistakes: {"once a week": "v4_brush"}
  - prompt: Why should we keep our nails short and clean?
    options:
    - "dirt and germs collect under long nails"
    - "short nails grow back much faster"
    - "long nails are far too heavy"
    - "it does not matter at all"
    answer: dirt and germs collect under long nails
    difficulty: 1
    hints:
    - Germs hide there.
    - Then go into food.
    solution: Dirt under nails can carry germs.
    mistakes:
      "it does not matter at all": c4v_think
  - prompt: Which helps keep our body fit?
    options:
    - playing outdoors
    - watching TV all day
    - sleeping all day
    - eating only chips
    answer: playing outdoors
    difficulty: 1
    hints:
    - Move your body.
    - Games.
    solution: Outdoor play keeps us fit.
    mistakes: {"watching TV all day": "v4_fit"}
  - prompt: About how many hours should a child of your age sleep?
    options:
    - 9 to 11 hours
    - 2 hours
    - 20 hours
    - no sleep
    answer: 9 to 11 hours
    difficulty: 2
    hints:
    - Growing children need lots of sleep.
    - Night.
    solution: Children need about 9 to 11 hours of sleep.
    mistakes: {"2 hours": "v4_sleep"}
  - prompt: When should we take medicines?
    options:
    - "only when a doctor or parent gives them"
    - "whenever we feel like taking them"
    - "just to find out how they taste"
    - "every day for fun, like sweets"
    answer: only when a doctor or parent gives them
    difficulty: 1
    hints:
    - Safety.
    - Doctor.
    solution: Take medicines only as advised by a doctor or parent.
    mistakes: {"whenever we feel like taking them": "v4_medicine"}
  - prompt: 'International Yoga Day is on:'
    options:
    - 21 June
    - 15 August
    - 2 October
    - 25 December
    answer: 21 June
    difficulty: 2
    hints:
    - Longest day of the year.
    - June.
    solution: Yoga Day is on 21 June.
    mistakes: {"15 August": "e6_yoga_day"}
  - prompt: Why should we bathe every day?
    options:
    - to wash away sweat, dirt and germs
    - to make our hair grow faster
    - only to feel cold
    answer: to wash away sweat, dirt and germs
    difficulty: 1
    hints:
    - We sweat when we play.
    - What sticks to sweaty skin?
    solution: 'Step 1: Sweat and dirt collect on the skin. Step 2: Bathing washes them and germs away.'
    mistakes:
      to make our hair grow faster: c4v6_habit
      only to feel cold: c4v6_habit
  - prompt: 'Playing on a phone late at night can:'
    options:
    - make it hard to sleep well
    - help us sleep longer
    - make us taller
    answer: make it hard to sleep well
    difficulty: 2
    hints:
    - Bright screens keep the brain awake.
    - What happens to sleep?
    solution: 'Step 1: Screens keep our brain alert. Step 2: So we sleep late and poorly.'
    mistakes:
      help us sleep longer: c4v6_habit
      make us taller: c4v6_habit
  - prompt: How should we sit while reading or writing?
    options:
    - "with a straight back and the book at a good distance"
    - "bent very low over the book with our nose on the page"
    - "lying down flat in a dark room with no light on"
    answer: with a straight back and the book at a good distance
    difficulty: 2
    hints:
    - Think of your back and your eyes.
    - Which choice keeps both comfortable?
    solution: 'Step 1: Bending hurts the back; dim light strains the eyes. Step 2: Sit straight with the book at a good distance.'
    mistakes:
      "bent very low over the book with our nose on the page": c4v6_habit
      "lying down flat in a dark room with no light on": c4v6_habit
  - prompt: Why should we cover our mouth when we sneeze?
    options:
    - "to stop germs spreading to others"
    - "to make the sneeze much louder"
    - "to keep our teeth nice and clean"
    answer: to stop germs spreading to others
    difficulty: 1
    hints:
    - A sneeze sends out tiny drops.
    - Where do those drops land?
    solution: 'Step 1: Sneezes spray tiny drops with germs. Step 2: Covering stops them reaching others.'
    mistakes:
      "to make the sneeze much louder": c4v6_habit
      "to keep our teeth nice and clean": c4v6_habit
  - prompt: A child sleeps from 9 p.m. to 7 a.m. How many hours is that?
    answer: '10'
    check: 3+7
    difficulty: 2
    hints:
    - 9 p.m. to midnight first.
    - Then midnight to 7 a.m.
    solution: 'Step 1: 9 p.m. to 12 = 3 hours. Step 2: 12 to 7 a.m. = 7 hours; total 10.'
    mistakes:
      '2': c4v6_habit
      '16': c4v6_habit
      '12': c4v6_habit
  - prompt: Which snack is best before outdoor games?
    options:
    - a banana
    - a packet of fried chips
    - a big bottle of cola
    answer: a banana
    difficulty: 1
    hints:
    - You need quick energy without a heavy stomach.
    - Which one is a fruit?
    solution: 'Step 1: Fried and sugary snacks are not healthy. Step 2: A banana gives good energy.'
    mistakes:
      a packet of fried chips: c4v6_habit
      a big bottle of cola: c4v6_habit
  - prompt: Why do we wear clean, dry socks?
    options:
    - "wet, dirty socks let germs grow and cause smells"
    - "dry socks are much heavier than wet socks"
    - "socks should always be wet to keep feet cool"
    answer: wet, dirty socks let germs grow and cause smells
    difficulty: 3
    hints:
    - Germs like warm, wet places.
    - What happens to wet socks inside shoes?
    solution: 'Step 1: Germs grow in warm, damp socks. Step 2: Clean, dry socks keep feet healthy.'
    mistakes:
      "dry socks are much heavier than wet socks": c4v6_habit
      "socks should always be wet to keep feet cool": c4v6_habit
  - prompt: Which is a good way to keep our eyes healthy?
    options:
    - "take breaks from screens and look far away"
    - "read for a long time in very dim light"
    - "rub our eyes often with dirty hands"
    answer: take breaks from screens and look far away
    difficulty: 2
    hints:
    - Eyes get tired from close work.
    - What gives them rest?
    solution: 'Step 1: Long screen time tires the eyes. Step 2: Breaks and looking far away rest them.'
    mistakes:
      "read for a long time in very dim light": c4v6_habit
      "rub our eyes often with dirty hands": c4v6_habit
  - prompt: Why should we wear a helmet when cycling?
    options:
    - "to protect our head if we fall"
    - "to make us look much taller"
    - "to keep our hair dry in rain"
    answer: to protect our head if we fall
    difficulty: 1
    hints:
    - Falls can happen on a cycle.
    - Which part of the body is most important to protect?
    solution: 'Step 1: Head injuries are dangerous. Step 2: A helmet protects the head.'
    mistakes:
      "to make us look much taller": c4v6_habit
      "to keep our hair dry in rain": c4v6_habit
  - prompt: 'Case: A child finds a strip of tablets on the table while having a headache. No grown-up is at home. What should the child do?'
    options:
    - Wait and tell a parent or grown-up, and not take it alone
    - Take two tablets to feel better quickly
    - Take one tablet because it looks like a sweet
    answer: Wait and tell a parent or grown-up, and not take it alone
    hints:
    - Who should decide which medicine to take?
    - Is it safe to take medicine without asking?
    solution: Medicine should be taken only when a doctor or parent gives it, in the right amount. Taking it alone can be dangerous.
    mistakes:
      Take two tablets to feel better quickly: c4v6_habit
      Take one tablet because it looks like a sweet: c4v6_habit
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your friend plays phone games until midnight every day and is always sleepy in class. What advice would help most?'
    options:
    - "Put the phone away early and sleep 9 to 11 hours"
    - "Drink a big cold drink every morning to wake up"
    - "Sleep during lessons in the classroom instead"
    answer: Put the phone away early and sleep 9 to 11 hours
    hints:
    - How many hours of sleep do children need?
    - What is stopping your friend from getting it?
    solution: Children need 9 to 11 hours of sleep. Putting the phone away early helps your friend sleep well and stay alert.
    mistakes:
      "Drink a big cold drink every morning to wake up": c4v6_habit
      "Sleep during lessons in the classroom instead": c4v6_habit
    exam: competency
    difficulty: 2
- code: cbse4v.health.feelings
  title: Feelings and friendship
  after:
  - cbse4v.health.habits
  notes: |
    Being healthy includes feeling happy. Everyone has feelings: happy, sad, angry, scared, excited. It's okay to feel
    them; talk to someone you trust. Be kind, share, take turns, include others. Good touch and bad touch: say NO, move
    away, tell a trusted adult. Childline 1098.
  explanations:
    text: 'Feelings are normal: sometimes we are happy, sometimes sad, angry or scared. Talking to someone you trust helps. Be a kind friend. If anyone touches you in a way that feels wrong, say NO, move away and tell a trusted adult.'
    visual: 'Draw four faces: happy, sad, angry, scared. Next to each, write one thing you can do when you feel that way.'
    step_by_step: 'Step 1: Notice the feeling. Step 2: Name it. Step 3: Take a deep breath. Step 4: Talk to someone you trust.'
    real_world: Schools teach 'No, Go, Tell' to keep children safe, and Childline 1098 is a free helpline for children.
  picture:
    kind: compare
    columns:
    - title: Feeling
      points:
      - sad
      - angry
      - scared
    - title: Helpful thing to do
      points:
      - talk to a friend or parent
      - take deep breaths, count to 10
      - tell a trusted adult
    alt: When sad, talk to a friend or parent; when angry, take deep breaths and count to 10; when scared, tell a trusted adult.
  activity:
    type: sort
    prompt: When you feel upset or unsafe, does this help?
    bins:
    - Helps
    - Doesn't help
    items:
    - label: Talking to someone you trust
      bin: Helps
      clue: Sharing feelings makes them lighter.
      why: It helps.
    - label: Taking slow, deep breaths
      bin: Helps
      clue: It calms the body.
      why: It helps.
    - label: Telling a trusted adult about a touch you didn't like
      bin: Helps
      clue: You are never wrong to tell.
      why: Always tell. It helps keep you safe.
    - label: Drawing how you feel
      bin: Helps
      clue: Feelings come out on paper.
      why: It helps.
    - label: Hitting someone
      bin: Doesn't help
      clue: Does it make anyone feel better?
      why: It hurts others.
    - label: Keeping a scary secret from everyone
      bin: Doesn't help
      clue: Who can help you if no one knows?
      why: Tell a trusted adult.
    - label: Throwing things
      bin: Doesn't help
      clue: Things break and people get hurt.
      why: It doesn't help.
  lesson:
    - teach: Being healthy also means feeling okay inside. Everyone feels happy, sad, angry, scared or excited at times. All feelings are okay; what matters is what we do with them.
      check:
        prompt: Is it okay to feel scared sometimes?
        options:
        - yes, everyone feels scared sometimes
        - no, never
        - only grown-ups can
        answer: yes, everyone feels scared sometimes
        why: Feelings come to everyone.
      ways:
      - style: visual
        teach: Some feelings and a helpful thing to do with each one.
        picture:
          kind: compare
          columns:
          - title: Feeling
            points:
            - Sad
            - Angry
            - Scared
            - Excited
          - title: Helpful thing to do
            points:
            - Talk to someone you trust
            - Breathe slowly before speaking
            - Tell a grown-up what scares you
            - Share the good news
          alt: When sad, talk to someone you trust. When angry, breathe slowly before speaking. When scared, tell a grown-up what scares you. When excited, share the good news.
      - style: real_world
        teach: Even grown-ups feel nervous before a big day, like a job interview or a wedding. Feeling nervous is normal; it shows something matters to us.
    - teach: 'When feelings are big, calm down first: take slow deep breaths, count to 10, or go for a short walk. Then talk to someone you trust.'
      picture:
        kind: flow
        steps:
        - notice the feeling
        - breathe slowly, count to 10
        - 'name it: I feel angry'
        - talk to someone you trust
        alt: Steps for handling big feelings.
      check:
        prompt: What is a good first step when you feel very angry?
        options:
        - take slow deep breaths
        - hit something
        - shout at a friend
        answer: take slow deep breaths
        why: Breathing calms the body before we act.
      ways:
      - style: step_by_step
        teach: 'Try belly breathing to calm down. Step 1: Put one hand on your tummy. Step 2: Breathe in slowly through your nose and feel your tummy rise. Step 3: Breathe out slowly through your mouth. Step 4: Do it five times, then talk about what upset you.'
      - style: real_world
        teach: Cricketers often take a slow, deep breath before facing a fast bowler. Calming the body first helps them think clearly and play their best shot.
    - teach: Your body belongs to you. If a touch feels wrong or confusing, say NO, move away and tell a trusted adult. It is never your fault. Childline 1098 is free and open day and night.
      check:
        prompt: Someone asks you to keep a touch secret. What should you do?
        options:
        - tell a trusted adult
        - keep the secret
        - feel it is your fault
        answer: tell a trusted adult
        why: Unsafe secrets must be told.
      ways:
      - style: visual
        teach: Three steps to remember if a touch feels wrong or confusing.
        picture:
          kind: flow
          steps:
          - Say NO loudly
          - Move away quickly
          - Tell a trusted adult, or call 1098
          - 'Remember: it is never your fault'
          alt: If a touch feels wrong or confusing, say NO loudly, move away quickly, and tell a trusted adult or call Childline 1098. Remember, it is never your fault.
      - style: step_by_step
        teach: 'Make your trusted adults list. Step 1: Think of grown-ups who listen to you and keep you safe. Step 2: Write down three names, such as a parent, a teacher and a relative. Step 3: Keep the list somewhere safe. Step 4: If one is not there, go to the next.'
  items:
  - prompt: 'When you feel angry, a good thing to do is:'
    options:
    - "take deep breaths and count to 10"
    - "hit the person who made you angry"
    - "throw things across the room"
    - "shout at everyone around you"
    answer: take deep breaths and count to 10
    difficulty: 1
    hints:
    - Calm down first.
    - Breathe.
    solution: Breathing slowly helps calm anger.
    mistakes: {"hit the person who made you angry": "v4_angry"}
  - prompt: 'If someone touches you in a way that feels wrong, you should:'
    options:
    - "say NO, move away and tell a trusted adult"
    - "keep it a secret and tell nobody at all"
    - "think that it must have been your fault"
    - "do nothing and hope it does not happen again"
    answer: say NO, move away and tell a trusted adult
    difficulty: 1
    hints:
    - No, Go, Tell.
    - Safety.
    solution: Say NO, go away and tell a trusted adult.
    mistakes: {"keep it a secret and tell nobody at all": "v4_unsafe_touch"}
  - prompt: What is the Childline number in India?
    options:
    - '1098'
    - '100'
    - '1234'
    - '9999'
    answer: '1098'
    difficulty: 2
    hints:
    - Free for children.
    - Ten-nine-eight.
    solution: Childline is 1098.
    mistakes: {"100": "v4_childline"}
  - prompt: A classmate is sad. What can you do?
    options:
    - "ask them kindly what happened"
    - "laugh at them for being sad"
    - "ignore them and walk away"
    - "tease them until they cry"
    answer: ask them kindly what happened
    difficulty: 1
    hints:
    - Be kind.
    - Listen.
    solution: Kindly asking shows you care.
    mistakes: {"laugh at them for being sad": "v4_sad_friend"}
  - prompt: Is it okay to feel sad sometimes?
    options:
    - "yes, everyone feels sad sometimes"
    - "no, nobody should ever feel sad"
    - "only adults feel sad, not children"
    - "only on holidays, not on school days"
    answer: yes, everyone feels sad sometimes
    difficulty: 1
    hints:
    - Feelings are normal.
    - Everyone.
    solution: Everyone has sad feelings sometimes; talking helps.
    mistakes: {"no, nobody should ever feel sad": "v4_sad_ok"}
  - prompt: 'A good friend:'
    options:
    - shares and takes turns
    - grabs everything
    - leaves others out
    - breaks promises
    answer: shares and takes turns
    difficulty: 1
    hints:
    - Fair.
    - Kind.
    solution: Good friends share and take turns.
    mistakes: {"grabs everything": "v4_good_friend"}
  - prompt: A new child joins your class and sits alone. What can you do?
    options:
    - "invite them to play or sit with you"
    - "laugh at them for sitting all alone"
    - "ignore them until they make friends"
    answer: invite them to play or sit with you
    difficulty: 1
    hints:
    - Think how it feels to be new.
    - Which choice makes them feel welcome?
    solution: 'Step 1: Being new can feel lonely. Step 2: Inviting them helps them feel welcome.'
    mistakes:
      "laugh at them for sitting all alone": c4v6_feel
      "ignore them until they make friends": c4v6_feel
  - prompt: 'Your friend won a prize and you did not. A kind thing to do is:'
    options:
    - congratulate your friend
    - tear the certificate
    - stop talking to them
    answer: congratulate your friend
    difficulty: 2
    hints:
    - It is okay to feel a bit sad.
    - How would you want your friend to act if you won?
    solution: 'Step 1: Your feeling is okay. Step 2: Congratulating shows kindness.'
    mistakes:
      tear the certificate: c4v6_feel
      stop talking to them: c4v6_feel
  - prompt: Which is a safe adult to tell about a problem?
    options:
    - "a parent, teacher or school counsellor"
    - "a stranger you met on the internet"
    - "nobody, keep it all to yourself"
    answer: a parent, teacher or school counsellor
    difficulty: 1
    hints:
    - Trusted adults know you and care for you.
    - Strangers online are not known.
    solution: 'Step 1: Strangers are not safe to share with. Step 2: Parents, teachers or counsellors are trusted.'
    mistakes:
      "a stranger you met on the internet": c4v6_safe
      "nobody, keep it all to yourself": c4v6_safe
  - prompt: If someone says or does something that makes you feel unsafe, whose fault is it?
    options:
    - never yours
    - always yours
    - your friend's
    answer: never yours
    difficulty: 2
    hints:
