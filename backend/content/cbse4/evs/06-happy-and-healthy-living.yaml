# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 6
title: Happy and Healthy Living
concepts:
- code: cbse4v.health.habits
  title: Healthy habits
  notes: |
    Good habits: brush teeth twice a day, bathe daily, cut nails, wash hands, sleep 9–11 hours, play outdoors and exercise
    (yoga, games), drink enough water, limit screen time. Visit a doctor when unwell; take medicines only as advised.
  explanations:
    text: Healthy habits keep our body strong. Brush your teeth twice a day, bathe, keep nails short, wash hands, sleep well, drink water and play outside every day.
    visual: 'Draw a daily chart: morning brush and bath, school, outdoor play, homework, dinner, brush, sleep.'
    step_by_step: 'Step 1: List your daily habits. Step 2: Tick the healthy ones. Step 3: Choose one habit to improve.'
    real_world: Yoga in school assemblies and International Yoga Day (21 June) encourage fitness.
  picture:
    kind: flow
    steps:
    - Wake up, brush, bathe
    - Healthy breakfast
    - Play outdoors
    - Brush again, sleep early
    alt: 'A healthy day: wake up, brush and bathe, eat a healthy breakfast, play outdoors, brush again and sleep early.'
  items:
  - prompt: How many times a day should we brush our teeth?
    options:
    - twice
    - once a week
    - never
    - ten times
    answer: twice
    difficulty: 1
    hints:
    - Morning and night.
    - Two.
    solution: Brush twice a day.
  - prompt: Why should we keep our nails short and clean?
    options:
    - dirt and germs collect under long nails
    - short nails grow faster
    - long nails are heavy
    - it does not matter
    answer: dirt and germs collect under long nails
    difficulty: 1
    hints:
    - Germs hide there.
    - Then go into food.
    solution: Dirt under nails can carry germs.
    mistakes:
      it does not matter: c4v_think
  - prompt: Which helps keep our body fit?
    options:
    - playing outdoors
    - watching TV all day
    - sleeping all day
    - eating only chips
    answer: playing outdoors
    difficulty: 1
    hints:
    - Move your body.
    - Games.
    solution: Outdoor play keeps us fit.
  - prompt: About how many hours should a child of your age sleep?
    options:
    - 9 to 11 hours
    - 2 hours
    - 20 hours
    - no sleep
    answer: 9 to 11 hours
    difficulty: 2
    hints:
    - Growing children need lots of sleep.
    - Night.
    solution: Children need about 9 to 11 hours of sleep.
  - prompt: When should we take medicines?
    options:
    - only when a doctor or parent gives them
    - whenever we like
    - to taste them
    - every day for fun
    answer: only when a doctor or parent gives them
    difficulty: 1
    hints:
    - Safety.
    - Doctor.
    solution: Take medicines only as advised by a doctor or parent.
  - prompt: 'International Yoga Day is on:'
    options:
    - 21 June
    - 15 August
    - 2 October
    - 25 December
    answer: 21 June
    difficulty: 2
    hints:
    - Longest day of the year.
    - June.
    solution: Yoga Day is on 21 June.
- code: cbse4v.health.feelings
  title: Feelings and friendship
  after:
  - cbse4v.health.habits
  notes: |
    Being healthy includes feeling happy. Everyone has feelings: happy, sad, angry, scared, excited. It's okay to feel
    them; talk to someone you trust. Be kind, share, take turns, include others. Good touch and bad touch: say NO, move
    away, tell a trusted adult. Childline 1098.
  explanations:
    text: 'Feelings are normal: sometimes we are happy, sometimes sad, angry or scared. Talking to someone you trust helps. Be a kind friend. If anyone touches you in a way that feels wrong, say NO, move away and tell a trusted adult.'
    visual: 'Draw four faces: happy, sad, angry, scared. Next to each, write one thing you can do when you feel that way.'
    step_by_step: 'Step 1: Notice the feeling. Step 2: Name it. Step 3: Take a deep breath. Step 4: Talk to someone you trust.'
    real_world: Schools teach 'No, Go, Tell' to keep children safe, and Childline 1098 is a free helpline for children.
  picture:
    kind: compare
    columns:
    - title: Feeling
      points:
      - sad
      - angry
      - scared
    - title: Helpful thing to do
      points:
      - talk to a friend or parent
      - take deep breaths, count to 10
      - tell a trusted adult
    alt: When sad, talk to a friend or parent; when angry, take deep breaths and count to 10; when scared, tell a trusted adult.
  items:
  - prompt: 'When you feel angry, a good thing to do is:'
    options:
    - take deep breaths and count to 10
    - hit someone
    - throw things
    - shout at everyone
    answer: take deep breaths and count to 10
    difficulty: 1
    hints:
    - Calm down first.
    - Breathe.
    solution: Breathing slowly helps calm anger.
  - prompt: 'If someone touches you in a way that feels wrong, you should:'
    options:
    - say NO, move away and tell a trusted adult
    - keep it a secret
    - feel it is your fault
    - do nothing
    answer: say NO, move away and tell a trusted adult
    difficulty: 1
    hints:
    - No, Go, Tell.
    - Safety.
    solution: Say NO, go away and tell a trusted adult.
  - prompt: What is the Childline number in India?
    options:
    - '1098'
    - '100'
    - '1234'
    - '9999'
    answer: '1098'
    difficulty: 2
    hints:
    - Free for children.
    - Ten-nine-eight.
    solution: Childline is 1098.
  - prompt: A classmate is sad. What can you do?
    options:
    - ask them kindly what happened
    - laugh at them
    - ignore them
    - tease them
    answer: ask them kindly what happened
    difficulty: 1
    hints:
    - Be kind.
    - Listen.
    solution: Kindly asking shows you care.
  - prompt: Is it okay to feel sad sometimes?
    options:
    - yes, everyone feels sad sometimes
    - no, never
    - only adults feel sad
    - only on holidays
    answer: yes, everyone feels sad sometimes
    difficulty: 1
    hints:
    - Feelings are normal.
    - Everyone.
    solution: Everyone has sad feelings sometimes; talking helps.
  - prompt: 'A good friend:'
    options:
    - shares and takes turns
    - grabs everything
    - leaves others out
    - breaks promises
    answer: shares and takes turns
    difficulty: 1
    hints:
    - Fair.
    - Kind.
    solution: Good friends share and take turns.
