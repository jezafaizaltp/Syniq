# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 10
title: Our Sky
tips:
  v4_chandrayaan: "'Chandra' means Moon; 'Mangal' means Mars."
  v4_clouds: "Clouds look fluffy but they are made of water."
  v4_constellation: "A comet has a tail. Star patterns like Orion have another name."
  v4_dark_clouds: "Dark clouds are heavy with water. What falls from them?"
  v4_evaporate: "Heat makes water go up into the air, like steam from a kettle."
  v4_isro: "NASA is America's. India's agency is in Bengaluru and starts with I."
  v4_rainbow: "Think of a time you saw a rainbow. What was the weather doing, and where was the light coming from?"
  v4_saptarishi: "Seven stars that look like a big ladle or spoon."
  v4_stars_far: "Many stars are bigger than the Sun. Why would they look like dots?"
  v4_sun_eyes: "The Sun is very bright and hot. What can it do to eyes?"
  v4_sun_star: "The Sun makes its own light and heat. Planets don't."
  c4v10_light: 'Ask: does it make its own light, or does it only shine because sunlight falls on it?'
  c4v10_far: Things look smaller the farther away they are. Think how far each object is from us.
  c4v10_cycle: 'Follow the water: heated by the Sun, rising, cooling high up, then coming back down.'

concepts:
- code: cbse4v.sky.objects
  title: Sun, Moon and stars
  notes: |
    In the day sky: the Sun (a star, gives light and heat), clouds, birds, aeroplanes. In the night sky: the Moon (reflects
    sunlight, changes shape over a month), stars (very far suns, twinkle), groups of stars (constellations, like the Big
    Dipper / Saptarishi). Never look directly at the Sun.
  explanations:
    text: 'The Sun is a star that gives us light and heat. At night we see the Moon and many stars. The Moon has no light of its own: it shines because sunlight falls on it. Stars look tiny because they are very, very far away.'
    visual: Draw a night sky with a half Moon and the seven stars of the Saptarishi (Big Dipper) shaped like a ladle.
    step_by_step: 'Step 1: Is it day or night? Step 2: Which objects do you see? Step 3: Which give their own light (Sun, stars) and which reflect it (Moon)?'
    real_world: Stargazing on a clear night away from city lights shows thousands of stars.
  picture:
    kind: compare
    columns:
    - title: Gives its own light
      points:
      - Sun
      - stars
    - title: Shines by reflected light
      points:
      - Moon
    alt: The Sun and stars give their own light; the Moon shines by reflecting sunlight.
  activity:
    type: sort
    prompt: Sun, Moon or stars?
    bins:
    - Sun
    - Moon
    - Stars
    items:
    - label: Gives us light and heat in the day
      bin: Sun
      clue: Warms the Earth.
      why: The Sun.
    - label: The nearest star to the Earth
      bin: Sun
      clue: So close it looks big and bright.
      why: The Sun is a star.
    - label: Has no light of its own; shines with sunlight
      bin: Moon
      clue: Like a mirror in the sky.
      why: The Moon.
    - label: Looks a different shape on different nights
      bin: Moon
      clue: Full, half, thin.
      why: The Moon.
    - label: Tiny twinkling lights far away
      bin: Stars
      clue: Thousands at night.
      why: Stars.
    - label: The Pole Star
      bin: Stars
      clue: It stays in the north sky.
      why: A star.
  lesson:
    - teach: 'The Sun is a star: a huge ball of hot gas that gives us light and heat. It looks bigger than other stars only because it is much closer to us.'
      check:
        prompt: Why does the Sun look bigger than other stars?
        options:
        - it is much closer to us
        - it is the only star
        - it is made of gold
        answer: it is much closer to us
        why: Closer things look bigger.
      ways:
      - style: visual
        teach: Why the Sun looks so much bigger than other stars.
        picture:
          kind: compare
          columns:
          - title: The Sun
            points:
            - A star
            - Close to us
            - Looks big and bright
          - title: Other stars
            points:
            - Also suns
            - Very, very far away
            - Look like tiny dots
          alt: The Sun is a star that is close to us, so it looks big and bright. Other stars are also suns, but they are very far away, so they look like tiny dots.
      - style: real_world
        teach: 'A street lamp near you looks big and bright, while lamps far down the road look like small dots. Stars look tiny for the same reason: they are very far away.'
    - teach: The Moon has no light of its own. It shines because sunlight falls on it. Over a month it seems to change shape, from full moon to new moon and back.
      picture:
        kind: compare
        columns:
        - title: Makes its own light
          points:
          - the Sun
          - other stars
        - title: Shines with sunlight
          points:
          - the Moon
          - planets
        alt: Objects that make light and objects that only reflect sunlight.
      check:
        prompt: Where does moonlight really come from?
        options:
        - the Sun
        - the Moon's own fire
        - street lights
        answer: the Sun
        why: The Moon reflects sunlight.
      ways:
      - style: step_by_step
        teach: 'Show why the Moon shines. Step 1: In a dark room, hold up a white ball: you can hardly see it. Step 2: Shine a torch on it. Step 3: Now the ball looks bright. Step 4: The ball is the Moon and the torch is the Sun: the Moon shines only because sunlight falls on it.'
      - style: real_world
        teach: A road sign at night has no light of its own, but it glows when a car's headlights fall on it. The Moon works the same way with sunlight.
    - teach: Stars are very far suns, so they look tiny and twinkle. Groups of stars that make a pattern are called constellations, like the Saptarishi (Big Dipper). Never look directly at the Sun; it can hurt your eyes.
      check:
        prompt: Why do stars look like tiny dots?
        options:
        - they are very far away
        - they are very small
        - they are lamps
        answer: they are very far away
        why: Many stars are bigger than the Sun but very far.
      ways:
      - style: visual
        teach: Facts about stars and constellations, and one safety rule.
        picture:
          kind: compare
          columns:
          - title: Stars
            points:
            - Very far suns
            - Look tiny and twinkle
            - Groups make patterns called constellations
          - title: Safety
            points:
            - Never look straight at the Sun
            - It can hurt your eyes
          alt: Stars are very far suns that look tiny and twinkle. Groups of stars make patterns called constellations. Never look straight at the Sun, because it can hurt your eyes.
      - style: real_world
        teach: Long ago, sailors and travellers found their way at night by looking at star patterns. The Pole Star stays in the north, so it showed them which way to go.
  items:
  - prompt: 'The Sun is a:'
    options:
    - star
    - planet
    - moon
    - cloud
    answer: star
    difficulty: 1
    hints:
    - It makes its own light.
    - Nearest one.
    solution: The Sun is a star.
    mistakes: {"planet": "v4_sun_star"}
  - prompt: Why does the Moon shine?
    options:
    - sunlight falls on it
    - it has bulbs
    - it is on fire
    - it makes its own light
    answer: sunlight falls on it
    difficulty: 2
    hints:
    - It has no light of its own.
    - Reflection.
    solution: The Moon reflects sunlight.
    mistakes:
      it makes its own light: c4v_reread
  - prompt: Why do stars look so small?
    options:
    - they are very far away
    - they are tiny like dust
    - they are close
    - they are made of paper
    answer: they are very far away
    difficulty: 1
    hints:
    - Many are bigger than the Sun.
    - Distance.
    solution: Stars look small because they are very far away.
    mistakes: {"they are tiny like dust": "v4_stars_far"}
  - prompt: 'The Saptarishi is a group of stars also called the:'
    options:
    - Big Dipper
    - Milky Way
    - Sun
    - Moon
    answer: Big Dipper
    difficulty: 2
    hints:
    - Shaped like a ladle.
    - Seven stars.
    solution: Saptarishi is the Big Dipper.
    mistakes: {"Milky Way": "v4_saptarishi"}
  - prompt: Why should we never look directly at the Sun?
    options:
    - it can harm our eyes
    - it is too small
    - it is cold
    - it moves too fast
    answer: it can harm our eyes
    difficulty: 1
    hints:
    - Very bright.
    - Eyes.
    solution: Looking at the Sun can damage your eyes.
    mistakes: {"it is cold": "v4_sun_eyes"}
  - prompt: What do we call a group of stars that makes a pattern?
    options:
    - constellation
    - planet
    - comet
    - rainbow
    answer: constellation
    difficulty: 2
    hints:
    - Like the Big Dipper.
    - Star pattern.
    solution: A star pattern is a constellation.
    mistakes: {"comet": "v4_constellation"}
  - prompt: Why can we not see stars in the daytime?
    options:
    - the bright Sun hides them
    - they go away in the day
    - they turn off
    answer: the bright Sun hides them
    difficulty: 2
    hints:
    - Stars are still there in the day.
    - What bright light fills the day sky?
    solution: 'Step 1: Stars shine all the time. Step 2: The Sun''s bright light hides them in the day.'
    mistakes:
      they go away in the day: c4v10_light
      they turn off: c4v10_light
  - prompt: Which of these makes its own light?
    options:
    - a star
    - the Moon
    - a mirror
    answer: a star
    difficulty: 1
    hints:
    - The Moon and a mirror only reflect.
    - Which one is a ball of burning gas?
    solution: 'Step 1: The Moon and mirrors reflect light. Step 2: Stars make their own light.'
    mistakes:
      the Moon: c4v10_light
      a mirror: c4v10_light
  - prompt: Which can we see in the day sky?
    options:
    - the Sun, clouds and birds
    - only stars
    - only the Big Dipper
    answer: the Sun, clouds and birds
    difficulty: 1
    hints:
    - Look up on a sunny afternoon.
    - Stars hide in the day.
    solution: 'Step 1: Stars are hidden in daylight. Step 2: We see the Sun, clouds and birds.'
    mistakes:
      only stars: c4v10_light
      only the Big Dipper: c4v10_light
  - prompt: About how long does the Moon take to go from one full moon to the next?
    options:
    - about a month
    - one day
    - one year
    answer: about a month
    difficulty: 2
    hints:
    - Watch it change night after night.
    - The word 'month' comes from 'moon'.
    solution: 'Step 1: The Moon''s shape changes slowly. Step 2: A full cycle takes about a month.'
    mistakes:
      one day: c4v10_light
      one year: c4v10_light
  - prompt: 'A coin held close to your eye can hide a big tree far away. This shows that:'
    options:
    - far things look smaller
    - coins are bigger than trees
    - trees shrink
    answer: far things look smaller
    difficulty: 3
    hints:
    - The coin is near; the tree is far.
    - Which looks bigger?
    solution: 'Step 1: The near coin looks big; the far tree looks small. Step 2: Distance makes things look smaller.'
    mistakes:
      coins are bigger than trees: c4v10_far
      trees shrink: c4v10_far
  - prompt: How can we safely watch the Sun?
    options:
    - through special solar glasses with an adult
    - staring straight at it
    - through binoculars
    answer: through special solar glasses with an adult
    difficulty: 2
    hints:
    - Direct sunlight can harm eyes.
    - Binoculars make it even stronger.
    solution: 'Step 1: Never look straight at the Sun. Step 2: Use special solar glasses with an adult.'
    mistakes:
      staring straight at it: c4v10_light
      through binoculars: c4v10_light
  - prompt: How many stars are in the Saptarishi?
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - '''Sapta'' means a number in Sanskrit.'
    - Think of 'saptah', the week.
    solution: 'Step 1: Sapta = seven. Step 2: The Saptarishi has 7 bright stars.'
    mistakes:
      '5': c4v10_far
      '9': c4v10_far
      '3': c4v10_far
  - prompt: On which night can we not see the Moon at all?
    options:
    - new moon night (amavasya)
    - full moon night
    - every Sunday
    answer: new moon night (amavasya)
    difficulty: 2
    hints:
    - The lit side faces away from us.
    - Its Hindi name is amavasya.
    solution: 'Step 1: On one night the Moon''s lit side faces away. Step 2: That is the new moon.'
    mistakes:
      full moon night: c4v10_light
      every Sunday: c4v10_light
  - prompt: Why do stars seem to twinkle?
    options:
    - their light passes through moving air
    - they blink on and off
    - they are moving fast
    answer: their light passes through moving air
    difficulty: 3
    hints:
    - The air around Earth is always moving.
    - Starlight passes through it to reach us.
    solution: 'Step 1: Moving air bends the starlight a little. Step 2: So stars seem to twinkle.'
    mistakes:
      they blink on and off: c4v10_far
      they are moving fast: c4v10_far
  - prompt: 'Case: On a camping trip, a child says, ''The Moon is like a bulb: it makes its own light.'' What should the others explain?'
    options:
    - The Moon shines because sunlight falls on it
    - The Moon is a star that burns
    - The Moon shines because of the clouds
    answer: The Moon shines because sunlight falls on it
    hints:
    - Does the Moon make its own light?
    - Where does the light we see on the Moon come from?
    solution: The Moon has no light of its own. It shines because sunlight falls on it and bounces off.
    mistakes:
      The Moon is a star that burns: c4v10_light
      The Moon shines because of the clouds: c4v10_light
    exam: case
    difficulty: 2
  - prompt: 'Situation: There will be a solar eclipse, and your friend plans to stare at the Sun to watch it. What should you tell your friend?'
    options:
    - Never look straight at the Sun; watch only with special solar glasses and an adult
    - Look at it quickly with sunglasses
    - Stare at it through a mirror
    answer: Never look straight at the Sun; watch only with special solar glasses and an adult
    hints:
    - What can the Sun's light do to our eyes?
    - What is the safe way to watch the Sun?
    solution: Looking straight at the Sun can hurt the eyes, even during an eclipse. Use special solar glasses with an adult.
    mistakes:
      Look at it quickly with sunglasses: c4v10_light
      Stare at it through a mirror: c4v10_light
    exam: competency
    difficulty: 2
- code: cbse4v.sky.weather
  title: Clouds, rain and the sky above
  after:
  - cbse4v.sky.objects
  notes: |
    Water from seas, rivers and puddles heats up and rises as vapour (evaporation), cools into clouds, and falls as rain
    (water cycle). Dark, heavy clouds bring rain. A rainbow appears when the Sun shines through raindrops. Space: India's
    ISRO sends satellites and missions (Chandrayaan to the Moon).
  explanations:
    text: The Sun warms water so it rises into the air as invisible vapour. High up it cools into clouds. When clouds get heavy, rain falls. Then the water flows back to rivers and seas, and it all starts again.
    visual: 'Draw the water cycle: sun warming the sea, arrows up to a cloud, rain falling on a hill, a river flowing back to the sea.'
    step_by_step: 'Step 1: Sun heats water. Step 2: Vapour rises. Step 3: Cools into clouds. Step 4: Rain falls. Step 5: Water returns to the sea.'
    real_world: India's Chandrayaan-3 landed near the Moon's south pole in 2023.
  picture:
    kind: flow
    steps:
    - Sun heats sea water
    - Vapour rises
    - Cools into clouds
    - Rain falls
    - Rivers flow back to sea
    alt: 'The water cycle: the Sun heats sea water, vapour rises, cools into clouds, rain falls, and rivers flow back to the sea.'
  activity:
    type: order
    prompt: Follow water around the water cycle.
    steps:
    - The Sun warms water in seas and ponds
    - Water rises as invisible vapour
    - High up, the vapour cools into clouds
    - Heavy clouds bring rain
    - Rain water flows back to rivers and the sea
    reasons:
      Water rises as invisible vapour: Water needs warming before it rises as vapour.
      High up, the vapour cools into clouds: Vapour has to rise first; it cools high up.
      Heavy clouds bring rain: Clouds must form before rain can fall.
      Rain water flows back to rivers and the sea: The rain must fall first; then it flows back.
  lesson:
    - teach: The Sun heats water in seas, rivers and puddles. The water turns into vapour and rises. This is evaporation. Wet clothes dry in the sun the same way.
      check:
        prompt: 'Wet clothes dry in the sun because the water:'
        options:
        - evaporates
        - freezes
        - turns into cloth
        answer: evaporates
        why: Heat turns the water into vapour.
      ways:
      - style: step_by_step
        teach: 'See evaporation for yourself. Step 1: Pour a little water on two plates. Step 2: Keep one plate in the sun and one in the shade. Step 3: Check after an hour. Step 4: The sunny plate dries first, because heat turns the water into vapour faster.'
      - style: visual
        teach: When water evaporates fast and when it evaporates slowly.
        picture:
          kind: compare
          columns:
          - title: Evaporates fast
            points:
            - Hot, sunny day
            - Windy weather
            - Water spread out thin
          - title: Evaporates slowly
            points:
            - Cool, cloudy day
            - Still air
            - Water in a deep pot
          alt: Water evaporates fast on a hot, sunny day, in windy weather and when spread out thin. It evaporates slowly on a cool, cloudy day, in still air and when kept in a deep pot.
    - teach: High up, the vapour cools into tiny drops of water that make clouds. When the drops join and get heavy, they fall as rain. Then the water flows back to rivers and seas. This is the water cycle.
      picture:
        kind: flow
        steps:
        - Sun heats water
        - vapour rises
        - cools into clouds
        - falls as rain
        - flows back to sea
        alt: 'The water cycle: evaporation, clouds, rain, back to the sea.'
      check:
        prompt: What are clouds made of?
        options:
        - tiny drops of water
        - smoke
        - cotton
        answer: tiny drops of water
        why: Cooled vapour becomes tiny drops.
      ways:
      - style: visual
        teach: 'The water cycle: how water goes up and comes back down again.'
        picture:
          kind: flow
          steps:
          - The Sun heats water in seas and rivers
          - Water turns into vapour and rises
          - 'High up, vapour cools into tiny drops: clouds'
          - Drops join, get heavy and fall as rain
          - Rain flows back to rivers and seas
          alt: The Sun heats water in seas and rivers, which turns into vapour and rises. High up, the vapour cools into tiny drops that form clouds. The drops join, get heavy and fall as rain, which flows back to rivers and seas.
      - style: step_by_step
        teach: 'Make a mini water cycle. Step 1: Put warm water in a bowl and cover it with cling film. Step 2: Put a few ice cubes on top of the film. Step 3: Watch drops form under the film. Step 4: They grow and drip back down, like rain.'
    - teach: Dark, heavy clouds bring rain. A rainbow appears when the Sun shines through raindrops. India's space agency ISRO sends satellites to study weather, and Chandrayaan-3 landed on the Moon in 2023.
      check:
        prompt: Where must the Sun be for you to see a rainbow?
        options:
        - behind you, shining on raindrops in front
        - hidden by thick clouds
        - below the ground
        answer: behind you, shining on raindrops in front
        why: Sunlight passes through raindrops ahead of you.
      ways:
      - style: visual
        teach: What we can learn from the sky above us, from clouds to space missions.
        picture:
          kind: compare
          columns:
          - title: In the sky
            points:
            - 'Dark, heavy clouds: rain is coming'
            - 'Sun through raindrops: a rainbow'
          - title: From space
            points:
            - ISRO satellites watch the weather
            - Chandrayaan-3 landed on the Moon in 2023
          alt: Dark, heavy clouds tell us rain is coming, and sun shining through raindrops makes a rainbow. ISRO satellites watch the weather from space, and Chandrayaan-3 landed on the Moon in 2023.
      - style: real_world
        teach: When a cyclone forms over the sea, satellite pictures show its swirl days before it reaches land. Fishers are told to stay home, and coastal families can move to safety in time.
  items:
  - prompt: What happens when the Sun heats water in the sea?
    options:
    - it rises as vapour
    - it turns into stone
    - it freezes
    - nothing
    answer: it rises as vapour
    difficulty: 2
    hints:
    - Evaporation.
    - Like steam.
    solution: Warm water evaporates into vapour.
    mistakes: {"it freezes": "v4_evaporate"}
  - prompt: 'Clouds are made of:'
    options:
    - tiny drops of water
    - cotton
    - smoke only
    - sand
    answer: tiny drops of water
    difficulty: 2
    hints:
    - Cooled vapour.
    - Rain comes from them.
    solution: Clouds are tiny water drops.
    mistakes: {"cotton": "v4_clouds"}
  - prompt: 'Dark heavy clouds usually bring:'
    options:
    - rain
    - snow in Kerala in summer
    - sunshine
    - dust storms only
    answer: rain
    difficulty: 1
    hints:
    - Monsoon.
    - Grey sky.
    solution: Dark clouds usually bring rain.
    mistakes: {"sunshine": "v4_dark_clouds"}
  - prompt: 'A rainbow appears when:'
    options:
    - the Sun shines through raindrops
    - it is midnight
    - there is no sun
    - it is very windy
    answer: the Sun shines through raindrops
    difficulty: 1
    hints:
    - After rain, sun behind you.
    - Colours.
    solution: Sunlight through raindrops makes a rainbow.
    mistakes: {"there is no sun": "v4_rainbow"}
  - prompt: Which Indian mission landed on the Moon in 2023?
    options:
    - Chandrayaan-3
    - Mangalyaan
    - Aditya-L1
    - Gaganyaan
    answer: Chandrayaan-3
    difficulty: 2
    hints:
    - Chandra = Moon.
    - Number 3.
    solution: Chandrayaan-3 landed on the Moon.
    mistakes: {"Mangalyaan": "v4_chandrayaan"}
  - prompt: 'India''s space agency is:'
    options:
    - ISRO
    - NASA
    - RBI
    - BCCI
    answer: ISRO
    difficulty: 1
    hints:
    - Indian Space Research Organisation.
    - Bengaluru.
    solution: ISRO is India's space agency.
    mistakes: {"NASA": "v4_isro"}
  - prompt: A puddle disappears on a sunny day. Where did the water go?
    options:
    - into the air as vapour
    - deep into the Moon
    - it became sand
    answer: into the air as vapour
    difficulty: 1
    hints:
    - The Sun heated it.
    - What does heated water turn into?
    solution: 'Step 1: The Sun heats the puddle. Step 2: The water evaporates into the air.'
    mistakes:
      deep into the Moon: c4v10_cycle
      it became sand: c4v10_cycle
  - prompt: Why do we see a rainbow sometimes after rain?
    options:
    - sunlight shines through raindrops
    - clouds paint the sky
    - the Moon makes it
    answer: sunlight shines through raindrops
    difficulty: 2
    hints:
    - Rainbows need two things at once.
    - Rain is one; what is the other?
    solution: 'Step 1: Raindrops are still in the air. Step 2: Sunlight passing through them makes a rainbow.'
    mistakes:
      clouds paint the sky: c4v10_cycle
      the Moon makes it: c4v10_cycle
  - prompt: How many colours are there in a rainbow?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Remember VIBGYOR.
    - Count its letters.
    solution: 'Step 1: VIBGYOR = violet, indigo, blue, green, yellow, orange, red. Step 2: 7 colours.'
    mistakes:
      '5': c4v10_cycle
      '6': c4v10_cycle
      '8': c4v10_cycle
  - prompt: Where does rainwater go after it falls?
    options:
    - into rivers, ponds, soil and back to the sea
    - back to the Sun
    - it stays in the sky
    answer: into rivers, ponds, soil and back to the sea
    difficulty: 2
    hints:
    - Water flows downhill.
    - Where does it collect?
    solution: 'Step 1: Rain soaks into soil and flows into rivers. Step 2: Rivers carry it back to the sea.'
    mistakes:
      back to the Sun: c4v10_cycle
      it stays in the sky: c4v10_cycle
  - prompt: Why are water drops seen on the outside of a cold glass?
    options:
    - water vapour in the air cools into drops
    - the glass is leaking
    - the glass is sweating like us
    answer: water vapour in the air cools into drops
    difficulty: 3
    hints:
    - Air has invisible water vapour.
    - What happens to vapour when it touches something cold?
    solution: 'Step 1: Vapour in the air touches the cold glass. Step 2: It cools into drops, like clouds forming.'
    mistakes:
      the glass is leaking: c4v10_cycle
      the glass is sweating like us: c4v10_cycle
  - prompt: Which clouds usually bring rain?
    options:
    - dark, heavy clouds
    - thin white clouds
    - no clouds
    answer: dark, heavy clouds
    difficulty: 1
    hints:
    - Rain clouds are full of water.
    - Full clouds look ...
    solution: 'Step 1: Clouds full of water look dark. Step 2: Dark heavy clouds bring rain.'
    mistakes:
      thin white clouds: c4v10_cycle
      no clouds: c4v10_cycle
  - prompt: What do weather satellites from ISRO help us do?
    options:
    - warn people about storms and cyclones
    - make it rain
    - stop the wind
    answer: warn people about storms and cyclones
    difficulty: 2
    hints:
    - Satellites watch Earth from space.
