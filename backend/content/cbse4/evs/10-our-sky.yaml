# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 10
title: Our Sky
tips:
  v4_chandrayaan: "'Chandra' means Moon; 'Mangal' means Mars."
  v4_clouds: "Clouds look fluffy but they are made of water."
  v4_constellation: "A comet has a tail. Star patterns like Orion have another name."
  v4_dark_clouds: "Dark clouds are heavy with water. What falls from them?"
  v4_evaporate: "Heat makes water go up into the air, like steam from a kettle."
  v4_isro: "NASA is America's. India's agency is in Bengaluru and starts with I."
  v4_rainbow: "You need both sunshine and rain for a rainbow."
  v4_saptarishi: "Seven stars that look like a big ladle or spoon."
  v4_stars_far: "Many stars are bigger than the Sun. Why would they look like dots?"
  v4_sun_eyes: "The Sun is very bright and hot. What can it do to eyes?"
  v4_sun_star: "The Sun makes its own light and heat. Planets don't."

concepts:
- code: cbse4v.sky.objects
  title: Sun, Moon and stars
  notes: |
    In the day sky: the Sun (a star, gives light and heat), clouds, birds, aeroplanes. In the night sky: the Moon (reflects
    sunlight, changes shape over a month), stars (very far suns, twinkle), groups of stars (constellations, like the Big
    Dipper / Saptarishi). Never look directly at the Sun.
  explanations:
    text: 'The Sun is a star that gives us light and heat. At night we see the Moon and many stars. The Moon has no light of its own: it shines because sunlight falls on it. Stars look tiny because they are very, very far away.'
    visual: Draw a night sky with a half Moon and the seven stars of the Saptarishi (Big Dipper) shaped like a ladle.
    step_by_step: 'Step 1: Is it day or night? Step 2: Which objects do you see? Step 3: Which give their own light (Sun, stars) and which reflect it (Moon)?'
    real_world: Stargazing on a clear night away from city lights shows thousands of stars.
  picture:
    kind: compare
    columns:
    - title: Gives its own light
      points:
      - Sun
      - stars
    - title: Shines by reflected light
      points:
      - Moon
    alt: The Sun and stars give their own light; the Moon shines by reflecting sunlight.
  activity:
    type: sort
    prompt: Sun, Moon or stars?
    bins:
    - Sun
    - Moon
    - Stars
    items:
    - label: Gives us light and heat in the day
      bin: Sun
      clue: Warms the Earth.
      why: The Sun.
    - label: The nearest star to the Earth
      bin: Sun
      clue: So close it looks big and bright.
      why: The Sun is a star.
    - label: Has no light of its own; shines with sunlight
      bin: Moon
      clue: Like a mirror in the sky.
      why: The Moon.
    - label: Looks a different shape on different nights
      bin: Moon
      clue: Full, half, thin.
      why: The Moon.
    - label: Tiny twinkling lights far away
      bin: Stars
      clue: Thousands at night.
      why: Stars.
    - label: The Pole Star
      bin: Stars
      clue: It stays in the north sky.
      why: A star.
  items:
  - prompt: 'The Sun is a:'
    options:
    - star
    - planet
    - moon
    - cloud
    answer: star
    difficulty: 1
    hints:
    - It makes its own light.
    - Nearest one.
    solution: The Sun is a star.
    mistakes: {"planet": "v4_sun_star"}
  - prompt: Why does the Moon shine?
    options:
    - sunlight falls on it
    - it has bulbs
    - it is on fire
    - it makes its own light
    answer: sunlight falls on it
    difficulty: 2
    hints:
    - It has no light of its own.
    - Reflection.
    solution: The Moon reflects sunlight.
    mistakes:
      it makes its own light: c4v_reread
  - prompt: Why do stars look so small?
    options:
    - they are very far away
    - they are tiny like dust
    - they are close
    - they are made of paper
    answer: they are very far away
    difficulty: 1
    hints:
    - Many are bigger than the Sun.
    - Distance.
    solution: Stars look small because they are very far away.
    mistakes: {"they are tiny like dust": "v4_stars_far"}
  - prompt: 'The Saptarishi is a group of stars also called the:'
    options:
    - Big Dipper
    - Milky Way
    - Sun
    - Moon
    answer: Big Dipper
    difficulty: 2
    hints:
    - Shaped like a ladle.
    - Seven stars.
    solution: Saptarishi is the Big Dipper.
    mistakes: {"Milky Way": "v4_saptarishi"}
  - prompt: Why should we never look directly at the Sun?
    options:
    - it can harm our eyes
    - it is too small
    - it is cold
    - it moves too fast
    answer: it can harm our eyes
    difficulty: 1
    hints:
    - Very bright.
    - Eyes.
    solution: Looking at the Sun can damage your eyes.
    mistakes: {"it is cold": "v4_sun_eyes"}
  - prompt: What do we call a group of stars that makes a pattern?
    options:
    - constellation
    - planet
    - comet
    - rainbow
    answer: constellation
    difficulty: 2
    hints:
    - Like the Big Dipper.
    - Star pattern.
    solution: A star pattern is a constellation.
    mistakes: {"comet": "v4_constellation"}
- code: cbse4v.sky.weather
  title: Clouds, rain and the sky above
  after:
  - cbse4v.sky.objects
  notes: |
    Water from seas, rivers and puddles heats up and rises as vapour (evaporation), cools into clouds, and falls as rain
    (water cycle). Dark, heavy clouds bring rain. A rainbow appears when the Sun shines through raindrops. Space: India's
    ISRO sends satellites and missions (Chandrayaan to the Moon).
  explanations:
    text: The Sun warms water so it rises into the air as invisible vapour. High up it cools into clouds. When clouds get heavy, rain falls. Then the water flows back to rivers and seas, and it all starts again.
    visual: 'Draw the water cycle: sun warming the sea, arrows up to a cloud, rain falling on a hill, a river flowing back to the sea.'
    step_by_step: 'Step 1: Sun heats water. Step 2: Vapour rises. Step 3: Cools into clouds. Step 4: Rain falls. Step 5: Water returns to the sea.'
    real_world: India's Chandrayaan-3 landed near the Moon's south pole in 2023.
  picture:
    kind: flow
    steps:
    - Sun heats sea water
    - Vapour rises
    - Cools into clouds
    - Rain falls
    - Rivers flow back to sea
    alt: 'The water cycle: the Sun heats sea water, vapour rises, cools into clouds, rain falls, and rivers flow back to the sea.'
  activity:
    type: order
    prompt: Follow water around the water cycle.
    steps:
    - The Sun warms water in seas and ponds
    - Water rises as invisible vapour
    - High up, the vapour cools into clouds
    - Heavy clouds bring rain
    - Rain water flows back to rivers and the sea
    reasons:
      Water rises as invisible vapour: Water needs warming before it rises as vapour.
      High up, the vapour cools into clouds: Vapour has to rise first; it cools high up.
      Heavy clouds bring rain: Clouds must form before rain can fall.
      Rain water flows back to rivers and the sea: The rain must fall first; then it flows back.
  items:
  - prompt: What happens when the Sun heats water in the sea?
    options:
    - it rises as vapour
    - it turns into stone
    - it freezes
    - nothing
    answer: it rises as vapour
    difficulty: 2
    hints:
    - Evaporation.
    - Like steam.
    solution: Warm water evaporates into vapour.
    mistakes: {"it freezes": "v4_evaporate"}
  - prompt: 'Clouds are made of:'
    options:
    - tiny drops of water
    - cotton
    - smoke only
    - sand
    answer: tiny drops of water
    difficulty: 2
    hints:
    - Cooled vapour.
    - Rain comes from them.
    solution: Clouds are tiny water drops.
    mistakes: {"cotton": "v4_clouds"}
  - prompt: 'Dark heavy clouds usually bring:'
    options:
    - rain
    - snow in Kerala in summer
    - sunshine
    - dust storms only
    answer: rain
    difficulty: 1
    hints:
    - Monsoon.
    - Grey sky.
    solution: Dark clouds usually bring rain.
    mistakes: {"sunshine": "v4_dark_clouds"}
  - prompt: 'A rainbow appears when:'
    options:
    - the Sun shines through raindrops
    - it is midnight
    - there is no sun
    - it is very windy
    answer: the Sun shines through raindrops
    difficulty: 1
    hints:
    - After rain, sun behind you.
    - Colours.
    solution: Sunlight through raindrops makes a rainbow.
    mistakes: {"there is no sun": "v4_rainbow"}
  - prompt: Which Indian mission landed on the Moon in 2023?
    options:
    - Chandrayaan-3
    - Mangalyaan
    - Aditya-L1
    - Gaganyaan
    answer: Chandrayaan-3
    difficulty: 2
    hints:
    - Chandra = Moon.
    - Number 3.
    solution: Chandrayaan-3 landed on the Moon.
    mistakes: {"Mangalyaan": "v4_chandrayaan"}
  - prompt: 'India''s space agency is:'
    options:
    - ISRO
    - NASA
    - RBI
    - BCCI
    answer: ISRO
    difficulty: 1
    hints:
    - Indian Space Research Organisation.
    - Bengaluru.
    solution: ISRO is India's space agency.
    mistakes: {"NASA": "v4_isro"}
