# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 7
title: How Things Work
tips:
  v4_battery: "Open the back of a torch. What do you put inside?"
  v4_lever: "A see-saw is a long bar that tips up and down on a point in the middle."
  v4_pulley: "A wheel with a rope over it hangs above the well."
  v4_push_pull: "To open a door you move it with your hand. Which force is that?"
  v4_ramp: "A ramp is a slope. Think of rolling a drum onto a truck."
  v4_wedge: "A knife's blade is thin at one edge and thick at the other, and splits things apart."
  v4_wheels: "Think of a cart or a trolley. What do wheels help you do?"
  c4v7_tool: "Picture the tool in action: which part moves, which way does it move, and what does that do to the load?"
  c4v7_energy: "Ask what the thing needs to keep running. Is it plugged in, filled with fuel, pushed by muscles, or turned by something in nature?"
  c4v7_safe: Water carries electricity. Think what could happen to your body if the current found a path through it.

concepts:
- code: cbse4v.work.simple
  title: Simple tools and machines
  notes: |
    Tools make work easier. A lever (see-saw, bottle opener), a wheel (cart, cycle), a pulley (drawing water from a well),
    a slope or ramp (loading a truck), a wedge (knife, axe), a screw (jar lid). Pushing and pulling move things. Wheels
    make moving heavy things easier.
  explanations:
    text: Simple machines help us do work with less effort. A pulley helps lift a bucket from a well, wheels help move heavy loads, a ramp helps push things up, and a see-saw is a lever.
    visual: Draw a well with a pulley and a rope lifting a bucket, a cart with wheels and a ramp up to a truck.
    step_by_step: 'Step 1: Name the job. Step 2: Find the tool. Step 3: Ask how it makes the job easier: less push, less pull or less lifting.'
    real_world: Village wells use a pulley; vegetable carts use wheels; a ramp at school helps wheelchair users.
  picture:
    kind: compare
    columns:
    - title: Simple machine
      points:
      - pulley
      - wheel
      - lever
    - title: Example
      points:
      - drawing water from a well
      - bicycle, cart
      - see-saw, bottle opener
    alt: A pulley draws water from a well, wheels are on bicycles and carts, and a lever is like a see-saw or bottle opener.
  activity:
    type: sort
    prompt: Which simple machine helps here?
    bins:
    - Pulley
    - Wheel
    - Ramp
    - Lever
    items:
    - label: Pulling a bucket up from a well
      bin: Pulley
      clue: A rope over a turning wheel.
      why: A pulley.
    - label: Raising a flag up a pole
      bin: Pulley
      clue: Pull down, flag goes up.
      why: A pulley.
    - label: A bullock cart
      bin: Wheel
      clue: Rolls along the road.
      why: Wheels.
    - label: A trolley at the station
      bin: Wheel
      clue: Pushes heavy bags easily.
      why: Wheels.
    - label: Pushing a drum up a sloping plank into a truck
      bin: Ramp
      clue: Up a slope instead of lifting.
      why: A ramp.
    - label: A slope for wheelchairs at school
      bin: Ramp
      clue: Gentle way up.
      why: A ramp.
    - label: A see-saw
      bin: Lever
      clue: A bar resting on a middle point.
      why: A lever.
    - label: A bottle opener
      bin: Lever
      clue: Pushes the cap up from one edge.
      why: A lever.
  lesson:
    - teach: Tools and simple machines make work easier. A lever tips on a point to lift things (a see-saw, a bottle opener). A wheel helps move heavy loads (a cart, a cycle).
      check:
        prompt: 'A bottle opener works like a:'
        options:
        - lever
        - pulley
        - wheel
        answer: lever
        why: It tips on a point to lift the cap.
    - teach: A pulley is a wheel with a rope, used to pull water up from a well. A ramp (slope) helps push heavy things up. A wedge (knife, axe) splits or cuts. A screw (jar lid) holds things tight by turning.
      picture:
        kind: compare
        columns:
        - title: Lifts or moves
          points:
          - 'lever: see-saw'
          - 'pulley: well'
          - 'wheel: cart'
        - title: Slopes
          points:
          - 'ramp: loading truck'
          - 'wedge: knife, axe'
          - 'screw: jar lid'
        alt: Six simple machines with everyday examples.
      check:
        prompt: Which simple machine is a jar lid?
        options:
        - screw
        - pulley
        - lever
        answer: screw
        why: You turn it round and round to close it tight.
    - teach: 'Every machine needs a push or a pull to work. Pulling a rope, pushing a cart, turning a handle: all are pushes or pulls.'
      check:
        prompt: 'Drawing water up with a pulley rope is a:'
        options:
        - pull
        - push
        - neither
        answer: pull
        why: You pull the rope down to lift the bucket up.
  items:
  - prompt: What helps lift a bucket of water from a well?
    options:
    - pulley
    - spoon
    - comb
    - pencil
    answer: pulley
    difficulty: 1
    hints:
    - A wheel with a rope.
    - Well.
    solution: A pulley helps lift the bucket.
    mistakes: {"spoon": "v4_pulley"}
  - prompt: 'Wheels make it easier to:'
    options:
    - move heavy things
    - cut paper
    - write
    - cook rice
    answer: move heavy things
    difficulty: 1
    hints:
    - Carts and cycles.
    - Rolling.
    solution: Wheels help move heavy loads.
    mistakes: {"cut paper": "v4_wheels"}
  - prompt: 'A see-saw is an example of a:'
    options:
    - lever
    - pulley
    - screw
    - wedge
    answer: lever
    difficulty: 2
    hints:
    - It goes up and down on a middle point.
    - Bottle opener too.
    solution: A see-saw is a lever.
    mistakes: {"pulley": "v4_lever"}
  - prompt: 'A ramp helps:'
    options:
    - push things up to a higher place
    - cut vegetables
    - draw water
    - open jars
    answer: push things up to a higher place
    difficulty: 1
    hints:
    - A slope.
    - Wheelchairs.
    solution: A ramp makes it easier to move things up.
    mistakes: {"cut vegetables": "v4_ramp"}
  - prompt: 'A knife cuts because it works like a:'
    options:
    - wedge
    - pulley
    - wheel
    - lever
    answer: wedge
    difficulty: 2
    hints:
    - Thin sharp edge.
    - Axe too.
    solution: A knife's sharp edge is a wedge.
    mistakes: {"lever": "v4_wedge"}
  - prompt: 'Opening a door is an example of a:'
    options:
    - push or pull
    - melting
    - freezing
    - growing
    answer: push or pull
    difficulty: 1
    hints:
    - You move it.
    - Force.
    solution: We push or pull to open doors.
    mistakes: {"melting": "v4_push_pull"}
  - prompt: Which tool works like a wedge?
    options:
    - an axe
    - a see-saw
    - a wheelbarrow wheel
    answer: an axe
    difficulty: 1
    hints:
    - A wedge has a thin sharp edge.
    - Which one splits wood?
    solution: 'Step 1: A wedge splits things apart. Step 2: An axe splits wood.'
    mistakes:
      a see-saw: c4v7_tool
      a wheelbarrow wheel: c4v7_tool
  - prompt: Why is it easier to push a heavy box up a ramp than lift it straight up?
    options:
    - the slope lets you use less force over a longer way
    - the box becomes lighter
    - ramps pull the box
    answer: the slope lets you use less force over a longer way
    difficulty: 3
    hints:
    - The box is still the same weight.
    - 'What changes: the force or the distance?'
    solution: 'Step 1: The ramp is longer than the straight lift. Step 2: Going the longer way needs less force.'
    mistakes:
      the box becomes lighter: c4v7_tool
      ramps pull the box: c4v7_tool
  - prompt: 'A flag is raised to the top of a pole using a:'
    options:
    - pulley
    - wedge
    - screw
    answer: pulley
    difficulty: 2
    hints:
    - You pull a rope down to send the flag up.
    - Which machine has a wheel and rope?
    solution: 'Step 1: Pulling the rope down lifts the flag. Step 2: That is a pulley.'
    mistakes:
      wedge: c4v7_tool
      screw: c4v7_tool
  - prompt: Which of these does NOT use wheels?
    options:
    - a boat
    - a bicycle
    - a bullock cart
    answer: a boat
    difficulty: 1
    hints:
    - Wheels roll on land.
    - Which one moves on water?
    solution: 'Step 1: Bicycles and carts roll on wheels. Step 2: A boat floats on water.'
    mistakes:
      a bicycle: c4v7_tool
      a bullock cart: c4v7_tool
  - prompt: On a see-saw, a heavier child sits closer to the middle. Why?
    options:
    - so the see-saw balances
    - to go higher
    - to make it break
    answer: so the see-saw balances
    difficulty: 3
    hints:
    - A see-saw is a lever.
    - Moving closer to the middle has less turning effect.
    solution: 'Step 1: Weight near the middle tips the lever less. Step 2: This balances the lighter child.'
    mistakes:
      to go higher: c4v7_tool
      to make it break: c4v7_tool
  - prompt: 'Kicking a football is a:'
    options:
    - push
    - pull
    - lift
    answer: push
    difficulty: 1
    hints:
    - Your foot moves the ball away from you.
    - Away from you is a ...
    solution: 'Step 1: The foot moves the ball away. Step 2: Moving something away is a push.'
    mistakes:
      pull: c4v7_tool
      lift: c4v7_tool
  - prompt: 'Scissors are made of two levers joined together, with blades that act like:'
    options:
    - wedges
    - pulleys
    - wheels
    answer: wedges
    difficulty: 3
    hints:
    - The blades have sharp edges.
    - Which simple machine cuts?
    solution: 'Step 1: The handles work as levers. Step 2: The sharp blades are wedges that cut.'
    mistakes:
      pulleys: c4v7_tool
      wheels: c4v7_tool
  - prompt: A shopkeeper uses a trolley with wheels to move sacks. Why?
    options:
    - wheels make heavy things easier to move
    - wheels make sacks lighter
    - it looks nice
    answer: wheels make heavy things easier to move
    difficulty: 1
    hints:
    - Try dragging a sack on the floor.
    - Rolling is easier than dragging.
    solution: 'Step 1: Dragging is hard. Step 2: Wheels roll, so moving heavy things is easier.'
    mistakes:
      wheels make sacks lighter: c4v7_tool
      it looks nice: c4v7_tool
  - prompt: 'Opening a drawer is a:'
    options:
    - pull
    - push
    - turn
    answer: pull
    difficulty: 1
    hints:
    - The drawer comes towards you.
    - Towards you is a ...
    solution: 'Step 1: The drawer moves towards you. Step 2: That is a pull.'
    mistakes:
      push: c4v7_tool
      turn: c4v7_tool
- code: cbse4v.work.energy
  title: What makes things work
  after:
  - cbse4v.work.simple
  notes: |
    Things need energy to work: our muscles (food), electricity (fan, bulb, mixer), fuel (petrol for scooters, LPG for
    cooking), wind (windmill), water (water mill), sunlight (solar lamp). Batteries store electricity for torches and
    remotes. Use electricity safely: never touch switches with wet hands; don't poke into sockets.
  explanations:
    text: Everything that works needs energy. We get energy from food; fans and bulbs use electricity; scooters use petrol; solar lamps use sunlight. Electricity can be dangerous, so use it safely.
    visual: Draw a fan with a wire to a socket, a scooter at a petrol pump and a solar lamp in the sun.
    step_by_step: 'Step 1: Name the thing. Step 2: Ask what makes it work. Step 3: Is it safe to use? How?'
    real_world: Many homes use solar water heaters and solar lamps, which run on sunlight.
  picture:
    kind: flow
    steps:
    - Sunlight
    - Solar panel
    - Stores in battery
    - Lamp glows at night
    alt: 'A solar lamp: sunlight falls on a solar panel, which stores energy in a battery so the lamp glows at night.'
  activity:
    type: sort
    prompt: What gives the energy to make it work?
    bins:
    - Food
    - Electricity
    - Petrol or diesel
    - Sunlight
    items:
    - label: You, running in the playground
      bin: Food
      clue: What did you eat for breakfast?
      why: Food.
    - label: A bullock pulling a cart
      bin: Food
      clue: It eats grass.
      why: Food.
    - label: A ceiling fan
      bin: Electricity
      clue: Plugged into the switchboard.
      why: Electricity.
    - label: A bulb
      bin: Electricity
      clue: Switch it on.
      why: Electricity.
    - label: A scooter
      bin: Petrol or diesel
      clue: Filled at a pump.
      why: Petrol.
    - label: A truck
      bin: Petrol or diesel
      clue: Filled at a pump.
      why: Diesel.
    - label: A solar lamp
      bin: Sunlight
      clue: Charged on the roof by day.
      why: Sunlight.
    - label: A solar cooker
      bin: Sunlight
      clue: Placed in bright sunshine.
      why: Sunlight.
  lesson:
    - teach: Everything that works needs energy. Our body gets energy from food. Fans, bulbs and mixers use electricity. Scooters use petrol; gas stoves use LPG.
      check:
        prompt: 'A mixer in the kitchen runs on:'
        options:
        - electricity
        - food
        - wind
        answer: electricity
        why: It is plugged into a socket.
    - teach: Nature gives energy too. Windmills use wind, water mills use flowing water, and solar panels use sunlight. These never run out, so they are good for the Earth.
      picture:
        kind: compare
        columns:
        - title: From nature
          points:
          - 'wind: windmill'
          - 'water: water mill'
          - 'sunlight: solar lamp'
        - title: From fuel or plug
          points:
          - 'petrol: scooter'
          - 'LPG: gas stove'
          - 'electricity: fan'
        alt: Energy sources from nature and from fuel or electricity.
      check:
        prompt: Which energy source will not run out?
        options:
        - sunlight
        - petrol
        - LPG
        answer: sunlight
        why: The Sun shines every day.
    - teach: 'Batteries store electricity for torches, clocks and remotes. Use electricity safely: never touch switches with wet hands and never poke anything into a socket.'
      check:
        prompt: Why should we not touch a switch with wet hands?
        options:
        - we may get an electric shock
        - the switch gets rusty
        - the light becomes dim
        answer: we may get an electric shock
        why: Water lets electricity pass into the body.
  items:
  - prompt: 'A ceiling fan works on:'
    options:
    - electricity
    - petrol
    - food
    - wind only
    answer: electricity
    difficulty: 1
    hints:
    - Switch.
    - Wires.
    solution: A fan uses electricity.
    mistakes: {"petrol": "v5_fan"}
  - prompt: 'A torch gets electricity from:'
    options:
    - batteries
    - water
    - petrol
    - sand
    answer: batteries
    difficulty: 1
    hints:
    - Cells inside.
    - Replace them.
    solution: Torches use batteries.
    mistakes: {"water": "v4_battery"}
  - prompt: Which is unsafe?
    options:
    - touching a switch with wet hands
    - switching off lights when leaving
    - using a solar lamp
    - drying hands before using switches
    answer: touching a switch with wet hands
    difficulty: 1
    hints:
    - Water and electricity are dangerous together.
    - Shock.
    solution: Wet hands can cause electric shock.
    mistakes:
      drying hands before using switches: c4v_reread
  - prompt: 'A solar lamp works using:'
    options:
    - sunlight
    - petrol
    - coal
    - food
    answer: sunlight
    difficulty: 2
    hints:
    - Solar = Sun.
    - Panel.
    solution: Solar lamps use sunlight.
    mistakes: {"coal": "v5_solar"}
  - prompt: 'Our body gets energy to work and play from:'
    options:
    - food
    - electricity
    - petrol
    - batteries
    answer: food
    difficulty: 1
    hints:
    - Eat to play.
    - Meals.
    solution: Food gives us energy.
    mistakes: {"electricity": "v5_body_energy"}
  - prompt: 'A windmill uses:'
    options:
    - wind
    - petrol
    - coal
    - sunlight only
    answer: wind
    difficulty: 1
    hints:
    - The name.
    - Moving air.
    solution: Windmills are turned by wind.
    mistakes: {"sunlight only": "v5_windmill"}
  - prompt: Which of these needs batteries?
    options:
    - a TV remote
    - a ceiling fan
    - a bicycle
    answer: a TV remote
    difficulty: 1
    hints:
    - It is small and not plugged in.
    - You hold it in your hand.
    solution: 'Step 1: A fan uses wall electricity; a bicycle uses muscles. Step 2: A remote uses batteries.'
    mistakes:
      a ceiling fan: c4v7_energy
      a bicycle: c4v7_energy
  - prompt: What makes a sailboat move?
    options:
    - wind
    - electricity
    - batteries
    answer: wind
    difficulty: 1
    hints:
    - Sails catch something.
    - What pushes the sail?
    solution: 'Step 1: The sail catches moving air. Step 2: Wind pushes the boat.'
    mistakes:
      electricity: c4v7_energy
      batteries: c4v7_energy
  - prompt: Which is the safest way to pull a plug out?
    options:
    - switch off, then hold the plug and pull with dry hands
    - pull the wire hard
    - use wet hands
    answer: switch off, then hold the plug and pull with dry hands
    difficulty: 2
    hints:
    - Pulling wires can break them.
    - Wet hands are dangerous.
    solution: 'Step 1: Switch off first. Step 2: Hold the plug, not the wire, with dry hands.'
    mistakes:
      pull the wire hard: c4v7_safe
      use wet hands: c4v7_safe
  - prompt: 'A bullock cart moves using energy from:'
    options:
    - the bullocks' muscles
    - petrol
    - sunlight panels
    answer: the bullocks' muscles
    difficulty: 2
    hints:
    - Who pulls the cart?
    - Where do animals get energy?
    solution: 'Step 1: Bullocks pull the cart. Step 2: Their muscles use energy from food.'
    mistakes:
      petrol: c4v7_energy
      sunlight panels: c4v7_energy
  - prompt: Why do we switch off lights when leaving a room?
    options:
    - to save electricity
    - to make the bulb brighter later
    - because bulbs get hungry
    answer: to save electricity
    difficulty: 1
    hints:
    - No one is using the light.
    - What is being used up?
    solution: 'Step 1: An empty room does not need light. Step 2: Switching off saves electricity.'
    mistakes:
      to make the bulb brighter later: c4v7_energy
      because bulbs get hungry: c4v7_energy
  - prompt: A torch does not light up. What should we check first?
    options:
    - whether the batteries are dead
    - whether it is raining
    - whether it is daytime
    answer: whether the batteries are dead
    difficulty: 2
    hints:
    - Where does a torch get its energy?
    - That store can run out.
    solution: 'Step 1: A torch works on batteries. Step 2: Dead batteries mean no light.'
    mistakes:
      whether it is raining: c4v7_energy
      whether it is daytime: c4v7_energy
  - prompt: Which uses flowing water to work?
    options:
    - a water mill
    - a solar lamp
    - a gas stove
    answer: a water mill
    difficulty: 2
    hints:
    - Rivers flow fast in hills.
    - Which machine has a wheel turned by water?
    solution: 'Step 1: Flowing water turns a big wheel. Step 2: That is a water mill.'
    mistakes:
      a solar lamp: c4v7_energy
      a gas stove: c4v7_energy
  - prompt: Why are solar panels good for the Earth?
    options:
    - they use sunlight and make no smoke
    - they burn coal
    - they need petrol
    answer: they use sunlight and make no smoke
    difficulty: 2
    hints:
    - What do they need to work?
    - Do they give out smoke?
    solution: 'Step 1: Solar panels use sunlight. Step 2: They give no smoke, so they keep the air clean.'
    mistakes:
      they burn coal: c4v7_energy
      they need petrol: c4v7_energy
  - prompt: Why should we never fly kites near electric wires?
    options:
    - the string can touch the wire and give a shock
    - kites fly lower there
    - the wind is too strong
    answer: the string can touch the wire and give a shock
    difficulty: 3
    hints:
    - Wires carry strong electricity.
    - A wet or metal-coated string can carry it to you.
    solution: 'Step 1: Kite strings can get caught on wires. Step 2: Electricity can travel down the string and shock you.'
    mistakes:
      kites fly lower there: c4v7_safe
      the wind is too strong: c4v7_safe
