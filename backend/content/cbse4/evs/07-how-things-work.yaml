# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 7
title: How Things Work
concepts:
- code: cbse4v.work.simple
  title: Simple tools and machines
  notes: |
    Tools make work easier. A lever (see-saw, bottle opener), a wheel (cart, cycle), a pulley (drawing water from a well),
    a slope or ramp (loading a truck), a wedge (knife, axe), a screw (jar lid). Pushing and pulling move things. Wheels
    make moving heavy things easier.
  explanations:
    text: Simple machines help us do work with less effort. A pulley helps lift a bucket from a well, wheels help move heavy loads, a ramp helps push things up, and a see-saw is a lever.
    visual: Draw a well with a pulley and a rope lifting a bucket, a cart with wheels and a ramp up to a truck.
    step_by_step: 'Step 1: Name the job. Step 2: Find the tool. Step 3: Ask how it makes the job easier: less push, less pull or less lifting.'
    real_world: Village wells use a pulley; vegetable carts use wheels; a ramp at school helps wheelchair users.
  picture:
    kind: compare
    columns:
    - title: Simple machine
      points:
      - pulley
      - wheel
      - lever
    - title: Example
      points:
      - drawing water from a well
      - bicycle, cart
      - see-saw, bottle opener
    alt: A pulley draws water from a well, wheels are on bicycles and carts, and a lever is like a see-saw or bottle opener.
  activity:
    type: sort
    prompt: Which simple machine helps here?
    bins:
    - Pulley
    - Wheel
    - Ramp
    - Lever
    items:
    - label: Pulling a bucket up from a well
      bin: Pulley
      clue: A rope over a turning wheel.
      why: A pulley.
    - label: Raising a flag up a pole
      bin: Pulley
      clue: Pull down, flag goes up.
      why: A pulley.
    - label: A bullock cart
      bin: Wheel
      clue: Rolls along the road.
      why: Wheels.
    - label: A trolley at the station
      bin: Wheel
      clue: Pushes heavy bags easily.
      why: Wheels.
    - label: Pushing a drum up a sloping plank into a truck
      bin: Ramp
      clue: Up a slope instead of lifting.
      why: A ramp.
    - label: A slope for wheelchairs at school
      bin: Ramp
      clue: Gentle way up.
      why: A ramp.
    - label: A see-saw
      bin: Lever
      clue: A bar resting on a middle point.
      why: A lever.
    - label: A bottle opener
      bin: Lever
      clue: Pushes the cap up from one edge.
      why: A lever.
  items:
  - prompt: What helps lift a bucket of water from a well?
    options:
    - pulley
    - spoon
    - comb
    - pencil
    answer: pulley
    difficulty: 1
    hints:
    - A wheel with a rope.
    - Well.
    solution: A pulley helps lift the bucket.
  - prompt: 'Wheels make it easier to:'
    options:
    - move heavy things
    - cut paper
    - write
    - cook rice
    answer: move heavy things
    difficulty: 1
    hints:
    - Carts and cycles.
    - Rolling.
    solution: Wheels help move heavy loads.
  - prompt: 'A see-saw is an example of a:'
    options:
    - lever
    - pulley
    - screw
    - wedge
    answer: lever
    difficulty: 2
    hints:
    - It goes up and down on a middle point.
    - Bottle opener too.
    solution: A see-saw is a lever.
  - prompt: 'A ramp helps:'
    options:
    - push things up to a higher place
    - cut vegetables
    - draw water
    - open jars
    answer: push things up to a higher place
    difficulty: 1
    hints:
    - A slope.
    - Wheelchairs.
    solution: A ramp makes it easier to move things up.
  - prompt: 'A knife cuts because it works like a:'
    options:
    - wedge
    - pulley
    - wheel
    - lever
    answer: wedge
    difficulty: 2
    hints:
    - Thin sharp edge.
    - Axe too.
    solution: A knife's sharp edge is a wedge.
  - prompt: 'Opening a door is an example of a:'
    options:
    - push or pull
    - melting
    - freezing
    - growing
    answer: push or pull
    difficulty: 1
    hints:
    - You move it.
    - Force.
    solution: We push or pull to open doors.
- code: cbse4v.work.energy
  title: What makes things work
  after:
  - cbse4v.work.simple
  notes: |
    Things need energy to work: our muscles (food), electricity (fan, bulb, mixer), fuel (petrol for scooters, LPG for
    cooking), wind (windmill), water (water mill), sunlight (solar lamp). Batteries store electricity for torches and
    remotes. Use electricity safely: never touch switches with wet hands; don't poke into sockets.
  explanations:
    text: Everything that works needs energy. We get energy from food; fans and bulbs use electricity; scooters use petrol; solar lamps use sunlight. Electricity can be dangerous, so use it safely.
    visual: Draw a fan with a wire to a socket, a scooter at a petrol pump and a solar lamp in the sun.
    step_by_step: 'Step 1: Name the thing. Step 2: Ask what makes it work. Step 3: Is it safe to use? How?'
    real_world: Many homes use solar water heaters and solar lamps, which run on sunlight.
  picture:
    kind: flow
    steps:
    - Sunlight
    - Solar panel
    - Stores in battery
    - Lamp glows at night
    alt: 'A solar lamp: sunlight falls on a solar panel, which stores energy in a battery so the lamp glows at night.'
  activity:
    type: sort
    prompt: What gives the energy to make it work?
    bins:
    - Food
    - Electricity
    - Petrol or diesel
    - Sunlight
    items:
    - label: You, running in the playground
      bin: Food
      clue: What did you eat for breakfast?
      why: Food.
    - label: A bullock pulling a cart
      bin: Food
      clue: It eats grass.
      why: Food.
    - label: A ceiling fan
      bin: Electricity
      clue: Plugged into the switchboard.
      why: Electricity.
    - label: A bulb
      bin: Electricity
      clue: Switch it on.
      why: Electricity.
    - label: A scooter
      bin: Petrol or diesel
      clue: Filled at a pump.
      why: Petrol.
    - label: A truck
      bin: Petrol or diesel
      clue: Filled at a pump.
      why: Diesel.
    - label: A solar lamp
      bin: Sunlight
      clue: Charged on the roof by day.
      why: Sunlight.
    - label: A solar cooker
      bin: Sunlight
      clue: Placed in bright sunshine.
      why: Sunlight.
  items:
  - prompt: 'A ceiling fan works on:'
    options:
    - electricity
    - petrol
    - food
    - wind only
    answer: electricity
    difficulty: 1
    hints:
    - Switch.
    - Wires.
    solution: A fan uses electricity.
  - prompt: 'A torch gets electricity from:'
    options:
    - batteries
    - water
    - petrol
    - sand
    answer: batteries
    difficulty: 1
    hints:
    - Cells inside.
    - Replace them.
    solution: Torches use batteries.
  - prompt: Which is unsafe?
    options:
    - touching a switch with wet hands
    - switching off lights when leaving
    - using a solar lamp
    - drying hands before using switches
    answer: touching a switch with wet hands
    difficulty: 1
    hints:
    - Water and electricity are dangerous together.
    - Shock.
    solution: Wet hands can cause electric shock.
    mistakes:
      drying hands before using switches: c4v_reread
  - prompt: 'A solar lamp works using:'
    options:
    - sunlight
    - petrol
    - coal
    - food
    answer: sunlight
    difficulty: 2
    hints:
    - Solar = Sun.
    - Panel.
    solution: Solar lamps use sunlight.
  - prompt: 'Our body gets energy to work and play from:'
    options:
    - food
    - electricity
    - petrol
    - batteries
    answer: food
    difficulty: 1
    hints:
    - Eat to play.
    - Meals.
    solution: Food gives us energy.
  - prompt: 'A windmill uses:'
    options:
    - wind
    - petrol
    - coal
    - sunlight only
    answer: wind
    difficulty: 1
    hints:
    - The name.
    - Moving air.
    solution: Windmills are turned by wind.
