    answer: Kerala
    difficulty: 2
    hints:
    - Coir comes from coconuts.
    - Which state has many coconut trees?
    solution: 'Step 1: Coir comes from coconut husk. Step 2: Kerala has many coconut trees and coir makers.'
    mistakes:
      Ladakh: c4v8_prop
      Rajasthan desert: c4v8_prop
  - prompt: Why are cooking pan handles often made of wood or plastic?
    options:
    - they do not get hot quickly
    - they are shiny
    - they cook food faster
    answer: they do not get hot quickly
    difficulty: 3
    hints:
    - Metal heats up fast.
    - What would happen if you held a hot metal handle?
    solution: 'Step 1: Metal passes heat quickly. Step 2: Wood and plastic stay cool, so we can hold them.'
    mistakes:
      they are shiny: c4v8_prop
      they cook food faster: c4v8_prop
  - prompt: Which material is see-through?
    options:
    - clear glass
    - wood
