# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 8
title: How Things are Made
tips:
  v4_blacksmith: "Metal tools are hammered on an anvil by a smith."
  v4_carpenter_tools: "A carpenter cuts and joins wood. Which tools cut and join?"
  v4_clay: "Diyas are shaped by hand from wet earth and baked."
  v4_coir: "Coir ropes and mats come from the hairy outer cover of a fruit that grows in Kerala."
  v4_kiln: "Soaking would make clay soft again. Pots are hardened by heat."
  v4_loom: "A kiln is an oven for pots. Cloth is woven on a frame with threads."
  v4_paper_raw: "Paper comes from trees, mashed up into a soft paste."
  v4_potter: "A carpenter works with wood. Clay pots are made on a spinning wheel by a ..."
  v4_reuse: "The sari is used again in a new way."
  v4_transparent: "Why can you see outside through a window?"
  v4_waterproof: "A raincoat must stop rain from soaking through."
  v4_wood: "Tables and chairs need a strong material from trees."
  c4v8_prop: 'Think what the object must do: hold water, let light in, be strong, be light, or bend? Which material does that?'
  c4v8_worker: 'Picture the worker''s tools: wheel and kiln, saw and hammer, fire and anvil, loom, or needle?'
  c4v8_reuse: "Ask: is the old thing kept as it is and given a new job, or broken down and made into something new? And which choice harms the Earth?"

concepts:
- code: cbse4v.made.materials
  title: Materials and their uses
  notes: |
    Things are made of materials: wood (furniture), clay (pots, diyas), metal (vessels, tools), glass (windows,
    bottles), plastic (buckets), cloth (clothes), paper (books), bamboo and coir (mats, ropes). Choose materials by
    property: strong, light, waterproof, transparent, can be shaped. Kerala is known for coir from coconut husk.
  explanations:
    text: Everything around us is made from some material. Wood makes furniture, clay makes pots, metal makes vessels, glass makes windows, and coir from coconut husk makes ropes and mats. We pick a material because of what it can do.
    visual: Draw a clay pot, a wooden chair, a steel tumbler, a glass window and a coir mat. Label each material.
    step_by_step: 'Step 1: Name the object. Step 2: Find its material. Step 3: Ask why that material: strong, waterproof, see-through or easy to shape?'
    real_world: Kerala's Alappuzha is famous for coir products made from coconut husk fibre.
  picture:
    kind: compare
    columns:
    - title: Material
      points:
      - clay
      - glass
      - coir
    - title: Made into
      points:
      - pots, diyas
      - windows, bottles
      - ropes, mats
    alt: Clay is made into pots and diyas, glass into windows and bottles, and coir into ropes and mats.
  activity:
    type: sort
    prompt: What is it made of?
    bins:
    - Wood
    - Clay
    - Metal
    - Glass
    - Coir
    items:
    - label: A chair
      bin: Wood
      clue: From a tree.
      why: Wood.
    - label: A door
      bin: Wood
      clue: Cut and joined by a carpenter.
      why: Wood.
    - label: A water pot (matka)
      bin: Clay
      clue: Shaped on a potter's wheel.
      why: Clay.
    - label: A diya
      bin: Clay
      clue: Small, baked earth lamp.
      why: Clay.
    - label: A spoon
      bin: Metal
      clue: Shiny and strong.
      why: Metal.
    - label: A cooking vessel
      bin: Metal
      clue: Goes on the stove.
      why: Metal.
    - label: A window pane
      bin: Glass
      clue: See-through.
      why: Glass.
    - label: A bottle
      bin: Glass
      clue: See-through, breaks if dropped.
      why: Glass.
    - label: A doormat
      bin: Coir
      clue: Made from coconut husk.
      why: Coir.
  lesson:
    - teach: Things are made of materials. Wood makes furniture, clay makes pots and diyas, metal makes vessels and tools, glass makes windows, cloth makes clothes, and paper makes books.
      check:
        prompt: 'A cooking vessel is usually made of:'
        options:
        - metal
        - paper
        - cloth
        answer: metal
        why: Metal is strong and can take heat.
      ways:
      - style: visual
        teach: Common materials and some of the things made from each one.
        picture:
          kind: compare
          columns:
          - title: Material
            points:
            - Wood
            - Clay
            - Metal
            - Glass
            - Cloth
            - Paper
          - title: Made into
            points:
            - Chairs, doors
            - Pots, diyas
            - Vessels, tools
            - Windows, bangles
            - Clothes, bags
            - Books, envelopes
          alt: Wood is made into chairs and doors, clay into pots and diyas, metal into vessels and tools, glass into windows and bangles, cloth into clothes and bags, and paper into books and envelopes.
      - style: step_by_step
        teach: 'Go on a material hunt at home. Step 1: Pick five things in one room. Step 2: For each, ask: what is it made of? Step 3: Write the thing and its material in two columns. Step 4: Circle anything made of more than one material, like a pencil of wood and graphite.'
    - teach: We choose a material for its property. Glass is transparent (we see through it). Plastic is waterproof. Metal is strong. Cotton is soft and lets air through.
      picture:
        kind: compare
        columns:
        - title: Property
          points:
          - see-through
          - waterproof
          - strong
        - title: Material
          points:
          - glass
          - plastic, rubber
          - metal, wood
        - title: Use
          points:
          - window
          - raincoat
          - bridge, table
        alt: Matching material properties to materials and uses.
      check:
        prompt: Why are summer clothes made of cotton?
        options:
        - cotton is soft and lets air through
        - cotton is waterproof
        - cotton is see-through
        answer: cotton is soft and lets air through
        why: Air keeps us cool in summer.
      ways:
      - style: step_by_step
        teach: 'Choose the right material. Step 1: Ask what the thing must do, for example an umbrella must keep rain off. Step 2: Think which property that needs: waterproof. Step 3: Check which material has it: plastic or coated cloth. Step 4: Explain your choice.'
      - style: real_world
        teach: Cooking pots are made of metal because metal lets heat pass through quickly. Their handles are often wood or plastic, so that you can hold them without burning your hand.
    - teach: 'Natural materials come from plants, animals or the earth: wood, cotton, wool, clay, bamboo and coir (from coconut husk, famous in Kerala). Plastic is made in factories.'
      check:
        prompt: 'Wool comes from:'
        options:
        - sheep
        - trees
        - rocks
        answer: sheep
        why: Wool is the hair of sheep.
      ways:
      - style: visual
        teach: Natural materials and where they come from, compared with man-made plastic.
        picture:
          kind: compare
          columns:
          - title: From plants
            points:
            - Wood
            - Cotton
            - Bamboo
            - Coir
          - title: From animals or earth
            points:
            - Wool
            - Clay
          - title: Made in factories
            points:
            - Plastic
          alt: Wood, cotton, bamboo and coir come from plants. Wool comes from animals and clay from the earth. Plastic is made in factories.
      - style: real_world
        teach: In Alappuzha, coconut husks are soaked, beaten into fibres and twisted into coir rope. The rope is woven into doormats that are sold all over the world.
  items:
  - prompt: 'Diyas and matkas are made of:'
    options:
    - clay
    - glass
    - plastic
    - cloth
    answer: clay
