    hints:
    - Kerala.
    - Brown fibres.
    solution: Coir comes from coconut husk.
    mistakes: {"sheep wool": "v4_coir"}
  - prompt: 'Windows are made of glass because glass is:'
    options:
    - "transparent (see-through)"
    - "soft and easy to bend"
    - "heavy, just like stone"
    - "furry and warm to touch"
    answer: transparent (see-through)
    difficulty: 1
    hints:
    - You can see outside.
    - Clear.
    solution: Glass lets light through.
    mistakes: {"soft and easy to bend": "v4_transparent"}
  - prompt: Which material is used for furniture?
    options:
    - wood
    - paper
    - glass only
    - cloth only
    answer: wood
    difficulty: 1
    hints:
    - Carpenter.
    - Strong.
    solution: Furniture is mostly made of wood.
    mistakes: {"paper": "v4_wood"}
  - prompt: Why are raincoats made of plastic material?
    options:
    - it is waterproof
    - it is see-through
    - it is heavy
    - it is breakable
    answer: it is waterproof
