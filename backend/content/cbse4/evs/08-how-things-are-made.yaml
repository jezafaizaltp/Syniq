      metal is soft: c4v8_prop
      metal floats: c4v8_prop
  - prompt: 'Case: A family wants a new shelf for the bathroom, where it will often get splashed with water. Which material would last longest?'
    options:
    - Plastic or steel
    - Paper
    - Plain cardboard
    answer: Plastic or steel
    hints:
    - What happens to paper and cardboard when they get wet?
    - Which materials are waterproof and strong?
    solution: A bathroom shelf gets wet. Plastic is waterproof and steel is strong and does not soak up water, so they last longer than paper or cardboard.
    mistakes:
      Paper: c4v8_prop
      Plain cardboard: c4v8_prop
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are making a small greenhouse box so a plant can get sunlight while staying inside. Which material should the top be made of?'
    options:
    - "Clear glass or clear plastic"
    - "Thick, solid wooden boards"
    - "A sheet of dark metal"
    answer: Clear glass or clear plastic
    hints:
    - The plant needs light to reach it.
    - Which material lets light pass through?
    solution: Clear glass or plastic is transparent, so sunlight can reach the plant while the box stays closed.
    mistakes:
      "Thick, solid wooden boards": c4v8_prop
      "A sheet of dark metal": c4v8_prop
    exam: competency
    difficulty: 2
- code: cbse4v.made.process
  title: Crafts and workers
  after:
  - cbse4v.made.materials
  notes: |
    Many things are made by skilled workers: potter (wheel, kiln), carpenter (saw, hammer), blacksmith (shapes hot metal),
    weaver (loom), tailor (needle, sewing machine). Steps: raw material → shaping → finishing. Reuse and recycle: old
    cloth into bags, paper into new paper.
  explanations:
    text: Skilled workers make many things by hand. A potter shapes clay on a wheel and bakes it. A carpenter cuts and joins wood. A weaver makes cloth on a loom. Old things can be reused or recycled into new ones.
    visual: Draw a potter at the wheel, a weaver at a loom and a tailor at a sewing machine.
    step_by_step: 'Step 1: Start with raw material. Step 2: Shape it. Step 3: Finish it (bake, polish, paint, stitch).'
    real_world: Handloom weavers in Balaramapuram, Kerala weave the famous cream-and-gold kasavu cloth.
  picture:
    kind: flow
    steps:
    - Clay dug from the ground
    - Shaped on the potter's wheel
    - Dried in the sun
    - Baked in a kiln
    alt: 'Making a clay pot: clay is dug, shaped on the potter''s wheel, dried in the sun and baked in a kiln.'
  activity:
    type: order
    prompt: How does a potter make a pot? Put the steps in order.
    steps:
    - Dig up clay
    - Mix the clay with water and knead it
    - Shape it on the spinning wheel
    - Dry the pot in the sun
    - Bake it in a hot kiln
    - Paint it and take it to the market
    reasons:
      Mix the clay with water and knead it: You need clay before you can knead it.
      Shape it on the spinning wheel: Clay must be soft and smooth to shape.
      Dry the pot in the sun: The shape must be made before it dries.
      Bake it in a hot kiln: A wet pot would crack in the kiln, so it dries first.
      Paint it and take it to the market: Painting and selling come once it is hard.
  lesson:
    - teach: Skilled workers make many things. A potter shapes clay on a wheel and bakes it in a kiln. A carpenter cuts wood with a saw and joins it with a hammer and nails.
      check:
        prompt: Where does a potter bake clay pots?
        options:
        - in a kiln
        - in a fridge
        - in a river
        answer: in a kiln
        why: The kiln's heat makes clay hard.
      ways:
      - style: visual
        teach: How a potter turns clay into a finished pot.
        picture:
          kind: flow
          steps:
          - Dig clay and mix it with water
          - Knead it until it is smooth
          - Shape it on the turning wheel
          - Dry it in the shade
          - Bake it hard in a kiln
          alt: A potter digs clay and mixes it with water, kneads it until smooth, shapes it on a turning wheel, dries it in the shade and bakes it hard in a kiln.
      - style: real_world
        teach: Before Diwali, potters' lanes are lined with rows of fresh diyas drying in the sun. Each one is shaped by hand on the wheel in a few seconds.
    - teach: 'Making anything has steps: raw material, then shaping, then finishing. A blacksmith heats metal, hammers it into shape, then sharpens it. A weaver spins thread and weaves it on a loom into cloth.'
      picture:
        kind: flow
        steps:
        - raw material (clay)
        - shape on the wheel
        - dry in the sun
        - bake in the kiln
        - paint and finish
        alt: Steps in making a clay pot.
      check:
        prompt: What comes first when making cloth?
        options:
        - spinning thread
        - stitching a shirt
        - ironing
        answer: spinning thread
        why: Thread must be made before it can be woven.
      ways:
      - style: step_by_step
        teach: 'Spot the three stages in any craft. Step 1: Raw material: what is it made from? Step 2: Shaping: how is it given its form? Step 3: Finishing: how is it made ready to use or sell? Try it for a carpenter''s stool or a weaver''s towel.'
      - style: real_world
        teach: In Kerala, the town of Aranmula is known for metal mirrors made by hand. Craftspeople mix metals, shape the mirror and polish it for days until it shines.
    - teach: 'We can reuse and recycle: an old sari becomes a bag (reuse), old paper is pulped to make new paper (recycle). This saves materials and reduces waste.'
      check:
        prompt: 'Using a glass jar to store pencils is:'
        options:
        - reuse
        - recycling
        - throwing away
        answer: reuse
        why: The jar is used again as it is.
      ways:
      - style: visual
        teach: Reuse and recycle compared, with examples of each.
        picture:
          kind: compare
          columns:
          - title: Reuse
            points:
            - Keep it as it is, give it a new job
            - Old sari into a bag
            - Glass jar for storing spices
          - title: Recycle
            points:
            - Break it down to make something new
            - Old paper into new paper
            - Metal cans melted into new metal
          alt: Reusing means keeping a thing as it is and giving it a new job, like turning an old sari into a bag or using a glass jar for spices. Recycling means breaking it down to make something new, like turning old paper into new paper or melting metal cans.
      - style: real_world
        teach: The scrap dealer who buys old newspapers and bottles from homes sends them to factories. There they are pulped or melted and made into new paper and glass.
  items:
  - prompt: 'A weaver makes cloth on a:'
    options:
    - loom
    - wheel
    - saw
    - kiln
