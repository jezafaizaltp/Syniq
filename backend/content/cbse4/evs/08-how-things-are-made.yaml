# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 8
title: How Things are Made
concepts:
- code: cbse4v.made.materials
  title: Materials and their uses
  notes: |
    Things are made of materials: wood (furniture), clay (pots, diyas), metal (vessels, tools), glass (windows,
    bottles), plastic (buckets), cloth (clothes), paper (books), bamboo and coir (mats, ropes). Choose materials by
    property: strong, light, waterproof, transparent, can be shaped. Kerala is known for coir from coconut husk.
  explanations:
    text: Everything around us is made from some material. Wood makes furniture, clay makes pots, metal makes vessels, glass makes windows, and coir from coconut husk makes ropes and mats. We pick a material because of what it can do.
    visual: Draw a clay pot, a wooden chair, a steel tumbler, a glass window and a coir mat. Label each material.
    step_by_step: 'Step 1: Name the object. Step 2: Find its material. Step 3: Ask why that material: strong, waterproof, see-through or easy to shape?'
    real_world: Kerala's Alappuzha is famous for coir products made from coconut husk fibre.
  picture:
    kind: compare
    columns:
    - title: Material
      points:
      - clay
      - glass
      - coir
    - title: Made into
      points:
      - pots, diyas
      - windows, bottles
      - ropes, mats
    alt: Clay is made into pots and diyas, glass into windows and bottles, and coir into ropes and mats.
  items:
  - prompt: 'Diyas and matkas are made of:'
    options:
    - clay
    - glass
    - plastic
    - cloth
    answer: clay
    difficulty: 1
    hints:
    - Potter.
    - Baked mud.
    solution: They are made of clay.
  - prompt: 'Coir is made from:'
    options:
    - coconut husk
    - cotton
    - sheep wool
    - plastic
    answer: coconut husk
    difficulty: 1
    hints:
    - Kerala.
    - Brown fibres.
    solution: Coir comes from coconut husk.
  - prompt: 'Windows are made of glass because glass is:'
    options:
    - transparent (see-through)
    - soft
    - heavy like stone
    - furry
    answer: transparent (see-through)
    difficulty: 1
    hints:
    - You can see outside.
    - Clear.
    solution: Glass lets light through.
  - prompt: Which material is used for furniture?
    options:
    - wood
    - paper
    - glass only
    - cloth only
    answer: wood
    difficulty: 1
    hints:
    - Carpenter.
    - Strong.
    solution: Furniture is mostly made of wood.
  - prompt: Why are raincoats made of plastic material?
    options:
    - it is waterproof
    - it is see-through
    - it is heavy
    - it is breakable
    answer: it is waterproof
    difficulty: 2
    hints:
    - Rain slides off.
    - Doesn't soak.
    solution: Plastic keeps water out.
  - prompt: Who makes clay pots?
    options:
    - a potter
    - a carpenter
    - a blacksmith
    - a weaver
    answer: a potter
    difficulty: 1
    hints:
    - Potter's wheel.
    - Clay.
    solution: A potter makes clay pots.
- code: cbse4v.made.process
  title: Crafts and workers
  after:
  - cbse4v.made.materials
  notes: |
    Many things are made by skilled workers: potter (wheel, kiln), carpenter (saw, hammer), blacksmith (shapes hot metal),
    weaver (loom), tailor (needle, sewing machine). Steps: raw material → shaping → finishing. Reuse and recycle: old
    cloth into bags, paper into new paper.
  explanations:
    text: Skilled workers make many things by hand. A potter shapes clay on a wheel and bakes it. A carpenter cuts and joins wood. A weaver makes cloth on a loom. Old things can be reused or recycled into new ones.
    visual: Draw a potter at the wheel, a weaver at a loom and a tailor at a sewing machine.
    step_by_step: 'Step 1: Start with raw material. Step 2: Shape it. Step 3: Finish it (bake, polish, paint, stitch).'
    real_world: Handloom weavers in Balaramapuram, Kerala weave the famous cream-and-gold kasavu cloth.
  picture:
    kind: flow
    steps:
    - Clay dug from the ground
    - Shaped on the potter's wheel
    - Dried in the sun
    - Baked in a kiln
    alt: 'Making a clay pot: clay is dug, shaped on the potter''s wheel, dried in the sun and baked in a kiln.'
  items:
  - prompt: 'A weaver makes cloth on a:'
    options:
    - loom
    - wheel
    - saw
    - kiln
    answer: loom
    difficulty: 1
    hints:
    - Threads cross.
    - Weaving machine.
    solution: Weavers use a loom.
  - prompt: Who shapes hot metal into tools?
    options:
    - a blacksmith
    - a potter
    - a weaver
    - a baker
    answer: a blacksmith
    difficulty: 2
    hints:
    - Hammer and fire.
    - Iron.
    solution: A blacksmith shapes hot metal.
  - prompt: 'After shaping, clay pots are made hard by:'
    options:
    - baking in a kiln
    - freezing
    - soaking in water
    - painting only
    answer: baking in a kiln
    difficulty: 2
    hints:
    - A very hot oven.
    - Fire.
    solution: Baking in a kiln hardens pots.
  - prompt: 'A carpenter uses a:'
    options:
    - saw and hammer
    - loom
    - needle only
    - potter's wheel
    answer: saw and hammer
    difficulty: 1
    hints:
    - Wood.
    - Cutting and nailing.
    solution: Carpenters use saws and hammers.
  - prompt: 'Turning an old sari into a bag is an example of:'
    options:
    - reuse
    - wasting
    - burning
    - polluting
    answer: reuse
    difficulty: 1
    hints:
    - Using again.
    - New use.
    solution: That is reusing.
  - prompt: Which is a raw material for paper?
    options:
    - wood pulp
    - glass
    - iron
    - clay
    answer: wood pulp
    difficulty: 2
    hints:
    - From trees.
    - Soft mash.
    solution: Paper is made from wood pulp.
