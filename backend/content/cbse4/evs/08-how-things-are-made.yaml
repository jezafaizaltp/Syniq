      bake in kiln, dig clay, shape the clay: c4v8_worker
      shape the clay, bake in kiln, dig clay: c4v8_worker
  - prompt: Which is a good reuse of an old tyre?
    options:
    - a swing or a plant pot
    - burning it
    - throwing it in a river
    answer: a swing or a plant pot
    difficulty: 1
    hints:
    - Reuse gives an old thing a new job.
