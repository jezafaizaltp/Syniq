      "heating makes the metal look shiny": c4v8_worker
      "heating makes the metal much lighter": c4v8_worker
  - prompt: 'Melting old plastic bottles to make new things is called:'
    options:
    - recycling
    - reusing
    - wasting
    answer: recycling
    difficulty: 2
    hints:
    - The bottles are broken down first.
