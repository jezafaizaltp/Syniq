    hints:
    - Rain slides off.
    - Doesn't soak.
    solution: Plastic keeps water out.
    mistakes: {"it is see-through": "v4_waterproof"}
  - prompt: Who makes clay pots?
    options:
    - a potter
    - a carpenter
    - a blacksmith
    - a weaver
    answer: a potter
    difficulty: 1
    hints:
    - Potter's wheel.
    - Clay.
    solution: A potter makes clay pots.
    mistakes: {"a carpenter": "v4_potter"}
  - prompt: Which material is best for a water bottle that should not break if dropped?
    options:
    - steel
    - glass
    - paper
    answer: steel
    difficulty: 2
    hints:
    - It must hold water.
    - It must not break when dropped.
    solution: 'Step 1: Paper cannot hold water; glass breaks. Step 2: Steel holds water and does not break.'
    mistakes:
      glass: c4v8_prop
      paper: c4v8_prop
  - prompt: Which of these is a natural material?
    options:
    - bamboo
    - plastic
    - nylon
    answer: bamboo
    difficulty: 1
    hints:
    - Natural materials come from nature.
    - Which one grows?
    solution: 'Step 1: Plastic and nylon are made in factories. Step 2: Bamboo grows as a plant.'
    mistakes:
      plastic: c4v8_prop
      nylon: c4v8_prop
  - prompt: 'An umbrella cover must be:'
    options:
    - waterproof
    - transparent
    - heavy
    answer: waterproof
    difficulty: 1
    hints:
    - What does an umbrella keep off?
    - Rain must not soak through.
    solution: 'Step 1: Umbrellas keep rain off. Step 2: So the cover must be waterproof.'
    mistakes:
      transparent: c4v8_prop
      heavy: c4v8_prop
  - prompt: Which material can be shaped easily when wet and becomes hard when baked?
    options:
    - clay
    - glass
    - steel
    answer: clay
    difficulty: 2
    hints:
    - Potters use it.
    - Diyas are made from it.
    solution: 'Step 1: Wet clay is soft. Step 2: Baking makes it hard.'
    mistakes:
      glass: c4v8_prop
      steel: c4v8_prop
  - prompt: 'Coir mats and ropes are a famous product of:'
    options:
    - Kerala
    - Ladakh
