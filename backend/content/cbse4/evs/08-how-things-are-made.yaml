    solution: 'Step 1: Wood and brick block light. Step 2: Clear glass is see-through.'
    mistakes:
      wood: c4v8_prop
      brick: c4v8_prop
  - prompt: 'Paper is mostly made from:'
    options:
    - wood from trees
    - sand
    - metal
    answer: wood from trees
    difficulty: 2
    hints:
    - Saving paper saves something in forests.
    - What grows in forests?
    solution: 'Step 1: Wood is made into pulp. Step 2: The pulp is pressed into paper.'
    mistakes:
      sand: c4v8_prop
      metal: c4v8_prop
  - prompt: Why is a bicycle frame made of metal?
    options:
    - metal is strong
    - metal is soft
    - metal floats
    answer: metal is strong
    difficulty: 1
    hints:
