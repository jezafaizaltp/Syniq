    answer: each piece shows the skill of the worker
    difficulty: 3
    hints:
    - A person makes each one.
    - Can two handmade pots be exactly alike?
    solution: 'Step 1: Each piece is made by hand. Step 2: It shows the worker''s skill and is unique.'
    mistakes:
      "they are made by robots in factories": c4v8_worker
      "every piece is exactly the same as the rest": c4v8_worker
  - prompt: A weaver makes 3 metres of cloth each day. How many metres in 6 days?
    answer: '18'
