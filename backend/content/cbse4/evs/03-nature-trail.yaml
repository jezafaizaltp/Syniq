# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 3
title: Nature Trail
tips:
  v4_climber: "Some plants wind around a stick or wall to go up. What are they called?"
  v4_earthworm: "Earthworms come up after rain from under the ground."
  v4_fish: "Fish breathe with gills and swim with fins."
  v4_footprints: "Animals leave marks in mud with their feet."
  v4_kingfisher: "The bird's name tells you its job: king of catching ..."
  v4_leaf: "Food is made in the green parts using sunlight."
  v4_parrot_beak: "Look at a parrot's beak: hooked and strong, like a tool for cracking hard shells. A fishing bird has a long, pointed beak instead."
  v4_root: "The part under the ground grips the soil."
  v4_shrub: "A shrub is bushy, with many woody stems, and shorter than a tree."
  v4_tree: "Herbs are small and soft. Which plant has a hard, woody trunk and is tall?"
  v4_tree_birds: "Look up in a tree: what do birds build there?"

concepts:
- code: cbse4v.trail.plants
  title: Plants we see on a walk
  notes: |
    On a nature walk we find big trees (banyan, neem, coconut, mango), shrubs (hibiscus, tulsi), herbs and grasses,
    climbers (money plant, pea) and creepers (pumpkin, watermelon). Parts of a plant: root, stem, leaf, flower, fruit,
    seed. Leaves differ in shape, size and edges. Trees give shade, fruit, wood and homes for birds.
  explanations:
    text: 'On a nature walk you can see big trees, smaller bushy shrubs, soft herbs, and climbers that wind around a support. Look closely at leaves: they come in many shapes and sizes.'
    visual: Draw a tall coconut tree, a bushy hibiscus shrub, a small tulsi plant and a money plant climbing a stick.
    step_by_step: 'Step 1: Look at the plant''s height and stem. Step 2: Hard thick trunk = tree; many woody stems = shrub; soft stem = herb; needs support = climber.'
    real_world: Kerala homes often have coconut and mango trees, a hibiscus shrub and a tulsi plant in the yard.
  picture:
    kind: compare
    columns:
    - title: Tree
      points:
      - tall, thick trunk
      - coconut, mango
    - title: Shrub
      points:
      - bushy, woody stems
      - hibiscus, rose
    - title: Climber
      points:
      - needs support
      - money plant, pea
    alt: Trees are tall with thick trunks, like coconut and mango; shrubs are bushy, like hibiscus and rose; climbers need support, like money plant and pea.
  activity:
    type: sort
    prompt: What kind of plant is it?
    bins:
    - Tree
    - Shrub
    - Herb
    - Climber
    items:
    - label: Mango
      bin: Tree
      clue: Tall, with a thick woody trunk.
      why: A tree.
    - label: Neem
      bin: Tree
      clue: Big, strong trunk and lots of shade.
      why: A tree.
    - label: Rose bush
      bin: Shrub
      clue: Woody stems, but not very tall.
      why: A shrub.
    - label: Hibiscus
      bin: Shrub
      clue: Bushy, about as tall as you.
      why: A shrub.
    - label: Tulsi
      bin: Herb
      clue: Small with a soft green stem.
      why: A herb.
    - label: Coriander
      bin: Herb
      clue: Small and soft.
      why: A herb.
    - label: Money plant
      bin: Climber
      clue: Its weak stem needs support.
      why: A climber.
    - label: Bitter gourd vine
      bin: Climber
      clue: Curls around a fence.
      why: A climber.
  items:
  - prompt: 'A tall plant with a thick, hard trunk is a:'
    options:
    - tree
    - herb
    - creeper
    - grass
    answer: tree
    difficulty: 1
    hints:
    - Coconut, mango.
    - Biggest.
    solution: That is a tree.
    mistakes: {"herb": "v4_tree"}
  - prompt: Which is a shrub?
    options:
    - hibiscus
    - coconut tree
    - grass
    - pumpkin creeper
    answer: hibiscus
    difficulty: 1
    hints:
    - Bushy, medium height.
    - Red flowers.
    solution: Hibiscus is a shrub.
    mistakes: {"coconut tree": "v4_shrub"}
  - prompt: 'A plant that needs support to grow upward is a:'
    options:
    - climber
    - tree
    - shrub
    - cactus
    answer: climber
    difficulty: 1
    hints:
    - Money plant.
    - It climbs.
    solution: Climbers need support.
    mistakes: {"cactus": "v4_climber"}
  - prompt: Which part of a plant holds it in the soil?
    options:
    - root
    - flower
    - leaf
    - fruit
    answer: root
    difficulty: 1
    hints:
    - Underground.
    - Drinks water.
    solution: Roots hold the plant and take in water.
    mistakes: {"leaf": "v4_root"}
  - prompt: Which part of the plant makes food?
    options:
    - leaf
    - root
    - seed
    - flower
    answer: leaf
    difficulty: 2
    hints:
    - Green.
    - Uses sunlight.
    solution: Leaves make food using sunlight.
    mistakes: {"root": "v4_leaf"}
  - prompt: How do trees help birds?
    options:
    - they give homes (nests) and food
    - they scare them away
    - they take their eggs
    - they make them cold
    answer: they give homes (nests) and food
    difficulty: 1
    hints:
    - Nests on branches.
    - Fruits.
    solution: Trees give birds homes and food.
    mistakes: {"they scare them away": "v4_tree_birds"}
- code: cbse4v.trail.animals
  title: Animals and birds on the trail
  after:
  - cbse4v.trail.plants
  notes: |
    Animals live in different places (habitats): birds in trees, fish in water, earthworms in soil, frogs in ponds and on
    land. Look for signs: footprints, feathers, nests, anthills, droppings, sounds. Birds have beaks suited to food:
    parrot (cracking nuts), kingfisher (catching fish), sparrow (seeds). Watch quietly; don't disturb or harm.
  explanations:
    text: 'On a nature walk listen and look carefully: birds call from trees, ants march in lines, butterflies visit flowers. Each animal lives where it finds food and shelter. Be quiet and gentle so you don''t disturb them.'
    visual: Draw a tree with a nest and a parrot, a pond with a kingfisher and a frog, and ants marching to an anthill.
    step_by_step: 'Step 1: Look and listen. Step 2: Note what the animal eats and where it lives. Step 3: Notice its body parts that help it.'
    real_world: Kerala's wetlands are home to kingfishers, herons and many other birds.
  picture:
    kind: flow
    steps:
    - Look and listen quietly
    - 'Spot signs: nests, footprints, feathers'
    - Note what it eats
    - Never disturb or harm
    alt: 'On a nature trail: look and listen quietly, spot signs like nests and footprints, note what animals eat, and never disturb them.'
  activity:
    type: sort
    prompt: Where does it live?
    bins:
    - In trees
    - In water
    - Under the ground
    items:
    - label: Squirrel
      bin: In trees
      clue: It runs up trunks and nests in branches.
      why: In trees.
    - label: Monkey
      bin: In trees
      clue: Swings from branch to branch.
      why: In trees.
    - label: Weaver bird
      bin: In trees
      clue: Hangs its nest from branches.
      why: In trees.
    - label: Fish
      bin: In water
      clue: Breathes with gills.
      why: In water.
    - label: Crab in a pond
      bin: In water
      clue: Its home is wet and muddy.
      why: In water.
    - label: Earthworm
      bin: Under the ground
      clue: Lives in wet soil.
      why: Under the ground.
    - label: Ant
      bin: Under the ground
      clue: Lives in a nest it digs.
      why: Under the ground.
    - label: Rat
      bin: Under the ground
      clue: Digs burrows.
      why: In burrows.
  items:
  - prompt: Where does a fish live?
    options:
    - in water
    - in a tree
    - in a desert
    - under a rock on land
    answer: in water
    difficulty: 1
    hints:
    - It has fins.
    - It swims.
    solution: Fish live in water.
    mistakes: {"in a tree": "v4_fish"}
  - prompt: Which bird catches fish with its sharp, long beak?
    options:
    - kingfisher
    - sparrow
    - parrot
    - hen
    answer: kingfisher
    difficulty: 2
    hints:
    - It dives into water.
    - Bright blue.
    solution: The kingfisher catches fish.
    mistakes: {"sparrow": "v4_kingfisher"}
  - prompt: 'A parrot''s strong curved beak helps it to:'
    options:
    - crack nuts and seeds
    - catch fish
    - dig the soil
    - drink nectar only
    answer: crack nuts and seeds
    difficulty: 2
    hints:
    - Hard food.
    - Hooked beak.
    solution: Its strong beak cracks hard nuts.
    mistakes: {"catch fish": "v4_parrot_beak"}
  - prompt: Which is a sign that an animal has been nearby?
    options:
    - footprints
    - a cloud
    - a stone wall
    - a road sign
    answer: footprints
    difficulty: 1
    hints:
    - Marks in mud.
    - Tracks.
    solution: Footprints show an animal passed by.
    mistakes: {"a road sign": "v4_footprints"}
  - prompt: How should we behave on a nature trail?
    options:
    - walk quietly and not disturb animals
    - shout and throw stones
    - pluck all flowers
    - break nests
    answer: walk quietly and not disturb animals
    difficulty: 1
    hints:
    - Respect nature.
    - Quiet.
    solution: Be quiet and gentle with animals.
    mistakes:
      shout and throw stones: c4v_think
  - prompt: Where does an earthworm live?
    options:
    - in the soil
    - in a nest
    - in the sea
    - on rooftops
    answer: in the soil
    difficulty: 1
    hints:
    - Underground.
    - Wet soil.
    solution: Earthworms live in soil.
    mistakes: {"in a nest": "v4_earthworm"}
