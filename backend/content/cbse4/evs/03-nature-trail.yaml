# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 3
title: Nature Trail
tips:
  v4_climber: "Some plants wind around a stick or wall to go up. What are they called?"
  v4_earthworm: "Earthworms come up after rain from under the ground."
  v4_fish: "Fish breathe with gills and swim with fins."
  v4_footprints: "Animals leave marks in mud with their feet."
  v4_kingfisher: "The bird's name tells you its job: king of catching ..."
  v4_leaf: "Food is made in the green parts using sunlight."
  v4_parrot_beak: "Look at a parrot's beak: hooked and strong, like a tool for cracking hard shells. A fishing bird has a long, pointed beak instead."
  v4_root: "The part under the ground grips the soil."
  v4_shrub: "A shrub is bushy, with many woody stems, and shorter than a tree."
  v4_tree: "Herbs are small and soft. Which plant has a hard, woody trunk and is tall?"
  v4_tree_birds: "Look up in a tree: what do birds build there?"
  c4v3_plant: 'Look at the stem: is it thick and woody, bushy, thin and needing support, or lying on the ground?'
  c4v3_part: "Picture the whole plant from under the soil up to the top. What does each part do, and where is it?"
  c4v3_animal: Think about where the animal finds its food and shelter. Its body suits that place.

concepts:
- code: cbse4v.trail.plants
  title: Plants we see on a walk
  notes: |
    On a nature walk we find big trees (banyan, neem, coconut, mango), shrubs (hibiscus, tulsi), herbs and grasses,
    climbers (money plant, pea) and creepers (pumpkin, watermelon). Parts of a plant: root, stem, leaf, flower, fruit,
    seed. Leaves differ in shape, size and edges. Trees give shade, fruit, wood and homes for birds.
  explanations:
    text: 'On a nature walk you can see big trees, smaller bushy shrubs, soft herbs, and climbers that wind around a support. Look closely at leaves: they come in many shapes and sizes.'
    visual: Draw a tall coconut tree, a bushy hibiscus shrub, a small tulsi plant and a money plant climbing a stick.
    step_by_step: 'Step 1: Look at the plant''s height and stem. Step 2: Hard thick trunk = tree; many woody stems = shrub; soft stem = herb; needs support = climber.'
    real_world: Kerala homes often have coconut and mango trees, a hibiscus shrub and a tulsi plant in the yard.
  picture:
    kind: compare
    columns:
    - title: Tree
      points:
      - tall, thick trunk
      - coconut, mango
    - title: Shrub
      points:
      - bushy, woody stems
      - hibiscus, rose
    - title: Climber
      points:
      - needs support
      - money plant, pea
    alt: Trees are tall with thick trunks, like coconut and mango; shrubs are bushy, like hibiscus and rose; climbers need support, like money plant and pea.
  activity:
    type: sort
    prompt: What kind of plant is it?
    bins:
    - Tree
    - Shrub
    - Herb
    - Climber
    items:
    - label: Mango
      bin: Tree
      clue: Tall, with a thick woody trunk.
      why: A tree.
    - label: Neem
      bin: Tree
      clue: Big, strong trunk and lots of shade.
      why: A tree.
    - label: Rose bush
      bin: Shrub
      clue: Woody stems, but not very tall.
      why: A shrub.
    - label: Hibiscus
      bin: Shrub
      clue: Bushy, about as tall as you.
      why: A shrub.
    - label: Tulsi
      bin: Herb
      clue: Small with a soft green stem.
      why: A herb.
    - label: Coriander
      bin: Herb
      clue: Small and soft.
      why: A herb.
    - label: Money plant
      bin: Climber
      clue: Its weak stem needs support.
      why: A climber.
    - label: Bitter gourd vine
      bin: Climber
      clue: Curls around a fence.
      why: A climber.
  lesson:
    - teach: On a nature walk we see many kinds of plants. Trees are tall with a thick, hard trunk (neem, mango). Shrubs are bushy with many woody stems (hibiscus, tulsi). Herbs are small with soft stems (mint, coriander).
      check:
        prompt: 'Mint, with a small soft green stem, is a:'
        options:
        - herb
        - tree
        - shrub
        answer: herb
        why: Herbs are small plants with soft stems.
      ways:
      - style: visual
        teach: Trees, shrubs and herbs compared by their size and stems.
        picture:
          kind: compare
          columns:
          - title: Tree
            points:
            - Tall
            - One thick, hard trunk
            - Neem, mango
          - title: Shrub
            points:
            - Bushy, medium height
            - Many woody stems
            - Hibiscus, tulsi
          - title: Herb
            points:
            - Small
            - Soft, green stem
            - Mint, coriander
          alt: A tree is tall with one thick, hard trunk, like neem and mango. A shrub is bushy with many woody stems, like hibiscus and tulsi. A herb is small with a soft, green stem, like mint and coriander.
      - style: step_by_step
        teach: 'Sort a plant on a walk. Step 1: Look at its height: taller than a grown-up, or shorter? Step 2: Look at the stem: one thick trunk or many stems? Step 3: Gently press the stem: hard and woody, or soft and green? Step 4: Decide: tree, shrub or herb.'
    - teach: Some plants have weak stems. Climbers hold on to a support to grow up (money plant, pea). Creepers spread along the ground (pumpkin, watermelon).
      picture:
        kind: compare
        columns:
        - title: Strong stem
          points:
          - 'tree: thick trunk'
          - 'shrub: bushy, woody'
        - title: Soft stem
          points:
          - 'herb: small'
        - title: Weak stem
          points:
          - 'climber: goes up a support'
          - 'creeper: spreads on the ground'
        alt: 'Plants grouped by their stems: trees, shrubs, herbs, climbers and creepers.'
      check:
        prompt: 'A pumpkin plant spreads on the ground. It is a:'
        options:
        - creeper
        - climber
        - tree
        answer: creeper
        why: Its weak stem lies along the ground.
      ways:
      - style: step_by_step
        teach: 'Spot a climber or creeper. Step 1: Look at the stem: is it thin and weak? Step 2: Does it wrap round a stick, wall or fence? It is a climber. Step 3: Does it lie and spread on the ground? It is a creeper. Step 4: Note an example of each.'
      - style: real_world
        teach: Bitter gourd and bottle gourd vines are often grown on a frame of sticks called a pandal. Lifting the vine off the ground keeps the gourds clean and stops them rotting on wet soil.
    - teach: 'Every plant has parts: root (holds it in the soil and takes in water), stem (holds it up and carries water), leaves (make food with sunlight), flowers, fruits and seeds (make new plants).'
      check:
        prompt: Which part carries water from the roots to the leaves?
        options:
        - stem
        - flower
        - seed
        answer: stem
        why: The stem is like a pipe between roots and leaves.
      ways:
      - style: visual
        teach: The parts of a plant and the job of each part.
        picture:
          kind: compare
          columns:
          - title: Part
            points:
            - Root
            - Stem
            - Leaf
            - Flower, fruit and seed
          - title: Job
            points:
            - Holds the plant, takes in water
            - Holds it up, carries water
            - Makes food using sunlight
            - Make new plants
          alt: The root holds the plant in the soil and takes in water. The stem holds it up and carries water. The leaf makes food using sunlight. Flowers, fruits and seeds make new plants.
      - style: real_world
        teach: Put a white flower stem in water coloured with a few drops of ink. After a day, the petals show streaks of colour, because the stem has carried the water all the way up.
  items:
  - prompt: 'A tall plant with a thick, hard trunk is a:'
    options:
    - tree
    - herb
    - creeper
    - grass
    answer: tree
    difficulty: 1
    hints:
    - Coconut, mango.
    - Biggest.
    solution: That is a tree.
    mistakes: {"herb": "v4_tree"}
  - prompt: Which is a shrub?
    options:
    - hibiscus
    - coconut tree
    - grass
    - pumpkin creeper
    answer: hibiscus
    difficulty: 1
    hints:
    - Bushy, medium height.
    - Red flowers.
    solution: Hibiscus is a shrub.
    mistakes: {"coconut tree": "v4_shrub"}
  - prompt: 'A plant that needs support to grow upward is a:'
    options:
    - climber
    - tree
    - shrub
    - cactus
    answer: climber
    difficulty: 1
    hints:
    - Money plant.
    - It climbs.
    solution: Climbers need support.
    mistakes: {"cactus": "v4_climber"}
  - prompt: Which part of a plant holds it in the soil?
    options:
    - root
    - flower
    - leaf
    - fruit
    answer: root
    difficulty: 1
    hints:
    - Underground.
    - Drinks water.
    solution: Roots hold the plant and take in water.
    mistakes: {"leaf": "v4_root"}
  - prompt: Which part of the plant makes food?
    options:
    - leaf
    - root
    - seed
    - flower
    answer: leaf
    difficulty: 2
    hints:
    - Green.
    - Uses sunlight.
    solution: Leaves make food using sunlight.
    mistakes: {"root": "v4_leaf"}
  - prompt: How do trees help birds?
    options:
    - they give homes (nests) and food
    - they scare them away
    - they take their eggs
    - they make them cold
    answer: they give homes (nests) and food
    difficulty: 1
    hints:
    - Nests on branches.
    - Fruits.
    solution: Trees give birds homes and food.
    mistakes: {"they scare them away": "v4_tree_birds"}
  - prompt: Which is a tree?
    options:
    - banyan
    - tulsi
    - grass
    answer: banyan
    difficulty: 1
    hints:
    - Trees have a thick, hard trunk.
    - Which one grows very big with hanging roots?
    solution: 'Step 1: Tulsi is a shrub; grass is a herb. Step 2: The banyan is a big tree.'
    mistakes:
      tulsi: c4v3_plant
      grass: c4v3_plant
  - prompt: Which plant is a climber?
    options:
    - money plant
    - neem
    - watermelon
    answer: money plant
    difficulty: 2
    hints:
    - Climbers go upward using support.
    - Which one is often seen growing up a stick or wall?
    solution: 'Step 1: Neem is a tree; watermelon spreads on the ground. Step 2: The money plant climbs a support.'
    mistakes:
      neem: c4v3_plant
      watermelon: c4v3_plant
  - prompt: Which part of a plant grows into a new plant?
    options:
    - seed
    - leaf vein
    - bark
    answer: seed
    difficulty: 1
    hints:
    - Farmers sow these.
    - They are found inside fruits.
    solution: 'Step 1: Seeds are sown in soil. Step 2: Each seed can grow into a new plant.'
    mistakes:
      leaf vein: c4v3_part
      bark: c4v3_part
  - prompt: 'Leaves on a walk can be different in:'
    options:
    - shape, size and edges
    - only colour
    - nothing at all
    answer: shape, size and edges
    difficulty: 1
    hints:
    - Compare a banana leaf and a tulsi leaf.
    - Look at their edges too.
    solution: 'Step 1: Banana leaves are huge; tulsi leaves are small with toothed edges. Step 2: Leaves differ in shape, size and edges.'
    mistakes:
      only colour: c4v3_part
      nothing at all: c4v3_part
  - prompt: Why do people rest under trees on a hot day?
    options:
    - trees give shade
    - trees make noise
    - trees are warm
    answer: trees give shade
    difficulty: 1
    hints:
    - What do leaves block?
    - 'Where is it cooler: in the sun or under a tree?'
    solution: 'Step 1: Leaves block the sunlight. Step 2: So trees give cool shade.'
    mistakes:
      trees make noise: c4v3_part
      trees are warm: c4v3_part
  - prompt: Why do climbers need support?
    options:
    - their stems are too weak to stand up
    - they are too heavy
    - they have no leaves
    answer: their stems are too weak to stand up
    difficulty: 2
    hints:
    - Compare a climber's stem to a tree trunk.
    - Can it hold itself upright?
    solution: 'Step 1: Climbers have thin, weak stems. Step 2: They hold on to something to grow up.'
    mistakes:
      they are too heavy: c4v3_plant
      they have no leaves: c4v3_plant
  - prompt: 'How many of these are trees: mango, neem, hibiscus, coconut, mint?'
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Hibiscus is a shrub; mint is a herb.
    - Count the rest.
    solution: 'Step 1: Mango, neem and coconut are trees. Step 2: That is 3.'
    mistakes:
      '4': c4v3_plant
      '5': c4v3_plant
      '2': c4v3_plant
  - prompt: Which part of a plant do we eat when we eat a carrot?
    options:
    - root
    - stem
    - leaf
    answer: root
    difficulty: 2
    hints:
    - Carrots grow under the soil.
    - Which part of a plant is under the soil?
    solution: 'Step 1: Carrots grow underground. Step 2: The carrot is the root.'
    mistakes:
      stem: c4v3_part
      leaf: c4v3_part
  - prompt: On a nature walk, what is the best way to study a flower?
    options:
    - look closely and draw it, without plucking
    - pluck all the flowers
    - step on it
    answer: look closely and draw it, without plucking
    difficulty: 2
    hints:
    - Plants are living things.
    - How can others enjoy it too?
    solution: 'Step 1: Plucking harms the plant. Step 2: Looking and drawing lets everyone enjoy it.'
    mistakes:
      pluck all the flowers: c4v3_part
      step on it: c4v3_part
  - prompt: 'Case: On a school walk, children find a plant with a thin stem wrapped tightly around a fence. Its stem is too weak to stand on its own. What kind of plant is it?'
    options:
    - A climber
    - A tree
    - A shrub
    answer: A climber
    hints:
    - Can the stem stand up by itself?
    - What do we call a plant that holds on to a support to grow up?
    solution: A plant with a weak stem that holds on to a support to grow upward is a climber.
    mistakes:
      A tree: c4v3_plant
      A shrub: c4v3_plant
    exam: case
    difficulty: 2
  - prompt: 'Situation: The potted plant in your classroom has dry soil, and its leaves are drooping. Which part of the plant takes in the water you will give it?'
    options:
    - The roots
    - The flowers
    - The leaves
    answer: The roots
    hints:
    - Which part of the plant is in the soil?
    - Which part takes in water from the soil?
    solution: The roots take in water from the soil, and the stem carries it up to the leaves.
    mistakes:
      The flowers: c4v3_part
      The leaves: c4v3_part
    exam: competency
    difficulty: 2
- code: cbse4v.trail.animals
  title: Animals and birds on the trail
  after:
  - cbse4v.trail.plants
  notes: |
    Animals live in different places (habitats): birds in trees, fish in water, earthworms in soil, frogs in ponds and on
    land. Look for signs: footprints, feathers, nests, anthills, droppings, sounds. Birds have beaks suited to food:
    parrot (cracking nuts), kingfisher (catching fish), sparrow (seeds). Watch quietly; don't disturb or harm.
  explanations:
    text: 'On a nature walk listen and look carefully: birds call from trees, ants march in lines, butterflies visit flowers. Each animal lives where it finds food and shelter. Be quiet and gentle so you don''t disturb them.'
    visual: Draw a tree with a nest and a parrot, a pond with a kingfisher and a frog, and ants marching to an anthill.
    step_by_step: 'Step 1: Look and listen. Step 2: Note what the animal eats and where it lives. Step 3: Notice its body parts that help it.'
    real_world: Kerala's wetlands are home to kingfishers, herons and many other birds.
  picture:
    kind: flow
    steps:
    - Look and listen quietly
    - 'Spot signs: nests, footprints, feathers'
    - Note what it eats
    - Never disturb or harm
    alt: 'On a nature trail: look and listen quietly, spot signs like nests and footprints, note what animals eat, and never disturb them.'
  activity:
    type: sort
    prompt: Where does it live?
    bins:
    - In trees
    - In water
    - Under the ground
    items:
    - label: Squirrel
      bin: In trees
      clue: It runs up trunks and nests in branches.
      why: In trees.
    - label: Monkey
      bin: In trees
      clue: Swings from branch to branch.
      why: In trees.
    - label: Weaver bird
      bin: In trees
      clue: Hangs its nest from branches.
      why: In trees.
    - label: Fish
      bin: In water
      clue: Breathes with gills.
      why: In water.
    - label: Crab in a pond
      bin: In water
      clue: Its home is wet and muddy.
      why: In water.
    - label: Earthworm
      bin: Under the ground
      clue: Lives in wet soil.
      why: Under the ground.
    - label: Ant
      bin: Under the ground
      clue: Lives in a nest it digs.
      why: Under the ground.
    - label: Rat
      bin: Under the ground
      clue: Digs burrows.
      why: In burrows.
  lesson:
    - teach: Animals live in places that suit them, called habitats. Birds live in trees, fish in water, earthworms in soil, frogs in and near ponds.
      check:
        prompt: Where does a frog live?
        options:
        - in water and on land near ponds
        - only in trees
        - only in deserts
        answer: in water and on land near ponds
        why: Frogs live both in water and on land.
      ways:
      - style: visual
        teach: Some animals and the habitats where they live.
        picture:
          kind: compare
          columns:
          - title: Animal
            points:
            - Crow
            - Fish
            - Earthworm
            - Frog
          - title: Habitat
            points:
            - Trees
            - Water
            - Soil
            - In and near ponds
          alt: A crow lives in trees, a fish in water, an earthworm in soil and a frog in and near ponds.
      - style: real_world
        teach: After the first monsoon rain, earthworms often come up onto wet paths and frogs start croaking from puddles. Their habitats come alive when the soil and ponds get water.
    - teach: Birds have beaks suited to their food. A parrot's strong curved beak cracks nuts. A kingfisher's long sharp beak catches fish. A sparrow's short beak picks seeds.
      picture:
        kind: compare
        columns:
        - title: Parrot
          points:
          - strong curved beak
          - cracks nuts and seeds
        - title: Kingfisher
          points:
          - long sharp beak
          - catches fish
        - title: Sparrow
          points:
          - short cone beak
          - picks grains
        alt: Three birds with beaks matched to their food.
      check:
        prompt: 'A woodpecker has a strong, pointed beak. It is good for:'
        options:
        - drilling holes in tree bark
        - cracking coconuts
        - sipping nectar
        answer: drilling holes in tree bark
        why: It pecks into bark to find insects.
      ways:
      - style: visual
        teach: Bird beaks and the kind of food that each one suits.
        picture:
          kind: compare
          columns:
          - title: Beak
            points:
            - Strong and curved
            - Long and sharp
            - Short and small
          - title: Suits
            points:
            - Cracking nuts
            - Catching fish
            - Picking up seeds
          alt: A strong, curved beak suits cracking nuts. A long, sharp beak suits catching fish. A short, small beak suits picking up seeds.
      - style: step_by_step
        teach: 'Guess a bird''s food from its beak. Step 1: Look at a bird picture closely. Step 2: Is the beak curved, long and sharp, thin, or short? Step 3: Think of what that shape is good at: cracking, catching, sipping or picking. Step 4: Guess the food and check in a book.'
    - teach: 'Animals leave signs: footprints, feathers, nests, anthills, sounds. On a trail, watch quietly from a distance; never disturb nests or harm animals.'
      check:
        prompt: You see a bird's nest with eggs. What should you do?
        options:
        - look from a distance and leave it
        - take the eggs home
        - shake the branch
        answer: look from a distance and leave it
        why: Disturbing nests can make birds leave their eggs.
      ways:
      - style: step_by_step
        teach: 'Be a nature detective. Step 1: Walk slowly and quietly along the trail. Step 2: Look down for footprints and anthills. Step 3: Look up for nests and feathers. Step 4: Listen for calls. Note each sign in a notebook without touching nests.'
      - style: visual
        teach: Signs that animals leave behind, and what each sign tells us.
        picture:
          kind: compare
          columns:
          - title: Sign
            points:
            - Footprints in mud
            - A feather
            - A nest
            - An anthill
          - title: Tells us
            points:
            - An animal walked here
            - A bird was nearby
            - A bird lives or lays eggs here
            - Ants live inside
          alt: Footprints in mud tell us an animal walked there. A feather tells us a bird was nearby. A nest tells us a bird lives or lays eggs there. An anthill tells us ants live inside.
  items:
  - prompt: Where does a fish live?
    options:
    - in water
    - in a tree
    - in a desert
    - under a rock on land
    answer: in water
    difficulty: 1
    hints:
    - It has fins.
    - It swims.
    solution: Fish live in water.
    mistakes: {"in a tree": "v4_fish"}
  - prompt: Which bird catches fish with its sharp, long beak?
    options:
    - kingfisher
    - sparrow
    - parrot
    - hen
    answer: kingfisher
    difficulty: 2
    hints:
    - It dives into water.
    - Bright blue.
    solution: The kingfisher catches fish.
    mistakes: {"sparrow": "v4_kingfisher"}
  - prompt: 'A parrot''s strong curved beak helps it to:'
    options:
    - crack nuts and seeds
    - catch fish
    - dig the soil
    - drink nectar only
    answer: crack nuts and seeds
    difficulty: 2
    hints:
    - Hard food.
    - Hooked beak.
    solution: Its strong beak cracks hard nuts.
    mistakes: {"catch fish": "v4_parrot_beak"}
  - prompt: Which is a sign that an animal has been nearby?
    options:
    - footprints
    - a cloud
    - a stone wall
    - a road sign
    answer: footprints
    difficulty: 1
    hints:
    - Marks in mud.
    - Tracks.
    solution: Footprints show an animal passed by.
    mistakes: {"a road sign": "v4_footprints"}
  - prompt: How should we behave on a nature trail?
    options:
    - walk quietly and not disturb animals
    - shout and throw stones
    - pluck all flowers
    - break nests
    answer: walk quietly and not disturb animals
    difficulty: 1
    hints:
    - Respect nature.
    - Quiet.
    solution: Be quiet and gentle with animals.
    mistakes:
      shout and throw stones: c4v_think
  - prompt: Where does an earthworm live?
    options:
    - in the soil
    - in a nest
    - in the sea
    - on rooftops
    answer: in the soil
    difficulty: 1
    hints:
    - Underground.
    - Wet soil.
    solution: Earthworms live in soil.
    mistakes: {"in a nest": "v4_earthworm"}
  - prompt: Which is the home of a bee?
    options:
    - hive
    - nest of sticks
    - burrow
    answer: hive
    difficulty: 1
    hints:
    - Bees make honey there.
    - It is made of wax cells.
    solution: 'Step 1: Bees build wax cells for honey. Step 2: Their home is a hive.'
    mistakes:
      nest of sticks: c4v3_animal
      burrow: c4v3_animal
  - prompt: Which animal lives in a burrow under the ground?
    options:
    - rabbit
    - parrot
    - fish
    answer: rabbit
    difficulty: 1
    hints:
    - A burrow is a hole dug in the ground.
    - Which animal digs with its paws?
    solution: 'Step 1: Parrots live in trees; fish in water. Step 2: Rabbits dig burrows.'
    mistakes:
      parrot: c4v3_animal
      fish: c4v3_animal
  - prompt: Why does a fish have fins?
    options:
    - to swim in water
    - to fly
    - to dig soil
    answer: to swim in water
    difficulty: 1
    hints:
    - Where does a fish live?
    - How does it move there?
    solution: 'Step 1: Fish live in water. Step 2: Fins help them swim.'
    mistakes:
      to fly: c4v3_animal
      to dig soil: c4v3_animal
  - prompt: You find a feather on the ground. Which animal was most likely nearby?
    options:
    - a bird
    - a cat
    - a snake
    answer: a bird
    difficulty: 1
    hints:
    - Which animals have feathers?
    - Cats have fur; snakes have scales.
    solution: 'Step 1: Only birds have feathers. Step 2: A bird was nearby.'
    mistakes:
      a cat: c4v3_animal
      a snake: c4v3_animal
  - prompt: How do earthworms help plants?
    options:
    - they loosen the soil so air and water reach roots
    - they eat all the leaves
    - they make the soil hard
    answer: they loosen the soil so air and water reach roots
    difficulty: 2
    hints:
