# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 2
title: Exploring Our Neighbourhood
concepts:
- code: cbse4v.neigh.places
  title: Places around us
  notes: |
    A neighbourhood has homes and shared places: school, park, market, post office, hospital or health centre, bank,
    police station, bus stop, place of worship, library. Each has a purpose. Knowing them helps in daily life and
    emergencies.
  explanations:
    text: 'Your neighbourhood is the area around your home. It has many useful places: a market to buy things, a post office to send letters, a health centre when you are ill, a park to play and a bus stop to travel.'
    visual: 'Draw a simple map of your street: your house, a shop, a school, a park and a bus stop.'
    step_by_step: 'Step 1: Name a place. Step 2: What do people do there? Step 3: How far is it from your home?'
    real_world: Many Kerala villages have a ration shop, a primary health centre, a school and a temple, church or mosque close by.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Post office
      - Health centre
      - Bank
    - title: We go there to
      points:
      - send letters, parcels
      - see a doctor
      - keep and take out money
    alt: We go to the post office to send letters, the health centre to see a doctor, and the bank to keep money.
  items:
  - prompt: Where do we go to send a letter?
    options:
    - post office
    - bank
    - park
    - bus stop
    answer: post office
    difficulty: 1
    hints:
    - Stamps.
    - Postman.
    solution: Letters are posted at the post office.
  - prompt: Where do we go when we are ill?
    options:
    - health centre or hospital
    - market
    - library
    - playground
    answer: health centre or hospital
    difficulty: 1
    hints:
    - Doctor.
    - Medicine.
    solution: We see a doctor at a health centre or hospital.
  - prompt: Where can we borrow books?
    options:
    - library
    - bank
    - petrol pump
    - bus stop
    answer: library
    difficulty: 1
    hints:
    - Shelves of books.
    - Return them later.
    solution: A library lends books.
  - prompt: Where do people keep their money safely?
    options:
    - bank
    - park
    - pond
    - playground
    answer: bank
    difficulty: 1
    hints:
    - Savings.
    - Passbook.
    solution: Money is kept in a bank.
  - prompt: 'A place where children play together is a:'
    options:
    - park
    - police station
    - post office
    - bank
    answer: park
    difficulty: 1
    hints:
    - Swings and slides.
    - Open space.
    solution: Children play in a park.
  - prompt: Why is it useful to know the places in your neighbourhood?
    options:
    - to get help quickly when needed
    - to get lost
    - to stay at home always
    - it is not useful
    answer: to get help quickly when needed
    difficulty: 2
    hints:
    - Emergencies.
    - Daily needs.
    solution: Knowing places helps in daily life and emergencies.
    mistakes:
      it is not useful: c4v_think
- code: cbse4v.neigh.map
  title: Simple maps and directions
  after:
  - cbse4v.neigh.places
  notes: |
    A map is a drawing of a place seen from above. It uses symbols (a cross for a hospital, a tree for a park) and a key
    to explain them. Directions: North, South, East, West; left and right. Landmarks (a big tree, a temple) help give
    directions.
  explanations:
    text: A map shows a place from above, like a bird sees it. Symbols stand for real places, and the key tells you what each symbol means. Landmarks like a big tree help you give directions.
    visual: 'Draw a map with a key: a small house symbol for homes, a cross for the hospital, a tree for the park.'
    step_by_step: 'Step 1: Find where you are. Step 2: Find where you want to go. Step 3: Use landmarks and left/right to plan the route.'
    real_world: 'Auto drivers often ask for a landmark: ''near the big temple'' or ''opposite the school''.'
  picture:
    kind: flow
    steps:
    - Start at home
    - Walk to the big banyan tree
    - Turn left
    - School is on the right
    alt: 'Directions using landmarks: start at home, walk to the big banyan tree, turn left, and the school is on the right.'
  items:
  - prompt: 'A map shows a place as seen from:'
    options:
    - above
    - below
    - inside
    - the side
    answer: above
    difficulty: 1
    hints:
    - Like a bird.
    - Top view.
    solution: Maps show places from above.
  - prompt: What tells you what the symbols on a map mean?
    options:
    - the key
    - the title only
    - the colour of the paper
    - the border
    answer: the key
    difficulty: 1
    hints:
    - Also called a legend.
    - Explains symbols.
    solution: The key explains the symbols.
  - prompt: 'A landmark is:'
    options:
    - an easy-to-see place that helps with directions
    - a kind of food
    - a small insect
    - a type of bus ticket
    answer: an easy-to-see place that helps with directions
    difficulty: 2
    hints:
    - A big tree or temple.
    - Easy to notice.
    solution: Landmarks help us find our way.
  - prompt: 'On most maps North is at the:'
    options:
    - top
    - bottom
    - left
    - right
    answer: top
    difficulty: 1
    hints:
    - Up.
    - Compass N.
    solution: North is usually at the top.
  - prompt: Which is the best landmark?
    options:
    - a big temple at the corner
    - a parked bicycle
    - a small stone
    - a passing cloud
    answer: a big temple at the corner
    difficulty: 2
    hints:
    - It must stay in one place.
    - And be easy to see.
    solution: A big temple stays put and is easy to see.
  - prompt: 'The Sun rises in the:'
    options:
    - East
    - West
    - North
    - South
    answer: East
    difficulty: 1
    hints:
    - Morning.
    - Opposite of sunset.
    solution: The Sun rises in the East.
