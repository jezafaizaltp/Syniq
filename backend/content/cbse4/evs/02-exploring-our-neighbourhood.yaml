# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 2
title: Exploring Our Neighbourhood
tips:
  v4_bank: "Money is kept safe in a place with a locker and a passbook."
  v4_good_landmark: "A landmark must be big and stay in the same place. Which choice does not move?"
  v4_hospital: "Doctors and nurses work in one of these places."
  v4_key: "A small box on the map explains each symbol, like a key opens a lock."
  v4_landmark: "When you give directions, you say 'turn left at the big ...'. That place is a landmark."
  v4_library: "Books are lent and returned in this place."
  v4_map_above: "A map is like the view a bird has while flying."
  v4_park: "Children play on swings and slides in an open green place."
  v4_post: "Letters get stamps and go into a red box."
  c4v2_place: Think about what you would carry or need there. Which place in the neighbourhood is built for that?
  c4v2_map: Imagine a bird looking straight down. Then check the key to read each symbol.
  c4v2_dir: "Stand facing the sunrise, which is East. Work out the other three directions from there."

concepts:
- code: cbse4v.neigh.places
  title: Places around us
  notes: |
    A neighbourhood has homes and shared places: school, park, market, post office, hospital or health centre, bank,
    police station, bus stop, place of worship, library. Each has a purpose. Knowing them helps in daily life and
    emergencies.
  explanations:
    text: 'Your neighbourhood is the area around your home. It has many useful places: a market to buy things, a post office to send letters, a health centre when you are ill, a park to play and a bus stop to travel.'
    visual: 'Draw a simple map of your street: your house, a shop, a school, a park and a bus stop.'
    step_by_step: 'Step 1: Name a place. Step 2: What do people do there? Step 3: How far is it from your home?'
    real_world: Many Kerala villages have a ration shop, a primary health centre, a school and a temple, church or mosque close by.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Post office
      - Health centre
      - Bank
    - title: We go there to
      points:
      - send letters, parcels
      - see a doctor
      - keep and take out money
    alt: We go to the post office to send letters, the health centre to see a doctor, and the bank to keep money.
  activity:
    type: sort
    prompt: Where would you go?
    bins:
    - Market
    - Post office
    - Health centre
    - Police station
    - Bank
    items:
    - label: To buy vegetables
      bin: Market
      clue: Shops and stalls.
      why: The market.
    - label: To buy new chappals
      bin: Market
      clue: Many shops in one place.
      why: The market.
    - label: To send a letter
      bin: Post office
      clue: Stamps and letters.
      why: The post office.
    - label: To post a parcel to a cousin
      bin: Post office
      clue: It travels far.
      why: The post office.
    - label: To get a vaccine
      bin: Health centre
      clue: Nurses and doctors.
      why: The health centre.
    - label: When you have a fever
      bin: Health centre
      clue: Someone checks you.
      why: The health centre.
    - label: To report a lost bag
      bin: Police station
      clue: They help keep us safe.
      why: The police station.
    - label: To save money safely
      bin: Bank
      clue: Keeps money for you.
      why: The bank.
  lesson:
    - teach: 'A neighbourhood is the area around our home. It has homes and shared places: school, park, market, post office, health centre, bank, police station, bus stop and library.'
      check:
        prompt: Where do we buy vegetables?
        options:
        - market
        - library
        - bank
        answer: market
        why: Shops and stalls sell vegetables in the market.
      ways:
      - style: visual
        teach: Homes and shared places that make up a neighbourhood.
        picture:
          kind: compare
          columns:
          - title: Homes
            points:
            - Houses
            - Flats
          - title: Shared places
            points:
            - School
            - Park
            - Market
            - Health centre
            - Bus stop
            - Library
          alt: A neighbourhood has homes, such as houses and flats, and shared places such as a school, park, market, health centre, bus stop and library.
      - style: step_by_step
        teach: 'Make a neighbourhood list. Step 1: Walk with a grown-up from your home to school. Step 2: Write down every shared place you pass. Step 3: Next to each place, write what it is used for. Step 4: Circle the ones your family uses most.'
    - teach: Each shared place has a purpose. A hospital for when we are ill, a bank to keep money safe, a library to borrow books, a police station for safety.
      picture:
        kind: compare
        columns:
        - title: Need
          points:
          - feeling ill
          - keep money safe
          - borrow a book
        - title: Place
          points:
          - health centre
          - bank
          - library
        alt: Matching needs to neighbourhood places.
      check:
        prompt: You lost your way and feel unsafe. Which place can help?
        options:
        - police station
        - park
        - cinema
        answer: police station
        why: The police help keep people safe.
      ways:
      - style: step_by_step
        teach: 'Match a need to a place. Step 1: Think of the need, such as ''I want to read a new storybook''. Step 2: Ask: which place is built for that? Step 3: A library lends books. Step 4: Try it with other needs: posting a letter, catching a bus, buying vegetables.'
      - style: real_world
        teach: In many villages, a weekly market comes on a fixed day. On that day, farmers, potters and cloth sellers set up stalls in an open ground, and the whole neighbourhood comes to shop.
    - teach: 'Knowing your neighbourhood helps in daily life and in emergencies: you know where to go and how to get there quickly. Shared places belong to everyone, so we keep them clean.'
      check:
        prompt: Why should we keep a park clean?
        options:
        - it is shared by everyone
        - nobody uses it
        - it belongs to one person
        answer: it is shared by everyone
        why: Public places are for all of us.
      ways:
      - style: visual
        teach: Why knowing your neighbourhood helps, and how we care for shared places.
        picture:
          kind: compare
          columns:
          - title: Knowing it helps you
            points:
            - Find help quickly in an emergency
            - Run errands without getting lost
            - Tell visitors the way
          - title: Caring for it means
            points:
            - Using dustbins
            - Not breaking park benches
            - Keeping noise low
          alt: Knowing your neighbourhood helps you find help quickly in an emergency, run errands without getting lost and tell visitors the way. Caring for it means using dustbins, not breaking park benches and keeping noise low.
      - style: real_world
        teach: Some resident groups clean their park together on Sunday mornings. Families pick up litter, sweep paths and plant flowers, and the park stays pleasant for everyone.
  items:
  - prompt: Where do we go to send a letter?
    options:
    - post office
    - bank
    - park
    - bus stop
    answer: post office
    difficulty: 1
    hints:
    - Stamps.
    - Postman.
    solution: Letters are posted at the post office.
    mistakes: {"bank": "v4_post"}
  - prompt: Where do we go when we are ill?
    options:
    - "health centre or hospital"
    - "the vegetable market"
    - "the public library"
    - "the playground"
    answer: health centre or hospital
    difficulty: 1
    hints:
    - Doctor.
    - Medicine.
    solution: We see a doctor at a health centre or hospital.
    mistakes: {"the vegetable market": "v4_hospital"}
  - prompt: Where can we borrow books?
    options:
    - library
    - bank
    - petrol pump
    - bus stop
    answer: library
    difficulty: 1
    hints:
    - Shelves of books.
    - Return them later.
    solution: A library lends books.
    mistakes: {"bank": "v4_library"}
  - prompt: Where do people keep their money safely?
    options:
    - bank
    - park
    - pond
    - playground
    answer: bank
    difficulty: 1
    hints:
    - Savings.
    - Passbook.
    solution: Money is kept in a bank.
    mistakes: {"park": "v4_bank"}
  - prompt: 'A place where children play together is a:'
    options:
    - park
    - police station
    - post office
    - bank
    answer: park
    difficulty: 1
    hints:
    - Swings and slides.
    - Open space.
    solution: Children play in a park.
    mistakes: {"police station": "v4_park"}
  - prompt: Why is it useful to know the places in your neighbourhood?
    options:
    - "to get help quickly when needed"
    - "so that we can get lost easily"
    - "so we can stay at home always"
    - "it is not useful in any way"
    answer: to get help quickly when needed
    difficulty: 2
    hints:
    - Emergencies.
    - Daily needs.
    solution: Knowing places helps in daily life and emergencies.
    mistakes:
      "it is not useful in any way": c4v_think
  - prompt: Where do people wait for a bus?
    options:
    - bus stop
    - post office
    - bank
    answer: bus stop
    difficulty: 1
    hints:
    - Buses stop at fixed places.
    - The name gives it away when you think of the bus.
    solution: 'Step 1: Buses pick people up at fixed places. Step 2: That is the bus stop.'
    mistakes:
      post office: c4v2_place
      bank: c4v2_place
  - prompt: Where would you go to buy stamps?
    options:
    - post office
    - police station
    - park
    answer: post office
    difficulty: 1
    hints:
    - Stamps go on letters.
    - Where are letters sent from?
    solution: 'Step 1: Stamps are used on letters. Step 2: The post office sells them.'
    mistakes:
      police station: c4v2_place
      park: c4v2_place
  - prompt: A child gets a small cut while playing. Where can the child get it cleaned and bandaged?
    options:
    - health centre
    - library
    - market
    answer: health centre
    difficulty: 1
    hints:
    - A cut needs medical care.
    - Where do nurses work?
    solution: 'Step 1: Cuts need cleaning and a bandage. Step 2: The health centre does this.'
    mistakes:
      library: c4v2_place
      market: c4v2_place
  - prompt: Where do people go to pray?
    options:
    - place of worship
    - bank
    - bus stop
    answer: place of worship
    difficulty: 1
    hints:
    - Temples, mosques, churches and gurdwaras.
    - What do we call all of them together?
    solution: 'Step 1: Temples, mosques, churches and gurdwaras are for prayer. Step 2: They are places of worship.'
    mistakes:
      bank: c4v2_place
      bus stop: c4v2_place
  - prompt: Which place is used by everyone in the neighbourhood?
    options:
    - the park
    - your bedroom
    - a neighbour's kitchen
    answer: the park
    difficulty: 2
    hints:
    - Shared places are open to all.
    - Which one is not inside someone's home?
    solution: 'Step 1: A bedroom and kitchen are private. Step 2: The park is shared by all.'
    mistakes:
      your bedroom: c4v2_place
      a neighbour's kitchen: c4v2_place
  - prompt: A family wants to save money safely and earn a little extra. Where should they keep it?
    options:
    - bank
    - under the mattress
    - in a school bag
    answer: bank
    difficulty: 2
    hints:
    - Money at home can be lost or stolen.
    - Which place also adds a little interest?
    solution: 'Step 1: Home is not safe for lots of money. Step 2: A bank keeps it safe and adds interest.'
    mistakes:
      under the mattress: c4v2_place
      in a school bag: c4v2_place
  - prompt: There is a fire in a shop. Who should be called?
    options:
    - "fire station (firefighters)"
    - "the library (librarian)"
    - "the post office (postman)"
    answer: fire station (firefighters)
    difficulty: 1
    hints:
    - Who puts out fires?
    - They come in a red truck.
    solution: 'Step 1: Fires need trained help. Step 2: Call the fire station; 112 also works.'
    mistakes:
      "the library (librarian)": c4v2_place
      "the post office (postman)": c4v2_place
  - prompt: Why is a school called a shared place?
    options:
    - "many children from the area learn there together"
    - "only one family uses it and nobody else goes"
    - "it is a shop where people buy and sell things"
    answer: many children from the area learn there together
    difficulty: 2
    hints:
    - Who comes to school?
    - Do they come from one home or many?
    solution: 'Step 1: Children from many homes come. Step 2: So the school is shared.'
    mistakes:
      "only one family uses it and nobody else goes": c4v2_place
      "it is a shop where people buy and sell things": c4v2_place
  - prompt: 'Ravi lists the places in the neighbourhood: school, park, market, bank and post office. How many places is that?'
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count each place once.
    - Use your fingers.
    solution: 'Step 1: school, park, market, bank, post office. Step 2: 5 places.'
    mistakes:
      '4': c4v2_place
      '6': c4v2_place
  - prompt: 'Case: Meena''s grandfather gets a sudden fever late in the evening. The family has just moved to a new area. Which place should they find first?'
    options:
    - "The nearest health centre or hospital"
    - "The library at the end of the road"
    - "The post office near the market"
    answer: The nearest health centre or hospital
    hints:
    - What does the grandfather need?
    - Which shared place is for people who are ill?
    solution: A health centre or hospital treats people who are ill. Knowing where it is helps in emergencies.
    mistakes:
      "The library at the end of the road": c4v2_place
      "The post office near the market": c4v2_place
    exam: case
    difficulty: 2
  - prompt: 'Situation: After a picnic in the neighbourhood park, your group has empty packets and bottles. What should you do?'
    options:
    - "Put them in the dustbin or take them home"
    - "Leave them under a bench in the park"
    - "Hide them behind a big tree nearby"
    answer: Put them in the dustbin or take them home
    hints:
    - Who uses the park?
    - How do we care for a shared place?
    solution: A park belongs to everyone. Putting waste in the dustbin keeps it clean for all.
    mistakes:
      "Leave them under a bench in the park": c4v2_place
      "Hide them behind a big tree nearby": c4v2_place
    exam: competency
    difficulty: 2
- code: cbse4v.neigh.map
  title: Simple maps and directions
  after:
  - cbse4v.neigh.places
  notes: |
    A map is a drawing of a place seen from above. It uses symbols (a cross for a hospital, a tree for a park) and a key
    to explain them. Directions: North, South, East, West; left and right. Landmarks (a big tree, a temple) help give
    directions.
  explanations:
    text: A map shows a place from above, like a bird sees it. Symbols stand for real places, and the key tells you what each symbol means. Landmarks like a big tree help you give directions.
    visual: 'Draw a map with a key: a small house symbol for homes, a cross for the hospital, a tree for the park.'
    step_by_step: 'Step 1: Find where you are. Step 2: Find where you want to go. Step 3: Use landmarks and left/right to plan the route.'
    real_world: 'Auto drivers often ask for a landmark: ''near the big temple'' or ''opposite the school''.'
  picture:
    kind: flow
    steps:
    - Start at home
    - Walk to the big banyan tree
    - Turn left
    - School is on the right
    alt: 'Directions using landmarks: start at home, walk to the big banyan tree, turn left, and the school is on the right.'
  activity:
    type: sort
    prompt: Which direction is it? North is at the top of the map.
    bins:
    - North
    - South
    - East
    - West
    items:
    - label: The top edge of the map
      bin: North
      clue: Maps put this at the top.
      why: North.
    - label: The way the Pole Star shows at night
      bin: North
      clue: A star travellers used.
      why: North.
    - label: The bottom edge of the map
      bin: South
      clue: Opposite the top.
      why: South.
    - label: Behind you when you face the Pole Star
      bin: South
      clue: Turn right round.
      why: South.
    - label: Where the morning Sun comes up
      bin: East
      clue: Sunrise.
      why: East.
    - label: The right-hand side of the map
      bin: East
      clue: With the top pointing up.
      why: East.
    - label: Where the Sun goes down in the evening
      bin: West
      clue: Sunset.
      why: West.
    - label: The left-hand side of the map
      bin: West
      clue: With the top pointing up.
      why: West.
  lesson:
    - teach: 'A map is a drawing of a place as seen from above. It is smaller than the real place, so it uses symbols: a cross for a hospital, a tree for a park.'
      check:
        prompt: 'On a map, a small tree drawing most likely shows:'
        options:
        - a park
        - a bank
        - a road
        answer: a park
        why: Tree symbols mark green places.
      ways:
      - style: visual
        teach: Some map symbols and what each one means in the key.
        picture:
          kind: compare
          columns:
          - title: Symbol
            points:
            - Cross
            - Tree
            - Blue wavy lines
            - Small square
          - title: Means
            points:
            - Hospital
            - Park
            - River or pond
            - House
          alt: On a map key, a cross means a hospital, a tree means a park, blue wavy lines mean a river or pond and a small square means a house.
      - style: step_by_step
        teach: 'Draw a map of your classroom. Step 1: Imagine you are a bird on the ceiling looking down. Step 2: Draw the walls as a big rectangle. Step 3: Use small squares for desks and a long rectangle for the board. Step 4: Make a key to show what each symbol means.'
    - teach: 'The key (legend) tells what each symbol means. Directions help us find our way: North is usually at the top of a map. The Sun rises in the East and sets in the West.'
      picture:
        kind: compare
        columns:
        - title: Top of map
          points:
          - North
        - title: Right side
          points:
          - East
          - sunrise side
        - title: Left side
          points:
          - West
          - sunset side
        alt: On a map, North is up, East is right and West is left; South is at the bottom.
      check:
        prompt: On a map with North at the top, which way is the right side?
        options:
        - East
        - West
        - South
        answer: East
        why: 'Going clockwise from North: East is on the right.'
      ways:
      - style: step_by_step
        teach: 'Find directions using the evening Sun. Step 1: In the evening, stand facing where the Sun sets: that is West. Step 2: Behind you is East. Step 3: Your right hand points North. Step 4: Your left hand points South.'
      - style: real_world
        teach: Many old houses in India were built facing East so the morning Sun lights up the front door. People still use the Sun to know directions when there is no phone or compass.
    - teach: A landmark is an easy-to-see place that helps give directions, like a big temple, a water tank or a tall tree. 'Turn left at the blue water tank' is easy to follow.
      check:
        prompt: Which is the best landmark to give directions?
        options:
        - a tall clock tower
        - a small stone
        - a parked car
        answer: a tall clock tower
        why: It is big, easy to see and does not move.
      ways:
      - style: visual
        teach: Directions with a landmark compared with directions without one.
        picture:
          kind: compare
          columns:
          - title: Easy to follow
            points:
            - Turn left at the blue water tank
            - Stop at the house opposite the big temple
          - title: Hard to follow
            points:
            - Turn left somewhere
            - Stop at the house near some trees
          alt: Directions like 'turn left at the blue water tank' or 'stop at the house opposite the big temple' are easy to follow. 'Turn left somewhere' or 'the house near some trees' are hard to follow.
      - style: real_world
        teach: 'Auto drivers often ask for a landmark instead of an address: ''near the bus depot'' or ''behind the big mosque''. A clear landmark gets you there quickly.'
  items:
  - prompt: 'A map shows a place as seen from:'
    options:
    - above
    - below
    - inside
    - the side
    answer: above
    difficulty: 1
    hints:
    - Like a bird.
    - Top view.
    solution: Maps show places from above.
    mistakes: {"the side": "v4_map_above"}
  - prompt: What tells you what the symbols on a map mean?
    options:
    - the key
    - the title only
    - the colour of the paper
    - the border
    answer: the key
    difficulty: 1
    hints:
    - Also called a legend.
    - Explains symbols.
    solution: The key explains the symbols.
    mistakes: {"the title only": "v4_key"}
  - prompt: 'A landmark is:'
    options:
    - "an easy-to-see place that helps with directions"
    - "a kind of food that is made at festival time"
    - "a small insect that lives under the ground"
    - "a type of ticket you buy for the bus"
    answer: an easy-to-see place that helps with directions
    difficulty: 2
    hints:
    - A big tree or temple.
    - Easy to notice.
    solution: Landmarks help us find our way.
    mistakes: {"a kind of food that is made at festival time": "v4_landmark"}
  - prompt: 'On most maps North is at the:'
    options:
    - top
    - bottom
    - left
    - right
    answer: top
    difficulty: 1
    hints:
    - Up.
    - Compass N.
    solution: North is usually at the top.
    mistakes: {"bottom": "m5_north_top"}
  - prompt: Which is the best landmark?
    options:
    - "a big temple at the corner"
    - "a bicycle parked for a while"
    - "a small stone by the road"
    - "a cloud passing in the sky"
    answer: a big temple at the corner
    difficulty: 2
    hints:
    - It must stay in one place.
    - And be easy to see.
    solution: A big temple stays put and is easy to see.
    mistakes: {"a bicycle parked for a while": "v4_good_landmark"}
  - prompt: 'The Sun rises in the:'
    options:
    - East
    - West
    - North
    - South
    answer: East
    difficulty: 1
    hints:
    - Morning.
    - Opposite of sunset.
    solution: The Sun rises in the East.
    mistakes: {"West": "m5_sunrise"}
  - prompt: If North is at the top of a map, what is at the bottom?
    options:
    - South
    - East
    - West
    answer: South
    difficulty: 1
    hints:
    - North and its opposite.
    - Top and bottom are opposite.
    solution: 'Step 1: North''s opposite is South. Step 2: So South is at the bottom.'
    mistakes:
      East: c4v2_dir
      West: c4v2_dir
  - prompt: 'The Sun sets in the:'
    options:
    - West
    - East
    - North
    answer: West
    difficulty: 1
    hints:
    - It rises in the East.
    - It sets on the opposite side.
    solution: 'Step 1: Sunrise = East. Step 2: Sunset is the opposite: West.'
    mistakes:
      East: c4v2_dir
      North: c4v2_dir
  - prompt: Why are maps smaller than the real place?
    options:
    - so they can fit on paper
    - because places shrink
    - to hide places
    answer: so they can fit on paper
    difficulty: 1
    hints:
    - A town is very big.
    - Could you draw it real size?
    solution: 'Step 1: Real places are huge. Step 2: Maps draw them small to fit on paper.'
    mistakes:
      because places shrink: c4v2_map
      to hide places: c4v2_map
  - prompt: On a map's key, a red cross stands for a hospital. What does a red cross on the map show?
    options:
    - where a hospital is
    - a danger zone
    - a crossing road
    answer: where a hospital is
    difficulty: 1
    hints:
    - Read the key.
    - What does the key say the cross means?
    solution: 'Step 1: The key links symbols to places. Step 2: The red cross shows a hospital.'
    mistakes:
      a danger zone: c4v2_map
      a crossing road: c4v2_map
  - prompt: You face the rising Sun. Which direction is behind you?
    options:
    - West
    - East
    - North
    answer: West
    difficulty: 2
    hints:
    - The Sun rises in the East.
    - Behind you is the opposite direction.
    solution: 'Step 1: You face East. Step 2: Behind you is West.'
    mistakes:
      East: c4v2_dir
      North: c4v2_dir
  - prompt: You face the rising Sun. Which direction is on your left?
    options:
    - North
    - South
    - West
    answer: North
    difficulty: 3
    hints:
    - You are facing East.
    - 'Picture a map: what is to the left of East?'
    solution: 'Step 1: You face East. Step 2: On a map, turning left from East points North.'
    mistakes:
      South: c4v2_dir
      West: c4v2_dir
  - prompt: Which direction tells you how to reach a friend's house most clearly?
    options:
    - "Walk past the big banyan tree and take the first right"
    - "Go somewhere over there, a little bit that way"
    - "It is near some houses, you will find it easily"
    answer: Walk past the big banyan tree and take the first right
    difficulty: 2
    hints:
    - Good directions use landmarks.
    - Which one names a place you can easily see?
    solution: 'Step 1: Vague words do not help. Step 2: A landmark plus a turn is clear.'
    mistakes:
      "Go somewhere over there, a little bit that way": c4v2_map
      "It is near some houses, you will find it easily": c4v2_map
  - prompt: 'A map shows the school north of the park. Going from the park to the school, you walk:'
    options:
    - north
    - south
    - east
    answer: north
    difficulty: 2
