# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 5
title: Food for Health
tips:
  v4_flies: "Flies sit on rubbish before they sit on food. What do they carry?"
  v4_millets: "Ragi and jowar are small round grains, like rice and wheat but tougher."
  v4_wash_veg: "Vegetables come from soil and many hands. What could be on them?"
  c4v5_group: 'Ask what the food does for the body: gives energy to run and play, builds the body, or keeps illness away?'
  c4v5_safe: 'Think about where germs come from: dirty hands, flies, dust, unwashed vegetables, unclean water.'
  c4v5_waste: Think what happens to food you leave on the plate, and who could have eaten it.

concepts:
- code: cbse4v.food.groups
  title: Eating a balanced diet
  notes: |
    Different foods help us in different ways: energy (rice, wheat, ragi, potatoes), growth (dal, milk, eggs, fish),
    protection (fruits, vegetables). A balanced diet has all of these and water. Millets like ragi and jowar are healthy
    grains. Eat fresh, home-cooked food; limit junk food and sugary drinks.
  explanations:
    text: 'Some foods give energy, some help us grow, and some protect us from illness. A balanced plate has a bit of each: rice or roti, dal or egg, and vegetables or fruit, with clean water.'
    visual: 'Draw a plate: half vegetables and fruit, a quarter rice or ragi, a quarter dal or egg, with a glass of water.'
    step_by_step: 'Step 1: Look at your meal. Step 2: Find an energy food, a growth food and a protective food. Step 3: Add what is missing.'
    real_world: Kerala meals with rice, sambar, thoran (vegetables) and curd are balanced.
  picture:
    kind: compare
    columns:
    - title: Energy
      points:
      - rice
      - ragi
      - wheat
    - title: Growth
      points:
      - dal
      - milk
      - egg
    - title: Protection
      points:
      - fruits
      - vegetables
    alt: Energy foods are rice, ragi and wheat; growth foods are dal, milk and egg; protective foods are fruits and vegetables.
  activity:
    type: sort
    prompt: What job does each food do?
    bins:
    - Gives energy
    - Helps us grow
    - Keeps us healthy
    items:
    - label: Poha
      bin: Gives energy
      clue: Made from rice.
      why: Energy food.
    - label: Idli
      bin: Gives energy
      clue: Rice and dal batter, mostly rice.
      why: Energy food.
    - label: Jaggery
      bin: Gives energy
      clue: Sweet.
      why: Energy food.
    - label: Fish
      bin: Helps us grow
      clue: Builds strong muscles.
      why: Body-building food.
    - label: Chana
      bin: Helps us grow
      clue: A pulse full of protein.
      why: Body-building food.
    - label: Curd
      bin: Helps us grow
      clue: Made from milk.
      why: Body-building food.
    - label: Guava
      bin: Keeps us healthy
      clue: Fruit with vitamin C.
      why: Protective food.
    - label: Tomato
      bin: Keeps us healthy
      clue: A vegetable.
      why: Protective food.
    - label: Papaya
      bin: Keeps us healthy
      clue: Fruit.
      why: Protective food.
  lesson:
    - teach: Different foods help our body in different ways. Energy foods (rice, wheat, ragi, potatoes) give us power to work and play. Body-building foods (dal, milk, eggs, fish) help us grow.
      check:
        prompt: Which food helps us grow strong muscles?
        options:
        - eggs
        - sugar
        - chips
        answer: eggs
        why: Eggs are a body-building food.
    - teach: Protective foods (fruits and vegetables) keep us from falling ill. A balanced diet has all three kinds, plus enough water.
      picture:
        kind: compare
        columns:
        - title: Energy
          points:
          - rice, wheat
          - ragi, potato
        - title: Body-building
          points:
          - dal, milk
          - eggs, fish
        - title: Protective
          points:
          - fruits
          - green vegetables
        alt: Three food groups with examples.
      check:
        prompt: 'A plate of rice, dal and spinach is balanced because it has:'
        options:
        - all three kinds of food
        - only energy food
        - only sweets
        answer: all three kinds of food
        why: Rice for energy, dal for growth, spinach for protection.
    - teach: Millets like ragi, jowar and bajra are healthy grains grown in India. Junk food has too much oil, salt or sugar, so we eat it only sometimes. Fresh, home-cooked food is best.
      check:
        prompt: Which is a millet?
        options:
        - bajra
        - chocolate
        - cola
        answer: bajra
        why: Bajra is a millet grain.
  items:
  - prompt: Which food gives us energy?
    options:
    - rice
    - salt
    - water only
    - pepper
    answer: rice
    difficulty: 1
    hints:
    - A grain.
    - Fills us up.
    solution: Rice gives energy.
    mistakes: {"salt": "v5_energy_food"}
  - prompt: Which food helps us grow?
    options:
    - dal
    - sugar
    - chips
    - cola
    answer: dal
    difficulty: 1
    hints:
    - Pulses.
    - Protein.
    solution: Dal helps us grow.
    mistakes: {"sugar": "v5_body_building"}
  - prompt: 'Fruits and vegetables:'
    options:
    - protect us from illness
    - only give fat
    - are harmful
    - should never be eaten
    answer: protect us from illness
    difficulty: 1
    hints:
    - Vitamins.
    - Protective.
    solution: They are protective foods.
    mistakes: {"only give fat": "v5_protective"}
  - prompt: 'Ragi and jowar are:'
    options:
    - millets (healthy grains)
    - vegetables
    - sweets
    - drinks
    answer: millets (healthy grains)
    difficulty: 2
    hints:
    - Small grains.
    - Ragi dosa.
    solution: Ragi and jowar are millets.
    mistakes: {"vegetables": "v4_millets"}
  - prompt: Which is the healthiest snack?
    options:
    - a banana
    - a packet of chips
    - a cola
    - a chocolate bar
    answer: a banana
    difficulty: 1
    hints:
    - Fresh fruit.
    - No packet.
    solution: A banana is fresh and healthy.
    mistakes:
      a packet of chips: c4v_think
  - prompt: Why is too much junk food bad?
    options:
    - it has too much oil, salt or sugar
    - it has too many vitamins
    - it makes us strong
    - it is too healthy
    answer: it has too much oil, salt or sugar
    difficulty: 2
    hints:
    - Fried and sugary.
    - Little goodness.
    solution: Junk food has lots of oil, salt or sugar.
    mistakes: {"it makes us strong": "v5_junk"}
  - prompt: Which food mainly protects us from illness?
    options:
    - orange
    - white bread
    - butter
    answer: orange
    difficulty: 1
    hints:
    - Protective foods are fruits and vegetables.
    - Which one is a fruit?
    solution: 'Step 1: Fruits and vegetables protect us. Step 2: An orange is a fruit.'
    mistakes:
      white bread: c4v5_group
      butter: c4v5_group
  - prompt: Which plate is a balanced meal?
    options:
    - roti, dal, salad and curd
    - only chips and a cold drink
    - only rice
    answer: roti, dal, salad and curd
    difficulty: 2
    hints:
    - A balanced meal has energy, body-building and protective foods.
    - Which plate has all three?
    solution: 'Step 1: Roti = energy, dal and curd = growth, salad = protection. Step 2: It is balanced.'
    mistakes:
      only chips and a cold drink: c4v5_group
      only rice: c4v5_group
  - prompt: Why do we need to drink enough water every day?
    options:
    - our body uses and loses water all the time
    - water gives us muscles
    - water is only for washing
    answer: our body uses and loses water all the time
    difficulty: 2
    hints:
    - We sweat and go to the toilet.
    - What must we do to replace that water?
    solution: 'Step 1: The body loses water through sweat and urine. Step 2: We drink water to replace it.'
    mistakes:
      water gives us muscles: c4v5_group
      water is only for washing: c4v5_group
  - prompt: Which drink is healthiest after playing?
    options:
    - water or fresh lime juice
    - a sugary cold drink
    - strong tea
    answer: water or fresh lime juice
    difficulty: 1
    hints:
    - Sugary drinks have too much sugar.
    - Which choice refills water without lots of sugar?
    solution: 'Step 1: Sugary drinks are not healthy. Step 2: Water or fresh lime juice is best.'
    mistakes:
      a sugary cold drink: c4v5_group
      strong tea: c4v5_group
  - prompt: 'Dal, rajma and chana are mainly:'
    options:
    - body-building foods
    - protective foods only
    - junk food
    answer: body-building foods
    difficulty: 2
    hints:
    - These are pulses.
    - What do pulses do for our growing body?
    solution: 'Step 1: Pulses are rich in protein. Step 2: They are body-building foods.'
    mistakes:
      protective foods only: c4v5_group
      junk food: c4v5_group
  - prompt: A child eats only biscuits and chips for many days. What may happen?
    options:
    - feel weak and fall ill more easily
    - grow very strong
    - never feel hungry again
    answer: feel weak and fall ill more easily
    difficulty: 2
    hints:
    - Biscuits and chips miss many food groups.
    - Without protective and body-building foods, what goes wrong?
    solution: 'Step 1: The body misses what it needs. Step 2: The child may feel weak and fall ill.'
    mistakes:
      grow very strong: c4v5_group
      never feel hungry again: c4v5_group
  - prompt: Why are millets called healthy grains?
    options:
    - they have lots of fibre and minerals
    - they are full of sugar
    - they are fried
    answer: they have lots of fibre and minerals
    difficulty: 3
    hints:
    - Ragi is rich in calcium.
    - What makes a grain good for the body?
    solution: 'Step 1: Millets have fibre, iron and calcium. Step 2: So they are healthy grains.'
    mistakes:
      they are full of sugar: c4v5_group
      they are fried: c4v5_group
  - prompt: Which food comes from an animal?
    options:
    - milk
    - spinach
    - rice
    answer: milk
    difficulty: 1
    hints:
    - Two of these grow in fields.
    - Which one do we get from cows?
    solution: 'Step 1: Spinach and rice are plants. Step 2: Milk comes from cows and buffaloes.'
    mistakes:
      spinach: c4v5_group
      rice: c4v5_group
  - prompt: 'A packet of chips has a lot of:'
    options:
    - oil and salt
    - vitamins and fibre
    - clean water
    answer: oil and salt
    difficulty: 1
    hints:
    - Chips are fried.
    - How do they taste?
    solution: 'Step 1: Chips are fried in oil. Step 2: They are salty, so they have lots of oil and salt.'
    mistakes:
      vitamins and fibre: c4v5_group
      clean water: c4v5_group
- code: cbse4v.food.safe
  title: Clean and safe food
  after:
  - cbse4v.food.groups
  notes: |
    Wash hands before eating and cooking. Wash fruits and vegetables. Cover food to keep flies away. Eat freshly cooked
    food. Drink clean (boiled or filtered) water. Don't waste food: take only what you need, share extra.
  explanations:
    text: Clean food keeps us healthy. Wash your hands with soap before eating, wash fruits and vegetables, keep food covered, and drink clean water. Take only as much food as you can eat.
    visual: Draw a covered dish, a child washing hands with soap and a glass of boiled water.
    step_by_step: 'Step 1: Wash hands. Step 2: Wash raw fruits and vegetables. Step 3: Keep food covered. Step 4: Take only what you can finish.'
    real_world: 'Midday meals in schools follow hygiene rules: covered food, clean plates and handwashing.'
  picture:
    kind: flow
    steps:
    - Wash hands with soap
    - Wash fruits and vegetables
    - Cover the food
    - Eat fresh, waste nothing
    alt: 'Safe eating: wash hands with soap, wash fruits and vegetables, keep food covered, eat fresh food and waste nothing.'
  activity:
    type: sort
    prompt: Is the food safe to eat?
    bins:
    - Safe and clean
    - Not safe
    items:
    - label: Food eaten after washing hands with soap
      bin: Safe and clean
      clue: Germs washed away.
      why: Safe.
    - label: Fruit washed in clean water
      bin: Safe and clean
      clue: Dirt rinsed off.
      why: Safe.
    - label: Food kept covered
      bin: Safe and clean
      clue: Flies can't reach it.
      why: Safe.
    - label: Boiled drinking water
      bin: Safe and clean
      clue: Boiling kills germs.
      why: Safe.
    - label: Food with flies sitting on it
      bin: Not safe
      clue: Flies carry germs.
      why: Not safe.
    - label: Eating with dirty hands after play
      bin: Not safe
      clue: What's on your hands?
      why: Not safe.
    - label: Food that smells bad
      bin: Not safe
      clue: Has it gone off?
      why: Not safe.
    - label: Fruit picked off the ground, unwashed
      bin: Not safe
      clue: Dirt and germs.
      why: Wash it first.
  lesson:
    - teach: Germs are tiny living things we cannot see, and some make us ill. Wash hands with soap before eating or cooking and after using the toilet.
      check:
        prompt: When must we wash our hands with soap?
        options:
        - after using the toilet
        - only on Sundays
        - never
        answer: after using the toilet
        why: Hands pick up germs there.
    - teach: 'Keep food safe: wash fruits and vegetables, cover food so flies and dust stay away, eat freshly cooked food, and drink boiled or filtered water.'
      picture:
        kind: flow
        steps:
        - wash hands
        - wash vegetables
        - cook fresh
        - cover the food
        - eat with clean hands
        alt: Steps for clean and safe food from washing hands to eating.
      check:
        prompt: Why is food covered in the kitchen?
        options:
        - to keep flies and dust away
        - to make it cold
        - to hide it
        answer: to keep flies and dust away
        why: Flies carry germs.
    - teach: Don't waste food. Take only what you can eat, and share extra food before it spoils. Many people do not get enough to eat.
      check:
        prompt: 'At a party, the best way to avoid wasting food is to:'
        options:
        - take a little and go back for more if hungry
        - fill the plate and throw the rest
        - take food you do not like
        answer: take a little and go back for more if hungry
        why: Nothing is left over to throw away.
  items:
  - prompt: Why should food be covered?
    options:
    - to keep flies and dust away
    - to make it cold
    - to make it heavy
    - to change its taste
    answer: to keep flies and dust away
    difficulty: 1
    hints:
    - Flies carry germs.
    - Dust.
    solution: Covering keeps flies and dust off food.
    mistakes: {"to make it cold": "v5_cover"}
  - prompt: When should we wash our hands?
    options:
    - before eating
    - only once a month
    - never
    - only after sleeping
    answer: before eating
    difficulty: 1
    hints:
    - Germs on hands.
    - Before food.
    solution: Wash hands before eating.
    mistakes: {"only once a month": "v5_handwash"}
  - prompt: Which water is safe to drink?
    options:
    - boiled or filtered water
    - pond water
    - puddle water
    - drain water
    answer: boiled or filtered water
    difficulty: 1
    hints:
    - Germ-free.
    - Clean.
    solution: Boiled or filtered water is safe.
    mistakes: {"pond water": "v5_boil"}
  - prompt: How can we avoid wasting food?
    options:
    - take only as much as we can eat
    - throw away leftovers
    - cook too much every day
    - leave food on the plate
    answer: take only as much as we can eat
    difficulty: 1
    hints:
    - Small helpings.
    - Ask for more.
    solution: Taking only what you need avoids waste.
    mistakes: {"throw away leftovers": "v5_waste"}
  - prompt: Why should we wash vegetables before cooking?
    options:
    - to remove dirt and germs
    - to make them grow
    - to change their colour
    - to make them heavier
    answer: to remove dirt and germs
    difficulty: 1
    hints:
    - From the farm and market.
    - Clean.
    solution: Washing removes dirt and germs.
    mistakes: {"to make them grow": "v4_wash_veg"}
  - prompt: 'Flies sitting on food can:'
    options:
    - spread germs and illness
    - make food tastier
    - clean the food
    - keep food fresh
    answer: spread germs and illness
    difficulty: 2
    hints:
    - They sit on waste too.
    - Germs.
    solution: Flies carry germs from waste to food.
    mistakes: {"make food tastier": "v4_flies"}
  - prompt: Water from a pond looks clear. Is it safe to drink straight away?
    options:
    - no, boil or filter it first
    - yes, clear water is always safe
    - yes, if it is cold
    answer: no, boil or filter it first
    difficulty: 2
    hints:
    - Germs are too small to see.
    - What kills or removes germs from water?
    solution: 'Step 1: Clear water can still have germs. Step 2: Boil or filter it first.'
    mistakes:
      yes, clear water is always safe: c4v5_safe
      yes, if it is cold: c4v5_safe
  - prompt: 'Food left uncovered for a long time on a hot day may:'
    options:
    - spoil and make us ill
    - become more healthy
    - turn into medicine
    answer: spoil and make us ill
    difficulty: 1
    hints:
    - Germs grow fast in heat.
    - What happens to old food?
    solution: 'Step 1: Germs grow on food in heat. Step 2: It spoils and can make us ill.'
    mistakes:
      become more healthy: c4v5_safe
      turn into medicine: c4v5_safe
  - prompt: How long should we rub our hands with soap when washing?
    options:
    - about 20 seconds
    - 1 second
    - 10 minutes
    answer: about 20 seconds
    difficulty: 2
    hints:
    - Long enough to sing 'Happy Birthday' twice.
    - Not too short, not too long.
    solution: 'Step 1: Soap needs time to remove germs. Step 2: About 20 seconds is right.'
    mistakes:
      1 second: c4v5_safe
      10 minutes: c4v5_safe
  - prompt: Which fruit from a street cart is safest to eat?
    options:
    - a banana you peel yourself
    - cut fruit left open to flies
    - fruit that smells bad
    answer: a banana you peel yourself
    difficulty: 2
    hints:
    - Flies and dust land on open food.
    - Which fruit has its own cover?
    solution: 'Step 1: Cut fruit left open collects germs. Step 2: A banana''s peel protects it.'
    mistakes:
      cut fruit left open to flies: c4v5_safe
      fruit that smells bad: c4v5_safe
  - prompt: There is a lot of cooked food left after a family function. What is the best thing to do?
    options:
    - share it with neighbours or people who need it
    - throw it in the drain
    - leave it out for days
    answer: share it with neighbours or people who need it
    difficulty: 2
    hints:
    - Fresh food can still be eaten today.
    - Who could use it?
    solution: 'Step 1: Throwing it wastes food. Step 2: Sharing it while fresh helps others.'
    mistakes:
      throw it in the drain: c4v5_waste
      leave it out for days: c4v5_waste
  - prompt: Why should we not eat food that has fallen on a dusty floor?
    options:
    - it may have picked up germs
    - it becomes heavier
    - it changes colour
    answer: it may have picked up germs
    difficulty: 1
    hints:
    - Floors get dirty from shoes.
    - What can stick to the food?
    solution: 'Step 1: Dusty floors have germs. Step 2: Food that falls can pick them up.'
    mistakes:
      it becomes heavier: c4v5_safe
      it changes colour: c4v5_safe
  - prompt: Why do we keep milk in a fridge?
    options:
    - cold slows down germs, so it stays fresh longer
    - fridges make milk sweeter
    - to make it thicker
    answer: cold slows down germs, so it stays fresh longer
    difficulty: 3
    hints:
    - Milk spoils fast on a hot day.
    - What does cold do to germs?
    solution: 'Step 1: Germs grow slowly in the cold. Step 2: So milk stays fresh longer in the fridge.'
    mistakes:
      fridges make milk sweeter: c4v5_safe
      to make it thicker: c4v5_safe
  - prompt: A family wastes 2 rotis every day. How many rotis are wasted in a week?
    answer: '14'
    check: 2*7
    difficulty: 2
    hints:
    - A week has 7 days.
    - 2 each day for 7 days.
    solution: 'Step 1: 2 × 7. Step 2: = 14 rotis.'
    mistakes:
      '9': c4v5_waste
      '12': c4v5_waste
      '7': c4v5_waste
  - prompt: Which is a sign that food has gone bad?
    options:
    - it smells sour or has fuzzy mould
    - it is warm
    - it is on a plate
    answer: it smells sour or has fuzzy mould
    difficulty: 2
    hints:
    - Use your nose and eyes.
    - Bad food changes how it smells and looks.
    solution: 'Step 1: Spoilt food smells odd. Step 2: Mould (fuzzy spots) also shows it is bad.'
    mistakes:
      it is warm: c4v5_safe
      it is on a plate: c4v5_safe
