# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 5
title: Food for Health
tips:
  v4_flies: "Flies sit on rubbish before they sit on food. What do they carry?"
  v4_millets: "Ragi and jowar are small round grains, like rice and wheat but tougher."
  v4_wash_veg: "Vegetables come from soil and many hands. What could be on them?"

concepts:
- code: cbse4v.food.groups
  title: Eating a balanced diet
  notes: |
    Different foods help us in different ways: energy (rice, wheat, ragi, potatoes), growth (dal, milk, eggs, fish),
    protection (fruits, vegetables). A balanced diet has all of these and water. Millets like ragi and jowar are healthy
    grains. Eat fresh, home-cooked food; limit junk food and sugary drinks.
  explanations:
    text: 'Some foods give energy, some help us grow, and some protect us from illness. A balanced plate has a bit of each: rice or roti, dal or egg, and vegetables or fruit, with clean water.'
    visual: 'Draw a plate: half vegetables and fruit, a quarter rice or ragi, a quarter dal or egg, with a glass of water.'
    step_by_step: 'Step 1: Look at your meal. Step 2: Find an energy food, a growth food and a protective food. Step 3: Add what is missing.'
    real_world: Kerala meals with rice, sambar, thoran (vegetables) and curd are balanced.
  picture:
    kind: compare
    columns:
    - title: Energy
      points:
      - rice
      - ragi
      - wheat
    - title: Growth
      points:
      - dal
      - milk
      - egg
    - title: Protection
      points:
      - fruits
      - vegetables
    alt: Energy foods are rice, ragi and wheat; growth foods are dal, milk and egg; protective foods are fruits and vegetables.
  activity:
    type: sort
    prompt: What job does each food do?
    bins:
    - Gives energy
    - Helps us grow
    - Keeps us healthy
    items:
    - label: Poha
      bin: Gives energy
      clue: Made from rice.
      why: Energy food.
    - label: Idli
      bin: Gives energy
      clue: Rice and dal batter, mostly rice.
      why: Energy food.
    - label: Jaggery
      bin: Gives energy
      clue: Sweet.
      why: Energy food.
    - label: Fish
      bin: Helps us grow
      clue: Builds strong muscles.
      why: Body-building food.
    - label: Chana
      bin: Helps us grow
      clue: A pulse full of protein.
      why: Body-building food.
    - label: Curd
      bin: Helps us grow
      clue: Made from milk.
      why: Body-building food.
    - label: Guava
      bin: Keeps us healthy
      clue: Fruit with vitamin C.
      why: Protective food.
    - label: Tomato
      bin: Keeps us healthy
      clue: A vegetable.
      why: Protective food.
    - label: Papaya
      bin: Keeps us healthy
      clue: Fruit.
      why: Protective food.
  items:
  - prompt: Which food gives us energy?
    options:
    - rice
    - salt
    - water only
    - pepper
    answer: rice
    difficulty: 1
    hints:
    - A grain.
    - Fills us up.
    solution: Rice gives energy.
    mistakes: {"salt": "v5_energy_food"}
  - prompt: Which food helps us grow?
    options:
    - dal
    - sugar
    - chips
    - cola
    answer: dal
    difficulty: 1
    hints:
    - Pulses.
    - Protein.
    solution: Dal helps us grow.
    mistakes: {"sugar": "v5_body_building"}
  - prompt: 'Fruits and vegetables:'
    options:
    - protect us from illness
    - only give fat
    - are harmful
    - should never be eaten
    answer: protect us from illness
    difficulty: 1
    hints:
    - Vitamins.
    - Protective.
    solution: They are protective foods.
    mistakes: {"only give fat": "v5_protective"}
  - prompt: 'Ragi and jowar are:'
    options:
    - millets (healthy grains)
    - vegetables
    - sweets
    - drinks
    answer: millets (healthy grains)
    difficulty: 2
    hints:
    - Small grains.
    - Ragi dosa.
    solution: Ragi and jowar are millets.
    mistakes: {"vegetables": "v4_millets"}
  - prompt: Which is the healthiest snack?
    options:
    - a banana
    - a packet of chips
    - a cola
    - a chocolate bar
    answer: a banana
    difficulty: 1
    hints:
    - Fresh fruit.
    - No packet.
    solution: A banana is fresh and healthy.
    mistakes:
      a packet of chips: c4v_think
  - prompt: Why is too much junk food bad?
    options:
    - it has too much oil, salt or sugar
    - it has too many vitamins
    - it makes us strong
    - it is too healthy
    answer: it has too much oil, salt or sugar
    difficulty: 2
    hints:
    - Fried and sugary.
    - Little goodness.
    solution: Junk food has lots of oil, salt or sugar.
    mistakes: {"it makes us strong": "v5_junk"}
- code: cbse4v.food.safe
  title: Clean and safe food
  after:
  - cbse4v.food.groups
  notes: |
    Wash hands before eating and cooking. Wash fruits and vegetables. Cover food to keep flies away. Eat freshly cooked
    food. Drink clean (boiled or filtered) water. Don't waste food: take only what you need, share extra.
  explanations:
    text: Clean food keeps us healthy. Wash your hands with soap before eating, wash fruits and vegetables, keep food covered, and drink clean water. Take only as much food as you can eat.
    visual: Draw a covered dish, a child washing hands with soap and a glass of boiled water.
    step_by_step: 'Step 1: Wash hands. Step 2: Wash raw fruits and vegetables. Step 3: Keep food covered. Step 4: Take only what you can finish.'
    real_world: 'Midday meals in schools follow hygiene rules: covered food, clean plates and handwashing.'
  picture:
    kind: flow
    steps:
    - Wash hands with soap
    - Wash fruits and vegetables
    - Cover the food
    - Eat fresh, waste nothing
    alt: 'Safe eating: wash hands with soap, wash fruits and vegetables, keep food covered, eat fresh food and waste nothing.'
  activity:
    type: sort
    prompt: Is the food safe to eat?
    bins:
    - Safe and clean
    - Not safe
    items:
    - label: Food eaten after washing hands with soap
      bin: Safe and clean
      clue: Germs washed away.
      why: Safe.
    - label: Fruit washed in clean water
      bin: Safe and clean
      clue: Dirt rinsed off.
      why: Safe.
    - label: Food kept covered
      bin: Safe and clean
      clue: Flies can't reach it.
      why: Safe.
    - label: Boiled drinking water
      bin: Safe and clean
      clue: Boiling kills germs.
      why: Safe.
    - label: Food with flies sitting on it
      bin: Not safe
      clue: Flies carry germs.
      why: Not safe.
    - label: Eating with dirty hands after play
      bin: Not safe
      clue: What's on your hands?
      why: Not safe.
    - label: Food that smells bad
      bin: Not safe
      clue: Has it gone off?
      why: Not safe.
    - label: Fruit picked off the ground, unwashed
      bin: Not safe
      clue: Dirt and germs.
      why: Wash it first.
  items:
  - prompt: Why should food be covered?
    options:
    - to keep flies and dust away
    - to make it cold
    - to make it heavy
    - to change its taste
    answer: to keep flies and dust away
    difficulty: 1
    hints:
    - Flies carry germs.
    - Dust.
    solution: Covering keeps flies and dust off food.
    mistakes: {"to make it cold": "v5_cover"}
  - prompt: When should we wash our hands?
    options:
    - before eating
    - only once a month
    - never
    - only after sleeping
    answer: before eating
    difficulty: 1
    hints:
    - Germs on hands.
    - Before food.
    solution: Wash hands before eating.
    mistakes: {"only once a month": "v5_handwash"}
  - prompt: Which water is safe to drink?
    options:
    - boiled or filtered water
    - pond water
    - puddle water
    - drain water
    answer: boiled or filtered water
    difficulty: 1
    hints:
    - Germ-free.
    - Clean.
    solution: Boiled or filtered water is safe.
    mistakes: {"pond water": "v5_boil"}
  - prompt: How can we avoid wasting food?
    options:
    - take only as much as we can eat
    - throw away leftovers
    - cook too much every day
    - leave food on the plate
    answer: take only as much as we can eat
    difficulty: 1
    hints:
    - Small helpings.
    - Ask for more.
    solution: Taking only what you need avoids waste.
    mistakes: {"throw away leftovers": "v5_waste"}
  - prompt: Why should we wash vegetables before cooking?
    options:
    - to remove dirt and germs
    - to make them grow
    - to change their colour
    - to make them heavier
    answer: to remove dirt and germs
    difficulty: 1
    hints:
    - From the farm and market.
    - Clean.
    solution: Washing removes dirt and germs.
    mistakes: {"to make them grow": "v4_wash_veg"}
  - prompt: 'Flies sitting on food can:'
    options:
    - spread germs and illness
    - make food tastier
    - clean the food
    - keep food fresh
    answer: spread germs and illness
    difficulty: 2
    hints:
    - They sit on waste too.
    - Germs.
    solution: Flies carry germs from waste to food.
    mistakes: {"make food tastier": "v4_flies"}
