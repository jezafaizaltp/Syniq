# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 1
title: Living Together
tips:
  c4v_think: Think about your own home, school or street. What have you seen there?
  c4v_reread: Read the question again slowly and find the key word.
concepts:
- code: cbse4v.live.family
  title: Families and helping each other
  notes: |
    People live together in families: small (parents and children) or joint (grandparents, uncles, aunts, cousins). Family
    members share work: cooking, cleaning, shopping, caring for little ones and elders. Children can help too: setting the
    table, watering plants, folding clothes. Respect and care for elders.
  explanations:
    text: We live with our families. Some families are small, and some are big joint families with grandparents, uncles and cousins. Everyone shares the work at home, and children can help too.
    visual: 'Draw your family tree: grandparents at the top, parents in the middle, you and your brothers or sisters at the bottom.'
    step_by_step: 'Step 1: List who lives in your home. Step 2: List jobs done at home. Step 3: Choose one job you can do.'
    real_world: In many Indian homes grandparents tell stories while parents cook and children lay the plates.
  picture:
    kind: compare
    columns:
    - title: Small family
      points:
      - parents
      - children
    - title: Joint family
      points:
      - grandparents
      - parents, uncles, aunts
      - cousins
    alt: A small family has parents and children; a joint family also has grandparents, uncles, aunts and cousins.
  items:
  - prompt: 'A family with grandparents, uncles, aunts and cousins living together is a:'
    options:
    - joint family
    - small family
    - school
    - club
    answer: joint family
    difficulty: 1
    hints:
    - Many people.
    - Joined together.
    solution: That is a joint family.
  - prompt: Which job can a child do at home?
    options:
    - water the plants
    - drive the car
    - fix the electric wires
    - cook on a big stove alone
    answer: water the plants
    difficulty: 1
    hints:
    - Safe and easy.
    - Plants.
    solution: Watering plants is a safe job for a child.
    mistakes:
      fix the electric wires: c4v_think
  - prompt: Why should family members share work?
    options:
    - so no one gets too tired and work gets done
    - so only mother works
    - to make the house messy
    - so children never help
    answer: so no one gets too tired and work gets done
    difficulty: 1
    hints:
    - Sharing makes it easier.
    - Fair.
    solution: Sharing work is fair and quicker.
  - prompt: How can we show respect to elders?
    options:
    - listen to them and help them
    - shout at them
    - ignore them
    - laugh at them
    answer: listen to them and help them
    difficulty: 1
    hints:
    - Be kind.
    - Help.
    solution: Listening and helping shows respect.
  - prompt: Who usually lives in a small family?
    options:
    - parents and their children
    - only cousins
    - the whole village
    - only grandparents and uncles
    answer: parents and their children
    difficulty: 1
    hints:
    - Small = few people.
    - Mother, father, children.
    solution: A small family is parents and children.
  - prompt: 'Grandparents often share with children:'
    options:
    - stories and experiences
    - homework answers only
    - nothing
    - mobile games only
    answer: stories and experiences
    difficulty: 2
    hints:
    - They have lived long.
    - Stories.
    solution: Grandparents share stories and wisdom.
- code: cbse4v.live.community
  title: People who help us
  after:
  - cbse4v.live.family
  notes: |
    A community is people living and working together: neighbours, shopkeepers, farmers, doctors, nurses, teachers,
    postal workers, sanitation workers, police, firefighters. Each job matters; we depend on each other. Festivals bring
    communities together. Helpline numbers: 112 emergency.
  explanations:
    text: We depend on many people. Farmers grow our food, doctors and nurses keep us healthy, teachers help us learn, sanitation workers keep streets clean, and police keep us safe. Every job is important.
    visual: Draw a street with a doctor's clinic, a school, a shop, a sanitation worker sweeping and a police officer.
    step_by_step: 'Step 1: Name a helper. Step 2: What do they do? Step 3: How would life be without them? Step 4: How can we thank them?'
    real_world: 'During floods in Kerala in 2018, fishermen used their boats to rescue many people: a community helping itself.'
  picture:
    kind: flow
    steps:
    - Farmer grows food
    - Shopkeeper sells it
    - Family cooks it
    - Sanitation worker clears waste
    alt: 'We depend on each other: the farmer grows food, the shopkeeper sells it, the family cooks it, and the sanitation worker clears the waste.'
  items:
  - prompt: Who grows the food we eat?
    options:
    - farmers
    - pilots
    - painters
    - drivers
    answer: farmers
    difficulty: 1
    hints:
    - Fields.
    - Crops.
    solution: Farmers grow our food.
  - prompt: Who keeps our streets clean?
    options:
    - sanitation workers
    - actors
    - singers
    - players
    answer: sanitation workers
    difficulty: 1
    hints:
    - They sweep and collect waste.
    - Safai.
    solution: Sanitation workers keep streets clean.
  - prompt: Whom do we call when there is a fire?
    options:
    - firefighters
    - a tailor
    - a carpenter
    - a farmer
    answer: firefighters
    difficulty: 1
    hints:
    - Fire engine.
    - Water hose.
    solution: Firefighters put out fires.
  - prompt: What is the emergency number in India?
    options:
    - '112'
    - '999'
    - '123'
    - '500'
    answer: '112'
    difficulty: 2
    hints:
    - One number for police, fire and ambulance.
    - 1-1-2.
    solution: 112 is the single emergency number.
  - prompt: Which is true about jobs in a community?
    options:
    - every job is important
    - only doctors matter
    - cleaning is not real work
    - farmers are not needed
    answer: every job is important
    difficulty: 1
    hints:
    - We depend on all.
    - Respect.
    solution: Every job helps the community.
    mistakes:
      cleaning is not real work: c4v_think
  - prompt: How can you thank the people who help you?
    options:
    - say thank you and treat them kindly
    - ignore them
    - litter their area
    - shout at them
    answer: say thank you and treat them kindly
    difficulty: 1
    hints:
    - Kind words.
    - Respect.
    solution: Saying thank you and being kind shows respect.
