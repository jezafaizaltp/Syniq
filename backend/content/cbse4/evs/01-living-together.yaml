# CBSE Class 4 Environmental Studies (NCERT Our Wondrous World, 2025-26), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse4-evs
chapter: 1
title: Living Together
tips:
  c4v_think: Think about your own home, school or street. What have you seen there?
  c4v_reread: Read the question again slowly and find the key word.
  v4_112: "999 is used in some other countries. India's single emergency number has three digits starting with 1."
  v4_farmer: "Food grows in fields. Who works there?"
  v4_firefighter: "Who comes with a red truck and water hoses?"
  v4_grandparents: "Grandparents have lived a long time. What can they tell you about?"
  v4_joint: "Many relatives under one roof, all joined together in one home."
  v4_respect: "Respect means treating someone as important. Which choice does that?"
  v4_sanitation: "Some workers sweep streets and collect rubbish every morning."
  v4_share_work: "If one person does everything, how will they feel? Sharing spreads the load."
  v4_small_family: "A joint family has many relatives. A small family has fewer people: who are they?"
  v4_thank: "How would you feel if someone thanked you for your work?"
  c4v1_family: 'Think of who lives in the home: just parents and children, or grandparents, uncles, aunts and cousins too?'
  c4v1_share: Think how the home would run if one person did every job alone. What would change if each person did a little?
  c4v1_helper: Think of what each worker does every day. Whose work fits the problem in the question?
concepts:
- code: cbse4v.live.family
  title: Families and helping each other
  notes: |
    People live together in families: small (parents and children) or joint (grandparents, uncles, aunts, cousins). Family
    members share work: cooking, cleaning, shopping, caring for little ones and elders. Children can help too: setting the
    table, watering plants, folding clothes. Respect and care for elders.
  explanations:
    text: We live with our families. Some families are small, and some are big joint families with grandparents, uncles and cousins. Everyone shares the work at home, and children can help too.
    visual: 'Draw your family tree: grandparents at the top, parents in the middle, you and your brothers or sisters at the bottom.'
    step_by_step: 'Step 1: List who lives in your home. Step 2: List jobs done at home. Step 3: Choose one job you can do.'
    real_world: In many Indian homes grandparents tell stories while parents cook and children lay the plates.
  picture:
    kind: compare
    columns:
    - title: Small family
      points:
      - parents
      - children
    - title: Joint family
      points:
      - grandparents
      - parents, uncles, aunts
      - cousins
    alt: A small family has parents and children; a joint family also has grandparents, uncles, aunts and cousins.
  activity:
    type: sort
    prompt: Is it helping the family?
    bins:
    - Helping the family
    - Not helping
    items:
    - label: Setting the plates before dinner
      bin: Helping the family
      clue: Does it make the work lighter for others?
      why: Helping.
    - label: Watering the plants
      bin: Helping the family
      clue: A small job you can do.
      why: Helping.
    - label: Folding your clothes
      bin: Helping the family
      clue: Someone else won't have to.
      why: Helping.
    - label: Reading to grandma
      bin: Helping the family
      clue: She enjoys it.
      why: Caring is helping.
    - label: Leaving toys all over the floor
      bin: Not helping
      clue: Who has to pick them up?
      why: Not helping.
    - label: Leaving the tap running
      bin: Not helping
      clue: Water is wasted.
      why: Not helping.
    - label: Shouting when asked to help
      bin: Not helping
      clue: How does everyone feel?
      why: Not helping.
  lesson:
    - teach: People live together in families. A small family has parents and their children. A joint family also has grandparents, uncles, aunts and cousins living together.
      check:
        prompt: 'Grandparents, parents, an uncle and cousins live in one house. This is a:'
        options:
        - joint family
        - small family
        - class
        answer: joint family
        why: Many relatives living together make a joint family.
      ways:
      - style: visual
        teach: A small family and a joint family, and who lives in each one.
        picture:
          kind: compare
          columns:
          - title: Small family
            points:
            - Parents
            - Their children
          - title: Joint family
            points:
            - Grandparents
            - Parents and children
            - Uncles and aunts
            - Cousins
          alt: A small family has parents and their children. A joint family also has grandparents, uncles, aunts and cousins living together.
      - style: real_world
        teach: In a joint family home, the kitchen can be busy from early morning, with several people cooking together. In a small family, a parent may cook alone while the children get ready for school.
    - teach: 'Family members share the work: cooking, cleaning, shopping, and caring for little ones and elders. Children can help too, like setting the table or folding clothes.'
      picture:
        kind: flow
        steps:
        - Many jobs at home
        - Everyone takes a part
        - Work is done faster
        - No one gets too tired
        alt: 'Sharing housework: many jobs, everyone helps, work done faster, no one too tired.'
      check:
        prompt: Which is a good job for a child at home?
        options:
        - folding clothes
        - driving the car
        - fixing wires
        answer: folding clothes
        why: It is safe and helps the family.
      ways:
      - style: step_by_step
        teach: 'Make a family job chart. Step 1: List the jobs: cooking, washing dishes, sweeping, watering plants. Step 2: Write each person''s name next to a job that suits them. Step 3: Give children small jobs, like setting the table. Step 4: Change jobs each week so everyone learns.'
      - style: real_world
        teach: When everyone helps clear up after a meal, the dishes are done in ten minutes. If one person does it alone, it can take half an hour and leave them tired.
    - teach: Elders have lived long and know a lot. We show respect by listening to them, helping them and spending time with them. They share stories and experiences with us.
      check:
        prompt: How can you help a grandparent who finds it hard to walk?
        options:
        - give your arm for support
        - walk away quickly
        - laugh at them
        answer: give your arm for support
        why: Helping elders shows care and respect.
      ways:
      - style: visual
        teach: What elders give us, and how we can show them respect.
        picture:
          kind: compare
          columns:
          - title: Elders give us
            points:
            - Stories from long ago
            - Advice from experience
            - Care and love
          - title: We show respect by
            points:
            - Listening to them
            - Helping with their work
            - Spending time with them
          alt: Elders give us stories from long ago, advice from experience, and care and love. We show respect by listening to them, helping with their work and spending time with them.
      - style: real_world
        teach: Many grandparents remember games, songs and recipes that are no longer common. Asking them to teach you one keeps those old ways alive and makes them feel valued.
  items:
  - prompt: 'A family with grandparents, uncles, aunts and cousins living together is a:'
    options:
    - joint family
    - small family
    - school
    - club
    answer: joint family
    difficulty: 1
    hints:
    - Many people.
    - Joined together.
    solution: That is a joint family.
    mistakes: {"small family": "v4_joint"}
  - prompt: Which job can a child do at home?
    options:
    - water the plants
    - drive the car
    - fix the electric wires
    - cook on a big stove alone
    answer: water the plants
    difficulty: 1
    hints:
    - Safe and easy.
    - Plants.
    solution: Watering plants is a safe job for a child.
    mistakes:
      fix the electric wires: c4v_think
  - prompt: Why should family members share work?
    options:
    - "so no one gets too tired and work gets done"
    - "so that only one parent does all the work"
    - "so the house gets messy and stays messy"
    - "so that children never have to help at all"
    answer: so no one gets too tired and work gets done
    difficulty: 1
    hints:
    - Sharing makes it easier.
    - Fair.
    solution: Sharing work is fair and quicker.
    mistakes: {"so that only one parent does all the work": "v4_share_work"}
  - prompt: How can we show respect to elders?
    options:
    - "listen to them and help them"
    - "shout at them when they talk"
    - "ignore them when they call us"
    - "laugh at them behind their backs"
    answer: listen to them and help them
    difficulty: 1
    hints:
    - Be kind.
    - Help.
    solution: Listening and helping shows respect.
    mistakes: {"ignore them when they call us": "v4_respect"}
  - prompt: Who usually lives in a small family?
    options:
    - parents and their children
    - only cousins
    - the whole village
    - only grandparents and uncles
    answer: parents and their children
    difficulty: 1
    hints:
    - Small = few people.
    - Mother, father, children.
    solution: A small family is parents and children.
    mistakes: {"only grandparents and uncles": "v4_small_family"}
  - prompt: 'Grandparents often share with children:'
    options:
    - stories and experiences
    - homework answers only
    - nothing
    - mobile games only
    answer: stories and experiences
    difficulty: 2
    hints:
    - They have lived long.
    - Stories.
    solution: Grandparents share stories and wisdom.
    mistakes: {"homework answers only": "v4_grandparents"}
  - prompt: Who are cousins?
    options:
    - "children of your uncles and aunts"
    - "friends of your mother and father"
    - "children who sit in your class"
    answer: children of your uncles and aunts
    difficulty: 1
    hints:
    - Cousins are relatives.
    - Think of your father's or mother's brothers and sisters.
    solution: 'Step 1: Uncles and aunts are your parents'' brothers and sisters. Step 2: Their children are your cousins.'
    mistakes:
      "friends of your mother and father": c4v1_family
      "children who sit in your class": c4v1_family
  - prompt: In a family, who can do housework?
    options:
    - "everyone, boys and girls, men and women"
    - "only the mothers and nobody else"
    - "only the grandmothers in the house"
    answer: everyone, boys and girls, men and women
    difficulty: 2
    hints:
    - Everyone in the house uses the home.
    - Is any job only for one kind of person?
    solution: 'Step 1: Housework is needed by everyone. Step 2: So everyone can share it.'
    mistakes:
      "only the mothers and nobody else": c4v1_share
      "only the grandmothers in the house": c4v1_share
  - prompt: Which is a way to care for a baby brother or sister?
    options:
    - "play gently and keep small things away"
    - "give them a sharp pencil to play with"
    - "leave them alone near the open stairs"
    answer: play gently and keep small things away
    difficulty: 1
    hints:
    - Babies put things in their mouths.
    - Which choice keeps the baby safe?
    solution: 'Step 1: Small or sharp things can hurt babies. Step 2: Playing gently and keeping them away is caring.'
    mistakes:
      "give them a sharp pencil to play with": c4v1_share
      "leave them alone near the open stairs": c4v1_share
  - prompt: A family moves to a new town for work. What can help them feel at home?
    options:
    - friendly neighbours
    - closed doors
    - no visitors
    answer: friendly neighbours
    difficulty: 2
    hints:
    - Moving means leaving old friends.
    - Who can welcome them?
    solution: 'Step 1: New places can feel lonely. Step 2: Friendly neighbours help a new family settle.'
    mistakes:
      closed doors: c4v1_family
      no visitors: c4v1_family
  - prompt: Why do family members eat together when they can?
    options:
    - "to share their day and feel close"
    - "to finish all the food much faster"
    - "so that the plates stay clean"
    answer: to share their day and feel close
    difficulty: 2
    hints:
    - Meals are a time to talk.
    - What does talking together do for a family?
    solution: 'Step 1: At meals people talk about their day. Step 2: This brings the family closer.'
    mistakes:
      "to finish all the food much faster": c4v1_share
      "so that the plates stay clean": c4v1_share
  - prompt: Which job helps keep the home clean?
    options:
    - putting toys back after play
    - throwing wrappers on the floor
    - leaving taps running
    answer: putting toys back after play
    difficulty: 1
    hints:
    - Clean means tidy and in place.
    - Which action makes less mess?
    solution: 'Step 1: Wrappers make mess and running taps waste water. Step 2: Putting toys back keeps the home tidy.'
    mistakes:
      throwing wrappers on the floor: c4v1_share
      leaving taps running: c4v1_share
  - prompt: Families can be different. Which is true?
    options:
    - every family is different and special
    - every family must have five people
    - only big families are happy
    answer: every family is different and special
    difficulty: 2
    hints:
    - Think of families you know.
    - Are they all the same size?
    solution: 'Step 1: Families have different sizes and members. Step 2: Every family is different and special.'
    mistakes:
      every family must have five people: c4v1_family
      only big families are happy: c4v1_family
  - prompt: What can a family do when someone is ill?
    options:
    - "take care of them and share their work"
    - "ignore them until they feel better"
    - "make a lot of loud noise near them"
    answer: take care of them and share their work
    difficulty: 1
    hints:
    - An ill person needs rest.
    - Who does their jobs meanwhile?
    solution: 'Step 1: The ill person needs rest and care. Step 2: Others share their work.'
    mistakes:
      "ignore them until they feel better": c4v1_share
      "make a lot of loud noise near them": c4v1_share
  - prompt: A joint family has 2 grandparents, 2 parents, 1 uncle, 1 aunt and 3 children. How many people?
    answer: '9'
    check: 2+2+1+1+3
    difficulty: 3
    hints:
    - Add each group of people.
    - 2 + 2 first, then the rest.
    solution: 'Step 1: 2 + 2 + 1 + 1 = 6 adults. Step 2: 6 + 3 children = 9.'
    mistakes:
      '8': c4v1_family
      '7': c4v1_family
      '10': c4v1_family
  - prompt: 'Case: In Arun''s home, one parent cooks, cleans and shops every day, while everyone else watches TV. That parent is always tired. What would help most?'
    options:
    - "Everyone shares the jobs, even the children"
    - "That parent should just learn to work faster"
    - "The family should eat less food every day"
    answer: Everyone shares the jobs, even the children
    hints:
    - Is the work shared fairly now?
    - What changes if each person does a little?
    solution: When the work is shared, no one gets too tired and the jobs still get done. Children can help with small jobs too.
    mistakes:
      "That parent should just learn to work faster": c4v1_share
      "The family should eat less food every day": c4v1_share
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your grandmother wants to tell you about her school days, but you want to play a phone game. What is the respectful thing to do?'
    options:
    - Put the game away and listen to her
    - Keep playing and nod now and then
    - Tell her to talk later every time
    answer: Put the game away and listen to her
    hints:
    - How do we show respect to elders?
    - What would make her feel that you care?
    solution: Listening to elders and spending time with them shows respect, and their stories teach us a lot.
    mistakes:
      Keep playing and nod now and then: c4v1_family
      Tell her to talk later every time: c4v1_family
    exam: competency
    difficulty: 2
- code: cbse4v.live.community
  title: People who help us
  after:
  - cbse4v.live.family
  notes: |
    A community is people living and working together: neighbours, shopkeepers, farmers, doctors, nurses, teachers,
    postal workers, sanitation workers, police, firefighters. Each job matters; we depend on each other. Festivals bring
    communities together. Helpline numbers: 112 emergency.
  explanations:
    text: We depend on many people. Farmers grow our food, doctors and nurses keep us healthy, teachers help us learn, sanitation workers keep streets clean, and police keep us safe. Every job is important.
    visual: Draw a street with a doctor's clinic, a school, a shop, a sanitation worker sweeping and a police officer.
    step_by_step: 'Step 1: Name a helper. Step 2: What do they do? Step 3: How would life be without them? Step 4: How can we thank them?'
    real_world: 'During floods in Kerala in 2018, fishermen used their boats to rescue many people: a community helping itself.'
  picture:
    kind: flow
    steps:
    - Farmer grows food
    - Shopkeeper sells it
    - Family cooks it
    - Sanitation worker clears waste
    alt: 'We depend on each other: the farmer grows food, the shopkeeper sells it, the family cooks it, and the sanitation worker clears the waste.'
  activity:
    type: sort
    prompt: Who helps us in this way?
    bins:
    - Farmer
    - Doctor
    - Teacher
    - Sanitation worker
    - Postal worker
    items:
    - label: Grows rice and vegetables
      bin: Farmer
      clue: Works in the fields.
      why: A farmer.
    - label: Milks cows and sells the milk
      bin: Farmer
      clue: Looks after cattle.
      why: A dairy farmer.
    - label: Checks you when you are ill
      bin: Doctor
      clue: Uses a stethoscope.
      why: A doctor.
    - label: Gives medicine and treatment
      bin: Doctor
      clue: At the hospital.
      why: A doctor.
    - label: Helps you learn to read
      bin: Teacher
      clue: At school.
      why: A teacher.
    - label: Explains maths in class
      bin: Teacher
      clue: Writes on the board.
      why: A teacher.
    - label: Sweeps and cleans the streets
      bin: Sanitation worker
      clue: Keeps our town clean.
      why: A sanitation worker.
    - label: Collects garbage from homes
      bin: Sanitation worker
      clue: Every morning.
      why: A sanitation worker.
    - label: Brings letters to your house
      bin: Postal worker
      clue: Carries a bag of mail.
      why: A postal worker.
  lesson:
    - teach: 'A community is people who live and work together in one place: neighbours, shopkeepers, farmers, doctors, teachers, sanitation workers, police and firefighters.'
      check:
        prompt: Who teaches children in a community?
        options:
        - teachers
        - farmers
        - drivers
        answer: teachers
        why: Teaching is a teacher's work.
      ways:
      - style: visual
        teach: Some people in a community and the work each one does.
        picture:
          kind: compare
          columns:
          - title: Person
            points:
            - Farmer
            - Sanitation worker
            - Nurse
            - Police officer
            - Firefighter
          - title: Work
            points:
            - Grows our food
            - Keeps streets clean
            - Cares for the sick
            - Keeps us safe
            - Puts out fires
          alt: A farmer grows our food, a sanitation worker keeps streets clean, a nurse cares for the sick, a police officer keeps us safe and a firefighter puts out fires.
      - style: real_world
        teach: 'Think about your breakfast: a farmer grew the rice, a milk seller brought the milk, a driver carried vegetables to the market and a shopkeeper sold them. Many people helped before it reached your plate.'
    - teach: We depend on each other. The farmer grows food, the sanitation worker keeps streets clean, the nurse cares for the sick. Every job is important.
      picture:
        kind: compare
        columns:
        - title: Food and things
          points:
          - farmer
          - shopkeeper
          - tailor
        - title: Health and safety
          points:
          - doctor, nurse
          - police
          - firefighter
        - title: Clean and connected
          points:
          - sanitation worker
          - postal worker
          - bus driver
        alt: Community helpers grouped by the kind of help they give.
      check:
        prompt: If sanitation workers stop work for a week, what happens?
        options:
        - garbage piles up
        - food grows faster
        - nothing changes
        answer: garbage piles up
        why: They clear the waste every day.
      ways:
      - style: step_by_step
        teach: 'Trace how people depend on each other. Step 1: Pick something you used today, like a notebook. Step 2: Ask who made the paper. Step 3: Ask who brought it to the shop. Step 4: Ask who sold it to you. Many people''s work joined together.'
      - style: real_world
        teach: During a strike by sanitation workers, rubbish piles up on streets within a few days. It shows how much a town depends on their work every single day.
    - teach: In an emergency, dial 112. Thank the people who help us and treat them with respect. Festivals and fairs bring the whole community together.
      check:
        prompt: In an emergency in India, which number do we call?
        options:
        - '112'
        - '100100'
        - '0'
        answer: '112'
        why: 112 is the single emergency number.
      ways:
      - style: visual
        teach: What to do in an emergency, one step at a time.
        picture:
          kind: flow
          steps:
          - Stay calm and move away from danger
          - Tell the nearest grown-up
          - The grown-up dials 112
          - Say clearly what happened and where
          - Wait for help to arrive
          alt: In an emergency, stay calm and move away from danger, tell the nearest grown-up, who dials 112, says clearly what happened and where, and then waits for help to arrive.
      - style: real_world
        teach: During Onam or Diwali, neighbours often decorate the street together, cook for each other and share sweets. Festivals remind a community that it is one big group.
  items:
  - prompt: Who grows the food we eat?
    options:
    - farmers
    - pilots
    - painters
    - drivers
    answer: farmers
    difficulty: 1
    hints:
    - Fields.
    - Crops.
    solution: Farmers grow our food.
    mistakes: {"drivers": "v4_farmer"}
  - prompt: Who keeps our streets clean?
    options:
    - sanitation workers
    - actors
    - singers
    - players
    answer: sanitation workers
    difficulty: 1
    hints:
    - They sweep and collect waste.
    - Safai.
    solution: Sanitation workers keep streets clean.
    mistakes: {"actors": "v4_sanitation"}
  - prompt: Whom do we call when there is a fire?
    options:
    - firefighters
    - a tailor
    - a carpenter
    - a farmer
    answer: firefighters
    difficulty: 1
    hints:
    - Fire engine.
    - Water hose.
    solution: Firefighters put out fires.
    mistakes: {"a tailor": "v4_firefighter"}
  - prompt: What is the emergency number in India?
    options:
    - '112'
    - '999'
    - '123'
    - '500'
    answer: '112'
    difficulty: 2
    hints:
    - One number for police, fire and ambulance.
    - 1-1-2.
    solution: 112 is the single emergency number.
    mistakes: {"999": "v4_112"}
  - prompt: Which is true about jobs in a community?
    options:
    - every job is important
    - only doctors matter
    - cleaning is not real work
    - farmers are not needed
    answer: every job is important
    difficulty: 1
    hints:
    - We depend on all.
    - Respect.
    solution: Every job helps the community.
    mistakes:
      cleaning is not real work: c4v_think
  - prompt: How can you thank the people who help you?
    options:
    - "say thank you and treat them kindly"
    - "ignore them when they pass by"
    - "throw litter where they work"
    - "shout at them when they are slow"
    answer: say thank you and treat them kindly
    difficulty: 1
    hints:
    - Kind words.
    - Respect.
    solution: Saying thank you and being kind shows respect.
    mistakes: {"ignore them when they pass by": "v4_thank"}
  - prompt: Who brings letters and parcels to our homes?
    options:
    - postal worker
    - firefighter
    - farmer
    answer: postal worker
    difficulty: 1
    hints:
    - Letters go through the post office.
    - Who carries them from there?
    solution: 'Step 1: Letters come from the post office. Step 2: A postal worker delivers them.'
    mistakes:
      firefighter: c4v1_helper
      farmer: c4v1_helper
  - prompt: Who stitches clothes?
    options:
    - tailor
    - potter
    - carpenter
    answer: tailor
    difficulty: 1
    hints:
    - Needle and thread are used.
    - A potter uses clay; a carpenter uses wood.
    solution: 'Step 1: Clothes are stitched with needle and thread. Step 2: That is a tailor''s work.'
    mistakes:
      potter: c4v1_helper
      carpenter: c4v1_helper
  - prompt: Who makes tables and chairs from wood?
    options:
    - carpenter
    - plumber
    - cobbler
    answer: carpenter
    difficulty: 1
    hints:
    - Wood, saw and hammer.
    - A plumber fixes pipes; a cobbler fixes shoes.
    solution: 'Step 1: Furniture is made from wood. Step 2: A carpenter works with wood.'
    mistakes:
      plumber: c4v1_helper
      cobbler: c4v1_helper
  - prompt: A tap is leaking at home. Whom should the family call?
    options:
    - plumber
    - electrician
    - tailor
    answer: plumber
    difficulty: 2
    hints:
    - Taps and pipes carry water.
    - Who fixes water pipes?
    solution: 'Step 1: A leaking tap is a water pipe problem. Step 2: A plumber fixes it.'
    mistakes:
      electrician: c4v1_helper
      tailor: c4v1_helper
  - prompt: Why do we call every job in a community important?
    options:
    - "we all depend on each other's work"
    - "some jobs pay a lot more money"
    - "only the big, famous jobs matter"
    answer: we all depend on each other's work
    difficulty: 2
    hints:
    - Imagine a town with no farmers.
    - Or no one to clean the streets.
    solution: 'Step 1: Without any one job, life gets hard for everyone. Step 2: So every job is important.'
    mistakes:
      "some jobs pay a lot more money": c4v1_helper
      "only the big, famous jobs matter": c4v1_helper
  - prompt: A road accident happens and someone is hurt. What should a child do first?
    options:
    - "tell a nearby grown-up so they can call 112"
    - "run away quickly and tell nobody about it"
    - "try to lift and move the hurt person alone"
    answer: tell a nearby grown-up so they can call 112
    difficulty: 3
    hints:
    - Children should not handle it alone.
    - Who can call for help fast?
    solution: 'Step 1: A grown-up can call 112 and help safely. Step 2: So tell a grown-up first.'
