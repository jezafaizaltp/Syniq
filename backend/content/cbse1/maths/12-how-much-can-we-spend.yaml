# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 12
title: How Much Can We Spend
tips:
  m1_enough_money: "Count up: is 5 before or after 7?"
  m1_most_coin: "Look at the number printed on each coin or note. Which number is biggest?"

concepts:
- code: cbse1m.spend.coins
  title: Coins and notes
  notes: |
    Recognising 1, 2, 5 and 10 rupee coins and 10 and 20 rupee notes; counting small amounts.
  explanations:
    text: We buy things with rupees. There are coins of 1, 2, 5 and 10 rupees, and notes of 10 and 20 rupees. Two 5-rupee coins make 10 rupees.
    visual: Draw a 5-rupee coin, a 2-rupee coin and a 1-rupee coin, and write 5 + 2 + 1 = 8 rupees.
    step_by_step: 'Step 1: Look at the number on each coin. Step 2: Add them up. Step 3: Say the total in rupees.'
    real_world: At a small shop a toffee may cost 1 rupee.
  picture:
    kind: bars
    bars:
    - label: ₹1
      value: 1
    - label: ₹2
      value: 2
    - label: ₹5
      value: 5
    - label: ₹10
      value: 10
    alt: 'Coins: 1 rupee, 2 rupees, 5 rupees, 10 rupees.'
    unit: rupees
  activity:
    type: sort
    prompt: How many rupees?
    bins:
    - 5 rupees
    - 10 rupees
    - 20 rupees
    items:
    - label: Two ₹5 coins
      bin: 10 rupees
      clue: Count 5, then 5 more.
      why: 5 + 5 = 10.
    - label: One ₹5 coin
      bin: 5 rupees
      clue: Read the number on the coin.
      why: One coin, but it says 5.
    - label: Two ₹10 notes
      bin: 20 rupees
      clue: 10 and 10 more.
      why: 10 + 10 = 20.
    - label: One ₹2 coin and three ₹1 coins
      bin: 5 rupees
      clue: Start at 2, count on 3.
      why: 2, 3, 4, 5.
    - label: One ₹20 note
      bin: 20 rupees
      clue: One note, but read the number.
      why: It says 20.
    - label: Five ₹2 coins
      bin: 10 rupees
      clue: 'Count in twos: 2, 4 ...'
      why: 2, 4, 6, 8, 10.
  items:
  - prompt: Two 5-rupee coins make how many rupees?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - Count on.
    solution: 5 + 5 = 10 rupees.
    mistakes:
      '2': c1_count_once
  - prompt: 'A 2-rupee coin and a 1-rupee coin make:'
    answer: '3'
    check: 2 + 1
    difficulty: 1
    hints:
    - 2 + 1.
    - Count on.
    solution: 2 + 1 = 3 rupees.
    mistakes:
      '2': c1_count_once
  - prompt: 'Three 1-rupee coins make:'
    answer: '3'
    check: 3*1
    difficulty: 1
    hints:
    - 1 + 1 + 1.
    - Count the coins.
    solution: 3 rupees.
    mistakes:
      '1': c1_count_once
  - prompt: Which coin is worth the most?
    options:
    - 10 rupees
    - 5 rupees
    - 2 rupees
    - 1 rupee
    answer: 10 rupees
    difficulty: 1
    hints:
    - Biggest number.
    - '10.'
    solution: 10 rupees is the most.
    mistakes: {"5 rupees": "m1_most_coin"}
  - prompt: 'A 5-rupee coin and a 2-rupee coin make:'
    answer: '7'
    check: 5 + 2
    difficulty: 2
    hints:
    - 5 + 2.
    - Count on from 5.
    solution: 5 + 2 = 7 rupees.
    mistakes:
      '6': c1_count_once
  - prompt: How many 2-rupee coins make 10 rupees?
    answer: '5'
    check: 10 // 2
    difficulty: 2
    hints:
    - 2, 4, 6, 8, 10.
    - Count the jumps.
    solution: 5 coins.
    mistakes:
      '2': c1_count_once
      '4': c1_count_once
- code: cbse1m.spend.buy
  title: Buying and how much is left
  after:
  - cbse1m.spend.coins
  notes: |
    Buying small things: adding two prices, checking if we have enough, what is left after buying.
  explanations:
    text: If a pencil costs 5 rupees and an eraser 3 rupees, together they cost 8 rupees. If you have 10 rupees, you have 2 rupees left.
    visual: Draw a pencil with a ₹5 tag and an eraser with a ₹3 tag, and a 10-rupee note.
    step_by_step: 'Step 1: Add the prices. Step 2: Compare with the money you have. Step 3: Take away to find what is left.'
    real_world: Children buy small things at the school stationery shop.
  picture:
    kind: flow
    steps:
    - Have ₹10
    - Buy for ₹8
    - ₹10 − ₹8
    - ₹2 left
    alt: You have 10 rupees, buy things for 8 rupees, and 2 rupees are left.
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Add the prices, or find what is left.
    goals:
    - prompt: A pencil ₹5 and an eraser ₹3. Total?
      target: 8
      mistakes:
      - when:
          v: 2
        say: 'That takes away. Buying both means put the prices together: 5 + 3.'
      - when:
          v: 5
        say: That's only the pencil. Add the eraser too.
    - prompt: You have ₹10. You spend ₹8. What is left?
      target: 2
      mistakes:
      - when:
          v: 18
        say: Spending makes your money go down, not up. 10 take away 8.
      - when:
          v: 8
        say: That's what you spent. What is left in your hand?
    - prompt: A ball ₹10 and a whistle ₹6. Total?
      target: 16
      mistakes:
      - when:
          v: 4
        say: 'That takes away. Buying both adds: 10 + 6.'
  items:
  - prompt: A pencil costs 5 rupees and an eraser 3 rupees. Together?
    answer: '8'
    check: 5 + 3
    difficulty: 1
    hints:
    - 5 + 3.
    - Count on.
    solution: 5 + 3 = 8 rupees.
    mistakes:
      '2': c1_count_once
  - prompt: You have 10 rupees and spend 8. How much is left?
    answer: '2'
    check: 10 - 8
    difficulty: 2
    hints:
    - 10 − 8.
    - Count on from 8 to 10.
    solution: 10 − 8 = 2 rupees.
    mistakes:
      '18': c1_count_once
  - prompt: You have 5 rupees. Can you buy a 7-rupee toy?
    options:
    - no, 5 is less than 7
    - yes, 5 is more than 7
    - yes, they are the same
    answer: no, 5 is less than 7
    difficulty: 1
    hints:
    - Is 5 enough?
    - Compare 5 and 7.
    solution: 5 is less than 7, so no.
    mistakes: {"yes, 5 is more than 7": "m1_enough_money"}
  - prompt: A toffee costs 1 rupee. How much do 4 toffees cost?
    answer: '4'
    check: 4*1
    difficulty: 1
    hints:
    - 1 + 1 + 1 + 1.
    - 1 rupee each.
    solution: 4 rupees.
    mistakes:
      '1': c1_count_once
  - prompt: A balloon costs 2 rupees. You pay with 5. Change?
    answer: '3'
    check: 5 - 2
    difficulty: 2
    hints:
    - 5 − 2.
    - Count on from 2 to 5.
    solution: 5 − 2 = 3 rupees.
    mistakes:
      '7': c1_count_once
  - prompt: A notebook costs 10 rupees and a pen 5 rupees. Together?
    answer: '15'
    check: 10 + 5
    difficulty: 2
    hints:
    - 10 + 5.
    - Count on.
    solution: 10 + 5 = 15 rupees.
    mistakes:
      '5': c1_count_once
