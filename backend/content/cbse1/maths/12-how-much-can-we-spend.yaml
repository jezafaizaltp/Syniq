# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 12. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 12
title: How Much Can We Spend
tips:
  m1_enough_money: "Count up: is 5 before or after 7?"
  m1_most_coin: "Look at the number printed on each coin or note. Which number is biggest?"
  c1m12_value: Look at the number on each coin and compare them.
  c1m12_enough: Compare the money you have with the price. Which number is bigger?
  c1m12_coin: Start with the biggest coin, then count on the others.
  c1m12_buy: 'Read again: are we adding prices, or finding what is left after paying?'

concepts:
- code: cbse1m.spend.coins
  title: Coins and notes
  notes: |
    Recognising 1, 2, 5 and 10 rupee coins and 10 and 20 rupee notes; counting small amounts.
  explanations:
    text: We buy things with rupees. There are coins of 1, 2, 5 and 10 rupees, and notes of 10 and 20 rupees. Two 5-rupee coins make 10 rupees.
    visual: Draw a 5-rupee coin, a 2-rupee coin and a 1-rupee coin, and write 5 + 2 + 1 = 8 rupees.
    step_by_step: 'Step 1: Look at the number on each coin. Step 2: Add them up. Step 3: Say the total in rupees.'
    real_world: At a small shop a toffee may cost 1 rupee.
  picture:
    kind: bars
    bars:
    - label: ₹1
      value: 1
    - label: ₹2
      value: 2
    - label: ₹5
      value: 5
    - label: ₹10
      value: 10
    alt: 'Coins: 1 rupee, 2 rupees, 5 rupees, 10 rupees.'
    unit: rupees
  activity:
    type: sort
    prompt: How many rupees?
    bins:
    - 5 rupees
    - 10 rupees
    - 20 rupees
    items:
    - label: Two ₹5 coins
      bin: 10 rupees
      clue: Count 5, then 5 more.
      why: 5 + 5 = 10.
    - label: One ₹5 coin
      bin: 5 rupees
      clue: Read the number on the coin.
      why: One coin, but it says 5.
    - label: Two ₹10 notes
      bin: 20 rupees
      clue: 10 and 10 more.
      why: 10 + 10 = 20.
    - label: One ₹2 coin and three ₹1 coins
      bin: 5 rupees
      clue: Start at 2, count on 3.
      why: 2, 3, 4, 5.
    - label: One ₹20 note
      bin: 20 rupees
      clue: One note, but read the number.
      why: It says 20.
    - label: Five ₹2 coins
      bin: 10 rupees
      clue: 'Count in twos: 2, 4 ...'
      why: 2, 4, 6, 8, 10.
  lesson:
    - teach: 'Indian money is in rupees (₹). Coins: ₹1, ₹2, ₹5, ₹10. Notes: ₹10, ₹20, ₹50 and more. A ₹10 coin and a ₹10 note are worth the same.'
      picture:
        kind: compare
        columns:
        - title: coins
          points:
          - ₹1
          - ₹2
          - ₹5
          - ₹10
        - title: notes
          points:
          - ₹10
          - ₹20
          - ₹50
        alt: Indian coins and notes.
      check:
        prompt: 'Which is worth more: a ₹5 coin or a ₹2 coin?'
        options:
        - ₹5 coin
        - ₹2 coin
        - the same
        answer: ₹5 coin
        why: 5 is more than 2.
      ways:
      - style: step_by_step
        teach: 'Sort the coins. Step 1: Empty a coin box onto a cloth. Step 2: Make one pile for each coin: ₹1, ₹2, ₹5 and ₹10. Step 3: Read the number on each coin. Step 4: Line up the piles from the least to the most.'
      - style: real_world
        teach: A ₹10 coin and a ₹10 note buy exactly the same things in a shop, even though they look different.
    - teach: 'To count money, start with the biggest coin and count on. ₹5 + ₹2 + ₹1: start at 5, then 7, then 8. So ₹8.'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 5
          label: ₹5
        - at: 7
          label: +₹2
        - at: 8
          label: +₹1
        jumps:
        - from: 0
          to: 5
        - from: 5
          to: 7
        - from: 7
          to: 8
        alt: Counting ₹5, then ₹2, then ₹1 makes ₹8.
      check:
        prompt: '₹5 and ₹5 make:'
        options:
        - ₹10
        - ₹5
        - ₹55
        answer: ₹10
        why: 5 + 5 = 10.
      ways:
      - style: step_by_step
        teach: 'Count ₹10, ₹2 and ₹2. Step 1: Start with the biggest coin: 10. Step 2: Count on 2: 12. Step 3: Count on 2 more: 14. Step 4: That is ₹14.'
      - style: real_world
        teach: Shopkeepers count money quickly by starting with the biggest coin or note and counting on the smaller ones.
    - teach: 'The same amount can be made in different ways: ₹10 is one ₹10 coin, or two ₹5 coins, or five ₹2 coins, or ten ₹1 coins.'
      check:
        prompt: How many ₹5 coins make ₹10?
        options:
        - '2'
        - '5'
        - '10'
        answer: '2'
        why: 5 + 5 = 10.
      ways:
      - style: visual
        teach: Three different ways to make the same amount, ₹6.
        picture:
          kind: compare
          columns:
          - title: Way 1
            points:
            - ₹5 + ₹1
          - title: Way 2
            points:
            - ₹2 + ₹2 + ₹2
          - title: Way 3
            points:
            - six ₹1 coins
          alt: ₹6 can be made with ₹5 and ₹1, or with three ₹2 coins, or with six ₹1 coins.
      - style: real_world
        teach: 'If a shopkeeper has no ₹5 coin, they can give two ₹2 coins and a ₹1 coin instead: still ₹5.'
  items:
  - prompt: Two 5-rupee coins make how many rupees?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - Count on.
    solution: 5 + 5 = 10 rupees.
    mistakes:
      '2': c1_count_once
  - prompt: 'A 2-rupee coin and a 1-rupee coin make:'
    answer: '3'
    check: 2 + 1
    difficulty: 1
    hints:
    - 2 + 1.
    - Count on.
    solution: 2 + 1 = 3 rupees.
    mistakes:
      '2': c1_count_once
  - prompt: 'Three 1-rupee coins make:'
    answer: '3'
    check: 3*1
    difficulty: 1
    hints:
    - 1 + 1 + 1.
    - Count the coins.
    solution: 3 rupees.
    mistakes:
      '1': c1_count_once
  - prompt: Which coin is worth the most?
    options:
    - 10 rupees
    - 5 rupees
    - 2 rupees
    - 1 rupee
    answer: 10 rupees
    difficulty: 1
    hints:
    - Biggest number.
    - '10.'
    solution: 10 rupees is the most.
    mistakes: {"5 rupees": "m1_most_coin"}
  - prompt: 'A 5-rupee coin and a 2-rupee coin make:'
    answer: '7'
    check: 5 + 2
    difficulty: 2
    hints:
    - 5 + 2.
    - Count on from 5.
    solution: 5 + 2 = 7 rupees.
    mistakes:
      '6': c1_count_once
  - prompt: How many 2-rupee coins make 10 rupees?
    answer: '5'
    check: 10 // 2
    difficulty: 2
    hints:
    - 2, 4, 6, 8, 10.
    - Count the jumps.
    solution: 5 coins.
    mistakes:
      '2': c1_count_once
      '4': c1_count_once
  - prompt: 'A ₹2 coin and a ₹2 coin make:'
    answer: '4'
    check: 2+2
    difficulty: 1
    hints:
    - Start at 2.
    - Count on 2.
    solution: 'Step 1: 2 + 2. Step 2: ₹4.'
    mistakes:
      '2': c1m12_coin
      '22': c1m12_coin
  - prompt: 'A ₹10 coin and a ₹1 coin make:'
    answer: '11'
    check: 10+1
    difficulty: 1
    hints:
    - Start at 10.
    - One more.
    solution: 'Step 1: 10 + 1. Step 2: ₹11.'
    mistakes:
      '10': c1m12_coin
      '101': c1m12_coin
  - prompt: Which coin is worth the least?
    options:
    - ₹1
    - ₹5
    - ₹10
    answer: ₹1
    difficulty: 1
    hints:
    - Least means smallest amount.
    - Compare 1, 5 and 10.
    solution: 'Step 1: 1 is less than 5 and 10. Step 2: ₹1 is worth the least.'
    mistakes:
      ₹5: c1m12_value
      ₹10: c1m12_value
  - prompt: 'Four ₹1 coins make:'
    answer: '4'
    check: 1+1+1+1
    difficulty: 1
    hints:
    - Count each coin.
    - 1, 2, 3, ...
    solution: 'Step 1: 1, 2, 3, 4. Step 2: ₹4.'
    mistakes:
      '1': c1m12_coin
      '5': c1m12_coin
  - prompt: 'A ₹5 coin, a ₹2 coin and a ₹1 coin make:'
    answer: '8'
    check: 5+2+1
    difficulty: 2
    hints:
    - Start with ₹5.
    - Then add 2, then 1.
    solution: 'Step 1: 5 + 2 = 7. Step 2: 7 + 1 = ₹8.'
    mistakes:
      '7': c1m12_coin
      '3': c1m12_coin
  - prompt: How many ₹1 coins make ₹5?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Each coin is ₹1.
    - Count up to 5.
    solution: 'Step 1: 1, 2, 3, 4, 5. Step 2: 5 coins.'
    mistakes:
      '1': c1m12_coin
      '4': c1m12_coin
  - prompt: 'A ₹10 note and a ₹5 coin make:'
    answer: '15'
    check: 10+5
    difficulty: 2
    hints:
    - Start at 10.
    - Count on 5.
    solution: 'Step 1: 10 + 5. Step 2: ₹15.'
    mistakes:
      '5': c1m12_coin
      '105': c1m12_coin
  - prompt: Which makes ₹10?
    options:
    - ₹5 + ₹5
    - ₹5 + ₹2
    - ₹2 + ₹2
    answer: ₹5 + ₹5
    difficulty: 2
    hints:
    - Add each pair.
    - Which pair reaches 10?
    solution: 'Step 1: 5 + 2 = 7; 2 + 2 = 4. Step 2: 5 + 5 = 10.'
    mistakes:
      ₹5 + ₹2: c1m12_coin
      ₹2 + ₹2: c1m12_coin
  - prompt: 'Two ₹10 notes and a ₹2 coin make:'
    answer: '22'
    check: 10+10+2
    difficulty: 3
    hints:
    - Two ₹10 notes are ₹20.
    - Then add ₹2.
    solution: 'Step 1: 10 + 10 = 20. Step 2: 20 + 2 = ₹22.'
    mistakes:
      '12': c1m12_coin
      '14': c1m12_coin
  - prompt: 'Case: Anu has two ₹5 coins. Ben has one ₹10 coin. Ben says, ''I have more money, because my coin is bigger.'' Is Ben right?'
    options:
    - No, both have ₹10
    - Yes, Ben has more
    - No, Anu has more
    answer: No, both have ₹10
    hints:
    - How much do Anu's two coins make together?
    - Compare the amounts, not the size of the coins.
    solution: Two ₹5 coins make ₹10, and Ben's coin is ₹10. They have the same amount.
    mistakes:
      Yes, Ben has more: c1m12_value
      No, Anu has more: c1m12_value
    exam: case
    difficulty: 2
  - prompt: 'Situation: A toy costs ₹7. You have one ₹5 coin, one ₹2 coin and one ₹1 coin. Which coins make exactly ₹7?'
    options:
    - ₹5 + ₹2
    - ₹5 + ₹1
    - ₹2 + ₹1
    answer: ₹5 + ₹2
    hints:
    - Start with the biggest coin.
    - Which coin do you count on to reach 7?
    solution: 'Start at 5 and count on 2: 6, 7. So ₹5 and ₹2 make exactly ₹7.'
    mistakes:
      ₹5 + ₹1: c1m12_coin
      ₹2 + ₹1: c1m12_coin
    exam: competency
    difficulty: 2
- code: cbse1m.spend.buy
  title: Buying and how much is left
  after:
  - cbse1m.spend.coins
  notes: |
    Buying small things: adding two prices, checking if we have enough, what is left after buying.
  explanations:
    text: If a pencil costs 5 rupees and an eraser 3 rupees, together they cost 8 rupees. If you have 10 rupees, you have 2 rupees left.
    visual: Draw a pencil with a ₹5 tag and an eraser with a ₹3 tag, and a 10-rupee note.
    step_by_step: 'Step 1: Add the prices. Step 2: Compare with the money you have. Step 3: Take away to find what is left.'
    real_world: Children buy small things at the school stationery shop.
  picture:
    kind: flow
    steps:
    - Have ₹10
    - Buy for ₹8
    - ₹10 − ₹8
    - ₹2 left
    alt: You have 10 rupees, buy things for 8 rupees, and 2 rupees are left.
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Add the prices, or find what is left.
    goals:
    - prompt: A pencil ₹5 and an eraser ₹3. Total?
      target: 8
      mistakes:
      - when:
          v: 2
        say: 'That takes away. Buying both means put the prices together: 5 + 3.'
      - when:
          v: 5
        say: That's only the pencil. Add the eraser too.
    - prompt: You have ₹10. You spend ₹8. What is left?
      target: 2
      mistakes:
      - when:
          v: 18
        say: Spending makes your money go down, not up. 10 take away 8.
      - when:
          v: 8
        say: That's what you spent. What is left in your hand?
    - prompt: A ball ₹10 and a whistle ₹6. Total?
      target: 16
      mistakes:
      - when:
          v: 4
        say: 'That takes away. Buying both adds: 10 + 6.'
  lesson:
    - teach: When we buy two things, we add the prices. A pencil ₹5 and an eraser ₹3 cost ₹5 + ₹3 = ₹8 together.
      check:
        prompt: 'A ball costs ₹4 and a balloon ₹2. Together they cost:'
        options:
        - ₹6
        - ₹2
        - ₹42
        answer: ₹6
        why: 4 + 2 = 6.
      ways:
      - style: visual
        teach: Adding the prices of two things to find what they cost together.
        picture:
          kind: compare
          columns:
          - title: Things
            points:
            - Ball ₹4 and bat ₹5
            - Ribbon ₹2 and clip ₹1
          - title: Together
            points:
            - ₹9
            - ₹3
          alt: A ₹4 ball and a ₹5 bat cost ₹9 together. A ₹2 ribbon and a ₹1 clip cost ₹3 together.
      - style: real_world
        teach: At a vegetable stall, the seller adds the price of each vegetable you choose to find what you must pay.
    - teach: To see if we have enough money, compare. ₹7 is enough for a ₹6 toy, because 7 is more than 6. ₹4 is not enough for a ₹6 toy.
      check:
        prompt: You have ₹8. Is it enough for a ₹5 book?
        options:
        - yes, 8 is more than 5
        - no, 8 is less than 5
        - only if it is free
        answer: yes, 8 is more than 5
        why: 8 is more than 5, so there is enough.
      ways:
      - style: visual
        teach: Times when there is enough money, and times when there is not.
        picture:
          kind: compare
          columns:
          - title: Enough
            points:
            - ₹8 for a ₹5 cap
            - ₹10 for a ₹9 game
          - title: Not enough
            points:
            - ₹2 for a ₹4 pen
            - ₹6 for an ₹8 bag
          alt: ₹8 is enough for a ₹5 cap and ₹10 is enough for a ₹9 game. ₹2 is not enough for a ₹4 pen, and ₹6 is not enough for an ₹8 bag.
      - style: real_world
        teach: Before going to a shop, it helps to check how much money you have, so you know what you can buy.
    - teach: 'After paying, find what is left by taking away. You have ₹10 and spend ₹6: 10 − 6 = ₹4 left. If you pay more than the price, the shopkeeper gives change.'
      picture:
        kind: flow
        steps:
        - you have ₹10
        - you pay ₹6
        - ₹4 is left
        alt: ₹10 minus ₹6 spent leaves ₹4.
      check:
        prompt: A toffee costs ₹2. You pay ₹5. How much change?
        options:
        - ₹3
        - ₹7
        - ₹2
        answer: ₹3
        why: 5 − 2 = 3.
      ways:
      - style: step_by_step
        teach: 'Find the change. Step 1: A sweet costs ₹1 and you pay with ₹5. Step 2: Count on from 1 to 5: 2, 3, 4, 5. Step 3: That is 4 counts, so the change is ₹4.'
      - style: real_world
        teach: A bus conductor gives change when you pay more than the price of the ticket.
  items:
  - prompt: A pencil costs 5 rupees and an eraser 3 rupees. Together?
    answer: '8'
    check: 5 + 3
    difficulty: 1
    hints:
    - 5 + 3.
    - Count on.
    solution: 5 + 3 = 8 rupees.
    mistakes:
      '2': c1_count_once
  - prompt: You have 10 rupees and spend 8. How much is left?
    answer: '2'
    check: 10 - 8
    difficulty: 2
    hints:
    - 10 − 8.
    - Count on from 8 to 10.
    solution: 10 − 8 = 2 rupees.
    mistakes:
      '18': c1_count_once
  - prompt: You have 5 rupees. Can you buy a 7-rupee toy?
    options:
    - no, 5 is less than 7
    - yes, 5 is more than 7
    - yes, they are the same
    answer: no, 5 is less than 7
    difficulty: 1
    hints:
    - Is 5 enough?
    - Compare 5 and 7.
    solution: 5 is less than 7, so no.
    mistakes: {"yes, 5 is more than 7": "m1_enough_money"}
  - prompt: A toffee costs 1 rupee. How much do 4 toffees cost?
    answer: '4'
    check: 4*1
    difficulty: 1
    hints:
    - 1 + 1 + 1 + 1.
    - 1 rupee each.
    solution: 4 rupees.
    mistakes:
      '1': c1_count_once
  - prompt: A balloon costs 2 rupees. You pay with 5. Change?
    answer: '3'
    check: 5 - 2
    difficulty: 2
    hints:
    - 5 − 2.
    - Count on from 2 to 5.
    solution: 5 − 2 = 3 rupees.
    mistakes:
      '7': c1_count_once
  - prompt: A notebook costs 10 rupees and a pen 5 rupees. Together?
    answer: '15'
    check: 10 + 5
    difficulty: 2
    hints:
    - 10 + 5.
    - Count on.
    solution: 10 + 5 = 15 rupees.
    mistakes:
      '5': c1_count_once
  - prompt: A notebook costs ₹6 and a pencil ₹2. Together?
    answer: '8'
    check: 6+2
    difficulty: 1
    hints:
    - Buying both means adding.
    - Start at 6, count on 2.
    solution: 'Step 1: 6 + 2. Step 2: ₹8.'
    mistakes:
      '4': c1m12_buy
      '62': c1m12_buy
  - prompt: You have ₹9 and spend ₹4. How much is left?
    answer: '5'
    check: 9-4
    difficulty: 1
    hints:
    - Spending takes away.
    - 9 − 4.
    solution: 'Step 1: 9 − 4. Step 2: ₹5 left.'
    mistakes:
      '13': c1m12_buy
      '4': c1m12_buy
  - prompt: You have ₹3. Can you buy a ₹5 kite?
    options:
    - no, 3 is less than 5
    - yes, 3 is more than 5
    - yes, always
    answer: no, 3 is less than 5
    difficulty: 1
    hints:
    - Compare 3 and 5.
    - Do you have enough?
    solution: 'Step 1: 3 is less than 5. Step 2: Not enough money.'
    mistakes:
      yes, 3 is more than 5: c1m12_enough
      yes, always: c1m12_enough
  - prompt: A banana costs ₹2. How much do 3 bananas cost?
    answer: '6'
    check: 2+2+2
    difficulty: 1
    hints:
    - ₹2 for each banana.
    - 2, 4, ...
    solution: 'Step 1: 2 + 2 + 2. Step 2: ₹6.'
    mistakes:
      '5': c1m12_buy
      '3': c1m12_buy
  - prompt: A pen costs ₹7. You pay ₹10. Change?
    answer: '3'
    check: 10-7
    difficulty: 2
    hints:
    - Change is what comes back.
    - 10 − 7.
    solution: 'Step 1: 10 − 7. Step 2: ₹3 change.'
    mistakes:
      '17': c1m12_buy
      '7': c1m12_buy
  - prompt: You have ₹10. You buy a ₹4 ball and a ₹3 balloon. How much is left?
    answer: '3'
    check: 10-4-3
    difficulty: 3
    hints:
    - First add the prices.
    - Then take that away from 10.
    solution: 'Step 1: 4 + 3 = 7. Step 2: 10 − 7 = ₹3 left.'
    mistakes:
      '7': c1m12_buy
      '17': c1m12_buy
  - prompt: 'Which two things can you buy with exactly ₹10: toy car ₹6, ball ₹4, kite ₹5?'
    options:
    - toy car and ball
    - toy car and kite
    - ball and kite
    answer: toy car and ball
    difficulty: 3
    hints:
    - Add each pair.
    - Which pair makes exactly 10?
    solution: 'Step 1: 6 + 5 = 11, 4 + 5 = 9. Step 2: 6 + 4 = 10.'
    mistakes:
      toy car and kite: c1m12_buy
      ball and kite: c1m12_buy
  - prompt: An eraser costs ₹3. How much do 2 erasers cost?
    answer: '6'
    check: 3+3
    difficulty: 2
    hints:
    - ₹3 each.
    - 3 and 3.
    solution: 'Step 1: 3 + 3. Step 2: ₹6.'
    mistakes:
      '5': c1m12_buy
      '3': c1m12_buy
  - prompt: You have ₹5. A ruler costs ₹5. How much is left after buying it?
    answer: '0'
    check: 5-5
    difficulty: 2
    hints:
    - You spend all your money.
    - 5 − 5.
    solution: 'Step 1: 5 − 5. Step 2: ₹0 left.'
    mistakes:
      '10': c1m12_buy
      '5': c1m12_buy
  - prompt: 'Case: Meera has ₹10. Meera wants a ₹6 storybook and a ₹5 box of crayons, and says, ''I have enough money.'' Is Meera right?'
    options:
    - "No, they cost ₹11, more than ₹10"
    - "Yes, ₹10 is just enough for both"
    - "Yes, and there will be ₹1 left over"
    answer: No, they cost ₹11, more than ₹10
    hints:
    - Add the two prices first.
    - Is the total more or less than ₹10?
    solution: ₹6 and ₹5 make ₹11. ₹11 is more than ₹10, so Meera does not have enough.
    mistakes:
      "Yes, ₹10 is just enough for both": c1m12_enough
      "Yes, and there will be ₹1 left over": c1m12_enough
    exam: case
    difficulty: 2
  - prompt: 'Situation: A toy costs ₹15. You pay with a ₹20 note. How much change should you get?'
    options:
    - ₹5
    - ₹15
    - ₹35
    answer: ₹5
    hints:
    - Are you adding prices, or finding what is left after paying?
