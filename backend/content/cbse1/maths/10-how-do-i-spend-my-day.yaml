# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 10
title: How do I Spend my Day
concepts:
- code: cbse1m.day.parts
  title: Parts of the day
  notes: |
    Morning, afternoon, evening, night; what we do at each time; before and after; daily routine in order.
  explanations:
    text: 'A day has parts: morning, afternoon, evening and night. In the morning we wake up and go to school; at night we sleep.'
    visual: 'Draw four boxes: a rising sun (morning), a high sun (afternoon), a setting sun (evening), and a moon (night).'
    step_by_step: 'Step 1: Think of the sun. Step 2: Rising is morning, high is afternoon, setting is evening, moon is night.'
    real_world: We brush our teeth in the morning and before bed at night.
  picture:
    kind: flow
    steps:
    - morning
    - afternoon
    - evening
    - night
    alt: 'The parts of a day in order: morning, afternoon, evening, night.'
  items:
  - prompt: 'We wake up in the:'
    options:
    - morning
    - night
    - evening
    answer: morning
    difficulty: 1
    hints:
    - The sun rises.
    - Start of the day.
    solution: We wake up in the morning.
  - prompt: 'We sleep at:'
    options:
    - night
    - morning
    - afternoon
    answer: night
    difficulty: 1
    hints:
    - The moon is out.
    - Dark.
    solution: We sleep at night.
  - prompt: Which comes after morning?
    options:
    - afternoon
    - night
    - evening
    answer: afternoon
    difficulty: 1
    hints:
    - Lunch time.
    - Sun high up.
    solution: Afternoon comes after morning.
  - prompt: Which comes before night?
    options:
    - evening
    - morning
    - afternoon
    answer: evening
    difficulty: 2
    hints:
    - The sun sets.
    - Play time outside.
    solution: Evening comes before night.
  - prompt: 'How many parts of the day: morning, afternoon, evening, night?'
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count them.
    - One, two, three, four.
    solution: 4 parts.
    mistakes:
      '3': c1_count_once
  - prompt: What do we do first?
    options:
    - brush our teeth
    - go to bed
    - eat dinner
    answer: brush our teeth
    difficulty: 2
    hints:
    - Morning routine.
    - After waking up.
    solution: We brush our teeth first in the morning.
- code: cbse1m.day.week
  title: Days of the week
  after:
  - cbse1m.day.parts
  notes: |
    Seven days of the week in order; today, yesterday, tomorrow; which days are school days.
  explanations:
    text: 'A week has 7 days: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday and Saturday. Then it starts again.'
    visual: Draw 7 boxes in a row with the day names, and colour Sunday.
    step_by_step: 'Step 1: Say the days in order. Step 2: Find today. Step 3: The day after is tomorrow; the day before is yesterday.'
    real_world: Many families visit grandparents on Sunday.
  picture:
    kind: flow
    steps:
    - Sun
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    alt: 'The seven days in order: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday.'
  items:
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: 7 days.
    mistakes:
      '5': c1_count_once
      '6': c1_count_once
  - prompt: Which day comes after Sunday?
    options:
    - Monday
    - Saturday
    - Friday
    answer: Monday
    difficulty: 1
    hints:
    - Start of the school week.
    - Sunday, ...
    solution: Monday comes after Sunday.
  - prompt: 'Today is Tuesday. Tomorrow is:'
    options:
    - Wednesday
    - Monday
    - Thursday
    answer: Wednesday
    difficulty: 2
    hints:
    - One day forward.
    - Tuesday, ...
    solution: Tomorrow is Wednesday.
  - prompt: 'Today is Friday. Yesterday was:'
    options:
    - Thursday
    - Saturday
    - Sunday
    answer: Thursday
    difficulty: 2
    hints:
    - One day back.
    - '..., Friday.'
    solution: Yesterday was Thursday.
  - prompt: Which day comes before Monday?
    options:
    - Sunday
    - Tuesday
    - Saturday
    answer: Sunday
    difficulty: 1
    hints:
    - The holiday.
    - '..., Monday.'
    solution: Sunday comes before Monday.
  - prompt: You go to school Monday to Friday. How many days is that?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Mon, Tue, Wed, Thu, Fri.
    - Count them.
    solution: 5 days.
    mistakes:
      '7': c1_count_once
      '4': c1_count_once
