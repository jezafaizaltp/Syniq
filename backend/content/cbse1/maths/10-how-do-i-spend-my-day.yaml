# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 10. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 10
title: How do I Spend my Day
tips:
  m1_after_morning: "Morning, then lunch time, then evening, then night."
  m1_after_sunday: "Saturday comes before Sunday. After Sunday, the school week starts."
  m1_before_monday: "Tuesday comes after Monday. Which day is just before?"
  m1_before_night: "The sun sets, then it gets dark."
  m1_first_thing: "Which do you do when you just wake up?"
  m1_sleep: "We go to bed when it is dark."
  m1_tomorrow: "Tomorrow is the next day. Say the days of the week in order from today."
  m1_wake: "The sun comes up and we get out of bed."
  m1_yesterday: "Yesterday is the day before. Saturday comes after Friday."
  c1m10_part: Think of your own day from waking up to going to bed. When does this happen?
  c1m10_week: "Say the seven days in order, from the start of the week. Which one is next to it?"

concepts:
- code: cbse1m.day.parts
  title: Parts of the day
  notes: |
    Morning, afternoon, evening, night; what we do at each time; before and after; daily routine in order.
  explanations:
    text: 'A day has parts: morning, afternoon, evening and night. In the morning we wake up and go to school; at night we sleep.'
    visual: 'Draw four boxes: a rising sun (morning), a high sun (afternoon), a setting sun (evening), and a moon (night).'
    step_by_step: 'Step 1: Think of the sun. Step 2: Rising is morning, high is afternoon, setting is evening, moon is night.'
    real_world: We brush our teeth in the morning and before bed at night.
  picture:
    kind: flow
    steps:
    - morning
    - afternoon
    - evening
    - night
    alt: 'The parts of a day in order: morning, afternoon, evening, night.'
  activity:
    type: order
    prompt: Put the parts of the day in order.
    steps:
    - 'Morning: wake up and go to school'
    - 'Afternoon: eat lunch'
    - 'Evening: play outside as the sun goes down'
    - 'Night: sleep'
    reasons:
      'Afternoon: eat lunch': Lunch comes after the morning, when the sun is high.
      'Evening: play outside as the sun goes down': Evening is after the afternoon.
      'Night: sleep': Night is dark and comes last.
  lesson:
    - teach: 'A day has parts: morning (the sun comes up, we wake up), afternoon (lunch time), evening (the sun goes down, we play), night (dark, we sleep).'
      picture:
        kind: flow
        steps:
        - morning
        - afternoon
        - evening
        - night
        alt: Parts of the day in order.
      check:
        prompt: 'We eat lunch in the:'
        options:
        - afternoon
        - night
        - early morning
        answer: afternoon
        why: Lunch comes in the middle of the day, the afternoon.
      ways:
      - style: step_by_step
        teach: 'Watch the sky through the day. Step 1: Morning: the sun is low and the air is cool. Step 2: Afternoon: the sun is high and it is hot. Step 3: Evening: the sun goes down and the sky turns orange. Step 4: Night: it is dark.'
      - style: real_world
        teach: Birds sing loudly early in the morning and fly back to their nests in the evening.
    - teach: 'We do things in order every day: wake up, brush teeth, bath, breakfast, school, lunch, play, dinner, sleep.'
      picture:
        kind: flow
        steps:
        - wake up
        - brush teeth
        - breakfast
        - school
        - play
        - dinner
        - sleep
        alt: A daily routine in order.
      check:
        prompt: What do we do just before breakfast?
        options:
        - brush our teeth
        - go to sleep
        - eat dinner
        answer: brush our teeth
        why: We brush first, then eat breakfast.
      ways:
      - style: step_by_step
        teach: 'Draw your day as a strip. Step 1: Fold a paper into 4 boxes. Step 2: In the first box, draw something you do in the morning. Step 3: Draw the afternoon and evening in the next two boxes. Step 4: In the last box, draw yourself asleep.'
      - style: real_world
        teach: 'A school timetable shows the order of the day: assembly, lessons, lunch, more lessons, and then home time.'
    - teach: 'Before and after: breakfast comes before lunch. Dinner comes after lunch. Evening comes before night.'
      check:
        prompt: Which comes after evening?
        options:
        - night
        - morning
        - afternoon
        answer: night
        why: Morning, afternoon, evening, night.
      ways:
      - style: visual
        teach: The meals of a day, in order from first to last.
        picture:
          kind: flow
          steps:
          - Breakfast
          - Lunch
          - Evening snack
          - Dinner
          alt: First breakfast, then lunch, then an evening snack, and last dinner.
      - style: real_world
        teach: Shops open in the morning and close at night. Before closing, the shopkeeper counts the money from the whole day.
  items:
  - prompt: 'We wake up in the:'
    options:
    - morning
    - night
    - evening
    answer: morning
    difficulty: 1
    hints:
    - The sun rises.
    - Start of the day.
    solution: We wake up in the morning.
    mistakes: {"night": "m1_wake"}
  - prompt: 'We sleep at:'
    options:
    - night
    - morning
    - afternoon
    answer: night
    difficulty: 1
    hints:
    - The moon is out.
    - Dark.
    solution: We sleep at night.
    mistakes: {"morning": "m1_sleep"}
  - prompt: Which comes after morning?
    options:
    - afternoon
    - night
    - evening
    answer: afternoon
    difficulty: 1
    hints:
    - Lunch time.
    - Sun high up.
    solution: Afternoon comes after morning.
    mistakes: {"night": "m1_after_morning"}
  - prompt: Which comes before night?
    options:
    - evening
    - morning
    - afternoon
    answer: evening
    difficulty: 2
    hints:
    - The sun sets.
    - Play time outside.
    solution: Evening comes before night.
    mistakes: {"morning": "m1_before_night"}
  - prompt: 'How many parts of the day: morning, afternoon, evening, night?'
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count them.
    - One, two, three, four.
    solution: 4 parts.
    mistakes:
      '3': c1_count_once
  - prompt: What do we do first?
    options:
    - brush our teeth
    - go to bed
    - eat dinner
    answer: brush our teeth
    difficulty: 2
    hints:
    - Morning routine.
    - After waking up.
    solution: We brush our teeth first in the morning.
    mistakes: {"go to bed": "m1_first_thing"}
  - prompt: 'The sun comes up in the:'
    options:
    - morning
    - night
    - evening
    answer: morning
    difficulty: 1
    hints:
    - It is the start of the day.
    - When we wake up.
    solution: 'Step 1: The day starts with sunrise. Step 2: That is morning.'
    mistakes:
      night: c1m10_part
      evening: c1m10_part
  - prompt: 'We see the moon and stars at:'
    options:
    - night
    - afternoon
    - morning
    answer: night
    difficulty: 1
    hints:
    - The sky is dark.
    - We go to bed.
    solution: 'Step 1: Moon and stars show in the dark. Step 2: That is night.'
    mistakes:
      afternoon: c1m10_part
      morning: c1m10_part
  - prompt: Which comes before afternoon?
    options:
    - morning
    - evening
    - night
    answer: morning
    difficulty: 1
    hints:
    - Say the parts in order.
    - The start of the day.
    solution: 'Step 1: Morning, afternoon, evening, night. Step 2: Morning is before afternoon.'
    mistakes:
      evening: c1m10_part
      night: c1m10_part
  - prompt: 'We eat dinner in the:'
    options:
    - night
    - morning
    - early afternoon
    answer: night
    difficulty: 1
    hints:
    - The last meal of the day.
    - After the sun goes down.
    solution: 'Step 1: Dinner is the last meal. Step 2: We eat it at night.'
    mistakes:
      morning: c1m10_part
      early afternoon: c1m10_part
  - prompt: Which comes last in a day?
    options:
    - going to sleep
    - breakfast
    - lunch
    answer: going to sleep
    difficulty: 1
    hints:
    - Think of the end of your day.
    - What do you do in bed?
    solution: 'Step 1: Breakfast and lunch are earlier. Step 2: We sleep last.'
    mistakes:
      breakfast: c1m10_part
      lunch: c1m10_part
  - prompt: 'Put in order: lunch, breakfast, dinner. What comes second?'
    options:
    - lunch
    - breakfast
    - dinner
    answer: lunch
    difficulty: 2
    hints:
    - Breakfast is first.
    - Dinner is last.
    solution: 'Step 1: Breakfast, lunch, dinner. Step 2: Lunch is second.'
    mistakes:
      breakfast: c1m10_part
      dinner: c1m10_part
  - prompt: 'How many meals: breakfast, lunch and dinner?'
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Count the meal names.
    - One for each.
    solution: 'Step 1: breakfast 1, lunch 2, dinner 3. Step 2: 3 meals.'
    mistakes:
      '2': c1m10_part
      '4': c1m10_part
  - prompt: Is it a good idea to play outside at midnight?
    options:
    - no, it is time to sleep
    - yes, it is daytime
    - yes, it is lunch time
    answer: no, it is time to sleep
    difficulty: 2
    hints:
    - Midnight is in the middle of the night.
    - What do we do at night?
    solution: 'Step 1: Midnight is night. Step 2: Night is for sleeping.'
    mistakes:
      yes, it is daytime: c1m10_part
      yes, it is lunch time: c1m10_part
  - prompt: School starts in the morning. Play time is in the evening. What comes between them?
    options:
    - afternoon
    - night
    - early morning
    answer: afternoon
    difficulty: 3
    hints:
    - Say the parts of the day.
    - Morning, ..., evening.
    solution: 'Step 1: Morning, afternoon, evening. Step 2: Afternoon is between.'
    mistakes:
      night: c1m10_part
      early morning: c1m10_part
  - prompt: 'Case: Ammu has just had lunch at school. Ammu''s mother says, ''After your evening snack, we will go to the park.'' In what order do these happen?'
    options:
    - "Lunch, evening snack, then the park"
    - "The park first, and then lunch"
    - "Dinner first, and then the park"
    answer: Lunch, evening snack, then the park
    hints:
    - What has Ammu just finished?
    - What comes after it, and what comes after that?
    solution: Lunch is over. The evening snack comes next, and the park trip comes after the snack.
    mistakes:
      "The park first, and then lunch": c1m10_part
      "Dinner first, and then the park": c1m10_part
    exam: case
    difficulty: 2
  - prompt: 'Situation: The sun is high in the sky, it is hot outside and it is lunch time. What part of the day is it?'
    options:
    - afternoon
    - morning
    - night
    answer: afternoon
    hints:
    - When do we eat lunch?
    - Is the sun just coming up, high up, or gone?
    solution: Lunch time, with the sun high in the sky, is the afternoon.
    mistakes:
      morning: c1m10_part
      night: c1m10_part
    exam: competency
    difficulty: 2
- code: cbse1m.day.week
  title: Days of the week
  after:
  - cbse1m.day.parts
  notes: |
    Seven days of the week in order; today, yesterday, tomorrow; which days are school days.
  explanations:
    text: 'A week has 7 days: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday and Saturday. Then it starts again.'
    visual: Draw 7 boxes in a row with the day names, and colour Sunday.
    step_by_step: 'Step 1: Say the days in order. Step 2: Find today. Step 3: The day after is tomorrow; the day before is yesterday.'
    real_world: Many families visit grandparents on Sunday.
  picture:
    kind: flow
    steps:
    - Sun
    - Mon
    - Tue
    - Wed
    - Thu
    - Fri
    - Sat
    alt: 'The seven days in order: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday.'
  activity:
    type: order
    prompt: Put the days of the week in order. Start with Sunday.
    steps:
    - Sunday
    - Monday
    - Tuesday
    - Wednesday
    - Thursday
    - Friday
    - Saturday
    reasons:
      Monday: Monday comes after Sunday.
      Tuesday: Tuesday comes after Monday.
      Wednesday: Wednesday comes after Tuesday.
      Thursday: Thursday comes after Wednesday.
      Friday: Friday comes after Thursday.
      Saturday: Saturday is the last day of the week.
  lesson:
    - teach: 'A week has 7 days: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday. Then Sunday comes again.'
      picture:
        kind: flow
        steps:
        - Sun
        - Mon
        - Tue
        - Wed
        - Thu
        - Fri
        - Sat
        alt: The seven days of the week in order.
      check:
        prompt: Which day comes after Wednesday?
        options:
        - Thursday
        - Tuesday
        - Friday
        answer: Thursday
        why: Wednesday, then Thursday.
      ways:
      - style: step_by_step
        teach: 'Sing the days. Step 1: Clap once as you say each day: Sunday, Monday, Tuesday and on. Step 2: Stop after Saturday. Step 3: Start again from Sunday, because the week goes round and round.'
      - style: real_world
        teach: Some families have a fixed day for things, like the market on Wednesday or visiting grandparents on Sunday.
    - teach: Today is the day it is now. Yesterday was the day before. Tomorrow is the day after. If today is Monday, yesterday was Sunday and tomorrow is Tuesday.
      check:
        prompt: 'Today is Thursday. Tomorrow is:'
        options:
        - Friday
        - Wednesday
        - Saturday
        answer: Friday
        why: 'Tomorrow is the next day: Friday.'
      ways:
      - style: visual
        teach: The seven days of the week, one after another.
        picture:
          kind: flow
          steps:
          - Sunday
          - Monday
          - Tuesday
          - Wednesday
          - Thursday
          - Friday
          - Saturday
          alt: Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, one after another.
      - style: real_world
        teach: On a wall calendar, the box just before today is yesterday, and the box just after today is tomorrow.
    - teach: After Saturday comes Sunday, and the week starts again. Many schools are open Monday to Friday; Saturday and Sunday may be holidays.
      check:
        prompt: Which day comes after Saturday?
        options:
        - Sunday
        - Friday
        - Monday
        answer: Sunday
        why: 'The week goes round: Saturday, then Sunday.'
      ways:
      - style: visual
        teach: At the end of the week, the days start again.
        picture:
          kind: flow
          steps:
          - Friday
          - Saturday
          - 'Sunday: a new week begins'
          - Monday
          alt: Friday, then Saturday, then Sunday, when a new week begins, then Monday.
      - style: real_world
        teach: A school may close for a week-long festival holiday, from one Saturday all the way to the next Saturday.
  items:
  - prompt: How many days are in a week?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Sunday to Saturday.
    - Count them.
    solution: 7 days.
    mistakes:
      '5': c1_count_once
      '6': c1_count_once
  - prompt: Which day comes after Sunday?
    options:
    - Monday
    - Saturday
    - Friday
    answer: Monday
    difficulty: 1
    hints:
    - Start of the school week.
    - Sunday, ...
    solution: Monday comes after Sunday.
    mistakes: {"Saturday": "m1_after_sunday"}
  - prompt: 'Today is Tuesday. Tomorrow is:'
    options:
    - Wednesday
    - Monday
    - Thursday
    answer: Wednesday
    difficulty: 2
    hints:
    - One day forward.
    - Tuesday, ...
    solution: Tomorrow is Wednesday.
    mistakes: {"Monday": "m1_tomorrow"}
  - prompt: 'Today is Friday. Yesterday was:'
    options:
    - Thursday
    - Saturday
    - Sunday
    answer: Thursday
    difficulty: 2
    hints:
    - One day back.
    - '..., Friday.'
    solution: Yesterday was Thursday.
    mistakes: {"Saturday": "m1_yesterday"}
  - prompt: Which day comes before Monday?
    options:
    - Sunday
    - Tuesday
    - Saturday
    answer: Sunday
    difficulty: 1
    hints:
    - The holiday.
    - '..., Monday.'
    solution: Sunday comes before Monday.
    mistakes: {"Tuesday": "m1_before_monday"}
  - prompt: You go to school Monday to Friday. How many days is that?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Mon, Tue, Wed, Thu, Fri.
    - Count them.
    solution: 5 days.
    mistakes:
      '7': c1_count_once
      '4': c1_count_once
  - prompt: Which day comes after Monday?
    options:
    - Tuesday
    - Sunday
    - Wednesday
    answer: Tuesday
    difficulty: 1
    hints:
    - Say the days from Sunday.
    - Sunday, Monday, ...
    solution: 'Step 1: Monday, then the next day. Step 2: Tuesday.'
    mistakes:
      Sunday: c1m10_week
      Wednesday: c1m10_week
  - prompt: 'Today is Sunday. Yesterday was:'
    options:
    - Saturday
    - Monday
    - Friday
    answer: Saturday
    difficulty: 1
    hints:
    - Yesterday is the day before.
    - Which day comes just before Sunday?
    solution: 'Step 1: Before Sunday comes the last day of the week. Step 2: Saturday.'
    mistakes:
      Monday: c1m10_week
      Friday: c1m10_week
  - prompt: Which day comes before Friday?
    options:
    - Thursday
    - Saturday
    - Wednesday
    answer: Thursday
    difficulty: 1
    hints:
    - Say the days in order.
    - '..., Friday.'
    solution: 'Step 1: Thursday, Friday. Step 2: Thursday is before Friday.'
    mistakes:
      Saturday: c1m10_week
      Wednesday: c1m10_week
  - prompt: Which is the first day in Sunday, Monday, Tuesday?
    options:
    - Sunday
    - Monday
    - Tuesday
    answer: Sunday
    difficulty: 1
    hints:
    - Look at the start of the list.
    - The very first one.
    solution: 'Step 1: The list starts with Sunday. Step 2: Sunday is first.'
    mistakes:
      Monday: c1m10_week
      Tuesday: c1m10_week
  - prompt: 'Today is Wednesday. Tomorrow is:'
    options:
    - Thursday
    - Tuesday
    - Friday
    answer: Thursday
    difficulty: 1
    hints:
    - Tomorrow is the next day.
    - Wednesday, ...
    solution: 'Step 1: Next day after Wednesday. Step 2: Thursday.'
    mistakes:
      Tuesday: m1_tomorrow
      Friday: m1_tomorrow
  - prompt: How many days from Monday to Wednesday, counting both?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count each day you say.
    - Monday, Tuesday, Wednesday.
    solution: 'Step 1: Monday 1, Tuesday 2, Wednesday 3. Step 2: 3 days.'
    mistakes:
      '2': c1m10_week
      '4': c1m10_week
  - prompt: A school has holidays on Saturday and Sunday. How many holidays in a week?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Count the holiday days named.
    - Saturday and Sunday.
    solution: 'Step 1: Saturday 1, Sunday 2. Step 2: 2 holidays.'
    mistakes:
      '5': c1m10_week
      '7': c1m10_week
  - prompt: Today is Friday. What day will it be in 2 days?
    options:
    - Sunday
    - Saturday
    - Monday
    answer: Sunday
    difficulty: 3
    hints:
    - Count on 2 days from Friday.
    - Friday → Saturday → ...
    solution: 'Step 1: 1 day: Saturday. Step 2: 2 days: Sunday.'
    mistakes:
      Saturday: c1m10_week
      Monday: c1m10_week
  - prompt: How many days are there in 2 weeks?
    answer: '14'
    check: 7+7
    difficulty: 3
    hints:
    - One week has 7 days.
    - 7 and 7.
    solution: 'Step 1: 7 days a week. Step 2: 7 + 7 = 14.'
    mistakes:
      '7': c1m10_week
      '9': c1m10_week
  - prompt: 'Case: Today is Thursday. A cousin says, ''I will visit you the day after tomorrow.'' On which day will the cousin come?'
    options:
    - Saturday
    - Friday
    - Sunday
    answer: Saturday
    hints:
    - Which day is tomorrow?
    - Which day comes after that one?
    solution: Tomorrow is Friday, and the day after tomorrow is Saturday.
    mistakes:
      Friday: c1m10_week
      Sunday: c1m10_week
    exam: case
    difficulty: 2
  - prompt: 'Situation: Today is Monday. Your library book must go back in 3 days. On which day must it go back?'
    options:
    - Thursday
    - Wednesday
    - Friday
    answer: Thursday
    hints:
    - Count one day at a time from Monday.
    - Which day do you reach after 3 counts?
    solution: 'From Monday, count 3 days: Tuesday, Wednesday, Thursday. The book goes back on Thursday.'
    mistakes:
      Wednesday: c1m10_week
      Friday: c1m10_week
    exam: competency
    difficulty: 2
