# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 4
title: Making 10
tips:
  m1_full_frame: "A ten-frame has two rows of 5 boxes. Full means every box."
  m1_make_10: "Add each pair on your fingers. Which pair uses all ten fingers?"
  m1_one_more: "Adding 1 means the next number after 9."

concepts:
- code: cbse1m.ten.pairs
  title: Pairs that make 10
  notes: |
    Making 10 with two numbers: 1+9, 2+8, 3+7, 4+6, 5+5. Using fingers and ten-frames.
  explanations:
    text: 'Ten fingers! We can split 10 into two parts: 5 and 5, 6 and 4, 7 and 3. Together they always make 10.'
    visual: 'Draw two hands with 10 fingers. Colour 7 fingers red and 3 blue: 7 and 3 make 10.'
    step_by_step: 'Step 1: Start with the first number. Step 2: Count on until you reach 10. Step 3: The number you counted is the partner.'
    real_world: 'Ten-rupee coin: you can pay with five 2-rupee coins too.'
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 7
      label: '7'
    - at: 10
      label: '10'
    alt: 'Making 10 from 7 on a number line: jump 3 more to reach 10.'
    jumps:
    - from: 0
      to: 7
      label: '7'
    - from: 7
      to: 10
      label: '+3'
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 10
    prompt: 10 fingers. Some are up. How many are down?
    goals:
    - prompt: 6 fingers up
      target: 4
      mistakes:
      - when:
          v: 6
        say: That's how many are up. How many are folded down? 6 and ? make 10.
      - when:
          v: 5
        say: 'Count on from 6 to 10: 7, 8, 9, 10. That''s 4 jumps.'
    - prompt: 3 fingers up
      target: 7
      mistakes:
      - when:
          v: 3
        say: 'That''s the fingers up. Count the ones folded: 4, 5, 6, 7, 8, 9, 10.'
      - when:
          v: 6
        say: Count on from 3 to 10 slowly. It's 7 jumps.
    - prompt: 5 fingers up
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'One full hand is up. The other hand is down: 5.'
    - prompt: 10 fingers up
      target: 0
      mistakes:
      - when:
          v: 10
        say: 'All 10 are up. How many are down? None: 0.'
  items:
  - prompt: 7 + ? = 10
    answer: '3'
    check: 10 - 7
    difficulty: 1
    hints:
    - Count on from 7.
    - 8, 9, 10.
    solution: 7 + 3 = 10.
    mistakes:
      '17': c1_count_once
      '4': c1_count_once
  - prompt: 5 + 5 = ?
    answer: '10'
    check: 5 + 5
    difficulty: 1
    hints:
    - Two hands.
    - 5 fingers each.
    solution: 5 + 5 = 10.
    mistakes:
      '55': c1_count_once
  - prompt: 6 + ? = 10
    answer: '4'
    check: 10 - 6
    difficulty: 1
    hints:
    - Count on from 6.
    - 7, 8, 9, 10.
    solution: 6 + 4 = 10.
    mistakes:
      '16': c1_count_once
      '3': c1_count_once
  - prompt: 2 + ? = 10
    answer: '8'
    check: 10 - 2
    difficulty: 2
    hints:
    - Count on from 2.
    - 'Or: 10 − 2.'
    solution: 2 + 8 = 10.
    mistakes:
      '12': c1_count_once
  - prompt: 9 + 1 = ?
    answer: '10'
    check: 9 + 1
    difficulty: 1
    hints:
    - One more than 9.
    - Count on.
    solution: 9 + 1 = 10.
    mistakes: {"8": "m1_one_more", "91": "m1_one_more"}
  - prompt: Which pair makes 10?
    options:
    - 4 and 6
    - 4 and 5
    - 3 and 6
    - 2 and 7
    answer: 4 and 6
    difficulty: 2
    hints:
    - Add each pair.
    - 4 + 6.
    solution: 4 + 6 = 10.
    mistakes: {"4 and 5": "m1_make_10"}
- code: cbse1m.ten.frame
  title: Ten-frames and numbers up to 10
  after:
  - cbse1m.ten.pairs
  notes: |
    A ten-frame has 10 boxes in 2 rows of 5. Filled boxes show a number; empty boxes show how many more to make 10.
    Counting to 10 quickly by seeing 5 and some more.
  explanations:
    text: A ten-frame has 2 rows of 5 boxes. Put one counter in each box. A full top row is 5. A full frame is 10. Empty boxes show how many more you need to make 10.
    visual: 'Draw a ten-frame with 8 counters: one full row of 5 and 3 more. 2 boxes are empty.'
    step_by_step: 'Step 1: Fill the top row first (5). Step 2: Fill the bottom row. Step 3: Count the empty boxes to find how many more make 10.'
    real_world: Egg trays in shops hold eggs in rows, so it is easy to count them.
  picture:
    kind: bars
    bars:
    - label: filled
      value: 8
    - label: empty
      value: 2
    alt: A ten-frame with 8 filled boxes and 2 empty boxes; 8 and 2 make 10.
    unit: boxes
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: A ten-frame has 2 rows of 5. Count the counters.
    goals:
    - prompt: Top row full, bottom row has 2
      target: 7
      mistakes:
      - when:
          v: 2
        say: The full top row is 5. 5 and 2 more.
      - when:
          v: 5
        say: That's just the top row. Add the bottom 2.
    - prompt: Both rows full
      target: 10
      mistakes:
      - when:
          v: 5
        say: That's one row. Two full rows are 5 and 5.
    - prompt: Top row has 4. Bottom row empty.
      target: 4
      mistakes:
      - when:
          v: 5
        say: The top row is not full. One box is empty.
  items:
  - prompt: How many boxes are in a ten-frame?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 2 rows of 5.
    - 5 + 5.
    solution: A ten-frame has 10 boxes.
    mistakes:
      '5': c1_count_once
  - prompt: A ten-frame has 8 counters. How many empty boxes?
    answer: '2'
    check: 10 - 8
    difficulty: 1
    hints:
    - 10 − 8.
    - Count on from 8.
    solution: 10 − 8 = 2.
    mistakes:
      '18': c1_count_once
  - prompt: The top row is full (5) and the bottom row has 1. How many counters?
    answer: '6'
    check: 5 + 1
    difficulty: 1
    hints:
    - 5 and 1 more.
    - Count on.
    solution: 5 + 1 = 6.
    mistakes:
      '4': c1_count_once
  - prompt: A ten-frame has 3 empty boxes. How many counters are in it?
    answer: '7'
    check: 10 - 3
    difficulty: 2
    hints:
    - 10 − 3.
    - Count back from 10.
    solution: 10 − 3 = 7.
    mistakes:
      '13': c1_count_once
  - prompt: How many boxes in one row of a ten-frame?
    answer: '5'
    check: 10 / 2
    difficulty: 2
    hints:
    - Half of 10.
    - One hand of fingers.
    solution: Each row has 5 boxes.
    mistakes:
      '10': c1_count_once
  - prompt: 'A full ten-frame shows:'
    options:
    - '10'
    - '5'
    - '2'
    - '9'
    answer: '10'
    difficulty: 1
    hints:
    - All boxes filled.
    - 2 rows of 5.
    solution: A full ten-frame shows 10.
    mistakes: {"9": "m1_full_frame"}
