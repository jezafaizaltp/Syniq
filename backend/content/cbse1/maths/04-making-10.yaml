# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 4. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 4
title: Making 10
tips:
  c1m4_add: "Start at the bigger number and count on the smaller one."
  m1_full_frame: "A ten-frame has two rows of 5 boxes. Full means every box."
  m1_make_10: "Add each pair on your fingers. Which pair uses all ten fingers?"
  m1_one_more: "Adding 1 means the next number after 9."
  c1m4_ten: Hold up 10 fingers. Fold down the first number. How many fingers stay up?
  c1m4_frame: A ten-frame has 2 rows of 5. Count the full boxes, then the empty ones.

concepts:
- code: cbse1m.ten.pairs
  title: Pairs that make 10
  notes: |
    Making 10 with two numbers: 1+9, 2+8, 3+7, 4+6, 5+5. Using fingers and ten-frames.
  explanations:
    text: 'Ten fingers! We can split 10 into two parts: 5 and 5, 6 and 4, 7 and 3. Together they always make 10.'
    visual: 'Draw two hands with 10 fingers. Colour 7 fingers red and 3 blue: 7 and 3 make 10.'
    step_by_step: 'Step 1: Start with the first number. Step 2: Count on until you reach 10. Step 3: The number you counted is the partner.'
    real_world: 'Ten-rupee coin: you can pay with five 2-rupee coins too.'
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 7
      label: '7'
    - at: 10
      label: '10'
    alt: 'Making 10 from 7 on a number line: jump 3 more to reach 10.'
    jumps:
    - from: 0
      to: 7
      label: '7'
    - from: 7
      to: 10
      label: '+3'
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 10
    prompt: 10 fingers. Some are up. How many are down?
    goals:
    - prompt: 6 fingers up
      target: 4
      mistakes:
      - when:
          v: 6
        say: That's how many are up. How many are folded down? 6 and ? make 10.
      - when:
          v: 5
        say: 'Count on from 6 to 10: 7, 8, 9, 10. That''s 4 jumps.'
    - prompt: 3 fingers up
      target: 7
      mistakes:
      - when:
          v: 3
        say: 'That''s the fingers up. Count the ones folded: 4, 5, 6, 7, 8, 9, 10.'
      - when:
          v: 6
        say: Count on from 3 to 10 slowly. It's 7 jumps.
    - prompt: 5 fingers up
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'One full hand is up. The other hand is down: 5.'
    - prompt: 10 fingers up
      target: 0
      mistakes:
      - when:
          v: 10
        say: 'All 10 are up. How many are down? None: 0.'
  lesson:
    - teach: '10 can be split into two parts in many ways: 1 and 9, 2 and 8, 3 and 7, 4 and 6, 5 and 5. Use your 10 fingers to see each pair.'
      picture:
        kind: compare
        columns:
        - title: first part
          points:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
        - title: second part
          points:
          - '9'
          - '8'
          - '7'
          - '6'
          - '5'
        alt: 'Pairs that make 10: 1 and 9, 2 and 8, 3 and 7, 4 and 6, 5 and 5.'
      check:
        prompt: 3 and ___ make 10.
        options:
        - '7'
        - '6'
        - '3'
        answer: '7'
        why: Fold 3 fingers down; 7 stay up.
      ways:
      - style: step_by_step
        teach: 'Find pairs of 10 with beads. Step 1: Put 10 beads on a string. Step 2: Push 1 bead to one side and count both sides. Step 3: Push one more bead across and count again. Step 4: Keep going and say each pair you make.'
      - style: real_world
        teach: In bowling there are 10 pins. If you count the pins that fell and the pins still standing, together they always make 10.
    - teach: 'Missing part: 6 + ? = 10. Start at 6 and count on to 10: 7, 8, 9, 10. That is 4 counts, so 6 + 4 = 10.'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 6
          label: '6'
        - at: 10
          label: '10'
        jumps:
        - from: 6
          to: 10
        alt: Counting on from 6 to 10 is 4 steps.
      check:
        prompt: Counting on from 8 to 10, how many steps?
        options:
        - '2'
        - '8'
        - '10'
        answer: '2'
        why: 8 → 9 → 10 is 2 steps.
      ways:
      - style: step_by_step
        teach: 'Use your fingers for the missing part. Step 1: Hold up all 10 fingers. Step 2: Fold down as many fingers as the number you have. Step 3: Count the fingers still standing up. Step 4: That number is the missing part.'
      - style: real_world
        teach: An egg box holds 10 eggs. If some eggs are already in it, the empty cups show how many more eggs will fit.
    - teach: 'Turn-around pairs make the same total: 2 + 8 = 10 and 8 + 2 = 10. Knowing pairs to 10 helps add quickly later.'
      check:
        prompt: If 4 + 6 = 10, what is 6 + 4?
        options:
        - '10'
        - '2'
        - '64'
        answer: '10'
        why: Changing the order does not change the total.
      ways:
      - style: visual
        teach: Turning a pair around keeps the total the same.
        picture:
          kind: compare
          columns:
          - title: One way
            points:
            - 2 + 5 = 7
            - 1 + 4 = 5
          - title: Turned around
            points:
            - 5 + 2 = 7
            - 4 + 1 = 5
          alt: 2 + 5 and 5 + 2 both make 7. 1 + 4 and 4 + 1 both make 5. Turning a pair around keeps the total the same.
      - style: real_world
        teach: 'Put 2 sweets in your left pocket and 3 in your right, or 3 in the left and 2 in the right: either way you have 5 sweets.'
  items:
  - prompt: 7 + ? = 10
    answer: '3'
    check: 10 - 7
    difficulty: 1
    hints:
    - Count on from 7.
    - 8, 9, 10.
    solution: 7 + 3 = 10.
    mistakes:
      '17': c1_count_once
      '4': c1_count_once
  - prompt: 5 + 5 = ?
    answer: '10'
    check: 5 + 5
    difficulty: 1
    hints:
    - Two hands.
    - 5 fingers each.
    solution: 5 + 5 = 10.
    mistakes:
      '55': c1_count_once
  - prompt: 6 + ? = 10
    answer: '4'
    check: 10 - 6
    difficulty: 1
    hints:
    - Count on from 6.
    - 7, 8, 9, 10.
    solution: 6 + 4 = 10.
    mistakes:
      '16': c1_count_once
      '3': c1_count_once
  - prompt: 2 + ? = 10
    answer: '8'
    check: 10 - 2
    difficulty: 2
    hints:
    - Count on from 2.
    - 'Or: 10 − 2.'
    solution: 2 + 8 = 10.
    mistakes:
      '12': c1_count_once
  - prompt: 9 + 1 = ?
    answer: '10'
    check: 9 + 1
    difficulty: 1
    hints:
    - One more than 9.
    - Count on.
    solution: 9 + 1 = 10.
    mistakes: {"8": "m1_one_more", "91": "m1_one_more"}
  - prompt: Which pair makes 10?
    options:
    - 4 and 6
    - 4 and 5
    - 3 and 6
    - 2 and 7
    answer: 4 and 6
    difficulty: 2
    hints:
    - Add each pair.
    - 4 + 6.
    solution: 4 + 6 = 10.
    mistakes: {"4 and 5": "m1_make_10"}
  - prompt: 1 + ? = 10
    answer: '9'
    check: 10-1
    difficulty: 1
    hints:
    - Fold down 1 finger.
    - How many stay up?
    solution: 'Step 1: 10 fingers, fold 1. Step 2: 9 stay up, so 1 + 9 = 10.'
    mistakes:
      '8': c1m4_ten
      '10': c1m4_ten
  - prompt: 3 + 7 = ?
    answer: '10'
    check: 3+7
    difficulty: 1
    hints:
    - Start at 7 and count on 3.
    - 8, 9, ...
    solution: 'Step 1: Start at 7. Step 2: 8, 9, 10. So 3 + 7 = 10.'
    mistakes:
      '9': c1m4_add
      '11': c1m4_add
  - prompt: 8 + ? = 10
    answer: '2'
    check: 10-8
    difficulty: 1
    hints:
    - Start at 8 and count on to 10.
    - 9, 10.
    solution: 'Step 1: 8 → 9 → 10. Step 2: 2 steps, so 8 + 2 = 10.'
    mistakes:
      '3': c1m4_ten
      '1': c1m4_ten
  - prompt: 4 + ? = 10
    answer: '6'
    check: 10-4
    difficulty: 1
    hints:
    - Fold down 4 fingers.
    - Count the fingers still up.
    solution: 'Step 1: 10 fingers, fold 4. Step 2: 6 stay up, so 4 + 6 = 10.'
    mistakes:
      '5': c1m4_ten
      '4': c1m4_ten
  - prompt: Which pair does NOT make 10?
    options:
    - 3 and 6
    - 2 and 8
    - 5 and 5
    answer: 3 and 6
    difficulty: 2
    hints:
    - Add each pair on your fingers.
    - Which pair stops short of 10?
    solution: 'Step 1: 2 + 8 = 10 and 5 + 5 = 10. Step 2: 3 + 6 = 9, not 10.'
    mistakes:
      2 and 8: c1m4_ten
      5 and 5: c1m4_ten
  - prompt: There are 10 birds. 7 fly away. How many stay?
    answer: '3'
    check: 10-7
    difficulty: 2
    hints:
    - 7 and what make 10?
    - Count on from 7 to 10.
    solution: 'Step 1: 7 + 3 = 10. Step 2: So 3 birds stay.'
    mistakes:
      '4': c1m4_ten
      '17': c1m4_ten
  - prompt: You have 5 marbles. How many more do you need to have 10?
    answer: '5'
    check: 10-5
    difficulty: 2
    hints:
    - One full hand, then ...
    - 5 and what make 10?
    solution: 'Step 1: 5 + 5 = 10. Step 2: You need 5 more.'
    mistakes:
      '4': c1m4_ten
      '6': c1m4_ten
  - prompt: 6 + 4 = 10. So 4 + 6 = ?
    answer: '10'
    check: 4+6
    difficulty: 2
    hints:
    - Same numbers, other order.
    - Does the total change?
    solution: 'Step 1: Swapping the order keeps the total. Step 2: 4 + 6 = 10.'
    mistakes:
      '2': c1m4_add
      '46': c1m4_add
  - prompt: Riya has 2 red and some blue beads, 10 beads in all. How many are blue?
    answer: '8'
    check: 10-2
    difficulty: 3
    hints:
    - Red and blue together make 10.
    - 2 and what make 10?
    solution: 'Step 1: 2 + ? = 10. Step 2: 2 + 8 = 10, so 8 are blue.'
    mistakes:
      '12': c1m4_ten
      '7': c1m4_ten
  - prompt: 'Case: Asha and Ben share 10 marbles. Asha takes 3. Ben says, ''Then I get 6.'' Is Ben right?'
    options:
    - No, Ben gets 7
    - Yes, Ben gets 6
    - No, Ben gets 10
    answer: No, Ben gets 7
    hints:
    - Hold up 10 fingers and fold down the ones Asha takes.
    - How many fingers are still up?
    solution: 3 and 7 make 10. If Asha takes 3, Ben gets 7, not 6.
    mistakes:
      Yes, Ben gets 6: c1m4_ten
      No, Ben gets 10: c1m4_ten
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your tiffin box has 10 small spaces. You put in 5 grapes and 4 nuts, one in each space. How many spaces are still empty?'
    options:
    - '1'
    - '9'
    - '0'
    answer: '1'
    hints:
    - How many spaces are filled in all?
    - How many more make 10?
    solution: 5 and 4 make 9 filled spaces. 9 and 1 make 10, so 1 space is still empty.
    mistakes:
      '9': c1m4_ten
      '0': c1m4_ten
    exam: competency
    difficulty: 2
- code: cbse1m.ten.frame
  title: Ten-frames and numbers up to 10
  after:
  - cbse1m.ten.pairs
  notes: |
    A ten-frame has 10 boxes in 2 rows of 5. Filled boxes show a number; empty boxes show how many more to make 10.
    Counting to 10 quickly by seeing 5 and some more.
  explanations:
    text: A ten-frame has 2 rows of 5 boxes. Put one counter in each box. A full top row is 5. A full frame is 10. Empty boxes show how many more you need to make 10.
    visual: 'Draw a ten-frame with 8 counters: one full row of 5 and 3 more. 2 boxes are empty.'
    step_by_step: 'Step 1: Fill the top row first (5). Step 2: Fill the bottom row. Step 3: Count the empty boxes to find how many more make 10.'
    real_world: Egg trays in shops hold eggs in rows, so it is easy to count them.
  picture:
    kind: bars
    bars:
    - label: filled
      value: 8
    - label: empty
      value: 2
    alt: A ten-frame with 8 filled boxes and 2 empty boxes; 8 and 2 make 10.
    unit: boxes
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: A ten-frame has 2 rows of 5. Count the counters.
    goals:
    - prompt: Top row full, bottom row has 2
      target: 7
      mistakes:
      - when:
          v: 2
        say: The full top row is 5. 5 and 2 more.
      - when:
          v: 5
        say: That's just the top row. Add the bottom 2.
    - prompt: Both rows full
      target: 10
      mistakes:
      - when:
          v: 5
        say: That's one row. Two full rows are 5 and 5.
    - prompt: Top row has 4. Bottom row empty.
      target: 4
      mistakes:
      - when:
          v: 5
        say: The top row is not full. One box is empty.
  lesson:
    - teach: A ten-frame is a box with 10 spaces, in 2 rows of 5. We fill it with counters. A full top row is 5.
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: '1'
        - size: 1
          label: '2'
        - size: 1
          label: '3'
        - size: 1
          label: '4'
        rows:
        - size: 1
          label: top
        - size: 1
          label: bottom
        cells:
        - - ●
          - ●
          - ●
          - ●
        - - ●
          - ○
          - ○
          - ○
        alt: 'Part of a ten-frame: filled dots and empty dots in two rows.'
      check:
        prompt: How many spaces are in one row of a ten-frame?
        options:
        - '5'
        - '10'
        - '2'
        answer: '5'
        why: 2 rows of 5 make 10.
      ways:
      - style: step_by_step
        teach: 'Build a ten-frame. Step 1: Draw 2 rows of 5 boxes. Step 2: Put one counter in each box of the top row. Step 3: Count them: that is 5. Step 4: Add counters to the bottom row and count on from 5.'
      - style: real_world
        teach: Egg trays hold eggs in neat rows, so a shopkeeper can quickly see how many eggs are missing.
    - teach: 'See 5 and some more: a full top row (5) and 3 in the bottom row is 5 and 3, which is 8. We don''t need to count every dot.'
      check:
        prompt: Top row full, bottom row has 2. How many?
        options:
        - '7'
        - '5'
        - '2'
        answer: '7'
        why: 5 and 2 more is 7.
      ways:
      - style: visual
        teach: 'Five in the top row and some more below: no need to count every dot.'
        picture:
          kind: compare
          columns:
          - title: Top row
            points:
            - ● ● ● ● ●
          - title: Bottom row
            points:
            - ● ●
          alt: The top row is full with 5 dots and the bottom row has 2 dots. 5 and 2 is 7.
      - style: real_world
        teach: One hand has 5 fingers, like a ten-frame row. Show 5 on one hand and 2 on the other, and you can see 7 without counting each finger.
    - teach: Empty spaces show how many more to make 10. 7 counters means 3 empty spaces, because 7 + 3 = 10.
      check:
        prompt: A ten-frame has 9 counters. How many spaces are empty?
        options:
        - '1'
        - '9'
        - '0'
        answer: '1'
        why: 9 + 1 = 10.
      ways:
      - style: visual
        teach: 'A ten-frame with only one counter: most of the spaces are still empty.'
        picture:
          kind: bars
          bars:
          - label: Counters
            value: 1
          - label: Empty spaces
            value: 9
          alt: A ten-frame with 1 counter has 9 empty spaces, because 1 and 9 make 10.
      - style: real_world
        teach: In a car park with 10 spaces, the guard counts the empty spaces to know how many more cars can come in.
  items:
  - prompt: How many boxes are in a ten-frame?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 2 rows of 5.
    - 5 + 5.
    solution: A ten-frame has 10 boxes.
    mistakes:
      '5': c1_count_once
  - prompt: A ten-frame has 8 counters. How many empty boxes?
    answer: '2'
    check: 10 - 8
    difficulty: 1
    hints:
    - 10 − 8.
    - Count on from 8.
    solution: 10 − 8 = 2.
    mistakes:
      '18': c1_count_once
  - prompt: The top row is full (5) and the bottom row has 1. How many counters?
    answer: '6'
    check: 5 + 1
    difficulty: 1
    hints:
    - 5 and 1 more.
    - Count on.
    solution: 5 + 1 = 6.
    mistakes:
      '4': c1_count_once
  - prompt: A ten-frame has 3 empty boxes. How many counters are in it?
    answer: '7'
    check: 10 - 3
    difficulty: 2
    hints:
    - 10 − 3.
    - Count back from 10.
    solution: 10 − 3 = 7.
    mistakes:
      '13': c1_count_once
  - prompt: How many boxes in one row of a ten-frame?
    answer: '5'
    check: 10 / 2
    difficulty: 2
    hints:
    - Half of 10.
    - One hand of fingers.
    solution: Each row has 5 boxes.
    mistakes:
      '10': c1_count_once
  - prompt: 'A full ten-frame shows:'
    options:
    - '10'
    - '5'
    - '2'
    - '9'
    answer: '10'
    difficulty: 1
    hints:
    - All boxes filled.
    - 2 rows of 5.
    solution: A full ten-frame shows 10.
    mistakes: {"9": "m1_full_frame"}
  - prompt: A ten-frame has 6 counters. How many empty spaces?
    answer: '4'
    check: 10-6
    difficulty: 1
    hints:
    - There are 10 spaces in all.
    - 6 and what make 10?
    solution: 'Step 1: 10 spaces. Step 2: 10 − 6 = 4 empty.'
    mistakes:
      '6': c1m4_frame
      '5': c1m4_frame
  - prompt: Top row full (5) and bottom row 4. How many counters?
    answer: '9'
    check: 5+4
    difficulty: 1
    hints:
    - Start at 5.
    - Count on 4.
    solution: 'Step 1: 5 in the top row. Step 2: 5 + 4 = 9.'
    mistakes:
      '4': c1m4_frame
      '10': c1m4_frame
  - prompt: How many rows does a ten-frame have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Top and ...
    - Two rows of 5.
    solution: 'Step 1: A top row and a bottom row. Step 2: 2 rows.'
    mistakes:
      '5': c1m4_frame
      '10': c1m4_frame
  - prompt: Only the top row is full. How many counters?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - One row of a ten-frame.
    - Like the fingers on one hand.
    solution: 'Step 1: One row has 5 spaces. Step 2: Full top row = 5.'
    mistakes:
      '10': c1m4_frame
      '4': c1m4_frame
  - prompt: A ten-frame has 5 empty spaces. How many counters?
    answer: '5'
    check: 10-5
    difficulty: 1
    hints:
    - 10 spaces in all.
    - Empty and full make 10.
    solution: 'Step 1: 10 − 5 empty. Step 2: 5 counters.'
    mistakes:
      '10': c1m4_frame
      '0': c1m4_frame
  - prompt: A full ten-frame and one more counter outside. How many?
    answer: '11'
    check: 10+1
    difficulty: 2
    hints:
    - A full frame is 10.
    - Count on one.
    solution: 'Step 1: Full frame is 10. Step 2: 10 + 1 = 11.'
    mistakes:
      '10': c1m4_frame
      '1': c1m4_frame
  - prompt: Ten-frame A has 7 counters, B has 4. How many more in A?
    answer: '3'
    check: 7-4
    difficulty: 2
    hints:
    - Match the counters.
    - How many in A have no partner?
    solution: 'Step 1: Match 4. Step 2: 7 − 4 = 3 more in A.'
    mistakes:
      '11': c1m4_frame
      '4': c1m4_frame
  - prompt: You put 3 counters in a ten-frame, then 4 more. How many empty spaces now?
    answer: '3'
    check: 10-3-4
    difficulty: 3
    hints:
    - 'First find how many counters: 3 and 4.'
    - Then 10 minus that.
    solution: 'Step 1: 3 + 4 = 7 counters. Step 2: 10 − 7 = 3 empty.'
    mistakes:
      '7': c1m4_frame
      '6': c1m4_frame
  - prompt: Two full ten-frames. How many counters?
    answer: '20'
    check: 10+10
    difficulty: 3
    hints:
    - One full frame is 10.
    - 10 and 10.
    solution: 'Step 1: Each frame holds 10. Step 2: 10 + 10 = 20.'
    mistakes:
      '10': c1m4_frame
      '2': c1m4_frame
  - prompt: 'Case: In a game, one ten-frame is completely full. A second ten-frame has 2 counters. How many counters are there in all?'
    options:
    - '12'
    - '10'
    - '2'
    answer: '12'
    hints:
    - How many counters fill one ten-frame?
    - Count on from that number.
    solution: 'A full ten-frame has 10. Counting on 2 more: 11, 12. So there are 12 counters.'
    mistakes:
      '10': c1m4_frame
      '2': c1m4_frame
    exam: case
    difficulty: 2
  - prompt: 'Situation: A small bus has 10 seats in 2 rows of 5. All the front-row seats and 3 back-row seats are taken. How many seats are empty?'
    options:
    - '2'
    - '3'
    - '8'
    answer: '2'
    hints:
    - How many seats are taken in all?
    - How many more make 10?
    solution: 5 front seats and 3 back seats make 8 taken. 8 and 2 make 10, so 2 seats are empty.
    mistakes:
      '3': c1m4_frame
      '8': c1m4_frame
    exam: competency
    difficulty: 2
