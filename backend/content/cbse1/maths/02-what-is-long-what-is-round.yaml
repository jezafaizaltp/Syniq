# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 2
title: What is Long, What is Round
tips:
  m1_box_slide: "A box has flat sides and corners. Can it roll?"
  m1_corners: "A corner is where two straight edges meet. Which one has straight edges?"
  m1_count_names: "Count the things named in the question, one at a time."
  m1_line_up: "Put both ends at the same starting point, then look at the other end."
  m1_longer: "Hold them side by side in your mind. Which stretches further?"
  m1_opposite_tall: "Tall and ___ are opposites, like a giraffe and a mouse."
  m1_roll: "Things that roll are round. Which one is round?"
  m1_round: "Which one has no corners at all?"
  m1_shorter: "Which one fits in your hand?"
  m1_taller: "Which one would you look up to see?"
  m1_wheels: "What do wheels do when a cart moves?"
  c1m2_len: Line them up from the same starting point. Which one sticks out further?
  c1m2_shape: Imagine pushing it on the floor. Does it roll away or slide?
  c1m2_count: Point to each one as you count. Count only the ones asked about.

concepts:
- code: cbse1m.long.longshort
  title: Long and short, tall and short
  notes: |
    Comparing lengths and heights: long/short (rope, pencil), tall/short (tree, person). Lining things up to compare.
  explanations:
    text: Some things are long, like a rope, and some are short, like a crayon. Some are tall, like a tree, and some are short, like a plant. To compare, line them up.
    visual: Draw a long snake and a short worm side by side, both starting at the same line.
    step_by_step: 'Step 1: Line up one end. Step 2: Look at the other end. Step 3: The one that goes further is longer.'
    real_world: When children stand in a line by height, the tallest stands at the back.
  picture:
    kind: bars
    bars:
    - label: rope
      value: 9
    - label: pencil
      value: 5
    - label: crayon
      value: 2
    alt: A rope is longest, a pencil is shorter, and a crayon is the shortest.
  activity:
    type: sort
    prompt: Long or short?
    bins:
    - Long
    - Short
    items:
    - label: 🐍 Snake
      bin: Long
      clue: Stretch it out. Is it more than your arm?
      why: A snake can be longer than you. It is long.
    - label: 🖍️ Crayon
      bin: Short
      clue: Does it fit in your hand?
      why: A crayon fits in your hand. It is short.
    - label: 🚂 Train
      bin: Long
      clue: Count how many coaches it has.
      why: A train has many coaches. It is long.
    - label: 📎 Paper clip
      bin: Short
      clue: Is it smaller than your finger?
      why: A clip is short.
    - label: 🪢 Skipping rope
      bin: Long
      clue: Can two children hold the ends far apart?
      why: A skipping rope is long.
    - label: ✏️ Used pencil stub
      bin: Short
      clue: Is it hard to hold?
      why: A stub is short.
  lesson:
    - teach: Long and short tell length. A train is long. A pencil stub is short. Tall and short tell height. A giraffe is tall. A puppy is short.
      picture:
        kind: compare
        columns:
        - title: long / tall
          points:
          - train
          - snake
          - giraffe
        - title: short
          points:
          - eraser
          - worm
          - puppy
        alt: Long and tall things next to short things.
      check:
        prompt: Which animal is tall?
        options:
        - giraffe
        - mouse
        - ant
        answer: giraffe
        why: A giraffe has a very long neck and is tall.
      ways:
      - style: step_by_step
        teach: 'Compare heights with a friend. Step 1: Stand back to back. Step 2: Ask someone to lay a book flat across the top of both heads. Step 3: The book tips down towards the shorter one. Step 4: Say who is taller.'
      - style: real_world
        teach: A bus is long, so that many people can sit inside. A scooter is short, so it can go through narrow lanes.
    - teach: To compare length, put the ends together at one starting line. The one that goes further is longer.
      picture:
        kind: flow
        steps:
        - line up one end
        - look at the other end
        - the one that sticks out is longer
        alt: Steps to compare two lengths.
      check:
        prompt: Two ribbons start at the same line. The red one goes further. Which is longer?
        options:
        - the red ribbon
        - the other ribbon
        - they are the same
        answer: the red ribbon
        why: It sticks out further from the same start.
      ways:
      - style: step_by_step
        teach: 'Measure a table with hand spans. Step 1: Spread your hand on the table, from thumb to little finger. Step 2: Count one span. Step 3: Move your hand along and count again. Step 4: The number of spans tells how long the table is.'
      - style: real_world
        teach: A tailor puts the end of the measuring tape at your shoulder before measuring how long your sleeve should be.
    - teach: 'We can put things in order: short, longer, longest. Tall, taller, tallest.'
      check:
        prompt: A mouse, a dog and an elephant. Which is the tallest?
        options:
        - elephant
        - dog
        - mouse
        answer: elephant
        why: The elephant is taller than both.
      ways:
      - style: visual
        teach: Three things put in order from short to long, using cubes.
        picture:
          kind: bars
          bars:
          - label: Chalk
            value: 2
          - label: Spoon
            value: 4
          - label: Ruler
            value: 7
          alt: 'A chalk is 2 cubes long, a spoon is 4 cubes long and a ruler is 7 cubes long. In order: short, longer, longest.'
      - style: real_world
        teach: In a family photo, people often stand in order of height, with the tallest at the back, so everyone's face can be seen.
  items:
  - prompt: Which is longer?
    options:
    - a rope
    - a crayon
    - a button
    answer: a rope
    difficulty: 1
    hints:
    - Think of their sizes.
    - You can skip with it.
    solution: A rope is longer.
    mistakes: {"a crayon": "m1_longer"}
  - prompt: Which is taller?
    options:
    - a tree
    - a cat
    - a cup
    answer: a tree
    difficulty: 1
    hints:
    - Look up.
    - It grows very high.
    solution: A tree is taller.
    mistakes: {"a cat": "m1_taller"}
  - prompt: Which is shorter?
    options:
    - a crayon
    - a bus
    - a train
    answer: a crayon
    difficulty: 1
    hints:
    - It fits in your hand.
    - Small.
    solution: A crayon is shorter.
    mistakes: {"a bus": "m1_shorter"}
  - prompt: 'To compare two pencils, we first:'
    options:
    - line up one end
    - throw them
    - break them
    - colour them
    answer: line up one end
    difficulty: 2
    hints:
    - Start at the same place.
    - Then look at the other end.
    solution: Line up one end, then compare.
    mistakes: {"colour them": "m1_line_up"}
  - prompt: Which is the opposite of 'tall'?
    options:
    - short
    - long
    - round
    - big
    answer: short
    difficulty: 2
    hints:
    - Not tall.
    - Little height.
    solution: Short is the opposite of tall.
    mistakes: {"long": "m1_opposite_tall"}
  - prompt: Ravi is taller than Anu. Anu is taller than Babu. How many children are there?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Ravi, Anu, Babu.
    - Count the names.
    solution: There are 3 children.
    mistakes: {"2": "m1_count_names", "4": "m1_count_names"}
  - prompt: Which of these is the longest?
    options:
    - a train
    - a toy car
    - a spoon
    answer: a train
    difficulty: 1
    hints:
    - Think of how many coaches it has.
    - Which goes on for a long way?
    solution: 'Step 1: A spoon and a toy car are small. Step 2: A train is long.'
    mistakes:
      a toy car: c1m2_len
      a spoon: c1m2_len
  - prompt: Which of these is the shortest?
    options:
    - an eraser
    - a broom
    - a ladder
    answer: an eraser
    difficulty: 1
    hints:
    - Which fits in your fist?
    - The others are long.
    solution: 'Step 1: A broom and ladder are long. Step 2: An eraser is short.'
    mistakes:
      a broom: c1m2_len
      a ladder: c1m2_len
  - prompt: Which of these is the tallest?
    options:
    - a coconut tree
    - a cat
    - a chair
    answer: a coconut tree
    difficulty: 1
    hints:
    - Look up high.
    - Which one reaches near the sky?
    solution: 'Step 1: A cat and a chair are low. Step 2: A coconut tree is tall.'
    mistakes:
      a cat: m1_taller
      a chair: m1_taller
  - prompt: What is the opposite of 'long'?
    options:
    - short
    - tall
    - round
    answer: short
    difficulty: 1
    hints:
    - A long rope and a ... rope.
    - Not long at all.
    solution: 'Step 1: Long goes on a lot. Step 2: The opposite is short.'
    mistakes:
      tall: c1m2_len
      round: c1m2_len
  - prompt: A pencil is 5 cubes long. A crayon is 3 cubes long. Which is longer?
    options:
    - the pencil
    - the crayon
    - they are the same
    answer: the pencil
    difficulty: 2
    hints:
    - Which needs more cubes?
    - '5 or 3: which is more?'
    solution: 'Step 1: 5 cubes is more than 3 cubes. Step 2: The pencil is longer.'
    mistakes:
      the crayon: c1m2_len
      they are the same: c1m2_len
  - prompt: A pencil is 5 cubes long. A crayon is 3 cubes long. How many cubes longer is the pencil?
    answer: '2'
    check: 5-3
    difficulty: 2
    hints:
    - Match cube to cube.
    - How many pencil cubes are left over?
    solution: 'Step 1: Match 3 cubes. Step 2: 5 − 3 = 2 cubes longer.'
    mistakes:
      '8': c1m2_count
      '3': c1m2_count
  - prompt: 'Two sticks: one starts higher than the other. To compare them, you should first:'
    options:
    - put their ends on the same line
    - look only at the top
    - guess
    answer: put their ends on the same line
    difficulty: 2
    hints:
    - A fair race starts at one line.
    - Line them up.
    solution: 'Step 1: Line up the starting ends. Step 2: Then see which goes further.'
    mistakes:
      look only at the top: m1_line_up
      guess: m1_line_up
  - prompt: 'Order from shortest: puppy, horse, kitten (kitten is smallest). Which comes in the middle?'
    options:
    - puppy
    - horse
    - kitten
    answer: puppy
    difficulty: 3
    hints:
    - The kitten is first.
    - The horse is the tallest, so it comes last.
    solution: 'Step 1: Kitten is shortest, horse tallest. Step 2: Puppy is in the middle.'
    mistakes:
      horse: c1m2_len
      kitten: c1m2_len
  - prompt: A rope is as long as 4 steps. Another is as long as 7 steps. How many rope-steps in all?
    answer: '11'
    check: 4+7
    difficulty: 3
    hints:
    - Put the two ropes end to end.
    - Start at 7 and count on 4.
    solution: 'Step 1: 7, then 8, 9, 10, 11. Step 2: 4 + 7 = 11 steps.'
    mistakes:
      '3': c1m2_count
      '10': c1m2_count
  - prompt: 'Case: Meena''s skipping rope is too short to skip with. Meena must choose a new one. Rope A is as long as 3 steps. Rope B is as long as 8 steps. Which should Meena choose?'
    options:
    - Rope B, the longer one
    - Rope A, the shorter one
    - Either, they are the same
    answer: Rope B, the longer one
    hints:
    - What was wrong with the old rope?
    - Which rope covers more steps?
    solution: The old rope was too short. Rope B is as long as 8 steps, more than Rope A, so it is the longer one.
    mistakes:
      Rope A, the shorter one: c1m2_len
      Either, they are the same: c1m2_len
    exam: case
    difficulty: 2
  - prompt: 'Situation: Three plants grow in a row. The sunflower is taller than the tulsi plant. The tulsi plant is taller than the grass. Which is the tallest?'
    options:
    - the sunflower
    - the tulsi plant
    - the grass
    answer: the sunflower
    hints:
    - Which plant is taller than the tulsi?
    - Is anything taller than that one?
    solution: The sunflower is taller than the tulsi, and the tulsi is taller than the grass. So the sunflower is the tallest.
    mistakes:
      the tulsi plant: c1m2_len
      the grass: c1m2_len
    exam: competency
    difficulty: 2
- code: cbse1m.long.round
  title: Round things and flat things
  after:
  - cbse1m.long.longshort
  notes: |
    Sorting things that are round (ball, orange, wheel) and things that are flat or have corners (book, box). Round things
    roll; flat ones slide.
  explanations:
    text: Some things are round, like a ball, an orange or a wheel. Round things roll. Things with flat sides, like a book or a box, slide.
    visual: Draw a ball rolling down a slope and a box sliding down beside it.
    step_by_step: 'Step 1: Look at the thing. Step 2: Is it round all over? Step 3: Will it roll or slide?'
    real_world: Wheels are round so that bicycles and cars can move easily.
  picture:
    kind: compare
    columns:
    - title: Round (rolls)
      points:
      - ball
      - orange
      - wheel
    - title: Flat (slides)
      points:
      - book
      - box
      - brick
    alt: A ball, an orange and a wheel are round and roll; a book, a box and a brick are flat and slide.
  activity:
    type: sort
    prompt: Does it roll or slide?
    bins:
    - Rolls (round)
    - Slides (flat sides)
    items:
    - label: ⚽ Ball
      bin: Rolls (round)
      clue: Push it on the floor. Does it keep going?
      why: A ball is round all over. It rolls.
    - label: 📦 Box
      bin: Slides (flat sides)
      clue: Push it. Does it turn over and over?
      why: A box has flat sides. It slides.
    - label: 🍊 Orange
      bin: Rolls (round)
      clue: Put it on a slope.
      why: An orange is round. It rolls.
    - label: 📕 Book
      bin: Slides (flat sides)
      clue: Push it. Does it turn over?
      why: A book is flat. It slides.
    - label: 🛞 Wheel
      bin: Rolls (round)
      clue: Why do cars have these?
      why: A wheel is round. It rolls.
    - label: 🧱 Brick
      bin: Slides (flat sides)
      clue: It has corners and flat faces.
      why: A brick slides.
  lesson:
    - teach: 'Round things have no corners: a ball, a wheel, a coin, an orange, a bangle. Round things can roll.'
      picture:
        kind: compare
        columns:
        - title: 'round: rolls'
          points:
          - ball
          - wheel
          - orange
        - title: 'flat with corners: slides'
          points:
          - book
          - box
          - brick
        alt: Round things that roll and flat things with corners that slide.
      check:
        prompt: Which one can roll?
        options:
        - a coin on its edge
        - a book
        - a brick
        answer: a coin on its edge
        why: A coin is round, so it can roll on its edge.
      ways:
      - style: step_by_step
        teach: 'Do a roll test. Step 1: Lean a book on a box to make a slope. Step 2: Put a thing at the top and let go. Step 3: If it rolls down, it is round. Step 4: Try a marble, a lemon and an eraser.'
      - style: real_world
        teach: Rotis, plates and bindis are round. Even the rolling pin used to make a roti is round, so it rolls over the dough.
    - teach: 'Some things have flat faces and corners: a book, a box, a brick. They do not roll; they slide when pushed.'
      check:
        prompt: 'Push a box on the floor. It will:'
        options:
        - slide
        - roll
        - bounce away
        answer: slide
        why: A box has flat faces and corners, so it slides.
      ways:
      - style: visual
        teach: Things that roll, and things that slide when pushed.
        picture:
          kind: compare
          columns:
          - title: Roll
            points:
            - Ball
            - Marble
            - Lemon
          - title: Slide
            points:
            - Book
            - Eraser
            - Lunch box
          alt: A ball, a marble and a lemon roll. A book, an eraser and a lunch box slide when pushed.
      - style: real_world
        teach: Heavy boxes are pushed across the floor and slide slowly. Big drums are tipped on their side and rolled, which is much easier.
    - teach: 'Wheels are round so that cars, bicycles and carts can roll easily. Look around you: find round things and things with corners.'
      check:
        prompt: Why do carts and bicycles have round wheels?
        options:
        - so they roll easily
        - so they look nice only
        - so they slide
        answer: so they roll easily
        why: Round shapes roll; that helps things move.
      ways:
      - style: visual
        teach: Round things and things with corners in a kitchen.
        picture:
          kind: compare
          columns:
          - title: Round
            points:
            - Plate
            - Tawa
            - Lid
          - title: With corners
            points:
            - Chopping board
            - Spice box
            - Tray
          alt: A plate, a tawa and a lid are round. A chopping board, a spice box and a tray have corners.
      - style: step_by_step
        teach: 'Go on a shape hunt in class. Step 1: Find 3 round things, like the clock. Step 2: Find 3 things with corners, like the door. Step 3: Draw them in two lists. Step 4: Compare your lists with a friend.'
  items:
  - prompt: Which is round?
    options:
    - ball
    - book
    - box
    answer: ball
    difficulty: 1
    hints:
    - It rolls.
    - No corners.
    solution: A ball is round.
    mistakes: {"box": "m1_round"}
  - prompt: Which can roll?
    options:
    - orange
    - brick
    - book
    answer: orange
    difficulty: 1
    hints:
    - It is round.
    - A fruit.
    solution: An orange can roll.
    mistakes: {"brick": "m1_roll"}
  - prompt: Which has corners?
    options:
    - book
    - ball
    - orange
    answer: book
    difficulty: 1
    hints:
    - Pointed edges.
    - You read it.
    solution: A book has corners.
    mistakes: {"ball": "m1_corners"}
  - prompt: Why are wheels round?
    options:
    - so they can roll
    - so they look nice
    - so they are heavy
    - so they are flat
    answer: so they can roll
    difficulty: 2
    hints:
    - How do cars move?
    - Rolling.
    solution: Wheels are round so they can roll.
    mistakes: {"so they look nice": "m1_wheels"}
  - prompt: 'A box will:'
    options:
    - slide
    - roll
    - fly
    answer: slide
    difficulty: 2
    hints:
    - It has flat sides.
    - Push it.
    solution: A box slides.
    mistakes: {"roll": "m1_box_slide"}
  - prompt: 'Count the round things: ball, book, orange, box, wheel.'
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Ball, orange, wheel.
    - Leave out the flat ones.
    solution: 'Ball, orange and wheel: 3 round things.'
    mistakes:
      '5': c1_count_once
      '2': c1_count_once
  - prompt: Which thing you wear is round?
    options:
    - a bangle
    - a book
    - a box
    answer: a bangle
    difficulty: 1
    hints:
    - Which one has no corners?
    - You wear it on your wrist.
    solution: 'Step 1: Books and boxes have corners. Step 2: A bangle is round.'
    mistakes:
      a book: m1_round
      a box: m1_round
  - prompt: Which one will slide, not roll?
    options:
    - a brick
    - a ball
    - a marble
    answer: a brick
    difficulty: 1
    hints:
    - Which one has corners?
    - Round things roll.
    solution: 'Step 1: A ball and a marble are round. Step 2: A brick has corners and slides.'
    mistakes:
      a ball: c1m2_shape
      a marble: c1m2_shape
  - prompt: Which fruit is round?
    options:
    - orange
    - banana
    - bean
    answer: orange
    difficulty: 1
    hints:
    - Which one could roll off the table?
    - A banana is long and curved.
    solution: 'Step 1: A banana is long. Step 2: An orange is round.'
    mistakes:
      banana: m1_round
      bean: m1_round
  - prompt: How many corners does a book have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Touch each pointy corner of a book cover.
    - Count them.
    solution: 'Step 1: Touch each corner. Step 2: A book cover has 4 corners.'
    mistakes:
      '3': c1m2_count
      '0': c1m2_count
  - prompt: Which of these has corners?
    options:
    - a matchbox
    - a ball
    - a ring
    answer: a matchbox
    difficulty: 1
    hints:
    - Run your finger round its edge.
    - Which has pointy bits?
    solution: 'Step 1: A ball and a ring are round. Step 2: A matchbox has corners.'
    mistakes:
      a ball: c1m2_shape
      a ring: c1m2_shape
  - prompt: A cart has 4 round wheels. How many wheels do 2 carts have?
    answer: '8'
    check: 4+4
    difficulty: 2
    hints:
    - Count the wheels on one cart, then the other.
    - 4 and 4.
    solution: 'Step 1: 4 wheels each. Step 2: 4 + 4 = 8 wheels.'
    mistakes:
      '4': c1m2_count
      '6': c1m2_count
  - prompt: 'Count the things that roll: ball, box, wheel, book, marble.'
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Round things roll.
    - Find the round ones and count.
    solution: 'Step 1: ball, wheel, marble are round. Step 2: 3 things roll.'
    mistakes:
      '5': c1m2_count
      '2': c1m2_count
  - prompt: What would happen if a bicycle had square wheels?
    options:
    - it would bump and not roll well
    - it would go faster
    - nothing would change
    answer: it would bump and not roll well
    difficulty: 2
    hints:
    - Squares have corners.
    - Can a box roll smoothly?
    solution: 'Step 1: Square wheels have corners. Step 2: Corners stop smooth rolling, so it bumps.'
    mistakes:
      it would go faster: c1m2_shape
      nothing would change: c1m2_shape
  - prompt: 'A tin can on its side rolls. Standing up, it:'
    options:
    - stays still on its flat end
    - rolls faster
    - flies
    answer: stays still on its flat end
    difficulty: 3
    hints:
    - The ends of a tin are flat.
    - Flat things do not roll.
    solution: 'Step 1: On its side, the round part touches the floor and rolls. Step 2: Standing, a flat end touches, so it stays still.'
    mistakes:
      rolls faster: c1m2_shape
      flies: c1m2_shape
  - prompt: 'Case: A shopkeeper must move a heavy round water drum and a heavy square box to the back of the shop. Which one can be moved by rolling it?'
    options:
    - the round drum
    - the square box
    - neither of them
    answer: the round drum
    hints:
    - Which shape has no corners?
    - Which kind of thing can roll?
    solution: Round things have no corners and can roll. The drum is round, so it can be rolled. The box has corners, so it slides.
    mistakes:
      the square box: c1m2_shape
      neither of them: c1m2_shape
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are making a toy cart from a shoebox. What shape should its wheels be so the cart moves easily?'
    options:
    - round
    - square
    - triangle
    answer: round
    hints:
    - Picture each wheel being pushed along the floor.
    - Which shape rolls without bumping?
    solution: Round wheels have no corners, so they roll smoothly. Square or triangle wheels would bump and get stuck.
    mistakes:
      square: c1m2_shape
      triangle: c1m2_shape
    exam: competency
    difficulty: 2
