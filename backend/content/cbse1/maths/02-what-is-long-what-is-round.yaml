# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 2. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 2
title: What is Long, What is Round
concepts:
- code: cbse1m.long.longshort
  title: Long and short, tall and short
  notes: |
    Comparing lengths and heights: long/short (rope, pencil), tall/short (tree, person). Lining things up to compare.
  explanations:
    text: Some things are long, like a rope, and some are short, like a crayon. Some are tall, like a tree, and some are short, like a plant. To compare, line them up.
    visual: Draw a long snake and a short worm side by side, both starting at the same line.
    step_by_step: 'Step 1: Line up one end. Step 2: Look at the other end. Step 3: The one that goes further is longer.'
    real_world: When children stand in a line by height, the tallest stands at the back.
  picture:
    kind: bars
    bars:
    - label: rope
      value: 9
    - label: pencil
      value: 5
    - label: crayon
      value: 2
    alt: A rope is longest, a pencil is shorter, and a crayon is the shortest.
  activity:
    type: sort
    prompt: Long or short?
    bins:
    - Long
    - Short
    items:
    - label: 🐍 Snake
      bin: Long
      clue: Stretch it out. Is it more than your arm?
      why: A snake can be longer than you. It is long.
    - label: 🖍️ Crayon
      bin: Short
      clue: Does it fit in your hand?
      why: A crayon fits in your hand. It is short.
    - label: 🚂 Train
      bin: Long
      clue: Count how many coaches it has.
      why: A train has many coaches. It is long.
    - label: 📎 Paper clip
      bin: Short
      clue: Is it smaller than your finger?
      why: A clip is short.
    - label: 🪢 Skipping rope
      bin: Long
      clue: Can two children hold the ends far apart?
      why: A skipping rope is long.
    - label: ✏️ Used pencil stub
      bin: Short
      clue: Is it hard to hold?
      why: A stub is short.
  items:
  - prompt: Which is longer?
    options:
    - a rope
    - a crayon
    - a button
    answer: a rope
    difficulty: 1
    hints:
    - Think of their sizes.
    - You can skip with it.
    solution: A rope is longer.
  - prompt: Which is taller?
    options:
    - a tree
    - a cat
    - a cup
    answer: a tree
    difficulty: 1
    hints:
    - Look up.
    - It grows very high.
    solution: A tree is taller.
  - prompt: Which is shorter?
    options:
    - a crayon
    - a bus
    - a train
    answer: a crayon
    difficulty: 1
    hints:
    - It fits in your hand.
    - Small.
    solution: A crayon is shorter.
  - prompt: 'To compare two pencils, we first:'
    options:
    - line up one end
    - throw them
    - break them
    - colour them
    answer: line up one end
    difficulty: 2
    hints:
    - Start at the same place.
    - Then look at the other end.
    solution: Line up one end, then compare.
  - prompt: Which is the opposite of 'tall'?
    options:
    - short
    - long
    - round
    - big
    answer: short
    difficulty: 2
    hints:
    - Not tall.
    - Little height.
    solution: Short is the opposite of tall.
  - prompt: Ravi is taller than Anu. Anu is taller than Babu. How many children are there?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Ravi, Anu, Babu.
    - Count the names.
    solution: There are 3 children.
- code: cbse1m.long.round
  title: Round things and flat things
  after:
  - cbse1m.long.longshort
  notes: |
    Sorting things that are round (ball, orange, wheel) and things that are flat or have corners (book, box). Round things
    roll; flat ones slide.
  explanations:
    text: Some things are round, like a ball, an orange or a wheel. Round things roll. Things with flat sides, like a book or a box, slide.
    visual: Draw a ball rolling down a slope and a box sliding down beside it.
    step_by_step: 'Step 1: Look at the thing. Step 2: Is it round all over? Step 3: Will it roll or slide?'
    real_world: Wheels are round so that bicycles and cars can move easily.
  picture:
    kind: compare
    columns:
    - title: Round (rolls)
      points:
      - ball
      - orange
      - wheel
    - title: Flat (slides)
      points:
      - book
      - box
      - brick
    alt: A ball, an orange and a wheel are round and roll; a book, a box and a brick are flat and slide.
  activity:
    type: sort
    prompt: Does it roll or slide?
    bins:
    - Rolls (round)
    - Slides (flat sides)
    items:
    - label: ⚽ Ball
      bin: Rolls (round)
      clue: Push it on the floor. Does it keep going?
      why: A ball is round all over. It rolls.
    - label: 📦 Box
      bin: Slides (flat sides)
      clue: Push it. Does it turn over and over?
      why: A box has flat sides. It slides.
    - label: 🍊 Orange
      bin: Rolls (round)
      clue: Put it on a slope.
      why: An orange is round. It rolls.
    - label: 📕 Book
      bin: Slides (flat sides)
      clue: Push it. Does it turn over?
      why: A book is flat. It slides.
    - label: 🛞 Wheel
      bin: Rolls (round)
      clue: Why do cars have these?
      why: A wheel is round. It rolls.
    - label: 🧱 Brick
      bin: Slides (flat sides)
      clue: It has corners and flat faces.
      why: A brick slides.
  items:
  - prompt: Which is round?
    options:
    - ball
    - book
    - box
    answer: ball
    difficulty: 1
    hints:
    - It rolls.
    - No corners.
    solution: A ball is round.
  - prompt: Which can roll?
    options:
    - orange
    - brick
    - book
    answer: orange
    difficulty: 1
    hints:
    - It is round.
    - A fruit.
    solution: An orange can roll.
  - prompt: Which has corners?
    options:
    - book
    - ball
    - orange
    answer: book
    difficulty: 1
    hints:
    - Pointed edges.
    - You read it.
    solution: A book has corners.
  - prompt: Why are wheels round?
    options:
    - so they can roll
    - so they look nice
    - so they are heavy
    - so they are flat
    answer: so they can roll
    difficulty: 2
    hints:
    - How do cars move?
    - Rolling.
    solution: Wheels are round so they can roll.
  - prompt: 'A box will:'
    options:
    - slide
    - roll
    - fly
    answer: slide
    difficulty: 2
    hints:
    - It has flat sides.
    - Push it.
    solution: A box slides.
  - prompt: 'Count the round things: ball, book, orange, box, wheel.'
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Ball, orange, wheel.
    - Leave out the flat ones.
    solution: 'Ball, orange and wheel: 3 round things.'
    mistakes:
      '5': c1_count_once
      '2': c1_count_once
