# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 5. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 5
title: How Many
tips:
  m1_after: "'After' means the next number when you count up."
  m1_between: "'Between' means in the middle, not either end."
  m1_bigger_teen: "All are teens or 10. Look at the ones digit."
  m1_smallest: "Count up from 10. Which do you reach first?"

concepts:
- code: cbse1m.many.to20
  title: Counting from 10 to 20
  notes: |
    Numbers 11 to 20 as 10 and some more: 13 is 10 and 3. Counting objects up to 20; before and after.
  explanations:
    text: After 10 come 11, 12, 13 ... up to 20. Think of 13 as one full ten-frame and 3 more.
    visual: Draw one full ten-frame and 3 counters beside it, and write 13.
    step_by_step: 'Step 1: Make a group of 10. Step 2: Count the extra ones. Step 3: Say ''ten and three makes thirteen''.'
    real_world: A packet of 10 biscuits and 3 loose ones make 13 biscuits.
  picture:
    kind: number_line
    from: 0
    to: 20
    step: 2
    points:
    - at: 10
      label: '10'
    - at: 13
      label: '13'
    alt: '13 on a number line: 10, then 3 more.'
    jumps:
    - from: 0
      to: 10
      label: '10'
    - from: 10
      to: 13
      label: '+3'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: One full ten-frame is 10. Move to the number.
    goals:
    - prompt: A full ten-frame and 3 more
      target: 13
      mistakes:
      - when:
          v: 3
        say: Don't forget the full ten-frame. 10 and 3 more.
    - prompt: A full ten-frame and 7 more
      target: 17
      mistakes:
      - when:
          v: 7
        say: 'Count the full frame first: 10, then 11, 12 ... 17.'
      - when:
          v: 16
        say: 'Count the 7 dots again: 11, 12, 13, 14, 15, 16, 17.'
    - prompt: Two full ten-frames
      target: 20
      mistakes:
      - when:
          v: 10
        say: That's one ten-frame. There are two.
  items:
  - prompt: '10 and 3 more make:'
    answer: '13'
    check: 10 + 3
    difficulty: 1
    hints:
    - Count on from 10.
    - 11, 12, 13.
    solution: 10 + 3 = 13.
    mistakes:
      '103': c1_count_once
      '7': c1_count_once
  - prompt: '10 and 5 more make:'
    answer: '15'
    check: 10 + 5
    difficulty: 1
    hints:
    - Count on from 10.
    - 11, 12, 13, 14, 15.
    solution: 10 + 5 = 15.
    mistakes:
      '105': c1_count_once
  - prompt: What comes after 14?
    answer: '15'
    check: 14 + 1
    difficulty: 1
    hints:
    - Count on one.
    - 13, 14, ...
    solution: After 14 comes 15.
    mistakes: {"13": "m1_after", "16": "m1_after"}
  - prompt: What comes before 20?
    answer: '19'
    check: 20 - 1
    difficulty: 1
    hints:
    - Count back one.
    - '..., 20.'
    solution: Before 20 comes 19.
    mistakes:
      '21': c1_count_once
  - prompt: 17 is 10 and how many more?
    answer: '7'
    check: 17 - 10
    difficulty: 2
    hints:
    - Count from 10 to 17.
    - 11, 12, 13, 14, 15, 16, 17.
    solution: 17 = 10 + 7.
    mistakes:
      '17': c1_count_once
      '1': c1_count_once
  - prompt: Which number is bigger?
    options:
    - '18'
    - '12'
    - '15'
    - '10'
    answer: '18'
    difficulty: 2
    hints:
    - Count up.
    - Which comes last?
    solution: 18 is the biggest.
    mistakes: {"15": "m1_bigger_teen"}
- code: cbse1m.many.compare
  title: Comparing numbers up to 20
  after:
  - cbse1m.many.to20
  notes: |
    Which is more, which is less; the biggest and smallest of a few numbers; one more, one less.
  explanations:
    text: A number that comes later when counting is bigger. 15 comes after 12, so 15 is bigger. One more than 15 is 16; one less is 14.
    visual: Draw a number line from 10 to 20 and circle 12 and 15. 15 is further along, so it is bigger.
    step_by_step: 'Step 1: Find both numbers on the number line. Step 2: The one further along is bigger.'
    real_world: In a race, the child who reaches step 15 is ahead of the one on step 12.
  picture:
    kind: number_line
    from: 10
    to: 20
    step: 1
    points:
    - at: 12
      label: '12'
    - at: 15
      label: '15'
    alt: '12 and 15 on a number line: 15 is further along, so it is bigger.'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: Find the number.
    goals:
    - prompt: One more than 15
      target: 16
      mistakes:
      - when:
          v: 14
        say: 'That''s one less. One more moves forward: 15, 16.'
    - prompt: One less than 11
      target: 10
      mistakes:
      - when:
          v: 12
        say: 'That''s one more. One less moves back: 11, 10.'
    - prompt: The bigger of 12 and 18
      target: 18
      mistakes:
      - when:
          v: 12
        say: When we count, 18 comes after 12. Later means bigger.
    - prompt: The smaller of 19 and 9
      target: 9
      mistakes:
      - when:
          v: 19
        say: 19 comes later when counting, so it is bigger. The smaller is the other.
  items:
  - prompt: 'Which is more: 12 or 15?'
    options:
    - '15'
    - '12'
    - both the same
    answer: '15'
    difficulty: 1
    hints:
    - Which comes later?
    - 13, 14, 15.
    solution: 15 is more.
    mistakes:
      '12': c1_more_less
  - prompt: 'One more than 15 is:'
    answer: '16'
    check: 15 + 1
    difficulty: 1
    hints:
    - Count on one.
    - 15, ...
    solution: 15 + 1 = 16.
    mistakes:
      '14': c1_count_once
  - prompt: 'One less than 11 is:'
    answer: '10'
    check: 11 - 1
    difficulty: 1
    hints:
    - Count back one.
    - '..., 11.'
    solution: 11 − 1 = 10.
    mistakes:
      '12': c1_count_once
  - prompt: 'Which is less: 19 or 9?'
    options:
    - '9'
    - '19'
    - both the same
    answer: '9'
    difficulty: 2
    hints:
    - 9 is one digit.
    - 19 is ten and 9.
    solution: 9 is less than 19.
    mistakes:
      '19': c1_more_less
  - prompt: 'Which is the smallest: 14, 11, 17?'
    options:
    - '11'
    - '14'
    - '17'
    answer: '11'
    difficulty: 2
    hints:
    - Which comes first?
    - Count from 10.
    solution: 11 is the smallest.
    mistakes: {"14": "m1_smallest"}
  - prompt: Which number is between 12 and 14?
    answer: '13'
    check: 12 + 1
    difficulty: 1
    hints:
    - 12, ..., 14.
    - One more than 12.
    solution: 13 is between them.
    mistakes: {"12": "m1_between", "14": "m1_between"}
