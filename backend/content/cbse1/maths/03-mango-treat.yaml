# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 3. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 3
title: Mango Treat
tips:
  m1_biggest: "Count up 0, 1, 2, ... Which of these do you say last?"
  m1_zero: "'None' means not even one."

concepts:
- code: cbse1m.mango.count
  title: Numbers 1 to 9 and zero
  notes: |
    Counting mangoes up to 9; zero means none; reading and writing the numerals 0 to 9; matching numerals to groups.
  explanations:
    text: 'We count mangoes: 1, 2, 3 ... 9. If the basket is empty, there are 0 mangoes. Zero means none.'
    visual: 'Draw three baskets: one with 4 mangoes, one with 1 mango, and one empty with 0 written on it.'
    step_by_step: 'Step 1: Count the mangoes. Step 2: Write the number. Step 3: If there are none, write 0.'
    real_world: When all the mangoes are eaten, the basket has 0 mangoes.
  picture:
    kind: bars
    bars:
    - label: basket A
      value: 4
    - label: basket B
      value: 1
    - label: basket C
      value: 0
    alt: Basket A has 4 mangoes, basket B has 1, and basket C has 0.
    unit: mangoes
  activity:
    type: number_line
    min: 0
    max: 9
    step: 1
    start: 9
    prompt: How many mangoes in the basket?
    goals:
    - prompt: 🥭🥭🥭🥭
      target: 4
      mistakes:
      - when:
          v: 3
        say: 'One mango was missed. Touch each one: 1, 2, 3, 4.'
      - when:
          v: 5
        say: One mango was counted twice.
    - prompt: An empty basket
      target: 0
      mistakes:
      - when:
          v: 1
        say: There is nothing in the basket. Nothing is zero, not one.
    - prompt: 🥭🥭🥭🥭🥭🥭
      target: 6
      mistakes:
      - when:
          v: 5
        say: After 5 comes 6. Count the last mango too.
  items:
  - prompt: A basket has no mangoes. How many mangoes?
    answer: '0'
    check: '0'
    difficulty: 1
    hints:
    - None at all.
    - Zero.
    solution: No mangoes means 0.
    mistakes:
      '1': c1_count_once
  - prompt: 'Count: 🥭🥭🥭🥭. How many mangoes?'
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Touch each one.
    - 1, 2, 3, 4.
    solution: There are 4 mangoes.
    mistakes:
      '3': c1_count_once
      '5': c1_count_once
  - prompt: What number comes after 8?
    answer: '9'
    check: 8 + 1
    difficulty: 1
    hints:
    - Count on one.
    - 7, 8, ...
    solution: After 8 comes 9.
    mistakes:
      '7': c1_count_once
  - prompt: Riya eats all 3 of her mangoes. How many are left?
    answer: '0'
    check: 3 - 3
    difficulty: 2
    hints:
    - She ate all of them.
    - None left.
    solution: 3 − 3 = 0.
    mistakes:
      '3': c1_count_once
  - prompt: Which number is the biggest?
    options:
    - '9'
    - '5'
    - '7'
    - '0'
    answer: '9'
    difficulty: 2
    hints:
    - Count up to it.
    - It comes last.
    solution: 9 is the biggest.
    mistakes: {"7": "m1_biggest"}
  - prompt: Which number means 'none'?
    options:
    - '0'
    - '1'
    - '9'
    - '5'
    answer: '0'
    difficulty: 1
    hints:
    - Empty basket.
    - Zero.
    solution: 0 means none.
    mistakes: {"1": "m1_zero"}
- code: cbse1m.mango.share
  title: More, fewer and the same
  after:
  - cbse1m.mango.count
  notes: |
    Comparing two groups of mangoes by matching one to one: more, fewer, same. Adding one more, taking one away.
  explanations:
    text: To see which plate has more mangoes, match them one to one. The plate with mangoes left over has more. If none are left over, they are the same.
    visual: 'Draw two plates: one with 5 mangoes, one with 3. Draw lines matching them; 2 mangoes have no partner.'
    step_by_step: 'Step 1: Match one mango from each plate. Step 2: Keep matching. Step 3: The plate with extra mangoes has more.'
    real_world: When sharing mangoes, we check that everyone has the same.
  picture:
    kind: bars
    bars:
    - label: Anu
      value: 5
    - label: Babu
      value: 3
    alt: Anu has 5 mangoes and Babu has 3, so Anu has more.
    unit: mangoes
  activity:
    type: sort
    prompt: Which plate has more mangoes?
    bins:
    - Plate A
    - Plate B
    - Same
    items:
    - label: 'A: 🥭🥭🥭🥭  B: 🥭🥭'
      bin: Plate A
      clue: Match one from each plate. Who has some left over?
      why: Plate A has 2 left over. A has more.
    - label: 'A: 🥭  B: 🥭🥭🥭'
      bin: Plate B
      clue: Match one to one. Who still has mangoes?
      why: Plate B has 2 left over.
    - label: 'A: 🥭🥭🥭  B: 🥭🥭🥭'
      bin: Same
      clue: Match one to one. Any left over?
      why: None left over. They are the same.
    - label: 'A: 🥭🥭🥭🥭🥭  B: 🥭🥭🥭🥭'
      bin: Plate A
      clue: Pair them. Who has one left?
      why: Plate A has 1 extra.
    - label: 'A: 🥭🥭  B: 🥭🥭🥭🥭🥭'
      bin: Plate B
      clue: Pair them. Who has some left?
      why: Plate B has 3 extra.
  items:
  - prompt: Anu has 5 mangoes, Babu has 3. Who has more?
    options:
    - Anu
    - Babu
    - both the same
    answer: Anu
    difficulty: 1
    hints:
    - Match them.
    - 5 and 3.
    solution: Anu has more.
    mistakes:
      Babu: c1_more_less
  - prompt: Meena has 4 mangoes, Raju has 4. Who has more?
    options:
    - both the same
    - Meena
    - Raju
    answer: both the same
    difficulty: 1
    hints:
    - Match them.
    - None left over.
    solution: They have the same.
    mistakes:
      Meena: c1_more_less
  - prompt: You have 3 mangoes and get 1 more. How many now?
    answer: '4'
    check: 3 + 1
    difficulty: 1
    hints:
    - One more than 3.
    - Count on.
    solution: 3 + 1 = 4.
    mistakes:
      '2': c1_count_once
  - prompt: You have 6 mangoes and give 1 away. How many now?
    answer: '5'
    check: 6 - 1
    difficulty: 1
    hints:
    - One less than 6.
    - Count back.
    solution: 6 − 1 = 5.
    mistakes:
      '7': c1_count_once
  - prompt: 'Which plate has fewer mangoes: A has 2, B has 7?'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 2
    hints:
    - Fewer means less.
    - 2 is less than 7.
    solution: A has fewer.
    mistakes:
      B: c1_more_less
  - prompt: Anu has 5 mangoes and Babu has 3. How many more does Anu have?
    answer: '2'
    check: 5 - 3
    difficulty: 2
    hints:
    - Match them.
    - Count the ones left over.
    solution: 5 − 3 = 2.
    mistakes:
      '8': c1_count_once
