# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 13. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 13
title: So Many Toys
tips:
  m1_drum: "A drum is round at both ends with straight sides."
  m1_only_balls: "Count only the balls, not all the toys."
  m1_sorting: "Sorting is putting things that are alike together."
  m1_stack: "Things with flat sides stay put when you stack them. Round things roll off."
  c1m13_sort: Make a group for each kind. Count each group on its own.
  c1m13_solid: Picture the toy. Is it round all over, a box, a tube, or pointy on top?

concepts:
- code: cbse1m.toys.sort
  title: Sorting toys
  notes: |
    Sorting toys into groups by kind, colour or shape; counting each group; most and fewest.
  explanations:
    text: 'We can sort toys into groups: balls together, cars together, dolls together. Then count each group and see which has the most.'
    visual: 'Draw three boxes: one with 4 balls, one with 2 cars, one with 3 dolls.'
    step_by_step: 'Step 1: Pick a way to sort. Step 2: Put each toy in its group. Step 3: Count each group. Step 4: Compare.'
    real_world: At home we keep toys in a box so we can find them.
  picture:
    kind: bars
    bars:
    - label: balls
      value: 4
    - label: cars
      value: 2
    - label: dolls
      value: 3
    alt: 'Sorted toys: 4 balls, 2 cars and 3 dolls.'
    unit: toys
  activity:
    type: sort
    prompt: Sort the toys.
    bins:
    - Balls
    - Cars
    - Dolls
    items:
    - label: ⚽ Football
      bin: Balls
      clue: Does it bounce and roll?
      why: A football is a ball.
    - label: 🏀 Basketball
      bin: Balls
      clue: Round and bouncy.
      why: A basketball is a ball.
    - label: 🚗 Red car
      bin: Cars
      clue: It has four wheels.
      why: It goes with the cars.
    - label: 🚙 Jeep
      bin: Cars
      clue: Wheels and a steering wheel.
      why: A jeep goes with the cars.
    - label: 🪆 Wooden doll
      bin: Dolls
      clue: It has a face and a body.
      why: It goes with the dolls.
    - label: 🧸 Teddy dressed like a doll
      bin: Dolls
      clue: You can dress it and hug it.
      why: It goes with the dolls.
  lesson:
    - teach: 'Sorting means putting things into groups that are alike: all balls together, all cars together, all dolls together. We can sort by kind, colour, size or shape.'
      picture:
        kind: compare
        columns:
        - title: balls
          points:
          - ⚽
          - 🏀
          - ⚾
        - title: cars
          points:
          - 🚗
          - 🚙
        alt: Toys sorted into a group of balls and a group of cars.
      check:
        prompt: 'Red blocks, blue blocks, red blocks: sorting by colour makes how many groups?'
        options:
        - '2'
        - '3'
        - '1'
        answer: '2'
        why: One red group and one blue group.
    - teach: 'After sorting, count each group. Then compare: the biggest group has the most; the smallest group has the fewest.'
      picture:
        kind: bars
        unit: toys
        bars:
        - label: balls
          value: 5
        - label: cars
          value: 2
        - label: dolls
          value: 3
        alt: 'Bars: 5 balls, 2 cars, 3 dolls.'
      check:
        prompt: 5 balls, 2 cars, 3 dolls. Which is there most of?
        options:
        - balls
        - cars
        - dolls
        answer: balls
        why: 5 is the biggest number.
    - teach: 'To find all the toys, add the groups: 5 + 2 + 3 = 10 toys. To see how many more, take away: 5 balls − 2 cars = 3 more balls.'
      check:
        prompt: 2 cars and 4 trucks. How many in all?
        options:
        - '6'
        - '2'
        - '8'
        answer: '6'
        why: 2 + 4 = 6.
  items:
  - prompt: 4 balls, 2 cars and 3 dolls. How many balls?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Look at the balls.
    - Count them.
    solution: 4 balls.
    mistakes: {"9": "m1_only_balls", "3": "m1_only_balls"}
  - prompt: 'Which toy is there most of: 4 balls, 2 cars, 3 dolls?'
    options:
    - balls
    - cars
    - dolls
    answer: balls
    difficulty: 1
    hints:
    - Biggest number.
    - '4.'
    solution: Balls (4).
    mistakes:
      dolls: c1_more_less
  - prompt: 'Which toy is there fewest of: 4 balls, 2 cars, 3 dolls?'
    options:
    - cars
    - balls
    - dolls
    answer: cars
    difficulty: 1
    hints:
    - Smallest number.
    - '2.'
    solution: Cars (2).
    mistakes:
      dolls: c1_more_less
  - prompt: 'How many toys in all: 4 balls, 2 cars, 3 dolls?'
    answer: '9'
    check: 4 + 2 + 3
    difficulty: 2
    hints:
    - 4 + 2 = 6.
    - 6 + 3.
    solution: 4 + 2 + 3 = 9.
    mistakes:
      '8': c1_count_once
  - prompt: 'How many more balls than cars: 4 balls, 2 cars?'
    answer: '2'
    check: 4 - 2
    difficulty: 2
    hints:
    - Match them.
    - 4 − 2.
    solution: 4 − 2 = 2.
    mistakes:
      '6': c1_count_once
  - prompt: 'Sorting means:'
    options:
    - putting things into groups
    - breaking things
    - hiding things
    answer: putting things into groups
    difficulty: 1
    hints:
    - Like with like.
    - Groups.
    solution: Sorting means putting things into groups.
    mistakes: {"breaking things": "m1_sorting"}
  - prompt: 3 teddies, 5 balls, 1 kite. How many balls?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Look only at the balls.
    - Find the number next to 'balls'.
    solution: 'Step 1: Find the ball group. Step 2: 5 balls.'
    mistakes:
      '9': m1_only_balls
      '3': m1_only_balls
  - prompt: 3 teddies, 5 balls, 1 kite. Which is there fewest of?
    options:
    - kite
    - teddies
    - balls
    answer: kite
    difficulty: 1
    hints:
    - Fewest means the smallest number.
    - Compare 3, 5 and 1.
    solution: 'Step 1: 1 is the smallest. Step 2: The kite.'
    mistakes:
      teddies: c1_more_less
      balls: c1_more_less
  - prompt: 3 teddies, 5 balls, 1 kite. How many toys in all?
    answer: '9'
    check: 3+5+1
    difficulty: 2
    hints:
    - Add all the groups.
    - Start at 5, count on 3, then 1.
    solution: 'Step 1: 5 + 3 = 8. Step 2: 8 + 1 = 9 toys.'
    mistakes:
      '8': c1m13_sort
      '5': c1m13_sort
  - prompt: 'Sort by colour: red car, blue car, red ball, blue ball, red kite. How many red toys?'
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Look at the colour only.
    - Count the red ones.
    solution: 'Step 1: red car, red ball, red kite. Step 2: 3 red toys.'
    mistakes:
      '2': c1m13_sort
      '5': c1m13_sort
  - prompt: Which toy does NOT belong with ball, marble, orange-shaped rattle?
    options:
    - a block
    - a beach ball
    - a round bead
    answer: a block
    difficulty: 2
    hints:
    - What is the same about the group?
    - They are all round.
    solution: 'Step 1: The group is round things. Step 2: A block has corners, so it does not belong.'
    mistakes:
      a beach ball: m1_sorting
      a round bead: m1_sorting
  - prompt: 6 dolls and 2 cars. How many more dolls than cars?
    answer: '4'
    check: 6-2
    difficulty: 2
    hints:
    - Match a doll with each car.
    - How many dolls have no car?
    solution: 'Step 1: Match 2. Step 2: 6 − 2 = 4 more dolls.'
    mistakes:
      '8': c1m13_sort
      '2': c1m13_sort
  - prompt: A box has 4 cars. 3 more cars are put in. Then 2 are taken out. How many cars?
    answer: '5'
    check: 4+3-2
    difficulty: 3
    hints:
    - First add, then take away.
    - 4 + 3 = 7.
    solution: 'Step 1: 4 + 3 = 7. Step 2: 7 − 2 = 5 cars.'
    mistakes:
      '7': c1m13_sort
      '9': c1m13_sort
  - prompt: 'Big balls: 3. Small balls: 3. Which is true?'
    options:
    - there are as many big as small
    - more big balls
    - more small balls
    answer: there are as many big as small
    difficulty: 2
    hints:
    - Compare 3 and 3.
    - Match big with small.
    solution: 'Step 1: 3 and 3 match up. Step 2: They are the same number.'
    mistakes:
      more big balls: c1_more_less
      more small balls: c1_more_less
  - prompt: Tinu has 2 balls, Rani has 2 more than Tinu. How many balls together?
    answer: '6'
    check: 2+(2+2)
    difficulty: 3
    hints:
    - First find Rani's balls.
    - 2 more than 2.
    solution: 'Step 1: Rani has 2 + 2 = 4. Step 2: 2 + 4 = 6 balls together.'
    mistakes:
      '4': c1m13_sort
      '5': c1m13_sort
- code: cbse1m.toys.solids
  title: Shapes of toys
  after:
  - cbse1m.toys.sort
  notes: |
    Toys and their solid shapes: ball (sphere), dice (cube), building block (cuboid), drum (cylinder), top or cap
    (cone). Which roll and which stack.
  explanations:
    text: Toys have shapes. A ball is a sphere, a dice is a cube, a block is a cuboid, a drum is a cylinder and a party cap is a cone. Flat-faced toys stack well; round ones roll.
    visual: Draw a tower of blocks next to a ball rolling away.
    step_by_step: 'Step 1: Look at the toy. Step 2: Does it have flat faces, curved faces or both? Step 3: Name the shape.'
    real_world: Channapatna wooden toys from Karnataka are made in round and cylinder shapes.
  picture:
    kind: compare
    columns:
    - title: Toy
      points:
      - ball
      - dice
      - drum
    - title: Shape
      points:
      - sphere
      - cube
      - cylinder
    alt: A ball is a sphere, a dice is a cube and a drum is a cylinder.
  activity:
    type: sort
    prompt: What shape is the toy?
    bins:
    - Sphere
    - Cube
    - Cylinder
    - Cone
    items:
    - label: ⚽ Ball
      bin: Sphere
      clue: Round all over, it rolls any way.
      why: A sphere.
    - label: 🎲 Dice
      bin: Cube
      clue: All faces are the same square.
      why: A cube.
    - label: 🥁 Drum
      bin: Cylinder
      clue: Round at the ends, flat on top.
      why: A cylinder.
    - label: 🥳 Party hat
      bin: Cone
      clue: Round at the bottom and pointy on top.
      why: A cone.
    - label: 🔮 Marble
      bin: Sphere
      clue: Tiny and round all over.
      why: A sphere.
    - label: 🧱 A block with all sides the same
      bin: Cube
      clue: Same length every way.
      why: A cube.
  lesson:
    - teach: 'Toys have solid shapes. A ball is a sphere: round all over. A dice is a cube: 6 square faces. A brick-like block is a cuboid. A drum is a cylinder. A party cap is a cone.'
      picture:
        kind: compare
        columns:
        - title: toy
          points:
          - ball
          - dice
          - block
          - drum
          - party cap
        - title: shape
          points:
          - sphere
          - cube
          - cuboid
          - cylinder
          - cone
        alt: Toys and their solid shapes.
      check:
        prompt: 'A tin can is shaped like a:'
        options:
        - cylinder
        - cube
        - cone
        answer: cylinder
        why: It has two round flat ends and a curved side.
    - teach: 'Some shapes roll: sphere (rolls any way), cylinder and cone (roll on their curved side). Some slide and stack: cube and cuboid have flat faces.'
      check:
        prompt: Which shape rolls in every direction?
        options:
        - sphere
        - cube
        - cuboid
        answer: sphere
        why: A sphere is round all over.
    - teach: Flat faces help stacking. Cubes and cuboids make good towers. A sphere cannot be stacked; it rolls off.
      check:
        prompt: Which is best for building a tall tower?
        options:
        - cubes
        - balls
        - cones on their points
        answer: cubes
        why: Cubes have flat faces that sit on each other.
  items:
  - prompt: 'A ball is shaped like a:'
    options:
    - sphere
    - cube
    - cone
    answer: sphere
    difficulty: 1
    hints:
    - Round all over.
    - It rolls.
    solution: A ball is a sphere.
    mistakes: {"cube": "m4_sphere"}
  - prompt: 'A dice is shaped like a:'
    options:
    - cube
    - sphere
    - cylinder
    answer: cube
    difficulty: 1
    hints:
    - Square faces.
    - 6 faces.
    solution: A dice is a cube.
    mistakes: {"sphere": "m4_dice"}
  - prompt: Which toys stack well in a tower?
    options:
    - blocks
    - balls
    - marbles
    answer: blocks
    difficulty: 1
    hints:
    - Flat faces.
    - They don't roll.
    solution: Blocks stack well.
    mistakes: {"balls": "m1_stack"}
  - prompt: 'A drum is shaped like a:'
    options:
    - cylinder
    - cone
    - cube
    answer: cylinder
    difficulty: 2
    hints:
    - Round top and bottom.
    - Like a tin.
    solution: A drum is a cylinder.
    mistakes: {"cone": "m1_drum"}
  - prompt: 'A party cap is shaped like a:'
    options:
    - cone
    - cube
    - sphere
    answer: cone
    difficulty: 2
    hints:
    - Pointed on top.
    - Round at the bottom.
    solution: A party cap is a cone.
    mistakes: {"cube": "m3_clown_hat"}
  - prompt: A tower has 3 red blocks and 2 blue blocks. How many blocks?
    answer: '5'
    check: 3 + 2
    difficulty: 1
    hints:
    - 3 + 2.
    - Count on.
    solution: 3 + 2 = 5.
    mistakes:
      '4': c1_count_once
  - prompt: 'An orange is shaped like a:'
    options:
    - sphere
    - cube
    - cone
    answer: sphere
    difficulty: 1
    hints:
    - It is round all over.
    - Like a ball.
    solution: 'Step 1: An orange is round all over. Step 2: It is a sphere.'
    mistakes:
      cube: c1m13_solid
      cone: c1m13_solid
  - prompt: 'An ice-cream cone is shaped like a:'
    options:
    - cone
    - cylinder
    - cuboid
    answer: cone
    difficulty: 1
    hints:
    - Round at the top, pointy at the bottom.
    - Its name is in the question.
    solution: 'Step 1: Round end and a point. Step 2: It is a cone.'
    mistakes:
      cylinder: c1m13_solid
      cuboid: c1m13_solid
  - prompt: 'A lunch box is shaped like a:'
    options:
    - cuboid
    - sphere
    - cone
    answer: cuboid
    difficulty: 1
    hints:
    - It has flat faces and corners.
    - Like a brick.
    solution: 'Step 1: Flat faces, long and short sides. Step 2: It is a cuboid.'
    mistakes:
      sphere: c1m13_solid
      cone: c1m13_solid
  - prompt: How many faces does a dice have?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Each face shows dots from 1 up.
    - The biggest number of dots.
    solution: 'Step 1: A dice shows 1 to 6 dots, one on each face. Step 2: 6 faces.'
    mistakes:
      '4': c1m13_solid
      '8': c1m13_solid
  - prompt: Which will NOT roll?
    options:
    - a cube
    - a ball
    - a cylinder on its side
    answer: a cube
    difficulty: 1
    hints:
    - Which one has only flat faces?
    - Round things roll.
    solution: 'Step 1: Ball and cylinder have curved parts. Step 2: A cube only slides.'
    mistakes:
      a ball: m1_stack
      a cylinder on its side: m1_stack
  - prompt: 'A candle is shaped like a:'
    options:
    - cylinder
    - cube
    - sphere
    answer: cylinder
    difficulty: 2
    hints:
    - Long, with round flat ends.
    - Like a drum but thinner.
    solution: 'Step 1: Round flat ends and a curved side. Step 2: It is a cylinder.'
    mistakes:
      cube: c1m13_solid
      sphere: c1m13_solid
  - prompt: Which two shapes can both roll AND stand still on a flat face?
    options:
    - cylinder and cone
    - sphere and cube
    - cube and cuboid
    answer: cylinder and cone
    difficulty: 3
    hints:
    - They need a curved part and a flat part.
    - A sphere has no flat face.
    solution: 'Step 1: Cylinder and cone have a curved side and a flat face. Step 2: So they roll and can stand.'
    mistakes:
      sphere and cube: c1m13_solid
      cube and cuboid: c1m13_solid
  - prompt: A tower has 2 cubes, then 3 more cubes on top. How many cubes?
    answer: '5'
    check: 2+3
    difficulty: 1
    hints:
    - Add the cubes.
    - 2 and 3.
    solution: 'Step 1: 2 + 3. Step 2: 5 cubes.'
    mistakes:
      '4': c1m13_sort
      '6': c1m13_sort
  - prompt: 'Sort: ball, dice, drum, marble, block. How many are spheres?'
    answer: '2'
    check: '2'
    difficulty: 3
    hints:
    - Spheres are round all over.
    - Find them and count.
    solution: 'Step 1: ball and marble are spheres. Step 2: 2.'
    mistakes:
      '3': c1m13_solid
      '1': c1m13_solid
