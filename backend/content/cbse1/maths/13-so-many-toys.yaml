# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 13. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 13
title: So Many Toys
concepts:
- code: cbse1m.toys.sort
  title: Sorting toys
  notes: |
    Sorting toys into groups by kind, colour or shape; counting each group; most and fewest.
  explanations:
    text: 'We can sort toys into groups: balls together, cars together, dolls together. Then count each group and see which has the most.'
    visual: 'Draw three boxes: one with 4 balls, one with 2 cars, one with 3 dolls.'
    step_by_step: 'Step 1: Pick a way to sort. Step 2: Put each toy in its group. Step 3: Count each group. Step 4: Compare.'
    real_world: At home we keep toys in a box so we can find them.
  picture:
    kind: bars
    bars:
    - label: balls
      value: 4
    - label: cars
      value: 2
    - label: dolls
      value: 3
    alt: 'Sorted toys: 4 balls, 2 cars and 3 dolls.'
    unit: toys
  items:
  - prompt: 4 balls, 2 cars and 3 dolls. How many balls?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Look at the balls.
    - Count them.
    solution: 4 balls.
  - prompt: 'Which toy is there most of: 4 balls, 2 cars, 3 dolls?'
    options:
    - balls
    - cars
    - dolls
    answer: balls
    difficulty: 1
    hints:
    - Biggest number.
    - '4.'
    solution: Balls (4).
    mistakes:
      dolls: c1_more_less
  - prompt: 'Which toy is there fewest of: 4 balls, 2 cars, 3 dolls?'
    options:
    - cars
    - balls
    - dolls
    answer: cars
    difficulty: 1
    hints:
    - Smallest number.
    - '2.'
    solution: Cars (2).
    mistakes:
      dolls: c1_more_less
  - prompt: 'How many toys in all: 4 balls, 2 cars, 3 dolls?'
    answer: '9'
    check: 4 + 2 + 3
    difficulty: 2
    hints:
    - 4 + 2 = 6.
    - 6 + 3.
    solution: 4 + 2 + 3 = 9.
    mistakes:
      '8': c1_count_once
  - prompt: 'How many more balls than cars: 4 balls, 2 cars?'
    answer: '2'
    check: 4 - 2
    difficulty: 2
    hints:
    - Match them.
    - 4 − 2.
    solution: 4 − 2 = 2.
    mistakes:
      '6': c1_count_once
  - prompt: 'Sorting means:'
    options:
    - putting things into groups
    - breaking things
    - hiding things
    answer: putting things into groups
    difficulty: 1
    hints:
    - Like with like.
    - Groups.
    solution: Sorting means putting things into groups.
- code: cbse1m.toys.solids
  title: Shapes of toys
  after:
  - cbse1m.toys.sort
  notes: |
    Toys and their solid shapes: ball (sphere), dice (cube), building block (cuboid), drum (cylinder), top or cap
    (cone). Which roll and which stack.
  explanations:
    text: Toys have shapes. A ball is a sphere, a dice is a cube, a block is a cuboid, a drum is a cylinder and a party cap is a cone. Flat-faced toys stack well; round ones roll.
    visual: Draw a tower of blocks next to a ball rolling away.
    step_by_step: 'Step 1: Look at the toy. Step 2: Does it have flat faces, curved faces or both? Step 3: Name the shape.'
    real_world: Channapatna wooden toys from Karnataka are made in round and cylinder shapes.
  picture:
    kind: compare
    columns:
    - title: Toy
      points:
      - ball
      - dice
      - drum
    - title: Shape
      points:
      - sphere
      - cube
      - cylinder
    alt: A ball is a sphere, a dice is a cube and a drum is a cylinder.
  items:
  - prompt: 'A ball is shaped like a:'
    options:
    - sphere
    - cube
    - cone
    answer: sphere
    difficulty: 1
    hints:
    - Round all over.
    - It rolls.
    solution: A ball is a sphere.
  - prompt: 'A dice is shaped like a:'
    options:
    - cube
    - sphere
    - cylinder
    answer: cube
    difficulty: 1
    hints:
    - Square faces.
    - 6 faces.
    solution: A dice is a cube.
  - prompt: Which toys stack well in a tower?
    options:
    - blocks
    - balls
    - marbles
    answer: blocks
    difficulty: 1
    hints:
    - Flat faces.
    - They don't roll.
    solution: Blocks stack well.
  - prompt: 'A drum is shaped like a:'
    options:
    - cylinder
    - cone
    - cube
    answer: cylinder
    difficulty: 2
    hints:
    - Round top and bottom.
    - Like a tin.
    solution: A drum is a cylinder.
  - prompt: 'A party cap is shaped like a:'
    options:
    - cone
    - cube
    - sphere
    answer: cone
    difficulty: 2
    hints:
    - Pointed on top.
    - Round at the bottom.
    solution: A party cap is a cone.
  - prompt: A tower has 3 red blocks and 2 blue blocks. How many blocks?
    answer: '5'
    check: 3 + 2
    difficulty: 1
    hints:
    - 3 + 2.
    - Count on.
    solution: 3 + 2 = 5.
    mistakes:
      '4': c1_count_once
