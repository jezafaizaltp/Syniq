# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 8. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 8
title: Fun with Numbers
concepts:
- code: cbse1m.fun.tens
  title: Counting in tens up to 100
  notes: |
    Bundles of 10: 10, 20, 30 ... 100. Numbers like 23 as 2 tens and 3 ones. Counting large collections by making tens.
  explanations:
    text: 'Big numbers are easy if we make bundles of 10. Count the bundles: 10, 20, 30. Then count the loose ones. 2 bundles and 3 loose sticks make 23.'
    visual: Draw 2 bundles of 10 sticks and 3 loose sticks, and write 23.
    step_by_step: 'Step 1: Make bundles of 10. Step 2: Count the bundles in tens. Step 3: Count the loose ones. Step 4: Put them together.'
    real_world: Shopkeepers tie 10 pencils in a bundle so they can count quickly.
  picture:
    kind: number_line
    from: 0
    to: 30
    step: 5
    points:
    - at: 10
      label: '10'
    - at: 20
      label: '20'
    - at: 23
      label: '23'
    alt: '23 on a number line: 10, 20, then 3 more.'
    jumps:
    - from: 0
      to: 10
      label: '+10'
    - from: 10
      to: 20
      label: '+10'
    - from: 20
      to: 23
      label: '+3'
  items:
  - prompt: 10, 20, 30, __ ?
    answer: '40'
    check: 30 + 10
    difficulty: 1
    hints:
    - Count in tens.
    - 30 + 10.
    solution: 30 + 10 = 40.
    mistakes:
      '31': c1_count_once
  - prompt: '2 bundles of 10 and 3 loose sticks make:'
    answer: '23'
    check: 2*10 + 3
    difficulty: 1
    hints:
    - 10, 20, then 21, 22, 23.
    - Tens then ones.
    solution: 20 + 3 = 23.
    mistakes:
      '5': c1_count_once
      '32': c1_count_once
  - prompt: How many tens make 50?
    answer: '5'
    check: 50 // 10
    difficulty: 1
    hints:
    - 10, 20, 30, 40, 50.
    - Count the jumps.
    solution: 5 tens make 50.
    mistakes:
      '50': c1_count_once
  - prompt: What comes after 29?
    answer: '30'
    check: 29 + 1
    difficulty: 2
    hints:
    - Count on one.
    - 28, 29, ...
    solution: After 29 comes 30.
    mistakes:
      '210': c1_count_once
  - prompt: '10 tens make:'
    answer: '100'
    check: 10*10
    difficulty: 2
    hints:
    - 10, 20 ... 100.
    - Count ten jumps.
    solution: 10 tens = 100.
    mistakes:
      '1010': c1_count_once
  - prompt: Which is the same as 4 tens?
    options:
    - '40'
    - '4'
    - '14'
    - '44'
    answer: '40'
    difficulty: 2
    hints:
    - 10, 20, 30, 40.
    - Four bundles.
    solution: 4 tens = 40.
- code: cbse1m.fun.numbers
  title: Numbers up to 99
  after:
  - cbse1m.fun.tens
  notes: |
    Reading and writing numbers up to 99; before, after, between; bigger and smaller by looking at the tens.
  explanations:
    text: Numbers up to 99 have tens and ones. 45 is 4 tens and 5 ones. To see which number is bigger, look at the tens first.
    visual: Draw 4 bundles of ten and 5 loose sticks next to the number 45.
    step_by_step: 'Step 1: Read the tens. Step 2: Read the ones. Step 3: To compare, look at the tens first.'
    real_world: 'House numbers on a street go up: 41, 42, 43.'
  picture:
    kind: compare
    columns:
    - title: Tens
      points:
      - 4 bundles
      - '40'
    - title: Ones
      points:
      - 5 loose
      - '5'
    alt: 45 is 4 bundles of ten, which is 40, and 5 loose sticks.
  items:
  - prompt: What comes after 45?
    answer: '46'
    check: 45 + 1
    difficulty: 1
    hints:
    - Count on one.
    - 44, 45, ...
    solution: After 45 comes 46.
    mistakes:
      '44': c1_count_once
  - prompt: What comes before 60?
    answer: '59'
    check: 60 - 1
    difficulty: 1
    hints:
    - Count back one.
    - '..., 60.'
    solution: Before 60 comes 59.
    mistakes:
      '61': c1_count_once
  - prompt: '4 tens and 5 ones make:'
    answer: '45'
    check: 40 + 5
    difficulty: 1
    hints:
    - 40 and 5.
    - Tens first.
    solution: 40 + 5 = 45.
    mistakes:
      '54': c1_count_once
      '9': c1_count_once
  - prompt: 'Which is bigger: 38 or 83?'
    options:
    - '83'
    - '38'
    - both the same
    answer: '83'
    difficulty: 2
    hints:
    - Look at the tens.
    - 8 tens is more than 3 tens.
    solution: 83 is bigger.
    mistakes:
      '38': c1_more_less
  - prompt: Which number is between 70 and 72?
    answer: '71'
    check: 70 + 1
    difficulty: 2
    hints:
    - 70, ..., 72.
    - One more than 70.
    solution: 71 is between them.
  - prompt: What is the biggest number you can make with two digits?
    answer: '99'
    check: '99'
    difficulty: 2
    hints:
    - Use the biggest digit.
    - 9 and 9.
    solution: '99.'
    mistakes:
      '100': c1_count_once
