# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 1
title: Finding the Furry Cat!
tips:
  c1_count_once: Touch each thing as you count it, so you count every one once.
  c1_more_less: Match them one to one. The side with things left over has more.
  m1_inside: "'In the box' means the box is all around it."
  m1_near: "'Close to' means not far."
  m1_on: "The ball is on top. Is that above or below the table?"
  m1_opposite_inside: "Opposite means the other way. If you are not in, you are ..."
  m1_under: "'Below' means lower down. Is 'on' higher or lower?"
concepts:
- code: cbse1m.cat.where
  title: Where is it? Position words
  notes: |
    Finding a cat hiding around the house: position words such as on, under, inside, outside, near, far, behind, in
    front of, top, bottom, left and right.
  explanations:
    text: Where is the cat? It can be on the bed, under the table, inside the box or behind the door. These are position words. They tell us where something is.
    visual: Draw a table with a cat under it, a ball on it and a box beside it.
    step_by_step: 'Step 1: Find the thing. Step 2: Look at what is near it. Step 3: Say on, under, inside or behind.'
    real_world: 'When you look for your shoes, someone may say: ''They are under the bed!'''
  picture:
    kind: compare
    columns:
    - title: Word
      points:
      - 'on'
      - under
      - inside
    - title: Example
      points:
      - ball on the table
      - cat under the table
      - toy inside the box
    alt: 'On: a ball on the table. Under: a cat under the table. Inside: a toy inside the box.'
  activity:
    type: sort
    prompt: Where is the cat?
    bins:
    - 'On'
    - Under
    - Behind
    items:
    - label: 🐱 sits on top of the bed
      bin: 'On'
      clue: Is the bed below the cat?
      why: The bed is below. The cat is on it.
    - label: 🐱 hides below the table
      bin: Under
      clue: Is the table above the cat?
      why: The table is above. The cat is under it.
    - label: 🐱 hides at the back of the door
      bin: Behind
      clue: Can you see it from the front?
      why: The door is in front. The cat is behind it.
    - label: 🐱 sleeps on top of the mat
      bin: 'On'
      clue: Is the mat below?
      why: The cat is on the mat.
    - label: 🐱 sits below the chair
      bin: Under
      clue: What is above the cat?
      why: The chair is above. The cat is under it.
    - label: 🐱 hides at the back of the curtain
      bin: Behind
      clue: The curtain is in front of it.
      why: The cat is behind the curtain.
  items:
  - prompt: The cat is below the table. The cat is ___ the table.
    options:
    - under
    - 'on'
    - inside
    - behind
    answer: under
    difficulty: 1
    hints:
    - Below means ...
    - Look down.
    solution: The cat is under the table.
    mistakes: {"on": "m1_under"}
  - prompt: The ball is sitting on top of the table. It is ___ the table.
    options:
    - 'on'
    - under
    - inside
    - behind
    answer: 'on'
    difficulty: 1
    hints:
    - On top.
    - Resting on it.
    solution: The ball is on the table.
    mistakes: {"under": "m1_on"}
  - prompt: The toy is in the box. It is ___ the box.
    options:
    - inside
    - outside
    - 'on'
    - under
    answer: inside
    difficulty: 1
    hints:
    - In the box.
    - We can't see it.
    solution: The toy is inside the box.
    mistakes: {"outside": "m1_inside"}
  - prompt: Which is the opposite of 'inside'?
    options:
    - outside
    - under
    - 'on'
    - near
    answer: outside
    difficulty: 2
    hints:
    - Not in.
    - Out ...
    solution: Outside is the opposite of inside.
    mistakes: {"under": "m1_opposite_inside"}
  - prompt: The tree is close to the house. The tree is ___ the house.
    options:
    - near
    - far from
    - inside
    - under
    answer: near
    difficulty: 2
    hints:
    - Close means ...
    - Not far.
    solution: The tree is near the house.
    mistakes: {"far from": "m1_near"}
  - prompt: A cat is hiding. You look under the bed, then behind the door. How many places did you look?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Bed, door.
    - Count them.
    solution: You looked in 2 places.
    mistakes:
      '3': c1_count_once
- code: cbse1m.cat.count
  title: Counting up to 9
  after:
  - cbse1m.cat.where
  notes: |
    Counting things one by one up to 9: cats, balls, birds. Matching a number to a group. The last number said tells
    how many.
  explanations:
    text: 'Count things one by one: 1, 2, 3 ... The last number you say tells how many there are.'
    visual: Draw 5 cats in a row and write 1, 2, 3, 4, 5 under them.
    step_by_step: 'Step 1: Touch the first thing and say 1. Step 2: Touch the next and say 2. Step 3: Keep going. Step 4: The last number is the answer.'
    real_world: We count the people at home to set the right number of plates.
  picture:
    kind: number_line
    from: 0
    to: 9
    step: 1
    points:
    - at: 1
      label: '1'
    - at: 2
      label: '2'
    - at: 3
      label: '3'
    - at: 4
      label: '4'
    - at: 5
      label: '5'
    alt: 'Counting 5 cats on a number line: 1, 2, 3, 4, 5.'
    jumps:
    - from: 0
      to: 1
      label: '+1'
    - from: 1
      to: 2
      label: '+1'
    - from: 2
      to: 3
      label: '+1'
    - from: 3
      to: 4
      label: '+1'
    - from: 4
      to: 5
      label: '+1'
  activity:
    type: number_line
    min: 0
    max: 9
    step: 1
    start: 0
    prompt: Touch each one and count. The last number tells how many.
    goals:
    - prompt: 🐱🐱🐱🐱🐱
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'One cat was missed. Touch each cat: 1, 2, 3, 4, 5.'
      - when:
          v: 6
        say: One cat was counted two times. Touch each only once.
    - prompt: 🐟🐟🐟🐟🐟🐟🐟
      target: 7
      mistakes:
      - when:
          v: 6
        say: 'Count slowly to the end: 5, 6, 7.'
      - when:
          v: 8
        say: One fish was counted twice.
    - prompt: 🧶🧶🧶🧶🧶🧶🧶🧶🧶
      target: 9
      mistakes:
      - when:
          v: 8
        say: 'Count the last ball too: 8, 9.'
  items:
  - prompt: 'Count: 🐱🐱🐱. How many cats?'
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Touch each cat.
    - 1, 2, 3.
    solution: There are 3 cats.
    mistakes:
      '2': c1_count_once
      '4': c1_count_once
  - prompt: 'Count: ⚽⚽⚽⚽⚽. How many balls?'
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count one by one.
    - 1, 2, 3, 4, 5.
    solution: There are 5 balls.
    mistakes:
      '4': c1_count_once
      '6': c1_count_once
  - prompt: What comes after 6?
    answer: '7'
    check: 6 + 1
    difficulty: 1
    hints:
    - Count on one.
    - 5, 6, ...
    solution: After 6 comes 7.
    mistakes:
      '5': c1_count_once
  - prompt: What comes before 4?
    answer: '3'
    check: 4 - 1
    difficulty: 1
    hints:
    - Count back one.
    - '..., 4.'
    solution: Before 4 comes 3.
    mistakes:
      '5': c1_count_once
  - prompt: 'Count: 🐦🐦🐦🐦🐦🐦🐦🐦. How many birds?'
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - Count slowly.
    - Touch each bird.
    solution: There are 8 birds.
    mistakes:
      '7': c1_count_once
      '9': c1_count_once
  - prompt: 'Which group has more? A: 🍎🍎🍎  B: 🍎🍎'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 2
    hints:
    - Count each group.
    - 3 and 2.
    solution: A has 3 and B has 2, so A has more.
    mistakes:
      B: c1_more_less
