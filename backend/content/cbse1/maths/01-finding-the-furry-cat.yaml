# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 1. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 1
title: Finding the Furry Cat!
tips:
  c1_count_once: Touch each thing as you count it, so you count every one once.
  c1_more_less: Match them one to one. The side with things left over has more.
  m1_inside: "'In the box' means the box is all around it."
  m1_near: "'Close to' means not far."
  m1_on: "The ball is on top. Is that above or below the table?"
  m1_opposite_inside: "Opposite means the other way. If you are not in, you are ..."
  m1_under: "'Below' means lower down. Is 'on' higher or lower?"
  c1m1_opp: Opposites are as far apart as they can be, like hot and cold.
  c1m1_pos: Put your hand where the thing is. Is it above, below, in, or beside?
  c1m1_count: Touch each thing once as you count. The last number you say is how many.
  c1m1_order: Say the numbers in order from 1. Which one is next to it?
concepts:
- code: cbse1m.cat.where
  title: Where is it? Position words
  notes: |
    Finding a cat hiding around the house: position words such as on, under, inside, outside, near, far, behind, in
    front of, top, bottom, left and right.
  explanations:
    text: Where is the cat? It can be on the bed, under the table, inside the box or behind the door. These are position words. They tell us where something is.
    visual: Draw a table with a cat under it, a ball on it and a box beside it.
    step_by_step: 'Step 1: Find the thing. Step 2: Look at what is near it. Step 3: Say on, under, inside or behind.'
    real_world: 'When you look for your shoes, someone may say: ''They are under the bed!'''
  picture:
    kind: compare
    columns:
    - title: Word
      points:
      - 'on'
      - under
      - inside
    - title: Example
      points:
      - ball on the table
      - cat under the table
      - toy inside the box
    alt: 'On: a ball on the table. Under: a cat under the table. Inside: a toy inside the box.'
  activity:
    type: sort
    prompt: Where is the cat?
    bins:
    - 'On'
    - Under
    - Behind
    items:
    - label: 🐱 sits on top of the bed
      bin: 'On'
      clue: Is the bed below the cat?
      why: The bed is below. The cat is on it.
    - label: 🐱 hides below the table
      bin: Under
      clue: Is the table above the cat?
      why: The table is above. The cat is under it.
    - label: 🐱 hides at the back of the door
      bin: Behind
      clue: Can you see it from the front?
      why: The door is in front. The cat is behind it.
    - label: 🐱 sleeps on top of the mat
      bin: 'On'
      clue: Is the mat below?
      why: The cat is on the mat.
    - label: 🐱 sits below the chair
      bin: Under
      clue: What is above the cat?
      why: The chair is above. The cat is under it.
    - label: 🐱 hides at the back of the curtain
      bin: Behind
      clue: The curtain is in front of it.
      why: The cat is behind the curtain.
  lesson:
    - teach: 'Position words tell where a thing is. On: on top, touching. Under: below. Inside: in it. Outside: not in it.'
      picture:
        kind: compare
        columns:
        - title: on / under
          points:
          - cup on the table
          - cat under the table
        - title: inside / outside
          points:
          - ball inside the box
          - ball outside the box
        alt: Pictures of on, under, inside and outside.
      check:
        prompt: A bird sits on top of the roof. The bird is ___ the roof.
        options:
        - 'on'
        - under
        - inside
        answer: 'on'
        why: The bird is on top, touching the roof.
      ways:
      - style: step_by_step
        teach: 'Play ''Where is teddy?''. Step 1: Put a teddy on a chair and say ''on''. Step 2: Move it below the chair and say ''under''. Step 3: Put it in a bag and say ''inside''. Step 4: Take it out of the bag and say ''outside''.'
      - style: real_world
        teach: At home, plates are kept inside a cupboard, slippers are left outside the door, and a clock hangs on the wall.
    - teach: Near means close. Far means a long way away. Behind means at the back. In front of means at the front.
      check:
        prompt: The school bus stops close to your home. It is ___ your home.
        options:
        - near
        - far
        - under
        answer: near
        why: Close by means near.
      ways:
      - style: visual
        teach: Some things that are near to you, and some that are far away.
        picture:
          kind: compare
          columns:
          - title: Near
            points:
            - The school bag beside you
            - The desk in front of you
          - title: Far
            points:
            - The sun in the sky
            - A hill you see from the window
          alt: The school bag beside you and the desk in front of you are near. The sun in the sky and a hill you see from the window are far.
      - style: real_world
        teach: In a school assembly line, the shortest child often stands in front and the tallest child stands behind, so everyone can see.
    - teach: 'Left and right: hold up your hands. The hand you write with is often your right. Top is high up; bottom is low down.'
      check:
        prompt: 'The sun is high up in a picture. It is at the:'
        options:
        - top
        - bottom
        - inside
        answer: top
        why: High up in a picture is the top.
      ways:
      - style: visual
        teach: Things kept at the top and at the bottom of a cupboard.
        picture:
          kind: compare
          columns:
          - title: Top
            points:
            - Books on the top shelf
            - A box kept up high
          - title: Bottom
            points:
            - Shoes on the bottom shelf
            - A mat on the floor below
          alt: Books are on the top shelf and a box is kept up high. Shoes are on the bottom shelf and a mat is on the floor below.
      - style: step_by_step
        teach: 'Find your left hand. Step 1: Hold both hands up in front of you, palms away. Step 2: Stretch out each thumb and first finger. Step 3: The hand that makes the letter ''L'' is your left. Step 4: The other hand is your right.'
  items:
  - prompt: The cat is below the table. The cat is ___ the table.
    options:
    - under
    - 'on'
    - inside
    - behind
    answer: under
    difficulty: 1
    hints:
    - Below means ...
    - Look down.
    solution: The cat is under the table.
    mistakes: {"on": "m1_under"}
  - prompt: The ball is sitting on top of the table. It is ___ the table.
    options:
    - 'on'
    - under
    - inside
    - behind
    answer: 'on'
    difficulty: 1
    hints:
    - On top.
    - Resting on it.
    solution: The ball is on the table.
    mistakes: {"under": "m1_on"}
  - prompt: The toy is in the box. It is ___ the box.
    options:
    - inside
    - outside
    - 'on'
    - under
    answer: inside
    difficulty: 1
    hints:
    - In the box.
    - We can't see it.
    solution: The toy is inside the box.
    mistakes: {"outside": "m1_inside"}
  - prompt: Which is the opposite of 'inside'?
    options:
    - outside
    - under
    - 'on'
    - near
    answer: outside
    difficulty: 2
    hints:
    - Not in.
    - Out ...
    solution: Outside is the opposite of inside.
    mistakes: {"under": "m1_opposite_inside"}
  - prompt: The tree is close to the house. The tree is ___ the house.
    options:
    - near
    - far from
    - inside
    - under
    answer: near
    difficulty: 2
    hints:
    - Close means ...
    - Not far.
    solution: The tree is near the house.
    mistakes: {"far from": "m1_near"}
  - prompt: A cat is hiding. You look under the bed, then behind the door. How many places did you look?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Bed, door.
    - Count them.
    solution: You looked in 2 places.
    mistakes:
      '3': c1_count_once
  - prompt: Shoes are kept below the bed. They are ___ the bed.
    options:
    - under
    - 'on'
    - behind
    answer: under
    difficulty: 1
    hints:
    - Below means lower down.
    - Look down under the bed.
    solution: 'Step 1: Below means lower. Step 2: The shoes are under the bed.'
    mistakes:
      'on': c1m1_pos
      behind: c1m1_pos
  - prompt: The fish swims in the bowl. The fish is ___ the bowl.
    options:
    - inside
    - outside
    - 'on'
    answer: inside
    difficulty: 1
    hints:
    - The water is in the bowl.
    - The fish is in the water.
    solution: 'Step 1: The fish is in the water. Step 2: It is inside the bowl.'
    mistakes:
      outside: c1m1_pos
      'on': c1m1_pos
  - prompt: 'The moon is a long way away. The moon is:'
    options:
    - far
    - near
    - under
    answer: far
    difficulty: 1
    hints:
    - Can you touch the moon?
    - A long way away.
    solution: 'Step 1: The moon is very high up in the sky. Step 2: It is far.'
    mistakes:
      near: c1m1_pos
      under: c1m1_pos
  - prompt: Children stand in a line. Who is in front of everyone?
    options:
    - the first child
    - the last child
    - the middle child
    answer: the first child
    difficulty: 1
    hints:
    - In front means at the start.
    - Who stands at the very start of the line?
    solution: 'Step 1: In front is the start of the line. Step 2: That is the first child.'
    mistakes:
      the last child: c1m1_pos
      the middle child: c1m1_pos
  - prompt: What is the opposite of 'near'?
    options:
    - far
    - 'on'
    - inside
    answer: far
    difficulty: 1
    hints:
    - Near is close.
    - Not close at all is ...
    solution: 'Step 1: Near means close. Step 2: The opposite is far.'
    mistakes:
      'on': c1m1_opp
      inside: c1m1_opp
  - prompt: A cat hides at the back of a door. The cat is ___ the door.
    options:
    - behind
    - 'on'
    - in front of
    answer: behind
    difficulty: 2
    hints:
    - At the back means ...
    - You cannot see it from the front.
    solution: 'Step 1: At the back of the door. Step 2: The cat is behind the door.'
    mistakes:
      'on': c1m1_pos
      in front of: c1m1_pos
  - prompt: What is the opposite of 'top'?
    options:
    - bottom
    - left
    - near
    answer: bottom
    difficulty: 2
    hints:
    - Top is high up.
    - Low down is ...
    solution: 'Step 1: Top is high. Step 2: The opposite is bottom.'
    mistakes:
      left: c1m1_opp
      near: c1m1_opp
  - prompt: A ball is in a box, and the box is under the table. Where is the ball?
    options:
    - inside the box, under the table
    - on the table
    - outside the box
    answer: inside the box, under the table
    difficulty: 2
    hints:
    - First find the box.
    - The ball is in the box.
    solution: 'Step 1: The box is under the table. Step 2: The ball is inside that box.'
    mistakes:
      on the table: c1m1_pos
      outside the box: c1m1_pos
  - prompt: You look for the cat on the bed, under the bed and behind the cupboard. How many places did you look?
    answer: '3'
    check: 1+1+1
    difficulty: 3
    hints:
    - Count each place you looked.
    - On the bed, under the bed, behind the cupboard.
    solution: 'Step 1: on the bed (1), under the bed (2), behind the cupboard (3). Step 2: 3 places.'
    mistakes:
      '2': c1m1_count
      '4': c1m1_count
  - prompt: 'Case: Tara has lost a red ball. Tara''s brother says, ''It is not on the bed. It is not inside the box. It is below the chair.'' Where is the ball?'
    options:
    - under the chair
    - on the bed
    - inside the box
    answer: under the chair
    hints:
    - Which places did the brother say the ball is NOT?
    - Which word means the same as 'below'?
    solution: The ball is below the chair, and 'below' means the same as 'under'. So the ball is under the chair.
    mistakes:
      on the bed: c1m1_pos
      inside the box: c1m1_pos
    exam: case
    difficulty: 2
  - prompt: 'Situation: Your water bottle is at the back of your school bag. You want to tell a friend where it is. Which sentence is right?'
    options:
    - The bottle is behind the bag.
    - The bottle is on top of the bag.
    - The bottle is far from the bag.
    answer: The bottle is behind the bag.
    hints:
    - Is the bottle at the front, at the back, or on top?
    - Which position word means 'at the back'?
    solution: '''Behind'' means at the back. The bottle is at the back of the bag, so it is behind the bag.'
    mistakes:
      The bottle is on top of the bag.: c1m1_pos
      The bottle is far from the bag.: c1m1_pos
    exam: competency
    difficulty: 2
- code: cbse1m.cat.count
  title: Counting up to 9
  after:
  - cbse1m.cat.where
  notes: |
    Counting things one by one up to 9: cats, balls, birds. Matching a number to a group. The last number said tells
    how many.
  explanations:
    text: 'Count things one by one: 1, 2, 3 ... The last number you say tells how many there are.'
    visual: Draw 5 cats in a row and write 1, 2, 3, 4, 5 under them.
    step_by_step: 'Step 1: Touch the first thing and say 1. Step 2: Touch the next and say 2. Step 3: Keep going. Step 4: The last number is the answer.'
    real_world: We count the people at home to set the right number of plates.
  picture:
    kind: number_line
    from: 0
    to: 9
    step: 1
    points:
    - at: 1
      label: '1'
    - at: 2
      label: '2'
    - at: 3
      label: '3'
    - at: 4
      label: '4'
    - at: 5
      label: '5'
    alt: 'Counting 5 cats on a number line: 1, 2, 3, 4, 5.'
    jumps:
    - from: 0
      to: 1
      label: '+1'
    - from: 1
      to: 2
      label: '+1'
    - from: 2
      to: 3
      label: '+1'
    - from: 3
      to: 4
      label: '+1'
    - from: 4
      to: 5
      label: '+1'
  activity:
    type: number_line
    min: 0
    max: 9
    step: 1
    start: 0
    prompt: Touch each one and count. The last number tells how many.
    goals:
    - prompt: 🐱🐱🐱🐱🐱
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'One cat was missed. Touch each cat: 1, 2, 3, 4, 5.'
      - when:
          v: 6
        say: One cat was counted two times. Touch each only once.
    - prompt: 🐟🐟🐟🐟🐟🐟🐟
      target: 7
      mistakes:
      - when:
          v: 6
        say: 'Count slowly to the end: 5, 6, 7.'
      - when:
          v: 8
        say: One fish was counted twice.
    - prompt: 🧶🧶🧶🧶🧶🧶🧶🧶🧶
      target: 9
      mistakes:
      - when:
          v: 8
        say: 'Count the last ball too: 8, 9.'
  lesson:
    - teach: 'To count, touch each thing once and say a number: 1, 2, 3 ... The last number you say tells how many.'
      picture:
        kind: number_line
        from: 0
        to: 9
        points:
        - at: 1
          label: '1'
        - at: 2
          label: '2'
        - at: 3
          label: '3'
        alt: Counting 1, 2, 3 on a number line.
      check:
        prompt: You touch 3 cats and say 1, 2, 3. How many cats?
        options:
        - '3'
        - '1'
        - '2'
        answer: '3'
        why: The last number you say, 3, tells how many.
      ways:
      - style: step_by_step
        teach: 'Count some pencils. Step 1: Put them in a line. Step 2: Touch the first one and say ''one''. Step 3: Move your finger along and say the next number for each pencil. Step 4: The last number you say is how many.'
      - style: real_world
        teach: 'When you set the table for dinner, you count the plates: one plate for each person in the family.'
    - teach: 'Numbers come in order: 1, 2, 3, 4, 5, 6, 7, 8, 9. After 5 comes 6. Before 5 comes 4.'
      picture:
        kind: number_line
        from: 0
        to: 9
        points:
        - at: 4
          label: before
        - at: 5
          label: '5'
        - at: 6
          label: after
        alt: 4 comes before 5 and 6 comes after 5.
      check:
        prompt: Which number comes just after 5?
        options:
        - '6'
        - '4'
        - '7'
        answer: '6'
        why: 5, then 6.
      ways:
      - style: step_by_step
        teach: 'Find the number that comes after. Step 1: Start counting from 1. Step 2: Stop when you say the number you were given. Step 3: The very next number you would say comes after it.'
      - style: real_world
        teach: Lift buttons are numbered in order. If you are on floor 2 and go up one floor, you reach floor 3.
    - teach: To see which group has more, match one thing from each group. The group with things left over has more.
      check:
        prompt: Group A has 4 balls, group B has 2 balls. Which has more?
        options:
        - A
        - B
        - both the same
        answer: A
        why: 'Match them: A has 2 balls left over.'
      ways:
      - style: visual
        teach: Matching cups and saucers one to one to see which group has more.
        picture:
          kind: compare
          columns:
          - title: Cups
            points:
            - cup
            - cup
            - cup
          - title: Saucers
            points:
            - saucer
            - saucer
            - saucer
            - saucer
            - saucer
          alt: There are 3 cups and 5 saucers. When each cup is put on a saucer, 2 saucers are left over, so there are more saucers.
      - style: real_world
        teach: In musical chairs there is one chair fewer than the number of children. When the music stops, one child has no chair, so there are more children than chairs.
  items:
  - prompt: 'Count: 🐱🐱🐱. How many cats?'
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Touch each cat.
    - 1, 2, 3.
    solution: There are 3 cats.
    mistakes:
      '2': c1_count_once
      '4': c1_count_once
  - prompt: 'Count: ⚽⚽⚽⚽⚽. How many balls?'
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count one by one.
    - 1, 2, 3, 4, 5.
    solution: There are 5 balls.
    mistakes:
      '4': c1_count_once
      '6': c1_count_once
  - prompt: What comes after 6?
    answer: '7'
    check: 6 + 1
    difficulty: 1
    hints:
    - Count on one.
    - 5, 6, ...
    solution: After 6 comes 7.
    mistakes:
      '5': c1_count_once
  - prompt: What comes before 4?
    answer: '3'
    check: 4 - 1
    difficulty: 1
    hints:
    - Count back one.
    - '..., 4.'
    solution: Before 4 comes 3.
    mistakes:
      '5': c1_count_once
  - prompt: 'Count: 🐦🐦🐦🐦🐦🐦🐦🐦. How many birds?'
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - Count slowly.
    - Touch each bird.
    solution: There are 8 birds.
    mistakes:
      '7': c1_count_once
      '9': c1_count_once
  - prompt: 'Which group has more? A: 🍎🍎🍎  B: 🍎🍎'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 2
    hints:
    - Count each group.
    - 3 and 2.
    solution: A has 3 and B has 2, so A has more.
    mistakes:
      B: c1_more_less
  - prompt: 'Count: 🐟🐟🐟🐟. How many fish?'
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Touch each fish once.
    - 1, 2, 3, ...
    solution: 'Step 1: 1, 2, 3, 4. Step 2: 4 fish.'
    mistakes:
      '3': c1m1_count
      '5': c1m1_count
  - prompt: 'Count: 🌼🌼🌼🌼🌼🌼. How many flowers?'
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Touch each flower once.
    - Count slowly.
    solution: 'Step 1: 1, 2, 3, 4, 5, 6. Step 2: 6 flowers.'
    mistakes:
      '5': c1m1_count
      '7': c1m1_count
  - prompt: What comes just after 8?
    answer: '9'
    check: 8+1
    difficulty: 1
    hints:
    - Count on from 8.
    - 7, 8, ...
    solution: 'Step 1: 7, 8, then the next number. Step 2: 9.'
    mistakes:
      '7': c1m1_order
      '10': c1m1_order
  - prompt: What comes just before 2?
    answer: '1'
    check: 2-1
    difficulty: 1
    hints:
    - Count from the start.
    - '..., 2, 3'
    solution: 'Step 1: Counting starts 1, 2. Step 2: Before 2 is 1.'
    mistakes:
      '3': c1m1_order
      '0': c1m1_order
  - prompt: 'Which group has fewer? A: 🍌🍌🍌🍌  B: 🍌🍌'
    options:
    - B
    - A
    - both the same
    answer: B
    difficulty: 1
    hints:
    - Match one banana from each group.
    - Which group runs out first?
    solution: 'Step 1: Match 2 pairs. Step 2: B runs out first, so B has fewer.'
    mistakes:
      A: c1_more_less
      both the same: c1_more_less
  - prompt: 'Count: 🐞🐞🐞🐞🐞🐞🐞. How many ladybirds?'
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - Touch each one once.
    - Do not skip any.
    solution: 'Step 1: 1, 2, 3, 4, 5, 6, 7. Step 2: 7 ladybirds.'
    mistakes:
      '6': c1m1_count
      '8': c1m1_count
  - prompt: Which number is between 3 and 5?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Say 3, ..., 5.
    - Which number sits in the middle?
    solution: 'Step 1: 3, 4, 5. Step 2: 4 is between them.'
    mistakes:
      '6': c1m1_order
      '2': c1m1_order
  - prompt: Group A has 5 cars and group B has 5 cars. Which has more?
    options:
    - both the same
    - A
    - B
    answer: both the same
    difficulty: 2
    hints:
    - Match one car from each group.
    - Is anything left over?
    solution: 'Step 1: Match all 5 pairs. Step 2: Nothing is left over, so they are the same.'
    mistakes:
      A: c1_more_less
      B: c1_more_less
  - prompt: There are 4 cats on a wall. 1 more cat jumps up. How many cats now?
    answer: '5'
    check: 4+1
    difficulty: 3
    hints:
    - Start at 4.
    - One more means the next number.
    solution: 'Step 1: Start at 4. Step 2: One more makes 5.'
    mistakes:
      '4': c1m1_order
      '6': c1m1_order
  - prompt: 'Case: Five children come to a birthday party, but there are only 4 party hats. If each child takes one hat, what happens?'
    options:
    - One child has no hat, so there are more children than hats
    - Every child gets a hat
    - There are more hats than children
    answer: One child has no hat, so there are more children than hats
    hints:
    - Give one hat to each child in your mind.
    - Is anyone left over? Children or hats?
    solution: Matching one hat to each child uses all 4 hats, and 1 child is left without one. So there are more children than hats.
    mistakes:
      Every child gets a hat: c1_more_less
      There are more hats than children: c1_more_less
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are putting crayons back in their box. You touch each one and count: 1, 2, 3, 4, 5, 6, 7. How many crayons are there?'
    options:
    - '7'
    - '6'
    - '8'
    answer: '7'
    hints:
    - What was the last number you said?
    - Did you touch each crayon once?
    solution: When you touch each crayon once, the last number you say tells how many. The last number was 7.
