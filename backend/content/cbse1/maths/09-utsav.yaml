# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 9
title: Utsav
tips:
  m1_flag: "Bunting flags have three sides and a point at the bottom."
  c1m9_pat: Say the pattern out loud. Find the part that repeats, then say it again.
  c1m9_shape: Trace the shape with your finger. Count the corners and straight sides.

concepts:
- code: cbse1m.utsav.patterns
  title: Patterns in festival decorations
  notes: |
    Patterns in rangoli, garlands, kites and lamps: repeating colours, shapes and sizes. What comes next.
  explanations:
    text: 'At a festival (utsav) we decorate with patterns: red, yellow, red, yellow. Find the part that repeats, then you know what comes next.'
    visual: 'Draw a string of lamps: big, small, big, small, big, and ask what comes next.'
    step_by_step: 'Step 1: Say the pattern aloud. Step 2: Find what repeats. Step 3: Continue it.'
    real_world: Mango-leaf torans and flower garlands at the door show repeating patterns.
  picture:
    kind: flow
    steps:
    - 🔴
    - 🟡
    - 🔴
    - 🟡
    - '?'
    alt: 'A garland pattern: red, yellow, red, yellow, and next comes red.'
  activity:
    type: sort
    prompt: What comes next in the decoration?
    bins:
    - 🔴 Red
    - 🟡 Yellow
    - 🟢 Green
    items:
    - label: 🔴🟡🔴🟡🔴 ...
      bin: 🟡 Yellow
      clue: They take turns.
      why: Red, yellow, red, yellow. Yellow comes next.
    - label: 🟢🟢🔴🟢🟢 ...
      bin: 🔴 Red
      clue: Two of one colour, then one of another.
      why: Green, green, red. Red comes next.
    - label: 🔴🟡🟢🔴🟡 ...
      bin: 🟢 Green
      clue: The part that repeats has three colours.
      why: Red, yellow, green. Green comes next.
    - label: 🟡🟡🔴🔴🟡🟡🔴 ...
      bin: 🔴 Red
      clue: Each colour comes two times.
      why: Two yellow, two red. Red comes again.
    - label: 🟢🔴🔴🟢🔴🔴🟢 ...
      bin: 🔴 Red
      clue: One, then two of another.
      why: Green, red, red. After green comes red.
  lesson:
    - teach: A pattern repeats in the same order again and again. Red, green, red, green ... The part that repeats is 'red, green'.
      picture:
        kind: flow
        steps:
        - red
        - green
        - red
        - green
        - '?'
        alt: A repeating pattern of red and green.
      check:
        prompt: Blue, yellow, blue, yellow, ___ ?
        options:
        - blue
        - yellow
        - red
        answer: blue
        why: The part 'blue, yellow' repeats, so blue comes next.
      ways:
      - style: step_by_step
        teach: 'Make a bead pattern. Step 1: Choose two colours, like yellow and blue. Step 2: Thread one yellow bead, then one blue bead. Step 3: Repeat: yellow, blue, yellow, blue. Step 4: Check that each pair looks the same.'
      - style: real_world
        teach: Rangoli borders at Diwali and Onam often repeat the same flower and leaf again and again around the edge.
    - teach: 'Patterns can use colours, shapes, sizes, sounds or numbers: clap, stamp, clap, stamp. 1, 2, 3, 1, 2, 3.'
      check:
        prompt: Clap, stamp, clap, stamp, ___ ?
        options:
        - clap
        - stamp
        - jump
        answer: clap
        why: Clap, stamp repeats.
      ways:
      - style: visual
        teach: Patterns can be made with sounds, numbers or sizes.
        picture:
          kind: compare
          columns:
          - title: Kind of pattern
            points:
            - Sound
            - Number
            - Size
          - title: Example
            points:
            - clap, clap, stamp
            - 5, 6, 5, 6
            - tall, short, tall, short
          alt: 'A sound pattern: clap, clap, stamp. A number pattern: 5, 6, 5, 6. A size pattern: tall, short, tall, short.'
      - style: real_world
        teach: 'Many folk dances repeat the same steps again and again: step, step, turn; step, step, turn.'
    - teach: 'Some patterns repeat a longer part: ★ ○ ○ ★ ○ ○. Find the part (★ ○ ○), then keep going.'
      check:
        prompt: ★ ○ ○ ★ ○ ○ ★ ___ ?
        options:
        - ○
        - ★
        - △
        answer: ○
        why: After ★ come two ○.
      ways:
      - style: visual
        teach: Longer patterns, and the part that repeats in each one.
        picture:
          kind: compare
          columns:
          - title: Pattern
            points:
            - X Y Y X Y Y
            - sun, moon, moon, sun, moon, moon
          - title: Part that repeats
            points:
            - X Y Y
            - sun, moon, moon
          alt: In X Y Y X Y Y the part that repeats is X Y Y. In sun, moon, moon, sun, moon, moon the part that repeats is sun, moon, moon.
      - style: step_by_step
        teach: 'Continue a long pattern. Step 1: Read it: drum, bell, bell, drum, bell, bell. Step 2: Find the part that repeats: drum, bell, bell. Step 3: Say that part once more to keep going.'
  items:
  - prompt: Red, yellow, red, yellow, ___ ?
    options:
    - red
    - yellow
    - green
    answer: red
    difficulty: 1
    hints:
    - Two colours repeat.
    - After yellow comes ...
    solution: Red comes next.
    mistakes: {"yellow": "m5_alternate"}
  - prompt: 🌸 🍃 🌸 🍃 🌸 ___ ?
    options:
    - 🍃
    - 🌸
    - ⭐
    answer: 🍃
    difficulty: 1
    hints:
    - Flower, leaf ...
    - Repeat.
    solution: A leaf comes next.
    mistakes: {"🌸": "m5_alternate"}
  - prompt: Big, small, big, small, ___ ?
    options:
    - big
    - small
    - medium
    answer: big
    difficulty: 1
    hints:
    - Two sizes repeat.
    - After small comes ...
    solution: Big comes next.
    mistakes: {"small": "m5_alternate"}
  - prompt: △ ○ ○ △ ○ ○ ___ ?
    options:
    - △
    - ○
    - □
    answer: △
    difficulty: 2
    hints:
    - The part that repeats has 3 shapes.
    - △ ○ ○.
    solution: △ comes next.
    mistakes: {"○": "m4_core"}
  - prompt: 1, 2, 1, 2, 1, __ ?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 1 and 2 repeat.
    - After 1 comes ...
    solution: 2 comes next.
    mistakes:
      '3': c1_count_once
  - prompt: Which is a pattern?
    options:
    - red, blue, red, blue
    - red, blue, green, pink
    - blue, red, red, green
    answer: red, blue, red, blue
    difficulty: 2
    hints:
    - Something must repeat.
    - The same order again.
    solution: Red, blue repeats, so it is a pattern.
    mistakes: {"red, blue, green, pink": "m4_repeating"}
  - prompt: 🪔 🌸 🪔 🌸 🪔 ___ ?
    options:
    - 🌸
    - 🪔
    - ⭐
    answer: 🌸
    difficulty: 1
    hints:
    - Lamp, flower, lamp, flower ...
    - What comes after a lamp?
    solution: 'Step 1: The part is 🪔 🌸. Step 2: After 🪔 comes 🌸.'
    mistakes:
      🪔: c1m9_pat
      ⭐: c1m9_pat
  - prompt: Up, down, up, down, ___ ?
    options:
    - up
    - down
    - left
    answer: up
    difficulty: 1
    hints:
    - Two words repeat.
    - What comes after down?
    solution: 'Step 1: ''up, down'' repeats. Step 2: After down comes up.'
    mistakes:
      down: c1m9_pat
      left: c1m9_pat
  - prompt: 2, 4, 2, 4, 2, ___ ?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Two numbers take turns.
    - What comes after 2?
    solution: 'Step 1: 2, 4 repeats. Step 2: After 2 comes 4.'
    mistakes:
      '2': c1m9_pat
      '6': c1m9_pat
  - prompt: Which is NOT a pattern?
    options:
    - red, blue, green, red, red
    - red, blue, red, blue
    - big, small, big, small
    answer: red, blue, green, red, red
    difficulty: 1
    hints:
    - A pattern repeats the same part.
    - Which one has no repeating part?
    solution: 'Step 1: Two of them repeat a part. Step 2: ''red, blue, green, red, red'' does not repeat.'
    mistakes:
      red, blue, red, blue: c1m9_pat
      big, small, big, small: c1m9_pat
  - prompt: ▲ ▲ ● ▲ ▲ ● ▲ ▲ ___ ?
    options:
    - ●
    - ▲
    - ■
    answer: ●
    difficulty: 2
    hints:
    - The part has three shapes.
    - Two triangles, then ...
    solution: 'Step 1: The part is ▲ ▲ ●. Step 2: After two ▲ comes ●.'
    mistakes:
      ▲: c1m9_pat
      ■: c1m9_pat
  - prompt: 1, 2, 3, 1, 2, 3, 1, ___ ?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Three numbers repeat.
    - What comes after 1?
    solution: 'Step 1: 1, 2, 3 repeats. Step 2: After 1 comes 2.'
    mistakes:
      '3': c1m9_pat
      '4': c1m9_pat
  - prompt: 'A garland goes: rose, rose, marigold, rose, rose, marigold. How many roses in the first 6 flowers?'
    answer: '4'
    check: 2+2
    difficulty: 2
    hints:
    - Count only the roses.
    - Two in each part.
    solution: 'Step 1: Each part has 2 roses. Step 2: 2 parts: 2 + 2 = 4 roses.'
    mistakes:
      '6': c1m9_pat
      '2': c1m9_pat
  - prompt: Big kite, small kite, big kite, small kite. What is the 6th kite?
    options:
    - small kite
    - big kite
    - no kite
    answer: small kite
    difficulty: 3
    hints:
    - Odd places are big, even places are ...
    - 'Say it: 1 big, 2 small, 3 big ...'
    solution: 'Step 1: 1 big, 2 small, 3 big, 4 small, 5 big. Step 2: 6 is small.'
    mistakes:
      big kite: c1m9_pat
      no kite: c1m9_pat
  - prompt: 🔴 🔵 🔵 🔴 🔵 🔵 🔴. How many 🔵 are there?
    answer: '4'
    check: 2+2
    difficulty: 3
    hints:
    - Count only the blue ones.
    - Each part has 2 blue.
    solution: 'Step 1: There are two full parts with 2 blue each. Step 2: 2 + 2 = 4 blue.'
    mistakes:
      '3': c1m9_pat
      '7': c1m9_pat
  - prompt: 'Case: A garland is made like this: marigold, jasmine, marigold, jasmine, marigold, rose. Riya says the whole garland is a pattern. Is Riya right?'
    options:
    - No, the rose breaks the pattern
    - Yes, it is a pattern
    - Yes, because every garland is a pattern
    answer: No, the rose breaks the pattern
    hints:
    - What part repeats at the start?
    - Does the last flower follow that part?
    solution: The part 'marigold, jasmine' repeats, so jasmine should come next. A rose comes instead, which breaks the pattern.
    mistakes:
      Yes, it is a pattern: c1m9_pat
      Yes, because every garland is a pattern: c1m9_pat
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are drawing a border on a card: star, heart, heart, star, heart, heart. What should you draw next?'
    options:
    - star
    - heart
    - circle
    answer: star
    hints:
    - Find the part that repeats.
    - What does that part start with?
    solution: The part 'star, heart, heart' repeats. It has just ended, so the next shape is a star.
    mistakes:
      heart: c1m9_pat
      circle: c1m9_pat
    exam: competency
    difficulty: 2
- code: cbse1m.utsav.shapes
  title: Shapes in decorations
  after:
  - cbse1m.utsav.patterns
  notes: |
    Flat shapes in decorations: circle, triangle, square, rectangle. Counting corners and sides. Kites, flags and lamps.
  explanations:
    text: 'Festival decorations use shapes: round lamps (circles), triangle flags, square kites. A triangle has 3 corners; a square has 4; a circle has none.'
    visual: Draw a string of triangle flags and a square kite with a round sun above.
    step_by_step: 'Step 1: Look at the shape. Step 2: Count its corners. Step 3: Name it.'
    real_world: Small triangle flags (buntings) hang across streets at festivals.
  picture:
    kind: bars
    bars:
    - label: circle
      value: 0
    - label: triangle
      value: 3
    - label: square
      value: 4
    alt: 'Corners: circle 0, triangle 3, square 4.'
    unit: corners
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Circle
    - Triangle
    - Square
    items:
    - label: 🪔 The top of a round diya
      bin: Circle
      clue: Any corners?
      why: 'No corners, round: a circle.'
    - label: 🚩 A flag with 3 corners
      bin: Triangle
      clue: Count its corners.
      why: '3 corners: a triangle.'
    - label: 🪁 A kite with 4 equal sides, standing on a corner
      bin: Square
      clue: Turn it. Are all 4 sides the same?
      why: Turned on a corner, it is still a square.
    - label: 🎡 A big wheel
      bin: Circle
      clue: Is it round?
      why: 'Round: a circle.'
    - label: 🔺 A paper flag on the garland
      bin: Triangle
      clue: Count the sides.
      why: '3 sides: a triangle.'
    - label: 🔲 A rangoli box with 4 equal sides
      bin: Square
      clue: Equal sides?
      why: '4 equal sides: a square.'
  lesson:
    - teach: 'Flat shapes: a circle is round with no corners. A triangle has 3 sides and 3 corners. A square has 4 equal sides and 4 corners. A rectangle has 4 sides and 4 corners, two long and two short.'
      picture:
        kind: compare
        columns:
        - title: shape
          points:
          - circle
          - triangle
          - square
          - rectangle
        - title: corners
          points:
          - '0'
          - '3'
          - '4'
          - '4'
        alt: Shapes and their number of corners.
      check:
        prompt: Which shape has 3 corners?
        options:
        - triangle
        - circle
        - square
        answer: triangle
        why: 'Tri means three: 3 sides, 3 corners.'
      ways:
      - style: step_by_step
        teach: 'Make shapes with sticks. Step 1: Join the ends of 3 sticks: a triangle. Step 2: Join 4 sticks of the same length: a square. Step 3: Join 2 long sticks and 2 short sticks: a rectangle.'
      - style: real_world
        teach: Road signs come in different shapes. Many warning signs are triangles, and some other signs are circles.
    - teach: 'Festival shapes: a diya and a bangle look round (circle). Bunting flags are often triangles. A kite looks like a diamond. A gift box face is a square or rectangle.'
      check:
        prompt: 'A bangle is shaped like a:'
        options:
        - circle
        - triangle
        - rectangle
        answer: circle
        why: A bangle is round with no corners.
      ways:
      - style: visual
        teach: Some flat shapes, and where you might see them at a festival.
        picture:
          kind: compare
          columns:
          - title: Shape
            points:
            - Circle
            - Triangle
            - Square
          - title: Seen at a festival
            points:
            - A round papad
            - A slice of a paper pinwheel
            - A square rangoli tile
          alt: A round papad is a circle, a slice of a paper pinwheel is a triangle, and a rangoli tile can be a square.
      - style: real_world
        teach: Many kites look like a square standing on one of its corners, which is why we call that shape a diamond.
    - teach: Count corners to tell shapes apart. 2 triangles have 3 + 3 = 6 corners. A square and a triangle have 4 + 3 = 7 corners.
      check:
        prompt: How many corners do 2 squares have?
        options:
        - '8'
        - '4'
        - '6'
        answer: '8'
        why: 4 + 4 = 8.
      ways:
      - style: visual
        teach: Counting the corners of some flat shapes, one shape at a time.
        picture:
          kind: bars
          bars:
          - label: 1 circle
            value: 0
          - label: 1 rectangle
            value: 4
          - label: 2 rectangles
            value: 8
          alt: 'A circle has 0 corners. A rectangle has 4 corners. 2 rectangles have 4 and 4 more: 8 corners.'
      - style: real_world
        teach: 'A string of 4 triangle flags has 3, 6, 9, 12 corners: 3 more for each flag.'
  items:
  - prompt: 'A flag on a string is often a:'
    options:
    - triangle
    - circle
    - square
    answer: triangle
    difficulty: 1
    hints:
    - 3 corners.
    - Pointed.
    solution: Bunting flags are triangles.
    mistakes: {"circle": "m1_flag"}
  - prompt: How many corners does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Count the points.
    - Tri means three.
    solution: A triangle has 3 corners.
    mistakes:
      '4': c1_count_once
  - prompt: How many corners does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count the points.
    - Like a kite.
    solution: A square has 4 corners.
    mistakes:
      '3': c1_count_once
  - prompt: Which shape has no corners?
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 1
    hints:
    - Round.
    - Like a coin.
    solution: A circle has no corners.
    mistakes: {"square": "m5_no_corners"}
  - prompt: 2 triangle flags. How many corners in all?
    answer: '6'
    check: 2*3
    difficulty: 2
    hints:
    - 3 + 3.
    - Each has 3.
    solution: 3 + 3 = 6.
    mistakes:
      '5': c1_count_once
  - prompt: 'A round diya from the top looks like a:'
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 2
    hints:
    - Round.
    - No corners.
    solution: It looks like a circle.
    mistakes: {"square": "m4_glass_top"}
  - prompt: How many sides does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Trace it with your finger.
    - Count the straight lines.
    solution: 'Step 1: Trace the edges. Step 2: 3 sides.'
    mistakes:
      '4': c1m9_shape
      '2': c1m9_shape
  - prompt: 'A door is shaped like a:'
    options:
    - rectangle
    - circle
    - triangle
    answer: rectangle
    difficulty: 1
    hints:
    - It has 4 corners.
    - Two long sides and two short sides.
    solution: 'Step 1: A door has 4 corners. Step 2: Long and short sides: a rectangle.'
    mistakes:
      circle: c1m9_shape
      triangle: c1m9_shape
  - prompt: How many corners does a rectangle have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Think of a door or a book.
    - Touch each corner.
    solution: 'Step 1: Touch each corner of a book. Step 2: 4 corners.'
    mistakes:
      '3': c1m9_shape
      '0': c1m9_shape
  - prompt: 'A coin is shaped like a:'
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 1
    hints:
    - It can roll on its edge.
    - No corners.
    solution: 'Step 1: A coin has no corners. Step 2: It is a circle.'
    mistakes:
      square: c1m9_shape
      triangle: c1m9_shape
  - prompt: Which shape has all 4 sides the same length?
    options:
    - square
    - rectangle
    - triangle
    answer: square
    difficulty: 2
    hints:
    - A rectangle has long and short sides.
    - A triangle has only 3 sides.
    solution: 'Step 1: Rectangle sides differ; triangle has 3. Step 2: A square has 4 equal sides.'
    mistakes:
      rectangle: c1m9_shape
      triangle: c1m9_shape
  - prompt: How many corners do 3 triangles have in all?
    answer: '9'
    check: 3+3+3
    difficulty: 2
    hints:
    - Each triangle has 3 corners.
    - 3, 6, ...
    solution: 'Step 1: 3 + 3 + 3. Step 2: 9 corners.'
    mistakes:
      '6': c1m9_shape
      '3': c1m9_shape
  - prompt: A string has 5 triangle flags. How many sides in all?
    answer: '15'
    check: 3*5
    difficulty: 3
    hints:
    - Each flag has 3 sides.
    - 'Count in threes: 3, 6, 9, ...'
    solution: 'Step 1: 3, 6, 9, 12, 15. Step 2: 15 sides.'
    mistakes:
      '8': c1m9_shape
      '5': c1m9_shape
  - prompt: One square and one triangle. How many corners in all?
    answer: '7'
    check: 4+3
    difficulty: 2
    hints:
    - Square 4, triangle 3.
    - Add them.
    solution: 'Step 1: 4 + 3. Step 2: 7 corners.'
    mistakes:
      '6': c1m9_shape
      '8': c1m9_shape
  - prompt: Fold a square in half corner to corner. What shape do you get?
    options:
    - triangle
    - circle
    - square
    answer: triangle
    difficulty: 3
    hints:
    - Fold along the line from one corner to the opposite corner.
    - Count the corners of the new shape.
    solution: 'Step 1: The fold makes a shape with 3 sides. Step 2: It is a triangle.'
    mistakes:
      circle: c1m9_shape
      square: c1m9_shape
  - prompt: 'Case: Asha draws a shape with 4 corners. Two of its sides are long and two are short. Asha calls it a square. Is that right?'
    options:
    - No, it is a rectangle
    - Yes, it is a square
    - No, it is a triangle
    answer: No, it is a rectangle
    hints:
    - Are all 4 sides the same length?
    - Which shape has 2 long sides and 2 short sides?
    solution: A square has 4 equal sides. A shape with 2 long and 2 short sides and 4 corners is a rectangle.
    mistakes:
      Yes, it is a square: c1m9_shape
      No, it is a triangle: c1m9_shape
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are making bunting with 2 square flags and 1 triangle flag. How many corners are there in all?'
    options:
    - '11'
    - '7'
    - '12'
    answer: '11'
    hints:
    - How many corners does one square have? One triangle?
    - Add the corners of all 3 flags.
    solution: 'Each square has 4 corners: 4 and 4 is 8. The triangle has 3 more: 9, 10, 11. So 11 corners.'
    mistakes:
      '7': c1m9_shape
      '12': c1m9_shape
    exam: competency
    difficulty: 2
