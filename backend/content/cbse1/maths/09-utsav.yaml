# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 9
title: Utsav
concepts:
- code: cbse1m.utsav.patterns
  title: Patterns in festival decorations
  notes: |
    Patterns in rangoli, garlands, kites and lamps: repeating colours, shapes and sizes. What comes next.
  explanations:
    text: 'At a festival (utsav) we decorate with patterns: red, yellow, red, yellow. Find the part that repeats, then you know what comes next.'
    visual: 'Draw a string of lamps: big, small, big, small, big, and ask what comes next.'
    step_by_step: 'Step 1: Say the pattern aloud. Step 2: Find what repeats. Step 3: Continue it.'
    real_world: Mango-leaf torans and flower garlands at the door show repeating patterns.
  picture:
    kind: flow
    steps:
    - 🔴
    - 🟡
    - 🔴
    - 🟡
    - '?'
    alt: 'A garland pattern: red, yellow, red, yellow, and next comes red.'
  activity:
    type: sort
    prompt: What comes next in the decoration?
    bins:
    - 🔴 Red
    - 🟡 Yellow
    - 🟢 Green
    items:
    - label: 🔴🟡🔴🟡🔴 ...
      bin: 🟡 Yellow
      clue: They take turns.
      why: Red, yellow, red, yellow. Yellow comes next.
    - label: 🟢🟢🔴🟢🟢 ...
      bin: 🔴 Red
      clue: Two of one colour, then one of another.
      why: Green, green, red. Red comes next.
    - label: 🔴🟡🟢🔴🟡 ...
      bin: 🟢 Green
      clue: The part that repeats has three colours.
      why: Red, yellow, green. Green comes next.
    - label: 🟡🟡🔴🔴🟡🟡🔴 ...
      bin: 🔴 Red
      clue: Each colour comes two times.
      why: Two yellow, two red. Red comes again.
    - label: 🟢🔴🔴🟢🔴🔴🟢 ...
      bin: 🔴 Red
      clue: One, then two of another.
      why: Green, red, red. After green comes red.
  items:
  - prompt: Red, yellow, red, yellow, ___ ?
    options:
    - red
    - yellow
    - green
    answer: red
    difficulty: 1
    hints:
    - Two colours repeat.
    - After yellow comes ...
    solution: Red comes next.
  - prompt: 🌸 🍃 🌸 🍃 🌸 ___ ?
    options:
    - 🍃
    - 🌸
    - ⭐
    answer: 🍃
    difficulty: 1
    hints:
    - Flower, leaf ...
    - Repeat.
    solution: A leaf comes next.
  - prompt: Big, small, big, small, ___ ?
    options:
    - big
    - small
    - medium
    answer: big
    difficulty: 1
    hints:
    - Two sizes repeat.
    - After small comes ...
    solution: Big comes next.
  - prompt: △ ○ ○ △ ○ ○ ___ ?
    options:
    - △
    - ○
    - □
    answer: △
    difficulty: 2
    hints:
    - The part that repeats has 3 shapes.
    - △ ○ ○.
    solution: △ comes next.
  - prompt: 1, 2, 1, 2, 1, __ ?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 1 and 2 repeat.
    - After 1 comes ...
    solution: 2 comes next.
    mistakes:
      '3': c1_count_once
  - prompt: Which is a pattern?
    options:
    - red, blue, red, blue
    - red, blue, green, pink
    - blue, red, red, green
    answer: red, blue, red, blue
    difficulty: 2
    hints:
    - Something must repeat.
    - The same order again.
    solution: Red, blue repeats, so it is a pattern.
- code: cbse1m.utsav.shapes
  title: Shapes in decorations
  after:
  - cbse1m.utsav.patterns
  notes: |
    Flat shapes in decorations: circle, triangle, square, rectangle. Counting corners and sides. Kites, flags and lamps.
  explanations:
    text: 'Festival decorations use shapes: round lamps (circles), triangle flags, square kites. A triangle has 3 corners; a square has 4; a circle has none.'
    visual: Draw a string of triangle flags and a square kite with a round sun above.
    step_by_step: 'Step 1: Look at the shape. Step 2: Count its corners. Step 3: Name it.'
    real_world: Small triangle flags (buntings) hang across streets at festivals.
  picture:
    kind: bars
    bars:
    - label: circle
      value: 0
    - label: triangle
      value: 3
    - label: square
      value: 4
    alt: 'Corners: circle 0, triangle 3, square 4.'
    unit: corners
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Circle
    - Triangle
    - Square
    items:
    - label: 🪔 The top of a round diya
      bin: Circle
      clue: Any corners?
      why: 'No corners, round: a circle.'
    - label: 🚩 A flag with 3 corners
      bin: Triangle
      clue: Count its corners.
      why: '3 corners: a triangle.'
    - label: 🪁 A kite with 4 equal sides, standing on a corner
      bin: Square
      clue: Turn it. Are all 4 sides the same?
      why: Turned on a corner, it is still a square.
    - label: 🎡 A big wheel
      bin: Circle
      clue: Is it round?
      why: 'Round: a circle.'
    - label: 🔺 A paper flag on the garland
      bin: Triangle
      clue: Count the sides.
      why: '3 sides: a triangle.'
    - label: 🔲 A rangoli box with 4 equal sides
      bin: Square
      clue: Equal sides?
      why: '4 equal sides: a square.'
  items:
  - prompt: 'A flag on a string is often a:'
    options:
    - triangle
    - circle
    - square
    answer: triangle
    difficulty: 1
    hints:
    - 3 corners.
    - Pointed.
    solution: Bunting flags are triangles.
  - prompt: How many corners does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Count the points.
    - Tri means three.
    solution: A triangle has 3 corners.
    mistakes:
      '4': c1_count_once
  - prompt: How many corners does a square have?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count the points.
    - Like a kite.
    solution: A square has 4 corners.
    mistakes:
      '3': c1_count_once
  - prompt: Which shape has no corners?
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 1
    hints:
    - Round.
    - Like a coin.
    solution: A circle has no corners.
  - prompt: 2 triangle flags. How many corners in all?
    answer: '6'
    check: 2*3
    difficulty: 2
    hints:
    - 3 + 3.
    - Each has 3.
    solution: 3 + 3 = 6.
    mistakes:
      '5': c1_count_once
  - prompt: 'A round diya from the top looks like a:'
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 2
    hints:
    - Round.
    - No corners.
    solution: It looks like a circle.
