# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 7
title: Lina's Family
concepts:
- code: cbse1m.lina.order
  title: 'First, second, third: order'
  notes: |
    Order words: first, second, third, last. Who is older and younger in a family; the order in a line.
  explanations:
    text: When people stand in a line, we say first, second, third ... and last. In a family, some are older and some are younger.
    visual: Draw 4 children in a line and write 1st, 2nd, 3rd and 4th (last) under them.
    step_by_step: 'Step 1: Find the front of the line. Step 2: Count from the front: first, second, third. Step 3: The one at the end is last.'
    real_world: In a race the child who finishes first wins.
  picture:
    kind: flow
    steps:
    - 1st
    - 2nd
    - 3rd
    - last
    alt: 'A line of four: first, second, third and last.'
  activity:
    type: order
    prompt: Children stand in a line by height, shortest first. Put them in order.
    steps:
    - Tinu (the shortest)
    - Lina (a little taller than Tinu)
    - Arun (taller than Lina)
    - Meera (the tallest, last)
    reasons:
      Lina (a little taller than Tinu): Lina is taller than Tinu, so she comes after him.
      Arun (taller than Lina): Arun is taller than Lina, so he stands after her.
      Meera (the tallest, last): Meera is the tallest, so she comes last.
  items:
  - prompt: Who is at the very front of a line?
    options:
    - first
    - last
    - second
    - third
    answer: first
    difficulty: 1
    hints:
    - The front.
    - Number 1.
    solution: The child at the front is first.
  - prompt: Who comes after first?
    options:
    - second
    - third
    - last
    - zero
    answer: second
    difficulty: 1
    hints:
    - 1st, then ...
    - 2nd.
    solution: Second comes after first.
  - prompt: Lina's grandmother is ___ than Lina.
    options:
    - older
    - younger
    - the same age
    answer: older
    difficulty: 1
    hints:
    - She was born long before.
    - Grandmother.
    solution: Grandmother is older.
  - prompt: Lina's baby brother is ___ than Lina.
    options:
    - younger
    - older
    - the same age
    answer: younger
    difficulty: 2
    hints:
    - A baby.
    - Born after Lina.
    solution: The baby is younger.
  - prompt: 4 children are in a line. Lina is last. What number is she?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Count from the front.
    - 1, 2, 3, 4.
    solution: The last of 4 is 4th.
    mistakes:
      '1': c1_count_once
  - prompt: Which comes third?
    options:
    - C in A, B, C, D
    - A in A, B, C, D
    - D in A, B, C, D
    answer: C in A, B, C, D
    difficulty: 2
    hints:
    - Count three from the start.
    - A, B, C.
    solution: C is third.
- code: cbse1m.lina.count
  title: Counting family members
  after:
  - cbse1m.lina.order
  notes: |
    Counting people in a family, adding members, simple pictographs of family size.
  explanations:
    text: 'Lina''s family has her mother, father, grandmother, her brother and Lina: 5 people. We can count families and compare them.'
    visual: 'Draw Lina''s family: 5 faces in a row, and count them.'
    step_by_step: 'Step 1: Name each person. Step 2: Count them one by one. Step 3: Compare with another family.'
    real_world: When a baby is born, the family grows by one.
  picture:
    kind: bars
    bars:
    - label: Lina
      value: 5
    - label: Amar
      value: 3
    - label: Zoya
      value: 7
    alt: 'Family sizes: Lina 5, Amar 3, Zoya 7.'
    unit: people
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: Count the people in the family.
    goals:
    - prompt: Mother, father, grandmother, a brother and Lina
      target: 5
      mistakes:
      - when:
          v: 4
        say: Did you count Lina herself? She is in the family too.
      - when:
          v: 6
        say: Each person is counted once. Touch each name.
    - prompt: Grandfather, grandmother, mother, father, two sisters
      target: 6
      mistakes:
      - when:
          v: 5
        say: Two sisters means 2 people, not 1.
    - prompt: Just mother and baby
      target: 2
      mistakes:
      - when:
          v: 1
        say: The baby counts too. 1, 2.
  items:
  - prompt: 'Lina''s family: mother, father, grandmother, brother and Lina. How many people?'
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Count each name.
    - Don't forget Lina.
    solution: There are 5 people.
    mistakes:
      '4': c1_count_once
  - prompt: A family of 3 has a new baby. How many now?
    answer: '4'
    check: 3 + 1
    difficulty: 1
    hints:
    - One more.
    - 3 + 1.
    solution: 3 + 1 = 4.
    mistakes:
      '3': c1_count_once
  - prompt: 'Which family is biggest: Lina 5, Amar 3, Zoya 7?'
    options:
    - Zoya
    - Lina
    - Amar
    answer: Zoya
    difficulty: 1
    hints:
    - Biggest number.
    - '7.'
    solution: Zoya's family (7) is biggest.
    mistakes:
      Lina: c1_more_less
  - prompt: Zoya's family has 7 and Lina's has 5. How many more in Zoya's?
    answer: '2'
    check: 7 - 5
    difficulty: 2
    hints:
    - Match them.
    - 7 − 5.
    solution: 7 − 5 = 2.
    mistakes:
      '12': c1_count_once
  - prompt: Each person has 2 eyes. How many eyes do 3 people have?
    answer: '6'
    check: 3*2
    difficulty: 2
    hints:
    - 2, 4, 6.
    - Count in twos.
    solution: 2 + 2 + 2 = 6.
    mistakes:
      '5': c1_count_once
  - prompt: 'Which family is smallest: Lina 5, Amar 3, Zoya 7?'
    options:
    - Amar
    - Lina
    - Zoya
    answer: Amar
    difficulty: 2
    hints:
    - Smallest number.
    - '3.'
    solution: Amar's family (3) is smallest.
    mistakes:
      Zoya: c1_more_less
