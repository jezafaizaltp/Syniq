# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 6
title: Vegetable Farm
tips:
  c1m6_add: Start at the bigger number and count on the smaller one.
  c1m6_sub: Start at the first number and count back, or take away and count what is left.
  c1m6_word: Read the story again. Do the vegetables come together, or are some taken away?
concepts:
- code: cbse1m.veg.add
  title: Adding small numbers
  notes: |
    Adding by putting together: 3 carrots and 2 carrots make 5. Counting on from the bigger number. Sums up to 10.
  explanations:
    text: 'Adding means putting together. 3 carrots and 2 more carrots make 5 carrots. Start at 3 and count on 2: 4, 5.'
    visual: Draw 3 carrots in one basket and 2 in another, then all 5 together in a big basket.
    step_by_step: 'Step 1: Start with the first number. Step 2: Count on the second number. Step 3: Say the total.'
    real_world: 'A farmer picks 4 tomatoes in the morning and 3 in the evening: 7 tomatoes.'
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 3
      label: '3'
    - at: 5
      label: '5'
    alt: '3 + 2 on a number line: start at 3, jump 2 to reach 5.'
    jumps:
    - from: 3
      to: 4
      label: '+1'
    - from: 4
      to: 5
      label: '+1'
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: Put them together. Start at the first number and count on.
    goals:
    - prompt: 🥕🥕🥕 and 🥕🥕 more
      target: 5
      mistakes:
      - when:
          v: 3
        say: 'Don''t stop at 3. Count on 2 more: 4, 5.'
      - when:
          v: 4
        say: 'Count on 2 jumps, not 1: 4, 5.'
      - when:
          v: 6
        say: 'Start counting on after 3: 4, 5. Don''t count 3 again.'
    - prompt: 🍅🍅🍅🍅 and 🍅🍅🍅 more
      target: 7
      mistakes:
      - when:
          v: 1
        say: 'That takes away. Adding puts together: it gets bigger.'
      - when:
          v: 6
        say: 'Count on 3: 5, 6, 7.'
    - prompt: 🥔🥔🥔🥔🥔🥔 and 🥔🥔 more
      target: 8
      mistakes:
      - when:
          v: 4
        say: 'That takes away. Adding makes more: 7, 8.'
  lesson:
    - teach: Adding means putting together. 3 carrots and 2 carrots together make 5 carrots. We write 3 + 2 = 5.
      picture:
        kind: compare
        columns:
        - title: 3 carrots
          points:
          - 🥕🥕🥕
        - title: 2 carrots
          points:
          - 🥕🥕
        - title: together
          points:
          - 🥕🥕🥕🥕🥕 = 5
        alt: 3 carrots and 2 carrots together make 5.
      check:
        prompt: '2 tomatoes and 2 tomatoes together make:'
        options:
        - '4'
        - '2'
        - '22'
        answer: '4'
        why: 2 + 2 = 4.
    - teach: 'Count on from the bigger number. For 2 + 6, start at 6 and count on 2: 7, 8. So 2 + 6 = 8.'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 6
          label: '6'
        - at: 8
          label: '8'
        jumps:
        - from: 6
          to: 8
        alt: Start at 6, count on 2, land on 8.
      check:
        prompt: To add 1 + 7, where do you start counting?
        options:
        - at 7
        - at 1
        - at 0
        answer: at 7
        why: Starting at the bigger number is quicker.
    - teach: 'Adding 0 changes nothing: 5 + 0 = 5. Changing the order keeps the total: 3 + 4 = 4 + 3 = 7.'
      check:
        prompt: 8 + 0 = ?
        options:
        - '8'
        - '0'
        - '80'
        answer: '8'
        why: Adding nothing keeps the number the same.
  items:
  - prompt: 3 carrots + 2 carrots = ?
    answer: '5'
    check: 3 + 2
    difficulty: 1
    hints:
    - Count on from 3.
    - 4, 5.
    solution: 3 + 2 = 5.
    mistakes:
      '4': c1_count_once
      '6': c1_count_once
  - prompt: 4 + 3 = ?
    answer: '7'
    check: 4 + 3
    difficulty: 1
    hints:
    - Count on from 4.
    - 5, 6, 7.
    solution: 4 + 3 = 7.
    mistakes:
      '6': c1_count_once
      '8': c1_count_once
  - prompt: 1 + 5 = ?
    answer: '6'
    check: 1 + 5
    difficulty: 1
    hints:
    - Start at the bigger number, 5.
    - Count on 1.
    solution: 1 + 5 = 6.
    mistakes:
      '5': c1_count_once
  - prompt: The farmer picks 4 tomatoes and then 4 more. How many?
    answer: '8'
    check: 4 + 4
    difficulty: 2
    hints:
    - 4 + 4.
    - Count on 4 from 4.
    solution: 4 + 4 = 8.
    mistakes:
      '7': c1_count_once
      '9': c1_count_once
  - prompt: 2 + 0 = ?
    answer: '2'
    check: 2 + 0
    difficulty: 2
    hints:
    - Adding nothing.
    - Stays the same.
    solution: 2 + 0 = 2.
    mistakes:
      '0': c1_count_once
      '3': c1_count_once
  - prompt: 6 + 3 = ?
    answer: '9'
    check: 6 + 3
    difficulty: 2
    hints:
    - Count on from 6.
    - 7, 8, 9.
    solution: 6 + 3 = 9.
    mistakes:
      '8': c1_count_once
  - prompt: 2 + 3 = ?
    answer: '5'
    check: 2+3
    difficulty: 1
    hints:
    - Start at 3.
    - Count on 2.
    solution: 'Step 1: Start at 3. Step 2: 4, 5. So 5.'
    mistakes:
      '4': c1m6_add
      '6': c1m6_add
  - prompt: 5 + 2 = ?
    answer: '7'
    check: 5+2
    difficulty: 1
    hints:
    - Start at 5.
    - Count on 2.
    solution: 'Step 1: Start at 5. Step 2: 6, 7. So 7.'
    mistakes:
      '6': c1m6_add
      '3': c1m6_sub
  - prompt: A farmer picks 3 brinjals and then 3 more. How many?
    answer: '6'
    check: 3+3
    difficulty: 1
    hints:
    - Picking more means adding.
    - 3 and 3.
    solution: 'Step 1: 3 + 3. Step 2: = 6 brinjals.'
    mistakes:
      '0': c1m6_word
      '5': c1m6_add
  - prompt: 0 + 7 = ?
    answer: '7'
    check: 0+7
    difficulty: 1
    hints:
    - Adding nothing.
    - Does the number change?
    solution: 'Step 1: 0 adds nothing. Step 2: 7.'
    mistakes:
      '0': c1m6_add
      '8': c1m6_add
  - prompt: 1 + 8 = ?
    answer: '9'
    check: 1+8
    difficulty: 1
    hints:
    - Start at 8.
    - One more.
    solution: 'Step 1: Start at 8. Step 2: One more is 9.'
    mistakes:
      '8': c1m6_add
      '7': c1m6_sub
  - prompt: 4 + 5 = ?
    answer: '9'
    check: 4+5
    difficulty: 2
    hints:
    - Start at 5.
    - Count on 4.
    solution: 'Step 1: Start at 5. Step 2: 6, 7, 8, 9. So 9.'
    mistakes:
      '8': c1m6_add
      '10': c1m6_add
  - prompt: A basket has 2 onions. 5 more are added. How many onions?
    answer: '7'
    check: 2+5
    difficulty: 2
    hints:
    - Added means put together.
    - Start at 5, count on 2.
    solution: 'Step 1: 2 + 5. Step 2: = 7 onions.'
    mistakes:
      '3': c1m6_word
      '6': c1m6_add
  - prompt: If 3 + 6 = 9, what is 6 + 3?
    answer: '9'
    check: 6+3
    difficulty: 2
    hints:
    - Same numbers, other order.
    - Does the total change?
    solution: 'Step 1: Swapping order keeps the total. Step 2: 9.'
    mistakes:
      '3': c1m6_add
      '63': c1m6_add
  - prompt: A farm has 2 rows of cabbages. Each row has 4. How many cabbages?
    answer: '8'
    check: 4+4
    difficulty: 3
    hints:
    - Each row has 4.
    - 4 and 4.
    solution: 'Step 1: Row 1: 4, row 2: 4. Step 2: 4 + 4 = 8.'
    mistakes:
      '6': c1m6_add
      '4': c1m6_add
- code: cbse1m.veg.sub
  title: Taking away
  after:
  - cbse1m.veg.add
  notes: |
    Taking away: 6 potatoes, 2 are eaten, 4 left. Counting back. Differences within 10.
  explanations:
    text: 'Taking away means some go away. 6 potatoes, 2 are cooked: 4 are left. Start at 6 and count back 2: 5, 4.'
    visual: 'Draw 6 potatoes and cross out 2. Count the ones left: 4.'
    step_by_step: 'Step 1: Start with the first number. Step 2: Take away or count back. Step 3: Count what is left.'
    real_world: A goat eats 3 of the 8 cabbages in the farm, so 5 are left.
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 6
      label: '6'
    - at: 4
      label: '4'
    alt: '6 − 2 on a number line: start at 6, jump back 2 to reach 4.'
    jumps:
    - from: 6
      to: 5
      label: −1
    - from: 5
      to: 4
      label: −1
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 10
    prompt: Some go away. Start at the first number and count back.
    goals:
    - prompt: 6 potatoes. 2 are cooked.
      target: 4
      mistakes:
      - when:
          v: 8
        say: 'That adds. Cooking takes some away: fewer are left.'
      - when:
          v: 5
        say: 'Count back 2 jumps, not 1: 5, 4.'
    - prompt: 9 carrots. 3 are eaten.
      target: 6
      mistakes:
      - when:
          v: 7
        say: 'Count back 3 jumps from 9: 8, 7, 6.'
      - when:
          v: 3
        say: 3 were eaten. How many are still there?
    - prompt: 5 peas. All 5 roll away.
      target: 0
      mistakes:
      - when:
          v: 5
        say: 'All 5 rolled away. Are any left? None: 0.'
  lesson:
    - teach: 'Taking away means some go away. 6 potatoes, 2 are cooked: 4 are left. We write 6 − 2 = 4.'
      picture:
        kind: flow
        steps:
        - 6 potatoes
        - take away 2
        - 4 are left
        alt: 6 potatoes, take away 2, 4 left.
      check:
        prompt: 5 carrots, a rabbit eats 1. How many are left?
        options:
        - '4'
        - '6'
        - '5'
        answer: '4'
        why: 5 − 1 = 4.
    - teach: 'Count back to take away. For 8 − 3, start at 8 and count back 3: 7, 6, 5. So 8 − 3 = 5.'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 5
          label: '5'
        - at: 8
          label: '8'
        jumps:
        - from: 5
          to: 8
        alt: From 8, counting back 3 lands on 5.
      check:
        prompt: Count back 2 from 7. Where do you land?
        options:
        - '5'
        - '9'
        - '6'
        answer: '5'
        why: 7 → 6 → 5.
    - teach: 'Taking away all leaves 0: 4 − 4 = 0. Taking away 0 leaves the same: 6 − 0 = 6.'
      check:
        prompt: 9 − 0 = ?
        options:
        - '9'
        - '0'
        - '1'
        answer: '9'
        why: Nothing is taken away, so 9 stay.
  items:
  - prompt: 6 potatoes, 2 are cooked. How many left?
    answer: '4'
    check: 6 - 2
    difficulty: 1
    hints:
    - Count back from 6.
    - 5, 4.
    solution: 6 − 2 = 4.
    mistakes:
      '8': c1_count_once
      '5': c1_count_once
  - prompt: 5 − 1 = ?
    answer: '4'
    check: 5 - 1
    difficulty: 1
    hints:
    - One less than 5.
    - Count back.
    solution: 5 − 1 = 4.
    mistakes:
      '6': c1_count_once
  - prompt: 9 − 3 = ?
    answer: '6'
    check: 9 - 3
    difficulty: 1
    hints:
    - Count back 3 from 9.
    - 8, 7, 6.
    solution: 9 − 3 = 6.
    mistakes:
      '12': c1_count_once
      '7': c1_count_once
  - prompt: A goat eats 3 of 8 cabbages. How many are left?
    answer: '5'
    check: 8 - 3
    difficulty: 2
    hints:
    - Take away 3.
    - 8 − 3.
    solution: 8 − 3 = 5.
    mistakes:
      '11': c1_count_once
  - prompt: 7 − 7 = ?
    answer: '0'
    check: 7 - 7
    difficulty: 2
    hints:
    - Take all away.
    - Nothing left.
    solution: 7 − 7 = 0.
    mistakes:
      '7': c1_count_once
      '14': c1_count_once
  - prompt: 10 − 4 = ?
    answer: '6'
    check: 10 - 4
    difficulty: 2
    hints:
    - Count back 4 from 10.
    - 9, 8, 7, 6.
    solution: 10 − 4 = 6.
    mistakes:
      '14': c1_count_once
      '5': c1_count_once
  - prompt: 4 − 1 = ?
    answer: '3'
    check: 4-1
    difficulty: 1
    hints:
    - Start at 4.
    - Count back 1.
    solution: 'Step 1: Start at 4. Step 2: Back 1 is 3.'
    mistakes:
      '5': c1m6_sub
      '4': c1m6_sub
  - prompt: 8 − 2 = ?
    answer: '6'
    check: 8-2
    difficulty: 1
    hints:
    - Start at 8.
    - Count back 2.
    solution: 'Step 1: Start at 8. Step 2: 7, 6. So 6.'
    mistakes:
      '10': c1m6_sub
      '7': c1m6_sub
  - prompt: There are 7 tomatoes. 3 are sold. How many are left?
    answer: '4'
    check: 7-3
    difficulty: 1
    hints:
    - Sold means taken away.
    - Count back 3 from 7.
    solution: 'Step 1: 7 − 3. Step 2: = 4 tomatoes.'
    mistakes:
      '10': c1m6_word
      '5': c1m6_sub
  - prompt: 6 − 6 = ?
    answer: '0'
    check: 6-6
    difficulty: 1
    hints:
    - All are taken away.
    - Is anything left?
    solution: 'Step 1: All 6 go. Step 2: 0 left.'
    mistakes:
      '6': c1m6_sub
      '12': c1m6_sub
  - prompt: 5 − 0 = ?
    answer: '5'
    check: 5-0
    difficulty: 1
    hints:
    - Nothing is taken away.
    - How many stay?
    solution: 'Step 1: Take away nothing. Step 2: 5 stay.'
    mistakes:
      '0': c1m6_sub
      '4': c1m6_sub
  - prompt: 10 − 3 = ?
    answer: '7'
    check: 10-3
    difficulty: 2
    hints:
    - Start at 10.
    - Count back 3.
    solution: 'Step 1: Start at 10. Step 2: 9, 8, 7. So 7.'
    mistakes:
      '13': c1m6_sub
      '6': c1m6_sub
  - prompt: A hen lays 9 eggs. 4 are taken to the kitchen. How many stay?
    answer: '5'
    check: 9-4
    difficulty: 2
    hints:
    - Taken means take away.
    - 9 − 4.
    solution: 'Step 1: 9 − 4. Step 2: = 5 eggs.'
    mistakes:
      '13': c1m6_word
      '4': c1m6_sub
  - prompt: Which takes away to leave 2?
    options:
    - 5 − 3
    - 5 − 1
    - 5 − 5
    answer: 5 − 3
    difficulty: 2
    hints:
    - Work out each one.
    - Count back from 5.
    solution: 'Step 1: 5 − 1 = 4, 5 − 5 = 0. Step 2: 5 − 3 = 2.'
    mistakes:
      5 − 1: c1m6_sub
      5 − 5: c1m6_sub
  - prompt: 8 mangoes. 2 are eaten, then 3 more are eaten. How many are left?
    answer: '3'
    check: 8-2-3
    difficulty: 3
    hints:
    - First take away 2.
    - Then take away 3 more.
    solution: 'Step 1: 8 − 2 = 6. Step 2: 6 − 3 = 3 left.'
    mistakes:
      '5': c1m6_sub
      '13': c1m6_word
