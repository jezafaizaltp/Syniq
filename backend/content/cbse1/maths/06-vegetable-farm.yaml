# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 6. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 6
title: Vegetable Farm
concepts:
- code: cbse1m.veg.add
  title: Adding small numbers
  notes: |
    Adding by putting together: 3 carrots and 2 carrots make 5. Counting on from the bigger number. Sums up to 10.
  explanations:
    text: 'Adding means putting together. 3 carrots and 2 more carrots make 5 carrots. Start at 3 and count on 2: 4, 5.'
    visual: Draw 3 carrots in one basket and 2 in another, then all 5 together in a big basket.
    step_by_step: 'Step 1: Start with the first number. Step 2: Count on the second number. Step 3: Say the total.'
    real_world: 'A farmer picks 4 tomatoes in the morning and 3 in the evening: 7 tomatoes.'
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 3
      label: '3'
    - at: 5
      label: '5'
    alt: '3 + 2 on a number line: start at 3, jump 2 to reach 5.'
    jumps:
    - from: 3
      to: 4
      label: '+1'
    - from: 4
      to: 5
      label: '+1'
  items:
  - prompt: 3 carrots + 2 carrots = ?
    answer: '5'
    check: 3 + 2
    difficulty: 1
    hints:
    - Count on from 3.
    - 4, 5.
    solution: 3 + 2 = 5.
    mistakes:
      '4': c1_count_once
      '6': c1_count_once
  - prompt: 4 + 3 = ?
    answer: '7'
    check: 4 + 3
    difficulty: 1
    hints:
    - Count on from 4.
    - 5, 6, 7.
    solution: 4 + 3 = 7.
    mistakes:
      '6': c1_count_once
      '8': c1_count_once
  - prompt: 1 + 5 = ?
    answer: '6'
    check: 1 + 5
    difficulty: 1
    hints:
    - Start at the bigger number, 5.
    - Count on 1.
    solution: 1 + 5 = 6.
    mistakes:
      '5': c1_count_once
  - prompt: The farmer picks 4 tomatoes and then 4 more. How many?
    answer: '8'
    check: 4 + 4
    difficulty: 2
    hints:
    - 4 + 4.
    - Count on 4 from 4.
    solution: 4 + 4 = 8.
    mistakes:
      '7': c1_count_once
      '9': c1_count_once
  - prompt: 2 + 0 = ?
    answer: '2'
    check: 2 + 0
    difficulty: 2
    hints:
    - Adding nothing.
    - Stays the same.
    solution: 2 + 0 = 2.
    mistakes:
      '0': c1_count_once
      '3': c1_count_once
  - prompt: 6 + 3 = ?
    answer: '9'
    check: 6 + 3
    difficulty: 2
    hints:
    - Count on from 6.
    - 7, 8, 9.
    solution: 6 + 3 = 9.
    mistakes:
      '8': c1_count_once
- code: cbse1m.veg.sub
  title: Taking away
  after:
  - cbse1m.veg.add
  notes: |
    Taking away: 6 potatoes, 2 are eaten, 4 left. Counting back. Differences within 10.
  explanations:
    text: 'Taking away means some go away. 6 potatoes, 2 are cooked: 4 are left. Start at 6 and count back 2: 5, 4.'
    visual: 'Draw 6 potatoes and cross out 2. Count the ones left: 4.'
    step_by_step: 'Step 1: Start with the first number. Step 2: Take away or count back. Step 3: Count what is left.'
    real_world: A goat eats 3 of the 8 cabbages in the farm, so 5 are left.
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 6
      label: '6'
    - at: 4
      label: '4'
    alt: '6 − 2 on a number line: start at 6, jump back 2 to reach 4.'
    jumps:
    - from: 6
      to: 5
      label: −1
    - from: 5
      to: 4
      label: −1
  items:
  - prompt: 6 potatoes, 2 are cooked. How many left?
    answer: '4'
    check: 6 - 2
    difficulty: 1
    hints:
    - Count back from 6.
    - 5, 4.
    solution: 6 − 2 = 4.
    mistakes:
      '8': c1_count_once
      '5': c1_count_once
  - prompt: 5 − 1 = ?
    answer: '4'
    check: 5 - 1
    difficulty: 1
    hints:
    - One less than 5.
    - Count back.
    solution: 5 − 1 = 4.
    mistakes:
      '6': c1_count_once
  - prompt: 9 − 3 = ?
    answer: '6'
    check: 9 - 3
    difficulty: 1
    hints:
    - Count back 3 from 9.
    - 8, 7, 6.
    solution: 9 − 3 = 6.
    mistakes:
      '12': c1_count_once
      '7': c1_count_once
  - prompt: A goat eats 3 of 8 cabbages. How many are left?
    answer: '5'
    check: 8 - 3
    difficulty: 2
    hints:
    - Take away 3.
    - 8 − 3.
    solution: 8 − 3 = 5.
    mistakes:
      '11': c1_count_once
  - prompt: 7 − 7 = ?
    answer: '0'
    check: 7 - 7
    difficulty: 2
    hints:
    - Take all away.
    - Nothing left.
    solution: 7 − 7 = 0.
    mistakes:
      '7': c1_count_once
      '14': c1_count_once
  - prompt: 10 − 4 = ?
    answer: '6'
    check: 10 - 4
    difficulty: 2
    hints:
    - Count back 4 from 10.
    - 9, 8, 7, 6.
    solution: 10 − 4 = 6.
    mistakes:
      '14': c1_count_once
      '5': c1_count_once
