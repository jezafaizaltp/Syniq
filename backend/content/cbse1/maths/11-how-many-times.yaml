# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 11
title: How Many Times
tips:
  m1_fingers: "Count all the fingers on both hands."
  m1_last_count: "The last number you say tells how many."
  m1_more_spans: "The longer thing needs more hand spans."

concepts:
- code: cbse1m.times.measure
  title: Measuring with hand spans and steps
  notes: |
    Measuring length by how many times something fits: hand spans, footsteps, paper clips. Different hands give
    different counts.
  explanations:
    text: We can measure how long something is by counting how many times our hand span fits along it. A table might be 6 hand spans long.
    visual: Draw a table with 6 small hands laid end to end along it.
    step_by_step: 'Step 1: Put your hand at one end. Step 2: Move it along without gaps. Step 3: Count each time.'
    real_world: 'People measure a room by walking: ''It is 10 steps long.'''
  picture:
    kind: bars
    bars:
    - label: table
      value: 6
    - label: desk
      value: 4
    - label: book
      value: 1
    alt: 'Hand spans: a table is 6 spans, a desk is 4 spans, a book is 1 span.'
    unit: spans
  activity:
    type: sort
    prompt: Same thing, different units. Will we count fewer or more?
    bins:
    - We count fewer
    - We count more
    items:
    - label: Father's hand span, on a table
      bin: We count fewer
      clue: Is his hand big or small?
      why: A big hand covers more, so fewer spans fit.
    - label: A child's hand span, on the same table
      bin: We count more
      clue: Is a child's hand big or small?
      why: A small hand covers less, so more spans fit.
    - label: Big steps across a room
      bin: We count fewer
      clue: Each big step covers a lot.
      why: 'Big steps: fewer steps to cross.'
    - label: Tiny steps across the same room
      bin: We count more
      clue: Each tiny step covers a little.
      why: 'Tiny steps: more steps to cross.'
  items:
  - prompt: A table is 6 hand spans long and a desk is 4. How many spans longer is the table?
    answer: '2'
    check: 6 - 4
    difficulty: 1
    hints:
    - 6 − 4.
    - Compare.
    solution: 6 − 4 = 2.
    mistakes:
      '10': c1_count_once
  - prompt: A mat is 5 footsteps long. Two mats in a line are how many footsteps?
    answer: '10'
    check: 5 + 5
    difficulty: 2
    hints:
    - 5 + 5.
    - Count on.
    solution: 5 + 5 = 10.
    mistakes:
      '7': c1_count_once
  - prompt: Why do Ravi and his father get different counts for the same table?
    options:
    - their hands are different sizes
    - the table moves
    - Ravi can't count
    - the table grows
    answer: their hands are different sizes
    difficulty: 2
    hints:
    - Whose hand is bigger?
    - A big hand fits fewer times.
    solution: Different hand sizes give different counts.
    mistakes: {"the table moves": "m4_standard"}
  - prompt: A pencil is 3 paper clips long. How many clips is a pencil twice as long?
    answer: '6'
    check: 2*3
    difficulty: 2
    hints:
    - 3 + 3.
    - Twice means two times.
    solution: 3 + 3 = 6.
    mistakes:
      '5': c1_count_once
  - prompt: Which needs more hand spans to measure?
    options:
    - a door
    - a pencil
    - an eraser
    answer: a door
    difficulty: 1
    hints:
    - The longest thing.
    - Very tall.
    solution: A door is longest, so more spans.
    mistakes: {"a pencil": "m1_more_spans"}
  - prompt: You count 1, 2, 3, 4 hand spans along a book. How long is it?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - The last number.
    - You counted to 4.
    solution: The book is 4 spans long.
    mistakes: {"3": "m1_last_count", "5": "m1_last_count"}
- code: cbse1m.times.repeat
  title: 'How many times: repeated adding'
  after:
  - cbse1m.times.measure
  notes: |
    Counting equal groups: 2 eyes on each face, 4 legs on each chair. Skip counting in 2s and 5s.
  explanations:
    text: Some things come in equal groups. Each chair has 4 legs. 2 chairs have 4 + 4 = 8 legs. Counting in twos and fives is quick.
    visual: 'Draw 3 faces, each with 2 eyes, and count: 2, 4, 6.'
    step_by_step: 'Step 1: How many in one group? Step 2: How many groups? Step 3: Count on in jumps.'
    real_world: 'We count shoes in pairs: 2, 4, 6.'
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 2
      label: '2'
    - at: 4
      label: '4'
    - at: 6
      label: '6'
    alt: 'Counting eyes in twos on a number line: 2, 4, 6.'
    jumps:
    - from: 0
      to: 2
      label: '+2'
    - from: 2
      to: 4
      label: '+2'
    - from: 4
      to: 6
      label: '+2'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: 'Equal groups: add the same number again and again.'
    goals:
    - prompt: 2 chairs, 4 legs each
      target: 8
      mistakes:
      - when:
          v: 4
        say: 'That''s one chair. Add the other chair''s 4 legs: 4 + 4.'
      - when:
          v: 6
        say: Each chair has 4 legs, not 2 and 4. 4 + 4.
    - prompt: 3 hands, 5 fingers each
      target: 15
      mistakes:
      - when:
          v: 10
        say: 'That''s two hands. Count in fives: 5, 10, 15.'
      - when:
          v: 8
        say: 'That adds 3 and 5. Each hand has 5: 5 + 5 + 5.'
    - prompt: 4 pairs of socks, 2 in each
      target: 8
      mistakes:
      - when:
          v: 6
        say: 'That adds 4 and 2. Count in twos: 2, 4, 6, 8.'
  items:
  - prompt: 3 faces, 2 eyes each. How many eyes?
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - 2, 4, 6.
    - Count in twos.
    solution: 2 + 2 + 2 = 6.
    mistakes:
      '5': c1_count_once
  - prompt: 2 chairs, 4 legs each. How many legs?
    answer: '8'
    check: 2*4
    difficulty: 1
    hints:
    - 4 + 4.
    - Count on.
    solution: 4 + 4 = 8.
    mistakes:
      '6': c1_count_once
  - prompt: 2, 4, 6, __ ?
    answer: '8'
    check: 6 + 2
    difficulty: 1
    hints:
    - Jump by 2.
    - 6 + 2.
    solution: 6 + 2 = 8.
    mistakes:
      '7': c1_count_once
  - prompt: 5, 10, __ ?
    answer: '15'
    check: 10 + 5
    difficulty: 2
    hints:
    - Jump by 5.
    - 10 + 5.
    solution: 10 + 5 = 15.
    mistakes:
      '11': c1_count_once
  - prompt: 2 hands, 5 fingers each. How many fingers?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - Count all fingers.
    solution: 5 + 5 = 10.
    mistakes: {"7": "m1_fingers", "5": "m1_fingers"}
  - prompt: 4 pairs of socks. How many socks?
    answer: '8'
    check: 4*2
    difficulty: 2
    hints:
    - A pair is 2.
    - 2, 4, 6, 8.
    solution: 2 + 2 + 2 + 2 = 8.
    mistakes:
      '4': c1_count_once
