# CBSE Class 1 Mathematics (NCERT Joyful Mathematics, 2024-25), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse1-math
chapter: 11
title: How Many Times
tips:
  m1_fingers: "Count all the fingers on both hands."
  m1_last_count: "The last number you say tells how many."
  m1_more_spans: "The longer thing needs more hand spans."
  c1m11_measure: "Think how much floor or table one big step or hand covers compared with a small one."
  c1m11_group: Count one group, then count on the same amount for each new group.

concepts:
- code: cbse1m.times.measure
  title: Measuring with hand spans and steps
  notes: |
    Measuring length by how many times something fits: hand spans, footsteps, paper clips. Different hands give
    different counts.
  explanations:
    text: We can measure how long something is by counting how many times our hand span fits along it. A table might be 6 hand spans long.
    visual: Draw a table with 6 small hands laid end to end along it.
    step_by_step: 'Step 1: Put your hand at one end. Step 2: Move it along without gaps. Step 3: Count each time.'
    real_world: 'People measure a room by walking: ''It is 10 steps long.'''
  picture:
    kind: bars
    bars:
    - label: table
      value: 6
    - label: desk
      value: 4
    - label: book
      value: 1
    alt: 'Hand spans: a table is 6 spans, a desk is 4 spans, a book is 1 span.'
    unit: spans
  activity:
    type: sort
    prompt: Same thing, different units. Will we count fewer or more?
    bins:
    - We count fewer
    - We count more
    items:
    - label: Father's hand span, on a table
      bin: We count fewer
      clue: Is his hand big or small?
      why: A big hand covers more, so fewer spans fit.
    - label: A child's hand span, on the same table
      bin: We count more
      clue: Is a child's hand big or small?
      why: A small hand covers less, so more spans fit.
    - label: Big steps across a room
      bin: We count fewer
      clue: Each big step covers a lot.
      why: 'Big steps: fewer steps to cross.'
    - label: Tiny steps across the same room
      bin: We count more
      clue: Each tiny step covers a little.
      why: 'Tiny steps: more steps to cross.'
  lesson:
    - teach: We can measure how long something is by counting how many times a hand span, a footstep or a paper clip fits along it, end to end with no gaps.
      picture:
        kind: flow
        steps:
        - start at one end
        - place a hand span
        - move to where it ended
        - count each span
        alt: Measuring a table with hand spans, one after another.
      check:
        prompt: When measuring with paper clips, how should they be placed?
        options:
        - end to end with no gaps
        - with big gaps
        - in a pile
        answer: end to end with no gaps
        why: Gaps or overlaps give a wrong count.
      ways:
      - style: step_by_step
        teach: 'Measure a crayon with paper clips. Step 1: Put the first clip right at one end. Step 2: Put the next clip touching the first, with no gap. Step 3: Keep going to the other end. Step 4: Count the clips.'
      - style: real_world
        teach: Long ago, cloth sellers measured cloth from their nose to the end of their stretched-out arm, before measuring tapes were common.
    - teach: Longer things need more spans. A door needs more spans than a book. If a table is 6 spans and a desk is 4, the table is 2 spans longer.
      check:
        prompt: A rope is 8 spans, a stick is 3. Which is longer?
        options:
        - the rope
        - the stick
        - they are the same
        answer: the rope
        why: 8 spans is more than 3 spans.
      ways:
      - style: visual
        teach: Some things in a room measured in hand spans.
        picture:
          kind: bars
          bars:
          - label: Chair seat
            value: 3
          - label: Window
            value: 5
          - label: Bed
            value: 9
          alt: A chair seat is 3 hand spans, a window is 5 spans and a bed is 9 spans. The bed is the longest.
      - style: real_world
        teach: Before buying a new cupboard, a family may measure the wall in steps to check that the cupboard will fit.
    - teach: Different hands give different counts. A grown-up's big hand fits fewer times than a child's small hand on the same table.
      picture:
        kind: compare
        columns:
        - title: big hand
          points:
          - fewer spans
        - title: small hand
          points:
          - more spans
        alt: A big hand gives fewer spans; a small hand gives more.
      check:
        prompt: A child and a grown-up measure the same mat with hand spans. Who counts more spans?
        options:
        - the child
        - the grown-up
        - both the same
        answer: the child
        why: A smaller hand fits more times.
      ways:
      - style: step_by_step
        teach: 'Measure with two different hands. Step 1: Measure a mat with your hand spans and count. Step 2: Ask a grown-up to measure the same mat. Step 3: Write both numbers down. Step 4: Talk about why the numbers are not the same.'
      - style: real_world
        teach: 'That is why shops use rulers and measuring tapes: everyone gets the same answer, whatever the size of their hands.'
  items:
  - prompt: A table is 6 hand spans long and a desk is 4. How many spans longer is the table?
    answer: '2'
    check: 6 - 4
    difficulty: 1
    hints:
    - 6 − 4.
    - Compare.
    solution: 6 − 4 = 2.
    mistakes:
      '10': c1_count_once
  - prompt: A mat is 5 footsteps long. Two mats in a line are how many footsteps?
    answer: '10'
    check: 5 + 5
    difficulty: 2
    hints:
    - 5 + 5.
    - Count on.
    solution: 5 + 5 = 10.
    mistakes:
      '7': c1_count_once
  - prompt: Why do Ravi and Ravi's father get different counts for the same table?
    options:
    - "their hands are different sizes"
    - "the table moves when they count"
    - "Ravi does not know how to count"
    - "the table grows a little bigger"
    answer: their hands are different sizes
    difficulty: 2
    hints:
    - Whose hand is bigger?
    - A big hand fits fewer times.
    solution: Different hand sizes give different counts.
    mistakes: {"the table moves when they count": "m4_standard"}
  - prompt: A pencil is 3 paper clips long. How many clips is a pencil twice as long?
    answer: '6'
    check: 2*3
    difficulty: 2
    hints:
    - 3 + 3.
    - Twice means two times.
    solution: 3 + 3 = 6.
    mistakes:
      '5': c1_count_once
  - prompt: Which needs more hand spans to measure?
    options:
    - a door
    - a pencil
    - an eraser
    answer: a door
    difficulty: 1
    hints:
    - The longest thing.
    - Very tall.
    solution: A door is longest, so more spans.
    mistakes: {"a pencil": "m1_more_spans"}
  - prompt: You count 1, 2, 3, 4 hand spans along a book. How long is it?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - The last number.
    - You counted to 4.
    solution: The book is 4 spans long.
    mistakes: {"3": "m1_last_count", "5": "m1_last_count"}
  - prompt: A book is 2 hand spans long. A table is 7 hand spans. How many spans longer is the table?
    answer: '5'
    check: 7-2
    difficulty: 1
    hints:
    - Match span for span.
    - 7 take away 2.
    solution: 'Step 1: 7 − 2. Step 2: 5 spans longer.'
    mistakes:
      '9': c1m11_measure
      '2': c1m11_measure
  - prompt: Which needs fewer footsteps to measure?
    options:
    - a mat
    - a classroom
    - a playground
    answer: a mat
    difficulty: 1
    hints:
    - Which is the shortest?
    - Short things need fewer steps.
    solution: 'Step 1: A classroom and playground are long. Step 2: A mat needs fewer steps.'
    mistakes:
      a classroom: m1_more_spans
      a playground: m1_more_spans
  - prompt: You place a paper clip 1, 2, 3, 4, 5 times along a pencil. How long is the pencil?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - The last number you say tells how many.
    - Count the clips.
    solution: 'Step 1: You counted to 5. Step 2: The pencil is 5 clips long.'
    mistakes:
      '4': m1_last_count
      '6': m1_last_count
  - prompt: Two ropes, 3 spans and 4 spans, are tied end to end. How long?
    answer: '7'
    check: 3+4
    difficulty: 1
    hints:
    - Put both together.
    - Start at 4, count on 3.
    solution: 'Step 1: 3 + 4. Step 2: 7 spans.'
    mistakes:
      '1': c1m11_measure
      '6': c1m11_measure
  - prompt: 'Big steps or small steps: which give a smaller count across a room?'
    options:
    - big steps
    - small steps
    - both the same
    answer: big steps
    difficulty: 2
    hints:
    - Each big step covers more floor.
    - Fewer steps needed.
    solution: 'Step 1: Big steps cover more. Step 2: So the count is smaller.'
    mistakes:
      small steps: c1m11_measure
      both the same: c1m11_measure
  - prompt: A bench is 6 spans. Half of it is how many spans?
    answer: '3'
    check: 6//2
    difficulty: 2
    hints:
    - Half means two equal parts.
    - 6 split into 2 equal parts.
    solution: 'Step 1: 6 = 3 + 3. Step 2: Half is 3 spans.'
    mistakes:
      '12': c1m11_measure
      '4': c1m11_measure
  - prompt: Why must we start measuring right at the end of the table?
    options:
    - so no part is left out
    - so it looks nice
    - it does not matter
    answer: so no part is left out
    difficulty: 2
    hints:
    - What if you start in the middle?
    - Some of the table would not be counted.
    solution: 'Step 1: Starting late skips part of the table. Step 2: Start at the end so all of it is counted.'
    mistakes:
      so it looks nice: c1m11_measure
      it does not matter: c1m11_measure
  - prompt: A rug is 4 footsteps. Three rugs in a line are how many footsteps?
    answer: '12'
    check: 4+4+4
    difficulty: 3
    hints:
    - Each rug is 4.
    - 4, 8, ...
    solution: 'Step 1: 4 + 4 + 4. Step 2: 12 footsteps.'
    mistakes:
      '7': c1m11_group
      '8': c1m11_group
  - prompt: A path is 10 steps for a child. Is it more or fewer steps for a tall grown-up?
    options:
    - fewer
    - more
    - exactly 10
    answer: fewer
    difficulty: 3
    hints:
    - Grown-ups take bigger steps.
    - Bigger steps fit fewer times.
    solution: 'Step 1: A grown-up''s step is longer. Step 2: So fewer steps than 10.'
    mistakes:
      more: c1m11_measure
      exactly 10: c1m11_measure
  - prompt: 'Case: Two children measure the same classroom. One counts 12 big steps. The other counts 20 small steps. Who measured wrongly?'
    options:
    - "Neither: small steps need more steps to cover the room"
    - "The child who counted 12, because fewer is better"
    - "The child who counted 20, because more is better"
    answer: 'Neither: small steps need more steps to cover the room'
    hints:
    - Is the room the same for both children?
    - Does a small step cover more or less floor than a big one?
    solution: Both measured the same room. Small steps cover less floor, so more of them are needed. Both counts can be right.
    mistakes:
      "The child who counted 12, because fewer is better": c1m11_measure
      "The child who counted 20, because more is better": c1m11_measure
    exam: case
    difficulty: 2
  - prompt: 'Situation: A mat is 7 hand spans long. The space on the floor is 9 hand spans long. Will the mat fit?'
    options:
    - Yes, with 2 spans to spare
    - No, it is 2 spans too long
    - Yes, exactly with nothing to spare
    answer: Yes, with 2 spans to spare
    hints:
    - 'Which is longer: the mat or the space?'
    - Count on from 7 to 9.
    solution: The space is 9 spans and the mat is 7, so the mat fits. From 7 to 9 is 2 more, so 2 spans are left over.
    mistakes:
      No, it is 2 spans too long: c1m11_measure
      Yes, exactly with nothing to spare: c1m11_measure
    exam: competency
    difficulty: 2
- code: cbse1m.times.repeat
  title: 'How many times: repeated adding'
  after:
  - cbse1m.times.measure
  notes: |
    Counting equal groups: 2 eyes on each face, 4 legs on each chair. Skip counting in 2s and 5s.
  explanations:
    text: Some things come in equal groups. Each chair has 4 legs. 2 chairs have 4 + 4 = 8 legs. Counting in twos and fives is quick.
    visual: 'Draw 3 faces, each with 2 eyes, and count: 2, 4, 6.'
    step_by_step: 'Step 1: How many in one group? Step 2: How many groups? Step 3: Count on in jumps.'
    real_world: 'We count shoes in pairs: 2, 4, 6.'
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 2
      label: '2'
    - at: 4
      label: '4'
    - at: 6
      label: '6'
    alt: 'Counting eyes in twos on a number line: 2, 4, 6.'
    jumps:
    - from: 0
      to: 2
      label: '+2'
    - from: 2
      to: 4
      label: '+2'
    - from: 4
      to: 6
      label: '+2'
  activity:
    type: number_line
    min: 0
    max: 20
    step: 1
    start: 0
    prompt: 'Equal groups: add the same number again and again.'
    goals:
    - prompt: 2 chairs, 4 legs each
      target: 8
      mistakes:
      - when:
          v: 4
        say: 'That''s one chair. Add the other chair''s 4 legs: 4 + 4.'
      - when:
          v: 6
        say: Each chair has 4 legs, not 2 and 4. 4 + 4.
    - prompt: 3 hands, 5 fingers each
      target: 15
      mistakes:
      - when:
          v: 10
        say: 'That''s two hands. Count in fives: 5, 10, 15.'
      - when:
          v: 8
        say: 'That adds 3 and 5. Each hand has 5: 5 + 5 + 5.'
    - prompt: 4 pairs of socks, 2 in each
      target: 8
      mistakes:
      - when:
          v: 6
        say: 'That adds 4 and 2. Count in twos: 2, 4, 6, 8.'
  lesson:
    - teach: 'Equal groups: each group has the same number. 3 faces with 2 eyes each: 2, 4, 6 eyes. We add the same number again and again.'
      picture:
        kind: flow
        steps:
        - '2'
        - '4'
        - '6'
        alt: 'Counting eyes on 3 faces: 2, 4, 6.'
      check:
        prompt: 2 bicycles, 2 wheels each. How many wheels?
        options:
        - '4'
        - '2'
        - '6'
        answer: '4'
        why: 2 + 2 = 4.
      ways:
      - style: step_by_step
        teach: 'Count wheels on toy cars. Step 1: Line up 3 toy cars. Step 2: Each car has 4 wheels. Step 3: Count on 4 for each car: 4, 8, 12. Step 4: There are 12 wheels.'
      - style: real_world
        teach: 'At a picnic, each child gets 3 biscuits. For 4 children, add 3 again and again: 3, 6, 9, 12 biscuits.'
    - teach: 'Skip counting is fast counting of equal groups. In 2s: 2, 4, 6, 8, 10. In 5s: 5, 10, 15, 20. In 10s: 10, 20, 30.'
      picture:
        kind: number_line
        from: 0
        to: 20
        points:
        - at: 5
          label: '5'
        - at: 10
          label: '10'
        - at: 15
          label: '15'
        - at: 20
          label: '20'
        jumps:
        - from: 0
          to: 5
        - from: 5
          to: 10
        - from: 10
          to: 15
        - from: 15
          to: 20
        alt: 'Skip counting in 5s: 5, 10, 15, 20.'
      check:
        prompt: 'Counting in 5s: 5, 10, 15, ___ ?'
        options:
        - '20'
        - '16'
        - '25'
        answer: '20'
        why: Each jump adds 5.
      ways:
      - style: step_by_step
        teach: 'Skip count on a number chart. Step 1: Put your finger on 12. Step 2: Jump 2 squares to 14. Step 3: Keep jumping in 2s: 16, 18. Step 4: Say the numbers you landed on.'
      - style: real_world
        teach: 'Counting money in ₹10 notes is skip counting in 10s: 10, 20, 30, 40.'
    - teach: 'Things in pairs come in 2s: shoes, socks, eyes, ears. Hands have 5 fingers each, so count fingers in 5s.'
      check:
        prompt: 3 pairs of shoes. How many shoes?
        options:
        - '6'
        - '3'
        - '5'
        answer: '6'
        why: 2, 4, 6.
      ways:
      - style: visual
        teach: Things we count in 2s, and things we count in 5s.
        picture:
          kind: compare
          columns:
          - title: Count in 2s
            points:
            - Shoes
            - Ears
            - Gloves
          - title: Count in 5s
            points:
            - Fingers on hands
            - Toes on feet
          alt: Shoes, ears and gloves come in 2s. Fingers on hands and toes on feet come in 5s.
      - style: real_world
        teach: Shoe shops count pairs, not single shoes, because shoes always come in 2s.
  items:
  - prompt: 3 faces, 2 eyes each. How many eyes?
    answer: '6'
    check: 3*2
    difficulty: 1
    hints:
    - 2, 4, 6.
    - Count in twos.
    solution: 2 + 2 + 2 = 6.
    mistakes:
      '5': c1_count_once
  - prompt: 2 chairs, 4 legs each. How many legs?
    answer: '8'
    check: 2*4
    difficulty: 1
    hints:
    - 4 + 4.
    - Count on.
    solution: 4 + 4 = 8.
    mistakes:
      '6': c1_count_once
  - prompt: 2, 4, 6, __ ?
    answer: '8'
    check: 6 + 2
    difficulty: 1
    hints:
    - Jump by 2.
    - 6 + 2.
    solution: 6 + 2 = 8.
    mistakes:
      '7': c1_count_once
  - prompt: 5, 10, __ ?
    answer: '15'
    check: 10 + 5
    difficulty: 2
    hints:
    - Jump by 5.
    - 10 + 5.
    solution: 10 + 5 = 15.
    mistakes:
      '11': c1_count_once
  - prompt: 2 hands, 5 fingers each. How many fingers?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - Count all fingers.
    solution: 5 + 5 = 10.
    mistakes: {"7": "m1_fingers", "5": "m1_fingers"}
  - prompt: 4 pairs of socks. How many socks?
    answer: '8'
    check: 4*2
    difficulty: 2
    hints:
    - A pair is 2.
    - 2, 4, 6, 8.
    solution: 2 + 2 + 2 + 2 = 8.
    mistakes:
      '4': c1_count_once
  - prompt: 4 faces, 2 ears each. How many ears?
    answer: '8'
    check: 2*4
    difficulty: 1
    hints:
    - Count in 2s.
    - 2, 4, 6, ...
    solution: 'Step 1: 2, 4, 6, 8. Step 2: 8 ears.'
    mistakes:
      '6': c1m11_group
      '4': c1m11_group
  - prompt: 6, 8, 10, ___ ?
    answer: '12'
    check: 10+2
    difficulty: 1
    hints:
    - Each step adds 2.
    - 10 and 2 more.
    solution: 'Step 1: The jump is 2. Step 2: 10 + 2 = 12.'
    mistakes:
      '11': c1m11_group
      '14': c1m11_group
  - prompt: 10, 15, 20, ___ ?
    answer: '25'
    check: 20+5
    difficulty: 1
    hints:
    - Each step adds 5.
    - 20 and 5 more.
    solution: 'Step 1: The jump is 5. Step 2: 20 + 5 = 25.'
    mistakes:
      '21': c1m11_group
      '30': c1m11_group
  - prompt: 3 tricycles, 3 wheels each. How many wheels?
    answer: '9'
    check: 3*3
    difficulty: 2
    hints:
    - Count in 3s.
    - 3, 6, ...
    solution: 'Step 1: 3, 6, 9. Step 2: 9 wheels.'
    mistakes:
      '6': c1m11_group
      '12': c1m11_group
  - prompt: 3 hands, 5 fingers each. How many fingers?
    answer: '15'
    check: 5*3
    difficulty: 2
    hints:
    - Count in 5s.
    - 5, 10, ...
    solution: 'Step 1: 5, 10, 15. Step 2: 15 fingers.'
    mistakes:
      '10': c1m11_group
      '8': c1m11_group
  - prompt: 5 pairs of socks. How many socks?
    answer: '10'
    check: 2*5
    difficulty: 2
    hints:
    - A pair is 2.
    - 2, 4, 6, 8, ...
    solution: 'Step 1: Count in 2s five times. Step 2: 10 socks.'
    mistakes:
      '5': c1m11_group
      '7': c1m11_group
  - prompt: A cow has 4 legs. How many legs do 2 cows have?
    answer: '8'
    check: 4*2
    difficulty: 1
    hints:
    - 4 legs each.
    - 4 and 4.
    solution: 'Step 1: 4 + 4. Step 2: 8 legs.'
    mistakes:
      '6': c1m11_group
      '4': c1m11_group
  - prompt: Which skip counting is in 10s?
    options:
    - 10, 20, 30
    - 2, 4, 6
    - 5, 10, 15
    answer: 10, 20, 30
    difficulty: 2
    hints:
    - Each jump should be 10.
    - Check the gap between numbers.
    solution: 'Step 1: 2, 4, 6 jumps by 2; 5, 10, 15 by 5. Step 2: 10, 20, 30 jumps by 10.'
    mistakes:
      2, 4, 6: c1m11_group
      5, 10, 15: c1m11_group
  - prompt: 4 plates, 5 idlis on each. How many idlis?
    answer: '20'
    check: 5*4
    difficulty: 3
    hints:
    - Count in 5s.
    - 5, 10, 15, ...
    solution: 'Step 1: 5, 10, 15, 20. Step 2: 20 idlis.'
    mistakes:
      '9': c1m11_group
      '15': c1m11_group
  - prompt: 'Case: At a party, 4 children each get 5 sweets. Raju says, ''That is 9 sweets.'' What mistake did Raju make?'
    options:
    - "Raju added 4 and 5; there are 20 sweets"
    - "Raju is right; there are 9 sweets"
    - "Raju counted 2 children; there are 10 sweets"
    answer: Raju added 4 and 5; there are 20 sweets
    hints:
    - How many equal groups are there? How many in each?
    - Count in 5s, once for each child.
    solution: 'There are 4 groups of 5. Counting in 5s: 5, 10, 15, 20. So there are 20 sweets, not 9.'
    mistakes:
      "Raju is right; there are 9 sweets": c1m11_group
      "Raju counted 2 children; there are 10 sweets": c1m11_group
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are setting out chairs for 3 tables. Each table needs 5 chairs. How many chairs do you need?'
    options:
    - '15'
    - '8'
    - '10'
    answer: '15'
    hints:
    - How many chairs for one table?
    - Count in 5s, once for each table.
    solution: 'Counting in 5s for 3 tables: 5, 10, 15. You need 15 chairs.'
    mistakes:
      '8': c1m11_group
      '10': c1m11_group
    exam: competency
    difficulty: 2
