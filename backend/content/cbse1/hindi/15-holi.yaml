subject: cbse1-hin
chapter: 15
title: होली
concepts:
- code: cbse1h.15.holi
  title: होली
  notes: |
    होली पर पाठ/कविता: रंगों का त्योहार, गुलाल, पिचकारी, गुझिया; सूखे और सुरक्षित रंगों से खेलना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: होली रंगों का त्योहार है। हम गुलाल लगाते हैं, पिचकारी से रंग डालते हैं और गुझिया खाते हैं। आँखों का ध्यान रखें और अच्छे, सूखे रंगों से खेलें।
    visual: 'चित्र बनाओ: रंग-बिरंगे गुलाल के ढेर, पिचकारी और हँसते बच्चे।'
    step_by_step: 1. पाठ पढ़ो। 2. होली पर क्या-क्या करते हैं? 3. कौन-सी मिठाई बनती है? 4. होली सुरक्षित कैसे खेलें?
    real_world: होली वसंत ऋतु में, फागुन महीने में मनाई जाती है।
  picture:
    kind: compare
    columns:
    - title: होली में
      points:
      - गुलाल
      - पिचकारी
      - गुझिया
    - title: काम
      points:
      - लगाते हैं
      - रंग डालते हैं
      - खाते हैं
    alt: होली में गुलाल लगाते हैं, पिचकारी से रंग डालते हैं और गुझिया खाते हैं।
  items:
  - prompt: होली किसका त्योहार है?
    options:
    - रंगों का
    - दीयों का
    - पतंगों का
    answer: रंगों का
    difficulty: 1
    hints:
    - गुलाल।
    - रंग-बिरंगा।
    solution: होली रंगों का त्योहार है।
  - prompt: होली पर कौन-सी मिठाई बनती है?
    options:
    - गुझिया
    - केक
    - आइसक्रीम ही
    answer: गुझिया
    difficulty: 2
    hints:
    - ग से।
    - मीठी भरावन वाली।
    solution: होली पर गुझिया बनती है।
  - prompt: रंग डालने के लिए किसका उपयोग करते हैं?
    options:
    - पिचकारी
    - चम्मच
    - किताब
    answer: पिचकारी
    difficulty: 1
    hints:
    - पानी की धार।
    - प से।
    solution: पिचकारी से रंग डालते हैं।
  - prompt: होली खेलते समय किसका ध्यान रखें?
    options:
    - आँखों का
    - जूतों का ही
    - किसी का नहीं
    answer: आँखों का
    difficulty: 2
    hints:
    - रंग आँख में न जाए।
    - सुरक्षा।
    solution: आँखों का ध्यान रखना चाहिए।
  - prompt: 'कोई रंग न लगवाना चाहे तो हमें:'
    options:
    - उसकी बात माननी चाहिए
    - ज़बरदस्ती रंग लगाना चाहिए
    - उसे चिढ़ाना चाहिए
    answer: उसकी बात माननी चाहिए
    difficulty: 2
    hints:
    - सबकी मर्ज़ी।
    - आदर।
    solution: उसकी बात माननी चाहिए।
  - prompt: '''होली'' किस अक्षर से शुरू होता है?'
    options:
    - ह
    - ल
    - र
    answer: ह
    difficulty: 1
    hints:
    - पहली आवाज़।
    - हाथी वाला।
    solution: होली 'ह' से शुरू होता है।
    mistakes:
      ल: hin1_sound
