subject: cbse1-hin
chapter: 15
title: होली
tips:
  c1h15_shabd: "शब्द को धीरे बोलो और उसके आखिरी हिस्से पर ध्यान दो।"
  h1_gujhiya: "होली की खास मिठाई अर्धचंद्र जैसी होती है, अंदर खोया भरा होता है।"
  h1_holi_aankh: "रंग शरीर के किस नाज़ुक हिस्से में जाए तो सबसे ज़्यादा जलन होती है?"
  h1_marzi: "सोचो, कोई तुम पर तुम्हारी 'ना' के बाद भी कुछ करे तो कैसा लगेगा।"
  h1_pichkari: "रंग वाला पानी दूर तक फेंकने के लिए बच्चे क्या दबाते हैं?"
  h1_tyohar: "दीये दिवाली में जलते हैं, पतंग संक्रांति में उड़ती है। होली पर लोग एक-दूसरे पर क्या डालते हैं?"
  c1h15_rang: 'होली को मन में देखो: लोग हाथ में क्या लेकर खेलते हैं?'
  c1h15_dhyan: सोचो, खेल में किसी को चोट या दुख न हो, इसके लिए क्या ठीक है?
  c1h15_ginti: उँगलियों पर एक-एक करके गिनो।

concepts:
- code: cbse1h.15.holi
  title: होली
  notes: |
    होली पर पाठ/कविता: रंगों का त्योहार, गुलाल, पिचकारी, गुझिया; सूखे और सुरक्षित रंगों से खेलना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: होली रंगों का त्योहार है। हम गुलाल लगाते हैं, पिचकारी से रंग डालते हैं और गुझिया खाते हैं। आँखों का ध्यान रखें और अच्छे, सूखे रंगों से खेलें।
    visual: 'चित्र बनाओ: रंग-बिरंगे गुलाल के ढेर, पिचकारी और हँसते बच्चे।'
    step_by_step: 1. पाठ पढ़ो। 2. होली पर क्या-क्या करते हैं? 3. कौन-सी मिठाई बनती है? 4. होली सुरक्षित कैसे खेलें?
    real_world: होली वसंत ऋतु में, फागुन महीने में मनाई जाती है।
  picture:
    kind: compare
    columns:
    - title: होली में
      points:
      - गुलाल
      - पिचकारी
      - गुझिया
    - title: काम
      points:
      - लगाते हैं
      - रंग डालते हैं
      - खाते हैं
    alt: होली में गुलाल लगाते हैं, पिचकारी से रंग डालते हैं और गुझिया खाते हैं।
  activity:
    type: sort
    prompt: होली कैसे खेलें?
    bins:
    - सुरक्षित होली
    - ठीक नहीं
    items:
    - label: 🌸 सूखा गुलाल
      bin: सुरक्षित होली
      clue: किस रंग से आँखें बचें?
      why: सूखे रंग सुरक्षित।
    - label: 🥟 गुझिया बाँटना
      bin: सुरक्षित होली
      clue: होली की मिठाई?
      why: मिलकर खाना।
    - label: 🙏 पूछकर रंग लगाना
      bin: सुरक्षित होली
      clue: किसी को बुरा न लगे?
      why: पूछकर रंग लगाओ।
    - label: 👁️ आँखों में रंग डालना
      bin: ठीक नहीं
      clue: आँख को चोट?
      why: आँखों को बचाओ।
  lesson:
    - teach: होली रंगों का त्योहार है। यह फागुन में, बसंत के समय आती है। लोग एक-दूसरे को गुलाल लगाते हैं, पिचकारी से रंग डालते हैं और गले मिलते हैं।
      check:
        prompt: रंगीन पानी दूर तक फेंकने वाली चीज़ कौन-सी?
        options:
        - पिचकारी
        - थाली
        - झाड़ू
        answer: पिचकारी
        why: पिचकारी दबाने पर पानी की धार निकलती है।
      ways:
      - style: visual
        teach: भारत के कुछ और त्योहार और उनकी एक खास बात, साथ-साथ देखो।
        picture:
          kind: compare
          columns:
          - title: त्योहार
            points:
            - दिवाली
            - ओणम
            - क्रिसमस
          - title: खास बात
            points:
            - दीये जलाना
            - फूलों का पूकलम
            - सजा हुआ पेड़
          alt: दिवाली पर दीये जलाते हैं, ओणम पर फूलों का पूकलम बनाते हैं और क्रिसमस पर पेड़ सजाते हैं।
      - style: real_world
        teach: होली की सुबह गलियों में बच्चों की टोलियाँ ढोल बजाती हैं और हर घर जाकर 'होली है!' कहती हैं।
    - teach: होली पर घरों में गुझिया, मालपुए और ठंडाई बनती है। लोग मिठाई बाँटते हैं। पुराने झगड़े भूलकर दोस्ती करते हैं।
      check:
        prompt: होली पर लोग पुराने झगड़ों का क्या करते हैं?
        options:
        - भूलकर गले मिलते हैं
        - और लड़ते हैं
        - बात बंद करते हैं
        answer: भूलकर गले मिलते हैं
        why: होली मेल-मिलाप का त्योहार है।
      ways:
      - style: step_by_step
        teach: 'होली पर सबके साथ खुशी बाँटो। पहला: पड़ोसी के घर जाओ। दूसरा: बड़ों को नमस्ते करो। तीसरा: मिठाई की प्लेट दो। चौथा: अगर किसी से रूठे थे, तो गले मिलकर दोस्ती कर लो।'
      - style: visual
        teach: होली पर पड़ोसी के घर जाकर खुशी बाँटने के कदम, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - पड़ोसी के घर जाओ
          - बड़ों को नमस्ते करो
          - मिठाई की प्लेट दो
          - गले मिलकर दोस्ती करो
          alt: होली पर पड़ोसी के घर जाओ, बड़ों को नमस्ते करो, मिठाई की प्लेट दो और गले मिलकर दोस्ती करो।
    - teach: 'सुरक्षित होली: सूखे और फूलों से बने रंग लो, आँखों और मुँह को बचाओ। जो रंग न लगवाना चाहे, उसकी बात मानो। पानी बर्बाद मत करो।'
      picture:
        kind: compare
        columns:
        - title: ठीक
          points:
          - सूखा गुलाल
          - पूछकर रंग लगाना
          - आँखें बचाना
        - title: ठीक नहीं
          points:
          - कीचड़ या पेंट
          - ज़बरदस्ती रंग
          - गुब्बारे मारना
        alt: होली में क्या ठीक है और क्या नहीं।
      check:
        prompt: किसी पर रंग लगाने से पहले क्या करें?
        options:
        - उससे पूछें
        - पीछे से डालें
        - ज़बरदस्ती करें
        answer: उससे पूछें
        why: हर किसी की मर्ज़ी का ध्यान रखना होता है।
      ways:
      - style: visual
        teach: होली खेलने का सुरक्षित तरीका और खतरे वाला तरीका, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: सुरक्षित
            points:
            - फूलों वाला सूखा रंग
            - पूछकर रंग लगाना
            - बाल्टी भर पानी ही
          - title: खतरा
            points:
            - चमकीला पक्का रंग
            - ज़बरदस्ती रंग डालना
            - नल खुला छोड़ना
          alt: फूलों वाला सूखा रंग, पूछकर रंग लगाना और कम पानी सुरक्षित है। चमकीला पक्का रंग, ज़बरदस्ती रंग डालना और नल खुला छोड़ना ठीक नहीं।
      - style: real_world
        teach: कुछ जगहों पर लोग गेंदे और गुलाब की पंखुड़ियों से 'फूलों की होली' खेलते हैं, जिसमें पानी भी कम लगता है।
  items:
  - prompt: होली किसका त्योहार है?
    options:
    - रंगों का
    - दीयों का
    - पतंगों का
    answer: रंगों का
    difficulty: 1
    hints:
    - गुलाल।
    - रंग-बिरंगा।
    solution: होली रंगों का त्योहार है।
    mistakes: {"दीयों का": "h1_tyohar", "पतंगों का": "h1_tyohar"}
  - prompt: होली पर कौन-सी मिठाई बनती है?
    options:
    - गुझिया
    - केक
    - आइसक्रीम ही
    answer: गुझिया
    difficulty: 2
    hints:
    - ग से।
    - मीठी भरावन वाली।
    solution: होली पर गुझिया बनती है।
    mistakes: {"केक": "h1_gujhiya", "आइसक्रीम ही": "h1_gujhiya"}
  - prompt: रंग डालने के लिए किसका उपयोग करते हैं?
    options:
    - पिचकारी
    - चम्मच
    - किताब
    answer: पिचकारी
    difficulty: 1
    hints:
    - पानी की धार।
    - प से।
    solution: पिचकारी से रंग डालते हैं।
    mistakes: {"चम्मच": "h1_pichkari", "किताब": "h1_pichkari"}
  - prompt: होली खेलते समय किसका ध्यान रखें?
    options:
    - आँखों का
    - जूतों का ही
    - किसी का नहीं
    answer: आँखों का
    difficulty: 2
    hints:
    - रंग आँख में न जाए।
    - सुरक्षा।
    solution: आँखों का ध्यान रखना चाहिए।
    mistakes: {"जूतों का ही": "h1_holi_aankh", "किसी का नहीं": "h1_holi_aankh"}
  - prompt: 'कोई रंग न लगवाना चाहे तो हमें:'
    options:
    - उसकी बात माननी चाहिए
    - ज़बरदस्ती रंग लगाना चाहिए
    - उसे चिढ़ाना चाहिए
    answer: उसकी बात माननी चाहिए
    difficulty: 2
    hints:
    - सबकी मर्ज़ी।
    - आदर।
    solution: उसकी बात माननी चाहिए।
    mistakes: {"ज़बरदस्ती रंग लगाना चाहिए": "h1_marzi", "उसे चिढ़ाना चाहिए": "h1_marzi"}
  - prompt: '''होली'' किस अक्षर से शुरू होता है?'
    options:
    - ह
    - ल
    - र
    answer: ह
    difficulty: 1
    hints:
    - पहली आवाज़।
    - हाथी वाला।
    solution: होली 'ह' से शुरू होता है।
    mistakes:
      ल: hin1_sound
  - prompt: होली पर लगाया जाने वाला सूखा रंगीन पाउडर क्या कहलाता है?
    options:
    - गुलाल
    - आटा
    - नमक
    answer: गुलाल
    difficulty: 1
    hints:
    - गालों पर लगाते हैं।
    - लाल, हरा, पीला होता है।
    solution: 'चरण 1: सूखा रंग। चरण 2: गुलाल।'
    mistakes:
      आटा: c1h15_rang
      नमक: c1h15_rang
  - prompt: आँख में रंग चला जाए तो क्या करें?
    options:
    - "साफ़ पानी से धोएँ और बड़े को बताएँ"
    - "आँख को हाथ से ज़ोर से रगड़ें"
    - "आँख में थोड़ा और रंग डालें"
    answer: साफ़ पानी से धोएँ और बड़े को बताएँ
    difficulty: 2
    hints:
    - रगड़ने से चोट बढ़ती है।
    - पानी से रंग निकलता है।
    solution: 'चरण 1: रगड़ो मत। चरण 2: पानी से धोओ, बड़ों को बताओ।'
    mistakes:
      "आँख को हाथ से ज़ोर से रगड़ें": c1h15_dhyan
      "आँख में थोड़ा और रंग डालें": c1h15_dhyan
  - prompt: होली किस मौसम में आती है?
    options:
    - बसंत
    - बरसात
    - कड़ी ठंड
    answer: बसंत
    difficulty: 2
    hints:
    - फूल खिलते हैं, न ज़्यादा ठंड, न गरमी।
    - फागुन का महीना।
    solution: 'चरण 1: फागुन में होली। चरण 2: बसंत का मौसम।'
    mistakes:
      बरसात: c1h15_rang
      कड़ी ठंड: c1h15_rang
  - prompt: चार गुझिया थीं, तीन और बनीं। कुल कितनी?
    options:
    - सात
    - छह
    - एक
    answer: सात
    difficulty: 2
    hints:
    - दोनों मिलाओ।
    - चार के आगे तीन गिनो।
    solution: 'चरण 1: 4 + 3। चरण 2: सात।'
    mistakes:
      छह: c1h15_ginti
      एक: c1h15_ginti
  - prompt: फूलों से बने रंग अच्छे क्यों हैं?
    options:
    - "त्वचा और आँखों को नुकसान नहीं करते"
    - "ये बाज़ार में बहुत महँगे मिलते हैं"
    - "ये रंग धोने पर कभी नहीं छूटते"
    answer: त्वचा और आँखों को नुकसान नहीं करते
    difficulty: 3
    hints:
    - कुछ रंगों में रसायन होते हैं।
    - शरीर की सुरक्षा।
    solution: 'चरण 1: प्राकृतिक रंग कोमल। चरण 2: नुकसान नहीं करते।'
    mistakes:
      "ये बाज़ार में बहुत महँगे मिलते हैं": c1h15_dhyan
      "ये रंग धोने पर कभी नहीं छूटते": c1h15_dhyan
  - prompt: दोस्त कहे 'मुझे रंग नहीं लगवाना', तो?
    options:
    - उसकी बात मानें
    - पकड़कर लगाएँ
    - उसका मज़ाक उड़ाएँ
    answer: उसकी बात मानें
    difficulty: 1
    hints:
    - दोस्त ने साफ़ मना किया।
    - उसकी मर्ज़ी।
    solution: 'चरण 1: ''नहीं'' का मतलब नहीं। चरण 2: बात मानो।'
    mistakes:
      पकड़कर लगाएँ: c1h15_dhyan
      उसका मज़ाक उड़ाएँ: c1h15_dhyan
  - prompt: '''होली'' से तुक मिलाने वाला शब्द कौन-सा?'
    options:
    - टोली
    - हाथी
    - हरा
    answer: टोली
    difficulty: 2
    hints:
    - आखिर की आवाज़ '...ओली' सुनो।
    - दोस्तों का समूह।
    solution: 'चरण 1: हो-ली। चरण 2: टो-ली।'
    mistakes:
      हाथी: c1h15_shabd
      हरा: c1h15_shabd
  - prompt: होली पर पानी का ध्यान क्यों रखें?
    options:
    - पानी कीमती है, बर्बाद न हो
    - पानी गंदा होता है
    - पानी से रंग नहीं बनता
    answer: पानी कीमती है, बर्बाद न हो
    difficulty: 3
    hints:
    - कई जगह पीने का पानी कम है।
    - बचत की बात।
    solution: 'चरण 1: पानी सीमित है। चरण 2: कम पानी से खेलो।'
    mistakes:
      पानी गंदा होता है: c1h15_dhyan
      पानी से रंग नहीं बनता: c1h15_dhyan
  - prompt: '''रंग'' का बहुवचन क्या है?'
    options:
    - रंग
    - रंगें
    - रंगा
    answer: रंग
    difficulty: 3
