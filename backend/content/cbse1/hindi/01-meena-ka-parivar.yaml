# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 1. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 1
title: मीना का परिवार
tips:
  hin1_read_again: पाठ और उसके चित्र फिर से देखो। उत्तर वहीं है।
  hin1_word: शब्द को एक छोटे वाक्य में बोलकर देखो।
  hin1_sound: दोनों शब्द धीरे-धीरे बोलो। पहली या आखिरी आवाज़ सुनो।
  h1_ghar_kaam: "सोचो, घर के काम में कौन-सी बात माँ-पापा का काम हल्का करती है।"
  h1_rishta: "रिश्ता पहचानो: पापा की ओर के रिश्तों और मम्मी की ओर के रिश्तों के नाम अलग होते हैं।"
  h1_saath: "सोचो, जब सब एक साथ रहते और काम करते हैं तो घर में कैसा लगता है।"
  c1h1_rishta: अपने घर के बड़ों को याद करो। कौन किसका माता-पिता है?
  c1h1_madad: सोचो, कौन-सा काम घर के लोगों का काम हल्का करेगा?
  c1h1_akshar: शब्द को धीरे से बोलो और पहली आवाज़ सुनो।
concepts:
- code: cbse1h.01.meena
  title: मीना का परिवार
  notes: |
    मीना और उसके परिवार के बारे में पाठ: माँ, पिता, दादा-दादी, भाई-बहन; परिवार में सब मिलकर रहते हैं। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ मीना के परिवार के बारे में है। परिवार में माँ, पिता, दादा-दादी, भाई-बहन होते हैं। सब मिलकर रहते हैं और एक-दूसरे की मदद करते हैं।
    visual: 'चित्र बनाओ: मीना अपने परिवार के साथ, सबके नाम लिखो।'
    step_by_step: 1. पाठ पढ़ो। 2. मीना के परिवार में कौन-कौन है? 3. सब मिलकर क्या करते हैं? 4. अपने परिवार के बारे में बताओ।
    real_world: त्योहार पर पूरा परिवार साथ बैठकर खाना खाता है।
  picture:
    kind: compare
    columns:
    - title: परिवार
      points:
      - माँ
      - पिता
      - दादी
    - title: काम
      points:
      - खाना बनाती
      - दफ़्तर जाते
      - कहानी सुनाती
    alt: माँ खाना बनाती हैं, पिता दफ़्तर जाते हैं और दादी कहानी सुनाती हैं।
  activity:
    type: sort
    prompt: परिवार में कौन बड़े हैं और कौन बच्चे?
    bins:
    - बड़े
    - बच्चे
    items:
    - label: 👴 दादा
      bin: बड़े
      clue: पापा के पापा?
      why: दादा बड़े हैं।
    - label: 👵 दादी
      bin: बड़े
      clue: पापा की माँ?
      why: दादी बड़ी हैं।
    - label: 👩 माँ
      bin: बड़े
      clue: कौन खाना खिलाती है?
      why: माँ बड़ी हैं।
    - label: 👧 मीना
      bin: बच्चे
      clue: पाठ की बच्ची?
      why: मीना बच्ची है।
    - label: 👦 छोटा भाई
      bin: बच्चे
      clue: भाई बड़ा है या छोटा?
      why: छोटा भाई बच्चा है।
  lesson:
    - teach: 'परिवार में घर के लोग होते हैं: माँ, पिता, दादा, दादी, भाई, बहन। सब मिलकर रहते हैं और एक-दूसरे का ध्यान रखते हैं।'
      picture:
        kind: flow
        steps:
        - दादा-दादी
        - माँ-पिता
        - भाई-बहन
        alt: 'परिवार के लोग: दादा-दादी, माँ-पिता, भाई-बहन।'
      check:
        prompt: इनमें से कौन परिवार का सदस्य है?
        options:
        - बहन
        - कुर्सी
        - पेड़
        answer: बहन
        why: बहन घर के लोगों में से है।
      ways:
      - style: step_by_step
        teach: 'अपने परिवार को गिनो। पहला: अपनी उँगली पर अपने को गिनो। दूसरा: घर के हर बड़े के लिए एक उँगली खोलो। तीसरा: हर भाई-बहन के लिए एक उँगली और खोलो। चौथा: सब खुली उँगलियाँ गिन लो।'
      - style: real_world
        teach: त्योहार के दिन घर में सब लोग एक साथ बैठकर खाना खाते हैं, बातें करते हैं और हँसते हैं।
    - teach: पिता के माता-पिता दादा-दादी हैं। माँ के माता-पिता नाना-नानी हैं।
      check:
        prompt: माँ की माँ को क्या कहते हैं?
        options:
        - नानी
        - दादी
        - चाची
        answer: नानी
        why: माँ की ओर से नाना-नानी होते हैं।
      ways:
      - style: visual
        teach: पिता की तरफ़ के बड़े और माँ की तरफ़ के बड़े, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: पिता के माता-पिता
            points:
            - दादा जी
            - दादी जी
          - title: माँ के माता-पिता
            points:
            - नाना जी
            - नानी जी
          alt: पिता के माता-पिता दादा जी और दादी जी हैं। माँ के माता-पिता नाना जी और नानी जी हैं।
      - style: real_world
        teach: छुट्टियों में कई बच्चे अपने नाना-नानी के घर जाते हैं, और कुछ दादा-दादी के साथ ही रहते हैं।
    - teach: 'परिवार में सब मदद करते हैं। हम भी मदद कर सकते हैं: खिलौने रखना, पानी लाना, पौधों को पानी देना।'
      check:
        prompt: घर में हम कैसे मदद कर सकते हैं?
        options:
        - खिलौने जगह पर रखकर
        - चीज़ें फेंककर
        - शोर करके
        answer: खिलौने जगह पर रखकर
        why: चीज़ें जगह पर रखने से घर साफ़ रहता है।
      ways:
      - style: visual
        teach: घर में छोटे बच्चे कौन-कौन से काम कर सकते हैं, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - जूते जगह पर रखो
          - बिस्तर की चादर ठीक करो
          - किताबें बस्ते में रखो
          - मेज़ पोंछने में मदद करो
          alt: छोटे बच्चे जूते जगह पर रख सकते हैं, चादर ठीक कर सकते हैं, किताबें बस्ते में रख सकते हैं और मेज़ पोंछने में मदद कर सकते हैं।
      - style: real_world
        teach: जब माँ कपड़े सुखाती हैं, तो कई बच्चे उन्हें कपड़े की चिमटियाँ पकड़ाकर मदद करते हैं।
  items:
  - prompt: यह पाठ किसके परिवार के बारे में है?
    options:
    - मीना
    - रीना
    - रानी
    answer: मीना
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - म से शुरू।
    solution: यह मीना के परिवार के बारे में है।
    mistakes:
      रीना: hin1_read_again
  - prompt: परिवार में सब कैसे रहते हैं?
    options:
    - मिलकर
    - लड़कर
    - अलग-अलग
    answer: मिलकर
    difficulty: 1
    hints:
    - प्यार से।
    - साथ-साथ।
    solution: परिवार में सब मिलकर रहते हैं।
    mistakes: {"लड़कर": "h1_saath", "अलग-अलग": "h1_saath"}
  - prompt: पिता की माँ को क्या कहते हैं?
    options:
    - दादी
    - नानी
    - चाची
    answer: दादी
    difficulty: 2
    hints:
    - पिता की ओर से।
    - द से शुरू।
    solution: पिता की माँ दादी होती हैं।
    mistakes: {"नानी": "h1_rishta", "चाची": "h1_rishta"}
  - prompt: घर के कामों में हम क्या कर सकते हैं?
    options:
    - मदद
    - शोर
    - झगड़ा
    answer: मदद
    difficulty: 1
    hints:
    - छोटे-छोटे काम।
    - हाथ बँटाना।
    solution: हम घर के कामों में मदद कर सकते हैं।
    mistakes: {"शोर": "h1_ghar_kaam", "झगड़ा": "h1_ghar_kaam"}
  - prompt: '''माँ'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - म
    - न
    - प
    answer: म
    difficulty: 2
    hints:
    - पहली आवाज़ सुनो।
    - मछली वाला।
    solution: माँ 'म' से शुरू होता है।
    mistakes:
      न: hin1_sound
  - prompt: '''परिवार'' में क्या आता है?'
    options:
    - घर के लोग
    - पेड़-पौधे
    - खिलौने
    answer: घर के लोग
    difficulty: 2
    hints:
    - साथ रहने वाले।
    - माँ, पिता...
    solution: परिवार यानी घर के लोग।
    mistakes:
      खिलौने: hin1_word
  - prompt: पिता के पिता को क्या कहते हैं?
    options:
    - दादा
    - नाना
    - मामा
    answer: दादा
    difficulty: 1
    hints:
    - पिता की ओर के बड़े।
    - दादी के साथ कौन?
    solution: 'चरण 1: पिता की ओर: दादा-दादी। चरण 2: पिता के पिता दादा।'
    mistakes:
      नाना: c1h1_rishta
      मामा: c1h1_rishta
  - prompt: माँ के पिता को क्या कहते हैं?
    options:
    - नाना
    - दादा
    - चाचा
    answer: नाना
    difficulty: 1
    hints:
    - माँ की ओर के बड़े।
    - नानी के साथ कौन?
    solution: 'चरण 1: माँ की ओर: नाना-नानी। चरण 2: माँ के पिता नाना।'
    mistakes:
      दादा: c1h1_rishta
      चाचा: c1h1_rishta
  - prompt: '''पिता'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - प
    - त
    - म
    answer: प
    difficulty: 1
    hints:
    - 'धीरे से बोलो: पि...'
    - होंठ मिलाकर बोलते हैं।
    solution: 'चरण 1: पि-ता। चरण 2: पहला अक्षर प।'
    mistakes:
      त: c1h1_akshar
      म: c1h1_akshar
  - prompt: दादी पानी माँगती हैं। हम क्या करें?
    options:
    - पानी लाकर दें
    - खेलते रहें
    - मना कर दें
    answer: पानी लाकर दें
    difficulty: 1
    hints:
    - दादी को मदद चाहिए।
    - छोटा-सा काम।
    solution: 'चरण 1: दादी को पानी चाहिए। चरण 2: हम लाकर दें।'
    mistakes:
      खेलते रहें: c1h1_madad
      मना कर दें: c1h1_madad
  - prompt: एक परिवार में माँ, पिता और दो बच्चे हैं। कितने लोग?
    options:
    - चार
    - दो
    - तीन
    answer: चार
    difficulty: 1
    hints:
    - हर व्यक्ति को एक बार गिनो।
    - दो बड़े और दो बच्चे।
    solution: 'चरण 1: माँ 1, पिता 2, बच्चे 3, 4। चरण 2: चार लोग।'
    mistakes:
      दो: c1h1_rishta
      तीन: c1h1_rishta
  - prompt: '''भाई'' के साथ जोड़ी वाला शब्द कौन-सा है?'
    options:
    - बहन
    - दादा
    - पेड़
    answer: बहन
    difficulty: 2
    hints:
    - भाई-___।
    - घर के बच्चे।
    solution: 'चरण 1: भाई और बहन जोड़ी हैं। चरण 2: बहन।'
    mistakes:
      दादा: c1h1_rishta
      पेड़: c1h1_rishta
  - prompt: खाने के बाद अपनी थाली कहाँ रखें?
    options:
    - रसोई में जगह पर
    - बिस्तर पर
    - फ़र्श पर
    answer: रसोई में जगह पर
    difficulty: 2
    hints:
    - बर्तन कहाँ धुलते हैं?
    - अपना काम खुद करो।
    solution: 'चरण 1: बर्तन रसोई में धुलते हैं। चरण 2: थाली रसोई में रखो।'
    mistakes:
      बिस्तर पर: c1h1_madad
      फ़र्श पर: c1h1_madad
  - prompt: '''माँ'' और ''मामा'' दोनों किस अक्षर से शुरू होते हैं?'
    options:
    - म
    - न
    - प
    answer: म
    difficulty: 2
    hints:
    - दोनों को धीरे से बोलो।
    - पहली आवाज़ एक जैसी है।
    solution: 'चरण 1: माँ और मा-मा। चरण 2: दोनों म से।'
    mistakes:
      न: c1h1_akshar
      प: c1h1_akshar
  - prompt: दादा-दादी, माँ-पिता और एक बच्चा। कितने लोग?
    options:
    - पाँच
    - चार
    - तीन
    answer: पाँच
    difficulty: 3
    hints:
    - दो जोड़ियाँ और एक बच्चा।
    - 2 और 2 और 1।
    solution: 'चरण 1: दादा-दादी 2, माँ-पिता 2। चरण 2: 2 + 2 + 1 = 5 लोग।'
    mistakes:
      चार: c1h1_rishta
      तीन: c1h1_rishta
  - prompt: 'स्थिति (केस): मीना की माँ बाज़ार से बहुत सारे थैले लेकर आईं। मीना क्या करे?'
    options:
    - एक छोटा थैला उठाकर अंदर रखे
    - बैठी-बैठी देखती रहे
    - थैले ज़मीन पर फेंक दे
    answer: एक छोटा थैला उठाकर अंदर रखे
    hints:
    - माँ के हाथ भरे हुए हैं।
    - कौन-सा काम माँ का काम हल्का करेगा?
    solution: छोटा थैला उठाकर अंदर रखने से माँ की मदद होती है। परिवार में सब एक-दूसरे की मदद करते हैं।
    mistakes:
      बैठी-बैठी देखती रहे: c1h1_madad
      थैले ज़मीन पर फेंक दे: c1h1_madad
    exam: case
    difficulty: 2
  - prompt: 'परिस्थिति: राजू की माँ की माँ घर आई हैं। राजू उन्हें क्या कहकर बुलाए?'
    options:
    - नानी जी
    - दादी जी
    - बुआ जी
    answer: नानी जी
    hints:
    - वे माँ की तरफ़ से हैं या पिता की तरफ़ से?
    - माँ की माँ को क्या कहते हैं?
    solution: माँ की माँ को नानी कहते हैं, इसलिए राजू उन्हें 'नानी जी' कहेगा।
    mistakes:
      दादी जी: c1h1_rishta
      बुआ जी: c1h1_rishta
    exam: competency
    difficulty: 2
