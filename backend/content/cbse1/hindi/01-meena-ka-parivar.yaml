subject: cbse1-hin
chapter: 1
title: मीना का परिवार
tips:
  hin1_read_again: पाठ और उसके चित्र फिर से देखो। उत्तर वहीं है।
  hin1_word: शब्द को एक छोटे वाक्य में बोलकर देखो।
  hin1_sound: दोनों शब्द धीरे-धीरे बोलो। पहली या आखिरी आवाज़ सुनो।
  h1_ghar_kaam: "सोचो, घर के काम में कौन-सी बात माँ-पापा का काम हल्का करती है।"
  h1_rishta: "रिश्ता पहचानो: पापा की ओर के रिश्तों और मम्मी की ओर के रिश्तों के नाम अलग होते हैं।"
  h1_saath: "सोचो, जब सब एक साथ रहते और काम करते हैं तो घर में कैसा लगता है।"
concepts:
- code: cbse1h.01.meena
  title: मीना का परिवार
  notes: |
    मीना और उसके परिवार के बारे में पाठ: माँ, पिता, दादा-दादी, भाई-बहन; परिवार में सब मिलकर रहते हैं। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ मीना के परिवार के बारे में है। परिवार में माँ, पिता, दादा-दादी, भाई-बहन होते हैं। सब मिलकर रहते हैं और एक-दूसरे की मदद करते हैं।
    visual: 'चित्र बनाओ: मीना अपने परिवार के साथ, सबके नाम लिखो।'
    step_by_step: 1. पाठ पढ़ो। 2. मीना के परिवार में कौन-कौन है? 3. सब मिलकर क्या करते हैं? 4. अपने परिवार के बारे में बताओ।
    real_world: त्योहार पर पूरा परिवार साथ बैठकर खाना खाता है।
  picture:
    kind: compare
    columns:
    - title: परिवार
      points:
      - माँ
      - पिता
      - दादी
    - title: काम
      points:
      - खाना बनाती
      - दफ़्तर जाते
      - कहानी सुनाती
    alt: माँ खाना बनाती हैं, पिता दफ़्तर जाते हैं और दादी कहानी सुनाती हैं।
  items:
  - prompt: यह पाठ किसके परिवार के बारे में है?
    options:
    - मीना
    - रीना
    - रानी
    answer: मीना
    difficulty: 1
    hints:
    - पाठ का नाम देखो।
    - म से शुरू।
    solution: यह मीना के परिवार के बारे में है।
    mistakes:
      रीना: hin1_read_again
  - prompt: परिवार में सब कैसे रहते हैं?
    options:
    - मिलकर
    - लड़कर
    - अलग-अलग
    answer: मिलकर
    difficulty: 1
    hints:
    - प्यार से।
    - साथ-साथ।
    solution: परिवार में सब मिलकर रहते हैं।
    mistakes: {"लड़कर": "h1_saath", "अलग-अलग": "h1_saath"}
  - prompt: पिता की माँ को क्या कहते हैं?
    options:
    - दादी
    - नानी
    - चाची
    answer: दादी
    difficulty: 2
    hints:
    - पिता की ओर से।
    - द से शुरू।
    solution: पिता की माँ दादी होती हैं।
    mistakes: {"नानी": "h1_rishta", "चाची": "h1_rishta"}
  - prompt: घर के कामों में हम क्या कर सकते हैं?
    options:
    - मदद
    - शोर
    - झगड़ा
    answer: मदद
    difficulty: 1
    hints:
    - छोटे-छोटे काम।
    - हाथ बँटाना।
    solution: हम घर के कामों में मदद कर सकते हैं।
    mistakes: {"शोर": "h1_ghar_kaam", "झगड़ा": "h1_ghar_kaam"}
  - prompt: '''माँ'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - म
    - न
    - प
    answer: म
    difficulty: 2
    hints:
    - पहली आवाज़ सुनो।
    - मछली वाला।
    solution: माँ 'म' से शुरू होता है।
    mistakes:
      न: hin1_sound
  - prompt: '''परिवार'' में क्या आता है?'
    options:
    - घर के लोग
    - पेड़-पौधे
    - खिलौने
    answer: घर के लोग
    difficulty: 2
    hints:
    - साथ रहने वाले।
    - माँ, पिता...
    solution: परिवार यानी घर के लोग।
    mistakes:
      खिलौने: hin1_word
