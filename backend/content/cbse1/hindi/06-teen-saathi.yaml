# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 6. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 6
title: तीन साथी
tips:
  h1_ginti: "उँगलियों पर गिनती बोलो और ठीक उस संख्या के बाद रुककर अगली संख्या देखो।"
  h1_saathi: "सच्चा साथी वह है जो मुश्किल में भी पास रहे। वह पास रहकर क्या करेगा?"

concepts:
- code: cbse1h.06.teen
  title: तीन साथी
  notes: |
    तीन साथियों पर कहानी/कविता: मिलकर काम, एक-दूसरे की मदद, दोस्ती। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ तीन साथियों के बारे में है। साथी मिलकर खेलते और काम करते हैं, और मुश्किल में एक-दूसरे की मदद करते हैं।
    visual: 'चित्र बनाओ: तीन साथी मिलकर एक भारी डिब्बा उठा रहे हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. साथी कितने हैं? 3. उन्होंने मिलकर क्या किया? 4. अच्छा साथी कैसा होता है?
    real_world: रस्साकशी में सब मिलकर रस्सी खींचते हैं।
  picture:
    kind: flow
    steps:
    - काम भारी था
    - तीनों साथ आए
    - मिलकर उठाया
    - काम हो गया
    alt: काम भारी था, तीनों साथ आए, मिलकर उठाया और काम हो गया।
  activity:
    type: sort
    prompt: अच्छे साथी क्या करते हैं?
    bins:
    - अच्छे साथी करते हैं
    - अच्छे साथी नहीं करते
    items:
    - label: 🤝 एक-दूसरे की मदद
      bin: अच्छे साथी करते हैं
      clue: दोस्त गिर जाए तो?
      why: मदद करना दोस्ती है।
    - label: 🧩 मिलकर काम
      bin: अच्छे साथी करते हैं
      clue: साथ करने से काम आसान?
      why: मिलकर काम।
    - label: 🍎 खाना बाँटना
      bin: अच्छे साथी करते हैं
      clue: दोस्त भूखा हो तो?
      why: बाँटना।
    - label: 😤 झगड़ना और छीनना
      bin: अच्छे साथी नहीं करते
      clue: क्या इससे दोस्ती बढ़ेगी?
      why: छीनना ठीक नहीं।
  items:
  - prompt: पाठ में कितने साथी हैं?
    options:
    - तीन
    - दो
    - पाँच
    answer: तीन
    difficulty: 1
    hints:
    - पाठ का नाम।
    - 3।
    solution: तीन साथी हैं।
    mistakes:
      दो: hin1_read_again
  - prompt: साथी मुश्किल में क्या करते हैं?
    options:
    - मदद
    - भाग जाते हैं
    - हँसते हैं
    answer: मदद
    difficulty: 1
    hints:
    - अच्छे दोस्त।
    - साथ देना।
    solution: साथी मदद करते हैं।
    mistakes: {"भाग जाते हैं": "h1_saathi", "हँसते हैं": "h1_saathi"}
  - prompt: 'मिलकर काम करने से काम:'
    options:
    - आसान होता है
    - मुश्किल होता है
    - रुक जाता है
    answer: आसान होता है
    difficulty: 1
    hints:
    - कई हाथ।
    - जल्दी।
    solution: मिलकर काम आसान होता है।
    mistakes: {"मुश्किल होता है": "h1_saath", "रुक जाता है": "h1_saath"}
  - prompt: '''साथी'' का दूसरा शब्द क्या है?'
    options:
    - दोस्त
    - दुश्मन
    - राजा
    answer: दोस्त
    difficulty: 2
    hints:
    - जो साथ रहे।
    - मित्र।
    solution: साथी यानी दोस्त।
    mistakes:
      दुश्मन: hin1_word
  - prompt: तीन के बाद कौन-सी गिनती आती है?
    options:
    - चार
    - दो
    - छह
    answer: चार
    difficulty: 1
    hints:
    - एक, दो, तीन ...
    - एक आगे।
    solution: तीन के बाद चार आती है।
    mistakes: {"दो": "h1_ginti", "छह": "h1_ginti"}
  - prompt: 'अच्छा साथी चीज़ें:'
    options:
    - बाँटता है
    - छीनता है
    - तोड़ता है
    answer: बाँटता है
    difficulty: 2
    hints:
    - दोस्ती।
    - साझा करना।
    solution: अच्छा साथी चीज़ें बाँटता है।
    mistakes: {"छीनता है": "h1_baant", "तोड़ता है": "h1_baant"}
