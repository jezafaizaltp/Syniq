# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 6. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 6
title: तीन साथी
tips:
  h1_ginti: "उँगलियों पर गिनती बोलो और ठीक उस संख्या के बाद रुककर अगली संख्या देखो।"
  h1_saathi: "सच्चा साथी वह है जो मुश्किल में भी पास रहे। वह पास रहकर क्या करेगा?"
  c1h6_saath: "सोचो, मुश्किल में तुम दोस्त से क्या चाहोगे?"
  c1h6_ginti: उँगलियों पर गिनो, किसी को छोड़ो मत।
  c1h6_shabd: "शब्द में \"साथ\" छिपा है या नहीं? हर अक्षर ध्यान से पढ़ो।"

concepts:
- code: cbse1h.06.teen
  title: तीन साथी
  notes: |
    तीन साथियों पर कहानी/कविता: मिलकर काम, एक-दूसरे की मदद, दोस्ती। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ तीन साथियों के बारे में है। साथी मिलकर खेलते और काम करते हैं, और मुश्किल में एक-दूसरे की मदद करते हैं।
    visual: 'चित्र बनाओ: तीन साथी मिलकर एक भारी डिब्बा उठा रहे हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. साथी कितने हैं? 3. उन्होंने मिलकर क्या किया? 4. अच्छा साथी कैसा होता है?
    real_world: रस्साकशी में सब मिलकर रस्सी खींचते हैं।
  picture:
    kind: flow
    steps:
    - काम भारी था
    - तीनों साथ आए
    - मिलकर उठाया
    - काम हो गया
    alt: काम भारी था, तीनों साथ आए, मिलकर उठाया और काम हो गया।
  activity:
    type: sort
    prompt: अच्छे साथी क्या करते हैं?
    bins:
    - अच्छे साथी करते हैं
    - अच्छे साथी नहीं करते
    items:
    - label: 🤝 एक-दूसरे की मदद
      bin: अच्छे साथी करते हैं
      clue: दोस्त गिर जाए तो?
      why: मदद करना दोस्ती है।
    - label: 🧩 मिलकर काम
      bin: अच्छे साथी करते हैं
      clue: साथ करने से काम आसान?
      why: मिलकर काम।
    - label: 🍎 खाना बाँटना
      bin: अच्छे साथी करते हैं
      clue: दोस्त भूखा हो तो?
      why: बाँटना।
    - label: 😤 झगड़ना और छीनना
      bin: अच्छे साथी नहीं करते
      clue: क्या इससे दोस्ती बढ़ेगी?
      why: छीनना ठीक नहीं।
  lesson:
    - teach: '''तीन साथी'' पाठ में तीन साथी हैं। वे साथ खेलते हैं, साथ काम करते हैं और एक-दूसरे की मदद करते हैं।'
      check:
        prompt: साथी मिलकर काम करें तो काम कैसा होता है?
        options:
        - आसान
        - कठिन
        - बंद
        answer: आसान
        why: कई हाथ मिलें तो काम हल्का हो जाता है।
    - teach: 'गिनती: एक, दो, तीन, चार, पाँच। तीन साथी और एक और आए तो चार।'
      picture:
        kind: number_line
        from: 0
        to: 5
        points:
        - at: 3
          label: तीन
        - at: 4
          label: चार
        jumps:
        - from: 3
          to: 4
        alt: तीन से एक आगे चार।
      check:
        prompt: दो के बाद कौन-सी गिनती आती है?
        options:
        - तीन
        - एक
        - पाँच
        answer: तीन
        why: एक, दो, तीन।
    - teach: अच्छे साथी बाँटते हैं, बारी-बारी खेलते हैं और झगड़ा होने पर 'माफ़ करना' कहते हैं। 'साथी' का दूसरा शब्द दोस्त या मित्र।
      check:
        prompt: '''मित्र'' का अर्थ क्या है?'
        options:
        - दोस्त
        - दुकान
        - दरवाज़ा
        answer: दोस्त
        why: मित्र और दोस्त एक ही बात है।
  items:
  - prompt: पाठ में कितने साथी हैं?
    options:
    - तीन
    - दो
    - पाँच
    answer: तीन
    difficulty: 1
    hints:
    - पाठ का नाम।
    - 3।
    solution: तीन साथी हैं।
    mistakes:
      दो: hin1_read_again
  - prompt: साथी मुश्किल में क्या करते हैं?
    options:
    - मदद
    - भाग जाते हैं
    - हँसते हैं
    answer: मदद
    difficulty: 1
    hints:
    - अच्छे दोस्त।
    - साथ देना।
    solution: साथी मदद करते हैं।
    mistakes: {"भाग जाते हैं": "h1_saathi", "हँसते हैं": "h1_saathi"}
  - prompt: 'मिलकर काम करने से काम:'
    options:
    - आसान होता है
    - मुश्किल होता है
    - रुक जाता है
    answer: आसान होता है
    difficulty: 1
    hints:
    - कई हाथ।
    - जल्दी।
    solution: मिलकर काम आसान होता है।
    mistakes: {"मुश्किल होता है": "h1_saath", "रुक जाता है": "h1_saath"}
  - prompt: '''साथी'' का दूसरा शब्द क्या है?'
    options:
    - दोस्त
    - दुश्मन
    - राजा
    answer: दोस्त
    difficulty: 2
    hints:
    - जो साथ रहे।
    - मित्र।
    solution: साथी यानी दोस्त।
    mistakes:
      दुश्मन: hin1_word
  - prompt: तीन के बाद कौन-सी गिनती आती है?
    options:
    - चार
    - दो
    - छह
    answer: चार
    difficulty: 1
    hints:
    - एक, दो, तीन ...
    - एक आगे।
    solution: तीन के बाद चार आती है।
    mistakes: {"दो": "h1_ginti", "छह": "h1_ginti"}
  - prompt: 'अच्छा साथी चीज़ें:'
    options:
    - बाँटता है
    - छीनता है
    - तोड़ता है
    answer: बाँटता है
    difficulty: 2
    hints:
    - दोस्ती।
    - साझा करना।
    solution: अच्छा साथी चीज़ें बाँटता है।
    mistakes: {"छीनता है": "h1_baant", "तोड़ता है": "h1_baant"}
  - prompt: चार के बाद कौन-सी गिनती आती है?
    options:
    - पाँच
    - तीन
    - छह
    answer: पाँच
    difficulty: 1
    hints:
    - तीन, चार, ...
    - एक हाथ की सारी उँगलियाँ।
    solution: 'चरण 1: चार के बाद एक आगे। चरण 2: पाँच।'
    mistakes:
      तीन: c1h6_ginti
      छह: c1h6_ginti
  - prompt: साथी के पास रंग नहीं हैं। हम क्या करें?
    options:
    - अपने रंग बाँटें
    - हँसें
    - छिपा लें
    answer: अपने रंग बाँटें
    difficulty: 1
    hints:
    - अच्छे साथी बाँटते हैं।
    - साथ रंग भरो।
    solution: 'चरण 1: साथी को रंग चाहिए। चरण 2: अपने रंग बाँटो।'
    mistakes:
      हँसें: c1h6_saath
      छिपा लें: c1h6_saath
  - prompt: तीन साथियों में से एक घर चला गया। कितने बचे?
    options:
    - दो
    - तीन
    - एक
    answer: दो
    difficulty: 1
    hints:
    - तीन में से एक कम।
    - उँगलियों पर गिनो।
    solution: 'चरण 1: 3 − 1। चरण 2: दो साथी।'
    mistakes:
      तीन: c1h6_ginti
      एक: c1h6_ginti
  - prompt: साथी से झगड़ा हो जाए तो क्या करें?
    options:
    - बात करके माफ़ी माँगें
    - मारपीट करें
    - हमेशा बात बंद
    answer: बात करके माफ़ी माँगें
    difficulty: 1
    hints:
    - दोस्ती बचानी है।
    - बातचीत से हल।
    solution: 'चरण 1: झगड़े से दोनों दुखी। चरण 2: बात करो, माफ़ी माँगो।'
    mistakes:
      मारपीट करें: c1h6_saath
      हमेशा बात बंद: c1h6_saath
  - prompt: '''तीन'' के लिए अंक कौन-सा है?'
    options:
    - '3'
    - '2'
    - '5'
    answer: '3'
    difficulty: 1
    hints:
    - एक, दो, तीन।
    - तीन उँगलियाँ उठाओ।
    solution: 'चरण 1: तीन उँगलियाँ गिनो। चरण 2: अंक 3।'
    mistakes:
      '2': c1h6_ginti
      '5': c1h6_ginti
  - prompt: तीन साथी, हर एक के पास 1 गेंद। कुल कितनी गेंदें?
    options:
    - तीन
    - एक
    - छह
    answer: तीन
    difficulty: 2
    hints:
    - हर साथी की एक गेंद।
    - साथियों जितनी गेंदें।
    solution: 'चरण 1: हर एक की 1 गेंद। चरण 2: 3 साथी = 3 गेंदें।'
    mistakes:
      एक: c1h6_ginti
      छह: c1h6_ginti
  - prompt: झूले पर एक बार में एक बच्चा बैठ सकता है। तीन साथी क्या करें?
    options:
    - बारी-बारी झूलें
    - एक ही झूले
    - झूला तोड़ दें
    answer: बारी-बारी झूलें
    difficulty: 2
    hints:
    - सबको मौका मिले।
    - एक के बाद एक।
    solution: 'चरण 1: एक बार में एक। चरण 2: बारी-बारी से सब झूलें।'
    mistakes:
      एक ही झूले: c1h6_saath
      झूला तोड़ दें: c1h6_saath
  - prompt: '''साथ'' से बना शब्द कौन-सा है?'
    options:
    - साथी
    - सात
    - साड़ी
    answer: साथी
    difficulty: 2
    hints:
    - जो साथ रहे।
    - साथ + ई।
    solution: 'चरण 1: साथ + ई। चरण 2: साथी।'
    mistakes:
      सात: c1h6_ginti
      साड़ी: c1h6_shabd
  - prompt: तीन साथी और दो नए साथी। कुल कितने?
    options:
    - पाँच
    - तीन
    - चार
    answer: पाँच
    difficulty: 3
    hints:
    - तीन से आगे दो गिनो।
    - चार, फिर?
    solution: 'चरण 1: 3 + 2। चरण 2: पाँच साथी।'
    mistakes:
      तीन: c1h6_ginti
      चार: c1h6_ginti
