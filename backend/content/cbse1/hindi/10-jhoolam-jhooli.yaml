# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 10. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 10
title: झूलम-झूली
tips:
  h1_baari: "एक झूला, कई बच्चे। सबको मौका कैसे मिलेगा?"
  h1_jagah: "सोचो, बच्चे खुले में खेलने कहाँ जाते हैं जहाँ फिसलपट्टी भी होती है।"
  h1_jhoola: "झूले पर बैठो तो वह किधर जाता है और फिर किधर लौटता है?"
  c1h10_akshar: शब्द को धीरे से बोलो और पहली आवाज़ ध्यान से सुनो।
  c1h10_jhoola: 'मन में झूले पर बैठो: तुम कैसे हिलते हो, और क्या पकड़ते हो?'
  c1h10_ulta: उलटा शब्द बिलकुल दूसरी तरफ़ का होता है, जैसे दिन-रात।
  c1h10_baari: सोचो, सबको खेल मिले, इसके लिए क्या ठीक रहेगा?

concepts:
- code: cbse1h.10.jhoolam
  title: झूलम-झूली
  notes: |
    झूले पर कविता: झूला झूलना, ऊपर-नीचे, आगे-पीछे, बारी-बारी से झूलना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: झूला झूलने में बहुत मज़ा आता है! झूला आगे-पीछे, ऊपर-नीचे जाता है। हम बारी-बारी से झूलते हैं और कसकर पकड़ते हैं।
    visual: 'चित्र बनाओ: पेड़ की डाल पर रस्सी का झूला और उस पर झूलता बच्चा।'
    step_by_step: 1. कविता लय से बोलो। 2. झूला कैसे चलता है? 3. झूलते समय क्या ध्यान रखें? 4. तुकांत शब्द खोजो।
    real_world: सावन में पेड़ों पर झूले डाले जाते हैं।
  picture:
    kind: flow
    steps:
    - झूले पर बैठो
    - कसकर पकड़ो
    - आगे-पीछे झूलो
    - बारी दो
    alt: झूले पर बैठो, कसकर पकड़ो, आगे-पीछे झूलो और फिर दूसरों को बारी दो।
  activity:
    type: sort
    prompt: झूले पर कौन-सा तरीक़ा ठीक है?
    bins:
    - ठीक
    - ठीक नहीं
    items:
    - label: 🔁 बारी-बारी से झूलना
      bin: ठीक
      clue: सबको मौक़ा मिले?
      why: बारी-बारी से झूलना ठीक।
    - label: ✊ रस्सी कसकर पकड़ना
      bin: ठीक
      clue: गिरने से कैसे बचें?
      why: कसकर पकड़ो।
    - label: 🫸 धक्का देकर हटाना
      bin: ठीक नहीं
      clue: दोस्त गिर सकता है?
      why: धक्का देना ठीक नहीं।
    - label: 🧍 झूले पर खड़े होना
      bin: ठीक नहीं
      clue: क्या यह सुरक्षित है?
      why: बैठकर झूलो।
  lesson:
    - teach: '''झूलम-झूली'' कविता झूले की है। झूला आगे-पीछे जाता है। झूले की रस्सी या कड़ी कसकर पकड़नी होती है, ताकि गिरें नहीं।'
      picture:
        kind: flow
        steps:
        - बैठो
        - रस्सी पकड़ो
        - आगे जाओ
        - पीछे आओ
        alt: झूला झूलने के चार कदम।
      check:
        prompt: झूलते समय हाथों से क्या करना चाहिए?
        options:
        - रस्सी कसकर पकड़ना
        - ताली बजाना
        - हाथ छोड़ देना
        answer: रस्सी कसकर पकड़ना
        why: पकड़ ढीली हुई तो गिर सकते हैं।
    - teach: पार्क में एक झूला और कई बच्चे हों तो बारी-बारी से झूलते हैं। हर बच्चा थोड़ी देर झूले, फिर अगले को दे। ऐसे सबको मज़ा मिलता है।
      check:
        prompt: चार बच्चे, एक झूला। सबसे अच्छा तरीका?
        options:
        - बारी-बारी से झूलना
        - एक ही बच्चा पूरा दिन
        - झगड़ा करना
        answer: बारी-बारी से झूलना
        why: बारी लेने से सबको मौका मिलता है।
    - teach: 'उलटे शब्द: ऊपर-नीचे, आगे-पीछे, अंदर-बाहर, ऊँचा-नीचा। झूला कभी ऊपर जाता है, कभी नीचे आता है।'
      picture:
        kind: compare
        columns:
        - title: शब्द
          points:
          - ऊपर
          - आगे
          - अंदर
        - title: उलटा
          points:
          - नीचे
          - पीछे
          - बाहर
        alt: उलटे शब्दों के तीन जोड़े।
      check:
        prompt: '''आगे'' का उलटा क्या है?'
        options:
        - पीछे
        - ऊपर
        - पास
        answer: पीछे
        why: आगे और पीछे दो उलटी दिशाएँ हैं।
  items:
  - prompt: झूला कैसे चलता है?
    options:
    - आगे-पीछे
    - गोल-गोल ज़मीन पर
    - बिल्कुल नहीं
    answer: आगे-पीछे
    difficulty: 1
    hints:
    - हवा में।
    - धक्का दो।
    solution: झूला आगे-पीछे चलता है।
    mistakes: {"गोल-गोल ज़मीन पर": "h1_jhoola", "बिल्कुल नहीं": "h1_jhoola"}
  - prompt: झूलते समय हमें क्या करना चाहिए?
    options:
    - कसकर पकड़ना
    - हाथ छोड़ना
    - खड़े होकर कूदना
    answer: कसकर पकड़ना
    difficulty: 1
    hints:
    - गिरना नहीं।
    - सुरक्षा।
    solution: कसकर पकड़ना चाहिए।
    mistakes: {"हाथ छोड़ना": "h1_suraksha", "खड़े होकर कूदना": "h1_suraksha"}
  - prompt: झूले पर हम कैसे झूलते हैं?
    options:
    - बारी-बारी से
    - धक्का-मुक्की से
    - छीनकर
    answer: बारी-बारी से
    difficulty: 1
    hints:
    - सबको मौका।
    - इंतज़ार।
    solution: बारी-बारी से झूलते हैं।
    mistakes: {"धक्का-मुक्की से": "h1_baari", "छीनकर": "h1_baari"}
  - prompt: '''ऊपर'' का उलटा क्या है?'
    options:
    - नीचे
    - आगे
    - अंदर
    answer: नीचे
    difficulty: 2
    hints:
    - ज़मीन की ओर।
    - न से।
    solution: ऊपर का उलटा नीचे है।
    mistakes: {"आगे": "h1_ulta", "अंदर": "h1_ulta"}
  - prompt: '''झूला'' किस अक्षर से शुरू होता है?'
    options:
    - झ
    - ज
    - ल
    answer: झ
    difficulty: 2
    hints:
    - पहली आवाज़।
    - झंडा वाला।
    solution: झूला 'झ' से शुरू होता है।
    mistakes:
      ज: hin1_sound
  - prompt: झूला कहाँ होता है?
    options:
    - पार्क में
    - रसोई में
    - बस के अंदर
    answer: पार्क में
    difficulty: 1
    hints:
    - खेलने की जगह।
    - पेड़ भी।
    solution: झूला पार्क में होता है।
    mistakes: {"रसोई में": "h1_jagah", "बस के अंदर": "h1_jagah"}
  - prompt: '''अंदर'' का उलटा क्या है?'
    options:
    - बाहर
    - ऊपर
    - आगे
    answer: बाहर
    difficulty: 1
    hints:
    - कमरे में हो, फिर दरवाज़े से निकलो।
    - दूसरी तरफ़ की जगह।
    solution: 'चरण 1: अंदर-? का जोड़ा। चरण 2: बाहर।'
    mistakes:
      ऊपर: c1h10_ulta
      आगे: c1h10_ulta
  - prompt: झूले से उतरने से पहले क्या करें?
    options:
    - झूला रुकने दें
    - चलते झूले से कूदें
    - आँखें बंद करें
    answer: झूला रुकने दें
    difficulty: 2
    hints:
    - चलते झूले से गिर सकते हैं।
    - धीमा होने का इंतज़ार।
    solution: 'चरण 1: चलता झूला खतरनाक। चरण 2: रुकने पर उतरें।'
    mistakes:
      चलते झूले से कूदें: c1h10_jhoola
      आँखें बंद करें: c1h10_jhoola
  - prompt: कोई झूले के ठीक सामने खड़ा है। क्या करें?
    options:
    - उसे दूर हटने को कहें
    - और ज़ोर से झूलें
    - कुछ न कहें
    answer: उसे दूर हटने को कहें
    difficulty: 2
    hints:
    - झूला उसे टकरा सकता है।
    - उसकी सुरक्षा सोचो।
    solution: 'चरण 1: झूला आगे आएगा। चरण 2: उसे हटने को कहो।'
    mistakes:
      और ज़ोर से झूलें: c1h10_jhoola
      कुछ न कहें: c1h10_jhoola
  - prompt: '''झूलम-झूली'' में कौन-सा शब्द दोहराया-सा लगता है?'
    options:
    - झूल
    - पार्क
    - रस्सी
    answer: झूल
    difficulty: 3
    hints:
    - दोनों हिस्सों की शुरुआत देखो।
    - झूल-म, झूल-ी।
    solution: 'चरण 1: दोनों हिस्से एक ही शब्द से। चरण 2: झूल।'
    mistakes:
      पार्क: c1h10_akshar
      रस्सी: c1h10_akshar
  - prompt: तुम्हारी बारी खत्म हुई। अब क्या करोगे?
    options:
    - अगले बच्चे को झूला दोगे
    - झूले पर बैठे रहोगे
    - झूला ले जाओगे
    answer: अगले बच्चे को झूला दोगे
    difficulty: 1
    hints:
    - कोई इंतज़ार कर रहा है।
    - सबको मौका।
    solution: 'चरण 1: बारी खत्म। चरण 2: अगले को दो।'
    mistakes:
      झूले पर बैठे रहोगे: c1h10_baari
      झूला ले जाओगे: c1h10_baari
  - prompt: '''ऊँचा'' का उलटा क्या है?'
    options:
    - नीचा
    - लंबा
    - मोटा
    answer: नीचा
    difficulty: 2
    hints:
    - पहाड़ और गड्ढा सोचो।
    - ऊपर-नीचे जैसा जोड़ा।
    solution: 'चरण 1: ऊँचा मतलब ऊपर तक। चरण 2: उलटा नीचा।'
    mistakes:
      लंबा: c1h10_ulta
      मोटा: c1h10_ulta
  - prompt: छह बच्चे, दो झूले। हर झूले पर बराबर बारी हो तो एक झूले के कितने बच्चे?
    options:
    - तीन
    - दो
    - छह
    answer: तीन
    difficulty: 3
    hints:
    - बच्चों को दो टोलियों में बाँटो।
    - एक-एक करके दोनों झूलों को दो।
    solution: 'चरण 1: 6 को दो बराबर हिस्सों में। चरण 2: हर झूले पर तीन।'
    mistakes:
      दो: c1h10_baari
      छह: c1h10_baari
  - prompt: सावन में पेड़ की डाल पर झूला क्यों डालते हैं?
    options:
    - त्योहार और मौसम का मज़ा लेने
    - डाल तोड़ने
    - पेड़ काटने
    answer: त्योहार और मौसम का मज़ा लेने
    difficulty: 3
    hints:
    - सावन बारिश का महीना है।
    - लोग मिलकर गाते और झूलते हैं।
    solution: 'चरण 1: सावन में हरियाली और त्योहार। चरण 2: झूला मज़े के लिए।'
    mistakes:
      डाल तोड़ने: c1h10_jhoola
      पेड़ काटने: c1h10_jhoola
  - prompt: '''झूला'' में पहला अक्षर कौन-सा है?'
    options:
    - झू
    - ला
    - जू
    answer: झू
    difficulty: 1
    hints:
    - 'धीरे बोलो: झू... ला।'
    - '''ज'' और ''झ'' की आवाज़ अलग है।'
    solution: 'चरण 1: झू-ला दो हिस्से। चरण 2: पहला झू।'
    mistakes:
      ला: c1h10_akshar
      जू: c1h10_akshar
