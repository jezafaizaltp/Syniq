subject: cbse1-hin
chapter: 10
title: झूलम-झूली
tips:
  h1_baari: "एक झूला, कई बच्चे। सबको मौका कैसे मिलेगा?"
  h1_jagah: "सोचो, बच्चे खुले में खेलने कहाँ जाते हैं जहाँ फिसलपट्टी भी होती है।"
  h1_jhoola: "झूले पर बैठो तो वह किधर जाता है और फिर किधर लौटता है?"

concepts:
- code: cbse1h.10.jhoolam
  title: झूलम-झूली
  notes: |
    झूले पर कविता: झूला झूलना, ऊपर-नीचे, आगे-पीछे, बारी-बारी से झूलना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: झूला झूलने में बहुत मज़ा आता है! झूला आगे-पीछे, ऊपर-नीचे जाता है। हम बारी-बारी से झूलते हैं और कसकर पकड़ते हैं।
    visual: 'चित्र बनाओ: पेड़ की डाल पर रस्सी का झूला और उस पर झूलता बच्चा।'
    step_by_step: 1. कविता लय से बोलो। 2. झूला कैसे चलता है? 3. झूलते समय क्या ध्यान रखें? 4. तुकांत शब्द खोजो।
    real_world: सावन में पेड़ों पर झूले डाले जाते हैं।
  picture:
    kind: flow
    steps:
    - झूले पर बैठो
    - कसकर पकड़ो
    - आगे-पीछे झूलो
    - बारी दो
    alt: झूले पर बैठो, कसकर पकड़ो, आगे-पीछे झूलो और फिर दूसरों को बारी दो।
  items:
  - prompt: झूला कैसे चलता है?
    options:
    - आगे-पीछे
    - गोल-गोल ज़मीन पर
    - बिल्कुल नहीं
    answer: आगे-पीछे
    difficulty: 1
    hints:
    - हवा में।
    - धक्का दो।
    solution: झूला आगे-पीछे चलता है।
    mistakes: {"गोल-गोल ज़मीन पर": "h1_jhoola", "बिल्कुल नहीं": "h1_jhoola"}
  - prompt: झूलते समय हमें क्या करना चाहिए?
    options:
    - कसकर पकड़ना
    - हाथ छोड़ना
    - खड़े होकर कूदना
    answer: कसकर पकड़ना
    difficulty: 1
    hints:
    - गिरना नहीं।
    - सुरक्षा।
    solution: कसकर पकड़ना चाहिए।
    mistakes: {"हाथ छोड़ना": "h1_suraksha", "खड़े होकर कूदना": "h1_suraksha"}
  - prompt: झूले पर हम कैसे झूलते हैं?
    options:
    - बारी-बारी से
    - धक्का-मुक्की से
    - छीनकर
    answer: बारी-बारी से
    difficulty: 1
    hints:
    - सबको मौका।
    - इंतज़ार।
    solution: बारी-बारी से झूलते हैं।
    mistakes: {"धक्का-मुक्की से": "h1_baari", "छीनकर": "h1_baari"}
  - prompt: '''ऊपर'' का उलटा क्या है?'
    options:
    - नीचे
    - आगे
    - अंदर
    answer: नीचे
    difficulty: 2
    hints:
    - ज़मीन की ओर।
    - न से।
    solution: ऊपर का उलटा नीचे है।
    mistakes: {"आगे": "h1_ulta", "अंदर": "h1_ulta"}
  - prompt: '''झूला'' किस अक्षर से शुरू होता है?'
    options:
    - झ
    - ज
    - ल
    answer: झ
    difficulty: 2
    hints:
    - पहली आवाज़।
    - झंडा वाला।
    solution: झूला 'झ' से शुरू होता है।
    mistakes:
      ज: hin1_sound
  - prompt: झूला कहाँ होता है?
    options:
    - पार्क में
    - रसोई में
    - बस के अंदर
    answer: पार्क में
    difficulty: 1
    hints:
    - खेलने की जगह।
    - पेड़ भी।
    solution: झूला पार्क में होता है।
    mistakes: {"रसोई में": "h1_jagah", "बस के अंदर": "h1_jagah"}
