# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 5. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 5
title: मिठाई
concepts:
- code: cbse1h.05.mithai
  title: मिठाई
  notes: |
    मिठाई पर कविता/पाठ: लड्डू, जलेबी, बर्फ़ी; त्योहारों पर मिठाई बाँटना; ज़्यादा मीठा न खाना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'मिठाई सबको अच्छी लगती है: लड्डू, जलेबी, बर्फ़ी। त्योहारों पर हम मिठाई बाँटते हैं। पर बहुत ज़्यादा मीठा खाने से दाँत खराब होते हैं।'
    visual: 'चित्र बनाओ: एक थाली में गोल लड्डू, जलेबी और बर्फ़ी।'
    step_by_step: 1. पाठ पढ़ो। 2. मिठाइयों के नाम बताओ। 3. मिठाई कब बाँटते हैं? 4. ज़्यादा मीठा क्यों न खाएँ?
    real_world: दिवाली और ईद पर लोग एक-दूसरे को मिठाई देते हैं।
  picture:
    kind: compare
    columns:
    - title: मिठाई
      points:
      - लड्डू
      - जलेबी
      - बर्फ़ी
    - title: आकार
      points:
      - गोल
      - गोल-गोल घेरे
      - चौकोर
    alt: लड्डू गोल, जलेबी गोल-गोल घेरों वाली और बर्फ़ी चौकोर होती है।
  items:
  - prompt: लड्डू कैसा होता है?
    options:
    - गोल
    - चौकोर
    - लंबा
    answer: गोल
    difficulty: 1
    hints:
    - गेंद जैसा।
    - घूमता है।
    solution: लड्डू गोल होता है।
  - prompt: मिठाई का स्वाद कैसा होता है?
    options:
    - मीठा
    - खट्टा
    - कड़वा
    answer: मीठा
    difficulty: 1
    hints:
    - नाम में ही है।
    - चीनी।
    solution: मिठाई मीठी होती है।
  - prompt: बहुत ज़्यादा मीठा खाने से क्या होता है?
    options:
    - दाँत खराब होते हैं
    - दाँत चमकते हैं
    - बाल बढ़ते हैं
    answer: दाँत खराब होते हैं
    difficulty: 2
    hints:
    - कीड़े लगते हैं।
    - ब्रश करो।
    solution: दाँत खराब होते हैं।
  - prompt: 'त्योहार पर हम मिठाई:'
    options:
    - बाँटते हैं
    - छिपाते हैं
    - फेंकते हैं
    answer: बाँटते हैं
    difficulty: 1
    hints:
    - सबके साथ।
    - खुशी।
    solution: हम मिठाई बाँटते हैं।
  - prompt: इनमें मिठाई कौन-सी है?
    options:
    - जलेबी
    - आलू
    - नमक
    answer: जलेबी
    difficulty: 1
    hints:
    - गोल-गोल, रस भरी।
    - ज से शुरू।
    solution: जलेबी मिठाई है।
    mistakes:
      आलू: hin1_word
  - prompt: '''मीठा'' का उलटा क्या है?'
    options:
    - कड़वा
    - ठंडा
    - गोल
    answer: कड़वा
    difficulty: 2
    hints:
    - करेला जैसा।
    - मीठा नहीं।
    solution: मीठा का उलटा कड़वा है।
