# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 5. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 5
title: मिठाई
tips:
  h1_baant: "सोचो, कोई चीज़ दूसरों के साथ बाँटने से उनका चेहरा कैसा हो जाता है।"
  h1_laddu: "लड्डू को हथेली में रखकर कल्पना करो: उसे बनाने के लिए हाथों को कैसे घुमाते हैं?"
  h1_meetha_daant: "सोचो, डॉक्टर मीठा कम खाने को क्यों कहते हैं और कौन-सा हिस्सा सबसे पहले शिकायत करता है।"
  h1_swad: "खट्टा नींबू होता है, कड़वा करेला। मिठाई का नाम ही उसका स्वाद बताता है।"
  c1h5_baant: एक-एक करके बाँटो, बार-बार, जब तक सब खत्म न हो।
  c1h5_mithai: उस मिठाई को मन में देखो। उसका आकार और स्वाद कैसा है?
  c1h5_dant: सोचो, कौन-सी आदत दाँतों को मज़बूत और साफ़ रखेगी?
  c1h5_ulta: उलटा शब्द बिलकुल दूसरी तरफ़ का होता है, जैसे ऊपर-नीचे।

concepts:
- code: cbse1h.05.mithai
  title: मिठाई
  notes: |
    मिठाई पर कविता/पाठ: लड्डू, जलेबी, बर्फ़ी; त्योहारों पर मिठाई बाँटना; ज़्यादा मीठा न खाना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'मिठाई सबको अच्छी लगती है: लड्डू, जलेबी, बर्फ़ी। त्योहारों पर हम मिठाई बाँटते हैं। पर बहुत ज़्यादा मीठा खाने से दाँत खराब होते हैं।'
    visual: 'चित्र बनाओ: एक थाली में गोल लड्डू, जलेबी और बर्फ़ी।'
    step_by_step: 1. पाठ पढ़ो। 2. मिठाइयों के नाम बताओ। 3. मिठाई कब बाँटते हैं? 4. ज़्यादा मीठा क्यों न खाएँ?
    real_world: दिवाली और ईद पर लोग एक-दूसरे को मिठाई देते हैं।
  picture:
    kind: compare
    columns:
    - title: मिठाई
      points:
      - लड्डू
      - जलेबी
      - बर्फ़ी
    - title: आकार
      points:
      - गोल
      - गोल-गोल घेरे
      - चौकोर
    alt: लड्डू गोल, जलेबी गोल-गोल घेरों वाली और बर्फ़ी चौकोर होती है।
  activity:
    type: sort
    prompt: कौन-सी मिठाई है और कौन-सा फल?
    bins:
    - मिठाई
    - फल
    items:
    - label: 🟠 लड्डू
      bin: मिठाई
      clue: हलवाई बनाता है?
      why: लड्डू मिठाई है।
    - label: 🌀 जलेबी
      bin: मिठाई
      clue: गोल-गोल, चाशनी वाली?
      why: जलेबी मिठाई है।
    - label: ⬜ बर्फ़ी
      bin: मिठाई
      clue: चौकोर टुकड़े?
      why: बर्फ़ी मिठाई है।
    - label: 🍌 केला
      bin: फल
      clue: पेड़ पर उगता है?
      why: केला फल है।
    - label: 🍎 सेब
      bin: फल
      clue: पेड़ से तोड़ते हैं?
      why: सेब फल है।
  lesson:
    - teach: 'मिठाइयाँ कई तरह की होती हैं: लड्डू गोल होता है, जलेबी गोल-गोल घुमावदार, बर्फ़ी चौकोर, रसगुल्ला रस में डूबा। सबका स्वाद मीठा होता है।'
      picture:
        kind: compare
        columns:
        - title: मिठाई
          points:
          - लड्डू
          - जलेबी
          - बर्फ़ी
        - title: आकार
          points:
          - गोल
          - घुमावदार
          - चौकोर
        alt: मिठाइयाँ और उनके आकार।
      check:
        prompt: बर्फ़ी का आकार प्रायः कैसा होता है?
        options:
        - चौकोर
        - गोल
        - लंबा डंडा
        answer: चौकोर
        why: बर्फ़ी चौकोर टुकड़ों में कटती है।
    - teach: 'त्योहारों पर हम मिठाई बाँटते हैं: दिवाली, ईद, क्रिसमस, राखी। बाँटने से खुशी बढ़ती है।'
      check:
        prompt: त्योहार पर पड़ोसियों के साथ मिठाई क्या करते हैं?
        options:
        - बाँटते हैं
        - छिपाते हैं
        - फेंकते हैं
        answer: बाँटते हैं
        why: बाँटना खुशी बढ़ाता है।
    - teach: 'बहुत ज़्यादा मीठा खाने से दाँत खराब होते हैं। मिठाई थोड़ी खाओ और बाद में कुल्ला करो। स्वाद: मीठा, खट्टा, नमकीन, कड़वा।'
      check:
        prompt: मिठाई खाने के बाद क्या करें?
        options:
        - पानी से कुल्ला
        - तुरंत और मिठाई
        - सो जाना
        answer: पानी से कुल्ला
        why: कुल्ला करने से दाँतों पर मीठा नहीं रहता।
  items:
  - prompt: लड्डू कैसा होता है?
    options:
    - गोल
    - चौकोर
    - लंबा
    answer: गोल
    difficulty: 1
    hints:
    - गेंद जैसा।
    - घूमता है।
    solution: लड्डू गोल होता है।
    mistakes: {"चौकोर": "h1_laddu", "लंबा": "h1_laddu"}
  - prompt: मिठाई का स्वाद कैसा होता है?
    options:
    - मीठा
    - खट्टा
    - कड़वा
    answer: मीठा
    difficulty: 1
    hints:
    - नाम में ही है।
    - चीनी।
    solution: मिठाई मीठी होती है।
    mistakes: {"खट्टा": "h1_swad", "कड़वा": "h1_swad"}
  - prompt: बहुत ज़्यादा मीठा खाने से क्या होता है?
    options:
    - दाँत खराब होते हैं
    - दाँत चमकते हैं
    - बाल बढ़ते हैं
    answer: दाँत खराब होते हैं
    difficulty: 2
    hints:
    - कीड़े लगते हैं।
    - ब्रश करो।
    solution: दाँत खराब होते हैं।
    mistakes: {"दाँत चमकते हैं": "h1_meetha_daant", "बाल बढ़ते हैं": "h1_meetha_daant"}
  - prompt: 'त्योहार पर हम मिठाई:'
    options:
    - बाँटते हैं
    - छिपाते हैं
    - फेंकते हैं
    answer: बाँटते हैं
    difficulty: 1
    hints:
    - सबके साथ।
    - खुशी।
    solution: हम मिठाई बाँटते हैं।
    mistakes: {"छिपाते हैं": "h1_baant", "फेंकते हैं": "h1_baant"}
  - prompt: इनमें मिठाई कौन-सी है?
    options:
    - जलेबी
    - आलू
    - नमक
    answer: जलेबी
    difficulty: 1
    hints:
    - गोल-गोल, रस भरी।
    - ज से शुरू।
    solution: जलेबी मिठाई है।
    mistakes:
      आलू: hin1_word
  - prompt: '''मीठा'' का उलटा क्या है?'
    options:
    - कड़वा
    - ठंडा
    - गोल
    answer: कड़वा
    difficulty: 2
    hints:
    - करेला जैसा।
    - मीठा नहीं।
    solution: मीठा का उलटा कड़वा है।
    mistakes: {"ठंडा": "h1_ulta", "गोल": "h1_ulta"}
  - prompt: रसगुल्ला किसमें डूबा होता है?
    options:
    - मीठे रस में
    - दूध के गिलास में
    - पानी की बाल्टी में
    answer: मीठे रस में
    difficulty: 1
    hints:
    - नाम में 'रस' है।
    - चाशनी।
    solution: 'चरण 1: रस + गुल्ला। चरण 2: रसगुल्ला मीठे रस में डूबा होता है।'
    mistakes:
      दूध के गिलास में: c1h5_mithai
      पानी की बाल्टी में: c1h5_mithai
  - prompt: नमक का स्वाद कैसा होता है?
    options:
    - नमकीन
    - मीठा
    - कड़वा
    answer: नमकीन
    difficulty: 1
    hints:
    - शब्द नमक से बना है।
    - चिप्स जैसा।
    solution: 'चरण 1: नमक + ईन। चरण 2: नमकीन।'
    mistakes:
      मीठा: c1h5_mithai
      कड़वा: c1h5_mithai
  - prompt: नींबू का स्वाद कैसा होता है?
    options:
    - खट्टा
    - मीठा
    - नमकीन
    answer: खट्टा
    difficulty: 1
    hints:
    - मुँह सिकुड़ जाता है।
    - इमली जैसा।
    solution: 'चरण 1: नींबू चखो। चरण 2: खट्टा।'
    mistakes:
      मीठा: c1h5_mithai
      नमकीन: c1h5_mithai
  - prompt: दाँतों को साफ़ रखने के लिए रात को क्या करें?
    options:
    - ब्रश करके सोएँ
    - मिठाई खाकर सोएँ
    - कुछ न करें
    answer: ब्रश करके सोएँ
    difficulty: 1
    hints:
    - रात भर दाँतों पर कुछ न रहे।
    - सुबह भी यही करते हैं।
    solution: 'चरण 1: रात को दाँत साफ़ करने चाहिए। चरण 2: ब्रश करके सोओ।'
    mistakes:
      मिठाई खाकर सोएँ: c1h5_dant
      कुछ न करें: c1h5_dant
  - prompt: चार लड्डू दो बच्चों में बराबर बाँटें। हर बच्चे को कितने?
    options:
    - दो
    - चार
    - एक
    answer: दो
    difficulty: 2
    hints:
    - एक-एक करके बाँटो।
    - पहले चक्कर में एक-एक, फिर?
    solution: 'चरण 1: एक-एक दो बार। चरण 2: हर बच्चे को 2 लड्डू।'
    mistakes:
      चार: c1h5_baant
      एक: c1h5_baant
  - prompt: करेले का स्वाद कैसा होता है?
    options:
    - कड़वा
    - मीठा
    - खट्टा
    answer: कड़वा
    difficulty: 2
    hints:
    - यह हरी सब्ज़ी है जो बहुत बच्चों को पसंद नहीं।
    - नीम की पत्तियों जैसा।
    solution: 'चरण 1: करेला चखो। चरण 2: कड़वा।'
    mistakes:
      मीठा: c1h5_ulta
      खट्टा: c1h5_ulta
  - prompt: '''मीठा'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - म
    - ठ
    - न
    answer: म
    difficulty: 1
    hints:
    - 'धीरे से बोलो: मी...'
    - माँ भी इसी से।
    solution: 'चरण 1: मी-ठा। चरण 2: पहला अक्षर म।'
    mistakes:
      ठ: c1h5_mithai
      न: c1h5_mithai
  - prompt: मिठाई की दुकान पर हलवाई क्या करता है?
    options:
    - मिठाई बनाता है
    - कपड़े सिलता है
    - बाल काटता है
    answer: मिठाई बनाता है
    difficulty: 2
    hints:
    - दुकान में कड़ाही और चाशनी।
    - लड्डू-जलेबी कौन बनाता है?
    solution: 'चरण 1: हलवाई की दुकान मिठाई की है। चरण 2: हलवाई मिठाई बनाता है।'
    mistakes:
      कपड़े सिलता है: c1h5_mithai
      बाल काटता है: c1h5_mithai
  - prompt: एक डिब्बे में 3 लड्डू और 2 बर्फ़ी हैं। कुल कितनी मिठाइयाँ?
    options:
    - पाँच
    - तीन
    - दो
    answer: पाँच
    difficulty: 3
    hints:
    - सबको एक साथ गिनो।
    - 3 और 2।
    solution: 'चरण 1: 3 + 2। चरण 2: पाँच मिठाइयाँ।'
    mistakes:
      तीन: c1h5_mithai
      दो: c1h5_mithai
