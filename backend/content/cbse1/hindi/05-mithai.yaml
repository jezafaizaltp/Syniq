      दो: c1h5_mithai
  - prompt: 'स्थिति (केस): सलमा को ईद पर सेवइयों का बड़ा कटोरा मिला। पड़ोस के दोस्त भी मिलने आए हैं। सलमा क्या करे?'
    options:
