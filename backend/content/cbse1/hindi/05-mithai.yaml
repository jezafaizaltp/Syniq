    - किससे सबकी खुशी बढ़ेगी?
    solution: त्योहार पर मिठाई बाँटने से खुशी बढ़ती है, इसलिए सलमा दोस्त के साथ बाँटकर खाए।
    mistakes:
      सारी सेवइयाँ अकेले खा ले: c1h5_baant
      कटोरा छिपा दे: c1h5_baant
