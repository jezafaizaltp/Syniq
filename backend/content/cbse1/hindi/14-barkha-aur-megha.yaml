subject: cbse1-hin
chapter: 14
title: बरखा और मेघा
tips:
  h1_baarish_bachav: "आसमान से गिरती बूँदों से सिर बचाने के लिए हम ऊपर क्या खोलते हैं?"
  h1_baarish_kahan: "बारिश से पहले आसमान में क्या घिर आता है और गरजता है?"
  h1_baarish_ped: "पौधे को पानी न मिले तो वह सूखता है। खूब पानी मिले तो?"
  c1h14_baadal: 'आसमान को मन में देखो: बारिश से पहले ऊपर क्या जमा होता है?'
  c1h14_bachav: सोचो, भीगने या फिसलने से कैसे बचें?
  c1h14_tuk: दोनों शब्दों के आखिर की आवाज़ धीरे-धीरे बोलकर सुनो।

concepts:
- code: cbse1h.14.barkha
  title: बरखा और मेघा
  notes: |
    'बरखा और मेघा' पाठ/कविता: बरखा (बारिश) और मेघा (बादल); बादल से बारिश, बारिश का मज़ा। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: बरखा का मतलब बारिश और मेघा का मतलब बादल है। काले मेघ आते हैं तो बरखा होती है। पेड़-पौधे हरे हो जाते हैं और सब खुश होते हैं।
    visual: 'चित्र बनाओ: काले बादल, गिरती बूँदें और नीचे हरे पेड़।'
    step_by_step: 1. पाठ पढ़ो। 2. बरखा और मेघा का मतलब बताओ। 3. बारिश कब होती है? 4. बारिश से क्या होता है?
    real_world: बारिश के बाद पेड़-पौधे धुलकर चमकने लगते हैं।
  picture:
    kind: flow
    steps:
    - मेघ (बादल) आए
    - बरखा (बारिश) हुई
    - पौधे हरे हुए
    alt: मेघ यानी बादल आए, बरखा यानी बारिश हुई और पौधे हरे हो गए।
  activity:
    type: order
    prompt: बरखा कैसे आती है? क्रम से लगाओ।
    steps:
    - ☁️ मेघा (बादल) छाते हैं
    - ⚡ बादल गरजते हैं
    - 🌧️ बरखा होती है
    - 💦 बच्चे पानी में खेलते हैं
    reasons:
      ⚡ बादल गरजते हैं: गरजने के लिए पहले बादल चाहिए।
      🌧️ बरखा होती है: बादल से ही बारिश।
      💦 बच्चे पानी में खेलते हैं: बारिश के बाद पानी भरता है।
  lesson:
    - teach: '''बरखा'' का मतलब बारिश और ''मेघा'' का मतलब बादल। काले घने बादल पानी से भरे होते हैं। जब बादल भारी हो जाते हैं, तब बरखा होती है।'
      picture:
        kind: flow
        steps:
        - सूरज पानी गरम करता है
        - भाप ऊपर जाती है
        - मेघा बनते हैं
        - बरखा होती है
        alt: बादल बनने और बारिश होने के चार कदम।
      check:
        prompt: बारिश वाले बादल कैसे दिखते हैं?
        options:
        - काले और घने
        - पीले और छोटे
        - चमकीले हरे
        answer: काले और घने
        why: पानी से भरे बादल भारी और गहरे रंग के लगते हैं।
      ways:
      - style: visual
        teach: पानी कैसे बादल बनकर फिर बारिश बनता है, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - धूप से पानी गरम
          - भाप ऊपर उठती है
          - भाप से बादल बनते हैं
          - भारी बादल से बूँदें गिरती हैं
          alt: धूप से नदी और तालाब का पानी गरम होता है, भाप ऊपर उठती है, भाप से बादल बनते हैं, और भारी बादलों से बूँदें गिरती हैं।
      - style: real_world
        teach: जब आसमान में काले बादल छा जाते हैं, तो कई लोग कहते हैं, 'लगता है आज पानी बरसेगा', और कपड़े अंदर ले आते हैं।
    - teach: बारिश में पेड़-पौधे हरे-भरे हो जाते हैं। मोर नाचता है, मेंढक टर्र-टर्र करते हैं। किसान खुश होते हैं क्योंकि खेतों को पानी मिलता है।
      check:
        prompt: बारिश में कौन-सा जीव 'टर्र-टर्र' करता है?
        options:
        - मेंढक
        - गाय
        - चिड़िया
        answer: मेंढक
        why: मेंढक बरसात में पानी के पास टर्राते हैं।
      ways:
      - style: visual
        teach: बारिश आने पर कौन क्या करता है, साथ-साथ देखो।
        picture:
          kind: compare
          columns:
          - title: कौन
            points:
            - किसान
            - बच्चे
            - पेड़-पौधे
          - title: क्या करते हैं
            points:
            - खेत में बीज बोते हैं
            - कागज़ की नाव चलाते हैं
            - नए पत्ते निकालते हैं
          alt: बारिश में किसान खेत में बीज बोते हैं, बच्चे कागज़ की नाव चलाते हैं, और पेड़-पौधों पर नए पत्ते निकलते हैं।
      - style: real_world
        teach: केरल में जून में मानसून आता है। तब बहुत तेज़ बारिश होती है और सब ओर हरियाली छा जाती है।
    - teach: बारिश में छाता या रेनकोट लेकर निकलो। फिसलन वाली जगह पर धीरे चलो। बिजली कड़के तो पेड़ के नीचे मत खड़े हो, घर के अंदर रहो।
      check:
        prompt: बिजली कड़क रही हो तो कहाँ रहना ठीक है?
        options:
        - घर के अंदर
        - ऊँचे पेड़ के नीचे
        - खुले मैदान में
        answer: घर के अंदर
        why: बिजली ऊँची चीज़ों और खुली जगह पर गिर सकती है।
      ways:
      - style: step_by_step
        teach: 'बारिश में सुरक्षित रहो। पहला: बाहर जाने से पहले छाता या रेनकोट लो। दूसरा: पानी भरे गड्ढों से दूर चलो। तीसरा: बिजली कड़के तो किसी घर के अंदर जाओ। चौथा: घर आकर गीले कपड़े बदलो।'
      - style: visual
        teach: बारिश में सुरक्षित काम और खतरे वाले काम, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: सुरक्षित
            points:
            - गड्ढों से दूर चलना
            - गमबूट पहनना
            - घर आकर कपड़े बदलना
          - title: खतरा
            points:
            - पानी भरे गड्ढे में कूदना
            - टूटे तार के पास जाना
            - गीले कपड़ों में बैठे रहना
          alt: बारिश में गड्ढों से दूर चलना, गमबूट पहनना और घर आकर कपड़े बदलना सुरक्षित है। पानी भरे गड्ढे में कूदना, टूटे तार के पास जाना और गीले कपड़ों में बैठे रहना खतरा है।
  items:
  - prompt: '''बरखा'' का अर्थ है:'
    options:
    - बारिश
    - धूप
    - हवा
    answer: बारिश
    difficulty: 1
    hints:
    - पानी बरसता है।
    - बूँदें।
    solution: बरखा यानी बारिश।
    mistakes:
      धूप: hin1_word
  - prompt: '''मेघा'' का अर्थ है:'
    options:
    - बादल
    - पेड़
    - चाँद
    answer: बादल
    difficulty: 1
    hints:
    - आसमान में।
    - बारिश लाता है।
    solution: मेघा यानी बादल।
    mistakes:
      पेड़: hin1_word
  - prompt: बारिश से पेड़-पौधे कैसे हो जाते हैं?
    options:
    - हरे-भरे
    - सूखे
    - काले
    answer: हरे-भरे
    difficulty: 1
    hints:
    - पानी मिलता है।
    - ताज़े।
    solution: बारिश से पेड़-पौधे हरे-भरे हो जाते हैं।
    mistakes: {"सूखे": "h1_baarish_ped", "काले": "h1_baarish_ped"}
  - prompt: बारिश किससे होती है?
    options:
    - बादलों से
    - सूरज से
    - पेड़ों से
    answer: बादलों से
    difficulty: 2
    hints:
    - ऊपर आसमान में।
    - मेघ।
    solution: बारिश बादलों से होती है।
    mistakes: {"सूरज से": "h1_baarish_kahan", "पेड़ों से": "h1_baarish_kahan"}
  - prompt: बारिश में हम क्या लेकर बाहर जाते हैं?
    options:
    - छाता
    - पंखा
    - स्वेटर ही
    answer: छाता
    difficulty: 1
    hints:
    - भीगने से बचाता है।
    - छ से।
    solution: हम छाता लेकर जाते हैं।
    mistakes: {"पंखा": "h1_baarish_bachav", "स्वेटर ही": "h1_baarish_bachav"}
  - prompt: '''बरखा'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - चरखा
    - बादल
    - पानी
    answer: चरखा
    difficulty: 2
    hints:
    - आखिरी आवाज़ -रखा।
    - बोलकर देखो।
    solution: बरखा और चरखा की तुक मिलती है।
    mistakes:
      पानी: hin1_sound
  - prompt: '''मेघा'' किसका दूसरा नाम है?'
    options:
    - बादल
    - सूरज
    - हवा
    answer: बादल
    difficulty: 1
    hints:
    - यह आसमान में तैरता है।
    - बारिश इसी से होती है।
    solution: 'चरण 1: मेघा आसमान में। चरण 2: बादल।'
    mistakes:
      सूरज: c1h14_baadal
      हवा: c1h14_baadal
  - prompt: बारिश में खुश होकर कौन-सा पक्षी पंख फैलाकर नाचता है?
    options:
    - मोर
    - कौआ
    - तोता
    answer: मोर
    difficulty: 2
    hints:
    - हमारा राष्ट्रीय पक्षी।
    - रंग-बिरंगे लंबे पंख।
    solution: 'चरण 1: पंख फैलाकर नाचने वाला। चरण 2: मोर।'
    mistakes:
      कौआ: c1h14_baadal
      तोता: c1h14_baadal
  - prompt: भीगने से बचने के लिए बारिश में क्या पहनते हैं?
    options:
    - रेनकोट
    - स्वेटर
    - टोपी वाला चश्मा
    answer: रेनकोट
    difficulty: 1
    hints:
    - पानी इसके पार नहीं जाता।
    - '''रेन'' मतलब बारिश।'
    solution: 'चरण 1: पानी रोकने वाला कपड़ा। चरण 2: रेनकोट।'
    mistakes:
      स्वेटर: c1h14_bachav
      टोपी वाला चश्मा: c1h14_bachav
  - prompt: बारिश से किसान क्यों खुश होते हैं?
    options:
    - खेतों को पानी मिलता है
    - स्कूल बंद होते हैं
    - बिजली चली जाती है
    answer: खेतों को पानी मिलता है
    difficulty: 2
    hints:
    - फसल को क्या चाहिए?
    - पौधे पानी पीते हैं।
    solution: 'चरण 1: फसल को पानी चाहिए। चरण 2: बारिश से खेत भरते हैं।'
    mistakes:
      स्कूल बंद होते हैं: c1h14_baadal
      बिजली चली जाती है: c1h14_baadal
  - prompt: '''मेघा'' से तुक मिलाने वाला शब्द कौन-सा?'
    options:
    - रेखा
    - मेज़
    - माला
    answer: रेखा
    difficulty: 3
    hints:
    - आखिर की आवाज़ '...एखा/एघा' जैसी।
    - किसी लाइन को भी यह कहते हैं।
    solution: 'चरण 1: मे-घा, रे-खा, आवाज़ मिलती है। चरण 2: रेखा।'
    mistakes:
      मेज़: c1h14_tuk
      माला: c1h14_tuk
  - prompt: गीले फ़र्श पर कैसे चलना चाहिए?
    options:
    - धीरे-धीरे
    - दौड़कर
    - कूदकर
    answer: धीरे-धीरे
    difficulty: 2
    hints:
    - फ़र्श फिसलन वाला है।
    - गिरने से बचना है।
    solution: 'चरण 1: गीला फ़र्श फिसलता है। चरण 2: धीरे चलो।'
    mistakes:
      दौड़कर: c1h14_bachav
      कूदकर: c1h14_bachav
  - prompt: बारिश के बाद आसमान में सात रंगों की पट्टी क्या कहलाती है?
    options:
    - इंद्रधनुष
    - बादल
    - तारा
    answer: इंद्रधनुष
    difficulty: 3
    hints:
    - धूप और बारिश साथ हों तब दिखता है।
    - धनुष जैसा मुड़ा।
    solution: 'चरण 1: सात रंग, धनुष का आकार। चरण 2: इंद्रधनुष।'
    mistakes:
      बादल: c1h14_baadal
      तारा: c1h14_baadal
  - prompt: बारिश में भीगकर घर आए। पहले क्या करें?
    options:
    - सूखे कपड़े पहनें
    - गीले कपड़ों में सो जाएँ
    - पंखे के नीचे गीले बैठें
    answer: सूखे कपड़े पहनें
    difficulty: 2
    hints:
    - गीले कपड़ों से सर्दी लग सकती है।
    - शरीर को गरम और सूखा रखो।
    solution: 'चरण 1: गीले कपड़े बदलो। चरण 2: सूखे कपड़े पहनो।'
    mistakes:
      गीले कपड़ों में सो जाएँ: c1h14_bachav
      पंखे के नीचे गीले बैठें: c1h14_bachav
  - prompt: '''बादल'' का बहुवचन क्या है?'
    options:
    - बादल
    - बादलें
    - बादला
    answer: बादल
    difficulty: 3
    hints:
    - '''एक बादल'', ''कई ___''।'
    - कुछ शब्द बहुवचन में नहीं बदलते।
    solution: 'चरण 1: एक बादल, कई बादल। चरण 2: शब्द वही रहता है।'
    mistakes:
      बादलें: c1h14_tuk
      बादला: c1h14_tuk
  - prompt: 'स्थिति (केस): अमन और दोस्त मैदान में खेल रहे हैं। अचानक बिजली कड़कने लगी। एक दोस्त का कहना है, ''चलो, बड़े पेड़ के नीचे खड़े हो जाएँ।'' सबसे अच्छा क्या है?'
    options:
    - स्कूल या घर के अंदर चले जाएँ
    - बड़े पेड़ के नीचे खड़े हो जाएँ
    - मैदान में खेलते रहें
    answer: स्कूल या घर के अंदर चले जाएँ
    hints:
    - बिजली कड़के तो पेड़ के नीचे खड़ा होना ठीक है क्या?
    - सबसे सुरक्षित जगह कौन-सी है?
