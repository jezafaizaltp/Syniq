subject: cbse1-hin
chapter: 14
title: बरखा और मेघा
concepts:
- code: cbse1h.14.barkha
  title: बरखा और मेघा
  notes: |
    'बरखा और मेघा' पाठ/कविता: बरखा (बारिश) और मेघा (बादल); बादल से बारिश, बारिश का मज़ा। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: बरखा का मतलब बारिश और मेघा का मतलब बादल है। काले मेघ आते हैं तो बरखा होती है। पेड़-पौधे हरे हो जाते हैं और सब खुश होते हैं।
    visual: 'चित्र बनाओ: काले बादल, गिरती बूँदें और नीचे हरे पेड़।'
    step_by_step: 1. पाठ पढ़ो। 2. बरखा और मेघा का मतलब बताओ। 3. बारिश कब होती है? 4. बारिश से क्या होता है?
    real_world: बारिश के बाद पेड़-पौधे धुलकर चमकने लगते हैं।
  picture:
    kind: flow
    steps:
    - मेघ (बादल) आए
    - बरखा (बारिश) हुई
    - पौधे हरे हुए
    alt: मेघ यानी बादल आए, बरखा यानी बारिश हुई और पौधे हरे हो गए।
  items:
  - prompt: '''बरखा'' का अर्थ है:'
    options:
    - बारिश
    - धूप
    - हवा
    answer: बारिश
    difficulty: 1
    hints:
    - पानी बरसता है।
    - बूँदें।
    solution: बरखा यानी बारिश।
    mistakes:
      धूप: hin1_word
  - prompt: '''मेघा'' का अर्थ है:'
    options:
    - बादल
    - पेड़
    - चाँद
    answer: बादल
    difficulty: 1
    hints:
    - आसमान में।
    - बारिश लाता है।
    solution: मेघा यानी बादल।
    mistakes:
      पेड़: hin1_word
  - prompt: बारिश से पेड़-पौधे कैसे हो जाते हैं?
    options:
    - हरे-भरे
    - सूखे
    - काले
    answer: हरे-भरे
    difficulty: 1
    hints:
    - पानी मिलता है।
    - ताज़े।
    solution: बारिश से पेड़-पौधे हरे-भरे हो जाते हैं।
  - prompt: बारिश किससे होती है?
    options:
    - बादलों से
    - सूरज से
    - पेड़ों से
    answer: बादलों से
    difficulty: 2
    hints:
    - ऊपर आसमान में।
    - मेघ।
    solution: बारिश बादलों से होती है।
  - prompt: बारिश में हम क्या लेकर बाहर जाते हैं?
    options:
    - छाता
    - पंखा
    - स्वेटर ही
    answer: छाता
    difficulty: 1
    hints:
    - भीगने से बचाता है।
    - छ से।
    solution: हम छाता लेकर जाते हैं।
  - prompt: '''बरखा'' से तुक मिलाने वाला शब्द कौन-सा है?'
    options:
    - परखा
    - बादल
    - पानी
    answer: परखा
    difficulty: 2
    hints:
    - आखिरी आवाज़ -रखा।
    - बोलकर देखो।
    solution: बरखा और परखा की तुक मिलती है।
    mistakes:
      पानी: hin1_sound
