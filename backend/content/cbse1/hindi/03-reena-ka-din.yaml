subject: cbse1-hin
chapter: 3
title: रीना का दिन
tips:
  h1_din_kram: "दिन की शुरुआत से सोचो: तुम उठते कब हो, और सोते कब हो?"
  h1_shaam: "स्कूल और नाश्ता सुबह होते हैं। शाम को धूप ढलने पर बच्चे बाहर क्या करते हैं?"
  h1_subah: "अपनी सुबह याद करो: आँख खुलते ही बाथरूम में सबसे पहले क्या करते हो?"
  h1_ulta: "उलटा शब्द वह है जिसका अर्थ बिल्कुल विपरीत हो। दोनों को साथ रखकर बोलो: क्या वे आमने-सामने हैं?"

concepts:
- code: cbse1h.03.reena
  title: रीना का दिन
  notes: |
    रीना के दिन भर के कामों पर पाठ: सुबह उठना, नहाना, स्कूल जाना, खेलना, सोना; दिनचर्या और समय। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ रीना के दिन के बारे में है। रीना सुबह उठती है, दाँत साफ़ करती है, नहाती है, स्कूल जाती है, शाम को खेलती है और रात को सोती है।
    visual: 'चित्र बनाओ: चार खाने: रीना उठती है, स्कूल जाती है, खेलती है, सोती है।'
    step_by_step: 1. पाठ पढ़ो। 2. रीना सुबह क्या करती है? 3. शाम को क्या करती है? 4. तुम्हारा दिन कैसा होता है?
    real_world: रोज़ समय पर सोने और उठने से हम स्वस्थ रहते हैं।
  picture:
    kind: flow
    steps:
    - सुबह उठना
    - स्कूल जाना
    - शाम को खेलना
    - रात को सोना
    alt: रीना सुबह उठती है, स्कूल जाती है, शाम को खेलती है और रात को सोती है।
  items:
  - prompt: रीना सुबह उठकर पहले क्या करती है?
    options:
    - दाँत साफ़
    - सो जाती है
    - रात का खाना
    answer: दाँत साफ़
    difficulty: 1
    hints:
    - ब्रश।
    - सुबह का काम।
    solution: वह दाँत साफ़ करती है।
    mistakes: {"सो जाती है": "h1_subah", "रात का खाना": "h1_subah"}
  - prompt: रीना रात को क्या करती है?
    options:
    - सोती है
    - स्कूल जाती है
    - नहाती है
    answer: सोती है
    difficulty: 1
    hints:
    - अँधेरा।
    - बिस्तर।
    solution: रीना रात को सोती है।
    mistakes:
      स्कूल जाती है: hin1_read_again
  - prompt: हम शाम को क्या करते हैं?
    options:
    - खेलते हैं
    - स्कूल जाते हैं
    - नाश्ता करते हैं
    answer: खेलते हैं
    difficulty: 1
    hints:
    - बाहर, दोस्तों के साथ।
    - मज़ा।
    solution: शाम को हम खेलते हैं।
    mistakes: {"स्कूल जाते हैं": "h1_shaam", "नाश्ता करते हैं": "h1_shaam"}
  - prompt: '''दिन'' का उलटा क्या है?'
    options:
    - रात
    - सुबह
    - धूप
    answer: रात
    difficulty: 2
    hints:
    - अँधेरा।
    - चाँद वाला समय।
    solution: दिन का उलटा रात है।
    mistakes: {"सुबह": "h1_ulta", "धूप": "h1_ulta"}
  - prompt: पहले क्या होता है?
    options:
    - सुबह
    - शाम
    - रात
    answer: सुबह
    difficulty: 2
    hints:
    - सूरज उगता है।
    - दिन की शुरुआत।
    solution: पहले सुबह होती है।
    mistakes: {"शाम": "h1_din_kram", "रात": "h1_din_kram"}
  - prompt: '''रीना'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - र
    - न
    - म
    answer: र
    difficulty: 1
    hints:
    - पहली आवाज़।
    - रथ वाला।
    solution: रीना 'र' से शुरू होता है।
    mistakes:
      न: hin1_sound
