# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 3. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 3
title: रीना का दिन
tips:
  h1_din_kram: "दिन की शुरुआत से सोचो: तुम उठते कब हो, और सोते कब हो?"
  h1_shaam: "स्कूल और नाश्ता सुबह होते हैं। शाम को धूप ढलने पर बच्चे बाहर क्या करते हैं?"
  h1_subah: "अपनी सुबह याद करो: आँख खुलते ही बाथरूम में सबसे पहले क्या करते हो?"
  h1_ulta: "उलटा शब्द वह है जिसका अर्थ बिल्कुल विपरीत हो। दोनों को साथ रखकर बोलो: क्या वे आमने-सामने हैं?"
  c1h3_din: 'अपना दिन याद करो: उठने से सोने तक। यह कब होता है?'
  c1h3_ulta: उलटा शब्द बिलकुल दूसरी तरफ़ का होता है, जैसे ऊपर-नीचे।
  c1h3_akshar: शब्द को धीरे से बोलो और पहली आवाज़ सुनो।

concepts:
- code: cbse1h.03.reena
  title: रीना का दिन
  notes: |
    रीना के दिन भर के कामों पर पाठ: सुबह उठना, नहाना, स्कूल जाना, खेलना, सोना; दिनचर्या और समय। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ रीना के दिन के बारे में है। रीना के दिन में सुबह उठना, दाँत साफ़ करना, नहाना, स्कूल जाना, शाम को खेलना और रात को सोना आता है।
    visual: 'चित्र बनाओ: चार खाने: रीना का उठना, स्कूल जाना, खेलना, सोना।'
    step_by_step: 1. पाठ पढ़ो। 2. सुबह रीना के काम क्या हैं? 3. शाम को रीना का काम क्या है? 4. तुम्हारा दिन कैसा होता है?
    real_world: रोज़ समय पर सोने और उठने से हम स्वस्थ रहते हैं।
  picture:
    kind: flow
    steps:
    - सुबह उठना
    - स्कूल जाना
    - शाम को खेलना
    - रात को सोना
    alt: 'रीना का दिन: सुबह उठना, स्कूल जाना, शाम को खेलना और रात को सोना।'
  activity:
    type: order
    prompt: रीना का दिन क्रम से लगाओ।
    steps:
    - ⏰ सुबह उठना
    - 🚿 नहाना
    - 🎒 स्कूल जाना
    - ⚽ खेलना
    - 😴 सोना
    reasons:
      🚿 नहाना: उठकर ही नहाते हैं।
      🎒 स्कूल जाना: नहाकर, तैयार होकर स्कूल।
      ⚽ खेलना: स्कूल के बाद खेल।
      😴 सोना: दिन के अंत में सोते हैं।
  lesson:
    - teach: '''रीना का दिन'' पाठ दिन भर के कामों के बारे में है। सुबह उठते हैं, दाँत साफ़ करते हैं, नहाते हैं, नाश्ता करते हैं और स्कूल जाते हैं।'
      picture:
        kind: flow
        steps:
        - उठना
        - दाँत साफ़
        - नहाना
        - नाश्ता
        - स्कूल
        alt: सुबह के काम क्रम से।
      check:
        prompt: नहाने से पहले क्या करते हैं?
        options:
        - दाँत साफ़
        - रात का खाना
        - सोना
        answer: दाँत साफ़
        why: सुबह उठकर पहले दाँत साफ़ करते हैं।
    - teach: 'दिन के भाग: सुबह, दोपहर, शाम, रात। दोपहर को खाना, शाम को खेल, रात को सोना।'
      picture:
        kind: flow
        steps:
        - सुबह
        - दोपहर
        - शाम
        - रात
        alt: दिन के चार भाग।
      check:
        prompt: शाम के बाद क्या आता है?
        options:
        - रात
        - सुबह
        - दोपहर
        answer: रात
        why: सुबह, दोपहर, शाम, रात।
    - teach: 'उलटे शब्द: दिन-रात, सोना-जागना, सुबह-शाम, आना-जाना।'
      check:
        prompt: '''सोना'' का उलटा क्या है?'
        options:
        - जागना
        - खाना
        - खेलना
        answer: जागना
        why: सोना और जागना उलटे हैं।
  items:
  - prompt: सुबह उठकर रीना का पहला काम क्या है?
    options:
    - दाँत साफ़
    - सो जाना
    - रात का खाना
    answer: दाँत साफ़
    difficulty: 1
    hints:
    - ब्रश।
    - सुबह का काम।
    solution: सुबह उठकर पहला काम दाँत साफ़ करना है।
    mistakes: {"सो जाना": "h1_subah", "रात का खाना": "h1_subah"}
  - prompt: रात को रीना का काम क्या है?
    options:
    - सोना
    - स्कूल जाना
    - नहाना
    answer: सोना
    difficulty: 1
    hints:
    - अँधेरा।
    - बिस्तर।
    solution: रात को रीना का काम सोना है।
    mistakes:
      स्कूल जाना: hin1_read_again
  - prompt: हम शाम को क्या करते हैं?
    options:
    - खेलते हैं
    - स्कूल जाते हैं
    - नाश्ता करते हैं
    answer: खेलते हैं
    difficulty: 1
    hints:
    - बाहर, दोस्तों के साथ।
    - मज़ा।
    solution: शाम को हम खेलते हैं।
    mistakes: {"स्कूल जाते हैं": "h1_shaam", "नाश्ता करते हैं": "h1_shaam"}
  - prompt: '''दिन'' का उलटा क्या है?'
    options:
    - रात
    - सुबह
    - धूप
    answer: रात
    difficulty: 2
    hints:
    - अँधेरा।
    - चाँद वाला समय।
    solution: दिन का उलटा रात है।
    mistakes: {"सुबह": "h1_ulta", "धूप": "h1_ulta"}
  - prompt: पहले क्या होता है?
    options:
    - सुबह
    - शाम
    - रात
    answer: सुबह
    difficulty: 2
    hints:
    - सूरज उगता है।
    - दिन की शुरुआत।
    solution: पहले सुबह होती है।
    mistakes: {"शाम": "h1_din_kram", "रात": "h1_din_kram"}
  - prompt: '''रीना'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - र
    - न
    - म
    answer: र
    difficulty: 1
    hints:
    - पहली आवाज़।
    - रथ वाला।
    solution: रीना 'र' से शुरू होता है।
    mistakes:
      न: hin1_sound
  - prompt: हम दोपहर का खाना कब खाते हैं?
    options:
    - दोपहर में
    - आधी रात को
    - सुबह-सुबह उठते ही
    answer: दोपहर में
    difficulty: 1
    hints:
    - नाम में ही समय है।
    - दिन के बीच में।
    solution: 'चरण 1: दोपहर दिन का बीच है। चरण 2: दोपहर का खाना दोपहर में।'
    mistakes:
      आधी रात को: c1h3_din
      सुबह-सुबह उठते ही: c1h3_din
  - prompt: सूरज कब निकलता है?
    options:
    - सुबह
    - रात
    - शाम
    answer: सुबह
    difficulty: 1
    hints:
    - दिन की शुरुआत।
    - जब हम उठते हैं।
    solution: 'चरण 1: दिन सूरज निकलने से शुरू होता है। चरण 2: सुबह।'
    mistakes:
      रात: c1h3_din
      शाम: c1h3_din
  - prompt: '''सुबह'' का उलटा क्या है?'
    options:
    - शाम
    - दिन
    - धूप
    answer: शाम
    difficulty: 1
    hints:
    - सुबह दिन शुरू होता है।
    - दिन ढलने का समय।
    solution: 'चरण 1: सुबह = शुरुआत। चरण 2: उलटा शाम।'
    mistakes:
      दिन: c1h3_ulta
      धूप: c1h3_ulta
  - prompt: स्कूल जाने से पहले क्या करते हैं?
    options:
    - नाश्ता
    - रात का खाना
    - सोना
    answer: नाश्ता
    difficulty: 1
    hints:
    - सुबह का खाना।
    - भूखे स्कूल नहीं जाते।
    solution: 'चरण 1: सुबह स्कूल से पहले खाना। चरण 2: नाश्ता।'
    mistakes:
      रात का खाना: c1h3_din
      सोना: c1h3_din
  - prompt: '''सूरज'' किस अक्षर से शुरू होता है?'
    options:
    - स
    - र
    - ज
    answer: स
    difficulty: 1
    hints:
    - 'धीरे से बोलो: सू...'
    - साँप भी इसी से।
    solution: 'चरण 1: सू-र-ज। चरण 2: पहला अक्षर स।'
    mistakes:
      र: c1h3_akshar
      ज: c1h3_akshar
  - prompt: चाँद और तारे कब दिखते हैं?
    options:
    - रात में
    - दोपहर में
    - सुबह
    answer: रात में
    difficulty: 2
    hints:
    - आसमान अँधेरा होता है।
    - सोने का समय।
    solution: 'चरण 1: अँधेरे में चाँद-तारे चमकते हैं। चरण 2: रात में।'
    mistakes:
      दोपहर में: c1h3_din
      सुबह: c1h3_din
  - prompt: '''आना'' का उलटा क्या है?'
    options:
    - जाना
    - खाना
    - गाना
    answer: जाना
    difficulty: 2
    hints:
    - स्कूल आते हैं, फिर घर ...
    - दूर होना।
    solution: 'चरण 1: आना = पास आना। चरण 2: उलटा जाना।'
    mistakes:
      खाना: c1h3_ulta
      गाना: c1h3_ulta
  - prompt: 'क्रम ठीक करो: नहाना, उठना, नाश्ता। पहला काम कौन-सा?'
    options:
    - उठना
    - नहाना
    - नाश्ता
    answer: उठना
    difficulty: 2
    hints:
    - सब काम किससे शुरू होते हैं?
    - पहले जागना पड़ता है।
    solution: 'चरण 1: पहले उठते हैं। चरण 2: फिर नहाना, फिर नाश्ता।'
    mistakes:
      नहाना: c1h3_din
      नाश्ता: c1h3_din
  - prompt: रात को जल्दी सोने से क्या होता है?
    options:
    - सुबह ताज़ा उठते हैं
    - सुबह थके रहते हैं
    - भूख नहीं लगती
    answer: सुबह ताज़ा उठते हैं
    difficulty: 3
    hints:
    - शरीर को आराम चाहिए।
    - पूरी नींद।
    solution: 'चरण 1: पूरी नींद से शरीर आराम करता है। चरण 2: सुबह ताज़ा उठते हैं।'
    mistakes:
      सुबह थके रहते हैं: c1h3_din
      भूख नहीं लगती: c1h3_din
