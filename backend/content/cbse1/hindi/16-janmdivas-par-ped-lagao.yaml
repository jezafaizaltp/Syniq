subject: cbse1-hin
chapter: 16
title: जन्मदिवस पर पेड़ लगाओ
tips:
  h1_paudha_kram: "पौधे की जड़ें मिट्टी के अंदर जाती हैं। उसके लिए पहले ज़मीन में जगह कैसे बनाएँगे?"
  h1_paudha_paani: "पौधा अपनी जड़ों से क्या पीता है? माली हर सुबह उसमें क्या डालता है?"
  h1_ped_dete: "गरमी में तुम पेड़ के नीचे क्यों खड़े होते हो? और पेड़ पर क्या लटकता है?"
  h1_ped_hawa: "धुआँ गाड़ियाँ देती हैं। पेड़ों वाले बगीचे की हवा कैसी लगती है?"
  c1h16_ped: 'एक बड़े पेड़ को मन में देखो: लोग, पक्षी और जानवर उससे क्या पाते हैं?'
  c1h16_kram: 'पौधा लगाते हुए मन में देखो: पहले क्या होगा, फिर क्या?'
  c1h16_shabd: शब्द को धीरे बोलो और उसका मतलब सोचो।

concepts:
- code: cbse1h.16.janmdivas
  title: जन्मदिवस पर पेड़ लगाओ
  notes: |
    'जन्मदिवस पर पेड़ लगाओ' पाठ: जन्मदिन पर पेड़ लगाने का अच्छा विचार, पेड़ के फ़ायदे, पौधे को पानी देना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: जन्मदिन पर एक पेड़ लगाना बहुत अच्छा तोहफ़ा है। पेड़ हमें छाया, फल और साफ़ हवा देते हैं। पौधे को रोज़ पानी देना चाहिए।
    visual: 'चित्र बनाओ: जन्मदिन की टोपी पहने बच्चा एक छोटा पौधा लगा रहा है।'
    step_by_step: 1. पाठ पढ़ो। 2. जन्मदिन पर क्या करने को कहा? 3. पेड़ हमें क्या देते हैं? 4. पौधे की देखभाल कैसे करें?
    real_world: कई स्कूलों में बच्चे अपने जन्मदिन पर एक पौधा लगाते हैं।
  picture:
    kind: flow
    steps:
    - गड्ढा खोदो
    - पौधा लगाओ
    - मिट्टी डालो
    - रोज़ पानी दो
    alt: गड्ढा खोदो, पौधा लगाओ, मिट्टी डालो और रोज़ पानी दो।
  activity:
    type: order
    prompt: जन्मदिन पर पेड़ लगाओ! क्रम से लगाओ।
    steps:
    - 🕳️ गड्ढा खोदो
    - 🌱 पौधा लगाओ
    - 💧 पानी दो
    - 🌳 पेड़ बड़ा होता है
    reasons:
      🌱 पौधा लगाओ: पौधा गड्ढे में लगता है।
      💧 पानी दो: लगाने के बाद पानी।
      🌳 पेड़ बड़ा होता है: पानी पाकर पौधा बढ़ता है।
  lesson:
    - teach: 'इस पाठ का अच्छा विचार है: अपने जन्मदिन पर एक पेड़ लगाओ। हर साल तुम बड़े होगे, और तुम्हारा पेड़ भी तुम्हारे साथ बड़ा होगा।'
      check:
        prompt: जन्मदिन पर लगाया पौधा हर साल क्या करेगा?
        options:
        - बड़ा होगा
        - छोटा होगा
        - गायब होगा
        answer: बड़ा होगा
        why: पानी और धूप से पौधा बढ़ता है।
      ways:
      - style: visual
        teach: तुम्हारे साथ तुम्हारा पेड़ भी हर साल कैसे बढ़ता है, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - जन्मदिन पर छोटा पौधा
          - एक साल बाद घुटनों तक
          - तीन साल बाद तुमसे ऊँचा
          - बहुत साल बाद बड़ा पेड़
          alt: जन्मदिन पर छोटा पौधा लगाया, एक साल बाद वह घुटनों तक आया, तीन साल बाद तुमसे ऊँचा हुआ, और बहुत साल बाद बड़ा पेड़ बन गया।
      - style: real_world
        teach: कई स्कूलों में 'वन महोत्सव' मनाते हैं, जिसमें बच्चे मिलकर स्कूल के आँगन में पौधे लगाते हैं।
    - teach: पेड़ हमें छाया, फल, लकड़ी और साफ़ हवा देते हैं। पक्षी पेड़ों पर घोंसले बनाते हैं। पेड़ की जड़ें मिट्टी को बहने से रोकती हैं।
      picture:
        kind: compare
        columns:
        - title: हमें
          points:
          - छाया
          - फल
          - साफ़ हवा
        - title: पक्षियों को
          points:
          - घोंसले की जगह
          - दाने-फल
          - सुरक्षा
        alt: पेड़ हमें और पक्षियों को क्या देते हैं।
      check:
        prompt: गरमी की दोपहर में पेड़ के नीचे क्या मिलता है?
        options:
        - छाया
        - बर्फ़
        - बारिश
        answer: छाया
        why: पत्ते धूप रोकते हैं।
      ways:
      - style: visual
        teach: पेड़ पर और पेड़ के पास कौन-कौन रहता है, साथ-साथ देखो।
        picture:
          kind: compare
          columns:
          - title: पेड़ के ऊपर
            points:
            - तोता
            - गिलहरी
            - मधुमक्खी का छत्ता
          - title: पेड़ के नीचे
            points:
            - आराम करती गाय
            - खेलते बच्चे
            - चींटियों का बिल
          alt: पेड़ के ऊपर तोता, गिलहरी और मधुमक्खी का छत्ता होता है। पेड़ के नीचे गाय आराम करती है, बच्चे खेलते हैं और चींटियों का बिल होता है।
      - style: real_world
        teach: गरमी की दोपहर में सड़क पर चलने वाले लोग अक्सर किसी बड़े पेड़ की छाँव में रुककर थोड़ा आराम करते हैं।
    - teach: 'पौधा लगाने के कदम: गड्ढा खोदो, पौधा रखो, जड़ों पर मिट्टी डालो, पानी दो। फिर हर दिन थोड़ा पानी दो।'
      picture:
        kind: flow
        steps:
        - गड्ढा खोदो
        - पौधा रखो
        - मिट्टी डालो
        - पानी दो
        alt: पौधा लगाने के चार कदम।
      check:
        prompt: पौधा रखने के बाद जड़ों पर क्या डालते हैं?
        options:
        - मिट्टी
        - पत्थर
        - कागज़
        answer: मिट्टी
        why: मिट्टी जड़ों को पकड़ती और खाना देती है।
      ways:
      - style: step_by_step
        teach: 'लगाए हुए पौधे का ध्यान रखो। पहला: सुबह देखो कि मिट्टी सूखी है या गीली। दूसरा: सूखी हो तो थोड़ा पानी डालो। तीसरा: पास में उगी घास हटाओ। चौथा: हर हफ़्ते देखो कि नए पत्ते आए या नहीं।'
      - style: real_world
        teach: कुछ परिवार हर बच्चे के जन्म पर आँगन में एक आम या नीम का पेड़ लगाते हैं, और बच्चा बड़ा होकर उसके फल खाता है।
  items:
  - prompt: जन्मदिवस पर क्या लगाने को कहा गया है?
    options:
    - पेड़
    - पोस्टर
    - ताला
    answer: पेड़
    difficulty: 1
    hints:
    - पाठ का नाम।
    - हरा।
    solution: जन्मदिवस पर पेड़ लगाओ।
    mistakes:
      पोस्टर: hin1_read_again
  - prompt: पेड़ हमें क्या देते हैं?
    options:
    - छाया और फल
    - धुआँ
    - शोर
    answer: छाया और फल
    difficulty: 1
    hints:
    - गर्मी में।
    - आम, केला।
    solution: पेड़ छाया और फल देते हैं।
    mistakes: {"धुआँ": "h1_ped_dete", "शोर": "h1_ped_dete"}
  - prompt: पौधे को रोज़ क्या देना चाहिए?
    options:
    - पानी
    - चॉकलेट
    - दूध
    answer: पानी
    difficulty: 1
    hints:
    - पौधों को प्यास लगती है।
    - प से।
    solution: पौधे को रोज़ पानी देना चाहिए।
    mistakes: {"चॉकलेट": "h1_paudha_paani", "दूध": "h1_paudha_paani"}
  - prompt: '''जन्मदिवस'' का दूसरा शब्द क्या है?'
    options:
    - जन्मदिन
    - त्योहार
    - छुट्टी
    answer: जन्मदिन
    difficulty: 2
    hints:
    - जिस दिन जन्म हुआ।
    - केक काटते हैं।
    solution: जन्मदिवस यानी जन्मदिन।
    mistakes:
      छुट्टी: hin1_word
  - prompt: पेड़ हवा को कैसा बनाते हैं?
    options:
    - साफ़
    - गंदा
    - धुएँ वाला
    answer: साफ़
    difficulty: 2
    hints:
    - हमें साँस लेने में मदद।
    - ताज़ी हवा।
    solution: पेड़ हवा साफ़ करते हैं।
    mistakes: {"गंदा": "h1_ped_hawa", "धुएँ वाला": "h1_ped_hawa"}
  - prompt: पौधा लगाने से पहले क्या करते हैं?
    options:
    - गड्ढा खोदते हैं
    - पानी फेंकते हैं
    - पत्ते तोड़ते हैं
    answer: गड्ढा खोदते हैं
    difficulty: 2
    hints:
    - मिट्टी में जगह।
    - पहला काम।
    solution: पहले गड्ढा खोदते हैं।
    mistakes: {"पानी फेंकते हैं": "h1_paudha_kram", "पत्ते तोड़ते हैं": "h1_paudha_kram"}
  - prompt: पेड़ पर घोंसला कौन बनाता है?
    options:
    - चिड़िया
    - मछली
    - गाय
    answer: चिड़िया
    difficulty: 1
    hints:
    - जो उड़ सकता है।
    - तिनके जोड़कर घर बनाती है।
    solution: 'चरण 1: घोंसला पक्षी का घर। चरण 2: चिड़िया।'
    mistakes:
      मछली: c1h16_ped
      गाय: c1h16_ped
  - prompt: पौधा लगाने का पहला कदम क्या है?
    options:
    - गड्ढा खोदना
    - फल तोड़ना
    - पानी पीना
    answer: गड्ढा खोदना
    difficulty: 2
    hints:
    - पौधे की जड़ें कहाँ जाएँगी?
    - मिट्टी में जगह बनाओ।
    solution: 'चरण 1: जड़ों के लिए जगह। चरण 2: गड्ढा खोदना।'
    mistakes:
      फल तोड़ना: c1h16_kram
      पानी पीना: c1h16_kram
  - prompt: पेड़ की जड़ें मिट्टी के लिए क्या करती हैं?
    options:
    - मिट्टी को बहने से रोकती हैं
    - मिट्टी खा जाती हैं
    - मिट्टी उड़ाती हैं
    answer: मिट्टी को बहने से रोकती हैं
    difficulty: 3
    hints:
    - जड़ें मिट्टी को कसकर पकड़ती हैं।
    - बारिश में क्या होगा अगर पेड़ न हों?
    solution: 'चरण 1: जड़ें जाल की तरह। चरण 2: मिट्टी बहती नहीं।'
    mistakes:
      मिट्टी खा जाती हैं: c1h16_ped
      मिट्टी उड़ाती हैं: c1h16_ped
  - prompt: तुम्हारा जन्मदिन है और तुम छह साल के हुए। एक पेड़ हर साल लगाओ तो अब तक कितने?
    options:
    - छह
    - पाँच
    - सात
    answer: छह
    difficulty: 3
    hints:
    - हर जन्मदिन पर एक।
    - पहले जन्मदिन से अब तक गिनो।
    solution: 'चरण 1: 1, 2, 3, 4, 5, 6 जन्मदिन। चरण 2: छह पेड़।'
    mistakes:
      पाँच: c1h16_kram
      सात: c1h16_kram
  - prompt: पेड़ काटने से क्या होगा?
    options:
    - छाया और साफ़ हवा कम होगी
    - ज़्यादा फल मिलेंगे
    - पक्षी खुश होंगे
    answer: छाया और साफ़ हवा कम होगी
    difficulty: 2
    hints:
    - पेड़ क्या-क्या देते थे?
    - पक्षियों के घर कहाँ जाएँगे?
    solution: 'चरण 1: पेड़ छाया, हवा देते हैं। चरण 2: कटे तो ये कम होंगे।'
    mistakes:
      ज़्यादा फल मिलेंगे: c1h16_ped
      पक्षी खुश होंगे: c1h16_ped
  - prompt: '''पौधा'' का बहुवचन क्या है?'
    options:
    - पौधे
    - पौधा
    - पौधी
    answer: पौधे
    difficulty: 2
    hints:
    - एक पौधा, कई ___।
    - भुट्टा-भुट्टे जैसा।
    solution: 'चरण 1: आ को ए में बदलो। चरण 2: पौधे।'
    mistakes:
      पौधा: c1h16_shabd
      पौधी: c1h16_shabd
  - prompt: नए पौधे को बचाने के लिए चारों ओर क्या लगाते हैं?
    options:
    - छोटी बाड़
    - आग
    - कूड़ा
    answer: छोटी बाड़
    difficulty: 3
    hints:
    - जानवर पत्ते न खा जाएँ।
    - लकड़ी या जाली का घेरा।
    solution: 'चरण 1: पौधा कोमल है। चरण 2: बाड़ से बचाते हैं।'
    mistakes:
      आग: c1h16_kram
      कूड़ा: c1h16_kram
  - prompt: '''पेड़'' का दूसरा नाम क्या है?'
    options:
    - वृक्ष
    - फूल
    - पत्ता
    answer: वृक्ष
    difficulty: 3
    hints:
    - किताबों में यह शब्द आता है।
    - '''वृ'' से शुरू होता है।'
    solution: 'चरण 1: पेड़ = ?। चरण 2: वृक्ष।'
    mistakes:
      फूल: c1h16_shabd
      पत्ता: c1h16_shabd
  - prompt: पौधे को बढ़ने के लिए पानी के साथ और क्या चाहिए?
    options:
    - धूप
    - अँधेरा कमरा
    - प्लास्टिक
    answer: धूप
    difficulty: 1
    hints:
    - दिन में आसमान से आती है।
    - पत्ते इसे पसंद करते हैं।
    solution: 'चरण 1: पौधे पानी, हवा, धूप लेते हैं। चरण 2: धूप।'
    mistakes:
      अँधेरा कमरा: c1h16_ped
      प्लास्टिक: c1h16_ped
  - prompt: 'स्थिति (केस): तान्या ने जन्मदिन पर एक पौधा लगाया। एक हफ़्ते बाद उसके पत्ते मुरझाने लगे, और मिट्टी बिलकुल सूखी है। तान्या क्या करे?'
    options:
    - पौधे को थोड़ा पानी दे
    - पौधा उखाड़कर फेंक दे
    - पौधे पर कपड़ा ढककर भूल जाए
    answer: पौधे को थोड़ा पानी दे
    hints:
