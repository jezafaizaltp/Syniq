subject: cbse1-hin
chapter: 16
title: जन्मदिवस पर पेड़ लगाओ
concepts:
- code: cbse1h.16.janmdivas
  title: जन्मदिवस पर पेड़ लगाओ
  notes: |
    'जन्मदिवस पर पेड़ लगाओ' पाठ: जन्मदिन पर पेड़ लगाने का अच्छा विचार, पेड़ के फ़ायदे, पौधे को पानी देना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: जन्मदिन पर एक पेड़ लगाना बहुत अच्छा तोहफ़ा है। पेड़ हमें छाया, फल और साफ़ हवा देते हैं। पौधे को रोज़ पानी देना चाहिए।
    visual: 'चित्र बनाओ: जन्मदिन की टोपी पहने बच्चा एक छोटा पौधा लगा रहा है।'
    step_by_step: 1. पाठ पढ़ो। 2. जन्मदिन पर क्या करने को कहा? 3. पेड़ हमें क्या देते हैं? 4. पौधे की देखभाल कैसे करें?
    real_world: कई स्कूलों में बच्चे अपने जन्मदिन पर एक पौधा लगाते हैं।
  picture:
    kind: flow
    steps:
    - गड्ढा खोदो
    - पौधा लगाओ
    - मिट्टी डालो
    - रोज़ पानी दो
    alt: गड्ढा खोदो, पौधा लगाओ, मिट्टी डालो और रोज़ पानी दो।
  items:
  - prompt: जन्मदिवस पर क्या लगाने को कहा गया है?
    options:
    - पेड़
    - पोस्टर
    - ताला
    answer: पेड़
    difficulty: 1
    hints:
    - पाठ का नाम।
    - हरा।
    solution: जन्मदिवस पर पेड़ लगाओ।
    mistakes:
      पोस्टर: hin1_read_again
  - prompt: पेड़ हमें क्या देते हैं?
    options:
    - छाया और फल
    - धुआँ
    - शोर
    answer: छाया और फल
    difficulty: 1
    hints:
    - गर्मी में।
    - आम, केला।
    solution: पेड़ छाया और फल देते हैं।
  - prompt: पौधे को रोज़ क्या देना चाहिए?
    options:
    - पानी
    - चॉकलेट
    - दूध
    answer: पानी
    difficulty: 1
    hints:
    - पौधों को प्यास लगती है।
    - प से।
    solution: पौधे को रोज़ पानी देना चाहिए।
  - prompt: '''जन्मदिवस'' का दूसरा शब्द क्या है?'
    options:
    - जन्मदिन
    - त्योहार
    - छुट्टी
    answer: जन्मदिन
    difficulty: 2
    hints:
    - जिस दिन जन्म हुआ।
    - केक काटते हैं।
    solution: जन्मदिवस यानी जन्मदिन।
    mistakes:
      छुट्टी: hin1_word
  - prompt: पेड़ हवा को कैसा बनाते हैं?
    options:
    - साफ़
    - गंदा
    - धुएँ वाला
    answer: साफ़
    difficulty: 2
    hints:
    - हमें साँस लेने में मदद।
    - ताज़ी हवा।
    solution: पेड़ हवा साफ़ करते हैं।
  - prompt: पौधा लगाने से पहले क्या करते हैं?
    options:
    - गड्ढा खोदते हैं
    - पानी फेंकते हैं
    - पत्ते तोड़ते हैं
    answer: गड्ढा खोदते हैं
    difficulty: 2
    hints:
    - मिट्टी में जगह।
    - पहला काम।
    solution: पहले गड्ढा खोदते हैं।
