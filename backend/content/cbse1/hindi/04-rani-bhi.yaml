# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 4. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 4
title: रानी भी
tips:
  h1_akela: "अकेले बैठे बच्चे के मन में क्या चल रहा होगा? तुम उसका दिन अच्छा कैसे बना सकते हो?"
  h1_pulling: "सिर्फ़ पहला अक्षर मिलना काफ़ी नहीं। जोड़ी सोचो: बेटी-बेटा, दादी-दादा। रानी के साथ कौन?"
  h1_sabko: "सोचो, अगर तुम्हें खेल में न लिया जाए तो कैसा लगेगा।"
  c1h4_sab: सोचो, कोई तुम्हें खेल में न बुलाए तो कैसा लगेगा?
  c1h4_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। अर्थ ठीक बैठता है?

concepts:
- code: cbse1h.04.rani
  title: रानी भी
  notes: |
    'रानी भी' पाठ: रानी भी हर काम में साथ आने की बात; सबको शामिल करना, बराबरी। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह पाठ सबके साथ खेलने और काम करने की इच्छा के बारे में है। हर बच्चे को साथ लेना चाहिए। 'भी' का मतलब है 'वह भी साथ में'।
    visual: 'चित्र बनाओ: बच्चे खेल रहे हैं और रानी को भी हाथ पकड़कर बुला रहे हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. पाठ में किस बात की इच्छा है? 3. 'भी' शब्द कहाँ-कहाँ आया? 4. सबको साथ क्यों लें?
    real_world: खेल में नए बच्चे को भी बुलाने से वह खुश हो जाता है।
  picture:
    kind: flow
    steps:
    - सब खेल रहे थे
    - रानी आई
    - रानी भी खेली
    - सब खुश
    alt: सब खेल रहे थे, रानी आई, रानी भी खेली और सब खुश हुए।
  activity:
    type: sort
    prompt: 'सबको साथ लेना: कौन-सी बात ''रानी भी'' जैसी है?'
    bins:
    - सबको साथ लेना
    - किसी को छोड़ देना
    items:
    - label: 🙋 आओ, तुम भी खेलो
      bin: सबको साथ लेना
      clue: क्या इससे कोई अकेला रहेगा?
      why: सबको शामिल करना।
    - label: 🍪 बिस्किट बाँटना
      bin: सबको साथ लेना
      clue: बाँटने से सब खुश?
      why: मिलकर बाँटना।
    - label: 🚫 तुम नहीं खेल सकती
      bin: किसी को छोड़ देना
      clue: सुनकर रानी को कैसा लगेगा?
      why: किसी को बाहर रखना ठीक नहीं।
    - label: 🙈 उसे अनदेखा करना
      bin: किसी को छोड़ देना
      clue: क्या यह साथ लेना है?
      why: अनदेखा करना छोड़ देना है।
  lesson:
    - teach: '''रानी भी'' पाठ हर काम में सबके साथ आने की इच्छा के बारे में है। हर बच्चा खेलना और सीखना चाहता है।'
      check:
        prompt: '''भी'' शब्द का क्या मतलब है?'
        options:
        - साथ में, और
        - नहीं
        - अकेले
        answer: साथ में, और
        why: '''मैं भी'' मतलब मैं भी साथ में।'
    - teach: 'हम सबको साथ लेते हैं: छोटे-बड़े, लड़के-लड़कियाँ, नए दोस्त, जो धीरे चलते हैं वे भी। कोई अकेला न रहे।'
      picture:
        kind: compare
        columns:
        - title: ठीक
          points:
          - सबको खेल में बुलाना
          - बारी-बारी खेलना
        - title: ठीक नहीं
          points:
          - किसी को बाहर रखना
          - चिढ़ाना
        alt: सबको साथ लेना ठीक है; किसी को बाहर रखना नहीं।
      check:
        prompt: नया बच्चा अकेला बैठा है। हम क्या करें?
        options:
        - उसे खेलने बुलाएँ
        - उसे अनदेखा करें
        - उस पर हँसें
        answer: उसे खेलने बुलाएँ
        why: सबको साथ लेने से सब खुश रहते हैं।
    - teach: 'जोड़ी वाले शब्द: राजा-रानी, लड़का-लड़की, दादा-दादी, भाई-बहन।'
      check:
        prompt: '''लड़का'' का जोड़ी शब्द क्या है?'
        options:
        - लड़की
        - राजा
        - बच्चा
        answer: लड़की
        why: लड़का-लड़की जोड़ी है।
  items:
  - prompt: पाठ में साथ आने की बात किसकी है?
    options:
    - रानी
    - मीना
    - दादी
    answer: रानी
    difficulty: 1
    hints:
    - पाठ का नाम।
    - र से शुरू।
    solution: साथ आने की बात रानी की है।
    mistakes:
      मीना: hin1_read_again
  - prompt: खेल में किसे साथ लेना चाहिए?
    options:
    - सबको
    - किसी को नहीं
    - सिर्फ़ दोस्तों को
    answer: सबको
    difficulty: 1
    hints:
    - कोई अकेला न रहे।
    - सब मिलकर।
    solution: खेल में सबको साथ लेना चाहिए।
    mistakes: {"किसी को नहीं": "h1_sabko", "सिर्फ़ दोस्तों को": "h1_sabko"}
  - prompt: '''भी'' का मतलब है:'
    options:
    - साथ में
    - नहीं
    - अकेले
    answer: साथ में
    difficulty: 2
    hints:
    - '''मैं भी आऊँगी।'''
    - जोड़ने वाला शब्द।
    solution: '''भी'' यानी साथ में।'
    mistakes:
      नहीं: hin1_word
  - prompt: 'कोई अकेला बैठा हो तो हम:'
    options:
    - उसे खेलने बुलाएँ
    - उसे चिढ़ाएँ
    - दूर चले जाएँ
    answer: उसे खेलने बुलाएँ
    difficulty: 1
    hints:
    - दया।
    - साथ लो।
    solution: उसे खेलने बुलाएँ।
    mistakes: {"उसे चिढ़ाएँ": "h1_akela", "दूर चले जाएँ": "h1_akela"}
  - prompt: '''रानी'' का पुल्लिंग शब्द क्या है?'
    options:
    - राजा
    - रोना
    - रात
    answer: राजा
    difficulty: 2
    hints:
    - "सोचो: कहानियों में रानी के साथ महल में कौन रहता है?"
    - महल वाला।
    solution: रानी का पुल्लिंग राजा है।
    mistakes: {"रोना": "h1_pulling", "रात": "h1_pulling"}
  - prompt: सब मिलकर खेलने से क्या होता है?
    options:
    - सब खुश होते हैं
    - सब रोते हैं
    - खेल रुकता है
    answer: सब खुश होते हैं
    difficulty: 2
    hints:
    - मज़ा बढ़ता है।
    - दोस्ती।
    solution: सब खुश होते हैं।
    mistakes: {"सब रोते हैं": "h1_saath", "खेल रुकता है": "h1_saath"}
  - prompt: खेल में कितने बच्चों को साथ लेना चाहिए?
    options:
    - सबको
    - सिर्फ़ दोस्तों को
    - किसी को नहीं
    answer: सबको
    difficulty: 1
    hints:
    - कोई अकेला न रहे।
    - हर बच्चा खेलना चाहता है।
    solution: 'चरण 1: सब खेलना चाहते हैं। चरण 2: सबको साथ लो।'
    mistakes:
      सिर्फ़ दोस्तों को: c1h4_sab
      किसी को नहीं: c1h4_sab
  - prompt: '''मैं भी खेलूँ?'' का मतलब क्या है?'
    options:
    - साथ खेलने की इच्छा
    - खेल बंद करना
    - घर जाना
    answer: साथ खेलने की इच्छा
    difficulty: 1
    hints:
    - '''भी'' का अर्थ याद करो।'
    - बोलने वाला साथ आने को कह रहा है।
    solution: 'चरण 1: ''भी'' = साथ में। चरण 2: बात साथ खेलने की इच्छा की है।'
    mistakes:
      खेल बंद करना: c1h4_shabd
      घर जाना: c1h4_shabd
  - prompt: '''दादा'' का जोड़ी शब्द क्या है?'
    options:
    - दादी
    - नाना
    - चाचा
    answer: दादी
    difficulty: 1
    hints:
    - दादा-___।
    - दादा के साथ रहने वाली।
    solution: 'चरण 1: दादा और दादी जोड़ी हैं। चरण 2: दादी।'
    mistakes:
      नाना: c1h4_shabd
      चाचा: c1h4_shabd
  - prompt: एक बच्चा धीरे दौड़ता है। दौड़ के खेल में क्या करें?
    options:
    - उसे भी खेलने दें और हौसला बढ़ाएँ
    - उसे बाहर कर दें
    - उस पर हँसें
    answer: उसे भी खेलने दें और हौसला बढ़ाएँ
    difficulty: 1
    hints:
    - हर कोई अलग है।
    - खेल सबका है।
    solution: 'चरण 1: धीरे दौड़ना भी ठीक है। चरण 2: उसे खेलने दो और हौसला बढ़ाओ।'
    mistakes:
      उसे बाहर कर दें: c1h4_sab
      उस पर हँसें: c1h4_sab
  - prompt: '''भाई'' का जोड़ी शब्द क्या है?'
    options:
    - बहन
    - माँ
    - दोस्त
    answer: बहन
    difficulty: 1
    hints:
    - भाई-___।
    - घर की दूसरी बच्ची।
    solution: 'चरण 1: भाई और बहन जोड़ी हैं। चरण 2: बहन।'
    mistakes:
      माँ: c1h4_shabd
      दोस्त: c1h4_shabd
  - prompt: खेल में सबको बारी कैसे मिले?
    options:
    - बारी-बारी से खेलें
    - एक ही बच्चा खेले
    - झगड़ा करें
    answer: बारी-बारी से खेलें
    difficulty: 2
    hints:
    - एक के बाद एक।
    - सबको मौका।
    solution: 'चरण 1: एक के बाद एक खेलो। चरण 2: सबको बारी मिलेगी।'
    mistakes:
      एक ही बच्चा खेले: c1h4_sab
      झगड़ा करें: c1h4_sab
  - prompt: चार बच्चे खेल रहे हैं। रानी भी आ गई। अब कितने?
    options:
    - पाँच
    - चार
    - तीन
    answer: पाँच
    difficulty: 2
    hints:
    - एक और जुड़ा।
    - चार और एक।
    solution: 'चरण 1: 4 बच्चे। चरण 2: 4 + 1 = 5।'
    mistakes:
      चार: c1h4_sab
      तीन: c1h4_sab
  - prompt: '''अकेला'' का उलटा क्या है?'
    options:
    - साथ
    - छोटा
    - दूर
    answer: साथ
    difficulty: 2
    hints:
    - अकेला मतलब बिना किसी के।
    - सबके संग।
    solution: 'चरण 1: अकेला = कोई नहीं। चरण 2: उलटा साथ।'
    mistakes:
      छोटा: c1h4_shabd
      दूर: c1h4_shabd
  - prompt: सबको साथ खिलाने से क्या होता है?
    options:
    - सब खुश होते हैं और दोस्ती बढ़ती है
    - खेल खराब होता है
    - सब रोते हैं
    answer: सब खुश होते हैं और दोस्ती बढ़ती है
    difficulty: 3
    hints:
    - कोई अकेला नहीं रहता।
    - मिलकर खेलने का मज़ा।
    solution: 'चरण 1: कोई बाहर नहीं रहता। चरण 2: सब खुश और दोस्ती बढ़ती है।'
    mistakes:
      खेल खराब होता है: c1h4_sab
      सब रोते हैं: c1h4_sab
