subject: cbse1-hin
chapter: 4
title: रानी भी
tips:
  h1_akela: "अकेले बैठे बच्चे के मन में क्या चल रहा होगा? तुम उसका दिन अच्छा कैसे बना सकते हो?"
  h1_pulling: "सिर्फ़ पहला अक्षर मिलना काफ़ी नहीं। जोड़ी सोचो: बेटी-बेटा, दादी-दादा। रानी के साथ कौन?"
  h1_sabko: "सोचो, अगर तुम्हें खेल में न लिया जाए तो कैसा लगेगा।"

concepts:
- code: cbse1h.04.rani
  title: रानी भी
  notes: |
    'रानी भी' पाठ: रानी नाम की बच्ची भी हर काम में साथ आना चाहती है; सबको शामिल करना, बराबरी। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: इस पाठ में रानी भी सबके साथ खेलना और काम करना चाहती है। हर बच्चे को साथ लेना चाहिए। 'भी' का मतलब है 'वह भी साथ में'।
    visual: 'चित्र बनाओ: बच्चे खेल रहे हैं और रानी को भी हाथ पकड़कर बुला रहे हैं।'
    step_by_step: 1. पाठ पढ़ो। 2. रानी क्या करना चाहती है? 3. 'भी' शब्द कहाँ-कहाँ आया? 4. सबको साथ क्यों लें?
    real_world: खेल में नए बच्चे को भी बुलाने से वह खुश हो जाता है।
  picture:
    kind: flow
    steps:
    - सब खेल रहे थे
    - रानी आई
    - रानी भी खेली
    - सब खुश
    alt: सब खेल रहे थे, रानी आई, रानी भी खेली और सब खुश हुए।
  items:
  - prompt: पाठ में कौन साथ आना चाहती है?
    options:
    - रानी
    - मीना
    - दादी
    answer: रानी
    difficulty: 1
    hints:
    - पाठ का नाम।
    - र से शुरू।
    solution: रानी साथ आना चाहती है।
    mistakes:
      मीना: hin1_read_again
  - prompt: खेल में किसे साथ लेना चाहिए?
    options:
    - सबको
    - किसी को नहीं
    - सिर्फ़ दोस्तों को
    answer: सबको
    difficulty: 1
    hints:
    - कोई अकेला न रहे।
    - सब मिलकर।
    solution: खेल में सबको साथ लेना चाहिए।
    mistakes: {"किसी को नहीं": "h1_sabko", "सिर्फ़ दोस्तों को": "h1_sabko"}
  - prompt: '''भी'' का मतलब है:'
    options:
    - साथ में
    - नहीं
    - अकेले
    answer: साथ में
    difficulty: 2
    hints:
    - '''मैं भी आऊँगी।'''
    - जोड़ने वाला शब्द।
    solution: '''भी'' यानी साथ में।'
    mistakes:
      नहीं: hin1_word
  - prompt: 'कोई अकेला बैठा हो तो हम:'
    options:
    - उसे खेलने बुलाएँ
    - उसे चिढ़ाएँ
    - दूर चले जाएँ
    answer: उसे खेलने बुलाएँ
    difficulty: 1
    hints:
    - दया।
    - साथ लो।
    solution: उसे खेलने बुलाएँ।
    mistakes: {"उसे चिढ़ाएँ": "h1_akela", "दूर चले जाएँ": "h1_akela"}
  - prompt: '''रानी'' का पुल्लिंग शब्द क्या है?'
    options:
    - राजा
    - रोना
    - रात
    answer: राजा
    difficulty: 2
    hints:
    - राजा और ...
    - महल वाला।
    solution: रानी का पुल्लिंग राजा है।
    mistakes: {"रोना": "h1_pulling", "रात": "h1_pulling"}
  - prompt: सब मिलकर खेलने से क्या होता है?
    options:
    - सब खुश होते हैं
    - सब रोते हैं
    - खेल रुकता है
    answer: सब खुश होते हैं
    difficulty: 2
    hints:
    - मज़ा बढ़ता है।
    - दोस्ती।
    solution: सब खुश होते हैं।
    mistakes: {"सब रोते हैं": "h1_saath", "खेल रुकता है": "h1_saath"}
