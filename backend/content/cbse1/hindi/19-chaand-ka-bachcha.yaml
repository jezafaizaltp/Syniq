# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 19. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 19
title: चाँद का बच्चा
tips:
  c1h19_pyaar: "सोचो, किसी को परिवार वाले नाम से बुलाएँ तो उसके लिए मन में क्या होता है?"
  h1_chanda: "चाँद के लिए एक प्यारा नाम है, जैसे माँ के भाई को बुलाते हैं।"
  h1_kalpana: "कविता-कहानी में कई बातें मज़े के लिए सोची जाती हैं। असल दुनिया में ऐसा होता है क्या?"
  h1_raat_aasmaan: "रात के आसमान को याद करो: अँधेरे में क्या-क्या टिमटिमाता और चमकता है?"
  c1h19_aasmaan: 'रात के आसमान को मन में देखो: क्या-क्या चमकता है?'
  c1h19_sach: "सोचो, क्या ऐसा सच में हो सकता है? चाँद क्या-क्या कर सकता है?"
  c1h19_shabd: शब्द को धीरे बोलो और हर आवाज़ ध्यान से सुनो।

concepts:
- code: cbse1h.19.chaand
  title: चाँद का बच्चा
  notes: |
    'चाँद का बच्चा' कविता/कहानी: रात का आसमान, चाँद, तारे; कल्पना में चाँद का बच्चा। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कल्पना वाला पाठ चाँद के बच्चे के बारे में है। रात में आसमान में चाँद और तारे चमकते हैं। हम कल्पना करते हैं कि छोटा चाँद, चाँद का बच्चा है।
    visual: 'चित्र बनाओ: रात का आसमान, बड़ा चाँद और उसके पास छोटा-सा ''चाँद का बच्चा'', चारों ओर तारे।'
    step_by_step: 1. पाठ पढ़ो। 2. चाँद कब दिखता है? 3. चाँद के साथ कौन चमकते हैं? 4. तुम्हारी कल्पना में चाँद का बच्चा कैसा है?
    real_world: पूर्णिमा की रात चाँद पूरा गोल और बहुत चमकीला दिखता है।
  picture:
    kind: flow
    steps:
    - शाम ढली
    - रात हुई
    - चाँद निकला
    - तारे चमके
    alt: शाम ढली, रात हुई, चाँद निकला और तारे चमके।
  activity:
    type: sort
    prompt: रात के आसमान में क्या दिखता है और दिन में क्या?
    bins:
    - रात में
    - दिन में
    items:
    - label: 🌙 चाँद
      bin: रात में
      clue: चाँद कब चमकता है?
      why: रात में चाँद।
    - label: ⭐ तारे
      bin: रात में
      clue: टिमटिमाते तारे कब?
      why: रात में तारे।
    - label: ☀️ सूरज
      bin: दिन में
      clue: उजाला कौन लाता है?
      why: दिन में सूरज।
    - label: 🌈 इंद्रधनुष
      bin: दिन में
      clue: बारिश के बाद धूप में?
      why: दिन में इंद्रधनुष।
  lesson:
    - teach: '''चाँद का बच्चा'' एक प्यारी कल्पना है। चाँद सच में किसी का बच्चा नहीं होता, पर कविता में हम उसे दोस्त या बच्चे की तरह देखते हैं। हम चाँद को प्यार से ''चंदा मामा'' भी कहते हैं।'
      check:
        prompt: '''चाँद ने मुझे टॉफ़ी दी'' यह बात कैसी है?'
        options:
        - कल्पना
        - सच
        - खबर
        answer: कल्पना
        why: चाँद टॉफ़ी नहीं दे सकता, यह मन की कहानी है।
    - teach: 'चाँद रात में चमकता है। हर रात उसका आकार थोड़ा बदला दिखता है: कभी पूरा गोल (पूर्णिमा), कभी पतला-सा, और एक रात दिखता ही नहीं (अमावस)।'
      picture:
        kind: flow
        steps:
        - पतला चाँद
        - आधा चाँद
        - पूरा गोल चाँद
        - फिर पतला
        alt: रात-दर-रात चाँद का बदलता आकार।
      check:
        prompt: पूरा गोल चाँद वाली रात क्या कहलाती है?
        options:
        - पूर्णिमा
        - अमावस
        - दोपहर
        answer: पूर्णिमा
        why: पूर्ण मतलब पूरा, इसलिए पूरा चाँद पूर्णिमा पर।
    - teach: रात के आसमान में चाँद के साथ बहुत सारे तारे टिमटिमाते हैं। दिन में सूरज की तेज़ रोशनी में तारे नहीं दिखते।
      picture:
        kind: compare
        columns:
        - title: दिन
          points:
          - सूरज
          - नीला आसमान
        - title: रात
          points:
          - चाँद
          - तारे
          - अँधेरा आसमान
        alt: दिन और रात के आसमान की तुलना।
      check:
        prompt: दिन में आसमान में सबसे ज़्यादा क्या चमकता है?
        options:
        - सूरज
        - तारे
        - जुगनू
        answer: सूरज
        why: दिन सूरज की रोशनी से होता है।
  items:
  - prompt: चाँद कब दिखता है?
    options:
    - रात में
    - दोपहर की धूप में
    - कभी नहीं
    answer: रात में
    difficulty: 1
    hints:
    - अँधेरा।
    - सोने का समय।
    solution: चाँद रात में दिखता है।
    mistakes: {"दोपहर की धूप में": "h1_raat_aasmaan", "कभी नहीं": "h1_raat_aasmaan"}
  - prompt: चाँद के साथ आसमान में और क्या चमकता है?
    options:
    - तारे
    - सूरज
    - इंद्रधनुष
    answer: तारे
    difficulty: 1
    hints:
    - टिम-टिम।
    - बहुत सारे।
    solution: तारे चमकते हैं।
    mistakes: {"सूरज": "h1_raat_aasmaan", "इंद्रधनुष": "h1_raat_aasmaan"}
  - prompt: पाठ किसके बच्चे के बारे में है?
    options:
    - चाँद के
    - सूरज के
    - बादल के
    answer: चाँद के
    difficulty: 1
    hints:
    - पाठ का नाम।
    - रात वाला।
    solution: पाठ चाँद के बच्चे के बारे में है।
    mistakes:
      सूरज के: hin1_read_again
  - prompt: क्या चाँद का सच में बच्चा होता है?
    options:
    - नहीं, यह कल्पना है
    - हाँ, रोज़ दिखता है
    - हाँ, स्कूल जाता है
    answer: नहीं, यह कल्पना है
    difficulty: 2
    hints:
    - मज़ेदार पाठ।
    - सोचकर देखो।
    solution: नहीं, यह कल्पना है।
    mistakes: {"हाँ, रोज़ दिखता है": "h1_kalpana", "हाँ, स्कूल जाता है": "h1_kalpana"}
  - prompt: बच्चे चाँद को प्यार से क्या कहते हैं?
    options:
    - चंदा मामा
    - सूरज दादा
    - बादल भैया
    answer: चंदा मामा
    difficulty: 2
    hints:
    - मामा।
    - च से।
    solution: बच्चे चाँद को चंदा मामा कहते हैं।
    mistakes: {"सूरज दादा": "h1_chanda", "बादल भैया": "h1_chanda"}
  - prompt: '''चाँद'' किस अक्षर से शुरू होता है?'
    options:
    - च
    - छ
    - द
    answer: च
    difficulty: 1
    hints:
    - पहली आवाज़।
    - चम्मच वाला।
    solution: चाँद 'च' से शुरू होता है।
    mistakes:
      छ: hin1_sound
  - prompt: जिस रात चाँद बिलकुल नहीं दिखता, वह क्या कहलाती है?
    options:
    - अमावस
    - पूर्णिमा
    - होली
    answer: अमावस
    difficulty: 3
    hints:
    - यह पूरे गोल चाँद वाली रात का उलटा है।
    - उस रात सबसे ज़्यादा अँधेरा।
    solution: 'चरण 1: चाँद न दिखे। चरण 2: अमावस।'
    mistakes:
      पूर्णिमा: c1h19_aasmaan
      होली: c1h19_aasmaan
  - prompt: रात में आसमान में टिमटिमाने वाले छोटे बिंदु क्या हैं?
    options:
    - तारे
    - पतंगें
    - गुब्बारे
    answer: तारे
    difficulty: 1
    hints:
    - 'गीत: ''टिमटिम करते ...'''
    - बहुत दूर, बहुत सारे।
    solution: 'चरण 1: रात के चमकते बिंदु। चरण 2: तारे।'
    mistakes:
      पतंगें: c1h19_aasmaan
      गुब्बारे: c1h19_aasmaan
  - prompt: '''चाँद ने लोरी गाई'' यह सच है या कल्पना?'
    options:
    - कल्पना
    - सच
    - पता नहीं
    answer: कल्पना
    difficulty: 1
    hints:
    - क्या चाँद गा सकता है?
    - कविता में मज़े के लिए।
    solution: 'चरण 1: चाँद गा नहीं सकता। चरण 2: कल्पना।'
    mistakes:
      सच: c1h19_sach
      पता नहीं: c1h19_sach
  - prompt: '''चाँद'' से तुक मिलाने वाला शब्द कौन-सा?'
    options:
    - माँद
    - चाय
    - चोर
    answer: माँद
    difficulty: 3
    hints:
    - आखिर की आवाज़ '...आँद' सुनो।
    - शेर की गुफ़ा का नाम।
    solution: 'चरण 1: चाँ-द। चरण 2: माँ-द।'
    mistakes:
      चाय: c1h19_shabd
      चोर: c1h19_shabd
  - prompt: तीन रात तुमने चाँद देखा, दो रात बादल थे। कुल कितनी रातें?
    options:
    - पाँच
    - तीन
    - एक
    answer: पाँच
    difficulty: 2
    hints:
    - दोनों तरह की रातें मिलाओ।
    - तीन उँगलियाँ, फिर दो।
    solution: 'चरण 1: 3 + 2। चरण 2: पाँच रातें।'
    mistakes:
      तीन: c1h19_aasmaan
      एक: c1h19_aasmaan
  - prompt: '''रात'' का उलटा क्या है?'
    options:
    - दिन
    - शाम
    - तारा
    answer: दिन
    difficulty: 1
    hints:
    - जब सूरज होता है।
    - स्कूल जाने का समय।
    solution: 'चरण 1: रात-? जोड़ा। चरण 2: दिन।'
    mistakes:
      शाम: c1h19_shabd
      तारा: c1h19_shabd
  - prompt: चाँद को देखने के लिए किस समय बाहर जाओगे?
    options:
    - रात में
    - दोपहर में
    - सुबह स्कूल के समय
    answer: रात में
    difficulty: 1
    hints:
    - जब अँधेरा हो।
    - तारे भी तभी दिखते हैं।
    solution: 'चरण 1: चाँद अँधेरे में चमकता है। चरण 2: रात में।'
    mistakes:
      दोपहर में: c1h19_aasmaan
      सुबह स्कूल के समय: c1h19_aasmaan
  - prompt: '''तारा'' का बहुवचन क्या है?'
    options:
    - तारे
    - तारा
    - तारी
    answer: तारे
    difficulty: 2
    hints:
    - एक तारा, बहुत सारे ___।
    - आ को ए में बदलो।
    solution: 'चरण 1: आ से ए। चरण 2: तारे।'
    mistakes:
      तारा: c1h19_shabd
      तारी: c1h19_shabd
  - prompt: '''चंदा मामा'' कहकर हम चाँद के लिए क्या दिखाते हैं?'
    options:
    - प्यार और अपनापन
    - डर
    - गुस्सा
    answer: प्यार और अपनापन
    difficulty: 2
    hints:
    - मामा हमारे परिवार के होते हैं।
    - प्यार का नाम।
    solution: 'चरण 1: मामा अपने होते हैं। चरण 2: प्यार और अपनापन।'
    mistakes:
      डर: c1h19_pyaar
      गुस्सा: c1h19_pyaar
