subject: cbse1-hin
chapter: 19
title: चाँद का बच्चा
tips:
  h1_chanda: "चाँद के लिए एक प्यारा नाम है, जैसे माँ के भाई को बुलाते हैं।"
  h1_kalpana: "कविता-कहानी में कई बातें मज़े के लिए सोची जाती हैं। असल दुनिया में ऐसा होता है क्या?"
  h1_raat_aasmaan: "रात के आसमान को याद करो: अँधेरे में क्या-क्या टिमटिमाता और चमकता है?"

concepts:
- code: cbse1h.19.chaand
  title: चाँद का बच्चा
  notes: |
    'चाँद का बच्चा' कविता/कहानी: रात का आसमान, चाँद, तारे; कल्पना में चाँद का बच्चा। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: यह कल्पना वाला पाठ चाँद के बच्चे के बारे में है। रात में आसमान में चाँद और तारे चमकते हैं। हम कल्पना करते हैं कि छोटा चाँद, चाँद का बच्चा है।
    visual: 'चित्र बनाओ: रात का आसमान, बड़ा चाँद और उसके पास छोटा-सा ''चाँद का बच्चा'', चारों ओर तारे।'
    step_by_step: 1. पाठ पढ़ो। 2. चाँद कब दिखता है? 3. चाँद के साथ कौन चमकते हैं? 4. तुम्हारी कल्पना में चाँद का बच्चा कैसा है?
    real_world: पूर्णिमा की रात चाँद पूरा गोल और बहुत चमकीला दिखता है।
  picture:
    kind: flow
    steps:
    - शाम ढली
    - रात हुई
    - चाँद निकला
    - तारे चमके
    alt: शाम ढली, रात हुई, चाँद निकला और तारे चमके।
  items:
  - prompt: चाँद कब दिखता है?
    options:
    - रात में
    - दोपहर की धूप में
    - कभी नहीं
    answer: रात में
    difficulty: 1
    hints:
    - अँधेरा।
    - सोने का समय।
    solution: चाँद रात में दिखता है।
    mistakes: {"दोपहर की धूप में": "h1_raat_aasmaan", "कभी नहीं": "h1_raat_aasmaan"}
  - prompt: चाँद के साथ आसमान में और क्या चमकता है?
    options:
    - तारे
    - सूरज
    - इंद्रधनुष
    answer: तारे
    difficulty: 1
    hints:
    - टिम-टिम।
    - बहुत सारे।
    solution: तारे चमकते हैं।
    mistakes: {"सूरज": "h1_raat_aasmaan", "इंद्रधनुष": "h1_raat_aasmaan"}
  - prompt: पाठ किसके बच्चे के बारे में है?
    options:
    - चाँद के
    - सूरज के
    - बादल के
    answer: चाँद के
    difficulty: 1
    hints:
    - पाठ का नाम।
    - रात वाला।
    solution: पाठ चाँद के बच्चे के बारे में है।
    mistakes:
      सूरज के: hin1_read_again
  - prompt: क्या चाँद का सच में बच्चा होता है?
    options:
    - नहीं, यह कल्पना है
    - हाँ, रोज़ दिखता है
    - हाँ, स्कूल जाता है
    answer: नहीं, यह कल्पना है
    difficulty: 2
    hints:
    - मज़ेदार पाठ।
    - सोचकर देखो।
    solution: नहीं, यह कल्पना है।
    mistakes: {"हाँ, रोज़ दिखता है": "h1_kalpana", "हाँ, स्कूल जाता है": "h1_kalpana"}
  - prompt: बच्चे चाँद को प्यार से क्या कहते हैं?
    options:
    - चंदा मामा
    - सूरज दादा
    - बादल भैया
    answer: चंदा मामा
    difficulty: 2
    hints:
    - मामा।
    - च से।
    solution: बच्चे चाँद को चंदा मामा कहते हैं।
    mistakes: {"सूरज दादा": "h1_chanda", "बादल भैया": "h1_chanda"}
  - prompt: '''चाँद'' किस अक्षर से शुरू होता है?'
    options:
    - च
    - छ
    - द
    answer: च
    difficulty: 1
    hints:
    - पहली आवाज़।
    - चम्मच वाला।
    solution: चाँद 'च' से शुरू होता है।
    mistakes:
      छ: hin1_sound
