subject: cbse1-hin
chapter: 8
title: खतरे में साँप
tips:
  h1_jeev: "जानवरों को भी दर्द होता है। तुम्हें कोई मारे तो कैसा लगे?"
  h1_saanp_chal: "साँप के न पंख हैं, न पैर। फिर वह ज़मीन पर आगे कैसे बढ़ता है?"
  h1_saanp_khana: "साँप छोटा जीव पकड़ता है। खेत में अनाज कुतरने वाला छोटा जीव कौन है?"
  h1_suraksha: "पहले सोचो: इसमें चोट लगने का खतरा तो नहीं? सुरक्षित रास्ता चुनो।"
  c1h8_door: सोचो, सबसे सुरक्षित कदम कौन-सा है, तुम्हारे लिए भी और जीव के लिए भी?
  c1h8_jeev: 'उस जीव को मन में देखो: उसके पैर हैं या नहीं? वह कहाँ रहता है?'
  c1h8_shabd: शब्द को धीरे से बोलो और हर आवाज़ सुनो।

concepts:
- code: cbse1h.08.khatre
  title: खतरे में साँप
  notes: |
    'खतरे में साँप' कहानी: एक साँप मुश्किल/खतरे में, जीवों पर दया करना, साँप से दूर रहना और बड़ों को बताना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: इस कहानी में एक साँप खतरे में है। हमें जीवों पर दया करनी चाहिए, पर साँप को हाथ नहीं लगाना चाहिए। साँप दिखे तो दूर रहो और बड़ों को बताओ।
    visual: 'चित्र बनाओ: एक साँप और दूर खड़ा बच्चा जो बड़े को बुला रहा है।'
    step_by_step: 1. कहानी पढ़ो। 2. साँप किस खतरे में था? 3. सबने क्या किया? 4. साँप दिखे तो हमें क्या करना चाहिए?
    real_world: साँप खेतों में चूहे खाकर फसल बचाते हैं।
  picture:
    kind: flow
    steps:
    - साँप दिखा
    - दूर रहे
    - बड़ों को बताया
    - साँप सुरक्षित गया
    alt: साँप दिखा, बच्चे दूर रहे, बड़ों को बताया और साँप सुरक्षित चला गया।
  activity:
    type: sort
    prompt: साँप दिखे तो क्या करें?
    bins:
    - ठीक है
    - ठीक नहीं
    items:
    - label: 🚶 दूर रहना
      bin: ठीक है
      clue: साँप के पास जाना सुरक्षित?
      why: दूर रहना सुरक्षित।
    - label: 📢 बड़ों को बताना
      bin: ठीक है
      clue: मदद किससे लें?
      why: बड़ों को बताओ।
    - label: 🪨 पत्थर मारना
      bin: ठीक नहीं
      clue: क्या उसे चोट पहुँचाना ठीक?
      why: जीवों पर दया करो, उसे मत सताओ।
    - label: ✋ पकड़ने की कोशिश
      bin: ठीक नहीं
      clue: क्या यह सुरक्षित है?
      why: साँप को कभी मत छुओ।
  lesson:
    - teach: '''खतरे में साँप'' कहानी में एक साँप मुसीबत में है। खतरा मतलब ऐसी बात जिससे चोट या नुकसान हो सकता है। मुसीबत में पड़े जीव पर भी दया करनी चाहिए।'
      check:
        prompt: '''मुसीबत में पड़े जीव'' के साथ हमें कैसा होना चाहिए?'
        options:
        - दयालु
        - गुस्सैल
        - बेपरवाह
        answer: दयालु
        why: हर जीव को दर्द होता है, इसलिए हम दया दिखाते हैं।
      ways:
      - style: visual
        teach: खतरे वाली बातें और सुरक्षित बातें, आमने-सामने देखो।
        picture:
          kind: compare
          columns:
          - title: खतरा
            points:
            - गहरे पानी के पास अकेले जाना
            - जलती आग छूना
            - सड़क पर दौड़ना
          - title: सुरक्षित
            points:
            - बड़ों के साथ रहना
            - आग से दूर रहना
            - किनारे पर चलना
          alt: गहरे पानी के पास अकेले जाना, आग छूना और सड़क पर दौड़ना खतरा है। बड़ों के साथ रहना, आग से दूर रहना और किनारे चलना सुरक्षित है।
      - style: real_world
        teach: कुछ लोग जानवरों को बचाने का काम करते हैं। वे घायल चिड़ियों, कुत्तों और दूसरे जीवों का इलाज करते हैं।
    - teach: साँप के पैर नहीं होते। वह पेट के बल रेंगकर चलता है। साँप खेतों में चूहे खाता है, इसलिए किसान की फसल बचती है।
      picture:
        kind: compare
        columns:
        - title: साँप
          points:
          - पैर नहीं
          - रेंगकर चलता है
          - चूहे खाता है
        - title: घोड़ा
          points:
          - चार पैर
          - दौड़ता है
          - घास खाता है
        alt: 'साँप और घोड़े की तुलना: पैर, चलना और खाना।'
      check:
        prompt: साँप बिना पैरों के कैसे आगे बढ़ता है?
        options:
        - रेंगकर
        - उड़कर
        - कूदकर
        answer: रेंगकर
        why: साँप अपने शरीर को मोड़कर ज़मीन पर सरकता है।
      ways:
      - style: visual
        teach: पैर वाले जीव और बिना पैर वाले जीव, अलग-अलग देखो।
        picture:
          kind: compare
          columns:
          - title: पैर हैं
            points:
            - मेंढक
            - छिपकली
            - चींटी
          - title: पैर नहीं हैं
            points:
            - मछली
            - घोंघा
          alt: मेंढक, छिपकली और चींटी के पैर हैं। मछली और घोंघे के पैर नहीं हैं।
      - style: real_world
        teach: खेतों में किसान चाहते हैं कि चूहे कम हों, क्योंकि चूहे अनाज खा जाते हैं। उल्लू भी रात में चूहे पकड़ता है।
    - teach: साँप दिखे तो उसे छूना या मारना नहीं है। चुपचाप दूर हट जाओ और किसी बड़े को बताओ। बड़े सही मदद बुला सकते हैं।
      picture:
        kind: flow
        steps:
        - साँप दिखा
        - रुको, छुओ मत
        - दूर हटो
        - बड़े को बताओ
        alt: साँप दिखने पर चार कदम।
      check:
        prompt: आँगन में साँप दिखे तो पहला काम क्या?
        options:
        - रुककर दूर हटना
        - उसे पकड़ना
        - पत्थर फेंकना
        answer: रुककर दूर हटना
        why: दूर रहने से न तुम्हें चोट लगेगी, न साँप को।
      ways:
      - style: step_by_step
        teach: 'कोई जीव दिखे तो सुरक्षित रहो। पहला: रुक जाओ, भागो मत। दूसरा: धीरे-धीरे पीछे हटो। तीसरा: उसे छूना या पत्थर मारना नहीं। चौथा: किसी बड़े को जाकर बताओ।'
      - style: real_world
        teach: जंगल या पार्क में लगे बोर्ड पर लिखा होता है कि जानवरों को न छेड़ें और उन्हें खाना न डालें।
  items:
  - prompt: साँप दिखे तो हमें क्या करना चाहिए?
    options:
    - दूर रहकर बड़ों को बताना
    - उसे पकड़ना
    - उसे पत्थर मारना
    answer: दूर रहकर बड़ों को बताना
    difficulty: 1
    hints:
    - सुरक्षा पहले।
    - हाथ मत लगाओ।
    solution: दूर रहकर बड़ों को बताना चाहिए।
    mistakes: {"उसे पकड़ना": "h1_suraksha", "उसे पत्थर मारना": "h1_suraksha"}
  - prompt: जीवों के साथ हमें कैसा व्यवहार करना चाहिए?
    options:
    - दया का
    - मार-पीट का
    - चिढ़ाने का
    answer: दया का
    difficulty: 1
    hints:
    - वे भी दर्द महसूस करते हैं।
    - प्यार।
    solution: जीवों पर दया करनी चाहिए।
    mistakes: {"मार-पीट का": "h1_jeev", "चिढ़ाने का": "h1_jeev"}
  - prompt: साँप कैसे चलता है?
    options:
    - रेंगकर
    - उड़कर
    - दो पैरों पर
    answer: रेंगकर
    difficulty: 1
    hints:
    - उसके पैर नहीं होते।
    - ज़मीन पर सरकता है।
    solution: साँप रेंगकर चलता है।
    mistakes: {"उड़कर": "h1_saanp_chal", "दो पैरों पर": "h1_saanp_chal"}
  - prompt: कहानी में कौन खतरे में है?
    options:
    - साँप
    - शेर
    - बच्चा
    answer: साँप
    difficulty: 1
    hints:
    - पाठ का नाम।
    - स से।
    solution: कहानी में साँप खतरे में है।
    mistakes:
      बच्चा: hin1_read_again
  - prompt: '''खतरा'' का अर्थ है:'
    options:
    - डर या मुसीबत की बात
    - खेल
    - मिठाई
    answer: डर या मुसीबत की बात
    difficulty: 2
    hints:
    - सावधान रहो।
    - मुसीबत।
    solution: खतरा यानी डर या मुसीबत।
    mistakes:
      खेल: hin1_word
  - prompt: साँप खेत में किसे खाकर फसल बचाता है?
    options:
    - चूहों को
    - गायों को
    - पेड़ों को
    answer: चूहों को
    difficulty: 2
    hints:
    - छोटे जीव जो अनाज खाते हैं।
    - चूँ-चूँ।
    solution: साँप चूहे खाता है।
    mistakes: {"गायों को": "h1_saanp_khana", "पेड़ों को": "h1_saanp_khana"}
  - prompt: साँप देखकर डंडा मारना ठीक है या नहीं?
    options:
    - नहीं, दूर हटकर बड़ों को बताना ठीक है
    - हाँ, ज़रूर मारो
    - हाँ, पीछा करो
    answer: नहीं, दूर हटकर बड़ों को बताना ठीक है
    difficulty: 2
    hints:
    - मारने से साँप डरकर काट भी सकता है।
    - सुरक्षित रास्ता चुनो।
    solution: 'चरण 1: छेड़ने से खतरा बढ़ता है। चरण 2: दूर हटो, बड़ों को बताओ।'
    mistakes:
      हाँ, ज़रूर मारो: c1h8_door
      हाँ, पीछा करो: c1h8_door
  - prompt: इनमें से किसके पैर नहीं होते?
    options:
    - साँप
    - बिल्ली
    - मुर्गी
    answer: साँप
    difficulty: 1
    hints:
    - जो ज़मीन पर सरकता है।
    - मुर्गी के दो पैर हैं, बिल्ली के चार।
    solution: 'चरण 1: पैर गिनो। चरण 2: साँप के पैर नहीं।'
    mistakes:
      बिल्ली: c1h8_jeev
      मुर्गी: c1h8_jeev
  - prompt: साँप चूहे खाता है। इससे किसे फ़ायदा होता है?
    options:
    - किसान को
    - चूहों को
    - किसी को नहीं
    answer: किसान को
    difficulty: 2
    hints:
    - चूहे खेत में क्या खा जाते हैं?
    - फसल बचे तो कौन खुश होगा?
    solution: 'चरण 1: चूहे अनाज खाते हैं। चरण 2: साँप चूहे खाए तो किसान की फसल बचती है।'
    mistakes:
      चूहों को: c1h8_jeev
      किसी को नहीं: c1h8_jeev
  - prompt: '''खतरा'' शब्द में कितने अक्षर हैं: ख, त, रा?'
    options:
    - तीन
    - दो
    - चार
    answer: तीन
    difficulty: 1
    hints:
    - हर अक्षर पर एक उँगली रखो।
    - ख... त... रा...
    solution: 'चरण 1: ख, त, रा गिनो। चरण 2: तीन।'
    mistakes:
      दो: c1h8_shabd
      चार: c1h8_shabd
  - prompt: मुसीबत में पड़े किसी जीव को देखकर सबसे अच्छा क्या है?
    options:
    - बड़ों को बताकर मदद बुलाना
    - हँसना
    - उसे परेशान करना
    answer: बड़ों को बताकर मदद बुलाना
    difficulty: 2
    hints:
    - तुम छोटे हो, अकेले मत जाओ।
    - मदद कौन ला सकता है?
    solution: 'चरण 1: खुद पास न जाओ। चरण 2: बड़ों से मदद बुलाओ।'
    mistakes:
      हँसना: c1h8_door
      उसे परेशान करना: c1h8_door
  - prompt: साँप की तरह रेंगने वाला एक और जीव कौन है?
    options:
    - केंचुआ
    - कुत्ता
    - तोता
    answer: केंचुआ
    difficulty: 2
    hints:
    - यह मिट्टी में रहता है।
    - इसके भी पैर नहीं होते।
    solution: 'चरण 1: रेंगने वाले के पैर नहीं होते। चरण 2: केंचुआ।'
    mistakes:
      कुत्ता: c1h8_jeev
      तोता: c1h8_jeev
  - prompt: '''साँप'' का बहुवचन क्या है?'
    options:
    - साँप
    - साँपें
    - साँपो
    answer: साँप
    difficulty: 3
    hints:
    - '''एक साँप'', ''चार ___''।'
    - कुछ शब्द बहुवचन में भी वैसे ही रहते हैं।
    solution: 'चरण 1: एक साँप, दो साँप। चरण 2: शब्द नहीं बदलता।'
    mistakes:
      साँपें: c1h8_shabd
      साँपो: c1h8_shabd
  - prompt: '''डर'' का उलटा क्या है?'
    options:
    - हिम्मत
    - रोना
    - भागना
    answer: हिम्मत
    difficulty: 3
    hints:
    - जो डरता नहीं, उसमें क्या होता है?
    - बहादुरी जैसा शब्द।
    solution: 'चरण 1: डर का उलटा न डरना। चरण 2: हिम्मत।'
    mistakes:
      रोना: c1h8_shabd
      भागना: c1h8_shabd
  - prompt: घास में चलते समय क्या पहनना सुरक्षित है?
    options:
    - जूते
    - कुछ नहीं, नंगे पैर
    - मोज़े ही
    answer: जूते
    difficulty: 2
    hints:
    - पैरों को किससे बचाना है?
    - कीड़े, काँटे, जीव।
    solution: 'चरण 1: घास में जीव छिपे हो सकते हैं। चरण 2: जूते पैर बचाते हैं।'
    mistakes:
      कुछ नहीं, नंगे पैर: c1h8_door
      मोज़े ही: c1h8_door
  - prompt: 'स्थिति (केस): खेल के मैदान में झाड़ियों के पास बच्चों को एक साँप दिखा। एक बच्चा पत्थर उठाने लगा। सबसे अच्छा क्या है?'
    options:
    - सब दूर हटें और टीचर को बताएँ
    - पत्थर मारें
    - पास जाकर देखें
