# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 8. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 8
title: खतरे में साँप
tips:
  h1_jeev: "जानवरों को भी दर्द होता है। तुम्हें कोई मारे तो कैसा लगे?"
  h1_saanp_chal: "साँप के न पंख हैं, न पैर। फिर वह ज़मीन पर आगे कैसे बढ़ता है?"
  h1_saanp_khana: "साँप छोटा जीव पकड़ता है। खेत में अनाज कुतरने वाला छोटा जीव कौन है?"
  h1_suraksha: "पहले सोचो: इसमें चोट लगने का खतरा तो नहीं? सुरक्षित रास्ता चुनो।"

concepts:
- code: cbse1h.08.khatre
  title: खतरे में साँप
  notes: |
    'खतरे में साँप' कहानी: एक साँप मुश्किल/खतरे में, जीवों पर दया करना, साँप से दूर रहना और बड़ों को बताना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: इस कहानी में एक साँप खतरे में है। हमें जीवों पर दया करनी चाहिए, पर साँप को हाथ नहीं लगाना चाहिए। साँप दिखे तो दूर रहो और बड़ों को बताओ।
    visual: 'चित्र बनाओ: एक साँप और दूर खड़ा बच्चा जो बड़े को बुला रहा है।'
    step_by_step: 1. कहानी पढ़ो। 2. साँप किस खतरे में था? 3. सबने क्या किया? 4. साँप दिखे तो हमें क्या करना चाहिए?
    real_world: साँप खेतों में चूहे खाकर फसल बचाते हैं।
  picture:
    kind: flow
    steps:
    - साँप दिखा
    - दूर रहे
    - बड़ों को बताया
    - साँप सुरक्षित गया
    alt: साँप दिखा, बच्चे दूर रहे, बड़ों को बताया और साँप सुरक्षित चला गया।
  items:
  - prompt: साँप दिखे तो हमें क्या करना चाहिए?
    options:
    - दूर रहकर बड़ों को बताना
    - उसे पकड़ना
    - उसे पत्थर मारना
    answer: दूर रहकर बड़ों को बताना
    difficulty: 1
    hints:
    - सुरक्षा पहले।
    - हाथ मत लगाओ।
    solution: दूर रहकर बड़ों को बताना चाहिए।
    mistakes: {"उसे पकड़ना": "h1_suraksha", "उसे पत्थर मारना": "h1_suraksha"}
  - prompt: जीवों के साथ हमें कैसा व्यवहार करना चाहिए?
    options:
    - दया का
    - मार-पीट का
    - चिढ़ाने का
    answer: दया का
    difficulty: 1
    hints:
    - वे भी दर्द महसूस करते हैं।
    - प्यार।
    solution: जीवों पर दया करनी चाहिए।
    mistakes: {"मार-पीट का": "h1_jeev", "चिढ़ाने का": "h1_jeev"}
  - prompt: साँप कैसे चलता है?
    options:
    - रेंगकर
    - उड़कर
    - दो पैरों पर
    answer: रेंगकर
    difficulty: 1
    hints:
    - उसके पैर नहीं होते।
    - ज़मीन पर सरकता है।
    solution: साँप रेंगकर चलता है।
    mistakes: {"उड़कर": "h1_saanp_chal", "दो पैरों पर": "h1_saanp_chal"}
  - prompt: कहानी में कौन खतरे में है?
    options:
    - साँप
    - शेर
    - बच्चा
    answer: साँप
    difficulty: 1
    hints:
    - पाठ का नाम।
    - स से।
    solution: कहानी में साँप खतरे में है।
    mistakes:
      बच्चा: hin1_read_again
  - prompt: '''खतरा'' का अर्थ है:'
    options:
    - डर या मुसीबत की बात
    - खेल
    - मिठाई
    answer: डर या मुसीबत की बात
    difficulty: 2
    hints:
    - सावधान रहो।
    - मुसीबत।
    solution: खतरा यानी डर या मुसीबत।
    mistakes:
      खेल: hin1_word
  - prompt: साँप खेत में किसे खाकर फसल बचाता है?
    options:
    - चूहों को
    - गायों को
    - पेड़ों को
    answer: चूहों को
    difficulty: 2
    hints:
    - छोटे जीव जो अनाज खाते हैं।
    - चूँ-चूँ।
    solution: साँप चूहे खाता है।
    mistakes: {"गायों को": "h1_saanp_khana", "पेड़ों को": "h1_saanp_khana"}
