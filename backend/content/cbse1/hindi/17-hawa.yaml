subject: cbse1-hin
chapter: 17
title: हवा
tips:
  h1_hawa_dikhe: "हाथ आगे करो और फूँको। क्या तुम्हें कोई रंग दिखा, या बस कुछ छूता लगा?"
  h1_hawa_udna: "हवा भारी चीज़ें नहीं उठा पाती। कौन-सी हल्की चीज़ धागे से बँधकर आसमान में नाचती है?"
  h1_kapde_sukhna: "कपड़े सुखाने के लिए माँ उन्हें बाहर रस्सी पर क्यों टाँगती हैं?"
  h1_pankha: "बल्ब रोशनी देता है, तवा रोटी सेंकता है। छत पर घूमकर ठंडक कौन देता है?"
  h1_saans: "नाक बंद करके देखो: थोड़ी देर में किसकी कमी लगती है?"
  c1h17_hawa: 'बाहर खड़े होकर सोचो: चेहरे पर क्या छूता है, पत्ते क्यों हिलते हैं?'
  c1h17_shabd: शब्द को धीरे बोलो और हर आवाज़ सुनो।
  c1h17_kaam: सोचो, बिना हवा के यह काम हो सकता है या नहीं?

concepts:
- code: cbse1h.17.hawa
  title: हवा
  notes: |
    हवा पर कविता: हवा दिखती नहीं पर महसूस होती है; पतंग उड़ाना, पत्ते हिलना, हवा में साँस लेना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: हवा दिखाई नहीं देती, पर हम उसे महसूस करते हैं। हवा से पत्ते हिलते हैं, पतंग उड़ती है और कपड़े सूखते हैं। हम हवा में साँस लेते हैं।
    visual: 'चित्र बनाओ: हिलते पत्ते, उड़ती पतंग और रस्सी पर सूखते कपड़े।'
    step_by_step: 1. कविता लय से बोलो। 2. हवा से क्या-क्या होता है? 3. हवा दिखती है या नहीं? 4. तुकांत शब्द खोजो।
    real_world: पंखा चलने पर हमें हवा लगती है।
  picture:
    kind: compare
    columns:
    - title: हवा से
      points:
      - पतंग
      - पत्ते
      - कपड़े
    - title: क्या होता है
      points:
      - उड़ती है
      - हिलते हैं
      - सूखते हैं
    alt: हवा से पतंग उड़ती है, पत्ते हिलते हैं और कपड़े सूखते हैं।
  activity:
    type: sort
    prompt: हवा से क्या होता है?
    bins:
    - हवा से होता है
    - हवा से नहीं
    items:
    - label: 🪁 पतंग उड़ती है
      bin: हवा से होता है
      clue: पतंग को कौन उठाता है?
      why: हवा पतंग उड़ाती है।
    - label: 🍃 पत्ते हिलते हैं
      bin: हवा से होता है
      clue: पत्ते अपने आप हिलते हैं?
      why: हवा से।
    - label: 🫁 साँस लेते हैं
      bin: हवा से होता है
      clue: साँस में क्या जाता है?
      why: हम हवा में साँस लेते हैं।
    - label: 🌙 चाँद चमकता है
      bin: हवा से नहीं
      clue: क्या हवा चाँद को चमकाती है?
      why: चाँद सूरज की रोशनी से चमकता है।
  lesson:
    - teach: हवा हमारे चारों ओर है। हवा दिखती नहीं, पर हम उसे महसूस करते हैं। पत्ते हिलें, बाल उड़ें, झंडा लहराए, तो समझो हवा चल रही है।
      check:
        prompt: हवा चल रही है, यह कैसे पता चलता है?
        options:
        - पत्ते हिलते हैं
        - पत्थर बड़े होते हैं
        - दीवार रंग बदलती है
        answer: पत्ते हिलते हैं
        why: हवा दिखती नहीं, पर चीज़ों को हिलाती है।
      ways:
      - style: step_by_step
        teach: 'हवा को महसूस करो। पहला: हथेली मुँह के पास रखो। दूसरा: धीरे से फूँक मारो। तीसरा: हथेली पर ठंडक महसूस करो। चौथा: यही हवा है, जो दिखती नहीं पर छूती है।'
      - style: visual
        teach: फूँक मारकर हवा को महसूस करने का खेल, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - हथेली मुँह के पास रखो
          - धीरे से फूँक मारो
          - हथेली पर ठंडक आई
          - यह हवा का छूना है
          alt: हथेली मुँह के पास रखो, धीरे से फूँक मारो, हथेली पर ठंडक आती है, यही हवा का छूना है।
    - teach: हम हवा में साँस लेते हैं। हवा के बिना कोई जीव नहीं रह सकता। पेड़-पौधे हवा को साफ़ करते हैं।
      check:
        prompt: नाक से अंदर लेने वाली चीज़ क्या है?
        options:
        - हवा
        - पानी
        - मिट्टी
        answer: हवा
        why: साँस में हवा अंदर-बाहर जाती है।
      ways:
      - style: visual
        teach: हल्की हवा और तेज़ हवा में क्या-क्या होता है, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: हल्की हवा
            points:
            - पत्ते धीरे हिलते हैं
            - बाल थोड़े उड़ते हैं
          - title: तेज़ हवा
            points:
            - डालियाँ झुकती हैं
            - धूल उड़ती है
            - दरवाज़े ज़ोर से बंद होते हैं
          alt: हल्की हवा में पत्ते धीरे हिलते हैं और बाल थोड़े उड़ते हैं। तेज़ हवा में डालियाँ झुकती हैं, धूल उड़ती है और दरवाज़े ज़ोर से बंद होते हैं।
      - style: real_world
        teach: मौसम की खबर में बताते हैं कि आज हवा कितनी तेज़ चलेगी, ताकि मछुआरे जान सकें कि समुद्र में जाना ठीक है या नहीं।
    - teach: 'हवा बहुत काम करती है: पतंग उड़ाती है, गीले कपड़े सुखाती है, नाव के पाल को धकेलती है, पवन-चक्की घुमाती है।'
      picture:
        kind: compare
        columns:
        - title: हवा का काम
          points:
          - पतंग उड़ाना
          - कपड़े सुखाना
          - पवन-चक्की घुमाना
        - title: हवा न हो तो
          points:
          - पतंग गिरेगी
          - कपड़े देर से सूखेंगे
          - चक्की रुकेगी
        alt: हवा के काम और हवा न होने पर क्या होगा।
      check:
        prompt: आसमान में कागज़ की पतंग किसके सहारे उड़ती है?
        options:
        - हवा
        - पानी
        - धूप
        answer: हवा
        why: हवा पतंग को ऊपर धकेलती है।
      ways:
      - style: visual
        teach: हवा के कुछ और काम, जो हम हर दिन देखते हैं।
        picture:
          kind: flow
          steps:
          - फूँक से मोमबत्ती बुझती है
          - हवा से सूखे पत्ते उड़ते हैं
          - बाँसुरी में हवा से धुन बजती है
          - साइकिल के टायर में हवा भरते हैं
          alt: फूँक से मोमबत्ती बुझती है, हवा से सूखे पत्ते उड़ते हैं, बाँसुरी में हवा से धुन बजती है और साइकिल के टायर में हवा भरते हैं।
      - style: real_world
        teach: जन्मदिन पर बच्चे फूँक मारकर केक की मोमबत्तियाँ बुझाते हैं। फूँक भी हवा ही है।
  items:
  - prompt: क्या हवा दिखाई देती है?
    options:
    - नहीं, पर महसूस होती है
