subject: cbse1-hin
chapter: 17
title: हवा
concepts:
- code: cbse1h.17.hawa
  title: हवा
  notes: |
    हवा पर कविता: हवा दिखती नहीं पर महसूस होती है; पतंग उड़ाना, पत्ते हिलना, हवा में साँस लेना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: हवा दिखाई नहीं देती, पर हम उसे महसूस करते हैं। हवा से पत्ते हिलते हैं, पतंग उड़ती है और कपड़े सूखते हैं। हम हवा में साँस लेते हैं।
    visual: 'चित्र बनाओ: हिलते पत्ते, उड़ती पतंग और रस्सी पर सूखते कपड़े।'
    step_by_step: 1. कविता लय से बोलो। 2. हवा से क्या-क्या होता है? 3. हवा दिखती है या नहीं? 4. तुकांत शब्द खोजो।
    real_world: पंखा चलने पर हमें हवा लगती है।
  picture:
    kind: compare
    columns:
    - title: हवा से
      points:
      - पतंग
      - पत्ते
      - कपड़े
    - title: क्या होता है
      points:
      - उड़ती है
      - हिलते हैं
      - सूखते हैं
    alt: हवा से पतंग उड़ती है, पत्ते हिलते हैं और कपड़े सूखते हैं।
  items:
  - prompt: क्या हवा दिखाई देती है?
    options:
    - नहीं, पर महसूस होती है
    - हाँ, नीली दिखती है
    - हाँ, लाल दिखती है
    answer: नहीं, पर महसूस होती है
    difficulty: 2
    hints:
    - अपनी आँखों से देखो।
    - चेहरे पर लगती है।
    solution: हवा दिखती नहीं, महसूस होती है।
  - prompt: हवा से क्या उड़ती है?
    options:
    - पतंग
    - किताब भारी
    - पत्थर
    answer: पतंग
    difficulty: 1
    hints:
    - डोर से बँधी।
    - आसमान में।
    solution: हवा से पतंग उड़ती है।
  - prompt: हम किसमें साँस लेते हैं?
    options:
    - हवा
    - पानी
    - मिट्टी
    answer: हवा
    difficulty: 1
    hints:
    - नाक से।
    - ह से।
    solution: हम हवा में साँस लेते हैं।
  - prompt: गीले कपड़े किससे जल्दी सूखते हैं?
    options:
    - हवा और धूप से
    - अँधेरे से
    - बर्फ़ से
    answer: हवा और धूप से
    difficulty: 2
    hints:
    - बाहर रस्सी पर।
    - गरम और हवादार।
    solution: हवा और धूप से कपड़े सूखते हैं।
  - prompt: घर में हवा के लिए क्या चलाते हैं?
    options:
    - पंखा
    - तवा
    - बल्ब
    answer: पंखा
    difficulty: 1
    hints:
    - घूमता है।
    - छत पर।
    solution: हवा के लिए पंखा चलाते हैं।
  - prompt: '''हवा'' किस अक्षर से शुरू होता है?'
    options:
    - ह
    - व
    - ब
    answer: ह
    difficulty: 2
    hints:
    - पहली आवाज़।
    - होली वाला।
    solution: हवा 'ह' से शुरू होता है।
    mistakes:
      व: hin1_sound
