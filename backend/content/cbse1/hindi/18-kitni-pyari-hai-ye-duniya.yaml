# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 18. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 18
title: कितनी प्यारी है ये दुनिया
tips:
  h1_kooda: "नदी और सड़क सबकी हैं; वहाँ कचरा सबको परेशान करता है। कचरे का अपना डिब्बा होता है।"
  h1_nadi: "नदी में नाव चलती है और मछलियाँ रहती हैं। नाव किस पर तैरती है?"
  h1_panchhi: "पंछियों के पास पंख हैं। सुबह-सुबह पेड़ों से क्या सुनाई देता है?"
  h1_phool: "तोड़ा हुआ फूल जल्दी मुरझा जाता है। सब देख सकें, इसके लिए फूल को कहाँ रहने दें?"
  c1h18_prakriti: 'बाहर की दुनिया को मन में देखो: वह चीज़ कहाँ रहती या दिखती है?'
  c1h18_raksha: सोचो, इससे दुनिया सुंदर और साफ़ रहेगी या नहीं?
  c1h18_shabd: शब्द को धीरे बोलो और उसका मतलब मन में देखो।

concepts:
- code: cbse1h.18.kitni
  title: कितनी प्यारी है ये दुनिया
  notes: |
    दुनिया की सुंदरता पर कविता: फूल, पंछी, नदियाँ, पहाड़, आसमान; प्रकृति की रक्षा। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'हमारी दुनिया बहुत प्यारी है: रंग-बिरंगे फूल, गाते पंछी, बहती नदियाँ, ऊँचे पहाड़ और नीला आसमान। हमें इसे साफ़ और सुंदर रखना है।'
    visual: 'चित्र बनाओ: पहाड़, नदी, फूल, पंछी और सूरज वाला सुंदर दृश्य।'
    step_by_step: 1. कविता लय से बोलो। 2. दुनिया में क्या-क्या सुंदर है? 3. हम दुनिया को सुंदर कैसे रखें? 4. तुकांत शब्द खोजो।
    real_world: कूड़ा कूड़ेदान में डालने से हमारी जगह साफ़ और सुंदर रहती है।
  picture:
    kind: compare
    columns:
    - title: सुंदर चीज़ें
      points:
      - फूल
      - पंछी
      - नदी
    - title: हम क्या करें
      points:
      - न तोड़ें
      - न सताएँ
      - गंदा न करें
    alt: फूल न तोड़ें, पंछियों को न सताएँ और नदी को गंदा न करें।
  activity:
    type: sort
    prompt: प्रकृति की रक्षा कैसे करें?
    bins:
    - रक्षा करते हैं
    - नुक़सान करते हैं
    items:
    - label: 🌱 पौधे लगाना
      bin: रक्षा करते हैं
      clue: धरती हरी कैसे रहे?
      why: पौधे लगाना।
    - label: 🗑️ कचरा कूड़ेदान में
      bin: रक्षा करते हैं
      clue: कचरा कहाँ डालें?
      why: सफ़ाई रखना।
    - label: 🐦 पंछियों को पानी
      bin: रक्षा करते हैं
      clue: गर्मी में पंछी प्यासे?
      why: जीवों की मदद।
    - label: 🌊 नदी में कचरा
      bin: नुक़सान करते हैं
      clue: नदी गंदी होगी?
      why: नदी को गंदा मत करो।
    - label: 🌸 फूल तोड़कर फेंकना
      bin: नुक़सान करते हैं
      clue: फूल पौधे पर अच्छा लगता है?
      why: फूल मत तोड़ो।
  lesson:
    - teach: '''कितनी प्यारी है ये दुनिया'' कविता दुनिया की सुंदर चीज़ों की बात करती है: रंग-बिरंगे फूल, गाते पंछी, बहती नदियाँ, ऊँचे पहाड़ और नीला आसमान।'
      picture:
        kind: compare
        columns:
        - title: ऊपर
          points:
          - नीला आसमान
          - उड़ते पंछी
        - title: धरती पर
          points:
          - फूल
          - नदियाँ
          - पहाड़
        alt: आसमान और धरती की सुंदर चीज़ें।
      check:
        prompt: बहते पानी की लंबी धारा क्या कहलाती है?
        options:
        - नदी
        - पहाड़
        - बादल
        answer: नदी
        why: नदी में पानी एक जगह से दूसरी जगह बहता है।
      ways:
      - style: visual
        teach: दुनिया की कुछ सुंदर चीज़ें और वे कहाँ मिलती हैं, साथ-साथ देखो।
        picture:
          kind: compare
          columns:
          - title: चीज़
            points:
            - रंगीन मछली
            - बर्फ़
            - रेत के टीले
          - title: कहाँ
            points:
            - समुद्र में
            - ऊँचे पहाड़ों पर
            - रेगिस्तान में
          alt: रंगीन मछली समुद्र में, बर्फ़ ऊँचे पहाड़ों पर और रेत के टीले रेगिस्तान में मिलते हैं।
      - style: real_world
        teach: सुबह की सैर पर लोग उगता सूरज, ओस की बूँदें और चहचहाते पक्षी देखते हैं, और दिन अच्छा शुरू होता है।
    - teach: सुंदर दुनिया को सुंदर रखना हमारा काम है। कूड़ा कूड़ेदान में डालो, नदी में कचरा मत फेंको, फूल मत तोड़ो, पानी बचाओ।
      check:
        prompt: चिप्स का खाली पैकेट कहाँ डालें?
        options:
        - कूड़ेदान में
        - नदी में
        - सड़क पर
        answer: कूड़ेदान में
        why: कूड़ेदान में डालने से जगह साफ़ रहती है।
      ways:
      - style: step_by_step
        teach: 'पिकनिक के बाद जगह साफ़ करो। पहला: एक थैला साथ लो। दूसरा: अपने सारे खाली पैकेट उसमें डालो। तीसरा: ज़मीन पर कुछ छूटा तो उठा लो। चौथा: घर जाते समय थैला कूड़ेदान में डाल दो।'
      - style: visual
        teach: पिकनिक के बाद जगह को सुंदर छोड़ने के कदम, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - एक थैला साथ लो
          - खाली पैकेट थैले में रखो
          - ज़मीन पर छूटा कचरा उठाओ
          - घर जाकर थैला खाली करो
          alt: पिकनिक पर एक थैला साथ लो, खाली पैकेट उसमें रखो, ज़मीन पर छूटा कचरा उठाओ और घर जाकर थैला खाली करो।
    - teach: 'मिलते-जुलते शब्द: प्यारी-सुंदर, पंछी-पक्षी, आसमान-आकाश। उलटे शब्द: सुंदर-बदसूरत, साफ़-गंदा।'
      check:
        prompt: '''पंछी'' का दूसरा शब्द कौन-सा है?'
        options:
        - पक्षी
        - पत्ता
        - पानी
        answer: पक्षी
        why: पंछी और पक्षी दोनों उड़ने वाले जीव के नाम हैं।
      ways:
      - style: visual
        teach: कुछ और मिलते-जुलते शब्द, जिनका मतलब लगभग एक है।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - पानी
            - फूल
            - धरती
          - title: मिलता-जुलता शब्द
            points:
            - जल
            - पुष्प
            - ज़मीन
          alt: पानी और जल, फूल और पुष्प, धरती और ज़मीन के मतलब लगभग एक जैसे हैं।
      - style: step_by_step
        teach: 'मिलता-जुलता शब्द जाँचो। पहला: वाक्य लो, ''मछली पानी में रहती है।'' दूसरा: ''पानी'' हटाओ। तीसरा: उसकी जगह ''जल'' रखो। चौथा: मतलब वही रहा, तो दोनों शब्द मिलते-जुलते हैं।'
  items:
  - prompt: कविता के अनुसार दुनिया कैसी है?
    options:
    - प्यारी
    - डरावनी
    - बेकार
    answer: प्यारी
    difficulty: 1
    hints:
    - पाठ का नाम।
    - सुंदर।
    solution: दुनिया प्यारी है।
    mistakes:
      डरावनी: hin1_read_again
  - prompt: कूड़ा कहाँ डालना चाहिए?
    options:
    - कूड़ेदान में
    - नदी में
    - सड़क पर
    answer: कूड़ेदान में
    difficulty: 1
    hints:
    - सफ़ाई।
    - डिब्बे में।
    solution: कूड़ा कूड़ेदान में डालना चाहिए।
    mistakes: {"नदी में": "h1_kooda", "सड़क पर": "h1_kooda"}
  - prompt: पंछी क्या करते हैं?
    options:
    - गाते और उड़ते हैं
    - तैरते ही हैं
    - रेंगते हैं
    answer: गाते और उड़ते हैं
    difficulty: 1
    hints:
    - पंख होते हैं।
    - चीं-चीं।
    solution: पंछी गाते और उड़ते हैं।
    mistakes: {"तैरते ही हैं": "h1_panchhi", "रेंगते हैं": "h1_panchhi"}
  - prompt: नदी में क्या बहता है?
    options:
    - पानी
    - रेत के पहाड़
    - पेड़
    answer: पानी
    difficulty: 1
    hints:
    - तैरने वाली चीज़।
    - प से।
    solution: नदी में पानी बहता है।
    mistakes: {"रेत के पहाड़": "h1_nadi", "पेड़": "h1_nadi"}
  - prompt: '''प्यारी'' जैसा मतलब किस शब्द का है?'
    options:
    - सुंदर
    - डरावनी
    - गंदी
    answer: सुंदर
    difficulty: 2
    hints:
    - जो देखने में अच्छी लगे।
    - डरावनी का उलटा।
    solution: प्यारी और सुंदर का मतलब मिलता-जुलता है।
    mistakes:
      डरावनी: hin1_word
  - prompt: 'बगीचे में फूल देखकर हमें:'
    options:
    - "उन्हें देखना और छोड़ना चाहिए"
    - "सारे फूल तोड़ लेने चाहिए"
    - "पैरों से कुचल देना चाहिए"
    answer: उन्हें देखना और छोड़ना चाहिए
    difficulty: 2
    hints:
    - सबके लिए सुंदर।
    - पौधे को दर्द।
    solution: फूलों को देखें, तोड़ें नहीं।
    mistakes: {"सारे फूल तोड़ लेने चाहिए": "h1_phool", "पैरों से कुचल देना चाहिए": "h1_phool"}
  - prompt: '''आसमान'' का दूसरा शब्द क्या है?'
    options:
    - आकाश
    - धरती
    - नदी
    answer: आकाश
    difficulty: 2
    hints:
    - ऊपर नीली जगह।
    - '''आ'' से ही शुरू होता है।'
    solution: 'चरण 1: आसमान = ?। चरण 2: आकाश।'
    mistakes:
      धरती: c1h18_shabd
      नदी: c1h18_shabd
  - prompt: '''साफ़'' का उलटा क्या है?'
    options:
    - गंदा
    - सुंदर
    - बड़ा
    answer: गंदा
    difficulty: 1
    hints:
    - कीचड़ में खेलकर कपड़े कैसे होते हैं?
    - उलटी बात सोचो।
    solution: 'चरण 1: साफ़-? जोड़ा। चरण 2: गंदा।'
    mistakes:
      सुंदर: c1h18_shabd
      बड़ा: c1h18_shabd
  - prompt: बगीचे में सुंदर फूल दिखे। क्या करें?
    options:
    - "देखकर खुश हों, तोड़ें नहीं"
    - "सारे फूल तोड़कर घर ले जाएँ"
    - "पूरा पौधा जड़ से उखाड़ लें"
    answer: देखकर खुश हों, तोड़ें नहीं
    difficulty: 1
    hints:
    - फूल पौधे पर ज़्यादा दिन रहता है।
    - दूसरे भी देखना चाहेंगे।
    solution: 'चरण 1: तोड़ने से फूल मुरझाता है। चरण 2: देखो, छोड़ो।'
    mistakes:
      "सारे फूल तोड़कर घर ले जाएँ": c1h18_raksha
      "पूरा पौधा जड़ से उखाड़ लें": c1h18_raksha
  - prompt: इनमें से कौन-सी चीज़ इंसान ने नहीं बनाई?
    options:
    - पहाड़
    - मकान
    - कार
    answer: पहाड़
    difficulty: 2
    hints:
    - जो प्रकृति ने बनाया।
    - मकान और कार कारखानों-मज़दूरों से बने।
    solution: 'चरण 1: प्रकृति की चीज़ ढूँढो। चरण 2: पहाड़।'
    mistakes:
      मकान: c1h18_prakriti
      कार: c1h18_prakriti
  - prompt: नल खुला छोड़ दिया तो क्या करें?
    options:
    - तुरंत बंद करें
    - छोड़ दें
    - और खोलें
    answer: तुरंत बंद करें
    difficulty: 1
    hints:
    - पानी बह रहा है, बर्बाद हो रहा है।
    - पानी बचाओ।
    solution: 'चरण 1: पानी कीमती है। चरण 2: नल बंद करो।'
    mistakes:
      छोड़ दें: c1h18_raksha
      और खोलें: c1h18_raksha
  - prompt: नदी में कचरा डालने से क्या होगा?
    options:
    - "पानी गंदा होगा, मछलियाँ बीमार होंगी"
    - "नदी पहले से ज़्यादा सुंदर हो जाएगी"
    - "नदी का पानी मीठा और साफ़ हो जाएगा"
    answer: पानी गंदा होगा, मछलियाँ बीमार होंगी
    difficulty: 2
    hints:
    - नदी में कौन रहते हैं?
    - गंदा पानी कौन पिएगा?
    solution: 'चरण 1: कचरा पानी गंदा करता है। चरण 2: जीव बीमार होते हैं।'
    mistakes:
      "नदी पहले से ज़्यादा सुंदर हो जाएगी": c1h18_raksha
      "नदी का पानी मीठा और साफ़ हो जाएगा": c1h18_raksha
  - prompt: सुबह-सुबह 'चीं-चीं' कौन करता है?
    options:
    - चिड़िया
    - शेर
    - मेंढक
    answer: चिड़िया
    difficulty: 1
    hints:
    - छोटा पंछी, पेड़ पर रहता है।
    - शेर दहाड़ता है।
    solution: 'चरण 1: छोटे पंछी की आवाज़। चरण 2: चिड़िया।'
    mistakes:
      शेर: c1h18_prakriti
      मेंढक: c1h18_prakriti
  - prompt: '''नदी'' का बहुवचन क्या है?'
    options:
    - नदियाँ
    - नदे
    - नदीयों
    answer: नदियाँ
    difficulty: 3
    hints:
    - एक नदी, कई ___।
    - रोटी-रोटियाँ जैसा।
    solution: 'चरण 1: ई वाले शब्द में इयाँ। चरण 2: नदियाँ।'
    mistakes:
      नदे: c1h18_shabd
      नदीयों: c1h18_shabd
  - prompt: दुनिया को सुंदर रखने के लिए तुम आज क्या कर सकते हो?
    options:
    - एक पौधे को पानी देना
    - दीवार पर लिखना
    - कागज़ फेंकना
    answer: एक पौधे को पानी देना
    difficulty: 2
