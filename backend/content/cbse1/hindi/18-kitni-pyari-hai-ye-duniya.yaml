subject: cbse1-hin
chapter: 18
title: कितनी प्यारी है ये दुनिया
concepts:
- code: cbse1h.18.kitni
  title: कितनी प्यारी है ये दुनिया
  notes: |
    दुनिया की सुंदरता पर कविता: फूल, पंछी, नदियाँ, पहाड़, आसमान; प्रकृति की रक्षा। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'हमारी दुनिया बहुत प्यारी है: रंग-बिरंगे फूल, गाते पंछी, बहती नदियाँ, ऊँचे पहाड़ और नीला आसमान। हमें इसे साफ़ और सुंदर रखना है।'
    visual: 'चित्र बनाओ: पहाड़, नदी, फूल, पंछी और सूरज वाला सुंदर दृश्य।'
    step_by_step: 1. कविता लय से बोलो। 2. दुनिया में क्या-क्या सुंदर है? 3. हम दुनिया को सुंदर कैसे रखें? 4. तुकांत शब्द खोजो।
    real_world: कूड़ा कूड़ेदान में डालने से हमारी जगह साफ़ और सुंदर रहती है।
  picture:
    kind: compare
    columns:
    - title: सुंदर चीज़ें
      points:
      - फूल
      - पंछी
      - नदी
    - title: हम क्या करें
      points:
      - न तोड़ें
      - न सताएँ
      - गंदा न करें
    alt: फूल न तोड़ें, पंछियों को न सताएँ और नदी को गंदा न करें।
  items:
  - prompt: कविता के अनुसार दुनिया कैसी है?
    options:
    - प्यारी
    - डरावनी
    - बेकार
    answer: प्यारी
    difficulty: 1
    hints:
    - पाठ का नाम।
    - सुंदर।
    solution: दुनिया प्यारी है।
    mistakes:
      डरावनी: hin1_read_again
  - prompt: कूड़ा कहाँ डालना चाहिए?
    options:
    - कूड़ेदान में
    - नदी में
    - सड़क पर
    answer: कूड़ेदान में
    difficulty: 1
    hints:
    - सफ़ाई।
    - डिब्बे में।
    solution: कूड़ा कूड़ेदान में डालना चाहिए।
  - prompt: पंछी क्या करते हैं?
    options:
    - गाते और उड़ते हैं
    - तैरते ही हैं
    - रेंगते हैं
    answer: गाते और उड़ते हैं
    difficulty: 1
    hints:
    - पंख होते हैं।
    - चीं-चीं।
    solution: पंछी गाते और उड़ते हैं।
  - prompt: नदी में क्या बहता है?
    options:
    - पानी
    - रेत के पहाड़
    - पेड़
    answer: पानी
    difficulty: 1
    hints:
    - तैरने वाली चीज़।
    - प से।
    solution: नदी में पानी बहता है।
  - prompt: '''प्यारी'' का उलटा क्या है?'
    options:
    - बुरी
    - सुंदर
    - अच्छी
    answer: बुरी
    difficulty: 2
    hints:
    - प्यारी नहीं।
    - अच्छी का उलटा।
    solution: प्यारी का उलटा बुरी है।
    mistakes:
      सुंदर: hin1_word
  - prompt: 'बगीचे में फूल देखकर हमें:'
    options:
    - उन्हें देखना और छोड़ना चाहिए
    - सब तोड़ लेने चाहिए
    - कुचल देना चाहिए
    answer: उन्हें देखना और छोड़ना चाहिए
    difficulty: 2
    hints:
    - सबके लिए सुंदर।
    - पौधे को दर्द।
    solution: फूलों को देखें, तोड़ें नहीं।
