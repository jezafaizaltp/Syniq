subject: cbse1-hin
chapter: 9
title: आलू की सड़क
tips:
  h1_aalu_bane: "कपड़ा और जूता खाए नहीं जाते। आलू भरकर कौन-सा नाश्ता तला जाता है?"
  h1_mitti_andar: "सोचो, यह सब्ज़ी खेत से कैसे निकालते हैं: तोड़कर या खोदकर?"
  h1_sabzi: "सोचो, आलू कच्चा मीठा खाते हैं या पकाकर दाल-रोटी के साथ?"
  h1_sadak: "नाव और पानी का जहाज़ पानी में चलते हैं। सड़क पर पहिये वाली चीज़ें चलती हैं।"

concepts:
- code: cbse1h.09.aalu
  title: आलू की सड़क
  notes: |
    'आलू की सड़क' एक मज़ेदार, कल्पना वाली कविता/कहानी। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।) अभ्यास: कल्पना और सच, सब्ज़ियाँ, तुकांत शब्द।
  explanations:
    text: 'यह मज़ेदार पाठ है: सोचो, अगर सड़क आलू की बनी हो! यह कल्पना है। सच में आलू एक सब्ज़ी है जो मिट्टी के अंदर उगती है।'
    visual: 'चित्र बनाओ: गोल-गोल आलुओं से बनी एक मज़ेदार सड़क, जिस पर एक गाड़ी चल रही है।'
    step_by_step: 1. पाठ पढ़ो। 2. सड़क किसकी बनी है? 3. क्या सच में ऐसा होता है? 4. आलू से क्या-क्या बनता है?
    real_world: आलू से समोसा, पराठा और सब्ज़ी बनती है।
  picture:
    kind: compare
    columns:
    - title: सच
      points:
      - आलू सब्ज़ी है
      - सड़क पत्थर की
    - title: कल्पना
      points:
      - आलू की सड़क
      - बोलता आलू
    alt: सच में आलू सब्ज़ी है और सड़क पत्थर की होती है; कल्पना में आलू की सड़क और बोलता आलू।
  activity:
    type: sort
    prompt: कौन-सी बात सच में होती है, और कौन-सी केवल कल्पना?
    bins:
    - सच में
    - कल्पना
    items:
    - label: 🥔 आलू ज़मीन के नीचे उगता है
      bin: सच में
      clue: आलू खोदकर निकालते हैं?
      why: यह सच है।
    - label: 🍟 आलू से चिप्स बनते हैं
      bin: सच में
      clue: रसोई में देखा है?
      why: सच है।
    - label: 🛣️ आलू की सड़क
      bin: कल्पना
      clue: क्या सड़क आलू से बनती है?
      why: यह मज़ेदार कल्पना है।
    - label: 🚗 आलू की गाड़ी चलना
      bin: कल्पना
      clue: आलू गाड़ी चला सकता है?
      why: कल्पना।
  items:
  - prompt: आलू क्या है?
    options:
    - सब्ज़ी
    - फल
    - खिलौना
    answer: सब्ज़ी
    difficulty: 1
    hints:
    - सब्ज़ी वाले से लेते हैं।
    - समोसे में।
    solution: आलू सब्ज़ी है।
    mistakes: {"फल": "h1_sabzi", "खिलौना": "h1_sabzi"}
  - prompt: आलू कहाँ उगता है?
    options:
    - मिट्टी के अंदर
    - पेड़ की डाल पर
    - पानी में
    answer: मिट्टी के अंदर
    difficulty: 2
    hints:
    - खोदकर निकालते हैं।
    - ज़मीन।
    solution: आलू मिट्टी के अंदर उगता है।
    mistakes: {"पेड़ की डाल पर": "h1_mitti_andar", "पानी में": "h1_mitti_andar"}
  - prompt: क्या सच में आलू की सड़क होती है?
    options:
    - नहीं, यह कल्पना है
    - हाँ, हर जगह
    - हाँ, स्कूल में
    answer: नहीं, यह कल्पना है
    difficulty: 1
    hints:
    - मज़ेदार पाठ।
    - सोचो।
    solution: नहीं, यह कल्पना है।
    mistakes:
      हाँ, हर जगह: hin1_read_again
  - prompt: आलू से क्या बनता है?
    options:
    - समोसा
    - कपड़ा
    - जूता
    answer: समोसा
    difficulty: 1
    hints:
    - खाने की चीज़।
    - तिकोना।
    solution: आलू से समोसा बनता है।
    mistakes: {"कपड़ा": "h1_aalu_bane", "जूता": "h1_aalu_bane"}
  - prompt: '''सड़क'' पर क्या चलता है?'
    options:
    - गाड़ी
    - नाव
    - जहाज़ (पानी वाला)
    answer: गाड़ी
    difficulty: 1
    hints:
    - पहियों वाली।
    - बस, कार।
    solution: सड़क पर गाड़ी चलती है।
    mistakes: {"नाव": "h1_sadak", "जहाज़ (पानी वाला)": "h1_sadak"}
  - prompt: '''आलू'' किस अक्षर से शुरू होता है?'
    options:
    - आ
    - अ
    - ल
    answer: आ
    difficulty: 2
    hints:
    - लंबी आवाज़।
    - आम वाला।
    solution: आलू 'आ' से शुरू होता है।
    mistakes:
      अ: hin1_sound
