subject: cbse1-hin
chapter: 9
title: आलू की सड़क
tips:
  h1_aalu_bane: "कपड़ा और जूता खाए नहीं जाते। आलू भरकर कौन-सा नाश्ता तला जाता है?"
  h1_mitti_andar: "सोचो, यह सब्ज़ी खेत से कैसे निकालते हैं: तोड़कर या खोदकर?"
  h1_sabzi: "सोचो, आलू कच्चा मीठा खाते हैं या पकाकर दाल-रोटी के साथ?"
  h1_sadak: "नाव और पानी का जहाज़ पानी में चलते हैं। सड़क पर पहिये वाली चीज़ें चलती हैं।"
  c1h9_ginti: 'उँगलियों पर गिनो: पहले सब खोलो, फिर खाए हुए मोड़ो।'
  c1h9_sach: सोचो, क्या यह सच में हो सकता है, या सिर्फ़ मन की कहानी है?
  c1h9_sabzi: 'उस चीज़ को मन में देखो: कहाँ उगती है, कैसी दिखती है?'
  c1h9_tuk: दोनों शब्दों के आखिर की आवाज़ धीरे-धीरे बोलकर सुनो।

concepts:
- code: cbse1h.09.aalu
  title: आलू की सड़क
  notes: |
    'आलू की सड़क' एक मज़ेदार, कल्पना वाली कविता/कहानी। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।) अभ्यास: कल्पना और सच, सब्ज़ियाँ, तुकांत शब्द।
  explanations:
    text: 'यह मज़ेदार पाठ है: सोचो, अगर सड़क आलू की बनी हो! यह कल्पना है। सच में आलू एक सब्ज़ी है जो मिट्टी के अंदर उगती है।'
    visual: 'चित्र बनाओ: गोल-गोल आलुओं से बनी एक मज़ेदार सड़क, जिस पर एक गाड़ी चल रही है।'
    step_by_step: 1. पाठ पढ़ो। 2. सड़क किसकी बनी है? 3. क्या सच में ऐसा होता है? 4. आलू से क्या-क्या बनता है?
    real_world: आलू से समोसा, पराठा और सब्ज़ी बनती है।
  picture:
    kind: compare
    columns:
    - title: सच
      points:
      - आलू सब्ज़ी है
      - सड़क पत्थर की
    - title: कल्पना
      points:
      - आलू की सड़क
      - बोलता आलू
    alt: सच में आलू सब्ज़ी है और सड़क पत्थर की होती है; कल्पना में आलू की सड़क और बोलता आलू।
  activity:
    type: sort
    prompt: कौन-सी बात सच में होती है, और कौन-सी केवल कल्पना?
    bins:
    - सच में
    - कल्पना
    items:
    - label: 🥔 आलू ज़मीन के नीचे उगता है
      bin: सच में
      clue: आलू खोदकर निकालते हैं?
      why: यह सच है।
    - label: 🍟 आलू से चिप्स बनते हैं
      bin: सच में
      clue: रसोई में देखा है?
      why: सच है।
    - label: 🛣️ आलू की सड़क
      bin: कल्पना
      clue: क्या सड़क आलू से बनती है?
      why: यह मज़ेदार कल्पना है।
    - label: 🚗 आलू की गाड़ी चलना
      bin: कल्पना
      clue: आलू गाड़ी चला सकता है?
      why: कल्पना।
  lesson:
    - teach: '''आलू की सड़क'' एक मज़ेदार कल्पना है। कल्पना मतलब मन में बनाई बात, जो सच में नहीं होती। सच्ची सड़क पत्थर और तारकोल से बनती है।'
      picture:
        kind: compare
        columns:
        - title: कल्पना
          points:
          - आलू की सड़क
          - बोलता पेड़
        - title: सच
          points:
          - पत्थर की सड़क
          - पेड़ पर फल
        alt: कल्पना और सच की तुलना।
      check:
        prompt: '''चाँद पर मेरी साइकिल चलती है'' कल्पना है या सच?'
        options:
        - कल्पना
        - सच
        - पता नहीं चल सकता
        answer: कल्पना
        why: यह मन की मज़ेदार बात है, ऐसा सच में नहीं होता।
      ways:
      - style: visual
        teach: सच की बातें और कल्पना की बातें, आमने-सामने देखो।
        picture:
          kind: compare
          columns:
          - title: सच
            points:
            - बिल्ली दूध पीती है
            - बारिश से पौधे बढ़ते हैं
          - title: कल्पना
            points:
            - बिल्ली गाना गाती है
            - पेड़ पर टॉफ़ी उगती है
          alt: बिल्ली दूध पीती है और बारिश से पौधे बढ़ते हैं, यह सच है। बिल्ली का गाना गाना और पेड़ पर टॉफ़ी उगना कल्पना है।
      - style: real_world
        teach: कार्टून में जानवर बात करते हैं और उड़ते हैं। यह सब कल्पना है, जो देखने में बहुत मज़ा देती है।
    - teach: आलू एक सब्ज़ी है। यह पौधे की जड़ के पास मिट्टी के अंदर उगता है। आलू से समोसा, पराठा, चिप्स और सब्ज़ी बनती है।
      check:
        prompt: आलू को खेत से निकालने के लिए क्या खोदना पड़ता है?
        options:
        - मिट्टी
        - पेड़ की डाल
        - पानी
        answer: मिट्टी
        why: आलू ज़मीन के नीचे उगता है।
      ways:
      - style: visual
        teach: आलू खेत से थाली तक कैसे पहुँचता है, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - खेत में आलू का पौधा
          - मिट्टी खोदकर आलू निकालना
          - बाज़ार में बिकना
          - घर में पकाना
          alt: खेत में आलू का पौधा उगता है, मिट्टी खोदकर आलू निकाले जाते हैं, बाज़ार में बिकते हैं, और घर में पकाए जाते हैं।
      - style: real_world
        teach: मूली और शकरकंद भी मिट्टी के अंदर बढ़ते हैं। किसान इन्हें खोदकर निकालते हैं।
    - teach: 'तुकांत शब्दों के आखिर की आवाज़ मिलती है: सड़क-भड़क, आलू-भालू, गाड़ी-साड़ी। कविता में ये शब्द मज़ा लाते हैं।'
      check:
        prompt: '''आलू'' से तुक मिलाने वाला शब्द कौन-सा?'
        options:
        - भालू
        - आम
        - आग
        answer: भालू
        why: आ-लू और भा-लू, आखिर में 'लू' मिलता है।
      ways:
      - style: visual
        teach: कुछ और तुकांत शब्द, जिनके आखिर की आवाज़ एक जैसी है।
        picture:
          kind: compare
          columns:
          - title: शब्द
            points:
            - मोर
            - बिल्ली
            - पानी
          - title: तुक वाला शब्द
            points:
            - चोर
            - दिल्ली
            - रानी
          alt: मोर-चोर, बिल्ली-दिल्ली और पानी-रानी तुकांत शब्द हैं।
      - style: step_by_step
        teach: 'तुक वाला शब्द ढूँढो। पहला: शब्द ''नाक'' लो। दूसरा: आखिरी आवाज़ ''आक'' सुनो। तीसरा: पहला अक्षर बदलो। चौथा: नए शब्द बने ''चाक'' और ''डाक''।'
  items:
  - prompt: आलू क्या है?
    options:
    - सब्ज़ी
    - फल
    - खिलौना
    answer: सब्ज़ी
    difficulty: 1
    hints:
    - "टमाटर और प्याज़ की तरह इसे भी पकाकर खाते हैं।"
    - समोसे में।
    solution: आलू सब्ज़ी है।
    mistakes: {"फल": "h1_sabzi", "खिलौना": "h1_sabzi"}
  - prompt: आलू कहाँ उगता है?
    options:
    - मिट्टी के अंदर
    - पेड़ की डाल पर
    - पानी में
    answer: मिट्टी के अंदर
    difficulty: 2
    hints:
    - खोदकर निकालते हैं।
    - ज़मीन।
    solution: आलू मिट्टी के अंदर उगता है।
    mistakes: {"पेड़ की डाल पर": "h1_mitti_andar", "पानी में": "h1_mitti_andar"}
  - prompt: क्या सच में आलू की सड़क होती है?
    options:
    - नहीं, यह कल्पना है
    - हाँ, हर जगह
    - हाँ, स्कूल में
    answer: नहीं, यह कल्पना है
    difficulty: 1
    hints:
    - मज़ेदार पाठ।
    - सोचो।
