    difficulty: 1
    hints:
    - पतले, कुरकुरे टुकड़े।
    - दूध गाय से आता है।
    solution: 'चरण 1: आलू को पतला काटकर तला जाता है। चरण 2: चिप्स।'
    mistakes:
