subject: cbse1-hin
chapter: 12
title: फूली रोटी
tips:
  h1_aata: "गेहूँ पीसकर जो सफ़ेद चूर्ण बनता है, उसी को गूँधते हैं।"
  h1_roti_aakar: "अपनी थाली की रोटी याद करो: उसका किनारा कैसा घूमता है?"
  h1_roti_kram: "गूँधा आटा अभी कच्चा है। बेलने से पहले आटे से छोटा गोला बनाते हैं: उसे क्या कहते हैं?"
  h1_tawa: "थाली में परोसते हैं, गिलास में पीते हैं। चूल्हे पर रखा गरम लोहे का गोल बर्तन कौन-सा है?"
  c1h12_kram: 'रसोई में मन में देखो: पहले क्या होता है, फिर क्या?'
  c1h12_garam: सोचो, गरम चीज़ के पास हाथ कैसे बचाएँ?
  c1h12_shabd: शब्द धीरे बोलो और उसका मतलब मन में देखो।

concepts:
- code: cbse1h.12.phooli
  title: फूली रोटी
  notes: |
    'फूली रोटी' पाठ: रोटी बनाना, तवे पर रोटी का फूलना, आटा गूँधना, घर के काम। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: रोटी आटे से बनती है। आटा गूँधते हैं, लोई बनाते हैं, बेलते हैं और तवे पर सेंकते हैं। आग पर रोटी गुब्बारे जैसी फूल जाती है।
    visual: 'चित्र बनाओ: तवे पर फूली हुई गोल रोटी।'
    step_by_step: 1. पाठ पढ़ो। 2. रोटी किससे बनती है? 3. रोटी बनाने का क्रम बताओ। 4. रोटी क्यों फूलती है?
    real_world: घर में रोटी दाल-सब्ज़ी के साथ खाई जाती है।
  picture:
    kind: flow
    steps:
    - आटा गूँधो
    - लोई बनाओ
    - बेलो
    - तवे पर सेंको
    - फूली रोटी
    alt: आटा गूँधो, लोई बनाओ, बेलो, तवे पर सेंको और रोटी फूल जाती है।
  activity:
    type: order
    prompt: रोटी कैसे बनती है? क्रम से लगाओ।
    steps:
    - 🥣 आटा गूँधना
    - ⚪ लोई बनाकर बेलना
    - 🍳 तवे पर सेंकना
    - 🫓 रोटी फूलती है
    reasons:
      ⚪ लोई बनाकर बेलना: गूँधे आटे से ही लोई बनती है।
      🍳 तवे पर सेंकना: बेली हुई रोटी तवे पर।
      🫓 रोटी फूलती है: सेंकने पर ही रोटी फूलती है।
  lesson:
    - teach: '''फूली रोटी'' पाठ रोटी बनने की कहानी है। आटे में पानी डालकर गूँधते हैं। फिर छोटी गोल लोई बनाते हैं और बेलन से बेलते हैं।'
      picture:
        kind: flow
        steps:
        - आटा + पानी
        - गूँधना
        - लोई
        - बेलना
        - तवे पर सेंकना
        alt: रोटी बनने के पाँच कदम।
      check:
        prompt: लोई को चपटा और गोल करने के लिए किसका उपयोग करते हैं?
        options:
        - बेलन
        - चम्मच
        - कटोरी
        answer: बेलन
        why: बेलन घुमाने से लोई पतली और गोल होती है।
      ways:
      - style: visual
        teach: खेत के गेहूँ से थाली की रोटी तक का सफ़र, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - खेत में गेहूँ
          - चक्की में पिसाई
          - आटा गूँधना
          - लोई बेलना
          - तवे पर सेंकना
          alt: खेत में गेहूँ उगता है, चक्की में पिसकर आटा बनता है, आटा गूँधते हैं, लोई बेलते हैं और तवे पर रोटी सेंकते हैं।
      - style: real_world
        teach: 'कई घरों में सुबह की रसोई में रोटी बनाने की आवाज़ें आती हैं: बेलन की खट-खट और तवे की गरम सी-सी।'
    - teach: बेली रोटी गरम तवे पर सेंकते हैं। अंदर की भाप से रोटी गुब्बारे जैसी फूल जाती है। इसे 'फूली रोटी' कहते हैं।
      check:
        prompt: रोटी फूलती क्यों है?
        options:
        - अंदर भाप भरने से
        - पानी डालने से
        - ठंड से
        answer: अंदर भाप भरने से
        why: गरमी से आटे का पानी भाप बनता है और रोटी को फुलाता है।
      ways:
      - style: step_by_step
        teach: 'रोटी फूलती कैसे है, देखो। पहला: बेली रोटी तवे पर रखो। दूसरा: एक तरफ़ हल्की सिकने दो। तीसरा: पलट दो। चौथा: अंदर भाप बनती है और रोटी गुब्बारे जैसी फूल जाती है।'
      - style: visual
        teach: बेली हुई कच्ची रोटी और तवे पर फूली रोटी, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: बेली हुई रोटी
            points:
            - चपटी
            - कच्ची
            - सफ़ेद-सी
          - title: फूली रोटी
            points:
            - गुब्बारे जैसी
            - सिकी हुई
            - भूरे निशान
          alt: बेली हुई रोटी चपटी, कच्ची और सफ़ेद-सी होती है। फूली रोटी गुब्बारे जैसी, सिकी हुई और भूरे निशान वाली होती है।
    - teach: रसोई में तवा और चूल्हा बहुत गरम होते हैं। बच्चे दूर से देखें, और गरम चीज़ बड़ों से ही उठवाएँ। रोटी बनाने वालों को धन्यवाद कहें।
      check:
        prompt: गरम तवा कौन उठाए?
        options:
        - कोई बड़ा, कपड़े या चिमटे से
        - छोटा बच्चा, खाली हाथ से
        - कोई नहीं, उसे फेंक दो
        answer: कोई बड़ा, कपड़े या चिमटे से
        why: गरम तवे से हाथ जल सकता है।
      ways:
      - style: visual
        teach: रसोई में बच्चे क्या कर सकते हैं और क्या बड़ों के लिए छोड़ें, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: बच्चे कर सकते हैं
            points:
            - थाली लगाना
            - पानी के गिलास रखना
            - धन्यवाद कहना
          - title: बड़ों का काम
            points:
            - चूल्हा जलाना
            - गरम तवा उठाना
            - चाकू से काटना
          alt: बच्चे थाली लगा सकते हैं, पानी के गिलास रख सकते हैं और धन्यवाद कह सकते हैं। चूल्हा जलाना, गरम तवा उठाना और चाकू से काटना बड़ों का काम है।
      - style: real_world
        teach: गुरुद्वारे के लंगर में बहुत से लोग मिलकर रोटियाँ बनाते हैं, और सब एक साथ बैठकर खाते हैं।
  items:
  - prompt: रोटी किससे बनती है?
    options:
    - आटे से
    - चीनी से
    - पत्थर से
    answer: आटे से
    difficulty: 1
    hints:
    - गेहूँ पीसकर।
    - आ से।
    solution: रोटी आटे से बनती है।
    mistakes: {"चीनी से": "h1_aata", "पत्थर से": "h1_aata"}
  - prompt: रोटी किस पर सेंकते हैं?
    options:
    - तवे पर
    - थाली में
    - गिलास में
    answer: तवे पर
    difficulty: 1
    hints:
    - गरम लोहे का।
    - चूल्हे पर।
    solution: रोटी तवे पर सेंकते हैं।
    mistakes: {"थाली में": "h1_tawa", "गिलास में": "h1_tawa"}
  - prompt: रोटी कैसी होती है?
    options:
    - गोल
    - तिकोनी ही
    - लंबी डंडी जैसी
    answer: गोल
    difficulty: 1
    hints:
    - चाँद जैसी।
    - बेलने से।
    solution: रोटी गोल होती है।
    mistakes: {"तिकोनी ही": "h1_roti_aakar", "लंबी डंडी जैसी": "h1_roti_aakar"}
  - prompt: आटा गूँधने के बाद क्या करते हैं?
    options:
    - लोई बनाते हैं
    - रोटी खा लेते हैं
    - तवा धोते हैं
    answer: लोई बनाते हैं
    difficulty: 2
    hints:
    - छोटी गोलियाँ।
    - फिर बेलते हैं।
    solution: आटा गूँधने के बाद लोई बनाते हैं।
    mistakes: {"रोटी खा लेते हैं": "h1_roti_kram", "तवा धोते हैं": "h1_roti_kram"}
  - prompt: '''फूली'' का अर्थ है:'
    options:
    - हवा भरकर बड़ी हुई
    - टूटी हुई
    - जली हुई
    answer: हवा भरकर बड़ी हुई
    difficulty: 2
    hints:
    - गुब्बारे जैसी।
    - फूलना।
    solution: फूली यानी हवा भरकर बड़ी हुई।
    mistakes:
      टूटी हुई: hin1_word
  - prompt: 'गरम तवे के पास हमें:'
    options:
    - ध्यान रखना चाहिए
    - हाथ लगाना चाहिए
    - दौड़ना चाहिए
    answer: ध्यान रखना चाहिए
    difficulty: 1
    hints:
    - जल सकते हैं।
    - सावधान।
    solution: गरम तवे के पास ध्यान रखना चाहिए।
    mistakes: {"हाथ लगाना चाहिए": "h1_suraksha", "दौड़ना चाहिए": "h1_suraksha"}
  - prompt: गूँधने से पहले आटे में क्या मिलाते हैं?
    options:
    - पानी
    - रेत
    - रंग
    answer: पानी
    difficulty: 1
    hints:
    - सूखा आटा चिपकता नहीं।
    - पीने वाली चीज़।
    solution: 'चरण 1: आटा सूखा है। चरण 2: पानी मिलाकर गूँधते हैं।'
    mistakes:
      रेत: c1h12_kram
      रंग: c1h12_kram
  - prompt: 'इनमें पहले क्या होता है: लोई बनाना या रोटी सेंकना?'
    options:
    - लोई बनाना
    - रोटी सेंकना
    - दोनों साथ
    answer: लोई बनाना
    difficulty: 2
    hints:
    - बिना बेले रोटी तवे पर कैसे जाएगी?
    - क्रम सोचो।
    solution: 'चरण 1: लोई, फिर बेलना। चरण 2: फिर सेंकना।'
    mistakes:
      रोटी सेंकना: c1h12_kram
      दोनों साथ: c1h12_kram
  - prompt: रोटी सेंकने वाली लोहे की चपटी चीज़ कौन-सी है?
    options:
    - तवा
    - थाली
    - गिलास
    answer: तवा
    difficulty: 1
    hints:
    - यह चूल्हे पर रखते हैं।
    - बहुत गरम हो जाता है।
    solution: 'चरण 1: रोटी चूल्हे पर किस पर रखते हैं। चरण 2: तवा।'
    mistakes:
      थाली: c1h12_kram
      गिलास: c1h12_kram
  - prompt: तवे से रोटी उतारने के लिए क्या काम आता है?
    options:
    - चिमटा
    - उँगलियाँ
    - पेंसिल
    answer: चिमटा
    difficulty: 2
    hints:
    - हाथ जलाए बिना पकड़ने वाली चीज़।
    - दो लंबी पत्तियों वाला औज़ार।
    solution: 'चरण 1: तवा गरम है। चरण 2: चिमटे से उतारते हैं।'
    mistakes:
      उँगलियाँ: c1h12_garam
      पेंसिल: c1h12_garam
  - prompt: चार लोग, हर एक दो रोटी खाए। कुल कितनी रोटियाँ?
    options:
    - आठ
    - छह
    - चार
    answer: आठ
    difficulty: 3
    hints:
    - हर व्यक्ति के लिए दो उँगलियाँ।
    - दो-दो करके चार बार गिनो।
    solution: 'चरण 1: 2, 4, 6, 8। चरण 2: आठ रोटियाँ।'
    mistakes:
      छह: c1h12_kram
      चार: c1h12_kram
  - prompt: '''रोटी'' का बहुवचन क्या है?'
    options:
    - रोटियाँ
    - रोटे
    - रोटा
    answer: रोटियाँ
    difficulty: 2
    hints:
    - एक रोटी, बहुत सारी ___।
    - 'ई वाले शब्द: नदी-नदियाँ।'
    solution: 'चरण 1: ई से खत्म होने वाला शब्द। चरण 2: रोटियाँ।'
    mistakes:
      रोटे: c1h12_shabd
      रोटा: c1h12_shabd
  - prompt: जो रोटी बनाते हैं, उन्हें खाने के बाद क्या कहें?
    options:
    - धन्यवाद
    - जल्दी करो
    - कुछ नहीं
    answer: धन्यवाद
    difficulty: 1
    hints:
    - किसी ने तुम्हारे लिए मेहनत की।
    - आभार का शब्द।
    solution: 'चरण 1: मेहनत की कद्र। चरण 2: धन्यवाद।'
    mistakes:
      जल्दी करो: c1h12_shabd
      कुछ नहीं: c1h12_shabd
  - prompt: आटा किस अनाज को पीसकर बनता है?
    options:
    - गेहूँ
    - आलू
    - सेब
    answer: गेहूँ
    difficulty: 2
    hints:
    - खेत में सुनहरी बालियों वाला अनाज।
    - आलू सब्ज़ी है, सेब फल।
    solution: 'चरण 1: अनाज पीसते हैं। चरण 2: गेहूँ का आटा।'
    mistakes:
      आलू: c1h12_kram
      सेब: c1h12_kram
  - prompt: '''गरम'' का उलटा क्या है?'
    options:
    - ठंडा
    - मीठा
    - भारी
    answer: ठंडा
    difficulty: 2
    hints:
    - बर्फ़ कैसी लगती है?
    - तापमान वाला जोड़ा।
    solution: 'चरण 1: गरम-? जोड़ा। चरण 2: ठंडा।'
    mistakes:
      मीठा: c1h12_shabd
      भारी: c1h12_shabd
  - prompt: 'स्थिति (केस): दादी तवे पर रोटी सेंक रही हैं। छोटा भाई तवे की ओर हाथ बढ़ा रहा है। सबसे अच्छा क्या करें?'
    options:
    - भाई का हाथ पकड़कर उसे तवे से दूर ले जाएँ
    - भाई को तवा छूने दें
    - तवे पर पानी डाल दें
    answer: भाई का हाथ पकड़कर उसे तवे से दूर ले जाएँ
    hints:
    - तवा कैसा होता है?
    - सोचो, गरम चीज़ से हाथ कैसे बचाएँ?
    solution: तवा बहुत गरम होता है, उसे छूने से हाथ जल सकता है। भाई को दूर ले जाना सुरक्षित है।
    mistakes:
      भाई को तवा छूने दें: c1h12_garam
      तवे पर पानी डाल दें: c1h12_garam
