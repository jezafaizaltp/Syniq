subject: cbse1-hin
chapter: 12
title: फूली रोटी
tips:
  h1_aata: "गेहूँ पीसकर जो सफ़ेद चूर्ण बनता है, उसी को गूँधते हैं।"
  h1_roti_aakar: "अपनी थाली की रोटी याद करो: उसका किनारा कैसा घूमता है?"
  h1_roti_kram: "गूँधा आटा अभी कच्चा है। बेलने से पहले आटे से छोटा गोला बनाते हैं: उसे क्या कहते हैं?"
  h1_tawa: "थाली में परोसते हैं, गिलास में पीते हैं। चूल्हे पर रखा गरम लोहे का गोल बर्तन कौन-सा है?"

concepts:
- code: cbse1h.12.phooli
  title: फूली रोटी
  notes: |
    'फूली रोटी' पाठ: रोटी बनाना, तवे पर रोटी का फूलना, आटा गूँधना, घर के काम। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: रोटी आटे से बनती है। आटा गूँधते हैं, लोई बनाते हैं, बेलते हैं और तवे पर सेंकते हैं। आग पर रोटी गुब्बारे जैसी फूल जाती है।
    visual: 'चित्र बनाओ: तवे पर फूली हुई गोल रोटी।'
    step_by_step: 1. पाठ पढ़ो। 2. रोटी किससे बनती है? 3. रोटी बनाने का क्रम बताओ। 4. रोटी क्यों फूलती है?
    real_world: घर में रोटी दाल-सब्ज़ी के साथ खाई जाती है।
  picture:
    kind: flow
    steps:
    - आटा गूँधो
    - लोई बनाओ
    - बेलो
    - तवे पर सेंको
    - फूली रोटी
    alt: आटा गूँधो, लोई बनाओ, बेलो, तवे पर सेंको और रोटी फूल जाती है।
  items:
  - prompt: रोटी किससे बनती है?
    options:
    - आटे से
    - चीनी से
    - पत्थर से
    answer: आटे से
    difficulty: 1
    hints:
    - गेहूँ पीसकर।
    - आ से।
    solution: रोटी आटे से बनती है।
    mistakes: {"चीनी से": "h1_aata", "पत्थर से": "h1_aata"}
  - prompt: रोटी किस पर सेंकते हैं?
    options:
    - तवे पर
    - थाली में
    - गिलास में
    answer: तवे पर
    difficulty: 1
    hints:
    - गरम लोहे का।
    - चूल्हे पर।
    solution: रोटी तवे पर सेंकते हैं।
    mistakes: {"थाली में": "h1_tawa", "गिलास में": "h1_tawa"}
  - prompt: रोटी कैसी होती है?
    options:
    - गोल
    - तिकोनी ही
    - लंबी डंडी जैसी
    answer: गोल
    difficulty: 1
    hints:
    - चाँद जैसी।
    - बेलने से।
    solution: रोटी गोल होती है।
    mistakes: {"तिकोनी ही": "h1_roti_aakar", "लंबी डंडी जैसी": "h1_roti_aakar"}
  - prompt: आटा गूँधने के बाद क्या करते हैं?
    options:
    - लोई बनाते हैं
    - रोटी खा लेते हैं
    - तवा धोते हैं
    answer: लोई बनाते हैं
    difficulty: 2
    hints:
    - छोटी गोलियाँ।
    - फिर बेलते हैं।
    solution: आटा गूँधने के बाद लोई बनाते हैं।
    mistakes: {"रोटी खा लेते हैं": "h1_roti_kram", "तवा धोते हैं": "h1_roti_kram"}
  - prompt: '''फूली'' का अर्थ है:'
    options:
    - हवा भरकर बड़ी हुई
    - टूटी हुई
    - जली हुई
    answer: हवा भरकर बड़ी हुई
    difficulty: 2
    hints:
    - गुब्बारे जैसी।
    - फूलना।
    solution: फूली यानी हवा भरकर बड़ी हुई।
    mistakes:
      टूटी हुई: hin1_word
  - prompt: 'गरम तवे के पास हमें:'
    options:
    - ध्यान रखना चाहिए
    - हाथ लगाना चाहिए
    - दौड़ना चाहिए
    answer: ध्यान रखना चाहिए
    difficulty: 1
    hints:
    - जल सकते हैं।
    - सावधान।
    solution: गरम तवे के पास ध्यान रखना चाहिए।
    mistakes: {"हाथ लगाना चाहिए": "h1_suraksha", "दौड़ना चाहिए": "h1_suraksha"}
