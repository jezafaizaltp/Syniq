subject: cbse1-hin
chapter: 2
title: दादा-दादी
tips:
  h1_aadar: "बड़ों से बात करते समय सोचो: उन्हें कैसा लगेगा? मीठी, नरम बात सबको अच्छी लगती है।"
  h1_chashma: "सोचो, बिना चश्मे के दादी को पढ़ने में कितनी मुश्किल होगी। तुम उनके लिए क्या कर सकते हो?"
  h1_kahani: "सोचो, सोने से पहले दादी-नानी के पास बैठकर तुम क्या सुनना पसंद करते हो।"

concepts:
- code: cbse1h.02.dada
  title: दादा-दादी
  notes: |
    दादा-दादी पर पाठ/कविता: उनका प्यार, कहानियाँ, उनके साथ समय बिताना, बड़ों का आदर। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: दादा-दादी हमसे बहुत प्यार करते हैं। वे हमें कहानियाँ सुनाते हैं और अच्छी बातें सिखाते हैं। हमें उनका आदर करना चाहिए।
    visual: 'चित्र बनाओ: दादा-दादी के बीच बैठा बच्चा कहानी सुन रहा है।'
    step_by_step: 1. पाठ पढ़ो। 2. दादा-दादी क्या करते हैं? 3. हम उनके लिए क्या कर सकते हैं? 4. अपने दादा-दादी के बारे में बताओ।
    real_world: दादी चश्मा ढूँढें तो हम उन्हें ढूँढकर दे सकते हैं।
  picture:
    kind: compare
    columns:
    - title: दादा-दादी
      points:
      - कहानी सुनाते
      - प्यार करते
    - title: हम
      points:
      - आदर करते
      - मदद करते
    alt: दादा-दादी कहानी सुनाते और प्यार करते हैं; हम उनका आदर और मदद करते हैं।
  activity:
    type: sort
    prompt: दादा-दादी के साथ कौन-सी बात अच्छी है?
    bins:
    - अच्छी बात
    - अच्छी नहीं
    items:
    - label: 📖 कहानी सुनना
      bin: अच्छी बात
      clue: दादी कहानी सुनाएँ तो?
      why: साथ समय बिताना अच्छा।
    - label: 🙏 नमस्ते करना
      bin: अच्छी बात
      clue: बड़ों से कैसे मिलें?
      why: बड़ों का आदर।
    - label: 🤝 उनकी मदद करना
      bin: अच्छी बात
      clue: दादा को चश्मा देना?
      why: मदद अच्छी बात।
    - label: 😠 उन पर चिल्लाना
      bin: अच्छी नहीं
      clue: क्या यह आदर है?
      why: बड़ों से प्यार से बोलें।
  items:
  - prompt: दादा-दादी हमें क्या सुनाते हैं?
    options:
    - कहानियाँ
    - शोर
    - हॉर्न
    answer: कहानियाँ
    difficulty: 1
    hints:
    - रात को।
    - राजा-रानी की।
    solution: दादा-दादी कहानियाँ सुनाते हैं।
    mistakes: {"शोर": "h1_kahani", "हॉर्न": "h1_kahani"}
  - prompt: बड़ों के साथ हमें कैसे रहना चाहिए?
    options:
    - आदर से
    - गुस्से से
    - चिढ़कर
    answer: आदर से
    difficulty: 1
    hints:
    - सम्मान।
    - प्यार से।
    solution: बड़ों का आदर करना चाहिए।
    mistakes: {"गुस्से से": "h1_aadar", "चिढ़कर": "h1_aadar"}
  - prompt: दादा किसके पिता हैं?
    options:
    - पिता के
    - दोस्त के
    - मामा के
    answer: पिता के
    difficulty: 2
    hints:
    - पापा के पापा।
    - पिता की ओर।
    solution: दादा पिता के पिता हैं।
    mistakes: {"दोस्त के": "h1_rishta", "मामा के": "h1_rishta"}
  - prompt: 'दादी का चश्मा खो जाए तो हम:'
    options:
    - ढूँढने में मदद करें
    - हँसें
    - छिपा दें
    answer: ढूँढने में मदद करें
    difficulty: 1
    hints:
    - मदद करो।
    - प्यार से।
    solution: हम ढूँढने में मदद करें।
    mistakes: {"हँसें": "h1_chashma", "छिपा दें": "h1_chashma"}
  - prompt: '''दादा'' शब्द में कौन-सा अक्षर दो बार आया है?'
    options:
    - द
    - म
    - न
    answer: द
    difficulty: 2
    hints:
    - दा + दा।
    - पहली आवाज़।
    solution: दादा में 'द' दो बार आया है।
    mistakes:
      म: hin1_sound
  - prompt: माँ के पिता को क्या कहते हैं?
    options:
    - नाना
    - दादा
    - चाचा
    answer: नाना
    difficulty: 2
    hints:
    - माँ की ओर से।
    - न से शुरू।
    solution: माँ के पिता नाना होते हैं।
    mistakes: {"दादा": "h1_rishta", "चाचा": "h1_rishta"}
