subject: cbse1-hin
chapter: 2
title: दादा-दादी
tips:
  h1_aadar: "बड़ों से बात करते समय सोचो: उन्हें कैसा लगेगा? मीठी, नरम बात सबको अच्छी लगती है।"
  h1_chashma: "सोचो, बिना चश्मे के दादी को पढ़ने में कितनी मुश्किल होगी। तुम उनके लिए क्या कर सकते हो?"
  h1_kahani: "सोचो, सोने से पहले दादी-नानी के पास बैठकर तुम क्या सुनना पसंद करते हो।"
  c1h2_aadar: सोचो, बड़ों को कौन-सा तरीका अच्छा लगेगा?
  c1h2_rishta: 'परिवार का पेड़ सोचो: कौन किसका माता-पिता है?'
  c1h2_akshar: शब्द को धीरे से बोलो और हर अक्षर पर ताली बजाओ।

concepts:
- code: cbse1h.02.dada
  title: दादा-दादी
  notes: |
    दादा-दादी पर पाठ/कविता: उनका प्यार, कहानियाँ, उनके साथ समय बिताना, बड़ों का आदर। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: दादा-दादी हमसे बहुत प्यार करते हैं। वे हमें कहानियाँ सुनाते हैं और अच्छी बातें सिखाते हैं। हमें उनका आदर करना चाहिए।
    visual: 'चित्र बनाओ: दादा-दादी के बीच बैठा बच्चा कहानी सुन रहा है।'
    step_by_step: 1. पाठ पढ़ो। 2. दादा-दादी क्या करते हैं? 3. हम उनके लिए क्या कर सकते हैं? 4. अपने दादा-दादी के बारे में बताओ।
    real_world: दादी चश्मा ढूँढें तो हम उन्हें ढूँढकर दे सकते हैं।
  picture:
    kind: compare
    columns:
    - title: दादा-दादी
      points:
      - कहानी सुनाते
      - प्यार करते
    - title: हम
      points:
      - आदर करते
      - मदद करते
    alt: दादा-दादी कहानी सुनाते और प्यार करते हैं; हम उनका आदर और मदद करते हैं।
  activity:
    type: sort
    prompt: दादा-दादी के साथ कौन-सी बात अच्छी है?
    bins:
    - अच्छी बात
    - अच्छी नहीं
    items:
    - label: 📖 कहानी सुनना
      bin: अच्छी बात
      clue: दादी कहानी सुनाएँ तो?
      why: साथ समय बिताना अच्छा।
    - label: 🙏 नमस्ते करना
      bin: अच्छी बात
      clue: बड़ों से कैसे मिलें?
      why: बड़ों का आदर।
    - label: 🤝 उनकी मदद करना
      bin: अच्छी बात
      clue: दादा को चश्मा देना?
      why: मदद अच्छी बात।
    - label: 😠 उन पर चिल्लाना
      bin: अच्छी नहीं
      clue: क्या यह आदर है?
      why: बड़ों से प्यार से बोलें।
  lesson:
    - teach: दादा-दादी हमसे बहुत प्यार करते हैं। वे कहानियाँ सुनाते हैं, गीत गाते हैं और पुरानी बातें बताते हैं।
      check:
        prompt: दादी रात को सोने से पहले क्या सुनाती हैं?
        options:
        - कहानी
        - हॉर्न
        - घंटी
        answer: कहानी
        why: दादी-नानी की कहानियाँ मशहूर हैं।
      ways:
      - style: visual
        teach: दादा-दादी हमारे साथ क्या-क्या करते हैं, कुछ बातें।
        picture:
          kind: compare
          columns:
          - title: दादा जी
            points:
            - सुबह सैर पर ले जाते हैं
            - पौधों के बारे में बताते हैं
          - title: दादी जी
            points:
            - लोरी गाती हैं
            - पुराने खेल सिखाती हैं
          alt: दादा जी सैर पर ले जाते हैं और पौधों के बारे में बताते हैं। दादी जी लोरी गाती हैं और पुराने खेल सिखाती हैं।
      - style: real_world
        teach: कई घरों में शाम को बच्चे दादा-दादी के पास बैठते हैं और उनसे उनके बचपन की बातें सुनते हैं।
    - teach: हम बड़ों का आदर करते हैं। उन्हें 'आप' और 'जी' कहते हैं, उनकी बात ध्यान से सुनते हैं और उनकी मदद करते हैं।
      check:
        prompt: 'दादा जी से बात करते समय हम कहते हैं:'
        options:
        - आप
        - तू
        - ए
        answer: आप
        why: '''आप'' कहना आदर है।'
      ways:
      - style: step_by_step
        teach: 'बड़ों से आदर से बात करो। पहला: हाथ जोड़कर नमस्ते करो। दूसरा: उन्हें ''आप'' कहो। तीसरा: नाम के साथ ''जी'' लगाओ। चौथा: वे बोलें तो बीच में मत टोको।'
      - style: visual
        teach: बड़ों से कैसे बोलें और कैसे न बोलें, आमने-सामने रखकर देखो।
        picture:
          kind: compare
          columns:
          - title: ऐसे बोलें
            points:
            - आप कैसे हैं, नाना जी?
            - जी, अभी आता हूँ।
          - title: ऐसे नहीं
            points:
            - तुम कैसे हो?
            - क्या है?
          alt: '''आप कैसे हैं, नाना जी?'' और ''जी, अभी आता हूँ'' आदर से बोलना है। ''तुम कैसे हो?'' और ''क्या है?'' बड़ों से ऐसे नहीं बोलते।'
    - teach: '''दादा'' में द दो बार आता है: दा + दा। ''दादी'' में दा + दी। ''नाना'' में ना + ना।'
      check:
        prompt: '''नाना'' में कौन-सा अक्षर दो बार है?'
        options:
        - न
        - म
        - द
        answer: न
        why: ना + ना।
      ways:
      - style: visual
        teach: कुछ रिश्तों के शब्दों में एक ही अक्षर दो बार आता है, कुछ में नहीं।
        picture:
          kind: compare
          columns:
          - title: एक अक्षर दो बार
            points:
            - मामा (मा + मा)
            - काका (का + का)
            - चाचा (चा + चा)
          - title: अलग-अलग अक्षर
            points:
            - चाची (चा + ची)
            - बुआ (बु + आ)
          alt: मामा, काका और चाचा में एक ही अक्षर दो बार आता है। चाची और बुआ में अक्षर अलग-अलग हैं।
      - style: step_by_step
        teach: 'अक्षर पहचानो। पहला: शब्द ''चाचा'' लो। दूसरा: धीरे बोलो: चा... चा। तीसरा: दोनों हिस्सों को सुनो। चौथा: दोनों में ''च'' की आवाज़ है।'
  items:
  - prompt: दादा-दादी हमें क्या सुनाते हैं?
    options:
    - कहानियाँ
    - शोर
    - हॉर्न
    answer: कहानियाँ
    difficulty: 1
    hints:
    - रात को।
    - राजा-रानी की।
    solution: दादा-दादी कहानियाँ सुनाते हैं।
    mistakes: {"शोर": "h1_kahani", "हॉर्न": "h1_kahani"}
  - prompt: बड़ों के साथ हमें कैसे रहना चाहिए?
    options:
    - आदर से
    - गुस्से से
    - चिढ़कर
    answer: आदर से
    difficulty: 1
    hints:
    - सम्मान।
    - प्यार से।
    solution: बड़ों का आदर करना चाहिए।
    mistakes: {"गुस्से से": "h1_aadar", "चिढ़कर": "h1_aadar"}
  - prompt: दादा किसके पिता हैं?
    options:
    - पिता के
    - दोस्त के
    - मामा के
    answer: पिता के
    difficulty: 2
    hints:
    - पापा के पापा।
    - पिता की ओर।
    solution: दादा पिता के पिता हैं।
    mistakes: {"दोस्त के": "h1_rishta", "मामा के": "h1_rishta"}
  - prompt: 'दादी का चश्मा खो जाए तो हम:'
    options:
    - ढूँढने में मदद करें
    - हँसें
    - छिपा दें
    answer: ढूँढने में मदद करें
    difficulty: 1
    hints:
    - मदद करो।
    - प्यार से।
    solution: हम ढूँढने में मदद करें।
    mistakes: {"हँसें": "h1_chashma", "छिपा दें": "h1_chashma"}
  - prompt: '''दादा'' शब्द में कौन-सा अक्षर दो बार आया है?'
    options:
    - द
    - म
    - न
    answer: द
    difficulty: 2
    hints:
    - दा + दा।
    - पहली आवाज़।
    solution: दादा में 'द' दो बार आया है।
    mistakes:
      म: hin1_sound
  - prompt: माँ के पिता को क्या कहते हैं?
    options:
    - नाना
    - दादा
    - चाचा
    answer: नाना
    difficulty: 2
    hints:
    - माँ की ओर से।
    - न से शुरू।
    solution: माँ के पिता नाना होते हैं।
    mistakes: {"दादा": "h1_rishta", "चाचा": "h1_rishta"}
  - prompt: दादी किसकी माँ हैं?
    options:
    - पिता की
    - माँ की
    - बहन की
    answer: पिता की
    difficulty: 1
    hints:
    - परिवार का पेड़ सोचो: दादी के बेटे कौन हैं?
    - माँ की माँ नानी हैं।
    solution: 'चरण 1: दादी पिता की ओर की हैं। चरण 2: वे पिता की माँ हैं।'
    mistakes:
      माँ की: c1h2_rishta
      बहन की: c1h2_rishta
  - prompt: दादा जी को सीढ़ी चढ़ने में मुश्किल है। हम क्या करें?
    options:
    - हाथ पकड़कर मदद करें
    - आगे भाग जाएँ
    - हँसें
    answer: हाथ पकड़कर मदद करें
    difficulty: 1
    hints:
    - बड़ों की मदद करते हैं।
    - धीरे-धीरे साथ चलो।
    solution: 'चरण 1: दादा जी को सहारा चाहिए। चरण 2: हाथ पकड़कर मदद करो।'
    mistakes:
      आगे भाग जाएँ: c1h2_aadar
      हँसें: c1h2_aadar
  - prompt: '''दादी'' में कितने अक्षर हैं?'
    options:
    - दो
    - एक
    - तीन
    answer: दो
    difficulty: 1
    hints:
    - दा ... फिर?
    - हर अक्षर पर ताली।
    solution: 'चरण 1: दा + दी। चरण 2: दो अक्षर।'
    mistakes:
      एक: c1h2_akshar
      तीन: c1h2_akshar
  - prompt: नानी किसकी माँ हैं?
    options:
    - माँ की
    - पिता की
    - चाचा की
    answer: माँ की
    difficulty: 1
    hints:
    - परिवार का पेड़ सोचो: नानी की बेटी कौन हैं?
    - दादी पिता की माँ हैं।
    solution: 'चरण 1: नानी माँ की ओर की हैं। चरण 2: वे माँ की माँ हैं।'
    mistakes:
      पिता की: c1h2_rishta
      चाचा की: c1h2_rishta
  - prompt: दादा जी बुलाएँ तो हम क्या कहें?
    options:
    - जी, दादा जी
    - क्या है?
    - बाद में
    answer: जी, दादा जी
    difficulty: 1
    hints:
    - आदर का शब्द लगाओ।
    - '''जी'' कहाँ है?'
    solution: 'चरण 1: बड़ों को ''जी'' कहते हैं। चरण 2: ''जी, दादा जी''।'
    mistakes:
      क्या है?: c1h2_aadar
      बाद में: c1h2_aadar
  - prompt: दादी के साथ खेलने का अच्छा खेल कौन-सा है?
    options:
    - बैठकर लूडो या कहानी
    - बहुत तेज़ दौड़
    - पेड़ पर चढ़ना
    answer: बैठकर लूडो या कहानी
    difficulty: 2
    hints:
    - दादी जल्दी थक सकती हैं।
    - बैठकर मज़ा।
    solution: 'चरण 1: तेज़ खेल दादी के लिए कठिन हैं। चरण 2: बैठकर खेल अच्छा है।'
    mistakes:
      बहुत तेज़ दौड़: c1h2_aadar
      पेड़ पर चढ़ना: c1h2_aadar
  - prompt: '''दादा'' का जोड़ी वाला शब्द कौन-सा है?'
    options:
    - दादी
    - नाना
    - भाई
    answer: दादी
    difficulty: 2
    hints:
    - दादा-___।
    - दादा के साथ रहने वाली।
    solution: 'चरण 1: दादा और दादी जोड़ी हैं। चरण 2: दादी।'
    mistakes:
      नाना: c1h2_rishta
      भाई: c1h2_rishta
  - prompt: दादा-दादी के पास बहुत-सी कहानियाँ क्यों होती हैं?
    options:
    - उन्होंने बहुत कुछ देखा और सुना है
    - वे रोज़ टीवी देखते हैं
    - वे स्कूल में पढ़ाते हैं
    answer: उन्होंने बहुत कुछ देखा और सुना है
    difficulty: 2
    hints:
    - वे बहुत साल से जी रहे हैं।
    - लंबा जीवन, बहुत अनुभव।
    solution: 'चरण 1: दादा-दादी ने लंबा जीवन जिया है। चरण 2: इसलिए उनके पास बहुत-सी कहानियाँ हैं।'
    mistakes:
      वे रोज़ टीवी देखते हैं: c1h2_aadar
      वे स्कूल में पढ़ाते हैं: c1h2_aadar
  - prompt: 'दादा, दादी, नाना, नानी: कितने बड़े?'
    options:
    - चार
    - दो
    - तीन
    answer: चार
    difficulty: 3
    hints:
    - हर नाम को एक बार गिनो।
    - दो जोड़ियाँ।
    solution: 'चरण 1: दादा 1, दादी 2, नाना 3, नानी 4। चरण 2: चार।'
    mistakes:
      दो: c1h2_rishta
      तीन: c1h2_rishta
  - prompt: 'स्थिति (केस): दादी जी कहानी सुना रही हैं, पर बीच में टीना के दोस्त ने ज़ोर से बोलना शुरू कर दिया। टीना क्या करे?'
    options:
    - धीरे से दोस्त को चुप होकर सुनने को कहे
    - खुद भी ज़ोर से बोलने लगे
    - उठकर बाहर जाए
    answer: धीरे से दोस्त को चुप होकर सुनने को कहे
    hints:
    - दादी जी क्या कर रही हैं?
    - बड़ों की बात कैसे सुनते हैं?
    solution: बड़ों की बात ध्यान से सुनना आदर है। इसलिए टीना धीरे से दोस्त को चुप होकर सुनने को कहे।
    mistakes:
      खुद भी ज़ोर से बोलने लगे: c1h2_aadar
      उठकर बाहर जाए: c1h2_aadar
    exam: case
    difficulty: 2
  - prompt: 'परिस्थिति: अमन के पिता के पिता गाँव से आए हैं। अमन उन्हें क्या कहे?'
    options:
    - दादा जी
    - नाना जी
    - मामा जी
    answer: दादा जी
    hints:
    - वे पिता की तरफ़ से हैं।
    - पिता के पिता को क्या कहते हैं?
    solution: पिता के पिता को दादा कहते हैं, इसलिए अमन उन्हें 'दादा जी' कहेगा।
    mistakes:
      नाना जी: c1h2_rishta
      मामा जी: c1h2_rishta
    exam: competency
    difficulty: 2
