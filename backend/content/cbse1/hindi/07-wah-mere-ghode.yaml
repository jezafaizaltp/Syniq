subject: cbse1-hin
chapter: 7
title: वाह, मेरे घोड़े!
tips:
  h1_awaaz: "हर जानवर और चीज़ की अपनी आवाज़ होती है। उसे मन में सुनो और मिलाओ।"
  h1_ghoda: "राजा और सिपाही घोड़े की पीठ पर क्या करते थे?"
  h1_pair: "चित्र में घोड़े को देखो और आगे-पीछे के पैर अलग-अलग गिनो।"

concepts:
- code: cbse1h.07.wah
  title: वाह, मेरे घोड़े!
  notes: |
    'वाह, मेरे घोड़े!' कविता: घोड़े की सवारी (खिलौना या कल्पना का घोड़ा), टप-टप चलना, खुशी। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: इस कविता में एक बच्चा अपने घोड़े की सवारी करता है। घोड़ा टप-टप दौड़ता है और बच्चा खुश होकर कहता है 'वाह, मेरे घोड़े!'
    visual: 'चित्र बनाओ: एक बच्चा लकड़ी के घोड़े पर बैठा है, पास में लिखा ''टप-टप''।'
    step_by_step: 1. कविता लय से बोलो। 2. घोड़ा कैसे चलता है? 3. बच्चा क्या कहता है? 4. तुकांत शब्द खोजो।
    real_world: मेलों में बच्चे झूले वाले घोड़ों पर सवारी करते हैं।
  picture:
    kind: compare
    columns:
    - title: जानवर
      points:
      - घोड़ा
      - गाय
      - कुत्ता
    - title: आवाज़
      points:
      - हिनहिन
      - बाँ
      - भौं-भौं
    alt: घोड़ा हिनहिनाता है, गाय बाँ करती है और कुत्ता भौं-भौं करता है।
  activity:
    type: sort
    prompt: घोड़े के बारे में कौन-सी बात सही है?
    bins:
    - सही
    - सही नहीं
    items:
    - label: 🐎 टप-टप चलता है
      bin: सही
      clue: घोड़े के खुर की आवाज़?
      why: घोड़ा टप-टप चलता है।
    - label: 🏇 सवारी करते हैं
      bin: सही
      clue: घोड़े पर बैठ सकते हैं?
      why: घोड़े की सवारी।
    - label: 🌾 घास खाता है
      bin: सही
      clue: घोड़ा क्या खाता है?
      why: घोड़ा घास खाता है।
    - label: 🐟 पानी में रहता है
      bin: सही नहीं
      clue: घोड़ा कहाँ रहता है?
      why: घोड़ा ज़मीन पर रहता है।
  items:
  - prompt: घोड़ा दौड़ते समय कैसी आवाज़ करता है?
    options:
    - टप-टप
    - छम-छम
    - टर्र-टर्र
    answer: टप-टप
    difficulty: 1
    hints:
    - पैरों की आवाज़।
    - ट से।
    solution: घोड़ा टप-टप दौड़ता है।
    mistakes: {"छम-छम": "h1_awaaz", "टर्र-टर्र": "h1_awaaz"}
  - prompt: '''वाह'' शब्द हम कब बोलते हैं?'
    options:
    - जब खुशी हो
    - जब दुख हो
    - जब नींद आए
    answer: जब खुशी हो
    difficulty: 2
    hints:
    - शाबाश जैसा।
    - अच्छा लगने पर।
    solution: खुशी होने पर 'वाह' बोलते हैं।
    mistakes:
      जब दुख हो: hin1_word
  - prompt: घोड़े के कितने पैर होते हैं?
    options:
    - चार
    - दो
    - छह
    answer: चार
    difficulty: 1
    hints:
    - गाय जितने।
    - गिनो।
    solution: घोड़े के चार पैर होते हैं।
    mistakes: {"दो": "h1_pair", "छह": "h1_pair"}
  - prompt: घोड़े पर हम क्या करते हैं?
    options:
    - सवारी
    - तैराकी
    - पढ़ाई
    answer: सवारी
    difficulty: 1
    hints:
    - उस पर बैठते हैं।
    - चलाते हैं।
    solution: घोड़े पर सवारी करते हैं।
    mistakes: {"तैराकी": "h1_ghoda", "पढ़ाई": "h1_ghoda"}
  - prompt: कविता में किसका घोड़ा है?
    options:
    - मेरा
    - राजा का
    - दादी का
    answer: मेरा
    difficulty: 2
    hints:
    - कविता का नाम देखो।
    - '''मेरे घोड़े''।'
    solution: कविता में 'मेरा' घोड़ा है।
    mistakes:
      राजा का: hin1_read_again
  - prompt: '''घोड़ा'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - घ
    - ग
    - ड
    answer: घ
    difficulty: 2
    hints:
    - पहली आवाज़।
    - घड़ी वाला।
    solution: घोड़ा 'घ' से शुरू होता है।
    mistakes:
      ग: hin1_sound
