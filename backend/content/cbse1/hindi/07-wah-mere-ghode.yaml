# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 7. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 7
title: वाह, मेरे घोड़े!
tips:
  h1_awaaz: "हर जानवर और चीज़ की अपनी आवाज़ होती है। उसे मन में सुनो और मिलाओ।"
  h1_ghoda: "राजा और सिपाही घोड़े की पीठ पर क्या करते थे?"
  h1_pair: "चित्र में घोड़े को देखो और आगे-पीछे के पैर अलग-अलग गिनो।"
  c1h7_ghoda: 'घोड़े को मन में देखो: उसके पैर, पूँछ, और वह कैसे दौड़ता है।'
  c1h7_awaaz: उस जानवर की आवाज़ मन में सुनो।
  c1h7_akshar: शब्द को धीरे से बोलो और पहली आवाज़ सुनो।

concepts:
- code: cbse1h.07.wah
  title: वाह, मेरे घोड़े!
  notes: |
    'वाह, मेरे घोड़े!' कविता: घोड़े की सवारी (खिलौना या कल्पना का घोड़ा), टप-टप चलना, खुशी। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: इस कविता में एक बच्चा अपने घोड़े की सवारी करता है। घोड़ा टप-टप दौड़ता है और बच्चा खुश होकर कहता है 'वाह, मेरे घोड़े!'
    visual: 'चित्र बनाओ: एक बच्चा लकड़ी के घोड़े पर बैठा है, पास में लिखा ''टप-टप''।'
    step_by_step: 1. कविता लय से बोलो। 2. घोड़ा कैसे चलता है? 3. बच्चा क्या कहता है? 4. तुकांत शब्द खोजो।
    real_world: मेलों में बच्चे झूले वाले घोड़ों पर सवारी करते हैं।
  picture:
    kind: compare
    columns:
    - title: जानवर
      points:
      - घोड़ा
      - गाय
      - कुत्ता
    - title: आवाज़
      points:
      - हिनहिन
      - बाँ
      - भौं-भौं
    alt: घोड़ा हिनहिनाता है, गाय बाँ करती है और कुत्ता भौं-भौं करता है।
  activity:
    type: sort
    prompt: घोड़े के बारे में कौन-सी बात सही है?
    bins:
    - सही
    - सही नहीं
    items:
    - label: 🐎 टप-टप चलता है
      bin: सही
      clue: घोड़े के खुर की आवाज़?
      why: घोड़ा टप-टप चलता है।
    - label: 🏇 सवारी करते हैं
      bin: सही
      clue: घोड़े पर बैठ सकते हैं?
      why: घोड़े की सवारी।
    - label: 🌾 घास खाता है
      bin: सही
      clue: घोड़ा क्या खाता है?
      why: घोड़ा घास खाता है।
    - label: 🐟 पानी में रहता है
      bin: सही नहीं
      clue: घोड़ा कहाँ रहता है?
      why: घोड़ा ज़मीन पर रहता है।
  lesson:
    - teach: '''वाह, मेरे घोड़े!'' कविता में बच्चा घोड़े की सवारी करता है। घोड़ा टप-टप दौड़ता है। ''वाह'' खुशी में बोलते हैं।'
      check:
        prompt: घोड़ा दौड़े तो पैरों की आवाज़ कैसी?
        options:
        - टप-टप
        - म्याऊँ
        - कुहू
        answer: टप-टप
        why: घोड़े के खुर ज़मीन पर टप-टप करते हैं।
    - teach: घोड़े के चार पैर, लंबी पूँछ और गर्दन पर बाल (अयाल) होते हैं। घोड़ा तेज़ दौड़ता है और घास-चना खाता है। घोड़ा हिनहिनाता है।
      check:
        prompt: घोड़ा क्या खाता है?
        options:
        - घास और चना
        - मछली
        - पत्थर
        answer: घास और चना
        why: घोड़ा पौधे और अनाज खाता है।
    - teach: 'जानवरों की आवाज़ें: घोड़ा हिनहिनाता है, गाय रँभाती है, कुत्ता भौंकता है, बिल्ली म्याऊँ करती है।'
      picture:
        kind: compare
        columns:
        - title: जानवर
          points:
          - घोड़ा
          - कुत्ता
          - बिल्ली
        - title: आवाज़
          points:
          - हिनहिनाना
          - भौं-भौं
          - म्याऊँ
        alt: जानवर और उनकी आवाज़ें।
      check:
        prompt: कुत्ता कैसी आवाज़ करता है?
        options:
        - भौं-भौं
        - म्याऊँ
        - टप-टप
        answer: भौं-भौं
        why: कुत्ता भौंकता है।
  items:
  - prompt: घोड़ा दौड़ते समय कैसी आवाज़ करता है?
    options:
    - टप-टप
    - छम-छम
    - टर्र-टर्र
    answer: टप-टप
    difficulty: 1
    hints:
    - पैरों की आवाज़।
    - ट से।
    solution: घोड़ा टप-टप दौड़ता है।
    mistakes: {"छम-छम": "h1_awaaz", "टर्र-टर्र": "h1_awaaz"}
  - prompt: '''वाह'' शब्द हम कब बोलते हैं?'
    options:
    - जब खुशी हो
    - जब दुख हो
    - जब नींद आए
    answer: जब खुशी हो
    difficulty: 2
    hints:
    - शाबाश जैसा।
    - अच्छा लगने पर।
    solution: खुशी होने पर 'वाह' बोलते हैं।
    mistakes:
      जब दुख हो: hin1_word
  - prompt: घोड़े के कितने पैर होते हैं?
    options:
    - चार
    - दो
    - छह
    answer: चार
    difficulty: 1
    hints:
    - गाय जितने।
    - गिनो।
    solution: घोड़े के चार पैर होते हैं।
    mistakes: {"दो": "h1_pair", "छह": "h1_pair"}
  - prompt: घोड़े पर हम क्या करते हैं?
    options:
    - सवारी
    - तैराकी
    - पढ़ाई
    answer: सवारी
    difficulty: 1
    hints:
    - उस पर बैठते हैं।
    - चलाते हैं।
    solution: घोड़े पर सवारी करते हैं।
    mistakes: {"तैराकी": "h1_ghoda", "पढ़ाई": "h1_ghoda"}
  - prompt: कविता में किसका घोड़ा है?
    options:
    - मेरा
    - राजा का
    - दादी का
    answer: मेरा
    difficulty: 2
    hints:
    - कविता का नाम देखो।
    - '''मेरे घोड़े''।'
    solution: कविता में 'मेरा' घोड़ा है।
    mistakes:
      राजा का: hin1_read_again
  - prompt: '''घोड़ा'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - घ
    - ग
    - ड
    answer: घ
    difficulty: 2
    hints:
    - पहली आवाज़।
    - घड़ी वाला।
    solution: घोड़ा 'घ' से शुरू होता है।
    mistakes:
      ग: hin1_sound
  - prompt: घोड़ा किस आवाज़ में बोलता है?
    options:
    - हिनहिनाता है
    - म्याऊँ करता है
    - कुहू करता है
    answer: हिनहिनाता है
    difficulty: 1
    hints:
    - घोड़े की खास आवाज़।
    - म्याऊँ बिल्ली करती है।
    solution: 'चरण 1: हर जानवर की अपनी आवाज़। चरण 2: घोड़ा हिनहिनाता है।'
    mistakes:
      म्याऊँ करता है: c1h7_awaaz
      कुहू करता है: c1h7_awaaz
  - prompt: दो घोड़ों के कुल कितने पैर?
    options:
    - आठ
    - चार
    - छह
    answer: आठ
    difficulty: 2
    hints:
    - एक घोड़े के चार पैर।
    - चार और चार।
    solution: 'चरण 1: 4 + 4। चरण 2: आठ पैर।'
    mistakes:
      चार: c1h7_ghoda
      छह: c1h7_ghoda
  - prompt: '''वाह!'' हम कब कहते हैं?'
    options:
    - कुछ अच्छा देखकर खुश होने पर
    - रोते समय
    - सोते समय
    answer: कुछ अच्छा देखकर खुश होने पर
    difficulty: 1
    hints:
    - यह खुशी का शब्द है।
    - कोई सुंदर चीज़ देखी!
    solution: 'चरण 1: ''वाह'' तारीफ़ और खुशी का शब्द है। चरण 2: अच्छा देखकर कहते हैं।'
    mistakes:
      रोते समय: c1h7_ghoda
      सोते समय: c1h7_ghoda
  - prompt: घोड़े की गर्दन पर लंबे बालों को क्या कहते हैं?
    options:
    - अयाल
    - पूँछ
    - सींग
    answer: अयाल
    difficulty: 2
    hints:
    - यह पूँछ नहीं है, आगे की ओर है।
    - शेर की गर्दन पर भी होता है।
    solution: 'चरण 1: गर्दन के बाल। चरण 2: अयाल।'
    mistakes:
      पूँछ: c1h7_ghoda
      सींग: c1h7_ghoda
  - prompt: '''घर'' किस अक्षर से शुरू होता है?'
    options:
    - घ
    - र
    - ग
    answer: घ
    difficulty: 1
    hints:
    - 'धीरे से बोलो: घ...'
    - '''घोड़ा'' भी इसी से।'
    solution: 'चरण 1: घ-र। चरण 2: पहला अक्षर घ।'
    mistakes:
      र: c1h7_akshar
      ग: c1h7_akshar
  - prompt: बिल्ली कैसी आवाज़ करती है?
    options:
    - म्याऊँ
    - भौं-भौं
    - हिनहिन
    answer: म्याऊँ
    difficulty: 1
    hints:
    - छोटा पालतू जानवर, दूध पीता है।
    - कुत्ता भौंकता है।
    solution: 'चरण 1: बिल्ली की आवाज़। चरण 2: म्याऊँ।'
    mistakes:
      भौं-भौं: c1h7_awaaz
      हिनहिन: c1h7_awaaz
  - prompt: खिलौने वाले घोड़े पर बैठना क्या कहलाता है?
    options:
    - सवारी
    - पढ़ाई
    - सफ़ाई
    answer: सवारी
    difficulty: 2
    hints:
    - घोड़े पर बैठकर चलना।
    - बस में बैठना भी यही है।
    solution: 'चरण 1: किसी पर बैठकर चलना। चरण 2: सवारी।'
    mistakes:
      पढ़ाई: c1h7_ghoda
      सफ़ाई: c1h7_ghoda
  - prompt: कौन-सा जानवर सबसे तेज़ दौड़ता है?
    options:
    - घोड़ा
    - कछुआ
    - घोंघा
    answer: घोड़ा
    difficulty: 2
    hints:
    - कछुआ और घोंघा बहुत धीमे हैं।
    - रेस में दौड़ने वाला।
    solution: 'चरण 1: कछुआ-घोंघा धीमे। चरण 2: घोड़ा तेज़।'
    mistakes:
      कछुआ: c1h7_ghoda
      घोंघा: c1h7_ghoda
  - prompt: '''घोड़ा'' और ''घड़ी'' दोनों किस अक्षर से शुरू होते हैं?'
    options:
    - घ
    - ड़
    - ग
    answer: घ
    difficulty: 3
    hints:
    - दोनों को धीरे-धीरे बोलो।
    - पहली आवाज़ एक जैसी।
    solution: 'चरण 1: घो-ड़ा, घ-ड़ी। चरण 2: दोनों घ से।'
    mistakes:
      ड़: c1h7_akshar
      ग: c1h7_akshar
