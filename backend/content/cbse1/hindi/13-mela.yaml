subject: cbse1-hin
chapter: 13
title: मेला
tips:
  h1_gubbara: "गुब्बारे को मुँह से फुलाते हैं। मुँह से फूँकने पर अंदर क्या जाता है?"
  h1_kho_jana: "खो जाने पर अनजान लोगों के साथ नहीं जाते। मेले में मदद करने का काम किसका होता है?"
  h1_mela_jhoola: "मेले में ऊपर-नीचे घूमने वाली बड़ी सवारी कौन-सी है?"

concepts:
- code: cbse1h.13.mela
  title: मेला
  notes: |
    मेले पर पाठ/कविता: झूले, खिलौने, गुब्बारे, मिठाई, भीड़; मेले में बड़ों का हाथ पकड़े रहना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: 'मेले में बहुत रौनक होती है: झूले, गुब्बारे, खिलौने और मिठाइयाँ। मेले में भीड़ होती है, इसलिए हमें बड़ों का हाथ पकड़े रहना चाहिए।'
    visual: 'चित्र बनाओ: मेले में बड़ा झूला, गुब्बारे वाला और बड़ों का हाथ पकड़े बच्चा।'
    step_by_step: 1. पाठ पढ़ो। 2. मेले में क्या-क्या था? 3. तुम्हें मेले में क्या अच्छा लगता है? 4. भीड़ में क्या ध्यान रखें?
    real_world: गाँवों और शहरों में त्योहारों पर मेले लगते हैं।
  picture:
    kind: compare
    columns:
    - title: मेले में
      points:
      - झूला
      - गुब्बारा
      - मिठाई
    - title: हम
      points:
      - झूलते हैं
      - खरीदते हैं
      - खाते हैं
    alt: मेले में हम झूले पर झूलते हैं, गुब्बारा खरीदते हैं और मिठाई खाते हैं।
  activity:
    type: sort
    prompt: मेले में क्या करना ठीक है?
    bins:
    - ठीक
    - ठीक नहीं
    items:
    - label: 🤝 बड़ों का हाथ पकड़े रहना
      bin: ठीक
      clue: भीड़ में खो न जाएँ?
      why: हाथ पकड़े रहो।
    - label: 🎡 झूला झूलना
      bin: ठीक
      clue: मेले का मज़ा?
      why: मेले में झूले।
    - label: 🏃 अकेले भीड़ में भाग जाना
      bin: ठीक नहीं
      clue: खो सकते हैं?
      why: अकेले मत जाओ।
    - label: 🙅 अनजान के साथ चले जाना
      bin: ठीक नहीं
      clue: क्या यह सुरक्षित है?
      why: अनजान के साथ कभी नहीं।
  items:
  - prompt: 'मेले में भीड़ हो तो हमें:'
    options:
    - बड़ों का हाथ पकड़े रहना चाहिए
    - अकेले घूमना चाहिए
    - छिप जाना चाहिए
    answer: बड़ों का हाथ पकड़े रहना चाहिए
    difficulty: 1
    hints:
    - खो न जाएँ।
    - सुरक्षा।
    solution: बड़ों का हाथ पकड़े रहना चाहिए।
    mistakes: {"अकेले घूमना चाहिए": "h1_suraksha", "छिप जाना चाहिए": "h1_suraksha"}
  - prompt: मेले में बच्चे किस पर बैठकर झूलते हैं?
    options:
    - झूले पर
    - तवे पर
    - पेड़ की जड़ पर
    answer: झूले पर
    difficulty: 1
    hints:
    - ऊपर-नीचे।
    - झ से।
    solution: बच्चे झूले पर झूलते हैं।
    mistakes: {"तवे पर": "h1_mela_jhoola", "पेड़ की जड़ पर": "h1_mela_jhoola"}
  - prompt: गुब्बारे में क्या भरा होता है?
    options:
    - हवा
    - पानी हमेशा
    - रेत
    answer: हवा
    difficulty: 2
    hints:
    - फूँक मारकर।
    - हल्का।
    solution: गुब्बारे में हवा भरी होती है।
    mistakes: {"पानी हमेशा": "h1_gubbara", "रेत": "h1_gubbara"}
  - prompt: मेले में कौन-सी चीज़ मिलती है?
    options:
    - खिलौने
    - स्कूल की परीक्षा
    - होमवर्क
    answer: खिलौने
    difficulty: 1
    hints:
    - मज़े की चीज़।
    - खेलने के लिए।
    solution: मेले में खिलौने मिलते हैं।
    mistakes:
      होमवर्क: hin1_read_again
  - prompt: '''भीड़'' का अर्थ है:'
    options:
    - बहुत सारे लोग
    - खाली जगह
    - एक आदमी
    answer: बहुत सारे लोग
    difficulty: 2
    hints:
    - मेले में बहुत लोग।
    - धक्का-मुक्की।
    solution: भीड़ यानी बहुत सारे लोग।
    mistakes:
      खाली जगह: hin1_word
  - prompt: 'अगर मेले में खो जाएँ तो:'
    options:
    - पुलिस या दुकानदार को बताएँ
    - रोते हुए भागें
    - किसी अजनबी के साथ चले जाएँ
    answer: पुलिस या दुकानदार को बताएँ
    difficulty: 2
    hints:
    - एक जगह रुको।
    - मदद माँगो।
    solution: पुलिस या दुकानदार को बताएँ।
    mistakes: {"रोते हुए भागें": "h1_kho_jana", "किसी अजनबी के साथ चले जाएँ": "h1_kho_jana"}
