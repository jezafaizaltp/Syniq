  lesson:
    - teach: 'मेले में बहुत चहल-पहल होती है: ऊँचे झूले, रंग-बिरंगे गुब्बारे, खिलौने, मिठाई और खाने की दुकानें। ढोल और बाजों की आवाज़ आती है।'
