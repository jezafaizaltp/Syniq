    - teach: अगर खो जाओ तो घबराओ नहीं। एक जगह रुको। वर्दी वाले पुलिस वाले, या किसी दुकानदार को बताओ। अजनबी के साथ कहीं मत जाओ।
      picture:
        kind: flow
        steps:
