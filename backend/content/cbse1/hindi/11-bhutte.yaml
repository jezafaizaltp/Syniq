subject: cbse1-hin
chapter: 11
title: भुट्टे
tips:
  h1_anaj_ugna: "अनाज बीज से उगता है। किसान खेत में हल चलाकर बीज कहाँ दबाता है?"
  h1_makka: "भुट्टे का पौधा ऊँचा होता है। किसान उसे उस ज़मीन पर उगाता है जहाँ हल चलता है और बैल काम करते हैं।"
  h1_bhutta_mausam: "याद करो, गरम भुट्टे का ठेला किस मौसम में भीगी सड़कों पर दिखता है।"
  h1_bhutta_namak: "भुना भुट्टा चटपटा खाते हैं, मीठा नहीं। ठेले वाला उस पर क्या रगड़ता है?"
  h1_bhutta_rang: "भुट्टे का छिलका हटाओ और दानों को याद करो: वे सूरज जैसे दिखते हैं।"

concepts:
- code: cbse1h.11.bhutte
  title: भुट्टे
  notes: |
    भुट्टे (मक्के) पर पाठ/कविता: बरसात में भुने भुट्टे, नमक-नींबू, मक्का खेत में उगना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: भुट्टा मक्के का होता है। बरसात में भुने हुए भुट्टे पर नमक और नींबू लगाकर खाने में बड़ा मज़ा आता है। मक्का खेत में उगता है।
    visual: 'चित्र बनाओ: अंगीठी पर भुनता पीला भुट्टा और पास में नींबू।'
    step_by_step: 1. पाठ पढ़ो। 2. भुट्टा किसका होता है? 3. उसे कैसे खाते हैं? 4. भुट्टा किस मौसम में मिलता है?
    real_world: बरसात में सड़क किनारे भुट्टे भूनकर बेचे जाते हैं।
  picture:
    kind: flow
    steps:
    - खेत में मक्का
    - भुट्टा तोड़ा
    - आग पर भूना
    - नमक-नींबू लगाकर खाया
    alt: खेत में मक्का उगा, भुट्टा तोड़ा, आग पर भूना और नमक-नींबू लगाकर खाया।
  items:
  - prompt: भुट्टा किसका होता है?
    options:
    - मक्के का
    - आम का
    - आलू का
    answer: मक्के का
    difficulty: 1
    hints:
    - पीले दाने।
    - म से।
    solution: भुट्टा मक्के का होता है।
    mistakes:
      आलू का: hin1_read_again
  - prompt: भुट्टे के दाने किस रंग के होते हैं?
    options:
    - पीले
    - नीले
    - काले
    answer: पीले
    difficulty: 1
    hints:
    - सूरज जैसे।
    - सुनहरे।
    solution: भुट्टे के दाने पीले होते हैं।
    mistakes: {"नीले": "h1_bhutta_rang", "काले": "h1_bhutta_rang"}
  - prompt: भुने भुट्टे पर हम क्या लगाते हैं?
    options:
    - नमक और नींबू
    - चीनी और दूध
    - तेल और साबुन
    answer: नमक और नींबू
    difficulty: 2
    hints:
    - खट्टा-नमकीन।
    - न से दोनों।
    solution: नमक और नींबू लगाते हैं।
    mistakes: {"चीनी और दूध": "h1_bhutta_namak", "तेल और साबुन": "h1_bhutta_namak"}
  - prompt: भुट्टे सबसे ज़्यादा कब मिलते हैं?
    options:
    - बरसात में
    - सर्दी में रात को ही
    - कभी नहीं
    answer: बरसात में
    difficulty: 2
    hints:
    - बारिश का मौसम।
    - सड़क किनारे।
    solution: बरसात में भुट्टे मिलते हैं।
    mistakes: {"सर्दी में रात को ही": "h1_bhutta_mausam", "कभी नहीं": "h1_bhutta_mausam"}
  - prompt: मक्का कहाँ उगता है?
    options:
    - खेत में
    - समुद्र में
    - बादल में
    answer: खेत में
    difficulty: 1
    hints:
    - किसान उगाता है।
    - ज़मीन।
    solution: मक्का खेत में उगता है।
    mistakes: {"समुद्र में": "h1_makka", "बादल में": "h1_makka"}
  - prompt: '''भुट्टे'' बहुवचन है। एकवचन क्या है?'
    options:
    - भुट्टा
    - भुट्टी
    - भुट्टों
    answer: भुट्टा
    difficulty: 2
    hints:
    - एक ...
    - आ से खत्म।
    solution: एक भुट्टा, कई भुट्टे।
    mistakes:
      भुट्टी: hin1_word
