# CBSE Class 1 Hindi (NCERT Sarangi, 2024-25), chapter 11. Format: content/README.md.
# Chapter names and order from published chapter lists (two agree), not the printed book; story details kept general.
# Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse1-hin
chapter: 11
title: भुट्टे
tips:
  h1_anaj_ugna: "अनाज बीज से उगता है। किसान खेत में हल चलाकर बीज कहाँ दबाता है?"
  h1_makka: "भुट्टे का पौधा ऊँचा होता है। किसान उसे उस ज़मीन पर उगाता है जहाँ हल चलता है और बैल काम करते हैं।"
  h1_bhutta_mausam: "याद करो, गरम भुट्टे का ठेला किस मौसम में भीगी सड़कों पर दिखता है।"
  h1_bhutta_namak: "भुना भुट्टा चटपटा खाते हैं, मीठा नहीं। ठेले वाला उस पर क्या रगड़ता है?"
  h1_bhutta_rang: "भुट्टे का छिलका हटाओ और दानों को याद करो: वे सूरज जैसे दिखते हैं।"
  c1h11_akshar: शब्द को उँगली रखकर अक्षर-अक्षर पढ़ो।
  c1h11_makka: 'भुट्टे को मन में देखो: पौधा कहाँ उगता है, दाने कैसे दिखते हैं?'
  c1h11_vachan: 'एक चीज़ के लिए और बहुत सारी चीज़ों के लिए शब्द बोलकर देखो: एक ___, दो ___।'
  c1h11_ginti: उँगलियों पर एक-एक करके गिनो।

concepts:
- code: cbse1h.11.bhutte
  title: भुट्टे
  notes: |
    भुट्टे (मक्के) पर पाठ/कविता: बरसात में भुने भुट्टे, नमक-नींबू, मक्का खेत में उगना। (पाठ की ठीक पंक्तियाँ और घटनाएँ यहाँ नहीं दी गई हैं; प्रश्न सामान्य हैं।)
  explanations:
    text: भुट्टा मक्के का होता है। बरसात में भुने हुए भुट्टे पर नमक और नींबू लगाकर खाने में बड़ा मज़ा आता है। मक्का खेत में उगता है।
    visual: 'चित्र बनाओ: अंगीठी पर भुनता पीला भुट्टा और पास में नींबू।'
    step_by_step: 1. पाठ पढ़ो। 2. भुट्टा किसका होता है? 3. उसे कैसे खाते हैं? 4. भुट्टा किस मौसम में मिलता है?
    real_world: बरसात में सड़क किनारे भुट्टे भूनकर बेचे जाते हैं।
  picture:
    kind: flow
    steps:
    - खेत में मक्का
    - भुट्टा तोड़ा
    - आग पर भूना
    - नमक-नींबू लगाकर खाया
    alt: खेत में मक्का उगा, भुट्टा तोड़ा, आग पर भूना और नमक-नींबू लगाकर खाया।
  activity:
    type: order
    prompt: खेत से थाली तक, भुट्टा क्रम से लगाओ।
    steps:
    - 🌱 मक्के का पौधा उगता है
    - 🌽 भुट्टा लगता है
    - 🔥 भुट्टा भूनते हैं
    - 🍋 नमक-नींबू लगाकर खाते हैं
    reasons:
      🌽 भुट्टा लगता है: भुट्टा पौधे पर लगता है।
      🔥 भुट्टा भूनते हैं: तोड़कर ही भूनते हैं।
      🍋 नमक-नींबू लगाकर खाते हैं: भुनने के बाद खाते हैं।
  lesson:
    - teach: भुट्टा मक्के के पौधे पर लगता है। उसके ऊपर हरे पत्तों का छिलका होता है। छिलका हटाओ तो अंदर पीले दाने पंक्तियों में लगे होते हैं।
      picture:
        kind: flow
        steps:
        - मक्के का पौधा
        - भुट्टा लगा
        - छिलका हटाया
        - पीले दाने
        alt: पौधे से भुट्टे के दाने तक।
      check:
        prompt: भुट्टे के दानों को किस हरी चीज़ ने ढका होता है?
        options:
        - छिलके ने
        - मिट्टी ने
        - पानी ने
        answer: छिलके ने
        why: हरे पत्तों का छिलका दानों को बचाता है।
    - teach: बरसात में सड़क किनारे भुट्टे आग पर भूनकर बिकते हैं। भुने भुट्टे पर नमक और नींबू लगाते हैं। भुट्टा खाने से पहले हाथ धोते हैं।
      check:
        prompt: भुट्टा किस पर भूनते हैं?
        options:
        - आग पर
        - बर्फ़ पर
        - पानी में
        answer: आग पर
        why: भूनने के लिए गरमी चाहिए।
    - teach: एक चीज़ हो तो एकवचन, ज़्यादा हों तो बहुवचन। एक भुट्टा, दो भुट्टे। एक दाना, बहुत सारे दाने। एक पत्ता, कई पत्ते।
      picture:
        kind: compare
        columns:
        - title: एक
          points:
          - भुट्टा
          - दाना
          - पत्ता
        - title: बहुत
          points:
          - भुट्टे
          - दाने
          - पत्ते
        alt: एकवचन और बहुवचन के जोड़े।
      check:
        prompt: '''एक पत्ता'', तो ''चार ___''?'
        options:
        - पत्ते
        - पत्ता
        - पत्तों
        answer: पत्ते
        why: आ से खत्म होने वाले कई शब्द बहुवचन में ए से खत्म होते हैं।
  items:
  - prompt: भुट्टा किसका होता है?
    options:
    - मक्के का
    - आम का
    - आलू का
    answer: मक्के का
    difficulty: 1
    hints:
    - पीले दाने।
    - म से।
    solution: भुट्टा मक्के का होता है।
    mistakes:
      आलू का: hin1_read_again
  - prompt: भुट्टे के दाने किस रंग के होते हैं?
    options:
    - पीले
    - नीले
    - काले
    answer: पीले
    difficulty: 1
    hints:
    - सूरज जैसे।
    - सुनहरे।
    solution: भुट्टे के दाने पीले होते हैं।
    mistakes: {"नीले": "h1_bhutta_rang", "काले": "h1_bhutta_rang"}
  - prompt: भुने भुट्टे पर हम क्या लगाते हैं?
    options:
    - नमक और नींबू
    - चीनी और दूध
    - तेल और साबुन
    answer: नमक और नींबू
    difficulty: 2
    hints:
    - खट्टा-नमकीन।
    - न से दोनों।
    solution: नमक और नींबू लगाते हैं।
    mistakes: {"चीनी और दूध": "h1_bhutta_namak", "तेल और साबुन": "h1_bhutta_namak"}
  - prompt: भुट्टे सबसे ज़्यादा कब मिलते हैं?
    options:
    - बरसात में
    - सर्दी में रात को ही
    - कभी नहीं
    answer: बरसात में
    difficulty: 2
    hints:
    - बारिश का मौसम।
    - सड़क किनारे।
    solution: बरसात में भुट्टे मिलते हैं।
    mistakes: {"सर्दी में रात को ही": "h1_bhutta_mausam", "कभी नहीं": "h1_bhutta_mausam"}
  - prompt: मक्का कहाँ उगता है?
    options:
    - खेत में
    - समुद्र में
    - बादल में
    answer: खेत में
    difficulty: 1
    hints:
    - किसान उगाता है।
    - ज़मीन।
    solution: मक्का खेत में उगता है।
    mistakes: {"समुद्र में": "h1_makka", "बादल में": "h1_makka"}
  - prompt: '''भुट्टे'' बहुवचन है। एकवचन क्या है?'
    options:
    - भुट्टा
    - भुट्टी
    - भुट्टों
    answer: भुट्टा
    difficulty: 2
    hints:
    - एक ...
    - आ से खत्म।
    solution: एक भुट्टा, कई भुट्टे।
    mistakes:
      भुट्टी: hin1_word
  - prompt: '''दाना'' का बहुवचन क्या है?'
    options:
    - दाने
    - दाना
    - दानी
    answer: दाने
    difficulty: 2
    hints:
    - एक दाना, बहुत सारे ___।
    - भुट्टा-भुट्टे जैसा बदलाव।
    solution: 'चरण 1: आखिरी आ बदलकर ए। चरण 2: दाने।'
    mistakes:
      दाना: c1h11_vachan
      दानी: c1h11_vachan
  - prompt: भुने भुट्टे का स्वाद बढ़ाने के लिए क्या छिड़कते हैं?
    options:
    - नमक
    - चीनी की चाशनी
    - दूध
    answer: नमक
    difficulty: 1
    hints:
    - नींबू के साथ लगाते हैं।
    - समुद्र के पानी से भी बनता है।
    solution: 'चरण 1: भुने भुट्टे पर नमक-नींबू। चरण 2: नमक।'
    mistakes:
      चीनी की चाशनी: c1h11_makka
      दूध: c1h11_makka
  - prompt: मक्के के दानों से कौन-सी चीज़ बनती है?
    options:
    - पॉपकॉर्न
    - दही
    - अंडा
    answer: पॉपकॉर्न
    difficulty: 2
    hints:
    - गरम करने पर दाने फूटते हैं।
    - सिनेमा में खाते हैं।
    solution: 'चरण 1: मक्का गरम होकर फूटता है। चरण 2: पॉपकॉर्न।'
    mistakes:
      दही: c1h11_makka
      अंडा: c1h11_makka
  - prompt: तीन भुट्टे और दो भुट्टे। कुल कितने?
    options:
    - पाँच
    - चार
    - छह
    answer: पाँच
    difficulty: 2
    hints:
    - तीन उँगलियाँ, फिर दो और।
    - सब मिलाकर गिनो।
    solution: 'चरण 1: 3 + 2। चरण 2: पाँच।'
    mistakes:
      चार: c1h11_ginti
      छह: c1h11_ginti
  - prompt: भुट्टा खाने से पहले क्या करना चाहिए?
    options:
    - हाथ धोना
    - सो जाना
    - दौड़ना
    answer: हाथ धोना
    difficulty: 1
    hints:
    - गंदे हाथ से कीटाणु पेट में जाते हैं।
    - साबुन और पानी।
    solution: 'चरण 1: साफ़ हाथ से खाना। चरण 2: हाथ धोना।'
    mistakes:
      सो जाना: c1h11_makka
      दौड़ना: c1h11_makka
  - prompt: '''पत्ते'' का एकवचन क्या है?'
    options:
    - पत्ता
    - पत्तों
    - पत्ती
    answer: पत्ता
    difficulty: 3
    hints:
    - एक ___, बहुत सारे पत्ते।
    - ए को आ में बदलो।
    solution: 'चरण 1: पत्ते बहुवचन। चरण 2: एक पत्ता।'
    mistakes:
      पत्तों: c1h11_vachan
      पत्ती: c1h11_vachan
  - prompt: मक्का उगाने के लिए किसान को सबसे पहले क्या चाहिए?
    options:
    - बीज
    - भुना भुट्टा
    - नींबू
    answer: बीज
    difficulty: 3
    hints:
    - हर पौधा किससे शुरू होता है?
    - मिट्टी में बोते हैं।
    solution: 'चरण 1: पौधा बीज से उगता है। चरण 2: बीज।'
    mistakes:
      भुना भुट्टा: c1h11_makka
      नींबू: c1h11_makka
  - prompt: भुट्टे के दाने कैसे लगे होते हैं?
    options:
    - पंक्तियों में
    - उलटे-पुलटे ढेर में
    - पत्तों के ऊपर
    answer: पंक्तियों में
    difficulty: 2
    hints:
    - छिलका हटाकर देखो।
    - जैसे कक्षा में बेंच।
    solution: 'चरण 1: दाने ऊपर से नीचे लाइन में। चरण 2: पंक्तियों में।'
    mistakes:
      उलटे-पुलटे ढेर में: c1h11_makka
      पत्तों के ऊपर: c1h11_makka
  - prompt: '''भुट्टा'' में ''ट'' कितनी बार आता है (आधा भी गिनो)?'
    options:
    - दो
    - एक
    - तीन
    answer: दो
    difficulty: 3
    hints:
    - आधा अक्षर भी गिना जाता है।
    - भु के बाद वाले हिस्से को ध्यान से देखो।
    solution: 'चरण 1: ट्ट में आधा ट और पूरा ट। चरण 2: दो बार।'
    mistakes:
      एक: c1h11_akshar
      तीन: c1h11_akshar
