# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 7
title: 'The Food We Eat (Unit 3: Food)'
tips:
  e1_bones: "Milk helps the hard parts inside your body grow strong."
