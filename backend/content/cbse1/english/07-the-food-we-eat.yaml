concepts:
- code: cbse1e.u3.food
  title: 'The Food We Eat (Unit 3: Food)'
  notes: |
    A lesson about the food we eat at different meals and why healthy food matters: breakfast, lunch, dinner; fruits,
    vegetables, milk, rice, roti; not wasting food.
  explanations:
    text: We eat breakfast in the morning, lunch in the afternoon and dinner at night. Healthy food like fruits, vegetables, milk, rice and roti makes us strong. We should not waste food.
    visual: Draw a plate with rice, dal, a vegetable and a fruit beside it.
    step_by_step: 1. Read the lesson. 2. Name the meals. 3. Name healthy foods. 4. How can we avoid wasting food?
    real_world: In many schools children get a hot midday meal.
  picture:
    kind: flow
    steps:
    - Breakfast
    - Lunch
    - Dinner
    alt: 'Meals in a day: breakfast in the morning, lunch in the afternoon, dinner at night.'
  activity:
    type: sort
    prompt: 'The Food We Eat: healthy every day, or only sometimes?'
    bins:
    - Every day
    - Only sometimes
    items:
    - label: 🥛 Milk
      bin: Every day
      clue: Strong bones.
      why: Milk is good every day.
    - label: 🍬 Sweets
      bin: Only sometimes
      clue: Sugar.
      why: Sweets are for sometimes.
    - label: 🍎 Fruit
      bin: Every day
      clue: Vitamins.
      why: Fruit is good every day.
    - label: 🍟 Chips
      bin: Only sometimes
      clue: Oily.
      why: Chips are only a treat.
    - label: 🍚 Rice and dal
      bin: Every day
      clue: A healthy meal.
      why: Rice and dal are everyday food.
  items:
  - prompt: 'The meal in the morning is:'
    options:
    - breakfast
    - dinner
    - lunch
    answer: breakfast
    difficulty: 1
    hints:
    - First meal.
    - Morning.
    solution: Breakfast is the morning meal.
    mistakes:
      dinner: eng1_read_again
  - prompt: Which food is healthy?
    options:
    - fruits
    - too many sweets
    - chips every day
    answer: fruits
    difficulty: 1
    hints:
    - Grows on trees.
    - Good for the body.
    solution: Fruits are healthy.
    mistakes: {"chips every day": "e1_healthy"}
  - prompt: We should ___ food.
    options:
    - not waste
    - throw away
    - play with
    answer: not waste
    difficulty: 1
    hints:
    - Food is precious.
    - Farmers work hard.
    solution: We should not waste food.
    mistakes: {"throw away": "v5_waste"}
  - prompt: 'The meal at night is:'
    options:
    - dinner
    - breakfast
    - snack time
    answer: dinner
    difficulty: 2
    hints:
    - Before bed.
    - Night meal.
    solution: Dinner is the night meal.
    mistakes: {"breakfast": "e1_dinner"}
  - prompt: Milk makes our ___ strong.
    options:
    - bones
    - hair
    - clothes
    answer: bones
    difficulty: 2
    hints:
    - Inside the body.
    - Teeth and ...
    solution: Milk makes our bones strong.
    mistakes: {"hair": "e1_bones"}
  - prompt: Which word means a thing we eat?
    options:
    - roti
    - run
    - red
    answer: roti
    difficulty: 2
    hints:
    - Made from wheat flour.
    - Eaten with dal.
    solution: Roti is a food.
    mistakes:
      run: eng1_word
