# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 7. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 7
title: 'The Food We Eat (Unit 3: Food)'
tips:
  e1_bones: "Milk helps the hard parts inside your body grow strong."
  e1_dinner: "Breakfast is in the morning. The night meal has another name."
  e1_healthy: "Which food grows on trees and plants?"
  c1e7_meal: Think of your own day. When do you eat this meal?
  c1e7_health: Which choice helps your body grow strong and stay well?

concepts:
- code: cbse1e.u3.food
  title: 'The Food We Eat (Unit 3: Food)'
  notes: |
    A lesson about the food we eat at different meals and why healthy food matters: breakfast, lunch, dinner; fruits,
    vegetables, milk, rice, roti; not wasting food.
  explanations:
    text: We eat breakfast in the morning, lunch in the afternoon and dinner at night. Healthy food like fruits, vegetables, milk, rice and roti makes us strong. We should not waste food.
    visual: Draw a plate with rice, dal, a vegetable and a fruit beside it.
    step_by_step: 1. Read the lesson. 2. Name the meals. 3. Name healthy foods. 4. How can we avoid wasting food?
    real_world: In many schools children get a hot midday meal.
  picture:
    kind: flow
    steps:
    - Breakfast
    - Lunch
    - Dinner
    alt: 'Meals in a day: breakfast in the morning, lunch in the afternoon, dinner at night.'
  activity:
    type: sort
    prompt: 'The Food We Eat: healthy every day, or only sometimes?'
    bins:
    - Every day
    - Only sometimes
    items:
    - label: 🥛 Milk
      bin: Every day
      clue: Strong bones.
      why: Milk is good every day.
    - label: 🍬 Sweets
      bin: Only sometimes
      clue: Sugar.
      why: Sweets are for sometimes.
    - label: 🍎 Fruit
      bin: Every day
      clue: Vitamins.
      why: Fruit is good every day.
    - label: 🍟 Chips
      bin: Only sometimes
      clue: Oily.
      why: Chips are only a treat.
    - label: 🍚 Rice and dal
      bin: Every day
      clue: A healthy meal.
      why: Rice and dal are everyday food.
  lesson:
    - teach: 'We eat three main meals: breakfast in the morning, lunch in the afternoon, dinner at night. Some children also have a small snack.'
      picture:
        kind: flow
        steps:
        - 'breakfast: morning'
        - 'lunch: afternoon'
        - 'dinner: night'
        alt: The three meals of the day.
      check:
        prompt: 'The meal in the afternoon is:'
        options:
        - lunch
        - breakfast
        - dinner
        answer: lunch
        why: Lunch comes in the middle of the day.
      ways:
      - style: step_by_step
        teach: 'Draw your meals. Step 1: Draw three big plates. Step 2: Label them morning, afternoon and night. Step 3: Draw what you eat at each one. Step 4: Add a small plate between them if you have a snack.'
      - style: real_world
        teach: In many homes, the whole family sits together at dinner time and talks about the day.
    - teach: 'Healthy food helps us grow: fruits, vegetables, milk, dal, rice, roti, eggs. Too many sweets, chips and fizzy drinks are not good for us.'
      picture:
        kind: compare
        columns:
        - title: eat often
          points:
          - fruits
          - vegetables
          - dal and roti
        - title: eat only a little
          points:
          - sweets
          - chips
          - fizzy drinks
        alt: Healthy foods to eat often and foods to eat only a little.
      check:
        prompt: Which is better for a snack?
        options:
        - a banana
        - a bag of chips
        - a fizzy drink
        answer: a banana
        why: Fruits are healthy.
      ways:
      - style: step_by_step
        teach: 'Build a healthy plate. Step 1: Add a grain, like rice. Step 2: Add a vegetable, like pumpkin. Step 3: Add something that builds the body, like an egg or curd. Step 4: Keep a fruit for later.'
      - style: real_world
        teach: Sportspeople eat healthy food and drink lots of water, so their bodies stay strong for their games.
    - teach: 'Good food habits: wash hands before eating, chew well, take only what you can eat, do not waste food, and drink clean water.'
      check:
        prompt: 'Before eating we should:'
        options:
        - wash our hands
        - play in mud
        - watch TV
        answer: wash our hands
        why: Clean hands keep germs out of our food.
      ways:
      - style: visual
        teach: Good food habits, and habits that are not good.
        picture:
          kind: compare
          columns:
          - title: Good habit
            points:
            - Wash hands before eating
            - Chew slowly
          - title: Not a good habit
            points:
            - Eat with dirty hands
            - Gulp food down fast
          alt: Washing hands before eating and chewing slowly are good habits. Eating with dirty hands and gulping food down fast are not.
      - style: real_world
        teach: In many schools, children say a short thank-you before lunch and try to leave nothing on their plates.
  items:
  - prompt: 'The meal in the morning is:'
    options:
    - breakfast
    - dinner
    - lunch
    answer: breakfast
    difficulty: 1
    hints:
    - First meal.
    - Morning.
    solution: Breakfast is the morning meal.
    mistakes:
      dinner: eng1_read_again
  - prompt: Which food is healthy?
    options:
    - fruits
    - too many sweets
    - chips every day
    answer: fruits
    difficulty: 1
    hints:
    - Grows on trees.
    - Good for the body.
    solution: Fruits are healthy.
    mistakes: {"chips every day": "e1_healthy"}
  - prompt: We should ___ food.
    options:
    - not waste
    - throw away
    - play with
    answer: not waste
    difficulty: 1
    hints:
    - Food is precious.
    - Farmers work hard.
    solution: We should not waste food.
    mistakes: {"throw away": "v5_waste"}
  - prompt: 'The meal at night is:'
    options:
    - dinner
    - breakfast
    - snack time
    answer: dinner
    difficulty: 2
    hints:
    - Before bed.
    - Night meal.
    solution: Dinner is the night meal.
    mistakes: {"breakfast": "e1_dinner"}
  - prompt: Milk makes our ___ strong.
    options:
    - bones
    - hair
    - clothes
    answer: bones
    difficulty: 2
    hints:
    - Inside the body.
    - Teeth and ...
    solution: Milk makes our bones strong.
    mistakes: {"hair": "e1_bones"}
  - prompt: Which word means a thing we eat?
    options:
    - roti
    - run
    - red
    answer: roti
    difficulty: 2
    hints:
    - Made from wheat flour.
    - Eaten with dal.
    solution: Roti is a food.
    mistakes:
      run: eng1_word
  - prompt: Which meal do we eat at night?
    options:
    - dinner
    - breakfast
    - lunch
    answer: dinner
    difficulty: 1
    hints:
    - The last meal of the day.
    - Before bed.
    solution: 'Step 1: Breakfast and lunch come earlier. Step 2: Dinner is at night.'
    mistakes:
      breakfast: c1e7_meal
      lunch: c1e7_meal
  - prompt: Which drink is good for our bones?
    options:
    - milk
    - a fizzy drink
    - very sweet juice
    answer: milk
    difficulty: 1
    hints:
    - It is white.
    - Cows give it.
    solution: 'Step 1: Bones need calcium. Step 2: Milk has calcium.'
    mistakes:
      a fizzy drink: c1e7_health
      very sweet juice: c1e7_health
  - prompt: Which is a vegetable we can cook?
    options:
    - beans
    - candy
    - ice cream
    answer: beans
    difficulty: 1
    hints:
    - It grows on a plant.
    - Long and green.
    solution: 'Step 1: Candy and ice cream are sweets. Step 2: Beans are a vegetable.'
    mistakes:
      candy: c1e7_health
      ice cream: c1e7_health
  - prompt: You cannot finish your food. What is best?
    options:
    - take less next time
    - throw it away every day
    - hide it under the table
    answer: take less next time
    difficulty: 1
    hints:
    - Food should not be wasted.
    - Take only what you can eat.
    solution: 'Step 1: Wasting food is not good. Step 2: Take less next time.'
    mistakes:
      throw it away every day: c1e7_health
      hide it under the table: c1e7_health
  - prompt: Which should we drink most every day?
    options:
    - clean water
    - cola
    - sweet syrup
    answer: clean water
    difficulty: 1
    hints:
    - It has no sugar.
    - Our body needs lots of it.
    solution: 'Step 1: Cola and syrup have lots of sugar. Step 2: Clean water is best.'
    mistakes:
      cola: c1e7_health
      sweet syrup: c1e7_health
  - prompt: Put the meals in order. Which comes second?
    options:
    - lunch
    - breakfast
    - dinner
    answer: lunch
    difficulty: 2
    hints:
    - Breakfast is first.
    - Dinner is last.
    solution: 'Step 1: Breakfast, lunch, dinner. Step 2: Lunch is second.'
    mistakes:
      breakfast: c1e7_meal
      dinner: c1e7_meal
  - prompt: Which plate is the healthiest?
    options:
    - roti, dal and vegetables
    - only sweets
    - only chips
    answer: roti, dal and vegetables
    difficulty: 2
    hints:
    - A good plate has many kinds of food.
    - Not just one treat.
    solution: 'Step 1: Sweets and chips alone are not healthy. Step 2: Roti, dal and vegetables are.'
    mistakes:
      only sweets: c1e7_health
      only chips: c1e7_health
  - prompt: Why do we chew food well?
    options:
    - "so our tummy can digest it easily"
    - "so that the food gets very cold"
    - "so that we can eat much faster"
    answer: so our tummy can digest it easily
    difficulty: 2
    hints:
    - Small pieces are easier.
    - What happens to food inside us?
    solution: 'Step 1: Chewing makes food small. Step 2: Small pieces are easy to digest.'
    mistakes:
      "so that the food gets very cold": c1e7_health
      "so that we can eat much faster": c1e7_health
  - prompt: Which word names a food made from rice?
    options:
    - idli
    - chapati
    - omelette
    answer: idli
    difficulty: 3
    hints:
    - It is soft, round and white.
    - Chapati is made from wheat.
    solution: 'Step 1: Chapati is wheat; omelette is egg. Step 2: Idli is made from rice.'
    mistakes:
      chapati: c1e7_meal
      omelette: c1e7_meal
  - prompt: 'Case: Every day, Arun has two fizzy drinks and a packet of chips instead of lunch. Arun often feels tired. What would help Arun most?'
    options:
    - "Eat a proper lunch, like rice, dal and a vegetable"
    - "Drink even more fizzy drinks every single day"
    - "Skip breakfast too, and eat only chips at lunch"
    answer: Eat a proper lunch, like rice, dal and a vegetable
    hints:
    - Are chips and fizzy drinks healthy food?
    - Which choice gives the body what it needs to grow?
    solution: Chips and fizzy drinks do not help us grow. A proper lunch of rice, dal and a vegetable gives energy and helps Arun stay well.
    mistakes:
      "Drink even more fizzy drinks every single day": c1e7_health
      "Skip breakfast too, and eat only chips at lunch": c1e7_health
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are very thirsty after playing outside. Which drink is best?'
    options:
    - clean water
    - a fizzy drink
    - sweet syrup
    answer: clean water
    hints:
    - Which drink has no extra sugar?
    - Which one should we drink most every day?
    solution: Clean water is the best drink for a thirsty body. Fizzy drinks and syrups have a lot of sugar.
    mistakes:
      a fizzy drink: c1e7_health
      sweet syrup: c1e7_health
    exam: competency
    difficulty: 2
