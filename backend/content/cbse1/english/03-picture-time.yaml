# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 3. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 3
title: 'Picture Time (Unit 2: Life Around Us)'
concepts:
- code: cbse1e.u2.picture
  title: 'Picture Time (Unit 2: Life Around Us)'
  notes: |
    A picture page about life around us: children look carefully and talk about the people, animals and things they
    see, and what is happening. Questions practise looking, naming and simple describing.
  explanations:
    text: Picture time! Look at the picture carefully. Who do you see? What are they doing? Name the animals and things.
    visual: 'Draw a village scene: a cow, a tree, a hut and two children playing.'
    step_by_step: 1. Look at the whole picture. 2. Name what you see. 3. Say what is happening. 4. Tell a little story.
    real_world: When we look at pictures in a book, we can guess the story before reading it.
  picture:
    kind: flow
    steps:
    - Look
    - Name
    - Say what happens
    - Tell a story
    alt: Look at the picture, name things, say what happens and tell a story.
  activity:
    type: sort
    prompt: 'Picture Time: where does it live?'
    bins:
    - In water
    - On land
    - In the sky
    items:
    - label: 🐟 Fish
      bin: In water
      clue: Swims.
      why: Fish live in water.
    - label: 🐘 Elephant
      bin: On land
      clue: Walks.
      why: Elephants live on land.
    - label: 🦅 Eagle
      bin: In the sky
      clue: Flies.
      why: Eagles fly in the sky.
    - label: 🐢 Turtle
      bin: In water
      clue: Swims in the sea.
      why: Sea turtles live in water.
    - label: 🐄 Cow
      bin: On land
      clue: Grazes.
      why: Cows live on land.
  items:
  - prompt: 'In picture time we first:'
    options:
    - look carefully
    - close our eyes
    - tear the page
    answer: look carefully
    difficulty: 1
    hints:
    - Use your eyes.
    - See everything.
    solution: We first look carefully.
  - prompt: 'A cow says:'
    options:
    - moo
    - meow
    - woof
    answer: moo
    difficulty: 1
    hints:
    - Farm animal.
    - Gives milk.
    solution: A cow says moo.
  - prompt: Which is an animal?
    options:
    - dog
    - tree
    - hut
    answer: dog
    difficulty: 1
    hints:
    - It barks.
    - It can run.
    solution: A dog is an animal.
    mistakes:
      tree: eng1_word
  - prompt: Children are playing ___ the tree. (below it)
    options:
    - under
    - 'on'
    - in
    answer: under
    difficulty: 2
    hints:
    - Below means ...
    - In the shade.
    solution: They are playing under the tree.
  - prompt: Which word tells what someone is doing?
    options:
    - playing
    - girl
    - red
    answer: playing
    difficulty: 2
    hints:
    - An action.
    - Fun!
    solution: Playing is an action word.
    mistakes:
      girl: eng1_word
  - prompt: Which grows in the ground and has leaves?
    options:
    - tree
    - cow
    - car
    answer: tree
    difficulty: 1
    hints:
    - It is a plant.
    - Green leaves.
    solution: A tree has leaves.
