# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 3. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 3
title: 'Picture Time (Unit 2: Life Around Us)'
tips:
  e1_cow_sound: "Meow is a cat. A cow makes a long, low sound."
  e1_look: "To learn from a picture, what must your eyes do?"
  e1_tree: "Which one is a plant?"
  e1_under: "'Below it' means the tree is above them."
  c1e3_look: Look at the picture again, part by part. What do you really see?
  c1e3_animal: Think of the animal. What sound does it make, where does it live?
  c1e3_where: Picture the two things. Is one above, below, in, or beside the other?

concepts:
- code: cbse1e.u2.picture
  title: 'Picture Time (Unit 2: Life Around Us)'
  notes: |
    A picture page about life around us: children look carefully and talk about the people, animals and things they
    see, and what is happening. Questions practise looking, naming and simple describing.
  explanations:
    text: Picture time! Look at the picture carefully. Who do you see? What are they doing? Name the animals and things.
    visual: 'Draw a village scene: a cow, a tree, a hut and two children playing.'
    step_by_step: 1. Look at the whole picture. 2. Name what you see. 3. Say what is happening. 4. Tell a little story.
    real_world: When we look at pictures in a book, we can guess the story before reading it.
  picture:
    kind: flow
    steps:
    - Look
    - Name
    - Say what happens
    - Tell a story
    alt: Look at the picture, name things, say what happens and tell a story.
  activity:
    type: sort
    prompt: 'Picture Time: where does it live?'
    bins:
    - In water
    - On land
    - In the sky
    items:
    - label: 🐟 Fish
      bin: In water
      clue: Swims.
      why: Fish live in water.
    - label: 🐘 Elephant
      bin: On land
      clue: Walks.
      why: Elephants live on land.
    - label: 🦅 Eagle
      bin: In the sky
      clue: Flies.
      why: Eagles fly in the sky.
    - label: 🐢 Turtle
      bin: In water
      clue: Swims in the sea.
      why: Sea turtles live in water.
    - label: 🐄 Cow
      bin: On land
      clue: Grazes.
      why: Cows live on land.
  lesson:
    - teach: 'In picture time we look carefully and say what we see: people, animals, trees, houses. Who is there? What are they doing?'
      check:
        prompt: A picture shows a boy kicking a ball. What is the boy doing?
        options:
        - kicking a ball
        - sleeping
        - eating
        answer: kicking a ball
        why: 'Say what you see: kicking a ball.'
    - teach: 'Animals make sounds: a cow says moo, a dog says woof, a cat says meow, a hen says cluck, a duck says quack.'
      picture:
        kind: compare
        columns:
        - title: animal
          points:
          - cow
          - dog
          - cat
        - title: sound
          points:
          - moo
          - woof
          - meow
        alt: Animals and their sounds.
      check:
        prompt: 'A dog says:'
        options:
        - woof
        - moo
        - quack
        answer: woof
        why: 'Dogs bark: woof woof.'
    - teach: 'Place words help us describe pictures: on, under, in, near. The bird is on the tree. The cat is under the chair.'
      check:
        prompt: A bird sits on top of a branch. The bird is ___ the branch.
        options:
        - 'on'
        - under
        - in
        answer: 'on'
        why: On top means on.
  items:
  - prompt: 'In picture time we first:'
    options:
    - look carefully
    - close our eyes
    - tear the page
    answer: look carefully
    difficulty: 1
    hints:
    - Use your eyes.
    - See everything.
    solution: We first look carefully.
    mistakes: {"close our eyes": "e1_look"}
  - prompt: 'A cow says:'
    options:
    - moo
    - meow
    - woof
    answer: moo
    difficulty: 1
    hints:
    - Farm animal.
    - Gives milk.
    solution: A cow says moo.
    mistakes: {"meow": "e1_cow_sound"}
  - prompt: Which is an animal?
    options:
    - dog
    - tree
    - hut
    answer: dog
    difficulty: 1
    hints:
    - It barks.
    - It can run.
    solution: A dog is an animal.
    mistakes:
      tree: eng1_word
  - prompt: Children are playing ___ the tree. (below it)
    options:
    - under
    - 'on'
    - in
    answer: under
    difficulty: 2
    hints:
    - Below means ...
    - In the shade.
    solution: They are playing under the tree.
    mistakes: {"on": "e1_under"}
  - prompt: Which word tells what someone is doing?
    options:
    - playing
    - girl
    - red
    answer: playing
    difficulty: 2
    hints:
    - An action.
    - Fun!
    solution: Playing is an action word.
    mistakes:
      girl: eng1_word
  - prompt: Which grows in the ground and has leaves?
    options:
    - tree
    - cow
    - car
    answer: tree
    difficulty: 1
    hints:
    - It is a plant.
    - Green leaves.
    solution: A tree has leaves.
    mistakes: {"car": "e1_tree"}
  - prompt: 'A cat says:'
    options:
    - meow
    - moo
    - woof
    answer: meow
    difficulty: 1
    hints:
    - A small furry pet.
    - It drinks milk from a bowl.
    solution: 'Step 1: Cats make a soft sound. Step 2: Meow.'
    mistakes:
      moo: c1e3_animal
      woof: c1e3_animal
  - prompt: Which is a person, not an animal?
    options:
    - a farmer
    - a goat
    - a parrot
    answer: a farmer
    difficulty: 1
    hints:
    - Two of these are animals.
    - Which one is a grown-up who works?
    solution: 'Step 1: Goat and parrot are animals. Step 2: A farmer is a person.'
    mistakes:
      a goat: c1e3_look
      a parrot: c1e3_look
  - prompt: A picture shows rain. What might people carry?
    options:
    - umbrellas
    - kites
    - ice creams
    answer: umbrellas
    difficulty: 1
    hints:
    - They keep you dry.
    - Open it over your head.
    solution: 'Step 1: Rain makes you wet. Step 2: People carry umbrellas.'
    mistakes:
      kites: c1e3_look
      ice creams: c1e3_look
  - prompt: The fish is ___ the water.
    options:
    - in
    - 'on'
    - under the bed
    answer: in
    difficulty: 1
    hints:
    - Fish swim inside water.
    - Not on top.
    solution: 'Step 1: Fish live inside water. Step 2: The fish is in the water.'
    mistakes:
      'on': c1e3_where
      under the bed: c1e3_where
  - prompt: Which one can fly?
    options:
    - a bird
    - a cow
    - a dog
    answer: a bird
    difficulty: 1
    hints:
    - It has wings.
    - It sits in trees.
    solution: 'Step 1: Cows and dogs walk. Step 2: A bird flies with wings.'
    mistakes:
      a cow: c1e3_animal
      a dog: c1e3_animal
  - prompt: A picture shows 2 cows and 3 goats. How many animals?
    options:
    - five
    - two
    - three
    answer: five
    difficulty: 2
    hints:
    - Count cows and goats together.
    - 2 and 3.
    solution: 'Step 1: 2 cows + 3 goats. Step 2: 5 animals.'
    mistakes:
      two: c1e3_look
      three: c1e3_look
  - prompt: Which word tells what a child is doing?
    options:
    - running
    - child
    - green
    answer: running
    difficulty: 2
    hints:
    - It is an action.
    - Child is a person; green is a colour.
    solution: 'Step 1: ''Child'' names a person, ''green'' a colour. Step 2: ''Running'' tells the action.'
    mistakes:
      child: c1e3_look
      green: c1e3_look
  - prompt: A dog sleeps below a table. The dog is ___ the table.
    options:
    - under
    - 'on'
    - in
    answer: under
    difficulty: 2
    hints:
    - Below means lower down.
    - Look down.
    solution: 'Step 1: Below the table. Step 2: The dog is under the table.'
    mistakes:
      'on': c1e3_where
      in: c1e3_where
  - prompt: A picture has a sun, a kite and children on a beach. What is the weather?
    options:
    - sunny
    - snowy
    - stormy
    answer: sunny
    difficulty: 3
    hints:
    - What is in the sky?
    - Kites fly on a nice day.
    solution: 'Step 1: The sun is out. Step 2: The weather is sunny.'
    mistakes:
      snowy: c1e3_look
      stormy: c1e3_look
