concepts:
- code: cbse1e.u2.capseller
  title: 'The Cap-seller and the Monkeys (Unit 2: Life Around Us)'
  notes: |
    The well-known folk tale: a cap-seller sleeps under a tree, monkeys take his caps, he is upset, then he throws his own
    cap down and the monkeys copy him, so he gets all the caps back. Monkeys copy what they see. (The book's exact words
    are not reproduced here.)
  explanations:
    text: A cap-seller sleeps under a tree. Monkeys take his caps and wear them! He throws his own cap on the ground. The monkeys copy him and throw their caps down too. He gets all his caps back.
    visual: Draw a tree full of monkeys wearing caps, and a man below holding an empty basket.
    step_by_step: 1. Read the story. 2. What did the monkeys take? 3. What did the cap-seller do? 4. Why did it work?
    real_world: Monkeys in towns sometimes snatch food from people's hands.
  picture:
    kind: flow
    steps:
    - Cap-seller sleeps
    - Monkeys take caps
    - He throws his cap
    - Monkeys copy him
    - He gets the caps back
    alt: The cap-seller sleeps, monkeys take his caps, he throws his cap, the monkeys copy him and he gets the caps back.
  activity:
    type: order
    prompt: 'The Cap-seller and the Monkeys: put the story in order.'
    steps:
    - The cap-seller sleeps under a tree
    - Monkeys take his caps
    - He wakes up and is upset
    - He throws his own cap down
    - The monkeys copy him
    reasons:
      Monkeys take his caps: While he sleeps.
      He wakes up and is upset: His caps are gone.
      He throws his own cap down: He has an idea.
      The monkeys copy him: Monkeys copy what they see.
  items:
  - prompt: What did the man sell?
    options:
    - caps
    - bananas
    - shoes
    answer: caps
    difficulty: 1
    hints:
    - Look at the title.
    - You wear it on your head.
    solution: He sold caps.
    mistakes:
      bananas: eng1_read_again
  - prompt: Who took the caps?
    options:
    - the monkeys
    - the birds
    - a dog
    answer: the monkeys
    difficulty: 1
    hints:
    - They live in trees.
    - They copy people.
    solution: The monkeys took the caps.
    mistakes: {"the birds": "e1_monkeys"}
  - prompt: Where did the cap-seller sleep?
    options:
    - under a tree
    - on a bus
    - in a boat
    answer: under a tree
    difficulty: 1
    hints:
    - In the shade.
    - Where the monkeys were.
    solution: He slept under a tree.
    mistakes: {"on a bus": "e1_cap_sleep"}
  - prompt: Why did the monkeys throw their caps?
    options:
    - they copied the man
    - they were tired
    - it was raining
    answer: they copied the man
    difficulty: 2
    hints:
    - What did the man do first?
    - Monkeys copy.
    solution: They copied the cap-seller.
    mistakes: {"they were tired": "e1_copy"}
  - prompt: 'We wear a cap on our:'
    options:
    - head
    - feet
    - hands
    answer: head
    difficulty: 1
    hints:
    - On top.
    - Keeps the sun off.
    solution: We wear a cap on our head.
    mistakes: {"feet": "e1_cap_head"}
  - prompt: 'The cap-seller was:'
    options:
    - clever
    - lazy
    - angry forever
    answer: clever
    difficulty: 2
    hints:
    - He had a smart idea.
    - He got the caps back.
    solution: He was clever.
    mistakes: {"lazy": "e1_clever"}
