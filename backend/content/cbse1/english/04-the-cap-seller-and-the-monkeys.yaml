# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 4. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 4
title: 'The Cap-seller and the Monkeys (Unit 2: Life Around Us)'
tips:
  e1_cap_head: "Where do you wear a cap when it is sunny?"
  e1_cap_sleep: "He was tired from walking and rested in the shade."
  e1_clever: "He thought of a smart trick to get his caps back."
  e1_copy: "Monkeys copy what they see. What did the man do first?"
  e1_monkeys: "Who in the story copies everything the cap-seller does?"
  c1e4_rhyme: Say both words aloud. Do the ends sound the same?
  c1e4_story: 'Tell the story again in your head: first, next, then, last.'
  c1e4_copy: What do monkeys love to do when they see people do something?

concepts:
- code: cbse1e.u2.capseller
  title: 'The Cap-seller and the Monkeys (Unit 2: Life Around Us)'
  notes: |
    The well-known folk tale: a cap-seller sleeps under a tree, monkeys take his caps, he is upset, then he throws his own
    cap down and the monkeys copy him, so he gets all the caps back. Monkeys copy what they see. (The book's exact words
    are not reproduced here.)
  explanations:
    text: A cap-seller sleeps under a tree. Monkeys take his caps and wear them! He throws his own cap on the ground. The monkeys copy him and throw their caps down too. He gets all his caps back.
    visual: Draw a tree full of monkeys wearing caps, and a man below holding an empty basket.
    step_by_step: 1. Read the story. 2. What did the monkeys take? 3. What did the cap-seller do? 4. Why did it work?
    real_world: Monkeys in towns sometimes snatch food from people's hands.
  picture:
    kind: flow
    steps:
    - Cap-seller sleeps
    - Monkeys take caps
    - He throws his cap
    - Monkeys copy him
    - He gets the caps back
    alt: The cap-seller sleeps, monkeys take his caps, he throws his cap, the monkeys copy him and he gets the caps back.
  activity:
    type: order
    prompt: 'The Cap-seller and the Monkeys: put the story in order.'
    steps:
    - The cap-seller sleeps under a tree
    - Monkeys take his caps
    - He wakes up and is upset
    - He throws his own cap down
    - The monkeys copy him
    reasons:
      Monkeys take his caps: While he sleeps.
      He wakes up and is upset: His caps are gone.
      He throws his own cap down: He has an idea.
      The monkeys copy him: Monkeys copy what they see.
  lesson:
    - teach: A cap-seller carries a big basket of caps. Feeling tired, the cap-seller sleeps under a tree. Monkeys in the tree take the caps and put them on.
      picture:
        kind: flow
        steps:
        - the cap-seller sleeps under a tree
        - monkeys come down
        - monkeys take the caps
        - monkeys wear them up in the tree
        alt: The first part of the cap-seller story.
      check:
        prompt: Why did the cap-seller sleep under the tree?
        options:
        - the cap-seller was tired
        - it was raining caps
        - the monkeys asked
        answer: the cap-seller was tired
        why: Carrying caps all day is tiring.
    - teach: 'The cap-seller wakes up: the basket is empty! The monkeys are in the tree wearing the caps. The cap-seller shouts and waves. The monkeys shout and wave back. Monkeys copy what they see.'
      check:
        prompt: What did the monkeys do when the cap-seller waved?
        options:
        - waved back
        - went to sleep
        - ran away with the basket
        answer: waved back
        why: Monkeys copy what they see.
    - teach: 'The cap-seller has a clever idea: throw one cap down. The monkeys copy and throw their caps down too. The cap-seller collects them all. Thinking calmly solves problems.'
      picture:
        kind: flow
        steps:
        - the cap-seller throws a cap down
        - the monkeys copy
        - caps fall down
        - caps collected
        alt: How the clever idea got the caps back.
      check:
        prompt: How did the cap-seller get the caps back?
        options:
        - by throwing a cap down for the monkeys to copy
        - by climbing the tree
        - by buying new caps
        answer: by throwing a cap down for the monkeys to copy
        why: The monkeys copied and threw their caps down.
  items:
  - prompt: What did the man sell?
    options:
    - caps
    - bananas
    - shoes
    answer: caps
    difficulty: 1
    hints:
    - Look at the title.
    - You wear it on your head.
    solution: He sold caps.
    mistakes:
      bananas: eng1_read_again
  - prompt: Who took the caps?
    options:
    - the monkeys
    - the birds
    - a dog
    answer: the monkeys
    difficulty: 1
    hints:
    - They live in trees.
    - They copy people.
    solution: The monkeys took the caps.
    mistakes: {"the birds": "e1_monkeys"}
  - prompt: Where did the cap-seller sleep?
    options:
    - under a tree
    - on a bus
    - in a boat
    answer: under a tree
    difficulty: 1
    hints:
    - In the shade.
    - Where the monkeys were.
    solution: He slept under a tree.
    mistakes: {"on a bus": "e1_cap_sleep"}
  - prompt: Why did the monkeys throw their caps?
    options:
    - they copied the man
    - they were tired
    - it was raining
    answer: they copied the man
    difficulty: 2
    hints:
    - What did the man do first?
    - Monkeys copy.
    solution: They copied the cap-seller.
    mistakes: {"they were tired": "e1_copy"}
  - prompt: 'We wear a cap on our:'
    options:
    - head
    - feet
    - hands
    answer: head
    difficulty: 1
    hints:
    - On top.
    - Keeps the sun off.
    solution: We wear a cap on our head.
    mistakes: {"feet": "e1_cap_head"}
  - prompt: 'The cap-seller was:'
    options:
    - clever
    - lazy
    - angry forever
    answer: clever
    difficulty: 2
    hints:
    - He had a smart idea.
    - He got the caps back.
    solution: He was clever.
    mistakes: {"lazy": "e1_clever"}
  - prompt: Where were the monkeys?
    options:
    - up in the tree
    - in the river
    - in a house
    answer: up in the tree
    difficulty: 1
    hints:
    - Monkeys like to climb.
    - The cap-seller slept below it.
    solution: 'Step 1: The cap-seller slept under a tree. Step 2: The monkeys were up in it.'
    mistakes:
      in the river: c1e4_story
      in a house: c1e4_story
  - prompt: What did the cap-seller find on waking up?
    options:
    - the basket was empty
    - the basket was full of bananas
    - new caps
    answer: the basket was empty
    difficulty: 1
    hints:
    - Who took the caps?
    - What was left in the basket?
    solution: 'Step 1: The monkeys took the caps. Step 2: The basket was empty.'
    mistakes:
      the basket was full of bananas: c1e4_story
      new caps: c1e4_story
  - prompt: Monkeys like to ___ what people do.
    options:
    - copy
    - forget
    - write
    answer: copy
    difficulty: 1
    hints:
    - The cap-seller waved; the monkeys waved too.
    - Doing the same thing.
    solution: 'Step 1: The monkeys did the same as the cap-seller. Step 2: They copy.'
    mistakes:
      forget: c1e4_copy
      write: c1e4_copy
  - prompt: What did the cap-seller throw down first?
    options:
    - one cap
    - a banana
    - the basket
    answer: one cap
    difficulty: 1
    hints:
    - It was the cap-seller's own.
    - The monkeys copied it.
    solution: 'Step 1: The cap-seller threw a cap. Step 2: The monkeys copied.'
    mistakes:
      a banana: c1e4_story
      the basket: c1e4_story
  - prompt: Which word tells about the cap-seller's idea?
    options:
    - clever
    - lazy
    - angry
    answer: clever
    difficulty: 1
    hints:
    - The idea worked!
    - Good thinking.
    solution: 'Step 1: The idea got all the caps back. Step 2: It was clever.'
    mistakes:
      lazy: e1_clever
      angry: e1_clever
  - prompt: 'Put in order: (1) monkeys throw caps (2) cap-seller sleeps (3) monkeys take caps. What is first?'
    options:
    - cap-seller sleeps
    - monkeys take caps
    - monkeys throw caps
    answer: cap-seller sleeps
    difficulty: 2
    hints:
    - How does the story begin?
    - The monkeys come while ...
    solution: 'Step 1: First the cap-seller sleeps. Step 2: Then monkeys take caps, then throw them.'
    mistakes:
      monkeys take caps: c1e4_story
      monkeys throw caps: c1e4_story
  - prompt: If the cap-seller clapped, what would the monkeys do?
    options:
    - clap
    - sleep
    - cry
    answer: clap
    difficulty: 2
    hints:
    - Monkeys copy.
    - Do the same action.
    solution: 'Step 1: Monkeys copy what they see. Step 2: They would clap.'
    mistakes:
      sleep: c1e4_copy
      cry: c1e4_copy
  - prompt: Which word rhymes with 'cap'?
    options:
    - map
    - cup
    - cat
    answer: map
    difficulty: 2
    hints:
    - Cap ends with 'ap'.
    - Listen to the end.
    solution: 'Step 1: Cap ends with ''ap''. Step 2: Map ends with ''ap''.'
    mistakes:
      cup: c1e4_rhyme
      cat: c1e4_rhyme
  - prompt: What does the story teach us?
    options:
    - stay calm and think of a plan
    - shout louder
    - give up
    answer: stay calm and think of a plan
    difficulty: 3
    hints:
    - Shouting did not work.
    - What did work?
    solution: 'Step 1: Shouting did not help. Step 2: A calm, clever plan got the caps back.'
    mistakes:
      shout louder: e1_clever
      give up: e1_clever
