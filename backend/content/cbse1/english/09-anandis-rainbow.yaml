# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 9. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 9
title: 'Anandi''s Rainbow (Unit 4: Seasons)'
tips:
  e1_rainbow_colour: "A rainbow is made of light. Is black a bright colour?"
  e1_rainbow_sky: "Look up after the rain. Where is the rainbow?"
  e1_seven_colours: "Say the rainbow colours: violet, indigo, blue, ... and count them."
  c1e9_two: Find the colours in one rainbow, then add the colours of the second one.
  c1e9_rainbow: Remember a rainbow you saw. When did it come, and where was it?
  c1e9_colour: "Picture the thing, or say the letters V-I-B-G-Y-O-R and think what each stands for."

concepts:
- code: cbse1e.u4.rainbow
  title: 'Anandi''s Rainbow (Unit 4: Seasons)'
  notes: |
    A story about a girl, Anandi, and a rainbow: seeing a rainbow after rain and its colours. Exact story details could
    not be confirmed and are kept general; questions focus on the rainbow, its colours, rain and sun, and colour words.
  explanations:
    text: 'This story is about Anandi and a rainbow. A rainbow comes when the sun shines while it is raining. It has seven colours: violet, indigo, blue, green, yellow, orange and red.'
    visual: Draw a rainbow with seven colour bands over a girl holding an umbrella.
    step_by_step: 1. Read the story. 2. When does a rainbow come? 3. Name its colours. 4. What colour do you like best?
    real_world: After the rain, look at the sky away from the sun to find a rainbow.
  picture:
    kind: flow
    steps:
    - Rain
    - Sun comes out
    - Rainbow!
    alt: First rain, then the sun comes out, and a rainbow appears.
  activity:
    type: order
    prompt: 'Anandi''s Rainbow: put the rainbow colours in order, from the top.'
    steps:
    - Red
    - Orange
    - Yellow
    - Green
    - Blue
    - Violet
    reasons:
      Orange: After red.
      Yellow: After orange.
      Green: After yellow.
      Blue: After green.
      Violet: At the bottom (indigo comes just before).
  lesson:
    - teach: A rainbow is a curve of colours in the sky. It comes when the sun shines while it is still raining, or just after rain.
      check:
        prompt: 'A rainbow needs rain and:'
        options:
        - sunshine
        - snow
        - night
        answer: sunshine
        why: Sunlight shining through raindrops makes a rainbow.
    - teach: 'A rainbow has seven colours: violet, indigo, blue, green, yellow, orange, red. You can remember them as VIBGYOR.'
      picture:
        kind: flow
        steps:
        - violet
        - indigo
        - blue
        - green
        - yellow
        - orange
        - red
        alt: The seven colours of the rainbow.
      check:
        prompt: Which colour comes after green in a rainbow?
        options:
        - yellow
        - blue
        - red
        answer: yellow
        why: 'V-I-B-G-Y: green, then yellow.'
    - teach: 'Colour words describe things: a red apple, a blue sky, green grass, a yellow sun. In Anandi''s story, the rainbow fills the sky with colour.'
      check:
        prompt: Which is a colour word?
        options:
        - orange
        - jump
        - sky
        answer: orange
        why: Orange names a colour (and a fruit).
  items:
  - prompt: 'A rainbow comes when there is:'
    options:
    - rain and sun
    - only night
    - only snow
    answer: rain and sun
    difficulty: 2
    hints:
    - Both together.
    - Sunshine after rain.
    solution: A rainbow needs rain and sun.
    mistakes: {"only night": "v4_rainbow"}
  - prompt: How many colours does a rainbow have?
    options:
    - seven
    - two
    - ten
    answer: seven
    difficulty: 1
    hints:
    - VIBGYOR.
    - Count the letters.
    solution: A rainbow has seven colours.
    mistakes: {"two": "e1_seven_colours"}
  - prompt: Which is a colour of the rainbow?
    options:
    - green
    - brown
    - black
    answer: green
    difficulty: 1
    hints:
    - Like leaves.
    - In the middle.
    solution: Green is a rainbow colour.
    mistakes: {"black": "e1_rainbow_colour"}
  - prompt: Where do we see a rainbow?
    options:
    - in the sky
    - under the ground
    - in a box
    answer: in the sky
    difficulty: 1
    hints:
    - Look up.
    - Like a big arch.
    solution: We see a rainbow in the sky.
    mistakes: {"under the ground": "e1_rainbow_sky"}
  - prompt: Whose rainbow is the story about?
    options:
    - Anandi's
    - Ravi's
    - the monkey's
    answer: Anandi's
    difficulty: 1
    hints:
    - Read the title.
    - A girl's name.
    solution: It is Anandi's rainbow.
    mistakes:
      Ravi's: eng1_read_again
  - prompt: Which word is a colour?
    options:
    - blue
    - rain
    - sky
    answer: blue
    difficulty: 2
    hints:
    - It describes how things look.
    - Like the sea.
    solution: Blue is a colour.
    mistakes:
      sky: eng1_word
  - prompt: Where should you look to find a rainbow?
    options:
    - in the sky
    - under the ground
    - inside a box
    answer: in the sky
    difficulty: 1
    hints:
    - Look up after rain.
    - Where are the clouds?
    solution: 'Step 1: Rainbows form in the air. Step 2: We see them in the sky.'
    mistakes:
      under the ground: c1e9_rainbow
      inside a box: c1e9_rainbow
  - prompt: What is the first colour of the rainbow in VIBGYOR?
    options:
    - violet
    - red
    - green
    answer: violet
    difficulty: 2
    hints:
    - V is the first letter.
    - A purple-like colour.
    solution: 'Step 1: VIBGYOR starts with V. Step 2: Violet.'
    mistakes:
      red: c1e9_colour
      green: c1e9_colour
  - prompt: What colour is grass?
    options:
    - green
    - blue
    - red
    answer: green
    difficulty: 1
    hints:
    - Think of a park.
    - Leaves have this colour too.
    solution: 'Step 1: Picture grass. Step 2: It is green.'
    mistakes:
      blue: c1e9_colour
      red: c1e9_colour
  - prompt: When is a rainbow most likely?
    options:
    - after rain when the sun comes out
    - at midnight
    - on a dry, cloudy night
    answer: after rain when the sun comes out
    difficulty: 1
    hints:
    - Two things are needed.
    - Water drops and light.
    solution: 'Step 1: Rain gives drops. Step 2: The sun gives light: a rainbow.'
    mistakes:
      at midnight: c1e9_rainbow
      on a dry, cloudy night: c1e9_rainbow
  - prompt: Which is NOT a rainbow colour?
    options:
    - brown
    - blue
    - orange
    answer: brown
    difficulty: 2
    hints:
    - Say VIBGYOR.
    - Which one is missing from it?
    solution: 'Step 1: Blue and orange are in VIBGYOR. Step 2: Brown is not.'
    mistakes:
      blue: c1e9_colour
      orange: c1e9_colour
  - prompt: What colour is a ripe banana?
    options:
    - yellow
    - violet
    - indigo
    answer: yellow
    difficulty: 1
    hints:
    - Picture a banana ready to eat.
    - Same colour as the sun in drawings.
    solution: 'Step 1: A ripe banana. Step 2: Yellow.'
    mistakes:
      violet: c1e9_colour
      indigo: c1e9_colour
  - prompt: Which colour is last in VIBGYOR?
    options:
    - red
    - violet
    - yellow
    answer: red
    difficulty: 2
    hints:
    - 'Look at the last letter: R.'
    - The colour of a tomato.
    solution: 'Step 1: VIBGYOR ends with R. Step 2: Red.'
    mistakes:
      violet: c1e9_colour
      yellow: c1e9_colour
  - prompt: Mix blue and yellow paint. Which rainbow colour do you get?
    options:
    - green
    - red
    - violet
    answer: green
    difficulty: 3
    hints:
    - It is the colour of leaves.
    - It sits between blue and yellow in the rainbow.
    solution: 'Step 1: Blue + yellow paint. Step 2: Green.'
    mistakes:
      red: c1e9_colour
      violet: c1e9_colour
  - prompt: How many colours are in two rainbows together?
    options:
    - fourteen
    - seven
    - two
    answer: fourteen
    difficulty: 3
    hints:
    - One rainbow has seven.
    - 7 and 7.
    solution: 'Step 1: 7 colours each. Step 2: 7 + 7 = 14.'
    mistakes:
      seven: c1e9_two
      two: c1e9_two
