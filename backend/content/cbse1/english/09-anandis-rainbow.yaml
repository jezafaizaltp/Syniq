# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 9. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 9
title: 'Anandi''s Rainbow (Unit 4: Seasons)'
concepts:
- code: cbse1e.u4.rainbow
  title: 'Anandi''s Rainbow (Unit 4: Seasons)'
  notes: |
    A story about a girl, Anandi, and a rainbow: seeing a rainbow after rain and its colours. Exact story details could
    not be confirmed and are kept general; questions focus on the rainbow, its colours, rain and sun, and colour words.
  explanations:
    text: 'This story is about Anandi and a rainbow. A rainbow comes when the sun shines while it is raining. It has seven colours: violet, indigo, blue, green, yellow, orange and red.'
    visual: Draw a rainbow with seven colour bands over a girl holding an umbrella.
    step_by_step: 1. Read the story. 2. When does a rainbow come? 3. Name its colours. 4. What colour do you like best?
    real_world: After the rain, look at the sky away from the sun to find a rainbow.
  picture:
    kind: flow
    steps:
    - Rain
    - Sun comes out
    - Rainbow!
    alt: First rain, then the sun comes out, and a rainbow appears.
  items:
  - prompt: 'A rainbow comes when there is:'
    options:
    - rain and sun
    - only night
    - only snow
    answer: rain and sun
    difficulty: 2
    hints:
    - Both together.
    - Sunshine after rain.
    solution: A rainbow needs rain and sun.
  - prompt: How many colours does a rainbow have?
    options:
    - seven
    - two
    - ten
    answer: seven
    difficulty: 1
    hints:
    - VIBGYOR.
    - Count the letters.
    solution: A rainbow has seven colours.
  - prompt: Which is a colour of the rainbow?
    options:
    - green
    - brown
    - black
    answer: green
    difficulty: 1
    hints:
    - Like leaves.
    - In the middle.
    solution: Green is a rainbow colour.
  - prompt: Where do we see a rainbow?
    options:
    - in the sky
    - under the ground
    - in a box
    answer: in the sky
    difficulty: 1
    hints:
    - Look up.
    - Like a big arch.
    solution: We see a rainbow in the sky.
  - prompt: Whose rainbow is the story about?
    options:
    - Anandi's
    - Ravi's
    - the monkey's
    answer: Anandi's
    difficulty: 1
    hints:
    - Read the title.
    - A girl's name.
    solution: It is Anandi's rainbow.
    mistakes:
      Ravi's: eng1_read_again
  - prompt: Which word is a colour?
    options:
    - blue
    - rain
    - sky
    answer: blue
    difficulty: 2
    hints:
    - It describes how things look.
    - Like the sea.
    solution: Blue is a colour.
    mistakes:
      sky: eng1_word
