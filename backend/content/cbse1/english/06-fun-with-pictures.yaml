# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 6. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 6
title: 'Fun with Pictures (Unit 3: Food)'
tips:
  e1_banana: "Think of a ripe banana in a fruit shop."
  e1_lemon: "A lemon makes your face scrunch up."
  e1_tomato: "A ripe tomato is the colour of a fire engine."
  e1_vegetable: "Apples and grapes are fruits. Which one grows under the ground and goes in a curry?"
  c1e6_food: Picture the food in your kitchen. Does it grow on a tree or plant, and how does it taste?
  c1e6_sound: Say both words slowly. Listen to the very first sound.

concepts:
- code: cbse1e.u3.funpics
  title: 'Fun with Pictures (Unit 3: Food)'
  notes: |
    A picture-based lesson about food: naming fruits, vegetables and foods in pictures, their colours and tastes.
    Questions practise naming and describing food.
  explanations:
    text: Look at the pictures of food. Name the fruits and vegetables. A banana is yellow, a tomato is red and a carrot is orange.
    visual: Draw a fruit basket with a yellow banana, a red apple and green grapes.
    step_by_step: 1. Look at each picture. 2. Name the food. 3. Say its colour. 4. Say if it is a fruit or a vegetable.
    real_world: At the market, fruits and vegetables are kept in heaps by colour.
  picture:
    kind: compare
    columns:
    - title: Food
      points:
      - banana
      - tomato
      - carrot
    - title: Colour
      points:
      - yellow
      - red
      - orange
    alt: A banana is yellow, a tomato is red and a carrot is orange.
  activity:
    type: sort
    prompt: 'Fun with Pictures: fruit or vegetable?'
    bins:
    - Fruit
    - Vegetable
    items:
    - label: 🍌 Banana
      bin: Fruit
      clue: Sweet, yellow.
      why: Banana is a fruit.
    - label: 🥕 Carrot
      bin: Vegetable
      clue: Orange, grows in soil.
      why: Carrot is a vegetable.
    - label: 🍇 Grapes
      bin: Fruit
      clue: Small and round.
      why: Grapes are fruit.
    - label: 🥔 Potato
      bin: Vegetable
      clue: Grows underground.
      why: Potato is a vegetable.
    - label: 🥭 Mango
      bin: Fruit
      clue: King of fruits.
      why: Mango is a fruit.
  lesson:
    - teach: 'Fruits are sweet and juicy: mango, banana, apple, orange, grapes. Vegetables are cooked or eaten raw: carrot, potato, tomato, peas, spinach.'
      picture:
        kind: compare
        columns:
        - title: fruits
          points:
          - mango
          - banana
          - apple
        - title: vegetables
          points:
          - carrot
          - potato
          - spinach
        alt: Fruits and vegetables.
      check:
        prompt: Which of these is a leafy vegetable?
        options:
        - spinach
        - mango
        - grapes
        answer: spinach
        why: Spinach is a leafy vegetable.
    - teach: 'Food has colours: a banana is yellow, a carrot is orange, peas are green, a tomato is red, grapes can be green or purple.'
      check:
        prompt: What colour are peas?
        options:
        - green
        - red
        - blue
        answer: green
        why: Peas are small and green.
    - teach: 'Food has tastes: sugar and mango are sweet, lemon is sour, chips are salty, karela is bitter. Words can start with the same sound: apple, ant, axe.'
      check:
        prompt: Which tastes sweet?
        options:
        - a ripe mango
        - a lemon
        - salt
        answer: a ripe mango
        why: A ripe mango is sweet.
  items:
  - prompt: What colour is a banana?
    options:
    - yellow
    - blue
    - black
    answer: yellow
    difficulty: 1
    hints:
    - Ripe banana.
    - Like the sun.
    solution: A banana is yellow.
    mistakes: {"blue": "e1_banana"}
  - prompt: Which is a fruit?
    options:
    - mango
    - potato
    - onion
    answer: mango
    difficulty: 1
    hints:
    - Sweet.
    - King of fruits.
    solution: A mango is a fruit.
    mistakes:
      potato: eng1_word
  - prompt: Which is a vegetable?
    options:
    - carrot
    - apple
    - grapes
    answer: carrot
    difficulty: 1
    hints:
    - Orange and long.
    - Grows in the ground.
    solution: A carrot is a vegetable.
    mistakes: {"apple": "e1_vegetable"}
  - prompt: 'A lemon tastes:'
    options:
    - sour
    - sweet
    - salty
    answer: sour
    difficulty: 2
    hints:
    - Makes your face scrunch.
    - Like tamarind.
    solution: A lemon is sour.
    mistakes: {"sweet": "e1_lemon"}
  - prompt: What colour is a ripe tomato?
    options:
    - red
    - purple
    - white
    answer: red
    difficulty: 1
    hints:
    - Like ketchup.
    - Red.
    solution: A ripe tomato is red.
    mistakes: {"purple": "e1_tomato"}
  - prompt: Which word begins with the same sound as 'apple'?
    options:
    - ant
    - ball
    - cat
    answer: ant
    difficulty: 2
    hints:
    - First sound a-.
    - Say them aloud.
    solution: Apple and ant both begin with 'a'.
    mistakes:
      ball: eng1_sound
  - prompt: Which of these is a sweet fruit?
    options:
    - banana
    - potato
    - onion
    answer: banana
    difficulty: 1
    hints:
    - It is sweet and yellow.
    - You peel it.
    solution: 'Step 1: Potato and onion are vegetables. Step 2: A banana is a fruit.'
    mistakes:
      potato: c1e6_food
      onion: c1e6_food
  - prompt: What colour is a carrot?
    options:
    - orange
    - blue
    - black
    answer: orange
    difficulty: 1
    hints:
    - Rabbits love it.
    - Same name as a fruit's colour.
    solution: 'Step 1: Picture a carrot. Step 2: It is orange.'
    mistakes:
      blue: c1e6_food
      black: c1e6_food
  - prompt: 'Salt tastes:'
    options:
    - salty
    - sweet
    - sour
    answer: salty
    difficulty: 1
    hints:
    - Sea water tastes like it.
    - Chips have it.
    solution: 'Step 1: Salt is in chips and sea water. Step 2: It tastes salty.'
    mistakes:
      sweet: c1e6_food
      sour: e1_lemon
  - prompt: Which word begins with the same sound as 'ball'?
    options:
    - bat
    - cat
    - doll
    answer: bat
    difficulty: 1
    hints:
    - Ball starts with 'b'.
    - Listen to the first sound.
    solution: 'Step 1: Ball starts with /b/. Step 2: Bat starts with /b/.'
    mistakes:
      cat: c1e6_sound
      doll: c1e6_sound
  - prompt: Which fruit grows in bunches?
    options:
    - grapes
    - watermelon
    - coconut
    answer: grapes
    difficulty: 2
    hints:
    - Many small round fruits on one stem.
    - Green or purple.
    solution: 'Step 1: Watermelon and coconut grow one by one. Step 2: Grapes grow in bunches.'
    mistakes:
      watermelon: c1e6_food
      coconut: c1e6_food
  - prompt: Which vegetable grows under the ground?
    options:
    - potato
    - tomato
    - brinjal
    answer: potato
    difficulty: 2
    hints:
    - We dig it out of the soil.
    - Tomatoes hang on plants.
    solution: 'Step 1: Tomato and brinjal grow on plants. Step 2: Potato grows under the ground.'
    mistakes:
      tomato: c1e6_food
      brinjal: c1e6_food
  - prompt: Which word begins with the same sound as 'mango'?
    options:
    - milk
    - nut
    - egg
    answer: milk
    difficulty: 2
    hints:
    - Mango starts with 'm'.
    - 'Close your lips: mmm.'
    solution: 'Step 1: Mango starts with /m/. Step 2: Milk starts with /m/.'
    mistakes:
      nut: c1e6_sound
      egg: c1e6_sound
  - prompt: A picture has 2 apples and 3 bananas. How many fruits?
    options:
    - five
    - two
    - three
    answer: five
    difficulty: 2
    hints:
    - Count all the fruits.
    - 2 and 3.
    solution: 'Step 1: 2 + 3. Step 2: Five fruits.'
    mistakes:
      two: c1e6_food
      three: c1e6_food
  - prompt: Which is red, a fruit and has small seeds on the outside?
    options:
    - strawberry
    - carrot
    - banana
    answer: strawberry
    difficulty: 3
    hints:
    - A carrot is a vegetable.
    - A banana is yellow.
    solution: 'Step 1: Carrot is a vegetable; banana is yellow. Step 2: A strawberry is red with tiny seeds outside.'
    mistakes:
      carrot: c1e6_food
      banana: c1e6_food
