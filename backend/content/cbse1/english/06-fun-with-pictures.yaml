# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 6. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 6
title: 'Fun with Pictures (Unit 3: Food)'
concepts:
- code: cbse1e.u3.funpics
  title: 'Fun with Pictures (Unit 3: Food)'
  notes: |
    A picture-based lesson about food: naming fruits, vegetables and foods in pictures, their colours and tastes.
    Questions practise naming and describing food.
  explanations:
    text: Look at the pictures of food. Name the fruits and vegetables. A banana is yellow, a tomato is red and a carrot is orange.
    visual: Draw a fruit basket with a yellow banana, a red apple and green grapes.
    step_by_step: 1. Look at each picture. 2. Name the food. 3. Say its colour. 4. Say if it is a fruit or a vegetable.
    real_world: At the market, fruits and vegetables are kept in heaps by colour.
  picture:
    kind: compare
    columns:
    - title: Food
      points:
      - banana
      - tomato
      - carrot
    - title: Colour
      points:
      - yellow
      - red
      - orange
    alt: A banana is yellow, a tomato is red and a carrot is orange.
  items:
  - prompt: What colour is a banana?
    options:
    - yellow
    - blue
    - black
    answer: yellow
    difficulty: 1
    hints:
    - Ripe banana.
    - Like the sun.
    solution: A banana is yellow.
  - prompt: Which is a fruit?
    options:
    - mango
    - potato
    - onion
    answer: mango
    difficulty: 1
    hints:
    - Sweet.
    - King of fruits.
    solution: A mango is a fruit.
    mistakes:
      potato: eng1_word
  - prompt: Which is a vegetable?
    options:
    - carrot
    - apple
    - grapes
    answer: carrot
    difficulty: 1
    hints:
    - Orange and long.
    - Grows in the ground.
    solution: A carrot is a vegetable.
  - prompt: 'A lemon tastes:'
    options:
    - sour
    - sweet
    - salty
    answer: sour
    difficulty: 2
    hints:
    - Makes your face scrunch.
    - Like tamarind.
    solution: A lemon is sour.
  - prompt: What colour is a ripe tomato?
    options:
    - red
    - purple
    - white
    answer: red
    difficulty: 1
    hints:
    - Like ketchup.
    - Red.
    solution: A ripe tomato is red.
  - prompt: Which word begins with the same sound as 'apple'?
    options:
    - ant
    - ball
    - cat
    answer: ant
    difficulty: 2
    hints:
    - First sound a-.
    - Say them aloud.
    solution: Apple and ant both begin with 'a'.
    mistakes:
      ball: eng1_sound
