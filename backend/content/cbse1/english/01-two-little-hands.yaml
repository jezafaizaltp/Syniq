# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 1. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 1
title: 'Two Little Hands (Unit 1: My Family and Me)'
tips:
  eng1_read_again: Look at the lesson and its pictures again. The answer is there.
  eng1_word: Say the word in a little sentence. Does it make sense?
  eng1_sound: Say both words aloud slowly. Listen to the first or last sound.
  e1_five_fingers: "Ten is for both hands. Hold up one hand and count."
  e1_hands_do: "We smell with our nose. What do two hands do when you're happy?"
  e1_wash_hands: "Germs on hands can go into our mouth with food."
concepts:
- code: cbse1e.u1.hands
  title: 'Two Little Hands (Unit 1: My Family and Me)'
  notes: |
    An action poem about our two little hands: clapping, waving, holding, helping. Exact lines are not reproduced here;
    questions focus on body parts, actions, counting fingers and rhyming words.
  explanations:
    text: This poem is about our two little hands. Our hands can clap, wave, hold a cup and help others. Each hand has five fingers.
    visual: 'Draw two hands: one clapping, one waving.'
    step_by_step: 1. Say the poem with actions. 2. What can hands do? 3. Count your fingers. 4. Find words that rhyme.
    real_world: We wash our hands before we eat.
  picture:
    kind: compare
    columns:
    - title: Hands can
      points:
      - clap
      - wave
      - hold
    - title: Feet can
      points:
      - walk
      - jump
      - kick
    alt: Hands can clap, wave and hold; feet can walk, jump and kick.
  activity:
    type: number_line
    min: 0
    max: 12
    step: 1
    start: 0
    prompt: 'Two Little Hands: count the fingers.'
    goals:
    - prompt: How many fingers on one hand?
      target: 5
      mistakes:
      - when:
          v: 10
        say: That's two hands. Count one hand only.
      - when:
          v: 4
        say: Count again, and don't forget the thumb.
    - prompt: How many fingers on two hands?
      target: 10
      mistakes:
      - when:
          v: 5
        say: That's one hand. Now add the other hand too.
      - when:
          v: 2
        say: That's the number of hands. Count the fingers.
  items:
  - prompt: How many hands do we have?
    options:
    - two
    - one
    - four
    answer: two
    difficulty: 1
    hints:
    - Left and right.
    - Look at them.
    solution: We have two hands.
    mistakes:
      four: eng1_read_again
  - prompt: How many fingers on one hand?
    options:
    - five
    - two
    - ten
    answer: five
    difficulty: 1
    hints:
    - Count them.
    - Thumb too.
    solution: One hand has five fingers.
    mistakes: {"ten": "e1_five_fingers"}
  - prompt: Which can our hands do?
    options:
    - clap
    - smell
    - hear
    answer: clap
    difficulty: 1
    hints:
    - Hands together.
    - Clap, clap!
    solution: Our hands can clap.
    mistakes: {"smell": "e1_hands_do"}
  - prompt: 'We wash our hands:'
    options:
    - before eating
    - never
    - only once a year
    answer: before eating
    difficulty: 2
    hints:
    - Keep germs away.
    - Food time.
    solution: We wash our hands before eating.
    mistakes: {"never": "e1_wash_hands"}
  - prompt: Which word rhymes with 'hand'?
    options:
    - sand
    - head
    - foot
    answer: sand
    difficulty: 2
    hints:
    - End sound -and.
    - Say them aloud.
    solution: Hand and sand rhyme.
    mistakes:
      head: eng1_sound
  - prompt: Which is an action word?
    options:
    - wave
    - hand
    - cup
    answer: wave
    difficulty: 2
    hints:
    - Something you do.
    - Bye-bye!
    solution: Wave is an action word.
    mistakes:
      hand: eng1_word
