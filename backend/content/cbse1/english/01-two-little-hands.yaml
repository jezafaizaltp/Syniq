# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 1. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 1
title: 'Two Little Hands (Unit 1: My Family and Me)'
tips:
  eng1_read_again: Look at the lesson and its pictures again. The answer is there.
  eng1_word: Say the word in a little sentence. Does it make sense?
  eng1_sound: Say both words aloud slowly. Listen to the first or last sound.
  e1_five_fingers: "Ten is for both hands. Hold up one hand and count."
  e1_hands_do: "We smell with our nose. What do two hands do when you're happy?"
  e1_wash_hands: "Germs on hands can go into our mouth with food."
  c1e1_count: Count each one slowly, touching your fingers as you go.
  c1e1_act: Try to do each word right now. Which one can you do?
  c1e1_body: Point to that part of your body. What does it help you do?
  c1e1_rhyme: Say both words aloud. Do the ends sound the same?
  c1e1_clean: Germs hide on hands. When could they get into your mouth?
concepts:
- code: cbse1e.u1.hands
  title: 'Two Little Hands (Unit 1: My Family and Me)'
  notes: |
    An action poem about our two little hands: clapping, waving, holding, helping. Exact lines are not reproduced here;
    questions focus on body parts, actions, counting fingers and rhyming words.
  explanations:
    text: This poem is about our two little hands. Our hands can clap, wave, hold a cup and help others. Each hand has five fingers.
    visual: 'Draw two hands: one clapping, one waving.'
    step_by_step: 1. Say the poem with actions. 2. What can hands do? 3. Count your fingers. 4. Find words that rhyme.
    real_world: We wash our hands before we eat.
  picture:
    kind: compare
    columns:
    - title: Hands can
      points:
      - clap
      - wave
      - hold
    - title: Feet can
      points:
      - walk
      - jump
      - kick
    alt: Hands can clap, wave and hold; feet can walk, jump and kick.
  activity:
    type: number_line
    min: 0
    max: 12
    step: 1
    start: 0
    prompt: 'Two Little Hands: count the fingers.'
    goals:
    - prompt: How many fingers on one hand?
      target: 5
      mistakes:
      - when:
          v: 10
        say: That's two hands. Count one hand only.
      - when:
          v: 4
        say: Count again, and don't forget the thumb.
    - prompt: How many fingers on two hands?
      target: 10
      mistakes:
      - when:
          v: 5
        say: That's one hand. Now add the other hand too.
      - when:
          v: 2
        say: That's the number of hands. Count the fingers.
  lesson:
    - teach: We have two hands. Each hand has five fingers. Our hands can clap, wave, hold, write, draw and help.
      picture:
        kind: flow
        steps:
        - clap
        - wave
        - hold
        - help
        alt: Things our hands can do.
      check:
        prompt: How many fingers on two hands?
        options:
        - ten
        - five
        - two
        answer: ten
        why: Five and five make ten.
      ways:
      - style: step_by_step
        teach: 'Play a finger game. Step 1: Hold up one hand. Step 2: Wiggle each finger one by one as you count. Step 3: Do the same with the other hand. Step 4: Put both hands together and clap.'
      - style: real_world
        teach: 'Our hands help at home all day: folding clothes, watering plants and carrying plates to the table.'
    - teach: 'Action words tell what we do: clap, wave, jump, run, write. You can act them out.'
      check:
        prompt: Which word can you act out with your hands?
        options:
        - clap
        - table
        - red
        answer: clap
        why: Clap is an action word.
      ways:
      - style: visual
        teach: Some more action words, and what each one means.
        picture:
          kind: compare
          columns:
          - title: Action word
            points:
            - hop
            - kick
            - pat
          - title: What we do
            points:
            - jump on one foot
            - hit a ball with your foot
            - touch something softly
          alt: Hop means jump on one foot. Kick means hit a ball with your foot. Pat means touch something softly.
      - style: real_world
        teach: In the game 'Simon says', the leader calls out action words like 'touch your nose', and everyone acts them out.
    - teach: 'Rhyming words end with the same sound: hand, sand, band. Clap, tap, map. We keep hands clean: wash with soap before eating and after the toilet.'
      check:
        prompt: Which word rhymes with 'clap'?
        options:
        - tap
        - cup
        - clean
        answer: tap
        why: Clap and tap both end with 'ap'.
      ways:
      - style: visual
        teach: Washing your hands properly, one step after another.
        picture:
          kind: flow
          steps:
          - Wet your hands
          - Rub them with soap
          - Rub between your fingers and under your nails
          - Rinse with clean water
          - Dry them on a clean towel
          alt: Wet your hands, rub them with soap, rub between your fingers and under your nails, rinse with clean water, and dry them on a clean towel.
      - style: step_by_step
        teach: 'Find a rhyme for ''cat''. Step 1: Say ''cat'' slowly. Step 2: Listen to the end sound: ''-at''. Step 3: Try words with that end: hat, bat, mat. Step 4: Say each one next to ''cat'' to check.'
  items:
  - prompt: How many hands do we have?
    options:
    - two
    - one
    - four
    answer: two
    difficulty: 1
    hints:
    - Left and right.
    - Look at them.
    solution: We have two hands.
    mistakes:
      four: eng1_read_again
  - prompt: How many fingers on one hand?
    options:
    - five
    - two
    - ten
    answer: five
    difficulty: 1
    hints:
    - Count them.
    - Thumb too.
    solution: One hand has five fingers.
    mistakes: {"ten": "e1_five_fingers"}
  - prompt: Which can our hands do?
    options:
    - clap
    - smell
    - hear
    answer: clap
    difficulty: 1
    hints:
    - Hands together.
    - Clap, clap!
    solution: Our hands can clap.
    mistakes: {"smell": "e1_hands_do"}
  - prompt: 'We wash our hands:'
    options:
    - before eating
    - never
    - only once a year
    answer: before eating
    difficulty: 2
    hints:
    - Keep germs away.
    - Food time.
    solution: We wash our hands before eating.
    mistakes: {"never": "e1_wash_hands"}
  - prompt: Which word rhymes with 'hand'?
    options:
    - sand
    - head
    - foot
    answer: sand
    difficulty: 2
    hints:
    - End sound -and.
    - Say them aloud.
    solution: Hand and sand rhyme.
    mistakes:
      head: eng1_sound
  - prompt: Which is an action word?
    options:
    - wave
    - hand
    - cup
    answer: wave
    difficulty: 2
    hints:
    - Something you do.
    - Bye-bye!
    solution: Wave is an action word.
    mistakes:
      hand: eng1_word
  - prompt: 'We write with our:'
    options:
    - hands
    - ears
    - nose
    answer: hands
    difficulty: 1
    hints:
    - What holds the pencil?
    - You have two of them, with fingers.
    solution: 'Step 1: A pencil needs to be held. Step 2: We write with our hands.'
    mistakes:
      ears: c1e1_body
      nose: c1e1_body
  - prompt: Which word rhymes with 'band'?
    options:
    - hand
    - bend
    - ball
    answer: hand
    difficulty: 1
    hints:
    - Band ends with 'and'.
    - Listen to the end sound.
    solution: 'Step 1: Band ends with ''and''. Step 2: Hand ends with ''and'' too.'
    mistakes:
      bend: c1e1_rhyme
      ball: c1e1_rhyme
  - prompt: 'We say goodbye by:'
    options:
    - waving our hand
    - closing our eyes
    - stamping our feet
    answer: waving our hand
    difficulty: 1
    hints:
    - Move your hand from side to side.
    - Bye-bye!
    solution: 'Step 1: Goodbye is shown with the hand. Step 2: We wave.'
    mistakes:
      closing our eyes: c1e1_body
      stamping our feet: c1e1_body
  - prompt: When should we wash our hands?
    options:
    - after using the toilet
    - only on Sundays
    - never
    answer: after using the toilet
    difficulty: 1
    hints:
    - Germs get on hands.
    - When are hands dirty?
    solution: 'Step 1: Toilets have germs. Step 2: Wash hands after using it.'
    mistakes:
      only on Sundays: c1e1_clean
      never: c1e1_clean
  - prompt: Which of these is a doing word?
    options:
    - clap
    - hand
    - five
    answer: clap
    difficulty: 1
    hints:
    - An action word is something you do.
    - Can you do it right now?
    solution: 'Step 1: Hand is a thing, five is a number. Step 2: Clap is an action.'
    mistakes:
      hand: c1e1_act
      five: c1e1_act
  - prompt: Clap 3 times, then 2 times. How many claps?
    options:
    - five
    - three
    - two
    answer: five
    difficulty: 2
    hints:
    - Count all the claps.
    - 3 and 2 more.
    solution: 'Step 1: 3 claps, then 2. Step 2: 3 + 2 = 5 claps.'
    mistakes:
      three: c1e1_count
      two: c1e1_count
  - prompt: Which do we wash our hands with?
    options:
    - soap and water
    - mud
    - oil
    answer: soap and water
    difficulty: 1
    hints:
    - It makes bubbles.
    - It takes germs away.
    solution: 'Step 1: Soap removes germs. Step 2: Water washes them off.'
    mistakes:
      mud: c1e1_clean
      oil: c1e1_clean
  - prompt: How can our hands help at home?
    options:
    - putting toys away
    - pushing a friend
    - throwing food
    answer: putting toys away
    difficulty: 2
    hints:
    - Helping makes things better.
    - Which one is kind?
    solution: 'Step 1: Pushing and throwing are not helpful. Step 2: Putting toys away helps.'
    mistakes:
      pushing a friend: c1e1_body
      throwing food: c1e1_body
  - prompt: Two children each hold up one hand. How many fingers?
    options:
    - ten
    - five
    - two
    answer: ten
    difficulty: 3
    hints:
    - One hand has five fingers.
    - Five and five.
    solution: 'Step 1: 5 fingers each. Step 2: 5 + 5 = 10 fingers.'
    mistakes:
      five: c1e1_count
      two: c1e1_count
  - prompt: 'Case: Asha has been playing in the mud and now wants to eat a banana. What should Asha do first?'
    options:
    - Wash hands with soap and water
    - Wipe hands on clothes
    - Eat the banana straight away
    answer: Wash hands with soap and water
    hints:
    - What is on Asha's hands after playing in mud?
    - How could that get into Asha's mouth?
    solution: Muddy hands carry germs. Washing with soap and water before eating keeps the germs out of Asha's mouth.
    mistakes:
      Wipe hands on clothes: c1e1_clean
      Eat the banana straight away: c1e1_clean
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are making up a song: ''Clap your hands and tap your feet, / Then sit down on your ___.'' Which word rhymes?'
    options:
    - seat
    - chair
    - bed
    answer: seat
    hints:
    - Say 'feet' slowly. What is its end sound?
    - Which word ends with the same sound?
    solution: '''Feet'' and ''seat'' both end with ''-eet'', so they rhyme.'
    mistakes:
      chair: c1e1_rhyme
      bed: c1e1_rhyme
    exam: competency
    difficulty: 2
