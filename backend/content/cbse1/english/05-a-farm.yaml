# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 5. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 5
title: 'A Farm (Unit 2: Life Around Us)'
tips:
  e1_duck: "Moo is a cow. A duck's sound starts with 'qu'."
  e1_eggs_hen: "Cows give milk. Which bird lays eggs on a farm?"
  e1_farmer: "A pilot flies planes. Who grows crops and keeps animals?"
  e1_milk_cow: "Hens give eggs. Which farm animal gives milk?"
  c1e5_animal: Picture the farm animal. What does it give us, or what sound does it make?
  c1e5_baby: Baby animals often have their own names. Think of a baby hen, cow or goat.
  c1e5_rhyme: Say both words aloud. Do the ends sound the same?

concepts:
- code: cbse1e.u2.farm
  title: 'A Farm (Unit 2: Life Around Us)'
  notes: |
    A poem about a farm and its animals and sounds: cows, hens, ducks, goats, and the farmer. Exact lines are not
    reproduced here; questions focus on farm animals, their sounds and their young ones.
  explanations:
    text: A farm has many animals. The cow says moo, the hen says cluck, the duck says quack and the goat says maa. The farmer looks after them.
    visual: Draw a farm with a cow, a hen, a duck and a goat, each with its sound in a bubble.
    step_by_step: 1. Say the poem aloud. 2. Name the animals. 3. Make each animal's sound. 4. What does the farmer do?
    real_world: We get milk from cows and eggs from hens.
  picture:
    kind: compare
    columns:
    - title: Animal
      points:
      - cow
      - hen
      - duck
    - title: Sound
      points:
      - moo
      - cluck
      - quack
    alt: A cow says moo, a hen says cluck and a duck says quack.
  activity:
    type: sort
    prompt: 'A Farm: who is the baby?'
    bins:
    - Calf
    - Chick
    - Kid
    - Duckling
    items:
    - label: Baby cow
      bin: Calf
      clue: Moo.
      why: A baby cow is a calf.
    - label: Baby hen
      bin: Chick
      clue: Cheep.
      why: A baby hen is a chick.
    - label: Baby goat
      bin: Kid
      clue: Maa.
      why: A baby goat is a kid.
    - label: Baby duck
      bin: Duckling
      clue: Quack.
      why: A baby duck is a duckling.
  lesson:
    - teach: A farm has animals and fields. Cows give milk. Hens lay eggs. Sheep give wool. Bullocks help plough fields. The farmer looks after them all.
      picture:
        kind: compare
        columns:
        - title: animal
          points:
          - cow
          - hen
          - sheep
        - title: gives us
          points:
          - milk
          - eggs
          - wool
        alt: Farm animals and what they give us.
      check:
        prompt: 'We get wool from a:'
        options:
        - sheep
        - hen
        - duck
        answer: sheep
        why: Sheep have thick wool that is cut to make clothes.
      ways:
      - style: step_by_step
        teach: 'Draw a farm. Step 1: Draw a fence around the edge of the page. Step 2: Draw a field of green crops. Step 3: Add some animals in a shed. Step 4: Draw the farmer giving them water.'
      - style: real_world
        teach: Many families in villages keep a cow or a few hens at home, so they have fresh milk or eggs every day.
    - teach: 'Farm sounds: cow moo, hen cluck, duck quack, goat maa, sheep baa, rooster cock-a-doodle-doo.'
      check:
        prompt: 'A sheep says:'
        options:
        - baa
        - moo
        - quack
        answer: baa
        why: Baa is the sheep's sound.
      ways:
      - style: visual
        teach: Some more farm animals, and the sounds they make.
        picture:
          kind: compare
          columns:
          - title: Animal
            points:
            - Horse
            - Donkey
            - Pig
          - title: Sound
            points:
            - neigh
            - hee-haw
            - oink
          alt: A horse says neigh, a donkey says hee-haw and a pig says oink.
      - style: real_world
        teach: Farmers know their animals by their sounds. A loud, worried call from a cow can mean its calf has wandered off.
    - teach: 'Baby animals have names: a baby cow is a calf, a baby hen is a chick, a baby goat is a kid, a baby duck is a duckling, a baby sheep is a lamb.'
      picture:
        kind: compare
        columns:
        - title: animal
          points:
          - cow
          - goat
          - duck
        - title: baby
          points:
          - calf
          - kid
          - duckling
        alt: Farm animals and their babies.
      check:
        prompt: 'A baby cow is called a:'
        options:
        - calf
        - chick
        - kid
        answer: calf
        why: A young cow is a calf.
      ways:
      - style: step_by_step
        teach: 'Match babies to their mothers. Step 1: Say a grown-up animal: horse. Step 2: Say its baby: foal. Step 3: Next pair: dog and puppy. Step 4: Then cat and kitten.'
      - style: real_world
        teach: Farmers keep baby animals close to their mothers at first, so that the babies can drink their mother's milk.
  items:
  - prompt: 'A duck says:'
    options:
    - quack
    - moo
    - baa
    answer: quack
    difficulty: 1
    hints:
    - It swims.
    - Qu...
    solution: A duck says quack.
    mistakes: {"moo": "e1_duck"}
  - prompt: 'We get milk from a:'
    options:
    - cow
    - hen
    - duck
    answer: cow
    difficulty: 1
    hints:
    - Big farm animal.
    - Moo.
    solution: We get milk from a cow.
    mistakes: {"hen": "e1_milk_cow"}
  - prompt: 'We get eggs from a:'
    options:
    - hen
    - cow
    - goat
    answer: hen
    difficulty: 1
    hints:
    - A bird on the farm.
    - Cluck.
    solution: We get eggs from a hen.
    mistakes: {"cow": "e1_eggs_hen"}
  - prompt: Who looks after a farm?
    options:
    - a farmer
    - a pilot
    - a dentist
    answer: a farmer
    difficulty: 1
    hints:
    - Works in the fields.
    - Grows crops.
    solution: A farmer looks after the farm.
    mistakes: {"a pilot": "e1_farmer"}
  - prompt: 'A baby hen is called a:'
    options:
    - chick
    - calf
    - kitten
    answer: chick
    difficulty: 2
    hints:
    - Small and yellow.
    - Cheep cheep.
    solution: A baby hen is a chick.
    mistakes:
      calf: eng1_word
  - prompt: Which word rhymes with 'goat'?
    options:
    - boat
    - cow
    - hen
    answer: boat
    difficulty: 2
    hints:
    - End sound -oat.
    - Say them aloud.
    solution: Goat and boat rhyme.
    mistakes:
      cow: eng1_sound
  - prompt: 'A goat says:'
    options:
    - maa
    - moo
    - woof
    answer: maa
    difficulty: 1
    hints:
    - Think of a goat calling.
    - It is not a cow or a dog.
    solution: 'Step 1: Goats bleat. Step 2: Maa.'
    mistakes:
      moo: c1e5_animal
      woof: c1e5_animal
  - prompt: 'A baby duck is called a:'
    options:
    - duckling
    - calf
    - lamb
    answer: duckling
    difficulty: 1
    hints:
    - The name starts like 'duck'.
    - Duck + ling.
    solution: 'Step 1: A young duck. Step 2: Duckling.'
    mistakes:
      calf: c1e5_baby
      lamb: c1e5_baby
  - prompt: Which animal helps the farmer plough the field?
    options:
    - bullock
    - hen
    - cat
    answer: bullock
    difficulty: 1
    hints:
    - It is big and strong.
    - It pulls the plough.
    solution: 'Step 1: Ploughing needs strength. Step 2: Bullocks pull the plough.'
    mistakes:
      hen: c1e5_animal
      cat: c1e5_animal
  - prompt: Which word rhymes with 'hen'?
    options:
    - pen
    - hat
    - hill
    answer: pen
    difficulty: 1
    hints:
    - Hen ends with 'en'.
    - Listen to the end.
    solution: 'Step 1: Hen ends with ''en''. Step 2: Pen ends with ''en''.'
    mistakes:
      hat: c1e5_rhyme
      hill: c1e5_rhyme
  - prompt: 'A baby sheep is called a:'
    options:
    - lamb
    - chick
    - puppy
    answer: lamb
    difficulty: 1
    hints:
    - It is soft and woolly.
    - Not a baby hen or dog.
    solution: 'Step 1: A young sheep. Step 2: Lamb.'
    mistakes:
      chick: c1e5_baby
      puppy: c1e5_baby
  - prompt: Which bird wakes up the farm in the morning?
    options:
    - rooster
    - owl
    - bat
    answer: rooster
    difficulty: 2
    hints:
    - Cock-a-doodle-doo!
    - It is a male hen.
    solution: 'Step 1: It crows at sunrise. Step 2: The rooster.'
    mistakes:
      owl: c1e5_animal
      bat: c1e5_animal
  - prompt: A farm has 3 cows and 4 hens. How many animals?
    options:
    - seven
    - three
    - four
    answer: seven
    difficulty: 2
    hints:
    - Count cows and hens together.
    - 3 and 4.
    solution: 'Step 1: 3 + 4. Step 2: Seven animals.'
    mistakes:
      three: c1e5_animal
      four: c1e5_animal
  - prompt: Which does NOT live on a farm?
    options:
    - a whale
    - a goat
    - a duck
    answer: a whale
    difficulty: 2
    hints:
    - Two of these live on farms.
    - Which one lives in the sea?
    solution: 'Step 1: Goats and ducks live on farms. Step 2: A whale lives in the sea.'
    mistakes:
      a goat: c1e5_animal
      a duck: c1e5_animal
  - prompt: 'Match: hen gives eggs, cow gives milk, sheep gives ___.'
    options:
    - wool
    - honey
    - eggs
    answer: wool
    difficulty: 3
    hints:
    - Think of a sweater.
    - Sheep have thick, soft coats.
    solution: 'Step 1: Sheep have thick coats. Step 2: They give wool.'
    mistakes:
      honey: c1e5_animal
      eggs: c1e5_animal
  - prompt: 'Case: A farmer needs wool to make warm blankets for the winter. Which animal on the farm can help?'
    options:
    - the sheep
    - the hen
    - the duck
    answer: the sheep
    hints:
    - Which farm animal has a thick, woolly coat?
    - What do hens and ducks give us?
    solution: Sheep give wool. Hens and ducks give eggs, not wool.
    mistakes:
      the hen: c1e5_animal
      the duck: c1e5_animal
    exam: case
    difficulty: 2
  - prompt: 'Situation: You are writing a farm poem: ''I saw a lamb, / It liked some ___.'' Which word rhymes?'
    options:
    - jam
    - grass
    - bread
    answer: jam
    hints:
    - Say 'lamb' slowly. What is its end sound?
    - Which word ends with the same sound?
    solution: '''Lamb'' and ''jam'' both end with the ''-am'' sound, so they rhyme.'
    mistakes:
      grass: c1e5_rhyme
      bread: c1e5_rhyme
    exam: competency
    difficulty: 2
