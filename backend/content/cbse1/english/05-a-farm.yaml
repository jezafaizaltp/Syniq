# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 5. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 5
title: 'A Farm (Unit 2: Life Around Us)'
tips:
  e1_duck: "Moo is a cow. A duck's sound starts with 'qu'."
  e1_eggs_hen: "Cows give milk. Which bird lays eggs on a farm?"
  e1_farmer: "A pilot flies planes. Who grows crops and keeps animals?"
  e1_milk_cow: "Hens give eggs. Which farm animal gives milk?"

concepts:
- code: cbse1e.u2.farm
  title: 'A Farm (Unit 2: Life Around Us)'
  notes: |
    A poem about a farm and its animals and sounds: cows, hens, ducks, goats, and the farmer. Exact lines are not
    reproduced here; questions focus on farm animals, their sounds and their young ones.
  explanations:
    text: A farm has many animals. The cow says moo, the hen says cluck, the duck says quack and the goat says maa. The farmer looks after them.
    visual: Draw a farm with a cow, a hen, a duck and a goat, each with its sound in a bubble.
    step_by_step: 1. Say the poem aloud. 2. Name the animals. 3. Make each animal's sound. 4. What does the farmer do?
    real_world: We get milk from cows and eggs from hens.
  picture:
    kind: compare
    columns:
    - title: Animal
      points:
      - cow
      - hen
      - duck
    - title: Sound
      points:
      - moo
      - cluck
      - quack
    alt: A cow says moo, a hen says cluck and a duck says quack.
  activity:
    type: sort
    prompt: 'A Farm: who is the baby?'
    bins:
    - Calf
    - Chick
    - Kid
    - Duckling
    items:
    - label: Baby cow
      bin: Calf
      clue: Moo.
      why: A baby cow is a calf.
    - label: Baby hen
      bin: Chick
      clue: Cheep.
      why: A baby hen is a chick.
    - label: Baby goat
      bin: Kid
      clue: Maa.
      why: A baby goat is a kid.
    - label: Baby duck
      bin: Duckling
      clue: Quack.
      why: A baby duck is a duckling.
  items:
  - prompt: 'A duck says:'
    options:
    - quack
    - moo
    - baa
    answer: quack
    difficulty: 1
    hints:
    - It swims.
    - Qu...
    solution: A duck says quack.
    mistakes: {"moo": "e1_duck"}
  - prompt: 'We get milk from a:'
    options:
    - cow
    - hen
    - duck
    answer: cow
    difficulty: 1
    hints:
    - Big farm animal.
    - Moo.
    solution: We get milk from a cow.
    mistakes: {"hen": "e1_milk_cow"}
  - prompt: 'We get eggs from a:'
    options:
    - hen
    - cow
    - goat
    answer: hen
    difficulty: 1
    hints:
    - A bird on the farm.
    - Cluck.
    solution: We get eggs from a hen.
    mistakes: {"cow": "e1_eggs_hen"}
  - prompt: Who looks after a farm?
    options:
    - a farmer
    - a pilot
    - a dentist
    answer: a farmer
    difficulty: 1
    hints:
    - Works in the fields.
    - Grows crops.
    solution: A farmer looks after the farm.
    mistakes: {"a pilot": "e1_farmer"}
  - prompt: 'A baby hen is called a:'
    options:
    - chick
    - calf
    - kitten
    answer: chick
    difficulty: 2
    hints:
    - Small and yellow.
    - Cheep cheep.
    solution: A baby hen is a chick.
    mistakes:
      calf: eng1_word
  - prompt: Which word rhymes with 'goat'?
    options:
    - boat
    - cow
    - hen
    answer: boat
    difficulty: 2
    hints:
    - End sound -oat.
    - Say them aloud.
    solution: Goat and boat rhyme.
    mistakes:
      cow: eng1_sound
