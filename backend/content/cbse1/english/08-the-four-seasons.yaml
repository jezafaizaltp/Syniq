# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 8. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 8
title: 'The Four Seasons (Unit 4: Seasons)'
concepts:
- code: cbse1e.u4.seasons
  title: 'The Four Seasons (Unit 4: Seasons)'
  notes: |
    A lesson about seasons: summer, rainy season (monsoon), winter and spring; weather, clothes and fun in each.
  explanations:
    text: There are different seasons. Summer is hot. In the rainy season it rains a lot. Winter is cold. In spring, flowers bloom.
    visual: 'Draw four boxes: a hot sun, rain clouds with an umbrella, a sweater, and flowers blooming.'
    step_by_step: 1. Read the lesson. 2. Name the seasons. 3. What is the weather in each? 4. What do we wear?
    real_world: We drink cool water and wear cotton clothes in summer.
  picture:
    kind: compare
    columns:
    - title: Season
      points:
      - summer
      - rainy
      - winter
      - spring
    - title: We see
      points:
      - hot sun
      - rain
      - cold mornings
      - flowers
    alt: Summer has a hot sun, the rainy season has rain, winter has cold mornings and spring has flowers.
  activity:
    type: sort
    prompt: 'The Four Seasons: which season?'
    bins:
    - Summer
    - Rainy
    - Winter
    items:
    - label: ☂️ Umbrella
      bin: Rainy
      clue: Keeps you dry.
      why: Umbrellas are for rain.
    - label: 🧣 Sweater and scarf
      bin: Winter
      clue: Cold days.
      why: We wear woollens in winter.
    - label: 🍦 Ice cream on a hot day
      bin: Summer
      clue: Very hot.
      why: Hot days are summer.
    - label: 🐸 Frogs in puddles
      bin: Rainy
      clue: Wet ground.
      why: Puddles come with rain.
    - label: 🥶 Cold mornings
      bin: Winter
      clue: Shivering.
      why: Winter is cold.
  items:
  - prompt: Which season is hot?
    options:
    - summer
    - winter
    - spring
    answer: summer
    difficulty: 1
    hints:
    - The sun is strong.
    - Ice-cream time.
    solution: Summer is hot.
  - prompt: 'We wear sweaters in:'
    options:
    - winter
    - summer
    - the rainy season
    answer: winter
    difficulty: 1
    hints:
    - It is cold.
    - Warm clothes.
    solution: We wear sweaters in winter.
  - prompt: 'We carry an umbrella in the:'
    options:
    - rainy season
    - winter
    - spring
    answer: rainy season
    difficulty: 1
    hints:
    - Keeps us dry.
    - Lots of rain.
    solution: We carry umbrellas in the rainy season.
  - prompt: 'Flowers bloom in:'
    options:
    - spring
    - winter
    - night
    answer: spring
    difficulty: 2
    hints:
    - Colourful season.
    - After winter.
    solution: Flowers bloom in spring.
  - prompt: How many seasons are in the lesson's title?
    options:
    - four
    - two
    - six
    answer: four
    difficulty: 2
    hints:
    - Read the title.
    - The Four ...
    solution: Four seasons.
    mistakes:
      two: eng1_read_again
  - prompt: Which is the opposite of 'hot'?
    options:
    - cold
    - big
    - wet
    answer: cold
    difficulty: 1
    hints:
    - Not hot.
    - Like ice.
    solution: Cold is the opposite of hot.
    mistakes:
      wet: eng1_word
