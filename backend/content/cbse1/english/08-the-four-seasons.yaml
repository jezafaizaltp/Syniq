# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 8. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 8
title: 'The Four Seasons (Unit 4: Seasons)'
tips:
  e1_hot_season: "Winter is cold. The hot season is when we eat ice-cream."
  e1_spring: "Flowers open when it starts to get warm after the cold."
  c1e8_season: 'Think what the weather is like then: hot, wet, cold or full of flowers?'
  c1e8_opp: Opposites are as far apart as they can be, like up and down.

concepts:
- code: cbse1e.u4.seasons
  title: 'The Four Seasons (Unit 4: Seasons)'
  notes: |
    A lesson about seasons: summer, rainy season (monsoon), winter and spring; weather, clothes and fun in each.
  explanations:
    text: There are different seasons. Summer is hot. In the rainy season it rains a lot. Winter is cold. In spring, flowers bloom.
    visual: 'Draw four boxes: a hot sun, rain clouds with an umbrella, a sweater, and flowers blooming.'
    step_by_step: 1. Read the lesson. 2. Name the seasons. 3. What is the weather in each? 4. What do we wear?
    real_world: We drink cool water and wear cotton clothes in summer.
  picture:
    kind: compare
    columns:
    - title: Season
      points:
      - summer
      - rainy
      - winter
      - spring
    - title: We see
      points:
      - hot sun
      - rain
      - cold mornings
      - flowers
    alt: Summer has a hot sun, the rainy season has rain, winter has cold mornings and spring has flowers.
  activity:
    type: sort
    prompt: 'The Four Seasons: which season?'
    bins:
    - Summer
    - Rainy
    - Winter
    items:
    - label: ☂️ Umbrella
      bin: Rainy
      clue: Keeps you dry.
      why: Umbrellas are for rain.
    - label: 🧣 Sweater and scarf
      bin: Winter
      clue: Cold days.
      why: We wear woollens in winter.
    - label: 🍦 Ice cream on a hot day
      bin: Summer
      clue: Very hot.
      why: Hot days are summer.
    - label: 🐸 Frogs in puddles
      bin: Rainy
      clue: Wet ground.
      why: Puddles come with rain.
    - label: 🥶 Cold mornings
      bin: Winter
      clue: Shivering.
      why: Winter is cold.
  lesson:
    - teach: 'In India we see seasons: summer (hot and sunny), rainy season or monsoon (lots of rain), winter (cold), and spring (flowers bloom, pleasant weather).'
      picture:
        kind: flow
        steps:
        - 'summer: hot'
        - 'rainy season: wet'
        - 'winter: cold'
        - 'spring: flowers'
        alt: The four seasons and their weather.
      check:
        prompt: Which season has lots of rain?
        options:
        - rainy season
        - summer
        - winter
        answer: rainy season
        why: The monsoon brings lots of rain.
      ways:
      - style: step_by_step
        teach: 'Make a season wheel. Step 1: Draw a circle and divide it into 4 parts. Step 2: Draw a bright sun in one part for summer. Step 3: Draw rain clouds in the next, then a sweater. Step 4: Draw flowers in the last part for spring.'
      - style: real_world
        teach: 'Farmers watch the seasons closely: many crops are sown when the monsoon rains arrive.'
    - teach: 'We wear different clothes: cotton clothes and a cap in summer, a raincoat in the rainy season, sweaters and woollen caps in winter.'
      picture:
        kind: compare
        columns:
        - title: season
          points:
          - summer
          - rainy
          - winter
        - title: we wear
          points:
          - cotton, cap
          - raincoat
          - sweater
        alt: Clothes for each season.
      check:
        prompt: 'In the rainy season we wear a:'
        options:
        - raincoat
        - woollen sweater
        - swimming cap
        answer: raincoat
        why: A raincoat keeps us dry.
      ways:
      - style: step_by_step
        teach: 'Get ready for the weather. Step 1: Look out of the window. Step 2: Hot and sunny? Take a cap and a water bottle. Step 3: Rainy? Take a raincoat. Step 4: Cold? Put on a sweater.'
      - style: real_world
        teach: In hill towns like Shimla, people wear thick woollen clothes in winter, while in Chennai people wear cotton almost all year.
    - teach: 'Each season has fun: summer mangoes and ice-cold water, paper boats in the rain, warm soup in winter, kites and flowers in spring. Opposites: hot and cold, wet and dry.'
      check:
        prompt: What is the opposite of 'wet'?
        options:
        - dry
        - cold
        - rain
        answer: dry
        why: Wet and dry are opposites.
      ways:
      - style: visual
        teach: More pairs of opposites about the weather and the time of day.
        picture:
          kind: compare
          columns:
          - title: Word
            points:
            - light
            - day
            - sunny
          - title: Opposite
            points:
            - dark
            - night
            - cloudy
          alt: Light and dark, day and night, and sunny and cloudy are opposites.
      - style: real_world
        teach: 'Each season has its own fun: flying kites on a windy spring day, or splashing in puddles in the rain.'
  items:
  - prompt: Which season is hot?
    options:
    - summer
    - winter
    - spring
    answer: summer
    difficulty: 1
    hints:
    - The sun is strong.
    - Ice-cream time.
    solution: Summer is hot.
    mistakes: {"winter": "e1_hot_season"}
  - prompt: 'We wear sweaters in:'
    options:
    - winter
    - summer
    - the rainy season
    answer: winter
    difficulty: 1
    hints:
    - It is cold.
    - Warm clothes.
    solution: We wear sweaters in winter.
    mistakes: {"summer": "m2_sweater"}
  - prompt: 'We carry an umbrella in the:'
    options:
    - rainy season
    - winter
    - spring
    answer: rainy season
    difficulty: 1
    hints:
    - Keeps us dry.
    - Lots of rain.
    solution: We carry umbrellas in the rainy season.
    mistakes: {"winter": "m2_umbrella"}
  - prompt: 'Flowers bloom in:'
    options:
    - spring
    - winter
    - night
    answer: spring
    difficulty: 2
    hints:
    - Colourful season.
    - After winter.
    solution: Flowers bloom in spring.
    mistakes: {"winter": "e1_spring"}
  - prompt: How many seasons are in the lesson's title?
    options:
    - four
    - two
    - six
    answer: four
    difficulty: 2
    hints:
    - Read the title.
    - The Four ...
    solution: Four seasons.
    mistakes:
      two: eng1_read_again
  - prompt: Which is the opposite of 'hot'?
    options:
    - cold
    - big
    - wet
    answer: cold
    difficulty: 1
    hints:
    - Not hot.
    - Like ice.
    solution: Cold is the opposite of hot.
    mistakes:
      wet: eng1_word
  - prompt: 'In summer the weather is:'
    options:
    - hot
    - snowy
    - freezing
    answer: hot
    difficulty: 1
    hints:
    - The sun shines strongly.
    - We sweat a lot.
    solution: 'Step 1: Summer has a strong sun. Step 2: It is hot.'
    mistakes:
      snowy: c1e8_season
      freezing: c1e8_season
  - prompt: 'We drink warm soup and wear sweaters in:'
    options:
    - winter
    - summer
    - spring
    answer: winter
    difficulty: 1
    hints:
    - It is cold outside.
    - We want to feel warm.
    solution: 'Step 1: Sweaters are for cold days. Step 2: Winter.'
    mistakes:
      summer: c1e8_season
      spring: c1e8_season
  - prompt: 'Children float paper boats in the:'
    options:
    - rainy season
    - winter
    - summer
    answer: rainy season
    difficulty: 1
    hints:
    - Boats need water on the ground.
    - Puddles everywhere.
    solution: 'Step 1: Puddles form in the rain. Step 2: Paper boats in the rainy season.'
    mistakes:
      winter: c1e8_season
      summer: c1e8_season
  - prompt: Which fruit do we enjoy most in summer?
    options:
    - mango
    - snowball
    - pumpkin pie
    answer: mango
    difficulty: 1
    hints:
    - The king of fruits.
    - It is yellow and sweet.
    solution: 'Step 1: Mangoes ripen in summer. Step 2: Mango.'
    mistakes:
      snowball: c1e8_season
      pumpkin pie: c1e8_season
  - prompt: What is the opposite of 'cold'?
    options:
    - hot
    - wet
    - windy
    answer: hot
    difficulty: 1
    hints:
    - Ice is cold; the sun is ...
    - Summer weather.
    solution: 'Step 1: Cold is like ice. Step 2: The opposite is hot.'
    mistakes:
      wet: c1e8_opp
      windy: c1e8_opp
  - prompt: Which season comes when trees get new leaves and flowers?
    options:
    - spring
    - winter
    - rainy season
    answer: spring
    difficulty: 2
    hints:
    - Gardens become colourful.
    - After winter.
    solution: 'Step 1: After cold winter, plants grow again. Step 2: Spring.'
    mistakes:
      winter: e1_spring
      rainy season: e1_spring
  - prompt: Which should we carry on a rainy day?
    options:
    - an umbrella
    - sunglasses only
    - a sweater only
    answer: an umbrella
    difficulty: 2
    hints:
    - It keeps rain off your head.
    - Open it up.
    solution: 'Step 1: Rain falls from above. Step 2: An umbrella keeps us dry.'
    mistakes:
      sunglasses only: c1e8_season
      a sweater only: c1e8_season
  - prompt: Why do we drink lots of water in summer?
    options:
    - we sweat and lose water
    - water is cold only in summer
    - to sleep more
    answer: we sweat and lose water
    difficulty: 2
    hints:
    - What happens to our body when it is hot?
    - We get thirsty.
    solution: 'Step 1: Heat makes us sweat. Step 2: We drink water to replace it.'
    mistakes:
      water is cold only in summer: c1e8_season
      to sleep more: c1e8_season
  - prompt: Winter, then spring, then summer. What comes after summer here?
    options:
    - rainy season
    - winter
    - spring
    answer: rainy season
    difficulty: 3
    hints:
    - After the hot days come the clouds.
    - The monsoon.
    solution: 'Step 1: In much of India, summer heat ends with the monsoon. Step 2: The rainy season.'
    mistakes:
      winter: c1e8_season
      spring: c1e8_season
  - prompt: 'Case: It is pouring with rain. Mina is getting ready for school and wants to wear new cloth shoes and take no umbrella. What is the better plan?'
    options:
    - Wear a raincoat and rain shoes, and take an umbrella
    - Wear the cloth shoes and run fast
    - Stay at home on every rainy day
    answer: Wear a raincoat and rain shoes, and take an umbrella
    hints:
    - What is the weather like today?
    - What do we wear and carry in the rainy season?
    solution: In the rainy season, a raincoat, rain shoes and an umbrella keep us dry on the way to school.
    mistakes:
      Wear the cloth shoes and run fast: c1e8_season
      Stay at home on every rainy day: c1e8_season
    exam: case
    difficulty: 2
  - prompt: 'Situation: It is very cold and windy outside. Which clothes should you put on?'
    options:
    - a sweater and a woollen cap
    - cotton shorts and a cap
    - a swimsuit
    answer: a sweater and a woollen cap
    hints:
    - Which season is cold?
    - What do we wear to stay warm then?
    solution: 'Cold weather means winter clothes: a sweater and a woollen cap keep us warm.'
    mistakes:
      cotton shorts and a cap: c1e8_season
      a swimsuit: c1e8_season
    exam: competency
    difficulty: 2
