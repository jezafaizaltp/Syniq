# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 2. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 2
title: 'Greetings (Unit 1: My Family and Me)'
tips:
  e1_good_night: "We say this greeting when it is dark and time to sleep."
  e1_please: "The magic word we use when we ask for something."
  e1_sorry: "You hurt someone by mistake. What do you say to make it right?"
  e1_thank_you: "'Sorry' is for a mistake. What do we say when someone is kind to us?"
  c1e2_time: Think about what time of day it is. Which greeting fits that time?
  c1e2_polite: Which words would make the other person feel happy and respected?

concepts:
- code: cbse1e.u1.greetings
  title: 'Greetings (Unit 1: My Family and Me)'
  notes: |
    A lesson about greeting people: good morning, good afternoon, good evening, good night, hello, thank you, sorry,
    please, and namaste. Polite words and when to use them.
  explanations:
    text: We greet people with kind words. In the morning we say 'Good morning'. Before bed we say 'Good night'. We say 'Thank you' when someone helps us and 'Sorry' when we make a mistake.
    visual: Draw a child waving to a teacher with a speech bubble 'Good morning!'
    step_by_step: 1. Read the lesson. 2. Which greeting for which time? 3. When do we say thank you, sorry and please? 4. Practise with a friend.
    real_world: In India many people greet with 'Namaste', joining their hands.
  picture:
    kind: flow
    steps:
    - Good morning
    - Good afternoon
    - Good evening
    - Good night
    alt: 'Greetings through the day: good morning, good afternoon, good evening, good night.'
  activity:
    type: sort
    prompt: 'Greetings: which one?'
    bins:
    - Good morning
    - Good night
    - Thank you
    - Sorry
    items:
    - label: 🌅 You wake up
      bin: Good morning
      clue: Start of the day.
      why: We say good morning when the day begins.
    - label: 🛏️ Going to bed
      bin: Good night
      clue: End of the day.
      why: Good night before sleep.
    - label: 🎁 Someone gives you a gift
      bin: Thank you
      clue: To show you're grateful.
      why: Say thank you for a gift.
    - label: 😟 You bump into someone
      bin: Sorry
      clue: An accident.
      why: Say sorry when you hurt someone.
  lesson:
    - teach: We greet people when we meet them. Good morning before lunch, good afternoon after lunch, good evening when the sun goes down. Good night is said before sleeping.
      picture:
        kind: flow
        steps:
        - Good morning
        - Good afternoon
        - Good evening
        - Good night
        alt: Greetings for different times of day.
      check:
        prompt: 'You meet a friend in the evening. You say:'
        options:
        - Good evening
        - Good morning
        - Good night
        answer: Good evening
        why: In the evening we say good evening.
      ways:
      - style: step_by_step
        teach: 'Choose the right greeting. Step 1: Look at the clock or the sky. Step 2: Before lunch, say ''Good morning''. Step 3: After lunch, say ''Good afternoon''. Step 4: When the sun goes down, say ''Good evening''.'
      - style: real_world
        teach: On the radio and TV, the news reader begins with 'Good morning' or 'Good evening', depending on the time of day.
    - teach: 'Magic words: please (when asking), thank you (when given something), sorry (when we make a mistake), excuse me (to get attention or pass).'
      picture:
        kind: compare
        columns:
        - title: When
          points:
          - asking
          - getting a gift
          - making a mistake
        - title: We say
          points:
          - please
          - thank you
          - sorry
        alt: Polite words and when to use them.
      check:
        prompt: 'You want to pass someone in a narrow corridor. You say:'
        options:
        - Excuse me
        - Good night
        - Thank you
        answer: Excuse me
        why: Excuse me asks politely to pass.
      ways:
      - style: step_by_step
        teach: 'Use ''excuse me''. Step 1: Someone is standing in your way. Step 2: Say, ''Excuse me, please.'' Step 3: Wait for them to move. Step 4: Say ''Thank you'' as you pass.'
      - style: real_world
        teach: At a shop, saying 'please' when you ask and 'thank you' when you get your things makes the shopkeeper smile.
    - teach: 'We greet in many ways: hello, hi, namaste with joined hands, a smile or a wave. Greeting makes people feel welcome.'
      check:
        prompt: Which is a greeting?
        options:
        - Hello
        - Table
        - Run
        answer: Hello
        why: Hello is said when we meet someone.
      ways:
      - style: visual
        teach: Words and actions we can use to greet people.
        picture:
          kind: compare
          columns:
          - title: Words
            points:
            - Hello
            - Hi
            - Namaste
          - title: Actions
            points:
            - A smile
            - A wave
            - Joined hands
          alt: We can greet people with words like hello, hi and namaste, or with a smile, a wave or joined hands.
      - style: real_world
        teach: 'People greet in many words across India: ''Namaskaram'' in Kerala, ''Vanakkam'' in Tamil Nadu and ''Sat Sri Akal'' in Punjab.'
  items:
  - prompt: 'When we meet our teacher in the morning, we say:'
    options:
    - Good morning
    - Good night
    - Sorry
    answer: Good morning
    difficulty: 1
    hints:
    - Time of day.
    - Morning.
    solution: We say 'Good morning'.
    mistakes:
      Good night: eng1_read_again
  - prompt: 'Before going to bed, we say:'
    options:
    - Good night
    - Good morning
    - Hello
    answer: Good night
    difficulty: 1
    hints:
    - Bed time.
    - Night.
    solution: We say 'Good night'.
    mistakes: {"Good morning": "e1_good_night"}
  - prompt: 'When someone gives you a gift, you say:'
    options:
    - Thank you
    - Sorry
    - Go away
    answer: Thank you
    difficulty: 1
    hints:
    - Be grateful.
    - Polite words.
    solution: We say 'Thank you'.
    mistakes: {"Sorry": "e1_thank_you"}
  - prompt: 'If you push someone by mistake, you say:'
    options:
    - Sorry
    - Thank you
    - Good night
    answer: Sorry
    difficulty: 1
    hints:
    - You made a mistake.
    - Say you feel bad.
    solution: We say 'Sorry'.
    mistakes: {"Thank you": "e1_sorry"}
  - prompt: 'When asking for something, we say:'
    options:
    - please
    - sorry
    - bye
    answer: please
    difficulty: 2
    hints:
    - The magic word.
    - Can I have it, ...?
    solution: We say 'please'.
    mistakes: {"sorry": "e1_please"}
  - prompt: '''Namaste'' is said:'
    options:
    - with joined hands
    - with a jump
    - with a shout
    answer: with joined hands
    difficulty: 2
    hints:
    - Palms together.
    - A respectful greeting.
    solution: We say Namaste with joined hands.
    mistakes:
      with a shout: eng1_word
  - prompt: 'You come to school in the morning. You say to your teacher:'
    options:
    - Good morning
    - Good evening
    - Good night
    answer: Good morning
    difficulty: 1
    hints:
    - School starts early in the day.
    - Which time of day is it?
    solution: 'Step 1: It is morning. Step 2: Say good morning.'
    mistakes:
      Good evening: c1e2_time
      Good night: c1e2_time
  - prompt: 'A friend shares a crayon with you. You say:'
    options:
    - Thank you
    - Sorry
    - Good night
    answer: Thank you
    difficulty: 1
    hints:
    - Your friend did something nice.
    - How do you show you are glad?
    solution: 'Step 1: Your friend gave you something. Step 2: Say thank you.'
    mistakes:
      Sorry: c1e2_polite
      Good night: c1e2_polite
  - prompt: 'You spill water on a friend''s book. You say:'
    options:
    - Sorry
    - Thank you
    - Hello
    answer: Sorry
    difficulty: 1
    hints:
    - You made a mistake.
    - What do we say after a mistake?
    solution: 'Step 1: You made a mistake. Step 2: Say sorry.'
    mistakes:
      Thank you: c1e2_polite
      Hello: c1e2_polite
  - prompt: Which is the polite way to ask for water?
    options:
    - May I have some water, please?
    - Give water!
    - Water now.
    answer: May I have some water, please?
    difficulty: 1
    hints:
    - Look for a magic word.
    - Which one sounds kind?
    solution: 'Step 1: Asking needs ''please''. Step 2: ''May I have some water, please?'''
    mistakes:
      Give water!: c1e2_polite
      Water now.: c1e2_polite
  - prompt: 'After lunch you meet your neighbour. You say:'
    options:
    - Good afternoon
    - Good morning
    - Good night
    answer: Good afternoon
    difficulty: 2
    hints:
    - Lunch is in the middle of the day.
    - After lunch is ...
    solution: 'Step 1: After lunch is afternoon. Step 2: Say good afternoon.'
    mistakes:
      Good morning: c1e2_time
      Good night: c1e2_time
  - prompt: 'Someone says ''Thank you'' to you. You can say:'
    options:
    - You're welcome
    - Sorry
    - Good night
    answer: You're welcome
    difficulty: 2
    hints:
    - They are thanking you.
    - A kind reply.
    solution: 'Step 1: They said thank you. Step 2: Reply ''You''re welcome''.'
    mistakes:
      Sorry: c1e2_polite
      Good night: c1e2_polite
  - prompt: Which is said when we meet, not when we leave?
    options:
    - Hello
    - Goodbye
    - See you later
    answer: Hello
    difficulty: 2
    hints:
    - Two of these are said at the end.
    - Which one starts a meeting?
    solution: 'Step 1: Goodbye and see you later are for leaving. Step 2: Hello is for meeting.'
    mistakes:
      Goodbye: c1e2_polite
      See you later: c1e2_polite
  - prompt: 'How many magic words: please, thank you, sorry?'
    options:
    - three
    - two
    - five
    answer: three
    difficulty: 1
    hints:
    - Count each one.
    - Please is one.
    solution: 'Step 1: please 1, thank you 2, sorry 3. Step 2: three.'
    mistakes:
      two: c1e2_polite
      five: c1e2_polite
  - prompt: Your grandmother visits in the morning and leaves at night. What do you say when she leaves?
    options:
    - Good night, see you soon!
    - Good morning!
    - Excuse me!
    answer: Good night, see you soon!
    difficulty: 3
    hints:
    - It is night when she leaves.
    - You are saying bye.
    solution: 'Step 1: It is night and she is leaving. Step 2: ''Good night, see you soon!'''
    mistakes:
      Good morning!: c1e2_time
      Excuse me!: c1e2_polite
  - prompt: 'Case: In the evening, as the sun is going down, Ravi meets a neighbour at the gate. What should Ravi say?'
    options:
    - Good evening
    - Good morning
    - Good night
    answer: Good evening
    hints:
    - What time of day is it?
    - Is Ravi meeting the neighbour, or going to sleep?
    solution: When the sun is going down and we meet someone, we say 'Good evening'. 'Good night' is said before sleeping.
    mistakes:
      Good morning: c1e2_time
      Good night: c1e2_time
    exam: case
    difficulty: 2
  - prompt: 'Situation: You want to borrow a friend''s eraser. Which is the polite way to ask?'
    options:
    - Can I use your eraser, please?
    - Give me your eraser!
    - Eraser, now.
    answer: Can I use your eraser, please?
    hints:
    - Which magic word do we use when asking?
    - Which choice would make your friend happy to help?
    solution: Asking with 'please' is polite and makes your friend feel respected.
    mistakes:
      Give me your eraser!: c1e2_polite
      Eraser, now.: c1e2_polite
    exam: competency
    difficulty: 2
