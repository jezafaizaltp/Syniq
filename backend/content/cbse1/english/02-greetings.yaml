# CBSE Class 1 English (NCERT Mridang, 2024-25), chapter 2. Format: content/README.md.
# Chapter list from published lists (two agree); chapter details from general knowledge, kept general where unsure (see README).
subject: cbse1-eng
chapter: 2
title: 'Greetings (Unit 1: My Family and Me)'
concepts:
- code: cbse1e.u1.greetings
  title: 'Greetings (Unit 1: My Family and Me)'
  notes: |
    A lesson about greeting people: good morning, good afternoon, good evening, good night, hello, thank you, sorry,
    please, and namaste. Polite words and when to use them.
  explanations:
    text: We greet people with kind words. In the morning we say 'Good morning'. Before bed we say 'Good night'. We say 'Thank you' when someone helps us and 'Sorry' when we make a mistake.
    visual: Draw a child waving to a teacher with a speech bubble 'Good morning!'
    step_by_step: 1. Read the lesson. 2. Which greeting for which time? 3. When do we say thank you, sorry and please? 4. Practise with a friend.
    real_world: In India many people greet with 'Namaste', joining their hands.
  picture:
    kind: flow
    steps:
    - Good morning
    - Good afternoon
    - Good evening
    - Good night
    alt: 'Greetings through the day: good morning, good afternoon, good evening, good night.'
  items:
  - prompt: 'When we meet our teacher in the morning, we say:'
    options:
    - Good morning
    - Good night
    - Sorry
    answer: Good morning
    difficulty: 1
    hints:
    - Time of day.
    - Morning.
    solution: We say 'Good morning'.
    mistakes:
      Good night: eng1_read_again
  - prompt: 'Before going to bed, we say:'
    options:
    - Good night
    - Good morning
    - Hello
    answer: Good night
    difficulty: 1
    hints:
    - Bed time.
    - Night.
    solution: We say 'Good night'.
  - prompt: 'When someone gives you a gift, you say:'
    options:
    - Thank you
    - Sorry
    - Go away
    answer: Thank you
    difficulty: 1
    hints:
    - Be grateful.
    - Polite words.
    solution: We say 'Thank you'.
  - prompt: 'If you push someone by mistake, you say:'
    options:
    - Sorry
    - Thank you
    - Good night
    answer: Sorry
    difficulty: 1
    hints:
    - You made a mistake.
    - Say you feel bad.
    solution: We say 'Sorry'.
  - prompt: 'When asking for something, we say:'
    options:
    - please
    - sorry
    - bye
    answer: please
    difficulty: 2
    hints:
    - The magic word.
    - Can I have it, ...?
    solution: We say 'please'.
  - prompt: '''Namaste'' is said:'
    options:
    - with joined hands
    - with a jump
    - with a shout
    answer: with joined hands
    difficulty: 2
    hints:
    - Palms together.
    - A respectful greeting.
    solution: We say Namaste with joined hands.
    mistakes:
      with a shout: eng1_word
