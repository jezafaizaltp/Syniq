# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 12. Format: content/README.md.
subject: cbse7-sci
chapter: 12
title: Earth, Moon and the Sun
tips:
  c7s_rotate_revolve: Rotation (spinning, 24 hours) gives day and night; revolution (round the Sun) gives the year.
  c7s_eclipse: 'Solar eclipse: the Moon blocks the Sun. Lunar eclipse: the Earth''s shadow falls on the Moon.'
  t7_eclipse_eyes: "Sunlight can burn the retina, even when part of the Sun is covered."
  t7_leap_days: "A leap year has one extra day added to 365."
  t7_lunar_eclipse: "The Earth's shadow falls on the Moon only when the Earth is between the Sun and the Moon."
  t7_lunar_month: "From one full moon to the next is about a month."
  t7_moon_reflects: "The Moon has no light of its own."
  t7_purnima: "Purnima is the night of the brightest, fullest moon."
  t7_quarter_days: "Four quarter-days make how many whole days?"
  t7_rotation_day: "One rotation of the Earth makes one day and night."
  t7_seasons_tilt: "Earth is actually closest to the Sun in January. So distance can't explain summer. What does?"
  t7_sun_east: "The Earth spins west to east, so the Sun seems to move the other way across our sky. Where does it start in the morning?"
concepts:
- code: cbse7s.sky.daynight
  title: Day, night and seasons
  notes: |
    The Earth spins (rotates) on its axis from west to east once in about 24 hours, causing day and night; the
    Sun seems to rise in the east and set in the west. The Earth goes round (revolves around) the Sun once in
    about 365¼ days, a year (the extra quarter gives a leap year every 4 years). The axis is tilted, so in
    different months one hemisphere leans towards the Sun (summer: longer days, more direct rays) and then away
    (winter). The Sun's rising point shifts along the horizon through the year.
  explanations:
    text: The Earth spins once a day, which gives us day and night, and travels round the Sun once a year. Because the Earth is tilted, each half leans towards the Sun for part of the year (summer) and away for another part (winter).
    visual: 'Shine a torch on a globe in a dark room and turn it slowly: the side facing the torch has day, the other night. Walk the tilted globe round the torch: the northern half leans towards it for some of the circuit and away for the rest.'
    step_by_step: 'Step 1: Rotation (spinning, 24 h) causes day and night. Step 2: Revolution (going round the Sun, about 365 days) makes a year. Step 3: The tilt causes seasons. Step 4: Every fourth year adds a day: a leap year.'
    real_world: February has 29 days in a leap year, such as 2028, to account for the extra quarter day each year.
  picture:
    kind: compare
    columns:
    - title: Rotation
      points:
      - Spinning on its axis
      - About 24 hours
      - Causes day and night
    - title: Revolution
      points:
      - Going round the Sun
      - About 365¼ days
      - With the tilt, causes seasons
    alt: Rotation (spinning, about 24 hours) causes day and night; revolution (orbiting the Sun, about 365¼ days) with the tilt causes seasons.
  activity:
    type: sort
    prompt: 'What causes it: the Earth''s spin, its trip round the Sun, or its tilt?'
    bins:
    - Spin
    - Trip round the Sun
    - Tilt
    items:
    - label: Day and night
      bin: Spin
      clue: Happens every 24 hours.
      why: The Earth turning on its axis.
    - label: The Sun seems to rise in the east
      bin: Spin
      clue: The Earth turns from west to east.
      why: Rotation.
    - label: Stars seem to move across the night sky
      bin: Spin
      clue: Over a few hours.
      why: We are turning.
    - label: One year is about 365 days
      bin: Trip round the Sun
      clue: How long one orbit takes.
      why: Revolution.
    - label: Different stars are seen in different months
      bin: Trip round the Sun
      clue: Our night side faces a different part of space.
      why: We have moved along our orbit.
    - label: Summer when our half leans towards the Sun
      bin: Tilt
      clue: The axis isn't upright.
      why: The tilt causes seasons.
    - label: Long days in June in north India
      bin: Tilt
      clue: Our half leans towards the Sun then.
      why: Tilt.
  items:
  - prompt: What causes day and night?
    options:
    - The Earth rotating on its axis
    - The Earth going round the Sun
    - The Moon blocking the Sun
    - Clouds
    answer: The Earth rotating on its axis
    difficulty: 1
    hints:
    - It happens every 24 hours.
    - Spinning.
    solution: Rotation turns each place towards and away from the Sun.
    mistakes:
      The Earth going round the Sun: c7s_rotate_revolve
  - prompt: About how many hours does the Earth take to rotate once?
    answer: '24'
    check: '24'
    difficulty: 1
    hints:
    - One day.
    - Day and night together.
    solution: About 24 hours.
    mistakes: {"365": "t7_rotation_day", "12": "t7_rotation_day"}
  - prompt: What causes the seasons?
    options:
    - The tilt of the Earth's axis as it goes round the Sun
    - The Earth getting closer to the Sun in summer
    - The Moon's phases
    - The Earth's rotation
    answer: The tilt of the Earth's axis as it goes round the Sun
    difficulty: 2
    hints:
    - Not distance.
    - Tilt.
    solution: The tilted axis makes each hemisphere lean towards the Sun for part of the year.
    mistakes: {"The Earth getting closer to the Sun in summer": "t7_seasons_tilt", "The Earth's rotation": "t7_seasons_tilt"}
  - prompt: In which direction does the Sun appear to rise?
    options:
    - East
    - West
    - North
    - South
    answer: East
    difficulty: 1
    hints:
    - The Earth spins west to east.
    - Morning sun.
    solution: The Sun appears to rise in the east.
    mistakes: {"West": "t7_sun_east", "North": "t7_sun_east"}
  - prompt: How many days are there in a leap year?
    answer: '366'
    check: 365 + 1
    difficulty: 1
    hints:
    - One extra day.
    - 29 February.
    solution: 365 + 1 = 366.
    mistakes: {"365": "t7_leap_days", "364": "t7_leap_days"}
  - prompt: A year is about 365¼ days. After 4 years, how many extra quarter-days have added up to make a whole day?
    answer: '1'
    check: 4*Rational(1,4)
    difficulty: 2
    hints:
    - 4 × ¼.
    - That is why leap years come every 4 years.
    solution: 4 × ¼ = 1 whole day.
    mistakes: {"4": "t7_quarter_days", "0.25": "t7_quarter_days"}
- code: cbse7s.sky.moon
  title: Phases of the Moon and eclipses
  after:
  - cbse7s.sky.daynight
  notes: |
    The Moon does not make its own light; it reflects sunlight. As it goes round the Earth (about 29.5 days from
    one new moon to the next), we see different amounts of its lit half: new moon (amavasya), waxing crescent,
    first quarter, waxing gibbous, full moon (purnima), then waning back. The same side of the Moon always faces
    Earth. A solar eclipse happens when the Moon passes between the Sun and Earth (only at new moon); a lunar
    eclipse when the Earth's shadow falls on the Moon (only at full moon). Never look at the Sun directly.
  explanations:
    text: 'The Moon shines by reflecting sunlight. As it travels round the Earth over about a month, we see more or less of its sunlit side: new moon, crescent, half, full, and back again. Eclipses happen when the Sun, Earth and Moon line up.'
    visual: 'Hold a ball at arm''s length in a room lit by one lamp and turn slowly round: the lit part of the ball you see grows from a sliver to full and shrinks back, like the Moon''s phases.'
    step_by_step: 'Step 1: Half the Moon is always lit by the Sun. Step 2: Its position round the Earth decides how much of that half we see. Step 3: Solar eclipse: Moon between Sun and Earth. Step 4: Lunar eclipse: Earth between Sun and Moon.'
    real_world: 'Many Indian festivals follow the Moon: Diwali falls on amavasya (new moon), and many fasts and festivals on purnima (full moon).'
  picture:
    kind: flow
    steps:
    - New moon (amavasya)
    - Waxing crescent
    - First quarter
    - Full moon (purnima)
    - Waning back to new moon
    alt: 'The phases of the Moon over about a month: new moon, waxing crescent, first quarter, full moon, then waning back to new moon.'
  activity:
    type: order
    prompt: Put the Moon's phases in order, starting from new moon.
    steps:
    - New moon (dark)
    - Waxing crescent (a thin sliver)
    - First quarter (half lit)
    - Waxing gibbous (more than half)
    - Full moon
    reasons:
      Waxing crescent (a thin sliver): After new moon, a sliver of the lit side appears first.
      First quarter (half lit): The lit part grows from a sliver to half.
      Waxing gibbous (more than half): It keeps growing past half.
      Full moon: Fully lit, about two weeks after new moon.
  items:
  - prompt: Why does the Moon shine?
    options:
    - It reflects sunlight
    - It makes its own light
    - It is on fire
    - It reflects Earth's lights
    answer: It reflects sunlight
    difficulty: 1
    hints:
    - Non-luminous.
    - Like a mirror.
    solution: The Moon reflects light from the Sun.
    mistakes: {"It makes its own light": "t7_moon_reflects", "It is on fire": "t7_moon_reflects"}
  - prompt: About how many days pass from one full moon to the next? Round to the nearest whole number.
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - About 29.5 days.
    - Round it.
    solution: About 29.5 days, which rounds to 30.
    mistakes: {"7": "t7_lunar_month", "365": "t7_lunar_month"}
  - prompt: 'A solar eclipse happens when:'
    options:
    - The Moon comes between the Sun and the Earth
    - The Earth comes between the Sun and the Moon
    - The Sun comes between the Earth and the Moon
    - Clouds cover the Sun
    answer: The Moon comes between the Sun and the Earth
    difficulty: 2
    hints:
    - The Moon blocks the Sun.
    - Happens at new moon.
    solution: The Moon blocks sunlight from reaching part of the Earth.
    mistakes:
      The Earth comes between the Sun and the Moon: c7s_eclipse
  - prompt: 'A lunar eclipse can happen only at:'
    options:
    - Full moon
    - New moon
    - First quarter
    - Any time
    answer: Full moon
    difficulty: 2
    hints:
    - Earth between Sun and Moon.
    - The Moon is fully lit then.
    solution: The Earth's shadow falls on the Moon at full moon.
    mistakes: {"New moon": "t7_lunar_eclipse", "Any time": "t7_lunar_eclipse"}
  - prompt: 'Purnima is the Hindi name for:'
    options:
    - Full moon
    - New moon
    - Half moon
    - A solar eclipse
    answer: Full moon
    difficulty: 1
    hints:
    - Bright night.
    - Amavasya is new moon.
    solution: Purnima is full moon.
    mistakes: {"New moon": "t7_purnima", "A solar eclipse": "t7_purnima"}
  - prompt: Why should you never look directly at the Sun, even during an eclipse?
    options:
    - It can permanently damage your eyes
    - It is unlucky
    - The Sun is too far
    - It makes the eclipse end
    answer: It can permanently damage your eyes
    difficulty: 1
    hints:
    - Sunlight is very intense.
    - Use proper eclipse glasses.
    solution: Direct sunlight can burn the retina; use certified solar viewers.
    mistakes: {"It is unlucky": "t7_eclipse_eyes", "It makes the eclipse end": "t7_eclipse_eyes"}
