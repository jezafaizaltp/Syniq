# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 12. Format: content/README.md.
subject: cbse7-sci
chapter: 12
title: Earth, Moon and the Sun
tips:
  c7s_rotate_revolve: Rotation (spinning, 24 hours) gives day and night; revolution (round the Sun) gives the year.
  c7s_eclipse: 'Solar eclipse: the Moon blocks the Sun. Lunar eclipse: the Earth''s shadow falls on the Moon.'
  t7_eclipse_eyes: "Sunlight can burn the retina, even when part of the Sun is covered."
  t7_leap_days: "A leap year has one extra day added to 365."
  t7_lunar_eclipse: "The Earth's shadow falls on the Moon only when the Earth is between the Sun and the Moon."
  t7_lunar_month: "From one full moon to the next is about a month."
  t7_moon_reflects: "The Moon has no light of its own."
  t7_purnima: "Purnima is the night of the brightest, fullest moon."
  t7_quarter_days: "Four quarter-days make how many whole days?"
  t7_rotation_day: "One rotation of the Earth makes one day and night."
  t7_seasons_tilt: "Earth is actually closest to the Sun in January. So distance can't explain summer. What does?"
  t7_sun_east: "The Earth spins west to east, so the Sun seems to move the other way across our sky. Where does it start in the morning?"
  c7s12_spin_orbit: Two different movements. Spinning like a top, one turn makes one day; travelling round the Sun, one trip makes one year.
  c7s12_tilt: The Earth's axis leans at the same angle all year. As the Earth travels round the Sun, first one half then the other leans towards it.
  c7s12_quarter: A year is a little more than 365 days. The leftover part of a day adds up over a few years into one extra day.
  c7s12_lit_half: The Sun always lights half of the Moon. What changes over the month is how much of that lit half faces us.
  c7s12_lineup: In an eclipse, three bodies are in a line. Ask which one is in the middle, blocking light from reaching the next.
  c7s12_safe: Looking straight at the Sun, even when it is partly covered, can burn the back of the eye without any pain.
concepts:
- code: cbse7s.sky.daynight
  title: Day, night and seasons
  notes: |
    The Earth spins (rotates) on its axis from west to east once in about 24 hours, causing day and night; the
    Sun seems to rise in the east and set in the west. The Earth goes round (revolves around) the Sun once in
    about 365¼ days, a year (the extra quarter gives a leap year every 4 years). The axis is tilted, so in
    different months one hemisphere leans towards the Sun (summer: longer days, more direct rays) and then away
    (winter). The Sun's rising point shifts along the horizon through the year.
  explanations:
    text: The Earth spins once a day, which gives us day and night, and travels round the Sun once a year. Because the Earth is tilted, each half leans towards the Sun for part of the year (summer) and away for another part (winter).
    visual: 'Shine a torch on a globe in a dark room and turn it slowly: the side facing the torch has day, the other night. Walk the tilted globe round the torch: the northern half leans towards it for some of the circuit and away for the rest.'
    step_by_step: 'Step 1: Rotation (spinning, 24 h) causes day and night. Step 2: Revolution (going round the Sun, about 365 days) makes a year. Step 3: The tilt causes seasons. Step 4: Every fourth year adds a day: a leap year.'
    real_world: February has 29 days in a leap year, such as 2028, to account for the extra quarter day each year.
  picture:
    kind: compare
    columns:
    - title: Rotation
      points:
      - Spinning on its axis
      - About 24 hours
      - Causes day and night
    - title: Revolution
      points:
      - Going round the Sun
      - About 365¼ days
      - With the tilt, causes seasons
    alt: Rotation (spinning, about 24 hours) causes day and night; revolution (orbiting the Sun, about 365¼ days) with the tilt causes seasons.
  activity:
    type: sort
    prompt: 'What causes it: the Earth''s spin, its trip round the Sun, or its tilt?'
    bins:
    - Spin
    - Trip round the Sun
    - Tilt
    items:
    - label: Day and night
      bin: Spin
      clue: Happens every 24 hours.
      why: The Earth turning on its axis.
    - label: The Sun seems to rise in the east
      bin: Spin
      clue: The Earth turns from west to east.
      why: Rotation.
    - label: Stars seem to move across the night sky
      bin: Spin
      clue: Over a few hours.
      why: We are turning.
    - label: One year is about 365 days
      bin: Trip round the Sun
      clue: How long one orbit takes.
      why: Revolution.
    - label: Different stars are seen in different months
      bin: Trip round the Sun
      clue: Our night side faces a different part of space.
      why: We have moved along our orbit.
    - label: Summer when our half leans towards the Sun
      bin: Tilt
      clue: The axis isn't upright.
      why: The tilt causes seasons.
    - label: Long days in June in north India
      bin: Tilt
      clue: Our half leans towards the Sun then.
      why: Tilt.
  lesson:
    - teach: The Earth spins (rotates) on its axis, an imaginary line through the North and South Poles, from west to east. One full turn takes about 24 hours. The half facing the Sun has day; the other half has night. Because the Earth spins west to east, the Sun seems to rise in the east and set in the west.
      picture:
        kind: compare
        columns:
        - title: Side facing the Sun
          points:
          - day
          - sunlight
        - title: Side away from the Sun
          points:
          - night
          - dark
        alt: One half of the spinning Earth has day while the other half has night.
      check:
        prompt: What causes day and night?
        options:
        - The Earth spinning on its axis
        - The Sun going round the Earth
        - Clouds covering the Sun
        answer: The Earth spinning on its axis
        why: Each place turns into and out of sunlight.
    - teach: 'The Earth also travels round the Sun (revolution). One trip takes about 365¼ days: one year. Calendars use 365 days, and every 4 years the four quarter-days add up to one extra day, giving a leap year of 366 days (29 February).'
      picture:
        kind: compare
        columns:
        - title: Rotation
          points:
          - spinning on its axis
          - about 24 hours
          - day and night
        - title: Revolution
          points:
          - going round the Sun
          - about 365¼ days
          - a year
        alt: Rotation and revolution compared.
      check:
        prompt: How many days does a leap year have?
        options:
        - '366'
        - '365'
        - '360'
        answer: '366'
        why: The four quarter-days make one extra day.
    - teach: 'The Earth''s axis is tilted. For part of the year the northern half leans towards the Sun: India gets summer, with long days and direct, strong sunlight. Six months later it leans away: winter, with short days and slanting, weaker sunlight. The point on the horizon where the Sun rises also shifts through the year.'
      check:
        prompt: What causes the seasons?
        options:
        - The tilt of the Earth's axis as it goes round the Sun
        - The Earth getting much closer to the Sun in summer
        - The Moon blocking sunlight
        answer: The tilt of the Earth's axis as it goes round the Sun
        why: The tilt changes how directly sunlight falls on each half.
  items:
  - prompt: What causes day and night?
    options:
    - The Earth rotating on its axis
    - The Earth going round the Sun
    - The Moon blocking the Sun
    - Clouds
    answer: The Earth rotating on its axis
    difficulty: 1
    hints:
    - It happens every 24 hours.
    - Spinning.
    solution: Rotation turns each place towards and away from the Sun.
    mistakes:
      The Earth going round the Sun: c7s_rotate_revolve
  - prompt: About how many hours does the Earth take to rotate once?
    answer: '24'
    check: '24'
    difficulty: 1
    hints:
    - One day.
    - Day and night together.
    solution: About 24 hours.
    mistakes: {"365": "t7_rotation_day", "12": "t7_rotation_day"}
  - prompt: What causes the seasons?
    options:
    - The tilt of the Earth's axis as it goes round the Sun
    - The Earth getting closer to the Sun in summer
    - The Moon's phases
    - The Earth's rotation
    answer: The tilt of the Earth's axis as it goes round the Sun
    difficulty: 2
    hints:
    - Not distance.
    - Tilt.
    solution: The tilted axis makes each hemisphere lean towards the Sun for part of the year.
    mistakes: {"The Earth getting closer to the Sun in summer": "t7_seasons_tilt", "The Earth's rotation": "t7_seasons_tilt"}
  - prompt: In which direction does the Sun appear to rise?
    options:
    - East
    - West
    - North
    - South
    answer: East
    difficulty: 1
    hints:
    - "Think of where you see the Sun early in the morning from your home."
    - Morning sun.
    solution: The Sun appears to rise in the east.
    mistakes: {"West": "t7_sun_east", "North": "t7_sun_east"}
  - prompt: How many days are there in a leap year?
    answer: '366'
    check: 365 + 1
    difficulty: 1
    hints:
    - One extra day.
    - 29 February.
    solution: 365 + 1 = 366.
    mistakes: {"365": "t7_leap_days", "364": "t7_leap_days"}
  - prompt: A year is about 365¼ days. After 4 years, how many extra quarter-days have added up to make a whole day?
    answer: '1'
    check: 4*Rational(1,4)
    difficulty: 2
    hints:
    - 4 × ¼.
    - That is why leap years come every 4 years.
    solution: 4 × ¼ = 1 whole day.
    mistakes: {"4": "t7_quarter_days", "0.25": "t7_quarter_days"}
  - prompt: In which direction does the Sun appear to set?
    options:
    - West
    - East
    - North
    answer: West
    difficulty: 1
    hints:
    - Think about where the Sun rises each morning.
    - It sets on the opposite side.
    solution: As the Earth spins west to east, the Sun seems to move across the sky and set in the west.
    mistakes:
      East: c7s12_spin_orbit
      North: c7s12_spin_orbit
  - prompt: About how many days does the Earth take to go once round the Sun?
    answer: '365'
    check: '365'
    difficulty: 1
    hints:
    - It is one year.
    - A calendar year.
    solution: One revolution round the Sun takes about 365¼ days, which we call a year of 365 days.
    mistakes:
      '24': c7s12_spin_orbit
      '30': c7s12_spin_orbit
  - prompt: 'The imaginary line through the North and South Poles about which the Earth spins is its:'
    options:
    - Axis
    - Equator
    - Orbit
    answer: Axis
    difficulty: 1
    hints:
    - The Earth turns around it.
    - Like the rod through a spinning top.
    solution: The Earth rotates about its axis, which passes through the poles.
    mistakes:
      Equator: c7s12_spin_orbit
      Orbit: c7s12_spin_orbit
  - prompt: When it is day in India, it is night in parts of the Americas. Why?
    options:
    - They are on the side of the Earth facing away from the Sun
    - The Sun is switched off there
    - The Moon blocks their sunlight
    answer: They are on the side of the Earth facing away from the Sun
    difficulty: 1
    hints:
    - Only half the Earth faces the Sun at a time.
    - The Americas are far round the globe from India.
    solution: The Earth's far side, away from the Sun, has night while the near side has day.
    mistakes:
      The Sun is switched off there: c7s12_spin_orbit
      The Moon blocks their sunlight: c7s12_lineup
  - prompt: Which of these years is a leap year?
    options:
    - '2028'
    - '2027'
    - '2030'
    answer: '2028'
    difficulty: 2
    hints:
    - Leap years come every 4 years.
    - Which one divides exactly by 4?
    solution: 2028 ÷ 4 = 507 exactly, so 2028 is a leap year; 2027 and 2030 are not divisible by 4.
    mistakes:
      '2027': c7s12_quarter
      '2030': c7s12_quarter
  - prompt: Why are days longer in summer in India?
    options:
    - The northern half of the Earth leans towards the Sun
    - The Earth spins more slowly
    - The Sun is bigger in summer
    answer: The northern half of the Earth leans towards the Sun
    difficulty: 2
    hints:
    - India is in the northern half.
    - Leaning towards the Sun means more hours of light.
    solution: When the northern half tilts towards the Sun, places there spend more of each spin in sunlight.
    mistakes:
      The Earth spins more slowly: c7s12_spin_orbit
      The Sun is bigger in summer: c7s12_tilt
  - prompt: How many hours does the Earth take to spin through half a turn?
    answer: '12'
    check: 24/2
    difficulty: 2
    hints:
    - One full turn is about 24 hours.
    - Half of that.
    solution: A full rotation takes about 24 hours, so half a turn takes 24 ÷ 2 = 12 hours.
    mistakes:
      '6': c7s12_spin_orbit
      '48': c7s12_spin_orbit
  - prompt: Why is summer sunlight hotter than winter sunlight?
    options:
    - It falls more directly, so its heat is spread over a smaller area
    - The Sun gives more heat in summer
    - The Moon reflects extra light in summer
    answer: It falls more directly, so its heat is spread over a smaller area
    difficulty: 2
    hints:
    - Shine a torch straight down and then at a slant.
    - Which spot is brighter?
    solution: Direct rays concentrate energy on a small area; slanting winter rays spread it out.
    mistakes:
      The Sun gives more heat in summer: c7s12_tilt
      The Moon reflects extra light in summer: c7s12_tilt
  - prompt: If the Earth's axis were not tilted, what would happen to seasons?
    options:
    - There would be almost no seasons
    - Every day would be summer everywhere
    - Days would last a year
    answer: There would be almost no seasons
    difficulty: 3
    hints:
    - What causes seasons now?
    - Remove that cause.
    solution: Seasons come from the tilt; without it, each place would get about the same sunlight all year.
    mistakes:
      Every day would be summer everywhere: c7s12_tilt
      Days would last a year: c7s12_spin_orbit
  - prompt: A child was born on 29 February 2028. In how many years will they next have a birthday on that date?
    answer: '4'
    check: '4'
    difficulty: 3
    hints:
    - 29 February appears only in leap years.
    - How often do leap years come?
    solution: 29 February comes only in leap years, every 4 years, so the next one is 2032.
    mistakes:
      '1': c7s12_quarter
      '365': c7s12_quarter
  - prompt: 'Over a year, the point where the Sun rises on the horizon:'
    options:
    - Shifts north and south
    - Stays exactly the same
    - Moves to the west
    answer: Shifts north and south
    difficulty: 3
    hints:
    - Watch sunrise from the same spot each month.
    - The tilt changes the Sun's path.
    solution: Because of the tilt, the sunrise point slowly moves north in summer and south in winter.
    mistakes:
      Stays exactly the same: c7s12_tilt
      Moves to the west: c7s12_spin_orbit
- code: cbse7s.sky.moon
  title: Phases of the Moon and eclipses
  after:
  - cbse7s.sky.daynight
  notes: |
    The Moon does not make its own light; it reflects sunlight. As it goes round the Earth (about 29.5 days from
    one new moon to the next), we see different amounts of its lit half: new moon (amavasya), waxing crescent,
    first quarter, waxing gibbous, full moon (purnima), then waning back. The same side of the Moon always faces
    Earth. A solar eclipse happens when the Moon passes between the Sun and Earth (only at new moon); a lunar
    eclipse when the Earth's shadow falls on the Moon (only at full moon). Never look at the Sun directly.
  explanations:
    text: 'The Moon shines by reflecting sunlight. As it travels round the Earth over about a month, we see more or less of its sunlit side: new moon, crescent, half, full, and back again. Eclipses happen when the Sun, Earth and Moon line up.'
    visual: 'Hold a ball at arm''s length in a room lit by one lamp and turn slowly round: the lit part of the ball you see grows from a sliver to full and shrinks back, like the Moon''s phases.'
    step_by_step: 'Step 1: Half the Moon is always lit by the Sun. Step 2: Its position round the Earth decides how much of that half we see. Step 3: Solar eclipse: Moon between Sun and Earth. Step 4: Lunar eclipse: Earth between Sun and Moon.'
    real_world: 'Many Indian festivals follow the Moon: Diwali falls on amavasya (new moon), and many fasts and festivals on purnima (full moon).'
  picture:
    kind: flow
    steps:
    - New moon (amavasya)
    - Waxing crescent
    - First quarter
    - Full moon (purnima)
    - Waning back to new moon
    alt: 'The phases of the Moon over about a month: new moon, waxing crescent, first quarter, full moon, then waning back to new moon.'
  activity:
    type: order
    prompt: Put the Moon's phases in order, starting from new moon.
    steps:
    - New moon (dark)
    - Waxing crescent (a thin sliver)
    - First quarter (half lit)
    - Waxing gibbous (more than half)
    - Full moon
    reasons:
      Waxing crescent (a thin sliver): After new moon, a sliver of the lit side appears first.
      First quarter (half lit): The lit part grows from a sliver to half.
      Waxing gibbous (more than half): It keeps growing past half.
      Full moon: Fully lit, about two weeks after new moon.
  lesson:
    - teach: 'The Moon makes no light of its own; it reflects sunlight. The Sun always lights the half of the Moon facing it. As the Moon goes round the Earth, we see different amounts of that lit half: these are the phases.'
      picture:
        kind: flow
        steps:
        - New moon (amavasya)
        - Waxing crescent
        - First quarter
        - Waxing gibbous
        - Full moon (purnima)
        - Waning gibbous
        - Last quarter
        - Waning crescent
        alt: The phases of the Moon over about a month.
      check:
        prompt: Why does the Moon shine?
        options:
        - It reflects sunlight
        - It burns like the Sun
        - It glows from inside
        answer: It reflects sunlight
        why: The Moon is non-luminous.
    - teach: From one new moon to the next takes about 29.5 days, roughly a month; many Indian calendars count months this way. After new moon the lit part grows (waxing) to full moon, then shrinks (waning). The same side of the Moon always faces the Earth.
      check:
        prompt: 'Purnima is the name for the:'
        options:
        - Full moon
        - New moon
        - Half moon
        answer: Full moon
        why: On purnima the whole lit face is towards us.
    - teach: 'A solar eclipse happens when the Moon comes between the Sun and the Earth and blocks the Sun: only at new moon. A lunar eclipse happens when the Earth comes between the Sun and the Moon and its shadow falls on the Moon: only at full moon. Never look directly at the Sun, even during an eclipse; use special eclipse glasses or a pinhole projector.'
      picture:
        kind: compare
        columns:
        - title: Solar eclipse
          points:
          - Sun – Moon – Earth
          - Moon in the middle
          - only at new moon
        - title: Lunar eclipse
          points:
          - Sun – Earth – Moon
          - Earth in the middle
          - only at full moon
        alt: The order of Sun, Moon and Earth in the two kinds of eclipse.
      check:
        prompt: In a lunar eclipse, which body is in the middle?
        options:
        - The Earth
        - The Moon
        - The Sun
        answer: The Earth
        why: Its shadow falls on the Moon.
  items:
  - prompt: Why does the Moon shine?
    options:
    - It reflects sunlight
    - It makes its own light
    - It is on fire
    - It reflects Earth's lights
    answer: It reflects sunlight
    difficulty: 1
    hints:
    - Non-luminous.
    - Like a mirror.
    solution: The Moon reflects light from the Sun.
    mistakes: {"It makes its own light": "t7_moon_reflects", "It is on fire": "t7_moon_reflects"}
  - prompt: About how many days pass from one full moon to the next? Round to the nearest whole number.
    answer: '30'
    check: '30'
    difficulty: 2
    hints:
    - About 29.5 days.
    - Round it.
    solution: About 29.5 days, which rounds to 30.
    mistakes: {"7": "t7_lunar_month", "365": "t7_lunar_month"}
  - prompt: 'A solar eclipse happens when:'
    options:
    - The Moon comes between the Sun and the Earth
    - The Earth comes between the Sun and the Moon
    - The Sun comes between the Earth and the Moon
    - Clouds cover the Sun
    answer: The Moon comes between the Sun and the Earth
    difficulty: 2
    hints:
    - The Moon blocks the Sun.
    - Happens at new moon.
    solution: The Moon blocks sunlight from reaching part of the Earth.
    mistakes:
      The Earth comes between the Sun and the Moon: c7s_eclipse
  - prompt: 'A lunar eclipse can happen only at:'
    options:
    - Full moon
    - New moon
    - First quarter
    - Any time
    answer: Full moon
    difficulty: 2
    hints:
    - Earth between Sun and Moon.
    - The Moon is fully lit then.
    solution: The Earth's shadow falls on the Moon at full moon.
    mistakes: {"New moon": "t7_lunar_eclipse", "Any time": "t7_lunar_eclipse"}
  - prompt: 'Purnima is the Hindi name for:'
    options:
    - Full moon
    - New moon
    - Half moon
    - A solar eclipse
    answer: Full moon
    difficulty: 1
    hints:
    - Bright night.
    - Amavasya is new moon.
    solution: Purnima is full moon.
    mistakes: {"New moon": "t7_purnima", "A solar eclipse": "t7_purnima"}
  - prompt: Why should you never look directly at the Sun, even during an eclipse?
    options:
    - It can permanently damage your eyes
    - It is unlucky
    - The Sun is too far
    - It makes the eclipse end
    answer: It can permanently damage your eyes
    difficulty: 1
    hints:
    - Sunlight is very intense.
    - Use proper eclipse glasses.
    solution: Direct sunlight can burn the retina; use certified solar viewers.
    mistakes: {"It is unlucky": "t7_eclipse_eyes", "It makes the eclipse end": "t7_eclipse_eyes"}
  - prompt: 'Amavasya is the name for the:'
    options:
    - New moon
    - Full moon
    - First quarter
    answer: New moon
    difficulty: 1
    hints:
    - It is the darkest night of the month.
    - We see none of the lit half.
    solution: On amavasya, the lit half of the Moon faces away from us, so we see the new moon.
    mistakes:
      Full moon: c7s12_lit_half
      First quarter: c7s12_lit_half
  - prompt: 'When the lit part of the Moon is growing each night, the Moon is:'
    options:
    - Waxing
    - Waning
    - Eclipsed
    answer: Waxing
    difficulty: 1
    hints:
    - It is between new moon and full moon.
    - Growing bigger.
    solution: The growing phase, from new moon to full moon, is called waxing.
    mistakes:
      Waning: c7s12_lit_half
      Eclipsed: c7s12_lineup
  - prompt: 'A solar eclipse can happen only at:'
    options:
    - New moon
    - Full moon
    - First quarter
    answer: New moon
    difficulty: 1
    hints:
    - The Moon must be between the Sun and Earth.
    - Then its lit side faces away from us.
    solution: Only at new moon is the Moon between the Sun and Earth, so only then can it block the Sun.
    mistakes:
      Full moon: c7s12_lineup
      First quarter: c7s12_lineup
  - prompt: Which is a safe way to watch a solar eclipse?
    options:
    - Using proper eclipse glasses or a pinhole projector
    - Looking straight at the Sun quickly
    - Using ordinary sunglasses
    answer: Using proper eclipse glasses or a pinhole projector
    difficulty: 1
    hints:
    - The Sun's rays can harm the eyes.
    - Ordinary sunglasses are not enough.
    solution: Special filters or an indirect pinhole image protect the eyes; looking directly can cause permanent damage.
    mistakes:
      Looking straight at the Sun quickly: c7s12_safe
      Using ordinary sunglasses: c7s12_safe
  - prompt: A full moon is on the 5th of a month. About which date will the next full moon be?
    options:
    - Around the 4th or 5th of the next month
    - The 12th of the same month
    - The 5th, three months later
    answer: Around the 4th or 5th of the next month
    difficulty: 2
    hints:
    - The Moon's cycle takes about 29.5 days.
    - That is about a month.
    solution: Phases repeat about every 29.5 days, so the next full moon is roughly a month later.
    mistakes:
      The 12th of the same month: c7s12_lit_half
      The 5th, three months later: c7s12_lit_half
  - prompt: Why do we always see the same side of the Moon?
    options:
    - The Moon spins once in the same time it takes to go round the Earth
    - The Moon does not spin and does not move
    - The other side is always dark
    answer: The Moon spins once in the same time it takes to go round the Earth
    difficulty: 2
    hints:
    - Walk round a chair always facing it.
    - How many times do you turn?
    solution: Its spin and its trip round the Earth take the same time, so the same face stays towards us.
    mistakes:
      The Moon does not spin and does not move: c7s12_spin_orbit
      The other side is always dark: c7s12_lit_half
  - prompt: 'In a solar eclipse, the order of the three bodies in a line is:'
    options:
    - Sun, Moon, Earth
    - Sun, Earth, Moon
    - Moon, Sun, Earth
    answer: Sun, Moon, Earth
    difficulty: 2
    hints:
    - Something blocks the Sun from us.
    - What is between the Sun and Earth?
    solution: The Moon is in the middle and blocks sunlight from reaching part of the Earth.
    mistakes:
      Sun, Earth, Moon: c7s12_lineup
      Moon, Sun, Earth: c7s12_lineup
  - prompt: Half the Moon is always lit by the Sun. Why do we see only a thin crescent some nights?
    options:
    - Only a small part of the lit half faces the Earth
    - The Sun lights less of the Moon then
    - Clouds cover the rest
    answer: Only a small part of the lit half faces the Earth
    difficulty: 2
    hints:
    - The lit half is always the same size.
    - What changes is our view.
    solution: The Sun always lights half the Moon; at crescent phase most of that lit half faces away from us.
    mistakes:
      The Sun lights less of the Moon then: c7s12_lit_half
      Clouds cover the rest: c7s12_lit_half
  - prompt: Why is there not a solar eclipse at every new moon?
