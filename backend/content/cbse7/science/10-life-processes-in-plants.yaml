# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 10. Format: content/README.md.
subject: cbse7-sci
chapter: 10
title: Life Processes in Plants
tips:
  c7s_photo_gases: "Plants give out oxygen in photosynthesis; that is what we breathe in. Which gas do they take in, the one we breathe out?"
  c7s_xylem: "Phloem carries food made in the leaves. The other tube carries water upward from the roots."
  t7_autotroph: "'Auto' means self and 'troph' means food: self-feeders."
  t7_chlorophyll: "Leaves are green because of a pigment that traps light."
  t7_iodine_starch: "Iodine turns blue-black with one food substance. Which?"
  t7_no_chlorophyll: "Photosynthesis needs a green pigment. Are mushrooms green?"
  t7_phloem: "Xylem carries water up and root hairs take water in. The other tube carries food from the leaves."
  t7_plants_respire: "Plants need energy all the time. Does respiration stop at night?"
  t7_root_hairs: "Thousands of fine root hairs give a big…? for absorbing water."
  t7_stem_transport: "The colour reached the petals. Which way did the water travel?"
  t7_stomata: "Gases pass through tiny pores on the leaf surface."
  t7_transpiration: "Water vapour leaving leaves has a name. Respiration is releasing energy."
  c7s10_recipe: 'Think of the plant''s food-making recipe: what goes in from the air, what comes up from the soil, what powers it, and what comes out.'
  c7s10_makers: Ask whether the living thing can make its own food from sunlight. That depends on having the green colouring in its cells.
  c7s10_pores: Leaves have tiny openings on their surface. Gases enter and leave through them, and water vapour escapes through them too.
  c7s10_soil: Think about where the water is, and which part of the plant reaches into that place.
  c7s10_tubes: 'A plant has two kinds of carrying tubes: one takes water and minerals UP from the roots, the other takes food made in the leaves to every part.'
  c7s10_always: Every living cell needs energy all day and all night. Making food needs light; using food does not.
  c7s10_test: A drop of brown iodine solution turns blue-black only where starch is present.
concepts:
- code: cbse7s.plant.photo
  title: Photosynthesis
  notes: |
    Green plants make their own food (autotrophs) by photosynthesis, mainly in leaves. They use carbon dioxide
    (taken in through stomata, tiny pores on leaves), water (from roots) and sunlight, trapped by the green
    pigment chlorophyll, to make glucose (stored as starch) and release oxygen. Carbon dioxide + water →
    (sunlight, chlorophyll) → glucose + oxygen. The iodine test turns starch blue-black, showing a leaf made food.
    Animals and non-green plants (fungi) depend on others for food (heterotrophs).
  explanations:
    text: Green plants make their own food using sunlight. In their leaves, the green chlorophyll traps light energy to turn carbon dioxide and water into glucose, giving out oxygen. Everything else, including us, depends on this.
    visual: 'Picture a leaf as a tiny kitchen: sunlight is the stove, chlorophyll the cook, carbon dioxide (through stomata) and water (through roots) the ingredients, and glucose the meal, with oxygen let out of the window.'
    step_by_step: 'Step 1: Water comes up from the roots. Step 2: Carbon dioxide enters through stomata. Step 3: Chlorophyll traps sunlight. Step 4: Glucose is made and stored as starch. Step 5: Oxygen is released.'
    real_world: The oxygen we breathe comes from photosynthesis in plants and in tiny algae in the sea.
  picture:
    kind: flow
    steps:
    - Water from roots
    - Carbon dioxide through stomata
    - Sunlight trapped by chlorophyll
    - Glucose (stored as starch)
    - Oxygen released
    alt: 'Photosynthesis: water, carbon dioxide and sunlight trapped by chlorophyll make glucose and release oxygen.'
  activity:
    type: sort
    prompt: In photosynthesis, is it taken in or given out?
    bins:
    - Taken in
    - Given out or made
    items:
    - label: Carbon dioxide from the air
      bin: Taken in
      clue: A raw material from the air.
      why: Leaves take it in.
    - label: Water from the roots
      bin: Taken in
      clue: Travels up to the leaves.
      why: A raw material.
    - label: Energy from sunlight
      bin: Taken in
      clue: Trapped by chlorophyll.
      why: Light energy is used.
    - label: Gas entering stomata in sunlight
      bin: Taken in
      clue: What gas do leaves need?
      why: Carbon dioxide.
    - label: Glucose
      bin: Given out or made
      clue: The food the plant makes.
      why: A product.
    - label: Oxygen bubbles from a water plant
      bin: Given out or made
      clue: What gas bubbles off in sunlight?
      why: Oxygen is released.
    - label: Starch stored in leaves
      bin: Given out or made
      clue: Glucose turned into a store.
      why: Made from glucose.
    - label: Gas leaving stomata in sunlight
      bin: Given out or made
      clue: What gas do leaves release in the day?
      why: Oxygen.
  lesson:
    - teach: Green plants make their own food, so they are called autotrophs. They do it by photosynthesis, mainly in the leaves. They take in carbon dioxide from the air and water from the soil, and use sunlight trapped by the green pigment chlorophyll to make glucose. Oxygen is released.
      picture:
        kind: flow
        steps:
        - Carbon dioxide (air) + water (soil)
        - sunlight + chlorophyll
        - glucose (food) + oxygen
        alt: 'Photosynthesis: carbon dioxide and water, with sunlight and chlorophyll, make glucose and oxygen.'
      check:
        prompt: Which gas do plants release during photosynthesis?
        options:
        - Oxygen
        - Carbon dioxide
        - Nitrogen
        answer: Oxygen
        why: Oxygen is given out as glucose is made.
    - teach: 'Carbon dioxide enters the leaf through stomata, tiny pores mostly on the underside of leaves. Guard cells open and close them. The glucose made is stored as starch. Put a drop of iodine on a leaf that was in sunlight (after removing its green colour): it turns blue-black, showing starch is present.'
      picture:
        kind: flow
        steps:
        - Boil leaf in water
        - Remove green colour with spirit
        - Rinse
        - Add iodine
        - Blue-black = starch
        alt: Steps of the iodine test for starch in a leaf.
      check:
        prompt: A leaf turns blue-black with iodine. What does this show?
        options:
        - Starch is present
        - Oxygen is present
        - No food was made
        answer: Starch is present
        why: Iodine turns blue-black with starch.
    - teach: 'Animals, fungi such as mushrooms, and most bacteria cannot make their own food: they are heterotrophs and depend on plants directly or indirectly. Mushrooms have no chlorophyll. So almost all food on Earth starts with photosynthesis.'
      check:
        prompt: Why can't a mushroom make food by photosynthesis?
        options:
        - It has no chlorophyll
        - It has too many leaves
        - It lives in water
        answer: It has no chlorophyll
        why: Without chlorophyll it cannot trap sunlight.
  items:
  - prompt: Which green pigment traps sunlight in leaves?
    options:
    - Chlorophyll
    - Haemoglobin
    - Melanin
    - Starch
    answer: Chlorophyll
    difficulty: 1
    hints:
    - Makes leaves green.
    - In chloroplasts.
    solution: Chlorophyll traps light energy.
    mistakes: {"Haemoglobin": "t7_chlorophyll", "Starch": "t7_chlorophyll"}
  - prompt: Which gas do plants take in for photosynthesis?
    options:
    - Carbon dioxide
    - Oxygen
    - Nitrogen
    - Hydrogen
    answer: Carbon dioxide
    difficulty: 1
    hints:
    - They release oxygen.
    - They take in the other one.
    solution: Plants take in carbon dioxide and release oxygen.
    mistakes:
      Oxygen: c7s_photo_gases
  - prompt: Through what do gases enter and leave a leaf?
    options:
    - Stomata
    - Roots
    - Flowers
    - Bark
    answer: Stomata
    difficulty: 1
    hints:
    - Tiny pores.
    - On the leaf surface.
    solution: Gases pass through stomata.
    mistakes: {"Roots": "t7_stomata", "Bark": "t7_stomata"}
  - prompt: What does the iodine test show in a leaf?
    options:
    - Starch is present
    - Water is present
    - Oxygen is present
    - The leaf is dead
    answer: Starch is present
    difficulty: 2
    hints:
    - Blue-black colour.
    - Stored food.
    solution: Iodine turns starch blue-black.
    mistakes: {"Water is present": "t7_iodine_starch", "Oxygen is present": "t7_iodine_starch"}
  - prompt: 'Organisms that make their own food are called:'
    options:
    - Autotrophs
    - Heterotrophs
    - Parasites
    - Decomposers
    answer: Autotrophs
    difficulty: 2
    hints:
    - '''Auto'' = self.'
    - Green plants.
    solution: Autotrophs make their own food.
    mistakes: {"Heterotrophs": "t7_autotroph", "Parasites": "t7_autotroph"}
  - prompt: 'Mushrooms cannot make food by photosynthesis because they:'
    options:
    - Have no chlorophyll
    - Have no roots
    - Are too small
    - Live in water
    answer: Have no chlorophyll
    difficulty: 2
    hints:
    - They are not green.
    - Fungi.
    solution: Fungi lack chlorophyll, so they cannot photosynthesise.
    mistakes: {"Have no roots": "t7_no_chlorophyll", "Are too small": "t7_no_chlorophyll"}
  - prompt: Where in a plant does most photosynthesis happen?
    options:
    - Leaves
    - Roots
    - Flowers
    answer: Leaves
    difficulty: 1
    hints:
    - Which part is green and flat?
    - It faces the sunlight.
    solution: Leaves are green with chlorophyll and broad to catch light, so most food is made there.
    mistakes:
      Roots: c7s10_recipe
      Flowers: c7s10_recipe
  - prompt: Which is NOT needed for photosynthesis?
    options:
    - Oxygen
    - Sunlight
    - Water
    answer: Oxygen
    difficulty: 1
    hints:
    - List the ingredients.
    - Which is a product, not an ingredient?
    solution: Photosynthesis needs carbon dioxide, water, sunlight and chlorophyll; oxygen is given out.
    mistakes:
      Sunlight: c7s10_recipe
      Water: c7s10_recipe
  - prompt: 'Plants store extra glucose as:'
    options:
    - Starch
    - Oxygen
    - Water
    answer: Starch
    difficulty: 1
    hints:
    - It is found in potatoes and rice.
    - Iodine tests for it.
    solution: Glucose made in leaves is changed into starch for storage.
    mistakes:
      Oxygen: c7s10_test
      Water: c7s10_test
  - prompt: 'Organisms that cannot make their own food are called:'
    options:
    - Heterotrophs
    - Autotrophs
    - Stomata
    answer: Heterotrophs
    difficulty: 1
    hints:
    - '''Hetero'' means other.'
    - They depend on others for food.
    solution: Heterotrophs, like animals and fungi, get food from other living things.
    mistakes:
      Autotrophs: c7s10_makers
      Stomata: c7s10_pores
  - prompt: A potted plant is kept in a dark cupboard for 3 days, then a leaf is tested with iodine. What colour is it?
    options:
    - Brown (no starch)
    - Blue-black
    - Green
    answer: Brown (no starch)
    difficulty: 2
    hints:
    - Can the plant make food in the dark?
    - It uses up its stored starch.
    solution: Without light, no new starch is made and the old starch is used up, so iodine stays brown.
    mistakes:
      Blue-black: c7s10_test
      Green: c7s10_test
  - prompt: 'Guard cells around a stoma control:'
    options:
    - Opening and closing of the pore
    - The colour of the leaf
    - How fast roots grow
    answer: Opening and closing of the pore
    difficulty: 2
    hints:
    - A stoma is a tiny pore.
    - Guard cells are like doors.
    solution: Guard cells change shape to open or close the stoma, controlling gas exchange and water loss.
    mistakes:
      The colour of the leaf: c7s10_pores
      How fast roots grow: c7s10_pores
  - prompt: Why are leaves usually broad and flat?
    options:
    - To catch more sunlight for making food
    - To store water
    - To keep insects away
    answer: To catch more sunlight for making food
    difficulty: 2
    hints:
    - What does photosynthesis need from the Sun?
    - More surface catches more.
    solution: A broad, flat surface catches more sunlight and takes in more carbon dioxide.
    mistakes:
      To store water: c7s10_recipe
      To keep insects away: c7s10_recipe
  - prompt: A variegated leaf (green and white) is tested with iodine. Which parts turn blue-black?
    options:
    - Only the parts that were green
    - Only the white parts
    - The whole leaf
    answer: Only the parts that were green
    difficulty: 2
    hints:
    - Which parts have chlorophyll?
    - Only they can make starch.
    solution: Only the green parts have chlorophyll and make starch, so only they turn blue-black.
    mistakes:
      Only the white parts: c7s10_makers
      The whole leaf: c7s10_makers
  - prompt: Why do we say all animals depend on plants for food?
    options:
    - Every food chain starts with plants making food by photosynthesis
    - Animals eat only plants
    - Plants eat animals
    answer: Every food chain starts with plants making food by photosynthesis
    difficulty: 3
    hints:
    - A lion eats deer; what does the deer eat?
    - Follow any food chain back.
    solution: Even meat-eaters eat animals that ate plants; food energy starts with photosynthesis.
    mistakes:
      Animals eat only plants: c7s10_makers
      Plants eat animals: c7s10_makers
  - prompt: A plant is kept in a sealed jar with a chemical that removes all carbon dioxide. What happens?
    options:
    - It cannot make food by photosynthesis
    - It makes more food
    - It makes food only at night
    answer: It cannot make food by photosynthesis
    difficulty: 3
    hints:
    - What gas is an ingredient?
    - Without it, the recipe fails.
    solution: Carbon dioxide is needed for photosynthesis; without it, no glucose can be made.
    mistakes:
      It makes more food: c7s10_recipe
      It makes food only at night: c7s10_always
  - prompt: Why is a leaf boiled in spirit before the iodine test?
    options:
    - To remove the green colour so the colour change can be seen
    - To add starch
    - To make it green
    answer: To remove the green colour so the colour change can be seen
    difficulty: 3
    hints:
    - Green colour hides other colours.
    - What does spirit dissolve?
    solution: Spirit removes chlorophyll, so the blue-black colour from iodine is easy to see.
    mistakes:
      To add starch: c7s10_test
      To make it green: c7s10_test
- code: cbse7s.plant.transport
  title: Transport and gas exchange in plants
  after:
  - cbse7s.plant.photo
  notes: |
    Roots absorb water and minerals from the soil (root hairs increase the surface). Xylem tubes carry water and
    minerals up to the leaves; phloem tubes carry food made in leaves to all parts. Transpiration: water
    evaporates from leaves through stomata, which pulls water up the plant and cools it. Plants also respire all
    the time, taking in oxygen and releasing carbon dioxide; in sunlight photosynthesis is faster, so they give
    out more oxygen than they use.
  explanations:
    text: Plants have two kinds of pipes. Xylem carries water up from the roots; phloem carries food from the leaves to the rest of the plant. Water evaporating from leaves (transpiration) pulls more water up, like sucking on a straw.
    visual: 'Put a white flower in water coloured with ink. After a few hours the petals turn the colour of the ink: the water travelled up through the xylem.'
    step_by_step: 'Step 1: Root hairs absorb water and minerals. Step 2: Xylem carries them up. Step 3: Leaves make food; phloem carries it everywhere. Step 4: Transpiration pulls water up and cools the plant.'
    real_world: On a hot day it is cooler under a tree partly because transpiration from its leaves cools the air around them.
  picture:
    kind: compare
    columns:
    - title: Xylem
      points:
      - Carries water and minerals
      - Moves up from roots
      - Pulled by transpiration
    - title: Phloem
      points:
      - Carries food (sugars)
      - From leaves to all parts
      - Up and down the plant
    alt: Xylem carries water and minerals up from the roots; phloem carries food from the leaves to all parts.
  activity:
    type: sort
    prompt: Which part does each job?
    bins:
    - Xylem
    - Phloem
    - Stomata
    items:
    - label: Carries water up from the roots
      bin: Xylem
      clue: Upwards from the soil.
      why: Xylem.
    - label: Carries minerals from the soil
      bin: Xylem
      clue: Dissolved in water, moving up.
      why: Xylem.
    - label: A celery stalk turning red in red water
      bin: Xylem
      clue: Which pipes carry water upward?
      why: The dye travels in the xylem.
    - label: Carries sugar from leaves to roots
      bin: Phloem
      clue: Food moves from where it's made.
      why: Phloem.
    - label: Carries food to growing fruits
      bin: Phloem
      clue: Food from the leaves.
      why: Phloem.
    - label: Brought the starch stored in a potato
      bin: Phloem
      clue: Food came down from the leaves.
      why: Phloem.
    - label: Tiny pores that let gases in and out
      bin: Stomata
      clue: On the underside of leaves.
      why: Stomata.
    - label: Where water vapour escapes from leaves
      bin: Stomata
      clue: Transpiration happens here.
      why: Through the stomata.
  lesson:
    - teach: 'Roots absorb water and minerals from the soil. Tiny root hairs give a much larger surface for absorbing. Two kinds of tubes carry materials: xylem carries water and minerals up to the leaves; phloem carries food made in the leaves to all parts of the plant.'
      picture:
        kind: compare
        columns:
        - title: Xylem
          points:
          - water and minerals
          - from roots upwards
        - title: Phloem
          points:
          - food (sugars)
          - from leaves to all parts
        alt: What xylem and phloem carry.
      check:
        prompt: Which tubes carry water up a plant?
        options:
        - Xylem
        - Phloem
        - Stomata
        answer: Xylem
        why: Xylem carries water and minerals upward.
    - teach: 'Transpiration is the loss of water vapour from leaves through stomata. It pulls water up the stem, like sucking through a straw, and cools the plant. Put a white flower in coloured water: the petals change colour as the water travels up.'
      picture:
        kind: flow
        steps:
        - Root hairs absorb water
        - Xylem carries it up the stem
        - Leaves
        - Water vapour leaves through stomata (transpiration)
        alt: The path of water through a plant.
      check:
        prompt: 'Loss of water vapour from leaves is called:'
        options:
        - Transpiration
        - Photosynthesis
        - Germination
        answer: Transpiration
        why: It happens through stomata.
    - teach: 'Plants also respire, all day and all night: they take in oxygen and give out carbon dioxide to release energy. In bright sunlight, photosynthesis is faster than respiration, so overall they give out more oxygen than they use.'
      check:
        prompt: Do plants use oxygen?
        options:
        - Yes, for respiration, day and night
        - No, never
        - Only in sunlight
        answer: Yes, for respiration, day and night
        why: All living cells respire.
  items:
  - prompt: Which tissue carries water from roots to leaves?
    options:
    - Xylem
    - Phloem
    - Stomata
    - Chlorophyll
    answer: Xylem
    difficulty: 1
    hints:
    - Water goes up.
    - Phloem carries food.
    solution: Xylem carries water and minerals up.
    mistakes:
      Phloem: c7s_xylem
  - prompt: Which tissue carries food made in the leaves?
    options:
    - Phloem
    - Xylem
    - Root hairs
    - Bark only
    answer: Phloem
    difficulty: 1
    hints:
    - Food goes everywhere.
    - Not xylem.
    solution: Phloem carries food.
    mistakes: {"Xylem": "t7_phloem", "Root hairs": "t7_phloem"}
  - prompt: 'Loss of water vapour from leaves is called:'
    options:
    - Transpiration
    - Respiration
    - Photosynthesis
    - Digestion
    answer: Transpiration
    difficulty: 1
    hints:
    - Through stomata.
    - Evaporation from leaves.
    solution: It is transpiration.
    mistakes: {"Respiration": "t7_transpiration", "Photosynthesis": "t7_transpiration"}
  - prompt: Why do root hairs help a plant?
    options:
    - They increase the surface for absorbing water
    - They make food
    - They hold flowers
    - They release oxygen
    answer: They increase the surface for absorbing water
    difficulty: 2
    hints:
    - More surface, more absorption.
    - Tiny outgrowths.
    solution: Root hairs increase the area for absorbing water and minerals.
    mistakes: {"They make food": "t7_root_hairs", "They release oxygen": "t7_root_hairs"}
  - prompt: 'A white flower in coloured water turns coloured. This shows:'
    options:
    - Water travels up the stem
    - Flowers make colour
    - Leaves absorb ink
    - Roots make food
    answer: Water travels up the stem
    difficulty: 1
    hints:
    - Through xylem.
    - The colour moved up.
    solution: The coloured water travelled up through the xylem.
    mistakes: {"Flowers make colour": "t7_stem_transport", "Leaves absorb ink": "t7_stem_transport"}
  - prompt: Do plants respire at night?
    options:
    - Yes, they respire all the time
    - No, never
    - Only in daylight
    - Only in winter
    answer: Yes, they respire all the time
    difficulty: 2
    hints:
    - All living things respire.
    - Photosynthesis stops at night.
    solution: Plants respire day and night; only photosynthesis needs light.
    mistakes: {"No, never": "t7_plants_respire", "Only in daylight": "t7_plants_respire"}
  - prompt: Which part of a plant absorbs water from the soil?
    options:
    - Roots
    - Leaves
    - Flowers
    answer: Roots
    difficulty: 1
    hints:
    - Which part is in the soil?
    - It has tiny hairs.
    solution: Roots, with their root hairs, absorb water and minerals from the soil.
    mistakes:
      Leaves: c7s10_soil
      Flowers: c7s10_soil
  - prompt: 'Food made in the leaves reaches the roots through:'
    options:
    - Phloem
    - Xylem
    - Root hairs
    answer: Phloem
    difficulty: 1
    hints:
    - Food, not water.
    - It carries food in all directions.
    solution: Phloem carries food from the leaves to all parts, including the roots.
    mistakes:
      Xylem: c7s10_tubes
      Root hairs: c7s10_tubes
  - prompt: 'Tiny pores on leaves through which water vapour escapes are:'
    options:
    - Stomata
    - Root hairs
    - Xylem
    answer: Stomata
    difficulty: 1
    hints:
    - Mostly on the underside of leaves.
    - Gases also pass through them.
    solution: Stomata are tiny pores; water vapour escapes through them in transpiration.
    mistakes:
      Root hairs: c7s10_pores
      Xylem: c7s10_pores
  - prompt: 'Minerals from the soil travel up the plant in the:'
    options:
    - Xylem
    - Phloem
    - Stomata
    answer: Xylem
    difficulty: 1
    hints:
    - They travel with water.
    - Upward from the roots.
    solution: Minerals dissolve in water and travel up with it in the xylem.
    mistakes:
      Phloem: c7s10_tubes
      Stomata: c7s10_pores
  - prompt: A celery stalk is placed in red-coloured water. After a few hours, red lines show inside the stalk. What are they?
    options:
    - Xylem tubes carrying water up
    - Phloem tubes carrying food down
    - Stomata
    answer: Xylem tubes carrying water up
    difficulty: 2
    hints:
    - Water went up the stalk.
    - Which tubes carry water?
    solution: The coloured water rises through the xylem, so the xylem tubes look red.
    mistakes:
      Phloem tubes carrying food down: c7s10_tubes
      Stomata: c7s10_pores
  - prompt: How does transpiration help a plant?
    options:
    - It pulls water up and cools the plant
    - It makes food
    - It stops respiration
    answer: It pulls water up and cools the plant
    difficulty: 2
    hints:
    - Evaporation cools.
    - It acts like a suction pull.
    solution: Water evaporating from leaves pulls more water up the xylem and cools the leaves.
    mistakes:
      It makes food: c7s10_recipe
      It stops respiration: c7s10_always
  - prompt: A plastic bag tied over a leafy branch in sunlight gets water drops inside. Why?
    options:
    - Water vapour from transpiration condenses on the bag
    - Rain got in
    - The bag makes water
    answer: Water vapour from transpiration condenses on the bag
    difficulty: 2
    hints:
    - Leaves lose water vapour.
    - It turns to drops on the cool plastic.
    solution: The leaves give off water vapour (transpiration), which condenses into drops on the bag.
    mistakes:
      Rain got in: c7s10_pores
      The bag makes water: c7s10_pores
  - prompt: What is the main job of the many tiny root hairs?
    options:
    - They give a larger surface for absorbing water
    - They make food
    - They release oxygen
    answer: They give a larger surface for absorbing water
    difficulty: 2
    hints:
    - They are tiny and many.
    - More surface, more absorption.
    solution: Thousands of root hairs greatly increase the surface touching soil water.
    mistakes:
      They make food: c7s10_recipe
      They release oxygen: c7s10_recipe
  - prompt: At night, which gas do plants give out?
    options:
    - Carbon dioxide
    - Oxygen
    - No gas at all
    answer: Carbon dioxide
    difficulty: 3
    hints:
    - There is no photosynthesis at night.
    - Respiration continues.
    solution: At night plants only respire, taking in oxygen and giving out carbon dioxide.
    mistakes:
      Oxygen: c7s10_always
      No gas at all: c7s10_always
  - prompt: Why do plants wilt on a very hot, dry day?
    options:
    - They lose water by transpiration faster than roots can absorb it
    - They make too much food
    - Their phloem carries water away
    answer: They lose water by transpiration faster than roots can absorb it
    difficulty: 3
    hints:
    - Heat speeds up evaporation from leaves.
    - What if the soil is dry?
    solution: Hot weather speeds transpiration; if roots cannot replace the water, cells lose firmness and the plant droops.
