# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 7. Format: content/README.md.
subject: cbse7-sci
chapter: 7
title: Heat Transfer in Nature
tips:
  c7s_heat_direction: Heat always flows from the hotter object to the colder one.
  c7s_breeze: By day the land heats faster, so cooler air blows in from the sea; at night it reverses.
  t7_black_absorbs: "Dark colours absorb more heat. Shiny and white surfaces reflect it."
  t7_body_temp: "Normal body temperature is a little under 40 °C. 98.6 is in °F."
  t7_conduction: "Convection needs a moving liquid or gas and radiation needs no contact. Here heat passes along a solid spoon, particle to particle."
  t7_convection: "Conduction passes heat through a solid without moving it, and radiation needs no contact. Here the water itself moves round in a loop."
  t7_handle_insulator: "A handle should stay cool. Do plastic and wood carry heat well or poorly?"
  t7_land_breeze: "At night land cools faster than sea. Air rises over the warmer sea. Which way does air flow?"
  t7_radiation: "Space has no air or matter between the Sun and Earth. Which kind of heat transfer needs no medium?"
  t7_water_cycle: "Evaporation needs heat. Where does that heat come from?"
  t7_white_reflects: "White surfaces send light and heat back. Dark ones take it in."
  t7_wool_air: "Wool doesn't make heat. It traps something between its fibres that stops heat escaping."
  c7s7_way: 'Name how the heat moves: passed along through a solid, carried by a moving liquid or gas, or travelling with no material at all.'
  c7s7_downhill: Heat always moves from the warmer thing to the cooler thing, never the other way on its own.
  c7s7_blocker: Some materials pass heat only slowly. They are used where we want to keep heat in or out, such as pan handles and winter clothes; metals are not among them.
  c7s7_colour: Dark, dull surfaces take in more of the Sun's heat; light, shiny surfaces send more of it back.
  c7s7_sand: Think of a beach at noon and compare how the sand and the sea water feel under your feet.
  c7s7_breeze: Land heats up and cools down faster than the sea. Air over the warmer place rises, and cooler air moves in to take its place.
concepts:
- code: cbse7s.heat.cond
  title: Conduction and convection
  notes: |
    Heat flows from a hotter object to a colder one. Temperature is measured with a thermometer (normal body
    temperature about 37 °C; clinical thermometers read 35–42 °C). Conduction: heat passes through a solid from
    particle to particle (a metal spoon in hot tea gets hot). Metals are good conductors; wood, plastic, air are
    poor conductors (insulators), so pan handles are plastic or wood. Convection: in liquids and gases, warm
    parts rise and cool parts sink, carrying heat (water boiling in a pot, sea and land breezes).
  explanations:
    text: 'Heat always moves from hot to cold. In solids it passes along from particle to particle: conduction. In liquids and air, warm parts rise and cooler parts sink, carrying heat round: convection.'
    visual: 'Picture a pot of water on a stove: the water at the bottom warms, rises, and cooler water sinks to take its place, making a loop.'
    step_by_step: 'Step 1: Find the hot and cold objects. Step 2: Is it a solid? Then heat moves by conduction. Step 3: Is it a liquid or gas? Then convection. Step 4: Choose conductors or insulators for the job.'
    real_world: Woollen clothes trap air, a poor conductor, so they keep body heat in during winter.
  picture:
    kind: compare
    columns:
    - title: Conduction
      points:
      - In solids
      - Particle to particle
      - Metal spoon in hot tea
    - title: Convection
      points:
      - In liquids and gases
      - Warm rises, cool sinks
      - Boiling water, sea breeze
    alt: Conduction passes heat through solids particle to particle; convection carries heat in liquids and gases as warm parts rise and cool parts sink.
  activity:
    type: sort
    prompt: How is the heat moving?
    bins:
    - Conduction
    - Convection
    - Radiation
    items:
    - label: A steel spoon in hot tea gets hot at the handle
      bin: Conduction
      clue: Heat travels along a solid.
      why: Particle to particle.
    - label: A tawa warming the roti on it
      bin: Conduction
      clue: Touching surfaces.
      why: Conduction.
    - label: An iron pressing clothes
      bin: Conduction
      clue: Hot metal touching cloth.
      why: Conduction.
    - label: Water at the bottom of a pot rising as it warms
      bin: Convection
      clue: Warm liquid moves upward.
      why: Convection current.
    - label: A sea breeze in the day
      bin: Convection
      clue: Warm air over land rises; cool sea air moves in.
      why: Air carries the heat.
    - label: Smoke rising from a fire
      bin: Convection
      clue: Hot air rises, carrying smoke.
      why: Convection.
    - label: Feeling the Sun's warmth
      bin: Radiation
      clue: Heat crosses empty space.
      why: Radiation.
    - label: Warming your hands near, not touching, a fire
      bin: Radiation
      clue: Nothing touches your hands.
      why: Radiation.
  lesson:
    - teach: Heat flows from a hotter object to a colder one until they are equally warm. We measure how hot something is (its temperature) with a thermometer, in degrees Celsius (°C). A clinical thermometer reads 35–42 °C; normal body temperature is about 37 °C.
      picture:
        kind: flow
        steps:
        - Hot tea (80 °C)
        - heat flows
        - Cool cup and air
        - until both are equally warm
        alt: Heat flows from the hot tea to the cooler surroundings.
      check:
        prompt: You hold an ice cube. Which way does heat flow?
        options:
        - From your hand to the ice
        - From the ice to your hand
        - No heat flows
        answer: From your hand to the ice
        why: Your hand is warmer than the ice.
    - teach: 'In solids, heat passes from particle to particle: conduction. A metal spoon in hot tea gets hot all the way up. Metals are good conductors of heat. Wood, plastic, cloth and air are poor conductors (insulators), so pan handles are made of wood or plastic.'
      picture:
        kind: compare
        columns:
        - title: Good conductors
          points:
          - iron
          - copper
          - aluminium
          - steel
        - title: Poor conductors
          points:
          - wood
          - plastic
          - wool
          - air
        alt: Good and poor conductors of heat.
      check:
        prompt: Why are cooking pans made of metal?
        options:
        - Metals conduct heat well to the food
        - Metals keep food cold
        - Metals are poor conductors
        answer: Metals conduct heat well to the food
        why: Heat passes quickly through the metal base.
    - teach: 'In liquids and gases, heated parts become lighter and rise, and cooler parts sink to take their place. This carries heat round: convection. Heat a pot of water from below: the warm water rises, cooler water sinks, and the whole pot heats up.'
      picture:
        kind: flow
        steps:
        - Water at the bottom is heated
        - Warm water rises
        - Cool water sinks
        - The cycle repeats and all the water warms
        alt: Convection currents in a pot of water.
      check:
        prompt: How does the water at the top of a pot get hot when heated from below?
        options:
        - Warm water rises and carries heat up
        - Heat jumps through empty space
        - The pot conducts heat to the top only
        answer: Warm water rises and carries heat up
        why: That is convection.
  items:
  - prompt: 'Heat flows from:'
    options:
    - A hotter object to a colder one
    - A colder object to a hotter one
    - Large objects to small ones
    - It does not flow
    answer: A hotter object to a colder one
    difficulty: 1
    hints:
    - Hot tea cools down.
    - Hot to cold.
    solution: Heat always flows from hot to cold.
    mistakes:
      A colder object to a hotter one: c7s_heat_direction
  - prompt: What is normal human body temperature, in °C?
    answer: '37'
    check: '37'
    difficulty: 1
    hints:
    - Measured with a clinical thermometer.
    - Close to 37.
    solution: Normal body temperature is about 37 °C.
    mistakes: {"98.6": "t7_body_temp", "100": "t7_body_temp"}
  - prompt: Why do cooking pans have plastic or wooden handles?
    options:
    - Plastic and wood are poor conductors of heat
    - They look nice
    - They are heavier
    - They conduct heat well
    answer: Plastic and wood are poor conductors of heat
    difficulty: 1
    hints:
    - You need to hold it.
    - Insulators.
    solution: Poor conductors stop heat reaching your hand.
    mistakes: {"They conduct heat well": "t7_handle_insulator", "They look nice": "t7_handle_insulator"}
  - prompt: 'A metal spoon in hot tea becomes hot. This is:'
    options:
    - Conduction
    - Convection
    - Radiation
    - Evaporation
    answer: Conduction
    difficulty: 1
    hints:
    - Through a solid.
    - Particle to particle.
    solution: Heat travels through the solid spoon by conduction.
    mistakes: {"Convection": "t7_conduction", "Radiation": "t7_conduction"}
  - prompt: 'Water heated in a pot circulates as warm water rises. This is:'
    options:
    - Convection
    - Conduction
    - Radiation
    - Melting
    answer: Convection
    difficulty: 2
    hints:
    - In a liquid.
    - Warm rises, cool sinks.
    solution: Movement of warm liquid carrying heat is convection.
    mistakes: {"Conduction": "t7_convection", "Radiation": "t7_convection"}
  - prompt: Why do woollen clothes keep us warm?
    options:
    - Wool traps air, a poor conductor
    - Wool produces heat
    - Wool is a good conductor
    - Wool absorbs cold
    answer: Wool traps air, a poor conductor
    difficulty: 2
    hints:
    - Air between fibres.
    - Insulator.
    solution: Trapped air slows heat leaving the body.
    mistakes: {"Wool produces heat": "t7_wool_air", "Wool absorbs cold": "t7_wool_air"}
  - prompt: 'A thermometer measures:'
    options:
    - Temperature
    - Weight
    - Speed
    answer: Temperature
    difficulty: 1
    hints:
    - It tells how hot or cold something is.
    - Its unit is °C.
    solution: A thermometer measures temperature, in degrees Celsius.
    mistakes:
      Weight: c7s7_way
      Speed: c7s7_way
  - prompt: 'Heat moving along an iron rod held in a flame is:'
    options:
    - Conduction
    - Convection
    - Radiation
    answer: Conduction
    difficulty: 1
    hints:
    - The rod is a solid.
    - Heat passes particle to particle.
    solution: 'In solids, heat passes from particle to particle along the rod: conduction.'
    mistakes:
      Convection: c7s7_way
      Radiation: c7s7_way
  - prompt: Which is a poor conductor of heat?
    options:
    - Wood
    - Copper
    - Aluminium
    answer: Wood
    difficulty: 1
    hints:
    - Which is used for handles?
    - Metals conduct well.
    solution: Wood passes heat slowly, so it is a poor conductor; copper and aluminium are metals.
    mistakes:
      Copper: c7s7_blocker
      Aluminium: c7s7_blocker
  - prompt: A cup of hot milk is left on a table. What happens?
    options:
    - It cools as heat flows to the cooler air
    - It gets hotter
    - Cold flows into it from the air
    answer: It cools as heat flows to the cooler air
    difficulty: 1
    hints:
    - Which is warmer, the milk or the air?
    - Heat flows from warmer to cooler.
    solution: Heat flows from the hot milk to the cooler surroundings until they are equally warm.
    mistakes:
      It gets hotter: c7s7_downhill
      Cold flows into it from the air: c7s7_downhill
  - prompt: Why do quilts with trapped air keep us warm in winter?
    options:
    - Trapped air is a poor conductor, so body heat stays in
    - Air produces heat
    - Quilts conduct heat away quickly
    answer: Trapped air is a poor conductor, so body heat stays in
    difficulty: 2
    hints:
    - Does air pass heat easily?
    - Where does body heat go?
    solution: Air trapped in the quilt slows heat leaving the body, so we stay warm.
    mistakes:
      Air produces heat: c7s7_blocker
      Quilts conduct heat away quickly: c7s7_blocker
  - prompt: 'Smoke from a fire rises upward. This is an example of:'
    options:
    - Convection
    - Conduction
    - Radiation
    answer: Convection
    difficulty: 2
    hints:
    - Hot air and smoke move.
    - Warm gases rise.
    solution: Hot air rises, carrying smoke with it; heat carried by moving gas is convection.
    mistakes:
      Conduction: c7s7_way
      Radiation: c7s7_way
  - prompt: A doctor's thermometer shows 39 °C. What does this suggest?
    options:
    - The person has a fever
    - The temperature is normal
    - The person is too cold
    answer: The person has a fever
    difficulty: 2
    hints:
    - Normal body temperature is about 37 °C.
    - Is 39 higher or lower?
    solution: 39 °C is above the normal 37 °C, so the person has a fever.
    mistakes:
      The temperature is normal: c7s7_downhill
      The person is too cold: c7s7_downhill
  - prompt: In a room heater, why is the heater placed near the floor?
    options:
    - Warm air rises and spreads through the room
    - Heat only moves downwards
    - Floors conduct heat best
    answer: Warm air rises and spreads through the room
    difficulty: 2
    hints:
    - Which way does warm air move?
    - Convection currents.
    solution: Air heated near the floor rises and cooler air sinks to be heated, so the whole room warms.
    mistakes:
      Heat only moves downwards: c7s7_way
      Floors conduct heat best: c7s7_blocker
  - prompt: A steel spoon and a wooden spoon stand in the same hot soup. After a minute, which handle feels hotter, and why?
    options:
    - Steel, because metals conduct heat well
    - Wood, because wood conducts heat well
    - Both feel the same
    answer: Steel, because metals conduct heat well
    difficulty: 3
    hints:
    - Which is a metal?
    - Which passes heat quickly?
    solution: Steel conducts heat quickly up to the handle; wood is a poor conductor.
    mistakes:
      Wood, because wood conducts heat well: c7s7_blocker
      Both feel the same: c7s7_blocker
  - prompt: Why is an air conditioner usually fixed high up on a wall?
    options:
    - Cool air sinks and spreads through the room
    - Cool air rises to the ceiling
    - Walls conduct cold
    answer: Cool air sinks and spreads through the room
    difficulty: 3
    hints:
    - Is cool air heavier or lighter than warm air?
    - Think of convection the other way round.
    solution: Cool air is denser and sinks, while warm air rises to be cooled, so the room cools evenly.
    mistakes:
      Cool air rises to the ceiling: c7s7_way
      Walls conduct cold: c7s7_downhill
  - prompt: Why can a clinical thermometer not be used to measure boiling water?
    options:
    - It only reads 35–42 °C and could break
    - It only works in winter
    - Water is not hot enough
    answer: It only reads 35–42 °C and could break
    difficulty: 3
    hints:
    - What range does it show?
    - Boiling water is 100 °C.
    solution: A clinical thermometer is made for body temperatures (35–42 °C); 100 °C is far beyond its range.
    mistakes:
      It only works in winter: c7s7_downhill
      Water is not hot enough: c7s7_downhill
- code: cbse7s.heat.rad
  title: Radiation, sea breezes and the water cycle
  after:
  - cbse7s.heat.cond
  notes: |
    Radiation: heat travels without needing a material, even through empty space (the Sun's heat reaches Earth;
    warmth from a fire). Dark surfaces absorb more radiation; light-coloured surfaces reflect more (white
    clothes in summer). Sea breeze: by day land heats faster, warm air over it rises, cooler air from the sea
    moves in. Land breeze: at night land cools faster, air flows from land to sea. Heat from the Sun drives the
    water cycle: evaporation, condensation into clouds, precipitation.
  explanations:
    text: 'Radiation carries heat without touching, even across space: that is how the Sun warms us. Dark colours soak it up, light colours bounce it back. The Sun''s heat also drives winds and the water cycle.'
    visual: 'Picture a beach at noon: the sand is hot, warm air rises over it, and a cool breeze blows in from the sea to replace it. At night the flow reverses.'
    step_by_step: 'Step 1: No material between? It is radiation. Step 2: Dark colours absorb; light colours reflect. Step 3: By day the land heats faster, so the breeze blows from the sea. Step 4: At night it blows from the land.'
    real_world: People in hot places wear white or light clothes, and many roofs are painted white to keep houses cool.
  picture:
    kind: flow
    steps:
    - 'Daytime: land heats faster than sea'
    - Warm air over land rises
    - Cooler air from the sea moves in
    - Sea breeze blows onto land
    - 'At night the flow reverses: land breeze'
    alt: 'How a sea breeze forms: land heats faster by day, warm air rises over it, and cooler sea air flows in; at night the breeze reverses.'
  activity:
    type: order
    prompt: Why does a breeze blow from the sea onto land during the day?
    steps:
    - The Sun heats the land faster than the sea
    - The air above the land gets warmer
    - The warm air over the land rises
    - Cooler air from over the sea moves in to take its place
    - We feel a sea breeze on the beach
    reasons:
      The air above the land gets warmer: The land must warm before it can warm the air above it.
      The warm air over the land rises: Air rises only once it is warmer and lighter.
      Cooler air from over the sea moves in to take its place: The space has to be left by rising air before cool air moves in.
      We feel a sea breeze on the beach: The breeze is the cool sea air arriving.
  lesson:
    - teach: Radiation carries heat without needing any material, even across empty space. That is how the Sun's heat reaches Earth, and how you feel warm sitting near a fire without touching it.
      picture:
        kind: compare
        columns:
        - title: Conduction
          points:
          - through solids
          - spoon in tea
        - title: Convection
          points:
          - in liquids and gases
          - boiling water, breezes
        - title: Radiation
          points:
          - no material needed
          - Sun's heat, a fire
        alt: Three ways heat travels, with examples.
      check:
        prompt: How does heat from a campfire reach your face?
        options:
        - Radiation
        - Conduction
        - Convection through the ground
        answer: Radiation
        why: It travels through the air without heating it first.
    - teach: Dark, dull surfaces absorb more radiation; light, shiny surfaces reflect more. That is why white clothes feel cooler in summer, and dark clothes warmer in winter. Solar cookers are painted black inside.
      check:
        prompt: Why is the inside of a solar cooker painted black?
        options:
        - Black absorbs more heat
        - Black reflects more heat
        - Black looks nice
        answer: Black absorbs more heat
        why: Dark surfaces take in more radiation.
    - teach: 'Land heats and cools faster than water. By day, air over the hot land rises and cool air from the sea moves in: a sea breeze. At night, the land cools faster, so air moves from land to sea: a land breeze. The Sun''s heat also drives the water cycle: evaporation, condensation into clouds, then rain.'
      picture:
        kind: compare
        columns:
        - title: 'Day: sea breeze'
          points:
          - land hotter
          - air over land rises
          - wind from sea to land
        - title: 'Night: land breeze'
          points:
          - sea warmer
          - air over sea rises
          - wind from land to sea
        alt: Sea breeze in the day and land breeze at night.
      check:
        prompt: At midday on a beach, which way does the breeze blow?
        options:
        - From sea to land
        - From land to sea
        - There is no breeze
        answer: From sea to land
        why: Land is hotter, so air over it rises and sea air moves in.
  items:
  - prompt: How does heat from the Sun reach the Earth?
    options:
    - Radiation
    - Conduction
    - Convection
    - Through wires
    answer: Radiation
    difficulty: 1
    hints:
    - Space has no air.
    - No material needed.
    solution: Only radiation can cross empty space.
    mistakes: {"Conduction": "t7_radiation", "Convection": "t7_radiation"}
  - prompt: Why do people prefer white clothes in summer?
    options:
    - White reflects more heat
    - White absorbs more heat
    - White is cheaper
    - White conducts heat
    answer: White reflects more heat
    difficulty: 1
    hints:
    - Light colours.
    - Reflect radiation.
    solution: Light colours reflect more of the Sun's heat.
    mistakes: {"White absorbs more heat": "t7_white_reflects", "White conducts heat": "t7_white_reflects"}
  - prompt: 'During the day at the seaside, the breeze blows:'
    options:
    - From sea to land
    - From land to sea
    - Upwards only
    - There is no breeze
    answer: From sea to land
    difficulty: 2
    hints:
    - Land heats faster.
    - Warm air over land rises.
    solution: 'Cool sea air flows in to replace rising warm air over land: a sea breeze.'
    mistakes:
      From land to sea: c7s_breeze
  - prompt: 'At night, the breeze near the sea blows:'
    options:
    - From land to sea
    - From sea to land
    - Only during rain
    - In circles
    answer: From land to sea
    difficulty: 2
    hints:
    - Land cools faster.
    - Air over the sea is warmer.
    solution: 'At night air flows from the cooler land to the sea: a land breeze.'
    mistakes: {"From sea to land": "t7_land_breeze", "In circles": "t7_land_breeze"}
  - prompt: Which surface absorbs more heat in sunlight?
    options:
    - A black surface
    - A white surface
    - A mirror
    - Aluminium foil
    answer: A black surface
    difficulty: 1
    hints:
    - Dark colours.
    - Absorb radiation.
    solution: Dark surfaces absorb more radiation.
    mistakes: {"A white surface": "t7_black_absorbs", "A mirror": "t7_black_absorbs"}
  - prompt: What drives the water cycle?
    options:
    - Heat from the Sun
    - The Moon
    - Wind alone
    - Earthquakes
    answer: Heat from the Sun
    difficulty: 1
    hints:
    - Evaporation needs heat.
    - Source of energy.
    solution: The Sun's heat evaporates water, starting the cycle.
    mistakes: {"The Moon": "t7_water_cycle", "Earthquakes": "t7_water_cycle"}
  - prompt: Which way of heat transfer needs no material?
    options:
    - Radiation
    - Conduction
    - Convection
    answer: Radiation
    difficulty: 1
    hints:
    - Space between Sun and Earth is empty.
    - Yet the heat still arrives.
    solution: Radiation can travel through empty space, unlike conduction and convection.
    mistakes:
      Conduction: c7s7_way
      Convection: c7s7_way
  - prompt: Which colour shirt will feel hotter in strong sunshine?
    options:
    - Black
    - White
    - Light yellow
    answer: Black
    difficulty: 1
    hints:
    - Dark colours absorb more.
    - Light colours reflect more.
    solution: A black shirt absorbs more of the Sun's radiation, so it feels hotter.
    mistakes:
      White: c7s7_colour
      Light yellow: c7s7_colour
  - prompt: 'Which heats up faster in the Sun: land or sea?'
    options:
    - Land
    - Sea
    - Both the same
    answer: Land
    difficulty: 1
    hints:
    - Think of hot sand and cool sea water at noon.
    - Water warms slowly.
    solution: Land heats faster than water, which is why sea breezes blow by day.
    mistakes:
      Sea: c7s7_sand
      Both the same: c7s7_sand
  - prompt: What does the Sun's heat do in the water cycle?
    options:
    - Evaporates water from seas and lakes
    - Freezes water into ice
    - Stops rain from falling
    answer: Evaporates water from seas and lakes
    difficulty: 1
    hints:
    - Water vapour rises to form clouds.
    - Where does the vapour come from?
    solution: The Sun heats water so it evaporates; the vapour later condenses into clouds and falls as rain.
    mistakes:
      Freezes water into ice: c7s7_way
      Stops rain from falling: c7s7_way
  - prompt: At night near the sea, the breeze blows from land to sea. Why?
    options:
    - Land cools faster, so warmer air over the sea rises
    - The sea is colder at night
    - Wind always blows towards water
    answer: Land cools faster, so warmer air over the sea rises
    difficulty: 2
    hints:
    - Which cools faster at night?
    - Air rises over the warmer place.
    solution: At night land cools faster than water; air over the warmer sea rises and land air moves in.
    mistakes:
      The sea is colder at night: c7s7_breeze
      Wind always blows towards water: c7s7_breeze
  - prompt: Why are many roofs in hot places painted white?
    options:
    - White reflects sunlight and keeps the house cooler
    - White absorbs more heat
    - White paint is a conductor
    answer: White reflects sunlight and keeps the house cooler
    difficulty: 2
    hints:
    - Light colours reflect.
    - Less heat absorbed means cooler rooms.
    solution: White surfaces reflect much of the Sun's radiation, so less heat enters the house.
    mistakes:
      White absorbs more heat: c7s7_colour
      White paint is a conductor: c7s7_blocker
  - prompt: 'You sit near a heater but not touching it. You feel warm mainly by:'
    options:
    - Radiation
    - Conduction
    - Convection only
    answer: Radiation
    difficulty: 2
    hints:
    - You are not touching it.
    - Heat reaches you straight away across the gap.
    solution: Heat radiates from the hot heater to you without needing contact.
    mistakes:
      Conduction: c7s7_way
      Convection only: c7s7_way
  - prompt: 'Water vapour high in the sky cools and forms tiny droplets in clouds. This step is:'
    options:
    - Condensation
    - Evaporation
    - Radiation
    answer: Condensation
    difficulty: 2
    hints:
    - Gas turning into liquid.
    - The opposite of evaporation.
    solution: When vapour cools and turns to droplets, it is condensation; this forms clouds.
    mistakes:
      Evaporation: c7s7_way
      Radiation: c7s7_way
  - prompt: Two identical cans of water, one painted black and one shiny silver, stand in the Sun for an hour. What will you find?
    options:
    - The black can's water is warmer
    - The silver can's water is warmer
    - Both are the same
    answer: The black can's water is warmer
    difficulty: 3
    hints:
    - Which surface absorbs more radiation?
    - Shiny surfaces reflect.
    solution: The black can absorbs more of the Sun's radiation, so its water heats more.
    mistakes:
