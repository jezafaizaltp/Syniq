# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 7. Format: content/README.md.
subject: cbse7-sci
chapter: 7
title: Heat Transfer in Nature
tips:
  c7s_heat_direction: Heat always flows from the hotter object to the colder one.
  c7s_breeze: By day the land heats faster, so cooler air blows in from the sea; at night it reverses.
concepts:
- code: cbse7s.heat.cond
  title: Conduction and convection
  notes: |
    Heat flows from a hotter object to a colder one. Temperature is measured with a thermometer (normal body
    temperature about 37 °C; clinical thermometers read 35–42 °C). Conduction: heat passes through a solid from
    particle to particle (a metal spoon in hot tea gets hot). Metals are good conductors; wood, plastic, air are
    poor conductors (insulators), so pan handles are plastic or wood. Convection: in liquids and gases, warm
    parts rise and cool parts sink, carrying heat (water boiling in a pot, sea and land breezes).
  explanations:
    text: 'Heat always moves from hot to cold. In solids it passes along from particle to particle: conduction. In liquids and air, warm parts rise and cooler parts sink, carrying heat round: convection.'
    visual: 'Picture a pot of water on a stove: the water at the bottom warms, rises, and cooler water sinks to take its place, making a loop.'
    step_by_step: 'Step 1: Find the hot and cold objects. Step 2: Is it a solid? Then heat moves by conduction. Step 3: Is it a liquid or gas? Then convection. Step 4: Choose conductors or insulators for the job.'
    real_world: Woollen clothes trap air, a poor conductor, so they keep body heat in during winter.
  picture:
    kind: compare
    columns:
    - title: Conduction
      points:
      - In solids
      - Particle to particle
      - Metal spoon in hot tea
    - title: Convection
      points:
      - In liquids and gases
      - Warm rises, cool sinks
      - Boiling water, sea breeze
    alt: Conduction passes heat through solids particle to particle; convection carries heat in liquids and gases as warm parts rise and cool parts sink.
  items:
  - prompt: 'Heat flows from:'
    options:
    - A hotter object to a colder one
    - A colder object to a hotter one
    - Large objects to small ones
    - It does not flow
    answer: A hotter object to a colder one
    difficulty: 1
    hints:
    - Hot tea cools down.
    - Hot to cold.
    solution: Heat always flows from hot to cold.
    mistakes:
      A colder object to a hotter one: c7s_heat_direction
  - prompt: What is normal human body temperature, in °C?
    answer: '37'
    check: '37'
    difficulty: 1
    hints:
    - Measured with a clinical thermometer.
    - Close to 37.
    solution: Normal body temperature is about 37 °C.
  - prompt: Why do cooking pans have plastic or wooden handles?
    options:
    - Plastic and wood are poor conductors of heat
    - They look nice
    - They are heavier
    - They conduct heat well
    answer: Plastic and wood are poor conductors of heat
    difficulty: 1
    hints:
    - You need to hold it.
    - Insulators.
    solution: Poor conductors stop heat reaching your hand.
  - prompt: 'A metal spoon in hot tea becomes hot. This is:'
    options:
    - Conduction
    - Convection
    - Radiation
    - Evaporation
    answer: Conduction
    difficulty: 1
    hints:
    - Through a solid.
    - Particle to particle.
    solution: Heat travels through the solid spoon by conduction.
  - prompt: 'Water heated in a pot circulates as warm water rises. This is:'
    options:
    - Convection
    - Conduction
    - Radiation
    - Melting
    answer: Convection
    difficulty: 2
    hints:
    - In a liquid.
    - Warm rises, cool sinks.
    solution: Movement of warm liquid carrying heat is convection.
  - prompt: Why do woollen clothes keep us warm?
    options:
    - Wool traps air, a poor conductor
    - Wool produces heat
    - Wool is a good conductor
    - Wool absorbs cold
    answer: Wool traps air, a poor conductor
    difficulty: 2
    hints:
    - Air between fibres.
    - Insulator.
    solution: Trapped air slows heat leaving the body.
- code: cbse7s.heat.rad
  title: Radiation, sea breezes and the water cycle
  after:
  - cbse7s.heat.cond
  notes: |
    Radiation: heat travels without needing a material, even through empty space (the Sun's heat reaches Earth;
    warmth from a fire). Dark surfaces absorb more radiation; light-coloured surfaces reflect more (white
    clothes in summer). Sea breeze: by day land heats faster, warm air over it rises, cooler air from the sea
    moves in. Land breeze: at night land cools faster, air flows from land to sea. Heat from the Sun drives the
    water cycle: evaporation, condensation into clouds, precipitation.
  explanations:
    text: 'Radiation carries heat without touching, even across space: that is how the Sun warms us. Dark colours soak it up, light colours bounce it back. The Sun''s heat also drives winds and the water cycle.'
    visual: 'Picture a beach at noon: the sand is hot, warm air rises over it, and a cool breeze blows in from the sea to replace it. At night the flow reverses.'
    step_by_step: 'Step 1: No material between? It is radiation. Step 2: Dark colours absorb; light colours reflect. Step 3: By day the land heats faster, so the breeze blows from the sea. Step 4: At night it blows from the land.'
    real_world: People in hot places wear white or light clothes, and many roofs are painted white to keep houses cool.
  picture:
    kind: flow
    steps:
    - 'Daytime: land heats faster than sea'
    - Warm air over land rises
    - Cooler air from the sea moves in
    - Sea breeze blows onto land
    - 'At night the flow reverses: land breeze'
    alt: 'How a sea breeze forms: land heats faster by day, warm air rises over it, and cooler sea air flows in; at night the breeze reverses.'
  items:
  - prompt: How does heat from the Sun reach the Earth?
    options:
    - Radiation
    - Conduction
    - Convection
    - Through wires
    answer: Radiation
    difficulty: 1
    hints:
    - Space has no air.
    - No material needed.
    solution: Only radiation can cross empty space.
  - prompt: Why do people prefer white clothes in summer?
    options:
    - White reflects more heat
    - White absorbs more heat
    - White is cheaper
    - White conducts heat
    answer: White reflects more heat
    difficulty: 1
    hints:
    - Light colours.
    - Reflect radiation.
    solution: Light colours reflect more of the Sun's heat.
  - prompt: 'During the day at the seaside, the breeze blows:'
    options:
    - From sea to land
    - From land to sea
    - Upwards only
    - There is no breeze
    answer: From sea to land
    difficulty: 2
    hints:
    - Land heats faster.
    - Warm air over land rises.
    solution: 'Cool sea air flows in to replace rising warm air over land: a sea breeze.'
    mistakes:
      From land to sea: c7s_breeze
  - prompt: 'At night, the breeze near the sea blows:'
    options:
    - From land to sea
    - From sea to land
    - Only during rain
    - In circles
    answer: From land to sea
    difficulty: 2
    hints:
    - Land cools faster.
    - Air over the sea is warmer.
    solution: 'At night air flows from the cooler land to the sea: a land breeze.'
  - prompt: Which surface absorbs more heat in sunlight?
    options:
    - A black surface
    - A white surface
    - A mirror
    - Aluminium foil
    answer: A black surface
    difficulty: 1
    hints:
    - Dark colours.
    - Absorb radiation.
    solution: Dark surfaces absorb more radiation.
  - prompt: What drives the water cycle?
    options:
    - Heat from the Sun
    - The Moon
    - Wind alone
    - Earthquakes
    answer: Heat from the Sun
    difficulty: 1
    hints:
    - Evaporation needs heat.
    - Source of energy.
    solution: The Sun's heat evaporates water, starting the cycle.
