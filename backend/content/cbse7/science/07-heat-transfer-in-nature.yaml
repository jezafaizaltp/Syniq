    - 'Which is hotter on a sunny afternoon: the sand or the sea?'
    - Where does the air rise, and from where does cooler air come in?
    solution: 'By afternoon the land is hotter than the sea. Air over the land rises and cooler air blows in from the sea: a sea breeze, which carries the kite towards the land.'
    mistakes:
      "Towards the sea, because a land breeze is blowing out from the land": c7s7_breeze
      "Straight up into the sky, because hot air only ever rises upwards": c7s7_sand
    exam: competency
    difficulty: 2
