      Both are the same: c7s7_colour
  - prompt: Fishermen in Kerala often sail out early in the morning and return in the afternoon. How do breezes help?
    options:
    - "The land breeze carries them out; the sea breeze brings them back"
    - "The sea breeze carries them out at dawn; the land breeze brings them in"
    - "The breezes do not change during the day, so they blow both ways"
    answer: The land breeze carries them out; the sea breeze brings them back
    difficulty: 3
    hints:
    - Which breeze blows from land at night and early morning?
    - Which blows from sea later in the day?
    solution: Early on, the land breeze blows out to sea; by afternoon, the sea breeze blows towards land.
    mistakes:
      "The sea breeze carries them out at dawn; the land breeze brings them in": c7s7_breeze
      "The breezes do not change during the day, so they blow both ways": c7s7_breeze
  - prompt: A flask (thermos) has shiny walls and a gap with no air. Why does this keep tea hot?
    options:
    - "Shiny walls reduce radiation and the empty gap stops conduction and convection"
    - "Shiny walls absorb all the heat and send it back into the tea again and again"
    - "The empty gap conducts heat well, so the heat goes round the tea and stays in"
    answer: Shiny walls reduce radiation and the empty gap stops conduction and convection
    difficulty: 3
    hints:
    - Think about all three ways heat can escape.
    - What does each part of the flask stop?
    solution: Shiny surfaces reflect radiation back; with no material in the gap, heat cannot leave by conduction or convection.
    mistakes:
      "Shiny walls absorb all the heat and send it back into the tea again and again": c7s7_colour
      "The empty gap conducts heat well, so the heat goes round the tea and stays in": c7s7_blocker
  - prompt: 'Assertion (A): The Sun''s heat reaches the Earth by radiation.

      Reason (R): Radiation does not need any material to carry heat.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. The space between the Sun and the Earth is nearly empty, so only radiation can carry heat across it; R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): A sea breeze blows during the night.

      Reason (R): Land heats up faster than the sea during the day.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: because of R, the air over the land rises by day and cool sea air blows in, so the sea breeze is a daytime breeze. R is true.'
