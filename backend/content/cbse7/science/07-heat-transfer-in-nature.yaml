      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A village in a hot region is planning new houses. One builder suggests dark tin roofs. Another suggests white-painted roofs with a layer of trapped air underneath. Which design keeps the houses cooler, and why?'
    options:
    - "White roofs with an air gap: white reflects radiation and trapped air conducts poorly"
    - "Dark tin roofs: dark colours keep heat out, and tin is a poor conductor of heat"
    - "Either one: a roof does not affect the heat inside a house in any way at all"
    answer: 'White roofs with an air gap: white reflects radiation and trapped air conducts poorly'
    hints:
    - Which colour sends more of the Sun's radiation back?
    - Is still air a good or a poor conductor of heat?
    solution: A white surface reflects more of the Sun's radiation, and trapped air is a poor conductor, so less heat reaches the rooms. Dark tin absorbs radiation and conducts it inside.
    mistakes:
      "Dark tin roofs: dark colours keep heat out, and tin is a poor conductor of heat": c7s7_colour
      "Either one: a roof does not affect the heat inside a house in any way at all": c7s7_blocker
    exam: case
    difficulty: 2
  - prompt: 'Situation: On a hot afternoon a kite is flown from a beach. Its string slants steadily in one direction. Which way is the kite carried, and why?'
    options:
