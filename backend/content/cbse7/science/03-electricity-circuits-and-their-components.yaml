# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 3. Format: content/README.md.
subject: cbse7-sci
chapter: 3
title: 'Electricity: Circuits and Their Components'
tips:
  c7s_closed: 'Current flows only through a complete loop: a closed switch, no gaps.'
  c7s_graphite: Graphite is a non-metal that conducts; rubber, plastic and wood are insulators.
  t7_battery: "A battery is made of more than one of something. Of what?"
  t7_bulb_fault: "The switch is on, yet no current flows. Where could the path be broken?"
  t7_cell_symbol: "In the cell symbol the long line is + and the short line is −."
  t7_cells_join: "The + end of one cell must touch the − end of the next, like a chain."
  t7_conductor: "Metals conduct electricity. Which choice is a metal?"
  t7_graphite: "Graphite is not a metal, yet the bulb glows. What does that tell you?"
  t7_insulator: "Plastic stops current. Why is that useful on the outside of a wire?"
  t7_spoon_conductor: "The bulb lights up only if current passes through the spoon."
  t7_switch: "A switch makes a gap or closes it."
  t7_wet_hands: "Ordinary water with dissolved salts conducts electricity. What could happen to you?"
concepts:
- code: cbse7s.elec.circuit
  title: Electric circuits
  notes: |
    An electric cell has a positive (+) and negative (−) terminal; a battery is two or more cells joined. A
    circuit is a closed path from one terminal through wires and devices back to the other. A bulb glows only if
    the circuit is closed (complete). A switch opens or closes the circuit. Circuit diagrams use symbols: cell
    (long and short lines), bulb, switch, wire. In a torch, cells, switch and bulb form a circuit. Cells should
    be joined + to − in series.
  explanations:
    text: 'Electricity flows only around a complete loop, called a closed circuit: from one end of the cell, through wires and the bulb, back to the other end. A switch breaks or completes the loop to turn things off and on.'
    visual: Draw a cell, a bulb and a switch joined in a loop by wires. With the switch closed, the loop is complete and the bulb glows; open it, and there is a gap.
    step_by_step: 'Step 1: Find the cell''s two terminals. Step 2: Trace the path through each part. Step 3: Look for gaps or open switches. Step 4: If the loop is complete, current flows.'
    real_world: When you press a torch button, a metal strip completes the circuit between the cells and the bulb.
  picture:
    kind: flow
    steps:
    - Cell (+)
    - Wire
    - Switch (closed)
    - Bulb
    - Wire back to cell (−)
    alt: 'A simple closed circuit: from the cell''s positive terminal through a closed switch and bulb, back to the negative terminal.'
  activity:
    type: sort
    prompt: Will the bulb light?
    bins:
    - Bulb lights
    - Bulb stays off
    items:
    - label: Cell, bulb, wires and a closed switch in one loop
      bin: Bulb lights
      clue: Is the loop complete?
      why: 'A closed circuit: current flows.'
    - label: Both wires of the bulb go to opposite ends of the cell
      bin: Bulb lights
      clue: Can current go out, through the bulb, and back?
      why: A complete path.
    - label: Two cells joined + to −, with a bulb in the loop
      bin: Bulb lights
      clue: Are the cells joined the right way round?
      why: Brighter, even.
    - label: A loop with a steel safety pin in it
      bin: Bulb lights
      clue: Steel is a metal.
      why: Current passes through the pin.
    - label: The switch is open
      bin: Bulb stays off
      clue: Is there a gap in the loop?
      why: An open circuit.
    - label: Both bulb wires go to the same end of the cell
      bin: Bulb stays off
      clue: Does the current have a way back?
      why: No complete loop.
    - label: One wire has come loose
      bin: Bulb stays off
      clue: Is the path broken?
      why: A break stops the current.
    - label: A plastic ruler is part of the loop
      bin: Bulb stays off
      clue: Can current pass through plastic?
      why: An insulator breaks the circuit.
  items:
  - prompt: When does a bulb in a circuit glow?
    options:
    - When the circuit is closed
    - When the switch is open
    - When one wire is cut
    - Always
    answer: When the circuit is closed
    difficulty: 1
    hints:
    - Current needs a complete path.
    - No gaps.
    solution: A complete (closed) circuit lets current flow.
    mistakes:
      When the switch is open: c7s_closed
  - prompt: What does a switch do?
    options:
    - Opens or closes the circuit
    - Makes electricity
    - Stores electricity
    - Makes the bulb brighter
    answer: Opens or closes the circuit
    difficulty: 1
    hints:
    - On and off.
    - It makes or breaks the loop.
    solution: A switch completes or breaks the circuit.
    mistakes: {"Makes electricity": "t7_switch", "Stores electricity": "t7_switch"}
  - prompt: 'A battery is:'
    options:
    - Two or more cells joined together
    - A single wire
    - A type of bulb
    - A switch
    answer: Two or more cells joined together
    difficulty: 1
    hints:
    - A torch uses two cells.
    - Joined + to −.
    solution: A battery is a group of cells.
    mistakes: {"A single wire": "t7_battery", "A switch": "t7_battery"}
  - prompt: How should two cells be joined in a torch?
    options:
    - + of one to − of the other
    - + to +
    - − to −
    - It doesn't matter
    answer: + of one to − of the other
    difficulty: 2
    hints:
    - In series.
    - Opposite terminals touch.
    solution: Cells in series join positive to negative.
    mistakes: {"+ to +": "t7_cells_join", "It doesn't matter": "t7_cells_join"}
  - prompt: 'In a circuit diagram, a long line and a short line side by side stand for:'
    options:
    - A cell
    - A bulb
    - A switch
    - A wire
    answer: A cell
    difficulty: 2
    hints:
    - Long = +, short = −.
    - The source.
    solution: That symbol is a cell.
    mistakes: {"A bulb": "t7_cell_symbol", "A switch": "t7_cell_symbol"}
  - prompt: A bulb does not glow though the switch is on. What could be wrong?
    options:
    - The filament is broken or a wire is loose
    - The circuit is closed
    - The cell is new
    - The switch is on
    answer: The filament is broken or a wire is loose
    difficulty: 2
    hints:
    - Look for a gap.
    - A fused bulb breaks the path.
    solution: A broken filament or loose wire makes a gap, so no current flows.
    mistakes: {"The circuit is closed": "t7_bulb_fault", "The cell is new": "t7_bulb_fault"}
- code: cbse7s.elec.conductors
  title: Conductors and insulators
  after:
  - cbse7s.elec.circuit
  notes: |
    Materials that let electricity pass are conductors (metals: copper, aluminium, iron; also graphite and our
    bodies). Those that don't are insulators (plastic, rubber, wood, glass, dry paper). Test with a simple
    circuit and a gap: put the material across the gap; if the bulb glows, it conducts. Wires are copper inside
    (conductor) and plastic outside (insulator). Electricians use rubber gloves. Safety: never touch switches with
    wet hands; never play with mains electricity.
  explanations:
    text: Conductors let electricity through, insulators don't. Metals like copper are good conductors, so wires are made of copper. Plastic and rubber are insulators, so they cover wires to keep us safe.
    visual: 'Leave a gap in a circuit and bridge it with different objects: a steel spoon lights the bulb; a plastic ruler doesn''t.'
    step_by_step: 'Step 1: Make a circuit with a gap. Step 2: Place the material across the gap. Step 3: If the bulb glows, it is a conductor. Step 4: If not, it is an insulator.'
    real_world: Plug pins are brass (conductor) but the plug body is plastic (insulator), so current reaches the device and not your hand.
  picture:
    kind: compare
    columns:
    - title: Conductors
      points:
      - Copper, aluminium, iron
      - Graphite (pencil lead)
      - Used for wires and pins
    - title: Insulators
      points:
      - Plastic, rubber, wood
      - Glass, dry paper
      - Used for covers and handles
    alt: Conductors (metals, graphite) let current flow and are used for wires; insulators (plastic, rubber, wood) block it and are used for covers.
  activity:
    type: sort
    prompt: Conductor or insulator?
    bins:
    - Conductor
    - Insulator
    items:
    - label: Copper wire
      bin: Conductor
      clue: Why are wires made of it?
      why: Metals conduct.
    - label: Iron nail
      bin: Conductor
      clue: A metal.
      why: Conducts.
    - label: Aluminium foil
      bin: Conductor
      clue: Shiny metal sheet.
      why: Conducts.
    - label: Pencil lead (graphite)
      bin: Conductor
      clue: 'Try it in a circuit: the bulb glows.'
      why: Graphite is a non-metal that conducts.
    - label: Plastic ruler
      bin: Insulator
      clue: What covers electric wires?
      why: Plastic doesn't let current through.
    - label: Rubber eraser
      bin: Insulator
      clue: Electricians wear gloves of this.
      why: Insulator.
    - label: Dry wood
      bin: Insulator
      clue: No metal in it.
      why: Insulator.
    - label: Glass
      bin: Insulator
      clue: Used on electric poles to hold wires.
      why: Insulator.
  items:
  - prompt: Which is a good conductor of electricity?
    options:
    - Copper
    - Plastic
    - Rubber
    - Wood
    answer: Copper
    difficulty: 1
    hints:
    - Used inside wires.
    - A metal.
    solution: Copper is a metal and conducts well.
    mistakes: {"Plastic": "t7_conductor", "Wood": "t7_conductor"}
  - prompt: Why are electric wires covered with plastic?
    options:
    - Plastic is an insulator and keeps us safe
    - Plastic conducts better
    - To make them heavier
    - For colour only
    answer: Plastic is an insulator and keeps us safe
    difficulty: 1
    hints:
    - Stops current reaching us.
    - Insulator.
    solution: The plastic cover prevents shocks and short circuits.
    mistakes: {"Plastic conducts better": "t7_insulator", "For colour only": "t7_insulator"}
  - prompt: 'A steel spoon placed across a gap makes the bulb glow. The spoon is:'
    options:
    - A conductor
    - An insulator
    - A switch
    - A cell
    answer: A conductor
    difficulty: 1
    hints:
    - Current passed through.
    - Steel is a metal.
    solution: It completed the circuit, so it conducts.
    mistakes: {"An insulator": "t7_spoon_conductor", "A cell": "t7_spoon_conductor"}
  - prompt: Which material is an insulator?
    options:
    - Rubber
    - Aluminium
    - Iron
    - Graphite
    answer: Rubber
    difficulty: 1
    hints:
    - Electricians' gloves.
    - Not a metal.
    solution: Rubber is an insulator.
    mistakes:
      Graphite: c7s_graphite
  - prompt: Why should you not touch switches with wet hands?
    options:
    - Water with impurities conducts and can give a shock
    - Water damages plastic
    - It wastes electricity
    - Switches get rusty
    answer: Water with impurities conducts and can give a shock
    difficulty: 2
    hints:
    - Tap water conducts.
    - Safety.
    solution: Impure water conducts electricity, so current may pass through you.
    mistakes: {"Water damages plastic": "t7_wet_hands", "Switches get rusty": "t7_wet_hands"}
  - prompt: 'Pencil lead (graphite) in a circuit makes the bulb glow dimly. This shows graphite is:'
    options:
    - A conductor, though not a metal
    - An insulator
    - A metal
    - A magnet
    answer: A conductor, though not a metal
    difficulty: 2
    hints:
    - The bulb glowed.
    - Graphite is carbon.
    solution: Graphite conducts electricity even though it is a non-metal.
    mistakes: {"An insulator": "t7_graphite", "A metal": "t7_graphite"}
