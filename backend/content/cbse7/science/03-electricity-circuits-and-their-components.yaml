# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 3. Format: content/README.md.
subject: cbse7-sci
chapter: 3
title: 'Electricity: Circuits and Their Components'
tips:
  c7s_closed: 'Current flows only through a complete loop: a closed switch, no gaps.'
  c7s_graphite: "Graphite, the pencil lead, lets current pass even though it is a non-metal. An insulator blocks current. Which choice is used to cover wires?"
  t7_battery: "A battery is made of more than one of something. Of what?"
  t7_bulb_fault: "The switch is on, yet no current flows. Where could the path be broken?"
  t7_cell_symbol: "A bulb is drawn as a circle with a cross and a switch as a gap with a lever. Two parallel lines of different lengths stand for the part that pushes the current."
  t7_cells_join: "The + end of one cell must touch the − end of the next, like a chain."
  t7_conductor: "Metals conduct electricity. Which choice is a metal?"
  t7_graphite: "Graphite is not a metal, yet the bulb glows. What does that tell you?"
  t7_insulator: "Plastic stops current. Why is that useful on the outside of a wire?"
  t7_spoon_conductor: "The bulb lights up only if current passes through the spoon."
  t7_switch: "A switch makes a gap or closes it."
  t7_wet_hands: "Ordinary water with dissolved salts conducts electricity. What could happen to you?"
  c7s3_loop: Electricity flows only round an unbroken loop, from one end of the cell, through every part, back to the other end. Look for any gap.
  c7s3_switch: Think of a gate in the loop. One part of a circuit can join the path or break it each time you press it.
  c7s3_terminals: Every cell has two ends, marked + and −. Cells in a row join the + of one to the − of the next.
  c7s3_symbol: Each part of a circuit has its own picture-symbol. Recall which part is drawn as two lines of different lengths, which as a circle with a cross, and which as a gap with a lever.
  c7s3_metal: Most metals, and graphite, let electricity pass. Materials that are not metals usually block it.
  c7s3_safe: Our bodies and impure water let electricity through, so wet hands and mains sockets are dangerous.
concepts:
- code: cbse7s.elec.circuit
  title: Electric circuits
  notes: |
    An electric cell has a positive (+) and negative (−) terminal; a battery is two or more cells joined. A
    circuit is a closed path from one terminal through wires and devices back to the other. A bulb glows only if
    the circuit is closed (complete). A switch opens or closes the circuit. Circuit diagrams use symbols: cell
    (long and short lines), bulb, switch, wire. In a torch, cells, switch and bulb form a circuit. Cells should
    be joined + to − in series.
  explanations:
    text: 'Electricity flows only around a complete loop, called a closed circuit: from one end of the cell, through wires and the bulb, back to the other end. A switch breaks or completes the loop to turn things off and on.'
    visual: Draw a cell, a bulb and a switch joined in a loop by wires. With the switch closed, the loop is complete and the bulb glows; open it, and there is a gap.
    step_by_step: 'Step 1: Find the cell''s two terminals. Step 2: Trace the path through each part. Step 3: Look for gaps or open switches. Step 4: If the loop is complete, current flows.'
    real_world: When you press a torch button, a metal strip completes the circuit between the cells and the bulb.
  picture:
    kind: flow
    steps:
    - Cell (+)
    - Wire
    - Switch (closed)
    - Bulb
    - Wire back to cell (−)
    alt: 'A simple closed circuit: from the cell''s positive terminal through a closed switch and bulb, back to the negative terminal.'
  activity:
    type: sort
    prompt: Will the bulb light?
    bins:
    - Bulb lights
    - Bulb stays off
    items:
    - label: Cell, bulb, wires and a closed switch in one loop
      bin: Bulb lights
      clue: Is the loop complete?
      why: 'A closed circuit: current flows.'
    - label: Both wires of the bulb go to opposite ends of the cell
      bin: Bulb lights
      clue: Can current go out, through the bulb, and back?
      why: A complete path.
    - label: Two cells joined + to −, with a bulb in the loop
      bin: Bulb lights
      clue: Are the cells joined the right way round?
      why: Brighter, even.
    - label: A loop with a steel safety pin in it
      bin: Bulb lights
      clue: Steel is a metal.
      why: Current passes through the pin.
    - label: The switch is open
      bin: Bulb stays off
      clue: Is there a gap in the loop?
      why: An open circuit.
    - label: Both bulb wires go to the same end of the cell
      bin: Bulb stays off
      clue: Does the current have a way back?
      why: No complete loop.
    - label: One wire has come loose
      bin: Bulb stays off
      clue: Is the path broken?
      why: A break stops the current.
    - label: A plastic ruler is part of the loop
      bin: Bulb stays off
      clue: Can current pass through plastic?
      why: An insulator breaks the circuit.
  lesson:
    - teach: 'An electric cell has two terminals: positive (+) and negative (−). A battery is two or more cells joined together. A circuit is a complete path that goes from one terminal, through wires and a bulb, back to the other terminal. The bulb glows only when the path is closed.'
      picture:
        kind: flow
        steps:
        - Cell + terminal
        - Wire
        - Switch (closed)
        - Bulb
        - Wire
        - Cell − terminal
        alt: 'A closed circuit: current goes from the cell, through switch and bulb, and back.'
      check:
        prompt: 'A bulb glows only when the circuit is:'
        options:
        - Closed
        - Open
        - Broken
        answer: Closed
        why: Electricity needs a complete loop.
    - teach: A switch opens or closes the circuit. Off means a gap (open circuit), so no current flows. On means the gap is closed. In a torch, the cells, switch and bulb make a circuit; the cells are placed + of one touching − of the next.
      check:
        prompt: 'When a torch switch is turned off, the circuit is:'
        options:
        - Open
        - Closed
        - Joined twice
        answer: Open
        why: Off makes a gap in the path.
    - teach: Circuit diagrams use symbols. A cell is a long line (+) and a short line (−). A bulb is a circle with a cross. A switch is a break with a small lever. Wires are straight lines. A bulb's thin coiled wire (filament) glows; if it breaks, the bulb is fused and the circuit is open.
      picture:
        kind: compare
        columns:
        - title: Part
          points:
          - Cell
          - Bulb
          - Switch
          - Wire
        - title: Symbol
          points:
          - long line + short line
          - circle with a cross
          - gap with a lever
          - straight line
        alt: Circuit parts and their symbols.
      check:
        prompt: 'In a cell symbol, the long line stands for:'
        options:
        - The positive terminal
        - The negative terminal
        - The bulb
        answer: The positive terminal
        why: Long line +, short line −.
  items:
  - prompt: When does a bulb in a circuit glow?
    options:
    - When the circuit is closed
    - When the switch is open
    - When one wire is cut
    - Always
    answer: When the circuit is closed
    difficulty: 1
    hints:
    - Current needs a complete path.
    - No gaps.
    solution: A complete (closed) circuit lets current flow.
    mistakes:
      When the switch is open: c7s_closed
  - prompt: What does a switch do?
    options:
    - Opens or closes the circuit
    - Makes electricity
    - Stores electricity
    - Makes the bulb brighter
    answer: Opens or closes the circuit
    difficulty: 1
    hints:
    - On and off.
    - It makes or breaks the loop.
    solution: A switch completes or breaks the circuit.
    mistakes: {"Makes electricity": "t7_switch", "Stores electricity": "t7_switch"}
  - prompt: 'A battery is:'
    options:
    - Two or more cells joined together
    - A single wire
    - A type of bulb
    - A switch
    answer: Two or more cells joined together
    difficulty: 1
    hints:
    - A torch uses two cells.
    - Joined + to −.
    solution: A battery is a group of cells.
    mistakes: {"A single wire": "t7_battery", "A switch": "t7_battery"}
  - prompt: How should two cells be joined in a torch?
    options:
    - + of one to − of the other
    - + to +
    - − to −
    - It doesn't matter
    answer: + of one to − of the other
    difficulty: 2
    hints:
    - In series.
    - Opposite terminals touch.
    solution: Cells in series join positive to negative.
    mistakes: {"+ to +": "t7_cells_join", "It doesn't matter": "t7_cells_join"}
  - prompt: 'In a circuit diagram, a long line and a short line side by side stand for:'
    options:
    - A cell
    - A bulb
    - A switch
    - A wire
    answer: A cell
    difficulty: 2
    hints:
    - Long = +, short = −.
    - The source.
    solution: That symbol is a cell.
    mistakes: {"A bulb": "t7_cell_symbol", "A switch": "t7_cell_symbol"}
  - prompt: A bulb does not glow though the switch is on. What could be wrong?
    options:
    - The filament is broken or a wire is loose
    - The circuit is closed
    - The cell is new
    - The switch is on
    answer: The filament is broken or a wire is loose
    difficulty: 2
    hints:
    - Look for a gap.
    - A fused bulb breaks the path.
    solution: A broken filament or loose wire makes a gap, so no current flows.
    mistakes: {"The circuit is closed": "t7_bulb_fault", "The cell is new": "t7_bulb_fault"}
  - prompt: What are the two terminals of a cell?
    options:
    - Positive and negative
    - Top and bottom only
    - On and off
    answer: Positive and negative
    difficulty: 1
    hints:
    - They are marked with signs.
    - + and −.
    solution: Every cell has a positive (+) and a negative (−) terminal.
    mistakes:
      Top and bottom only: c7s3_terminals
      On and off: c7s3_switch
  - prompt: A wire in the circuit comes loose. What happens to the bulb?
    options:
    - It stops glowing
    - It glows brighter
    - Nothing changes
    answer: It stops glowing
    difficulty: 1
    hints:
    - Is the loop still complete?
    - A gap stops the current.
    solution: A loose wire makes a gap, the circuit becomes open, and the bulb goes off.
    mistakes:
      It glows brighter: c7s3_loop
      Nothing changes: c7s3_loop
  - prompt: 'In a circuit diagram, a circle with a cross inside stands for:'
    options:
    - A bulb
    - A cell
    - A switch
    answer: A bulb
    difficulty: 1
    hints:
    - It is the part that lights up.
    - Cells are drawn as two lines.
    solution: The bulb symbol is a circle with a cross.
    mistakes:
      A cell: c7s3_symbol
      A switch: c7s3_symbol
  - prompt: Which device opens and closes a circuit?
    options:
    - Switch
    - Bulb
    - Cell
    answer: Switch
    difficulty: 1
    hints:
    - You turn it on and off.
    - It makes or breaks the path.
    solution: A switch makes a gap (off) or closes it (on).
    mistakes:
      Bulb: c7s3_switch
      Cell: c7s3_switch
  - prompt: Two cells are put in a torch with + touching +. What happens?
    options:
    - The bulb does not light properly
    - The bulb glows extra bright
    - The cells charge each other
    answer: The bulb does not light properly
    difficulty: 2
    hints:
    - How should cells be joined?
    - + of one should touch − of the next.
    solution: Cells must be joined + to −; joined + to + they work against each other and the bulb does not light properly.
    mistakes:
      The bulb glows extra bright: c7s3_terminals
      The cells charge each other: c7s3_terminals
  - prompt: A new cell and closed switch, but the bulb does not glow. The bulb's filament is broken. Why does that stop it?
    options:
    - The broken filament makes a gap in the loop
    - The cell is too strong
    - Bulbs need two switches
    answer: The broken filament makes a gap in the loop
    difficulty: 2
    hints:
    - Current passes through the filament.
    - What does a break in it do?
    solution: The current must flow through the filament; a break leaves a gap, so the circuit is open.
    mistakes:
      The cell is too strong: c7s3_loop
      Bulbs need two switches: c7s3_switch
  - prompt: Why does a battery of 2 cells make a bulb glow brighter than 1 cell?
    options:
    - Two cells push more current round the circuit
    - Two cells make the wire shorter
    - Two cells close the switch
    answer: Two cells push more current round the circuit
    difficulty: 2
    hints:
    - A battery is cells joined together.
    - More cells, more push.
    solution: Joining cells + to − adds their push, so more current flows and the bulb glows brighter.
    mistakes:
      Two cells make the wire shorter: c7s3_terminals
      Two cells close the switch: c7s3_switch
  - prompt: Which is an open circuit?
    options:
    - A torch with its switch off
    - A torch with its switch on and a good bulb
    - A lit bulb connected to a cell
    answer: A torch with its switch off
    difficulty: 2
    hints:
    - Open means there is a gap.
    - Where could the gap be?
    solution: A switch turned off leaves a gap, so the circuit is open and no current flows.
    mistakes:
      A torch with its switch on and a good bulb: c7s3_switch
      A lit bulb connected to a cell: c7s3_loop
  - prompt: A bulb is connected to both wires at only one terminal of a cell. Will it glow?
    options:
    - No, the loop must go from one terminal to the other
    - Yes, one terminal is enough
    - Yes, but only if the cell is new
    answer: No, the loop must go from one terminal to the other
    difficulty: 3
    hints:
    - Where must the loop start and end?
    - Both ends of the cell are needed.
    solution: A circuit needs a path from + to −; both wires at one terminal make no loop, so no current.
    mistakes:
      Yes, one terminal is enough: c7s3_terminals
      Yes, but only if the cell is new: c7s3_loop
  - prompt: In a room, two bulbs are on separate switches. Turning one off leaves the other glowing. Why?
    options:
    - Each bulb has its own complete path
    - The bulbs share one switch
    - Switches don't affect bulbs
    answer: Each bulb has its own complete path
    difficulty: 3
    hints:
    - Each switch breaks only its own path.
    - The other path is still closed.
    solution: Each bulb is on its own loop; opening one switch breaks only that loop.
    mistakes:
      The bulbs share one switch: c7s3_switch
      Switches don't affect bulbs: c7s3_switch
  - prompt: Why should old cells not be thrown in fire or opened?
    options:
    - They contain harmful chemicals and can burst
    - They will start working again
    - They turn into new cells
    answer: They contain harmful chemicals and can burst
    difficulty: 3
    hints:
    - What is inside a cell?
    - Think about safety.
    solution: Cells contain chemicals that can leak, burst or burn, so they must be disposed of safely.
    mistakes:
      They will start working again: c7s3_safe
      They turn into new cells: c7s3_safe
- code: cbse7s.elec.conductors
  title: Conductors and insulators
  after:
  - cbse7s.elec.circuit
  notes: |
    Materials that let electricity pass are conductors (metals: copper, aluminium, iron; also graphite and our
    bodies). Those that don't are insulators (plastic, rubber, wood, glass, dry paper). Test with a simple
    circuit and a gap: put the material across the gap; if the bulb glows, it conducts. Wires are copper inside
    (conductor) and plastic outside (insulator). Electricians use rubber gloves. Safety: never touch switches with
    wet hands; never play with mains electricity.
  explanations:
    text: Conductors let electricity through, insulators don't. Metals like copper are good conductors, so wires are made of copper. Plastic and rubber are insulators, so they cover wires to keep us safe.
    visual: 'Leave a gap in a circuit and bridge it with different objects: a steel spoon lights the bulb; a plastic ruler doesn''t.'
    step_by_step: 'Step 1: Make a circuit with a gap. Step 2: Place the material across the gap. Step 3: If the bulb glows, it is a conductor. Step 4: If not, it is an insulator.'
    real_world: Plug pins are brass (conductor) but the plug body is plastic (insulator), so current reaches the device and not your hand.
  picture:
    kind: compare
    columns:
    - title: Conductors
      points:
      - Copper, aluminium, iron
      - Graphite (pencil lead)
      - Used for wires and pins
    - title: Insulators
      points:
      - Plastic, rubber, wood
      - Glass, dry paper
      - Used for covers and handles
    alt: Conductors (metals, graphite) let current flow and are used for wires; insulators (plastic, rubber, wood) block it and are used for covers.
  activity:
    type: sort
    prompt: Conductor or insulator?
    bins:
    - Conductor
    - Insulator
    items:
    - label: Copper wire
      bin: Conductor
      clue: Why are wires made of it?
      why: Metals conduct.
    - label: Iron nail
      bin: Conductor
      clue: A metal.
      why: Conducts.
    - label: Aluminium foil
      bin: Conductor
      clue: Shiny metal sheet.
      why: Conducts.
    - label: Pencil lead (graphite)
      bin: Conductor
      clue: 'Try it in a circuit: the bulb glows.'
      why: Graphite is a non-metal that conducts.
    - label: Plastic ruler
      bin: Insulator
      clue: What covers electric wires?
      why: Plastic doesn't let current through.
    - label: Rubber eraser
      bin: Insulator
      clue: Electricians wear gloves of this.
      why: Insulator.
    - label: Dry wood
      bin: Insulator
      clue: No metal in it.
      why: Insulator.
    - label: Glass
      bin: Insulator
      clue: Used on electric poles to hold wires.
      why: Insulator.
  lesson:
    - teach: 'Some materials let electricity pass through them: conductors. Metals like copper, aluminium and iron are good conductors. Others do not: insulators, such as plastic, rubber, wood, glass and dry paper.'
      picture:
        kind: compare
        columns:
        - title: Conductors
          points:
          - copper
          - aluminium
          - iron
          - graphite
        - title: Insulators
          points:
          - plastic
          - rubber
          - wood
          - glass
        alt: Examples of conductors and insulators.
      check:
        prompt: Which is a conductor?
        options:
        - An aluminium foil strip
        - A rubber band
        - A wooden ruler
        answer: An aluminium foil strip
        why: Aluminium is a metal.
    - teach: 'Test a material with a circuit tester: a cell, a bulb and two wires with a gap. Put the material across the gap. If the bulb glows, the material conducts. Graphite (pencil lead) is a non-metal that still conducts; the bulb glows dimly.'
      picture:
        kind: flow
        steps:
        - Cell and bulb with a gap
        - Place the object across the gap
        - Bulb glows → conductor
        - Bulb stays off → insulator
        alt: How to test a material with a circuit tester.
      check:
        prompt: 'A key placed across the gap lights the bulb. The key is:'
        options:
        - A conductor
        - An insulator
        answer: A conductor
        why: It completes the circuit.
    - teach: 'Wires use both: copper inside to carry current, plastic outside to keep us safe. Electricians wear rubber gloves. Our bodies and impure water conduct, so never touch switches with wet hands or put anything into a socket.'
      check:
        prompt: Why are screwdrivers given plastic handles?
        options:
        - Plastic is an insulator and protects the user
        - Plastic conducts better
        - Plastic makes it heavier
        answer: Plastic is an insulator and protects the user
        why: Insulators stop current reaching the hand.
  items:
  - prompt: Which is a good conductor of electricity?
    options:
    - Copper
    - Plastic
    - Rubber
    - Wood
    answer: Copper
    difficulty: 1
    hints:
    - Used inside wires.
    - A metal.
    solution: Copper is a metal and conducts well.
    mistakes: {"Plastic": "t7_conductor", "Wood": "t7_conductor"}
  - prompt: Why are electric wires covered with plastic?
    options:
    - Plastic is an insulator and keeps us safe
    - Plastic conducts better
    - To make them heavier
    - For colour only
    answer: Plastic is an insulator and keeps us safe
    difficulty: 1
    hints:
    - Stops current reaching us.
    - Insulator.
    solution: The plastic cover prevents shocks and short circuits.
    mistakes: {"Plastic conducts better": "t7_insulator", "For colour only": "t7_insulator"}
  - prompt: 'A steel spoon placed across a gap makes the bulb glow. The spoon is:'
    options:
    - A conductor
    - An insulator
    - A switch
    - A cell
    answer: A conductor
    difficulty: 1
    hints:
    - Current passed through.
    - Steel is a metal.
    solution: It completed the circuit, so it conducts.
    mistakes: {"An insulator": "t7_spoon_conductor", "A cell": "t7_spoon_conductor"}
  - prompt: Which material is an insulator?
    options:
    - Rubber
    - Aluminium
    - Iron
    - Graphite
    answer: Rubber
    difficulty: 1
    hints:
    - Electricians' gloves.
    - Not a metal.
    solution: Rubber is an insulator.
    mistakes:
      Graphite: c7s_graphite
  - prompt: Why should you not touch switches with wet hands?
    options:
    - Water with impurities conducts and can give a shock
    - Water damages plastic
    - It wastes electricity
    - Switches get rusty
    answer: Water with impurities conducts and can give a shock
    difficulty: 2
    hints:
    - Tap water conducts.
    - Safety.
    solution: Impure water conducts electricity, so current may pass through you.
    mistakes: {"Water damages plastic": "t7_wet_hands", "Switches get rusty": "t7_wet_hands"}
  - prompt: 'Pencil lead (graphite) in a circuit makes the bulb glow dimly. This shows graphite is:'
    options:
    - A conductor, though not a metal
    - An insulator
    - A metal
    - A magnet
    answer: A conductor, though not a metal
    difficulty: 2
    hints:
    - The bulb glowed.
    - Graphite is carbon.
    solution: Graphite conducts electricity even though it is a non-metal.
    mistakes: {"An insulator": "t7_graphite", "A metal": "t7_graphite"}
  - prompt: Which is an insulator?
    options:
    - Glass
    - Iron
    - Copper
    answer: Glass
    difficulty: 1
    hints:
    - Insulators block electricity.
    - Which is not a metal?
    solution: Glass does not let electricity pass; iron and copper are metals and conduct.
    mistakes:
      Iron: c7s3_metal
      Copper: c7s3_metal
  - prompt: 'Electric wires have copper inside because copper is:'
    options:
    - A good conductor
    - An insulator
    - Cheap plastic
    answer: A good conductor
    difficulty: 1
    hints:
    - The inside must carry current.
    - Copper is a metal.
    solution: Copper conducts electricity well, so current flows through the wire.
    mistakes:
      An insulator: c7s3_metal
      Cheap plastic: c7s3_metal
  - prompt: A rubber eraser is placed across the gap in a tester. Does the bulb glow?
    options:
    - 'No'
    - 'Yes'
    - Only dimly
    answer: 'No'
    difficulty: 1
    hints:
    - Rubber is used in electricians' gloves.
    - Does it let current through?
    solution: Rubber is an insulator, so the gap stays open and the bulb stays off.
    mistakes:
      'Yes': c7s3_metal
      Only dimly: c7s3_metal
  - prompt: Which of these would make the tester bulb glow?
    options:
    - A safety pin
    - A plastic comb
    - A cotton thread
    answer: A safety pin
    difficulty: 1
    hints:
    - Look for a metal.
    - Plastic and cotton block current.
    solution: A safety pin is steel (a metal), so it conducts and the bulb glows.
    mistakes:
      A plastic comb: c7s3_metal
      A cotton thread: c7s3_metal
  - prompt: Why do electricians wear rubber gloves?
    options:
    - Rubber is an insulator and stops shocks
    - Rubber conducts electricity
    - Rubber keeps hands warm only
    answer: Rubber is an insulator and stops shocks
    difficulty: 2
    hints:
    - What does rubber do to current?
    - It protects the body.
    solution: Rubber does not conduct, so current cannot pass into the electrician's hands.
    mistakes:
      Rubber conducts electricity: c7s3_metal
      Rubber keeps hands warm only: c7s3_safe
  - prompt: Pencil lead makes the tester bulb glow dimly. What does this show?
    options:
    - Graphite conducts, though it is not a metal
    - Graphite is a metal
    - Graphite is an insulator
    answer: Graphite conducts, though it is not a metal
    difficulty: 2
    hints:
    - The bulb glowed, so current passed.
    - Is graphite a metal?
    solution: Graphite is a non-metal form of carbon, but it conducts, so the bulb glows a little.
    mistakes:
      Graphite is a metal: c7s3_metal
      Graphite is an insulator: c7s3_metal
  - prompt: Why is it dangerous to touch a switch with wet hands?
    options:
    - Impure water conducts and can give you a shock
    - Water is an insulator
    - The switch will rust instantly
    answer: Impure water conducts and can give you a shock
    difficulty: 2
    hints:
    - Tap water has dissolved salts.
    - Can current reach your body through it?
    solution: Tap water has impurities that conduct, so current can pass into the body and cause a shock.
    mistakes:
      Water is an insulator: c7s3_safe
      The switch will rust instantly: c7s3_safe
  - prompt: Which part of an electric plug is made of a conductor?
    options:
    - The metal pins
    - The plastic cover
    - The rubber grip
    answer: The metal pins
    difficulty: 2
    hints:
    - Which part carries current into the socket?
    - It is shiny.
    solution: The metal pins conduct current; the plastic cover insulates our hands.
    mistakes:
      The plastic cover: c7s3_metal
      The rubber grip: c7s3_metal
  - prompt: A student says, 'Air is an insulator, so a bulb with a gap does not glow.' Is the student right?
    options:
    - Yes, the air gap stops the current
    - No, air is a good conductor
    - No, bulbs do not need a loop
    answer: Yes, the air gap stops the current
    difficulty: 3
    hints:
    - What is in a gap?
    - Does current cross it?
    solution: Air does not normally conduct, so a gap filled with air keeps the circuit open.
    mistakes:
      No, air is a good conductor: c7s3_metal
      No, bulbs do not need a loop: c7s3_loop
