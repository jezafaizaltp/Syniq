# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 2. Format: content/README.md.
subject: cbse7-sci
chapter: 2
title: 'Exploring Substances: Acidic, Basic and Neutral'
tips:
  c7s_litmus: "Red litmus can't show you red, since it already is red. A base changes it. Acids and bases turn litmus to opposite colours."
  c7s_neutral: "Neutralisation cancels the acid and base and leaves two everyday things behind: one you sprinkle on food and one you drink."
  t7_acidic_soil: "Acidic soil needs a base. Which choice is a base?"
  t7_ant_bite: "Formic acid needs a base to neutralise it. Which choice is basic?"
  t7_antacid: "Too much acid needs something basic to neutralise it. Vinegar and lemon are acids."
  t7_china_rose: "China rose turns pink in acid. What happens in the opposite kind of solution?"
  t7_dont_taste: "Some chemicals in a lab can burn or poison. Is tasting safe?"
  t7_factory_waste: "Fish and plants in rivers are harmed by strong acids or bases."
  t7_lemon_acid: "Lemon tastes sour. Sour taste is a sign of which kind of substance?"
  t7_neutral: "If neither litmus changes, it is neither acid nor base."
  t7_neutralisation_heat: "Mix an acid and a base and touch the beaker. Does it feel warmer or cooler?"
  t7_turmeric: "Turmeric changes colour with bases like soap. Yellow turns to a warm colour."
  c7s2_taste: Sour things like lemon and vinegar belong to one group; bitter, soapy things like soap and baking soda to another. Water and sugar solution are in neither.
  c7s2_litmus: 'Litmus changes colour only one way at a time: one group turns blue litmus red, the other turns red litmus blue. A neutral solution leaves both as they were.'
  c7s2_turmeric: Turmeric is yellow and changes only with soapy, bitter substances. Sour substances leave it yellow.
  c7s2_hibiscus: China rose (hibiscus) solution goes one colour with sour substances and a different colour with soapy ones. Recall which is which.
  c7s2_cancel: Acids and bases cancel each other. To fix a problem, use the opposite kind of substance to the one causing it.
  c7s2_products: When an acid and a base react, a new substance called a salt forms, along with water, and heat is given out.
concepts:
- code: cbse7s.acid.indicators
  title: Acids, bases and indicators
  notes: |
    Acidic substances taste sour (lemon juice, vinegar, tamarind, curd). Basic substances taste bitter and feel
    soapy (soap, baking soda solution, lime water). Neutral substances are neither (pure water, sugar solution,
    salt solution). Never taste unknown chemicals: use indicators. Litmus (from lichens): acids turn blue litmus
    red; bases turn red litmus blue. Turmeric: bases turn it red. China rose (hibiscus) solution: acids turn it
    dark pink (magenta), bases turn it green. Red cabbage is another natural indicator.
  explanations:
    text: Acids taste sour, like lemon; bases feel soapy and taste bitter, like soap. But we test them safely with indicators, which change colour. Acids turn blue litmus red; bases turn red litmus blue; turmeric turns red with a base.
    visual: 'Picture three test tubes: lemon juice turns blue litmus red; soap solution turns red litmus blue; salt water leaves both unchanged.'
    step_by_step: 'Step 1: Dip blue litmus. If it turns red, the substance is acidic. Step 2: Dip red litmus. If it turns blue, it is basic. Step 3: If neither changes, it is neutral. Step 4: Confirm with turmeric or china rose.'
    real_world: A turmeric stain on clothes turns red when washed with soap, because soap is basic.
  picture:
    kind: compare
    columns:
    - title: Acids
      points:
      - 'Sour: lemon, vinegar, curd'
      - Blue litmus → red
      - China rose → dark pink
    - title: Bases
      points:
      - 'Bitter, soapy: soap, baking soda'
      - Red litmus → blue
      - Turmeric → red; china rose → green
    - title: Neutral
      points:
      - Water, salt, sugar solution
      - No change in litmus
    alt: Acids, bases and neutral substances compared, with their effect on litmus, turmeric and china rose indicators.
  activity:
    type: sort
    prompt: What kind of substance is it?
    bins:
    - Acidic
    - Basic
    - Neutral
    items:
    - label: Lemon juice
      bin: Acidic
      clue: It tastes sour and turns blue litmus red.
      why: An acid.
    - label: Vinegar
      bin: Acidic
      clue: Sour, and turns blue litmus red.
      why: Acetic acid.
    - label: Curd
      bin: Acidic
      clue: Sour taste.
      why: It contains lactic acid.
    - label: Soap solution
      bin: Basic
      clue: Feels slippery; turns red litmus blue.
      why: A base.
    - label: Baking soda solution
      bin: Basic
      clue: Turns red litmus blue.
      why: A base.
    - label: Lime water
      bin: Basic
      clue: Turns red litmus blue.
      why: 'Calcium hydroxide: a base.'
    - label: Pure water
      bin: Neutral
      clue: No change to either litmus.
      why: Neither acid nor base.
    - label: Sugar solution
      bin: Neutral
      clue: Litmus stays the same colour.
      why: Neutral.
    - label: Salt solution
      bin: Neutral
      clue: Litmus stays the same.
      why: Neutral.
  lesson:
    - teach: 'Substances can be acidic, basic or neutral. Acidic ones taste sour: lemon juice, vinegar, tamarind, curd. Basic ones taste bitter and feel soapy: soap, baking soda solution, lime water. Neutral ones are neither: pure water, sugar or salt solution. But never taste an unknown substance: it could be harmful.'
      picture:
        kind: compare
        columns:
        - title: Acidic (sour)
          points:
          - lemon juice
          - vinegar
          - tamarind
          - curd
        - title: Basic (bitter, soapy)
          points:
          - soap
          - baking soda
          - lime water
        - title: Neutral
          points:
          - pure water
          - sugar solution
          - salt solution
        alt: Examples of acidic, basic and neutral substances.
      check:
        prompt: 'Vinegar is:'
        options:
        - Acidic
        - Basic
        - Neutral
        answer: Acidic
        why: It tastes sour.
    - teach: Indicators change colour to show acids and bases safely. Litmus, made from lichens, comes as red and blue paper. Acids turn blue litmus red. Bases turn red litmus blue. Neutral solutions change neither.
      picture:
        kind: compare
        columns:
        - title: Acid
          points:
          - blue litmus → red
          - red litmus stays red
        - title: Base
          points:
          - red litmus → blue
          - blue litmus stays blue
        - title: Neutral
          points:
          - no change in either
        alt: How litmus paper changes in acids, bases and neutral solutions.
      check:
        prompt: 'A solution turns blue litmus red. It is:'
        options:
        - Acidic
        - Basic
        - Neutral
        answer: Acidic
        why: Acids turn blue litmus red.
    - teach: 'Natural indicators: turmeric (yellow) turns red in a base and stays yellow in an acid. China rose (hibiscus) solution turns dark pink (magenta) in an acid and green in a base. Red cabbage juice also changes colour.'
      check:
        prompt: 'Turmeric paper turns red when dipped in a solution. The solution is:'
        options:
        - Basic
        - Acidic
        - Neutral
        answer: Basic
        why: Only bases turn turmeric red.
  items:
  - prompt: 'Lemon juice is:'
    options:
    - Acidic
    - Basic
    - Neutral
    - A metal
    answer: Acidic
    difficulty: 1
    hints:
    - It tastes sour.
    - Contains citric acid.
    solution: Lemon juice is acidic.
    mistakes: {"Basic": "t7_lemon_acid", "Neutral": "t7_lemon_acid"}
  - prompt: What colour does a base turn red litmus?
    options:
    - Blue
    - Red
    - Green
    - Yellow
    answer: Blue
    difficulty: 1
    hints:
    - Bases change red litmus.
    - Acids change blue litmus to red.
    solution: Bases turn red litmus blue.
    mistakes:
      Red: c7s_litmus
  - prompt: What colour does turmeric paper turn with soap solution?
    options:
    - Red
    - Blue
    - Green
    - It stays yellow
    answer: Red
    difficulty: 2
    hints:
    - Soap is basic.
    - Turmeric reacts with bases.
    solution: Bases turn turmeric red.
    mistakes: {"Blue": "t7_turmeric", "It stays yellow": "t7_turmeric"}
  - prompt: 'Sugar solution does not change red or blue litmus. It is:'
    options:
    - Neutral
    - Acidic
    - Basic
    - Poisonous
    answer: Neutral
    difficulty: 1
    hints:
    - No colour change.
    - Neither acid nor base.
    solution: No change in either litmus means neutral.
    mistakes: {"Acidic": "t7_neutral", "Basic": "t7_neutral"}
  - prompt: 'China rose indicator turns green in:'
    options:
    - A basic solution
    - An acidic solution
    - Pure water
    - Sugar solution
    answer: A basic solution
    difficulty: 2
    hints:
    - Acids turn it dark pink.
    - Bases turn it green.
    solution: China rose turns green with bases and dark pink with acids.
    mistakes: {"An acidic solution": "t7_china_rose", "Pure water": "t7_china_rose"}
  - prompt: Why should we not taste substances to test them?
    options:
    - Many chemicals are harmful
    - They taste bad
    - Tasting is slow
    - Indicators are cheaper
    answer: Many chemicals are harmful
    difficulty: 1
    hints:
    - Safety first.
    - Some acids and bases burn.
    solution: Strong acids and bases can burn; indicators are safe.
    mistakes: {"They taste bad": "t7_dont_taste", "Tasting is slow": "t7_dont_taste"}
  - prompt: 'Tamarind is:'
    options:
    - Acidic
    - Basic
    - Neutral
    answer: Acidic
    difficulty: 1
    hints:
    - How does tamarind taste?
    - Sour things belong together.
    solution: Tamarind tastes sour, which is a sign of an acidic substance.
    mistakes:
      Basic: c7s2_taste
      Neutral: c7s2_taste
  - prompt: 'Soap solution is:'
    options:
    - Basic
    - Acidic
    - Neutral
    answer: Basic
    difficulty: 1
    hints:
    - How does soap feel?
    - Soapy, slippery substances are in one group.
    solution: Soap feels slippery and tastes bitter, so its solution is basic.
    mistakes:
      Acidic: c7s2_taste
      Neutral: c7s2_taste
  - prompt: What colour does an acid turn blue litmus?
    options:
    - Red
    - Blue
    - Green
    answer: Red
    difficulty: 1
    hints:
    - Acids make blue litmus change.
    - It changes to the other litmus colour.
    solution: Acids turn blue litmus red; red litmus stays red in an acid.
    mistakes:
      Blue: c7s2_litmus
      Green: c7s2_litmus
  - prompt: 'Salt solution does not change red or blue litmus. It is:'
    options:
    - Neutral
    - Acidic
    - Basic
    answer: Neutral
    difficulty: 1
    hints:
    - No change in either paper.
    - It is neither acid nor base.
    solution: A solution that changes neither red nor blue litmus is neutral.
    mistakes:
      Acidic: c7s2_litmus
      Basic: c7s2_litmus
  - prompt: What colour does China rose solution turn in lemon juice?
    options:
    - Dark pink (magenta)
    - Green
    - Yellow
    answer: Dark pink (magenta)
    difficulty: 2
    hints:
    - Lemon juice is acidic.
    - In acids, China rose goes a pinkish colour.
    solution: Lemon juice is an acid, and China rose indicator turns dark pink (magenta) in acids.
    mistakes:
      Green: c7s2_hibiscus
      Yellow: c7s2_turmeric
  - prompt: Turmeric paper is dipped in vinegar. What happens?
    options:
    - It stays yellow
    - It turns red
    - It turns blue
    answer: It stays yellow
    difficulty: 2
    hints:
    - Vinegar is acidic.
    - Turmeric changes only in bases.
    solution: Vinegar is an acid, and turmeric changes colour only in bases, so it stays yellow.
    mistakes:
      It turns red: c7s2_turmeric
      It turns blue: c7s2_litmus
  - prompt: 'Litmus is obtained from:'
    options:
    - Lichens
    - Turmeric
    - Lemons
    answer: Lichens
    difficulty: 2
    hints:
    - It is a natural dye.
    - It comes from small plant-like living things on rocks and trees.
    solution: Litmus is a dye extracted from lichens.
    mistakes:
      Turmeric: c7s2_turmeric
      Lemons: c7s2_taste
  - prompt: 'A solution turns red litmus blue and China rose green. It is:'
    options:
    - Basic
    - Acidic
    - Neutral
    answer: Basic
    difficulty: 2
    hints:
    - Both indicators changed.
    - Which group turns red litmus blue?
    solution: Turning red litmus blue and China rose green are both signs of a base.
    mistakes:
      Acidic: c7s2_litmus
      Neutral: c7s2_litmus
  - prompt: A yellow stain of curry on a white shirt turns red when washed with soap. Why?
    options:
    - Turmeric in the curry turns red with basic soap
    - Soap is acidic
    - The water is hot
    answer: Turmeric in the curry turns red with basic soap
    difficulty: 3
    hints:
    - Curry has turmeric.
    - Soap is basic.
    solution: Turmeric is an indicator; the basic soap turns it red. Rinsing the soap away brings back the yellow.
    mistakes:
      Soap is acidic: c7s2_taste
      The water is hot: c7s2_turmeric
  - prompt: Three liquids A, B, C. A turns blue litmus red, B turns red litmus blue, C changes neither. Which could be pure water?
    options:
    - C
    - A
    - B
    answer: C
    difficulty: 3
    hints:
    - Pure water is neutral.
    - Which liquid changed neither paper?
    solution: A is acidic and B basic; C changed neither litmus, so it is neutral, like pure water.
    mistakes:
      A: c7s2_litmus
      B: c7s2_litmus
  - prompt: Why are indicators used instead of tasting?
    options:
    - Many substances are harmful to taste or touch
    - Indicators are tastier
    - Tasting always gives the wrong answer
    answer: Many substances are harmful to taste or touch
    difficulty: 3
    hints:
    - Think about safety in a lab.
    - Some acids and bases burn skin.
    solution: Strong acids and bases can burn and poison, so indicators show the result safely by colour.
    mistakes:
      Indicators are tastier: c7s2_taste
      Tasting always gives the wrong answer: c7s2_taste
- code: cbse7s.acid.neutral
  title: Neutralisation in daily life
  after:
  - cbse7s.acid.indicators
  notes: |
    When an acid and a base react, they cancel each other's effects: neutralisation. Acid + base → salt + water
    (+ heat). Examples: indigestion from too much stomach acid is treated with an antacid (milk of magnesia, a
    base); an ant bite injects formic acid, soothed with baking soda; acidic soil is treated with quicklime or
    slaked lime, and basic soil with organic matter; factory waste that is acidic is neutralised before release.
  explanations:
    text: When an acid meets a base, they cancel each other out and make a salt and water. That is why an antacid (a base) eases acidity in the stomach, and baking soda soothes an ant bite (which injects acid).
    visual: 'Add drops of a base to an acid with china rose in it: dark pink → colourless → green. At the point between, the acid is neutralised.'
    step_by_step: 'Step 1: Identify the acid. Step 2: Choose a base to cancel it (or the reverse). Step 3: Add slowly while testing with an indicator. Step 4: Stop when it is neutral.'
    real_world: Farmers spread lime on acidic soil so crops grow well; tooth decay starts when mouth acids attack enamel, and toothpaste (basic) helps neutralise them.
  picture:
    kind: flow
    steps:
    - Acid (e.g. stomach acid)
    - Add a base (antacid)
    - They react
    - Salt + water + heat
    - 'Neutral: discomfort eases'
    alt: 'Neutralisation: an acid and a base react to form salt and water, as when an antacid eases stomach acidity.'
  activity:
    type: sort
    prompt: How would you treat each problem?
    bins:
    - Treat with a base
    - Treat with an acid
    items:
    - label: An ant bite
      bin: Treat with a base
      clue: The ant injects formic acid. What cancels it?
      why: Baking soda, a base, neutralises it.
    - label: Too much acid in the stomach
      bin: Treat with a base
      clue: An antacid like milk of magnesia.
      why: A base cancels the acid.
    - label: Soil that is too sour for crops
      bin: Treat with a base
      clue: Farmers add quicklime or slaked lime.
      why: A base neutralises the soil.
    - label: Acidic waste from a factory
      bin: Treat with a base
      clue: Clean it before it reaches a river.
      why: Neutralise it with a base.
    - label: A wasp sting
      bin: Treat with an acid
      clue: Wasp stings are alkaline.
      why: Vinegar, an acid, neutralises it.
    - label: Soil that is too alkaline
      bin: Treat with an acid
      clue: Too much lime in the soil.
      why: Compost or organic matter adds acid.
  lesson:
    - teach: When an acid and a base are mixed, they cancel each other's effects. This is neutralisation. A new substance called a salt forms, along with water, and the mixture gets warm because heat is given out.
      picture:
        kind: flow
        steps:
        - Acid
        - + Base
        - → Salt + Water
        - + heat given out
        alt: Acid plus base gives salt plus water, and heat.
      check:
        prompt: What forms when an acid reacts with a base?
        options:
        - Salt and water
        - Only acid
        - Litmus
        answer: Salt and water
        why: That is neutralisation.
    - teach: 'Neutralisation helps in daily life. Too much stomach acid causes indigestion: an antacid like milk of magnesia (a base) neutralises it. An ant bite injects formic acid: rub on baking soda (a base). A wasp sting is basic: vinegar (an acid) helps.'
      picture:
        kind: compare
        columns:
        - title: Problem
          points:
          - stomach acid
          - ant bite (acid)
          - wasp sting (base)
        - title: Fix
          points:
          - antacid (base)
          - baking soda (base)
          - vinegar (acid)
        alt: Everyday problems and the opposite substance that neutralises each.
      check:
        prompt: An ant bite stings because of formic acid. What helps?
        options:
        - Baking soda paste
        - Lemon juice
        - Vinegar
        answer: Baking soda paste
        why: A base neutralises the acid.
    - teach: Farmers test soil. Soil that is too acidic is treated with quicklime or slaked lime (bases). Soil that is too basic is treated with organic matter like compost, which releases acids. Factory waste that is acidic is neutralised before it reaches rivers, to protect fish and plants.
      check:
        prompt: A farmer's soil is too acidic. What should be added?
        options:
        - Slaked lime
        - Vinegar
        - Lemon juice
        answer: Slaked lime
        why: A base neutralises acidic soil.
  items:
  - prompt: What is formed when an acid reacts with a base?
    options:
    - Salt and water
    - Only gas
    - Sugar
    - Metal
    answer: Salt and water
    difficulty: 1
    hints:
    - Neutralisation.
    - Heat is also given out.
    solution: Acid + base → salt + water.
    mistakes:
      Only gas: c7s_neutral
  - prompt: Which is used to treat indigestion caused by too much acid?
    options:
    - Milk of magnesia (an antacid)
    - Vinegar
    - Lemon juice
    - Curd
    answer: Milk of magnesia (an antacid)
    difficulty: 1
    hints:
    - Need a base.
    - Antacid.
    solution: An antacid is a base that neutralises extra stomach acid.
    mistakes: {"Vinegar": "t7_antacid", "Lemon juice": "t7_antacid"}
  - prompt: An ant bite injects formic acid. What can soothe it?
    options:
    - Baking soda paste
    - Vinegar
    - Lemon juice
    - Tamarind
    answer: Baking soda paste
    difficulty: 2
    hints:
    - Neutralise the acid.
    - Baking soda is basic.
    solution: Baking soda, a base, neutralises the acid.
    mistakes: {"Vinegar": "t7_ant_bite", "Lemon juice": "t7_ant_bite"}
  - prompt: 'Soil that is too acidic is treated with:'
