    - The test tube warms up.
    - It is exothermic.
    solution: Neutralisation releases heat; the mixture warms.
    mistakes: {"Taken in": "t7_neutralisation_heat", "Neither": "t7_neutralisation_heat"}
  - prompt: Why is factory waste neutralised before it reaches rivers?
    options:
    - Acids or bases in it harm water life
    - To change its colour
    - To make it heavier
    - It is not necessary
    answer: Acids or bases in it harm water life
    difficulty: 1
    hints:
