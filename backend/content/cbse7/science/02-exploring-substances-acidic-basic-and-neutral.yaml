    - Protecting rivers.
    solution: Untreated acids or bases kill fish and plants in rivers.
    mistakes: {"To change its colour": "t7_factory_waste", "It is not necessary": "t7_factory_waste"}
  - prompt: What is the reaction between an acid and a base called?
    options:
    - Neutralisation
    - Evaporation
    - Condensation
    answer: Neutralisation
    difficulty: 1
    hints:
    - They cancel each other out.
    - The result is neither acid nor base.
    solution: An acid and a base cancel each other's effects, which is called neutralisation.
    mistakes:
      Evaporation: c7s2_cancel
      Condensation: c7s2_cancel
  - prompt: 'Milk of magnesia is:'
    options:
    - A base
    - An acid
    - A neutral substance
    answer: A base
    difficulty: 1
    hints:
    - It is an antacid.
    - It cancels stomach acid.
    solution: Milk of magnesia neutralises extra stomach acid, so it must be a base.
    mistakes:
      An acid: c7s2_cancel
      A neutral substance: c7s2_cancel
  - prompt: Vinegar is applied to a wasp sting. What does this tell you about the sting?
    options:
    - It is basic
    - It is acidic
    - It is neutral
    answer: It is basic
    difficulty: 1
    hints:
    - Vinegar is an acid.
    - An acid is used to cancel a base.
    solution: 'Vinegar is acidic, so it is used to neutralise something basic: the wasp sting.'
    mistakes:
      It is acidic: c7s2_cancel
      It is neutral: c7s2_cancel
  - prompt: 'A test tube gets warm when an acid and a base are mixed. This shows that:'
    options:
    - Heat is given out in neutralisation
    - Heat is taken in
    - Nothing happened
    answer: Heat is given out in neutralisation
    difficulty: 2
    hints:
    - The tube feels warm.
    - Where did the warmth come from?
    solution: Warming shows the reaction gives out heat, which happens in neutralisation.
    mistakes:
      Heat is taken in: c7s2_products
      Nothing happened: c7s2_products
  - prompt: A field's soil is too basic. What could the farmer add?
    options:
    - Organic matter such as compost
    - Quicklime
    - Slaked lime
    answer: Organic matter such as compost
    difficulty: 2
    hints:
    - Basic soil needs something acidic.
    - Lime is a base.
    solution: Compost releases acids that neutralise basic soil; quicklime and slaked lime are bases, which would make it worse.
    mistakes:
      Quicklime: c7s2_cancel
      Slaked lime: c7s2_cancel
  - prompt: Why is acidic factory waste treated before it is let into a river?
    options:
    - Acid harms fish and plants in the water
