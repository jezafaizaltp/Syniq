    - You need one acid and one base.
    - Which pair has one of each?
    solution: Lemon juice is acidic and baking soda is basic; the other pairs are both acids or both bases.
    mistakes:
      Vinegar and lemon juice: c7s2_cancel
      Soap and lime water: c7s2_cancel
  - prompt: Dilute acid is added drop by drop to a base with China rose indicator. The green colour slowly fades. What is happening?
    options:
    - The base is being neutralised
    - More base is being made
    - The indicator is evaporating
    answer: The base is being neutralised
    difficulty: 3
    hints:
    - Green shows a base.
    - What does added acid do to a base?
    solution: The acid neutralises the base, so the green colour fades; when acid is in excess it turns magenta.
    mistakes:
      More base is being made: c7s2_cancel
      The indicator is evaporating: c7s2_hibiscus
  - prompt: After complete neutralisation, which colour would red and blue litmus show?
