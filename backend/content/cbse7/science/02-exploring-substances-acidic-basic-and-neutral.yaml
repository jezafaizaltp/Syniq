# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 2. Format: content/README.md.
subject: cbse7-sci
chapter: 2
title: 'Exploring Substances: Acidic, Basic and Neutral'
tips:
  c7s_litmus: Acids turn blue litmus red; bases turn red litmus blue.
  c7s_neutral: In neutralisation an acid and a base form a salt and water.
concepts:
- code: cbse7s.acid.indicators
  title: Acids, bases and indicators
  notes: |
    Acidic substances taste sour (lemon juice, vinegar, tamarind, curd). Basic substances taste bitter and feel
    soapy (soap, baking soda solution, lime water). Neutral substances are neither (pure water, sugar solution,
    salt solution). Never taste unknown chemicals: use indicators. Litmus (from lichens): acids turn blue litmus
    red; bases turn red litmus blue. Turmeric: bases turn it red. China rose (hibiscus) solution: acids turn it
    dark pink (magenta), bases turn it green. Red cabbage is another natural indicator.
  explanations:
    text: Acids taste sour, like lemon; bases feel soapy and taste bitter, like soap. But we test them safely with indicators, which change colour. Acids turn blue litmus red; bases turn red litmus blue; turmeric turns red with a base.
    visual: 'Picture three test tubes: lemon juice turns blue litmus red; soap solution turns red litmus blue; salt water leaves both unchanged.'
    step_by_step: 'Step 1: Dip blue litmus. If it turns red, the substance is acidic. Step 2: Dip red litmus. If it turns blue, it is basic. Step 3: If neither changes, it is neutral. Step 4: Confirm with turmeric or china rose.'
    real_world: A turmeric stain on clothes turns red when washed with soap, because soap is basic.
  picture:
    kind: compare
    columns:
    - title: Acids
      points:
      - 'Sour: lemon, vinegar, curd'
      - Blue litmus → red
      - China rose → dark pink
    - title: Bases
      points:
      - 'Bitter, soapy: soap, baking soda'
      - Red litmus → blue
      - Turmeric → red; china rose → green
    - title: Neutral
      points:
      - Water, salt, sugar solution
      - No change in litmus
    alt: Acids, bases and neutral substances compared, with their effect on litmus, turmeric and china rose indicators.
  items:
  - prompt: 'Lemon juice is:'
    options:
    - Acidic
    - Basic
    - Neutral
    - A metal
    answer: Acidic
    difficulty: 1
    hints:
    - It tastes sour.
    - Contains citric acid.
    solution: Lemon juice is acidic.
  - prompt: What colour does a base turn red litmus?
    options:
    - Blue
    - Red
    - Green
    - Yellow
    answer: Blue
    difficulty: 1
    hints:
    - Bases change red litmus.
    - Acids change blue litmus to red.
    solution: Bases turn red litmus blue.
    mistakes:
      Red: c7s_litmus
  - prompt: What colour does turmeric paper turn with soap solution?
    options:
    - Red
    - Blue
    - Green
    - It stays yellow
    answer: Red
    difficulty: 2
    hints:
    - Soap is basic.
    - Turmeric reacts with bases.
    solution: Bases turn turmeric red.
  - prompt: 'Sugar solution does not change red or blue litmus. It is:'
    options:
    - Neutral
    - Acidic
    - Basic
    - Poisonous
    answer: Neutral
    difficulty: 1
    hints:
    - No colour change.
    - Neither acid nor base.
    solution: No change in either litmus means neutral.
  - prompt: 'China rose indicator turns green in:'
    options:
    - A basic solution
    - An acidic solution
    - Pure water
    - Sugar solution
    answer: A basic solution
    difficulty: 2
    hints:
    - Acids turn it dark pink.
    - Bases turn it green.
    solution: China rose turns green with bases and dark pink with acids.
  - prompt: Why should we not taste substances to test them?
    options:
    - Many chemicals are harmful
    - They taste bad
    - Tasting is slow
    - Indicators are cheaper
    answer: Many chemicals are harmful
    difficulty: 1
    hints:
    - Safety first.
    - Some acids and bases burn.
    solution: Strong acids and bases can burn; indicators are safe.
- code: cbse7s.acid.neutral
  title: Neutralisation in daily life
  after:
  - cbse7s.acid.indicators
  notes: |
    When an acid and a base react, they cancel each other's effects: neutralisation. Acid + base → salt + water
    (+ heat). Examples: indigestion from too much stomach acid is treated with an antacid (milk of magnesia, a
    base); an ant bite injects formic acid, soothed with baking soda; acidic soil is treated with quicklime or
    slaked lime, and basic soil with organic matter; factory waste that is acidic is neutralised before release.
  explanations:
    text: When an acid meets a base, they cancel each other out and make a salt and water. That is why an antacid (a base) eases acidity in the stomach, and baking soda soothes an ant bite (which injects acid).
    visual: 'Add drops of a base to an acid with china rose in it: dark pink → colourless → green. At the point between, the acid is neutralised.'
    step_by_step: 'Step 1: Identify the acid. Step 2: Choose a base to cancel it (or the reverse). Step 3: Add slowly while testing with an indicator. Step 4: Stop when it is neutral.'
    real_world: Farmers spread lime on acidic soil so crops grow well; tooth decay starts when mouth acids attack enamel, and toothpaste (basic) helps neutralise them.
  picture:
    kind: flow
    steps:
    - Acid (e.g. stomach acid)
    - Add a base (antacid)
    - They react
    - Salt + water + heat
    - 'Neutral: discomfort eases'
    alt: 'Neutralisation: an acid and a base react to form salt and water, as when an antacid eases stomach acidity.'
  items:
  - prompt: What is formed when an acid reacts with a base?
    options:
    - Salt and water
    - Only gas
    - Sugar
    - Metal
    answer: Salt and water
    difficulty: 1
    hints:
    - Neutralisation.
    - Heat is also given out.
    solution: Acid + base → salt + water.
    mistakes:
      Only gas: c7s_neutral
  - prompt: Which is used to treat indigestion caused by too much acid?
    options:
    - Milk of magnesia (an antacid)
    - Vinegar
    - Lemon juice
    - Curd
    answer: Milk of magnesia (an antacid)
    difficulty: 1
    hints:
    - Need a base.
    - Antacid.
    solution: An antacid is a base that neutralises extra stomach acid.
  - prompt: An ant bite injects formic acid. What can soothe it?
    options:
    - Baking soda paste
    - Vinegar
    - Lemon juice
    - Tamarind
    answer: Baking soda paste
    difficulty: 2
    hints:
    - Neutralise the acid.
    - Baking soda is basic.
    solution: Baking soda, a base, neutralises the acid.
  - prompt: 'Soil that is too acidic is treated with:'
    options:
    - Quicklime or slaked lime
    - Vinegar
    - Lemon peel
    - Salt
    answer: Quicklime or slaked lime
    difficulty: 2
    hints:
    - Need a base.
    - Lime is basic.
    solution: Lime is a base and neutralises acidic soil.
  - prompt: Is heat given out or taken in during neutralisation?
    options:
    - Given out
    - Taken in
    - Neither
    - Only in sunlight
    answer: Given out
    difficulty: 2
    hints:
    - The test tube warms up.
    - It is exothermic.
    solution: Neutralisation releases heat; the mixture warms.
  - prompt: Why is factory waste neutralised before it reaches rivers?
    options:
    - Acids or bases in it harm water life
    - To change its colour
    - To make it heavier
    - It is not necessary
    answer: Acids or bases in it harm water life
    difficulty: 1
    hints:
    - Fish need neutral water.
    - Protecting rivers.
    solution: Untreated acids or bases kill fish and plants in rivers.
