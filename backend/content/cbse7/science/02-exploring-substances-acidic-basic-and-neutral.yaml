    answer: Quicklime or slaked lime
    difficulty: 2
    hints:
    - Need a base.
    - Lime is basic.
    solution: Lime is a base and neutralises acidic soil.
    mistakes: {"Vinegar": "t7_acidic_soil", "Lemon peel": "t7_acidic_soil"}
  - prompt: Is heat given out or taken in during neutralisation?
