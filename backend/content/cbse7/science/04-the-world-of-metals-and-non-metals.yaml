# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 4. Format: content/README.md.
subject: cbse7-sci
chapter: 4
title: The World of Metals and Non-metals
tips:
  c7s_malleable: Malleable means beaten into sheets; ductile means drawn into wires.
concepts:
- code: cbse7s.metal.props
  title: Properties of metals and non-metals
  notes: |
    Metals (iron, copper, aluminium, gold, silver) are usually lustrous (shiny), hard, malleable (beaten into
    sheets), ductile (drawn into wires), sonorous (ring when struck) and good conductors of heat and
    electricity. Non-metals (sulfur, carbon, oxygen, iodine) are usually dull, brittle (break easily), not
    sonorous, and poor conductors. Exceptions: mercury is a liquid metal; sodium is soft; graphite (carbon)
    conducts; diamond (carbon) is very hard. Aluminium foil and copper wire show malleability and ductility.
  explanations:
    text: Metals are usually shiny, can be beaten into sheets and drawn into wires, ring when struck, and carry heat and electricity well. Non-metals are usually dull, break easily and don't conduct, with a few surprises like graphite.
    visual: 'Strike an iron rod and a piece of coal: the iron rings, the coal doesn''t. Hammer them: iron flattens, coal crumbles.'
    step_by_step: 'Step 1: Check lustre: shiny or dull. Step 2: Hammer it: flattens (malleable) or breaks (brittle). Step 3: Strike it: does it ring? Step 4: Test conduction. Step 5: Decide metal or non-metal, remembering the exceptions.'
    real_world: School bells are metal because metals are sonorous; cooking pots are metal because metals conduct heat.
  picture:
    kind: compare
    columns:
    - title: Metals
      points:
      - Shiny (lustrous)
      - Malleable and ductile
      - Sonorous
      - Good conductors
    - title: Non-metals
      points:
      - Dull
      - Brittle
      - Not sonorous
      - Poor conductors (except graphite)
    alt: Metals are shiny, malleable, ductile, sonorous and conduct well; non-metals are dull, brittle and poor conductors, with graphite as an exception.
  activity:
    type: sort
    prompt: Which does this property usually belong to?
    bins:
    - Metal
    - Non-metal
    items:
    - label: Shiny when freshly cut
      bin: Metal
      clue: Think of a new coin.
      why: Metals have lustre.
    - label: Can be beaten into thin sheets
      bin: Metal
      clue: Like silver foil on sweets.
      why: 'Malleable: metals.'
    - label: Can be drawn into wires
      bin: Metal
      clue: Electric wires.
      why: 'Ductile: metals.'
    - label: Rings when struck
      bin: Metal
      clue: Temple bells.
      why: 'Sonorous: metals.'
    - label: Dull, not shiny
      bin: Non-metal
      clue: Think of charcoal or sulphur.
      why: Non-metals are usually dull.
    - label: Breaks into powder when hammered
      bin: Non-metal
      clue: Brittle.
      why: Non-metals like sulphur crumble.
    - label: Poor conductor of heat
      bin: Non-metal
      clue: Sulphur and charcoal barely pass heat along.
      why: Non-metals conduct poorly.
    - label: Yellow powder that burns with a blue flame
      bin: Non-metal
      clue: This is sulphur.
      why: A non-metal.
  items:
  - prompt: 'Beating aluminium into foil shows that it is:'
    options:
    - Malleable
    - Ductile
    - Brittle
    - Sonorous
    answer: Malleable
    difficulty: 1
    hints:
    - Sheets.
    - Ductile is wires.
    solution: Being beaten into thin sheets is malleability.
    mistakes:
      Ductile: c7s_malleable
  - prompt: 'Drawing copper into wires shows that it is:'
    options:
    - Ductile
    - Malleable
    - Brittle
    - Lustrous
    answer: Ductile
    difficulty: 1
    hints:
    - Wires.
    - Malleable is sheets.
    solution: Being drawn into wires is ductility.
  - prompt: Which metal is a liquid at room temperature?
    options:
    - Mercury
    - Iron
    - Copper
    - Aluminium
    answer: Mercury
    difficulty: 1
    hints:
    - Used in old thermometers.
    - Silvery liquid.
    solution: Mercury is the liquid metal.
  - prompt: Which non-metal conducts electricity?
    options:
    - Graphite
    - Sulfur
    - Iodine
    - Oxygen
    answer: Graphite
    difficulty: 2
    hints:
    - Pencil lead.
    - A form of carbon.
    solution: Graphite is a non-metal that conducts.
  - prompt: Why are school bells made of metal?
    options:
    - Metals are sonorous
    - Metals are brittle
    - Metals are dull
    - Metals are light
    answer: Metals are sonorous
    difficulty: 1
    hints:
    - They ring.
    - Sound.
    solution: Metals produce a ringing sound when struck.
  - prompt: 'A substance is dull and breaks into pieces when hammered. It is most likely:'
    options:
    - A non-metal
    - A metal
    - Mercury
    - An alloy
    answer: A non-metal
    difficulty: 2
    hints:
    - Brittle.
    - Not lustrous.
    solution: Dull and brittle are non-metal properties.
- code: cbse7s.metal.uses
  title: Uses of metals and non-metals
  after:
  - cbse7s.metal.props
  notes: |
    Uses follow properties. Metals: copper and aluminium for wires (conduct, ductile); iron and steel for
    bridges, machines (strong); aluminium for foil, aircraft (light, malleable); gold and silver for jewellery
    (lustrous, don't corrode). Non-metals: oxygen for breathing; nitrogen in fertilisers; carbon (as coal,
    graphite) for fuel and pencils; chlorine for cleaning water; iodine as an antiseptic. Iron rusts in moist air;
    painting or galvanising protects it.
  explanations:
    text: 'We choose a material for a job because of its properties: copper for wires because it conducts, aluminium for aeroplanes because it is light, gold for jewellery because it stays shiny. Non-metals matter too: we breathe oxygen and clean water with chlorine.'
    visual: 'Picture a house: copper wiring in the walls, an iron gate (painted against rust), an aluminium pressure cooker, a pencil with graphite lead, and water purified with chlorine.'
    step_by_step: 'Step 1: Name the job. Step 2: List the properties it needs. Step 3: Choose the material with those properties. Step 4: Think about protecting it (paint for iron).'
    real_world: Iron gates are painted to stop rusting, because iron reacts with moist air.
  picture:
    kind: compare
    columns:
    - title: Metal uses
      points:
      - 'Copper: wires'
      - 'Iron and steel: bridges'
      - 'Aluminium: foil, aircraft'
      - 'Gold: jewellery'
    - title: Non-metal uses
      points:
      - 'Oxygen: breathing'
      - 'Nitrogen: fertilisers'
      - 'Chlorine: cleaning water'
      - 'Graphite: pencils'
    alt: Uses of metals (copper wires, steel bridges, aluminium foil, gold jewellery) and of non-metals (oxygen, nitrogen fertilisers, chlorine, graphite pencils).
  activity:
    type: sort
    prompt: Which property makes it right for the job?
    bins:
    - Conducts electricity
    - Conducts heat
    - Light in weight
    - Doesn't rust or tarnish
    items:
    - label: Copper in electric wires
      bin: Conducts electricity
      clue: Current must pass easily.
      why: Copper is an excellent conductor.
    - label: Silver contacts in switches
      bin: Conducts electricity
      clue: The best metal for current.
      why: Silver conducts very well.
    - label: Aluminium cooking pots
      bin: Conducts heat
      clue: The food must warm up fast.
      why: Heat passes through quickly.
    - label: Copper-bottomed vessels
      bin: Conducts heat
      clue: Spreads the flame's warmth evenly.
      why: Good heat conductor.
    - label: Aluminium in aeroplane bodies
      bin: Light in weight
      clue: A plane must not be too heavy.
      why: Aluminium is light and strong.
    - label: Aluminium cycle frames
      bin: Light in weight
      clue: Easier to pedal.
      why: Light metal.
    - label: Gold jewellery
      bin: Doesn't rust or tarnish
      clue: Stays shiny for years.
      why: Gold doesn't react with air or water.
    - label: Stainless steel spoons
      bin: Doesn't rust or tarnish
      clue: Used with wet food every day.
      why: Stainless steel doesn't rust.
  items:
  - prompt: Why is copper used for electric wires?
    options:
    - It conducts electricity and is ductile
    - It is brittle
    - It is very light
    - It is cheap plastic
    answer: It conducts electricity and is ductile
    difficulty: 1
    hints:
    - Two needed properties.
    - Conducts and draws into wire.
    solution: Copper conducts well and can be drawn into wires.
  - prompt: Which non-metal is used to make drinking water safe?
    options:
    - Chlorine
    - Sulfur
    - Carbon
    - Iodine
    answer: Chlorine
    difficulty: 1
    hints:
    - Used in water tanks.
    - Kills germs.
    solution: Chlorine kills germs in water.
  - prompt: Why is aluminium used to make aeroplane bodies?
    options:
    - It is light and strong
    - It is heavy
    - It is brittle
    - It rusts quickly
    answer: It is light and strong
    difficulty: 2
    hints:
    - Aircraft must be light.
    - But strong.
    solution: Aluminium is light yet strong.
  - prompt: What happens to iron left in moist air?
    options:
    - It rusts
    - It melts
    - It becomes gold
    - It turns to liquid
    answer: It rusts
    difficulty: 1
    hints:
    - Reddish-brown flakes.
    - Water and air.
    solution: Iron reacts with water and oxygen to form rust.
  - prompt: Which gas do we need for breathing?
    options:
    - Oxygen
    - Nitrogen
    - Chlorine
    - Carbon dioxide
    answer: Oxygen
    difficulty: 1
    hints:
    - A non-metal.
    - Essential for life.
    solution: We breathe in oxygen.
  - prompt: How can iron gates be protected from rusting?
    options:
    - By painting them
    - By wetting them
    - By heating them
    - By leaving them in rain
    answer: By painting them
    difficulty: 2
    hints:
    - Keep air and water away.
    - A coat on top.
    solution: Paint stops air and moisture reaching the iron.
