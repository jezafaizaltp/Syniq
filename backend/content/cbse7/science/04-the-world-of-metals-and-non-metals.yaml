# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 4. Format: content/README.md.
subject: cbse7-sci
chapter: 4
title: The World of Metals and Non-metals
tips:
  c7s_malleable: "Ductile is about drawing into wires. Beating a metal flat into foil or sheets is the other property."
  t7_aluminium: "An aeroplane must be strong but not heavy."
  t7_chlorine: "Which non-metal is added to swimming pools and water tanks to kill germs?"
  t7_copper_wire: "Wires must carry current and be drawn thin. Which two properties do that?"
  t7_ductile: "Malleable is about beating into sheets, and brittle means it breaks. Being drawn into thin wires is a different property."
  t7_nonmetal_props: "Metals are shiny and bend when hammered, and mercury is a shiny liquid metal. Dull and brittle points to the other group."
  t7_oxygen: "Which gas do our lungs take in to use in our cells?"
  t7_prevent_rust: "Rusting needs air and water. Which choice keeps them away from the iron?"
  t7_rust: "Iron in moist air turns reddish-brown and flaky."
  t7_sonorous: "Strike a metal plate: it rings. That property is called…?"
  c7s4_words: 'Match each property word to its action: shining, beaten flat into sheets, pulled into thin wires, ringing when struck, or breaking when hit.'
  c7s4_groups: 'Think of the usual pattern: shiny, bendable things that ring and carry heat are in one group; dull, crumbly things that do not carry heat well are in the other.'
  c7s4_odd_ones: Some substances break the usual pattern. Recall the famous exceptions, such as a metal that flows, a soft metal cut with a knife, and the non-metal in pencils that carries electricity.
  c7s4_use: 'A material is chosen for a job because of a property. Ask what the job needs: carrying current, being light, staying shiny, or being strong.'
  c7s4_rust: Think about where iron rusts fast and where it hardly rusts, such as in dry desert air or in sealed boiled water. Anything that keeps the needed things away protects it.
concepts:
- code: cbse7s.metal.props
  title: Properties of metals and non-metals
  notes: |
    Metals (iron, copper, aluminium, gold, silver) are usually lustrous (shiny), hard, malleable (beaten into
    sheets), ductile (drawn into wires), sonorous (ring when struck) and good conductors of heat and
    electricity. Non-metals (sulfur, carbon, oxygen, iodine) are usually dull, brittle (break easily), not
    sonorous, and poor conductors. Exceptions: mercury is a liquid metal; sodium is soft; graphite (carbon)
    conducts; diamond (carbon) is very hard. Aluminium foil and copper wire show malleability and ductility.
  explanations:
    text: Metals are usually shiny, can be beaten into sheets and drawn into wires, ring when struck, and carry heat and electricity well. Non-metals are usually dull, break easily and don't conduct, with a few surprises like graphite.
    visual: 'Strike an iron rod and a piece of coal: the iron rings, the coal doesn''t. Hammer them: iron flattens, coal crumbles.'
    step_by_step: 'Step 1: Check lustre: shiny or dull. Step 2: Hammer it: flattens (malleable) or breaks (brittle). Step 3: Strike it: does it ring? Step 4: Test conduction. Step 5: Decide metal or non-metal, remembering the exceptions.'
    real_world: School bells are metal because metals are sonorous; cooking pots are metal because metals conduct heat.
  picture:
    kind: compare
    columns:
    - title: Metals
      points:
      - Shiny (lustrous)
      - Malleable and ductile
      - Sonorous
      - Good conductors
    - title: Non-metals
      points:
      - Dull
      - Brittle
      - Not sonorous
      - Poor conductors (except graphite)
    alt: Metals are shiny, malleable, ductile, sonorous and conduct well; non-metals are dull, brittle and poor conductors, with graphite as an exception.
  activity:
    type: sort
    prompt: Which does this property usually belong to?
    bins:
    - Metal
    - Non-metal
    items:
    - label: Shiny when freshly cut
      bin: Metal
      clue: Think of a new coin.
      why: Metals have lustre.
    - label: Can be beaten into thin sheets
      bin: Metal
      clue: Like silver foil on sweets.
      why: 'Malleable: metals.'
    - label: Can be drawn into wires
      bin: Metal
      clue: Electric wires.
      why: 'Ductile: metals.'
    - label: Rings when struck
      bin: Metal
      clue: Temple bells.
      why: 'Sonorous: metals.'
    - label: Dull, not shiny
      bin: Non-metal
      clue: Think of charcoal or sulphur.
      why: Non-metals are usually dull.
    - label: Breaks into powder when hammered
      bin: Non-metal
      clue: Brittle.
      why: Non-metals like sulphur crumble.
    - label: Poor conductor of heat
      bin: Non-metal
      clue: Sulphur and charcoal barely pass heat along.
      why: Non-metals conduct poorly.
    - label: Yellow powder that burns with a blue flame
      bin: Non-metal
      clue: This is sulphur.
      why: A non-metal.
  lesson:
    - teach: Metals like iron, copper, aluminium, gold and silver are usually shiny (lustrous), hard, and good at carrying heat and electricity. They can be beaten into thin sheets (malleable) and drawn into wires (ductile), and they ring when struck (sonorous).
      picture:
        kind: compare
        columns:
        - title: Property
          points:
          - lustrous
          - malleable
          - ductile
          - sonorous
        - title: Means
          points:
          - shiny
          - beaten into sheets
          - drawn into wires
          - rings when struck
        alt: Metal property words and what they mean.
      check:
        prompt: 'A temple bell rings loudly when struck. The metal is:'
        options:
        - Sonorous
        - Brittle
        - Dull
        answer: Sonorous
        why: Sonorous means it makes a ringing sound.
    - teach: 'Non-metals like sulfur, carbon, oxygen and iodine are usually dull, not sonorous, and poor conductors. Solid non-metals are brittle: a lump of sulfur or coal breaks into pieces when hammered, instead of flattening.'
      picture:
        kind: compare
        columns:
        - title: Metals (usually)
          points:
          - shiny
          - flatten when hammered
          - conduct heat and electricity
          - ring when struck
        - title: Non-metals (usually)
          points:
          - dull
          - break when hammered
          - poor conductors
          - no ring
        alt: Usual properties of metals and non-metals compared.
      check:
        prompt: 'A yellow solid crumbles when hammered and does not conduct. It is most likely:'
        options:
        - A non-metal
        - A metal
        answer: A non-metal
        why: Brittle and non-conducting are non-metal properties (it is sulfur).
    - teach: There are exceptions. Mercury is a metal but liquid at room temperature. Sodium is a metal so soft it can be cut with a knife. Graphite, a form of carbon (a non-metal), conducts electricity, and diamond, another form of carbon, is the hardest natural substance.
      check:
        prompt: Which metal is a liquid at room temperature?
        options:
        - Mercury
        - Iron
        - Copper
        answer: Mercury
        why: Mercury is the liquid metal used in old thermometers.
  items:
  - prompt: 'Beating aluminium into foil shows that it is:'
    options:
    - Malleable
    - Ductile
    - Brittle
    - Sonorous
    answer: Malleable
    difficulty: 1
    hints:
    - Sheets.
    - Ductile is wires.
    solution: Being beaten into thin sheets is malleability.
    mistakes:
      Ductile: c7s_malleable
  - prompt: 'Drawing copper into wires shows that it is:'
    options:
    - Ductile
    - Malleable
    - Brittle
    - Lustrous
    answer: Ductile
    difficulty: 1
    hints:
    - Wires.
    - Malleable is sheets.
    solution: Being drawn into wires is ductility.
    mistakes: {"Malleable": "t7_ductile", "Brittle": "t7_ductile"}
  - prompt: Which metal is a liquid at room temperature?
    options:
    - Mercury
    - Iron
    - Copper
    - Aluminium
    answer: Mercury
    difficulty: 1
    hints:
    - Used in old thermometers.
    - Silvery liquid.
    solution: Mercury is the liquid metal.
    mistakes: {"Iron": "t10_liquid_metal", "Aluminium": "t10_liquid_metal"}
  - prompt: Which non-metal conducts electricity?
    options:
    - Graphite
    - Sulfur
    - Iodine
    - Oxygen
    answer: Graphite
    difficulty: 2
    hints:
    - Pencil lead.
    - A form of carbon.
    solution: Graphite is a non-metal that conducts.
    mistakes: {"Sulfur": "t10_graphite_conducts", "Oxygen": "t10_graphite_conducts"}
  - prompt: Why are school bells made of metal?
    options:
    - Metals are sonorous
    - Metals are brittle
    - Metals are dull
    - Metals are light
    answer: Metals are sonorous
    difficulty: 1
    hints:
    - They ring.
    - Sound.
    solution: Metals produce a ringing sound when struck.
    mistakes: {"Metals are brittle": "t7_sonorous", "Metals are dull": "t7_sonorous"}
  - prompt: 'A substance is dull and breaks into pieces when hammered. It is most likely:'
    options:
    - A non-metal
    - A metal
    - Mercury
    - An alloy
    answer: A non-metal
    difficulty: 2
    hints:
    - Brittle.
    - Not lustrous.
    solution: Dull and brittle are non-metal properties.
    mistakes: {"A metal": "t7_nonmetal_props", "Mercury": "t7_nonmetal_props"}
  - prompt: 'Gold can be hammered into very thin leaves. This shows gold is:'
    options:
    - Malleable
    - Ductile
    - Brittle
    answer: Malleable
    difficulty: 1
    hints:
    - Hammering makes sheets.
    - Which word means beaten into sheets?
    solution: Being beaten into thin sheets is malleability; drawing into wires would be ductility.
    mistakes:
      Ductile: c7s4_words
      Brittle: c7s4_words
  - prompt: 'Aluminium is pulled into thin electric wires. This shows it is:'
    options:
    - Ductile
    - Malleable
    - Sonorous
    answer: Ductile
    difficulty: 1
    hints:
    - Pulled into wires.
    - Which word means drawn into wires?
    solution: Being drawn into wires is ductility.
    mistakes:
      Malleable: c7s4_words
      Sonorous: c7s4_words
  - prompt: 'A freshly cut piece of metal looks shiny. This property is called:'
    options:
    - Lustre
    - Ductility
    - Brittleness
    answer: Lustre
    difficulty: 1
    hints:
    - It is about how it looks.
    - Shine.
    solution: The shine of metals is called lustre.
    mistakes:
      Ductility: c7s4_words
      Brittleness: c7s4_words
  - prompt: Which is a non-metal?
    options:
    - Sulfur
    - Copper
    - Iron
    answer: Sulfur
    difficulty: 1
    hints:
    - Copper and iron are used for wires and gates.
    - The yellow powder is different.
    solution: Sulfur is a dull, brittle yellow non-metal; copper and iron are metals.
    mistakes:
      Copper: c7s4_groups
      Iron: c7s4_groups
  - prompt: 'Cooking pans are made of metals mainly because metals:'
    options:
    - Conduct heat well
    - Are brittle
    - Are dull
    answer: Conduct heat well
    difficulty: 2
    hints:
    - A pan must pass heat to the food.
    - Which property helps?
    solution: Metals carry heat quickly from the flame to the food.
    mistakes:
      Are brittle: c7s4_groups
      Are dull: c7s4_groups
  - prompt: 'A metal so soft it can be cut with a knife is:'
    options:
    - Sodium
    - Iron
    - Mercury
    answer: Sodium
    difficulty: 2
    hints:
    - It is one of the exceptions.
    - It is kept in kerosene.
    solution: Sodium is a soft metal that can be cut with a knife (it is kept in kerosene because it reacts with air).
    mistakes:
      Iron: c7s4_odd_ones
      Mercury: c7s4_odd_ones
  - prompt: 'Diamond and graphite are both forms of:'
    options:
    - Carbon
    - Iron
    - Sulfur
    answer: Carbon
    difficulty: 2
    hints:
    - Pencil lead is graphite.
    - Coal is also mostly this element.
    solution: Both diamond and graphite are made only of carbon atoms, arranged differently.
    mistakes:
      Iron: c7s4_odd_ones
      Sulfur: c7s4_odd_ones
  - prompt: 'A sample is shiny, bends without breaking and conducts. It is most likely:'
    options:
    - A metal
    - A non-metal
    - Neither
    answer: A metal
    difficulty: 2
    hints:
    - Check each property.
    - Shiny, bendable and conducting are a pattern.
    solution: Lustre, malleability and conductivity are typical of metals.
    mistakes:
      A non-metal: c7s4_groups
      Neither: c7s4_groups
  - prompt: Why is graphite called an exception among non-metals?
    options:
    - It conducts electricity
    - It is a liquid
    - It rings when struck
    answer: It conducts electricity
    difficulty: 3
    hints:
    - Most non-metals are poor conductors.
    - Pencil lead in a circuit lights a bulb.
    solution: Non-metals usually do not conduct, but graphite does, so it is an exception.
    mistakes:
      It is a liquid: c7s4_odd_ones
      It rings when struck: c7s4_odd_ones
  - prompt: A student hammers a piece of coal and a piece of copper. What happens?
    options:
    - Coal breaks into pieces; copper flattens
    - Both flatten
    - Both break into pieces
    answer: Coal breaks into pieces; copper flattens
    difficulty: 3
    hints:
    - Coal is mostly carbon, a non-metal.
    - Copper is a metal.
    solution: Non-metals like coal are brittle and break; metals like copper are malleable and flatten.
    mistakes:
      Both flatten: c7s4_groups
      Both break into pieces: c7s4_groups
  - prompt: Why are many musical instruments like cymbals made of metal?
    options:
    - Metals ring when struck
    - Metals are brittle
    - Metals are poor conductors
    answer: Metals ring when struck
    difficulty: 3
    hints:
    - Instruments must make a sound.
    - Which property is about sound?
    solution: Metals are sonorous, so they produce a ringing sound.
    mistakes:
      Metals are brittle: c7s4_words
      Metals are poor conductors: c7s4_groups
- code: cbse7s.metal.uses
  title: Uses of metals and non-metals
  after:
  - cbse7s.metal.props
  notes: |
    Uses follow properties. Metals: copper and aluminium for wires (conduct, ductile); iron and steel for
    bridges, machines (strong); aluminium for foil, aircraft (light, malleable); gold and silver for jewellery
    (lustrous, don't corrode). Non-metals: oxygen for breathing; nitrogen in fertilisers; carbon (as coal,
    graphite) for fuel and pencils; chlorine for cleaning water; iodine as an antiseptic. Iron rusts in moist air;
    painting or galvanising protects it.
  explanations:
    text: 'We choose a material for a job because of its properties: copper for wires because it conducts, aluminium for aeroplanes because it is light, gold for jewellery because it stays shiny. Non-metals matter too: we breathe oxygen and clean water with chlorine.'
    visual: 'Picture a house: copper wiring in the walls, an iron gate (painted against rust), an aluminium pressure cooker, a pencil with graphite lead, and water purified with chlorine.'
    step_by_step: 'Step 1: Name the job. Step 2: List the properties it needs. Step 3: Choose the material with those properties. Step 4: Think about protecting it (paint for iron).'
    real_world: Iron gates are painted to stop rusting, because iron reacts with moist air.
  picture:
    kind: compare
    columns:
    - title: Metal uses
      points:
      - 'Copper: wires'
      - 'Iron and steel: bridges'
      - 'Aluminium: foil, aircraft'
      - 'Gold: jewellery'
    - title: Non-metal uses
      points:
      - 'Oxygen: breathing'
      - 'Nitrogen: fertilisers'
      - 'Chlorine: cleaning water'
      - 'Graphite: pencils'
    alt: Uses of metals (copper wires, steel bridges, aluminium foil, gold jewellery) and of non-metals (oxygen, nitrogen fertilisers, chlorine, graphite pencils).
  activity:
    type: sort
    prompt: Which property makes it right for the job?
    bins:
    - Conducts electricity
    - Conducts heat
    - Light in weight
    - Doesn't rust or tarnish
    items:
    - label: Copper in electric wires
      bin: Conducts electricity
      clue: Current must pass easily.
      why: Copper is an excellent conductor.
    - label: Silver contacts in switches
      bin: Conducts electricity
      clue: The best metal for current.
      why: Silver conducts very well.
    - label: Aluminium cooking pots
      bin: Conducts heat
      clue: The food must warm up fast.
      why: Heat passes through quickly.
    - label: Copper-bottomed vessels
      bin: Conducts heat
      clue: Spreads the flame's warmth evenly.
      why: Good heat conductor.
    - label: Aluminium in aeroplane bodies
      bin: Light in weight
      clue: A plane must not be too heavy.
      why: Aluminium is light and strong.
    - label: Aluminium cycle frames
      bin: Light in weight
      clue: Easier to pedal.
      why: Light metal.
    - label: Gold jewellery
      bin: Doesn't rust or tarnish
      clue: Stays shiny for years.
      why: Gold doesn't react with air or water.
    - label: Stainless steel spoons
      bin: Doesn't rust or tarnish
      clue: Used with wet food every day.
      why: Stainless steel doesn't rust.
  lesson:
    - teach: We use each material for what its properties allow. Copper and aluminium make wires (they conduct and draw into wires). Iron and steel make bridges and machines (strong). Aluminium makes foil and aircraft bodies (light, malleable). Gold and silver make jewellery (shiny and they do not corrode).
      picture:
        kind: compare
        columns:
        - title: Metal
          points:
          - copper
          - iron/steel
          - aluminium
          - gold
        - title: Use
          points:
          - wires
          - bridges
          - foil, aircraft
          - jewellery
        - title: Because
          points:
          - conducts, ductile
          - strong
          - light
          - shiny, no rust
        alt: Metals, their uses and the property behind each use.
      check:
        prompt: Why is gold used for jewellery?
        options:
        - It stays shiny and does not corrode
        - It is a liquid
        - It is brittle
        answer: It stays shiny and does not corrode
        why: Gold keeps its lustre for years.
    - teach: Non-metals are useful too. Oxygen is needed for breathing and burning. Nitrogen goes into fertilisers. Carbon is in fuels (coal) and pencils (graphite). Chlorine kills germs in drinking water. Iodine (as tincture) is an antiseptic.
      picture:
        kind: compare
        columns:
        - title: Non-metal
          points:
          - oxygen
          - nitrogen
          - chlorine
          - iodine
        - title: Use
          points:
          - breathing
          - fertilisers
          - cleaning water
          - antiseptic
        alt: Some non-metals and their uses.
      check:
        prompt: Which non-metal is used in fertilisers?
        options:
        - Nitrogen
        - Iodine
        - Sodium
        answer: Nitrogen
        why: Plants need nitrogen to grow.
    - teach: 'Iron rusts when it meets both air (oxygen) and water: a reddish-brown flaky layer forms and weakens it. Painting, oiling, greasing or galvanising (coating with zinc) keeps air and water away.'
      check:
        prompt: Why does painting stop an iron gate from rusting?
        options:
        - It keeps air and water away from the iron
        - Paint is magnetic
        - Paint makes iron a non-metal
        answer: It keeps air and water away from the iron
        why: Rusting needs both air and water.
  items:
  - prompt: Why is copper used for electric wires?
    options:
    - It conducts electricity and is ductile
    - It is brittle
    - It is very light
    - It is cheap plastic
    answer: It conducts electricity and is ductile
    difficulty: 1
    hints:
    - Two needed properties.
    - Conducts and draws into wire.
    solution: Copper conducts well and can be drawn into wires.
    mistakes: {"It is brittle": "t7_copper_wire", "It is cheap plastic": "t7_copper_wire"}
  - prompt: Which non-metal is used to make drinking water safe?
    options:
    - Chlorine
    - Sulfur
    - Carbon
    - Iodine
    answer: Chlorine
    difficulty: 1
    hints:
    - Used in water tanks.
    - Kills germs.
    solution: Chlorine kills germs in water.
    mistakes: {"Sulfur": "t7_chlorine", "Carbon": "t7_chlorine"}
  - prompt: Why is aluminium used to make aeroplane bodies?
    options:
    - It is light and strong
    - It is heavy
    - It is brittle
    - It rusts quickly
    answer: It is light and strong
    difficulty: 2
    hints:
    - Aircraft must be light.
    - But strong.
    solution: Aluminium is light yet strong.
    mistakes: {"It is heavy": "t7_aluminium", "It rusts quickly": "t7_aluminium"}
  - prompt: What happens to iron left in moist air?
    options:
    - It rusts
    - It melts
    - It becomes gold
    - It turns to liquid
    answer: It rusts
    difficulty: 1
    hints:
    - Reddish-brown flakes.
    - Water and air.
    solution: Iron reacts with water and oxygen to form rust.
    mistakes: {"It melts": "t7_rust", "It becomes gold": "t7_rust"}
  - prompt: Which gas do we need for breathing?
    options:
    - Oxygen
    - Nitrogen
    - Chlorine
    - Carbon dioxide
    answer: Oxygen
    difficulty: 1
    hints:
    - A non-metal.
    - Essential for life.
    solution: We breathe in oxygen.
    mistakes: {"Nitrogen": "t7_oxygen", "Carbon dioxide": "t7_oxygen"}
  - prompt: How can iron gates be protected from rusting?
    options:
    - By painting them
    - By wetting them
    - By heating them
    - By leaving them in rain
    answer: By painting them
    difficulty: 2
    hints:
    - Keep air and water away.
    - A coat on top.
    solution: Paint stops air and moisture reaching the iron.
    mistakes: {"By wetting them": "t7_prevent_rust", "By leaving them in rain": "t7_prevent_rust"}
  - prompt: Which metal is used to make aluminium foil for wrapping food?
    options:
    - Aluminium
    - Iron
    - Mercury
    answer: Aluminium
    difficulty: 1
    hints:
    - The name is in the question.
    - It is light and easily beaten thin.
    solution: Aluminium is light and malleable, so it is beaten into thin foil.
    mistakes:
      Iron: c7s4_use
      Mercury: c7s4_odd_ones
  - prompt: Which gas do plants and animals need for breathing?
    options:
    - Oxygen
    - Chlorine
    - Nitrogen
    answer: Oxygen
    difficulty: 1
    hints:
    - It is also needed for burning.
    - About one-fifth of air.
    solution: Living things use oxygen to release energy from food.
    mistakes:
      Chlorine: c7s4_use
      Nitrogen: c7s4_use
  - prompt: 'Rust on iron looks:'
    options:
    - Reddish-brown and flaky
    - Shiny and silver
    - Green and smooth
    answer: Reddish-brown and flaky
    difficulty: 1
    hints:
    - Think of an old iron gate.
    - The colour of rust.
    solution: Rust is a reddish-brown, flaky layer that forms on iron in moist air.
    mistakes:
      Shiny and silver: c7s4_rust
      Green and smooth: c7s4_rust
  - prompt: 'Tincture of iodine is used:'
    options:
    - On wounds as an antiseptic
    - To make wires
    - As a cooking fuel
    answer: On wounds as an antiseptic
    difficulty: 1
    hints:
    - It is found in first-aid kits.
    - It kills germs.
    solution: Iodine kills germs, so its tincture is used on cuts and wounds.
    mistakes:
      To make wires: c7s4_use
      As a cooking fuel: c7s4_use
  - prompt: Why are aeroplane bodies made of aluminium alloys and not iron?
    options:
    - Aluminium is light and strong
    - Aluminium is a liquid
    - Iron cannot be shaped
    answer: Aluminium is light and strong
    difficulty: 2
    hints:
    - A plane must not be too heavy.
    - Compare how heavy the metals are.
    solution: Aluminium is much lighter than iron but strong enough, so planes can fly using less fuel.
    mistakes:
      Aluminium is a liquid: c7s4_odd_ones
      Iron cannot be shaped: c7s4_use
  - prompt: 'Coating iron with zinc to stop rusting is called:'
    options:
    - Galvanising
    - Rusting
    - Melting
    answer: Galvanising
    difficulty: 2
    hints:
    - Iron buckets and roof sheets are treated like this.
    - The zinc layer protects.
    solution: A zinc coating on iron is galvanising; it keeps air and water away.
    mistakes:
      Rusting: c7s4_rust
      Melting: c7s4_rust
  - prompt: Which needs to be present for iron to rust?
    options:
    - Both air and water
    - Only air
    - Only sunlight
    answer: Both air and water
    difficulty: 2
    hints:
    - Iron in dry desert air hardly rusts.
    - Iron in boiled, sealed water hardly rusts.
    solution: Rusting needs oxygen from air and water together.
    mistakes:
      Only air: c7s4_rust
      Only sunlight: c7s4_rust
  - prompt: Why are electric wires made of copper rather than iron?
    options:
    - Copper conducts better and is easily drawn into wires
    - Copper is a non-metal
    - Iron is a liquid
    answer: Copper conducts better and is easily drawn into wires
    difficulty: 2
    hints:
    - Wires must carry current well.
    - They must be thin and long.
    solution: Copper is a very good conductor and ductile; iron conducts less well and rusts.
    mistakes:
      Copper is a non-metal: c7s4_groups
      Iron is a liquid: c7s4_odd_ones
  - prompt: Ships rust faster than iron gates on land. Why?
    options:
    - Sea water and moist salty air speed up rusting
    - Ships are made of gold
