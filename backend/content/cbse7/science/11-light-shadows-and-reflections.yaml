# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 11. Format: content/README.md.
subject: cbse7-sci
chapter: 11
title: 'Light: Shadows and Reflections'
tips:
  c7s_luminous: Luminous objects make their own light; the Moon only reflects sunlight.
  c7s_reflect_angle: The angle of reflection equals the angle of incidence, both measured from the normal.
  t7_ambulance: "Mirrors swap left and right. How would a reversed word look in a driver's mirror?"
  t7_mirror_distance: "The image is as far behind the mirror as you are in front. Add both distances."
  t7_mirror_image: "Raise your right hand in a mirror. Is the image upside down? Which hand rises?"
  t7_normal: "A ray is the light itself and a shadow is where light is blocked. The line standing at 90° to the mirror has a special name."
  t7_opaque_shadow: "A shadow forms where light can't pass. Which kind of object stops light completely?"
  t7_periscope: "A periscope bends the view twice using two flat reflectors."
  t7_pinhole: "Light from the top of the object travels straight through the hole to the bottom of the screen."
  t7_straight_lines: "Light can't bend round corners on its own. What path does it take?"
  t7_translucent: "Transparent lets all light through, opaque none. 'Some' is in between."
  c7s11_path: Light keeps going in one direction until something stops or turns it. It cannot bend round a corner by itself.
  c7s11_own: Ask whether the object makes light itself, or is only seen because light from somewhere else bounces off it.
  c7s11_through: 'Sort by how much light gets through: nearly all, only some (things behind look blurred), or none at all.'
  c7s11_shadow: A dark patch forms behind an object that stops light. It is always on the side away from the light, and its shape follows the object's outline.
  c7s11_equal: At a mirror, the ray leaves at the same angle to the normal as it arrived. Measure both angles from the normal, not from the mirror.
  c7s11_image: In a flat mirror the picture is the same size and the right way up, just as far behind as you are in front, with left and right swapped.
concepts:
- code: cbse7s.light.shadow
  title: How light travels and shadows
  notes: |
    Light travels in straight lines (rectilinear propagation): you can't see a candle through a bent pipe. Luminous
    objects give out their own light (Sun, bulb); non-luminous objects are seen by reflected light (Moon, book).
    Transparent materials let almost all light through (glass), translucent some (butter paper), opaque none
    (wood). Opaque objects block light and form shadows on the side away from the source. A pinhole camera forms
    an inverted image because light travels in straight lines.
  explanations:
    text: Light travels in straight lines. When an opaque object blocks it, a dark shadow forms behind the object. That is also why a pinhole camera shows an upside-down picture.
    visual: 'Shine a torch at a ball in front of a wall: the light rays go straight, the ball blocks some, and a round shadow appears on the wall.'
    step_by_step: 'Step 1: Find the light source. Step 2: Draw straight rays from it. Step 3: See which rays an object blocks. Step 4: The shadow forms where rays don''t reach.'
    real_world: A sundial uses the moving shadow of a stick to tell the time.
  picture:
    kind: compare
    columns:
    - title: Transparent
      points:
      - Lets light through
      - Glass, clear water
      - See clearly through it
    - title: Translucent
      points:
      - Lets some light through
      - Butter paper, frosted glass
      - See blurrily
    - title: Opaque
      points:
      - Lets no light through
      - Wood, metal, stone
      - Casts a dark shadow
    alt: 'Transparent, translucent and opaque materials compared: how much light passes and whether a shadow forms.'
  activity:
    type: sort
    prompt: How much light passes through?
    bins:
    - Transparent
    - Translucent
    - Opaque
    items:
    - label: Clear window glass
      bin: Transparent
      clue: Can you see clearly through it?
      why: Almost all light passes.
    - label: Clean water
      bin: Transparent
      clue: See the bottom of a clear pond.
      why: Light passes.
    - label: Cellophane wrapper
      bin: Transparent
      clue: See-through plastic.
      why: Transparent.
    - label: Butter paper
      bin: Translucent
      clue: Light comes through, but you can't see clearly.
      why: Some light passes.
    - label: Frosted glass
      bin: Translucent
      clue: Blurry shapes only.
      why: Translucent.
    - label: Oiled paper
      bin: Translucent
      clue: Hold it up to a lamp.
      why: Some light passes.
    - label: Wooden door
      bin: Opaque
      clue: Does any light get through?
      why: 'No light: it casts a shadow.'
    - label: A book
      bin: Opaque
      clue: Hold it in front of a torch.
      why: Opaque.
    - label: Your hand
      bin: Opaque
      clue: Makes a dark shadow.
      why: Opaque.
  lesson:
    - teach: Light travels in straight lines. Look at a candle through a straight pipe and you see it; bend the pipe and you cannot. Sunbeams through a gap in the clouds and torch beams in fog are straight too.
      picture:
        kind: compare
        columns:
        - title: Straight pipe
          points:
          - candle seen
          - light reaches the eye
        - title: Bent pipe
          points:
          - candle not seen
          - light cannot turn the corner
        alt: A candle can be seen through a straight pipe but not a bent one.
      check:
        prompt: Why can't you see a candle through a bent pipe?
        options:
        - Light travels in straight lines
        - The pipe is too long
        - Candles give no light
        answer: Light travels in straight lines
        why: Light cannot follow the bend.
    - teach: 'Luminous objects give out their own light: the Sun, a bulb, a candle flame. Non-luminous objects, like the Moon or a book, are seen because light bounces off them into our eyes. Materials are transparent (let almost all light through, like clear glass), translucent (let some through, like butter paper) or opaque (let none through, like wood).'
      picture:
        kind: compare
        columns:
        - title: Transparent
          points:
          - clear glass
          - clean water
          - see clearly through
        - title: Translucent
          points:
          - butter paper
          - frosted glass
          - see blurred
        - title: Opaque
          points:
          - wood
          - metal
          - see nothing
        alt: Transparent, translucent and opaque materials.
      check:
        prompt: 'Frosted glass in a bathroom window is:'
        options:
        - Translucent
        - Transparent
        - Opaque
        answer: Translucent
        why: Some light passes, but you cannot see clearly through it.
    - teach: An opaque object blocks light and makes a shadow on the side away from the light. You need a light source, an opaque object and a screen. A pinhole camera, a box with a tiny hole, shows an upside-down image because straight rays from the top of an object cross at the hole and land at the bottom.
      check:
        prompt: 'The image in a pinhole camera is:'
        options:
        - Upside down
        - The right way up
        - In colour only at night
        answer: Upside down
        why: Rays cross at the pinhole.
  items:
  - prompt: 'Light travels in:'
    options:
    - Straight lines
    - Curves
    - Circles
    - Zigzags
    answer: Straight lines
    difficulty: 1
    hints:
    - Try a bent pipe.
    - Rays.
    solution: Light travels in straight lines.
    mistakes: {"Curves": "t7_straight_lines", "Zigzags": "t7_straight_lines"}
  - prompt: Which object is luminous?
    options:
    - The Sun
    - The Moon
    - A mirror
    - A book
    answer: The Sun
    difficulty: 1
    hints:
    - Gives its own light.
    - The Moon reflects light.
    solution: The Sun makes its own light; the Moon only reflects it.
    mistakes:
      The Moon: c7s_luminous
  - prompt: 'Butter paper lets some light through. It is:'
    options:
    - Translucent
    - Transparent
    - Opaque
    - Luminous
    answer: Translucent
    difficulty: 2
    hints:
    - Some, not all.
    - Blurry view.
    solution: Allowing some light through is translucent.
    mistakes: {"Transparent": "t7_translucent", "Opaque": "t7_translucent"}
  - prompt: 'A shadow forms when light is blocked by:'
    options:
    - An opaque object
    - A transparent object
    - Air
    - Clear glass
    answer: An opaque object
    difficulty: 1
    hints:
    - No light passes.
    - Wood, metal.
    solution: Opaque objects block light and make shadows.
    mistakes: {"A transparent object": "t7_opaque_shadow", "Clear glass": "t7_opaque_shadow"}
  - prompt: 'The image in a pinhole camera is:'
    options:
    - Upside down
    - Upright and bigger
    - Coloured differently
    - Not formed
    answer: Upside down
    difficulty: 2
    hints:
    - Rays cross at the pinhole.
    - Straight lines.
    solution: Rays cross at the pinhole, so the image is inverted.
    mistakes: {"Upright and bigger": "t7_pinhole", "Not formed": "t7_pinhole"}
  - prompt: Why can't you see a candle flame through a bent pipe?
    options:
    - Light travels in straight lines
    - The pipe absorbs heat
    - Candles are too dim
    - Pipes are luminous
    answer: Light travels in straight lines
    difficulty: 1
    hints:
    - Light can't bend round the corner.
    - Straight rays.
    solution: Light cannot follow the bend.
    mistakes: {"The pipe absorbs heat": "t7_straight_lines", "Candles are too dim": "t7_straight_lines"}
  - prompt: Which of these is luminous?
    options:
    - A burning candle
    - The Moon
    - A mirror
    answer: A burning candle
    difficulty: 1
    hints:
    - Which one makes its own light?
    - The Moon only reflects sunlight.
    solution: A candle flame gives out its own light, so it is luminous.
    mistakes:
      The Moon: c7s11_own
      A mirror: c7s11_own
  - prompt: Which material is opaque?
    options:
    - A wooden board
    - Clear glass
    - Butter paper
    answer: A wooden board
    difficulty: 1
    hints:
    - Opaque lets no light through.
    - Can you see through wood?
    solution: Wood blocks all light, so it is opaque.
    mistakes:
      Clear glass: c7s11_through
      Butter paper: c7s11_through
  - prompt: 'Clean water in a glass is:'
    options:
    - Transparent
    - Opaque
    - Luminous
    answer: Transparent
    difficulty: 1
    hints:
    - Can you see clearly through it?
    - Almost all light passes.
    solution: Light passes through clean water, so you can see clearly through it.
    mistakes:
      Opaque: c7s11_through
      Luminous: c7s11_own
  - prompt: What three things are needed to see a shadow?
    options:
    - A light source, an opaque object and a screen
    - Only a mirror
    - Only water and glass
    answer: A light source, an opaque object and a screen
    difficulty: 1
    hints:
    - Something must give light.
    - Something must block it, and something must show the dark patch.
    solution: Light from a source is blocked by an opaque object, and the shadow falls on a screen.
    mistakes:
      Only a mirror: c7s11_shadow
      Only water and glass: c7s11_through
  - prompt: A torch shines on a ball from the left. Where is the ball's shadow?
    options:
    - On the right of the ball
    - On the left of the ball
    - Inside the torch
    answer: On the right of the ball
    difficulty: 2
    hints:
    - Shadows are on the side away from the light.
    - The light comes from the left.
    solution: The ball blocks light coming from the left, so the shadow falls on its right side.
    mistakes:
      On the left of the ball: c7s11_shadow
      Inside the torch: c7s11_shadow
  - prompt: Why do we see the Moon at night?
    options:
    - It reflects sunlight
    - It makes its own light
    - Stars light it up from behind
    answer: It reflects sunlight
    difficulty: 2
    hints:
    - Is the Moon luminous?
    - Where does its light come from?
    solution: The Moon is non-luminous; sunlight bounces off it into our eyes.
    mistakes:
      It makes its own light: c7s11_own
      Stars light it up from behind: c7s11_own
  - prompt: 'A sunbeam entering a dark room through a small hole looks like a straight bright line. This shows:'
    options:
    - Light travels in straight lines
    - Light bends round corners
    - Light is a liquid
    answer: Light travels in straight lines
    difficulty: 2
    hints:
    - Look at the shape of the beam.
    - Does it curve?
    solution: The beam is straight because light travels in straight lines.
    mistakes:
      Light bends round corners: c7s11_path
      Light is a liquid: c7s11_path
  - prompt: Can the colour of a red ball be seen in its shadow?
    options:
    - No, shadows are dark whatever the colour
    - Yes, the shadow is red
    - Only in sunlight
    answer: No, shadows are dark whatever the colour
    difficulty: 2
    hints:
    - A shadow is where light does not reach.
    - Does the colour pass through the ball?
    solution: A shadow is simply an area with no light, so it is dark, not coloured.
    mistakes:
      Yes, the shadow is red: c7s11_shadow
      Only in sunlight: c7s11_shadow
  - prompt: In a pinhole camera, a tree is seen. Why is the image upside down?
    options:
    - Rays from the top go down through the hole and rays from the bottom go up
    - The box is turned over
    - Light bends inside the box
    answer: Rays from the top go down through the hole and rays from the bottom go up
    difficulty: 3
    hints:
    - Light travels in straight lines.
    - Draw a line from the treetop through the hole.
    solution: Straight rays cross at the pinhole, so the top of the tree lands at the bottom of the screen.
    mistakes:
      The box is turned over: c7s11_path
      Light bends inside the box: c7s11_path
  - prompt: Your shadow is long in the early morning and short at noon. Why?
    options:
    - The Sun is low in the morning and high at noon
    - You grow during the day
    - Light is weaker at noon
    answer: The Sun is low in the morning and high at noon
    difficulty: 3
    hints:
    - Where is the Sun at each time?
    - Low light makes long shadows.
    solution: A low Sun sends rays at a slant, stretching the shadow; at noon it is overhead and the shadow is short.
    mistakes:
      You grow during the day: c7s11_shadow
      Light is weaker at noon: c7s11_shadow
  - prompt: A coin, a sheet of tracing paper and a glass slide are held in front of a torch. Which order shows least light to most light passing through?
    options:
    - Coin, tracing paper, glass slide
    - Glass slide, coin, tracing paper
    - Tracing paper, glass slide, coin
    answer: Coin, tracing paper, glass slide
    difficulty: 3
    hints:
    - Which blocks all light?
    - Which lets almost all through?
    solution: The coin is opaque (none), tracing paper translucent (some), the glass slide transparent (almost all).
    mistakes:
      Glass slide, coin, tracing paper: c7s11_through
      Tracing paper, glass slide, coin: c7s11_through
- code: cbse7s.light.reflect
  title: Reflection and mirrors
  after:
  - cbse7s.light.shadow
  notes: |
    Reflection is light bouncing off a surface; smooth shiny surfaces like mirrors reflect regularly. Laws: the
    angle of incidence equals the angle of reflection, and both rays and the normal lie in one plane. A plane
    mirror forms an image that is upright, the same size, as far behind the mirror as the object is in front, and
    laterally inverted (left and right swapped). That is why AMBULANCE is written in mirror letters on vehicles. A
    periscope uses two mirrors to see over obstacles.
  explanations:
    text: 'A mirror bounces light back at the same angle it arrived. In a plane mirror your image is the same size and upright, but left and right are swapped: raise your right hand and your image raises its left.'
    visual: Draw a mirror as a line, a dotted normal at right angles, an incoming ray at 30° to the normal, and the reflected ray leaving at 30° on the other side.
    step_by_step: 'Step 1: Draw the normal (a line at 90° to the mirror). Step 2: Measure the angle of incidence from the normal. Step 3: The angle of reflection is equal. Step 4: For a plane mirror image: same size, upright, same distance behind, left-right swapped.'
    real_world: The word AMBULANCE is printed reversed on the front of ambulances so drivers ahead read it correctly in their mirrors.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 8
      O:
      - 5
      - 2
      B:
      - 9
      - 8
      _N:
      - 5
      - 9
      M1:
      - 1
      - 2
      M2:
      - 9
      - 2
    segments:
    - - M1
      - M2
      - mirror
    - - A
      - O
    - - O
      - B
    - - O
      - _N
    angles:
    - at: O
      from: A
      to: _N
      label: i
    - at: O
      from: _N
      to: B
      label: r
    caption: The angle of incidence i equals the angle of reflection r, both measured from the normal.
    alt: A ray from A hits a mirror at O and reflects to B; the angle of incidence i and angle of reflection r on either side of the dotted normal are equal.
  activity:
    type: sort
    prompt: In a plane mirror, what stays the same and what changes?
    bins:
    - Stays the same
    - Gets swapped or changed
    items:
    - label: The size of your image
      bin: Stays the same
      clue: Is your face bigger in the mirror?
      why: Same size.
    - label: Image upright, not upside down
      bin: Stays the same
      clue: Is your head at the top?
      why: Upright.
    - label: How far the image seems behind the mirror
      bin: Stays the same
      clue: Compare it with how far you stand in front.
      why: Same distance behind.
    - label: The colours of your clothes
      bin: Stays the same
      clue: Does a red shirt look blue?
      why: Colours stay.
    - label: Your right hand looks like a left hand
      bin: Gets swapped or changed
      clue: Raise your right hand.
      why: Left and right swap.
    - label: Writing appears backwards
      bin: Gets swapped or changed
      clue: Why is AMBULANCE written backwards on vans?
      why: Lateral inversion.
    - label: A clock's hands seem to turn the other way
      bin: Gets swapped or changed
      clue: Watch a clock in a mirror.
      why: Left-right swap.
  lesson:
    - teach: Reflection is light bouncing off a surface. Smooth shiny surfaces like mirrors reflect light neatly, so we see images in them. The ray coming in is the incident ray; the ray going out is the reflected ray; the line at 90° to the mirror where the ray hits is the normal.
      picture:
        kind: geometry
        points:
          A:
          - 1
          - 8
          O:
          - 5
          - 2
          B:
          - 9
          - 8
          N:
          - 5
          - 9
          L:
          - 1
          - 2
          R:
          - 9
          - 2
        segments:
        - - L
          - R
          - mirror
        - - A
          - O
        - - O
          - B
        - - O
          - N
          - normal
        angles:
        - at: O
          from: N
          to: A
          label: i
        - at: O
          from: B
          to: N
          label: r
        alt: A ray AO hits a mirror at O and reflects along OB. The normal ON makes equal angles i and r with the two rays.
      check:
        prompt: 'The line drawn at 90° to the mirror where the ray hits is called:'
        options:
        - The normal
        - The incident ray
        - The shadow
        answer: The normal
        why: Angles are measured from it.
    - teach: 'Laws of reflection: the angle of incidence (between incident ray and normal) equals the angle of reflection (between reflected ray and normal), and both rays and the normal lie in one flat plane. If light hits at 40° to the normal, it leaves at 40°.'
      check:
        prompt: A ray hits a mirror at 25° to the normal. What is the angle of reflection?
        options:
        - 25°
        - 65°
        - 50°
        answer: 25°
        why: Angle of incidence equals angle of reflection.
    - teach: 'A plane (flat) mirror makes an image that is upright, the same size, as far behind the mirror as the object is in front, and laterally inverted: raise your right hand and the image raises its left. That is why AMBULANCE is written reversed on the front of ambulances. A periscope uses two mirrors to see over walls.'
      picture:
        kind: compare
        columns:
        - title: Object
          points:
          - you, 2 m in front
          - right hand raised
        - title: Image
          points:
          - upright, same size
          - 2 m behind the mirror
          - left hand appears raised
        alt: Features of an image in a plane mirror.
      check:
        prompt: You stand 3 m from a mirror. How far behind the mirror is your image?
        options:
        - 3 m
        - 6 m
        - 1.5 m
        answer: 3 m
        why: The image is as far behind as you are in front.
  items:
  - prompt: A ray hits a mirror with an angle of incidence of 30°. What is the angle of reflection, in degrees?
    answer: '30'
    check: '30'
    difficulty: 1
    hints:
    - They are equal.
    - Law of reflection.
    solution: Angle of reflection = angle of incidence = 30°.
    mistakes:
      '60': c7s_reflect_angle
  - prompt: 'Your image in a plane mirror is:'
    options:
    - Upright, same size, left-right swapped
    - Upside down and smaller
    - Bigger and upright
    - Upside down and bigger
    answer: Upright, same size, left-right swapped
    difficulty: 1
    hints:
    - Look in a mirror.
    - Lateral inversion.
    solution: A plane mirror image is upright, same size and laterally inverted.
    mistakes: {"Upside down and smaller": "t7_mirror_image", "Bigger and upright": "t7_mirror_image"}
  - prompt: You stand 2 m in front of a plane mirror. How far is your image from you, in metres?
    answer: '4'
    check: 2 + 2
    difficulty: 2
    hints:
    - The image is 2 m behind the mirror.
    - 2 + 2.
    solution: 2 m in front + 2 m behind = 4 m.
    mistakes: {"2": "t7_mirror_distance", "1": "t7_mirror_distance"}
  - prompt: Why is AMBULANCE written in mirror letters on the vehicle?
    options:
    - Drivers ahead read it correctly in their mirrors
    - For decoration
    - Because of a printing error
    - To hide the word
    answer: Drivers ahead read it correctly in their mirrors
    difficulty: 1
    hints:
    - Mirrors swap left and right.
    - Rear-view mirrors.
    solution: Lateral inversion in the mirror turns it the right way round.
    mistakes: {"For decoration": "t7_ambulance", "Because of a printing error": "t7_ambulance"}
  - prompt: 'A periscope uses:'
    options:
    - Two plane mirrors
    - One lens
    - A prism and a lens
    - No mirrors
    answer: Two plane mirrors
    difficulty: 2
    hints:
    - Used in submarines.
    - Light reflects twice.
    solution: Two mirrors at 45° let you see over obstacles.
    mistakes: {"One lens": "t7_periscope", "No mirrors": "t7_periscope"}
  - prompt: 'The line drawn at 90° to a mirror at the point where light hits it is the:'
    options:
    - Normal
    - Ray
    - Image
    - Shadow
    answer: Normal
    difficulty: 2
    hints:
    - Angles are measured from it.
    - Perpendicular.
    solution: That line is the normal.
    mistakes: {"Ray": "t7_normal", "Shadow": "t7_normal"}
  - prompt: A ray strikes a mirror with an angle of incidence of 50°. What is the angle of reflection, in degrees?
    answer: '50'
    check: '50'
    difficulty: 1
    hints:
    - The two angles are equal.
    - Both are measured from the normal.
    solution: By the law of reflection, the angle of reflection equals the angle of incidence, 50°.
    mistakes:
      '40': c7s11_equal
      '100': c7s11_equal
  - prompt: 'Bouncing back of light from a surface is called:'
    options:
    - Reflection
    - Shadow
    - Absorption
    answer: Reflection
    difficulty: 1
    hints:
    - Mirrors do it well.
    - Light comes back.
    solution: When light bounces off a surface it is reflection.
    mistakes:
      Shadow: c7s11_shadow
      Absorption: c7s11_equal
  - prompt: 'Compared with you, the size of your image in a flat mirror is:'
    options:
    - The same size as you
    - Twice your size
    - Half your size
    answer: The same size as you
    difficulty: 1
    hints:
    - A flat mirror does not magnify.
    - Compare your hand and its image.
    solution: A plane mirror forms an image of the same size as the object.
    mistakes:
      Twice your size: c7s11_image
      Half your size: c7s11_image
  - prompt: Which surface gives the clearest image?
    options:
    - A polished steel plate
    - A rough wooden table
    - A cotton sheet
    answer: A polished steel plate
    difficulty: 1
    hints:
    - Smooth and shiny surfaces reflect neatly.
    - Rough surfaces scatter light.
    solution: A smooth, shiny surface reflects light regularly, giving a clear image.
    mistakes:
      A rough wooden table: c7s11_equal
      A cotton sheet: c7s11_equal
  - prompt: A ray makes an angle of 30° with the mirror surface. What is the angle of incidence (from the normal), in degrees?
    answer: '60'
    check: 90-30
    difficulty: 2
    hints:
    - The normal is at 90° to the mirror.
    - 90 − 30.
    solution: The angle with the normal is 90 − 30 = 60°.
    mistakes:
      '30': c7s11_equal
      '120': c7s11_equal
  - prompt: Rahul is 1.5 m in front of a mirror. How far is he from his image, in metres?
    answer: '3'
    check: 1.5*2
    difficulty: 2
    hints:
    - The image is 1.5 m behind the mirror.
    - Add both distances.
    solution: He is 1.5 m in front and the image is 1.5 m behind, so 1.5 + 1.5 = 3 m apart.
    mistakes:
      '1.5': c7s11_image
      '0.75': c7s11_image
  - prompt: 'You raise your right hand in front of a mirror. Your image raises its:'
    options:
    - Left hand
    - Right hand
    - Both hands
    answer: Left hand
