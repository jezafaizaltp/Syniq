# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 11. Format: content/README.md.
subject: cbse7-sci
chapter: 11
title: 'Light: Shadows and Reflections'
tips:
  c7s_luminous: Luminous objects make their own light; the Moon only reflects sunlight.
  c7s_reflect_angle: The angle of reflection equals the angle of incidence, both measured from the normal.
  t7_ambulance: "Mirrors swap left and right. How would a reversed word look in a driver's mirror?"
  t7_mirror_distance: "The image is as far behind the mirror as you are in front. Add both distances."
  t7_mirror_image: "Raise your right hand in a mirror. Is the image upside down? Which hand rises?"
  t7_normal: "A ray is the light itself and a shadow is where light is blocked. The line standing at 90° to the mirror has a special name."
  t7_opaque_shadow: "A shadow forms where light can't pass. Which kind of object stops light completely?"
  t7_periscope: "A periscope bends the view twice using two flat reflectors."
  t7_pinhole: "Light from the top of the object travels straight through the hole to the bottom of the screen."
  t7_straight_lines: "Light can't bend round corners on its own. What path does it take?"
  t7_translucent: "Transparent lets all light through, opaque none. 'Some' is in between."
concepts:
- code: cbse7s.light.shadow
  title: How light travels and shadows
  notes: |
    Light travels in straight lines (rectilinear propagation): you can't see a candle through a bent pipe. Luminous
    objects give out their own light (Sun, bulb); non-luminous objects are seen by reflected light (Moon, book).
    Transparent materials let almost all light through (glass), translucent some (butter paper), opaque none
    (wood). Opaque objects block light and form shadows on the side away from the source. A pinhole camera forms
    an inverted image because light travels in straight lines.
  explanations:
    text: Light travels in straight lines. When an opaque object blocks it, a dark shadow forms behind the object. That is also why a pinhole camera shows an upside-down picture.
    visual: 'Shine a torch at a ball in front of a wall: the light rays go straight, the ball blocks some, and a round shadow appears on the wall.'
    step_by_step: 'Step 1: Find the light source. Step 2: Draw straight rays from it. Step 3: See which rays an object blocks. Step 4: The shadow forms where rays don''t reach.'
    real_world: A sundial uses the moving shadow of a stick to tell the time.
  picture:
    kind: compare
    columns:
    - title: Transparent
      points:
      - Lets light through
      - Glass, clear water
      - See clearly through it
    - title: Translucent
      points:
      - Lets some light through
      - Butter paper, frosted glass
      - See blurrily
    - title: Opaque
      points:
      - Lets no light through
      - Wood, metal, stone
      - Casts a dark shadow
    alt: 'Transparent, translucent and opaque materials compared: how much light passes and whether a shadow forms.'
  activity:
    type: sort
    prompt: How much light passes through?
    bins:
    - Transparent
    - Translucent
    - Opaque
    items:
    - label: Clear window glass
      bin: Transparent
      clue: Can you see clearly through it?
      why: Almost all light passes.
    - label: Clean water
      bin: Transparent
      clue: See the bottom of a clear pond.
      why: Light passes.
    - label: Cellophane wrapper
      bin: Transparent
      clue: See-through plastic.
      why: Transparent.
    - label: Butter paper
      bin: Translucent
      clue: Light comes through, but you can't see clearly.
      why: Some light passes.
    - label: Frosted glass
      bin: Translucent
      clue: Blurry shapes only.
      why: Translucent.
    - label: Oiled paper
      bin: Translucent
      clue: Hold it up to a lamp.
      why: Some light passes.
    - label: Wooden door
      bin: Opaque
      clue: Does any light get through?
      why: 'No light: it casts a shadow.'
    - label: A book
      bin: Opaque
      clue: Hold it in front of a torch.
      why: Opaque.
    - label: Your hand
      bin: Opaque
      clue: Makes a dark shadow.
      why: Opaque.
  items:
  - prompt: 'Light travels in:'
    options:
    - Straight lines
    - Curves
    - Circles
    - Zigzags
    answer: Straight lines
    difficulty: 1
    hints:
    - Try a bent pipe.
    - Rays.
    solution: Light travels in straight lines.
    mistakes: {"Curves": "t7_straight_lines", "Zigzags": "t7_straight_lines"}
  - prompt: Which object is luminous?
    options:
    - The Sun
    - The Moon
    - A mirror
    - A book
    answer: The Sun
    difficulty: 1
    hints:
    - Gives its own light.
    - The Moon reflects light.
    solution: The Sun makes its own light; the Moon only reflects it.
    mistakes:
      The Moon: c7s_luminous
  - prompt: 'Butter paper lets some light through. It is:'
    options:
    - Translucent
    - Transparent
    - Opaque
    - Luminous
    answer: Translucent
    difficulty: 2
    hints:
    - Some, not all.
    - Blurry view.
    solution: Allowing some light through is translucent.
    mistakes: {"Transparent": "t7_translucent", "Opaque": "t7_translucent"}
  - prompt: 'A shadow forms when light is blocked by:'
    options:
    - An opaque object
    - A transparent object
    - Air
    - Clear glass
    answer: An opaque object
    difficulty: 1
    hints:
    - No light passes.
    - Wood, metal.
    solution: Opaque objects block light and make shadows.
    mistakes: {"A transparent object": "t7_opaque_shadow", "Clear glass": "t7_opaque_shadow"}
  - prompt: 'The image in a pinhole camera is:'
    options:
    - Upside down
    - Upright and bigger
    - Coloured differently
    - Not formed
    answer: Upside down
    difficulty: 2
    hints:
    - Rays cross at the pinhole.
    - Straight lines.
    solution: Rays cross at the pinhole, so the image is inverted.
    mistakes: {"Upright and bigger": "t7_pinhole", "Not formed": "t7_pinhole"}
  - prompt: Why can't you see a candle flame through a bent pipe?
    options:
    - Light travels in straight lines
    - The pipe absorbs heat
    - Candles are too dim
    - Pipes are luminous
    answer: Light travels in straight lines
    difficulty: 1
    hints:
    - Light can't bend round the corner.
    - Straight rays.
    solution: Light cannot follow the bend.
    mistakes: {"The pipe absorbs heat": "t7_straight_lines", "Candles are too dim": "t7_straight_lines"}
- code: cbse7s.light.reflect
  title: Reflection and mirrors
  after:
  - cbse7s.light.shadow
  notes: |
    Reflection is light bouncing off a surface; smooth shiny surfaces like mirrors reflect regularly. Laws: the
    angle of incidence equals the angle of reflection, and both rays and the normal lie in one plane. A plane
    mirror forms an image that is upright, the same size, as far behind the mirror as the object is in front, and
    laterally inverted (left and right swapped). That is why AMBULANCE is written in mirror letters on vehicles. A
    periscope uses two mirrors to see over obstacles.
  explanations:
    text: 'A mirror bounces light back at the same angle it arrived. In a plane mirror your image is the same size and upright, but left and right are swapped: raise your right hand and your image raises its left.'
    visual: Draw a mirror as a line, a dotted normal at right angles, an incoming ray at 30° to the normal, and the reflected ray leaving at 30° on the other side.
    step_by_step: 'Step 1: Draw the normal (a line at 90° to the mirror). Step 2: Measure the angle of incidence from the normal. Step 3: The angle of reflection is equal. Step 4: For a plane mirror image: same size, upright, same distance behind, left-right swapped.'
    real_world: The word AMBULANCE is printed reversed on the front of ambulances so drivers ahead read it correctly in their mirrors.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 8
      O:
      - 5
      - 2
      B:
      - 9
      - 8
      _N:
      - 5
      - 9
      M1:
      - 1
      - 2
      M2:
      - 9
      - 2
    segments:
    - - M1
      - M2
      - mirror
    - - A
      - O
    - - O
      - B
    - - O
      - _N
    angles:
    - at: O
      from: A
      to: _N
      label: i
    - at: O
      from: _N
      to: B
      label: r
    caption: The angle of incidence i equals the angle of reflection r, both measured from the normal.
    alt: A ray from A hits a mirror at O and reflects to B; the angle of incidence i and angle of reflection r on either side of the dotted normal are equal.
  activity:
    type: sort
    prompt: In a plane mirror, what stays the same and what changes?
    bins:
    - Stays the same
    - Gets swapped or changed
    items:
    - label: The size of your image
      bin: Stays the same
      clue: Is your face bigger in the mirror?
      why: Same size.
    - label: Image upright, not upside down
      bin: Stays the same
      clue: Is your head at the top?
      why: Upright.
    - label: How far the image seems behind the mirror
      bin: Stays the same
      clue: Compare it with how far you stand in front.
      why: Same distance behind.
    - label: The colours of your clothes
      bin: Stays the same
      clue: Does a red shirt look blue?
      why: Colours stay.
    - label: Your right hand looks like a left hand
      bin: Gets swapped or changed
      clue: Raise your right hand.
      why: Left and right swap.
    - label: Writing appears backwards
      bin: Gets swapped or changed
      clue: Why is AMBULANCE written backwards on vans?
      why: Lateral inversion.
    - label: A clock's hands seem to turn the other way
      bin: Gets swapped or changed
      clue: Watch a clock in a mirror.
      why: Left-right swap.
  items:
  - prompt: A ray hits a mirror with an angle of incidence of 30°. What is the angle of reflection, in degrees?
    answer: '30'
    check: '30'
    difficulty: 1
    hints:
    - They are equal.
    - Law of reflection.
    solution: Angle of reflection = angle of incidence = 30°.
    mistakes:
      '60': c7s_reflect_angle
  - prompt: 'Your image in a plane mirror is:'
    options:
    - Upright, same size, left-right swapped
    - Upside down and smaller
    - Bigger and upright
    - Upside down and bigger
    answer: Upright, same size, left-right swapped
    difficulty: 1
    hints:
    - Look in a mirror.
    - Lateral inversion.
    solution: A plane mirror image is upright, same size and laterally inverted.
    mistakes: {"Upside down and smaller": "t7_mirror_image", "Bigger and upright": "t7_mirror_image"}
  - prompt: You stand 2 m in front of a plane mirror. How far is your image from you, in metres?
    answer: '4'
    check: 2 + 2
    difficulty: 2
    hints:
    - The image is 2 m behind the mirror.
    - 2 + 2.
    solution: 2 m in front + 2 m behind = 4 m.
    mistakes: {"2": "t7_mirror_distance", "1": "t7_mirror_distance"}
  - prompt: Why is AMBULANCE written in mirror letters on the vehicle?
    options:
    - Drivers ahead read it correctly in their mirrors
    - For decoration
    - Because of a printing error
    - To hide the word
    answer: Drivers ahead read it correctly in their mirrors
    difficulty: 1
    hints:
    - Mirrors swap left and right.
    - Rear-view mirrors.
    solution: Lateral inversion in the mirror turns it the right way round.
    mistakes: {"For decoration": "t7_ambulance", "Because of a printing error": "t7_ambulance"}
  - prompt: 'A periscope uses:'
    options:
    - Two plane mirrors
    - One lens
    - A prism and a lens
    - No mirrors
    answer: Two plane mirrors
    difficulty: 2
    hints:
    - Used in submarines.
    - Light reflects twice.
    solution: Two mirrors at 45° let you see over obstacles.
    mistakes: {"One lens": "t7_periscope", "No mirrors": "t7_periscope"}
  - prompt: 'The line drawn at 90° to a mirror at the point where light hits it is the:'
    options:
    - Normal
    - Ray
    - Image
    - Shadow
    answer: Normal
    difficulty: 2
    hints:
    - Angles are measured from it.
    - Perpendicular.
    solution: That line is the normal.
    mistakes: {"Ray": "t7_normal", "Shadow": "t7_normal"}
