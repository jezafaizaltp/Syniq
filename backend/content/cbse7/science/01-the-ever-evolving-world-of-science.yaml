# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 1. Format: content/README.md.
subject: cbse7-sci
chapter: 1
title: The Ever-Evolving World of Science
tips:
  c7s_read_again: 'Go back to the chapter: match each scientist with what they studied.'
  c7s_fair_test: In a fair test change only one thing, so you know what caused the result.
  t7_charaka: "Charaka wrote about medicine and Sushruta about surgery, in ancient India."
  t7_evidence: "Evidence comes from careful observation or measurement, not from what people say."
  t7_evidence_wins: "Science follows evidence. When strong new evidence disagrees, what changes: the evidence or the idea?"
  t7_keep_same: "He is testing sunlight. Everything else, like water, must be kept the same."
  t7_prediction: "A prediction comes BEFORE the test: what you think will happen."
  t7_qualitative: "Quantitative observations have numbers. Does 'turned pink' have a number?"
  t7_share_check: "Why does it help if other scientists can repeat your experiment?"
  t7_telescope: "Jupiter's moons are far away in the sky. Which instrument makes far things look near?"
  t7_testable: "A testable question can be answered by measuring. Can you measure 'nicest' or 'best'?"
  c7s1_evidence: 'Science trusts evidence: careful observations and measurements that others can check. Opinions and guesses are not evidence.'
  c7s1_change: Scientific ideas are the best explanation so far. When strong new evidence disagrees, the idea is changed, even an old famous one.
  c7s1_who: 'Match the person to their field: think about what each one is remembered for.'
  c7s1_one_thing: A fair test changes only the one thing you are testing and keeps everything else the same.
  c7s1_kind: Ask yourself whether it is described in words (colour, smell, feel) or measured as a number with a unit. Those are the two kinds of observation.
  c7s1_testable: A testable question can be answered by an experiment or by measuring something. Questions about likes, beauty or 'should' cannot.
concepts:
- code: cbse7s.sci.evolving
  title: How scientific ideas change
  notes: |
    Science is a way of finding out, not a fixed list of facts. Ideas change when new evidence appears: people
    once thought the Sun went round the Earth; careful observation (Aryabhata in India, later Copernicus and
    Galileo) showed the Earth spins and goes round the Sun. Scientists observe, ask questions, test ideas with
    experiments and share results so others can check. India has a long scientific tradition: Charaka and
    Sushruta in medicine, Aryabhata and Brahmagupta in astronomy and mathematics.
  explanations:
    text: Science keeps improving. When new evidence turns up, scientists change their ideas. Long ago people thought the Sun moved round the Earth; careful observations showed it is the Earth that spins and travels round the Sun.
    visual: 'Picture a timeline: an early drawing with the Earth in the middle; Aryabhata writing that the Earth turns; a telescope pointed at Jupiter''s moons; today''s photos of Earth from space.'
    step_by_step: 'Step 1: Observe something. Step 2: Ask a question. Step 3: Suggest an explanation. Step 4: Test it. Step 5: Share results so others can check. Step 6: Change the idea if the evidence says so.'
    real_world: Doctors once did not know germs cause disease; once microscopes revealed microbes, handwashing and vaccines followed and saved millions of lives.
  picture:
    kind: flow
    steps:
    - Observe
    - Ask a question
    - Suggest an explanation
    - Test it
    - Share and check results
    - Keep or change the idea
    alt: 'The cycle of science: observe, question, explain, test, share, and keep or change the idea.'
  activity:
    type: order
    prompt: How did ideas about the Earth and Sun change? Put them in time order.
    steps:
    - Long ago, most people thought the Sun went round the Earth
    - 'Aryabhata, 1500 years ago: the Earth spins on its axis'
    - 'Copernicus, 500 years ago: the Earth goes round the Sun'
    - Galileo's telescope shows moons going round Jupiter
    - Spacecraft photograph the Earth from space
    reasons:
      'Aryabhata, 1500 years ago: the Earth spins on its axis': 'This came after the old idea: Aryabhata questioned it.'
      'Copernicus, 500 years ago: the Earth goes round the Sun': Copernicus lived about a thousand years after Aryabhata.
      Galileo's telescope shows moons going round Jupiter: Galileo's telescope came after Copernicus and backed his idea.
      Spacecraft photograph the Earth from space: Only possible in the last 70 years or so.
  lesson:
    - teach: Science is a way of finding out, not just a list of facts. Scientists observe, ask questions, test ideas, and share what they find so others can check it.
      picture:
        kind: flow
        steps:
        - Observe
        - Ask a question
        - Test with an experiment
        - Share results
        - Others check and repeat
        alt: The cycle of finding out in science.
      check:
        prompt: Why do scientists share their results?
        options:
        - So others can check and repeat the work
        - So nobody else needs to test it
        - To keep the idea fixed forever
        answer: So others can check and repeat the work
        why: Checking by others makes knowledge stronger.
    - teach: Ideas change when new evidence appears. People once thought the Sun went round the Earth. Aryabhata wrote that the Earth spins; later Copernicus and Galileo showed it goes round the Sun. Galileo's telescope showed moons going round Jupiter, so not everything circles the Earth.
      picture:
        kind: compare
        columns:
        - title: Old idea
          points:
          - Sun goes round the Earth
          - Earth stays still
        - title: New idea
          points:
          - Earth goes round the Sun
          - Earth spins on its axis
        alt: How the idea of the Earth and the Sun changed with evidence.
      check:
        prompt: What made scientists change the idea that everything goes round the Earth?
        options:
        - New evidence from careful observation
        - A vote by people
        - An old book
        answer: New evidence from careful observation
        why: Science changes its ideas when evidence demands it.
    - teach: 'India has a long science tradition: Charaka and Sushruta in medicine and surgery, Aryabhata and Brahmagupta in astronomy and mathematics. Today, ISRO scientists use the same method: test, measure, share.'
      check:
        prompt: 'Sushruta is remembered for work in:'
        options:
        - Surgery
        - Astronomy
        - Music
        answer: Surgery
        why: He described many surgical methods and tools.
  items:
  - prompt: What happens to a scientific idea when strong new evidence goes against it?
    options:
    - It is changed or replaced
    - It is kept anyway
    - The evidence is hidden
    - Science stops
    answer: It is changed or replaced
    difficulty: 1
    hints:
    - Science follows evidence.
    - Ideas can improve.
    solution: Scientific ideas are revised when evidence shows they are wrong.
    mistakes: {"It is kept anyway": "t7_evidence_wins", "The evidence is hidden": "t7_evidence_wins"}
  - prompt: Which ancient Indian scientist wrote that the Earth rotates on its axis?
    options:
    - Aryabhata
    - Charaka
    - Kalidasa
    - Panini
    answer: Aryabhata
    difficulty: 1
    hints:
    - An astronomer and mathematician.
    - India's first satellite was named after him.
    solution: Aryabhata (5th century CE) proposed that the Earth rotates.
    mistakes:
      Charaka: c7s_read_again
  - prompt: 'Charaka and Sushruta are famous for their work in:'
    options:
    - Medicine and surgery
    - Astronomy
    - Music
    - Architecture
    answer: Medicine and surgery
    difficulty: 1
    hints:
    - Charaka Samhita, Sushruta Samhita.
    - Healing.
    solution: They wrote early texts on medicine (Charaka) and surgery (Sushruta).
    mistakes: {"Astronomy": "t7_charaka", "Architecture": "t7_charaka"}
  - prompt: Why do scientists share their results?
    options:
    - So others can check and repeat them
    - To become famous
    - To stop others working
    - Because it is a rule of school
    answer: So others can check and repeat them
    difficulty: 2
    hints:
    - Science must be checkable.
    - Others try the same test.
    solution: Sharing lets others test the results, which builds trust in them.
    mistakes: {"To become famous": "t7_share_check", "To stop others working": "t7_share_check"}
  - prompt: Which is the best example of evidence?
    options:
    - Measurements from a careful experiment
    - A rumour
    - A guess
    - An old saying
    answer: Measurements from a careful experiment
    difficulty: 1
    hints:
    - Evidence can be checked.
    - Data.
    solution: Careful measurements can be checked; rumours and guesses cannot.
    mistakes: {"A rumour": "t7_evidence", "An old saying": "t7_evidence"}
  - prompt: Which tool changed ideas about the sky by showing Jupiter's moons?
    options:
    - The telescope
    - The microscope
    - The thermometer
    - The compass
    answer: The telescope
    difficulty: 2
    hints:
    - Galileo used it.
    - It looks far away.
    solution: Galileo's telescope showed moons going round Jupiter, so not everything goes round the Earth.
    mistakes: {"The microscope": "t7_telescope", "The compass": "t7_telescope"}
  - prompt: Which is the best evidence that a medicine works?
    options:
    - Results from careful tests on many patients
    - A famous person says it works
    - It has a nice colour
    answer: Results from careful tests on many patients
    difficulty: 1
    hints:
    - Evidence comes from observation or measurement.
    - Which one could others check?
    solution: Careful tests on many people give measurements others can check; opinions and looks are not evidence.
    mistakes:
      A famous person says it works: c7s1_evidence
      It has a nice colour: c7s1_evidence
  - prompt: 'Aryabhata is known for work in:'
    options:
    - Astronomy and mathematics
    - Surgery
    - Farming tools
    answer: Astronomy and mathematics
    difficulty: 1
    hints:
    - He wrote about the Earth spinning.
    - He also worked with numbers.
    solution: Aryabhata wrote about astronomy (the Earth's rotation) and mathematics.
    mistakes:
      Surgery: c7s1_who
      Farming tools: c7s1_who
  - prompt: Is science a fixed list of facts that never changes?
    options:
    - No, it changes as new evidence is found
    - Yes, once written it never changes
    - Yes, only teachers can change it
    answer: No, it changes as new evidence is found
    difficulty: 1
    hints:
    - Think about the Sun and Earth idea.
    - Did it ever change?
    solution: Science updates its ideas when better evidence appears, as with the Earth going round the Sun.
    mistakes:
      Yes, once written it never changes: c7s1_change
      Yes, only teachers can change it: c7s1_change
  - prompt: Galileo saw moons going round Jupiter. Why was this important?
    options:
    - It showed not everything goes round the Earth
    - It proved the Moon is made of cheese
    - It showed Jupiter is the Sun
    answer: It showed not everything goes round the Earth
    difficulty: 2
    hints:
    - What did people believe everything circled?
    - Jupiter's moons circle Jupiter.
    solution: Moons circling Jupiter were evidence against the old idea that everything goes round the Earth.
    mistakes:
      It proved the Moon is made of cheese: c7s1_evidence
      It showed Jupiter is the Sun: c7s1_evidence
  - prompt: A scientist's idea fails when other scientists repeat her experiment. What should happen?
    options:
    - The idea is checked again and changed if needed
    - The idea is kept because she is famous
    - The other scientists stop working
    answer: The idea is checked again and changed if needed
    difficulty: 2
    hints:
    - What matters more in science, people or evidence?
    - Repeat results are evidence.
    solution: If repeated experiments disagree, the idea must be re-examined and changed; fame does not decide.
    mistakes:
      The idea is kept because she is famous: c7s1_change
      The other scientists stop working: c7s1_change
  - prompt: Which tool helped scientists see far-away objects in the sky clearly?
    options:
    - The telescope
    - The microscope
    - The thermometer
    answer: The telescope
    difficulty: 2
    hints:
    - Which tool makes distant things look closer?
    - Galileo pointed it at the sky.
    solution: A telescope gathers light from distant objects, so planets and moons could be studied.
    mistakes:
      The microscope: c7s1_who
      The thermometer: c7s1_who
  - prompt: Which statement is a scientific observation?
    options:
    - The water boiled after 5 minutes
    - Water is the most beautiful liquid
    - Everyone should drink more water
    answer: The water boiled after 5 minutes
    difficulty: 2
    hints:
    - An observation is something you notice or measure.
    - Which one could anyone check?
    solution: Boiling after 5 minutes can be seen and timed by anyone; the others are opinions.
    mistakes:
      Water is the most beautiful liquid: c7s1_evidence
      Everyone should drink more water: c7s1_evidence
  - prompt: Why do scientists keep careful records of their experiments?
    options:
    - So others can repeat them and check the results
    - So nobody else can do them
    - Because records are pretty
    answer: So others can repeat them and check the results
    difficulty: 2
    hints:
    - Think about checking.
    - Could someone repeat it without the record?
    solution: Clear records let others repeat the experiment exactly and see if they get the same results.
    mistakes:
      So nobody else can do them: c7s1_evidence
      Because records are pretty: c7s1_evidence
  - prompt: Two students get different results in the same experiment. What is the best next step?
    options:
    - Repeat the experiment carefully and compare
    - Pick the result they like
    - Stop and give up
    answer: Repeat the experiment carefully and compare
    difficulty: 3
    hints:
    - How do scientists find out which result is right?
    - More careful evidence helps.
    solution: Repeating carefully shows which result is reliable and may reveal a mistake.
    mistakes:
      Pick the result they like: c7s1_evidence
      Stop and give up: c7s1_change
  - prompt: Why might a scientific idea that is accepted today change in the future?
    options:
    - Better tools may give new evidence
    - Scientists change ideas for fun
    - Old ideas are always wrong
    answer: Better tools may give new evidence
    difficulty: 3
    hints:
    - The telescope changed ideas once.
    - What could new tools do?
    solution: New tools and observations can reveal evidence that an idea cannot explain, so the idea is improved.
    mistakes:
      Scientists change ideas for fun: c7s1_change
      Old ideas are always wrong: c7s1_change
  - prompt: Which shows the way of science best?
    options:
    - Testing an idea and accepting the result even if it is surprising
    - Believing an idea because it is old
    - Hiding results that disagree
    answer: Testing an idea and accepting the result even if it is surprising
    difficulty: 3
    hints:
    - Science follows evidence.
    - What should happen to surprising results?
    solution: Science tests ideas honestly and follows the evidence, even when it surprises us.
    mistakes:
      Believing an idea because it is old: c7s1_change
      Hiding results that disagree: c7s1_evidence
- code: cbse7s.sci.questions
  title: Asking questions and testing ideas
  after:
  - cbse7s.sci.evolving
  notes: |
    A good scientific question can be tested: 'Does salt water freeze more slowly than tap water?' A prediction
    says what you expect. A fair test changes only one thing (the variable you test), keeps everything else the
    same, and measures the result. Repeating the test makes results more reliable. Observations can be
    qualitative (colour, smell) or quantitative (measured numbers). Conclusions must come from the evidence.
  explanations:
    text: A scientific question is one you can test. To test fairly, change just one thing, keep everything else the same, and measure what happens. Repeat it to be sure.
    visual: 'Picture two identical cups of water in a freezer, one with a spoon of salt. Same cup, same amount, same place, same time: only the salt is different.'
    step_by_step: 'Step 1: Ask a testable question. Step 2: Make a prediction. Step 3: Decide the one thing you will change. Step 4: Keep the rest the same. Step 5: Measure, repeat and conclude.'
    real_world: Testing which brand of battery lasts longest is only fair if each runs the same toy in the same way.
  picture:
    kind: compare
    columns:
    - title: Change
      points:
      - 'Only one thing: e.g. salt or no salt'
    - title: Keep the same
      points:
      - Amount of water
      - Type of cup
      - Place and time
    - title: Measure
      points:
      - Time taken to freeze
    alt: 'A fair test: change one thing, keep everything else the same, and measure the result.'
  activity:
    type: sort
    prompt: Can you answer this question with a test?
    bins:
    - Can be tested
    - Can't be tested
    items:
    - label: Does salt dissolve faster in hot water?
      bin: Can be tested
      clue: Could you try it and measure?
      why: Time it in hot and cold water.
    - label: Do plants grow taller with more light?
      bin: Can be tested
      clue: Could you measure the plants?
      why: Grow some in light, some in shade; measure.
    - label: Does a heavier ball roll further?
      bin: Can be tested
      clue: Could you roll balls and measure the distance?
      why: Yes, with a fair test.
    - label: Does a bigger magnet pick up more pins?
      bin: Can be tested
      clue: Could you count the pins?
      why: Count pins for each magnet.
    - label: Which colour is the prettiest?
      bin: Can't be tested
      clue: Is there anything to measure?
      why: It's a matter of opinion.
    - label: Is cricket better than football?
      bin: Can't be tested
      clue: What would you measure?
      why: Opinion, not testable.
    - label: Which song is the best?
      bin: Can't be tested
      clue: Would everyone agree on a measurement?
      why: A matter of taste.
    - label: Should everyone like mangoes?
      bin: Can't be tested
      clue: Is this about facts or feelings?
      why: Opinion.
  lesson:
    - teach: 'A scientific question can be tested by an experiment or measurement: ''Do seeds sprout faster in warm water?'' A question like ''Which flower is prettiest?'' cannot be tested. Before testing, make a prediction: what you expect to happen.'
      check:
        prompt: Which question can be tested?
        options:
        - Does a ball bounce higher on a hard floor than on grass?
        - Is cricket the best game?
        - Should everyone like mangoes?
        answer: Does a ball bounce higher on a hard floor than on grass?
        why: You can measure bounce heights.
    - teach: In a fair test, change only one thing (the variable you are testing), keep everything else the same, and measure the result. To test if sunlight helps plants grow, give both plants the same pot, soil and water; only the light is different.
      picture:
        kind: compare
        columns:
        - title: Change
          points:
          - sunlight or no sunlight
        - title: Keep the same
          points:
          - pot size
          - soil
          - water
          - type of plant
        - title: Measure
          points:
          - plant height after 2 weeks
        alt: A fair test plan for sunlight and plant growth.
      check:
        prompt: Meera tests whether salt changes how fast water boils. What should she change?
        options:
        - Only the amount of salt
        - The salt and the flame
        - The pot and the water
        answer: Only the amount of salt
        why: Change one thing so you know what caused the result.
    - teach: 'Observations can be qualitative (describing: ''it turned blue'', ''it smells sour'') or quantitative (measured numbers: ''25 °C'', ''12 cm''). Repeating a test makes results more reliable. The conclusion must come from the evidence, not from what you hoped.'
      check:
        prompt: '''The plant grew 6 cm'' is what kind of observation?'
        options:
        - Quantitative
        - Qualitative
        answer: Quantitative
        why: It is a measured number.
  items:
  - prompt: Which is a testable scientific question?
    options:
    - Does salt water freeze more slowly than tap water?
    - Is blue the nicest colour?
    - Are cats better than dogs?
    - Which song is best?
    answer: Does salt water freeze more slowly than tap water?
    difficulty: 1
    hints:
    - Can you measure it?
    - Others are opinions.
    solution: Freezing time can be measured; the rest are opinions.
    mistakes: {"Is blue the nicest colour?": "t7_testable", "Which song is best?": "t7_testable"}
  - prompt: In a fair test, how many things should you change?
    options:
    - One
    - Two
    - All of them
    - None
    answer: One
    difficulty: 1
    hints:
    - Otherwise you can't tell what caused the change.
    - Only the variable you test.
    solution: Change only one thing at a time.
    mistakes:
      Two: c7s_fair_test
  - prompt: Why repeat an experiment?
    options:
    - To make the results more reliable
    - To use more materials
    - To get a different answer
    - Because the first was wrong
    answer: To make the results more reliable
    difficulty: 1
    hints:
    - One result could be a fluke.
    - Repeats should agree.
    solution: Repeating checks that results are consistent.
    mistakes: {"To get a different answer": "t8_repeat", "Because the first was wrong": "t8_repeat"}
  - prompt: '''The liquid turned pink'' is what kind of observation?'
    options:
    - Qualitative
    - Quantitative
    - A prediction
    - A conclusion
    answer: Qualitative
    difficulty: 2
    hints:
    - No number is measured.
    - It describes a quality.
    solution: Describing colour is qualitative; measured numbers are quantitative.
    mistakes: {"Quantitative": "t7_qualitative", "A conclusion": "t7_qualitative"}
  - prompt: Ravi tests if plants grow faster in sunlight. Which must he keep the same?
    options:
    - The amount of water each plant gets
    - The amount of sunlight
    - Whether the plants are in sun or shade
    - Nothing
    answer: The amount of water each plant gets
    difficulty: 2
    hints:
    - Sunlight is what he is testing.
    - Everything else stays the same.
    solution: Water, soil and pot size stay the same; only sunlight changes.
    mistakes: {"The amount of sunlight": "t7_keep_same", "Nothing": "t7_keep_same"}
  - prompt: What is a prediction?
    options:
    - What you expect to happen, before testing
    - The final result
    - A measurement
    - A list of materials
    answer: What you expect to happen, before testing
    difficulty: 1
    hints:
    - It comes before the test.
    - A guess based on ideas.
    solution: A prediction says what you think will happen before you test it.
    mistakes: {"The final result": "t7_prediction", "A measurement": "t7_prediction"}
  - prompt: Which of these could you answer with an experiment?
    options:
    - Does sugar dissolve faster in hot water than cold water?
    - Is blue the nicest colour?
    - Should homework be banned?
    answer: Does sugar dissolve faster in hot water than cold water?
    difficulty: 1
    hints:
    - Which one can be timed or measured?
    - Opinions cannot be tested.
    solution: Dissolving time can be measured in hot and cold water; the others are opinions.
    mistakes:
      Is blue the nicest colour?: c7s1_testable
      Should homework be banned?: c7s1_testable
  - prompt: '''The solution smells like vinegar'' is what kind of observation?'
    options:
    - Qualitative
    - Quantitative
    - A prediction
    answer: Qualitative
    difficulty: 1
    hints:
    - Is there a number?
    - Smell is described, not measured.
    solution: A smell is described in words, not measured as a number, so it is qualitative.
    mistakes:
      Quantitative: c7s1_kind
      A prediction: c7s1_kind
  - prompt: '''The temperature rose to 40 °C'' is what kind of observation?'
    options:
    - Quantitative
    - Qualitative
    - An opinion
    answer: Quantitative
    difficulty: 1
    hints:
    - Look for a number and a unit.
    - 40 °C was measured.
    solution: It gives a measured number with a unit, so it is quantitative.
    mistakes:
      Qualitative: c7s1_kind
      An opinion: c7s1_kind
  - prompt: 'Before an experiment, Arjun writes ''I think the heavier ball will fall faster.'' This is:'
    options:
    - A prediction
    - A conclusion
    - A result
    answer: A prediction
    difficulty: 1
    hints:
    - It is written before testing.
    - It says what he expects.
    solution: Saying what you expect before testing is a prediction; conclusions come after the evidence.
    mistakes:
      A conclusion: c7s1_testable
      A result: c7s1_testable
  - prompt: Ali tests which paper towel soaks up the most water. What must he keep the same?
    options:
    - The amount of water and the size of each towel
    - The brand of towel
    - Nothing
    answer: The amount of water and the size of each towel
    difficulty: 2
    hints:
    - He is changing the towel brand.
    - What else could affect how much is soaked?
    solution: Only the towel brand should change; same water amount and towel size make it a fair test.
    mistakes:
      The brand of towel: c7s1_one_thing
      Nothing: c7s1_one_thing
  - prompt: Why is testing on just one plant not enough?
    options:
    - One plant might be unusual; repeating makes results reliable
    - Plants cannot be tested
    - One plant is always enough
    answer: One plant might be unusual; repeating makes results reliable
    difficulty: 2
    hints:
    - What if that one plant was sick?
    - More tries give stronger evidence.
    solution: A single plant might be unusual, so testing several plants and repeating makes the results reliable.
    mistakes:
      Plants cannot be tested: c7s1_evidence
      One plant is always enough: c7s1_evidence
  - prompt: Riya changes both the soil AND the amount of water for two plants. Why is this not a fair test?
    options:
    - She cannot tell which change caused the difference
    - Plants do not need water
    - Soil does not matter
    answer: She cannot tell which change caused the difference
    difficulty: 2
    hints:
    - How many things did she change?
    - Which one made the difference?
    solution: Two things changed, so any difference could be due to either one; a fair test changes one thing.
    mistakes:
      Plants do not need water: c7s1_one_thing
      Soil does not matter: c7s1_one_thing
  - prompt: Sam predicted ice melts faster in salt water. The test showed it melted faster in tap water. What should Sam conclude?
    options:
    - Ice melted faster in tap water in this test
    - His prediction was right anyway
    - The test must be ignored
    answer: Ice melted faster in tap water in this test
    difficulty: 2
    hints:
    - A conclusion comes from the evidence.
    - What did the test show?
    solution: The conclusion must follow the evidence, even when it disagrees with the prediction.
    mistakes:
      His prediction was right anyway: c7s1_change
      The test must be ignored: c7s1_evidence
  - prompt: Which plan is a fair test of whether light affects how fast bread gets mouldy?
    options:
    - Two same slices, same place and dampness, one in light and one in dark
    - One slice in a warm dark cupboard, one in a cold bright fridge
    - Two different breads in two different houses
    answer: Two same slices, same place and dampness, one in light and one in dark
    difficulty: 3
    hints:
    - Only light should change.
    - Look for the plan that keeps everything else equal.
    solution: Only the light differs in the first plan; the others change warmth or bread type too.
    mistakes:
      One slice in a warm dark cupboard, one in a cold bright fridge: c7s1_one_thing
      Two different breads in two different houses: c7s1_one_thing
  - prompt: Three tests gave times of 30 s, 31 s and 58 s. What is sensible to do?
    options:
    - Check the 58 s test for a mistake and repeat it
