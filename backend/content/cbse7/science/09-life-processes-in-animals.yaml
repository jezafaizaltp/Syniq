# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 9. Format: content/README.md.
subject: cbse7-sci
chapter: 9
title: Life Processes in Animals
tips:
  c7s_digest_order: "The stomach churns food with acid, but digestion is not finished there. Absorption happens in the long, folded tube after it."
  c7s_artery_vein: "Veins bring blood back to the heart. A memory trick: A for the vessels going Away."
  t7_amoeba: "Amoeba has no mouth or limbs. It pushes out parts of its body to wrap food."
  t7_breathe_out: "Cells use oxygen and make a waste gas. Which gas do we breathe out more of?"
  t7_fish_gills: "Fish take oxygen from water using feathery organs on their sides."
  t7_kidney: "Which organ makes urine by cleaning the blood?"
  t7_large_intestine: "Most food is absorbed earlier. The large intestine takes back something the body needs a lot of."
  t7_pulse_minute: "A minute has 4 lots of 15 seconds. Multiply the beats by 4."
  t7_ruminant: "Animals that bring food back to chew again (the cud) are called…?"
  t7_spiracles: "Insects have tiny holes along their sides for air."
  t7_starch_mouth: "Saliva has an enzyme that starts breaking down starch. Where is saliva?"
  t7_stomach_acid: "The stomach makes a strong acid with chlorine in its name."
  c7s9_path: Picture the food's journey in order, from the mouth to where waste leaves the body. Ask which stop comes next and what each one does.
  c7s9_jobs: 'Each part of the gut has one main job: chewing and starting starch, churning with acid, finishing digestion and taking food into blood, or taking back water.'
  c7s9_ways: 'Different animals get food in different ways: sucking, chewing, swallowing whole, catching prey, or wrapping around it with flowing parts of the body.'
  c7s9_gas_swap: Breathing takes in one gas the body needs and sends out the waste gas made when cells release energy.
  c7s9_organs: Match the animal to where it lives and what its body has. A water animal, a land animal with lungs, an insect and a soft worm each take in oxygen in a different way.
  c7s9_minute: A minute is 60 seconds. Work out how many of your counting periods fit into one minute, then multiply.
  c7s9_pump: Think of the muscle in your chest that you can feel beating, and what it pushes round your body.
  c7s9_vessels: Each kind of blood vessel carries blood one way. Recall which kind leads out from the heart and which leads back to it.
  c7s9_filter: Wastes are cleaned from the blood by a pair of bean-shaped organs, which make a liquid that is stored and passed out.
concepts:
- code: cbse7s.animal.digest
  title: Nutrition and digestion in animals
  notes: |
    Animals take in food in different ways (sucking nectar, chewing, swallowing whole, capturing prey). Human
    digestive system: mouth (teeth chew, saliva starts breaking starch) → food pipe (oesophagus) → stomach
    (acid and digestive juices; churning) → small intestine (digestion completes; juices from liver (bile) and
    pancreas; villi absorb digested food into blood) → large intestine (absorbs water) → waste leaves through the
    anus. Ruminants (cows) chew the cud: food goes to the rumen, returns to the mouth for chewing. Amoeba takes in
    food with false feet (pseudopodia).
  explanations:
    text: Digestion breaks food into tiny pieces the body can absorb. It starts in the mouth, continues in the stomach with acid, and finishes in the small intestine, where nutrients pass into the blood. The large intestine takes back water.
    visual: 'Trace a piece of roti: chewed in the mouth, down the food pipe, churned in the stomach, broken down and absorbed in the long coiled small intestine, water taken back in the large intestine.'
    step_by_step: 'Step 1: Mouth: teeth and saliva. Step 2: Food pipe. Step 3: Stomach: acid and churning. Step 4: Small intestine: digestion finishes, absorption. Step 5: Large intestine: water absorbed. Step 6: Waste removed.'
    real_world: 'Cows are seen chewing even when not eating: they bring food back from the rumen to chew it again (chewing the cud).'
  picture:
    kind: flow
    steps:
    - 'Mouth: chewing, saliva'
    - Food pipe
    - 'Stomach: acid, churning'
    - 'Small intestine: digestion and absorption'
    - 'Large intestine: water absorbed'
    alt: The path of food through the human digestive system, from mouth to large intestine.
  activity:
    type: order
    prompt: Follow food through the digestive system.
    steps:
    - Mouth
    - Food pipe (oesophagus)
    - Stomach
    - Small intestine
    - Large intestine
    - Anus
    reasons:
      Food pipe (oesophagus): Food is chewed and swallowed before it goes down the food pipe.
      Stomach: The food pipe carries food down to the stomach.
      Small intestine: Food leaves the stomach for the small intestine, where nutrients are absorbed.
      Large intestine: What isn't absorbed moves on; water is taken back here.
      Anus: Undigested waste leaves last.
  lesson:
    - teach: 'Animals take in food in different ways. Butterflies suck nectar, cows chew grass, snakes swallow prey whole, and Amoeba, a one-celled animal, wraps its food with false feet (pseudopodia). All animals must break food into simple substances their bodies can use: digestion.'
      check:
        prompt: How does Amoeba take in food?
        options:
        - With false feet (pseudopodia)
        - With teeth
        - By sucking with a tube
        answer: With false feet (pseudopodia)
        why: It flows around food and engulfs it.
    - teach: 'In humans, food goes on a journey. Mouth: teeth chew it and saliva starts breaking down starch. Food pipe (oesophagus): carries it down. Stomach: churns it with hydrochloric acid and digestive juices. Small intestine: finishes digestion with bile from the liver and juice from the pancreas; tiny finger-like villi absorb food into the blood. Large intestine: absorbs water. Waste leaves through the anus.'
      picture:
        kind: flow
        steps:
        - Mouth (chewing, saliva)
        - Food pipe
        - Stomach (acid, churning)
        - Small intestine (digestion ends, absorption)
        - Large intestine (water absorbed)
        - Anus (waste out)
        alt: The path of food through the human digestive system.
      check:
        prompt: Where is most digested food absorbed into the blood?
        options:
        - Small intestine
        - Stomach
        - Food pipe
        answer: Small intestine
        why: Its villi absorb digested food.
    - teach: 'Cows, goats and buffaloes are ruminants. They swallow grass quickly into a part of the stomach called the rumen, then bring it back to the mouth to chew slowly: chewing the cud. This helps them digest tough grass.'
      check:
        prompt: Why do cows chew the cud?
        options:
        - To chew tough grass again and digest it better
        - Because they have no stomach
        - To clean their teeth
        answer: To chew tough grass again and digest it better
        why: Grass is hard to digest; re-chewing helps.
  items:
  - prompt: Where does digestion of starch begin?
    options:
    - Mouth
    - Stomach
    - Large intestine
    - Food pipe
    answer: Mouth
    difficulty: 1
    hints:
    - Saliva.
    - 'Chew a roti long: it tastes sweet.'
    solution: Saliva in the mouth starts breaking down starch.
    mistakes: {"Stomach": "t7_starch_mouth", "Food pipe": "t7_starch_mouth"}
  - prompt: Where is most digested food absorbed into the blood?
    options:
    - Small intestine
    - Stomach
    - Mouth
    - Large intestine
    answer: Small intestine
    difficulty: 2
    hints:
    - Villi.
    - Long and coiled.
    solution: Villi in the small intestine absorb digested food.
    mistakes:
      Stomach: c7s_digest_order
  - prompt: What does the large intestine mainly absorb?
    options:
    - Water
    - Proteins
    - Fats
    - Starch
    answer: Water
    difficulty: 2
    hints:
    - After nutrients are taken.
    - Makes waste solid.
    solution: The large intestine absorbs water.
    mistakes: {"Proteins": "t7_large_intestine", "Starch": "t7_large_intestine"}
  - prompt: Which acid is produced in the stomach?
    options:
    - Hydrochloric acid
    - Citric acid
    - Formic acid
    - Acetic acid
    answer: Hydrochloric acid
    difficulty: 2
    hints:
    - Kills germs.
    - Strong acid.
    solution: The stomach makes hydrochloric acid.
    mistakes: {"Citric acid": "t7_stomach_acid", "Formic acid": "t7_stomach_acid"}
  - prompt: 'Animals like cows that chew the cud are called:'
    options:
    - Ruminants
    - Carnivores
    - Omnivores
    - Amphibians
    answer: Ruminants
    difficulty: 1
    hints:
    - The rumen.
    - Bring food back up.
    solution: They are ruminants.
    mistakes: {"Carnivores": "t7_ruminant", "Omnivores": "t7_ruminant"}
  - prompt: How does Amoeba take in food?
    options:
    - With false feet (pseudopodia)
    - With teeth
    - With a beak
    - Through roots
    answer: With false feet (pseudopodia)
    difficulty: 2
    hints:
    - Single-celled.
    - It surrounds the food.
    solution: Amoeba surrounds food with pseudopodia.
    mistakes: {"With teeth": "t7_amoeba", "Through roots": "t7_amoeba"}
  - prompt: Which juice in the mouth starts breaking down starch?
    options:
    - Saliva
    - Bile
    - Stomach acid
    answer: Saliva
    difficulty: 1
    hints:
    - It is made in the mouth.
    - Chew a piece of roti for long and it tastes sweet.
    solution: Saliva in the mouth begins changing starch into sugar.
    mistakes:
      Bile: c7s9_jobs
      Stomach acid: c7s9_jobs
  - prompt: Which tube carries food from the mouth to the stomach?
    options:
    - Food pipe (oesophagus)
    - Windpipe
    - Large intestine
    answer: Food pipe (oesophagus)
    difficulty: 1
    hints:
    - It comes right after the mouth.
    - Not the tube for air.
    solution: The food pipe (oesophagus) carries swallowed food to the stomach.
    mistakes:
      Windpipe: c7s9_path
      Large intestine: c7s9_path
  - prompt: 'Bile is made by the:'
    options:
    - Liver
    - Stomach
    - Kidney
    answer: Liver
    difficulty: 1
    hints:
    - It is the largest gland in the body.
    - Bile helps digest fats.
    solution: The liver makes bile, which goes into the small intestine to help digest fats.
    mistakes:
      Stomach: c7s9_jobs
      Kidney: c7s9_filter
  - prompt: 'A snake swallows a frog whole. This is a way of:'
    options:
    - Taking in food
    - Breathing
    - Excreting
    answer: Taking in food
    difficulty: 1
    hints:
    - What is the snake doing with the frog?
    - It is eating.
    solution: Swallowing prey whole is the snake's way of taking in food.
    mistakes:
      Breathing: c7s9_ways
      Excreting: c7s9_ways
  - prompt: What are villi?
    options:
    - Finger-like folds in the small intestine that absorb food
    - Teeth for grinding
    - Air sacs in the lungs
    answer: Finger-like folds in the small intestine that absorb food
    difficulty: 2
    hints:
    - They line the inside of the small intestine.
    - They give a huge surface to absorb food.
    solution: Villi are tiny finger-like projections in the small intestine that absorb digested food into blood.
    mistakes:
      Teeth for grinding: c7s9_jobs
      Air sacs in the lungs: c7s9_gas_swap
  - prompt: Why does the stomach make acid?
    options:
    - To kill germs and help digest food
    - To absorb water
    - To make bile
    answer: To kill germs and help digest food
    difficulty: 2
    hints:
    - Food often carries germs.
    - Acid also helps the stomach's juices work.
    solution: Hydrochloric acid kills many germs and creates the conditions for stomach juices to digest proteins.
    mistakes:
      To absorb water: c7s9_jobs
      To make bile: c7s9_jobs
  - prompt: Which is in the correct order?
    options:
    - Mouth → food pipe → stomach → small intestine → large intestine
    - Mouth → stomach → food pipe → large intestine → small intestine
    - Mouth → small intestine → stomach → food pipe
    answer: Mouth → food pipe → stomach → small intestine → large intestine
    difficulty: 2
    hints:
    - Food goes down from the mouth first.
    - The small intestine comes before the large one.
    solution: Food passes mouth → food pipe → stomach → small intestine → large intestine → anus.
    mistakes:
      Mouth → stomach → food pipe → large intestine → small intestine: c7s9_path
      Mouth → small intestine → stomach → food pipe: c7s9_path
  - prompt: A person has diarrhoea and loses a lot of water. Which organ normally takes water back from the waste?
    options:
    - Large intestine
    - Stomach
    - Mouth
    answer: Large intestine
    difficulty: 2
    hints:
    - It is the last part before waste leaves.
    - Its main job is water.
    solution: The large intestine absorbs water from undigested waste; in diarrhoea this fails and water is lost.
    mistakes:
      Stomach: c7s9_jobs
      Mouth: c7s9_jobs
  - prompt: Why can cows digest grass but humans cannot?
    options:
    - Cows have a rumen with microbes that break down tough grass
    - Cows have no teeth
    - Humans have no stomach
    answer: Cows have a rumen with microbes that break down tough grass
    difficulty: 3
    hints:
    - Grass contains tough fibre (cellulose).
    - Ruminants have a special stomach part.
    solution: Microbes in a cow's rumen break down cellulose in grass; humans lack these.
    mistakes:
      Cows have no teeth: c7s9_ways
      Humans have no stomach: c7s9_path
  - prompt: Why should we chew food well before swallowing?
    options:
    - It breaks food into small pieces and mixes it with saliva
    - Chewing makes food disappear
    - It stops digestion
    answer: It breaks food into small pieces and mixes it with saliva
    difficulty: 3
    hints:
    - Small pieces digest faster.
    - What does saliva start?
    solution: Chewing grinds food and mixes it with saliva, which begins digestion and makes swallowing easy.
    mistakes:
      Chewing makes food disappear: c7s9_jobs
      It stops digestion: c7s9_jobs
  - prompt: The small intestine is very long and folded with villi. How does this help?
    options:
    - It gives a large surface to absorb digested food
    - It stores waste for longer
    - It makes the stomach bigger
    answer: It gives a large surface to absorb digested food
    difficulty: 3
    hints:
    - Absorption happens through its lining.
    - More surface, more absorption.
    solution: Length, folds and villi together create a huge surface area, so much more food is absorbed.
    mistakes:
      It stores waste for longer: c7s9_jobs
      It makes the stomach bigger: c7s9_path
- code: cbse7s.animal.resp
  title: Breathing, circulation and excretion
  after:
  - cbse7s.animal.digest
  notes: |
    Breathing: we inhale oxygen-rich air and exhale air with more carbon dioxide; lungs exchange gases. Cellular
    respiration in cells releases energy from food using oxygen. Fish use gills, insects spiracles, earthworms
    their skin. Circulation: the heart pumps blood through arteries (away from the heart) and veins (back to it);
    blood carries oxygen, food and wastes; a normal resting pulse is about 70–80 beats a minute. Excretion:
    kidneys filter wastes from blood to make urine.
  explanations:
    text: We breathe in oxygen, which our cells use to release energy from food, and breathe out carbon dioxide. The heart pumps blood that carries oxygen and food all round the body. The kidneys clean the blood and remove waste as urine.
    visual: 'Picture the heart as a pump with two loops of pipes: one to the lungs to pick up oxygen, one to the whole body to deliver it, then back to the heart.'
    step_by_step: 'Step 1: Breathing brings oxygen to the lungs. Step 2: Blood picks it up. Step 3: The heart pumps blood through arteries. Step 4: Cells use oxygen to release energy. Step 5: Veins return blood; kidneys filter wastes.'
    real_world: 'Doctors check your pulse at the wrist: each beat is your heart pumping blood into the arteries.'
  picture:
    kind: compare
    columns:
    - title: Breathing
      points:
      - Lungs (humans)
      - Gills (fish)
      - Spiracles (insects)
      - Skin (earthworm)
    - title: Circulation and excretion
      points:
      - Heart pumps blood
      - Arteries carry blood away
      - Veins bring it back
      - Kidneys make urine
    alt: Breathing organs in different animals, and how the heart, arteries, veins and kidneys move blood and remove waste.
  activity:
    type: sort
    prompt: Which system does each part belong to?
    bins:
    - Breathing
    - Circulation
    - Excretion
    items:
    - label: Lungs
      bin: Breathing
      clue: Where air goes in.
      why: Gas exchange happens here.
    - label: Windpipe
      bin: Breathing
      clue: Carries air down.
      why: Breathing system.
    - label: Nostrils
      bin: Breathing
      clue: Air enters here.
      why: Breathing.
    - label: Heart
      bin: Circulation
      clue: Pumps blood.
      why: Circulatory system.
    - label: Blood vessels
      bin: Circulation
      clue: Tubes carrying blood.
      why: Arteries and veins.
    - label: Blood
      bin: Circulation
      clue: Carries oxygen and food.
      why: Circulatory system.
    - label: Kidneys
      bin: Excretion
      clue: Filter waste from blood.
      why: Excretory system.
    - label: Urinary bladder
      bin: Excretion
      clue: Stores urine.
      why: Excretion.
  lesson:
    - teach: 'We breathe in air rich in oxygen and breathe out air with more carbon dioxide. In the lungs, oxygen passes into the blood and carbon dioxide passes out. In every cell, oxygen is used to release energy from food: cellular respiration, which makes carbon dioxide as waste.'
      picture:
        kind: compare
        columns:
        - title: Breathe in
          points:
          - more oxygen
          - less carbon dioxide
        - title: Breathe out
          points:
          - less oxygen
          - more carbon dioxide
        alt: Inhaled and exhaled air compared.
      check:
        prompt: 'Breathed-out air has more:'
        options:
        - Carbon dioxide
        - Oxygen
        - Nitrogen than ever
        answer: Carbon dioxide
        why: Cells make carbon dioxide when they release energy.
    - teach: Animals breathe in different ways. Fish take oxygen from water with gills. Insects have tiny holes called spiracles leading to air tubes. Earthworms breathe through their moist skin. Frogs use lungs on land and skin in water.
      picture:
        kind: compare
        columns:
        - title: Animal
          points:
          - fish
          - insect
          - earthworm
          - human
        - title: Breathes with
          points:
          - gills
          - spiracles
          - moist skin
          - lungs
        alt: Breathing organs of different animals.
      check:
        prompt: 'Fish take oxygen from water using:'
        options:
        - Gills
        - Lungs
        - Spiracles
        answer: Gills
        why: Gills absorb oxygen dissolved in water.
    - teach: The heart pumps blood round the body. Arteries carry blood away from the heart; veins bring it back. Blood carries oxygen, digested food and wastes. Each heartbeat makes a pulse, about 70–80 beats a minute at rest. The kidneys filter wastes from blood to make urine, which is stored in the bladder.
      picture:
        kind: flow
        steps:
        - Heart pumps
        - Arteries carry blood away
        - Body cells take oxygen and food
        - Veins bring blood back
        - Heart
        alt: 'Blood circulation: heart, arteries, body, veins, heart.'
      check:
        prompt: 'Blood vessels that bring blood back to the heart are:'
        options:
        - Veins
        - Arteries
        - Villi
        answer: Veins
        why: Veins return blood to the heart.
  items:
  - prompt: Which gas do we breathe out more of than we breathe in?
    options:
    - Carbon dioxide
    - Oxygen
    - Nitrogen
    - Hydrogen
    answer: Carbon dioxide
    difficulty: 1
    hints:
    - A waste gas.
    - Made in respiration.
    solution: Exhaled air has more carbon dioxide.
    mistakes: {"Oxygen": "t7_breathe_out", "Hydrogen": "t7_breathe_out"}
  - prompt: 'Fish breathe using:'
    options:
    - Gills
    - Lungs
    - Spiracles
    - Skin only
    answer: Gills
    difficulty: 1
    hints:
    - They take oxygen from water.
    - Slits behind the head.
    solution: Fish use gills.
    mistakes: {"Lungs": "t7_fish_gills", "Spiracles": "t7_fish_gills"}
  - prompt: 'Blood vessels that carry blood away from the heart are:'
    options:
    - Arteries
    - Veins
    - Capillaries only
    - Nerves
    answer: Arteries
    difficulty: 2
    hints:
    - '''A'' for away.'
    - Veins return blood.
    solution: Arteries carry blood away from the heart.
    mistakes:
      Veins: c7s_artery_vein
  - prompt: A pulse counted for 15 seconds gives 18 beats. How many beats per minute is that?
    answer: '72'
    check: 18*4
    difficulty: 2
    hints:
    - A minute has four 15-second parts.
    - 18 × 4.
    solution: 18 × 4 = 72 beats per minute.
    mistakes: {"18": "t7_pulse_minute", "270": "t7_pulse_minute"}
  - prompt: Which organ filters wastes from the blood?
    options:
    - Kidney
    - Lung
    - Stomach
    - Heart
    answer: Kidney
    difficulty: 1
    hints:
    - Makes urine.
    - Two bean-shaped organs.
    solution: The kidneys filter blood and make urine.
    mistakes: {"Lung": "t7_kidney", "Heart": "t7_kidney"}
  - prompt: 'Insects breathe through tiny holes called:'
    options:
    - Spiracles
    - Gills
    - Pores
    - Lungs
    answer: Spiracles
    difficulty: 2
    hints:
    - On the sides of the body.
    - Lead to air tubes.
    solution: Insects breathe through spiracles.
    mistakes: {"Gills": "t7_spiracles", "Lungs": "t7_spiracles"}
  - prompt: Which gas do our cells need to release energy from food?
    options:
    - Oxygen
    - Carbon dioxide
    - Nitrogen
    answer: Oxygen
    difficulty: 1
    hints:
    - We breathe it in.
    - Fire also needs it.
    solution: Cells use oxygen to release energy from food in cellular respiration.
    mistakes:
      Carbon dioxide: c7s9_gas_swap
      Nitrogen: c7s9_gas_swap
  - prompt: 'Earthworms breathe through their:'
    options:
    - Moist skin
    - Gills
    - Lungs
    answer: Moist skin
    difficulty: 1
    hints:
    - They have no lungs or gills.
    - Their skin is always damp.
    solution: Gases pass in and out through an earthworm's moist skin.
    mistakes:
      Gills: c7s9_organs
      Lungs: c7s9_organs
  - prompt: Which organ pumps blood around the body?
    options:
    - Heart
    - Lungs
    - Kidney
    answer: Heart
    difficulty: 1
    hints:
    - You feel it beating in your chest.
    - It is a muscular pump.
    solution: The heart is a muscle that pumps blood through the blood vessels.
    mistakes:
      Lungs: c7s9_pump
      Kidney: c7s9_filter
  - prompt: 'Urine is stored in the:'
    options:
    - Bladder
    - Stomach
    - Heart
    answer: Bladder
    difficulty: 1
    hints:
    - Kidneys make urine.
    - It is held in a bag until we pass it out.
    solution: Urine made by the kidneys flows to the bladder, where it is stored.
    mistakes:
      Stomach: c7s9_filter
      Heart: c7s9_filter
  - prompt: A pulse counted for 20 seconds gives 25 beats. How many beats per minute is that?
    answer: '75'
    check: 25*3
    difficulty: 2
    hints:
    - A minute has three lots of 20 seconds.
    - Multiply by 3.
    solution: Beats per minute = 25 × 3 = 75.
    mistakes:
      '45': c7s9_minute
      '500': c7s9_minute
  - prompt: Why does your breathing get faster when you run?
    options:
    - Muscles need more oxygen to release more energy
    - Running makes the lungs smaller
    - You need less oxygen when running
    answer: Muscles need more oxygen to release more energy
    difficulty: 2
    hints:
    - Running uses a lot of energy.
    - What do cells need to release energy?
    solution: Working muscles need more energy, so they need more oxygen, and breathing speeds up.
    mistakes:
      Running makes the lungs smaller: c7s9_gas_swap
      You need less oxygen when running: c7s9_gas_swap
  - prompt: 'Arteries carry blood:'
    options:
    - Away from the heart
    - Back to the heart
    - Only to the lungs
    answer: Away from the heart
    difficulty: 2
    hints:
    - A for arteries, A for away.
    - Veins do the opposite.
    solution: Arteries carry blood away from the heart to all parts of the body.
    mistakes:
      Back to the heart: c7s9_vessels
      Only to the lungs: c7s9_vessels
  - prompt: Lime water turns milky faster with breathed-out air than with fresh air. What does this show?
    options:
    - Breathed-out air has more carbon dioxide
    - Breathed-out air has more oxygen
    - Fresh air has no gases
    answer: Breathed-out air has more carbon dioxide
    difficulty: 2
    hints:
    - Lime water turns milky with carbon dioxide.
    - Which air has more of it?
    solution: Carbon dioxide turns lime water milky; exhaled air has more of it, so it acts faster.
    mistakes:
      Breathed-out air has more oxygen: c7s9_gas_swap
      Fresh air has no gases: c7s9_gas_swap
  - prompt: A fish taken out of water dies soon, even though air has plenty of oxygen. Why?
    options:
    - Its gills cannot take oxygen from air
    - Fish need no oxygen
    - Air has no oxygen
    answer: Its gills cannot take oxygen from air
    difficulty: 3
    hints:
    - Gills work in water.
    - Out of water they collapse and dry.
    solution: Gills absorb oxygen dissolved in water; in air they dry and stick together, so the fish cannot breathe.
    mistakes:
      Fish need no oxygen: c7s9_organs
      Air has no oxygen: c7s9_gas_swap
  - prompt: Why do people with kidney failure need dialysis?
    options:
    - A machine filters wastes from their blood
    - It helps them breathe
    - It digests their food
    answer: A machine filters wastes from their blood
    difficulty: 3
    hints:
    - What do healthy kidneys do?
    - Something must do that job instead.
    solution: When kidneys fail, wastes build up in blood; dialysis machines filter them out.
    mistakes:
      It helps them breathe: c7s9_filter
      It digests their food: c7s9_filter
  - prompt: Blood carries digested food from the small intestine to the cells. What else does it carry to the cells?
    options:
    - Oxygen from the lungs
    - Urine from the bladder
    - Bile from the liver to the brain
    answer: Oxygen from the lungs
    difficulty: 3
    hints:
    - Cells need food AND something else to release energy.
    - It comes from breathing.
    solution: Blood picks up oxygen in the lungs and takes it, with food, to every cell.
    mistakes:
      Urine from the bladder: c7s9_filter
      Bile from the liver to the brain: c7s9_jobs
