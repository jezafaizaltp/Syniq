# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 8. Format: content/README.md.
subject: cbse7-sci
chapter: 8
title: Measurement of Time and Motion
tips:
  c7s_time_units: "60 is the seconds in one minute. One hour has 60 minutes, and each minute has 60 seconds. Multiply."
  c7s_speed_formula: Speed = distance ÷ time. Divide, don't multiply.
  t7_average_speed: "Average speed = total distance ÷ total time."
  t7_distance_speed_time: "Distance = speed × time."
  t7_ghatika: "The ancient Indian water clock's name sounds like 'ghadi', the Hindi word for clock."
  t7_hours_minutes: "1 hour = 60 minutes. Change the 2 hours, then add the 15 minutes."
  t7_odometer: "The speedometer shows speed. Which meter counts distance?"
  t7_pendulum_length: "Change the bob's weight and the period stays the same. What does change it?"
  t7_pendulum_period: "Time period = total time ÷ number of swings."
  t7_si_second: "The SI unit of time is the smallest of these."
  t7_speed_distance_time: "Speed = distance ÷ time."
  t7_time_distance_speed: "Time = distance ÷ speed."
  c7s8_convert: Put all times in the same unit first. Recall how many minutes make an hour and how many seconds make a minute; multiply to go to a smaller unit, divide to go to a bigger one.
  c7s8_period: The time period is the time for ONE complete swing (there and back). Divide the total time by the number of swings.
  c7s8_length: Only the length of the string changes how long one swing takes. The weight of the bob and a small push do not.
  c7s8_formula: Speed = distance ÷ time. Distance = speed × time. Time = distance ÷ speed. Pick the one that gives the unknown.
  c7s8_average: Average speed = TOTAL distance ÷ TOTAL time, not the average of the two speeds.
  c7s8_meters: One dial shows how fast you are going right now; the other counts how far the vehicle has gone in all.
concepts:
- code: cbse7s.motion.time
  title: Measuring time
  notes: |
    People measured time with the Sun (sundials), water clocks (ghatika in ancient India), sand clocks and
    candles. A simple pendulum (a weight on a string) swings with a regular time period: the time for one
    complete oscillation, which depends on the length of the string, not the weight. Pendulum clocks use this.
    The SI unit of time is the second (s); 60 s = 1 min, 60 min = 1 h, so 1 h = 3600 s. Modern clocks use quartz
    crystals; atomic clocks are the most accurate.
  explanations:
    text: People have measured time with shadows, water clocks and sand clocks. A pendulum swings back and forth in the same time again and again, so it makes a good clock. Today we measure time in seconds, minutes and hours.
    visual: 'Hang a stone on a string and let it swing. Count 20 swings with a watch: dividing the time by 20 gives the time period of one swing.'
    step_by_step: 'Step 1: Count several complete swings. Step 2: Measure the total time. Step 3: Divide by the number of swings to get the time period. Step 4: Remember that a longer string means a longer period.'
    real_world: Before clocks, Indian villages used the ghatika, a bowl with a hole that sank in water in a fixed time, to mark hours.
  picture:
    kind: flow
    steps:
    - 'Sundial: shadows'
    - Water clock (ghatika)
    - Sand clock
    - Pendulum clock
    - Quartz and atomic clocks
    alt: 'How timekeeping developed: from sundials and water clocks to sand clocks, pendulum clocks and modern quartz and atomic clocks.'
  activity:
    type: formula
    prompt: 'A pendulum: its period is the time for one full swing, there and back.'
    inputs:
    - name: s
      label: Number of swings
      min: 1
      max: 50
      step: 1
      start: 1
    - name: t
      label: Time taken
      min: 1
      max: 100
      step: 1
      start: 1
      unit: s
    outputs:
    - name: p
      label: Period (time ÷ swings)
      expr: t/s
      unit: s
      places: 2
    goals:
    - prompt: A pendulum with a period of 2 s makes 20 swings. How long does it take?
      want:
        s: 20
        p: 2
      mistakes:
      - when:
          s: 20
          t: 10
        say: 20 ÷ 2 divides. Each swing takes 2 s, so 20 swings take 20 × 2.
      - when:
          s: 20
          t: 22
        say: 20 + 2 adds. Time = swings × period.
    - prompt: Period 1.5 s. How many swings in 30 s?
      want:
        t: 30
        p: 1.5
      mistakes:
      - when:
          t: 30
          s: 45
        say: '30 × 1.5 multiplies. Swings = time ÷ period: 30 ÷ 1.5.'
    - prompt: 'A seconds pendulum: one swing each second. Count 25 swings.'
      want:
        s: 25
        p: 1
      mistakes:
      - when:
          s: 25
          t: 50
        say: That gives 2 s per swing. For 1 s each, 25 swings take 25 s.
  lesson:
    - teach: Long ago people measured time with sundials (shadows), sand clocks, candle clocks and water clocks. In ancient India, a ghatika was a bowl with a small hole that sank in water in a fixed time. Today we use quartz clocks, and atomic clocks are the most accurate.
      picture:
        kind: flow
        steps:
        - Sundial
        - Water clock (ghatika)
        - Sand clock
        - Pendulum clock
        - Quartz and atomic clocks
        alt: How clocks developed over time.
      check:
        prompt: 'A sundial measures time using:'
        options:
        - The Sun's shadow
        - Falling sand
        - A swinging weight
        answer: The Sun's shadow
        why: The shadow moves as the Sun moves across the sky.
    - teach: A simple pendulum is a small weight (bob) hanging on a string. One oscillation is one complete swing from one side to the other and back. The time period is the time for one oscillation. It stays the same swing after swing, which is why pendulums can keep time.
      picture:
        kind: geometry
        points:
          O:
          - 5
          - 9
          A:
          - 2
          - 3
          M:
          - 5
          - 2
          B:
          - 8
          - 3
        segments:
        - - O
          - A
        - - O
          - M
        - - O
          - B
        alt: A pendulum hung from O swinging from A through M to B; A to B and back is one oscillation.
      check:
        prompt: 'A pendulum makes 10 oscillations in 20 seconds. Its time period is:'
        options:
        - 2 seconds
        - 10 seconds
        - 200 seconds
        answer: 2 seconds
        why: 20 ÷ 10 = 2.
    - teach: 'The time period depends on the length of the string: a longer string gives a longer time period. The weight of the bob does not change it. The SI unit of time is the second (s): 60 s = 1 minute, 60 minutes = 1 hour, so 1 hour = 3600 s.'
      check:
        prompt: 'To make a pendulum swing more slowly, you should:'
        options:
        - Make the string longer
        - Use a heavier bob
        - Push it harder
        answer: Make the string longer
        why: A longer string gives a longer time period.
  items:
  - prompt: How many seconds are there in one hour?
    answer: '3600'
    check: 60*60
    difficulty: 1
    hints:
    - 60 seconds in a minute.
    - 60 × 60.
    solution: 60 × 60 = 3600 s.
    mistakes:
      '60': c7s_time_units
  - prompt: A pendulum makes 20 complete swings in 40 seconds. What is its time period, in seconds?
    answer: '2'
    check: 40/20
    difficulty: 1
    hints:
    - Time ÷ number of swings.
    - 40 ÷ 20.
    solution: 40 ÷ 20 = 2 s.
    mistakes: {"0.5": "t7_pendulum_period", "800": "t7_pendulum_period"}
  - prompt: 'The time period of a pendulum depends on:'
    options:
    - The length of the string
    - The weight of the bob
    - The colour of the bob
    - The time of day
    answer: The length of the string
    difficulty: 2
    hints:
    - 'Try a heavier bob: same period.'
    - 'Change the length: it changes.'
    solution: The period depends on the length, not the mass.
    mistakes: {"The weight of the bob": "t7_pendulum_length", "The time of day": "t7_pendulum_length"}
  - prompt: What is the SI unit of time?
    options:
    - Second
    - Minute
    - Hour
    - Day
    answer: Second
    difficulty: 1
    hints:
    - Symbol s.
    - Smallest of these.
    solution: The SI unit of time is the second.
    mistakes: {"Minute": "t7_si_second", "Hour": "t7_si_second"}
  - prompt: 'The ancient Indian water clock was called:'
    options:
    - Ghatika
    - Sundial
    - Quartz
    - Pendulum
    answer: Ghatika
    difficulty: 2
    hints:
    - A bowl that sinks in water.
    - Indian name.
    solution: The ghatika was a sinking-bowl water clock.
    mistakes: {"Sundial": "t7_ghatika", "Pendulum": "t7_ghatika"}
  - prompt: A film lasts 2 hours 15 minutes. How many minutes is that?
    answer: '135'
    check: 2*60 + 15
    difficulty: 2
    hints:
    - 2 hours = 120 minutes.
    - 120 + 15.
    solution: 120 + 15 = 135 minutes.
    mistakes: {"215": "t7_hours_minutes", "75": "t7_hours_minutes"}
  - prompt: How many seconds are in 5 minutes?
    answer: '300'
    check: 5*60
    difficulty: 1
    hints:
    - 1 minute = 60 seconds.
    - 5 × 60.
    solution: Each minute has 60 seconds, so 5 × 60 = 300 seconds.
    mistakes:
      '500': c7s8_convert
      '65': c7s8_convert
  - prompt: How many minutes are in 3 hours?
    answer: '180'
    check: 3*60
    difficulty: 1
    hints:
    - 1 hour = 60 minutes.
    - 3 × 60.
    solution: Each hour has 60 minutes, so 3 × 60 = 180 minutes.
    mistakes:
      '300': c7s8_convert
      '63': c7s8_convert
  - prompt: 'One complete swing of a pendulum, from one end to the other and back, is called:'
    options:
    - An oscillation
    - A period of rest
    - A second
    answer: An oscillation
    difficulty: 1
    hints:
    - It is one full to-and-fro movement.
    - The time for it is the time period.
    solution: One complete to-and-fro swing is one oscillation.
    mistakes:
      A period of rest: c7s8_period
      A second: c7s8_period
  - prompt: Which clock is the most accurate?
    options:
    - Atomic clock
    - Sundial
    - Sand clock
    answer: Atomic clock
    difficulty: 1
    hints:
    - It is used for GPS and satellites.
    - It is the most modern.
    solution: Atomic clocks keep time to a tiny fraction of a second over millions of years.
    mistakes:
      Sundial: c7s8_convert
      Sand clock: c7s8_convert
  - prompt: A pendulum makes 25 oscillations in 50 seconds. Find its time period, in seconds.
    answer: '2'
    check: 50/25
    difficulty: 2
    hints:
    - Time period = total time ÷ number of oscillations.
    - 50 ÷ 25.
    solution: Time period = 50 ÷ 25 = 2 seconds.
    mistakes:
      '1250': c7s8_period
      '0.5': c7s8_period
  - prompt: A pendulum has a time period of 1.5 s. How long do 20 oscillations take, in seconds?
    answer: '30'
    check: 1.5*20
    difficulty: 2
    hints:
    - Each oscillation takes 1.5 s.
    - 20 × 1.5.
    solution: Total time = 20 × 1.5 = 30 seconds.
    mistakes:
      '13.3': c7s8_period
      '21.5': c7s8_period
  - prompt: Ravi replaces a light bob with a heavier one, keeping the same string. What happens to the time period?
    options:
    - It stays the same
    - It doubles
    - It becomes zero
    answer: It stays the same
    difficulty: 2
    hints:
    - What does the time period depend on?
    - The string was not changed.
    solution: The time period depends on the string's length, not the bob's weight, so it stays the same.
    mistakes:
      It doubles: c7s8_length
      It becomes zero: c7s8_length
  - prompt: A school day lasts from 9:00 am to 3:30 pm. How long is it, in minutes?
    answer: '390'
    check: 6*60+30
    difficulty: 2
    hints:
    - 9:00 to 3:00 is 6 hours.
    - Add 30 minutes.
    solution: 6 hours 30 minutes = 6 × 60 + 30 = 390 minutes.
    mistakes:
      '630': c7s8_convert
      '330': c7s8_convert
  - prompt: Two pendulums have strings of 50 cm and 100 cm. Which has the longer time period?
    options:
    - The 100 cm one
    - The 50 cm one
    - Both are the same
    answer: The 100 cm one
    difficulty: 3
    hints:
    - Which feature sets the time period?
    - Longer string, slower swing.
    solution: A longer string gives a longer time period, so the 100 cm pendulum swings more slowly.
    mistakes:
      The 50 cm one: c7s8_length
      Both are the same: c7s8_length
  - prompt: How many seconds are in one day?
    answer: '86400'
    check: 24*60*60
    difficulty: 3
    hints:
    - 1 day = 24 hours, 1 hour = 3600 s.
    - 24 × 3600.
    solution: 24 hours × 3600 seconds = 86,400 seconds.
    mistakes:
      '1440': c7s8_convert
      '3600': c7s8_convert
  - prompt: A ghatika bowl sinks in 24 minutes. How many times would it sink in one day (24 hours)?
    answer: '60'
    check: 24*60/24
    difficulty: 3
    hints:
    - Change 24 hours to minutes first.
    - Then divide by 24 minutes.
    solution: 24 hours = 1440 minutes, and 1440 ÷ 24 = 60. A day was 60 ghatikas.
    mistakes:
      '1': c7s8_convert
      '1440': c7s8_convert
- code: cbse7s.motion.speed
  title: Speed, distance and time
  after:
  - cbse7s.motion.time
  notes: |
    Speed = distance ÷ time. Units: m/s or km/h. A car covering 120 km in 2 h has speed 60 km/h. Distance =
    speed × time; time = distance ÷ speed. Uniform motion: equal distances in equal times; non-uniform otherwise.
    Average speed = total distance ÷ total time. A speedometer shows speed; an odometer shows distance. A
    distance–time graph is a straight line for uniform motion; a steeper line means faster.
  explanations:
    text: 'Speed tells you how fast something moves: how far it goes in a unit of time. If a car goes 120 km in 2 hours, its speed is 120 ÷ 2 = 60 km/h.'
    visual: 'Draw a triangle with D on top and S and T below. Cover the one you want: D = S × T; S = D ÷ T; T = D ÷ S.'
    step_by_step: 'Step 1: Write down the distance and time with units. Step 2: Speed = distance ÷ time. Step 3: To find distance, multiply speed by time. Step 4: Check the units match.'
    real_world: Indian Railways' Vande Bharat trains can reach about 160 km/h; at that speed they would travel 320 km in 2 hours.
  picture:
    kind: compare
    columns:
    - title: Uniform motion
      points:
      - Equal distances in equal times
      - Constant speed
      - Straight-line distance–time graph
    - title: Non-uniform motion
      points:
      - Unequal distances in equal times
      - Speed changes
      - Curved distance–time graph
    alt: Uniform motion covers equal distances in equal times at constant speed; non-uniform motion changes speed.
  activity:
    type: formula
    prompt: Speed = distance ÷ time.
    inputs:
    - name: d
      label: Distance
      min: 0
      max: 300
      step: 10
      start: 10
      unit: km
    - name: t
      label: Time
      min: 1
      max: 10
      step: 1
      start: 1
      unit: h
    outputs:
    - name: v
      label: Speed
      expr: d/t
      unit: km/h
      places: 1
    goals:
    - prompt: A car travels at 60 km/h for 2 hours. Set the distance.
      want:
        t: 2
        v: 60
      mistakes:
      - when:
          t: 2
          d: 30
        say: 60 ÷ 2 divides. Each hour covers 60 km, so 2 hours cover 60 × 2.
    - prompt: A bus goes 150 km at 50 km/h. Set the time.
      want:
        d: 150
        v: 50
      mistakes:
      - when:
          d: 150
          t:
          - 4
          - 10
        say: 'Too slow: at 50 km/h it covers 150 km sooner.'
      - when:
          d: 150
          t:
          - 1
          - 2
        say: 'Too fast: in 2 hours at 50 km/h it only goes 100 km.'
    - prompt: Make a journey at 45 km/h lasting at least 3 hours.
      want:
        v: 45
        t:
        - 3
        - 10
      mistakes:
      - when:
          v: 45
          t:
          - 1
          - 2
        say: Right speed, but not long enough.
      - when:
          v:
          - 46
          - 300
        say: 'Too fast: distance ÷ time must be 45.'
  lesson:
    - teach: 'Speed tells how fast something moves: the distance covered in a unit of time. Speed = distance ÷ time. A bus that covers 150 km in 3 hours has a speed of 50 km/h. Speed can be in km/h or m/s.'
      picture:
        kind: flow
        steps:
        - 'Distance: 150 km'
        - 'Time: 3 h'
        - Speed = 150 ÷ 3
        - = 50 km/h
        alt: Finding speed by dividing distance by time.
      check:
        prompt: A runner covers 200 m in 40 s. What is her speed?
        options:
        - 5 m/s
        - 8000 m/s
        - 240 m/s
        answer: 5 m/s
        why: 200 ÷ 40 = 5.
    - teach: 'Rearranging the rule: distance = speed × time, and time = distance ÷ speed. A car at 60 km/h for 2 hours travels 120 km. Uniform motion covers equal distances in equal times; most real motion is non-uniform, so we use average speed = total distance ÷ total time.'
      picture:
        kind: compare
        columns:
        - title: Find
          points:
          - speed
          - distance
          - time
        - title: Use
          points:
          - distance ÷ time
          - speed × time
          - distance ÷ speed
        alt: Three forms of the speed rule.
      check:
        prompt: A train goes 240 km at 80 km/h. How long does it take?
        options:
        - 3 hours
        - 160 hours
        - 19200 hours
        answer: 3 hours
        why: 240 ÷ 80 = 3.
    - teach: A speedometer shows a vehicle's speed at each moment; an odometer counts the total distance travelled. On a distance–time graph, uniform motion gives a straight line; a steeper line means a higher speed.
      picture:
        kind: bars
        bars:
        - label: after 1 h
          value: 40
        - label: after 2 h
          value: 80
        - label: after 3 h
          value: 120
        unit: km
        alt: 'A bus in uniform motion: 40 km more each hour.'
      check:
        prompt: Which instrument shows how far a car has travelled in total?
        options:
        - Odometer
        - Speedometer
        - Thermometer
        answer: Odometer
        why: It counts the total distance.
  items:
  - prompt: A car travels 120 km in 2 hours. Find its speed in km/h.
    answer: '60'
    check: 120/2
    difficulty: 1
    hints:
    - Speed = distance ÷ time.
    - 120 ÷ 2.
    solution: 120 ÷ 2 = 60 km/h.
    mistakes:
      '240': c7s_speed_formula
  - prompt: A cyclist rides at 15 km/h for 3 hours. How far does she go, in km?
    answer: '45'
    check: 15*3
    difficulty: 1
    hints:
    - Distance = speed × time.
    - 15 × 3.
    solution: 15 × 3 = 45 km.
    mistakes: {"5": "t7_distance_speed_time", "18": "t7_distance_speed_time"}
  - prompt: A train travels 300 km at 60 km/h. How many hours does it take?
    answer: '5'
    check: 300/60
    difficulty: 2
    hints:
    - Time = distance ÷ speed.
    - 300 ÷ 60.
    solution: 300 ÷ 60 = 5 hours.
    mistakes: {"18000": "t7_time_distance_speed", "0.2": "t7_time_distance_speed"}
  - prompt: A runner covers 100 m in 20 s. Find the speed in m/s.
    answer: '5'
    check: 100/20
    difficulty: 1
    hints:
    - 100 ÷ 20.
    - m/s.
    solution: 100 ÷ 20 = 5 m/s.
    mistakes: {"2000": "t7_speed_distance_time", "0.2": "t7_speed_distance_time"}
  - prompt: Which instrument in a vehicle shows the distance travelled?
    options:
    - Odometer
    - Speedometer
    - Thermometer
    - Barometer
    answer: Odometer
    difficulty: 2
    hints:
    - '''Odo'' = road.'
    - Speedometer shows speed.
    solution: The odometer records distance.
    mistakes: {"Speedometer": "t7_odometer", "Barometer": "t7_odometer"}
  - prompt: A bus goes 40 km in the first hour and 60 km in the next hour. Find its average speed in km/h.
    answer: '50'
    check: (40 + 60)/2
    difficulty: 2
    hints:
    - Total distance = 100 km.
    - Total time = 2 h.
    solution: 100 ÷ 2 = 50 km/h.
    mistakes: {"100": "t7_average_speed", "20": "t7_average_speed"}
  - prompt: A scooter travels 90 km in 2 hours. Find its speed in km/h.
    answer: '45'
    check: 90/2
    difficulty: 1
    hints:
    - Speed = distance ÷ time.
    - 90 ÷ 2.
    solution: Speed = 90 ÷ 2 = 45 km/h.
    mistakes:
      '180': c7s8_formula
      '92': c7s8_formula
  - prompt: A bird flies at 12 m/s for 10 s. How far does it fly, in metres?
    answer: '120'
    check: 12*10
    difficulty: 1
    hints:
    - Distance = speed × time.
    - 12 × 10.
    solution: Distance = 12 × 10 = 120 metres.
    mistakes:
      '1.2': c7s8_formula
      '22': c7s8_formula
  - prompt: A cyclist rides 36 km at 12 km/h. How many hours does it take?
    answer: '3'
    check: 36/12
    difficulty: 1
    hints:
    - Time = distance ÷ speed.
    - 36 ÷ 12.
    solution: Time = 36 ÷ 12 = 3 hours.
    mistakes:
      '432': c7s8_formula
      '24': c7s8_formula
  - prompt: Which instrument shows the speed of a vehicle?
    options:
    - Speedometer
    - Odometer
    - Thermometer
    answer: Speedometer
    difficulty: 1
    hints:
    - Its name has 'speed' in it.
    - The needle moves as you go faster.
    solution: The speedometer shows the speed at each moment.
    mistakes:
      Odometer: c7s8_meters
      Thermometer: c7s8_meters
  - prompt: A car goes 30 km in 30 minutes. What is its speed in km/h?
    answer: '60'
    check: 30/0.5
    difficulty: 2
    hints:
    - 30 minutes is half an hour.
    - 30 ÷ 0.5.
    solution: 30 minutes = 0.5 h, so speed = 30 ÷ 0.5 = 60 km/h.
    mistakes:
      '1': c7s8_convert
      '900': c7s8_formula
  - prompt: A bus travels 60 km in the first hour and 40 km in the second hour. Find its average speed in km/h.
    answer: '50'
    check: (60+40)/2
    difficulty: 2
    hints:
    - Total distance and total time.
    - 100 km in 2 h.
    solution: Average speed = (60 + 40) ÷ 2 = 100 ÷ 2 = 50 km/h.
    mistakes:
      '100': c7s8_average
      '20': c7s8_average
  - prompt: A car moves 10 m every second. Is its motion uniform or non-uniform?
    options:
    - Uniform
    - Non-uniform
    - It is not moving
    answer: Uniform
    difficulty: 2
    hints:
    - Is the distance the same each second?
    - Equal distances in equal times.
    solution: It covers equal distances (10 m) in equal times (1 s), so its motion is uniform.
    mistakes:
      Non-uniform: c7s8_formula
      It is not moving: c7s8_formula
  - prompt: Arun walks 2 km in 30 minutes. What is his speed in km/h?
    answer: '4'
    check: 2/0.5
    difficulty: 2
    hints:
    - 30 minutes = 0.5 h.
    - 2 ÷ 0.5.
    solution: Speed = 2 ÷ 0.5 = 4 km/h.
    mistakes:
      '1': c7s8_formula
      '15': c7s8_convert
  - prompt: A car's odometer reads 24,500 km at the start of a trip and 24,740 km at the end. The trip took 4 hours. What was the average speed in km/h?
    answer: '60'
    check: (24740-24500)/4
    difficulty: 3
    hints:
    - Distance = end reading − start reading.
    - Then divide by 4 hours.
    solution: Distance = 24,740 − 24,500 = 240 km. Average speed = 240 ÷ 4 = 60 km/h.
    mistakes:
      '6185': c7s8_meters
      '240': c7s8_formula
  - prompt: Convert 36 km/h into m/s.
    answer: '10'
    check: 36*1000/3600
    difficulty: 3
    hints:
    - 36 km = 36,000 m and 1 h = 3600 s.
    - 36,000 ÷ 3600.
    solution: 36 km/h = 36,000 m ÷ 3600 s = 10 m/s.
    mistakes:
      '36': c7s8_convert
      '129.6': c7s8_convert
  - prompt: Two cars travel for 2 hours. Car A covers 100 km and car B covers 140 km. On a distance–time graph, which line is steeper?
    options:
    - Car B's
    - Car A's
    - They are equally steep
    answer: Car B's
    difficulty: 3
    hints:
    - Which car is faster?
    - A faster object gives a steeper line.
