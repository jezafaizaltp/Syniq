# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 6. Format: content/README.md.
subject: cbse7-sci
chapter: 6
title: 'Adolescence: A Stage of Growth and Change'
tips:
  c7s_normal: In adolescence everyone changes at their own pace; differences in timing are normal.
  t7_adolescence: "Adolescence means the teenage years, between childhood and being an adult. Which range covers ages ending in -teen?"
  t7_calcium: "Milk is good for bones because of one mineral. Which?"
  t7_growth_spurt: "A sudden burst of growth in height is called a growth…?"
  t7_hormones: "Chemical messengers in the blood cause puberty changes. What are they called?"
  t7_iron_anaemia: "Iron makes red blood cells carry oxygen. Too little leads to which condition?"
  t7_iron_food: "Which choice is a fresh, green food rather than sugar or junk food?"
  t7_middle_range: "The middle of 8 and 10 is halfway between them."
  t7_pimples: "Pimples come from more oil on the skin. Which glands become more active?"
  t7_protein: "Which nutrient builds muscles and body tissues?"
  t7_tobacco: "Tobacco and alcohol damage the body and are hard to stop. Do they help growth?"
  t7_trusted_adult: "Who gives correct information and help: rumours, or a trusted adult or doctor?"
  c7s6_messengers: The body's chemical messengers, made by glands, travel in the blood and switch on the changes of growing up.
  c7s6_own_time: Every body follows its own timetable. Starting earlier or later than a friend is part of the usual range.
  c7s6_talk: Worries are easier when shared. Think of someone who knows you and can help or find help.
  c7s6_food_job: 'Match each food group to its job: body-building, energy, healthy blood, strong bones, or protection from illness.'
  c7s6_habits: Healthy habits are the ones that keep the body clean, rested, active and free from harmful, addictive substances.
concepts:
- code: cbse7s.adol.changes
  title: Changes during adolescence
  notes: |
    Adolescence is the period roughly from 11 to 19 years when the body grows from childhood to adulthood.
    Puberty brings changes caused by hormones: increase in height (growth spurt), change in voice (deeper in
    boys, the 'Adam's apple'), growth of body hair, more active sweat and oil glands (pimples are common),
    development of body shape. Changes happen at different times for different people; this is normal.
    Emotional changes: mood swings, wanting independence, caring what friends think. Talking to trusted adults
    helps.
  explanations:
    text: Adolescence is the time, roughly from 11 to 19, when your body and feelings change as you grow into an adult. You grow taller quickly, your voice may change, and you may have pimples or mood swings. Everyone changes at their own pace, and that is normal.
    visual: 'Picture a height chart on a door with marks for each birthday: the gaps between marks suddenly get bigger in the early teens, the growth spurt.'
    step_by_step: 'Step 1: Body changes: height, voice, hair, skin. Step 2: Emotional changes: moods, independence. Step 3: Remember the timing differs for each person. Step 4: Talk to parents, teachers or doctors with questions.'
    real_world: School counsellors and the government's adolescent health programmes help young people understand these changes.
  picture:
    kind: compare
    columns:
    - title: Body changes
      points:
      - Growth spurt in height
      - Voice changes
      - Body hair grows
      - Pimples from oil glands
    - title: Feelings
      points:
      - Mood swings
      - Wanting independence
      - Caring about friends' opinions
      - Talking helps
    alt: 'Changes in adolescence: physical changes (growth spurt, voice, hair, skin) and emotional changes (moods, independence), all normal.'
  activity:
    type: sort
    prompt: Is this a change in the body or in feelings?
    bins:
    - Changes in the body
    - Changes in feelings
    items:
    - label: Growing taller quickly
      bin: Changes in the body
      clue: Something you could measure.
      why: A growth spurt.
    - label: The voice becoming deeper
      bin: Changes in the body
      clue: The voice box grows.
      why: A physical change.
    - label: Pimples on the face
      bin: Changes in the body
      clue: Oil glands become more active.
      why: A physical change.
    - label: Sweating more
      bin: Changes in the body
      clue: Sweat glands become more active.
      why: Physical.
    - label: Moods going up and down
      bin: Changes in feelings
      clue: Something inside, not seen.
      why: Hormones affect feelings too.
    - label: Wanting to decide things for yourself
      bin: Changes in feelings
      clue: About independence.
      why: Emotional growth.
    - label: Caring a lot about what friends think
      bin: Changes in feelings
      clue: About friendships.
      why: Emotional change.
    - label: Feeling shy about your changing body
      bin: Changes in feelings
      clue: A feeling, and a normal one.
      why: Talking to a trusted adult helps.
  lesson:
    - teach: Adolescence is the stage of life, roughly from 11 to 19 years, when a child's body grows into an adult's. The changes that make the body able to become a parent one day are called puberty. They are started by hormones, chemical messengers made by glands.
      picture:
        kind: flow
        steps:
        - Childhood
        - Adolescence (about 11–19 years)
        - Adulthood
        alt: Adolescence is the bridge between childhood and adulthood.
      check:
        prompt: What starts the changes of puberty?
        options:
        - Hormones
        - Exercise
        - Sunlight
        answer: Hormones
        why: Hormones are chemical messengers that switch on the changes.
    - teach: 'Common changes: a growth spurt (sudden increase in height), a deeper voice in boys (the voice box grows and shows as the Adam''s apple), more body hair, more active sweat and oil glands (so pimples are common), and a change in body shape. These happen at different ages for different people, and that is normal.'
      picture:
        kind: compare
        columns:
        - title: Body changes
          points:
          - growth spurt
          - voice changes
          - more body hair
          - more sweat and oil (pimples)
        - title: Feelings
          points:
          - mood swings
          - wanting independence
          - caring about friends' views
        alt: Body changes and emotional changes in adolescence.
      check:
        prompt: Why do many teenagers get pimples?
        options:
        - Oil glands in the skin become more active
        - They eat too little
        - They grow too slowly
        answer: Oil glands in the skin become more active
        why: Extra oil can block skin pores.
    - teach: 'Feelings change too: moods can swing, you may want more independence, and friends'' opinions matter more. These are part of growing up. If you have questions or worries, talk to a parent, teacher, school counsellor or doctor you trust.'
      check:
        prompt: Kiran is worried about the changes in their body. What is a good step?
        options:
        - Talk to a trusted adult or doctor
        - Keep it secret forever
        - Believe everything on social media
        answer: Talk to a trusted adult or doctor
        why: A trusted adult can give correct information and support.
  items:
  - prompt: 'Adolescence is roughly the age range:'
    options:
    - 11 to 19 years
    - 1 to 5 years
    - 25 to 35 years
    - 5 to 8 years
    answer: 11 to 19 years
    difficulty: 1
    hints:
    - The teenage years.
    - Between childhood and adulthood.
    solution: Adolescence is about 11 to 19 years.
    mistakes: {"1 to 5 years": "t7_adolescence", "25 to 35 years": "t7_adolescence"}
  - prompt: What causes the changes of puberty?
    options:
    - Hormones
    - Eating sweets
    - Exercise alone
    - Sleeping late
    answer: Hormones
    difficulty: 2
    hints:
    - Chemical messengers in the body.
    - Made by glands.
    solution: Hormones from glands trigger puberty changes.
    mistakes: {"Eating sweets": "t7_hormones", "Sleeping late": "t7_hormones"}
  - prompt: Why are pimples common in adolescence?
    options:
    - Oil and sweat glands become more active
    - Because of eating fruit
    - Because of drinking water
    - Because of exercise
    answer: Oil and sweat glands become more active
    difficulty: 1
    hints:
    - Oily skin.
    - Glands.
    solution: More active oil glands can block pores, causing pimples.
    mistakes: {"Because of eating fruit": "t7_pimples", "Because of exercise": "t7_pimples"}
  - prompt: 'Two friends of the same age are of very different heights. This is:'
    options:
    - 'Normal: changes happen at different times'
    - A sign of illness
    - Caused by school
    - Unusual
    answer: 'Normal: changes happen at different times'
    difficulty: 1
    hints:
    - Everyone grows at their own pace.
    - Growth spurts vary.
    solution: The timing of growth differs from person to person.
    mistakes:
      A sign of illness: c7s_normal
  - prompt: 'A sudden increase in height during adolescence is called:'
    options:
    - A growth spurt
    - A hormone
    - A gland
    - Puberty age
    answer: A growth spurt
    difficulty: 1
    hints:
    - Quick growth.
    - Spurt.
    solution: It is called a growth spurt.
    mistakes: {"A hormone": "t7_growth_spurt", "A gland": "t7_growth_spurt"}
  - prompt: What is the best thing to do if you have worries about body changes?
    options:
    - Talk to a trusted adult or doctor
    - Keep it secret
    - Believe every rumour
    - Ignore it completely
    answer: Talk to a trusted adult or doctor
    difficulty: 1
    hints:
    - Reliable information.
    - Parents, teachers, doctors.
    solution: Trusted adults can give correct information and support.
    mistakes: {"Keep it secret": "t7_trusted_adult", "Believe every rumour": "t7_trusted_adult"}
  - prompt: 'Adolescence is the stage between:'
    options:
    - Childhood and adulthood
    - Birth and childhood
    - Adulthood and old age
    answer: Childhood and adulthood
    difficulty: 1
    hints:
    - It is the teenage years.
    - It comes after being a child.
    solution: Adolescence (about 11–19 years) is the bridge from childhood to adulthood.
    mistakes:
      Birth and childhood: c7s6_own_time
      Adulthood and old age: c7s6_own_time
  - prompt: 'Hormones are:'
    options:
    - Chemical messengers made by glands
    - Types of bones
    - Germs that cause pimples
    answer: Chemical messengers made by glands
    difficulty: 1
    hints:
    - They travel in the blood.
    - They carry signals.
    solution: Hormones are chemicals released by glands that travel in the blood and control changes.
    mistakes:
      Types of bones: c7s6_messengers
      Germs that cause pimples: c7s6_messengers
  - prompt: 'The bulge seen in the throat of many adolescent boys is called the:'
    options:
    - Adam's apple
    - Growth spurt
    - Oil gland
    answer: Adam's apple
    difficulty: 1
    hints:
    - It is the growing voice box.
    - It has a fruit in its name.
    solution: The enlarged voice box shows as a bulge called the Adam's apple; it makes the voice deeper.
    mistakes:
      Growth spurt: c7s6_messengers
      Oil gland: c7s6_messengers
  - prompt: Which is a common emotional change in adolescence?
    options:
    - Mood swings
    - Losing all friends
    - Stopping growth
    answer: Mood swings
    difficulty: 1
    hints:
    - Feelings can change quickly.
    - Happy one moment, upset the next.
    solution: Changing hormones can make feelings change quickly; mood swings are common and normal.
    mistakes:
      Losing all friends: c7s6_talk
      Stopping growth: c7s6_own_time
  - prompt: Anu, aged 12, has grown taller than her 13-year-old brother. Is anything wrong?
    options:
    - No, people start their growth spurt at different ages
    - Yes, girls should never be taller
    - Yes, she must stop growing
    answer: No, people start their growth spurt at different ages
    difficulty: 2
    hints:
    - Do all bodies change at the same age?
    - Girls often start a little earlier.
    solution: Growth spurts start at different times; girls often begin earlier. This is normal.
    mistakes:
      Yes, girls should never be taller: c7s6_own_time
      Yes, she must stop growing: c7s6_own_time
  - prompt: Why does a boy's voice often 'crack' during adolescence?
    options:
    - The voice box is growing and changing
    - He is catching a cold
    - He speaks too little
    answer: The voice box is growing and changing
    difficulty: 2
    hints:
    - Which part makes the voice?
    - It grows in adolescence.
    solution: As the voice box grows, the voice changes pitch and may crack for a while until it settles.
    mistakes:
      He is catching a cold: c7s6_messengers
      He speaks too little: c7s6_messengers
  - prompt: Why should adolescents bathe daily and wash their face?
    options:
    - Sweat and oil glands are more active
    - It makes them taller
    - Hormones need water
    answer: Sweat and oil glands are more active
    difficulty: 2
    hints:
    - What increases in the skin during puberty?
    - This can cause body odour and pimples.
    solution: More sweat and oil can cause odour and pimples, so daily washing keeps skin healthy.
    mistakes:
      It makes them taller: c7s6_habits
      Hormones need water: c7s6_messengers
  - prompt: A friend teases you about your changing voice. What is a healthy response?
    options:
    - Remember it is a normal change and talk to someone if it upsets you
    - Stop speaking in class
    - Tease them back harder
    answer: Remember it is a normal change and talk to someone if it upsets you
    difficulty: 2
    hints:
    - Is a changing voice normal?
    - Who can help when teasing hurts?
    solution: Voice changes are normal. Sharing hurt feelings with a trusted adult helps; teasing back or going silent does not.
    mistakes:
      Stop speaking in class: c7s6_talk
      Tease them back harder: c7s6_talk
  - prompt: Why is it better to learn about body changes from a doctor or teacher than from random websites?
    options:
    - They give correct, safe information
    - Websites are always correct
    - Doctors do not know about puberty
    answer: They give correct, safe information
    difficulty: 3
    hints:
    - Not everything online is true.
    - Who is trained to help?
    solution: Doctors, teachers and counsellors give accurate information; some websites spread myths.
    mistakes:
      Websites are always correct: c7s6_talk
      Doctors do not know about puberty: c7s6_talk
  - prompt: 'Two classmates of the same age: one has a deep voice already, the other does not. What does this show?'
    options:
    - Changes happen at different times for different people
    - One of them is unwell
    - Voices never change
    answer: Changes happen at different times for different people
    difficulty: 3
    hints:
    - Is there one fixed age for every change?
    - Each body has its own timetable.
    solution: Puberty starts and progresses at different ages; both classmates are normal.
    mistakes:
      One of them is unwell: c7s6_own_time
      Voices never change: c7s6_own_time
  - prompt: 'Wanting to make more of your own decisions during adolescence is:'
    options:
    - A normal part of growing up
    - A sign of illness
    - Something only adults feel
    answer: A normal part of growing up
    difficulty: 3
    hints:
    - Think about the emotional changes.
    - Adolescents prepare for adult life.
    solution: Seeking independence is a normal emotional change as young people prepare to become adults.
    mistakes:
      A sign of illness: c7s6_own_time
      Something only adults feel: c7s6_own_time
- code: cbse7s.adol.health
  title: Health, hygiene and nutrition in adolescence
  after:
  - cbse7s.adol.changes
  notes: |
    Growing bodies need a balanced diet: proteins (dal, milk, eggs) for growth, carbohydrates and fats for
    energy, vitamins and minerals (fruit, vegetables), iron (green leafy vegetables, jaggery) to prevent anaemia,
    and calcium for bones. Avoid too much junk food. Hygiene: daily bath, clean clothes, washing the face,
    menstrual hygiene. Exercise and enough sleep (8–10 hours) matter. Say no to tobacco, alcohol and drugs; they
    harm the body and are addictive. Mental health: share feelings, manage screen time.
  explanations:
    text: 'Your body is growing fast, so it needs good food: protein for growth, iron and calcium, fruit and vegetables. Keep clean, sleep well, exercise, and say no to tobacco, alcohol and drugs.'
    visual: 'Picture a plate: dal and egg for protein, rice or roti for energy, spinach for iron, a glass of milk for calcium, and fruit on the side.'
    step_by_step: 'Step 1: Eat a balanced diet with protein, iron and calcium. Step 2: Keep clean: bath, clean clothes, wash hands. Step 3: Exercise and sleep 8–10 hours. Step 4: Avoid harmful substances. Step 5: Talk about your feelings.'
    real_world: Many schools give iron and folic acid tablets weekly to teenagers because anaemia (low iron) is common in India.
  picture:
    kind: compare
    columns:
    - title: Do
      points:
      - Eat protein, iron, calcium
      - Bath and clean clothes daily
      - Exercise and sleep well
      - Share feelings
    - title: Avoid
      points:
      - Too much junk food
      - Tobacco and alcohol
      - Drugs
      - Too much screen time
    alt: Healthy habits in adolescence (balanced food, hygiene, exercise, sleep, sharing feelings) and things to avoid (junk food, tobacco, alcohol, drugs).
  activity:
    type: sort
    prompt: Healthy habit or not?
    bins:
    - Healthy habit
    - Unhealthy habit
    items:
    - label: Eating dal, eggs or paneer for protein
      bin: Healthy habit
      clue: Protein builds a growing body.
      why: Healthy.
    - label: Eating green leafy vegetables for iron
      bin: Healthy habit
      clue: Iron makes healthy blood.
      why: Healthy.
    - label: Sleeping 8 to 9 hours
      bin: Healthy habit
      clue: The body grows during sleep.
      why: Healthy.
    - label: Bathing daily
      bin: Healthy habit
      clue: More sweat now.
      why: Keeps you clean and fresh.
    - label: Skipping breakfast
      bin: Unhealthy habit
      clue: No fuel for the morning.
      why: Unhealthy.
    - label: Chips and fizzy drinks instead of meals
      bin: Unhealthy habit
      clue: Lots of fat and sugar, little else.
      why: Junk food.
    - label: Staying up late on the phone
      bin: Unhealthy habit
      clue: Less sleep.
      why: Unhealthy.
    - label: Trying tobacco because friends do
      bin: Unhealthy habit
      clue: Harms lungs and is addictive.
      why: Say no.
  lesson:
    - teach: A growing body needs a balanced diet. Proteins (dal, milk, eggs, paneer) build the body. Carbohydrates and fats (rice, roti, oil) give energy. Vitamins and minerals (fruits, vegetables) protect from illness. Iron (green leafy vegetables, jaggery, dates) keeps blood healthy and prevents anaemia. Calcium (milk, ragi) builds strong bones.
      picture:
        kind: compare
        columns:
        - title: Nutrient
          points:
          - protein
          - carbohydrates
          - iron
          - calcium
        - title: Job
          points:
          - growth
          - energy
          - healthy blood
          - strong bones
        - title: Food
          points:
          - dal, eggs
          - rice, roti
          - spinach, jaggery
          - milk, ragi
        alt: Nutrients, what they do and foods that give them.
      check:
        prompt: Which nutrient builds and repairs the body?
        options:
        - Protein
        - Fat
        - Water
        answer: Protein
        why: Proteins are body-building foods.
    - teach: 'Lack of iron causes anaemia: feeling tired, weak and pale. Too much junk food (chips, sugary drinks) fills you up without enough nutrients. Healthy habits: a daily bath, clean clothes, exercise or play, and 8 to 10 hours of sleep.'
      check:
        prompt: 'Lack of iron in the diet can cause:'
        options:
        - Anaemia
        - Strong bones
        - Taller height
        answer: Anaemia
        why: Iron is needed for healthy blood.
    - teach: 'Say no to tobacco, alcohol and drugs. They damage the lungs, liver and brain, and they are addictive: once started, it is very hard to stop. Look after your mind too: share feelings, keep screen time in check, and ask for help when you need it.'
      check:
        prompt: Why are drugs especially dangerous?
        options:
        - They harm the body and are addictive
        - They make you healthier
        - They are a kind of vitamin
        answer: They harm the body and are addictive
        why: Addictive means very hard to stop once started.
  items:
  - prompt: Which nutrient is most needed for growth of the body?
    options:
    - Protein
    - Fat
    - Sugar
    - Salt
    answer: Protein
    difficulty: 1
    hints:
    - Body-building food.
    - Dal, milk, eggs.
    solution: Proteins build the body.
    mistakes: {"Fat": "t7_protein", "Sugar": "t7_protein"}
  - prompt: 'Lack of iron in the diet can cause:'
    options:
    - Anaemia
    - Strong bones
    - Better eyesight
    - Taller height
    answer: Anaemia
    difficulty: 2
    hints:
    - Tiredness, pale skin.
    - Blood needs iron.
    solution: Too little iron causes anaemia.
    mistakes: {"Strong bones": "t7_iron_anaemia", "Taller height": "t7_iron_anaemia"}
  - prompt: Which food is a good source of iron?
    options:
    - Green leafy vegetables
    - White sugar
    - Soft drinks
    - Chips
    answer: Green leafy vegetables
    difficulty: 1
    hints:
    - Spinach.
    - Also jaggery.
    solution: Green leafy vegetables are rich in iron.
    mistakes: {"White sugar": "t7_iron_food", "Chips": "t7_iron_food"}
  - prompt: Which mineral keeps bones strong?
    options:
    - Calcium
    - Iodine
    - Sodium
    - Chlorine
    answer: Calcium
    difficulty: 1
    hints:
    - Found in milk.
    - Bones and teeth.
    solution: Calcium builds strong bones and teeth.
    mistakes: {"Iodine": "t7_calcium", "Sodium": "t7_calcium"}
  - prompt: Adolescents are advised to sleep 8 to 10 hours. What is the middle of this range, in hours?
    answer: '9'
    check: (8 + 10)/2
    difficulty: 1
    hints:
    - (8 + 10) ÷ 2.
    - Between 8 and 10.
    solution: (8 + 10) ÷ 2 = 9 hours.
    mistakes: {"18": "t7_middle_range", "2": "t7_middle_range"}
  - prompt: Why should adolescents avoid tobacco and alcohol?
    options:
    - They harm the body and are addictive
    - They help growth
    - They make you smarter
    - They improve sleep
    answer: They harm the body and are addictive
    difficulty: 1
    hints:
    - Addiction.
    - Damage to organs.
    solution: They damage health and are hard to give up.
    mistakes: {"They help growth": "t7_tobacco", "They improve sleep": "t7_tobacco"}
  - prompt: Which food is a good source of protein?
    options:
    - Dal
    - Sugar
    - Oil
    answer: Dal
    difficulty: 1
    hints:
    - Body-building foods.
    - Pulses and lentils.
    solution: Pulses like dal are rich in protein, needed for growth.
    mistakes:
      Sugar: c7s6_food_job
      Oil: c7s6_food_job
  - prompt: Which nutrient mainly gives us energy?
    options:
    - Carbohydrates
    - Calcium
    - Iron
    answer: Carbohydrates
    difficulty: 1
    hints:
    - Rice and roti are rich in it.
    - It is the body's main fuel.
    solution: Carbohydrates (rice, wheat, potatoes) are the main energy-giving foods.
    mistakes:
      Calcium: c7s6_food_job
      Iron: c7s6_food_job
  - prompt: 'Milk and ragi help build strong bones because they contain:'
    options:
    - Calcium
    - Fat only
    - Sugar
    answer: Calcium
    difficulty: 1
    hints:
    - Bones and teeth need a mineral.
    - It is plentiful in milk.
    solution: Calcium is the mineral that makes bones and teeth strong.
    mistakes:
      Fat only: c7s6_food_job
      Sugar: c7s6_food_job
  - prompt: How many hours of sleep do adolescents need each night?
    options:
    - 8 to 10 hours
    - 3 to 4 hours
    - 14 to 16 hours
    answer: 8 to 10 hours
    difficulty: 1
    hints:
    - Growing bodies need plenty of rest.
    - More than adults, less than babies.
    solution: Adolescents need about 8 to 10 hours of sleep for growth and concentration.
    mistakes:
      3 to 4 hours: c7s6_habits
      14 to 16 hours: c7s6_habits
  - prompt: Riya feels tired and looks pale. Her doctor says she lacks iron. Which food should she eat more?
    options:
    - Green leafy vegetables and jaggery
    - Chips and cold drinks
    - Only white rice
    answer: Green leafy vegetables and jaggery
    difficulty: 2
    hints:
    - Which foods are rich in iron?
    - Spinach is one.
    solution: Green leafy vegetables, jaggery and dates are good sources of iron, which helps prevent anaemia.
    mistakes:
      Chips and cold drinks: c7s6_food_job
      Only white rice: c7s6_food_job
  - prompt: Why is a diet of mostly chips and fizzy drinks harmful for growing children?
    options:
    - It lacks the proteins, vitamins and minerals needed for growth
    - It has too much protein
    - It has too much calcium
    answer: It lacks the proteins, vitamins and minerals needed for growth
    difficulty: 2
    hints:
    - What is in chips and soft drinks?
    - Mostly fat, salt and sugar.
    solution: Junk food is high in fat, salt and sugar but low in body-building and protective nutrients.
    mistakes:
      It has too much protein: c7s6_food_job
      It has too much calcium: c7s6_food_job
  - prompt: What does 'addictive' mean?
    options:
    - Very hard to stop once started
    - Good for health
    - Helps you grow
    answer: Very hard to stop once started
    difficulty: 2
    hints:
    - Tobacco and alcohol are addictive.
    - The body starts to crave them.
    solution: An addictive substance makes the body crave it, so it is very hard to stop using it.
    mistakes:
      Good for health: c7s6_habits
      Helps you grow: c7s6_habits
  - prompt: Which is a healthy daily habit for an adolescent?
    options:
    - Playing or exercising for an hour
    - Skipping breakfast every day
    - Sleeping only 5 hours
    answer: Playing or exercising for an hour
    difficulty: 2
    hints:
    - Which one helps the body grow strong?
    - Movement keeps muscles and bones healthy.
    solution: Daily exercise keeps the heart, muscles and bones healthy; skipping meals and sleep harms growth.
    mistakes:
      Skipping breakfast every day: c7s6_habits
      Sleeping only 5 hours: c7s6_habits
  - prompt: A friend offers you a cigarette 'just to try'. What is the wisest choice?
    options:
    - Say no and explain it harms the lungs and is addictive
    - Try it once, it cannot hurt
    - Take it to look grown-up
    answer: Say no and explain it harms the lungs and is addictive
