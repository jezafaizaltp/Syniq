  items:
  - prompt: Which nutrient is most needed for growth of the body?
    options:
    - Protein
    - Fat
    - Sugar
    - Salt
    answer: Protein
    difficulty: 1
    hints:
    - Body-building food.
    - Dal, milk, eggs.
    solution: "Proteins build and repair muscles and other body parts, so growing bodies need plenty of them."
    mistakes: {"Fat": "t7_protein", "Sugar": "t7_protein"}
  - prompt: 'Lack of iron in the diet can cause:'
    options:
    - Anaemia
    - Strong bones
    - Better eyesight
    - Taller height
    answer: Anaemia
    difficulty: 2
    hints:
    - Tiredness, pale skin.
    - Blood needs iron.
    solution: Too little iron causes anaemia.
    mistakes: {"Strong bones": "t7_iron_anaemia", "Taller height": "t7_iron_anaemia"}
  - prompt: Which food is a good source of iron?
    options:
    - Green leafy vegetables
    - White sugar
    - Soft drinks
    - Chips
    answer: Green leafy vegetables
    difficulty: 1
    hints:
    - Spinach.
    - Also jaggery.
    solution: Green leafy vegetables are rich in iron.
    mistakes: {"White sugar": "t7_iron_food", "Chips": "t7_iron_food"}
  - prompt: Which mineral keeps bones strong?
    options:
    - Calcium
    - Iodine
    - Sodium
    - Chlorine
    answer: Calcium
    difficulty: 1
    hints:
    - Found in milk.
    - Bones and teeth.
    solution: Calcium builds strong bones and teeth.
    mistakes: {"Iodine": "t7_calcium", "Sodium": "t7_calcium"}
  - prompt: Adolescents are advised to sleep 8 to 10 hours. What is the middle of this range, in hours?
    answer: '9'
    check: (8 + 10)/2
    difficulty: 1
    hints:
    - (8 + 10) ÷ 2.
    - Between 8 and 10.
    solution: (8 + 10) ÷ 2 = 9 hours.
    mistakes: {"18": "t7_middle_range", "2": "t7_middle_range"}
  - prompt: Why should adolescents avoid tobacco and alcohol?
    options:
    - "They harm the body and are addictive"
    - "They help the body grow taller"
    - "They make you smarter at school"
    - "They improve your sleep at night"
    answer: They harm the body and are addictive
    difficulty: 1
    hints:
    - Addiction.
    - Damage to organs.
    solution: They damage health and are hard to give up.
    mistakes: {"They help the body grow taller": "t7_tobacco", "They improve your sleep at night": "t7_tobacco"}
  - prompt: Which food is a good source of protein?
    options:
    - Dal
    - Sugar
    - Oil
    answer: Dal
    difficulty: 1
    hints:
    - Body-building foods.
    - Pulses and lentils.
    solution: Pulses like dal are rich in protein, needed for growth.
    mistakes:
      Sugar: c7s6_food_job
      Oil: c7s6_food_job
  - prompt: Which nutrient mainly gives us energy?
    options:
    - Carbohydrates
    - Calcium
    - Iron
    answer: Carbohydrates
    difficulty: 1
    hints:
    - Rice and roti are rich in it.
    - It is the body's main fuel.
    solution: Carbohydrates (rice, wheat, potatoes) are the main energy-giving foods.
    mistakes:
      Calcium: c7s6_food_job
      Iron: c7s6_food_job
  - prompt: 'Milk and ragi help build strong bones because they contain:'
    options:
    - Calcium
    - Fat only
    - Sugar
    answer: Calcium
    difficulty: 1
    hints:
    - Bones and teeth need a mineral.
    - It is plentiful in milk.
    solution: Calcium is the mineral that makes bones and teeth strong.
    mistakes:
      Fat only: c7s6_food_job
      Sugar: c7s6_food_job
  - prompt: How many hours of sleep do adolescents need each night?
    options:
    - 8 to 10 hours
    - 3 to 4 hours
    - 14 to 16 hours
    answer: 8 to 10 hours
    difficulty: 1
    hints:
    - Growing bodies need plenty of rest.
    - More than adults, less than babies.
    solution: Adolescents need about 8 to 10 hours of sleep for growth and concentration.
    mistakes:
      3 to 4 hours: c7s6_habits
      14 to 16 hours: c7s6_habits
  - prompt: Riya feels tired and looks pale. Her doctor says she lacks iron. Which food should she eat more?
    options:
    - "Green leafy vegetables and jaggery"
    - "Chips and cold fizzy drinks"
    - "Only plain white rice and bread"
    answer: Green leafy vegetables and jaggery
    difficulty: 2
    hints:
    - Which foods are rich in iron?
    - Spinach is one.
    solution: Green leafy vegetables, jaggery and dates are good sources of iron, which helps prevent anaemia.
    mistakes:
      "Chips and cold fizzy drinks": c7s6_food_job
      "Only plain white rice and bread": c7s6_food_job
  - prompt: Why is a diet of mostly chips and fizzy drinks harmful for growing children?
    options:
    - "It lacks the proteins, vitamins and minerals needed for growth"
    - "It has far too much protein for a growing body to use"
    - "It has too much calcium, which makes bones too hard"
    answer: It lacks the proteins, vitamins and minerals needed for growth
    difficulty: 2
    hints:
    - What is in chips and soft drinks?
    - Mostly fat, salt and sugar.
    solution: Junk food is high in fat, salt and sugar but low in body-building and protective nutrients.
    mistakes:
      "It has far too much protein for a growing body to use": c7s6_food_job
      "It has too much calcium, which makes bones too hard": c7s6_food_job
  - prompt: What does 'addictive' mean?
    options:
    - "Very hard to stop once started"
    - "Good for health in every way"
    - "Helps you grow taller faster"
    answer: Very hard to stop once started
    difficulty: 2
    hints:
    - Tobacco and alcohol are addictive.
    - The body starts to crave them.
    solution: An addictive substance makes the body crave it, so it is very hard to stop using it.
    mistakes:
      "Good for health in every way": c7s6_habits
      "Helps you grow taller faster": c7s6_habits
  - prompt: Which is a healthy daily habit for an adolescent?
    options:
    - "Playing or exercising for an hour"
    - "Skipping breakfast most days"
    - "Sleeping only 5 hours"
    answer: Playing or exercising for an hour
    difficulty: 2
    hints:
    - Which one helps the body grow strong?
    - Movement keeps muscles and bones healthy.
    solution: Daily exercise keeps the heart, muscles and bones healthy; skipping meals and sleep harms growth.
    mistakes:
      "Skipping breakfast most days": c7s6_habits
      "Sleeping only 5 hours": c7s6_habits
  - prompt: A friend offers you a cigarette 'just to try'. What is the wisest choice?
    options:
    - "Say no and explain it harms the lungs and is addictive"
    - "Try it just once, since a single one cannot hurt"
    - "Take it so that you look more grown-up to others"
    answer: Say no and explain it harms the lungs and is addictive
    difficulty: 3
    hints:
    - What does tobacco do to the body?
    - Why is 'just once' risky?
    solution: Tobacco damages the lungs and is addictive, so even 'just once' can lead to a habit.
    mistakes:
      "Try it just once, since a single one cannot hurt": c7s6_habits
      "Take it so that you look more grown-up to others": c7s6_habits
  - prompt: Why do adolescents need more food than younger children?
    options:
    - "They are growing fast and are more active"
    - "They have smaller bodies that need filling"
    - "They do not need any sleep, so they need food"
    answer: They are growing fast and are more active
    difficulty: 3
    hints:
    - Think about the growth spurt.
    - Building new body tissue needs raw material.
    solution: Fast growth and activity need more energy and more body-building nutrients.
    mistakes:
      "They have smaller bodies that need filling": c7s6_food_job
      "They do not need any sleep, so they need food": c7s6_habits
  - prompt: Sana spends 7 hours a day on her phone and sleeps late. What might help her most?
    options:
    - "Limit screen time and keep a regular bedtime"
    - "Use the phone even longer, until she is tired"
    - "Skip meals so that she has more time to sleep"
    answer: Limit screen time and keep a regular bedtime
    difficulty: 3
    hints:
    - What does too much screen time take away?
    - Sleep matters for growth and mood.
    solution: Less screen time and a regular bedtime protect sleep, mood and concentration.
    mistakes:
      "Use the phone even longer, until she is tired": c7s6_habits
      "Skip meals so that she has more time to sleep": c7s6_food_job
  - prompt: 'Assertion (A): Adolescents should eat iron-rich foods such as green leafy vegetables.

      Reason (R): Iron keeps the blood healthy and prevents anaemia.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. A fast-growing body needs iron for healthy blood, which is why such foods are advised; R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Junk food such as chips gives the body all the nutrients it needs.

      Reason (R): A growing body needs proteins, vitamins and minerals.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: chips fill the stomach but lack most of the nutrients named in R. R is true.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A 13-year-old''s usual day is: no breakfast, chips and a fizzy drink at school, instant noodles for dinner, and sleep at 1 a.m. after watching videos. The student feels tired and cannot concentrate. Which change would help most?'
    options:
    - "Regular balanced meals with dal, vegetables and fruit, and 8 to 10 hours of sleep"
    - "An extra fizzy drink in the afternoon for more energy, and fewer hours of sleep"
    - "Skipping dinner as well, so that the body gets used to eating less every day"
    answer: Regular balanced meals with dal, vegetables and fruit, and 8 to 10 hours of sleep
    hints:
    - Which nutrients are missing from this day's food?
    - How much sleep does an adolescent need?
    solution: The diet lacks proteins, vitamins and minerals, and the sleep is far too short. Balanced meals and 8 to 10 hours of sleep deal with both causes of the tiredness.
    mistakes:
      "An extra fizzy drink in the afternoon for more energy, and fewer hours of sleep": c7s6_food_job
      "Skipping dinner as well, so that the body gets used to eating less every day": c7s6_habits
    exam: case
    difficulty: 2
  - prompt: 'Situation: A plate holds rice, potato curry and a sweet. Which addition would best make the meal balanced for a growing adolescent?'
    options:
    - "Dal and a green leafy vegetable, for protein and iron"
    - "More rice and potato, for extra energy and filling"
    - "A second sweet and some fried snacks, for taste"
    answer: Dal and a green leafy vegetable, for protein and iron
    hints:
    - Which food groups are already on the plate?
    - Which jobs, such as body-building, are not yet covered?
    solution: 'Rice, potato and a sweet all mainly give energy. The plate lacks a body-builder and protectors: dal adds protein and leafy greens add iron and vitamins.'
    mistakes:
      "More rice and potato, for extra energy and filling": c7s6_food_job
      "A second sweet and some fried snacks, for taste": c7s6_food_job
