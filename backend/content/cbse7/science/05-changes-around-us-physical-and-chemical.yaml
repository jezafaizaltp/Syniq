# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 5. Format: content/README.md.
subject: cbse7-sci
chapter: 5
title: 'Changes Around Us: Physical and Chemical'
tips:
  c7s_new_substance: 'Ask: is a new substance formed? If yes, it is a chemical change; if not, physical.'
  t7_chemical_change: "Rust is a new substance, different from iron."
  t7_chemical_example: "Can you un-cook an egg? Melted butter can be cooled back."
  t7_crystallisation: "Neutralisation mixes an acid and a base; galvanisation coats iron with zinc. Growing pure solid crystals from a solution has its own name."
  t7_cutting_paper: "The pieces are still paper. Is any new substance made?"
  t7_expansion: "Steel rails get longer in summer heat. What happens if there's no room?"
  t7_galvanise: "Coating iron with zinc has a name starting with 'galvan-'."
  t7_no_new_substance: "The key test: is a new substance formed?"
  t7_physical_change: "A physical change makes no new substance. Can you get the sugar back?"
  t7_rust_needs: "Iron in dry air doesn't rust, and nor does iron in boiled water with no air. It needs both."
  t7_vinegar_soda: "The fizz you see is a gas that puts out flames. Which one?"
  c7s5_new: 'Ask one question: is there a brand-new substance at the end, or is it the same substance in a new shape, size or state?'
  c7s5_signs: 'Signs that something new has formed: a colour change, gas bubbles, heat or light, a new smell, or a solid appearing in a liquid.'
  c7s5_reverse: Can you easily get the starting material back, for example by cooling, drying or melting? If yes, it is probably the kind of change with nothing new formed.
  c7s5_crystal: Pure solid pieces with a regular shape can be grown by cooling a hot, strong solution and letting it stand.
  c7s5_heat: Most solids get slightly bigger when heated and smaller when cooled. Builders leave room for this.
concepts:
- code: cbse7s.change.physical
  title: Physical changes
  notes: |
    In a physical change, a substance changes shape, size or state but no new substance forms, and the change
    can often be reversed: melting ice, freezing water, dissolving sugar, cutting paper, stretching a spring.
    Crystallisation (getting pure crystals from a solution by cooling, as with salt or copper sulfate) is a
    physical change. Expansion of metals on heating is physical; that is why rails have gaps.
  explanations:
    text: A physical change alters how something looks, its shape or its state, but no new substance forms. Ice melting to water is still water; it can freeze again.
    visual: 'Picture ice cubes melting into a puddle, then the puddle placed in the freezer becoming ice again: the same substance throughout.'
    step_by_step: 'Step 1: Ask: is a new substance formed? Step 2: If not, it is physical. Step 3: Check if it can be reversed. Step 4: Name what changed: shape, size or state.'
    real_world: Railway lines have small gaps because the steel expands in summer heat, a physical change.
  picture:
    kind: flow
    steps:
    - Ice (solid)
    - 'Heat: melts'
    - Water (liquid)
    - 'Cool: freezes'
    - 'Ice again: same substance'
    alt: 'A physical change: ice melts to water and freezes back to ice, with no new substance formed.'
  activity:
    type: sort
    prompt: Is a new substance made?
    bins:
    - Physical change
    - Chemical change
    items:
    - label: Ice melting
      bin: Physical change
      clue: Is it still water?
      why: Only its state changes.
    - label: Cutting paper into pieces
      bin: Physical change
      clue: Still paper?
      why: Only its size and shape.
    - label: Dissolving sugar in water
      bin: Physical change
      clue: 'Evaporate the water: is the sugar back?'
      why: The sugar is still there.
    - label: Stretching a rubber band
      bin: Physical change
      clue: 'Let go: does it go back?'
      why: Shape only.
    - label: Folding a paper boat
      bin: Physical change
      clue: Unfold it.
      why: Still the same paper.
    - label: Burning paper
      bin: Chemical change
      clue: Can you get the paper back from ash?
      why: 'New substances: ash, smoke, gases.'
    - label: Cooking an egg
      bin: Chemical change
      clue: Can it ever be raw again?
      why: The proteins have changed.
    - label: Iron rusting
      bin: Chemical change
      clue: Rust is a new, flaky substance.
      why: Iron oxide forms.
  lesson:
    - teach: 'In a physical change, a substance changes its shape, size or state, but no new substance forms. Ice melting into water is still water. Many physical changes can be reversed: freeze the water and you have ice again.'
      picture:
        kind: flow
        steps:
        - Ice (solid water)
        - melts
        - Water (liquid)
        - freezes
        - Ice again
        alt: 'Ice melting and water freezing: still the same substance, water.'
      check:
        prompt: 'Folding a sheet of paper into a boat is:'
        options:
        - A physical change
        - A chemical change
        answer: A physical change
        why: It is still paper, just a new shape.
    - teach: 'Dissolving sugar in water is physical: evaporate the water and the sugar is left. Crystallisation is a physical change used to get pure crystals: dissolve salt or copper sulfate in hot water, let it cool, and crystals with regular shapes form.'
      picture:
        kind: flow
        steps:
        - Dissolve in hot water
        - Filter
        - Leave to cool slowly
        - Pure crystals form
        alt: Steps of crystallisation.
      check:
        prompt: 'Getting pure copper sulfate crystals by cooling its solution is called:'
        options:
        - Crystallisation
        - Rusting
        - Burning
        answer: Crystallisation
        why: Crystals form from the solution as it cools.
    - teach: Heating makes most solids expand slightly; cooling makes them contract. Railway tracks have small gaps so the steel rails can expand on hot days without bending. A blacksmith heats an iron ring before fitting it on a wooden wheel; as it cools it shrinks and grips tightly.
      check:
        prompt: Why are small gaps left between railway rails?
        options:
        - Rails expand when they get hot
        - To save steel
        - So trains go faster
        answer: Rails expand when they get hot
        why: Without gaps they would push each other and bend.
  items:
  - prompt: 'Melting of ice is:'
    options:
    - A physical change
    - A chemical change
    - Rusting
    - Burning
    answer: A physical change
    difficulty: 1
    hints:
    - Still water.
    - It can freeze again.
    solution: 'No new substance forms: physical.'
    mistakes:
      A chemical change: c7s_new_substance
  - prompt: Which is a physical change?
    options:
    - Dissolving sugar in water
    - Burning paper
    - Rusting of iron
    - Cooking an egg
    answer: Dissolving sugar in water
    difficulty: 1
    hints:
    - The sugar can be recovered.
    - No new substance.
    solution: Dissolving sugar forms no new substance.
    mistakes: {"Burning paper": "t7_physical_change", "Rusting of iron": "t7_physical_change"}
  - prompt: Why are gaps left between rails?
    options:
    - Steel expands when heated
    - To save steel
    - For drainage
    - To make noise
    answer: Steel expands when heated
    difficulty: 2
    hints:
    - Summer heat.
    - Expansion.
    solution: Rails expand in heat; gaps stop them bending.
    mistakes: {"To save steel": "t7_expansion", "For drainage": "t7_expansion"}
  - prompt: 'Getting pure crystals of salt from its solution is called:'
    options:
    - Crystallisation
    - Rusting
    - Neutralisation
    - Galvanisation
    answer: Crystallisation
    difficulty: 1
    hints:
    - Crystals form on cooling.
    - Physical change.
    solution: This is crystallisation.
    mistakes: {"Neutralisation": "t7_crystallisation", "Galvanisation": "t7_crystallisation"}
  - prompt: 'Cutting paper into pieces is:'
    options:
    - A physical change
    - A chemical change
    - Both
    - Neither
    answer: A physical change
    difficulty: 1
    hints:
    - Still paper.
    - Only size changed.
    solution: Only the size changes.
    mistakes: {"A chemical change": "t7_cutting_paper", "Both": "t7_cutting_paper"}
  - prompt: Which feature is typical of a physical change?
    options:
    - No new substance is formed
    - Heat and light are always given out
    - Gas is always produced
    - It is always permanent
    answer: No new substance is formed
    difficulty: 2
    hints:
    - What stays the same?
    - The substance itself.
    solution: In a physical change the substance stays the same.
    mistakes: {"Heat and light are always given out": "t7_no_new_substance", "Gas is always produced": "t7_no_new_substance"}
  - prompt: 'Breaking a glass bottle into pieces is:'
    options:
    - A physical change
    - A chemical change
    - Not a change
    answer: A physical change
    difficulty: 1
    hints:
    - Are the pieces still glass?
    - Only the size and shape changed.
    solution: The pieces are still glass; only the shape and size changed, so it is physical.
    mistakes:
      A chemical change: c7s5_new
      Not a change: c7s5_new
  - prompt: 'Water boiling into steam is:'
    options:
    - A physical change
    - A chemical change
    - Rusting
    answer: A physical change
    difficulty: 1
    hints:
    - Steam is water as a gas.
    - Cool it and you get water back.
    solution: Steam is still water, only in a different state, so it is a physical change.
    mistakes:
      A chemical change: c7s5_new
      Rusting: c7s5_new
  - prompt: Which change can be easily reversed?
    options:
    - Melting wax
    - Burning paper
    - Cooking rice
    answer: Melting wax
    difficulty: 1
    hints:
    - Which one can you undo by cooling?
    - Burnt paper cannot become paper again.
    solution: Melted wax becomes solid wax again when cooled; burning and cooking form new substances.
    mistakes:
      Burning paper: c7s5_reverse
      Cooking rice: c7s5_reverse
  - prompt: 'Stretching a rubber band is:'
    options:
    - A physical change
    - A chemical change
    - Crystallisation
    answer: A physical change
    difficulty: 1
    hints:
    - 'Let go: what happens?'
    - Is it still rubber?
    solution: The band only changes shape and returns when released; no new substance forms.
    mistakes:
      A chemical change: c7s5_new
      Crystallisation: c7s5_crystal
  - prompt: Salt dissolved in water is heated until all the water evaporates. What is left?
    options:
    - Salt
    - Nothing
    - A new substance
    answer: Salt
    difficulty: 2
    hints:
    - Dissolving does not destroy the salt.
    - Only the water leaves as vapour.
    solution: Dissolving is physical; when the water evaporates, the same salt is left behind.
    mistakes:
      Nothing: c7s5_reverse
      A new substance: c7s5_new
  - prompt: Why does a blacksmith heat an iron rim before fitting it on a wooden wheel?
    options:
    - Heated iron expands; on cooling it shrinks and fits tightly
    - Heat makes iron a new substance
    - Hot iron is lighter
    answer: Heated iron expands; on cooling it shrinks and fits tightly
    difficulty: 2
    hints:
    - What does heat do to the size of iron?
    - What happens as it cools?
    solution: The rim expands when hot, slips on easily, then contracts as it cools to grip the wheel.
    mistakes:
      Heat makes iron a new substance: c7s5_new
      Hot iron is lighter: c7s5_heat
  - prompt: Why are crystals made by crystallisation purer than salt from simple evaporation?
    options:
    - Impurities stay behind in the liquid
    - Crystallisation adds new chemicals
    - Evaporation makes salt disappear
    answer: Impurities stay behind in the liquid
    difficulty: 2
    hints:
    - Evaporation leaves everything dissolved behind.
    - Crystals grow from just one substance.
    solution: As crystals grow, impurities remain dissolved in the leftover liquid, so the crystals are pure.
    mistakes:
      Crystallisation adds new chemicals: c7s5_crystal
      Evaporation makes salt disappear: c7s5_crystal
  - prompt: Electric wires sag more on hot summer days. Why?
    options:
    - The metal expands in the heat and becomes longer
    - The wires melt
    - The wires turn into new metal
    answer: The metal expands in the heat and becomes longer
    difficulty: 2
    hints:
    - What does heat do to metals?
    - Longer wire between two poles hangs lower.
    solution: Heat makes the wire expand slightly, so it is longer and sags; in cold it contracts.
    mistakes:
      The wires melt: c7s5_heat
      The wires turn into new metal: c7s5_new
  - prompt: Which list has only physical changes?
    options:
    - Melting butter, tearing paper, dissolving salt
    - Burning wood, melting ice, rusting
    - Cooking an egg, cutting paper, curdling milk
    answer: Melting butter, tearing paper, dissolving salt
    difficulty: 3
    hints:
    - Check each change in each list.
    - Look for any new substance.
    solution: Melting, tearing and dissolving form nothing new. The other lists include burning, rusting, cooking or curdling, which are chemical.
    mistakes:
      Burning wood, melting ice, rusting: c7s5_new
      Cooking an egg, cutting paper, curdling milk: c7s5_new
  - prompt: Is every change that cannot be reversed a chemical change? Think of cutting a tree trunk into logs.
    options:
    - No, cutting cannot be undone but forms no new substance
    - Yes, always
    - Yes, because wood is natural
    answer: No, cutting cannot be undone but forms no new substance
    difficulty: 3
    hints:
    - What is the real test for a chemical change?
    - Are logs still wood?
    solution: The key test is a new substance. Logs are still wood, so cutting is physical even though you cannot join them back.
    mistakes:
      Yes, always: c7s5_reverse
      Yes, because wood is natural: c7s5_new
  - prompt: A sea-salt maker lets sea water dry in shallow pans. What kind of change takes place?
    options:
    - 'Physical: water evaporates and salt is left'
    - 'Chemical: salt is made from water'
    - 'Chemical: the sun burns the water'
    answer: 'Physical: water evaporates and salt is left'
    difficulty: 3
    hints:
    - Was the salt already in the sea water?
    - What does the sun do to the water?
    solution: The salt was already dissolved; evaporation removes the water. No new substance forms.
    mistakes:
      'Chemical: salt is made from water': c7s5_new
      'Chemical: the sun burns the water': c7s5_new
- code: cbse7s.change.chemical
  title: Chemical changes
  after:
  - cbse7s.change.physical
  notes: |
    In a chemical change, one or more new substances form; it is usually not easily reversed. Signs: change of
    colour, gas given off, heat or light produced, new smell, a precipitate. Examples: burning of wood or a
    candle wick, rusting of iron (iron + oxygen + water → rust), cooking food, curdling of milk, ripening of
    fruit, vinegar + baking soda (fizzing carbon dioxide). Galvanisation (coating iron with zinc) prevents
    rusting. A burning candle shows both: melting wax (physical) and burning wax (chemical).
  explanations:
    text: A chemical change makes a new substance, and usually cannot be undone. Burning wood makes ash and smoke; rusting iron makes rust; mixing vinegar and baking soda makes bubbles of a new gas.
    visual: 'Picture vinegar poured onto baking soda: it fizzes and bubbles. The bubbles are carbon dioxide, a gas that wasn''t there before.'
    step_by_step: 'Step 1: Look for signs: new colour, gas, heat or light, smell. Step 2: Ask whether a new substance has formed. Step 3: Ask whether it can be reversed easily. Step 4: Decide physical or chemical.'
    real_world: Iron bridges and gates are galvanised (coated with zinc) to stop the chemical change of rusting.
  picture:
    kind: compare
    columns:
    - title: Physical change
      points:
      - No new substance
      - Often reversible
      - Melting, dissolving, cutting
    - title: Chemical change
      points:
      - New substance formed
      - Usually irreversible
      - Burning, rusting, cooking
    alt: Physical changes form no new substance and are often reversible; chemical changes form new substances and usually cannot be undone.
  activity:
    type: sort
    prompt: A chemical change made something new. Which sign shows it?
    bins:
    - Gas given off
    - Colour change
    - New solid formed
    - Heat or light given out
    items:
    - label: Vinegar poured on baking soda
      bin: Gas given off
      clue: What are the bubbles?
      why: Carbon dioxide gas.
    - label: An antacid tablet fizzing in water
      bin: Gas given off
      clue: Bubbles rise.
      why: A gas forms.
    - label: A cut apple turning brown
      bin: Colour change
      clue: Look at the surface after a while.
      why: A new brown substance.
    - label: An iron nail in blue copper sulphate solution
      bin: Colour change
      clue: The blue fades to green; the nail looks brown.
      why: New substances form.
    - label: Breathing out into lime water
      bin: New solid formed
      clue: It turns milky.
      why: Chalky calcium carbonate forms.
    - label: Burning wood leaving ash
      bin: New solid formed
      clue: What's left behind?
      why: Ash is a new solid.
    - label: A firecracker going off
      bin: Heat or light given out
      clue: A flash and a bang.
      why: Energy is released.
    - label: A candle flame
      bin: Heat or light given out
      clue: Wax burning.
      why: Heat and light come out.
  lesson:
    - teach: In a chemical change, one or more new substances form, and usually you cannot easily get the old ones back. Burning wood makes ash, smoke and gases; you cannot turn ash back into wood.
      picture:
        kind: compare
        columns:
        - title: Physical change
          points:
          - no new substance
          - often reversible
          - melting, dissolving, cutting
        - title: Chemical change
          points:
          - new substance forms
          - hard to reverse
          - burning, rusting, cooking
        alt: Physical and chemical changes compared.
      check:
        prompt: 'Burning a matchstick is:'
        options:
        - A chemical change
        - A physical change
        answer: A chemical change
        why: New substances (ash, smoke, gases) form.
    - teach: 'Signs of a chemical change: a colour change, gas bubbles, heat or light given out, a new smell, or a solid forming in a liquid. Vinegar on baking soda fizzes because carbon dioxide gas forms. Milk curdling, fruit ripening and food cooking are chemical changes.'
      picture:
        kind: flow
        steps:
        - Vinegar + baking soda
        - Fizzing bubbles
        - Carbon dioxide gas forms
        - 'A new substance: chemical change'
        alt: Vinegar and baking soda react, giving off carbon dioxide.
      check:
        prompt: Which is a sign of a chemical change?
        options:
        - Gas bubbles forming when two liquids mix
        - Ice changing shape
        - Paper being folded
        answer: Gas bubbles forming when two liquids mix
        why: A gas is a new substance.
    - teach: 'Rusting: iron + oxygen + water → rust (iron oxide), a new reddish-brown substance. Galvanising (coating iron with zinc) and painting prevent it. A burning candle shows both kinds: wax melting is physical; wax burning in the flame is chemical.'
      check:
        prompt: In a burning candle, which is a physical change?
        options:
        - Wax melting
        - Wax burning
        - Smoke forming
        answer: Wax melting
        why: Melted wax becomes solid wax again.
  items:
  - prompt: 'Rusting of iron is:'
    options:
    - A chemical change
    - A physical change
    - Melting
    - Crystallisation
    answer: A chemical change
    difficulty: 1
    hints:
    - A new substance, rust, forms.
    - Cannot be undone easily.
    solution: 'Rust is a new substance: chemical change.'
    mistakes: {"A physical change": "t7_chemical_change", "Melting": "t7_chemical_change"}
  - prompt: What gas is produced when vinegar reacts with baking soda?
    options:
    - Carbon dioxide
    - Oxygen
    - Hydrogen
    - Nitrogen
    answer: Carbon dioxide
    difficulty: 2
    hints:
    - It puts out flames.
    - Bubbles.
    solution: The fizz is carbon dioxide.
    mistakes: {"Oxygen": "t7_vinegar_soda", "Hydrogen": "t7_vinegar_soda"}
  - prompt: What does iron need to rust?
    options:
    - Oxygen and water
    - Only heat
    - Only light
    - Only salt
    answer: Oxygen and water
    difficulty: 2
    hints:
    - Moist air.
    - Two things.
    solution: Iron rusts when it meets both oxygen and moisture.
    mistakes: {"Only heat": "t7_rust_needs", "Only salt": "t7_rust_needs"}
  - prompt: 'Coating iron with zinc to prevent rusting is called:'
    options:
    - Galvanisation
    - Crystallisation
    - Neutralisation
    - Evaporation
    answer: Galvanisation
    difficulty: 1
    hints:
    - Zinc coat.
    - Used for buckets and pipes.
    solution: Coating with zinc is galvanisation.
    mistakes: {"Crystallisation": "t7_galvanise", "Neutralisation": "t7_galvanise"}
  - prompt: Which of these is a chemical change?
    options:
    - Cooking an egg
    - Melting butter
    - Breaking glass
    - Folding cloth
    answer: Cooking an egg
    difficulty: 1
    hints:
    - Can it be uncooked?
    - New substances form.
    solution: Cooking changes the egg permanently.
    mistakes: {"Melting butter": "t7_chemical_example", "Breaking glass": "t7_chemical_example"}
  - prompt: In a burning candle, which part is a chemical change?
    options:
    - The wax burning
    - The wax melting
    - The wax dripping
    - The wick bending
    answer: The wax burning
    difficulty: 2
    hints:
    - Melting is physical.
    - Burning makes new gases.
    solution: 'Burning wax forms carbon dioxide and water: chemical. Melting is physical.'
    mistakes:
      The wax melting: c7s_new_substance
  - prompt: 'Cooking a chapati is:'
    options:
    - A chemical change
    - A physical change
    - Crystallisation
    answer: A chemical change
    difficulty: 1
    hints:
    - Can you get the dough back?
    - Colour, smell and taste change.
    solution: Cooking forms new substances with new colour and smell; it cannot be undone.
    mistakes:
      A physical change: c7s5_new
      Crystallisation: c7s5_crystal
  - prompt: 'Curdling of milk into curd is:'
    options:
    - A chemical change
    - A physical change
    - Melting
    answer: A chemical change
    difficulty: 1
    hints:
    - Can curd become milk again?
    - Its taste becomes sour.
    solution: Curd is a new substance with a new taste; it cannot be changed back to milk.
    mistakes:
      A physical change: c7s5_reverse
      Melting: c7s5_new
  - prompt: Which gas forms when vinegar is poured on baking soda?
    options:
    - Carbon dioxide
    - Oxygen
    - Nitrogen
    answer: Carbon dioxide
    difficulty: 1
    hints:
    - It is the gas in fizzy drinks.
    - It puts out flames.
    solution: The fizzing comes from carbon dioxide gas made in the reaction.
    mistakes:
      Oxygen: c7s5_signs
      Nitrogen: c7s5_signs
  - prompt: 'A cut apple turns brown in air. This is:'
    options:
    - A chemical change
    - A physical change
    - Evaporation
    answer: A chemical change
    difficulty: 1
    hints:
    - The colour changed.
    - Something in the apple reacted with air.
    solution: The browning is a new substance formed when the apple's surface reacts with oxygen.
    mistakes:
      A physical change: c7s5_signs
      Evaporation: c7s5_signs
  - prompt: Which of these does NOT show that a chemical change has happened?
    options:
    - A change in shape
    - A change in colour
    - Gas being given off
    answer: A change in shape
    difficulty: 2
    hints:
    - Which one happens when you fold paper?
    - Shape changes form nothing new.
    solution: Colour change and gas are signs of a new substance; a shape change alone is physical.
    mistakes:
      A change in colour: c7s5_signs
      Gas being given off: c7s5_signs
  - prompt: 'Rust is a new substance formed from iron, oxygen and:'
    options:
    - Water
    - Salt
    - Sunlight
    answer: Water
    difficulty: 2
    hints:
    - Iron rusts quickly in rain.
    - Moist air.
    solution: Iron reacts with oxygen and water (moisture) to form rust.
    mistakes:
      Salt: c7s5_signs
      Sunlight: c7s5_signs
  - prompt: Why is galvanised iron used for water buckets?
    options:
    - Its zinc coating stops the iron rusting
    - Zinc makes the bucket lighter
    - It turns water into steam
    answer: Its zinc coating stops the iron rusting
    difficulty: 2
    hints:
    - Buckets hold water all the time.
    - What does the coating do?
    solution: Zinc keeps air and water off the iron, so the bucket does not rust.
    mistakes:
      Zinc makes the bucket lighter: c7s5_signs
      It turns water into steam: c7s5_new
  - prompt: Lime water turns milky when carbon dioxide is bubbled through it. What does the milkiness show?
    options:
    - 'A new solid has formed: a chemical change'
    - The lime water froze
    - Nothing new happened
    answer: 'A new solid has formed: a chemical change'
    difficulty: 2
    hints:
    - Milky means tiny solid bits appeared.
    - Is that solid new?
    solution: The milkiness is a new insoluble solid (calcium carbonate), a sign of a chemical change.
    mistakes:
      The lime water froze: c7s5_signs
      Nothing new happened: c7s5_signs
  - prompt: When a candle burns, which two changes happen?
    options:
    - Wax melts (physical) and wax burns (chemical)
    - Only physical changes
    - Only chemical changes
    answer: Wax melts (physical) and wax burns (chemical)
    difficulty: 3
    hints:
    - Look at the wax near the flame.
    - Look at what the flame does to the wax vapour.
    solution: Melting wax forms no new substance; burning wax forms carbon dioxide, water vapour, heat and light.
    mistakes:
      Only physical changes: c7s5_new
      Only chemical changes: c7s5_reverse
  - prompt: Ripening of a mango changes it from green and sour to yellow and sweet. What kind of change is it?
    options:
    - Chemical, because new substances form
    - Physical, because it is still a mango
    - Neither
    answer: Chemical, because new substances form
    difficulty: 3
    hints:
    - Colour and taste changed.
    - Can the mango become raw again?
    solution: New substances form (sugars, new colours), and it cannot be reversed, so it is chemical.
    mistakes:
      Physical, because it is still a mango: c7s5_new
      Neither: c7s5_signs
  - prompt: Why do iron objects near the sea rust faster?
    options:
    - Moist, salty air speeds up rusting
