# CBSE Class 7 Science (NCERT Curiosity, 2024-25), chapter 5. Format: content/README.md.
subject: cbse7-sci
chapter: 5
title: 'Changes Around Us: Physical and Chemical'
tips:
  c7s_new_substance: 'Ask: is a new substance formed? If yes, it is a chemical change; if not, physical.'
concepts:
- code: cbse7s.change.physical
  title: Physical changes
  notes: |
    In a physical change, a substance changes shape, size or state but no new substance forms, and the change
    can often be reversed: melting ice, freezing water, dissolving sugar, cutting paper, stretching a spring.
    Crystallisation (getting pure crystals from a solution by cooling, as with salt or copper sulfate) is a
    physical change. Expansion of metals on heating is physical; that is why rails have gaps.
  explanations:
    text: A physical change alters how something looks, its shape or its state, but no new substance forms. Ice melting to water is still water; it can freeze again.
    visual: 'Picture ice cubes melting into a puddle, then the puddle placed in the freezer becoming ice again: the same substance throughout.'
    step_by_step: 'Step 1: Ask: is a new substance formed? Step 2: If not, it is physical. Step 3: Check if it can be reversed. Step 4: Name what changed: shape, size or state.'
    real_world: Railway lines have small gaps because the steel expands in summer heat, a physical change.
  picture:
    kind: flow
    steps:
    - Ice (solid)
    - 'Heat: melts'
    - Water (liquid)
    - 'Cool: freezes'
    - 'Ice again: same substance'
    alt: 'A physical change: ice melts to water and freezes back to ice, with no new substance formed.'
  items:
  - prompt: 'Melting of ice is:'
    options:
    - A physical change
    - A chemical change
    - Rusting
    - Burning
    answer: A physical change
    difficulty: 1
    hints:
    - Still water.
    - It can freeze again.
    solution: 'No new substance forms: physical.'
    mistakes:
      A chemical change: c7s_new_substance
  - prompt: Which is a physical change?
    options:
    - Dissolving sugar in water
    - Burning paper
    - Rusting of iron
    - Cooking an egg
    answer: Dissolving sugar in water
    difficulty: 1
    hints:
    - The sugar can be recovered.
    - No new substance.
    solution: Dissolving sugar forms no new substance.
  - prompt: Why are gaps left between rails?
    options:
    - Steel expands when heated
    - To save steel
    - For drainage
    - To make noise
    answer: Steel expands when heated
    difficulty: 2
    hints:
    - Summer heat.
    - Expansion.
    solution: Rails expand in heat; gaps stop them bending.
  - prompt: 'Getting pure crystals of salt from its solution is called:'
    options:
    - Crystallisation
    - Rusting
    - Neutralisation
    - Galvanisation
    answer: Crystallisation
    difficulty: 1
    hints:
    - Crystals form on cooling.
    - Physical change.
    solution: This is crystallisation.
  - prompt: 'Cutting paper into pieces is:'
    options:
    - A physical change
    - A chemical change
    - Both
    - Neither
    answer: A physical change
    difficulty: 1
    hints:
    - Still paper.
    - Only size changed.
    solution: Only the size changes.
  - prompt: Which feature is typical of a physical change?
    options:
    - No new substance is formed
    - Heat and light are always given out
    - Gas is always produced
    - It is always permanent
    answer: No new substance is formed
    difficulty: 2
    hints:
    - What stays the same?
    - The substance itself.
    solution: In a physical change the substance stays the same.
- code: cbse7s.change.chemical
  title: Chemical changes
  after:
  - cbse7s.change.physical
  notes: |
    In a chemical change, one or more new substances form; it is usually not easily reversed. Signs: change of
    colour, gas given off, heat or light produced, new smell, a precipitate. Examples: burning of wood or a
    candle wick, rusting of iron (iron + oxygen + water → rust), cooking food, curdling of milk, ripening of
    fruit, vinegar + baking soda (fizzing carbon dioxide). Galvanisation (coating iron with zinc) prevents
    rusting. A burning candle shows both: melting wax (physical) and burning wax (chemical).
  explanations:
    text: A chemical change makes a new substance, and usually cannot be undone. Burning wood makes ash and smoke; rusting iron makes rust; mixing vinegar and baking soda makes bubbles of a new gas.
    visual: 'Picture vinegar poured onto baking soda: it fizzes and bubbles. The bubbles are carbon dioxide, a gas that wasn''t there before.'
    step_by_step: 'Step 1: Look for signs: new colour, gas, heat or light, smell. Step 2: Ask whether a new substance has formed. Step 3: Ask whether it can be reversed easily. Step 4: Decide physical or chemical.'
    real_world: Iron bridges and gates are galvanised (coated with zinc) to stop the chemical change of rusting.
  picture:
    kind: compare
    columns:
    - title: Physical change
      points:
      - No new substance
      - Often reversible
      - Melting, dissolving, cutting
    - title: Chemical change
      points:
      - New substance formed
      - Usually irreversible
      - Burning, rusting, cooking
    alt: Physical changes form no new substance and are often reversible; chemical changes form new substances and usually cannot be undone.
  items:
  - prompt: 'Rusting of iron is:'
    options:
    - A chemical change
    - A physical change
    - Melting
    - Crystallisation
    answer: A chemical change
    difficulty: 1
    hints:
    - A new substance, rust, forms.
    - Cannot be undone easily.
    solution: 'Rust is a new substance: chemical change.'
  - prompt: What gas is produced when vinegar reacts with baking soda?
    options:
    - Carbon dioxide
    - Oxygen
    - Hydrogen
    - Nitrogen
    answer: Carbon dioxide
    difficulty: 2
    hints:
    - It puts out flames.
    - Bubbles.
    solution: The fizz is carbon dioxide.
  - prompt: What does iron need to rust?
    options:
    - Oxygen and water
    - Only heat
    - Only light
    - Only salt
    answer: Oxygen and water
    difficulty: 2
    hints:
    - Moist air.
    - Two things.
    solution: Iron rusts when it meets both oxygen and moisture.
  - prompt: 'Coating iron with zinc to prevent rusting is called:'
    options:
    - Galvanisation
    - Crystallisation
    - Neutralisation
    - Evaporation
    answer: Galvanisation
    difficulty: 1
    hints:
    - Zinc coat.
    - Used for buckets and pipes.
    solution: Coating with zinc is galvanisation.
  - prompt: Which of these is a chemical change?
    options:
    - Cooking an egg
    - Melting butter
    - Breaking glass
    - Folding cloth
    answer: Cooking an egg
    difficulty: 1
    hints:
    - Can it be uncooked?
    - New substances form.
    solution: Cooking changes the egg permanently.
  - prompt: In a burning candle, which part is a chemical change?
    options:
    - The wax burning
    - The wax melting
    - The wax dripping
    - The wick bending
    answer: The wax burning
    difficulty: 2
    hints:
    - Melting is physical.
    - Burning makes new gases.
    solution: 'Burning wax forms carbon dioxide and water: chemical. Melting is physical.'
    mistakes:
      The wax melting: c7s_new_substance
