# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 5), SYNiq chapter 17. Format: content/README.md.
subject: cbse7-ss
chapter: 17
title: India, a Home to Many
tips:
  c7ss_origin: Parsis came from Persia; Siddis are of African origin.
concepts:
- code: cbse7ss.home.communities
  title: Communities who made India home
  notes: |
    India has welcomed many communities over centuries. Jews arrived on the Kerala coast long ago (Cochin Jews,
    Paradesi Synagogue, 1568) and the Bene Israel in Maharashtra. Syriac (St Thomas) Christians in Kerala trace
    their faith to early centuries CE. Parsis (Zoroastrians) came from Persia to Gujarat (Sanjan) over 1,000 years
    ago; the legend of 'sugar in milk' tells how they promised to blend in sweetly. Arab merchants settled on the
    Malabar coast (Cheraman Juma Masjid tradition). Siddis of African origin live in Gujarat and Karnataka.
    Armenians traded in Kolkata and Chennai. India later gave shelter to Tibetan refugees (Dharamshala).
  explanations:
    text: 'For centuries India has been a home to people from many lands: Jews and Syriac Christians in Kerala, Parsis from Persia in Gujarat, Arab traders on the Malabar coast, Siddis of African origin, Armenians, and Tibetan refugees. Each added to India''s culture.'
    visual: 'Picture a map with arrows arriving from across the seas and mountains: Persia to Gujarat (Parsis), the Middle East to Kerala (Jews, Christians, Arabs), Africa to Gujarat and Karnataka (Siddis), Tibet to Dharamshala.'
    step_by_step: 'Step 1: Name the community. Step 2: Where did they come from? Step 3: Where did they settle in India? Step 4: What do they contribute today?'
    real_world: The Parsi community, though small, has given India famous names in industry, science and the arts, such as the Tata family and Homi J. Bhabha.
  picture:
    kind: compare
    columns:
    - title: Community
      points:
      - Parsis
      - Cochin Jews
      - Syriac Christians
      - Siddis
      - Tibetans
    - title: Settled in
      points:
      - Gujarat (from Persia)
      - Kerala
      - Kerala
      - Gujarat, Karnataka (African origin)
      - Dharamshala and elsewhere
    alt: 'Communities who made India home and where they settled: Parsis in Gujarat, Jews and Syriac Christians in Kerala, Siddis in Gujarat and Karnataka, Tibetans in Dharamshala.'
  activity:
    type: sort
    prompt: Which community?
    bins:
    - Jews
    - Parsis
    - Syriac Christians
    - Siddis
    items:
    - label: Paradesi Synagogue, Kochi
      bin: Jews
      clue: Built 1568.
      why: Cochin Jews.
    - label: '''Sugar in milk'' at Sanjan'
      bin: Parsis
      clue: From Persia.
      why: Parsis.
    - label: Trace their faith to St Thomas
      bin: Syriac Christians
      clue: Kerala.
      why: Syriac Christians.
    - label: Of African origin, in Gujarat and Karnataka
      bin: Siddis
      clue: From Africa.
      why: Siddis.
  items:
  - prompt: 'The Parsis came to India from:'
    options:
    - Persia (Iran)
    - China
    - Africa
    - Europe
    answer: Persia (Iran)
    difficulty: 1
    hints:
    - '''Parsi'' from ''Pars''.'
    - Zoroastrians.
    solution: Parsis came from Persia.
    mistakes:
      Africa: c7ss_origin
  - prompt: 'The Paradesi Synagogue in Kochi belongs to the:'
    options:
    - Jewish community
    - Parsi community
    - Armenian community
    - Siddi community
    answer: Jewish community
    difficulty: 2
    hints:
    - A synagogue.
    - Kerala.
    solution: It is a Jewish synagogue.
  - prompt: 'The Siddis of Gujarat and Karnataka are of:'
    options:
    - African origin
    - Chinese origin
    - Greek origin
    - Persian origin
    answer: African origin
    difficulty: 2
    hints:
    - Came across the Arabian Sea.
    - East Africa.
    solution: Siddis trace their roots to Africa.
  - prompt: Where did many Tibetan refugees settle in India?
    options:
    - Dharamshala
    - Chennai
