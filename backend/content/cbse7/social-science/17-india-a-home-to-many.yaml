# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 5), SYNiq chapter 17. Format: content/README.md.
subject: cbse7-ss
chapter: 17
title: India, a Home to Many
tips:
  c7ss_origin: "The Siddis are of African origin. The Parsis came from the land of Zoroaster, west of India."
  s7_adopt_culture: "Adopting means taking on the local way of life."
  s7_coast_trade: "The coasts were full of ports. Why would people come by sea?"
  s7_constitution_rights: "Today our rights are written down in the country's basic law."
  s7_dharamshala: "The Dalai Lama lives in a hill town in Himachal Pradesh."
  s7_migration: "Migration means moving."
  s7_migration_reasons: "Migration is about moving. Which choice is the opposite?"
  s7_paradesi: "A synagogue is a place of worship for which community?"
  s7_siddi: "The Siddis' ancestors came across the Indian Ocean from the west."
  s7_sugar_milk: "This community came from Persia to Gujarat."
  s7_syriac: "St Thomas is believed to have reached the Malabar coast."
  s7_unity_diversity: "Diversity means difference. Unity means coming together."
  c7ss17_from: 'Each community came from a different land: West Asia, Persia, Arabia, Africa, Armenia or Tibet. Match the community to where it came from.'
  c7ss17_where: Each community settled in a particular region, often on the coast or in the hills. Picture the map and recall where its people still live today.
  c7ss17_why: People move for trade, work, safety or faith. Ask which reason fits the story.
  c7ss17_blend: Communities kept their own faith while taking up local language, food and dress. Look for the choice that shows both.
  c7ss17_law: Today, the highest law of the land protects every community's freedom of faith and culture.
  c7ss17_calc: 'Write the calculation first: subtract the earlier year from the later.'
concepts:
- code: cbse7ss.home.communities
  title: Communities who made India home
  notes: |
    India has welcomed many communities over centuries. Jews arrived on the Kerala coast long ago (Cochin Jews,
    Paradesi Synagogue, 1568) and the Bene Israel in Maharashtra. Syriac (St Thomas) Christians in Kerala trace
    their faith to early centuries CE. Parsis (Zoroastrians) came from Persia to Gujarat (Sanjan) over 1,000 years
    ago; the legend of 'sugar in milk' tells how they promised to blend in sweetly. Arab merchants settled on the
    Malabar coast (Cheraman Juma Masjid tradition). Siddis of African origin live in Gujarat and Karnataka.
    Armenians traded in Kolkata and Chennai. India later gave shelter to Tibetan refugees (Dharamshala).
  explanations:
    text: 'For centuries India has been a home to people from many lands: Jews and Syriac Christians in Kerala, Parsis from Persia in Gujarat, Arab traders on the Malabar coast, Siddis of African origin, Armenians, and Tibetan refugees. Each added to India''s culture.'
    visual: 'Picture a map with arrows arriving from across the seas and mountains: Persia to Gujarat (Parsis), the Middle East to Kerala (Jews, Christians, Arabs), Africa to Gujarat and Karnataka (Siddis), Tibet to Dharamshala.'
    step_by_step: 'Step 1: Name the community. Step 2: Where did they come from? Step 3: Where did they settle in India? Step 4: What do they contribute today?'
    real_world: The Parsi community, though small, has given India famous names in industry, science and the arts, such as the Tata family and Homi J. Bhabha.
  picture:
    kind: compare
    columns:
    - title: Community
      points:
      - Parsis
      - Cochin Jews
      - Syriac Christians
      - Siddis
      - Tibetans
    - title: Settled in
      points:
      - Gujarat (from Persia)
      - Kerala
      - Kerala
      - Gujarat, Karnataka (African origin)
      - Dharamshala and elsewhere
    alt: 'Communities who made India home and where they settled: Parsis in Gujarat, Jews and Syriac Christians in Kerala, Siddis in Gujarat and Karnataka, Tibetans in Dharamshala.'
  activity:
    type: sort
    prompt: Which community?
    bins:
    - Jews
    - Parsis
    - Syriac Christians
    - Siddis
    items:
    - label: Paradesi Synagogue, Kochi
      bin: Jews
      clue: Built 1568.
      why: Cochin Jews.
    - label: '''Sugar in milk'' at Sanjan'
      bin: Parsis
      clue: From Persia.
      why: Parsis.
    - label: Trace their faith to St Thomas
      bin: Syriac Christians
      clue: Kerala.
      why: Syriac Christians.
    - label: Of African origin, in Gujarat and Karnataka
      bin: Siddis
      clue: From Africa.
      why: Siddis.
  lesson:
    - teach: For many centuries, India has welcomed people from other lands. Jews came to the Kerala coast long ago; the Paradesi Synagogue in Kochi was built in 1568. The Bene Israel community lives in Maharashtra. Syriac (St Thomas) Christians in Kerala trace their faith to the early centuries CE.
      check:
        prompt: Where is the Paradesi Synagogue?
        options:
        - Kochi, Kerala
        - Delhi
        - Kolkata
        answer: Kochi, Kerala
        why: It is in the old Jew Town of Kochi.
    - teach: Parsis (Zoroastrians) came from Persia to Sanjan in Gujarat over 1,000 years ago. A legend says the local king showed a full glass of milk, and they added sugar, promising to blend in and sweeten the land. Arab merchants settled on the Malabar coast.
      picture:
        kind: flow
        steps:
        - Parsis arrive from Persia
        - King shows a full glass of milk
        - Sugar is stirred in
        - 'Promise: we will blend in and sweeten your land'
        alt: The legend of sugar in milk.
      check:
        prompt: What does the sugar in the legend stand for?
        options:
        - Blending in and adding sweetness
        - Taking over the land
        - Leaving soon
        answer: Blending in and adding sweetness
        why: Sugar dissolves and sweetens without overflowing.
    - teach: 'Others came too: Siddis of African origin in Gujarat and Karnataka, Armenian traders in Kolkata and Chennai, and, in modern times, Tibetan refugees who settled in Dharamshala and other places.'
      picture:
        kind: compare
        columns:
        - title: Community
          points:
          - Siddis
          - Armenians
          - Tibetans
        - title: Came from / settled in
          points:
          - Africa / Gujarat, Karnataka
          - Armenia / Kolkata, Chennai
          - Tibet / Dharamshala
        alt: Three communities, where they came from and settled.
      check:
        prompt: Why did Tibetans come to India in modern times?
        options:
        - To find safety as refugees
        - To conquer India
        - For a holiday
        answer: To find safety as refugees
        why: They came seeking shelter.
  items:
  - prompt: 'The Parsis came to India from:'
    options:
    - Persia (Iran)
    - China
    - Africa
    - Europe
    answer: Persia (Iran)
    difficulty: 1
    hints:
    - '''Parsi'' from ''Pars''.'
    - Zoroastrians.
    solution: Parsis came from Persia.
    mistakes:
      Africa: c7ss_origin
  - prompt: 'The Paradesi Synagogue in Kochi belongs to the:'
    options:
    - Jewish community
    - Parsi community
    - Armenian community
    - Siddi community
    answer: Jewish community
    difficulty: 2
    hints:
    - A synagogue.
    - Kerala.
    solution: It is a Jewish synagogue.
    mistakes: {"Parsi community": "s7_paradesi"}
  - prompt: 'The Siddis of Gujarat and Karnataka are of:'
    options:
    - African origin
    - Chinese origin
    - Greek origin
    - Persian origin
    answer: African origin
    difficulty: 2
    hints:
    - Came across the Arabian Sea.
    - East Africa.
    solution: Siddis trace their roots to Africa.
    mistakes: {"Persian origin": "s7_siddi"}
  - prompt: Where did many Tibetan refugees settle in India?
    options:
    - Dharamshala
    - Chennai
    - Kochi
    - Surat
    answer: Dharamshala
    difficulty: 1
    hints:
    - Himachal Pradesh.
    - Home of the Dalai Lama.
    solution: Dharamshala hosts many Tibetans.
    mistakes: {"Kochi": "s7_dharamshala"}
  - prompt: 'The ''sugar in milk'' story is linked to the arrival of the:'
    options:
    - Parsis
    - Jews
    - Armenians
    - Arabs
    answer: Parsis
    difficulty: 2
    hints:
    - Gujarat.
    - They promised to blend in sweetly.
    solution: It tells of the Parsis' welcome in Gujarat.
    mistakes: {"Jews": "s7_sugar_milk"}
  - prompt: 'Syriac Christians in India mainly live in:'
    options:
    - Kerala
    - Punjab
    - Rajasthan
    - Assam
    answer: Kerala
    difficulty: 1
    hints:
    - St Thomas tradition.
    - South-west coast.
    solution: They live mainly in Kerala.
    mistakes: {"Punjab": "s7_syriac"}
  - prompt: Parsis first landed at Sanjan in which state?
    options:
    - Gujarat
    - Kerala
    - Bihar
    answer: Gujarat
    difficulty: 1
    hints:
    - It is on the west coast.
    - Many Parsis speak Gujarati today.
    solution: Parsis landed at Sanjan on the Gujarat coast.
    mistakes:
      Kerala: c7ss17_where
      Bihar: c7ss17_where
  - prompt: 'The Bene Israel are a Jewish community mainly in:'
    options:
    - Maharashtra
    - Assam
    - Punjab
    answer: Maharashtra
    difficulty: 2
    hints:
    - They lived along the Konkan coast.
    - Many live in and around Mumbai.
    solution: The Bene Israel live mainly in Maharashtra.
    mistakes:
      Assam: c7ss17_where
      Punjab: c7ss17_where
  - prompt: Which faith do Parsis follow?
    options:
    - Zoroastrianism
    - Buddhism
    - Jainism
    answer: Zoroastrianism
    difficulty: 1
    hints:
    - It began in ancient Persia.
    - Fire temples are its places of worship.
    solution: Parsis follow Zoroastrianism, an ancient faith of Persia.
    mistakes:
      Buddhism: c7ss17_from
      Jainism: c7ss17_from
  - prompt: Armenian traders mainly settled in which cities?
    options:
    - Kolkata and Chennai
    - Shimla and Leh
    - Jaipur and Bikaner
    answer: Kolkata and Chennai
    difficulty: 2
    hints:
    - They were sea traders.
    - Both are port cities.
    solution: Armenians traded from port cities like Kolkata and Chennai.
    mistakes:
      Shimla and Leh: c7ss17_where
      Jaipur and Bikaner: c7ss17_where
  - prompt: Why did Arab merchants settle on the Malabar coast?
    options:
    - For the spice trade
    - To escape snow
    - To find gold mines
    answer: For the spice trade
    difficulty: 1
    hints:
    - Malabar is famous for pepper.
    - They came by sea.
    solution: Arab merchants came to trade in pepper and other spices.
    mistakes:
      To escape snow: c7ss17_why
      To find gold mines: c7ss17_why
  - prompt: The Paradesi Synagogue was built in 1568. How many years before 2026 is that?
    answer: '458'
    check: 2026-1568
    difficulty: 2
    hints:
    - Both years are CE.
    - Subtract 1568 from 2026.
    solution: 'Step 1: 2026 - 1568. Step 2: = 458 years.'
    mistakes:
      '3594': c7ss17_calc
      '558': c7ss17_calc
  - prompt: 'The Siddis'' ancestors came to India mostly from:'
    options:
    - East Africa
    - Japan
    - Brazil
    answer: East Africa
    difficulty: 2
    hints:
    - They came across the Arabian Sea.
    - They are of African origin.
    solution: Siddi ancestors came from East Africa as traders, sailors and soldiers.
    mistakes:
      Japan: c7ss17_from
      Brazil: c7ss17_from
  - prompt: 'Syriac Christians trace their faith in Kerala to:'
    options:
    - The early centuries CE
    - The 20th century
    - The Mauryan age
    answer: The early centuries CE
    difficulty: 2
    hints:
    - Tradition links it to St Thomas.
    - It is very old, but after Christ.
    solution: Their tradition says St Thomas came to Kerala in the 1st century CE.
    mistakes:
      The 20th century: c7ss17_calc
      The Mauryan age: c7ss17_calc
  - prompt: Dharamshala is in which state?
    options:
    - Himachal Pradesh
    - Kerala
    - Gujarat
    answer: Himachal Pradesh
    difficulty: 2
    hints:
    - It is in the Himalayan foothills.
    - The Dalai Lama lives there.
    solution: Dharamshala, home to many Tibetans, is in Himachal Pradesh.
    mistakes:
      Kerala: c7ss17_where
      Gujarat: c7ss17_where
- code: cbse7ss.home.diversity
  title: Migration and unity in diversity
  after:
  - cbse7ss.home.communities
  notes: |
    Migration means people moving from one place to another, for trade, work, safety or faith. India's long coasts,
    trade routes and tolerant traditions made it a meeting place of cultures. Communities kept their own faiths and
    customs while adopting local languages, food and dress. This exchange enriched Indian food, music, architecture
    and business. India's Constitution protects the right of every community to practise its religion and
    preserve its culture.
  explanations:
    text: People have moved to India for trade, work, safety and faith. They kept their own beliefs but also took on local languages and food, and in return enriched Indian culture. This is unity in diversity, protected today by our Constitution.
    visual: Picture a Kerala street with a temple, a mosque, a church and a synagogue close to one another, and a market where everyone speaks Malayalam.
    step_by_step: 'Step 1: Ask why the people moved (trade, safety, faith). Step 2: Note what they kept (religion, customs). Step 3: Note what they adopted (language, food). Step 4: Note what they gave (businesses, arts).'
    real_world: Kerala's Mattancherry has a synagogue, temples, mosques and churches within walking distance, a living example of India as a home to many.
  picture:
    kind: compare
    columns:
    - title: Kept
      points:
      - Their religion
      - Festivals and customs
    - title: Adopted
      points:
      - Local language
      - Local food and dress
    - title: Gave
      points:
      - New foods and crafts
      - Trade and business
      - Music and buildings
    alt: 'What communities who came to India kept, adopted and gave: their religion and customs, local language and food, and new crafts, business and arts.'
  activity:
    type: sort
    prompt: Push factor or pull factor for migration?
    bins:
    - Push
    - Pull
    items:
    - label: No work in the village
      bin: Push
      clue: Drives people out.
      why: Push.
    - label: Jobs in the city
      bin: Pull
      clue: Draws people in.
      why: Pull.
    - label: War or violence at home
      bin: Push
      clue: Forces people to leave.
      why: Push.
    - label: Good schools and hospitals elsewhere
      bin: Pull
      clue: Attracts.
      why: Pull.
    - label: Drought
      bin: Push
      clue: Land dries up.
      why: Push.
  lesson:
    - teach: Migration means people moving from one place to another. People migrate for trade, work, safety, faith or family. India's long coasts and trade routes made it a meeting place for people from many lands.
      check:
        prompt: 'A family moves from a village to a city for jobs. This is:'
        options:
        - Migration for work
        - Barter
        - A pilgrimage
        answer: Migration for work
        why: Moving for jobs is migration.
    - teach: Communities that came to India often kept their own faith and customs but took up local languages, food and dress. Parsis speak Gujarati; Kerala's Jews and Christians speak Malayalam. This mixing enriched Indian food, music, buildings and business.
      picture:
        kind: compare
        columns:
        - title: Kept
          points:
          - own faith
          - festivals
          - places of worship
        - title: Adopted
          points:
          - local language
          - local food
          - local dress
        alt: What communities kept and what they adopted.
      check:
        prompt: 'Kerala''s Syriac Christians mostly speak:'
        options:
        - Malayalam
        - Syriac only
        - Persian
        answer: Malayalam
        why: They adopted the local language.
    - teach: 'This is ''unity in diversity'': many groups living together as one nation. Today the Constitution protects every community''s freedom to practise its religion and keep its culture. Respecting others'' ways keeps this unity strong.'
      check:
        prompt: What protects every community's freedom of religion today?
        options:
        - The Constitution
        - A trade guild
        - A temple rule
        answer: The Constitution
        why: Fundamental Rights protect religion and culture.
  items:
  - prompt: 'Migration means:'
    options:
    - People moving from one place to another
    - Building a house
    - Growing crops
    - Writing history
    answer: People moving from one place to another
    difficulty: 1
    hints:
    - Moving.
    - For work or safety.
    solution: Migration is people moving to live elsewhere.
    mistakes: {"Building a house": "s7_migration"}
  - prompt: Why did many communities come to India's coasts?
    options:
    - For trade
    - To escape snow
    - To find deserts
    - To climb mountains
    answer: For trade
    difficulty: 1
    hints:
    - Spices, cloth.
    - Ports.
    solution: Trade brought many merchants to India's coasts.
    mistakes: {"To find deserts": "s7_coast_trade"}
  - prompt: Which is an example of a community adopting local culture?
    options:
    - Parsis speaking Gujarati
    - Building a fort
    - Starting a war
    - Leaving India
    answer: Parsis speaking Gujarati
    difficulty: 2
    hints:
    - Language.
    - Blending in.
    solution: Parsis adopted Gujarati as their language.
    mistakes: {"Starting a war": "s7_adopt_culture"}
  - prompt: What protects every community's right to practise its religion in India today?
    options:
    - The Constitution
    - A single king
    - The army
    - Nothing
    answer: The Constitution
    difficulty: 1
    hints:
    - Fundamental Rights.
    - Freedom of religion.
    solution: The Constitution guarantees freedom of religion.
    mistakes: {"A single king": "s7_constitution_rights"}
  - prompt: '''Unity in diversity'' means:'
    options:
    - Many different groups living together as one nation
    - Everyone being the same
    - Only one language
    - No festivals
    answer: Many different groups living together as one nation
    difficulty: 2
    hints:
    - Different but united.
    - India's motto idea.
    solution: Different communities live together as one nation.
    mistakes: {"Everyone being the same": "s7_unity_diversity"}
  - prompt: Which is NOT a usual reason for migration?
    options:
    - To stay in the same place
    - Work
    - Safety
    - Trade
    answer: To stay in the same place
    difficulty: 1
    hints:
    - Migration means moving.
    - Three are reasons to move.
    solution: Staying put is the opposite of migration.
    mistakes: {"Safety": "s7_migration_reasons"}
  - prompt: Which is an example of a community blending in?
    options:
    - Kochi Jews speaking Malayalam
    - A group refusing all contact
    - Forgetting their own faith completely
    answer: Kochi Jews speaking Malayalam
    difficulty: 2
    hints:
    - Blending means taking up local ways.
    - They still kept their faith.
    solution: Using the local language while keeping their faith is blending in.
    mistakes:
      A group refusing all contact: c7ss17_blend
      Forgetting their own faith completely: c7ss17_blend
  - prompt: Which is a reason people migrate?
    options:
    - To find safety from war
    - To stay in one place
    - To avoid all travel
    answer: To find safety from war
    difficulty: 1
    hints:
    - Think of refugees.
    - Moving is part of migration.
    solution: War and danger force people to migrate in search of safety.
    mistakes:
      To stay in one place: c7ss17_why
      To avoid all travel: c7ss17_why
  - prompt: How did trade help bring communities to India?
    options:
    - Merchants came for spices and goods, and some stayed
    - Trade stopped all travel
    - Trade was banned
    answer: Merchants came for spices and goods, and some stayed
    difficulty: 2
    hints:
    - Think of the coasts.
    - Some traders married and settled.
    solution: Traders came for spices, cloth and gems, and many settled and formed communities.
    mistakes:
      Trade stopped all travel: c7ss17_why
      Trade was banned: c7ss17_why
  - prompt: Which shows 'unity in diversity'?
    options:
    - Neighbours of different faiths celebrating each other's festivals
    - Everyone forced to speak one language
    - Communities living apart in anger
    answer: Neighbours of different faiths celebrating each other's festivals
    difficulty: 2
    hints:
    - Unity means together.
    - Diversity means different.
    solution: People of different faiths sharing festivals shows unity with diversity.
    mistakes:
      Everyone forced to speak one language: c7ss17_blend
      Communities living apart in anger: c7ss17_blend
  - prompt: Which Fundamental Right protects a community's right to keep its language and culture?
    options:
    - Cultural and educational rights
    - Right to vote
    - Right to property
    answer: Cultural and educational rights
    difficulty: 3
    hints:
    - Think about culture and schools.
    - Minorities can run their own schools.
    solution: Cultural and educational rights let communities preserve language and culture.
    mistakes:
      Right to vote: c7ss17_law
      Right to property: c7ss17_law
  - prompt: 'Biryani, a dish shaped by Persian and Indian cooking, shows that migration:'
    options:
    - Enriched Indian food
    - Ended Indian cooking
    - Had no effect
    answer: Enriched Indian food
    difficulty: 1
    hints:
    - Think of mixing.
    - New flavours joined old ones.
    solution: Mixing cooking styles from many lands enriched Indian cuisine.
    mistakes:
      Ended Indian cooking: c7ss17_blend
      Had no effect: c7ss17_blend
  - prompt: 'A student from Kerala moves to Delhi for college. This is:'
    options:
    - Migration within the country
    - International trade
    - A refugee crisis
    answer: Migration within the country
    difficulty: 2
    hints:
    - Both places are in India.
    - Studying is a reason to move.
    solution: Moving from one state to another inside India is internal migration.
    mistakes:
      International trade: c7ss17_why
      A refugee crisis: c7ss17_why
  - prompt: Why does respecting others' customs matter in a diverse country?
    options:
    - It keeps peace and unity
    - It makes everyone the same
    - It stops festivals
    answer: It keeps peace and unity
    difficulty: 2
    hints:
    - Many groups live side by side.
    - Respect avoids conflict.
    solution: Mutual respect lets diverse communities live together peacefully.
    mistakes:
      It makes everyone the same: c7ss17_blend
      It stops festivals: c7ss17_blend
  - prompt: Parsis came over 1,000 years ago, about 900 CE. About how many years ago was that from 2026?
    answer: '1126'
    check: 2026-900
    difficulty: 2
    hints:
    - Subtract the year of arrival.
    - 2026 minus 900.
    solution: 'Step 1: 2026 - 900. Step 2: = 1126 years.'
    mistakes:
      '2926': c7ss17_calc
      '1000': c7ss17_calc
