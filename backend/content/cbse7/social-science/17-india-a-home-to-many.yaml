- code: cbse7ss.home.diversity
  title: Migration and unity in diversity
  after:
  - cbse7ss.home.communities
  notes: |
    Migration means people moving from one place to another, for trade, work, safety or faith. India's long coasts,
    trade routes and tolerant traditions made it a meeting place of cultures. Communities kept their own faiths and
    customs while adopting local languages, food and dress. This exchange enriched Indian food, music, architecture
    and business. India's Constitution protects the right of every community to practise its religion and
    preserve its culture.
  explanations:
    text: People have moved to India for trade, work, safety and faith. They kept their own beliefs but also took on local languages and food, and in return enriched Indian culture. This is unity in diversity, protected today by our Constitution.
    visual: Picture a Kerala street with a temple, a mosque, a church and a synagogue close to one another, and a market where everyone speaks Malayalam.
    step_by_step: 'Step 1: Ask why the people moved (trade, safety, faith). Step 2: Note what they kept (religion, customs). Step 3: Note what they adopted (language, food). Step 4: Note what they gave (businesses, arts).'
    real_world: Kerala's Mattancherry has a synagogue, temples, mosques and churches within walking distance, a living example of India as a home to many.
  picture:
    kind: compare
    columns:
    - title: Kept
      points:
      - Their religion
      - Festivals and customs
    - title: Adopted
      points:
      - Local language
      - Local food and dress
    - title: Gave
      points:
      - New foods and crafts
      - Trade and business
      - Music and buildings
    alt: 'What communities who came to India kept, adopted and gave: their religion and customs, local language and food, and new crafts, business and arts.'
  activity:
    type: sort
    prompt: Push factor or pull factor for migration?
    bins:
    - Push
    - Pull
    items:
    - label: No work in the village
      bin: Push
      clue: Drives people out.
      why: Push.
    - label: Jobs in the city
      bin: Pull
      clue: Draws people in.
      why: Pull.
    - label: War or violence at home
      bin: Push
      clue: Forces people to leave.
      why: Push.
    - label: Good schools and hospitals elsewhere
      bin: Pull
      clue: Attracts.
      why: Pull.
    - label: Drought
      bin: Push
      clue: Land dries up.
      why: Push.
  items:
  - prompt: 'Migration means:'
    options:
    - People moving from one place to another
    - Building a house
    - Growing crops
    - Writing history
    answer: People moving from one place to another
    difficulty: 1
    hints:
    - Moving.
    - For work or safety.
    solution: Migration is people moving to live elsewhere.
  - prompt: Why did many communities come to India's coasts?
    options:
    - For trade
    - To escape snow
    - To find deserts
    - To climb mountains
    answer: For trade
    difficulty: 1
    hints:
    - Spices, cloth.
    - Ports.
    solution: Trade brought many merchants to India's coasts.
  - prompt: Which is an example of a community adopting local culture?
    options:
    - Parsis speaking Gujarati
    - Building a fort
    - Starting a war
    - Leaving India
    answer: Parsis speaking Gujarati
    difficulty: 2
    hints:
    - Language.
    - Blending in.
    solution: Parsis adopted Gujarati as their language.
  - prompt: What protects every community's right to practise its religion in India today?
    options:
    - The Constitution
    - A single king
    - The army
    - Nothing
    answer: The Constitution
    difficulty: 1
    hints:
    - Fundamental Rights.
    - Freedom of religion.
    solution: The Constitution guarantees freedom of religion.
  - prompt: '''Unity in diversity'' means:'
    options:
    - Many different groups living together as one nation
    - Everyone being the same
    - Only one language
    - No festivals
    answer: Many different groups living together as one nation
    difficulty: 2
    hints:
    - Different but united.
    - India's motto idea.
    solution: Different communities live together as one nation.
  - prompt: Which is NOT a usual reason for migration?
    options:
    - To stay in the same place
    - Work
    - Safety
    - Trade
    answer: To stay in the same place
    difficulty: 1
    hints:
    - Migration means moving.
    - Three are reasons to move.
    solution: Staying put is the opposite of migration.
