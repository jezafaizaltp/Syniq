# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 6. Format: content/README.md.
subject: cbse7-ss
chapter: 6
title: The Age of Reorganisation
tips:
  c7ss_dynasty: "The Shungas ruled the Ganga plains. Which dynasty ruled further south in the Deccan and sent goods to Rome?"
  c7ss_art: "Gandhara is in the north-west, where rulers who came after Alexander settled. Whose art style did they bring?"
  s7_hathigumpha: "Kharavela's record is carved in a cave near Bhubaneswar."
  s7_indo_greek_coins: "Indo-Greek coins carried a face on one side. Whose?"
  s7_karle_monks: "Rock-cut halls and cells were quiet places for whom?"
  s7_mathura_stone: "Mathura's local stone is reddish."
  s7_pepper: "Chilli, potato and tomato came from the Americas much later. Which spice grew in Kerala?"
  s7_post_maurya: "After the empire broke up there was no single ruler."
  s7_pushyamitra: "The Shunga dynasty is named after its founder."
  s7_rome_gold: "Rome bought Indian spices. How did it pay?"
  s7_satavahana_names: "Gautamiputra Satakarni means 'son of Gautami'. Who was Gautami?"
  s7_torana: "Gopurams are tall southern temple gateways. What are the stupa gateways called?"
  c7ss6_region: 'Match each dynasty to its region: one in the Ganga plains, one in the Deccan, one on the eastern coast, one beyond the Indus towards the mountain passes.'
  c7ss6_source: Historians learn about this age from inscriptions, coins and monuments. Ask which kind of source tells us about which ruler.
  c7ss6_change: When a great empire weakens, power does not vanish. Think about what replaces it.
  c7ss6_trade: Goods went west from India and something precious came back. Think about which way each item travelled.
  c7ss6_port: Busy trading towns of this age stood on the coast or on rivers near the sea.
  c7ss6_art: Each art style used local materials and borrowed ideas from neighbours. Think about the region it comes from.
  c7ss6_monks: Cut into hills, these halls gave travelling monks shelter during the rainy season.
concepts:
- code: cbse7ss.reorg.kingdoms
  title: New kingdoms after the Mauryas
  notes: |
    After the Mauryan Empire weakened (around 185 BCE), many regional powers rose: the Shungas in the Ganga region
    (founded by Pushyamitra Shunga; supported Vedic rituals but Buddhist sites like Bharhut and Sanchi were also
    enlarged), the Satavahanas in the Deccan (traded with Rome by sea; coins and inscriptions often name the king
    with his mother's name), and Kharavela of Kalinga (Chedi dynasty), known from the Hathigumpha inscription near
    Bhubaneswar. Indo-Greeks ruled in the north-west; their coins show kings' portraits. This was a period of
    reorganisation, not collapse.
  explanations:
    text: 'After the Mauryas, India was not one empire but many kingdoms: the Shungas in the north, the Satavahanas in the Deccan who traded with Rome, Kharavela in Kalinga, and Indo-Greek kings in the north-west.'
    visual: 'Draw a map with four coloured regions: Shungas on the Ganga, Satavahanas across the Deccan, Kharavela''s Kalinga on the east coast, Indo-Greeks in the north-west, with ships sailing from the Deccan towards Rome.'
    step_by_step: 'Step 1: Name the dynasty. Step 2: Place it on the map. Step 3: Note one source (inscription, coins). Step 4: Note one achievement (trade, art, conquest).'
    real_world: Roman coins dug up in South India show how busy the sea trade of this period was.
  picture:
    kind: compare
    columns:
    - title: Shungas
      points:
      - Ganga region
      - After the Mauryas
      - Sanchi, Bharhut enlarged
    - title: Satavahanas
      points:
      - Deccan
      - Sea trade with Rome
      - Kings named with mothers' names
    - title: Kharavela (Kalinga)
      points:
      - Chedi dynasty
      - Hathigumpha inscription
      - Near Bhubaneswar
    alt: 'Regional powers after the Mauryas: the Shungas, the Satavahanas and Kharavela of Kalinga.'
  activity:
    type: sort
    prompt: Which kingdom?
    bins:
    - Shungas
    - Satavahanas
    - Kharavela of Kalinga
    - Indo-Greeks
    items:
    - label: Founded by Pushyamitra in the Ganga region
      bin: Shungas
      clue: After the Mauryas.
      why: Shungas.
    - label: Kings named with their mothers' names
      bin: Satavahanas
      clue: Deccan.
      why: Satavahanas.
    - label: Traded with Rome by sea
      bin: Satavahanas
      clue: Deccan coasts.
      why: Satavahanas.
    - label: Hathigumpha inscription
      bin: Kharavela of Kalinga
      clue: Near Bhubaneswar.
      why: Kharavela.
    - label: Coins with kings' portraits in the north-west
      bin: Indo-Greeks
      clue: Greek style.
      why: Indo-Greeks.
  lesson:
    - teach: 'Around 185 BCE the Mauryan Empire weakened and broke up. Instead of one empire, many regional kingdoms rose. Historians call this an age of reorganisation, not a collapse: trade, art and towns kept growing.'
      check:
        prompt: What came after the Mauryan Empire?
        options:
        - Many regional kingdoms
        - No rulers at all
        - One bigger empire at once
        answer: Many regional kingdoms
        why: Power was shared among several regional states.
    - teach: The Shungas, founded by Pushyamitra Shunga, ruled the Ganga region. The Satavahanas ruled the Deccan and traded with Rome by sea; many of their kings carried their mother's name, like Gautamiputra Satakarni. Kharavela of Kalinga is known from the Hathigumpha inscription near Bhubaneswar.
      picture:
        kind: compare
        columns:
        - title: Shungas
          points:
          - Ganga region
          - Pushyamitra
        - title: Satavahanas
          points:
          - Deccan
          - trade with Rome
        - title: Kharavela
          points:
          - Kalinga (Odisha)
          - Hathigumpha inscription
        alt: Three powers after the Mauryas and where they ruled.
      check:
        prompt: What does 'Gautamiputra' in a Satavahana king's name tell us?
        options:
        - He was the son of Gautami
        - He was a Greek
        - He was a monk
        answer: He was the son of Gautami
        why: '''Putra'' means son; Gautami was his mother.'
    - teach: In the north-west, Indo-Greek kings ruled. Their coins carried portraits of the kings with names, which helps historians date them. Coins, inscriptions and monuments are our main sources for this age.
      check:
        prompt: Why are Indo-Greek coins useful to historians?
        options:
        - They show kings' faces and names
        - They are made of paper
        - They were never used
        answer: They show kings' faces and names
        why: Portraits and names help identify and date rulers.
  items:
  - prompt: Which dynasty ruled the Deccan and traded with Rome?
    options:
    - Satavahanas
    - Shungas
    - Mauryas
    - Guptas
    answer: Satavahanas
    difficulty: 1
    hints:
    - South of the Narmada.
    - Sea trade.
    solution: The Satavahanas ruled the Deccan and traded with Rome.
    mistakes:
      Shungas: c7ss_dynasty
  - prompt: Kharavela of Kalinga is known mainly from which source?
    options:
    - The Hathigumpha inscription
    - The Indica
    - The Arthashastra
    - Roman coins
    answer: The Hathigumpha inscription
    difficulty: 2
    hints:
    - '''Elephant cave''.'
    - Near Bhubaneswar.
    solution: The Hathigumpha inscription records his reign.
    mistakes: {"The Indica": "s7_hathigumpha"}
  - prompt: Who founded the Shunga dynasty?
    options:
    - Pushyamitra Shunga
    - Ashoka
    - Kharavela
    - Chandragupta
    answer: Pushyamitra Shunga
    difficulty: 2
    hints:
    - Overthrew the last Maurya.
    - Shunga.
    solution: Pushyamitra Shunga founded it.
    mistakes: {"Kharavela": "s7_pushyamitra"}
  - prompt: What is unusual about many Satavahana kings' names?
    options:
    - They include their mothers' names
    - They include animal names
    - They are in Greek
    - They have no names
    answer: They include their mothers' names
    difficulty: 2
    hints:
    - Gautamiputra Satakarni.
    - Son of Gautami.
    solution: Kings like Gautamiputra Satakarni were named after their mothers.
    mistakes: {"They include animal names": "s7_satavahana_names"}
  - prompt: 'Indo-Greek coins are famous for showing:'
    options:
    - Portraits of the kings
    - Maps
    - Prices
    - Nothing
    answer: Portraits of the kings
    difficulty: 2
    hints:
    - Faces on coins.
    - Greek style.
    solution: Indo-Greek coins carry realistic portraits.
    mistakes: {"Maps": "s7_indo_greek_coins"}
  - prompt: 'After the Mauryan Empire, India was best described as:'
    options:
    - Many regional kingdoms
    - One empire
    - Completely empty
    - Ruled from Rome
    answer: Many regional kingdoms
    difficulty: 1
    hints:
    - Reorganisation.
    - Several dynasties.
    solution: Several regional powers ruled different parts.
    mistakes: {"One empire": "s7_post_maurya"}
  - prompt: Around which year did the Mauryan Empire break up?
    options:
    - About 185 BCE
    - About 1947 CE
    - About 3000 BCE
    answer: About 185 BCE
    difficulty: 2
    hints:
    - It was after Ashoka's death (232 BCE).
    - It is still BCE.
    solution: The Mauryan Empire ended about 185 BCE when Pushyamitra Shunga took over.
    mistakes:
      About 1947 CE: c7ss6_change
      About 3000 BCE: c7ss6_change
  - prompt: The Hathigumpha inscription is near which present-day city?
    options:
    - Bhubaneswar
    - Delhi
    - Kochi
    answer: Bhubaneswar
    difficulty: 2
    hints:
    - Kharavela ruled Kalinga.
    - Kalinga is present-day Odisha.
    solution: The Hathigumpha ('elephant cave') inscription is in the Udayagiri hills near Bhubaneswar, Odisha.
    mistakes:
      Delhi: c7ss6_region
      Kochi: c7ss6_region
  - prompt: Kharavela ruled which region?
    options:
    - Kalinga
    - Gandhara
    - Kerala
    answer: Kalinga
    difficulty: 1
    hints:
    - It is on the east coast.
    - It is the region Ashoka once attacked.
    solution: Kharavela of the Chedi dynasty ruled Kalinga.
    mistakes:
      Gandhara: c7ss6_region
      Kerala: c7ss6_region
  - prompt: Which dynasty ruled the Ganga region right after the Mauryas?
    options:
    - The Shungas
    - The Satavahanas
    - The Indo-Greeks
    answer: The Shungas
    difficulty: 2
    hints:
    - Its founder was a Mauryan general.
    - The Satavahanas were in the Deccan.
    solution: Pushyamitra Shunga founded the Shunga dynasty in the Ganga region.
    mistakes:
      The Satavahanas: c7ss6_region
      The Indo-Greeks: c7ss6_region
  - prompt: 'Indo-Greek kings ruled mainly in the:'
    options:
    - North-west
    - Far south
    - North-east
    answer: North-west
    difficulty: 1
    hints:
    - They came from beyond the Hindu Kush.
    - Think of Gandhara and the Punjab.
    solution: Indo-Greeks ruled the north-west, in Gandhara and the Punjab.
    mistakes:
      Far south: c7ss6_region
      North-east: c7ss6_region
  - prompt: 'An inscription is:'
    options:
    - Writing carved on stone or metal
    - A painted cloth
    - A spoken song
    answer: Writing carved on stone or metal
    difficulty: 1
    hints:
    - It lasts a long time.
    - Ashoka's edicts are an example.
    solution: An inscription is writing cut into a hard surface like stone, rock or copper.
    mistakes:
      A painted cloth: c7ss6_source
      A spoken song: c7ss6_source
  - prompt: Which source would tell us the most about Kharavela's deeds?
    options:
    - His inscription
    - An Indo-Greek coin
    - A Roman poem
    answer: His inscription
    difficulty: 2
    hints:
    - He had his deeds carved in a cave.
    - The other two belong to other people.
    solution: Kharavela's own Hathigumpha inscription lists his deeds year by year.
    mistakes:
      An Indo-Greek coin: c7ss6_source
      A Roman poem: c7ss6_source
  - prompt: Why do historians call this period 'reorganisation' and not 'collapse'?
    options:
    - Life, trade and art went on under new rulers
    - Everyone left India
    - All cities were destroyed
    answer: Life, trade and art went on under new rulers
    difficulty: 3
    hints:
    - Think about what kept growing.
    - Only the big empire ended.
    solution: Although the empire ended, trade, towns, art and religion kept growing under regional kingdoms.
    mistakes:
      Everyone left India: c7ss6_change
      All cities were destroyed: c7ss6_change
  - prompt: 'The Satavahanas reached Rome mainly by:'
    options:
    - Sea trade
    - Railway
    - Air
    answer: Sea trade
    difficulty: 1
    hints:
    - They had ports on both coasts.
    - Ships used the monsoon winds.
    solution: Satavahana traders sent ships across the Arabian Sea using the monsoon winds.
    mistakes:
      Railway: c7ss6_trade
      Air: c7ss6_trade
- code: cbse7ss.reorg.art
  title: Trade, culture and art in the age of reorganisation
  after:
  - cbse7ss.reorg.kingdoms
  notes: |
    Trade grew by land and sea: spices, pepper, textiles, gems and ivory went west to Rome; gold and wine came back.
    Ports like Bharuch (Barygaza) and Arikamedu flourished. Art: the great stupa at Sanchi got stone railings and
    gateways (toranas) carved with Jataka stories; rock-cut caves at Karle and Ajanta (early phase) were made for
    monks. Gandhara art (north-west) showed Greek influence; Mathura art used local red sandstone. Images of the
    Buddha in human form appeared in this period.
  explanations:
    text: Trade with Rome and other lands made this a rich age. Ports buzzed with ships carrying pepper and cloth. Artists carved beautiful gateways at Sanchi and rock-cut caves for monks, and the Buddha began to be shown in human form.
    visual: Picture the stone gateway of Sanchi, every pillar covered with carved scenes of elephants, trees and stories from the Buddha's past lives.
    step_by_step: 'Step 1: Trade: what went out (spices, cloth) and what came in (gold, wine). Step 2: Ports: Bharuch, Arikamedu. Step 3: Art: Sanchi toranas, rock-cut caves. Step 4: Styles: Gandhara (Greek influence) and Mathura (local).'
    real_world: The gateways (toranas) of Sanchi appear on India's ₹200 note.
  picture:
    kind: compare
    columns:
    - title: Gandhara art
      points:
      - North-west
      - Greek influence
      - Grey stone
    - title: Mathura art
      points:
      - Near Delhi–Agra
      - Local style
      - Red sandstone
    alt: Gandhara art (north-west, Greek influence, grey stone) compared with Mathura art (local style, red sandstone).
  activity:
    type: sort
    prompt: Which art centre?
    bins:
    - Sanchi
    - Gandhara
    - Mathura
    - Karle / Ajanta
    items:
    - label: Stupa gateways carved with Jataka stories
      bin: Sanchi
      clue: Toranas.
      why: Sanchi.
    - label: Buddha images showing Greek influence
      bin: Gandhara
      clue: North-west.
      why: Gandhara.
    - label: Red sandstone sculptures
      bin: Mathura
      clue: Local stone.
      why: Mathura.
    - label: Rock-cut caves for monks
      bin: Karle / Ajanta
      clue: Carved into hills.
      why: Karle and Ajanta.
  lesson:
    - teach: Trade boomed by land and sea. India sent pepper and other spices, fine cotton, gems and ivory west to the Roman world. Gold coins and wine came back. Roman coins have been found in south India.
      picture:
        kind: compare
        columns:
        - title: India to Rome
          points:
          - pepper and spices
          - cotton cloth
          - gems, ivory
        - title: Rome to India
          points:
          - gold coins
          - wine
        alt: Goods travelling between India and Rome.
      check:
        prompt: Finding Roman coins in south India shows what?
        options:
        - There was trade with Rome
        - Romans ruled south India
        - Indians made Roman coins
        answer: There was trade with Rome
        why: Romans paid in gold for Indian goods.
    - teach: 'Port towns grew: Bharuch (called Barygaza by the Greeks) on the west coast and Arikamedu near Puducherry on the east coast. Traders used the monsoon winds to sail across the Arabian Sea.'
      check:
        prompt: Where is Arikamedu?
        options:
        - Near Puducherry on the east coast
        - In the Himalayas
        - In the Thar desert
        answer: Near Puducherry on the east coast
        why: It was a seaside trading post.
    - teach: Art flourished. The Sanchi stupa got stone railings and gateways (toranas) carved with Jataka stories. Monks' caves were cut into rock at Karle and Ajanta. Gandhara sculptors used Greek styles; Mathura sculptors used local red sandstone. For the first time, the Buddha was shown in human form.
      picture:
        kind: compare
        columns:
        - title: Gandhara
          points:
          - north-west
          - Greek-style faces and robes
          - grey stone
        - title: Mathura
          points:
          - Ganga region
          - Indian style
          - red sandstone
        alt: 'Two schools of sculpture: Gandhara and Mathura.'
      check:
        prompt: What new kind of image appeared in this age?
        options:
        - The Buddha in human form
        - Photographs
        - Oil paintings on canvas
        answer: The Buddha in human form
        why: Earlier he was shown by symbols like a wheel or footprints.
  items:
  - prompt: Which spice was in great demand in Rome?
    options:
    - Pepper
    - Chilli
    - Potato
    - Tomato
    answer: Pepper
    difficulty: 1
    hints:
    - Black gold.
    - From the Malabar coast.
    solution: Indian pepper was prized in Rome.
    mistakes: {"Chilli": "s7_pepper"}
  - prompt: 'The carved gateways of the Sanchi stupa are called:'
    options:
    - Toranas
    - Gopurams
    - Minarets
    - Domes
    answer: Toranas
    difficulty: 2
    hints:
    - Gateways.
    - Four of them.
    solution: They are toranas.
    mistakes: {"Gopurams": "s7_torana"}
  - prompt: 'Gandhara art shows the influence of:'
    options:
    - Greek art
    - Chinese art
    - Roman law
    - African art
    answer: Greek art
    difficulty: 2
    hints:
    - North-west region.
    - Indo-Greeks.
    solution: Gandhara sculpture blends Greek and Indian styles.
    mistakes:
      Chinese art: c7ss_art
  - prompt: 'Mathura sculptures were mostly made of:'
    options:
    - Red sandstone
    - Marble
    - Wood
    - Gold
    answer: Red sandstone
    difficulty: 2
    hints:
    - Local stone.
    - Reddish colour.
    solution: Mathura artists used red sandstone.
    mistakes: {"Marble": "s7_mathura_stone"}
  - prompt: What did India mainly receive from Rome in trade?
    options:
    - Gold
    - Rice
    - Cotton
    - Pepper
    answer: Gold
    difficulty: 1
    hints:
    - Roman coins found in India.
    - Payment.
    solution: Rome paid in gold.
    mistakes: {"Pepper": "s7_rome_gold"}
  - prompt: 'Rock-cut caves like Karle were made for:'
    options:
    - Buddhist monks
    - Soldiers
    - Kings' palaces
    - Markets
    answer: Buddhist monks
    difficulty: 1
    hints:
    - Prayer halls and living cells.
    - Monasteries.
    solution: They served as monasteries and prayer halls.
    mistakes: {"Kings' palaces": "s7_karle_monks"}
  - prompt: 'Before this age, the Buddha was usually shown by:'
    options:
    - Symbols like a wheel or footprints
    - Photographs
    - Clay dolls in shops
    answer: Symbols like a wheel or footprints
    difficulty: 2
    hints:
    - He was not shown as a person at first.
    - Think of the dhamma wheel.
    solution: Early art used symbols such as the wheel, an empty seat, a tree or footprints.
    mistakes:
      Photographs: c7ss6_art
      Clay dolls in shops: c7ss6_art
  - prompt: 'Jataka stories are about:'
    options:
    - The Buddha's earlier lives
    - Roman emperors
    - Greek gods
    answer: The Buddha's earlier lives
    difficulty: 2
    hints:
    - They are Buddhist tales.
    - They are carved on the Sanchi gateways.
    solution: Jatakas tell of the Buddha's past lives, often as animals, teaching good values.
    mistakes:
      Roman emperors: c7ss6_art
      Greek gods: c7ss6_art
  - prompt: Which port was called Barygaza by the Greeks?
    options:
    - Bharuch
    - Kolkata
    - Chennai
    answer: Bharuch
    difficulty: 2
    hints:
    - It is in Gujarat.
    - It is on the west coast near the Narmada mouth.
    solution: Bharuch, at the mouth of the Narmada in Gujarat, was the Greeks' Barygaza.
    mistakes:
      Kolkata: c7ss6_port
      Chennai: c7ss6_port
  - prompt: Which winds helped ships sail between India and the Roman world?
    options:
    - The monsoon winds
    - Polar winds
    - Desert storms only
    answer: The monsoon winds
    difficulty: 2
    hints:
    - They change direction with the seasons.
    - They also bring India's rain.
    solution: Sailors used the monsoon winds to cross the Arabian Sea in each direction.
    mistakes:
      Polar winds: c7ss6_trade
      Desert storms only: c7ss6_trade
  - prompt: Where is the great stupa with carved toranas?
    options:
    - Sanchi
    - Karle
    - Bharuch
    answer: Sanchi
    difficulty: 1
    hints:
    - It is in Madhya Pradesh.
    - Karle has caves, not this stupa.
    solution: The great stupa at Sanchi has four carved gateways (toranas).
    mistakes:
      Karle: c7ss6_monks
      Bharuch: c7ss6_port
  - prompt: 'A stupa is:'
    options:
    - A dome-shaped mound holding relics
    - A trading ship
    - A kind of coin
    answer: A dome-shaped mound holding relics
    difficulty: 1
    hints:
    - Buddhists walk around it.
    - It is shaped like a half-ball.
    solution: A stupa is a dome-shaped monument that holds relics of the Buddha or a monk.
    mistakes:
      A trading ship: c7ss6_art
      A kind of coin: c7ss6_art
  - prompt: Why did monks need caves like those at Karle?
    options:
    - Shelter, especially in the rainy season
    - To store gold
    - To hide from Romans
    answer: Shelter, especially in the rainy season
    difficulty: 2
    hints:
    - Monks travelled most of the year.
    - They stopped during heavy rain.
    solution: Monks stayed in rock-cut caves during the rainy season retreat.
    mistakes:
      To store gold: c7ss6_monks
      To hide from Romans: c7ss6_monks
  - prompt: 'Gandhara sculptures look partly Greek because:'
    options:
    - Gandhara had contact with Greek rulers and artists
    - They were made in Greece
    - They are recent copies
    answer: Gandhara had contact with Greek rulers and artists
    difficulty: 3
    hints:
    - Who ruled the north-west?
    - Ideas travel with people.
    solution: Indo-Greek rule and trade brought Greek styles, which Gandhara artists mixed with Indian ideas.
    mistakes:
      They were made in Greece: c7ss6_art
      They are recent copies: c7ss6_art
  - prompt: Which item went from India to Rome?
    options:
    - Fine cotton cloth
    - Gold coins
    - Wine
    answer: Fine cotton cloth
    difficulty: 1
    hints:
    - Two options came from Rome.
    - India was famous for weaving.
    solution: India exported cotton, spices, gems and ivory; Rome sent gold coins and wine.
    mistakes:
      Gold coins: c7ss6_trade
      Wine: c7ss6_trade
