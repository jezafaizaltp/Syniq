concepts:
- code: cbse7ss.reorg.kingdoms
  title: New kingdoms after the Mauryas
  notes: |
    After the Mauryan Empire weakened (around 185 BCE), many regional powers rose: the Shungas in the Ganga region
    (founded by Pushyamitra Shunga; supported Vedic rituals but Buddhist sites like Bharhut and Sanchi were also
    enlarged), the Satavahanas in the Deccan (traded with Rome by sea; coins and inscriptions often name the king
    with his mother's name), and Kharavela of Kalinga (Chedi dynasty), known from the Hathigumpha inscription near
    Bhubaneswar. Indo-Greeks ruled in the north-west; their coins show kings' portraits. This was a period of
    reorganisation, not collapse.
  explanations:
    text: 'After the Mauryas, India was not one empire but many kingdoms: the Shungas in the north, the Satavahanas in the Deccan who traded with Rome, Kharavela in Kalinga, and Indo-Greek kings in the north-west.'
    visual: 'Draw a map with four coloured regions: Shungas on the Ganga, Satavahanas across the Deccan, Kharavela''s Kalinga on the east coast, Indo-Greeks in the north-west, with ships sailing from the Deccan towards Rome.'
    step_by_step: 'Step 1: Name the dynasty. Step 2: Place it on the map. Step 3: Note one source (inscription, coins). Step 4: Note one achievement (trade, art, conquest).'
    real_world: Roman coins dug up in South India show how busy the sea trade of this period was.
