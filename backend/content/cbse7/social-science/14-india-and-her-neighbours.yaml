# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 2), SYNiq chapter 14. Format: content/README.md.
subject: cbse7-ss
chapter: 14
title: India and Her Neighbours
tips:
  c7ss_border: "The border with China is long but runs through high mountains. Which neighbour wraps around West Bengal and the north-east on three sides?"
  c7ss_sea_neighbour: "Nepal is a land neighbour. A sea neighbour lies across water; this one is a chain of coral islands south-west of Lakshadweep."
  s7_angkor: "Angkor Wat is in Southeast Asia."
  s7_bhutan_power: "Bhutan has fast mountain rivers. What can they make?"
  s7_brahmaputra: "The Kaveri, Narmada and Godavari stay within India. Which river comes from Tibet?"
  s7_mahinda: "Ashoka sent missionaries abroad, including his own son."
  s7_myanmar: "Pakistan and Afghanistan are to the west. Which neighbour is to the east?"
  s7_neighbourhood: "The policy's name says who comes first."
  s7_nepal: "Indians need visas for China, Myanmar and Afghanistan. Which Himalayan neighbour has an open border with India?"
  s7_palk: "Malacca is near Singapore. Which narrow strait is between Tamil Nadu and Sri Lanka?"
  s7_ramayana_abroad: "Indian culture spread east by sea to Southeast Asia."
  s7_seven_borders: "Go round the map: two neighbours in the west, three in the north, two in the east. Count them."
concepts:
- code: cbse7ss.nbr.land
  title: India and its land neighbours
  notes: |
    India shares land borders with seven countries: Pakistan (west), Afghanistan (north-west, via Ladakh region),
    China (north), Nepal and Bhutan (north), Bangladesh (east, the longest border) and Myanmar (east). Neighbours
    share rivers (Indus, Ganga, Brahmaputra), mountains, history, languages and cultures. Nepal and Bhutan have open
    or friendly borders with India; Bhutan exports hydroelectricity to India. Cooperation (SAARC, BIMSTEC) and
    disputes both shape relations.
  explanations:
    text: 'India shares land borders with seven countries: Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh and Myanmar. We share rivers, mountains, history and culture with them, and cooperate on trade, power and travel.'
    visual: 'Draw India''s outline and label its neighbours around it: Pakistan to the west, China, Nepal and Bhutan to the north, Bangladesh and Myanmar to the east.'
    step_by_step: 'Step 1: Name the neighbour. Step 2: Find its direction from India. Step 3: Note what is shared (a river, a culture). Step 4: Note one form of cooperation.'
    real_world: Indians and Nepalis can cross the India–Nepal border without a visa, a sign of a very close relationship.
  picture:
    kind: compare
    columns:
    - title: North
      points:
      - China
      - Nepal
      - Bhutan
    - title: West and north-west
      points:
      - Pakistan
      - Afghanistan
    - title: East
      points:
      - Bangladesh (longest border)
      - Myanmar
    alt: 'India''s seven land neighbours grouped by direction: China, Nepal and Bhutan to the north; Pakistan and Afghanistan to the west; Bangladesh and Myanmar to the east.'
  activity:
    type: sort
    prompt: Which neighbour?
    bins:
    - Pakistan
    - China
    - Bhutan
    - Bangladesh
    items:
    - label: Shares the Indus
      bin: Pakistan
      clue: West.
      why: Pakistan.
    - label: Across the high Himalayas in the north
      bin: China
      clue: Tibet.
      why: China.
    - label: Sells hydroelectricity to India
      bin: Bhutan
      clue: Small Himalayan kingdom.
      why: Bhutan.
    - label: India's longest land border
      bin: Bangladesh
      clue: East.
      why: Bangladesh.
  items:
  - prompt: With how many countries does India share a land border?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh, Myanmar.
    - Count them.
    solution: Seven countries.
    mistakes: {"5": "s7_seven_borders", "9": "s7_seven_borders"}
  - prompt: With which country does India share its longest land border?
    options:
    - Bangladesh
    - China
    - Pakistan
    - Nepal
    answer: Bangladesh
    difficulty: 2
    hints:
    - To the east.
    - Around West Bengal.
    solution: The India–Bangladesh border is the longest.
    mistakes:
      China: c7ss_border
  - prompt: Which neighbour lies to the east of India?
    options:
    - Myanmar
    - Pakistan
    - Afghanistan
    - Nepal
    answer: Myanmar
    difficulty: 1
    hints:
    - Beyond Manipur and Mizoram.
    - East.
    solution: Myanmar is to the east.
    mistakes: {"Pakistan": "s7_myanmar"}
  - prompt: 'Bhutan sells India large amounts of:'
    options:
    - Hydroelectricity
    - Petroleum
    - Coal
    - Wheat
    answer: Hydroelectricity
    difficulty: 2
    hints:
    - Himalayan rivers.
    - Power from dams.
    solution: Bhutan exports hydropower to India.
    mistakes: {"Petroleum": "s7_bhutan_power"}
  - prompt: Which river flows from Tibet (China) into India and then Bangladesh?
    options:
    - Brahmaputra
    - Kaveri
    - Narmada
    - Godavari
    answer: Brahmaputra
    difficulty: 2
    hints:
    - Through Assam.
    - Called Yarlung Tsangpo in Tibet.
    solution: The Brahmaputra flows through China, India and Bangladesh.
    mistakes: {"Godavari": "s7_brahmaputra"}
  - prompt: Which neighbour can Indians usually visit without a visa?
    options:
    - Nepal
    - China
    - Myanmar
    - Afghanistan
    answer: Nepal
    difficulty: 1
    hints:
    - Open border.
    - Himalayan country.
    solution: India and Nepal have an open border.
    mistakes: {"China": "s7_nepal"}
- code: cbse7ss.nbr.sea
  title: Maritime neighbours and cultural exchange
  after:
  - cbse7ss.nbr.land
  notes: |
    India's maritime (sea) neighbours include Sri Lanka (across the Palk Strait), the Maldives (south-west of
    Lakshadweep), and, across the Andaman Sea, Thailand and Indonesia. Over centuries, trade, religion and ideas
    travelled: Buddhism went from India to Sri Lanka (Ashoka's son Mahinda), and on to Southeast Asia; the Ramayana
    is told in Thailand and Indonesia; Angkor Wat in Cambodia was built as a Hindu temple. India cooperates with
    neighbours in disaster relief, health and trade, guided by its 'Neighbourhood First' approach.
  explanations:
    text: 'India''s sea neighbours include Sri Lanka, just across the narrow Palk Strait, and the Maldives. For centuries ideas, trade and religion sailed between them: Buddhism went to Sri Lanka, and the Ramayana is still told in Thailand and Indonesia.'
    visual: Draw India's southern tip with Sri Lanka just across a narrow strip of sea, the Maldives dots to the south-west, and arrows sailing east to Thailand and Indonesia carrying books and statues.
    step_by_step: 'Step 1: Name the sea neighbour. Step 2: Find the water body between (Palk Strait, Arabian Sea, Andaman Sea). Step 3: Note a cultural link. Step 4: Note present-day cooperation.'
    real_world: After the 2004 tsunami, India sent ships and aid to Sri Lanka and the Maldives, showing neighbours helping in disasters.
  picture:
    kind: compare
    columns:
    - title: Sea neighbour
      points:
      - Sri Lanka
      - Maldives
      - Thailand, Indonesia
    - title: Link with India
      points:
      - Palk Strait; Buddhism spread there
      - Near Lakshadweep; trade
      - Ramayana traditions; trade
    alt: 'India''s maritime neighbours and their links: Sri Lanka across the Palk Strait, the Maldives near Lakshadweep, and Thailand and Indonesia with Ramayana traditions.'
  activity:
    type: sort
    prompt: Which maritime neighbour?
    bins:
    - Sri Lanka
    - Maldives
    - Indonesia
    - Cambodia
    items:
    - label: Across the Palk Strait
      bin: Sri Lanka
      clue: South-east of Tamil Nadu.
      why: Sri Lanka.
    - label: Mahinda took Buddhism there
      bin: Sri Lanka
      clue: Ashoka's son.
      why: Sri Lanka.
    - label: South-west of Lakshadweep
      bin: Maldives
      clue: Islands.
      why: Maldives.
    - label: Ramayana told in Java
      bin: Indonesia
      clue: Islands of South-East Asia.
      why: Indonesia.
    - label: Angkor Wat
      bin: Cambodia
      clue: A great Hindu temple.
      why: Cambodia.
  items:
  - prompt: Which strait separates India and Sri Lanka?
    options:
    - Palk Strait
    - Strait of Malacca
    - Strait of Gibraltar
    - Bering Strait
    answer: Palk Strait
    difficulty: 1
    hints:
    - Between Tamil Nadu and Sri Lanka.
    - Narrow sea.
    solution: The Palk Strait lies between them.
    mistakes: {"Strait of Malacca": "s7_palk"}
  - prompt: Who carried Buddhism to Sri Lanka, according to tradition?
    options:
    - Mahinda, Ashoka's son
    - Chanakya
    - Kalidasa
    - Megasthenes
    answer: Mahinda, Ashoka's son
    difficulty: 2
    hints:
    - A Mauryan prince-monk.
    - Ashoka's family.
    solution: Tradition says Ashoka's son Mahinda took Buddhism to Sri Lanka.
    mistakes: {"Megasthenes": "s7_mahinda"}
  - prompt: Which country is a sea neighbour of India in the Indian Ocean, south-west of Lakshadweep?
    options:
    - Maldives
    - Nepal
    - Bhutan
    - Afghanistan
    answer: Maldives
    difficulty: 1
    hints:
    - An island nation.
    - Coral islands.
    solution: The Maldives lies south-west of Lakshadweep.
    mistakes:
      Nepal: c7ss_sea_neighbour
  - prompt: 'Angkor Wat, built as a Hindu temple, is in:'
    options:
    - Cambodia
    - Sri Lanka
    - Nepal
    - Pakistan
    answer: Cambodia
    difficulty: 2
    hints:
    - Southeast Asia.
    - Largest religious monument.
    solution: Angkor Wat is in Cambodia.
    mistakes: {"Sri Lanka": "s7_angkor"}
  - prompt: The Ramayana is still performed in which countries?
    options:
    - Thailand and Indonesia
    - Brazil and Chile
    - Norway and Sweden
    - Egypt and Kenya
    answer: Thailand and Indonesia
    difficulty: 2
    hints:
    - Southeast Asia.
    - Ramakien, Kakawin.
    solution: Versions of the Ramayana are told in Thailand and Indonesia.
    mistakes: {"Egypt and Kenya": "s7_ramayana_abroad"}
  - prompt: 'India''s policy of giving priority to nearby countries is called:'
    options:
    - Neighbourhood First
    - Look West
    - Make in India
    - Digital India
    answer: Neighbourhood First
    difficulty: 1
    hints:
    - Neighbours first.
    - Foreign policy.
    solution: It is called Neighbourhood First.
    mistakes: {"Look West": "s7_neighbourhood"}
