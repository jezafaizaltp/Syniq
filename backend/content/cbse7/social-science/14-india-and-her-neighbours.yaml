# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 2), SYNiq chapter 14. Format: content/README.md.
subject: cbse7-ss
chapter: 14
title: India and Her Neighbours
tips:
  c7ss_border: "The border with China is long but runs through high mountains. Which neighbour wraps around West Bengal and the north-east on three sides?"
  c7ss_sea_neighbour: "Nepal is a land neighbour. A sea neighbour lies across water; this one is a chain of coral islands south-west of Lakshadweep."
  s7_angkor: "Angkor Wat is in Southeast Asia."
  s7_bhutan_power: "Bhutan has fast mountain rivers. What can they make?"
  s7_brahmaputra: "The Kaveri, Narmada and Godavari stay within India. Which river comes from Tibet?"
  s7_mahinda: "Ashoka sent missionaries abroad, including his own son."
  s7_myanmar: "Pakistan and Afghanistan are to the west. Which neighbour is to the east?"
  s7_neighbourhood: "The policy's name says who comes first."
  s7_nepal: "Indians need visas for China, Myanmar and Afghanistan. Which Himalayan neighbour has an open border with India?"
  s7_palk: "Malacca is near Singapore. Which narrow strait is between Tamil Nadu and Sri Lanka?"
  s7_ramayana_abroad: "Indian culture spread east by sea to Southeast Asia."
  s7_seven_borders: "Go round the map: two neighbours in the west, three in the north, two in the east. Count them."
  c7ss14_dir: 'Picture India''s map and its edges: which countries lie to the west, the north and the east? Use direction to match.'
  c7ss14_share: 'Neighbours share more than borders: rivers, mountains, history, food and languages. Look for what crosses the border.'
  c7ss14_coop: Countries in a region work together in groups for trade, power, disasters and health. Think about what working together brings.
  c7ss14_sea: Some neighbours are across water, not land. Think about which sea or strait lies between.
  c7ss14_culture: Ideas, faiths and stories travelled with traders and monks to other lands. Think about where each one reached.
  c7ss14_calc: Write the calculation first and keep track of the units.
concepts:
- code: cbse7ss.nbr.land
  title: India and its land neighbours
  notes: |
    India shares land borders with seven countries: Pakistan (west), Afghanistan (north-west, via Ladakh region),
    China (north), Nepal and Bhutan (north), Bangladesh (east, the longest border) and Myanmar (east). Neighbours
    share rivers (Indus, Ganga, Brahmaputra), mountains, history, languages and cultures. Nepal and Bhutan have open
    or friendly borders with India; Bhutan exports hydroelectricity to India. Cooperation (SAARC, BIMSTEC) and
    disputes both shape relations.
  explanations:
    text: 'India shares land borders with seven countries: Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh and Myanmar. We share rivers, mountains, history and culture with them, and cooperate on trade, power and travel.'
    visual: 'Draw India''s outline and label its neighbours around it: Pakistan to the west, China, Nepal and Bhutan to the north, Bangladesh and Myanmar to the east.'
    step_by_step: 'Step 1: Name the neighbour. Step 2: Find its direction from India. Step 3: Note what is shared (a river, a culture). Step 4: Note one form of cooperation.'
    real_world: Indians and Nepalis can cross the India–Nepal border without a visa, a sign of a very close relationship.
  picture:
    kind: compare
    columns:
    - title: North
      points:
      - China
      - Nepal
      - Bhutan
    - title: West and north-west
      points:
      - Pakistan
      - Afghanistan
    - title: East
      points:
      - Bangladesh (longest border)
      - Myanmar
    alt: 'India''s seven land neighbours grouped by direction: China, Nepal and Bhutan to the north; Pakistan and Afghanistan to the west; Bangladesh and Myanmar to the east.'
  activity:
    type: sort
    prompt: Which neighbour?
    bins:
    - Pakistan
    - China
    - Bhutan
    - Bangladesh
    items:
    - label: Shares the Indus
      bin: Pakistan
      clue: West.
      why: Pakistan.
    - label: Across the high Himalayas in the north
      bin: China
      clue: Tibet.
      why: China.
    - label: Sells hydroelectricity to India
      bin: Bhutan
      clue: Small Himalayan kingdom.
      why: Bhutan.
    - label: India's longest land border
      bin: Bangladesh
      clue: East.
      why: Bangladesh.
  lesson:
    - teach: 'India shares land borders with seven countries: Pakistan to the west, Afghanistan to the north-west, China, Nepal and Bhutan to the north, and Bangladesh and Myanmar to the east. The border with Bangladesh is the longest.'
      picture:
        kind: compare
        columns:
        - title: Direction
          points:
          - West
          - North-west
          - North
          - East
        - title: Land neighbours
          points:
          - Pakistan
          - Afghanistan
          - China, Nepal, Bhutan
          - Bangladesh, Myanmar
        alt: India's seven land neighbours by direction.
      check:
        prompt: Which two neighbours lie to the east of India?
        options:
        - Bangladesh and Myanmar
        - Pakistan and Afghanistan
        - Nepal and China
        answer: Bangladesh and Myanmar
        why: Both border India's eastern and north-eastern states.
    - teach: 'Neighbours share rivers that cross borders: the Indus flows into Pakistan, the Ganga and Brahmaputra into Bangladesh. They share mountains, history, languages, food and festivals. People in Bengal and Bangladesh both speak Bengali.'
      check:
        prompt: Which language is spoken both in West Bengal and in Bangladesh?
        options:
        - Bengali
        - Tamil
        - Marathi
        answer: Bengali
        why: Bengali links people on both sides of the border.
    - teach: Relations involve both cooperation and disagreements. Nepal and Bhutan have open, friendly borders with India; Indians can visit Nepal without a visa. Bhutan sells hydroelectric power to India. Groups like SAARC and BIMSTEC help countries of the region cooperate.
      check:
        prompt: What does Bhutan's hydroelectricity sale to India show?
        options:
        - Neighbours can help each other
        - Countries never trade
        - Bhutan has no rivers
        answer: Neighbours can help each other
        why: Bhutan earns money; India gets clean power.
  items:
  - prompt: With how many countries does India share a land border?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Pakistan, Afghanistan, China, Nepal, Bhutan, Bangladesh, Myanmar.
    - Count them.
    solution: Seven countries.
    mistakes: {"5": "s7_seven_borders", "9": "s7_seven_borders"}
  - prompt: With which country does India share its longest land border?
    options:
    - Bangladesh
    - China
    - Pakistan
    - Nepal
    answer: Bangladesh
    difficulty: 2
    hints:
    - To the east.
    - Around West Bengal.
    solution: The India–Bangladesh border is the longest.
    mistakes:
      China: c7ss_border
  - prompt: Which neighbour lies to the east of India?
    options:
    - Myanmar
    - Pakistan
    - Afghanistan
    - Nepal
    answer: Myanmar
    difficulty: 1
    hints:
    - Beyond Manipur and Mizoram.
    - East.
    solution: Myanmar is to the east.
    mistakes: {"Pakistan": "s7_myanmar"}
  - prompt: 'Bhutan sells India large amounts of:'
    options:
    - Hydroelectricity
    - Petroleum
    - Coal
    - Wheat
    answer: Hydroelectricity
    difficulty: 2
    hints:
    - Himalayan rivers.
    - Power from dams.
    solution: Bhutan exports hydropower to India.
    mistakes: {"Petroleum": "s7_bhutan_power"}
  - prompt: Which river flows from Tibet (China) into India and then Bangladesh?
    options:
    - Brahmaputra
    - Kaveri
    - Narmada
    - Godavari
    answer: Brahmaputra
    difficulty: 2
    hints:
    - Through Assam.
    - Called Yarlung Tsangpo in Tibet.
    solution: The Brahmaputra flows through China, India and Bangladesh.
    mistakes: {"Godavari": "s7_brahmaputra"}
  - prompt: Which neighbour can Indians usually visit without a visa?
    options:
    - Nepal
    - China
    - Myanmar
    - Afghanistan
    answer: Nepal
    difficulty: 1
    hints:
    - Open border.
    - Himalayan country.
    solution: India and Nepal have an open border.
    mistakes: {"China": "s7_nepal"}
  - prompt: Which neighbour lies to the west of India?
    options:
    - Pakistan
    - Myanmar
    - Bhutan
    answer: Pakistan
    difficulty: 1
    hints:
    - It borders Rajasthan and Gujarat.
    - The Indus flows through it.
    solution: Pakistan lies to India's west.
    mistakes:
      Myanmar: c7ss14_dir
      Bhutan: c7ss14_dir
  - prompt: Which two small Himalayan countries lie between India and China?
    options:
    - Nepal and Bhutan
    - Sri Lanka and Maldives
    - Bangladesh and Myanmar
    answer: Nepal and Bhutan
    difficulty: 2
    hints:
    - They are in the mountains to the north.
    - Mount Everest is on one of their borders.
    solution: Nepal and Bhutan lie in the Himalayas between India and China.
    mistakes:
      Sri Lanka and Maldives: c7ss14_sea
      Bangladesh and Myanmar: c7ss14_dir
  - prompt: Which river flows from India into Pakistan?
    options:
    - Indus
    - Kaveri
    - Godavari
    answer: Indus
    difficulty: 2
    hints:
    - It gave India its name.
    - It flows from Ladakh westwards.
    solution: The Indus flows from Tibet through Ladakh into Pakistan.
    mistakes:
      Kaveri: c7ss14_share
      Godavari: c7ss14_share
  - prompt: Mount Everest lies on the border of China and which neighbour?
    options:
    - Nepal
    - Bangladesh
    - Pakistan
    answer: Nepal
    difficulty: 2
    hints:
    - It is a Himalayan country.
    - Its capital is Kathmandu.
    solution: Everest is on the Nepal-China border.
    mistakes:
      Bangladesh: c7ss14_dir
      Pakistan: c7ss14_dir
  - prompt: 'BIMSTEC is a group that helps countries to:'
    options:
    - Cooperate on trade and development
    - Fight wars
    - Close borders
    answer: Cooperate on trade and development
    difficulty: 2
    hints:
    - It joins countries around the Bay of Bengal.
    - It is about working together.
    solution: BIMSTEC brings Bay of Bengal countries together for trade, transport and development.
    mistakes:
      Fight wars: c7ss14_coop
      Close borders: c7ss14_coop
  - prompt: Which Indian states border Bangladesh? Pick the right group.
    options:
    - West Bengal, Assam, Meghalaya, Tripura, Mizoram
    - Kerala and Tamil Nadu
    - Punjab and Rajasthan
    answer: West Bengal, Assam, Meghalaya, Tripura, Mizoram
    difficulty: 3
    hints:
    - Bangladesh is to the east.
    - Look for eastern and north-eastern states.
    solution: Bangladesh borders West Bengal, Assam, Meghalaya, Tripura and Mizoram.
    mistakes:
      Kerala and Tamil Nadu: c7ss14_dir
      Punjab and Rajasthan: c7ss14_dir
  - prompt: Why do river-sharing countries need to cooperate?
    options:
    - Using water upstream affects people downstream
    - Rivers stop at borders
    - Water is not needed
    answer: Using water upstream affects people downstream
    difficulty: 3
    hints:
    - Rivers flow from one country into another.
    - Think of dams and floods.
    solution: Dams, pollution or floods upstream affect downstream countries, so agreements are needed.
    mistakes:
      Rivers stop at borders: c7ss14_share
      Water is not needed: c7ss14_share
  - prompt: India borders 7 countries by land. Of these, how many lie to the north (China, Nepal, Bhutan)?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Count the names in brackets.
    - They are in or beyond the Himalayas.
    solution: 'Step 1: China, Nepal, Bhutan. Step 2: that is 3.'
    mistakes:
      '7': c7ss14_calc
      '4': c7ss14_calc
  - prompt: Which festival is celebrated by people in both India and Nepal?
    options:
    - Dashain/Dussehra
    - Thanksgiving
    - Halloween
    answer: Dashain/Dussehra
    difficulty: 2
    hints:
    - It celebrates good over evil.
    - The other two are mainly American.
    solution: Dussehra (Dashain in Nepal) is a shared festival.
    mistakes:
      Thanksgiving: c7ss14_share
      Halloween: c7ss14_share
- code: cbse7ss.nbr.sea
  title: Maritime neighbours and cultural exchange
  after:
  - cbse7ss.nbr.land
  notes: |
    India's maritime (sea) neighbours include Sri Lanka (across the Palk Strait), the Maldives (south-west of
    Lakshadweep), and, across the Andaman Sea, Thailand and Indonesia. Over centuries, trade, religion and ideas
    travelled: Buddhism went from India to Sri Lanka (Ashoka's son Mahinda), and on to Southeast Asia; the Ramayana
    is told in Thailand and Indonesia; Angkor Wat in Cambodia was built as a Hindu temple. India cooperates with
    neighbours in disaster relief, health and trade, guided by its 'Neighbourhood First' approach.
  explanations:
    text: 'India''s sea neighbours include Sri Lanka, just across the narrow Palk Strait, and the Maldives. For centuries ideas, trade and religion sailed between them: Buddhism went to Sri Lanka, and the Ramayana is still told in Thailand and Indonesia.'
    visual: Draw India's southern tip with Sri Lanka just across a narrow strip of sea, the Maldives dots to the south-west, and arrows sailing east to Thailand and Indonesia carrying books and statues.
    step_by_step: 'Step 1: Name the sea neighbour. Step 2: Find the water body between (Palk Strait, Arabian Sea, Andaman Sea). Step 3: Note a cultural link. Step 4: Note present-day cooperation.'
    real_world: After the 2004 tsunami, India sent ships and aid to Sri Lanka and the Maldives, showing neighbours helping in disasters.
  picture:
    kind: compare
    columns:
    - title: Sea neighbour
      points:
      - Sri Lanka
      - Maldives
      - Thailand, Indonesia
    - title: Link with India
      points:
      - Palk Strait; Buddhism spread there
      - Near Lakshadweep; trade
      - Ramayana traditions; trade
    alt: 'India''s maritime neighbours and their links: Sri Lanka across the Palk Strait, the Maldives near Lakshadweep, and Thailand and Indonesia with Ramayana traditions.'
  activity:
    type: sort
    prompt: Which maritime neighbour?
    bins:
    - Sri Lanka
    - Maldives
    - Indonesia
    - Cambodia
    items:
    - label: Across the Palk Strait
      bin: Sri Lanka
      clue: South-east of Tamil Nadu.
      why: Sri Lanka.
    - label: Mahinda took Buddhism there
      bin: Sri Lanka
      clue: Ashoka's son.
      why: Sri Lanka.
    - label: South-west of Lakshadweep
      bin: Maldives
      clue: Islands.
      why: Maldives.
    - label: Ramayana told in Java
      bin: Indonesia
      clue: Islands of South-East Asia.
      why: Indonesia.
    - label: Angkor Wat
      bin: Cambodia
      clue: A great Hindu temple.
      why: Cambodia.
  lesson:
    - teach: India also has maritime (sea) neighbours. Sri Lanka lies across the narrow Palk Strait from Tamil Nadu. The Maldives lie south-west of Lakshadweep. Across the Andaman Sea are Thailand, Myanmar and Indonesia.
      check:
        prompt: Which neighbour is just across the Palk Strait?
        options:
        - Sri Lanka
        - Maldives
        - Indonesia
        answer: Sri Lanka
        why: The narrow Palk Strait separates Tamil Nadu and Sri Lanka.
    - teach: Ideas travelled by sea for centuries. Buddhism reached Sri Lanka with Ashoka's son Mahinda, then spread to Southeast Asia. The Ramayana is performed in Thailand (Ramakien) and Indonesia. Angkor Wat in Cambodia was built as a Hindu temple. Spices, cloth and stories moved with traders.
      picture:
        kind: flow
        steps:
        - 'India: Buddhism, epics, art'
        - 'Sri Lanka: Buddhism with Mahinda'
        - 'Southeast Asia: Ramayana, temples like Angkor Wat'
        alt: How ideas spread from India across the sea.
      check:
        prompt: 'Thailand''s version of the Ramayana is called:'
        options:
        - Ramakien
        - Mahabharata
        - Arthashastra
        answer: Ramakien
        why: Thailand retells the Ramayana as the Ramakien.
    - teach: Today India works with neighbours on trade, health and disaster relief (for example after the 2004 tsunami and in medical emergencies) under its 'Neighbourhood First' approach.
      check:
        prompt: 'Sending relief to a neighbour after a cyclone shows:'
        options:
        - Cooperation
        - A trade ban
        - A border dispute
        answer: Cooperation
        why: Helping in disasters builds friendship.
  items:
  - prompt: Which strait separates India and Sri Lanka?
    options:
    - Palk Strait
    - Strait of Malacca
    - Strait of Gibraltar
    - Bering Strait
    answer: Palk Strait
    difficulty: 1
    hints:
    - Between Tamil Nadu and Sri Lanka.
    - Narrow sea.
    solution: The Palk Strait lies between them.
    mistakes: {"Strait of Malacca": "s7_palk"}
  - prompt: Who carried Buddhism to Sri Lanka, according to tradition?
    options:
    - Mahinda, Ashoka's son
    - Chanakya
    - Kalidasa
    - Megasthenes
    answer: Mahinda, Ashoka's son
    difficulty: 2
    hints:
    - A Mauryan prince-monk.
    - Ashoka's family.
    solution: Tradition says Ashoka's son Mahinda took Buddhism to Sri Lanka.
    mistakes: {"Megasthenes": "s7_mahinda"}
  - prompt: Which country is a sea neighbour of India in the Indian Ocean, south-west of Lakshadweep?
    options:
    - Maldives
    - Nepal
    - Bhutan
    - Afghanistan
    answer: Maldives
    difficulty: 1
    hints:
    - An island nation.
    - Coral islands.
    solution: The Maldives lies south-west of Lakshadweep.
    mistakes:
      Nepal: c7ss_sea_neighbour
  - prompt: 'Angkor Wat, built as a Hindu temple, is in:'
    options:
    - Cambodia
    - Sri Lanka
    - Nepal
    - Pakistan
    answer: Cambodia
    difficulty: 2
    hints:
    - Southeast Asia.
    - Largest religious monument.
    solution: Angkor Wat is in Cambodia.
    mistakes: {"Sri Lanka": "s7_angkor"}
  - prompt: The Ramayana is still performed in which countries?
    options:
    - Thailand and Indonesia
    - Brazil and Chile
    - Norway and Sweden
    - Egypt and Kenya
    answer: Thailand and Indonesia
    difficulty: 2
    hints:
    - Southeast Asia.
    - Ramakien, Kakawin.
    solution: Versions of the Ramayana are told in Thailand and Indonesia.
    mistakes: {"Egypt and Kenya": "s7_ramayana_abroad"}
  - prompt: 'India''s policy of giving priority to nearby countries is called:'
    options:
    - Neighbourhood First
    - Look West
    - Make in India
    - Digital India
    answer: Neighbourhood First
    difficulty: 1
    hints:
    - Neighbours first.
    - Foreign policy.
    solution: It is called Neighbourhood First.
    mistakes: {"Look West": "s7_neighbourhood"}
  - prompt: Lakshadweep and the Maldives lie in which sea?
    options:
    - Arabian Sea
    - Bay of Bengal
    - Red Sea
    answer: Arabian Sea
    difficulty: 2
    hints:
    - They are west of Kerala.
    - The Bay of Bengal is east.
    solution: Both island groups lie in the Arabian Sea, west of India's south coast.
    mistakes:
      Bay of Bengal: c7ss14_sea
      Red Sea: c7ss14_sea
  - prompt: The Andaman and Nicobar Islands are closest to which countries?
    options:
    - Myanmar and Indonesia
    - Pakistan
    - Maldives
    answer: Myanmar and Indonesia
    difficulty: 3
    hints:
    - They are far east in the Bay of Bengal.
    - Indonesia's Sumatra is near the south end.
    solution: The islands lie close to Myanmar in the north and Indonesia's Sumatra in the south.
    mistakes:
      Pakistan: c7ss14_sea
      Maldives: c7ss14_sea
  - prompt: Who was Mahinda?
    options:
    - Ashoka's son who took Buddhism to Sri Lanka
    - A Greek traveller
    - A Gupta king
    answer: Ashoka's son who took Buddhism to Sri Lanka
    difficulty: 2
    hints:
    - He was a Buddhist monk.
    - His father was a Mauryan emperor.
    solution: Mahinda, Ashoka's son, carried Buddhism to Sri Lanka.
    mistakes:
      A Greek traveller: c7ss14_culture
      A Gupta king: c7ss14_culture
  - prompt: Angkor Wat was first built as a temple to which god?
    options:
    - Vishnu
    - Zeus
    - Thor
    answer: Vishnu
    difficulty: 3
    hints:
    - It was a Hindu temple.
    - The other two are European gods.
    solution: Angkor Wat was built in the 12th century as a Hindu temple to Vishnu, later becoming Buddhist.
    mistakes:
      Zeus: c7ss14_culture
      Thor: c7ss14_culture
  - prompt: How did Indian ideas mostly reach Southeast Asia long ago?
    options:
    - With traders and monks on ships
    - Through the internet
    - By railway
    answer: With traders and monks on ships
    difficulty: 1
    hints:
    - Think of the sea routes.
    - There were no trains or internet then.
    solution: Traders and monks sailed across the Bay of Bengal, carrying goods and ideas.
    mistakes:
      Through the internet: c7ss14_culture
      By railway: c7ss14_culture
  - prompt: The Palk Strait at its narrowest is about 53 km wide. A boat goes at 20 km per hour. About how many hours to cross?
    answer: '2.65'
    check: Rational(53,20)
    difficulty: 3
    hints:
    - Time = distance ÷ speed.
    - Divide 53 by 20.
    solution: 'Step 1: time = 53 ÷ 20. Step 2: = 2.65 hours (a little over 2½ hours).'
    mistakes:
      '1060': c7ss14_calc
      '33': c7ss14_calc
  - prompt: Which of these is a maritime neighbour of India?
    options:
    - Maldives
    - Nepal
    - Bhutan
    answer: Maldives
    difficulty: 1
    hints:
    - Maritime means by sea.
    - Nepal and Bhutan are landlocked.
    solution: The Maldives is an island nation, a sea neighbour of India.
    mistakes:
      Nepal: c7ss14_sea
      Bhutan: c7ss14_sea
  - prompt: '''Neighbourhood First'' means India:'
    options:
    - Gives priority to good relations with nearby countries
    - Closes all borders
    - Trades only with far countries
    answer: Gives priority to good relations with nearby countries
    difficulty: 2
    hints:
    - '''First'' means priority.'
    - Neighbours are nearby.
    solution: The approach puts close relations with neighbours at the top of India's foreign policy.
    mistakes:
      Closes all borders: c7ss14_coop
      Trades only with far countries: c7ss14_coop
  - prompt: 'After the 2004 Indian Ocean tsunami, India sent ships to help Sri Lanka and the Maldives. This shows:'
    options:
    - Disaster relief cooperation
    - A trade war
    - A border dispute
    answer: Disaster relief cooperation
    difficulty: 1
    hints:
    - Think about helping in a crisis.
    - Neighbours supported each other.
    solution: Sending help after a disaster is cooperation in disaster relief.
    mistakes:
      A trade war: c7ss14_coop
      A border dispute: c7ss14_coop
