      bin: Aryabhata
      clue: Aryabhatiya.
      why: Aryabhata.
    - label: A close value of π
      bin: Aryabhata
      clue: Mathematics.
      why: Aryabhata.
    - label: Meghaduta
      bin: Kalidasa
      clue: Sanskrit poem.
      why: Kalidasa.
    - label: Hasn't rusted in 1,500 years
      bin: Iron pillar
      clue: In Delhi.
      why: Mehrauli iron pillar.
    - label: A great centre of learning
      bin: Nalanda
      clue: University.
      why: Nalanda.
  items:
  - prompt: Who wrote the Aryabhatiya?
    options:
    - Aryabhata
    - Kalidasa
    - Harishena
    - Faxian
    answer: Aryabhata
    difficulty: 1
