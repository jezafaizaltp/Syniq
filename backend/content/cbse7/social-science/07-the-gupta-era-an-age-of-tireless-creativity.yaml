# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 7. Format: content/README.md.
subject: cbse7-ss
chapter: 7
title: 'The Gupta Era: An Age of Tireless Creativity'
tips:
  c7ss_ruler_gupta: "Ashoka was a Mauryan, centuries earlier. The Prayag pillar praises a Gupta king famous for conquests, son of Chandragupta I."
  s7_ajanta_paint: "Ajanta's walls are covered with colourful scenes."
  s7_aryabhatiya: "The book is named after its author."
  s7_dinara: "The Gupta gold coin's name comes from the Roman 'denarius'."
  s7_faxian: "Xuanzang came later, under Harsha. Which pilgrim came under Chandragupta II?"
  s7_gupta_period: "The Guptas came after the Mauryas and Kushanas, in the early centuries CE."
  s7_hunas: "The Mughals and British came over a thousand years later."
  s7_iron_pillar: "The pillar is iron. What would you expect iron left outside to do?"
  s7_nalanda: "Nalanda had libraries and teachers. What kind of place was it?"
  s7_vikramaditya: "Devanampiya was Ashoka's title. Chandragupta II's title means 'sun of valour'."
  s7_zero: "Roman numerals have no zero. Which idea did Indian mathematicians develop?"
  c7ss7_order: The family went founder, then the conqueror son, then the grandson at the height. Place each ruler in that order.
  c7ss7_source: Some sources are carved praise, some are coins, some are travellers' accounts. Ask who made the source and why.
  c7ss7_decline: Empires weaken from outside attacks and from weak rulers inside. Think about which group attacked from the north-west.
  c7ss7_science: 'Separate the thinkers by field: one studied the sky and numbers, one wrote plays and poems.'
  c7ss7_place: Learning centres, temples, caves and pillars are in different places. Picture the map before you choose.
  c7ss7_metal: This metal object surprises scientists because of what has NOT happened to it over many centuries.
  c7ss7_number: A digit's value depends on its position, and a special symbol holds an empty place.

concepts:
- code: cbse7ss.gupta.rulers
  title: The Gupta Empire and its rulers
  notes: |
    The Gupta Empire (about 4th–6th century CE) began with Chandragupta I. Samudragupta expanded it; his court poet
    Harishena praised him in the Prayag (Allahabad) pillar inscription. Chandragupta II (Vikramaditya) ruled at its
    height; the Chinese pilgrim Faxian visited then and described a peaceful land. Administration: the king was
    helped by ministers; provinces and villages had local officials; gold coins (dinaras) show rulers playing the
    veena or hunting. Invasions by the Hunas and weak successors led to decline.
  explanations:
    text: The Guptas ruled much of North India about 1,600 years ago. Samudragupta expanded the empire; under Chandragupta II it reached its height. A Chinese traveller, Faxian, described it as peaceful and well run.
    visual: 'Picture a gold Gupta coin: on one side a king playing the veena, on the other a goddess. Beside it, a pillar with Harishena''s verses praising Samudragupta.'
    step_by_step: 'Step 1: Founder: Chandragupta I. Step 2: Expansion: Samudragupta (Prayag inscription). Step 3: Height: Chandragupta II (Faxian''s visit). Step 4: Decline: Huna invasions.'
    real_world: Gupta gold coins are some of the finest coins of ancient India and are kept in museums today.
  picture:
    kind: flow
    steps:
    - Chandragupta I founds the empire
    - Samudragupta expands it
    - 'Chandragupta II: the height'
    - Faxian visits and writes about it
    - Huna invasions; decline
    alt: The Gupta Empire from founding by Chandragupta I, through Samudragupta and Chandragupta II, to decline after the Huna invasions.
  activity:
    type: sort
    prompt: Which Gupta-age figure?
    bins:
    - Chandragupta I
    - Samudragupta
    - Chandragupta II
    - Faxian
    items:
    - label: Began the empire
      bin: Chandragupta I
      clue: The first.
      why: Chandragupta I.
    - label: Praised by Harishena on the Prayag pillar
      bin: Samudragupta
      clue: Expanded the empire.
      why: Samudragupta.
    - label: Also called Vikramaditya
      bin: Chandragupta II
      clue: At its height.
      why: Chandragupta II.
    - label: Chinese pilgrim who described a peaceful land
      bin: Faxian
      clue: A visitor.
      why: Faxian.
  lesson:
    - teach: From about the 4th to the 6th century CE, the Gupta Empire ruled much of north India. It began with Chandragupta I (not the Mauryan Chandragupta). His son Samudragupta won many wars and expanded it.
      picture:
        kind: flow
        steps:
        - 'Chandragupta I: founder'
        - 'Samudragupta: great conqueror'
        - 'Chandragupta II (Vikramaditya): height of the empire'
        - 'Later rulers and Huna attacks: decline'
        alt: The main Gupta rulers in order.
      check:
        prompt: Which ruler greatly expanded the Gupta Empire?
        options:
        - Samudragupta
        - Ashoka
        - Kharavela
        answer: Samudragupta
        why: He conquered many kingdoms.
    - teach: Samudragupta's court poet Harishena praised him in an inscription on the Prayag (Allahabad) pillar, the same pillar that has an edict of Ashoka. Gupta gold coins (dinaras) show kings hunting lions or playing the veena, so Samudragupta is remembered as a music lover too.
      check:
        prompt: What does a coin showing a king playing the veena suggest?
        options:
        - He loved music
        - He was a farmer
        - He was a sailor
        answer: He loved music
        why: Kings chose images that showed what they wanted to be known for.
    - teach: Chandragupta II, called Vikramaditya, ruled at the height. The Chinese pilgrim Faxian came to study Buddhism and described a peaceful, well-run land. Later, attacks by the Hunas from Central Asia and weak successors made the empire decline in the 6th century.
      check:
        prompt: Why did Faxian come to India?
        options:
        - To study Buddhism and collect texts
        - To conquer it
        - To sell horses
        answer: To study Buddhism and collect texts
        why: He was a Buddhist pilgrim.
  items:
  - prompt: Which Gupta ruler is praised in the Prayag pillar inscription?
    options:
    - Samudragupta
    - Chandragupta I
    - Skandagupta
    - Ashoka
    answer: Samudragupta
    difficulty: 2
    hints:
    - By the poet Harishena.
    - A conqueror.
    solution: Harishena's inscription praises Samudragupta.
    mistakes:
      Ashoka: c7ss_ruler_gupta
  - prompt: Which Chinese pilgrim visited during Chandragupta II's reign?
    options:
    - Faxian
    - Xuanzang
    - Marco Polo
    - Megasthenes
    answer: Faxian
    difficulty: 2
    hints:
    - Early 5th century.
    - Came for Buddhist texts.
    solution: Faxian visited in Chandragupta II's time.
    mistakes: {"Xuanzang": "s7_faxian"}
  - prompt: 'Gupta gold coins were called:'
    options:
    - Dinaras
    - Punch-marked coins
    - Rupees
    - Mohurs
    answer: Dinaras
    difficulty: 2
    hints:
    - From the Roman 'denarius'.
    - Gold.
    solution: Gupta gold coins were dinaras.
    mistakes: {"Mohurs": "s7_dinara"}
  - prompt: About when did the Gupta Empire flourish?
    options:
    - 4th to 6th century CE
    - 6th century BCE
    - 12th century CE
    - 18th century CE
    answer: 4th to 6th century CE
    difficulty: 1
    hints:
    - After the Satavahanas.
    - About 1,600 years ago.
    solution: The Guptas flourished from the 4th to 6th century CE.
    mistakes: {"6th century BCE": "s7_gupta_period"}
  - prompt: Which invaders weakened the Gupta Empire?
    options:
    - The Hunas
    - The Mughals
    - The British
    - The Portuguese
    answer: The Hunas
    difficulty: 2
    hints:
    - From Central Asia.
    - 5th–6th century.
    solution: Huna invasions weakened the Guptas.
    mistakes: {"The Mughals": "s7_hunas"}
  - prompt: 'Chandragupta II is also known by the title:'
    options:
    - Vikramaditya
    - Devanampiya
    - Satakarni
    - Kharavela
    answer: Vikramaditya
    difficulty: 1
    hints:
    - '''Sun of valour''.'
    - Famous in legends.
    solution: Chandragupta II took the title Vikramaditya.
    mistakes: {"Devanampiya": "s7_vikramaditya"}
  - prompt: Who founded the Gupta Empire?
    options:
    - Chandragupta I
    - Chandragupta Maurya
    - Ashoka
    answer: Chandragupta I
    difficulty: 2
    hints:
    - Do not mix him up with the Mauryan founder.
    - His son was Samudragupta.
    solution: Chandragupta I founded the Gupta Empire in the 4th century CE.
    mistakes:
      Chandragupta Maurya: c7ss7_order
      Ashoka: c7ss7_order
  - prompt: Who wrote the praise of Samudragupta on the Prayag pillar?
    options:
    - Harishena
    - Kalidasa
    - Faxian
    answer: Harishena
    difficulty: 2
    hints:
    - He was a court poet.
    - Faxian was a Chinese traveller.
    solution: Harishena, Samudragupta's court poet, composed the Prayag inscription.
    mistakes:
      Kalidasa: c7ss7_source
      Faxian: c7ss7_source
  - prompt: Why might the Prayag inscription not tell the whole truth about Samudragupta?
    options:
    - It was written to praise him
    - It was written by his enemies
    - It is in Chinese
    answer: It was written to praise him
    difficulty: 3
    hints:
    - Who wrote it, and for whom?
    - Praise can leave out failures.
    solution: A court poet writing praise may exaggerate victories and leave out defeats.
    mistakes:
      It was written by his enemies: c7ss7_source
      It is in Chinese: c7ss7_source
  - prompt: 'Samudragupta was Chandragupta II''s:'
    options:
    - Father
    - Grandson
    - Teacher
    answer: Father
    difficulty: 2
    hints:
    - Samudragupta ruled first.
    - Chandragupta II was his son.
    solution: Chandragupta I -> Samudragupta -> Chandragupta II, so Samudragupta was his father.
    mistakes:
      Grandson: c7ss7_order
      Teacher: c7ss7_order
  - prompt: 'Faxian came to India from:'
    options:
    - China
    - Greece
    - Rome
    answer: China
    difficulty: 1
    hints:
    - He was a Buddhist pilgrim from the east.
    - He crossed the Himalayas.
    solution: Faxian was a Chinese Buddhist monk.
    mistakes:
      Greece: c7ss7_source
      Rome: c7ss7_source
  - prompt: 'The Hunas came into India from:'
    options:
    - Central Asia, through the north-west
    - The Indian Ocean
    - Sri Lanka
    answer: Central Asia, through the north-west
    difficulty: 2
    hints:
    - They were horse-riding warriors.
    - They came over the mountain passes.
    solution: The Hunas came from Central Asia through the north-western passes.
    mistakes:
      The Indian Ocean: c7ss7_decline
      Sri Lanka: c7ss7_decline
  - prompt: Which TWO things led to the Gupta decline?
    options:
    - Huna invasions and weak rulers
    - Too many schools and temples
    - Peace and good harvests
    answer: Huna invasions and weak rulers
    difficulty: 2
    hints:
    - One reason came from outside.
    - One reason came from inside.
    solution: Attacks by the Hunas and weaker later kings brought the empire down.
    mistakes:
      Too many schools and temples: c7ss7_decline
      Peace and good harvests: c7ss7_decline
  - prompt: 'Gupta gold coins tell historians about:'
    options:
    - Kings' interests and the empire's wealth
    - Train timings
    - Modern prices
    answer: Kings' interests and the empire's wealth
    difficulty: 2
    hints:
    - Gold shows wealth.
    - Pictures on them show what kings did.
    solution: Many gold coins show wealth; their pictures show kings hunting, playing music or performing rituals.
    mistakes:
      Train timings: c7ss7_source
      Modern prices: c7ss7_source
  - prompt: Samudragupta came to power about 335 CE and Chandragupta II about 375 CE. How many years apart?
    answer: '40'
    check: 375-335
    difficulty: 2
    hints:
    - Both dates are CE, counting upwards.
    - Subtract the earlier from the later.
    solution: 'Step 1: both are CE, so subtract. Step 2: 375 - 335 = 40 years.'
    mistakes:
      '710': c7ss7_order
      '35': c7ss7_order
- code: cbse7ss.gupta.culture
  title: Science, literature and art in the Gupta era
  after:
  - cbse7ss.gupta.rulers
  notes: |
    This was an age of great creativity. Aryabhata wrote the Aryabhatiya: the Earth rotates, eclipses are caused by
    shadows, and a close value of π. The decimal place-value system with zero developed in India in these
    centuries. Kalidasa wrote Abhijnanashakuntalam and Meghaduta in Sanskrit. Nalanda grew into a great centre of
    learning. Art: the iron pillar at Delhi (Mehrauli) has resisted rust for over 1,500 years; the Dashavatara
    temple at Deogarh is an early stone temple; Ajanta cave paintings flourished (later phase, partly under the
    Vakatakas). Trade continued with Southeast Asia.
  explanations:
    text: 'The Gupta era was full of creativity: Aryabhata''s astronomy and mathematics, Kalidasa''s plays and poems, the rust-proof iron pillar in Delhi, early stone temples and the paintings of Ajanta.'
    visual: Picture the Mehrauli iron pillar in Delhi, smooth and dark after more than 1,500 years in the open air, with no rust.
    step_by_step: 'Step 1: Science and maths: Aryabhata, zero and place value. Step 2: Literature: Kalidasa. Step 3: Learning: Nalanda. Step 4: Art and metalwork: iron pillar, temples, Ajanta.'
    real_world: The zero and the place-value system we use in every calculation today developed in India during these centuries.
  picture:
    kind: compare
    columns:
    - title: Science and learning
      points:
      - 'Aryabhata: Earth rotates'
      - Zero and place value
      - Nalanda university
    - title: Literature and art
      points:
      - 'Kalidasa: Shakuntalam'
      - Iron pillar of Delhi
      - Ajanta paintings
      - Deogarh temple
    alt: Achievements of the Gupta era in science and learning (Aryabhata, zero, Nalanda) and in literature and art (Kalidasa, iron pillar, Ajanta).
  activity:
    type: sort
    prompt: Who or what?
    bins:
    - Aryabhata
    - Kalidasa
    - Iron pillar
    - Nalanda
    items:
    - label: Said the Earth rotates
      bin: Aryabhata
      clue: Aryabhatiya.
      why: Aryabhata.
    - label: A close value of π
      bin: Aryabhata
      clue: Mathematics.
      why: Aryabhata.
    - label: Meghaduta
      bin: Kalidasa
      clue: Sanskrit poem.
      why: Kalidasa.
    - label: Hasn't rusted in 1,500 years
      bin: Iron pillar
      clue: In Delhi.
      why: Mehrauli iron pillar.
    - label: A great centre of learning
      bin: Nalanda
      clue: University.
      why: Nalanda.
  lesson:
    - teach: The Gupta age was full of new ideas. Aryabhata, an astronomer-mathematician, wrote the Aryabhatiya at age 23. He said the Earth spins on its axis, that eclipses are caused by shadows, and gave a close value of π (about 3.1416).
      check:
        prompt: What did Aryabhata say causes eclipses?
        options:
        - Shadows of the Earth and Moon
        - A demon swallowing the Sun
        - Clouds
        answer: Shadows of the Earth and Moon
        why: He explained eclipses scientifically.
    - teach: 'Indian mathematicians built the place-value system with zero: the same digit means different amounts by position (5 in 50 vs 500), and 0 holds an empty place. This system spread through the Arab world to Europe and is used everywhere today.'
      picture:
        kind: compare
        columns:
        - title: Number
          points:
          - '5'
          - '50'
          - '500'
        - title: What the 5 means
          points:
          - five ones
          - five tens
          - five hundreds
        alt: The same digit 5 has different values in different places.
      check:
        prompt: In 307, what does the 0 tell us?
        options:
        - There are no tens
        - There are no hundreds
        - The number is zero
        answer: There are no tens
        why: Zero holds the tens place empty.
    - teach: Kalidasa wrote Sanskrit plays and poems such as Abhijnanashakuntalam and Meghaduta (the cloud messenger). Nalanda became a great centre of learning. The Mehrauli iron pillar in Delhi has barely rusted in 1,500+ years; Ajanta caves have famous paintings; the Deogarh Dashavatara temple is an early stone temple.
      check:
        prompt: 'Meghaduta is a poem in which a cloud acts as a:'
        options:
        - Messenger
        - King
        - Teacher
        answer: Messenger
        why: '''Duta'' means messenger.'
  items:
  - prompt: Who wrote the Aryabhatiya?
    options:
    - Aryabhata
    - Kalidasa
    - Harishena
    - Faxian
    answer: Aryabhata
    difficulty: 1
    hints:
    - An astronomer.
    - Same name.
    solution: Aryabhata wrote the Aryabhatiya.
    mistakes: {"Kalidasa": "s7_aryabhatiya"}
  - prompt: 'Kalidasa is famous for writing:'
    options:
    - Abhijnanashakuntalam
    - The Arthashastra
    - The Indica
    - The Aryabhatiya
    answer: Abhijnanashakuntalam
    difficulty: 1
    hints:
    - A Sanskrit play.
    - About Shakuntala.
    solution: Kalidasa wrote Abhijnanashakuntalam.
    mistakes:
      The Arthashastra: c7ss_read_again
  - prompt: Why is the iron pillar at Mehrauli famous?
    options:
    - It has not rusted for over 1,500 years
    - It is made of gold
    - It is the tallest pillar
    - It can speak
    answer: It has not rusted for over 1,500 years
    difficulty: 1
    hints:
    - Metalwork skill.
    - In the open air.
    solution: Its iron has resisted rust for centuries.
    mistakes: {"It is the tallest pillar": "s7_iron_pillar"}
  - prompt: Which mathematical idea developed in India in this period?
    options:
    - Zero with the place-value system
    - Roman numerals
    - Calculators
    - Fractions only
    answer: Zero with the place-value system
    difficulty: 2
    hints:
    - Used in every number today.
    - '0.'
    solution: The decimal place-value system with zero developed in India.
    mistakes: {"Roman numerals": "s7_zero"}
  - prompt: 'Nalanda was a famous:'
    options:
    - Centre of learning
    - Fort
    - Port
    - Desert
    answer: Centre of learning
    difficulty: 1
    hints:
    - Students came from abroad.
    - In Bihar.
    solution: Nalanda was a great university.
    mistakes: {"Fort": "s7_nalanda"}
  - prompt: 'The Ajanta caves are famous for their:'
    options:
    - Paintings
    - Iron tools
    - Coins
    - Bridges
    answer: Paintings
    difficulty: 1
    hints:
    - Wall art.
    - Buddhist stories.
    solution: Ajanta is famous for its cave paintings.
    mistakes: {"Coins": "s7_ajanta_paint"}
  - prompt: Kalidasa wrote mainly in which language?
    options:
    - Sanskrit
    - Tamil
    - Persian
    answer: Sanskrit
    difficulty: 1
    hints:
    - It was the court language of the Guptas.
    - Abhijnanashakuntalam is in it.
    solution: Kalidasa wrote his plays and poems in Sanskrit.
    mistakes:
      Tamil: c7ss7_science
      Persian: c7ss7_science
  - prompt: 'Aryabhata''s value of π was about:'
    options:
    - '3.1416'
    - '2.5'
    - '10'
    answer: '3.1416'
    difficulty: 2
    hints:
    - It is a little more than 3.
    - It is very close to the modern value.
    solution: Aryabhata gave π ≈ 3.1416, very close to the modern value.
    mistakes:
      '2.5': c7ss7_science
      '10': c7ss7_science
  - prompt: 'Aryabhata said the Earth:'
    options:
    - Spins on its axis
    - Is flat
    - Does not move at all
    answer: Spins on its axis
    difficulty: 1
    hints:
    - This explains day and night.
    - He was ahead of his time.
    solution: Aryabhata said the Earth rotates on its axis, causing day and night.
    mistakes:
      Is flat: c7ss7_science
      Does not move at all: c7ss7_science
  - prompt: Where is the iron pillar that has hardly rusted?
    options:
    - Mehrauli, Delhi
    - Ajanta
    - Nalanda
    answer: Mehrauli, Delhi
    difficulty: 1
    hints:
    - It stands in the Qutb complex.
    - It is in India's capital.
    solution: The iron pillar stands at Mehrauli in Delhi, in the Qutb complex.
    mistakes:
      Ajanta: c7ss7_place
      Nalanda: c7ss7_place
  - prompt: Why do scientists still study the Mehrauli pillar?
    options:
    - Its iron resists rusting
    - It is made of gold
    - It glows at night
    answer: Its iron resists rusting
    difficulty: 2
    hints:
    - Iron normally rusts in rain.
    - This one has stood outdoors for centuries.
    solution: A thin protective layer keeps the iron from rusting, showing great metal skill.
    mistakes:
      It is made of gold: c7ss7_metal
      It glows at night: c7ss7_metal
  - prompt: In the number 4,050, what is the value of the 4?
    answer: '4000'
    check: '4000'
    difficulty: 2
    hints:
    - Count the places from the right.
    - The 4 is in the thousands place.
    solution: 'Step 1: the 4 is in the thousands place. Step 2: its value is 4 × 1000 = 4000.'
    mistakes:
      '4': c7ss7_number
      '400': c7ss7_number
  - prompt: Nalanda is in which present-day state?
    options:
    - Bihar
    - Kerala
    - Gujarat
    answer: Bihar
    difficulty: 2
    hints:
    - It is near Rajgir.
    - It is in the old Magadha region.
    solution: Nalanda is in Bihar, in the old Magadha region.
    mistakes:
      Kerala: c7ss7_place
      Gujarat: c7ss7_place
  - prompt: Which work is a play by Kalidasa?
    options:
    - Abhijnanashakuntalam
    - Aryabhatiya
    - Arthashastra
    answer: Abhijnanashakuntalam
    difficulty: 2
    hints:
    - It tells the story of Shakuntala.
    - The other two are about science and statecraft.
    solution: Abhijnanashakuntalam is Kalidasa's play; the Aryabhatiya is astronomy and the Arthashastra is statecraft.
    mistakes:
      Aryabhatiya: c7ss7_science
      Arthashastra: c7ss7_science
  - prompt: Why was zero such an important idea?
    options:
    - It let any number be written with ten digits
    - It made numbers disappear
    - It was only used for money
    answer: It let any number be written with ten digits
    difficulty: 3
    hints:
    - Think of writing 1,005 without a sign for an empty place.
    - Ten digits and place value are enough.
    solution: With zero and place value, any number can be written with just 0-9, making calculation easy.
    mistakes:
      It made numbers disappear: c7ss7_number
      It was only used for money: c7ss7_number
