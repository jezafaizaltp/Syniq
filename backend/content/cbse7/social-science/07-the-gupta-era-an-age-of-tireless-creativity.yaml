      clue: Expanded the empire.
      why: Samudragupta.
    - label: Also called Vikramaditya
      bin: Chandragupta II
      clue: At its height.
      why: Chandragupta II.
    - label: Chinese pilgrim who described a peaceful land
      bin: Faxian
      clue: A visitor.
      why: Faxian.
