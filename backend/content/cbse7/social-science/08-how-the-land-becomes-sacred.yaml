# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 8. Format: content/README.md.
subject: cbse7-ss
chapter: 8
title: How the Land Becomes Sacred
tips:
  c7ss_groves: 'Sacred groves have local names: kavu (Kerala), devrai (Maharashtra), sarna (Jharkhand), oran (Rajasthan).'
concepts:
- code: cbse7ss.sacred.places
  title: How land becomes sacred
  notes: |
    Many places in India are considered sacred: rivers (Ganga, Yamuna, Narmada, Kaveri), mountains (Kailash,
    Arunachala), groves and lakes, as well as temples, mosques, churches, gurdwaras and monasteries. Places become
    sacred through stories, the lives of saints, natural features, and centuries of worship. Pilgrimage (tirtha
    yatra) connects distant regions: the char dham (Badrinath, Dwarka, Puri, Rameswaram) at four corners of India;
    the twelve jyotirlingas; the 51 shakti peethas; Bodh Gaya for Buddhists; Amritsar's Golden Temple for Sikhs;
    Ajmer Sharif dargah; Velankanni church. Pilgrimages build a shared sense of India as one land.
  explanations:
    text: Across India, rivers, mountains, groves and places of worship are treated as sacred because of stories, saints and centuries of devotion. Pilgrims travel long distances to them, which has linked people from every corner of India.
    visual: 'Draw India with four pins at its corners, Badrinath, Dwarka, Puri and Rameswaram, and add other pins: Bodh Gaya, Amritsar, Ajmer, Velankanni. Lines joining them show pilgrims crossing the whole land.'
    step_by_step: 'Step 1: Name the sacred place. Step 2: Say which community holds it sacred. Step 3: Say why: a story, a saint, or a natural feature. Step 4: Explain how pilgrimage links regions.'
    real_world: The Kumbh Mela, held at Prayagraj, Haridwar, Ujjain and Nashik, is one of the largest gatherings of people on Earth.
  picture:
    kind: compare
    columns:
    - title: Natural sacred places
      points:
      - 'Rivers: Ganga, Kaveri'
      - 'Mountains: Kailash'
      - Sacred groves
    - title: Places of worship and pilgrimage
      points:
      - Char dham
      - Bodh Gaya
      - Golden Temple, Amritsar
      - Ajmer Sharif, Velankanni
    alt: 'Sacred places in India: natural ones like rivers, mountains and groves, and pilgrimage centres of many faiths.'
  activity:
    type: sort
    prompt: Which faith's pilgrimage place?
    bins:
    - Buddhist
    - Sikh
    - Sufi
    - Christian
    items:
    - label: Bodh Gaya
      bin: Buddhist
      clue: Enlightenment.
      why: Buddhist.
    - label: Golden Temple, Amritsar
      bin: Sikh
      clue: Harmandir Sahib.
      why: Sikh.
    - label: Ajmer Sharif dargah
      bin: Sufi
      clue: Moinuddin Chishti.
      why: Sufi shrine.
    - label: Velankanni church
      bin: Christian
      clue: Tamil Nadu coast.
      why: Christian.
  items:
  - prompt: How many places make up the char dham pilgrimage?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - '''Char'' means four.'
    - At four corners of India.
    solution: 'Badrinath, Dwarka, Puri and Rameswaram: four.'
  - prompt: 'Bodh Gaya is especially sacred to:'
    options:
    - Buddhists
    - Sikhs
    - Parsis
    - Jews
    answer: Buddhists
    difficulty: 1
    hints:
    - The Buddha's enlightenment.
    - In Bihar.
    solution: The Buddha attained enlightenment at Bodh Gaya.
  - prompt: 'The Golden Temple at Amritsar is the holiest shrine of:'
    options:
    - Sikhs
    - Jains
    - Christians
    - Buddhists
    answer: Sikhs
    difficulty: 1
    hints:
    - Harmandir Sahib.
    - Punjab.
    solution: It is the holiest Sikh gurdwara.
    mistakes:
      Jains: c7ss_read_again
  - prompt: Which of these is a sacred river?
    options:
    - Kaveri
    - Thar
    - Deccan
    - Aravalli
    answer: Kaveri
    difficulty: 1
    hints:
    - The others are landforms.
    - Flows through Karnataka and Tamil Nadu.
    solution: The Kaveri is a sacred river.
  - prompt: How did pilgrimages help unite India?
    options:
    - People travelled across regions and shared culture
    - They stopped trade
    - They divided people
    - They were only for kings
    answer: People travelled across regions and shared culture
    difficulty: 2
    hints:
    - Pilgrims from all over.
    - Shared stories.
    solution: Pilgrims crossing the land built a sense of one shared land.
  - prompt: Where is the Kumbh Mela held?
    options:
    - Prayagraj, Haridwar, Ujjain and Nashik
    - Only in Delhi
    - Only in Chennai
    - Abroad
    answer: Prayagraj, Haridwar, Ujjain and Nashik
    difficulty: 2
    hints:
    - Four river cities.
    - In turn.
    solution: It rotates among Prayagraj, Haridwar, Ujjain and Nashik.
- code: cbse7ss.sacred.ecology
  title: Sacred ecology and protecting sacred spaces
  after:
  - cbse7ss.sacred.places
  notes: |
    Sacred groves (devrai in Maharashtra, kavu in Kerala, sarna in Jharkhand, orans in Rajasthan) are patches of
    forest protected by communities for a deity; cutting trees there is forbidden, so they preserve rare plants,
    animals and water sources. Sacred lakes and ponds (Khecheopalri in Sikkim) are kept clean. Pilgrim towns
    support many livelihoods (guides, shops, boatmen). Crowds and pollution can damage sacred sites, so rivers like
    the Ganga need cleaning (Namami Gange) and old temples need careful restoration.
  explanations:
    text: Many communities protect small forests called sacred groves for their deities. Because no one cuts trees there, these groves save rare plants, animals and springs. Sacred sites also support jobs, but they need care to stay clean and safe.
    visual: Picture a small, dense green grove in the middle of farmland, with a little shrine under the oldest tree, birds overhead and a spring at its edge.
    step_by_step: 'Step 1: Find the sacred natural place. Step 2: Name the local tradition that protects it. Step 3: List what it protects: trees, animals, water. Step 4: Note threats (pollution, crowds) and solutions (cleaning, restoration).'
    real_world: Kerala has hundreds of kavus (sacred groves) that protect rare medicinal plants and keep village ponds full.
  picture:
    kind: compare
    columns:
    - title: Benefits
      points:
      - Protect trees and animals
      - Keep springs and ponds
      - Support pilgrim jobs
    - title: Threats and care
      points:
      - Pollution and crowds
      - Cleaning rivers (Namami Gange)
      - Careful restoration of old sites
    alt: Sacred groves and sites protect nature and support livelihoods, but face pollution and crowding and need cleaning and restoration.
  activity:
    type: sort
    prompt: Which state's sacred grove?
    bins:
    - Kerala
    - Maharashtra
    - Jharkhand
    - Rajasthan
    items:
    - label: Kavu
      bin: Kerala
      clue: Snake groves.
      why: Kerala.
    - label: Devrai
      bin: Maharashtra
      clue: Western India.
      why: Maharashtra.
    - label: Sarna
      bin: Jharkhand
      clue: Tribal groves.
      why: Jharkhand.
    - label: Orans
      bin: Rajasthan
      clue: Desert groves.
      why: Rajasthan.
  items:
  - prompt: What is a sacred grove?
    options:
    - A patch of forest protected by a community for a deity
    - A city park
    - A farm
    - A temple car
    answer: A patch of forest protected by a community for a deity
    difficulty: 1
    hints:
    - Trees are not cut.
    - Linked to a deity.
    solution: Sacred groves are community-protected forests.
  - prompt: 'In Kerala, sacred groves are called:'
    options:
    - Kavu
    - Oran
    - Devrai
    - Sarna
    answer: Kavu
    difficulty: 2
    hints:
    - Kerala word.
    - Often with snake shrines.
    solution: In Kerala they are called kavu.
    mistakes:
      Oran: c7ss_groves
  - prompt: Why are sacred groves important for nature?
    options:
    - They protect rare plants, animals and water sources
    - They are used for logging
    - They are deserts
    - They have no plants
    answer: They protect rare plants, animals and water sources
    difficulty: 1
    hints:
    - No cutting allowed.
    - Biodiversity.
    solution: Protection lets rare species and springs survive.
  - prompt: Which programme aims to clean the river Ganga?
    options:
    - Namami Gange
    - Make in India
    - Digital India
    - Swachh Survekshan only
    answer: Namami Gange
    difficulty: 2
    hints:
    - '''Salute to the Ganga''.'
    - River cleaning mission.
    solution: Namami Gange is the Ganga cleaning programme.
  - prompt: How do pilgrim towns help local people?
    options:
    - They provide jobs like guides, shops and boatmen
    - They close all shops
    - They stop farming
    - They have no effect
    answer: They provide jobs like guides, shops and boatmen
    difficulty: 1
    hints:
    - Visitors spend money.
    - Livelihoods.
    solution: Pilgrims create work for many local people.
  - prompt: 'Orans are sacred groves found mainly in:'
    options:
    - Rajasthan
    - Kerala
    - Sikkim
    - Assam
    answer: Rajasthan
    difficulty: 2
    hints:
    - In the dry west.
    - Protect desert trees.
    solution: Orans are sacred groves of Rajasthan.
