# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 8. Format: content/README.md.
subject: cbse7-ss
chapter: 8
title: How the Land Becomes Sacred
tips:
  c7ss_groves: "Oran is Rajasthan's word. Kerala's sacred groves have their own Malayalam name, often beside a temple."
  s7_bodh_gaya: "Bodh Gaya is where Siddhartha attained enlightenment."
  s7_char_dham: "The char dham are Badrinath, Dwarka, Puri and Rameswaram, at the four corners of India. Count them."
  s7_grove_nature: "Nobody cuts trees in sacred groves. What survives there?"
  s7_kumbh: "The Kumbh rotates between four cities in India."
  s7_namami_gange: "'Gange' is in the name of the programme."
  s7_orans: "Orans protect trees and water in a dry state."
  s7_pilgrim_jobs: "Pilgrims need food, rooms, boats and guides. Who provides them?"
  s7_pilgrim_unity: "Pilgrims travelled across the country. What did they carry with them?"
  s7_sacred_grove: "A grove is a small forest. Who protects it and why?"
  s7_sacred_river: "Thar is a desert and Aravalli a mountain range. Which one is a river?"
  c7ss8_why: A place becomes sacred through stories, the lives of holy people, striking natural features and long years of worship. Ask which of these fits.
  c7ss8_faith: Each tradition has its own holy places. Match the place to the people who go there on pilgrimage.
  c7ss8_map: 'Picture India''s map: the four places of this pilgrimage sit near its four edges. Use direction to choose.'
  c7ss8_unity: Travelling to far places meant meeting other languages, foods and customs. Think about what that did for people.
  c7ss8_grove: Communities keep some patches of forest untouched for a deity. Think about what happens to plants, animals and water there.
  c7ss8_names: Different regions use their own word for the same kind of protected forest. Match the word to its region.
  c7ss8_care: Crowds, waste and pollution harm holy places. Look for the action that protects them.
concepts:
- code: cbse7ss.sacred.places
  title: How land becomes sacred
  notes: |
    Many places in India are considered sacred: rivers (Ganga, Yamuna, Narmada, Kaveri), mountains (Kailash,
    Arunachala), groves and lakes, as well as temples, mosques, churches, gurdwaras and monasteries. Places become
    sacred through stories, the lives of saints, natural features, and centuries of worship. Pilgrimage (tirtha
    yatra) connects distant regions: the char dham (Badrinath, Dwarka, Puri, Rameswaram) at four corners of India;
    the twelve jyotirlingas; the 51 shakti peethas; Bodh Gaya for Buddhists; Amritsar's Golden Temple for Sikhs;
    Ajmer Sharif dargah; Velankanni church. Pilgrimages build a shared sense of India as one land.
  explanations:
    text: Across India, rivers, mountains, groves and places of worship are treated as sacred because of stories, saints and centuries of devotion. Pilgrims travel long distances to them, which has linked people from every corner of India.
    visual: 'Draw India with four pins at its corners, Badrinath, Dwarka, Puri and Rameswaram, and add other pins: Bodh Gaya, Amritsar, Ajmer, Velankanni. Lines joining them show pilgrims crossing the whole land.'
    step_by_step: 'Step 1: Name the sacred place. Step 2: Say which community holds it sacred. Step 3: Say why: a story, a saint, or a natural feature. Step 4: Explain how pilgrimage links regions.'
    real_world: The Kumbh Mela, held at Prayagraj, Haridwar, Ujjain and Nashik, is one of the largest gatherings of people on Earth.
  picture:
    kind: compare
    columns:
    - title: Natural sacred places
      points:
      - 'Rivers: Ganga, Kaveri'
      - 'Mountains: Kailash'
      - Sacred groves
    - title: Places of worship and pilgrimage
      points:
      - Char dham
      - Bodh Gaya
      - Golden Temple, Amritsar
      - Ajmer Sharif, Velankanni
    alt: 'Sacred places in India: natural ones like rivers, mountains and groves, and pilgrimage centres of many faiths.'
  activity:
    type: sort
    prompt: Which faith's pilgrimage place?
    bins:
    - Buddhist
    - Sikh
    - Sufi
    - Christian
    items:
    - label: Bodh Gaya
      bin: Buddhist
      clue: Enlightenment.
      why: Buddhist.
    - label: Golden Temple, Amritsar
      bin: Sikh
      clue: Harmandir Sahib.
      why: Sikh.
    - label: Ajmer Sharif dargah
      bin: Sufi
      clue: Moinuddin Chishti.
      why: Sufi shrine.
    - label: Velankanni church
      bin: Christian
      clue: Tamil Nadu coast.
      why: Christian.
  lesson:
    - teach: 'Across India, people treat many places as sacred (holy): rivers like the Ganga, Narmada and Kaveri; mountains like Kailash and Arunachala; groves and lakes; and buildings like temples, mosques, churches, gurdwaras and monasteries.'
      check:
        prompt: Which of these can be a sacred place in India?
        options:
        - A river, a mountain or a building
        - Only temples
        - Only cities
        answer: A river, a mountain or a building
        why: Nature and buildings can both be sacred.
    - teach: 'Places become sacred in several ways: stories and legends linked to them, the lives of saints and teachers (the Buddha''s enlightenment at Bodh Gaya), striking natural features, and centuries of people worshipping there.'
      picture:
        kind: flow
        steps:
        - A story, a saint or a natural wonder
        - People come to worship
        - Worship continues for centuries
        - The place is seen as sacred
        alt: How a place slowly becomes sacred.
      check:
        prompt: Why is Bodh Gaya sacred to Buddhists?
        options:
        - The Buddha gained enlightenment there
        - It is the highest mountain
        - It is a sea port
        answer: The Buddha gained enlightenment there
        why: A great teacher's life made it holy.
    - teach: A pilgrimage (tirtha yatra) is a journey to a sacred place. The char dham are Badrinath (north), Dwarka (west), Puri (east) and Rameswaram (south). Pilgrims also visit the jyotirlingas, shakti peethas, the Golden Temple, Ajmer Sharif and Velankanni. Travelling across regions gave people a shared sense of India as one land.
      picture:
        kind: compare
        columns:
        - title: Direction
          points:
          - North
          - West
          - East
          - South
        - title: Char dham
          points:
          - Badrinath
          - Dwarka
          - Puri
          - Rameswaram
        alt: The four char dham at the four corners of India.
      check:
        prompt: Which char dham is in the south?
        options:
        - Rameswaram
        - Badrinath
        - Dwarka
        answer: Rameswaram
        why: Rameswaram is in Tamil Nadu, at the southern tip.
  items:
  - prompt: How many places make up the char dham pilgrimage?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - '''Char'' means four.'
    - At four corners of India.
    solution: 'Badrinath, Dwarka, Puri and Rameswaram: four.'
    mistakes: {"7": "s7_char_dham", "12": "s7_char_dham"}
  - prompt: 'Bodh Gaya is especially sacred to:'
    options:
    - Buddhists
    - Sikhs
    - Parsis
    - Jews
    answer: Buddhists
    difficulty: 1
    hints:
    - The Buddha's enlightenment.
    - In Bihar.
    solution: The Buddha attained enlightenment at Bodh Gaya.
    mistakes: {"Sikhs": "s7_bodh_gaya"}
  - prompt: 'The Golden Temple at Amritsar is the holiest shrine of:'
    options:
    - Sikhs
    - Jains
    - Christians
    - Buddhists
    answer: Sikhs
    difficulty: 1
    hints:
    - Harmandir Sahib.
    - Punjab.
    solution: It is the holiest Sikh gurdwara.
    mistakes:
      Jains: c7ss_read_again
  - prompt: Which of these is a sacred river?
    options:
    - Kaveri
    - Thar
    - Deccan
    - Aravalli
    answer: Kaveri
    difficulty: 1
    hints:
    - The others are landforms.
    - Flows through Karnataka and Tamil Nadu.
    solution: The Kaveri is a sacred river.
    mistakes: {"Thar": "s7_sacred_river", "Aravalli": "s7_sacred_river"}
  - prompt: How did pilgrimages help unite India?
    options:
    - People travelled across regions and shared culture
    - They stopped trade
    - They divided people
    - They were only for kings
    answer: People travelled across regions and shared culture
    difficulty: 2
    hints:
    - Pilgrims from all over.
    - Shared stories.
    solution: Pilgrims crossing the land built a sense of one shared land.
    mistakes: {"They divided people": "s7_pilgrim_unity"}
  - prompt: Where is the Kumbh Mela held?
    options:
    - Prayagraj, Haridwar, Ujjain and Nashik
    - Only in Delhi
    - Only in Chennai
    - Abroad
    answer: Prayagraj, Haridwar, Ujjain and Nashik
    difficulty: 2
    hints:
    - Four river cities.
    - In turn.
    solution: It rotates among Prayagraj, Haridwar, Ujjain and Nashik.
    mistakes: {"Only in Delhi": "s7_kumbh"}
  - prompt: Which char dham is in the north, in the Himalayas?
    options:
    - Badrinath
    - Puri
    - Rameswaram
    answer: Badrinath
    difficulty: 1
    hints:
    - It is in Uttarakhand.
    - It is high in the mountains.
    solution: Badrinath, in Uttarakhand, is the northern char dham.
    mistakes:
      Puri: c7ss8_map
      Rameswaram: c7ss8_map
  - prompt: Dwarka, a char dham, is on which side of India?
    options:
    - West
    - East
    - North-east
    answer: West
    difficulty: 2
    hints:
    - It is in Gujarat.
    - It faces the Arabian Sea.
    solution: Dwarka is in Gujarat on the west coast.
    mistakes:
      East: c7ss8_map
      North-east: c7ss8_map
  - prompt: Ajmer Sharif is the dargah (shrine) of which saint?
    options:
    - Khwaja Moinuddin Chishti
    - Guru Nanak
    - Mahavira
    answer: Khwaja Moinuddin Chishti
    difficulty: 2
    hints:
    - He was a Sufi saint.
    - People of many faiths visit his shrine.
    solution: Ajmer Sharif is the shrine of the Sufi saint Khwaja Moinuddin Chishti.
    mistakes:
      Guru Nanak: c7ss8_faith
      Mahavira: c7ss8_faith
  - prompt: 'Velankanni in Tamil Nadu is a famous pilgrimage place for:'
    options:
    - Christians
    - Sikhs
    - Jains
    answer: Christians
    difficulty: 2
    hints:
    - It has a basilica of Mary.
    - It is on the east coast.
    solution: Velankanni's Basilica of Our Lady of Good Health is a major Christian pilgrimage site.
    mistakes:
      Sikhs: c7ss8_faith
      Jains: c7ss8_faith
  - prompt: What is a pilgrimage?
    options:
    - A journey to a sacred place
    - A trade route
    - A type of tax
    answer: A journey to a sacred place
    difficulty: 1
    hints:
    - In Sanskrit it is called tirtha yatra.
    - '''Yatra'' means journey.'
    solution: A pilgrimage is a journey made to a holy place for worship.
    mistakes:
      A trade route: c7ss8_why
      A type of tax: c7ss8_why
  - prompt: 'Mount Kailash is sacred to several faiths. It is an example of a sacred:'
    options:
    - Mountain
    - River
    - Building
    answer: Mountain
    difficulty: 1
    hints:
    - It is in the Himalayas.
    - It is a natural feature, very high.
    solution: Kailash is a sacred mountain for Hindus, Buddhists, Jains and Bon followers.
    mistakes:
      River: c7ss8_why
      Building: c7ss8_why
  - prompt: A pilgrim from Kerala travels to Badrinath. What might they gain besides worship?
    options:
    - Knowing other regions' languages and customs
    - A new citizenship
    - Free land
    answer: Knowing other regions' languages and customs
    difficulty: 2
    hints:
    - They cross many states on the way.
    - Think of food, language and people.
    solution: Long pilgrimages bring people into contact with other regions, building a sense of one India.
    mistakes:
      A new citizenship: c7ss8_unity
      Free land: c7ss8_unity
  - prompt: Which pair is matched correctly?
    options:
    - Golden Temple - Amritsar
    - Bodh Gaya - Gujarat
    - Puri - Kerala
    answer: Golden Temple - Amritsar
    difficulty: 2
    hints:
    - Bodh Gaya is in Bihar.
    - Puri is in Odisha.
    solution: The Golden Temple is in Amritsar, Punjab; Bodh Gaya is in Bihar and Puri in Odisha.
    mistakes:
      Bodh Gaya - Gujarat: c7ss8_map
      Puri - Kerala: c7ss8_map
  - prompt: The Kumbh Mela is held at 4 places, each about once in 12 years. Across all four, about how often is there a Kumbh somewhere?
    answer: '3'
    check: 12/4
    difficulty: 3
    hints:
    - Share the 12 years among the 4 places.
    - Divide 12 by 4.
    solution: 'Step 1: 4 places share a 12-year cycle. Step 2: 12 ÷ 4 = about every 3 years.'
    mistakes:
      '48': c7ss8_unity
      '12': c7ss8_unity
- code: cbse7ss.sacred.ecology
  title: Sacred ecology and protecting sacred spaces
  after:
  - cbse7ss.sacred.places
  notes: |
    Sacred groves (devrai in Maharashtra, kavu in Kerala, sarna in Jharkhand, orans in Rajasthan) are patches of
    forest protected by communities for a deity; cutting trees there is forbidden, so they preserve rare plants,
    animals and water sources. Sacred lakes and ponds (Khecheopalri in Sikkim) are kept clean. Pilgrim towns
    support many livelihoods (guides, shops, boatmen). Crowds and pollution can damage sacred sites, so rivers like
    the Ganga need cleaning (Namami Gange) and old temples need careful restoration.
  explanations:
    text: Many communities protect small forests called sacred groves for their deities. Because no one cuts trees there, these groves save rare plants, animals and springs. Sacred sites also support jobs, but they need care to stay clean and safe.
    visual: Picture a small, dense green grove in the middle of farmland, with a little shrine under the oldest tree, birds overhead and a spring at its edge.
    step_by_step: 'Step 1: Find the sacred natural place. Step 2: Name the local tradition that protects it. Step 3: List what it protects: trees, animals, water. Step 4: Note threats (pollution, crowds) and solutions (cleaning, restoration).'
    real_world: Kerala has hundreds of kavus (sacred groves) that protect rare medicinal plants and keep village ponds full.
  picture:
    kind: compare
    columns:
    - title: Benefits
      points:
      - Protect trees and animals
      - Keep springs and ponds
      - Support pilgrim jobs
    - title: Threats and care
      points:
      - Pollution and crowds
      - Cleaning rivers (Namami Gange)
      - Careful restoration of old sites
    alt: Sacred groves and sites protect nature and support livelihoods, but face pollution and crowding and need cleaning and restoration.
  activity:
    type: sort
    prompt: Which state's sacred grove?
    bins:
    - Kerala
    - Maharashtra
    - Jharkhand
    - Rajasthan
    items:
    - label: Kavu
      bin: Kerala
      clue: Snake groves.
      why: Kerala.
    - label: Devrai
      bin: Maharashtra
      clue: Western India.
      why: Maharashtra.
    - label: Sarna
      bin: Jharkhand
      clue: Tribal groves.
      why: Jharkhand.
    - label: Orans
      bin: Rajasthan
      clue: Desert groves.
      why: Rajasthan.
  lesson:
    - teach: A sacred grove is a patch of forest that a community protects for a deity. Nobody may cut trees or hunt there. Kerala calls them kavu, Maharashtra devrai, Jharkhand sarna and Rajasthan orans.
      picture:
        kind: compare
        columns:
        - title: Region
          points:
          - Kerala
          - Maharashtra
          - Jharkhand
          - Rajasthan
        - title: Name for sacred grove
          points:
          - kavu
          - devrai
          - sarna
          - orans
        alt: Regional names for sacred groves.
      check:
        prompt: What is forbidden in a sacred grove?
        options:
        - Cutting trees
        - Praying
        - Walking
        answer: Cutting trees
        why: The trees are protected for the deity.
    - teach: Because nobody cuts them, sacred groves keep rare plants and animals alive, store water in ponds and springs, and keep soil from washing away. Faith and nature protection go together. Sacred lakes, like Khecheopalri in Sikkim, are also kept clean by local people.
      check:
        prompt: How do sacred groves help nature?
        options:
        - They protect plants, animals and water
        - They create deserts
        - They make rivers dry
        answer: They protect plants, animals and water
        why: Untouched forest is a safe home for living things.
    - teach: 'Pilgrim towns give many people work: guides, shopkeepers, boatmen, cooks and transport workers. But huge crowds, plastic and sewage can damage rivers and monuments. Programmes like Namami Gange clean the Ganga, and old temples need careful restoration.'
      check:
        prompt: Which action helps protect a sacred river?
        options:
        - Not throwing plastic into it
        - Dumping waste in it
        - Building factories on its banks
        answer: Not throwing plastic into it
        why: Keeping waste out keeps the river clean.
  items:
  - prompt: What is a sacred grove?
    options:
    - A patch of forest protected by a community for a deity
    - A city park
    - A farm
    - A temple car
    answer: A patch of forest protected by a community for a deity
    difficulty: 1
    hints:
    - Trees are not cut.
    - Linked to a deity.
    solution: Sacred groves are community-protected forests.
    mistakes: {"A city park": "s7_sacred_grove"}
  - prompt: 'In Kerala, sacred groves are called:'
    options:
    - Kavu
    - Oran
    - Devrai
    - Sarna
    answer: Kavu
    difficulty: 2
    hints:
    - Kerala word.
    - Often with snake shrines.
    solution: In Kerala they are called kavu.
    mistakes:
      Oran: c7ss_groves
  - prompt: Why are sacred groves important for nature?
    options:
    - They protect rare plants, animals and water sources
    - They are used for logging
    - They are deserts
    - They have no plants
    answer: They protect rare plants, animals and water sources
    difficulty: 1
    hints:
    - No cutting allowed.
    - Biodiversity.
    solution: Protection lets rare species and springs survive.
    mistakes: {"They are used for logging": "s7_grove_nature"}
  - prompt: Which programme aims to clean the river Ganga?
    options:
    - Namami Gange
    - Make in India
    - Digital India
    - Swachh Survekshan only
    answer: Namami Gange
    difficulty: 2
    hints:
    - '''Salute to the Ganga''.'
    - River cleaning mission.
    solution: Namami Gange is the Ganga cleaning programme.
    mistakes: {"Make in India": "s7_namami_gange"}
  - prompt: How do pilgrim towns help local people?
    options:
    - They provide jobs like guides, shops and boatmen
    - They close all shops
    - They stop farming
    - They have no effect
    answer: They provide jobs like guides, shops and boatmen
    difficulty: 1
    hints:
    - Visitors spend money.
    - Livelihoods.
    solution: Pilgrims create work for many local people.
    mistakes: {"They close all shops": "s7_pilgrim_jobs"}
  - prompt: 'Orans are sacred groves found mainly in:'
    options:
    - Rajasthan
    - Kerala
    - Sikkim
    - Assam
    answer: Rajasthan
    difficulty: 2
    hints:
    - In the dry west.
    - Protect desert trees.
    solution: Orans are sacred groves of Rajasthan.
    mistakes: {"Kerala": "s7_orans", "Assam": "s7_orans"}
  - prompt: 'In Maharashtra, sacred groves are called:'
    options:
    - Devrai
    - Kavu
    - Orans
    answer: Devrai
    difficulty: 2
    hints:
    - '''Dev'' means god.'
    - Kavu is the Kerala word.
    solution: Maharashtra's sacred groves are devrai ('god's forest').
    mistakes:
      Kavu: c7ss8_names
      Orans: c7ss8_names
  - prompt: 'Sarna sacred groves are found mainly in:'
    options:
    - Jharkhand
    - Kerala
    - Gujarat
    answer: Jharkhand
    difficulty: 2
    hints:
    - They are linked to Adivasi communities of central-east India.
    - Kerala's word is different.
    solution: Sarna groves are kept by Adivasi communities in Jharkhand.
    mistakes:
      Kerala: c7ss8_names
      Gujarat: c7ss8_names
  - prompt: 'Khecheopalri, a lake kept clean as sacred, is in:'
    options:
    - Sikkim
    - Rajasthan
    - Goa
    answer: Sikkim
    difficulty: 2
    hints:
    - It is in the eastern Himalayas.
    - People say birds keep its surface free of leaves.
    solution: Khecheopalri Lake in Sikkim is sacred to Buddhists and Hindus.
    mistakes:
      Rajasthan: c7ss8_care
      Goa: c7ss8_care
  - prompt: Why might a sacred grove have a spring even in summer?
    options:
    - Thick trees keep the soil moist and hold water
    - It is always raining there
    - Water is brought by trucks
    answer: Thick trees keep the soil moist and hold water
    difficulty: 3
    hints:
    - Think about shade and roots.
    - Leaf litter soaks up rain.
    solution: Trees shade the ground and roots hold water, so springs keep flowing.
    mistakes:
      It is always raining there: c7ss8_grove
      Water is brought by trucks: c7ss8_grove
  - prompt: Which job is common in a pilgrim town?
    options:
    - Guide for visitors
    - Deep-sea oil driller
    - Astronaut
    answer: Guide for visitors
    difficulty: 1
    hints:
    - Many visitors come.
    - They need help to find their way.
    solution: Pilgrim towns need guides, shops, boatmen and lodges for visitors.
    mistakes:
      Deep-sea oil driller: c7ss8_care
      Astronaut: c7ss8_care
  - prompt: What harms sacred rivers most during big festivals?
    options:
    - Waste and plastic from crowds
    - Prayers
    - Songs
    answer: Waste and plastic from crowds
    difficulty: 1
    hints:
    - Think of millions of visitors.
    - What is left behind?
    solution: Large crowds leave waste, plastic and sewage that pollute rivers.
    mistakes:
      Prayers: c7ss8_care
      Songs: c7ss8_care
  - prompt: 'Sacred groves can be called ''islands of biodiversity'' because:'
    options:
    - Many kinds of life survive there while land around is cleared
    - They are in the sea
    - They have no plants
    answer: Many kinds of life survive there while land around is cleared
    difficulty: 3
    hints:
    - Biodiversity means variety of life.
    - Fields and towns surround them.
    solution: The surrounding land may be farmed or built on, but the grove keeps a rich mix of species.
    mistakes:
      They are in the sea: c7ss8_grove
      They have no plants: c7ss8_grove
  - prompt: Why do old temples need 'careful' restoration?
    options:
    - Wrong repairs can damage their original art
    - They must be painted pink
    - They should be rebuilt in glass
    answer: Wrong repairs can damage their original art
    difficulty: 2
    hints:
    - Old carvings are fragile.
    - The goal is to keep them as they were.
    solution: Restoration must protect the original stone and carvings, not replace them.
    mistakes:
      They must be painted pink: c7ss8_care
      They should be rebuilt in glass: c7ss8_care
  - prompt: Who mainly protects sacred groves?
    options:
    - Local communities
    - Foreign companies
    - Nobody
    answer: Local communities
    difficulty: 1
    hints:
    - Villagers worship the deity there.
    - Their own rules forbid cutting.
    solution: Local communities protect sacred groves through shared beliefs and rules.
    mistakes:
      Foreign companies: c7ss8_grove
      Nobody: c7ss8_grove
