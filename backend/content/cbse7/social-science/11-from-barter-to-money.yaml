# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 11. Format: content/README.md.
subject: cbse7-ss
chapter: 11
title: From Barter to Money
tips:
  c7ss_double_wants: "Double means it must work both ways: each person must want the thing the other one has, not the same thing."
  c7ss_rbi: "The State Bank of India is a commercial bank where people keep accounts. India's central bank, which prints notes, is a different bank."
  s7_barter: "Barter happens without money."
  s7_change: "Change = 100 − 45."
  s7_cheque: "A cheque tells the bank to pay from your account."
  s7_cowrie: "UPI and credit cards are modern. Which shell was once used as money?"
  s7_digital_money: "UPI moves money through phones, not paper or goods."
  s7_money_function: "Money tells us how much things are worth."
  s7_paper_trust: "The paper itself is cheap. Why do people accept it?"
  s7_rupee_symbol: "$ is the dollar, € the euro and £ the pound."
  s7_security: "Security features make notes hard to copy."
  s7_store_value: "Grain rots and cattle grow old. What is better about money?"
  c7ss11_barter: In a direct swap, both people must want exactly what the other has, things must be split fairly, and there is no common measure. Ask which problem the choice shows.
  c7ss11_jobs: 'Money does three jobs: helps buying and selling, measures how much things are worth, and keeps value for later. Match the job to the example.'
  c7ss11_forms: 'Money changed form over time: natural objects, then metal, then paper, then numbers on screens. Place the choice on that path.'
  c7ss11_trust: A note's paper is cheap. Its value comes from the promise of the bank that issues it and people's trust in it.
  c7ss11_bank: Money kept in a bank can be moved without touching cash. Think of the tool that moves it.
  c7ss11_sum: 'Write the calculation first: add what you spend, subtract from what you gave.'
concepts:
- code: cbse7ss.money.barter
  title: From barter to money
  notes: |
    Barter is exchanging goods directly (rice for cloth). Problems: the double coincidence of wants (each must want
    what the other has), goods that can't be divided, and no common measure of value. Money solves these: it is a
    medium of exchange, a measure of value and a store of value. Over time, money took many forms: cowrie shells,
    grain, cattle, metal coins (punch-marked coins), paper notes, and now digital money (UPI, cards).
  explanations:
    text: 'Long ago people swapped goods directly, called barter. But a potter who wants rice must find a farmer who wants pots. Money solves this: everyone accepts it, so you can sell to one person and buy from another.'
    visual: Picture a potter carrying pots around a market, looking for a farmer who wants pots and has rice. Then picture the same potter selling pots for coins and buying rice from anyone.
    step_by_step: 'Step 1: Barter: goods for goods. Step 2: Its problem: the double coincidence of wants. Step 3: Money''s three jobs: exchange, measure, store. Step 4: Forms of money from shells to UPI.'
    real_world: 'Today, a vegetable seller in a village market may accept payment by scanning a UPI QR code: the newest form of money.'
  picture:
    kind: flow
    steps:
    - 'Barter: goods for goods'
    - 'Commodity money: shells, grain, cattle'
    - Metal coins
    - Paper notes
    - 'Digital money: cards, UPI'
    alt: 'How money developed: from barter to commodity money, metal coins, paper notes and digital payments.'
  activity:
    type: order
    prompt: How money changed. Put the forms in order.
    steps:
    - 'Barter: rice for cloth'
    - Cowrie shells, grain and cattle
    - Metal coins (punch-marked)
    - Paper notes
    - Digital money (UPI)
    reasons:
      Cowrie shells, grain and cattle: Commodities came in when barter's problems showed.
      Metal coins (punch-marked): Coins replaced bulky goods.
      Paper notes: Notes came much later.
      Digital money (UPI): Digital payments are the newest.
  lesson:
    - teach: 'Long ago people bartered: they swapped goods directly, like rice for cloth. Barter works only when each side wants what the other has; this is called the double coincidence of wants.'
      picture:
        kind: compare
        columns:
        - title: Farmer has / wants
          points:
          - has rice
          - wants a pot
        - title: Weaver has / wants
          points:
          - has cloth
          - wants rice
        alt: 'The farmer wants a pot but the weaver has cloth: no swap is possible.'
      check:
        prompt: A farmer has rice and wants a pot. A weaver has cloth and wants rice. Can they barter directly?
        options:
        - No, the farmer does not want cloth
        - Yes, easily
        - Only on Sundays
        answer: No, the farmer does not want cloth
        why: Both must want what the other has.
    - teach: 'Barter has other problems too. Some goods cannot be divided: you cannot cut a cow to buy a few eggs. And there is no common measure: how many baskets of mangoes equal one goat?'
      check:
        prompt: Why is a cow hard to use in barter for small things?
        options:
        - It cannot be divided into small parts
        - It is too small
        - It never moves
        answer: It cannot be divided into small parts
        why: Some goods are not divisible.
    - teach: 'Money solves these problems. It has three main jobs: a medium of exchange (used to buy and sell), a measure of value (prices in rupees) and a store of value (saved for later). Over time money has been cowrie shells, grain, cattle, metal coins, paper notes and now digital money.'
      picture:
        kind: flow
        steps:
        - Cowrie shells, grain, cattle
        - Metal coins
        - Paper notes
        - Digital money (cards, UPI)
        alt: How forms of money changed over time.
      check:
        prompt: 'A price tag of ₹50 shows money as a:'
        options:
        - Measure of value
        - Store of value
        - Kind of barter
        answer: Measure of value
        why: Prices measure worth in a common unit.
  items:
  - prompt: What is barter?
    options:
    - Exchanging goods directly without money
    - Paying by card
    - Borrowing from a bank
    - Saving coins
    answer: Exchanging goods directly without money
    difficulty: 1
    hints:
    - Rice for cloth.
    - No money.
    solution: Barter is the direct exchange of goods.
    mistakes: {"Paying by card": "s7_barter"}
  - prompt: 'The ''double coincidence of wants'' means:'
    options:
    - Each person must want what the other has
    - Two people want the same thing
    - Everyone wants money
    - Wanting two things
    answer: Each person must want what the other has
    difficulty: 2
    hints:
    - Both sides must match.
    - Barter's big problem.
    solution: In barter, both people must want each other's goods.
    mistakes:
      Two people want the same thing: c7ss_double_wants
  - prompt: Which was an early form of money in India?
    options:
    - Cowrie shells
    - Credit cards
    - UPI
    - Cheques
    answer: Cowrie shells
    difficulty: 1
    hints:
    - Natural objects.
    - Small shells.
    solution: Cowrie shells were used as money.
    mistakes: {"UPI": "s7_cowrie"}
  - prompt: Which is a function of money?
    options:
    - A measure of value
    - A kind of food
    - A tool for farming
    - A type of cloth
    answer: A measure of value
    difficulty: 2
    hints:
    - Prices are in rupees.
    - Compare value.
    solution: Money measures how much things are worth.
    mistakes: {"A tool for farming": "s7_money_function"}
  - prompt: 'UPI payments are an example of:'
    options:
    - Digital money
    - Barter
    - Commodity money
    - Coins
    answer: Digital money
    difficulty: 1
    hints:
    - Through phones.
    - No cash.
    solution: UPI is a digital payment system.
    mistakes: {"Barter": "s7_digital_money", "Commodity money": "s7_digital_money"}
  - prompt: Why is money better than barter for storing value?
    options:
    - It does not rot and keeps its value longer
    - It can be eaten
    - It grows on trees
    - It never changes
    answer: It does not rot and keeps its value longer
    difficulty: 2
    hints:
    - Rice spoils.
    - Coins last.
    solution: Goods like grain spoil; money can be saved.
    mistakes: {"It never changes": "s7_store_value"}
  - prompt: Which problem of barter does a common measure of value solve?
    options:
    - Knowing how many mangoes equal one goat
    - Carrying heavy coins
    - Finding a bank
    answer: Knowing how many mangoes equal one goat
    difficulty: 2
    hints:
    - Without money, how do you compare different goods?
    - A rupee price compares anything.
    solution: Money gives every good a price in one unit, so different goods can be compared.
    mistakes:
      Carrying heavy coins: c7ss11_barter
      Finding a bank: c7ss11_bank
  - prompt: 'Saving ₹100 a month for a bicycle uses money as a:'
    options:
    - Store of value
    - Medium of exchange only
    - Measure of length
    answer: Store of value
    difficulty: 2
    hints:
    - You keep it for later.
    - It does not rot like fruit.
    solution: 'Saving money keeps its value for future use: a store of value.'
    mistakes:
      Medium of exchange only: c7ss11_jobs
      Measure of length: c7ss11_jobs
  - prompt: Which form of money came LAST?
    options:
    - Digital money
    - Cowrie shells
    - Punch-marked coins
    answer: Digital money
    difficulty: 1
    hints:
    - Think of phones and computers.
    - Shells and coins are very old.
    solution: Digital money (cards, UPI) is the newest form.
    mistakes:
      Cowrie shells: c7ss11_forms
      Punch-marked coins: c7ss11_forms
  - prompt: Why is grain a poor store of value?
    options:
    - It can rot or be eaten by pests
    - It is too valuable
    - It never changes
    answer: It can rot or be eaten by pests
    difficulty: 2
    hints:
    - Think of keeping it for years.
    - Rats and damp spoil it.
    solution: Grain can spoil, so its value does not last; money keeps value better.
    mistakes:
      It is too valuable: c7ss11_jobs
      It never changes: c7ss11_jobs
  - prompt: 'Buying a book with a ₹200 note uses money as a:'
    options:
    - Medium of exchange
    - Store of value
    - Barter good
    answer: Medium of exchange
    difficulty: 1
    hints:
    - You are buying something.
    - Money passes from you to the seller.
    solution: Paying for goods uses money as a medium of exchange.
    mistakes:
      Store of value: c7ss11_jobs
      Barter good: c7ss11_barter
  - prompt: A potter swaps 3 pots for 6 kg of rice. At this rate, how many kg of rice for 1 pot?
    answer: '2'
    check: 6/3
    difficulty: 1
    hints:
    - Share the rice equally among the pots.
    - Divide 6 by 3.
    solution: 'Step 1: 6 kg for 3 pots. Step 2: 6 ÷ 3 = 2 kg per pot.'
    mistakes:
      '18': c7ss11_sum
      '3': c7ss11_sum
  - prompt: Why did people stop using cattle as money?
    options:
    - Cattle are hard to divide, carry and store
    - Cattle were too small
    - Cattle were made of paper
    answer: Cattle are hard to divide, carry and store
    difficulty: 2
    hints:
    - Think of buying something small.
    - Animals need food and care.
    solution: Cattle cannot be divided, are hard to carry and need care, so coins replaced them.
    mistakes:
      Cattle were too small: c7ss11_barter
      Cattle were made of paper: c7ss11_forms
  - prompt: Which is still a kind of barter today?
    options:
    - Swapping a story book with a friend for a comic
    - Paying by UPI
    - Buying with a ₹10 coin
    answer: Swapping a story book with a friend for a comic
    difficulty: 2
    hints:
    - No money is used.
    - Goods are swapped directly.
    solution: Swapping goods directly, without money, is barter.
    mistakes:
      Paying by UPI: c7ss11_forms
      Buying with a ₹10 coin: c7ss11_forms
  - prompt: 'Cowrie shells were used as money because they were:'
    options:
    - Small, hard to fake and easy to count
    - Very heavy
    - Made by the government
    answer: Small, hard to fake and easy to count
    difficulty: 3
    hints:
    - Think of what makes something useful as money.
    - They came from the sea, not a mint.
    solution: Cowries were light, durable, countable and hard to copy, so they worked as money.
    mistakes:
      Very heavy: c7ss11_forms
      Made by the government: c7ss11_forms
- code: cbse7ss.money.forms
  title: Forms of money today
  after:
  - cbse7ss.money.barter
  notes: |
    Currency: coins and notes issued by the government and the Reserve Bank of India (RBI); the rupee (₹) is
    India's currency. Notes carry the RBI Governor's promise. Bank money: deposits in banks can be paid by cheque,
    debit card or online transfer. Digital payments (UPI, launched 2016) have grown hugely. Money must be accepted by
    everyone and backed by trust in the government. Counterfeit (fake) notes harm the economy, so notes have
    security features.
  explanations:
    text: Today money comes as coins and notes from the Reserve Bank of India, as money in bank accounts, and as digital payments like UPI. It works because everyone trusts it.
    visual: Picture a wallet with a ₹10 coin and a ₹100 note, a bank passbook, a debit card, and a phone showing a UPI payment.
    step_by_step: 'Step 1: Cash: coins and notes from the RBI. Step 2: Bank money: deposits, cheques, cards. Step 3: Digital: UPI and online transfers. Step 4: All depend on trust.'
    real_world: India's UPI handles billions of payments every month, from tea stalls to big shops.
  picture:
    kind: compare
    columns:
    - title: Cash
      points:
      - Coins and notes
      - Issued by RBI
      - Rupee (₹)
    - title: Bank and digital money
      points:
      - Bank deposits
      - Cheques and cards
      - UPI and online transfers
    alt: 'Forms of money today: cash (coins and notes issued by the RBI) and bank and digital money (deposits, cards, UPI).'
  activity:
    type: sort
    prompt: Currency, bank money or digital?
    bins:
    - Currency
    - Bank money
    - Digital payment
    items:
    - label: A ₹100 note
      bin: Currency
      clue: Issued by the RBI.
      why: Currency.
    - label: A ₹5 coin
      bin: Currency
      clue: Issued by the government.
      why: Currency.
    - label: A cheque from a savings account
      bin: Bank money
      clue: Uses a deposit.
      why: Bank money.
    - label: Paying by UPI on a phone
      bin: Digital payment
      clue: Launched 2016.
      why: Digital.
  lesson:
    - teach: India's currency is the rupee (₹). Coins and notes are issued by the government and the Reserve Bank of India (RBI). Each note carries the RBI Governor's promise to pay the bearer, which is why people trust it.
      check:
        prompt: Why do people accept a paper note?
        options:
        - They trust the RBI and government that issue it
        - The paper is costly
        - It is very old
        answer: They trust the RBI and government that issue it
        why: Its value rests on trust, not the paper.
    - teach: 'Bank money: money kept in a bank account can be paid using a cheque, a debit card or an online transfer, without touching cash. UPI, launched in 2016, lets people pay instantly from a phone, and it has grown hugely.'
      picture:
        kind: compare
        columns:
        - title: Cash
          points:
          - coins
          - notes
        - title: Bank money
          points:
          - cheque
          - debit card
          - online transfer, UPI
        alt: Cash and bank money are two ways to pay.
      check:
        prompt: Which payment does NOT use cash?
        options:
        - Paying by UPI
        - Paying with a ₹20 note
        - Paying with coins
        answer: Paying by UPI
        why: UPI moves bank money digitally.
    - teach: 'Counterfeit (fake) notes harm everyone, so real notes have security features: a watermark, a security thread, colour-changing ink and tiny printing. Digital payments also need care: never share your PIN or OTP.'
      check:
        prompt: Which is safe digital behaviour?
        options:
        - Never sharing your PIN or OTP
        - Telling strangers your PIN
        - Writing your OTP on social media
        answer: Never sharing your PIN or OTP
        why: PINs and OTPs protect your money.
  items:
  - prompt: Which organisation issues India's currency notes?
    options:
    - Reserve Bank of India
    - State Bank of India
    - Indian Railways
    - Election Commission
    answer: Reserve Bank of India
    difficulty: 1
    hints:
    - India's central bank.
    - RBI.
    solution: The RBI issues currency notes.
    mistakes:
      State Bank of India: c7ss_rbi
  - prompt: What is the symbol for the Indian rupee?
    options:
    - ₹
    - $
    - €
    - £
    answer: ₹
    difficulty: 1
    hints:
    - Adopted in 2010.
    - Like the letter R.
    solution: The rupee symbol is ₹.
    mistakes: {"$": "s7_rupee_symbol"}
  - prompt: 'Paying by cheque uses:'
    options:
    - Money in a bank account
    - Barter
    - Cowrie shells
    - Gold coins
    answer: Money in a bank account
    difficulty: 2
    hints:
    - Bank money.
    - Deposits.
    solution: A cheque orders the bank to pay from your deposit.
    mistakes: {"Gold coins": "s7_cheque"}
  - prompt: Why does paper money have value?
    options:
    - People trust the government and RBI that issue it
    - The paper is valuable
    - It is made of gold
    - It is rare
    answer: People trust the government and RBI that issue it
    difficulty: 2
    hints:
    - The paper itself is cheap.
    - Trust.
    solution: Notes have value because people trust and accept them.
    mistakes: {"The paper is valuable": "s7_paper_trust"}
  - prompt: Why do notes have security features?
    options:
    - To stop fake (counterfeit) notes
    - To make them heavier
    - For decoration only
    - To make them cheaper
    answer: To stop fake (counterfeit) notes
    difficulty: 1
    hints:
    - Watermark, thread.
    - Fakes harm the economy.
    solution: Security features make notes hard to fake.
    mistakes: {"For decoration only": "s7_security"}
  - prompt: You pay for a ₹45 snack with a ₹100 note. How much change, in rupees?
    answer: '55'
    check: 100 - 45
    difficulty: 1
    hints:
    - 100 − 45.
    - Subtract.
    solution: 100 − 45 = ₹55.
    mistakes: {"65": "s7_change", "145": "s7_change"}
  - prompt: In which year was UPI launched?
    answer: '2016'
    check: '2016'
    difficulty: 2
    hints:
    - It is less than ten years before 2026.
    - It is the same year as demonetisation.
    solution: UPI was launched in 2016.
    mistakes:
      '1950': c7ss11_forms
      '2000': c7ss11_forms
  - prompt: 'A cheque is a written order to:'
    options:
    - Pay money from a bank account
    - Plant a tree
    - Vote in an election
    answer: Pay money from a bank account
    difficulty: 1
    hints:
    - It is signed by the account holder.
    - The bank pays the named person.
    solution: A cheque tells the bank to pay a sum from the writer's account.
    mistakes:
      Plant a tree: c7ss11_bank
      Vote in an election: c7ss11_bank
  - prompt: Which is a security feature of Indian notes?
    options:
    - A watermark
    - A sticker
    - A pencil mark
    answer: A watermark
    difficulty: 2
    hints:
    - Hold the note up to light.
    - A hidden picture appears.
    solution: Notes have a watermark (Gandhiji's portrait) visible against light.
    mistakes:
      A sticker: c7ss11_trust
      A pencil mark: c7ss11_trust
  - prompt: You buy a pen for ₹25 and a notebook for ₹40. You pay with a ₹100 note. How much change?
    answer: '35'
    check: 100-25-40
    difficulty: 2
    hints:
    - First add what you spent.
    - Then subtract from 100.
    solution: 'Step 1: 25 + 40 = 65. Step 2: 100 - 65 = 35 rupees.'
    mistakes:
      '65': c7ss11_sum
      '165': c7ss11_sum
  - prompt: Why is an OTP sent to your phone during online payments?
    options:
    - To check that it is really you paying
    - To show an advertisement
    - To change the price
    answer: To check that it is really you paying
    difficulty: 2
    hints:
    - OTP = one-time password.
    - Only your phone gets it.
    solution: An OTP confirms the payment is made by the account holder.
    mistakes:
      To show an advertisement: c7ss11_bank
      To change the price: c7ss11_bank
  - prompt: Why can't anyone simply print their own rupee notes?
    options:
    - Only the RBI may issue currency; printing fakes is a crime
    - Printers cannot use green ink
    - Paper is not sold in India
    answer: Only the RBI may issue currency; printing fakes is a crime
    difficulty: 2
    hints:
    - Who has the right to issue notes?
    - Fake notes harm everyone.
    solution: Only the RBI issues notes; making counterfeits is illegal.
    mistakes:
      Printers cannot use green ink: c7ss11_trust
      Paper is not sold in India: c7ss11_trust
  - prompt: 'A debit card takes money from:'
    options:
    - Your own bank account
    - A friend's pocket
    - The shopkeeper's account
    answer: Your own bank account
    difficulty: 1
    hints:
    - Debit means taking out.
    - The money must already be yours.
    solution: A debit card pays directly from your bank account.
    mistakes:
      A friend's pocket: c7ss11_bank
      The shopkeeper's account: c7ss11_bank
  - prompt: If people stopped trusting the rupee, what would happen?
    options:
    - Notes would lose their value
    - Notes would become heavier
    - Prices would disappear
    answer: Notes would lose their value
    difficulty: 3
    hints:
    - A note's paper is worth very little.
    - Its value rests on acceptance.
    solution: Paper money has value only because people accept and trust it.
    mistakes:
      Notes would become heavier: c7ss11_trust
      Prices would disappear: c7ss11_trust
  - prompt: Meera has ₹500. She sends ₹180 by UPI. How much is left?
    answer: '320'
    check: 500-180
    difficulty: 1
    hints:
    - Sending money takes it away.
    - Subtract.
    solution: 'Step 1: 500 - 180. Step 2: = 320 rupees.'
    mistakes:
      '680': c7ss11_sum
      '380': c7ss11_sum
