# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 10. Format: content/README.md.
subject: cbse7-ss
chapter: 10
title: 'The Constitution of India: An Introduction'
tips:
  c7ss_const_dates: "Republic Day is 26 January, when the Constitution came into force. 26 November is the day it was adopted. What is that day celebrated as?"
  c7ss_secular: Secular means the state has no religion of its own and treats all religions equally.
  s7_constitution: "A constitution is the basic rulebook of a country."
  s7_fraternity: "'Frater' means brother."
  s7_full_months: "Count whole months from 26 November: to 26 December, then to 26 January."
  s7_fundamental_rights: "Fundamental Rights belong to every citizen and are written in the Constitution."
  s7_living_document: "A living thing grows and changes. How does a constitution change?"
  s7_preamble_goals: "The Preamble promises justice, liberty, equality and fraternity. Which choice is not one of them?"
  s7_republic: "In a republic nobody inherits the top job."
  s7_republic_day: "26 November 1949 is when it was adopted. When did it start working?"
  s7_we_the_people: "The Constitution's power comes from its citizens, not a king."
  c7ss10_people: 'Several leaders had different roles: one led the drafting, one presided over the whole assembly. Match the person to the role.'
  c7ss10_dates: 'Two dates matter: the day it was accepted and, about two months later, the day it began working. Each is celebrated.'
  c7ss10_what: 'A constitution is the rulebook for the rule-makers: it sets up the government, divides power and protects rights.'
  c7ss10_words: Break the Preamble's words into parts and think about what each promises. Some describe the kind of state; others are goals for citizens.
  c7ss10_rights: Rights are what the Constitution guarantees you; duties are what it asks of you. Decide which one the choice is.
  c7ss10_count: Count carefully with the numbers in the question. Write the subtraction or addition before you answer.
concepts:
- code: cbse7ss.const.making
  title: What a constitution is and how India's was made
  notes: |
    A constitution is the basic set of rules for how a country is governed: it sets up institutions, divides
    power, and protects citizens' rights. India's Constitution was drafted by the Constituent Assembly (1946–49);
    Dr B. R. Ambedkar chaired the Drafting Committee and Dr Rajendra Prasad presided over the Assembly. It was
    adopted on 26 November 1949 (Constitution Day) and came into force on 26 January 1950 (Republic Day). It is one
    of the longest written constitutions; it borrowed ideas from many countries and can be amended, so it is a
    'living document'. Fifteen women were members of the Assembly.
  explanations:
    text: A constitution is the rulebook of a country. India's was written by the Constituent Assembly, with Dr B. R. Ambedkar leading the drafting. It was adopted on 26 November 1949 and came into force on 26 January 1950, which we celebrate as Republic Day.
    visual: Picture a large hall in 1949 with members signing a long handwritten book, beautifully illustrated; that original is kept in Parliament today.
    step_by_step: 'Step 1: What it is: the basic rules. Step 2: Who made it: the Constituent Assembly. Step 3: Key people: Ambedkar, Rajendra Prasad. Step 4: Key dates: 26 Nov 1949, 26 Jan 1950. Step 5: It can be amended.'
    real_world: Every 26 January the Republic Day parade in New Delhi celebrates the day the Constitution came into force.
  picture:
    kind: flow
    steps:
    - '1946: Constituent Assembly meets'
    - Drafting Committee chaired by Dr Ambedkar
    - Debates over nearly 3 years
    - '26 Nov 1949: adopted'
    - '26 Jan 1950: comes into force (Republic Day)'
    alt: 'How India''s Constitution was made: the Constituent Assembly from 1946, drafting under Dr Ambedkar, adoption on 26 November 1949 and coming into force on 26 January 1950.'
  activity:
    type: order
    prompt: Making India's Constitution. Put it in order.
    steps:
    - Constituent Assembly first meets (1946)
    - Dr Ambedkar's Drafting Committee writes the draft
    - Adopted on 26 November 1949
    - Comes into force on 26 January 1950
    reasons:
      Dr Ambedkar's Drafting Committee writes the draft: The Assembly had to exist before choosing a drafting committee.
      Adopted on 26 November 1949: It was adopted after the draft was debated.
      Comes into force on 26 January 1950: It came into force two months after adoption, on Republic Day.
  lesson:
    - teach: A constitution is the basic set of rules for how a country is governed. It sets up institutions (Parliament, courts, government), says who has what power, and protects citizens' rights. Every law must follow it.
      check:
        prompt: What must every law in India follow?
        options:
        - The Constitution
        - A newspaper's opinion
        - One leader's wish
        answer: The Constitution
        why: It is the highest law of the land.
    - teach: India's Constitution was written by the Constituent Assembly between 1946 and 1949. Dr B. R. Ambedkar chaired the Drafting Committee; Dr Rajendra Prasad presided over the Assembly. Fifteen women, including Hansa Mehta and Ammu Swaminathan, were members. Members debated every article openly.
      check:
        prompt: Who presided over the Constituent Assembly?
        options:
        - Dr Rajendra Prasad
        - Mahatma Gandhi
        - Ashoka
        answer: Dr Rajendra Prasad
        why: He was the Assembly's president; later India's first President.
    - teach: It was adopted on 26 November 1949 (now Constitution Day) and came into force on 26 January 1950 (Republic Day). It is one of the longest written constitutions. It borrowed good ideas from many countries and can be amended, so it is called a living document.
      picture:
        kind: flow
        steps:
        - '1946: Constituent Assembly meets'
        - '26 Nov 1949: Constitution adopted'
        - '26 Jan 1950: comes into force, India a republic'
        alt: Timeline of the making of India's Constitution.
      check:
        prompt: What do we celebrate on 26 January?
        options:
        - Republic Day
        - Independence Day
        - Children's Day
        answer: Republic Day
        why: The Constitution came into force on 26 January 1950.
  items:
  - prompt: Who chaired the Drafting Committee of the Constitution?
    options:
    - Dr B. R. Ambedkar
    - Jawaharlal Nehru
    - Mahatma Gandhi
    - Sardar Patel
    answer: Dr B. R. Ambedkar
    difficulty: 1
    hints:
    - Called the architect of the Constitution.
    - Drafting Committee.
    solution: Dr Ambedkar chaired the Drafting Committee.
    mistakes:
      Mahatma Gandhi: c7ss_read_again
  - prompt: On which date did India's Constitution come into force?
    options:
    - 26 January 1950
    - 15 August 1947
    - 26 November 1949
    - 2 October 1950
    answer: 26 January 1950
    difficulty: 1
    hints:
    - Republic Day.
    - January.
    solution: It came into force on 26 January 1950.
    mistakes: {"26 November 1949": "s7_republic_day", "15 August 1947": "s7_republic_day"}
  - prompt: '26 November is celebrated as:'
    options:
    - Constitution Day
    - Republic Day
    - Independence Day
    - Children's Day
    answer: Constitution Day
    difficulty: 2
    hints:
    - The Constitution was adopted in 1949.
    - November.
    solution: 'It was adopted on 26 November 1949: Constitution Day.'
    mistakes:
      Republic Day: c7ss_const_dates
  - prompt: What is a constitution?
    options:
    - The basic set of rules for governing a country
    - A list of holidays
    - A history book
    - A tax form
    answer: The basic set of rules for governing a country
    difficulty: 1
    hints:
    - Rulebook.
    - Sets up institutions.
    solution: It is the country's basic rulebook.
    mistakes: {"A history book": "s7_constitution"}
  - prompt: Why is the Constitution called a 'living document'?
    options:
    - It can be amended as times change
    - It is printed on living paper
    - It never changes
    - It is only for one year
    answer: It can be amended as times change
    difficulty: 2
    hints:
    - Amendments.
    - Grows with the country.
    solution: Amendments let it adapt over time.
    mistakes: {"It is printed on living paper": "s7_living_document", "It never changes": "s7_living_document"}
  - prompt: The Constitution was adopted on 26 November 1949 and came into force on 26 January 1950. How many full months apart is that?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 26 Nov to 26 Dec, then to 26 Jan.
    - Count.
    solution: 'Two months: 26 November → 26 December → 26 January.'
    mistakes: {"3": "s7_full_months", "14": "s7_full_months"}
  - prompt: Which body wrote India's Constitution?
    options:
    - The Constituent Assembly
    - The British Parliament
    - The Supreme Court
    answer: The Constituent Assembly
    difficulty: 1
    hints:
    - It was a special assembly of Indian representatives.
    - It met from 1946 to 1949.
    solution: The Constituent Assembly, made of Indian representatives, wrote the Constitution.
    mistakes:
      The British Parliament: c7ss10_what
      The Supreme Court: c7ss10_what
  - prompt: How many women were members of the Constituent Assembly?
    answer: '15'
    check: '15'
    difficulty: 2
    hints:
    - Hansa Mehta was one.
    - It is more than ten but fewer than twenty.
    solution: Fifteen women were members of the Constituent Assembly.
    mistakes:
      '0': c7ss10_people
      '50': c7ss10_people
  - prompt: Who is often called the chief architect of the Constitution?
    options:
    - Dr B. R. Ambedkar
    - Megasthenes
    - Kalidasa
    answer: Dr B. R. Ambedkar
    difficulty: 1
    hints:
    - He led the Drafting Committee.
    - He fought for the rights of the oppressed.
    solution: Dr B. R. Ambedkar chaired the Drafting Committee and is called its chief architect.
    mistakes:
      Megasthenes: c7ss10_people
      Kalidasa: c7ss10_people
  - prompt: Why did the Assembly borrow ideas from other countries?
    options:
    - To use the best ideas that worked elsewhere
    - Because India had no ideas
    - To copy one country fully
    answer: To use the best ideas that worked elsewhere
    difficulty: 2
    hints:
    - They picked and adapted.
    - It was not a full copy.
    solution: Members studied many constitutions and adapted useful ideas to India's needs.
    mistakes:
      Because India had no ideas: c7ss10_what
      To copy one country fully: c7ss10_what
  - prompt: 'Changing a part of the Constitution is called:'
    options:
    - An amendment
    - A preamble
    - An election
    answer: An amendment
    difficulty: 1
    hints:
    - It is why it is a living document.
    - Parliament can do it by a special process.
    solution: A change to the Constitution is an amendment.
    mistakes:
      A preamble: c7ss10_words
      An election: c7ss10_what
  - prompt: In which year did India become a republic?
    answer: '1950'
    check: '1950'
    difficulty: 1
    hints:
    - It was when the Constitution came into force.
    - It is celebrated every 26 January.
    solution: India became a republic on 26 January 1950.
    mistakes:
      '1947': c7ss10_dates
      '1949': c7ss10_dates
  - prompt: The Constituent Assembly first met in 1946 and adopted the Constitution in 1949. About how many years did it work?
    answer: '3'
    check: 1949-1946
    difficulty: 1
    hints:
    - Subtract the start year from the end year.
    - Both are CE years.
    solution: 'Step 1: 1949 - 1946. Step 2: = 3 years.'
    mistakes:
      '3895': c7ss10_count
      '4': c7ss10_count
  - prompt: Why was it important that the Assembly debated every article openly?
    options:
    - Different views could be heard before deciding
    - To waste time
    - So no one could read it
    answer: Different views could be heard before deciding
    difficulty: 2
    hints:
    - A democracy's rulebook should be made democratically.
    - Think of discussion.
    solution: Open debate meant many voices shaped the Constitution.
    mistakes:
      To waste time: c7ss10_what
      So no one could read it: c7ss10_what
  - prompt: Which date is celebrated as Constitution Day?
    options:
    - 26 November
    - 15 August
    - 2 October
    answer: 26 November
    difficulty: 2
    hints:
    - It is when the Constitution was adopted.
    - It is in 1949, two months before Republic Day.
    solution: 26 November marks the adoption of the Constitution in 1949.
    mistakes:
      15 August: c7ss10_dates
      2 October: c7ss10_dates
- code: cbse7ss.const.features
  title: The Preamble and key features
  after:
  - cbse7ss.const.making
  notes: |
    The Preamble introduces the Constitution: 'We, the people of India' resolve to make India a sovereign,
    socialist, secular, democratic republic, and to secure justice (social, economic, political), liberty (of
    thought, expression, belief, faith, worship), equality (of status and opportunity) and fraternity (dignity of
    the individual, unity of the nation). Key features: Fundamental Rights (equality, freedom, against
    exploitation, religion, culture and education, constitutional remedies), Fundamental Duties, federal system,
    parliamentary government, independent judiciary, universal adult franchise.
  explanations:
    text: 'The Preamble is the Constitution''s opening promise: India is a sovereign, socialist, secular, democratic republic that will give its people justice, liberty, equality and fraternity. Fundamental Rights protect every citizen; Fundamental Duties remind us of our responsibilities.'
    visual: Picture the Preamble as a doorway with four pillars labelled Justice, Liberty, Equality and Fraternity, under an arch reading 'We, the people of India'.
    step_by_step: 'Step 1: Read ''We, the people'': power comes from the people. Step 2: Learn the five words: sovereign, socialist, secular, democratic, republic. Step 3: Learn the four goals: justice, liberty, equality, fraternity. Step 4: Link rights with duties.'
    real_world: Many schools read the Preamble aloud in assembly on Constitution Day.
  picture:
    kind: compare
    columns:
    - title: India is
      points:
      - Sovereign
      - Socialist
      - Secular
      - Democratic
      - Republic
    - title: It promises
      points:
      - Justice
      - Liberty
      - Equality
      - Fraternity
    alt: The Preamble describes India as sovereign, socialist, secular, democratic and a republic, and promises justice, liberty, equality and fraternity.
  activity:
    type: sort
    prompt: Which Preamble ideal?
    bins:
    - Justice
    - Liberty
    - Equality
    - Fraternity
    items:
    - label: Social, economic and political fairness
      bin: Justice
      clue: Fair to all.
      why: Justice.
    - label: Freedom of thought and worship
      bin: Liberty
      clue: Freedom.
      why: Liberty.
    - label: Equal status and opportunity
      bin: Equality
      clue: Same chances.
      why: Equality.
    - label: Dignity of the individual and unity of the nation
      bin: Fraternity
      clue: Brotherhood.
      why: Fraternity.
  lesson:
    - teach: The Preamble is the introduction to the Constitution. It begins 'We, the people of India', showing that power comes from the people. It says India is sovereign (free to decide for itself), socialist, secular (all religions treated equally), democratic, and a republic (head of state is elected).
      check:
        prompt: '''Sovereign'' means India:'
        options:
        - Makes its own decisions, free of outside control
        - Is ruled by another country
        - Has a king
        answer: Makes its own decisions, free of outside control
        why: A sovereign country is fully independent.
    - teach: The Preamble's goals are justice (social, economic, political), liberty (of thought, expression, belief, faith, worship), equality (of status and opportunity) and fraternity (dignity of each person and unity of the nation).
      picture:
        kind: compare
        columns:
        - title: Goal
          points:
          - Justice
          - Liberty
          - Equality
          - Fraternity
        - title: Means
          points:
          - fairness for all
          - freedom of thought and belief
          - same status and chances
          - brotherhood and unity
        alt: The four goals of the Preamble.
      check:
        prompt: 'Equal chances for jobs for everyone is part of:'
        options:
        - Equality of opportunity
        - Liberty of worship
        - Sovereignty
        answer: Equality of opportunity
        why: Equality includes the same opportunities.
    - teach: 'Key features: Fundamental Rights (like equality, freedom, against exploitation, religion, education, and the right to go to court if rights are broken), Fundamental Duties, a federal system (Union and States), parliamentary government, an independent judiciary and universal adult franchise.'
      check:
        prompt: 'If someone''s Fundamental Right is violated, they can:'
        options:
        - Go to court for help
        - Do nothing
        - Only write to a friend
        answer: Go to court for help
        why: The right to constitutional remedies protects other rights.
  items:
  - prompt: With which words does the Preamble begin?
    options:
    - We, the people of India
    - In the name of the King
    - By order of Parliament
    - India is a kingdom
    answer: We, the people of India
    difficulty: 1
    hints:
    - Power from the people.
    - Opening line.
    solution: It begins 'We, the people of India'.
    mistakes: {"In the name of the King": "s7_we_the_people"}
  - prompt: '''Secular'' in the Preamble means:'
    options:
    - The state treats all religions equally
    - There is one state religion
    - Religion is banned
    - Only one religion is allowed
    answer: The state treats all religions equally
    difficulty: 2
    hints:
    - No official religion.
    - Equal respect.
    solution: India has no state religion and treats all faiths equally.
    mistakes:
      There is one state religion: c7ss_secular
  - prompt: '''Republic'' means:'
    options:
    - The head of state is elected, not a monarch
    - The country has a king
    - There are no laws
    - The army rules
    answer: The head of state is elected, not a monarch
    difficulty: 2
    hints:
    - The President is elected.
    - No king.
    solution: In a republic the head of state is elected.
    mistakes: {"The country has a king": "s7_republic"}
  - prompt: Which is NOT one of the Preamble's four goals?
    options:
    - Wealth
    - Justice
    - Liberty
    - Fraternity
    answer: Wealth
    difficulty: 1
    hints:
    - Justice, liberty, equality, fraternity.
    - One is missing.
    solution: The goals are justice, liberty, equality and fraternity.
    mistakes: {"Fraternity": "s7_preamble_goals"}
  - prompt: 'Fraternity means:'
    options:
    - A feeling of brotherhood and unity
    - Freedom of speech
    - Equal pay
    - Elections
    answer: A feeling of brotherhood and unity
    difficulty: 2
    hints:
    - Fraternal = like brothers.
    - Unity and dignity.
    solution: Fraternity is a sense of brotherhood among citizens.
    mistakes: {"Freedom of speech": "s7_fraternity"}
  - prompt: 'Fundamental Rights are:'
    options:
    - Basic rights guaranteed to citizens by the Constitution
    - Rules for schools only
    - Privileges of leaders
    - Taxes
    answer: Basic rights guaranteed to citizens by the Constitution
    difficulty: 1
    hints:
    - Equality, freedom, etc.
    - Courts protect them.
    solution: They are basic rights protected by the Constitution.
    mistakes: {"Privileges of leaders": "s7_fundamental_rights"}
  - prompt: Freedom of worship is part of which Preamble goal?
    options:
    - Liberty
    - Fraternity
    - Sovereignty
    answer: Liberty
    difficulty: 2
    hints:
    - Think of freedom.
    - Thought, expression, belief, faith and worship belong together.
    solution: Liberty of thought, expression, belief, faith and worship is promised.
    mistakes:
      Fraternity: c7ss10_words
      Sovereignty: c7ss10_words
  - prompt: Which is a Fundamental Duty, not a right?
    options:
    - Respecting the national flag and anthem
    - Freedom of speech
    - Equality before law
    answer: Respecting the national flag and anthem
    difficulty: 2
    hints:
    - A duty is something you should do.
    - A right is something you get.
    solution: Respecting the flag and anthem is a Fundamental Duty.
    mistakes:
      Freedom of speech: c7ss10_rights
      Equality before law: c7ss10_rights
  - prompt: 'India has a federal system. This means power is shared between:'
    options:
    - The Union and the States
    - Only the President
    - Only villages
    answer: The Union and the States
    difficulty: 2
    hints:
    - There are two levels of government.
    - Think of Delhi and the state capitals.
    solution: A federal system divides power between the central (Union) government and the states.
    mistakes:
      Only the President: c7ss10_what
      Only villages: c7ss10_what
  - prompt: 'An ''independent judiciary'' means courts:'
    options:
    - Decide cases without pressure from the government
    - Are controlled by ministers
    - Have no judges
    answer: Decide cases without pressure from the government
    difficulty: 2
    hints:
    - Judges must be fair.
    - Independent means free from control.
    solution: Independent courts decide freely and fairly, even against the government.
    mistakes:
      Are controlled by ministers: c7ss10_what
      Have no judges: c7ss10_what
  - prompt: Which right stops children being made to work in dangerous factories?
    options:
    - Right against exploitation
    - Right to vote
    - Right to property
    answer: Right against exploitation
    difficulty: 3
    hints:
    - Exploitation means unfair use of people.
    - Child labour is a form of it.
    solution: The Right against Exploitation bans child labour in hazardous work and forced labour.
    mistakes:
      Right to vote: c7ss10_rights
      Right to property: c7ss10_rights
  - prompt: 'A secular state means:'
    options:
    - The state has no official religion and treats all equally
    - Only one religion is allowed
    - Religion is banned
    answer: The state has no official religion and treats all equally
    difficulty: 2
    hints:
    - People keep their own faith.
    - The government favours none.
    solution: India's state does not favour any religion; all citizens are free to follow their faith.
    mistakes:
      Only one religion is allowed: c7ss10_words
      Religion is banned: c7ss10_words
  - prompt: 'Fraternity is about:'
    options:
    - Dignity of each person and unity of the nation
    - Having more money
    - Winning wars
    answer: Dignity of each person and unity of the nation
    difficulty: 2
    hints:
    - It is a feeling between citizens.
    - Think of brothers and sisters.
    solution: Fraternity means a spirit of brotherhood that respects every person and keeps the nation united.
    mistakes:
      Having more money: c7ss10_words
      Winning wars: c7ss10_words
  - prompt: The Preamble lists how many goals (justice, liberty, equality, fraternity)?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Count the goals in the brackets.
    - Each is one word.
    solution: 'Step 1: justice, liberty, equality, fraternity. Step 2: that is 4 goals.'
    mistakes:
      '3': c7ss10_count
      '5': c7ss10_count
  - prompt: '''We, the people of India'' tells us the Constitution''s power comes from:'
    options:
    - The people
    - A foreign king
    - The army
    answer: The people
    difficulty: 1
    hints:
    - Look at who is speaking in those words.
    - It is a democracy.
    solution: The opening words show that the people of India gave themselves this Constitution.
    mistakes:
      A foreign king: c7ss10_words
      The army: c7ss10_words
