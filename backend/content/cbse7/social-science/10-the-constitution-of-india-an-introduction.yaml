# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 10. Format: content/README.md.
subject: cbse7-ss
chapter: 10
title: 'The Constitution of India: An Introduction'
tips:
  c7ss_const_dates: Adopted 26 November 1949 (Constitution Day); came into force 26 January 1950 (Republic Day).
  c7ss_secular: Secular means the state has no religion of its own and treats all religions equally.
concepts:
- code: cbse7ss.const.making
  title: What a constitution is and how India's was made
  notes: |
    A constitution is the basic set of rules for how a country is governed: it sets up institutions, divides
    power, and protects citizens' rights. India's Constitution was drafted by the Constituent Assembly (1946–49);
    Dr B. R. Ambedkar chaired the Drafting Committee and Dr Rajendra Prasad presided over the Assembly. It was
    adopted on 26 November 1949 (Constitution Day) and came into force on 26 January 1950 (Republic Day). It is one
    of the longest written constitutions; it borrowed ideas from many countries and can be amended, so it is a
    'living document'. Fifteen women were members of the Assembly.
  explanations:
    text: A constitution is the rulebook of a country. India's was written by the Constituent Assembly, with Dr B. R. Ambedkar leading the drafting. It was adopted on 26 November 1949 and came into force on 26 January 1950, which we celebrate as Republic Day.
    visual: Picture a large hall in 1949 with members signing a long handwritten book, beautifully illustrated; that original is kept in Parliament today.
    step_by_step: 'Step 1: What it is: the basic rules. Step 2: Who made it: the Constituent Assembly. Step 3: Key people: Ambedkar, Rajendra Prasad. Step 4: Key dates: 26 Nov 1949, 26 Jan 1950. Step 5: It can be amended.'
    real_world: Every 26 January the Republic Day parade in New Delhi celebrates the day the Constitution came into force.
  picture:
    kind: flow
    steps:
    - '1946: Constituent Assembly meets'
    - Drafting Committee chaired by Dr Ambedkar
    - Debates over nearly 3 years
    - '26 Nov 1949: adopted'
    - '26 Jan 1950: comes into force (Republic Day)'
    alt: 'How India''s Constitution was made: the Constituent Assembly from 1946, drafting under Dr Ambedkar, adoption on 26 November 1949 and coming into force on 26 January 1950.'
  activity:
    type: order
    prompt: Making India's Constitution. Put it in order.
    steps:
    - Constituent Assembly first meets (1946)
    - Dr Ambedkar's Drafting Committee writes the draft
    - Adopted on 26 November 1949
    - Comes into force on 26 January 1950
    reasons:
      Dr Ambedkar's Drafting Committee writes the draft: The Assembly had to exist before choosing a drafting committee.
      Adopted on 26 November 1949: It was adopted after the draft was debated.
      Comes into force on 26 January 1950: It came into force two months after adoption, on Republic Day.
  items:
  - prompt: Who chaired the Drafting Committee of the Constitution?
    options:
    - Dr B. R. Ambedkar
    - Jawaharlal Nehru
    - Mahatma Gandhi
    - Sardar Patel
    answer: Dr B. R. Ambedkar
    difficulty: 1
    hints:
    - Called the architect of the Constitution.
    - Drafting Committee.
    solution: Dr Ambedkar chaired the Drafting Committee.
    mistakes:
      Mahatma Gandhi: c7ss_read_again
  - prompt: On which date did India's Constitution come into force?
    options:
    - 26 January 1950
    - 15 August 1947
    - 26 November 1949
    - 2 October 1950
    answer: 26 January 1950
    difficulty: 1
    hints:
    - Republic Day.
    - January.
    solution: It came into force on 26 January 1950.
  - prompt: '26 November is celebrated as:'
    options:
    - Constitution Day
    - Republic Day
    - Independence Day
    - Children's Day
    answer: Constitution Day
    difficulty: 2
    hints:
    - The Constitution was adopted in 1949.
    - November.
    solution: 'It was adopted on 26 November 1949: Constitution Day.'
    mistakes:
      Republic Day: c7ss_const_dates
  - prompt: What is a constitution?
    options:
    - The basic set of rules for governing a country
    - A list of holidays
    - A history book
    - A tax form
    answer: The basic set of rules for governing a country
    difficulty: 1
    hints:
    - Rulebook.
    - Sets up institutions.
    solution: It is the country's basic rulebook.
  - prompt: Why is the Constitution called a 'living document'?
    options:
    - It can be amended as times change
    - It is printed on living paper
    - It never changes
    - It is only for one year
    answer: It can be amended as times change
    difficulty: 2
    hints:
    - Amendments.
    - Grows with the country.
    solution: Amendments let it adapt over time.
  - prompt: The Constitution was adopted on 26 November 1949 and came into force on 26 January 1950. How many full months apart is that?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - 26 Nov to 26 Dec, then to 26 Jan.
    - Count.
    solution: 'Two months: 26 November → 26 December → 26 January.'
- code: cbse7ss.const.features
  title: The Preamble and key features
  after:
  - cbse7ss.const.making
  notes: |
    The Preamble introduces the Constitution: 'We, the people of India' resolve to make India a sovereign,
    socialist, secular, democratic republic, and to secure justice (social, economic, political), liberty (of
    thought, expression, belief, faith, worship), equality (of status and opportunity) and fraternity (dignity of
    the individual, unity of the nation). Key features: Fundamental Rights (equality, freedom, against
    exploitation, religion, culture and education, constitutional remedies), Fundamental Duties, federal system,
    parliamentary government, independent judiciary, universal adult franchise.
  explanations:
    text: 'The Preamble is the Constitution''s opening promise: India is a sovereign, socialist, secular, democratic republic that will give its people justice, liberty, equality and fraternity. Fundamental Rights protect every citizen; Fundamental Duties remind us of our responsibilities.'
    visual: Picture the Preamble as a doorway with four pillars labelled Justice, Liberty, Equality and Fraternity, under an arch reading 'We, the people of India'.
    step_by_step: 'Step 1: Read ''We, the people'': power comes from the people. Step 2: Learn the five words: sovereign, socialist, secular, democratic, republic. Step 3: Learn the four goals: justice, liberty, equality, fraternity. Step 4: Link rights with duties.'
    real_world: Many schools read the Preamble aloud in assembly on Constitution Day.
  picture:
    kind: compare
    columns:
    - title: India is
      points:
      - Sovereign
      - Socialist
      - Secular
      - Democratic
      - Republic
    - title: It promises
      points:
      - Justice
      - Liberty
      - Equality
      - Fraternity
    alt: The Preamble describes India as sovereign, socialist, secular, democratic and a republic, and promises justice, liberty, equality and fraternity.
  activity:
    type: sort
    prompt: Which Preamble ideal?
    bins:
    - Justice
    - Liberty
    - Equality
    - Fraternity
    items:
    - label: Social, economic and political fairness
      bin: Justice
      clue: Fair to all.
      why: Justice.
    - label: Freedom of thought and worship
      bin: Liberty
      clue: Freedom.
      why: Liberty.
    - label: Equal status and opportunity
      bin: Equality
      clue: Same chances.
      why: Equality.
    - label: Dignity of the individual and unity of the nation
      bin: Fraternity
      clue: Brotherhood.
      why: Fraternity.
  items:
  - prompt: With which words does the Preamble begin?
    options:
    - We, the people of India
    - In the name of the King
    - By order of Parliament
    - India is a kingdom
    answer: We, the people of India
    difficulty: 1
    hints:
    - Power from the people.
    - Opening line.
    solution: It begins 'We, the people of India'.
  - prompt: '''Secular'' in the Preamble means:'
    options:
    - The state treats all religions equally
    - There is one state religion
    - Religion is banned
    - Only one religion is allowed
    answer: The state treats all religions equally
    difficulty: 2
    hints:
    - No official religion.
    - Equal respect.
    solution: India has no state religion and treats all faiths equally.
    mistakes:
      There is one state religion: c7ss_secular
  - prompt: '''Republic'' means:'
    options:
    - The head of state is elected, not a monarch
    - The country has a king
    - There are no laws
    - The army rules
    answer: The head of state is elected, not a monarch
    difficulty: 2
    hints:
    - The President is elected.
    - No king.
    solution: In a republic the head of state is elected.
  - prompt: Which is NOT one of the Preamble's four goals?
    options:
    - Wealth
    - Justice
    - Liberty
    - Fraternity
    answer: Wealth
    difficulty: 1
    hints:
    - Justice, liberty, equality, fraternity.
    - One is missing.
    solution: The goals are justice, liberty, equality and fraternity.
  - prompt: 'Fraternity means:'
    options:
    - A feeling of brotherhood and unity
    - Freedom of speech
    - Equal pay
    - Elections
    answer: A feeling of brotherhood and unity
    difficulty: 2
    hints:
    - Fraternal = like brothers.
    - Unity and dignity.
    solution: Fraternity is a sense of brotherhood among citizens.
  - prompt: 'Fundamental Rights are:'
    options:
    - Basic rights guaranteed to citizens by the Constitution
    - Rules for schools only
    - Privileges of leaders
    - Taxes
    answer: Basic rights guaranteed to citizens by the Constitution
    difficulty: 1
    hints:
    - Equality, freedom, etc.
    - Courts protect them.
    solution: They are basic rights protected by the Constitution.
