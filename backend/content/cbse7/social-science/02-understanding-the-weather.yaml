# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 2. Format: content/README.md.
subject: cbse7-ss
chapter: 2
title: Understanding the Weather
tips:
  c7ss_instrument: 'Barometer: pressure. Hygrometer: humidity. Anemometer: wind speed. Wind vane: direction.'
  c7ss_weather_climate: Weather is for a short time (today); climate is the usual pattern over many years.
concepts:
- code: cbse7ss.wea.elements
  title: Elements of weather
  notes: |
    Weather is the state of the atmosphere at a place for a short time (today, this week). Its elements:
    temperature (thermometer, in °C), precipitation (rain, snow, hail; measured with a rain gauge in mm),
    atmospheric pressure (barometer; air pushing down), wind (speed by anemometer, direction by wind vane),
    and humidity (water vapour in the air; hygrometer). Maximum and minimum temperatures are recorded daily.
    Weather stations record these, and the India Meteorological Department (IMD) issues forecasts.
  explanations:
    text: 'Weather is what the air is like today: hot or cold, wet or dry, windy or calm. We measure it with instruments: thermometers for temperature, rain gauges for rain, barometers for air pressure, wind vanes for wind direction.'
    visual: 'Picture a school weather station: a thermometer in a white wooden box, a rain gauge on a post, a wind vane on the roof pointing into the wind.'
    step_by_step: 'Step 1: Name the element. Step 2: Match it to its instrument. Step 3: Note its unit (°C, mm). Step 4: Record readings daily and compare.'
    real_world: Fishermen listen to IMD forecasts of wind and storms before going to sea.
  picture:
    kind: compare
    columns:
    - title: Element
      points:
      - Temperature
      - Rainfall
      - Air pressure
      - Wind direction
      - Wind speed
    - title: Instrument
      points:
      - Thermometer
      - Rain gauge
      - Barometer
      - Wind vane
      - Anemometer
    alt: 'Elements of weather and the instruments that measure them: thermometer, rain gauge, barometer, wind vane and anemometer.'
  items:
  - prompt: Which instrument measures rainfall?
    options:
    - Rain gauge
    - Barometer
    - Thermometer
    - Anemometer
    answer: Rain gauge
    difficulty: 1
    hints:
    - It collects rain.
    - Measured in mm.
    solution: A rain gauge collects and measures rainfall.
  - prompt: Which instrument measures atmospheric pressure?
    options:
    - Barometer
    - Hygrometer
    - Wind vane
    - Rain gauge
    answer: Barometer
    difficulty: 1
    hints:
    - '''Baro'' = weight or pressure.'
    - Air pushing down.
    solution: A barometer measures air pressure.
    mistakes:
      Hygrometer: c7ss_instrument
  - prompt: Which instrument shows wind direction?
    options:
    - Wind vane
    - Anemometer
    - Thermometer
    - Barometer
    answer: Wind vane
    difficulty: 1
    hints:
    - It points.
    - Anemometer measures speed.
    solution: A wind vane shows direction.
  - prompt: 'Humidity means:'
    options:
    - The amount of water vapour in the air
    - The speed of wind
    - The amount of rain
    - The air pressure
    answer: The amount of water vapour in the air
    difficulty: 2
    hints:
    - Feels sticky when high.
    - Measured by a hygrometer.
    solution: Humidity is water vapour in the air.
  - prompt: A day's maximum temperature is 34 °C and minimum 22 °C. What is the difference, in °C?
    answer: '12'
    check: 34 - 22
    difficulty: 1
    hints:
    - Subtract.
    - 34 − 22.
    solution: 34 − 22 = 12 °C.
  - prompt: Which organisation issues weather forecasts in India?
    options:
    - India Meteorological Department (IMD)
    - ISRO only
    - Indian Railways
    - Reserve Bank of India
    answer: India Meteorological Department (IMD)
    difficulty: 2
    hints:
    - Meteorology is weather science.
    - IMD.
    solution: The IMD forecasts India's weather.
- code: cbse7ss.wea.weather
  title: Weather versus climate and why it matters
  after:
  - cbse7ss.wea.elements
  notes: |
    Weather changes from day to day; climate is the average weather of a place over many years (usually 30 or
    more). Example: 'It is raining in Mumbai today' is weather; 'Mumbai has heavy rain from June to September' is
    climate. Weather affects daily life (clothes, travel, farming); forecasts help farmers, pilots, fishermen and
    disaster management. Measurements: weekly rainfall totals and average temperatures can be calculated from
    daily records.
  explanations:
    text: Weather is what it's like outside today; climate is what it's usually like over many years. 'Raining today' is weather; 'wet every July' is climate.
    visual: 'Draw a calendar: each day has its own weather icon (sun, cloud, rain). Above it, a single label for the whole season, ''monsoon'', which is the climate.'
    step_by_step: 'Step 1: Is it about a short time (today, this week)? Then weather. Step 2: Is it about many years or a usual pattern? Then climate. Step 3: Use averages of records to describe climate.'
    real_world: Farmers decide when to sow using the climate (when the monsoon usually comes) and weather forecasts (whether rain is expected this week).
  picture:
    kind: compare
    columns:
    - title: Weather
      points:
      - 'Short time: hours, days'
      - Changes often
      - '''It is cold today'''
    - title: Climate
      points:
      - 'Long time: 30+ years'
      - Average pattern
      - '''Winters here are cold'''
    alt: Weather describes the atmosphere over a short time and changes often; climate is the long-term average pattern.
  items:
  - prompt: '''It is very hot in Delhi today.'' This describes:'
    options:
    - Weather
    - Climate
    - Landform
    - Season only
    answer: Weather
    difficulty: 1
    hints:
    - Today.
    - Short time.
    solution: A single day's condition is weather.
    mistakes:
      Climate: c7ss_weather_climate
  - prompt: '''Chennai is hot and humid most of the year.'' This describes:'
    options:
    - Climate
    - Weather
    - Pressure
    - A forecast
    answer: Climate
    difficulty: 1
    hints:
    - Most of the year.
    - Long-term pattern.
    solution: A usual, long-term pattern is climate.
  - prompt: 'Climate is usually worked out from records over at least:'
    options:
    - 30 years
    - 1 week
    - 1 month
    - 1 day
    answer: 30 years
    difficulty: 2
    hints:
    - A long time.
    - Many years of averages.
    solution: Climate is based on about 30 or more years of records.
  - prompt: Rainfall on 5 days was 10, 0, 25, 5 and 10 mm. What was the total rainfall, in mm?
    answer: '50'
    check: 10 + 0 + 25 + 5 + 10
    difficulty: 1
    hints:
    - Add them.
    - 10 + 0 + 25 + 5 + 10.
    solution: Total = 50 mm.
  - prompt: Using the same rainfall (total 50 mm over 5 days), what was the average daily rainfall, in mm?
    answer: '10'
    check: 50/5
    difficulty: 2
    hints:
    - Total ÷ days.
    - 50 ÷ 5.
    solution: 50 ÷ 5 = 10 mm per day.
  - prompt: Who relies most on daily weather forecasts?
    options:
    - Fishermen going to sea
    - Painters of old buildings only
    - Library staff
    - Nobody
    answer: Fishermen going to sea
    difficulty: 1
    hints:
    - Storms are dangerous at sea.
    - Daily decision.
    solution: Fishermen check forecasts before sailing.
