# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 1), SYNiq chapter 13. Format: content/README.md.
subject: cbse7-ss
chapter: 13
title: The Story of Indian Farming
tips:
  c7ss_crop_season: Kharif crops (rice, cotton) grow in the monsoon; rabi crops (wheat, mustard) in winter.
concepts:
- code: cbse7ss.farm.practices
  title: 'Indian agriculture: seasons, soils and water'
  notes: |
    Agriculture employs a large share of Indians. Cropping seasons: kharif (sown with the monsoon, June–July,
    harvested in autumn: rice, maize, cotton, jowar), rabi (sown in winter, October–November, harvested in spring:
    wheat, mustard, gram), zaid (short summer season: watermelon, cucumber). Soils: alluvial (plains, very fertile),
    black (Deccan, cotton), red (south and east), laterite, desert soils. Water: monsoon rain, wells, canals, tanks,
    and drip and sprinkler irrigation that save water. Traditional practices include mixed cropping and crop
    rotation; modern ones include machines and high-yielding seeds.
  explanations:
    text: Indian farmers grow kharif crops like rice in the monsoon, rabi crops like wheat in winter, and zaid crops in a short summer season. Different soils suit different crops, and water comes from rain, wells, canals and modern drip irrigation.
    visual: 'Draw a year as a circle: June–October labelled kharif (rice, cotton), November–March rabi (wheat, mustard), April–May zaid (watermelon).'
    step_by_step: 'Step 1: Identify the season: kharif, rabi or zaid. Step 2: Match the crop. Step 3: Match the soil (alluvial, black, red). Step 4: Choose an irrigation method that saves water.'
    real_world: Punjab and Haryana grow wheat in winter (rabi) and rice in the monsoon (kharif) on fertile alluvial soil watered by canals.
  picture:
    kind: compare
    columns:
    - title: Kharif
      points:
      - Sown with the monsoon (June–July)
      - Rice, maize, cotton
      - Harvested in autumn
    - title: Rabi
      points:
      - Sown in winter (Oct–Nov)
      - Wheat, mustard, gram
      - Harvested in spring
    - title: Zaid
      points:
      - Short summer season
      - Watermelon, cucumber
      - Between rabi and kharif
    alt: 'India''s three cropping seasons: kharif with the monsoon, rabi in winter and zaid in summer, with typical crops.'
  items:
  - prompt: Which is a kharif crop?
    options:
    - Rice
    - Wheat
    - Mustard
    - Gram
    answer: Rice
    difficulty: 1
    hints:
    - Grown in the monsoon.
    - Needs lots of water.
    solution: 'Rice is sown with the monsoon: kharif.'
    mistakes:
      Wheat: c7ss_crop_season
  - prompt: 'Wheat is a:'
    options:
    - Rabi crop
    - Kharif crop
    - Zaid crop
    - Plantation crop
    answer: Rabi crop
    difficulty: 1
    hints:
    - Sown in winter.
    - Harvested in spring.
    solution: Wheat is a rabi crop.
  - prompt: Which soil is best for cotton?
    options:
    - Black soil
    - Desert soil
    - Laterite soil
    - Sandy soil
    answer: Black soil
    difficulty: 2
    hints:
    - Deccan Plateau.
    - Holds moisture.
    solution: Black soil suits cotton.
  - prompt: 'Drip irrigation is useful because it:'
    options:
    - Saves water by watering plant roots directly
    - Floods the field
    - Uses more water
    - Needs no water
    answer: Saves water by watering plant roots directly
    difficulty: 2
    hints:
    - Drop by drop.
    - Less waste.
    solution: It delivers water straight to roots, saving water.
  - prompt: 'The most fertile soil of the northern plains is:'
    options:
    - Alluvial soil
    - Red soil
    - Desert soil
    - Laterite soil
    answer: Alluvial soil
    difficulty: 1
    hints:
    - River silt.
    - Ganga plains.
    solution: Alluvial soil, deposited by rivers.
  - prompt: 'Watermelon is usually grown in the:'
    options:
    - Zaid season
    - Kharif season
    - Rabi season
    - No season
    answer: Zaid season
    difficulty: 2
    hints:
    - Short summer season.
    - Between rabi and kharif.
    solution: Watermelon is a zaid crop.
- code: cbse7ss.farm.challenges
  title: Challenges for farmers and the government's role
  after:
  - cbse7ss.farm.practices
  notes: |
    Farmers face many problems: dependence on uncertain monsoons, small and divided landholdings, debt, falling
    groundwater, soil damage from too much chemical fertiliser, crop losses from pests and weather, and low prices.
    Government help: Minimum Support Price (MSP), crop insurance (PM Fasal Bima Yojana), Kisan Credit Cards for
    cheap loans, soil health cards, PM-KISAN income support, and agricultural research (the Green Revolution of the
    1960s raised wheat and rice output with high-yielding seeds, irrigation and fertilisers). Organic and natural
    farming are growing.
  explanations:
    text: 'Farming in India is hard work with many risks: unreliable rain, small farms, debt and low prices. The government helps with support prices, crop insurance, cheap loans and soil testing. The Green Revolution of the 1960s greatly increased food production.'
    visual: Picture a farmer looking at a dry sky, holding a soil health card in one hand and a Kisan Credit Card in the other, with a field of high-yield wheat behind.
    step_by_step: 'Step 1: Name the problem (rain, debt, prices, soil). Step 2: Match a government scheme (insurance, credit card, MSP, soil card). Step 3: Think of a farmer''s own solution (drip irrigation, mixed cropping, organic farming).'
    real_world: Sikkim became India's first fully organic state, farming without chemical fertilisers and pesticides.
  picture:
    kind: compare
    columns:
    - title: Challenge
      points:
      - Uncertain monsoon
      - Debt
      - Soil damage
      - Low prices
    - title: Help
      points:
      - Irrigation, crop insurance
      - Kisan Credit Card
      - Soil health card
      - Minimum Support Price
    alt: Farmers' challenges (uncertain rain, debt, soil damage, low prices) matched with help (irrigation and insurance, credit cards, soil health cards, MSP).
  items:
  - prompt: What did the Green Revolution of the 1960s increase?
    options:
    - Production of wheat and rice
    - Number of forests
    - Milk production only
    - Fish catch
    answer: Production of wheat and rice
    difficulty: 1
    hints:
    - High-yielding seeds.
    - Food grains.
    solution: It boosted wheat and rice output.
  - prompt: What does a soil health card tell a farmer?
    options:
    - The nutrients in the soil and what fertiliser is needed
    - The weather tomorrow
    - Market prices
    - Loan amount
    answer: The nutrients in the soil and what fertiliser is needed
    difficulty: 2
    hints:
    - Soil testing.
    - Right fertiliser.
    solution: It reports soil nutrients and suggests fertilisers.
  - prompt: 'PM Fasal Bima Yojana provides:'
    options:
    - Crop insurance
    - Free tractors
    - School meals
    - Railway tickets
    answer: Crop insurance
    difficulty: 2
    hints:
    - '''Bima'' = insurance.'
    - Protects against loss.
    solution: It insures crops against losses.
    mistakes:
      Free tractors: c7ss_read_again
  - prompt: Why is depending on the monsoon risky for farmers?
    options:
    - Rain may come late, too little or too much
    - The monsoon is always the same
    - Rain harms all crops
    - There is no monsoon in India
    answer: Rain may come late, too little or too much
    difficulty: 1
    hints:
    - Droughts and floods.
    - Uncertain.
    solution: Unreliable rain can cause droughts or floods.
  - prompt: Which state became India's first fully organic state?
    options:
    - Sikkim
    - Punjab
    - Kerala
    - Gujarat
    answer: Sikkim
    difficulty: 2
    hints:
    - In the north-east.
    - Himalayan state.
    solution: Sikkim is fully organic.
  - prompt: 'A Kisan Credit Card helps farmers to:'
    options:
    - Get loans at low interest
    - Travel free
    - Sell land
    - Avoid taxes
    answer: Get loans at low interest
    difficulty: 1
    hints:
    - Credit = loan.
    - Kisan = farmer.
    solution: It gives farmers easy, cheap credit.
