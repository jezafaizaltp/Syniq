# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 1), SYNiq chapter 13. Format: content/README.md.
subject: cbse7-ss
chapter: 13
title: The Story of Indian Farming
tips:
  c7ss_crop_season: "Wheat is sown in winter. Kharif crops are sown with the monsoon and need lots of water. Which crop grows in flooded fields?"
  s7_alluvial: "Rivers deposit this soil on the plains."
  s7_cotton_soil: "Cotton needs soil that holds moisture. Which dark soil is that?"
  s7_drip: "Drip means drop by drop."
  s7_green_revolution: "The Green Revolution used new seeds for two main grains."
  s7_kcc: "Credit means a loan."
  s7_monsoon_risk: "Farmers can't control the rain. What can go wrong?"
  s7_rabi: "Wheat is sown in winter and harvested in spring."
  s7_sikkim: "Punjab is known for chemical-heavy Green Revolution farming. Which small Himalayan state went fully organic?"
  s7_soil_card: "A soil health card is about the soil, not the weather or prices."
  s7_zaid: "Watermelon grows in the short hot season between rabi and kharif."
  c7ss13_season: Crops sown when the monsoon arrives belong to one season, crops sown in the cool months to another, and quick summer crops to a third. Think about when the crop is sown.
  c7ss13_soil: Each soil has a home region and a best crop. Picture the river plains, the Deccan plateau, the south and east, and the desert.
  c7ss13_water: Some methods flood whole fields; others deliver water slowly to each plant. Think about which wastes less.
  c7ss13_practice: Growing different crops together or one after another keeps soil healthy. Think about how each method helps the soil.
  c7ss13_problem: Farmers face risks from weather, debt, small plots, falling water and damaged soil. Match the problem to its cause.
  c7ss13_help: 'Each government scheme solves one problem: low prices, crop loss, costly loans, unknown soil needs, or low income. Match scheme to problem.'
  c7ss13_calc: Write the calculation before answering. Check the units (kg, quintals, acres, rupees).
concepts:
- code: cbse7ss.farm.practices
  title: 'Indian agriculture: seasons, soils and water'
  notes: |
    Agriculture employs a large share of Indians. Cropping seasons: kharif (sown with the monsoon, June–July,
    harvested in autumn: rice, maize, cotton, jowar), rabi (sown in winter, October–November, harvested in spring:
    wheat, mustard, gram), zaid (short summer season: watermelon, cucumber). Soils: alluvial (plains, very fertile),
    black (Deccan, cotton), red (south and east), laterite, desert soils. Water: monsoon rain, wells, canals, tanks,
    and drip and sprinkler irrigation that save water. Traditional practices include mixed cropping and crop
    rotation; modern ones include machines and high-yielding seeds.
  explanations:
    text: Indian farmers grow kharif crops like rice in the monsoon, rabi crops like wheat in winter, and zaid crops in a short summer season. Different soils suit different crops, and water comes from rain, wells, canals and modern drip irrigation.
    visual: 'Draw a year as a circle: June–October labelled kharif (rice, cotton), November–March rabi (wheat, mustard), April–May zaid (watermelon).'
    step_by_step: 'Step 1: Identify the season: kharif, rabi or zaid. Step 2: Match the crop. Step 3: Match the soil (alluvial, black, red). Step 4: Choose an irrigation method that saves water.'
    real_world: Punjab and Haryana grow wheat in winter (rabi) and rice in the monsoon (kharif) on fertile alluvial soil watered by canals.
  picture:
    kind: compare
    columns:
    - title: Kharif
      points:
      - Sown with the monsoon (June–July)
      - Rice, maize, cotton
      - Harvested in autumn
    - title: Rabi
      points:
      - Sown in winter (Oct–Nov)
      - Wheat, mustard, gram
      - Harvested in spring
    - title: Zaid
      points:
      - Short summer season
      - Watermelon, cucumber
      - Between rabi and kharif
    alt: 'India''s three cropping seasons: kharif with the monsoon, rabi in winter and zaid in summer, with typical crops.'
  activity:
    type: sort
    prompt: Kharif, rabi or zaid?
    bins:
    - Kharif
    - Rabi
    - Zaid
    items:
    - label: Rice sown in June–July
      bin: Kharif
      clue: With the monsoon.
      why: Kharif.
    - label: Maize
      bin: Kharif
      clue: Monsoon.
      why: Kharif.
    - label: Wheat sown in October–November
      bin: Rabi
      clue: Winter.
      why: Rabi.
    - label: Gram
      bin: Rabi
      clue: Winter.
      why: Rabi.
    - label: Watermelon in summer
      bin: Zaid
      clue: Short summer.
      why: Zaid.
  lesson:
    - teach: 'Farming feeds India and employs a large share of its people. India has three cropping seasons. Kharif crops are sown with the monsoon (June-July) and harvested in autumn: rice, maize, cotton. Rabi crops are sown in winter (October-November) and harvested in spring: wheat, mustard, gram. Zaid crops grow in the short summer: watermelon, cucumber.'
      picture:
        kind: compare
        columns:
        - title: Kharif
          points:
          - sown June-July
          - rice, maize, cotton
        - title: Rabi
          points:
          - sown Oct-Nov
          - wheat, mustard, gram
        - title: Zaid
          points:
          - short summer
          - watermelon, cucumber
        alt: India's three cropping seasons and their crops.
      check:
        prompt: 'Mustard is sown in winter. It is a:'
        options:
        - Rabi crop
        - Kharif crop
        - Zaid crop
        answer: Rabi crop
        why: Winter-sown crops are rabi.
    - teach: Soils differ. Alluvial soil, laid down by rivers, makes the northern plains very fertile. Black soil of the Deccan holds moisture and suits cotton. Red soil is found in the south and east; laterite soil in high-rainfall areas like Kerala; desert soil in Rajasthan.
      check:
        prompt: Why does black soil suit cotton?
        options:
        - It holds moisture well
        - It is sandy and dry
        - It has no nutrients
        answer: It holds moisture well
        why: Cotton grows well in moist black soil.
    - teach: Water comes from the monsoon, wells, canals and tanks. Drip irrigation drops water at the roots and sprinklers spray it like rain, saving water. Traditional practices like mixed cropping (crops grown together) and crop rotation (changing crops each season) keep soil healthy.
      check:
        prompt: 'Growing pulses after wheat in the same field is:'
        options:
        - Crop rotation
        - Drip irrigation
        - Mixed cropping
        answer: Crop rotation
        why: Changing crops season by season is rotation.
  items:
  - prompt: Which is a kharif crop?
    options:
    - Rice
    - Wheat
    - Mustard
    - Gram
    answer: Rice
    difficulty: 1
    hints:
    - Grown in the monsoon.
    - Needs lots of water.
    solution: 'Rice is sown with the monsoon: kharif.'
    mistakes:
      Wheat: c7ss_crop_season
  - prompt: 'Wheat is a:'
    options:
    - Rabi crop
    - Kharif crop
    - Zaid crop
    - Plantation crop
    answer: Rabi crop
    difficulty: 1
    hints:
    - Sown in winter.
    - Harvested in spring.
    solution: Wheat is a rabi crop.
    mistakes: {"Kharif crop": "s7_rabi"}
  - prompt: Which soil is best for cotton?
    options:
    - Black soil
    - Desert soil
    - Laterite soil
    - Sandy soil
    answer: Black soil
    difficulty: 2
    hints:
    - Deccan Plateau.
    - Holds moisture.
    solution: Black soil suits cotton.
    mistakes: {"Sandy soil": "s7_cotton_soil", "Laterite soil": "s7_cotton_soil"}
  - prompt: 'Drip irrigation is useful because it:'
    options:
    - Saves water by watering plant roots directly
    - Floods the field
    - Uses more water
    - Needs no water
    answer: Saves water by watering plant roots directly
    difficulty: 2
    hints:
    - Drop by drop.
    - Less waste.
    solution: It delivers water straight to roots, saving water.
    mistakes: {"Floods the field": "s7_drip"}
  - prompt: 'The most fertile soil of the northern plains is:'
    options:
    - Alluvial soil
    - Red soil
    - Desert soil
    - Laterite soil
    answer: Alluvial soil
    difficulty: 1
    hints:
    - River silt.
    - Ganga plains.
    solution: Alluvial soil, deposited by rivers.
    mistakes: {"Red soil": "s7_alluvial"}
  - prompt: 'Watermelon is usually grown in the:'
    options:
    - Zaid season
    - Kharif season
    - Rabi season
    - No season
    answer: Zaid season
    difficulty: 2
    hints:
    - Short summer season.
    - Between rabi and kharif.
    solution: Watermelon is a zaid crop.
    mistakes: {"Kharif season": "s7_zaid"}
  - prompt: 'Gram (chickpea) is sown in October. It is a:'
    options:
    - Rabi crop
    - Kharif crop
    - Zaid crop
    answer: Rabi crop
    difficulty: 1
    hints:
    - October is the start of winter sowing.
    - Wheat is in the same season.
    solution: Gram is sown in winter and harvested in spring, so it is a rabi crop.
    mistakes:
      Kharif crop: c7ss13_season
      Zaid crop: c7ss13_season
  - prompt: 'Maize sown in July is a:'
    options:
    - Kharif crop
    - Rabi crop
    - Zaid crop
    answer: Kharif crop
    difficulty: 1
    hints:
    - July is monsoon time.
    - Rice is in the same season.
    solution: Crops sown with the monsoon (June-July) are kharif.
    mistakes:
      Rabi crop: c7ss13_season
      Zaid crop: c7ss13_season
  - prompt: Which soil is common in high-rainfall Kerala?
    options:
    - Laterite soil
    - Desert soil
    - Black soil
    answer: Laterite soil
    difficulty: 2
    hints:
    - Heavy rain washes nutrients out of it.
    - It is used to make bricks too.
    solution: Laterite soil forms in hot, very wet regions like Kerala.
    mistakes:
      Desert soil: c7ss13_soil
      Black soil: c7ss13_soil
  - prompt: Why does sprinkler irrigation save water compared to flooding a field?
    options:
    - It sprays only as much as plants need
    - It uses sea water
    - It works only at night
    answer: It sprays only as much as plants need
    difficulty: 2
    hints:
    - Flooding loses water to runoff.
    - Sprinklers act like gentle rain.
    solution: Sprinklers spread controlled amounts, so less water runs off or soaks away unused.
    mistakes:
      It uses sea water: c7ss13_water
      It works only at night: c7ss13_water
  - prompt: 'Growing maize and beans together in one field is:'
    options:
    - Mixed cropping
    - Crop rotation
    - Drip irrigation
    answer: Mixed cropping
    difficulty: 2
    hints:
    - Two crops at the same time.
    - Rotation means one after another.
    solution: Growing two or more crops together at once is mixed cropping.
    mistakes:
      Crop rotation: c7ss13_practice
      Drip irrigation: c7ss13_water
  - prompt: A farmer's field gives 20 quintals of wheat per acre. How much from 4 acres?
    answer: '80'
    check: 20*4
    difficulty: 1
    hints:
    - Each acre gives the same amount.
    - Multiply.
    solution: 'Step 1: 20 quintals × 4 acres. Step 2: = 80 quintals.'
    mistakes:
      '24': c7ss13_calc
      '5': c7ss13_calc
  - prompt: Why does crop rotation with pulses help the soil?
    options:
    - Pulses add nitrogen back to the soil
    - Pulses remove all water
    - Pulses make soil sandy
    answer: Pulses add nitrogen back to the soil
    difficulty: 3
    hints:
    - Pulse roots have helpful bacteria.
    - Nitrogen is a plant nutrient.
    solution: Bacteria in pulse roots fix nitrogen, enriching the soil for the next crop.
    mistakes:
      Pulses remove all water: c7ss13_practice
      Pulses make soil sandy: c7ss13_practice
  - prompt: Where is alluvial soil mainly found?
    options:
    - The northern river plains
    - The Thar desert
    - High mountain tops
    answer: The northern river plains
    difficulty: 1
    hints:
    - Rivers lay it down.
    - Think of the Ganga.
    solution: Alluvial soil is laid down by rivers in the Indo-Gangetic plains.
    mistakes:
      The Thar desert: c7ss13_soil
      High mountain tops: c7ss13_soil
  - prompt: 'Cucumber grown in the summer between rabi and kharif is a:'
    options:
    - Zaid crop
    - Rabi crop
    - Kharif crop
    answer: Zaid crop
    difficulty: 2
    hints:
    - It is a short season.
    - Watermelon is in the same season.
    solution: Short summer-season crops like cucumber and watermelon are zaid crops.
    mistakes:
      Rabi crop: c7ss13_season
      Kharif crop: c7ss13_season
- code: cbse7ss.farm.challenges
  title: Challenges for farmers and the government's role
  after:
  - cbse7ss.farm.practices
  notes: |
    Farmers face many problems: dependence on uncertain monsoons, small and divided landholdings, debt, falling
    groundwater, soil damage from too much chemical fertiliser, crop losses from pests and weather, and low prices.
    Government help: Minimum Support Price (MSP), crop insurance (PM Fasal Bima Yojana), Kisan Credit Cards for
    cheap loans, soil health cards, PM-KISAN income support, and agricultural research (the Green Revolution of the
    1960s raised wheat and rice output with high-yielding seeds, irrigation and fertilisers). Organic and natural
    farming are growing.
  explanations:
    text: 'Farming in India is hard work with many risks: unreliable rain, small farms, debt and low prices. The government helps with support prices, crop insurance, cheap loans and soil testing. The Green Revolution of the 1960s greatly increased food production.'
    visual: Picture a farmer looking at a dry sky, holding a soil health card in one hand and a Kisan Credit Card in the other, with a field of high-yield wheat behind.
    step_by_step: 'Step 1: Name the problem (rain, debt, prices, soil). Step 2: Match a government scheme (insurance, credit card, MSP, soil card). Step 3: Think of a farmer''s own solution (drip irrigation, mixed cropping, organic farming).'
    real_world: Sikkim became India's first fully organic state, farming without chemical fertilisers and pesticides.
  picture:
    kind: compare
    columns:
    - title: Challenge
      points:
      - Uncertain monsoon
      - Debt
      - Soil damage
      - Low prices
    - title: Help
      points:
      - Irrigation, crop insurance
      - Kisan Credit Card
      - Soil health card
      - Minimum Support Price
    alt: Farmers' challenges (uncertain rain, debt, soil damage, low prices) matched with help (irrigation and insurance, credit cards, soil health cards, MSP).
  activity:
    type: sort
    prompt: Which help for which problem?
    bins:
    - Crop insurance
    - Kisan Credit Card
    - Minimum Support Price
    - Soil health card
    items:
    - label: Crops destroyed by hail
      bin: Crop insurance
      clue: PM Fasal Bima Yojana.
      why: Insurance.
    - label: Needs a cheap loan for seeds
      bin: Kisan Credit Card
      clue: Credit.
      why: KCC.
    - label: Market price falls below cost
      bin: Minimum Support Price
      clue: A floor price.
      why: MSP.
    - label: Doesn't know which fertiliser the soil needs
      bin: Soil health card
      clue: Tests the soil.
      why: Soil health card.
  lesson:
    - teach: 'Farmers face many problems: uncertain monsoons (late, too little or too much rain), small and divided plots, debt, falling groundwater, soil harmed by too much chemical fertiliser, pest attacks and low prices for crops.'
      check:
        prompt: Why do many farmers fall into debt?
        options:
        - Crop losses and costly loans
        - They earn too much
        - Seeds are free
        answer: Crop losses and costly loans
        why: A bad season with loans to repay can trap a farmer.
    - teach: In the 1960s, the Green Revolution raised wheat and rice output using high-yielding seeds, irrigation and fertilisers, ending famines. But overuse of water and chemicals later harmed soil and groundwater, so balance is needed.
      check:
        prompt: What was one later problem of the Green Revolution?
        options:
        - Overuse of water and chemicals harmed soil
        - Too few crops grew
        - No one used fertiliser
        answer: Overuse of water and chemicals harmed soil
        why: Heavy use of chemicals and water damaged land.
    - teach: Government help includes MSP for some crops, crop insurance (PM Fasal Bima Yojana), Kisan Credit Cards for low-interest loans, soil health cards that show which nutrients the soil needs, and PM-KISAN income support. Organic and natural farming are growing; Sikkim is fully organic.
      picture:
        kind: compare
        columns:
        - title: Problem
          points:
          - low crop prices
          - crop loss
          - costly loans
          - unknown soil needs
        - title: Help
          points:
          - MSP
          - crop insurance
          - Kisan Credit Card
          - soil health card
        alt: Farm problems and the government help for each.
      check:
        prompt: A flood destroys a farmer's crop. Which scheme helps most?
        options:
        - Crop insurance
        - Soil health card
        - Quality marks
        answer: Crop insurance
        why: Insurance pays for crop losses.
  items:
  - prompt: What did the Green Revolution of the 1960s increase?
    options:
    - Production of wheat and rice
    - Number of forests
    - Milk production only
    - Fish catch
    answer: Production of wheat and rice
    difficulty: 1
    hints:
    - High-yielding seeds.
    - Food grains.
    solution: It boosted wheat and rice output.
    mistakes: {"Milk production only": "s7_green_revolution"}
  - prompt: What does a soil health card tell a farmer?
    options:
    - The nutrients in the soil and what fertiliser is needed
    - The weather tomorrow
    - Market prices
    - Loan amount
    answer: The nutrients in the soil and what fertiliser is needed
    difficulty: 2
    hints:
    - Soil testing.
    - Right fertiliser.
    solution: It reports soil nutrients and suggests fertilisers.
    mistakes: {"The weather tomorrow": "s7_soil_card"}
  - prompt: 'PM Fasal Bima Yojana provides:'
    options:
    - Crop insurance
    - Free tractors
    - School meals
    - Railway tickets
    answer: Crop insurance
    difficulty: 2
    hints:
    - '''Bima'' = insurance.'
    - Protects against loss.
    solution: It insures crops against losses.
    mistakes:
      Free tractors: c7ss_read_again
  - prompt: Why is depending on the monsoon risky for farmers?
    options:
    - Rain may come late, too little or too much
    - The monsoon is always the same
    - Rain harms all crops
    - There is no monsoon in India
    answer: Rain may come late, too little or too much
    difficulty: 1
    hints:
    - Droughts and floods.
    - Uncertain.
    solution: Unreliable rain can cause droughts or floods.
    mistakes: {"The monsoon is always the same": "s7_monsoon_risk"}
  - prompt: Which state became India's first fully organic state?
    options:
    - Sikkim
    - Punjab
    - Kerala
    - Gujarat
    answer: Sikkim
    difficulty: 2
    hints:
    - In the north-east.
    - Himalayan state.
    solution: Sikkim is fully organic.
    mistakes: {"Punjab": "s7_sikkim"}
  - prompt: 'A Kisan Credit Card helps farmers to:'
    options:
    - Get loans at low interest
    - Travel free
    - Sell land
    - Avoid taxes
    answer: Get loans at low interest
    difficulty: 1
    hints:
    - Credit = loan.
    - Kisan = farmer.
    solution: It gives farmers easy, cheap credit.
    mistakes: {"Avoid taxes": "s7_kcc"}
  - prompt: Why are small divided plots a problem?
    options:
    - Machines are hard to use and income is low
    - They grow too much food
    - They need no water
    answer: Machines are hard to use and income is low
    difficulty: 2
    hints:
    - Land gets split among family members.
    - Think of a tractor on a tiny field.
    solution: Tiny plots give small harvests and make machines and investment uneconomic.
    mistakes:
      They grow too much food: c7ss13_problem
      They need no water: c7ss13_problem
  - prompt: 'Falling groundwater is mainly caused by:'
    options:
    - Pumping more water than rain puts back
    - Too much rain
    - Planting trees
    answer: Pumping more water than rain puts back
    difficulty: 2
    hints:
    - Many borewells pump day and night.
    - Rain refills it slowly.
    solution: Overpumping for irrigation lowers the water table faster than rain refills it.
    mistakes:
      Too much rain: c7ss13_problem
      Planting trees: c7ss13_problem
  - prompt: PM-KISAN gives eligible farmers ₹6,000 a year in 3 equal parts. How much is each part, in rupees?
    answer: '2000'
    check: 6000/3
    difficulty: 1
    hints:
    - Equal parts means divide.
    - Share 6,000 into 3.
    solution: 'Step 1: 6000 ÷ 3. Step 2: = ₹2,000 per instalment.'
    mistakes:
      '18000': c7ss13_calc
      '3': c7ss13_calc
  - prompt: Which state is India's first fully organic state?
    options:
    - Sikkim
    - Punjab
    - Rajasthan
    answer: Sikkim
    difficulty: 2
    hints:
    - It is in the north-east Himalayas.
    - It banned chemical fertilisers.
    solution: Sikkim was declared fully organic in 2016.
    mistakes:
      Punjab: c7ss13_help
      Rajasthan: c7ss13_help
  - prompt: Which crops grew most in the Green Revolution?
    options:
    - Wheat and rice
    - Tea and coffee
    - Rubber and coconut
    answer: Wheat and rice
    difficulty: 1
    hints:
    - They are India's main food grains.
    - Punjab and Haryana grew them.
    solution: High-yielding wheat and rice varieties spread most in the Green Revolution.
    mistakes:
      Tea and coffee: c7ss13_help
      Rubber and coconut: c7ss13_help
  - prompt: A farmer needs to know if the soil lacks nitrogen. What helps?
    options:
    - A soil health card
    - A Kisan Credit Card
    - An MRP label
    answer: A soil health card
    difficulty: 1
    hints:
    - It reports soil test results.
    - It tells nutrient levels.
    solution: Soil health cards report nutrients and suggest fertilisers.
    mistakes:
      A Kisan Credit Card: c7ss13_help
      An MRP label: c7ss13_help
  - prompt: Why is natural or organic farming growing?
    options:
    - It protects soil and reduces chemical harm
    - It uses more chemicals
    - It needs no work
    answer: It protects soil and reduces chemical harm
    difficulty: 2
    hints:
    - Think of the Green Revolution's side effects.
    - Healthy soil lasts longer.
    solution: Organic farming avoids chemical fertilisers and pesticides, keeping soil and water healthier.
    mistakes:
      It uses more chemicals: c7ss13_practice
      It needs no work: c7ss13_practice
  - prompt: A farmer borrows ₹10,000 at 4% yearly interest with a Kisan Credit Card. How much interest for one year, in rupees?
    answer: '400'
    check: 10000*4/100
    difficulty: 3
    hints:
    - 4% means 4 for every 100.
    - Find 4/100 of 10,000.
    solution: 'Step 1: 4% of 10000 = 10000 × 4 ÷ 100. Step 2: = ₹400.'
    mistakes:
      '4': c7ss13_calc
      '4000': c7ss13_calc
  - prompt: Why is MSP useful to a farmer at harvest?
    options:
    - Prices cannot fall below a promised level for some crops
    - It makes rain come on time
    - It gives free land
    answer: Prices cannot fall below a promised level for some crops
    difficulty: 2
    hints:
    - At harvest, prices often fall.
    - The government sets a floor.
    solution: MSP is a guaranteed minimum price for certain crops, protecting farmers' income.
    mistakes:
      It makes rain come on time: c7ss13_help
      It gives free land: c7ss13_help
