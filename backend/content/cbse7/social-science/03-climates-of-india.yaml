# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 3. Format: content/README.md.
subject: cbse7-ss
chapter: 3
title: Climates of India
tips:
  c7ss_climate_factor: 'Altitude: the higher you go, the cooler it gets, even at the same latitude.'
  c7ss_monsoon: "The south-west monsoon (June–September) waters most of India. One south-eastern coastal state gets its main rain later, from the north-east winds."
  s7_climate_change: "A warmer world melts ice and makes weather more extreme."
  s7_count_months: "Count June, July, August, September."
  s7_cyclone: "Mangroves protect coasts. What helps people get ready in time?"
  s7_kerala_rain: "Jaisalmer, Bikaner and Ladakh are dry. Which place faces the monsoon winds first?"
  s7_ladakh: "Ladakh is high in the mountains and in a rain shadow. Is it hot or cold? Wet or dry?"
  s7_monsoon_meaning: "The word comes from Arabic for 'season'. What changes with the season?"
  s7_monsoon_onset: "The monsoon arrives at the start of summer rains, not in winter or autumn."
  s7_sea_mild: "The sea heats and cools slowly. Which city is next to it?"
  s7_tropic_cancer: "The Equator passes far south of India, below Sri Lanka. Which line crosses the middle of India?"
  s7_tropical_monsoon: "India's rain comes with seasonal winds, in a warm (tropical) belt."
  c7ss3_factors: 'Four things shape a place''s climate: how far it is from the equator, how high it is, how far it is from the sea, and the winds and mountains around it.'
  c7ss3_height: Air temperature changes as you climb a mountain, whatever the latitude. Think about which way it goes.
  c7ss3_sea: Water warms and cools slowly, so places by the sea have gentle temperatures; places far inland swing between very hot and very cold.
  c7ss3_winds: The word for India's rainy season comes from an Arabic word for 'season', because the winds change direction with the seasons.
  c7ss3_two_monsoons: One set of winds blows from the south-west in summer; another blows from the north-east in early winter. Each wets a different coast most.
  c7ss3_count: Count the months from the first to the last, including both ends.
  c7ss3_care: Burning fuels and cutting forests add heat-trapping gases. Ask which choice reduces them or prepares people for extreme weather.
concepts:
- code: cbse7ss.clim.factors
  title: Climates of India and what shapes them
  notes: |
    India has many climates: cold mountain climate (Ladakh, very cold and dry), hot desert (Rajasthan), tropical
    wet (Kerala, the north-east, heavy rain), and moderate coastal climate (Mumbai). Factors: latitude (the Tropic
    of Cancer crosses the middle of India; places nearer the equator are warmer), altitude (higher is cooler: Shimla
    vs Delhi), distance from the sea (coasts have mild, moderate climate; inland places like Delhi have extremes),
    and winds and mountains. India's climate is called tropical monsoon.
  explanations:
    text: 'India has very different climates: freezing Ladakh, hot dry Rajasthan, rainy Kerala and mild coastal Mumbai. Four things shape them: how far from the equator, how high up, how close to the sea, and the winds.'
    visual: Draw India with the Tropic of Cancer across the middle. Mark Ladakh (snowflake), Rajasthan (sun), Kerala (rain cloud) and Mumbai (mild), with arrows for the monsoon winds from the south-west.
    step_by_step: 'Step 1: Check latitude: nearer the equator is warmer. Step 2: Check altitude: higher is cooler. Step 3: Check distance from the sea: coasts are milder. Step 4: Check winds: monsoon winds bring rain.'
    real_world: Shimla and Delhi are at similar latitudes, but Shimla is much cooler in summer because it is about 2,200 m higher.
  picture:
    kind: compare
    columns:
    - title: Factor
      points:
      - Latitude
      - Altitude
      - Distance from sea
      - Winds
    - title: Effect
      points:
      - 'Nearer the equator: warmer'
      - 'Higher: cooler'
      - 'Near the sea: milder'
      - 'Monsoon winds: rain'
    alt: 'Factors that shape climate and their effects: latitude, altitude, distance from the sea and winds.'
  activity:
    type: sort
    prompt: Which factor makes the difference?
    bins:
    - Altitude
    - Distance from the sea
    - Latitude
    items:
    - label: Shimla is cooler than Delhi
      bin: Altitude
      clue: Shimla is high in the hills.
      why: Higher places are cooler.
    - label: Mumbai has mild weather; Delhi has extremes
      bin: Distance from the sea
      clue: One is on the coast.
      why: The sea keeps coasts moderate.
    - label: Kerala is warmer than Kashmir
      bin: Latitude
      clue: Nearer the Equator.
      why: Latitude.
    - label: Ooty is cool though it is in the south
      bin: Altitude
      clue: In the Nilgiris.
      why: Altitude.
    - label: Chennai is milder than Nagpur in summer
      bin: Distance from the sea
      clue: Coast vs inland.
      why: Distance from the sea.
  lesson:
    - teach: India has many climates. Ladakh is very cold and dry; Rajasthan is a hot desert; Kerala and the north-east are hot and very wet; Mumbai on the coast is warm and mild. India's overall climate is called tropical monsoon.
      picture:
        kind: compare
        columns:
        - title: Place
          points:
          - Ladakh
          - Rajasthan
          - Kerala
          - Mumbai
        - title: Climate
          points:
          - cold, dry
          - hot desert
          - hot, very wet
          - warm, mild coastal
        alt: Different climates across India.
      check:
        prompt: Which place has a cold, dry climate?
        options:
        - Ladakh
        - Kerala
        - Mumbai
        answer: Ladakh
        why: It is high in the mountains with little rain.
    - teach: 'Latitude matters: places nearer the equator get more direct sunlight and are warmer. The Tropic of Cancer (23.5° N) passes through the middle of India. Altitude matters too: the air cools as you go up, so Shimla and Ooty are cooler than the plains below them.'
      picture:
        kind: compare
        columns:
        - title: Delhi (about 200 m)
          points:
          - very hot summers
        - title: Shimla (about 2,200 m)
          points:
          - cool summers
        alt: Higher places like Shimla are cooler than low places like Delhi.
      check:
        prompt: Why is Ooty cooler than Chennai?
        options:
        - It is much higher above sea level
        - It is nearer the equator
        - It is next to the sea
        answer: It is much higher above sea level
        why: Air is cooler at higher altitude.
    - teach: 'Distance from the sea matters. The sea warms and cools slowly, so coastal places like Mumbai have mild, moderate temperatures. Inland places like Delhi have extremes: very hot summers and cold winters. Winds and mountains also shape climate, deciding where rain falls.'
      check:
        prompt: Why does Delhi have hotter summers and colder winters than Mumbai?
        options:
        - Delhi is far from the sea
        - Delhi is higher than Shimla
        - Delhi is on the equator
        answer: Delhi is far from the sea
        why: Inland places have extreme temperatures.
  items:
  - prompt: Why is Shimla cooler than Delhi in summer?
    options:
    - It is at a higher altitude
    - It is nearer the equator
    - It is by the sea
    - It has more people
    answer: It is at a higher altitude
    difficulty: 1
    hints:
    - Hill station.
    - Higher is cooler.
    solution: Temperature falls with height, so Shimla is cooler.
    mistakes:
      It is nearer the equator: c7ss_climate_factor
  - prompt: Which line of latitude passes through the middle of India?
    options:
    - Tropic of Cancer
    - Equator
    - Tropic of Capricorn
    - Arctic Circle
    answer: Tropic of Cancer
    difficulty: 1
    hints:
    - 23.5° N.
    - Through Gujarat to Mizoram.
    solution: The Tropic of Cancer crosses India.
    mistakes: {"Equator": "s7_tropic_cancer"}
  - prompt: Why does Mumbai have a milder climate than Delhi?
    options:
    - It is near the sea
    - It is higher
    - It is in the desert
    - It is near the Himalayas
    answer: It is near the sea
    difficulty: 2
    hints:
    - Sea moderates temperature.
    - Inland places have extremes.
    solution: The sea keeps coastal places from getting very hot or cold.
    mistakes: {"It is higher": "s7_sea_mild"}
  - prompt: 'Ladakh''s climate is best described as:'
    options:
    - Very cold and dry
    - Hot and wet
    - Hot and dry
    - Mild coastal
    answer: Very cold and dry
    difficulty: 1
    hints:
    - High in the mountains.
    - Little rain.
    solution: Ladakh is a cold desert.
    mistakes: {"Hot and dry": "s7_ladakh"}
  - prompt: 'India''s climate type is called:'
    options:
    - Tropical monsoon
    - Polar
    - Mediterranean
    - Equatorial
    answer: Tropical monsoon
    difficulty: 2
    hints:
    - Seasonal winds.
    - Tropics.
    solution: India has a tropical monsoon climate.
    mistakes: {"Equatorial": "s7_tropical_monsoon"}
  - prompt: Which place gets very heavy rainfall?
    options:
    - Kerala
    - Ladakh
    - Jaisalmer
    - Bikaner
    answer: Kerala
    difficulty: 1
    hints:
    - South-west coast.
    - First to get the monsoon.
    solution: Kerala receives heavy monsoon rain.
    mistakes: {"Jaisalmer": "s7_kerala_rain"}
  - prompt: Which name describes the climate of most of India?
    options:
    - Tropical monsoon
    - Polar
    - Mediterranean
    answer: Tropical monsoon
    difficulty: 1
    hints:
    - Much of India lies in the tropics.
    - Its rain comes with seasonal winds.
    solution: 'India''s climate is tropical monsoon: warm, with rain brought by seasonal winds.'
    mistakes:
      Polar: c7ss3_factors
      Mediterranean: c7ss3_factors
  - prompt: Which important line of latitude crosses Gujarat, Madhya Pradesh and West Bengal?
    options:
    - Tropic of Cancer
    - Equator
    - Arctic Circle
    answer: Tropic of Cancer
    difficulty: 1
    hints:
    - It is at 23.5° north.
    - It crosses states like Gujarat, Madhya Pradesh and West Bengal.
    solution: The Tropic of Cancer (23.5° N) runs across the middle of India.
    mistakes:
      Equator: c7ss3_factors
      Arctic Circle: c7ss3_factors
  - prompt: 'Kerala''s climate is best described as:'
    options:
    - Hot and very wet
    - Cold and dry
    - A hot sandy desert
    answer: Hot and very wet
    difficulty: 1
    hints:
    - Kerala gets the monsoon first.
    - It is near the equator and the sea.
    solution: Kerala is warm all year and gets heavy monsoon rain.
    mistakes:
      Cold and dry: c7ss3_factors
      A hot sandy desert: c7ss3_factors
  - prompt: 'As you climb a mountain, the air usually becomes:'
    options:
    - Cooler
    - Hotter
    - Wetter every time
    answer: Cooler
    difficulty: 1
    hints:
    - Think of snowy peaks.
    - Hill stations are pleasant in summer.
    solution: Temperature falls with height, so air gets cooler as you climb.
    mistakes:
      Hotter: c7ss3_height
      Wetter every time: c7ss3_height
  - prompt: Which place is likely to have the smallest difference between summer and winter temperatures?
    options:
    - Chennai, on the coast
    - Delhi, inland
    - Jaipur, in the desert
    answer: Chennai, on the coast
    difficulty: 2
    hints:
    - Which place is beside the sea?
    - The sea keeps temperatures gentle.
    solution: Coastal Chennai has a moderate climate; inland Delhi and Jaipur have extremes.
    mistakes:
      Delhi, inland: c7ss3_sea
      Jaipur, in the desert: c7ss3_sea
  - prompt: Why are hill stations like Darjeeling popular in summer?
    options:
    - They are cool because they are high up
    - They are near the equator
    - They are very hot and dry
    answer: They are cool because they are high up
    difficulty: 2
    hints:
    - What happens to temperature with height?
    - People escape the heat.
    solution: High altitude keeps hill stations cool when the plains are very hot.
    mistakes:
      They are near the equator: c7ss3_height
      They are very hot and dry: c7ss3_height
  - prompt: Places in south India are generally warmer in winter than places in north India. Which factor explains this?
    options:
    - 'Latitude: the south is nearer the equator'
    - 'Altitude: the south is higher'
    - The south has no sea
    answer: 'Latitude: the south is nearer the equator'
    difficulty: 2
    hints:
    - Where is the equator?
    - Nearer it, the Sun's rays are more direct.
    solution: South India is closer to the equator, so it gets more direct sunlight and stays warmer.
    mistakes:
      'Altitude: the south is higher': c7ss3_height
      The south has no sea: c7ss3_sea
  - prompt: Leh and Kochi are both in India. Which two factors best explain why Leh is so much colder?
    options:
    - It is far higher and far from the sea
    - It is nearer the equator and by the sea
    - It gets more monsoon rain
    answer: It is far higher and far from the sea
    difficulty: 3
    hints:
    - Leh is high in the mountains.
    - Kochi is at sea level on the coast.
    solution: Leh's great altitude and inland position make it very cold; Kochi is low and coastal.
    mistakes:
      It is nearer the equator and by the sea: c7ss3_factors
      It gets more monsoon rain: c7ss3_factors
  - prompt: Why does the Western Ghats' western side get much more rain than its eastern side?
    options:
    - Moist monsoon winds rise up the western slopes and drop their rain there
    - The eastern side is nearer the sea
    - The sun shines only on the east
    answer: Moist monsoon winds rise up the western slopes and drop their rain there
    difficulty: 3
    hints:
    - The monsoon comes from the south-west sea.
    - What happens to moist air forced up a mountain?
    solution: Moist winds hit the western slopes first, rise, cool and rain; little moisture is left for the east.
    mistakes:
      The eastern side is nearer the sea: c7ss3_factors
      The sun shines only on the east: c7ss3_factors
- code: cbse7ss.clim.monsoon
  title: The monsoon, disasters and climate change
  after:
  - cbse7ss.clim.factors
  notes: |
    Monsoon means seasonal reversal of winds. The south-west monsoon (June–September) brings most of India's rain,
    reaching Kerala around 1 June. The north-east (retreating) monsoon (October–December) brings rain to Tamil Nadu.
    Seasons: winter, summer, monsoon, retreating monsoon. Too much or too little rain causes floods or droughts;
    cyclones hit the coasts. Climate change (rising temperatures from burning fossil fuels and cutting forests) is
    making extreme weather, glacier melting and sea-level rise more common. Preparedness, early warnings and tree
    planting help.
  explanations:
    text: The monsoon is a seasonal wind that brings most of India's rain from June to September. Farming depends on it. Too much rain brings floods, too little brings drought, and climate change is making such extremes more common.
    visual: Draw arrows from the Arabian Sea and Bay of Bengal sweeping over India in June (south-west monsoon), and reversed arrows over Tamil Nadu in November (north-east monsoon).
    step_by_step: 'Step 1: South-west monsoon: June–September, most of India''s rain. Step 2: Retreating (north-east) monsoon: October–December, rain in Tamil Nadu. Step 3: Link rain to farming, floods and droughts. Step 4: Explain how climate change increases extremes.'
    real_world: The arrival of the monsoon in Kerala, around 1 June, is news across India because farmers everywhere wait for it.
  picture:
    kind: flow
    steps:
    - 'June: south-west monsoon reaches Kerala'
    - 'July–August: rain over most of India'
    - 'September: monsoon withdraws'
    - 'October–December: north-east monsoon rains in Tamil Nadu'
    - Winter and then summer
    alt: 'The monsoon year: the south-west monsoon from June to September, then the north-east monsoon over Tamil Nadu from October to December.'
  activity:
    type: sort
    prompt: South-west or north-east monsoon?
    bins:
    - South-west monsoon
    - North-east (retreating) monsoon
    items:
    - label: Reaches Kerala around 1 June
      bin: South-west monsoon
      clue: Start of the rains.
      why: South-west.
    - label: Brings most of India's rain, June–September
      bin: South-west monsoon
      clue: Main rainy season.
      why: South-west.
    - label: Brings rain to Tamil Nadu, October–December
      bin: North-east (retreating) monsoon
      clue: Later in the year.
      why: North-east.
    - label: Winds blowing from land to sea as it retreats
      bin: North-east (retreating) monsoon
      clue: Reverse direction.
      why: North-east.
  lesson:
    - teach: 'Monsoon means a seasonal reversal of winds. In summer, moist winds blow from the south-west over the sea onto the land: the south-west monsoon, from June to September, brings most of India''s rain. It reaches Kerala around 1 June and spreads north.'
      picture:
        kind: flow
        steps:
        - Land heats up in summer
        - Moist sea winds blow in from the south-west
        - Reach Kerala around 1 June
        - Spread across India by July
        - Retreat from October
        alt: The journey of the south-west monsoon.
      check:
        prompt: 'The south-west monsoon usually reaches Kerala around:'
        options:
        - 1 June
        - 1 January
        - 1 October
        answer: 1 June
        why: Kerala is the first state it reaches.
    - teach: 'From October to December the winds reverse and blow from the north-east: the retreating, or north-east, monsoon. It brings much of Tamil Nadu''s rain. India''s seasons are winter, summer, the monsoon and the retreating monsoon.'
      picture:
        kind: compare
        columns:
        - title: South-west monsoon
          points:
          - June to September
          - most of India's rain
          - first reaches Kerala
        - title: North-east monsoon
          points:
          - October to December
          - rain for Tamil Nadu
        alt: The two monsoons compared.
      check:
        prompt: Which state gets much of its rain from the north-east monsoon?
        options:
        - Tamil Nadu
        - Rajasthan
        - Punjab
        answer: Tamil Nadu
        why: The north-east winds pick up moisture over the Bay of Bengal.
    - teach: Too much rain brings floods; too little brings drought. Cyclones strike the coasts, especially the east coast. Climate change, caused by burning fossil fuels and cutting forests, is making extreme weather more common, melting glaciers and raising sea levels. Early warnings, cyclone shelters, saving water and planting trees all help.
      check:
        prompt: Which action helps reduce climate change?
        options:
        - Planting trees and using less fossil fuel
        - Burning more coal
        - Cutting forests
        answer: Planting trees and using less fossil fuel
        why: Trees absorb carbon dioxide; less fuel burnt means fewer heat-trapping gases.
  items:
  - prompt: When does the south-west monsoon usually reach Kerala?
    options:
    - Around 1 June
    - Around 1 January
    - Around 15 October
    - Around 1 March
    answer: Around 1 June
    difficulty: 1
    hints:
    - Start of summer rains.
    - Early June.
    solution: It usually arrives around 1 June.
    mistakes: {"Around 15 October": "s7_monsoon_onset"}
  - prompt: Which state gets much of its rain from the north-east monsoon?
    options:
    - Tamil Nadu
    - Rajasthan
    - Punjab
    - Gujarat
    answer: Tamil Nadu
    difficulty: 2
    hints:
    - October–December.
    - South-east coast.
    solution: Tamil Nadu gets rain from the retreating north-east monsoon.
    mistakes:
      Rajasthan: c7ss_monsoon
  - prompt: '''Monsoon'' means:'
    options:
    - A seasonal reversal of winds
    - A kind of rain cloud
    - A desert storm
    - A snowfall
    answer: A seasonal reversal of winds
    difficulty: 2
    hints:
    - From the Arabic 'mausim', season.
    - Winds change direction.
    solution: Monsoon means winds that reverse with the seasons.
    mistakes: {"A kind of rain cloud": "s7_monsoon_meaning"}
  - prompt: The south-west monsoon lasts from June to September. How many months is that?
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - June, July, August, September.
    - Count them.
    solution: 4 months.
    mistakes: {"3": "s7_count_months", "9": "s7_count_months"}
  - prompt: Which is a result of climate change?
    options:
    - More extreme weather and melting glaciers
    - Fewer storms everywhere
    - Cooler summers everywhere
    - No change in sea level
    answer: More extreme weather and melting glaciers
    difficulty: 2
    hints:
    - Rising temperatures.
    - Glaciers and seas.
    solution: Warming increases extremes, melts glaciers and raises sea levels.
    mistakes: {"Cooler summers everywhere": "s7_climate_change"}
  - prompt: What helps reduce harm from cyclones?
    options:
    - Early warnings and shelters
    - Ignoring forecasts
    - Cutting mangroves
    - Building on beaches
    answer: Early warnings and shelters
    difficulty: 1
    hints:
    - Odisha's success.
    - Evacuation.
    solution: Early warnings and cyclone shelters save lives.
    mistakes: {"Cutting mangroves": "s7_cyclone"}
  - prompt: 'The word ''monsoon'' means:'
    options:
    - A seasonal reversal of winds
    - A very cold wind
    - A desert storm
    answer: A seasonal reversal of winds
    difficulty: 1
    hints:
    - It comes from an Arabic word for season.
    - The wind changes direction with the season.
    solution: Monsoon means winds that reverse direction with the seasons.
    mistakes:
      A very cold wind: c7ss3_winds
      A desert storm: c7ss3_winds
  - prompt: Which months bring the south-west monsoon?
    options:
    - June to September
    - December to February
    - March to May
    answer: June to September
    difficulty: 1
    hints:
    - It is the main rainy season.
    - It starts around 1 June.
    solution: The south-west monsoon lasts from June to September.
    mistakes:
      December to February: c7ss3_two_monsoons
      March to May: c7ss3_two_monsoons
  - prompt: 'A long period with too little rain is called a:'
    options:
    - Drought
    - Flood
    - Cyclone
    answer: Drought
    difficulty: 1
    hints:
    - Crops dry up.
    - The opposite problem to a flood.
    solution: A drought is a long dry period with too little rain.
    mistakes:
      Flood: c7ss3_care
      Cyclone: c7ss3_care
  - prompt: Which coast of India is hit by cyclones most often?
    options:
    - The east coast
    - The west coast
    - Neither, India never has cyclones
    answer: The east coast
    difficulty: 2
    hints:
    - Many cyclones form over the Bay of Bengal.
    - Odisha and Andhra Pradesh.
    solution: Most cyclones form over the Bay of Bengal and strike the east coast.
    mistakes:
      The west coast: c7ss3_two_monsoons
      Neither, India never has cyclones: c7ss3_care
  - prompt: The north-east monsoon lasts from October to December. How many months is that?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - October, November, December.
    - Count them.
    solution: October, November and December make 3 months.
    mistakes:
      '2': c7ss3_count
      '4': c7ss3_count
  - prompt: Which is a sign of climate change?
    options:
    - Himalayan glaciers melting faster
    - Day and night changing
    - The Moon's phases
    answer: Himalayan glaciers melting faster
    difficulty: 2
    hints:
    - Climate change means warming.
    - What melts when it warms?
    solution: Warming temperatures are making glaciers shrink faster.
    mistakes:
      Day and night changing: c7ss3_care
      The Moon's phases: c7ss3_care
  - prompt: Why do the monsoon winds bring rain to India in summer?
    options:
    - They blow from the sea and carry lots of moisture
    - They come from the dry desert
    - They blow from cold mountains
    answer: They blow from the sea and carry lots of moisture
    difficulty: 2
    hints:
    - Where do the summer winds come from?
    - What do they pick up over water?
    solution: Summer monsoon winds cross the warm ocean, pick up moisture and drop it as rain over land.
    mistakes:
      They come from the dry desert: c7ss3_two_monsoons
      They blow from cold mountains: c7ss3_two_monsoons
  - prompt: How do cyclone early warnings save lives?
    options:
    - People can move to shelters before the storm hits
    - They stop the cyclone
    - They make the wind weaker
    answer: People can move to shelters before the storm hits
    difficulty: 3
    hints:
    - A warning gives time.
    - What can people do with that time?
    solution: Warnings let families, fishermen and officials prepare and move to safety in time.
    mistakes:
      They stop the cyclone: c7ss3_care
      They make the wind weaker: c7ss3_care
  - prompt: Why does rising sea level worry people in places like the Sundarbans and Lakshadweep?
    options:
    - Low-lying land may be flooded or lost
    - The sea will freeze
    - Fish will stop living in the sea
    answer: Low-lying land may be flooded or lost
    difficulty: 3
    hints:
    - These places are very close to sea level.
    - What happens if the sea rises?
    solution: Low islands and deltas can be flooded and eroded as the sea rises.
    mistakes:
      The sea will freeze: c7ss3_care
      Fish will stop living in the sea: c7ss3_care
