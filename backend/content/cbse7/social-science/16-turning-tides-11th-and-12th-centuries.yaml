    answer: They held great wealth in gold and jewels
    difficulty: 2
    hints:
    - Kings and devotees gave gifts.
    - Raiders wanted treasure.
    solution: Temples stored gifts of gold, jewels and money, which raiders wanted.
    mistakes:
      They were empty: c7ss16_raid
      They were forts: c7ss16_raid
  - prompt: Where is the Brihadeeswara temple?
    options:
    - Thanjavur
    - Khajuraho
    - Somnath
    answer: Thanjavur
    difficulty: 1
    hints:
    - It is in Tamil Nadu.
    - It was the Chola capital.
    solution: Rajaraja I built the Brihadeeswara temple at Thanjavur.
    mistakes:
      Khajuraho: c7ss16_temple
      Somnath: c7ss16_raid
  - prompt: What did Rajendra I's navy show about Chola power?
    options:
    - They could act far across the sea
    - They had no ships
    - They feared the sea
    answer: They could act far across the sea
    difficulty: 2
    hints:
    - Srivijaya was in Southeast Asia.
    - Ships crossed the Bay of Bengal.
    solution: The naval expedition showed the Cholas' reach across the Bay of Bengal.
    mistakes:
      They had no ships: c7ss16_navy
      They feared the sea: c7ss16_navy
  - prompt: Somnath was raided in 1025. How many years before the second battle of Tarain (1192)?
    answer: '167'
    check: 1192-1025
    difficulty: 2
    hints:
    - Both years are CE.
    - Subtract the earlier from the later.
    solution: 'Step 1: 1192 - 1025. Step 2: = 167 years.'
    mistakes:
      '2217': c7ss16_year
      '67': c7ss16_year
  - prompt: Raja Bhoja belonged to which dynasty?
    options:
    - Paramaras
    - Cholas
    - Palas
    answer: Paramaras
    difficulty: 2
    hints:
    - He ruled Malwa in central India.
    - He was a scholar-king.
    solution: Raja Bhoja was a Paramara king of Malwa.
    mistakes:
      Cholas: c7ss16_who
      Palas: c7ss16_who
  - prompt: Which of these was a Rajput dynasty?
    options:
    - Chauhans
    - Cholas
