concepts:
- code: cbse7ss.tides.powers
  title: Invasions and new powers in the 11th and 12th centuries
  notes: |
    In the early 11th century Mahmud of Ghazni (from Afghanistan) raided north India many times (about 17), looting
    wealthy temples such as Somnath (1025). In the south, the Cholas grew mighty: Rajaraja I built the Brihadeeswara
    temple at Thanjavur; his son Rajendra I sent armies to the Ganga and a navy to Southeast Asia (Srivijaya).
    Rajput dynasties (Chauhans, Paramaras, Chandelas) ruled in the north; Raja Bhoja of the Paramaras was a famous
    scholar-king. In 1191 Prithviraj Chauhan defeated Muhammad Ghori at Tarain, but lost in 1192, opening the way
    for the Delhi Sultanate.
  explanations:
    text: In the 11th–12th centuries, raiders from the north-west like Mahmud of Ghazni attacked temples, while in the south the Cholas built a great empire with a strong navy. In 1192 Muhammad Ghori defeated Prithviraj Chauhan, leading to the Delhi Sultanate.
    visual: 'Draw a map: arrows from Afghanistan into north India (Ghazni, Ghori); a crown on Thanjavur in the south with ships sailing to Southeast Asia (Cholas); a battlefield marked Tarain near Delhi.'
    step_by_step: 'Step 1: Raids from the north-west (Mahmud of Ghazni). Step 2: The Chola empire and its navy. Step 3: Rajput kingdoms. Step 4: The battles of Tarain (1191, 1192).'
    real_world: The Brihadeeswara temple at Thanjavur, built by Rajaraja Chola about 1,000 years ago, is still a living temple and a UNESCO site.
  picture:
    kind: flow
    steps:
    - 'Early 1000s: Mahmud of Ghazni''s raids'
    - '1025: Somnath temple looted'
    - 'Cholas: Rajaraja I and Rajendra I'
    - '1191: Prithviraj wins at Tarain'
    - '1192: Ghori wins; Delhi Sultanate follows'
    alt: 'Events of the 11th and 12th centuries: Mahmud of Ghazni''s raids, the Chola empire, and the two battles of Tarain.'
  activity:
    type: order
    prompt: Put the events in order.
    steps:
    - Rajaraja I builds the Thanjavur temple (about 1010)
    - Mahmud of Ghazni raids Somnath (1025)
    - Prithviraj Chauhan defeats Ghori at Tarain (1191)
    - Ghori wins the second battle of Tarain (1192)
    reasons:
      Mahmud of Ghazni raids Somnath (1025): The Somnath raid came fifteen years later.
      Prithviraj Chauhan defeats Ghori at Tarain (1191): Tarain came over 150 years after Somnath.
      Ghori wins the second battle of Tarain (1192): The second battle came a year after the first.
  lesson:
    - teach: In the early 11th century, Mahmud of Ghazni (in Afghanistan) raided north India about 17 times. He did not stay to rule; he looted wealth, including the Somnath temple in Gujarat in 1025, and carried it back to Ghazni.
      check:
        prompt: What was Mahmud of Ghazni's main aim in India?
        options:
        - To loot wealth and return home
        - To build schools
        - To settle and farm
        answer: To loot wealth and return home
        why: His raids were for treasure, not to rule India.
    - teach: In the south, the Cholas became very powerful. Rajaraja I built the huge Brihadeeswara temple at Thanjavur. His son Rajendra I marched to the Ganga and sent a navy across the Bay of Bengal to Srivijaya in Southeast Asia.
      picture:
        kind: flow
        steps:
        - 'Rajaraja I: Brihadeeswara temple, Thanjavur'
        - 'Rajendra I: army to the Ganga'
        - 'Rajendra I: navy to Srivijaya (Southeast Asia)'
        alt: Achievements of the two great Chola kings.
      check:
        prompt: Which Chola king sent an army to the Ganga?
        options:
        - Rajendra I
        - Rajaraja I
        - Prithviraj Chauhan
        answer: Rajendra I
        why: Rajendra I marched north to the Ganga.
    - teach: 'In the north, Rajput dynasties ruled: the Chauhans (Delhi-Ajmer), Paramaras (Malwa, with the scholar-king Raja Bhoja) and Chandelas. Prithviraj Chauhan defeated Muhammad Ghori at Tarain in 1191, but lost the next battle in 1192. This opened the way for the Delhi Sultanate.'
      picture:
        kind: compare
        columns:
        - title: Tarain 1191
          points:
          - Prithviraj wins
          - Ghori retreats
        - title: Tarain 1192
          points:
          - Ghori wins
          - way opens to Delhi
        alt: The two battles of Tarain.
      check:
        prompt: Who won the second battle of Tarain?
        options:
        - Muhammad Ghori
        - Prithviraj Chauhan
        - Rajendra I
        answer: Muhammad Ghori
        why: Ghori returned and won in 1192.
  items:
  - prompt: Which famous temple did Mahmud of Ghazni loot in 1025?
    options:
    - Somnath
    - Brihadeeswara
    - Konark
    - Meenakshi
    answer: Somnath
    difficulty: 1
    hints:
    - In Gujarat.
    - Very wealthy temple.
    solution: He looted the Somnath temple.
    mistakes: {"Konark": "s7_somnath"}
  - prompt: Who built the Brihadeeswara temple at Thanjavur?
    options:
    - Rajaraja I (Chola)
    - Mahmud of Ghazni
    - Prithviraj Chauhan
    - Harsha
    answer: Rajaraja I (Chola)
    difficulty: 1
    hints:
    - Chola king.
    - About 1010 CE.
    solution: Rajaraja I built it.
    mistakes:
      Prithviraj Chauhan: c7ss_ruler_chola
  - prompt: Which Chola king sent a navy to Southeast Asia?
    options:
    - Rajendra I
    - Rajaraja I
    - Pulakeshin II
    - Harsha
    answer: Rajendra I
    difficulty: 2
    hints:
    - Rajaraja's son.
    - Also reached the Ganga.
    solution: Rajendra I's navy attacked Srivijaya.
    mistakes: {"Rajaraja I": "s7_rajendra"}
  - prompt: Prithviraj Chauhan won the first battle of Tarain in 1191 and lost the second. In which year was the second battle?
    answer: '1192'
    check: 1191 + 1
    difficulty: 1
    hints:
    - One year later.
    - 1191 + 1.
    solution: The second battle was in 1192.
    mistakes: {"1191": "s7_tarain2", "1200": "s7_tarain2"}
  - prompt: 'Raja Bhoja of the Paramaras is remembered as a:'
    options:
    - Scholar and patron of learning
    - Sea captain
    - Foreign invader
    - Mughal emperor
    answer: Scholar and patron of learning
    difficulty: 2
    hints:
    - Wrote many books.
    - Dhar in Malwa.
    solution: Raja Bhoja was a learned king.
    mistakes: {"Foreign invader": "s7_bhoja"}
  - prompt: 'Mahmud came from:'
    options:
    - Ghazni in Afghanistan
    - Thanjavur
    - Kannauj
    - Sri Lanka
    answer: Ghazni in Afghanistan
    difficulty: 1
    hints:
    - Mahmud of Ghazni.
    - North-west.
    solution: He ruled from Ghazni in Afghanistan.
    mistakes: {"Kannauj": "s7_ghazni"}
  - prompt: Somnath temple, raided in 1025, is in which present-day state?
    options:
    - Gujarat
    - Tamil Nadu
    - Bihar
    answer: Gujarat
    difficulty: 2
    hints:
    - It is on the west coast.
    - It is in the Saurashtra region.
    solution: Somnath is on the coast of Gujarat.
    mistakes:
      Tamil Nadu: c7ss16_raid
      Bihar: c7ss16_raid
  - prompt: Why were temples targets for raiders like Mahmud?
    options:
    - They held great wealth in gold and jewels
