    solution: Srivijaya was a kingdom based in Sumatra in Southeast Asia.
    mistakes:
      Afghanistan: c7ss16_navy
      Rajasthan: c7ss16_navy
- code: cbse7ss.tides.culture
  title: Culture, reformers and links with Southeast Asia
  after:
  - cbse7ss.tides.powers
  notes: |
    Despite invasions, culture flourished. Temple building peaked: Khajuraho (Chandelas), Lingaraja (Bhubaneswar),
    the Chola temples. Bronze sculpture, especially the Chola Nataraja, reached great heights. Ramanuja taught
    devotion to Vishnu (Vishishtadvaita); Basavanna in Karnataka founded the Lingayat (Virashaiva) movement,
    rejecting caste and teaching that 'work is worship' through vachanas in Kannada. Kalhana wrote the
    Rajatarangini, a history of Kashmir. The Cholas traded widely; Indian culture influenced Southeast Asia (Angkor
    Wat in Cambodia, Borobudur in Java).
  explanations:
    text: 'Even in troubled times, art and ideas flourished: grand temples at Khajuraho and Thanjavur, beautiful Chola bronzes of Nataraja, reformers like Ramanuja and Basavanna, and Kalhana''s history of Kashmir. Indian culture also spread to Southeast Asia.'
    visual: 'Picture a Chola bronze Nataraja: Shiva dancing inside a ring of flames, one foot raised, cast in metal about a thousand years ago.'
    step_by_step: 'Step 1: Art: temples and bronzes. Step 2: Reformers: Ramanuja, Basavanna. Step 3: History writing: Kalhana. Step 4: Links abroad: trade and temples in Southeast Asia.'
    real_world: The Nataraja statue outside CERN, the physics laboratory in Switzerland, is based on Chola bronzes.
  picture:
    kind: compare
    columns:
    - title: Art and writing
      points:
      - Khajuraho temples
      - Chola bronzes (Nataraja)
      - Kalhana's Rajatarangini
    - title: Reformers
      points:
      - 'Ramanuja: devotion to Vishnu'
      - 'Basavanna: against caste, ''work is worship'''
      - Vachanas in Kannada
    alt: 'Culture of the 11th and 12th centuries: temples, Chola bronzes and Kalhana''s history, and reformers Ramanuja and Basavanna.'
  activity:
    type: sort
    prompt: Who or what?
    bins:
    - Basavanna
    - Ramanuja
    - Kalhana
    - Chola bronzes
    items:
    - label: '''Work is worship'', vachanas in Kannada'
      bin: Basavanna
      clue: Lingayat movement.
      why: Basavanna.
    - label: Devotion to Vishnu (Vishishtadvaita)
      bin: Ramanuja
      clue: Philosopher.
      why: Ramanuja.
    - label: Rajatarangini, history of Kashmir
      bin: Kalhana
      clue: Historian.
      why: Kalhana.
    - label: Nataraja figures
      bin: Chola bronzes
      clue: Metal sculpture.
      why: Chola bronzes.
  lesson:
    - teach: Despite invasions, culture flourished. The Chandelas built the temples of Khajuraho, the Lingaraja temple rose in Bhubaneswar, and the Cholas built huge temples. Chola artists made beautiful bronze statues, especially Nataraja, the dancing Shiva.
      check:
        prompt: 'Chola bronze statues were made by:'
        options:
        - Pouring melted metal into moulds
        - Carving wood
        - Painting on cloth
        answer: Pouring melted metal into moulds
        why: Bronze is cast from melted metal (the lost-wax method).
    - teach: Reformers taught new paths. Ramanuja taught devotion to Vishnu. Basavanna in Karnataka founded the Lingayat (Virashaiva) movement, rejected caste and taught that 'work is worship', writing vachanas (sayings) in Kannada.
      picture:
        kind: compare
        columns:
        - title: Ramanuja
          points:
          - devotion to Vishnu
          - Tamil land
        - title: Basavanna
          points:
          - Lingayat movement
          - work is worship
          - vachanas in Kannada
        alt: Two reformers and what they taught.
      check:
        prompt: 'Basavanna''s sayings are called:'
        options:
        - Vachanas
        - Edicts
        - Jatakas
        answer: Vachanas
        why: Vachanas are short Kannada sayings.
    - teach: 'Kalhana wrote the Rajatarangini, a history of Kashmir in verse, using older records carefully. Indian culture influenced Southeast Asia: Angkor Wat in Cambodia and Borobudur, a giant Buddhist monument in Java.'
      check:
        prompt: 'Borobudur is a Buddhist monument in:'
        options:
        - Java, Indonesia
        - Kashmir
        - Gujarat
        answer: Java, Indonesia
        why: It shows Indian influence in Southeast Asia.
  items:
  - prompt: Which dynasty built the temples of Khajuraho?
    options:
    - Chandelas
    - Cholas
    - Palas
    - Pallavas
    answer: Chandelas
    difficulty: 2
    hints:
    - Rajput dynasty.
    - In Madhya Pradesh.
    solution: The Chandelas built Khajuraho.
    mistakes: {"Cholas": "s7_chandela"}
  - prompt: 'Chola artists are famous for bronze statues of:'
