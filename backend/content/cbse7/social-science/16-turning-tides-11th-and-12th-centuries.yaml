    answer: It opened the way for the Delhi Sultanate
    difficulty: 3
    hints:
    - Who won, and what came next in Delhi?
    - Think of the next chapter of history.
    solution: Ghori's victory led to his generals founding the Delhi Sultanate in 1206.
    mistakes:
      It ended the Cholas: c7ss16_year
      It began the Mauryan Empire: c7ss16_year
  - prompt: 'Srivijaya, reached by the Chola navy, was in:'
