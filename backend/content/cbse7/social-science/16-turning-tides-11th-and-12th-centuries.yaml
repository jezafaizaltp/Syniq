concepts:
- code: cbse7ss.tides.powers
  title: Invasions and new powers in the 11th and 12th centuries
  notes: |
    In the early 11th century Mahmud of Ghazni (from Afghanistan) raided north India many times (about 17), looting
    wealthy temples such as Somnath (1025). In the south, the Cholas grew mighty: Rajaraja I built the Brihadeeswara
    temple at Thanjavur; his son Rajendra I sent armies to the Ganga and a navy to Southeast Asia (Srivijaya).
    Rajput dynasties (Chauhans, Paramaras, Chandelas) ruled in the north; Raja Bhoja of the Paramaras was a famous
    scholar-king. In 1191 Prithviraj Chauhan defeated Muhammad Ghori at Tarain, but lost in 1192, opening the way
    for the Delhi Sultanate.
  explanations:
    text: In the 11th–12th centuries, raiders from the north-west like Mahmud of Ghazni attacked temples, while in the south the Cholas built a great empire with a strong navy. In 1192 Muhammad Ghori defeated Prithviraj Chauhan, leading to the Delhi Sultanate.
    visual: 'Draw a map: arrows from Afghanistan into north India (Ghazni, Ghori); a crown on Thanjavur in the south with ships sailing to Southeast Asia (Cholas); a battlefield marked Tarain near Delhi.'
    step_by_step: 'Step 1: Raids from the north-west (Mahmud of Ghazni). Step 2: The Chola empire and its navy. Step 3: Rajput kingdoms. Step 4: The battles of Tarain (1191, 1192).'
    real_world: The Brihadeeswara temple at Thanjavur, built by Rajaraja Chola about 1,000 years ago, is still a living temple and a UNESCO site.
  picture:
    kind: flow
    steps:
    - 'Early 1000s: Mahmud of Ghazni''s raids'
    - '1025: Somnath temple looted'
    - 'Cholas: Rajaraja I and Rajendra I'
    - '1191: Prithviraj wins at Tarain'
    - '1192: Ghori wins; Delhi Sultanate follows'
    alt: 'Events of the 11th and 12th centuries: Mahmud of Ghazni''s raids, the Chola empire, and the two battles of Tarain.'
  activity:
    type: order
    prompt: Put the events in order.
    steps:
    - Rajaraja I builds the Thanjavur temple (about 1010)
    - Mahmud of Ghazni raids Somnath (1025)
    - Prithviraj Chauhan defeats Ghori at Tarain (1191)
    - Ghori wins the second battle of Tarain (1192)
    reasons:
      Mahmud of Ghazni raids Somnath (1025): The Somnath raid came fifteen years later.
      Prithviraj Chauhan defeats Ghori at Tarain (1191): Tarain came over 150 years after Somnath.
      Ghori wins the second battle of Tarain (1192): The second battle came a year after the first.
