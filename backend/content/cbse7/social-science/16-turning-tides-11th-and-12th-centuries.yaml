    hints:
    - Prithviraj belonged to it.
    - Cholas were in the Tamil south.
    solution: The Chauhans, like the Paramaras and Chandelas, were Rajput dynasties.
    mistakes:
      Cholas: c7ss16_who
      Ghaznavids: c7ss16_who
  - prompt: Why was the second battle of Tarain a turning point?
    options:
