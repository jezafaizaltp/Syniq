    answer: Honest work is a way of serving God
    difficulty: 2
    hints:
    - Basavanna valued every kind of labour.
    - No job was lower than another.
    solution: Basavanna taught that doing one's work honestly is itself devotion.
    mistakes:
      Only priests can worship: c7ss16_reform
      Work is not needed: c7ss16_reform
  - prompt: Why did Basavanna's movement attract many ordinary people?
    options:
    - It rejected caste and used the people's language
    - It used only Sanskrit
    - It was only for kings
    answer: It rejected caste and used the people's language
    difficulty: 3
    hints:
    - Think of equality.
    - Kannada was spoken by local people.
    solution: Equality and simple Kannada sayings made the message reach everyone.
    mistakes:
      It used only Sanskrit: c7ss16_reform
      It was only for kings: c7ss16_reform
  - prompt: 'Nataraja shows Shiva as the:'
    options:
    - Lord of dance
    - Lord of the sea
    - God of war
    answer: Lord of dance
    difficulty: 1
    hints:
    - '''Nata'' relates to dance.'
    - He is shown in a ring of fire, dancing.
    solution: 'Nataraja means ''king of dancers'': Shiva''s cosmic dance.'
    mistakes:
