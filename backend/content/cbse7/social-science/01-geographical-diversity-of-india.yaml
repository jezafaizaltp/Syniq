# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 1. Format: content/README.md.
subject: cbse7-ss
chapter: 1
title: Geographical Diversity of India
tips:
  c7ss_read_again: 'Go back to the chapter: find the paragraph about that place, person or idea.'
  c7ss_islands: "Lakshadweep is low and flat, built up slowly by tiny sea animals in warm shallow water. What do those animals build?"
  s7_andaman: "The Andamans lie to the east of the Indian mainland. Which sea is on that side?"
  s7_black_soil: "Black soil holds moisture well. Which crop is it even named after?"
  s7_crowded_plains: "People settle where farming is easy. What do flat river plains give farmers?"
  s7_ganga_plains: "The Kaveri, Narmada and Godavari flow in the south and centre. Which river flows through Bihar and UP?"
  s7_ghats: "Himadri and Shivaliks are Himalayan ranges. Which ranges run along the two coasts of the peninsula?"
  s7_himalaya_plates: "The Himalayas are still rising a little each year. That comes from two huge pieces of the Earth's crust pressing together."
  s7_kangchenjunga: "Kangchenjunga is the third-highest peak in the world, on the Sikkim–Nepal border."
  s7_silt: "The plains are flat and soft. What did the rivers carry down from the mountains and leave there?"
  s7_sundarbans: "The Sundarbans is a delta where salt water meets fresh. Which trees grow in that mix?"
  s7_thar: "The Thar is a sandy desert in the north-west of India."
  c7ss1_regions: 'Picture India''s map from top to bottom: high snowy mountains, then wide flat river land, then a dry sandy west, an old rocky tableland in the south, long coasts, and islands in two seas.'
  c7ss1_rivers: Flat, fertile land along big rivers is built from fine mud that the rivers carry down from the mountains and leave behind.
  c7ss1_wall: 'Think of the northern mountains as a giant wall: what does a wall stop, and what does it hold back?'
  c7ss1_dry: In a place with very little rain, plants, animals, houses and jobs all adapt to save water and stay cool.
  c7ss1_rock: The southern tableland formed long before the northern mountains. Its rock breaks down into special soils and holds many minerals.
  c7ss1_seas: India has a sea to its west and a bay to its east. Match each island group to the water around it and to what built it.
concepts:
- code: cbse7ss.geo.north
  title: The Himalayas and the northern plains
  notes: |
    India's landforms are very diverse. The Himalayas in the north are young fold mountains (formed as the Indian
    plate pushed into the Eurasian plate), with ranges such as the Himadri (Great Himalaya, peaks like
    Kangchenjunga), Himachal and Shivaliks. They block cold winds from Central Asia, trap monsoon clouds and feed
    rivers with glacier melt. South of them, the Indo-Gangetic plains were built by silt from the Indus, Ganga
    and Brahmaputra: flat, fertile and densely populated. The north-east has forested hills (Garo, Khasi,
    Jaintia).
  explanations:
    text: In the north, the young, high Himalayas protect India from icy winds and feed great rivers with melting snow. Below them lie the flat, fertile plains made by river silt, where many people farm and live.
    visual: 'Draw a cross-section from north to south: tall jagged Himalayas, then a long flat green plain with the Ganga winding through it.'
    step_by_step: 'Step 1: Name the landform. Step 2: Say how it was formed (mountains by plates pushing; plains by river silt). Step 3: Say why it matters (climate, rivers, farming). Step 4: Link it to how people live.'
    real_world: Cities like Kanpur, Patna and Varanasi grew on the fertile Ganga plains, and hill towns like Shimla and Darjeeling in the Himalayas.
  picture:
    kind: compare
    columns:
    - title: Himalayas
      points:
      - Young fold mountains
      - Block cold winds
      - Glaciers feed rivers
      - Fewer people
    - title: Indo-Gangetic plains
      points:
      - Made of river silt
      - Flat and fertile
      - Good for farming
      - Densely populated
    alt: The Himalayas (young mountains that block cold winds and feed rivers) compared with the Indo-Gangetic plains (flat, fertile, densely populated).
  activity:
    type: sort
    prompt: What do the Himalayas or the northern plains do?
    bins:
    - Himalayas
    - Northern plains
    items:
    - label: Block cold winds from Central Asia
      bin: Himalayas
      clue: A tall wall.
      why: Himalayas.
    - label: Feed rivers with glacier melt
      bin: Himalayas
      clue: Snow and ice.
      why: Himalayas.
    - label: Flat, fertile land from river silt
      bin: Northern plains
      clue: Indus, Ganga, Brahmaputra.
      why: Plains.
    - label: Dense population and farming
      bin: Northern plains
      clue: Easy land to live on.
      why: Plains.
    - label: Trap monsoon clouds
      bin: Himalayas
      clue: Force air to rise.
      why: Himalayas.
  lesson:
    - teach: 'India''s land is very varied: snowy mountains, flat plains, a desert, a plateau, coasts and islands. In the north are the Himalayas, young fold mountains that formed when the Indian plate pushed into the Eurasian plate and the rocks crumpled upwards. They have three ranges: the Himadri (highest, with peaks like Kangchenjunga), the Himachal and the Shivaliks.'
      picture:
        kind: flow
        steps:
        - Indian plate moves north
        - It pushes into the Eurasian plate
        - Rock layers fold and rise
        - The Himalayas form (still rising)
        alt: How the Himalayas were formed.
      check:
        prompt: 'The Himalayas are called young fold mountains because:'
        options:
        - They formed fairly recently when rock layers were pushed up and folded
        - They are small
        - They were built by people
        answer: They formed fairly recently when rock layers were pushed up and folded
        why: Plates pushing together folded the rocks upward.
    - teach: The Himalayas act like a wall. They block icy winds from Central Asia, so north India is warmer in winter. They stop monsoon clouds, making them drop rain in India. Their glaciers feed rivers like the Ganga and the Brahmaputra all year.
      picture:
        kind: compare
        columns:
        - title: Himalayas block
          points:
          - icy Central Asian winds
        - title: Himalayas hold back
          points:
          - monsoon clouds, so rain falls in India
        - title: Himalayas feed
          points:
          - rivers, from glacier melt
        alt: Three ways the Himalayas help India.
      check:
        prompt: Why do rivers like the Ganga flow even in summer?
        options:
        - Melting Himalayan glaciers feed them
        - It rains every day in summer
        - They come from the sea
        answer: Melting Himalayan glaciers feed them
        why: Snow and ice melt in the heat.
    - teach: South of the Himalayas lie the Indo-Gangetic plains, built over thousands of years by silt (fine fertile mud) from the Indus, Ganga and Brahmaputra. The land is flat and rich, so farming is easy and many people live there. The north-east has forested hills such as the Garo, Khasi and Jaintia hills.
      check:
        prompt: Why are the northern plains crowded with people?
        options:
        - Flat, fertile land and plenty of river water
        - They are very cold
        - They have no rivers
        answer: Flat, fertile land and plenty of river water
        why: Good farming land supports many people.
  items:
  - prompt: How were the Himalayas formed?
    options:
    - The Indian plate pushed into the Eurasian plate
    - By volcanoes
    - By rivers depositing sand
    - By wind erosion
    answer: The Indian plate pushed into the Eurasian plate
    difficulty: 2
    hints:
    - They are fold mountains.
    - Plates collided.
    solution: They are young fold mountains raised by colliding plates.
    mistakes: {"By volcanoes": "s7_himalaya_plates"}
  - prompt: Why are the northern plains so fertile?
    options:
    - Rivers deposited rich silt
    - They are high mountains
    - They are deserts
    - They have volcanoes
    answer: Rivers deposited rich silt
    difficulty: 1
    hints:
    - Indus, Ganga, Brahmaputra.
    - Alluvium.
    solution: River silt (alluvium) makes the soil fertile.
    mistakes: {"They have volcanoes": "s7_silt"}
  - prompt: How do the Himalayas help India's climate?
    options:
    - They block cold winds and trap monsoon clouds
    - They bring snow to the plains
    - They make India a desert
    - They cause earthquakes only
    answer: They block cold winds and trap monsoon clouds
    difficulty: 2
    hints:
    - Winter winds from Central Asia.
    - Rain on the southern slopes.
    solution: They shield India from icy winds and make monsoon clouds shed rain.
    mistakes:
      They bring snow to the plains: c7ss_read_again
  - prompt: Which river system formed the plains in Bihar and Uttar Pradesh?
    options:
    - The Ganga
    - The Kaveri
    - The Narmada
    - The Godavari
    answer: The Ganga
    difficulty: 1
    hints:
    - Flows past Varanasi and Patna.
    - Northern river.
    solution: The Ganga and its tributaries formed these plains.
    mistakes: {"The Narmada": "s7_ganga_plains", "The Godavari": "s7_ganga_plains"}
  - prompt: Why do many people live on the Gangetic plains?
    options:
    - Flat, fertile land and water for farming
    - Cold climate
    - Many mines
    - High mountains
    answer: Flat, fertile land and water for farming
    difficulty: 1
    hints:
    - Farming needs good soil.
    - Rivers give water.
    solution: Fertile soil, flat land and water support farming and towns.
    mistakes: {"Many mines": "s7_crowded_plains"}
  - prompt: 'Kangchenjunga is a peak in the:'
    options:
    - Himalayas
    - Western Ghats
    - Aravallis
    - Vindhyas
    answer: Himalayas
    difficulty: 1
    hints:
    - India's highest peak.
    - In Sikkim.
    solution: Kangchenjunga is in the Himalayas.
    mistakes: {"Western Ghats": "s7_kangchenjunga"}
  - prompt: Which is the highest range of the Himalayas?
    options:
    - Himadri
    - Shivaliks
    - Western Ghats
    answer: Himadri
    difficulty: 1
    hints:
    - It has the tallest snowy peaks.
    - Its name means 'abode of snow'.
    solution: The Himadri, or Great Himalaya, is the highest range, with peaks like Kangchenjunga.
    mistakes:
      Shivaliks: c7ss1_regions
      Western Ghats: c7ss1_regions
  - prompt: 'Silt is:'
    options:
    - Fine fertile mud carried and left by rivers
    - Sand blown by desert winds
    - Hard rock of the plateau
    answer: Fine fertile mud carried and left by rivers
    difficulty: 1
    hints:
    - It builds river plains.
    - Rivers carry it from the mountains.
    solution: Silt is fine soil that rivers carry and deposit, making plains fertile.
    mistakes:
      Sand blown by desert winds: c7ss1_rivers
      Hard rock of the plateau: c7ss1_rock
  - prompt: Which river plains lie between the Himalayas and the plateau?
    options:
    - The Indo-Gangetic plains
    - The Thar plains
    - The Deccan plains
    answer: The Indo-Gangetic plains
    difficulty: 1
    hints:
    - Named after the rivers that built them.
    - Indus and Ganga.
    solution: The Indus, Ganga and Brahmaputra built the Indo-Gangetic plains south of the Himalayas.
    mistakes:
      The Thar plains: c7ss1_regions
      The Deccan plains: c7ss1_regions
  - prompt: 'The Garo, Khasi and Jaintia hills are in:'
    options:
    - North-east India
    - Rajasthan
    - Kerala
    answer: North-east India
    difficulty: 1
    hints:
    - They are forested hills.
    - Meghalaya is named after clouds there.
    solution: These hills are in Meghalaya, in north-east India.
    mistakes:
      Rajasthan: c7ss1_regions
      Kerala: c7ss1_regions
  - prompt: What would winters in north India be like without the Himalayas?
    options:
    - Much colder, because icy winds would blow in
    - Much warmer
    - Exactly the same
    answer: Much colder, because icy winds would blow in
    difficulty: 2
    hints:
    - What do the Himalayas block?
    - Where do cold winds come from?
    solution: The Himalayas stop freezing Central Asian winds; without them, north India would be far colder.
    mistakes:
      Much warmer: c7ss1_wall
      Exactly the same: c7ss1_wall
  - prompt: Why do the Himalayas help India get monsoon rain?
    options:
    - They stop rain clouds, which then drop rain on India
    - They create clouds from snow
    - They push clouds to the sea
    answer: They stop rain clouds, which then drop rain on India
    difficulty: 2
    hints:
    - Clouds move north in the monsoon.
    - What happens when they meet a high wall?
    solution: Monsoon clouds cannot cross the high mountains, so they rise, cool and rain over India.
    mistakes:
      They create clouds from snow: c7ss1_wall
      They push clouds to the sea: c7ss1_wall
  - prompt: Which plates pushed together to form the Himalayas?
    options:
    - The Indian plate and the Eurasian plate
    - The African plate and the Pacific plate
    - The Arabian Sea and the Bay of Bengal
    answer: The Indian plate and the Eurasian plate
    difficulty: 2
    hints:
    - India moved north.
    - It met the plate carrying Asia and Europe.
    solution: The Indian plate moving north pushed into the Eurasian plate, folding the rocks into mountains.
    mistakes:
      The African plate and the Pacific plate: c7ss1_wall
      The Arabian Sea and the Bay of Bengal: c7ss1_seas
  - prompt: Why do the Himalayas get a little taller each year?
    options:
    - The Indian plate is still pushing north
    - Snow keeps piling up forever
    - People build on them
    answer: The Indian plate is still pushing north
    difficulty: 3
    hints:
    - Is the plate movement over?
    - They are 'young' mountains.
    solution: The plates are still pushing together, so the rocks are still being raised.
    mistakes:
      Snow keeps piling up forever: c7ss1_wall
      People build on them: c7ss1_wall
  - prompt: Why do many big cities like Delhi, Lucknow and Patna lie on the northern plains?
    options:
    - Rivers, flat land and good farming supported large populations
    - The plains are very cold and dry
    - There are no rivers to flood them
    answer: Rivers, flat land and good farming supported large populations
    difficulty: 3
    hints:
    - What do cities need?
    - Water, food and easy movement.
    solution: Fertile plains fed many people, rivers gave water and transport, and flat land made building easy.
    mistakes:
      The plains are very cold and dry: c7ss1_rivers
      There are no rivers to flood them: c7ss1_rivers
- code: cbse7ss.geo.south
  title: Desert, plateau, coasts and islands
  after:
  - cbse7ss.geo.north
  notes: |
    The Thar Desert (mostly Rajasthan) is dry with sand dunes, little rain and hot days; people keep camels and
    build homes that stay cool. The Peninsular Plateau is old, hard rock, with the Western and Eastern Ghats on
    its edges and the Deccan between; it is rich in minerals and black soil (good for cotton). India has a long
    coastline (over 7,500 km): the narrow western coastal plain and the wider eastern one with river deltas. The
    islands: "Lakshadweep is coral, in the Arabian Sea; Andaman and Nicobar are volcanic, in the Bay of Bengal, with a channel named after a line of latitude between them. Lakshadweep's capital starts with K. India's only active volcano is a bare island. Subtract inhabited from total islands."
    Sundarbans, a mangrove delta in West Bengal, is home to the Bengal tiger.
  explanations:
    text: 'South and west of the plains are very different lands: the dry Thar Desert, the ancient rocky Deccan Plateau rich in minerals, long coasts on both sides, and island groups in the Bay of Bengal and Arabian Sea.'
    visual: Draw India's outline. Shade the Thar in the north-west yellow, the plateau in the south brown with Ghats along both edges, coasts in blue, and dots for the Andaman and Lakshadweep islands.
    step_by_step: 'Step 1: Locate the region on a map. Step 2: Describe its land and climate. Step 3: Name a resource or feature (minerals, black soil, coral). Step 4: Say how people adapt to it.'
    real_world: Kerala's backwaters lie on the western coastal plain; Chennai and Kolkata stand on the eastern coast.
  picture:
    kind: compare
    columns:
    - title: Thar Desert
      points:
      - Dry, sandy
      - Little rain
      - Camels
    - title: Peninsular Plateau
      points:
      - Old, hard rock
      - Minerals, black soil
      - Western and Eastern Ghats
    - title: Coasts and islands
      points:
      - Over 7,500 km coastline
      - Andaman and Nicobar
      - Lakshadweep coral islands
    alt: The Thar Desert, the Peninsular Plateau, and India's coasts and islands compared.
  activity:
    type: sort
    prompt: Where in India?
    bins:
    - Thar Desert
    - Peninsular Plateau
    - Islands
    - Sundarbans
    items:
    - label: Sand dunes and camels
      bin: Thar Desert
      clue: Rajasthan.
      why: Thar.
    - label: Black soil, good for cotton
      bin: Peninsular Plateau
      clue: Deccan.
      why: Plateau.
    - label: Rich in minerals, old hard rock
      bin: Peninsular Plateau
      clue: Between the Ghats.
      why: Plateau.
    - label: Coral islands in the Arabian Sea
      bin: Islands
      clue: Lakshadweep.
      why: Islands.
    - label: Mangrove delta with Bengal tigers
      bin: Sundarbans
      clue: West Bengal.
      why: Sundarbans.
  lesson:
    - teach: 'The Thar Desert, mostly in Rajasthan, is dry with sand dunes, very little rain and very hot days. People adapt: they keep camels, build thick-walled houses that stay cool, and collect every drop of rainwater.'
      check:
        prompt: Why are camels useful in the Thar Desert?
        options:
        - They can go a long time without water and walk on sand
        - They swim well
        - They need lots of rain
        answer: They can go a long time without water and walk on sand
        why: They suit the dry, sandy land.
    - teach: The Peninsular Plateau is very old, hard rock. Its edges are the Western Ghats and the Eastern Ghats; the Deccan lies between. It is rich in minerals, and its black soil holds moisture well and is very good for cotton.
      picture:
        kind: compare
        columns:
        - title: Western Ghats
          points:
          - along the west coast
          - higher, continuous
        - title: Deccan
          points:
          - the plateau in the middle
          - black soil, minerals
        - title: Eastern Ghats
          points:
          - along the east coast
          - lower, broken by rivers
        alt: The Peninsular Plateau and its two edges.
      check:
        prompt: 'Black soil is especially good for growing:'
        options:
        - Cotton
        - Tea
        - Apples
        answer: Cotton
        why: It holds moisture, which cotton needs.
    - teach: India has a coastline of over 7,500 km. The western coastal plain is narrow; the eastern one is wider, with deltas of rivers like the Godavari and Krishna. Lakshadweep (coral islands) is in the Arabian Sea; the Andaman and Nicobar Islands (volcanic, hilly) are in the Bay of Bengal. The Sundarbans in West Bengal is a mangrove delta, home of the Bengal tiger.
      picture:
        kind: compare
        columns:
        - title: Lakshadweep
          points:
          - Arabian Sea (west)
          - coral islands
        - title: Andaman and Nicobar
          points:
          - Bay of Bengal (east)
          - volcanic, hilly islands
        alt: India's two island groups compared.
      check:
        prompt: 'Lakshadweep is in the:'
        options:
        - Arabian Sea
        - Bay of Bengal
        - Indian Ocean far south of Sri Lanka
        answer: Arabian Sea
        why: It lies west of Kerala.
  items:
  - prompt: In which state is most of the Thar Desert?
    options:
    - Rajasthan
    - Kerala
    - Assam
    - Bihar
    answer: Rajasthan
    difficulty: 1
    hints:
    - North-west India.
    - Jaisalmer.
    solution: Most of the Thar lies in Rajasthan.
    mistakes: {"Bihar": "s7_thar"}
  - prompt: 'Black soil on the Deccan Plateau is especially good for growing:'
    options:
    - Cotton
    - Tea
    - Rice
    - Apples
    answer: Cotton
    difficulty: 2
    hints:
    - Holds moisture.
    - Used for cloth.
    solution: Black soil suits cotton.
    mistakes: {"Rice": "s7_black_soil", "Tea": "s7_black_soil"}
  - prompt: 'Lakshadweep islands are made of:'
    options:
    - Coral
    - Volcanic rock only
    - Sand dunes
    - Ice
    answer: Coral
    difficulty: 2
    hints:
    - In the Arabian Sea.
    - Tiny sea animals build them.
    solution: Lakshadweep is a group of coral islands.
    mistakes:
      Volcanic rock only: c7ss_islands
  - prompt: 'The Andaman and Nicobar Islands are in the:'
    options:
    - Bay of Bengal
    - Arabian Sea
    - Indian Ocean south of Sri Lanka
    - Persian Gulf
    answer: Bay of Bengal
    difficulty: 1
    hints:
    - East of mainland India.
    - Lakshadweep is west.
    solution: They lie in the Bay of Bengal.
    mistakes: {"Arabian Sea": "s7_andaman"}
  - prompt: 'The Sundarbans is famous for:'
    options:
    - Mangrove forests and the Bengal tiger
    - Sand dunes
    - Snow peaks
    - Coral reefs
    answer: Mangrove forests and the Bengal tiger
    difficulty: 1
    hints:
    - A delta in West Bengal.
    - Tidal forests.
    solution: It is a mangrove delta home to the Bengal tiger.
    mistakes: {"Coral reefs": "s7_sundarbans"}
  - prompt: Which mountain ranges lie along the edges of the Peninsular Plateau?
    options:
    - Western and Eastern Ghats
    - Himadri and Shivaliks
    - Garo and Khasi
    - Karakoram
    answer: Western and Eastern Ghats
    difficulty: 2
    hints:
    - Along the coasts.
    - Ghats.
    solution: The Western and Eastern Ghats edge the plateau.
    mistakes: {"Himadri and Shivaliks": "s7_ghats"}
  - prompt: Which feature is typical of the Thar Desert?
    options:
    - Sand dunes and very little rain
    - Snowy peaks
    - Mangrove forests
    answer: Sand dunes and very little rain
    difficulty: 1
    hints:
    - It is a desert.
    - Think about dry land.
    solution: The Thar is a hot, dry desert with sand dunes and little rain.
    mistakes:
      Snowy peaks: c7ss1_regions
      Mangrove forests: c7ss1_regions
  - prompt: 'The Peninsular Plateau is made of:'
    options:
    - Very old hard rock
    - Young folded rock
    - River silt
    answer: Very old hard rock
    difficulty: 1
    hints:
    - It is older than the Himalayas.
    - It is hard and rocky.
    solution: The plateau is one of the oldest parts of India, made of hard ancient rock.
    mistakes:
      Young folded rock: c7ss1_rock
      River silt: c7ss1_rivers
  - prompt: 'The Andaman and Nicobar Islands were mostly formed by:'
    options:
    - Volcanic activity
    - Coral growth
    - River silt
    answer: Volcanic activity
    difficulty: 1
    hints:
    - They are hilly.
    - Barren Island there is an active volcano.
    solution: The Andaman and Nicobar Islands are mainly volcanic in origin.
    mistakes:
      Coral growth: c7ss1_seas
      River silt: c7ss1_rivers
  - prompt: Which coastal plain of India is wider?
    options:
    - The eastern coastal plain
    - The western coastal plain
    - Both are exactly the same
    answer: The eastern coastal plain
    difficulty: 1
    hints:
    - Big rivers flow east into the Bay of Bengal.
    - They build deltas.
    solution: Large rivers build wide deltas on the east coast, so the eastern plain is wider.
    mistakes:
      The western coastal plain: c7ss1_seas
      Both are exactly the same: c7ss1_seas
  - prompt: Why do houses in the Thar Desert often have thick walls and small windows?
    options:
    - To keep the inside cool in the hot sun
    - To catch more sunlight
    - To let rain in
    answer: To keep the inside cool in the hot sun
    difficulty: 2
    hints:
    - Days are very hot.
    - What keeps heat out?
    solution: Thick walls and small windows keep out heat, so houses stay cool.
    mistakes:
      To catch more sunlight: c7ss1_dry
      To let rain in: c7ss1_dry
  - prompt: Why is the Deccan Plateau important for industry?
    options:
    - It is rich in minerals
    - It has the most snow
    - It is covered with sand dunes
    answer: It is rich in minerals
    difficulty: 2
    hints:
    - Old rocks hold valuable resources.
    - Iron ore, coal and more.
    solution: The plateau's ancient rocks contain minerals like iron ore, coal and manganese.
    mistakes:
      It has the most snow: c7ss1_rock
      It is covered with sand dunes: c7ss1_dry
  - prompt: The Sundarbans is found in which state?
    options:
    - West Bengal
    - Gujarat
    - Rajasthan
    answer: West Bengal
    difficulty: 2
    hints:
    - It is at the mouth of the Ganga and Brahmaputra.
    - On the east side of India.
    solution: The Sundarbans mangrove delta lies in West Bengal (and Bangladesh).
    mistakes:
      Gujarat: c7ss1_seas
      Rajasthan: c7ss1_dry
  - prompt: Which range forms the western edge of the Peninsular Plateau?
    options:
    - Western Ghats
    - Shivaliks
    - Aravalli of Kashmir
    answer: Western Ghats
    difficulty: 2
    hints:
    - It runs along the west coast.
    - It is called a ghat.
    solution: The Western Ghats run along the western edge of the plateau.
    mistakes:
      Shivaliks: c7ss1_regions
      Aravalli of Kashmir: c7ss1_regions
  - prompt: 'Lakshadweep and the Andaman Islands differ because:'
    options:
    - Lakshadweep is low coral land in the west; the Andamans are hilly volcanic land in the east
    - Both are made of coral in the same sea
    - Both are volcanoes in the Arabian Sea
    answer: Lakshadweep is low coral land in the west; the Andamans are hilly volcanic land in the east
    difficulty: 3
    hints:
    - Compare which sea and what built them.
    - Coral islands are low and flat.
