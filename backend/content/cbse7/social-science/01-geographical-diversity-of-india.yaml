# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 1. Format: content/README.md.
subject: cbse7-ss
chapter: 1
title: Geographical Diversity of India
tips:
  c7ss_read_again: 'Go back to the chapter: find the paragraph about that place, person or idea.'
  c7ss_islands: Lakshadweep is coral; the Andaman and Nicobar Islands are a chain of mountains rising from the sea.
concepts:
- code: cbse7ss.geo.north
  title: The Himalayas and the northern plains
  notes: |
    India's landforms are very diverse. The Himalayas in the north are young fold mountains (formed as the Indian
    plate pushed into the Eurasian plate), with ranges such as the Himadri (Great Himalaya, peaks like
    Kangchenjunga), Himachal and Shivaliks. They block cold winds from Central Asia, trap monsoon clouds and feed
    rivers with glacier melt. South of them, the Indo-Gangetic plains were built by silt from the Indus, Ganga
    and Brahmaputra: flat, fertile and densely populated. The north-east has forested hills (Garo, Khasi,
    Jaintia).
  explanations:
    text: In the north, the young, high Himalayas protect India from icy winds and feed great rivers with melting snow. Below them lie the flat, fertile plains made by river silt, where many people farm and live.
    visual: 'Draw a cross-section from north to south: tall jagged Himalayas, then a long flat green plain with the Ganga winding through it.'
    step_by_step: 'Step 1: Name the landform. Step 2: Say how it was formed (mountains by plates pushing; plains by river silt). Step 3: Say why it matters (climate, rivers, farming). Step 4: Link it to how people live.'
    real_world: Cities like Kanpur, Patna and Varanasi grew on the fertile Ganga plains, and hill towns like Shimla and Darjeeling in the Himalayas.
  picture:
    kind: compare
    columns:
    - title: Himalayas
      points:
      - Young fold mountains
      - Block cold winds
      - Glaciers feed rivers
      - Fewer people
    - title: Indo-Gangetic plains
      points:
      - Made of river silt
      - Flat and fertile
      - Good for farming
      - Densely populated
    alt: The Himalayas (young mountains that block cold winds and feed rivers) compared with the Indo-Gangetic plains (flat, fertile, densely populated).
  items:
  - prompt: How were the Himalayas formed?
    options:
    - The Indian plate pushed into the Eurasian plate
    - By volcanoes
    - By rivers depositing sand
    - By wind erosion
    answer: The Indian plate pushed into the Eurasian plate
    difficulty: 2
    hints:
    - They are fold mountains.
    - Plates collided.
    solution: They are young fold mountains raised by colliding plates.
  - prompt: Why are the northern plains so fertile?
    options:
    - Rivers deposited rich silt
    - They are high mountains
    - They are deserts
    - They have volcanoes
    answer: Rivers deposited rich silt
    difficulty: 1
    hints:
    - Indus, Ganga, Brahmaputra.
    - Alluvium.
    solution: River silt (alluvium) makes the soil fertile.
  - prompt: How do the Himalayas help India's climate?
    options:
    - They block cold winds and trap monsoon clouds
    - They bring snow to the plains
    - They make India a desert
    - They cause earthquakes only
    answer: They block cold winds and trap monsoon clouds
    difficulty: 2
    hints:
    - Winter winds from Central Asia.
    - Rain on the southern slopes.
    solution: They shield India from icy winds and make monsoon clouds shed rain.
    mistakes:
      They bring snow to the plains: c7ss_read_again
  - prompt: Which river system formed the plains in Bihar and Uttar Pradesh?
    options:
    - The Ganga
    - The Kaveri
    - The Narmada
    - The Godavari
    answer: The Ganga
    difficulty: 1
    hints:
    - Flows past Varanasi and Patna.
    - Northern river.
    solution: The Ganga and its tributaries formed these plains.
  - prompt: Why do many people live on the Gangetic plains?
    options:
    - Flat, fertile land and water for farming
    - Cold climate
    - Many mines
    - High mountains
    answer: Flat, fertile land and water for farming
    difficulty: 1
    hints:
    - Farming needs good soil.
    - Rivers give water.
    solution: Fertile soil, flat land and water support farming and towns.
  - prompt: 'Kangchenjunga is a peak in the:'
    options:
    - Himalayas
    - Western Ghats
    - Aravallis
    - Vindhyas
    answer: Himalayas
    difficulty: 1
    hints:
    - India's highest peak.
    - In Sikkim.
    solution: Kangchenjunga is in the Himalayas.
- code: cbse7ss.geo.south
  title: Desert, plateau, coasts and islands
  after:
  - cbse7ss.geo.north
  notes: |
    The Thar Desert (mostly Rajasthan) is dry with sand dunes, little rain and hot days; people keep camels and
    build homes that stay cool. The Peninsular Plateau is old, hard rock, with the Western and Eastern Ghats on
    its edges and the Deccan between; it is rich in minerals and black soil (good for cotton). India has a long
    coastline (over 7,500 km): the narrow western coastal plain and the wider eastern one with river deltas. The
    islands: Andaman and Nicobar in the Bay of Bengal, Lakshadweep (coral islands) in the Arabian Sea. The
    Sundarbans, a mangrove delta in West Bengal, is home to the Bengal tiger.
  explanations:
    text: 'South and west of the plains are very different lands: the dry Thar Desert, the ancient rocky Deccan Plateau rich in minerals, long coasts on both sides, and island groups in the Bay of Bengal and Arabian Sea.'
    visual: Draw India's outline. Shade the Thar in the north-west yellow, the plateau in the south brown with Ghats along both edges, coasts in blue, and dots for the Andaman and Lakshadweep islands.
    step_by_step: 'Step 1: Locate the region on a map. Step 2: Describe its land and climate. Step 3: Name a resource or feature (minerals, black soil, coral). Step 4: Say how people adapt to it.'
    real_world: Kerala's backwaters lie on the western coastal plain; Chennai and Kolkata stand on the eastern coast.
  picture:
    kind: compare
    columns:
    - title: Thar Desert
      points:
      - Dry, sandy
      - Little rain
      - Camels
    - title: Peninsular Plateau
      points:
      - Old, hard rock
      - Minerals, black soil
      - Western and Eastern Ghats
    - title: Coasts and islands
      points:
      - Over 7,500 km coastline
      - Andaman and Nicobar
      - Lakshadweep coral islands
    alt: The Thar Desert, the Peninsular Plateau, and India's coasts and islands compared.
  items:
  - prompt: In which state is most of the Thar Desert?
    options:
    - Rajasthan
    - Kerala
    - Assam
    - Bihar
    answer: Rajasthan
    difficulty: 1
    hints:
    - North-west India.
    - Jaisalmer.
    solution: Most of the Thar lies in Rajasthan.
  - prompt: 'Black soil on the Deccan Plateau is especially good for growing:'
    options:
    - Cotton
    - Tea
    - Rice
    - Apples
    answer: Cotton
    difficulty: 2
    hints:
    - Holds moisture.
    - Used for cloth.
    solution: Black soil suits cotton.
  - prompt: 'Lakshadweep islands are made of:'
    options:
    - Coral
    - Volcanic rock only
    - Sand dunes
    - Ice
    answer: Coral
    difficulty: 2
    hints:
    - In the Arabian Sea.
    - Tiny sea animals build them.
    solution: Lakshadweep is a group of coral islands.
    mistakes:
      Volcanic rock only: c7ss_islands
  - prompt: 'The Andaman and Nicobar Islands are in the:'
    options:
    - Bay of Bengal
    - Arabian Sea
    - Indian Ocean south of Sri Lanka
    - Persian Gulf
    answer: Bay of Bengal
    difficulty: 1
    hints:
    - East of mainland India.
    - Lakshadweep is west.
    solution: They lie in the Bay of Bengal.
  - prompt: 'The Sundarbans is famous for:'
    options:
    - Mangrove forests and the Bengal tiger
    - Sand dunes
    - Snow peaks
    - Coral reefs
    answer: Mangrove forests and the Bengal tiger
    difficulty: 1
    hints:
    - A delta in West Bengal.
    - Tidal forests.
    solution: It is a mangrove delta home to the Bengal tiger.
  - prompt: Which mountain ranges lie along the edges of the Peninsular Plateau?
    options:
    - Western and Eastern Ghats
    - Himadri and Shivaliks
    - Garo and Khasi
    - Karakoram
    answer: Western and Eastern Ghats
    difficulty: 2
    hints:
    - Along the coasts.
    - Ghats.
    solution: The Western and Eastern Ghats edge the plateau.
