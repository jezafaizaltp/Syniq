# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 8), SYNiq chapter 20. Format: content/README.md.
subject: cbse7-ss
chapter: 20
title: Banks and the Magic of Finance
tips:
  c7ss_compound: Compound interest is worked out on the new total each year, so it grows faster than simple interest.
  s7_bank_earn: "Banks pay interest on deposits and charge interest on loans. Which is higher?"
  s7_compound1: "After one year: 1,000 + 10% of 1,000."
  s7_current_account: "Fixed deposits lock money away. Businesses need an account they can use all day."
  s7_fd: "'Fixed' means for a fixed time."
  s7_jan_dhan: "'Dhan' means wealth. The scheme is about banking for everyone."
  s7_otp: "Banks never ask for these secret codes."
  s7_save_early: "Money that starts early has more years to earn interest on interest."
  s7_shares: "A share is a part of the company."
  s7_simple2: "Simple interest is the same every year: 100 + 100, added to 1,000."
  s7_simple_interest: "6% of 1,000 = 1,000 × 6 ÷ 100."
  c7ss20_account: 'Different deposits suit different needs: everyday saving, a business with many payments, money locked for a time, or a fixed sum every month.'
  c7ss20_earn: A bank pays a little to savers and charges more to borrowers. The gap between the two is how it earns.
  c7ss20_central: One special bank does not serve ordinary customers. It issues currency and keeps watch over all other banks.
  c7ss20_simple: Simple interest = principal × rate × years ÷ 100. Work out the interest first, then add it to the principal if the question asks for the total.
  c7ss20_compound: With compounding, each year's interest is worked out on the new, larger amount, not on the starting amount. Go one year at a time.
  c7ss20_safe: Banks never ask for your PIN, OTP or password. Offers that sound too good to be true usually are.
  c7ss20_shares: A share is a small piece of ownership in a company. Its price can go up or down, so there is risk.
concepts:
- code: cbse7ss.bank.functions
  title: Banks and their functions
  notes: |
    Banks keep people's money safe and lend it to others. Deposits: savings accounts (earn some interest; for
    individuals), current accounts (for businesses; many transactions), fixed deposits (money kept for a fixed time,
    higher interest), recurring deposits (a fixed amount every month). Loans: banks lend to people and businesses and
    charge interest, which is higher than the interest they pay on deposits; the difference is the bank's income.
    The Reserve Bank of India (RBI) is the central bank: it issues currency, regulates banks and controls money
    supply. Jan Dhan Yojana opened bank accounts for millions.
  explanations:
    text: Banks keep our savings safe and pay us a little interest. They lend that money to others who need loans and charge them more interest. The Reserve Bank of India watches over all banks and issues our currency.
    visual: Draw money flowing in from savers (deposits, earning interest) into a bank, and out to borrowers (loans, paying more interest), with the RBI standing above watching.
    step_by_step: 'Step 1: Deposits: money people put in. Step 2: Interest paid to depositors. Step 3: Loans: money lent out. Step 4: Interest charged to borrowers (higher). Step 5: The RBI regulates banks.'
    real_world: Under the Jan Dhan Yojana, crores of people opened zero-balance bank accounts, many for the first time.
  picture:
    kind: compare
    columns:
    - title: Deposit type
      points:
      - Savings account
      - Current account
      - Fixed deposit
      - Recurring deposit
    - title: Used for
      points:
      - Individuals saving, some interest
      - Businesses, many transactions
      - Lump sum for a fixed time, higher interest
      - Fixed amount each month
    alt: 'Types of bank deposits and what they are for: savings, current, fixed and recurring deposits.'
  activity:
    type: sort
    prompt: Which kind of deposit?
    bins:
    - Savings account
    - Current account
    - Fixed deposit
    - Recurring deposit
    items:
    - label: For individuals, earns some interest
      bin: Savings account
      clue: Everyday saving.
      why: Savings.
    - label: For businesses with many transactions
      bin: Current account
      clue: Shops and firms.
      why: Current.
    - label: Money kept for a fixed time at higher interest
      bin: Fixed deposit
      clue: Locked in.
      why: FD.
    - label: A fixed amount every month
      bin: Recurring deposit
      clue: Monthly.
      why: RD.
  lesson:
    - teach: 'A bank keeps people''s money safe and lends it to others. People deposit money in different accounts: a savings account (for individuals, earns some interest), a current account (for businesses with many daily payments), a fixed deposit (locked for a set time, higher interest) and a recurring deposit (a fixed amount each month).'
      picture:
        kind: compare
        columns:
        - title: Account
          points:
          - Savings
          - Current
          - Fixed deposit
          - Recurring deposit
        - title: Best for
          points:
          - individuals saving
          - businesses, many payments
          - money kept for a set time
          - fixed monthly saving
        alt: Types of bank deposits and who they suit.
      check:
        prompt: Riya wants to save ₹500 every month for a year. Which suits her?
        options:
        - A recurring deposit
        - A current account
        - A loan
        answer: A recurring deposit
        why: It takes a fixed amount every month.
    - teach: Banks lend deposits to people and businesses as loans and charge interest. The interest they charge on loans is higher than the interest they pay on deposits. That difference is the bank's main income.
      picture:
        kind: flow
        steps:
        - Savers deposit, bank pays them 4%
        - Bank lends to borrowers, charges them 9%
        - The 5% gap is the bank's income
        alt: How a bank earns from the gap between interest rates.
      check:
        prompt: A bank pays 4% on deposits and charges 10% on loans. What is the gap?
        options:
        - 6%
        - 14%
        - 40%
        answer: 6%
        why: 10 - 4 = 6.
    - teach: The Reserve Bank of India (RBI) is the central bank. It issues currency, regulates all banks and controls the money supply. Jan Dhan Yojana helped millions of people open their first bank account.
      check:
        prompt: Can you open a savings account at the RBI?
        options:
        - No, it is the banks' bank, not for the public
        - Yes, in every town
        - Only for children
        answer: No, it is the banks' bank, not for the public
        why: The RBI regulates banks; ordinary people use other banks.
  items:
  - prompt: Which is India's central bank?
    options:
    - Reserve Bank of India
    - State Bank of India
    - Punjab National Bank
    - World Bank
    answer: Reserve Bank of India
    difficulty: 1
    hints:
    - Issues currency.
    - Regulates banks.
    solution: The RBI is India's central bank.
    mistakes:
      State Bank of India: c7ss_rbi
  - prompt: Which account is best for businesses with many daily transactions?
    options:
    - Current account
    - Fixed deposit
    - Recurring deposit
    - Locker
    answer: Current account
    difficulty: 2
    hints:
    - Frequent deposits and withdrawals.
    - Businesses.
    solution: Current accounts suit frequent business transactions.
    mistakes: {"Fixed deposit": "s7_current_account"}
  - prompt: How does a bank mainly earn money?
    options:
    - Charging more interest on loans than it pays on deposits
    - Selling food
    - Printing notes
    - Collecting taxes
    answer: Charging more interest on loans than it pays on deposits
    difficulty: 2
    hints:
    - The difference.
    - Loans vs deposits.
    solution: The gap between loan interest and deposit interest is its income.
    mistakes: {"Printing notes": "s7_bank_earn"}
  - prompt: You deposit ₹1,000 at 6% simple interest per year. How much interest do you earn in one year, in rupees?
    answer: '60'
    check: 1000*6/100
    difficulty: 2
    hints:
    - 6% of 1000.
    - 1000 × 6 ÷ 100.
    solution: 1000 × 6 ÷ 100 = ₹60.
    mistakes: {"6": "s7_simple_interest", "600": "s7_simple_interest"}
  - prompt: 'A fixed deposit is money kept in a bank:'
    options:
    - For a fixed time at higher interest
    - That can be withdrawn any minute without loss
    - For businesses only
    - Without any interest
    answer: For a fixed time at higher interest
    difficulty: 1
    hints:
    - '''Fixed'' time.'
    - Higher interest.
    solution: A fixed deposit locks money for a period, earning more interest.
    mistakes: {"That can be withdrawn any minute without loss": "s7_fd"}
  - prompt: 'The Jan Dhan Yojana helped people to:'
    options:
    - Open bank accounts
    - Buy land
    - Get passports
    - Build roads
    answer: Open bank accounts
    difficulty: 1
    hints:
    - Financial inclusion.
    - Zero-balance accounts.
    solution: It opened bank accounts for millions.
    mistakes: {"Buy land": "s7_jan_dhan"}
  - prompt: Simple interest on ₹2,000 at 5% per year for 3 years, in rupees?
    answer: '300'
    check: 2000*5*3/100
    difficulty: 2
    hints:
    - SI = P × R × T ÷ 100.
    - Multiply 2000, 5 and 3, then divide by 100.
    solution: 'Step 1: SI = 2000 × 5 × 3 ÷ 100. Step 2: = 300 rupees.'
    mistakes:
      '100': c7ss20_simple
      '2300': c7ss20_simple
  - prompt: 'A shop owner who makes dozens of payments each day should open a:'
    options:
    - Current account
    - Fixed deposit
    - Recurring deposit
    answer: Current account
    difficulty: 1
    hints:
    - It is designed for businesses.
    - It allows many transactions.
    solution: Current accounts suit businesses with many daily deposits and withdrawals.
    mistakes:
      Fixed deposit: c7ss20_account
      Recurring deposit: c7ss20_account
  - prompt: Why does a fixed deposit pay more interest than a savings account?
    options:
    - The bank can use the money for a fixed time
    - It is free money
    - It has no rules
    answer: The bank can use the money for a fixed time
    difficulty: 3
    hints:
    - You cannot take it out early without a penalty.
    - The bank can plan its lending.
    solution: Because the money is locked in, the bank can lend it confidently and pays a higher rate.
    mistakes:
      It is free money: c7ss20_account
      It has no rules: c7ss20_account
  - prompt: Which is a job of the RBI?
    options:
    - Issuing currency notes
    - Running grocery shops
    - Building roads
    answer: Issuing currency notes
    difficulty: 1
    hints:
    - It is the central bank.
    - Notes carry its Governor's signature.
    solution: The RBI issues currency and regulates banks.
    mistakes:
      Running grocery shops: c7ss20_central
      Building roads: c7ss20_central
  - prompt: A bank lends ₹10,000 at 9% and pays a saver 4% on ₹10,000 for one year. How much does the bank earn from the gap, in rupees?
    answer: '500'
    check: 10000*9/100-10000*4/100
    difficulty: 3
    hints:
    - Find interest charged and interest paid.
    - Subtract the smaller from the larger.
    solution: 'Step 1: charged = 900, paid = 400. Step 2: 900 - 400 = 500 rupees.'
    mistakes:
      '1300': c7ss20_earn
      '900': c7ss20_earn
  - prompt: Why is keeping money in a bank safer than at home?
    options:
    - It is protected from theft, fire and loss
    - It disappears faster
    - It cannot be used
    answer: It is protected from theft, fire and loss
    difficulty: 1
    hints:
    - Think of what can happen at home.
    - Banks are regulated by the RBI.
    solution: Banks keep deposits safe and records protect your money.
    mistakes:
      It disappears faster: c7ss20_account
      It cannot be used: c7ss20_account
  - prompt: Total amount after 2 years on ₹5,000 at 6% simple interest, in rupees?
    answer: '5600'
    check: 5000+5000*6*2/100
    difficulty: 2
    hints:
    - Find the interest first.
    - Then add it to ₹5,000.
    solution: 'Step 1: SI = 5000 × 6 × 2 ÷ 100 = 600. Step 2: 5000 + 600 = 5600 rupees.'
    mistakes:
      '600': c7ss20_simple
      '5300': c7ss20_simple
  - prompt: 'A small loan helps a woman buy a sewing machine to start a business. This shows banks:'
    options:
    - Help people earn by giving credit
    - Only take money
    - Make clothes
    answer: Help people earn by giving credit
    difficulty: 2
    hints:
    - Credit means a loan.
    - She can repay from her earnings.
    solution: Loans let people invest in tools and businesses, raising their income.
    mistakes:
      Only take money: c7ss20_earn
      Make clothes: c7ss20_earn
  - prompt: Why was Jan Dhan Yojana important?
    options:
    - Millions without bank accounts could open one
    - It closed banks
    - It printed coins
    answer: Millions without bank accounts could open one
    difficulty: 2
    hints:
    - Many poor families had no account.
    - Zero-balance accounts were allowed.
    solution: It brought banking to millions, letting them save and receive benefits directly.
    mistakes:
      It closed banks: c7ss20_central
      It printed coins: c7ss20_central
- code: cbse7ss.bank.compound
  title: Compounding, payments and staying safe
  after:
  - cbse7ss.bank.functions
  notes: |
    Simple interest is earned only on the original amount; compound interest is earned on the amount plus interest
    already earned, so money grows faster over time ('the magic of compounding'). Example: ₹1,000 at 10% a year
    compounded: after 1 year ₹1,100, after 2 years ₹1,210. Saving early helps. Payment modes: cash, cheque, debit and
    credit cards, net banking, UPI. The stock market lets people buy shares (part-ownership) in companies; prices can
    rise or fall, so it is risky. Financial frauds: never share your PIN, OTP or password; beware of fake calls,
    messages and 'too good to be true' offers.
  explanations:
    text: With compound interest, you earn interest on your interest, so savings grow faster each year. Saving early lets money grow more. Pay safely with UPI or cards, and never share your PIN or OTP with anyone.
    visual: 'Draw three bars: ₹1,000 now, ₹1,100 after one year, ₹1,210 after two years at 10%: each year''s growth is a little bigger than the last.'
    step_by_step: 'Step 1: Find this year''s interest on the whole amount. Step 2: Add it to the amount. Step 3: Repeat for the next year. Step 4: Compare with simple interest, which stays the same each year.'
    real_world: 'Banks and the RBI repeatedly warn: no bank official will ever ask for your OTP on a phone call.'
  picture:
    kind: bars
    bars:
    - label: Start
      value: 1000
    - label: After 1 year
      value: 1100
    - label: After 2 years
      value: 1210
    - label: After 3 years
      value: 1331
    unit: ₹
    caption: ₹1,000 at 10% compounded each year grows by more every year.
    alt: A bar chart showing ₹1,000 growing to ₹1,100, ₹1,210 and ₹1,331 over three years at 10% compound interest.
  activity:
    type: formula
    prompt: ₹1,000 at 10% a year. Change the years.
    inputs:
    - name: n
      label: Years
      min: 0
      max: 5
      step: 1
      start: 0
    outputs:
    - name: si
      label: Simple interest total
      expr: 1000+100*n
      unit: ₹
    - name: ci
      label: Compound interest total
      expr: 1000*1.1^n
      unit: ₹
      places: 0
    goals:
    - prompt: When does the compound total reach ₹1,210?
      want:
        ci: 1210
      mistakes:
      - when:
          ci: 1100
        say: After 1 year it's ₹1,100. The next year, interest is on ₹1,100.
    - prompt: When is compound ahead of simple by ₹31?
      want:
        ci: 1331
      mistakes:
      - when:
          ci: 1210
        say: At 2 years compound is only ₹10 ahead. Go one more year.
  lesson:
    - teach: Simple interest is earned only on the original amount (principal). Compound interest is earned on the principal plus the interest already added, so money grows faster. This is called the magic of compounding.
      check:
        prompt: 'Compound interest is calculated on:'
        options:
        - Principal plus interest already earned
        - Only the principal
        - Nothing
        answer: Principal plus interest already earned
        why: Interest earns interest.
    - teach: 'Example: ₹1,000 at 10% a year. Simple: ₹100 every year, so ₹1,200 after 2 years. Compound: ₹1,100 after year 1, then 10% of ₹1,100 = ₹110, so ₹1,210 after year 2. The gap grows every year, so saving early helps.'
      picture:
        kind: bars
        unit: rupees
        bars:
        - label: Simple, 2 yrs
          value: 1200
        - label: Compound, 2 yrs
          value: 1210
        alt: After 2 years compound interest gives a little more than simple interest.
      check:
        prompt: '₹2,000 at 10% compound for 1 year becomes:'
        options:
        - ₹2,200
        - ₹2,010
        - ₹3,000
        answer: ₹2,200
        why: 10% of 2000 = 200.
    - teach: 'Payments can be made by cash, cheque, debit or credit card, net banking or UPI. Shares are small parts of ownership in a company; their prices go up and down, so they carry risk. Stay safe: never share your PIN, OTP or password, and beware of fake calls and ''too good to be true'' offers.'
      check:
        prompt: A caller says he is from your bank and asks for the OTP. What do you do?
        options:
        - Refuse and hang up
        - Share it quickly
        - Post it online
        answer: Refuse and hang up
        why: Banks never ask for OTPs.
  items:
  - prompt: ₹1,000 is deposited at 10% compound interest per year. How much is there after 1 year, in rupees?
    answer: '1100'
    check: 1000*Rational(11,10)
    difficulty: 1
    hints:
    - 10% of 1000 = 100.
    - 1000 + 100.
    solution: 1000 + 100 = ₹1,100.
    mistakes: {"100": "s7_compound1", "1010": "s7_compound1"}
  - prompt: Continuing, how much is there after 2 years, in rupees?
    answer: '1210'
    check: 1000*Rational(11,10)**2
    difficulty: 2
    hints:
    - 10% of 1100 = 110.
    - 1100 + 110.
    solution: 1100 + 110 = ₹1,210.
    mistakes:
      '1200': c7ss_compound
  - prompt: With simple interest at 10% on ₹1,000, how much is there after 2 years, in rupees?
    answer: '1200'
    check: 1000 + 2*100
    difficulty: 2
    hints:
    - ₹100 interest each year.
    - 1000 + 200.
    solution: 1000 + 100 + 100 = ₹1,200.
    mistakes: {"1210": "s7_simple2", "1100": "s7_simple2"}
  - prompt: What should you never share with anyone, even someone claiming to be from your bank?
    options:
    - Your OTP or PIN
    - Your name
    - Your city
    - Your school
    answer: Your OTP or PIN
    difficulty: 1
    hints:
    - Fraud warning.
    - Secret codes.
    solution: Never share OTPs, PINs or passwords.
    mistakes: {"Your city": "s7_otp"}
  - prompt: 'Buying a company''s shares means you:'
    options:
    - Own a small part of the company
    - Lend money to a bank
    - Pay a tax
    - Get a fixed salary
    answer: Own a small part of the company
    difficulty: 2
    hints:
    - Stock market.
    - Part-ownership.
    solution: A share is a small part-ownership of a company.
    mistakes: {"Lend money to a bank": "s7_shares"}
  - prompt: Why is it good to start saving early?
    options:
    - Compounding has more time to grow the money
    - Banks close later
    - Interest is lower for the young
    - It makes no difference
    answer: Compounding has more time to grow the money
    difficulty: 2
    hints:
    - Interest on interest.
    - Time matters.
    solution: The longer money compounds, the more it grows.
    mistakes: {"It makes no difference": "s7_save_early"}
  - prompt: ₹2,000 at 10% compound interest per year. Amount after 2 years, in rupees?
    answer: '2420'
    check: 2000*Rational(11,10)**2
    difficulty: 2
    hints:
    - 'Year 1: add 10% of 2000.'
    - 'Year 2: add 10% of the new amount.'
    solution: 'Step 1: year 1 = 2000 + 200 = 2200. Step 2: year 2 = 2200 + 220 = 2420 rupees.'
    mistakes:
      '2400': c7ss20_compound
      '2200': c7ss20_compound
  - prompt: ₹5,000 at 10% compound interest. Amount after 1 year, in rupees?
    answer: '5500'
    check: 5000*Rational(11,10)
    difficulty: 1
    hints:
    - 10% of 5000.
    - Add it to 5000.
    solution: 'Step 1: 10% of 5000 = 500. Step 2: 5000 + 500 = 5500 rupees.'
    mistakes:
      '500': c7ss20_compound
      '5010': c7ss20_compound
  - prompt: ₹1,000 at 10% compound interest. Amount after 3 years, in rupees?
    answer: '1331'
    check: 1000*Rational(11,10)**3
    difficulty: 3
    hints:
    - After 2 years it is ₹1,210.
    - Add 10% of ₹1,210.
    solution: 'Step 1: after 2 years = 1210. Step 2: 1210 + 121 = 1331 rupees.'
    mistakes:
      '1300': c7ss20_compound
      '1320': c7ss20_compound
  - prompt: Which offer is most likely a fraud?
    options:
    - '''Double your money in 7 days, send your PIN'''
    - A bank's fixed deposit at 7% a year
    - A post office savings scheme
    answer: '''Double your money in 7 days, send your PIN'''
    difficulty: 1
    hints:
    - Does it sound too good to be true?
    - Banks never ask for PINs.
    solution: Promises of huge quick returns plus a PIN request are classic fraud signs.
    mistakes:
      A bank's fixed deposit at 7% a year: c7ss20_safe
      A post office savings scheme: c7ss20_safe
  - prompt: Why are shares riskier than a fixed deposit?
    options:
    - Share prices can fall as well as rise
    - Shares always lose money
    - Fixed deposits pay nothing
    answer: Share prices can fall as well as rise
    difficulty: 2
    hints:
    - A fixed deposit has a promised rate.
    - Share prices change every day.
    solution: Share prices move with company performance and markets; FD returns are fixed.
    mistakes:
      Shares always lose money: c7ss20_shares
      Fixed deposits pay nothing: c7ss20_shares
  - prompt: A company has 1,000 shares. You own 50. What percentage of the company do you own?
    answer: '5'
    check: 50*100/1000
    difficulty: 2
    hints:
    - Percentage = part ÷ total × 100.
    - 50 out of 1000.
    solution: 'Step 1: 50 ÷ 1000 = 0.05. Step 2: × 100 = 5%.'
    mistakes:
      '50': c7ss20_shares
      '20': c7ss20_shares
  - prompt: Arjun starts saving at 15, Bina at 25, both at the same rate. Who likely has more at 40, and why?
    options:
    - Arjun, because compounding had more years
    - Bina, because she started later
    - Same, time does not matter
    answer: Arjun, because compounding had more years
    difficulty: 2
    hints:
    - Compare years of growth.
    - Interest earns interest each year.
    solution: Arjun's money compounds for 25 years, Bina's for 15, so Arjun's grows more.
    mistakes:
      Bina, because she started later: c7ss20_compound
      Same, time does not matter: c7ss20_compound
  - prompt: 'A credit card lets you:'
    options:
    - Buy now and pay the bank later
    - Print money
    - Avoid paying ever
    answer: Buy now and pay the bank later
    difficulty: 2
    hints:
    - Credit means borrowing.
    - Late payment costs interest.
    solution: A credit card is a short loan from the bank, to be repaid, often with interest if late.
    mistakes:
      Print money: c7ss20_safe
      Avoid paying ever: c7ss20_safe
  - prompt: Which keeps your bank account safe?
    options:
    - Keeping your password secret and strong
    - Writing your PIN on your card
    - Clicking links in unknown messages
    answer: Keeping your password secret and strong
    difficulty: 1
    hints:
    - Two options help fraudsters.
    - Secrets must stay secret.
    solution: A strong, secret password protects your account.
    mistakes:
      Writing your PIN on your card: c7ss20_safe
      Clicking links in unknown messages: c7ss20_safe
