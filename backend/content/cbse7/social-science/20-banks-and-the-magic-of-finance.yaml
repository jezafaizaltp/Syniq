# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 8), SYNiq chapter 20. Format: content/README.md.
subject: cbse7-ss
chapter: 20
title: Banks and the Magic of Finance
tips:
  c7ss_compound: Compound interest is worked out on the new total each year, so it grows faster than simple interest.
concepts:
- code: cbse7ss.bank.functions
  title: Banks and their functions
  notes: |
    Banks keep people's money safe and lend it to others. Deposits: savings accounts (earn some interest; for
    individuals), current accounts (for businesses; many transactions), fixed deposits (money kept for a fixed time,
    higher interest), recurring deposits (a fixed amount every month). Loans: banks lend to people and businesses and
    charge interest, which is higher than the interest they pay on deposits; the difference is the bank's income.
    The Reserve Bank of India (RBI) is the central bank: it issues currency, regulates banks and controls money
    supply. Jan Dhan Yojana opened bank accounts for millions.
  explanations:
    text: Banks keep our savings safe and pay us a little interest. They lend that money to others who need loans and charge them more interest. The Reserve Bank of India watches over all banks and issues our currency.
    visual: Draw money flowing in from savers (deposits, earning interest) into a bank, and out to borrowers (loans, paying more interest), with the RBI standing above watching.
    step_by_step: 'Step 1: Deposits: money people put in. Step 2: Interest paid to depositors. Step 3: Loans: money lent out. Step 4: Interest charged to borrowers (higher). Step 5: The RBI regulates banks.'
    real_world: Under the Jan Dhan Yojana, crores of people opened zero-balance bank accounts, many for the first time.
  picture:
    kind: compare
    columns:
    - title: Deposit type
      points:
      - Savings account
      - Current account
      - Fixed deposit
      - Recurring deposit
    - title: Used for
      points:
      - Individuals saving, some interest
      - Businesses, many transactions
      - Lump sum for a fixed time, higher interest
      - Fixed amount each month
    alt: 'Types of bank deposits and what they are for: savings, current, fixed and recurring deposits.'
  items:
  - prompt: Which is India's central bank?
    options:
    - Reserve Bank of India
    - State Bank of India
    - Punjab National Bank
    - World Bank
    answer: Reserve Bank of India
    difficulty: 1
    hints:
    - Issues currency.
    - Regulates banks.
    solution: The RBI is India's central bank.
    mistakes:
      State Bank of India: c7ss_rbi
  - prompt: Which account is best for businesses with many daily transactions?
    options:
    - Current account
    - Fixed deposit
    - Recurring deposit
    - Locker
    answer: Current account
    difficulty: 2
    hints:
    - Frequent deposits and withdrawals.
    - Businesses.
    solution: Current accounts suit frequent business transactions.
  - prompt: How does a bank mainly earn money?
    options:
    - Charging more interest on loans than it pays on deposits
    - Selling food
    - Printing notes
    - Collecting taxes
    answer: Charging more interest on loans than it pays on deposits
    difficulty: 2
    hints:
    - The difference.
    - Loans vs deposits.
    solution: The gap between loan interest and deposit interest is its income.
  - prompt: You deposit ₹1,000 at 6% simple interest per year. How much interest do you earn in one year, in rupees?
    answer: '60'
    check: 1000*6/100
    difficulty: 2
    hints:
    - 6% of 1000.
    - 1000 × 6 ÷ 100.
    solution: 1000 × 6 ÷ 100 = ₹60.
  - prompt: 'A fixed deposit is money kept in a bank:'
    options:
    - For a fixed time at higher interest
    - That can be withdrawn any minute without loss
    - For businesses only
    - Without any interest
    answer: For a fixed time at higher interest
    difficulty: 1
    hints:
    - '''Fixed'' time.'
    - Higher interest.
    solution: A fixed deposit locks money for a period, earning more interest.
  - prompt: 'The Jan Dhan Yojana helped people to:'
    options:
    - Open bank accounts
    - Buy land
    - Get passports
    - Build roads
    answer: Open bank accounts
    difficulty: 1
    hints:
    - Financial inclusion.
    - Zero-balance accounts.
    solution: It opened bank accounts for millions.
- code: cbse7ss.bank.compound
  title: Compounding, payments and staying safe
  after:
  - cbse7ss.bank.functions
  notes: |
    Simple interest is earned only on the original amount; compound interest is earned on the amount plus interest
    already earned, so money grows faster over time ('the magic of compounding'). Example: ₹1,000 at 10% a year
    compounded: after 1 year ₹1,100, after 2 years ₹1,210. Saving early helps. Payment modes: cash, cheque, debit and
    credit cards, net banking, UPI. The stock market lets people buy shares (part-ownership) in companies; prices can
    rise or fall, so it is risky. Financial frauds: never share your PIN, OTP or password; beware of fake calls,
    messages and 'too good to be true' offers.
  explanations:
    text: With compound interest, you earn interest on your interest, so savings grow faster each year. Saving early lets money grow more. Pay safely with UPI or cards, and never share your PIN or OTP with anyone.
    visual: 'Draw three bars: ₹1,000 now, ₹1,100 after one year, ₹1,210 after two years at 10%: each year''s growth is a little bigger than the last.'
    step_by_step: 'Step 1: Find this year''s interest on the whole amount. Step 2: Add it to the amount. Step 3: Repeat for the next year. Step 4: Compare with simple interest, which stays the same each year.'
    real_world: 'Banks and the RBI repeatedly warn: no bank official will ever ask for your OTP on a phone call.'
  picture:
    kind: bars
    bars:
    - label: Start
      value: 1000
    - label: After 1 year
      value: 1100
    - label: After 2 years
      value: 1210
    - label: After 3 years
      value: 1331
    unit: ₹
    caption: ₹1,000 at 10% compounded each year grows by more every year.
    alt: A bar chart showing ₹1,000 growing to ₹1,100, ₹1,210 and ₹1,331 over three years at 10% compound interest.
  items:
  - prompt: ₹1,000 is deposited at 10% compound interest per year. How much is there after 1 year, in rupees?
    answer: '1100'
    check: 1000*Rational(11,10)
    difficulty: 1
    hints:
    - 10% of 1000 = 100.
    - 1000 + 100.
    solution: 1000 + 100 = ₹1,100.
  - prompt: Continuing, how much is there after 2 years, in rupees?
    answer: '1210'
    check: 1000*Rational(11,10)**2
    difficulty: 2
    hints:
    - 10% of 1100 = 110.
    - 1100 + 110.
    solution: 1100 + 110 = ₹1,210.
    mistakes:
      '1200': c7ss_compound
  - prompt: With simple interest at 10% on ₹1,000, how much is there after 2 years, in rupees?
    answer: '1200'
    check: 1000 + 2*100
    difficulty: 2
    hints:
    - ₹100 interest each year.
    - 1000 + 200.
    solution: 1000 + 100 + 100 = ₹1,200.
  - prompt: What should you never share with anyone, even someone claiming to be from your bank?
    options:
    - Your OTP or PIN
    - Your name
    - Your city
    - Your school
    answer: Your OTP or PIN
    difficulty: 1
    hints:
    - Fraud warning.
    - Secret codes.
    solution: Never share OTPs, PINs or passwords.
  - prompt: 'Buying a company''s shares means you:'
    options:
    - Own a small part of the company
    - Lend money to a bank
    - Pay a tax
    - Get a fixed salary
    answer: Own a small part of the company
    difficulty: 2
    hints:
    - Stock market.
    - Part-ownership.
    solution: A share is a small part-ownership of a company.
  - prompt: Why is it good to start saving early?
    options:
    - Compounding has more time to grow the money
    - Banks close later
    - Interest is lower for the young
    - It makes no difference
    answer: Compounding has more time to grow the money
    difficulty: 2
    hints:
    - Interest on interest.
    - Time matters.
    solution: The longer money compounds, the more it grows.
