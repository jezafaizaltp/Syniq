# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 5. Format: content/README.md.
subject: cbse7-ss
chapter: 5
title: The Rise of Empires
tips:
  c7ss_ruler: "Ashoka was the grandson and ruled later. Who started the empire, two generations before him?"
  s7_arthashastra: "Indica was written by a Greek. Which book is about statecraft and economy?"
  s7_bce_gap: "In BCE, years count down. Subtract: 321 − 261."
  s7_chakra: "The wheel in the flag comes from the Sarnath pillar."
  s7_dhamma: "Artha means wealth and purpose. Ashoka's word for good conduct is the Prakrit form of the Sanskrit word for duty and right living."
  s7_dhamma_respect: "Dhamma was about kindness and tolerance, not conquest."
  s7_edicts: "There was no radio or newspaper then. Where were his messages carved?"
  s7_kalinga: "Panipat and Plassey happened much later. Ashoka's change came after a bloody war on the east coast."
  s7_magadha_rise: "Magadha had fertile land, iron and elephants. Which choice does not fit?"
  s7_megasthenes: "Indica means 'about India'. A Greek ambassador wrote it."
  s7_pataliputra: "The Mauryan capital was on the Ganga, near today's Patna."
  c7ss5_empire: 'An empire is bigger than a kingdom: one ruler controls many regions and many different peoples.'
  c7ss5_why_rise: 'List what a growing state needs: food, metal for weapons, animals for war, ways to move goods, and capable leaders. Then match.'
  c7ss5_founder: Remember the order of three generations in one family, from the founder onwards. Match each person to his place in that line.
  c7ss5_sources: Some sources were written by Indians, some by foreign visitors, and some were carved by the ruler himself. Ask who wrote each.
  c7ss5_war: One terrible war in present-day Odisha made a ruler give up conquest. Think about what he chose to follow instead.
  c7ss5_dhamma: This policy was about good conduct towards all living beings and getting along with people of every faith, not about one religion or about conquest.
  c7ss5_symbols: Modern India took its emblem and the wheel on its flag from carvings of the same ruler. Think about where they were found.
  c7ss5_dates: BCE years count down towards year 1. The larger BCE number is the earlier date.
concepts:
- code: cbse7ss.emp.maurya
  title: The rise of Magadha and the Mauryan Empire
  notes: |
    An empire is a large state ruling over many peoples and regions. Magadha grew powerful because of fertile land,
    iron mines, elephants for its army, rivers for transport, and able rulers (Bimbisara, Ajatashatru, then the
    Nandas). Around 321 BCE Chandragupta Maurya, guided by Chanakya (Kautilya, traditionally the author of the
    Arthashastra, a book on statecraft), overthrew the Nandas and founded the Mauryan Empire with its capital at
    Pataliputra (near Patna). The Greek envoy Megasthenes described Pataliputra in his Indica.
  explanations:
    text: Magadha became the strongest kingdom thanks to fertile land, iron, elephants and rivers. Chandragupta Maurya, advised by Chanakya, founded the Mauryan Empire around 321 BCE, ruling from Pataliputra, near modern Patna.
    visual: 'Draw Magadha on the Ganga with icons: rice fields, an iron mine, an elephant, and boats on the river; then a much larger shaded area showing the Mauryan Empire spreading across India.'
    step_by_step: 'Step 1: Why Magadha rose: land, iron, elephants, rivers, rulers. Step 2: Chandragupta and Chanakya found the empire. Step 3: Capital Pataliputra. Step 4: Sources: Arthashastra, Megasthenes'' Indica.'
    real_world: Patna, the capital of Bihar today, stands where Pataliputra once stood.
  picture:
    kind: flow
    steps:
    - Magadha grows strong
    - 'Rulers: Bimbisara, Ajatashatru, Nandas'
    - 'c. 321 BCE: Chandragupta Maurya overthrows the Nandas'
    - Chanakya guides the new state
    - Mauryan Empire rules from Pataliputra
    alt: 'From Magadha to empire: Magadha''s rise, the Nandas, Chandragupta Maurya''s founding of the Mauryan Empire around 321 BCE, and its capital Pataliputra.'
  activity:
    type: sort
    prompt: Why did Magadha grow powerful?
    bins:
    - Fertile land
    - Iron mines
    - Elephants
    - Rivers
    items:
    - label: Plenty of food for people and army
      bin: Fertile land
      clue: Good harvests.
      why: Fertile land.
    - label: Strong weapons and tools
      bin: Iron mines
      clue: Metal for weapons.
      why: Iron.
    - label: A powerful army animal
      bin: Elephants
      clue: From the forests.
      why: Elephants.
    - label: Easy transport and trade
      bin: Rivers
      clue: Ganga and Son.
      why: Rivers.
  lesson:
    - teach: An empire is a very large state where one ruler controls many regions and many peoples. India's first great empire grew out of Magadha, in today's Bihar.
      check:
        prompt: What makes an empire different from a small kingdom?
        options:
        - It rules many regions and peoples
        - It has no ruler
        - It is always on an island
        answer: It rules many regions and peoples
        why: An empire is a large state over many lands.
    - teach: 'Magadha grew strong for clear reasons: fertile land for food, iron mines for tools and weapons, forests with elephants for the army, rivers like the Ganga for transport, and able rulers such as Bimbisara and Ajatashatru, then the Nandas.'
      picture:
        kind: flow
        steps:
        - 'Fertile land: more food'
        - 'Iron mines: tools and weapons'
        - 'Elephants: a strong army'
        - 'Rivers: easy transport'
        - Able rulers
        alt: Five reasons why Magadha became powerful.
      check:
        prompt: Why were Magadha's elephants important?
        options:
        - They made its army stronger
        - They paid taxes
        - They wrote books
        answer: They made its army stronger
        why: War elephants were powerful in battle.
    - teach: Around 321 BCE Chandragupta Maurya, guided by Chanakya (Kautilya), overthrew the Nandas and founded the Mauryan Empire. Its capital was Pataliputra, near today's Patna. The Arthashastra, a book on running a state, is linked to Chanakya; the Greek envoy Megasthenes described Pataliputra in his Indica.
      check:
        prompt: Who guided Chandragupta Maurya?
        options:
        - Chanakya
        - Megasthenes
        - Ashoka
        answer: Chanakya
        why: Chanakya (Kautilya) was his adviser.
  items:
  - prompt: Who founded the Mauryan Empire?
    options:
    - Chandragupta Maurya
    - Ashoka
    - Bimbisara
    - Samudragupta
    answer: Chandragupta Maurya
    difficulty: 1
    hints:
    - Advised by Chanakya.
    - Around 321 BCE.
    solution: Chandragupta Maurya founded it.
    mistakes:
      Ashoka: c7ss_ruler
  - prompt: What was the capital of the Mauryan Empire?
    options:
    - Pataliputra
    - Delhi
    - Ujjain
    - Taxila
    answer: Pataliputra
    difficulty: 1
    hints:
    - Near modern Patna.
    - On the Ganga.
    solution: Pataliputra was the capital.
    mistakes: {"Delhi": "s7_pataliputra", "Taxila": "s7_pataliputra"}
  - prompt: Which book on statecraft is traditionally linked to Chanakya (Kautilya)?
    options:
    - Arthashastra
    - Indica
    - Ramayana
    - Panchatantra
    answer: Arthashastra
    difficulty: 2
    hints:
    - About running a state.
    - Artha = wealth/statecraft.
    solution: The Arthashastra is linked to Kautilya.
    mistakes: {"Indica": "s7_arthashastra"}
  - prompt: Who wrote the Indica describing Pataliputra?
    options:
    - Megasthenes
    - Chanakya
    - Ashoka
    - Kalidasa
    answer: Megasthenes
    difficulty: 2
    hints:
    - A Greek envoy.
    - Visited Chandragupta's court.
    solution: Megasthenes, a Greek ambassador, wrote the Indica.
    mistakes: {"Chanakya": "s7_megasthenes"}
  - prompt: Which was NOT a reason for Magadha's rise?
    options:
    - It was in a desert
    - Fertile land
    - Iron mines
    - Elephants for the army
    answer: It was in a desert
    difficulty: 1
    hints:
    - Magadha was on the Ganga plains.
    - Three were real reasons.
    solution: Magadha had fertile land, iron and elephants; it was not a desert.
    mistakes: {"Iron mines": "s7_magadha_rise"}
  - prompt: Chandragupta founded the empire around 321 BCE. Ashoka's Kalinga war was around 261 BCE. How many years apart are these?
    answer: '60'
    check: 321 - 261
    difficulty: 2
    hints:
    - BCE years count down.
    - 321 − 261.
    solution: 321 − 261 = 60 years.
    mistakes: {"582": "s7_bce_gap", "50": "s7_bce_gap"}
  - prompt: Which dynasty did Chandragupta Maurya overthrow?
    options:
    - The Nandas
    - The Guptas
    - The Cholas
    answer: The Nandas
    difficulty: 2
    hints:
    - They ruled Magadha just before the Mauryas.
    - The Guptas came centuries later.
    solution: Chandragupta, with Chanakya's help, overthrew the Nanda kings of Magadha.
    mistakes:
      The Guptas: c7ss5_founder
      The Cholas: c7ss5_founder
  - prompt: Pataliputra is near which modern city?
    options:
    - Patna
    - Chennai
    - Mumbai
    answer: Patna
    difficulty: 1
    hints:
    - It is in Bihar.
    - It is on the Ganga.
    solution: Pataliputra stood near present-day Patna in Bihar.
    mistakes:
      Chennai: c7ss5_why_rise
      Mumbai: c7ss5_why_rise
  - prompt: 'Megasthenes came to India from:'
    options:
    - Greece
    - China
    - Rome
    answer: Greece
    difficulty: 1
    hints:
    - He was sent by Seleucus.
    - He wrote in Greek.
    solution: Megasthenes was a Greek envoy at Chandragupta's court.
    mistakes:
      China: c7ss5_sources
      Rome: c7ss5_sources
  - prompt: 'The Arthashastra is mainly about:'
    options:
    - How to run a state
    - Stories of animals
    - Rules of cricket
    answer: How to run a state
    difficulty: 1
    hints:
    - '''Artha'' relates to wealth and government.'
    - It covers taxes, spies and officials.
    solution: 'The Arthashastra is a book on statecraft: governing, taxes, army and officials.'
    mistakes:
      Stories of animals: c7ss5_sources
      Rules of cricket: c7ss5_sources
  - prompt: Which river helped Magadha move goods and soldiers?
    options:
    - The Ganga
    - The Kaveri
    - The Narmada
    answer: The Ganga
    difficulty: 1
    hints:
    - Magadha was in the north-east plains.
    - It is India's best-known river.
    solution: The Ganga and its tributaries gave Magadha easy transport.
    mistakes:
      The Kaveri: c7ss5_why_rise
      The Narmada: c7ss5_why_rise
  - prompt: 'Ashoka was Chandragupta Maurya''s:'
    options:
    - Grandson
    - Father
    - Teacher
    answer: Grandson
    difficulty: 2
    hints:
    - Bindusara came between them.
    - Count the generations.
    solution: Chandragupta -> his son Bindusara -> Bindusara's son Ashoka, so Ashoka was the grandson.
    mistakes:
      Father: c7ss5_founder
      Teacher: c7ss5_founder
  - prompt: Why were Magadha's iron mines important?
    options:
    - For tools and weapons
    - For making coins of paper
    - For growing rice
    answer: For tools and weapons
    difficulty: 1
    hints:
    - Iron is a hard metal.
    - Armies and farmers both need it.
    solution: Iron from Magadha's mines made strong weapons and farming tools.
    mistakes:
      For making coins of paper: c7ss5_why_rise
      For growing rice: c7ss5_why_rise
  - prompt: Which is an example of a foreign source on the Mauryas?
    options:
    - Megasthenes' Indica
    - The Arthashastra
    - Ashoka's edicts
    answer: Megasthenes' Indica
    difficulty: 3
    hints:
    - Look for the writer who came from outside India.
    - The other two were made in India.
    solution: The Indica was written by a Greek visitor, so it is a foreign source.
    mistakes:
      The Arthashastra: c7ss5_sources
      Ashoka's edicts: c7ss5_sources
  - prompt: Which happened first?
    options:
    - Chandragupta founds the Mauryan Empire
    - Ashoka's Kalinga war
    - Ashoka spreads dhamma
    answer: Chandragupta founds the Mauryan Empire
    difficulty: 2
    hints:
    - Founding came before the grandson's reign.
    - 321 BCE is earlier than 261 BCE.
    solution: The empire was founded about 321 BCE; Ashoka's war came about 60 years later.
    mistakes:
      Ashoka's Kalinga war: c7ss5_dates
      Ashoka spreads dhamma: c7ss5_dates
- code: cbse7ss.emp.ashoka
  title: Ashoka and the legacy of empires
  after:
  - cbse7ss.emp.maurya
  notes: |
    Ashoka, Chandragupta's grandson, fought the Kalinga war (around 261 BCE, in present-day Odisha). Shocked by the
    killing and suffering, he gave up war and followed dhamma: non-violence, respect for elders and all religions,
    kindness to animals and servants, and welfare (wells, rest houses, hospitals for people and animals). He spread
    his message through edicts carved on rocks and pillars, mostly in Prakrit in the Brahmi script. India's
    national emblem is taken from his lion capital at Sarnath, and the Ashoka Chakra is on the national flag.
  explanations:
    text: 'After the bloody Kalinga war, Emperor Ashoka gave up conquest and ruled by dhamma: non-violence, tolerance and care for people and animals. He carved his messages on rocks and pillars. India''s national emblem and the wheel on our flag come from him.'
    visual: Picture a tall polished pillar topped by four lions back to back, with a wheel below them, and words in Brahmi script carved on its side.
    step_by_step: 'Step 1: The Kalinga war and its suffering. Step 2: Ashoka''s change of heart. Step 3: Dhamma: non-violence, tolerance, welfare. Step 4: Edicts on rocks and pillars. Step 5: Legacy: emblem and flag.'
    real_world: Every Indian currency note and coin carries the lion capital from Sarnath, and the Ashoka Chakra sits at the centre of the national flag.
  picture:
    kind: compare
    columns:
    - title: Before Kalinga
      points:
      - Expanding by war
      - Conquest of Kalinga
      - Great loss of life
    - title: After Kalinga
      points:
      - Gave up war
      - 'Dhamma: non-violence, tolerance'
      - 'Welfare: wells, hospitals'
      - Edicts on rocks and pillars
    alt: 'Ashoka before and after the Kalinga war: from conquest to ruling by dhamma, welfare and edicts.'
  activity:
    type: order
    prompt: Ashoka's story. Put it in order.
    steps:
    - Ashoka becomes king after Chandragupta and Bindusara
    - The Kalinga war (about 261 BCE)
    - Shocked by the suffering, he gives up war
    - He carves edicts about dhamma on rocks and pillars
    - His Sarnath lion capital becomes India's emblem
    reasons:
      The Kalinga war (about 261 BCE): He fought Kalinga as king, early in his reign.
      Shocked by the suffering, he gives up war: The war's horror changed him.
      He carves edicts about dhamma on rocks and pillars: He spread dhamma only after turning from war.
      His Sarnath lion capital becomes India's emblem: This happened in modern India, long after.
  lesson:
    - teach: Ashoka, Chandragupta's grandson, ruled most of the subcontinent. Around 261 BCE he attacked Kalinga (present-day Odisha). He won, but thousands were killed, hurt or made captive.
      check:
        prompt: Where was Kalinga?
        options:
        - Present-day Odisha
        - Present-day Kerala
        - Present-day Punjab
        answer: Present-day Odisha
        why: Kalinga lay on the east coast, in today's Odisha.
    - teach: 'Shocked by the suffering, Ashoka gave up war and followed dhamma: non-violence, respect for elders, teachers and all religions, kindness to servants and animals, and public welfare such as wells, rest houses, shade trees and hospitals for people and animals.'
      picture:
        kind: compare
        columns:
        - title: Before Kalinga
          points:
          - conquest by war
          - more land
        - title: After Kalinga
          points:
          - dhamma
          - kindness and welfare
          - respect for all faiths
        alt: Ashoka changed from conquest to dhamma after the Kalinga war.
      check:
        prompt: Which action fits Ashoka's dhamma?
        options:
        - Building wells and rest houses
        - Starting a new war
        - Banning other religions
        answer: Building wells and rest houses
        why: Dhamma included care for people's welfare.
    - teach: Ashoka had his messages carved on rocks and pillars (edicts), mostly in Prakrit using the Brahmi script, so officials could read them aloud to people. His lion capital at Sarnath is India's national emblem, and the Ashoka Chakra is on our flag.
      check:
        prompt: Why were the edicts carved in stone?
        options:
        - So the messages would last and reach people
        - To decorate palaces only
        - To hide them
        answer: So the messages would last and reach people
        why: Stone lasts and stood where people passed.
  items:
  - prompt: Which war changed Ashoka's heart?
    options:
    - The Kalinga war
    - The Battle of Panipat
    - The Kurukshetra war
    - The Battle of Plassey
    answer: The Kalinga war
    difficulty: 1
    hints:
    - In present-day Odisha.
    - Around 261 BCE.
    solution: The suffering of the Kalinga war changed him.
    mistakes: {"The Kurukshetra war": "s7_kalinga"}
  - prompt: What did Ashoka call his policy of good conduct?
