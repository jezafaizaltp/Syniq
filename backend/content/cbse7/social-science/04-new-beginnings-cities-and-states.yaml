    - "To keep the rain out of their streets"
    - "To stop all trade with other towns"
    answer: They feared attacks from other states
    difficulty: 2
    hints:
    - The states often fought each other.
    - Think about defence.
    solution: Mahajanapadas often fought; walls and moats protected the capital and its wealth.
    mistakes:
      "To keep the rain out of their streets": c7ss4_defence
      "To stop all trade with other towns": c7ss4_defence
  - prompt: 'Assertion (A): Farming spread quickly across the Ganga plains in the age of the mahajanapadas.

      Reason (R): Iron tools helped farmers to clear forests and work the land.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Iron axes and ploughshares cleared thick forest and broke hard soil, so more land could be farmed; R explains A.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): Every mahajanapada was ruled by a king.

      Reason (R): The Vajji were run by an assembly of elders.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: some mahajanapadas, such as the Vajji, were ganas with no single king. R is true, and it is the reason A fails.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A traveller of the 6th century BCE visits two states. In the first, a king gives the orders and his son will rule after him. In the second, the heads of clans meet in a hall, discuss and decide together. What kind of state is each?'
    options:
    - The first is a monarchy and the second is a gana
    - Both are monarchies
    - The first is a gana and the second is a monarchy
    answer: The first is a monarchy and the second is a gana
    hints:
    - Ask who makes the decisions in each state.
    - One ruler whose son follows him is one kind; an assembly that discusses is the other.
    solution: One king whose son follows him is a monarchy. Clan heads who meet, discuss and decide form a gana or sangha.
