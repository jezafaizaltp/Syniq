      Both are monarchies: c7ss4_rule
      The first is a gana and the second is a monarchy: c7ss4_rule
    exam: case
    difficulty: 2
  - prompt: 'Situation: A class draws a timeline. The Harappan cities are at their height from about 2600 to 1900 BCE. Then comes a long gap with few big towns. From about the 6th century BCE, new cities rise in the Ganga plains. Why do historians call these new cities the ''second'' urbanisation?'
    options:
    - Cities had grown once before, in the Harappan age
    - Only two cities were built
    - The new cities lasted for two centuries
    answer: Cities had grown once before, in the Harappan age
    hints:
    - Look at the whole timeline, not only the Ganga plains.
    - What came before the long gap?
    solution: The Harappan cities were India's first urbanisation. After a long gap, cities grew again in the Ganga plains, so this growth is the second.
    mistakes:
      Only two cities were built: pqc7ss4_second
      The new cities lasted for two centuries: pqc7ss4_second
    exam: competency
    difficulty: 2
- code: cbse7ss.city.economy
  title: Governance, trade and society in early states
  after:
  - cbse7ss.city.janapada
  notes: |
    Kings collected taxes (often a share of crops, called bhaga), kept armies and appointed officials. Punch-marked
    coins of silver and copper came into use, helping trade. Trade routes such as the Uttarapatha (northern route)
    and Dakshinapatha (southern route) linked regions; guilds (shrenis) organised craftspeople and merchants.
    Society had varna (four broad groups) and many jatis (occupational communities); over time this became more
    rigid. Teachers such as the Buddha and Mahavira taught in this period.
  explanations:
    text: Early kingdoms collected taxes, kept armies, and used the first Indian coins (punch-marked coins) for trade along long routes. Craftspeople formed guilds. Society was divided into varnas and many jatis. The Buddha and Mahavira taught in this time.
    visual: 'Picture a market in a walled city: traders with bullock carts from the Uttarapatha, a guild of potters, a tax collector counting grain, and silver punch-marked coins changing hands.'
    step_by_step: 'Step 1: Rulers: taxes, armies, officials. Step 2: Economy: coins, trade routes, guilds. Step 3: Society: varna and jati. Step 4: Ideas: new teachers like the Buddha and Mahavira.'
    real_world: Punch-marked coins, found all over India, are among the earliest coins in the world.
  picture:
    kind: compare
    columns:
    - title: Economy
      points:
      - Punch-marked coins
      - 'Trade routes: Uttarapatha, Dakshinapatha'
      - Guilds (shrenis)
    - title: Governance and society
      points:
      - Taxes on crops
      - Armies and officials
      - Varna and jati groups
    alt: Early states' economy (coins, trade routes, guilds) and governance and society (taxes, armies, varna and jati).
  activity:
    type: sort
    prompt: What is it?
    bins:
    - Tax
    - Coin
    - Trade route
    - Guild
    items:
    - label: Bhaga, a share of the crop
      bin: Tax
      clue: Paid to the king.
      why: Tax.
    - label: Punch-marked silver pieces
      bin: Coin
      clue: Used to buy and sell.
      why: Coin.
    - label: Uttarapatha
      bin: Trade route
      clue: Northern road.
      why: Trade route.
    - label: Dakshinapatha
      bin: Trade route
      clue: Southern road.
      why: Trade route.
    - label: Shreni of craftspeople
      bin: Guild
      clue: Merchants and artisans organised.
      why: Guild.
  lesson:
    - teach: Rulers of the mahajanapadas needed armies and officials, so they collected taxes. The main tax was a share of crops, often called bhaga (about one-sixth). Craftspeople, herders and traders also paid in goods, labour or money.
      check:
        prompt: What was bhaga?
        options:
        - A share of crops paid as tax
        - A trade route
        - A kind of guild
        answer: A share of crops paid as tax
        why: Bhaga means a share, taken from farmers' harvest.
      ways:
      - style: visual
        teach: Where the ruler's income came from and what it paid for.
        picture:
          kind: flow
          steps:
          - Farmers bring in the harvest
          - A share, the bhaga, goes to the ruler
          - Craftspeople, herders and traders pay in goods, labour or money
          - The ruler pays the army and the officials
          alt: Farmers harvest crops and give a share called bhaga to the ruler; craftspeople, herders and traders also pay; the ruler uses this to pay the army and officials.
      - style: real_world
        teach: Today people pay tax on what they earn and on what they buy, and governments use it for soldiers, roads and schools. In the mahajanapadas most people were farmers, so the main tax was simply a part of the grain they grew.
    - teach: 'Punch-marked coins of silver and copper appeared: metal pieces stamped with symbols. Coins made trade much easier than barter. Traders used long routes: the Uttarapatha in the north and the Dakshinapatha to the south. Guilds (shrenis) organised people of the same craft or trade.'
      picture:
        kind: compare
        columns:
        - title: Uttarapatha
          points:
          - northern route
          - Gandhara to the Ganga plains
        - title: Dakshinapatha
          points:
          - southern route
          - Ganga plains to the Deccan
        alt: 'Two great trade routes: Uttarapatha in the north and Dakshinapatha to the south.'
      check:
        prompt: What did a shreni do?
        options:
        - Organised people of one trade
        - Ruled a kingdom
        - Collected rain water
        answer: Organised people of one trade
        why: A shreni was a guild of craftspeople or merchants.
      ways:
      - style: step_by_step
        teach: 'Step 1: Stand in the Ganga plains with a cart of goods. Step 2: ''Uttara'' means north: the Uttarapatha is the great road running across the north. Step 3: ''Dakshina'' means south: the Dakshinapatha leads down towards the Deccan. Step 4: Carry stamped silver and copper coins, and you can buy and sell anywhere on the way.'
      - style: real_world
        teach: In many markets today the shopkeepers have an association. It settles quarrels, agrees on fair practice and speaks for its members. A shreni did the same job for weavers, potters or merchants two and a half thousand years ago.
    - teach: Society had four broad varnas and many jatis, communities linked to work. Over time these became more rigid. Teachers such as the Buddha and Mahavira questioned costly rituals and taught non-violence and a simple, good life, open to all.
      check:
        prompt: What did both the Buddha and Mahavira teach?
        options:
        - Non-violence and simple living
        - Costly sacrifices
        - War against neighbours
        answer: Non-violence and simple living
        why: Both turned away from violence and rituals.
      ways:
      - style: visual
        teach: What the Buddha and Mahavira questioned, and what they taught instead.
        picture:
          kind: compare
          columns:
          - title: They questioned
            points:
            - Costly rituals
            - Divisions that were growing rigid
          - title: They taught
            points:
            - Non-violence
            - A simple, good life
            - A path open to all
          alt: The Buddha and Mahavira questioned costly rituals and rigid divisions; they taught non-violence and a simple, good life on a path open to all.
      - style: real_world
        teach: Pilgrims from many countries still travel to Bodh Gaya in Bihar, linked with the Buddha, and Jain temples stand in towns all over India. The ideas of two teachers from the age of the mahajanapadas are still followed today.
  items:
  - prompt: What were the earliest Indian coins called?
    options:
    - Punch-marked coins
    - Gold mohurs
    - Rupees
    - Paper notes
    answer: Punch-marked coins
    difficulty: 1
    hints:
    - Symbols punched on metal.
