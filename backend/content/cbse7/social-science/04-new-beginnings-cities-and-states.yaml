# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 4. Format: content/README.md.
subject: cbse7-ss
chapter: 4
title: 'New Beginnings: Cities and States'
tips:
  c7ss_gana: "Magadha and Kosala had kings. Look for the mahajanapada known as a confederacy of clans run by an assembly, near Vaishali."
  s7_buddha_mahavira: "Guru Nanak and Kabir lived 2,000 years later. Who taught in the 6th century BCE?"
  s7_city_walls: "Capitals had to be defended. What did people build around them?"
  s7_coins_trade: "Barter needs both sides to want each other's goods. What did coins fix?"
  s7_crop_tax: "Most people were farmers. What could a king collect from them?"
  s7_iron_tools: "Iron axes and ploughs were stronger. What did they help people do?"
  s7_janapada: "'Jana' means people and 'pada' means foot or place."
  s7_punch_marked: "Rupees and mohurs came much later. The earliest coins had symbols punched into silver."
  s7_second_urban: "The first cities were Harappan. The second came on the fertile river plains of the north."
  s7_shreni: "A shreni was a group with a shared trade."
  s7_sixteen: "The texts list a fixed number of great janapadas: between 15 and 17."
  c7ss4_rule: Some states had one ruler who passed power to a son; others were run by a council of elders who met and discussed. Match the state to the way it was run.
  c7ss4_place: Look at where rivers, fertile soil and forests met. The new towns grew where farming could feed many people.
  c7ss4_land: Think about the tool or metal that let farmers clear thick forest and plough hard soil.
  c7ss4_defence: Capitals feared attack from neighbours. Ask what was built around a city to keep enemies out.
  c7ss4_money: Before money, people swapped goods. Ask what a standard metal piece changed about buying and selling.
  c7ss4_groups: Craftspeople and merchants of the same trade joined together to set rules, prices and quality. Think about what such a group did.
  c7ss4_roads: Long routes joined regions in different directions. Think about which direction each route ran.
  c7ss4_tax: A ruler needed money for an army and officials. Think about what most people produced that could be shared with the ruler.
  c7ss4_society: Society had a few broad groups and many smaller communities based on work. Think about how these changed over time.
  c7ss4_teachers: Two great teachers of this period questioned rituals and taught a simple, kind way of life. Think about what they taught.
concepts:
- code: cbse7ss.city.janapada
  title: 'Second urbanisation: janapadas and mahajanapadas'
  notes: |
    After the Harappan cities declined, a 'second urbanisation' began around the 6th century BCE in the Ganga
    plains. Janapadas were territories where a people (jana) settled. Larger ones became mahajanapadas; Buddhist and
    Jain texts list sixteen, such as Magadha, Kosala, Vatsa, Avanti, Kuru, Panchala, Gandhara and Vajji. Some were
    ruled by kings (monarchies, like Magadha); others, like the Vajji and Shakya, by assemblies (ganas or sanghas).
    Capitals had fortifications and moats. Iron tools helped clear forests and farm more land.
  explanations:
    text: About 2,500 years ago, new cities and kingdoms grew in the Ganga plains. Small territories called janapadas joined into sixteen big ones, the mahajanapadas, like Magadha and Kosala. Some had kings; some were run by assemblies.
    visual: Draw the Ganga plain dotted with sixteen named territories; mark Magadha in the east, and draw a wall and moat around a capital city like Rajagriha.
    step_by_step: 'Step 1: Janapada: land of a people. Step 2: Mahajanapada: a large, powerful janapada (sixteen listed). Step 3: Two kinds of rule: kings or assemblies. Step 4: Iron tools and farming helped them grow.'
    real_world: Vaishali, capital of the Vajji, is often called one of the world's early republics because an assembly made decisions.
  picture:
    kind: compare
    columns:
    - title: Monarchy
      points:
      - Ruled by a king
      - Power often passed to his son
      - 'Example: Magadha, Kosala'
    - title: Gana or sangha
      points:
      - Ruled by an assembly
      - Many people discussed decisions
      - 'Example: Vajji, Shakya'
    alt: 'Two kinds of mahajanapada government: monarchies ruled by kings, and ganas or sanghas ruled by assemblies.'
  activity:
    type: sort
    prompt: Monarchy or gana (assembly rule)?
    bins:
    - Monarchy
    - Gana / sangha
    items:
    - label: Magadha
      bin: Monarchy
      clue: Ruled by kings like Bimbisara.
      why: Monarchy.
    - label: Vajji
      bin: Gana / sangha
      clue: Many leaders in an assembly.
      why: Gana.
    - label: Shakya
      bin: Gana / sangha
      clue: The Buddha's clan.
      why: Gana.
    - label: Kosala
      bin: Monarchy
      clue: Ruled by a king.
      why: Monarchy.
  lesson:
    - teach: After the Harappan cities faded, India had few big towns for many centuries. Then, around the 6th century BCE, towns and cities grew again in the Ganga plains. Historians call this the second urbanisation.
      picture:
        kind: flow
        steps:
        - Harappan cities (about 2600-1900 BCE)
        - Villages for many centuries
        - Second urbanisation in the Ganga plains (from about 600 BCE)
        alt: Harappan cities, then a long village period, then new cities in the Ganga plains.
      check:
        prompt: Where did the second urbanisation begin?
        options:
        - In the Ganga plains
        - In the Thar desert
        - In the Himalayas
        answer: In the Ganga plains
        why: Fertile river land could feed many town people.
    - teach: A janapada was the land where a people (jana) settled. Bigger and stronger ones were called mahajanapadas ('great janapadas'). Buddhist and Jain texts list sixteen, including Magadha, Kosala, Vatsa, Avanti, Kuru, Panchala, Gandhara and Vajji.
      check:
        prompt: What does 'maha' add to 'janapada'?
        options:
        - Great or large
        - Small
        - Old
        answer: Great or large
        why: A mahajanapada was a great, large janapada.
    - teach: Not all of them had kings. Magadha and Kosala were monarchies, ruled by a king. The Vajji and Shakya were ganas or sanghas, run by an assembly of elders who met and discussed. Capitals had walls and moats, and iron tools helped farmers clear forests and grow more food.
      picture:
        kind: compare
        columns:
        - title: Monarchy
          points:
          - one king
          - power passes in the family
          - e.g. Magadha
        - title: Gana / sangha
          points:
          - assembly of elders
          - decisions after discussion
          - e.g. Vajji
        alt: A monarchy has one king; a gana is run by an assembly.
      check:
        prompt: Who made decisions in a gana like the Shakya?
        options:
        - An assembly of elders
        - One king alone
        - Foreign governors
        answer: An assembly of elders
        why: Ganas were run by assemblies, not a single king.
  items:
  - prompt: How many mahajanapadas are listed in Buddhist and Jain texts?
    answer: '16'
    check: '16'
    difficulty: 1
    hints:
    - '''Solasa mahajanapada''.'
    - Sixteen.
    solution: Sixteen mahajanapadas are listed.
    mistakes: {"18": "s7_sixteen", "12": "s7_sixteen"}
  - prompt: What did 'janapada' originally mean?
    options:
    - The land where a people (jana) settled
    - A temple
    - A river
    - A coin
    answer: The land where a people (jana) settled
    difficulty: 2
    hints:
    - Jana = people.
    - Pada = foot, place.
    solution: Janapada means the place where a jana settled.
    mistakes: {"A temple": "s7_janapada"}
  - prompt: Which mahajanapada was ruled by an assembly (gana)?
    options:
    - Vajji
    - Magadha
    - Kosala
    - Avanti
    answer: Vajji
    difficulty: 2
    hints:
    - Capital Vaishali.
    - Not a monarchy.
    solution: The Vajji confederacy was ruled by an assembly.
    mistakes:
      Magadha: c7ss_gana
  - prompt: In which region did the second urbanisation begin?
    options:
    - The Ganga plains
    - The Thar Desert
    - The Deccan Plateau
    - Ladakh
    answer: The Ganga plains
    difficulty: 1
    hints:
    - Fertile river plains.
    - North India.
    solution: It began in the fertile Ganga plains.
    mistakes: {"The Deccan Plateau": "s7_second_urban"}
  - prompt: Why did iron tools matter for the mahajanapadas?
    options:
    - They helped clear forests and farm more land
    - They were used as money only
    - They made people lazy
    - They stopped trade
    answer: They helped clear forests and farm more land
    difficulty: 2
    hints:
    - More farmland.
    - More food, bigger towns.
    solution: Iron axes and ploughs increased farming and food.
    mistakes: {"They were used as money only": "s7_iron_tools"}
  - prompt: 'Capitals of mahajanapadas were often protected by:'
    options:
    - Walls and moats
    - Glass domes
    - Electric fences
    - Nothing
    answer: Walls and moats
    difficulty: 1
    hints:
    - Defence.
    - Fortifications.
    solution: Fortification walls and moats protected them.
    mistakes: {"Nothing": "s7_city_walls"}
  - prompt: Which mahajanapada was a monarchy that later grew into a big empire?
    options:
    - Magadha
    - Vajji
    - Shakya
    answer: Magadha
    difficulty: 1
    hints:
    - It was ruled by kings.
    - It was in present-day Bihar.
    solution: Magadha was ruled by kings and grew into the largest state, later the base of the Mauryan Empire.
    mistakes:
      Vajji: c7ss4_rule
      Shakya: c7ss4_rule
  - prompt: The Buddha was born into which gana?
    options:
    - The Shakya
    - The Kuru
    - The Avanti
    answer: The Shakya
    difficulty: 2
    hints:
    - One of his names is Shakyamuni.
    - It was run by an assembly.
    solution: Siddhartha Gautama was born into the Shakya gana; he is also called Shakyamuni.
    mistakes:
      The Kuru: c7ss4_rule
      The Avanti: c7ss4_rule
  - prompt: Why did towns grow in the Ganga plains rather than in dry areas?
    options:
    - Fertile land could feed many people
    - There were no rivers there
    - It was always cold there
    answer: Fertile land could feed many people
    difficulty: 1
    hints:
    - Town people do not grow their own food.
    - Think about the soil near big rivers.
    solution: The rich soil of the Ganga plains gave enough food for people living in towns.
    mistakes:
      There were no rivers there: c7ss4_place
      It was always cold there: c7ss4_place
  - prompt: 'The word ''jana'' in janapada means:'
    options:
    - A people or tribe
    - A river
    - A fort
    answer: A people or tribe
    difficulty: 1
    hints:
    - Janapada = jana + pada (foot, place).
    - It is the place where a group set foot and settled.
    solution: Jana means a people; a janapada is where a people settled.
    mistakes:
      A river: c7ss4_place
      A fort: c7ss4_defence
  - prompt: How was a gana different from a monarchy?
    options:
    - It was run by an assembly, not one king
    - It had no people
    - It had no land
    answer: It was run by an assembly, not one king
    difficulty: 2
    hints:
    - Think about who decided things.
    - In a monarchy one person rules.
    solution: In a gana, an assembly of elders met and decided; in a monarchy, the king ruled.
    mistakes:
      It had no people: c7ss4_rule
      It had no land: c7ss4_rule
  - prompt: 'A moat is:'
    options:
    - A deep ditch, often filled with water, around a city
    - A tax on crops
    - A kind of coin
    answer: A deep ditch, often filled with water, around a city
    difficulty: 1
    hints:
    - It was part of a city's defence.
    - Enemies had to cross it to reach the wall.
    solution: A moat is a water-filled ditch around a city wall that makes attack harder.
    mistakes:
      A tax on crops: c7ss4_defence
      A kind of coin: c7ss4_defence
  - prompt: Which metal's tools let farmers clear the thick Ganga forests?
    options:
    - Iron
    - Gold
    - Silver
    answer: Iron
    difficulty: 1
    hints:
    - It is hard and strong.
    - Axes and ploughshares were made from it.
    solution: Iron axes and ploughshares helped clear forests and farm more land.
    mistakes:
      Gold: c7ss4_land
      Silver: c7ss4_land
  - prompt: Which pair are both mahajanapadas?
    options:
    - Kosala and Avanti
    - Harappa and Lothal
    - Delhi and Mumbai
    answer: Kosala and Avanti
    difficulty: 2
    hints:
    - Harappa and Lothal are much older cities.
    - The list of sixteen has these two names.
    solution: Kosala and Avanti are among the sixteen mahajanapadas; Harappa and Lothal are Harappan sites.
    mistakes:
      Harappa and Lothal: c7ss4_place
      Delhi and Mumbai: c7ss4_place
  - prompt: Why did mahajanapadas build strong walls around their capitals?
    options:
    - They feared attacks from other states
    - To keep out the rain
    - To stop trade
    answer: They feared attacks from other states
    difficulty: 2
    hints:
    - The states often fought each other.
    - Think about defence.
    solution: Mahajanapadas often fought; walls and moats protected the capital and its wealth.
    mistakes:
      To keep out the rain: c7ss4_defence
      To stop trade: c7ss4_defence
- code: cbse7ss.city.economy
  title: Governance, trade and society in early states
  after:
  - cbse7ss.city.janapada
  notes: |
    Kings collected taxes (often a share of crops, called bhaga), kept armies and appointed officials. Punch-marked
    coins of silver and copper came into use, helping trade. Trade routes such as the Uttarapatha (northern route)
    and Dakshinapatha (southern route) linked regions; guilds (shrenis) organised craftspeople and merchants.
    Society had varna (four broad groups) and many jatis (occupational communities); over time this became more
    rigid. Teachers such as the Buddha and Mahavira taught in this period.
  explanations:
    text: Early kingdoms collected taxes, kept armies, and used the first Indian coins (punch-marked coins) for trade along long routes. Craftspeople formed guilds. Society was divided into varnas and many jatis. The Buddha and Mahavira taught in this time.
    visual: 'Picture a market in a walled city: traders with bullock carts from the Uttarapatha, a guild of potters, a tax collector counting grain, and silver punch-marked coins changing hands.'
    step_by_step: 'Step 1: Rulers: taxes, armies, officials. Step 2: Economy: coins, trade routes, guilds. Step 3: Society: varna and jati. Step 4: Ideas: new teachers like the Buddha and Mahavira.'
    real_world: Punch-marked coins, found all over India, are among the earliest coins in the world.
  picture:
    kind: compare
    columns:
    - title: Economy
      points:
      - Punch-marked coins
      - 'Trade routes: Uttarapatha, Dakshinapatha'
      - Guilds (shrenis)
    - title: Governance and society
      points:
      - Taxes on crops
      - Armies and officials
      - Varna and jati groups
    alt: Early states' economy (coins, trade routes, guilds) and governance and society (taxes, armies, varna and jati).
  activity:
    type: sort
    prompt: What is it?
    bins:
    - Tax
    - Coin
    - Trade route
    - Guild
    items:
    - label: Bhaga, a share of the crop
      bin: Tax
      clue: Paid to the king.
      why: Tax.
    - label: Punch-marked silver pieces
      bin: Coin
      clue: Used to buy and sell.
      why: Coin.
    - label: Uttarapatha
      bin: Trade route
      clue: Northern road.
      why: Trade route.
    - label: Dakshinapatha
      bin: Trade route
      clue: Southern road.
      why: Trade route.
    - label: Shreni of craftspeople
      bin: Guild
      clue: Merchants and artisans organised.
      why: Guild.
  lesson:
    - teach: Rulers of the mahajanapadas needed armies and officials, so they collected taxes. The main tax was a share of crops, often called bhaga (about one-sixth). Craftspeople, herders and traders also paid in goods, labour or money.
      check:
        prompt: What was bhaga?
        options:
        - A share of crops paid as tax
        - A trade route
        - A kind of guild
        answer: A share of crops paid as tax
        why: Bhaga means a share, taken from farmers' harvest.
    - teach: 'Punch-marked coins of silver and copper appeared: metal pieces stamped with symbols. Coins made trade much easier than barter. Traders used long routes: the Uttarapatha in the north and the Dakshinapatha to the south. Guilds (shrenis) organised people of the same craft or trade.'
      picture:
        kind: compare
        columns:
        - title: Uttarapatha
          points:
          - northern route
          - Gandhara to the Ganga plains
        - title: Dakshinapatha
          points:
          - southern route
          - Ganga plains to the Deccan
        alt: 'Two great trade routes: Uttarapatha in the north and Dakshinapatha to the south.'
      check:
        prompt: What did a shreni do?
        options:
        - Organised people of one trade
        - Ruled a kingdom
        - Collected rain water
        answer: Organised people of one trade
        why: A shreni was a guild of craftspeople or merchants.
    - teach: Society had four broad varnas and many jatis, communities linked to work. Over time these became more rigid. Teachers such as the Buddha and Mahavira questioned costly rituals and taught non-violence and a simple, good life, open to all.
      check:
        prompt: What did both the Buddha and Mahavira teach?
        options:
        - Non-violence and simple living
        - Costly sacrifices
        - War against neighbours
        answer: Non-violence and simple living
        why: Both turned away from violence and rituals.
  items:
  - prompt: What were the earliest Indian coins called?
    options:
    - Punch-marked coins
    - Gold mohurs
    - Rupees
    - Paper notes
    answer: Punch-marked coins
    difficulty: 1
    hints:
    - Symbols punched on metal.
    - Silver and copper.
    solution: The earliest coins were punch-marked coins.
    mistakes: {"Gold mohurs": "s7_punch_marked", "Rupees": "s7_punch_marked"}
  - prompt: 'A shreni was a:'
    options:
    - Guild of craftspeople or merchants
    - Kind of tax
    - Temple
    - Weapon
    answer: Guild of craftspeople or merchants
    difficulty: 2
    hints:
    - Organised workers.
    - Like a union.
    solution: Shrenis were guilds.
    mistakes: {"Temple": "s7_shreni", "Kind of tax": "s7_shreni"}
  - prompt: 'The Uttarapatha was a:'
