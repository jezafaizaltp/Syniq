# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 4. Format: content/README.md.
subject: cbse7-ss
chapter: 4
title: 'New Beginnings: Cities and States'
tips:
  c7ss_gana: Ganas or sanghas (like the Vajji) were run by assemblies; Magadha and Kosala had kings.
concepts:
- code: cbse7ss.city.janapada
  title: 'Second urbanisation: janapadas and mahajanapadas'
  notes: |
    After the Harappan cities declined, a 'second urbanisation' began around the 6th century BCE in the Ganga
    plains. Janapadas were territories where a people (jana) settled. Larger ones became mahajanapadas; Buddhist and
    Jain texts list sixteen, such as Magadha, Kosala, Vatsa, Avanti, Kuru, Panchala, Gandhara and Vajji. Some were
    ruled by kings (monarchies, like Magadha); others, like the Vajji and Shakya, by assemblies (ganas or sanghas).
    Capitals had fortifications and moats. Iron tools helped clear forests and farm more land.
  explanations:
    text: About 2,500 years ago, new cities and kingdoms grew in the Ganga plains. Small territories called janapadas joined into sixteen big ones, the mahajanapadas, like Magadha and Kosala. Some had kings; some were run by assemblies.
    visual: Draw the Ganga plain dotted with sixteen named territories; mark Magadha in the east, and draw a wall and moat around a capital city like Rajagriha.
    step_by_step: 'Step 1: Janapada: land of a people. Step 2: Mahajanapada: a large, powerful janapada (sixteen listed). Step 3: Two kinds of rule: kings or assemblies. Step 4: Iron tools and farming helped them grow.'
    real_world: Vaishali, capital of the Vajji, is often called one of the world's early republics because an assembly made decisions.
  picture:
    kind: compare
    columns:
    - title: Monarchy
      points:
      - Ruled by a king
      - Power often passed to his son
      - 'Example: Magadha, Kosala'
    - title: Gana or sangha
      points:
      - Ruled by an assembly
      - Many people discussed decisions
      - 'Example: Vajji, Shakya'
    alt: 'Two kinds of mahajanapada government: monarchies ruled by kings, and ganas or sanghas ruled by assemblies.'
  activity:
    type: sort
    prompt: Monarchy or gana (assembly rule)?
    bins:
    - Monarchy
    - Gana / sangha
    items:
    - label: Magadha
      bin: Monarchy
      clue: Ruled by kings like Bimbisara.
      why: Monarchy.
    - label: Vajji
      bin: Gana / sangha
      clue: Many leaders in an assembly.
      why: Gana.
    - label: Shakya
      bin: Gana / sangha
      clue: The Buddha's clan.
      why: Gana.
    - label: Kosala
      bin: Monarchy
      clue: Ruled by a king.
      why: Monarchy.
  items:
  - prompt: How many mahajanapadas are listed in Buddhist and Jain texts?
    answer: '16'
    check: '16'
    difficulty: 1
    hints:
    - '''Solasa mahajanapada''.'
    - Sixteen.
    solution: Sixteen mahajanapadas are listed.
  - prompt: What did 'janapada' originally mean?
    options:
    - The land where a people (jana) settled
    - A temple
    - A river
    - A coin
    answer: The land where a people (jana) settled
    difficulty: 2
    hints:
    - Jana = people.
    - Pada = foot, place.
    solution: Janapada means the place where a jana settled.
  - prompt: Which mahajanapada was ruled by an assembly (gana)?
    options:
    - Vajji
    - Magadha
    - Kosala
    - Avanti
    answer: Vajji
    difficulty: 2
    hints:
    - Capital Vaishali.
    - Not a monarchy.
    solution: The Vajji confederacy was ruled by an assembly.
    mistakes:
      Magadha: c7ss_gana
  - prompt: In which region did the second urbanisation begin?
    options:
    - The Ganga plains
    - The Thar Desert
    - The Deccan Plateau
    - Ladakh
    answer: The Ganga plains
    difficulty: 1
    hints:
    - Fertile river plains.
    - North India.
    solution: It began in the fertile Ganga plains.
  - prompt: Why did iron tools matter for the mahajanapadas?
    options:
    - They helped clear forests and farm more land
    - They were used as money only
    - They made people lazy
    - They stopped trade
    answer: They helped clear forests and farm more land
    difficulty: 2
    hints:
    - More farmland.
    - More food, bigger towns.
    solution: Iron axes and ploughs increased farming and food.
  - prompt: 'Capitals of mahajanapadas were often protected by:'
    options:
    - Walls and moats
    - Glass domes
    - Electric fences
    - Nothing
    answer: Walls and moats
    difficulty: 1
    hints:
    - Defence.
    - Fortifications.
    solution: Fortification walls and moats protected them.
- code: cbse7ss.city.economy
  title: Governance, trade and society in early states
  after:
  - cbse7ss.city.janapada
  notes: |
    Kings collected taxes (often a share of crops, called bhaga), kept armies and appointed officials. Punch-marked
    coins of silver and copper came into use, helping trade. Trade routes such as the Uttarapatha (northern route)
    and Dakshinapatha (southern route) linked regions; guilds (shrenis) organised craftspeople and merchants.
    Society had varna (four broad groups) and many jatis (occupational communities); over time this became more
    rigid. Teachers such as the Buddha and Mahavira taught in this period.
  explanations:
    text: Early kingdoms collected taxes, kept armies, and used the first Indian coins (punch-marked coins) for trade along long routes. Craftspeople formed guilds. Society was divided into varnas and many jatis. The Buddha and Mahavira taught in this time.
    visual: 'Picture a market in a walled city: traders with bullock carts from the Uttarapatha, a guild of potters, a tax collector counting grain, and silver punch-marked coins changing hands.'
    step_by_step: 'Step 1: Rulers: taxes, armies, officials. Step 2: Economy: coins, trade routes, guilds. Step 3: Society: varna and jati. Step 4: Ideas: new teachers like the Buddha and Mahavira.'
    real_world: Punch-marked coins, found all over India, are among the earliest coins in the world.
  picture:
    kind: compare
    columns:
    - title: Economy
      points:
      - Punch-marked coins
      - 'Trade routes: Uttarapatha, Dakshinapatha'
      - Guilds (shrenis)
    - title: Governance and society
      points:
      - Taxes on crops
      - Armies and officials
      - Varna and jati groups
    alt: Early states' economy (coins, trade routes, guilds) and governance and society (taxes, armies, varna and jati).
  activity:
    type: sort
    prompt: What is it?
    bins:
    - Tax
    - Coin
    - Trade route
    - Guild
    items:
    - label: Bhaga, a share of the crop
      bin: Tax
      clue: Paid to the king.
      why: Tax.
    - label: Punch-marked silver pieces
      bin: Coin
      clue: Used to buy and sell.
      why: Coin.
    - label: Uttarapatha
      bin: Trade route
      clue: Northern road.
      why: Trade route.
    - label: Dakshinapatha
      bin: Trade route
      clue: Southern road.
      why: Trade route.
    - label: Shreni of craftspeople
      bin: Guild
      clue: Merchants and artisans organised.
      why: Guild.
  items:
  - prompt: What were the earliest Indian coins called?
    options:
    - Punch-marked coins
    - Gold mohurs
    - Rupees
    - Paper notes
    answer: Punch-marked coins
    difficulty: 1
    hints:
    - Symbols punched on metal.
    - Silver and copper.
    solution: The earliest coins were punch-marked coins.
  - prompt: 'A shreni was a:'
    options:
    - Guild of craftspeople or merchants
    - Kind of tax
    - Temple
    - Weapon
    answer: Guild of craftspeople or merchants
    difficulty: 2
    hints:
    - Organised workers.
    - Like a union.
    solution: Shrenis were guilds.
  - prompt: 'The Uttarapatha was a:'
    options:
    - Northern trade route
    - River
    - King
    - Coin
    answer: Northern trade route
    difficulty: 2
    hints:
    - Uttara = north.
    - Path.
    solution: Uttarapatha was the great northern route.
    mistakes:
      River: c7ss_read_again
  - prompt: 'Kings mainly collected taxes as:'
    options:
    - A share of crops
    - Mobile phones
    - Paper money
    - Nothing
    answer: A share of crops
    difficulty: 1
    hints:
    - Farming economy.
    - Bhaga.
    solution: Taxes were often a share of the harvest.
  - prompt: Which two religious teachers lived in this period?
    options:
    - The Buddha and Mahavira
    - Guru Nanak and Kabir
    - Ashoka and Akbar
    - Shankara and Ramanuja
    answer: The Buddha and Mahavira
    difficulty: 1
    hints:
    - 6th–5th century BCE.
    - Buddhism and Jainism.
    solution: The Buddha and Mahavira taught in the age of the mahajanapadas.
  - prompt: How did coins help the economy?
    options:
    - They made trade easier than barter
    - They replaced farming
    - They stopped taxes
    - They were only decorations
    answer: They made trade easier than barter
    difficulty: 2
    hints:
    - Exchanging goods directly is hard.
    - Coins carry value.
    solution: Coins made buying and selling easier than swapping goods.
