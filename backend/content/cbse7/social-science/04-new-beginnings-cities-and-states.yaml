      West across the sea: c7ss4_roads
  - prompt: Why did a ruler need taxes?
    options:
    - To pay an army and officials
    - To stop farming
    - To close trade routes
    answer: To pay an army and officials
    difficulty: 1
    hints:
    - Soldiers and officials needed pay.
    - Running a state costs money.
    solution: Taxes paid for the army, officials and building works.
    mistakes:
