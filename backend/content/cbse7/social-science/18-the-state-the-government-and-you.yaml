# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 6), SYNiq chapter 18. Format: content/README.md.
subject: cbse7-ss
chapter: 18
title: The State, the Government, and You
tips:
  c7ss_organs: "Three organs: one makes laws, one carries them out, one interprets them. Match the job in the question to the right organ."
  c7ss_local: "A mayor heads a city. A gram panchayat is headed by someone with a different title."
  s7_central: "Defence and foreign affairs are for the whole country."
  s7_executive: "The judiciary is the courts. The PM leads the ministers who run the government day to day."
  s7_gram_sabha: "The gram sabha is a meeting of everyone who can vote in the village."
  s7_judiciary: "The legislature makes laws and the executive runs them. Who settles disputes?"
  s7_local_jobs: "Local governments handle day-to-day services near your home."
  s7_mayor: "A sarpanch heads a village panchayat. Who heads a city?"
  s7_one_third: "One-tenth is too small. The reservation is for at least a much bigger share of the seats."
  s7_separation: "If one organ had all the power, what could go wrong?"
  s7_state_government: "Elections change governments. Does the country itself change?"
  s7_two_houses: "Parliament has two houses: one for the people and one for the states."
  c7ss18_organ: One organ makes laws, one carries them out, and one settles disputes. Ask which job the person or body does.
  c7ss18_state: The state lasts; the people running it change after elections. Decide which one the choice describes.
  c7ss18_tier: Whole-country matters go to the top tier, regional matters to the middle, and neighbourhood matters to the local tier.
  c7ss18_local: Villages and cities each have their own local bodies and leaders. Match the leader to the body.
  c7ss18_citizen: 'Citizens take part between elections too: by attending meetings, asking for information and making petitions.'
  c7ss18_calc: 'Write the calculation first: a fraction of seats means dividing the total.'
concepts:
- code: cbse7ss.state.organs
  title: The state, the government and its organs
  notes: |
    The state is the permanent political community: people, territory, government and sovereignty. The government is
    the group of people who run the state at a given time; governments change through elections, the state
    continues. India is a democracy and a republic. Government has three organs: the legislature makes laws
    (Parliament: Lok Sabha and Rajya Sabha; state legislative assemblies), the executive carries them out (Prime
    Minister and Council of Ministers, Chief Ministers, civil servants), and the judiciary interprets laws and
    settles disputes (Supreme Court, High Courts, lower courts). Separation of powers keeps each in check.
  explanations:
    text: 'The state is the country itself, its people, land and independence, and it stays. The government is the team running it now, and it changes with elections. Government has three parts: one makes laws, one carries them out, and one judges.'
    visual: 'Draw three pillars holding up a roof labelled ''Indian democracy'': Legislature (makes laws), Executive (carries them out), Judiciary (interprets them).'
    step_by_step: 'Step 1: Separate state (permanent) from government (changes). Step 2: Name the three organs. Step 3: Match each to its job. Step 4: Explain why power is separated.'
    real_world: After every general election a new government may take office, but India, the state, continues unchanged.
  picture:
    kind: compare
    columns:
    - title: Legislature
      points:
      - Makes laws
      - Parliament, state assemblies
      - Elected representatives
    - title: Executive
      points:
      - Carries out laws
      - PM, ministers, civil servants
      - Runs daily administration
    - title: Judiciary
      points:
      - Interprets laws, settles disputes
      - Supreme Court, High Courts
      - Independent
    alt: 'The three organs of government: the legislature makes laws, the executive carries them out, and the judiciary interprets them.'
  activity:
    type: sort
    prompt: State or government?
    bins:
    - State (permanent)
    - Government (changes)
    items:
    - label: Territory and people of India
      bin: State (permanent)
      clue: Always there.
      why: State.
    - label: The party in power after this election
      bin: Government (changes)
      clue: Changes with elections.
      why: Government.
    - label: Sovereignty
      bin: State (permanent)
      clue: A feature of the state.
      why: State.
    - label: The current Prime Minister and ministers
      bin: Government (changes)
      clue: Change over time.
      why: Government.
  lesson:
    - teach: 'The state is a permanent political community with four parts: people, territory, government and sovereignty. The government is the group running the state at a given time. Governments change after elections; the state continues.'
      picture:
        kind: compare
        columns:
        - title: State
          points:
          - permanent
          - people, territory, government, sovereignty
        - title: Government
          points:
          - changes after elections
          - runs the state for now
        alt: The state is permanent; the government changes.
      check:
        prompt: After an election, a new party forms the government. What happens to the state?
        options:
        - It continues as before
        - It ends
        - It becomes a new country
        answer: It continues as before
        why: The state is permanent; only the government changed.
    - teach: Government has three organs. The legislature makes laws (Parliament with the Lok Sabha and Rajya Sabha; state legislative assemblies). The executive carries out laws (Prime Minister, Chief Ministers, ministers, civil servants). The judiciary interprets laws and settles disputes (Supreme Court, High Courts, lower courts).
      picture:
        kind: flow
        steps:
        - 'Legislature: makes the law'
        - 'Executive: puts it into action'
        - 'Judiciary: checks it and settles disputes'
        alt: The three organs of government and their jobs.
      check:
        prompt: A district collector puts a new scheme into action. Which organ is that?
        options:
        - Executive
        - Legislature
        - Judiciary
        answer: Executive
        why: Civil servants carry out laws.
    - teach: Separation of powers means each organ has its own work and checks the others, so no one becomes too powerful. For example, courts can strike down a law that goes against the Constitution.
      check:
        prompt: If Parliament passes a law against the Constitution, who can strike it down?
        options:
        - The courts
        - The police
        - A shop owner
        answer: The courts
        why: The judiciary checks the legislature.
  items:
  - prompt: Which organ of government makes laws?
    options:
    - Legislature
    - Executive
    - Judiciary
    - Police
    answer: Legislature
    difficulty: 1
    hints:
    - Parliament.
    - Law-makers.
    solution: The legislature makes laws.
    mistakes:
      Executive: c7ss_organs
  - prompt: Which organ settles disputes and interprets laws?
    options:
    - Judiciary
    - Legislature
    - Executive
    - Election Commission
    answer: Judiciary
    difficulty: 1
    hints:
    - Courts.
    - Judges.
    solution: The judiciary interprets laws.
    mistakes: {"Legislature": "s7_judiciary"}
  - prompt: 'The Prime Minister is part of the:'
    options:
    - Executive
    - Judiciary
    - Legislature only
    - Army
    answer: Executive
    difficulty: 2
    hints:
    - Runs the government.
    - Carries out laws.
    solution: The PM heads the executive.
    mistakes: {"Judiciary": "s7_executive"}
  - prompt: What is the difference between the state and the government?
    options:
    - The state is permanent; governments change
    - They are the same
    - Governments are permanent; the state changes
    - The state is only the police
    answer: The state is permanent; governments change
    difficulty: 2
    hints:
    - Elections change...
    - India continues.
    solution: The state continues; governments come and go.
    mistakes: {"They are the same": "s7_state_government"}
  - prompt: 'The two houses of India''s Parliament are:'
    options:
    - Lok Sabha and Rajya Sabha
    - High Court and Supreme Court
    - Panchayat and Municipality
    - Cabinet and Army
    answer: Lok Sabha and Rajya Sabha
    difficulty: 1
    hints:
    - House of the People and Council of States.
    - Parliament.
    solution: Parliament has the Lok Sabha and Rajya Sabha.
    mistakes: {"High Court and Supreme Court": "s7_two_houses"}
  - prompt: Why is power separated among three organs?
    options:
    - So that no one organ becomes too powerful
    - To save money
    - To make laws slower
    - Because of tradition only
    answer: So that no one organ becomes too powerful
    difficulty: 2
    hints:
    - Checks and balances.
    - Prevent misuse.
    solution: Separation of powers prevents misuse of power.
    mistakes: {"To save money": "s7_separation"}
  - prompt: Which is the highest court in India?
    options:
    - Supreme Court
    - High Court
    - District Court
    answer: Supreme Court
    difficulty: 1
    hints:
    - It is in New Delhi.
    - Its decisions bind all other courts.
    solution: The Supreme Court is the highest court of India.
    mistakes:
      High Court: c7ss18_organ
      District Court: c7ss18_organ
  - prompt: 'Members of the Lok Sabha are:'
    options:
    - Elected directly by the people
    - Appointed by judges
    - Born into the job
    answer: Elected directly by the people
    difficulty: 2
    hints:
    - It is the 'House of the People'.
    - There is a general election.
    solution: Lok Sabha members (MPs) are directly elected by voters.
    mistakes:
      Appointed by judges: c7ss18_organ
      Born into the job: c7ss18_organ
  - prompt: Which is NOT one of the four parts of a state?
    options:
    - A national cricket team
    - Territory
    - Sovereignty
    answer: A national cricket team
    difficulty: 2
    hints:
    - The four parts are people, territory, government and sovereignty.
    - One option is a sports team.
    solution: A state needs people, territory, government and sovereignty; a sports team is not one of them.
    mistakes:
      Territory: c7ss18_state
      Sovereignty: c7ss18_state
  - prompt: 'A state''s legislative assembly makes laws for:'
    options:
    - That state
    - The whole world
    - Only one village
    answer: That state
    difficulty: 1
    hints:
    - Each state has one.
    - Parliament makes laws for the country.
    solution: A legislative assembly makes laws on state subjects for its own state.
    mistakes:
      The whole world: c7ss18_tier
      Only one village: c7ss18_tier
  - prompt: Who leads the executive of a state government?
    options:
    - Chief Minister
    - Chief Justice
    - Mayor
    answer: Chief Minister
    difficulty: 1
    hints:
    - Like the Prime Minister, but for a state.
    - A Chief Justice is in the judiciary.
    solution: The Chief Minister heads the state's council of ministers.
    mistakes:
      Chief Justice: c7ss18_organ
      Mayor: c7ss18_local
  - prompt: 'A judge hears a land dispute between two farmers. This is the work of the:'
    options:
    - Judiciary
    - Legislature
    - Executive
    answer: Judiciary
    difficulty: 1
    hints:
    - Judges work in courts.
    - Settling disputes is their job.
    solution: Courts settle disputes, so this is the judiciary.
    mistakes:
      Legislature: c7ss18_organ
      Executive: c7ss18_organ
  - prompt: What would go wrong if one person made, carried out and judged all laws?
    options:
    - Power could be misused with no check
    - Everything would be fairer
    - Laws would disappear
    answer: Power could be misused with no check
    difficulty: 3
    hints:
    - Think of who would stop a bad decision.
    - Separation of powers prevents this.
    solution: Without separation of powers, nobody could check misuse of power.
    mistakes:
      Everything would be fairer: c7ss18_organ
      Laws would disappear: c7ss18_organ
  - prompt: 'Rajya Sabha is also called the:'
    options:
    - Council of States
    - House of the People
    - Supreme Court
    answer: Council of States
    difficulty: 2
    hints:
    - Its members are elected by state assemblies.
    - '''Rajya'' means state.'
    solution: The Rajya Sabha is the Council of States; the Lok Sabha is the House of the People.
    mistakes:
      House of the People: c7ss18_organ
      Supreme Court: c7ss18_organ
  - prompt: Is a police officer part of the executive, legislature or judiciary?
    options:
    - Executive
    - Legislature
    - Judiciary
    answer: Executive
    difficulty: 2
    hints:
    - Police enforce laws.
    - They do not make or judge them.
    solution: Police carry out and enforce laws, so they belong to the executive.
    mistakes:
      Legislature: c7ss18_organ
      Judiciary: c7ss18_organ
- code: cbse7ss.state.tiers
  title: Three tiers of government and citizens
  after:
  - cbse7ss.state.organs
  notes: |
    India has three tiers: central (Union) government for the whole country (defence, foreign affairs, currency,
    railways); state governments (police, health, agriculture, state roads); and local self-government: panchayats
    in villages (gram sabha of all adult voters, gram panchayat, sarpanch) and municipalities or municipal
    corporations in towns and cities (mayor, councillors). Local bodies handle water, sanitation, streetlights and
    local roads. Decentralisation brings decisions closer to people; one-third of local seats are reserved for women
    (some states have 50%). Citizens engage by voting, attending gram sabhas, using RTI and petitions.
  explanations:
    text: 'India is governed at three levels: the central government for the whole country, state governments, and local governments like panchayats and municipalities that look after water, roads and cleanliness near you. Citizens can take part at every level.'
    visual: 'Draw three nested circles: the outer labelled ''Central: defence, railways, currency'', the middle ''State: police, health'', the inner ''Local: water, streetlights, sanitation''.'
    step_by_step: 'Step 1: Is the issue national, state or local? Step 2: Match it to the right tier. Step 3: Name the body (Parliament, state assembly, panchayat or municipality). Step 4: Think how a citizen can raise it.'
    real_world: If a streetlight in your lane is broken, the municipal ward councillor or gram panchayat is the right body to approach.
  picture:
    kind: flow
    steps:
    - 'Central government: whole country'
    - 'State governments: each state'
    - District administration
    - 'Panchayats and municipalities: villages, towns'
    - 'Citizens: vote, attend gram sabha, use RTI'
    alt: Three tiers of government from the centre to states to local bodies, and how citizens take part.
  activity:
    type: sort
    prompt: Central, state or local?
    bins:
    - Central
    - State
    - Local
    items:
    - label: Defence
      bin: Central
      clue: For the whole country.
      why: Central.
    - label: Railways
      bin: Central
      clue: Across India.
      why: Central.
    - label: Police
      bin: State
      clue: Run from each capital like Thiruvananthapuram.
      why: State list subject.
    - label: State roads and hospitals
      bin: State
      clue: Run by the government in your capital city.
      why: State government runs these.
    - label: Streetlights in a ward
      bin: Local
      clue: Your area.
      why: Local.
    - label: Village water supply
      bin: Local
      clue: Panchayat.
      why: Local.
  lesson:
    - teach: 'India has three tiers of government. The central (Union) government handles matters for the whole country: defence, foreign affairs, currency, railways. State governments handle police, health, farming and state roads.'
      picture:
        kind: flow
        steps:
        - 'Central: defence, foreign affairs, currency, railways'
        - 'State: police, health, agriculture'
        - 'Local: water, sanitation, streetlights'
        alt: Three tiers of government and their jobs.
      check:
        prompt: 'Printing currency notes is a matter for the:'
        options:
        - Central government
        - Gram panchayat
        - Municipality
        answer: Central government
        why: Currency is a whole-country matter.
    - teach: 'Local self-government is closest to people. In villages: the gram sabha (all adult voters), the gram panchayat (elected members) and its head, the sarpanch. In towns and cities: municipalities and municipal corporations, with councillors and a mayor. They look after water, sanitation, streetlights and local roads.'
      check:
        prompt: 'Fixing a broken village streetlight is mainly the job of the:'
        options:
        - Gram panchayat
        - Supreme Court
        - Rajya Sabha
        answer: Gram panchayat
        why: Local bodies handle local services.
    - teach: Decentralisation brings decisions closer to people. At least one-third of seats in local bodies are reserved for women (some states, like Kerala, have half). Citizens take part by voting, attending gram sabha meetings, using the Right to Information (RTI) and sending petitions.
      check:
        prompt: Which law lets a citizen ask the government for information?
        options:
        - Right to Information (RTI)
        - MRP rule
        - Barter rule
        answer: Right to Information (RTI)
        why: RTI lets citizens get government information.
  items:
  - prompt: Which tier of government handles defence and foreign affairs?
    options:
    - Central government
    - State government
    - Panchayat
    - Municipality
    answer: Central government
    difficulty: 1
    hints:
    - Whole country.
    - Union list.
    solution: Defence is a central subject.
    mistakes: {"State government": "s7_central"}
  - prompt: Who heads a gram panchayat?
    options:
    - Sarpanch
    - Mayor
    - Prime Minister
    - Governor
    answer: Sarpanch
    difficulty: 1
    hints:
    - Village head.
    - Mayor is for cities.
    solution: The sarpanch heads the gram panchayat.
    mistakes:
      Mayor: c7ss_local
  - prompt: 'A city''s municipal corporation is headed by the:'
    options:
    - Mayor
    - Sarpanch
    - Chief Justice
    - President
    answer: Mayor
    difficulty: 1
    hints:
    - Cities.
    - Elected by councillors or people.
    solution: The mayor heads a municipal corporation.
    mistakes: {"Sarpanch": "s7_mayor"}
  - prompt: Who are members of the gram sabha?
    options:
    - All adult voters of the village
    - Only the sarpanch
    - Only government officers
    - Only children
    answer: All adult voters of the village
    difficulty: 2
    hints:
    - Village assembly.
    - Everyone who can vote.
    solution: All adult voters belong to the gram sabha.
    mistakes: {"Only the sarpanch": "s7_gram_sabha"}
  - prompt: Which is a job of local government?
    options:
    - Water supply and sanitation
    - Printing currency
    - Defence
    - Foreign treaties
    answer: Water supply and sanitation
    difficulty: 1
    hints:
    - Close to home.
    - Daily services.
    solution: Local bodies handle water and sanitation.
    mistakes: {"Printing currency": "s7_local_jobs"}
  - prompt: What share of seats in local bodies is at least reserved for women?
    options:
    - One-third
    - One-tenth
    - None
    - All
    answer: One-third
    difficulty: 2
    hints:
    - 73rd and 74th Amendments.
    - Some states give half.
    solution: At least one-third are reserved for women.
    mistakes: {"One-tenth": "s7_one_third"}
  - prompt: Which tier looks after railways?
    options:
    - Central government
    - State government
    - Gram panchayat
    answer: Central government
    difficulty: 1
    hints:
    - Trains run across many states.
    - It is a whole-country matter.
    solution: Railways are run by the central government.
    mistakes:
      State government: c7ss18_tier
      Gram panchayat: c7ss18_tier
  - prompt: State police are controlled by which tier?
    options:
    - State government
    - Central government
    - Municipality
    answer: State government
    difficulty: 2
    hints:
    - Each state has its own police.
    - It is a regional matter.
    solution: Police and law and order are state subjects.
    mistakes:
      Central government: c7ss18_tier
      Municipality: c7ss18_tier
  - prompt: A town council has 30 seats. At least one-third are for women. What is the minimum number of seats for women?
    answer: '10'
    check: 30/3
    difficulty: 1
    hints:
    - One-third means divide by 3.
    - Share 30 into 3 equal parts.
    solution: 'Step 1: 30 ÷ 3. Step 2: = 10 seats.'
    mistakes:
      '90': c7ss18_calc
      '3': c7ss18_calc
  - prompt: In Kerala, half the seats in local bodies are for women. In a panchayat of 18 seats, how many?
    answer: '9'
    check: 18/2
    difficulty: 1
    hints:
    - Half means divide by 2.
    - Share 18 into 2 equal parts.
    solution: 'Step 1: 18 ÷ 2. Step 2: = 9 seats.'
    mistakes:
      '36': c7ss18_calc
      '6': c7ss18_calc
  - prompt: 'Councillors are elected members of a:'
    options:
    - Municipality or municipal corporation
    - Supreme Court
    - Lok Sabha only
    answer: Municipality or municipal corporation
    difficulty: 2
    hints:
    - They represent wards in a town or city.
    - The mayor leads them.
    solution: Councillors represent wards in municipal bodies.
    mistakes:
      Supreme Court: c7ss18_local
      Lok Sabha only: c7ss18_local
  - prompt: Why is local self-government useful?
    options:
    - Local people decide on local problems
    - It removes all elections
    - It handles defence
    answer: Local people decide on local problems
    difficulty: 2
    hints:
    - Who knows the village's needs best?
    - Decisions are made nearby.
    solution: Local bodies let people closest to a problem decide how to solve it.
    mistakes:
      It removes all elections: c7ss18_tier
      It handles defence: c7ss18_tier
  - prompt: Anita, 25, lives in a village. How can she take part in local decisions?
    options:
    - Attend the gram sabha meeting
    - Write to the United Nations only
    - Wait for the Supreme Court
    answer: Attend the gram sabha meeting
    difficulty: 2
    hints:
    - All adult voters belong to a certain village body.
    - It meets regularly.
    solution: Every adult voter is a gram sabha member and can speak at its meetings.
    mistakes:
      Write to the United Nations only: c7ss18_citizen
      Wait for the Supreme Court: c7ss18_citizen
  - prompt: 'Foreign affairs (relations with other countries) are handled by the:'
    options:
    - Central government
    - Municipal corporation
    - Sarpanch
    answer: Central government
    difficulty: 1
    hints:
    - It speaks for the whole country.
    - Local bodies deal with local matters.
    solution: Relations with other countries are a central government subject.
    mistakes:
      Municipal corporation: c7ss18_tier
      Sarpanch: c7ss18_local
  - prompt: 'Residents send a signed request to the municipality to fix a drain. This is a:'
    options:
    - Petition
    - Barter
    - Pilgrimage
    answer: Petition
    difficulty: 2
    hints:
    - Many people sign it.
    - It asks the government to act.
    solution: A petition is a formal request signed by citizens.
    mistakes:
      Barter: c7ss18_citizen
      Pilgrimage: c7ss18_citizen
