# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 9. Format: content/README.md.
subject: cbse7-ss
chapter: 9
title: 'From the Rulers to the Ruled: Types of Governments'
tips:
  c7ss_govt_type: "In an absolute monarchy one ruler holds all power. India's people elect MPs and MLAs to act for them. What kind of democracy is that?"
  c7ss_vote_age: "21 was the old voting age. It was lowered in 1989 to the age when you become an adult."
  s7_accountability: "Accountable leaders must explain their actions to someone. To whom?"
  s7_citizen_duty: "Which choice helps democracy work?"
  s7_democracy_people: "In a democracy power does not belong to one king. Who chooses the government?"
  s7_direct_democracy: "Direct means without representatives in between."
  s7_equality_law: "Equality before law means no one gets special treatment."
  s7_free_elections: "Democracy lets people choose and change their rulers."
  s7_monarchy: "Kings and queens inherit the throne."
  s7_sabha: "Britain's Parliament and Rome's Senate are foreign. Which assembly was Indian?"
  s7_theocracy: "'Theo' means god."
  s7_universal_franchise: "'Universal' means all adults, without conditions."
  c7ss9_who: 'Ask one question: who holds power, and how did they get it? Birth, force, religious position, a small rich group, or votes of the people.'
  c7ss9_direct: In one kind of rule by the people, everyone votes on each decision; in the other, people choose others to decide for them. Think about which fits a huge country.
  c7ss9_job: A government keeps order, defends the country, gives justice and provides services. Look for the choice that is one of these jobs.
  c7ss9_vote: Every adult citizen gets a vote, whatever their religion, caste, gender or wealth. Check the choice against that rule.
  c7ss9_answer: In a democracy, leaders must explain their actions and can be voted out. Think about who they answer to.
  c7ss9_citizen: 'Rule by the people works only when people take part: they vote, stay informed and respect others'' views.'
  c7ss9_count: Work carefully with the numbers given. Decide whether to add, subtract or find a fraction.
concepts:
- code: cbse7ss.gov.types
  title: Types of government
  notes: |
    A government makes and carries out decisions for a country: keeping order, providing services, defence,
    justice. Types: monarchy (a king or queen, often hereditary; absolute or constitutional, like the UK today),
    dictatorship (one person or group holds power without free elections), theocracy (rule by religious leaders),
    oligarchy (rule by a few), and democracy (rule by the people). Democracy can be direct (citizens vote on
    decisions, as in ancient Athens) or representative (citizens elect representatives, as in India).
  explanations:
    text: Governments differ in who holds power. In a monarchy a king or queen rules; in a dictatorship one person rules without free elections; in a democracy the people choose their leaders.
    visual: Draw a pyramid with one crowned figure on top (monarchy), one with a stern face on top (dictatorship), and then a circle of many people choosing a leader together (democracy).
    step_by_step: 'Step 1: Ask who holds power. Step 2: Ask how they got it: birth, force or election. Step 3: Ask whether people can change them. Step 4: Name the type.'
    real_world: 'The United Kingdom has a king, but elected leaders run the government: a constitutional monarchy.'
  picture:
    kind: compare
    columns:
    - title: Monarchy
      points:
      - Ruler by birth
      - King or queen
      - Absolute or constitutional
    - title: Dictatorship
      points:
      - One person or group
      - No free elections
      - Power often by force
    - title: Democracy
      points:
      - Rule by the people
      - Free and fair elections
      - Direct or representative
    alt: Monarchy, dictatorship and democracy compared by who holds power and how they get it.
  activity:
    type: sort
    prompt: Which type of government?
    bins:
    - Monarchy
    - Dictatorship
    - Theocracy
    - Democracy
    items:
    - label: A hereditary king or queen
      bin: Monarchy
      clue: Born to rule.
      why: Monarchy.
    - label: One person rules without free elections
      bin: Dictatorship
      clue: No choice.
      why: Dictatorship.
    - label: Religious leaders rule
      bin: Theocracy
      clue: Faith-based.
      why: Theocracy.
    - label: Citizens elect representatives
      bin: Democracy
      clue: People's rule.
      why: Democracy.
    - label: 'Ancient Athens: citizens vote on decisions directly'
      bin: Democracy
      clue: Direct.
      why: Direct democracy.
  lesson:
    - teach: A government makes and carries out decisions for a country. Its jobs include keeping law and order, defending the borders, giving justice and providing services like schools, roads and hospitals.
      check:
        prompt: Which is a job of a government?
        options:
        - Running schools and hospitals
        - Choosing your favourite food
        - Writing your homework
        answer: Running schools and hospitals
        why: Providing public services is a government task.
    - teach: Governments differ in who holds power. In a monarchy, a king or queen rules, usually by birth. In a dictatorship, one person or group takes power without free elections. In a theocracy, religious leaders rule. In an oligarchy, a few powerful people rule. In a democracy, the people rule.
      picture:
        kind: compare
        columns:
        - title: Type
          points:
          - Monarchy
          - Dictatorship
          - Theocracy
          - Oligarchy
          - Democracy
        - title: Who holds power
          points:
          - king or queen, by birth
          - one person or group, without free elections
          - religious leaders
          - a few powerful people
          - the people, through votes
        alt: Five types of government and who holds power in each.
      check:
        prompt: 'In an oligarchy, power is held by:'
        options:
        - A few powerful people
        - All citizens
        - Religious leaders only
        answer: A few powerful people
        why: '''Oligo'' means few.'
    - teach: 'Democracy can be direct or representative. In ancient Athens, citizens met and voted on each decision (direct). In big countries like India, people elect representatives (MLAs, MPs) who decide for them (representative). Some monarchies today, like the UK, are constitutional: the monarch has little real power and an elected parliament governs.'
      check:
        prompt: Why does India use representative democracy?
        options:
        - Over a billion people cannot all vote on every decision
        - Indians do not like voting
        - It has a king
        answer: Over a billion people cannot all vote on every decision
        why: In a huge country, elected representatives decide.
  items:
  - prompt: 'In a monarchy, the ruler usually gets power by:'
    options:
    - Birth
    - Election
    - Lottery
    - Exams
    answer: Birth
    difficulty: 1
    hints:
    - Hereditary.
    - Passed in the family.
    solution: Monarchs usually inherit the throne.
    mistakes: {"Election": "s7_monarchy"}
  - prompt: 'Democracy means rule by:'
    options:
    - The people
    - One king
    - Religious leaders
    - The army
    answer: The people
    difficulty: 1
    hints:
    - '''Demos'' = people.'
    - Elections.
    solution: Democracy is rule by the people.
    mistakes: {"One king": "s7_democracy_people"}
  - prompt: 'India is a:'
    options:
    - Representative democracy
    - Absolute monarchy
    - Dictatorship
    - Theocracy
    answer: Representative democracy
    difficulty: 2
    hints:
    - We elect MPs and MLAs.
    - Representatives decide.
    solution: Indians elect representatives to govern.
    mistakes:
      Absolute monarchy: c7ss_govt_type
  - prompt: 'In a direct democracy, citizens:'
    options:
    - Vote on decisions themselves
    - Have no vote
    - Obey a king
    - Elect a dictator
    answer: Vote on decisions themselves
    difficulty: 2
    hints:
    - Ancient Athens.
    - No representatives.
    solution: Citizens decide issues directly.
    mistakes: {"Elect a dictator": "s7_direct_democracy"}
  - prompt: 'Rule by religious leaders is called:'
    options:
    - Theocracy
    - Democracy
    - Oligarchy
    - Monarchy
    answer: Theocracy
    difficulty: 2
    hints:
    - '''Theo'' = god.'
    - Religious law.
    solution: That is a theocracy.
    mistakes: {"Oligarchy": "s7_theocracy", "Monarchy": "s7_theocracy"}
  - prompt: Which is a key feature of democracy?
    options:
    - Free and fair elections
    - Power passed from father to son
    - No elections
    - One-person rule forever
    answer: Free and fair elections
    difficulty: 1
    hints:
    - People choose.
    - Can change leaders.
    solution: Free elections let people choose and change leaders.
    mistakes: {"Power passed from father to son": "s7_free_elections"}
  - prompt: 'In a dictatorship, the ruler usually gains power by:'
    options:
    - Force or without free elections
    - Winning free elections every 5 years
    - A vote of all citizens on each law
    answer: Force or without free elections
    difficulty: 2
    hints:
    - People cannot freely choose or remove the ruler.
    - There are no fair elections.
    solution: A dictator holds power without free elections, often by force.
    mistakes:
      Winning free elections every 5 years: c7ss9_who
      A vote of all citizens on each law: c7ss9_who
  - prompt: In a constitutional monarchy like the UK, who really governs?
    options:
    - An elected parliament
    - The king alone
    - Religious leaders
    answer: An elected parliament
    difficulty: 3
    hints:
    - The monarch is mostly a symbol.
    - People still vote.
    solution: In a constitutional monarchy, the monarch is head of state but an elected parliament governs.
    mistakes:
      The king alone: c7ss9_who
      Religious leaders: c7ss9_who
  - prompt: 'Ancient Athens is a famous example of:'
    options:
    - Direct democracy
    - Theocracy
    - Dictatorship
    answer: Direct democracy
    difficulty: 2
    hints:
    - Citizens met in one assembly.
    - They voted on decisions themselves.
    solution: In Athens, citizens voted directly in the assembly, so it was a direct democracy.
    mistakes:
      Theocracy: c7ss9_direct
      Dictatorship: c7ss9_who
  - prompt: 'Members of Parliament (MPs) in India are:'
    options:
    - Representatives elected by the people
    - Born into the job
    - Chosen by religious leaders
    answer: Representatives elected by the people
    difficulty: 1
    hints:
    - India is a representative democracy.
    - There is a Lok Sabha election.
    solution: MPs are elected by voters in their constituencies to represent them.
    mistakes:
      Born into the job: c7ss9_direct
      Chosen by religious leaders: c7ss9_who
  - prompt: Which job belongs to the government?
    options:
    - Defending the country's borders
    - Deciding what you eat for lunch
    - Choosing your friends
    answer: Defending the country's borders
    difficulty: 1
    hints:
    - Think of the army.
    - This affects the whole country.
    solution: Defence is a core government job, along with order, justice and services.
    mistakes:
      Deciding what you eat for lunch: c7ss9_job
      Choosing your friends: c7ss9_job
  - prompt: Which type of government lets the people remove leaders peacefully?
    options:
    - Democracy
    - Dictatorship
    - Absolute monarchy
    answer: Democracy
    difficulty: 2
    hints:
    - Think of regular elections.
    - Voters can choose someone else.
    solution: In a democracy, people can vote leaders out at the next election.
    mistakes:
      Dictatorship: c7ss9_who
      Absolute monarchy: c7ss9_who
  - prompt: 'In an absolute monarchy, the king''s power is:'
    options:
    - Not limited by any constitution or parliament
    - Shared with elected leaders
    - Chosen by voters
    answer: Not limited by any constitution or parliament
    difficulty: 2
    hints:
    - '''Absolute'' means complete.'
    - Nobody can overrule him.
    solution: An absolute monarch holds complete power, without limits from laws or parliament.
    mistakes:
      Shared with elected leaders: c7ss9_who
      Chosen by voters: c7ss9_who
  - prompt: 'A class of 40 elects 2 class leaders to speak for them. This is like:'
    options:
    - Representative democracy
    - Direct democracy
    - Monarchy
    answer: Representative democracy
    difficulty: 2
    hints:
    - Not everyone speaks; a few are chosen.
    - They were elected.
    solution: Electing a few people to speak and decide for everyone is representative democracy.
    mistakes:
      Direct democracy: c7ss9_direct
      Monarchy: c7ss9_who
  - prompt: A village of 300 voters meets and votes on a new well. 180 say yes. How many say no, if everyone voted?
    answer: '120'
    check: 300-180
    difficulty: 1
    hints:
    - Everyone said either yes or no.
    - Take the yes votes away from the total.
    solution: 'Step 1: no = total - yes. Step 2: 300 - 180 = 120.'
    mistakes:
      '480': c7ss9_count
      '180': c7ss9_count
- code: cbse7ss.gov.democracy
  title: Why democracy matters
  after:
  - cbse7ss.gov.types
  notes: |
    In a democracy power comes from the people: universal adult franchise (every adult citizen, 18+ in India, can
    vote, whatever their religion, caste, gender or wealth), equality before law, rights and freedoms (speech,
    religion), regular elections, accountability (leaders must answer to the people), and rule of law. India's
    ancient assemblies (sabha, samiti) and the ganas show older traditions of discussion. Democracy also needs
    active citizens: voting, staying informed and respecting others' views.
  explanations:
    text: In a democracy every adult has one vote, everyone is equal before the law, and leaders must answer to the people. It works best when citizens vote, stay informed and respect each other.
    visual: 'Picture a polling booth queue: a farmer, a teacher, a shopkeeper and a factory worker, each with an inked finger, each vote counting the same.'
    step_by_step: 'Step 1: Universal adult franchise: all adults vote. Step 2: Equality before law. Step 3: Rights and freedoms. Step 4: Regular elections and accountability. Step 5: Active citizens.'
    real_world: India's general elections are the largest in the world, with over 90 crore registered voters.
  picture:
    kind: compare
    columns:
    - title: What democracy gives
      points:
      - One person, one vote
      - Equality before law
      - Freedoms of speech and religion
      - Leaders accountable
    - title: What it needs from citizens
      points:
      - Voting
      - Staying informed
      - Respecting others
      - Obeying the law
    alt: What democracy gives citizens (equal votes, equality, freedoms, accountable leaders) and what it needs from them (voting, being informed, respect).
  activity:
    type: sort
    prompt: Feature of democracy, or not?
    bins:
    - Feature of democracy
    - Not a feature
    items:
    - label: Every adult can vote
      bin: Feature of democracy
      clue: Universal franchise.
      why: Feature.
    - label: Leaders answer to the people
      bin: Feature of democracy
      clue: Accountability.
      why: Feature.
    - label: Votes only for the educated
      bin: Not a feature
      clue: Universal?
      why: Not democratic.
    - label: Equality before law
      bin: Feature of democracy
      clue: Same rules.
      why: Feature.
    - label: No elections ever held
      bin: Not a feature
      clue: How do people choose?
      why: Not democratic.
  lesson:
    - teach: 'In a democracy, power comes from the people. India has universal adult franchise: every citizen aged 18 or above can vote, whatever their religion, caste, gender, wealth or education. One person, one vote, one value.'
      check:
        prompt: Who can vote in India?
        options:
        - Every citizen aged 18 or above
        - Only those who own land
        - Only men
        answer: Every citizen aged 18 or above
        why: Universal adult franchise includes every adult citizen.
    - teach: 'Democracy also means equality before law (the same laws for everyone), rights and freedoms (speech, religion), regular free elections, and accountability: leaders must answer to the people and can be voted out. The rule of law means even leaders must obey the law.'
      picture:
        kind: flow
        steps:
        - People vote
        - Representatives govern
        - People question and judge them
        - 'Next election: re-elect or replace'
        alt: 'Accountability: leaders answer to voters at every election.'
      check:
        prompt: What does 'rule of law' mean?
        options:
        - Everyone, even leaders, must obey the law
        - Leaders are above the law
        - There are no laws
        answer: Everyone, even leaders, must obey the law
        why: No one is above the law.
    - teach: 'India has old traditions of discussion: the sabha and samiti assemblies of Vedic times and the ganas of the mahajanapadas. Democracy today needs active citizens: voting, staying informed, discussing peacefully and respecting others'' views.'
      check:
        prompt: Which is an active citizen's action?
        options:
        - Staying informed about issues
        - Ignoring all news
        - Insulting people who disagree
        answer: Staying informed about issues
        why: Informed citizens make better choices.
  items:
  - prompt: At what age can a citizen vote in India?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - Adult.
    - Changed from 21 in 1989.
    solution: Indian citizens can vote at 18.
    mistakes:
      '21': c7ss_vote_age
  - prompt: 'Universal adult franchise means:'
    options:
    - Every adult citizen can vote
    - Only the rich can vote
    - Only men can vote
    - Only educated people can vote
    answer: Every adult citizen can vote
    difficulty: 1
    hints:
    - '''Universal''.'
    - No one left out.
    solution: All adult citizens can vote, regardless of background.
    mistakes: {"Only educated people can vote": "s7_universal_franchise"}
  - prompt: '''Accountability'' in a democracy means leaders:'
    options:
    - Must answer to the people
    - Can do anything
    - Rule for life
    - Are chosen by birth
    answer: Must answer to the people
    difficulty: 2
    hints:
    - They can be voted out.
    - Explain their actions.
    solution: Leaders must explain their actions and can be voted out.
    mistakes: {"Can do anything": "s7_accountability"}
  - prompt: Which was an ancient Indian assembly?
    options:
    - Sabha
    - Parliament of Britain
    - Senate of Rome
    - UN
    answer: Sabha
    difficulty: 2
    hints:
    - Vedic times.
    - Also samiti.
    solution: The sabha and samiti were early assemblies.
    mistakes: {"Senate of Rome": "s7_sabha"}
  - prompt: Which is a duty of a citizen in a democracy?
    options:
    - Voting in elections
    - Ignoring the news
    - Breaking laws
    - Stopping others from voting
    answer: Voting in elections
    difficulty: 1
    hints:
    - Choosing leaders.
    - Participation.
    solution: Voting is a key way citizens take part.
    mistakes: {"Ignoring the news": "s7_citizen_duty"}
  - prompt: 'Equality before law means:'
    options:
    - The same laws apply to everyone
    - Leaders are above the law
    - Rich people have different laws
    - Laws change for each person
    answer: The same laws apply to everyone
    difficulty: 1
    hints:
    - No one is above the law.
    - Equal treatment.
    solution: Everyone, including leaders, is subject to the same laws.
    mistakes: {"Leaders are above the law": "s7_equality_law"}
  - prompt: '''One person, one vote, one value'' means:'
    options:
    - Every vote counts equally
    - Rich people get more votes
    - Only leaders can vote
    answer: Every vote counts equally
    difficulty: 2
    hints:
    - Think about equality.
    - No vote is worth more than another.
    solution: Each adult has one vote, and every vote has the same value.
    mistakes:
      Rich people get more votes: c7ss9_vote
      Only leaders can vote: c7ss9_vote
  - prompt: Meena is 17 years old. In how many years can she vote in India?
    answer: '1'
    check: 18-17
    difficulty: 1
    hints:
    - Find the voting age.
    - Subtract her age from it.
    solution: 'Step 1: voting age is 18. Step 2: 18 - 17 = 1 year.'
    mistakes:
      '18': c7ss9_count
      '35': c7ss9_count
  - prompt: Why are regular elections important in a democracy?
    options:
    - People can keep or change their leaders
    - Leaders can rule forever
    - They stop people from speaking
    answer: People can keep or change their leaders
    difficulty: 2
    hints:
    - Elections happen every few years.
    - Think of accountability.
    solution: Regular elections let people judge leaders and replace them if needed.
    mistakes:
      Leaders can rule forever: c7ss9_answer
      They stop people from speaking: c7ss9_answer
  - prompt: Which is an example of freedom of speech?
    options:
    - Writing a letter to a newspaper criticising a policy
    - Being forced to stay silent
    - Banning all newspapers
    answer: Writing a letter to a newspaper criticising a policy
    difficulty: 2
    hints:
    - Freedom means you are allowed.
    - Speech includes writing.
    solution: Freedom of speech lets citizens express views, including criticism, peacefully.
    mistakes:
      Being forced to stay silent: c7ss9_citizen
      Banning all newspapers: c7ss9_citizen
  - prompt: Which Vedic assembly is mentioned along with the sabha?
    options:
    - Samiti
    - Parliament
    - Senate
    answer: Samiti
    difficulty: 2
    hints:
    - It is an old Indian word.
    - The other two are modern.
    solution: The sabha and samiti were Vedic-age assemblies.
    mistakes:
      Parliament: c7ss9_citizen
      Senate: c7ss9_citizen
  - prompt: A minister breaks a law. In a democracy with rule of law, what should happen?
    options:
    - The minister faces the law like anyone else
    - Nothing, ministers are above the law
    - The law is cancelled
    answer: The minister faces the law like anyone else
    difficulty: 2
    hints:
    - Equality before law applies to all.
    - No one is above the law.
    solution: Rule of law and equality before law mean ministers too must face the law.
    mistakes:
      Nothing, ministers are above the law: c7ss9_answer
      The law is cancelled: c7ss9_answer
  - prompt: Which person can NOT vote in Indian elections?
    options:
    - A 15-year-old citizen
    - A 60-year-old woman citizen
    - A 19-year-old student citizen
    answer: A 15-year-old citizen
    difficulty: 1
    hints:
    - Check the age rule.
    - Gender and job do not matter.
    solution: Only citizens aged 18 or above can vote, so the 15-year-old cannot yet.
    mistakes:
      A 60-year-old woman citizen: c7ss9_vote
      A 19-year-old student citizen: c7ss9_vote
  - prompt: Why must citizens respect views they disagree with?
    options:
    - Democracy depends on peaceful discussion
    - Disagreeing is illegal
    - Only one view is allowed
    answer: Democracy depends on peaceful discussion
    difficulty: 2
    hints:
    - People will not always agree.
    - Think of how decisions are reached.
    solution: Democracy works through peaceful debate where different views are heard.
    mistakes:
      Disagreeing is illegal: c7ss9_citizen
      Only one view is allowed: c7ss9_citizen
  - prompt: In a town, 6,000 of 10,000 adults voted. What percentage voted?
    answer: '60'
    check: 6000*100/10000
    difficulty: 3
    hints:
    - Percentage = part ÷ total × 100.
    - 6,000 out of 10,000 is the same as 6 out of 10.
    solution: 'Step 1: 6000 ÷ 10000 = 0.6. Step 2: 0.6 × 100 = 60%.'
    mistakes:
      '6': c7ss9_count
      '40': c7ss9_count
