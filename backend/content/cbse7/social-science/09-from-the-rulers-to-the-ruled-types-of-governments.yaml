# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 9. Format: content/README.md.
subject: cbse7-ss
chapter: 9
title: 'From the Rulers to the Ruled: Types of Governments'
tips:
  c7ss_govt_type: 'India elects representatives (MPs, MLAs): it is a representative democracy.'
  c7ss_vote_age: The voting age in India is 18 (it was lowered from 21 in 1989).
concepts:
- code: cbse7ss.gov.types
  title: Types of government
  notes: |
    A government makes and carries out decisions for a country: keeping order, providing services, defence,
    justice. Types: monarchy (a king or queen, often hereditary; absolute or constitutional, like the UK today),
    dictatorship (one person or group holds power without free elections), theocracy (rule by religious leaders),
    oligarchy (rule by a few), and democracy (rule by the people). Democracy can be direct (citizens vote on
    decisions, as in ancient Athens) or representative (citizens elect representatives, as in India).
  explanations:
    text: Governments differ in who holds power. In a monarchy a king or queen rules; in a dictatorship one person rules without free elections; in a democracy the people choose their leaders.
    visual: Draw a pyramid with one crowned figure on top (monarchy), one with a stern face on top (dictatorship), and then a circle of many people choosing a leader together (democracy).
    step_by_step: 'Step 1: Ask who holds power. Step 2: Ask how they got it: birth, force or election. Step 3: Ask whether people can change them. Step 4: Name the type.'
    real_world: 'The United Kingdom has a king, but elected leaders run the government: a constitutional monarchy.'
  picture:
    kind: compare
    columns:
    - title: Monarchy
      points:
      - Ruler by birth
      - King or queen
      - Absolute or constitutional
    - title: Dictatorship
      points:
      - One person or group
      - No free elections
      - Power often by force
    - title: Democracy
      points:
      - Rule by the people
      - Free and fair elections
      - Direct or representative
    alt: Monarchy, dictatorship and democracy compared by who holds power and how they get it.
  activity:
    type: sort
    prompt: Which type of government?
    bins:
    - Monarchy
    - Dictatorship
    - Theocracy
    - Democracy
    items:
    - label: A hereditary king or queen
      bin: Monarchy
      clue: Born to rule.
      why: Monarchy.
    - label: One person rules without free elections
      bin: Dictatorship
      clue: No choice.
      why: Dictatorship.
    - label: Religious leaders rule
      bin: Theocracy
      clue: Faith-based.
      why: Theocracy.
    - label: Citizens elect representatives
      bin: Democracy
      clue: People's rule.
      why: Democracy.
    - label: 'Ancient Athens: citizens vote on decisions directly'
      bin: Democracy
      clue: Direct.
      why: Direct democracy.
  items:
  - prompt: 'In a monarchy, the ruler usually gets power by:'
    options:
    - Birth
    - Election
    - Lottery
    - Exams
    answer: Birth
    difficulty: 1
    hints:
    - Hereditary.
    - Passed in the family.
    solution: Monarchs usually inherit the throne.
  - prompt: 'Democracy means rule by:'
    options:
    - The people
    - One king
    - Religious leaders
    - The army
    answer: The people
    difficulty: 1
    hints:
    - '''Demos'' = people.'
    - Elections.
    solution: Democracy is rule by the people.
  - prompt: 'India is a:'
    options:
    - Representative democracy
    - Absolute monarchy
    - Dictatorship
    - Theocracy
    answer: Representative democracy
    difficulty: 2
    hints:
    - We elect MPs and MLAs.
    - Representatives decide.
    solution: Indians elect representatives to govern.
    mistakes:
      Absolute monarchy: c7ss_govt_type
  - prompt: 'In a direct democracy, citizens:'
    options:
    - Vote on decisions themselves
    - Have no vote
    - Obey a king
    - Elect a dictator
    answer: Vote on decisions themselves
    difficulty: 2
    hints:
    - Ancient Athens.
    - No representatives.
    solution: Citizens decide issues directly.
  - prompt: 'Rule by religious leaders is called:'
    options:
    - Theocracy
    - Democracy
    - Oligarchy
    - Monarchy
    answer: Theocracy
    difficulty: 2
    hints:
    - '''Theo'' = god.'
    - Religious law.
    solution: That is a theocracy.
  - prompt: Which is a key feature of democracy?
    options:
    - Free and fair elections
    - Power passed from father to son
    - No elections
    - One-person rule forever
    answer: Free and fair elections
    difficulty: 1
    hints:
    - People choose.
    - Can change leaders.
    solution: Free elections let people choose and change leaders.
- code: cbse7ss.gov.democracy
  title: Why democracy matters
  after:
  - cbse7ss.gov.types
  notes: |
    In a democracy power comes from the people: universal adult franchise (every adult citizen, 18+ in India, can
    vote, whatever their religion, caste, gender or wealth), equality before law, rights and freedoms (speech,
    religion), regular elections, accountability (leaders must answer to the people), and rule of law. India's
    ancient assemblies (sabha, samiti) and the ganas show older traditions of discussion. Democracy also needs
    active citizens: voting, staying informed and respecting others' views.
  explanations:
    text: In a democracy every adult has one vote, everyone is equal before the law, and leaders must answer to the people. It works best when citizens vote, stay informed and respect each other.
    visual: 'Picture a polling booth queue: a farmer, a teacher, a shopkeeper and a factory worker, each with an inked finger, each vote counting the same.'
    step_by_step: 'Step 1: Universal adult franchise: all adults vote. Step 2: Equality before law. Step 3: Rights and freedoms. Step 4: Regular elections and accountability. Step 5: Active citizens.'
    real_world: India's general elections are the largest in the world, with over 90 crore registered voters.
  picture:
    kind: compare
    columns:
    - title: What democracy gives
      points:
      - One person, one vote
      - Equality before law
      - Freedoms of speech and religion
      - Leaders accountable
    - title: What it needs from citizens
      points:
      - Voting
      - Staying informed
      - Respecting others
      - Obeying the law
    alt: What democracy gives citizens (equal votes, equality, freedoms, accountable leaders) and what it needs from them (voting, being informed, respect).
  activity:
    type: sort
    prompt: Feature of democracy, or not?
    bins:
    - Feature of democracy
    - Not a feature
    items:
    - label: Every adult can vote
      bin: Feature of democracy
      clue: Universal franchise.
      why: Feature.
    - label: Leaders answer to the people
      bin: Feature of democracy
      clue: Accountability.
      why: Feature.
    - label: Votes only for the educated
      bin: Not a feature
      clue: Universal?
      why: Not democratic.
    - label: Equality before law
      bin: Feature of democracy
      clue: Same rules.
      why: Feature.
    - label: No elections ever held
      bin: Not a feature
      clue: How do people choose?
      why: Not democratic.
  items:
  - prompt: At what age can a citizen vote in India?
    answer: '18'
    check: '18'
    difficulty: 1
    hints:
    - Adult.
    - Changed from 21 in 1989.
    solution: Indian citizens can vote at 18.
    mistakes:
      '21': c7ss_vote_age
  - prompt: 'Universal adult franchise means:'
    options:
    - Every adult citizen can vote
    - Only the rich can vote
    - Only men can vote
    - Only educated people can vote
    answer: Every adult citizen can vote
    difficulty: 1
    hints:
    - '''Universal''.'
    - No one left out.
    solution: All adult citizens can vote, regardless of background.
  - prompt: '''Accountability'' in a democracy means leaders:'
    options:
    - Must answer to the people
    - Can do anything
    - Rule for life
    - Are chosen by birth
    answer: Must answer to the people
    difficulty: 2
    hints:
    - They can be voted out.
    - Explain their actions.
    solution: Leaders must explain their actions and can be voted out.
  - prompt: Which was an ancient Indian assembly?
    options:
    - Sabha
    - Parliament of Britain
    - Senate of Rome
    - UN
    answer: Sabha
    difficulty: 2
    hints:
    - Vedic times.
    - Also samiti.
    solution: The sabha and samiti were early assemblies.
  - prompt: Which is a duty of a citizen in a democracy?
    options:
    - Voting in elections
    - Ignoring the news
    - Breaking laws
    - Stopping others from voting
    answer: Voting in elections
    difficulty: 1
    hints:
    - Choosing leaders.
    - Participation.
    solution: Voting is a key way citizens take part.
  - prompt: 'Equality before law means:'
    options:
    - The same laws apply to everyone
    - Leaders are above the law
    - Rich people have different laws
    - Laws change for each person
    answer: The same laws apply to everyone
    difficulty: 1
    hints:
    - No one is above the law.
    - Equal treatment.
    solution: Everyone, including leaders, is subject to the same laws.
