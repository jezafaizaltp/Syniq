concepts:
- code: cbse7ss.king.north
  title: Kingdoms of the 6th to 10th centuries
  notes: |
    After the Guptas, many regional kingdoms rose. Harshavardhana (606–647 CE) ruled from Kannauj; the Chinese
    pilgrim Xuanzang visited and studied at Nalanda, and the poet Banabhatta wrote the Harshacharita. Pulakeshin II
    of the Chalukyas of Badami stopped Harsha at the Narmada. The Pallavas of Kanchipuram built temples at
    Mamallapuram. From the 8th century the tripartite struggle for Kannauj was fought among the Palas (Bengal,
    supporters of Buddhism and Vikramashila university), the Gurjara-Pratiharas (west, who resisted Arab advances)
    and the Rashtrakutas (Deccan, who built the Kailasa temple at Ellora, carved from a single rock).
  explanations:
    text: After the Guptas, power was shared among regional kingdoms. Harsha ruled from Kannauj; the Chalukyas and Pallavas ruled in the south. Then three powers, the Palas, Gurjara-Pratiharas and Rashtrakutas, fought for control of Kannauj for about 200 years.
    visual: Draw a triangle with Kannauj in the middle and three arrows pointing at it from Bengal (Palas), Rajasthan–Gujarat (Pratiharas) and the Deccan (Rashtrakutas).
    step_by_step: 'Step 1: Name the kingdom and its region. Step 2: Name a famous ruler. Step 3: Note a source or monument. Step 4: Explain the struggle for Kannauj.'
    real_world: The Kailasa temple at Ellora, cut downwards from a single hillside by the Rashtrakutas, is one of the largest rock-cut monuments in the world.
  picture:
    kind: compare
    columns:
    - title: Palas
      points:
      - Bengal and Bihar
      - Supported Buddhism
      - Vikramashila university
    - title: Gurjara-Pratiharas
      points:
      - Western India
      - Resisted Arab advances
      - Ruled Kannauj for long
    - title: Rashtrakutas
      points:
      - Deccan
      - Kailasa temple, Ellora
      - Powerful armies
    alt: 'The three powers in the struggle for Kannauj: Palas, Gurjara-Pratiharas and Rashtrakutas, with their regions and achievements.'
