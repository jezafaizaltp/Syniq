    - For Kannauj.
    solution: The Palas, Gurjara-Pratiharas and Rashtrakutas fought over Kannauj.
    mistakes: {"Cholas, Cheras and Pandyas": "s7_tripartite"}
  - prompt: 'The tripartite struggle was for control of:'
