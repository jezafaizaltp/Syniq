    solution: The Palas ruled Bengal and Bihar in the east.
    mistakes:
      Gujarat: c7ss15_three
      Kerala: c7ss15_three
  - prompt: Why did three powers fight over Kannauj?
    options:
    - It was a rich, important city in the Ganga plains
    - It had gold mines
    - It was on the sea
    answer: It was a rich, important city in the Ganga plains
    difficulty: 2
    hints:
    - Harsha had ruled from there.
    - Controlling it meant prestige and wealth.
    solution: Kannauj was a symbol of power and controlled the rich Ganga plains.
    mistakes:
      It had gold mines: c7ss15_three
      It was on the sea: c7ss15_three
  - prompt: 'Xuanzang is a useful source on Harsha''s time because he:'
    options:
    - Wrote about what he saw in India
    - Was Harsha's son
    - Built Nalanda
    answer: Wrote about what he saw in India
    difficulty: 2
    hints:
    - He was a traveller.
    - His records describe Nalanda and Harsha's court.
    solution: Xuanzang's travel record gives an eyewitness account of India in the 7th century.
    mistakes:
      Was Harsha's son: c7ss15_source
      Built Nalanda: c7ss15_learn
  - prompt: 'The Kailasa temple at Ellora is special because it was:'
    options:
    - Carved out of a single rock
    - Made of glass
