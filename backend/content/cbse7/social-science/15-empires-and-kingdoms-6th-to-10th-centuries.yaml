    solution: Pulakeshin II was the great Chalukya king of Badami.
    mistakes:
      Palas: c7ss15_who
      Guptas: c7ss15_who
  - prompt: The Palas ruled which region?
    options:
    - Bengal
    - Gujarat
    - Kerala
    answer: Bengal
    difficulty: 1
    hints:
    - They were the eastern power.
