# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 3), SYNiq chapter 15. Format: content/README.md.
subject: cbse7-ss
chapter: 15
title: 'Empires and Kingdoms: 6th to 10th Centuries'
tips:
  c7ss_traveller: "Faxian came earlier, under the Guptas. Harsha ruled in the 7th century. Which pilgrim visited then?"
  c7ss_bhakti: "The Nayanars sang to Shiva. The Alvars were devotees of the other great god of Tamil bhakti."
  s7_banabhatta: "Harshacharita means Harsha's deeds, written by his court poet."
  s7_bhakti_meaning: "The Bhakti saints sang songs of love for God."
  s7_kannauj: "Delhi became important later. Which city was the prize then?"
  s7_nalanda_students: "Nalanda was famous across Asia."
  s7_pallava: "Mamallapuram is near Chennai, the Pallava coast."
  s7_pulakeshin: "Harsha marched south to the Narmada. Which Chalukya king stopped him?"
  s7_rashtrakuta_ellora: "Ellora is in Maharashtra, the Rashtrakuta homeland."
  s7_tamil_bhakti: "The Alvars and Nayanars lived in the far south and sang for ordinary people in their own language, not in the language of priests."
  s7_tripartite: "'Tripartite' means three parties, in the 8th–10th centuries: two from the north and one from the Deccan."
  s7_vikramashila: "Taxila was older and in the north-west. Which university did the Palas of Bengal found?"
  c7ss15_who: 'Many rulers lived in this age. Match each to his dynasty and region: the Ganga plains, the Deccan, the Tamil coast or Bengal.'
  c7ss15_three: Three powers from the east, west and Deccan fought over one rich city in the Ganga plains. Think about who sat in each direction.
  c7ss15_source: We know this age from inscriptions, a court poet's biography and a foreign pilgrim's travel record. Ask who wrote what.
  c7ss15_temple: 'Each dynasty left temples in its own region: shore and rock temples by the sea, temple towns in the Deccan, a rock-cut wonder in the western hills.'
  c7ss15_saints: Two groups of Tamil saint-poets sang of two different gods. Think about which god each group loved.
  c7ss15_learn: Great universities drew students from far lands. Think about who supported them and where they were.
  c7ss15_calc: Write the subtraction or addition for the years first. All dates here are CE.
concepts:
- code: cbse7ss.king.north
  title: Kingdoms of the 6th to 10th centuries
  notes: |
    After the Guptas, many regional kingdoms rose. Harshavardhana (606–647 CE) ruled from Kannauj; the Chinese
    pilgrim Xuanzang visited and studied at Nalanda, and the poet Banabhatta wrote the Harshacharita. Pulakeshin II
    of the Chalukyas of Badami stopped Harsha at the Narmada. The Pallavas of Kanchipuram built temples at
    Mamallapuram. From the 8th century the tripartite struggle for Kannauj was fought among the Palas (Bengal,
    supporters of Buddhism and Vikramashila university), the Gurjara-Pratiharas (west, who resisted Arab advances)
    and the Rashtrakutas (Deccan, who built the Kailasa temple at Ellora, carved from a single rock).
  explanations:
    text: After the Guptas, power was shared among regional kingdoms. Harsha ruled from Kannauj; the Chalukyas and Pallavas ruled in the south. Then three powers, the Palas, Gurjara-Pratiharas and Rashtrakutas, fought for control of Kannauj for about 200 years.
    visual: Draw a triangle with Kannauj in the middle and three arrows pointing at it from Bengal (Palas), Rajasthan–Gujarat (Pratiharas) and the Deccan (Rashtrakutas).
    step_by_step: 'Step 1: Name the kingdom and its region. Step 2: Name a famous ruler. Step 3: Note a source or monument. Step 4: Explain the struggle for Kannauj.'
    real_world: The Kailasa temple at Ellora, cut downwards from a single hillside by the Rashtrakutas, is one of the largest rock-cut monuments in the world.
  picture:
    kind: compare
    columns:
    - title: Palas
      points:
      - Bengal and Bihar
      - Supported Buddhism
      - Vikramashila university
    - title: Gurjara-Pratiharas
      points:
      - Western India
      - Resisted Arab advances
      - Ruled Kannauj for long
    - title: Rashtrakutas
      points:
      - Deccan
      - Kailasa temple, Ellora
      - Powerful armies
    alt: 'The three powers in the struggle for Kannauj: Palas, Gurjara-Pratiharas and Rashtrakutas, with their regions and achievements.'
  activity:
    type: sort
    prompt: Which dynasty in the tripartite struggle?
    bins:
    - Palas
    - Gurjara-Pratiharas
    - Rashtrakutas
    items:
    - label: Bengal, supported Buddhism
      bin: Palas
      clue: Vikramashila.
      why: Palas.
    - label: Resisted Arab advances in the west
      bin: Gurjara-Pratiharas
      clue: West.
      why: Pratiharas.
    - label: Kailasa temple at Ellora
      bin: Rashtrakutas
      clue: Deccan.
      why: Rashtrakutas.
    - label: Vikramashila university
      bin: Palas
      clue: Bengal-Bihar.
      why: Palas.
  lesson:
    - teach: After the Guptas, power broke into regional kingdoms. Harshavardhana (606-647 CE) ruled north India from Kannauj. His court poet Banabhatta wrote his life story, the Harshacharita, and the Chinese pilgrim Xuanzang stayed for years and studied at Nalanda.
      check:
        prompt: 'Harsha''s capital was:'
        options:
        - Kannauj
        - Pataliputra
        - Kanchipuram
        answer: Kannauj
        why: Kannauj in the Ganga plains was Harsha's capital.
    - teach: In the Deccan, Pulakeshin II of the Chalukyas of Badami stopped Harsha's army at the Narmada river. In the south, the Pallavas of Kanchipuram built stone temples at Mamallapuram by the sea.
      picture:
        kind: compare
        columns:
        - title: Harsha
          points:
          - north
          - capital Kannauj
        - title: Chalukyas
          points:
          - Deccan
          - Pulakeshin II, Badami
        - title: Pallavas
          points:
          - Tamil coast
          - Kanchipuram
        alt: Three powers of the 7th century and their regions.
      check:
        prompt: Which river became the boundary between Harsha and Pulakeshin II?
        options:
        - Narmada
        - Ganga
        - Kaveri
        answer: Narmada
        why: Pulakeshin stopped Harsha at the Narmada.
    - teach: 'From the 8th century, three powers fought for Kannauj: the Palas of Bengal (east), the Gurjara-Pratiharas (west) and the Rashtrakutas (Deccan). This long fight is called the tripartite struggle. The Rashtrakutas built the Kailasa temple at Ellora, carved from a single rock.'
      picture:
        kind: flow
        steps:
        - Palas (Bengal, east)
        - Gurjara-Pratiharas (west)
        - Rashtrakutas (Deccan)
        - All fight for Kannauj
        alt: The three powers of the tripartite struggle.
      check:
        prompt: '''Tripartite'' means:'
        options:
        - Among three parties
        - Between two cities
        - Of four kings
        answer: Among three parties
        why: '''Tri'' means three.'
  items:
  - prompt: Which Chinese pilgrim visited Harsha's court and studied at Nalanda?
