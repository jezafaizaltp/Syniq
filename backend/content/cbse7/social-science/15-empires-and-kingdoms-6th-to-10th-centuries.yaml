- code: cbse7ss.king.culture
  title: Culture and learning in this period
  after:
  - cbse7ss.king.north
  notes: |
    This period saw temple architecture flourish: Pallava shore temple and rathas at Mamallapuram; Chalukya
    temples at Aihole, Badami and Pattadakal; Kailasa temple at Ellora. Bhakti (devotion) grew in the south through
    the Alvars (devotees of Vishnu) and Nayanars (devotees of Shiva), who sang in Tamil. Universities like Nalanda
    and Vikramashila drew students from Tibet, China and Southeast Asia. Adi Shankaracharya taught Advaita Vedanta
    and set up mathas. Indian ideas, scripts and art spread to Southeast Asia through trade.
  explanations:
    text: This was a great age for temples, devotional songs and learning. The Pallavas and Chalukyas built beautiful stone temples; the Alvars and Nayanars sang Tamil bhakti hymns; and universities like Nalanda drew students from across Asia.
    visual: Picture the shore temple at Mamallapuram facing the sea, with carved rathas (chariot-shaped shrines) nearby.
    step_by_step: 'Step 1: Name the monument and its builders. Step 2: Name the devotional movement and its language. Step 3: Name the centre of learning. Step 4: Note links with other lands.'
    real_world: The group of monuments at Mamallapuram, near Chennai, is a UNESCO World Heritage Site.
  picture:
    kind: compare
    columns:
    - title: Temples
      points:
      - Mamallapuram (Pallavas)
      - Pattadakal (Chalukyas)
      - Ellora (Rashtrakutas)
    - title: Ideas and learning
      points:
      - 'Alvars and Nayanars: Tamil bhakti'
      - Nalanda, Vikramashila
      - Adi Shankaracharya
    alt: 'Culture of the 6th to 10th centuries: temples at Mamallapuram, Pattadakal and Ellora, and ideas and learning from bhakti saints, universities and Shankaracharya.'
  activity:
    type: sort
    prompt: Who or what?
    bins:
    - Alvars
    - Nayanars
    - Adi Shankaracharya
    - Nalanda
    items:
    - label: Tamil devotees of Vishnu
      bin: Alvars
      clue: Bhakti saints.
      why: Alvars.
    - label: Tamil devotees of Shiva
      bin: Nayanars
      clue: Bhakti saints.
      why: Nayanars.
    - label: Taught Advaita and set up mathas
      bin: Adi Shankaracharya
      clue: Philosopher.
      why: Shankaracharya.
    - label: Students came from Tibet and China
      bin: Nalanda
      clue: University.
      why: Nalanda.
  lesson:
    - teach: Temple building flourished. The Pallavas built the Shore Temple and the five rathas (chariot-shaped rock temples) at Mamallapuram. The Chalukyas built temples at Aihole, Badami and Pattadakal. The Rashtrakutas carved the Kailasa temple at Ellora.
      check:
        prompt: Where are the Pallava rathas?
        options:
        - Mamallapuram
        - Ellora
        - Kannauj
        answer: Mamallapuram
        why: They are carved from rock near the sea at Mamallapuram.
    - teach: Bhakti, loving devotion to God, grew in Tamil lands. The Alvars sang of Vishnu and the Nayanars of Shiva, in Tamil. They welcomed people of all castes and both women and men; Andal was a famous woman Alvar.
      picture:
        kind: compare
        columns:
        - title: Alvars
          points:
          - devotees of Vishnu
          - sang in Tamil
          - e.g. Andal
        - title: Nayanars
          points:
          - devotees of Shiva
          - sang in Tamil
          - e.g. Appar
        alt: The two groups of Tamil bhakti saints.
      check:
        prompt: 'Andal was a famous woman saint among the:'
        options:
        - Alvars
        - Nayanars
        - Rashtrakutas
        answer: Alvars
        why: Andal sang of Vishnu.
    - teach: 'Learning thrived: Nalanda and Vikramashila drew students from Tibet, China and Southeast Asia. Adi Shankaracharya taught Advaita Vedanta and founded mathas in the four corners of India. Indian scripts and art spread to Southeast Asia through trade.'
      check:
        prompt: Why did students come from Tibet and China to Nalanda?
        options:
        - It was a famous centre of Buddhist learning
        - It was a sea port
        - It sold horses
        answer: It was a famous centre of Buddhist learning
        why: Nalanda had great teachers and libraries.
  items:
