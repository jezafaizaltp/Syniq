# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 12. Format: content/README.md.
subject: cbse7-ss
chapter: 12
title: Understanding Markets
tips:
  c7ss_wholesale: Wholesale = bulk to traders; retail = small amounts to customers.
  c7ss_marks: "ISI is for industrial goods and Hallmark for gold. Which mark's name starts with AG, for agriculture?"
  s7_bill: "If a product is faulty, how do you prove where you bought it?"
  s7_consumer_forum: "Consumers complain to a special court or forum."
  s7_exports: "'Ex' means out. Imports come in."
  s7_haat: "A mall is a big building in a city. What is the name of the open market that meets once a week in a village?"
  s7_isi: "Agmark is for farm goods and Hallmark for gold. Which mark is for industrial goods?"
  s7_mrp: "MRP is the most a shop can charge you."
  s7_msp: "MSP is a promise from the government to farmers."
  s7_online: "Online means on the internet."
  s7_profit: "Profit per kg = 48 − 40. Multiply by 10 kg."
  s7_supply_price: "Fewer onions but the same buyers. Which way does the price go?"
  c7ss12_kind: 'Markets differ by how much is sold at once, who buys, and where it happens. Ask: bulk or small amounts? Traders or families? In person, abroad or online?'
  c7ss12_price: When something becomes scarce while people still want it, sellers can charge more; when there is plenty, prices drop.
  c7ss12_trade: Goods leaving the country and goods coming in have different names. Decide which way the goods move.
  c7ss12_money: Profit is what you earn from selling minus what you paid. Work out each total before subtracting.
  c7ss12_marks: 'Different quality marks go on different kinds of goods: factory goods, farm goods, gold and packaged food. Match the product type.'
  c7ss12_rights: A consumer has the right to fair weight, fair price, safe goods and a way to complain. Look for the choice that protects the buyer.
  c7ss12_farmer: Farmers often sell through many middle steps, each taking a share. Think about who helps the farmer get a fair price.
concepts:
- code: cbse7ss.mkt.types
  title: What markets are and their types
  notes: |
    A market is any arrangement where buyers and sellers exchange goods and services: a weekly haat, a mandi, a
    neighbourhood shop, a shopping mall, or online. Wholesale markets sell in bulk to traders; retail markets sell
    small quantities to consumers. Domestic markets are within a country; international markets involve trade
    between countries (exports and imports). Prices depend on demand (how much buyers want) and supply (how much is
    available): when supply falls (e.g. tomatoes after floods), prices rise.
  explanations:
    text: A market is wherever buyers and sellers meet, from a village haat to a website. Wholesalers sell in bulk to shopkeepers; retailers sell small amounts to us. Prices rise when something is scarce and fall when there is plenty.
    visual: 'Trace a tomato: a farmer sells a truckload at the mandi (wholesale) to a trader, who sells crates to a local shop, which sells half a kilo to a customer (retail).'
    step_by_step: 'Step 1: Who is buying and who is selling? Step 2: Bulk or small quantity: wholesale or retail. Step 3: Within India or across borders: domestic or international. Step 4: Check supply and demand to explain the price.'
    real_world: When heavy rain spoils tomato crops, tomato prices in city markets can jump sharply because supply falls.
  picture:
    kind: flow
    steps:
    - Farmer grows tomatoes
    - 'Mandi: sold in bulk (wholesale)'
    - Trader buys crates
    - Local shop
    - Customer buys half a kilo (retail)
    alt: A tomato's journey from farmer to wholesale mandi, trader, local shop and finally a retail customer.
  activity:
    type: sort
    prompt: Wholesale or retail?
    bins:
    - Wholesale
    - Retail
    items:
    - label: A mandi selling sacks of onions to traders
      bin: Wholesale
      clue: In bulk.
      why: Wholesale.
    - label: A shop selling 1 kg of onions to you
      bin: Retail
      clue: Small amounts.
      why: Retail.
    - label: A weekly haat stall selling vegetables to families
      bin: Retail
      clue: To consumers.
      why: Retail.
    - label: Cloth sold by the bale to shopkeepers
      bin: Wholesale
      clue: Bulk.
      why: Wholesale.
  lesson:
    - teach: A market is any place or system where buyers and sellers exchange goods and services. It can be a weekly haat, a mandi, a corner shop, a mall, or a website. You do not have to see the seller for it to be a market.
      check:
        prompt: Is buying a book on a website using a market?
        options:
        - Yes, it is an online market
        - No, markets must have stalls
        - Only if you pay cash
        answer: Yes, it is an online market
        why: Any buyer-seller exchange is a market.
    - teach: Wholesale markets sell large quantities to traders; retail markets sell small amounts to consumers. Goods often go farmer -> wholesale trader -> retailer -> consumer, and the price rises a little at each step. Domestic markets are inside India; international trade means exports (sold abroad) and imports (bought from abroad).
      picture:
        kind: flow
        steps:
        - Farmer grows tomatoes
        - Wholesale trader buys in bulk at the mandi
        - Retailer buys a few crates
        - Consumer buys 1 kg
        alt: The chain of a market, from farmer to consumer.
      check:
        prompt: Who buys from a wholesale market?
        options:
        - Traders and shopkeepers in bulk
        - Only tourists
        - Only children
        answer: Traders and shopkeepers in bulk
        why: Wholesale is selling in large amounts to traders.
    - teach: Prices depend on supply (how much is available) and demand (how much buyers want). If floods destroy tomato crops, supply falls and prices rise. In a good harvest, supply is high and prices fall.
      picture:
        kind: compare
        columns:
        - title: Supply falls
          points:
          - less available
          - price rises
        - title: Supply rises
          points:
          - plenty available
          - price falls
        alt: How supply changes affect price.
      check:
        prompt: 'There is a huge mango harvest this year. Mango prices will probably:'
        options:
        - Fall
        - Rise sharply
        - Stay exactly the same forever
        answer: Fall
        why: High supply usually lowers price.
  items:
  - prompt: 'A weekly market in a village is called a:'
    options:
    - Haat
    - Mall
    - Bank
    - Factory
    answer: Haat
    difficulty: 1
    hints:
    - Held on a fixed day.
    - Open-air.
    solution: A weekly village market is a haat.
    mistakes: {"Mall": "s7_haat"}
  - prompt: 'A wholesale market sells:'
    options:
    - In large quantities to traders
    - Single items to customers
    - Only online
    - Only services
    answer: In large quantities to traders
    difficulty: 1
    hints:
    - Bulk.
    - Mandi.
    solution: Wholesalers sell in bulk.
    mistakes:
      Single items to customers: c7ss_wholesale
  - prompt: 'When the supply of onions falls sharply, their price usually:'
    options:
    - Rises
    - Falls
    - Stays the same
    - Becomes zero
    answer: Rises
    difficulty: 2
    hints:
    - Scarce goods.
    - Many buyers, little supply.
    solution: Less supply with the same demand pushes prices up.
    mistakes: {"Falls": "s7_supply_price"}
  - prompt: 'Goods sold by India to other countries are called:'
    options:
    - Exports
    - Imports
    - Taxes
    - Loans
    answer: Exports
    difficulty: 2
    hints:
    - Going out.
    - Imports come in.
    solution: Goods sent abroad are exports.
    mistakes: {"Imports": "s7_exports"}
  - prompt: Which is an online market?
    options:
    - A shopping website
    - A haat
    - A mandi
    - A village fair
    answer: A shopping website
    difficulty: 1
    hints:
    - Internet.
    - Buy on a phone.
    solution: Shopping websites are online markets.
    mistakes: {"A mandi": "s7_online"}
  - prompt: A shopkeeper buys 10 kg of rice at ₹40 per kg wholesale and sells it at ₹48 per kg. How much profit, in rupees?
    answer: '80'
    check: (48 - 40)*10
    difficulty: 2
    hints:
    - Profit per kg = 8.
    - 8 × 10.
    solution: (48 − 40) × 10 = ₹80.
    mistakes: {"8": "s7_profit", "480": "s7_profit"}
  - prompt: 'A mandi is mainly a:'
    options:
    - Market where farm produce is sold in bulk
    - Bank
    - School
    answer: Market where farm produce is sold in bulk
    difficulty: 1
    hints:
    - Farmers bring their crops there.
    - Traders buy large amounts.
    solution: A mandi is a regulated market where farmers sell produce to traders.
    mistakes:
      Bank: c7ss12_kind
      School: c7ss12_kind
  - prompt: 'Your family buys 2 kg of sugar from the corner shop. This is a:'
    options:
    - Retail purchase
    - Wholesale purchase
    - Export
    answer: Retail purchase
    difficulty: 1
    hints:
    - It is a small amount.
    - You are the final consumer.
    solution: Buying small amounts for your own use is retail.
    mistakes:
      Wholesale purchase: c7ss12_kind
      Export: c7ss12_trade
  - prompt: 'India buys crude oil from other countries. This is an:'
    options:
    - Import
    - Export
    - Barter
    answer: Import
    difficulty: 1
    hints:
    - The oil comes into India.
    - '''Im'' means in.'
    solution: Goods bought from abroad are imports.
    mistakes:
      Export: c7ss12_trade
      Barter: c7ss12_kind
  - prompt: 'Before Diwali many people want sweets. If supply stays the same, sweet prices will likely:'
    options:
    - Rise
    - Fall to zero
    - Not depend on buyers
    answer: Rise
    difficulty: 2
    hints:
    - Demand goes up.
    - Sellers have the same amount.
    solution: When demand rises and supply stays the same, prices usually rise.
    mistakes:
      Fall to zero: c7ss12_price
      Not depend on buyers: c7ss12_price
  - prompt: A trader buys 50 kg of onions at ₹20 per kg and sells all at ₹26 per kg. Profit in rupees?
    answer: '300'
    check: 50*26-50*20
    difficulty: 2
    hints:
    - Find cost and selling totals.
    - Or find profit per kg and multiply by 50.
    solution: 'Step 1: profit per kg = 26 - 20 = ₹6. Step 2: 6 × 50 = ₹300.'
    mistakes:
      '6': c7ss12_money
      '1300': c7ss12_money
  - prompt: Why does a tomato cost more in a city shop than at the farm?
    options:
    - Each step in the chain adds transport and profit
    - City tomatoes are bigger
    - Farmers charge city people more
    answer: Each step in the chain adds transport and profit
    difficulty: 2
    hints:
    - Think of farmer -> trader -> retailer.
    - Each one needs to earn.
    solution: Transport, storage and each trader's profit add to the price.
    mistakes:
      City tomatoes are bigger: c7ss12_farmer
      Farmers charge city people more: c7ss12_farmer
  - prompt: Which is an example of a domestic market?
    options:
    - Kerala spices sold in Delhi
    - Indian tea sold in the UK
    - Japanese cars sold in Japan
    answer: Kerala spices sold in Delhi
    difficulty: 2
    hints:
    - Domestic means inside the same country.
    - Both places must be in India.
    solution: Selling within India, from Kerala to Delhi, is the domestic market.
    mistakes:
      Indian tea sold in the UK: c7ss12_trade
      Japanese cars sold in Japan: c7ss12_trade
  - prompt: 'A weekly haat is useful for villagers because:'
    options:
    - Many sellers come to one place on a fixed day
    - It is open only at night
    - It sells only gold
    answer: Many sellers come to one place on a fixed day
    difficulty: 2
    hints:
    - Villages may not have many shops.
    - Think of 'weekly'.
    solution: A haat brings many goods to villagers on one day each week.
    mistakes:
      It is open only at night: c7ss12_kind
      It sells only gold: c7ss12_kind
  - prompt: A shop buys 20 pens at ₹8 each and sells them at ₹10 each. What is the total profit?
    answer: '40'
    check: 20*10-20*8
    difficulty: 1
    hints:
    - Profit per pen first.
    - Then multiply by 20.
    solution: 'Step 1: 10 - 8 = ₹2 per pen. Step 2: 2 × 20 = ₹40.'
    mistakes:
      '2': c7ss12_money
      '200': c7ss12_money
- code: cbse7ss.mkt.role
  title: Markets in our lives and the government's role
  after:
  - cbse7ss.mkt.types
  notes: |
    Markets connect producers and consumers and create jobs. But markets can be unfair: middlemen may pay farmers
    little; some sellers cheat on weight or quality. The government helps: Minimum Support Price (MSP) for some
    crops, regulated mandis, weights and measures checks, consumer protection laws and consumer courts. Quality
    marks help buyers: ISI (industrial products), AGMARK (farm products), BIS hallmark (gold), FSSAI licence (food).
    Consumers should check marks, expiry dates and bills.
  explanations:
    text: 'Markets bring buyers and sellers together and give people jobs, but they can also be unfair. The government sets rules: fair weights, support prices for farmers and consumer courts. Quality marks like ISI, AGMARK and FSSAI help us buy safe goods.'
    visual: 'Picture a food packet: an FSSAI licence number, an expiry date, an MRP (maximum retail price) and a batch number, all there to protect the buyer.'
    step_by_step: 'Step 1: Check the quality mark (ISI, AGMARK, hallmark, FSSAI). Step 2: Check the expiry date and MRP. Step 3: Ask for a bill. Step 4: If cheated, complain to a consumer forum.'
    real_world: Gold jewellery in India must carry a BIS hallmark to show its purity.
  picture:
    kind: compare
    columns:
    - title: Quality mark
      points:
      - ISI
      - AGMARK
      - BIS hallmark
      - FSSAI
    - title: Used for
      points:
      - Electrical and industrial goods
      - Farm products (spices, ghee)
      - Gold jewellery
      - Packaged food
    alt: 'Quality marks and what they certify: ISI for industrial goods, AGMARK for farm products, BIS hallmark for gold and FSSAI for food.'
  activity:
    type: sort
    prompt: Which quality mark?
    bins:
    - ISI
    - AGMARK
    - Hallmark
    - FSSAI
    items:
    - label: An electric iron
      bin: ISI
      clue: Industrial product.
      why: ISI.
    - label: Honey or spices from farms
      bin: AGMARK
      clue: Farm product.
      why: AGMARK.
    - label: A gold chain
      bin: Hallmark
      clue: Jewellery.
      why: Hallmark.
    - label: A packet of biscuits
      bin: FSSAI
      clue: Food safety licence.
      why: FSSAI.
  lesson:
    - teach: 'Markets connect producers with consumers and create jobs: farmers, transporters, shopkeepers, delivery workers. But markets can be unfair. A farmer may get a low price from middlemen; a seller may cheat on weight or sell poor goods.'
      check:
        prompt: Which is an unfair market practice?
        options:
        - Using a wrong weighing scale
        - Giving a bill
        - Showing the MRP
        answer: Using a wrong weighing scale
        why: It cheats the buyer.
    - teach: 'The government helps make markets fair: Minimum Support Price (MSP) for some crops, regulated mandis, checks on weights and measures, and consumer protection laws with consumer courts where buyers can complain.'
      check:
        prompt: 'MSP mainly protects:'
        options:
        - Farmers from very low crop prices
        - Shopkeepers from customers
        - Tourists
        answer: Farmers from very low crop prices
        why: The government promises a minimum price.
    - teach: 'Quality marks help buyers: ISI on industrial and electrical goods, AGMARK on farm products, BIS hallmark on gold jewellery, FSSAI licence number on packaged food. A smart consumer checks the mark, the expiry date and the MRP, and always takes a bill.'
      picture:
        kind: compare
        columns:
        - title: Mark
          points:
          - ISI
          - AGMARK
          - BIS hallmark
          - FSSAI
        - title: Found on
          points:
          - electrical and industrial goods
          - farm products
          - gold jewellery
          - packaged food
        alt: Quality marks and the goods they appear on.
      check:
        prompt: Which mark should you look for on gold jewellery?
        options:
        - BIS hallmark
        - AGMARK
        - FSSAI
        answer: BIS hallmark
        why: It certifies the purity of gold.
  items:
  - prompt: Which mark is found on farm products like spices and ghee?
    options:
    - AGMARK
    - ISI
    - Hallmark
    - MRP
    answer: AGMARK
    difficulty: 1
    hints:
    - '''Ag'' for agriculture.'
    - Farm goods.
    solution: AGMARK certifies farm products.
    mistakes:
      ISI: c7ss_marks
  - prompt: 'The ISI mark is found on:'
    options:
    - Electrical and industrial goods
    - Vegetables
    - Gold
    - Fresh fish
    answer: Electrical and industrial goods
    difficulty: 2
    hints:
    - Bureau of Indian Standards.
    - Switches, cement.
    solution: ISI marks industrial products.
    mistakes: {"Gold": "s7_isi", "Vegetables": "s7_isi"}
  - prompt: What does MRP stand for?
    options:
    - Maximum Retail Price
    - Minimum Rate of Profit
    - Market Rice Price
    - Monthly Rent Paid
    answer: Maximum Retail Price
    difficulty: 1
    hints:
    - Printed on packets.
    - The most you should pay.
    solution: MRP is the maximum retail price.
    mistakes: {"Minimum Rate of Profit": "s7_mrp"}
  - prompt: Where can a consumer complain about faulty goods?
    options:
    - A consumer forum or court
    - A cinema
    - A school
    - A temple
    answer: A consumer forum or court
    difficulty: 2
    hints:
    - Consumer protection.
    - Special courts.
    solution: Consumer forums handle such complaints.
    mistakes: {"A school": "s7_consumer_forum"}
  - prompt: What is the Minimum Support Price (MSP)?
    options:
    - A price the government promises for some crops
    - The lowest price in a mall
    - A shop discount
    - A bank loan
    answer: A price the government promises for some crops
    difficulty: 2
    hints:
    - Protects farmers.
    - Wheat, rice.
    solution: MSP assures farmers a minimum price for certain crops.
    mistakes: {"A shop discount": "s7_msp"}
  - prompt: Why should you always ask for a bill?
    options:
    - It is proof of purchase if something goes wrong
    - It makes things cheaper
    - It is a gift
    - It is not useful
    answer: It is proof of purchase if something goes wrong
    difficulty: 1
    hints:
    - Needed for complaints.
    - Proof.
    solution: A bill proves what you bought and paid.
    mistakes: {"It makes things cheaper": "s7_bill"}
  - prompt: Which number should appear on a packet of biscuits to show food safety approval?
    options:
    - FSSAI licence number
    - ISI mark
    - BIS hallmark
    answer: FSSAI licence number
    difficulty: 2
    hints:
    - It is about food.
    - It is from the food safety authority.
    solution: Packaged food must show an FSSAI licence number.
    mistakes:
      ISI mark: c7ss12_marks
      BIS hallmark: c7ss12_marks
  - prompt: A shop charges ₹60 for a juice with MRP ₹50. What should you do?
    options:
    - Refuse to pay more than MRP and complain if needed
    - Pay ₹60 silently
    - Pay ₹100
    answer: Refuse to pay more than MRP and complain if needed
    difficulty: 2
    hints:
    - MRP is the maximum price.
    - Charging more is not allowed.
    solution: Selling above MRP is illegal; consumers can refuse and complain.
    mistakes:
      Pay ₹60 silently: c7ss12_rights
      Pay ₹100: c7ss12_rights
  - prompt: A product's MRP is ₹120 and the shop gives ₹15 off. What do you pay?
    answer: '105'
    check: 120-15
    difficulty: 1
    hints:
    - Discount is taken away.
    - Subtract 15 from 120.
    solution: 'Step 1: 120 - 15. Step 2: = ₹105.'
    mistakes:
      '135': c7ss12_money
      '15': c7ss12_money
  - prompt: Why do farmers sometimes get low prices?
    options:
    - Many middlemen take a share before goods reach buyers
    - Farmers do not want money
    - Crops are free in shops
    answer: Many middlemen take a share before goods reach buyers
    difficulty: 2
    hints:
    - Think of the chain from farm to shop.
    - Each step takes a cut.
    solution: Middlemen buy cheaply from farmers and sell higher, so farmers get a small share.
    mistakes:
      Farmers do not want money: c7ss12_farmer
      Crops are free in shops: c7ss12_farmer
  - prompt: A new electric iron should carry which mark?
    options:
    - ISI
    - AGMARK
    - FSSAI
    answer: ISI
    difficulty: 1
    hints:
    - It is an electrical product.
    - AGMARK is for farm goods.
    solution: Electrical and industrial products carry the ISI mark.
    mistakes:
      AGMARK: c7ss12_marks
      FSSAI: c7ss12_marks
  - prompt: Honey sold in a jar should carry which mark?
    options:
    - AGMARK
    - ISI
    - BIS hallmark
    answer: AGMARK
    difficulty: 2
    hints:
    - Honey is a farm product.
    - Gold has a different mark.
    solution: Farm products like honey, spices and ghee carry AGMARK.
    mistakes:
      ISI: c7ss12_marks
      BIS hallmark: c7ss12_marks
  - prompt: Why should you check the expiry date on medicines and food?
    options:
    - Expired items can be unsafe
    - To know the shop's name
    - To find the MRP
    answer: Expired items can be unsafe
    difficulty: 1
    hints:
    - Food and medicines change over time.
    - Safety first.
    solution: After expiry, food may spoil and medicines may not work or may harm.
    mistakes:
      To know the shop's name: c7ss12_rights
      To find the MRP: c7ss12_rights
  - prompt: 'Government officials check shop scales. This protects:'
    options:
    - Buyers from getting less than they pay for
    - Sellers from paying tax
    - Nobody
    answer: Buyers from getting less than they pay for
    difficulty: 2
    hints:
    - Scales measure how much you get.
    - Wrong scales cheat.
    solution: Weights and measures checks ensure buyers get the correct amount.
    mistakes:
      Sellers from paying tax: c7ss12_rights
      Nobody: c7ss12_rights
  - prompt: Ravi's new fan stops working in a week, the shop refuses to help, and he has a bill. Where can he go?
    options:
    - A consumer court or forum
    - A sports club
    - A post office
    answer: A consumer court or forum
    difficulty: 2
    hints:
    - There are special courts for buyers.
    - The bill is his proof.
    solution: Consumers can complain to a consumer commission/forum with the bill as proof.
    mistakes:
      A sports club: c7ss12_rights
      A post office: c7ss12_rights
