# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 1, 2024-25), chapter 12. Format: content/README.md.
subject: cbse7-ss
chapter: 12
title: Understanding Markets
tips:
  c7ss_wholesale: Wholesale = bulk to traders; retail = small amounts to customers.
  c7ss_marks: 'AGMARK: farm products. ISI: industrial goods. Hallmark: gold. FSSAI: food.'
concepts:
- code: cbse7ss.mkt.types
  title: What markets are and their types
  notes: |
    A market is any arrangement where buyers and sellers exchange goods and services: a weekly haat, a mandi, a
    neighbourhood shop, a shopping mall, or online. Wholesale markets sell in bulk to traders; retail markets sell
    small quantities to consumers. Domestic markets are within a country; international markets involve trade
    between countries (exports and imports). Prices depend on demand (how much buyers want) and supply (how much is
    available): when supply falls (e.g. tomatoes after floods), prices rise.
  explanations:
    text: A market is wherever buyers and sellers meet, from a village haat to a website. Wholesalers sell in bulk to shopkeepers; retailers sell small amounts to us. Prices rise when something is scarce and fall when there is plenty.
    visual: 'Trace a tomato: a farmer sells a truckload at the mandi (wholesale) to a trader, who sells crates to a local shop, which sells half a kilo to a customer (retail).'
    step_by_step: 'Step 1: Who is buying and who is selling? Step 2: Bulk or small quantity: wholesale or retail. Step 3: Within India or across borders: domestic or international. Step 4: Check supply and demand to explain the price.'
    real_world: When heavy rain spoils tomato crops, tomato prices in city markets can jump sharply because supply falls.
  picture:
    kind: flow
    steps:
    - Farmer grows tomatoes
    - 'Mandi: sold in bulk (wholesale)'
    - Trader buys crates
    - Local shop
    - Customer buys half a kilo (retail)
    alt: A tomato's journey from farmer to wholesale mandi, trader, local shop and finally a retail customer.
  items:
  - prompt: 'A weekly market in a village is called a:'
    options:
    - Haat
    - Mall
    - Bank
    - Factory
    answer: Haat
    difficulty: 1
    hints:
    - Held on a fixed day.
    - Open-air.
    solution: A weekly village market is a haat.
  - prompt: 'A wholesale market sells:'
    options:
    - In large quantities to traders
    - Single items to customers
    - Only online
    - Only services
    answer: In large quantities to traders
    difficulty: 1
    hints:
    - Bulk.
    - Mandi.
    solution: Wholesalers sell in bulk.
    mistakes:
      Single items to customers: c7ss_wholesale
  - prompt: 'When the supply of onions falls sharply, their price usually:'
    options:
    - Rises
    - Falls
    - Stays the same
    - Becomes zero
    answer: Rises
    difficulty: 2
    hints:
    - Scarce goods.
    - Many buyers, little supply.
    solution: Less supply with the same demand pushes prices up.
  - prompt: 'Goods sold by India to other countries are called:'
    options:
    - Exports
    - Imports
    - Taxes
    - Loans
    answer: Exports
    difficulty: 2
    hints:
    - Going out.
    - Imports come in.
    solution: Goods sent abroad are exports.
  - prompt: Which is an online market?
    options:
    - A shopping website
    - A haat
    - A mandi
    - A village fair
    answer: A shopping website
    difficulty: 1
    hints:
    - Internet.
    - Buy on a phone.
    solution: Shopping websites are online markets.
  - prompt: A shopkeeper buys 10 kg of rice at ₹40 per kg wholesale and sells it at ₹48 per kg. How much profit, in rupees?
    answer: '80'
    check: (48 - 40)*10
    difficulty: 2
    hints:
    - Profit per kg = 8.
    - 8 × 10.
    solution: (48 − 40) × 10 = ₹80.
- code: cbse7ss.mkt.role
  title: Markets in our lives and the government's role
  after:
  - cbse7ss.mkt.types
  notes: |
    Markets connect producers and consumers and create jobs. But markets can be unfair: middlemen may pay farmers
    little; some sellers cheat on weight or quality. The government helps: Minimum Support Price (MSP) for some
    crops, regulated mandis, weights and measures checks, consumer protection laws and consumer courts. Quality
    marks help buyers: ISI (industrial products), AGMARK (farm products), BIS hallmark (gold), FSSAI licence (food).
    Consumers should check marks, expiry dates and bills.
  explanations:
    text: 'Markets bring buyers and sellers together and give people jobs, but they can also be unfair. The government sets rules: fair weights, support prices for farmers and consumer courts. Quality marks like ISI, AGMARK and FSSAI help us buy safe goods.'
    visual: 'Picture a food packet: an FSSAI licence number, an expiry date, an MRP (maximum retail price) and a batch number, all there to protect the buyer.'
    step_by_step: 'Step 1: Check the quality mark (ISI, AGMARK, hallmark, FSSAI). Step 2: Check the expiry date and MRP. Step 3: Ask for a bill. Step 4: If cheated, complain to a consumer forum.'
    real_world: Gold jewellery in India must carry a BIS hallmark to show its purity.
  picture:
    kind: compare
    columns:
    - title: Quality mark
      points:
      - ISI
      - AGMARK
      - BIS hallmark
      - FSSAI
    - title: Used for
      points:
      - Electrical and industrial goods
      - Farm products (spices, ghee)
      - Gold jewellery
      - Packaged food
    alt: 'Quality marks and what they certify: ISI for industrial goods, AGMARK for farm products, BIS hallmark for gold and FSSAI for food.'
  items:
  - prompt: Which mark is found on farm products like spices and ghee?
    options:
    - AGMARK
    - ISI
    - Hallmark
    - MRP
    answer: AGMARK
    difficulty: 1
    hints:
    - '''Ag'' for agriculture.'
    - Farm goods.
    solution: AGMARK certifies farm products.
    mistakes:
      ISI: c7ss_marks
  - prompt: 'The ISI mark is found on:'
    options:
    - Electrical and industrial goods
    - Vegetables
    - Gold
    - Fresh fish
    answer: Electrical and industrial goods
    difficulty: 2
    hints:
    - Bureau of Indian Standards.
    - Switches, cement.
    solution: ISI marks industrial products.
  - prompt: What does MRP stand for?
    options:
    - Maximum Retail Price
    - Minimum Rate of Profit
    - Market Rice Price
    - Monthly Rent Paid
    answer: Maximum Retail Price
    difficulty: 1
    hints:
    - Printed on packets.
    - The most you should pay.
    solution: MRP is the maximum retail price.
  - prompt: Where can a consumer complain about faulty goods?
    options:
    - A consumer forum or court
    - A cinema
    - A school
    - A temple
    answer: A consumer forum or court
    difficulty: 2
    hints:
    - Consumer protection.
    - Special courts.
    solution: Consumer forums handle such complaints.
  - prompt: What is the Minimum Support Price (MSP)?
    options:
    - A price the government promises for some crops
    - The lowest price in a mall
    - A shop discount
    - A bank loan
    answer: A price the government promises for some crops
    difficulty: 2
    hints:
    - Protects farmers.
    - Wheat, rice.
    solution: MSP assures farmers a minimum price for certain crops.
  - prompt: Why should you always ask for a bill?
    options:
    - It is proof of purchase if something goes wrong
    - It makes things cheaper
    - It is a gift
    - It is not useful
    answer: It is proof of purchase if something goes wrong
    difficulty: 1
    hints:
    - Needed for complaints.
    - Proof.
    solution: A bill proves what you bought and paid.
