# CBSE Class 7 Social Science (NCERT Exploring Society: India and Beyond, Part 2 chapter 7), SYNiq chapter 19. Format: content/README.md.
subject: cbse7-ss
chapter: 19
title: 'Infrastructure: Engine of India''s Development'
tips:
  c7ss_transport: Heavy foreign trade goes by sea; air is fast but carries less by weight.
  s7_bharatnet: "'Net' is for the internet."
  s7_india_post: "Post carries messages and letters."
  s7_infrastructure: "Infrastructure is the base that everything runs on."
  s7_pmgsy: "'Gram Sadak' means village road."
  s7_power_infra: "Power plants and dams support everything else."
  s7_rail_freight: "Planes are fast but costly. Which mode carries heavy loads cheaply?"
  s7_responsible: "Public property belongs to all of us."
  s7_taxes: "Public infrastructure is built with public money."
  s7_transport_farmers: "Faster transport means fresher produce at the market."
  s7_udan: "UDAN means 'to fly'."
  c7ss19_what: 'Basic shared facilities that everything else depends on: roads, power, water, ports and networks. Ask whether the choice is one of these.'
  c7ss19_mode: 'Each kind of transport suits different jobs: heavy loads over land, fast long trips, huge cargo across oceans, short local trips. Match the job.'
  c7ss19_scheme: 'Each scheme connects something different: village roads, small-town airports or village internet. Match the scheme to what it links.'
  c7ss19_comm: 'Communication facilities carry messages: letters, calls, data and signals from space. Ask what carries the message.'
  c7ss19_pay: Public facilities are built with public money. Think about where that money comes from and who must look after them.
  c7ss19_calc: Write the calculation first. Time = distance ÷ speed; totals need multiplying.
concepts:
- code: cbse7ss.infra.transport
  title: Transport infrastructure
  notes: |
    Infrastructure is the basic facilities a country needs to function: roads, railways, ports, airports, power,
    water, communication. India has one of the world's largest road networks (national highways, state highways,
    rural roads under PMGSY) and rail networks (Indian Railways, a major employer; metro systems in cities;
    dedicated freight corridors). Air transport links distant places quickly (UDAN for regional routes). Ports
    handle most of India's foreign trade by volume (e.g. Mumbai's JNPT, Mundra, Visakhapatnam). Good transport
    lowers costs, connects markets and creates jobs.
  explanations:
    text: Infrastructure means the basic facilities that keep a country running, like roads, railways, ports and airports. Good transport lets farmers reach markets, workers reach jobs and goods reach shops cheaply.
    visual: 'Draw a map of India crossed by lines: thick red highways, black railway lines, ships at ports on both coasts, and aeroplanes linking big cities.'
    step_by_step: 'Step 1: Name the type of transport. Step 2: Say what it is best for (roads: short distances; rail: bulk and long distances; ships: heavy foreign trade; air: speed). Step 3: Name a scheme or example.'
    real_world: The Pradhan Mantri Gram Sadak Yojana has built all-weather roads to tens of thousands of villages, so children can reach school even in the monsoon.
  picture:
    kind: compare
    columns:
    - title: Mode
      points:
      - Roads
      - Railways
      - Waterways and ports
      - Airways
    - title: Best for
      points:
      - Short trips, door to door
      - Long distances, bulk goods, many passengers
      - Heavy foreign trade
      - Speed over long distances
    alt: 'Modes of transport and what each is best for: roads for short door-to-door trips, rail for long distances and bulk, ports for heavy trade, air for speed.'
  activity:
    type: sort
    prompt: Road, rail, air or port?
    bins:
    - Road
    - Rail
    - Air
    - Port
    items:
    - label: PMGSY village roads
      bin: Road
      clue: Rural.
      why: Road.
    - label: Dedicated freight corridors
      bin: Rail
      clue: Goods trains.
      why: Rail.
    - label: UDAN regional flights
      bin: Air
      clue: Planes.
      why: Air.
    - label: JNPT, Mumbai
      bin: Port
      clue: Ships.
      why: Port.
    - label: Metro systems
      bin: Rail
      clue: City trains.
      why: Rail.
  lesson:
    - teach: 'Infrastructure means the basic facilities a country needs to work: roads, railways, ports, airports, power, water and communication. Just as a body needs bones and blood vessels, an economy needs infrastructure.'
      check:
        prompt: Which of these is infrastructure?
        options:
        - A national highway
        - A cricket bat
        - A school uniform
        answer: A national highway
        why: Roads are basic shared facilities.
    - teach: India has huge road and rail networks. PMGSY builds all-weather roads to villages. Indian Railways carries millions of passengers and heavy freight; cities have metros. UDAN makes flights to smaller towns affordable. Ports like JNPT (Mumbai), Mundra and Visakhapatnam handle most foreign trade by volume.
      picture:
        kind: compare
        columns:
        - title: Mode
          points:
          - Roads
          - Railways
          - Air
          - Sea
        - title: Best for
          points:
          - door-to-door, villages
          - heavy goods, long land trips
          - fast, far trips
          - bulk foreign trade
        alt: Different modes of transport and what each suits best.
      check:
        prompt: Which mode is best to carry tonnes of coal across the country cheaply?
        options:
        - Railways
        - Air
        - Bicycle
        answer: Railways
        why: Trains move heavy loads cheaply over land.
    - teach: Good transport lowers costs, connects markets and creates jobs. A farmer with a good road reaches the mandi faster; fresh vegetables don't spoil; children reach school; ambulances reach patients.
      check:
        prompt: How does a new village road help a sick person?
        options:
        - An ambulance can reach faster
        - It makes rain fall
        - It cures the illness
        answer: An ambulance can reach faster
        why: Roads speed up emergency help.
  items:
  - prompt: What does 'infrastructure' mean?
    options:
    - Basic facilities like roads, power and water
    - A kind of tax
    - A type of crop
    - A festival
    answer: Basic facilities like roads, power and water
    difficulty: 1
    hints:
    - Foundation of an economy.
    - Roads, railways.
    solution: Infrastructure is the basic facilities a country needs.
    mistakes: {"A kind of tax": "s7_infrastructure"}
  - prompt: 'Most of India''s foreign trade by volume goes through:'
    options:
    - Seaports
    - Airports
    - Roads
    - Pipelines
    answer: Seaports
    difficulty: 2
    hints:
    - Heavy goods.
    - Ships.
    solution: Ports handle most foreign trade by volume.
    mistakes:
      Airports: c7ss_transport
  - prompt: Which scheme builds all-weather roads to villages?
    options:
    - PMGSY (Pradhan Mantri Gram Sadak Yojana)
    - UDAN
    - Namami Gange
    - PM-KISAN
    answer: PMGSY (Pradhan Mantri Gram Sadak Yojana)
    difficulty: 2
    hints:
    - '''Gram sadak'' = village road.'
    - Rural roads.
    solution: PMGSY builds rural roads.
    mistakes: {"UDAN": "s7_pmgsy"}
  - prompt: Which mode is cheapest for carrying heavy goods long distances on land?
    options:
    - Railways
    - Aeroplanes
    - Bicycles
    - Taxis
    answer: Railways
    difficulty: 2
    hints:
    - Bulk goods.
    - Freight trains.
    solution: Railways carry bulk goods cheaply over long distances.
    mistakes: {"Aeroplanes": "s7_rail_freight"}
  - prompt: 'The UDAN scheme aims to:'
    options:
    - Make regional air travel affordable
    - Build ports
    - Clean rivers
    - Give farmers loans
    answer: Make regional air travel affordable
    difficulty: 2
    hints:
    - '''Ude Desh ka Aam Naagrik''.'
    - Air.
    solution: UDAN supports affordable regional flights.
    mistakes: {"Build ports": "s7_udan"}
  - prompt: How does good transport help farmers?
    options:
    - They reach markets faster and get better prices
    - They grow fewer crops
    - Crops spoil more
    - It has no effect
    answer: They reach markets faster and get better prices
    difficulty: 1
    hints:
    - Less spoilage.
    - More buyers.
    solution: Good roads let farmers sell quickly and widely.
    mistakes: {"Crops spoil more": "s7_transport_farmers"}
  - prompt: PMGSY builds what kind of roads?
    options:
    - All-weather roads to villages
    - Roads on the Moon
    - Only city flyovers
    answer: All-weather roads to villages
    difficulty: 1
    hints:
    - '''Gram'' means village.'
    - The roads must work even in the rains.
    solution: Pradhan Mantri Gram Sadak Yojana connects villages with all-weather roads.
    mistakes:
      Roads on the Moon: c7ss19_scheme
      Only city flyovers: c7ss19_scheme
  - prompt: 'A container ship carrying cars from India to Europe uses:'
    options:
    - A seaport
    - A metro station
    - A bus stand
    answer: A seaport
    difficulty: 1
    hints:
    - Europe is across the ocean.
    - Ships dock at it.
    solution: International cargo by sea passes through seaports.
    mistakes:
      A metro station: c7ss19_mode
      A bus stand: c7ss19_mode
  - prompt: 'A metro rail mainly helps:'
    options:
    - People travel quickly within a city
    - Ships cross the ocean
    - Farmers irrigate fields
    answer: People travel quickly within a city
    difficulty: 1
    hints:
    - It runs inside cities.
    - It reduces traffic jams.
    solution: Metros carry many passengers quickly across a city.
    mistakes:
      Ships cross the ocean: c7ss19_mode
      Farmers irrigate fields: c7ss19_what
  - prompt: A train travels 600 km at 75 km per hour. How many hours does it take?
    answer: '8'
    check: 600/75
    difficulty: 2
    hints:
    - Time = distance ÷ speed.
    - Divide 600 by 75.
    solution: 'Step 1: 600 ÷ 75. Step 2: = 8 hours.'
    mistakes:
      '45000': c7ss19_calc
      '525': c7ss19_calc
  - prompt: Why are dedicated freight corridors being built?
    options:
    - So goods trains run faster on separate tracks
    - To stop all trade
    - For walking only
    answer: So goods trains run faster on separate tracks
    difficulty: 3
    hints:
    - Passenger and goods trains share tracks now.
    - '''Freight'' means goods.'
    solution: Separate tracks for goods trains speed up freight and free lines for passenger trains.
    mistakes:
      To stop all trade: c7ss19_mode
      For walking only: c7ss19_mode
  - prompt: Fresh fish from Kerala must reach Delhi in hours. Which mode is fastest?
    options:
    - Air
    - Bullock cart
    - Sea
    answer: Air
    difficulty: 1
    hints:
    - Delhi is far.
    - Speed matters more than cost here.
    solution: Air transport is fastest for long distances and perishable goods.
    mistakes:
      Bullock cart: c7ss19_mode
      Sea: c7ss19_mode
  - prompt: Why do factories often grow near good roads and ports?
    options:
    - Raw materials and products move cheaply
    - Roads make goods for free
    - Ports have no workers
    answer: Raw materials and products move cheaply
    difficulty: 2
    hints:
    - Factories need to bring in and send out goods.
    - Transport cost matters.
    solution: Good transport lowers the cost of moving inputs and products, so industries locate near it.
    mistakes:
      Roads make goods for free: c7ss19_what
      Ports have no workers: c7ss19_what
  - prompt: A truck carries 12 tonnes per trip. How many tonnes in 15 trips?
    answer: '180'
    check: 12*15
    difficulty: 1
    hints:
    - Each trip carries the same.
    - Multiply.
    solution: 'Step 1: 12 × 15. Step 2: = 180 tonnes.'
    mistakes:
      '27': c7ss19_calc
      '3': c7ss19_calc
  - prompt: Which is NOT transport infrastructure?
    options:
    - A wheat field
    - An airport
    - A railway line
    answer: A wheat field
    difficulty: 1
    hints:
    - Transport moves people and goods.
    - One option grows food.
    solution: Airports and railways are transport infrastructure; a field is farmland.
    mistakes:
      An airport: c7ss19_what
      A railway line: c7ss19_what
- code: cbse7ss.infra.comm
  title: Communication and shared responsibility
  after:
  - cbse7ss.infra.transport
  notes: |
    Communication infrastructure: postal network (India Post, one of the largest in the world), telephones and
    mobile networks, the internet and optical fibre (BharatNet for villages), satellites (ISRO's communication
    satellites), digital services (UPI, DigiLocker, online classes). Energy (power plants, solar parks) and water
    (dams, pipelines) are also infrastructure. Building and maintaining infrastructure needs public money (taxes),
    planning and care: citizens should not damage public property and should use resources wisely.
  explanations:
    text: 'Communication links people instantly: post offices, mobile phones, the internet and satellites. Power and water networks are infrastructure too. These are built with public money, so all of us must protect them.'
    visual: Picture a village where a fibre cable reaches the panchayat office, a mobile tower stands on the hill, and a child attends an online class while a farmer checks crop prices on a phone.
    step_by_step: 'Step 1: Name the communication service. Step 2: Say how it helps (information, payments, education). Step 3: Name a scheme (BharatNet, India Post). Step 4: Remember our duty to protect public property.'
    real_world: India Post runs over 1.5 lakh post offices, most of them in villages, delivering letters, pensions and savings services.
  picture:
    kind: compare
    columns:
    - title: Communication
      points:
      - India Post
      - Mobile networks
      - 'Internet: BharatNet'
      - Satellites (ISRO)
    - title: Citizens' role
      points:
      - Protect public property
      - Save power and water
      - Pay taxes
      - Report damage
    alt: Communication infrastructure (post, mobile, internet, satellites) and citizens' role in protecting and using it wisely.
  activity:
    type: sort
    prompt: Which communication infrastructure?
    bins:
    - Postal
    - Internet
    - Satellite
    - Digital service
    items:
    - label: India Post
      bin: Postal
      clue: Letters.
      why: Postal.
    - label: BharatNet fibre for villages
      bin: Internet
      clue: Optical fibre.
      why: Internet.
    - label: ISRO's communication satellites
      bin: Satellite
      clue: In space.
      why: Satellite.
    - label: DigiLocker
      bin: Digital service
      clue: Documents online.
      why: Digital service.
  lesson:
    - teach: 'Communication infrastructure carries messages and information: India Post (one of the world''s largest postal networks), telephone and mobile networks, the internet over optical fibre, and satellites. ISRO launches communication satellites that carry TV and phone signals.'
      check:
        prompt: What carries TV signals to remote villages?
        options:
        - Communication satellites
        - Bullock carts
        - Rivers
        answer: Communication satellites
        why: Satellites relay signals over long distances.
    - teach: BharatNet is laying optical fibre to bring high-speed internet to villages. Digital services like UPI, DigiLocker and online classes depend on it. Energy (power plants, solar parks) and water (dams, pipelines) are also infrastructure.
      picture:
        kind: compare
        columns:
        - title: Communication
          points:
          - post
          - mobile
          - internet, BharatNet
          - satellites
        - title: Energy and water
          points:
          - power plants
          - solar parks
          - dams
          - pipelines
        alt: More kinds of infrastructure.
      check:
        prompt: A solar park is part of which infrastructure?
        options:
        - Energy
        - Transport
        - Postal
        answer: Energy
        why: It produces electricity.
    - teach: Infrastructure is built with public money (taxes) and needs planning and care. Citizens should not damage public property, should report problems, and should use water and power wisely.
      check:
        prompt: Who ultimately pays when a public bus is damaged?
        options:
        - All of us, through taxes
        - Nobody
        - Only the driver
        answer: All of us, through taxes
        why: Repairs use public money.
  items:
  - prompt: BharatNet aims to bring what to villages?
    options:
    - High-speed internet
    - Railways
    - Airports
    - Ports
    answer: High-speed internet
    difficulty: 2
    hints:
    - Optical fibre.
    - Gram panchayats.
    solution: BharatNet connects villages with broadband.
    mistakes: {"Railways": "s7_bharatnet"}
  - prompt: Which organisation launches India's communication satellites?
    options:
    - ISRO
    - RBI
    - IMD
    - FSSAI
    answer: ISRO
    difficulty: 1
    hints:
    - Space agency.
    - Indian Space Research Organisation.
    solution: ISRO launches satellites.
    mistakes:
      IMD: c7ss_read_again
  - prompt: 'India Post is an example of:'
    options:
    - Communication infrastructure
    - A farm
    - A court
    - A bank only
    answer: Communication infrastructure
    difficulty: 1
    hints:
    - Letters and parcels.
    - Post offices.
    solution: The postal network is communication infrastructure.
    mistakes: {"A bank only": "s7_india_post"}
  - prompt: Who pays for most public infrastructure?
    options:
    - Citizens, through taxes
    - Only foreign countries
    - Nobody
    - Only schools
    answer: Citizens, through taxes
    difficulty: 2
    hints:
    - Public money.
    - Government budgets.
    solution: Taxes fund public infrastructure.
    mistakes: {"Only foreign countries": "s7_taxes"}
  - prompt: Which is a responsible action by citizens?
    options:
    - Not damaging public property
    - Writing on monuments
    - Breaking streetlights
    - Wasting water
    answer: Not damaging public property
    difficulty: 1
    hints:
    - It belongs to all.
    - Paid for by everyone.
    solution: Protecting public property is a citizen's duty.
    mistakes: {"Writing on monuments": "s7_responsible"}
  - prompt: 'Power plants and dams are also part of:'
    options:
    - Infrastructure
    - Agriculture only
    - Entertainment
    - Retail markets
    answer: Infrastructure
    difficulty: 1
    hints:
    - Energy and water.
    - Basic facilities.
    solution: Energy and water systems are infrastructure.
    mistakes: {"Entertainment": "s7_power_infra"}
  - prompt: 'Optical fibre cables carry:'
    options:
    - Internet data as light signals
    - Water to homes
    - Petrol
    answer: Internet data as light signals
    difficulty: 2
    hints:
    - BharatNet uses them.
    - They are very thin glass strands.
    solution: Optical fibres carry data as pulses of light, giving fast internet.
    mistakes:
      Water to homes: c7ss19_comm
      Petrol: c7ss19_comm
  - prompt: 'DigiLocker lets people:'
    options:
    - Keep important documents safely online
    - Lock their doors
    - Grow crops
    answer: Keep important documents safely online
    difficulty: 2
    hints:
    - It is a digital service.
    - Think of certificates and ID cards.
    solution: DigiLocker stores official documents digitally.
    mistakes:
      Lock their doors: c7ss19_comm
      Grow crops: c7ss19_comm
  - prompt: Which action wastes public resources?
    options:
    - Leaving a public tap running
    - Switching off unused lights
    - Reporting a broken pipe
    answer: Leaving a public tap running
    difficulty: 1
    hints:
    - Water costs money to supply.
    - Two options save resources.
    solution: Letting water run wastes a shared resource paid for by everyone.
    mistakes:
      Switching off unused lights: c7ss19_pay
      Reporting a broken pipe: c7ss19_pay
  - prompt: Why is internet in villages important today?
    options:
    - For online classes, payments and services
    - It replaces food
    - It stops rain
    answer: For online classes, payments and services
    difficulty: 2
    hints:
    - Think of UPI and online learning.
    - Government services are online too.
    solution: Internet lets villagers learn, pay, and use government services without travelling.
    mistakes:
      It replaces food: c7ss19_comm
      It stops rain: c7ss19_comm
  - prompt: A dam provides which TWO things?
    options:
    - Water storage and electricity
    - Roads and airports
    - Coins and notes
    answer: Water storage and electricity
    difficulty: 2
    hints:
    - It holds back a river.
    - Falling water turns turbines.
    solution: Dams store water for irrigation and drinking and generate hydroelectricity.
    mistakes:
      Roads and airports: c7ss19_what
      Coins and notes: c7ss19_what
  - prompt: 'India Post delivers letters and also runs:'
    options:
    - Savings accounts and parcel services
    - Airlines
    - Oil wells
    answer: Savings accounts and parcel services
    difficulty: 2
    hints:
    - Post offices are in almost every village.
    - They offer banking too.
    solution: India Post offers savings schemes, a payments bank and parcels as well as letters.
    mistakes:
      Airlines: c7ss19_comm
      Oil wells: c7ss19_comm
  - prompt: A village library gets 4 computers, each costing ₹30,000, from public funds. Total cost in rupees?
    answer: '120000'
    check: 4*30000
    difficulty: 1
    hints:
    - Each costs the same.
    - Multiply.
    solution: 'Step 1: 4 × 30000. Step 2: = ₹1,20,000.'
    mistakes:
      '30004': c7ss19_calc
      '7500': c7ss19_calc
  - prompt: Why must infrastructure be maintained, not just built?
    options:
    - It wears out and becomes unsafe without repairs
    - It grows by itself
    - It never changes
    answer: It wears out and becomes unsafe without repairs
    difficulty: 2
    hints:
    - Think of potholes and old bridges.
    - Use causes wear.
    solution: Roads, bridges and pipes wear out; regular maintenance keeps them safe.
    mistakes:
      It grows by itself: c7ss19_pay
      It never changes: c7ss19_pay
  - prompt: Which payment service needs a working mobile or internet network?
    options:
    - UPI
    - Paying with coins
    - Paying with a paper note
    answer: UPI
    difficulty: 1
    hints:
    - Two options work even with no signal.
    - It runs on a phone app.
    solution: UPI sends money through phone and internet networks, so it depends on communication infrastructure.
    mistakes:
      Paying with coins: c7ss19_comm
      Paying with a paper note: c7ss19_comm
