concepts:
- code: cbse7h.m8.birju
  title: बिरजू महाराज से साक्षात्कार
  notes: |
    विधा: साक्षात्कार (इंटरव्यू), जिसमें विद्यार्थी प्रसिद्ध कथक नर्तक पंडित बिरजू महाराज से प्रश्न पूछते हैं।
    बिरजू महाराज (1938-2022) कथक नृत्य के महान कलाकार थे, लखनऊ घराने से जुड़े। उन्हें बचपन से घर में ही नृत्य और संगीत
    मिला। बातचीत में वे बताते हैं कि कला में निपुणता रोज़ के अभ्यास (रियाज़), धैर्य और लगन से आती है; कठिनाइयों के बीच भी
    उन्होंने नृत्य नहीं छोड़ा; वे बच्चों को अपनी रुचि पहचानने और उसमें मन लगाने की सलाह देते हैं।
    साक्षात्कार की पहचान: प्रश्न-उत्तर के रूप में बातचीत, जिससे किसी व्यक्ति के जीवन और विचार पता चलते हैं।
    (कुछ स्रोत इस अध्याय का अलग विषय बताते हैं; छपी पुस्तक से मिलान बाकी।)
  explanations:
    text: इस पाठ में विद्यार्थी कथक के महान नर्तक बिरजू महाराज से बातचीत करते हैं। वे बताते हैं कि नृत्य उन्हें घर से मिला, और कोई भी कला रोज़ के अभ्यास, धैर्य और लगन से निखरती है।
    visual: 'कल्पना कीजिए: पैरों में घुँघरू, घूमते हुए कथक नर्तक, और सामने कॉपी-पेन लिए विद्यार्थी जो सवाल पूछ रहे हैं।'
    step_by_step: '1. विधा पहचानें: साक्षात्कार (प्रश्न-उत्तर)। 2. व्यक्ति पहचानें: बिरजू महाराज, कथक। 3. उनके जीवन की मुख्य बातें लिखें। 4. उनकी सलाह खोजें: अभ्यास, लगन। 5. सोचें: आप किस कलाकार से कौन-से प्रश्न पूछेंगे?'
    real_world: स्कूल पत्रिका के लिए प्रधानाचार्य या किसी खिलाड़ी से प्रश्न पूछकर लिखना भी साक्षात्कार है।
  picture:
    kind: flow
    steps:
    - प्रश्न तैयार करना
    - व्यक्ति से मिलना
    - प्रश्न पूछना, ध्यान से सुनना
    - उत्तर लिखना
    - साक्षात्कार प्रकाशित करना
    alt: 'साक्षात्कार के चरण: प्रश्न तैयार करना, व्यक्ति से मिलना, पूछना और सुनना, उत्तर लिखना, फिर प्रकाशित करना।'
  items:
  - prompt: बिरजू महाराज किस नृत्य के लिए प्रसिद्ध थे?
    options:
    - कथक
    - भरतनाट्यम
    - कथकली
    - मोहिनीअट्टम
    answer: कथक
    difficulty: 1
    hints:
    - उत्तर भारत का शास्त्रीय नृत्य।
    - घुँघरू और चक्कर।
    solution: बिरजू महाराज कथक नृत्य के महान कलाकार थे।
    mistakes:
      कथकली: hin7_read_again
  - prompt: '''साक्षात्कार'' किस रूप में लिखा जाता है?'
    options:
    - प्रश्न-उत्तर के रूप में
    - कविता के रूप में
    - पत्र के रूप में
    - डायरी के रूप में
    answer: प्रश्न-उत्तर के रूप में
    difficulty: 1
    hints:
    - एक पूछता है, दूसरा बताता है।
    - इंटरव्यू।
    solution: साक्षात्कार प्रश्न-उत्तर के रूप में होता है।
    mistakes: {"कविता के रूप में": "h7_sakshatkar"}
  - prompt: बिरजू महाराज किस घराने से जुड़े थे?
    options:
    - लखनऊ घराना
    - जयपुर घराना
    - ग्वालियर घराना
    - किराना घराना
    answer: लखनऊ घराना
    difficulty: 1
    hints:
    - उत्तर प्रदेश की राजधानी।
    - नवाबों का शहर।
    solution: वे कथक के लखनऊ घराने से जुड़े थे।
    mistakes: {"जयपुर घराना": "h7_lucknow"}
  - prompt: बिरजू महाराज के अनुसार कला में निपुणता कैसे आती है?
    options:
    - रोज़ के अभ्यास, धैर्य और लगन से
    - केवल भाग्य से
    - महँगे कपड़ों से
    - एक दिन की मेहनत से
    answer: रोज़ के अभ्यास, धैर्य और लगन से
    difficulty: 1
    hints:
    - रियाज़।
    - रोज़-रोज़।
    solution: वे रोज़ के रियाज़, धैर्य और लगन को सफलता की कुंजी बताते हैं।
    mistakes:
      केवल भाग्य से: hin7_whole
  - prompt: विद्यार्थियों ने बिरजू महाराज का साक्षात्कार क्यों लिया होगा?
    options:
    - उनके जीवन, कला और अनुभव से सीखने के लिए
    - उनसे पैसे माँगने के लिए
    - उन्हें परीक्षा देने के लिए
    - उनकी शिकायत करने के लिए
    answer: उनके जीवन, कला और अनुभव से सीखने के लिए
    difficulty: 2
    hints:
    - साक्षात्कार का उद्देश्य।
    - महान व्यक्ति से सीख।
    solution: साक्षात्कार से किसी महान व्यक्ति के जीवन और अनुभव से सीखने को मिलता है।
    mistakes: {"उनसे पैसे माँगने के लिए": "h7_kyon_sakshatkar"}
  - prompt: अच्छा साक्षात्कार लेने के लिए सबसे ज़रूरी क्या है?
    options:
    - पहले से अच्छे प्रश्न तैयार करना और ध्यान से सुनना
    - बहुत ज़ोर से बोलना
    - बीच में बार-बार टोकना
    - केवल अपनी बात कहना
    answer: पहले से अच्छे प्रश्न तैयार करना और ध्यान से सुनना
    difficulty: 2
    hints:
    - तैयारी + सुनना।
    - दूसरे को बोलने दें।
    solution: अच्छे प्रश्न तैयार करना और ध्यान से सुनना साक्षात्कार की कुंजी है।
    mistakes: {"बीच में बार-बार टोकना": "h7_achha_sakshatkar"}
