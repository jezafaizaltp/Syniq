    - आलस
    - डर
    answer: किसी काम में पूरा मन लगाना
    difficulty: 1
    hints:
    - बिरजू महाराज इसे ज़रूरी मानते थे।
    - मन लगना से जुड़ा शब्द।
    solution: लगन का अर्थ है किसी काम में गहरी रुचि और मन लगाना।
    mistakes:
      आलस: c7h8_shabd
      डर: c7h8_shabd
  - prompt: बिरजू महाराज कठिनाइयों में भी नृत्य क्यों नहीं छोड़ पाए?
