subject: cbse7-hin
chapter: 8
title: बिरजू महाराज से साक्षात्कार
tips:
  h7_achha_sakshatkar: "साक्षात्कार में सामने वाले की बात सबसे ज़रूरी है।"
  h7_kyon_sakshatkar: "विद्यार्थी किसी बड़े कलाकार से मिलें तो उनसे क्या पाना चाहेंगे?"
  h7_lucknow: "बिरजू महाराज का परिवार नवाबों के शहर में कथक करता था।"
