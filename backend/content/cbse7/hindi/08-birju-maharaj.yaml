  - prompt: बिरजू महाराज किस घराने से जुड़े थे?
    options:
    - लखनऊ घराना
    - जयपुर घराना
    - ग्वालियर घराना
    - किराना घराना
    answer: लखनऊ घराना
    difficulty: 1
    hints:
    - उत्तर प्रदेश की राजधानी।
    - नवाबों का शहर।
    solution: वे कथक के लखनऊ घराने से जुड़े थे।
    mistakes: {"जयपुर घराना": "h7_lucknow"}
  - prompt: बिरजू महाराज के अनुसार कला में निपुणता कैसे आती है?
    options:
    - रोज़ के अभ्यास, धैर्य और लगन से
    - केवल भाग्य से
    - महँगे कपड़ों से
    - एक दिन की मेहनत से
    answer: रोज़ के अभ्यास, धैर्य और लगन से
    difficulty: 1
    hints:
    - रियाज़।
    - रोज़-रोज़।
    solution: वे रोज़ के रियाज़, धैर्य और लगन को सफलता की कुंजी बताते हैं।
    mistakes:
      केवल भाग्य से: hin7_whole
  - prompt: विद्यार्थियों ने बिरजू महाराज का साक्षात्कार क्यों लिया होगा?
    options:
    - उनके जीवन, कला और अनुभव से सीखने के लिए
    - उनसे पैसे माँगने के लिए
    - उन्हें परीक्षा देने के लिए
    - उनकी शिकायत करने के लिए
    answer: उनके जीवन, कला और अनुभव से सीखने के लिए
    difficulty: 2
    hints:
    - साक्षात्कार का उद्देश्य।
    - महान व्यक्ति से सीख।
    solution: साक्षात्कार से किसी महान व्यक्ति के जीवन और अनुभव से सीखने को मिलता है।
    mistakes: {"उनसे पैसे माँगने के लिए": "h7_kyon_sakshatkar"}
  - prompt: अच्छा साक्षात्कार लेने के लिए सबसे ज़रूरी क्या है?
    options:
    - पहले से अच्छे प्रश्न तैयार करना और ध्यान से सुनना
    - बहुत ज़ोर से बोलना
    - बीच में बार-बार टोकना
    - केवल अपनी बात कहना
    answer: पहले से अच्छे प्रश्न तैयार करना और ध्यान से सुनना
    difficulty: 2
    hints:
    - तैयारी + सुनना।
    - दूसरे को बोलने दें।
    solution: अच्छे प्रश्न तैयार करना और ध्यान से सुनना साक्षात्कार की कुंजी है।
    mistakes: {"बीच में बार-बार टोकना": "h7_achha_sakshatkar"}
  - prompt: कथक किस प्रकार की कला है?
    options:
    - शास्त्रीय नृत्य
    - चित्रकला
    - मूर्तिकला
    answer: शास्त्रीय नृत्य
    difficulty: 1
    hints:
    - बिरजू महाराज इसके कलाकार थे।
    - इसमें पैरों की थाप और घुँघरू होते हैं।
    solution: कथक भारत का एक शास्त्रीय नृत्य है।
    mistakes:
      चित्रकला: c7h8_jeevan
      मूर्तिकला: c7h8_jeevan
  - prompt: बिरजू महाराज का जन्म 1938 में और निधन 2022 में हुआ। वे लगभग कितने वर्ष जीवित रहे?
    answer: '84'
    check: 2022-1938
    difficulty: 2
    hints:
    - बाद वाले वर्ष में से पहले वाला घटाओ।
    - 2022 − 1938।
    solution: 'चरण 1: 2022 − 1938। चरण 2: = 84 वर्ष।'
    mistakes:
      '3960': c7h8_ganit
      '94': c7h8_ganit
  - prompt: साक्षात्कार लेने से पहले सबसे ज़रूरी तैयारी क्या है?
    options:
    - व्यक्ति के बारे में जानकर प्रश्न सोच लेना
    - कुछ भी न पढ़ना
    - केवल फ़ोटो खींचना
    answer: व्यक्ति के बारे में जानकर प्रश्न सोच लेना
    difficulty: 2
    hints:
    - बिना तैयारी के अच्छे प्रश्न नहीं बनते।
    - पहले से सोचो, फिर पूछो।
    solution: पहले उस व्यक्ति के बारे में जानकर प्रश्न तैयार करने चाहिए।
    mistakes:
      कुछ भी न पढ़ना: c7h8_prashn
      केवल फ़ोटो खींचना: c7h8_prashn
  - prompt: इनमें से कौन-सा प्रश्न साक्षात्कार के लिए सबसे अच्छा है?
    options:
    - आपने नृत्य सीखना कैसे शुरू किया?
    - क्या आप नाचते हैं?
    - आपका नाम क्या है?
    answer: आपने नृत्य सीखना कैसे शुरू किया?
    difficulty: 2
    hints:
    - '''कैसे'' वाले प्रश्न लंबा उत्तर देते हैं।'
    - जो बात सबको पता है, उसे पूछना बेकार है।
    solution: खुले प्रश्न (कैसे, क्यों) से व्यक्ति अपने अनुभव बताता है।
    mistakes:
      क्या आप नाचते हैं?: c7h8_prashn
      आपका नाम क्या है?: c7h8_prashn
  - prompt: '''लगन'' शब्द का अर्थ है:'
