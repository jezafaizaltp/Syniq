subject: cbse7-hin
chapter: 8
title: बिरजू महाराज से साक्षात्कार
tips:
  h7_achha_sakshatkar: "साक्षात्कार में सामने वाले की बात सबसे ज़रूरी है।"
  h7_kyon_sakshatkar: "विद्यार्थी किसी बड़े कलाकार से मिलें तो उनसे क्या पाना चाहेंगे?"
  h7_lucknow: "बिरजू महाराज का परिवार नवाबों के शहर में कथक करता था।"
  h7_sakshatkar: "साक्षात्कार में एक व्यक्ति पूछता है और दूसरा जवाब देता है।"
  c7h8_vidha: 'यह पाठ बातचीत का एक खास रूप है: कोई पूछता है, कोई उत्तर देता है, और हमें किसी के जीवन और विचार पता चलते हैं।'
  c7h8_kala: किसी भी कला में निपुण बनने का रास्ता रोज़ मेहनत, धीरज और मन लगाने से होकर जाता है।
  c7h8_jeevan: 'इस कलाकार के जीवन के बारे में सोचो: उनकी कला, उनका शहर, उनका बचपन और उनकी सलाह।'
  c7h8_prashn: अच्छे प्रश्न खुले होते हैं (क्यों, कैसे), पहले से सोचे जाते हैं, और उत्तर ध्यान से सुना जाता है।
  c7h8_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ को सही बनाए रखे, वही चुनो।
  c7h8_ganit: पहले लिखो कि जोड़ना है या घटाना है, फिर हल करो।

concepts:
- code: cbse7h.m8.birju
  title: बिरजू महाराज से साक्षात्कार
  notes: |
    विधा: साक्षात्कार (इंटरव्यू), जिसमें विद्यार्थी प्रसिद्ध कथक नर्तक पंडित बिरजू महाराज से प्रश्न पूछते हैं।
    बिरजू महाराज (1938-2022) कथक नृत्य के महान कलाकार थे, लखनऊ घराने से जुड़े। उन्हें बचपन से घर में ही नृत्य और संगीत
    मिला। बातचीत में वे बताते हैं कि कला में निपुणता रोज़ के अभ्यास (रियाज़), धैर्य और लगन से आती है; कठिनाइयों के बीच भी
    उन्होंने नृत्य नहीं छोड़ा; वे बच्चों को अपनी रुचि पहचानने और उसमें मन लगाने की सलाह देते हैं।
    साक्षात्कार की पहचान: प्रश्न-उत्तर के रूप में बातचीत, जिससे किसी व्यक्ति के जीवन और विचार पता चलते हैं।
    (कुछ स्रोत इस अध्याय का अलग विषय बताते हैं; छपी पुस्तक से मिलान बाकी।)
  explanations:
    text: इस पाठ में विद्यार्थी कथक के महान नर्तक बिरजू महाराज से बातचीत करते हैं। वे बताते हैं कि नृत्य उन्हें घर से मिला, और कोई भी कला रोज़ के अभ्यास, धैर्य और लगन से निखरती है।
    visual: 'कल्पना कीजिए: पैरों में घुँघरू, घूमते हुए कथक नर्तक, और सामने कॉपी-पेन लिए विद्यार्थी जो सवाल पूछ रहे हैं।'
    step_by_step: '1. विधा पहचानें: साक्षात्कार (प्रश्न-उत्तर)। 2. व्यक्ति पहचानें: बिरजू महाराज, कथक। 3. उनके जीवन की मुख्य बातें लिखें। 4. उनकी सलाह खोजें: अभ्यास, लगन। 5. सोचें: आप किस कलाकार से कौन-से प्रश्न पूछेंगे?'
    real_world: स्कूल पत्रिका के लिए प्रधानाचार्य या किसी खिलाड़ी से प्रश्न पूछकर लिखना भी साक्षात्कार है।
  picture:
    kind: flow
    steps:
    - प्रश्न तैयार करना
    - व्यक्ति से मिलना
    - प्रश्न पूछना, ध्यान से सुनना
    - उत्तर लिखना
    - साक्षात्कार प्रकाशित करना
    alt: 'साक्षात्कार के चरण: प्रश्न तैयार करना, व्यक्ति से मिलना, पूछना और सुनना, उत्तर लिखना, फिर प्रकाशित करना।'
  activity:
    type: sort
    prompt: यह साक्षात्कार की पहचान है, या बिरजू महाराज की सीख?
    bins:
    - साक्षात्कार की पहचान
    - बिरजू महाराज की सीख
    items:
    - label: प्रश्न-उत्तर के रूप में बातचीत
      bin: साक्षात्कार की पहचान
      clue: यह पाठ के ढाँचे की बात है या विचार की?
      why: साक्षात्कार प्रश्न-उत्तर से बनता है।
    - label: व्यक्ति का जीवन और विचार पता चलते हैं
      bin: साक्षात्कार की पहचान
      clue: साक्षात्कार क्यों लिया जाता है?
      why: यही साक्षात्कार का उद्देश्य है।
    - label: रोज़ का रियाज़
      bin: बिरजू महाराज की सीख
      clue: कला में निपुणता कैसे आती है?
      why: बिरजू महाराज की सलाह।
    - label: कठिनाइयों में भी कला न छोड़ना
      bin: बिरजू महाराज की सीख
      clue: यह अनुभव किसका है?
      why: बिरजू महाराज की सीख।
    - label: अपनी रुचि पहचानकर मन लगाना
      bin: बिरजू महाराज की सीख
      clue: वे बच्चों को क्या सलाह देते हैं?
      why: बच्चों को उनकी सलाह।
  lesson:
    - teach: 'यह पाठ एक साक्षात्कार (इंटरव्यू) है। साक्षात्कार प्रश्न-उत्तर के रूप में होता है: पूछने वाला प्रश्न करता है और जिससे पूछा जाता है वह उत्तर देता है। इससे हमें किसी व्यक्ति के जीवन, काम और विचारों का पता चलता है।'
      check:
        prompt: साक्षात्कार किस रूप में होता है?
        options:
        - प्रश्न-उत्तर के रूप में
        - कविता के रूप में
        - पत्र के रूप में
        answer: प्रश्न-उत्तर के रूप में
        why: एक पूछता है, दूसरा उत्तर देता है।
    - teach: पंडित बिरजू महाराज (1938-2022) कथक नृत्य के महान कलाकार थे और लखनऊ घराने से जुड़े थे। बचपन से ही उन्हें घर में नृत्य और संगीत का माहौल मिला।
      check:
        prompt: बिरजू महाराज को बचपन में नृत्य कहाँ से मिला?
        options:
        - अपने घर के माहौल से
        - टीवी से
        - किसी विदेशी स्कूल से
        answer: अपने घर के माहौल से
        why: उनका परिवार ही नृत्य-संगीत से जुड़ा था।
    - teach: बातचीत में वे बताते हैं कि कला में निपुणता रोज़ के अभ्यास (रियाज़), धैर्य और लगन से आती है। कठिनाइयों में भी उन्होंने नृत्य नहीं छोड़ा। वे बच्चों को सलाह देते हैं कि अपनी रुचि पहचानें और उसमें मन लगाएँ।
      picture:
        kind: flow
        steps:
        - अपनी रुचि पहचानो
        - रोज़ रियाज़ करो
        - धैर्य रखो
        - कठिनाई में भी न छोड़ो
        - निपुणता आती है
        alt: बिरजू महाराज के अनुसार कला सीखने का रास्ता।
      check:
        prompt: '''रियाज़'' का अर्थ है:'
        options:
        - नियमित अभ्यास
        - आराम
        - छुट्टी
        answer: नियमित अभ्यास
        why: कलाकार रोज़ अभ्यास को रियाज़ कहते हैं।
  items:
  - prompt: बिरजू महाराज किस नृत्य के लिए प्रसिद्ध थे?
    options:
    - कथक
    - भरतनाट्यम
    - कथकली
    - मोहिनीअट्टम
    answer: कथक
    difficulty: 1
    hints:
    - उत्तर भारत का शास्त्रीय नृत्य।
    - घुँघरू और चक्कर।
    solution: बिरजू महाराज कथक नृत्य के महान कलाकार थे।
    mistakes:
      कथकली: hin7_read_again
  - prompt: '''साक्षात्कार'' किस रूप में लिखा जाता है?'
    options:
    - प्रश्न-उत्तर के रूप में
    - कविता के रूप में
    - पत्र के रूप में
    - डायरी के रूप में
    answer: प्रश्न-उत्तर के रूप में
    difficulty: 1
    hints:
