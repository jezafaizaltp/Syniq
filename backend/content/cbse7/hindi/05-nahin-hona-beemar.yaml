title: नहीं होना बीमार (कहानी)
concepts:
- code: cbse7h.m5.beemar
  title: नहीं होना बीमार (कहानी)
  notes: |
    लेखक: स्वयं प्रकाश। एक बालक स्कूल से छुट्टी पाने और बीमार बच्चे जैसा लाड़-प्यार पाने के लिए बीमार होना चाहता है। वह
    सोचता है कि बीमार होने पर स्कूल नहीं जाना पड़ेगा, सब प्यार करेंगे और अच्छी चीज़ें खाने को मिलेंगी। पर जब वह बीमार होता
    है (या बीमारी का बहाना करता है), तो उसे कड़वी दवा, सादा खाना, बिस्तर पर लेटे रहना, खेल और दोस्तों से दूरी मिलती है।
    दिन लंबे और उबाऊ लगते हैं। अंत में वह तय करता है: "नहीं होना बीमार।"
    संदेश: स्वास्थ्य सबसे बड़ा सुख है; बहाने से जो मज़ा सोचा था, असल में वह नहीं मिलता।
  explanations:
    text: इस कहानी में एक बच्चा सोचता है कि बीमार होने पर स्कूल से छुट्टी और बहुत सारा लाड़ मिलेगा। पर बीमार होने पर उसे कड़वी दवा, सादा खाना और अकेलापन मिलता है। वह समझ जाता है कि स्वस्थ रहना ही अच्छा है।
    visual: 'कल्पना कीजिए दो चित्र: पहला, बच्चे का सपना (मिठाई, खिलौने, छुट्टी); दूसरा, असलियत (कड़वी दवा का चम्मच, खिचड़ी, खिड़की से खेलते दोस्तों को देखता बच्चा)।'
    step_by_step: '1. लेखक और पात्र पहचानें। 2. बच्चे की इच्छा समझें: क्यों बीमार होना चाहता था। 3. बीमारी में क्या मिला, यह देखें। 4. सोच में बदलाव देखें। 5. संदेश लिखें: स्वास्थ्य का महत्व।'
    real_world: परीक्षा या होमवर्क से बचने के लिए पेट-दर्द का बहाना कई बच्चे करते हैं। यह कहानी याद दिलाती है कि बहाने का अंत अक्सर मज़ेदार नहीं होता।
  picture:
    kind: compare
    columns:
    - title: बच्चे ने क्या सोचा
      points:
      - स्कूल से छुट्टी
      - सबका लाड़-प्यार
      - अच्छी चीज़ें खाने को
    - title: असल में क्या मिला
      points:
      - कड़वी दवा
      - सादा खाना और बिस्तर
      - खेल और दोस्तों से दूरी
    alt: बच्चे ने छुट्टी, लाड़ और अच्छे खाने की सोची थी; असल में कड़वी दवा, सादा खाना और दोस्तों से दूरी मिली।
  items:
  - prompt: '''नहीं होना बीमार'' कहानी के लेखक कौन हैं?'
    options:
    - स्वयं प्रकाश
    - अनुपम मिश्र
    - मैथिलीशरण गुप्त
    - आरसी प्रसाद सिंह
    answer: स्वयं प्रकाश
    difficulty: 1
    hints:
    - आधुनिक कहानीकार।
    - नाम में 'प्रकाश'।
    solution: कहानी स्वयं प्रकाश की है।
    mistakes:
      अनुपम मिश्र: hin7_read_again
  - prompt: बच्चा बीमार क्यों होना चाहता था?
    options:
    - स्कूल से छुट्टी और लाड़-प्यार पाने के लिए
    - डॉक्टर बनने के लिए
    - दवा का स्वाद चखने के लिए
    - अस्पताल देखने के लिए
    answer: स्कूल से छुट्टी और लाड़-प्यार पाने के लिए
    difficulty: 1
    hints:
    - उसे बीमारी में मज़ा दिखता था।
    - स्कूल।
    solution: वह छुट्टी और सबका लाड़ पाना चाहता था।
  - prompt: बीमार होने पर बच्चे को क्या मिला?
    options:
    - कड़वी दवा और सादा खाना
    - ढेर सारे खिलौने
    - पिकनिक
    - नई साइकिल
    answer: कड़वी दवा और सादा खाना
    difficulty: 1
    hints:
    - उसकी सोच के उलट।
    - बीमार का भोजन।
    solution: उसे कड़वी दवा, सादा खाना और आराम का आदेश मिला।
    mistakes:
      ढेर सारे खिलौने: hin7_read_again
  - prompt: कहानी के अंत में बच्चा क्या तय करता है?
    options:
    - कि वह बीमार नहीं होना चाहता
    - कि वह रोज़ बीमार होगा
    - कि वह स्कूल छोड़ देगा
    - कि वह दवा नहीं खाएगा
    answer: कि वह बीमार नहीं होना चाहता
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - '''नहीं होना…'''
    solution: 'अंत में वह तय करता है: नहीं होना बीमार।'
  - prompt: बीमारी के दिन बच्चे को उबाऊ क्यों लगे?
    options:
    - क्योंकि वह बिस्तर पर था और खेल और दोस्तों से दूर था
    - क्योंकि उसे बहुत होमवर्क मिला
    - क्योंकि घर में मेहमान आए थे
    - क्योंकि टीवी खराब था
    answer: क्योंकि वह बिस्तर पर था और खेल और दोस्तों से दूर था
    difficulty: 2
    hints:
    - बाहर दोस्त खेल रहे थे।
    - अकेलापन।
    solution: बिस्तर पर पड़े रहना और दोस्तों से दूर रहना उसे उबाऊ लगा।
  - prompt: इस कहानी की मुख्य सीख क्या है?
    options:
    - स्वस्थ रहना सबसे बड़ा सुख है; बहाने का मज़ा असली नहीं होता
    - बीमार होना मज़ेदार है
    - स्कूल जाना बेकार है
    - दवाइयाँ मीठी होती हैं
    answer: स्वस्थ रहना सबसे बड़ा सुख है; बहाने का मज़ा असली नहीं होता
    difficulty: 2
    hints:
    - शुरुआत की सोच और अंत की सोच की तुलना करें।
    - बदलाव।
    solution: 'बच्चे की सोच बदलती है: स्वास्थ्य ही असली सुख है।'
    mistakes:
      बीमार होना मज़ेदार है: hin7_whole
