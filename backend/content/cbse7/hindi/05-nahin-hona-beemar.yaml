subject: cbse7-hin
chapter: 5
title: नहीं होना बीमार (कहानी)
tips:
  h7_beemar_ant: "कहानी का शीर्षक बच्चे का फ़ैसला बताता है।"
  h7_beemar_kyon: "बच्चा देखता था कि बीमार होने पर सब उसका ख़याल रखते हैं और स्कूल नहीं जाना पड़ता।"
  h7_ubau: "बीमारी में बिस्तर पर पड़े रहना पड़ता है। उसे किसकी याद आती थी?"
  c7h5_soch: बच्चे ने पहले जो सोचा था और बाद में जो सच में मिला, दोनों को अलग-अलग याद करो।
  c7h5_anubhav: 'बीमारी के दिनों में बच्चे का खाना, दवा, खेल और दोस्त: इनमें से हर चीज़ कैसी रही, सोचो।'
  c7h5_seekh: कहानी के अंत में बच्चा अपना मन बदल लेता है। सोचो, उसे किस बात का एहसास हुआ।
  c7h5_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ को सही बनाए रखे, वही चुनो।
  c7h5_vyakaran: देखो कि वाक्य किस काल में है, और शब्द संज्ञा, क्रिया या विशेषण में से क्या है।
  c7h5_ganit: पहले लिखो कि जोड़ना है, घटाना है या गुणा करना है, फिर हल करो।

concepts:
- code: cbse7h.m5.beemar
  title: नहीं होना बीमार (कहानी)
  notes: |
    लेखक: स्वयं प्रकाश। एक बालक स्कूल से छुट्टी पाने और बीमार बच्चे जैसा लाड़-प्यार पाने के लिए बीमार होना चाहता है। वह
    सोचता है कि बीमार होने पर स्कूल नहीं जाना पड़ेगा, सब प्यार करेंगे और अच्छी चीज़ें खाने को मिलेंगी। पर जब वह बीमार होता
    है (या बीमारी का बहाना करता है), तो उसे कड़वी दवा, सादा खाना, बिस्तर पर लेटे रहना, खेल और दोस्तों से दूरी मिलती है।
    दिन लंबे और उबाऊ लगते हैं। अंत में वह तय करता है: "नहीं होना बीमार।"
    संदेश: स्वास्थ्य सबसे बड़ा सुख है; बहाने से जो मज़ा सोचा था, असल में वह नहीं मिलता।
  explanations:
    text: इस कहानी में एक बच्चा सोचता है कि बीमार होने पर स्कूल से छुट्टी और बहुत सारा लाड़ मिलेगा। पर बीमार होने पर उसे कड़वी दवा, सादा खाना और अकेलापन मिलता है। वह समझ जाता है कि स्वस्थ रहना ही अच्छा है।
    visual: 'कल्पना कीजिए दो चित्र: पहला, बच्चे का सपना (मिठाई, खिलौने, छुट्टी); दूसरा, असलियत (कड़वी दवा का चम्मच, खिचड़ी, खिड़की से खेलते दोस्तों को देखता बच्चा)।'
    step_by_step: '1. लेखक और पात्र पहचानें। 2. बच्चे की इच्छा समझें: क्यों बीमार होना चाहता था। 3. बीमारी में क्या मिला, यह देखें। 4. सोच में बदलाव देखें। 5. संदेश लिखें: स्वास्थ्य का महत्व।'
    real_world: परीक्षा या होमवर्क से बचने के लिए पेट-दर्द का बहाना कई बच्चे करते हैं। यह कहानी याद दिलाती है कि बहाने का अंत अक्सर मज़ेदार नहीं होता।
  picture:
    kind: compare
    columns:
    - title: बच्चे ने क्या सोचा
      points:
      - स्कूल से छुट्टी
      - सबका लाड़-प्यार
      - अच्छी चीज़ें खाने को
    - title: असल में क्या मिला
      points:
      - कड़वी दवा
      - सादा खाना और बिस्तर
      - खेल और दोस्तों से दूरी
    alt: बच्चे ने छुट्टी, लाड़ और अच्छे खाने की सोची थी; असल में कड़वी दवा, सादा खाना और दोस्तों से दूरी मिली।
  activity:
    type: sort
    prompt: बालक ने बीमार होने से क्या सोचा था, और असल में क्या मिला?
    bins:
    - बालक ने सोचा था
    - असल में मिला
    items:
    - label: स्कूल से छुट्टी
      bin: बालक ने सोचा था
      clue: बीमार होने की इच्छा क्यों थी?
      why: छुट्टी का लालच।
    - label: सबका लाड़-प्यार
      bin: बालक ने सोचा था
      clue: वह क्या पाने की उम्मीद में था?
      why: बीमार बच्चे जैसा प्यार पाने की इच्छा।
    - label: अच्छी चीज़ें खाने को
      bin: बालक ने सोचा था
      clue: क्या उसे सचमुच मज़ेदार खाना मिला?
      why: यह केवल उसकी कल्पना थी।
    - label: कड़वी दवा, सादा खाना
      bin: असल में मिला
      clue: बीमारी में सचमुच क्या खाना पड़ता है?
      why: 'असलियत: दवा और परहेज़।'
    - label: खेल और दोस्तों से दूरी
      bin: असल में मिला
      clue: बिस्तर पर लेटे दिन कैसे लगे?
      why: दिन लंबे और उबाऊ।
  lesson:
    - teach: '''नहीं होना बीमार'' स्वयं प्रकाश की कहानी है। एक बालक बीमार होना चाहता है। वह सोचता है कि बीमार होने पर स्कूल नहीं जाना पड़ेगा, सब लाड़-प्यार करेंगे और अच्छी चीज़ें खाने को मिलेंगी।'
      check:
        prompt: बच्चा बीमार होने में क्या फ़ायदा सोचता था?
        options:
        - स्कूल से छुट्टी और लाड़-प्यार
        - ज़्यादा पढ़ाई
        - कड़वी दवा
        answer: स्कूल से छुट्टी और लाड़-प्यार
        why: उसे लगा कि बीमारी मज़ेदार होगी।
    - teach: पर जब वह बीमार हुआ, तो उसे कड़वी दवा, सादा खाना और दिन भर बिस्तर पर लेटे रहना मिला। खेल और दोस्त दूर हो गए। दिन लंबे और उबाऊ लगने लगे।
      picture:
        kind: compare
        columns:
        - title: जो सोचा था
          points:
          - स्कूल से छुट्टी
          - सबका लाड़
          - अच्छा खाना
        - title: जो मिला
          points:
          - कड़वी दवा
          - सादा खाना
          - बिस्तर, दोस्तों से दूरी
        alt: बच्चे की सोच और असलियत की तुलना।
      check:
        prompt: बीमारी के दिन बच्चे को कैसे लगे?
        options:
        - लंबे और उबाऊ
        - छोटे और मज़ेदार
        - बहुत रोमांचक
        answer: लंबे और उबाऊ
        why: वह खेल और दोस्तों से दूर था।
    - teach: 'अंत में वह तय करता है: ''नहीं होना बीमार।'' कहानी की सीख: स्वास्थ्य सबसे बड़ा सुख है; बहाने से जिस मज़े की कल्पना की थी, वह असल में नहीं मिलता।'
      check:
        prompt: कहानी की मुख्य सीख क्या है?
        options:
        - स्वस्थ रहना सबसे बड़ा सुख है
        - बीमार होना अच्छा है
        - स्कूल न जाना चाहिए
        answer: स्वस्थ रहना सबसे बड़ा सुख है
        why: बच्चे ने खुद अनुभव से यह सीखा।
  items:
  - prompt: '''नहीं होना बीमार'' कहानी के लेखक कौन हैं?'
    options:
    - स्वयं प्रकाश
    - अनुपम मिश्र
    - मैथिलीशरण गुप्त
    - आरसी प्रसाद सिंह
    answer: स्वयं प्रकाश
    difficulty: 1
    hints:
    - आधुनिक कहानीकार।
    - नाम में 'प्रकाश'।
    solution: कहानी स्वयं प्रकाश की है।
    mistakes:
      अनुपम मिश्र: hin7_read_again
  - prompt: बच्चा बीमार क्यों होना चाहता था?
    options:
    - स्कूल से छुट्टी और लाड़-प्यार पाने के लिए
    - डॉक्टर बनने के लिए
    - दवा का स्वाद चखने के लिए
    - अस्पताल देखने के लिए
    answer: स्कूल से छुट्टी और लाड़-प्यार पाने के लिए
    difficulty: 1
    hints:
    - उसे बीमारी में मज़ा दिखता था।
    - स्कूल।
    solution: वह छुट्टी और सबका लाड़ पाना चाहता था।
    mistakes: {"डॉक्टर बनने के लिए": "h7_beemar_kyon"}
  - prompt: बीमार होने पर बच्चे को क्या मिला?
    options:
    - कड़वी दवा और सादा खाना
    - ढेर सारे खिलौने
    - पिकनिक
    - नई साइकिल
    answer: कड़वी दवा और सादा खाना
    difficulty: 1
    hints:
    - उसकी सोच के उलट।
    - बीमार का भोजन।
    solution: उसे कड़वी दवा, सादा खाना और आराम का आदेश मिला।
    mistakes:
      ढेर सारे खिलौने: hin7_read_again
  - prompt: कहानी के अंत में बच्चा क्या तय करता है?
    options:
    - कि वह बीमार नहीं होना चाहता
    - कि वह रोज़ बीमार होगा
    - कि वह स्कूल छोड़ देगा
    - कि वह दवा नहीं खाएगा
    answer: कि वह बीमार नहीं होना चाहता
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - '''नहीं होना…'''
    solution: 'अंत में वह तय करता है: नहीं होना बीमार।'
    mistakes: {"कि वह रोज़ बीमार होगा": "h7_beemar_ant"}
  - prompt: बीमारी के दिन बच्चे को उबाऊ क्यों लगे?
    options:
    - क्योंकि वह बिस्तर पर था और खेल और दोस्तों से दूर था
    - क्योंकि उसे बहुत होमवर्क मिला
    - क्योंकि घर में मेहमान आए थे
    - क्योंकि टीवी खराब था
    answer: क्योंकि वह बिस्तर पर था और खेल और दोस्तों से दूर था
    difficulty: 2
    hints:
    - बाहर दोस्त खेल रहे थे।
    - अकेलापन।
    solution: बिस्तर पर पड़े रहना और दोस्तों से दूर रहना उसे उबाऊ लगा।
    mistakes: {"क्योंकि उसे बहुत होमवर्क मिला": "h7_ubau"}
  - prompt: इस कहानी की मुख्य सीख क्या है?
    options:
    - स्वस्थ रहना सबसे बड़ा सुख है; बहाने का मज़ा असली नहीं होता
    - बीमार होना मज़ेदार है
    - स्कूल जाना बेकार है
    - दवाइयाँ मीठी होती हैं
    answer: स्वस्थ रहना सबसे बड़ा सुख है; बहाने का मज़ा असली नहीं होता
    difficulty: 2
    hints:
    - शुरुआत की सोच और अंत की सोच की तुलना करें।
    - बदलाव।
    solution: 'बच्चे की सोच बदलती है: स्वास्थ्य ही असली सुख है।'
    mistakes:
      बीमार होना मज़ेदार है: hin7_whole
  - prompt: बीमार बच्चे को किस तरह का खाना मिला?
    options:
    - सादा खाना
    - मिठाइयाँ
    - चाट-पकौड़े
    answer: सादा खाना
    difficulty: 1
    hints:
    - बीमारी में डॉक्टर हल्का भोजन बताते हैं।
    - उसे जो चाहिए था, वह नहीं मिला।
    solution: बीमारी में उसे सादा, हल्का खाना मिला।
    mistakes:
      मिठाइयाँ: c7h5_anubhav
      चाट-पकौड़े: c7h5_anubhav
  - prompt: '''उबाऊ'' शब्द का अर्थ है:'
    options:
    - जिसमें मन न लगे
    - बहुत मज़ेदार
    - बहुत डरावना
    answer: जिसमें मन न लगे
    difficulty: 1
    hints:
    - बीमारी के दिन ऐसे लगे।
    - करने को कुछ न हो तो कैसा लगता है?
    solution: उबाऊ का अर्थ है नीरस, जिसमें मन न लगे।
    mistakes:
      बहुत मज़ेदार: c7h5_shabd
      बहुत डरावना: c7h5_shabd
  - prompt: बच्चे की सबसे बड़ी गलतफ़हमी क्या थी?
    options:
    - कि बीमारी मज़ेदार होगी
    - कि दवा मीठी होती है
    - कि स्कूल बंद है
    answer: कि बीमारी मज़ेदार होगी
    difficulty: 2
    hints:
    - उसने पहले क्या सोचा था?
    - असलियत उल्टी निकली।
    solution: उसे लगा था कि बीमारी में मज़ा आएगा, पर ऐसा नहीं हुआ।
    mistakes:
      कि दवा मीठी होती है: c7h5_soch
      कि स्कूल बंद है: c7h5_soch
  - prompt: बीमारी में बच्चे को सबसे ज़्यादा किसकी कमी खली होगी?
    options:
    - दोस्तों और खेल की
    - दवा की
    - बिस्तर की
    answer: दोस्तों और खेल की
    difficulty: 2
    hints:
    - वह दिन भर लेटा रहा।
    - बच्चों को सबसे प्यारा क्या होता है?
    solution: बिस्तर पर रहने से वह दोस्तों और खेल से दूर हो गया।
    mistakes:
      दवा की: c7h5_anubhav
      बिस्तर की: c7h5_anubhav
  - prompt: स्वस्थ रहने के लिए क्या करना चाहिए?
    options:
    - अच्छा खाना, खेल-कूद और पूरी नींद
    - रात भर जागना
    - केवल मिठाई खाना
    answer: अच्छा खाना, खेल-कूद और पूरी नींद
    difficulty: 1
    hints:
    - कहानी स्वास्थ्य को सबसे बड़ा सुख बताती है।
    - शरीर को क्या चाहिए?
    solution: संतुलित भोजन, व्यायाम और नींद से हम स्वस्थ रहते हैं।
    mistakes:
      रात भर जागना: c7h5_seekh
      केवल मिठाई खाना: c7h5_seekh
  - prompt: '''बहाना'' शब्द का सही अर्थ क्या है?'
    options:
    - झूठा कारण
    - सच्ची बात
    - दवा
    answer: झूठा कारण
    difficulty: 1
    hints:
    - काम से बचने के लिए बनाया गया।
    - जो सच न हो।
