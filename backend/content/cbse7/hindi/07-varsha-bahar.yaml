      - भरे नदी-तालाब
      - नाचते मोर, खुश किसान
    alt: आकाश में घने बादल, बिजली और गर्जन; धरती पर हरियाली, भरे नदी-तालाब, नाचते मोर और खुश किसान।
  activity:
    type: sort
    prompt: वर्षा-बहार में यह आकाश का दृश्य है या धरती का?
    bins:
