        answer: काले-घने बादल
        why: बादल घिरने के बाद ही वर्षा होती है।
    - teach: वर्षा से धरती हरी-भरी हो जाती है, नदी-तालाब भर जाते हैं। मोर नाचते हैं, मेंढक बोलते हैं, और किसान खुश होते हैं क्योंकि खेतों को पानी मिलता है।
      picture:
        kind: compare
