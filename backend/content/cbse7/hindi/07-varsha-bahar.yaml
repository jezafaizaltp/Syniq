subject: cbse7-hin
chapter: 7
title: वर्षा-बहार (कविता)
concepts:
- code: cbse7h.m7.varsha
  title: वर्षा-बहार (कविता)
  notes: |
    कवि: मुकुटधर पांडेय (छायावाद के आरंभिक कवि)। कविता वर्षा ऋतु की सुंदरता का चित्र खींचती है: आकाश में काले-घने बादल
    घिरते हैं, बिजली चमकती है, बादल गरजते हैं, रिमझिम वर्षा होती है। धरती हरी-भरी हो जाती है, नदी-तालाब भर जाते हैं,
    मोर नाचते हैं, मेंढक बोलते हैं, किसान खुश होते हैं। पूरी प्रकृति में नया जीवन और उत्साह आ जाता है।
    संदेश: प्रकृति का सौंदर्य देखें और उसका आनंद लें; वर्षा धरती और जीवन के लिए वरदान है।
  explanations:
    text: 'इस कविता में कवि वर्षा ऋतु का सुंदर चित्र बनाते हैं: घने बादल, चमकती बिजली, रिमझिम बारिश, नाचते मोर और हरी-भरी धरती। वर्षा आते ही पूरी प्रकृति में जैसे नई जान आ जाती है।'
    visual: 'आँखें बंद करके सोचिए: काले बादल, बिजली की चमक, मिट्टी की सोंधी खुशबू, पेड़ों से टपकती बूँदें और पंख फैलाकर नाचता मोर।'
    step_by_step: '1. कवि और ऋतु पहचानें। 2. आकाश के चित्र खोजें: बादल, बिजली, गर्जन। 3. धरती के चित्र खोजें: हरियाली, नदी-तालाब। 4. जीवों के चित्र खोजें: मोर, मेंढक, किसान। 5. कवि का भाव लिखें: आनंद और नया जीवन।'
    real_world: 'केरल में जून में मानसून आता है: स्कूल खुलते हैं, धान के खेत भरते हैं और सब कुछ हरा हो जाता है। यह वही ''वर्षा-बहार'' है।'
  picture:
    kind: compare
    columns:
    - title: आकाश में
      points:
      - काले घने बादल
      - बिजली की चमक
      - बादलों का गर्जन
    - title: धरती पर
      points:
      - हरियाली
      - भरे नदी-तालाब
      - नाचते मोर, खुश किसान
    alt: आकाश में घने बादल, बिजली और गर्जन; धरती पर हरियाली, भरे नदी-तालाब, नाचते मोर और खुश किसान।
  items:
  - prompt: '''वर्षा-बहार'' कविता के कवि कौन हैं?'
    options:
    - मुकुटधर पांडेय
    - मीराबाई
    - गिरिधर कविराय
    - स्वयं प्रकाश
    answer: मुकुटधर पांडेय
    difficulty: 1
    hints:
    - छायावाद के आरंभिक कवि।
    - नाम में 'मुकुट'।
    solution: कविता मुकुटधर पांडेय की है।
    mistakes:
      मीराबाई: hin7_read_again
  - prompt: कविता किस ऋतु के बारे में है?
    options:
    - वर्षा ऋतु
    - शीत ऋतु
    - ग्रीष्म ऋतु
    - बसंत ऋतु
    answer: वर्षा ऋतु
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - बादल और बारिश।
    solution: कविता वर्षा ऋतु की सुंदरता के बारे में है।
  - prompt: वर्षा में कौन-सा पक्षी नाचता है?
    options:
    - मोर
    - कौआ
    - उल्लू
    - बगुला
    answer: मोर
    difficulty: 1
    hints:
    - हमारा राष्ट्रीय पक्षी।
    - पंख फैलाकर।
    solution: बादल देखकर मोर पंख फैलाकर नाचता है।
  - prompt: वर्षा आने पर धरती कैसी हो जाती है?
    options:
    - हरी-भरी
    - सूखी और फटी
    - बर्फ़ से ढकी
    - रेतीली
    answer: हरी-भरी
    difficulty: 1
    hints:
    - पेड़-पौधों को पानी मिला।
    - हरियाली।
    solution: वर्षा से धरती हरी-भरी हो जाती है।
    mistakes:
      सूखी और फटी: hin7_read_again
  - prompt: वर्षा से किसान क्यों खुश होते हैं?
    options:
    - क्योंकि खेतों को पानी मिलता है और फसल अच्छी होती है
    - क्योंकि स्कूल बंद होते हैं
    - क्योंकि बाज़ार बंद होते हैं
    - क्योंकि धूप तेज़ होती है
    answer: क्योंकि खेतों को पानी मिलता है और फसल अच्छी होती है
    difficulty: 2
    hints:
    - खेती किस पर निर्भर है?
    - सिंचाई।
    solution: वर्षा खेतों को सींचती है, जिससे फसल अच्छी होती है।
  - prompt: कविता में कवि का मुख्य भाव क्या है?
    options:
    - वर्षा से प्रकृति में आए नए जीवन का आनंद
    - बारिश से होने वाली परेशानी
    - शहर का शोर
    - गर्मी की शिकायत
    answer: वर्षा से प्रकृति में आए नए जीवन का आनंद
    difficulty: 2
    hints:
    - सारे चित्र खुशी के हैं।
    - बहार = आनंद, सौंदर्य।
    solution: कवि वर्षा से प्रकृति में आए उत्साह और सौंदर्य का आनंद लेते हैं।
    mistakes:
      बारिश से होने वाली परेशानी: hin7_poem_meaning
