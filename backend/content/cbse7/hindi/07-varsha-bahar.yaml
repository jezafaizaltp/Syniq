      why: धरती पर वर्षा का स्वागत।
  lesson:
    - teach: '''वर्षा-बहार'' मुकुटधर पांडेय की कविता है, जो छायावाद के आरंभिक कवि माने जाते हैं। कविता वर्षा ऋतु की सुंदरता का चित्र खींचती है: आकाश में काले-घने बादल घिरते हैं, बिजली चमकती है, बादल गरजते हैं और रिमझिम वर्षा होती है।'
      check:
        prompt: वर्षा से पहले आकाश में क्या दिखता है?
        options:
