          - भरे नदी-तालाब
          - नाचते मोर, खुश किसान
        alt: वर्षा से पहले और बाद की प्रकृति।
      check:
        prompt: वर्षा में कौन-सा जीव बोलने लगता है?
        options:
        - मेंढक
        - ऊँट
        - शेर
        answer: मेंढक
        why: वर्षा में तालाबों के पास मेंढक टर्राते हैं।
    - teach: 'कवि वर्षा को आनंद से देखते हैं: पूरी प्रकृति में नया जीवन और उत्साह आ जाता है। संदेश: प्रकृति के सौंदर्य को देखें और उसका आनंद लें; वर्षा धरती और जीवन के लिए वरदान है।'
      check:
        prompt: कवि वर्षा को किस रूप में देखते हैं?
        options:
        - धरती के लिए वरदान
        - एक मुसीबत
        - बेकार की चीज़
        answer: धरती के लिए वरदान
        why: वर्षा से सारी प्रकृति में जीवन आता है।
