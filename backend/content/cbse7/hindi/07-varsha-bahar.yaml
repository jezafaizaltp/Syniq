    - label: बिजली चमकती है
      bin: आकाश में
      clue: बिजली कहाँ दिखती है?
      why: आकाश का दृश्य।
    - label: मोर नाचते हैं
      bin: धरती पर
      clue: मोर कहाँ नाचता है?
      why: धरती पर जीवन का उत्साह।
    - label: नदी-तालाब भर जाते हैं
      bin: धरती पर
      clue: वर्षा का पानी कहाँ जमा होता है?
