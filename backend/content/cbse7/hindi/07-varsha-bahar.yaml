subject: cbse7-hin
chapter: 7
title: वर्षा-बहार (कविता)
tips:
  h7_kisan: "किसान की खुशी खेतों से जुड़ी होती है। बारिश खेतों को क्या देती है?"
  h7_mor: "बादल देखकर पंख फैलाकर नाचने वाला भारत का राष्ट्रीय पक्षी।"
  h7_varsha_ritu: "पाठ का शीर्षक ऋतु का नाम बताता है।"
  c7h7_drishya: 'वर्षा के दृश्य को क्रम से सोचो: आकाश में क्या दिखता है, क्या सुनाई देता है, धरती पर क्या बदलता है, और जीव-जंतु क्या करते हैं।'
  c7h7_bhav: कवि वर्षा को कैसे देखते हैं, डर से या आनंद से? कविता के शब्दों का रंग देखो।
  c7h7_jeevan: वर्षा से खेत, नदी-तालाब और जीवों को क्या मिलता है? सोचो, सब खुश क्यों होते हैं।
  c7h7_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ को सही बनाए रखे, वही चुनो।
  c7h7_vyakaran: पुनरुक्त शब्दों में एक जैसी ध्वनि दोहराई जाती है। पर्यायवाची में अर्थ एक होता है। देखो प्रश्न क्या माँग रहा है।
  c7h7_ganit: पहले लिखो कि जोड़ना है, घटाना है या गुणा करना है, फिर हल करो।

concepts:
- code: cbse7h.m7.varsha
  title: वर्षा-बहार (कविता)
  notes: |
    कवि: मुकुटधर पांडेय (छायावाद के आरंभिक कवि)। कविता वर्षा ऋतु की सुंदरता का चित्र खींचती है: आकाश में काले-घने बादल
    घिरते हैं, बिजली चमकती है, बादल गरजते हैं, रिमझिम वर्षा होती है। धरती हरी-भरी हो जाती है, नदी-तालाब भर जाते हैं,
    मोर नाचते हैं, मेंढक बोलते हैं, किसान खुश होते हैं। पूरी प्रकृति में नया जीवन और उत्साह आ जाता है।
    संदेश: प्रकृति का सौंदर्य देखें और उसका आनंद लें; वर्षा धरती और जीवन के लिए वरदान है।
  explanations:
    text: 'इस कविता में कवि वर्षा ऋतु का सुंदर चित्र बनाते हैं: घने बादल, चमकती बिजली, रिमझिम बारिश, नाचते मोर और हरी-भरी धरती। वर्षा आते ही पूरी प्रकृति में जैसे नई जान आ जाती है।'
    visual: 'आँखें बंद करके सोचिए: काले बादल, बिजली की चमक, मिट्टी की सोंधी खुशबू, पेड़ों से टपकती बूँदें और पंख फैलाकर नाचता मोर।'
    step_by_step: '1. कवि और ऋतु पहचानें। 2. आकाश के चित्र खोजें: बादल, बिजली, गर्जन। 3. धरती के चित्र खोजें: हरियाली, नदी-तालाब। 4. जीवों के चित्र खोजें: मोर, मेंढक, किसान। 5. कवि का भाव लिखें: आनंद और नया जीवन।'
    real_world: 'केरल में जून में मानसून आता है: स्कूल खुलते हैं, धान के खेत भरते हैं और सब कुछ हरा हो जाता है। यह वही ''वर्षा-बहार'' है।'
  picture:
    kind: compare
    columns:
    - title: आकाश में
      points:
      - काले घने बादल
      - बिजली की चमक
      - बादलों का गर्जन
    - title: धरती पर
      points:
      - हरियाली
      - भरे नदी-तालाब
      - नाचते मोर, खुश किसान
    alt: आकाश में घने बादल, बिजली और गर्जन; धरती पर हरियाली, भरे नदी-तालाब, नाचते मोर और खुश किसान।
  activity:
    type: sort
    prompt: वर्षा-बहार में यह आकाश का दृश्य है या धरती का?
    bins:
    - आकाश में
    - धरती पर
    items:
    - label: काले-घने बादल
      bin: आकाश में
      clue: बादल कहाँ घिरते हैं?
      why: आकाश का दृश्य।
    - label: बिजली चमकती है
      bin: आकाश में
      clue: बिजली कहाँ दिखती है?
      why: आकाश का दृश्य।
    - label: मोर नाचते हैं
      bin: धरती पर
      clue: मोर कहाँ नाचता है?
      why: धरती पर जीवन का उत्साह।
    - label: नदी-तालाब भर जाते हैं
      bin: धरती पर
      clue: वर्षा का पानी कहाँ जमा होता है?
      why: धरती का दृश्य।
    - label: मेंढक बोलते हैं
      bin: धरती पर
      clue: मेंढक कहाँ रहते हैं?
      why: धरती पर वर्षा का स्वागत।
  lesson:
    - teach: '''वर्षा-बहार'' मुकुटधर पांडेय की कविता है, जो छायावाद के आरंभिक कवि माने जाते हैं। कविता वर्षा ऋतु की सुंदरता का चित्र खींचती है: आकाश में काले-घने बादल घिरते हैं, बिजली चमकती है, बादल गरजते हैं और रिमझिम वर्षा होती है।'
      check:
        prompt: वर्षा से पहले आकाश में क्या दिखता है?
        options:
        - काले-घने बादल
        - तारे
        - इंद्रधनुष
        answer: काले-घने बादल
        why: बादल घिरने के बाद ही वर्षा होती है।
      ways:
      - style: visual
        teach: कविता में वर्षा का दृश्य, जिस क्रम में वह आकाश में बनता है।
        picture:
          kind: flow
          steps:
          - आकाश में काले-घने बादल घिरते हैं
          - बिजली चमकती है
          - बादल गरजते हैं
          - रिमझिम वर्षा होती है
          alt: पहले आकाश में काले-घने बादल घिरते हैं, फिर बिजली चमकती है, बादल गरजते हैं और रिमझिम वर्षा होती है।
      - style: real_world
        teach: उमस भरी दोपहर में अचानक ठंडी हवा चलती है, अँधेरा-सा छा जाता है, मिट्टी की सोंधी खुशबू आती है और पहली बूँदें गिरती हैं। बच्चे आँगन में दौड़ पड़ते हैं। कविता इसी पल को पकड़ती है।
    - teach: वर्षा से धरती हरी-भरी हो जाती है, नदी-तालाब भर जाते हैं। मोर नाचते हैं, मेंढक बोलते हैं, और किसान खुश होते हैं क्योंकि खेतों को पानी मिलता है।
      picture:
        kind: compare
        columns:
        - title: वर्षा से पहले
          points:
          - सूखी धरती
          - खाली तालाब
          - चिंतित किसान
        - title: वर्षा के बाद
          points:
          - हरी-भरी धरती
          - भरे नदी-तालाब
          - नाचते मोर, खुश किसान
        alt: वर्षा से पहले और बाद की प्रकृति।
      check:
        prompt: वर्षा में कौन-सा जीव बोलने लगता है?
        options:
        - मेंढक
        - ऊँट
        - शेर
        answer: मेंढक
        why: वर्षा में तालाबों के पास मेंढक टर्राते हैं।
      ways:
      - style: step_by_step
        teach: 'वर्षा का असर चार जगह देखो। पहला: धरती को देखो, वह हरी-भरी हो जाती है। दूसरा: पानी को देखो, नदी-तालाब भर जाते हैं। तीसरा: जीवों को देखो, मोर नाचते हैं और मेंढक बोलते हैं। चौथा: लोगों को देखो, किसान खुश हैं क्योंकि खेतों को पानी मिला है।'
      - style: real_world
        teach: बरसात शुरू होने के हफ़्ते भर में स्कूल का सूखा मैदान घास से हरा हो जाता है और शाम को गड्ढों के पास मेंढकों की टर्र-टर्र सुनाई देने लगती है। कविता का दृश्य घर के पास ही मिल जाता है।
    - teach: 'कवि वर्षा को आनंद से देखते हैं: पूरी प्रकृति में नया जीवन और उत्साह आ जाता है। संदेश: प्रकृति के सौंदर्य को देखें और उसका आनंद लें; वर्षा धरती और जीवन के लिए वरदान है।'
      check:
        prompt: कवि वर्षा को किस रूप में देखते हैं?
        options:
        - धरती के लिए वरदान
        - एक मुसीबत
        - बेकार की चीज़
        answer: धरती के लिए वरदान
        why: वर्षा से सारी प्रकृति में जीवन आता है।
      ways:
      - style: visual
        teach: कवि वर्षा को किस नज़र से देखते हैं, और हमसे क्या कहते हैं।
        picture:
          kind: compare
          columns:
          - title: कवि की नज़र
            points:
            - वर्षा को आनंद से देखते हैं
            - प्रकृति में नया जीवन और उत्साह पाते हैं
          - title: संदेश
            points:
            - प्रकृति की सुंदरता को देखो और आनंद लो
            - वर्षा धरती और जीवन के लिए वरदान है
          alt: कवि वर्षा को आनंद से देखते हैं और प्रकृति में नया जीवन पाते हैं; संदेश है कि प्रकृति की सुंदरता का आनंद लो, क्योंकि वर्षा धरती और जीवन के लिए वरदान है।
      - style: real_world
        teach: एक ही वर्षा को दो लोग अलग तरह से देखते हैं। एक कहता है, 'हर तरफ़ कीचड़ हो गया।' दूसरा खिड़की खोलकर बूँदों को देखता है और काग़ज़ की नाव बनाता है। कवि दूसरी तरह के व्यक्ति हैं।
  items:
