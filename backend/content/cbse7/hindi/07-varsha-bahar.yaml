subject: cbse7-hin
chapter: 7
title: वर्षा-बहार (कविता)
tips:
  h7_kisan: "किसान की खुशी खेतों से जुड़ी होती है। बारिश खेतों को क्या देती है?"
  h7_mor: "बादल देखकर पंख फैलाकर नाचने वाला भारत का राष्ट्रीय पक्षी।"
  h7_varsha_ritu: "पाठ का शीर्षक ऋतु का नाम बताता है।"
  c7h7_drishya: 'वर्षा के दृश्य को क्रम से सोचो: आकाश में क्या दिखता है, क्या सुनाई देता है, धरती पर क्या बदलता है, और जीव-जंतु क्या करते हैं।'
  c7h7_bhav: कवि वर्षा को कैसे देखते हैं, डर से या आनंद से? कविता के शब्दों का रंग देखो।
  c7h7_jeevan: वर्षा से खेत, नदी-तालाब और जीवों को क्या मिलता है? सोचो, सब खुश क्यों होते हैं।
  c7h7_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ को सही बनाए रखे, वही चुनो।
  c7h7_vyakaran: पुनरुक्त शब्दों में एक जैसी ध्वनि दोहराई जाती है। पर्यायवाची में अर्थ एक होता है। देखो प्रश्न क्या माँग रहा है।
  c7h7_ganit: पहले लिखो कि जोड़ना है, घटाना है या गुणा करना है, फिर हल करो।

concepts:
- code: cbse7h.m7.varsha
  title: वर्षा-बहार (कविता)
  notes: |
    कवि: मुकुटधर पांडेय (छायावाद के आरंभिक कवि)। कविता वर्षा ऋतु की सुंदरता का चित्र खींचती है: आकाश में काले-घने बादल
    घिरते हैं, बिजली चमकती है, बादल गरजते हैं, रिमझिम वर्षा होती है। धरती हरी-भरी हो जाती है, नदी-तालाब भर जाते हैं,
    मोर नाचते हैं, मेंढक बोलते हैं, किसान खुश होते हैं। पूरी प्रकृति में नया जीवन और उत्साह आ जाता है।
    संदेश: प्रकृति का सौंदर्य देखें और उसका आनंद लें; वर्षा धरती और जीवन के लिए वरदान है।
  explanations:
    text: 'इस कविता में कवि वर्षा ऋतु का सुंदर चित्र बनाते हैं: घने बादल, चमकती बिजली, रिमझिम बारिश, नाचते मोर और हरी-भरी धरती। वर्षा आते ही पूरी प्रकृति में जैसे नई जान आ जाती है।'
    visual: 'आँखें बंद करके सोचिए: काले बादल, बिजली की चमक, मिट्टी की सोंधी खुशबू, पेड़ों से टपकती बूँदें और पंख फैलाकर नाचता मोर।'
    step_by_step: '1. कवि और ऋतु पहचानें। 2. आकाश के चित्र खोजें: बादल, बिजली, गर्जन। 3. धरती के चित्र खोजें: हरियाली, नदी-तालाब। 4. जीवों के चित्र खोजें: मोर, मेंढक, किसान। 5. कवि का भाव लिखें: आनंद और नया जीवन।'
    real_world: 'केरल में जून में मानसून आता है: स्कूल खुलते हैं, धान के खेत भरते हैं और सब कुछ हरा हो जाता है। यह वही ''वर्षा-बहार'' है।'
  picture:
    kind: compare
    columns:
    - title: आकाश में
      points:
      - काले घने बादल
      - बिजली की चमक
