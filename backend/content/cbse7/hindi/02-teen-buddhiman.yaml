subject: cbse7-hin
chapter: 2
title: तीन बुद्धिमान (लोककथा)
tips:
  h7_lokkatha: "यह कहानी पीढ़ियों से लोगों के बीच सुनाई जाती आई है, किसी एक लेखक की जीवनी नहीं।"
  h7_shak: "भाइयों के पास जानवर नहीं था। फिर भी वे उसके बारे में इतना कैसे जानते थे?"
  h7_tark: "भाई बुद्धिमान थे। उन्होंने अपनी बातों के पीछे के कारण समझाए।"
  h7_teen_bhai: "पाठ का शीर्षक ही संख्या बताता है।"
  c7h2_kram: 'कहानी को क्रम से दोहराओ: रास्ते के निशान, जानवर का मालिक, शक, न्याय के सामने बात, और अंत में सच।'
  c7h2_tark: निशान देखकर बिना देखे कोई बात जान लेना तर्क से अनुमान लगाना है। सोचो, किस निशान से कौन-सी बात पता चलती है।
  c7h2_shak: बिना सबूत किसी को दोषी मान लेना ठीक नहीं। सोचो, सच्चाई कैसे सामने आती है।
  c7h2_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ को सही बनाए रखे, वही चुनो।
  c7h2_vyakaran: देखो कि शब्द एक के लिए है या अनेक के लिए, और वाक्य किस काल में है।

concepts:
- code: cbse7h.m2.buddhiman
  title: तीन बुद्धिमान (लोककथा)
  notes: |
    एक लोककथा। तीन भाई अपनी तेज़ समझ और ध्यान से देखने की आदत के लिए जाने जाते हैं। रास्ते में मिले निशानों (पैरों के
    चिह्न, घास, रास्ते के किनारे की चीज़ें) को देखकर वे एक खोए हुए जानवर के बारे में सही बातें बता देते हैं, जबकि उन्होंने उसे
    देखा तक नहीं। मालिक को शक होता है कि उन्होंने ही उसे चुराया है और बात न्याय तक पहुँचती है। भाई समझाते हैं कि उन्होंने
    हर बात निशानों से अनुमान लगाकर कही। सच सामने आता है और उनकी बुद्धि का सम्मान होता है।
    संदेश: ध्यान से देखना, सोचना और तर्क से अनुमान लगाना ही बुद्धिमानी है; बिना सबूत किसी पर शक न करें।
    (विवरण अध्ययन-सामग्री से; छपी पुस्तक से मिलान बाकी।)
  explanations:
    text: 'इस लोककथा में तीन भाई रास्ते के छोटे-छोटे निशान ध्यान से देखकर एक खोए जानवर के बारे में सही बातें बता देते हैं। लोग उन पर चोरी का शक करते हैं, पर वे समझाते हैं कि सब कुछ उन्होंने देखकर और सोचकर जाना। बुद्धि का मतलब है: देखो, सोचो, फिर बोलो।'
    visual: 'कल्पना कीजिए: मिट्टी में पैरों के निशान, एक ओर खाई हुई घास, दूसरी ओर अछूती। तीन भाई झुककर देख रहे हैं, जैसे जासूस सुराग पढ़ते हैं।'
    step_by_step: '1. पात्र पहचानें: तीन भाई, जानवर का मालिक, न्याय करने वाला। 2. देखें भाइयों ने कौन-से निशान देखे। 3. समझें शक क्यों हुआ। 4. देखें उन्होंने तर्क से कैसे समझाया। 5. संदेश लिखें।'
    real_world: 'डॉक्टर लक्षण देखकर बीमारी पहचानते हैं और मिस्त्री आवाज़ सुनकर गाड़ी की खराबी: यह वही ''देखकर अनुमान लगाने'' वाली बुद्धि है।'
  picture:
    kind: flow
    steps:
    - निशान देखे
    - सोचकर अनुमान लगाया
    - जानवर के बारे में सही बताया
    - चोरी का शक
    - तर्क से समझाया, सम्मान मिला
    alt: 'कथा का क्रम: भाइयों ने निशान देखे, अनुमान लगाया, सही बताया, उन पर शक हुआ और तर्क से समझाने पर सम्मान मिला।'
  activity:
    type: order
    prompt: लोककथा की घटनाएँ क्रम से लगाओ।
    steps:
    - भाई रास्ते के निशान ध्यान से देखते हैं
    - वे खोए जानवर के बारे में सही बातें बताते हैं
    - मालिक को उन पर चोरी का शक होता है
    - भाई समझाते हैं कि सब निशानों से अनुमान था
    - सच सामने आता है, बुद्धि का सम्मान
    reasons:
      वे खोए जानवर के बारे में सही बातें बताते हैं: उनकी बातें निशानों पर ही टिकी थीं।
      मालिक को उन पर चोरी का शक होता है: बिना देखे सही बताने पर ही शक हुआ।
      भाई समझाते हैं कि सब निशानों से अनुमान था: शक होने पर ही सफ़ाई देनी पड़ी।
      सच सामने आता है, बुद्धि का सम्मान: सफ़ाई सुनकर ही सच खुला।
  lesson:
    - teach: '''तीन बुद्धिमान'' एक लोककथा है: ऐसी कहानी जो पीढ़ियों से लोगों की ज़ुबान पर चलती आई है। इसमें तीन भाई हैं जो ध्यान से देखने और सोचने के लिए जाने जाते हैं।'
      check:
        prompt: लोककथा किसे कहते हैं?
        options:
        - जो कहानी पीढ़ियों से लोग सुनाते आए हैं
        - जो कहानी कल ही लिखी गई
        - जो केवल अख़बार में छपे
        answer: जो कहानी पीढ़ियों से लोग सुनाते आए हैं
        why: लोककथा लोगों के बीच मौखिक रूप से चलती है।
    - teach: रास्ते में भाइयों ने पैरों के निशान, चरी हुई घास और रास्ते के किनारे की चीज़ें देखीं। इन्हीं निशानों से उन्होंने एक खोए हुए जानवर के बारे में सही-सही बातें बता दीं, जबकि उन्होंने जानवर को देखा तक नहीं था।
      picture:
        kind: compare
        columns:
        - title: भाइयों ने क्या देखा
          points:
          - पैरों के निशान
          - चरी हुई घास
          - रास्ते की चीज़ें
        - title: क्या अनुमान लगाया
          points:
          - जानवर कैसे चलता है
          - उसने क्या खाया
          - वह किधर गया
        alt: निशान देखकर अनुमान लगाना।
      check:
        prompt: भाइयों ने जानवर के बारे में कैसे जाना?
        options:
        - निशान देखकर अनुमान लगाकर
        - जानवर को देखकर
        - किसी से पूछकर
        answer: निशान देखकर अनुमान लगाकर
        why: उन्होंने जानवर देखा ही नहीं था।
    - teach: 'मालिक को शक हुआ कि भाइयों ने ही जानवर चुराया है, और बात न्याय तक पहुँची। भाइयों ने हर बात के पीछे का निशान और तर्क समझाया। सच सामने आया और उनकी बुद्धि का सम्मान हुआ। सीख: ध्यान से देखो, सोचो, और बिना सबूत किसी पर शक न करो।'
      check:
        prompt: भाइयों पर शक क्यों हुआ?
        options:
        - क्योंकि उन्होंने बिना देखे सही बातें बता दीं
        - क्योंकि वे भाग गए
        - क्योंकि उनके पास जानवर था
        answer: क्योंकि उन्होंने बिना देखे सही बातें बता दीं
        why: मालिक को लगा कि उन्होंने जानवर देखा होगा।
  items:
  - prompt: '''तीन बुद्धिमान'' किस प्रकार की रचना है?'
