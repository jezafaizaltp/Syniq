subject: cbse7-hin
chapter: 2
title: तीन बुद्धिमान (लोककथा)
concepts:
- code: cbse7h.m2.buddhiman
  title: तीन बुद्धिमान (लोककथा)
  notes: |
    एक लोककथा। तीन भाई अपनी तेज़ समझ और ध्यान से देखने की आदत के लिए जाने जाते हैं। रास्ते में मिले निशानों (पैरों के
    चिह्न, घास, रास्ते के किनारे की चीज़ें) को देखकर वे एक खोए हुए जानवर के बारे में सही बातें बता देते हैं, जबकि उन्होंने उसे
    देखा तक नहीं। मालिक को शक होता है कि उन्होंने ही उसे चुराया है और बात न्याय तक पहुँचती है। भाई समझाते हैं कि उन्होंने
    हर बात निशानों से अनुमान लगाकर कही। सच सामने आता है और उनकी बुद्धि का सम्मान होता है।
    संदेश: ध्यान से देखना, सोचना और तर्क से अनुमान लगाना ही बुद्धिमानी है; बिना सबूत किसी पर शक न करें।
    (विवरण अध्ययन-सामग्री से; छपी पुस्तक से मिलान बाकी।)
  explanations:
    text: 'इस लोककथा में तीन भाई रास्ते के छोटे-छोटे निशान ध्यान से देखकर एक खोए जानवर के बारे में सही बातें बता देते हैं। लोग उन पर चोरी का शक करते हैं, पर वे समझाते हैं कि सब कुछ उन्होंने देखकर और सोचकर जाना। बुद्धि का मतलब है: देखो, सोचो, फिर बोलो।'
    visual: 'कल्पना कीजिए: मिट्टी में पैरों के निशान, एक ओर खाई हुई घास, दूसरी ओर अछूती। तीन भाई झुककर देख रहे हैं, जैसे जासूस सुराग पढ़ते हैं।'
    step_by_step: '1. पात्र पहचानें: तीन भाई, जानवर का मालिक, न्याय करने वाला। 2. देखें भाइयों ने कौन-से निशान देखे। 3. समझें शक क्यों हुआ। 4. देखें उन्होंने तर्क से कैसे समझाया। 5. संदेश लिखें।'
    real_world: 'डॉक्टर लक्षण देखकर बीमारी पहचानते हैं और मिस्त्री आवाज़ सुनकर गाड़ी की खराबी: यह वही ''देखकर अनुमान लगाने'' वाली बुद्धि है।'
  picture:
    kind: flow
    steps:
    - निशान देखे
    - सोचकर अनुमान लगाया
    - जानवर के बारे में सही बताया
    - चोरी का शक
    - तर्क से समझाया, सम्मान मिला
    alt: 'कथा का क्रम: भाइयों ने निशान देखे, अनुमान लगाया, सही बताया, उन पर शक हुआ और तर्क से समझाने पर सम्मान मिला।'
  items:
  - prompt: '''तीन बुद्धिमान'' किस प्रकार की रचना है?'
    options:
    - लोककथा
    - कविता
    - निबंध
    - आत्मकथा
    answer: लोककथा
    difficulty: 1
    hints:
    - लोगों में पीढ़ियों से सुनाई जाने वाली कहानी।
    - कोई एक लेखक नहीं।
    solution: यह एक लोककथा है।
  - prompt: कहानी में कितने भाई हैं?
    options:
    - तीन
    - दो
    - चार
    - पाँच
    answer: तीन
    difficulty: 1
    hints:
    - शीर्षक देखें।
    - '''तीन बुद्धिमान''।'
    solution: कहानी तीन भाइयों की है।
  - prompt: भाइयों की सबसे बड़ी खूबी क्या थी?
    options:
    - ध्यान से देखना और तर्क से सोचना
    - बहुत ताकतवर होना
    - बहुत अमीर होना
    - तेज़ दौड़ना
    answer: ध्यान से देखना और तर्क से सोचना
    difficulty: 1
    hints:
    - 'शीर्षक: ''बुद्धिमान''।'
    - निशानों से अनुमान।
    solution: उनकी खूबी थी ध्यान से देखना और तर्क से अनुमान लगाना।
    mistakes:
      बहुत ताकतवर होना: hin7_read_again
  - prompt: भाइयों पर चोरी का शक क्यों हुआ?
    options:
    - क्योंकि उन्होंने बिना देखे जानवर के बारे में सही बातें बता दीं
    - क्योंकि वे जानवर के साथ पकड़े गए
    - क्योंकि उन्होंने चोरी मान ली
    - क्योंकि वे भाग रहे थे
    answer: क्योंकि उन्होंने बिना देखे जानवर के बारे में सही बातें बता दीं
    difficulty: 2
    hints:
    - मालिक हैरान था।
    - '''इतना सही कैसे जाना?'''
    solution: उनकी सटीक बातें सुनकर मालिक को लगा कि उन्होंने जानवर को देखा, यानी चुराया होगा।
  - prompt: भाइयों ने अपने को निर्दोष कैसे साबित किया?
    options:
    - हर बात के पीछे का निशान और तर्क समझाकर
    - रोकर माफ़ी माँगकर
    - पैसे देकर
    - गवाह लाकर
    answer: हर बात के पीछे का निशान और तर्क समझाकर
    difficulty: 2
    hints:
    - उन्होंने सब देखकर जाना था।
    - सबूत = निशान।
    solution: उन्होंने समझाया कि हर बात उन्होंने रास्ते के निशानों से अनुमान लगाकर कही।
  - prompt: इस लोककथा से कौन-सी सीख मिलती है?
    options:
    - ध्यान से देखकर, सोचकर बोलें और बिना सबूत किसी पर शक न करें
    - अजनबियों से कभी बात न करें
    - जानवर पालना ठीक नहीं
    - बुद्धि से अधिक ताकत ज़रूरी है
    answer: ध्यान से देखकर, सोचकर बोलें और बिना सबूत किसी पर शक न करें
    difficulty: 2
    hints:
    - दोनों पक्षों की सीख।
    - भाई और मालिक दोनों।
    solution: 'भाइयों से सीख: देखो और सोचो; मालिक से सीख: बिना सबूत शक मत करो।'
    mistakes:
      बुद्धि से अधिक ताकत ज़रूरी है: hin7_whole
