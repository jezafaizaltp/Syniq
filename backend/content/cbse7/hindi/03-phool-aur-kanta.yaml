  lesson:
    - teach: '''फूल और काँटा'' अयोध्या सिंह उपाध्याय ''हरिऔध'' की कविता है। फूल और काँटा एक ही पौधे पर पैदा होते हैं। दोनों को एक-सा पानी, हवा, धूप और चाँदनी मिलती है।'
