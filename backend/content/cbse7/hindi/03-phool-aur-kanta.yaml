subject: cbse7-hin
chapter: 3
title: फूल और काँटा (कविता)
tips:
  h7_ek_paudha: "कविता का भाव यही है कि एक ही जगह जन्म लेकर भी दोनों का स्वभाव अलग है।"
  h7_titli: "फूल कोमल है और उसके पास रंग-बिरंगे कीट रस लेने आते हैं।"
  c7h3_saman: कवि पहले बताते हैं कि दोनों को सब कुछ एक जैसा मिलता है। सोचो, फिर भी अंतर कहाँ से आता है।
  c7h3_guna: एक का स्वभाव दूसरों को सुख देता है, दूसरे का दुख। कविता में किसके काम कैसे बताए गए हैं, याद करो।
  c7h3_sandesh: 'कविता मनुष्यों के लिए है: बड़ा कौन बनता है, ऊँचे घर में जन्म से या अच्छे काम से?'
  c7h3_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ को सही बनाए रखे, वही चुनो।
  c7h3_vyakaran: विलोम शब्द उल्टा अर्थ देता है, पर्यायवाची वैसा ही अर्थ। पहले तय करो कि प्रश्न क्या माँग रहा है।

concepts:
- code: cbse7h.m3.phool
  title: फूल और काँटा (कविता)
  notes: |
    कवि: अयोध्या सिंह उपाध्याय 'हरिऔध'। फूल और काँटा एक ही पौधे पर पैदा होते हैं; दोनों को एक-सा पानी, हवा, चाँदनी और
    धूप मिलती है। फिर भी उनके स्वभाव अलग हैं: काँटा उँगलियाँ छेदता है, कपड़े फाड़ता है, भौंरे को भी चुभता है; फूल
    तितलियों को गोद में बिठाता है, भौंरे को रस देता है और अपनी सुगंध और सुंदरता से सबका मन मोह लेता है।
    संदेश: बड़प्पन जन्म या कुल से नहीं, अच्छे गुणों और व्यवहार से मिलता है। एक ही घर में जन्मे लोग भी कर्मों से अलग पहचान पाते हैं।
  explanations:
    text: 'फूल और काँटा एक ही पौधे पर उगते हैं और दोनों को एक जैसा पानी, हवा और धूप मिलती है। पर काँटा चुभता है और फूल सुगंध देता है। कवि कहते हैं: बड़ा वही है जिसके गुण अच्छे हैं, जन्म से कोई बड़ा नहीं होता।'
    visual: 'कल्पना कीजिए: गुलाब की एक डाल। ऊपर लाल फूल पर बैठी तितली, नीचे नुकीला काँटा जिसमें किसी का कपड़ा अटका है। एक ही डाल, दो स्वभाव।'
    step_by_step: '1. कवि पहचानें: हरिऔध। 2. समानता देखें: एक पौधा, एक-सा पालन। 3. अंतर देखें: काँटे का व्यवहार, फूल का व्यवहार। 4. प्रतीक समझें: फूल = अच्छे गुण, काँटा = बुरा स्वभाव। 5. संदेश: गुणों से बड़प्पन।'
    real_world: 'एक ही कक्षा में पढ़ने वाले दो बच्चे: एक दूसरों की मदद करता है, दूसरा चिढ़ाता है। लोग पहले वाले को याद रखते हैं, यह कविता यही कहती है।'
  picture:
    kind: compare
