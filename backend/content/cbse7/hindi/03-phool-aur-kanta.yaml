      ways:
      - style: step_by_step
        teach: 'पहला: काँटे के काम गिनो: वह उँगलियाँ छेदता है, कपड़े फाड़ता है और भौंरे को चुभता है। दूसरा: फूल के काम गिनो: वह तितलियों को गोद में बिठाता है, भौंरे को रस देता है और सुगंध से मन मोह लेता है। तीसरा: दोनों को साथ रखकर देखो: एक दुख देता है, दूसरा सुख।'
