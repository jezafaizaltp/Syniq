          - title: काँटे को
            points:
            - वही पौधा
            - वही पानी और हवा
            - वही धूप और चाँदनी
          alt: फूल और काँटे दोनों को वही पौधा, वही पानी और हवा, और वही धूप और चाँदनी मिलती है।
      - style: real_world
        teach: एक ही कक्षा, एक ही शिक्षक और एक जैसी किताबें, फिर भी हर विद्यार्थी अलग निकलता है। एक ही घर में पले भाई-बहन भी एक जैसे नहीं होते। कविता इसी बात से शुरू होती है।
    - teach: फिर भी दोनों का स्वभाव अलग है। काँटा उँगलियाँ छेदता है, कपड़े फाड़ता है, भौंरे को भी चुभता है। फूल तितलियों को गोद में बिठाता है, भौंरे को रस देता है और अपनी सुगंध और सुंदरता से सबका मन मोह लेता है।
      picture:
