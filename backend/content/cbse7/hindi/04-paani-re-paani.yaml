subject: cbse7-hin
chapter: 4
title: पानी रे पानी (निबंध)
tips:
  h7_bhujal: "'भू' का अर्थ धरती है।"
  h7_gullak: "जिसमें हम थोड़ा-थोड़ा जमा करते हैं और ज़रूरत पर निकालते हैं।"
  h7_jal_chakra: "नल का पानी भी कहीं और से आता है। सूरज समुद्र का पानी गर्म करता है तो क्या बनता है?"
  h7_paani_upay: "नल पानी पैदा नहीं करते। पानी धरती में वापस कैसे पहुँचे?"
  c7h4_chakra: 'पानी एक घेरे में घूमता है: समुद्र से ऊपर, फिर नीचे, फिर ज़मीन पर और ज़मीन के भीतर, और फिर वापस। हर कदम को क्रम से सोचो।'
  c7h4_samasya: जब वर्षा का पानी धरती में नहीं समाता तो वह बह जाता है। सोचो, इससे कहीं ज़्यादा और कहीं कम पानी क्यों हो जाता है।
  c7h4_upay: हल वही है जो पानी को बहने से रोके और धरती में जमा होने दे, या पानी बर्बाद होने से बचाए।
  c7h4_tulna: लेखक एक घरेलू चीज़ से तुलना करते हैं जिसमें थोड़ा-थोड़ा जमा करके ज़रूरत के समय निकाला जाता है।
  c7h4_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ को सही बनाए रखे, वही चुनो।
  c7h4_ganit: पहले लिखो कि जोड़ना है, घटाना है या गुणा करना है, फिर हल करो।

concepts:
- code: cbse7h.m4.paani
  title: पानी रे पानी (निबंध)
  notes: |
    लेखक: अनुपम मिश्र (पर्यावरणविद, जल-संरक्षण पर लेखन)। पानी का चक्र: समुद्र से भाप बनकर बादल, बादल से वर्षा, वर्षा का पानी
    नदियों, तालाबों और धरती के भीतर (भूजल) जाकर फिर समुद्र तक। लेखक इसे एक चक्र या 'खेल' जैसा समझाते हैं। हमने तालाब
    पाट दिए, ज़मीन पक्की कर दी, इसलिए वर्षा का पानी धरती में नहीं समाता: कहीं बाढ़ आती है, कहीं सूखा और नल सूखे रहते हैं।
    तालाब और ज़मीन 'गुल्लक' की तरह हैं: वर्षा में पानी जमा करो, गर्मी में काम आएगा।
    संदेश: पानी बचाएँ, तालाबों और जल-स्रोतों की रक्षा करें, वर्षा का पानी धरती में जाने दें।
  explanations:
    text: 'लेखक बताते हैं कि पानी एक चक्र में घूमता है: समुद्र से बादल, बादल से वर्षा, वर्षा से तालाब, नदियाँ और ज़मीन के भीतर का पानी। जब हम तालाब भर देते हैं, तो यह चक्र टूटता है और बाढ़ और सूखा दोनों आते हैं। तालाब पानी की गुल्लक हैं।'
    visual: 'कल्पना कीजिए एक गोल तीर वाला चित्र: समुद्र → बादल → वर्षा → तालाब और भूजल → नदी → फिर समुद्र। बीच में एक मिट्टी की गुल्लक जिसमें बारिश की बूँदें जमा हो रही हैं।'
    step_by_step: '1. लेखक और विषय पहचानें: जल-संरक्षण। 2. पानी का चक्र क्रम से लिखें। 3. देखें चक्र कैसे टूटा: तालाब पाटना, पक्की ज़मीन। 4. परिणाम: बाढ़ और सूखा। 5. उपाय: गुल्लक की तरह पानी जमा करना।'
    real_world: छत का बारिश का पानी पाइप से ज़मीन के गड्ढे या टंकी में भेजना (वर्षा-जल संचयन) ठीक वही 'गुल्लक' है जिसकी बात लेखक करते हैं।
  picture:
    kind: flow
    steps:
    - समुद्र
    - भाप और बादल
    - वर्षा
    - तालाब और भूजल
    - नदियाँ, फिर समुद्र
    alt: 'पानी का चक्र: समुद्र से भाप और बादल, फिर वर्षा, फिर तालाब और भूजल, फिर नदियों से होकर वापस समुद्र।'
  activity:
    type: order
    prompt: पानी का चक्र क्रम से लगाओ।
    steps:
    - समुद्र का पानी भाप बनता है
    - भाप से बादल बनते हैं
    - बादल से वर्षा होती है
    - पानी नदियों, तालाबों और धरती के भीतर जाता है
    - पानी फिर समुद्र तक पहुँचता है
    reasons:
      भाप से बादल बनते हैं: बादल भाप से ही बनते हैं।
      बादल से वर्षा होती है: बादल हों तभी बरसेंगे।
      पानी नदियों, तालाबों और धरती के भीतर जाता है: वर्षा का पानी ही धरती पर इकट्ठा होता है।
      पानी फिर समुद्र तक पहुँचता है: 'नदियाँ बहकर समुद्र में मिलती हैं: चक्र पूरा।'
  lesson:
    - teach: '''पानी रे पानी'' अनुपम मिश्र का निबंध है, जिन्होंने जल-संरक्षण पर बहुत लिखा। वे पानी के चक्र को समझाते हैं: समुद्र का पानी भाप बनकर बादल बनता है, बादल बरसते हैं, वर्षा का पानी नदियों, तालाबों और धरती के भीतर (भूजल) जाता है, और फिर समुद्र तक पहुँचता है।'
      picture:
        kind: flow
        steps:
        - समुद्र का पानी भाप बनता है
        - भाप से बादल बनते हैं
        - बादल बरसते हैं
        - पानी नदियों, तालाबों और भूजल में
        - पानी फिर समुद्र तक
        alt: 'पानी का चक्र: समुद्र से बादल, बादल से वर्षा, और फिर वापस समुद्र तक।'
      check:
        prompt: बादल किससे बनते हैं?
        options:
        - समुद्र की भाप से
        - धुएँ से
        - रेत से
        answer: समुद्र की भाप से
        why: सूरज की गर्मी से पानी भाप बनकर ऊपर जाता है।
    - teach: 'हमने तालाब पाट दिए और ज़मीन पक्की कर दी, इसलिए वर्षा का पानी धरती में नहीं समाता। वह बह जाता है: कहीं बाढ़ आती है, और गर्मी में कहीं सूखा पड़ता है और नल सूखे रहते हैं।'
      check:
        prompt: पक्की ज़मीन पर वर्षा का पानी क्या करता है?
        options:
        - बह जाता है
        - धरती में समा जाता है
        - जम जाता है
        answer: बह जाता है
        why: पक्की सतह पानी को भीतर नहीं जाने देती।
    - teach: 'लेखक तालाबों और ज़मीन की तुलना गुल्लक से करते हैं: वर्षा के समय पानी जमा करो, गर्मी में वही काम आएगा। संदेश: पानी बचाएँ, तालाबों की रक्षा करें और वर्षा का पानी धरती में जाने दें।'
      check:
        prompt: गुल्लक की तरह तालाब हमें क्या सिखाते हैं?
        options:
        - समय रहते जमा करो, ज़रूरत पर काम आएगा
        - सब कुछ तुरंत खर्च करो
        - पानी फेंक दो
        answer: समय रहते जमा करो, ज़रूरत पर काम आएगा
        why: गुल्लक में बचत की जाती है।
  items:
  - prompt: '''पानी रे पानी'' पाठ के लेखक कौन हैं?'
    options:
    - अनुपम मिश्र
    - स्वयं प्रकाश
    - हरिऔध
    - मुकुटधर पांडेय
    answer: अनुपम मिश्र
    difficulty: 1
    hints:
    - पर्यावरण और तालाबों पर लिखने वाले।
    - जल-संरक्षण।
    solution: पाठ अनुपम मिश्र का है।
    mistakes:
      स्वयं प्रकाश: hin7_read_again
  - prompt: वर्षा का पानी कहाँ से आता है?
    options:
    - बादलों से, जो समुद्र की भाप से बनते हैं
    - सीधे नल से
    - पहाड़ों के पत्थरों से
    - पेड़ों की जड़ों से
    answer: बादलों से, जो समुद्र की भाप से बनते हैं
    difficulty: 1
    hints:
    - पानी का चक्र।
    - भाप → बादल।
    solution: समुद्र का पानी भाप बनकर बादल बनता है, बादल बरसते हैं।
    mistakes: {"सीधे नल से": "h7_jal_chakra"}
  - prompt: लेखक तालाबों की तुलना किससे करते हैं?
    options:
    - गुल्लक से
    - घड़ी से
    - किताब से
    - दीपक से
    answer: गुल्लक से
    difficulty: 1
    hints:
    - जिसमें पैसे जमा करते हैं।
    - बचत।
    solution: 'तालाब पानी की गुल्लक हैं: वर्षा में जमा करो, ज़रूरत में निकालो।'
    mistakes: {"घड़ी से": "h7_gullak"}
  - prompt: ज़मीन के भीतर जमा पानी को क्या कहते हैं?
    options:
    - भूजल
    - समुद्र
    - ओस
    - भाप
    answer: भूजल
    difficulty: 1
    hints:
    - भू = धरती।
    - कुएँ और नलकूप इसी से भरते हैं।
    solution: धरती के भीतर का पानी भूजल कहलाता है।
    mistakes: {"भाप": "h7_bhujal"}
  - prompt: एक ही देश में बाढ़ और सूखा दोनों क्यों आते हैं?
    options:
    - क्योंकि तालाब पाट देने से वर्षा का पानी जमा नहीं होता और बह जाता है
    - क्योंकि वर्षा बिलकुल नहीं होती
    - क्योंकि समुद्र सूख गया है
    - क्योंकि नदियाँ उलटी बहती हैं
    answer: क्योंकि तालाब पाट देने से वर्षा का पानी जमा नहीं होता और बह जाता है
    difficulty: 2
    hints:
    - पानी कहाँ जाए?
    - गुल्लक टूट गई।
    solution: 'पानी धरती में नहीं समाता: बरसात में बाढ़ बनकर बहता है और गर्मी में कमी रहती है।'
    mistakes:
      क्योंकि वर्षा बिलकुल नहीं होती: hin7_whole
  - prompt: पाठ के अनुसार पानी की समस्या का अच्छा उपाय कौन-सा है?
    options:
    - तालाबों को बचाना और वर्षा का पानी धरती में जाने देना
    - और अधिक नल लगाना
    - नदियों पर ढक्कन लगाना
    - केवल बोतल का पानी पीना
    answer: तालाबों को बचाना और वर्षा का पानी धरती में जाने देना
    difficulty: 2
    hints:
    - चक्र को फिर से जोड़ें।
    - गुल्लक भरें।
    solution: जल-स्रोतों की रक्षा और वर्षा-जल को धरती में पहुँचाना ही उपाय है।
    mistakes: {"और अधिक नल लगाना": "h7_paani_upay"}
  - prompt: '''पानी रे पानी'' किस विधा की रचना है?'
    options:
    - निबंध
    - कविता
    - नाटक
    answer: निबंध
    difficulty: 1
    hints:
    - यह गद्य में है।
    - इसमें लेखक अपने विचार समझाते हैं।
    solution: '''पानी रे पानी'' एक निबंध है।'
    mistakes:
      कविता: c7h4_shabd
      नाटक: c7h4_shabd
  - prompt: तालाब पाट देने का क्या परिणाम होता है?
    options:
    - वर्षा का पानी जमा नहीं होता
    - ज़्यादा बादल बनते हैं
    - समुद्र सूख जाता है
    answer: वर्षा का पानी जमा नहीं होता
    difficulty: 2
    hints:
    - तालाब पानी को रोकते थे।
    - पाटने का अर्थ है भर देना।
    solution: तालाब भर देने से वर्षा का पानी रुकता नहीं, बह जाता है।
    mistakes:
      ज़्यादा बादल बनते हैं: c7h4_samasya
      समुद्र सूख जाता है: c7h4_samasya
  - prompt: '''पाट देना'' का अर्थ है:'
    options:
    - मिट्टी आदि से भरकर बंद कर देना
    - साफ़ करना
    - गहरा करना
    answer: मिट्टी आदि से भरकर बंद कर देना
    difficulty: 2
    hints:
    - लोगों ने तालाबों के साथ यह किया।
    - उस जगह पर फिर घर या सड़क बन गए।
    solution: '''पाट देना'' का अर्थ है गड्ढे या तालाब को भरकर बंद कर देना।'
    mistakes:
      साफ़ करना: c7h4_shabd
      गहरा करना: c7h4_shabd
  - prompt: इनमें से कौन-सा काम पानी बचाता है?
    options:
    - छत का वर्षा जल इकट्ठा करना
    - नल खुला छोड़ देना
    - तालाब में कचरा डालना
    answer: छत का वर्षा जल इकट्ठा करना
    difficulty: 1
    hints:
    - जमा करना बचत है।
    - दो विकल्प पानी बर्बाद करते हैं।
    solution: वर्षा जल संग्रह से पानी जमा होता है और धरती में जाता है।
    mistakes:
      नल खुला छोड़ देना: c7h4_upay
      तालाब में कचरा डालना: c7h4_upay
  - prompt: पानी के चक्र में भाप ऊपर जाकर क्या बनती है?
    options:
    - बादल
    - बर्फ़ के पहाड़
    - नदी
    answer: बादल
    difficulty: 1
    hints:
    - आसमान में दिखते हैं।
    - इन्हीं से वर्षा होती है।
    solution: भाप ऊपर ठंडी होकर बादल बनती है।
    mistakes:
      बर्फ़ के पहाड़: c7h4_chakra
      नदी: c7h4_chakra
  - prompt: एक नल से हर मिनट 2 लीटर पानी टपकता है। 10 मिनट में कितना लीटर पानी बर्बाद होगा?
    answer: '20'
    check: 2*10
    difficulty: 1
    hints:
    - हर मिनट बराबर पानी।
    - गुणा करो।
    solution: 'चरण 1: 2 × 10। चरण 2: = 20 लीटर।'
    mistakes:
      '12': c7h4_ganit
      '5': c7h4_ganit
  - prompt: एक परिवार रोज़ 150 लीटर पानी खर्च करता है। बचत करके 30 लीटर कम कर दे, तो रोज़ कितना खर्च होगा?
    answer: '120'
    check: 150-30
    difficulty: 1
    hints:
    - कम करना यानी घटाना।
    - 150 में से 30 घटाओ।
    solution: 'चरण 1: 150 − 30। चरण 2: = 120 लीटर।'
    mistakes:
