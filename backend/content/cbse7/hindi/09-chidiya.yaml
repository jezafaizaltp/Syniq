    - "पक्षियों को हमेशा पिंजरे में रखना चाहिए, ताकि वे सुरक्षित रहें और खुश रहें"
    - "छोटे जीव किसी काम के नहीं होते, इसलिए उनकी चिंता करने की ज़रूरत नहीं है"
