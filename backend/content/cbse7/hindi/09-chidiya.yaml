title: चिड़िया (कविता)
tips:
  h7_chahchahana: "सुबह चिड़ियों की आवाज़ से ही नींद खुलती है।"
  h7_tinke: "चिड़िया छोटी है। वह अपनी चोंच में हल्की, सूखी घास लाती है।"

concepts:
- code: cbse7h.m9.chidiya
  title: चिड़िया (कविता)
  notes: |
    कवि: आरसी प्रसाद सिंह। कविता एक छोटी चिड़िया के जीवन का चित्र है: वह सुबह-सवेरे चहचहाती है, खुले आकाश में उड़ती है,
    दाना चुगती है, तिनके जोड़कर घोंसला बनाती है और अपने बच्चों की देखभाल करती है। वह छोटी है, पर स्वतंत्र, फुर्तीली,
    मेहनती और हमेशा प्रसन्न रहती है। कवि उसकी मीठी आवाज़ और आज़ादी पर मुग्ध हैं।
    संदेश: सरल जीवन, परिश्रम, स्वतंत्रता और प्रसन्नता का महत्व; छोटे जीवों से भी प्रेम करें और उन्हें बंदी न बनाएँ।
    (कविता के विवरण अध्ययन-सामग्री से; छपी पुस्तक से मिलान बाकी।)
  explanations:
    text: 'इस कविता में एक छोटी चिड़िया का जीवन दिखाया गया है: सुबह चहचहाना, आकाश में उड़ना, दाना चुगना और तिनकों से घोंसला बनाना। छोटी होकर भी वह मेहनती, आज़ाद और खुश है।'
    visual: 'कल्पना कीजिए: सुबह की धूप, पेड़ की डाल पर चहचहाती छोटी चिड़िया, चोंच में तिनका, और पास में आधा बना घोंसला।'
    step_by_step: '1. कवि पहचानें। 2. चिड़िया के काम खोजें: चहचहाना, उड़ना, चुगना, घोंसला। 3. उसके गुण लिखें: मेहनत, आज़ादी, खुशी। 4. कवि का भाव समझें। 5. सीख लिखें।'
    real_world: बालकनी में पक्षियों के लिए पानी का कटोरा और दाना रखना, खासकर गर्मियों में, इन छोटे जीवों के प्रति प्रेम दिखाने का आसान तरीका है।
  picture:
    kind: compare
    columns:
    - title: चिड़िया के काम
      points:
      - सुबह चहचहाना
      - दाना चुगना
      - तिनकों से घोंसला
    - title: चिड़िया के गुण
      points:
      - मेहनती
      - स्वतंत्र
      - सदा प्रसन्न
    alt: चिड़िया चहचहाती, दाना चुगती और तिनकों से घोंसला बनाती है; वह मेहनती, स्वतंत्र और सदा प्रसन्न है।
  items:
  - prompt: '''चिड़िया'' कविता के कवि कौन हैं?'
    options:
    - आरसी प्रसाद सिंह
    - मुकुटधर पांडेय
    - अनुपम मिश्र
    - गिरिधर कविराय
    answer: आरसी प्रसाद सिंह
    difficulty: 1
    hints:
    - बिहार के कवि।
    - नाम में 'प्रसाद'।
    solution: कविता आरसी प्रसाद सिंह की है।
    mistakes:
      मुकुटधर पांडेय: hin7_read_again
  - prompt: चिड़िया घोंसला किससे बनाती है?
    options:
    - तिनकों से
    - ईंटों से
    - कपड़ों से
    - पत्थरों से
    answer: तिनकों से
    difficulty: 1
    hints:
    - छोटे सूखे घास के टुकड़े।
    - एक-एक करके जोड़ती है।
    solution: चिड़िया तिनके जोड़कर घोंसला बनाती है।
    mistakes: {"ईंटों से": "h7_tinke"}
  - prompt: चिड़िया सुबह-सवेरे क्या करती है?
    options:
    - चहचहाती है
    - सोती रहती है
    - रोती है
    - छिप जाती है
    answer: चहचहाती है
    difficulty: 1
    hints:
    - मीठी आवाज़।
    - सुबह की पहचान।
    solution: चिड़िया सुबह-सवेरे चहचहाती है।
    mistakes: {"सोती रहती है": "h7_chahchahana"}
  - prompt: कविता में चिड़िया का कौन-सा गुण दिखाया गया है?
    options:
    - मेहनत और प्रसन्नता
    - आलस्य
    - क्रोध
    - डर
    answer: मेहनत और प्रसन्नता
    difficulty: 1
    hints:
    - घोंसला बनाना = मेहनत।
    - चहचहाना = खुशी।
    solution: चिड़िया मेहनती और सदा प्रसन्न है।
    mistakes:
      आलस्य: hin7_read_again
  - prompt: कवि चिड़िया की आज़ादी की प्रशंसा क्यों करते हैं?
    options:
    - क्योंकि खुले आकाश में उड़ना ही उसका सुख है
    - क्योंकि वह पिंजरे में सुरक्षित है
    - क्योंकि वह उड़ नहीं सकती
    - क्योंकि वह बड़ी है
    answer: क्योंकि खुले आकाश में उड़ना ही उसका सुख है
    difficulty: 2
    hints:
    - पिंजरा बनाम आकाश।
    - स्वतंत्रता।
    solution: खुले आकाश में उड़ना ही चिड़िया का असली सुख है।
    mistakes:
      क्योंकि वह पिंजरे में सुरक्षित है: hin7_poem_meaning
  - prompt: इस कविता से हमें क्या सीख मिलती है?
    options:
    - छोटे जीवन में भी मेहनत, आज़ादी और खुशी का महत्व है; पक्षियों को बंदी न बनाएँ
    - पक्षियों को पिंजरे में रखना चाहिए
    - छोटे जीव किसी काम के नहीं
    - सुबह जल्दी नहीं उठना चाहिए
    answer: छोटे जीवन में भी मेहनत, आज़ादी और खुशी का महत्व है; पक्षियों को बंदी न बनाएँ
    difficulty: 2
    hints:
    - चिड़िया के गुण अपनाएँ।
    - जीवों से प्रेम।
    solution: कविता सरल, मेहनती और स्वतंत्र जीवन का महत्व और जीवों से प्रेम सिखाती है।
    mistakes:
      पक्षियों को पिंजरे में रखना चाहिए: hin7_whole
