subject: cbse7-hin
chapter: 9
title: चिड़िया (कविता)
tips:
  h7_chahchahana: "सुबह चिड़ियों की आवाज़ से ही नींद खुलती है।"
  h7_tinke: "चिड़िया छोटी है। वह अपनी चोंच में हल्की, सूखी घास लाती है।"
  c7h9_din: 'चिड़िया के दिन को क्रम से सोचो: सुबह की आवाज़, उड़ान, दाना, घर बनाना और बच्चों की देखभाल।'
  c7h9_guna: 'कविता चिड़िया के स्वभाव की तारीफ़ करती है: छोटी पर फुर्तीली, मेहनती, आज़ाद और खुश। प्रश्न किस गुण की बात कर रहा है?'
  c7h9_azadi: पक्षी का असली सुख खुले आकाश में है। सोचो, पिंजरे में उसका क्या छिन जाता है।
  c7h9_shabd: हर विकल्प को वाक्य में रखकर पढ़ो। जो अर्थ को सही बनाए रखे, वही चुनो।
  c7h9_vyakaran: देखो कि शब्द किसी का नाम है, काम है या विशेषता है; या प्रश्न लिंग या वचन पूछ रहा है।
  c7h9_ganit: पहले लिखो कि जोड़ना है, घटाना है या गुणा करना है, फिर हल करो।

concepts:
- code: cbse7h.m9.chidiya
  title: चिड़िया (कविता)
  notes: |
    कवि: आरसी प्रसाद सिंह। कविता एक छोटी चिड़िया के जीवन का चित्र है: वह सुबह-सवेरे चहचहाती है, खुले आकाश में उड़ती है,
    दाना चुगती है, तिनके जोड़कर घोंसला बनाती है और अपने बच्चों की देखभाल करती है। वह छोटी है, पर स्वतंत्र, फुर्तीली,
    मेहनती और हमेशा प्रसन्न रहती है। कवि उसकी मीठी आवाज़ और आज़ादी पर मुग्ध हैं।
    संदेश: सरल जीवन, परिश्रम, स्वतंत्रता और प्रसन्नता का महत्व; छोटे जीवों से भी प्रेम करें और उन्हें बंदी न बनाएँ।
    (कविता के विवरण अध्ययन-सामग्री से; छपी पुस्तक से मिलान बाकी।)
  explanations:
    text: 'इस कविता में एक छोटी चिड़िया का जीवन दिखाया गया है: सुबह चहचहाना, आकाश में उड़ना, दाना चुगना और तिनकों से घोंसला बनाना। छोटी होकर भी वह मेहनती, आज़ाद और खुश है।'
    visual: 'कल्पना कीजिए: सुबह की धूप, पेड़ की डाल पर चहचहाती छोटी चिड़िया, चोंच में तिनका, और पास में आधा बना घोंसला।'
    step_by_step: '1. कवि पहचानें। 2. चिड़िया के काम खोजें: चहचहाना, उड़ना, चुगना, घोंसला। 3. उसके गुण लिखें: मेहनत, आज़ादी, खुशी। 4. कवि का भाव समझें। 5. सीख लिखें।'
    real_world: बालकनी में पक्षियों के लिए पानी का कटोरा और दाना रखना, खासकर गर्मियों में, इन छोटे जीवों के प्रति प्रेम दिखाने का आसान तरीका है।
  picture:
    kind: compare
    columns:
    - title: चिड़िया के काम
      points:
      - सुबह चहचहाना
      - दाना चुगना
      - तिनकों से घोंसला
    - title: चिड़िया के गुण
      points:
      - मेहनती
      - स्वतंत्र
      - सदा प्रसन्न
    alt: चिड़िया चहचहाती, दाना चुगती और तिनकों से घोंसला बनाती है; वह मेहनती, स्वतंत्र और सदा प्रसन्न है।
  activity:
    type: sort
    prompt: कविता में चिड़िया का यह काम है या उसका गुण?
    bins:
    - चिड़िया का काम
    - चिड़िया का गुण
    items:
    - label: तिनके जोड़कर घोंसला बनाना
      bin: चिड़िया का काम
      clue: यह वह करती है या वह है?
      why: घोंसला बनाना उसका काम।
    - label: दाना चुगना
      bin: चिड़िया का काम
      clue: यह क्रिया है या स्वभाव?
      why: चिड़िया का रोज़ का काम।
    - label: बच्चों की देखभाल
      bin: चिड़िया का काम
      clue: घोंसले में वह क्या करती है?
      why: चिड़िया का काम।
    - label: फुर्तीली
      bin: चिड़िया का गुण
      clue: यह उसका स्वभाव बताता है?
      why: फुर्ती उसका गुण।
    - label: स्वतंत्र और प्रसन्न
      bin: चिड़िया का गुण
      clue: कवि उसके किस रूप पर मुग्ध हैं?
      why: उसकी आज़ादी और प्रसन्नता गुण हैं।
  lesson:
    - teach: '''चिड़िया'' आरसी प्रसाद सिंह की कविता है। इसमें एक छोटी चिड़िया के जीवन का चित्र है: वह सुबह-सवेरे चहचहाती है, खुले आकाश में उड़ती है और दाना चुगती है।'
      check:
        prompt: चिड़िया अपना दिन कैसे शुरू करती है?
        options:
        - चहचहाकर
        - सोकर
        - रोकर
        answer: चहचहाकर
        why: सुबह-सवेरे उसकी मीठी आवाज़ सुनाई देती है।
    - teach: वह तिनके जोड़-जोड़कर घोंसला बनाती है और अपने बच्चों की देखभाल करती है। वह छोटी है, पर फुर्तीली, मेहनती और हमेशा खुश रहती है।
      picture:
        kind: flow
        steps:
        - सुबह चहचहाना
        - खुले आकाश में उड़ना
        - दाना चुगना
        - तिनकों से घोंसला बनाना
        - बच्चों की देखभाल
        alt: चिड़िया का एक दिन।
      check:
        prompt: घोंसला बनाना चिड़िया का कौन-सा गुण दिखाता है?
        options:
        - मेहनत
        - आलस
        - डर
        answer: मेहनत
        why: एक-एक तिनका जोड़ना मेहनत का काम है।
    - teach: 'कवि उसकी मीठी आवाज़ और आज़ादी पर मुग्ध हैं। संदेश: सरल जीवन, परिश्रम, स्वतंत्रता और प्रसन्नता का महत्व है; छोटे जीवों से प्रेम करें और उन्हें पिंजरे में बंद न करें।'
      check:
        prompt: कविता के अनुसार पक्षियों के साथ हमें क्या करना चाहिए?
        options:
        - उन्हें आज़ाद रहने देना
        - पिंजरे में बंद करना
        - उनके घोंसले तोड़ना
        answer: उन्हें आज़ाद रहने देना
        why: खुले आकाश में उड़ना ही उनका सुख है।
