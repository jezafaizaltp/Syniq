    - मीठी आवाज़।
    - सुबह की पहचान।
    solution: "कविता में चिड़िया सुबह-सवेरे चहचहाती है और दिन की शुरुआत करती है।"
    mistakes: {"सोती रहती है": "h7_chahchahana"}
  - prompt: कविता में चिड़िया का कौन-सा गुण दिखाया गया है?
