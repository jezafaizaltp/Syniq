# CBSE Class 7 Hindi (NCERT Malhar, 2024), chapter 1. Format: content/README.md.
# Written from memory and study notes, not from the printed book. Hindi wording by Claude, not yet checked by a Hindi teacher.
subject: cbse7-hin
chapter: 1
title: माँ, कह एक कहानी (कविता)
tips:
  hin7_read_again: 'पाठ को एक बार फिर पढ़ें। उत्तर पाठ में ही है: उस पात्र या घटना वाला हिस्सा खोजें।'
  hin7_poem_meaning: 'कविता की बात के पीछे का भाव समझें: यह चित्र जीवन की किस बात की ओर इशारा करता है?'
  hin7_whole: 'पूरे पाठ के बारे में सोचें, केवल एक पंक्ति के बारे में नहीं: शुरुआत से अंत तक क्या बदलता है?'
  h7_hans: "यह कहानी सिद्धार्थ और देवदत्त की है। घायल पक्षी सफ़ेद और जल में तैरने वाला था।"
  h7_samvad: "कविता में बेटा कहानी माँगता है और माँ सुनाती है। यह कैसा रूप है?"
  h7_shikari: "शिकारी ने हंस नहीं पाला था। उसने उसके साथ क्या किया था?"
concepts:
- code: cbse7h.m1.kahani
  title: माँ, कह एक कहानी (कविता)
  notes: |
    कवि: मैथिलीशरण गुप्त (राष्ट्रकवि)। कविता संवाद के रूप में है: बालक राहुल माँ यशोधरा से कहानी सुनाने को कहता है।
    माँ एक राजकुमार की कहानी सुनाती है जो उपवन में घूम रहा था। एक शिकारी के तीर से घायल हंस उसके पास गिरा। राजकुमार ने
    हंस को उठाकर उसका उपचार किया। शिकारी हंस माँगने आया: "मैंने मारा, हंस मेरा है।" राजकुमार ने कहा: "मैंने बचाया, हंस
    मेरा है।" बात न्यायालय तक गई। माँ बेटे से पूछती है कि न्याय क्या है; बेटा कहता है कि बचाने वाला ही सच्चा अधिकारी है।
    संदेश: मारने वाले से बचाने वाला बड़ा है; दया और करुणा ही न्याय है।
  explanations:
    text: 'इस कविता में माँ अपने बेटे को एक घायल हंस की कहानी सुनाती है। शिकारी ने हंस को तीर मारा, राजकुमार ने उसे बचाया। दोनों ने हंस पर अधिकार जताया। सवाल है: हंस किसका? उत्तर: बचाने वाले का, क्योंकि दया ही न्याय है।'
    visual: 'कल्पना कीजिए: एक सफ़ेद हंस, पंख में तीर, एक ओर धनुष लिए शिकारी, दूसरी ओर हंस को गोद में लिए राजकुमार। बीच में एक तराज़ू: किसका पलड़ा भारी है?'
    step_by_step: '1. पात्र पहचानें: माँ, बेटा, राजकुमार, शिकारी, हंस। 2. घटना समझें: तीर, घायल हंस, उपचार। 3. झगड़ा देखें: ''मैंने मारा'' बनाम ''मैंने बचाया''। 4. न्याय सोचें: बचाने वाले का अधिकार। 5. संदेश लिखें: करुणा।'
    real_world: सड़क पर घायल कुत्ते या पक्षी को देखकर पानी देना या पशु-चिकित्सक को बुलाना वही करुणा है जो कविता के राजकुमार ने दिखाई।
  picture:
    kind: flow
    steps:
    - हंस को तीर लगा
    - राजकुमार ने बचाया
    - शिकारी ने हंस माँगा
    - न्याय का प्रश्न
    - बचाने वाला अधिकारी
    alt: 'कहानी के चरण: हंस घायल हुआ, राजकुमार ने बचाया, शिकारी ने माँगा, न्याय का प्रश्न उठा और बचाने वाले को अधिकारी माना गया।'
  activity:
    type: order
    prompt: माँ की सुनाई कहानी क्रम से लगाओ।
    steps:
    - राजकुमार उपवन में घूम रहा था
    - शिकारी के तीर से घायल हंस गिरा
    - राजकुमार ने हंस का उपचार किया
    - 'शिकारी आया: "मैंने मारा, हंस मेरा है"'
    - बात न्यायालय तक गई
    reasons:
      शिकारी के तीर से घायल हंस गिरा: 'हंस राजकुमार के पास गिरा: राजकुमार पहले से उपवन में था।'
      राजकुमार ने हंस का उपचार किया: उपचार घायल होने के बाद ही।
      'शिकारी आया: "मैंने मारा, हंस मेरा है"': शिकारी अपना शिकार माँगने बाद में आया।
      बात न्यायालय तक गई: दोनों के दावे टकराए, तभी न्याय की बात उठी।
  items:
  - prompt: '''माँ, कह एक कहानी'' कविता के कवि कौन हैं?'
    options:
    - मैथिलीशरण गुप्त
    - कबीर
    - सूरदास
    - हरिऔध
    answer: मैथिलीशरण गुप्त
    difficulty: 1
    hints:
    - इन्हें 'राष्ट्रकवि' कहा जाता है।
    - '''साकेत'' और ''यशोधरा'' के रचयिता।'
    solution: कविता मैथिलीशरण गुप्त की है।
    mistakes:
      हरिऔध: hin7_read_again
  - prompt: कहानी में घायल होने वाला पक्षी कौन है?
    options:
    - हंस
    - तोता
    - मोर
    - कबूतर
    answer: हंस
    difficulty: 1
    hints:
    - सफ़ेद, सुंदर, पानी का पक्षी।
    - शिकारी के तीर से गिरा।
    solution: शिकारी के तीर से एक हंस घायल हुआ था।
    mistakes: {"कबूतर": "h7_hans"}
  - prompt: घायल हंस की सहायता किसने की?
    options:
    - राजकुमार ने
    - शिकारी ने
    - माली ने
    - राजा ने
    answer: राजकुमार ने
    difficulty: 1
    hints:
    - जो उपवन में घूम रहा था।
    - उसने उपचार किया।
    solution: राजकुमार ने हंस को उठाकर उसका उपचार किया।
    mistakes:
      शिकारी ने: hin7_read_again
  - prompt: कविता किस रूप में लिखी गई है?
    options:
    - माँ और बेटे के संवाद के रूप में
    - पत्र के रूप में
    - डायरी के रूप में
    - समाचार के रूप में
    answer: माँ और बेटे के संवाद के रूप में
    difficulty: 1
    hints:
    - बेटा पूछता है, माँ उत्तर देती है।
    - बातचीत।
    solution: कविता माँ और बेटे की बातचीत के रूप में है।
    mistakes: {"पत्र के रूप में": "h7_samvad"}
  - prompt: शिकारी हंस पर अपना अधिकार क्यों बताता है?
    options:
    - क्योंकि उसने हंस को तीर मारा था
    - क्योंकि उसने हंस पाला था
    - क्योंकि उसने हंस खरीदा था
    - क्योंकि हंस उसके घर आया था
    answer: क्योंकि उसने हंस को तीर मारा था
    difficulty: 2
    hints:
    - 'उसका तर्क: ''मैंने मारा…'''
    - शिकार के कारण।
    solution: शिकारी का तर्क था कि हंस को उसने मारा, इसलिए हंस उसका है।
    mistakes: {"क्योंकि उसने हंस पाला था": "h7_shikari"}
  - prompt: कविता के अनुसार हंस पर सच्चा अधिकार किसका है, और क्यों?
    options:
    - बचाने वाले का, क्योंकि करुणा मारने से बड़ी है
    - शिकारी का, क्योंकि तीर उसका था
    - किसी का नहीं, क्योंकि हंस उड़ गया
    - राजा का, क्योंकि उपवन राजा का था
    answer: बचाने वाले का, क्योंकि करुणा मारने से बड़ी है
    difficulty: 2
    hints:
    - न्याय में दया का स्थान।
    - '''मारने वाले से बचाने वाला बड़ा।'''
    solution: 'कविता का निर्णय: रक्षक का अधिकार भक्षक से बड़ा है; दया ही सच्चा न्याय है।'
    mistakes:
      शिकारी का, क्योंकि तीर उसका था: hin7_poem_meaning
