subject: cbse7-hin
chapter: 6
title: गिरिधर कविराय की कुंडलियाँ
tips:
  h7_bina_vichare: "'बिना बिचारे' यानी बिना सोचे। 'पाछे पछिताय' यानी बाद में पछताना।"
  h7_kundali: "'कुंडली' गोल घेरे जैसी होती है। जहाँ से शुरू हो, वहीं लौट आए।"
  h7_lathi: "पुराने समय में यात्रा में नदी, कुत्ते और ऊबड़-खाबड़ रास्ते आते थे। लाठी इनमें कैसे काम आती?"

concepts:
- code: cbse7h.m6.kundali
  title: गिरिधर कविराय की कुंडलियाँ
  notes: |
    कवि: गिरिधर कविराय (लगभग 18वीं सदी)। उनकी कुंडलियाँ रोज़ के जीवन की व्यावहारिक सीख देती हैं।
    कुंडलिया छंद: छह पंक्तियाँ (एक दोहा + एक रोला); जिस शब्द से शुरू होता है, उसी पर समाप्त होता है, जैसे साँप कुंडली मारकर बैठा हो।
    प्रसिद्ध सीखें: "बिना बिचारे जो करै, सो पाछे पछिताय" (बिना सोचे काम करने वाला बाद में पछताता है);
    "लाठी में गुन बहुत हैं, सदा राखिए संग" (लाठी नदी-नाले, कुत्ते और रास्ते में सहारा देती है);
    "गुन के गाहक सहस नर, बिन गुन लहै न कोय" (गुणों के हज़ारों ग्राहक हैं, गुणहीन को कोई नहीं पूछता: कौआ और कोयल दोनों काले, पर मीठी बोली के कारण कोयल प्रिय)।
    (पाठ में कौन-सी कुंडलियाँ हैं, इसका मिलान छपी पुस्तक से बाकी।)
  explanations:
    text: 'गिरिधर कविराय की कुंडलियाँ छोटी-छोटी कविताएँ हैं जो जीवन की काम की बातें सिखाती हैं: बिना सोचे काम मत करो, गुणी बनो, उपयोगी चीज़ों का मूल्य समझो। कुंडलिया जिस शब्द से शुरू होती है, उसी पर खत्म होती है।'
    visual: 'कल्पना कीजिए: एक साँप कुंडली मारकर बैठा है, उसका सिर और पूँछ एक जगह मिलते हैं। कुंडलिया भी ऐसी ही है: पहला और आखिरी शब्द एक।'
    step_by_step: '1. कवि और छंद पहचानें: गिरिधर, कुंडलिया। 2. छंद की पहचान: छह पंक्तियाँ, पहला-आखिरी शब्द एक। 3. हर कुंडली की सीख एक वाक्य में लिखें। 4. उदाहरण से जोड़ें: कोयल-कौआ, लाठी। 5. अपने जीवन से उदाहरण सोचें।'
    real_world: 'गुस्से में किसी दोस्त को कड़वा संदेश भेजकर बाद में पछताना: ''बिना बिचारे जो करै, सो पाछे पछिताय'' आज भी उतना ही सच है।'
  picture:
    kind: compare
    columns:
    - title: कुंडलिया की पहचान
      points:
      - छह पंक्तियाँ
      - दोहा + रोला
      - पहला और आखिरी शब्द एक
    - title: मुख्य सीखें
      points:
      - सोचकर काम करो
      - गुणों का आदर होता है
      - उपयोगी चीज़ें साथ रखो
    alt: कुंडलिया में छह पंक्तियाँ होती हैं (दोहा और रोला) और पहला-आखिरी शब्द एक होता है; सीखें हैं सोचकर काम करना, गुणी बनना, उपयोगी चीज़ें साथ रखना।
  activity:
    type: sort
    prompt: गिरिधर कविराय की कौन-सी सीख किस बारे में है?
    bins:
    - सोच-समझकर काम
    - लाठी के गुण
    - गुण की कद्र
    items:
    - label: बिना बिचारे जो करै, सो पाछे पछिताय
      bin: सोच-समझकर काम
      clue: बिना सोचे काम करने का नतीजा?
      why: बाद में पछतावा।
    - label: लाठी नदी-नाले में सहारा देती है
      bin: लाठी के गुण
      clue: '''लाठी में गुन बहुत हैं'' किसकी कुंडली?'
      why: लाठी के गुणों की कुंडली।
    - label: लाठी कुत्ते से बचाती है
      bin: लाठी के गुण
      clue: रास्ते में लाठी और किस काम आती है?
      why: लाठी का एक और गुण।
    - label: कौआ-कोयल दोनों काले, कोयल प्रिय
      bin: गुण की कद्र
      clue: कोयल को सब क्यों चाहते हैं?
      why: मीठी बोली का गुण।
    - label: गुन के गाहक सहस नर
      bin: गुण की कद्र
      clue: गुणहीन को कौन पूछता है?
      why: गुणों के हज़ारों ग्राहक हैं।
  items:
  - prompt: कुंडलिया छंद में कितनी पंक्तियाँ होती हैं?
    options:
    - छह
    - दो
    - चार
    - आठ
    answer: छह
    difficulty: 1
    hints:
    - दोहा (2) + रोला (4)।
    - 2 + 4।
    solution: 'कुंडलिया में छह पंक्तियाँ होती हैं: एक दोहा और एक रोला।'
    mistakes:
      दो: hin7_read_again
  - prompt: कुंडलिया की खास पहचान क्या है?
    options:
    - जिस शब्द से शुरू होती है, उसी पर समाप्त होती है
    - इसमें केवल एक पंक्ति होती है
    - यह गद्य में लिखी जाती है
    - इसमें तुक नहीं होती
    answer: जिस शब्द से शुरू होती है, उसी पर समाप्त होती है
    difficulty: 1
    hints:
    - कुंडली मारे साँप जैसी।
    - सिर और पूँछ मिलते हैं।
    solution: कुंडलिया का पहला और आखिरी शब्द एक ही होता है।
    mistakes: {"इसमें केवल एक पंक्ति होती है": "h7_kundali"}
  - prompt: '''बिना बिचारे जो करै, सो पाछे पछिताय'' का अर्थ है:'
    options:
    - बिना सोचे काम करने वाला बाद में पछताता है
    - सोचने वाला हमेशा हारता है
    - पछताना अच्छी बात है
    - काम कभी नहीं करना चाहिए
    answer: बिना सोचे काम करने वाला बाद में पछताता है
    difficulty: 1
    hints:
    - बिचारे = विचार किए।
    - पाछे = बाद में।
    solution: जो बिना विचार किए काम करता है, उसे बाद में पछताना पड़ता है।
    mistakes: {"सोचने वाला हमेशा हारता है": "h7_bina_vichare"}
  - prompt: कवि लाठी को साथ रखने की सलाह क्यों देते हैं?
    options:
    - क्योंकि यह रास्ते में सहारा और रक्षा दोनों देती है
    - क्योंकि यह सुंदर दिखती है
    - क्योंकि यह महँगी है
    - क्योंकि इससे खेल खेलते हैं
    answer: क्योंकि यह रास्ते में सहारा और रक्षा दोनों देती है
    difficulty: 2
    hints:
    - '''लाठी में गुन बहुत हैं''।'
    - नदी-नाले, कुत्ते।
    solution: लाठी नदी-नाला पार करने में सहारा और जानवरों से रक्षा करती है।
    mistakes: {"क्योंकि यह सुंदर दिखती है": "h7_lathi"}
  - prompt: कोयल और कौआ दोनों काले हैं, फिर भी कोयल सबको प्रिय क्यों है?
    options:
    - उसकी मीठी बोली के गुण के कारण
    - उसके बड़े आकार के कारण
    - क्योंकि वह कम दिखती है
    - क्योंकि वह पेड़ पर रहती है
    answer: उसकी मीठी बोली के गुण के कारण
    difficulty: 2
    hints:
    - रंग एक, अंतर किसका?
    - '''गुन के गाहक सहस नर''।'
    solution: रंग एक-सा है, पर कोयल की मीठी बोली उसका गुण है, इसलिए वह प्रिय है।
    mistakes:
      उसके बड़े आकार के कारण: hin7_poem_meaning
  - prompt: गिरिधर कविराय की कुंडलियों की मुख्य विशेषता क्या है?
    options:
    - रोज़ के जीवन की व्यावहारिक सीख
    - युद्ध का वर्णन
    - विज्ञान के नियम
    - विदेश यात्रा की कहानी
    answer: रोज़ के जीवन की व्यावहारिक सीख
    difficulty: 2
    hints:
    - लाठी, कोयल, सोच-विचार।
    - जीवन में काम आने वाली बातें।
    solution: उनकी कुंडलियाँ सरल भाषा में जीवन की व्यावहारिक सीख देती हैं।
    mistakes:
      युद्ध का वर्णन: hin7_whole
