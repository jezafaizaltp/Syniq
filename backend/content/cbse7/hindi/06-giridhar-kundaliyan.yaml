subject: cbse7-hin
chapter: 6
title: गिरिधर कविराय की कुंडलियाँ
tips:
  h7_bina_vichare: "'बिना बिचारे' यानी बिना सोचे। 'पाछे पछिताय' यानी बाद में पछताना।"
  h7_kundali: "'कुंडली' गोल घेरे जैसी होती है। जहाँ से शुरू हो, वहीं लौट आए।"
  h7_lathi: "पुराने समय में यात्रा में नदी, कुत्ते और ऊबड़-खाबड़ रास्ते आते थे। लाठी इनमें कैसे काम आती?"
  c7h6_chhand: इस छंद की पहचान उसकी पंक्तियों की गिनती और उसके आरंभ और अंत के शब्द से होती है। साँप की कुंडली की तस्वीर सोचो।
  c7h6_seekh: हर कुंडली रोज़ के जीवन की एक व्यावहारिक सीख देती है। पहले पंक्ति का सीधा अर्थ समझो, फिर सीख।
  c7h6_guna: दो चीज़ें बाहर से एक जैसी हों तो भी लोग उनके गुण से ही उन्हें पसंद या नापसंद करते हैं।
  c7h6_shabd: 'पुराने शब्दों को आज की हिंदी में बोलकर देखो: पाछे, करै, गुन, सहस। फिर अर्थ चुनो।'
  c7h6_ganit: पहले लिखो कि जोड़ना है, घटाना है या गुणा करना है, फिर हल करो।

concepts:
- code: cbse7h.m6.kundali
  title: गिरिधर कविराय की कुंडलियाँ
  notes: |
    कवि: गिरिधर कविराय (लगभग 18वीं सदी)। उनकी कुंडलियाँ रोज़ के जीवन की व्यावहारिक सीख देती हैं।
    कुंडलिया छंद: छह पंक्तियाँ (एक दोहा + एक रोला); जिस शब्द से शुरू होता है, उसी पर समाप्त होता है, जैसे साँप कुंडली मारकर बैठा हो।
    प्रसिद्ध सीखें: "बिना बिचारे जो करै, सो पाछे पछिताय" (बिना सोचे काम करने वाला बाद में पछताता है);
    "लाठी में गुन बहुत हैं, सदा राखिए संग" (लाठी नदी-नाले, कुत्ते और रास्ते में सहारा देती है);
    "गुन के गाहक सहस नर, बिन गुन लहै न कोय" (गुणों के हज़ारों ग्राहक हैं, गुणहीन को कोई नहीं पूछता: कौआ और कोयल दोनों काले, पर मीठी बोली के कारण कोयल प्रिय)।
    (पाठ में कौन-सी कुंडलियाँ हैं, इसका मिलान छपी पुस्तक से बाकी।)
  explanations:
    text: 'गिरिधर कविराय की कुंडलियाँ छोटी-छोटी कविताएँ हैं जो जीवन की काम की बातें सिखाती हैं: बिना सोचे काम मत करो, गुणी बनो, उपयोगी चीज़ों का मूल्य समझो। कुंडलिया जिस शब्द से शुरू होती है, उसी पर खत्म होती है।'
    visual: 'कल्पना कीजिए: एक साँप कुंडली मारकर बैठा है, उसका सिर और पूँछ एक जगह मिलते हैं। कुंडलिया भी ऐसी ही है: पहला और आखिरी शब्द एक।'
    step_by_step: '1. कवि और छंद पहचानें: गिरिधर, कुंडलिया। 2. छंद की पहचान: छह पंक्तियाँ, पहला-आखिरी शब्द एक। 3. हर कुंडली की सीख एक वाक्य में लिखें। 4. उदाहरण से जोड़ें: कोयल-कौआ, लाठी। 5. अपने जीवन से उदाहरण सोचें।'
    real_world: 'गुस्से में किसी दोस्त को कड़वा संदेश भेजकर बाद में पछताना: ''बिना बिचारे जो करै, सो पाछे पछिताय'' आज भी उतना ही सच है।'
  picture:
    kind: compare
    columns:
    - title: कुंडलिया की पहचान
      points:
      - छह पंक्तियाँ
      - दोहा + रोला
      - पहला और आखिरी शब्द एक
    - title: मुख्य सीखें
      points:
      - सोचकर काम करो
      - गुणों का आदर होता है
      - उपयोगी चीज़ें साथ रखो
    alt: कुंडलिया में छह पंक्तियाँ होती हैं (दोहा और रोला) और पहला-आखिरी शब्द एक होता है; सीखें हैं सोचकर काम करना, गुणी बनना, उपयोगी चीज़ें साथ रखना।
  activity:
    type: sort
    prompt: गिरिधर कविराय की कौन-सी सीख किस बारे में है?
    bins:
    - सोच-समझकर काम
    - लाठी के गुण
    - गुण की कद्र
    items:
    - label: बिना बिचारे जो करै, सो पाछे पछिताय
      bin: सोच-समझकर काम
      clue: बिना सोचे काम करने का नतीजा?
      why: बाद में पछतावा।
    - label: लाठी नदी-नाले में सहारा देती है
      bin: लाठी के गुण
      clue: '''लाठी में गुन बहुत हैं'' किसकी कुंडली?'
      why: लाठी के गुणों की कुंडली।
    - label: लाठी कुत्ते से बचाती है
      bin: लाठी के गुण
      clue: रास्ते में लाठी और किस काम आती है?
      why: लाठी का एक और गुण।
    - label: कौआ-कोयल दोनों काले, कोयल प्रिय
      bin: गुण की कद्र
      clue: कोयल को सब क्यों चाहते हैं?
      why: मीठी बोली का गुण।
    - label: गुन के गाहक सहस नर
      bin: गुण की कद्र
      clue: गुणहीन को कौन पूछता है?
      why: गुणों के हज़ारों ग्राहक हैं।
  lesson:
    - teach: गिरिधर कविराय (लगभग 18वीं सदी) अपनी कुंडलियों के लिए प्रसिद्ध हैं। उनकी कुंडलियाँ रोज़ के जीवन की व्यावहारिक सीख देती हैं, सरल भाषा में।
      check:
        prompt: गिरिधर कविराय की कुंडलियाँ मुख्य रूप से क्या देती हैं?
        options:
        - रोज़ के जीवन की व्यावहारिक सीख
        - युद्ध का वर्णन
        - विज्ञान के सूत्र
        answer: रोज़ के जीवन की व्यावहारिक सीख
        why: वे साधारण जीवन के अनुभवों से सीख देते हैं।
    - teach: 'कुंडलिया छंद में छह पंक्तियाँ होती हैं: पहले एक दोहा (2 पंक्तियाँ), फिर एक रोला (4 पंक्तियाँ)। जिस शब्द से कुंडली शुरू होती है, उसी पर समाप्त होती है, जैसे साँप कुंडली मारकर बैठा हो।'
      picture:
        kind: flow
        steps:
        - 'दोहा: 2 पंक्तियाँ'
        - 'रोला: 4 पंक्तियाँ'
        - कुल 6 पंक्तियाँ
        - पहला और आख़िरी शब्द एक
        alt: कुंडलिया छंद की बनावट।
      check:
        prompt: कुंडलिया में दोहे के बाद कौन-सा छंद आता है?
        options:
        - रोला
        - चौपाई
        - सोरठा
        answer: रोला
        why: दोहा + रोला मिलकर कुंडलिया बनती है।
    - teach: 'प्रसिद्ध सीखें: ''बिना बिचारे जो करै, सो पाछे पछिताय'' (बिना सोचे काम करने वाला बाद में पछताता है)। ''लाठी में गुन बहुत हैं'' (लाठी रास्ते में सहारा और रक्षा देती है)। गुणवान को सब पूछते हैं: कौआ और कोयल दोनों काले हैं, पर मीठी बोली के कारण कोयल सबको प्यारी है।'
      check:
        prompt: कोयल सबको क्यों प्यारी है?
