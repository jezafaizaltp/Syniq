subject: cbse7-hin
chapter: 10
title: मीरा के पद
tips:
  h7_girdhar: "रघुनंदन राम का नाम है। कृष्ण ने एक पर्वत उठाया था, उससे जुड़ा नाम सोचो।"
  h7_meera_rajya: "मीरा मेवाड़ के राजघराने की बहू थीं।"
  h7_pad: "मीरा के पद आज भी भजन की तरह गाए जाते हैं।"

concepts:
- code: cbse7h.m10.meera
  title: मीरा के पद
  notes: |
    कवयित्री: मीराबाई (लगभग 16वीं सदी), राजस्थान की संत कवयित्री, भक्ति काल की कृष्ण-भक्त। भाषा: राजस्थानी मिली ब्रजभाषा।
    'पद' गाए जाने वाले भक्ति-गीत हैं। मीरा कृष्ण को 'गिरधर गोपाल' कहती हैं और उन्हें ही अपना सब कुछ मानती हैं: "मेरे तो
    गिरधर गोपाल, दूसरो न कोई।" उन्होंने लोक-लाज और राजमहल के सुख छोड़कर भक्ति, भजन और साधु-संगति को चुना।
    पदों में कृष्ण के प्रति गहरा प्रेम, समर्पण और विरह (मिलने की तड़प) दिखती है।
    संदेश: सच्ची भक्ति प्रेम और समर्पण से होती है; अपने विश्वास पर दृढ़ रहें।
    (पाठ में कौन-से पद हैं, इसका मिलान छपी पुस्तक से बाकी।)
  explanations:
    text: मीराबाई कृष्ण की भक्त थीं। उनके पद गाए जाने वाले गीत हैं जिनमें वे कृष्ण को 'गिरधर गोपाल' कहकर अपना सब कुछ मानती हैं। उन्होंने महल के सुख छोड़कर भक्ति का रास्ता चुना और अपने विश्वास पर अडिग रहीं।
    visual: 'कल्पना कीजिए: हाथ में इकतारा लिए, कृष्ण की मूर्ति के सामने गाती और नाचती मीरा, पीछे राजमहल जिसे वे छोड़ आई हैं।'
    step_by_step: '1. कवयित्री और काल पहचानें: मीराबाई, भक्ति काल। 2. आराध्य पहचानें: कृष्ण (गिरधर गोपाल)। 3. ''पद'' का अर्थ समझें: गाने योग्य भक्ति-गीत। 4. भाव खोजें: प्रेम, समर्पण, विरह। 5. संदेश लिखें: दृढ़ भक्ति।'
    real_world: आज भी मंदिरों और भजन-संध्याओं में मीरा के पद गाए जाते हैं; 'पायो जी मैंने राम रतन धन पायो' जैसे भजन बहुत लोग जानते हैं।
  picture:
    kind: compare
    columns:
    - title: मीरा ने छोड़ा
      points:
      - राजमहल के सुख
      - लोक-लाज की चिंता
      - दुनिया का डर
    - title: मीरा ने चुना
      points:
      - कृष्ण-भक्ति
      - भजन और कीर्तन
      - साधु-संगति
    alt: मीरा ने राजमहल के सुख, लोक-लाज और दुनिया का डर छोड़ा; उन्होंने कृष्ण-भक्ति, भजन और साधु-संगति चुनी।
  activity:
    type: sort
    prompt: मीरा ने क्या चुना और क्या छोड़ा?
    bins:
    - चुना
    - छोड़ा
    items:
    - label: गिरधर गोपाल, दूसरो न कोई
      bin: चुना
      clue: मीरा किसे अपना सब कुछ मानती हैं?
      why: मीरा ने केवल कृष्ण को चुना।
    - label: भजन और साधु-संगति
      bin: चुना
      clue: महल के बदले मीरा कहाँ रहीं?
      why: भक्ति का जीवन चुना।
    - label: राजमहल के सुख
      bin: छोड़ा
      clue: रानी होकर भी मीरा ने क्या त्यागा?
      why: महल के सुख छोड़े।
    - label: लोक-लाज
      bin: छोड़ा
      clue: 'लोग क्या कहेंगे: क्या मीरा को इसकी परवाह थी?'
      why: लोक-लाज छोड़कर भक्ति की।
  items:
  - prompt: मीराबाई किसकी भक्त थीं?
    options:
    - श्रीकृष्ण की
    - शिव की
    - गणेश की
    - हनुमान की
    answer: श्रीकृष्ण की
    difficulty: 1
    hints:
    - '''गिरधर गोपाल''।'
    - गोवर्धन पर्वत उठाने वाले।
    solution: मीराबाई श्रीकृष्ण की भक्त थीं।
    mistakes:
      शिव की: hin7_read_again
  - prompt: मीरा कृष्ण को किस नाम से पुकारती हैं?
    options:
    - गिरधर गोपाल
    - रघुनंदन
    - भोलेनाथ
    - गजानन
    answer: गिरधर गोपाल
    difficulty: 1
    hints:
    - गिरि (पर्वत) को धारण करने वाले।
    - '''मेरे तो … दूसरो न कोई''।'
    solution: मीरा कृष्ण को 'गिरधर गोपाल' कहती हैं।
    mistakes: {"रघुनंदन": "h7_girdhar"}
  - prompt: '''पद'' किसे कहते हैं?'
    options:
    - गाए जाने वाले भक्ति-गीत
    - लंबी कहानी
    - नाटक
    - पत्र
    answer: गाए जाने वाले भक्ति-गीत
    difficulty: 1
    hints:
    - भजन की तरह।
    - संगीत के साथ।
    solution: पद गाने योग्य छोटे भक्ति-गीत होते हैं।
    mistakes: {"लंबी कहानी": "h7_pad"}
  - prompt: मीराबाई किस राज्य से जुड़ी थीं?
    options:
    - राजस्थान
    - केरल
    - बंगाल
    - पंजाब
    answer: राजस्थान
    difficulty: 1
    hints:
    - रेगिस्तान वाला राज्य।
    - मेवाड़।
    solution: मीराबाई राजस्थान की संत कवयित्री थीं।
    mistakes: {"पंजाब": "h7_meera_rajya"}
  - prompt: '''मेरे तो गिरधर गोपाल, दूसरो न कोई'' का भाव क्या है?'
    options:
    - 'कृष्ण के प्रति पूरा समर्पण: उनके सिवा कोई अपना नहीं'
    - मीरा के बहुत सारे मित्र थे
    - मीरा को कोई पसंद नहीं था
    - गोपाल एक ग्वाला था
    answer: 'कृष्ण के प्रति पूरा समर्पण: उनके सिवा कोई अपना नहीं'
    difficulty: 2
    hints:
    - '''दूसरो न कोई''।'
    - एकनिष्ठ भक्ति।
    solution: 'मीरा कहती हैं कि कृष्ण के सिवा उनका कोई नहीं: यह पूर्ण समर्पण है।'
    mistakes:
      मीरा को कोई पसंद नहीं था: hin7_poem_meaning
  - prompt: मीरा के पदों से कौन-सी सीख मिलती है?
    options:
    - सच्ची भक्ति प्रेम और समर्पण से होती है, और अपने विश्वास पर दृढ़ रहना चाहिए
    - धन ही सबसे बड़ा सुख है
    - लोग जो कहें वही करना चाहिए
    - गाना-बजाना व्यर्थ है
    answer: सच्ची भक्ति प्रेम और समर्पण से होती है, और अपने विश्वास पर दृढ़ रहना चाहिए
    difficulty: 2
    hints:
    - मीरा ने लोक-लाज की परवाह नहीं की।
    - दृढ़ता।
    solution: 'मीरा ने कठिनाइयों के बीच भी भक्ति नहीं छोड़ी: प्रेम, समर्पण और दृढ़ता की सीख।'
    mistakes:
      लोग जो कहें वही करना चाहिए: hin7_whole
