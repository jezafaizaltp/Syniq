          - भजन
          - साधु-संगति
        alt: मीरा ने क्या छोड़ा और क्या अपनाया।
      check:
        prompt: '''विरह'' का अर्थ है:'
        options:
        - प्रिय से दूर होने का दुख
        - मिलने की खुशी
        - क्रोध
        answer: प्रिय से दूर होने का दुख
        why: विरह में मिलन की तड़प होती है।
