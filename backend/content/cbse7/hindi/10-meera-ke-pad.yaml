      why: मीरा ने केवल कृष्ण को चुना।
    - label: भजन और साधु-संगति
      bin: चुना
      clue: महल के बदले मीरा कहाँ रहीं?
      why: भक्ति का जीवन चुना।
    - label: राजमहल के सुख
      bin: छोड़ा
      clue: रानी होकर भी मीरा ने क्या त्यागा?
      why: महल के सुख छोड़े।
    - label: लोक-लाज
      bin: छोड़ा
      clue: 'लोग क्या कहेंगे: क्या मीरा को इसकी परवाह थी?'
      why: लोक-लाज छोड़कर भक्ति की।
  lesson:
    - teach: मीराबाई (लगभग 16वीं सदी) राजस्थान की संत कवयित्री थीं। वे भक्ति काल की कृष्ण-भक्त थीं। उनकी भाषा राजस्थानी मिली ब्रजभाषा है। उनके 'पद' गाए जाने वाले भक्ति-गीत हैं।
      check:
        prompt: मीराबाई के पद किस प्रकार की रचनाएँ हैं?
        options:
        - गाए जाने वाले भक्ति-गीत
        - कहानियाँ
        - नाटक
        answer: गाए जाने वाले भक्ति-गीत
        why: पद भजन की तरह गाए जाते हैं।
    - teach: 'मीरा कृष्ण को ''गिरधर गोपाल'' कहती हैं और उन्हें ही अपना सब कुछ मानती हैं: ''मेरे तो गिरधर गोपाल, दूसरो न कोई।'' गिरधर का अर्थ है पर्वत (गिरि) को धारण करने वाला: कृष्ण ने गोवर्धन पर्वत उठाया था।'
      check:
        prompt: '''गिरधर'' नाम का अर्थ क्या है?'
        options:
        - पर्वत को उठाने वाले
        - गाय चराने वाले
        - बाँसुरी बजाने वाले
        answer: पर्वत को उठाने वाले
        why: गिरि = पर्वत, धर = धारण करने वाला।
    - teach: 'मीरा ने लोक-लाज और राजमहल के सुख छोड़कर भक्ति, भजन और साधु-संगति को चुना। उनके पदों में कृष्ण के प्रति गहरा प्रेम, समर्पण और विरह (मिलने की तड़प) दिखती है। संदेश: सच्ची भक्ति प्रेम और समर्पण से होती है; अपने विश्वास पर दृढ़ रहो।'
      picture:
        kind: compare
        columns:
        - title: मीरा ने छोड़ा
          points:
