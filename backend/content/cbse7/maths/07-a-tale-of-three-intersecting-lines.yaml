# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 7. Format: content/README.md.
subject: cbse7-math
chapter: 7
title: A Tale of Three Intersecting Lines
tips:
  c7_tri_ineq: 'Check the triangle inequality: the two shorter sides must add to MORE than the longest.'
  c7_angle_sum: 'The three angles of a triangle add to 180°: subtract the two you know from 180°.'
  t7_equilateral_angle: "All three angles are equal and add to 180°."
  t7_exterior_angle: "The exterior angle equals the sum of the two opposite interior angles."
  t7_flat_triangle: "2 + 3 = 5 exactly. Can the two short sides meet above the long one, or would they lie flat?"
  t7_isosceles_base: "Take the top angle from 180°, then share the rest equally between the two base angles."
  t7_right_triangle_angles: "The angles add to 180°, and one is 90°. Take 90 and 35 away."
  t7_third_side_max: "The third side must be LESS than 9 + 4. What is the largest whole number that works?"
  t7_third_side_min: "The third side must be MORE than 9 − 4. What is the smallest whole number that works?"
  t7_triangle_inequality: "Any two sides must add to MORE than the third side. Test the two shortest."
  t7_triangle_types: "Equilateral needs all three sides equal and scalene needs all three different. What if exactly two sides match?"
  t7_two_right: "Two right angles already add to 180°. How much is left for the third angle?"
concepts:
- code: cbse7m.tri.sides
  title: Triangles and the triangle inequality
  notes: |
    A triangle is made by three lines meeting in pairs: 3 sides, 3 angles, 3 vertices. By sides: equilateral
    (all equal), isosceles (two equal), scalene (none equal). Triangle inequality: the sum of any two sides must
    be greater than the third, so 3, 4, 8 cannot make a triangle (3 + 4 < 8), but 3, 4, 5 can. Quick test: check
    that the two shorter sides add to more than the longest. A triangle with given sides can be constructed
    using a ruler and compass (draw one side, then arcs from each end).
  explanations:
    text: Three sticks make a triangle only if the two shorter ones together are longer than the longest. Otherwise they can't reach each other. Sticks of 3, 4 and 8 cm fail because 3 + 4 = 7 is less than 8.
    visual: 'Lay a stick of 8 cm on the table. Hinge sticks of 3 cm and 4 cm at its ends: even laid flat they reach only 7 cm, so their tips never meet.'
    step_by_step: 'Step 1: Order the three lengths. Step 2: Add the two shorter ones. Step 3: If the sum is greater than the longest, a triangle can be made. Step 4: Name it by its sides.'
    real_world: Bridges and roof frames use triangles because a triangle cannot change shape once its three sides are fixed.
  picture:
    kind: compare
    columns:
    - title: Makes a triangle
      points:
      - '3, 4, 5: 3 + 4 > 5'
      - '5, 5, 5: equilateral'
      - '6, 6, 4: isosceles'
    - title: Does not
      points:
      - '3, 4, 8: 3 + 4 < 8'
      - '2, 3, 5: 2 + 3 = 5'
      - '1, 1, 3: 1 + 1 < 3'
    alt: Side lengths that make a triangle (two shorter sides add to more than the longest) compared with lengths that don't.
  activity:
    type: sort
    prompt: Can these three sticks make a triangle?
    bins:
    - Makes a triangle
    - No triangle
    items:
    - label: 5, 5, 5 cm
      bin: Makes a triangle
      clue: Add the two shorter sticks. Longer than the longest?
      why: 5 + 5 = 10 > 5.
    - label: 4, 6, 9 cm
      bin: Makes a triangle
      clue: Is 4 + 6 more than 9?
      why: '10 > 9: yes.'
    - label: 7, 8, 14 cm
      bin: Makes a triangle
      clue: 7 + 8 against 14.
      why: '15 > 14: just.'
    - label: 5, 12, 13 cm
      bin: Makes a triangle
      clue: 5 + 12 against 13.
      why: 17 > 13.
    - label: 3, 4, 8 cm
      bin: No triangle
      clue: Can 3 and 4 reach across 8?
      why: 3 + 4 = 7, shorter than 8.
    - label: 2, 3, 5 cm
      bin: No triangle
      clue: 2 + 3 is exactly 5. What happens?
      why: They lie flat along the 5 cm stick.
    - label: 1, 1, 3 cm
      bin: No triangle
      clue: Can two 1 cm sticks span 3 cm?
      why: 1 + 1 = 2 < 3.
    - label: 3, 6, 10 cm
      bin: No triangle
      clue: 3 + 6 against 10.
      why: 9 < 10.
  items:
  - prompt: Can sides of 3 cm, 4 cm and 8 cm make a triangle?
    options:
    - 'No'
    - 'Yes'
    - Only a right triangle
    - Only if drawn carefully
    answer: 'No'
    difficulty: 1
    hints:
    - Add the two shorter sides.
    - 3 + 4 = 7.
    solution: 3 + 4 = 7 is less than 8, so no triangle.
    mistakes:
      'Yes': c7_tri_ineq
  - prompt: Can sides of 5 cm, 6 cm and 9 cm make a triangle?
    options:
    - 'Yes'
    - 'No'
    - Only an equilateral one
    - Cannot tell
    answer: 'Yes'
    difficulty: 1
    hints:
    - 5 + 6 = 11.
    - Is 11 > 9?
    solution: 5 + 6 = 11 > 9, so yes.
    mistakes: {"No": "t7_triangle_inequality", "Only an equilateral one": "t7_triangle_inequality"}
  - prompt: A triangle has sides 7, 7 and 4 cm. What type is it?
    options:
    - Isosceles
    - Equilateral
    - Scalene
    - Right-angled
    answer: Isosceles
    difficulty: 1
    hints:
    - Two sides are equal.
    - Not all three.
    solution: 'Two equal sides: isosceles.'
    mistakes: {"Equilateral": "t7_triangle_types", "Scalene": "t7_triangle_types"}
  - prompt: Can 2 cm, 3 cm and 5 cm make a triangle?
    options:
    - No, the sides would lie flat
    - 'Yes'
    - Yes, a right triangle
    - Yes, an isosceles triangle
    answer: No, the sides would lie flat
    difficulty: 2
    hints:
    - 2 + 3 = 5.
    - It must be greater, not equal.
    solution: 2 + 3 is equal to 5, not greater, so the sides lie on one line.
    mistakes: {"Yes": "t7_flat_triangle", "Yes, a right triangle": "t7_flat_triangle"}
  - prompt: Two sides of a triangle are 4 cm and 9 cm. The third side is a whole number of cm. What is the smallest it can be?
    answer: '6'
    check: 9 - 4 + 1
    difficulty: 3
    hints:
    - The third side must be more than 9 − 4.
    - More than 5.
    solution: The third side must be greater than 9 − 4 = 5, so at least 6 cm.
    mistakes: {"5": "t7_third_side_min", "1": "t7_third_side_min"}
  - prompt: Two sides of a triangle are 4 cm and 9 cm. The third side is a whole number of cm. What is the largest it can be?
    answer: '12'
    check: 4 + 9 - 1
    difficulty: 3
    hints:
    - It must be less than 4 + 9.
    - Less than 13.
    solution: The third side must be less than 13, so at most 12 cm.
    mistakes: {"13": "t7_third_side_max", "14": "t7_third_side_max"}
- code: cbse7m.tri.angles
  title: Angle sum and exterior angles
  after:
  - cbse7m.tri.sides
  notes: |
    The angles of any triangle add to 180° (tear off the corners and they fit on a straight line). So if two
    angles are 50° and 60°, the third is 70°. Equilateral triangles have three 60° angles; an isosceles
    triangle has two equal angles opposite the equal sides. An exterior angle (made by extending a side) equals
    the sum of the two opposite interior angles. An altitude is the perpendicular from a vertex to the opposite
    side.
  explanations:
    text: 'Tear the three corners off a paper triangle and put them side by side: they always make a straight line, 180°. So once you know two angles of a triangle, you can find the third.'
    visual: Draw triangle ABC, extend side BC beyond C to D. The outside angle at C equals angle A plus angle B, the two angles not touching it.
    step_by_step: 'Step 1: Add the two known angles. Step 2: Subtract from 180° for the third. Step 3: For an exterior angle, add the two opposite interior angles. Step 4: Check that all three interior angles add to 180°.'
    real_world: A set square has angles 30°, 60°, 90°, which add to 180°, and the other has 45°, 45°, 90°.
  picture:
    kind: geometry
    points:
      A:
      - 3
      - 8
      B:
      - 1
      - 2
      C:
      - 7
      - 2
      D:
      - 9.5
      - 2
    segments:
    - - A
      - B
    - - B
      - C
    - - C
      - A
    - - C
      - D
    angles:
    - at: A
      from: B
      to: C
      label: a
    - at: B
      from: C
      to: A
      label: b
    - at: C
      from: D
      to: A
      label: a + b
    caption: The exterior angle at C equals a + b, the two opposite interior angles.
    alt: Triangle ABC with side BC extended to D; the exterior angle at C is marked a plus b, equal to the angles at A and B.
  activity:
    type: angle
    prompt: Turn the arm to make each angle of the triangle.
    goals:
    - prompt: Two angles are 50° and 60°. Make the third.
      degrees: 70
      mistakes:
      - when:
          degrees: 110
        say: 110° is 50 + 60. The third is what's left of 180°.
      - when:
          degrees: 250
        say: That's 360° − 110°. A triangle's angles make 180°, not 360°.
    - prompt: Angles A = 45° and B = 75°. Make the exterior angle at C.
      degrees: 120
      mistakes:
      - when:
          degrees: 60
        say: 60° is the inside angle at C. The exterior angle equals A + B.
      - when:
          degrees: 240
        say: 240° goes round the wrong side. The exterior angle and C make a straight line.
    - prompt: A right triangle has one angle of 35°. Make the third.
      degrees: 55
      mistakes:
      - when:
          degrees: 145
        say: 145° is 180 − 35, forgetting the right angle. 90 + 35 = 125 is already used.
      - when:
          degrees: 35
        say: Not isosceles. 180 − 90 − 35 = ?
  items:
  - prompt: Two angles of a triangle are 50° and 60°. Find the third, in degrees.
    answer: '70'
    check: 180 - 50 - 60
    difficulty: 1
    hints:
    - Angles add to 180°.
    - 180 − 110.
    solution: 180° − 50° − 60° = 70°.
    mistakes:
      '110': c7_angle_sum
  - prompt: Each angle of an equilateral triangle measures how many degrees?
    answer: '60'
    check: 180/3
    difficulty: 1
    hints:
    - Three equal angles.
    - 180 ÷ 3.
    solution: 180° ÷ 3 = 60°.
    mistakes: {"90": "t7_equilateral_angle", "180": "t7_equilateral_angle"}
  - prompt: A right triangle has one angle of 35°. Find the other acute angle, in degrees.
    answer: '55'
    check: 180 - 90 - 35
    difficulty: 2
    hints:
    - One angle is 90°.
    - 180 − 90 − 35.
    solution: 180° − 90° − 35° = 55°.
    mistakes: {"145": "t7_right_triangle_angles", "35": "t7_right_triangle_angles"}
  - prompt: In triangle ABC, ∠A = 45° and ∠B = 65°. Find the exterior angle at C, in degrees.
    answer: '110'
    check: 45 + 65
    difficulty: 2
    hints:
    - Exterior angle = sum of opposite interior angles.
    - 45 + 65.
    solution: 45° + 65° = 110°.
    mistakes: {"70": "t7_exterior_angle", "250": "t7_exterior_angle"}
  - prompt: An isosceles triangle has a top angle of 40°. Find each of the two equal angles, in degrees.
    answer: '70'
    check: (180 - 40)/2
    difficulty: 2
    hints:
    - 180 − 40 = 140.
    - Split equally.
    solution: (180° − 40°) ÷ 2 = 70°.
    mistakes: {"140": "t7_isosceles_base", "40": "t7_isosceles_base"}
  - prompt: Can a triangle have two right angles?
    options:
    - No, they already add to 180°
    - 'Yes'
    - Only if it is isosceles
    - Only if it is large
    answer: No, they already add to 180°
    difficulty: 2
    hints:
    - 90 + 90 = ?
    - Nothing left for the third angle.
    solution: Two right angles already make 180°, leaving 0° for the third.
    mistakes: {"Yes": "t7_two_right", "Only if it is large": "t7_two_right"}
