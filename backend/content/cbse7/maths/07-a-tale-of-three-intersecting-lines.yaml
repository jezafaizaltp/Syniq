# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 7. Format: content/README.md.
subject: cbse7-math
chapter: 7
title: A Tale of Three Intersecting Lines
tips:
  c7_tri_ineq: 'Check the triangle inequality: the two shorter sides must add to MORE than the longest.'
  c7_angle_sum: 'The three angles of a triangle add to 180°: subtract the two you know from 180°.'
  t7_equilateral_angle: "All three angles are equal and add to 180°."
  t7_exterior_angle: "The exterior angle equals the sum of the two opposite interior angles."
  t7_flat_triangle: "2 + 3 = 5 exactly. Can the two short sides meet above the long one, or would they lie flat?"
  t7_isosceles_base: "Take the top angle from 180°, then share the rest equally between the two base angles."
  t7_right_triangle_angles: "The angles add to 180°, and one is 90°. Take 90 and 35 away."
  t7_third_side_max: "The third side must be LESS than 9 + 4. What is the largest whole number that works?"
  t7_third_side_min: "The third side must be MORE than 9 − 4. What is the smallest whole number that works?"
  t7_triangle_inequality: "Any two sides must add to MORE than the third side. Test the two shortest."
  t7_triangle_types: "Equilateral needs all three sides equal and scalene needs all three different. What if exactly two sides match?"
  t7_two_right: "Two right angles already add to 180°. How much is left for the third angle?"
  c7m7_two_short: Add the two shorter sides and compare with the longest. The two shorter must add to MORE than the longest.
  c7m7_kinds: 'By sides: all three equal, exactly two equal, or none equal. Count the equal sides.'
  c7m7_range: The third side must be longer than the difference of the other two and shorter than their sum.
  c7m7_sum180: The three angles of a triangle always add to 180°. Subtract the angles you know from 180°.
  c7m7_exterior: An exterior angle equals the two interior angles that are NOT next to it, added together.
  c7m7_iso_angles: In an isosceles triangle the two base angles are equal. Take the top angle from 180°, then share what is left equally.
concepts:
- code: cbse7m.tri.sides
  title: Triangles and the triangle inequality
  notes: |
    A triangle is made by three lines meeting in pairs: 3 sides, 3 angles, 3 vertices. By sides: equilateral
    (all equal), isosceles (two equal), scalene (none equal). Triangle inequality: the sum of any two sides must
    be greater than the third, so 3, 4, 8 cannot make a triangle (3 + 4 < 8), but 3, 4, 5 can. Quick test: check
    that the two shorter sides add to more than the longest. A triangle with given sides can be constructed
    using a ruler and compass (draw one side, then arcs from each end).
  explanations:
    text: Three sticks make a triangle only if the two shorter ones together are longer than the longest. Otherwise they can't reach each other. Sticks of 3, 4 and 8 cm fail because 3 + 4 = 7 is less than 8.
    visual: 'Lay a stick of 8 cm on the table. Hinge sticks of 3 cm and 4 cm at its ends: even laid flat they reach only 7 cm, so their tips never meet.'
    step_by_step: 'Step 1: Order the three lengths. Step 2: Add the two shorter ones. Step 3: If the sum is greater than the longest, a triangle can be made. Step 4: Name it by its sides.'
    real_world: Bridges and roof frames use triangles because a triangle cannot change shape once its three sides are fixed.
  picture:
    kind: compare
    columns:
    - title: Makes a triangle
      points:
      - '3, 4, 5: 3 + 4 > 5'
      - '5, 5, 5: equilateral'
      - '6, 6, 4: isosceles'
    - title: Does not
      points:
      - '3, 4, 8: 3 + 4 < 8'
      - '2, 3, 5: 2 + 3 = 5'
      - '1, 1, 3: 1 + 1 < 3'
    alt: Side lengths that make a triangle (two shorter sides add to more than the longest) compared with lengths that don't.
  activity:
    type: sort
    prompt: Can these three sticks make a triangle?
    bins:
    - Makes a triangle
    - No triangle
    items:
    - label: 5, 5, 5 cm
      bin: Makes a triangle
      clue: Add the two shorter sticks. Longer than the longest?
      why: 5 + 5 = 10 > 5.
    - label: 4, 6, 9 cm
      bin: Makes a triangle
      clue: Is 4 + 6 more than 9?
      why: '10 > 9: yes.'
    - label: 7, 8, 14 cm
      bin: Makes a triangle
      clue: 7 + 8 against 14.
      why: '15 > 14: just.'
    - label: 5, 12, 13 cm
      bin: Makes a triangle
      clue: 5 + 12 against 13.
      why: 17 > 13.
    - label: 3, 4, 8 cm
      bin: No triangle
      clue: Can 3 and 4 reach across 8?
      why: 3 + 4 = 7, shorter than 8.
    - label: 2, 3, 5 cm
      bin: No triangle
      clue: 2 + 3 is exactly 5. What happens?
      why: They lie flat along the 5 cm stick.
    - label: 1, 1, 3 cm
      bin: No triangle
      clue: Can two 1 cm sticks span 3 cm?
      why: 1 + 1 = 2 < 3.
    - label: 3, 6, 10 cm
      bin: No triangle
      clue: 3 + 6 against 10.
      why: 9 < 10.
  lesson:
    - teach: 'Three lines that meet in pairs make a triangle: 3 sides, 3 angles and 3 corners (vertices). By sides, a triangle is equilateral (all three equal), isosceles (two equal) or scalene (none equal).'
      picture:
        kind: compare
        columns:
        - title: Equilateral
          points:
          - 5, 5, 5 cm
          - all sides equal
        - title: Isosceles
          points:
          - 5, 5, 3 cm
          - two sides equal
        - title: Scalene
          points:
          - 4, 5, 6 cm
          - no sides equal
        alt: Three kinds of triangle by their sides.
      check:
        prompt: A triangle has sides 6 cm, 8 cm and 6 cm. What kind is it?
        options:
        - Isosceles
        - Scalene
        - Equilateral
        answer: Isosceles
        why: Exactly two sides are equal.
    - teach: 'Not any three lengths make a triangle. Try 2, 3 and 7 cm sticks: the two short ones together reach only 5 cm, so they cannot meet over the 7 cm stick. The rule (triangle inequality): any two sides together must be longer than the third. Quick test: do the two shorter sides add to more than the longest?'
      picture:
        kind: bars
        bars:
        - label: 2 + 3
          value: 5
        - label: longest
          value: 7
        unit: cm
        alt: The two short sticks add to 5 cm, shorter than the 7 cm stick, so they cannot form a triangle.
      check:
        prompt: Can sticks of 4 cm, 5 cm and 7 cm make a triangle?
        options:
        - 'Yes'
        - 'No'
        answer: 'Yes'
        why: 4 + 5 = 9, which is more than 7.
    - teach: If two sides are known, the third must be more than their difference and less than their sum. With sides 5 and 8, the third side is between 3 and 13 (not equal to either). To build a triangle with three given sides, draw one side, then draw arcs from each end with the compass set to the other two lengths.
      check:
        prompt: Two sides are 5 cm and 8 cm. Which could be the third side?
        options:
        - 10 cm
        - 13 cm
        - 2 cm
        answer: 10 cm
        why: It must be between 8 − 5 = 3 and 8 + 5 = 13.
  items:
  - prompt: Can sides of 3 cm, 4 cm and 8 cm make a triangle?
    options:
    - 'No'
    - 'Yes'
    - Only a right triangle
    - Only if drawn carefully
    answer: 'No'
    difficulty: 1
    hints:
    - Add the two shorter sides.
    - 3 + 4 = 7.
    solution: 3 + 4 = 7 is less than 8, so no triangle.
    mistakes:
      'Yes': c7_tri_ineq
  - prompt: Can sides of 5 cm, 6 cm and 9 cm make a triangle?
    options:
    - 'Yes'
    - 'No'
    - Only an equilateral one
    - Cannot tell
    answer: 'Yes'
    difficulty: 1
    hints:
    - 5 + 6 = 11.
    - Is 11 > 9?
    solution: 5 + 6 = 11 > 9, so yes.
    mistakes: {"No": "t7_triangle_inequality", "Only an equilateral one": "t7_triangle_inequality"}
  - prompt: A triangle has sides 7, 7 and 4 cm. What type is it?
    options:
    - Isosceles
    - Equilateral
    - Scalene
    - Right-angled
    answer: Isosceles
    difficulty: 1
    hints:
    - Two sides are equal.
    - Not all three.
    solution: 'Two equal sides: isosceles.'
    mistakes: {"Equilateral": "t7_triangle_types", "Scalene": "t7_triangle_types"}
  - prompt: Can 2 cm, 3 cm and 5 cm make a triangle?
    options:
    - No, the sides would lie flat
    - 'Yes'
    - Yes, a right triangle
    - Yes, an isosceles triangle
    answer: No, the sides would lie flat
    difficulty: 2
    hints:
    - 2 + 3 = 5.
    - It must be greater, not equal.
    solution: 2 + 3 is equal to 5, not greater, so the sides lie on one line.
    mistakes: {"Yes": "t7_flat_triangle", "Yes, a right triangle": "t7_flat_triangle"}
  - prompt: Two sides of a triangle are 4 cm and 9 cm. The third side is a whole number of cm. What is the smallest it can be?
    answer: '6'
    check: 9 - 4 + 1
    difficulty: 3
    hints:
    - The third side must be more than 9 − 4.
    - More than 5.
    solution: The third side must be greater than 9 − 4 = 5, so at least 6 cm.
    mistakes: {"5": "t7_third_side_min", "1": "t7_third_side_min"}
  - prompt: Two sides of a triangle are 4 cm and 9 cm. The third side is a whole number of cm. What is the largest it can be?
    answer: '12'
    check: 4 + 9 - 1
    difficulty: 3
    hints:
    - It must be less than 4 + 9.
    - Less than 13.
    solution: The third side must be less than 13, so at most 12 cm.
    mistakes: {"13": "t7_third_side_max", "14": "t7_third_side_max"}
  - prompt: Can sides of 6 cm, 7 cm and 12 cm make a triangle?
    options:
    - 'Yes'
    - 'No'
    - Only if it has a right angle
    answer: 'Yes'
    difficulty: 1
    hints:
    - Add the two shorter sides.
    - Is 6 + 7 more than 12?
    solution: 6 + 7 = 13, which is more than 12, so the sides can make a triangle.
    mistakes:
      'No': c7m7_two_short
      Only if it has a right angle: c7m7_two_short
  - prompt: Can sides of 1 cm, 2 cm and 6 cm make a triangle?
    options:
    - 'No'
    - 'Yes'
    - Only an isosceles one
    answer: 'No'
    difficulty: 1
    hints:
    - Add the two shorter sides.
    - Compare 1 + 2 with 6.
    solution: 1 + 2 = 3, which is less than 6. The short sides cannot meet.
    mistakes:
      'Yes': c7m7_two_short
      Only an isosceles one: c7m7_two_short
  - prompt: A triangle has sides 9 cm, 9 cm and 9 cm. What kind is it?
    options:
    - Equilateral
    - Isosceles only
    - Scalene
    answer: Equilateral
    difficulty: 1
    hints:
    - Count the equal sides.
    - All three are the same.
    solution: All three sides are equal, so it is equilateral.
    mistakes:
      Isosceles only: c7m7_kinds
      Scalene: c7m7_kinds
  - prompt: A triangle has sides 4 cm, 7 cm and 9 cm. What kind is it?
    options:
    - Scalene
    - Isosceles
    - Equilateral
    answer: Scalene
    difficulty: 1
    hints:
    - Are any two sides the same?
    - 4, 7 and 9 are all different.
    solution: No two sides are equal, so it is scalene.
    mistakes:
      Isosceles: c7m7_kinds
      Equilateral: c7m7_kinds
  - prompt: Two sides of a triangle are 6 cm and 10 cm. The third side is a whole number of cm. What is the smallest it can be?
    answer: '5'
    check: 10-6+1
    difficulty: 2
    hints:
    - The third side must be more than 10 − 6.
    - The next whole number above 4.
    solution: 'Step 1: it must be more than 10 − 6 = 4 cm. Step 2: the smallest whole number above 4 is 5.'
    mistakes:
      '4': c7m7_range
      '16': c7m7_range
  - prompt: Two sides of a triangle are 6 cm and 10 cm. The third side is a whole number of cm. What is the largest it can be?
    answer: '15'
    check: 6+10-1
    difficulty: 2
    hints:
    - The third side must be less than 6 + 10.
    - The whole number just below 16.
    solution: 'Step 1: it must be less than 6 + 10 = 16 cm. Step 2: the largest whole number below 16 is 15.'
    mistakes:
      '16': c7m7_range
      '4': c7m7_range
  - prompt: An isosceles triangle has two sides of 3 cm. Which length could the third side NOT be?
    options:
    - 7 cm
    - 5 cm
    - 1 cm
    answer: 7 cm
    difficulty: 2
    hints:
    - The two 3 cm sides together make 6 cm.
    - The third side must be shorter than 6 cm.
    solution: 3 + 3 = 6, so the third side must be less than 6 cm. 1 cm and 5 cm work; 7 cm does not.
    mistakes:
      5 cm: c7m7_two_short
      1 cm: c7m7_range
  - prompt: Which set of lengths can make a triangle?
    options:
    - 5 cm, 5 cm, 9 cm
    - 2 cm, 4 cm, 6 cm
    - 3 cm, 3 cm, 7 cm
    answer: 5 cm, 5 cm, 9 cm
    difficulty: 2
    hints:
    - For each set, add the two shorter sides.
    - The sum must be more than the longest, not equal to it.
    solution: 5 + 5 = 10 > 9 works. 2 + 4 = 6 is only equal to 6 (flat), and 3 + 3 = 6 < 7.
    mistakes:
      2 cm, 4 cm, 6 cm: c7m7_two_short
      3 cm, 3 cm, 7 cm: c7m7_two_short
  - prompt: How many whole-number lengths (in cm) can the third side have if two sides are 3 cm and 7 cm?
    answer: '5'
    check: (3+7-1)-(7-3+1)+1
    difficulty: 3
    hints:
    - Find the smallest and largest whole numbers allowed.
    - More than 4 and less than 10.
    solution: 'Step 1: the third side is more than 7 − 3 = 4 and less than 7 + 3 = 10. Step 2: that allows 5, 6, 7, 8, 9: five lengths.'
    mistakes:
      '6': c7m7_range
      '7': c7m7_range
  - prompt: A triangle has a perimeter of 12 cm and all sides are whole numbers. Which of these is possible?
    options:
    - 4, 4, 4
    - 2, 4, 6
    - 1, 5, 6
    answer: 4, 4, 4
    difficulty: 3
    hints:
    - All three add to 12. Check the triangle rule on each.
    - Two shorter sides must add to more than the longest.
    solution: '4 + 4 > 4 works. In 2, 4, 6: 2 + 4 = 6 (flat). In 1, 5, 6: 1 + 5 = 6 (flat).'
    mistakes:
      2, 4, 6: c7m7_two_short
      1, 5, 6: c7m7_two_short
  - prompt: Why can no side of a triangle be half the perimeter or more?
    options:
    - The other two sides together would be no longer than it
    - The angles would add to more than 180°
    - The triangle would become equilateral
    answer: The other two sides together would be no longer than it
    difficulty: 3
    hints:
    - If one side is half the perimeter, what do the other two add to?
    - Use the rule about two sides and the third.
    solution: If one side is half the perimeter, the other two make up the other half, so they are only equal to it, not longer. The triangle would lie flat.
    mistakes:
      The angles would add to more than 180°: c7m7_two_short
      The triangle would become equilateral: c7m7_kinds
- code: cbse7m.tri.angles
  title: Angle sum and exterior angles
  after:
  - cbse7m.tri.sides
  notes: |
    The angles of any triangle add to 180° (tear off the corners and they fit on a straight line). So if two
    angles are 50° and 60°, the third is 70°. Equilateral triangles have three 60° angles; an isosceles
    triangle has two equal angles opposite the equal sides. An exterior angle (made by extending a side) equals
    the sum of the two opposite interior angles. An altitude is the perpendicular from a vertex to the opposite
    side.
  explanations:
    text: 'Tear the three corners off a paper triangle and put them side by side: they always make a straight line, 180°. So once you know two angles of a triangle, you can find the third.'
    visual: Draw triangle ABC, extend side BC beyond C to D. The outside angle at C equals angle A plus angle B, the two angles not touching it.
    step_by_step: 'Step 1: Add the two known angles. Step 2: Subtract from 180° for the third. Step 3: For an exterior angle, add the two opposite interior angles. Step 4: Check that all three interior angles add to 180°.'
    real_world: A set square has angles 30°, 60°, 90°, which add to 180°, and the other has 45°, 45°, 90°.
  picture:
    kind: geometry
    points:
      A:
      - 3
      - 8
      B:
      - 1
      - 2
      C:
      - 7
      - 2
      D:
      - 9.5
      - 2
    segments:
    - - A
      - B
    - - B
      - C
    - - C
      - A
    - - C
      - D
    angles:
    - at: A
      from: B
      to: C
      label: a
    - at: B
      from: C
      to: A
      label: b
    - at: C
      from: D
      to: A
      label: a + b
    caption: The exterior angle at C equals a + b, the two opposite interior angles.
    alt: Triangle ABC with side BC extended to D; the exterior angle at C is marked a plus b, equal to the angles at A and B.
  activity:
    type: angle
    prompt: Turn the arm to make each angle of the triangle.
    goals:
    - prompt: Two angles are 50° and 60°. Make the third.
      degrees: 70
      mistakes:
      - when:
          degrees: 110
        say: 110° is 50 + 60. The third is what's left of 180°.
      - when:
          degrees: 250
        say: That's 360° − 110°. A triangle's angles make 180°, not 360°.
    - prompt: Angles A = 45° and B = 75°. Make the exterior angle at C.
      degrees: 120
      mistakes:
      - when:
          degrees: 60
        say: 60° is the inside angle at C. The exterior angle equals A + B.
      - when:
          degrees: 240
        say: 240° goes round the wrong side. The exterior angle and C make a straight line.
    - prompt: A right triangle has one angle of 35°. Make the third.
      degrees: 55
      mistakes:
      - when:
          degrees: 145
        say: 145° is 180 − 35, forgetting the right angle. 90 + 35 = 125 is already used.
      - when:
          degrees: 35
        say: Not isosceles. 180 − 90 − 35 = ?
  lesson:
    - teach: 'Draw any triangle, tear off its three corners and place them side by side: they fit exactly on a straight line. So the three angles of every triangle add to 180°. If two angles are 70° and 50°, the third is 180° − 120° = 60°.'
      picture:
        kind: geometry
        points:
          A:
          - 1
          - 1
          B:
          - 9
          - 1
          C:
          - 4
          - 7
        segments:
        - - A
          - B
        - - B
          - C
        - - C
          - A
        angles:
        - at: A
          from: B
          to: C
          label: 70°
        - at: B
          from: C
          to: A
          label: 50°
        - at: C
          from: A
          to: B
          label: 60°
        alt: Triangle ABC with angles 70°, 50° and 60°, which add to 180°.
      check:
        prompt: Two angles of a triangle are 90° and 30°. What is the third?
        options:
        - 60°
        - 90°
        - 120°
        answer: 60°
        why: 180 − 90 − 30 = 60.
    - teach: 'Special triangles have special angles. Equilateral: all three are 60°. Isosceles: the two angles opposite the equal sides (base angles) are equal. Right triangle: one angle is 90°, so the other two add to 90°.'
      check:
        prompt: An isosceles triangle has base angles of 50° each. What is the top angle?
        options:
        - 80°
        - 50°
        - 130°
        answer: 80°
        why: 180 − 50 − 50 = 80.
    - teach: Extend one side of a triangle and you get an exterior angle. It equals the two interior angles far from it (not the one next to it), added together. With interior angles 40° and 60°, the exterior angle at the third corner is 100°.
      picture:
        kind: geometry
        points:
          A:
          - 1
          - 1
          B:
          - 6
          - 1
          C:
          - 3
          - 6
          D:
          - 9
          - 1
        segments:
        - - A
          - B
        - - B
          - C
        - - C
          - A
        - - B
          - D
        angles:
        - at: A
          from: B
          to: C
          label: 40°
        - at: C
          from: A
          to: B
          label: 60°
        - at: B
          from: D
          to: C
          label: 100°
        alt: Side AB is extended to D. The exterior angle at B is 100°, equal to 40° + 60°.
      check:
        prompt: The two far interior angles are 35° and 75°. What is the exterior angle?
        options:
        - 110°
        - 70°
        - 40°
        answer: 110°
        why: 35 + 75 = 110.
  items:
  - prompt: Two angles of a triangle are 50° and 60°. Find the third, in degrees.
    answer: '70'
    check: 180 - 50 - 60
    difficulty: 1
    hints:
    - Angles add to 180°.
    - 180 − 110.
    solution: 180° − 50° − 60° = 70°.
    mistakes:
      '110': c7_angle_sum
  - prompt: Each angle of an equilateral triangle measures how many degrees?
    answer: '60'
    check: 180/3
    difficulty: 1
    hints:
    - Three equal angles.
    - 180 ÷ 3.
    solution: 180° ÷ 3 = 60°.
    mistakes: {"90": "t7_equilateral_angle", "180": "t7_equilateral_angle"}
  - prompt: A right triangle has one angle of 35°. Find the other acute angle, in degrees.
    answer: '55'
    check: 180 - 90 - 35
    difficulty: 2
    hints:
    - One angle is 90°.
    - 180 − 90 − 35.
    solution: 180° − 90° − 35° = 55°.
    mistakes: {"145": "t7_right_triangle_angles", "35": "t7_right_triangle_angles"}
  - prompt: In triangle ABC, ∠A = 45° and ∠B = 65°. Find the exterior angle at C, in degrees.
    answer: '110'
    check: 45 + 65
    difficulty: 2
    hints:
    - Exterior angle = sum of opposite interior angles.
    - 45 + 65.
    solution: 45° + 65° = 110°.
    mistakes: {"70": "t7_exterior_angle", "250": "t7_exterior_angle"}
  - prompt: An isosceles triangle has a top angle of 40°. Find each of the two equal angles, in degrees.
    answer: '70'
    check: (180 - 40)/2
    difficulty: 2
    hints:
    - 180 − 40 = 140.
    - Split equally.
    solution: (180° − 40°) ÷ 2 = 70°.
    mistakes: {"140": "t7_isosceles_base", "40": "t7_isosceles_base"}
  - prompt: Can a triangle have two right angles?
    options:
    - No, they already add to 180°
    - 'Yes'
    - Only if it is isosceles
    - Only if it is large
    answer: No, they already add to 180°
    difficulty: 2
    hints:
    - 90 + 90 = ?
    - Nothing left for the third angle.
    solution: Two right angles already make 180°, leaving 0° for the third.
    mistakes: {"Yes": "t7_two_right", "Only if it is large": "t7_two_right"}
  - prompt: Two angles of a triangle are 80° and 45°. Find the third, in degrees.
    answer: '55'
    check: 180-80-45
    difficulty: 1
    hints:
    - All three add to 180°.
    - 180 − 80 − 45.
    solution: 'Step 1: 80 + 45 = 125. Step 2: 180 − 125 = 55°.'
    mistakes:
      '125': c7m7_sum180
      '65': c7m7_sum180
  - prompt: Two angles of a triangle are 25° and 100°. Find the third, in degrees.
    answer: '55'
    check: 180-25-100
    difficulty: 1
    hints:
    - Add the two you know.
    - Take that from 180.
    solution: 'Step 1: 25 + 100 = 125. Step 2: 180 − 125 = 55°.'
    mistakes:
      '75': c7m7_sum180
      '125': c7m7_sum180
  - prompt: A right triangle has one acute angle of 62°. Find the other acute angle, in degrees.
    answer: '28'
    check: 90-62
    difficulty: 1
    hints:
    - The right angle is 90°, so the other two add to 90°.
    - 90 − 62.
    solution: 'Step 1: the two acute angles add to 180 − 90 = 90°. Step 2: 90 − 62 = 28°.'
    mistakes:
      '118': c7m7_sum180
      '38': c7m7_sum180
  - prompt: Can a triangle have angles 60°, 60° and 70°?
    options:
    - 'No'
    - 'Yes'
    - Only if it is isosceles
    answer: 'No'
    difficulty: 1
    hints:
    - Add them.
    - Do they make 180°?
    solution: 60 + 60 + 70 = 190°, not 180°, so no triangle has these angles.
    mistakes:
      'Yes': c7m7_sum180
      Only if it is isosceles: c7m7_sum180
  - prompt: An isosceles triangle has a top angle of 110°. Find each base angle, in degrees.
    answer: '35'
    check: (180-110)/2
    difficulty: 2
    hints:
    - Take 110 from 180 first.
    - Share what is left between two equal angles.
    solution: 'Step 1: 180 − 110 = 70. Step 2: 70 ÷ 2 = 35° each.'
    mistakes:
      '70': c7m7_iso_angles
      '110': c7m7_iso_angles
