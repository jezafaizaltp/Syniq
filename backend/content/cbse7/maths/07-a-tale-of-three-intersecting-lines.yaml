        teach: 'Step 1: The interior angles at A and B are 55° and 70°. Step 2: Extend side BC beyond C to make the exterior angle. Step 3: Add the two far angles: 55° + 70° = 125°. Step 4: Check: the interior angle at C is 180° − 125° = 55°, and 55° + 125° = 180°, a straight line.'
      - style: real_world
        teach: 'A ladder leans against a wall. It makes 65° with the ground, and the wall makes 90° with the ground. Where the ladder touches the wall, the angle between the ladder and the wall above it is an exterior angle: 65° + 90° = 155°.'
  items:
  - prompt: Two angles of a triangle are 50° and 60°. Find the third, in degrees.
    answer: '70'
    check: 180 - 50 - 60
    difficulty: 1
    hints:
    - Angles add to 180°.
    - 180 − 110.
    solution: 180° − 50° − 60° = 70°.
    mistakes:
      '110': c7_angle_sum
  - prompt: Each angle of an equilateral triangle measures how many degrees?
    answer: '60'
    check: 180/3
    difficulty: 1
    hints:
    - Three equal angles.
    - 180 ÷ 3.
    solution: 180° ÷ 3 = 60°.
    mistakes: {"90": "t7_equilateral_angle", "180": "t7_equilateral_angle"}
  - prompt: A right triangle has one angle of 35°. Find the other acute angle, in degrees.
    answer: '55'
    check: 180 - 90 - 35
    difficulty: 2
    hints:
    - One angle is 90°.
    - 180 − 90 − 35.
    solution: 180° − 90° − 35° = 55°.
    mistakes: {"145": "t7_right_triangle_angles", "35": "t7_right_triangle_angles"}
  - prompt: In triangle ABC, ∠A = 45° and ∠B = 65°. Find the exterior angle at C, in degrees.
    answer: '110'
    check: 45 + 65
    difficulty: 2
    hints:
    - Exterior angle = sum of opposite interior angles.
    - 45 + 65.
    solution: 45° + 65° = 110°.
    mistakes: {"70": "t7_exterior_angle", "250": "t7_exterior_angle"}
  - prompt: An isosceles triangle has a top angle of 40°. Find each of the two equal angles, in degrees.
    answer: '70'
    check: (180 - 40)/2
    difficulty: 2
    hints:
    - 180 − 40 = 140.
    - Split equally.
    solution: (180° − 40°) ÷ 2 = 70°.
    mistakes: {"140": "t7_isosceles_base", "40": "t7_isosceles_base"}
  - prompt: Can a triangle have two right angles?
    options:
    - No, they already add to 180°
    - 'Yes'
    - Only if it is isosceles
    - Only if it is large
    answer: No, they already add to 180°
    difficulty: 2
    hints:
    - 90 + 90 = ?
    - Nothing left for the third angle.
    solution: Two right angles already make 180°, leaving 0° for the third.
    mistakes: {"Yes": "t7_two_right", "Only if it is large": "t7_two_right"}
  - prompt: Two angles of a triangle are 80° and 45°. Find the third, in degrees.
    answer: '55'
    check: 180-80-45
    difficulty: 1
    hints:
    - All three add to 180°.
    - 180 − 80 − 45.
    solution: 'Step 1: 80 + 45 = 125. Step 2: 180 − 125 = 55°.'
    mistakes:
      '125': c7m7_sum180
      '65': c7m7_sum180
  - prompt: Two angles of a triangle are 25° and 100°. Find the third, in degrees.
    answer: '55'
    check: 180-25-100
    difficulty: 1
    hints:
    - Add the two you know.
    - Take that from 180.
    solution: 'Step 1: 25 + 100 = 125. Step 2: 180 − 125 = 55°.'
    mistakes:
      '75': c7m7_sum180
      '125': c7m7_sum180
  - prompt: A right triangle has one acute angle of 62°. Find the other acute angle, in degrees.
    answer: '28'
    check: 90-62
    difficulty: 1
    hints:
    - The right angle is 90°, so the other two add to 90°.
    - 90 − 62.
    solution: 'Step 1: the two acute angles add to 180 − 90 = 90°. Step 2: 90 − 62 = 28°.'
    mistakes:
      '118': c7m7_sum180
      '38': c7m7_sum180
  - prompt: Can a triangle have angles 60°, 60° and 70°?
    options:
    - 'No'
    - 'Yes'
    - Only if it is isosceles
    answer: 'No'
    difficulty: 1
    hints:
    - Add them.
    - Do they make 180°?
    solution: 60 + 60 + 70 = 190°, not 180°, so no triangle has these angles.
    mistakes:
      'Yes': c7m7_sum180
      Only if it is isosceles: c7m7_sum180
  - prompt: An isosceles triangle has a top angle of 110°. Find each base angle, in degrees.
    answer: '35'
    check: (180-110)/2
    difficulty: 2
    hints:
    - Take 110 from 180 first.
    - Share what is left between two equal angles.
    solution: 'Step 1: 180 − 110 = 70. Step 2: 70 ÷ 2 = 35° each.'
    mistakes:
      '70': c7m7_iso_angles
      '110': c7m7_iso_angles
  - prompt: An isosceles triangle has base angles of 65° each. Find the top angle, in degrees.
    answer: '50'
    check: 180-65-65
    difficulty: 2
    hints:
    - Both base angles are 65°.
    - 180 − 65 − 65.
    solution: 'Step 1: 65 + 65 = 130. Step 2: 180 − 130 = 50°.'
    mistakes:
      '115': c7m7_iso_angles
      '65': c7m7_iso_angles
  - prompt: In triangle PQR, ∠P = 30° and ∠Q = 85°. Find the exterior angle at R, in degrees.
    answer: '115'
    check: 30+85
    difficulty: 2
    hints:
    - Use the two angles far from R.
    - 30 + 85.
    solution: 'Step 1: the exterior angle at R equals ∠P + ∠Q. Step 2: 30 + 85 = 115°.'
    mistakes:
      '65': c7m7_exterior
      '55': c7m7_exterior
  - prompt: An exterior angle of a triangle is 120°. One far interior angle is 50°. Find the other far interior angle, in degrees.
    answer: '70'
    check: 120-50
    difficulty: 2
    hints:
    - The two far angles add to the exterior angle.
    - 120 − 50.
    solution: 'Step 1: far angles add to 120°. Step 2: 120 − 50 = 70°.'
    mistakes:
      '60': c7m7_exterior
      '10': c7m7_exterior
  - prompt: The angles of a triangle are x, 2x and 3x. Find x, in degrees.
    answer: '30'
    check: 180/6
    difficulty: 3
    hints:
    - x + 2x + 3x = 180.
    - 6x = 180.
    solution: 'Step 1: x + 2x + 3x = 6x = 180. Step 2: x = 180 ÷ 6 = 30°. (The angles are 30°, 60°, 90°.)'
    mistakes:
      '60': c7m7_sum180
      '36': c7m7_sum180
  - prompt: Can a triangle have an obtuse angle and a right angle?
    options:
    - No, those two alone would be more than 180°
    - Yes, if the third angle is small
    - Yes, in an isosceles triangle
    answer: No, those two alone would be more than 180°
    difficulty: 3
    hints:
    - An obtuse angle is more than 90°.
    - Add it to 90°.
    solution: 90° plus anything over 90° is already more than 180°, leaving nothing for the third angle.
    mistakes:
      Yes, if the third angle is small: c7m7_sum180
      Yes, in an isosceles triangle: c7m7_iso_angles
  - prompt: Two angles of a triangle are equal and the third is 30° more than each of them. Find the third angle, in degrees.
    answer: '80'
    check: (180-30)/3+30
    difficulty: 3
    hints:
    - Call each equal angle a; the third is a + 30.
    - a + a + (a + 30) = 180.
    solution: 'Step 1: 3a + 30 = 180, so 3a = 150 and a = 50. Step 2: the third angle is 50 + 30 = 80°.'
    mistakes:
      '50': c7m7_sum180
      '60': c7m7_sum180
  - prompt: 'Assertion (A): A triangle cannot have two obtuse angles.

      Reason (R): The three angles of a triangle add up to 180°.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: Both A and R are true, and R explains A
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: Both true. Two obtuse angles alone would be more than 180°, which R does not allow.
    difficulty: 2
    mistakes:
      Both A and R are true, but R does not explain A: ar_link
      A is true, but R is false: ar_test_r
      A is false, but R is true: ar_test_a
    exam: assertion_reason
  - prompt: 'Assertion (A): An exterior angle of a triangle is equal to the interior angle next to it.

      Reason (R): An exterior angle and the interior angle next to it add up to 180°.'
    options:
    - Both A and R are true, and R explains A
    - Both A and R are true, but R does not explain A
    - A is true, but R is false
    - A is false, but R is true
    answer: A is false, but R is true
    hints:
    - Decide first whether A is true on its own.
    - Then decide whether R is true, and whether R is the reason for A.
    solution: 'A is false: the exterior angle equals the sum of the two far interior angles. R is true, since the two lie on a straight line.'
    difficulty: 2
    mistakes:
      Both A and R are true, and R explains A: ar_test_a
      Both A and R are true, but R does not explain A: ar_test_a
      A is true, but R is false: ar_test_a
    exam: assertion_reason
  - prompt: 'Case: A triangular park has corners A, B and C. The angle at A is 48° and the angle at B is 67°. A path carries side BC straight on beyond C. What is the exterior angle at C, between this path and side CA?'
    options:
    - 115°
    - 65°
    - 132°
    answer: 115°
    hints:
    - Which two interior angles are far from C?
    - Add them.
    solution: 'The exterior angle at C equals the two far interior angles: 48° + 67° = 115°.'
    mistakes:
      65°: c7m7_exterior
      132°: c7m7_exterior
    exam: case
    difficulty: 2
  - prompt: 'Situation: A student measures the angles of a triangle as 62°, 59° and 64°. How can you tell there is a measuring mistake?'
    options:
    - The angles add to 185°, but they must add to 180°
    - None of the angles is 90°
    - All three angles are different
    answer: The angles add to 185°, but they must add to 180°
    hints:
    - Add the three measurements.
    - What should the three angles of any triangle add to?
    solution: 62 + 59 + 64 = 185. The angles of every triangle add to exactly 180°, so at least one measurement is wrong.
    mistakes:
      None of the angles is 90°: c7m7_sum180
      All three angles are different: c7m7_sum180
    exam: competency
    difficulty: 2
