# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 3. Format: content/README.md.
subject: cbse7-math
chapter: 3
title: A Peek Beyond the Point
tips:
  c7_fraction_decimal: "7/10 means 7 tenths. The decimal point is not a fraction line. The first place after the point is the tenths place."
  c7_decimal_length: "A longer decimal is not always bigger. Compare the tenths digit first, then hundredths."
  c7_decimal_align: Line up the decimal points, not the last digits, so tenths add to tenths.
  t7_decimal_add: "Line up the points: 2.50 + 3.25 + 4.25. Watch the carries."
  t7_decimal_subtract: "Write 5.2 as 5.20 so both numbers have two decimal places, then subtract."
  t7_fraction_decimal: "Make the bottom 100: 3/4 = ?/100. Then write it with two decimal places."
  t7_hundredths: "23/100 is 23 hundredths. The last digit goes in the hundredths place, two places after the point."
  t7_line_up_points: "Write 10 as 10.00 and line up the decimal points before subtracting."
  t7_mm_to_cm: "10 mm = 1 cm, so 4 mm is 4 tenths of a cm."
  t7_place_value_decimal: "The first place after the point is tenths. 8 tenths written as a decimal is…?"
  t7_spend_then_change: "Add what was spent, then take that from ₹20. Line up the decimal points."
  c7m3_place: Right after the point come tenths, then hundredths. Read each digit's place before its value.
  c7m3_convert: Make the denominator 10 or 100 first, then write the top number after the point.
  c7m3_compare: Line up the points and compare digit by digit from the left; add zeros so both have the same number of places.
  c7m3_align: Line up the decimal points, fill empty places with 0, then add or subtract as with whole numbers.
  c7m3_units: 10 mm = 1 cm and 100 paise = ₹1. The smaller unit goes after the point.
concepts:
- code: cbse7m.dec1.place
  title: Tenths, hundredths and decimals
  notes: |
    When a unit is split into 10 equal parts, each is one tenth (1/10 = 0.1); into 100 parts, one hundredth
    (1/100 = 0.01). In 4.37, 4 is ones, 3 is tenths, 7 is hundredths: 4 + 3/10 + 7/100. Fractions with
    denominator 10, 100, 1000 convert directly: 7/10 = 0.7, 23/100 = 0.23. Others: make the denominator 10 or
    100 (1/4 = 25/100 = 0.25; 3/5 = 6/10 = 0.6). Decimals sit between whole numbers on the number line.
    Comparing: line up the points, compare digit by digit from the left (0.5 > 0.45 because 5 tenths > 4 tenths).
    Measurement: 1 cm = 10 mm, so 3 cm 7 mm = 3.7 cm; ₹1 = 100 paise, so ₹5 and 25 paise = ₹5.25.
  explanations:
    text: 'The decimal point separates whole units from parts of a unit. In 4.37, there are 4 whole ones, 3 tenths and 7 hundredths. A scale shows this: 3.7 cm is 3 centimetres and 7 millimetres, because each centimetre is split into 10 mm.'
    visual: Look at a ruler between 3 and 4 cm. It is divided into 10 small marks, each a millimetre, one tenth of a centimetre. The 7th mark after 3 is 3.7 cm.
    step_by_step: 'Step 1: Name the places after the point: tenths, hundredths. Step 2: To change a fraction to a decimal, make the denominator 10 or 100. Step 3: To compare decimals, line up the points. Step 4: Compare from the left, digit by digit.'
    real_world: 'Prices in shops use decimals: ₹45.50 is 45 rupees and 50 paise, because 1 rupee = 100 paise.'
  picture:
    kind: number_line
    from: 3
    to: 4
    step: 0.1
    points:
    - at: 3.7
      label: '3.7'
    caption: Between 3 and 4 there are ten tenths; 3.7 is the seventh.
    alt: A number line from 3 to 4 marked in tenths, with a point at 3.7, seven tenths past 3.
  activity:
    type: formula
    prompt: Build a decimal from ones, tenths and hundredths.
    inputs:
    - name: o
      label: Ones
      min: 0
      max: 9
      step: 1
      start: 0
    - name: t
      label: Tenths
      min: 0
      max: 9
      step: 1
      start: 0
    - name: h
      label: Hundredths
      min: 0
      max: 9
      step: 1
      start: 0
    outputs:
    - name: val
      label: The number
      expr: o+t/10+h/100
      places: 2
    goals:
    - prompt: Make 4.37.
      want:
        val: 4.37
      mistakes:
      - when:
          o: 4
          t: 7
          h: 3
        say: That's 4.73. The first digit after the point is tenths, the next is hundredths.
      - when:
          o: 3
          t: 7
          h: 4
        say: '4 is the whole number here: it goes in the ones.'
    - prompt: Write 3 cm 7 mm in cm.
      want:
        val: 3.7
      mistakes:
      - when:
          o: 3
          t: 0
          h: 7
        say: 3.07 cm is 3 cm and less than 1 mm. Each mm is a tenth of a cm, so 7 mm is 7 tenths.
    - prompt: Make half a unit and 5 hundredths more.
      want:
        val: 0.55
      mistakes:
      - when:
          o: 0
          t: 5
          h: 0
        say: That's 0.5, the half. Now add 5 hundredths.
      - when:
          o: 0
          t: 0
          h: 5
        say: That's only 5 hundredths. Half a unit is 5 tenths.
  lesson:
    - teach: 'Split one whole into 10 equal parts: each part is one tenth, 1/10 = 0.1. Split it into 100 parts: each is one hundredth, 1/100 = 0.01. In 4.37, 4 is ones, 3 is tenths and 7 is hundredths.'
      picture:
        kind: number_line
        from: 0
        to: 1
        step: 0.1
        points:
        - at: 0.3
          label: '0.3'
        - at: 0.7
          label: '0.7'
        alt: A number line from 0 to 1 in tenths, with 0.3 and 0.7 marked.
      check:
        prompt: In 5.62, what is the value of the 6?
        options:
        - '0.6'
        - '6'
        - '0.06'
        answer: '0.6'
        why: '6 is in the tenths place: 6 tenths = 0.6.'
    - teach: 'Fractions with denominator 10 or 100 convert directly: 7/10 = 0.7, 23/100 = 0.23. For others, make the denominator 10 or 100 first: 1/4 = 25/100 = 0.25, and 3/5 = 6/10 = 0.6.'
      check:
        prompt: Write 2/5 as a decimal.
        options:
        - '0.4'
        - '0.25'
        - '2.5'
        answer: '0.4'
        why: 2/5 = 4/10 = 0.4.
    - teach: 'To compare decimals, line up the points and compare from the left: 0.5 > 0.45 because 5 tenths > 4 tenths. In measurement, 1 cm = 10 mm, so 3 cm 7 mm = 3.7 cm; and ₹1 = 100 paise, so ₹5 and 25 paise = ₹5.25.'
      picture:
        kind: compare
        columns:
        - title: '0.50'
          points:
          - 5 tenths
          - 0 hundredths
        - title: '0.45'
          points:
          - 4 tenths
          - 5 hundredths
        alt: 0.50 has 5 tenths and 0.45 has 4 tenths, so 0.50 is larger.
      check:
        prompt: 'Which is larger: 0.7 or 0.69?'
        options:
        - '0.7'
        - '0.69'
        - They are equal
        answer: '0.7'
        why: 7 tenths beats 6 tenths.
  items:
  - prompt: Write 7/10 as a decimal.
    answer: '0.7'
    check: 7/10
    difficulty: 1
    hints:
    - Tenths go in the first place after the point.
    - 7 tenths.
    solution: 7/10 = 0.7.
    mistakes:
      '7.10': c7_fraction_decimal
  - prompt: Write 23/100 as a decimal.
    answer: '0.23'
    check: 23/100
    difficulty: 1
    hints:
    - 'Hundredths: two places after the point.'
    - 23 hundredths.
    solution: 23/100 = 0.23.
    mistakes: {"2.3": "t7_hundredths", "0.023": "t7_hundredths"}
  - prompt: Write 3/4 as a decimal.
    answer: '0.75'
    check: 3/4
    difficulty: 2
    hints:
    - Make the denominator 100.
    - 3/4 = 75/100.
    solution: 3/4 = 75/100 = 0.75.
    mistakes: {"0.34": "t7_fraction_decimal", "3.4": "t7_fraction_decimal"}
  - prompt: A pencil is 9 cm 4 mm long. Write its length in cm as a decimal.
    answer: '9.4'
    check: 9 + 4/10
    difficulty: 1
    hints:
    - 1 mm = 0.1 cm.
    - 4 mm = 0.4 cm.
    solution: 9 cm 4 mm = 9.4 cm.
    mistakes: {"94": "t7_mm_to_cm", "9.04": "t7_mm_to_cm"}
  - prompt: 'Which is larger: 0.5 or 0.45?'
    options:
    - '0.5'
    - '0.45'
    - They are equal
    - Cannot tell
    answer: '0.5'
    difficulty: 2
    hints:
    - Compare the tenths digit.
    - 5 tenths vs 4 tenths.
    solution: 0.5 = 0.50, which is more than 0.45.
    mistakes:
      '0.45': c7_decimal_length
  - prompt: In 6.82, what is the value of the digit 8? Give it as a decimal.
    answer: '0.8'
    check: 8/10
    difficulty: 2
    hints:
    - 8 is in the tenths place.
    - 8 tenths.
    solution: The 8 stands for 8 tenths = 0.8.
    mistakes: {"8": "t7_place_value_decimal", "0.08": "t7_place_value_decimal"}
  - prompt: Write 9/100 as a decimal.
    answer: '0.09'
    check: 9/100
    difficulty: 1
    hints:
    - Hundredths need two places after the point.
    - The 9 goes in the hundredths place.
    solution: 'Step 1: 9 hundredths. Step 2: two places after the point: 0.09.'
    mistakes:
      '0.9': c7m3_place
      '9.1': c7m3_place
  - prompt: Write 1/2 as a decimal.
    answer: '0.5'
    check: 1/2
    difficulty: 1
    hints:
    - Make the denominator 10.
    - 1/2 = 5/10.
    solution: 'Step 1: 1/2 = 5/10. Step 2: 5/10 = 0.5.'
    mistakes:
      '0.2': c7m3_convert
      '1.2': c7m3_convert
  - prompt: Write 7/20 as a decimal.
    answer: '0.35'
    check: 7/20
    difficulty: 2
    hints:
    - Multiply top and bottom by 5.
    - 7/20 = 35/100.
    solution: 'Step 1: 7/20 = 35/100. Step 2: 35/100 = 0.35.'
    mistakes:
      '0.7': c7m3_convert
      '3.5': c7m3_convert
  - prompt: 'Which is the smallest: 0.3, 0.28 or 0.305?'
    options:
    - '0.28'
    - '0.3'
    - '0.305'
    answer: '0.28'
    difficulty: 2
    hints:
    - Compare the tenths first.
    - Write them as 0.300, 0.280, 0.305.
    solution: 'Step 1: tenths are 3, 2, 3. Step 2: 0.28 has only 2 tenths, so it is smallest.'
    mistakes:
      '0.3': c7m3_compare
      '0.305': c7m3_compare
  - prompt: A coin purse has ₹7 and 5 paise. Write it in rupees as a decimal.
    answer: '7.05'
    check: 7+5/100
    difficulty: 2
    hints:
    - 100 paise = ₹1.
    - 5 paise is 5 hundredths of a rupee.
    solution: 'Step 1: 5 paise = ₹0.05. Step 2: ₹7 + ₹0.05 = ₹7.05.'
    mistakes:
      '7.5': c7m3_units
      '75': c7m3_units
  - prompt: Write 12 cm 3 mm in centimetres as a decimal.
    answer: '12.3'
    check: 12+3/10
    difficulty: 1
    hints:
    - 10 mm = 1 cm.
    - 3 mm = 3 tenths of a cm.
    solution: 'Step 1: 3 mm = 0.3 cm. Step 2: 12 + 0.3 = 12.3 cm.'
    mistakes:
      '12.03': c7m3_units
      '123': c7m3_units
  - prompt: Which decimal lies halfway between 2.4 and 2.5?
    answer: '2.45'
    check: (2.4+2.5)/2
    difficulty: 3
    hints:
    - Write them as 2.40 and 2.50.
    - What is in the middle?
    solution: 'Step 1: 2.40 and 2.50. Step 2: halfway is 2.45.'
    mistakes:
      '2.9': c7m3_place
      '2.405': c7m3_place
  - prompt: Write 3 + 4/10 + 6/100 as a decimal.
    answer: '3.46'
    check: 3+4/10+6/100
    difficulty: 1
    hints:
    - Tenths go just after the point.
    - Hundredths go next.
    solution: 'Step 1: 3 ones, 4 tenths, 6 hundredths. Step 2: 3.46.'
    mistakes:
      '3.64': c7m3_place
      '34.6': c7m3_place
  - prompt: In 8.09, what is the value of the 9? Give it as a decimal.
    answer: '0.09'
    check: 9/100
    difficulty: 2
    hints:
    - Which place is 9 in?
    - The tenths digit is 0.
    solution: 'Step 1: the 9 is in the hundredths place. Step 2: 9 hundredths = 0.09.'
    mistakes:
      '0.9': c7m3_place
      '9': c7m3_place
- code: cbse7m.dec1.addsub
  title: Adding and subtracting decimals
  after:
  - cbse7m.dec1.place
  notes: |
    To add or subtract decimals, line up the decimal points (write 3.5 as 3.50 if needed) and work as with whole
    numbers, carrying or borrowing across the point. 12.75 + 3.6 = 16.35. 10 − 4.35 = 5.65. Check by
    estimating: 12.75 + 3.6 is about 13 + 4 = 17.
  explanations:
    text: Add decimals just like whole numbers, but keep the points in a straight line so tenths add to tenths and hundredths to hundredths. Fill empty places with zeros.
    visual: 'Write 12.75 and 3.60 one above the other with the points lined up, like columns of a money bill: rupees on the left, paise on the right.'
    step_by_step: 'Step 1: Write the numbers with points lined up. Step 2: Fill in zeros so both have the same places. Step 3: Add or subtract from the right, carrying or borrowing. Step 4: Put the point in the answer straight below.'
    real_world: 'Shopping: ₹12.75 for a notebook and ₹3.60 for a pen makes ₹16.35. From a ₹20 note, the change is ₹3.65.'
  picture:
    kind: flow
    steps:
    - 12.75 + 3.6
    - Write 3.6 as 3.60
    - Line up the points
    - 'Add: 12.75 + 3.60'
    - = 16.35
    alt: 'Adding 12.75 and 3.6: write 3.6 as 3.60, line up the points and add to get 16.35.'
  activity:
    type: formula
    prompt: You have ₹10. You buy a pencil for ₹2.75 and a pen for ₹x.
    inputs:
    - name: x
      label: Pen price
      min: 0
      max: 7
      step: 0.05
      start: 1
      unit: ₹
    outputs:
    - name: spent
      label: Spent
      expr: x+2.75
      unit: ₹
      places: 2
    - name: change
      label: Change
      expr: 10-x-2.75
      unit: ₹
      places: 2
    goals:
    - prompt: You spend exactly ₹7. Find the pen's price.
      want:
        spent: 7
      mistakes:
      - when:
          x: 4.75
        say: '7 − 2 = 5, then 5 − 0.25? Line up the points: 7.00 − 2.75 = 4.25.'
      - when:
          x: 5.25
        say: 'That adds the 0.25 back. 7.00 − 2.75: take the hundredths away too.'
    - prompt: Your change is ₹3.50. Find the pen's price.
      want:
        change: 3.5
      mistakes:
      - when:
          x: 6.5
        say: 10 − 3.50 = 6.50 is everything spent. The pencil took ₹2.75 of that.
      - when:
          x: 4.25
        say: 'Close. 6.50 − 2.75: line up the points and borrow carefully.'
    - prompt: Your change is ₹5.05. Find the pen's price.
      want:
        change: 5.05
      mistakes:
      - when:
          x: 2.25
        say: 'Write 5.05 in full: 5 ones, 0 tenths, 5 hundredths. 7.25 − 5.05 = 2.20.'
  lesson:
    - teach: 'To add decimals, line up the points. Fill empty places with 0: 12.75 + 3.6 becomes 12.75 + 3.60 = 16.35. Then add as with whole numbers, carrying across the point.'
      picture:
        kind: compare
        columns:
        - title: Line up
          points:
          - '12.75'
          - + 3.60
        - title: Add
          points:
          - = 16.35
        alt: 12.75 plus 3.60 with the decimal points lined up gives 16.35.
      check:
        prompt: Find 4.5 + 2.35.
        options:
        - '6.85'
        - '2.80'
        - '6.40'
        answer: '6.85'
        why: 4.50 + 2.35 = 6.85.
    - teach: 'To subtract, line up the points and borrow across the point if needed: 10 − 4.35 = 10.00 − 4.35 = 5.65.'
      check:
        prompt: Find 7 − 2.6.
        options:
        - '4.4'
        - '5.4'
        - '4.6'
        answer: '4.4'
        why: 7.0 − 2.6 = 4.4.
    - teach: 'Estimate to check: 12.75 + 3.6 is about 13 + 4 = 17, so 16.35 is sensible. Money problems use decimals: change = amount paid − cost.'
      check:
        prompt: A snack costs ₹18.50. What change from ₹20?
        options:
        - ₹1.50
        - ₹2.50
        - ₹1.05
        answer: ₹1.50
        why: 20.00 − 18.50 = 1.50.
  items:
  - prompt: Find 12.75 + 3.6.
    answer: '16.35'
    check: 12.75 + 3.6
    difficulty: 1
    hints:
    - Write 3.6 as 3.60.
    - Line up the points.
    solution: 12.75 + 3.60 = 16.35.
    mistakes:
      '13.11': c7_decimal_align
  - prompt: Find 10 − 4.35.
    answer: '5.65'
    check: 10 - 4.35
    difficulty: 2
    hints:
    - Write 10 as 10.00.
    - Borrow across the point.
    solution: 10.00 − 4.35 = 5.65.
    mistakes: {"6.35": "t7_line_up_points", "4.35": "t7_line_up_points"}
  - prompt: Find 0.8 + 0.25.
    answer: '1.05'
    check: 0.8 + 0.25
    difficulty: 1
    hints:
    - 0.80 + 0.25.
    - Line up the points.
    solution: 0.80 + 0.25 = 1.05.
    mistakes:
      '0.33': c7_decimal_align
  - prompt: A notebook costs ₹12.75 and a pen ₹3.60. What change is left from ₹20?
    answer: '3.65'
    check: 20 - (12.75 + 3.60)
    difficulty: 2
    hints:
    - 'Total: 16.35.'
    - 20 − 16.35.
    solution: 12.75 + 3.60 = 16.35; 20 − 16.35 = ₹3.65.
    mistakes: {"16.35": "t7_spend_then_change", "4.65": "t7_spend_then_change"}
  - prompt: A ribbon 5.2 m long has 1.75 m cut off. How much is left, in metres?
    answer: '3.45'
    check: 5.2 - 1.75
    difficulty: 2
    hints:
    - 5.20 − 1.75.
    - Line up the points.
    solution: 5.20 − 1.75 = 3.45 m.
    mistakes: {"3.55": "t7_decimal_subtract", "4.45": "t7_decimal_subtract"}
  - prompt: Find 2.5 + 3.25 + 4.25.
    answer: '10'
    check: 2.5 + 3.25 + 4.25
    difficulty: 1
    hints:
    - 3.25 + 4.25 = 7.5.
    - Then add 2.5.
    solution: 3.25 + 4.25 = 7.50; 7.50 + 2.50 = 10.
    mistakes: {"9": "t7_decimal_add", "9.75": "t7_decimal_add"}
  - prompt: Find 3.08 + 5.7.
    answer: '8.78'
    check: 3.08+5.7
    difficulty: 1
    hints:
    - Write 5.7 as 5.70.
    - Line up the points.
    solution: 'Step 1: 3.08 + 5.70. Step 2: = 8.78.'
    mistakes:
      '3.65': c7m3_align
      '8.15': c7m3_align
  - prompt: Find 15 − 6.75.
    answer: '8.25'
    check: 15-6.75
    difficulty: 2
    hints:
    - Write 15 as 15.00.
    - Borrow across the point.
    solution: 'Step 1: 15.00 − 6.75. Step 2: = 8.25.'
    mistakes:
      '9.35': c7m3_align
      '8.35': c7m3_align
  - prompt: Find 0.6 + 0.47.
    answer: '1.07'
    check: 0.6+0.47
    difficulty: 1
    hints:
    - 0.6 = 0.60.
    - 60 hundredths + 47 hundredths.
    solution: 'Step 1: 0.60 + 0.47 = 1.07 (107 hundredths).'
    mistakes:
      '0.53': c7m3_align
      '0.107': c7m3_align
  - prompt: Anu walks 1.25 km to school and 0.8 km to the library. How far in all, in km?
    answer: '2.05'
    check: 1.25+0.8
    difficulty: 2
    hints:
    - 0.8 = 0.80.
    - Add with points lined up.
    solution: 'Step 1: 1.25 + 0.80. Step 2: = 2.05 km.'
    mistakes:
      '1.33': c7m3_align
      '2.5': c7m3_align
  - prompt: A water tank holds 8.5 litres. 3.75 litres are used. How much is left?
    answer: '4.75'
    check: 8.5-3.75
    difficulty: 2
    hints:
    - 8.5 = 8.50.
    - Subtract 3.75.
    solution: 'Step 1: 8.50 − 3.75. Step 2: = 4.75 litres.'
    mistakes:
      '5.25': c7m3_align
      '4.85': c7m3_align
  - prompt: Find 1.2 + 3.45 + 0.35.
    answer: '5'
    check: 1.2+3.45+0.35
    difficulty: 2
    hints:
    - Group 3.45 and 0.35 first.
    - They make 3.80.
    solution: 'Step 1: 3.45 + 0.35 = 3.80. Step 2: 3.80 + 1.20 = 5.00.'
    mistakes:
      '4.9': c7m3_align
      '5.1': c7m3_align
  - prompt: Ravi pays ₹50 for a book costing ₹37.40. What change does he get, in rupees?
    answer: '12.6'
    check: 50-37.4
    difficulty: 2
    hints:
    - Change = paid − cost.
    - 50.00 − 37.40.
    solution: 'Step 1: 50.00 − 37.40. Step 2: = ₹12.60.'
    mistakes:
      '13.6': c7m3_align
      '12.4': c7m3_align
  - prompt: Which is the best estimate of 6.9 + 4.2?
    options:
    - '11'
    - '10'
    - '12'
    answer: '11'
    difficulty: 1
    hints:
    - Round each to the nearest whole number.
    - 7 + 4.
    solution: 'Step 1: 6.9 ≈ 7 and 4.2 ≈ 4. Step 2: 7 + 4 = 11.'
    mistakes:
      '10': c7m1_estimate
      '12': c7m1_estimate
  - prompt: A plank 2.4 m long is cut into two pieces. One piece is 0.95 m. How long is the other?
    answer: '1.45'
    check: 2.4-0.95
    difficulty: 3
    hints:
    - Whole − one piece = other piece.
    - 2.40 − 0.95.
    solution: 'Step 1: 2.40 − 0.95. Step 2: = 1.45 m.'
    mistakes:
      '1.55': c7m3_align
      '3.35': c7m3_align
