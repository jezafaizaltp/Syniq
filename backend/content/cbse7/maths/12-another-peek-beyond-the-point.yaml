# CBSE Class 7 Mathematics (NCERT Ganita Prakash Part 2, chapter 4), SYNiq chapter 12. Format: content/README.md.
subject: cbse7-math
chapter: 12
title: Another Peek Beyond the Point
tips:
  c7_decimal_shift: × 10, 100, 1000 moves the point right by 1, 2, 3 places; ÷ moves it left. Count the zeros.
  c7_decimal_places: Count all the decimal places in both numbers and put that many in the answer.
  t7_area_decimal: "Area = length × breadth. Count decimal places: one + one = two."
  t7_cost_decimal: "Multiply ₹102.5 by 4. Keep the decimal point in the right place."
  t7_decimal_places_multiply: "Count the decimal places in both numbers and give the answer that many places."
  t7_decimal_times_whole: "3.5 × 4: multiply 35 × 4, then put back one decimal place."
  t7_divide_by_point5: "Dividing by 0.5 asks how many halves fit. Multiplying by 0.5 halves it."
  t7_divide_decimal: "Share 7.5 into 3 equal parts. Keep the point lined up."
  t7_divide_to_decimal: "7 ÷ 4: after 1 whole, keep dividing the remainder by adding zeros after a point."
  t7_pieces_quarter: "How many quarters of a metre fit in 1 m? And in 3 m?"
concepts:
- code: cbse7m.dec2.multiply
  title: Multiplying decimals
  notes: |
    Multiplying by 10, 100, 1000 moves the decimal point 1, 2, 3 places right (2.35 × 100 = 235). To multiply
    decimals, multiply as whole numbers, then count the total decimal places in both factors and put that many
    in the answer: 1.2 × 0.3: 12 × 3 = 36, 2 places → 0.36. Multiplying by a decimal less than 1 gives a smaller
    answer. Area: a rectangle 2.5 m by 1.4 m has area 3.5 m².
  explanations:
    text: 'To multiply decimals, ignore the points and multiply, then put back as many decimal places as the two numbers had together. 1.2 × 0.3: 12 × 3 = 36, and there are 2 decimal places, so 0.36.'
    visual: 'Draw a square of 1 by 1 split into 100 small squares. Shade 1.2 is too wide, so think 0.3 × 0.2: 3 columns by 2 rows overlap in 6 of the 100 squares: 0.06.'
    step_by_step: 'Step 1: Multiply the numbers as if there were no decimal points. Step 2: Count decimal places in both numbers. Step 3: Put that many decimal places in the answer. Step 4: Estimate to check.'
    real_world: 'Petrol at ₹102.5 a litre: 4 litres cost 102.5 × 4 = ₹410.'
  picture:
    kind: flow
    steps:
    - 1.2 × 0.3
    - 'Ignore points: 12 × 3 = 36'
    - 'Decimal places: 1 + 1 = 2'
    - 'Answer: 0.36'
    - 'Check: about 1 × 0.3 = 0.3'
    alt: 'Multiplying 1.2 by 0.3: multiply 12 by 3 to get 36, count two decimal places, and get 0.36.'
  activity:
    type: sort
    prompt: Multiply the decimals. Which answer does each one make?
    bins:
    - '0.2'
    - '0.36'
    - '3'
    items:
    - label: 0.5 × 0.4
      bin: '0.2'
      clue: 5 × 4 = 20, then count decimal places.
      why: 'Two places: 0.20.'
    - label: 0.1 × 2
      bin: '0.2'
      clue: A tenth, twice.
      why: 0.2.
    - label: 0.25 × 0.8
      bin: '0.2'
      clue: 25 × 8 = 200; three decimal places.
      why: 0.200.
    - label: 1.2 × 0.3
      bin: '0.36'
      clue: 12 × 3 = 36; how many decimal places in all?
      why: 'Two: 0.36.'
    - label: 0.6 × 0.6
      bin: '0.36'
      clue: 6 × 6, then two places.
      why: 0.36.
    - label: 0.9 × 0.4
      bin: '0.36'
      clue: 9 × 4, then two places.
      why: 0.36.
    - label: 2.5 × 1.2
      bin: '3'
      clue: 25 × 12 = 300; two places.
      why: 3.00.
    - label: 1.5 × 2
      bin: '3'
      clue: One decimal place in all.
      why: 3.0.
    - label: 0.6 × 5
      bin: '3'
      clue: 6 × 5 = 30; one place.
      why: 3.0.
  items:
  - prompt: Find 2.35 × 100.
    answer: '235'
    check: 2.35*100
    difficulty: 1
    hints:
    - Move the point 2 places right.
    - × 100.
    solution: 2.35 × 100 = 235.
    mistakes:
      '23.5': c7_decimal_shift
  - prompt: Find 1.2 × 0.3.
    answer: '0.36'
    check: 1.2*0.3
    difficulty: 1
    hints:
    - 12 × 3 = 36.
    - 2 decimal places.
    solution: "12 × 3 = 36. There are 2 decimal places in total (1 in 1.2 and 1 in 0.3), so the answer is 0.36."
    mistakes:
      '3.6': c7_decimal_places
  - prompt: Find 0.4 × 0.5.
    answer: '0.2'
    check: 0.4*0.5
    difficulty: 2
    hints:
    - 4 × 5 = 20.
    - '2 places: 0.20.'
    solution: 0.20 = 0.2.
    mistakes: {"2": "t7_decimal_places_multiply", "0.02": "t7_decimal_places_multiply"}
  - prompt: Find 3.5 × 4.
    answer: '14'
    check: 3.5*4
    difficulty: 1
    hints:
    - 35 × 4 = 140.
    - '1 place: 14.0.'
    solution: 3.5 × 4 = 14.
    mistakes: {"140": "t7_decimal_times_whole", "1.4": "t7_decimal_times_whole"}
  - prompt: A rectangle is 2.5 m by 1.4 m. Find its area in m².
    answer: '3.5'
    check: 2.5*1.4
    difficulty: 2
    hints:
    - 25 × 14 = 350.
    - 2 places.
    solution: 2.5 × 1.4 = 3.50 m².
    mistakes: {"35": "t7_area_decimal", "3.9": "rectangle_area_not_perimeter"}
  - prompt: Petrol costs ₹102.5 per litre. Find the cost of 4 litres in rupees.
    answer: '410'
    check: 102.5*4
    difficulty: 1
    hints:
    - 102.5 × 4.
    - 1025 × 4 = 4100.
    solution: 102.5 × 4 = ₹410.
    mistakes: {"4100": "t7_cost_decimal", "408": "t7_cost_decimal"}
- code: cbse7m.dec2.divide
  title: Dividing decimals
  after:
  - cbse7m.dec2.multiply
  notes: |
    Dividing by 10, 100, 1000 moves the point left (45.6 ÷ 100 = 0.456). Decimal ÷ whole number: divide as usual,
    keeping the point in place (7.5 ÷ 3 = 2.5). Dividing by a decimal: multiply both numbers by 10 or 100 to make
    the divisor whole (4.8 ÷ 0.6 = 48 ÷ 6 = 8). Dividing by a number less than 1 gives a bigger answer. Long
    division can continue past the point by adding zeros (7 ÷ 4 = 1.75).
  explanations:
    text: 'To divide by a decimal, make it a whole number first by moving both points the same number of places: 4.8 ÷ 0.6 becomes 48 ÷ 6 = 8. The answer doesn''t change because you scaled both numbers equally.'
    visual: 'How many 0.6 m pieces fit in a 4.8 m rope? Mark every 0.6 m along it: 8 marks. That is the same as 48 ÷ 6.'
    step_by_step: 'Step 1: If the divisor has decimals, multiply both numbers by 10 or 100 until it is whole. Step 2: Divide as usual. Step 3: Keep the point in the dividend lined up in the answer. Step 4: Add zeros to continue if needed.'
    real_world: ₹7.50 shared equally by 3 children is ₹2.50 each.
  picture:
    kind: flow
    steps:
    - 4.8 ÷ 0.6
    - Multiply both by 10
    - 48 ÷ 6
    - = 8
    - 'Check: 0.6 × 8 = 4.8'
    alt: 'Dividing 4.8 by 0.6: multiply both by 10 to get 48 ÷ 6, which is 8.'
  activity:
    type: sort
    prompt: Divide. Move both points first. Which answer does each one make?
    bins:
    - '3'
    - '8'
    - '60'
    items:
    - label: 1.5 ÷ 0.5
      bin: '3'
      clue: 'Move both points one place: 15 ÷ 5.'
      why: '3.'
    - label: 0.9 ÷ 0.3
      bin: '3'
      clue: 9 ÷ 3.
      why: '3.'
    - label: 2.4 ÷ 0.8
      bin: '3'
      clue: 24 ÷ 8.
      why: '3.'
    - label: 4.8 ÷ 0.6
      bin: '8'
      clue: 48 ÷ 6.
      why: '8.'
    - label: 0.8 ÷ 0.1
      bin: '8'
      clue: How many tenths in 0.8?
      why: '8.'
    - label: 5.6 ÷ 0.7
      bin: '8'
      clue: 56 ÷ 7.
      why: '8.'
    - label: 2.4 ÷ 0.04
      bin: '60'
      clue: 'Move both points two places: 240 ÷ 4.'
      why: '60.'
    - label: 3.6 ÷ 0.06
      bin: '60'
      clue: 'Two places: 360 ÷ 6.'
      why: '60.'
    - label: 1.2 ÷ 0.02
      bin: '60'
      clue: 'Two places: 120 ÷ 2.'
      why: '60.'
  items:
  - prompt: Find 45.6 ÷ 100.
    answer: '0.456'
    check: 45.6/100
    difficulty: 1
    hints:
    - Move the point 2 places left.
    - ÷ 100.
    solution: 45.6 ÷ 100 = 0.456.
    mistakes:
      '4.56': c7_decimal_shift
  - prompt: Find 7.5 ÷ 3.
    answer: '2.5'
    check: 7.5/3
    difficulty: 1
    hints:
    - 75 ÷ 3 = 25.
    - Keep the point.
    solution: 7.5 ÷ 3 = 2.5.
    mistakes: {"25": "t7_divide_decimal", "0.25": "t7_divide_decimal"}
  - prompt: Find 4.8 ÷ 0.6.
    answer: '8'
    check: 4.8/0.6
    difficulty: 2
    hints:
    - Multiply both by 10.
    - 48 ÷ 6.
    solution: 48 ÷ 6 = 8.
    mistakes:
      '0.8': c7_decimal_places
  - prompt: Find 7 ÷ 4 as a decimal.
    answer: '1.75'
    check: 7/4
    difficulty: 2
    hints:
    - 7 ÷ 4 = 1 remainder 3.
    - 'Continue: 30 ÷ 4, 20 ÷ 4.'
    solution: 7 ÷ 4 = 1.75.
    mistakes: {"1.3": "t7_divide_to_decimal", "0.57": "t7_divide_to_decimal"}
  - prompt: How many pieces of 0.25 m can be cut from 3 m of ribbon?
    answer: '12'
    check: 3/0.25
    difficulty: 2
    hints:
    - 3 ÷ 0.25.
    - 300 ÷ 25.
    solution: 3 ÷ 0.25 = 12 pieces.
    mistakes: {"0.75": "t7_pieces_quarter", "120": "t7_pieces_quarter"}
  - prompt: 'Which is larger: 6 ÷ 0.5 or 6 × 0.5?'
    options:
    - 6 ÷ 0.5
    - 6 × 0.5
    - They are equal
    - Cannot tell
    answer: 6 ÷ 0.5
    difficulty: 1
    hints:
    - "Work out both. Dividing by 0.5 asks: how many halves fit into 6?"
    - 6 × 0.5 = 3.
    solution: 'Dividing by a number less than 1 makes it bigger: 12 vs 3.'
    mistakes: {"6 × 0.5": "t7_divide_by_point5", "They are equal": "t7_divide_by_point5"}
