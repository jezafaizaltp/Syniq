# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 6. Format: content/README.md.
subject: cbse7-math
chapter: 6
title: Number Play
tips:
  c7_parity: 'Odd × odd is always odd: an even product needs at least one even number.'
  t7_count_odds: "Every second number is odd. How many is half of 50?"
  t7_digit_sum: "Add the digits one at a time: 4 + 7 + 2 + 5."
  t7_digit_sum_9: "A digit sum that is a multiple of 9 tells you about dividing by 9."
  t7_even_plus_odd: "2 × 7 is even. Even + odd = ?"
  t7_five_odds: "Pair up the odd numbers: two pairs make even, and one odd is left. Can the total be 20?"
  t7_magic_centre: "The centre is in 4 lines. Which number is the middle of 1 to 9?"
  t7_magic_sum: "1 + 2 + … + 9 = 45, shared equally among 3 rows."
  t7_odd_plus_odd: "Odd + odd: pair up the leftover ones. What do two leftovers make?"
  t7_parity_sum: "Even + even is even. What must the third number be for the total to be odd?"
  t7_row_missing: "The row must total 15. Take 2 and 7 away from 15."
  t7_virahanka: "Each number is the sum of the two before it. Add the last two."
  c7m6_pairs: Think in pairs. Split each number into twos and see whether one is left over, then check what happens to the leftover ones.
  c7m6_count_odd: Count how many odd numbers are being added, then think about their leftover ones. Can those leftovers all pair up?
  c7m6_times: Look at each factor in the product. If any one factor splits into pairs exactly, the whole product does too.
  c7m6_magic: In a 3 × 3 magic square using 1 to 9, every line adds to the same total. Use what the other two numbers already make.
  c7m6_add_two: Each new number is made from the two numbers just before it. Add those two.
  c7m6_digits: Add the digits one at a time, then check what that total divides by.
concepts:
- code: cbse7m.play.parity
  title: Even, odd and parity
  notes: |
    Even numbers can be split into pairs (end in 0, 2, 4, 6, 8); odd numbers leave one over. Parity rules:
    even + even = even; odd + odd = even; even + odd = odd; even × anything = even; odd × odd = odd. The sum of
    several numbers is odd exactly when an odd count of them are odd. Parity solves puzzles: you cannot make an
    odd total from only even numbers, and 5 odd numbers can never add to 20.
  explanations:
    text: Even numbers pair up perfectly; odd numbers always have one left over. Two odd numbers together make even (the two leftovers pair up). This simple idea, called parity, can tell you whether a puzzle is even possible.
    visual: 'Draw 7 dots as pairs: three pairs and one lonely dot. Add another 5 dots (two pairs and one lonely). The two lonely dots now pair up: 12, even.'
    step_by_step: 'Step 1: Count how many of the numbers are odd. Step 2: If that count is even, the sum is even; if odd, the sum is odd. Step 3: For products, one even factor makes the product even.'
    real_world: 'Sharing sweets: if two friends each have an odd number of sweets, together they can always split them equally, because odd + odd is even.'
  picture:
    kind: compare
    columns:
    - title: Sums
      points:
      - even + even = even
      - odd + odd = even
      - even + odd = odd
    - title: Products
      points:
      - even × even = even
      - even × odd = even
      - odd × odd = odd
    alt: 'Parity rules: odd plus odd is even, even plus odd is odd; a product is odd only when both numbers are odd.'
  activity:
    type: sort
    prompt: Will the answer be even or odd? Think about leftovers.
    bins:
    - Even
    - Odd
    items:
    - label: odd + odd
      bin: Even
      clue: Two leftovers pair up.
      why: Even.
    - label: even + even
      bin: Even
      clue: No leftovers at all.
      why: Even.
    - label: odd × even
      bin: Even
      clue: Groups of a pairable number.
      why: Even.
    - label: 17 + 29
      bin: Even
      clue: Each has one left over. What do two leftovers make?
      why: '46.'
    - label: odd + even
      bin: Odd
      clue: Only one leftover.
      why: Odd.
    - label: odd + odd + odd
      bin: Odd
      clue: 'Three leftovers: two pair up, one doesn''t.'
      why: Odd.
    - label: odd × odd
      bin: Odd
      clue: An unpaired number of unpaired groups.
      why: 'Odd: 3 × 5 = 15.'
    - label: 1 + 2 + 3 + … + 10
      bin: Odd
      clue: How many of these numbers have a leftover? 1, 3, 5, 7, 9.
      why: 'Five leftovers: the total, 55, is odd.'
  lesson:
    - teach: 'Even numbers can be put into pairs with nothing left over: 8 is four pairs. Odd numbers always leave one over: 7 is three pairs and one extra. Even numbers end in 0, 2, 4, 6 or 8; odd numbers end in 1, 3, 5, 7 or 9.'
      picture:
        kind: compare
        columns:
        - title: Even (8)
          points:
          - ●● ●● ●● ●●
          - 4 pairs, none left over
        - title: Odd (7)
          points:
          - ●● ●● ●● ●
          - 3 pairs, 1 left over
        alt: Eight dots make four pairs; seven dots make three pairs and one left over.
      check:
        prompt: Is 346 even or odd?
        options:
        - Even
        - Odd
        answer: Even
        why: It ends in 6, so it splits into pairs exactly.
    - teach: 'When you add, the leftover ones decide. Odd + odd: the two leftovers make a new pair, so the sum is even. Even + odd: one leftover stays, so the sum is odd. For many numbers: the sum is odd exactly when there is an odd count of odd numbers.'
      picture:
        kind: compare
        columns:
        - title: Adding
          points:
          - even + even = even
          - odd + odd = even
          - even + odd = odd
        - title: Multiplying
          points:
          - even × anything = even
          - odd × odd = odd
        alt: Parity rules for adding and multiplying.
      check:
        prompt: Is 15 + 27 even or odd?
        options:
        - Even
        - Odd
        answer: Even
        why: 'Two odd numbers: the two leftovers pair up.'
    - teach: Parity solves puzzles without adding. Can 3 odd numbers add to 30? Three odds is an odd count of odds, so the sum is odd, and 30 is even. So it is impossible, whatever numbers you try.
      check:
        prompt: Can four odd numbers add up to 21?
        options:
        - No, four odd numbers always give an even sum
        - Yes, for example 5 + 5 + 5 + 6
        - Yes, if the numbers are large
        answer: No, four odd numbers always give an even sum
        why: An even count of odd numbers gives an even sum, and 21 is odd. (6 is not odd.)
  items:
  - prompt: Is 37 + 49 even or odd?
    options:
    - Even
    - Odd
    - Neither
    - Cannot tell
    answer: Even
    difficulty: 1
    hints:
    - Both are odd.
    - odd + odd = ?
    solution: odd + odd = even (37 + 49 = 86).
    mistakes: {"Odd": "t7_odd_plus_odd", "Cannot tell": "t7_odd_plus_odd"}
  - prompt: Is 23 × 15 even or odd?
    options:
    - Odd
    - Even
    - Neither
    - Cannot tell
    answer: Odd
    difficulty: 1
    hints:
    - Both are odd.
    - odd × odd = ?
    solution: odd × odd = odd (345).
    mistakes:
      Even: c7_parity
  - prompt: Can five odd numbers add up to 20?
    options:
    - No, the sum of five odd numbers is odd
    - Yes, 4 + 4 + 4 + 4 + 4
    - Yes, if they are big
    - Only with negative numbers
    answer: No, the sum of five odd numbers is odd
    difficulty: 2
    hints:
    - An odd count of odd numbers.
    - 20 is even.
    solution: Five odd numbers always add to an odd number, so never 20.
    mistakes: {"Yes, 4 + 4 + 4 + 4 + 4": "t7_five_odds", "Yes, if they are big": "t7_five_odds"}
  - prompt: Is 2 × 7 + 9 even or odd?
    options:
    - Odd
    - Even
    - Neither
    - Cannot tell
    answer: Odd
    difficulty: 2
    hints:
    - 2 × 7 is even.
    - even + odd.
    solution: '14 is even, 9 is odd: even + odd = odd (23).'
    mistakes: {"Even": "t7_even_plus_odd", "Cannot tell": "t7_even_plus_odd"}
  - prompt: How many odd numbers are there from 1 to 50?
    answer: '25'
    check: 50/2
    difficulty: 1
    hints:
    - Every other number is odd.
    - 50 ÷ 2.
    solution: 'Half of 50 numbers are odd: 25.'
    mistakes: {"50": "t7_count_odds", "24": "t7_count_odds"}
  - prompt: The sum of three numbers is odd. Two of them are even. Is the third even or odd?
    options:
    - Odd
    - Even
    - Either
    - Cannot tell
    answer: Odd
    difficulty: 2
    hints:
    - even + even = even.
    - even + ? = odd.
    solution: even + even = even, and only even + odd gives odd.
    mistakes: {"Even": "t7_parity_sum", "Either": "t7_parity_sum"}
  - prompt: Is 58 + 34 even or odd?
    options:
    - Even
    - Odd
    - It cannot be told without adding
    answer: Even
    difficulty: 1
    hints:
    - Both numbers end in an even digit.
    - What does even + even give?
    solution: Both are even, and even + even is even (58 + 34 = 92).
    mistakes:
      Odd: c7m6_pairs
      It cannot be told without adding: c7m6_pairs
  - prompt: Is 41 + 26 even or odd?
    options:
    - Odd
    - Even
    - Neither
    answer: Odd
    difficulty: 1
    hints:
    - One number is odd, one is even.
    - The one leftover from the odd number has no partner.
    solution: Odd + even is odd (41 + 26 = 67).
    mistakes:
      Even: c7m6_pairs
      Neither: c7m6_pairs
  - prompt: Is 16 × 33 even or odd?
    options:
    - Even
    - Odd
    - It depends on the answer's last digit only
    answer: Even
    difficulty: 1
    hints:
    - Look at each factor.
    - Is either factor even?
    solution: 16 is even, and even × anything is even (16 × 33 = 528).
    mistakes:
      Odd: c7m6_times
      It depends on the answer's last digit only: c7m6_times
  - prompt: How many even numbers are there from 1 to 30?
    answer: '15'
    check: 30/2
    difficulty: 1
    hints:
    - Even numbers are 2, 4, 6, …
    - Every pair 1–2, 3–4, … has one even number.
    solution: 'Step 1: 1 to 30 makes 15 pairs (1–2, 3–4, …, 29–30). Step 2: each pair has one even number, so 15.'
    mistakes:
      '30': c7m6_pairs
      '14': c7m6_pairs
  - prompt: Is 13 + 25 + 37 even or odd?
    options:
    - Odd
    - Even
    - Neither
    answer: Odd
    difficulty: 2
    hints:
    - Count how many of the numbers are odd.
    - Three is an odd count.
    solution: All three are odd. An odd count of odd numbers gives an odd sum (13 + 25 + 37 = 75).
    mistakes:
      Even: c7m6_count_odd
      Neither: c7m6_count_odd
  - prompt: Is 7 × 9 × 11 even or odd?
    options:
    - Odd
    - Even
    - Cannot tell
    answer: Odd
    difficulty: 2
    hints:
    - Look for any even factor.
    - Odd × odd stays odd.
    solution: None of the factors is even, and odd × odd is odd every time (7 × 9 × 11 = 693).
    mistakes:
      Even: c7m6_times
      Cannot tell: c7m6_times
  - prompt: Is 3 × 8 + 5 even or odd?
    options:
    - Odd
    - Even
    - Neither
    answer: Odd
    difficulty: 2
    hints:
    - Work out the parity of 3 × 8 first.
    - Then add an odd number to it.
    solution: 'Step 1: 3 × 8 is even (one factor is even). Step 2: even + odd = odd (24 + 5 = 29).'
    mistakes:
      Even: c7m6_times
      Neither: c7m6_pairs
  - prompt: Riya adds six odd numbers. Is the total even or odd?
    options:
    - Even
    - Odd
    - It depends on which numbers
    answer: Even
    difficulty: 2
    hints:
    - Count the odd numbers.
    - Six is an even count.
    solution: The six leftovers make three new pairs, so the total is even whichever odd numbers she picks.
    mistakes:
      Odd: c7m6_count_odd
      It depends on which numbers: c7m6_count_odd
  - prompt: How many odd numbers are there from 1 to 99?
    answer: '50'
    check: (99+1)/2
    difficulty: 2
    hints:
    - 'Pair them: 1–2, 3–4, …'
    - 99 has no partner, but it is odd.
    solution: 'Step 1: 1 to 98 makes 49 pairs, each with one odd number. Step 2: 99 is one more odd number. Step 3: 49 + 1 = 50.'
    mistakes:
      '49': c7m6_pairs
      '99': c7m6_pairs
  - prompt: Can you pick five numbers from 1, 3, 5, 7, 9 (repeats allowed) that add to 30?
    options:
    - No, five odd numbers always add to an odd number
    - Yes, 9 + 9 + 9 + 3 + 0
    - Yes, 7 + 7 + 7 + 5 + 4
    answer: No, five odd numbers always add to an odd number
    difficulty: 3
    hints:
    - Every number you may use is odd.
    - Five is an odd count of odd numbers.
    solution: Five odd numbers give an odd sum, and 30 is even, so it is impossible (0 and 4 are not in the list).
    mistakes:
      Yes, 9 + 9 + 9 + 3 + 0: c7m6_count_odd
      Yes, 7 + 7 + 7 + 5 + 4: c7m6_count_odd
  - prompt: A grid of 3 rows and 5 columns of squares. Is the number of squares even or odd?
    options:
    - Odd
    - Even
    - It depends on the size of the squares
    answer: Odd
    difficulty: 3
    hints:
    - The number of squares is rows × columns.
    - Are 3 and 5 both odd?
    solution: 3 × 5 = 15 squares. Both sides are odd, and odd × odd is odd.
    mistakes:
      Even: c7m6_times
      It depends on the size of the squares: c7m6_times
  - prompt: a is odd and b is even. Which of these must be odd?
    options:
    - a + b
    - a × b
    - b + b
    answer: a + b
    difficulty: 3
    hints:
    - Test each with small numbers, like a = 3 and b = 4.
    - One option adds an odd to an even.
    solution: a + b = odd + even = odd. a × b has an even factor, so it is even; b + b is even + even, so even.
    mistakes:
      a × b: c7m6_times
      b + b: c7m6_pairs
- code: cbse7m.play.patterns
  title: Magic squares and number patterns
  after:
  - cbse7m.play.parity
  notes: |
    A 3 × 3 magic square uses 1 to 9 so every row, column and diagonal has the same sum, the magic sum 15
    (because 1 + … + 9 = 45, shared by 3 rows). The centre must be 5. Virahanka (Fibonacci) numbers: each is the
    sum of the two before: 1, 2, 3, 5, 8, 13, 21, … (number of ways to make a rhythm of n beats from short and
    long syllables). Digit puzzles: the sum of digits tells divisibility by 3 and 9.
  explanations:
    text: In a magic square every row, column and diagonal adds to the same number. Using 1 to 9 in a 3 × 3 square, that number must be 15, since 1 + 2 + ... + 9 = 45 shared equally among three rows.
    visual: 'Write the famous square: top row 2 7 6, middle 9 5 1, bottom 4 3 8. Check: each row, each column and both diagonals add to 15, with 5 in the centre.'
    step_by_step: 'Step 1: Add all the numbers used. Step 2: Divide by the number of rows to get the magic sum. Step 3: Put the middle number in the centre. Step 4: Fill pairs that add up correctly around it.'
    real_world: 'Ancient Indian poets counted rhythms of short and long syllables and found the sequence 1, 2, 3, 5, 8, 13: the Virahanka numbers, centuries before Fibonacci.'
  picture:
    kind: area_grid
    cols:
    - size: 1
      label: '15'
    - size: 1
      label: '15'
    - size: 1
      label: '15'
    rows:
    - size: 1
      label: '15'
    - size: 1
      label: '15'
    - size: 1
      label: '15'
    cells:
    - - '2'
      - '7'
      - '6'
    - - '9'
      - '5'
      - '1'
    - - '4'
      - '3'
      - '8'
    caption: 'A magic square: every row, column and diagonal adds to 15.'
    alt: A 3 by 3 magic square with rows 2 7 6, 9 5 1 and 4 3 8, each row and column labelled with the sum 15.
  activity:
    type: formula
    prompt: 'A 3 × 3 magic square using 1 to 9. Rows: 8, 1, 6 / 3, x, 7 / 4, 9, y. Every line must add to 15.'
    inputs:
    - name: x
      label: Middle x
      min: 1
      max: 9
      step: 1
      start: 1
    - name: y
      label: Corner y
      min: 1
      max: 9
      step: 1
      start: 1
    outputs:
    - name: r2
      label: 'Row 2: 3 + x + 7'
      expr: 3+x+7
    - name: r3
      label: 'Row 3: 4 + 9 + y'
      expr: 4+9+y
    - name: dg
      label: 'Diagonal: 8 + x + y'
      expr: 8+x+y
    - name: c3
      label: 'Column 3: 6 + 7 + y'
      expr: 6+7+y
    goals:
    - prompt: Make row 2 add to 15.
      want:
        r2: 15
      mistakes:
      - when:
          x:
          - 6
          - 9
        say: 'Too big: 3 + 7 is already 10.'
      - when:
          x:
          - 1
          - 4
        say: 'Not enough: 3 + 7 + x has to reach 15.'
    - prompt: Now make every line add to 15.
      want:
        r2: 15
        r3: 15
        dg: 15
        c3: 15
      mistakes:
      - when:
          x: 5
          y: 5
        say: Each number 1 to 9 is used once, and 5 is already in the middle. 4 + 9 + y = 15.
      - when:
          x: 5
          y:
          - 3
          - 9
        say: 'Row 3 goes over: 4 + 9 is 13 already.'
  lesson:
    - teach: A 3 × 3 magic square puts 1 to 9 in a grid so every row, column and diagonal has the same sum. All nine numbers add to 45, and the 3 rows share that total, so each row adds to 45 ÷ 3 = 15. The centre must be 5, the middle number.
      picture:
        kind: compare
        columns:
        - title: Top row
          points:
          - 2  7  6
          - 2 + 7 + 6 = 15
        - title: Middle row
          points:
          - 9  5  1
          - 9 + 5 + 1 = 15
        - title: Bottom row
          points:
          - 4  3  8
          - 4 + 3 + 8 = 15
        alt: 'A magic square: rows 2 7 6, 9 5 1, 4 3 8. Every row, column and diagonal adds to 15.'
      check:
        prompt: In the square 2 7 6 / 9 5 1 / 4 3 8, what does the diagonal 2, 5, 8 add to?
        options:
        - '15'
        - '14'
        - '16'
        answer: '15'
        why: 2 + 5 + 8 = 15, the magic sum.
    - teach: 'Virahanka numbers grow by adding the two numbers before: 1, 2, 3, 5, 8, 13, 21, 34, … They count the ways to fill a rhythm of n beats with short (1 beat) and long (2 beat) syllables. Virahanka described them centuries before Fibonacci.'
      picture:
        kind: flow
        steps:
        - '1'
        - '2'
        - 1 + 2 = 3
        - 2 + 3 = 5
        - 3 + 5 = 8
        - 5 + 8 = 13
        alt: Each Virahanka number is the sum of the two before it.
      check:
        prompt: What comes after 13 and 21?
        options:
        - '34'
        - '29'
        - '42'
        answer: '34'
        why: 13 + 21 = 34.
    - teach: 'Digit sums help with division. A number divides by 3 when its digit sum divides by 3, and by 9 when its digit sum divides by 9. 5,832: 5 + 8 + 3 + 2 = 18, which divides by 9, so 5,832 divides by 9.'
      check:
        prompt: Is 1,234 divisible by 3?
        options:
        - 'No'
        - 'Yes'
        answer: 'No'
        why: 1 + 2 + 3 + 4 = 10, and 10 does not divide by 3.
  items:
  - prompt: What is the magic sum of a 3 × 3 magic square using 1 to 9?
    answer: '15'
    check: 45/3
    difficulty: 1
    hints:
    - 1 + 2 + ... + 9 = 45.
    - 45 ÷ 3 rows.
    solution: 45 ÷ 3 = 15.
    mistakes: {"45": "t7_magic_sum", "9": "t7_magic_sum"}
  - prompt: Which number must be in the centre of a 3 × 3 magic square using 1 to 9?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - It is the middle of 1 to 9.
    - It belongs to four lines.
    solution: The centre must be 5, the middle number.
    mistakes: {"9": "t7_magic_centre", "1": "t7_magic_centre"}
  - prompt: In the row 2, 7, ? of a magic square with sum 15, find the missing number.
    answer: '6'
    check: 15 - 2 - 7
    difficulty: 1
    hints:
    - 15 − 2 − 7.
    - Row sum is 15.
    solution: 15 − 9 = 6.
    mistakes: {"9": "t7_row_missing", "5": "t7_row_missing"}
  - prompt: Virahanka numbers go 1, 2, 3, 5, 8, 13, … What comes next?
    answer: '21'
    check: 8 + 13
    difficulty: 1
    hints:
    - Add the two before.
    - 8 + 13.
    solution: 8 + 13 = 21.
    mistakes: {"18": "t7_virahanka", "26": "t7_virahanka"}
  - prompt: What is the sum of the digits of 4,725?
    answer: '18'
    check: 4+7+2+5
    difficulty: 1
    hints:
    - 4 + 7 + 2 + 5.
    - Add them.
    solution: 4 + 7 + 2 + 5 = 18.
    mistakes: {"17": "t7_digit_sum", "9": "t7_digit_sum"}
  - prompt: The digit sum of 4,725 is 18. What does this tell you?
    options:
    - 4,725 is divisible by 9
    - 4,725 is even
    - 4,725 is divisible by 10
    - 4,725 is prime
    answer: 4,725 is divisible by 9
    difficulty: 2
    hints:
    - 18 is divisible by 9.
    - Digit-sum rule for 3 and 9.
    solution: If the digit sum is divisible by 9, so is the number (4,725 = 9 × 525).
    mistakes: {"4,725 is even": "t7_digit_sum_9", "4,725 is prime": "t7_digit_sum_9"}
  - prompt: In a 3 × 3 magic square with sum 15, one row has 8 and 3. What is the third number?
    answer: '4'
    check: 15-8-3
    difficulty: 1
    hints:
    - The row must add to 15.
    - 8 + 3 = 11. What makes it up to 15?
    solution: 'Step 1: 8 + 3 = 11. Step 2: 15 − 11 = 4.'
    mistakes:
      '11': c7m6_magic
      '26': c7m6_magic
  - prompt: 'Virahanka numbers: 1, 2, 3, 5, 8, 13, 21, … What comes after 21?'
    answer: '34'
    check: 13+21
    difficulty: 1
    hints:
    - Add the two numbers just before.
    - 13 + 21.
    solution: 'Step 1: the two before are 13 and 21. Step 2: 13 + 21 = 34.'
    mistakes:
      '29': c7m6_add_two
      '42': c7m6_add_two
  - prompt: What is the digit sum of 3,051?
    answer: '9'
    check: 3+0+5+1
    difficulty: 1
    hints:
    - Add each digit.
    - 3 + 0 + 5 + 1.
    solution: 'Step 1: 3 + 0 = 3. Step 2: 3 + 5 + 1 = 9.'
    mistakes:
      '8': c7m6_digits
      '10': c7m6_digits
  - prompt: Is 7,425 divisible by 9?
    options:
    - 'Yes'
    - 'No'
    - Only by 3
    answer: 'Yes'
    difficulty: 2
    hints:
    - Find the digit sum.
    - Does the digit sum divide by 9?
    solution: 7 + 4 + 2 + 5 = 18, and 18 divides by 9, so 7,425 does too (7,425 = 9 × 825).
    mistakes:
      'No': c7m6_digits
      Only by 3: c7m6_digits
  - prompt: Is 2,021 divisible by 3?
    options:
    - 'No'
    - 'Yes'
    - Only by 9
    answer: 'No'
    difficulty: 2
    hints:
    - Find the digit sum.
    - Does 5 divide by 3?
    solution: 2 + 0 + 2 + 1 = 5, which does not divide by 3, so 2,021 does not either.
    mistakes:
      'Yes': c7m6_digits
      Only by 9: c7m6_digits
  - prompt: In a 3 × 3 magic square using 1 to 9, a diagonal has 4 in one corner and 5 in the centre. What is in the opposite corner?
    answer: '6'
    check: 15-4-5
    difficulty: 2
    hints:
    - The diagonal must add to 15.
    - 4 + 5 = 9. What makes it 15?
    solution: 'Step 1: 4 + 5 = 9. Step 2: 15 − 9 = 6.'
    mistakes:
      '9': c7m6_magic
