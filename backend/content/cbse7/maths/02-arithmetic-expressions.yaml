# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 2. Format: content/README.md.
subject: cbse7-math
chapter: 2
title: Arithmetic Expressions
tips:
  c7_order_ops: Multiply and divide before you add and subtract, unless brackets say otherwise.
  c7_minus_bracket: 'A minus sign in front of a bracket takes away everything inside: 50 − (12 + 8) = 50 − 12 − 8.'
  t7_brackets_first: "Work out the bracket first, then multiply."
  t7_compare_diff: "Taking away a smaller number leaves more. Which is smaller: 29 or 31?"
  t7_compare_sum: "97 is 2 more than 95, and 48 is 1 less than 49. Which sum gains more?"
  t7_cost_expression: "Find the cost of the pens and the cost of the books separately, then add: 3 × 10 + 2 × 45."
  t7_distribute_add: "6 × 103 = 6 × 100 + 6 × 3. Multiply BOTH parts by 6."
  t7_distribute_sub: "4 × 99 = 4 × 100 − 4 × 1. Take away 4, not 1."
  t7_grouping: "Add the numbers that make a round total first: 25 + 75. Then add the rest."
  t7_rearrange: "Multiply 8 × 25 first to get a round number, then multiply by 7."
  c7m2_order: Brackets first, then × and ÷, then + and − from left to right.
  c7m2_minus: A minus sign before a bracket changes the sign of every term inside.
  c7m2_terms: Split the expression into terms that are added; each × or ÷ part stays together as one term.
  c7m2_distribute: Split the awkward number into a round number plus or minus a little, and multiply each part.
  c7m2_compare: 'Compare the parts: which number grew, which shrank, and by how much?'
  c7m2_story: 'Write one term for each kind of thing bought: number × price. Then add the terms.'
concepts:
- code: cbse7m.expr.order
  title: Expressions, terms and brackets
  notes: |
    An arithmetic expression combines numbers with +, −, ×, ÷ (for example 13 + 2 × 4). Its value is the number
    it equals. Rule: brackets first; then × and ÷; then + and −. An expression can be split into terms that are
    added: 30 − 4 × 5 + 2 has terms 30, −(4 × 5) and 2. Terms can be added in any order (swapping and
    grouping) without changing the value. A minus sign before a bracket changes every sign inside:
    20 − (5 + 3) = 20 − 5 − 3.
  explanations:
    text: 'An expression like 13 + 2 × 4 is a recipe for a number. Do multiplication before addition: 2 × 4 = 8, then 13 + 8 = 21. Brackets change the order: (13 + 2) × 4 = 60.'
    visual: 'Picture a shopkeeper''s bill: 3 pens at ₹10 and 2 books at ₹45 is 3 × 10 + 2 × 45. Each item group is one term; add the terms to get the total.'
    step_by_step: 'Step 1: Work out anything inside brackets. Step 2: Do × and ÷. Step 3: Split into terms. Step 4: Add the terms, remembering that a minus belongs to the term after it.'
    real_world: 'A cinema ticket costs ₹150 and popcorn ₹80. For 4 friends with 2 popcorns: 4 × 150 + 2 × 80 = 600 + 160 = ₹760.'
  picture:
    kind: flow
    steps:
    - 30 − 4 × 5 + 2
    - 'Multiply first: 4 × 5 = 20'
    - 'Terms: 30, −20, +2'
    - 'Add: 30 − 20 + 2'
    - Value = 12
    alt: 'Evaluating 30 − 4 × 5 + 2: multiply first, split into terms 30, −20 and 2, then add to get 12.'
  activity:
    type: sort
    prompt: What is the value of each expression?
    bins:
    - '5'
    - '21'
    - '35'
    - '60'
    items:
    - label: 13 + 2 × 4
      bin: '21'
      clue: Multiply before you add.
      why: 2 × 4 = 8, then 13 + 8 = 21.
    - label: 5 + 4 × 4
      bin: '21'
      clue: Which part do you work out first?
      why: 4 × 4 = 16, then 5 + 16 = 21.
    - label: 3 × 4 + 9
      bin: '21'
      clue: Multiply first.
      why: 12 + 9 = 21.
    - label: (13 + 2) × 4
      bin: '60'
      clue: Brackets first.
      why: 15 × 4 = 60.
    - label: (3 + 9) × 5
      bin: '60'
      clue: Brackets first.
      why: 12 × 5 = 60.
    - label: 6 + 6 × 9
      bin: '60'
      clue: Don't add 6 + 6 first.
      why: 6 × 9 = 54, then 6 + 54 = 60.
    - label: 5 × 7
      bin: '35'
      clue: Just one step.
      why: '35.'
    - label: 3 + 4 × 8
      bin: '35'
      clue: Multiply before adding.
      why: 4 × 8 = 32, then 3 + 32 = 35.
    - label: (3 + 4) × 5
      bin: '35'
      clue: Brackets first.
      why: 7 × 5 = 35.
    - label: 25 − 4 × 5
      bin: '5'
      clue: Multiply before subtracting.
      why: 4 × 5 = 20, then 25 − 20 = 5.
    - label: 40 ÷ 4 − 5
      bin: '5'
      clue: Divide before subtracting.
      why: 40 ÷ 4 = 10, then 10 − 5 = 5.
    - label: 45 ÷ (4 + 5)
      bin: '5'
      clue: Brackets first.
      why: 45 ÷ 9 = 5.
  lesson:
    - teach: 'An arithmetic expression combines numbers with +, −, × and ÷, like 13 + 2 × 4. Its value is the single number it equals. The rule: brackets first, then × and ÷, then + and −.'
      picture:
        kind: flow
        steps:
        - 13 + 2 × 4
        - 'multiply first: 2 × 4 = 8'
        - 'then add: 13 + 8'
        - = 21
        alt: In 13 + 2 × 4, multiply first to get 8, then add 13 to get 21.
      check:
        prompt: What is the value of 5 + 3 × 2?
        options:
        - '11'
        - '16'
        - '10'
        answer: '11'
        why: 3 × 2 = 6 first, then 5 + 6 = 11.
    - teach: An expression can be split into terms that are added. 30 − 4 × 5 + 2 has terms 30, −(4 × 5) and 2. Terms can be added in any order without changing the value.
      check:
        prompt: How many terms does 12 + 3 × 4 − 6 have?
        options:
        - '3'
        - '4'
        - '2'
        answer: '3'
        why: 12, 3 × 4 and −6.
    - teach: 'A minus sign before a bracket changes the sign of every term inside: 20 − (5 + 3) = 20 − 5 − 3 = 12, and 20 − (5 − 3) = 20 − 5 + 3 = 18.'
      picture:
        kind: compare
        columns:
        - title: With bracket
          points:
          - 20 − (5 + 3)
          - 20 − (5 − 3)
        - title: Bracket opened
          points:
          - 20 − 5 − 3 = 12
          - 20 − 5 + 3 = 18
        alt: 20 minus (5 plus 3) equals 20 minus 5 minus 3; 20 minus (5 minus 3) equals 20 minus 5 plus 3.
      check:
        prompt: Which equals 40 − (10 − 4)?
        options:
        - 40 − 10 + 4
        - 40 − 10 − 4
        - 40 + 10 − 4
        answer: 40 − 10 + 4
        why: The minus before the bracket turns −4 into +4.
  items:
  - prompt: Find the value of 13 + 2 × 4.
    answer: '21'
    check: 13 + 2*4
    difficulty: 1
    hints:
    - Multiply first.
    - 2 × 4 = 8.
    solution: 2 × 4 = 8, and 13 + 8 = 21.
    mistakes:
      '60': c7_order_ops
  - prompt: Find the value of (13 + 2) × 4.
    answer: '60'
    check: (13 + 2)*4
    difficulty: 1
    hints:
    - Brackets first.
    - 15 × 4.
    solution: 13 + 2 = 15, and 15 × 4 = 60.
    mistakes: {"21": "t7_brackets_first", "19": "t7_brackets_first"}
  - prompt: Find the value of 30 − 4 × 5 + 2.
    answer: '12'
    check: 30 - 4*5 + 2
    difficulty: 1
    hints:
    - Multiply 4 × 5 first.
    - 30 − 20 + 2.
    solution: 30 − 20 + 2 = 12.
    mistakes:
      '132': c7_order_ops
  - prompt: Find the value of 50 − (12 + 8).
    answer: '30'
    check: 50 - (12 + 8)
    difficulty: 1
    hints:
    - Brackets first.
    - 12 + 8 = 20.
    solution: 50 − 20 = 30.
    mistakes:
      '46': c7_minus_bracket
  - prompt: 3 pens cost ₹10 each and 2 books cost ₹45 each. Write and find the total cost in rupees.
    answer: '120'
    check: 3*10 + 2*45
    difficulty: 2
    hints:
    - 3 × 10 + 2 × 45.
    - 30 + 90.
    solution: 3 × 10 + 2 × 45 = 30 + 90 = ₹120.
    mistakes: {"55": "t7_cost_expression", "570": "t7_cost_expression"}
  - prompt: Which expression equals 20 − (5 + 3)?
    options:
    - 20 − 5 − 3
    - 20 − 5 + 3
    - 20 + 5 − 3
    - 20 + 5 + 3
    answer: 20 − 5 − 3
    difficulty: 2
    hints:
    - A minus before a bracket changes every sign inside.
    - Both 5 and 3 are taken away.
    solution: Taking away (5 + 3) means taking away 5 and taking away 3.
    mistakes:
      20 − 5 + 3: c7_minus_bracket
  - prompt: Find the value of 18 − 12 ÷ 3.
    answer: '14'
    check: 18-12/3
    difficulty: 1
    hints:
    - Divide before you subtract.
    - 12 ÷ 3 = 4.
    solution: 'Step 1: 12 ÷ 3 = 4. Step 2: 18 − 4 = 14.'
    mistakes:
      '2': c7m2_order
  - prompt: Find the value of (18 − 12) ÷ 3.
    answer: '2'
    check: (18-12)/3
    difficulty: 1
    hints:
    - Brackets come first.
    - 18 − 12 = 6.
    solution: 'Step 1: 18 − 12 = 6. Step 2: 6 ÷ 3 = 2.'
    mistakes:
      '14': c7m2_order
  - prompt: Find the value of 7 × 6 − 4 × 5.
    answer: '22'
    check: 7*6-4*5
    difficulty: 2
    hints:
    - Do both multiplications first.
    - 42 and 20.
    solution: 'Step 1: 7 × 6 = 42 and 4 × 5 = 20. Step 2: 42 − 20 = 22.'
    mistakes:
      '190': c7m2_order
      '110': c7m2_order
  - prompt: Find the value of 100 − (35 − 15).
    answer: '80'
    check: 100-(35-15)
    difficulty: 2
    hints:
    - Work out the bracket first, or open it carefully.
    - 100 − 35 + 15.
    solution: 'Step 1: 35 − 15 = 20. Step 2: 100 − 20 = 80. (Or 100 − 35 + 15 = 80.)'
    mistakes:
      '50': c7m2_minus
  - prompt: Riya buys 4 notebooks at ₹25 each and 3 pens at ₹10 each. What is the total cost in rupees?
    answer: '130'
    check: 4*25+3*10
    difficulty: 2
    hints:
    - One term for notebooks, one for pens.
    - 4 × 25 + 3 × 10.
    solution: 'Step 1: notebooks 4 × 25 = 100. Step 2: pens 3 × 10 = 30. Step 3: 100 + 30 = 130.'
    mistakes:
      '1030': c7m2_story
      '42': c7m2_story
  - prompt: Which expression has the value 26?
    options:
    - 2 + 3 × 8
    - (2 + 3) × 8
    - 2 × 3 + 8
    answer: 2 + 3 × 8
    difficulty: 2
    hints:
    - Find the value of each one.
    - 'Remember: × before +.'
    solution: 'Step 1: 2 + 24 = 26. Step 2: (5) × 8 = 40. Step 3: 6 + 8 = 14. Only the first is 26.'
    mistakes:
      (2 + 3) × 8: c7m2_order
      2 × 3 + 8: c7m2_order
  - prompt: Which equals 50 − (8 + 12 − 5)?
    options:
    - 50 − 8 − 12 + 5
    - 50 − 8 + 12 − 5
    - 50 + 8 + 12 − 5
    answer: 50 − 8 − 12 + 5
    difficulty: 3
    hints:
    - Every sign inside the bracket flips.
    - +8 → −8, +12 → −12, −5 → +5.
    solution: 'Step 1: flip each sign inside the bracket. Step 2: 50 − 8 − 12 + 5 (= 35).'
    mistakes:
      50 − 8 + 12 − 5: c7m2_minus
      50 + 8 + 12 − 5: c7m2_minus
  - prompt: A box holds 6 rows of 8 mangoes, and 5 are rotten. How many good mangoes are there?
    answer: '43'
    check: 6*8-5
    difficulty: 1
    hints:
    - 'Total mangoes: 6 × 8.'
    - Take away the rotten ones.
    solution: 'Step 1: 6 × 8 = 48. Step 2: 48 − 5 = 43.'
    mistakes:
      '18': c7m2_order
      '9': c7m2_order
  - prompt: Find the value of 9 + 36 ÷ (2 + 4).
    answer: '15'
    check: 9+36/(2+4)
    difficulty: 2
    hints:
    - 'Bracket first: 2 + 4.'
    - Then divide, then add.
    solution: 'Step 1: 2 + 4 = 6. Step 2: 36 ÷ 6 = 6. Step 3: 9 + 6 = 15.'
    mistakes:
      '11.5': c7m2_order
      '22.5': c7m2_order
- code: cbse7m.expr.compare
  title: Comparing and rearranging expressions
  after:
  - cbse7m.expr.order
  notes: |
    We can compare expressions without calculating fully: 97 + 48 vs 95 + 49: 97 > 95 by 2 but 48 < 49 by 1, so
    the first is larger by 1. For subtraction, increasing the first number increases the value, increasing the
    number taken away decreases it. Distributive property: a × (b + c) = a × b + a × c, so 6 × 103 = 6 × 100 +
    6 × 3. Rearranging terms (commutative and associative properties) makes mental maths easier:
    25 + 68 + 75 = (25 + 75) + 68.
  explanations:
    text: 'You can often see which expression is bigger without working out both. Rearranging also makes sums easier: 25 + 68 + 75 is easiest as 25 + 75 = 100, then add 68.'
    visual: 'Draw 6 rows of 103 dots split into a block of 6 × 100 and a thin block of 6 × 3: together 600 + 18 = 618.'
    step_by_step: 'Step 1: Look for numbers that make tens or hundreds together. Step 2: Group them first. Step 3: To multiply by a number near 100, split it: 103 = 100 + 3. Step 4: To compare, see how each part changes.'
    real_world: 'Buying 4 items at ₹99 each: think 4 × 100 − 4 × 1 = 400 − 4 = ₹396.'
  picture:
    kind: compare
    columns:
    - title: Hard way
      points:
      - 25 + 68 + 75 left to right
      - 93, then 168
      - 6 × 103 by long multiplication
    - title: Easy way
      points:
      - (25 + 75) + 68
      - 100 + 68 = 168
      - 6 × 100 + 6 × 3 = 618
    alt: 'Rearranging and splitting make mental maths easier: group 25 and 75 to make 100, and split 103 into 100 + 3.'
  activity:
    type: sort
    prompt: Which side is bigger? Try to tell without working both out.
    bins:
    - Left is bigger
    - Right is bigger
    - Both the same
    items:
    - label: 83 − 37   or   83 − 38
      bin: Left is bigger
      clue: Taking away more leaves less.
      why: 83 − 37 takes away less, so it's bigger.
    - label: 25 × 12   or   24 × 12
      bin: Left is bigger
      clue: Same 12 groups; which group is bigger?
      why: 25 twelves beat 24 twelves.
    - label: 47 + 29   or   46 + 30
      bin: Both the same
      clue: One went down by 1, the other up by 1.
      why: Both are 76.
    - label: 99 + 64   or   100 + 63
      bin: Both the same
      clue: Move 1 from one number to the other.
      why: Both are 163.
    - label: 48 − 19   or   49 − 20
      bin: Both the same
      clue: Both numbers went up by 1. Does the gap change?
      why: Both are 29.
    - label: 36 ÷ 4   or   36 ÷ 3
      bin: Right is bigger
      clue: Sharing among fewer people gives each more.
      why: 36 ÷ 3 = 12 beats 9.
    - label: 17 × 6   or   17 × 7
      bin: Right is bigger
      clue: One more group of 17.
      why: 17 × 7 is bigger by 17.
    - label: 120 − 45   or   120 − 40
      bin: Right is bigger
      clue: Which takes away less?
      why: 120 − 40 leaves more.
  lesson:
    - teach: We can compare expressions without working them out fully. In 97 + 48 and 95 + 49, the first number is 2 more but the second is only 1 less, so 97 + 48 is larger by 1.
      picture:
        kind: compare
        columns:
        - title: 97 + 48
          points:
          - 97 is 2 more
          - 48 is 1 less
        - title: 95 + 49
          points:
          - '95'
          - '49'
        alt: 97 + 48 has 2 more in the first part and 1 less in the second, so it is 1 larger than 95 + 49.
      check:
        prompt: 'Which is larger: 63 + 28 or 61 + 29?'
        options:
        - 63 + 28
        - 61 + 29
        - They are equal
        answer: 63 + 28
        why: '+2 in the first part, −1 in the second: larger by 1.'
    - teach: 'In subtraction, taking away more gives less: 83 − 29 > 83 − 31. The distributive property splits multiplication: 6 × 103 = 6 × 100 + 6 × 3 = 618, and 4 × 99 = 4 × 100 − 4 × 1 = 396.'
      picture:
        kind: area_grid
        cols:
        - size: 5
          label: '100'
        - size: 1
          label: '3'
        rows:
        - size: 2
          label: '6'
        cells:
        - - 6 × 100 = 600
          - 6 × 3 = 18
        alt: 'A 6 by 103 rectangle split into 6 by 100 (600) and 6 by 3 (18): total 618.'
      check:
        prompt: Find 7 × 102 using 102 = 100 + 2.
        options:
        - '714'
        - '702'
        - 7,014
        answer: '714'
        why: 700 + 14 = 714.
    - teach: 'Swapping and grouping terms makes mental maths easier: 25 + 68 + 75 = (25 + 75) + 68 = 168, and 8 × 25 × 7 = (8 × 25) × 7 = 1,400.'
      check:
        prompt: Find 36 + 47 + 64 by grouping.
        options:
        - '147'
        - '137'
        - '157'
        answer: '147'
        why: 36 + 64 = 100, then + 47 = 147.
  items:
  - prompt: Find 25 + 68 + 75 by grouping.
    answer: '168'
    check: 25 + 68 + 75
    difficulty: 1
    hints:
    - 25 + 75 = 100.
    - 100 + 68.
    solution: (25 + 75) + 68 = 168.
    mistakes: {"158": "t7_grouping", "178": "t7_grouping"}
  - prompt: Find 6 × 103 using 103 = 100 + 3.
    answer: '618'
    check: 6*103
    difficulty: 1
    hints:
    - 6 × 100 + 6 × 3.
    - 600 + 18.
    solution: 600 + 18 = 618.
    mistakes: {"603": "t7_distribute_add", "609": "t7_distribute_add"}
  - prompt: Find 4 × 99 using 99 = 100 − 1.
    answer: '396'
    check: 4*99
    difficulty: 2
    hints:
    - 4 × 100 − 4 × 1.
    - 400 − 4.
    solution: 400 − 4 = 396.
    mistakes: {"399": "t7_distribute_sub", "400": "t7_distribute_sub"}
  - prompt: 'Which is larger: 97 + 48 or 95 + 49?'
    options:
    - 97 + 48
    - 95 + 49
    - They are equal
    - Cannot tell
    answer: 97 + 48
    difficulty: 2
    hints:
    - 97 is 2 more than 95.
    - 48 is only 1 less than 49.
    solution: '97 + 48 = 145 and 95 + 49 = 144: the first is larger by 1.'
    mistakes: {"95 + 49": "t7_compare_sum", "They are equal": "t7_compare_sum"}
  - prompt: 'Without calculating, which is larger: 83 − 29 or 83 − 31?'
    options:
    - 83 − 29
    - 83 − 31
    - They are equal
    - Cannot tell
    answer: 83 − 29
    difficulty: 2
    hints:
    - Taking away less leaves more.
    - 29 < 31.
    solution: 'Taking away the smaller number leaves more: 54 vs 52.'
    mistakes: {"83 − 31": "t7_compare_diff", "They are equal": "t7_compare_diff"}
  - prompt: Find 8 × 25 × 7 by rearranging.
    answer: '1400'
    check: 8*25*7
    difficulty: 2
    hints:
    - 8 × 25 = 200.
    - 200 × 7.
    solution: 8 × 25 = 200, and 200 × 7 = 1,400.
    mistakes: {"40": "t7_rearrange", "1200": "t7_rearrange"}
  - prompt: Find 9 × 105 using the distributive property.
    answer: '945'
    check: 9*105
    difficulty: 2
    hints:
    - 105 = 100 + 5.
    - 900 + 45.
    solution: 'Step 1: 9 × 100 = 900. Step 2: 9 × 5 = 45. Step 3: 900 + 45 = 945.'
    mistakes:
      '905': c7m2_distribute
      '9045': c7m2_distribute
  - prompt: Find 12 × 98 using 98 = 100 − 2.
    answer: '1176'
    check: 12*98
    difficulty: 2
    hints:
    - 12 × 100 = 1,200.
    - Take away 12 × 2.
    solution: 'Step 1: 12 × 100 = 1,200. Step 2: 12 × 2 = 24. Step 3: 1,200 − 24 = 1,176.'
    mistakes:
      '1224': c7m2_distribute
      '1198': c7m2_distribute
  - prompt: Find 45 + 39 + 55 + 61 by grouping.
    answer: '200'
    check: 45+39+55+61
    difficulty: 1
    hints:
    - Find pairs that make 100.
    - 45 + 55 and 39 + 61.
    solution: 'Step 1: 45 + 55 = 100. Step 2: 39 + 61 = 100. Step 3: 100 + 100 = 200.'
    mistakes:
      '190': t7_rearrange
      '210': t7_rearrange
  - prompt: 'Without calculating, which is larger: 245 − 98 or 245 − 89?'
    options:
    - 245 − 89
    - 245 − 98
    - They are equal
    answer: 245 − 89
    difficulty: 2
    hints:
    - Both start at 245.
    - Which takes away less?
    solution: Taking away 89 leaves more than taking away 98, so 245 − 89 is larger (by 9).
    mistakes:
      245 − 98: c7m2_compare
      They are equal: c7m2_compare
  - prompt: By how much is 74 + 56 larger than 72 + 55?
    answer: '3'
    check: (74+56)-(72+55)
    difficulty: 2
    hints:
    - Compare part by part.
    - 74 is 2 more than 72; 56 is 1 more than 55.
    solution: 'Step 1: +2 from the first part. Step 2: +1 from the second part. Step 3: larger by 3.'
    mistakes:
      '1': c7m2_compare
      '130': c7m2_compare
  - prompt: Find 4 × 37 × 25 by rearranging.
    answer: '3700'
    check: 4*37*25
    difficulty: 1
    hints:
    - Pair 4 with 25.
    - 4 × 25 = 100.
    solution: 'Step 1: 4 × 25 = 100. Step 2: 100 × 37 = 3,700.'
    mistakes:
      '370': t7_grouping
      '37000': t7_grouping
  - prompt: Which equals 15 × 21?
    options:
    - 15 × 20 + 15 × 1
    - 15 × 20 + 1
    - 15 + 20 × 1
    answer: 15 × 20 + 15 × 1
    difficulty: 2
    hints:
    - 21 = 20 + 1.
    - Both parts must be multiplied by 15.
    solution: 15 × (20 + 1) = 15 × 20 + 15 × 1 = 300 + 15 = 315.
    mistakes:
      15 × 20 + 1: c7m2_distribute
      15 + 20 × 1: c7m2_distribute
  - prompt: Find 999 + 999 + 999 quickly as 3 × (1000 − 1).
    answer: '2997'
    check: 3*999
    difficulty: 2
    hints:
    - 3 × 1000 = 3,000.
    - Take away 3 × 1.
    solution: 'Step 1: 3 × 1000 = 3,000. Step 2: 3,000 − 3 = 2,997.'
    mistakes:
      '2999': c7m2_distribute
      '3003': c7m2_distribute
  - prompt: A shop sells 8 shirts at ₹199 each. Find the total quickly using 199 = 200 − 1.
    answer: '1592'
    check: 8*199
    difficulty: 3
    hints:
    - 8 × 200 = 1,600.
    - Take away 8 × 1.
    solution: 'Step 1: 8 × 200 = 1,600. Step 2: 8 × 1 = 8. Step 3: 1,600 − 8 = ₹1,592.'
    mistakes:
      '1599': c7m2_distribute
      '1608': c7m2_distribute
