# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 2. Format: content/README.md.
subject: cbse7-math
chapter: 2
title: Arithmetic Expressions
tips:
  c7_order_ops: Multiply and divide before you add and subtract, unless brackets say otherwise.
  c7_minus_bracket: 'A minus sign in front of a bracket takes away everything inside: 50 − (12 + 8) = 50 − 12 − 8.'
concepts:
- code: cbse7m.expr.order
  title: Expressions, terms and brackets
  notes: |
    An arithmetic expression combines numbers with +, −, ×, ÷ (for example 13 + 2 × 4). Its value is the number
    it equals. Rule: brackets first; then × and ÷; then + and −. An expression can be split into terms that are
    added: 30 − 4 × 5 + 2 has terms 30, −(4 × 5) and 2. Terms can be added in any order (swapping and
    grouping) without changing the value. A minus sign before a bracket changes every sign inside:
    20 − (5 + 3) = 20 − 5 − 3.
  explanations:
    text: 'An expression like 13 + 2 × 4 is a recipe for a number. Do multiplication before addition: 2 × 4 = 8, then 13 + 8 = 21. Brackets change the order: (13 + 2) × 4 = 60.'
    visual: 'Picture a shopkeeper''s bill: 3 pens at ₹10 and 2 books at ₹45 is 3 × 10 + 2 × 45. Each item group is one term; add the terms to get the total.'
    step_by_step: 'Step 1: Work out anything inside brackets. Step 2: Do × and ÷. Step 3: Split into terms. Step 4: Add the terms, remembering that a minus belongs to the term after it.'
    real_world: 'A cinema ticket costs ₹150 and popcorn ₹80. For 4 friends with 2 popcorns: 4 × 150 + 2 × 80 = 600 + 160 = ₹760.'
  picture:
    kind: flow
    steps:
    - 30 − 4 × 5 + 2
    - 'Multiply first: 4 × 5 = 20'
    - 'Terms: 30, −20, +2'
    - 'Add: 30 − 20 + 2'
    - Value = 12
    alt: 'Evaluating 30 − 4 × 5 + 2: multiply first, split into terms 30, −20 and 2, then add to get 12.'
  items:
  - prompt: Find the value of 13 + 2 × 4.
    answer: '21'
    check: 13 + 2*4
    difficulty: 1
    hints:
    - Multiply first.
    - 2 × 4 = 8.
    solution: 2 × 4 = 8, and 13 + 8 = 21.
    mistakes:
      '60': c7_order_ops
  - prompt: Find the value of (13 + 2) × 4.
    answer: '60'
    check: (13 + 2)*4
    difficulty: 1
    hints:
    - Brackets first.
    - 15 × 4.
    solution: 13 + 2 = 15, and 15 × 4 = 60.
  - prompt: Find the value of 30 − 4 × 5 + 2.
    answer: '12'
    check: 30 - 4*5 + 2
    difficulty: 1
    hints:
    - Multiply 4 × 5 first.
    - 30 − 20 + 2.
    solution: 30 − 20 + 2 = 12.
    mistakes:
      '132': c7_order_ops
  - prompt: Find the value of 50 − (12 + 8).
    answer: '30'
    check: 50 - (12 + 8)
    difficulty: 1
    hints:
    - Brackets first.
    - 12 + 8 = 20.
    solution: 50 − 20 = 30.
    mistakes:
      '46': c7_minus_bracket
  - prompt: 3 pens cost ₹10 each and 2 books cost ₹45 each. Write and find the total cost in rupees.
    answer: '120'
    check: 3*10 + 2*45
    difficulty: 2
    hints:
    - 3 × 10 + 2 × 45.
    - 30 + 90.
    solution: 3 × 10 + 2 × 45 = 30 + 90 = ₹120.
  - prompt: Which expression equals 20 − (5 + 3)?
    options:
    - 20 − 5 − 3
    - 20 − 5 + 3
    - 20 + 5 − 3
    - 20 + 5 + 3
    answer: 20 − 5 − 3
    difficulty: 2
    hints:
    - A minus before a bracket changes every sign inside.
    - Both 5 and 3 are taken away.
    solution: Taking away (5 + 3) means taking away 5 and taking away 3.
    mistakes:
      20 − 5 + 3: c7_minus_bracket
- code: cbse7m.expr.compare
  title: Comparing and rearranging expressions
  after:
  - cbse7m.expr.order
  notes: |
    We can compare expressions without calculating fully: 97 + 48 vs 95 + 49: 97 > 95 by 2 but 48 < 49 by 1, so
    the first is larger by 1. For subtraction, increasing the first number increases the value, increasing the
    number taken away decreases it. Distributive property: a × (b + c) = a × b + a × c, so 6 × 103 = 6 × 100 +
    6 × 3. Rearranging terms (commutative and associative properties) makes mental maths easier:
    25 + 68 + 75 = (25 + 75) + 68.
  explanations:
    text: 'You can often see which expression is bigger without working out both. Rearranging also makes sums easier: 25 + 68 + 75 is easiest as 25 + 75 = 100, then add 68.'
    visual: 'Draw 6 rows of 103 dots split into a block of 6 × 100 and a thin block of 6 × 3: together 600 + 18 = 618.'
    step_by_step: 'Step 1: Look for numbers that make tens or hundreds together. Step 2: Group them first. Step 3: To multiply by a number near 100, split it: 103 = 100 + 3. Step 4: To compare, see how each part changes.'
    real_world: 'Buying 4 items at ₹99 each: think 4 × 100 − 4 × 1 = 400 − 4 = ₹396.'
  picture:
    kind: compare
    columns:
    - title: Hard way
      points:
      - 25 + 68 + 75 left to right
      - 93, then 168
      - 6 × 103 by long multiplication
    - title: Easy way
      points:
      - (25 + 75) + 68
      - 100 + 68 = 168
      - 6 × 100 + 6 × 3 = 618
    alt: 'Rearranging and splitting make mental maths easier: group 25 and 75 to make 100, and split 103 into 100 + 3.'
  items:
  - prompt: Find 25 + 68 + 75 by grouping.
    answer: '168'
    check: 25 + 68 + 75
    difficulty: 1
    hints:
    - 25 + 75 = 100.
    - 100 + 68.
    solution: (25 + 75) + 68 = 168.
  - prompt: Find 6 × 103 using 103 = 100 + 3.
    answer: '618'
    check: 6*103
    difficulty: 1
    hints:
    - 6 × 100 + 6 × 3.
    - 600 + 18.
    solution: 600 + 18 = 618.
  - prompt: Find 4 × 99 using 99 = 100 − 1.
    answer: '396'
    check: 4*99
    difficulty: 2
    hints:
    - 4 × 100 − 4 × 1.
    - 400 − 4.
    solution: 400 − 4 = 396.
  - prompt: 'Which is larger: 97 + 48 or 95 + 49?'
    options:
    - 97 + 48
    - 95 + 49
    - They are equal
    - Cannot tell
    answer: 97 + 48
    difficulty: 2
    hints:
    - 97 is 2 more than 95.
    - 48 is only 1 less than 49.
    solution: '97 + 48 = 145 and 95 + 49 = 144: the first is larger by 1.'
  - prompt: 'Without calculating, which is larger: 83 − 29 or 83 − 31?'
    options:
    - 83 − 29
    - 83 − 31
    - They are equal
    - Cannot tell
    answer: 83 − 29
    difficulty: 2
    hints:
    - Taking away less leaves more.
    - 29 < 31.
    solution: 'Taking away the smaller number leaves more: 54 vs 52.'
  - prompt: Find 8 × 25 × 7 by rearranging.
    answer: '1400'
    check: 8*25*7
    difficulty: 2
    hints:
    - 8 × 25 = 200.
    - 200 × 7.
    solution: 8 × 25 = 200, and 200 × 7 = 1,400.
