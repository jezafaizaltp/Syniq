# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 8. Format: content/README.md.
subject: cbse7-math
chapter: 8
title: Working with Fractions
tips:
  c7_frac_multiply: To multiply fractions, multiply top × top and bottom × bottom. Don't add them.
  c7_frac_divide: To divide by a fraction, multiply by its reciprocal (flip the second fraction).
  t7_divide_by_half: "How many halves fit in 10? Is that more or less than half of 10?"
  t7_divide_fraction: "Dividing by 3 is the same as multiplying by 1/3."
  t7_fraction_of: "Find 1/4 of 20 first, then take 3 of those."
  t7_half_of_fraction: "Half of 3/4 means 3/4 × 1/2."
  t7_mixed_number: "1½ = 3/2. Multiply by 4."
  t7_multiply_by_proper: "Multiplying by a fraction less than 1 gives less than you started with."
  t7_multiply_fractions: "Multiply tops and bottoms, then simplify. Cancel common factors first to keep it easy."
  t7_pieces_divide: "How many 3/4 m pieces fit in 6 m? Divide 6 by 3/4: multiply by 4/3."
  t7_reciprocal: "The reciprocal flips the fraction upside down."
  c7m8_of: '''Of'' means multiply. Divide by the bottom number to find one part, then multiply by the top number.'
  c7m8_tops_bottoms: Multiply top by top and bottom by bottom. Do not add, and do not keep a bottom number the same.
  c7m8_cancel: Look for a top number and a bottom number that share a factor, and divide both by it before multiplying.
  c7m8_mixed: 'Turn a mixed number into an improper fraction first: whole × bottom + top, over the same bottom.'
  c7m8_flip: 'To divide by a fraction, multiply by its reciprocal: flip the second fraction, not the first.'
  c7m8_fit: Ask how many of the small pieces fit into the amount. Dividing by a fraction less than 1 gives more pieces, not fewer.
concepts:
- code: cbse7m.frac.multiply
  title: Multiplying fractions
  notes: |
    A fraction of a quantity: 3/4 of 20 = 20 ÷ 4 × 3 = 15. Fraction × fraction: multiply numerators and
    denominators: 2/3 × 4/5 = 8/15 (an area model: a 3 by 5 grid with 2 rows and 4 columns shaded overlap in 8
    of 15 cells). Simplify first by cancelling common factors: 4/9 × 3/8 = 1/6. Multiplying by a proper fraction
    makes a number smaller; by a fraction greater than 1, larger. Mixed numbers: change to improper fractions
    first (1½ × 4 = 3/2 × 4 = 6). Brahmagupta described this rule over 1,300 years ago.
  explanations:
    text: 'To multiply fractions, multiply the tops and multiply the bottoms: 2/3 × 4/5 = 8/15. ''Of'' means multiply, so half of a third is 1/2 × 1/3 = 1/6.'
    visual: 'Draw a rectangle split into 5 columns; shade 4 (that''s 4/5). Now split it into 3 rows and shade 2 rows (2/3) the other way. The overlap is 8 cells out of 15: 8/15.'
    step_by_step: 'Step 1: Change mixed numbers to improper fractions. Step 2: Cancel any common factors across top and bottom. Step 3: Multiply the numerators. Step 4: Multiply the denominators. Step 5: Simplify.'
    real_world: 'A recipe needs 3/4 cup of sugar. For half the recipe: 1/2 × 3/4 = 3/8 cup.'
  picture:
    kind: area_grid
    cols:
    - size: 4
      label: 4/5
    - size: 1
      label: 1/5
    rows:
    - size: 2
      label: 2/3
    - size: 1
      label: 1/3
    cells:
    - - 8 of 15
      - '2'
    - - '4'
      - '1'
    caption: '2/3 of 4/5: 8 of the 15 cells, so 8/15.'
    alt: A rectangle split into 4/5 and 1/5 across and 2/3 and 1/3 down; the overlap of 4/5 and 2/3 holds 8 of the 15 small cells, so two thirds of four fifths is eight fifteenths.
  activity:
    type: formula
    prompt: Write the answer as one fraction n/d in simplest form.
    inputs:
    - name: n
      label: Top n
      min: 1
      max: 30
      step: 1
      start: 1
    - name: d
      label: Bottom d
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: val
      label: n ÷ d
      expr: n/d
      places: 3
    goals:
    - prompt: 1/2 × 1/3 (half of a third)
      want:
        n: 1
        d: 6
      mistakes:
      - when:
          n: 2
          d: 5
        say: 'You added tops and bottoms. Multiply them: 1 × 1 over 2 × 3.'
      - when:
          n: 1
          d: 5
        say: '1/5 adds the bottoms. Half of a third is smaller than a third: multiply 2 × 3.'
    - prompt: 2/3 × 4/5
      want:
        n: 8
        d: 15
      mistakes:
      - when:
          n: 10
          d: 12
        say: You cross-multiplied (2 × 5 and 3 × 4). Multiply top × top and bottom × bottom.
      - when:
          n: 6
          d: 8
        say: Adding tops and bottoms doesn't multiply. 2 × 4 over 3 × 5.
    - prompt: 3/4 × 2/3
      want:
        n: 1
        d: 2
      mistakes:
      - when:
          n: 6
          d: 12
        say: 'Right value, not simplest: 6 and 12 both divide by 6.'
      - when:
          n: 3
          d: 6
        say: 'Still not simplest: divide by 3.'
  lesson:
    - teach: '''A fraction of'' a number means multiply. To find 2/5 of 30, split 30 into 5 equal parts (6 each) and take 2 of them: 12. So 2/5 × 30 = 30 ÷ 5 × 2 = 12.'
      picture:
        kind: bars
        bars:
        - label: 1/5 of 30
          value: 6
        - label: 2/5 of 30
          value: 12
        - label: all of 30
          value: 30
        unit: sweets
        alt: One fifth of 30 is 6, two fifths is 12.
      check:
        prompt: What is 3/4 of 12?
        options:
        - '9'
        - '3'
        - '16'
        answer: '9'
        why: 12 ÷ 4 = 3, and 3 × 3 = 9.
    - teach: 'Fraction × fraction: multiply the tops and multiply the bottoms. 1/2 × 3/4 = 3/8. In a picture, shade 3/4 of a rectangle, then take half of the shaded part: 3 of 8 small cells.'
      picture:
        kind: area_grid
        cols:
        - size: 3
          label: 3/4
        - size: 1
          label: 1/4
        rows:
        - size: 1
          label: 1/2
        - size: 1
          label: 1/2
        cells:
        - - 3/8
          - 1/8
        - - 3/8
          - 1/8
        alt: A rectangle split into 3/4 and 1/4 across and halves down. Half of the 3/4 part is 3/8 of the whole.
      check:
        prompt: What is 2/3 × 1/5?
        options:
        - 2/15
        - 3/8
        - 2/8
        answer: 2/15
        why: 2 × 1 = 2 on top, 3 × 5 = 15 below.
    - teach: 'Cancel before multiplying to keep numbers small: 3/8 × 4/9: 3 and 9 share 3, 4 and 8 share 4, giving 1/2 × 1/3 = 1/6. Mixed numbers become improper fractions first: 2½ = 5/2. Multiplying by a fraction less than 1 makes a number smaller.'
      check:
        prompt: Which is less than 20?
        options:
        - 20 × 3/5
        - 20 × 5/3
        - 20 × 1
        answer: 20 × 3/5
        why: 3/5 is less than 1, so it shrinks 20 (to 12).
  items:
  - prompt: Find 3/4 of 20.
    answer: '15'
    check: Rational(3,4)*20
    difficulty: 1
    hints:
    - 20 ÷ 4 = 5.
    - 5 × 3.
    solution: 20 ÷ 4 × 3 = 15.
    mistakes: {"5": "t7_fraction_of", "60": "t7_fraction_of"}
  - prompt: Find 2/3 × 4/5. Give the answer as a fraction.
    answer: 8/15
    check: Rational(2,3)*Rational(4,5)
    difficulty: 1
    hints:
    - 'Multiply the tops: 2 × 4.'
    - 'Multiply the bottoms: 3 × 5.'
    solution: 2/3 × 4/5 = 8/15.
    mistakes:
      6/8: c7_frac_multiply
  - prompt: Find 4/9 × 3/8 in its simplest form.
    answer: 1/6
    check: Rational(4,9)*Rational(3,8)
    difficulty: 2
    hints:
    - Cancel 4 with 8 and 3 with 9.
    - 1/3 × 1/2.
    solution: Cancelling gives 1/3 × 1/2 = 1/6.
    mistakes: {"12/17": "t7_multiply_fractions", "7/17": "t7_multiply_fractions"}
  - prompt: Find 1½ × 4.
    answer: '6'
    check: Rational(3,2)*4
    difficulty: 2
    hints:
    - 1½ = 3/2.
    - 3/2 × 4.
    solution: 3/2 × 4 = 12/2 = 6.
    mistakes: {"4.5": "t7_mixed_number", "8": "t7_mixed_number"}
  - prompt: A recipe needs 3/4 cup of sugar. How much for half the recipe? Give a fraction.
    answer: 3/8
    check: Rational(1,2)*Rational(3,4)
    difficulty: 2
    hints:
    - Half of 3/4.
    - 1/2 × 3/4.
    solution: 1/2 × 3/4 = 3/8 cup.
    mistakes: {"3/2": "t7_half_of_fraction", "1/4": "t7_half_of_fraction"}
  - prompt: Which is true about 12 × 2/3?
    options:
    - It is less than 12
    - It is more than 12
    - It equals 12
    - It is 24
    answer: It is less than 12
    difficulty: 1
    hints:
    - 2/3 is less than 1.
    - Multiplying by less than 1.
    solution: 'Multiplying by a fraction less than 1 gives less: 12 × 2/3 = 8.'
    mistakes: {"It is more than 12": "t7_multiply_by_proper", "It is 24": "t7_multiply_by_proper"}
  - prompt: Find 2/5 of 35.
    answer: '14'
    check: 35/5*2
    difficulty: 1
    hints:
    - Find 1/5 of 35 first.
    - Then take two of those parts.
    solution: 'Step 1: 35 ÷ 5 = 7. Step 2: 7 × 2 = 14.'
    mistakes:
      '7': c7m8_of
      '70': c7m8_of
  - prompt: Find 5/6 of 24.
    answer: '20'
    check: 24/6*5
    difficulty: 1
    hints:
    - Find 1/6 of 24.
    - Multiply that part by 5.
    solution: 'Step 1: 24 ÷ 6 = 4. Step 2: 4 × 5 = 20.'
    mistakes:
      '4': c7m8_of
      '144': c7m8_of
  - prompt: Find 3/7 × 2/5. Give the answer as a fraction.
    answer: 6/35
    check: Rational(3,7)*Rational(2,5)
    difficulty: 1
    hints:
    - Multiply the top numbers.
    - Multiply the bottom numbers.
    solution: 'Step 1: 3 × 2 = 6 on top. Step 2: 7 × 5 = 35 below, giving 6/35.'
    mistakes:
      5/12: c7m8_tops_bottoms
      6/7: c7m8_tops_bottoms
  - prompt: Find 4 × 2/9. Give the answer as a fraction.
    answer: 8/9
    check: 4*Rational(2,9)
    difficulty: 1
    hints:
    - A whole number multiplies only the top.
    - 4 × 2 on top, 9 stays below.
    solution: 'Step 1: 4 = 4/1. Step 2: 4 × 2 = 8 and 1 × 9 = 9, giving 8/9.'
    mistakes:
      8/36: c7m8_tops_bottoms
      6/9: c7m8_tops_bottoms
  - prompt: Find 5/12 × 6/25 in its simplest form.
    answer: 1/10
    check: Rational(5,12)*Rational(6,25)
    difficulty: 2
    hints:
    - 5 and 25 share 5; 6 and 12 share 6.
    - Cancel, then multiply.
    solution: 'Step 1: cancel 5 with 25 (1 and 5) and 6 with 12 (1 and 2). Step 2: 1/2 × 1/5 = 1/10.'
    mistakes:
      1/5: c7m8_cancel
      11/37: c7m8_tops_bottoms
  - prompt: Find 2½ × 3. Give the answer as a mixed number or decimal.
    answer: '7.5'
    check: Rational(5,2)*3
    difficulty: 2
    hints:
    - Write 2½ as an improper fraction.
    - 5/2 × 3.
    solution: 'Step 1: 2½ = 5/2. Step 2: 5/2 × 3 = 15/2 = 7½ = 7.5.'
    mistakes:
      '6.5': c7m8_mixed
      '6': c7m8_mixed
  - prompt: A tank holds 60 litres. It is 3/4 full. How many litres are in it?
    answer: '45'
    check: 60*Rational(3,4)
    difficulty: 2
    hints:
    - Find 3/4 of 60.
    - 60 ÷ 4 = 15.
    solution: 'Step 1: 60 ÷ 4 = 15. Step 2: 15 × 3 = 45 litres.'
    mistakes:
      '15': c7m8_of
      '80': c7m8_of
  - prompt: Which is greater than 15?
    options:
    - 15 × 4/3
    - 15 × 3/4
    - 15 × 1/2
    answer: 15 × 4/3
    difficulty: 2
    hints:
    - Compare each fraction with 1.
    - Which fraction is more than 1?
    solution: 4/3 is more than 1, so it makes 15 bigger (20). The others are less than 1 and make it smaller.
    mistakes:
      15 × 3/4: c7m8_fit
      15 × 1/2: c7m8_fit
  - prompt: Find 1⅓ × 1½.
    answer: '2'
    check: Rational(4,3)*Rational(3,2)
    difficulty: 3
    hints:
    - Change both to improper fractions.
    - 4/3 × 3/2.
    solution: 'Step 1: 1⅓ = 4/3 and 1½ = 3/2. Step 2: 4/3 × 3/2 = 12/6 = 2.'
    mistakes:
      '1': c7m8_mixed
      '1.5': c7m8_mixed
  - prompt: Meena spends 1/3 of her ₹180 on books and 1/4 of what is left on a pen. How many rupees does the pen cost?
    answer: '30'
    check: (180-180/3)/4
    difficulty: 3
    hints:
    - Find what is left after the books.
    - Then find 1/4 of that.
    solution: 'Step 1: books cost 180 ÷ 3 = ₹60, so ₹120 is left. Step 2: 120 ÷ 4 = ₹30 for the pen.'
    mistakes:
      '45': c7m8_of
      '60': c7m8_of
  - prompt: Find 2/3 of 3/4 of 48.
    answer: '24'
    check: Rational(2,3)*Rational(3,4)*48
    difficulty: 3
    hints:
    - Find 3/4 of 48 first.
    - Then take 2/3 of that.
    solution: 'Step 1: 3/4 of 48 = 36. Step 2: 2/3 of 36 = 24. (Or 2/3 × 3/4 = 1/2, and half of 48 is 24.)'
    mistakes:
      '36': c7m8_of
      '32': c7m8_of
- code: cbse7m.frac.divide
  title: Dividing fractions
  after:
  - cbse7m.frac.multiply
  notes: |
    Dividing asks 'how many of these fit in that?': 3 ÷ 1/4 = 12 (12 quarters in 3 wholes). The reciprocal of
    a/b is b/a (product 1). To divide, multiply by the reciprocal: 2/3 ÷ 4/5 = 2/3 × 5/4 = 10/12 = 5/6. Fraction
    ÷ whole number: 3/5 ÷ 3 = 3/5 × 1/3 = 1/5. Dividing by a fraction less than 1 gives a bigger answer.
    Word problems: 6 m of ribbon cut into pieces of 3/4 m gives 6 ÷ 3/4 = 8 pieces.
  explanations:
    text: 'Dividing by a fraction asks how many pieces of that size fit. How many quarters fit in 3 rotis? 12. The shortcut: flip the second fraction and multiply.'
    visual: 'Draw 3 circles and cut each into 4 quarters. Count the pieces: 12. So 3 ÷ 1/4 = 12, the same as 3 × 4.'
    step_by_step: 'Step 1: Keep the first fraction. Step 2: Change ÷ to ×. Step 3: Flip the second fraction (its reciprocal). Step 4: Multiply and simplify.'
    real_world: 'A 6 m roll of ribbon is cut into bows needing 3/4 m each: 6 ÷ 3/4 = 6 × 4/3 = 8 bows.'
  picture:
    kind: flow
    steps:
    - 2/3 ÷ 4/5
    - Keep 2/3
    - Change ÷ to ×
    - Flip 4/5 to 5/4
    - 2/3 × 5/4 = 10/12 = 5/6
    alt: 'Dividing 2/3 by 4/5: keep, change, flip, then multiply to get 10/12, which simplifies to 5/6.'
  activity:
    type: formula
    prompt: Write the answer as n/d in simplest form (a whole number has d = 1).
    inputs:
    - name: n
      label: Top n
      min: 1
      max: 30
      step: 1
      start: 1
    - name: d
      label: Bottom d
      min: 1
      max: 30
      step: 1
      start: 2
    outputs:
    - name: val
      label: n ÷ d
      expr: n/d
      places: 3
    goals:
    - prompt: '3 ÷ 1/4: how many quarters fit in 3 rotis?'
      want:
        n: 12
        d: 1
      mistakes:
      - when:
          n: 3
          d: 4
        say: '3/4 is a quarter of 3. Dividing by 1/4 asks how many quarters fit: 4 in each roti.'
    - prompt: 2/3 ÷ 1/6
      want:
        n: 4
        d: 1
      mistakes:
      - when:
          n: 1
          d: 9
        say: '2/18 = 1/9 multiplies by 1/6. Flip the second fraction: 2/3 × 6/1.'
      - when:
          n: 2
          d: 18
        say: 'That''s multiplying by 1/6. Flip it: 2/3 × 6.'
    - prompt: 3/4 ÷ 1/2
      want:
        n: 3
        d: 2
      mistakes:
      - when:
          n: 3
          d: 8
        say: '3/8 multiplies by 1/2. Dividing by a half doubles: 3/4 × 2.'
      - when:
          n: 6
          d: 4
        say: 'Right value, not simplest: both divide by 2.'
  lesson:
    - teach: Dividing asks 'how many of these fit into that?' How many halves fit into 4? Each whole holds 2 halves, so 4 ÷ 1/2 = 8. Dividing by a fraction less than 1 gives a bigger answer.
      picture:
        kind: number_line
        from: 0
        to: 4
        step: 0.5
        points:
        - at: 0.5
          label: '1'
        - at: 2
          label: '4'
        - at: 4
          label: '8'
        alt: 'From 0 to 4 in jumps of a half: 8 jumps.'
      check:
        prompt: How many quarters fit into 2?
        options:
        - '8'
        - '2'
        - 1/2
        answer: '8'
        why: Each whole holds 4 quarters, and 2 × 4 = 8.
    - teach: 'The reciprocal of a fraction is it flipped: 3/7 becomes 7/3. A number times its reciprocal is 1. To divide by a fraction, multiply by its reciprocal: 3/5 ÷ 2/3 = 3/5 × 3/2 = 9/10.'
      picture:
        kind: flow
        steps:
        - 3/5 ÷ 2/3
        - keep 3/5, flip 2/3 to 3/2
        - 3/5 × 3/2
        - 9/10
        alt: Dividing by 2/3 becomes multiplying by 3/2.
      check:
        prompt: What is the reciprocal of 4/9?
        options:
        - 9/4
        - 4/9
        - −4/9
        answer: 9/4
        why: 'Flip it: 4/9 × 9/4 = 1.'
    - teach: 'A whole number has a reciprocal too: 5 = 5/1, so its reciprocal is 1/5. Dividing a fraction by 4 is the same as taking a quarter of it: 2/3 ÷ 4 = 2/3 × 1/4 = 2/12 = 1/6.'
      check:
        prompt: What is 3/4 ÷ 3?
        options:
        - 1/4
        - 9/4
        - '4'
        answer: 1/4
        why: 3/4 × 1/3 = 3/12 = 1/4.
  items:
  - prompt: Find 3 ÷ 1/4.
    answer: '12'
    check: 3/Rational(1,4)
    difficulty: 1
    hints:
    - How many quarters in 3?
    - 3 × 4.
    solution: 3 ÷ 1/4 = 3 × 4 = 12.
    mistakes:
      3/4: c7_frac_divide
  - prompt: What is the reciprocal of 5/7? Give a fraction.
    answer: 7/5
    check: 1/Rational(5,7)
    difficulty: 1
    hints:
    - Flip it.
    - Top and bottom swap.
    solution: The reciprocal of 5/7 is 7/5.
    mistakes: {"5/7": "t7_reciprocal", "-5/7": "t7_reciprocal"}
  - prompt: Find 2/3 ÷ 4/5 in simplest form.
    answer: 5/6
    check: Rational(2,3)/Rational(4,5)
    difficulty: 2
    hints:
    - 2/3 × 5/4.
    - 10/12, then simplify.
    solution: 2/3 × 5/4 = 10/12 = 5/6.
    mistakes:
      8/15: c7_frac_divide
  - prompt: Find 3/5 ÷ 3.
    answer: 1/5
    check: Rational(3,5)/3
    difficulty: 2
    hints:
    - 3/5 × 1/3.
    - Cancel the 3s.
    solution: 3/5 × 1/3 = 1/5.
    mistakes: {"9/5": "t7_divide_fraction", "1/15": "t7_divide_fraction"}
  - prompt: 6 m of ribbon is cut into pieces 3/4 m long. How many pieces?
    answer: '8'
    check: 6/Rational(3,4)
    difficulty: 2
    hints:
    - 6 ÷ 3/4.
    - 6 × 4/3.
    solution: 6 × 4/3 = 24/3 = 8 pieces.
    mistakes: {"4.5": "t7_pieces_divide", "2": "t7_pieces_divide"}
  - prompt: 'Which is larger: 10 ÷ 1/2 or 10 × 1/2?'
    options:
    - 10 ÷ 1/2
    - 10 × 1/2
    - They are equal
    - Cannot tell
    answer: 10 ÷ 1/2
    difficulty: 1
    hints:
    - "Work out both. Dividing by a half asks: how many halves fit into 10?"
    - 10 × 1/2 = 5.
    solution: 'Dividing by a half doubles: 20; multiplying by a half halves: 5.'
    mistakes: {"10 × 1/2": "t7_divide_by_half", "They are equal": "t7_divide_by_half"}
  - prompt: Find 5 ÷ 1/3.
    answer: '15'
    check: 5/Rational(1,3)
    difficulty: 1
    hints:
    - How many thirds fit into one whole?
    - 3 thirds in each of 5 wholes.
    solution: 'Step 1: each whole holds 3 thirds. Step 2: 5 × 3 = 15.'
    mistakes:
      5/3: c7m8_fit
      '1.6667': c7m8_fit
  - prompt: What is the reciprocal of 8? Give a fraction.
    answer: 1/8
    check: Rational(1,8)
    difficulty: 1
    hints:
    - Write 8 as 8/1.
    - Flip it.
    solution: 8 = 8/1, and flipping gives 1/8 (8 × 1/8 = 1).
    mistakes:
      '8': c7m8_flip
      '-8': c7m8_flip
  - prompt: Find 4/5 ÷ 2. Give the answer as a fraction.
    answer: 2/5
    check: Rational(4,5)/2
    difficulty: 1
    hints:
    - Dividing by 2 is taking half.
    - 4/5 × 1/2.
    solution: 'Step 1: 4/5 × 1/2 = 4/10. Step 2: 4/10 = 2/5.'
    mistakes:
      8/5: c7m8_flip
      2/10: c7m8_flip
  - prompt: Find 3/4 ÷ 3/8.
    answer: '2'
    check: Rational(3,4)/Rational(3,8)
    difficulty: 2
    hints:
    - Flip 3/8 and multiply.
    - 3/4 × 8/3.
    solution: 'Step 1: 3/4 × 8/3. Step 2: = 24/12 = 2.'
    mistakes:
      9/32: c7m8_flip
      1/2: c7m8_flip
  - prompt: Find 2/7 ÷ 4/21 in simplest form, as a fraction.
    answer: 3/2
    check: Rational(2,7)/Rational(4,21)
    difficulty: 2
    hints:
    - Multiply by 21/4.
    - Cancel 7 with 21 and 2 with 4.
    solution: 'Step 1: 2/7 × 21/4. Step 2: cancel to 1/1 × 3/2 = 3/2 (1½).'
    mistakes:
      8/147: c7m8_flip
      2/3: c7m8_flip
  - prompt: A 9 m rope is cut into pieces 3/4 m long. How many pieces?
    answer: '12'
    check: 9/Rational(3,4)
    difficulty: 2
    hints:
    - How many 3/4 m pieces fit into 9 m?
    - 9 × 4/3.
    solution: 'Step 1: 9 ÷ 3/4 = 9 × 4/3. Step 2: = 36/3 = 12 pieces.'
    mistakes:
      27/4: c7m8_fit
      '6.75': c7m8_fit
  - prompt: Which is the largest?
    options:
    - 6 ÷ 1/3
    - 6 × 1/3
    - 6 ÷ 3
    answer: 6 ÷ 1/3
    difficulty: 2
    hints:
    - Work each out.
    - How many thirds fit in 6?
    solution: 6 ÷ 1/3 = 18, 6 × 1/3 = 2 and 6 ÷ 3 = 2. Dividing by a fraction less than 1 gives the biggest.
