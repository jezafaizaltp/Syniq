# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 8. Format: content/README.md.
subject: cbse7-math
chapter: 8
title: Working with Fractions
tips:
  c7_frac_multiply: To multiply fractions, multiply top × top and bottom × bottom. Don't add them.
  c7_frac_divide: To divide by a fraction, multiply by its reciprocal (flip the second fraction).
concepts:
- code: cbse7m.frac.multiply
  title: Multiplying fractions
  notes: |
    A fraction of a quantity: 3/4 of 20 = 20 ÷ 4 × 3 = 15. Fraction × fraction: multiply numerators and
    denominators: 2/3 × 4/5 = 8/15 (an area model: a 3 by 5 grid with 2 rows and 4 columns shaded overlap in 8
    of 15 cells). Simplify first by cancelling common factors: 4/9 × 3/8 = 1/6. Multiplying by a proper fraction
    makes a number smaller; by a fraction greater than 1, larger. Mixed numbers: change to improper fractions
    first (1½ × 4 = 3/2 × 4 = 6). Brahmagupta described this rule over 1,300 years ago.
  explanations:
    text: 'To multiply fractions, multiply the tops and multiply the bottoms: 2/3 × 4/5 = 8/15. ''Of'' means multiply, so half of a third is 1/2 × 1/3 = 1/6.'
    visual: 'Draw a rectangle split into 5 columns; shade 4 (that''s 4/5). Now split it into 3 rows and shade 2 rows (2/3) the other way. The overlap is 8 cells out of 15: 8/15.'
    step_by_step: 'Step 1: Change mixed numbers to improper fractions. Step 2: Cancel any common factors across top and bottom. Step 3: Multiply the numerators. Step 4: Multiply the denominators. Step 5: Simplify.'
    real_world: 'A recipe needs 3/4 cup of sugar. For half the recipe: 1/2 × 3/4 = 3/8 cup.'
  picture:
    kind: area_grid
    cols:
    - size: 4
      label: 4/5
    - size: 1
      label: 1/5
    rows:
    - size: 2
      label: 2/3
    - size: 1
      label: 1/3
    cells:
    - - 8 of 15
      - '2'
    - - '4'
      - '1'
    caption: '2/3 of 4/5: 8 of the 15 cells, so 8/15.'
    alt: A rectangle split into 4/5 and 1/5 across and 2/3 and 1/3 down; the overlap of 4/5 and 2/3 holds 8 of the 15 small cells, so two thirds of four fifths is eight fifteenths.
  activity:
    type: formula
    prompt: Write the answer as one fraction n/d in simplest form.
    inputs:
    - name: n
      label: Top n
      min: 1
      max: 30
      step: 1
      start: 1
    - name: d
      label: Bottom d
      min: 1
      max: 30
      step: 1
      start: 1
    outputs:
    - name: val
      label: n ÷ d
      expr: n/d
      places: 3
    goals:
    - prompt: 1/2 × 1/3 (half of a third)
      want:
        n: 1
        d: 6
      mistakes:
      - when:
          n: 2
          d: 5
        say: 'You added tops and bottoms. Multiply them: 1 × 1 over 2 × 3.'
      - when:
          n: 1
          d: 5
        say: '1/5 adds the bottoms. Half of a third is smaller than a third: multiply 2 × 3.'
    - prompt: 2/3 × 4/5
      want:
        n: 8
        d: 15
      mistakes:
      - when:
          n: 10
          d: 12
        say: You cross-multiplied (2 × 5 and 3 × 4). Multiply top × top and bottom × bottom.
      - when:
          n: 6
          d: 8
        say: Adding tops and bottoms doesn't multiply. 2 × 4 over 3 × 5.
    - prompt: 3/4 × 2/3
      want:
        n: 1
        d: 2
      mistakes:
      - when:
          n: 6
          d: 12
        say: 'Right value, not simplest: 6 and 12 both divide by 6.'
      - when:
          n: 3
          d: 6
        say: 'Still not simplest: divide by 3.'
  items:
  - prompt: Find 3/4 of 20.
    answer: '15'
    check: Rational(3,4)*20
    difficulty: 1
    hints:
    - 20 ÷ 4 = 5.
    - 5 × 3.
    solution: 20 ÷ 4 × 3 = 15.
  - prompt: Find 2/3 × 4/5. Give the answer as a fraction.
    answer: 8/15
    check: Rational(2,3)*Rational(4,5)
    difficulty: 1
    hints:
    - 'Multiply the tops: 2 × 4.'
    - 'Multiply the bottoms: 3 × 5.'
    solution: 2/3 × 4/5 = 8/15.
    mistakes:
      6/8: c7_frac_multiply
  - prompt: Find 4/9 × 3/8 in its simplest form.
    answer: 1/6
    check: Rational(4,9)*Rational(3,8)
    difficulty: 2
    hints:
    - Cancel 4 with 8 and 3 with 9.
    - 1/3 × 1/2.
    solution: Cancelling gives 1/3 × 1/2 = 1/6.
  - prompt: Find 1½ × 4.
    answer: '6'
    check: Rational(3,2)*4
    difficulty: 2
    hints:
    - 1½ = 3/2.
    - 3/2 × 4.
    solution: 3/2 × 4 = 12/2 = 6.
  - prompt: A recipe needs 3/4 cup of sugar. How much for half the recipe? Give a fraction.
    answer: 3/8
    check: Rational(1,2)*Rational(3,4)
    difficulty: 2
    hints:
    - Half of 3/4.
    - 1/2 × 3/4.
    solution: 1/2 × 3/4 = 3/8 cup.
  - prompt: Which is true about 12 × 2/3?
    options:
    - It is less than 12
    - It is more than 12
    - It equals 12
    - It is 24
    answer: It is less than 12
    difficulty: 1
    hints:
    - 2/3 is less than 1.
    - Multiplying by less than 1.
    solution: 'Multiplying by a fraction less than 1 gives less: 12 × 2/3 = 8.'
- code: cbse7m.frac.divide
  title: Dividing fractions
  after:
  - cbse7m.frac.multiply
  notes: |
    Dividing asks 'how many of these fit in that?': 3 ÷ 1/4 = 12 (12 quarters in 3 wholes). The reciprocal of
    a/b is b/a (product 1). To divide, multiply by the reciprocal: 2/3 ÷ 4/5 = 2/3 × 5/4 = 10/12 = 5/6. Fraction
    ÷ whole number: 3/5 ÷ 3 = 3/5 × 1/3 = 1/5. Dividing by a fraction less than 1 gives a bigger answer.
    Word problems: 6 m of ribbon cut into pieces of 3/4 m gives 6 ÷ 3/4 = 8 pieces.
  explanations:
    text: 'Dividing by a fraction asks how many pieces of that size fit. How many quarters fit in 3 rotis? 12. The shortcut: flip the second fraction and multiply.'
    visual: 'Draw 3 circles and cut each into 4 quarters. Count the pieces: 12. So 3 ÷ 1/4 = 12, the same as 3 × 4.'
    step_by_step: 'Step 1: Keep the first fraction. Step 2: Change ÷ to ×. Step 3: Flip the second fraction (its reciprocal). Step 4: Multiply and simplify.'
    real_world: 'A 6 m roll of ribbon is cut into bows needing 3/4 m each: 6 ÷ 3/4 = 6 × 4/3 = 8 bows.'
  picture:
    kind: flow
    steps:
    - 2/3 ÷ 4/5
    - Keep 2/3
    - Change ÷ to ×
    - Flip 4/5 to 5/4
    - 2/3 × 5/4 = 10/12 = 5/6
    alt: 'Dividing 2/3 by 4/5: keep, change, flip, then multiply to get 10/12, which simplifies to 5/6.'
  activity:
    type: formula
    prompt: Write the answer as n/d in simplest form (a whole number has d = 1).
    inputs:
    - name: n
      label: Top n
      min: 1
      max: 30
      step: 1
      start: 1
    - name: d
      label: Bottom d
      min: 1
      max: 30
      step: 1
      start: 2
    outputs:
    - name: val
      label: n ÷ d
      expr: n/d
      places: 3
    goals:
    - prompt: '3 ÷ 1/4: how many quarters fit in 3 rotis?'
      want:
        n: 12
        d: 1
      mistakes:
      - when:
          n: 3
          d: 4
        say: '3/4 is a quarter of 3. Dividing by 1/4 asks how many quarters fit: 4 in each roti.'
    - prompt: 2/3 ÷ 1/6
      want:
        n: 4
        d: 1
      mistakes:
      - when:
          n: 1
          d: 9
        say: '2/18 = 1/9 multiplies by 1/6. Flip the second fraction: 2/3 × 6/1.'
      - when:
          n: 2
          d: 18
        say: 'That''s multiplying by 1/6. Flip it: 2/3 × 6.'
    - prompt: 3/4 ÷ 1/2
      want:
        n: 3
        d: 2
      mistakes:
      - when:
          n: 3
          d: 8
        say: '3/8 multiplies by 1/2. Dividing by a half doubles: 3/4 × 2.'
      - when:
          n: 6
          d: 4
        say: 'Right value, not simplest: both divide by 2.'
  items:
  - prompt: Find 3 ÷ 1/4.
    answer: '12'
    check: 3/Rational(1,4)
    difficulty: 1
    hints:
    - How many quarters in 3?
    - 3 × 4.
    solution: 3 ÷ 1/4 = 3 × 4 = 12.
    mistakes:
      3/4: c7_frac_divide
  - prompt: What is the reciprocal of 5/7? Give a fraction.
    answer: 7/5
    check: 1/Rational(5,7)
    difficulty: 1
    hints:
    - Flip it.
    - Top and bottom swap.
    solution: The reciprocal of 5/7 is 7/5.
  - prompt: Find 2/3 ÷ 4/5 in simplest form.
    answer: 5/6
    check: Rational(2,3)/Rational(4,5)
    difficulty: 2
    hints:
    - 2/3 × 5/4.
    - 10/12, then simplify.
    solution: 2/3 × 5/4 = 10/12 = 5/6.
    mistakes:
      8/15: c7_frac_divide
  - prompt: Find 3/5 ÷ 3.
    answer: 1/5
    check: Rational(3,5)/3
    difficulty: 2
    hints:
    - 3/5 × 1/3.
    - Cancel the 3s.
    solution: 3/5 × 1/3 = 1/5.
  - prompt: 6 m of ribbon is cut into pieces 3/4 m long. How many pieces?
    answer: '8'
    check: 6/Rational(3,4)
    difficulty: 2
    hints:
    - 6 ÷ 3/4.
    - 6 × 4/3.
    solution: 6 × 4/3 = 24/3 = 8 pieces.
  - prompt: 'Which is larger: 10 ÷ 1/2 or 10 × 1/2?'
    options:
    - 10 ÷ 1/2
    - 10 × 1/2
    - They are equal
    - Cannot tell
    answer: 10 ÷ 1/2
    difficulty: 1
    hints:
    - 10 ÷ 1/2 = 20.
    - 10 × 1/2 = 5.
    solution: 'Dividing by a half doubles: 20; multiplying by a half halves: 5.'
