# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 5. Format: content/README.md.
subject: cbse7-math
chapter: 5
title: Parallel and Intersecting Lines
tips:
  c7_vertical_equal: Angles opposite each other at a crossing are equal; it is the side-by-side ones that add to 180°.
  c7_cointerior: Interior angles on the same side of a transversal add to 180°; they are not equal.
  t7_alternate: "Alternate angles on parallel lines are equal."
  t7_angle_letters: "Trace the angles: corresponding make an F, co-interior a C, and alternate make which zigzag letter?"
  t7_converse_parallel: "If corresponding angles are equal, the lines run in the same direction."
  t7_corresponding: "Corresponding angles on parallel lines are equal. They sit in the same corner at each crossing."
  t7_eight_angles: "Each of the two crossing points makes 4 angles."
  t7_parallel_never_meet: "Do railway tracks ever meet or cross?"
  t7_perp_symbol: "⊥ looks like a line standing upright on another. ∥ is the parallel sign."
  t7_right_angles: "Each angle next to a 90° angle must make 180° with it, and opposite angles are equal."
  t7_straight_angle: "Angles next to each other on a straight line add to 180°."
  t7_x_3x: "x and 3x sit on a straight line, so x + 3x = 180°."
concepts:
- code: cbse7m.lines.types
  title: Intersecting, perpendicular and parallel lines
  notes: |
    Two lines in a plane either intersect (meet at one point) or are parallel (never meet, always the same
    distance apart). Intersecting lines make 4 angles: vertically opposite angles are equal, and angles next to
    each other (a linear pair) add to 180°. Perpendicular lines meet at 90° (all four angles 90°). Symbols:
    AB ∥ CD (parallel), AB ⊥ CD (perpendicular). Examples: rails are parallel; the edges at a corner of a page
    are perpendicular.
  explanations:
    text: Two straight lines either cross or never meet. When they cross, the angles opposite each other are equal, and the two angles side by side add up to 180°. If they cross at a right angle, they are perpendicular. If they never meet, they are parallel, like railway tracks.
    visual: Draw an X. Mark the top angle 40°. The bottom angle, opposite it, is also 40°. Each side angle is 180° − 40° = 140°.
    step_by_step: 'Step 1: Check whether the lines meet. Step 2: If they meet, opposite angles are equal. Step 3: Side-by-side angles add to 180°. Step 4: If one angle is 90°, all four are, and the lines are perpendicular.'
    real_world: A window frame has parallel top and bottom edges and perpendicular corners, so the glass fits as a rectangle.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 2
      B:
      - 9
      - 8
      C:
      - 1
      - 8
      D:
      - 9
      - 2
      O:
      - 5
      - 5
    segments:
    - - A
      - B
    - - C
      - D
    angles:
    - at: O
      from: B
      to: C
      label: x
    - at: O
      from: A
      to: D
      label: x
    caption: 'Lines AB and CD cross at O: opposite angles are equal; neighbours add to 180°.'
    alt: Two lines AB and CD crossing at point O, forming two pairs of equal vertically opposite angles.
  activity:
    type: angle
    prompt: Two straight lines cross. Turn the arm to make each angle.
    goals:
    - prompt: One angle is 40°. Make the angle opposite it.
      degrees: 40
      mistakes:
      - when:
          degrees: 140
        say: 140° is the angle next to it. Opposite angles are equal.
      - when:
          degrees: 320
        say: That goes all the way round. Opposite angles are equal.
    - prompt: One angle is 40°. Make the angle next to it.
      degrees: 140
      mistakes:
      - when:
          degrees: 40
        say: That's the opposite angle. Neighbours on a straight line add to 180°.
      - when:
          degrees: 50
        say: 50° adds to 90°. A straight line is 180°.
    - prompt: The lines are perpendicular. Make one angle.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: 180° is a straight line. Perpendicular lines meet at a right angle.
  items:
  - prompt: Two lines cross. One angle is 40°. What is the angle opposite it, in degrees?
    answer: '40'
    check: '40'
    difficulty: 1
    hints:
    - Vertically opposite angles are equal.
    - Same as 40°.
    solution: 'Vertically opposite angles are equal: 40°.'
    mistakes:
      '140': c7_vertical_equal
  - prompt: Two lines cross. One angle is 40°. What is the angle next to it, in degrees?
    answer: '140'
    check: 180 - 40
    difficulty: 1
    hints:
    - Neighbours make a straight line.
    - 180 − 40.
    solution: 'A linear pair adds to 180°: 180° − 40° = 140°.'
    mistakes: {"40": "t7_straight_angle", "320": "t7_straight_angle"}
  - prompt: 'Railway tracks are an example of:'
    options:
    - Parallel lines
    - Perpendicular lines
    - Intersecting lines
    - Curved lines
    answer: Parallel lines
    difficulty: 1
    hints:
    - They never meet.
    - Always the same distance apart.
    solution: 'Rails stay the same distance apart and never meet: parallel.'
    mistakes: {"Perpendicular lines": "t7_parallel_never_meet", "Intersecting lines": "t7_parallel_never_meet"}
  - prompt: Two lines meet so that one angle is 90°. What are the other three angles?
    options:
    - All 90°
    - 90°, 45°, 45°
    - 180°, 90°, 0°
    - Cannot tell
    answer: All 90°
    difficulty: 2
    hints:
    - Opposite angles are equal.
    - Neighbours add to 180°.
    solution: 'Opposite = 90°, neighbours = 180° − 90° = 90°: all four are right angles.'
    mistakes: {"90°, 45°, 45°": "t7_right_angles", "Cannot tell": "t7_right_angles"}
  - prompt: Two crossing lines make angles x and 3x side by side. Find x in degrees.
    answer: '45'
    check: 180/4
    difficulty: 3
    hints:
    - x + 3x = 180.
    - 4x = 180.
    solution: x + 3x = 180, so 4x = 180 and x = 45°.
    mistakes: {"90": "t7_x_3x", "60": "t7_x_3x"}
  - prompt: What does AB ⊥ CD mean?
    options:
    - AB is perpendicular to CD
    - AB is parallel to CD
    - AB equals CD
    - AB crosses CD at 45°
    answer: AB is perpendicular to CD
    difficulty: 1
    hints:
    - ⊥ looks like a right angle.
    - ∥ means parallel.
    solution: '⊥ means perpendicular: meeting at 90°.'
    mistakes: {"AB is parallel to CD": "t7_perp_symbol", "AB crosses CD at 45°": "t7_perp_symbol"}
- code: cbse7m.lines.transversal
  title: Parallel lines and a transversal
  after:
  - cbse7m.lines.types
  notes: |
    A transversal is a line crossing two (or more) lines. It makes 8 angles. Corresponding angles are in the
    same position at each crossing; alternate angles are on opposite sides of the transversal, between the
    lines; interior angles on the same side are between the lines on one side. If the two lines are parallel:
    corresponding angles are equal, alternate angles are equal, and interior angles on the same side add to
    180°. Conversely, if corresponding (or alternate) angles are equal, the lines are parallel.
  explanations:
    text: When a line cuts across two parallel lines, the angles it makes at the top crossing are copied exactly at the bottom crossing. So angles in matching positions (corresponding) are equal, and Z-shaped (alternate) angles are equal.
    visual: 'Draw two parallel lines across a page and a slanting line cutting both. Trace a Z along the slanting line: the two angles inside the Z are equal. Trace an F: the two angles in matching corners are equal.'
    step_by_step: 'Step 1: Find the transversal. Step 2: Name the pair: corresponding (F-shape), alternate (Z-shape) or same-side interior (C-shape). Step 3: If the lines are parallel, F and Z pairs are equal; C pairs add to 180°.'
    real_world: 'Carpenters check that shelves are parallel by measuring the angle each makes with a slanting support: equal corresponding angles mean parallel shelves.'
  picture:
    kind: geometry
    points:
      A:
      - 0.5
      - 7
      B:
      - 9.5
      - 7
      C:
      - 0.5
      - 3
      D:
      - 9.5
      - 3
      P:
      - 3
      - 9.5
      Q:
      - 7
      - 0.5
    segments:
    - - A
      - B
    - - C
      - D
    - - P
      - Q
    caption: 'AB ∥ CD and PQ is a transversal: corresponding and alternate angles are equal.'
    alt: Two horizontal parallel lines AB and CD crossed by a slanting transversal PQ, making eight angles.
  activity:
    type: angle
    prompt: A transversal cuts two parallel lines. Turn the arm to make each angle.
    goals:
    - prompt: One angle is 65°. Make the corresponding angle.
      degrees: 65
      mistakes:
      - when:
          degrees: 115
        say: '115° sits beside it on the line. Corresponding angles are copies: equal.'
    - prompt: One angle is 65°. Make the co-interior angle (same side, between the lines).
      degrees: 115
      mistakes:
      - when:
          degrees: 65
        say: 'Co-interior angles aren''t equal: they add to 180°.'
      - when:
          degrees: 25
        say: 25° adds to 90°. Co-interior angles add to 180°.
    - prompt: One angle is 110°. Make the alternate angle.
      degrees: 110
      mistakes:
      - when:
          degrees: 70
        say: 70° adds to 110° to make 180°. Alternate angles (the Z shape) are equal.
  items:
  - prompt: Two parallel lines are cut by a transversal. One corresponding angle is 65°. What is the other, in degrees?
    answer: '65'
    check: '65'
    difficulty: 1
    hints:
    - Corresponding angles are equal when lines are parallel.
    - Same position.
    solution: 'Corresponding angles are equal: 65°.'
    mistakes: {"115": "t7_corresponding", "25": "t7_corresponding"}
  - prompt: Two parallel lines are cut by a transversal. One alternate angle is 110°. What is the other, in degrees?
    answer: '110'
    check: '110'
    difficulty: 1
    hints:
    - Alternate angles (Z-shape) are equal.
    - Same size.
    solution: 'Alternate angles are equal: 110°.'
    mistakes: {"70": "t7_alternate", "250": "t7_alternate"}
  - prompt: Two parallel lines are cut by a transversal. One interior angle on the same side is 75°. Find the other, in degrees.
    answer: '105'
    check: 180 - 75
    difficulty: 2
    hints:
    - Same-side interior angles add to 180°.
    - 180 − 75.
    solution: 180° − 75° = 105°.
    mistakes:
      '75': c7_cointerior
  - prompt: Alternate angles look like which letter?
    options:
    - Z
    - F
    - C
    - T
    answer: Z
    difficulty: 1
    hints:
    - Opposite sides of the transversal, between the lines.
    - A zigzag.
    solution: Alternate angles sit inside a Z shape.
    mistakes: {"F": "t7_angle_letters", "C": "t7_angle_letters"}
  - prompt: A transversal makes equal corresponding angles with two lines. What can you say?
    options:
    - The two lines are parallel
    - The two lines are perpendicular
    - The lines meet
    - Nothing
    answer: The two lines are parallel
    difficulty: 2
    hints:
    - This is the reverse rule.
    - Equal corresponding angles.
    solution: If corresponding angles are equal, the lines are parallel.
    mistakes: {"The two lines are perpendicular": "t7_converse_parallel", "The lines meet": "t7_converse_parallel"}
  - prompt: How many angles does a transversal make with two lines?
    answer: '8'
    check: 4*2
    difficulty: 1
    hints:
    - 4 at each crossing.
    - Two crossings.
    solution: 4 + 4 = 8 angles.
    mistakes: {"4": "t7_eight_angles", "6": "t7_eight_angles"}
