# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 5. Format: content/README.md.
subject: cbse7-math
chapter: 5
title: Parallel and Intersecting Lines
tips:
  c7_vertical_equal: Angles opposite each other at a crossing are equal; it is the side-by-side ones that add to 180°.
  c7_cointerior: Interior angles on the same side of a transversal add to 180°; they are not equal.
  t7_alternate: "Alternate angles on parallel lines are equal."
  t7_angle_letters: "Trace the angles: corresponding make an F, co-interior a C, and alternate make which zigzag letter?"
  t7_converse_parallel: "If corresponding angles are equal, the lines run in the same direction."
  t7_corresponding: "Corresponding angles on parallel lines are equal. They sit in the same corner at each crossing."
  t7_eight_angles: "Each of the two crossing points makes 4 angles."
  t7_parallel_never_meet: "Do railway tracks ever meet or cross?"
  t7_perp_symbol: "⊥ looks like a line standing upright on another. ∥ is the parallel sign."
  t7_right_angles: "Each angle next to a 90° angle must make 180° with it, and opposite angles are equal."
  t7_straight_angle: "Angles next to each other on a straight line add to 180°."
  t7_x_3x: "x and 3x sit on a straight line, so x + 3x = 180°."
  c7m5_opposite: Angles across from each other at a crossing are equal; angles side by side on a line add to 180°.
  c7m5_line: Angles that sit together on a straight line add to 180°.
  c7m5_names: 'Corresponding: same position at each crossing (F shape). Alternate: opposite sides, between the lines (Z shape). Same-side interior: between the lines, same side (C shape).'
  c7m5_parallel: With parallel lines, corresponding and alternate angles are equal, and same-side interior angles add to 180°.
concepts:
- code: cbse7m.lines.types
  title: Intersecting, perpendicular and parallel lines
  notes: |
    Two lines in a plane either intersect (meet at one point) or are parallel (never meet, always the same
    distance apart). Intersecting lines make 4 angles: vertically opposite angles are equal, and angles next to
    each other (a linear pair) add to 180°. Perpendicular lines meet at 90° (all four angles 90°). Symbols:
    AB ∥ CD (parallel), AB ⊥ CD (perpendicular). Examples: rails are parallel; the edges at a corner of a page
    are perpendicular.
  explanations:
    text: Two straight lines either cross or never meet. When they cross, the angles opposite each other are equal, and the two angles side by side add up to 180°. If they cross at a right angle, they are perpendicular. If they never meet, they are parallel, like railway tracks.
    visual: Draw an X. Mark the top angle 40°. The bottom angle, opposite it, is also 40°. Each side angle is 180° − 40° = 140°.
    step_by_step: 'Step 1: Check whether the lines meet. Step 2: If they meet, opposite angles are equal. Step 3: Side-by-side angles add to 180°. Step 4: If one angle is 90°, all four are, and the lines are perpendicular.'
    real_world: A window frame has parallel top and bottom edges and perpendicular corners, so the glass fits as a rectangle.
  picture:
    kind: geometry
    points:
      A:
      - 1
      - 2
      B:
      - 9
      - 8
      C:
      - 1
      - 8
      D:
      - 9
      - 2
      O:
      - 5
      - 5
    segments:
    - - A
      - B
    - - C
      - D
    angles:
    - at: O
      from: B
      to: C
      label: x
    - at: O
      from: A
      to: D
      label: x
    caption: 'Lines AB and CD cross at O: opposite angles are equal; neighbours add to 180°.'
    alt: Two lines AB and CD crossing at point O, forming two pairs of equal vertically opposite angles.
  activity:
    type: angle
    prompt: Two straight lines cross. Turn the arm to make each angle.
    goals:
    - prompt: One angle is 40°. Make the angle opposite it.
      degrees: 40
      mistakes:
      - when:
          degrees: 140
        say: 140° is the angle next to it. Opposite angles are equal.
      - when:
          degrees: 320
        say: That goes all the way round. Opposite angles are equal.
    - prompt: One angle is 40°. Make the angle next to it.
      degrees: 140
      mistakes:
      - when:
          degrees: 40
        say: That's the opposite angle. Neighbours on a straight line add to 180°.
      - when:
          degrees: 50
        say: 50° adds to 90°. A straight line is 180°.
    - prompt: The lines are perpendicular. Make one angle.
      degrees: 90
      mistakes:
      - when:
          degrees: 180
        say: 180° is a straight line. Perpendicular lines meet at a right angle.
  lesson:
    - teach: Two lines in a plane either meet at one point (intersecting) or never meet (parallel). Parallel lines stay the same distance apart, like railway tracks. Lines that meet at 90° are perpendicular, like the edges at a page corner.
      picture:
        kind: geometry
        points:
          A:
          - 1
          - 2
          B:
          - 9
          - 2
          C:
          - 1
          - 6
          D:
          - 9
          - 6
        segments:
        - - A
          - B
        - - C
          - D
        alt: 'Two horizontal lines AB and CD that never meet: parallel lines.'
      check:
        prompt: Which pair are perpendicular?
        options:
        - The two edges meeting at a corner of a book
        - Two railway rails
        - Two lines of a ruled notebook
        answer: The two edges meeting at a corner of a book
        why: They meet at a right angle, 90°.
    - teach: When two lines cross, they make 4 angles. Vertically opposite angles are equal. Angles next to each other on a line (a linear pair) add to 180°.
      picture:
        kind: geometry
        points:
          A:
          - 1
          - 2
          B:
          - 9
          - 8
          C:
          - 1
          - 8
          D:
          - 9
          - 2
          O:
          - 5
          - 5
        segments:
        - - A
          - B
        - - C
          - D
        angles:
        - at: O
          from: B
          to: C
          label: 40°
        - at: O
          from: A
          to: D
          label: 40°
        - at: O
          from: C
          to: A
          label: 140°
        alt: Two crossing lines make opposite angles of 40° each, and the neighbouring angle is 140°.
      check:
        prompt: Two lines cross and one angle is 70°. What is its vertically opposite angle?
        options:
        - 70°
        - 110°
        - 20°
        answer: 70°
        why: Vertically opposite angles are equal.
    - teach: 'If one angle at a crossing is 90°, all four are 90°: the lines are perpendicular, written AB ⊥ CD. Parallel lines are written AB ∥ CD.'
      check:
        prompt: What does PQ ∥ RS mean?
        options:
        - PQ is parallel to RS
        - PQ is perpendicular to RS
        - PQ is equal to RS
        answer: PQ is parallel to RS
        why: ∥ is the symbol for parallel.
  items:
  - prompt: Two lines cross. One angle is 40°. What is the angle opposite it, in degrees?
    answer: '40'
    check: '40'
    difficulty: 1
    hints:
    - Vertically opposite angles are equal.
    - Same as 40°.
    solution: 'Vertically opposite angles are equal: 40°.'
    mistakes:
      '140': c7_vertical_equal
  - prompt: Two lines cross. One angle is 40°. What is the angle next to it, in degrees?
    answer: '140'
    check: 180 - 40
    difficulty: 1
    hints:
    - Neighbours make a straight line.
    - 180 − 40.
    solution: 'A linear pair adds to 180°: 180° − 40° = 140°.'
    mistakes: {"40": "t7_straight_angle", "320": "t7_straight_angle"}
  - prompt: 'Railway tracks are an example of:'
    options:
    - Parallel lines
    - Perpendicular lines
    - Intersecting lines
    - Curved lines
    answer: Parallel lines
    difficulty: 1
    hints:
    - They never meet.
    - Always the same distance apart.
    solution: 'Rails stay the same distance apart and never meet: parallel.'
    mistakes: {"Perpendicular lines": "t7_parallel_never_meet", "Intersecting lines": "t7_parallel_never_meet"}
  - prompt: Two lines meet so that one angle is 90°. What are the other three angles?
    options:
    - All 90°
    - 90°, 45°, 45°
    - 180°, 90°, 0°
    - Cannot tell
    answer: All 90°
    difficulty: 2
    hints:
    - Opposite angles are equal.
    - Neighbours add to 180°.
    solution: 'Opposite = 90°, neighbours = 180° − 90° = 90°: all four are right angles.'
    mistakes: {"90°, 45°, 45°": "t7_right_angles", "Cannot tell": "t7_right_angles"}
  - prompt: Two crossing lines make angles x and 3x side by side. Find x in degrees.
    answer: '45'
    check: 180/4
    difficulty: 3
    hints:
    - x + 3x = 180.
    - 4x = 180.
    solution: x + 3x = 180, so 4x = 180 and x = 45°.
    mistakes: {"90": "t7_x_3x", "60": "t7_x_3x"}
  - prompt: What does AB ⊥ CD mean?
    options:
    - AB is perpendicular to CD
    - AB is parallel to CD
    - AB equals CD
    - AB crosses CD at 45°
    answer: AB is perpendicular to CD
    difficulty: 1
    hints:
    - ⊥ looks like a right angle.
    - ∥ means parallel.
    solution: '⊥ means perpendicular: meeting at 90°.'
    mistakes: {"AB is parallel to CD": "t7_perp_symbol", "AB crosses CD at 45°": "t7_perp_symbol"}
  - prompt: Two lines cross. One angle is 65°. What is the angle next to it, in degrees?
    answer: '115'
    check: 180-65
    difficulty: 1
    hints:
    - Neighbouring angles on a line add to 180°.
    - 180 − 65.
    solution: 'Step 1: they form a linear pair. Step 2: 180 − 65 = 115°.'
    mistakes:
      '65': c7m5_opposite
      '25': c7m5_line
  - prompt: Two lines cross. One angle is 125°. What is the angle opposite it, in degrees?
    answer: '125'
    check: '125'
    difficulty: 1
    hints:
    - Opposite angles at a crossing match.
    - No calculation needed.
    solution: Vertically opposite angles are equal, so 125°.
    mistakes:
      '55': c7m5_opposite
  - prompt: Two crossing lines make angles x and 2x side by side. Find x in degrees.
    answer: '60'
    check: 180/3
    difficulty: 2
    hints:
    - Side by side means they add to 180°.
    - x + 2x = 3x.
    solution: 'Step 1: x + 2x = 180. Step 2: 3x = 180. Step 3: x = 60°.'
    mistakes:
      '90': c7m5_line
      '45': c7m5_line
  - prompt: Two lines cross. One angle is 50°. What do all four angles add up to, in degrees?
    answer: '360'
    check: 50+130+50+130
    difficulty: 2
    hints:
    - 'Find all four: 50, 130, 50, 130.'
    - 'Or: they go all the way round the point.'
    solution: 'Step 1: angles 50°, 130°, 50°, 130°. Step 2: total 360°, a full turn.'
    mistakes:
      '180': c7m5_line
  - prompt: Which is an example of parallel lines?
    options:
    - Opposite edges of a blackboard
    - The hands of a clock at 3 o'clock
    - The letter X
    answer: Opposite edges of a blackboard
    difficulty: 1
    hints:
    - Parallel lines never meet.
    - Clock hands at 3 o'clock meet at the centre.
    solution: Opposite edges of a rectangle never meet and stay the same distance apart.
    mistakes:
      The hands of a clock at 3 o'clock: t7_parallel_never_meet
      The letter X: t7_parallel_never_meet
  - prompt: Two crossing lines make a linear pair where one angle is 30° more than the other. Find the smaller angle.
    answer: '75'
    check: (180-30)/2
    difficulty: 3
    hints:
    - Let the angles be x and x + 30.
    - x + x + 30 = 180.
    solution: 'Step 1: 2x + 30 = 180. Step 2: 2x = 150. Step 3: x = 75°.'
    mistakes:
      '90': c7m5_line
      '105': c7m5_line
  - prompt: 'At 3 o''clock, the hands of a clock are:'
    options:
    - Perpendicular
    - Parallel
    - On top of each other
    answer: Perpendicular
    difficulty: 1
    hints:
    - One hand points up, one to the right.
    - What angle is that?
    solution: The hands make 90°, so they are perpendicular.
    mistakes:
      Parallel: t7_right_angles
      On top of each other: t7_right_angles
  - prompt: Two lines cross. One angle is 90°. What is the sum of the other three, in degrees?
    answer: '270'
    check: 360-90
    difficulty: 2
    hints:
    - All four add to 360°.
    - 'Or: each of the others is also 90°.'
    solution: 'Step 1: all four angles are 90°. Step 2: 3 × 90 = 270°.'
    mistakes:
      '90': c7m5_opposite
      '180': c7m5_line
  - prompt: How many points do two different intersecting straight lines share?
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Picture an X.
    - Where do the lines touch?
    solution: Two different straight lines can cross at only one point.
    mistakes:
      '2': t7_parallel_never_meet
      '0': t7_parallel_never_meet
- code: cbse7m.lines.transversal
  title: Parallel lines and a transversal
  after:
  - cbse7m.lines.types
  notes: |
    A transversal is a line crossing two (or more) lines. It makes 8 angles. Corresponding angles are in the
    same position at each crossing; alternate angles are on opposite sides of the transversal, between the
    lines; interior angles on the same side are between the lines on one side. If the two lines are parallel:
    corresponding angles are equal, alternate angles are equal, and interior angles on the same side add to
    180°. Conversely, if corresponding (or alternate) angles are equal, the lines are parallel.
  explanations:
    text: When a line cuts across two parallel lines, the angles it makes at the top crossing are copied exactly at the bottom crossing. So angles in matching positions (corresponding) are equal, and Z-shaped (alternate) angles are equal.
    visual: 'Draw two parallel lines across a page and a slanting line cutting both. Trace a Z along the slanting line: the two angles inside the Z are equal. Trace an F: the two angles in matching corners are equal.'
    step_by_step: 'Step 1: Find the transversal. Step 2: Name the pair: corresponding (F-shape), alternate (Z-shape) or same-side interior (C-shape). Step 3: If the lines are parallel, F and Z pairs are equal; C pairs add to 180°.'
    real_world: 'Carpenters check that shelves are parallel by measuring the angle each makes with a slanting support: equal corresponding angles mean parallel shelves.'
  picture:
    kind: geometry
    points:
      A:
      - 0.5
      - 7
      B:
      - 9.5
      - 7
      C:
      - 0.5
      - 3
      D:
      - 9.5
      - 3
      P:
      - 3
      - 9.5
      Q:
      - 7
      - 0.5
    segments:
    - - A
      - B
    - - C
      - D
    - - P
      - Q
    caption: 'AB ∥ CD and PQ is a transversal: corresponding and alternate angles are equal.'
    alt: Two horizontal parallel lines AB and CD crossed by a slanting transversal PQ, making eight angles.
  activity:
    type: angle
    prompt: A transversal cuts two parallel lines. Turn the arm to make each angle.
    goals:
    - prompt: One angle is 65°. Make the corresponding angle.
      degrees: 65
      mistakes:
      - when:
          degrees: 115
        say: '115° sits beside it on the line. Corresponding angles are copies: equal.'
    - prompt: One angle is 65°. Make the co-interior angle (same side, between the lines).
      degrees: 115
      mistakes:
      - when:
          degrees: 65
        say: 'Co-interior angles aren''t equal: they add to 180°.'
      - when:
          degrees: 25
        say: 25° adds to 90°. Co-interior angles add to 180°.
    - prompt: One angle is 110°. Make the alternate angle.
      degrees: 110
      mistakes:
      - when:
          degrees: 70
        say: 70° adds to 110° to make 180°. Alternate angles (the Z shape) are equal.
  lesson:
    - teach: 'A transversal is a line that crosses two (or more) lines. With two lines it makes 8 angles: 4 at each crossing.'
      picture:
        kind: geometry
        points:
          A:
          - 0
          - 3
          B:
          - 10
          - 3
          C:
          - 0
          - 7
          D:
          - 10
          - 7
          P:
          - 3
          - 0
          Q:
          - 7
          - 10
          M:
          - 4.2
          - 3
          N:
          - 5.8
          - 7
        segments:
        - - A
          - B
        - - C
          - D
        - - P
          - Q
        angles:
        - at: M
          from: B
          to: Q
          label: '1'
        - at: N
          from: D
          to: Q
          label: '5'
        alt: 'Two parallel lines cut by a transversal; angles 1 and 5 are in the same position at each crossing: corresponding angles.'
      check:
        prompt: How many angles does a transversal make with two lines?
        options:
        - '8'
        - '4'
        - '6'
        answer: '8'
        why: 4 at each of the 2 crossings.
    - teach: Corresponding angles are in the same position at each crossing (an F shape). Alternate angles are between the lines on opposite sides of the transversal (a Z shape). Same-side interior angles are between the lines on the same side (a C shape).
      check:
        prompt: Alternate angles make which letter shape?
        options:
        - Z
        - F
        - C
        answer: Z
        why: They sit in the two corners of a Z.
    - teach: 'If the two lines are parallel: corresponding angles are equal, alternate angles are equal, and same-side interior angles add to 180°. And the other way round: if corresponding or alternate angles are equal, the lines must be parallel.'
      picture:
        kind: compare
        columns:
        - title: Pair
          points:
          - Corresponding (F)
          - Alternate (Z)
          - Same-side interior (C)
        - title: With parallel lines
          points:
          - equal
          - equal
          - add to 180°
        alt: With parallel lines, corresponding and alternate angles are equal; same-side interior angles add to 180°.
      check:
        prompt: Parallel lines, same-side interior angle 120°. What is the other?
        options:
        - 60°
        - 120°
        - 240°
        answer: 60°
        why: They add to 180°.
  items:
  - prompt: Two parallel lines are cut by a transversal. One corresponding angle is 65°. What is the other, in degrees?
    answer: '65'
    check: '65'
    difficulty: 1
    hints:
    - Corresponding angles are equal when lines are parallel.
    - Same position.
    solution: 'Corresponding angles are equal: 65°.'
    mistakes: {"115": "t7_corresponding", "25": "t7_corresponding"}
  - prompt: Two parallel lines are cut by a transversal. One alternate angle is 110°. What is the other, in degrees?
    answer: '110'
    check: '110'
    difficulty: 1
    hints:
    - Alternate angles (Z-shape) are equal.
    - Same size.
    solution: 'Alternate angles are equal: 110°.'
    mistakes: {"70": "t7_alternate", "250": "t7_alternate"}
  - prompt: Two parallel lines are cut by a transversal. One interior angle on the same side is 75°. Find the other, in degrees.
    answer: '105'
    check: 180 - 75
    difficulty: 2
    hints:
    - Same-side interior angles add to 180°.
    - 180 − 75.
    solution: 180° − 75° = 105°.
    mistakes:
      '75': c7_cointerior
  - prompt: Alternate angles look like which letter?
    options:
    - Z
    - F
    - C
    - T
    answer: Z
    difficulty: 1
    hints:
    - Opposite sides of the transversal, between the lines.
    - A zigzag.
    solution: Alternate angles sit inside a Z shape.
    mistakes: {"F": "t7_angle_letters", "C": "t7_angle_letters"}
  - prompt: A transversal makes equal corresponding angles with two lines. What can you say?
    options:
    - The two lines are parallel
    - The two lines are perpendicular
    - The lines meet
    - Nothing
    answer: The two lines are parallel
    difficulty: 2
    hints:
    - This is the reverse rule.
    - Equal corresponding angles.
    solution: If corresponding angles are equal, the lines are parallel.
    mistakes: {"The two lines are perpendicular": "t7_converse_parallel", "The lines meet": "t7_converse_parallel"}
  - prompt: How many angles does a transversal make with two lines?
    answer: '8'
    check: 4*2
    difficulty: 1
    hints:
    - 4 at each crossing.
    - Two crossings.
    solution: 4 + 4 = 8 angles.
    mistakes: {"4": "t7_eight_angles", "6": "t7_eight_angles"}
  - prompt: Parallel lines are cut by a transversal. One corresponding angle is 72°. What is the other, in degrees?
    answer: '72'
    check: '72'
    difficulty: 1
    hints:
    - Corresponding angles with parallel lines…
    - …are equal.
    solution: 'With parallel lines, corresponding angles are equal: 72°.'
    mistakes:
      '108': c7m5_parallel
  - prompt: Parallel lines are cut by a transversal. One same-side interior angle is 58°. Find the other, in degrees.
    answer: '122'
    check: 180-58
    difficulty: 2
    hints:
    - Same-side interior angles add to 180°.
    - 180 − 58.
    solution: 'Step 1: they add to 180°. Step 2: 180 − 58 = 122°.'
    mistakes:
      '58': c7m5_parallel
      '32': c7m5_parallel
  - prompt: Parallel lines are cut by a transversal. One alternate angle is 47°. What is the other, in degrees?
    answer: '47'
    check: '47'
    difficulty: 1
    hints:
    - Think of the Z shape.
    - With parallel lines they match.
    solution: 'Alternate angles between parallel lines are equal: 47°.'
    mistakes:
      '133': c7m5_parallel
  - prompt: Corresponding angles make which letter shape?
    options:
    - F
    - Z
    - C
    answer: F
    difficulty: 1
    hints:
    - They are in the same position at each crossing.
    - One above the other along the transversal.
    solution: Corresponding angles sit like the two arms of an F.
    mistakes:
      Z: c7m5_names
      C: c7m5_names
  - prompt: A transversal makes alternate angles of 80° and 85° with two lines. Are the lines parallel?
    options:
    - No, alternate angles would be equal
    - 'Yes'
    - Only if extended
    answer: No, alternate angles would be equal
    difficulty: 2
    hints:
    - For parallel lines, alternate angles are equal.
    - Are 80° and 85° equal?
    solution: Unequal alternate angles mean the lines are not parallel; they will meet somewhere.
    mistakes:
      'Yes': t7_converse_parallel
      Only if extended: t7_converse_parallel
  - prompt: Parallel lines, one angle at a crossing is 110°. What is the angle vertically opposite its corresponding angle, in degrees?
    answer: '110'
    check: '110'
    difficulty: 3
    hints:
    - The corresponding angle is 110°.
    - Its vertically opposite angle is equal to it.
    solution: 'Step 1: corresponding angle = 110°. Step 2: its vertically opposite angle = 110°.'
    mistakes:
      '70': c7m5_opposite
  - prompt: Parallel lines, same-side interior angles are x and 2x. Find x in degrees.
    answer: '60'
    check: 180/3
    difficulty: 3
    hints:
    - Same-side interior angles add to 180°.
    - x + 2x = 180.
    solution: 'Step 1: 3x = 180. Step 2: x = 60°.'
    mistakes:
      '90': c7m5_parallel
      '120': c7m5_parallel
  - prompt: Parallel lines are cut by a transversal. One angle is 35°. Which of these could NOT be another of the 8 angles?
    options:
    - 90°
    - 35°
    - 145°
    answer: 90°
    difficulty: 3
    hints:
    - Each angle is either 35° or its partner on the line.
    - 180 − 35 = 145.
    solution: All 8 angles are 35° or 145°, so 90° cannot appear.
    mistakes:
      35°: c7m5_parallel
      145°: c7m5_parallel
  - prompt: Which tells you two lines are parallel?
    options:
    - Equal corresponding angles
    - One angle of 90°
    - Angles that add to 360°
    answer: Equal corresponding angles
    difficulty: 2
    hints:
    - Think of the converse rule.
    - Matching angles in the same position.
    solution: If corresponding angles are equal, the lines are parallel.
    mistakes:
      One angle of 90°: t7_converse_parallel
      Angles that add to 360°: t7_converse_parallel
