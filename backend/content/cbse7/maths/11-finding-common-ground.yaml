# CBSE Class 7 Mathematics (NCERT Ganita Prakash Part 2, chapter 3), SYNiq chapter 11. Format: content/README.md.
subject: cbse7-math
chapter: 11
title: Finding Common Ground
tips:
  c7_hcf_lcm: HCF is the biggest number that divides both; LCM is the smallest number both divide. Check which one the question asks for.
  c7_lcm_smallest: A common multiple is not always the lowest. List multiples and take the first one in both lists.
  t7_bells_lcm: "The bells ring together at times that are multiples of both 6 and 8. Find the smallest one."
  t7_hcf: "List the prime factors of both. Multiply the ones they share."
  t7_hcf_lcm_product: "HCF × LCM = product of the two numbers. Divide the product by the HCF."
  t7_hcf_lcm_rule: "Test with 4 and 6: HCF 2, LCM 12. Which rule works?"
  t7_kits_hcf: "Each kit must use all pencils and erasers equally. The largest number that divides both is the HCF."
  t7_lcm: "The LCM is the smallest number both divide into. List multiples of the bigger one until the other divides it."
  t7_primes_only: "Every factor must be prime. Can 10, 6 or 30 be broken down further?"
  t7_two_primes: "77 is their product and 7 divides only one of them. A prime's only factors are 1 and itself. What do two different primes both share?"
  c7m11_shared: Write both numbers as products of primes, then keep only the primes BOTH have, each as often as it appears in both.
  c7m11_every: For the smallest common multiple, use every prime that appears, each the greatest number of times it appears in either number.
  c7m11_which: Sharing or cutting into the biggest equal groups uses the common factor; things happening together again uses the common multiple.
  c7m11_tree: Keep splitting until every branch ends in a prime. Then multiply the primes back to check you get the number.
  c7m11_product: For two numbers, HCF × LCM equals the two numbers multiplied together.
concepts:
- code: cbse7m.hcf.primes
  title: Prime factorisation and HCF
  notes: |
    Every whole number greater than 1 can be written as a product of primes in exactly one way (apart from
    order): 60 = 2 × 2 × 3 × 5. Factor trees or repeated division find it. The HCF (highest common factor) of
    two numbers is the largest number dividing both. Method: write both as primes and multiply the primes they
    share (each as many times as it appears in both): 24 = 2³ × 3, 36 = 2² × 3², HCF = 2² × 3 = 12. Use HCF to
    cut things into the largest equal pieces with nothing left over.
  explanations:
    text: Every number is built from prime numbers in just one way, like 60 = 2 × 2 × 3 × 5. The HCF of two numbers is the biggest number that divides both; find it by multiplying the primes they have in common.
    visual: 'Draw two factor trees side by side: 24 splits into 2 × 2 × 2 × 3, and 36 into 2 × 2 × 3 × 3. Circle the shared primes: two 2s and one 3. Multiply them: 12.'
    step_by_step: 'Step 1: Break each number into primes. Step 2: Find the primes both share. Step 3: Use each shared prime as many times as it appears in both. Step 4: Multiply them to get the HCF.'
    real_world: A teacher has 24 pencils and 36 erasers to pack into identical kits with nothing left over. The most kits is HCF(24, 36) = 12, each with 2 pencils and 3 erasers.
  picture:
    kind: flow
    steps:
    - 24 = 2 × 2 × 2 × 3
    - 36 = 2 × 2 × 3 × 3
    - 'Shared: 2, 2 and 3'
    - HCF = 2 × 2 × 3
    - HCF = 12
    alt: 'Finding the HCF of 24 and 36: write both as primes, pick the shared primes 2, 2 and 3, and multiply to get 12.'
  activity:
    type: formula
    prompt: 'Build a number from primes: 2ᵃ × 3ᵇ × 5ᶜ.'
    inputs:
    - name: a
      label: How many 2s
      min: 0
      max: 3
      step: 1
      start: 0
    - name: b
      label: How many 3s
      min: 0
      max: 2
      step: 1
      start: 0
    - name: c
      label: How many 5s
      min: 0
      max: 2
      step: 1
      start: 0
    outputs:
    - name: val
      label: The number
      expr: 2^a*3^b*5^c
    goals:
    - prompt: Build 60.
      want:
        val: 60
      mistakes:
      - when:
          a: 1
          b: 1
          c: 1
        say: 'That''s 30. 60 = 2 × 2 × 3 × 5: two 2s.'
    - prompt: Build the HCF of 60 (2 × 2 × 3 × 5) and 72 (2 × 2 × 2 × 3 × 3).
      want:
        val: 12
      mistakes:
      - when:
          val: 360
        say: 360 is the LCM. The HCF uses only primes both share, as few times as either has.
      - when:
          val: 6
        say: Both have at least two 2s, so the HCF can use two.
    - prompt: Build the HCF of 45 (3 × 3 × 5) and 75 (3 × 5 × 5).
      want:
        val: 15
      mistakes:
      - when:
          val: 225
        say: '225 uses the most of each prime: that''s the LCM.'
      - when:
          val: 5
        say: Both are divisible by 3 too.
  lesson:
    - teach: 'Every whole number above 1 is a product of primes in just one way. Split it in a factor tree until every branch ends in a prime: 72 = 8 × 9 = 2 × 2 × 2 × 3 × 3 = 2³ × 3².'
      picture:
        kind: flow
        steps:
        - '72'
        - 8 × 9
        - 2 × 4 × 3 × 3
        - 2 × 2 × 2 × 3 × 3
        - 2³ × 3²
        alt: Factor tree steps from 72 down to 2³ × 3².
      check:
        prompt: Which is the prime factorisation of 45?
        options:
        - 3 × 3 × 5
        - 5 × 9
        - 3 × 15
        answer: 3 × 3 × 5
        why: 9 and 15 are not prime; 3, 3 and 5 are.
    - teach: The HCF (highest common factor) is the largest number that divides both. Write both as primes and multiply the primes they share. 30 = 2 × 3 × 5 and 42 = 2 × 3 × 7 share 2 and 3, so the HCF is 6.
      picture:
        kind: compare
        columns:
        - title: '30'
          points:
          - 2 × 3 × 5
        - title: Shared
          points:
          - 2 × 3 = 6
        - title: '42'
          points:
          - 2 × 3 × 7
        alt: 30 and 42 share the primes 2 and 3, so their HCF is 6.
      check:
        prompt: Find the HCF of 20 = 2 × 2 × 5 and 30 = 2 × 3 × 5.
        options:
        - '10'
        - '5'
        - '60'
        answer: '10'
        why: 'They share one 2 and one 5: 2 × 5 = 10.'
    - teach: 'HCF solves ''largest equal pieces with nothing left over'' problems. 18 m and 24 m ropes cut into the longest equal pieces: the HCF is 6, so pieces are 6 m long. Two numbers with no common prime have HCF 1 (they are co-prime).'
      check:
        prompt: What is the HCF of 8 and 15?
        options:
        - '1'
        - '8'
        - '120'
        answer: '1'
        why: 8 = 2³ and 15 = 3 × 5 share no prime.
  items:
  - prompt: Which is the prime factorisation of 60?
    options:
    - 2 × 2 × 3 × 5
    - 2 × 3 × 10
    - 6 × 10
    - 2 × 30
    answer: 2 × 2 × 3 × 5
    difficulty: 1
    hints:
    - Every factor must be prime.
    - 10 and 6 are not prime.
    solution: 60 = 2 × 2 × 3 × 5, all primes.
    mistakes: {"2 × 3 × 10": "t7_primes_only", "6 × 10": "t7_primes_only"}
  - prompt: Find the HCF of 24 and 36.
    answer: '12'
    check: gcd(24, 36)
    difficulty: 1
    hints:
    - 24 = 2³ × 3; 36 = 2² × 3².
    - 'Shared: 2² × 3.'
    solution: HCF = 2 × 2 × 3 = 12.
    mistakes:
      '72': c7_hcf_lcm
  - prompt: Find the HCF of 18 and 45.
    answer: '9'
    check: gcd(18, 45)
    difficulty: 1
    hints:
    - 18 = 2 × 3²; 45 = 3² × 5.
    - 'Shared: 3².'
    solution: HCF = 3 × 3 = 9.
    mistakes: {"90": "hcf_lcm_swapped", "3": "t7_hcf"}
  - prompt: Find the HCF of 84 and 126.
    answer: '42'
    check: gcd(84, 126)
    difficulty: 2
    hints:
    - 84 = 2² × 3 × 7; 126 = 2 × 3² × 7.
    - 'Shared: 2 × 3 × 7.'
    solution: HCF = 2 × 3 × 7 = 42.
    mistakes: {"252": "hcf_lcm_swapped", "14": "t7_hcf"}
  - prompt: 24 pencils and 36 erasers go into identical kits with nothing left over. What is the largest number of kits?
    answer: '12'
    check: gcd(24, 36)
    difficulty: 2
    hints:
    - Largest number dividing both.
    - HCF.
    solution: HCF(24, 36) = 12 kits.
    mistakes: {"72": "t7_kits_hcf", "6": "t7_kits_hcf"}
  - prompt: What is the HCF of two different prime numbers, such as 7 and 11?
    answer: '1'
    check: gcd(7, 11)
    difficulty: 2
    hints:
    - Primes have only 1 and themselves as factors.
    - Nothing else is shared.
    solution: Two different primes share only the factor 1.
    mistakes: {"77": "t7_two_primes", "7": "t7_two_primes"}
  - prompt: Which is the prime factorisation of 84?
    options:
    - 2 × 2 × 3 × 7
    - 4 × 3 × 7
    - 2 × 6 × 7
    answer: 2 × 2 × 3 × 7
    difficulty: 1
    hints:
    - 84 = 4 × 21.
    - Break 4 and 21 into primes.
    solution: 84 = 4 × 21 = 2 × 2 × 3 × 7. 4 and 6 are not prime.
    mistakes:
      4 × 3 × 7: c7m11_tree
      2 × 6 × 7: c7m11_tree
  - prompt: Find the HCF of 16 and 40.
    answer: '8'
    check: '8'
    difficulty: 1
    hints:
    - 16 = 2⁴, 40 = 2³ × 5.
    - How many 2s do both have?
    solution: 'Step 1: 16 = 2 × 2 × 2 × 2 and 40 = 2 × 2 × 2 × 5. Step 2: they share three 2s: 2 × 2 × 2 = 8.'
    mistakes:
      '4': c7m11_shared
      '80': c7m11_which
  - prompt: Find the HCF of 27 and 36.
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - 27 = 3³, 36 = 2² × 3².
    - Shared 3s?
    solution: 'Step 1: 27 = 3 × 3 × 3 and 36 = 2 × 2 × 3 × 3. Step 2: they share two 3s: 9.'
    mistakes:
      '3': c7m11_shared
      '108': c7m11_which
  - prompt: Find the HCF of 35 and 64.
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - 35 = 5 × 7.
    - 64 is only 2s.
    solution: 35 = 5 × 7 and 64 = 2⁶ share no prime, so the HCF is 1.
    mistakes:
      '7': c7m11_shared
      '5': c7m11_shared
  - prompt: Find the HCF of 48 and 72.
    answer: '24'
    check: '24'
    difficulty: 2
    hints:
    - 48 = 2⁴ × 3, 72 = 2³ × 3².
    - Take the smaller count of each prime.
    solution: 'Step 1: 48 = 2⁴ × 3 and 72 = 2³ × 3². Step 2: shared: 2³ × 3 = 24.'
    mistakes:
      '12': c7m11_shared
      '144': c7m11_which
  - prompt: Find the HCF of 12, 18 and 30.
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - 12 = 2² × 3, 18 = 2 × 3², 30 = 2 × 3 × 5.
    - Which primes are in all three?
    solution: 'Step 1: all three contain one 2 and one 3. Step 2: HCF = 2 × 3 = 6.'
    mistakes:
      '3': c7m11_shared
      '180': c7m11_which
  - prompt: Two ropes of 45 m and 60 m are cut into equal pieces as long as possible, with nothing left. How long is each piece, in m?
    answer: '15'
    check: '15'
    difficulty: 2
    hints:
    - 'Longest equal pieces: use the HCF.'
    - 45 = 3² × 5, 60 = 2² × 3 × 5.
    solution: 'Step 1: 45 and 60 share 3 and 5. Step 2: HCF = 15, so each piece is 15 m.'
    mistakes:
      '5': c7m11_shared
      '180': c7m11_which
  - prompt: A hall is 16 m by 20 m. What is the largest square tile side, in m, that covers it with whole tiles?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - The side must divide both 16 and 20.
    - Find the HCF.
    solution: 'Step 1: 16 = 2⁴ and 20 = 2² × 5. Step 2: HCF = 2² = 4 m.'
    mistakes:
      '2': c7m11_shared
      '80': c7m11_which
  - prompt: There are 60 boys and 84 girls. They form the largest possible equal teams with only boys or only girls in each. How many students in each team?
    answer: '12'
    check: '12'
    difficulty: 3
    hints:
    - The team size must divide 60 and 84.
    - Find the HCF of 60 and 84.
    solution: 'Step 1: 60 = 2² × 3 × 5 and 84 = 2² × 3 × 7. Step 2: HCF = 2² × 3 = 12 students per team.'
    mistakes:
      '6': c7m11_shared
      '420': c7m11_which
  - prompt: The HCF of two numbers is 1. Which pair could they be?
    options:
    - 9 and 16
    - 9 and 15
    - 8 and 12
    answer: 9 and 16
    difficulty: 3
    hints:
    - Find a pair with no common prime.
    - 9 = 3², 16 = 2⁴.
    solution: 9 and 16 share no prime, so their HCF is 1. 9 and 15 share 3; 8 and 12 share 4.
    mistakes:
      9 and 15: c7m11_shared
      8 and 12: c7m11_shared
  - prompt: A number's prime factorisation is 2 × 3² × 5. What is the number?
    answer: '90'
    check: 2*3**2*5
    difficulty: 3
    hints:
    - 3² means 3 × 3.
    - 2 × 9 × 5.
    solution: 'Step 1: 3² = 9. Step 2: 2 × 9 × 5 = 90.'
    mistakes:
      '30': c7m11_tree
      '60': c7m11_tree
- code: cbse7m.hcf.lcm
  title: LCM and its link with HCF
  after:
  - cbse7m.hcf.primes
  notes: |
    The LCM (lowest common multiple) is the smallest number that both numbers divide into. Method: multiply
    every prime that appears, each the greatest number of times it appears in either: 24 = 2³ × 3,
    36 = 2² × 3², LCM = 2³ × 3² = 72. For two numbers, HCF × LCM = product of the numbers (12 × 72 = 24 × 36 =
    864). Use LCM for 'when will they happen together again': two bells ringing every 6 and 8 minutes ring
    together every 24 minutes.
  explanations:
    text: 'The LCM is the first number that appears in both times tables. For 6 and 8 it is 24. A neat fact: HCF × LCM equals the two numbers multiplied together.'
    visual: Write the multiples of 6 (6, 12, 18, 24, 30…) and of 8 (8, 16, 24, 32…). The first number in both lists is 24.
    step_by_step: 'Step 1: Break each number into primes. Step 2: Take every prime that appears. Step 3: Use the highest power of each. Step 4: Multiply. Step 5: Check: HCF × LCM = product.'
    real_world: Two buses leave the stand together, one every 6 minutes and one every 8 minutes. They leave together again after LCM(6, 8) = 24 minutes.
  picture:
    kind: compare
    columns:
    - title: HCF
      points:
      - Highest common factor
      - Divides both numbers
      - Shared primes, lowest powers
      - Cutting into equal pieces
    - title: LCM
      points:
      - Lowest common multiple
      - Both numbers divide it
      - All primes, highest powers
      - When things happen together again
    alt: 'HCF and LCM compared: the HCF divides both numbers and uses shared primes; the LCM is divided by both and uses all primes at their highest powers.'
  activity:
    type: number_line
    min: 0
    max: 40
    step: 1
    start: 0
    prompt: Mark the lowest common multiple (LCM).
    goals:
    - prompt: LCM of 6 and 8
      target: 24
      mistakes:
      - when:
          v: 12
        say: '12 is in the 6 times table but not the 8 times table. Keep going: 6, 12, 18, 24 …'
      - when:
          v: 2
        say: '2 is the HCF: it divides both. The LCM is a number both divide into.'
    - prompt: LCM of 4 and 10
      target: 20
      mistakes:
      - when:
          v: 40
        say: '40 works, but 20 comes first: 10, 20 …'
      - when:
          v: 14
        say: 4 + 10 adds them. The LCM is in both times tables.
    - prompt: Two bells ring every 3 and 5 minutes. When do they ring together again?
      target: 15
      mistakes:
      - when:
          v: 8
        say: 3 + 5 = 8, but 8 isn't in the 3 times table.
      - when:
          v: 30
        say: They meet at 30, but they already met earlier.
  lesson:
    - teach: 'The LCM (lowest common multiple) is the smallest number both numbers divide into. List multiples: 4 → 4, 8, 12, 16 …; 6 → 6, 12, 18 …; the first shared one is 12, so LCM(4, 6) = 12.'
      picture:
        kind: number_line
        from: 0
        to: 24
        step: 2
        points:
        - at: 12
          label: both
        - at: 24
          label: both
        alt: Multiples of 4 and of 6 first meet at 12, then at 24.
      check:
        prompt: Find the LCM of 3 and 5.
        options:
        - '15'
        - '8'
        - '1'
        answer: '15'
        why: 15 is the first number in both lists.
    - teach: 'With primes: use every prime that appears, each the greatest number of times. 12 = 2² × 3 and 18 = 2 × 3², so LCM = 2² × 3² = 36. For two numbers, HCF × LCM = their product: 6 × 36 = 12 × 18 = 216.'
      picture:
        kind: compare
        columns:
        - title: '12'
          points:
          - 2² × 3
        - title: '18'
          points:
          - 2 × 3²
        - title: LCM
          points:
          - 2² × 3² = 36
        alt: 'The LCM of 12 and 18 takes the highest power of each prime: 36.'
      check:
        prompt: Find the LCM of 10 = 2 × 5 and 15 = 3 × 5.
        options:
        - '30'
        - '150'
        - '5'
        answer: '30'
        why: 2 × 3 × 5 = 30.
    - teach: LCM answers 'when will they happen together again?'. Buses leave every 10 and 15 minutes from the same stop at 8:00. They leave together again after LCM(10, 15) = 30 minutes, at 8:30.
      check:
        prompt: Two lights blink every 4 s and 10 s, together now. After how many seconds will they blink together again?
        options:
        - '20'
        - '40'
        - '14'
        answer: '20'
        why: LCM(4, 10) = 20.
  items:
  - prompt: Find the LCM of 6 and 8.
    answer: '24'
    check: lcm(6, 8)
    difficulty: 1
    hints:
    - "List the multiples of 8 and check which is also a multiple of 6."
    - Which is also a multiple of 6?
    solution: 24 is the first common multiple.
    mistakes:
      '48': c7_lcm_smallest
  - prompt: Find the LCM of 24 and 36.
    answer: '72'
    check: lcm(24, 36)
    difficulty: 2
    hints:
    - 2³ × 3².
    - 8 × 9.
    solution: LCM = 2³ × 3² = 72.
    mistakes: {"12": "hcf_lcm_swapped", "864": "t7_lcm"}
  - prompt: Find the LCM of 4, 6 and 10.
    answer: '60'
    check: lcm(lcm(4, 6), 10)
    difficulty: 2
    hints:
    - 4 = 2², 6 = 2 × 3, 10 = 2 × 5.
    - 2² × 3 × 5.
    solution: LCM = 4 × 3 × 5 = 60.
    mistakes: {"240": "t7_lcm", "2": "hcf_lcm_swapped"}
  - prompt: Two bells ring every 6 and every 8 minutes. They ring together at 9:00. After how many minutes will they next ring together?
    answer: '24'
    check: lcm(6, 8)
    difficulty: 1
    hints:
    - LCM of 6 and 8.
    - First common multiple.
    solution: LCM(6, 8) = 24 minutes.
    mistakes: {"48": "t7_bells_lcm", "2": "t7_bells_lcm"}
  - prompt: The HCF of two numbers is 4 and their product is 96. Find their LCM.
    answer: '24'
    check: 96/4
    difficulty: 3
    hints:
    - HCF × LCM = product.
    - 96 ÷ 4.
    solution: LCM = 96 ÷ 4 = 24.
    mistakes: {"384": "hcf_times_lcm_divide", "92": "t7_hcf_lcm_product"}
  - prompt: Which is always true for two numbers?
    options:
    - HCF × LCM = their product
    - HCF + LCM = their sum
    - HCF = LCM
    - LCM is smaller than HCF
    answer: HCF × LCM = their product
    difficulty: 2
    hints:
    - 'Try 4 and 6: HCF 2, LCM 12.'
    - 2 × 12 = 24 = 4 × 6.
    solution: HCF × LCM always equals the product of the two numbers.
    mistakes: {"HCF + LCM = their sum": "t7_hcf_lcm_rule", "LCM is smaller than HCF": "t7_hcf_lcm_rule"}
  - prompt: Find the LCM of 9 and 12.
    answer: '36'
    check: '36'
    difficulty: 1
    hints:
    - 9 = 3², 12 = 2² × 3.
    - Take the highest power of each prime.
    solution: 'Step 1: 9 = 3² and 12 = 2² × 3. Step 2: LCM = 2² × 3² = 36.'
    mistakes:
      '108': c7m11_every
      '3': c7m11_which
  - prompt: Find the LCM of 5 and 7.
    answer: '35'
    check: 5*7
    difficulty: 1
    hints:
    - 5 and 7 share no factor.
    - Multiply them.
    solution: They share no prime, so LCM = 5 × 7 = 35.
    mistakes:
      '12': c7m11_every
      '1': c7m11_which
  - prompt: Find the LCM of 8 and 12.
    answer: '24'
    check: '24'
    difficulty: 1
    hints:
    - 8 = 2³, 12 = 2² × 3.
    - 2³ × 3.
    solution: 'Step 1: highest power of 2 is 2³, of 3 is 3. Step 2: 8 × 3 = 24.'
    mistakes:
      '96': c7m11_every
      '4': c7m11_which
  - prompt: Find the LCM of 6, 9 and 15.
    answer: '90'
    check: '90'
    difficulty: 2
    hints:
    - 6 = 2 × 3, 9 = 3², 15 = 3 × 5.
    - 2 × 3² × 5.
    solution: 'Step 1: primes 2, 3, 5 with highest powers 2, 3², 5. Step 2: 2 × 9 × 5 = 90.'
    mistakes:
      '810': c7m11_every
      '3': c7m11_which
  - prompt: Two numbers have HCF 6 and LCM 60. One number is 12. Find the other.
    answer: '30'
    check: 6*60/12
    difficulty: 2
    hints:
    - HCF × LCM = product of the numbers.
    - 6 × 60 ÷ 12.
    solution: 'Step 1: 6 × 60 = 360. Step 2: 360 ÷ 12 = 30.'
    mistakes:
      '5': c7m11_product
      '720': c7m11_product
  - prompt: Buses on two routes leave a stop every 12 and 20 minutes. Both leave at 7:00. After how many minutes do they next leave together?
    answer: '60'
    check: '60'
    difficulty: 2
    hints:
    - '''Together again'' means the LCM.'
    - 12 = 2² × 3, 20 = 2² × 5.
    solution: 'Step 1: LCM = 2² × 3 × 5. Step 2: = 60 minutes (at 8:00).'
    mistakes:
      '4': c7m11_which
      '240': c7m11_every
  - prompt: What is the smallest number of sweets that can be shared equally among 8 or among 10 children with none left?
    answer: '40'
    check: '40'
    difficulty: 2
    hints:
    - The number must be a multiple of 8 and of 10.
    - Find the LCM.
    solution: 'Step 1: 8 = 2³ and 10 = 2 × 5. Step 2: LCM = 2³ × 5 = 40 sweets.'
    mistakes:
      '80': c7m11_every
      '2': c7m11_which
  - prompt: Which needs the LCM rather than the HCF?
    options:
    - When will two blinking lights blink together again?
    - What is the longest rod that measures two lengths exactly?
    - What is the largest tile to cover a floor exactly?
    answer: When will two blinking lights blink together again?
    difficulty: 2
    hints:
    - Which question asks about a time when two things meet again?
    - The others ask for the largest piece or measure.
    solution: Happening together again is a common multiple; largest equal pieces or measures are common factors.
    mistakes:
      What is the longest rod that measures two lengths exactly?: c7m11_which
      What is the largest tile to cover a floor exactly?: c7m11_which
  - prompt: What is the smallest number that leaves remainder 1 when divided by 4, by 6 and by 9?
    answer: '37'
    check: 36+1
    difficulty: 3
    hints:
    - Find the LCM of 4, 6 and 9 first.
    - Then add the remainder.
    solution: 'Step 1: LCM(4, 6, 9) = 2² × 3² = 36. Step 2: 36 + 1 = 37.'
    mistakes:
