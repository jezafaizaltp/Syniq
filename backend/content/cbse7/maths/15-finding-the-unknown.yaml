# CBSE Class 7 Mathematics (NCERT Ganita Prakash Part 2, chapter 7), SYNiq chapter 15. Format: content/README.md.
subject: cbse7-math
chapter: 15
title: Finding the Unknown
tips:
  c7_inverse_op: 'Undo with the opposite operation: if 7 is added, subtract 7 from both sides; if multiplied by 3, divide by 3.'
concepts:
- code: cbse7m.eqn.solve
  title: Solving simple equations
  notes: |
    An equation says two expressions are equal: x + 7 = 15. Solving finds the value that makes it true. Keep
    the balance: do the same to both sides. x + 7 = 15 → subtract 7 → x = 8. 3x = 21 → divide by 3 → x = 7.
    Two steps: 2x + 5 = 17 → 2x = 12 → x = 6. Check by substituting: 2 × 6 + 5 = 17 ✓. x/4 = 5 → x = 20.
  explanations:
    text: 'An equation is like a balanced weighing scale. Whatever you do to one side, do to the other, and it stays balanced. To solve x + 7 = 15, take 7 from both sides: x = 8.'
    visual: 'Picture a balance with a bag of x marbles and 7 loose marbles on the left, and 15 marbles on the right. Remove 7 from each side: the bag balances 8 marbles.'
    step_by_step: 'Step 1: Undo adding or subtracting by doing the opposite to both sides. Step 2: Undo multiplying or dividing the same way. Step 3: Write x = the number. Step 4: Substitute to check.'
    real_world: If a notebook and ₹7 pen together cost ₹45, then n + 7 = 45, so the notebook costs ₹38.
  picture:
    kind: flow
    steps:
    - 2x + 5 = 17
    - Subtract 5 from both sides
    - 2x = 12
    - Divide both sides by 2
    - 'x = 6; check: 2 × 6 + 5 = 17'
    alt: 'Solving 2x + 5 = 17: subtract 5 from both sides to get 2x = 12, then divide by 2 to get x = 6.'
  items:
  - prompt: Solve x + 7 = 15.
    answer: '8'
    check: 15 - 7
    difficulty: 1
    hints:
    - Subtract 7 from both sides.
    - 15 − 7.
    solution: x = 15 − 7 = 8.
    mistakes:
      '22': c7_inverse_op
  - prompt: Solve 3x = 21.
    answer: '7'
    check: 21/3
    difficulty: 1
    hints:
    - Divide both sides by 3.
    - 21 ÷ 3.
    solution: x = 21 ÷ 3 = 7.
    mistakes:
      '18': c7_inverse_op
  - prompt: Solve 2x + 5 = 17.
    answer: '6'
    check: (17 - 5)/2
    difficulty: 2
    hints:
    - 'Subtract 5: 2x = 12.'
    - Divide by 2.
    solution: 2x = 12, so x = 6.
  - prompt: Solve x/4 = 5.
    answer: '20'
    check: 5*4
    difficulty: 2
    hints:
    - Multiply both sides by 4.
    - 5 × 4.
    solution: x = 5 × 4 = 20.
  - prompt: Solve 5x − 3 = 22.
    answer: '5'
    check: (22 + 3)/5
    difficulty: 2
    hints:
    - 'Add 3: 5x = 25.'
    - Divide by 5.
    solution: 5x = 25, so x = 5.
  - prompt: Is x = 4 a solution of 3x − 2 = 10?
    options:
    - 'Yes'
    - 'No'
    - Only if x is negative
    - Cannot tell
    answer: 'Yes'
    difficulty: 1
    hints:
    - Substitute x = 4.
    - 3 × 4 − 2.
    solution: 3 × 4 − 2 = 10 ✓, so yes.
- code: cbse7m.eqn.words
  title: Forming equations from word problems
  after:
  - cbse7m.eqn.solve
  notes: |
    Steps: choose a letter for the unknown; write the conditions as an equation; solve; check in the words of
    the problem. 'I think of a number, double it and add 3 to get 19': 2n + 3 = 19, n = 8. Ages: 'Ravi is 4
    years older than Meena; together they are 26': m + (m + 4) = 26, 2m + 4 = 26, m = 11. Perimeter: a rectangle
    with length 3 more than breadth and perimeter 26: 2(b + b + 3) = 26, b = 5.
  explanations:
    text: 'Turn the story into an equation: pick a letter for the unknown, write what the words say, then solve. ''Double a number and add 3 to get 19'' becomes 2n + 3 = 19, so n = 8.'
    visual: 'Draw a bar for Meena''s age m and a bar 4 units longer for Ravi. Together they are 26, so two m-bars plus 4 make 26: each m-bar is 11.'
    step_by_step: 'Step 1: Say what the letter stands for. Step 2: Translate each phrase into maths. Step 3: Write the equation and solve. Step 4: Check the answer makes sense in the story.'
    real_world: 'A school trip costs ₹200 per student plus ₹1,000 for the bus. With ₹9,000 collected: 200s + 1000 = 9000, so 40 students can go.'
  picture:
    kind: flow
    steps:
    - Think of a number n
    - 'Double it: 2n'
    - 'Add 3: 2n + 3'
    - 'It equals 19: 2n + 3 = 19'
    - 'Solve: n = 8'
    alt: 'Forming an equation: double a number and add 3 to get 19 gives 2n + 3 = 19, so the number is 8.'
  items:
  - prompt: I double a number and add 3 to get 19. What is the number?
    answer: '8'
    check: (19 - 3)/2
    difficulty: 1
    hints:
    - 2n + 3 = 19.
    - 2n = 16.
    solution: 2n = 16, so n = 8.
  - prompt: Ravi is 4 years older than Meena. Together their ages add to 26. How old is Meena?
    answer: '11'
    check: (26 - 4)/2
    difficulty: 2
    hints:
    - m + (m + 4) = 26.
    - 2m = 22.
    solution: 2m + 4 = 26, so m = 11.
  - prompt: A rectangle's length is 3 cm more than its breadth. Its perimeter is 26 cm. Find the breadth, in cm.
    answer: '5'
    check: (13 - 3)/2
    difficulty: 3
    hints:
    - 2(b + b + 3) = 26.
    - 2b + 3 = 13.
    solution: b + b + 3 = 13, so 2b = 10 and b = 5 cm.
  - prompt: A school trip costs ₹200 per student plus ₹1,000 for the bus. ₹9,000 was collected. How many students can go?
    answer: '40'
    check: (9000 - 1000)/200
    difficulty: 2
    hints:
    - 200s + 1000 = 9000.
    - 200s = 8000.
    solution: s = 8000 ÷ 200 = 40.
  - prompt: Three consecutive numbers add to 48. What is the smallest?
    answer: '15'
    check: (48 - 3)/3
    difficulty: 3
    hints:
    - n + (n + 1) + (n + 2) = 48.
    - 3n + 3 = 48.
    solution: 3n = 45, so n = 15 (15, 16, 17).
  - prompt: Which equation matches 'a number decreased by 6 is 14'?
    options:
    - n − 6 = 14
    - 6 − n = 14
    - n + 6 = 14
    - 6n = 14
    answer: n − 6 = 14
    difficulty: 1
    hints:
    - Start with the number.
    - Decreased means subtract.
    solution: 'The number minus 6 is 14: n − 6 = 14.'
