# CBSE Class 7 Mathematics (NCERT Ganita Prakash Part 2, chapter 7), SYNiq chapter 15. Format: content/README.md.
subject: cbse7-math
chapter: 15
title: Finding the Unknown
tips:
  c7_inverse_op: "Undo with the opposite operation on both sides: adding is undone by subtracting, multiplying by dividing."
  t7_ages: "Meena = m, Ravi = m + 4. Then m + m + 4 = 26."
  t7_check_solution: "Put x = 4 into 3x − 2 and see if it gives 10."
  t7_consecutive: "Smallest = n, then n + 1 and n + 2. 3n + 3 = 48."
  t7_decreased_by: "'Decreased by 6' means take 6 away from the number."
  t7_rectangle_perimeter: "Perimeter = 2 × (length + breadth). Length = b + 3, so 2(2b + 3) = 26."
  t7_trip: "Subtract the bus cost first, then divide by the cost per student."
  t7_undo_divide: "x divided by 4 is 5. Undo the dividing by multiplying both sides by 4."
  t7_undo_steps: "Undo in reverse order: first undo the adding or subtracting on both sides, then undo the multiplying."
  t7_word_equation: "Write it as 2n + 3 = 19. Undo +3, then undo ×2."
  c7m15_undo: 'Undo each step with its opposite: adding is undone by subtracting, multiplying by dividing. Do it to BOTH sides.'
  c7m15_order: In a two-step equation, undo the adding or subtracting first, then the multiplying or dividing.
  c7m15_check: Put your value back into the equation. If both sides come out equal, it is right.
  c7m15_words: 'Turn the words into maths one phrase at a time: ''more than'' adds, ''less than'' or ''decreased by'' subtracts, ''times'' or ''twice'' multiplies.'
  c7m15_unknown: Choose a letter for the thing you do not know, write every other amount using it, then make the equation.
concepts:
- code: cbse7m.eqn.solve
  title: Solving simple equations
  notes: |
    An equation says two expressions are equal: x + 7 = 15. Solving finds the value that makes it true. Keep
    the balance: do the same to both sides. x + 7 = 15 → subtract 7 → x = 8. 3x = 21 → divide by 3 → x = 7.
    Two steps: 2x + 5 = 17 → 2x = 12 → x = 6. Check by substituting: 2 × 6 + 5 = 17 ✓. x/4 = 5 → x = 20.
  explanations:
    text: 'An equation is like a balanced weighing scale. Whatever you do to one side, do to the other, and it stays balanced. To solve x + 7 = 15, take 7 from both sides: x = 8.'
    visual: 'Picture a balance with a bag of x marbles and 7 loose marbles on the left, and 15 marbles on the right. Remove 7 from each side: the bag balances 8 marbles.'
    step_by_step: 'Step 1: Undo adding or subtracting by doing the opposite to both sides. Step 2: Undo multiplying or dividing the same way. Step 3: Write x = the number. Step 4: Substitute to check.'
    real_world: If a notebook and ₹7 pen together cost ₹45, then n + 7 = 45, so the notebook costs ₹38.
  picture:
    kind: flow
    steps:
    - 2x + 5 = 17
    - Subtract 5 from both sides
    - 2x = 12
    - Divide both sides by 2
    - 'x = 6; check: 2 × 6 + 5 = 17'
    alt: 'Solving 2x + 5 = 17: subtract 5 from both sides to get 2x = 12, then divide by 2 to get x = 6.'
  activity:
    type: formula
    prompt: Find the x that balances each equation.
    inputs:
    - name: x
      label: x
      min: -20
      max: 40
      step: 1
      start: 0
    outputs:
    - name: l1
      label: x + 7
      expr: x+7
    - name: l2
      label: 3x
      expr: 3*x
    - name: l3
      label: 2x − 5
      expr: 2*x-5
    goals:
    - prompt: x + 7 = 15
      want:
        l1: 15
      mistakes:
      - when:
          x: 22
        say: You added 7. To undo + 7, take 7 from both sides.
    - prompt: 3x = 27
      want:
        l2: 27
      mistakes:
      - when:
          x: 24
        say: '27 − 3 undoes adding. 3x means 3 times x: divide by 3.'
    - prompt: 2x − 5 = 11
      want:
        l3: 11
      mistakes:
      - when:
          x: 3
        say: '11 − 5 = 6: take the −5 off by adding 5 to both sides, so 2x = 16.'
      - when:
          x: 16
        say: '16 is 2x. One more step: divide by 2.'
  lesson:
    - teach: 'An equation is a balance: both sides are equal. x + 5 = 12 means some number plus 5 balances 12. Whatever you do to one side, do to the other, and it stays balanced. Take 5 from both sides: x = 7.'
      picture:
        kind: compare
        columns:
        - title: Left pan
          points:
          - x + 5
          - take away 5
          - x
        - title: Right pan
          points:
          - '12'
          - take away 5
          - '7'
        alt: 'A balance: x + 5 on one side and 12 on the other. Taking 5 from both keeps it level, leaving x = 7.'
      check:
        prompt: Solve x − 4 = 10.
        options:
        - '14'
        - '6'
        - '40'
        answer: '14'
        why: Add 4 to both sides.
    - teach: 'Undo each operation with its opposite. 4x = 28: divide both sides by 4, x = 7. x/3 = 6: multiply both sides by 3, x = 18. For two steps, like 3x − 2 = 13, undo the − 2 first (add 2: 3x = 15), then the × 3 (divide by 3: x = 5).'
      picture:
        kind: flow
        steps:
        - 3x − 2 = 13
        - 'add 2: 3x = 15'
        - 'divide by 3: x = 5'
        alt: Solving 3x − 2 = 13 in two steps.
      check:
        prompt: Solve 2x + 1 = 11.
        options:
        - '5'
        - '6'
        - '10'
        answer: '5'
        why: 2x = 10, so x = 5.
    - teach: 'Always check by putting the answer back in. For 3x − 2 = 13 with x = 5: 3 × 5 − 2 = 13 ✓. If the two sides are not equal, look again.'
      check:
        prompt: Is x = 3 a solution of 4x + 2 = 16?
        options:
        - 'No'
        - 'Yes'
        answer: 'No'
        why: 4 × 3 + 2 = 14, not 16.
  items:
  - prompt: Solve x + 7 = 15.
    answer: '8'
    check: 15 - 7
    difficulty: 1
    hints:
    - Subtract 7 from both sides.
    - 15 − 7.
    solution: x = 15 − 7 = 8.
    mistakes:
      '22': c7_inverse_op
  - prompt: Solve 3x = 21.
    answer: '7'
    check: 21/3
    difficulty: 1
    hints:
    - Divide both sides by 3.
    - 21 ÷ 3.
    solution: x = 21 ÷ 3 = 7.
    mistakes:
      '18': c7_inverse_op
  - prompt: Solve 2x + 5 = 17.
    answer: '6'
    check: (17 - 5)/2
    difficulty: 2
    hints:
    - 'Subtract 5: 2x = 12.'
    - Divide by 2.
    solution: 2x = 12, so x = 6.
    mistakes: {"11": "t7_undo_steps", "8.5": "t7_undo_steps"}
  - prompt: Solve x/4 = 5.
    answer: '20'
    check: 5*4
    difficulty: 2
    hints:
    - Multiply both sides by 4.
    - 5 × 4.
    solution: x = 5 × 4 = 20.
    mistakes: {"1.25": "t7_undo_divide", "9": "t7_undo_divide"}
  - prompt: Solve 5x − 3 = 22.
    answer: '5'
    check: (22 + 3)/5
    difficulty: 2
    hints:
    - 'Add 3: 5x = 25.'
    - Divide by 5.
    solution: 5x = 25, so x = 5.
    mistakes: {"3.8": "t7_undo_steps", "25": "t7_undo_steps"}
  - prompt: Is x = 4 a solution of 3x − 2 = 10?
    options:
    - 'Yes'
    - 'No'
    - Only if x is negative
    - Cannot tell
    answer: 'Yes'
    difficulty: 1
    hints:
    - Substitute x = 4.
    - 3 × 4 − 2.
    solution: 3 × 4 − 2 = 10 ✓, so yes.
    mistakes: {"No": "t7_check_solution", "Cannot tell": "t7_check_solution"}
  - prompt: Solve x + 12 = 30.
    answer: '18'
    check: 30-12
    difficulty: 1
    hints:
    - Undo + 12.
    - Take 12 from both sides.
    solution: 'Step 1: x + 12 − 12 = 30 − 12. Step 2: x = 18.'
    mistakes:
      '42': c7m15_undo
      '2.5': c7m15_undo
  - prompt: Solve y − 9 = 4.
    answer: '13'
    check: 4+9
    difficulty: 1
    hints:
    - Undo − 9.
    - Add 9 to both sides.
    solution: 'Step 1: y − 9 + 9 = 4 + 9. Step 2: y = 13.'
    mistakes:
      '-5': c7m15_undo
      '5': c7m15_undo
  - prompt: Solve 6m = 54.
    answer: '9'
    check: 54/6
    difficulty: 1
    hints:
    - Undo × 6.
    - Divide both sides by 6.
    solution: 'Step 1: 6m ÷ 6 = 54 ÷ 6. Step 2: m = 9.'
    mistakes:
      '48': c7m15_undo
      '324': c7m15_undo
  - prompt: Solve p/5 = 8.
    answer: '40'
    check: 8*5
    difficulty: 1
    hints:
    - Undo ÷ 5.
    - Multiply both sides by 5.
    solution: 'Step 1: p/5 × 5 = 8 × 5. Step 2: p = 40.'
    mistakes:
      '1.6': c7m15_undo
      '13': c7m15_undo
  - prompt: Solve 4x + 3 = 27.
    answer: '6'
    check: (27-3)/4
    difficulty: 2
    hints:
    - Undo + 3 first.
    - Then undo × 4.
    solution: 'Step 1: 4x = 27 − 3 = 24. Step 2: x = 24 ÷ 4 = 6. Check: 4 × 6 + 3 = 27 ✓.'
    mistakes:
      '7.5': c7m15_order
      '24': c7m15_order
  - prompt: Solve 7y − 5 = 30.
    answer: '5'
    check: (30+5)/7
    difficulty: 2
    hints:
    - Undo − 5 first.
    - Then divide by 7.
    solution: 'Step 1: 7y = 30 + 5 = 35. Step 2: y = 35 ÷ 7 = 5.'
    mistakes:
      '25': c7m15_order
      '3.57': c7m15_order
  - prompt: Solve x/2 + 4 = 10.
    answer: '12'
    check: (10-4)*2
    difficulty: 2
    hints:
    - 'Undo + 4 first: x/2 = 6.'
    - Then multiply by 2.
    solution: 'Step 1: x/2 = 10 − 4 = 6. Step 2: x = 6 × 2 = 12.'
    mistakes:
      '3': c7m15_undo
      '28': c7m15_order
  - prompt: Is y = 7 a solution of 3y − 4 = 17?
    options:
    - 'Yes'
    - 'No'
    - Only if y is negative
    answer: 'Yes'
    difficulty: 2
    hints:
    - Put 7 in place of y.
    - 3 × 7 − 4 = ?
    solution: 3 × 7 − 4 = 21 − 4 = 17, which matches the right side.
    mistakes:
      'No': c7m15_check
      Only if y is negative: c7m15_check
  - prompt: Solve 2(x + 3) = 20.
    answer: '7'
    check: 20/2-3
    difficulty: 3
    hints:
    - 'Undo × 2 first: x + 3 = 10.'
    - Then undo + 3.
    solution: 'Step 1: x + 3 = 20 ÷ 2 = 10. Step 2: x = 10 − 3 = 7. Check: 2 × 10 = 20 ✓.'
    mistakes:
      '8.5': c7m15_order
      '17': c7m15_order
  - prompt: Solve 5x + 4 = 3x + 18.
    answer: '7'
    check: (18-4)/(5-3)
    difficulty: 3
    hints:
    - Take 3x from both sides.
    - Then 2x + 4 = 18.
    solution: 'Step 1: 5x − 3x + 4 = 18, so 2x + 4 = 18. Step 2: 2x = 14. Step 3: x = 7.'
    mistakes:
      '14': c7m15_order
      '2.75': c7m15_undo
  - prompt: Solve 15 − 2x = 3.
    answer: '6'
    check: (15-3)/2
    difficulty: 3
    hints:
    - 'Add 2x to both sides: 15 = 3 + 2x.'
    - Then 2x = 12.
    solution: 'Step 1: 15 = 3 + 2x. Step 2: 2x = 12. Step 3: x = 6. Check: 15 − 12 = 3 ✓.'
    mistakes:
      '-6': c7m15_undo
      '9': c7m15_order
- code: cbse7m.eqn.words
  title: Forming equations from word problems
  after:
  - cbse7m.eqn.solve
  notes: |
    Steps: choose a letter for the unknown; write the conditions as an equation; solve; check in the words of
    the problem. 'I think of a number, double it and add 3 to get 19': 2n + 3 = 19, n = 8. Ages: 'Ravi is 4
    years older than Meena; together they are 26': m + (m + 4) = 26, 2m + 4 = 26, m = 11. Perimeter: a rectangle
    with length 3 more than breadth and perimeter 26: 2(b + b + 3) = 26, b = 5.
  explanations:
    text: 'Turn the story into an equation: pick a letter for the unknown, write what the words say, then solve. ''Double a number and add 3 to get 19'' becomes 2n + 3 = 19, so n = 8.'
    visual: 'Draw a bar for Meena''s age m and a bar 4 units longer for Ravi. Together they are 26, so two m-bars plus 4 make 26: each m-bar is 11.'
    step_by_step: 'Step 1: Say what the letter stands for. Step 2: Translate each phrase into maths. Step 3: Write the equation and solve. Step 4: Check the answer makes sense in the story.'
    real_world: 'A school trip costs ₹200 per student plus ₹1,000 for the bus. With ₹9,000 collected: 200s + 1000 = 9000, so 40 students can go.'
  picture:
    kind: flow
    steps:
    - Think of a number n
    - 'Double it: 2n'
    - 'Add 3: 2n + 3'
    - 'It equals 19: 2n + 3 = 19'
    - 'Solve: n = 8'
    alt: 'Forming an equation: double a number and add 3 to get 19 gives 2n + 3 = 19, so the number is 8.'
  activity:
    type: formula
    prompt: Turn each story into an equation for n, then find n.
    inputs:
    - name: n
      label: n
      min: 0
      max: 40
      step: 1
      start: 0
    outputs:
    - name: a
      label: 2n + 3
      expr: 2*n+3
    - name: b
      label: 4n − 6
      expr: 4*n-6
    - name: c
      label: n + (n + 1) + (n + 2)
      expr: 3*n+3
    goals:
    - prompt: Double a number and add 3 to get 19.
      want:
        a: 19
      mistakes:
      - when:
          n: 11
        say: 'That''s (19 + 3) ÷ 2. Undo the + 3 by subtracting: 19 − 3 = 16, then halve.'
      - when:
          n: 16
        say: 16 is double the number. Halve it.
    - prompt: Four times a number, minus 6, is 30.
      want:
        b: 30
      mistakes:
      - when:
          n: 6
        say: 'That''s (30 − 6) ÷ 4. Undo the − 6 by adding: 36 ÷ 4.'
    - prompt: Three numbers in a row add to 48. Find the first.
      want:
        c: 48
      mistakes:
      - when:
          n: 16
        say: 16 is the middle one (48 ÷ 3). The first is one less.
      - when:
          n: 17
        say: That's the last of the three.
  lesson:
    - teach: 'To solve a word problem: pick a letter for the unknown, write the facts as an equation, solve it, and check the answer in the words. ''A number plus 15 is 40'': n + 15 = 40, so n = 25. Check: 25 + 15 = 40 ✓.'
      picture:
        kind: flow
        steps:
        - Choose a letter
        - Write the equation
        - Solve
        - Check in the words
        alt: Four steps for turning a word problem into an equation.
      check:
        prompt: Which equation matches 'three times a number is 36'?
        options:
        - 3n = 36
        - n + 3 = 36
        - n/3 = 36
        answer: 3n = 36
        why: '''Three times'' means multiply by 3.'
    - teach: Write everything using the same letter. 'Anu has ₹5 more than Binu; together they have ₹45.' Let Binu have b. Anu has b + 5. So b + (b + 5) = 45, 2b + 5 = 45, 2b = 40, b = 20. Binu has ₹20 and Anu ₹25.
      check:
        prompt: Tom is 3 years older than Sam. Sam is s. How old is Tom?
        options:
        - s + 3
        - s − 3
        - 3s
        answer: s + 3
        why: Older means add.
    - teach: 'Shapes give equations too. A rectangle has length 2 cm more than its breadth b, and perimeter 28 cm: 2(b + b + 2) = 28, so 2b + 2 = 14, 2b = 12, b = 6 cm and length 8 cm.'
      check:
        prompt: A square's perimeter is 36 cm. Side s satisfies which equation?
        options:
        - 4s = 36
        - s + 4 = 36
        - 2s = 36
        answer: 4s = 36
        why: A square has 4 equal sides.
  items:
  - prompt: I double a number and add 3 to get 19. What is the number?
    answer: '8'
    check: (19 - 3)/2
    difficulty: 1
    hints:
    - 2n + 3 = 19.
    - 2n = 16.
    solution: 2n = 16, so n = 8.
    mistakes: {"11": "t7_word_equation", "9.5": "t7_word_equation"}
  - prompt: Ravi is 4 years older than Meena. Together their ages add to 26. How old is Meena?
    answer: '11'
    check: (26 - 4)/2
    difficulty: 2
    hints:
    - m + (m + 4) = 26.
    - 2m = 22.
    solution: 2m + 4 = 26, so m = 11.
    mistakes: {"15": "t7_ages", "13": "t7_ages"}
  - prompt: A rectangle's length is 3 cm more than its breadth. Its perimeter is 26 cm. Find the breadth, in cm.
    answer: '5'
    check: (13 - 3)/2
    difficulty: 3
    hints:
    - 2(b + b + 3) = 26.
    - 2b + 3 = 13.
    solution: b + b + 3 = 13, so 2b = 10 and b = 5 cm.
    mistakes: {"8": "t7_rectangle_perimeter", "10": "t7_rectangle_perimeter"}
  - prompt: A school trip costs ₹200 per student plus ₹1,000 for the bus. ₹9,000 was collected. How many students can go?
    answer: '40'
    check: (9000 - 1000)/200
    difficulty: 2
    hints:
    - 200s + 1000 = 9000.
    - 200s = 8000.
    solution: s = 8000 ÷ 200 = 40.
    mistakes: {"45": "t7_trip", "50": "t7_trip"}
  - prompt: Three consecutive numbers add to 48. What is the smallest?
    answer: '15'
    check: (48 - 3)/3
    difficulty: 3
    hints:
    - n + (n + 1) + (n + 2) = 48.
    - 3n + 3 = 48.
    solution: 3n = 45, so n = 15 (15, 16, 17).
    mistakes: {"16": "t7_consecutive", "17": "t7_consecutive"}
  - prompt: Which equation matches 'a number decreased by 6 is 14'?
    options:
    - n − 6 = 14
    - 6 − n = 14
    - n + 6 = 14
    - 6n = 14
    answer: n − 6 = 14
    difficulty: 1
    hints:
    - Start with the number.
    - Decreased means subtract.
    solution: 'The number minus 6 is 14: n − 6 = 14.'
    mistakes: {"6 − n = 14": "t7_decreased_by", "n + 6 = 14": "t7_decreased_by"}
  - prompt: A number increased by 18 is 45. What is the number?
    answer: '27'
    check: 45-18
    difficulty: 1
    hints:
    - Write n + 18 = 45.
    - Take 18 from both sides.
    solution: 'Step 1: n + 18 = 45. Step 2: n = 45 − 18 = 27.'
    mistakes:
      '63': c7m15_words
      '2.5': c7m15_words
  - prompt: Five times a number is 65. What is the number?
    answer: '13'
    check: 65/5
    difficulty: 1
    hints:
    - Write 5n = 65.
    - Divide both sides by 5.
    solution: 'Step 1: 5n = 65. Step 2: n = 65 ÷ 5 = 13.'
    mistakes:
      '60': c7m15_words
      '325': c7m15_words
  - prompt: Which equation matches 'half of a number is 9'?
    options:
    - n/2 = 9
    - 2n = 9
    - n − 2 = 9
    answer: n/2 = 9
    difficulty: 1
    hints:
    - Half means divide by 2.
    - Which one divides the number?
    solution: Half of n is n ÷ 2, so n/2 = 9 (and n = 18).
    mistakes:
      2n = 9: c7m15_words
      n − 2 = 9: c7m15_words
  - prompt: Which equation matches '7 less than a number is 20'?
    options:
    - n − 7 = 20
    - 7 − n = 20
    - n + 7 = 20
    answer: n − 7 = 20
    difficulty: 1
    hints:
    - '''7 less than a number'' starts with the number.'
    - Then 7 is taken away from it.
    solution: 'Start with the number and take 7 away: n − 7 = 20 (so n = 27).'
    mistakes:
      7 − n = 20: c7m15_words
      n + 7 = 20: c7m15_words
  - prompt: I think of a number, multiply it by 4 and subtract 7 to get 25. What is the number?
    answer: '8'
    check: (25+7)/4
    difficulty: 2
    hints:
    - Write 4n − 7 = 25.
    - Add 7, then divide by 4.
    solution: 'Step 1: 4n − 7 = 25. Step 2: 4n = 32. Step 3: n = 8. Check: 32 − 7 = 25 ✓.'
    mistakes:
      '4.5': c7m15_order
      '32': c7m15_order
  - prompt: A pen costs ₹12 more than a pencil. Together they cost ₹30. How much is the pencil, in rupees?
    answer: '9'
    check: (30-12)/2
    difficulty: 2
    hints:
    - Let the pencil cost p. The pen costs p + 12.
    - p + p + 12 = 30.
    solution: 'Step 1: 2p + 12 = 30. Step 2: 2p = 18. Step 3: p = ₹9 (pen ₹21).'
    mistakes:
      '18': c7m15_order
      '21': c7m15_unknown
  - prompt: A rectangle's length is twice its breadth. Its perimeter is 42 cm. Find the breadth, in cm.
    answer: '7'
    check: 42/6
    difficulty: 2
    hints:
    - Let the breadth be b; length is 2b.
    - 2(2b + b) = 42, so 6b = 42.
    solution: 'Step 1: 2(2b + b) = 6b = 42. Step 2: b = 7 cm (length 14 cm).'
    mistakes:
      '14': c7m15_unknown
      '21': c7m15_unknown
  - prompt: Ria's mother is 3 times as old as Ria. The sum of their ages is 48. How old is Ria?
    answer: '12'
    check: 48/4
    difficulty: 2
    hints:
    - Let Ria be r; her mother is 3r.
    - r + 3r = 48.
    solution: 'Step 1: 4r = 48. Step 2: r = 12 (mother 36).'
    mistakes:
      '16': c7m15_unknown
      '36': c7m15_unknown
  - prompt: Four consecutive numbers add to 74. What is the largest?
    answer: '20'
    check: (74-6)/4+3
    difficulty: 3
    hints:
    - Call them n, n + 1, n + 2, n + 3.
    - 4n + 6 = 74.
    solution: 'Step 1: 4n + 6 = 74, so 4n = 68 and n = 17. Step 2: the numbers are 17, 18, 19, 20; the largest is 20.'
    mistakes:
      '17': c7m15_unknown
      '18.5': c7m15_order
  - prompt: A class has 40 students. There are 6 more girls than boys. How many boys are there?
    answer: '17'
    check: (40-6)/2
    difficulty: 3
    hints:
    - Let boys = b, girls = b + 6.
    - 2b + 6 = 40.
    solution: 'Step 1: b + b + 6 = 40. Step 2: 2b = 34. Step 3: b = 17 boys (23 girls).'
    mistakes:
      '23': c7m15_unknown
      '20': c7m15_unknown
  - prompt: A taxi charges ₹50 to start plus ₹15 per km. A ride cost ₹230. How many km was it?
    answer: '12'
    check: (230-50)/15
    difficulty: 3
    hints:
    - Write 50 + 15k = 230.
    - Take away 50, then divide by 15.
    solution: 'Step 1: 15k = 230 − 50 = 180. Step 2: k = 180 ÷ 15 = 12 km.'
    mistakes:
      '15.33': c7m15_order
      '18': c7m15_order
