# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 1. Format: content/README.md.
subject: cbse7-math
chapter: 1
title: Large Numbers Around Us
tips:
  c7_lakh_zeros: 'One lakh is 1,00,000: a 1 followed by 5 zeros. 6 zeros makes ten lakh.'
  c7_round_up: 'Look at the digit just to the right of the place you round to: if it is 5 or more, round up.'
  t7_compare_digits: "The number with more digits is larger. Count the digits before comparing the first digit."
  t7_crore_digits: "One crore = 1,00,00,000. Count every digit, the 1 and all the zeros."
  t7_exact_needed: "Where would a small mistake matter? Money in a bank must be counted to the last rupee."
  t7_friendly_pair: "Pair 125 × 8 first: that makes a round number. Then multiply by 37."
  t7_lakh_million: "1 million = 10,00,000 (ten lakh). Count the zeros: a lakh has 5, a million has 6."
  t7_read_indian: "Use the Indian commas: crore, lakh, thousand, hundreds. Read each group in turn: 3 | 05 | 00 | 420."
  t7_round_lakh: "Look at the ten-thousands digit. Below 5, round down to the lakh below; 5 or more, round up."
  t7_round_then_multiply: "Round 1,248 to the nearest hundred first, then multiply by 6."
  t7_round_thousand: "Round each number to the nearest thousand first, then add the rounded numbers."
concepts:
- code: cbse7m.large.read
  title: Reading and writing large numbers
  notes: |
    Indian system: ones, tens, hundreds, thousands, ten thousands, lakhs, ten lakhs, crores. 1 lakh = 1,00,000
    (one hundred thousand); 1 crore = 1,00,00,000 (ten million) = 100 lakh. Commas: after the first 3 digits
    from the right, then every 2 digits (12,34,56,789). International (American) system: thousands, millions,
    billions, commas every 3 digits (123,456,789). 1 million = 10 lakh; 1 billion = 100 crore. To compare,
    first count digits; with equal digits compare from the left.
  explanations:
    text: 'Big numbers are easier to read when we group the digits. In India we say lakhs and crores: 1,00,000 is one lakh and 1,00,00,000 is one crore. Other countries group in threes and say million and billion. One million is ten lakh.'
    visual: 'Draw a place-value chart: Crores | Ten lakhs | Lakhs | Ten thousands | Thousands | Hundreds | Tens | Ones. Write 4,52,30,016 across it, one digit per box, and read it group by group: 4 crore 52 lakh 30 thousand 16.'
    step_by_step: 'Step 1: Start from the right and mark off 3 digits. Step 2: In the Indian system, then mark off 2 digits at a time. Step 3: Read each group with its name: crore, lakh, thousand. Step 4: To compare two numbers, count their digits first.'
    real_world: News reports say India's population is about 140 crore; an international report says 1.4 billion. Both mean the same number.
  picture:
    kind: compare
    columns:
    - title: Indian system
      points:
      - 1,00,000 = 1 lakh
      - 10,00,000 = 10 lakh
      - 1,00,00,000 = 1 crore
    - title: International system
      points:
      - 100,000 = hundred thousand
      - 1,000,000 = 1 million
      - 10,000,000 = 10 million
    alt: 'The Indian and international systems side by side: 1 lakh is a hundred thousand, 10 lakh is a million, and 1 crore is ten million.'
  activity:
    type: formula
    prompt: Build big numbers from crores, lakhs and thousands.
    inputs:
    - name: c
      label: Crores
      min: 0
      max: 9
      step: 1
      start: 0
    - name: l
      label: Lakhs
      min: 0
      max: 99
      step: 1
      start: 0
    - name: t
      label: Thousands
      min: 0
      max: 99
      step: 1
      start: 0
    outputs:
    - name: val
      label: The number
      expr: c*10000000+l*100000+t*1000
    goals:
    - prompt: Make one million.
      want:
        val: 1000000
      mistakes:
      - when:
          c: 1
          l: 0
          t: 0
        say: 1 crore is 100 lakh, which is 10 million. One million is 10 lakh.
      - when:
          c: 0
          l: 1
          t: 0
        say: One lakh is 1,00,000, only a tenth of a million.
    - prompt: Make 2,35,00,000.
      want:
        val: 23500000
      mistakes:
      - when:
          c: 2
          l: 3
          t: 50
        say: 'That''s 2,03,50,000. After the crores, read the digits in pairs: 35 lakh.'
      - when:
          c: 0
          l: 23
          t: 50
        say: That's 23,50,000, about ten times too small. The 2 at the front is crores.
    - prompt: Make 4 million 50 thousand.
      want:
        val: 4050000
      mistakes:
      - when:
          c: 0
          l: 4
          t: 50
        say: 'That''s 4,50,000: less than half a million. A million is 10 lakh, so 4 million is 40 lakh.'
      - when:
          c: 4
          l: 0
          t: 50
        say: 4 crore is 40 million. 4 million is 40 lakh.
  items:
  - prompt: How many zeros are there in one lakh?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - 1 lakh = 1,00,000.
    - Count the zeros.
    solution: 1,00,000 has 5 zeros.
    mistakes:
      '6': c7_lakh_zeros
  - prompt: How many lakh make one crore?
    answer: '100'
    check: 10**7/10**5
    difficulty: 1
    hints:
    - 1 crore = 1,00,00,000.
    - 1,00,00,000 ÷ 1,00,000.
    solution: 1 crore = 100 lakh.
    mistakes: {"10": "t8_lakh_crore", "1000": "t8_lakh_crore"}
  - prompt: How many lakh make one million?
    answer: '10'
    check: 10**6/10**5
    difficulty: 2
    hints:
    - 1 million = 1,000,000.
    - 1,000,000 ÷ 1,00,000.
    solution: 1 million = 10,00,000 = 10 lakh.
    mistakes: {"1": "t7_lakh_million", "100": "t7_lakh_million"}
  - prompt: Which is 3,05,00,420 written in words?
    options:
    - Three crore five lakh four hundred twenty
    - Three crore fifty lakh four hundred twenty
    - Thirty lakh five thousand four hundred twenty
    - Three crore five thousand four hundred twenty
    answer: Three crore five lakh four hundred twenty
    difficulty: 2
    hints:
    - 'Groups: 3 | 05 | 00 | 420.'
    - Crore | lakh | thousand | rest.
    solution: '3 crore, 05 lakh, 00 thousand, 420: three crore five lakh four hundred twenty.'
    mistakes: {"Three crore fifty lakh four hundred twenty": "t7_read_indian", "Three crore five thousand four hundred twenty": "t7_read_indian"}
  - prompt: Which number is the largest?
    options:
    - 9,87,654
    - 10,00,001
    - 9,99,999
    - 99,999
    answer: 10,00,001
    difficulty: 1
    hints:
    - Count the digits.
    - More digits means bigger.
    solution: 10,00,001 has 7 digits; the others have 6 or 5.
    mistakes: {"9,99,999": "t7_compare_digits", "9,87,654": "t7_compare_digits"}
  - prompt: Write one crore as a number without commas. How many digits does it have?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - 1 crore = 1,00,00,000.
    - 1 followed by 7 zeros.
    solution: 10000000 has 8 digits.
    mistakes: {"7": "t7_crore_digits", "9": "t7_crore_digits"}
- code: cbse7m.large.estimate
  title: Estimating and rounding large numbers
  after:
  - cbse7m.large.read
  notes: |
    Exact values are needed for money in a bank; approximate values are fine for crowds or distances. To round
    to the nearest thousand (or lakh), look at the next digit to the right: 5 or more rounds up, less than 5
    rounds down. Estimation checks whether an answer is sensible: round each number, then calculate.
    Patterns help: multiplying by 10, 100, 1000 adds zeros; 5 × 2 = 10, 25 × 4 = 100, 125 × 8 = 1000.
  explanations:
    text: 'We don''t always need exact numbers. If 48,763 people came to a match, saying ''about 49,000'' is good enough. Round by looking at the next digit: 5 or more, round up; less than 5, round down.'
    visual: Put 48,763 on a number line between 48,000 and 49,000. It sits past the middle (48,500), so it is nearer to 49,000.
    step_by_step: 'Step 1: Find the place you are rounding to. Step 2: Look at the digit just to its right. Step 3: If it is 5 or more, add 1 to the place; otherwise keep it. Step 4: Replace the digits to the right with zeros.'
    real_world: Before paying at a shop, rounding ₹198 + ₹305 + ₹89 to 200 + 300 + 100 = ₹600 tells you roughly how much money to have ready.
  picture:
    kind: flow
    steps:
    - '48,763: round to the nearest thousand'
    - The thousands digit is 8
    - 'The next digit is 7: 5 or more'
    - 'Round up: 8 becomes 9'
    - 'Answer: 49,000'
    alt: 'Rounding 48,763 to the nearest thousand: the next digit, 7, is 5 or more, so it rounds up to 49,000.'
  activity:
    type: number_line
    min: 40000
    max: 60000
    step: 1000
    start: 40000
    prompt: Round each number to the nearest thousand.
    goals:
    - prompt: 48,763
      target: 49000
      mistakes:
      - when:
          v: 48000
        say: 'The hundreds digit is 7: 5 or more, so round up.'
      - when:
          v: 50000
        say: That's rounding to the nearest ten thousand. Look just at the thousands.
    - prompt: 52,480
      target: 52000
      mistakes:
      - when:
          v: 53000
        say: 'The hundreds digit is 4: less than 5, so round down.'
      - when:
          v: 50000
        say: 'Too far: round to the nearest thousand, not ten thousand.'
    - prompt: 45,500
      target: 46000
      mistakes:
      - when:
          v: 45000
        say: The hundreds digit is 5. Exactly 5 rounds up.
  items:
  - prompt: Round 48,763 to the nearest thousand.
    answer: '49000'
    check: '49000'
    difficulty: 1
    hints:
    - Look at the hundreds digit.
    - 7 is 5 or more.
    solution: The hundreds digit is 7, so round up to 49,000.
    mistakes:
      '48000': c7_round_up
  - prompt: Round 3,42,180 to the nearest lakh.
    answer: '300000'
    check: '300000'
    difficulty: 2
    hints:
    - Look at the ten-thousands digit.
    - 4 is less than 5.
    solution: The ten-thousands digit is 4, so round down to 3,00,000.
    mistakes: {"400000": "t7_round_lakh", "340000": "t7_round_lakh"}
  - prompt: Estimate 4,890 + 3,120 by rounding each to the nearest thousand.
    answer: '8000'
    check: 5000 + 3000
    difficulty: 1
    hints:
    - 4,890 ≈ 5,000; 3,120 ≈ 3,000.
    - Add the rounded numbers.
    solution: 5,000 + 3,000 = 8,000.
    mistakes: {"8010": "t7_round_thousand", "7000": "t7_round_thousand"}
  - prompt: Find 125 × 8 × 37 quickly.
    answer: '37000'
    check: 125*8*37
    difficulty: 2
    hints:
    - 125 × 8 = 1000.
    - Then × 37.
    solution: 125 × 8 = 1000, and 1000 × 37 = 37,000.
    mistakes: {"3700": "t7_friendly_pair", "370000": "t7_friendly_pair"}
  - prompt: Which situation needs an exact number, not an estimate?
    options:
    - The amount in a bank account
    - People at a fair
    - Distance to the Moon in a story
    - Stars visible on a clear night
    answer: The amount in a bank account
    difficulty: 1
    hints:
    - Where would a small error matter?
    - Money must be exact.
    solution: A bank balance must be exact; the others are fine as estimates.
    mistakes: {"People at a fair": "t7_exact_needed", "Stars visible on a clear night": "t7_exact_needed"}
  - prompt: A school has 1,248 students. Each needs 6 notebooks. Estimate the total by rounding 1,248 to the nearest hundred.
    answer: '7200'
    check: 1200*6
    difficulty: 2
    hints:
    - 1,248 ≈ 1,200.
    - 1,200 × 6.
    solution: '1,200 × 6 = 7,200 notebooks (exact: 7,488).'
    mistakes: {"7488": "t7_round_then_multiply", "6000": "t7_round_then_multiply"}
