# CBSE Class 7 Mathematics (NCERT Ganita Prakash, 2024-25), chapter 1. Format: content/README.md.
subject: cbse7-math
chapter: 1
title: Large Numbers Around Us
tips:
  c7_lakh_zeros: "6 zeros is ten lakh. Write one lakh in Indian style, 1,00,000, and count the zeros."
  c7_round_up: 'Look at the digit just to the right of the place you round to: if it is 5 or more, round up.'
  t7_compare_digits: "The number with more digits is larger. Count the digits before comparing the first digit."
  t7_crore_digits: "One crore = 1,00,00,000. Count every digit, the 1 and all the zeros."
  t7_exact_needed: "Where would a small mistake matter? Money in a bank must be counted to the last rupee."
  t7_friendly_pair: "Pair 125 × 8 first: that makes a round number. Then multiply by 37."
  t7_lakh_million: "Count zeros: a lakh has 5 and a million has 6. One extra zero means multiplying by what?"
  t7_read_indian: "Use the Indian commas: crore, lakh, thousand, hundreds. Read each group in turn: 3 | 05 | 00 | 420."
  t7_round_lakh: "Look at the ten-thousands digit. Below 5, round down to the lakh below; 5 or more, round up."
  t7_round_then_multiply: "Round 1,248 to the nearest hundred first, then multiply by 6."
  t7_round_thousand: "Round each number to the nearest thousand first, then add the rounded numbers."
  c7m1_commas: 'Indian commas: first after 3 digits from the right, then after every 2 digits.'
  c7m1_places: "Count places from the right, one digit at a time, naming each place as you go. Each Indian comma starts a new group."
  c7m1_convert: 1 million = 10 lakh and 1 crore = 10 million. Multiply or divide by 10 as needed.
  c7m1_round: 'Look only at the digit just to the right of the place you round to: 5 or more goes up, less than 5 stays.'
  c7m1_estimate: Round each number first, then do the easy sum or product.
  c7m1_zeros: Count the zeros in each number and add them when you multiply.
concepts:
- code: cbse7m.large.read
  title: Reading and writing large numbers
  notes: |
    Indian system: ones, tens, hundreds, thousands, ten thousands, lakhs, ten lakhs, crores. 1 lakh = 1,00,000
    (one hundred thousand); 1 crore = 1,00,00,000 (ten million) = 100 lakh. Commas: after the first 3 digits
    from the right, then every 2 digits (12,34,56,789). International (American) system: thousands, millions,
    billions, commas every 3 digits (123,456,789). 1 million = 10 lakh; 1 billion = 100 crore. To compare,
    first count digits; with equal digits compare from the left.
  explanations:
    text: 'Big numbers are easier to read when we group the digits. In India we say lakhs and crores: 1,00,000 is one lakh and 1,00,00,000 is one crore. Other countries group in threes and say million and billion. One million is ten lakh.'
    visual: 'Draw a place-value chart: Crores | Ten lakhs | Lakhs | Ten thousands | Thousands | Hundreds | Tens | Ones. Write 4,52,30,016 across it, one digit per box, and read it group by group: 4 crore 52 lakh 30 thousand 16.'
    step_by_step: 'Step 1: Start from the right and mark off 3 digits. Step 2: In the Indian system, then mark off 2 digits at a time. Step 3: Read each group with its name: crore, lakh, thousand. Step 4: To compare two numbers, count their digits first.'
    real_world: News reports say India's population is about 140 crore; an international report says 1.4 billion. Both mean the same number.
  picture:
    kind: compare
    columns:
    - title: Indian system
      points:
      - 1,00,000 = 1 lakh
      - 10,00,000 = 10 lakh
      - 1,00,00,000 = 1 crore
    - title: International system
      points:
      - 100,000 = hundred thousand
      - 1,000,000 = 1 million
      - 10,000,000 = 10 million
    alt: 'The Indian and international systems side by side: 1 lakh is a hundred thousand, 10 lakh is a million, and 1 crore is ten million.'
  activity:
    type: formula
    prompt: Build big numbers from crores, lakhs and thousands.
    inputs:
    - name: c
      label: Crores
      min: 0
      max: 9
      step: 1
      start: 0
    - name: l
      label: Lakhs
      min: 0
      max: 99
      step: 1
      start: 0
    - name: t
      label: Thousands
      min: 0
      max: 99
      step: 1
      start: 0
    outputs:
    - name: val
      label: The number
      expr: c*10000000+l*100000+t*1000
    goals:
    - prompt: Make one million.
      want:
        val: 1000000
      mistakes:
      - when:
          c: 1
          l: 0
          t: 0
        say: 1 crore is 100 lakh, which is 10 million. One million is 10 lakh.
      - when:
          c: 0
          l: 1
          t: 0
        say: One lakh is 1,00,000, only a tenth of a million.
    - prompt: Make 2,35,00,000.
      want:
        val: 23500000
      mistakes:
      - when:
          c: 2
          l: 3
          t: 50
        say: 'That''s 2,03,50,000. After the crores, read the digits in pairs: 35 lakh.'
      - when:
          c: 0
          l: 23
          t: 50
        say: That's 23,50,000, about ten times too small. The 2 at the front is crores.
    - prompt: Make 4 million 50 thousand.
      want:
        val: 4050000
      mistakes:
      - when:
          c: 0
          l: 4
          t: 50
        say: 'That''s 4,50,000: less than half a million. A million is 10 lakh, so 4 million is 40 lakh.'
      - when:
          c: 4
          l: 0
          t: 50
        say: 4 crore is 40 million. 4 million is 40 lakh.
  lesson:
    - teach: In the Indian system, places go ones, tens, hundreds, thousands, ten thousands, lakhs, ten lakhs, crores. 1 lakh = 1,00,000 and 1 crore = 1,00,00,000 = 100 lakh. Commas come after the first 3 digits from the right, then after every 2 digits.
      picture:
        kind: compare
        columns:
        - title: Indian
          points:
          - 1,00,000 = 1 lakh
          - 10,00,000 = 10 lakh
          - 1,00,00,000 = 1 crore
        - title: International
          points:
          - 100,000 = hundred thousand
          - 1,000,000 = 1 million
          - 10,000,000 = 10 million
        alt: 1 lakh is a hundred thousand, 10 lakh is a million, and 1 crore is 10 million.
      check:
        prompt: Where do the commas go in 45678912 in the Indian system?
        options:
        - 4,56,78,912
        - 45,678,912
        - 456,78,912
        answer: 4,56,78,912
        why: First comma after 3 digits from the right (912), then every 2 digits.
    - teach: 'The international system puts commas every 3 digits: thousands, millions, billions. 1 million = 10 lakh, and 1 billion = 100 crore.'
      check:
        prompt: How many lakh make 5 million?
        options:
        - '50'
        - '5'
        - '500'
        answer: '50'
        why: 1 million = 10 lakh, so 5 million = 50 lakh.
    - teach: 'To compare large numbers, first count the digits: more digits means larger. If the digits are equal, compare from the left until two digits differ.'
      picture:
        kind: compare
        columns:
        - title: 4,58,201
          points:
          - 6 digits
          - 4 lakh …
        - title: 4,61,009
          points:
          - 6 digits
          - 4 lakh 6 ten-thousands … larger
        alt: Both numbers have 6 digits; the lakh digits are both 4; the ten-thousand digits are 5 and 6, so 4,61,009 is larger.
      check:
        prompt: 'Which is larger: 7,89,999 or 8,00,001?'
        options:
        - 8,00,001
        - 7,89,999
        answer: 8,00,001
        why: Both have 6 digits; the lakh digit 8 beats 7.
  items:
  - prompt: How many zeros are there in one lakh?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - 1 lakh = 1,00,000.
    - Count the zeros.
    solution: 1,00,000 has 5 zeros.
    mistakes:
      '6': c7_lakh_zeros
  - prompt: How many lakh make one crore?
    answer: '100'
    check: 10**7/10**5
    difficulty: 1
    hints:
    - 1 crore = 1,00,00,000.
    - 1,00,00,000 ÷ 1,00,000.
    solution: 1 crore = 100 lakh.
    mistakes: {"10": "t8_lakh_crore", "1000": "t8_lakh_crore"}
  - prompt: How many lakh make one million?
    answer: '10'
    check: 10**6/10**5
    difficulty: 2
    hints:
    - 1 million = 1,000,000.
    - 1,000,000 ÷ 1,00,000.
    solution: 1 million = 10,00,000 = 10 lakh.
    mistakes: {"1": "t7_lakh_million", "100": "t7_lakh_million"}
  - prompt: Which is 3,05,00,420 written in words?
    options:
    - Three crore five lakh four hundred twenty
    - Three crore fifty lakh four hundred twenty
    - Thirty lakh five thousand four hundred twenty
    - Three crore five thousand four hundred twenty
    answer: Three crore five lakh four hundred twenty
    difficulty: 2
    hints:
    - 'Groups: 3 | 05 | 00 | 420.'
    - Crore | lakh | thousand | rest.
    solution: '3 crore, 05 lakh, 00 thousand, 420: three crore five lakh four hundred twenty.'
    mistakes: {"Three crore fifty lakh four hundred twenty": "t7_read_indian", "Three crore five thousand four hundred twenty": "t7_read_indian"}
  - prompt: Which number is the largest?
    options:
    - 9,87,654
    - 10,00,001
    - 9,99,999
    - 99,999
    answer: 10,00,001
    difficulty: 1
    hints:
    - Count the digits.
    - More digits means bigger.
    solution: 10,00,001 has 7 digits; the others have 6 or 5.
    mistakes: {"9,99,999": "t7_compare_digits", "9,87,654": "t7_compare_digits"}
  - prompt: Write one crore as a number without commas. How many digits does it have?
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - 1 crore = 1,00,00,000.
    - 1 followed by 7 zeros.
    solution: 10000000 has 8 digits.
    mistakes: {"7": "t7_crore_digits", "9": "t7_crore_digits"}
  - prompt: Write 'six lakh four thousand thirty' in figures. How many digits does it have?
    answer: '6'
    check: '6'
    difficulty: 2
    hints:
    - Six lakh is a 6-digit number.
    - 6,04,030
    solution: 'Step 1: six lakh = 6,00,000. Step 2: add 4,000 and 30 to get 6,04,030. Step 3: it has 6 digits.'
    mistakes:
      '5': c7m1_places
      '7': c7m1_places
  - prompt: How many thousands make one lakh?
    answer: '100'
    check: 100000/1000
    difficulty: 1
    hints:
    - 1 lakh = 1,00,000.
    - Divide by 1,000.
    solution: 'Step 1: 1,00,000 ÷ 1,000. Step 2: that is 100. So 100 thousands make a lakh.'
    mistakes:
      '10': c7m1_zeros
      '1000': c7m1_zeros
  - prompt: A city has 25 lakh people. How many million is that?
    answer: '2.5'
    check: 25/10
    difficulty: 2
    hints:
    - 10 lakh make 1 million.
    - Divide the lakhs by 10.
    solution: 'Step 1: 1 million = 10 lakh. Step 2: 25 ÷ 10 = 2.5. So 2.5 million.'
    mistakes:
      '25': c7m1_convert
      '250': c7m1_convert
  - prompt: Which is 1,20,05,300 in words?
    options:
    - One crore twenty lakh five thousand three hundred
    - Twelve crore five thousand three hundred
    - One crore two lakh fifty-three hundred
    answer: One crore twenty lakh five thousand three hundred
    difficulty: 2
    hints:
    - 'Read group by group: 1 | 20 | 05 | 300.'
    - The groups are crore, lakh, thousand, then hundreds.
    solution: 'Step 1: 1 crore. Step 2: 20 lakh. Step 3: 05 thousand. Step 4: 300. Together: one crore twenty lakh five thousand three hundred.'
    mistakes:
      Twelve crore five thousand three hundred: c7m1_commas
      One crore two lakh fifty-three hundred: c7m1_commas
  - prompt: In 3,47,92,615, what is the place of the digit 7?
    options:
    - Lakhs
    - Ten lakhs
    - Ten thousands
    answer: Lakhs
    difficulty: 2
    hints:
    - Count places from the right.
    - 615 is ones-tens-hundreds; 92 is thousands-ten thousands; then?
    solution: 'Step 1: from the right, 5 ones, 1 tens, 6 hundreds, 2 thousands, 9 ten thousands. Step 2: the next digit 7 is in the lakhs place.'
    mistakes:
      Ten lakhs: c7m1_places
      Ten thousands: c7m1_places
  - prompt: How many crore make one billion?
    answer: '100'
    check: 1000000000/10000000
    difficulty: 3
    hints:
    - 1 billion has 9 zeros; 1 crore has 7.
    - 'Divide: the difference in zeros is 2.'
    solution: 'Step 1: 1,000,000,000 ÷ 1,00,00,000. Step 2: 10⁹ ÷ 10⁷ = 10² = 100. So 100 crore.'
    mistakes:
      '10': c7m1_convert
      '1000': c7m1_convert
  - prompt: 'Arrange from smallest: 9,99,999; 10,00,000; 9,99,909. Which is the smallest?'
    options:
    - 9,99,909
    - 9,99,999
    - 10,00,000
    answer: 9,99,909
    difficulty: 2
    hints:
    - 10,00,000 has 7 digits, so it is largest.
    - Compare the other two from the left until digits differ.
    solution: 'Step 1: 10,00,000 is largest (7 digits). Step 2: 9,99,999 vs 9,99,909 differ at the tens: 9 > 0. So 9,99,909 is the smallest.'
    mistakes:
      9,99,999: t7_compare_digits
      10,00,000: t7_compare_digits
  - prompt: What is the largest 7-digit number? Type it without commas.
    answer: '9999999'
    check: 10**7-1
    difficulty: 1
    hints:
    - Use the largest digit in every place.
    - One less than the smallest 8-digit number.
    solution: 'Step 1: largest digit is 9. Step 2: seven 9s give 99,99,999. That is 1 crore − 1.'
    mistakes:
      '99999999': c7m1_places
      '1000000': c7m1_places
  - prompt: '1 crore minus 1 lakh: how many lakh is the answer?'
    answer: '99'
    check: 100-1
    difficulty: 2
    hints:
    - 1 crore = 100 lakh.
    - Take away one lakh.
    solution: 'Step 1: 1 crore = 100 lakh. Step 2: 100 − 1 = 99 lakh.'
    mistakes:
      '9': c7m1_convert
      '999': c7m1_convert
- code: cbse7m.large.estimate
  title: Estimating and rounding large numbers
  after:
  - cbse7m.large.read
  notes: |
    Exact values are needed for money in a bank; approximate values are fine for crowds or distances. To round
    to the nearest thousand (or lakh), look at the next digit to the right: 5 or more rounds up, less than 5
    rounds down. Estimation checks whether an answer is sensible: round each number, then calculate.
    Patterns help: multiplying by 10, 100, 1000 adds zeros; 5 × 2 = 10, 25 × 4 = 100, 125 × 8 = 1000.
  explanations:
    text: 'We don''t always need exact numbers. If 48,763 people came to a match, saying ''about 49,000'' is good enough. Round by looking at the next digit: 5 or more, round up; less than 5, round down.'
    visual: Put 48,763 on a number line between 48,000 and 49,000. It sits past the middle (48,500), so it is nearer to 49,000.
    step_by_step: 'Step 1: Find the place you are rounding to. Step 2: Look at the digit just to its right. Step 3: If it is 5 or more, add 1 to the place; otherwise keep it. Step 4: Replace the digits to the right with zeros.'
    real_world: Before paying at a shop, rounding ₹198 + ₹305 + ₹89 to 200 + 300 + 100 = ₹600 tells you roughly how much money to have ready.
  picture:
    kind: flow
    steps:
    - '48,763: round to the nearest thousand'
    - The thousands digit is 8
    - 'The next digit is 7: 5 or more'
    - 'Round up: 8 becomes 9'
    - 'Answer: 49,000'
    alt: 'Rounding 48,763 to the nearest thousand: the next digit, 7, is 5 or more, so it rounds up to 49,000.'
  activity:
    type: number_line
    min: 40000
    max: 60000
    step: 1000
    start: 40000
    prompt: Round each number to the nearest thousand.
    goals:
    - prompt: 48,763
      target: 49000
      mistakes:
      - when:
          v: 48000
        say: 'The hundreds digit is 7: 5 or more, so round up.'
      - when:
          v: 50000
        say: That's rounding to the nearest ten thousand. Look just at the thousands.
    - prompt: 52,480
      target: 52000
      mistakes:
      - when:
          v: 53000
        say: 'The hundreds digit is 4: less than 5, so round down.'
      - when:
          v: 50000
        say: 'Too far: round to the nearest thousand, not ten thousand.'
    - prompt: 45,500
      target: 46000
      mistakes:
      - when:
          v: 45000
        say: The hundreds digit is 5. Exactly 5 rounds up.
  lesson:
    - teach: 'Some numbers must be exact, like money in a bank. Others can be approximate, like a crowd at a match. To round, look at the digit just right of the place you round to: 5 or more rounds up, less than 5 rounds down.'
      picture:
        kind: number_line
        from: 48000
        to: 50000
        step: 1000
        points:
        - at: 48763
          label: 48,763
        alt: 48,763 sits between 48,000 and 49,000 on the number line, nearer to 49,000.
      check:
        prompt: Round 48,763 to the nearest thousand.
        options:
        - 49,000
        - 48,000
        - 48,800
        answer: 49,000
        why: The hundreds digit is 7, which is 5 or more, so round up.
    - teach: Estimation checks whether an answer makes sense. Round each number first, then calculate. 4,890 + 3,120 is about 5,000 + 3,000 = 8,000.
      check:
        prompt: Estimate 6,120 + 2,950 by rounding each to the nearest thousand.
        options:
        - 9,000
        - 8,000
        - 10,000
        answer: 9,000
        why: 6,000 + 3,000 = 9,000.
    - teach: 'Friendly pairs make products easy: 5 × 2 = 10, 25 × 4 = 100, 125 × 8 = 1000. Rearrange the numbers so the friendly pair goes first: 25 × 37 × 4 = (25 × 4) × 37 = 3,700.'
      check:
        prompt: Find 4 × 63 × 25 quickly.
        options:
        - 6,300
        - '630'
        - 63,000
        answer: 6,300
        why: 4 × 25 = 100, and 100 × 63 = 6,300.
  items:
  - prompt: Round 48,763 to the nearest thousand.
    answer: '49000'
    check: '49000'
    difficulty: 1
    hints:
    - Look at the hundreds digit.
    - 7 is 5 or more.
    solution: The hundreds digit is 7, so round up to 49,000.
    mistakes:
      '48000': c7_round_up
  - prompt: Round 3,42,180 to the nearest lakh.
    answer: '300000'
    check: '300000'
    difficulty: 2
    hints:
    - Look at the ten-thousands digit.
    - 4 is less than 5.
    solution: The ten-thousands digit is 4, so round down to 3,00,000.
    mistakes: {"400000": "t7_round_lakh", "340000": "t7_round_lakh"}
  - prompt: Estimate 4,890 + 3,120 by rounding each to the nearest thousand.
    answer: '8000'
    check: 5000 + 3000
    difficulty: 1
    hints:
    - 4,890 ≈ 5,000; 3,120 ≈ 3,000.
    - Add the rounded numbers.
    solution: 5,000 + 3,000 = 8,000.
    mistakes: {"8010": "t7_round_thousand", "7000": "t7_round_thousand"}
  - prompt: Find 125 × 8 × 37 quickly.
    answer: '37000'
    check: 125*8*37
    difficulty: 2
    hints:
    - 125 × 8 = 1000.
    - Then × 37.
    solution: 125 × 8 = 1000, and 1000 × 37 = 37,000.
    mistakes: {"3700": "t7_friendly_pair", "370000": "t7_friendly_pair"}
  - prompt: Which situation needs an exact number, not an estimate?
    options:
    - The amount in a bank account
    - People at a fair
    - Distance to the Moon in a story
    - Stars visible on a clear night
    answer: The amount in a bank account
    difficulty: 1
    hints:
    - Where would a small error matter?
    - Money must be exact.
    solution: A bank balance must be exact; the others are fine as estimates.
    mistakes: {"People at a fair": "t7_exact_needed", "Stars visible on a clear night": "t7_exact_needed"}
  - prompt: A school has 1,248 students. Each needs 6 notebooks. Estimate the total by rounding 1,248 to the nearest hundred.
    answer: '7200'
    check: 1200*6
    difficulty: 2
    hints:
    - 1,248 ≈ 1,200.
    - 1,200 × 6.
    solution: '1,200 × 6 = 7,200 notebooks (exact: 7,488).'
    mistakes: {"7488": "t7_round_then_multiply", "6000": "t7_round_then_multiply"}
  - prompt: Round 7,64,850 to the nearest ten thousand.
    answer: '760000'
    check: '760000'
    difficulty: 2
    hints:
    - Look at the thousands digit.
    - It is 4, less than 5.
    solution: 'Step 1: the ten-thousands digit is 6. Step 2: the next digit is 4, less than 5, so round down. Step 3: 7,60,000.'
    mistakes:
      '770000': c7m1_round
      '765000': c7m1_round
  - prompt: Round 2,58,000 to the nearest lakh.
    answer: '300000'
    check: '300000'
    difficulty: 2
    hints:
    - Look at the ten-thousands digit.
    - It is 5.
    solution: 'Step 1: the lakh digit is 2. Step 2: the next digit 5 means round up. Step 3: 3,00,000.'
    mistakes:
      '200000': c7m1_round
      '260000': c7m1_round
  - prompt: Estimate 812 × 49 by rounding to 800 × 50.
    answer: '40000'
    check: 800*50
    difficulty: 2
    hints:
    - Multiply 8 × 5 first.
    - Then count the zeros.
    solution: 'Step 1: 8 × 5 = 40. Step 2: add three zeros (two from 800, one from 50). Step 3: 40,000.'
    mistakes:
      '4000': c7m1_zeros
      '400000': c7m1_zeros
  - prompt: Find 125 × 23 × 8 quickly.
    answer: '23000'
    check: 125*23*8
    difficulty: 2
    hints:
    - Pair 125 with 8.
    - 125 × 8 = 1,000.
    solution: 'Step 1: 125 × 8 = 1,000. Step 2: 1,000 × 23 = 23,000.'
    mistakes:
      '2300': t7_friendly_pair
      '230000': t7_friendly_pair
  - prompt: Which needs an exact number?
    options:
    - The marks on your report card
    - People at a fair
    - Stars in the sky
    answer: The marks on your report card
    difficulty: 1
    hints:
    - Which one would be unfair if it were rounded?
    - A crowd can be about 5,000.
    solution: Marks must be exact; crowds and stars are estimated.
    mistakes:
      People at a fair: t7_exact_needed
      Stars in the sky: t7_exact_needed
  - prompt: A train carries 1,186 people per trip and makes 9 trips. Estimate the total by rounding 1,186 to the nearest hundred.
    answer: '10800'
    check: 1200*9
    difficulty: 2
    hints:
    - 1,186 rounds to 1,200.
    - Multiply by 9.
    solution: 'Step 1: 1,186 ≈ 1,200. Step 2: 1,200 × 9 = 10,800.'
    mistakes:
      '9900': c7m1_round
      '10674': c7m1_estimate
  - prompt: Round 5,49,999 to the nearest lakh.
    answer: '500000'
    check: '500000'
    difficulty: 3
    hints:
    - Look only at the ten-thousands digit.
    - It is 4.
    solution: 'Step 1: the lakh digit is 5. Step 2: the next digit is 4, less than 5, so round down. Step 3: 5,00,000.'
    mistakes:
      '600000': c7m1_round
      '550000': c7m1_round
  - prompt: A school collects ₹4,950 one week and ₹3,080 the next. About how much is that, to the nearest thousand?
    answer: '8000'
    check: 5000+3000
    difficulty: 1
    hints:
    - Round each amount to the nearest thousand.
    - ₹4,950 ≈ ₹5,000.
    solution: 'Step 1: 4,950 ≈ 5,000 and 3,080 ≈ 3,000. Step 2: 5,000 + 3,000 = 8,000.'
    mistakes:
      '7000': c7m1_estimate
      '9000': c7m1_estimate
  - prompt: Find 50 × 47 × 2 quickly.
    answer: '4700'
    check: 50*47*2
    difficulty: 1
    hints:
    - Find the friendly pair.
    - 50 × 2 = 100.
    solution: 'Step 1: 50 × 2 = 100. Step 2: 100 × 47 = 4,700.'
    mistakes:
      '470': t7_friendly_pair
      '47000': t7_friendly_pair
