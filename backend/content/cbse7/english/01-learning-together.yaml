# CBSE Class 7 English (NCERT Poorvi, 2024-25), unit 1: three chapters. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse7-eng
chapter: 1
title: 'Learning Together: The Day the River Spoke · Try Again · Three Days to See'
tips:
  eng7_read_again: 'Go back to the chapter: the answer is in the text. Find the part about that person or event.'
  eng7_poem_meaning: Poems often mean more than they say. Ask what the picture in the poem stands for in life.
  eng7_whole_story: 'Think about the whole story, not just one line: what changes from the start to the end?'
  e7_appu: "Jahnavi had to look after someone small at home, so she took him along."
  e7_courage_patience: "The poem says you must keep at it without fear and without rushing."
  e7_first_day: "Helen first wants to see the people closest to her, like her teacher."
  e7_jahnavi_dream: "Jahnavi had to fight to study. What would she want for other girls?"
  e7_keller_message: "Helen says sighted people take their eyes for granted. What does she ask them to do?"
  e7_perseverance: "Luck just happens. Which word is about keeping going?"
  e7_refrain: "The repeated line is in the poem's title."
  e7_river_speaks: "The story's title tells you who talks to Jahnavi."
  e7_teacher_convinced: "The River encouraged Jahnavi, but someone from the school spoke to her father."
  e7_third_day: "Helen already reads by touch. On the last day she wants to see everyday life outside."
  e7_three_days: "The essay's title tells you how many days."
  e7_try_message: "The poem is about what to do after you fail."
  e7_try_situation: "The poem says don't stop at the first failure. Which choice keeps trying?"
  e7_window_soul: "An old saying calls the eyes a way to look into a person's inner self."
  c7e1_events: 'Retell the story in order: the girl''s worry, the voice that comforts her, her brave step, and who helps her family agree.'
  c7e1_feel: Look at what a character does and says, then ask what feeling or quality it shows.
  c7e1_words: Read the sentence around the word and try each choice in its place. The right one keeps the meaning.
  c7e1_poem: A poem's message is the lesson it repeats. Read the lines that come back again and again.
  c7e1_essay: The writer imagines a few days, each with a different plan. Match each plan to its day, then think about her advice to us.
  c7e1_grammar: Check who is doing the action and when it happens, then pick the form that fits.
concepts:
- code: cbse7e.u1.river
  title: The Day the River Spoke (Kamala Nair)
  notes: |
    Jahnavi, a girl of nearly ten, lives in a village by a river. Her brothers Gopi and Meena go to school and Ramu
    has just started, but she must stay home and look after little Appu, and she fears she is too old to begin.
    Crying by the river, she hears the River speak to her: it comforts her, answers her questions about ships and
    the fisherman Chandu's catamaran, and says little girls can do as much as little boys. It urges her to slip into
    school and see if the teacher lets her stay. She goes, carrying Appu, listens to a lesson about King Ashoka, and
    the kind teacher welcomes her and visits her father, who agrees. Her mother, who never studied, supports her.
    Jahnavi vows to become a teacher and help every girl in the village go to school. Themes: education for girls,
    courage, nature as a friend.
  explanations:
    text: Jahnavi longs to go to school like her brothers, but has to stay home and mind her baby brother. The River speaks to her and encourages her to try. She slips into class carrying Appu, the teacher welcomes her and persuades her father, and Jahnavi decides to become a teacher who helps every girl learn.
    visual: Picture a girl sitting by a sparkling river with a baby on her hip, a kingfisher overhead, and then the same girl at the back of a classroom, eyes wide, as the teacher smiles at her.
    step_by_step: 'Step 1: The problem: Jahnavi is kept at home. Step 2: The River''s encouragement. Step 3: Her brave step: going to school. Step 4: The teacher convinces her father. Step 5: Her dream: to teach every girl.'
    real_world: Programmes like Beti Bachao Beti Padhao work to make sure every girl in India can go to school, just as Jahnavi wanted.
  picture:
    kind: flow
    steps:
    - Jahnavi must stay home with Appu
    - The River speaks and encourages her
    - She slips into school carrying Appu
    - The teacher convinces her father
    - She vows to help every girl learn
    alt: 'The story in five steps: Jahnavi kept at home, the River''s encouragement, going to school, the teacher persuading her father, and her vow to help every girl.'
  activity:
    type: order
    prompt: 'The Day the River Spoke: put Jahnavi''s day in order.'
    steps:
    - Jahnavi cries by the river
    - The River speaks and comforts her
    - The River says to slip into school
    - She sits in the class with Appu
    - The teacher visits her father, who agrees
    reasons:
      The River speaks and comforts her: Hearing her cry, the River answers.
      The River says to slip into school: It tells her girls can do as much as boys.
      She sits in the class with Appu: She goes, carrying her little brother.
      The teacher visits her father, who agrees: The kind teacher wants her to stay.
  lesson:
    - teach: Jahnavi, nearly ten, lives in a village by a river. Her brothers go to school, but she must stay home and look after baby Appu. She is sad and afraid she is too old to start school.
      check:
        prompt: Why is Jahnavi at home while her brothers go to school?
        options:
        - She must look after her baby brother
        - She is ill
        - She does not like books
        answer: She must look after her baby brother
        why: Her duty at home keeps her from school.
    - teach: Crying by the river, she hears the River speak. It comforts her, answers her questions about ships and fishing boats, and tells her that girls can do as much as boys. It urges her to slip into school and see if the teacher lets her stay. Here nature is shown as a wise friend.
      check:
        prompt: What does the River teach Jahnavi about girls?
        options:
        - They can do as much as boys
        - They should stay at home
        - They cannot learn
        answer: They can do as much as boys
        why: The River encourages her to believe in herself.
    - teach: 'She goes, carrying Appu, and listens to a lesson about King Ashoka. The kind teacher welcomes her and visits her father, who agrees. Her mother, who never studied, supports her. Jahnavi vows to become a teacher and help every girl go to school. The theme: every girl deserves an education.'
      picture:
        kind: flow
        steps:
        - Jahnavi cries by the river
        - The River speaks and encourages her
        - She goes to school with Appu
        - Teacher talks to her father
        - She dreams of teaching every girl
        alt: The main events of the story in order.
      check:
        prompt: Which quality does Jahnavi show by walking into school?
        options:
        - Courage
        - Laziness
        - Anger
        answer: Courage
        why: She was afraid but went anyway.
  items:
  - prompt: Why was Jahnavi crying by the river?
    options:
    - She was not allowed to go to school
    - She had lost Appu
    - She had failed a test
    - Her boat had sunk
    answer: She was not allowed to go to school
    difficulty: 1
    hints:
    - Her brothers went.
    - She had to mind Appu.
    solution: Her brothers went to school but she had to stay home.
    mistakes:
      She had lost Appu: eng7_read_again
  - prompt: Who speaks to Jahnavi and encourages her?
    options:
    - The River
    - A parrot
    - Her grandmother
    - A fisherman
    answer: The River
    difficulty: 1
    hints:
    - See the title.
    - Nature talks to her.
    solution: The River speaks to her.
    mistakes: {"Her grandmother": "e7_river_speaks"}
  - prompt: Whom did Jahnavi carry with her to school?
    options:
    - Her baby brother Appu
    - Her friend Meena
    - A kitten
    - Nobody
    answer: Her baby brother Appu
    difficulty: 1
    hints:
    - She had to look after him.
    - The youngest.
    solution: She took Appu with her because she had to mind him.
    mistakes: {"Nobody": "e7_appu"}
  - prompt: Who convinced Jahnavi's father to let her study?
    options:
    - The teacher
    - The River
    - Chandu the fisherman
    - Her brother Gopi
    answer: The teacher
    difficulty: 2
    hints:
    - Someone from the school.
    - Visited their home.
    solution: The kind teacher visited and persuaded her father.
    mistakes: {"The River": "e7_teacher_convinced"}
  - prompt: What does Jahnavi decide to become?
    options:
    - A teacher who helps every girl go to school
    - A fisherman
    - A sailor on a big ship
    - A doctor in the city
    answer: A teacher who helps every girl go to school
    difficulty: 1
    hints:
    - Her vow at the end.
    - Helping other girls.
    solution: She vows to become a teacher and help every girl learn.
    mistakes: {"A fisherman": "e7_jahnavi_dream"}
  - prompt: What is the main message of the story?
    options:
    - Every girl deserves an education
    - Rivers are dangerous
    - Boys should stay home
    - Babies should go to school
    answer: Every girl deserves an education
    difficulty: 2
    hints:
    - What did the River say about girls?
    - Jahnavi's dream.
    solution: The story is about girls' right to education.
    mistakes:
      Rivers are dangerous: eng7_whole_story
  - prompt: What lesson was the teacher giving when Jahnavi arrived?
    options:
    - About King Ashoka
    - About fishing nets
    - About the planets
    answer: About King Ashoka
    difficulty: 2
    hints:
    - It was a history lesson.
    - He was a great Mauryan emperor.
    solution: The teacher was telling the class about King Ashoka.
    mistakes:
      About fishing nets: c7e1_events
      About the planets: c7e1_events
  - prompt: How did Jahnavi's mother feel about her going to school?
    options:
    - She supported her
    - She was angry
    - She did not care
    answer: She supported her
    difficulty: 2
    hints:
    - Her mother never had the chance to study.
    - She wanted a better life for her daughter.
    solution: Though she never studied herself, her mother supported Jahnavi.
    mistakes:
      She was angry: c7e1_feel
      She did not care: c7e1_feel
  - prompt: Why was Jahnavi afraid she could not start school?
    options:
    - She thought she was too old
    - She had no shoes
    - The school was closed
    answer: She thought she was too old
    difficulty: 2
    hints:
    - She was nearly ten.
    - Her younger brother had just started.
    solution: Jahnavi feared that at nearly ten she was too old to begin.
    mistakes:
      She had no shoes: c7e1_events
      The school was closed: c7e1_events
  - prompt: 'In the story, the River acts like a:'
    options:
    - Wise, kind friend
    - Dangerous enemy
    - Strict policeman
    answer: Wise, kind friend
    difficulty: 1
    hints:
    - It comforts her.
    - It gives her good advice.
    solution: The River comforts and advises Jahnavi, like a wise friend.
    mistakes:
      Dangerous enemy: c7e1_feel
      Strict policeman: c7e1_feel
  - prompt: 'Giving human qualities, like speech, to a river is called:'
    options:
    - Personification
    - Rhyme
    - Alliteration
    answer: Personification
    difficulty: 2
    hints:
    - '''Person'' is inside the word.'
    - The river talks like a person.
    solution: Personification gives human qualities to non-human things.
    mistakes:
      Rhyme: c7e1_words
      Alliteration: c7e1_words
  - prompt: '''The teacher welcomed her warmly.'' The word ''warmly'' tells us the teacher was:'
    options:
    - Kind and friendly
    - Feeling hot
    - Angry
    answer: Kind and friendly
    difficulty: 1
    hints:
    - It is not about temperature here.
    - Think about how she was greeted.
    solution: '''Warmly'' here means in a kind, friendly way.'
    mistakes:
      Feeling hot: c7e1_words
      Angry: c7e1_words
  - prompt: Why does Jahnavi want to become a teacher?
    options:
    - To help every girl in the village go to school
    - To earn a lot of money
    - To live in a city
    answer: To help every girl in the village go to school
    difficulty: 2
    hints:
    - Think of her own struggle.
    - She wants others not to miss out.
    solution: Having nearly missed school, she wants to help all girls get an education.
    mistakes:
      To earn a lot of money: c7e1_feel
      To live in a city: c7e1_feel
  - prompt: 'Choose the correct past tense: ''Jahnavi ___ to school with Appu.'''
    options:
    - went
    - goed
    - going
    answer: went
    difficulty: 1
    hints:
    - '''Go'' is an irregular verb.'
    - Its past form does not end in -ed.
    solution: The past tense of 'go' is 'went'.
    mistakes:
      goed: c7e1_grammar
      going: c7e1_grammar
  - prompt: What made the father change his mind?
    options:
    - The teacher came and talked to him
    - Appu cried
    - The river flooded
    answer: The teacher came and talked to him
    difficulty: 1
    hints:
    - Someone visited the house.
    - It was someone from the school.
    solution: The teacher visited and persuaded the father to let Jahnavi study.
    mistakes:
      Appu cried: c7e1_events
      The river flooded: c7e1_events
- code: cbse7e.u1.tryagain
  title: Try Again (poem)
  after:
  - cbse7e.u1.river
  notes: |
    A well-known poem (often credited to William Edward Hickson) with the refrain "If at first you don't succeed,
    try, try again." It encourages children not to give up after failure: let courage appear; persevere and you will
    conquer; if others have done it, you can too; time will bring reward. Simple rhyming lines and repetition make the
    message memorable. Theme: perseverance.
  explanations:
    text: 'This short poem says that if you fail at first, don''t give up: try, try again. With courage and patience you will succeed, just as others have.'
    visual: Picture a child falling off a bicycle, getting up, falling again, and finally riding away smiling, with the words 'try, try again' written along the road.
    step_by_step: 'Step 1: Find the refrain. Step 2: Notice how often it repeats. Step 3: Ask what the poet wants us to do after failing. Step 4: State the theme: perseverance.'
    real_world: Most famous inventors failed many times before succeeding; Thomas Edison tested thousands of materials before his light bulb worked.
  picture:
    kind: compare
    columns:
    - title: After failing, don't
      points:
      - Give up
      - Lose courage
      - Blame others
    - title: After failing, do
      points:
      - Try again
      - Keep your courage
      - Learn and persevere
    alt: 'What the poem says to do after failing: not give up or lose courage, but try again and persevere.'
  activity:
    type: sort
    prompt: 'Try Again: what does the poem say?'
    bins:
    - Don't give up
    - You can do it too
    - Reward comes
    items:
    - label: If at first you don't succeed, try again
      bin: Don't give up
      clue: The refrain.
      why: The refrain says to keep trying after failure.
    - label: If others have done it, you can too
      bin: You can do it too
      clue: Compare yourself with others.
      why: Others' success shows you can do it.
    - label: Time will bring you your reward
      bin: Reward comes
      clue: Patience.
      why: The reward comes in time.
    - label: Let your courage appear
      bin: Don't give up
      clue: Be brave after failing.
      why: Courage means not giving up.
    - label: Persevere and you will conquer
      bin: Reward comes
      clue: What happens if you keep going?
      why: 'Persevering leads to winning: the reward.'
  lesson:
    - teach: '''Try Again'' is a short rhyming poem. Its refrain, the line that keeps coming back, is: ''If at first you don''t succeed, try, try again.'' Repeating it makes the message easy to remember.'
      check:
        prompt: 'A line repeated in a poem is called a:'
        options:
        - Refrain
        - Title
        - Footnote
        answer: Refrain
        why: A refrain comes back again and again.
    - teach: 'The poem says: failure is not the end. Let courage appear, keep going, and you will win. If others have done it, you can too. Time will bring your reward.'
      picture:
        kind: flow
        steps:
        - You try and fail
        - You keep your courage
        - You try again (and again)
        - You succeed
        alt: 'The cycle the poem describes: fail, keep courage, try again, succeed.'
      check:
        prompt: According to the poem, what should you do after failing?
        options:
        - Try again with courage
        - Give up
        - Blame others
        answer: Try again with courage
        why: That is the poem's whole message.
    - teach: 'The key quality is perseverance: continuing in spite of difficulty. The poem uses simple words, rhyme and repetition so even young readers remember it.'
      check:
        prompt: Which person shows perseverance?
        options:
        - A girl who practises cycling after falling many times
        - A boy who quits after one mistake
        - Someone who never tries
        answer: A girl who practises cycling after falling many times
        why: She keeps going despite difficulty.
  items:
  - prompt: Which line is repeated in the poem?
    options:
    - Try, try again
    - Never try again
    - Stop and rest
    - Run away
    answer: Try, try again
    difficulty: 1
    hints:
    - The refrain.
    - Keep trying.
    solution: The refrain is 'try, try again'.
    mistakes: {"Never try again": "e7_refrain"}
  - prompt: What is the main message of 'Try Again'?
    options:
    - Don't give up after failing
    - Never take risks
    - Winning is everything
    - Only try once
    answer: Don't give up after failing
    difficulty: 1
    hints:
    - Perseverance.
    - If at first you don't succeed…
    solution: The poem teaches perseverance.
    mistakes: {"Winning is everything": "e7_try_message"}
  - prompt: 'A word that means ''continuing despite difficulty'' is:'
    options:
    - Perseverance
    - Laziness
    - Fear
    - Luck
    answer: Perseverance
    difficulty: 2
    hints:
    - The theme of the poem.
    - Keep going.
    solution: Perseverance means keeping on despite difficulty.
    mistakes: {"Luck": "e7_perseverance"}
  - prompt: Why does the poet repeat the refrain?
    options:
    - To make the message stick in our minds
    - Because he forgot the words
    - To fill space
    - To make it confusing
    answer: To make the message stick in our minds
    difficulty: 2
    hints:
    - Repetition helps memory.
    - Emphasis.
    solution: Repetition makes the message memorable.
    mistakes:
      Because he forgot the words: eng7_poem_meaning
  - prompt: Which situation best fits the poem's advice?
    options:
    - Practising a hard maths sum until you get it
    - Giving up after one mistake
    - Copying a friend's answer
    - Skipping practice
    answer: Practising a hard maths sum until you get it
    difficulty: 1
    hints:
    - Keep trying.
    - Don't quit.
    solution: Trying again until you succeed fits the poem.
    mistakes: {"Giving up after one mistake": "e7_try_situation"}
  - prompt: According to the poem, what helps you succeed in the end?
    options:
    - Courage and patience
    - Luck alone
    - Giving up
    - Being angry
    answer: Courage and patience
    difficulty: 2
    hints:
    - Let your courage appear.
    - Time brings reward.
    solution: The poem says courage and patience lead to success.
    mistakes: {"Luck alone": "e7_courage_patience"}
  - prompt: Who is the poem 'Try Again' often credited to?
    options:
    - William Edward Hickson
    - Rabindranath Tagore
    - Helen Keller
    answer: William Edward Hickson
    difficulty: 2
    hints:
    - He was an English writer of the 1800s.
    - Tagore wrote 'Paper Boats'.
    solution: The poem is usually credited to William Edward Hickson.
    mistakes:
      Rabindranath Tagore: c7e1_poem
      Helen Keller: c7e1_essay
  - prompt: Which word is the opposite of 'succeed'?
    options:
    - Fail
    - Win
    - Achieve
    answer: Fail
    difficulty: 1
    hints:
    - Opposite means the reverse.
    - Two choices mean almost the same as 'succeed'.
    solution: The opposite of succeed is fail.
    mistakes:
      Win: c7e1_words
      Achieve: c7e1_words
  - prompt: '''If others have done it, you can too.'' This line gives the reader:'
    options:
    - Hope and confidence
    - Fear
    - A warning to stop
    answer: Hope and confidence
    difficulty: 2
    hints:
    - It compares you with people who succeeded.
    - It encourages.
    solution: 'The line encourages: if others managed, so can you.'
    mistakes:
      Fear: c7e1_poem
      A warning to stop: c7e1_poem
  - prompt: Why does the poem use simple rhyming lines?
    options:
    - So the message is easy to remember
    - To confuse readers
    - Because it is a story
    answer: So the message is easy to remember
    difficulty: 2
    hints:
    - Think of nursery rhymes.
    - Rhyme helps memory.
    solution: Rhyme and repetition help readers remember the message.
    mistakes:
      To confuse readers: c7e1_poem
      Because it is a story: c7e1_poem
  - prompt: Which proverb has a similar message?
    options:
    - Practice makes perfect
    - Too many cooks spoil the broth
    - Look before you leap
    answer: Practice makes perfect
    difficulty: 2
    hints:
    - Think about repeating an effort.
    - The poem says keep trying.
    solution: '''Practice makes perfect'' also says repeated effort brings success.'
    mistakes:
      Too many cooks spoil the broth: c7e1_poem
      Look before you leap: c7e1_poem
  - prompt: 'Pick the word that rhymes with ''again'':'
    options:
    - Rain
    - Gate
    - Agent
    answer: Rain
    difficulty: 1
    hints:
    - Say the words aloud.
    - Listen to the ending sound.
    solution: '''Again'' and ''rain'' end with the same sound.'
    mistakes:
      Gate: c7e1_words
      Agent: c7e1_words
  - prompt: Ravi failed his first swimming test. What would the poet tell him?
    options:
    - Keep practising and try again
    - Never swim again
    - Swimming is not for you
    answer: Keep practising and try again
    difficulty: 1
    hints:
    - Think of the refrain.
    - Failure is not the end.
    solution: The poem's advice is to keep trying after failing.
    mistakes:
      Never swim again: c7e1_poem
      Swimming is not for you: c7e1_poem
  - prompt: In 'try, try again', why is 'try' said twice?
    options:
    - To stress that you must keep trying
    - It is a printing mistake
    - To make the line shorter
    answer: To stress that you must keep trying
    difficulty: 2
    hints:
    - Repetition adds emphasis.
    - It sounds like a beat.
    solution: Repeating 'try' emphasises continuing effort.
    mistakes:
      It is a printing mistake: c7e1_poem
      To make the line shorter: c7e1_poem
  - prompt: 'Fill in: ''She ___ (try) three times before she won.'''
    options:
    - tried
    - tryed
    - trys
    answer: tried
    difficulty: 1
    hints:
    - Past tense is needed.
    - When a verb ends in consonant + y, change y to i before -ed.
    solution: '''Try'' becomes ''tried'' in the past tense.'
    mistakes:
      tryed: c7e1_grammar
      trys: c7e1_grammar
- code: cbse7e.u1.threedays
  title: Three Days to See (Helen Keller)
  after:
  - cbse7e.u1.tryagain
  notes: |
    An essay by Helen Keller, who was blind and deaf from infancy. She imagines being given sight for three days.
    Day 1: she would look at the faces of the people she loves, especially her teacher Anne Sullivan, and see into
    their eyes, 'the window of the soul'. Day 2: she would watch the dawn and visit museums to see the history of the
    Earth and of people, and art. Day 3: she would watch ordinary people in the city going about their lives, their
    smiles and struggles. She urges sighted people to use their eyes, and all their senses, as if they would lose
    them tomorrow. Theme: value your senses and everyday life.
  explanations:
    text: Helen Keller, who could not see or hear, imagines having sight for just three days. She would spend them looking at the faces of the people she loves, at the dawn and museums, and at ordinary city life. She asks us to use our senses as if we might lose them tomorrow.
    visual: 'Draw three boxes. Day 1: faces of loved ones. Day 2: a sunrise and a museum. Day 3: a busy city street full of people.'
    step_by_step: 'Step 1: Know the author: Helen Keller, blind and deaf. Step 2: Day 1: loved ones. Step 3: Day 2: dawn, museums, art. Step 4: Day 3: everyday city life. Step 5: Her message to us.'
    real_world: 'Next time you see a sunset, try looking at it the way Helen Keller would have: as something precious, not ordinary.'
  picture:
    kind: flow
    steps:
    - 'Day 1: faces of the people she loves'
    - 'Day 2: the dawn, museums and art'
    - 'Day 3: ordinary people in the city'
    - 'Her message: use your senses fully'
    alt: 'Helen Keller''s three imagined days of sight: loved ones, then dawn and museums, then city life, and her message to use our senses fully.'
  activity:
    type: sort
    prompt: 'Three Days to See: which day would Helen Keller see it?'
    bins:
    - Day 1
    - Day 2
    - Day 3
    items:
    - label: Anne Sullivan's face
      bin: Day 1
      clue: People she loves come first.
      why: Day 1 is for the faces of loved ones.
    - label: The dawn
      bin: Day 2
      clue: She would wake early to watch it.
      why: Day 2 begins with the dawn.
    - label: Museums of history and art
      bin: Day 2
      clue: The past of the Earth and people.
      why: Museums are her Day 2 plan.
    - label: Ordinary people in the city
      bin: Day 3
      clue: Everyday life.
      why: Day 3 is for watching everyday city life.
    - label: Her friends' eyes, 'window of the soul'
      bin: Day 1
      clue: Close to those she loves.
      why: Looking into loved ones' eyes is Day 1.
  lesson:
    - teach: Helen Keller became blind and deaf as a baby, yet learned to read, write and speak with her teacher Anne Sullivan. In 'Three Days to See' she imagines being given sight for just three days.
      check:
        prompt: Who was Helen Keller's teacher?
        options:
        - Anne Sullivan
        - Jahnavi
        - Mary Shaw
        answer: Anne Sullivan
        why: Anne Sullivan taught her to communicate.
    - teach: 'Day 1: look at the faces of people she loves and into their eyes, ''the window of the soul''. Day 2: watch the dawn and visit museums to see the history of the Earth, people and art. Day 3: watch ordinary people in the city, their smiles and struggles.'
      picture:
        kind: compare
        columns:
        - title: Day
          points:
          - Day 1
          - Day 2
          - Day 3
        - title: Plan
          points:
          - faces of loved ones
          - dawn, museums, art
          - ordinary people in the city
        alt: What Helen Keller would see on each of the three days.
      check:
        prompt: On which day would she visit museums?
        options:
        - Day 2
        - Day 1
        - Day 3
        answer: Day 2
        why: Day 2 is for the dawn, history and art.
    - teach: 'Her message: sighted people often take their eyes for granted. Use your eyes, and all your senses, as if you would lose them tomorrow. Value ordinary things.'
      check:
        prompt: '''Take for granted'' means:'
        options:
        - Not value something because you always have it
        - Receive a prize
        - Ask for permission
        answer: Not value something because you always have it
        why: We stop noticing things we always have.
  items:
  - prompt: Who wrote 'Three Days to See'?
    options:
    - Helen Keller
    - Kamala Nair
    - Ruskin Bond
    - Anita Rau Badami
    answer: Helen Keller
    difficulty: 1
    hints:
    - She was blind and deaf.
    - American writer.
    solution: The essay is by Helen Keller.
    mistakes:
      Ruskin Bond: eng7_read_again
  - prompt: For how many days does Helen Keller imagine having sight?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - See the title.
    - Three.
    solution: Three days.
    mistakes: {"2": "e7_three_days"}
  - prompt: What would she look at on the first day?
    options:
    - The faces of the people she loves
    - Museums
    - The city
    - The ocean
    answer: The faces of the people she loves
    difficulty: 1
    hints:
    - Her friends and teacher.
    - '''Window of the soul''.'
    solution: On day 1 she would look at her loved ones.
    mistakes: {"The ocean": "e7_first_day"}
  - prompt: What does she call the eyes?
    options:
    - The window of the soul
    - The door of the house
    - The mirror of the sky
    - The key to the world
    answer: The window of the soul
    difficulty: 2
    hints:
    - You can see feelings in them.
    - Soul.
    solution: She calls the eyes 'the window of the soul'.
    mistakes: {"The door of the house": "e7_window_soul"}
  - prompt: What would she do on the third day?
    options:
    - Watch ordinary people in the city
    - Sleep all day
    - Read books by touch
    - Visit her school
    answer: Watch ordinary people in the city
    difficulty: 2
    hints:
    - Everyday life.
    - Smiles and struggles.
    solution: On day 3 she would watch everyday life in the city.
    mistakes: {"Read books by touch": "e7_third_day"}
  - prompt: What is Helen Keller's message to sighted people?
    options:
    - Use your eyes and senses as if you'd lose them tomorrow
    - Close your eyes more often
    - Only look at museums
    - Sight is not important
    answer: Use your eyes and senses as if you'd lose them tomorrow
    difficulty: 2
    hints:
    - Don't take senses for granted.
    - Appreciate them.
    solution: She urges us to value and fully use our senses.
    mistakes: {"Sight is not important": "e7_keller_message"}
  - prompt: 'Helen Keller could neither see nor:'
    options:
    - Hear
    - Write
    - Think
    answer: Hear
    difficulty: 1
    hints:
    - She lost two senses as a baby.
    - She learned to write and think deeply.
    solution: Helen Keller was both blind and deaf.
    mistakes:
      Write: c7e1_essay
      Think: c7e1_essay
  - prompt: Why would she spend the first day looking at faces?
    options:
    - She wanted to see the people she loved
    - She liked crowds
    - She wanted to count people
    answer: She wanted to see the people she loved
    difficulty: 1
    hints:
    - Think of her teacher and friends.
    - She had only touched their faces.
    solution: She longed to see the faces of those dear to her.
    mistakes:
      She liked crowds: c7e1_essay
      She wanted to count people: c7e1_essay
  - prompt: Why does she call the eyes 'the window of the soul'?
    options:
    - Eyes show a person's inner feelings
    - Eyes are made of glass
    - Eyes open and close like windows
    answer: Eyes show a person's inner feelings
    difficulty: 2
    hints:
    - A window lets you see inside.
    - The soul is the inner self.
    solution: Through the eyes we can glimpse someone's feelings and character.
    mistakes:
      Eyes are made of glass: c7e1_words
      Eyes open and close like windows: c7e1_words
  - prompt: What is the main purpose of the essay?
    options:
    - To make us value our senses
    - To describe a museum
    - To teach history dates
    answer: To make us value our senses
    difficulty: 2
    hints:
    - Read the last part again.
    - She speaks directly to sighted people.
    solution: She urges readers to appreciate sight and all senses.
    mistakes:
      To describe a museum: c7e1_essay
      To teach history dates: c7e1_essay
  - prompt: Which shows using your senses fully?
    options:
    - Really noticing the colours of a sunset
    - Staring at a phone all day
    - Ignoring the world around you
    answer: Really noticing the colours of a sunset
    difficulty: 1
    hints:
    - Think of her advice.
    - Notice ordinary beauty.
    solution: Paying real attention to what you see is using your senses fully.
    mistakes:
      Staring at a phone all day: c7e1_essay
      Ignoring the world around you: c7e1_essay
  - prompt: '''Three Days to See'' is a piece of non-fiction called an:'
    options:
    - Essay
    - Poem
    - Play
    answer: Essay
    difficulty: 2
    hints:
    - It is written in paragraphs, not verse.
    - It shares the writer's own thoughts.
    solution: 'It is an essay: a prose piece giving the writer''s ideas.'
    mistakes:
      Poem: c7e1_words
      Play: c7e1_words
  - prompt: If she imagines 3 days of sight and spends 1 on faces, how many days are left for other things?
    answer: '2'
    check: 3-1
    difficulty: 1
    hints:
    - Start with the total days.
    - Take away the first day.
    solution: 'Step 1: 3 - 1. Step 2: = 2 days.'
    mistakes:
      '4': c7e1_essay
      '1': c7e1_essay
  - prompt: What would she watch in the city on the third day?
    options:
    - Ordinary people's daily lives
    - Only tall buildings
    - Only cars
    answer: Ordinary people's daily lives
    difficulty: 2
    hints:
    - She was interested in people.
    - Their smiles and struggles.
    solution: She wanted to watch everyday people going about their lives.
    mistakes:
      Only tall buildings: c7e1_essay
      Only cars: c7e1_essay
  - prompt: 'Choose the correct form: ''If I ___ sight for three days, I would visit a museum.'''
    options:
    - had
    - has
    - having
    answer: had
    difficulty: 3
    hints:
    - This is an imagined situation.
    - Imaginary 'if' sentences with 'would' use the past form.
    solution: 'Imaginary conditions use ''if + past'': ''If I had sight...I would...'''
    mistakes:
      has: c7e1_grammar
      having: c7e1_grammar
