# CBSE Class 7 English (NCERT Poorvi, 2024-25), unit 2: three chapters. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse7-eng
chapter: 2
title: 'Wit and Humour: Animals, Birds, and Dr. Dolittle · A Funny Man · Say the Right Thing'
tips:
  e7_awkward: "After a rude remark, guests don't laugh; nobody knows what to say."
  e7_cats_meat_man: "His sister did not like the animals. Think of the man who came by with food for people's pets."
  e7_dolittle_funny: "Think of a horse in glasses. Is that sad or silly?"
  e7_doors: "Mice, rabbits and horses are different sizes. Why would one door not suit everyone?"
  e7_hat_feet: "If the shoe went on his head, what went on his feet?"
  e7_mary_goodbye: "Mary mixed up her words at the door, making it sound like she wanted the guests gone."
  e7_mary_mistake: "Mary says the wrong thing again and again. Is she quiet?"
  e7_nonsense: "An epic is a long, serious poem about heroes. This one is short and silly."
  e7_polynesia: "Polynesia was a parrot who could talk. What did she show the doctor about animals?"
  e7_rhyme_pair: "Rhyming words end with the same sound. Say each pair aloud."
  e7_shaw_invite: "The Shaws were new in town. Why invite neighbours over?"
  e7_shoe_head: "Everything about the funny man is the wrong way round."
  e7_spectacles: "The horse could not see well."
  e7_wrong_places: "Picture a man with things where they shouldn't be. Why do we laugh?"
  c7e2_events: 'Retell the story in order: the doctor losing human patients, the new idea, learning to talk with animals, and the visitors who come.'
  c7e2_why: Ask what the character wanted or needed, and what problem the action solved.
  c7e2_funny: 'Humour here comes from surprise: things in the wrong place, animals acting like people, or words that mean the opposite of what was intended.'
  c7e2_words: Put each choice into the sentence and read it aloud. Keep the one that makes sense.
  c7e2_play: In the play, each remark accidentally hurts a guest. Ask who the remark was really about.
  c7e2_grammar: Check whether the sentence needs a question, a negative or a different tense, then choose.

concepts:
- code: cbse7e.u2.dolittle
  title: Animals, Birds, and Dr. Dolittle (Hugh Lofting)
  notes: |
    From Hugh Lofting's 'The Story of Doctor Dolittle'. Doctor John Dolittle of Puddleby is a doctor whose human
    patients have dwindled. The Cat's-meat-Man (here 'Cat's-food-Man') suggests he become an animal doctor. His parrot
    Polynesia tells him animals have their own languages and teaches him (bird words like 'Ka-ka oi ee, fee-fee':
    'Is the porridge hot yet?'). He gives up treating people. A plough horse, badly treated by a vet, tells him he
    only needs spectacles; Dolittle gives him green glasses. Animals of every kind come; he builds separate doors for
    different animals, and birds spread his fame. Themes: listening to animals, kindness, humour.
  explanations:
    text: Doctor Dolittle learns from his parrot Polynesia that animals have their own languages. Once he can talk with them, he becomes an animal doctor. A plough horse tells him it just needs spectacles, and soon animals from everywhere come to him for help.
    visual: 'Picture a cottage with many little doors: a big one for horses, a small one for cats, a tiny tunnel for mice, and a parrot on the doctor''s shoulder teaching him bird words.'
    step_by_step: 'Step 1: Dolittle''s problem: few human patients. Step 2: The suggestion: become an animal doctor. Step 3: Polynesia teaches him animal language. Step 4: The horse and its glasses. Step 5: His fame spreads.'
    real_world: Vets today learn to read animals' body language, a real-life version of 'talking' with animals.
  picture:
    kind: flow
    steps:
    - Few human patients come to Dolittle
    - The Cat's-food-Man suggests treating animals
    - Polynesia teaches him animal languages
    - A plough horse gets green spectacles
    - Animals come from far and wide
    alt: 'Doctor Dolittle''s story in five steps: few patients, the suggestion to treat animals, learning animal language from Polynesia, the horse''s spectacles, and his growing fame.'
  activity:
    type: order
    prompt: 'Dr Dolittle: put the story in order.'
    steps:
    - Dolittle's human patients dwindle
    - The Cat's-food-Man says be an animal doctor
    - Polynesia teaches him animal language
    - A plough horse asks for spectacles
    - Animals of every kind come to him
    reasons:
      The Cat's-food-Man says be an animal doctor: With few patients, he needs a new idea.
      Polynesia teaches him animal language: To treat animals, he must understand them.
      A plough horse asks for spectacles: Now he can talk to animals, so they explain their problems.
      Animals of every kind come to him: Birds spread his fame.
  lesson:
    - teach: Doctor John Dolittle lives in Puddleby. He loves animals so much that his house fills with them, and his human patients stop coming. The Cat's-food-Man suggests he become an animal doctor instead.
      check:
        prompt: Why did Dolittle's human patients stop coming?
        options:
        - His house was full of animals
        - He charged too much
        - He moved away
        answer: His house was full of animals
        why: People did not like sitting among the animals.
    - teach: His parrot Polynesia tells him that animals have their own languages and teaches him to understand them. For example, a bird's 'Ka-ka oi ee, fee-fee' means 'Is the porridge hot yet?' Dolittle gives up treating people.
      check:
        prompt: What surprising fact did Polynesia tell Dolittle?
        options:
        - Animals have their own languages
        - Parrots can fly to the Moon
        - Horses can read
        answer: Animals have their own languages
        why: This changed his whole career.
    - teach: A plough horse, badly treated by another vet, tells Dolittle he only needs spectacles. Dolittle gives him green glasses. Animals of all kinds come; he builds separate doors for different animals, and birds spread his fame. The humour comes from animals acting like people.
      picture:
        kind: flow
        steps:
        - Human patients leave
        - Cat's-food-Man suggests animal doctoring
        - Polynesia teaches animal language
        - Horse gets spectacles
        - Animals come from far and wide
        alt: The main events of the Dr Dolittle story.
      check:
        prompt: Why could Dolittle cure the horse when the other vet could not?
        options:
        - He could ask the horse what was wrong
        - He had stronger medicine
        - He was a surgeon
        answer: He could ask the horse what was wrong
        why: Understanding animals let him listen to the patient.
  items:
  - prompt: What is the name of Doctor Dolittle's parrot?
    options:
    - Polynesia
    - Theodosia
    - Towzer
    - Claribel
    answer: Polynesia
    difficulty: 1
    hints:
    - She teaches him languages.
    - A clever bird.
    solution: His parrot is Polynesia.
    mistakes:
      Theodosia: eng7_read_again
  - prompt: What did Polynesia teach Dolittle?
    options:
    - That animals have their own languages
    - How to cook
    - How to fly
    - How to read maps
    answer: That animals have their own languages
    difficulty: 1
    hints:
    - Bird words.
    - Talking with animals.
    solution: She taught him animal languages.
    mistakes: {"How to cook": "e7_polynesia"}
  - prompt: What did the plough horse need?
    options:
    - Spectacles
    - Pills
    - New shoes
    - A bigger stable
    answer: Spectacles
    difficulty: 2
    hints:
    - He couldn't see well.
    - Green ones.
    solution: The horse needed spectacles, not pills.
    mistakes: {"Pills": "e7_spectacles"}
  - prompt: Why did Dolittle make many different doors in his house?
    options:
    - For different kinds of animals
    - To keep people out
    - For decoration
    - To let in light
    answer: For different kinds of animals
    difficulty: 2
    hints:
    - Horses, cats, mice.
    - Different sizes.
    solution: He built doors for animals of different sizes.
    mistakes: {"To keep people out": "e7_doors"}
  - prompt: Who first suggested that Dolittle become an animal doctor?
    options:
    - The Cat's-food-Man
    - The horse
    - His sister
    - The vet
    answer: The Cat's-food-Man
    difficulty: 2
    hints:
    - A visitor with a stomach ache.
    - He sold food for cats.
    solution: The Cat's-food-Man suggested it.
    mistakes: {"His sister": "e7_cats_meat_man"}
  - prompt: What makes this story funny?
    options:
    - Animals talk and wear glasses
    - It is about a war
    - It is very sad
    - It is a science report
    answer: Animals talk and wear glasses
    difficulty: 1
    hints:
    - Imagine a horse in spectacles.
    - Humour.
    solution: Talking animals and a horse in glasses make it humorous.
    mistakes: {"It is about a war": "e7_dolittle_funny"}
  - prompt: Where did Doctor Dolittle live?
    options:
    - Puddleby
    - Lanfield
    - Rameswaram
    answer: Puddleby
    difficulty: 1
    hints:
    - It is a small English town.
    - Lanfield is in a different story.
    solution: Doctor Dolittle lived in Puddleby.
    mistakes:
      Lanfield: c7e2_events
      Rameswaram: c7e2_events
  - prompt: What colour were the horse's spectacles?
    options:
    - Green
    - Red
    - Black
    answer: Green
    difficulty: 2
    hints:
    - It is the colour of grass.
    - It was a funny detail.
    solution: Dolittle gave the plough horse green spectacles.
    mistakes:
      Red: c7e2_events
      Black: c7e2_events
  - prompt: Why did the other vet fail to help the horse?
    options:
    - He could not understand what the horse needed
    - He was too busy
    - He was afraid of horses
    answer: He could not understand what the horse needed
    difficulty: 2
    hints:
    - The horse knew its own problem.
    - Who could listen to it?
    solution: The other vet treated the wrong problem because he could not talk with the horse.
    mistakes:
      He was too busy: c7e2_why
      He was afraid of horses: c7e2_why
  - prompt: Why did Dolittle build different doors?
    options:
    - Different animals needed different-sized entrances
    - To keep humans out
    - To look fancy
    answer: Different animals needed different-sized entrances
    difficulty: 2
    hints:
    - Think of a mouse and a horse.
    - Each kind of animal had its own.
    solution: Animals of every size came, so he made separate doors for them.
    mistakes:
      To keep humans out: c7e2_why
      To look fancy: c7e2_why
  - prompt: How did Dolittle's fame spread among animals?
    options:
    - Birds told other animals about him
    - Through newspapers
    - Through the radio
    answer: Birds told other animals about him
    difficulty: 2
    hints:
    - They fly everywhere.
    - They talk with many animals.
    solution: Birds carried news of the animal doctor far and wide.
    mistakes:
      Through newspapers: c7e2_events
      Through the radio: c7e2_events
  - prompt: What kind of animal is Polynesia?
    options:
    - A parrot
    - A dog
    - A horse
    answer: A parrot
    difficulty: 1
    hints:
    - It is a bird.
    - It can copy human speech.
    solution: Polynesia is Dolittle's parrot.
    mistakes:
      A dog: c7e2_events
      A horse: c7e2_events
  - prompt: 'The story''s humour mainly comes from:'
    options:
    - Animals behaving like humans
    - A sad ending
    - A frightening ghost
    answer: Animals behaving like humans
    difficulty: 2
    hints:
    - Think of a horse wearing glasses.
    - Animals talk in it.
    solution: Talking animals and a horse with glasses make it funny.
    mistakes:
      A sad ending: c7e2_funny
      A frightening ghost: c7e2_funny
  - prompt: Which quality does Dolittle show most?
    options:
    - Kindness to animals
    - Greed
    - Laziness
    answer: Kindness to animals
    difficulty: 1
    hints:
    - Think of how he treats the horse.
    - He gave up humans for animals.
    solution: Dolittle is gentle and kind to animals.
    mistakes:
      Greed: c7e2_why
      Laziness: c7e2_why
  - prompt: 'Choose the correct question: ''___ the porridge hot yet?'''
    options:
    - Is
    - Are
    - Does
    answer: Is
    difficulty: 1
    hints:
    - '''Porridge'' is one thing.'
    - '''Hot'' is an adjective, so a form of ''be'' is needed.'
    solution: '''Is the porridge hot yet?'' uses ''is'' with a singular noun.'
    mistakes:
      Are: c7e2_grammar
      Does: c7e2_grammar
- code: cbse7e.u2.funnyman
  title: A Funny Man (poem)
  after:
  - cbse7e.u2.dolittle
  notes: |
    A humorous poem (by Natalie Joan). One day a funny man came walking down the street, wearing a shoe on his head
    and hats on his feet; he does everything topsy-turvy (back to front, upside down), which makes people laugh. The
    speaker says that if he came to their house, they would ask him to go away, or at least wish he would. Devices:
    rhyme (street/feet), humour from things being in the wrong place, imagery. Theme: the fun of nonsense and
    imagination.
  explanations:
    text: 'This funny poem describes a man who does everything the wrong way round: a shoe on his head and hats on his feet! It is nonsense verse, meant to make us laugh and enjoy imagination.'
    visual: Picture a man strolling down the street with a shoe balanced on his head and two hats on his feet, while people point and giggle.
    step_by_step: 'Step 1: Find what is upside down or in the wrong place. Step 2: Notice the rhymes (street/feet). Step 3: Ask why it is funny. Step 4: State the theme: fun and imagination.'
    real_world: Children's writers like Sukumar Ray (Abol Tabol) in India wrote nonsense verse that is still loved today.
  picture:
    kind: compare
    columns:
    - title: What is normal
      points:
      - Hat on the head
      - Shoes on the feet
      - Walking forwards
    - title: What the funny man does
      points:
      - Shoe on his head
      - Hats on his feet
      - Everything topsy-turvy
    alt: 'What is normal compared with what the funny man does: a shoe on his head, hats on his feet, everything topsy-turvy.'
  activity:
    type: sort
    prompt: 'A Funny Man: where does he wear it, and what''s wrong?'
    bins:
    - Topsy-turvy
    - Normal
    items:
    - label: A shoe on his head
      bin: Topsy-turvy
      clue: Where should a shoe go?
      why: 'Shoes belong on feet: on the head is topsy-turvy.'
    - label: Hats on his feet
      bin: Topsy-turvy
      clue: Where should a hat go?
      why: Hats belong on heads, so this is upside down.
    - label: A hat on his head
      bin: Normal
      clue: Is that funny?
      why: A hat on the head is normal, so it isn't in the poem's joke.
    - label: Shoes on his feet
      bin: Normal
      clue: Is that funny?
      why: Shoes on feet is normal; the joke is the swap.
    - label: Doing everything back to front
      bin: Topsy-turvy
      clue: The poem's whole idea.
      why: Back to front is topsy-turvy.
  lesson:
    - teach: 'In ''A Funny Man'', a strange man comes walking down the street with a shoe on his head and hats on his feet. Everything about him is topsy-turvy: back to front and upside down.'
      check:
        prompt: What is funny about the man's clothes?
        options:
        - They are in the wrong places
        - They are very expensive
        - They are all new
        answer: They are in the wrong places
        why: A shoe on the head and hats on the feet are mixed up.
    - teach: The poem uses rhyme (street/feet) and pictures in our minds (imagery). Humour comes from surprise, when things are not where we expect. This kind of poem is called nonsense or humorous verse.
      picture:
        kind: compare
        columns:
        - title: Where it should be
          points:
          - shoe on foot
          - hat on head
        - title: The funny man
          points:
          - shoe on head
          - hats on feet
        alt: The funny man swaps where his shoe and hats go.
      check:
        prompt: Which word rhymes with 'head'?
        options:
        - Said
        - Hat
        - Feet
        answer: Said
        why: Head and said end with the same sound.
    - teach: At the end, the speaker says that if the funny man came to their house, they would ask him to go away, or at least wish he would. The ending is a playful twist.
      check:
        prompt: How does the speaker feel about the funny man visiting?
        options:
        - They would rather he went away
        - They would invite him to stay forever
        - They would give him a job
        answer: They would rather he went away
        why: The ending is a light-hearted twist.
  items:
  - prompt: What did the funny man wear on his head?
    options:
    - A shoe
    - A hat
    - A crown
    - A flower
    answer: A shoe
    difficulty: 1
    hints:
    - Wrong place!
    - Not a hat.
    solution: He wore a shoe on his head.
    mistakes: {"A hat": "e7_shoe_head"}
  - prompt: What did he wear on his feet?
    options:
    - Hats
    - Shoes
    - Socks
    - Nothing
    answer: Hats
    difficulty: 1
    hints:
    - Swapped around.
    - Topsy-turvy.
    solution: He wore hats on his feet.
    mistakes: {"Shoes": "e7_hat_feet"}
  - prompt: Which pair of words rhymes in the poem?
    options:
    - street / feet
    - man / head
    - shoe / hat
    - day / man
    answer: street / feet
    difficulty: 2
    hints:
    - Same ending sound.
    - -eet.
    solution: '''Street'' and ''feet'' rhyme.'
    mistakes: {"shoe / hat": "e7_rhyme_pair"}
  - prompt: Why is the poem funny?
    options:
    - Things are in the wrong places
    - It is about a sad event
    - It teaches maths
    - It is very long
    answer: Things are in the wrong places
    difficulty: 1
    hints:
    - Topsy-turvy.
    - Unexpected.
    solution: The humour comes from everything being upside down.
    mistakes: {"It is about a sad event": "e7_wrong_places"}
  - prompt: '''Topsy-turvy'' means:'
    options:
    - Upside down or in confusion
    - Very neat
    - Very tall
    - Very fast
    answer: Upside down or in confusion
    difficulty: 2
    hints:
    - Everything mixed up.
    - Wrong way round.
    solution: Topsy-turvy means upside down or jumbled.
    mistakes:
      Very neat: eng7_poem_meaning
  - prompt: 'This kind of poem is called:'
    options:
    - Nonsense or humorous verse
    - A hymn
    - An epic
    - A news report
    answer: Nonsense or humorous verse
    difficulty: 2
    hints:
    - Meant to amuse.
    - Not realistic.
    solution: It is humorous nonsense verse.
    mistakes: {"An epic": "e7_nonsense"}
  - prompt: '''Topsy-turvy'' is closest in meaning to:'
    options:
    - Mixed up
    - Neat and tidy
    - Very tall
    answer: Mixed up
    difficulty: 1
    hints:
    - Think of the man's clothes.
    - Things are upside down.
    solution: Topsy-turvy means mixed up or upside down.
    mistakes:
      Neat and tidy: c7e2_words
      Very tall: c7e2_words
  - prompt: Where did the funny man come walking?
    options:
    - Down the street
    - Across the sea
    - Into a classroom
    answer: Down the street
    difficulty: 1
    hints:
    - It rhymes with 'feet'.
    - It is outdoors in a town.
    solution: He came walking down the street.
    mistakes:
      Across the sea: c7e2_funny
      Into a classroom: c7e2_funny
  - prompt: 'A picture formed in the reader''s mind by words is called:'
    options:
    - Imagery
    - Rhyme
    - Refrain
    answer: Imagery
    difficulty: 2
    hints:
    - It contains the word 'image'.
    - You can 'see' the man in your mind.
    solution: Imagery uses words to create mental pictures.
    mistakes:
      Rhyme: c7e2_words
      Refrain: c7e2_words
  - prompt: Which is another 'topsy-turvy' idea in the same spirit?
    options:
    - Wearing gloves on your feet
    - Brushing your teeth
    - Eating lunch at noon
    answer: Wearing gloves on your feet
    difficulty: 2
    hints:
    - Something in the wrong place.
    - It should make you laugh.
    solution: Gloves on feet is a mix-up like the funny man's.
    mistakes:
      Brushing your teeth: c7e2_funny
      Eating lunch at noon: c7e2_funny
  - prompt: What is the main purpose of the poem?
    options:
    - To amuse and entertain
    - To teach science
    - To give directions
    answer: To amuse and entertain
    difficulty: 1
    hints:
    - It is a humorous poem.
    - It wants you to smile.
    solution: The poem is written for fun.
    mistakes:
      To teach science: c7e2_funny
      To give directions: c7e2_funny
  - prompt: 'Pick the word that rhymes with ''street'':'
    options:
    - Feet
    - Strong
    - Stair
    answer: Feet
    difficulty: 1
    hints:
    - Listen to the ending sound.
    - It is a body part in the poem.
    solution: Street and feet rhyme.
    mistakes:
      Strong: c7e2_words
      Stair: c7e2_words
  - prompt: Why does the poet use rhyme?
    options:
    - To make the poem musical and fun to read aloud
    - To make it longer
    - To hide the meaning
    answer: To make the poem musical and fun to read aloud
    difficulty: 2
    hints:
    - Read it aloud.
    - Rhyme gives rhythm.
    solution: Rhyme gives the poem a musical, playful sound.
    mistakes:
      To make it longer: c7e2_funny
      To hide the meaning: c7e2_funny
  - prompt: The plural of 'hat' is 'hats'. What is the plural of 'shoe'?
    options:
    - Shoes
    - Shoen
    - Shoeses
    answer: Shoes
    difficulty: 1
    hints:
    - Most nouns add -s.
    - No extra letters are needed.
    solution: Shoe becomes shoes by adding -s.
    mistakes:
      Shoen: c7e2_grammar
      Shoeses: c7e2_grammar
  - prompt: How many hats would the man need for both feet?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - One hat for each foot.
    - Count the feet.
    solution: 'Step 1: one hat per foot. Step 2: 2 feet, so 2 hats.'
    mistakes:
      '1': c7e2_funny
      '4': c7e2_funny
- code: cbse7e.u2.right
  title: Say the Right Thing (play)
  after:
  - cbse7e.u2.funnyman
  notes: |
    A one-act comedy. In Lanfield, Mrs Shaw invites Mrs Harding (wife of a rich newcomer from London) and Mrs Lee
    (Mr Harding's sister) to tea, hoping to make friends. Her daughter Mary insists on staying and promises to talk
    pleasantly, but keeps saying the wrong thing: she praises Mrs Harding's 'beautiful children' (she has none),
    mocks a man who goes to London every day (Mr Harding does), laughs at a woman in a blue dress and red coat (what
    Mrs Harding is wearing), and insults a dirty dog (the Hardings' dog Towzer). Each time there is an awkward
    silence. At last, as the guests leave, Mary says 'Must you stay? Can't you go?' Theme: think before you speak;
    tact and kindness in conversation.
  explanations:
    text: Mary tries to help her mother entertain two important guests, but every time she speaks she says exactly the wrong thing, criticising things that turn out to belong to the guests. The play is funny, but it teaches us to think before we speak.
    visual: Picture a tea table with three ladies, and a girl chattering away while the guests' smiles freeze and her mother covers her face.
    step_by_step: 'Step 1: The situation: Mrs Shaw wants to impress the guests. Step 2: Mary''s promise to talk nicely. Step 3: Each blunder and the silence after it. Step 4: The final mix-up: ''Must you stay? Can''t you go?'' Step 5: The lesson: think before you speak.'
    real_world: 'Before commenting on someone''s clothes or home, it helps to ask: is it kind, is it true, is it needed?'
  picture:
    kind: flow
    steps:
    - Mrs Shaw invites Mrs Harding and Mrs Lee
    - Mary promises to say the right thing
    - She criticises things that belong to the guests
    - Awkward silences follow each blunder
    - '''Must you stay? Can''t you go?'''
    alt: 'The play in five steps: the invitation, Mary''s promise, her blunders about the guests'' own things, the awkward silences, and her final mix-up.'
  activity:
    type: sort
    prompt: 'Say the Right Thing: what did Mary say, and why was it wrong?'
    bins:
    - About Mr Harding
    - About Mrs Harding
    - About their dog
    items:
    - label: A man who goes to London every day
      bin: About Mr Harding
      clue: Who travels to London daily?
      why: Mr Harding goes to London every day, so Mary mocked him.
    - label: Blue dress with a red coat looks silly
      bin: About Mrs Harding
      clue: What is the guest wearing?
      why: Mrs Harding is wearing exactly that.
    - label: Your beautiful children
      bin: About Mrs Harding
      clue: Does she have any?
      why: Mrs Harding has no children.
    - label: A dirty, ugly dog
      bin: About their dog
      clue: Towzer.
      why: The dog Mary insulted is the Hardings' Towzer.
  lesson:
    - teach: In 'Say the Right Thing', Mrs Shaw invites two newcomers, Mrs Harding and Mrs Lee, to tea, hoping to make friends. Her daughter Mary promises to talk nicely and is allowed to stay.
      check:
        prompt: What did Mary promise before the guests came?
        options:
        - To talk pleasantly
        - To stay silent
        - To leave the room
        answer: To talk pleasantly
        why: She wanted to stay, so she promised to be nice.
    - teach: But Mary keeps saying the wrong thing. She praises Mrs Harding's 'beautiful children' (she has none); mocks a man who goes to London every day (Mr Harding does); laughs at a woman in a blue dress and red coat (what Mrs Harding is wearing); and insults a dirty dog (the Hardings' Towzer). Each time there is an awkward silence.
      picture:
        kind: compare
        columns:
        - title: What Mary said
          points:
          - praised her children
          - mocked a man who goes to London daily
