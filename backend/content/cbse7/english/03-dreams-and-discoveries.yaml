# CBSE Class 7 English (NCERT Poorvi, 2024-25), unit 3: three chapters. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse7-eng
chapter: 3
title: 'Dreams and Discoveries: My Brother''s Great Invention · Paper Boats · North, South, East, West'
concepts:
- code: cbse7e.u3.invention
  title: My Brother's Great Invention (Anita Rau Badami)
  notes: |
    Narrated by Anita (14) about her younger brother Anand (13), who thinks he is a great scientist. His burglar alarm,
    built after thefts in their colony, soaks Papa with water instead. Inspired by the film 'Back to the Future', he
    builds a 'time machine' in his room from wires, levers and bulbs; his parents forbid him to test it and go to
    Kharagpur. One night Anita hears noises: Boppa, the sweeper, is breaking in. Anand tricks him into the room with
    the machine; there are crashes and humming, and Boppa vanishes, leaving only his green scarf. Neighbours search
    but find nothing; Anand insists the machine sent Boppa into the past. Papa dismantles it, and Anand starts a new
    project to contact aliens. Themes: imagination, persistence, humour, mystery.
  explanations:
    text: Anand, a boy who loves inventing, builds a burglar alarm that soaks his own father and then a 'time machine'. When a thief breaks in while their parents are away, Anand lures him into the room with the machine, and the thief mysteriously vanishes. Did the time machine work? No one knows!
    visual: Picture a boy's bedroom full of wires, blinking bulbs and levers, a green scarf lying on the floor, and a puzzled crowd of neighbours peering in.
    step_by_step: 'Step 1: Meet Anand, the inventor. Step 2: The burglar alarm that went wrong. Step 3: The time machine. Step 4: The night of the burglary. Step 5: The mystery of Boppa''s disappearance.'
    real_world: Many real inventors' first experiments failed or went funnily wrong; persistence is what made them inventors.
  picture:
    kind: flow
    steps:
    - Anand's burglar alarm soaks Papa
    - He builds a time machine
    - Parents go to Kharagpur
    - Boppa breaks in and is tricked into the room
    - Boppa vanishes, leaving his green scarf
    alt: 'The story in five steps: the failed burglar alarm, the time machine, the parents leaving, the burglar tricked into the room, and his mysterious disappearance.'
  activity:
    type: order
    prompt: 'My Brother''s Great Invention: put the events in order.'
    steps:
    - Anand's burglar alarm soaks Papa
    - He builds a time machine after a film
    - Parents forbid testing it and leave
    - Boppa breaks in at night
    - Boppa vanishes, leaving his green scarf
    - Papa dismantles the machine
    reasons:
      He builds a time machine after a film: '''Back to the Future'' gives him a new idea.'
      Parents forbid testing it and leave: They go to Kharagpur.
      Boppa breaks in at night: With the parents away, a thief comes.
      Boppa vanishes, leaving his green scarf: Anand leads him into the machine room.
      Papa dismantles the machine: The parents return and end the experiment.
  items:
  - prompt: Who narrates the story?
    options:
    - Anita, Anand's sister
    - Anand
    - Papa
    - Boppa
    answer: Anita, Anand's sister
    difficulty: 1
    hints:
    - '''My brother''s…'''
    - The older sister.
    solution: Anita tells the story about her brother.
    mistakes:
      Anand: eng7_read_again
  - prompt: What went wrong with Anand's burglar alarm?
    options:
    - It soaked Papa with water
    - It caught a thief
    - It played music
    - It exploded
    answer: It soaked Papa with water
    difficulty: 1
    hints:
    - A water bag fell.
    - The wrong person.
    solution: It soaked Papa when he opened the door.
  - prompt: Which film inspired the time machine?
    options:
    - Back to the Future
    - Star Wars
    - Jurassic Park
    - Toy Story
    answer: Back to the Future
    difficulty: 2
    hints:
    - About time travel.
    - A car that travels in time.
    solution: '''Back to the Future'' inspired him.'
  - prompt: What was left behind when Boppa disappeared?
    options:
    - His green scarf
    - His shoes
    - A note
    - His bicycle
    answer: His green scarf
    difficulty: 2
    hints:
    - Something he wore.
    - Green.
    solution: Only his green scarf remained.
  - prompt: Anita is 14 and Anand is 13. How many years older is Anita?
    answer: '1'
    check: 14 - 13
    difficulty: 1
    hints:
    - Subtract.
    - 14 − 13.
    solution: 14 − 13 = 1 year.
  - prompt: What does Anand start working on at the end?
    options:
    - A device to contact aliens
    - A new bicycle
    - A cooking robot
    - Nothing; he gives up
    answer: A device to contact aliens
    difficulty: 2
    hints:
    - He never stops inventing.
    - Outer space.
    solution: He begins a device to contact extraterrestrials.
    mistakes:
      Nothing; he gives up: eng7_whole_story
- code: cbse7e.u3.boats
  title: Paper Boats (Rabindranath Tagore)
  after:
  - cbse7e.u3.invention
  notes: |
    A poem by Rabindranath Tagore. Day by day a child floats paper boats down a running stream, writing his name and
    the name of his village on them in big black letters, hoping someone in a strange land will find them and know who
    he is. He loads them with shiuli flowers from the garden, hoping the blooms reach land safely in the night. He
    imagines the clouds as little white boats racing with his. At night he dreams his boats float on under the
    midnight stars, carried by fairies of sleep, with baskets full of dreams. Themes: imagination, the wish to connect
    with others, childhood wonder.
  explanations:
    text: A child floats paper boats down a stream every day, writing his name and village on them in the hope that someone far away will find them. He fills them with flowers and dreams of them sailing on at night, carried by the fairies of sleep.
    visual: Picture a child at a stream's edge launching a little paper boat with his name written in big black letters, flowers inside, and white clouds above like boats racing along.
    step_by_step: 'Step 1: What the child does: floats paper boats. Step 2: Why he writes his name and village: to be known by a stranger far away. Step 3: The flowers and the clouds. Step 4: The dream at night. Step 5: The theme: imagination and connection.'
    real_world: People sometimes send messages in bottles across the sea; Tagore's child does the same with paper boats.
  picture:
    kind: flow
    steps:
    - He floats paper boats down the stream
    - He writes his name and village on them
    - He loads them with shiuli flowers
    - He imagines clouds as boats racing
    - He dreams fairies carry them at night
    alt: 'The poem in five steps: floating paper boats, writing his name, loading flowers, imagining cloud-boats, and dreaming of fairies carrying them.'
  activity:
    type: sort
    prompt: 'Paper Boats: real or imagined?'
    bins:
    - What the child does
    - What he imagines
    items:
    - label: Writes his name in big black letters
      bin: What the child does
      clue: He really writes it.
      why: Writing his name on the boat is something he actually does.
    - label: Loads them with shiuli flowers
      bin: What the child does
      clue: From his garden.
      why: He really puts flowers in the boats.
    - label: Clouds as white boats racing
      bin: What he imagines
      clue: Clouds aren't boats.
      why: Seeing clouds as boats is his imagination.
    - label: Fairies of sleep carry the boats
      bin: What he imagines
      clue: In his dream.
      why: The fairies are in his dream.
    - label: Floats them down the stream
      bin: What the child does
      clue: Day by day.
      why: He really sets them afloat.
  items:
  - prompt: Who wrote 'Paper Boats'?
    options:
    - Rabindranath Tagore
    - Edna St. Vincent Millay
    - Natalie Joan
    - Helen Keller
    answer: Rabindranath Tagore
    difficulty: 1
    hints:
    - Wrote India's national anthem.
    - Nobel Prize winner.
    solution: The poem is by Rabindranath Tagore.
  - prompt: What does the child write on his boats?
    options:
    - His name and his village's name
    - A secret code
    - A shopping list
    - Nothing
    answer: His name and his village's name
    difficulty: 1
    hints:
    - In big black letters.
    - So someone knows who he is.
    solution: He writes his name and village on them.
  - prompt: Why does he write his name on the boats?
    options:
    - He hopes someone in a strange land will find them and know him
    - To sell them
    - His teacher told him
    - To win a race
    answer: He hopes someone in a strange land will find them and know him
    difficulty: 2
    hints:
    - Wish to connect.
    - Far away.
    solution: He wants a stranger far away to know who he is.
  - prompt: What does he load his boats with?
    options:
    - Shiuli flowers
    - Sweets
    - Stones
    - Coins
    answer: Shiuli flowers
    difficulty: 2
    hints:
    - From his garden.
    - Night-flowering jasmine.
    solution: He loads them with shiuli flowers.
  - prompt: What does the child imagine the clouds to be?
    options:
    - Little white boats racing with his
    - Giant birds
    - Cotton fields
    - Mountains
    answer: Little white boats racing with his
    difficulty: 2
    hints:
    - Look up at the sky.
    - Boats.
    solution: He imagines the clouds as white boats.
    mistakes:
      Giant birds: eng7_poem_meaning
  - prompt: Which theme fits the poem best?
    options:
    - A child's imagination and wish to connect with others
    - The dangers of rivers
    - How to build ships
    - Farming
    answer: A child's imagination and wish to connect with others
    difficulty: 2
    hints:
    - Dreams and strangers.
    - Imagination.
    solution: It celebrates imagination and the wish to reach others.
- code: cbse7e.u3.nsew
  title: North, South, East, West
  after:
  - cbse7e.u3.boats
  notes: |
    Written as postcards from Shaana, a girl from Rameswaram island, to her classmates as she travels around India with
    her parents. North: snowball fights at Thajiwas Glacier in Kashmir (less snow than before); quiet Himachal
    mountains. North-east: a treehouse in Arunachal Pradesh, hoping to see red pandas. East: mangroves, crocodiles and
    snakes in the Sundarbans. West: the hot desert and colourful clothes of Gujarat. Centre: river rafting on the
    Narmada (less water than before; her father is scared). South-west: Goa's beaches; she overcomes her fear of
    train tunnels. South: surfing in Chennai and Puducherry; crossing the Pamban Bridge over the sea home to
    Rameswaram. Themes: India's diversity, environmental change, adventure, growing confidence.
  explanations:
    text: 'Shaana, a girl from Rameswaram, sends postcards to her class as she travels round India: glaciers in Kashmir, a treehouse in Arunachal, mangroves in the Sundarbans, desert in Gujarat, rafting on the Narmada, beaches in Goa, surfing in Chennai. She also notices signs of environmental change.'
    visual: 'Draw a map of India with postcards pinned at each stop: a snowball in Kashmir, a red panda in Arunachal, a crocodile in the Sundarbans, a camel in Gujarat, a raft on the Narmada, a train tunnel in Goa, a surfboard in Chennai, and home at Rameswaram.'
    step_by_step: 'Step 1: Note the form: postcards. Step 2: Trace the journey by direction. Step 3: For each place, note what she saw or did. Step 4: Notice the environmental warnings (less snow, less water). Step 5: Notice how she grows (fear of tunnels).'
    real_world: The Pamban Bridge, which Shaana's train crosses, links Rameswaram island to the mainland over the sea.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Thajiwas Glacier, Kashmir
      - Arunachal Pradesh
      - Sundarbans
      - Narmada River
      - Goa
    - title: What Shaana did or saw
      points:
      - Snowball fights; less snow than before
      - Treehouse; hoping for red pandas
      - Mangroves, crocodiles
      - Rafting; less water than before
      - Beat her fear of tunnels
    alt: Places Shaana visited and what she did or saw at each, from Kashmir's glacier to Goa's tunnels.
  activity:
    type: sort
    prompt: 'North, South, East, West: where was Shaana?'
    bins:
    - North
    - East
    - West
    - South
    items:
    - label: Snowball fights at Thajiwas Glacier
      bin: North
      clue: Kashmir.
      why: Kashmir is in the north.
    - label: Mangroves and crocodiles
      bin: East
      clue: The Sundarbans.
      why: The Sundarbans are in the east.
    - label: Hot desert and colourful clothes
      bin: West
      clue: Gujarat.
      why: Gujarat is in the west.
    - label: Surfing near Puducherry
      bin: South
      clue: Bay of Bengal coast.
      why: Chennai and Puducherry are in the south.
    - label: Pamban Bridge home to Rameswaram
      bin: South
      clue: Her island home.
      why: Rameswaram is in the far south.
  items:
  - prompt: In what form is this chapter written?
    options:
    - Postcards
    - A diary
    - A play
    - A poem
    answer: Postcards
    difficulty: 1
    hints:
    - Sent to classmates.
    - Short messages from each place.
    solution: It is a series of postcards.
    mistakes:
      A diary: eng7_read_again
  - prompt: Where is Shaana's home?
    options:
    - Rameswaram
    - Kashmir
    - Goa
    - Kolkata
    answer: Rameswaram
    difficulty: 1
    hints:
    - An island.
    - In Tamil Nadu.
    solution: She lives on Rameswaram island.
  - prompt: Where did Shaana have snowball fights?
    options:
    - Thajiwas Glacier, Kashmir
    - Goa
    - The Sundarbans
    - Gujarat
    answer: Thajiwas Glacier, Kashmir
    difficulty: 1
    hints:
    - Snow!
    - North.
    solution: At Thajiwas Glacier in Kashmir.
  - prompt: Which fear did Shaana overcome on her journey?
    options:
    - Fear of train tunnels
    - Fear of snow
    - Fear of dogs
    - Fear of water
    answer: Fear of train tunnels
    difficulty: 2
    hints:
    - On the way through Goa.
    - Dark passages.
    solution: She overcame her fear of tunnels.
  - prompt: What environmental change did Shaana notice?
    options:
    - Less snow on the glacier and less water in the river
    - More forests everywhere
    - Colder deserts
    - Bigger glaciers
    answer: Less snow on the glacier and less water in the river
    difficulty: 2
    hints:
    - Kashmir and the Narmada.
    - Warning signs.
    solution: She noticed less snow and less river water than before.
  - prompt: Which bridge does her train cross over the sea to reach home?
    options:
    - Pamban Bridge
    - Howrah Bridge
    - Bandra-Worli Sea Link
    - Vidyasagar Setu
    answer: Pamban Bridge
    difficulty: 2
    hints:
