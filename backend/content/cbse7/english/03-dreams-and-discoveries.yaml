# CBSE Class 7 English (NCERT Poorvi, 2024-25), unit 3: three chapters. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse7-eng
chapter: 3
title: 'Dreams and Discoveries: My Brother''s Great Invention · Paper Boats · North, South, East, West'
tips:
  e7_age_diff: "'How many years older' means subtract the ages, not add them."
  e7_alarm: "The alarm went off on the wrong person, someone in the family."
  e7_back_future: "The film is about travelling to the past in a car."
  e7_boat_name: "The child wants a stranger to know who sent the boat and from where."
  e7_boat_why: "He floats them away to faraway places. What does he hope will happen there?"
  e7_boats_theme: "The child dreams of reaching people far away through his boats."
  e7_climate: "Warming melts ice. What would Shaana see at the glacier and river?"
  e7_pamban: "Howrah Bridge is over a river in Kolkata. Shaana's island home in Tamil Nadu needs a sea bridge."
  e7_scarf: "Boppa left something he wore around his neck."
  e7_shaana_home: "Shaana travels from the far south, near a famous temple island."
  e7_shiuli: "Stones would sink a paper boat. He loads them with flowers from his garden."
  e7_tagore: "The poem is by a Bengali poet who won the Nobel Prize."
  e7_thajiwas: "Snowball fights need snow. Which place in the north has a glacier?"
  e7_tunnels: "Shaana enjoyed the snow. Something on the train ride scared her, dark and long."
  c7e3_events: 'Retell the story in order: the failed gadget, the film that inspires a big project, the night-time noise, the disappearance, and what happens to the machine.'
  c7e3_why: Ask what the character hoped would happen, and why they acted that way.
  c7e3_poem: 'Picture the child at the stream: what he writes, what he loads, what he imagines in the sky and in his dreams.'
  c7e3_trip: 'Follow the journey on a map of India: north, north-east, east, west, centre, south-west, south, then back home across the sea.'
  c7e3_change: Look for things that are smaller or fewer than they used to be, and think about why.
  c7e3_words: Put each choice into the sentence and read it again. The right word keeps the meaning.
  c7e3_grammar: Check the subject and the time of the action, then pick the form that fits.

concepts:
- code: cbse7e.u3.invention
  title: My Brother's Great Invention (Anita Rau Badami)
  notes: |
    Narrated by Anita (14) about her younger brother Anand (13), who thinks he is a great scientist. His burglar alarm,
    built after thefts in their colony, soaks Papa with water instead. Inspired by the film 'Back to the Future', he
    builds a 'time machine' in his room from wires, levers and bulbs; his parents forbid him to test it and go to
    Kharagpur. One night Anita hears noises: Boppa, the sweeper, is breaking in. Anand tricks him into the room with
    the machine; there are crashes and humming, and Boppa vanishes, leaving only his green scarf. Neighbours search
    but find nothing; Anand insists the machine sent Boppa into the past. Papa dismantles it, and Anand starts a new
    project to contact aliens. Themes: imagination, persistence, humour, mystery.
  explanations:
    text: Anand, a boy who loves inventing, builds a burglar alarm that soaks his own father and then a 'time machine'. When a thief breaks in while their parents are away, Anand lures him into the room with the machine, and the thief mysteriously vanishes. Did the time machine work? No one knows!
    visual: Picture a boy's bedroom full of wires, blinking bulbs and levers, a green scarf lying on the floor, and a puzzled crowd of neighbours peering in.
    step_by_step: 'Step 1: Meet Anand, the inventor. Step 2: The burglar alarm that went wrong. Step 3: The time machine. Step 4: The night of the burglary. Step 5: The mystery of Boppa''s disappearance.'
    real_world: Many real inventors' first experiments failed or went funnily wrong; persistence is what made them inventors.
  picture:
    kind: flow
    steps:
    - Anand's burglar alarm soaks Papa
    - He builds a time machine
    - Parents go to Kharagpur
    - Boppa breaks in and is tricked into the room
    - Boppa vanishes, leaving his green scarf
    alt: 'The story in five steps: the failed burglar alarm, the time machine, the parents leaving, the burglar tricked into the room, and his mysterious disappearance.'
  activity:
    type: order
    prompt: 'My Brother''s Great Invention: put the events in order.'
    steps:
    - Anand's burglar alarm soaks Papa
    - He builds a time machine after a film
    - Parents forbid testing it and leave
    - Boppa breaks in at night
    - Boppa vanishes, leaving his green scarf
    - Papa dismantles the machine
    reasons:
      He builds a time machine after a film: '''Back to the Future'' gives him a new idea.'
      Parents forbid testing it and leave: They go to Kharagpur.
      Boppa breaks in at night: With the parents away, a thief comes.
      Boppa vanishes, leaving his green scarf: Anand leads him into the machine room.
      Papa dismantles the machine: The parents return and end the experiment.
  lesson:
    - teach: The story is told by Anita, 14, about her brother Anand, 13, who believes he is a great scientist. After thefts in their colony, he builds a burglar alarm, but it soaks Papa with water instead of catching a thief.
      check:
        prompt: Who is the 'I' telling this story?
        options:
        - Anita, the sister
        - Anand, the inventor
        - Papa
        answer: Anita, the sister
        why: The story is narrated by Anand's sister.
    - teach: Inspired by the film 'Back to the Future', Anand builds a 'time machine' from wires, levers and bulbs. His parents forbid him to test it and leave for Kharagpur.
      check:
        prompt: Why did Anand build a time machine?
        options:
        - A film inspired him
        - His teacher asked him
        - To catch fish
        answer: A film inspired him
        why: He saw 'Back to the Future'.
    - teach: One night Boppa, the sweeper, breaks in. Anand tricks him into the room with the machine; there are crashes and humming, and Boppa vanishes, leaving only his green scarf. Anand insists he was sent into the past. Papa dismantles the machine; Anand starts on a device to contact aliens. The ending stays a mystery.
      picture:
        kind: flow
        steps:
        - Burglar alarm soaks Papa
        - Time machine built after a film
        - Parents go to Kharagpur
        - Boppa breaks in and vanishes
        - Papa dismantles the machine
        - 'New project: contact aliens'
        alt: Events of the story in order.
      check:
        prompt: What clue was left behind after Boppa disappeared?
        options:
        - His green scarf
        - A broom
        - A letter
        answer: His green scarf
        why: Only the scarf remained.
  items:
  - prompt: Who narrates the story?
    options:
    - Anita, Anand's sister
    - Anand
    - Papa
    - Boppa
    answer: Anita, Anand's sister
    difficulty: 1
    hints:
    - '''My brother''s…'''
    - The older sister.
    solution: Anita tells the story about her brother.
    mistakes:
      Anand: eng7_read_again
  - prompt: What went wrong with Anand's burglar alarm?
    options:
    - It soaked Papa with water
    - It caught a thief
    - It played music
    - It exploded
    answer: It soaked Papa with water
    difficulty: 1
    hints:
    - A water bag fell.
    - The wrong person.
    solution: It soaked Papa when he opened the door.
    mistakes: {"It caught a thief": "e7_alarm"}
  - prompt: Which film inspired the time machine?
    options:
    - Back to the Future
    - Star Wars
    - Jurassic Park
    - Toy Story
    answer: Back to the Future
    difficulty: 2
    hints:
    - About time travel.
    - A car that travels in time.
    solution: '''Back to the Future'' inspired him.'
    mistakes: {"Star Wars": "e7_back_future"}
  - prompt: What was left behind when Boppa disappeared?
    options:
    - His green scarf
    - His shoes
    - A note
    - His bicycle
    answer: His green scarf
    difficulty: 2
    hints:
    - Something he wore.
    - Green.
    solution: Only his green scarf remained.
    mistakes: {"A note": "e7_scarf"}
  - prompt: Anita is 14 and Anand is 13. How many years older is Anita?
    answer: '1'
    check: 14 - 13
    difficulty: 1
    hints:
    - Subtract.
    - 14 − 13.
    solution: 14 − 13 = 1 year.
    mistakes: {"27": "e7_age_diff"}
  - prompt: What does Anand start working on at the end?
    options:
    - A device to contact aliens
    - A new bicycle
    - A cooking robot
    - Nothing; he gives up
    answer: A device to contact aliens
    difficulty: 2
    hints:
    - He never stops inventing.
    - Outer space.
    solution: He begins a device to contact extraterrestrials.
    mistakes:
      Nothing; he gives up: eng7_whole_story
  - prompt: Where did the parents go, leaving the children at home?
    options:
    - Kharagpur
    - Kashmir
    - London
    answer: Kharagpur
    difficulty: 2
    hints:
    - It is a town in West Bengal.
    - It is famous for an IIT.
    solution: The parents went to Kharagpur.
    mistakes:
      Kashmir: c7e3_events
      London: c7e3_events
  - prompt: Who was Boppa?
    options:
    - The sweeper
    - Anand's teacher
    - A neighbour's dog
    answer: The sweeper
    difficulty: 1
    hints:
    - He worked in the colony.
    - He broke in at night.
    solution: Boppa was the sweeper who tried to burgle the house.
    mistakes:
      Anand's teacher: c7e3_events
      A neighbour's dog: c7e3_events
  - prompt: Why did Anand build a burglar alarm first?
    options:
    - There had been thefts in the colony
    - He wanted to wake Papa
    - For a school prize
    answer: There had been thefts in the colony
    difficulty: 2
    hints:
    - Something was happening in the neighbourhood.
    - He wanted to catch a thief.
    solution: Thefts in the colony made him build an alarm.
    mistakes:
      He wanted to wake Papa: c7e3_why
      For a school prize: c7e3_why
  - prompt: Why did Papa dismantle the time machine?
    options:
    - He was worried about what happened
    - He wanted to sell it
    - It was too small
    answer: He was worried about what happened
    difficulty: 2
    hints:
    - A man had vanished.
    - Parents protect children.
    solution: After Boppa's disappearance, Papa took the machine apart to be safe.
    mistakes:
      He wanted to sell it: c7e3_why
      It was too small: c7e3_why
  - prompt: Which word best describes Anand?
    options:
    - Imaginative
    - Lazy
    - Shy
    answer: Imaginative
    difficulty: 1
    hints:
    - Think of the time machine.
    - He dreams up new inventions.
    solution: Anand is full of imagination and ideas.
    mistakes:
      Lazy: c7e3_why
      Shy: c7e3_why
  - prompt: 'The ending leaves us unsure what really happened. This makes it a:'
    options:
    - Mystery
    - Recipe
    - News report
    answer: Mystery
    difficulty: 2
    hints:
    - Nobody knows where Boppa went.
    - Readers must guess.
    solution: The unexplained disappearance makes the story a mystery.
    mistakes:
      Recipe: c7e3_words
      News report: c7e3_words
  - prompt: '''Dismantle'' means to:'
    options:
    - Take apart
    - Build up
    - Paint
    answer: Take apart
    difficulty: 2
    hints:
    - '''Dis-'' often means the opposite.'
    - Papa did it to the machine.
    solution: To dismantle is to take something apart.
    mistakes:
      Build up: c7e3_words
      Paint: c7e3_words
  - prompt: Anand is 13 now. How old will he be in 5 years?
    answer: '18'
    check: 13+5
    difficulty: 1
    hints:
    - Add the years.
    - 13 plus 5.
    solution: 'Step 1: 13 + 5. Step 2: = 18 years.'
    mistakes:
      '8': c7e3_events
      '65': c7e3_events
  - prompt: 'Choose the correct verb: ''Anand ___ a new project every month.'''
    options:
    - starts
    - start
    - starting
    answer: starts
    difficulty: 1
    hints:
    - Anand is one person (he).
    - Present simple adds -s for he/she/it.
    solution: 'With ''he'', present simple verbs take -s: ''starts''.'
    mistakes:
      start: c7e3_grammar
      starting: c7e3_grammar
- code: cbse7e.u3.boats
  title: Paper Boats (Rabindranath Tagore)
  after:
  - cbse7e.u3.invention
  notes: |
    A poem by Rabindranath Tagore. Day by day a child floats paper boats down a running stream, writing his name and
    the name of his village on them in big black letters, hoping someone in a strange land will find them and know who
    he is. He loads them with shiuli flowers from the garden, hoping the blooms reach land safely in the night. He
    imagines the clouds as little white boats racing with his. At night he dreams his boats float on under the
    midnight stars, carried by fairies of sleep, with baskets full of dreams. Themes: imagination, the wish to connect
    with others, childhood wonder.
  explanations:
    text: A child floats paper boats down a stream every day, writing his name and village on them in the hope that someone far away will find them. He fills them with flowers and dreams of them sailing on at night, carried by the fairies of sleep.
    visual: Picture a child at a stream's edge launching a little paper boat with his name written in big black letters, flowers inside, and white clouds above like boats racing along.
    step_by_step: 'Step 1: What the child does: floats paper boats. Step 2: Why he writes his name and village: to be known by a stranger far away. Step 3: The flowers and the clouds. Step 4: The dream at night. Step 5: The theme: imagination and connection.'
    real_world: People sometimes send messages in bottles across the sea; Tagore's child does the same with paper boats.
  picture:
    kind: flow
    steps:
    - He floats paper boats down the stream
    - He writes his name and village on them
    - He loads them with shiuli flowers
    - He imagines clouds as boats racing
    - He dreams fairies carry them at night
    alt: 'The poem in five steps: floating paper boats, writing his name, loading flowers, imagining cloud-boats, and dreaming of fairies carrying them.'
  activity:
    type: sort
    prompt: 'Paper Boats: real or imagined?'
    bins:
    - What the child does
    - What he imagines
    items:
    - label: Writes his name in big black letters
      bin: What the child does
      clue: He really writes it.
      why: Writing his name on the boat is something he actually does.
    - label: Loads them with shiuli flowers
      bin: What the child does
      clue: From his garden.
      why: He really puts flowers in the boats.
    - label: Clouds as white boats racing
      bin: What he imagines
      clue: Clouds aren't boats.
      why: Seeing clouds as boats is his imagination.
    - label: Fairies of sleep carry the boats
      bin: What he imagines
      clue: In his dream.
      why: The fairies are in his dream.
    - label: Floats them down the stream
      bin: What the child does
      clue: Day by day.
      why: He really sets them afloat.
  lesson:
    - teach: In Tagore's 'Paper Boats', a child floats paper boats down a stream every day. He writes his name and his village's name on them in big black letters, hoping someone in a strange land will find them and know who he is.
      check:
        prompt: What does the child hope will happen to his boats?
        options:
        - Someone far away will find them
        - They will sink quickly
        - His teacher will see them
        answer: Someone far away will find them
        why: He wants to connect with a stranger.
    - teach: He loads the boats with shiuli flowers from his garden, hoping they will reach land safely in the night. He imagines the clouds as little white boats racing with his.
      picture:
        kind: compare
        columns:
        - title: Real
          points:
          - paper boats
          - shiuli flowers
          - clouds
        - title: Imagined
          points:
          - travel to strange lands
          - reach land safely at night
          - white boats racing
        alt: What is real and what the child imagines.
      check:
        prompt: 'Comparing clouds to boats is an example of:'
        options:
        - Imagination and imagery
        - A news report
        - A recipe
        answer: Imagination and imagery
        why: The child pictures clouds as boats.
    - teach: At night he dreams his boats float on under the stars, carried by the fairies of sleep with baskets full of dreams. The poem is about a child's imagination and his wish to reach out to others.
      check:
        prompt: Who carries the boats in his dream?
        options:
        - The fairies of sleep
        - Fishermen
        - His father
        answer: The fairies of sleep
        why: In his dream, sleep-fairies sail them.
  items:
  - prompt: Who wrote 'Paper Boats'?
    options:
    - Rabindranath Tagore
    - Edna St. Vincent Millay
    - Natalie Joan
    - Helen Keller
    answer: Rabindranath Tagore
    difficulty: 1
    hints:
    - Wrote India's national anthem.
    - Nobel Prize winner.
    solution: The poem is by Rabindranath Tagore.
    mistakes: {"Helen Keller": "e7_tagore"}
  - prompt: What does the child write on his boats?
    options:
    - His name and his village's name
    - A secret code
    - A shopping list
    - Nothing
    answer: His name and his village's name
    difficulty: 1
    hints:
    - In big black letters.
    - So someone knows who he is.
    solution: He writes his name and village on them.
    mistakes: {"A secret code": "e7_boat_name"}
  - prompt: Why does he write his name on the boats?
    options:
    - He hopes someone in a strange land will find them and know him
    - To sell them
    - His teacher told him
    - To win a race
    answer: He hopes someone in a strange land will find them and know him
    difficulty: 2
    hints:
    - Wish to connect.
    - Far away.
    solution: He wants a stranger far away to know who he is.
    mistakes: {"To sell them": "e7_boat_why"}
  - prompt: What does he load his boats with?
    options:
    - Shiuli flowers
    - Sweets
    - Stones
    - Coins
    answer: Shiuli flowers
    difficulty: 2
    hints:
    - From his garden.
    - Night-flowering jasmine.
    solution: He loads them with shiuli flowers.
    mistakes: {"Stones": "e7_shiuli"}
  - prompt: What does the child imagine the clouds to be?
    options:
    - Little white boats racing with his
    - Giant birds
    - Cotton fields
    - Mountains
    answer: Little white boats racing with his
    difficulty: 2
    hints:
    - Look up at the sky.
    - Boats.
    solution: He imagines the clouds as white boats.
    mistakes:
      Giant birds: eng7_poem_meaning
  - prompt: Which theme fits the poem best?
    options:
    - A child's imagination and wish to connect with others
    - The dangers of rivers
    - How to build ships
    - Farming
    answer: A child's imagination and wish to connect with others
    difficulty: 2
    hints:
    - Dreams and strangers.
    - Imagination.
    solution: It celebrates imagination and the wish to reach others.
    mistakes: {"How to build ships": "e7_boats_theme"}
  - prompt: In what colour letters does the child write on his boats?
    options:
    - Big black letters
    - Small red letters
    - Golden letters
    answer: Big black letters
    difficulty: 2
    hints:
    - He wants them to be easy to read.
    - The colour is dark.
    solution: He writes his name in big black letters.
    mistakes:
      Small red letters: c7e3_poem
      Golden letters: c7e3_poem
  - prompt: Where does the child float his boats?
    options:
    - In a running stream
    - In the ocean
    - In a bathtub
    answer: In a running stream
    difficulty: 1
    hints:
    - Moving water near his home.
    - It flows away.
    solution: He floats them in a running stream.
    mistakes:
      In the ocean: c7e3_poem
      In a bathtub: c7e3_poem
  - prompt: Where do the shiuli flowers come from?
    options:
    - His garden
    - A shop
    - The forest
    answer: His garden
    difficulty: 1
    hints:
    - They grow at his home.
    - He picks them himself.
    solution: He loads his boats with shiuli flowers from his garden.
    mistakes:
      A shop: c7e3_poem
      The forest: c7e3_poem
  - prompt: Which feeling does the poem mostly show?
    options:
    - Hope and wonder
    - Anger
    - Fear
    answer: Hope and wonder
    difficulty: 2
    hints:
    - He hopes for a stranger to find his boats.
    - He dreams happily.
    solution: The child is full of hope and wonder.
    mistakes:
      Anger: c7e3_why
      Fear: c7e3_why
  - prompt: What does 'strange land' mean in the poem?
    options:
    - A far-off, unknown place
    - A scary land
    - A land with odd people
    answer: A far-off, unknown place
    difficulty: 2
    hints:
    - '''Strange'' here means not known to him.'
    - It is far away.
    solution: '''Strange land'' means an unfamiliar faraway place.'
    mistakes:
      A scary land: c7e3_words
      A land with odd people: c7e3_words
  - prompt: Why does he float boats every day?
    options:
    - He keeps hoping one will reach someone
    - His teacher told him to
    - To clean the stream
    answer: He keeps hoping one will reach someone
    difficulty: 2
    hints:
    - Think of his wish.
    - One day someone might find one.
    solution: He keeps trying, hoping a boat will carry his message to someone.
    mistakes:
      His teacher told him to: c7e3_why
      To clean the stream: c7e3_why
  - prompt: Rabindranath Tagore won the Nobel Prize in Literature in 1913. How many years ago is that from 2026?
    answer: '113'
    check: 2026-1913
    difficulty: 2
    hints:
    - Subtract the earlier year.
    - 2026 minus 1913.
    solution: 'Step 1: 2026 - 1913. Step 2: = 113 years.'
    mistakes:
      '3939': c7e3_poem
      '13': c7e3_poem
  - prompt: '''Baskets full of dreams'' is an example of:'
    options:
    - A metaphor
    - A question
    - A fact
    answer: A metaphor
    difficulty: 3
    hints:
    - Dreams cannot really fill baskets.
    - One thing is described as another.
    solution: 'It is a metaphor: dreams are pictured as things carried in baskets.'
    mistakes:
      A question: c7e3_words
      A fact: c7e3_words
  - prompt: 'Choose the correct past tense: ''He ___ his boats down the stream.'''
    options:
    - floated
    - floatted
    - flote
    answer: floated
    difficulty: 1
    hints:
    - It is a regular verb.
    - Just add -ed.
    solution: '''Float'' becomes ''floated''.'
    mistakes:
      floatted: c7e3_grammar
      flote: c7e3_grammar
- code: cbse7e.u3.nsew
  title: North, South, East, West
  after:
  - cbse7e.u3.boats
  notes: |
    Written as postcards from Shaana, a girl from Rameswaram island, to her classmates as she travels around India with
    her parents. North: snowball fights at Thajiwas Glacier in Kashmir (less snow than before); quiet Himachal
    mountains. North-east: a treehouse in Arunachal Pradesh, hoping to see red pandas. East: mangroves, crocodiles and
    snakes in the Sundarbans. West: the hot desert and colourful clothes of Gujarat. Centre: river rafting on the
    Narmada (less water than before; her father is scared). South-west: Goa's beaches; she overcomes her fear of
    train tunnels. South: surfing in Chennai and Puducherry; crossing the Pamban Bridge over the sea home to
    Rameswaram. Themes: India's diversity, environmental change, adventure, growing confidence.
  explanations:
    text: 'Shaana, a girl from Rameswaram, sends postcards to her class as she travels round India: glaciers in Kashmir, a treehouse in Arunachal, mangroves in the Sundarbans, desert in Gujarat, rafting on the Narmada, beaches in Goa, surfing in Chennai. She also notices signs of environmental change.'
    visual: 'Draw a map of India with postcards pinned at each stop: a snowball in Kashmir, a red panda in Arunachal, a crocodile in the Sundarbans, a camel in Gujarat, a raft on the Narmada, a train tunnel in Goa, a surfboard in Chennai, and home at Rameswaram.'
    step_by_step: 'Step 1: Note the form: postcards. Step 2: Trace the journey by direction. Step 3: For each place, note what she saw or did. Step 4: Notice the environmental warnings (less snow, less water). Step 5: Notice how she grows (fear of tunnels).'
    real_world: The Pamban Bridge, which Shaana's train crosses, links Rameswaram island to the mainland over the sea.
  picture:
    kind: compare
    columns:
    - title: Place
      points:
      - Thajiwas Glacier, Kashmir
      - Arunachal Pradesh
      - Sundarbans
      - Narmada River
      - Goa
    - title: What Shaana did or saw
      points:
      - Snowball fights; less snow than before
      - Treehouse; hoping for red pandas
      - Mangroves, crocodiles
      - Rafting; less water than before
      - Beat her fear of tunnels
    alt: Places Shaana visited and what she did or saw at each, from Kashmir's glacier to Goa's tunnels.
  activity:
    type: sort
    prompt: 'North, South, East, West: where was Shaana?'
    bins:
    - North
    - East
    - West
    - South
    items:
    - label: Snowball fights at Thajiwas Glacier
      bin: North
      clue: Kashmir.
      why: Kashmir is in the north.
    - label: Mangroves and crocodiles
      bin: East
      clue: The Sundarbans.
      why: The Sundarbans are in the east.
    - label: Hot desert and colourful clothes
      bin: West
      clue: Gujarat.
      why: Gujarat is in the west.
    - label: Surfing near Puducherry
      bin: South
      clue: Bay of Bengal coast.
      why: Chennai and Puducherry are in the south.
    - label: Pamban Bridge home to Rameswaram
      bin: South
      clue: Her island home.
      why: Rameswaram is in the far south.
  lesson:
    - teach: '''North, South, East, West'' is written as postcards from Shaana, a girl from Rameswaram island, to her classmates as she travels around India with her parents.'
      check:
