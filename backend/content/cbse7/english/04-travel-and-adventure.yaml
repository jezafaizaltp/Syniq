concepts:
- code: cbse7e.u4.tunnel
  title: The Tunnel (Ruskin Bond)
  notes: |
    Suraj cycles into the jungle to watch the midday steam train rush into a railway tunnel. He explores the dark,
    damp tunnel and glimpses a leopard on the hillside. He meets Sunder Singh, the watchman who lives in a hut by the
    tunnel, checks it every day and signals trains with a red flag or lamp if there is danger. Sunder Singh calls the
    leopard 'my leopard' and says it is harmless to people. That night, waiting for the night mail, they hear the
    leopard inside the tunnel; they go in and shout until it runs out, and the train passes safely. Later, travelling
    to Delhi with his father, Suraj sees Sunder Singh's lamp at the tunnel and thinks of him like a firefly. Themes:
    adventure, courage, friendship, harmony with nature, responsibility.
  explanations:
    text: Suraj loves watching the train rush into a jungle tunnel. He befriends Sunder Singh, the watchman who keeps the tunnel safe. One night they hear a leopard inside the tunnel just before the night mail arrives, and they bravely drive it out so both the train and the leopard are safe.
    visual: Picture a dark tunnel mouth in a green hillside, a steam train approaching with its headlight blazing, an old watchman holding up a lamp, and a leopard slipping away into the trees.
    step_by_step: 'Step 1: Suraj''s love of trains and the tunnel. Step 2: Meeting Sunder Singh and learning his job. Step 3: The leopard. Step 4: The night: driving the leopard out before the train. Step 5: The lamp seen from the train.'
    real_world: Railway lines through forests in India now have underpasses and speed limits so that elephants and leopards can cross safely.
  picture:
    kind: flow
    steps:
    - Suraj watches the train enter the tunnel
    - He meets Sunder Singh, the watchman
    - He sees a leopard near the tunnel
    - At night they drive the leopard out
    - The night mail passes safely
    alt: 'The story in five steps: watching the train, meeting the watchman, seeing the leopard, driving it from the tunnel at night, and the train passing safely.'
  activity:
    type: order
    prompt: 'The Tunnel: put Suraj''s adventure in order.'
    steps:
    - Suraj cycles to watch the midday train
    - He explores the tunnel and sees a leopard
    - He meets Sunder Singh, the watchman
    - At night they shout the leopard out
    - The train passes safely
    reasons:
      He explores the tunnel and sees a leopard: The train has passed; he goes inside.
      He meets Sunder Singh, the watchman: Sunder Singh lives by the tunnel.
      At night they shout the leopard out: The night mail is coming.
      The train passes safely: The leopard has left the tunnel.
  items:
  - prompt: Who wrote 'The Tunnel'?
    options:
    - Ruskin Bond
    - Rabindranath Tagore
    - Hugh Lofting
    - Kamala Nair
    answer: Ruskin Bond
    difficulty: 1
    hints:
    - He writes about hills and forests.
    - Author of 'The Cherry Tree'.
    solution: The story is by Ruskin Bond.
    mistakes: {"Rabindranath Tagore": "e7_bond"}
  - prompt: What is Sunder Singh's job?
    options:
    - Watchman of the railway tunnel
    - Train driver
    - Forest ranger
    - Ticket collector
    answer: Watchman of the railway tunnel
    difficulty: 1
    hints:
    - He checks the tunnel.
    - Signals with a lamp.
    solution: He is the tunnel watchman.
    mistakes:
      Train driver: eng7_read_again
  - prompt: What animal did Suraj and Sunder Singh find in the tunnel?
    options:
    - A leopard
    - A tiger
    - An elephant
    - A bear
    answer: A leopard
    difficulty: 1
    hints:
    - '''My leopard''.'
    - A big spotted cat.
    solution: A leopard was in the tunnel.
    mistakes: {"A tiger": "e7_leopard"}
  - prompt: How did they get the leopard out of the tunnel?
    options:
    - By shouting until it ran off
    - By shooting it
    - By calling the zoo
    - By stopping the train
    answer: By shouting until it ran off
    difficulty: 2
    hints:
    - No harm to it.
    - Noise.
    solution: They shouted and made noise until it left.
    mistakes: {"By shooting it": "e7_shout"}
  - prompt: How does Sunder Singh signal danger to train drivers?
    options:
    - With a red flag or lamp
    - With a whistle only
    - With his phone
    - He doesn't
    answer: With a red flag or lamp
    difficulty: 2
    hints:
    - Red means stop.
    - At night, a lamp.
    solution: He uses a red flag by day and a lamp at night.
    mistakes: {"With his phone": "e7_signal"}
  - prompt: What does the story show about Sunder Singh's attitude to the leopard?
    options:
    - He respects it and wants it safe
    - He hates it
    - He wants to catch it
    - He is afraid of it
    answer: He respects it and wants it safe
    difficulty: 2
    hints:
    - '''My leopard''.'
    - Harmony with nature.
    solution: He cares for the leopard and protects it.
    mistakes:
      He hates it: eng7_whole_story
- code: cbse7e.u4.travel
  title: Travel (Edna St. Vincent Millay)
  after:
  - cbse7e.u4.tunnel
  notes: |
    A poem by Edna St. Vincent Millay. The railroad track is miles away and the day is loud with voices, yet the
    speaker hears the train's whistle shrieking. All night there isn't a train goes by, though the night is still for
    sleep and dreaming, but she hears its whistle and sees its cinders red on the sky and hears its engine steaming.
    Her heart is warm with the friends she makes and better friends she'll not be knowing, yet there isn't a train
    she wouldn't take, no matter where it's going. Rhyme scheme ABCB. Theme: the longing to travel and explore.
  explanations:
    text: 'The speaker hears train whistles even when the railway is miles away. She has good friends and is happy, yet she would happily take any train at all, no matter where it was going: she longs to travel and explore.'
    visual: Picture a girl lying awake at night, imagining a far-off train with red sparks flying from its engine into the dark sky, its whistle calling her to adventure.
    step_by_step: 'Step 1: Find the main image: the train. Step 2: Notice the sounds (whistle, steaming) and sights (red cinders). Step 3: Note the contrast with her friends. Step 4: Read the last line: any train, anywhere. Step 5: Theme: longing to travel.'
    real_world: 'Many people feel the same pull when they hear a train or see an aeroplane overhead: a wish to go somewhere new.'
  picture:
    kind: compare
    columns:
    - title: What she has
      points:
      - Warm friendships
      - A comfortable home
      - Quiet nights for dreaming
    - title: What she longs for
      points:
      - Any train
      - New places
      - Adventure, no matter where
    alt: What the speaker has (friends, home, quiet nights) compared with what she longs for (any train to anywhere).
  activity:
    type: sort
    prompt: 'Travel: what does the speaker feel?'
    bins:
    - Hears the train
    - Longs to go
    items:
    - label: The whistle shrieking
      bin: Hears the train
      clue: A sound.
      why: The shriek is what she hears.
    - label: Cinders red on the sky
      bin: Hears the train
      clue: Seen and heard at night.
      why: The train's sparks and steam come to her senses.
    - label: Any train, wherever it goes
      bin: Longs to go
      clue: Destination doesn't matter.
      why: Taking any train shows longing to travel.
    - label: Better friends she'll not be knowing
      bin: Longs to go
      clue: Friends at home vs travel.
      why: She'd leave friends to travel.
    - label: Engine steaming
      bin: Hears the train
      clue: A sound of the engine.
      why: Steaming is the train sound she hears.
  items:
  - prompt: Who wrote the poem 'Travel'?
    options:
    - Edna St. Vincent Millay
    - Rabindranath Tagore
    - Ruskin Bond
    - Helen Keller
    answer: Edna St. Vincent Millay
    difficulty: 1
    hints:
    - An American poet.
    - Not Indian.
    solution: The poem is by Edna St. Vincent Millay.
    mistakes:
      Rabindranath Tagore: eng7_read_again
  - prompt: What does the speaker keep hearing?
    options:
    - A train whistle
    - A school bell
    - Birds singing
    - Rain falling
    answer: A train whistle
    difficulty: 1
    hints:
    - The railroad is miles away.
    - Shrieking.
    solution: She hears a train's whistle.
    mistakes: {"A school bell": "e7_whistle"}
  - prompt: What does she see on the night sky?
    options:
    - Red cinders from the engine
    - Stars only
    - Fireworks
    - Lightning
    answer: Red cinders from the engine
    difficulty: 2
    hints:
    - From a steam engine.
    - Sparks.
    solution: She imagines red cinders on the sky.
    mistakes: {"Fireworks": "e7_cinders"}
  - prompt: What does the last line tell us?
    options:
    - She would take any train, no matter where it's going
