# CBSE Class 7 English (NCERT Poorvi, 2024-25), unit 4: three chapters. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse7-eng
chapter: 4
title: 'Travel and Adventure: The Tunnel · Travel · Conquering the Summit'
tips:
  e7_abcb: "Mark each line end with a letter. Only lines 2 and 4 rhyme."
  e7_any_train: "The speaker longs to travel so much she doesn't care about the destination."
  e7_bond: "The story is set in the hills with trains and a watchman, typical of a writer who lived in Mussoorie."
  e7_cinders: "Old steam engines throw sparks into the dark sky."
  e7_everest_year: "2011 is the year of the train accident. She climbed Everest after recovering."
  e7_leopard: "The animal in the tunnel was a spotted big cat."
  e7_record: "Others had climbed Everest long before. Her record was about who she was."
  e7_shout: "The watchman had no gun. He made noise to scare it away."
  e7_signal: "Sunder Singh's job is old-fashioned. Train drivers watch for a colour that means stop."
  e7_summit_message: "She lost a leg and still reached the top. What does that show?"
  e7_travel_theme: "The speaker hears and sees trains everywhere and wants to go."
  e7_volleyball: "Arunima was a national-level player of a game with a net and a ball hit by hand."
  e7_whistle: "The poem is about trains. What sound does a train make far away?"
  e7_years_later: "Subtract 2011 from 2013."
  c7e4_events: 'Retell the story in order: the boy watching the train, exploring the dark passage, meeting the man who guards it, the night-time danger, and the journey years later.'
  c7e4_why: Ask what each person was responsible for, or afraid of, and how that explains what they did.
  c7e4_poem: The speaker cannot see the train, yet hears and imagines it all day and night. Think about what that tells us about her wish.
  c7e4_climb: 'Follow her journey: the accident, the decision in hospital, the training, the guide, the first summit, and the peaks after it.'
  c7e4_years: Write the two years and subtract the earlier from the later.
  c7e4_words: Put each choice into the sentence and read it again. Keep the one that fits the meaning.
  c7e4_grammar: Check the subject and the time of the action, then choose the form that fits.

concepts:
- code: cbse7e.u4.tunnel
  title: The Tunnel (Ruskin Bond)
  notes: |
    Suraj cycles into the jungle to watch the midday steam train rush into a railway tunnel. He explores the dark,
    damp tunnel and glimpses a leopard on the hillside. He meets Sunder Singh, the watchman who lives in a hut by the
    tunnel, checks it every day and signals trains with a red flag or lamp if there is danger. Sunder Singh calls the
    leopard 'my leopard' and says it is harmless to people. That night, waiting for the night mail, they hear the
    leopard inside the tunnel; they go in and shout until it runs out, and the train passes safely. Later, travelling
    to Delhi with his father, Suraj sees Sunder Singh's lamp at the tunnel and thinks of him like a firefly. Themes:
    adventure, courage, friendship, harmony with nature, responsibility.
  explanations:
    text: Suraj loves watching the train rush into a jungle tunnel. He befriends Sunder Singh, the watchman who keeps the tunnel safe. One night they hear a leopard inside the tunnel just before the night mail arrives, and they bravely drive it out so both the train and the leopard are safe.
    visual: Picture a dark tunnel mouth in a green hillside, a steam train approaching with its headlight blazing, an old watchman holding up a lamp, and a leopard slipping away into the trees.
    step_by_step: 'Step 1: Suraj''s love of trains and the tunnel. Step 2: Meeting Sunder Singh and learning his job. Step 3: The leopard. Step 4: The night: driving the leopard out before the train. Step 5: The lamp seen from the train.'
    real_world: Railway lines through forests in India now have underpasses and speed limits so that elephants and leopards can cross safely.
  picture:
    kind: flow
    steps:
    - Suraj watches the train enter the tunnel
    - He meets Sunder Singh, the watchman
    - He sees a leopard near the tunnel
    - At night they drive the leopard out
    - The night mail passes safely
    alt: 'The story in five steps: watching the train, meeting the watchman, seeing the leopard, driving it from the tunnel at night, and the train passing safely.'
  activity:
    type: order
    prompt: 'The Tunnel: put Suraj''s adventure in order.'
    steps:
    - Suraj cycles to watch the midday train
    - He explores the tunnel and sees a leopard
    - He meets Sunder Singh, the watchman
    - At night they shout the leopard out
    - The train passes safely
    reasons:
      He explores the tunnel and sees a leopard: The train has passed; he goes inside.
      He meets Sunder Singh, the watchman: Sunder Singh lives by the tunnel.
      At night they shout the leopard out: The night mail is coming.
      The train passes safely: The leopard has left the tunnel.
  lesson:
    - teach: In Ruskin Bond's 'The Tunnel', Suraj cycles into the jungle to watch the midday steam train rush into a railway tunnel. He explores the dark, damp tunnel and glimpses a leopard on the hillside.
      check:
        prompt: Why did Suraj go to the jungle?
        options:
        - To watch the train enter the tunnel
        - To hunt the leopard
        - To meet his teacher
        answer: To watch the train enter the tunnel
        why: He loved watching the train.
    - teach: He meets Sunder Singh, the watchman who lives in a hut by the tunnel. Every day he checks the tunnel and, if there is danger, signals trains with a red flag or lamp. He calls the leopard 'my leopard' and says it does not harm people.
      check:
        prompt: What was Sunder Singh's job?
        options:
        - Keeping the tunnel safe for trains
        - Driving the train
        - Selling tickets
        answer: Keeping the tunnel safe for trains
        why: He was the tunnel watchman.
    - teach: That night, waiting for the night mail, they hear the leopard inside the tunnel. They go in and shout until it runs out, and the train passes safely. Years later, travelling to Delhi, Suraj sees Sunder Singh's lamp at the tunnel and thinks of him like a firefly.
      picture:
        kind: flow
        steps:
        - Suraj watches the midday train
        - Explores the tunnel, sees a leopard
        - Meets Sunder Singh
        - 'Night: they drive the leopard out'
        - Train passes safely
        - 'Years later: sees the lamp from a train'
        alt: Events of 'The Tunnel' in order.
      check:
        prompt: How did they get the leopard out of the tunnel?
        options:
        - By shouting
        - By shooting it
        - By feeding it
        answer: By shouting
        why: Noise frightened it away without hurting it.
  items:
  - prompt: Who wrote 'The Tunnel'?
    options:
    - Ruskin Bond
    - Rabindranath Tagore
    - Hugh Lofting
    - Kamala Nair
    answer: Ruskin Bond
    difficulty: 1
    hints:
    - He writes about hills and forests.
    - Author of 'The Cherry Tree'.
    solution: The story is by Ruskin Bond.
    mistakes: {"Rabindranath Tagore": "e7_bond"}
  - prompt: What is Sunder Singh's job?
    options:
    - Watchman of the railway tunnel
    - Train driver
    - Forest ranger
    - Ticket collector
    answer: Watchman of the railway tunnel
    difficulty: 1
    hints:
    - He checks the tunnel.
    - Signals with a lamp.
    solution: He is the tunnel watchman.
    mistakes:
      Train driver: eng7_read_again
  - prompt: What animal did Suraj and Sunder Singh find in the tunnel?
    options:
    - A leopard
    - A tiger
    - An elephant
    - A bear
    answer: A leopard
    difficulty: 1
    hints:
    - '''My leopard''.'
    - A big spotted cat.
    solution: A leopard was in the tunnel.
    mistakes: {"A tiger": "e7_leopard"}
  - prompt: How did they get the leopard out of the tunnel?
    options:
    - By shouting until it ran off
    - By shooting it
    - By calling the zoo
    - By stopping the train
    answer: By shouting until it ran off
    difficulty: 2
    hints:
    - No harm to it.
    - Noise.
    solution: They shouted and made noise until it left.
    mistakes: {"By shooting it": "e7_shout"}
  - prompt: How does Sunder Singh signal danger to train drivers?
    options:
    - With a red flag or lamp
    - With a whistle only
    - With his phone
    - He doesn't
    answer: With a red flag or lamp
    difficulty: 2
    hints:
    - Red means stop.
    - At night, a lamp.
    solution: He uses a red flag by day and a lamp at night.
    mistakes: {"With his phone": "e7_signal"}
  - prompt: What does the story show about Sunder Singh's attitude to the leopard?
    options:
    - He respects it and wants it safe
    - He hates it
    - He wants to catch it
    - He is afraid of it
    answer: He respects it and wants it safe
    difficulty: 2
    hints:
    - '''My leopard''.'
    - Harmony with nature.
    solution: He cares for the leopard and protects it.
    mistakes:
      He hates it: eng7_whole_story
  - prompt: Who is the boy who cycles to the tunnel?
    options:
    - Suraj
    - Anand
    - Appu
    answer: Suraj
    difficulty: 1
    hints:
    - Anand is the inventor in another story.
    - His name means 'sun'.
    solution: Suraj is the boy in 'The Tunnel'.
    mistakes:
      Anand: c7e4_events
      Appu: c7e4_events
  - prompt: Why did Sunder Singh not want to kill the leopard?
    options:
    - He felt it was harmless and part of the jungle
    - He was afraid of it
    - It was his pet
    answer: He felt it was harmless and part of the jungle
    difficulty: 2
    hints:
    - He called it 'my leopard'.
    - Think of living in harmony with nature.
    solution: Sunder Singh respected the leopard and knew it did not harm people.
    mistakes:
      He was afraid of it: c7e4_why
      It was his pet: c7e4_why
  - prompt: What signal did Sunder Singh use to warn trains of danger?
    options:
    - A red flag or lamp
    - A green balloon
    - A loud drum
    answer: A red flag or lamp
    difficulty: 1
    hints:
    - Red means stop.
    - It can be seen by day or night.
    solution: He waved a red flag or lamp to stop trains if there was danger.
    mistakes:
      A green balloon: c7e4_why
      A loud drum: c7e4_why
  - prompt: Why did Suraj think of Sunder Singh as a firefly?
    options:
    - His small lamp glowed in the dark jungle
    - He could fly
    - He was very small
    answer: His small lamp glowed in the dark jungle
    difficulty: 2
    hints:
    - Fireflies give a small light.
    - It was night when the train passed.
    solution: The watchman's lamp shone like a firefly in the darkness.
    mistakes:
      He could fly: c7e4_words
      He was very small: c7e4_words
  - prompt: Which quality did Suraj show by entering the dark tunnel at night?
    options:
    - Courage
    - Laziness
    - Greed
    answer: Courage
    difficulty: 1
    hints:
    - There was a leopard inside.
    - He did it to save the train.
    solution: Going into the tunnel with a leopard took courage.
    mistakes:
      Laziness: c7e4_why
      Greed: c7e4_why
  - prompt: Where did Sunder Singh live?
    options:
    - In a hut near the tunnel
    - In Delhi
    - In the train
    answer: In a hut near the tunnel
    difficulty: 1
    hints:
    - He had to check the tunnel every day.
    - He lived close by.
    solution: He lived in a small hut beside the tunnel.
    mistakes:
      In Delhi: c7e4_events
      In the train: c7e4_events
  - prompt: '''Damp'' in ''a dark, damp tunnel'' means:'
    options:
    - Slightly wet
    - Very hot
    - Brightly lit
    answer: Slightly wet
    difficulty: 1
    hints:
    - Tunnels can drip with water.
    - Not dry.
    solution: Damp means a little wet.
    mistakes:
      Very hot: c7e4_words
      Brightly lit: c7e4_words
  - prompt: What lesson does the story teach about nature?
    options:
    - People and wild animals can live side by side
    - All wild animals must be killed
    - Jungles are useless
    answer: People and wild animals can live side by side
    difficulty: 2
    hints:
    - Think of how they treated the leopard.
    - They did not harm it.
    solution: The story shows respect and harmony with wildlife.
    mistakes:
      All wild animals must be killed: c7e4_why
      Jungles are useless: c7e4_why
  - prompt: 'Choose the correct past continuous: ''They ___ for the night mail.'''
    options:
    - were waiting
    - was waiting
    - are wait
    answer: were waiting
    difficulty: 2
    hints:
    - '''They'' is plural.'
    - Past continuous = was/were + -ing.
    solution: Plural subject 'they' takes 'were' + verb-ing.
    mistakes:
      was waiting: c7e4_grammar
      are wait: c7e4_grammar
- code: cbse7e.u4.travel
  title: Travel (Edna St. Vincent Millay)
  after:
  - cbse7e.u4.tunnel
  notes: |
    A poem by Edna St. Vincent Millay. The railroad track is miles away and the day is loud with voices, yet the
    speaker hears the train's whistle shrieking. All night there isn't a train goes by, though the night is still for
    sleep and dreaming, but she hears its whistle and sees its cinders red on the sky and hears its engine steaming.
    Her heart is warm with the friends she makes and better friends she'll not be knowing, yet there isn't a train
    she wouldn't take, no matter where it's going. Rhyme scheme ABCB. Theme: the longing to travel and explore.
  explanations:
    text: 'The speaker hears train whistles even when the railway is miles away. She has good friends and is happy, yet she would happily take any train at all, no matter where it was going: she longs to travel and explore.'
    visual: Picture a girl lying awake at night, imagining a far-off train with red sparks flying from its engine into the dark sky, its whistle calling her to adventure.
    step_by_step: 'Step 1: Find the main image: the train. Step 2: Notice the sounds (whistle, steaming) and sights (red cinders). Step 3: Note the contrast with her friends. Step 4: Read the last line: any train, anywhere. Step 5: Theme: longing to travel.'
    real_world: 'Many people feel the same pull when they hear a train or see an aeroplane overhead: a wish to go somewhere new.'
  picture:
    kind: compare
    columns:
    - title: What she has
      points:
      - Warm friendships
      - A comfortable home
      - Quiet nights for dreaming
    - title: What she longs for
      points:
      - Any train
      - New places
      - Adventure, no matter where
    alt: What the speaker has (friends, home, quiet nights) compared with what she longs for (any train to anywhere).
  activity:
    type: sort
    prompt: 'Travel: what does the speaker feel?'
    bins:
    - Hears the train
    - Longs to go
    items:
    - label: The whistle shrieking
      bin: Hears the train
      clue: A sound.
      why: The shriek is what she hears.
    - label: Cinders red on the sky
      bin: Hears the train
      clue: Seen and heard at night.
      why: The train's sparks and steam come to her senses.
    - label: Any train, wherever it goes
      bin: Longs to go
      clue: Destination doesn't matter.
      why: Taking any train shows longing to travel.
    - label: Better friends she'll not be knowing
      bin: Longs to go
      clue: Friends at home vs travel.
      why: She'd leave friends to travel.
    - label: Engine steaming
      bin: Hears the train
      clue: A sound of the engine.
      why: Steaming is the train sound she hears.
  lesson:
    - teach: In 'Travel' by Edna St. Vincent Millay, the railway track is miles away and the day is loud with voices, yet the speaker still hears the train whistle shrieking. Even far away, the train calls to her.
      check:
        prompt: How far is the railway from the speaker?
        options:
        - Miles away
        - Right outside her door
        - In another country
        answer: Miles away
        why: It is far, yet she still hears it.
    - teach: At night, when no train passes and it is time to sleep, she still hears its whistle and imagines the red cinders on the sky and the engine steaming. The train fills her thoughts by day and night.
      check:
        prompt: What does the speaker imagine seeing at night?
        options:
        - Red cinders on the sky
        - Snow falling
        - Ships at sea
        answer: Red cinders on the sky
        why: She pictures sparks from the steam engine.
    - teach: 'She loves the friends she has, yet there is no train she wouldn''t take, no matter where it goes. The poem shows a strong longing to travel and explore. Its rhyme scheme is ABCB: the 2nd and 4th lines of each stanza rhyme.'
      picture:
        kind: compare
        columns:
        - title: Line
          points:
          - '1'
          - '2'
          - '3'
          - '4'
        - title: Rhyme letter
          points:
          - A
          - B
          - C
          - B
        alt: In an ABCB rhyme scheme, lines 2 and 4 rhyme.
      check:
        prompt: In ABCB, which lines rhyme?
        options:
        - Lines 2 and 4
        - Lines 1 and 3
        - All four
        answer: Lines 2 and 4
        why: Both are marked B.
  items:
  - prompt: Who wrote the poem 'Travel'?
    options:
    - Edna St. Vincent Millay
    - Rabindranath Tagore
    - Ruskin Bond
    - Helen Keller
    answer: Edna St. Vincent Millay
    difficulty: 1
    hints:
    - An American poet.
    - Not Indian.
    solution: The poem is by Edna St. Vincent Millay.
    mistakes:
      Rabindranath Tagore: eng7_read_again
  - prompt: What does the speaker keep hearing?
    options:
    - A train whistle
    - A school bell
    - Birds singing
    - Rain falling
    answer: A train whistle
    difficulty: 1
    hints:
    - The railroad is miles away.
    - Shrieking.
    solution: She hears a train's whistle.
    mistakes: {"A school bell": "e7_whistle"}
  - prompt: What does she see on the night sky?
    options:
    - Red cinders from the engine
    - Stars only
    - Fireworks
    - Lightning
    answer: Red cinders from the engine
    difficulty: 2
    hints:
    - From a steam engine.
    - Sparks.
    solution: She imagines red cinders on the sky.
    mistakes: {"Fireworks": "e7_cinders"}
  - prompt: What does the last line tell us?
    options:
    - She would take any train, no matter where it's going
    - She hates trains
    - She wants to stay home
    - She only likes one train
    answer: She would take any train, no matter where it's going
    difficulty: 2
    hints:
    - '''No matter where it''s going''.'
    - Longing.
    solution: She longs to travel anywhere.
    mistakes: {"She hates trains": "e7_any_train"}
  - prompt: What is the rhyme scheme of each stanza?
    options:
    - ABCB
    - AABB
    - ABAB
    - No rhyme
    answer: ABCB
    difficulty: 2
    hints:
    - Lines 2 and 4 rhyme.
    - away/day.
    solution: 'Only lines 2 and 4 rhyme: ABCB.'
    mistakes: {"AABB": "e7_abcb"}
  - prompt: What is the main theme of the poem?
    options:
    - The longing to travel and explore
    - Fear of trains
    - Life in a factory
    - A sad goodbye
    answer: The longing to travel and explore
    difficulty: 1
    hints:
    - Any train.
    - Adventure.
    solution: The poem is about the urge to travel.
    mistakes: {"Fear of trains": "e7_travel_theme"}
  - prompt: 'In the poem, the day is loud with:'
    options:
    - Voices
    - Thunder
    - Music
    answer: Voices
    difficulty: 2
    hints:
    - People are talking all around.
    - Yet she still hears the train.
    solution: The day is loud with voices, but the whistle still reaches her.
    mistakes:
      Thunder: c7e4_poem
      Music: c7e4_poem
  - prompt: Which sound reaches the speaker from far away?
    options:
    - The train whistle
    - A temple bell
    - A dog barking
    answer: The train whistle
    difficulty: 1
    hints:
    - It belongs to the train.
    - It shrieks.
    solution: She hears the train's whistle shrieking.
    mistakes:
      A temple bell: c7e4_poem
      A dog barking: c7e4_poem
  - prompt: '''There isn''t a train I wouldn''t take'' means she would:'
    options:
    - Take any train at all
    - Never take a train
    - Take only one train
    answer: Take any train at all
    difficulty: 2
    hints:
    - Two negatives here make a positive.
    - She longs to travel.
    solution: '''Isn''t...wouldn''t'' means she would take every train.'
    mistakes:
      Never take a train: c7e4_words
      Take only one train: c7e4_words
  - prompt: What is the poem's main feeling?
    options:
    - A longing to travel
    - Fear of trains
    - Anger at noise
    answer: A longing to travel
    difficulty: 1
    hints:
    - She keeps thinking of trains.
    - She would go anywhere.
    solution: The poem expresses a deep wish to travel.
    mistakes:
      Fear of trains: c7e4_poem
      Anger at noise: c7e4_poem
  - prompt: '''Cinders'' are:'
    options:
    - Small pieces of burnt coal
    - Railway tickets
    - Clouds
    answer: Small pieces of burnt coal
    difficulty: 2
    hints:
    - Steam engines burned coal.
    - They glow red.
    solution: Cinders are bits of partly burnt coal or wood.
    mistakes:
      Railway tickets: c7e4_words
      Clouds: c7e4_words
  - prompt: Why can the speaker 'hear' the train even when none passes at night?
    options:
    - She imagines it because she longs to travel
    - There is a radio playing
    - She lives in a station
    answer: She imagines it because she longs to travel
    difficulty: 3
    hints:
    - No train goes by at night.
    - Her mind is full of trains.
    solution: Her longing makes her imagine the train's sounds and sights.
    mistakes:
      There is a radio playing: c7e4_poem
      She lives in a station: c7e4_poem
  - prompt: '''Shrieking'' describes a sound that is:'
    options:
    - High and loud
    - Soft and low
    - Silent
    answer: High and loud
    difficulty: 1
    hints:
    - Think of a whistle.
    - It cuts through other noise.
    solution: A shriek is a high, loud, piercing sound.
    mistakes:
      Soft and low: c7e4_words
      Silent: c7e4_words
  - prompt: A four-line stanza has the rhyme scheme ABCB. How many lines do NOT rhyme with any other?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - A and C appear only once each.
    - B appears twice.
    solution: 'Step 1: A and C are unpaired. Step 2: that is 2 lines.'
    mistakes:
      '4': c7e4_poem
      '1': c7e4_poem
  - prompt: 'Choose the correct form: ''She ___ the whistle every night.'''
    options:
    - hears
    - hear
    - hearing
    answer: hears
    difficulty: 1
    hints:
    - '''She'' is singular.'
    - Present simple adds -s.
    solution: With 'she', use 'hears'.
    mistakes:
      hear: c7e4_grammar
      hearing: c7e4_grammar
- code: cbse7e.u4.summit
  title: Conquering the Summit (Arunima Sinha)
  after:
  - cbse7e.u4.travel
  notes: |
    The true story of Arunima Sinha, a national-level volleyball player from Ambedkar Nagar, Uttar Pradesh. On 11 April
    2011 she lost a leg after being pushed from a train by robbers, and was fitted with a prosthetic leg. In hospital
    she decided to climb Mount Everest. She trained at the Nehru Institute of Mountaineering, Uttarkashi, and was
    guided by Bachendri Pal, the first Indian woman to climb Everest. On 21 May 2013 she reached the summit of Everest,
    the first female amputee to do so. She went on to climb the highest peaks of other continents (Kilimanjaro,
    Elbrus, Kosciuszko, Aconcagua, Denali) and in January 2019 Mount Vinson in Antarctica. She received the Padma Shri.
    Themes: courage, determination, never giving up.
  explanations:
    text: Arunima Sinha lost a leg in a train attack in 2011. Instead of giving up, she decided to climb Mount Everest. With training and guidance from Bachendri Pal, she reached the top on 21 May 2013, the first woman amputee to do it, and went on to climb the highest peaks on other continents too.
    visual: Picture a climber with a prosthetic leg standing on the snowy summit of Everest, holding up the Indian flag against a deep blue sky.
    step_by_step: 'Step 1: Who she was: a volleyball player. Step 2: The accident (2011). Step 3: Her decision and training. Step 4: The Everest climb (21 May 2013). Step 5: More summits and her message.'
    real_world: Arunima Sinha now inspires others and supports people with disabilities to follow their dreams.
  picture:
    kind: flow
    steps:
    - National-level volleyball player
    - '11 April 2011: loses a leg in a train attack'
    - Trains at Uttarkashi; guided by Bachendri Pal
    - '21 May 2013: summits Mount Everest'
    - Climbs the highest peaks of other continents
    alt: 'Arunima Sinha''s journey: volleyball player, losing a leg in 2011, training, climbing Everest in 2013, and conquering peaks on other continents.'
  activity:
    type: order
    prompt: 'Conquering the Summit: put Arunima''s journey in order.'
    steps:
    - Pushed from a train, she loses a leg
    - In hospital, she decides to climb Everest
    - She trains at Uttarkashi with Bachendri Pal
    - She reaches the top of Everest
    - She climbs Mount Vinson in Antarctica
    reasons:
      In hospital, she decides to climb Everest: She turns loss into a goal.
      She trains at Uttarkashi with Bachendri Pal: She needs skill and a guide.
      She reaches the top of Everest: Training leads to the summit in 2013.
      She climbs Mount Vinson in Antarctica: After Everest, other continents' peaks.
  lesson:
    - teach: Arunima Sinha was a national-level volleyball player from Uttar Pradesh. In April 2011, robbers pushed her from a moving train; she lost a leg and was fitted with a prosthetic (artificial) leg.
      check:
        prompt: What sport did Arunima play before the accident?
        options:
        - Volleyball
        - Cricket
        - Chess
        answer: Volleyball
