- code: cbse7e.u4.summit
  title: Conquering the Summit (Arunima Sinha)
  after:
  - cbse7e.u4.travel
  notes: |
    The true story of Arunima Sinha, a national-level volleyball player from Ambedkar Nagar, Uttar Pradesh. On 11 April
    2011 she lost a leg after being pushed from a train by robbers, and was fitted with a prosthetic leg. In hospital
    she decided to climb Mount Everest. She trained at the Nehru Institute of Mountaineering, Uttarkashi, and was
    guided by Bachendri Pal, the first Indian woman to climb Everest. On 21 May 2013 she reached the summit of Everest,
    the first female amputee to do so. She went on to climb the highest peaks of other continents (Kilimanjaro,
    Elbrus, Kosciuszko, Aconcagua, Denali) and in January 2019 Mount Vinson in Antarctica. She received the Padma Shri.
    Themes: courage, determination, never giving up.
  explanations:
    text: Arunima Sinha lost a leg in a train attack in 2011. Instead of giving up, she decided to climb Mount Everest. With training and guidance from Bachendri Pal, she reached the top on 21 May 2013, the first woman amputee to do it, and went on to climb the highest peaks on other continents too.
    visual: Picture a climber with a prosthetic leg standing on the snowy summit of Everest, holding up the Indian flag against a deep blue sky.
    step_by_step: 'Step 1: Who she was: a volleyball player. Step 2: The accident (2011). Step 3: Her decision and training. Step 4: The Everest climb (21 May 2013). Step 5: More summits and her message.'
    real_world: Arunima Sinha now inspires others and supports people with disabilities to follow their dreams.
  picture:
    kind: flow
    steps:
    - National-level volleyball player
    - '11 April 2011: loses a leg in a train attack'
    - Trains at Uttarkashi; guided by Bachendri Pal
    - '21 May 2013: summits Mount Everest'
    - Climbs the highest peaks of other continents
    alt: 'Arunima Sinha''s journey: volleyball player, losing a leg in 2011, training, climbing Everest in 2013, and conquering peaks on other continents.'
  activity:
    type: order
    prompt: 'Conquering the Summit: put Arunima''s journey in order.'
    steps:
    - Pushed from a train, she loses a leg
    - In hospital, she decides to climb Everest
    - She trains at Uttarkashi with Bachendri Pal
    - She reaches the top of Everest
    - She climbs Mount Vinson in Antarctica
    reasons:
      In hospital, she decides to climb Everest: She turns loss into a goal.
      She trains at Uttarkashi with Bachendri Pal: She needs skill and a guide.
      She reaches the top of Everest: Training leads to the summit in 2013.
      She climbs Mount Vinson in Antarctica: After Everest, other continents' peaks.
  items:
  - prompt: What sport did Arunima Sinha play before her accident?
    options:
    - Volleyball
    - Cricket
    - Hockey
    - Tennis
    answer: Volleyball
    difficulty: 1
    hints:
    - National level.
    - A net game.
    solution: She was a national-level volleyball player.
    mistakes: {"Cricket": "e7_volleyball"}
  - prompt: In which year did she climb Mount Everest?
    answer: '2013'
    check: '2013'
    difficulty: 1
    hints:
    - 21 May.
    - Two years after her accident.
    solution: She summited Everest on 21 May 2013.
    mistakes: {"2011": "e7_everest_year"}
  - prompt: Her accident was in 2011 and she climbed Everest in 2013. How many years later was that?
    answer: '2'
    check: 2013 - 2011
    difficulty: 1
    hints:
    - Subtract.
    - 2013 − 2011.
    solution: 2013 − 2011 = 2 years.
    mistakes: {"3": "e7_years_later"}
  - prompt: Who guided Arunima Sinha in her training?
    options:
    - Bachendri Pal
    - Kalpana Chawla
    - P. T. Usha
    - Mary Kom
    answer: Bachendri Pal
    difficulty: 2
    hints:
    - First Indian woman to climb Everest.
    - A mountaineer.
    solution: Bachendri Pal guided her.
    mistakes:
      Kalpana Chawla: eng7_read_again
  - prompt: What record did she set on Everest?
    options:
    - First female amputee to reach the summit
