            - The first Indian woman to climb Everest
          alt: In hospital Arunima decided to climb Mount Everest; she trained at the Nehru Institute of Mountaineering in Uttarkashi, guided by Bachendri Pal, the first Indian woman to climb Everest.
      - style: real_world
        teach: 'A student who wants to play for the state looks for an academy and for a coach who has played at that level. Arunima did the same: she chose a guide who had already stood on the summit.'
    - teach: On 21 May 2013, Arunima reached the top of Everest, the first female amputee to do so. She then climbed the highest peaks of other continents, finishing with Mount Vinson in Antarctica in 2019, and received the Padma Shri. Her story is about determination and never giving up.
      picture:
        kind: flow
        steps:
        - '2011: accident, loses a leg'
        - Decides in hospital to climb Everest
        - Trains at Uttarkashi with Bachendri Pal
        - '2013: Everest summit'
        - '2019: Mount Vinson, Antarctica'
        alt: Arunima Sinha's journey.
      check:
        prompt: What does Arunima's story mainly show?
        options:
        - Determination can overcome great difficulty
        - Climbing is easy
        - Accidents stop dreams
        answer: Determination can overcome great difficulty
        why: She achieved her goal after losing a leg.
      ways:
      - style: step_by_step
        teach: 'Step 1: On 21 May 2013 Arunima reaches the top of Everest, the first female amputee to do so. Step 2: She goes on to the highest peaks of other continents. Step 3: In 2019 she finishes with Mount Vinson in Antarctica. Step 4: She is honoured with the Padma Shri.'
      - style: real_world
        teach: 'When something goes badly wrong, such as an injury before a big match, there are two roads: stop, or set a new goal. Arunima''s new goal was the highest point on Earth.'
