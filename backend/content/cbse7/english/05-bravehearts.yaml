# CBSE Class 7 English (NCERT Poorvi, 2024-25), unit 5: three chapters. Format: content/README.md.
# Written from study notes about the new book, not the printed text: check names and details against it.
subject: cbse7-eng
chapter: 5
title: 'Bravehearts: A Homage to Our Brave Soldiers · My Dear Soldiers · Rani Abbakka'
tips:
  e7_abhaya: "'Bhaya' means fear. 'A-' at the start means without."
  e7_borders: "Soldiers guard the borders in the hardest places, cold and hot."
  e7_century: "Abbakka fought the first Europeans on India's west coast, in the 1500s. Which century is that?"
  e7_dear: "'Dear' is a word we use for people we love."
  e7_graphic: "'Graphic' is about drawings. Think of comics."
  e7_gratitude: "The speaker thanks people who guard the country."
  e7_honour: "The poem asks us to remember soldiers and live in a way that is worth their sacrifice."
  e7_kargil: "Which war did India fight in 1999 in the mountains of Ladakh?"
  e7_letters: "The chapter has a 'Dear ...' at the start of each part and is between two people."
  e7_memorial_open: "1999 is the Kargil war. The memorial opened 20 years later."
  e7_peacetime: "Think of floods and earthquakes. Who comes to rescue people?"
  e7_portuguese: "Abbakka lived long before the British came. A European power ruled Goa then."
  e7_pushp: "The flower does not want honour for itself. It wants to honour soldiers."
  e7_soldiers: "The poem's title says 'my dear ...'."
  e7_tribute: "The Portuguese wanted money and control of trade. What did she refuse?"
  c7e5_letters: Two friends in two different cities write to each other about two different memorials. Keep track of who wrote what, and from where.
  c7e5_memorial: The memorial honours people who gave their lives defending the country after Independence. Think about what it records and why.
  c7e5_poem: The poem speaks straight to the people who guard the borders. Think about where they stand, what they give up, and what we feel towards them.
  c7e5_queen: Picture a coastal kingdom in the 1500s facing powerful foreign traders who wanted money and control of its port.
  c7e5_words: Put each choice into the sentence and read it again. Keep the one that keeps the meaning.
  c7e5_calc: Write the numbers in the question, decide whether to add, subtract or multiply, then work it out.
  c7e5_grammar: Check the subject and the time of the action, then choose the form that fits.

concepts:
- code: cbse7e.u5.homage
  title: A Homage to Our Brave Soldiers
  notes: |
    Written as letters between two friends. Soumya, a student from Bengaluru, visits the National War Memorial in New
    Delhi (near India Gate) on a school trip and writes to her friend Ananda in Chandigarh. She describes the
    memorial (built over about 40 acres, inaugurated in February 2019) with names of soldiers who died defending India
    since Independence, including the 1962, 1965, 1971 and 1999 (Kargil) wars, and stories of gallantry award winners
    such as Lance Naik Albert Ekka and Major Padmapani Acharya. Ananda replies with her own visit to Chandigarh's war
    memorial and shares Makhanlal Chaturvedi's poem 'Pushp ki Abhilasha' (the flower's wish to be thrown on the path of
    soldiers). The armed forces also help in peace, in floods and earthquakes. Themes: gratitude, patriotism, sacrifice.
  explanations:
    text: In letters to her friend, Soumya describes visiting the National War Memorial in New Delhi, which honours soldiers who gave their lives for India. Her friend Ananda replies with her own memories and a poem about a flower that wishes to be laid on soldiers' path. The chapter is a thank-you to our brave soldiers.
    visual: Picture a circle of walls in New Delhi carved with thousands of soldiers' names, an eternal flame burning at the centre, and schoolchildren standing quietly.
    step_by_step: 'Step 1: Note the form: letters between friends. Step 2: The place: National War Memorial. Step 3: The soldiers and wars remembered. Step 4: Ananda''s reply and the poem. Step 5: The message: gratitude and respect.'
    real_world: Every year on Kargil Vijay Diwas, 26 July, India remembers the soldiers who fought in the 1999 Kargil war.
  picture:
    kind: flow
    steps:
    - Soumya visits the National War Memorial
    - She writes to Ananda about it
    - Names and stories of brave soldiers
    - Ananda replies with a poem
    - Gratitude to soldiers in war and peace
    alt: 'The chapter in five steps: the visit to the memorial, Soumya''s letter, soldiers'' stories, Ananda''s reply with a poem, and gratitude to the armed forces.'
  activity:
    type: sort
    prompt: 'A Homage to Our Brave Soldiers: who or what is it?'
    bins:
    - Soumya
    - Ananda
    - The memorial
    items:
    - label: Visits from Bengaluru on a school trip
      bin: Soumya
      clue: Writes the first letter.
      why: Soumya visits the memorial in Delhi.
    - label: Writes back from Chandigarh
      bin: Ananda
      clue: The friend who replies.
      why: Ananda lives in Chandigarh.
    - label: Built on about 40 acres
      bin: The memorial
      clue: Its size.
      why: The memorial covers about 40 acres.
    - label: Shares 'Pushp ki Abhilasha'
      bin: Ananda
      clue: A Hindi poem in the reply.
      why: Ananda shares the poem.
    - label: Names of soldiers since Independence
      bin: The memorial
      clue: Engraved.
      why: The memorial carries their names.
  lesson:
    - teach: This chapter is a set of letters between two friends. Soumya, from Bengaluru, visits the National War Memorial in New Delhi, near India Gate, on a school trip and writes to her friend Ananda in Chandigarh.
      check:
        prompt: Where does Ananda live?
        options:
        - Chandigarh
        - Bengaluru
        - Delhi
        answer: Chandigarh
        why: Soumya writes to her friend in Chandigarh.
    - teach: The memorial, opened in February 2019 over about 40 acres, carries the names of soldiers who died defending India since Independence, including in the 1962, 1965, 1971 and 1999 (Kargil) wars. It tells stories of gallantry award winners such as Lance Naik Albert Ekka and Major Padmapani Acharya.
      picture:
        kind: flow
        steps:
        - '1962'
        - '1965'
        - '1971'
        - 1999 (Kargil)
        alt: Some of the wars after Independence remembered at the memorial.
      check:
        prompt: Whose names are on the memorial?
        options:
        - Soldiers who died defending India
        - Famous film stars
        - Cricket players
        answer: Soldiers who died defending India
        why: It honours those who gave their lives.
    - teach: 'Ananda replies about Chandigarh''s war memorial and shares Makhanlal Chaturvedi''s poem ''Pushp ki Abhilasha'': a flower wishes to be thrown on the path where brave soldiers walk. The armed forces also help in peacetime, rescuing people in floods and earthquakes. Themes: gratitude, patriotism, sacrifice.'
      check:
        prompt: Who wrote 'Pushp ki Abhilasha'?
        options:
        - Makhanlal Chaturvedi
        - Ruskin Bond
        - Tagore
        answer: Makhanlal Chaturvedi
        why: He was a Hindi poet and freedom fighter.
  items:
  - prompt: In what form is this chapter written?
    options:
    - Letters between two friends
    - A play
    - A diary
    - A news report
    answer: Letters between two friends
    difficulty: 1
    hints:
    - Soumya and Ananda.
    - They write to each other.
    solution: It is written as letters between friends.
    mistakes: {"A diary": "e7_letters"}
  - prompt: Where is the National War Memorial?
    options:
    - New Delhi, near India Gate
    - Mumbai
    - Chandigarh
    - Bengaluru
    answer: New Delhi, near India Gate
    difficulty: 1
    hints:
    - The capital.
    - Near a famous arch.
    solution: It is in New Delhi near India Gate.
    mistakes:
      Chandigarh: eng7_read_again
  - prompt: In which year was the National War Memorial inaugurated?
    answer: '2019'
    check: '2019'
    difficulty: 2
    hints:
    - February.
    - Recent.
    solution: It was inaugurated in February 2019.
    mistakes: {"1999": "e7_memorial_open"}
  - prompt: Which war in 1999 does the memorial honour?
    options:
    - The Kargil war
    - The First World War
    - The 1857 revolt
    - The Kalinga war
    answer: The Kargil war
    difficulty: 2
    hints:
    - In Ladakh's mountains.
    - Kargil Vijay Diwas.
    solution: The 1999 war was the Kargil war.
    mistakes: {"The First World War": "e7_kargil"}
  - prompt: '''Pushp ki Abhilasha'' is about a flower that wishes to:'
    options:
    - Be thrown on the path of brave soldiers
    - Be worn by a queen
    - Stay in a garden forever
    - Be sold in a market
    answer: Be thrown on the path of brave soldiers
    difficulty: 2
    hints:
    - A patriotic poem.
    - Makhanlal Chaturvedi.
    solution: The flower wishes to be laid on the path of soldiers going to defend the country.
    mistakes: {"Be worn by a queen": "e7_pushp"}
  - prompt: How do the armed forces help in peacetime?
    options:
    - Rescue during floods and earthquakes
    - They don't
    - Only by marching
    - By selling goods
    answer: Rescue during floods and earthquakes
    difficulty: 1
    hints:
    - Disaster relief.
    - Helping people.
    solution: They help in disasters like floods and earthquakes.
    mistakes: {"Only by marching": "e7_peacetime"}
  - prompt: Where is Soumya from?
    options:
    - Bengaluru
    - Chandigarh
    - Kolkata
    answer: Bengaluru
    difficulty: 1
    hints:
    - She travels to Delhi on a school trip.
    - Her friend is the one in Chandigarh.
    solution: Soumya is a student from Bengaluru.
    mistakes:
      Chandigarh: c7e5_letters
      Kolkata: c7e5_letters
  - prompt: About how large is the National War Memorial?
    options:
    - About 40 acres
    - About 4 square metres
    - About 4,000 square km
    answer: About 40 acres
    difficulty: 2
    hints:
    - It is a large open complex.
    - Think of many football grounds.
    solution: The memorial is spread over about 40 acres.
    mistakes:
      About 4 square metres: c7e5_memorial
      About 4,000 square km: c7e5_memorial
  - prompt: The memorial opened in 2019. The Kargil war was in 1999. How many years apart?
    answer: '20'
    check: 2019-1999
    difficulty: 1
    hints:
    - Subtract the earlier year.
    - 2019 minus 1999.
    solution: 'Step 1: 2019 - 1999. Step 2: = 20 years.'
    mistakes:
      '4018': c7e5_calc
      '10': c7e5_calc
  - prompt: 'Lance Naik Albert Ekka is remembered for:'
    options:
    - Great bravery in war
    - Writing poems
    - Building the memorial
    answer: Great bravery in war
    difficulty: 2
    hints:
    - He won a gallantry award.
    - He fought in 1971.
    solution: Albert Ekka is honoured for outstanding bravery in the 1971 war.
    mistakes:
      Writing poems: c7e5_memorial
      Building the memorial: c7e5_memorial
  - prompt: Why do people visit war memorials?
    options:
    - To remember and thank those who died for the country
    - To shop
    - To play games
    answer: To remember and thank those who died for the country
    difficulty: 1
    hints:
    - Think of the names on the walls.
    - It is a place of respect.
    solution: Memorials help us remember and honour soldiers' sacrifice.
    mistakes:
      To shop: c7e5_memorial
      To play games: c7e5_memorial
  - prompt: '''Gallantry'' means:'
    options:
    - Great bravery
    - Laziness
    - Wealth
    answer: Great bravery
    difficulty: 2
    hints:
    - Gallantry awards are given to soldiers.
    - Think of courage.
    solution: Gallantry means courage, especially in battle.
    mistakes:
      Laziness: c7e5_words
      Wealth: c7e5_words
  - prompt: Why does the flower in 'Pushp ki Abhilasha' want to lie on the soldiers' path?
    options:
    - To honour the soldiers who give their lives for the country
    - To get water
    - To be sold
    answer: To honour the soldiers who give their lives for the country
    difficulty: 2
    hints:
    - It does not want to decorate kings or gods.
    - It respects sacrifice most.
    solution: The flower feels the greatest honour is to lie on the path of brave soldiers.
    mistakes:
      To get water: c7e5_letters
      To be sold: c7e5_letters
  - prompt: Which is an example of the army helping in peacetime?
    options:
    - Rescuing people trapped by a flood
    - Fighting a war
    - Guarding a border
    answer: Rescuing people trapped by a flood
    difficulty: 1
    hints:
    - Peacetime means no war.
    - Think of disasters.
    solution: In peacetime the forces help in floods, earthquakes and other disasters.
    mistakes:
      Fighting a war: c7e5_memorial
      Guarding a border: c7e5_memorial
  - prompt: 'A friendly letter usually begins with:'
    options:
    - Dear ___,
    - Yours faithfully,
    - The End
    answer: Dear ___,
    difficulty: 1
    hints:
    - It is a greeting.
    - '''Yours faithfully'' is for formal letters, at the end.'
    solution: Informal letters start with a greeting like 'Dear Ananda,'.
    mistakes:
      Yours faithfully,: c7e5_words
      The End: c7e5_words
- code: cbse7e.u5.mydear
  title: My Dear Soldiers (poem)
  after:
  - cbse7e.u5.homage
  notes: |
    A poem of thanks addressed to soldiers. The speaker thinks of soldiers guarding the borders in freezing snow, burning
    deserts and thick forests, far from their families, staying awake so that the nation can sleep in peace. The poem
    expresses gratitude, pride and respect, and a wish to be worthy of their sacrifice. Devices: direct address ('my
    dear soldiers'), imagery of harsh places, contrast between the soldiers' hardship and the safety of people at home.
    Theme: gratitude to soldiers, patriotism.
  explanations:
    text: In this poem the speaker thanks soldiers who guard the borders in snow, deserts and forests, far from home, so that the rest of us can live safely. It is full of respect, pride and gratitude.
    visual: Picture a soldier standing guard on a snowy mountain at night, while far below a town sleeps peacefully with its lights glowing.
    step_by_step: 'Step 1: Notice whom the poem speaks to: ''my dear soldiers''. Step 2: List the harsh places described. Step 3: Find the contrast: their hardship, our safety. Step 4: State the feeling: gratitude and pride.'
    real_world: Soldiers posted at Siachen Glacier, one of the coldest battlefields on Earth, live in temperatures far below freezing to guard India's borders.
  picture:
    kind: compare
    columns:
    - title: The soldiers
      points:
      - Guard borders in snow and desert
      - Far from their families
      - Stay awake at night
    - title: The people at home
      points:
      - Live safely
      - Sleep peacefully
      - Feel grateful and proud
    alt: The soldiers' hardship (guarding harsh borders, far from family, awake at night) compared with the safety and gratitude of people at home.
  activity:
    type: sort
    prompt: 'My Dear Soldiers: hardship or safety?'
    bins:
    - Soldiers' hardship
    - Safety at home
    items:
    - label: Freezing snow at the border
      bin: Soldiers' hardship
      clue: Harsh places.
      why: The cold is what soldiers face.
    - label: The nation sleeps in peace
      bin: Safety at home
      clue: Because they stay awake.
      why: People at home are safe.
    - label: Far from their families
      bin: Soldiers' hardship
      clue: Missing home.
      why: Being away is a soldier's sacrifice.
    - label: Burning deserts
      bin: Soldiers' hardship
      clue: Heat.
      why: Deserts are another harsh place.
  lesson:
    - teach: '''My Dear Soldiers'' is a poem of thanks spoken directly to soldiers. The speaker pictures them guarding the borders in freezing snow, burning deserts and thick forests, far from their families.'
      picture:
        kind: compare
        columns:
        - title: Place
          points:
          - mountains
          - desert
          - forest
        - title: Hardship
          points:
          - freezing snow
          - burning heat
          - thick, dangerous jungle
        alt: The harsh places where soldiers stand guard.
      check:
        prompt: Why are the soldiers far from their families?
        options:
        - They are guarding the borders
        - They are on holiday
        - They are at school
        answer: They are guarding the borders
        why: Duty keeps them at distant posts.
    - teach: 'The poem contrasts the soldiers'' hardship with the safety of people at home: they stay awake so the nation can sleep in peace. This contrast makes us feel grateful.'
      check:
        prompt: '''They stay awake so we can sleep in peace'' shows a:'
        options:
        - Contrast
        - Rhyme
        - Question
        answer: Contrast
        why: It sets their hardship against our safety.
    - teach: Calling them 'my dear soldiers' is direct address and shows affection. The poem expresses gratitude, pride and respect, and a wish to be worthy of their sacrifice by being good citizens.
      check:
        prompt: How can a student be 'worthy' of the soldiers' sacrifice?
        options:
        - By being an honest, caring citizen
        - By forgetting them
        - By wasting time
        answer: By being an honest, caring citizen
        why: Good citizenship honours their protection.
  items:
  - prompt: Whom is the poem addressed to?
    options:
    - Soldiers
    - Teachers
    - Farmers
    - Doctors
    answer: Soldiers
    difficulty: 1
    hints:
    - See the title.
    - '''My dear…'''
    solution: It is addressed to soldiers.
    mistakes: {"Teachers": "e7_soldiers"}
  - prompt: Which feeling does the poem mainly express?
    options:
    - Gratitude and pride
    - Anger
    - Boredom
    - Jealousy
    answer: Gratitude and pride
    difficulty: 1
    hints:
    - Thanking soldiers.
    - Respect.
    solution: The poem expresses gratitude and pride.
    mistakes: {"Anger": "e7_gratitude"}
  - prompt: Where are the soldiers described as standing guard?
    options:
    - In snow, deserts and forests
    - In shopping malls
    - In schools
    - In cinemas
    answer: In snow, deserts and forests
    difficulty: 1
    hints:
    - Harsh places.
    - At the borders.
    solution: They guard borders in harsh snow, deserts and forests.
    mistakes: {"In shopping malls": "e7_borders"}
  - prompt: What contrast does the poem draw?
    options:
    - Soldiers face hardship so others can live safely
    - Soldiers are rich and others poor
    - Soldiers sleep while others work
    - There is no contrast
    answer: Soldiers face hardship so others can live safely
    difficulty: 2
    hints:
    - Their sacrifice, our peace.
    - Stay awake so we sleep.
    solution: Their hardship keeps the nation safe.
    mistakes:
      Soldiers sleep while others work: eng7_poem_meaning
  - prompt: 'Calling them ''my dear soldiers'' shows that the speaker feels:'
    options:
    - Close and affectionate towards them
    - Distant
    - Afraid
    - Angry
    answer: Close and affectionate towards them
    difficulty: 2
    hints:
    - '''Dear''.'
    - Warmth.
    solution: '''Dear'' shows affection and closeness.'
    mistakes: {"Distant": "e7_dear"}
  - prompt: Which is the best way to honour soldiers, following the poem's spirit?
    options:
    - Respect their sacrifice and be good citizens
    - Forget about them
    - Complain about them
    - Ignore the news
    answer: Respect their sacrifice and be good citizens
    difficulty: 1
    hints:
    - Be worthy of their sacrifice.
    - Gratitude in action.
    solution: Respecting them and being responsible citizens honours them.
    mistakes: {"Forget about them": "e7_honour"}
  - prompt: 'Speaking directly to someone in a poem, like ''my dear soldiers'', is called:'
    options:
    - Direct address
    - A footnote
    - A title
    answer: Direct address
    difficulty: 2
    hints:
    - The poet talks to them.
    - Like writing 'you'.
    solution: Direct address speaks straight to a person or group.
    mistakes:
      A footnote: c7e5_words
      A title: c7e5_words
  - prompt: Which harsh place is mentioned in the poem?
    options:
    - Burning deserts
    - Shopping malls
    - Cinema halls
    answer: Burning deserts
    difficulty: 1
    hints:
    - Think of the borders in Rajasthan.
    - It is very hot there.
    solution: Soldiers guard in burning deserts, freezing snow and thick forests.
    mistakes:
      Shopping malls: c7e5_poem
      Cinema halls: c7e5_poem
  - prompt: What do the soldiers give up to protect us?
    options:
    - Comfort and time with their families
    - Nothing
    - Their books
    answer: Comfort and time with their families
    difficulty: 2
    hints:
    - They are far from home.
    - They face hard weather.
    solution: Soldiers sacrifice comfort and family time to keep us safe.
    mistakes:
      Nothing: c7e5_poem
      Their books: c7e5_poem
  - prompt: '''Freezing snow'' and ''burning deserts'' are examples of:'
    options:
    - Imagery
    - Rhyme
    - Dialogue
    answer: Imagery
    difficulty: 2
    hints:
    - They create pictures in the mind.
    - You can almost feel the cold and heat.
    solution: Vivid descriptions like these are imagery.
    mistakes:
      Rhyme: c7e5_words
      Dialogue: c7e5_words
  - prompt: Which word means 'thankfulness'?
    options:
    - Gratitude
    - Anger
    - Envy
    answer: Gratitude
    difficulty: 1
    hints:
    - The poem is full of it.
    - Saying 'thank you' shows it.
    solution: Gratitude means being thankful.
    mistakes:
      Anger: c7e5_words
      Envy: c7e5_words
  - prompt: Why does the speaker feel proud?
    options:
    - Because of the soldiers' courage and service
    - Because of winning a game
    - Because of new clothes
    answer: Because of the soldiers' courage and service
    difficulty: 1
    hints:
    - Think of what the soldiers do.
    - Their duty inspires pride.
    solution: The soldiers' bravery fills the speaker with pride.
    mistakes:
      Because of winning a game: c7e5_poem
      Because of new clothes: c7e5_poem
  - prompt: Which line best fits the poem's spirit?
    options:
    - Thank you for keeping us safe
    - Soldiers have an easy life
    - Borders don't matter
    answer: Thank you for keeping us safe
    difficulty: 1
    hints:
    - It is a poem of thanks.
    - Think of their hard life.
    solution: The poem thanks soldiers for protecting us.
    mistakes:
      Soldiers have an easy life: c7e5_poem
      Borders don't matter: c7e5_poem
  - prompt: A soldier guards a post for 6 months a year. How many months is that in 3 years?
    answer: '18'
    check: 6*3
    difficulty: 1
    hints:
    - Same each year.
    - Multiply.
    solution: 'Step 1: 6 × 3. Step 2: = 18 months.'
    mistakes:
      '9': c7e5_calc
      '36': c7e5_calc
  - prompt: 'Choose the correct form: ''The soldiers ___ awake all night.'''
    options:
    - stay
    - stays
    - staying
    answer: stay
    difficulty: 1
    hints:
    - '''Soldiers'' is plural.'
    - Plural subjects take the base verb in present simple.
    solution: Plural 'soldiers' takes 'stay'.
    mistakes:
      stays: c7e5_grammar
      staying: c7e5_grammar
- code: cbse7e.u5.abbakka
  title: Rani Abbakka (graphic story)
  after:
  - cbse7e.u5.mydear
  notes: |
    A graphic (picture) story about Rani Abbakka Chowta, queen of Ullal on the coast of Tulu Nadu (present-day
    Karnataka) in the 16th century. The Portuguese, who controlled much of the sea trade, demanded tribute and wanted
    to capture the port. Abbakka refused to pay and fought them for decades, uniting people of different communities
    and allying with neighbouring rulers. She is remembered as one of India's earliest freedom fighters against
    colonial powers and is called 'Abhaya Rani' (the fearless queen). Themes: courage, leadership, resistance to
    injustice.
  explanations:
    text: Rani Abbakka was a brave queen of Ullal, a port on the Karnataka coast, in the 1500s. When the powerful Portuguese demanded tribute, she refused and fought them for years, uniting her people. She is remembered as the fearless queen and an early freedom fighter.
    visual: 'Picture comic-book panels: Portuguese ships approaching a coastal fort, a queen on horseback leading her soldiers, and the people of Ullal standing together.'
    step_by_step: 'Step 1: Who she was: queen of Ullal, 16th century. Step 2: The threat: the Portuguese. Step 3: Her choice: refuse tribute and fight. Step 4: How: uniting people and allies. Step 5: Her legacy: the fearless queen.'
    real_world: The Indian Coast Guard named a patrol vessel ICGS Rani Abbakka in her honour.
  picture:
    kind: flow
    steps:
    - Abbakka rules Ullal on the Karnataka coast
    - The Portuguese demand tribute
    - She refuses to pay
    - She leads her people in battle for years
    - Remembered as Abhaya Rani, the fearless queen
    alt: 'Rani Abbakka''s story: ruling Ullal, the Portuguese demand, her refusal, years of resistance, and her legacy as the fearless queen.'
  activity:
    type: sort
    prompt: 'Rani Abbakka: Abbakka or the Portuguese?'
    bins:
    - Rani Abbakka
    - The Portuguese
    items:
    - label: Demanded tribute
      bin: The Portuguese
      clue: They wanted payment.
      why: The Portuguese demanded tribute from Ullal.
    - label: Refused to pay
      bin: Rani Abbakka
      clue: She stood up to them.
      why: Abbakka refused.
    - label: Controlled the sea trade
      bin: The Portuguese
      clue: Ships.
      why: The Portuguese controlled the trade.
    - label: United different communities
      bin: Rani Abbakka
      clue: Leadership.
      why: Abbakka united her people.
    - label: Called 'Abhaya Rani'
      bin: Rani Abbakka
      clue: Fearless.
      why: She was the fearless queen.
  lesson:
    - teach: This is a graphic story, told mainly through pictures and speech bubbles. It is about Rani Abbakka Chowta, queen of Ullal, a port on the coast of Tulu Nadu (in present-day Karnataka), in the 16th century.
      check:
        prompt: How is a graphic story mostly told?
        options:
        - Through pictures and speech bubbles
        - Only in long paragraphs
        - Only as a song
        answer: Through pictures and speech bubbles
        why: Pictures carry much of the story.
