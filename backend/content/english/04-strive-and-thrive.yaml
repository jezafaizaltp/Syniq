# Class 9 English (Kerala Reader), Unit IV. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part II text supplied by the school.
# Also uses tips from earlier units: read_the_lines, glossary_word, phrasal_verb.
subject: eng
chapter: 4
title: "Unit IV: Strive and Thrive"

tips:
  never_quit: "Think about what Bethany did after losing her arm: she went back into the water. What does that say about her?"
  under_fire: "Neerja had a chance to escape through the emergency door. What did she choose instead?"
  why_alone: "The poem doesn't say people are bad; it says your call may go unanswered. What should you still do?"
  past_wish: "A regret about the past uses 'I wish' + had + past participle."
  report_shift: "In reported speech, will → would, and 'tomorrow' → 'the next day'."
  phrasal_out: "Try putting a one-word meaning in place of the phrasal verb and see if the sentence makes sense."
  bethany_facts: "Re-read the opening of the story: Bethany was a young teenager surfing off an island in Hawaii. Her friend's father used a piece of his own clothing to stop the bleeding."
  neerja_facts: "Neerja was given India's highest peacetime gallantry award (not the wartime Param Vir Chakra). The plane was hijacked at Karachi, and the stand-off lasted most of a day. To protect the Americans she hid something that showed their nationality."
  walk_alone_message: "'Walk Alone' says: if no one joins you, go on alone with courage, and light your own heart so that others may be inspired."
  reported_question: "Reported wh-question: keep the wh-word, use statement word order (no 'did/does'), shift the tense back and change pronouns: 'Where do you surf?' → He asked her where she surfed."
  wish_form: "'I wish' moves the verb one step back: a wish about now uses the past, and a regret about the past uses the past perfect (had + verb)."
  idiom_meaning: "An idiom's meaning is not the sum of its words: 'out of the blue' = suddenly, 'a split second' = a very short moment, 'crystal clear' = very clear."
  bethany_dad: "It was her father's encouragement, 'try it one more time', that got her up on the wave."
  heart_fire_metaphor: "'Set your heart on fire' is a metaphor: let your own courage and passion be the light."
  hijackers_disguise: "The hijackers pretended to be airport security, which is how they got on board."
  noun_or_verb: "A verb is the action. In 'She shielded...', shielded is what she did; in the others 'shield' is a thing."
  polite_offer: "'Would you like...?' makes a polite offer. Orders like 'Take water' sound rude."
  resilience: "Bethany returned to surfing after losing an arm: bouncing back is resilience."
  shield_meaning: "'Shield' here is what Neerja did: she protected children and passengers with her own body and courage."
  tiger_shark: "The text describes 'the huge jaws of a massive tiger shark'."
  walk_alone: "Tagore's song 'Ekla Chalo Re' says what to do if no one comes with you. 'Ekla' means alone."
  e4_rescue_people: 'Several people helped Bethany: her friend, the friend''s father and brother, and a surgeon. Which one did this?'
  e4_bethany_family: 'Keep the names apart: Alana is her friend; Holt and Byron are Alana''s family; Timothy and Noah are Bethany''s brothers.'
  e4_what_next: After the attack Bethany did not give up. What did she actually do?
  e4_neerja_dates: 'Check the dates in the account: born in 1963, the hijack in September 1986, the award on Republic Day 1987.'
  e4_neerja_choice: Neerja had a chance to save herself. What did she choose instead?
  e4_neerja_trick: The hijackers wanted to find one group of passengers. How could Neerja make that hard for them?
  e4_tagore_facts: 'Check the note on the poet: his title, his Nobel year and the Bengali song the poem comes from.'
  e4_image_meaning: In the poem, the road, thorns and storm are not real. What hard thing in life does each stand for?
  e4_wh_order: In a reported question, keep the wh-word, then put the subject before the verb, as in a statement. No question mark.
  e4_tense_back: 'In reported speech the tense moves one step back: present → past, past → past perfect, will → would.'
  e4_wish_time: For a wish about now, use the past (I wish I knew). For a regret about the past, use had + past participle.
  e4_idiom_sense: An idiom does not mean its words literally. Ask what feeling or situation it describes.
  e4_out_verbs: 'Each ''out'' phrasal verb has its own meaning: make out (see), figure out (solve), pass out (faint), find out (discover), carry out (do).'
  e4_noun_verb_test: If you can put 'the' or 'a' before it, it's a noun. If it shows an action done by someone, it's a verb.

concepts:
  - code: eng9.u4.soul_surfer
    title: The Unstoppable Soul Surfer
    notes: |
      Autobiographical extract by Bethany Hamilton. At thirteen, while relaxing on her board in calm,
      crystal-clear water at Kauai, Hawaii, with her friend Alana Blanchard, a tiger shark attacked "out
      of the blue" — "a split second", a flash of grey, and her left arm was gone. She stayed calm,
      paddled to shore; Alana's father Holt tied his rash guard round her arm as a tourniquet; Alana's
      brother Byron helped. She was rushed to hospital, where Dr Rovinsky operated. She thought of
      becoming the best surf photographer in the world if she could not surf. Brothers Timothy and
      Noah. Returning to surfing, she struggled at first, then on her dad's shout "Bethany, try it one
      more time" she stood up on a wave. People ask for autographs and call her an inspiration. Her
      story became the film 'Soul Surfer'. Themes: resilience, determination, faith, family support.
    explanations:
      text: "Bethany lost her left arm to a shark at thirteen, but she did not lose her love of surfing. With calm courage, quick help from friends and family, and stubborn practice, she returned to the waves and became an inspiration."
      visual: "Draw a timeline: calm morning surf → flash of grey (attack) → tourniquet from Holt's rash guard → hospital → first try back in the water → standing on a wave → inspiring others."
      step_by_step: "Why did Holt tie the rash guard tightly round her arm? Step 1: She was losing a lot of blood. Step 2: A tight band (tourniquet) slows the bleeding. Step 3: That kept her alive until she reached hospital."
      real_world: "Many athletes return after serious injuries; Bethany went on to surf in professional competitions with one arm."
    activity:
      type: order
      prompt: 'Bethany Hamilton''s story: put it in order.'
      steps:
      - She relaxes on her board at Kauai with Alana
      - A tiger shark attacks 'out of the blue'
      - Holt ties a tourniquet; she is rushed to hospital
      - She struggles to surf again
      - '''Try it one more time'' — she stands up on a wave'
      reasons:
        A tiger shark attacks 'out of the blue': The attack broke a calm morning.
        Holt ties a tourniquet; she is rushed to hospital: Help came right after the attack.
        She struggles to surf again: She had to recover before trying again.
        '''Try it one more time'' — she stands up on a wave': Her dad's shout came after many failed tries.
    lesson:
      - teach: '''The Unstoppable Soul Surfer'' is Bethany Hamilton''s own account. At thirteen, while resting on her board in calm, clear water off Kauai, Hawaii, with her friend Alana, a tiger shark attacked ''out of the blue''. In a split second her left arm was gone.'
        check:
          prompt: What did the shark take?
          options:
          - Her left arm
          - Her surfboard only
          - Her right leg
          answer: Her left arm
          why: In a flash of grey, her left arm was gone.
        ways:
        - style: step_by_step
          teach: 'Set the scene step by step. Who: Bethany Hamilton, aged thirteen, telling her own story. Where: calm, clear water off Kauai, Hawaii, resting on her surfboard. With whom: her friend Alana. What happened: a tiger shark attacked ''out of the blue'', and in a split second her left arm was gone.'
      - teach: She stayed calm and paddled to shore. Alana's father Holt tied his rash guard round her arm as a tourniquet; Alana's brother Byron helped. Dr Rovinsky operated in hospital. Lying there, she planned to be the best surf photographer if she could not surf.
        picture:
          kind: flow
          steps:
          - Shark attack
          - Stays calm, paddles in
          - Holt's tourniquet
          - Hospital and surgery
          - Back on a wave
          alt: From attack to return.
        check:
          prompt: What is a tourniquet for?
          options:
          - Stopping bleeding
          - Keeping warm
          - Catching fish
          answer: Stopping bleeding
          why: It is a tight band that cuts blood flow.
        ways:
        - style: step_by_step
          teach: 'Follow the rescue in order. Step 1: Bethany stays calm and paddles to shore. Step 2: Alana''s father Holt ties his rash guard tightly round her arm as a tourniquet, to stop the bleeding. Step 3: Alana''s brother Byron helps. Step 4: Dr Rovinsky operates in hospital. Step 5: lying there, she plans to be the best surf photographer if she cannot surf.'
      - teach: 'Back in the water, she struggled at first. When her dad shouted ''Bethany, try it one more time'', she stood up on a wave. She became an inspiration, and her story became the film ''Soul Surfer''. Themes: resilience, determination, faith, family support.'
        check:
          prompt: Which quality does Bethany show most?
          options:
          - Resilience
          - Jealousy
          - Laziness
          answer: Resilience
          why: She bounced back after a terrible setback.
        ways:
        - style: real_world
          teach: Think of a cricketer who loses form, keeps practising, and scores again. Bethany struggled when she first went back into the water. Then her dad shouted, 'Bethany, try it one more time', and she stood up on a wave. Her story became the film 'Soul Surfer'. Bouncing back like this is resilience; the story also shows determination, faith and family support.
    items:
      - prompt: "How old was Bethany Hamilton when the shark attacked her?"
        answer: "13"
        check: "13"
        difficulty: 1
        hints: ["'For thirteen year old Bethany Hamilton...'"]
        solution: "She was thirteen."
        mistakes: {"18": bethany_facts}
      - prompt: "Where did the shark attack take place?"
        options: ["Kauai, Hawaii", "Karachi, Pakistan", "Kovalam, Kerala", "Sydney, Australia"]
        answer: "Kauai, Hawaii"
        difficulty: 1
        hints: ["She surfs there almost every morning."]
        solution: "It happened off Kauai in Hawaii."
        mistakes: {"Karachi, Pakistan": bethany_facts}
      - prompt: "What kind of shark attacked Bethany?"
        options: ["A tiger shark", "A whale shark", "A hammerhead shark", "A great white shark"]
        answer: "A tiger shark"
        difficulty: 1
        hints: ["Its name is also a big cat."]
        solution: "'the huge jaws of a massive tiger shark'."
        mistakes: {"A great white shark": "tiger_shark", "A hammerhead shark": "tiger_shark"}
      - prompt: "How did Holt help to save Bethany's life?"
        options: ["He tied his rash guard round her arm as a tourniquet", "He fought the shark", "He drove the ambulance", "He operated on her"]
        answer: "He tied his rash guard round her arm as a tourniquet"
        difficulty: 2
        hints: ["It stopped the bleeding."]
        solution: "Holt's rash guard, tied tight, acted as a tourniquet."
        mistakes: {"He operated on her": bethany_facts}
      - prompt: "What did Bethany want to become if she could not surf again?"
        options: ["The best surf photographer in the world", "A doctor", "A swimming coach", "A shark scientist"]
        answer: "The best surf photographer in the world"
        difficulty: 2
        hints: ["She would still be on the water with a camera."]
        solution: "She wanted to be the best surf photographer."
        mistakes: {"A doctor": read_the_lines}
      - prompt: "What helped Bethany finally stand up on a wave after the attack?"
        options: ["Her dad shouting, 'Bethany, try it one more time'", "A new, bigger board", "Giving up and trying a week later", "Surfing in a swimming pool"]
        answer: "Her dad shouting, 'Bethany, try it one more time'"
        difficulty: 2
        hints: ["Family encouragement."]
        solution: "Her father encouraged her to try once more, and she stood up."
        mistakes: {"A new, bigger board": "bethany_dad", "Giving up and trying a week later": "bethany_dad"}
      - prompt: "Which quality is shown most strongly in Bethany's story?"
        options: ["Resilience: bouncing back after a terrible setback", "Greed", "Jealousy", "Laziness"]
        answer: "Resilience: bouncing back after a terrible setback"
        difficulty: 3
        hints: ["She returned to the sport she loved."]
        solution: "Her return to surfing after losing an arm shows resilience and determination."

        mistakes: {"Greed": "resilience", "Laziness": "resilience"}
      - prompt: "After losing her arm, Bethany went back to surfing within a few weeks. What does this show about her?"
        options: ["She refused to let the attack decide her future", "She did not understand what had happened", "She wanted to fight the shark", "She was forced by her parents"]
        answer: "She refused to let the attack decide her future"
        difficulty: 2
        hints: ["What had she said she would do if she couldn't surf?", "Did she give up?"]
        solution: "Step 1: She faced a terrible setback. Step 2: She returned to the water and kept trying, showing resilience and determination."
        mistakes: {"She did not understand what had happened": never_quit, "She wanted to fight the shark": never_quit, "She was forced by her parents": bethany_dad}
      - prompt: "Why does Bethany say the attack came 'out of the blue'?"
        options: ["It happened suddenly in calm, clear water with no warning", "The shark was blue", "It happened in the sky", "She had been warned the day before"]
        answer: "It happened suddenly in calm, clear water with no warning"
        difficulty: 2
        hints: ["What was the water like?", "'Out of the blue' is an idiom."]
        solution: "Step 1: The water was calm and clear and she was relaxing. Step 2: The attack was completely unexpected: out of the blue."
        mistakes: {"The shark was blue": idiom_meaning, "It happened in the sky": idiom_meaning, "She had been warned the day before": idiom_meaning}
      - prompt: "Why does Bethany think about becoming a surf photographer while in hospital?"
        options:
        - "She plans another way to stay close to surfing if she cannot surf again"
        - "She has always disliked surfing"
        - "Her doctor tells her to"
        - "She wants to photograph sharks"
        answer: "She plans another way to stay close to surfing if she cannot surf again"
        difficulty: 3
        hints: ["Think about what she fears she has lost.", "How does the plan show she is not giving up on the ocean?"]
        solution: "Step 1: After losing her arm she does not know if she can surf again. Step 2: She thinks of becoming the best surf photographer, so she can still be part of surfing. Step 3: It shows her determination and positive outlook."
        mistakes: {"She has always disliked surfing": never_quit, "She wants to photograph sharks": bethany_facts}
      - prompt: Who was with Bethany in the water when the shark attacked?
        options:
        - Her friend Alana
        - Her brother Noah
        - Dr Rovinsky
        - Her mother
        answer: Her friend Alana
        difficulty: 1
        hints:
        - She was surfing with a friend.
        - The friend's father later helped her.
        solution: 'Step 1: She was with a friend. Step 2: The friend''s father was Holt. Step 3: Alana.'
        mistakes:
          Her brother Noah: e4_bethany_family
      - prompt: Who operated on Bethany in hospital?
        options:
        - Dr Rovinsky
        - Holt
        - Byron
        - Timothy
        answer: Dr Rovinsky
        difficulty: 2
        hints:
        - It was a surgeon.
        - The others were family and friends.
        solution: 'Step 1: Holt and Byron helped at the beach. Step 2: Timothy is her brother. Step 3: The surgeon was Dr Rovinsky.'
        mistakes:
          Holt: e4_rescue_people
      - prompt: What was the name of the film made from her story?
        options:
        - Soul Surfer
        - Neerja
        - Sea-Fever
        - Half a Day
        answer: Soul Surfer
        difficulty: 1
        hints:
        - It matches part of the lesson's title.
        - '''Neerja'' is the film about the flight attendant.'
        solution: 'Step 1: The lesson is ''The Unstoppable Soul Surfer''. Step 2: The film used the same words. Step 3: Soul Surfer.'
        mistakes:
          Neerja: bethany_facts
      - prompt: Which arm did Bethany lose?
        options:
        - Left
        - Right
        - Both
        - Neither
        answer: Left
        difficulty: 1
        hints:
        - Read the moment of the attack again.
        - It was one arm.
        solution: 'Step 1: The shark took one arm. Step 2: The account names the side. Step 3: Left.'
        mistakes:
          Right: tiger_shark
      - prompt: What does Bethany's story teach readers who face a setback?
        options:
        - Keep trying and adapt to new ways
        - Give up quickly
        - Blame others
        - Never go near water
        answer: Keep trying and adapt to new ways
        difficulty: 3
        hints:
        - What did she do after losing her arm?
        - She had to learn to surf differently.
        solution: 'Step 1: She lost her arm but returned to surfing. Step 2: She learnt new ways to stand on the board. Step 3: Keep trying and adapt.'
        mistakes:
          Give up quickly: e4_what_next
  - code: eng9.u4.shield_of_courage
    title: A Shield of Courage
    after: [eng9.u4.soul_surfer]
    notes: |
      Biographical account of Neerja Bhanot, born 7 September 1963 in Chandigarh; first a model, then a
      Pan Am flight attendant known for professionalism. On 5 September 1986, Pan Am Flight 73 (Boeing
      747, Mumbai–Karachi–Frankfurt–New York) was hijacked at Karachi by men posing as airport security.
      About seventeen hours; the hijackers demanded release of prisoners and were targeting Americans.
      Neerja, the senior flight purser, hid the American passengers' passports. When the hijackers opened
      fire, she opened the emergency door and chute, helped passengers escape instead of jumping first,
      and was shot while shielding three children. Awards: Ashoka Chakra (India's highest peacetime
      gallantry award, posthumous, Republic Day 1987, presented by President Giani Zail Singh, received
      by her mother Rama Bhanot), US Congress Special Courage Award, Flight Safety Foundation Heroism
      Award, Tamgha-e-Pakistan. Neerja Bhanot Pan Am Trust; 2016 film 'Neerja'.
    explanations:
      text: "Neerja was a young flight purser who, during a 17-hour hijacking, kept calm, hid passports to protect Americans, opened the emergency exit and helped passengers escape. She gave her life shielding three children."
      visual: "Draw an aircraft with arrows: hijackers board as 'security' → passports hidden → emergency door and chute opened → passengers escape → Neerja shielding three children."
      step_by_step: "Why did she hide the passports? Step 1: The hijackers were targeting Americans. Step 2: Passports show nationality. Step 3: Without them, the hijackers could not identify the Americans."
      real_world: "Cabin crew on every flight are trained to evacuate passengers in 90 seconds; Neerja's story changed aviation security procedures worldwide."
    activity:
      type: order
      prompt: 'Neerja Bhanot on Pan Am Flight 73: put the events in order.'
      steps:
      - Men posing as security hijack the plane at Karachi
      - Neerja hides the American passengers' passports
      - The hijackers open fire
      - She opens the emergency door and helps people out
      - She is shot shielding three children
      - Ashoka Chakra awarded (Republic Day 1987)
      reasons:
        Neerja hides the American passengers' passports: She acted once she knew Americans were targets.
        The hijackers open fire: This came after about seventeen hours.
        She opens the emergency door and helps people out: She opened the chute when the shooting began.
        She is shot shielding three children: She stayed to help instead of jumping first.
        Ashoka Chakra awarded (Republic Day 1987): The award was given after her death.
    lesson:
      - teach: Neerja Bhanot, born 7 September 1963 in Chandigarh, was a model and then a Pan Am flight attendant. On 5 September 1986, Pan Am Flight 73 (Mumbai–Karachi–Frankfurt–New York) was hijacked at Karachi by men dressed as airport security. The ordeal lasted about seventeen hours.
        check:
          prompt: How did the hijackers get onto the plane?
          options:
          - Dressed as airport security
          - As passengers with tickets
          - Through the cargo hold
          answer: Dressed as airport security
          why: They posed as security staff.
        ways:
        - style: step_by_step
          teach: 'Put the facts in order. 7 September 1963: Neerja Bhanot is born in Chandigarh. Later: she is a model, then a Pan Am flight attendant. 5 September 1986: Pan Am Flight 73 (Mumbai-Karachi-Frankfurt-New York) is hijacked at Karachi by men dressed as airport security. The ordeal lasts about seventeen hours.'
      - teach: The hijackers were looking for Americans. Neerja, the senior purser, hid the American passengers' passports. When firing began, she opened the emergency door and chute and helped passengers out instead of escaping first. She was shot while shielding three children.
        picture:
          kind: flow
          steps:
          - Hijack at Karachi
          - Neerja hides American passports
          - Shooting starts
          - Opens emergency chute
          - Shields three children
          alt: Neerja's actions during the hijack.
        check:
          prompt: Why did Neerja hide the passports?
          options:
          - So the hijackers could not pick out Americans
          - To keep them clean
          - To sell them
          answer: So the hijackers could not pick out Americans
          why: Without passports, nationalities were hard to tell.
        ways:
        - style: step_by_step
          teach: 'Follow Neerja''s choices. Step 1: the hijackers are looking for Americans, so she, the senior purser, hides the American passengers'' passports. Step 2: when firing begins, she opens the emergency door and chute. Step 3: she helps passengers out instead of escaping first. Step 4: she is shot while shielding three children.'
      - teach: She was given the Ashoka Chakra, India's highest peacetime gallantry award, after her death (posthumously) on Republic Day 1987; her mother Rama Bhanot received it. She was also honoured by the USA and Pakistan. A trust and the 2016 film 'Neerja' keep her memory alive.
        check:
          prompt: '''Posthumously'' means'
          options:
          - After death
          - Before birth
          - In secret
          answer: After death
          why: The award was given after she died.
        ways:
        - style: real_world
          teach: Some awards are given to families after the hero has died; the word for that is posthumously. On Republic Day 1987, Neerja was given the Ashoka Chakra, India's highest peacetime gallantry award, and her mother Rama Bhanot received it. The USA and Pakistan also honoured her, and a trust and the 2016 film 'Neerja' keep her memory alive.
    items:
      - prompt: "Which award was Neerja Bhanot given posthumously on Republic Day 1987?"
        options: ["Ashoka Chakra", "Param Vir Chakra", "Bharat Ratna", "Padma Shri"]
        answer: "Ashoka Chakra"
        difficulty: 1
        hints: ["India's highest peacetime gallantry award."]
        solution: "She received the Ashoka Chakra."
        mistakes: {"Param Vir Chakra": neerja_facts}
      - prompt: "Where was Pan Am Flight 73 hijacked?"
        options: ["Karachi International Airport", "Mumbai Airport", "Frankfurt Airport", "New York Airport"]
        answer: "Karachi International Airport"
        difficulty: 1
        hints: ["A scheduled stop in Pakistan."]
        solution: "It was hijacked at Karachi."
        mistakes: {"Mumbai Airport": neerja_facts}
      - prompt: "How long did the hijacking stand-off last, in hours?"
        answer: "17"
        check: "17"
        difficulty: 1
        hints: ["'After a ...-hour standoff'."]
        solution: "About seventeen hours."
        mistakes: {"7": neerja_facts}
      - prompt: "How did Neerja stop the hijackers from identifying American passengers?"
        options: ["She hid their passports", "She changed their seats", "She gave them new names", "She hid them in the cockpit"]
        answer: "She hid their passports"
        difficulty: 2
        hints: ["Documents that show nationality."]
        solution: "She hid the American passengers' passports."
        mistakes: {"She changed their seats": neerja_facts}
      - prompt: "How did the hijackers get onto the aircraft?"
        options: ["They posed as airport security personnel", "They bought tickets", "They were crew members", "They hid in the luggage"]
        answer: "They posed as airport security personnel"
        difficulty: 2
        hints: ["A disguise."]
        solution: "They pretended to be airport security."
        mistakes: {"They bought tickets": "hijackers_disguise", "They were crew members": "hijackers_disguise"}
      - prompt: "How did Neerja lose her life?"
        options: ["She was shot while shielding three children", "She jumped out first and fell", "The plane crashed", "She fell ill"]
        answer: "She was shot while shielding three children"
        difficulty: 2
        hints: ["The title: 'A Shield of Courage'."]
        solution: "She was shot shielding three children from bullets."
        mistakes: {"She jumped out first and fell": read_the_lines}
      - prompt: "Why is the lesson titled 'A Shield of Courage'?"
        options: ["Neerja literally shielded children with her body and protected passengers with brave action", "It is about a soldier's shield", "It describes an award shaped like a shield", "It is about a fight in an ancient war"]
        answer: "Neerja literally shielded children with her body and protected passengers with brave action"
        difficulty: 3
        hints: ["Think of what she did in the last moments."]
        solution: "Her courage became a shield for the passengers and the three children."

        mistakes: {"It is about a soldier's shield": "shield_meaning", "It describes an award shaped like a shield": "shield_meaning"}
      - prompt: "Neerja could have escaped from the plane when the emergency doors were opened. What did she do instead?"
        options: ["She stayed to help passengers out and shielded children from the bullets", "She escaped first and called for help", "She hid in the cockpit", "She argued with the hijackers"]
        answer: "She stayed to help passengers out and shielded children from the bullets"
        difficulty: 3
        hints: ["How did she lose her life?", "Who did she protect?"]
        solution: "Step 1: She chose to stay and help passengers escape. Step 2: She was shot while shielding three children with her body."
        mistakes: {"She escaped first and called for help": under_fire, "She hid in the cockpit": under_fire, "She argued with the hijackers": under_fire}
      - prompt: "Neerja was born on 7 September 1963 and died on 5 September 1986. How old was she when she died?"
        answer: "22"
        check: "1986 - 1963 - 1"
        difficulty: 3
        hints: ["1986 − 1963 = 23.", "Had she reached her birthday in 1986 by 5 September?"]
        solution: "Step 1: She would turn 23 on 7 September 1986. Step 2: She died two days before that birthday, so she was 22."
        mistakes: {"23": neerja_facts, "24": neerja_facts}
      - prompt: Where was Neerja Bhanot born?
        options:
        - Chandigarh
        - Mumbai
        - Karachi
        - New York
        answer: Chandigarh
        difficulty: 1
        hints:
        - It is an Indian city.
        - Mumbai was where the flight began.
        solution: 'Step 1: She was born in 1963 in India. Step 2: Not the flight''s starting city. Step 3: Chandigarh.'
        mistakes:
          Mumbai: neerja_facts
      - prompt: What was Neerja's position on Flight 73?
        options:
        - Senior flight purser
        - Pilot
        - Passenger
        - Airport guard
        answer: Senior flight purser
        difficulty: 2
        hints:
        - She was a flight attendant.
        - She was the senior one in the cabin.
        solution: 'Step 1: She worked in the cabin. Step 2: She led the cabin crew. Step 3: Senior flight purser.'
        mistakes:
          Pilot: neerja_facts
      - prompt: Who received the Ashoka Chakra on Neerja's behalf?
        options:
        - Her mother, Rama Bhanot
        - Her pilot
        - Her brother
        - A passenger
        answer: Her mother, Rama Bhanot
        difficulty: 2
        hints:
        - Neerja had died.
        - A family member accepted it.
        solution: 'Step 1: The award was posthumous. Step 2: A parent accepted it. Step 3: Her mother, Rama Bhanot.'
        mistakes:
          A passenger: e4_neerja_dates
      - prompt: When the emergency chute opened, what did Neerja do?
        options:
