        - She could have escaped.
        - She put others before herself.
        solution: 'Step 1: She opened the door. Step 2: She stayed to guide passengers. Step 3: Helped them out first.'
        mistakes:
          Jumped out first: e4_neerja_choice
      - prompt: What was the flight's final destination?
        options:
        - New York
        - Karachi
        - Frankfurt
        - Mumbai
        answer: New York
        difficulty: 2
        hints:
        - The route was Mumbai–Karachi–Frankfurt–?
        - It was the last stop.
