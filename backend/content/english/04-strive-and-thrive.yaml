  - code: eng9.u4.walk_alone
    title: Walk Alone (Poem)
    after: [eng9.u4.shield_of_courage]
    notes: |
      Poem by Rabindranath Tagore (1861–1941, 'Gurudev', Nobel Prize for Literature 1913), translated by
      Snehendu Kar (the Bengali song 'Ekla Chalo Re'). "If no one listens to your call / Then you must
      walk on alone." If everyone turns away or is afraid, speak your mind alone. If no one joins you on a
      dark road, crush the thorns with your bleeding feet and walk ahead alone. If no one holds up a light
      on a stormy night, set your own heart on fire with the flame of lightning "And shine alone that
      many may aspire." 'Hapless' = unlucky. Devices: repetition (move on alone), apostrophe ("oh my
      hapless one"), metaphor (thorns = obstacles, dark road = hard times, heart on fire = inner
      courage).
    explanations:
      text: "Tagore tells us not to wait for others. If no one supports you, keep going alone; face pain bravely and let your own courage be the light that inspires others."
      visual: "Draw a lone walker on a dark, stormy road, thorns underfoot, a glowing heart lighting the way, and faint figures behind beginning to follow."
      step_by_step: "What does 'crush the thorns ... with your bleeding feet' mean? Step 1: Thorns stand for difficulties. Step 2: Bleeding feet show suffering. Step 3: Go on despite pain and problems."
      real_world: "Gandhiji loved this song; it is still sung to encourage people who stand up for what is right even when they stand alone."
    activity:
      type: sort
      prompt: What does the metaphor in 'Walk Alone' stand for?
      bins:
      - Obstacles
      - Hard times
      - Inner courage
      items:
      - label: Thorns on the path
        bin: Obstacles
        clue: Things that hurt your feet.
        why: Obstacles.
      - label: A dark road
        bin: Hard times
        clue: No light, no company.
        why: Hard times.
      - label: Setting your heart on fire
        bin: Inner courage
        clue: A light from inside you.
        why: Inner courage.
      - label: A stormy night
        bin: Hard times
        clue: Nobody holds up a light.
        why: Hard times.
      - label: Shining alone 'that many may aspire'
        bin: Inner courage
        clue: Your own light inspires others.
        why: Inner courage.
    lesson:
      - teach: '''Walk Alone'' is Snehendu Kar''s translation of Rabindranath Tagore''s Bengali song ''Ekla Chalo Re''. Tagore (''Gurudev'') won the Nobel Prize for Literature in 1913. The poem says: ''If no one listens to your call, then you must walk on alone.'''
        check:
          prompt: What does the poem advise if nobody answers your call?
          options:
          - Walk on alone
          - Go back home
          - Wait for ever
          answer: Walk on alone
          why: Keep going even without company.
        ways:
        - style: real_world
          teach: 'Imagine starting a clean-up drive and nobody turns up. Do you give up? Tagore''s Bengali song ''Ekla Chalo Re'', translated by Snehendu Kar as ''Walk Alone'', says no: ''If no one listens to your call, then you must walk on alone.'' Tagore, ''Gurudev'', won the Nobel Prize for Literature in 1913.'
      - teach: If everyone turns away, speak your mind alone. If no one joins you on a dark road, trample the thorns with bleeding feet and go on. If no one holds a light on a stormy night, set your own heart on fire with lightning 'and shine alone that many may aspire'.
        picture:
          kind: compare
          columns:
          - title: Image
            points:
            - dark road
            - thorns
            - stormy night
            - heart on fire
          - title: Meaning
            points:
            - hard times
            - obstacles
            - danger, no help
            - inner courage
          alt: Metaphors in 'Walk Alone'.
        check:
          prompt: '''Set your own heart on fire'' suggests'
          options:
          - Find courage inside yourself
          - Light a real fire
          - Get angry
          answer: Find courage inside yourself
          why: It is a metaphor for inner strength.
        ways:
        - style: step_by_step
          teach: Read the poem as three 'if... then' pairs. If everyone turns away, then speak your mind alone. If no one joins you on a dark road, then trample the thorns with bleeding feet and go on. If no one holds a light on a stormy night, then set your own heart on fire with lightning 'and shine alone that many may aspire'. The light comes from inside you.
      - teach: 'Devices: repetition (''walk on alone''), apostrophe (speaking to someone: ''oh my hapless one'', hapless = unlucky), and metaphor. Message: follow what is right with courage, even alone; your example can inspire many.'
        check:
          prompt: '''Oh my hapless one'' is an example of'
          options:
          - Apostrophe
          - Simile
          - Onomatopoeia
          answer: Apostrophe
          why: The poet speaks directly to someone.
        ways:
        - style: step_by_step
          teach: 'Name the devices one at a time. A line said again and again (''walk on alone''): repetition. Speaking directly to someone (''oh my hapless one''; hapless means unlucky): apostrophe. Saying one thing is another, like a heart set on fire: metaphor. The message: follow what is right with courage, even alone, and your example can inspire many.'
    items:
      - prompt: "Who wrote the original poem 'Walk Alone'?"
        options: ["Rabindranath Tagore", "John Masefield", "Snehendu Kar", "H. W. Longfellow"]
        answer: "Rabindranath Tagore"
        difficulty: 1
        hints: ["Snehendu Kar only translated it."]
        solution: "Tagore wrote it; Snehendu Kar translated it."
        mistakes: {"Snehendu Kar": walk_alone_message}
      - prompt: "What should you do if no one listens to your call?"
        options: ["Walk on alone", "Go back home", "Wait for others", "Shout louder"]
        answer: "Walk on alone"
        difficulty: 1
        hints: ["The first two lines."]
        solution: "'Then you must walk on alone.'"
        mistakes: {"Go back home": "walk_alone", "Wait for others": "walk_alone"}
      - prompt: "What do 'thorns in your path' stand for?"
        options: ["Difficulties and obstacles in life", "Real plants on the road", "Friends who help you", "Rewards for hard work"]
        answer: "Difficulties and obstacles in life"
        difficulty: 2
        hints: ["A metaphor."]
        solution: "Thorns are a metaphor for obstacles."
        mistakes: {"Real plants on the road": walk_alone_message}
      - prompt: "What does 'Set your own heart on fire' suggest?"
        options: ["Light your inner courage and passion", "Start a real fire", "Become angry with everyone", "Give up hope"]
        answer: "Light your inner courage and passion"
        difficulty: 2
        hints: ["When no one holds up a light..."]
        solution: "Let your own courage be your light."
        mistakes: {"Start a real fire": "heart_fire_metaphor", "Become angry with everyone": "heart_fire_metaphor"}
      - prompt: "In 'oh my hapless one', the word 'hapless' means:"
        options: ["Unlucky", "Happy", "Helpful", "Careless"]
        answer: "Unlucky"
        difficulty: 2
        hints: ["'hap' = luck; '-less' = without."]
        solution: "Hapless = unlucky, unfortunate."
        mistakes: {"Happy": glossary_word}
      - prompt: "What is the meaning of the last line, 'And shine alone that many may aspire'?"
        options: ["Your lonely courage can inspire many others", "You should always stay alone", "Only one person can succeed", "Many people will laugh at you"]
        answer: "Your lonely courage can inspire many others"
        difficulty: 3
        hints: ["aspire = hope to achieve something."]
        solution: "By shining alone, you give others hope and a goal."
        mistakes: {"You should always stay alone": walk_alone_message}
      - prompt: "What is the main message of 'Walk Alone'?"
        options: ["Follow what is right with courage, even if no one joins you", "Always avoid other people", "Wait until everyone agrees before acting", "Walking is good exercise"]
        answer: "Follow what is right with courage, even if no one joins you"
        difficulty: 2
        hints: ["What should you do if no one listens to your call?", "What do the thorns stand for?"]
        solution: "Step 1: The poet expects others may turn away. Step 2: He urges us to keep going alone, bravely, on the path we believe in."
        mistakes: {"Always avoid other people": why_alone, "Wait until everyone agrees before acting": why_alone, "Walking is good exercise": why_alone}
      - prompt: "'Trample the thorns along the way' is an example of which figure of speech?"
        options: ["Metaphor", "Simile", "Onomatopoeia", "Personification"]
        answer: "Metaphor"
        difficulty: 3
        hints: ["What do the thorns really stand for?", "Is there 'like' or 'as'?"]
        solution: "Step 1: Thorns stand for difficulties, with no 'like' or 'as'. Step 2: So it is a metaphor."
        mistakes: {"Simile": is_or_like, "Onomatopoeia": is_or_like, "Personification": walk_alone_message}
      - prompt: Who translated 'Walk Alone' into English?
        options:
        - Snehendu Kar
        - Rabindranath Tagore
        - John Masefield
        - Bethany Hamilton
        answer: Snehendu Kar
        difficulty: 2
        hints:
        - Tagore wrote the original in Bengali.
        - Someone else made the English version.
        solution: 'Step 1: Tagore wrote ''Ekla Chalo Re''. Step 2: It was translated. Step 3: Snehendu Kar.'
        mistakes:
          Rabindranath Tagore: e4_tagore_facts
      - prompt: In which year did Tagore win the Nobel Prize for Literature?
        options:
        - '1913'
        - '1988'
        - '1909'
        - '1947'
        answer: '1913'
        difficulty: 1
        hints:
        - It was before India's independence.
        - Selma Lagerlof won in 1909.
        solution: 'Step 1: Tagore was the first Asian Nobel laureate. Step 2: It was four years after Lagerlof. Step 3: 1913.'
        mistakes:
          '1909': e4_tagore_facts
          '1988': e4_tagore_facts
      - prompt: What is the Bengali title of the song?
        options:
        - Ekla Chalo Re
        - Jana Gana Mana
        - Vande Mataram
        - Gitanjali
        answer: Ekla Chalo Re
        difficulty: 2
        hints:
        - '''Ekla'' means alone.'
        - '''Chalo'' means walk.'
        solution: 'Step 1: The poem means ''walk alone''. Step 2: In Bengali: ekla = alone, chalo = walk. Step 3: Ekla Chalo Re.'
        mistakes:
          Gitanjali: e4_tagore_facts
      - prompt: In the poem, the 'dark road' stands for
        options:
        - A difficult time in life
        - A real road at night
        - A road with no lights
        - A short journey
        answer: A difficult time in life
        difficulty: 2
        hints:
        - It is a metaphor.
        - Darkness often means trouble.
        solution: 'Step 1: The road is not literal. Step 2: Dark suggests trouble and fear. Step 3: A difficult time.'
        mistakes:
          A real road at night: e4_image_meaning
      - prompt: What does 'many may aspire' mean in the last line?
        options:
        - Many people may be inspired to try
        - Many people may get angry
        - Many people may sleep
        - Many people may leave
        answer: Many people may be inspired to try
        difficulty: 3
        hints:
        - To aspire is to hope or aim high.
        - What does a shining example do for others?
        solution: 'Step 1: Aspire = aim for something high. Step 2: Your shining example encourages others. Step 3: Many may be inspired.'
        mistakes:
          Many people may get angry: walk_alone_message
      - prompt: Which word is repeated to stress the poem's message?
        options:
        - alone
        - storm
        - thorns
        - light
        answer: alone
        difficulty: 1
        hints:
        - Look at the end of each stanza.
        - It is in the title too.
        solution: 'Step 1: Each stanza ends the same way. Step 2: The key word is in the title. Step 3: alone.'
        mistakes:
          storm: e4_image_meaning
      - prompt: When others are afraid and turn away, the poem says you should
        options:
        - Speak your mind alone
        - Stay silent
        - Run away too
        - Wait for them
        answer: Speak your mind alone
        difficulty: 2
        hints:
        - The poem never says to give up.
        - Even alone, use your voice.
        solution: 'Step 1: Others turn away in fear. Step 2: The poet asks you not to be silent. Step 3: Speak your mind alone.'
        mistakes:
          Stay silent: walk_alone

  - code: eng9.u4.grammar
    title: "Grammar: reported questions, I wish and idioms"
    after: [eng9.u4.soul_surfer]
    notes: |
      Reported wh-questions: keep the wh-word; change to statement order; drop do/does/did; shift tense
      back (present → past, past → past perfect, will → would); change pronouns and time/place words.
      Reporting verbs: asked, enquired, wanted to know. "Where do you surf?" → He asked her where she
      surfed. "Why did you go back to the water?" → She asked why I had gone back to the water. Wishes:
      I wish + simple past for present situations (I wish I had a surfboard = I don't have one); I wish +
      past perfect for past regrets (I wish I had listened). 'I wish I were' is also correct. Idioms
      from the lesson: out of the blue (suddenly, unexpectedly), a split second (a very brief moment),
      crystal clear (very clear), put your mind to (concentrate effort on).
    explanations:
      text: "When we report a question, it stops being a question: no question mark, no 'did', and the subject comes before the verb. 'I wish' takes a step back in time: past for now, past perfect for then."
      visual: "Draw two speech bubbles. Left: 'Where do you live?' Right box: She asked me where I lived. Circle how 'do' disappears and 'live' becomes 'lived'."
      step_by_step: "Report: Reporter to Bethany, 'What will you do next?' Step 1: asked + what. Step 2: you → she, will → would. Step 3: The reporter asked Bethany what she would do next."
      real_world: "Journalists use reported questions in news stories: 'The reporter asked the minister when the road would be repaired.'"
    activity:
      type: sort
      prompt: Report the question. Which is correct?
      bins:
      - Correct
      - Wrong
      items:
      - label: He asked her where she surfed.
        bin: Correct
        clue: Statement order, tense back one step.
        why: Correct.
      - label: He asked her where did she surf.
        bin: Wrong
        clue: Is 'did' needed in a reported question?
        why: 'Drop ''did'' and use statement order: where she surfed.'
      - label: She asked why I had gone back to the water.
        bin: Correct
        clue: Past → past perfect.
        why: Correct.
      - label: She asked why had I gone back to the water.
        bin: Wrong
        clue: Word order.
        why: 'Use statement order: why I had gone.'
      - label: He wanted to know where I lived.
        bin: Correct
        clue: wh-word kept, statement order.
        why: Correct.
      - label: He asked where do you live.
        bin: Wrong
        clue: Tense, pronoun and order.
        why: He asked where I lived.
    lesson:
      - teach: 'To report a wh-question: keep the wh-word, use statement order (subject before verb), drop do/does/did, shift the tense back and change pronouns. "Where do you live?" he asked me → He asked me where I lived.'
        picture:
          kind: flow
          steps:
          - '"What are you reading?" she asked him.'
          - keep 'what'
          - 'statement order: he was reading'
          - She asked him what he was reading.
          alt: Reporting a wh-question.
        check:
          prompt: 'Report: "Why is he late?" Mum asked.'
          options:
          - Mum asked why he was late.
          - Mum asked why was he late?
          - Mum asked why is he late.
          answer: Mum asked why he was late.
          why: Statement order, tense back, no question mark.
        ways:
        - style: real_world
          teach: 'Imagine telling your friend what the new neighbour asked you. He said, ''Where do you live?'' You report: ''He asked me where I lived.'' The wh-word stays, the subject comes before the verb like a statement, ''do'' disappears, the tense moves back one step, and ''you'' becomes ''I''.'
      - teach: 'Tense shifts: present → past (is → was, do → did), past → past perfect (went → had gone), will → would. Time words change too: tomorrow → the next day, today → that day, here → there.'
        check:
          prompt: In reported speech, 'tomorrow' becomes
          options:
          - the next day
          - yesterday
          - today
          answer: the next day
          why: The reporting happens later, so the time word shifts.
        ways:
        - style: step_by_step
          teach: 'Shift each part back one step. Tense: is -> was, do -> did, went -> had gone, will -> would. Time and place: today -> that day, tomorrow -> the next day, here -> there. Check every verb and every time word before you write the reported sentence.'
      - teach: 'Wishes: ''I wish + past'' for things now (I wish I knew the answer = I don''t know it). ''I wish + had + past participle'' for regrets about the past (I wish I had studied = I didn''t). Idioms: out of the blue (suddenly), a split second (a tiny moment), crystal clear (very clear).'
        picture:
          kind: compare
          columns:
          - title: Wish about now
            points:
            - I wish I had a bike.
            - (I don't have one.)
          - title: Regret about the past
            points:
            - I wish I had listened.
            - (I didn't listen.)
          alt: Two kinds of wishes.
        check:
          prompt: '''I can''t swim. I wish I ___ swim.'''
          options:
          - could
          - can
          - had could
          answer: could
          why: A wish about now uses the past form.
        ways:
        - style: step_by_step
          teach: 'Choose the wish form in two steps. Step 1: is the wish about now or the past? Step 2: now takes ''I wish + past'' (I wish I knew = I don''t know). The past takes ''I wish + had + past participle'' (I wish I had studied = I didn''t). Idioms in the unit: out of the blue (suddenly), a split second (a tiny moment), crystal clear (very clear).'
    items:
      - prompt: "Report: The reporter asked Bethany, \"Where do you surf?\""
        options: ["The reporter asked Bethany where she surfed.", "The reporter asked Bethany where did she surf.", "The reporter asked Bethany where do you surf.", "The reporter asked Bethany that where she surfs?"]
        answer: "The reporter asked Bethany where she surfed."
        difficulty: 1
        hints: ["No 'do/did'; statement order; past tense."]
        solution: "where + she + surfed."
        mistakes: {"The reporter asked Bethany where did she surf.": reported_question}
      - prompt: "Report: He asked me, \"Why are you crying?\""
        options: ["He asked me why I was crying.", "He asked me why was I crying.", "He asked me why are you crying.", "He asked me why I am crying?"]
        answer: "He asked me why I was crying."
        difficulty: 2
        hints: ["are → was; subject before verb."]
        solution: "why + I + was crying."
        mistakes: {"He asked me why was I crying.": reported_question}
      - prompt: "Report: Alana asked Bethany, \"When did you start surfing?\""
        options: ["Alana asked Bethany when she had started surfing.", "Alana asked Bethany when did she start surfing.", "Alana asked Bethany when you started surfing.", "Alana asked when Bethany starts surfing?"]
        answer: "Alana asked Bethany when she had started surfing."
        difficulty: 3
        hints: ["Past simple → past perfect in reported speech."]
        solution: "did start → had started; you → she."
        mistakes: {"Alana asked Bethany when did she start surfing.": reported_question}
      - prompt: "Complete: 'I don't know how to swim. I wish I ___ how to swim.'"
        options: ["knew", "know", "had known", "will know"]
        answer: "knew"
        difficulty: 1
        hints: ["A wish about the present takes the simple past."]
        solution: "Present wish → I wish I knew."
        mistakes: {"know": wish_form}
      - prompt: "Complete: 'I missed the match yesterday. I wish I ___ it.'"
        options: ["had watched", "watched", "watch", "would watch"]
        answer: "had watched"
        difficulty: 2
        hints: ["A regret about the past takes the past perfect."]
        solution: "Past regret → I wish I had watched it."
        mistakes: {"watched": wish_form}
      - prompt: "'It came literally out of the blue.' What does 'out of the blue' mean?"
        options: ["Suddenly and unexpectedly", "From the sky", "From the sea", "Very slowly"]
        answer: "Suddenly and unexpectedly"
        difficulty: 1
        hints: ["She had no warning at all."]
        solution: "Out of the blue = without warning."
        mistakes: {"From the sea": idiom_meaning, "From the sky": idiom_meaning}
      - prompt: "'That's all it took: a split second.' A 'split second' is:"
        options: ["A very brief moment", "Two seconds", "A broken clock", "A second chance"]
        answer: "A very brief moment"
        difficulty: 2
        hints: ["Lightning-fast."]
        solution: "A split second = an extremely short time."
        mistakes: {"A second chance": idiom_meaning}
      - prompt: "Complete: 'I didn't take my umbrella and got wet. I wish I ___ it.'"
        options: ["had taken", "took", "take", "would take"]
        answer: "had taken"
        difficulty: 2
        hints: ["Is this a regret about the past or a wish about now?", "Past regret → had + past participle."]
        solution: "Step 1: Getting wet already happened. Step 2: A regret about the past uses 'I wish I had taken it'."
        mistakes: {"took": past_wish, "take": past_wish, "would take": past_wish}
      - prompt: "Report: Bethany said, \"I will surf again tomorrow.\""
        options: ["Bethany said that she would surf again the next day.", "Bethany said that I will surf again tomorrow.", "Bethany said that she will surf again tomorrow.", "Bethany said that she would surf again tomorrow."]
        answer: "Bethany said that she would surf again the next day."
        difficulty: 3
        hints: ["will → would.", "What does 'tomorrow' become in reported speech?"]
        solution: "Step 1: I → she, will → would. Step 2: tomorrow → the next day."
        mistakes: {"Bethany said that I will surf again tomorrow.": report_shift, "Bethany said that she will surf again tomorrow.": report_shift, "Bethany said that she would surf again tomorrow.": report_shift}
      - prompt: 'Report: She asked me, "What is your name?"'
        options:
        - She asked me what my name was.
        - She asked me what is my name.
        - She asked me what was your name?
        - She asked what my name is?
        answer: She asked me what my name was.
        difficulty: 2
        hints:
        - Change 'your' to fit the speaker.
        - Put the subject before the verb and shift the tense.
        solution: 'Step 1: your → my. Step 2: Statement order: my name was. Step 3: She asked me what my name was.'
        mistakes:
          She asked me what is my name.: e4_wh_order
      - prompt: 'Report: He asked her, "Where did you go?"'
        options:
        - He asked her where she had gone.
        - He asked her where did she go.
        - He asked her where she goes.
        - He asked her where you went.
        answer: He asked her where she had gone.
        difficulty: 3
        hints:
        - Drop 'did' and use statement order.
        - Simple past moves back to past perfect.
        solution: 'Step 1: Drop did. Step 2: went → had gone. Step 3: He asked her where she had gone.'
        mistakes:
          He asked her where did she go.: e4_wh_order
          He asked her where she goes.: e4_tense_back
      - prompt: 'Complete: ''It''s raining. I wish it ___ sunny.'''
        options:
        - were
        - is
        - will be
        - has been
        answer: were
        difficulty: 2
        hints:
        - This is a wish about now.
        - Wishes about now use a past form; with 'be', 'were' is used.
        solution: 'Step 1: Wish about the present. Step 2: Use the past form. Step 3: were.'
        mistakes:
          is: e4_wish_time
      - prompt: 'Complete: ''I forgot her birthday. I wish I ___ it.'''
        options:
        - had remembered
        - remember
        - remembered
        - will remember
        answer: had remembered
        difficulty: 2
        hints:
        - The forgetting is in the past.
        - Regrets about the past use had + past participle.
        solution: 'Step 1: Past event. Step 2: Regret → past perfect. Step 3: had remembered.'
        mistakes:
          remembered: e4_wish_time
      - prompt: '''The instructions were crystal clear.'' What does ''crystal clear'' mean?'
        options:
        - Very easy to understand
        - Made of glass
        - Hard to read
        - Shiny
        answer: Very easy to understand
        difficulty: 1
        hints:
        - Think of clear water you can see through.
        - Instructions can't be made of crystal.
        solution: 'Step 1: Crystal is very transparent. Step 2: Applied to instructions, it means no confusion. Step 3: Very easy to understand.'
        mistakes:
          Made of glass: e4_idiom_sense
      - prompt: 'Report: The coach asked us, "Who will lead the team?"'
        options:
        - The coach asked us who would lead the team.
        - The coach asked us who will lead the team?
        - The coach asked who leads the team.
        - The coach asked us who led the team.
        answer: The coach asked us who would lead the team.
        difficulty: 3
        hints:
        - '''Who'' is the subject here, so the order stays.'
        - Change 'will' as reported speech needs.
        solution: 'Step 1: Keep ''who''. Step 2: will → would. Step 3: The coach asked us who would lead the team.'
        mistakes:
          The coach asked us who will lead the team?: e4_tense_back

  - code: eng9.u4.words
    title: "Words: phrasal verbs with 'out' and words used as noun and verb"
    after: [eng9.u4.soul_surfer]
    notes: |
      Phrasal verbs with 'out': make out (see or understand with difficulty: "I couldn't make out any of
      the details"), figure out (find the answer), freak out (panic), pass out (faint), roll out
      (launch), find out (discover), carry out (do). Words used as both noun and verb: surf (n: the
      waves; v: ride the waves), stub, saw, hand, board, guard, shield (n: protective plate; v: protect).
      Glossary: tourniquet (a tight band to stop bleeding), resilience (ability to recover), tenacity
      (determination), posthumously (after death), purser (senior cabin attendant), hostage, evacuation,
      hapless. Functions: making offers ("May I offer you...?", "Would you like...?"), giving a pep talk
      (encouraging words).
    explanations:
      text: "Many English words can be both a thing and an action: a 'shield' protects, and you can 'shield' someone. Phrasal verbs with 'out' often mean finding, losing control, or making something appear."
      visual: "Two-column chart: noun | verb. surf: the surf was calm | she surfs every day. shield: a metal shield | she shielded the children."
      step_by_step: "'I couldn't make out any of the details.' Step 1: make out is a phrasal verb. Step 2: Here it is about seeing. Step 3: It means she couldn't see clearly."
      real_world: "Doctors and first-aid trainers teach how to apply a tourniquet in an emergency, just as Holt did."
    activity:
      type: sort
      prompt: Match the phrasal verb with 'out'.
      bins:
      - Faint
      - Panic
      - Find the answer
      - See with difficulty
      items:
      - label: pass out
        bin: Faint
        clue: Lose consciousness.
        why: pass out = faint.
      - label: freak out
        bin: Panic
        clue: Lose control from fear.
        why: freak out = panic.
      - label: figure out
        bin: Find the answer
        clue: Solve it.
        why: figure out = find the answer.
      - label: make out
        bin: See with difficulty
        clue: '''I couldn''t make out the details.'''
        why: make out = see or understand with difficulty.
      - label: find out
        bin: Find the answer
        clue: Discover.
        why: find out = discover.
    lesson:
      - teach: 'Phrasal verbs with ''out'': make out (see or understand with difficulty), figure out (solve), freak out (panic), pass out (faint), find out (discover), carry out (do), roll out (launch).'
        picture:
          kind: compare
          columns:
          - title: Seeing / solving
            points:
            - 'make out: see dimly'
            - 'figure out: solve'
            - 'find out: discover'
          - title: Feeling / doing
            points:
            - 'freak out: panic'
            - 'pass out: faint'
            - 'carry out: do'
          alt: Phrasal verbs with 'out'.
        check:
          prompt: '''The police will find out the truth'' means they will'
          options:
          - Discover it
          - Hide it
          - Faint
          answer: Discover it
          why: Find out = discover.
        ways:
        - style: real_world
          teach: Use 'out' phrasal verbs in one story. In the fog I could just make out the bus (see with difficulty). I couldn't figure out the route (solve). I started to freak out (panic). A man nearly passed out in the heat (fainted). Later I found out the bus had been cancelled (discovered). The company carried out repairs (did) and rolled out a new timetable (launched).
      - teach: 'Some words are both nouns and verbs. Shield: a shield (noun) / to shield someone (verb). Surf: the surf (waves) / to surf. Hand: a hand / hand me the book. Lesson words: tourniquet (band to stop bleeding), resilience (bouncing back), tenacity (determination), purser (senior cabin attendant), hostage, evacuation.'
        check:
          prompt: In 'Please hand me the salt', 'hand' is a
          options:
          - Verb
          - Noun
          - Adjective
          answer: Verb
          why: It names the action of giving.
        ways:
        - style: step_by_step
          teach: 'Test a word in two steps. Step 1: can you put ''a'' or ''the'' before it? Then it is a noun: a shield, the surf, a hand. Step 2: does it say what someone does? Then it is a verb: to shield someone, to surf, hand me the book. Lesson words: tourniquet, resilience (bouncing back), tenacity (determination), purser (senior cabin attendant), hostage, evacuation.'
    items:
      - prompt: "'I couldn't make out any of the details.' What does 'make out' mean here?"
        options: ["See or understand clearly", "Build something", "Leave quickly", "Become friends"]
        answer: "See or understand clearly"
        difficulty: 1
        hints: ["It happened in a flash."]
        solution: "make out = see with difficulty."
        mistakes: {"Build something": phrasal_verb}
      - prompt: "Choose the phrasal verb that means 'to faint':"
        options: ["pass out", "figure out", "roll out", "find out"]
        answer: "pass out"
        difficulty: 2
        hints: ["To lose consciousness."]
        solution: "pass out = faint."
        mistakes: {"roll out": phrasal_verb}
      - prompt: "In which sentence is 'shield' used as a verb?"
        options: ["She shielded three children from the bullets.", "The knight carried a heavy shield.", "The shield was made of iron.", "A Shield of Courage is a true story."]
        answer: "She shielded three children from the bullets."
        difficulty: 2
        hints: ["Look for the action."]
        solution: "'shielded' is the action (verb)."
        mistakes: {"The knight carried a heavy shield.": "noun_or_verb", "The shield was made of iron.": "noun_or_verb"}
      - prompt: "What is a 'tourniquet'?"
        options: ["A tight band used to stop bleeding", "A surfing competition", "A kind of shark", "A tour guide"]
        answer: "A tight band used to stop bleeding"
        difficulty: 1
        hints: ["Holt used his rash guard as one."]
        solution: "A tourniquet stops heavy bleeding from a limb."
        mistakes: {"A tour guide": glossary_word}
      - prompt: "'Neerja was posthumously conferred the Ashoka Chakra.' 'Posthumously' means:"
        options: ["After death", "Before birth", "In public", "With great joy"]
        answer: "After death"
        difficulty: 2
        hints: ["She had died during the hijacking."]
        solution: "Posthumously = after a person's death."
        mistakes: {"In public": glossary_word}
      - prompt: "Which is the most polite way to make an offer?"
        options: ["Would you like some water?", "Take water.", "You want water or not?", "Drink this."]
        answer: "Would you like some water?"
        difficulty: 1
        hints: ["'Would you like...' is polite."]
        solution: "'Would you like...?' is a polite offer."
        mistakes: {"Take water.": "polite_offer", "Drink this.": "polite_offer"}
      - prompt: "'The engineers finally figured out the problem.' What does 'figured out' mean?"
        options: ["Found the answer to", "Drew a picture of", "Fainted because of", "Counted"]
        answer: "Found the answer to"
        difficulty: 2
        hints: ["Replace the phrasal verb with a one-word meaning.", "'Solved' would fit."]
        solution: "Step 1: 'Figure out' means find the answer or understand. Step 2: They solved the problem."
        mistakes: {"Drew a picture of": phrasal_out, "Fainted because of": phrasal_out, "Counted": phrasal_out}
      - prompt: "In which sentence is 'surf' used as a noun?"
        options: ["The surf was rough that morning.", "Bethany surfs every day.", "They surfed till sunset.", "Can you surf?"]
        answer: "The surf was rough that morning."
        difficulty: 3
        hints: ["A noun names a thing; a verb is an action.", "Which 'surf' comes after 'the'?"]
        solution: "Step 1: In the other sentences surf is something someone does. Step 2: 'The surf' names the waves, so it is a noun."
        mistakes: {"Bethany surfs every day.": noun_or_verb, "They surfed till sunset.": noun_or_verb, "Can you surf?": noun_or_verb}
      - prompt: "Which sentence uses 'guard' as a verb?"
        options:
        - "Two dogs guard the gate at night."
        - "The guard opened the gate."
        - "He wore a shin guard."
        - "The night guard was asleep."
        answer: "Two dogs guard the gate at night."
        difficulty: 3
        hints: ["A verb is an action; a noun names a person or thing.", "In which sentence is 'guard' something someone does?"]
        solution: "Step 1: In 'Two dogs guard the gate', 'guard' is what the dogs do, so it is a verb. Step 2: In the others it names a person or a thing, so it is a noun."
        mistakes: {"The guard opened the gate.": noun_or_verb, "He wore a shin guard.": noun_or_verb, "The night guard was asleep.": noun_or_verb}
      - prompt: Which phrasal verb means 'to panic'?
        options:
        - freak out
        - carry out
        - roll out
        - find out
        answer: freak out
        difficulty: 1
        hints:
        - It describes a sudden strong fear.
        - Carry, roll and find are about doing things calmly.
        solution: 'Step 1: Carry out = do; roll out = launch; find out = discover. Step 2: Panic is left. Step 3: freak out.'
        mistakes:
          carry out: e4_out_verbs
      - prompt: '''The company will roll out the new app next week.'' What does ''roll out'' mean?'
        options:
        - Launch
        - Delete
        - Faint
        - Discover
        answer: Launch
        difficulty: 2
        hints:
        - Something new is being offered to people.
        - It is about starting, not ending.
        solution: 'Step 1: A new app is coming. Step 2: It is being released. Step 3: Launch.'
        mistakes:
          Faint: e4_out_verbs
      - prompt: What does 'tenacity' mean?
        options:
        - Determination to keep going
        - Fear
        - Laziness
        - Speed
        answer: Determination to keep going
        difficulty: 2
        hints:
        - Bethany and Neerja both showed it.
        - It means not letting go.
        solution: 'Step 1: Tenacious people hold on. Step 2: They don''t give up. Step 3: Determination.'
        mistakes:
          Fear: glossary_word
      - prompt: In which sentence is 'board' used as a verb?
        options:
        - Passengers board the plane at gate 5.
        - She stood on her board.
        - The board was broken.
        - Write it on the board.
        answer: Passengers board the plane at gate 5.
        difficulty: 3
        hints:
        - Look for 'board' as an action someone does.
        - Can you put 'the' before it?
        solution: 'Step 1: Three uses name a thing (the board). Step 2: One shows people getting on. Step 3: Passengers board the plane.'
        mistakes:
          She stood on her board.: e4_noun_verb_test
      - prompt: A person held prisoner by hijackers is a
        options:
        - Hostage
        - Purser
        - Pilot
        - Tourist
        answer: Hostage
        difficulty: 1
        hints:
        - They are kept against their will.
        - Hijackers use them to make demands.
        solution: 'Step 1: Hijackers hold people. Step 2: Such captives have a name. Step 3: Hostage.'
        mistakes:
          Purser: glossary_word
      - prompt: '''Evacuation'' means'
        options:
        - Moving people out of danger
        - Cleaning a room
        - Reading quickly
        - A celebration
        answer: Moving people out of danger
        difficulty: 2
        hints:
        - Neerja opened the emergency chute for this.
        - Think of an emergency exit.
        solution: 'Step 1: In emergencies people must leave. Step 2: Getting everyone out safely has a name. Step 3: Evacuation.'
        mistakes:
          A celebration: glossary_word
