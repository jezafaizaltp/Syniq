# Class 9 English (Kerala Reader), Unit IV. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part II text supplied by the school.
# Also uses tips from earlier units: read_the_lines, glossary_word, phrasal_verb.
subject: eng
chapter: 4
title: "Unit IV: Strive and Thrive"

tips:
  bethany_facts: "Bethany Hamilton was 13 when a tiger shark took her left arm while surfing off Kauai, Hawaii. Holt used his rash guard as a tourniquet; she went back to surfing and wanted to be the best surf photographer."
  neerja_facts: "Neerja Bhanot, senior purser of Pan Am Flight 73 (hijacked at Karachi, 5 Sep 1986), hid the American passengers' passports, opened the emergency exit and was shot shielding three children. Ashoka Chakra, Republic Day 1987."
  walk_alone_message: "'Walk Alone' says: if no one joins you, go on alone with courage, and light your own heart so that others may be inspired."
  reported_question: "Reported wh-question: keep the wh-word, use statement word order (no 'did/does'), shift the tense back and change pronouns: 'Where do you surf?' → He asked her where she surfed."
  wish_form: "'I wish' + simple past for a present wish (I wish I knew); 'I wish' + past perfect for a regret about the past (I wish I had gone)."
  idiom_meaning: "An idiom's meaning is not the sum of its words: 'out of the blue' = suddenly, 'a split second' = a very short moment, 'crystal clear' = very clear."

concepts:
  - code: eng9.u4.soul_surfer
    title: The Unstoppable Soul Surfer
    notes: |
      Autobiographical extract by Bethany Hamilton. At thirteen, while relaxing on her board in calm,
      crystal-clear water at Kauai, Hawaii, with her friend Alana Blanchard, a tiger shark attacked "out
      of the blue" — "a split second", a flash of grey, and her left arm was gone. She stayed calm,
      paddled to shore; Alana's father Holt tied his rash guard round her arm as a tourniquet; Alana's
      brother Byron helped. She was rushed to hospital, where Dr Rovinsky operated. She thought of
      becoming the best surf photographer in the world if she could not surf. Brothers Timothy and
      Noah. Returning to surfing, she struggled at first, then on her dad's shout "Bethany, try it one
      more time" she stood up on a wave. People ask for autographs and call her an inspiration. Her
      story became the film 'Soul Surfer'. Themes: resilience, determination, faith, family support.
    explanations:
      text: "Bethany lost her left arm to a shark at thirteen, but she did not lose her love of surfing. With calm courage, quick help from friends and family, and stubborn practice, she returned to the waves and became an inspiration."
      visual: "Draw a timeline: calm morning surf → flash of grey (attack) → tourniquet from Holt's rash guard → hospital → first try back in the water → standing on a wave → inspiring others."
      step_by_step: "Why did Holt tie the rash guard tightly round her arm? Step 1: She was losing a lot of blood. Step 2: A tight band (tourniquet) slows the bleeding. Step 3: That kept her alive until she reached hospital."
      real_world: "Many athletes return after serious injuries; Bethany went on to surf in professional competitions with one arm."
    items:
      - prompt: "How old was Bethany Hamilton when the shark attacked her?"
        answer: "13"
        check: "13"
        difficulty: 1
        hints: ["'For thirteen year old Bethany Hamilton...'"]
        solution: "She was thirteen."
        mistakes: {"18": bethany_facts}
      - prompt: "Where did the shark attack take place?"
        options: ["Kauai, Hawaii", "Karachi, Pakistan", "Kovalam, Kerala", "Sydney, Australia"]
        answer: "Kauai, Hawaii"
        difficulty: 1
        hints: ["She surfs there almost every morning."]
        solution: "It happened off Kauai in Hawaii."
        mistakes: {"Karachi, Pakistan": bethany_facts}
      - prompt: "What kind of shark attacked Bethany?"
        options: ["A tiger shark", "A whale shark", "A hammerhead shark", "A great white shark"]
        answer: "A tiger shark"
        difficulty: 1
        hints: ["Its name is also a big cat."]
        solution: "'the huge jaws of a massive tiger shark'."
      - prompt: "How did Holt help to save Bethany's life?"
        options: ["He tied his rash guard round her arm as a tourniquet", "He fought the shark", "He drove the ambulance", "He operated on her"]
        answer: "He tied his rash guard round her arm as a tourniquet"
        difficulty: 2
        hints: ["It stopped the bleeding."]
        solution: "Holt's rash guard, tied tight, acted as a tourniquet."
        mistakes: {"He operated on her": bethany_facts}
      - prompt: "What did Bethany want to become if she could not surf again?"
        options: ["The best surf photographer in the world", "A doctor", "A swimming coach", "A shark scientist"]
        answer: "The best surf photographer in the world"
        difficulty: 2
        hints: ["She would still be on the water with a camera."]
        solution: "She wanted to be the best surf photographer."
        mistakes: {"A doctor": read_the_lines}
      - prompt: "What helped Bethany finally stand up on a wave after the attack?"
        options: ["Her dad shouting, 'Bethany, try it one more time'", "A new, bigger board", "Giving up and trying a week later", "Surfing in a swimming pool"]
        answer: "Her dad shouting, 'Bethany, try it one more time'"
        difficulty: 2
        hints: ["Family encouragement."]
        solution: "Her father encouraged her to try once more, and she stood up."
      - prompt: "Which quality is shown most strongly in Bethany's story?"
        options: ["Resilience: bouncing back after a terrible setback", "Greed", "Jealousy", "Laziness"]
        answer: "Resilience: bouncing back after a terrible setback"
        difficulty: 3
        hints: ["She returned to the sport she loved."]
        solution: "Her return to surfing after losing an arm shows resilience and determination."

  - code: eng9.u4.shield_of_courage
    title: A Shield of Courage
    after: [eng9.u4.soul_surfer]
    notes: |
      Biographical account of Neerja Bhanot, born 7 September 1963 in Chandigarh; first a model, then a
      Pan Am flight attendant known for professionalism. On 5 September 1986, Pan Am Flight 73 (Boeing
      747, Mumbai–Karachi–Frankfurt–New York) was hijacked at Karachi by men posing as airport security.
      About seventeen hours; the hijackers demanded release of prisoners and were targeting Americans.
      Neerja, the senior flight purser, hid the American passengers' passports. When the hijackers opened
      fire, she opened the emergency door and chute, helped passengers escape instead of jumping first,
      and was shot while shielding three children. Awards: Ashoka Chakra (India's highest peacetime
      gallantry award, posthumous, Republic Day 1987, presented by President Giani Zail Singh, received
      by her mother Rama Bhanot), US Congress Special Courage Award, Flight Safety Foundation Heroism
      Award, Tamgha-e-Pakistan. Neerja Bhanot Pan Am Trust; 2016 film 'Neerja'.
    explanations:
      text: "Neerja was a young flight purser who, during a 17-hour hijacking, kept calm, hid passports to protect Americans, opened the emergency exit and helped passengers escape. She gave her life shielding three children."
      visual: "Draw an aircraft with arrows: hijackers board as 'security' → passports hidden → emergency door and chute opened → passengers escape → Neerja shielding three children."
      step_by_step: "Why did she hide the passports? Step 1: The hijackers were targeting Americans. Step 2: Passports show nationality. Step 3: Without them, the hijackers could not identify the Americans."
      real_world: "Cabin crew on every flight are trained to evacuate passengers in 90 seconds; Neerja's story changed aviation security procedures worldwide."
    items:
      - prompt: "Which award was Neerja Bhanot given posthumously on Republic Day 1987?"
        options: ["Ashoka Chakra", "Param Vir Chakra", "Bharat Ratna", "Padma Shri"]
        answer: "Ashoka Chakra"
        difficulty: 1
        hints: ["India's highest peacetime gallantry award."]
        solution: "She received the Ashoka Chakra."
        mistakes: {"Param Vir Chakra": neerja_facts}
      - prompt: "Where was Pan Am Flight 73 hijacked?"
        options: ["Karachi International Airport", "Mumbai Airport", "Frankfurt Airport", "New York Airport"]
        answer: "Karachi International Airport"
        difficulty: 1
        hints: ["A scheduled stop in Pakistan."]
        solution: "It was hijacked at Karachi."
        mistakes: {"Mumbai Airport": neerja_facts}
      - prompt: "How long did the hijacking stand-off last, in hours?"
        answer: "17"
        check: "17"
        difficulty: 1
        hints: ["'After a ...-hour standoff'."]
        solution: "About seventeen hours."
        mistakes: {"7": neerja_facts}
      - prompt: "How did Neerja stop the hijackers from identifying American passengers?"
        options: ["She hid their passports", "She changed their seats", "She gave them new names", "She hid them in the cockpit"]
        answer: "She hid their passports"
        difficulty: 2
        hints: ["Documents that show nationality."]
        solution: "She hid the American passengers' passports."
        mistakes: {"She changed their seats": neerja_facts}
      - prompt: "How did the hijackers get onto the aircraft?"
        options: ["They posed as airport security personnel", "They bought tickets", "They were crew members", "They hid in the luggage"]
        answer: "They posed as airport security personnel"
        difficulty: 2
        hints: ["A disguise."]
        solution: "They pretended to be airport security."
      - prompt: "How did Neerja lose her life?"
        options: ["She was shot while shielding three children", "She jumped out first and fell", "The plane crashed", "She fell ill"]
        answer: "She was shot while shielding three children"
        difficulty: 2
        hints: ["The title: 'A Shield of Courage'."]
        solution: "She was shot shielding three children from bullets."
        mistakes: {"She jumped out first and fell": read_the_lines}
      - prompt: "Why is the lesson titled 'A Shield of Courage'?"
        options: ["Neerja literally shielded children with her body and protected passengers with brave action", "It is about a soldier's shield", "It describes an award shaped like a shield", "It is about a fight in an ancient war"]
        answer: "Neerja literally shielded children with her body and protected passengers with brave action"
        difficulty: 3
        hints: ["Think of what she did in the last moments."]
        solution: "Her courage became a shield for the passengers and the three children."

  - code: eng9.u4.walk_alone
    title: Walk Alone (Poem)
    after: [eng9.u4.shield_of_courage]
    notes: |
      Poem by Rabindranath Tagore (1861–1941, 'Gurudev', Nobel Prize for Literature 1913), translated by
      Snehendu Kar (the Bengali song 'Ekla Chalo Re'). "If no one listens to your call / Then you must
      walk on alone." If everyone turns away or is afraid, speak your mind alone. If no one joins you on a
      dark road, crush the thorns with your bleeding feet and walk ahead alone. If no one holds up a light
      on a stormy night, set your own heart on fire with the flame of lightning "And shine alone that
      many may aspire." 'Hapless' = unlucky. Devices: repetition (move on alone), apostrophe ("oh my
      hapless one"), metaphor (thorns = obstacles, dark road = hard times, heart on fire = inner
      courage).
    explanations:
      text: "Tagore tells us not to wait for others. If no one supports you, keep going alone; face pain bravely and let your own courage be the light that inspires others."
      visual: "Draw a lone walker on a dark, stormy road, thorns underfoot, a glowing heart lighting the way, and faint figures behind beginning to follow."
      step_by_step: "What does 'crush the thorns ... with your bleeding feet' mean? Step 1: Thorns stand for difficulties. Step 2: Bleeding feet show suffering. Step 3: Go on despite pain and problems."
      real_world: "Gandhiji loved this song; it is still sung to encourage people who stand up for what is right even when they stand alone."
    items:
      - prompt: "Who wrote the original poem 'Walk Alone'?"
        options: ["Rabindranath Tagore", "John Masefield", "Snehendu Kar", "H. W. Longfellow"]
        answer: "Rabindranath Tagore"
        difficulty: 1
        hints: ["Snehendu Kar only translated it."]
        solution: "Tagore wrote it; Snehendu Kar translated it."
        mistakes: {"Snehendu Kar": walk_alone_message}
      - prompt: "What should you do if no one listens to your call?"
        options: ["Walk on alone", "Go back home", "Wait for others", "Shout louder"]
        answer: "Walk on alone"
        difficulty: 1
        hints: ["The first two lines."]
        solution: "'Then you must walk on alone.'"
      - prompt: "What do 'thorns in your path' stand for?"
        options: ["Difficulties and obstacles in life", "Real plants on the road", "Friends who help you", "Rewards for hard work"]
        answer: "Difficulties and obstacles in life"
        difficulty: 2
        hints: ["A metaphor."]
        solution: "Thorns are a metaphor for obstacles."
        mistakes: {"Real plants on the road": walk_alone_message}
      - prompt: "What does 'Set your own heart on fire' suggest?"
        options: ["Light your inner courage and passion", "Start a real fire", "Become angry with everyone", "Give up hope"]
        answer: "Light your inner courage and passion"
        difficulty: 2
        hints: ["When no one holds up a light..."]
        solution: "Let your own courage be your light."
      - prompt: "In 'oh my hapless one', the word 'hapless' means:"
        options: ["Unlucky", "Happy", "Helpful", "Careless"]
        answer: "Unlucky"
        difficulty: 2
        hints: ["'hap' = luck; '-less' = without."]
        solution: "Hapless = unlucky, unfortunate."
        mistakes: {"Happy": glossary_word}
      - prompt: "What is the meaning of the last line, 'And shine alone that many may aspire'?"
        options: ["Your lonely courage can inspire many others", "You should always stay alone", "Only one person can succeed", "Many people will laugh at you"]
        answer: "Your lonely courage can inspire many others"
        difficulty: 3
        hints: ["aspire = hope to achieve something."]
        solution: "By shining alone, you give others hope and a goal."
        mistakes: {"You should always stay alone": walk_alone_message}

  - code: eng9.u4.grammar
    title: "Grammar: reported questions, I wish and idioms"
    after: [eng9.u4.soul_surfer]
    notes: |
      Reported wh-questions: keep the wh-word; change to statement order; drop do/does/did; shift tense
      back (present → past, past → past perfect, will → would); change pronouns and time/place words.
      Reporting verbs: asked, enquired, wanted to know. "Where do you surf?" → He asked her where she
      surfed. "Why did you go back to the water?" → She asked why I had gone back to the water. Wishes:
      I wish + simple past for present situations (I wish I had a surfboard = I don't have one); I wish +
      past perfect for past regrets (I wish I had listened). 'I wish I were' is also correct. Idioms
      from the lesson: out of the blue (suddenly, unexpectedly), a split second (a very brief moment),
      crystal clear (very clear), put your mind to (concentrate effort on).
    explanations:
      text: "When we report a question, it stops being a question: no question mark, no 'did', and the subject comes before the verb. 'I wish' takes a step back in time: past for now, past perfect for then."
      visual: "Draw two speech bubbles. Left: 'Where do you live?' Right box: She asked me where I lived. Circle how 'do' disappears and 'live' becomes 'lived'."
      step_by_step: "Report: Reporter to Bethany, 'What will you do next?' Step 1: asked + what. Step 2: you → she, will → would. Step 3: The reporter asked Bethany what she would do next."
      real_world: "Journalists use reported questions in news stories: 'The reporter asked the minister when the road would be repaired.'"
    items:
      - prompt: "Report: The reporter asked Bethany, \"Where do you surf?\""
        options: ["The reporter asked Bethany where she surfed.", "The reporter asked Bethany where did she surf.", "The reporter asked Bethany where do you surf.", "The reporter asked Bethany that where she surfs?"]
        answer: "The reporter asked Bethany where she surfed."
        difficulty: 1
        hints: ["No 'do/did'; statement order; past tense."]
        solution: "where + she + surfed."
        mistakes: {"The reporter asked Bethany where did she surf.": reported_question}
      - prompt: "Report: He asked me, \"Why are you crying?\""
        options: ["He asked me why I was crying.", "He asked me why was I crying.", "He asked me why are you crying.", "He asked me why I am crying?"]
        answer: "He asked me why I was crying."
        difficulty: 2
        hints: ["are → was; subject before verb."]
        solution: "why + I + was crying."
        mistakes: {"He asked me why was I crying.": reported_question}
      - prompt: "Report: Alana asked Bethany, \"When did you start surfing?\""
        options: ["Alana asked Bethany when she had started surfing.", "Alana asked Bethany when did she start surfing.", "Alana asked Bethany when you started surfing.", "Alana asked when Bethany starts surfing?"]
        answer: "Alana asked Bethany when she had started surfing."
        difficulty: 3
        hints: ["Past simple → past perfect in reported speech."]
        solution: "did start → had started; you → she."
        mistakes: {"Alana asked Bethany when did she start surfing.": reported_question}
      - prompt: "Complete: 'I don't know how to swim. I wish I ___ how to swim.'"
        options: ["knew", "know", "had known", "will know"]
        answer: "knew"
        difficulty: 1
        hints: ["A wish about the present takes the simple past."]
        solution: "Present wish → I wish I knew."
        mistakes: {"know": wish_form}
      - prompt: "Complete: 'I missed the match yesterday. I wish I ___ it.'"
        options: ["had watched", "watched", "watch", "would watch"]
        answer: "had watched"
        difficulty: 2
        hints: ["A regret about the past takes the past perfect."]
        solution: "Past regret → I wish I had watched it."
        mistakes: {"watched": wish_form}
      - prompt: "'It came literally out of the blue.' What does 'out of the blue' mean?"
        options: ["Suddenly and unexpectedly", "From the sky", "From the sea", "Very slowly"]
        answer: "Suddenly and unexpectedly"
        difficulty: 1
        hints: ["She had no warning at all."]
        solution: "Out of the blue = without warning."
        mistakes: {"From the sea": idiom_meaning, "From the sky": idiom_meaning}
      - prompt: "'That's all it took: a split second.' A 'split second' is:"
        options: ["A very brief moment", "Two seconds", "A broken clock", "A second chance"]
        answer: "A very brief moment"
        difficulty: 2
        hints: ["Lightning-fast."]
        solution: "A split second = an extremely short time."
        mistakes: {"A second chance": idiom_meaning}

  - code: eng9.u4.words
    title: "Words: phrasal verbs with 'out' and words used as noun and verb"
    after: [eng9.u4.soul_surfer]
    notes: |
      Phrasal verbs with 'out': make out (see or understand with difficulty: "I couldn't make out any of
      the details"), figure out (find the answer), freak out (panic), pass out (faint), roll out
      (launch), find out (discover), carry out (do). Words used as both noun and verb: surf (n: the
      waves; v: ride the waves), stub, saw, hand, board, guard, shield (n: protective plate; v: protect).
      Glossary: tourniquet (a tight band to stop bleeding), resilience (ability to recover), tenacity
      (determination), posthumously (after death), purser (senior cabin attendant), hostage, evacuation,
      hapless. Functions: making offers ("May I offer you...?", "Would you like...?"), giving a pep talk
      (encouraging words).
    explanations:
      text: "Many English words can be both a thing and an action: a 'shield' protects, and you can 'shield' someone. Phrasal verbs with 'out' often mean finding, losing control, or making something appear."
      visual: "Two-column chart: noun | verb. surf: the surf was calm | she surfs every day. shield: a metal shield | she shielded the children."
      step_by_step: "'I couldn't make out any of the details.' Step 1: make out is a phrasal verb. Step 2: Here it is about seeing. Step 3: It means she couldn't see clearly."
      real_world: "Doctors and first-aid trainers teach how to apply a tourniquet in an emergency, just as Holt did."
    items:
      - prompt: "'I couldn't make out any of the details.' What does 'make out' mean here?"
        options: ["See or understand clearly", "Build something", "Leave quickly", "Become friends"]
        answer: "See or understand clearly"
        difficulty: 1
        hints: ["It happened in a flash."]
        solution: "make out = see with difficulty."
        mistakes: {"Build something": phrasal_verb}
      - prompt: "Choose the phrasal verb that means 'to faint':"
        options: ["pass out", "figure out", "roll out", "find out"]
        answer: "pass out"
        difficulty: 2
        hints: ["To lose consciousness."]
        solution: "pass out = faint."
        mistakes: {"roll out": phrasal_verb}
      - prompt: "In which sentence is 'shield' used as a verb?"
        options: ["She shielded three children from the bullets.", "The knight carried a heavy shield.", "The shield was made of iron.", "A Shield of Courage is a true story."]
        answer: "She shielded three children from the bullets."
        difficulty: 2
        hints: ["Look for the action."]
        solution: "'shielded' is the action (verb)."
      - prompt: "What is a 'tourniquet'?"
        options: ["A tight band used to stop bleeding", "A surfing competition", "A kind of shark", "A tour guide"]
        answer: "A tight band used to stop bleeding"
        difficulty: 1
        hints: ["Holt used his rash guard as one."]
        solution: "A tourniquet stops heavy bleeding from a limb."
        mistakes: {"A tour guide": glossary_word}
      - prompt: "'Neerja was posthumously conferred the Ashoka Chakra.' 'Posthumously' means:"
        options: ["After death", "Before birth", "In public", "With great joy"]
        answer: "After death"
        difficulty: 2
        hints: ["She had died during the hijacking."]
        solution: "Posthumously = after a person's death."
        mistakes: {"In public": glossary_word}
      - prompt: "Which is the most polite way to make an offer?"
        options: ["Would you like some water?", "Take water.", "You want water or not?", "Drink this."]
        answer: "Would you like some water?"
        difficulty: 1
        hints: ["'Would you like...' is polite."]
        solution: "'Would you like...?' is a polite offer."
