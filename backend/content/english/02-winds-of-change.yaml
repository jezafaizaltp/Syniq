# Class 9 English (Kerala Reader), Unit II. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part I text supplied by the school.
# Also uses tips from Unit I: read_the_lines, glossary_word.
subject: eng
chapter: 2
title: "Unit II: Winds of Change"

tips:
  score_twenty: "A score is a set of a fixed size, the way a dozen is a set of 12. Find that size first, then multiply."
  courage_not_fists: "Gandhiji said non-violence needs more courage than fighting back. Who can take blows without hitting back?"
  dependence: "Gandhiji's worry was about India's basic needs. Who was supplying India's cloth, and what did that do to Indian spinners and weavers?"
  only_space: "She was locked out of her sister's room and had hours to wait. What did the park toilet give her that nowhere else did?"
  keeps_going: "Look at what she did when the toilet was locked. Did she stop writing?"
  no_wings: "Birds fly straight up; people must climb. What does the poet say about how humans reach great heights?"
  is_or_like: "Does the line say the pyramids are LIKE stairs, or that they ARE stairs?"
  certain_future: "'I was sure' tells you she was predicting something in the past. Which use of 'would' is that?"
  gandhi_nonviolence: "Gandhiji said non-violence needs a strong heart and the courage to take blows without hitting back. Is that a weapon for the weak or for those with the most inner strength?"
  gandhi_education: "Gandhiji said real education is not about stuffing in facts or passing exams. What did he think it should build in a person?"
  toilet_reason: "In 'The Toilet' the narrator hid in the park toilet because she had nowhere private to wait: she was staying secretly in her sister's room and had to leave before 5.30 a.m."
  success_message: "'Success' says great heights are reached by slow, steady toil ('toiling upward in the night'), not by a sudden flight."
  would_uses: "'Would' has many jobs. Look for a clue word: 'every evening' signals a habit, 'please' signals asking nicely, 'if' a condition. In reported speech, 'will' moves back one tense."
  past_perfect_order: "Past perfect (had + past participle) is for the EARLIER of two past actions; simple past is for the later one."
  phrasal_verb: "A phrasal verb's meaning is not just its two words added up. Read the whole sentence and try replacing the verb with a single word that fits."
  gandhi_cloth_food: "Swadeshi was about making the basic things people need to live at home, the ones Gandhiji spun and grew himself. Which two basics are those?"
  gandhi_earned: "Gandhiji wanted independence, but said it can't be begged for or given as a gift: it is earned by self-sacrifice."
  poem_author: "Check the poet's name at the head of the poem. Several poets appear in this unit."
  pyramids_stairs: "The poem says great things are built one step at a time. Look closely at a pyramid's sides: what are they made of?"
  toilet_message: "Look at what the narrator achieves despite having no space of her own: the story is about determination."
  toilet_writing: "The park toilet was her quiet place to read, dream and write. Go back to what she did there."
  e2_who_where: "Ask who is speaking and to whom: students in France, a film star, or a group of women in London."
  e2_chaplin_reason: Gandhiji did not know Chaplin at first. What was he told about Chaplin that changed his mind?
  e2_strong_weak: 'Gandhiji turned the usual idea around: hitting back is easy; not hitting back takes the greater strength.'
  e2_toilet_times: 'Put the morning in order: when she must leave the house, then when her bus comes. The gap is why she needs somewhere to wait.'
  e2_toilet_people: "Keep the people apart: the sister works and lives in the Madam's house, the Madam is her employer, and the narrator works somewhere else."
  e2_toilet_feeling: What did the narrator have least of in her sister's room? The toilet gave her exactly that.
  e2_climb_not_fly: The poem says we cannot fly to the top. What do we have instead, and how do we use it?
  e2_night_work: While their friends slept, what were the great men doing?
  e2_would_job: 'Ask what job ''would'' is doing: a habit in the past, a polite request, an ''if'' result, a prediction, or ''will'' in reported speech.'
  e2_earlier_event: In two past events, the one that happened first takes had + past participle.
  e2_twenty: One score is twenty. Multiply the number of scores by twenty.
  e2_word_sense: Put each choice into the sentence from the lesson. Which one keeps the meaning?

concepts:
  - code: eng9.u2.dreams_realised
    title: Dreams Realised
    notes: |
      From Mahadev Desai's account (Gandhiji's personal secretary) of Gandhiji's visit to England for
      the Round Table Conference. French students welcome him as the 'spiritual ambassador of India'.
      Non-violence is no weapon of the weak but of the strongest; it needs a strong heart; bearing blows
      without retaliating is greater bravery. Real education is developing character, not packing the
      brain with facts or passing examinations. Charlie Chaplin wanted to meet him; Gandhiji did not
      know him but agreed when told Chaplin came from the people and had made millions laugh. Chaplin
      asked why he was against machinery; Gandhiji explained the six months' unemployment of India's
      peasants and said every nation should be self-contained in cloth and food. At Morley College Hall
      (Women's India Council) he praised unlettered women who filled the jails and bore lathi blows.
      Independence is not a gift from one nation to another; he did not want freedom to exploit any
      other race. Freedom came through non-violence and non-cooperation.
    explanations:
      text: "On his visit to England, Gandhiji explained his ideas to students, celebrities and women's groups: non-violence takes more courage than fighting back, education should build character, villages must be self-reliant in food and cloth, and India's freedom would be earned, not begged for."
      visual: "Draw Gandhiji in the middle with four speech bubbles: 'Non-violence = strength of heart', 'Education = character', 'Spinning wheel = work for peasants', 'Freedom is earned, not gifted'."
      step_by_step: "Why did Gandhiji agree to meet Chaplin? Step 1: At first he did not know who Chaplin was. Step 2: He was told Chaplin came from the people, lived for the people and made millions laugh. Step 3: That service to ordinary people made him agree."
      real_world: "Khadi, the hand-spun cloth Gandhiji promoted, is still sold in Khadi Bhavans across Kerala, giving work to spinners and weavers."
    activity:
      type: sort
      prompt: What did Gandhiji say?
      bins:
      - What Gandhiji said
      - What he did not say
      items:
      - label: Non-violence is a weapon of the strongest
        bin: What Gandhiji said
        clue: It needs a strong heart.
        why: He said it is not for the weak.
      - label: Non-violence is for those too weak to fight
        bin: What he did not say
        clue: Is bearing blows weak?
        why: He said the opposite.
      - label: Real education builds character
        bin: What Gandhiji said
        clue: Not just facts.
        why: Yes.
      - label: Education means passing examinations
        bin: What he did not say
        clue: What did he say education is?
        why: He said it is not packing the brain with facts.
      - label: Every nation should be self-contained in cloth and food
        bin: What Gandhiji said
        clue: His answer to Chaplin.
        why: Yes.
      - label: Machines should do all of India's work
        bin: What he did not say
        clue: Think of peasants idle six months a year.
        why: He opposed machinery that took away work.
    lesson:
      - teach: '''Dreams Realised'' is from Mahadev Desai''s account. He was Gandhiji''s personal secretary and went with him to England for the Round Table Conference. In France, students welcomed Gandhiji as the ''spiritual ambassador of India''.'
        check:
          prompt: Who was Mahadev Desai?
          options:
          - Gandhiji's personal secretary
          - A French student
          - A British minister
          answer: Gandhiji's personal secretary
          why: He travelled with Gandhiji and wrote this account.
        ways:
        - style: real_world
          teach: A personal secretary sees everything a leader does, up close. Mahadev Desai was Gandhiji's secretary and travelled with him to England for the Round Table Conference. 'Dreams Realised' is his account. On the way, in France, students welcomed Gandhiji as the 'spiritual ambassador of India'.
      - teach: 'Gandhiji''s ideas: non-violence is the weapon of the strongest, not the weak, because bearing blows without hitting back needs great courage. Real education is building character, not stuffing the brain with facts or passing exams.'
        picture:
          kind: compare
          columns:
          - title: Usual idea
            points:
            - hitting back = strong
            - education = facts and exams
          - title: Gandhiji's idea
            points:
            - not hitting back = strongest
            - education = character
          alt: How Gandhiji turned common ideas around.
        check:
          prompt: Gandhiji said real education is
          options:
          - Developing character
          - Passing examinations
          - Memorising facts
          answer: Developing character
          why: He valued who you become, not what you cram.
        ways:
        - style: real_world
          teach: Think of someone who is pushed in a queue and does not push back. That takes more strength than hitting back. Gandhiji said non-violence is the weapon of the strongest, not the weak, for exactly this reason. He also said real education is building character, not stuffing the brain with facts or passing exams.
      - teach: Charlie Chaplin wanted to meet him. Gandhiji agreed when told Chaplin came from the people and made millions laugh. Asked why he opposed machinery, Gandhiji said India's peasants were jobless for six months a year; every nation should be self-reliant in cloth and food. He said independence is not a gift; it must be earned, and India would not use freedom to exploit others.
        check:
          prompt: Why did Gandhiji want nations to be self-contained in cloth and food?
          options:
          - So people are not dependent and have work
          - To sell more machines
          - To stop trade completely
          answer: So people are not dependent and have work
          why: Spinning and farming gave India's poor work and self-reliance.
        ways:
        - style: step_by_step
          teach: 'Follow the Chaplin meeting in steps. Step 1: Charlie Chaplin asks to meet Gandhiji. Step 2: Gandhiji agrees when told Chaplin came from the people and made millions laugh. Step 3: Chaplin asks why he opposes machinery. Step 4: Gandhiji explains India''s peasants are jobless six months a year, so every nation should be self-reliant in cloth and food. Step 5: he adds that independence must be earned, not gifted, and India would not use it to exploit others.'
    items:
      - prompt: "Who wrote the account in 'Dreams Realised'?"
        options: ["Mahadev Desai", "Mahatma Gandhi", "Charlie Chaplin", "Sarojini Naidu"]
        answer: "Mahadev Desai"
        difficulty: 1
        hints: ["Gandhiji's personal secretary."]
        solution: "Mahadev Desai, Gandhiji's secretary, wrote the account."
        mistakes: {"Mahatma Gandhi": read_the_lines}
      - prompt: "According to Gandhiji, non-violence is the weapon of:"
        options: ["The strongest", "The weak", "Soldiers only", "The rich"]
        answer: "The strongest"
        difficulty: 1
        hints: ["It needs a strong heart."]
        solution: "He said non-violence is no weapon of the weak but of the strongest."
        mistakes: {"The weak": gandhi_nonviolence}
      - prompt: "What, according to Gandhiji, does real education consist of?"
        options: ["Developing character", "Passing many examinations", "Packing the brain with facts and figures", "Reading numerous books"]
        answer: "Developing character"
        difficulty: 1
        hints: ["Not facts, not exams."]
        solution: "Real education is developing character."
        mistakes: {"Passing many examinations": gandhi_education, "Packing the brain with facts and figures": gandhi_education}
      - prompt: "What was Charlie Chaplin's first question to Gandhiji?"
        options: ["Why he was against machinery", "Why he wore khadi", "When India would be free", "Whether he liked films"]
        answer: "Why he was against machinery"
        difficulty: 2
        hints: ["Chaplin had heard of the spinning wheel."]
        solution: "Chaplin asked why Gandhiji was against machinery."
        mistakes: {"Whether he liked films": read_the_lines}
      - prompt: "In which two things did Gandhiji say every nation should be self-contained?"
        options: ["Cloth and food", "Machines and weapons", "Gold and silver", "Books and films"]
        answer: "Cloth and food"
        difficulty: 2
        hints: ["Linked to the spinning wheel and peasants."]
        solution: "'In cloth and food every nation should be self-contained.'"
        mistakes: {"Machines and weapons": "gandhi_cloth_food", "Gold and silver": "gandhi_cloth_food"}
      - prompt: "How did Gandhiji describe the women of India in his speech?"
        options: ["Even unlettered women filled the jails and bore lathi blows without hitting back", "They stayed at home during the struggle", "Only learned women took part", "They opposed the freedom struggle"]
        answer: "Even unlettered women filled the jails and bore lathi blows without hitting back"
        difficulty: 2
        hints: ["Not only women like Sarojini Naidu."]
        solution: "He praised hundreds of unlettered women who stood unflinchingly under lathi blows."
        mistakes: {"Only learned women took part": read_the_lines}
      - prompt: "Why did Gandhiji say he was 'not here to beg for independence'?"
        options: ["Independence cannot be a gift from one nation to another; it must be earned through self-sacrifice", "He did not want independence", "Britain had already given India freedom", "He wanted money instead"]
        answer: "Independence cannot be a gift from one nation to another; it must be earned through self-sacrifice"
        difficulty: 3
        hints: ["'There is no such thing as a gift of independence...'"]
        solution: "He believed freedom is a birthright won by continued self-sacrifice."

        mistakes: {"He did not want independence": "gandhi_earned", "Britain had already given India freedom": "gandhi_earned"}
      - prompt: "Gandhiji told Charlie Chaplin he was not against machines as such. What was his real concern?"
        options: ["Machines had made India depend on England for basic needs like cloth", "Machines make too much noise", "He disliked films", "Machines cost too much to buy"]
        answer: "Machines had made India depend on England for basic needs like cloth"
        difficulty: 3
        hints: ["Which two things did he say a nation must make for itself?", "What happened to India's spinners and weavers?"]
        solution: "Step 1: Mill cloth from England had replaced Indian hand-spun cloth. Step 2: Gandhiji wanted India self-contained in cloth and food, not dependent on others."
        mistakes: {"Machines make too much noise": dependence, "He disliked films": dependence, "Machines cost too much to buy": dependence}
      - prompt: "What did Gandhiji mean when he said non-violence is the weapon of the strongest?"
        options: ["It takes great courage to suffer blows without hitting back", "Only strong people should fight", "Weak people should use non-violence", "Soldiers alone can use it"]
        answer: "It takes great courage to suffer blows without hitting back"
        difficulty: 2
        hints: ["Think of the unlettered women who bore lathi blows.", "Is hitting back easier or harder than not hitting back?"]
        solution: "Step 1: Not hitting back needs more inner strength than fighting. Step 2: So non-violence belongs to the brave, not the weak."
        mistakes: {"Only strong people should fight": courage_not_fists, "Weak people should use non-violence": gandhi_nonviolence, "Soldiers alone can use it": courage_not_fists}
      - prompt: How did French students welcome Gandhiji?
        options:
        - As the spiritual ambassador of India
        - As a famous actor
        - As a British officer
        - As a scientist
        answer: As the spiritual ambassador of India
        difficulty: 1
        hints:
        - They saw him as a messenger of India's values.
        - The phrase is one of the lesson's descriptive expressions.
        solution: 'Step 1: Students honoured him for his ideas. Step 2: They called him India''s spiritual representative. Step 3: Spiritual ambassador of India.'
        mistakes:
          As a famous actor: e2_who_where
      - prompt: Why did Gandhiji agree to meet Charlie Chaplin?
        options:
        - He came from the people and had made millions laugh
        - He was a British minister
        - He offered money for India
        - He was a famous scientist
        answer: He came from the people and had made millions laugh
        difficulty: 2
        hints:
        - Gandhiji did not know who Chaplin was.
        - What he heard about Chaplin's life and work mattered.
        solution: 'Step 1: Gandhiji had not heard of him. Step 2: He was told Chaplin was from ordinary people and made millions laugh. Step 3: So he agreed.'
        mistakes:
          He offered money for India: e2_chaplin_reason
      - prompt: For how many months a year did Gandhiji say Indian peasants were unemployed?
        options:
        - Six
        - Two
        - Ten
        - Twelve
        answer: Six
        difficulty: 1
        hints:
        - Farm work is seasonal.
        - It is half the year.
        solution: 'Step 1: Farming leaves long idle periods. Step 2: Gandhiji named half the year. Step 3: Six months.'
        mistakes:
          Twelve: gandhi_cloth_food
      - prompt: Where did Gandhiji speak to the Women's India Council?
        options:
        - Morley College Hall
        - Buckingham Palace
        - A French university
        - Sabarmati Ashram
        answer: Morley College Hall
        difficulty: 2
        hints:
        - It was in London.
        - It was a college hall.
        solution: 'Step 1: The talk was in England. Step 2: It was at a college hall. Step 3: Morley College Hall.'
        mistakes:
          A French university: e2_who_where
      - prompt: '''Bearing blows without retaliating is greater bravery.'' Which idea of Gandhiji does this support?'
        options:
        - Non-violence is the weapon of the strongest
        - Machines are evil
        - Education means exams
        - India should beg for freedom
        answer: Non-violence is the weapon of the strongest
        difficulty: 2
        hints:
        - Retaliating means hitting back.
        - Which idea links courage with not hitting back?
        solution: 'Step 1: Not hitting back needs courage. Step 2: Courage is strength. Step 3: Non-violence is the weapon of the strongest.'
        mistakes:
          India should beg for freedom: e2_strong_weak
      - prompt: What did Gandhiji say India would NOT do with its freedom?
        options:
        - Exploit any other race
        - Grow food
        - Make cloth
        - Educate children
        answer: Exploit any other race
        difficulty: 3
        hints:
        - He spoke of freedom without harming others.
        - He criticised the 'exploitation-blinded West'.
        solution: 'Step 1: He wanted freedom for India. Step 2: He did not want to repeat the West''s wrongs. Step 3: India would not exploit others.'
        mistakes:
          Make cloth: gandhi_earned
  - code: eng9.u2.the_toilet
    title: The Toilet
    after: [eng9.u2.dreams_realised]
    notes: |
      Memoir by Gcina Mhlope, South African storyteller. After her matric exams she stays in
      Johannesburg with her elder sister, a domestic worker in Orange Grove, secretly — locked in the
      back room on weekdays so the 'Madam' would not see her. She gets a temporary job in a clothing
      factory; she must leave before 5.30 a.m. and the bus is at 7.30, so she sits in an unlocked public
      toilet in the park reading magazines. The small toilet gives her privacy; she daydreams of acting
      and starts writing again (her English teacher had encouraged her). One evening Madam's dogs
      corner her; her sister (English name Irene) is angry. Next morning she writes a poem in the
      toilet, newly painted with a new windowpane. One day it is locked; she accepts it was never hers
      and writes her story on a bench anyway. Themes: perseverance, loneliness, inequality, finding a
      space to create.
    explanations:
      text: "A lonely young woman with nowhere of her own finds an unlikely private room: a public toilet in a park. There, between dawn and her bus, she reads, dreams and starts writing. When the toilet is locked one day, she writes on a park bench instead: the dream did not depend on the place."
      visual: "Draw a timeline of her morning: before 5.30 leave the house secretly → park toilet (read, dream, write) → 7.30 bus → factory → park till 6.30 → sneak back in."
      step_by_step: "Why did she go to the toilet? Step 1: She had to leave the house before 5.30 so the employers would not see her. Step 2: Her bus was at 7.30. Step 3: She needed somewhere sheltered to wait about two hours, and the toilet was never locked."
      real_world: "Many writers began with a notebook and a borrowed corner. Gcina Mhlope's birthday, 24 October, is now National Storytelling Day in South Africa."
    activity:
      type: order
      prompt: 'The Toilet: put the events in order.'
      steps:
      - She stays secretly in her sister's room in Johannesburg
      - She gets a factory job but leaves too early for the bus
      - She sits in the park toilet and starts writing again
      - Madam's dogs corner her one evening
      - The toilet is locked; she writes on a bench anyway
      reasons:
        She gets a factory job but leaves too early for the bus: The job and early start come after she arrives.
        She sits in the park toilet and starts writing again: She found the toilet because of the early start.
        Madam's dogs corner her one evening: This happened while she was already using the toilet.
        The toilet is locked; she writes on a bench anyway: The lock comes at the end and shows her perseverance.
    lesson:
      - teach: '''The Toilet'' is a memoir by Gcina Mhlope, a South African storyteller. After her exams she stays secretly with her elder sister, a domestic worker in Johannesburg, locked in a back room on weekdays so the ''Madam'' (employer) will not find out.'
        check:
          prompt: Why must the narrator stay hidden?
          options:
          - The Madam must not see her
          - She is ill
          - She is on holiday
          answer: The Madam must not see her
          why: She was staying secretly in her sister's work quarters.
        ways:
        - style: real_world
          teach: Imagine staying in a relative's room in a big city, but having to stay locked in on weekdays so nobody finds out you're there. That is the narrator's life in 'The Toilet', a memoir by South African storyteller Gcina Mhlope. Her elder sister is a domestic worker in Johannesburg, and the 'Madam' must not see her.
      - teach: She gets a factory job. She must leave before 5.30 a.m. but the bus is at 7.30, so she waits in an unlocked public toilet in the park. There, in a small private space, she reads, dreams of acting and starts writing again.
        picture:
          kind: flow
          steps:
          - Leave sister's room before 5.30 a.m.
          - 'Wait in park toilet: read, dream, write'
          - Bus at 7.30 a.m.
          - Factory work
          alt: The narrator's morning routine.
        check:
          prompt: Why did she go to the toilet in the park?
          options:
          - She had two hours before her bus
          - She had no home at all
          - She worked there
          answer: She had two hours before her bus
          why: Leaving before 5.30 and a 7.30 bus left a long wait.
        ways:
        - style: step_by_step
          teach: 'Work out her morning. Step 1: she gets a factory job. Step 2: she must leave home before 5.30 a.m. Step 3: her bus is not until 7.30, so she has two hours to fill. Step 4: she finds an unlocked public toilet in the park. Step 5: in that small private space she reads, dreams of acting, and starts writing again.'
      - teach: One day the toilet is freshly painted with a new windowpane; later it is locked. She accepts it was never hers and writes her story on a bench. The memoir shows perseverance, loneliness, inequality and finding space to create.
        check:
          prompt: What did she do when the toilet was locked?
          options:
          - Wrote on a bench anyway
          - Gave up writing
          - Broke the lock
          answer: Wrote on a bench anyway
          why: Her determination to write did not depend on that room.
        ways:
        - style: step_by_step
          teach: 'See how she loses her space. Step 1: the toilet is freshly painted with a new windowpane. Step 2: later, it is locked. Step 3: she accepts it was never hers. Step 4: she sits on a bench and writes her story anyway. The memoir is about perseverance, loneliness, inequality, and finding space to create.'
    items:
      - prompt: "Why was the narrator locked in her sister's room on weekdays?"
        options: ["So that the Madam would not see her", "She was being punished", "She was ill", "She wanted to study quietly"]
        answer: "So that the Madam would not see her"
        difficulty: 1
        hints: ["Her stay was a secret."]
        solution: "Her employers did not know she stayed there, so her sister locked her in."
        mistakes: {"She was being punished": toilet_reason}
      - prompt: "What did the narrator do in the public toilet in the park?"
        options: ["Read magazines, daydreamed and wrote", "Slept until noon", "Sold newspapers", "Met her friends"]
        answer: "Read magazines, daydreamed and wrote"
        difficulty: 1
        hints: ["She sat on the closed lid."]
        solution: "She read, dreamed of acting and began writing poems and stories."
        mistakes: {"Slept until noon": "toilet_writing", "Met her friends": "toilet_writing"}
      - prompt: "Why did she need somewhere to wait each morning?"
        options: ["She had to leave the house before 5.30 a.m. but her bus was at 7.30 a.m.", "Her factory opened at 5 a.m.", "She liked the park's flowers", "Her sister told her to exercise"]
        answer: "She had to leave the house before 5.30 a.m. but her bus was at 7.30 a.m."
        difficulty: 2
        hints: ["About two hours."]
        solution: "She left early to stay hidden and had about two hours before her bus."
        mistakes: {"Her factory opened at 5 a.m.": toilet_reason}
      - prompt: "What changes did she notice in the toilet one morning?"
        options: ["The door had been painted and a new windowpane fitted", "It had been pulled down", "A guard stood outside", "It was full of books"]
        answer: "The door had been painted and a new windowpane fitted"
        difficulty: 2
        hints: ["Paragraph 14."]
        solution: "The door was painted and the broken windowpane replaced."
        mistakes: {"It had been pulled down": read_the_lines}
      - prompt: "What did the narrator do when she found the toilet locked?"
        options: ["She sat on a bench and wrote the story anyway", "She went back home and cried", "She broke the lock", "She gave up writing"]
        answer: "She sat on a bench and wrote the story anyway"
        difficulty: 2
        hints: ["She watched the spring sun come up."]
        solution: "She accepted the toilet was not hers and wrote on a nearby bench."
        mistakes: {"She gave up writing": read_the_lines}
      - prompt: "Who is 'Irene' in the story?"
        options: ["The narrator's sister (her English name)", "The Madam", "A factory supervisor", "Her English teacher"]
        answer: "The narrator's sister (her English name)"
        difficulty: 1
        hints: ["'That's my sister's English name, which we never use.'"]
        solution: "Irene is the English name of the narrator's sister."
        mistakes: {"The Madam": read_the_lines}
      - prompt: "What is the main message of 'The Toilet'?"
        options: ["Determination can find a way to follow a dream even in hard circumstances", "Public toilets should be locked", "Sisters should not help each other", "Factory work is better than writing"]
        answer: "Determination can find a way to follow a dream even in hard circumstances"
        difficulty: 3
        hints: ["What did she keep doing in spite of everything?"]
        solution: "Loneliness and inequality did not stop her: she kept writing wherever she could."

        mistakes: {"Public toilets should be locked": "toilet_message", "Factory work is better than writing": "toilet_message"}
      - prompt: "When she found the park toilet locked, the narrator sat on a bench and wrote anyway. What does this show about her?"
        options: ["Her determination to write wherever she could", "She gave up writing", "She was angry with the park keeper", "She had never liked the toilet"]
        answer: "Her determination to write wherever she could"
        difficulty: 2
        hints: ["Did losing her quiet place stop her?", "What does that say about her dream?"]
        solution: "Step 1: Her private place was gone. Step 2: She still wrote her story on a bench, showing her determination."
        mistakes: {"She gave up writing": keeps_going, "She was angry with the park keeper": keeps_going, "She had never liked the toilet": keeps_going}
      - prompt: "Why did a public toilet become such a comforting place for the narrator?"
