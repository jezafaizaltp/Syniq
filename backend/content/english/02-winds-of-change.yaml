# Class 9 English (Kerala Reader), Unit II. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part I text supplied by the school.
# Also uses tips from Unit I: read_the_lines, glossary_word.
subject: eng
chapter: 2
title: "Unit II: Winds of Change"

tips:
  gandhi_nonviolence: "For Gandhiji, non-violence is the weapon of the strongest: it needs a strong heart, not strong muscles, and the courage to bear blows without hitting back."
  gandhi_education: "Gandhiji said real education is not packing the brain with facts or passing exams, but developing character."
  toilet_reason: "In 'The Toilet' the narrator hid in the park toilet because she had nowhere private to wait: she was staying secretly in her sister's room and had to leave before 5.30 a.m."
  success_message: "'Success' says great heights are reached by slow, steady toil ('toiling upward in the night'), not by a sudden flight."
  would_uses: "'Would' can show a past habit, a polite request, a conditional, a prediction, willingness, or 'will' in reported speech."
  past_perfect_order: "Past perfect (had + past participle) is for the EARLIER of two past actions; simple past is for the later one."
  phrasal_verb: "A phrasal verb (verb + particle) has its own meaning, different from its separate words: 'went on' = continued."

concepts:
  - code: eng9.u2.dreams_realised
    title: Dreams Realised
    notes: |
      From Mahadev Desai's account (Gandhiji's personal secretary) of Gandhiji's visit to England for
      the Round Table Conference. French students welcome him as the 'spiritual ambassador of India'.
      Non-violence is no weapon of the weak but of the strongest; it needs a strong heart; bearing blows
      without retaliating is greater bravery. Real education is developing character, not packing the
      brain with facts or passing examinations. Charlie Chaplin wanted to meet him; Gandhiji did not
      know him but agreed when told Chaplin came from the people and had made millions laugh. Chaplin
      asked why he was against machinery; Gandhiji explained the six months' unemployment of India's
      peasants and said every nation should be self-contained in cloth and food. At Morley College Hall
      (Women's India Council) he praised unlettered women who filled the jails and bore lathi blows.
      Independence is not a gift from one nation to another; he did not want freedom to exploit any
      other race. Freedom came through non-violence and non-cooperation.
    explanations:
      text: "On his visit to England, Gandhiji explained his ideas to students, celebrities and women's groups: non-violence takes more courage than fighting back, education should build character, villages must be self-reliant in food and cloth, and India's freedom would be earned, not begged for."
      visual: "Draw Gandhiji in the middle with four speech bubbles: 'Non-violence = strength of heart', 'Education = character', 'Spinning wheel = work for peasants', 'Freedom is earned, not gifted'."
      step_by_step: "Why did Gandhiji agree to meet Chaplin? Step 1: At first he did not know who Chaplin was. Step 2: He was told Chaplin came from the people, lived for the people and made millions laugh. Step 3: That service to ordinary people made him agree."
      real_world: "Khadi, the hand-spun cloth Gandhiji promoted, is still sold in Khadi Bhavans across Kerala, giving work to spinners and weavers."
    items:
      - prompt: "Who wrote the account in 'Dreams Realised'?"
        options: ["Mahadev Desai", "Mahatma Gandhi", "Charlie Chaplin", "Sarojini Naidu"]
        answer: "Mahadev Desai"
        difficulty: 1
        hints: ["Gandhiji's personal secretary."]
        solution: "Mahadev Desai, Gandhiji's secretary, wrote the account."
        mistakes: {"Mahatma Gandhi": read_the_lines}
      - prompt: "According to Gandhiji, non-violence is the weapon of:"
        options: ["The strongest", "The weak", "Soldiers only", "The rich"]
        answer: "The strongest"
        difficulty: 1
        hints: ["It needs a strong heart."]
        solution: "He said non-violence is no weapon of the weak but of the strongest."
        mistakes: {"The weak": gandhi_nonviolence}
      - prompt: "What, according to Gandhiji, does real education consist of?"
        options: ["Developing character", "Passing many examinations", "Packing the brain with facts and figures", "Reading numerous books"]
        answer: "Developing character"
        difficulty: 1
        hints: ["Not facts, not exams."]
        solution: "Real education is developing character."
        mistakes: {"Passing many examinations": gandhi_education, "Packing the brain with facts and figures": gandhi_education}
      - prompt: "What was Charlie Chaplin's first question to Gandhiji?"
        options: ["Why he was against machinery", "Why he wore khadi", "When India would be free", "Whether he liked films"]
        answer: "Why he was against machinery"
        difficulty: 2
        hints: ["Chaplin had heard of the spinning wheel."]
        solution: "Chaplin asked why Gandhiji was against machinery."
        mistakes: {"Whether he liked films": read_the_lines}
      - prompt: "In which two things did Gandhiji say every nation should be self-contained?"
        options: ["Cloth and food", "Machines and weapons", "Gold and silver", "Books and films"]
        answer: "Cloth and food"
        difficulty: 2
        hints: ["Linked to the spinning wheel and peasants."]
        solution: "'In cloth and food every nation should be self-contained.'"
      - prompt: "How did Gandhiji describe the women of India in his speech?"
        options: ["Even unlettered women filled the jails and bore lathi blows without hitting back", "They stayed at home during the struggle", "Only learned women took part", "They opposed the freedom struggle"]
        answer: "Even unlettered women filled the jails and bore lathi blows without hitting back"
        difficulty: 2
        hints: ["Not only women like Sarojini Naidu."]
        solution: "He praised hundreds of unlettered women who stood unflinchingly under lathi blows."
        mistakes: {"Only learned women took part": read_the_lines}
      - prompt: "Why did Gandhiji say he was 'not here to beg for independence'?"
        options: ["Independence cannot be a gift from one nation to another; it must be earned through self-sacrifice", "He did not want independence", "Britain had already given India freedom", "He wanted money instead"]
        answer: "Independence cannot be a gift from one nation to another; it must be earned through self-sacrifice"
        difficulty: 3
        hints: ["'There is no such thing as a gift of independence...'"]
        solution: "He believed freedom is a birthright won by continued self-sacrifice."

  - code: eng9.u2.the_toilet
    title: The Toilet
    after: [eng9.u2.dreams_realised]
    notes: |
      Memoir by Gcina Mhlope, South African storyteller. After her matric exams she stays in
      Johannesburg with her elder sister, a domestic worker in Orange Grove, secretly — locked in the
      back room on weekdays so the 'Madam' would not see her. She gets a temporary job in a clothing
      factory; she must leave before 5.30 a.m. and the bus is at 7.30, so she sits in an unlocked public
      toilet in the park reading magazines. The small toilet gives her privacy; she daydreams of acting
      and starts writing again (her English teacher had encouraged her). One evening Madam's dogs
      corner her; her sister (English name Irene) is angry. Next morning she writes a poem in the
      toilet, newly painted with a new windowpane. One day it is locked; she accepts it was never hers
      and writes her story on a bench anyway. Themes: perseverance, loneliness, inequality, finding a
      space to create.
    explanations:
      text: "A lonely young woman with nowhere of her own finds an unlikely private room: a public toilet in a park. There, between dawn and her bus, she reads, dreams and starts writing. When the toilet is locked one day, she writes on a park bench instead: the dream did not depend on the place."
      visual: "Draw a timeline of her morning: before 5.30 leave the house secretly → park toilet (read, dream, write) → 7.30 bus → factory → park till 6.30 → sneak back in."
      step_by_step: "Why did she go to the toilet? Step 1: She had to leave the house before 5.30 so the employers would not see her. Step 2: Her bus was at 7.30. Step 3: She needed somewhere sheltered to wait about two hours, and the toilet was never locked."
      real_world: "Many writers began with a notebook and a borrowed corner. Gcina Mhlope's birthday, 24 October, is now National Storytelling Day in South Africa."
    items:
      - prompt: "Why was the narrator locked in her sister's room on weekdays?"
        options: ["So that the Madam would not see her", "She was being punished", "She was ill", "She wanted to study quietly"]
        answer: "So that the Madam would not see her"
        difficulty: 1
        hints: ["Her stay was a secret."]
        solution: "Her employers did not know she stayed there, so her sister locked her in."
        mistakes: {"She was being punished": toilet_reason}
      - prompt: "What did the narrator do in the public toilet in the park?"
        options: ["Read magazines, daydreamed and wrote", "Slept until noon", "Sold newspapers", "Met her friends"]
        answer: "Read magazines, daydreamed and wrote"
        difficulty: 1
        hints: ["She sat on the closed lid."]
        solution: "She read, dreamed of acting and began writing poems and stories."
      - prompt: "Why did she need somewhere to wait each morning?"
        options: ["She had to leave the house before 5.30 a.m. but her bus was at 7.30 a.m.", "Her factory opened at 5 a.m.", "She liked the park's flowers", "Her sister told her to exercise"]
        answer: "She had to leave the house before 5.30 a.m. but her bus was at 7.30 a.m."
        difficulty: 2
        hints: ["About two hours."]
        solution: "She left early to stay hidden and had about two hours before her bus."
        mistakes: {"Her factory opened at 5 a.m.": toilet_reason}
      - prompt: "What changes did she notice in the toilet one morning?"
        options: ["The door had been painted and a new windowpane fitted", "It had been pulled down", "A guard stood outside", "It was full of books"]
        answer: "The door had been painted and a new windowpane fitted"
        difficulty: 2
        hints: ["Paragraph 14."]
        solution: "The door was painted and the broken windowpane replaced."
        mistakes: {"It had been pulled down": read_the_lines}
      - prompt: "What did the narrator do when she found the toilet locked?"
        options: ["She sat on a bench and wrote the story anyway", "She went back home and cried", "She broke the lock", "She gave up writing"]
        answer: "She sat on a bench and wrote the story anyway"
        difficulty: 2
        hints: ["She watched the spring sun come up."]
        solution: "She accepted the toilet was not hers and wrote on a nearby bench."
        mistakes: {"She gave up writing": read_the_lines}
      - prompt: "Who is 'Irene' in the story?"
        options: ["The narrator's sister (her English name)", "The Madam", "A factory supervisor", "Her English teacher"]
        answer: "The narrator's sister (her English name)"
        difficulty: 1
        hints: ["'That's my sister's English name, which we never use.'"]
        solution: "Irene is the English name of the narrator's sister."
        mistakes: {"The Madam": read_the_lines}
      - prompt: "What is the main message of 'The Toilet'?"
        options: ["Determination can find a way to follow a dream even in hard circumstances", "Public toilets should be locked", "Sisters should not help each other", "Factory work is better than writing"]
        answer: "Determination can find a way to follow a dream even in hard circumstances"
        difficulty: 3
        hints: ["What did she keep doing in spite of everything?"]
        solution: "Loneliness and inequality did not stop her: she kept writing wherever she could."

  - code: eng9.u2.success
    title: Success (Poem)
    after: [eng9.u2.dreams_realised]
    notes: |
      Poem by Henry Wadsworth Longfellow (American, 1807–1882). "We have not wings, we cannot soar; /
      But we have feet to scale and climb / By slow degrees". The pyramids, seen close, are "but gigantic
      flights of stairs"; distant mountains are crossed by pathways that appear as we rise higher. "The
      heights by great men reached and kept / Were not attained by sudden flight, / But they, while their
      companions slept, / Were toiling upward in the night." Message: success comes from steady,
      patient, hard work. Images: cloudy summits, pyramids, mountains as bastions of the skies, stairs.
    explanations:
      text: "Longfellow says we cannot fly to the top, but we can climb step by step. Even the pyramids are just huge staircases when you look closely. Great people worked while others slept: success is many small steps, not one jump."
      visual: "Draw a pyramid made of steps. Put a small figure on the bottom step and a flag at the top labelled 'success', with the words 'by slow degrees'."
      step_by_step: "What do the last lines mean? Step 1: 'The heights by great men reached' = their success. Step 2: 'not attained by sudden flight' = not achieved quickly. Step 3: 'toiling upward in the night' = working hard while others rested."
      real_world: "A topper in the SSLC exam or a state-level athlete usually has months of daily practice behind one result, like climbing stairs."
    items:
      - prompt: "Who wrote the poem 'Success'?"
        options: ["Henry Wadsworth Longfellow", "John Masefield", "Rabindranath Tagore", "Wislawa Szymborska"]
        answer: "Henry Wadsworth Longfellow"
        difficulty: 1
        hints: ["An American poet and professor."]
        solution: "H. W. Longfellow wrote 'Success'."
      - prompt: "When seen closely, what do the pyramids look like, according to the poem?"
        options: ["Gigantic flights of stairs", "Mountains of sand", "Clouds", "Tall towers"]
        answer: "Gigantic flights of stairs"
        difficulty: 1
        hints: ["'When nearer seen and better known'."]
        solution: "They are 'but gigantic flights of stairs'."
      - prompt: "Which line shows human strength in the poem?"
        options: ["But we have feet to scale and climb", "We have not wings, we cannot soar", "The mighty pyramids of stone", "The cloudy summits of our time"]
        answer: "But we have feet to scale and climb"
        difficulty: 2
        hints: ["What can we do even without wings?"]
        solution: "Though we cannot fly, we have feet to climb: that is our strength."
        mistakes: {"We have not wings, we cannot soar": success_message}
      - prompt: "How did great men reach their heights, according to the poem?"
        options: ["By toiling upward in the night while others slept", "By a sudden flight", "By luck", "By the help of kings"]
        answer: "By toiling upward in the night while others slept"
        difficulty: 2
        hints: ["Not 'by sudden flight'."]
        solution: "They worked hard while their companions slept."
        mistakes: {"By a sudden flight": success_message}
      - prompt: "What is the main message of 'Success'?"
        options: ["Success comes through steady, patient hard work", "Only people with wings succeed", "Success is a matter of luck", "Mountains cannot be climbed"]
        answer: "Success comes through steady, patient hard work"
        difficulty: 2
        hints: ["'By slow degrees, by more and more'."]
        solution: "Step-by-step effort leads to success."
        mistakes: {"Success is a matter of luck": success_message}
      - prompt: "In the line 'The distant mountains, that uprear / Their solid bastions of the skies', what does 'bastions' mean?"
        options: ["Strongholds", "Rivers", "Clouds", "Birds"]
        answer: "Strongholds"
        difficulty: 3
        hints: ["See the glossary."]
        solution: "Bastion here means stronghold: the mountains stand like fortresses of the sky."
        mistakes: {"Clouds": glossary_word}

  - code: eng9.u2.grammar
    title: "Grammar: uses of 'would', past perfect and phrasal verbs"
    after: [eng9.u2.the_toilet]
    notes: |
      'Would' shows a past habit (I would go to a public toilet in the park), certainty/prediction (I was
      sure they would tear me to pieces; the forecast said it would be sunny), a polite request (Would you
      please close the window?), a conditional (If I got a chance, I would travel), willingness (John said
      he would be happy to help), and 'will' in indirect speech (Madam told me that she would inform my
      sister). Past perfect (had + past participle) shows the earlier of two past events; simple past the
      later (Chaplin had heard of the spinning wheel and asked...). Phrasal verbs: went on (continued),
      stayed on, turned up, sneaked into, knocked off (stopped work).
    explanations:
      text: "'Would' is a busy word: it can look back at habits, ask politely, imagine, or report what someone said they 'will' do. When two things happened in the past, 'had' marks the one that happened first."
      visual: "Draw a timeline with two dots in the past. Label the left dot 'had heard' (earlier) and the right dot 'asked' (later). Now is on the far right."
      step_by_step: "Which happened first in 'Dad had cooked breakfast before Mom woke up'? Step 1: Look for 'had + past participle': had cooked. Step 2: That is the earlier action. Step 3: Dad cooked first; Mom woke up later."
      real_world: "At a shop you say 'Would you show me that one, please?': polite 'would' makes requests sound kinder."
    items:
      - prompt: "'When I was a child, I would play in the park every evening.' What is 'would' used for here?"
        options: ["A past habit", "A polite request", "A prediction", "A conditional"]
        answer: "A past habit"
        difficulty: 1
        hints: ["'every evening' when she was a child."]
        solution: "It shows a regular, repeated action in the past."
        mistakes: {"A prediction": would_uses, "A polite request": would_uses}
      - prompt: "'Would you please close the window?' What is 'would' used for here?"
        options: ["A polite request", "A past habit", "Willingness", "Certainty"]
        answer: "A polite request"
        difficulty: 1
        hints: ["It is a question asking someone to do something."]
        solution: "'Would you please...?' makes a polite request."
        mistakes: {"A past habit": would_uses}
      - prompt: "'If I got a chance, I would travel the whole world.' What is 'would' used for here?"
        options: ["A conditional statement", "A past habit", "Reported speech", "A polite request"]
        answer: "A conditional statement"
        difficulty: 2
        hints: ["Notice 'If'."]
        solution: "'If ... would' is a conditional."
        mistakes: {"A past habit": would_uses}
      - prompt: "Report: Madam said to me, \"I will inform your sister.\""
        options: ["Madam told me that she would inform my sister.", "Madam told me that she will inform your sister.", "Madam told me that I would inform my sister.", "Madam asked me to inform my sister."]
        answer: "Madam told me that she would inform my sister."
        difficulty: 2
        hints: ["'will' becomes 'would'; change the pronouns."]
        solution: "will → would; I → she; your → my."
        mistakes: {"Madam told me that she will inform your sister.": would_uses}
      - prompt: "In 'Even celebrities who had heard about him were eager to meet him', which happened earlier?"
        options: ["Hearing about him", "Being eager to meet him", "Both at the same time", "Neither happened"]
        answer: "Hearing about him"
        difficulty: 2
        hints: ["Look for had + past participle."]
        solution: "'had heard' is past perfect: the earlier action."
        mistakes: {"Being eager to meet him": past_perfect_order}
      - prompt: "Choose the correct form: 'The alarm ___ before I woke up.'"
        options: ["had gone off", "has gone off", "goes off", "was going off"]
        answer: "had gone off"
        difficulty: 3
        hints: ["Earlier of two past actions."]
        solution: "The alarm went off first, so use past perfect: had gone off."
        mistakes: {"has gone off": past_perfect_order}
      - prompt: "In 'He then went on to describe how they came out of their homes', what does 'went on' mean?"
        options: ["Continued", "Left", "Switched on", "Went away"]
        answer: "Continued"
        difficulty: 2
        hints: ["A phrasal verb has its own meaning."]
        solution: "'Went on' means continued."
        mistakes: {"Left": phrasal_verb, "Switched on": phrasal_verb}

  - code: eng9.u2.words
    title: "Words: the Unit II glossary"
    after: [eng9.u2.dreams_realised]
    notes: |
      Glossary: expound (explain in detail), defy (disobey), retaliate (respond to harm in the same way),
      testify (prove the truth), unflinchingly (fearlessly), unlettered (uneducated), war-weary (exhausted
      by war), score (a group of twenty), notion (idea), precisely (exactly), restore (bring back),
      miraculous (wonderful), toil (work very hard), soar (rise up), bastion (stronghold), subsidiary
      (less important). Expressions describing a person/place: spiritual ambassador of India,
      exploitation-blinded West, healing balm, war-weary Europe.
    explanations:
      text: "Many Unit II words are about struggle: to defy unjust laws, to stand unflinchingly, not to retaliate, to toil. Learn them in pairs of opposites: defy/obey, retaliate/forgive, unlettered/educated."
      visual: "Make word cards with the word on one side and a small drawing on the other: a fist held back (not retaliate), a person standing straight under rain (unflinchingly), a stack of 20 dots (score)."
      step_by_step: "How many letters are 'scores of letters' if a score is 20 and there were 3 scores? Step 1: 1 score = 20. Step 2: 3 scores = 3 × 20. Step 3: 60 letters."
      real_world: "Courts ask witnesses to 'testify' — to tell the truth about what they saw."
    items:
      - prompt: "What does 'retaliate' mean?"
        options: ["To respond to a harmful act in the same way", "To forgive", "To run away", "To retire"]
        answer: "To respond to a harmful act in the same way"
        difficulty: 1
        hints: ["'to stand the blows ... and not to retaliate'"]
        solution: "Retaliate means to hit back."
        mistakes: {"To forgive": glossary_word}
      - prompt: "A 'score' is a group of how many?"
        answer: "20"
        check: "20"
        difficulty: 1
        hints: ["'Scores of letters came daily'."]
        solution: "A score is twenty."
        mistakes: {"100": glossary_word, "12": glossary_word}
      - prompt: "What does 'unlettered' mean?"
        options: ["Uneducated", "Without letters in the post", "Unknown", "Unhappy"]
        answer: "Uneducated"
        difficulty: 2
        hints: ["Gandhiji contrasts them with learned women."]
        solution: "Unlettered means uneducated, unable to read and write."
        mistakes: {"Without letters in the post": glossary_word}
      - prompt: "Gandhiji received 3 scores of letters on one day. How many letters is that?"
        answer: "60"
        check: "3*20"
        difficulty: 2
        hints: ["1 score = 20."]
        solution: "3 × 20 = 60 letters"
        mistakes: {"3": glossary_word, "300": glossary_word}
      - prompt: "What does 'expound' mean in 'He expounded the message of non-violence'?"
        options: ["Explained in detail", "Expanded a building", "Refused", "Forgot"]
        answer: "Explained in detail"
        difficulty: 2
        hints: ["He was speaking to the youth."]
        solution: "Expound means to explain in detail."
        mistakes: {"Expanded a building": glossary_word}
      - prompt: "Which word means 'in a fearless manner'?"
        options: ["unflinchingly", "miraculously", "precisely", "subsidiary"]
        answer: "unflinchingly"
        difficulty: 3
        hints: ["The women stood this way while bleeding."]
        solution: "Unflinchingly = without flinching, fearlessly."
        mistakes: {"precisely": glossary_word}
