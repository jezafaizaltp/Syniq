  - code: eng9.u2.success
    title: Success (Poem)
    after: [eng9.u2.dreams_realised]
    notes: |
      Poem by Henry Wadsworth Longfellow (American, 1807–1882). "We have not wings, we cannot soar; /
      But we have feet to scale and climb / By slow degrees". The pyramids, seen close, are "but gigantic
      flights of stairs"; distant mountains are crossed by pathways that appear as we rise higher. "The
      heights by great men reached and kept / Were not attained by sudden flight, / But they, while their
      companions slept, / Were toiling upward in the night." Message: success comes from steady,
      patient, hard work. Images: cloudy summits, pyramids, mountains as bastions of the skies, stairs.
    explanations:
      text: "Longfellow says we cannot fly to the top, but we can climb step by step. Even the pyramids are just huge staircases when you look closely. Great people worked while others slept: success is many small steps, not one jump."
      visual: "Draw a pyramid made of steps. Put a small figure on the bottom step and a flag at the top labelled 'success', with the words 'by slow degrees'."
      step_by_step: "What do the last lines mean? Step 1: 'The heights by great men reached' = their success. Step 2: 'not attained by sudden flight' = not achieved quickly. Step 3: 'toiling upward in the night' = working hard while others rested."
      real_world: "A topper in the SSLC exam or a state-level athlete usually has months of daily practice behind one result, like climbing stairs."
    activity:
      type: sort
      prompt: What does the image in 'Success' mean?
      bins:
      - Steady effort
      - Sudden flight
      items:
      - label: '''We have feet to scale and climb by slow degrees'''
        bin: Steady effort
        clue: Feet, step by step.
        why: Climbing slowly is steady effort.
      - label: Pyramids are 'gigantic flights of stairs'
        bin: Steady effort
        clue: One step at a time.
        why: Big things are built step by step.
      - label: '''Toiling upward in the night'''
        bin: Steady effort
        clue: While others slept.
        why: Hard, patient work.
      - label: '''We have not wings, we cannot soar'''
        bin: Sudden flight
        clue: What do we NOT have?
        why: This is the way we can't reach heights.
      - label: '''Not attained by sudden flight'''
        bin: Sudden flight
        clue: What the poet says does not work.
        why: Heights are not reached this way.
    lesson:
      - teach: '''Success'' is by Henry Wadsworth Longfellow, an American poet (1807–1882). ''We have not wings, we cannot soar; / But we have feet to scale and climb / By slow degrees.'' We cannot fly to the top, but we can climb step by step.'
        check:
          prompt: What does the poem say we have instead of wings?
          options:
          - Feet to scale and climb
          - Ladders
          - Friends to carry us
          answer: Feet to scale and climb
          why: We reach heights slowly, by climbing.
        ways:
        - style: real_world
          teach: 'You can''t jump to the top of a hill, but you can walk up it one step at a time. Henry Wadsworth Longfellow, an American poet (1807-1882), says the same in ''Success'': ''We have not wings, we cannot soar; / But we have feet to scale and climb / By slow degrees.'''
      - teach: 'Images: the pyramids, seen close, are only ''gigantic flights of stairs''; distant mountains show paths as we climb higher. Big goals look impossible from afar but are made of small steps (metaphor).'
        picture:
          kind: flow
          steps:
          - 'Far away: a huge pyramid'
          - 'Close up: many stairs'
          - One step at a time
          - Top reached
          alt: Big goals are made of small steps.
        check:
          prompt: '''The pyramids are but gigantic flights of stairs'' is a'
          options:
          - Metaphor
          - Simile
          - Question
          answer: Metaphor
          why: It says one thing IS another, without 'like' or 'as'.
        ways:
        - style: real_world
          teach: 'From far away, a big temple tower looks like one smooth peak; up close, you see every stair and ledge. Longfellow says the pyramids, seen close, are only ''gigantic flights of stairs'', and distant mountains show their paths as we climb. Calling pyramids ''stairs'' without ''like'' or ''as'' is a metaphor: big goals are made of small steps.'
      - teach: '''The heights by great men reached and kept / Were not attained by sudden flight, / But they, while their companions slept, / Were toiling upward in the night.'' Success comes from steady, patient hard work.'
        check:
          prompt: How did great men reach their heights?
          options:
          - By working hard while others slept
          - By luck
          - By sudden flight
          answer: By working hard while others slept
          why: The poem says they were 'toiling upward in the night'.
        ways:
        - style: real_world
          teach: 'Think of a top student who revises at night while classmates sleep. The poem says: ''The heights by great men reached and kept / Were not attained by sudden flight, / But they, while their companions slept, / Were toiling upward in the night.'' Success comes from steady, patient hard work, not one sudden leap.'
    items:
      - prompt: "Who wrote the poem 'Success'?"
        options: ["Henry Wadsworth Longfellow", "John Masefield", "Rabindranath Tagore", "Wislawa Szymborska"]
        answer: "Henry Wadsworth Longfellow"
        difficulty: 1
        hints: ["An American poet and professor."]
        solution: "H. W. Longfellow wrote 'Success'."
        mistakes: {"John Masefield": "poem_author", "Wislawa Szymborska": "poem_author"}
      - prompt: "When seen closely, what do the pyramids look like, according to the poem?"
        options: ["Gigantic flights of stairs", "Mountains of sand", "Clouds", "Tall towers"]
        answer: "Gigantic flights of stairs"
        difficulty: 1
        hints: ["'When nearer seen and better known'."]
        solution: "They are 'but gigantic flights of stairs'."
        mistakes: {"Mountains of sand": "pyramids_stairs", "Tall towers": "pyramids_stairs"}
      - prompt: "Which line shows human strength in the poem?"
        options: ["But we have feet to scale and climb", "We have not wings, we cannot soar", "The mighty pyramids of stone", "The cloudy summits of our time"]
        answer: "But we have feet to scale and climb"
        difficulty: 2
        hints: ["What can we do even without wings?"]
        solution: "Though we cannot fly, we have feet to climb: that is our strength."
        mistakes: {"We have not wings, we cannot soar": success_message}
      - prompt: "How did great men reach their heights, according to the poem?"
        options: ["By toiling upward in the night while others slept", "By a sudden flight", "By luck", "By the help of kings"]
        answer: "By toiling upward in the night while others slept"
        difficulty: 2
        hints: ["Not 'by sudden flight'."]
        solution: "They worked hard while their companions slept."
        mistakes: {"By a sudden flight": success_message}
      - prompt: "What is the main message of 'Success'?"
        options: ["Success comes through steady, patient hard work", "Only people with wings succeed", "Success is a matter of luck", "Mountains cannot be climbed"]
        answer: "Success comes through steady, patient hard work"
        difficulty: 2
        hints: ["'By slow degrees, by more and more'."]
        solution: "Step-by-step effort leads to success."
        mistakes: {"Success is a matter of luck": success_message}
      - prompt: "In the line 'The distant mountains, that uprear / Their solid bastions of the skies', what does 'bastions' mean?"
        options: ["Strongholds", "Rivers", "Clouds", "Birds"]
        answer: "Strongholds"
        difficulty: 3
        hints: ["See the glossary."]
        solution: "Bastion here means stronghold: the mountains stand like fortresses of the sky."
        mistakes: {"Clouds": glossary_word}
      - prompt: "What does the poet mean by 'We have not wings, we cannot soar'?"
        options: ["We cannot reach success in one leap; we must climb step by step", "People should build aeroplanes", "Birds are lazier than people", "We should stop trying to rise"]
        answer: "We cannot reach success in one leap; we must climb step by step"
        difficulty: 2
        hints: ["Read the next line: 'But we have feet to scale and climb'.", "'By slow degrees.'"]
        solution: "Step 1: Without wings we can't fly straight up. Step 2: But we can climb, slowly and steadily, which is how success comes."
        mistakes: {"People should build aeroplanes": no_wings, "Birds are lazier than people": no_wings, "We should stop trying to rise": no_wings}
      - prompt: "'The pyramids ... are but gigantic flights of stairs.' Which figure of speech is this?"
        options: ["Metaphor", "Simile", "Onomatopoeia", "Alliteration"]
        answer: "Metaphor"
        difficulty: 3
        hints: ["Is there 'like' or 'as' in the line?", "The pyramids are said to BE stairs."]
        solution: "Step 1: There is no 'like' or 'as', so it is not a simile. Step 2: Saying one thing is another is a metaphor."
        mistakes: {"Simile": is_or_like, "Onomatopoeia": is_or_like, "Alliteration": is_or_like}
      - prompt: Longfellow was a poet from which country?
        options:
        - America
        - England
        - Poland
        - South Africa
        answer: America
        difficulty: 1
        hints:
        - He lived from 1807 to 1882.
        - He is known as an American poet.
        solution: 'Step 1: Longfellow lived in the 1800s. Step 2: He was from the USA. Step 3: America.'
        mistakes:
          England: poem_author
      - prompt: What does 'soar' mean in 'we cannot soar'?
        options:
        - Fly high
        - Walk slowly
        - Sleep
        - Fall down
        answer: Fly high
        difficulty: 1
        hints:
        - Birds with wings can do this.
        - It is the opposite of climbing slowly.
        solution: 'Step 1: The line is about wings. Step 2: With wings you rise up. Step 3: Soar = fly high.'
        mistakes:
          Walk slowly: e2_climb_not_fly
      - prompt: What does 'by slow degrees' mean?
        options:
        - Little by little
        - Very quickly
        - Never
        - All at once
        answer: Little by little
        difficulty: 2
        hints:
        - Degrees here are small steps.
        - Slow steps add up.
        solution: 'Step 1: Degrees = steps or stages. Step 2: Slow ones are small. Step 3: Little by little.'
        mistakes:
          All at once: e2_climb_not_fly
      - prompt: What were great men doing 'while their companions slept'?
        options:
        - Toiling upward
        - Flying
        - Sleeping too
        - Building pyramids
        answer: Toiling upward
        difficulty: 1
        hints:
        - They were working.
        - '''Toil'' means hard work.'
        solution: 'Step 1: Their friends rested. Step 2: They worked hard. Step 3: Toiling upward in the night.'
        mistakes:
          Flying: e2_night_work
      - prompt: Which word means 'hard work' in the poem?
        options:
        - toiling
        - soar
        - bastions
        - summits
        answer: toiling
        difficulty: 2
        hints:
        - It describes what great men did at night.
        - It ends in -ing.
        solution: 'Step 1: Soar = fly; bastions = strongholds; summits = tops. Step 2: Hard work is the remaining one. Step 3: toiling.'
        mistakes:
          soar: e2_word_sense
      - prompt: '''Were not attained by sudden flight'' tells us that success'
        options:
        - Does not come all at once
        - Needs an aeroplane
        - Comes only to birds
        - Is impossible
        answer: Does not come all at once
        difficulty: 2
        hints:
        - '''Sudden flight'' means a quick jump to the top.'
        - The poem says this did NOT happen.
        solution: 'Step 1: Sudden flight = instant success. Step 2: The line denies it. Step 3: Success does not come all at once.'
        mistakes:
          Is impossible: e2_climb_not_fly
      - prompt: Why might a student find this poem encouraging before exams?
        options:
        - It says steady daily effort leads to success
        - It says exams don't matter
        - It says only gifted people succeed
        - It says rest is better than work
        answer: It says steady daily effort leads to success
        difficulty: 3
        hints:
        - What is the poem's message?
        - How does that fit preparing over weeks?
        solution: 'Step 1: The poem praises patient hard work. Step 2: Exam study works the same way. Step 3: Steady effort leads to success.'
        mistakes:
          It says only gifted people succeed: success_message

  - code: eng9.u2.grammar
    title: "Grammar: uses of 'would', past perfect and phrasal verbs"
    after: [eng9.u2.the_toilet]
    notes: |
      'Would' shows a past habit (I would go to a public toilet in the park), certainty/prediction (I was
      sure they would tear me to pieces; the forecast said it would be sunny), a polite request (Would you
      please close the window?), a conditional (If I got a chance, I would travel), willingness (John said
      he would be happy to help), and 'will' in indirect speech (Madam told me that she would inform my
      sister). Past perfect (had + past participle) shows the earlier of two past events; simple past the
      later (Chaplin had heard of the spinning wheel and asked...). Phrasal verbs: went on (continued),
      stayed on, turned up, sneaked into, knocked off (stopped work).
    explanations:
      text: "'Would' is a busy word: it can look back at habits, ask politely, imagine, or report what someone said they 'will' do. When two things happened in the past, 'had' marks the one that happened first."
      visual: "Draw a timeline with two dots in the past. Label the left dot 'had heard' (earlier) and the right dot 'asked' (later). Now is on the far right."
      step_by_step: "Which happened first in 'Dad had cooked breakfast before Mom woke up'? Step 1: Look for 'had + past participle': had cooked. Step 2: That is the earlier action. Step 3: Dad cooked first; Mom woke up later."
      real_world: "At a shop you say 'Would you show me that one, please?': polite 'would' makes requests sound kinder."
    activity:
      type: sort
      prompt: What does 'would' show here?
      bins:
      - Past habit
      - Polite request
      - Conditional
      - Reported 'will'
      items:
      - label: I would go to a public toilet in the park.
        bin: Past habit
        clue: Something she did again and again.
        why: Past habit.
      - label: Would you please close the window?
        bin: Polite request
        clue: Asking kindly.
        why: Polite request.
      - label: If I got a chance, I would travel.
        bin: Conditional
        clue: Look for 'if'.
        why: Conditional.
      - label: Madam told me that she would inform my sister.
        bin: Reported 'will'
        clue: Direct speech was 'I will inform'.
        why: '''will'' becomes ''would'' in reported speech.'
      - label: Every morning he would read the paper.
        bin: Past habit
        clue: Every morning.
        why: Past habit.
      - label: Would you pass the salt?
        bin: Polite request
        clue: Asking.
        why: Polite request.
    lesson:
      - teach: '''Would'' has many jobs. Past habit: ''Every morning I would sit in the park.'' Polite request: ''Would you close the door?'' Conditional: ''If I had time, I would help.'' Willingness: ''He said he would help.'' Prediction in the past: ''I knew it would rain.'' Reported ''will'': ''She said, "I will come"'' → ''She said she would come.'''
        picture:
          kind: compare
          columns:
          - title: Habit / request
            points:
            - I would play there daily.
            - Would you pass the salt?
          - title: Condition / report
            points:
            - If I won, I would celebrate.
            - He said he would call.
          alt: Some uses of 'would'.
        check:
          prompt: '''Would you lend me your pen?'' shows'
          options:
          - A polite request
          - A past habit
          - A condition
          answer: A polite request
          why: It asks for something politely.
        ways:
        - style: real_world
          teach: 'Listen for ''would'' through one day. Grandpa remembers: ''Every morning I would sit in the park'' (past habit). At the shop: ''Would you close the door?'' (polite request). Planning: ''If I had time, I would help'' (conditional). A friend: ''He said he would help'' (willingness). Looking back: ''I knew it would rain'' (prediction in the past).'
      - teach: 'Past perfect (had + past participle) shows which of two past actions happened first. ''The bus had left when I reached the stop.'' First: the bus left. Then: I reached.'
        picture:
          kind: flow
          steps:
          - 'Earlier: had left (past perfect)'
          - 'Later: reached (simple past)'
          alt: Past perfect shows the earlier action.
        check:
          prompt: In 'She had eaten before we arrived', what happened first?
          options:
          - She ate
          - We arrived
          - Both together
          answer: She ate
          why: '''had eaten'' marks the earlier action.'
        ways:
        - style: step_by_step
          teach: 'Use two steps to read a past perfect sentence. Step 1: find the verb with ''had'' (''had left''); that action came first. Step 2: the plain past verb (''reached'') came second. So in ''The bus had left when I reached the stop'', the bus left, then I reached.'
      - teach: 'Phrasal verbs are verb + small word with a new meaning: go on (continue), turn up (arrive), knock off (stop work), sneak into (enter secretly), stay on (remain).'
        check:
          prompt: '''We knocked off at five'' means'
          options:
          - We stopped work at five
          - We knocked a door at five
          - We fell at five
          answer: We stopped work at five
          why: Knock off is a phrasal verb meaning stop work.
        ways:
        - style: real_world
          teach: Office and school talk is full of phrasal verbs. 'We knocked off at five' means we stopped work. 'Go on' means continue. 'He turned up late' means he arrived. 'She sneaked into the hall' means she entered secretly. 'Stay on after class' means remain. The small word changes the verb's meaning.
    items:
      - prompt: "'When I was a child, I would play in the park every evening.' What is 'would' used for here?"
        options: ["A past habit", "A polite request", "A prediction", "A conditional"]
        answer: "A past habit"
        difficulty: 1
        hints: ["'every evening' when she was a child."]
        solution: "It shows a regular, repeated action in the past."
        mistakes: {"A prediction": would_uses, "A polite request": would_uses}
      - prompt: "'Would you please close the window?' What is 'would' used for here?"
        options: ["A polite request", "A past habit", "Willingness", "Certainty"]
        answer: "A polite request"
        difficulty: 1
        hints: ["It is a question asking someone to do something."]
        solution: "'Would you please...?' makes a polite request."
        mistakes: {"A past habit": would_uses}
      - prompt: "'If I got a chance, I would travel the whole world.' What is 'would' used for here?"
        options: ["A conditional statement", "A past habit", "Reported speech", "A polite request"]
        answer: "A conditional statement"
        difficulty: 2
        hints: ["Notice 'If'."]
        solution: "'If ... would' is a conditional."
        mistakes: {"A past habit": would_uses}
      - prompt: "Report: Madam said to me, \"I will inform your sister.\""
        options: ["Madam told me that she would inform my sister.", "Madam told me that she will inform your sister.", "Madam told me that I would inform my sister.", "Madam asked me to inform my sister."]
        answer: "Madam told me that she would inform my sister."
        difficulty: 2
        hints: ["'will' becomes 'would'; change the pronouns."]
        solution: "will → would; I → she; your → my."
        mistakes: {"Madam told me that she will inform your sister.": would_uses}
      - prompt: "In 'Even celebrities who had heard about him were eager to meet him', which happened earlier?"
        options: ["Hearing about him", "Being eager to meet him", "Both at the same time", "Neither happened"]
        answer: "Hearing about him"
        difficulty: 2
        hints: ["Look for had + past participle."]
        solution: "'had heard' is past perfect: the earlier action."
        mistakes: {"Being eager to meet him": past_perfect_order}
      - prompt: "Choose the correct form: 'The alarm ___ before I woke up.'"
        options: ["had gone off", "has gone off", "goes off", "was going off"]
        answer: "had gone off"
        difficulty: 3
        hints: ["Earlier of two past actions."]
        solution: "The alarm went off first, so use past perfect: had gone off."
        mistakes: {"has gone off": past_perfect_order}
      - prompt: "In 'He then went on to describe how they came out of their homes', what does 'went on' mean?"
        options: ["Continued", "Left", "Switched on", "Went away"]
        answer: "Continued"
        difficulty: 2
        hints: ["A phrasal verb has its own meaning."]
        solution: "'Went on' means continued."
        mistakes: {"Left": phrasal_verb, "Switched on": phrasal_verb}
      - prompt: "Join using the past perfect: 'The train left. Then we reached the station.'"
        options: ["The train had left when we reached the station.", "The train left when we had reached the station.", "The train has left when we reached the station.", "The train was leaving when we had reached the station."]
        answer: "The train had left when we reached the station."
        difficulty: 2
        hints: ["Which action happened first?", "The earlier action takes had + past participle."]
        solution: "Step 1: The train left first. Step 2: So: 'The train had left when we reached the station.'"
        mistakes: {"The train left when we had reached the station.": past_perfect_order, "The train has left when we reached the station.": past_perfect_order, "The train was leaving when we had reached the station.": past_perfect_order}
      - prompt: "'I was sure they would tear me to pieces.' What is 'would' used for here?"
        options: ["Certainty or prediction in the past", "A past habit", "A polite request", "A conditional"]
        answer: "Certainty or prediction in the past"
        difficulty: 2
        hints: ["Look at 'I was sure'.", "Is she describing something she did every day?"]
        solution: "Step 1: 'I was sure' shows she expected something. Step 2: So 'would' expresses a prediction made in the past."
        mistakes: {"A past habit": certain_future, "A polite request": would_uses, "A conditional": would_uses}
      - prompt: "In which sentence does 'would' show a past habit?"
        options:
        - "Every morning she would sit in the toilet and read."
        - "Would you please close the window?"
        - "If I got a chance, I would travel."
        - "She said she would inform my sister."
        answer: "Every morning she would sit in the toilet and read."
        difficulty: 3
        hints: ["A past habit is something done again and again in the past.", "Which sentence has a time word that shows repetition?"]
        solution: "Step 1: 'Every morning' shows a repeated past action. Step 2: The others show a polite request, a condition and reported speech. Step 3: So the first sentence uses 'would' for a past habit."
        mistakes: {"Would you please close the window?": would_uses, "If I got a chance, I would travel.": would_uses, "She said she would inform my sister.": would_uses}
      - prompt: 'Report: He said, "I will help you."'
        options:
        - He said that he would help me.
        - He said that he will help you.
        - He said that I would help him.
        - He said he helps me.
        answer: He said that he would help me.
        difficulty: 2
        hints:
        - In reported speech, 'will' changes.
        - Pronouns change to fit the speaker and listener.
        solution: 'Step 1: will → would. Step 2: I → he, you → me. Step 3: He said that he would help me.'
        mistakes:
          He said that he will help you.: e2_would_job
      - prompt: 'Choose the correct form: ''By the time the doctor came, the patient ___.'''
        options:
        - had recovered
        - recovers
        - has recovered
        - will recover
        answer: had recovered
        difficulty: 2
        hints:
        - Which action happened first?
        - The earlier past action uses had + past participle.
        solution: 'Step 1: Recovery happened before the doctor came. Step 2: Earlier action → past perfect. Step 3: had recovered.'
        mistakes:
          has recovered: e2_earlier_event
      - prompt: '''If it rained, we would stay home.'' What is ''would'' used for?'
        options:
        - A conditional
        - A past habit
        - A polite request
        - Reported speech
        answer: A conditional
        difficulty: 1
        hints:
        - Look at the word 'if'.
        - It shows a result that depends on something.
        solution: 'Step 1: ''If'' sets a condition. Step 2: ''would stay'' is the result. Step 3: Conditional.'
        mistakes:
          A past habit: e2_would_job
      - prompt: What does 'turned up' mean in 'Only two friends turned up for the party'?
        options:
        - Arrived
        - Left early
        - Got angry
        - Cooked
        answer: Arrived
        difficulty: 1
        hints:
        - Think about guests and a party.
        - How many came?
        solution: 'Step 1: The sentence counts guests. Step 2: Turn up = come or appear. Step 3: Arrived.'
        mistakes:
          Left early: phrasal_verb
      - prompt: Which sentence uses the past perfect correctly?
        options:
        - I had finished my homework before dinner.
        - I had finish my homework before dinner.
        - I have finished my homework yesterday.
        - I finishing my homework before dinner.
        answer: I had finished my homework before dinner.
        difficulty: 3
        hints:
        - Past perfect = had + past participle.
        - Check the verb form after 'had'.
        solution: 'Step 1: Need ''had'' + past participle. Step 2: ''finish'' is not a past participle. Step 3: had finished.'
        mistakes:
          I had finish my homework before dinner.: e2_earlier_event

  - code: eng9.u2.words
    title: "Words: the Unit II glossary"
    after: [eng9.u2.dreams_realised]
    notes: |
      Glossary: expound (explain in detail), defy (disobey), retaliate (respond to harm in the same way),
      testify (prove the truth), unflinchingly (fearlessly), unlettered (uneducated), war-weary (exhausted
      by war), score (a group of twenty), notion (idea), precisely (exactly), restore (bring back),
      miraculous (wonderful), toil (work very hard), soar (rise up), bastion (stronghold), subsidiary
      (less important). Expressions describing a person/place: spiritual ambassador of India,
      exploitation-blinded West, healing balm, war-weary Europe.
    explanations:
      text: "Many Unit II words are about struggle: to defy unjust laws, to stand unflinchingly, not to retaliate, to toil. Learn them in pairs of opposites: defy/obey, retaliate/forgive, unlettered/educated."
      visual: "Make word cards with the word on one side and a small drawing on the other: a fist held back (not retaliate), a person standing straight under rain (unflinchingly), a stack of 20 dots (score)."
      step_by_step: "How many letters are 'scores of letters' if a score is 20 and there were 3 scores? Step 1: 1 score = 20. Step 2: 3 scores = 3 × 20. Step 3: 60 letters."
      real_world: "Courts ask witnesses to 'testify' — to tell the truth about what they saw."
    activity:
      type: sort
      prompt: Match the word to its meaning.
      bins:
      - Fight back
      - Work very hard
      - Without fear
      - Group of twenty
      items:
      - label: retaliate
        bin: Fight back
        clue: Respond to harm in the same way.
        why: retaliate = fight back.
      - label: toil
        bin: Work very hard
        clue: '''Toiling upward in the night''.'
        why: toil = work very hard.
      - label: unflinchingly
        bin: Without fear
        clue: Without stepping back.
        why: unflinchingly = fearlessly.
      - label: score
        bin: Group of twenty
        clue: '''Four score'' = eighty.'
        why: score = twenty.
    lesson:
      - teach: 'Unit II words: expound (explain in detail), defy (disobey openly), retaliate (hit back), testify (prove true), unflinchingly (fearlessly), unlettered (uneducated), notion (idea), precisely (exactly), restore (bring back), toil (work hard), soar (rise up), bastion (stronghold).'
        check:
          prompt: '''Restore'' means'
          options:
          - Bring back
          - Throw away
          - Store again in a shop
          answer: Bring back
          why: To restore peace is to bring it back.
        ways:
        - style: real_world
          teach: Try the Unit II words in a school story. The teacher will expound (explain in detail) the lesson. A student who defies the rules disobeys openly. Don't retaliate (hit back) when pushed. Marks can testify (prove true) your effort. Toil means work hard; restore means bring back; soar means rise up; a bastion is a stronghold; a notion is an idea.
      - teach: 'A score is a group of twenty: two score = 40, four score = 80. Descriptive expressions in the unit: spiritual ambassador of India, exploitation-blinded West, healing balm, war-weary Europe (war-weary is a compound adjective).'
        check:
          prompt: How many is 'five score'?
          options:
          - '100'
          - '50'
          - '25'
          answer: '100'
          why: 5 × 20 = 100.
        ways:
        - style: step_by_step
          teach: 'Count in scores: one score is 20. Two score is 2 x 20 = 40. Four score is 4 x 20 = 80. For any number of scores, multiply by 20. Also notice ''war-weary Europe'': two words joined by a hyphen to describe a noun make a compound adjective.'
    items:
      - prompt: "What does 'retaliate' mean?"
        options: ["To respond to a harmful act in the same way", "To forgive", "To run away", "To retire"]
        answer: "To respond to a harmful act in the same way"
        difficulty: 1
        hints: ["'to stand the blows ... and not to retaliate'"]
        solution: "Retaliate means to hit back."
        mistakes: {"To forgive": glossary_word}
      - prompt: "A 'score' is a group of how many?"
        answer: "20"
        check: "20"
        difficulty: 1
        hints: ["'Scores of letters came daily'."]
        solution: "A score is twenty."
        mistakes: {"100": glossary_word, "12": glossary_word}
      - prompt: "What does 'unlettered' mean?"
        options: ["Uneducated", "Without letters in the post", "Unknown", "Unhappy"]
        answer: "Uneducated"
        difficulty: 2
        hints: ["Gandhiji contrasts them with learned women."]
        solution: "Unlettered means uneducated, unable to read and write."
        mistakes: {"Without letters in the post": glossary_word}
      - prompt: "Gandhiji received 3 scores of letters on one day. How many letters is that?"
        answer: "60"
        check: "3*20"
        difficulty: 2
        hints: ["1 score = 20."]
        solution: "3 × 20 = 60 letters"
        mistakes: {"3": glossary_word, "300": glossary_word}
      - prompt: "What does 'expound' mean in 'He expounded the message of non-violence'?"
        options: ["Explained in detail", "Expanded a building", "Refused", "Forgot"]
        answer: "Explained in detail"
        difficulty: 2
        hints: ["He was speaking to the youth."]
        solution: "Expound means to explain in detail."
        mistakes: {"Expanded a building": glossary_word}
      - prompt: "Which word means 'in a fearless manner'?"
        options: ["unflinchingly", "miraculously", "precisely", "subsidiary"]
        answer: "unflinchingly"
        difficulty: 3
        hints: ["The women stood this way while bleeding."]
        solution: "Unflinchingly = without flinching, fearlessly."
        mistakes: {"precisely": glossary_word}
      - prompt: "Which word means 'to disobey openly'?"
        options: ["defy", "testify", "expound", "retaliate"]
        answer: "defy"
        difficulty: 2
        hints: ["Testify means prove; expound means explain.", "Retaliate means hit back."]
        solution: "Step 1: Check each glossary meaning. Step 2: Defy means to openly disobey or resist."
        mistakes: {"testify": glossary_word, "expound": glossary_word, "retaliate": glossary_word}
      - prompt: "What kind of word is 'war-weary'?"
        options: ["A compound adjective", "A phrasal verb", "A prefix", "A preposition"]
        answer: "A compound adjective"
        difficulty: 2
        hints: ["Two words joined by a hyphen.", "It describes people, like 'war-weary soldiers'."]
        solution: "Step 1: war + weary are joined by a hyphen. Step 2: Together they describe a noun, so it is a compound adjective."
        mistakes: {"A phrasal verb": compound_adjective, "A prefix": compound_adjective, "A preposition": compound_adjective}
      - prompt: "'Four score years' means how many years?"
        options:
        - "80"
        - "40"
        - "24"
        - "400"
        answer: "80"
        difficulty: 3
        hints: ["A 'score' is a group of a certain number.", "Multiply that number by four."]
        solution: "Step 1: One score = 20. Step 2: Four score = 4 × 20 = 80."
        mistakes: {"40": score_twenty, "24": score_twenty}
      - prompt: What does 'notion' mean?
        options:
        - Idea
        - Ocean
        - Movement
        - Noise
        answer: Idea
        difficulty: 1
        hints:
        - It is something in the mind.
        - '''I had no notion of it'' = I had no idea.'
        solution: 'Step 1: A notion is held in the mind. Step 2: It is a thought. Step 3: Idea.'
        mistakes:
          Movement: e2_word_sense
      - prompt: Two score and ten is how many?
        answer: '50'
        check: 2*20 + 10
        difficulty: 2
        hints:
        - Two score first.
        - Then add ten.
        solution: 'Step 1: 2 × 20 = 40. Step 2: 40 + 10 = 50. Step 3: 50.'
        mistakes:
          '12': e2_twenty
          '30': e2_twenty
      - prompt: Which word means 'exactly'?
        options:
        - precisely
        - miraculous
        - subsidiary
        - defy
        answer: precisely
        difficulty: 1
        hints:
        - '''At ___ six o''clock'' means at six sharp.'
        - It is an adverb.
        solution: 'Step 1: Miraculous = wonderful; subsidiary = less important; defy = disobey. Step 2: Exactly is the remaining meaning. Step 3: precisely.'
        mistakes:
          miraculous: e2_word_sense
      - prompt: What does 'testify' mean?
        options:
        - Prove or give evidence that something is true
        - Take a test
        - Get angry
        - Run away
        answer: Prove or give evidence that something is true
        difficulty: 2
        hints:
        - Witnesses do this in court.
        - It is about truth.
        solution: 'Step 1: Witnesses speak in court. Step 2: They show what is true. Step 3: Prove or give evidence.'
        mistakes:
          Take a test: e2_word_sense
      - prompt: Which word means 'less important'?
        options:
        - subsidiary
        - bastion
        - restore
        - soar
        answer: subsidiary
        difficulty: 2
        hints:
        - Think of a small company owned by a bigger one.
        - It is an adjective.
        solution: 'Step 1: Bastion = stronghold; restore = bring back; soar = rise. Step 2: Less important is left. Step 3: subsidiary.'
        mistakes:
          bastion: e2_word_sense
      - prompt: '''The war-weary people longed for peace.'' What does ''war-weary'' tell us?'
        options:
        - They were tired out by war
        - They loved war
        - They had never seen war
        - They were soldiers
        answer: They were tired out by war
        difficulty: 2
        hints:
        - Weary means very tired.
        - The compound joins two words.
        solution: 'Step 1: War + weary. Step 2: Weary = exhausted. Step 3: Tired out by war.'
        mistakes:
          They loved war: e2_word_sense
