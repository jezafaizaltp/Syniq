  - code: eng9.u5.let_it_go
    title: Let it Go (Song)
    after: [eng9.u5.ink_and_melody]
    notes: |
      Song from Disney's animated film 'Frozen' (2013), music and lyrics by Kristen Anderson-Lopez and
      Robert Lopez, sung by Idina Menzel; Academy Award for Best Original Song (2014). Elsa, shy and
      timid, decides to free herself from society's expectations and sings as she builds an ice palace.
      Lines: "A kingdom of isolation / And it looks like I'm the queen"; "The wind is howling like this
      swirling storm inside" (simile); "Conceal, don't feel, don't let them know / Well, now they know";
      "Let it go ... Turn away and slam the door"; "The cold never bothered me anyway"; "It's funny how
      some distance / Makes everything seem small"; "No right, no wrong, no rules for me / I'm free";
      "I'll rise like the break of dawn"; "That perfect girl is gone". Bridge: the part between two
      similar parts that builds tension or adds variety. Theme: self-acceptance and freedom.
    explanations:
      text: "Elsa has spent her life hiding her powers to be 'the good girl'. Alone on the mountain, she stops pretending, accepts who she is and feels free."
      visual: "Draw two Elsas: on the left, hiding behind a door with the words 'Conceal, don't feel'; on the right, arms open in an ice palace under the dawn with 'That perfect girl is gone'."
      step_by_step: "'The wind is howling like this swirling storm inside.' Step 1: The comparison uses 'like'. Step 2: The storm outside is compared to her feelings inside. Step 3: It is a simile showing her inner turmoil."
      real_world: "Many young people feel pressure to be 'perfect' for others; songs like this encourage being true to yourself."
    activity:
      type: sort
      prompt: What does the line show about Elsa?
      bins:
      - Hiding her feelings
      - Breaking free
      items:
      - label: '''Conceal, don''t feel, don''t let them know'''
        bin: Hiding her feelings
        clue: What she was told to do before.
        why: Hiding.
      - label: '''Well, now they know'''
        bin: Breaking free
        clue: The secret is out.
        why: Breaking free.
      - label: '''Let it go... slam the door'''
        bin: Breaking free
        clue: Leaving the past.
        why: Breaking free.
      - label: '''That perfect girl is gone'''
        bin: Breaking free
        clue: No more pretending.
        why: Breaking free.
      - label: Being the 'good girl' she always had to be
        bin: Hiding her feelings
        clue: Before the song.
        why: Hiding.
    lesson:
      - teach: '''Let it Go'' is from Disney''s film ''Frozen'' (2013), written by Kristen Anderson-Lopez and Robert Lopez and sung by Idina Menzel; it won the Academy Award for Best Original Song in 2014. Elsa, who has hidden her powers, decides to free herself and builds an ice palace.'
        check:
          prompt: Who sings 'Let it Go'?
          options:
          - Idina Menzel
          - Michael Jackson
          - Robert Lopez
          answer: Idina Menzel
          why: Lopez co-wrote it; Menzel sang it.
      - teach: 'Once Elsa was told ''Conceal, don''t feel, don''t let them know''. Now ''they know'', so she lets it go: ''No right, no wrong, no rules for me, I''m free.'' ''That perfect girl is gone.'' ''The cold never bothered me anyway.'' The theme is self-acceptance and freedom.'
        picture:
          kind: compare
          columns:
          - title: Before
            points:
            - conceal, don't feel
            - the perfect girl
            - afraid
          - title: After
            points:
            - let it go
            - I'm free
            - the cold never bothered me
          alt: Elsa before and after.
        check:
          prompt: '''That perfect girl is gone'' means Elsa'
          options:
          - Stops pretending to be what others expect
          - Has died
          - Has left the kingdom for good
          answer: Stops pretending to be what others expect
          why: She drops the mask she wore.
      - teach: 'Devices: simile (''The wind is howling like this swirling storm inside''; ''I''ll rise like the break of dawn''), metaphor (''a kingdom of isolation''). A bridge in a song is the part between two similar parts that builds tension or adds variety.'
        check:
          prompt: '''like the break of dawn'' is a'
          options:
          - Simile
          - Metaphor
          - Bridge
          answer: Simile
          why: It compares using 'like'.
    items:
      - prompt: "From which film is the song 'Let it Go'?"
        options: ["Frozen", "Soul Surfer", "Neerja", "Tom and Jerry"]
        answer: "Frozen"
        difficulty: 1
        hints: ["Disney, 2013, Elsa."]
        solution: "'Frozen' (2013)."
        mistakes: {"Soul Surfer": let_it_go_message}
      - prompt: "Who sang 'Let it Go'?"
        options: ["Idina Menzel", "Kristen Anderson-Lopez", "Michael Jackson", "Robert Lopez"]
        answer: "Idina Menzel"
        difficulty: 1
        hints: ["The songwriters were a husband-and-wife duo; the singer was someone else."]
        solution: "Idina Menzel sang it; the Lopezes wrote it."
        mistakes: {"Kristen Anderson-Lopez": "singer_writer", "Robert Lopez": "singer_writer"}
      - prompt: "What does 'Conceal, don't feel, don't let them know' tell us about Elsa's past?"
        options: ["She had to hide her true self and feelings", "She was a famous singer", "She liked cold weather", "She lived with many friends"]
        answer: "She had to hide her true self and feelings"
        difficulty: 2
        hints: ["'Be the good girl you always have to be'."]
        solution: "She was taught to hide who she was."
        mistakes: {"She liked cold weather": let_it_go_message}
      - prompt: "'And I'll rise like the break of dawn' is an example of:"
        options: ["Simile", "Onomatopoeia", "Homophone", "Question tag"]
        answer: "Simile"
        difficulty: 2
        hints: ["Look for 'like'."]
        solution: "A comparison using 'like' is a simile."
        mistakes: {"Onomatopoeia": "simile_like", "Homophone": "simile_like"}
      - prompt: "What does 'That perfect girl is gone' mean?"
        options: ["Elsa no longer pretends to be what others expect", "Elsa has disappeared", "Elsa has lost her sister", "Elsa has become sad"]
        answer: "Elsa no longer pretends to be what others expect"
        difficulty: 3
        hints: ["The 'good girl' was a mask."]
        solution: "She drops the mask of the perfect girl and accepts herself."
        mistakes: {"Elsa has disappeared": let_it_go_message}
      - prompt: "In which year did 'Let it Go' win the Academy Award for Best Original Song?"
        answer: "2014"
        check: "2014"
        difficulty: 2
        hints: ["The film came out in 2013; the award came the next year."]
        solution: "2014."
        mistakes: {"2013": let_it_go_message}
      - prompt: "In 'Let it Go', what is Elsa finally letting go of?"
        options: ["Fear and the need to hide who she really is", "Her kingdom's gold", "Her sister's hand", "Her love of snow"]
        answer: "Fear and the need to hide who she really is"
        difficulty: 3
        hints: ["'Conceal, don't feel, don't let them know.'", "'That perfect girl is gone.'"]
        solution: "Step 1: She had hidden her powers and feelings to please others. Step 2: She lets go of that fear and accepts her true self."
        mistakes: {"Her kingdom's gold": free_self, "Her sister's hand": free_self, "Her love of snow": free_self}
      - prompt: "'The cold never bothered me anyway.' What does this line show about Elsa now?"
        options: ["She is confident and at ease with who she is", "She is about to freeze", "She hates winter", "She is sad and lonely"]
        answer: "She is confident and at ease with who she is"
        difficulty: 2
        hints: ["Elsa has ice powers.", "Is she complaining or comfortable?"]
        solution: "Step 1: The cold is part of her power. Step 2: Not being bothered by it shows she now accepts herself with confidence."
        mistakes: {"She is about to freeze": free_self, "She hates winter": free_self, "She is sad and lonely": free_self}
      - prompt: Who wrote the music and lyrics of 'Let it Go'?
        options:
        - Kristen Anderson-Lopez and Robert Lopez
        - Idina Menzel
        - Joseph Barbera
        - Michael Jackson
        answer: Kristen Anderson-Lopez and Robert Lopez
        difficulty: 2
        hints:
        - It was a husband-and-wife team.
        - The singer is a different person.
        solution: 'Step 1: Idina Menzel sang it. Step 2: The writers were a couple. Step 3: Kristen Anderson-Lopez and Robert Lopez.'
        mistakes:
          Idina Menzel: e5_song_facts
      - prompt: In which year was 'Frozen' released?
        options:
        - '2013'
        - '2014'
        - '1992'
        - '2006'
        answer: '2013'
        difficulty: 1
        hints:
        - The song won its award the year after.
        - The award came in 2014.
        solution: 'Step 1: Award in 2014. Step 2: The film came the year before. Step 3: 2013.'
        mistakes:
          '2014': e5_song_facts
      - prompt: '''A kingdom of isolation'' describes Elsa''s'
        options:
        - Loneliness
        - Wealth
        - Army
        - Family
        answer: Loneliness
        difficulty: 2
        hints:
        - Isolation means being cut off from others.
        - She is a queen with no one around.
        solution: 'Step 1: Isolation = being alone. Step 2: Her ''kingdom'' is empty. Step 3: Loneliness.'
        mistakes:
          Wealth: let_it_go_message
      - prompt: Which line shows Elsa is now confident?
        options:
        - The cold never bothered me anyway
        - Conceal, don't feel
        - Don't let them know
        - Be the good girl you always have to be
        answer: The cold never bothered me anyway
        difficulty: 2
        hints:
        - Three lines are old rules she was told.
        - Which line is her own new voice?
        solution: 'Step 1: Conceal/don''t let them know are old rules. Step 2: One line shows she doesn''t care what others think. Step 3: The cold never bothered me anyway.'
        mistakes:
          Conceal, don't feel: e5_elsa_change
      - prompt: '''The wind is howling like this swirling storm inside.'' What is the ''storm inside''?'
        options:
        - Elsa's strong feelings
        - A real storm in her room
        - A broken window
        - Thunder
        answer: Elsa's strong feelings
        difficulty: 3
        hints:
        - '''Inside'' means inside Elsa.'
        - What can swirl inside a person?
        solution: 'Step 1: The wind outside is compared to something inside. Step 2: Inside Elsa are emotions. Step 3: Her strong feelings.'
        mistakes:
          A real storm in her room: e5_like_as
      - prompt: '''It''s funny how some distance makes everything seem small.'' What does Elsa realise?'
        options:
        - Her old fears look small from far away
        - Mountains are tiny
        - She is getting smaller
        - She needs glasses
        answer: Her old fears look small from far away
        difficulty: 3
        hints:
        - She has moved away from her kingdom.
        - What used to seem huge to her?
        solution: 'Step 1: Distance from the kingdom. Step 2: Her old worries now look minor. Step 3: Her fears look small.'
        mistakes:
          Mountains are tiny: e5_elsa_change
      - prompt: Which phrase is a metaphor?
        options:
        - a kingdom of isolation
        - like the break of dawn
        - like this swirling storm
        - as cold as ice
        answer: a kingdom of isolation
        difficulty: 2
        hints:
        - A metaphor does not use 'like' or 'as'.
        - Three choices use a comparing word.
        solution: 'Step 1: ''like'' and ''as'' mark similes. Step 2: One phrase compares directly. Step 3: a kingdom of isolation.'
        mistakes:
          like the break of dawn: e5_like_as

  - code: eng9.u5.grammar
    title: "Grammar: would you mind, reported yes/no questions and linkers"
    after: [eng9.u5.toys_to_teens]
    notes: |
      Polite requests: "Would you mind / Do you mind" + -ing (Would you mind autographing the poster?).
      Asking permission: "Would you mind if I + past" (Would you mind if I sat here?), "Do you mind if I +
      present" (Do you mind if I open the window?). Reported yes/no questions: asked + if/whether +
      statement order + tense backshift ("Do you want to see?" → Barbera asked him if he wanted to see;
      "Have you really written all those series?" → He asked if I had really written all those series).
      Linkers: and, also, in addition to, along with (adding); but, nevertheless, even though, however
      (contrast); because, as (reason); therefore, so (result); in order to (purpose); during (time).
      Cyber etiquette: be polite online, protect passwords, beware of phishing (fake messages asking for
      personal details).
    explanations:
      text: "'Would you mind ...?' is a very polite way to ask. After 'mind' comes the -ing form. When you report a yes/no question, add 'if' or 'whether' and put the subject before the verb."
      visual: "Draw a road sign for each linker: ➕ and/in addition to, ↔ but/nevertheless, ❓→ because, ➡ therefore, 🎯 in order to."
      step_by_step: "Report: Jackson, 'Can you draw for me?' Step 1: yes/no question → asked if. Step 2: you → he, can → could. Step 3: Jackson asked if he could draw for him."
      real_world: "Banks warn customers: never share your OTP. A message asking for it is phishing — a lesson in cyber etiquette and safety."
    activity:
      type: sort
      prompt: '''Would you mind...?'' Which pattern?'
      bins:
      - mind + -ing (request)
      - mind if I + past (permission)
      items:
      - label: Asking him to sign the poster
        bin: mind + -ing (request)
        clue: You want him to do something.
        why: Would you mind autographing the poster?
      - label: Asking permission to sit
        bin: mind if I + past (permission)
        clue: You want to do something yourself.
        why: Would you mind if I sat here?
      - label: Asking someone to close the window
        bin: mind + -ing (request)
        clue: They do the action.
        why: 'Same pattern: Would you mind closing...?'
      - label: Asking if you may open the window
        bin: mind if I + past (permission)
        clue: You do the action.
        why: Would you mind if I opened...?
    lesson:
      - teach: 'Polite requests: ''Would you mind / Do you mind'' + -ing: ''Would you mind closing the door?'' Asking permission: ''Would you mind if I + past'' (if I sat here?) or ''Do you mind if I + present'' (if I open the window?).'
        picture:
          kind: compare
          columns:
          - title: Asking someone to do
            points:
            - Would you mind + -ing
            - Would you mind helping me?
          - title: Asking permission
            points:
            - Would you mind if I + past
            - Would you mind if I left early?
          alt: Two patterns with 'mind'.
        check:
          prompt: '''Would you mind ___ the window?'''
          options:
          - opening
          - open
          - to open
          answer: opening
          why: Mind is followed by the -ing form.
      - teach: Reported yes/no questions use asked + if/whether + statement order, with the tense moved back. "Are you tired?" she asked → She asked if I was tired. "Did you call?" → He asked whether I had called.
        check:
          prompt: 'Report: "Can you swim?" he asked me.'
          options:
          - He asked me if I could swim.
          - He asked me can I swim.
          - He asked if could I swim.
          answer: He asked me if I could swim.
          why: if + statement order + can → could.
      - teach: 'Linkers join ideas. Adding: and, also, in addition to. Contrast: but, however, even though. Reason: because, as. Result: so, therefore. Purpose: in order to. Online, be polite, guard passwords and beware of phishing: fake messages asking for personal details.'
        check:
          prompt: '''She was tired, ___ she finished the work.'''
          options:
          - but
          - because
          - so
          answer: but
          why: Tiredness and finishing contrast.
    items:
      - prompt: "Complete: 'Would you mind ___ the poster?'"
        options: ["autographing", "autograph", "to autograph", "autographed"]
        answer: "autographing"
        difficulty: 1
        hints: ["mind + -ing."]
        solution: "Would you mind autographing the poster?"
        mistakes: {"to autograph": mind_form}
      - prompt: "Complete: 'Would you mind if I ___ here?'"
        options: ["sat", "to sit", "sitting", "will sit"]
        answer: "sat"
        difficulty: 2
        hints: ["Would you mind if I + past."]
        solution: "Would you mind if I sat here?"
        mistakes: {"sitting": mind_form}
      - prompt: "Report: Barbera asked Jackson, \"Do you want to see?\""
        options: ["Barbera asked Jackson if he wanted to see.", "Barbera asked Jackson do you want to see.", "Barbera asked Jackson did he want to see.", "Barbera asked Jackson that he wants to see."]
        answer: "Barbera asked Jackson if he wanted to see."
        difficulty: 2
        hints: ["if + statement order + past."]
        solution: "if + he + wanted."
        mistakes: {"Barbera asked Jackson did he want to see.": yes_no_report}
      - prompt: "Report: Mom asked Grace, \"Have you seen this doll before?\""
        options: ["Mom asked Grace whether she had seen that doll before.", "Mom asked Grace have you seen this doll before.", "Mom asked Grace whether had she seen the doll.", "Mom asked if Grace has seen this doll before?"]
        answer: "Mom asked Grace whether she had seen that doll before."
        difficulty: 3
        hints: ["have seen → had seen; this → that."]
        solution: "whether + she + had seen + that."
        mistakes: {"Mom asked Grace whether had she seen the doll.": yes_no_report}
      - prompt: "Choose the linker: 'Grace's mom bought the doll ___ she felt it was too expensive.'"
        options: ["even though", "because", "therefore", "in order to"]
        answer: "even though"
        difficulty: 2
        hints: ["Contrast: she bought it despite the price."]
        solution: "'even though' shows contrast."
        mistakes: {"because": linker_choice, "therefore": linker_choice}
      - prompt: "Choose the linker: 'Marketers use jingles ___ catch children's attention.'"
        options: ["in order to", "nevertheless", "during", "even though"]
        answer: "in order to"
        difficulty: 1
        hints: ["Purpose."]
        solution: "'in order to' shows purpose."
        mistakes: {"nevertheless": linker_choice}
      - prompt: "A message says 'Your bank account is blocked. Send your OTP now.' What is this most likely to be?"
        options: ["A phishing attempt", "A real bank notice", "A birthday greeting", "An advertisement for toys"]
        answer: "A phishing attempt"
        difficulty: 2
        hints: ["Banks never ask for your OTP."]
        solution: "It is phishing: never share an OTP or password."

        mistakes: {"A real bank notice": "phishing", "An advertisement for toys": "phishing"}
      - prompt: "Complete the polite request: 'Would you mind ___ the music down?'"
        options: ["turning", "turn", "to turn", "turned"]
        answer: "turning"
        difficulty: 2
        hints: ["You are asking someone to do something.", "'Would you mind' + -ing."]
        solution: "Step 1: Asking someone else to act: Would you mind + -ing. Step 2: 'Would you mind turning the music down?'"
        mistakes: {"turn": mind_ing, "to turn": mind_ing, "turned": mind_form}
      - prompt: "Report: Jackson asked Barbera, \"Will you draw Tom for me?\""
        options: ["Jackson asked Barbera if he would draw Tom for him.", "Jackson asked Barbera will he draw Tom for me.", "Jackson asked Barbera that he would draw Tom.", "Jackson asked Barbera if will you draw Tom for him."]
        answer: "Jackson asked Barbera if he would draw Tom for him."
        difficulty: 3
        hints: ["A yes/no question is reported with if or whether.", "will → would; you → he; me → him."]
        solution: "Step 1: Use 'if' and statement order: he would draw. Step 2: Change pronouns: for me → for him."
        mistakes: {"Jackson asked Barbera will he draw Tom for me.": if_or_whether, "Jackson asked Barbera that he would draw Tom.": if_or_whether, "Jackson asked Barbera if will you draw Tom for him.": if_or_whether}
      - prompt: 'Complete: ''Do you mind if I ___ the fan?'''
        options:
        - switch on
        - switched on
        - switching on
        - to switch on
        answer: switch on
        difficulty: 2
        hints:
        - '''Do you mind if I'' takes a present form.'
        - '''Would you mind if I'' would take the past.'
        solution: 'Step 1: ''Do you mind if I'' → present. Step 2: Base verb. Step 3: switch on.'
        mistakes:
          switched on: e5_mind_if
          switching on: e5_mind_if
      - prompt: 'Complete: ''Would you mind ___ me your notes?'''
        options:
        - lending
        - lend
        - lent
        - to lend
        answer: lending
        difficulty: 1
        hints:
        - This asks someone else to do something.
        - Mind + -ing.
        solution: 'Step 1: Request for action. Step 2: mind + -ing. Step 3: lending.'
        mistakes:
          lend: e5_mind_ing
          to lend: e5_mind_ing
      - prompt: 'Report: She asked him, "Is the shop open?"'
        options:
        - She asked him if the shop was open.
        - She asked him is the shop open.
        - She asked him if was the shop open.
        - She asked him that the shop is open.
        answer: She asked him if the shop was open.
        difficulty: 2
        hints:
        - Use if or whether.
        - Statement order and tense back.
        solution: 'Step 1: if. Step 2: the shop was open (statement order, is → was). Step 3: She asked him if the shop was open.'
        mistakes:
          She asked him is the shop open.: e5_if_whether
          She asked him if was the shop open.: e5_if_whether
      - prompt: 'Choose the linker: ''Grace begged ___ she wanted the doll so much.'''
        options:
        - because
        - however
        - although
        - therefore
        answer: because
        difficulty: 1
        hints:
        - The second part gives the reason.
        - Which linker shows a reason?
        solution: 'Step 1: She begged. Step 2: The reason: she wanted it. Step 3: because.'
        mistakes:
          therefore: e5_linker_job
          however: e5_linker_job
      - prompt: 'Choose the linker: ''The ad was loud; ___, the children noticed it at once.'''
        options:
        - therefore
        - however
        - even though
        - in addition to
        answer: therefore
        difficulty: 2
        hints:
        - The second part is a result of the first.
        - Which linker shows a result?
        solution: 'Step 1: Loud ad → children noticed. Step 2: That is cause and result. Step 3: therefore.'
        mistakes:
          however: e5_linker_job
      - prompt: Which is the safest response to an email asking for your password to 'verify your account'?
        options:
        - Do not reply and report it
        - Send the password quickly
        - Forward it to friends
        - Reply with your OTP
        answer: Do not reply and report it
        difficulty: 2
        hints:
        - Real companies never ask for passwords by email.
        - This is a trick to steal details.
        solution: 'Step 1: Asking for passwords is a phishing sign. Step 2: Sharing it gives away your account. Step 3: Don''t reply; report it.'
        mistakes:
          Send the password quickly: phishing
  - code: eng9.u5.words
    title: "Words: media vocabulary"
    after: [eng9.u5.toys_to_teens]
    notes: |
      Glossary from the unit: allegiance (loyalty), avid (very keen), cave in (give in), chores (routine
      household tasks), conceal (hide), fads (short-lived crazes), nag factor (children's pestering
      that makes parents buy), persuasion (convincing someone), rife with (full of — usually something
      bad), self-esteem (confidence in one's own worth), sophisticated (advanced, complex), endorse
      (publicly support a product), jingle (a short catchy advertising tune), buff (an enthusiast:
      cartoon buff), courteous (polite), laid-back (relaxed).
    explanations:
      text: "Media lessons use special words: an 'avid cartoon buff' loves cartoons; parents 'cave in' to nagging; magazines 'rife with' ads are full of them."
      visual: "Make word cards with a picture on each: a shrinking person for 'cave in', a mask for 'conceal', a crowd in the same T-shirt for 'fad'."
      step_by_step: "'Teen magazines are rife with ads.' Step 1: rife with = full of. Step 2: so the magazines are full of ads."
      real_world: "Ad agencies in India write jingles for products you might hum without thinking."
    activity:
      type: sort
      prompt: Match the word to its meaning.
      bins:
      - Short-lived craze
      - Polite
      - Very keen
      - Give in
      items:
      - label: fad
        bin: Short-lived craze
        clue: '''Everybody has one'' — for now.'
        why: fad.
      - label: courteous
        bin: Polite
        clue: Jackson was this.
        why: courteous = polite.
      - label: avid
        bin: Very keen
        clue: An avid cartoon buff.
        why: avid = very keen.
      - label: cave in
        bin: Give in
        clue: Grace's mother did this.
        why: cave in = give in.
      - label: buff
        bin: Very keen
        clue: An enthusiast.
        why: A buff is very keen on something.
    lesson:
      - teach: 'Media words: jingle (short catchy ad tune), endorse (publicly support a product), persuasion (convincing someone), fads (short-lived crazes), nag factor (children pestering parents to buy), allegiance (loyalty), self-esteem (sense of one''s own worth).'
        check:
