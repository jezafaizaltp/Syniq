# Class 9 English (Kerala Reader), Unit V. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part II text supplied by the school.
# Also uses tips from earlier units: read_the_lines, glossary_word, reported_question (Unit IV).
subject: eng
chapter: 5
title: "Unit V: Media Matters"

tips:
  marketing_reasons: "Marketers target children for three reasons: children have their own money, they influence their parents' buying, and they are the adult consumers of tomorrow (cradle-to-grave loyalty)."
  nag_factor: "The 'nag factor' is children pestering parents until they buy an advertised product, as Grace did for the Monster High doll."
  barbera_jackson: "Joseph Barbera drew Tom and Jerry. In 1992 Michael Jackson, a cartoon buff, met him five times; Barbera sketched 'Bowling Alley Cat' and Jackson wrote 'To my hero of yesterday, today and tomorrow ... They were all I had.'"
  let_it_go_message: "In 'Let it Go' Elsa stops hiding her true self ('Conceal, don't feel') and chooses freedom: 'That perfect girl is gone.'"
  mind_form: "'Would you mind / Do you mind' is followed by the -ing form (Would you mind closing the door?). With 'if': Would you mind if I + past; Do you mind if I + present."
  yes_no_report: "A reported yes/no question uses 'if' or 'whether' and statement word order: 'Do you like cartoons?' → He asked if I liked cartoons."
  linker_choice: "Choose the linker by meaning: and (adds), but/nevertheless/even though (contrast), because (reason), therefore (result), in order to (purpose), during (time)."

concepts:
  - code: eng9.u5.toys_to_teens
    title: Toys to Teens
    notes: |
      Extract from 'Children, Adolescents, and the Media' by Victor C. Strasburger, Barbara J. Wilson and
      Amy B. Jordan. Eight-year-old Grace wants a Monster High doll (Draculaura) for Halloween; she heard
      of it from her friend Maddi and saw videos and a computer game. At the mall she shrieks "pleeeease";
      her mom reluctantly buys the $21.99 doll, caving in to the 'nag factor'. Billions are spent on
      advertising to children, about three times the amount 20 years ago. Three reasons: (1) children
      have a lot of their own money (chores, gifts from relatives); (2) they influence their parents'
      purchases (snacks, cereals, toothpaste, cars, holidays); (3) they are the adult consumers of
      tomorrow — brand loyalty starts early ("cradle-to-grave" marketing). Techniques: sound effects,
      bright colours, jingles, animated characters; ads louder than programmes; TV the easiest route,
      now online and handheld devices too. Concerns: preoccupation with appearance, thin models hurt
      self-esteem and body image; brand-consciousness and fads: "You see it a lot", "Everybody has one".
      Ads suggest a product brings fun and happiness. Celebrities endorse products.
    explanations:
      text: "Advertisers target children because children spend money, persuade parents and grow into lifelong customers. Jingles, colours, cartoon characters and celebrities make ads hard to resist, and images of 'perfect' models can hurt how teenagers feel about their bodies."
      visual: "Draw a child at the centre with three arrows: 'own pocket money', 'influences parents', 'future adult customer'. Around them, draw the hooks: jingle notes, bright colours, cartoon mascot, celebrity face."
      step_by_step: "Why did Grace's mom buy the doll? Step 1: Grace saw it at Maddi's and online. Step 2: At the mall she begged. Step 3: Mom gave in to the nag factor."
      real_world: "Think of a cartoon mascot on a biscuit packet or a cricket star selling a drink: these are the same techniques the lesson describes."
    items:
      - prompt: "What did Grace want for Halloween?"
        options: ["A Monster High doll", "A Barbie house", "A bicycle", "A computer game"]
        answer: "A Monster High doll"
        difficulty: 1
        hints: ["The one named Draculaura."]
        solution: "She wanted a Monster High doll, Draculaura."
      - prompt: "From whom did Grace first hear about the Monster High dolls?"
        options: ["Her friend Maddi", "Her teacher", "Her mother", "A TV news reader"]
        answer: "Her friend Maddi"
        difficulty: 1
        hints: ["They watched videos at her house."]
        solution: "'Maddi told me about them.'"
        mistakes: {"Her mother": read_the_lines}
      - prompt: "What is the 'nag factor'?"
        options: ["Children pestering parents until they buy something", "A horse race", "A discount at a shop", "A kind of television programme"]
        answer: "Children pestering parents until they buy something"
        difficulty: 2
        hints: ["Grace's 'pleeeease'."]
        solution: "Nagging children push parents to buy advertised products."
        mistakes: {"A discount at a shop": nag_factor}
      - prompt: "Which is NOT one of the three reasons marketers target children?"
        options: ["Children never watch television", "Children have their own money", "Children influence their parents' purchases", "Children are the adult consumers of tomorrow"]
        answer: "Children never watch television"
        difficulty: 2
        hints: ["TV is the easiest way to reach them."]
        solution: "The three reasons are their money, their influence and their future as adult buyers."
        mistakes: {"Children are the adult consumers of tomorrow": marketing_reasons}
      - prompt: "What does 'cradle-to-grave' marketing aim to do?"
        options: ["Build brand loyalty from early childhood for the whole of life", "Sell cradles and coffins", "Advertise only to old people", "Stop all advertising"]
        answer: "Build brand loyalty from early childhood for the whole of life"
        difficulty: 2
        hints: ["Cradle = baby; grave = end of life."]
        solution: "It wins loyalty young and keeps it for life."
        mistakes: {"Sell cradles and coffins": marketing_reasons}
      - prompt: "Why can ads with thin, 'attractive' models be harmful to adolescents?"
        options: ["They can hurt self-esteem and body image", "They make teens study harder", "They improve health", "They are too quiet"]
        answer: "They can hurt self-esteem and body image"
        difficulty: 2
        hints: ["Teens compare themselves with the models."]
        solution: "Comparing oneself with models can lower self-esteem."
      - prompt: "When asked why they bought something, most children answered 'You see it a lot' or 'Everybody has one'. What does this show?"
        options: ["Advertising and peer pressure drive their wants", "They need the products for school", "They compared prices carefully", "Their parents forced them"]
        answer: "Advertising and peer pressure drive their wants"
        difficulty: 3
        hints: ["Seeing it often = ads; everybody has one = friends."]
        solution: "Repetition in ads and fitting in with peers create the desire."

  - code: eng9.u5.ink_and_melody
    title: The Ink and the Melody
    after: [eng9.u5.toys_to_teens]
    notes: |
      Memoir extract by Joseph Barbera (1911–2006), co-founder of Hanna-Barbera, creator of Tom and Jerry
      (seven Oscars, eight Emmys). As creative consultant on the Tom and Jerry movie, Barbera had a series
      of five meetings in 1992 with Michael Jackson, "an avid cartoon buff", who wanted to work on a
      project with him. Barbera hoped Jackson would sing a song in the Tom and Jerry feature. Jackson
      asked if he had really written all those Tom and Jerry series: "No, I drew them." Barbera sketched
      'Bowling Alley Cat' on a pad as Jackson whispered "Wow!", stopped at the fifth sketch and
      autographed them. Jackson autographed a poster of himself and his niece Nicole: "To my hero of
      yesterday, today and tomorrow, with many thanks for all the many cartoon friends you gave me as a
      child. They were all I had." Barbera found him laid-back and courteous. The executives of Great
      American Communications had no interest in a deal, so nothing came of the meetings.
    explanations:
      text: "Two great artists meet: the man whose pen drew Tom and Jerry and the King of Pop. Jackson's autograph shows that the cartoons were his only friends as a lonely child, so Barbera was his hero."
      visual: "Draw a sketch pad with Tom and Jerry in a bowling alley, a musical note beside it, and the autograph on a poster: 'To my hero of yesterday, today and tomorrow'."
      step_by_step: "Why the title 'The Ink and the Melody'? Step 1: Ink = Barbera's drawings. Step 2: Melody = Jackson's music. Step 3: The lesson is the meeting of the two."
      real_world: "Tom and Jerry cartoons are still shown on Indian TV channels decades after they were first drawn."
    items:
      - prompt: "Who is the author of 'The Ink and the Melody'?"
        options: ["Joseph Barbera", "Michael Jackson", "Victor C. Strasburger", "Idina Menzel"]
        answer: "Joseph Barbera"
        difficulty: 1
        hints: ["The man who drew Tom and Jerry."]
        solution: "Joseph Barbera wrote it about meeting Michael Jackson."
        mistakes: {"Michael Jackson": barbera_jackson}
      - prompt: "How many meetings did Barbera have with Michael Jackson?"
        answer: "5"
        check: "5"
        difficulty: 1
        hints: ["'a series of ... meetings'."]
        solution: "Five meetings, in 1992."
        mistakes: {"1": barbera_jackson}
      - prompt: "When Jackson asked if he had written all the Tom and Jerry series, what did Barbera reply?"
        options: ["\"No, I drew them.\"", "\"Yes, every one.\"", "\"My partner wrote them.\"", "\"I don't remember.\""]
        answer: "\"No, I drew them.\""
        difficulty: 2
        hints: ["He was an artist."]
        solution: "He said he drew them, not wrote them."
        mistakes: {"\"Yes, every one.\"": barbera_jackson}
      - prompt: "Which cartoon did Barbera sketch for Jackson?"
        options: ["Bowling Alley Cat", "Mickey Mouse", "The Lion King", "Scooby-Doo"]
        answer: "Bowling Alley Cat"
        difficulty: 2
        hints: ["One of his Tom and Jerry favourites."]
        solution: "'Bowling Alley Cat'."
      - prompt: "What did Jackson mean by 'They were all I had' in his autograph?"
        options: ["As a child, the cartoon characters were his only friends", "He owned only cartoon posters", "He had no money", "He only had Tom and Jerry DVDs"]
        answer: "As a child, the cartoon characters were his only friends"
        difficulty: 3
        hints: ["'the many cartoon friends you gave me as a child'."]
        solution: "The cartoons were his companions in a lonely childhood."
        mistakes: {"He had no money": read_the_lines}
      - prompt: "Why did nothing come of the meetings?"
        options: ["The executives of Great American Communications had no interest in a deal", "Jackson refused to sing", "Barbera fell ill", "The movie was cancelled by Jackson"]
        answer: "The executives of Great American Communications had no interest in a deal"
        difficulty: 2
        hints: ["The company executives decided."]
        solution: "The company executives were not interested."
      - prompt: "How did Barbera describe Michael Jackson?"
        options: ["Laid-back and courteous", "Rude and proud", "Loud and angry", "Shy and silent all the time"]
        answer: "Laid-back and courteous"
        difficulty: 1
        hints: ["Better than most people in the industry."]
        solution: "'a laid-back and courteous gentleman'."

  - code: eng9.u5.let_it_go
    title: Let it Go (Song)
    after: [eng9.u5.ink_and_melody]
    notes: |
      Song from Disney's animated film 'Frozen' (2013), music and lyrics by Kristen Anderson-Lopez and
      Robert Lopez, sung by Idina Menzel; Academy Award for Best Original Song (2014). Elsa, shy and
      timid, decides to free herself from society's expectations and sings as she builds an ice palace.
      Lines: "A kingdom of isolation / And it looks like I'm the queen"; "The wind is howling like this
      swirling storm inside" (simile); "Conceal, don't feel, don't let them know / Well, now they know";
      "Let it go ... Turn away and slam the door"; "The cold never bothered me anyway"; "It's funny how
      some distance / Makes everything seem small"; "No right, no wrong, no rules for me / I'm free";
      "I'll rise like the break of dawn"; "That perfect girl is gone". Bridge: the part between two
      similar parts that builds tension or adds variety. Theme: self-acceptance and freedom.
    explanations:
      text: "Elsa has spent her life hiding her powers to be 'the good girl'. Alone on the mountain, she stops pretending, accepts who she is and feels free."
      visual: "Draw two Elsas: on the left, hiding behind a door with the words 'Conceal, don't feel'; on the right, arms open in an ice palace under the dawn with 'That perfect girl is gone'."
      step_by_step: "'The wind is howling like this swirling storm inside.' Step 1: The comparison uses 'like'. Step 2: The storm outside is compared to her feelings inside. Step 3: It is a simile showing her inner turmoil."
      real_world: "Many young people feel pressure to be 'perfect' for others; songs like this encourage being true to yourself."
    items:
      - prompt: "From which film is the song 'Let it Go'?"
        options: ["Frozen", "Soul Surfer", "Neerja", "Tom and Jerry"]
        answer: "Frozen"
        difficulty: 1
        hints: ["Disney, 2013, Elsa."]
        solution: "'Frozen' (2013)."
        mistakes: {"Soul Surfer": let_it_go_message}
      - prompt: "Who sang 'Let it Go'?"
        options: ["Idina Menzel", "Kristen Anderson-Lopez", "Michael Jackson", "Robert Lopez"]
        answer: "Idina Menzel"
        difficulty: 1
        hints: ["The songwriters were a husband-and-wife duo; the singer was someone else."]
        solution: "Idina Menzel sang it; the Lopezes wrote it."
      - prompt: "What does 'Conceal, don't feel, don't let them know' tell us about Elsa's past?"
        options: ["She had to hide her true self and feelings", "She was a famous singer", "She liked cold weather", "She lived with many friends"]
        answer: "She had to hide her true self and feelings"
        difficulty: 2
        hints: ["'Be the good girl you always have to be'."]
        solution: "She was taught to hide who she was."
        mistakes: {"She liked cold weather": let_it_go_message}
      - prompt: "'And I'll rise like the break of dawn' is an example of:"
        options: ["Simile", "Onomatopoeia", "Homophone", "Question tag"]
        answer: "Simile"
        difficulty: 2
        hints: ["Look for 'like'."]
        solution: "A comparison using 'like' is a simile."
      - prompt: "What does 'That perfect girl is gone' mean?"
        options: ["Elsa no longer pretends to be what others expect", "Elsa has disappeared", "Elsa has lost her sister", "Elsa has become sad"]
        answer: "Elsa no longer pretends to be what others expect"
        difficulty: 3
        hints: ["The 'good girl' was a mask."]
        solution: "She drops the mask of the perfect girl and accepts herself."
        mistakes: {"Elsa has disappeared": let_it_go_message}
      - prompt: "In which year did 'Let it Go' win the Academy Award for Best Original Song?"
        answer: "2014"
        check: "2014"
        difficulty: 2
        hints: ["The film came out in 2013; the award came the next year."]
        solution: "2014."
        mistakes: {"2013": let_it_go_message}

  - code: eng9.u5.grammar
    title: "Grammar: would you mind, reported yes/no questions and linkers"
    after: [eng9.u5.toys_to_teens]
    notes: |
      Polite requests: "Would you mind / Do you mind" + -ing (Would you mind autographing the poster?).
      Asking permission: "Would you mind if I + past" (Would you mind if I sat here?), "Do you mind if I +
      present" (Do you mind if I open the window?). Reported yes/no questions: asked + if/whether +
      statement order + tense backshift ("Do you want to see?" → Barbera asked him if he wanted to see;
      "Have you really written all those series?" → He asked if I had really written all those series).
      Linkers: and, also, in addition to, along with (adding); but, nevertheless, even though, however
      (contrast); because, as (reason); therefore, so (result); in order to (purpose); during (time).
      Cyber etiquette: be polite online, protect passwords, beware of phishing (fake messages asking for
      personal details).
    explanations:
      text: "'Would you mind ...?' is a very polite way to ask. After 'mind' comes the -ing form. When you report a yes/no question, add 'if' or 'whether' and put the subject before the verb."
      visual: "Draw a road sign for each linker: ➕ and/in addition to, ↔ but/nevertheless, ❓→ because, ➡ therefore, 🎯 in order to."
      step_by_step: "Report: Jackson, 'Can you draw for me?' Step 1: yes/no question → asked if. Step 2: you → he, can → could. Step 3: Jackson asked if he could draw for him."
      real_world: "Banks warn customers: never share your OTP. A message asking for it is phishing — a lesson in cyber etiquette and safety."
    items:
      - prompt: "Complete: 'Would you mind ___ the poster?'"
        options: ["autographing", "autograph", "to autograph", "autographed"]
        answer: "autographing"
        difficulty: 1
        hints: ["mind + -ing."]
        solution: "Would you mind autographing the poster?"
        mistakes: {"to autograph": mind_form}
      - prompt: "Complete: 'Would you mind if I ___ here?'"
        options: ["sat", "sit", "sitting", "will sit"]
        answer: "sat"
        difficulty: 2
        hints: ["Would you mind if I + past."]
        solution: "Would you mind if I sat here?"
        mistakes: {"sitting": mind_form}
      - prompt: "Report: Barbera asked Jackson, \"Do you want to see?\""
        options: ["Barbera asked Jackson if he wanted to see.", "Barbera asked Jackson do you want to see.", "Barbera asked Jackson did he want to see.", "Barbera asked Jackson that he wants to see."]
        answer: "Barbera asked Jackson if he wanted to see."
        difficulty: 2
        hints: ["if + statement order + past."]
        solution: "if + he + wanted."
        mistakes: {"Barbera asked Jackson did he want to see.": yes_no_report}
      - prompt: "Report: Mom asked Grace, \"Have you seen this doll before?\""
        options: ["Mom asked Grace whether she had seen that doll before.", "Mom asked Grace have you seen this doll before.", "Mom asked Grace whether had she seen the doll.", "Mom asked if Grace has seen this doll before?"]
        answer: "Mom asked Grace whether she had seen that doll before."
        difficulty: 3
        hints: ["have seen → had seen; this → that."]
        solution: "whether + she + had seen + that."
        mistakes: {"Mom asked Grace whether had she seen the doll.": yes_no_report}
      - prompt: "Choose the linker: 'Grace's mom bought the doll ___ she felt it was too expensive.'"
        options: ["even though", "because", "therefore", "in order to"]
        answer: "even though"
        difficulty: 2
        hints: ["Contrast: she bought it despite the price."]
        solution: "'even though' shows contrast."
        mistakes: {"because": linker_choice, "therefore": linker_choice}
      - prompt: "Choose the linker: 'Marketers use jingles ___ catch children's attention.'"
        options: ["in order to", "nevertheless", "during", "even though"]
        answer: "in order to"
        difficulty: 1
        hints: ["Purpose."]
        solution: "'in order to' shows purpose."
        mistakes: {"nevertheless": linker_choice}
      - prompt: "A message says 'Your bank account is blocked. Send your OTP now.' What is this most likely to be?"
        options: ["A phishing attempt", "A real bank notice", "A birthday greeting", "An advertisement for toys"]
        answer: "A phishing attempt"
        difficulty: 2
        hints: ["Banks never ask for your OTP."]
        solution: "It is phishing: never share an OTP or password."

  - code: eng9.u5.words
    title: "Words: media vocabulary"
    after: [eng9.u5.toys_to_teens]
    notes: |
      Glossary from the unit: allegiance (loyalty), avid (very keen), cave in (give in), chores (routine
      household tasks), conceal (hide), fads (short-lived crazes), nag factor (children's pestering
      that makes parents buy), persuasion (convincing someone), rife with (full of — usually something
      bad), self-esteem (confidence in one's own worth), sophisticated (advanced, complex), endorse
      (publicly support a product), jingle (a short catchy advertising tune), buff (an enthusiast:
      cartoon buff), courteous (polite), laid-back (relaxed).
    explanations:
      text: "Media lessons use special words: an 'avid cartoon buff' loves cartoons; parents 'cave in' to nagging; magazines 'rife with' ads are full of them."
      visual: "Make word cards with a picture on each: a shrinking person for 'cave in', a mask for 'conceal', a crowd in the same T-shirt for 'fad'."
      step_by_step: "'Teen magazines are rife with ads.' Step 1: rife with = full of. Step 2: so the magazines are full of ads."
      real_world: "Ad agencies in India write jingles for products you might hum without thinking."
    items:
      - prompt: "'Michael Jackson, an avid cartoon buff' — 'avid' means:"
        options: ["Very keen", "Very angry", "Very tired", "Very young"]
        answer: "Very keen"
        difficulty: 1
        hints: ["He loved cartoons."]
        solution: "Avid = very enthusiastic."
        mistakes: {"Very angry": glossary_word}
      - prompt: "'She caved in to the nag factor.' 'Caved in' means:"
        options: ["Gave in", "Went into a cave", "Fought back", "Ran away"]
        answer: "Gave in"
        difficulty: 1
        hints: ["She finally bought the doll."]
        solution: "Cave in = give in, yield."
        mistakes: {"Went into a cave": glossary_word}
      - prompt: "Which word means 'short-lived crazes or fashions'?"
        options: ["fads", "chores", "allegiance", "persuasion"]
        answer: "fads"
        difficulty: 2
        hints: ["Popular today, forgotten tomorrow."]
        solution: "Fads are passing crazes."
        mistakes: {"chores": glossary_word}
      - prompt: "'Conceal, don't feel.' The opposite of 'conceal' is:"
        options: ["reveal", "hide", "cover", "feel"]
        answer: "reveal"
        difficulty: 2
        hints: ["Conceal = hide."]
        solution: "The opposite of hide is reveal."
        mistakes: {"hide": glossary_word}
      - prompt: "Celebrities who publicly support a product in ads are said to ___ it."
        options: ["endorse", "conceal", "nag", "cave in"]
        answer: "endorse"
        difficulty: 2
        hints: ["Endorsement."]
        solution: "To endorse = to publicly support."
      - prompt: "'Companies cultivate consumer allegiance.' 'Allegiance' means:"
        options: ["Loyalty", "Anger", "Allergy", "Advertisement"]
        answer: "Loyalty"
        difficulty: 3
        hints: ["Cradle-to-grave brand love."]
        solution: "Allegiance = loyalty."
        mistakes: {"Allergy": glossary_word}
