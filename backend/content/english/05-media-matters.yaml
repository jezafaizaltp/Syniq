# Class 9 English (Kerala Reader), Unit V. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part II text supplied by the school.
# Also uses tips from earlier units: read_the_lines, glossary_word, reported_question (Unit IV).
subject: eng
chapter: 5
title: "Unit V: Media Matters"

tips:
  why_target_kids: "Marketers see children as buyers now, as people who influence what parents buy, and as future customers for life. Which choice fits that?"
  see_through_ads: "Ask who made the advert and what they want from you. What should a smart viewer do before wanting the product?"
  childhood_friends: "Jackson had a hard, lonely childhood as a child star. What could cartoons have meant to him?"
  mutual_respect: "Barbera admired Jackson and Jackson admired Barbera's cartoons. How did the meetings feel?"
  free_self: "Elsa had hidden her powers all her life. What does 'letting go' free her from?"
  mind_ing: "'Would you mind' is followed by a verb ending in -ing when you ask someone to do something."
  if_or_whether: "A yes/no question is reported with if or whether, statement word order and a tense shift back."
  opposite_words: "Find a word that means the reverse, not a word that sounds similar."
  marketing_reasons: "Marketers target children for three reasons: children have their own money, they influence their parents' buying, and they are the adult consumers of tomorrow (cradle-to-grave loyalty)."
  nag_factor: "The 'nag factor' is children pestering parents until they buy an advertised product, as Grace did for the Monster High doll."
  barbera_jackson: "The author drew Tom and Jerry. Count the meetings in the text. When asked if he had written them all, he corrected the verb: he didn't write them, he ___ them."
  let_it_go_message: "In 'Let it Go' Elsa stops hiding her true self ('Conceal, don't feel') and chooses freedom: 'That perfect girl is gone.'"
  mind_form: "'Would you mind / Do you mind' is followed by the -ing form (Would you mind closing the door?). With 'if': Would you mind if I + past; Do you mind if I + present."
  yes_no_report: "A reported yes/no question uses 'if' or 'whether' and statement word order: 'Do you like cartoons?' → He asked if I liked cartoons."
  linker_choice: "Pick the linker by meaning: does the second part add, contrast (she bought it despite something), give a reason, a result, or a purpose (to do something)?"
  ads_peer_pressure: "'You see it a lot' points to advertising and 'Everybody has one' to peer pressure."
  ads_self_esteem: "Comparing themselves with thin models can make teenagers feel bad about their own bodies."
  barbera_on_jackson: "Barbera liked Jackson and found him relaxed and polite. Which choice says that?"
  bowling_cat: "Barbera sketched a Tom and Jerry cartoon for Jackson, about a cat at a game with pins and balls."
  endorse: "Celebrities appear in ads to say they support a product. The word you need means to back publicly; 'conceal' means hide and 'nag' means pester."
  executives_no_deal: "Jackson was keen; it was the company executives who weren't interested in a deal."
  grace_doll: "Grace's mother wanted to buy a Barbie, but Grace insisted on a different, spooky doll brand. Re-read the opening part of the story."
  phishing: "A real bank never asks for your OTP. A message demanding it urgently is phishing."
  simile_like: "The line compares rising to dawn using the word 'like'. Is it a sound word or a sound-alike word, or a comparison? Comparisons with 'like' or 'as' have their own name."
  singer_writer: "Two people wrote the song; a different person, the voice of Elsa, sang it."
  e5_grace_story: 'Go back to Grace''s story: what she wanted, who told her, where she shrieked, and what her mother finally did.'
  e5_three_reasons: 'Marketers give three reasons: children have their own money, they sway what parents buy, and they will be tomorrow''s adult buyers.'
  e5_ad_tricks: Ads for children use sound effects, bright colours, jingles and cartoon characters, and they are louder than the programme.
  e5_barbera_facts: 'Check the notes: who Barbera was, what he made famous, and the year of the meetings.'
  e5_jackson_words: Read Jackson's autograph again. What did the cartoon friends mean to him as a lonely child?
  e5_meeting_end: The two men got on well. The problem came from a company above them.
  e5_song_facts: 'Check the facts about the song: the film, the singer, the songwriters and the award year.'
  e5_elsa_change: Before, Elsa hid; now she is free. Does this line look back at the old Elsa or show the new one?
  e5_like_as: A simile uses 'like' or 'as' to compare two different things.
  e5_mind_ing: After 'Would you mind' or 'Do you mind', use the -ing form of the verb.
  e5_mind_if: '''Would you mind if I...'' takes a past form; ''Do you mind if I...'' takes a present form.'
  e5_if_whether: Report a yes/no question with asked + if/whether, statement order, and the tense moved one step back.
  e5_linker_job: 'Ask what the linker must do: add, contrast, give a reason, show a result, or show a purpose.'
  e5_word_meaning: Put each choice into the sentence. Which one keeps the meaning?

concepts:
  - code: eng9.u5.toys_to_teens
    title: Toys to Teens
    notes: |
      Extract from 'Children, Adolescents, and the Media' by Victor C. Strasburger, Barbara J. Wilson and
      Amy B. Jordan. Eight-year-old Grace wants a Monster High doll (Draculaura) for Halloween; she heard
      of it from her friend Maddi and saw videos and a computer game. At the mall she shrieks "pleeeease";
      her mom reluctantly buys the $21.99 doll, caving in to the 'nag factor'. Billions are spent on
      advertising to children, about three times the amount 20 years ago. Three reasons: (1) children
      have a lot of their own money (chores, gifts from relatives); (2) they influence their parents'
      purchases (snacks, cereals, toothpaste, cars, holidays); (3) they are the adult consumers of
      tomorrow — brand loyalty starts early ("cradle-to-grave" marketing). Techniques: sound effects,
      bright colours, jingles, animated characters; ads louder than programmes; TV the easiest route,
      now online and handheld devices too. Concerns: preoccupation with appearance, thin models hurt
      self-esteem and body image; brand-consciousness and fads: "You see it a lot", "Everybody has one".
      Ads suggest a product brings fun and happiness. Celebrities endorse products.
    explanations:
      text: "Advertisers target children because children spend money, persuade parents and grow into lifelong customers. Jingles, colours, cartoon characters and celebrities make ads hard to resist, and images of 'perfect' models can hurt how teenagers feel about their bodies."
      visual: "Draw a child at the centre with three arrows: 'own pocket money', 'influences parents', 'future adult customer'. Around them, draw the hooks: jingle notes, bright colours, cartoon mascot, celebrity face."
      step_by_step: "Why did Grace's mom buy the doll? Step 1: Grace saw it at Maddi's and online. Step 2: At the mall she begged. Step 3: Mom gave in to the nag factor."
      real_world: "Think of a cartoon mascot on a biscuit packet or a cricket star selling a drink: these are the same techniques the lesson describes."
    activity:
      type: sort
      prompt: Why do advertisers target children?
      bins:
      - Children's own money
      - Influence on parents
      - Tomorrow's adult buyers
      - Not a reason given
      items:
      - label: Pocket money from chores and relatives
        bin: Children's own money
        clue: They can spend it.
        why: Reason 1.
      - label: Grace's 'pleeeease' gets the doll
        bin: Influence on parents
        clue: The nag factor.
        why: Reason 2.
      - label: Kids pick the family's cereal and holidays
        bin: Influence on parents
        clue: Parents' purchases.
        why: Reason 2.
      - label: Brand loyalty from the cradle to the grave
        bin: Tomorrow's adult buyers
        clue: Start young, keep them.
        why: Reason 3.
      - label: Children need to learn maths from ads
        bin: Not a reason given
        clue: Is this in the text?
        why: The writers give only three reasons.
    lesson:
      - teach: '''Toys to Teens'' is from ''Children, Adolescents, and the Media''. Eight-year-old Grace wants a Monster High doll after hearing of it from her friend Maddi and seeing videos and a game. At the mall she begs ''pleeeease'' until her mother gives in and buys the $21.99 doll: the ''nag factor''.'
        check:
          prompt: What is the 'nag factor'?
          options:
          - Children pestering parents into buying
          - A doll's price tag
          - A TV channel
          answer: Children pestering parents into buying
          why: Grace's begging made her mother give in.
      - teach: 'Advertisers spend billions on children, about three times what they spent 20 years ago, for three reasons: children have their own money; they influence what parents buy; and they are tomorrow''s adult customers (''cradle-to-grave'' brand loyalty).'
        picture:
          kind: compare
          columns:
          - title: Money now
            points:
            - pocket money, gifts, chores
          - title: Influence
            points:
            - snacks, cereals, even cars
          - title: Future buyers
            points:
            - brand loyalty from the cradle
          alt: Three reasons ads target children.
        check:
          prompt: '''Cradle-to-grave'' marketing aims to'
          options:
          - Win loyal customers for life
          - Sell cradles
          - Stop advertising
          answer: Win loyal customers for life
          why: Loyalty that starts in childhood can last a lifetime.
      - teach: Ads use jingles, bright colours, sound effects and cartoon characters, and are louder than programmes. They suggest products bring fun and happiness; celebrities endorse them. Thin models can harm teenagers' self-esteem. Children often say they want things because 'Everybody has one'. Smart viewers ask who made an ad and why.
        check:
          prompt: A smart way to treat an ad is to
          options:
          - Ask who made it and why
          - Believe every word
          - Buy whatever it shows
          answer: Ask who made it and why
          why: Ads are made to sell, not to inform.
    items:
      - prompt: "What did Grace want for Halloween?"
        options: ["A Monster High doll", "A Barbie house", "A bicycle", "A computer game"]
        answer: "A Monster High doll"
        difficulty: 1
        hints: ["The one named Draculaura."]
        solution: "She wanted a Monster High doll, Draculaura."
        mistakes: {"A Barbie house": "grace_doll", "A computer game": "grace_doll"}
      - prompt: "From whom did Grace first hear about the Monster High dolls?"
        options: ["Her friend Maddi", "Her teacher", "Her mother", "A TV news reader"]
        answer: "Her friend Maddi"
        difficulty: 1
        hints: ["They watched videos at her house."]
        solution: "'Maddi told me about them.'"
        mistakes: {"Her mother": read_the_lines}
      - prompt: "What is the 'nag factor'?"
        options: ["Children pestering parents until they buy something", "A horse race", "A discount at a shop", "A kind of television programme"]
        answer: "Children pestering parents until they buy something"
        difficulty: 2
        hints: ["Grace's 'pleeeease'."]
        solution: "Nagging children push parents to buy advertised products."
        mistakes: {"A discount at a shop": nag_factor}
      - prompt: "Which is NOT one of the three reasons marketers target children?"
        options: ["Children never watch television", "Children have their own money", "Children influence their parents' purchases", "Children are the adult consumers of tomorrow"]
        answer: "Children never watch television"
        difficulty: 2
        hints: ["TV is the easiest way to reach them."]
        solution: "The three reasons are their money, their influence and their future as adult buyers."
        mistakes: {"Children are the adult consumers of tomorrow": marketing_reasons}
      - prompt: "What does 'cradle-to-grave' marketing aim to do?"
        options: ["Build brand loyalty from early childhood for the whole of life", "Sell cradles and coffins", "Advertise only to old people", "Stop all advertising"]
        answer: "Build brand loyalty from early childhood for the whole of life"
        difficulty: 2
        hints: ["Cradle = baby; grave = end of life."]
        solution: "It wins loyalty young and keeps it for life."
        mistakes: {"Sell cradles and coffins": marketing_reasons}
      - prompt: "Why can ads with thin, 'attractive' models be harmful to adolescents?"
        options: ["They can hurt self-esteem and body image", "They make teens study harder", "They improve health", "They are too quiet"]
        answer: "They can hurt self-esteem and body image"
        difficulty: 2
        hints: ["Teens compare themselves with the models."]
        solution: "Comparing oneself with models can lower self-esteem."
        mistakes: {"They make teens study harder": "ads_self_esteem", "They improve health": "ads_self_esteem"}
      - prompt: "When asked why they bought something, most children answered 'You see it a lot' or 'Everybody has one'. What does this show?"
        options: ["Advertising and peer pressure drive their wants", "They need the products for school", "They compared prices carefully", "Their parents forced them"]
        answer: "Advertising and peer pressure drive their wants"
        difficulty: 3
        hints: ["Seeing it often = ads; everybody has one = friends."]
        solution: "Repetition in ads and fitting in with peers create the desire."

        mistakes: {"They compared prices carefully": "ads_peer_pressure", "They need the products for school": "ads_peer_pressure"}
      - prompt: "Why do marketers want to reach children even before they can buy things themselves?"
        options: ["Children influence what parents buy and can become loyal customers for life", "Children never watch adverts", "Children have more money than adults", "The law requires adverts for children"]
        answer: "Children influence what parents buy and can become loyal customers for life"
        difficulty: 3
        hints: ["What is the nag factor?", "What is cradle-to-grave marketing?"]
        solution: "Step 1: Children push parents to buy (the nag factor). Step 2: Brands they love early may stay their brands for life."
        mistakes: {"Children never watch adverts": why_target_kids, "Children have more money than adults": why_target_kids, "The law requires adverts for children": why_target_kids}
      - prompt: "Which is the most sensible way for a teenager to deal with advertising?"
        options: ["Ask who made the ad and why, and check whether the product is really needed", "Buy whatever is shown most often", "Believe that celebrities use every product they advertise", "Buy things because everybody else has them"]
        answer: "Ask who made the ad and why, and check whether the product is really needed"
        difficulty: 2
        hints: ["What is the purpose of an advert?", "Which choice shows thinking for yourself?"]
        solution: "Step 1: Ads are made to persuade. Step 2: Questioning the message and your real need helps you resist ads and peer pressure."
        mistakes: {"Buy whatever is shown most often": see_through_ads, "Believe that celebrities use every product they advertise": endorse, "Buy things because everybody else has them": ads_peer_pressure}
      - prompt: How old was Grace?
        options:
        - Eight
        - Thirteen
        - Five
        - Fifteen
        answer: Eight
        difficulty: 1
        hints:
        - She is a young child, not a teenager.
        - Read the first line of her story.
        solution: 'Step 1: Grace is a child. Step 2: The extract gives her age at the start. Step 3: Eight.'
        mistakes:
          Thirteen: e5_grace_story
      - prompt: Where did Grace beg for the doll?
        options:
        - At the mall
        - At school
        - At Maddi's house
        - On a bus
        answer: At the mall
        difficulty: 1
        hints:
        - She saw the doll in a shop.
        - It was a big shopping place.
        solution: 'Step 1: Grace saw the doll for sale. Step 2: She was shopping with her mother. Step 3: At the mall.'
        mistakes:
          At school: e5_grace_story
      - prompt: Advertising to children now costs about three times what it did 20 years ago. If it was 5 units then, about how much is it now?
        answer: '15'
        check: 5*3
        difficulty: 2
        hints:
        - Three times means multiply by 3.
        - 5 × 3.
        solution: 'Step 1: Old amount 5. Step 2: Three times as much. Step 3: 15 units.'
        mistakes:
          '8': e5_three_reasons
      - prompt: Why are TV ads for children often louder than the programmes?
        options:
        - To grab children's attention
        - Because TVs are broken
        - To help children sleep
        - Because the law says so
        answer: To grab children's attention
        difficulty: 2
        hints:
        - Think about what ads want from viewers.
        - Loud sounds make us look up.
        solution: 'Step 1: Ads must be noticed. Step 2: A louder sound catches attention. Step 3: To grab children''s attention.'
        mistakes:
          To help children sleep: e5_ad_tricks
      - prompt: Which is an example of children influencing their parents' purchases?
        options:
        - A child choosing which breakfast cereal the family buys
        - A parent paying the electricity bill
        - A grandparent buying medicine
        - A shop raising its prices
        answer: A child choosing which breakfast cereal the family buys
        difficulty: 2
        hints:
        - Who decides, and who pays?
        - The child chooses, the parent pays.
        solution: 'Step 1: Influence means affecting a choice. Step 2: The child picks; the parent buys. Step 3: Choosing the family''s cereal.'
        mistakes:
          A shop raising its prices: e5_three_reasons
      - prompt: An ad shows a happy family with a fizzy drink, as if the drink brings happiness. What is the ad really doing?
        options:
        - Linking the product with feelings to make you want it
        - Giving health facts
        - Teaching cooking
        - Warning about sugar
        answer: Linking the product with feelings to make you want it
        difficulty: 3
        hints:
        - Does a drink really make a family happy?
        - Ads sell a feeling along with the product.
        solution: 'Step 1: The drink cannot create happiness. Step 2: The ad pairs it with joy. Step 3: It uses feelings to persuade.'
        mistakes:
          Giving health facts: see_through_ads
  - code: eng9.u5.ink_and_melody
    title: The Ink and the Melody
    after: [eng9.u5.toys_to_teens]
    notes: |
      Memoir extract by Joseph Barbera (1911–2006), co-founder of Hanna-Barbera, creator of Tom and Jerry
      (seven Oscars, eight Emmys). As creative consultant on the Tom and Jerry movie, Barbera had a series
      of five meetings in 1992 with Michael Jackson, "an avid cartoon buff", who wanted to work on a
      project with him. Barbera hoped Jackson would sing a song in the Tom and Jerry feature. Jackson
      asked if he had really written all those Tom and Jerry series: "No, I drew them." Barbera sketched
      'Bowling Alley Cat' on a pad as Jackson whispered "Wow!", stopped at the fifth sketch and
      autographed them. Jackson autographed a poster of himself and his niece Nicole: "To my hero of
      yesterday, today and tomorrow, with many thanks for all the many cartoon friends you gave me as a
      child. They were all I had." Barbera found him laid-back and courteous. The executives of Great
      American Communications had no interest in a deal, so nothing came of the meetings.
    explanations:
      text: "Two great artists meet: the man whose pen drew Tom and Jerry and the King of Pop. Jackson's autograph shows that the cartoons were his only friends as a lonely child, so Barbera was his hero."
      visual: "Draw a sketch pad with Tom and Jerry in a bowling alley, a musical note beside it, and the autograph on a poster: 'To my hero of yesterday, today and tomorrow'."
      step_by_step: "Why the title 'The Ink and the Melody'? Step 1: Ink = Barbera's drawings. Step 2: Melody = Jackson's music. Step 3: The lesson is the meeting of the two."
      real_world: "Tom and Jerry cartoons are still shown on Indian TV channels decades after they were first drawn."
    activity:
      type: sort
      prompt: True or false about 'The Ink and the Melody'?
      bins:
      - 'True'
      - 'False'
      items:
      - label: Michael Jackson was an avid cartoon buff.
        bin: 'True'
        clue: What did he love?
        why: True.
      - label: Barbera said, 'No, I drew them.'
        bin: 'True'
        clue: Jackson asked if he'd written them.
        why: True.
      - label: Jackson sang a song in the Tom and Jerry film.
        bin: 'False'
        clue: Did the deal happen?
        why: The executives weren't interested; nothing came of it.
      - label: Barbera sketched 'Bowling Alley Cat'.
        bin: 'True'
        clue: On a pad.
        why: True.
      - label: They met only once.
        bin: 'False'
        clue: How many meetings in 1992?
        why: Five meetings.
      - label: 'Jackson signed a poster: ''To my hero...'''
        bin: 'True'
        clue: With his niece Nicole.
        why: True.
    lesson:
      - teach: '''The Ink and the Melody'' is from the memoir of Joseph Barbera (1911–2006), co-founder of Hanna-Barbera and co-creator of Tom and Jerry, which won seven Oscars. In 1992 he had five meetings with Michael Jackson, ''an avid cartoon buff''.'
        check:
          prompt: Which cartoon is Barbera famous for?
          options:
          - Tom and Jerry
          - Frozen
          - Monster High
          answer: Tom and Jerry
          why: He co-created Tom and Jerry.
      - teach: 'Jackson asked if Barbera had written all the Tom and Jerry series. ''No, I drew them,'' he replied. Barbera sketched ''Bowling Alley Cat'' as Jackson whispered ''Wow!''. Jackson signed a poster: ''To my hero of yesterday, today and tomorrow... They were all I had.'''
        picture:
          kind: flow
          steps:
          - Jackson admires cartoons
          - Barbera draws 'Bowling Alley Cat'
          - Barbera autographs sketches
          - Jackson signs a poster for his hero
          alt: A meeting of two artists.
        check:
          prompt: '''They were all I had'' suggests Jackson''s childhood was'
          options:
          - Lonely
          - Crowded with friends
          - Boring because of cartoons
          answer: Lonely
          why: Cartoon characters were his only companions.
      - teach: Barbera hoped Jackson would sing in the Tom and Jerry film. He found Jackson laid-back and courteous. But the executives of Great American Communications had no interest in a deal, so nothing came of it.
        check:
          prompt: Why did the project fail?
          options:
          - Company executives showed no interest
          - Jackson refused
          - Barbera fell ill
          answer: Company executives showed no interest
          why: The deal was blocked above both men.
    items:
      - prompt: "Who is the author of 'The Ink and the Melody'?"
        options: ["Joseph Barbera", "Michael Jackson", "Victor C. Strasburger", "Idina Menzel"]
        answer: "Joseph Barbera"
        difficulty: 1
        hints: ["The man who drew Tom and Jerry."]
        solution: "Joseph Barbera wrote it about meeting Michael Jackson."
        mistakes: {"Michael Jackson": barbera_jackson}
      - prompt: "How many meetings did Barbera have with Michael Jackson?"
        answer: "5"
        check: "5"
        difficulty: 1
        hints: ["'a series of ... meetings'."]
        solution: "Five meetings, in 1992."
        mistakes: {"1": barbera_jackson}
      - prompt: "When Jackson asked if he had written all the Tom and Jerry series, what did Barbera reply?"
        options: ["\"No, I drew them.\"", "\"Yes, every one.\"", "\"My partner wrote them.\"", "\"I don't remember.\""]
        answer: "\"No, I drew them.\""
        difficulty: 2
        hints: ["He was an artist."]
        solution: "He said he drew them, not wrote them."
        mistakes: {"\"Yes, every one.\"": barbera_jackson}
      - prompt: "Which cartoon did Barbera sketch for Jackson?"
        options: ["Bowling Alley Cat", "Mickey Mouse", "The Lion King", "Scooby-Doo"]
        answer: "Bowling Alley Cat"
        difficulty: 2
        hints: ["One of his Tom and Jerry favourites."]
        solution: "'Bowling Alley Cat'."
        mistakes: {"Mickey Mouse": "bowling_cat", "Scooby-Doo": "bowling_cat"}
      - prompt: "What did Jackson mean by 'They were all I had' in his autograph?"
        options: ["As a child, the cartoon characters were his only friends", "He owned only cartoon posters", "He had no money", "He only had Tom and Jerry DVDs"]
        answer: "As a child, the cartoon characters were his only friends"
        difficulty: 3
        hints: ["'the many cartoon friends you gave me as a child'."]
        solution: "The cartoons were his companions in a lonely childhood."
        mistakes: {"He had no money": read_the_lines}
      - prompt: "Why did nothing come of the meetings?"
        options: ["The executives of Great American Communications had no interest in a deal", "Jackson refused to sing", "Barbera fell ill", "The movie was cancelled by Jackson"]
        answer: "The executives of Great American Communications had no interest in a deal"
        difficulty: 2
        hints: ["The company executives decided."]
        solution: "The company executives were not interested."
        mistakes: {"Jackson refused to sing": "executives_no_deal", "Barbera fell ill": "executives_no_deal"}
      - prompt: "How did Barbera describe Michael Jackson?"
        options: ["Laid-back and courteous", "Rude and proud", "Loud and angry", "Shy and silent all the time"]
        answer: "Laid-back and courteous"
        difficulty: 1
        hints: ["Better than most people in the industry."]
        solution: "'a laid-back and courteous gentleman'."

        mistakes: {"Rude and proud": "barbera_on_jackson", "Shy and silent all the time": "barbera_on_jackson"}
      - prompt: "Jackson wrote in his autograph that the cartoon characters 'were all I had'. What does this suggest about his childhood?"
        options: ["He was lonely, and cartoons were his companions", "He owned all the cartoon films", "He drew the cartoons himself", "He had too many friends"]
        answer: "He was lonely, and cartoons were his companions"
        difficulty: 3
        hints: ["Jackson was a child star with little normal childhood.", "Who were 'they'?"]
        solution: "Step 1: 'They' are the cartoon characters. Step 2: Saying they were all he had shows they were his friends in a lonely childhood."
        mistakes: {"He owned all the cartoon films": childhood_friends, "He drew the cartoons himself": childhood_friends, "He had too many friends": childhood_friends}
      - prompt: "Which word best describes the meetings between Barbera and Jackson?"
        options: ["Warm and respectful", "Angry and tense", "Short and businesslike", "Boring and cold"]
        answer: "Warm and respectful"
        difficulty: 2
        hints: ["How did Barbera describe Jackson?", "Jackson was an avid cartoon fan."]
        solution: "Step 1: Barbera found Jackson laid-back and courteous. Step 2: Jackson admired Barbera's work, so the meetings were warm and respectful."
        mistakes: {"Angry and tense": mutual_respect, "Short and businesslike": mutual_respect, "Boring and cold": mutual_respect}
      - prompt: In which year did Barbera meet Michael Jackson?
        options:
        - '1992'
        - '2013'
        - '1911'
        - '2006'
        answer: '1992'
        difficulty: 2
        hints:
        - 1911 and 2006 are Barbera's birth and death years.
        - It was when the Tom and Jerry movie was being made.
        solution: 'Step 1: 1911–2006 are Barbera''s life dates. Step 2: 2013 is Frozen''s year. Step 3: 1992.'
        mistakes:
          '1911': e5_barbera_facts
          '2006': e5_barbera_facts
      - prompt: What did Barbera hope Jackson would do?
        options:
        - Sing a song in the Tom and Jerry feature
        - Draw cartoons
        - Buy his company
        - Direct a film
        answer: Sing a song in the Tom and Jerry feature
        difficulty: 2
        hints:
        - Jackson was a famous singer.
        - The title says 'melody'.
        solution: 'Step 1: Barbera = ink (drawing). Step 2: Jackson = melody (music). Step 3: He hoped Jackson would sing in the film.'
        mistakes:
          Draw cartoons: e5_barbera_facts
      - prompt: What did Jackson whisper as Barbera sketched?
        options:
        - '"Wow!"'
        - '"Stop!"'
        - '"Faster!"'
        - '"Goodbye!"'
        answer: '"Wow!"'
        difficulty: 1
        hints:
        - He was amazed.
        - It is a one-word expression of wonder.
        solution: 'Step 1: Jackson admired the drawings. Step 2: He showed wonder. Step 3: "Wow!"'
        mistakes:
          '"Stop!"': bowling_cat
      - prompt: Who appears with Jackson in the poster he autographed?
