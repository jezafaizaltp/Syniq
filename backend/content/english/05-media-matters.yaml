  - code: eng9.u5.grammar
    title: "Grammar: would you mind, reported yes/no questions and linkers"
    after: [eng9.u5.toys_to_teens]
    notes: |
      Polite requests: "Would you mind / Do you mind" + -ing (Would you mind autographing the poster?).
      Asking permission: "Would you mind if I + past" (Would you mind if I sat here?), "Do you mind if I +
      present" (Do you mind if I open the window?). Reported yes/no questions: asked + if/whether +
      statement order + tense backshift ("Do you want to see?" → Barbera asked him if he wanted to see;
      "Have you really written all those series?" → He asked if I had really written all those series).
      Linkers: and, also, in addition to, along with (adding); but, nevertheless, even though, however
      (contrast); because, as (reason); therefore, so (result); in order to (purpose); during (time).
      Cyber etiquette: be polite online, protect passwords, beware of phishing (fake messages asking for
      personal details).
    explanations:
      text: "'Would you mind ...?' is a very polite way to ask. After 'mind' comes the -ing form. When you report a yes/no question, add 'if' or 'whether' and put the subject before the verb."
      visual: "Draw a road sign for each linker: ➕ and/in addition to, ↔ but/nevertheless, ❓→ because, ➡ therefore, 🎯 in order to."
      step_by_step: "Report: Jackson, 'Can you draw for me?' Step 1: yes/no question → asked if. Step 2: you → he, can → could. Step 3: Jackson asked if he could draw for him."
      real_world: "Banks warn customers: never share your OTP. A message asking for it is phishing — a lesson in cyber etiquette and safety."
    activity:
      type: sort
      prompt: '''Would you mind...?'' Which pattern?'
      bins:
      - mind + -ing (request)
      - mind if I + past (permission)
      items:
      - label: Asking him to sign the poster
        bin: mind + -ing (request)
        clue: You want him to do something.
        why: Would you mind autographing the poster?
      - label: Asking permission to sit
        bin: mind if I + past (permission)
        clue: You want to do something yourself.
        why: Would you mind if I sat here?
      - label: Asking someone to close the window
        bin: mind + -ing (request)
        clue: They do the action.
        why: 'Same pattern: Would you mind closing...?'
      - label: Asking if you may open the window
        bin: mind if I + past (permission)
        clue: You do the action.
        why: Would you mind if I opened...?
    lesson:
      - teach: 'Polite requests: ''Would you mind / Do you mind'' + -ing: ''Would you mind closing the door?'' Asking permission: ''Would you mind if I + past'' (if I sat here?) or ''Do you mind if I + present'' (if I open the window?).'
        picture:
          kind: compare
          columns:
          - title: Asking someone to do
            points:
            - Would you mind + -ing
            - Would you mind helping me?
          - title: Asking permission
            points:
            - Would you mind if I + past
            - Would you mind if I left early?
          alt: Two patterns with 'mind'.
        check:
          prompt: '''Would you mind ___ the window?'''
          options:
          - opening
          - open
          - to open
          answer: opening
          why: Mind is followed by the -ing form.
        ways:
        - style: step_by_step
          teach: 'Choose the pattern in two steps. Step 1: are you asking someone to do something? Use ''Would you mind / Do you mind'' + -ing: ''Would you mind closing the door?'' Step 2: are you asking permission for yourself? Use ''Would you mind if I + past'' (''if I sat here?'') or ''Do you mind if I + present'' (''if I open the window?'').'
        - style: visual
          teach: 'Two ''would you mind'' patterns: asking someone to act, or asking permission.'
          picture:
            kind: compare
            columns:
            - title: Ask someone to do it
              points:
              - Would you mind + -ing
              - Would you mind closing the door?
            - title: Ask permission
              points:
              - Would you mind if I + past
              - Would you mind if I sat here?
            alt: Would you mind closing the door asks someone to act; would you mind if I sat here asks permission.
      - teach: Reported yes/no questions use asked + if/whether + statement order, with the tense moved back. "Are you tired?" she asked → She asked if I was tired. "Did you call?" → He asked whether I had called.
        check:
          prompt: 'Report: "Can you swim?" he asked me.'
          options:
          - He asked me if I could swim.
          - He asked me can I swim.
          - He asked if could I swim.
          answer: He asked me if I could swim.
          why: if + statement order + can → could.
        ways:
        - style: real_world
          teach: 'Your mum phones and asks what the doctor asked you. The doctor said, ''Are you tired?'' You report: ''She asked if I was tired.'' He said, ''Did you call?'' You report: ''He asked whether I had called.'' For yes/no questions, add if or whether, use statement order, and move the tense back.'
        - style: visual
          teach: 'Reporting a yes/no question: add if or whether, then statement order and shift back.'
          picture:
            kind: flow
            steps:
            - '"Are you tired?" the doctor asked'
            - add 'if'
            - 'statement order: I am'
            - 'shift back: I was'
            - The doctor asked if I was tired.
            alt: 'Are you tired becomes the doctor asked if I was tired: add if, use statement order, shift am back to was.'
      - teach: 'Linkers join ideas. Adding: and, also, in addition to. Contrast: but, however, even though. Reason: because, as. Result: so, therefore. Purpose: in order to. Online, be polite, guard passwords and beware of phishing: fake messages asking for personal details.'
        check:
          prompt: '''She was tired, ___ she finished the work.'''
          options:
          - but
          - because
          - so
          answer: but
          why: Tiredness and finishing contrast.
        ways:
        - style: step_by_step
          teach: 'Choose a linker by asking what the second idea does. Adds more? and, also, in addition to. Goes against the first? but, however, even though. Gives a reason? because, as. Gives a result? so, therefore. Gives a purpose? in order to. Online too: be polite, guard passwords, and beware of phishing, fake messages that ask for personal details.'
        - style: visual
          teach: Linkers sorted by the job the second idea does.
          picture:
            kind: compare
            columns:
            - title: Add / Contrast
              points:
              - and, also
              - but, however, even though
            - title: Reason / Result
              points:
              - because, as
              - so, therefore
            - title: Purpose
              points:
              - in order to
            alt: Adding linkers are and, also; contrast but, however; reason because, as; result so, therefore; purpose in order to.
    items:
      - prompt: "Complete: 'Would you mind ___ the poster?'"
        options: ["autographing", "autograph", "to autograph", "autographed"]
        answer: "autographing"
        difficulty: 1
        hints: ["mind + -ing.", "autograph + -ing."]
        solution: "Would you mind autographing the poster?"
        mistakes: {"to autograph": mind_form}
      - prompt: "Complete: 'Would you mind if I ___ here?'"
        options: ["sat", "to sit", "sitting", "will sit"]
        answer: "sat"
        difficulty: 2
        hints: ["Would you mind if I + past.", "Past simple of 'sit'."]
        solution: "Would you mind if I sat here?"
        mistakes: {"sitting": mind_form}
      - prompt: "Report: Barbera asked Jackson, \"Do you want to see?\""
        options: ["Barbera asked Jackson if he wanted to see.", "Barbera asked Jackson do you want to see.", "Barbera asked Jackson did he want to see.", "Barbera asked Jackson that he wants to see."]
        answer: "Barbera asked Jackson if he wanted to see."
        difficulty: 2
        hints: ["if + statement order + past.", "if + he + wanted."]
        solution: "if + he + wanted."
        mistakes: {"Barbera asked Jackson did he want to see.": yes_no_report}
      - prompt: "Report: Mom asked Grace, \"Have you seen this doll before?\""
        options: ["Mom asked Grace whether she had seen that doll before.", "Mom asked Grace have you seen this doll before.", "Mom asked Grace whether had she seen the doll.", "Mom asked if Grace has seen this doll before?"]
        answer: "Mom asked Grace whether she had seen that doll before."
        difficulty: 3
        hints: ["have seen → had seen; this → that.", "whether + she + had seen + that doll."]
        solution: "whether + she + had seen + that."
        mistakes: {"Mom asked Grace whether had she seen the doll.": yes_no_report}
      - prompt: "Choose the linker: 'Grace's mom bought the doll ___ she felt it was too expensive.'"
        options: ["even though", "because", "therefore", "in order to"]
        answer: "even though"
        difficulty: 2
        hints: ["Contrast: she bought it despite the price.", "Two words: 'even' + another."]
        solution: "Buying the doll despite thinking it was too expensive is a contrast, and 'even though' shows contrast."
        mistakes: {"because": linker_choice, "therefore": linker_choice}
      - prompt: "Choose the linker: 'Marketers use jingles ___ catch children's attention.'"
        options: ["in order to", "nevertheless", "during", "even though"]
        answer: "in order to"
        difficulty: 1
        hints: ["Purpose.", "Purpose: in order + to."]
        solution: "'in order to' shows purpose."
        mistakes: {"nevertheless": linker_choice}
      - prompt: "A message says 'Your bank account is blocked. Send your OTP now.' What is this most likely to be?"
        options: ["A phishing attempt", "A real bank notice", "A birthday greeting", "An advertisement for toys"]
        answer: "A phishing attempt"
        difficulty: 2
        hints: ["Banks never ask for your OTP.", "A trick to fish for your details."]
        solution: "It is phishing: never share an OTP or password."

        mistakes: {"A real bank notice": "phishing", "An advertisement for toys": "phishing"}
      - prompt: "Complete the polite request: 'Would you mind ___ the music down?'"
        options: ["turning", "turn", "to turn", "turned"]
        answer: "turning"
        difficulty: 2
        hints: ["You are asking someone to do something.", "'Would you mind' + -ing."]
        solution: "Step 1: Asking someone else to act: Would you mind + -ing. Step 2: 'Would you mind turning the music down?'"
        mistakes: {"turn": mind_ing, "to turn": mind_ing, "turned": mind_form}
      - prompt: "Report: Jackson asked Barbera, \"Will you draw Tom for me?\""
        options: ["Jackson asked Barbera if he would draw Tom for him.", "Jackson asked Barbera will he draw Tom for me.", "Jackson asked Barbera that he would draw Tom.", "Jackson asked Barbera if will you draw Tom for him."]
        answer: "Jackson asked Barbera if he would draw Tom for him."
        difficulty: 3
        hints: ["A yes/no question is reported with if or whether.", "will → would; you → he; me → him."]
        solution: "Step 1: Use 'if' and statement order: he would draw. Step 2: Change pronouns: for me → for him."
        mistakes: {"Jackson asked Barbera will he draw Tom for me.": if_or_whether, "Jackson asked Barbera that he would draw Tom.": if_or_whether, "Jackson asked Barbera if will you draw Tom for him.": if_or_whether}
      - prompt: 'Complete: ''Do you mind if I ___ the fan?'''
        options:
        - switch on
        - switched on
        - switching on
        - to switch on
        answer: switch on
        difficulty: 2
        hints:
        - '''Do you mind if I'' takes a present form.'
        - '''Would you mind if I'' would take the past.'
        solution: 'Step 1: ''Do you mind if I'' → present. Step 2: Base verb. Step 3: switch on.'
        mistakes:
          switched on: e5_mind_if
          switching on: e5_mind_if
      - prompt: 'Complete: ''Would you mind ___ me your notes?'''
        options:
        - lending
        - lend
        - lent
        - to lend
        answer: lending
        difficulty: 1
        hints:
        - This asks someone else to do something.
        - Mind + -ing.
        solution: 'Step 1: Request for action. Step 2: mind + -ing. Step 3: lending.'
        mistakes:
          lend: e5_mind_ing
          to lend: e5_mind_ing
      - prompt: 'Report: She asked him, "Is the shop open?"'
        options:
        - She asked him if the shop was open.
        - She asked him is the shop open.
        - She asked him if was the shop open.
        - She asked him that the shop is open.
        answer: She asked him if the shop was open.
        difficulty: 2
        hints:
        - Use if or whether.
        - Statement order and tense back.
        solution: 'Step 1: if. Step 2: the shop was open (statement order, is → was). Step 3: She asked him if the shop was open.'
        mistakes:
          She asked him is the shop open.: e5_if_whether
          She asked him if was the shop open.: e5_if_whether
      - prompt: 'Choose the linker: ''Grace begged ___ she wanted the doll so much.'''
        options:
        - because
        - however
        - although
        - therefore
        answer: because
        difficulty: 1
        hints:
        - The second part gives the reason.
        - Which linker shows a reason?
        solution: 'Step 1: She begged. Step 2: The reason: she wanted it. Step 3: because.'
        mistakes:
          therefore: e5_linker_job
          however: e5_linker_job
      - prompt: 'Choose the linker: ''The ad was loud; ___, the children noticed it at once.'''
        options:
        - therefore
        - however
        - even though
        - in addition to
        answer: therefore
        difficulty: 2
        hints:
        - The second part is a result of the first.
        - Which linker shows a result?
        solution: 'Step 1: Loud ad → children noticed. Step 2: That is cause and result. Step 3: therefore.'
        mistakes:
          however: e5_linker_job
      - prompt: Which is the safest response to an email asking for your password to 'verify your account'?
        options:
        - Do not reply and report it
        - Send the password quickly
        - Forward it to friends
        - Reply with your OTP
        answer: Do not reply and report it
        difficulty: 2
        hints:
        - Real companies never ask for passwords by email.
        - This is a trick to steal details.
        solution: 'Step 1: Asking for passwords is a phishing sign. Step 2: Sharing it gives away your account. Step 3: Don''t reply; report it.'
        mistakes:
          Send the password quickly: phishing
      - prompt: 'Situation: An SMS from an unknown number asks for your school login. Complete: Never share your password, ___ the message looks real.'
        options:
        - even though
        - because
        - so
        answer: even though
        hints:
        - The two ideas pull against each other.
        - Which linker shows contrast?
        solution: 'The message may look real, but you still should not share: that is contrast, so ''even though''. Such fake messages are phishing.'
        mistakes:
          because: pqk9e5_purpose_linker
          so: pqk9e5_purpose_linker
        exam: case
        difficulty: 2
  - code: eng9.u5.words
    title: "Words: media vocabulary"
    after: [eng9.u5.toys_to_teens]
    notes: |
      Glossary from the unit: allegiance (loyalty), avid (very keen), cave in (give in), chores (routine
      household tasks), conceal (hide), fads (short-lived crazes), nag factor (children's pestering
      that makes parents buy), persuasion (convincing someone), rife with (full of — usually something
      bad), self-esteem (confidence in one's own worth), sophisticated (advanced, complex), endorse
      (publicly support a product), jingle (a short catchy advertising tune), buff (an enthusiast:
      cartoon buff), courteous (polite), laid-back (relaxed).
    explanations:
      text: "Media lessons use special words: an 'avid cartoon buff' loves cartoons; parents 'cave in' to nagging; magazines 'rife with' ads are full of them."
      visual: "Make word cards with a picture on each: a shrinking person for 'cave in', a mask for 'conceal', a crowd in the same T-shirt for 'fad'."
      step_by_step: "'Teen magazines are rife with ads.' Step 1: rife with = full of. Step 2: so the magazines are full of ads."
      real_world: "Ad agencies in India write jingles for products you might hum without thinking."
    activity:
      type: sort
      prompt: Match the word to its meaning.
      bins:
      - Short-lived craze
      - Polite
      - Very keen
      - Give in
      items:
      - label: fad
        bin: Short-lived craze
        clue: '''Everybody has one'' — for now.'
        why: fad.
      - label: courteous
        bin: Polite
        clue: Jackson was this.
        why: courteous = polite.
      - label: avid
        bin: Very keen
        clue: An avid cartoon buff.
        why: avid = very keen.
      - label: cave in
        bin: Give in
        clue: Grace's mother did this.
        why: cave in = give in.
      - label: buff
        bin: Very keen
        clue: An enthusiast.
        why: A buff is very keen on something.
    lesson:
      - teach: 'Media words: jingle (short catchy ad tune), endorse (publicly support a product), persuasion (convincing someone), fads (short-lived crazes), nag factor (children pestering parents to buy), allegiance (loyalty), self-esteem (sense of one''s own worth).'
        check:
          prompt: A short catchy tune in an ad is a
          options:
          - Jingle
          - Fad
          - Chore
          answer: Jingle
          why: Jingles help people remember the product.
        ways:
        - style: real_world
          teach: Spot the words in a TV ad for a fizzy drink. The catchy tune is a jingle. The cricket star who praises it endorses it. The whole ad is persuasion. Fidget spinners and similar fads are short-lived crazes. Kids begging for it is the nag factor. Sticking with one brand is allegiance. Ads with thin models can hurt self-esteem, your sense of your own worth.
        - style: visual
          teach: Media words from the lesson matched to their meanings, as you would use them about ads.
          picture:
            kind: compare
            columns:
            - title: Word
              points:
              - jingle
              - endorse
              - fads
              - allegiance
              - self-esteem
            - title: Meaning
              points:
              - short catchy ad tune
              - publicly support
              - short-lived crazes
              - loyalty
              - sense of your own worth
            alt: Jingle is a catchy ad tune, endorse is publicly support, fads are short-lived crazes, allegiance is loyalty, self-esteem is your sense of worth.
      - teach: 'More words: avid (very keen), buff (enthusiast, as in a cartoon buff), cave in (give in), conceal (hide; opposite reveal), courteous (polite), laid-back (relaxed), chores (household tasks), rife with (full of, usually something bad), sophisticated (advanced, complex).'
        check:
          prompt: The opposite of 'conceal' is
          options:
          - Reveal
          - Hide
          - Freeze
          answer: Reveal
          why: Conceal = hide; reveal = show.
        ways:
        - style: real_world
          teach: Describe a person with the new words. An avid reader is very keen; a cricket buff is an enthusiast. If you cave in, you give in. To conceal is to hide; the opposite is reveal. A courteous person is polite; a laid-back one is relaxed. Chores are household tasks. A place rife with litter is full of it. A sophisticated phone is advanced and complex.
        - style: visual
          teach: Lesson words in pairs of opposites and near-meanings.
          picture:
            kind: compare
            columns:
            - title: Word
              points:
              - conceal
              - courteous
              - laid-back
              - cave in
              - avid
            - title: Means / opposite
              points:
              - 'hide (opposite: reveal)'
              - polite
              - relaxed
              - give in
              - very keen
            alt: Conceal means hide, opposite reveal; courteous means polite; laid-back means relaxed; cave in means give in; avid means very keen.
    items:
      - prompt: "'Michael Jackson, an avid cartoon buff' — 'avid' means:"
        options: ["Very keen", "Very angry", "Very tired", "Very young"]
        answer: "Very keen"
        difficulty: 1
        hints: ["He loved cartoons.", "Eager and enthusiastic."]
        solution: "'Avid' means very keen or enthusiastic: Jackson loved cartoons."
        mistakes: {"Very angry": glossary_word}
      - prompt: "'She caved in to the nag factor.' 'Caved in' means:"
        options: ["Gave in", "Went into a cave", "Fought back", "Ran away"]
        answer: "Gave in"
        difficulty: 1
        hints: ["She finally bought the doll.", "She stopped resisting."]
        solution: "Cave in = give in, yield."
        mistakes: {"Went into a cave": glossary_word}
      - prompt: "Which word means 'short-lived crazes or fashions'?"
        options: ["fads", "chores", "allegiance", "persuasion"]
        answer: "fads"
        difficulty: 2
        hints: ["Popular today, forgotten tomorrow.", "A short word that begins with f."]
        solution: "Fads are crazes that are popular for a short time and then fade."
        mistakes: {"chores": glossary_word}
      - prompt: "'Conceal, don't feel.' The opposite of 'conceal' is:"
        options: ["reveal", "hide", "cover", "feel"]
        answer: "reveal"
        difficulty: 2
        hints: ["Conceal = hide.", "To show what was hidden."]
        solution: "The opposite of hide is reveal."
        mistakes: {"hide": glossary_word}
      - prompt: "Celebrities who publicly support a product in ads are said to ___ it."
        options: ["endorse", "conceal", "nag", "cave in"]
        answer: "endorse"
        difficulty: 2
        hints: ["Endorsement.", "Drop '-ment' from 'endorsement'."]
        solution: "To endorse = to publicly support."
        mistakes: {"conceal": "endorse", "nag": "endorse"}
      - prompt: "'Companies cultivate consumer allegiance.' 'Allegiance' means:"
        options: ["Loyalty", "Anger", "Allergy", "Advertisement"]
        answer: "Loyalty"
        difficulty: 3
        hints: ["Cradle-to-grave brand love.", "Faithfulness to a brand."]
        solution: "'Allegiance' means loyalty: companies want customers to keep buying their brand."
        mistakes: {"Allergy": glossary_word}
      - prompt: "Which word is the opposite of 'avid'?"
        options: ["uninterested", "eager", "keen", "enthusiastic"]
        answer: "uninterested"
        difficulty: 2
        hints: ["'Avid' means very keen.", "Three choices mean almost the same as 'avid'."]
        solution: "Step 1: Eager, keen and enthusiastic are synonyms of avid. Step 2: The opposite is uninterested."
        mistakes: {"eager": opposite_words, "keen": opposite_words, "enthusiastic": opposite_words}
      - prompt: "'Fidget spinners were a fad in 2017.' What does this tell us about fidget spinners?"
        options: ["They were very popular for a short time", "They were banned in schools that year", "They have always been popular with all ages", "They were too expensive for most children"]
        answer: "They were very popular for a short time"
        difficulty: 2
        hints: ["A fad is a short-lived craze.", "Is a fad long-lasting?"]
        solution: "Step 1: A fad is a craze that doesn't last. Step 2: So they were hugely popular, then quickly forgotten."
        mistakes: {"They were banned in schools that year": "glossary_word", "They have always been popular with all ages": "glossary_word", "They were too expensive for most children": "glossary_word"}
      - prompt: "'The nag factor' in advertising refers to:"
        options:
        - "Children pestering their parents until they buy a product"
        - "Parents scolding children for watching too many adverts"
        - "Adverts that are repeated far too often on television"
        - "An old horse that is shown in a famous advert"
        answer: "Children pestering their parents until they buy a product"
        difficulty: 3
        hints: ["To 'nag' is to keep asking or complaining.", "Who nags whom, and what does the advertiser hope happens next?"]
        solution: "Step 1: 'Nag' means to keep pestering. Step 2: Adverts aimed at children make them pester their parents. Step 3: The parents give in and buy: that is the nag factor."
        mistakes: {"Parents scolding children for watching too many adverts": "nag_factor", "Adverts that are repeated far too often on television": "nag_factor"}
      - prompt: What does 'courteous' mean?
        options:
        - Polite
        - Rude
        - Lazy
        - Loud
        answer: Polite
        difficulty: 1
        hints:
        - Barbera used it to describe Jackson.
        - It is a kind way of behaving.
        solution: 'Step 1: Barbera liked Jackson''s manners. Step 2: Good manners = polite. Step 3: Polite.'
        mistakes:
          Rude: opposite_words
      - prompt: Which word means 'routine household tasks'?
        options:
        - chores
        - fads
        - jingles
        - buffs
        answer: chores
        difficulty: 1
        hints:
        - Children may earn money by doing these.
        - Washing dishes is one.
        solution: 'Step 1: Fads = crazes; jingles = tunes; buffs = fans. Step 2: Household jobs are left. Step 3: chores.'
        mistakes:
          fads: e5_word_meaning
      - prompt: '''The essay was rife with errors.'' What does ''rife with'' mean?'
        options:
        - Full of
        - Free of
        - Hidden by
        - Careful about
        answer: Full of
        difficulty: 2
        hints:
        - It usually describes something bad there is a lot of.
        - Many errors were found.
        solution: 'Step 1: The essay had errors. Step 2: ''Rife'' means widespread. Step 3: Full of.'
        mistakes:
          Free of: e5_word_meaning
      - prompt: Which word means 'convincing someone to do or believe something'?
        options:
        - persuasion
        - allegiance
        - self-esteem
        - conceal
        answer: persuasion
        difficulty: 2
        hints:
        - Ads use it all the time.
        - It is a noun from the verb 'persuade'.
        solution: 'Step 1: Allegiance = loyalty; self-esteem = self-worth; conceal = hide. Step 2: Convincing is left. Step 3: persuasion.'
        mistakes:
          allegiance: e5_word_meaning
      - prompt: '''He is very laid-back about exams.'' What does ''laid-back'' mean?'
        options:
        - Relaxed and calm
        - Worried and tense
        - Lying on his back
        - Late
        answer: Relaxed and calm
        difficulty: 2
        hints:
        - It is an informal compound adjective.
        - It describes an easy-going attitude.
        solution: 'Step 1: It describes attitude, not posture. Step 2: Easy-going people don''t worry much. Step 3: Relaxed and calm.'
        mistakes:
          Lying on his back: e4_idiom_sense
      - prompt: '''Self-esteem'' means'
        options:
        - Confidence in your own worth
        - Fear of others
        - Love of money
        - A kind of steam engine
        answer: Confidence in your own worth
        difficulty: 1
        hints:
        - '''Esteem'' means respect.'
        - Self + respect.
        solution: 'Step 1: Esteem = respect. Step 2: Self-esteem = respect for yourself. Step 3: Confidence in your own worth.'
        mistakes:
          A kind of steam engine: e5_word_meaning
      - prompt: 'Situation: A website is ''rife with'' fake offers. What does this tell you about the website?'
        options:
        - It is full of fake offers.
        - It has a few good offers.
        - It has no offers at all.
        answer: It is full of fake offers.
        hints:
        - '''Rife with'' usually describes something bad.'
        - Is it a little or a lot?
        solution: '''Rife with'' means full of, usually something bad: the site is full of fake offers.'
        mistakes:
          It has a few good offers.: opposite_words
          It has no offers at all.: opposite_words
        exam: case
        difficulty: 2
