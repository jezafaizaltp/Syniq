# Class 9 English (Kerala Reader), Unit I. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part I text supplied by the school.
subject: eng
chapter: 1
title: "Unit I: Hours and Years"

tips:
  factory_image: "A factory takes raw material and turns it into something useful. What does the father think school does to children?"
  speech_tone: "Notice how Selma talks about her prize: she keeps giving the credit to other people. What feeling does that show?"
  read_the_lines: "Go back to the exact paragraph. The answer is usually stated in the text, not guessed from the title."
  half_a_day_time: "In 'Half a Day' a whole lifetime passes in what seems like half a day: the boy goes to school a child and comes out an old man."
  selma_debts: "Selma Lagerlof's 'debts' are debts of gratitude, not money: to her father, storytellers, nature, readers, friends and the Swedish Academy."
  poem_theme: "The poem's big idea is that nothing happens twice, so there's no practice run. Which choice fits a 'course' you take only once, with no repeats?"
  tag_rule: "A tag repeats the statement's helping verb and flips it: positive statement → negative tag, negative statement → positive tag. Words like 'nothing' make a statement negative. Don't change the verb itself."
  tag_special: "Some tags break the pattern: 'amn't' isn't used in standard English, so 'I am' borrows another verb form for its tag. 'Let me' and 'Let's' offer or suggest, so their tag asks a question of offering."
  passive_form: "Passive voice = a form of 'be' + past participle (was challenged, is being thrown, has been played). The tense of 'be' matches the active verb."
  past_tenses: "Simple past (walked) is for a completed action; past continuous (was walking) is for an action in progress in the past."
  affix_meaning: "Prefixes come at the front and usually change the meaning (often to an opposite); suffixes come at the end and usually change the word class. Look at both ends of the word."
  glossary_word: "Check the glossary meaning: the word is used in a special sense in the lesson."
  compound_adjective: "Look at how the two words are joined and what job the pair does: which noun does it describe? A word with just a prefix added is not two words."
  nt_rose_image: "The name brings sudden joy and beauty. A storm, a falling rock or a stopped clock are harsh images; the poem uses a rose."
  scent_smell: "Ask which part of your body notices a scent. Each sense has an image name: visual for eyes, tactile for touch, and so on."
  e1_clothes: Go back to the opening paragraph, where the boy's new clothes are listed one by one with their colours.
  e1_who_where: 'Ask who says this line and where in the story it happens: at the school gate, inside, or at the very end.'
  e1_symbol: 'Look past the surface: what does this detail stand for in a whole human life?'
  e1_author_facts: 'Check the note about the writer at the start of the lesson: country, prize and year.'
  e1_debt_list: 'Selma lists her debts one by one: father, storytellers, nature, readers, a friend, and finally the Academy. Which one is this?'
  e1_paradise_scene: 'Picture the daydream: where is her father sitting, and how does he react to her news?'
  e1_once_only: The poem keeps saying there is no rehearsal and no repeat. Which choice fits that idea?
  e1_sense_image: 'Match the image to the sense: eyes = visual, ears = auditory, nose = olfactory, touch = tactile, movement = kinaesthetic.'
  e1_tag_aux: Find the helping verb in the statement (is, are, was, did, has, will...). The tag uses that same verb.
  e1_tag_flip: Positive statement, negative tag; negative statement, positive tag.
  e1_be_tense: 'In the passive, the form of ''be'' keeps the tense of the active verb: simple past → was/were; present perfect → has/have been.'
  e1_prefix_suffix: A prefix is added at the front of the root, a suffix at the end. Cover each end of the word to check.
  e1_two_words: A compound adjective joins two words, usually with a hyphen, to describe a noun.

concepts:
  - code: eng9.u1.half_a_day
    title: Half a Day
    notes: |
      Short story by Naguib Mahfouz (Egypt, first Arab Nobel laureate in Literature, 1988). A small
      boy in new clothes (black shoes, green uniform, red tarboosh) walks to school holding his
      father's hand, unwilling; father says school is "the factory that makes useful people out of
      children". The school looks like a high-walled fortress. A woman tells the children "This is
      your new home". He makes friends, plays, learns songs, language, the globe and numbers, but also
      meets rivalry and punishment. When the bell rings his father is not there; a middle-aged man
      greets him like an old acquaintance; the street of gardens has become high buildings, traffic,
      crowds and refuse. At the crossroads a young lad from the ironing shop says "Grandpa, let me take
      you across." The 'half a day' is really a whole life: childhood, growth, old age and dependence.
    explanations:
      text: "Mahfouz squeezes a whole life into one school day. The boy holds his father's hand in the morning; by evening the world has changed, he is old, and a boy holds his hand to help him cross the road. The story is about how quickly time passes and how the world changes around us."
      visual: "Draw three boxes in a row: Morning (child, father's hand, gardens), Day at school (friends, games, learning, rivalry), Evening (old man, tall buildings, traffic, a boy's hand)."
      step_by_step: "Why is the title 'Half a Day'? Step 1: The story starts in the morning and ends at sunset. Step 2: But the narrator ends as a 'Grandpa'. Step 3: So the half day stands for a whole lifetime passing quickly."
      real_world: "Ask a grandparent how your town looked when they first went to school. The changes they describe are like the changes the narrator sees on his way home."
    activity:
      type: order
      prompt: 'Half a Day: put the boy''s day in order.'
      steps:
      - He walks to school holding his father's hand
      - A woman says, 'This is your new home'
      - He makes friends and learns songs and numbers
      - At the bell, his father is not there
      - The street of gardens is now high buildings and crowds
      - A young lad says, 'Grandpa, let me take you across'
      reasons:
        A woman says, 'This is your new home': He meets the teacher only after reaching the school.
        He makes friends and learns songs and numbers: School life begins after he is welcomed.
        At the bell, his father is not there: The bell rings at the end of the 'day'.
        The street of gardens is now high buildings and crowds: Outside the gate he sees how much time has passed.
        A young lad says, 'Grandpa, let me take you across': Only at the end does he learn he has grown old.
    lesson:
      - teach: '''Half a Day'' is a short story by Naguib Mahfouz of Egypt, the first Arab writer to win the Nobel Prize in Literature (1988). A small boy in new clothes walks unwillingly to school, holding his father''s hand. His father calls school ''the factory that makes useful people out of children''.'
        check:
          prompt: Who wrote 'Half a Day'?
          options:
          - Naguib Mahfouz
          - Selma Lagerlof
          - Wislawa Szymborska
          answer: Naguib Mahfouz
          why: Mahfouz, from Egypt, wrote this story.
      - teach: At school he makes friends, plays and learns songs, language and numbers, but also meets rivalry and punishment. When the bell rings, his father is not there. Outside, the street of gardens has become tall buildings, traffic and crowds. A young lad says, 'Grandpa, let me take you across.'
        picture:
          kind: flow
          steps:
          - 'Morning: child holds father''s hand'
          - 'School: friends, lessons, quarrels'
          - 'Evening: city has changed'
          - Old man helped across the road
          alt: A whole life in 'half a day'.
        check:
          prompt: Why is he called 'Grandpa' at the end?
          options:
          - He has grown old
          - He is wearing a hat
          - He is the lad's grandfather
          answer: He has grown old
          why: The 'half a day' was really a whole lifetime.
      - teach: 'The story is a metaphor for life: it begins and ends with someone holding a hand (dependence), and the changing street shows how the world changes as we grow. The title is ironic, because ''half a day'' is really a lifetime.'
        check:
          prompt: What does the changing street show?
          options:
          - How the world changes over a lifetime
          - That the boy got lost
          - That the school moved
          answer: How the world changes over a lifetime
          why: Gardens became buildings as decades passed.
    items:
      - prompt: "In 'Half a Day', what does the father call school?"
        options: ["The factory that makes useful people out of children", "A punishment for naughty boys", "A fortress for soldiers", "A place to play all day"]
        answer: "The factory that makes useful people out of children"
        difficulty: 1
        hints: ["The boy thought school was a punishment; the father disagreed."]
        solution: "The father laughs and says school is not a punishment but 'the factory that makes useful people out of children'."
        mistakes: {"A punishment for naughty boys": read_the_lines}
      - prompt: "How did the school building look to the boy from a distance?"
        options: ["Like a huge, high-walled fortress, stern and grim", "Like a colourful toy shop", "Like his own home", "Like a garden full of flowers"]
        answer: "Like a huge, high-walled fortress, stern and grim"
        difficulty: 1
        hints: ["He did not want to go there."]
        solution: "The boy saw the school as a stern, grim, high-walled fortress."
        mistakes: {"Like his own home": read_the_lines}
      - prompt: "Who helps the narrator cross the road at the end of the story?"
        options: ["A young lad from the ironing shop", "His father", "The woman from the school", "A policeman"]
        answer: "A young lad from the ironing shop"
        difficulty: 1
        hints: ["He calls the narrator 'Grandpa'."]
        solution: "The young lad employed at the ironing shop on the corner offers, 'Grandpa, let me take you across.'"
        mistakes: {"His father": half_a_day_time}
      - prompt: "Why does the boy address the narrator as 'Grandpa'?"
        options: ["The narrator has grown old", "The narrator is his real grandfather", "It is a joke", "The narrator asked to be called so"]
        answer: "The narrator has grown old"
        difficulty: 2
        hints: ["Think about how much time has really passed."]
        solution: "Though it seems half a day, a lifetime has passed; the narrator is now an old man."
        mistakes: {"The narrator is his real grandfather": half_a_day_time, "It is a joke": half_a_day_time}
      - prompt: "Which change shows that the narrator's surroundings have changed when he comes out of school?"
        options: ["The street lined with gardens is now full of high buildings, vehicles and crowds", "The school gate is painted a new colour", "His father has bought a new car", "It has started to rain"]
        answer: "The street lined with gardens is now full of high buildings, vehicles and crowds"
        difficulty: 2
        hints: ["Compare the morning street and the evening street."]
        solution: "The gardens and fields are gone; tall buildings, traffic, crowds and hills of refuse have taken over."
        mistakes: {"It has started to rain": read_the_lines}
      - prompt: "What is the main idea of 'Half a Day'?"
        options: ["Life passes very quickly and the world keeps changing", "School is always fun", "Fathers should not leave children at school", "Cities are better than villages"]
        answer: "Life passes very quickly and the world keeps changing"
        difficulty: 2
        hints: ["The narrator goes from childhood to old age."]
        solution: "The story uses one 'half day' to show the speed of life and of social change."
        mistakes: {"School is always fun": half_a_day_time}
      - prompt: "At the start the boy holds his father's hand; at the end a boy holds his hand. What does this show?"
        options: ["Life begins and ends in dependence on others", "He has become a teacher", "He never grew up", "Children should always hold hands"]
        answer: "Life begins and ends in dependence on others"
        difficulty: 3
        hints: ["Think of childhood and old age."]
        solution: "The two hand-holding scenes frame life: we depend on others as children and again as old people."
        mistakes: {"He never grew up": half_a_day_time}
      - prompt: "Why is the title 'Half a Day' ironic?"
        options: ["What seems like half a day is really a whole lifetime", "The school day really was very short", "The boy left school at noon", "His father came back after half a day"]
        answer: "What seems like half a day is really a whole lifetime"
        difficulty: 3
        hints: ["How old is the narrator when he walks out of the school gate?", "Irony: what seems to happen is not what really happens."]
        solution: "Step 1: The boy goes in as a child and comes out as an old man called 'Grandpa'. Step 2: So the 'half a day' stands for a whole life passing."
        mistakes: {"The school day really was very short": half_a_day_time, "The boy left school at noon": half_a_day_time, "His father came back after half a day": half_a_day_time}
      - prompt: "The father calls school 'the factory that makes useful people out of children'. What does this comparison suggest?"
        options: ["School shapes children into people who can play a part in society", "Children have to work in factories", "School is a cruel place", "The father works in a factory"]
        answer: "School shapes children into people who can play a part in society"
        difficulty: 3
        hints: ["What does a factory do with raw material?", "This is a metaphor, not a fact."]
        solution: "Step 1: A factory turns raw material into useful products. Step 2: The father means school turns children into useful members of society."
        mistakes: {"Children have to work in factories": factory_image, "School is a cruel place": factory_image, "The father works in a factory": factory_image}
      - prompt: What colour was the boy's tarboosh?
        options:
        - Red
        - Green
        - Black
        - White
        answer: Red
        difficulty: 1
        hints:
        - Go back to the description of his new clothes.
        - His uniform was green and his shoes black.
        solution: 'Step 1: Shoes black, uniform green. Step 2: The tarboosh is the remaining item. Step 3: It was red.'
        mistakes:
          Green: e1_clothes
          Black: e1_clothes
      - prompt: Who says 'This is your new home'?
        options:
        - A woman at the school
        - The boy's father
        - The young lad
        - The middle-aged man
        answer: A woman at the school
        difficulty: 1
        hints:
        - It is said when the children arrive at school.
        - It is a welcome to all the new children.
        solution: 'Step 1: The line welcomes the children on their first day. Step 2: It is spoken inside the school. Step 3: A woman at the school says it.'
        mistakes:
          The boy's father: e1_who_where
      - prompt: Which country was Naguib Mahfouz from?
        options:
        - Egypt
        - Sweden
        - Poland
        - India
        answer: Egypt
        difficulty: 1
        hints:
        - He was the first Arab Nobel laureate in Literature.
        - Sweden and Poland are the homes of the other two writers in this unit.
        solution: 'Step 1: Mahfouz was an Arab writer. Step 2: He was from Cairo. Step 3: Egypt.'
        mistakes:
          Sweden: e1_author_facts
          Poland: e1_author_facts
      - prompt: When the bell rings, the boy looks for his father. What does he find?
        options:
        - His father is not there
        - His father is waiting with a gift
        - His mother is waiting
        - The gate is locked
        answer: His father is not there
        difficulty: 2
        hints:
        - Father had promised to come back.
        - This is the first sign that time has passed.
        solution: 'Step 1: The father promised to wait. Step 2: At the bell he is missing. Step 3: Much more time has passed than the boy thinks.'
        mistakes:
          His father is waiting with a gift: half_a_day_time
      - prompt: In the story, the boy holding his father's hand at the start mainly stands for
        options:
        - The dependence of childhood
        - A fear of traffic
        - A school rule
        - His love of walking
        answer: The dependence of childhood
        difficulty: 3
        hints:
        - Compare the start with the end of the story.
        - Who needs help at each end of life?
        solution: 'Step 1: At the start a child needs his father. Step 2: At the end an old man needs a boy. Step 3: Holding hands shows dependence at both ends of life.'
        mistakes:
          A fear of traffic: e1_symbol
      - prompt: Which word best describes the boy's feeling as he walks to school at the start?
        options:
        - Unwilling
        - Excited
        - Proud
        - Bored
        answer: Unwilling
        difficulty: 2
        hints:
        - Did he want to go?
        - He thought school might be a punishment.
        solution: 'Step 1: He asks why he is being sent away. Step 2: He sees school as a punishment. Step 3: He is unwilling.'
        mistakes:
          Excited: read_the_lines

  - code: eng9.u1.debts_of_gratitude
    title: Debts of Gratitude
    after: [eng9.u1.half_a_day]
    notes: |
      Selma Lagerlof's Nobel banquet speech (1909); she was the first woman to win the Nobel Prize in
      Literature. On the train to Stockholm she is sad that her father is no longer alive to hear the
      news. She daydreams of meeting him in Paradise on a veranda in a rocking chair, and says she has
      come for advice because she is "very heavily in debt" — not money but gratitude: to her father
      for piano, Bellman's songs, Tegner, Runeberg and Andersen; to vagabonds and old storytellers; to
      nature; to readers (for praise and censure); to her friend Esselde; and finally to the Swedish
      Academy for trusting her before the whole world. Her father, in tears of joy, says he is too happy
      to worry. She ends by proposing a toast to the Swedish Academy.
    explanations:
      text: "Selma turns a thank-you speech into a story. Instead of listing people to thank, she imagines asking her late father how to pay her 'debts'. Each debt is someone or something that shaped her: songs, stories, nature, readers, friends. The biggest debt is the Nobel Prize itself."
      visual: "Draw Selma in the centre with arrows coming in from: Father (songs, books), Storytellers and vagabonds, Nature, Readers, Esselde, Swedish Academy. Label the arrows 'debts of gratitude'."
      step_by_step: "Why is Selma thankful even to critics? Step 1: She says she owes readers 'both for their praise and for their censure'. Step 2: Censure means criticism. Step 3: Criticism helped her improve, so she is grateful for it too."
      real_world: "When you win a prize, the people who taught you, encouraged you and even corrected you share in it. A thank-you speech is a way of 'repaying' them."
    activity:
      type: sort
      prompt: Who or what did Selma Lagerlöf owe gratitude to, and why?
      bins:
      - Her father
      - Storytellers and nature
      - Readers
      - The Swedish Academy
      items:
      - label: Piano, Bellman's songs, Tegner and Andersen
        bin: Her father
        clue: Who gave her music and books at home?
        why: Her father.
      - label: Old vagabonds who told tales
        bin: Storytellers and nature
        clue: People she met as a child.
        why: Storytellers.
      - label: Praise and censure
        bin: Readers
        clue: People who read her books.
        why: Readers.
      - label: Trusting her before the whole world
        bin: The Swedish Academy
        clue: Gave her the Nobel Prize.
        why: The Swedish Academy.
      - label: The landscape around her
        bin: Storytellers and nature
        clue: Not a person.
        why: Nature.
      - label: The toast at the end of her speech
        bin: The Swedish Academy
        clue: She raised her glass to them.
        why: The Swedish Academy.
    lesson:
      - teach: '''Debts of Gratitude'' is Selma Lagerlof''s speech at the Nobel banquet in 1909. She was the first woman to win the Nobel Prize in Literature. On the train to Stockholm she feels sad that her father is not alive to hear the news.'
        check:
          prompt: What was special about Selma Lagerlof's Nobel Prize?
          options:
          - She was the first woman to win it in Literature
          - She was the youngest ever
          - She won it twice
          answer: She was the first woman to win it in Literature
          why: In 1909 she became the first woman Literature laureate.
      - teach: 'She imagines meeting her father in Paradise, on a veranda in a rocking chair. She says she is ''heavily in debt'', not of money but of gratitude: to her father (piano, songs, poets), to vagabonds and storytellers, to nature, to readers (for praise and censure), to her friend Esselde, and above all to the Swedish Academy.'
        picture:
          kind: flow
          steps:
          - Father
          - Storytellers and vagabonds
          - Nature
          - Readers
          - Friend Esselde
          - Swedish Academy (biggest debt)
          alt: Selma's list of debts of gratitude.
        check:
          prompt: What kind of debt is Selma talking about?
          options:
          - Gratitude
          - Money
          - Land
          answer: Gratitude
          why: She owes thanks, not money.
      - teach: 'Her father is too happy to worry about her debts. The speech is humble: Selma gives credit to others instead of praising herself. She ends by raising a toast to the Swedish Academy.'
        check:
          prompt: How would you describe the tone of her speech?
          options:
          - Humble and grateful
          - Proud and boastful
          - Angry
          answer: Humble and grateful
          why: She thanks everyone who helped her.
    items:
      - prompt: "Where was Selma Lagerlof travelling to at the start of the speech?"
        options: ["Stockholm", "Paris", "Cairo", "London"]
        answer: "Stockholm"
        difficulty: 1
        hints: ["She was going to receive the Nobel Prize."]
        solution: "She was on the train to Stockholm to receive the Prize in Literature."
        mistakes: {"Paris": read_the_lines}
      - prompt: "Why did Selma feel a deep sorrow on the train?"
        options: ["Her father was no longer alive to hear about her prize", "She had failed an examination", "She had lost her ticket", "Her mother was ill"]
        answer: "Her father was no longer alive to hear about her prize"
        difficulty: 1
        hints: ["Who would have been happiest to hear the news?"]
        solution: "She could not tell her father, who would have been happier than anyone."
        mistakes: {"Her mother was ill": read_the_lines}
      - prompt: "What kind of 'debt' does Selma talk about with her father?"
        options: ["A debt of gratitude", "A bank loan", "Unpaid taxes", "Money borrowed from friends"]
        answer: "A debt of gratitude"
        difficulty: 1
        hints: ["Her father says the place has everything except money, but she says it is not money she owes."]
        solution: "She owes thanks to everyone and everything that helped her become a writer."
        mistakes: {"A bank loan": selma_debts, "Money borrowed from friends": selma_debts}
      - prompt: "Why is Selma grateful even to those who criticised her?"
        options: ["Criticism helped her grow as a writer", "She wanted to make fun of them", "They bought many of her books", "They gave her the prize"]
        answer: "Criticism helped her grow as a writer"
        difficulty: 2
        hints: ["'both for their praise and for their censure'"]
        solution: "Censure (criticism) showed her what to improve, so she counts it as a debt too."
        mistakes: {"They gave her the prize": selma_debts}
      - prompt: "What, according to Selma, was her 'biggest debt'?"
        options: ["The trust the Swedish Academy showed by giving her the Nobel Prize", "Money she owed her publisher", "Her debt to the train company", "Her debt to her brothers"]
        answer: "The trust the Swedish Academy showed by giving her the Nobel Prize"
        difficulty: 2
        hints: ["It made her father cry with joy."]
        solution: "The Academy had trust enough in her 'to single me out before the whole world'."
        mistakes: {"Money she owed her publisher": selma_debts}
      - prompt: "Who was Esselde?"
        options: ["A faithful friend who opened doors for her when no one believed in her", "Her father", "A troll in a story", "A member of the royal family"]
        answer: "A faithful friend who opened doors for her when no one believed in her"
        difficulty: 2
        hints: ["Paragraph 12."]
        solution: "Esselde was her faithful friend who supported her early."
        mistakes: {"Her father": read_the_lines}
      - prompt: "How does Selma end her speech?"
        options: ["She proposes a toast to the Swedish Academy", "She sings one of Bellman's songs", "She reads a poem by Andersen", "She thanks the train driver"]
        answer: "She proposes a toast to the Swedish Academy"
        difficulty: 3
        hints: ["'Your Majesties, Your Royal Highnesses, Ladies and Gentlemen...'"]
        solution: "Having no better answer, she asks everyone to join her in a toast to the Swedish Academy."
        mistakes: {"She sings one of Bellman's songs": read_the_lines}
      - prompt: "Why does Selma imagine meeting her father in Paradise?"
        options: ["She longs to share her joy and thank him, though he has died", "She is planning a holiday", "Her father is waiting for her in Stockholm", "She is afraid of him"]
        answer: "She longs to share her joy and thank him, though he has died"
        difficulty: 2
        hints: ["Why was she sad on the train?", "What does she want to tell him?"]
        solution: "Step 1: She is sad he isn't alive to hear about the prize. Step 2: In her daydream she meets him to share the news and her gratitude."
        mistakes: {"She is planning a holiday": selma_debts, "Her father is waiting for her in Stockholm": read_the_lines, "She is afraid of him": selma_debts}
      - prompt: "What is the tone of Selma Lagerlof's speech?"
        options: ["Humble and grateful", "Proud and boastful", "Angry and bitter", "Bored and careless"]
        answer: "Humble and grateful"
        difficulty: 3
        hints: ["Who does she give credit to for her success?", "She speaks of 'debts' she owes."]
        solution: "Step 1: She credits her father, storytellers, friends, readers and even critics. Step 2: Giving others the credit shows humility and gratitude."
        mistakes: {"Proud and boastful": speech_tone, "Angry and bitter": speech_tone, "Bored and careless": speech_tone}
      - prompt: In her daydream, where is Selma's father sitting?
        options:
        - In a rocking chair on a veranda
        - In a train compartment
        - At a piano in Stockholm
        - In the Swedish Academy
        answer: In a rocking chair on a veranda
        difficulty: 1
        hints:
        - Picture the calm scene in Paradise.
        - He is resting comfortably.
        solution: 'Step 1: She imagines Paradise. Step 2: He sits on a veranda. Step 3: In a rocking chair.'
        mistakes:
          In a train compartment: e1_paradise_scene
      - prompt: In which year did Selma Lagerlof give this Nobel speech?
        options:
        - '1909'
        - '1988'
        - '1996'
        - '1919'
        answer: '1909'
        difficulty: 1
        hints:
        - It was early in the 20th century.
        - 1988 and 1996 are the other two writers' Nobel years.
        solution: 'Step 1: Mahfouz won in 1988 and Szymborska in 1996. Step 2: Selma was much earlier. Step 3: 1909.'
        mistakes:
          '1988': e1_author_facts
          '1996': e1_author_facts
      - prompt: Why is Selma grateful to vagabonds and old storytellers?
        options:
        - They filled her with stories and legends
        - They lent her money
        - They built her house
        - They gave her the prize
        answer: They filled her with stories and legends
        difficulty: 2
        hints:
        - Think about what a writer needs.
        - What do storytellers share?
        solution: 'Step 1: A writer needs stories. Step 2: Storytellers and wanderers passed on tales. Step 3: They gave her stories.'
        mistakes:
          They lent her money: e1_debt_list
      - prompt: How does Selma's father react to her 'debts' in the dream?
        options:
        - He is too happy to worry
        - He scolds her
        - He offers to pay in money
        - He leaves the room
        answer: He is too happy to worry
        difficulty: 2
        hints:
        - He hears that she won the Nobel Prize.
        - He has tears of joy.
        solution: 'Step 1: He learns of her prize. Step 2: He weeps with joy. Step 3: He is too happy to worry.'
        mistakes:
          He scolds her: e1_paradise_scene
      - prompt: Which debt does Selma call the biggest?
        options:
        - To the Swedish Academy
        - To her friend Esselde
        - To nature
        - To her readers
        answer: To the Swedish Academy
        difficulty: 2
        hints:
        - It is the last one she names.
        - It trusted her before the whole world.
        solution: 'Step 1: She goes through her debts one by one. Step 2: The last is to those who gave the prize. Step 3: The Swedish Academy.'
        mistakes:
          To her friend Esselde: e1_debt_list
      - prompt: Why does Selma frame her speech as a talk with her dead father?
        options:
        - To share her joy and thank him, though he cannot hear it
        - Because he was on the Nobel committee
        - Because he asked her to write it
        - To complain about her debts
        answer: To share her joy and thank him, though he cannot hear it
        difficulty: 3
        hints:
        - Remember why she felt sad on the train.
        - Whom did she most want to tell?
        solution: 'Step 1: She was sad he could not hear the news. Step 2: The daydream lets her tell him. Step 3: It shows her love and gratitude.'
        mistakes:
          To complain about her debts: speech_tone

  - code: eng9.u1.nothing_twice
    title: Nothing Twice (Poem)
    after: [eng9.u1.half_a_day]
    notes: |
      Poem by Wislawa Szymborska (Polish, Nobel Prize 1996). "Nothing can ever happen twice": we arrive
      in life "improvised" and leave without practice. Even the planet's biggest dunce cannot "repeat the
      class in summer": "this course is only offered once" (life). No day copies yesterday; no two nights
      or kisses are the same. Hearing a loved one's name feels like a rose flung into the room, "all hue
      and scent"; the next day the speaker watches the clock. "Why do we treat the fleeting day / with so
      much needless fear and sorrow? ... Today is always gone tomorrow." People are as different as two
      drops of water. Images: visual (rose), auditory (idle tongue mentions your name), olfactory
      (scent), tactile (kisses), kinaesthetic (fleeting day).
    explanations:
      text: "The poet compares life to a course offered only once: there are no rehearsals and no repeat exams. Every day, every kiss, every person is unique, so we should not waste days in needless fear and sorrow, because today is always gone tomorrow."
      visual: "Draw a calendar where every page has a different picture, none repeated, and under it write: 'No day copies yesterday.'"
      step_by_step: "What does 'this course is only offered once' mean? Step 1: A course is like a class at school. Step 2: Here the 'course' is life. Step 3: We live it only once, so we cannot repeat it like a failed exam."
      real_world: "A cricket match, a festival or a friend's birthday party never happens exactly the same way again. Enjoying the moment is the poem's advice."
    activity:
      type: sort
      prompt: Which image is it in 'Nothing Twice'?
      bins:
      - Seeing (visual)
      - Hearing (auditory)
      - Smell (olfactory)
      - Touch (tactile)
      items:
      - label: A rose flung into the room
        bin: Seeing (visual)
        clue: You picture it.
        why: Visual image.
      - label: An idle tongue mentions your name
        bin: Hearing (auditory)
        clue: Words spoken aloud.
        why: Auditory image.
      - label: '''all hue and scent'''
        bin: Smell (olfactory)
        clue: Which word is for the nose?
        why: 'Scent: olfactory.'
      - label: No two kisses are the same
        bin: Touch (tactile)
        clue: Felt on the skin.
        why: Tactile.
      - label: 'All hue: the rose''s colours'
        bin: Seeing (visual)
        clue: Hue means colour.
        why: Visual.
    lesson:
      - teach: '''Nothing Twice'' is by Wislawa Szymborska of Poland (Nobel Prize 1996). Its main idea: nothing can ever happen twice. We are born without practice and die without rehearsal. Life is a course ''only offered once''; even the biggest dunce cannot repeat the class.'
        check:
          prompt: What is the 'course' offered only once?
          options:
          - Life
          - School
          - Summer holiday
          answer: Life
          why: We cannot live our life a second time.
      - teach: 'No day copies yesterday, and no two nights or kisses are the same. When someone mentions ''your name'', it feels like a rose flung into the room, ''all hue and scent''. The poem asks why we meet the fleeting day with needless fear and sorrow: ''Today is always gone tomorrow.'''
        check:
          prompt: '''Today is always gone tomorrow'' means'
          options:
          - Every day passes for ever
          - Tomorrow never comes
          - Today is boring
          answer: Every day passes for ever
          why: Time moves on and a day never returns.
      - teach: 'The poem uses sense images. Visual: the rose''s colour (hue). Olfactory: scent. Tactile: kisses. Auditory: someone saying your name. Kinaesthetic: the fleeting, moving day.'
        picture:
          kind: compare
          columns:
          - title: Eyes and nose
            points:
            - 'hue: visual'
            - 'scent: olfactory'
          - title: Ears and touch
            points:
            - 'a name spoken: auditory'
            - 'kisses: tactile'
          - title: Movement
            points:
            - 'fleeting day: kinaesthetic'
          alt: Sense images in 'Nothing Twice'.
        check:
          prompt: '''Hue'' appeals to which sense?'
          options:
          - Sight
          - Smell
          - Touch
          answer: Sight
          why: Hue means colour, which we see.
    items:
      - prompt: "Who wrote 'Nothing Twice'?"
        options: ["Wislawa Szymborska", "Selma Lagerlof", "Naguib Mahfouz", "T. S. Eliot"]
        answer: "Wislawa Szymborska"
        difficulty: 1
        hints: ["A Polish poet who won the Nobel Prize in 1996."]
        solution: "The poem is by Wislawa Szymborska."
        mistakes: {"Selma Lagerlof": read_the_lines}
      - prompt: "In the poem, what is the 'course' that is 'only offered once'?"
        options: ["Life", "A summer class", "A cooking course", "A journey by sea"]
        answer: "Life"
        difficulty: 1
        hints: ["Even the biggest dunce can't repeat it."]
        solution: "The 'course' is life, which we live only once."
        mistakes: {"A summer class": poem_theme}
      - prompt: "What does the poet feel when someone mentions 'your name' by accident?"
        options: ["As if a rose were flung into the room", "As if a storm had started", "As if the clock had stopped", "As if a rock had fallen"]
        answer: "As if a rose were flung into the room"
        difficulty: 2
        hints: ["'all hue and scent'"]
        solution: "The name brings sudden beauty and joy, like a rose 'all hue and scent'."
        mistakes: {"As if a storm had started": "nt_rose_image", "As if a rock had fallen": "nt_rose_image"}
      - prompt: "What does the line 'Today is always gone tomorrow' tell us about time?"
        options: ["Time keeps moving and every day passes for ever", "Tomorrow never comes", "We should sleep more", "Days repeat themselves"]
        answer: "Time keeps moving and every day passes for ever"
        difficulty: 2
        hints: ["It is in the nature of the day 'not to stay'."]
        solution: "Each day is fleeting; once gone, it does not return."
        mistakes: {"Days repeat themselves": poem_theme}
      - prompt: "The word 'scent' in the poem appeals to which sense?"
        options: ["Smell (olfactory)", "Sight (visual)", "Hearing (auditory)", "Touch (tactile)"]
        answer: "Smell (olfactory)"
        difficulty: 2
        hints: ["Scent is a smell."]
        solution: "Scent is an olfactory image."
        mistakes: {"Sight (visual)": "scent_smell", "Touch (tactile)": "scent_smell"}
      - prompt: "'although we're different ... just as two drops of water are.' What does this comparison suggest?"
        options: ["Even people who seem alike are unique", "All people are exactly the same", "Water is more important than people", "People should not argue"]
        answer: "Even people who seem alike are unique"
        difficulty: 3
        hints: ["Two drops of water look identical, yet each is separate."]
        solution: "Like two drops of water, people may look alike but each is individual and unique."
        mistakes: {"All people are exactly the same": poem_theme}
      - prompt: "Why does the poet say even the biggest dunce cannot 'repeat the class in summer'?"
        options: ["Life cannot be lived again, unlike a failed school year", "Summer classes are cancelled", "Dunces never study", "The exams are too hard"]
        answer: "Life cannot be lived again, unlike a failed school year"
        difficulty: 2
        hints: ["What is 'the course' that is 'only offered once'?", "A student who fails can repeat a class. Can we repeat life?"]
        solution: "Step 1: The 'course' is life. Step 2: Unlike school, life gives no second attempt, so no one can repeat it."
        mistakes: {"Summer classes are cancelled": poem_theme, "Dunces never study": poem_theme, "The exams are too hard": poem_theme}
      - prompt: "What attitude does 'Nothing Twice' finally suggest?"
        options: ["Accept change and treasure each moment, because every day is unique", "Fear the future", "Try to live the same day again", "Keep away from other people"]
        answer: "Accept change and treasure each moment, because every day is unique"
        difficulty: 3
        hints: ["'Today is always gone tomorrow.'", "The poem ends with smiling and embracing despite differences."]
        solution: "Step 1: Since nothing repeats, every moment is precious. Step 2: The poem urges us to accept change and value each other and each day."
        mistakes: {"Fear the future": poem_theme, "Try to live the same day again": poem_theme, "Keep away from other people": poem_theme}
      - prompt: Which country was Wislawa Szymborska from?
        options:
        - Poland
        - Egypt
        - Sweden
        - England
        answer: Poland
        difficulty: 1
        hints:
        - She won the Nobel Prize in 1996.
        - The other two writers in this unit are from Egypt and Sweden.
        solution: 'Step 1: Mahfouz is Egyptian, Lagerlof Swedish. Step 2: Szymborska was Polish. Step 3: Poland.'
        mistakes:
          Sweden: e1_author_facts
      - prompt: According to the poem, we arrive in life
        options:
        - Improvised, without practice
        - After long rehearsal
        - Knowing everything
        - Twice
        answer: Improvised, without practice
        difficulty: 2
        hints:
        - No one practises being born.
        - Think of an actor with no rehearsal.
        solution: 'Step 1: The poem says we come without practice. Step 2: That is like improvising. Step 3: Improvised, without practice.'
        mistakes:
          After long rehearsal: e1_once_only
      - prompt: '''All hue and scent'' appeals to which two senses?'
        options:
        - Sight and smell
        - Hearing and touch
        - Taste and touch
        - Hearing and smell
        answer: Sight and smell
        difficulty: 2
        hints:
        - Hue is colour.
        - Scent is a smell.
        solution: 'Step 1: Hue = colour = sight. Step 2: Scent = smell. Step 3: Sight and smell.'
        mistakes:
          Hearing and touch: e1_sense_image
      - prompt: Why does the poet say 'the next day' the speaker watches the clock?
        options:
        - Time feels slow while waiting for the loved one
        - The clock is broken
        - She is late for school
        - She wants to sleep
        answer: Time feels slow while waiting for the loved one
        difficulty: 3
        hints:
        - Feelings change from one day to the next.
        - When do we keep looking at a clock?
        solution: 'Step 1: One day brings joy at a name. Step 2: The next brings waiting. Step 3: Clock-watching shows impatience and longing.'
        mistakes:
          She wants to sleep: e1_once_only
      - prompt: Which line best sums up the poem's message?
        options:
        - Nothing can ever happen twice
        - Practice makes perfect
        - History repeats itself
        - Every day is the same
        answer: Nothing can ever happen twice
        difficulty: 1
        hints:
        - Look at the title.
        - The poem rejects repetition.
        solution: 'Step 1: The title says it. Step 2: Every stanza shows a moment that cannot return. Step 3: Nothing can ever happen twice.'
        mistakes:
          History repeats itself: e1_once_only
          Every day is the same: e1_once_only
      - prompt: The poet says we are as different as 'two drops of water'. This is surprising because drops of water usually seem
        options:
        - Exactly alike
        - Very different
        - Huge
        - Coloured
        answer: Exactly alike
        difficulty: 2
        hints:
        - Think of the saying 'as alike as two drops of water'.
        - The poet turns the saying around.
        solution: 'Step 1: Drops of water look identical. Step 2: The poet says even they are different. Step 3: So every person is unique.'
        mistakes:
          Very different: nt_rose_image
      - prompt: Which word describes the poem's attitude to life's changes?
        options:
        - Accepting
        - Fearful
        - Angry
        - Bored
        answer: Accepting
        difficulty: 3
        hints:
        - The poet asks why we feel 'needless fear and sorrow'.
        - She wants us to take each moment as it comes.
        solution: 'Step 1: The poet calls fear and sorrow needless. Step 2: She asks us to treasure each moment. Step 3: Accepting.'
        mistakes:
          Fearful: e1_once_only

  - code: eng9.u1.grammar
    title: "Grammar: question tags, passive voice and past tenses"
    after: [eng9.u1.half_a_day]
    notes: |
      Question tags seek confirmation: same auxiliary as the statement, opposite polarity, pronoun
      subject (This is your new home, isn't it? There is nothing amiss, is there? My mother stood at
      the window, didn't she? I am in debt, aren't I? Be a man, won't you? Let me take you across,
      shall I?). Passive voice puts the action first: be + past participle (I challenged my father →
      My father was challenged by me; The men were sorting us → We were being sorted by the men).
      Simple past for completed actions (They walked); past continuous was/were + -ing for actions in
      progress (The boy was walking). A sentence has a noun phrase (subject) and a verb phrase.
    explanations:
      text: "A question tag is a mini-question at the end of a sentence. Copy the helping verb, flip positive to negative, and use a pronoun: 'Father has lowered his head, hasn't he?' In the passive voice, the doer goes to the end or disappears: 'The software was installed.'"
      visual: "Draw a seesaw: on one end 'positive statement', on the other 'negative tag'. If one side goes up, the other goes down."
      step_by_step: "Add a tag to 'All my clothes were new'. Step 1: Helping verb: were. Step 2: Statement is positive, so tag is negative: weren't. Step 3: Pronoun for 'all my clothes': they. Answer: weren't they?"
      real_world: "News reports and notices use the passive a lot: 'The bill was passed', 'Visitors are requested to remove footwear.'"
    activity:
      type: sort
      prompt: Pick the right question tag.
      bins:
      - isn't it?
      - is there?
      - didn't she?
      - aren't I?
      items:
      - label: This is your new home, ...
        bin: isn't it?
        clue: Positive statement, so a negative tag; 'this' becomes 'it'.
        why: isn't it?
      - label: There is nothing amiss, ...
        bin: is there?
        clue: '''Nothing'' makes the statement negative.'
        why: 'Negative statement → positive tag: is there?'
      - label: My mother stood at the window, ...
        bin: didn't she?
        clue: 'Past simple: use ''did''.'
        why: didn't she?
      - label: I am in debt, ...
        bin: aren't I?
        clue: '''amn''t I'' isn''t used.'
        why: aren't I?
      - label: There is no one at the gate, ...
        bin: is there?
        clue: '''No one'' makes the statement negative.'
        why: 'Negative statement → positive tag: is there?'
    lesson:
      - teach: 'A question tag turns a statement into a check: ''It is late, isn''t it?'' Use the same helping verb as the statement, flip positive/negative, and use a pronoun. If there is no helping verb, use do/does/did: ''She sang well, didn''t she?'''
        picture:
          kind: compare
          columns:
          - title: Positive → negative tag
            points:
            - You are ready, aren't you?
            - He came, didn't he?
          - title: Negative → positive tag
            points:
            - She can't swim, can she?
            - Nobody knows, do they?
          alt: Question tag patterns.
        check:
          prompt: '''They have finished, ___?'''
          options:
          - haven't they
          - didn't they
          - have they
          answer: haven't they
          why: Same helping verb (have), flipped to negative.
      - teach: 'Special tags: ''I am...'' → ''aren''t I?''; ''Let''s...'' → ''shall we?''; ''Let me...'' → ''shall I?''; orders like ''Close the door'' → ''will you?'' or ''won''t you?''. Words like nothing, nobody, never make the statement negative, so the tag is positive.'
        check:
          prompt: '''Nobody called, ___?'''
          options:
          - did they
          - didn't they
          - did he
          answer: did they
          why: Nobody makes it negative, so the tag is positive; 'they' refers to nobody.
      - teach: 'Passive voice: be + past participle. The object becomes the subject. Keep the tense in ''be'': ''The cat chased the mouse'' → ''The mouse was chased by the cat''. ''They are building a bridge'' → ''A bridge is being built.'' ''She has written a letter'' → ''A letter has been written by her.'''
        picture:
          kind: flow
          steps:
          - 'Active: Ravi painted the wall.'
          - 'Object becomes subject: The wall'
          - 'be (past) + past participle: was painted'
          - 'Passive: The wall was painted by Ravi.'
          alt: Steps to make a passive sentence.
        check:
          prompt: 'Passive of ''Meera cleans the room'':'
          options:
          - The room is cleaned by Meera.
          - The room was cleaned by Meera.
          - Meera is cleaned by the room.
          answer: The room is cleaned by Meera.
          why: Simple present active → is + past participle.
    items:
      - prompt: "Choose the correct tag: 'This is your new home, ___?'"
        options: ["isn't it", "is it", "doesn't it", "wasn't it"]
        answer: "isn't it"
        difficulty: 1
        hints: ["Positive statement with 'is'."]
        solution: "Positive 'is' → negative tag 'isn't it?'"
        mistakes: {"is it": tag_rule, "doesn't it": tag_rule}
      - prompt: "Choose the correct tag: 'There is nothing amiss, ___?'"
        options: ["is there", "isn't there", "isn't it", "is it"]
        answer: "is there"
        difficulty: 2
        hints: ["'Nothing' makes the statement negative."]
        solution: "A negative statement (nothing) takes a positive tag: is there?"
        mistakes: {"isn't there": tag_rule}
      - prompt: "Choose the correct tag: 'I am in debt, ___?'"
        options: ["aren't I", "amn't I", "isn't I", "don't I"]
        answer: "aren't I"
        difficulty: 2
        hints: ["A special case."]
        solution: "'I am' takes the tag 'aren't I?'"
        mistakes: {"amn't I": tag_special, "isn't I": tag_special}
      - prompt: "Choose the correct tag: 'Let me take you across, ___?'"
        options: ["shall I", "won't you", "don't I", "will I"]
        answer: "shall I"
        difficulty: 3
        hints: ["An offer with 'Let me'."]
        solution: "'Let me...' takes 'shall I?'"
        mistakes: {"won't you": tag_special}
      - prompt: "Change to passive voice: 'I challenged my father openly.'"
        options: ["My father was openly challenged by me.", "My father is openly challenged by me.", "My father challenged me openly.", "My father has been challenged by me."]
        answer: "My father was openly challenged by me."
        difficulty: 1
        hints: ["Simple past → was/were + past participle."]
        solution: "Simple past 'challenged' → 'was challenged'."
        mistakes: {"My father is openly challenged by me.": passive_form, "My father challenged me openly.": passive_form}
      - prompt: "Change to passive voice: 'The men were sorting us.'"
        options: ["We were being sorted by the men.", "We were sorted by the men.", "We are sorted by the men.", "The men were sorted by us."]
        answer: "We were being sorted by the men."
        difficulty: 2
        hints: ["Past continuous → was/were being + past participle."]
        solution: "'were sorting' → 'were being sorted'."
        mistakes: {"We were sorted by the men.": passive_form, "The men were sorted by us.": passive_form}
      - prompt: "Which sentence is in the past continuous tense?"
        options: ["The boy was walking to school with his father.", "They walked through a street lined with gardens.", "The boy walks to school.", "The boy has walked to school."]
        answer: "The boy was walking to school with his father."
        difficulty: 1
        hints: ["was/were + -ing."]
        solution: "'was walking' shows an action in progress in the past."
        mistakes: {"They walked through a street lined with gardens.": past_tenses}
      - prompt: "Choose the correct tag: 'Nobody came to the meeting, ___?'"
        options: ["did they", "didn't they", "did he", "didn't he"]
        answer: "did they"
        difficulty: 3
        hints: ["'Nobody' makes the statement negative.", "Pronouns like nobody and everybody take 'they' in the tag."]
        solution: "Step 1: 'Nobody' is negative, so the tag is positive: did. Step 2: Its pronoun is 'they': did they?"
        mistakes: {"didn't they": tag_rule, "did he": tag_special, "didn't he": tag_rule}
      - prompt: "Change to passive voice: 'Someone has opened the gate.'"
        options: ["The gate has been opened.", "The gate has opened.", "The gate was opened by someone has.", "The gate is being opened."]
        answer: "The gate has been opened."
        difficulty: 2
        hints: ["Present perfect passive: has/have + been + past participle.", "Leave out 'by someone'."]
        solution: "Step 1: The object 'the gate' becomes the subject. Step 2: has opened → has been opened. Step 3: 'by someone' is usually dropped."
        mistakes: {"The gate has opened.": passive_form, "The gate was opened by someone has.": passive_form, "The gate is being opened.": passive_form}
      - prompt: 'Choose the correct tag: ''He can swim, ___?'''
        options:
        - can't he
        - doesn't he
        - can he
        - isn't he
        answer: can't he
        difficulty: 1
        hints:
        - Which helping verb is in the statement?
        - Positive statement, so the tag is negative.
        solution: 'Step 1: Helping verb = can. Step 2: Statement positive, tag negative. Step 3: can''t he.'
        mistakes:
          doesn't he: e1_tag_aux
          can he: e1_tag_flip
      - prompt: 'Choose the correct tag: ''You didn''t see him, ___?'''
        options:
        - did you
        - didn't you
        - do you
        - were you
        answer: did you
        difficulty: 2
        hints:
        - The statement is negative.
        - So the tag must be positive.
        solution: 'Step 1: Helping verb = did. Step 2: Statement negative, tag positive. Step 3: did you.'
        mistakes:
          didn't you: e1_tag_flip
      - prompt: 'Choose the correct tag: ''Let''s go to the beach, ___?'''
        options:
        - shall we
        - won't we
        - don't we
        - aren't we
        answer: shall we
        difficulty: 2
        hints:
        - '''Let''s'' makes a suggestion.'
        - The tag for a suggestion invites agreement.
        solution: 'Step 1: Let''s = let us, a suggestion. Step 2: Suggestions take a special tag. Step 3: shall we.'
        mistakes:
          won't we: tag_special
      - prompt: 'Change to passive voice: ''The teacher praised the students.'''
        options:
        - The students were praised by the teacher.
        - The students are praised by the teacher.
        - The teacher was praised by the students.
        - The students praised the teacher.
        answer: The students were praised by the teacher.
        difficulty: 2
        hints:
        - The object becomes the new subject.
        - Praised is past tense, and 'students' is plural.
        solution: 'Step 1: Object ''the students'' becomes subject. Step 2: Past tense, plural → were. Step 3: were praised by the teacher.'
        mistakes:
          The students are praised by the teacher.: e1_be_tense
          The teacher was praised by the students.: passive_form
      - prompt: 'Change to passive voice: ''They have built a new school.'''
        options:
        - A new school has been built by them.
        - A new school was built by them.
        - A new school is built by them.
        - They have been built a new school.
        answer: A new school has been built by them.
        difficulty: 3
        hints:
        - Present perfect active → present perfect passive.
        - Use has/have + been + past participle.
        solution: 'Step 1: Object ''a new school'' becomes subject. Step 2: Present perfect → has been. Step 3: has been built by them.'
        mistakes:
          A new school was built by them.: e1_be_tense
      - prompt: Which sentence is in the simple past tense?
        options:
        - We played cricket after school.
        - We were playing cricket after school.
        - We are playing cricket now.
        - We will play cricket tomorrow.
        answer: We played cricket after school.
        difficulty: 1
        hints:
        - Simple past shows a finished action.
        - Look for a single verb ending in -ed, without was/were.
        solution: 'Step 1: ''were playing'' is past continuous. Step 2: ''are playing'' and ''will play'' are not past. Step 3: ''played'' is simple past.'
        mistakes:
          We were playing cricket after school.: past_tenses

  - code: eng9.u1.words
    title: "Words: affixes, compound adjectives and the glossary"
    after: [eng9.u1.half_a_day]
    notes: |
      Glossary words: misgivings (doubts), crammed (filled), contentment (happiness and satisfaction),
      scowl (angry look), grim (severe), throngs/hordes (crowds), fleeting (lasting a short time),
      dunce (slow learner), censure (criticism), vagabond (wanderer), dispel (eliminate), perseverance.
      Compound adjectives: two or more words describing a noun, e.g. dust-laden, high-walled,
      soft-spoken, kind-hearted, tree-lined, double-storeyed. Affixation: prefix (un-, dis-, non-, sub-)
      at the start, suffix (-ful, -able, -ly, -ness, -ible) at the end; unbearable, enjoyable,
      extremely, fearful. Adjectives describe nouns (wondrous joy).
    explanations:
      text: "You can build new words like Lego. Add 'un-' to the front of 'bearable' and the meaning flips. Add '-ful' to 'fear' and a noun becomes an adjective. Join 'dust' and 'laden' with a hyphen and you get a compound adjective: dust-laden winds."
      visual: "Draw a word in a box with an empty box on each side. Left box: prefix (changes meaning). Right box: suffix (changes the kind of word)."
      step_by_step: "Make the opposite of 'agree'. Step 1: We want the meaning reversed. Step 2: 'dis-' is a prefix meaning not. Step 3: disagree."
      real_world: "Advertisements love compound adjectives: 'sugar-free', 'long-lasting', 'eco-friendly'."
    activity:
      type: sort
      prompt: Prefix, suffix or compound adjective?
      bins:
      - Prefix added
      - Suffix added
      - Compound adjective
      items:
      - label: unbearable (un-)
        bin: Prefix added
        clue: 'Look at the start: un-.'
        why: un- is a prefix. (It also has -able at the end.)
      - label: dislike
        bin: Prefix added
        clue: Something added at the start.
        why: dis- is a prefix.
      - label: fearful
        bin: Suffix added
        clue: Something added at the end.
        why: -ful is a suffix.
      - label: extremely
        bin: Suffix added
        clue: Look at the end.
        why: -ly is a suffix.
      - label: high-walled
        bin: Compound adjective
        clue: Two words joined to describe a noun.
        why: Compound adjective.
      - label: dust-laden
        bin: Compound adjective
        clue: Two words with a hyphen.
        why: Compound adjective.
      - label: kind-hearted
        bin: Compound adjective
        clue: Two words joined.
        why: Compound adjective.
    lesson:
      - teach: 'Affixes change words. A prefix goes at the front and often changes the meaning: un-, dis-, non-, sub- (unhappy, dislike, non-stop). A suffix goes at the end and often changes the word class: -ful, -able, -ly, -ness (careful, readable, quickly, kindness).'
        picture:
          kind: compare
          columns:
          - title: Prefix (front)
            points:
            - un + kind = unkind
            - dis + agree = disagree
          - title: Suffix (end)
            points:
            - hope + ful = hopeful
            - dark + ness = darkness
          alt: Prefixes and suffixes.
        check:
          prompt: In 'careless', -less is a
          options:
          - Suffix
          - Prefix
          - Root
          answer: Suffix
          why: It is added at the end of 'care'.
      - teach: 'A compound adjective joins two or more words, usually with a hyphen, to describe a noun: a high-walled school, a soft-spoken teacher, a tree-lined road, a dust-laden street.'
        check:
          prompt: Which is a compound adjective?
          options:
          - kind-hearted
          - kindness
          - unkind
          answer: kind-hearted
          why: Two words joined to describe a person.
      - teach: 'Lesson words: misgivings (doubts), grim (severe), throngs/hordes (crowds), fleeting (very short), dunce (slow learner), censure (criticism), vagabond (wanderer), dispel (remove), contentment (happiness and satisfaction).'
        check:
          prompt: A 'vagabond' is
          options:
          - A wanderer
          - A king
          - A teacher
          answer: A wanderer
          why: Vagabonds move from place to place.
    items:
      - prompt: "What does 'misgivings' mean?"
        options: ["Doubts", "Gifts", "Mistakes", "Crowds"]
        answer: "Doubts"
        difficulty: 1
        hints: ["'Then it seemed to me my misgivings had had no basis.'"]
        solution: "Misgivings are doubts or apprehensions."
        mistakes: {"Mistakes": glossary_word}
      - prompt: "What does 'fleeting' mean in 'the fleeting day'?"
        options: ["Lasting for a very short time", "Flying like a bird", "Very long and boring", "Full of ships"]
        answer: "Lasting for a very short time"
        difficulty: 1
        hints: ["The day does not stay."]
        solution: "Fleeting means lasting a very short time."
        mistakes: {"Full of ships": glossary_word}
      - prompt: "Which is a compound adjective?"
        options: ["dust-laden", "dust", "quickly", "unhappy"]
        answer: "dust-laden"
        difficulty: 2
        hints: ["Two words joined to describe a noun."]
        solution: "'Dust-laden' (winds) joins two words to describe a noun."
        mistakes: {"unhappy": "compound_adjective", "dust": "compound_adjective"}
      - prompt: "Which prefix makes the opposite of 'existent'?"
        options: ["non-", "sub-", "-ness", "-ful"]
        answer: "non-"
        difficulty: 2
        hints: ["A prefix goes at the beginning."]
        solution: "non- + existent = non-existent."
        mistakes: {"-ness": affix_meaning, "-ful": affix_meaning}
      - prompt: "In 'unbearable', what are the affixes?"
        options: ["Prefix un- and suffix -able", "Prefix bear- and suffix -un", "Only the suffix -able", "Only the prefix un-"]
        answer: "Prefix un- and suffix -able"
        difficulty: 2
        hints: ["Find the root word first: bear."]
        solution: "un- + bear + -able."
        mistakes: {"Only the suffix -able": affix_meaning}
      - prompt: "What does 'censure' mean in 'both for their praise and for their censure'?"
        options: ["Criticism", "Census", "Praise", "Censorship of films"]
        answer: "Criticism"
        difficulty: 3
        hints: ["It is the opposite of praise here."]
        solution: "Censure means criticism."
        mistakes: {"Praise": glossary_word, "Censorship of films": glossary_word}
      - prompt: "Which word is made by adding only a suffix to a root word?"
        options: ["contentment", "unhappy", "rewrite", "non-stop"]
        answer: "contentment"
        difficulty: 2
        hints: ["A suffix comes at the end.", "un-, re- and non- are prefixes."]
        solution: "Step 1: unhappy, rewrite and non-stop begin with prefixes. Step 2: content + -ment adds only a suffix."
        mistakes: {"unhappy": affix_meaning, "rewrite": affix_meaning, "non-stop": affix_meaning}
      - prompt: "In 'hordes of people filled the street', what does 'hordes' mean?"
        options: ["Large crowds", "Small groups", "Soldiers", "Shops"]
        answer: "Large crowds"
        difficulty: 2
        hints: ["The street is 'filled'.", "It is a glossary word like 'throngs'."]
        solution: "Step 1: Hordes and throngs both mean crowds. Step 2: The street was filled with large crowds."
        mistakes: {"Small groups": glossary_word, "Soldiers": glossary_word, "Shops": glossary_word}
      - prompt: "Which word has both a prefix and a suffix added to its root?"
        options:
        - "unbearable"
        - "fearful"
        - "dislike"
        - "kindness"
        answer: "unbearable"
        difficulty: 3
        hints: ["A prefix comes before the root; a suffix comes after it.", "Find the root word in each, then check both ends."]
        solution: "Step 1: unbearable = un- + bear + -able. Step 2: fearful has only a suffix (-ful), dislike only a prefix (dis-), kindness only a suffix (-ness). Step 3: So 'unbearable' has both."
        mistakes: {"fearful": affix_meaning, "dislike": affix_meaning, "kindness": affix_meaning}
      - prompt: What does 'grim' mean?
        options:
        - Severe and serious
        - Bright and cheerful
        - Very small
        - Noisy
        answer: Severe and serious
        difficulty: 1
        hints:
        - The school looked 'stern and grim'.
        - It made the boy uneasy.
        solution: 'Step 1: ''Stern and grim'' go together. Step 2: Both describe something harsh. Step 3: Severe and serious.'
        mistakes:
          Bright and cheerful: glossary_word
      - prompt: Which word means 'a wanderer'?
        options:
        - Vagabond
        - Dunce
        - Throng
        - Censure
        answer: Vagabond
        difficulty: 1
        hints:
        - Selma thanks such people for their stories.
        - They have no fixed home.
        solution: 'Step 1: Dunce = slow learner; throng = crowd; censure = criticism. Step 2: A wanderer is a vagabond. Step 3: Vagabond.'
        mistakes:
          Dunce: glossary_word
      - prompt: Add a prefix to make the opposite of 'agree'.
        options:
        - disagree
        - unagree
        - nonagree
        - agreeable
        answer: disagree
        difficulty: 1
        hints:
        - Only one prefix fits this word in standard English.
        - It is the same prefix as in 'dislike'.
        solution: 'Step 1: Opposites often use un-, dis- or non-. Step 2: ''agree'' takes dis-. Step 3: disagree.'
        mistakes:
          agreeable: e1_prefix_suffix
      - prompt: Which word is made with a suffix that turns an adjective into a noun?
        options:
        - kindness
        - unkind
        - kindly
        - kind-hearted
        answer: kindness
        difficulty: 2
        hints:
        - A noun names a thing or quality.
        - Look for an ending that makes a quality.
        solution: 'Step 1: ''kind'' is an adjective. Step 2: -ness turns it into the quality. Step 3: kindness.'
        mistakes:
          kindly: affix_meaning
          unkind: e1_prefix_suffix
      - prompt: Which is a compound adjective in 'They walked down a tree-lined road'?
        options:
        - tree-lined
        - walked
        - road
        - down
        answer: tree-lined
        difficulty: 1
        hints:
        - It describes the road.
        - Look for the hyphen.
        solution: 'Step 1: The road is described. Step 2: The describing word is two words joined. Step 3: tree-lined.'
        mistakes:
          road: e1_two_words
      - prompt: What does 'dispel' mean in 'to dispel his fears'?
        options:
        - To remove or drive away
        - To increase
        - To write down
        - To hide
        answer: To remove or drive away
        difficulty: 2
        hints:
        - What would a kind word do to fear?
        - The fear goes away.
        solution: 'Step 1: Fears can grow or go. Step 2: Dispel makes them go. Step 3: To remove or drive away.'
        mistakes:
          To increase: glossary_word
