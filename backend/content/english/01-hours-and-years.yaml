# Class 9 English (Kerala Reader), Unit I. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part I text supplied by the school.
subject: eng
chapter: 1
title: "Unit I: Hours and Years"

tips:
  read_the_lines: "Go back to the exact paragraph. The answer is usually stated in the text, not guessed from the title."
  half_a_day_time: "In 'Half a Day' a whole lifetime passes in what seems like half a day: the boy goes to school a child and comes out an old man."
  selma_debts: "Selma Lagerlof's 'debts' are debts of gratitude, not money: to her father, storytellers, nature, readers, friends and the Swedish Academy."
  poem_theme: "'Nothing Twice' says every moment and every person is unique: nothing in life can be repeated or practised."
  tag_rule: "A question tag uses the same helping verb as the statement: a positive statement takes a negative tag (isn't it?), a negative statement takes a positive tag (is there?)."
  tag_special: "Special tags: 'I am ... , aren't I?'; imperatives take 'won't you?'; 'Let's/Let me' takes 'shall I/we?'."
  passive_form: "Passive voice = a form of 'be' + past participle (was challenged, is being thrown, has been played). The tense of 'be' matches the active verb."
  past_tenses: "Simple past (walked) is for a completed action; past continuous (was walking) is for an action in progress in the past."
  affix_meaning: "A prefix (un-, dis-, non-) usually changes the meaning; a suffix (-ful, -able, -ly, -ness) usually changes the word class."
  glossary_word: "Check the glossary meaning: the word is used in a special sense in the lesson."

concepts:
  - code: eng9.u1.half_a_day
    title: Half a Day
    notes: |
      Short story by Naguib Mahfouz (Egypt, first Arab Nobel laureate in Literature, 1988). A small
      boy in new clothes (black shoes, green uniform, red tarboosh) walks to school holding his
      father's hand, unwilling; father says school is "the factory that makes useful people out of
      children". The school looks like a high-walled fortress. A woman tells the children "This is
      your new home". He makes friends, plays, learns songs, language, the globe and numbers, but also
      meets rivalry and punishment. When the bell rings his father is not there; a middle-aged man
      greets him like an old acquaintance; the street of gardens has become high buildings, traffic,
      crowds and refuse. At the crossroads a young lad from the ironing shop says "Grandpa, let me take
      you across." The 'half a day' is really a whole life: childhood, growth, old age and dependence.
    explanations:
      text: "Mahfouz squeezes a whole life into one school day. The boy holds his father's hand in the morning; by evening the world has changed, he is old, and a boy holds his hand to help him cross the road. The story is about how quickly time passes and how the world changes around us."
      visual: "Draw three boxes in a row: Morning (child, father's hand, gardens), Day at school (friends, games, learning, rivalry), Evening (old man, tall buildings, traffic, a boy's hand)."
      step_by_step: "Why is the title 'Half a Day'? Step 1: The story starts in the morning and ends at sunset. Step 2: But the narrator ends as a 'Grandpa'. Step 3: So the half day stands for a whole lifetime passing quickly."
      real_world: "Ask a grandparent how your town looked when they first went to school. The changes they describe are like the changes the narrator sees on his way home."
    items:
      - prompt: "In 'Half a Day', what does the father call school?"
        options: ["The factory that makes useful people out of children", "A punishment for naughty boys", "A fortress for soldiers", "A place to play all day"]
        answer: "The factory that makes useful people out of children"
        difficulty: 1
        hints: ["The boy thought school was a punishment; the father disagreed."]
        solution: "The father laughs and says school is not a punishment but 'the factory that makes useful people out of children'."
        mistakes: {"A punishment for naughty boys": read_the_lines}
      - prompt: "How did the school building look to the boy from a distance?"
        options: ["Like a huge, high-walled fortress, stern and grim", "Like a colourful toy shop", "Like his own home", "Like a garden full of flowers"]
        answer: "Like a huge, high-walled fortress, stern and grim"
        difficulty: 1
        hints: ["He did not want to go there."]
        solution: "The boy saw the school as a stern, grim, high-walled fortress."
        mistakes: {"Like his own home": read_the_lines}
      - prompt: "Who helps the narrator cross the road at the end of the story?"
        options: ["A young lad from the ironing shop", "His father", "The woman from the school", "A policeman"]
        answer: "A young lad from the ironing shop"
        difficulty: 1
        hints: ["He calls the narrator 'Grandpa'."]
        solution: "The young lad employed at the ironing shop on the corner offers, 'Grandpa, let me take you across.'"
        mistakes: {"His father": half_a_day_time}
      - prompt: "Why does the boy address the narrator as 'Grandpa'?"
        options: ["The narrator has grown old", "The narrator is his real grandfather", "It is a joke", "The narrator asked to be called so"]
        answer: "The narrator has grown old"
        difficulty: 2
        hints: ["Think about how much time has really passed."]
        solution: "Though it seems half a day, a lifetime has passed; the narrator is now an old man."
        mistakes: {"The narrator is his real grandfather": half_a_day_time, "It is a joke": half_a_day_time}
      - prompt: "Which change shows that the narrator's surroundings have changed when he comes out of school?"
        options: ["The street lined with gardens is now full of high buildings, vehicles and crowds", "The school gate is painted a new colour", "His father has bought a new car", "It has started to rain"]
        answer: "The street lined with gardens is now full of high buildings, vehicles and crowds"
        difficulty: 2
        hints: ["Compare the morning street and the evening street."]
        solution: "The gardens and fields are gone; tall buildings, traffic, crowds and hills of refuse have taken over."
        mistakes: {"It has started to rain": read_the_lines}
      - prompt: "What is the main idea of 'Half a Day'?"
        options: ["Life passes very quickly and the world keeps changing", "School is always fun", "Fathers should not leave children at school", "Cities are better than villages"]
        answer: "Life passes very quickly and the world keeps changing"
        difficulty: 2
        hints: ["The narrator goes from childhood to old age."]
        solution: "The story uses one 'half day' to show the speed of life and of social change."
        mistakes: {"School is always fun": half_a_day_time}
      - prompt: "At the start the boy holds his father's hand; at the end a boy holds his hand. What does this show?"
        options: ["Life begins and ends in dependence on others", "He has become a teacher", "He never grew up", "Children should always hold hands"]
        answer: "Life begins and ends in dependence on others"
        difficulty: 3
        hints: ["Think of childhood and old age."]
        solution: "The two hand-holding scenes frame life: we depend on others as children and again as old people."
        mistakes: {"He never grew up": half_a_day_time}

  - code: eng9.u1.debts_of_gratitude
    title: Debts of Gratitude
    after: [eng9.u1.half_a_day]
    notes: |
      Selma Lagerlof's Nobel banquet speech (1909); she was the first woman to win the Nobel Prize in
      Literature. On the train to Stockholm she is sad that her father is no longer alive to hear the
      news. She daydreams of meeting him in Paradise on a veranda in a rocking chair, and says she has
      come for advice because she is "very heavily in debt" — not money but gratitude: to her father
      for piano, Bellman's songs, Tegner, Runeberg and Andersen; to vagabonds and old storytellers; to
      nature; to readers (for praise and censure); to her friend Esselde; and finally to the Swedish
      Academy for trusting her before the whole world. Her father, in tears of joy, says he is too happy
      to worry. She ends by proposing a toast to the Swedish Academy.
    explanations:
      text: "Selma turns a thank-you speech into a story. Instead of listing people to thank, she imagines asking her late father how to pay her 'debts'. Each debt is someone or something that shaped her: songs, stories, nature, readers, friends. The biggest debt is the Nobel Prize itself."
      visual: "Draw Selma in the centre with arrows coming in from: Father (songs, books), Storytellers and vagabonds, Nature, Readers, Esselde, Swedish Academy. Label the arrows 'debts of gratitude'."
      step_by_step: "Why is Selma thankful even to critics? Step 1: She says she owes readers 'both for their praise and for their censure'. Step 2: Censure means criticism. Step 3: Criticism helped her improve, so she is grateful for it too."
      real_world: "When you win a prize, the people who taught you, encouraged you and even corrected you share in it. A thank-you speech is a way of 'repaying' them."
    items:
      - prompt: "Where was Selma Lagerlof travelling to at the start of the speech?"
        options: ["Stockholm", "Paris", "Cairo", "London"]
        answer: "Stockholm"
        difficulty: 1
        hints: ["She was going to receive the Nobel Prize."]
        solution: "She was on the train to Stockholm to receive the Prize in Literature."
        mistakes: {"Paris": read_the_lines}
      - prompt: "Why did Selma feel a deep sorrow on the train?"
        options: ["Her father was no longer alive to hear about her prize", "She had failed an examination", "She had lost her ticket", "Her mother was ill"]
        answer: "Her father was no longer alive to hear about her prize"
        difficulty: 1
        hints: ["Who would have been happiest to hear the news?"]
        solution: "She could not tell her father, who would have been happier than anyone."
        mistakes: {"Her mother was ill": read_the_lines}
      - prompt: "What kind of 'debt' does Selma talk about with her father?"
        options: ["A debt of gratitude", "A bank loan", "Unpaid taxes", "Money borrowed from friends"]
        answer: "A debt of gratitude"
        difficulty: 1
        hints: ["Her father says the place has everything except money, but she says it is not money she owes."]
        solution: "She owes thanks to everyone and everything that helped her become a writer."
        mistakes: {"A bank loan": selma_debts, "Money borrowed from friends": selma_debts}
      - prompt: "Why is Selma grateful even to those who criticised her?"
        options: ["Criticism helped her grow as a writer", "She wanted to make fun of them", "They bought many of her books", "They gave her the prize"]
        answer: "Criticism helped her grow as a writer"
        difficulty: 2
        hints: ["'both for their praise and for their censure'"]
        solution: "Censure (criticism) showed her what to improve, so she counts it as a debt too."
        mistakes: {"They gave her the prize": selma_debts}
      - prompt: "What, according to Selma, was her 'biggest debt'?"
        options: ["The trust the Swedish Academy showed by giving her the Nobel Prize", "Money she owed her publisher", "Her debt to the train company", "Her debt to her brothers"]
        answer: "The trust the Swedish Academy showed by giving her the Nobel Prize"
        difficulty: 2
        hints: ["It made her father cry with joy."]
        solution: "The Academy had trust enough in her 'to single me out before the whole world'."
        mistakes: {"Money she owed her publisher": selma_debts}
      - prompt: "Who was Esselde?"
        options: ["A faithful friend who opened doors for her when no one believed in her", "Her father", "A troll in a story", "A member of the royal family"]
        answer: "A faithful friend who opened doors for her when no one believed in her"
        difficulty: 2
        hints: ["Paragraph 12."]
        solution: "Esselde was her faithful friend who supported her early."
        mistakes: {"Her father": read_the_lines}
      - prompt: "How does Selma end her speech?"
        options: ["She proposes a toast to the Swedish Academy", "She sings one of Bellman's songs", "She reads a poem by Andersen", "She thanks the train driver"]
        answer: "She proposes a toast to the Swedish Academy"
        difficulty: 3
        hints: ["'Your Majesties, Your Royal Highnesses, Ladies and Gentlemen...'"]
        solution: "Having no better answer, she asks everyone to join her in a toast to the Swedish Academy."
        mistakes: {"She sings one of Bellman's songs": read_the_lines}

  - code: eng9.u1.nothing_twice
    title: Nothing Twice (Poem)
    after: [eng9.u1.half_a_day]
    notes: |
      Poem by Wislawa Szymborska (Polish, Nobel Prize 1996). "Nothing can ever happen twice": we arrive
      in life "improvised" and leave without practice. Even the planet's biggest dunce cannot "repeat the
      class in summer": "this course is only offered once" (life). No day copies yesterday; no two nights
      or kisses are the same. Hearing a loved one's name feels like a rose flung into the room, "all hue
      and scent"; the next day the speaker watches the clock. "Why do we treat the fleeting day / with so
      much needless fear and sorrow? ... Today is always gone tomorrow." People are as different as two
      drops of water. Images: visual (rose), auditory (idle tongue mentions your name), olfactory
      (scent), tactile (kisses), kinaesthetic (fleeting day).
    explanations:
      text: "The poet compares life to a course offered only once: there are no rehearsals and no repeat exams. Every day, every kiss, every person is unique, so we should not waste days in needless fear and sorrow, because today is always gone tomorrow."
      visual: "Draw a calendar where every page has a different picture, none repeated, and under it write: 'No day copies yesterday.'"
      step_by_step: "What does 'this course is only offered once' mean? Step 1: A course is like a class at school. Step 2: Here the 'course' is life. Step 3: We live it only once, so we cannot repeat it like a failed exam."
      real_world: "A cricket match, a festival or a friend's birthday party never happens exactly the same way again. Enjoying the moment is the poem's advice."
    items:
      - prompt: "Who wrote 'Nothing Twice'?"
        options: ["Wislawa Szymborska", "Selma Lagerlof", "Naguib Mahfouz", "T. S. Eliot"]
        answer: "Wislawa Szymborska"
        difficulty: 1
        hints: ["A Polish poet who won the Nobel Prize in 1996."]
        solution: "The poem is by Wislawa Szymborska."
        mistakes: {"Selma Lagerlof": read_the_lines}
      - prompt: "In the poem, what is the 'course' that is 'only offered once'?"
        options: ["Life", "A summer class", "A cooking course", "A journey by sea"]
        answer: "Life"
        difficulty: 1
        hints: ["Even the biggest dunce can't repeat it."]
        solution: "The 'course' is life, which we live only once."
        mistakes: {"A summer class": poem_theme}
      - prompt: "What does the poet feel when someone mentions 'your name' by accident?"
        options: ["As if a rose were flung into the room", "As if a storm had started", "As if the clock had stopped", "As if a rock had fallen"]
        answer: "As if a rose were flung into the room"
        difficulty: 2
        hints: ["'all hue and scent'"]
        solution: "The name brings sudden beauty and joy, like a rose 'all hue and scent'."
      - prompt: "What does the line 'Today is always gone tomorrow' tell us about time?"
        options: ["Time keeps moving and every day passes for ever", "Tomorrow never comes", "We should sleep more", "Days repeat themselves"]
        answer: "Time keeps moving and every day passes for ever"
        difficulty: 2
        hints: ["It is in the nature of the day 'not to stay'."]
        solution: "Each day is fleeting; once gone, it does not return."
        mistakes: {"Days repeat themselves": poem_theme}
      - prompt: "The word 'scent' in the poem appeals to which sense?"
        options: ["Smell (olfactory)", "Sight (visual)", "Hearing (auditory)", "Touch (tactile)"]
        answer: "Smell (olfactory)"
        difficulty: 2
        hints: ["Scent is a smell."]
        solution: "Scent is an olfactory image."
      - prompt: "'although we're different ... just as two drops of water are.' What does this comparison suggest?"
        options: ["Even people who seem alike are unique", "All people are exactly the same", "Water is more important than people", "People should not argue"]
        answer: "Even people who seem alike are unique"
        difficulty: 3
        hints: ["Two drops of water look identical, yet each is separate."]
        solution: "Like two drops of water, people may look alike but each is individual and unique."
        mistakes: {"All people are exactly the same": poem_theme}

  - code: eng9.u1.grammar
    title: "Grammar: question tags, passive voice and past tenses"
    after: [eng9.u1.half_a_day]
    notes: |
      Question tags seek confirmation: same auxiliary as the statement, opposite polarity, pronoun
      subject (This is your new home, isn't it? There is nothing amiss, is there? My mother stood at
      the window, didn't she? I am in debt, aren't I? Be a man, won't you? Let me take you across,
      shall I?). Passive voice puts the action first: be + past participle (I challenged my father →
      My father was challenged by me; The men were sorting us → We were being sorted by the men).
      Simple past for completed actions (They walked); past continuous was/were + -ing for actions in
      progress (The boy was walking). A sentence has a noun phrase (subject) and a verb phrase.
    explanations:
      text: "A question tag is a mini-question at the end of a sentence. Copy the helping verb, flip positive to negative, and use a pronoun: 'Father has lowered his head, hasn't he?' In the passive voice, the doer goes to the end or disappears: 'The software was installed.'"
      visual: "Draw a seesaw: on one end 'positive statement', on the other 'negative tag'. If one side goes up, the other goes down."
      step_by_step: "Add a tag to 'All my clothes were new'. Step 1: Helping verb: were. Step 2: Statement is positive, so tag is negative: weren't. Step 3: Pronoun for 'all my clothes': they. Answer: weren't they?"
      real_world: "News reports and notices use the passive a lot: 'The bill was passed', 'Visitors are requested to remove footwear.'"
    items:
      - prompt: "Choose the correct tag: 'This is your new home, ___?'"
        options: ["isn't it", "is it", "doesn't it", "wasn't it"]
        answer: "isn't it"
        difficulty: 1
        hints: ["Positive statement with 'is'."]
        solution: "Positive 'is' → negative tag 'isn't it?'"
        mistakes: {"is it": tag_rule, "doesn't it": tag_rule}
      - prompt: "Choose the correct tag: 'There is nothing amiss, ___?'"
        options: ["is there", "isn't there", "isn't it", "is it"]
        answer: "is there"
        difficulty: 2
        hints: ["'Nothing' makes the statement negative."]
        solution: "A negative statement (nothing) takes a positive tag: is there?"
        mistakes: {"isn't there": tag_rule}
      - prompt: "Choose the correct tag: 'I am in debt, ___?'"
        options: ["aren't I", "amn't I", "isn't I", "don't I"]
        answer: "aren't I"
        difficulty: 2
        hints: ["A special case."]
        solution: "'I am' takes the tag 'aren't I?'"
        mistakes: {"amn't I": tag_special, "isn't I": tag_special}
      - prompt: "Choose the correct tag: 'Let me take you across, ___?'"
        options: ["shall I", "won't you", "don't I", "will I"]
        answer: "shall I"
        difficulty: 3
        hints: ["An offer with 'Let me'."]
        solution: "'Let me...' takes 'shall I?'"
        mistakes: {"won't you": tag_special}
      - prompt: "Change to passive voice: 'I challenged my father openly.'"
        options: ["My father was openly challenged by me.", "My father is openly challenged by me.", "My father challenged me openly.", "My father has been challenged by me."]
        answer: "My father was openly challenged by me."
        difficulty: 1
        hints: ["Simple past → was/were + past participle."]
        solution: "Simple past 'challenged' → 'was challenged'."
        mistakes: {"My father is openly challenged by me.": passive_form, "My father challenged me openly.": passive_form}
      - prompt: "Change to passive voice: 'The men were sorting us.'"
        options: ["We were being sorted by the men.", "We were sorted by the men.", "We are sorted by the men.", "The men were sorted by us."]
        answer: "We were being sorted by the men."
        difficulty: 2
        hints: ["Past continuous → was/were being + past participle."]
        solution: "'were sorting' → 'were being sorted'."
        mistakes: {"We were sorted by the men.": passive_form, "The men were sorted by us.": passive_form}
      - prompt: "Which sentence is in the past continuous tense?"
        options: ["The boy was walking to school with his father.", "They walked through a street lined with gardens.", "The boy walks to school.", "The boy has walked to school."]
        answer: "The boy was walking to school with his father."
        difficulty: 1
        hints: ["was/were + -ing."]
        solution: "'was walking' shows an action in progress in the past."
        mistakes: {"They walked through a street lined with gardens.": past_tenses}

  - code: eng9.u1.words
    title: "Words: affixes, compound adjectives and the glossary"
    after: [eng9.u1.half_a_day]
    notes: |
      Glossary words: misgivings (doubts), crammed (filled), contentment (happiness and satisfaction),
      scowl (angry look), grim (severe), throngs/hordes (crowds), fleeting (lasting a short time),
      dunce (slow learner), censure (criticism), vagabond (wanderer), dispel (eliminate), perseverance.
      Compound adjectives: two or more words describing a noun, e.g. dust-laden, high-walled,
      soft-spoken, kind-hearted, tree-lined, double-storeyed. Affixation: prefix (un-, dis-, non-, sub-)
      at the start, suffix (-ful, -able, -ly, -ness, -ible) at the end; unbearable, enjoyable,
      extremely, fearful. Adjectives describe nouns (wondrous joy).
    explanations:
      text: "You can build new words like Lego. Add 'un-' to the front of 'bearable' and the meaning flips. Add '-ful' to 'fear' and a noun becomes an adjective. Join 'dust' and 'laden' with a hyphen and you get a compound adjective: dust-laden winds."
      visual: "Draw a word in a box with an empty box on each side. Left box: prefix (changes meaning). Right box: suffix (changes the kind of word)."
      step_by_step: "Make the opposite of 'agree'. Step 1: We want the meaning reversed. Step 2: 'dis-' is a prefix meaning not. Step 3: disagree."
      real_world: "Advertisements love compound adjectives: 'sugar-free', 'long-lasting', 'eco-friendly'."
    items:
      - prompt: "What does 'misgivings' mean?"
        options: ["Doubts", "Gifts", "Mistakes", "Crowds"]
        answer: "Doubts"
        difficulty: 1
        hints: ["'Then it seemed to me my misgivings had had no basis.'"]
        solution: "Misgivings are doubts or apprehensions."
        mistakes: {"Mistakes": glossary_word}
      - prompt: "What does 'fleeting' mean in 'the fleeting day'?"
        options: ["Lasting for a very short time", "Flying like a bird", "Very long and boring", "Full of ships"]
        answer: "Lasting for a very short time"
        difficulty: 1
        hints: ["The day does not stay."]
        solution: "Fleeting means lasting a very short time."
        mistakes: {"Full of ships": glossary_word}
      - prompt: "Which is a compound adjective?"
        options: ["dust-laden", "dust", "quickly", "unhappy"]
        answer: "dust-laden"
        difficulty: 2
        hints: ["Two words joined to describe a noun."]
        solution: "'Dust-laden' (winds) joins two words to describe a noun."
      - prompt: "Which prefix makes the opposite of 'existent'?"
        options: ["non-", "sub-", "-ness", "-ful"]
        answer: "non-"
        difficulty: 2
        hints: ["A prefix goes at the beginning."]
        solution: "non- + existent = non-existent."
        mistakes: {"-ness": affix_meaning, "-ful": affix_meaning}
      - prompt: "In 'unbearable', what are the affixes?"
        options: ["Prefix un- and suffix -able", "Prefix bear- and suffix -un", "Only the suffix -able", "Only the prefix un-"]
        answer: "Prefix un- and suffix -able"
        difficulty: 2
        hints: ["Find the root word first: bear."]
        solution: "un- + bear + -able."
        mistakes: {"Only the suffix -able": affix_meaning}
      - prompt: "What does 'censure' mean in 'both for their praise and for their censure'?"
        options: ["Criticism", "Census", "Praise", "Censorship of films"]
        answer: "Criticism"
        difficulty: 3
        hints: ["It is the opposite of praise here."]
        solution: "Censure means criticism."
        mistakes: {"Praise": glossary_word, "Censorship of films": glossary_word}
