# Class 9 English (Kerala Reader), Unit III. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part I text supplied by the school.
# Also uses tips from earlier units: read_the_lines, glossary_word, phrasal_verb.
subject: eng
chapter: 3
title: "Unit III: Aspire and Explore"

tips:
  sea_sounds: "List what the sailor names: the wheel's kick, the wind's song, the sail shaking. Which senses do these appeal to?"
  zero_error: "The dabbawalas' fame rests on a system where almost nothing goes wrong. What makes each delivery reach the right desk?"
  dabba_trip: "Each dabbawala carries the boxes there at lunch and back again in the afternoon. Count both trips."
  rain_and_land: "The author loves the monsoon and fears losing what it gives. What happens to rain that falls on concrete?"
  extra_info: "Commas around a relative clause mean the information is extra: the sentence still makes sense without it."
  advice_or_order: "Is the speaker telling, warning, asking politely or suggesting what is good for the listener? Look for words like 'should' or 'please'."
  sound_alike: "Read the sentence for meaning. Which spelling fits what the sentence is about?"
  echo_sounds: "An onomatopoeic word sounds like the noise it names. Say each word aloud."
  sea_fever_device: "A comparison that uses 'like' or 'as' has one name; a comparison that says one thing *is* another has a different name."
  dabbawala_facts: "The service began in the late 19th century. Add the numbers from both railway lines for the total. Each tiffin has colour-and-letter codes, not technology. For trays, divide the tiffins by how many fit in one."
  monsoon_mood: "In 'Waiting for Rain' the author is happy about turbulence because wind currents mean the monsoon is near."
  relative_clause: "A defining relative clause is needed to know who/what is meant (no commas); a non-defining one adds extra information between commas and can be removed."
  reported_command: "An imperative is reported with a verb like told/asked/requested/advised/ordered + object + to-infinitive: 'Wear your cap' → He instructed him to wear his cap."
  homophone: "Homophones sound the same but are spelled differently and mean different things. Ask what the sentence means (the sky, or an animal in the wild) and pick the spelling with that meaning."
  onomatopoeia: "Onomatopoeic words sound like the noise they name (buzz, crash). Writing words from another language in English letters has a different name, about changing script."
  anaphora_longing: "A line repeated at the start of each stanza (anaphora) stresses a feeling: here, his pull towards the sea."
  concrete_water: "Concrete and tiles stop rain soaking into the ground, so the water table falls and water has to be bought."
  dabbawala_rules: "The dabbawalas' rules are strict because the system depends on timing and discipline: a second slip means removal."
  imperative_function: "'Mind the gap' tells people to be careful of a danger. Is that a request, advice, or something stronger that alerts you?"
  kaati_kooti: "'Kaati-kooti poova' is the uncle's complaint that the monsoon showed off clouds and thunder and then didn't come."
  karkitakam: "The Malayalam month that begins in mid-July is the wettest, hardest month, just before the month that brings Onam."
  preposition_near: "The sentence is about living close to the city, not at an exact address. Which preposition means 'close to'?"
  prodigal_monsoon: "The prodigal son is someone who comes home after a long absence. In this essay, what has been away and finally returns?"
  rain_question: "She was far away and longing for the monsoon at home, so her daily question was about the rain."
  relative_pronoun: "A relative pronoun (who, which, that) joins a clause that describes a noun. Find the word that starts 'was happy with the turbulence'."
  sea_fever_ask: "The sailor asks for very little in the first stanza: a ship and something in the night sky to guide it. Re-read the opening lines."
  sea_fever_end: "The 'long trick' is a long turn at the wheel. After it, he wants 'a quiet sleep and a sweet dream'."
  sea_fever_weather: "He loves the open sea in motion: 'a windy day with the white clouds flying'."
  e3_sailor_wants: 'Read what the sailor asks for: he wants very little, only the simple things a sailor needs at sea.'
  e3_like_or_as: A simile compares using 'like' or 'as'; a metaphor says one thing is another. Look for the comparing word.
  e3_same_start: Repeating the same words at the start of lines is one device; repeating the first consonant sound in nearby words is another.
  e3_poet_facts: "A Poet Laureate is the official poet of one country. Masefield held the post in the land of Shakespeare and Wordsworth; Longfellow was the American poet."
  e3_dabba_timeline: 'Follow the day: pick-up in the morning, lunch delivered, boxes collected, empties home in the evening.'
  e3_dabba_rules: The dabbawalas give one chance and then act. Count the times in the question.
  e3_dabba_numbers: Add, multiply or divide using the numbers from the article. Check which one the question asks.
  e3_rain_meaning: For Anita Nair, every sign of wind and cloud means one hoped-for thing. What is she waiting for?
  e3_uncle_words: The uncle compares the monsoon to a rich relative whose visit disappoints. What did the clouds do?
  e3_clause_commas: If the clause can be lifted out and the sentence still names the same person, it is extra information and sits between commas.
  e3_who_which: "Look at the noun just before the gap: is it a person, a thing, or a place? Each kind takes its own relative word."
  e3_report_order: 'A reported order or request becomes: told/asked + person + to (or not to) + verb.'
  e3_say_it_aloud: Say the word aloud. Does it copy a sound?
  e3_spell_meaning: Both words sound the same. Which spelling has the meaning the sentence needs?

concepts:
  - code: eng9.u3.sea_fever
    title: Sea-Fever (Poem)
    notes: |
      Poem by John Masefield (Poet Laureate of Britain 1930–1967). The speaker, a sailor, keeps saying "I
      must go down to the seas again". He asks only for a tall ship and a star to steer her by; the
      wheel's kick, the wind's song, the white sail's shaking, grey mist and grey dawn; a windy day with
      white clouds flying, flung spray, blown spume and crying sea-gulls; "the call of the running tide /
      Is a wild call and a clear call that may not be denied"; the vagrant gypsy life, the gull's way and
      the whale's way "where the wind's like a whetted knife"; a merry yarn from a laughing fellow-rover
      and quiet sleep and a sweet dream when the long trick (turn at the wheel) is over. Devices:
      repetition/anaphora ("I must go down to the seas again", "And all I ask"), alliteration (sea and
      sky, wild call, whale's way, whetted), simile (wind like a whetted knife), imagery.
    explanations:
      text: "The sailor cannot resist the sea: it calls him like a fever. He wants only simple things — a ship, a star, wind and spray — and at the end a cheerful story from a fellow sailor and peaceful sleep. The repeated line 'I must go down to the seas again' shows how strong his longing is."
      visual: "Draw a tall sailing ship at dawn: grey mist, white sails shaking, gulls crying, spray flying, and one bright star above. Label each with the line from the poem."
      step_by_step: "Why is the wind 'like a whetted knife'? Step 1: Whetted means sharpened. Step 2: A sharp knife cuts. Step 3: The cold sea wind feels sharp and cutting on the skin."
      real_world: "Fishermen from Kerala's coast who spend days at sea often describe the same pull of the ocean and the comfort of stories shared with fellow crew."
    activity:
      type: sort
      prompt: Which poetic device in 'Sea-Fever'?
      bins:
      - Repetition
      - Alliteration
      - Simile
      items:
      - label: '''I must go down to the seas again'' (each stanza)'
        bin: Repetition
        clue: The same line keeps coming back.
        why: Repetition (anaphora).
      - label: '''And all I ask...'' again and again'
        bin: Repetition
        clue: Repeated opening.
        why: Repetition.
      - label: '''wild call and a clear call'''
        bin: Alliteration
        clue: Listen to the starting sounds.
        why: 'Repeated w/c sounds: alliteration.'
      - label: '''the whale''s way'''
        bin: Alliteration
        clue: Same first letter.
        why: Alliteration.
      - label: '''the wind''s like a whetted knife'''
        bin: Simile
        clue: Look for 'like'.
        why: 'A comparison with ''like'': simile.'
    lesson:
      - teach: '''Sea-Fever'' is by John Masefield, Poet Laureate of Britain from 1930 to 1967. A sailor keeps saying ''I must go down to the seas again''. He asks only for simple things: a tall ship and a star to steer her by, the wheel''s kick, the wind''s song, the white sail shaking.'
        check:
          prompt: What does the sailor ask for first?
          options:
          - A tall ship and a star to steer her by
          - Gold and jewels
          - A house by the sea
          answer: A tall ship and a star to steer her by
          why: He wants only what he needs to sail.
        ways:
        - style: real_world
          teach: 'Think of a fisherman from Kerala''s coast who has moved to the city and keeps saying, ''I must go back to the sea.'' John Masefield, Britain''s Poet Laureate from 1930 to 1967, wrote ''Sea-Fever'' about that longing. The sailor asks only for simple things: a tall ship and a star to steer her by, the kick of the wheel, the wind''s song, the white sail shaking.'
      - teach: He longs for windy days, flying clouds, spray, spume and crying gulls; 'the call of the running tide' that 'may not be denied'; the vagrant gypsy life 'where the wind's like a whetted knife'; a merry yarn from a fellow-rover and quiet sleep when 'the long trick's over'.
        check:
          prompt: '''The long trick'' means'
          options:
          - A sailor's turn at the wheel
          - A magic show
          - A long joke
          answer: A sailor's turn at the wheel
          why: On ships, a 'trick' is a spell of duty steering.
        ways:
        - style: step_by_step
          teach: 'List what the sailor longs for, stanza by stanza. Stanza 2: windy days, flying clouds, spray and spume, crying gulls, and ''the call of the running tide'' that ''may not be denied''. Stanza 3: the vagrant gypsy life, ''where the wind''s like a whetted knife'', a merry yarn from a fellow-rover, and quiet sleep when ''the long trick''s over'', his turn at the wheel.'
      - teach: 'Poetic devices: repetition/anaphora (''I must go down to the seas again'' starts every stanza), alliteration (wild call, whale''s way, whetted), simile (wind like a whetted knife), and imagery of sight, sound and touch.'
        picture:
          kind: compare
          columns:
          - title: Anaphora
            points:
            - same words start lines
            - I must go down to the seas again
          - title: Alliteration
            points:
            - same first sound
            - whale's way, whetted
          - title: Simile
            points:
            - compares with like/as
            - wind's like a whetted knife
          alt: Devices in 'Sea-Fever'.
        check:
          prompt: '''wild call and a clear call'' mainly shows'
          options:
          - Repetition
          - Simile
          - Onomatopoeia
          answer: Repetition
          why: The word 'call' is repeated for emphasis.
        ways:
        - style: step_by_step
          teach: 'Spot the devices one at a time. Same line opening every stanza (''I must go down to the seas again''): repetition, or anaphora. Same first sound close together (wild, whale''s way, whetted): alliteration. A comparison with ''like'' (wind like a whetted knife): simile. Things you can see, hear and feel: imagery.'
    items:
      - prompt: "Who wrote 'Sea-Fever'?"
        options: ["John Masefield", "H. W. Longfellow", "Anita Nair", "Rabindranath Tagore"]
        answer: "John Masefield"
        difficulty: 1
        hints: ["Poet Laureate of Britain from 1930 to 1967."]
        solution: "John Masefield wrote 'Sea-Fever'."
        mistakes: {"H. W. Longfellow": "poem_author", "Rabindranath Tagore": "poem_author"}
      - prompt: "What does the speaker ask for in the first stanza?"
        options: ["A tall ship and a star to steer her by", "A big house by the sea", "Gold and silver", "A fast motor boat"]
        answer: "A tall ship and a star to steer her by"
        difficulty: 1
        hints: ["'And all I ask is...'"]
        solution: "'All I ask is a tall ship and a star to steer her by.'"
        mistakes: {"A big house by the sea": "sea_fever_ask", "A fast motor boat": "sea_fever_ask"}
      - prompt: "'the wind's like a whetted knife' is an example of:"
        options: ["Simile", "Metaphor", "Alliteration only", "Onomatopoeia"]
        answer: "Simile"
        difficulty: 2
        hints: ["Look for 'like' or 'as'."]
        solution: "It compares wind and knife using 'like': a simile."
        mistakes: {"Metaphor": sea_fever_device}
      - prompt: "What kind of weather does the sailor prefer for his voyage?"
        options: ["A windy day with white clouds flying", "A calm, still day", "A hot, dry day", "A day with no clouds or wind"]
        answer: "A windy day with white clouds flying"
        difficulty: 2
        hints: ["Second stanza."]
        solution: "He asks for 'a windy day with the white clouds flying'."
        mistakes: {"A calm, still day": "sea_fever_weather", "A day with no clouds or wind": "sea_fever_weather"}
      - prompt: "How does the speaker wish his journey to end?"
        options: ["With quiet sleep and a sweet dream when the long trick is over", "With a big storm", "By buying a new ship", "By never going to sea again"]
        answer: "With quiet sleep and a sweet dream when the long trick is over"
        difficulty: 2
        hints: ["Last line of the poem."]
        solution: "He wants rest and a sweet dream after his long turn at the wheel."
        mistakes: {"With a big storm": "sea_fever_end", "By never going to sea again": "sea_fever_end"}
      - prompt: "Why is the line 'I must go down to the seas again' repeated at the start of every stanza?"
        options: ["To show the sailor's strong, irresistible longing for the sea", "Because the poet forgot the line", "To describe the colour of the sea", "To show the sailor is afraid of the sea"]
        answer: "To show the sailor's strong, irresistible longing for the sea"
        difficulty: 3
        hints: ["Repetition stresses a feeling."]
        solution: "The repetition (anaphora) stresses his deep, constant longing."

        mistakes: {"To show the sailor is afraid of the sea": "anaphora_longing", "To describe the colour of the sea": "anaphora_longing"}
      - prompt: "'the wheel's kick and the wind's song and the white sail's shaking'. Which senses does this line mainly appeal to?"
        options: ["Touch, hearing and sight", "Taste and smell", "Smell only", "Taste, smell and hearing"]
        answer: "Touch, hearing and sight"
        difficulty: 3
        hints: ["How do you notice a wheel's kick?", "How do you notice a song? A shaking sail?"]
        solution: "Step 1: The kick of the wheel is felt (touch). Step 2: The wind's song is heard. Step 3: The shaking white sail is seen."
        mistakes: {"Taste and smell": sea_sounds, "Smell only": sea_sounds, "Taste, smell and hearing": sea_sounds}
      - prompt: "What is the main feeling of 'Sea-Fever'?"
        options: ["A deep, restless longing for life at sea", "Fear of drowning", "Boredom with sailing", "Anger at the sea"]
        answer: "A deep, restless longing for life at sea"
        difficulty: 2
        hints: ["What does the title 'fever' suggest?", "What line does every stanza begin with?"]
        solution: "Step 1: 'Fever' suggests a strong, burning desire. Step 2: 'I must go down to the seas again' shows his longing to return to the sea."
        mistakes: {"Fear of drowning": anaphora_longing, "Boredom with sailing": anaphora_longing, "Anger at the sea": anaphora_longing}
      - prompt: John Masefield was the Poet Laureate of which country?
        options:
        - Britain
        - America
        - India
        - Poland
        answer: Britain
        difficulty: 1
        hints:
        - He held the post from 1930 to 1967.
        - Longfellow was the American poet.
        solution: 'Step 1: A Poet Laureate is a national poet. Step 2: Masefield held it in 1930–1967. Step 3: Britain.'
        mistakes:
          America: e3_poet_facts
      - prompt: Which line uses alliteration?
        options:
        - To the gull's way and the whale's way
        - And all I ask is a tall ship
        - I must go down to the seas again
        - When the long trick's over
        answer: To the gull's way and the whale's way
        difficulty: 2
        hints:
        - Look for the same first sound repeated close together.
        - Listen for the w sound.
        solution: 'Step 1: Alliteration repeats first consonant sounds. Step 2: ''whale''s way'' repeats w. Step 3: That line.'
        mistakes:
          I must go down to the seas again: e3_same_start
      - prompt: What does the sailor want from 'a laughing fellow-rover'?
        options:
        - A merry yarn
        - Money
        - A new ship
        - Directions home
        answer: A merry yarn
        difficulty: 2
        hints:
        - A yarn is a long story.
        - Fellow sailors share these on long voyages.
        solution: 'Step 1: Fellow-rover = another sailor. Step 2: Sailors tell stories. Step 3: A merry yarn.'
        mistakes:
          Money: e3_sailor_wants
      - prompt: In 'the call of the running tide ... may not be denied', the sea is shown as
        options:
        - Calling to the sailor and impossible to refuse
        - Silent and calm
        - Dangerous and hateful
        - Far away and forgotten
        answer: Calling to the sailor and impossible to refuse
        difficulty: 3
        hints:
        - Can a tide really call?
        - '''May not be denied'' means it cannot be refused.'
        solution: 'Step 1: The tide is given a voice (personification). Step 2: Its call cannot be refused. Step 3: The sea pulls him back.'
        mistakes:
          Dangerous and hateful: sea_fever_ask
      - prompt: '''Spume'' in ''the blown spume'' means'
        options:
        - Foam on the waves
        - A kind of fish
        - A sail
        - A star
        answer: Foam on the waves
        difficulty: 2
        hints:
        - It is blown by the wind on a stormy day.
        - It is white and comes with spray.
        solution: 'Step 1: Spray and spume go together. Step 2: Wind blows froth off waves. Step 3: Foam.'
        mistakes:
          A kind of fish: e3_spell_meaning
      - prompt: Why does the poet call his longing a 'fever'?
        options:
        - It is a strong, restless urge he cannot shake off
        - He is ill with malaria
        - The sea is hot
        - He hates the sea
        answer: It is a strong, restless urge he cannot shake off
        difficulty: 3
        hints:
        - A fever takes hold of the whole body.
        - How does the sailor feel about the sea?
        solution: 'Step 1: A fever is hard to control. Step 2: His longing grips him in the same way. Step 3: A strong, restless urge.'
        mistakes:
          He hates the sea: sea_fever_end
      - prompt: '''The wheel''s kick'' appeals mainly to the sense of'
        options:
        - Touch
        - Smell
        - Taste
        - Hearing
        answer: Touch
        difficulty: 2
        hints:
        - The sailor holds the ship's wheel.
        - He feels it jerk in his hands.
        solution: 'Step 1: Hands grip the wheel. Step 2: The kick is felt. Step 3: Touch.'
        mistakes:
          Smell: sea_fever_device
  - code: eng9.u3.tiffin_carriers
    title: The Saga of the Tiffin Carriers
    after: [eng9.u3.sea_fever]
    notes: |
      Article by Hugh and Colleen Gantzer about Mumbai's dabbawalas. Mumbai workers live far from offices
      (skyrocketing land prices), eat varied diets and cannot afford downtown meals, so hot home-cooked
      lunches are delivered. Began in 1890 when an old Parsi lady in Dadar asked Mahadu Iwhaji Bacha to
      carry a tiffin to her husband. Now about 3,500 dabbawalas on the Western Railway and 1,500 on the
      Central Railway; two lakh customers; pick up from 8 a.m., deliver by 1 p.m., collect by 2 p.m.,
      return empty boxes by 5.30 p.m.; about Rs 500 per month. One chance for late customers, then
      removal. A tray holds 40–45 tiffins and weighs 85–100 kg; five changing points; alpha-numerical
      codes on every carrier. Strict training, courtesy, no drinking, white caps (fined, then removed).
      Admired by business schools and Prince (now King) Charles; Bikaji, 74, has worked 50 years. E. L.
      Paulo: "In all these ten years they have never missed."
    explanations:
      text: "Every working day, about 5,000 dabbawalas carry around two lakh home-cooked lunches across Mumbai by train, cart and bicycle and bring the empty boxes back — almost never making a mistake. Simple codes painted on each box, strict timing and discipline make it work."
      visual: "Draw the route as a chain: home (8 a.m. pick-up) → local station → changing points (sorted by code) → office (by 1 p.m.) → collected (2 p.m.) → home again (by 5.30 p.m.)."
      step_by_step: "How many dabbawalas are there? Step 1: 3,500 on the Western Railway. Step 2: 1,500 on the Central Railway. Step 3: 3,500 + 1,500 = 5,000."
      real_world: "Management schools around the world study the dabbawalas as an example of a simple, reliable supply chain run without computers."
    activity:
      type: number_line
      min: 6
      max: 20
      step: 1
      start: 6
      prompt: The dabbawalas' day. Mark the hour (24-hour clock).
      goals:
      - prompt: Pick-ups start at
        target: 8
        mistakes:
        - when:
            v: 13
          say: 1 p.m. is when lunch must reach the office. Pick-ups start in the morning.
      - prompt: Lunch delivered by
        target: 13
        mistakes:
        - when:
            v: 14
          say: 2 p.m. is when they collect the empty boxes. Delivery is by 1 p.m.
      - prompt: Empty boxes collected by
        target: 14
        mistakes:
        - when:
            v: 13
          say: 1 p.m. is delivery. Collection is an hour later.
      - prompt: Empty boxes home by about (5.30 p.m. — mark the hour)
        target: 17
        mistakes:
        - when:
            v: 14
          say: That's collection. Boxes are home by 5.30 p.m.
    lesson:
      - teach: '''The Saga of the Tiffin Carriers'' by Hugh and Colleen Gantzer is about Mumbai''s dabbawalas. Workers live far from offices and want hot home food they can afford, so dabbawalas carry lunch boxes from homes to offices. It began in 1890, when a Parsi lady in Dadar asked Mahadu Iwhaji Bacha to carry a tiffin to her husband.'
        check:
          prompt: Why do Mumbai workers use dabbawalas?
          options:
          - They want affordable hot home food at work
          - They cannot cook
          - Offices ban lunch
          answer: They want affordable hot home food at work
          why: Homes are far away and eating out is costly.
        ways:
        - style: step_by_step
          teach: 'See why dabbawalas exist. Step 1: Mumbai workers live far from their offices. Step 2: they want hot home food they can afford. Step 3: so dabbawalas carry lunch boxes from homes to offices. It began in 1890, when a Parsi lady in Dadar asked Mahadu Iwhaji Bacha to take a tiffin to her husband. Hugh and Colleen Gantzer tell the story in ''The Saga of the Tiffin Carriers''.'
      - teach: About 5,000 dabbawalas serve two lakh customers. Boxes are picked up from 8 a.m., delivered by 1 p.m., collected by 2 p.m. and back home by 5.30 p.m. Each carrier has alpha-numerical codes. A tray holds 40–45 tiffins and weighs 85–100 kg.
        picture:
          kind: flow
          steps:
          - '8 a.m.: pick up'
          - '1 p.m.: deliver'
          - '2 p.m.: collect empties'
          - '5.30 p.m.: back home'
          alt: The dabbawala's day.
        check:
          prompt: How do dabbawalas know where each box goes?
          options:
          - Codes painted on each carrier
          - They read the food
          - Phone calls
          answer: Codes painted on each carrier
          why: Alpha-numerical markings show the route.
        ways:
        - style: visual
          teach: Follow one tiffin through its day. Picked up from homes from 8 a.m., delivered to offices by 1 p.m., collected by 2 p.m., back home by 5.30 p.m. About 5,000 dabbawalas serve two lakh customers. A tray carries 40-45 tiffins and weighs 85-100 kg, and alpha-numerical codes on each carrier say where it goes.
          picture:
            kind: flow
            alt: 'Tiffin day: picked up from 8 a.m., delivered by 1 p.m., collected by 2 p.m., home by 5.30 p.m.'
            steps:
            - Picked up from 8 a.m.
            - Delivered by 1 p.m.
            - Collected by 2 p.m.
            - Back home by 5.30 p.m.
      - teach: 'Discipline is strict: late customers get one chance, then are dropped; no drinking; white caps must be worn (fine first, then removal). Business schools and Prince (now King) Charles admired them. A customer said: ''In all these ten years they have never missed.'''
        check:
          prompt: What makes the system so reliable?
          options:
          - Codes, strict timing and discipline
          - Computers
          - Luck
          answer: Codes, strict timing and discipline
          why: Simple codes plus strict rules keep mistakes rare.
        ways:
        - style: real_world
          teach: 'Think of a school bus that never once comes late: strict rules make it reliable. Dabbawalas run the same way. A late customer gets one chance, then is dropped. No drinking. White caps must be worn: a fine first, then removal. Business schools and Prince (now King) Charles admired them, and a customer said, ''In all these ten years they have never missed.'''
    items:
      - prompt: "In which year did the dabbawala service begin?"
        answer: "1890"
        check: "1890"
        difficulty: 1
        hints: ["An old Parsi lady in Dadar."]
        solution: "It began in 1890."
        mistakes: {"1990": dabbawala_facts}
      - prompt: "There are 3,500 dabbawalas on the Western Railway and 1,500 on the Central Railway. How many in all?"
        answer: "5000"
        check: "3500 + 1500"
        difficulty: 1
        hints: ["Add them."]
        solution: "3,500 + 1,500 = 5,000"
        mistakes: {"2000": dabbawala_facts}
      - prompt: "How do the dabbawalas know which tiffin carrier goes where?"
        options: ["Alpha-numerical markings on every tiffin carrier", "They use GPS on mobile phones", "Customers phone them every day", "They remember every face"]
        answer: "Alpha-numerical markings on every tiffin carrier"
        difficulty: 1
        hints: ["Letters and numbers."]
        solution: "Codes of letters and numbers show the flat, changing points, delivery point and dabbawalas."
        mistakes: {"They use GPS on mobile phones": dabbawala_facts}
      - prompt: "What happens if a customer's food is not ready on time twice?"
        options: ["The customer is removed from the list", "The dabbawala waits all day", "The dabbawala cooks the food", "Nothing happens"]
        answer: "The customer is removed from the list"
        difficulty: 2
        hints: ["They give only one more chance."]
        solution: "After one more chance, a late customer is removed."
        mistakes: {"The dabbawala waits all day": "dabbawala_rules", "Nothing happens": "dabbawala_rules"}
