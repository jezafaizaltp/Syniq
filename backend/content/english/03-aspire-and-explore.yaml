# Class 9 English (Kerala Reader), Unit III. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Part I text supplied by the school.
# Also uses tips from earlier units: read_the_lines, glossary_word, phrasal_verb.
subject: eng
chapter: 3
title: "Unit III: Aspire and Explore"

tips:
  sea_sounds: "List what the sailor names: the wheel's kick, the wind's song, the sail shaking. Which senses do these appeal to?"
  zero_error: "The dabbawalas' fame rests on a system where almost nothing goes wrong. What makes each delivery reach the right desk?"
  dabba_trip: "Each dabbawala carries the boxes there at lunch and back again in the afternoon. Count both trips."
  rain_and_land: "The author loves the monsoon and fears losing what it gives. What happens to rain that falls on concrete?"
  extra_info: "Commas around a relative clause mean the information is extra: the sentence still makes sense without it."
  advice_or_order: "Is the speaker telling, warning, asking politely or suggesting what is good for the listener? Look for words like 'should' or 'please'."
  sound_alike: "Read the sentence for meaning. Which spelling fits what the sentence is about?"
  echo_sounds: "An onomatopoeic word sounds like the noise it names. Say each word aloud."
  sea_fever_device: "A comparison that uses 'like' or 'as' has one name; a comparison that says one thing *is* another has a different name."
  dabbawala_facts: "The service began in the late 19th century. Add the numbers from both railway lines for the total. Each tiffin has colour-and-letter codes, not technology. For trays, divide the tiffins by how many fit in one."
  monsoon_mood: "In 'Waiting for Rain' the author is happy about turbulence because wind currents mean the monsoon is near."
  relative_clause: "A defining relative clause is needed to know who/what is meant (no commas); a non-defining one adds extra information between commas and can be removed."
  reported_command: "An imperative is reported with a verb like told/asked/requested/advised/ordered + object + to-infinitive: 'Wear your cap' → He instructed him to wear his cap."
  homophone: "Homophones sound the same but are spelled differently and mean different things. Ask what the sentence means (the sky, or an animal in the wild) and pick the spelling with that meaning."
  onomatopoeia: "Onomatopoeic words sound like the noise they name (buzz, crash). Writing words from another language in English letters has a different name, about changing script."
  anaphora_longing: "A line repeated at the start of each stanza (anaphora) stresses a feeling: here, his pull towards the sea."
  concrete_water: "Concrete and tiles stop rain soaking into the ground, so the water table falls and water has to be bought."
  dabbawala_rules: "The dabbawalas' rules are strict because the system depends on timing and discipline: a second slip means removal."
  imperative_function: "'Mind the gap' tells people to be careful of a danger. Is that a request, advice, or something stronger that alerts you?"
  kaati_kooti: "'Kaati-kooti poova' is the uncle's complaint that the monsoon showed off clouds and thunder and then didn't come."
  karkitakam: "The Malayalam month that begins in mid-July is the wettest, hardest month, just before the month that brings Onam."
  preposition_near: "The sentence is about living close to the city, not at an exact address. Which preposition means 'close to'?"
  prodigal_monsoon: "The prodigal son is someone who comes home after a long absence. In this essay, what has been away and finally returns?"
  rain_question: "She was far away and longing for the monsoon at home, so her daily question was about the rain."
  relative_pronoun: "A relative pronoun (who, which, that) joins a clause that describes a noun. Find the word that starts 'was happy with the turbulence'."
  sea_fever_ask: "The sailor asks for very little in the first stanza: a ship and something in the night sky to guide it. Re-read the opening lines."
  sea_fever_end: "The 'long trick' is a long turn at the wheel. After it, he wants 'a quiet sleep and a sweet dream'."
  sea_fever_weather: "He loves the open sea in motion: 'a windy day with the white clouds flying'."

concepts:
  - code: eng9.u3.sea_fever
    title: Sea-Fever (Poem)
    notes: |
      Poem by John Masefield (Poet Laureate of Britain 1930–1967). The speaker, a sailor, keeps saying "I
      must go down to the seas again". He asks only for a tall ship and a star to steer her by; the
      wheel's kick, the wind's song, the white sail's shaking, grey mist and grey dawn; a windy day with
      white clouds flying, flung spray, blown spume and crying sea-gulls; "the call of the running tide /
      Is a wild call and a clear call that may not be denied"; the vagrant gypsy life, the gull's way and
      the whale's way "where the wind's like a whetted knife"; a merry yarn from a laughing fellow-rover
      and quiet sleep and a sweet dream when the long trick (turn at the wheel) is over. Devices:
      repetition/anaphora ("I must go down to the seas again", "And all I ask"), alliteration (sea and
      sky, wild call, whale's way, whetted), simile (wind like a whetted knife), imagery.
    explanations:
      text: "The sailor cannot resist the sea: it calls him like a fever. He wants only simple things — a ship, a star, wind and spray — and at the end a cheerful story from a fellow sailor and peaceful sleep. The repeated line 'I must go down to the seas again' shows how strong his longing is."
      visual: "Draw a tall sailing ship at dawn: grey mist, white sails shaking, gulls crying, spray flying, and one bright star above. Label each with the line from the poem."
      step_by_step: "Why is the wind 'like a whetted knife'? Step 1: Whetted means sharpened. Step 2: A sharp knife cuts. Step 3: The cold sea wind feels sharp and cutting on the skin."
      real_world: "Fishermen from Kerala's coast who spend days at sea often describe the same pull of the ocean and the comfort of stories shared with fellow crew."
    activity:
      type: sort
      prompt: Which poetic device in 'Sea-Fever'?
      bins:
      - Repetition
      - Alliteration
      - Simile
      items:
      - label: '''I must go down to the seas again'' (each stanza)'
        bin: Repetition
        clue: The same line keeps coming back.
        why: Repetition (anaphora).
      - label: '''And all I ask...'' again and again'
        bin: Repetition
        clue: Repeated opening.
        why: Repetition.
      - label: '''wild call and a clear call'''
        bin: Alliteration
        clue: Listen to the starting sounds.
        why: 'Repeated w/c sounds: alliteration.'
      - label: '''the whale''s way'''
        bin: Alliteration
        clue: Same first letter.
        why: Alliteration.
      - label: '''the wind''s like a whetted knife'''
        bin: Simile
        clue: Look for 'like'.
        why: 'A comparison with ''like'': simile.'
    items:
      - prompt: "Who wrote 'Sea-Fever'?"
        options: ["John Masefield", "H. W. Longfellow", "Anita Nair", "Rabindranath Tagore"]
        answer: "John Masefield"
        difficulty: 1
        hints: ["Poet Laureate of Britain from 1930 to 1967."]
        solution: "John Masefield wrote 'Sea-Fever'."
        mistakes: {"H. W. Longfellow": "poem_author", "Rabindranath Tagore": "poem_author"}
      - prompt: "What does the speaker ask for in the first stanza?"
        options: ["A tall ship and a star to steer her by", "A big house by the sea", "Gold and silver", "A fast motor boat"]
        answer: "A tall ship and a star to steer her by"
        difficulty: 1
        hints: ["'And all I ask is...'"]
        solution: "'All I ask is a tall ship and a star to steer her by.'"
        mistakes: {"A big house by the sea": "sea_fever_ask", "A fast motor boat": "sea_fever_ask"}
      - prompt: "'the wind's like a whetted knife' is an example of:"
        options: ["Simile", "Metaphor", "Alliteration only", "Onomatopoeia"]
        answer: "Simile"
        difficulty: 2
        hints: ["Look for 'like' or 'as'."]
        solution: "It compares wind and knife using 'like': a simile."
        mistakes: {"Metaphor": sea_fever_device}
      - prompt: "What kind of weather does the sailor prefer for his voyage?"
        options: ["A windy day with white clouds flying", "A calm, still day", "A hot, dry day", "A day with no clouds or wind"]
        answer: "A windy day with white clouds flying"
        difficulty: 2
        hints: ["Second stanza."]
        solution: "He asks for 'a windy day with the white clouds flying'."
        mistakes: {"A calm, still day": "sea_fever_weather", "A day with no clouds or wind": "sea_fever_weather"}
      - prompt: "How does the speaker wish his journey to end?"
        options: ["With quiet sleep and a sweet dream when the long trick is over", "With a big storm", "By buying a new ship", "By never going to sea again"]
        answer: "With quiet sleep and a sweet dream when the long trick is over"
        difficulty: 2
        hints: ["Last line of the poem."]
        solution: "He wants rest and a sweet dream after his long turn at the wheel."
        mistakes: {"With a big storm": "sea_fever_end", "By never going to sea again": "sea_fever_end"}
      - prompt: "Why is the line 'I must go down to the seas again' repeated at the start of every stanza?"
        options: ["To show the sailor's strong, irresistible longing for the sea", "Because the poet forgot the line", "To describe the colour of the sea", "To show the sailor is afraid of the sea"]
        answer: "To show the sailor's strong, irresistible longing for the sea"
        difficulty: 3
        hints: ["Repetition stresses a feeling."]
        solution: "The repetition (anaphora) stresses his deep, constant longing."

        mistakes: {"To show the sailor is afraid of the sea": "anaphora_longing", "To describe the colour of the sea": "anaphora_longing"}
      - prompt: "'the wheel's kick and the wind's song and the white sail's shaking'. Which senses does this line mainly appeal to?"
        options: ["Touch, hearing and sight", "Taste and smell", "Smell only", "Taste, smell and hearing"]
        answer: "Touch, hearing and sight"
        difficulty: 3
        hints: ["How do you notice a wheel's kick?", "How do you notice a song? A shaking sail?"]
        solution: "Step 1: The kick of the wheel is felt (touch). Step 2: The wind's song is heard. Step 3: The shaking white sail is seen."
        mistakes: {"Taste and smell": sea_sounds, "Smell only": sea_sounds, "Taste, smell and hearing": sea_sounds}
      - prompt: "What is the main feeling of 'Sea-Fever'?"
        options: ["A deep, restless longing for life at sea", "Fear of drowning", "Boredom with sailing", "Anger at the sea"]
        answer: "A deep, restless longing for life at sea"
        difficulty: 2
        hints: ["What does the title 'fever' suggest?", "What line does every stanza begin with?"]
        solution: "Step 1: 'Fever' suggests a strong, burning desire. Step 2: 'I must go down to the seas again' shows his longing to return to the sea."
        mistakes: {"Fear of drowning": anaphora_longing, "Boredom with sailing": anaphora_longing, "Anger at the sea": anaphora_longing}
  - code: eng9.u3.tiffin_carriers
    title: The Saga of the Tiffin Carriers
    after: [eng9.u3.sea_fever]
    notes: |
      Article by Hugh and Colleen Gantzer about Mumbai's dabbawalas. Mumbai workers live far from offices
      (skyrocketing land prices), eat varied diets and cannot afford downtown meals, so hot home-cooked
      lunches are delivered. Began in 1890 when an old Parsi lady in Dadar asked Mahadu Iwhaji Bacha to
      carry a tiffin to her husband. Now about 3,500 dabbawalas on the Western Railway and 1,500 on the
      Central Railway; two lakh customers; pick up from 8 a.m., deliver by 1 p.m., collect by 2 p.m.,
      return empty boxes by 5.30 p.m.; about Rs 500 per month. One chance for late customers, then
      removal. A tray holds 40–45 tiffins and weighs 85–100 kg; five changing points; alpha-numerical
      codes on every carrier. Strict training, courtesy, no drinking, white caps (fined, then removed).
      Admired by business schools and Prince (now King) Charles; Bikaji, 74, has worked 50 years. E. L.
      Paulo: "In all these ten years they have never missed."
    explanations:
      text: "Every working day, about 5,000 dabbawalas carry around two lakh home-cooked lunches across Mumbai by train, cart and bicycle and bring the empty boxes back — almost never making a mistake. Simple codes painted on each box, strict timing and discipline make it work."
      visual: "Draw the route as a chain: home (8 a.m. pick-up) → local station → changing points (sorted by code) → office (by 1 p.m.) → collected (2 p.m.) → home again (by 5.30 p.m.)."
      step_by_step: "How many dabbawalas are there? Step 1: 3,500 on the Western Railway. Step 2: 1,500 on the Central Railway. Step 3: 3,500 + 1,500 = 5,000."
      real_world: "Management schools around the world study the dabbawalas as an example of a simple, reliable supply chain run without computers."
    activity:
      type: number_line
      min: 6
      max: 20
      step: 1
      start: 6
      prompt: The dabbawalas' day. Mark the hour (24-hour clock).
      goals:
      - prompt: Pick-ups start at
        target: 8
        mistakes:
        - when:
            v: 13
          say: 1 p.m. is when lunch must reach the office. Pick-ups start in the morning.
      - prompt: Lunch delivered by
        target: 13
        mistakes:
        - when:
            v: 14
          say: 2 p.m. is when they collect the empty boxes. Delivery is by 1 p.m.
      - prompt: Empty boxes collected by
        target: 14
        mistakes:
        - when:
            v: 13
          say: 1 p.m. is delivery. Collection is an hour later.
      - prompt: Empty boxes home by about (5.30 p.m. — mark the hour)
        target: 17
        mistakes:
        - when:
            v: 14
          say: That's collection. Boxes are home by 5.30 p.m.
    items:
      - prompt: "In which year did the dabbawala service begin?"
        answer: "1890"
        check: "1890"
        difficulty: 1
        hints: ["An old Parsi lady in Dadar."]
        solution: "It began in 1890."
        mistakes: {"1990": dabbawala_facts}
      - prompt: "There are 3,500 dabbawalas on the Western Railway and 1,500 on the Central Railway. How many in all?"
        answer: "5000"
        check: "3500 + 1500"
        difficulty: 1
        hints: ["Add them."]
        solution: "3,500 + 1,500 = 5,000"
        mistakes: {"2000": dabbawala_facts}
      - prompt: "How do the dabbawalas know which tiffin carrier goes where?"
        options: ["Alpha-numerical markings on every tiffin carrier", "They use GPS on mobile phones", "Customers phone them every day", "They remember every face"]
        answer: "Alpha-numerical markings on every tiffin carrier"
        difficulty: 1
        hints: ["Letters and numbers."]
        solution: "Codes of letters and numbers show the flat, changing points, delivery point and dabbawalas."
        mistakes: {"They use GPS on mobile phones": dabbawala_facts}
      - prompt: "What happens if a customer's food is not ready on time twice?"
        options: ["The customer is removed from the list", "The dabbawala waits all day", "The dabbawala cooks the food", "Nothing happens"]
        answer: "The customer is removed from the list"
        difficulty: 2
        hints: ["They give only one more chance."]
        solution: "After one more chance, a late customer is removed."
        mistakes: {"The dabbawala waits all day": "dabbawala_rules", "Nothing happens": "dabbawala_rules"}
      - prompt: "Why are dabbawalas needed in Mumbai?"
        options: ["Workers live far from offices and want hot home-cooked food they can afford", "Mumbai has no restaurants", "The law requires it", "Offices do not allow eating"]
        answer: "Workers live far from offices and want hot home-cooked food they can afford"
        difficulty: 2
        hints: ["Land prices, diets and cost of living."]
        solution: "High land prices push homes far away, diets differ, and eating out is costly."
        mistakes: {"Mumbai has no restaurants": read_the_lines}
      - prompt: "A tray holds about 40 tiffin carriers. How many trays are needed for 200 tiffins?"
        answer: "5"
        check: "200/40"
        difficulty: 2
        hints: ["Divide."]
        solution: "200 ÷ 40 = 5 trays"
        mistakes: {"8000": dabbawala_facts}
      - prompt: "What happens to a dabbawala who forgets his white cap a second time?"
        options: ["He is removed from the Association", "He is given a new cap", "He gets a holiday", "Nothing happens"]
        answer: "He is removed from the Association"
        difficulty: 3
        hints: ["First a fine, then..."]
        solution: "He is fined the first time and removed if it happens again."

        mistakes: {"He is given a new cap": "dabbawala_rules", "Nothing happens": "dabbawala_rules"}
      - prompt: "What makes it possible for the dabbawalas to deliver thousands of tiffins with almost no mistakes?"
        options: ["Coded markings on each tiffin and strict discipline and timing", "Every tiffin is carried by one person all the way", "They use GPS on every box", "Customers collect their own tiffins"]
        answer: "Coded markings on each tiffin and strict discipline and timing"
        difficulty: 3
        hints: ["How is each tiffin carrier marked?", "What happens to dabbawalas who break the rules?"]
        solution: "Step 1: Alpha-numerical codes tell every handler where each box goes. Step 2: Strict rules on time and conduct keep the chain running without errors."
        mistakes: {"Every tiffin is carried by one person all the way": zero_error, "They use GPS on every box": zero_error, "Customers collect their own tiffins": zero_error}
      - prompt: "A dabbawala carries 30 tiffins to offices at lunchtime and brings the same 30 empty tiffins home in the afternoon. How many tiffin trips does he make in a 6-day week?"
        answer: "360"
        check: "30*2*6"
        difficulty: 3
        hints: ["Each tiffin makes two trips a day.", "30 × 2 × 6."]
        solution: "Step 1: Each day: 30 there + 30 back = 60 trips. Step 2: 6 days: 60 × 6 = 360."
        mistakes: {"180": dabba_trip, "60": dabba_trip}
  - code: eng9.u3.waiting_for_rain
    title: Waiting for Rain
    after: [eng9.u3.sea_fever]
    notes: |
      Travel essay by Anita Nair (Kerala writer; Ladies Coupe, The Better Man). Flying into Kochi, she is
      the only passenger happy about turbulence: wind currents mean monsoon. Most passengers are young
      guest workers from northern India. The southwest monsoon had been playing hide-and-seek for six
      weeks; her daily call to her parents began "Is it raining there?". On July 17, the first day of
      Karkitakam, there was only reluctant rain. In Bangalore a brutal wind pushed the clouds away. The
      village (Mundakkottukurissi) had a severe summer drought; concrete, tiled yards and tree-felling
      will make people pay for water (Rs 400 a tanker in Bangalore). Her sprightly 85-year-old uncle
      (learnt to ride a scooter at 78) says the monsoon can cause penury both by coming and by failing;
      he accuses it of "kaati-kooti poova" (making a show and not coming), like a rich relative's
      disappointing visit. At 2 a.m. she wakes to rain drumming on the tile roof — "the prodigal son has
      found his way home" — and hears music in it (vilamba, madhyama, dhrutha kaalam). She watches it like
      an exotic migratory bird, afraid even to sigh. "For now, the world is a beautiful place."
    explanations:
      text: "Anita Nair travels home to Kerala to meet the monsoon, but it keeps not coming. She worries about drought and how we are destroying the land's ability to hold water. When the rain finally drums on her roof at night, she feels it like music and a deep sense of well-being."
      visual: "Draw two pictures side by side: a dry village yard with a dry well and a tanker lorry, and the same yard at night with heavy rain on a tiled roof and a woman smiling on a swing."
      step_by_step: "Why was turbulence good news for her? Step 1: Turbulence is caused by wind currents. Step 2: Wind currents bring monsoon clouds. Step 3: So turbulence meant rain might be coming."
      real_world: "Karkitakam (July–August) is traditionally Kerala's heaviest rain month; farmers and water supply depend on it."
    activity:
      type: sort
      prompt: How does Anita Nair feel?
      bins:
      - Hopeful or anxious
      - Disappointed
      - Joyful
      items:
      - label: Turbulence on the flight to Kochi
        bin: Hopeful or anxious
        clue: Wind currents might mean monsoon.
        why: She hopes it means rain.
      - label: 'Her daily call: ''Is it raining there?'''
        bin: Hopeful or anxious
        clue: Waiting, checking every day.
        why: Anxious waiting.
      - label: Only reluctant rain on the first day of Karkitakam
        bin: Disappointed
        clue: The rain hardly came.
        why: Disappointed.
      - label: '''Kaati-kooti poova'' — making a show and not coming'
        bin: Disappointed
        clue: Like a rich relative who doesn't stay.
        why: Disappointed.
      - label: Rain drumming on the roof at 2 a.m.
        bin: Joyful
        clue: '''The prodigal son has found his way home''.'
        why: Joy.
      - label: '''For now, the world is a beautiful place'''
        bin: Joyful
        clue: Her last line.
        why: Joy.
    items:
      - prompt: "Why was the author happy about the turbulence on the flight?"
        options: ["Turbulence meant wind currents and hence the monsoon", "She enjoyed being frightened", "It made the flight faster", "She was a pilot"]
        answer: "Turbulence meant wind currents and hence the monsoon"
        difficulty: 1
        hints: ["She was travelling to meet the monsoon."]
        solution: "An uneventful flight meant good weather; turbulence meant wind currents and the monsoon."
        mistakes: {"She enjoyed being frightened": monsoon_mood}
      - prompt: "What question did the author ask her parents every day?"
        options: ["Is it raining there?", "What is for dinner?", "When are you coming?", "How is the uncle?"]
        answer: "Is it raining there?"
        difficulty: 1
        hints: ["It was not just a conversation filler."]
        solution: "Her daily calls began with 'Is it raining there?'"
        mistakes: {"What is for dinner?": "rain_question", "How is the uncle?": "rain_question"}
      - prompt: "July 17 was the first day of which Malayalam month?"
        options: ["Karkitakam", "Chingam", "Medam", "Kumbham"]
        answer: "Karkitakam"
        difficulty: 2
        hints: ["Sheets of rain should be falling."]
        solution: "July 17 was the first day of Karkitakam."
        mistakes: {"Chingam": "karkitakam", "Medam": "karkitakam"}
      - prompt: "The author's uncle is 85 and learnt to ride a scooter at 78. How many years has he been riding?"
        answer: "7"
        check: "85 - 78"
        difficulty: 1
        hints: ["Subtract."]
        solution: "85 − 78 = 7 years"
        mistakes: {"163": read_the_lines}
      - prompt: "What does the uncle accuse the monsoon of with 'kaati-kooti poova'?"
        options: ["Making a show of grey skies and thunder and then not coming", "Coming too early", "Flooding the village", "Being too cold"]
        answer: "Making a show of grey skies and thunder and then not coming"
        difficulty: 2
        hints: ["Like a rich relative whose visit is a let-down."]
        solution: "He says the monsoon only made a production and did not show up."
        mistakes: {"Coming too early": "kaati_kooti", "Flooding the village": "kaati_kooti"}
      - prompt: "According to the author, what will happen if we build more concrete, tile front yards and cut trees?"
        options: ["We will have to pay for water", "We will get more rain", "Wells will overflow", "Nothing will change"]
        answer: "We will have to pay for water"
        difficulty: 2
        hints: ["She pays Rs 400 for a tanker in Bangalore."]
        solution: "The water table will fall and water will have to be bought."
        mistakes: {"We will get more rain": "concrete_water", "Wells will overflow": "concrete_water"}
      - prompt: "'The prodigal son has found his way home.' Who or what is the 'prodigal son' here?"
        options: ["The monsoon", "The author's uncle", "A migrant worker", "The author's brother"]
        answer: "The monsoon"
        difficulty: 3
        hints: ["It arrives at 2 a.m., drumming on the roof."]
        solution: "The long-awaited monsoon returning is compared to the prodigal son coming home."

        mistakes: {"The author's uncle": "prodigal_monsoon", "A migrant worker": "prodigal_monsoon"}
      - prompt: "Anita Nair warns that if we build more concrete and cut trees, we will have to pay for water. Why?"
        options: ["Rain can't soak into the ground, so wells and groundwater dry up", "Concrete makes rain stop forever", "Trees drink all the rain", "Water companies own the rain"]
        answer: "Rain can't soak into the ground, so wells and groundwater dry up"
        difficulty: 3
        hints: ["Where does rain falling on concrete go?", "Where do wells get their water?"]
        solution: "Step 1: Concrete and tiles stop rain soaking into the soil. Step 2: Groundwater isn't refilled, wells dry up, and water has to be bought."
        mistakes: {"Concrete makes rain stop forever": rain_and_land, "Trees drink all the rain": rain_and_land, "Water companies own the rain": rain_and_land}
      - prompt: "What is the author's attitude towards the monsoon in 'Waiting for Rain'?"
        options: ["Deep love and longing", "Fear and dislike", "Complete indifference", "Annoyance at the wet"]
        answer: "Deep love and longing"
        difficulty: 2
        hints: ["Why was she the only passenger happy about turbulence?", "What did she ask her parents every day?"]
        solution: "Step 1: She welcomes turbulence because it means the monsoon. Step 2: She asks daily if it is raining: she loves and longs for it."
        mistakes: {"Fear and dislike": monsoon_mood, "Complete indifference": rain_question, "Annoyance at the wet": monsoon_mood}
  - code: eng9.u3.grammar
    title: "Grammar: relative clauses, imperatives and prepositions"
    after: [eng9.u3.tiffin_carriers]
    notes: |
      Relative clauses begin with who, whom, whose, which, that, where. Defining clauses give essential
      information, no commas (I have a friend who speaks four languages). Non-defining clauses add extra
      information between commas (Arun, who is retired now, spends time with his grandchildren).
      Imperative sentences give orders, requests, advice, warnings, invitations, instructions (Come in;
      Please do not lean out; Mind the gap). Reported imperatives: verb (told, asked, requested,
      instructed, advised, ordered) + object + to/not to + verb ('Wear your white cap' → The Secretary
      instructed the dabbawala to wear the white cap). Prepositions (near, at, of, between, on, into)
      come before a noun or noun phrase.
    explanations:
      text: "A relative clause is a describing clause: 'the passenger who was happy'. If you can't tell which passenger without it, it's defining. Imperatives speak directly to someone; to report them, use 'told/asked ... to'."
      visual: "Draw a noun in a box with a clause hanging from it like a tag on a gift. If the tag says which gift it is, it is defining; if it just adds a note, it is non-defining (put commas round it)."
      step_by_step: "Report: Traffic police officer: 'Do not park here.' Step 1: Reporting verb: ordered/told. Step 2: Negative imperative → not to. Step 3: The officer told us not to park there."
      real_world: "Railway announcements are full of imperatives: 'Please stand behind the yellow line', 'Mind the gap'."
    activity:
      type: sort
      prompt: Defining or non-defining relative clause?
      bins:
      - Defining (no commas)
      - Non-defining (commas)
      items:
      - label: I have a friend who speaks four languages.
        bin: Defining (no commas)
        clue: Without the clause, which friend?
        why: Essential information.
      - label: Arun, who is retired now, plays with his grandchildren.
        bin: Non-defining (commas)
        clue: We already know who Arun is.
        why: Extra information.
      - label: The boy who won the race is my cousin.
        bin: Defining (no commas)
        clue: Which boy?
        why: Essential.
      - label: Mumbai, where the dabbawalas work, is very crowded.
        bin: Non-defining (commas)
        clue: Mumbai is already clear.
        why: Extra information.
      - label: This is the house that Jack built.
        bin: Defining (no commas)
        clue: Which house?
        why: Essential.
      - label: My mother, who loves rain, sat by the window.
        bin: Non-defining (commas)
        clue: You have one mother.
        why: Extra.
    items:
      - prompt: "Identify the relative pronoun: 'I must have been the only passenger who was happy with the turbulence.'"
        options: ["who", "only", "with", "the"]
        answer: "who"
        difficulty: 1
        hints: ["It introduces the clause describing the passenger."]
        solution: "'who' introduces the relative clause 'who was happy with the turbulence'."
        mistakes: {"only": "relative_pronoun", "with": "relative_pronoun"}
      - prompt: "Which sentence has a non-defining relative clause?"
        options: ["Arun, who is retired now, spends a lot of time with his grandchildren.", "I have a friend who speaks four languages.", "That is the house in which I grew up.", "Mumbai is a city that bustles with activities."]
        answer: "Arun, who is retired now, spends a lot of time with his grandchildren."
        difficulty: 2
        hints: ["Extra information between commas."]
        solution: "The clause between commas only adds information; we already know who Arun is."
        mistakes: {"I have a friend who speaks four languages.": relative_clause}
      - prompt: "Choose the correct relative pronoun: 'The award was given to Sara, ___ short story impressed the judges.'"
        options: ["whose", "who", "which", "whom"]
        answer: "whose"
        difficulty: 2
        hints: ["Possession: Sara's story."]
        solution: "'whose' shows possession."
        mistakes: {"who": relative_clause}
      - prompt: "'Mind the gap between the train and the platform.' What is the function of this imperative?"
        options: ["Warning", "Invitation", "Request", "Advice"]
        answer: "Warning"
        difficulty: 1
        hints: ["It is about danger."]
        solution: "It warns passengers of danger."
        mistakes: {"Request": "imperative_function", "Advice": "imperative_function"}
      - prompt: "Report: Secretary to dabbawala, \"Wear your white cap.\""
        options: ["The Secretary instructed the dabbawala to wear his white cap.", "The Secretary instructed the dabbawala wear your white cap.", "The Secretary said the dabbawala wears his white cap.", "The Secretary asked whether the dabbawala wore his cap."]
        answer: "The Secretary instructed the dabbawala to wear his white cap."
        difficulty: 2
        hints: ["Verb + object + to-infinitive."]
        solution: "Imperative → instructed + the dabbawala + to wear; your → his."
        mistakes: {"The Secretary instructed the dabbawala wear your white cap.": reported_command}
      - prompt: "Report: Teacher, \"Do not talk in class.\""
        options: ["The teacher told us not to talk in class.", "The teacher told us to not talking in class.", "The teacher said us do not talk.", "The teacher told that do not talk in class."]
        answer: "The teacher told us not to talk in class."
        difficulty: 3
        hints: ["Negative imperative → not to."]
        solution: "Don't + verb → not to + verb."
        mistakes: {"The teacher said us do not talk.": reported_command}
      - prompt: "Choose the correct preposition: 'It is impossible for the average employee to live ___ their place of work.'"
        options: ["near", "at", "of", "into"]
        answer: "near"
        difficulty: 2
        hints: ["Close to."]
        solution: "'live near their place of work'."

        mistakes: {"at": "preposition_near", "into": "preposition_near"}
      - prompt: "Which sentence has a defining relative clause?"
        options: ["The girl who won the race is my cousin.", "My cousin, who won the race, is ten.", "Kochi, which is in Kerala, is a port.", "Mr Rao, whom you met, is our principal."]
        answer: "The girl who won the race is my cousin."
        difficulty: 3
        hints: ["A defining clause tells us which person or thing is meant.", "It has no commas."]
        solution: "Step 1: The other three have commas: extra information. Step 2: 'who won the race' tells us which girl, so it is defining."
        mistakes: {"My cousin, who won the race, is ten.": extra_info, "Kochi, which is in Kerala, is a port.": extra_info, "Mr Rao, whom you met, is our principal.": extra_info}
      - prompt: "'You should carry an umbrella in Karkitakam.' What is the function of this sentence?"
        options: ["Advice", "Warning", "Order", "Request"]
        answer: "Advice"
        difficulty: 2
        hints: ["Which word softens it?", "'Should' suggests what is best to do."]
        solution: "Step 1: 'Should' gives a suggestion, not a command. Step 2: So the sentence gives advice."
        mistakes: {"Warning": advice_or_order, "Order": advice_or_order, "Request": advice_or_order}
  - code: eng9.u3.words
    title: "Words: onomatopoeia, homophones and phrasal verbs"
    after: [eng9.u3.tiffin_carriers]
    notes: |
      Onomatopoeia: words that imitate sounds — crash, clang, growl, banged, creaked, groaned, hissed,
      gurgling, drumming, beep, crackle, rattle, rumble, sizzle, giggle, flutter. Homophones: same sound,
      different spelling and meaning — to/too, weather/whether, tea/tee, flower/flour, bear/bare,
      piece/peace, meet/meat, see/sea, sun/son, fair/fare. Phrasal verbs with 'come': come across (meet
      by chance), come by (get, obtain), come back (return), come round (visit), come over (affect), come
      off (succeed), come up to (meet expectations), come up with (think of). Transliteration and code
      switching: 'kaati-kooti poova', 'Karkitakam', 'vilamba kaalam'. Glossary: penury (extreme poverty),
      myriad (many), incessant (continuous), foibles (minor weaknesses), uncouth (rude), courteously,
      endorsement, menacing, clammy, spume, yarn (a long story).
    explanations:
      text: "Some words sound like what they mean: the 'clang' of tiffin boxes, the 'sizzle' of frying vada. Others sound alike but mean different things: you 'see' the 'sea'. Writers use both to make descriptions lively."
      visual: "Draw a speech bubble with BANG and a door, HISS and a snake, SIZZLE and a pan. Next to them draw a 'sea' and an eye that can 'see'."
      step_by_step: "Correct 'I savoured a delicious peace of cake'. Step 1: 'peace' means calm. Step 2: We need a part of the cake. Step 3: piece of cake."
      real_world: "Comics and cartoons are full of onomatopoeia: ZOOM, POW, SPLASH."
    activity:
      type: sort
      prompt: Onomatopoeia or homophone pair?
      bins:
      - Onomatopoeia
      - Homophones
      items:
      - label: sizzle
        bin: Onomatopoeia
        clue: 'Say it: does it sound like frying?'
        why: It imitates a sound.
      - label: rumble
        bin: Onomatopoeia
        clue: Thunder.
        why: Sound word.
      - label: drumming (of rain)
        bin: Onomatopoeia
        clue: Rain on a roof.
        why: Sound word.
      - label: flower / flour
        bin: Homophones
        clue: Same sound, different meaning.
        why: Homophones.
      - label: weather / whether
        bin: Homophones
        clue: Same sound.
        why: Homophones.
      - label: peace / piece
        bin: Homophones
        clue: Same sound.
        why: Homophones.
    items:
      - prompt: "Which of these is an onomatopoeic word?"
        options: ["sizzle", "beautiful", "quickly", "monsoon"]
        answer: "sizzle"
        difficulty: 1
        hints: ["It sounds like oil frying."]
        solution: "'Sizzle' imitates the sound of frying."
        mistakes: {"monsoon": onomatopoeia}
      - prompt: "Correct the homophone error: 'The whether was perfect, with clear skies.'"
        options: ["weather", "wether", "whither", "water"]
        answer: "weather"
        difficulty: 1
        hints: ["Sky, rain and sun."]
        solution: "'Weather' is the state of the sky; 'whether' means if."
        mistakes: {"wether": homophone}
      - prompt: "Correct the homophone error: 'I came across a wild bare.'"
        options: ["bear", "beer", "bar", "bore"]
        answer: "bear"
        difficulty: 2
        hints: ["An animal."]
        solution: "A 'bear' is the animal; 'bare' means uncovered."
        mistakes: {"beer": homophone}
      - prompt: "What does 'come across' mean in 'I came across a variety of goods'?"
        options: ["To meet or find by chance", "To cross a road", "To return", "To succeed"]
        answer: "To meet or find by chance"
        difficulty: 2
        hints: ["Phrasal verb."]
        solution: "'Come across' = find by chance."
        mistakes: {"To cross a road": phrasal_verb}
      - prompt: "What does 'penury' mean in 'the monsoon can reduce a region to penury'?"
        options: ["Extreme poverty", "Heavy rain", "A pen and paper", "Great wealth"]
        answer: "Extreme poverty"
        difficulty: 2
        hints: ["Floods or drought can both cause it."]
        solution: "Penury means extreme poverty."
        mistakes: {"A pen and paper": glossary_word, "Great wealth": glossary_word}
      - prompt: "'kaati-kooti poova' written in English letters is an example of:"
        options: ["Transliteration", "Onomatopoeia", "A homophone", "A simile"]
        answer: "Transliteration"
        difficulty: 3
        hints: ["Malayalam words written in the English alphabet."]
        solution: "Writing words of one language in another language's script is transliteration."
        mistakes: {"Onomatopoeia": onomatopoeia}
      - prompt: "Choose the correct word: 'The ___ of the rain on the roof kept us awake.'"
        options: ["drumming", "drumed", "dummy", "dreaming"]
        answer: "drumming"
        difficulty: 2
        hints: ["The sound of rain hitting a roof.", "An onomatopoeic word from the unit."]
        solution: "Step 1: The sentence needs a noun for the sound of rain. Step 2: 'Drumming' imitates that steady beating sound."
        mistakes: {"drumed": echo_sounds, "dummy": echo_sounds, "dreaming": echo_sounds}
      - prompt: "Correct the homophone error: 'We could here the thunder from far away.'"
        options: ["hear", "hair", "heir", "her"]
        answer: "hear"
        difficulty: 2
        hints: ["The sentence is about the ears.", "'Here' means in this place."]
        solution: "Step 1: 'Here' is about place. Step 2: Listening needs 'hear': 'We could hear the thunder.'"
        mistakes: {"hair": sound_alike, "heir": sound_alike, "her": sound_alike}
