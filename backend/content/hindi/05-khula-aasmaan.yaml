        - '''जीत'' स्त्रीलिंग है।'
        solution: नाटक के अंत में जनता की जीत हुई।
        mistakes:
          का, में, का: h5_ka_ke_ki
      - prompt: किस वाक्य में परसर्ग गलत है?
        options:
