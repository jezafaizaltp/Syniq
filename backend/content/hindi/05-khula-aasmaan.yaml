      - teach: 'तीसरे दृश्य में न्यायाधीश कहता है: ''राजा की इच्छा के सामने सिर झुकाना ही पड़ेगा।'' जनता जवाब देती है कि वह ऐसा फ़ैसला नहीं मानेगी। जनता हेम के साथ हो जाती है, सैनिक भाग जाते हैं। हेम: ''जनता के दरबार में आप अपराधी हैं।'' राजा मुकुट उतारकर जनता में मिल जाता है और हेम को सलाह देता है: राजचारण (चापलूस) का पद खत्म कर देना।'
