      - teach: हर आने-जाने वाला उसे हसरत से देखता है, और 'धीरे-धीरे मैं बोनज़ाई में तब्दील हो गई।' फिर मौसम बदला; उसमें फल-फूल लगे, जिनसे मालिक डर गया। इस बार उसने उसे उखाड़कर घूरे (कूड़े) पर फेंक दिया।
