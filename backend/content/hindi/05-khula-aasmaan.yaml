subject: hin
chapter: 5
title: "इकाई पाँच - खुला आसमान"

tips:
  hin_play_roles: "नाटक में हर बच्चा एक भूमिका निभाता है। देखो, किसकी हिम्मत से बाकी लोग बदलते हैं, और राजा आखिर में क्या समझता है।"
  hin_raja_play: "नाटक बच्चों का खेल है: एक बच्चा राजा बनता है और लड़ाई का मज़ा लेने के लिए दूसरे को दुश्मन बनाता है। देखो, आखिर में जनता, सेना और न्यायाधीश किसका साथ देते हैं।"
  hin_bonsai: "'बोनज़ाई' (सुधा उपाध्याय): पेड़ को आँगन से खोदकर गमले में ड्राइंग रूम की सजावट बना दिया गया; फल-फूल लगने पर मालिक डर गया और उसे घूरे पर फेंक दिया, जहाँ उसकी जड़ें और फैल गईं। बोनज़ाई किसी को सीमित करके रखने का प्रतीक है।"
  hin_parsarg: "परसर्ग 'का, के, की' संबंध बताते हैं और बाद वाली संज्ञा के लिंग-वचन से बदलते हैं: राजा की वेश-भूषा (स्त्रीलिंग), बच्चों का नाटक (पुल्लिंग एकवचन), नाटक के पात्र (बहुवचन)।"
  hin_play_idiom: "मुहावरे का अर्थ शब्दों से अलग होता है। जिसका नमक खाया हो उसका गुण गाना यानी किसी के उपकार को मानना; कान झनझनाने पर मन शांत रहता है या बेचैन?"
  h5_who_role: 'नाटक में बच्चे खेल-खेल में भूमिकाएँ निभा रहे हैं। हर बच्चे को उसकी भूमिका से जोड़कर याद करो: राजा, मंत्री, न्यायाधीश, विद्रोही।'
  h5_scene_order: 'नाटक के तीनों दृश्य अलग करो: पहला खेल शुरू होने का, दूसरा राजा और सेनापति का, तीसरा न्याय और जनता के फ़ैसले का। सवाल किस दृश्य से है?'
  h5_power_idea: नाटक बताता है कि शक्ति जनता से आती है, किसी के बड़े होने या मुकुट से नहीं। यह उत्तर उस विचार से मेल खाता है या उसके उलट है?
  h5_bonsai_story: 'कविता में पेड़ के साथ क्या-क्या हुआ, क्रम से याद करो: आँगन, गमला, ड्राइंग रूम, फल-फूल, घूरा।'
  h5_bonsai_symbol: बोनज़ाई यहाँ केवल पौधा नहीं है; वह ऐसे जीवन का प्रतीक है जिसे सजावट बनाकर छोटा रखा गया। यह उत्तर उस अर्थ से जुड़ता है?
  h5_ka_ke_ki: 'परसर्ग के ठीक बाद वाली संज्ञा देखो: पुल्लिंग एकवचन है, पुल्लिंग बहुवचन, या स्त्रीलिंग? उसी से ''का/के/की'' तय होता है।'
  h5_idiom_sense: मुहावरे का अर्थ शब्दों से नहीं, वाक्य के भाव से निकलता है। वाक्य में रखकर देखो कौन-सा अर्थ बैठता है।

concepts:
  - code: hin9.u5.raja_vidrohi
    title: राजा और विद्रोही
    notes: |
      रवींद्रनाथ ठाकुर (जन्म कोलकत्ता; गीतांजलि) का नाटक, अनुवादक अमर गोस्वामी। पात्र: राजेन (राजा),
      जितेन (मंत्री), उपेन (न्यायाधीश), हेम (विद्रोही), सेनापति, सैनिक, जनता, मति। पहला दृश्य: राजेन
      कहता है "मैं तुम लोगों का राजा हूँ... क्योंकि मैं तुम सबसे बड़ा हूँ"; हेम: इससे साबित नहीं होता कि तुम
      सबसे बलवान हो; झगड़ा; मति: "यह सिर्फ़ खेल है... बाद में तुम्हारी भी राजा बनने की बारी आएगी।"
      दूसरा दृश्य: राजा सेनापति से नाराज़; "दुश्मन नहीं है? तो फिर दुश्मन बनाओ", नहीं तो खाली बैठे सैनिक
      मुझपर ही हमला कर देंगे। जनता: "हम किसीसे डरते नहीं। लेकिन हम महाराज से लड़ना नहीं चाहते!"
      सेनापति हेम पर आरोप लगाता है कि राजा के गुज़रते समय उसने जंभाई ली। तीसरा दृश्य: न्यायाधीश: "राजा
      की इच्छा के सामने हमें सिर झुकाना ही पड़ेगा"; जनता: "अगर आप न्यायाधीश का कर्तव्यपालन नहीं कर सकते
      तो... कोई फ़ैसला हम नहीं मानेंगे।" राजा: हेम ने राजमहल के हाथी के सामने थूक दिया था; "लड़ाई के
      आनंद और उल्लास से तुम लोग मुझे अलग करना चाहते हो"। जनता हेम की तरफ़ हो जाती है; सैनिक भाग जाते
      हैं; हेम: "आप बंदी हैं... जनता के दरबार में आप अपराधी हैं।" न्यायाधीश: न्याय अब इन्हीं के हाथ में है;
      "राजमुकुट उतार दीजिए। जनता की भीड़ में मिल जाइए।" राजचारण की चापलूसी; दरबारी कवि अब विजयी
      जनता की गौरव गाथा लिख रहा है। राजा हेम को बधाई देता है और सलाह: राजचारण का पद खत्म कर देना।
      इकाई मुखपृष्ठ: एब्राहम लिंकन — "जो लोग दूसरों को आज़ादी नहीं देते उन्हें खुद भी इसका हक नहीं होगा।"
      व्याकरण: परसर्ग का/के/की; मुहावरे।
    explanations:
      text: "बच्चों के खेल के रूप में यह नाटक दिखाता है कि जो राजा बिना कारण लड़ाई चाहता है और न्याय नहीं करता, उसका अधिकार जनता छीन लेती है। असली शक्ति जनता के हाथ में है।"
      visual: "तीन दृश्यों की पट्टी: 1. खेल में राजा चुना गया → 2. दुश्मन बनाने का आदेश; हेम पर जंभाई का आरोप → 3. अदालत में जनता का प्रश्न; सेना और न्याय जनता के साथ; राजा मुकुट उतारता है।"
      step_by_step: "राजा का चरित्र: 1. खुद को बड़ा मानता है। 2. लड़ाई में आनंद लेता है। 3. छोटी-सी बात (जंभाई) को अपमान बनाता है। 4. चापलूसी पसंद करता है। 5. अंत में हार मानकर हेम को बधाई देता है।"
      real_world: "कक्षा में मॉनिटर या टीम कप्तान का काम सबकी भलाई है, अपना रौब दिखाना नहीं। अगर कोई नियम अन्यायपूर्ण लगे, तो उसके खिलाफ़ शांति से और मिलकर आवाज़ उठाई जा सकती है।"
    activity:
      type: sort
      prompt: नाटक में यह किसने कहा?
      bins:
      - राजेन (राजा)
      - हेम (विद्रोही)
      - मति
      - जनता
      items:
      - label: '"मैं तुम लोगों का राजा हूँ"'
        bin: राजेन (राजा)
        clue: कौन कहता है कि वह सबसे बड़ा है, इसलिए राजा है?
        why: राजेन अपनी उम्र को राजा होने का कारण बताता है।
      - label: '"दुश्मन नहीं है? तो दुश्मन बनाओ"'
        bin: राजेन (राजा)
        clue: किसे डर है कि खाली बैठे सैनिक उसी पर हमला करेंगे?
        why: राजा सेनापति से यह कहता है।
      - label: '"इससे साबित नहीं होता कि तुम बलवान हो"'
        bin: हेम (विद्रोही)
        clue: राजा के दावे को कौन चुनौती देता है?
        why: हेम राजेन की बात काटता है।
      - label: '"यह सिर्फ़ खेल है"'
        bin: मति
        clue: झगड़ा कौन शांत कराता है?
        why: मति याद दिलाती है कि सबकी बारी आएगी।
      - label: '"हम महाराज से लड़ना नहीं चाहते!"'
        bin: जनता
        clue: '''हम'' कौन हैं?'
        why: जनता डरती नहीं, पर राजा से लड़ना नहीं चाहती।
    lesson:
      - teach: '''राजा और विद्रोही'' रवींद्रनाथ ठाकुर का नाटक है (अनुवाद: अमर गोस्वामी)। बच्चे खेल-खेल में नाटक करते हैं: राजेन राजा, जितेन मंत्री, उपेन न्यायाधीश, हेम विद्रोही; साथ में सेनापति, सैनिक, जनता और मति। राजेन कहता है: ''मैं तुम्हारा राजा हूँ, क्योंकि मैं तुम सबसे बड़ा हूँ।'' हेम पूछता है: इससे कहाँ साबित होता है कि तुम सबसे बलवान हो?'
        check:
          prompt: नाटक में मंत्री कौन बनता है?
          options:
          - जितेन
          - हेम
          - उपेन
          answer: जितेन
          why: उपेन न्यायाधीश, हेम विद्रोही।
        ways:
        - style: real_world
          teach: 'स्कूल में खेल-खेल में नाटक करते हुए हम भी राजा-मंत्री बाँट लेते हैं। रवींद्रनाथ ठाकुर के नाटक ''राजा और विद्रोही'' (अनुवाद: अमर गोस्वामी) में बच्चे यही करते हैं: राजेन राजा, जितेन मंत्री, उपेन न्यायाधीश, हेम विद्रोही; साथ में सेनापति, सैनिक, जनता और मति। राजेन कहता है: ''मैं तुम्हारा राजा हूँ, क्योंकि मैं तुम सबसे बड़ा हूँ।'' हेम पूछता है: इससे कहाँ साबित होता है कि तुम सबसे बलवान हो?'
      - teach: 'दूसरे दृश्य में राजा सेनापति से नाराज़ है कि लड़ाई की तैयारी नहीं है: ''दुश्मन नहीं है? तो फिर दुश्मन बनाओ'', वरना खाली बैठे सैनिक उसी पर हमला कर देंगे। जनता कहती है: ''हम किसीसे डरते नहीं, लेकिन महाराज से लड़ना नहीं चाहते।'' सेनापति हेम पर आरोप लगाता है कि राजा के गुज़रते समय उसने जंभाई ली।'
        picture:
