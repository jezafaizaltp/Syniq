  - code: hin9.u5.vyakaran
    title: "व्याकरण: परसर्ग का, के, की और मुहावरे"
    after: [hin9.u5.raja_vidrohi]
    notes: |
      पाठ से: "राजचारण की चापलूसी सुन-सुनकर जनता के कान झनझना रहे हैं।" "मुझे पता है, नमक का गुण वह
      गाएगा ही।" रिक्त स्थान: नाटक के पात्र मंच पर आते हैं; राजा की वेश-भूषा सुंदर थी; बच्चों का नाटक
      जोशीला था। 'का/के/की' बाद में आनेवाली संज्ञा के लिंग और वचन के अनुसार बदलता है। मुहावरे: कान
      झनझनाना, नमक का गुण गाना, दिल पर हाथ रखकर कहना, हाथ मज़बूत करना, जनता की भीड़ में मिल जाना।
    explanations:
      text: "'का, के, की' दो संज्ञाओं का संबंध बताते हैं; रूप दूसरी संज्ञा से तय होता है: राजा का मुकुट, राजा की इच्छा, राजा के सैनिक।"
      visual: "तालिका: का → पुल्लिंग एकवचन (बच्चों का नाटक) | की → स्त्रीलिंग (राजा की वेश-भूषा) | के → पुल्लिंग बहुवचन या परसर्ग से पहले (नाटक के पात्र, राजा के सामने)।"
      step_by_step: "1. 'का/के/की' के बाद वाली संज्ञा देखें। 2. स्त्रीलिंग है? → की। 3. पुल्लिंग बहुवचन या उसके बाद परसर्ग? → के। 4. पुल्लिंग एकवचन → का।"
      real_world: "रोज़ की बात: 'माँ की साड़ी', 'पिताजी का फ़ोन', 'दोस्तों के बस्ते': बोलते समय ध्यान दें कि 'का/की/के' किस शब्द से मेल खा रहा है।"
    activity:
      type: sort
      prompt: खाली जगह में का, के या की? बाद में आनेवाली संज्ञा देखो।
      bins:
      - का
      - के
      - की
      items:
      - label: बच्चों ___ नाटक
        bin: का
        clue: '''नाटक'' पुल्लिंग एकवचन है या बहुवचन?'
        why: 'नाटक पुल्लिंग एकवचन: का।'
      - label: नमक ___ गुण
        bin: का
        clue: '''गुण'' का लिंग?'
        why: 'गुण पुल्लिंग एकवचन: का।'
      - label: नाटक ___ पात्र मंच पर आते हैं
        bin: के
        clue: '''आते हैं'': पात्र एक है या कई?'
        why: 'पात्र बहुवचन: के।'
      - label: जनता ___ कान झनझना रहे हैं
        bin: के
        clue: कान एक है या दो?
        why: 'कान बहुवचन (रहे हैं): के।'
      - label: राजा ___ वेश-भूषा
        bin: की
        clue: '''वेश-भूषा'' स्त्रीलिंग है?'
        why: 'वेश-भूषा स्त्रीलिंग: की।'
      - label: राजचारण ___ चापलूसी
        bin: की
        clue: '''चापलूसी'' का लिंग?'
        why: 'चापलूसी स्त्रीलिंग: की।'
    lesson:
      - teach: 'परसर्ग ''का, के, की'' दो संज्ञाओं का संबंध बताते हैं। इनका रूप बाद में आनेवाली संज्ञा से तय होता है: राजा का मुकुट (मुकुट पुल्लिंग एकवचन), नाटक के पात्र (पात्र पुल्लिंग बहुवचन), राजा की वेश-भूषा (वेश-भूषा स्त्रीलिंग)।'
        check:
          prompt: '''राजा ___ मुकुट'' — सही परसर्ग?'
          options:
          - का
          - की
          - के
          answer: का
          why: मुकुट पुल्लिंग, एकवचन।
        ways:
        - style: step_by_step
          teach: 'का, के, की चुनने के लिए बाद में आनेवाली संज्ञा देखो, पहले वाली नहीं। पुल्लिंग एकवचन: का (राजा का मुकुट)। पुल्लिंग बहुवचन: के (नाटक के पात्र)। स्त्रीलिंग: की (राजा की वेश-भूषा)। ये परसर्ग दो संज्ञाओं का संबंध बताते हैं।'
      - teach: 'पाठ से उदाहरण: ''राजचारण की चापलूसी सुन-सुनकर जनता के कान झनझना रहे हैं।'' यहाँ ''चापलूसी'' स्त्रीलिंग है, इसलिए ''की''; ''कान'' बहुवचन है, इसलिए ''के''।'
        picture:
          kind: compare
          columns:
          - title: का (पुल्लिंग एकवचन)
            points:
            - राजा का मुकुट
            - बच्चों का नाटक
            - नमक का गुण
          - title: के (पुल्लिंग बहुवचन)
            points:
            - नाटक के पात्र
            - जनता के कान
          - title: की (स्त्रीलिंग)
            points:
            - राजा की वेश-भूषा
            - राजचारण की चापलूसी
          alt: '''का'', ''के'', ''की'' के उदाहरण, बाद वाली संज्ञा के अनुसार।'
        check:
          prompt: '''जनता ___ कान'' — सही परसर्ग?'
          options:
          - के
          - का
          - की
          answer: के
          why: कान यहाँ बहुवचन है।
        ways:
        - style: step_by_step
          teach: 'पाठ के वाक्य पर नियम लगाओ: ''राजचारण की चापलूसी सुन-सुनकर जनता के कान झनझना रहे हैं।'' पहला जोड़ा: राजचारण ___ चापलूसी — बाद वाली संज्ञा ''चापलूसी'' स्त्रीलिंग है, इसलिए ''की''। दूसरा जोड़ा: जनता ___ कान — ''कान'' यहाँ बहुवचन है, इसलिए ''के''।'
      - teach: 'मुहावरे: ''कान झनझनाना'' = बहुत सुनकर चैन खो जाना; ''नमक का गुण गाना'' = खाए हुए का एहसान मानना; ''दिल पर हाथ रखकर कहना'' = पूरी ईमानदारी से कहना; ''हाथ मज़बूत करना'' = साथ देकर शक्ति बढ़ाना।'
        check:
          prompt: '''हाथ मज़बूत करना'' का अर्थ?'
          options:
          - साथ देकर शक्ति बढ़ाना
          - कसरत करना
          - हाथ धोना
          answer: साथ देकर शक्ति बढ़ाना
          why: मुहावरे का अर्थ शब्दों से अलग है।
        ways:
        - style: real_world
          teach: मुहावरों को रोज़ की बातों में रखो। लाउडस्पीकर पर घंटों भाषण सुनकर 'कान झनझनाना' = बहुत सुनकर चैन खो जाना। जिसके घर खाया, उसकी तारीफ़ करना 'नमक का गुण गाना' = खाए हुए का एहसान मानना। सच्चे मन से वादा करना 'दिल पर हाथ रखकर कहना' = पूरी ईमानदारी से कहना। दोस्त का साथ देना 'हाथ मज़बूत करना' = साथ देकर शक्ति बढ़ाना।
    items:
      - prompt: "'राजा ___ वेश-भूषा सुंदर थी।'"
        options: ["की", "का", "के", "को"]
        answer: "की"
        difficulty: 1
        hints: ["वेश-भूषा स्त्रीलिंग।"]
        solution: "राजा की वेश-भूषा।"
        mistakes: {"का": hin_parsarg}
      - prompt: "'नाटक ___ पात्र मंच पर आते हैं।'"
        options: ["के", "का", "की", "को"]
        answer: "के"
        difficulty: 1
        hints: ["पात्र: बहुवचन।"]
        solution: "नाटक के पात्र।"
        mistakes: {"का": hin_parsarg}
      - prompt: "'बच्चों ___ नाटक जोशीला था।'"
        options: ["का", "की", "के", "से"]
        answer: "का"
        difficulty: 2
        hints: ["नाटक: पुल्लिंग एकवचन।"]
        solution: "बच्चों का नाटक।"
        mistakes: {"की": hin_parsarg}
      - prompt: "'कान झनझनाना' का अर्थ?"
        options: ["चैन खो जाना", "बहुत अच्छा संगीत सुनना", "कान में दर्द होना", "चुप हो जाना"]
        answer: "चैन खो जाना"
        difficulty: 2
        hints: ["चापलूसी सुन-सुनकर जनता परेशान है।"]
        solution: "कान झनझनाना = चैन खो जाना।"
        mistakes: {"कान में दर्द होना": hin_play_idiom}
      - prompt: "'नमक का गुण गाना' का अर्थ?"
        options: ["उपकार माननेवाला होना, खाने का एहसान मानना", "नमक की तारीफ़ करना", "खाना बनाना", "गाना गाना"]
        answer: "उपकार माननेवाला होना, खाने का एहसान मानना"
        difficulty: 3
        hints: ["राजा राजचारण के बारे में कहता है: वह मेरा नमक खाता है।"]
        solution: "जिसका दिया खाया, उसके प्रति वफ़ादार रहना।"
        mistakes: {"नमक की तारीफ़ करना": hin_play_idiom}
      - prompt: "'जनता ___ आवाज़ और सैनिकों ___ हथियार' — सही परसर्ग चुनें।"
        options: ["की, के", "का, की", "के, का", "की, का"]
        answer: "की, के"
        difficulty: 3
        hints: ["'आवाज़' स्त्रीलिंग है।", "'हथियार' यहाँ बहुवचन है।"]
        solution: "Step 1: आवाज़ स्त्रीलिंग: 'जनता की आवाज़'। Step 2: हथियार बहुवचन: 'सैनिकों के हथियार'।"
        mistakes: {"का, की": hin_parsarg, "के, का": hin_parsarg, "की, का": hin_parsarg}
      - prompt: "किस वाक्य में 'हाथ मज़बूत करना' मुहावरे का सही प्रयोग है?"
        options: ["गाँव वालों ने साथ आकर पंचायत के हाथ मज़बूत किए।", "उसने कसरत करके अपने हाथ मज़बूत किए।", "डॉक्टर ने टूटे हाथ पर पट्टी बाँधी।", "उसने हाथ धोकर खाना खाया।"]
        answer: "गाँव वालों ने साथ आकर पंचायत के हाथ मज़बूत किए।"
        difficulty: 3
        hints: ["मुहावरे में असली हाथ की बात नहीं होती।", "किस वाक्य में 'साथ देकर ताकत बढ़ाना' का अर्थ है?"]
        solution: "Step 1: 'हाथ मज़बूत करना' = किसी का साथ देकर उसकी ताकत बढ़ाना। Step 2: केवल पंचायत वाले वाक्य में यह अर्थ है; बाकी में असली हाथ की बात है।"
        mistakes: {"उसने कसरत करके अपने हाथ मज़बूत किए।": hin_play_idiom, "डॉक्टर ने टूटे हाथ पर पट्टी बाँधी।": hin_play_idiom, "उसने हाथ धोकर खाना खाया।": hin_play_idiom}
      - prompt: '''सेनापति ___ तलवार'' — सही परसर्ग?'
