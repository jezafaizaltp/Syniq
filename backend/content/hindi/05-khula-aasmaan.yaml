subject: hin
chapter: 5
title: "इकाई पाँच - खुला आसमान"

tips:
  hin_raja_play: "'राजा और विद्रोही' (रवींद्रनाथ ठाकुर, अनुवाद अमर गोस्वामी): बच्चों के खेल में राजेन राजा बनता है। लड़ाई का मज़ा लेने के लिए वह हेम को दुश्मन बनाता है (जंभाई लेने और हाथी के सामने थूकने का 'अपराध')। जनता, न्यायाधीश और सेना हेम के साथ हो जाते हैं; राजा मुकुट उतारकर जनता की भीड़ में मिल जाता है।"
  hin_bonsai: "'बोनज़ाई' (सुधा उपाध्याय): पेड़ को आँगन से खोदकर गमले में ड्राइंग रूम की सजावट बना दिया गया; फल-फूल लगने पर मालिक डर गया और उसे घूरे पर फेंक दिया, जहाँ उसकी जड़ें और फैल गईं। बोनज़ाई किसी को सीमित करके रखने का प्रतीक है।"
  hin_parsarg: "परसर्ग 'का, के, की' संबंध बताते हैं और बाद वाली संज्ञा के लिंग-वचन से बदलते हैं: राजा की वेश-भूषा (स्त्रीलिंग), बच्चों का नाटक (पुल्लिंग एकवचन), नाटक के पात्र (बहुवचन)।"
  hin_play_idiom: "मुहावरे: कान झनझनाना = चैन खो जाना; नमक का गुण गाना = उपकार माननेवाला होना; दिल पर हाथ रखकर कहना = ईमानदारी से कहना; हाथ मज़बूत करना = शक्ति देना; जनता की भीड़ में मिल जाना = आम आदमी बन जाना।"

concepts:
  - code: hin9.u5.raja_vidrohi
    title: राजा और विद्रोही
    notes: |
      रवींद्रनाथ ठाकुर (जन्म कोलकत्ता; गीतांजलि) का नाटक, अनुवादक अमर गोस्वामी। पात्र: राजेन (राजा),
      जितेन (मंत्री), उपेन (न्यायाधीश), हेम (विद्रोही), सेनापति, सैनिक, जनता, मति। पहला दृश्य: राजेन
      कहता है "मैं तुम लोगों का राजा हूँ... क्योंकि मैं तुम सबसे बड़ा हूँ"; हेम: इससे साबित नहीं होता कि तुम
      सबसे बलवान हो; झगड़ा; मति: "यह सिर्फ़ खेल है... बाद में तुम्हारी भी राजा बनने की बारी आएगी।"
      दूसरा दृश्य: राजा सेनापति से नाराज़; "दुश्मन नहीं है? तो फिर दुश्मन बनाओ", नहीं तो खाली बैठे सैनिक
      मुझपर ही हमला कर देंगे। जनता: "हम किसीसे डरते नहीं। लेकिन हम महाराज से लड़ना नहीं चाहते!"
      सेनापति हेम पर आरोप लगाता है कि राजा के गुज़रते समय उसने जंभाई ली। तीसरा दृश्य: न्यायाधीश: "राजा
      की इच्छा के सामने हमें सिर झुकाना ही पड़ेगा"; जनता: "अगर आप न्यायाधीश का कर्तव्यपालन नहीं कर सकते
      तो... कोई फ़ैसला हम नहीं मानेंगे।" राजा: हेम ने राजमहल के हाथी के सामने थूक दिया था; "लड़ाई के
      आनंद और उल्लास से तुम लोग मुझे अलग करना चाहते हो"। जनता हेम की तरफ़ हो जाती है; सैनिक भाग जाते
      हैं; हेम: "आप बंदी हैं... जनता के दरबार में आप अपराधी हैं।" न्यायाधीश: न्याय अब इन्हीं के हाथ में है;
      "राजमुकुट उतार दीजिए। जनता की भीड़ में मिल जाइए।" राजचारण की चापलूसी; दरबारी कवि अब विजयी
      जनता की गौरव गाथा लिख रहा है। राजा हेम को बधाई देता है और सलाह: राजचारण का पद खत्म कर देना।
      इकाई मुखपृष्ठ: एब्राहम लिंकन — "जो लोग दूसरों को आज़ादी नहीं देते उन्हें खुद भी इसका हक नहीं होगा।"
      व्याकरण: परसर्ग का/के/की; मुहावरे।
    explanations:
      text: "बच्चों के खेल के रूप में यह नाटक दिखाता है कि जो राजा बिना कारण लड़ाई चाहता है और न्याय नहीं करता, उसका अधिकार जनता छीन लेती है। असली शक्ति जनता के हाथ में है।"
      visual: "तीन दृश्यों की पट्टी: 1. खेल में राजा चुना गया → 2. दुश्मन बनाने का आदेश; हेम पर जंभाई का आरोप → 3. अदालत में जनता का प्रश्न; सेना और न्याय जनता के साथ; राजा मुकुट उतारता है।"
      step_by_step: "राजा का चरित्र: 1. खुद को बड़ा मानता है। 2. लड़ाई में आनंद लेता है। 3. छोटी-सी बात (जंभाई) को अपमान बनाता है। 4. चापलूसी पसंद करता है। 5. अंत में हार मानकर हेम को बधाई देता है।"
      real_world: "कक्षा में मॉनिटर या टीम कप्तान का काम सबकी भलाई है, अपना रौब दिखाना नहीं। अगर कोई नियम अन्यायपूर्ण लगे, तो उसके खिलाफ़ शांति से और मिलकर आवाज़ उठाई जा सकती है।"
    items:
      - prompt: "'राजा और विद्रोही' नाटक के मूल रचनाकार कौन हैं?"
        options: ["रवींद्रनाथ ठाकुर", "अमर गोस्वामी", "प्रेमचंद", "सुधा उपाध्याय"]
        answer: "रवींद्रनाथ ठाकुर"
        difficulty: 1
        hints: ["अमर गोस्वामी अनुवादक हैं।"]
        solution: "रवींद्रनाथ ठाकुर (अनुवाद: अमर गोस्वामी)।"
        mistakes: {"अमर गोस्वामी": hin_author_work}
      - prompt: "नाटक में राजा कौन बनता है?"
        options: ["राजेन", "हेम", "जितेन", "उपेन"]
        answer: "राजेन"
        difficulty: 1
        hints: ["'मैं तुम लोगों का राजा हूँ... क्योंकि मैं तुम सबसे बड़ा हूँ।'"]
        solution: "राजेन (महाराज राजेंद्र)।"
        mistakes: {"हेम": hin_raja_play}
      - prompt: "नाटक में न्यायाधीश कौन बनता है?"
        options: ["उपेन", "जितेन", "मति", "हेम"]
        answer: "उपेन"
        difficulty: 1
        hints: ["जितेन मंत्री बना।"]
        solution: "उपेन।"
        mistakes: {"जितेन": hin_read_again}
      - prompt: "राजा सेनापति से क्यों नाराज़ था?"
        options: ["उसने अब तक किसी लड़ाई की तैयारी नहीं की थी", "उसने खज़ाना चुरा लिया था", "वह देर से आया था", "उसने हेम को बंदी बना लिया था"]
        answer: "उसने अब तक किसी लड़ाई की तैयारी नहीं की थी"
        difficulty: 2
        hints: ["'तुममें किसी बात का जोश नहीं रहा।'"]
        solution: "राजा लड़ाई चाहता था; सेनापति कहता है: कोई दुश्मन तो है ही नहीं।"
        mistakes: {"उसने खज़ाना चुरा लिया था": hin_raja_play}
      - prompt: "सेनापति ने हेम पर राजा का अपमान करने का क्या आरोप लगाया?"
        options: ["राजा के गुज़रते समय वह खिड़की के पास खड़ा होकर जंभाई ले रहा था", "उसने राजा को थप्पड़ मारा", "उसने खज़ाना लूटा", "उसने राजमुकुट छीना"]
        answer: "राजा के गुज़रते समय वह खिड़की के पास खड़ा होकर जंभाई ले रहा था"
        difficulty: 2
        hints: ["तीनों सैनिक हँसे: 'जंभाई ले रहा था। हा हा हा!!!'"]
        solution: "जंभाई लेना; बाद में राजा ने हाथी के सामने थूकने की बात भी कही।"
        mistakes: {"उसने राजा को थप्पड़ मारा": hin_raja_play}
      - prompt: "'राजा की इच्छा के सामने हमें सिर झुकाना ही पड़ेगा' — यह किसने कहा और इससे क्या पता चलता है?"
        options: ["न्यायाधीश ने; आदेशों का अंधा अनुसरण", "जनता ने; अधिकारी के प्रति वफ़ादारी", "हेम ने; विद्रोह", "राजा ने; युद्ध का आनंद"]
        answer: "न्यायाधीश ने; आदेशों का अंधा अनुसरण"
        difficulty: 2
        hints: ["तीसरे दृश्य की शुरुआत।"]
        solution: "न्यायाधीश; न्याय के बजाय राजा की इच्छा मानना।"
        mistakes: {"जनता ने; अधिकारी के प्रति वफ़ादारी": hin_raja_play}
      - prompt: "लड़ाई के बिना ही राजा ने अपना अधिकार जनता को क्यों सौंप दिया?"
        options: ["जनता, सेना और न्याय सब हेम के साथ हो गए; राजा के पास कोई शक्ति नहीं बची", "राजा बीमार हो गया", "हेम ने राजा को हरा दिया", "मति ने खेल बंद कर दिया"]
        answer: "जनता, सेना और न्याय सब हेम के साथ हो गए; राजा के पास कोई शक्ति नहीं बची"
        difficulty: 3
        hints: ["न्यायाधीश: 'न्याय इन्हींके हाथ में है। और इनके साथ पूरी सेना भी है।'"]
        solution: "राजा की शक्ति जनता से थी; जनता हटी तो शक्ति भी गई।"
        mistakes: {"हेम ने राजा को हरा दिया": hin_raja_play}

  - code: hin9.u5.bonsai
    title: बोनज़ाई
    notes: |
      सुधा उपाध्याय (जन्म उत्तरप्रदेश; रचनाएँ: इसलिए कहूँगी मैं, बोलती चुप्पी, पाठ-पुनर्पाठ) की कविता।
      पेड़ (कविता में बोलनेवाला 'मैं', स्त्रीलिंग रूप: 'तब्दील हो गई') कहता है: "तुमने आँगन से खोदकर / मुझे
      लगा दिया सुंदर गमले में / फिर सजा लिया घर के ड्राइंग रूम में / हर आने जाने वाला बड़ी हसरत से देखता है /
      और धीरे-धीरे मैं बोनज़ाई में तब्दील हो गई।" "मौसम ने फिर करवट ली / मुझमें लगे फल फूल ने तुम्हें फिर
      डराया / अबकी तुमने मुझे उखाड़ फेंका घूरे पर / आओ देखकर जाओ / यहाँ मेरी जड़ें और फैल गई हैं।"
      बोनज़ाई = प्रतीक: किसी (जैसे स्त्री या कोई व्यक्ति) को सजावट बनाकर सीमित रखना; जब वह फलने-फूलने
      लगे तो डरना और उसे फेंक देना; पर आज़ादी मिलते ही उसकी जड़ें और फैलती हैं। इकाई 'खुला आसमान'।
    explanations:
      text: "गमले में बंद पेड़ सुंदर दिखता है, पर बढ़ नहीं पाता। घूरे पर फेंके जाने के बाद ही उसे खुली ज़मीन मिलती है और उसकी जड़ें फैल जाती हैं। कविता कहती है: किसी को दबाकर रखने से उसकी शक्ति खत्म नहीं होती।"
      visual: "तीन चित्र: आँगन का पेड़ → ड्राइंग रूम के गमले में छोटा बोनज़ाई (देखते मेहमान) → घूरे पर फेंका गया पेड़, जिसकी जड़ें चारों ओर फैल रही हैं।"
      step_by_step: "1. आँगन से गमला: आज़ादी छिनी। 2. ड्राइंग रूम: केवल सजावट। 3. बोनज़ाई बनना: विकास रुका। 4. फल-फूल: फिर भी जीवन है; मालिक डरता है। 5. घूरा: फेंक दिया। 6. जड़ें और फैलीं: आज़ादी में असली विकास।"
      real_world: "किसी बच्चे को केवल 'अच्छा दिखने' के लिए उसके शौक और सपनों से दूर रखना भी उसे बोनज़ाई बनाना है। हर किसी को बढ़ने के लिए 'खुला आसमान' चाहिए।"
    items:
      - prompt: "'बोनज़ाई' कविता किसने लिखी?"
        options: ["सुधा उपाध्याय", "वंदना टेटे", "पुष्पा मेहरा", "रवींद्रनाथ ठाकुर"]
        answer: "सुधा उपाध्याय"
        difficulty: 1
        hints: ["'बोलती चुप्पी' उनकी रचना।"]
        solution: "सुधा उपाध्याय।"
        mistakes: {"वंदना टेटे": hin_author_work}
      - prompt: "पेड़ को आँगन से खोदकर कहाँ लगाया गया?"
        options: ["सुंदर गमले में", "घूरे पर", "जंगल में", "खेत में"]
        answer: "सुंदर गमले में"
        difficulty: 1
        hints: ["फिर उसे ड्राइंग रूम में सजाया गया।"]
        solution: "सुंदर गमले में।"
        mistakes: {"घूरे पर": hin_bonsai}
      - prompt: "मालिक ने बोनज़ाई को घूरे पर क्यों फेंक दिया?"
        options: ["उसमें लगे फल-फूल ने मालिक को डराया", "वह सूख गया था", "मेहमानों को पसंद नहीं आया", "गमला टूट गया"]
        answer: "उसमें लगे फल-फूल ने मालिक को डराया"
        difficulty: 2
        hints: ["'मौसम ने फिर करवट ली...'"]
        solution: "फल-फूल लगना = बढ़ना; यही मालिक को डरा गया।"
        mistakes: {"वह सूख गया था": hin_bonsai}
      - prompt: "'घूरे पर' का अर्थ?"
        options: ["कूड़े-कचरे में", "ऊँचे पहाड़ पर", "बगीचे में", "मंदिर में"]
        answer: "कूड़े-कचरे में"
        difficulty: 2
        hints: ["'मदद लें' देखें।"]
        solution: "घूरा = कूड़े का ढेर।"
        mistakes: {"बगीचे में": hin_word_meaning}
      - prompt: "'यहाँ मेरी जड़ें और फैल गई हैं' — इसका भाव?"
        options: ["आज़ादी मिलने पर दबाया गया जीवन और अधिक बढ़ता है", "पेड़ मर गया", "पेड़ फिर से गमले में जाना चाहता है", "घूरा पेड़ के लिए बुरा है"]
