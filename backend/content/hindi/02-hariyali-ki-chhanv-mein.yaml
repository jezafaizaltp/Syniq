subject: hin
chapter: 2
title: "इकाई दो - हरियाली की छाँव में"

tips:
  hin_animals_home: "कहानी में घर के जीव दीवारों और छत को कैसे देखते हैं? और फ़रहाद उन्हें भगाते हैं या साथ रहने देते हैं?"
  hin_ghar_story: "कहानी फिर से पढ़ो: छिपकली किस आदमी के साथ नए घर जा रही है? घर में और कौन-कौन से जीव रहते हैं, और घर का मालिक उनके साथ कैसा बर्ताव करता है?"
  hin_phool_poem: "'फूल' (रामदरश मिश्र): कवि बाज़ार से प्लास्टिक के फूल लाकर आँगन के असली फूल उखाड़ देते हैं। हवा गंध, मधुमक्खी रस, तितली कोमल स्पर्श माँगती है; जब बच्चा 'फूलों की पहचान' के लिए फूल माँगता है, तब कवि प्लास्टिक के फूल तोड़कर फिर मिट्टी गोड़ने लगते हैं।"
  hin_sentence_grow: "वाक्य बढ़ाना: मूल वाक्य (उन्होंने लाइट जलाई) में एक-एक करके विशेषण और स्थान जोड़ें: हर जगह की → मकान में → नए → अपने → दो कमरे, किचन और बरामदे वाले।"
  hin_adverb: "क्रिया-विशेषण क्रिया के बारे में बताता है। 'आहिस्ते-से' सुनकर पूछो: काम कब हुआ, कहाँ हुआ, या किस ढंग से हुआ?"
  hin_chahiye: "'चाहिए' के साथ कर्ता में 'को' या उसका रूप आता है: मुझे (मुझको), हमें, उसे, बच्चे को फूल चाहिए। 'मैं चाहिए' गलत है।"
  h2_ghar_who: 'मकान नंबर 205 के सब रहने वालों की सूची पाठ में फिर से पढ़ो: कौन कब आया, कौन क्या करता है, किसके बारे में कौन-सी बात कही गई है।'
  h2_ghar_place: 'छिपकली के दो घर थे: पहले वाला, जहाँ उसे भगाया जाता था, और नया, जहाँ सब साथ रहते हैं। सवाल किस घर के बारे में है?'
  h2_ghar_value: फ़रहाद घर को सबका मानते हैं, केवल अपना नहीं। यह उत्तर उनकी इस सोच से मेल खाता है या नहीं, देखो।
  h2_phool_who: 'कविता में किसने क्या माँगा, क्रम से याद करो: हवा, मधुमक्खी, तितली, माँ, पत्नी, फिर बच्चा।'
  h2_phool_real: कवि असली और प्लास्टिक के फूलों की तुलना कर रहे हैं। असली फूल को क्या-क्या चाहिए, और प्लास्टिक वाले में क्या नहीं होता?
  h2_expand_order: बढ़े हुए वाक्य में हर नया शब्द उसी चीज़ के पास आता है जिसके बारे में वह बताता है। शब्दों का क्रम ज़ोर से पढ़कर जाँचो।
  h2_kaise_kab: क्रिया-विशेषण बताता है कि काम कैसे, कब या कहाँ हुआ। इस शब्द से कौन-सा सवाल हल होता है?

concepts:
  - code: hin9.u2.ghar
    title: घर
    notes: |
      प्रभात (जन्म राजस्थान) की कहानी। छिपकली सड़क पार करते हुए गिरगिट से मिलती है; वह श्रीमान फ़रहाद
      के साथ उनके नए घर जा रही है। पहले वह श्रीमती शांतिदास के साथ रही, जो उसे देखते ही चिल्लाती थीं
      ("सुशांतो जल्दी आओ, इसे भगाओ!"); वहाँ एक सप्ताह भी न टिक सकी। फ़रहाद के पास किताबों की बड़ी
      अलमारियाँ थीं; "छिपकलियों के पीछे झाड़ू लेकर पड़े रहने वालों में से वो नहीं हैं।" नीम सराय के मकान
      नंबर 205 में मकड़ी (कल ही आई), दस-पंद्रह मक्खियाँ और सौ के आसपास मच्छर, काली चींटी, ततैया
      (चाय पर बुलाती है), आता-जाता चूहा ("सुना है पत्रकार है"), दिन में चिड़ियाँ, बाहर गिलहरी। ततैया:
      "हमारी तरह दीवारों, खिड़कियों या छत से उनका खास लेना-देना नहीं है।" फ़रहाद के सपने में छिपकली ने
      अंडे दिए, मकड़ी ने बड़ा जाला बुना; वे खुश हैं कि परिवार बढ़ रहा है। सुबह चप्पल पर बैठी तीन नन्हीं
      मेंढकियों को हथेली पर रखकर बाहर टहलाते हैं; आइने में छिपकली से पहली मुलाकात। संदेश: प्रकृति सबका
      घर है। व्याकरण: वाक्य बढ़ाना; क्रिया-विशेषण।
    explanations:
      text: "यह कहानी जीवों की नज़र से दिखाती है कि एक घर में केवल इनसान नहीं रहते। फ़रहाद जैसे लोग सब जीवों के साथ मिलकर रहना जानते हैं; यही सच्चा 'घर' है।"
      visual: "मकान नंबर 205 का नक्शा: अलमारी के पीछे छिपकली, कोने में मकड़ी का जाला, परदे के पीछे ततैया, दीवार की पपड़ी में चींटी, बाहर पेड़ पर गिलहरी, चप्पल पर तीन मेंढकियाँ, और बीच में सोते फ़रहाद।"
      step_by_step: "1. छिपकली और गिरगिट की बातचीत (पुराने मालिक)। 2. नए घर में बाकी जीवों से मुलाकात। 3. ततैया के यहाँ चाय। 4. फ़रहाद का सपना। 5. सुबह मेंढकियाँ और आइने में छिपकली। 6. संदेश: प्रकृति सबका घर।"
      real_world: "घर में छिपकली या मकड़ी दिखे तो उसे मारने के बजाय सोचें: ये मच्छर-मक्खी खाकर हमारी मदद भी करती हैं।"
    activity:
      type: sort
      prompt: छिपकली ने यह किसके घर के बारे में बताया?
      bins:
      - श्रीमती शांतिदास
      - श्रीमान फ़रहाद
      items:
      - label: छिपकली को देखते ही चिल्लाती थीं
        bin: श्रीमती शांतिदास
        clue: छिपकली कहाँ एक सप्ताह भी नहीं टिक सकी?
        why: शांतिदास के घर में उसे देखते ही शोर होता था।
      - label: '"सुशांतो जल्दी आओ, इसे भगाओ!"'
        bin: श्रीमती शांतिदास
        clue: यह पुकार किसके घर की है?
        why: श्रीमती शांतिदास छिपकली को भगवाना चाहती थीं।
      - label: किताबों की बड़ी अलमारियाँ
        bin: श्रीमान फ़रहाद
        clue: छिपकली किसके साथ नए घर जा रही है?
        why: फ़रहाद के पास किताबों की बड़ी अलमारियाँ थीं।
      - label: झाड़ू लेकर पीछे नहीं पड़ते
        bin: श्रीमान फ़रहाद
        clue: किसके घर में छिपकली चैन से रह सकती है?
        why: फ़रहाद 'छिपकलियों के पीछे झाड़ू लेकर पड़े रहने वालों में से' नहीं।
      - label: नीम सराय का मकान नंबर 205
        bin: श्रीमान फ़रहाद
        clue: मकड़ी, ततैया और चूहा किस मकान में रहते हैं?
        why: यह फ़रहाद का नया मकान है।
    lesson:
      - teach: '''घर'' प्रभात (जन्म राजस्थान) की कहानी है। एक छिपकली सड़क पार करते हुए गिरगिट से मिलती है। वह श्रीमान फ़रहाद के साथ उनके नए घर जा रही है। पहले वह श्रीमती शांतिदास के घर रही, जो उसे देखते ही चिल्लाती थीं: ''सुशांतो जल्दी आओ, इसे भगाओ!'' वहाँ वह एक सप्ताह भी न टिक सकी।'
        check:
          prompt: श्रीमती शांतिदास के घर छिपकली कितने दिन टिक सकी?
          options:
          - एक सप्ताह भी नहीं
          - एक साल
          - कई महीने
          answer: एक सप्ताह भी नहीं
          why: वे उसे देखते ही भगाना चाहती थीं।
      - teach: 'फ़रहाद के पास किताबों की बड़ी अलमारियाँ हैं; वे ''छिपकलियों के पीछे झाड़ू लेकर पड़े रहने वालों में से नहीं हैं।'' नीम सराय के मकान नंबर 205 में पहले से कई रहने वाले हैं: मकड़ी (कल ही आई), मक्खियाँ, मच्छर, काली चींटी, ततैया (जो चाय पर बुलाती है), चूहा (''सुना है पत्रकार है''), चिड़ियाँ और बाहर गिलहरी।'
        picture:
          kind: compare
          columns:
          - title: घर के अंदर
            points:
            - मकड़ी
            - मक्खियाँ, मच्छर
            - काली चींटी
            - ततैया
            - चूहा
          - title: बाहर / आते-जाते
            points:
            - दिन में चिड़ियाँ
            - गिलहरी
            - चप्पल पर मेंढकियाँ
          alt: मकान नंबर 205 में रहने वाले जीव, अंदर और बाहर।
        check:
          prompt: '''सुना है पत्रकार है'' — यह किसके बारे में कहा गया है?'
          options:
          - चूहे
          - मकड़ी
          - गिलहरी
          answer: चूहे
          why: आता-जाता चूहा, जिसे पत्रकार कहा गया।
      - teach: 'फ़रहाद के सपने में छिपकली ने अंडे दिए, मकड़ी ने बड़ा जाला बुना; वे खुश हैं कि परिवार बढ़ रहा है। सुबह वे चप्पल पर बैठी तीन नन्हीं मेंढकियों को हथेली पर रखकर बाहर टहलाते हैं। कहानी का संदेश: प्रकृति सबका घर है; घर केवल मनुष्य का नहीं।'
        check:
          prompt: सपने में परिवार बढ़ता देख फ़रहाद को कैसा लगा?
          options:
          - खुशी हुई
          - डर लगा
          - गुस्सा आया
          answer: खुशी हुई
          why: वे सब जीवों को अपने घर का हिस्सा मानते हैं।
    items:
      - prompt: "'घर' कहानी के रचनाकार कौन हैं?"
        options: ["प्रभात", "रामदरश मिश्र", "प्रेमचंद", "पुष्पा मेहरा"]
        answer: "प्रभात"
        difficulty: 1
        hints: ["जन्म राजस्थान में।"]
        solution: "प्रभात।"
        mistakes: {"पुष्पा मेहरा": hin_author_work}
      - prompt: "छिपकली किसके नए घर में जा रही है?"
        options: ["श्रीमान फ़रहाद के", "श्रीमती शांतिदास के", "गिरगिट के", "सुशांतो के"]
        answer: "श्रीमान फ़रहाद के"
        difficulty: 1
        hints: ["जिनके पास किताबों की बड़ी अलमारियाँ थीं।"]
