  - code: hin9.u2.vyakaran
    title: "व्याकरण: वाक्य बढ़ाना और 'चाहिए'"
    after: [hin9.u2.ghar]
    notes: |
      वाक्य बढ़ाना: "उन्होंने लाइट जलाई" → "उन्होंने हर जगह की लाइट जलाई" → "...मकान में हर जगह की..."
      → "...नए मकान में..." → "...अपने नए मकान में..." → "उन्होंने दो कमरे, किचन और बरामदे वाले अपने
      नए मकान में हर जगह की लाइट जलाई।" क्रिया-विशेषण: रंग बदलते हुए कहा, आहिस्ते-से उठाया, चारों
      ओर नज़र घुमाकर देखा। 'चाहिए': हमें फूलों की गंध चाहिए; मुझे वेणी के लिए फूल चाहिए; हमें रस चाहिए।
    explanations:
      text: "छोटे वाक्य में विशेषण, स्थान और क्रिया-विशेषण जोड़कर उसे अधिक जानकारी वाला बनाया जा सकता है। 'चाहिए' के साथ कर्ता 'मुझे, हमें, उसे' रूप में आता है।"
      visual: "सीढ़ी: फ़रहाद टहलने निकला → फ़रहाद सुबह टहलने निकला → फ़रहाद सुबह मेंढकियों के साथ टहलने निकला → फ़रहाद सुबह तीन नन्हीं मेंढकियों के साथ धीरे-धीरे टहलने निकला।"
      step_by_step: "1. मूल वाक्य: कर्ता + क्रिया। 2. कब? (समय)। 3. कहाँ? (स्थान)। 4. कैसे? (क्रिया-विशेषण)। 5. किसके साथ / कैसा? (विशेषण)।"
      real_world: "डायरी लिखते समय 'मैं स्कूल गया' के बदले 'मैं आज सुबह दोस्त के साथ साइकिल से स्कूल गया' लिखें: पढ़ने वाले को पूरा चित्र मिलेगा।"
    activity:
      type: order
      prompt: वाक्य कैसे बढ़ता गया? छोटे से बड़े वाक्य तक क्रम से लगाओ।
      steps:
      - उन्होंने लाइट जलाई।
      - उन्होंने हर जगह की लाइट जलाई।
      - उन्होंने मकान में हर जगह की लाइट जलाई।
      - उन्होंने नए मकान में हर जगह की लाइट जलाई।
      - उन्होंने अपने नए मकान में हर जगह की लाइट जलाई।
      reasons:
        उन्होंने हर जगह की लाइट जलाई।: इसमें पिछला पूरा वाक्य है, साथ में 'हर जगह की' जुड़ा।
        उन्होंने मकान में हर जगह की लाइट जलाई।: 'पिछले वाक्य में ''मकान में'' जुड़ा: कहाँ की हर जगह?'
        उन्होंने नए मकान में हर जगह की लाइट जलाई।: '''नए'' मकान का विशेषण है: पहले ''मकान'' आना चाहिए।'
        उन्होंने अपने नए मकान में हर जगह की लाइट जलाई।: '''अपने'' जुड़ा: इसमें पिछले वाक्य के सारे शब्द हैं।'
    lesson:
      - teach: 'छोटे वाक्य में नए शब्द जोड़कर उसे बढ़ा सकते हैं, जिससे जानकारी बढ़ती है: ''उन्होंने लाइट जलाई'' → ''उन्होंने हर जगह की लाइट जलाई'' → ''उन्होंने अपने नए मकान में हर जगह की लाइट जलाई।'' हर नया शब्द उसी के पास आता है जिसके बारे में वह बताता है।'
        check:
          prompt: '''उन्होंने लाइट जलाई'' में ''हर जगह की'' कहाँ जुड़ेगा?'
          options:
          - '''लाइट'' से पहले'
          - '''जलाई'' के बाद'
          - '''उन्होंने'' से पहले'
          answer: '''लाइट'' से पहले'
          why: यह लाइट के बारे में बताता है।
      - teach: 'क्रिया-विशेषण बताते हैं कि काम कैसे, कब या कहाँ हुआ: ''आहिस्ते-से उठाया'' (कैसे), ''चारों ओर नज़र घुमाकर देखा'' (कैसे), ''रंग बदलते हुए कहा'' (कैसे)।'
        picture:
          kind: flow
          steps:
          - उन्होंने लाइट जलाई
          - + हर जगह की
          - + मकान में
          - + नए
          - + अपने
          - + दो कमरे, किचन और बरामदे वाले
          alt: एक छोटे वाक्य में एक-एक करके शब्द जोड़कर उसे बढ़ाना।
        check:
          prompt: '''आहिस्ते-से'' किस सवाल का उत्तर देता है?'
          options:
          - कैसे?
          - कौन?
          - क्या?
          answer: कैसे?
          why: काम धीरे-से हुआ।
      - teach: '''चाहिए'' वाले वाक्यों में चाहने वाले के साथ ''को'' या उसका रूप आता है: मुझे (मुझको), हमें, उन्हें। ''हमें फूलों की गंध चाहिए।'' ''मुझे वेणी के लिए फूल चाहिए।'' ''मैं फूल चाहिए'' गलत है।'
        check:
          prompt: सही वाक्य कौन-सा है?
          options:
          - हमें पानी चाहिए।
          - हम पानी चाहिए।
          - हमने पानी चाहिए।
          answer: हमें पानी चाहिए।
          why: '''चाहिए'' के साथ ''हमें''।'
    items:
      - prompt: "'फ़रहाद ने चप्पल को आहिस्ते-से उठाया।' — 'आहिस्ते-से' क्या बताता है?"
        options: ["काम कैसे हुआ (धीरे-से)", "काम कब हुआ", "काम किसने किया", "चप्पल का रंग"]
        answer: "काम कैसे हुआ (धीरे-से)"
        difficulty: 1
        hints: ["यह क्रिया-विशेषण है।"]
        solution: "आहिस्ते-से = धीरे-से; क्रिया की रीति।"
        mistakes: {"काम कब हुआ": hin_adverb}
      - prompt: "सही वाक्य चुनें:"
        options: ["मुझे पूजा के लिए फूल चाहिए।", "मैं पूजा के लिए फूल चाहिए।", "मेरा पूजा के लिए फूल चाहिए।", "मैंने पूजा के लिए फूल चाहिए।"]
        answer: "मुझे पूजा के लिए फूल चाहिए।"
        difficulty: 1
        hints: ["'चाहिए' के साथ 'मुझे'।"]
        solution: "मुझे ... चाहिए।"
        mistakes: {"मैं पूजा के लिए फूल चाहिए।": hin_chahiye}
      - prompt: "'उन्होंने लाइट जलाई।' में 'नए मकान में' जोड़ने पर सही वाक्य?"
        options: ["उन्होंने नए मकान में लाइट जलाई।", "उन्होंने लाइट नए जलाई मकान में।", "नए उन्होंने मकान में लाइट जलाई।", "उन्होंने लाइट जलाई नए मकान।"]
        answer: "उन्होंने नए मकान में लाइट जलाई।"
        difficulty: 2
        hints: ["स्थान क्रिया और कर्म से पहले आता है।"]
