subject: hin
chapter: 2
title: "इकाई दो - हरियाली की छाँव में"

tips:
  hin_ghar_story: "'घर' (प्रभात): छिपकली श्रीमान फ़रहाद के साथ उनके नए घर (नीम सराय, मकान नंबर 205) में जा रही है। वहाँ मकड़ी, ततैया, चींटी, मक्खी-मच्छर, चूहा भी रहते हैं। फ़रहाद किसी जीव को नहीं भगाते; सपने में भी उन्हें लगता है कि उनका परिवार बढ़ रहा है।"
  hin_phool_poem: "'फूल' (रामदरश मिश्र): कवि बाज़ार से प्लास्टिक के फूल लाकर आँगन के असली फूल उखाड़ देते हैं। हवा गंध, मधुमक्खी रस, तितली कोमल स्पर्श माँगती है; जब बच्चा 'फूलों की पहचान' के लिए फूल माँगता है, तब कवि प्लास्टिक के फूल तोड़कर फिर मिट्टी गोड़ने लगते हैं।"
  hin_sentence_grow: "वाक्य बढ़ाना: मूल वाक्य (उन्होंने लाइट जलाई) में एक-एक करके विशेषण और स्थान जोड़ें: हर जगह की → मकान में → नए → अपने → दो कमरे, किचन और बरामदे वाले।"
  hin_adverb: "क्रिया-विशेषण बताता है कि काम कैसे हुआ: 'आहिस्ते-से उठाया', 'रंग बदलते हुए कहा', 'चारों ओर नज़र घुमाकर देखा'।"
  hin_chahiye: "'चाहिए' के साथ कर्ता में 'को' या उसका रूप आता है: मुझे (मुझको), हमें, उसे, बच्चे को फूल चाहिए। 'मैं चाहिए' गलत है।"

concepts:
  - code: hin9.u2.ghar
    title: घर
    notes: |
      प्रभात (जन्म राजस्थान) की कहानी। छिपकली सड़क पार करते हुए गिरगिट से मिलती है; वह श्रीमान फ़रहाद
      के साथ उनके नए घर जा रही है। पहले वह श्रीमती शांतिदास के साथ रही, जो उसे देखते ही चिल्लाती थीं
      ("सुशांतो जल्दी आओ, इसे भगाओ!"); वहाँ एक सप्ताह भी न टिक सकी। फ़रहाद के पास किताबों की बड़ी
      अलमारियाँ थीं; "छिपकलियों के पीछे झाड़ू लेकर पड़े रहने वालों में से वो नहीं हैं।" नीम सराय के मकान
      नंबर 205 में मकड़ी (कल ही आई), दस-पंद्रह मक्खियाँ और सौ के आसपास मच्छर, काली चींटी, ततैया
      (चाय पर बुलाती है), आता-जाता चूहा ("सुना है पत्रकार है"), दिन में चिड़ियाँ, बाहर गिलहरी। ततैया:
      "हमारी तरह दीवारों, खिड़कियों या छत से उनका खास लेना-देना नहीं है।" फ़रहाद के सपने में छिपकली ने
      अंडे दिए, मकड़ी ने बड़ा जाला बुना; वे खुश हैं कि परिवार बढ़ रहा है। सुबह चप्पल पर बैठी तीन नन्हीं
      मेंढकियों को हथेली पर रखकर बाहर टहलाते हैं; आइने में छिपकली से पहली मुलाकात। संदेश: प्रकृति सबका
      घर है। व्याकरण: वाक्य बढ़ाना; क्रिया-विशेषण।
    explanations:
      text: "यह कहानी जीवों की नज़र से दिखाती है कि एक घर में केवल इनसान नहीं रहते। फ़रहाद जैसे लोग सब जीवों के साथ मिलकर रहना जानते हैं; यही सच्चा 'घर' है।"
      visual: "मकान नंबर 205 का नक्शा: अलमारी के पीछे छिपकली, कोने में मकड़ी का जाला, परदे के पीछे ततैया, दीवार की पपड़ी में चींटी, बाहर पेड़ पर गिलहरी, चप्पल पर तीन मेंढकियाँ, और बीच में सोते फ़रहाद।"
      step_by_step: "1. छिपकली और गिरगिट की बातचीत (पुराने मालिक)। 2. नए घर में बाकी जीवों से मुलाकात। 3. ततैया के यहाँ चाय। 4. फ़रहाद का सपना। 5. सुबह मेंढकियाँ और आइने में छिपकली। 6. संदेश: प्रकृति सबका घर।"
      real_world: "घर में छिपकली या मकड़ी दिखे तो उसे मारने के बजाय सोचें: ये मच्छर-मक्खी खाकर हमारी मदद भी करती हैं।"
    items:
      - prompt: "'घर' कहानी के रचनाकार कौन हैं?"
        options: ["प्रभात", "रामदरश मिश्र", "प्रेमचंद", "पुष्पा मेहरा"]
        answer: "प्रभात"
        difficulty: 1
        hints: ["जन्म राजस्थान में।"]
        solution: "प्रभात।"
        mistakes: {"पुष्पा मेहरा": hin_author_work}
      - prompt: "छिपकली किसके नए घर में जा रही है?"
        options: ["श्रीमान फ़रहाद के", "श्रीमती शांतिदास के", "गिरगिट के", "सुशांतो के"]
        answer: "श्रीमान फ़रहाद के"
        difficulty: 1
        hints: ["जिनके पास किताबों की बड़ी अलमारियाँ थीं।"]
        solution: "फ़रहाद के नए घर में।"
        mistakes: {"श्रीमती शांतिदास के": hin_ghar_story}
      - prompt: "छिपकली सड़क पर सबसे पहले किससे मिलती है?"
        options: ["गिरगिट से", "मकड़ी से", "ततैया से", "चूहे से"]
        answer: "गिरगिट से"
        difficulty: 1
        hints: ["जो बात करते हुए रंग बदलता है।"]
        solution: "गिरगिट से।"
        mistakes: {"मकड़ी से": hin_read_again}
      - prompt: "फ़रहाद का नया मकान किस नंबर का है?"
        answer: "205"
        check: "205"
        difficulty: 2
        hints: ["नीम सराय का मकान।"]
        solution: "मकान नंबर 205।"
        mistakes: {"250": hin_read_again}
      - prompt: "छिपकली श्रीमती शांतिदास के घर से क्यों चली आई?"
        options: ["वे उसे देखते ही चिल्लाती थीं और भगाना चाहती थीं", "वहाँ किताबें नहीं थीं", "वहाँ बहुत ठंड थी", "वे घर बदल रही थीं"]
        answer: "वे उसे देखते ही चिल्लाती थीं और भगाना चाहती थीं"
        difficulty: 2
        hints: ["'सुशांतो जल्दी आओ, इसे भगाओ!'"]
        solution: "वे 'पूरी अशांतिदास' थीं; छिपकली वहाँ एक सप्ताह भी न टिक सकी।"
        mistakes: {"वहाँ किताबें नहीं थीं": hin_ghar_story}
      - prompt: "सुबह फ़रहाद को अपनी चप्पल पर क्या मिला?"
        options: ["तीन नन्हीं मेंढकियाँ", "एक छिपकली", "मकड़ी का जाला", "एक गिलहरी"]
        answer: "तीन नन्हीं मेंढकियाँ"
        difficulty: 2
        hints: ["हथेली पर वे तीन पंखुड़ियों वाले हरे फूल जैसी लग रही थीं।"]
        solution: "तीन नन्हीं मेंढकियाँ; उन्होंने उन्हें हथेली पर रखकर बाहर टहलाया।"
        mistakes: {"एक छिपकली": hin_read_again}
      - prompt: "'घर' कहानी का मुख्य संदेश क्या है?"
        options: ["प्रकृति सबका घर है; सभी जीवों को साथ मिलकर रहना चाहिए", "घर में कोई जीव नहीं रहना चाहिए", "नया घर हमेशा पुराने से अच्छा होता है", "किराए के घर में नहीं रहना चाहिए"]
        answer: "प्रकृति सबका घर है; सभी जीवों को साथ मिलकर रहना चाहिए"
        difficulty: 3
        hints: ["फ़रहाद का सपना: परिवार बढ़ रहा है और सभी खुश हैं।"]
        solution: "हर प्राणी की प्रकृति में अपनी जगह है।"
        mistakes: {"घर में कोई जीव नहीं रहना चाहिए": hin_ghar_story}

  - code: hin9.u2.phool
    title: फूल
    notes: |
      डॉ. रामदरश मिश्र (जन्म उत्तर प्रदेश; व्यास सम्मान, साहित्य अकादमी पुरस्कार) की कविता। बाज़ार में
      सजा प्लास्टिक के फूलों का उद्यान: "जैसे बिना मौसम बहार आ गई हो"। न मिट्टी, न खाद, न पानी, न
      चिड़ियों से रखवाली, न मौसम का इंतज़ार; "एक ही भाव से हमेशा दहकते रहते हैं ये फूल"। कवि ने घर
      पहुँचते ही आँगन के खिलते-मुरझाते फूल उखाड़ फेंके और प्लास्टिक के फूल सजा दिए; घर "एकरस इन रंगों
      में डूबा रहा"। हवाओं ने गंध, मधुमक्खियों ने रस, तितलियों ने कोमल स्पर्श, माँ ने पूजा के लिए, पत्नी ने
      वेणी के लिए फूल माँगे; कवि चुप रहे। जब बच्चे ने कहा "बापू, मुझे फूल चाहिए फूलों की पहचान के लिए",
      तो हृदय हाहाकार कर उठा। कवि ने प्लास्टिक के फूल तोड़ डाले, फावड़ा लेकर मिट्टी से जूझने लगे; मिट्टी
      मुसकराई, हवा खिलखिलाई, जल कल-कल गाने लगा। व्याकरण: 'चाहिए' वाले वाक्य। इकाई मुखपृष्ठ: पुष्पा
      मेहरा का हाइकु "सूर्य किरणें / हँस हँस सजातीं / धरा की वेणी"।
    explanations:
      text: "प्लास्टिक के फूल हमेशा एक जैसे चमकते हैं, पर उनमें न गंध है, न रस, न जीवन। असली फूल खिलते और मुरझाते हैं, और सारी प्रकृति को जीवन देते हैं। बच्चे की माँग कवि को यह समझा देती है।"
      visual: "दो उद्यानों की तुलना: प्लास्टिक का उद्यान — गंध नहीं, रस नहीं, कोमल स्पर्श नहीं, तितली-मधुमक्खी नहीं; असली उद्यान — गंध, रस, तितलियाँ, मिट्टी, पानी, मौसम के साथ बदलाव।"
      step_by_step: "1. बाज़ार में प्लास्टिक के फूलों का आकर्षण। 2. असली फूल उखाड़ना। 3. हवा, मधुमक्खी, तितली, माँ, पत्नी की माँग: कवि चुप। 4. बच्चे की माँग: कवि चुप न रह सके। 5. प्लास्टिक के फूल तोड़कर फिर मिट्टी से जुड़ना।"
      real_world: "स्कूल या घर में प्लास्टिक के सजावटी फूलों के बदले गमले में असली पौधा लगाइए। उस पर कितनी तितलियाँ और मधुमक्खियाँ आती हैं, एक हफ़्ते तक देखिए।"
    items:
      - prompt: "'फूल' कविता के कवि कौन हैं?"
        options: ["डॉ. रामदरश मिश्र", "नागार्जुन", "मुक्तिबोध", "प्रभात"]
        answer: "डॉ. रामदरश मिश्र"
        difficulty: 1
        hints: ["'पक गई है धूप' उनकी रचना है।"]
        solution: "डॉ. रामदरश मिश्र।"
        mistakes: {"नागार्जुन": hin_author_work}
      - prompt: "बाज़ार में कवि ने किसका उद्यान देखा?"
        options: ["प्लास्टिक के फूलों का", "गुलाब के फूलों का", "फलों का", "सब्ज़ियों का"]
        answer: "प्लास्टिक के फूलों का"
        difficulty: 1
        hints: ["'न मिट्टी, न खाद, न पानी'।"]
        solution: "प्लास्टिक के फूलों का।"
        mistakes: {"गुलाब के फूलों का": hin_phool_poem}
      - prompt: "मधुमक्खियों ने क्या माँगा?"
        options: ["रस", "गंध", "कोमल स्पर्श", "पूजा के फूल"]
        answer: "रस"
        difficulty: 1
        hints: ["हवा ने गंध, तितलियों ने कोमल स्पर्श माँगा।"]
        solution: "'हमें रस चाहिए।'"
        mistakes: {"गंध": hin_phool_poem}
      - prompt: "किसकी बात सुनकर कवि चुप न रह सके?"
        options: ["बच्चे की", "माँ की", "पत्नी की", "तितलियों की"]
        answer: "बच्चे की"
        difficulty: 2
        hints: ["'बापू, मुझे फूल चाहिए फूलों की पहचान के लिए।'"]
        solution: "बच्चे की; वह फूलों की पहचान से वंचित हो रहा था।"
        mistakes: {"माँ की": hin_phool_poem}
      - prompt: "'एक ही भाव से हमेशा दहकते रहते हैं ये फूल' — कवि ऐसा क्यों कहते हैं?"
        options: ["प्लास्टिक के फूल न खिलते हैं न मुरझाते हैं; उनमें कोई बदलाव या जीवन नहीं", "ये फूल आग से बने हैं", "ये फूल बहुत सुगंधित हैं", "ये फूल रोज़ नए आते हैं"]
        answer: "प्लास्टिक के फूल न खिलते हैं न मुरझाते हैं; उनमें कोई बदलाव या जीवन नहीं"
        difficulty: 2
        hints: ["असली फूल 'खिलते-मुरझाते' हैं।"]
        solution: "हमेशा एक-सा चमकना जीवनहीनता का संकेत है।"
        mistakes: {"ये फूल आग से बने हैं": hin_word_meaning}
      - prompt: "प्लास्टिक के फूल तोड़ने के बाद कवि ने क्या किया?"
        options: ["फावड़ा लेकर आँगन की मिट्टी से जूझने लगे", "नए प्लास्टिक के फूल खरीदे", "घर छोड़ दिया", "बच्चे को डाँटा"]
        answer: "फावड़ा लेकर आँगन की मिट्टी से जूझने लगे"
        difficulty: 2
        hints: ["'मिट्टी मुसकराई, हवा खिलखिलाई'।"]
        solution: "फिर से असली पौधे लगाने के लिए मिट्टी गोड़ने लगे।"
        mistakes: {"नए प्लास्टिक के फूल खरीदे": hin_read_again}
      - prompt: "'मिट्टी मुसकराई, हवा खिलखिलाई, जल कल-कल गाने लगा।' इन पंक्तियों का भाव?"
        options: ["मनुष्य के प्रकृति से फिर जुड़ने पर पूरी प्रकृति खुश हो उठी", "बारिश आने वाली है", "कवि मज़ाक कर रहे हैं", "बाज़ार में शोर है"]
        answer: "मनुष्य के प्रकृति से फिर जुड़ने पर पूरी प्रकृति खुश हो उठी"
        difficulty: 3
        hints: ["यहाँ मिट्टी, हवा, जल मनुष्य की तरह भाव दिखाते हैं (मानवीकरण)।"]
        solution: "प्रकृति का मानवीकरण: सब खुश हैं कि कवि लौट आए।"
        mistakes: {"बारिश आने वाली है": hin_phool_poem}

  - code: hin9.u2.vyakaran
    title: "व्याकरण: वाक्य बढ़ाना और 'चाहिए'"
    after: [hin9.u2.ghar]
    notes: |
      वाक्य बढ़ाना: "उन्होंने लाइट जलाई" → "उन्होंने हर जगह की लाइट जलाई" → "...मकान में हर जगह की..."
      → "...नए मकान में..." → "...अपने नए मकान में..." → "उन्होंने दो कमरे, किचन और बरामदे वाले अपने
      नए मकान में हर जगह की लाइट जलाई।" क्रिया-विशेषण: रंग बदलते हुए कहा, आहिस्ते-से उठाया, चारों
      ओर नज़र घुमाकर देखा। 'चाहिए': हमें फूलों की गंध चाहिए; मुझे वेणी के लिए फूल चाहिए; हमें रस चाहिए।
    explanations:
      text: "छोटे वाक्य में विशेषण, स्थान और क्रिया-विशेषण जोड़कर उसे अधिक जानकारी वाला बनाया जा सकता है। 'चाहिए' के साथ कर्ता 'मुझे, हमें, उसे' रूप में आता है।"
      visual: "सीढ़ी: फ़रहाद टहलने निकला → फ़रहाद सुबह टहलने निकला → फ़रहाद सुबह मेंढकियों के साथ टहलने निकला → फ़रहाद सुबह तीन नन्हीं मेंढकियों के साथ धीरे-धीरे टहलने निकला।"
      step_by_step: "1. मूल वाक्य: कर्ता + क्रिया। 2. कब? (समय)। 3. कहाँ? (स्थान)। 4. कैसे? (क्रिया-विशेषण)। 5. किसके साथ / कैसा? (विशेषण)।"
      real_world: "डायरी लिखते समय 'मैं स्कूल गया' के बदले 'मैं आज सुबह दोस्त के साथ साइकिल से स्कूल गया' लिखें: पढ़ने वाले को पूरा चित्र मिलेगा।"
    items:
      - prompt: "'फ़रहाद ने चप्पल को आहिस्ते-से उठाया।' — 'आहिस्ते-से' क्या बताता है?"
        options: ["काम कैसे हुआ (धीरे-से)", "काम कब हुआ", "काम किसने किया", "चप्पल का रंग"]
        answer: "काम कैसे हुआ (धीरे-से)"
        difficulty: 1
        hints: ["यह क्रिया-विशेषण है।"]
        solution: "आहिस्ते-से = धीरे-से; क्रिया की रीति।"
        mistakes: {"काम कब हुआ": hin_adverb}
      - prompt: "सही वाक्य चुनें:"
        options: ["मुझे पूजा के लिए फूल चाहिए।", "मैं पूजा के लिए फूल चाहिए।", "मेरा पूजा के लिए फूल चाहिए।", "मैंने पूजा के लिए फूल चाहिए।"]
        answer: "मुझे पूजा के लिए फूल चाहिए।"
        difficulty: 1
        hints: ["'चाहिए' के साथ 'मुझे'।"]
        solution: "मुझे ... चाहिए।"
        mistakes: {"मैं पूजा के लिए फूल चाहिए।": hin_chahiye}
      - prompt: "'उन्होंने लाइट जलाई।' में 'नए मकान में' जोड़ने पर सही वाक्य?"
        options: ["उन्होंने नए मकान में लाइट जलाई।", "उन्होंने लाइट नए जलाई मकान में।", "नए उन्होंने मकान में लाइट जलाई।", "उन्होंने लाइट जलाई नए मकान।"]
        answer: "उन्होंने नए मकान में लाइट जलाई।"
        difficulty: 2
        hints: ["स्थान क्रिया और कर्म से पहले आता है।"]
        solution: "उन्होंने नए मकान में लाइट जलाई।"
        mistakes: {"उन्होंने लाइट नए जलाई मकान में।": hin_sentence_grow}
      - prompt: "'हवाओं ने कहा: हमें गंध चाहिए।' — इसमें 'हमें' किसके लिए आया है?"
        options: ["हवाओं के लिए", "कवि के लिए", "फूलों के लिए", "मधुमक्खियों के लिए"]
        answer: "हवाओं के लिए"
        difficulty: 2
        hints: ["जो कह रहा है, वही 'हम'।"]
        solution: "हवाएँ अपने लिए 'हमें' कह रही हैं।"
        mistakes: {"कवि के लिए": hin_chahiye}
      - prompt: "किस वाक्य में सबसे अधिक जानकारी है?"
        options: ["उन्होंने दो कमरे, किचन और बरामदे वाले अपने नए मकान में हर जगह की लाइट जलाई।", "उन्होंने लाइट जलाई।", "उन्होंने मकान में लाइट जलाई।", "उन्होंने अपने मकान में लाइट जलाई।"]
        answer: "उन्होंने दो कमरे, किचन और बरामदे वाले अपने नए मकान में हर जगह की लाइट जलाई।"
        difficulty: 3
        hints: ["जिस वाक्य में सबसे अधिक विशेषण और स्थान जुड़े हैं।"]
        solution: "पूरा बढ़ाया गया वाक्य।"
        mistakes: {"उन्होंने अपने मकान में लाइट जलाई।": hin_sentence_grow}
