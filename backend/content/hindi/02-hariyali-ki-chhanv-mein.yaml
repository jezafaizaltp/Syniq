        solution: "हर प्राणी की प्रकृति में अपनी जगह है।"
        mistakes: {"घर में कोई जीव नहीं रहना चाहिए": hin_ghar_story}
      - prompt: "छिपकली को श्रीमती शांतिदास के घर से ज़्यादा फ़रहाद का घर क्यों अच्छा लगता है?"
        options: ["फ़रहाद जीवों को भगाते नहीं, साथ रहने देते हैं", "फ़रहाद का घर बड़ा है", "फ़रहाद उसे रोज़ खाना देते हैं", "फ़रहाद के पास गिरगिट रहता है"]
        answer: "फ़रहाद जीवों को भगाते नहीं, साथ रहने देते हैं"
