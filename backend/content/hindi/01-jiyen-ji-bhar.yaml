  - code: hin9.u1.vyakaran
    title: "व्याकरण: 'ता है' और 'रहा है'"
    after: [hin9.u1.jhatpat]
    notes: |
      'झटपट दौड़ लगाता है' (आदत/सामान्य बात) और 'झटपट दौड़ लगा रहा है' (अभी हो रहा काम)। कर्ता के
      अनुसार: लगा रहा है (एकवचन पुल्लिंग), तैर रही है (स्त्रीलिंग), लगा रहे हैं / बह रही हैं (बहुवचन)।
      नमूने: मछली तैरती है / तैर रही है; नदियाँ बहती हैं / बह रही हैं; नटखट रोता है / रो रहा है;
      नाव चलती है / चल रही है; सर्दियाँ शुरू होती हैं / हो रही हैं।
    explanations:
      text: "'ता है' बताता है कि काम आम तौर पर होता है; 'रहा है' बताता है कि काम इसी समय चल रहा है।"
      visual: "दो खाने: सामान्य वर्तमान — तैरता/तैरती/तैरते + है/हैं; अपूर्ण वर्तमान — तैर + रहा/रही/रहे + है/हैं।"
      step_by_step: "1. धातु पहचानें (तैर, बह, रो)। 2. काम अभी चल रहा है? तो धातु + रहा/रही/रहे। 3. कर्ता पुल्लिंग एकवचन → रहा है; स्त्रीलिंग → रही है/हैं; पुल्लिंग बहुवचन → रहे हैं।"
      real_world: "फ़ोन पर दोस्त पूछे 'क्या कर रहे हो?', तो जवाब 'मैं पढ़ रहा/रही हूँ' होगा, 'मैं पढ़ता हूँ' नहीं।"
    items:
      - prompt: "'मछली तैरती है।' इसे अभी चल रहे काम में बदलें।"
        options: ["मछली तैर रही है।", "मछली तैर रहा है।", "मछली तैरते हैं।", "मछली तैर रहे हैं।"]
        answer: "मछली तैर रही है।"
        difficulty: 1
        hints: ["मछली स्त्रीलिंग है।"]
        solution: "मछली तैर रही है।"
        mistakes: {"मछली तैर रहा है।": hin_continuous}
      - prompt: "'नटखट रोता है।' अपूर्ण वर्तमान में?"
        options: ["नटखट रो रहा है।", "नटखट रो रही है।", "नटखट रो रहे हैं।", "नटखट रोया।"]
        answer: "नटखट रो रहा है।"
        difficulty: 1
        hints: ["नटखट पुल्लिंग एकवचन।"]
        solution: "नटखट रो रहा है।"
        mistakes: {"नटखट रो रही है।": hin_continuous}
      - prompt: "'नदियाँ ___ ।' (बहना, अभी)"
        options: ["बह रही हैं", "बह रहा है", "बह रहे है", "बहता है"]
        answer: "बह रही हैं"
        difficulty: 2
        hints: ["नदियाँ: स्त्रीलिंग बहुवचन।"]
        solution: "नदियाँ बह रही हैं।"
        mistakes: {"बह रहा है": hin_continuous}
      - prompt: "'झटपट और नटखट स्कूल से आ रहे हैं।' इसका सामान्य वर्तमान रूप?"
        options: ["झटपट और नटखट स्कूल से आते हैं।", "झटपट और नटखट स्कूल से आता है।", "झटपट और नटखट स्कूल से आती हैं।", "झटपट और नटखट स्कूल से आए।"]
        answer: "झटपट और नटखट स्कूल से आते हैं।"
        difficulty: 2
        hints: ["दो लड़के: पुल्लिंग बहुवचन → ते हैं।"]
        solution: "आते हैं।"
        mistakes: {"झटपट और नटखट स्कूल से आता है।": hin_continuous}
      - prompt: "किस वाक्य में आदत या सामान्य सच्चाई बताई गई है?"
        options: ["सूरज पूरब में उगता है।", "सूरज उग रहा है।", "बच्चे खेल रहे हैं।", "नाव चल रही है।"]
        answer: "सूरज पूरब में उगता है।"
        difficulty: 3
        hints: ["जो हमेशा होता है, उसमें 'ता है'।"]
        solution: "सूरज पूरब में उगता है: हमेशा का सच।"
        mistakes: {"सूरज उग रहा है।": hin_continuous}
