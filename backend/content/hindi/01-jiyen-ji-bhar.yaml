# Class 9 Hindi (Kerala Pathavali), Unit 1. Format: content/README.md.
# Written from the 2024 SCERT Kerala Reader Hindi text supplied by the school.
# Hindi wording written by Claude; not yet checked by a Hindi teacher.
# Defines the shared tips hin_read_again, hin_author_work, hin_word_meaning used by later units.
subject: hin
chapter: 1
title: "इकाई एक - जिएँ जी भर..."

tips:
  hin_read_again: "पाठ को एक बार फिर से पढ़ें। उत्तर ज़्यादातर पाठ में ही सीधे लिखा होता है।"
  hin_author_work: "रचना और रचनाकार को साथ याद रखें: पाठ के शीर्षक के नीचे रचनाकार का नाम और अंत में उनका परिचय दिया गया है।"
  hin_word_meaning: "'मदद लें...' में दिया गया अर्थ देखें: पाठ में शब्द उसी अर्थ में आया है।"
  hin_brothers: "'झटपट और नटखट' (रमेश उपाध्याय): बड़ा भाई झटपट (पाँचवीं कक्षा) तेज़ चलता है और तैरना जानता है; छोटा भाई नटखट (तीसरी कक्षा) रास्ते में रुक-रुककर खेलता है, कागज़ की नाव बनाना और गिट्टी पैराना जानता है।"
  hin_village_joy: "'बहुत दिनों के बाद' (नागार्जुन): बहुत दिनों के बाद गाँव लौटकर कवि ने पाँचों इंद्रियों से गाँव का सौंदर्य जी भर भोगा: फ़सलों की मुसकान देखी, धान कूटती किशोरियों की तान सुनी, मौलसिरी के फूल सूँघे, पगडंडी की धूल छुई, तालमखाना खाया।"
  hin_kaki: "'बूढ़ी काकी' (प्रेमचंद की कहानी, गुलज़ार की फ़िल्म): विधवा काकी ने अपनी सारी संपत्ति भतीजे बुद्धिराम के नाम कर दी; उसके बाद बुद्धिराम और रूपा उसका अपमान करते हैं। केवल छोटी लड़की लाडली उसकी देखभाल करती है।"
  hin_blurb: "शस्ति (ब्लर्ब): किसी किताब या फ़िल्म के प्रचार के लिए लिखा गया छोटा, आकर्षक सारांश, जो प्रायः पिछले आवरण पृष्ठ पर छपता है।"
  hin_continuous: "'रहा है / रही है / रहे हैं' अभी चल रहे काम को बताते हैं (झटपट दौड़ लगा रहा है); 'ता है / ती है / ते हैं' आदत या सामान्य सच्चाई (मछली तैरती है)। कर्ता के लिंग और वचन के अनुसार रूप बदलता है।"

concepts:
  - code: hin9.u1.jhatpat
    title: झटपट और नटखट
    notes: |
      रमेश उपाध्याय की कहानी। झटपट बड़ा (पाँचवीं में), नटखट छोटा (तीसरी में); दोनों में दो साल का अंतर।
      स्कूल दूसरे गाँव में है; रास्ते में पोखर, बरगद, खेत, बाग, नाला और नदी। माँ की हिदायत: झटपट छोटे
      भाई का ध्यान रखे। नटखट रुक-रुककर मछलियाँ और बतखें देखता है, बरगद की जड़ें पकड़कर झूलता है,
      आम-अमरूद तोड़ता है। एक दिन वह नदी किनारे कागज़ की दो नावें छोड़ता है, बस्ता उठाते हुए पाँव
      फिसलता है और वह बह जाता है; उसे तैरना नहीं आता। झटपट कूदकर उसे बचाता है, गुस्से में दो झापड़
      लगाता है, फिर उसे प्यार आ जाता है। नटखट डरता है कि झटपट माँ से शिकायत करेगा; दोनों वादा करते हैं:
      नटखट नाव बनाना सिखाएगा, झटपट तैरना। कपड़े सुखाने के लिए दोनों हाथ पकड़कर दौड़ लगाते हैं।
      पोखर पर नटखट गिट्टी पैराकर दिखाता है, पर झटपट का ध्यान बतखों पर चला जाता है। व्याकरण:
      'दौड़ लगाता है' / 'दौड़ लगा रहा है'।
    explanations:
      text: "दो भाइयों की यह कहानी बताती है कि हर किसी को कुछ न कुछ आता है। बड़ा तैरना जानता है, छोटा नाव बनाना। एक-दूसरे से सीखकर और साथ रहकर ही दोनों खुश रहते हैं।"
      visual: "रास्ते का चित्र: घर → पोखर → बरगद → खेत → बाग → नाला → नदी का पुल → स्कूल। नदी किनारे दो कागज़ की नावें और पानी में गिरा नटखट।"
      step_by_step: "कहानी के मुख्य मोड़: 1. रोज़ का रास्ता और नटखट की शरारतें। 2. नदी किनारे कागज़ की नावें। 3. पाँव फिसला, नटखट बह गया। 4. झटपट ने कूदकर बचाया। 5. एक-दूसरे को सिखाने का वादा। 6. दौड़कर कपड़े सुखाए।"
      real_world: "आपको क्या-क्या आता है? साइकिल चलाना, चित्र बनाना, गाना? अपने दोस्त को एक चीज़ सिखाइए और उससे एक चीज़ सीखिए।"
    items:
      - prompt: "'झटपट और नटखट' कहानी के रचनाकार कौन हैं?"
        options: ["रमेश उपाध्याय", "प्रेमचंद", "नागार्जुन", "प्रभात"]
        answer: "रमेश उपाध्याय"
        difficulty: 1
        hints: ["शीर्षक के नीचे नाम देखें।"]
        solution: "रमेश उपाध्याय।"
        mistakes: {"प्रेमचंद": hin_author_work}
      - prompt: "झटपट किस कक्षा में पढ़ता है?"
        options: ["पाँचवीं", "तीसरी", "नौवीं", "दूसरी"]
        answer: "पाँचवीं"
        difficulty: 1
        hints: ["नटखट तीसरी में है; दोनों में दो साल का अंतर है।"]
        solution: "झटपट पाँचवीं में, नटखट तीसरी में।"
        mistakes: {"तीसरी": hin_brothers}
      - prompt: "नदी में गिरे नटखट को किसने बचाया?"
        options: ["झटपट ने", "माँ ने", "एक मछुआरे ने", "वह खुद तैरकर निकला"]
        answer: "झटपट ने"
        difficulty: 1
        hints: ["नटखट को तैरना नहीं आता था।"]
        solution: "झटपट ने बस्ता पुल की मुंडेर पर रखकर नदी में कूदकर बचाया।"
        mistakes: {"वह खुद तैरकर निकला": hin_brothers}
      - prompt: "नटखट नदी किनारे क्यों गया था?"
        options: ["कागज़ की नावें बहते पानी में छोड़ने", "मछली पकड़ने", "नहाने", "आम तोड़ने"]
        answer: "कागज़ की नावें बहते पानी में छोड़ने"
        difficulty: 2
        hints: ["बस्ते में पहले से बनाकर रखी दो चीज़ें।"]
        solution: "बस्ते में रखी कागज़ की दो नावें छोड़ने।"
        mistakes: {"मछली पकड़ने": hin_read_again}
      - prompt: "भीगे कपड़े सुखाने के लिए दोनों भाइयों ने क्या उपाय किया?"
        options: ["एक-दूसरे का हाथ पकड़कर दौड़ लगाई", "कपड़े पेड़ पर टाँग दिए", "घर जाकर कपड़े बदले", "आग जलाई"]
        answer: "एक-दूसरे का हाथ पकड़कर दौड़ लगाई"
        difficulty: 2
        hints: ["नटखट ने कहा: 'आओ, दौड़ लगाते हैं।'"]
        solution: "धूप में दौड़ लगाई; पोखर तक पहुँचते-पहुँचते कपड़े सूख गए।"
        mistakes: {"घर जाकर कपड़े बदले": hin_read_again}
      - prompt: "नटखट झटपट को क्या सिखाने का वादा करता है?"
        options: ["कागज़ की नाव बनाना", "तैरना", "साइकिल चलाना", "पेड़ पर चढ़ना"]
        answer: "कागज़ की नाव बनाना"
        difficulty: 2
        hints: ["झटपट को यह नहीं आता; बदले में झटपट तैरना सिखाएगा।"]
        solution: "नाव बनाना (और बाद में गिट्टी पैराना)।"
        mistakes: {"तैरना": hin_brothers}
      - prompt: "'और बड़े को तो छोटे का ध्यान रखना ही पड़ता है।' माँ के इस कथन से क्या पता चलता है?"
        options: ["परिवार में बड़ों पर छोटों की देखभाल की ज़िम्मेदारी होती है", "माँ झटपट से नाराज़ है", "नटखट बहुत बड़ा है", "स्कूल बहुत पास है"]
        answer: "परिवार में बड़ों पर छोटों की देखभाल की ज़िम्मेदारी होती है"
        difficulty: 3
        hints: ["माँ मुसकराकर यह कहती हैं।"]
        solution: "बड़ा होना ज़िम्मेदारी है; माँ प्यार से यही समझाती हैं।"
        mistakes: {"माँ झटपट से नाराज़ है": hin_brothers}

  - code: hin9.u1.bahut_dinon
    title: बहुत दिनों के बाद
    notes: |
      नागार्जुन (मूल नाम वैद्यनाथ मिश्र, जन्म दरभंगा, बिहार) की कविता। बहुत दिनों के बाद गाँव लौटकर
      कवि ने 'जी भर' (मन भरकर) गाँव का सौंदर्य भोगा: पकी-सुनहली फ़सलों की मुसकान देखी (आँख), धान
      कूटती किशोरियों की कोकिलकंठी तान सुनी (कान), मौलसिरी के ताज़े-टटके फूल सूँघे (नाक), अपनी गँवई
      पगडंडी की चंदनवर्णी धूल छुई (त्वचा), तालमखाना खाया और गन्ने चूसे (जीभ)। अंत में: "गंध-रूप-रस-
      शब्द-स्पर्श सब साथ-साथ इस भू पर"। 'बहुत दिनों के बाद' और 'जी भर' की आवृत्ति कवि की खुशी को
      गहरा करती है। रचनाएँ: रतिनाथ की चाची, बलचनमा, वरुण के बेटे; साहित्य अकादमी पुरस्कार।
    explanations:
      text: "कवि बहुत दिनों बाद अपने गाँव आए हैं और पाँचों इंद्रियों से गाँव की सुंदरता का आनंद ले रहे हैं: देखना, सुनना, सूँघना, छूना और चखना।"
      visual: "पाँच खानों की तालिका: आँख → सुनहली फ़सल; कान → किशोरियों की तान; नाक → मौलसिरी के फूल; त्वचा → चंदनवर्णी धूल; जीभ → तालमखाना और गन्ना।"
      step_by_step: "1. हर पद 'बहुत दिनों के बाद' से शुरू होता है। 2. हर पद में एक इंद्रिय। 3. हर अनुभव के साथ एक विशेषण (पकी-सुनहली, कोकिलकंठी, ताज़े-टटके, चंदनवर्णी)। 4. अंतिम पद में सब इंद्रियाँ साथ-साथ।"
      real_world: "छुट्टियों में दादा-दादी के गाँव जाने पर आप क्या देखते, सुनते और खाते हैं? पाँच इंद्रियों के आधार पर पाँच पंक्तियाँ लिखिए।"
    items:
      - prompt: "'बहुत दिनों के बाद' कविता के कवि कौन हैं?"
        options: ["नागार्जुन", "रामदरश मिश्र", "मुक्तिबोध", "कबीर"]
        answer: "नागार्जुन"
        difficulty: 1
        hints: ["मूल नाम वैद्यनाथ मिश्र।"]
        solution: "नागार्जुन।"
        mistakes: {"रामदरश मिश्र": hin_author_work}
      - prompt: "कवि ने किसकी 'मुसकान' देखी?"
        options: ["पकी-सुनहली फ़सलों की", "बच्चों की", "फूलों की", "किशोरियों की"]
        answer: "पकी-सुनहली फ़सलों की"
        difficulty: 1
        hints: ["पहला पद।"]
        solution: "पकी-सुनहली फ़सलों की मुसकान।"
        mistakes: {"किशोरियों की": hin_village_joy}
      - prompt: "धान कूटती किशोरियों की तान को कवि ने कैसी कहा है?"
        options: ["कोकिलकंठी", "चंदनवर्णी", "ताज़ी-टटकी", "सुनहली"]
        answer: "कोकिलकंठी"
        difficulty: 1
        hints: ["कोयल जैसी मीठी आवाज़।"]
        solution: "कोकिलकंठी (सुरीली)।"
        mistakes: {"चंदनवर्णी": hin_village_joy}
      - prompt: "कवि ने किसके फूल सूँघे?"
        options: ["मौलसिरी के", "गुलाब के", "कमल के", "चमेली के"]
        answer: "मौलसिरी के"
        difficulty: 2
        hints: ["'ढेर-ढेर से ताज़े-टटके फूल'।"]
        solution: "मौलसिरी के।"
        mistakes: {"गुलाब के": hin_read_again}
      - prompt: "'अपनी गँवई पगडंडी की चंदनवर्णी धूल' — इसमें कवि ने किस इंद्रिय से अनुभव किया?"
        options: ["स्पर्श (छूना)", "स्वाद (चखना)", "सुनना", "सूँघना"]
        answer: "स्पर्श (छूना)"
        difficulty: 2
        hints: ["'अबकी मैं जी भर छू पाया'।"]
        solution: "छूकर, यानी स्पर्श से।"
        mistakes: {"सूँघना": hin_village_joy}
      - prompt: "'जी भर' का अर्थ क्या है?"
        options: ["मन भरकर", "जल्दी-जल्दी", "थोड़ा-सा", "डरते हुए"]
        answer: "मन भरकर"
        difficulty: 2
        hints: ["'जी' = मन।"]
        solution: "मन भरकर, पूरी तृप्ति से।"
        mistakes: {"थोड़ा-सा": hin_word_meaning}
      - prompt: "कविता की अंतिम पंक्ति 'गंध-रूप-रस-शब्द-स्पर्श सब साथ-साथ इस भू पर' से कवि क्या बताना चाहते हैं?"
        options: ["गाँव में सभी इंद्रियों का आनंद एक साथ मिलता है", "कवि बीमार हो गए", "शहर गाँव से अच्छा है", "कवि गाँव छोड़ना चाहते हैं"]
        answer: "गाँव में सभी इंद्रियों का आनंद एक साथ मिलता है"
        difficulty: 3
        hints: ["गंध = सूँघना, रूप = देखना, रस = चखना, शब्द = सुनना, स्पर्श = छूना।"]
        solution: "धरती पर पाँचों इंद्रियों का सुख एक साथ।"
        mistakes: {"शहर गाँव से अच्छा है": hin_village_joy}

  - code: hin9.u1.boodhi_kaki
    title: बूढ़ी काकी
    notes: |
      प्रेमचंद (असली नाम धनपतराय श्रीवास्तव) की मार्मिक कहानी पर गुलज़ार की लघु फ़िल्म; पाठ एक शस्ति
      (ब्लर्ब) है। कहानी बुढ़ापे की समस्या दिखाती है: बड़ों की जायदाद लेने के बाद उनकी उपेक्षा। बूढ़ी काकी
      को विधवा हुए पाँच वर्ष हो चुके हैं; उसके जवान बेटे की भी अकाल मृत्यु हुई। उसने सारी संपत्ति भतीजे के
      नाम कर दी। बुद्धिराम और रूपा तब तक अच्छे रहे जब तक संपत्ति नहीं मिली; फिर बात-बात पर अपमान,
      भरपेट भोजन से भी वंचित। छोटी लड़की लाडली ही उसकी देखभाल करती है। शस्ति/ब्लर्ब: किताब या फ़िल्म
      के प्रचार के लिए प्रेरक सारांश, पिछले आवरण पृष्ठ पर; नमूना: प्रेमचंद के 'गोदान' (होरी) की शस्ति।
      प्रेमचंद की रचनाएँ: मानसरोवर (आठ भाग), रंगभूमि, गबन, निर्मला, गोदान। इकाई मुखपृष्ठ: कबीर का दोहा
      "पोथी पढ़ि पढ़ि जग मुआ, पंडित भया न कोय। ढाई आखर प्रेम का, पढ़े सो पंडित होय।"
    explanations:
      text: "बूढ़ी काकी ने भरोसा करके सब कुछ अपनों को दे दिया, पर बदले में उसे अपमान और भूख मिली। केवल छोटी लाडली के मन में उसके लिए प्यार है। कहानी पूछती है: क्या हम अपने बुज़ुर्गों का सम्मान करते हैं?"
      visual: "दो खाने: संपत्ति मिलने से पहले (बुद्धिराम और रूपा का अच्छा व्यवहार) → संपत्ति मिलने के बाद (अपमान, तिरस्कार, भूख)। एक कोने में लाडली काकी को खाना देती हुई।"
      step_by_step: "शस्ति (ब्लर्ब) कैसे लिखें: 1. रचना और रचनाकार का नाम। 2. मुख्य विषय एक-दो वाक्यों में। 3. मुख्य पात्रों का ज़िक्र। 4. अंत रहस्य बनाकर छोड़ें ताकि पाठक पढ़ना चाहे। 5. भाषा आकर्षक और छोटी।"
      real_world: "घर के बुज़ुर्गों के साथ समय बिताएँ, उनकी बात सुनें और खाने के समय उन्हें पहले पूछें। लाडली जैसी छोटी-सी परवाह भी बहुत बड़ी होती है।"
    items:
      - prompt: "'बूढ़ी काकी' मूल कहानी किसकी है?"
        options: ["प्रेमचंद", "गुलज़ार", "रमेश उपाध्याय", "नागार्जुन"]
