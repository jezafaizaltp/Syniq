  - code: hin9.u4.kab_tak
    title: कब तक?
    notes: |
      वंदना टेटे (जन्म सामटोली, सिमडेगा, झारखंड; हिंदी और खड़िया में लेखन; 'आदिवासी साहित्य: परंपरा और
      प्रयोजन') की कविता। "कब तक जोहते रहोगे अपनी पहचान जानने के लिए दूसरे का मुँह", "कब तक आसरे में
      रहोगे कि कोई आए और तुम्हारे लिए लड़े", "कब तक खुश होते रहोगे कि उनकी कहानी में तुम्हारा ज़िक्र है /
      कि तुम्हारा इतिहास तुमने नहीं उसने लिखा है", "कब तक जोहते रहोगे अवतारों के आगमन की बाट", "क्यों
      करेगा कोई तुम्हारी व्यथा का निराकरण अपनी व्यथा बढ़ाने के लिए"। "इसलिए बदलो कि समय बदल चुका है /
      नहीं देता अब कोई अपना निवाला / नहीं देता अपना गाल / और नहीं रखता कोई अपने सर पर जूती / कि
      आत्म-सम्मान से बड़ी कोई चीज़ नहीं होती।" 'कोई' की आवृत्ति: दूसरों पर निर्भरता। मुहावरे: मुँह जोहना,
      बाट जोहना (प्रतीक्षा करना)। समाज के उत्थान के लिए जीवन समर्पित करनेवाले: अक्कम्मा चेरियान,
      श्रीनारायण गुरु, महात्मा अय्यंकाली, वक्कम अब्दुल खादर मौलवी।
    explanations:
      text: "कवयित्री वंचित और आदिवासी समाज से कहती हैं: अपनी पहचान, अपना संघर्ष और अपना इतिहास दूसरों के भरोसे मत छोड़ो। खुद उठो, क्योंकि आत्म-सम्मान से बड़ी कोई चीज़ नहीं।"
      visual: "दो खाने: 'कब तक' (दूसरों का मुँह जोहना, किसी के लड़ने का आसरा, दूसरों का लिखा इतिहास, अवतार की बाट) → 'इसलिए बदलो' (अपनी पहचान, अपना संघर्ष, आत्म-सम्मान)।"
      step_by_step: "1. हर पद 'कब तक' से शुरू: प्रश्न के रूप में चुनौती। 2. दूसरों पर निर्भरता के उदाहरण। 3. कारण: कोई अपनी व्यथा बढ़ाकर तुम्हारी व्यथा दूर नहीं करेगा। 4. निष्कर्ष: बदलो, आत्म-सम्मान सबसे बड़ा।"
      real_world: "श्रीनारायण गुरु और अय्यंकाली ने केरल में किसी का इंतज़ार नहीं किया; उन्होंने खुद आगे बढ़कर समाज को बदला। हम भी अपने स्कूल या मोहल्ले की किसी समस्या पर खुद पहल कर सकते हैं।"
    items:
      - prompt: "'कब तक?' कविता की कवयित्री कौन हैं?"
        options: ["वंदना टेटे", "सुधा उपाध्याय", "पुष्पा मेहरा", "अक्कम्मा चेरियान"]
        answer: "वंदना टेटे"
        difficulty: 1
        hints: ["जन्म झारखंड में; खड़िया भाषा में भी लिखती हैं।"]
        solution: "वंदना टेटे।"
        mistakes: {"सुधा उपाध्याय": hin_author_work}
      - prompt: "'मुँह जोहना' का अर्थ क्या है?"
        options: ["प्रतीक्षा करना, दूसरों पर निर्भर रहना", "चेहरा धोना", "बहुत बोलना", "गुस्सा करना"]
        answer: "प्रतीक्षा करना, दूसरों पर निर्भर रहना"
        difficulty: 1
        hints: ["'मदद लें' देखें।"]
        solution: "मुँह जोहना = प्रतीक्षा करना।"
        mistakes: {"चेहरा धोना": hin_word_meaning}
      - prompt: "कविता के अनुसार सबसे बड़ी चीज़ क्या है?"
        options: ["आत्म-सम्मान", "धन", "इतिहास", "अवतार"]
        answer: "आत्म-सम्मान"
        difficulty: 1
        hints: ["कविता की अंतिम पंक्ति।"]
        solution: "'आत्म-सम्मान से बड़ी कोई चीज़ नहीं होती।'"
        mistakes: {"इतिहास": hin_kab_tak}
      - prompt: "'कि तुम्हारा इतिहास तुमने नहीं उसने लिखा है' — इसमें किस बात की ओर संकेत है?"
        options: ["वंचित लोगों का इतिहास दूसरों ने अपने नज़रिए से लिखा है", "इतिहास की किताब खो गई है", "इतिहास पढ़ना ज़रूरी नहीं", "सबने मिलकर इतिहास लिखा"]
        answer: "वंचित लोगों का इतिहास दूसरों ने अपने नज़रिए से लिखा है"
        difficulty: 2
        hints: ["'उनकी कहानी में तुम्हारा ज़िक्र है' पर खुश होना।"]
        solution: "अपनी कहानी खुद कहनी होगी।"
        mistakes: {"इतिहास की किताब खो गई है": hin_kab_tak}
      - prompt: "कविता में 'कोई' शब्द का बार-बार प्रयोग किसे सूचित करता है?"
        options: ["उन दूसरे लोगों को जिन पर हम निर्भर रहते हैं", "कवयित्री के परिवार को", "अवतारों के नाम को", "किसी खास राजा को"]
        answer: "उन दूसरे लोगों को जिन पर हम निर्भर रहते हैं"
        difficulty: 2
        hints: ["'कोई आए और तुम्हारे लिए लड़े'।"]
        solution: "जिनके भरोसे बैठे रहना कवयित्री छोड़ने को कहती हैं।"
        mistakes: {"कवयित्री के परिवार को": hin_kab_tak}
      - prompt: "कविता के आशय से सबसे अधिक मेल खाने वाला वाक्य?"
        options: ["ऐसी आशा छोड़ दो कि तुम्हारे लिए संघर्ष करने कोई आएगा", "हमेशा दूसरों की राह देखो", "अवतार आकर सब ठीक कर देंगे", "दूसरों का निवाला छीन लो"]
        answer: "ऐसी आशा छोड़ दो कि तुम्हारे लिए संघर्ष करने कोई आएगा"
        difficulty: 3
        hints: ["'इसलिए बदलो कि समय बदल चुका है।'"]
        solution: "खुद संघर्ष करो; यही कविता का संदेश है।"
        mistakes: {"अवतार आकर सब ठीक कर देंगे": hin_kab_tak}

  - code: hin9.u4.vyakaran
    title: "व्याकरण: भविष्यत् काल और 'दूसरा' के रूप"
    after: [hin9.u4.ghar_ped_tara]
    notes: |
      भविष्यत् काल ('घर, पेड़ और तारे की याद' से): मैं तुम्हें ले जाऊँगा; तुम अपना घर कैसे पहचानोगे?;
      हम किसी तरह पहुँच जाएँगे; कभी न कभी घर मिल ही जाएगा; पेड़ के बीच से तारा दिखाई देगा; वह भाषा
      सुनाई देगी। रेखांकित क्रिया-रूप कर्ता (मैं, तुम, हम, घर, तारा, भाषा) से मेल खाते हैं। 'दूसरा' के रूप
      ('फुटबॉल के दिल का राजा' से): पेले जैसा दूसरा खिलाड़ी नहीं हुआ; किसी दूसरे खिलाड़ी की मार-पिटाई
      नहीं हुई; ब्राज़ील ने विश्व कप दूसरी दफ़ा जीता।
    explanations:
      text: "भविष्यत् काल में क्रिया के अंत में गा/गी/गे आता है, जो कर्ता के लिंग और वचन से मेल खाता है। 'दूसरा' जैसे विशेषण भी संज्ञा के अनुसार दूसरा/दूसरे/दूसरी बनते हैं।"
      visual: "तालिका: मैं → जाऊँगा/जाऊँगी | तुम → पहचानोगे | हम → जाएँगे | तारा (पुल्लिंग) → देगा | भाषा (स्त्रीलिंग) → देगी।"
      step_by_step: "1. कर्ता पहचानें। 2. उसका लिंग और वचन देखें। 3. पुल्लिंग एकवचन → गा; स्त्रीलिंग → गी; पुल्लिंग बहुवचन या आदर → गे। 4. मैं → -ऊँगा; तुम → -ओगे; हम/वे → -एँगे; वह → -एगा।"
      real_world: "छुट्टियों की योजना लिखिए: 'मैं नानी के घर जाऊँगा/जाऊँगी, हम समुद्र देखेंगे, माँ खाना बनाएँगी।'"
    items:
      - prompt: "'पेड़ के बीच से तारा दिखाई ___ ।'"
        options: ["देगा", "देगी", "देंगे", "दूँगा"]
        answer: "देगा"
        difficulty: 1
        hints: ["तारा पुल्लिंग एकवचन।"]
        solution: "तारा दिखाई देगा।"
        mistakes: {"देगी": hin_future}
      - prompt: "'वह भाषा सुनाई ___ ।'"
        options: ["देगी", "देगा", "देंगे", "दोगे"]
        answer: "देगी"
        difficulty: 1
        hints: ["भाषा स्त्रीलिंग।"]
        solution: "भाषा सुनाई देगी।"
        mistakes: {"देगा": hin_future}
      - prompt: "'हम किसी तरह पहुँच ___ ।'"
        options: ["जाएँगे", "जाएगा", "जाऊँगा", "जाओगे"]
        answer: "जाएँगे"
        difficulty: 2
        hints: ["हम: बहुवचन।"]
        solution: "हम पहुँच जाएँगे।"
        mistakes: {"जाएगा": hin_future}
      - prompt: "'ब्राज़ील ने विश्व कप ___ दफ़ा जीता।'"
        options: ["दूसरी", "दूसरा", "दूसरे", "दूसरों"]
        answer: "दूसरी"
        difficulty: 2
        hints: ["दफ़ा स्त्रीलिंग है।"]
        solution: "दूसरी दफ़ा।"
        mistakes: {"दूसरा": hin_adj_agree}
      - prompt: "'किसी ___ खिलाड़ी की मार-पिटाई नहीं हुई।'"
        options: ["दूसरे", "दूसरा", "दूसरी", "दूसरों"]
        answer: "दूसरे"
        difficulty: 3
        hints: ["खिलाड़ी के बाद परसर्ग 'की' है, इसलिए विशेषण का तिर्यक रूप।"]
        solution: "किसी दूसरे खिलाड़ी की।"
        mistakes: {"दूसरा": hin_adj_agree}
