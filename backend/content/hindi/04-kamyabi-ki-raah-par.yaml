subject: hin
chapter: 4
title: "इकाई चार - कामयाबी की राह पर"

tips:
  hin_count_years: "पाठ में दिए साल लिखो और घटाकर देखो। किस साल की बात पूछी गई है, ध्यान से पढ़ो।"
  hin_pele: "पेले दक्षिण अमेरिका के उस देश के खिलाड़ी थे जिसका रंग पीला-हरा है। पाठ में उनके जीते विश्व कप के साल गिनो। उनकी मृत्यु हाल के वर्षों में, बयासी साल की उम्र में हुई।"
  hin_pele_values: "पेले ने कड़े अभ्यास से शरीर मज़बूत रखा (गैरिंचा ने अपनी प्रतिभा शराब पी-पीके बिगाड़ दी); उम्र के साथ खेल टीम की ज़रूरत के हिसाब से बदला; मार-पिटाई पर रोना नहीं रोया, शिकायत नहीं की; उनकी मुसकान भी मशहूर थी।"
  hin_finland: "यह लोककथा यूरोप के उत्तर के एक ठंडे देश की है। बच्चों ने घर को आँगन के एक ऊँचे पेड़, दो गाते पक्षियों और एक तारे से पहचाना। पाठ में देखो कि खुशी के साथ दुख क्यों था।"
  hin_kab_tak: "कवयित्री कहती है कि दूसरों के आने या लड़ने की राह मत देखो, अपना इतिहास खुद लिखो। सोचो: अपने ऊपर भरोसे और अपने मान से जुड़ा कौन-सा भाव सबसे बड़ा है?"
  hin_adj_agree: "आकारांत विशेषण संज्ञा के साथ बदलता है: स्त्रीलिंग के आगे '-ई', और परसर्ग (का/की/को) या बहुवचन से पहले '-ए'। संज्ञा का लिंग और परसर्ग देखो।"
  hin_future: "भविष्य काल में 'गा/गी/गे' कर्ता से मेल खाता है। पहले कर्ता देखो: तारा (पुल्लिंग), भाषा (स्त्रीलिंग), हम (बहुवचन)।"
  h4_pele_cups: 'पेले के चारों विश्व कप अलग करके याद करो: 1958, 1962, 1966, 1970। हर एक में क्या हुआ? सवाल किस साल के बारे में है?'
  h4_pele_players: लेख में कई महान खिलाड़ी हैं। हर खिलाड़ी को उसके देश के साथ जोड़कर याद करो।
  h4_folk_path: 'बच्चों की घर-वापसी की यात्रा क्रम से याद करो: चाँदनी रात, टहनी, दिशा, पक्षी, जंगल का खाना, नाव, फ़ार्म हाउस, घर।'
  h4_folk_feel: 'बच्चों और माता-पिता के मन की हालत सोचो: बिछुड़ने का दुख, घर की याद, मिलने की खुशी। यह उत्तर उस भाव से मेल खाता है?'
  h4_kabtak_idea: कविता दूसरों पर निर्भर रहने के ख़िलाफ़ है और अपने लिए खुद खड़े होने की बात करती है। यह उत्तर किस पक्ष में है?
  h4_future_form: 'क्रिया का रूप कर्ता से मेल खाता है: कर्ता कौन है (मैं, तुम, हम, वह, वे), पुल्लिंग है या स्त्रीलिंग? फिर ''-ऊँगा/-ओगे/-एँगे/-एगा/-एगी'' चुनो।'
  h4_doosra_form: 'यह क्रम बताने वाला विशेषण अपने संज्ञा शब्द के लिंग और वचन से बदलता है। पीछे वाला शब्द देखो: पुल्लिंग, स्त्रीलिंग, या परसर्ग वाला?'

concepts:
  - code: hin9.u4.pele
    title: फुटबॉल के दिल का राजा
    notes: |
      सोपान जोशी (जन्म इंदौर, मध्यप्रदेश; पत्रकार) का लेख। "फुटबॉल क्या कोई देश है, कि उसका राजा हो?"
      फिर भी पेले को खेल का राजा कहते हैं। 29 दिसंबर 2022 को 82 साल की उम्र में मृत्यु; ब्राज़ील में
      शवयात्रा 13 किलोमीटर लंबी। क्लब के खेल से 1977 में रिटायर। दूसरे महान खिलाड़ी: अर्जेंटीना के
      डी स्टीफ़ानो, माराडोना, मेसी; हंगरी के पुस्कास; जर्मनी के बेकनबॉअर; हॉलैंड के क्रायफ़; ब्राज़ील के
      गैरिंचा (सबसे बढ़िया ड्रिब्लर) और डीडी। पेले तीन विश्व कप जीतनेवाले एकमात्र खिलाड़ी: 1958 (17 साल,
      छह गोल; सबसे बढ़िया खिलाड़ी डीडी), 1962 (दूसरे मैच में चोट; गैरिंचा सर्वश्रेष्ठ), 1966 में इतने प्रहार
      कि ब्राज़ील भी बाहर, 1970 (तीसरा विश्व कप; सबसे बढ़िया टीम)। 1279 गोल, ज़्यादातर 'सांतोस' के लिए;
      पाँच-फुट-आठ-इंच। कड़े अभ्यास से शरीर मज़बूत रखा; रोना नहीं रोया; दूसरों को भी गोल बनाकर देते थे;
      मुसकान मशहूर। अफ़्रीकी मूल के काले वर्ण के लोगों को कमतर आँका जाता था, उस समय भयानक गरीबी से
      निकलकर फुटबॉल के दिल पर राज किया। इकाई मुखपृष्ठ: पेले — "सफलता कोई अप्रत्याशित घटना नहीं..."
      व्याकरण: दूसरा/दूसरे/दूसरी; खिलाड़ी के विशेषण (सर्वश्रेष्ठ, करामाती, आक्रामक, बेहतरीन)।
    explanations:
      text: "पेले केवल गोल करने से राजा नहीं बने। गरीबी और रंगभेद के बीच कड़ी मेहनत, अनुशासन, टीम-भावना और मुसकान ने उन्हें फुटबॉल के दिल का राजा बनाया।"
      visual: "समय-रेखा: 1958 (पहला विश्व कप, 17 साल, 6 गोल) → 1962 (दूसरा, चोट) → 1966 (बाहर) → 1970 (तीसरा) → 1977 (क्लब से रिटायर) → 2022 (मृत्यु, 82 साल)।"
      step_by_step: "जीवनी लिखने के लिए: 1. नाम, जन्म, जन्मस्थान। 2. परिवार और शिक्षा। 3. पेशा। 4. महत्वपूर्ण घटनाएँ (विश्व कप)। 5. उपलब्धियाँ (1279 गोल, तीन विश्व कप)। 6. दुनिया पर प्रभाव।"
      real_world: "कोई भी खेल या पढ़ाई: रोज़ का अभ्यास और बुरी आदतों से दूरी ही लंबी सफलता देती है, जैसे पेले और गैरिंचा का अंतर दिखाता है।"
    activity:
      type: number_line
      prompt: पेले के विश्व कप। हर घटना का साल निशान लगाओ।
      min: 1956
      max: 1972
      step: 2
      start: 1956
      goals:
      - prompt: पहला विश्व कप, 17 साल की उम्र, छह गोल
        target: 1958
        hint: पेले चार विश्व कप में खेले। यह उनमें सबसे पहला है।
        mistakes:
        - when:
            v: 1962
          say: 1962 में पेले दूसरे मैच में चोटिल हुए। 17 साल वाला विश्व कप उससे पहले था।
      - prompt: दूसरे मैच में चोट, सर्वश्रेष्ठ गैरिंचा
        target: 1962
        hint: पहले विश्व कप के चार साल बाद।
        mistakes:
        - when:
            v: 1966
          say: 1966 में ब्राज़ील टूर्नामेंट से बाहर हो गया था। गैरिंचा वाला कप उससे पहले जीता गया।
      - prompt: इतने प्रहार कि ब्राज़ील भी बाहर
        target: 1966
        hint: विश्व कप हर चार साल में होता है। 1962 के बाद कौन-सा?
        mistakes:
        - when:
            v: 1970
          say: 1970 में ब्राज़ील ने तीसरा विश्व कप जीता था, बाहर नहीं हुआ।
      - prompt: तीसरा विश्व कप, सबसे बढ़िया टीम
        target: 1970
        hint: ब्राज़ील के बाहर होने के बाद अगला विश्व कप।
        mistakes:
        - when:
            v: 1958
          say: 1958 तो पहला विश्व कप था। तीसरा जीतने के लिए दो और चाहिए।
    lesson:
      - teach: '''फुटबॉल के दिल का राजा'' सोपान जोशी (पत्रकार, जन्म इंदौर) का लेख है। ''फुटबॉल क्या कोई देश है, कि उसका राजा हो?'' — फिर भी ब्राज़ील के पेले को खेल का राजा कहते हैं। 29 दिसंबर 2022 को 82 साल की उम्र में उनकी मृत्यु हुई; ब्राज़ील में उनकी शवयात्रा 13 किलोमीटर लंबी थी।'
        check:
          prompt: पेले की शवयात्रा कितनी लंबी थी?
          options:
          - 13 किलोमीटर
          - 1 किलोमीटर
          - 82 किलोमीटर
          answer: 13 किलोमीटर
          why: 82 उनकी उम्र थी।
        ways:
        - style: real_world
          teach: 'हम सचिन तेंदुलकर को ''क्रिकेट का भगवान'' कहते हैं; वैसे ही ब्राज़ील के पेले को फुटबॉल का राजा कहते हैं। सोपान जोशी (पत्रकार, जन्म इंदौर) का लेख पूछता है: ''फुटबॉल क्या कोई देश है, कि उसका राजा हो?'' 29 दिसंबर 2022 को 82 साल की उम्र में पेले की मृत्यु हुई, और ब्राज़ील में उनकी शवयात्रा 13 किलोमीटर लंबी थी।'
      - teach: 'पेले तीन विश्व कप जीतनेवाले एकमात्र खिलाड़ी हैं। 1958: 17 साल की उम्र, छह गोल। 1962: दूसरे मैच में चोट; गैरिंचा सर्वश्रेष्ठ रहे। 1966: पेले पर इतने प्रहार हुए कि ब्राज़ील बाहर हो गया। 1970: तीसरा विश्व कप, सबसे बढ़िया टीम।'
        picture:
          kind: flow
          steps:
          - '1958: 17 साल, छह गोल, जीत'
          - '1962: चोट, फिर भी जीत'
          - '1966: प्रहार, ब्राज़ील बाहर'
          - '1970: तीसरी जीत'
          alt: पेले के चार विश्व कप, साल के क्रम में।
        check:
          prompt: किस विश्व कप में ब्राज़ील बाहर हो गया?
          options:
          - '1966'
          - '1958'
          - '1970'
          answer: '1966'
          why: पेले पर इतने प्रहार हुए कि टीम बाहर हो गई।
        ways:
        - style: visual
          teach: 'पेले के विश्व कप एक समय-रेखा पर देखो। 1958: 17 साल की उम्र, छह गोल, जीत। 1962: दूसरे मैच में चोट; गैरिंचा सर्वश्रेष्ठ रहे, फिर भी जीत। 1966: पेले पर इतने प्रहार हुए कि ब्राज़ील बाहर हो गया। 1970: तीसरा विश्व कप, सबसे बढ़िया टीम। पेले तीन विश्व कप जीतनेवाले एकमात्र खिलाड़ी हैं।'
          picture:
            kind: flow
            alt: 1958 जीत, 17 साल, छह गोल; 1962 चोट, फिर भी जीत; 1966 ब्राज़ील बाहर; 1970 तीसरी जीत।
            steps:
            - '1958: 17 साल, छह गोल, जीत'
            - '1962: चोट, गैरिंचा चमके, जीत'
            - '1966: प्रहार, ब्राज़ील बाहर'
            - '1970: तीसरा विश्व कप'
      - teach: पेले ने 1279 गोल किए, ज़्यादातर क्लब 'सांतोस' के लिए; क्लब के खेल से 1977 में रिटायर हुए। कड़े अभ्यास से शरीर मज़बूत रखा, कभी रोना नहीं रोया, दूसरों को भी गोल बनाकर देते थे; उनकी मुसकान मशहूर थी। काले लोगों को कमतर आँके जाने के उस समय, भयानक गरीबी से निकलकर उन्होंने फुटबॉल के दिल पर राज किया।
        check:
          prompt: पेले ज़्यादातर गोल किस क्लब के लिए किए?
          options:
          - सांतोस
          - अर्जेंटीना
