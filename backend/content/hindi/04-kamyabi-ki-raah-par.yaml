          teach: 'कहानी की शुरुआत क्रम से देखो। पहला: करीब दो सौ साल पहले फिनलैंड (जिसकी सीमाएँ रूस से मिलती हैं) को युद्ध में बहुत नुकसान हुआ। दूसरा: युद्ध में एक भाई (आठ साल) और बहन (छह साल) घर से बिछुड़ गए। तीसरा: वे दूर देश पहुँचे, जहाँ भले पड़ोसियों ने उनकी देखभाल की। यह लोककथा मंगलेश डबराल ने प्रस्तुत की है।'
      - teach: बच्चों को आँगन के सनोबर (भोज) के पेड़ की याद आती, जिस पर हर सुबह दो पक्षी गाते और रात में शाखाओं के बीच एक चमकीला तारा दिखता। शांति की खबर आई; अभिभावकों ने मना किया, पर बच्चे एक चाँदनी रात चुपके से चल पड़े। भाई ने रक्षा के लिए बलूत की टहनी तोड़ी; वे उत्तर-पश्चिम दिशा में चले; गाते हुए दो पक्षियों ने रास्ता दिखाया।
