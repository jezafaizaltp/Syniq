subject: hin
chapter: 4
title: "इकाई चार - कामयाबी की राह पर"

tips:
  hin_pele: "'फुटबॉल के दिल का राजा' (सोपान जोशी): पेले तीन विश्व कप (1958, 1962, 1970) जीतनेवाले एकमात्र खिलाड़ी हैं। 1958 में 17 साल की उम्र में छह गोल; 1279 गोल का रिकॉर्ड, ज़्यादातर क्लब 'सांतोस' के लिए; 29 दिसंबर 2022 को 82 साल की उम्र में मृत्यु।"
  hin_pele_values: "पेले ने कड़े अभ्यास से शरीर मज़बूत रखा (गैरिंचा ने अपनी प्रतिभा शराब पी-पीके बिगाड़ दी); उम्र के साथ खेल टीम की ज़रूरत के हिसाब से बदला; मार-पिटाई पर रोना नहीं रोया, शिकायत नहीं की; उनकी मुसकान भी मशहूर थी।"
  hin_finland: "'घर, पेड़ और तारे की याद' (मंगलेश डबराल, लोककथा): करीब दो सौ साल पहले फिनलैंड के युद्ध में बिछुड़े भाई (8 साल) और बहन (6 साल) कई साल बाद घर लौटते हैं। निशानी: आँगन का सनोबर का पेड़, उस पर हर सुबह गाते दो पक्षी और रात में शाखाओं के बीच चमकता तारा।"
  hin_kab_tak: "'कब तक?' (वंदना टेटे): अपनी पहचान के लिए दूसरों का मुँह जोहना, किसी के आकर अपने लिए लड़ने या अवतारों के आगमन की बाट जोहना छोड़ो; अपना इतिहास खुद लिखो, क्योंकि आत्म-सम्मान से बड़ी कोई चीज़ नहीं होती।"
  hin_adj_agree: "आकारांत विशेषण संज्ञा के अनुसार बदलता है: दूसरा खिलाड़ी (पुल्लिंग एकवचन), दूसरे खिलाड़ी की / दूसरे खिलाड़ी (परसर्ग या बहुवचन), दूसरी दफ़ा (स्त्रीलिंग)।"
  hin_future: "भविष्यत् काल: मैं जाऊँगा/जाऊँगी, तुम पहचानोगे, हम जाएँगे, वह (घर) मिल जाएगा, तारा दिखाई देगा, भाषा सुनाई देगी। 'गा/गी/गे' कर्ता के लिंग-वचन से मेल खाता है।"

concepts:
  - code: hin9.u4.pele
    title: फुटबॉल के दिल का राजा
    notes: |
      सोपान जोशी (जन्म इंदौर, मध्यप्रदेश; पत्रकार) का लेख। "फुटबॉल क्या कोई देश है, कि उसका राजा हो?"
      फिर भी पेले को खेल का राजा कहते हैं। 29 दिसंबर 2022 को 82 साल की उम्र में मृत्यु; ब्राज़ील में
      शवयात्रा 13 किलोमीटर लंबी। क्लब के खेल से 1977 में रिटायर। दूसरे महान खिलाड़ी: अर्जेंटीना के
      डी स्टीफ़ानो, माराडोना, मेसी; हंगरी के पुस्कास; जर्मनी के बेकनबॉअर; हॉलैंड के क्रायफ़; ब्राज़ील के
      गैरिंचा (सबसे बढ़िया ड्रिब्लर) और डीडी। पेले तीन विश्व कप जीतनेवाले एकमात्र खिलाड़ी: 1958 (17 साल,
      छह गोल; सबसे बढ़िया खिलाड़ी डीडी), 1962 (दूसरे मैच में चोट; गैरिंचा सर्वश्रेष्ठ), 1966 में इतने प्रहार
      कि ब्राज़ील भी बाहर, 1970 (तीसरा विश्व कप; सबसे बढ़िया टीम)। 1279 गोल, ज़्यादातर 'सांतोस' के लिए;
      पाँच-फुट-आठ-इंच। कड़े अभ्यास से शरीर मज़बूत रखा; रोना नहीं रोया; दूसरों को भी गोल बनाकर देते थे;
      मुसकान मशहूर। अफ़्रीकी मूल के काले वर्ण के लोगों को कमतर आँका जाता था, उस समय भयानक गरीबी से
      निकलकर फुटबॉल के दिल पर राज किया। इकाई मुखपृष्ठ: पेले — "सफलता कोई अप्रत्याशित घटना नहीं..."
      व्याकरण: दूसरा/दूसरे/दूसरी; खिलाड़ी के विशेषण (सर्वश्रेष्ठ, करामाती, आक्रामक, बेहतरीन)।
    explanations:
      text: "पेले केवल गोल करने से राजा नहीं बने। गरीबी और रंगभेद के बीच कड़ी मेहनत, अनुशासन, टीम-भावना और मुसकान ने उन्हें फुटबॉल के दिल का राजा बनाया।"
      visual: "समय-रेखा: 1958 (पहला विश्व कप, 17 साल, 6 गोल) → 1962 (दूसरा, चोट) → 1966 (बाहर) → 1970 (तीसरा) → 1977 (क्लब से रिटायर) → 2022 (मृत्यु, 82 साल)।"
      step_by_step: "जीवनी लिखने के लिए: 1. नाम, जन्म, जन्मस्थान। 2. परिवार और शिक्षा। 3. पेशा। 4. महत्वपूर्ण घटनाएँ (विश्व कप)। 5. उपलब्धियाँ (1279 गोल, तीन विश्व कप)। 6. दुनिया पर प्रभाव।"
      real_world: "कोई भी खेल या पढ़ाई: रोज़ का अभ्यास और बुरी आदतों से दूरी ही लंबी सफलता देती है, जैसे पेले और गैरिंचा का अंतर दिखाता है।"
    items:
      - prompt: "'फुटबॉल के दिल का राजा' लेख के लेखक कौन हैं?"
        options: ["सोपान जोशी", "स्वयं प्रकाश", "मंगलेश डबराल", "वंदना टेटे"]
        answer: "सोपान जोशी"
        difficulty: 1
        hints: ["'जल थल मल' उनकी रचना।"]
        solution: "सोपान जोशी।"
        mistakes: {"मंगलेश डबराल": hin_author_work}
      - prompt: "पेले किस देश के खिलाड़ी थे?"
        options: ["ब्राज़ील", "अर्जेंटीना", "हंगरी", "हॉलैंड"]
        answer: "ब्राज़ील"
        difficulty: 1
        hints: ["क्लब 'सांतोस' उसी देश का है।"]
        solution: "ब्राज़ील।"
        mistakes: {"अर्जेंटीना": hin_pele}
      - prompt: "पेले ने कुल कितने विश्व कप जीते?"
        answer: "3"
        check: "3"
        difficulty: 1
        hints: ["1958, 1962, 1970।"]
        solution: "तीन (3); वे ऐसे एकमात्र खिलाड़ी हैं।"
        mistakes: {"2": hin_pele}
      - prompt: "1958 के विश्व कप में पेले की उम्र कितनी थी?"
        answer: "17"
        check: "17"
        difficulty: 2
        hints: ["उस विश्व कप में उन्होंने छह गोल किए।"]
        solution: "17 साल।"
        mistakes: {"6": hin_read_again}
      - prompt: "किस खिलाड़ी को फुटबॉल का सबसे बढ़िया ड्रिब्लर कहा जाता है?"
        options: ["गैरिंचा", "डीडी", "पुस्कास", "मेसी"]
        answer: "गैरिंचा"
        difficulty: 2
        hints: ["ब्राज़ील का करामाती खिलाड़ी, जिसने शराब से अपनी प्रतिभा बिगाड़ी।"]
        solution: "गैरिंचा।"
        mistakes: {"डीडी": hin_read_again}
      - prompt: "पेले की मृत्यु किस वर्ष हुई?"
        answer: "2022"
        check: "2022"
        difficulty: 2
        hints: ["29 दिसंबर, 82 साल की उम्र में।"]
        solution: "2022।"
        mistakes: {"1977": hin_pele}
      - prompt: "लेख के अनुसार पेले गैरिंचा से किस बात में अलग थे?"
        options: ["पेले ने कड़े अभ्यास से शरीर मज़बूत रखा, जबकि गैरिंचा ने शराब से प्रतिभा बिगाड़ दी", "पेले ने कभी गोल नहीं किया", "गैरिंचा ने तीन विश्व कप जीते", "पेले को खेल पसंद नहीं था"]
        answer: "पेले ने कड़े अभ्यास से शरीर मज़बूत रखा, जबकि गैरिंचा ने शराब से प्रतिभा बिगाड़ दी"
        difficulty: 3
        hints: ["अनुशासन का अंतर।"]
        solution: "अभ्यास और अनुशासन ने पेले को लंबे समय तक महान बनाए रखा।"
        mistakes: {"गैरिंचा ने तीन विश्व कप जीते": hin_pele_values}

  - code: hin9.u4.ghar_ped_tara
    title: घर, पेड़ और तारे की याद
    notes: |
      मंगलेश डबराल (जन्म उत्तराखंड; साहित्य अकादमी पुरस्कार) द्वारा प्रस्तुत लोककथा। फिनलैंड (सीमाएँ रूस
      से मिलती हैं) को करीब दो सौ साल पहले युद्ध में बहुत नुकसान हुआ। युद्ध में भाई (आठ साल) और बहन
      (छह साल) घर से बिछुड़कर दूर देश पहुँचे; भले पड़ोसियों ने उनकी देखभाल की। उन्हें आँगन के सनोबर
      (भोज) के पेड़ की याद आती, जिस पर हर सुबह दो पक्षी गाते और रात में शाखाओं के बीच चमकीला तारा
      दिखता। शांति की खबर आई; अभिभावकों ने समझाया ("घर लौटते हुए तुम मुसीबत में ही पड़ोगे"), पर
      बच्चे ज़िद पर रहे और एक चाँदनी रात चुपके से चल पड़े। भाई ने रक्षा के लिए बलूत की टहनी तोड़ी;
      उत्तर-पश्चिम दिशा; गाते दो छोटे पक्षियों ने रास्ता दिखाया; जामुन, बेर खाए, झरनों का पानी पिया; नाव
      खेई। एक फ़ार्म हाउस की लड़की ने माता-पिता की भाषा बोली। लोगों ने सहानुभूति से खाना और रात बिताने
      की जगह दी। "यह रहा हमारा पेड़!" खलिहान, कुआँ; अंदर बूढ़े माता-पिता: "वसंत फिर से आ गया... लेकिन
      हमारे दिल में खुशी की कोई उम्मीद नहीं है।" मिलन; माँ: "आज सुबह-सुबह... दो पक्षी बहुत मिठास के साथ
      गा रहे थे।" भाई: "हमारी भटकन खत्म हो गई है।" व्याकरण: भविष्यत् काल; पटकथा का दृश्य।
    explanations:
      text: "युद्ध ने बच्चों को घर से दूर कर दिया, पर घर की छोटी-छोटी यादें (पेड़, पक्षी, तारा, भाषा) उन्हें वापस ले आईं। हिम्मत, एक-दूसरे का साथ और अनजान लोगों की दया से वे माता-पिता तक पहुँचे।"
      visual: "यात्रा का नक्शा: दूर देश → उत्तर-पश्चिम → चौराहा (गाते पक्षी) → जंगल (जामुन, बेर, झरना) → पहाड़, नदियाँ, झीलें (नाव) → जली इमारतें और फ़ार्म हाउस (माता-पिता की भाषा) → सनोबर का पेड़ और तारा → घर।"
      step_by_step: "घर पहचानने की निशानियाँ: 1. सनोबर का पेड़। 2. उस पर सुबह गाते दो पक्षी। 3. रात में शाखाओं के बीच चमकता तारा। 4. माता-पिता की भाषा। 5. खलिहान और कुआँ।"
      real_world: "आज भी युद्ध और बाढ़ से लाखों लोग शरणार्थी बनते हैं। हम शरणार्थियों के साथ वैसी ही सहानुभूति रख सकते हैं जैसी कहानी के लोगों ने बच्चों के साथ रखी।"
    items:
      - prompt: "'घर, पेड़ और तारे की याद' किस विधा की रचना है?"
        options: ["लोककथा", "कविता", "नाटक", "लेख"]
        answer: "लोककथा"
        difficulty: 1
        hints: ["अनुक्रमणिका में विधा देखें।"]
        solution: "लोककथा (मंगलेश डबराल)।"
        mistakes: {"कविता": hin_author_work}
      - prompt: "कहानी किस देश की है?"
        options: ["फिनलैंड", "रूस", "ब्राज़ील", "म्यानमार"]
        answer: "फिनलैंड"
        difficulty: 1
        hints: ["उत्तरी ध्रुव के पड़ोस का देश; सीमाएँ रूस से मिलती हैं।"]
        solution: "फिनलैंड।"
        mistakes: {"रूस": hin_finland}
      - prompt: "घर से बिछुड़ते समय भाई की उम्र कितनी थी?"
        answer: "8"
        check: "8"
        difficulty: 1
        hints: ["बहन छह साल की थी।"]
        solution: "आठ (8) साल।"
        mistakes: {"6": hin_read_again}
      - prompt: "बच्चों के आँगन में कौन-सा पेड़ था?"
        options: ["सनोबर (भोज)", "बलूत", "जामुन", "बरगद"]
        answer: "सनोबर (भोज)"
        difficulty: 2
        hints: ["बलूत की टहनी तो भाई ने रक्षा के लिए तोड़ी थी।"]
        solution: "सनोबर का पेड़।"
        mistakes: {"बलूत": hin_finland}
      - prompt: "चौराहे पर बच्चों को रास्ता किसने दिखाया?"
        options: ["गीत गानेवाले दो छोटे पक्षियों ने", "एक सैनिक ने", "चाँद ने", "फ़ार्म हाउस की लड़की ने"]
        answer: "गीत गानेवाले दो छोटे पक्षियों ने"
        difficulty: 2
        hints: ["'मैं इसे पक्षियों के गीत से जानता हूँ।'"]
        solution: "दो छोटे पक्षियों ने।"
        mistakes: {"फ़ार्म हाउस की लड़की ने": hin_read_again}
      - prompt: "फ़ार्म हाउस की लड़की की कौन-सी बात सुनकर भाई खुश हो गया?"
        options: ["वह वही भाषा बोल रही थी जो उनके माता-पिता बोलते थे", "उसने कहा कि घर पास है", "उसने उन्हें नाव दी", "उसने तारा दिखाया"]
        answer: "वह वही भाषा बोल रही थी जो उनके माता-पिता बोलते थे"
        difficulty: 2
        hints: ["भाई ने पहले ही कहा था: 'जब हम लोगों को वह भाषा सुनाई देगी...'"]
        solution: "माता-पिता की भाषा सुनकर समझ गया कि वे अपने देश पहुँच गए हैं।"
        mistakes: {"उसने कहा कि घर पास है": hin_finland}
      - prompt: "'लेकिन हमारे दिल में खुशी की कोई उम्मीद नहीं है' — बूढ़े माता-पिता ऐसा क्यों कह रहे थे?"
