          answer: सांतोस
          why: अर्जेंटीना और हंगरी देश हैं, क्लब नहीं।
        ways:
        - style: step_by_step
          teach: 'पेले की सफलता के कारण एक-एक करके गिनो। पहला: कड़े अभ्यास से शरीर मज़बूत रखा। दूसरा: कभी रोना नहीं रोया। तीसरा: दूसरों को भी गोल बनाकर देते थे। चौथा: उनकी मुसकान मशहूर थी। उन्होंने 1279 गोल किए, ज़्यादातर क्लब ''सांतोस'' के लिए, और 1977 में क्लब के खेल से रिटायर हुए। जब काले लोगों को कमतर आँका जाता था, भयानक गरीबी से निकलकर उन्होंने फुटबॉल के दिल पर राज किया।'
    items:
