      - label: पेड़ के बीच से ___ दिखाई देगा
        bin: वह (घर, तारा, भाषा)
        clue: पेड़ की शाखाओं के बीच क्या चमकता था?
        why: तारा दिखाई देगा।
      - label: वह ___ सुनाई देगी
