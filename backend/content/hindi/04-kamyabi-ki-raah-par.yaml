  - code: hin9.u4.vyakaran
    title: "व्याकरण: भविष्यत् काल और 'दूसरा' के रूप"
    after: [hin9.u4.ghar_ped_tara]
    notes: |
      भविष्यत् काल ('घर, पेड़ और तारे की याद' से): मैं तुम्हें ले जाऊँगा; तुम अपना घर कैसे पहचानोगे?;
      हम किसी तरह पहुँच जाएँगे; कभी न कभी घर मिल ही जाएगा; पेड़ के बीच से तारा दिखाई देगा; वह भाषा
      सुनाई देगी। रेखांकित क्रिया-रूप कर्ता (मैं, तुम, हम, घर, तारा, भाषा) से मेल खाते हैं। 'दूसरा' के रूप
      ('फुटबॉल के दिल का राजा' से): पेले जैसा दूसरा खिलाड़ी नहीं हुआ; किसी दूसरे खिलाड़ी की मार-पिटाई
      नहीं हुई; ब्राज़ील ने विश्व कप दूसरी दफ़ा जीता।
    explanations:
      text: "भविष्यत् काल में क्रिया के अंत में गा/गी/गे आता है, जो कर्ता के लिंग और वचन से मेल खाता है। 'दूसरा' जैसे विशेषण भी संज्ञा के अनुसार दूसरा/दूसरे/दूसरी बनते हैं।"
      visual: "तालिका: मैं → जाऊँगा/जाऊँगी | तुम → पहचानोगे | हम → जाएँगे | तारा (पुल्लिंग) → देगा | भाषा (स्त्रीलिंग) → देगी।"
      step_by_step: "1. कर्ता पहचानें। 2. उसका लिंग और वचन देखें। 3. पुल्लिंग एकवचन → गा; स्त्रीलिंग → गी; पुल्लिंग बहुवचन या आदर → गे। 4. मैं → -ऊँगा; तुम → -ओगे; हम/वे → -एँगे; वह → -एगा।"
      real_world: "छुट्टियों की योजना लिखिए: 'मैं नानी के घर जाऊँगा/जाऊँगी, हम समुद्र देखेंगे, माँ खाना बनाएँगी।'"
    activity:
      type: sort
      prompt: रेखांकित क्रिया किस कर्ता से मेल खाती है?
      bins:
      - मैं
      - तुम
      - हम
      - वह (घर, तारा, भाषा)
      items:
      - label: ___ तुम्हें ले जाऊँगा
        bin: मैं
        clue: '''-ऊँगा'' किस कर्ता के साथ आता है?'
        why: मैं ले जाऊँगा।
      - label: ___ अपना घर कैसे पहचानोगे?
        bin: तुम
        clue: '''-ओगे'' किसके साथ?'
        why: तुम पहचानोगे।
      - label: ___ किसी तरह पहुँच जाएँगे
        bin: हम
        clue: '''-एँगे'' बहुवचन है। कौन-सा कर्ता?'
        why: हम पहुँच जाएँगे।
      - label: कभी न कभी ___ मिल ही जाएगा
        bin: वह (घर, तारा, भाषा)
        clue: '''जाएगा'' एकवचन है। क्या मिलेगा?'
