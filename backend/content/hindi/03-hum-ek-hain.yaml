          teach: 'केरल का किसान हो या मिस्र का, थकान, मेहनत और अच्छे कल की उम्मीद सबमें एक जैसी है। गजानन माधव मुक्तिबोध (प्रगतिशील काव्यधारा; जन्म मध्यप्रदेश) यही कहते हैं: ''चाहे जिस देश प्रांत पुर का हो, जन-जन का चेहरा एक।'' जन-जन = हर आम आदमी; पुर = नगर। एशिया, यूरोप, अमरीका — हर जगह की गलियों की धूप एक है।'
      - teach: 'कवि आम लोगों की तीन बातें एक बताते हैं: दुख — चेहरों की झुर्रियाँ (कष्ट-दुख-संताप); संघर्ष — जोश में बँधी मुट्ठियाँ; सपना — जलता हुआ लाल सितारा (बदलाव की प्रतीक्षा)।'
