subject: hin
chapter: 3
title: "इकाई तीन - हम एक हैं"

tips:
  hin_gandhi_watch: "'जब गांधीजी की घड़ी चोरी चली गई' (स्वयं प्रकाश): वायसरॉय माउण्टबेटन की चाय पर गांधीजी ने रूम कूलर बंद करवाया, घड़ी चोरी होने का दुख जताया और बकरी के दूध का दही अपने साथ लाकर खाया। लेखक के अनुसार हर बात में एक बिना कहा संदेश था।"
  hin_unspoken: "रूम कूलर बंद करवाना = ठंडे कमरों में बैठकर हिंदुस्तान पर हुकूमत नहीं होगी; घड़ी की बात बढ़ा-चढ़ाकर कहना = जिस ब्रिटिश राज का ढोल पीटते हो, उसमें मेरी घड़ी तक सुरक्षित नहीं; अपना नाश्ता = भारत के लोग अपनी मेहनत की खाते हैं।"
  hin_jan_jan: "'जन-जन का चेहरा एक' (मुक्तिबोध): चाहे किसी भी देश, प्रांत या पुर का हो, सब लोगों का दुख, संघर्ष और सपना एक है: एशिया, यूरोप, अमरीका की गलियों की धूप एक; गंगा, इरावती, नील, आमेज़न में बहती ज़िंदगी की धारा एक।"
  hin_pronoun: "सर्वनाम के परसर्ग युक्त रूप: मैं → मेरा/मेरी/मेरे, मुझे, मुझसे; हम → हमारा, हमें; वह → उसका, उसे; वे → उनका, उन्हें; तुम → तुम्हारा, तुम्हें।"
  hin_idiom: "मुहावरे: मज़ा किरकिरा करना = आनंद नष्ट करना; ढोल पीटना = सबको बताते फिरना, प्रचार करना; शान दिखाना = अपना बड़प्पन दिखाना।"

concepts:
  - code: hin9.u3.gandhi_ghadi
    title: जब गांधीजी की घड़ी चोरी चली गई
    notes: |
      स्वयं प्रकाश (जन्म मध्यप्रदेश) का लेख। अंग्रेज़ों के अंतिम वायसरॉय लॉर्ड माउण्टबेटन ने सोचा कि
      गांधीजी से बात किए बगैर भारत में कुछ नहीं किया जा सकता, इसलिए उन्हें चाय पर बुलाया। श्रीमती
      माउण्टबेटन ने तैयारी का ज़िम्मा लिया। गर्मियों के दिन; कमरा एक घंटा पहले रूम कूलर चलाकर ठंडा
      किया गया (उस ज़माने में पूरे हिंदुस्तान में एक ही रूम कूलर था)। गांधीजी धोती से बदन लपेटकर
      सिकुड़-सिमटकर बैठे, अनमनेपन से हाँ-हूँ करते रहे, फिर बोले: "इस कूलर को प्लीज़ बंद कर दीजिए, मुझे
      सर्दी लग रही है।" फिर बताया कि रास्ते में रेलगाड़ी में किसी ने उनकी बहुत पुरानी, प्यारी घड़ी चुरा ली,
      जिसमें वे रोज़ सोने से पहले चाबी भरते थे। नाश्ते के समय: "आप लोग लीजिए। मैं तो अपना नाश्ता साथ
      लाया हूँ।" सहयोगी ने खादी के पुराने थैले से बकरी के दूध के दही का डिब्बा और टूटे हत्थे वाला चम्मच
      (लकड़ी की खपच्ची धागे से बँधी) निकाला। अगले दिन अख़बारों में बातचीत की नहीं, घड़ी चोरी की खबर बड़े
      अक्षरों में थी; कुछ रोज़ बाद चोर ने साबरमती आश्रम जाकर घड़ी लौटा दी। स्रोत: लेपियर और कौलिन की
      पुस्तक 'फ्रीडम एट मिडनाइट'। इकाई मुखपृष्ठ: मैथिलीशरण गुप्त "वही मनुष्य है कि जो मनुष्य के लिए मरे"।
      व्याकरण: सर्वनाम के परसर्ग युक्त रूप; मुहावरे (मज़ा किरकिरा करना, ढोल पीटना)।
    explanations:
      text: "गांधीजी ने वायसरॉय की शानदार चाय पार्टी में बिना कुछ कहे बहुत कुछ कह दिया: सादगी, आत्मसम्मान और यह संदेश कि भारत के लोगों से बात करनी है तो उनकी ज़मीन पर आओ।"
      visual: "तीन खानों की तालिका — गांधीजी का व्यवहार → लेखक की व्याख्या: कूलर बंद करवाना → ठंडे कमरों से हुकूमत नहीं; घड़ी चोरी की बात → ब्रिटिश राज में घड़ी तक सुरक्षित नहीं; अपना नाश्ता (बकरी के दूध का दही) → मेहनत की कमाई और गरीब जनता से जुड़ाव।"
      step_by_step: "1. आमंत्रण क्यों? (गांधीजी के बिना कुछ नहीं हो सकता)। 2. भारी तैयारियाँ। 3. कूलर: वायसरॉय की शान का पहला मौका छिना। 4. घड़ी की चोरी की बात। 5. अपना नाश्ता। 6. अख़बारों में असर। 7. लेखक की व्याख्या।"
      real_world: "अपनी बात हमेशा भाषण से ही नहीं, व्यवहार से भी कही जा सकती है। आपके किस व्यवहार से दूसरों को आपके बारे में बिना कहे पता चलता है?"
    items:
      - prompt: "इस लेख के लेखक कौन हैं?"
        options: ["स्वयं प्रकाश", "मुक्तिबोध", "सोपान जोशी", "प्रेमचंद"]
        answer: "स्वयं प्रकाश"
        difficulty: 1
        hints: ["जन्म मध्यप्रदेश में; 'ईंधन' उनकी रचना।"]
        solution: "स्वयं प्रकाश।"
        mistakes: {"सोपान जोशी": hin_author_work}
      - prompt: "गांधीजी को चाय पर किसने बुलाया?"
        options: ["लॉर्ड माउण्टबेटन ने", "नेहरूजी ने", "रानी विक्टोरिया ने", "साबरमती आश्रम के लोगों ने"]
        answer: "लॉर्ड माउण्टबेटन ने"
        difficulty: 1
        hints: ["अंग्रेज़ों के अंतिम वायसरॉय।"]
        solution: "लॉर्ड माउण्टबेटन ने।"
        mistakes: {"नेहरूजी ने": hin_read_again}
      - prompt: "गांधीजी ने कमरे का रूम कूलर बंद क्यों करवाया? (उन्होंने खुद क्या कहा?)"
        options: ["उन्हें सर्दी लग रही थी", "कूलर बहुत शोर कर रहा था", "बिजली बचानी थी", "कूलर खराब था"]
        answer: "उन्हें सर्दी लग रही थी"
        difficulty: 1
        hints: ["'इस कूलर को प्लीज़ बंद कर दीजिए, मुझे...'"]
        solution: "'मुझे सर्दी लग रही है।' (लेखक इसमें एक छिपा संदेश भी देखते हैं।)"
        mistakes: {"बिजली बचानी थी": hin_read_again}
      - prompt: "गांधीजी अपने नाश्ते में क्या लाए थे?"
        options: ["बकरी के दूध से बना दही", "रोटी और सब्ज़ी", "फल", "चाय और बिस्कुट"]
        answer: "बकरी के दूध से बना दही"
        difficulty: 2
        hints: ["खादी के थैले में एक छोटा-सा डिब्बा और टूटा चम्मच।"]
        solution: "बकरी के दूध का दही।"
        mistakes: {"चाय और बिस्कुट": hin_gandhi_watch}
      - prompt: "लेखक के अनुसार रूम कूलर बंद करवाने का सीधा संदेश क्या था?"
        options: ["ठंडे कमरों में बैठकर हिंदुस्तान पर हुकूमत नहीं की जा सकेगी", "गांधीजी बीमार थे", "गांधीजी को अंग्रेज़ पसंद थे", "कमरा बहुत छोटा था"]
        answer: "ठंडे कमरों में बैठकर हिंदुस्तान पर हुकूमत नहीं की जा सकेगी"
        difficulty: 2
        hints: ["'हमसे बात करनी है तो बाहर धूप में और खुले मैदान में आओ।'"]
        solution: "जनता के बीच, धूप में आकर बात करो।"
        mistakes: {"गांधीजी बीमार थे": hin_unspoken}
      - prompt: "गांधीजी की घड़ी अंत में कैसे वापस मिली?"
        options: ["चोर ने साबरमती आश्रम जाकर लौटा दी", "पुलिस ने ढूँढ़ निकाली", "वायसरॉय ने नई घड़ी दी", "वह कभी नहीं मिली"]
        answer: "चोर ने साबरमती आश्रम जाकर लौटा दी"
        difficulty: 2
        hints: ["अख़बारों में खबर छपने के कुछ रोज़ बाद।"]
        solution: "चोर ने खुद साबरमती आश्रम जाकर लौटा दी।"
        mistakes: {"वायसरॉय ने नई घड़ी दी": hin_read_again}
      - prompt: "'मैं तो अपना नाश्ता साथ लाया हूँ' — यहाँ गांधीजी के स्वभाव की कौन-सी विशेषता दिखती है?"
        options: ["सादगी और आत्मसम्मान", "घमंड", "डर", "आलस्य"]
        answer: "सादगी और आत्मसम्मान"
        difficulty: 3
        hints: ["'कितने लोगों में इतनी हिम्मत होगी...?'"]
        solution: "सादा भोजन, और शासक की दावत के सामने भी अपनी बात पर टिके रहने का आत्मसम्मान।"
        mistakes: {"घमंड": hin_gandhi_watch}

  - code: hin9.u3.jan_jan
    title: जन-जन का चेहरा एक
    notes: |
      गजानन माधव मुक्तिबोध (प्रगतिशील काव्यधारा; जन्म मध्यप्रदेश; रचनाएँ: चाँद का मुँह टेढ़ा है, भूरी भूरी
      खाक धूल, एक साहित्यिक की डायरी) की कविता। "चाहे जिस देश प्रांत पुर का हो / जन-जन का चेहरा एक।"
      एशिया, यूरोप, अमरीका की गलियों की धूप एक; कष्ट-दुख-संताप से चेहरों पर पड़ी झुर्रियों का रूप एक
      (जनता की वेदना); जोश में ताकत से बँधी मुट्ठियों का एक लक्ष्य (जनता का विरोध/संघर्ष); पृथ्वी के गोल
      धरातल पर जनता का दल एक, पक्ष एक; जलता हुआ लाल भयानक सितारा एक (जनता की प्रतीक्षा, शोषितों का
      सपना); गंगा (भारत), इरावती (म्यानमार), मिनाम, नील (मिस्र), आमेज़न (दक्षिण अमरीका), मिसौरी में
      वेदना से गाती हुई बहती ज़िंदगी की धारा एक। संदेश: विश्वभर के आम लोगों का दुख, संघर्ष और सपना एक है।
    explanations:
      text: "दुनिया के किसी भी कोने में रहने वाले आम लोग एक जैसा दुख झेलते हैं, एक जैसा संघर्ष करते हैं और एक जैसे सपने देखते हैं। इसलिए कवि कहते हैं: जन-जन का चेहरा एक है।"
      visual: "विश्व-मानचित्र पर नदियाँ: गंगा (भारत), इरावती (म्यानमार), नील (मिस्र), आमेज़न (दक्षिण अमरीका), मिसौरी (उत्तर अमरीका); सबको जोड़ती एक धारा और ऊपर एक लाल सितारा।"
      step_by_step: "प्रतीक पहचानें: 1. झुर्रियाँ → वेदना। 2. बँधी मुट्ठियाँ → संघर्ष, विरोध। 3. जलता लाल सितारा → आशा, प्रतीक्षा। 4. नदियों की धारा → बहती ज़िंदगी, जो हर जगह एक है।"
      real_world: "समाचार में किसी दूसरे देश के किसानों या मज़दूरों की परेशानी देखें, तो सोचिए: क्या हमारे यहाँ भी ऐसा होता है? यही 'जन-जन का चेहरा एक' है।"
    items:
      - prompt: "'जन-जन का चेहरा एक' कविता के कवि कौन हैं?"
        options: ["मुक्तिबोध", "मैथिलीशरण गुप्त", "नागार्जुन", "रामदरश मिश्र"]
        answer: "मुक्तिबोध"
        difficulty: 1
        hints: ["गजानन माधव।"]
        solution: "गजानन माधव मुक्तिबोध।"
        mistakes: {"मैथिलीशरण गुप्त": hin_author_work}
      - prompt: "'जन-जन' से कवि का मतलब क्या है?"
        options: ["हर आम व्यक्ति, सारी जनता", "केवल भारत के लोग", "केवल राजा", "केवल कवि"]
        answer: "हर आम व्यक्ति, सारी जनता"
        difficulty: 1
        hints: ["'चाहे जिस देश प्रांत पुर का हो'।"]
        solution: "दुनिया का हर आम आदमी।"
        mistakes: {"केवल भारत के लोग": hin_jan_jan}
      - prompt: "इरावती नदी मुख्य रूप से किस देश में है?"
        options: ["म्यानमार", "भारत", "मिस्र", "दक्षिण अमरीका"]
        answer: "म्यानमार"
        difficulty: 2
        hints: ["गंगा भारत में, नील मिस्र में।"]
        solution: "म्यानमार।"
        mistakes: {"मिस्र": hin_read_again}
      - prompt: "'चेहरों पर पड़ी हुई झुर्रियों का रूप एक' — झुर्रियाँ किसकी ओर संकेत करती हैं?"
        options: ["जनता की वेदना (कष्ट-दुख-संताप)", "जनता का विरोध", "जनता की खुशी", "जनता की प्रतीक्षा"]
        answer: "जनता की वेदना (कष्ट-दुख-संताप)"
        difficulty: 2
        hints: ["'कष्ट-दुख संताप की...'"]
        solution: "जनता की वेदना।"
        mistakes: {"जनता का विरोध": hin_jan_jan}
      - prompt: "'जोश में यों ताकत से बँधी हुई मुट्ठियों का एक लक्ष्य' — बँधी मुट्ठियाँ किसका प्रतीक हैं?"
        options: ["अन्याय के विरुद्ध जनता का संघर्ष", "जनता का डर", "जनता की नींद", "जनता का खेल"]
        answer: "अन्याय के विरुद्ध जनता का संघर्ष"
        difficulty: 2
        hints: ["बँधी मुट्ठी = संकल्प और विरोध।"]
        solution: "संघर्ष और विरोध।"
        mistakes: {"जनता का डर": hin_jan_jan}
      - prompt: "कवि ने ऐसा क्यों कहा कि जन-जन का चेहरा एक है?"
        options: ["क्योंकि दुनिया भर के आम लोगों का दुख, संघर्ष और सपना एक है", "क्योंकि सबकी शक्ल एक जैसी है", "क्योंकि सब एक ही भाषा बोलते हैं", "क्योंकि सब एक ही देश में रहते हैं"]
        answer: "क्योंकि दुनिया भर के आम लोगों का दुख, संघर्ष और सपना एक है"
        difficulty: 3
        hints: ["यहाँ 'चेहरा' शक्ल नहीं, जीवन की स्थिति है।"]
        solution: "चेहरा = जीवन-अनुभव; वह हर जगह एक है।"
        mistakes: {"क्योंकि सबकी शक्ल एक जैसी है": hin_jan_jan}

  - code: hin9.u3.vyakaran
    title: "व्याकरण: सर्वनाम के रूप और मुहावरे"
    after: [hin9.u3.gandhi_ghadi]
    notes: |
      गांधीजी बोले, "मैं आ रहा था तो रास्ते में रेलगाड़ी में किसी ने मेरी घड़ी चुरा ली। वह बहुत पुरानी घड़ी
      थी और मुझे बहुत प्यारी थी।" यहाँ 'मैं' = गांधीजी; 'मेरी', 'मुझे' उसी सर्वनाम के परसर्ग युक्त रूप हैं
      (मैं + का = मेरा/मेरी; मैं + को = मुझे)। मुहावरे: मज़ा किरकिरा करना ("विराट के विकेट गिरने से सारा
      मज़ा किरकिरा हो गया"), ढोल पीटना ("संजू से कुछ मत कहिएगा, वह ढोल पीट देगा"), शान दिखाना।
    explanations:
      text: "सर्वनाम परसर्ग (का, को, से) के साथ रूप बदलते हैं: मैं → मेरा, मुझे; वे → उनका, उन्हें। मुहावरे का अर्थ शब्दों से अलग, एक विशेष अर्थ होता है।"
      visual: "तालिका: मैं → मेरी, मुझे | हम → हमारा, हमें | वह → उसका, उसे | वे → उनका, उन्हें | तुम → तुम्हारा, तुम्हें।"
      step_by_step: "1. मूल सर्वनाम पहचानें। 2. देखें कौन-सा परसर्ग जुड़ा है (का/को/से)। 3. 'का' से संबंध (मेरा), 'को' से कर्म या पाने वाला (मुझे)। 4. संज्ञा के लिंग से मेरा/मेरी/मेरे।"
      real_world: "दोस्त को चिट्ठी लिखते समय 'मैं', 'मेरा', 'मुझे' का सही प्रयोग करें: 'मुझे तुम्हारी याद आती है' — 'मैं को तुम्हारी याद' नहीं।"
    items:
      - prompt: "'मुझे बहुत प्यारी थी' — 'मुझे' किस सर्वनाम का रूप है?"
        options: ["मैं", "हम", "तुम", "वह"]
        answer: "मैं"
        difficulty: 1
        hints: ["मैं + को = मुझे।"]
        solution: "मैं।"
        mistakes: {"हम": hin_pronoun}
      - prompt: "'___ घड़ी चोरी हो गई।' (मैं + का, घड़ी स्त्रीलिंग)"
        options: ["मेरी", "मेरा", "मेरे", "मुझे"]
        answer: "मेरी"
        difficulty: 1
        hints: ["घड़ी स्त्रीलिंग है।"]
        solution: "मेरी घड़ी।"
        mistakes: {"मेरा": hin_pronoun}
      - prompt: "'वे' सर्वनाम का 'को' वाला रूप?"
        options: ["उन्हें", "उसे", "उनका", "हमें"]
        answer: "उन्हें"
        difficulty: 2
        hints: ["वह → उसे; वे → ?"]
        solution: "वे + को = उन्हें।"
        mistakes: {"उसे": hin_pronoun}
      - prompt: "'मज़ा किरकिरा करना' का अर्थ?"
        options: ["आनंद नष्ट करना", "बहुत मज़ा आना", "खाना खराब होना", "जीत जाना"]
        answer: "आनंद नष्ट करना"
        difficulty: 2
        hints: ["विराट का विकेट गिरा और..."]
        solution: "आनंद नष्ट करना।"
        mistakes: {"बहुत मज़ा आना": hin_idiom}
      - prompt: "'वह ढोल पीट देगा' — यहाँ 'ढोल पीटना' का अर्थ?"
        options: ["सब जगह बात फैला देना", "संगीत बजाना", "किसी को मारना", "चुप रहना"]
        answer: "सब जगह बात फैला देना"
        difficulty: 3
        hints: ["'कोई भी संजू से कुछ मत कहिएगा...'"]
        solution: "ढोल पीटना = प्रचार करना, सबको बता देना।"
        mistakes: {"संगीत बजाना": hin_idiom}
