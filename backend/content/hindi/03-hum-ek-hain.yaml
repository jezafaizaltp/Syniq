  - code: hin9.u3.jan_jan
    title: जन-जन का चेहरा एक
    notes: |
      गजानन माधव मुक्तिबोध (प्रगतिशील काव्यधारा; जन्म मध्यप्रदेश; रचनाएँ: चाँद का मुँह टेढ़ा है, भूरी भूरी
      खाक धूल, एक साहित्यिक की डायरी) की कविता। "चाहे जिस देश प्रांत पुर का हो / जन-जन का चेहरा एक।"
      एशिया, यूरोप, अमरीका की गलियों की धूप एक; कष्ट-दुख-संताप से चेहरों पर पड़ी झुर्रियों का रूप एक
      (जनता की वेदना); जोश में ताकत से बँधी मुट्ठियों का एक लक्ष्य (जनता का विरोध/संघर्ष); पृथ्वी के गोल
      धरातल पर जनता का दल एक, पक्ष एक; जलता हुआ लाल भयानक सितारा एक (जनता की प्रतीक्षा, शोषितों का
      सपना); गंगा (भारत), इरावती (म्यानमार), मिनाम, नील (मिस्र), आमेज़न (दक्षिण अमरीका), मिसौरी में
      वेदना से गाती हुई बहती ज़िंदगी की धारा एक। संदेश: विश्वभर के आम लोगों का दुख, संघर्ष और सपना एक है।
    explanations:
      text: "दुनिया के किसी भी कोने में रहने वाले आम लोग एक जैसा दुख झेलते हैं, एक जैसा संघर्ष करते हैं और एक जैसे सपने देखते हैं। इसलिए कवि कहते हैं: जन-जन का चेहरा एक है।"
      visual: "विश्व-मानचित्र पर नदियाँ: गंगा (भारत), इरावती (म्यानमार), नील (मिस्र), आमेज़न (दक्षिण अमरीका), मिसौरी (उत्तर अमरीका); सबको जोड़ती एक धारा और ऊपर एक लाल सितारा।"
      step_by_step: "प्रतीक पहचानें: 1. झुर्रियाँ → वेदना। 2. बँधी मुट्ठियाँ → संघर्ष, विरोध। 3. जलता लाल सितारा → आशा, प्रतीक्षा। 4. नदियों की धारा → बहती ज़िंदगी, जो हर जगह एक है।"
      real_world: "समाचार में किसी दूसरे देश के किसानों या मज़दूरों की परेशानी देखें, तो सोचिए: क्या हमारे यहाँ भी ऐसा होता है? यही 'जन-जन का चेहरा एक' है।"
    activity:
      type: sort
      prompt: कविता में हर 'एक' जनता की किस बात का प्रतीक है?
      bins:
      - जनता की वेदना
      - जनता का संघर्ष
      - जनता का सपना
      items:
      - label: चेहरों पर झुर्रियों का रूप एक
        bin: जनता की वेदना
        clue: झुर्रियाँ किस कारण पड़ीं?
        why: 'कष्ट-दुख-संताप से पड़ी झुर्रियाँ: वेदना।'
      - label: वेदना से गाती ज़िंदगी की धारा एक
        bin: जनता की वेदना
        clue: धारा किस भाव से गाती है?
        why: 'गंगा से मिसौरी तक, दुख से गाती ज़िंदगी: वेदना।'
      - label: जोश में बँधी मुट्ठियों का लक्ष्य एक
        bin: जनता का संघर्ष
        clue: मुट्ठी कब बँधती है?
        why: बँधी मुट्ठी विरोध और लड़ाई का चिह्न है।
      - label: जनता का दल एक, पक्ष एक
        bin: जनता का संघर्ष
        clue: दल और पक्ष किसलिए बनते हैं?
        why: 'एक दल, एक पक्ष: मिलकर संघर्ष।'
      - label: जलता हुआ लाल सितारा एक
        bin: जनता का सपना
        clue: सितारा आगे दिखनेवाली किस चीज़ का प्रतीक है?
        why: 'शोषितों का सपना और प्रतीक्षा: लाल सितारा।'
    lesson:
      - teach: '''जन-जन का चेहरा एक'' गजानन माधव मुक्तिबोध की कविता है (प्रगतिशील काव्यधारा; जन्म मध्यप्रदेश)। ''चाहे जिस देश प्रांत पुर का हो, जन-जन का चेहरा एक।'' जन-जन = हर आम आदमी, सारी जनता। एशिया, यूरोप, अमरीका — हर जगह की गलियों की धूप एक है।'
        check:
          prompt: '''पुर'' शब्द का अर्थ क्या है?'
