subject: hin
chapter: 3
title: "इकाई तीन - हम एक हैं"

tips:
  hin_pronoun_case: "पहले मूल सर्वनाम पहचानो (मैं, हम, तुम, वह, वे), फिर देखो कौन-सा परसर्ग जुड़ रहा है: का, को या ने।"
  hin_gandhi_watch: "वायसरॉय की चाय पर गांधीजी अपना खाना साथ लाए थे, जो एक जानवर के दूध से बना था। सोचो, यह उनके किस गुण को दिखाता है।"
  hin_unspoken: "रूम कूलर बंद करवाना = ठंडे कमरों में बैठकर हिंदुस्तान पर हुकूमत नहीं होगी; घड़ी की बात बढ़ा-चढ़ाकर कहना = जिस ब्रिटिश राज का ढोल पीटते हो, उसमें मेरी घड़ी तक सुरक्षित नहीं; अपना नाश्ता = भारत के लोग अपनी मेहनत की खाते हैं।"
  hin_jan_jan: "'जन-जन का चेहरा एक' (मुक्तिबोध): चाहे किसी भी देश, प्रांत या पुर का हो, सब लोगों का दुख, संघर्ष और सपना एक है: एशिया, यूरोप, अमरीका की गलियों की धूप एक; गंगा, इरावती, नील, आमेज़न में बहती ज़िंदगी की धारा एक।"
  hin_pronoun: "परसर्ग जुड़ने पर सर्वनाम का रूप बदलता है। पहले मूल सर्वनाम पहचानो, फिर देखो कि आगे वाली संज्ञा पुल्लिंग है या स्त्रीलिंग, एकवचन या बहुवचन।"
  hin_idiom: "मुहावरे का अर्थ शब्दों से अलग होता है। सोचो: किरकिरा (रेत जैसा) खाने में आए तो स्वाद का क्या होता है? ढोल बजने से बात कितने लोगों तक पहुँचती है?"
  h3_gandhi_detail: 'घटनाएँ क्रम से याद करो: न्योता, कूलर, घड़ी की चोरी, नाश्ता, अगले दिन के अख़बार, घड़ी की वापसी। सवाल किस हिस्से के बारे में है?'
  h3_gandhi_message: गांधीजी सीधे कुछ नहीं कहते; उनकी हर छोटी बात में एक छिपा संदेश है। यह उत्तर उस संदेश तक पहुँचता है या केवल ऊपरी बात बताता है?
  h3_poet_facts: 'कवि के बारे में दी गई जानकारी फिर पढ़ो: किस काव्यधारा के, कहाँ जन्मे, कौन-सी रचनाएँ।'
  h3_river_country: 'कविता में अलग-अलग महाद्वीपों की नदियाँ हैं। नक्शे पर सोचो: यह नदी किस देश या महाद्वीप में बहती है?'
  h3_symbol: 'कविता की हर चीज़ (झुर्रियाँ, मुट्ठियाँ, सितारा, नदियाँ) आम लोगों के जीवन के किसी हिस्से का प्रतीक है। यह किस हिस्से से जुड़ती है: दुख, संघर्ष या सपना?'
  h3_pronoun_form: पहले मूल सर्वनाम पहचानो (मैं, हम, तुम, वह, वे), फिर देखो कौन-सा परसर्ग जुड़ा है (का, को, ने)।
  h3_idiom_sense: मुहावरे का अर्थ शब्दों से नहीं, वाक्य के भाव से निकलता है। वाक्य में रखकर देखो कौन-सा अर्थ बैठता है।

concepts:
  - code: hin9.u3.gandhi_ghadi
    title: जब गांधीजी की घड़ी चोरी चली गई
    notes: |
      स्वयं प्रकाश (जन्म मध्यप्रदेश) का लेख। अंग्रेज़ों के अंतिम वायसरॉय लॉर्ड माउण्टबेटन ने सोचा कि
      गांधीजी से बात किए बगैर भारत में कुछ नहीं किया जा सकता, इसलिए उन्हें चाय पर बुलाया। श्रीमती
      माउण्टबेटन ने तैयारी का ज़िम्मा लिया। गर्मियों के दिन; कमरा एक घंटा पहले रूम कूलर चलाकर ठंडा
      किया गया (उस ज़माने में पूरे हिंदुस्तान में एक ही रूम कूलर था)। गांधीजी धोती से बदन लपेटकर
      सिकुड़-सिमटकर बैठे, अनमनेपन से हाँ-हूँ करते रहे, फिर बोले: "इस कूलर को प्लीज़ बंद कर दीजिए, मुझे
      सर्दी लग रही है।" फिर बताया कि रास्ते में रेलगाड़ी में किसी ने उनकी बहुत पुरानी, प्यारी घड़ी चुरा ली,
      जिसमें वे रोज़ सोने से पहले चाबी भरते थे। नाश्ते के समय: "आप लोग लीजिए। मैं तो अपना नाश्ता साथ
      लाया हूँ।" सहयोगी ने खादी के पुराने थैले से बकरी के दूध के दही का डिब्बा और टूटे हत्थे वाला चम्मच
      (लकड़ी की खपच्ची धागे से बँधी) निकाला। अगले दिन अख़बारों में बातचीत की नहीं, घड़ी चोरी की खबर बड़े
      अक्षरों में थी; कुछ रोज़ बाद चोर ने साबरमती आश्रम जाकर घड़ी लौटा दी। स्रोत: लेपियर और कौलिन की
      पुस्तक 'फ्रीडम एट मिडनाइट'। इकाई मुखपृष्ठ: मैथिलीशरण गुप्त "वही मनुष्य है कि जो मनुष्य के लिए मरे"।
      व्याकरण: सर्वनाम के परसर्ग युक्त रूप; मुहावरे (मज़ा किरकिरा करना, ढोल पीटना)।
    explanations:
      text: "गांधीजी ने वायसरॉय की शानदार चाय पार्टी में बिना कुछ कहे बहुत कुछ कह दिया: सादगी, आत्मसम्मान और यह संदेश कि भारत के लोगों से बात करनी है तो उनकी ज़मीन पर आओ।"
      visual: "तीन खानों की तालिका — गांधीजी का व्यवहार → लेखक की व्याख्या: कूलर बंद करवाना → ठंडे कमरों से हुकूमत नहीं; घड़ी चोरी की बात → ब्रिटिश राज में घड़ी तक सुरक्षित नहीं; अपना नाश्ता (बकरी के दूध का दही) → मेहनत की कमाई और गरीब जनता से जुड़ाव।"
      step_by_step: "1. आमंत्रण क्यों? (गांधीजी के बिना कुछ नहीं हो सकता)। 2. भारी तैयारियाँ। 3. कूलर: वायसरॉय की शान का पहला मौका छिना। 4. घड़ी की चोरी की बात। 5. अपना नाश्ता। 6. अख़बारों में असर। 7. लेखक की व्याख्या।"
      real_world: "अपनी बात हमेशा भाषण से ही नहीं, व्यवहार से भी कही जा सकती है। आपके किस व्यवहार से दूसरों को आपके बारे में बिना कहे पता चलता है?"
    activity:
      type: order
      prompt: चाय वाले दिन की घटनाएँ क्रम से लगाओ।
      steps:
      - माउण्टबेटन गांधीजी को चाय पर बुलाते हैं
      - कमरा एक घंटा पहले कूलर से ठंडा किया जाता है
      - गांधीजी धोती लपेटकर सिकुड़कर बैठते हैं
      - '"इस कूलर को प्लीज़ बंद कर दीजिए"'
      - रेलगाड़ी में घड़ी चोरी होने की बात
      - '"मैं तो अपना नाश्ता साथ लाया हूँ"'
      reasons:
        कमरा एक घंटा पहले कूलर से ठंडा किया जाता है: तैयारी तभी होती है जब मेहमान को बुलाया गया हो।
        गांधीजी धोती लपेटकर सिकुड़कर बैठते हैं: ठंडे कमरे में आकर ही उन्हें सर्दी लगी।
        '"इस कूलर को प्लीज़ बंद कर दीजिए"': सिकुड़कर बैठने के बाद ही वे बोले कि सर्दी लग रही है।
        रेलगाड़ी में घड़ी चोरी होने की बात: कूलर बंद करवाने के बाद उन्होंने यह बताया।
        '"मैं तो अपना नाश्ता साथ लाया हूँ"': यह नाश्ते के समय कहा गया, बातचीत के बाद।
    lesson:
      - teach: '''जब गांधीजी की घड़ी चोरी चली गई'' स्वयं प्रकाश का लेख है। अंग्रेज़ों के अंतिम वायसरॉय लॉर्ड माउण्टबेटन ने सोचा कि गांधीजी से बात किए बिना भारत में कुछ नहीं हो सकता, इसलिए उन्हें चाय पर बुलाया। तैयारी श्रीमती माउण्टबेटन ने की। गर्मियाँ थीं; कमरा एक घंटा पहले रूम कूलर चलाकर ठंडा किया गया — उस ज़माने में पूरे हिंदुस्तान में एक ही रूम कूलर था।'
        check:
          prompt: चाय की तैयारी का ज़िम्मा किसने लिया?
          options:
          - श्रीमती माउण्टबेटन
          - गांधीजी
          - स्वयं प्रकाश
          answer: श्रीमती माउण्टबेटन
          why: वायसरॉय की पत्नी ने तैयारी की।
        ways:
        - style: step_by_step
          teach: 'चाय की तैयारी क्रम से देखो। पहला: अंग्रेज़ों के अंतिम वायसरॉय लॉर्ड माउण्टबेटन ने सोचा कि गांधीजी से बात किए बिना भारत में कुछ नहीं हो सकता। दूसरा: उन्होंने गांधीजी को चाय पर बुलाया। तीसरा: तैयारी श्रीमती माउण्टबेटन ने की। चौथा: गर्मियाँ थीं, इसलिए कमरा एक घंटा पहले रूम कूलर से ठंडा किया गया — उस ज़माने में पूरे हिंदुस्तान में एक ही रूम कूलर था। लेख स्वयं प्रकाश का है।'
      - teach: 'गांधीजी धोती से बदन लपेटकर सिकुड़कर बैठे, अनमनेपन से हाँ-हूँ करते रहे, फिर बोले: ''इस कूलर को प्लीज़ बंद कर दीजिए, मुझे सर्दी लग रही है।'' फिर बताया कि रेलगाड़ी में किसी ने उनकी पुरानी, प्यारी घड़ी चुरा ली। नाश्ते पर बोले: ''मैं तो अपना नाश्ता साथ लाया हूँ'' — खादी के थैले से बकरी के दूध के दही का डिब्बा और टूटे हत्थे वाला चम्मच निकला।'
        picture:
          kind: compare
          columns:
          - title: गांधीजी ने क्या किया
            points:
            - कूलर बंद करवाया
            - घड़ी चोरी की बात
            - अपना नाश्ता खुद लाए
          - title: छिपा संदेश
            points:
            - ठंडे कमरों से हिंदुस्तान नहीं चलेगा
            - राज में घड़ी तक सुरक्षित नहीं
            - सादगी और आत्मसम्मान
          alt: गांधीजी के तीन काम और उनके पीछे छिपे संदेश।
        check:
          prompt: गांधीजी की घड़ी कहाँ चोरी हुई?
          options:
          - रेलगाड़ी में
          - आश्रम में
          - वायसरॉय भवन में
          answer: रेलगाड़ी में
          why: आते समय रास्ते में रेलगाड़ी में।
        ways:
        - style: real_world
          teach: 'सोचो, कोई बड़ा अफ़सर तुम्हें शानदार नाश्ते पर बुलाए और तुम अपना टिफ़िन खोल लो। गांधीजी ने यही किया। पहले बोले: ''इस कूलर को प्लीज़ बंद कर दीजिए, मुझे सर्दी लग रही है।'' फिर बताया कि रेलगाड़ी में किसी ने उनकी पुरानी, प्यारी घड़ी चुरा ली। नाश्ते पर बोले: ''मैं तो अपना नाश्ता साथ लाया हूँ'' — खादी के थैले से बकरी के दूध के दही का डिब्बा और टूटे हत्थे वाला चम्मच निकला।'
      - teach: अगले दिन अख़बारों में बातचीत की नहीं, घड़ी चोरी की खबर बड़े अक्षरों में छपी। कुछ दिन बाद चोर ने साबरमती आश्रम जाकर घड़ी लौटा दी। यह घटना लेपियर और कौलिन की पुस्तक 'फ्रीडम एट मिडनाइट' में दर्ज है। गांधीजी बिना कड़वा बोले, छोटी-छोटी बातों से बड़ा संदेश दे देते थे।
        check:
          prompt: यह घटना किस पुस्तक में दर्ज है?
          options:
          - फ्रीडम एट मिडनाइट
          - गोदान
          - चाँद का मुँह टेढ़ा है
          answer: फ्रीडम एट मिडनाइट
          why: लेपियर और कौलिन की पुस्तक।
        ways:
        - style: step_by_step
          teach: 'बाद में क्या हुआ, क्रम से देखो। पहला: अगले दिन अख़बारों में बातचीत की नहीं, घड़ी चोरी की खबर बड़े अक्षरों में छपी। दूसरा: कुछ दिन बाद चोर ने साबरमती आश्रम जाकर घड़ी लौटा दी। तीसरा: यह घटना लेपियर और कौलिन की पुस्तक ''फ्रीडम एट मिडनाइट'' में दर्ज है। सीख: गांधीजी बिना कड़वा बोले, छोटी बातों से बड़ा संदेश दे देते थे।'
