  - code: hin9.u3.vyakaran
    title: "व्याकरण: सर्वनाम के रूप और मुहावरे"
    after: [hin9.u3.gandhi_ghadi]
    notes: |
      गांधीजी बोले, "मैं आ रहा था तो रास्ते में रेलगाड़ी में किसी ने मेरी घड़ी चुरा ली। वह बहुत पुरानी घड़ी
      थी और मुझे बहुत प्यारी थी।" यहाँ 'मैं' = गांधीजी; 'मेरी', 'मुझे' उसी सर्वनाम के परसर्ग युक्त रूप हैं
      (मैं + का = मेरा/मेरी; मैं + को = मुझे)। मुहावरे: मज़ा किरकिरा करना ("विराट के विकेट गिरने से सारा
      मज़ा किरकिरा हो गया"), ढोल पीटना ("संजू से कुछ मत कहिएगा, वह ढोल पीट देगा"), शान दिखाना।
    explanations:
      text: "सर्वनाम परसर्ग (का, को, से) के साथ रूप बदलते हैं: मैं → मेरा, मुझे; वे → उनका, उन्हें। मुहावरे का अर्थ शब्दों से अलग, एक विशेष अर्थ होता है।"
      visual: "तालिका: मैं → मेरी, मुझे | हम → हमारा, हमें | वह → उसका, उसे | वे → उनका, उन्हें | तुम → तुम्हारा, तुम्हें।"
      step_by_step: "1. मूल सर्वनाम पहचानें। 2. देखें कौन-सा परसर्ग जुड़ा है (का/को/से)। 3. 'का' से संबंध (मेरा), 'को' से कर्म या पाने वाला (मुझे)। 4. संज्ञा के लिंग से मेरा/मेरी/मेरे।"
      real_world: "दोस्त को चिट्ठी लिखते समय 'मैं', 'मेरा', 'मुझे' का सही प्रयोग करें: 'मुझे तुम्हारी याद आती है' — 'मैं को तुम्हारी याद' नहीं।"
