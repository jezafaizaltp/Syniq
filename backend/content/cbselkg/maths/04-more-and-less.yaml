# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 4
title: More and Less
tips:
  lk4_match: Match one from each group, pair by pair. Which group has some left over?
  lk4_count: Count each group. The bigger number has more.
  lk4_same: If every one has a partner and none is left over, they are the same.
concepts:
- code: lkgm.more
  title: More and Less
  notes: |
    Comparing two small groups: which has more, which has less, which are the same; matching one to one.
  explanations:
    text: Two plates of laddoos. Match them one to one. The plate with extra laddoos has more.
    visual: Draw a plate with 4 laddoos and a plate with 2, and lines matching them.
    step_by_step: 'Step 1: Match one from each group. Step 2: Keep matching. Step 3: The group with some left over has more.'
    real_world: When sharing biscuits, we check everyone has the same.
  picture:
    kind: bars
    bars:
    - label: plate A
      value: 4
    - label: plate B
      value: 2
    alt: Plate A has 4 laddoos and plate B has 2, so A has more.
    unit: laddoos
  activity:
    type: sort
    prompt: Which plate has more?
    bins:
    - Plate A
    - Plate B
    - Same
    items:
    - label: 'A: 🍪🍪🍪  B: 🍪'
      bin: Plate A
      clue: Match one cookie from each plate. Which one has cookies left over?
      why: Plate A has 2 extra. A has more.
    - label: 'A: 🍬  B: 🍬🍬🍬🍬'
      bin: Plate B
      clue: Match them one to one. Which plate still has sweets?
      why: Plate B has 3 extra. B has more.
    - label: 'A: 🍓🍓  B: 🍓🍓'
      bin: Same
      clue: Match them one to one. Is anything left over?
      why: Nothing is left over. They are the same.
    - label: 'A: 🍌🍌🍌🍌  B: 🍌🍌'
      bin: Plate A
      clue: Pair them up. Who has some left?
      why: Plate A has 2 extra bananas.
    - label: 'A: 🥕  B: 🥕🥕'
      bin: Plate B
      clue: Pair them up. Who has one left?
      why: Plate B has 1 extra carrot.
    - label: 'A: 🍇🍇🍇  B: 🍇🍇🍇'
      bin: Same
      clue: Pair them up. Does any grape stay alone?
      why: No grape is alone. They are the same.
  lesson:
    - teach: 'More means a bigger amount. 🍪🍪🍪🍪 has more than 🍪🍪. Match one cookie from each plate: the plate with cookies left over has more.'
      check:
        prompt: 'Which plate has more? A: 🍪🍪🍪 B: 🍪🍪🍪🍪🍪'
        options:
        - B
        - A
        - both the same
        answer: B
        why: After matching, B has 2 left over.
    - teach: Less (fewer) means a smaller amount. 🎈 has fewer than 🎈🎈🎈. The group that runs out first when matching has less.
      check:
        prompt: 'Which has fewer? A: 🐸🐸🐸🐸 B: 🐸'
        options:
        - B
        - A
        - both the same
        answer: B
        why: 'B runs out first: it has only 1.'
    - teach: 'Same means equal. 🍎🍎🍎 and 🍌🍌🍌: every apple has a banana partner, nothing is left over. They are the same.'
      check:
        prompt: 'A: 🌸🌸 B: 🌼🌼. Which has more?'
        options:
        - both the same
        - A
        - B
        answer: both the same
        why: Each flower has a partner; none left over.
  items:
  - prompt: 'Which has more? A: 🍪🍪🍪  B: 🍪'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 1
    hints:
    - Count each.
    - 3 and 1.
    solution: A has more.
    mistakes:
      B: lkg_look
  - prompt: 'Which has less? A: ⚽⚽  B: ⚽⚽⚽⚽'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 1
    hints:
    - Count each.
    - 2 and 4.
    solution: A has less.
    mistakes: {"B": "lkg_touch", "both the same": "lkg_touch"}
  - prompt: 'A: 🐣🐣  B: 🐣🐣. Which has more?'
    options:
    - both the same
    - A
    - B
    answer: both the same
    difficulty: 1
    hints:
    - Match them.
    - None left over.
    solution: They are the same.
    mistakes:
      A: lkg_touch
  - prompt: 'Which basket has more mangoes? A: 🥭🥭🥭🥭🥭  B: 🥭🥭🥭'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 2
    hints:
    - 5 and 3.
    - Match one to one.
    solution: A has more.
    mistakes: {"B": "lkg_touch", "both the same": "lkg_touch"}
  - prompt: 'Which jar has fewer sweets? A: 🍬🍬🍬🍬  B: 🍬🍬🍬🍬🍬🍬'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 2
    hints:
    - 4 and 6.
    - Fewer means less.
    solution: A has fewer.
    mistakes: {"B": "lkg_touch", "both the same": "lkg_touch"}
  - prompt: Which is the opposite of 'more'?
    options:
    - less
    - big
    - tall
    answer: less
    difficulty: 2
    hints:
    - Not more.
    - Fewer.
    solution: Less is the opposite of more.
    mistakes: {"big": "kg_opposite", "tall": "kg_opposite"}
  - prompt: 'Which box has more? A: 🧸🧸🧸🧸 B: 🧸🧸'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 1
    hints:
    - Match one from each box.
    - Which box has some left?
    solution: 'Step 1: A has 4, B has 2. Step 2: A has more.'
    mistakes:
      B: lk4_match
      both the same: lk4_same
  - prompt: 'Which tree has fewer birds? A: 🐦🐦🐦 B: 🐦🐦🐦🐦🐦'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 2
    hints:
    - Fewer means less.
    - Which runs out first when you match?
    solution: 'Step 1: A has 3, B has 5. Step 2: A has fewer.'
    mistakes:
      B: lk4_count
      both the same: lk4_same
  - prompt: 'A: 🐟🐟🐟 B: 🐟🐟🐟. Which bowl has more fish?'
    options:
    - both the same
    - A
    - B
    answer: both the same
    difficulty: 2
    hints:
    - Count each bowl.
    - Is anything left over after matching?
    solution: 'Step 1: 3 and 3. Step 2: the same.'
    mistakes:
      A: lk4_same
      B: lk4_same
  - prompt: Ravi has 🍬🍬. Asha has 🍬🍬🍬🍬. Who has more sweets?
    options:
    - Asha
    - Ravi
    - both the same
    answer: Asha
    difficulty: 1
    hints:
    - Count each child's sweets.
    - Which number is bigger?
    solution: 'Step 1: Ravi 2, Asha 4. Step 2: Asha has more.'
    mistakes:
      Ravi: lk4_count
      both the same: lk4_same
  - prompt: 'Which is more: 5 or 3?'
    options:
    - '5'
    - '3'
    - both the same
    answer: '5'
    difficulty: 2
    hints:
    - 'Count up: 1, 2, 3, 4, 5.'
    - Which do you reach later?
    solution: 'Step 1: 5 comes after 3. Step 2: 5 is more.'
    mistakes:
      '3': lk4_count
      both the same: lk4_same
  - prompt: There are 3 children and 2 chairs. Are there enough chairs?
    options:
    - no, one more chair is needed
    - yes, enough
    - there are too many chairs
    answer: no, one more chair is needed
    difficulty: 3
    hints:
    - Give each child a chair.
    - Is any child left standing?
    solution: 'Step 1: match child to chair. Step 2: one child has no chair.'
    mistakes:
      yes, enough: lk4_match
      there are too many chairs: lk4_match
  - prompt: 'Which is less: 2 or 4?'
    options:
    - '2'
    - '4'
    - both the same
    answer: '2'
    difficulty: 2
    hints:
    - 'Count up: 1, 2, 3, 4.'
    - Which do you reach first?
    solution: 'Step 1: 2 comes before 4. Step 2: 2 is less.'
    mistakes:
      '4': lk4_count
      both the same: lk4_same
  - prompt: 'A: 🥕🥕🥕🥕🥕 B: 🥕🥕🥕🥕. How many more carrots does A have?'
    answer: '1'
    check: 5-4
    difficulty: 3
    hints:
    - Match carrot to carrot.
    - Count the ones left over.
    solution: 'Step 1: 4 pairs. Step 2: 1 left over in A.'
    mistakes:
      '5': lk4_match
      '4': lk4_match
  - prompt: 'Which has more legs: 🐔 or 🐕?'
    options:
    - 🐕
    - 🐔
    - both the same
    answer: 🐕
    difficulty: 3
    hints:
    - Count the hen's legs, then the dog's.
    - Which number is bigger?
    solution: 'Step 1: hen 2, dog 4. Step 2: the dog has more.'
    mistakes:
      🐔: lk4_count
      both the same: lk4_same
