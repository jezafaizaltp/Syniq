# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 4
title: More and Less
concepts:
- code: lkgm.more
  title: More and Less
  notes: |
    Comparing two small groups: which has more, which has less, which are the same; matching one to one.
  explanations:
    text: Two plates of laddoos. Match them one to one. The plate with extra laddoos has more.
    visual: Draw a plate with 4 laddoos and a plate with 2, and lines matching them.
    step_by_step: 'Step 1: Match one from each group. Step 2: Keep matching. Step 3: The group with some left over has more.'
    real_world: When sharing biscuits, we check everyone has the same.
  picture:
    kind: bars
    bars:
    - label: plate A
      value: 4
    - label: plate B
      value: 2
    alt: Plate A has 4 laddoos and plate B has 2, so A has more.
    unit: laddoos
  activity:
    type: sort
    prompt: Which plate has more?
    bins:
    - Plate A
    - Plate B
    - Same
    items:
    - label: 'A: 🍪🍪🍪  B: 🍪'
      bin: Plate A
      clue: Match one cookie from each plate. Which one has cookies left over?
      why: Plate A has 2 extra. A has more.
    - label: 'A: 🍬  B: 🍬🍬🍬🍬'
      bin: Plate B
      clue: Match them one to one. Which plate still has sweets?
      why: Plate B has 3 extra. B has more.
    - label: 'A: 🍓🍓  B: 🍓🍓'
      bin: Same
      clue: Match them one to one. Is anything left over?
      why: Nothing is left over. They are the same.
    - label: 'A: 🍌🍌🍌🍌  B: 🍌🍌'
      bin: Plate A
      clue: Pair them up. Who has some left?
      why: Plate A has 2 extra bananas.
    - label: 'A: 🥕  B: 🥕🥕'
      bin: Plate B
      clue: Pair them up. Who has one left?
      why: Plate B has 1 extra carrot.
    - label: 'A: 🍇🍇🍇  B: 🍇🍇🍇'
      bin: Same
      clue: Pair them up. Does any grape stay alone?
      why: No grape is alone. They are the same.
  items:
  - prompt: 'Which has more? A: 🍪🍪🍪  B: 🍪'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 1
    hints:
    - Count each.
    - 3 and 1.
    solution: A has more.
    mistakes:
      B: lkg_look
  - prompt: 'Which has less? A: ⚽⚽  B: ⚽⚽⚽⚽'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 1
    hints:
    - Count each.
    - 2 and 4.
    solution: A has less.
    mistakes: {"B": "lkg_touch", "both the same": "lkg_touch"}
  - prompt: 'A: 🐣🐣  B: 🐣🐣. Which has more?'
    options:
    - both the same
    - A
    - B
    answer: both the same
    difficulty: 1
    hints:
    - Match them.
    - None left over.
    solution: They are the same.
    mistakes:
      A: lkg_touch
  - prompt: 'Which basket has more mangoes? A: 🥭🥭🥭🥭🥭  B: 🥭🥭🥭'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 2
    hints:
    - 5 and 3.
    - Match one to one.
    solution: A has more.
    mistakes: {"B": "lkg_touch", "both the same": "lkg_touch"}
  - prompt: 'Which jar has fewer sweets? A: 🍬🍬🍬🍬  B: 🍬🍬🍬🍬🍬🍬'
    options:
    - A
    - B
    - both the same
    answer: A
    difficulty: 2
    hints:
    - 4 and 6.
    - Fewer means less.
    solution: A has fewer.
    mistakes: {"B": "lkg_touch", "both the same": "lkg_touch"}
  - prompt: Which is the opposite of 'more'?
    options:
    - less
    - big
    - tall
    answer: less
    difficulty: 2
    hints:
    - Not more.
    - Fewer.
    solution: Less is the opposite of more.
    mistakes: {"big": "kg_opposite", "tall": "kg_opposite"}
