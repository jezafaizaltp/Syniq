# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 8
title: Up, Down, In, Out
tips:
  kg_below: "Below means lower down. Put your hand below the table. Which word fits?"
  kg_fish_water: "A fish swims with water all around it. Is it on the water, or inside?"
  kg_on_top: "Put a cup on top of a table. The cup touches the top. Which word fits?"
  kg_sky: "Point to the sky. Is your finger going up or down?"

concepts:
- code: lkgm.where
  title: Up, Down, In, Out
  notes: |
    Position words: up/down, in/out, on/under, near/far, using toys and animals.
  explanations:
    text: Where is the cat? On the chair, under the table, in the box. These words tell us where things are.
    visual: Draw a cat under a table and a ball on the table.
    step_by_step: 'Step 1: Find the thing. Step 2: Look at what is near it. Step 3: Say on, under, in or out.'
    real_world: Put your toys in the box after playing.
  picture:
    kind: compare
    columns:
    - title: Word
      points:
      - 'on'
      - under
      - in
    - title: Example
      points:
      - ball on table
      - cat under table
      - toy in box
    alt: 'On: a ball on the table. Under: a cat under the table. In: a toy in the box.'
  activity:
    type: sort
    prompt: Where is the cat?
    bins:
    - 'On'
    - Under
    - In
    items:
    - label: 🐱 sits on top of the table
      bin: 'On'
      clue: Is the table below the cat or above it?
      why: The table is below the cat. The cat is on it.
    - label: 🐱 hides below the bed
      bin: Under
      clue: Is the bed above the cat?
      why: The bed is above. The cat is under it.
    - label: 🐱 sits inside the box
      bin: In
      clue: Is the cat inside or outside?
      why: Inside means in the box.
    - label: 🐱 sleeps on top of the chair
      bin: 'On'
      clue: Is the chair below?
      why: The chair is below. The cat is on it.
    - label: 🐱 hides below the umbrella
      bin: Under
      clue: What is above the cat?
      why: The umbrella is above. The cat is under it.
    - label: 🐱 is inside the basket
      bin: In
      clue: Is the cat inside or outside?
      why: 'Inside: the cat is in the basket.'
  items:
  - prompt: The bird flies high ___ in the sky.
    options:
    - up
    - down
    - under
    answer: up
    difficulty: 1
    hints:
    - Look up.
    - High.
    solution: The bird is up in the sky.
    mistakes: {"down": "kg_sky", "under": "kg_sky"}
  - prompt: The fish is ___ the water.
    options:
    - in
    - 'on'
    - out of
    answer: in
    difficulty: 1
    hints:
    - It swims.
    - Inside.
    solution: The fish is in the water.
    mistakes: {"on": "kg_fish_water", "out of": "kg_fish_water"}
  - prompt: The cat sleeps below the table. It is ___ the table.
    options:
    - under
    - 'on'
    - up
    answer: under
    difficulty: 1
    hints:
    - Below.
    - Look down.
    solution: The cat is under the table.
    mistakes: {"on": "kg_below", "up": "kg_below"}
  - prompt: The cup is on top of the table. It is ___ the table.
    options:
    - 'on'
    - under
    - in
    answer: 'on'
    difficulty: 2
    hints:
    - On top.
    - Resting on it.
    solution: The cup is on the table.
    mistakes: {"under": "kg_on_top", "in": "kg_on_top"}
  - prompt: Which is the opposite of 'up'?
    options:
    - down
    - in
    - 'on'
    answer: down
    difficulty: 2
    hints:
    - Not up.
    - To the floor.
    solution: Down is the opposite of up.
    mistakes: {"in": "kg_opposite", "on": "kg_opposite"}
  - prompt: Which is the opposite of 'in'?
    options:
    - out
    - up
    - under
    answer: out
    difficulty: 2
    hints:
    - Not in.
    - Go outside.
    solution: Out is the opposite of in.
    mistakes: {"up": "kg_opposite", "under": "kg_opposite"}
