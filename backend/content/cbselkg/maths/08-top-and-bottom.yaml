# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 8
title: Up, Down, In, Out
tips:
  kg_below: "Below means lower down. Put your hand below the table. Which word fits?"
  kg_fish_water: "A fish swims with water all around it. Is it on the water, or inside?"
  kg_on_top: "Put a cup on top of a table. The cup touches the top. Which word fits?"
  kg_sky: "Point to the sky. Is your finger going up or down?"
  lk8_where: Put a toy where the sentence says. Where is it now?
  lk8_opp: Do the action with your body, then do the very other one.
  lk8_far: "Can you reach it with your hand, or is it a long way off? Picture where it is."

concepts:
- code: lkgm.where
  title: Up, Down, In, Out
  notes: |
    Position words: up/down, in/out, on/under, near/far, using toys and animals.
  explanations:
    text: Where is the cat? On the chair, under the table, in the box. These words tell us where things are.
    visual: Draw a cat under a table and a ball on the table.
    step_by_step: 'Step 1: Find the thing. Step 2: Look at what is near it. Step 3: Say on, under, in or out.'
    real_world: Put your toys in the box after playing.
  picture:
    kind: compare
    columns:
    - title: Word
      points:
      - 'on'
      - under
      - in
    - title: Example
      points:
      - ball on table
      - cat under table
      - toy in box
    alt: 'On: a ball on the table. Under: a cat under the table. In: a toy in the box.'
  activity:
    type: sort
    prompt: Where is the cat?
    bins:
    - 'On'
    - Under
    - In
    items:
    - label: 🐱 sits on top of the table
      bin: 'On'
      clue: Is the table below the cat or above it?
      why: The table is below the cat. The cat is on it.
    - label: 🐱 hides below the bed
      bin: Under
      clue: Is the bed above the cat?
      why: The bed is above. The cat is under it.
    - label: 🐱 sits inside the box
      bin: In
      clue: Is the cat inside or outside?
      why: Inside means in the box.
    - label: 🐱 sleeps on top of the chair
      bin: 'On'
      clue: Is the chair below?
      why: The chair is below. The cat is on it.
    - label: 🐱 hides below the umbrella
      bin: Under
      clue: What is above the cat?
      why: The umbrella is above. The cat is under it.
    - label: 🐱 is inside the basket
      bin: In
      clue: Is the cat inside or outside?
      why: 'Inside: the cat is in the basket.'
  lesson:
    - teach: 'Position words tell where things are. On: the cup is on the table. Under: the cat is under the table. In: the ball is in the box. Out: the ball is out of the box.'
      picture:
        kind: compare
        columns:
        - title: Word
          points:
          - 'on'
          - under
          - in
        - title: Example
          points:
          - cup on the table
          - cat under the table
          - ball in the box
        alt: Position words with examples.
      check:
        prompt: The shoes are below the bed. They are ___ the bed.
        options:
        - under
        - 'on'
        - in
        answer: under
        why: Below the bed means under it.
    - teach: 'Up and down: a kite goes up, a ball falls down. Top and bottom: the top of the slide is high, the bottom is low.'
      check:
        prompt: A kite flies ___ in the sky.
        options:
        - up
        - down
        - under
        answer: up
        why: The sky is high above us.
    - teach: Near means close to you. Far means a long way off. Your nose is near; the moon is far.
      check:
        prompt: The moon is ___ from us.
        options:
        - far
        - near
        - under
        answer: far
        why: The moon is a very long way away.
  items:
  - prompt: The bird flies high ___ in the sky.
    options:
    - up
    - down
    - under
    answer: up
    difficulty: 1
    hints:
    - Look up.
    - High.
    solution: The bird is up in the sky.
    mistakes: {"down": "kg_sky", "under": "kg_sky"}
  - prompt: The fish is ___ the water.
    options:
    - in
    - 'on'
    - out of
    answer: in
    difficulty: 1
    hints:
    - It swims.
    - Inside.
    solution: The fish is in the water.
    mistakes: {"on": "kg_fish_water", "out of": "kg_fish_water"}
  - prompt: The cat sleeps below the table. It is ___ the table.
    options:
    - under
    - 'on'
    - up
    answer: under
    difficulty: 1
    hints:
    - Below.
    - Look down.
    solution: The cat is under the table.
    mistakes: {"on": "kg_below", "up": "kg_below"}
  - prompt: The cup is on top of the table. It is ___ the table.
    options:
    - 'on'
    - under
    - in
    answer: 'on'
    difficulty: 2
    hints:
    - On top.
    - Resting on it.
    solution: The cup is on the table.
    mistakes: {"under": "kg_on_top", "in": "kg_on_top"}
  - prompt: Which is the opposite of 'up'?
    options:
    - down
    - in
    - 'on'
    answer: down
    difficulty: 2
    hints:
    - Not up.
    - To the floor.
    solution: Down is the opposite of up.
    mistakes: {"in": "kg_opposite", "on": "kg_opposite"}
  - prompt: Which is the opposite of 'in'?
    options:
    - out
    - up
    - under
    answer: out
    difficulty: 2
    hints:
    - Not in.
    - Go outside.
    solution: Out is the opposite of in.
    mistakes: {"up": "kg_opposite", "under": "kg_opposite"}
  - prompt: The book is lying on top of the desk. It is ___ the desk.
    options:
    - 'on'
    - under
    - out
    answer: 'on'
    difficulty: 1
    hints:
    - Put a book where the sentence says.
    - Resting on the top.
    solution: 'Step 1: on top. Step 2: on the desk.'
    mistakes:
      under: lk8_where
      out: lk8_where
  - prompt: The milk is inside the glass. It is ___ the glass.
    options:
    - in
    - 'on'
    - under
    answer: in
    difficulty: 1
    hints:
    - Inside means ...
    - Not outside.
    solution: 'Step 1: inside. Step 2: in the glass.'
    mistakes:
      'on': lk8_where
      under: lk8_where
  - prompt: What is the opposite of near?
    options:
    - far
    - up
    - 'on'
    answer: far
    difficulty: 2
    hints:
    - Near is close.
    - A long way away.
    solution: 'Step 1: near is close. Step 2: far is a long way.'
    mistakes:
      up: lk8_opp
      'on': lk8_opp
  - prompt: A child slides from the top. Where does the child land?
    options:
    - at the bottom
    - at the top
    - in the sky
    answer: at the bottom
    difficulty: 2
    hints:
    - Slides go down.
    - The low end.
    solution: 'Step 1: start at the top, slide down. Step 2: land at the bottom.'
    mistakes:
      at the top: lk8_opp
      in the sky: lk8_where
  - prompt: Your hand touches your nose. Your nose is ___.
    options:
    - near
    - far
    - under the bed
    answer: near
    difficulty: 1
    hints:
    - Can you reach it easily?
    - Very close.
    solution: 'Step 1: you can touch it. Step 2: near.'
    mistakes:
      far: lk8_far
      under the bed: lk8_where
  - prompt: The dog runs from inside the house to the garden. The dog went ___.
    options:
    - out
    - in
    - under
    answer: out
    difficulty: 2
    hints:
    - The garden is outside.
    - Leaving the house.
    solution: 'Step 1: from inside to outside. Step 2: out.'
    mistakes:
      in: lk8_opp
      under: lk8_where
  - prompt: Which one is at the top of a tree?
    options:
    - 🐦 a bird in the nest
    - 🌱 the roots
    - 🐜 ants on the ground
    answer: 🐦 a bird in the nest
    difficulty: 3
    hints:
    - Top means the highest part.
    - Look up the tree.
    solution: 'Step 1: roots and ground are at the bottom. Step 2: the nest is at the top.'
    mistakes:
      🌱 the roots: lk8_where
      🐜 ants on the ground: lk8_where
  - prompt: What is the opposite of on?
    options:
    - 'off'
    - up
    - near
    answer: 'off'
    difficulty: 3
    hints:
    - Switch a light ... and then ...
    - Take the lid ...
    solution: 'Step 1: lid on the box. Step 2: lid off the box.'
    mistakes:
      up: lk8_opp
      near: lk8_far
  - prompt: Rain falls ___ from the clouds.
    options:
    - down
    - up
    - in
    answer: down
    difficulty: 1
    hints:
    - Clouds are high up.
    - Drops drop to the ground.
    solution: 'Step 1: from high to low. Step 2: down.'
    mistakes:
      up: lk8_opp
      in: lk8_where
