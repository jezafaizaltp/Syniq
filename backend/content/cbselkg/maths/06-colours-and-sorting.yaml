# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 6
title: Colours and Sorting
tips:
  kg_colour_look: "Look at the colour of each picture. Name the colour aloud, one by one."
  kg_odd_one: "Ask: can we eat it? Find the one we cannot eat."
  kg_pair: "Socks come in pairs, one for each foot. What do we wear with a sock?"

concepts:
- code: lkgm.sort
  title: Colours and Sorting
  notes: |
    Sorting things by colour, size and kind; finding the odd one out.
  explanations:
    text: 'Sorting means putting things that go together in one group: all red ones here, all blue ones there.'
    visual: 'Draw two boxes: red balls in one, blue balls in the other.'
    step_by_step: 'Step 1: Look at each thing. Step 2: Ask: what colour, or what kind? Step 3: Put it in its group.'
    real_world: 'We sort clothes: socks with socks, shirts with shirts.'
  picture:
    kind: compare
    columns:
    - title: Red
      points:
      - 🍎 apple
      - 🍓 strawberry
    - title: Yellow
      points:
      - 🍌 banana
      - 🌻 sunflower
    alt: 'Red things: apple, strawberry. Yellow things: banana, sunflower.'
  activity:
    type: sort
    prompt: Sort by colour.
    bins:
    - Red
    - Yellow
    - Green
    items:
    - label: 🍎 Apple
      bin: Red
      clue: The colour of a fire engine.
      why: An apple is red.
    - label: 🍌 Banana
      bin: Yellow
      clue: The colour of the sun.
      why: A banana is yellow.
    - label: 🍃 Leaf
      bin: Green
      clue: The colour of grass.
      why: A leaf is green.
    - label: 🍅 Tomato
      bin: Red
      clue: The colour of a ripe one, ready to eat.
      why: A ripe tomato is red.
    - label: 🌻 Sunflower petals
      bin: Yellow
      clue: Like a banana.
      why: Sunflower petals are yellow.
    - label: 🥒 Cucumber
      bin: Green
      clue: Like a leaf.
      why: A cucumber is green.
  items:
  - prompt: Which is red?
    options:
    - 🍎 apple
    - 🍌 banana
    - 🥦 broccoli
    answer: 🍎 apple
    difficulty: 1
    hints:
    - Look at the colours.
    - Like a fire engine.
    solution: The apple is red.
    mistakes: {"🍌 banana": "kg_colour_look", "🥦 broccoli": "kg_colour_look"}
  - prompt: Which is yellow?
    options:
    - 🍌 banana
    - 🍇 grapes
    - 🍆 brinjal
    answer: 🍌 banana
    difficulty: 1
    hints:
    - Like the sun.
    - Peel it.
    solution: The banana is yellow.
    mistakes: {"🍇 grapes": "kg_colour_look", "🍆 brinjal": "kg_colour_look"}
  - prompt: Which one is different? 🐶 🐱 🚗
    options:
    - 🚗 car
    - 🐶 dog
    - 🐱 cat
    answer: 🚗 car
    difficulty: 1
    hints:
    - Two are animals.
    - One has wheels.
    solution: The car is not an animal.
    mistakes:
      🐶 dog: lkg_look
  - prompt: Which goes with 🧦 sock?
    options:
    - 🧦 another sock
    - 🍎 apple
    - 🚌 bus
    answer: 🧦 another sock
    difficulty: 2
    hints:
    - They make a pair.
    - Same kind.
    solution: Socks go together.
    mistakes: {"🍎 apple": "kg_pair", "🚌 bus": "kg_pair"}
  - prompt: Which one is different? 🍎 🍌 🍇 ⚽
    options:
    - ⚽ ball
    - 🍎 apple
    - 🍇 grapes
    answer: ⚽ ball
    difficulty: 2
    hints:
    - Three are fruits.
    - One is a toy.
    solution: The ball is not a fruit.
    mistakes: {"🍎 apple": "kg_odd_one", "🍇 grapes": "kg_odd_one"}
  - prompt: Which is green?
    options:
    - 🥦 broccoli
    - 🍊 orange
    - 🍓 strawberry
    answer: 🥦 broccoli
    difficulty: 2
    hints:
    - Like leaves.
    - A vegetable.
    solution: Broccoli is green.
    mistakes: {"🍊 orange": "kg_colour_look", "🍓 strawberry": "kg_colour_look"}
