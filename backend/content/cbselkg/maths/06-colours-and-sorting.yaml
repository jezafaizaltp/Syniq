# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 6
title: Colours and Sorting
tips:
  kg_colour_look: "Look at the colour of each picture. Name the colour aloud, one by one."
  kg_odd_one: "Ask: can we eat it? Find the one we cannot eat."
  kg_pair: "Socks come in pairs, one for each foot. What do we wear with a sock?"
  lk6_colour: Picture the real thing. What colour is it usually?
  lk6_kind: 'Ask: is it an animal, a food, a toy or something to wear? Find the one that is not like the others.'
  lk6_group: Put things that are the same kind together. Which group does it fit?

concepts:
- code: lkgm.sort
  title: Colours and Sorting
  notes: |
    Sorting things by colour, size and kind; finding the odd one out.
  explanations:
    text: 'Sorting means putting things that go together in one group: all red ones here, all blue ones there.'
    visual: 'Draw two boxes: red balls in one, blue balls in the other.'
    step_by_step: 'Step 1: Look at each thing. Step 2: Ask: what colour, or what kind? Step 3: Put it in its group.'
    real_world: 'We sort clothes: socks with socks, shirts with shirts.'
  picture:
    kind: compare
    columns:
    - title: Red
      points:
      - 🍎 apple
      - 🍓 strawberry
    - title: Yellow
      points:
      - 🍌 banana
      - 🌻 sunflower
    alt: 'Red things: apple, strawberry. Yellow things: banana, sunflower.'
  activity:
    type: sort
    prompt: Sort by colour.
    bins:
    - Red
    - Yellow
    - Green
    items:
    - label: 🍎 Apple
      bin: Red
      clue: The colour of a fire engine.
      why: An apple is red.
    - label: 🍌 Banana
      bin: Yellow
      clue: The colour of the sun.
      why: A banana is yellow.
    - label: 🍃 Leaf
      bin: Green
      clue: The colour of grass.
      why: A leaf is green.
    - label: 🍅 Tomato
      bin: Red
      clue: The colour of a ripe one, ready to eat.
      why: A ripe tomato is red.
    - label: 🌻 Sunflower petals
      bin: Yellow
      clue: Like a banana.
      why: Sunflower petals are yellow.
    - label: 🥒 Cucumber
      bin: Green
      clue: Like a leaf.
      why: A cucumber is green.
  lesson:
    - teach: 'Things have colours: a tomato is red 🍅, a banana is yellow 🍌, grass is green 🌿, the sky is blue, a crow is black.'
      picture:
        kind: compare
        columns:
        - title: Colour
          points:
          - red
          - yellow
          - green
        - title: Thing
          points:
          - tomato
          - banana
          - grass
        alt: Colours and things of that colour.
      check:
        prompt: What colour is grass?
        options:
        - green
        - red
        - black
        answer: green
        why: Grass and leaves are green.
    - teach: 'Sorting means putting things that go together in one group: all fruits together, all toys together, all red things together.'
      check:
        prompt: Which one goes in the fruit basket?
        options:
        - 🍊 orange
        - 🚗 car
        - 👟 shoe
        answer: 🍊 orange
        why: An orange is a fruit.
    - teach: 'Odd one out: in 🐶 🐱 🐮 🍎, three are animals and one is a fruit. The apple is the odd one out.'
      check:
        prompt: Which one is different? 🚗 🚌 🚲 🍌
        options:
        - 🍌
        - 🚗
        - 🚲
        answer: 🍌
        why: Three are vehicles; the banana is food.
  items:
  - prompt: Which is red?
    options:
    - 🍎 apple
    - 🍌 banana
    - 🥦 broccoli
    answer: 🍎 apple
    difficulty: 1
    hints:
    - Look at the colours.
    - Like a fire engine.
    solution: The apple is red.
    mistakes: {"🍌 banana": "kg_colour_look", "🥦 broccoli": "kg_colour_look"}
  - prompt: Which is yellow?
    options:
    - 🍌 banana
    - 🍇 grapes
    - 🍆 brinjal
    answer: 🍌 banana
    difficulty: 1
    hints:
    - Like the sun.
    - Peel it.
    solution: The banana is yellow.
    mistakes: {"🍇 grapes": "kg_colour_look", "🍆 brinjal": "kg_colour_look"}
  - prompt: Which one is different? 🐶 🐱 🚗
    options:
    - 🚗 car
    - 🐶 dog
    - 🐱 cat
    answer: 🚗 car
    difficulty: 1
    hints:
    - Two are animals.
    - One has wheels.
    solution: The car is not an animal.
    mistakes:
      🐶 dog: lkg_look
  - prompt: Which goes with 🧦 sock?
    options:
    - 🧦 another sock
    - 🍎 apple
    - 🚌 bus
    answer: 🧦 another sock
    difficulty: 2
    hints:
    - They make a pair.
    - Same kind.
    solution: Socks go together.
    mistakes: {"🍎 apple": "kg_pair", "🚌 bus": "kg_pair"}
  - prompt: Which one is different? 🍎 🍌 🍇 ⚽
    options:
    - ⚽ ball
    - 🍎 apple
    - 🍇 grapes
    answer: ⚽ ball
    difficulty: 2
    hints:
    - Three are fruits.
    - One is a toy.
    solution: The ball is not a fruit.
    mistakes: {"🍎 apple": "kg_odd_one", "🍇 grapes": "kg_odd_one"}
  - prompt: Which is green?
    options:
    - 🥦 broccoli
    - 🍊 orange
    - 🍓 strawberry
    answer: 🥦 broccoli
    difficulty: 2
    hints:
    - Like leaves.
    - A vegetable.
    solution: Broccoli is green.
    mistakes: {"🍊 orange": "kg_colour_look", "🍓 strawberry": "kg_colour_look"}
  - prompt: What colour is the sky on a sunny day?
    options:
    - blue
    - green
    - black
    answer: blue
    difficulty: 1
    hints:
    - Look up on a sunny day.
    - Same as the sea.
    solution: 'Step 1: sunny sky. Step 2: blue.'
    mistakes:
      green: lk6_colour
      black: lk6_colour
  - prompt: Which one is orange in colour?
    options:
    - 🥕 carrot
    - 🍆 brinjal
    - 🥦 broccoli
    answer: 🥕 carrot
    difficulty: 1
    hints:
    - Picture each vegetable.
    - Rabbits love it.
    solution: 'Step 1: brinjal is purple, broccoli green. Step 2: carrot is orange.'
    mistakes:
      🍆 brinjal: lk6_colour
      🥦 broccoli: lk6_colour
  - prompt: Which one is different? 👕 👖 🧦 🐘
    options:
    - 🐘
    - 👕
    - 🧦
    answer: 🐘
    difficulty: 2
    hints:
    - Three are things we wear.
    - Which one is not?
    solution: 'Step 1: shirt, pants, socks are clothes. Step 2: the elephant is different.'
    mistakes:
      👕: lk6_kind
      🧦: lk6_kind
  - prompt: Which goes with the toys? 🧸 🪀 ?
    options:
    - ⚽ ball
    - 🥛 milk
    - 🍞 bread
    answer: ⚽ ball
    difficulty: 2
    hints:
    - What do you play with?
    - Milk and bread are food.
    solution: 'Step 1: toys are for play. Step 2: the ball.'
    mistakes:
      🥛 milk: lk6_group
      🍞 bread: lk6_group
  - prompt: What colour is a crow?
    options:
    - black
    - white
    - pink
    answer: black
    difficulty: 1
    hints:
    - Picture a crow on a wall.
    - Dark like the night.
    solution: 'Step 1: crows are dark. Step 2: black.'
    mistakes:
      white: lk6_colour
      pink: lk6_colour
  - prompt: Which one is different? 🍎 🍓 🍒 🍌
    options:
    - 🍌
    - 🍎
    - 🍒
    answer: 🍌
    difficulty: 3
    hints:
    - All are fruits. Look at the colours.
    - Three are red.
    solution: 'Step 1: apple, strawberry, cherry are red. Step 2: the banana is yellow.'
    mistakes:
      🍎: lk6_colour
      🍒: lk6_colour
  - prompt: Which goes with the animals? 🐄 🐐 ?
    options:
    - 🐑 sheep
    - 🪑 chair
    - 🍉 watermelon
    answer: 🐑 sheep
    difficulty: 1
    hints:
    - Which one is alive and eats grass?
    - Farm animals.
    solution: 'Step 1: cow and goat are animals. Step 2: the sheep.'
    mistakes:
      🪑 chair: lk6_group
      🍉 watermelon: lk6_group
  - prompt: Big balls in one box, small balls in another. Where does 🏀 go?
    options:
    - the big box
    - the small box
    - the fruit box
    answer: the big box
    difficulty: 3
    hints:
    - Is a basketball big or small?
    - Sort by size.
    solution: 'Step 1: a basketball is big. Step 2: the big box.'
    mistakes:
      the small box: lk6_group
      the fruit box: lk6_group
  - prompt: Mix red and white paint. What colour do you get?
    options:
    - pink
    - blue
    - green
    answer: pink
    difficulty: 3
    hints:
    - Red gets lighter.
    - The colour of a lotus.
    solution: 'Step 1: white makes red lighter. Step 2: pink.'
    mistakes:
      blue: lk6_colour
      green: lk6_colour
