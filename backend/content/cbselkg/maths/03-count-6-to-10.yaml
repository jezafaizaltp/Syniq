# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 3
title: Count 6 to 10
concepts:
- code: lkgm.count10
  title: Count 6 to 10
  notes: |
    Counting objects from 6 to 10; two hands make 10; counting on.
  explanations:
    text: After 5 come 6, 7, 8, 9, 10. Two hands have 10 fingers!
    visual: Draw two hands with 10 fingers, and number the fingers 1 to 10.
    step_by_step: 'Step 1: Count to 5 on one hand. Step 2: Keep counting on the other hand: 6, 7, 8, 9, 10.'
    real_world: Count the steps on a staircase as you climb.
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 5
      label: one hand
    - at: 10
      label: two hands
    alt: 'Counting fingers: one hand is 5, two hands make 10.'
    jumps:
    - from: 0
      to: 5
      label: '5'
    - from: 5
      to: 10
      label: '+5'
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: Count them. Move to how many.
    goals:
    - prompt: 🎈🎈🎈🎈🎈🎈
      target: 6
      mistakes:
      - when:
          v: 5
        say: After 5 comes 6. Count the last balloon too.
      - when:
          v: 7
        say: One balloon was counted two times. Touch each once.
    - prompt: 🖐️🖐️ All your fingers on two hands
      target: 10
      mistakes:
      - when:
          v: 5
        say: 'That''s one hand. Count the other hand too: 6, 7, 8, 9, 10.'
    - prompt: 🐞🐞🐞🐞🐞🐞🐞🐞
      target: 8
      mistakes:
      - when:
          v: 7
        say: 'One ladybird was missed. Count slowly: 6, 7, 8.'
      - when:
          v: 9
        say: One ladybird was counted two times.
  items:
  - prompt: How many? 🌸🌸🌸🌸🌸🌸
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Touch each flower.
    - Count past 5.
    solution: There are 6 flowers.
    mistakes:
      '5': lkg_touch
      '7': lkg_touch
  - prompt: How many fingers on two hands?
    answer: '10'
    check: '10'
    difficulty: 1
    hints:
    - 5 and 5.
    - Count them all.
    solution: Two hands have 10 fingers.
    mistakes:
      '5': lkg_touch
      '9': lkg_touch
  - prompt: What comes after 7?
    answer: '8'
    check: 7 + 1
    difficulty: 1
    hints:
    - 'Count: 6, 7, ...'
    - One more.
    solution: After 7 comes 8.
    mistakes:
      '6': lkg_touch
  - prompt: How many? 🍌🍌🍌🍌🍌🍌🍌🍌🍌
    answer: '9'
    check: '9'
    difficulty: 2
    hints:
    - Count slowly.
    - Touch each one.
    solution: There are 9 bananas.
    mistakes:
      '8': lkg_touch
      '10': lkg_touch
  - prompt: What comes after 9?
    answer: '10'
    check: 9 + 1
    difficulty: 2
    hints:
    - Count on one.
    - 8, 9, ...
    solution: After 9 comes 10.
    mistakes:
      '8': lkg_touch
  - prompt: How many? 🐞🐞🐞🐞🐞🐞🐞
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - Count each ladybird.
    - Past 5.
    solution: There are 7 ladybirds.
    mistakes:
      '6': lkg_touch
      '8': lkg_touch
