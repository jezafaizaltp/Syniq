# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 3
title: Count 6 to 10
tips:
  lk3_touch: Touch each one once and say one number for each touch.
  lk3_five: 'Count the first five, then keep going: 6, 7, 8 ...'
  lk3_next: Say the numbers out loud. Which one do you say next?
concepts:
- code: lkgm.count10
  title: Count 6 to 10
  notes: |
    Counting objects from 6 to 10; two hands make 10; counting on.
  explanations:
    text: After 5 come 6, 7, 8, 9, 10. Two hands have 10 fingers!
    visual: Draw two hands with 10 fingers, and number the fingers 1 to 10.
    step_by_step: 'Step 1: Count to 5 on one hand. Step 2: Keep counting on the other hand: 6, 7, 8, 9, 10.'
    real_world: Count the steps on a staircase as you climb.
  picture:
    kind: number_line
    from: 0
    to: 10
    step: 1
    points:
    - at: 5
      label: one hand
    - at: 10
      label: two hands
    alt: 'Counting fingers: one hand is 5, two hands make 10.'
    jumps:
    - from: 0
      to: 5
      label: '5'
    - from: 5
      to: 10
      label: '+5'
  activity:
    type: number_line
    min: 0
    max: 10
    step: 1
    start: 0
    prompt: Count them. Move to how many.
    goals:
    - prompt: 🎈🎈🎈🎈🎈🎈
      target: 6
      mistakes:
      - when:
          v: 5
        say: After 5 comes 6. Count the last balloon too.
      - when:
          v: 7
        say: One balloon was counted two times. Touch each once.
    - prompt: 🖐️🖐️ All your fingers on two hands
      target: 10
      mistakes:
      - when:
          v: 5
        say: 'That''s one hand. Count the other hand too: 6, 7, 8, 9, 10.'
    - prompt: 🐞🐞🐞🐞🐞🐞🐞🐞
      target: 8
      mistakes:
      - when:
          v: 7
        say: 'One ladybird was missed. Count slowly: 6, 7, 8.'
      - when:
          v: 9
        say: One ladybird was counted two times.
  lesson:
    - teach: 'After 5 we keep counting: 6, 7, 8, 9, 10. One hand is 5. Add fingers from the other hand: 6, 7, 8, 9, 10.'
      picture:
        kind: number_line
        from: 0
        to: 10
        points:
        - at: 5
          label: '5'
        - at: 6
          label: '6'
        - at: 10
          label: '10'
        alt: Numbers up to 10, with 5, 6 and 10 marked.
      check:
        prompt: One full hand and 1 more finger. How many fingers?
        options:
        - '6'
        - '5'
        - '7'
        answer: '6'
        why: Five, then one more is 6.
      ways:
      - style: visual
        teach: Start at 5, one full hand, and hop along the number line to keep counting.
        picture:
          kind: number_line
          from: 0
          to: 10
          step: 1
          jumps:
          - from: 5
            to: 6
            label: '+1'
          - from: 6
            to: 7
            label: '+1'
          alt: A number line from 0 to 10. Starting at 5, a hop of one goes to 6, then another hop goes to 7.
      - style: step_by_step
        teach: 'Count past one hand. First: hold up one full hand and say five. Second: lift one finger on the other hand and say six. Third: lift another and say seven. Fourth: keep going, one finger and one number each time.'
    - teach: 'Count big groups carefully: touch each one once. For 🍬🍬🍬🍬🍬🍬🍬🍬 say 1, 2, 3, 4, 5, 6, 7, 8. There are 8 sweets.'
      check:
        prompt: 'Count: 🐠🐠🐠🐠🐠🐠🐠. How many fish?'
        options:
        - '7'
        - '6'
        - '8'
        answer: '7'
        why: '1, 2, 3, 4, 5, 6, 7: the last number is 7.'
      ways:
      - style: step_by_step
        teach: 'Count a big group without getting mixed up. First: put the things in a line. Second: touch the first one and say one. Third: slide each one to the side after you count it. Fourth: when none are left, the last number tells how many.'
      - style: visual
        teach: Counting a big group, one at a time. Each one gets the next number.
        picture:
          kind: flow
          steps:
          - 🍋 1
          - 🍋 2
          - 🍋 3
          - 🍋 4
          - 🍋 5
          - 🍋 6
          - 🍋 7
          alt: Seven lemons in a line, counted 1, 2, 3, 4, 5, 6, 7. The last number is 7.
    - teach: Two hands make 10 fingers. 10 is the biggest number we have learnt so far.
      check:
        prompt: Which number is bigger, 9 or 10?
        options:
        - '10'
        - '9'
        - both the same
        answer: '10'
        why: 10 comes after 9, so it is more.
      ways:
      - style: visual
        teach: Two hands make ten. Each hand has the same number of fingers.
        picture:
          kind: compare
          columns:
          - title: Left hand
            points:
            - 5 fingers
          - title: Right hand
            points:
            - 5 fingers
          alt: The left hand has 5 fingers and the right hand has 5 fingers. Together they make ten.
      - style: real_world
        teach: In a game of hide and seek, the seeker often covers their eyes and counts out loud up to ten.
  items:
  - prompt: How many? 🌸🌸🌸🌸🌸🌸
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Touch each flower.
    - Count past 5.
    solution: There are 6 flowers.
    mistakes:
      '5': lkg_touch
      '7': lkg_touch
  - prompt: How many fingers on two hands?
    answer: '10'
    check: '10'
    difficulty: 1
    hints:
    - 5 and 5.
    - Count them all.
    solution: Two hands have 10 fingers.
    mistakes:
      '5': lkg_touch
      '9': lkg_touch
  - prompt: What comes after 7?
    answer: '8'
    check: 7 + 1
    difficulty: 1
    hints:
    - 'Count: 6, 7, ...'
    - One more.
    solution: After 7 comes 8.
    mistakes:
      '6': lkg_touch
  - prompt: How many? 🍌🍌🍌🍌🍌🍌🍌🍌🍌
    answer: '9'
    check: '9'
    difficulty: 2
    hints:
    - Count slowly.
    - Touch each one.
    solution: There are 9 bananas.
    mistakes:
      '8': lkg_touch
      '10': lkg_touch
  - prompt: What comes after 9?
    answer: '10'
    check: 9 + 1
    difficulty: 2
    hints:
    - Count on one.
    - 8, 9, ...
    solution: After 9 comes 10.
    mistakes:
      '8': lkg_touch
  - prompt: How many? 🐞🐞🐞🐞🐞🐞🐞
    answer: '7'
    check: '7'
    difficulty: 2
    hints:
    - Count each ladybird.
    - Past 5.
    solution: There are 7 ladybirds.
    mistakes:
      '6': lkg_touch
      '8': lkg_touch
  - prompt: 'Count: 🌟🌟🌟🌟🌟🌟🌟🌟. How many stars?'
    answer: '8'
    check: '8'
    difficulty: 2
    hints:
    - Count the first five, then go on.
    - Touch each star once.
    solution: 'Step 1: 1 to 5, then 6, 7, 8. Step 2: 8.'
    mistakes:
      '7': lk3_touch
      '9': lk3_touch
  - prompt: What comes after 6?
    answer: '7'
    check: '7'
    difficulty: 1
    hints:
    - Say 5, 6, ...
    - One more.
    solution: 'Step 1: 5, 6. Step 2: next is 7.'
    mistakes:
      '5': lk3_next
      '8': lk3_next
  - prompt: 'Count: 🦆🦆🦆🦆🦆🦆🦆🦆🦆🦆. How many ducks?'
    answer: '10'
    check: '10'
    difficulty: 2
    hints:
    - Count five, then five more.
    - Like two full hands.
    solution: 'Step 1: 5 and 5. Step 2: 10 ducks.'
    mistakes:
      '9': lk3_five
      '11': lk3_touch
  - prompt: What comes after 8?
    answer: '9'
    check: '9'
    difficulty: 1
    hints:
    - Say 6, 7, 8, ...
    - One more.
    solution: 'Step 1: 7, 8. Step 2: next is 9.'
    mistakes:
      '7': lk3_next
      '10': lk3_next
  - prompt: Which group has 6?
    options:
    - 🍇🍇🍇🍇🍇🍇
    - 🍇🍇🍇🍇🍇
    - 🍇🍇🍇🍇🍇🍇🍇
    answer: 🍇🍇🍇🍇🍇🍇
    difficulty: 2
    hints:
    - Count each group.
    - Which stops at 6?
    solution: 'Step 1: 6, 5, 7 in the groups. Step 2: the group of 6.'
    mistakes:
      🍇🍇🍇🍇🍇: lk3_touch
      🍇🍇🍇🍇🍇🍇🍇: lk3_touch
  - prompt: What comes just before 10?
    answer: '9'
    check: '9'
    difficulty: 2
    hints:
    - Say 7, 8, ..., 10.
    - One less than 10.
    solution: 'Step 1: 8, 9, 10. Step 2: 9.'
    mistakes:
      '8': lk3_next
      '11': lk3_next
  - prompt: A spider has 8 legs. Count 1 to 8 on your fingers. How many fingers are still down?
    answer: '2'
    check: 10-8
    difficulty: 3
    hints:
    - You have 10 fingers in all.
    - Count the ones not up.
    solution: 'Step 1: 10 fingers, 8 up. Step 2: 2 down.'
    mistakes:
      '8': lk3_five
      '10': lk3_five
  - prompt: 'Count: 🚲🚲🚲🚲🚲🚲. How many cycles?'
    answer: '6'
    check: '6'
    difficulty: 1
    hints:
    - Touch each one once.
    - Five, then one more.
    solution: 'Step 1: 1 to 6. Step 2: 6.'
    mistakes:
      '5': lk3_touch
      '7': lk3_touch
  - prompt: Which number is the biggest?
    options:
    - '9'
    - '6'
    - '7'
    answer: '9'
    difficulty: 3
    hints:
    - Which do you say last when counting?
    - 'Count up: 6, 7, 8, ...'
    solution: 'Step 1: 6, 7, then 9 comes later. Step 2: 9.'
    mistakes:
      '6': lk3_next
      '7': lk3_next
  - prompt: 'Case: Neha has 7 pencils. A friend gives Neha 1 more. How many pencils does Neha have now?'
    options:
    - '8'
    - '6'
    - '9'
    answer: '8'
    hints:
    - Start at 7.
    - Say the number that comes just after 7.
    solution: One more than 7 is the next number, 8.
    mistakes:
      '6': lk3_next
      '9': lk3_next
    exam: case
    difficulty: 2
  - prompt: 'Situation: There are 10 children and only 9 cups of milk. How many more cups are needed so everyone has one?'
    options:
    - '1'
    - '2'
    - '10'
    answer: '1'
    hints:
    - Count up from 9 to 10.
    - How many hops from 9 to 10?
    solution: From 9 to 10 is one hop, so 1 more cup is needed.
    mistakes:
      '2': lk3_next
      '10': lk3_next
    exam: competency
    difficulty: 2
