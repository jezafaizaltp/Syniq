# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 1
title: Big and Small
tips:
  lkg_touch: Touch each one with your finger as you count. One touch, one number.
  lkg_look: Look again slowly. Say the name aloud.
  kg_long: "Long means far from one end to the other. Which one could stretch across the room?"
  kg_opposite: "Opposites are far apart, like hot and cold. Say both words. Are they far apart?"
  kg_shoe: "Whose feet are bigger, a grown-up's or a baby's? Bigger feet need bigger shoes."
  kg_size: "Hold your hands apart to show how big each one is. Which needs the smallest gap?"
  kg_tall: "Tall means far from the ground to the top. Which one could eat leaves from a tree?"
  lk1_size: Picture them standing side by side. Which one fills more space?
  lk1_tall: Stand them next to each other. Whose head is higher?
  lk1_long: Lay them in a line from the same start. Which one goes further?
concepts:
- code: lkgm.size
  title: Big and Small
  notes: |
    Comparing size: big and small, tall and short, long and short, using animals and toys children know.
  explanations:
    text: An elephant is big. A mouse is small. Look at two things and say which is big and which is small.
    visual: Draw a big elephant next to a small mouse.
    step_by_step: 'Step 1: Look at both. Step 2: Which takes more space? That one is big.'
    real_world: Papa's shoes are big; baby's shoes are small.
  picture:
    kind: compare
    columns:
    - title: Big
      points:
      - elephant 🐘
      - bus 🚌
    - title: Small
      points:
      - mouse 🐭
      - car toy 🚗
    alt: An elephant and a bus are big; a mouse and a toy car are small.
  activity:
    type: sort
    prompt: Is it big or small?
    bins:
    - Big
    - Small
    items:
    - label: 🐘 Elephant
      bin: Big
      clue: Can it fit in your hand?
      why: An elephant is bigger than a house door. It is big.
    - label: 🐭 Mouse
      bin: Small
      clue: Could it hide in a shoe?
      why: A mouse fits in your hand. It is small.
    - label: 🚌 Bus
      bin: Big
      clue: How many people sit inside?
      why: A bus carries many people. It is big.
    - label: 🐜 Ant
      bin: Small
      clue: Look closely. Can you even see it?
      why: An ant is tiny. It is small.
    - label: 🌳 Tree
      bin: Big
      clue: Is it taller than you?
      why: A tree is much taller than you. It is big.
    - label: 🍒 Cherry
      bin: Small
      clue: Can it fit in your mouth?
      why: A cherry fits in your mouth. It is small.
  lesson:
    - teach: Big things take up lots of space, like an elephant 🐘. Small things take up little space, like a mouse 🐭. Show big with wide arms, small with two fingers!
      check:
        prompt: 'Which is bigger: 🐘 or 🐭?'
        options:
        - 🐘
        - 🐭
        - both the same
        answer: 🐘
        why: An elephant fills much more space than a mouse.
      ways:
      - style: visual
        teach: Some big things and some small things, side by side. Point to each one and say big or small.
        picture:
          kind: compare
          columns:
          - title: Big
            points:
            - 🚌 bus
            - 🐻 bear
            - 🌳 tree
          - title: Small
            points:
            - 🐞 ladybird
            - 🔑 key
            - 🍒 cherry
          alt: The bus, the bear and the tree are big. The ladybird, the key and the cherry are small.
      - style: real_world
        teach: At the shop, a big bag holds lots of shopping and a small bag holds only a few things.
    - teach: Tall means high from bottom to top, like a tree 🌳. Short means not high, like a small plant 🌱. Stretch up tall, then crouch down short!
      check:
        prompt: 'Which is taller: 🌳 or 🌱?'
        options:
        - 🌳
        - 🌱
        - both the same
        answer: 🌳
        why: The tree's top is much higher.
      ways:
      - style: step_by_step
        teach: 'Find who is taller. First: stand back to back with a friend. Second: stand up straight. Third: ask a grown-up to put a hand flat on top of the heads. Fourth: the head that is higher is taller.'
      - style: visual
        teach: How tall some things are, as bars. The longest bar is the tallest.
        picture:
          kind: bars
          bars:
          - label: 🌻 sunflower
            value: 3
          - label: 🍄 mushroom
            value: 1
          - label: 🌴 palm tree
            value: 8
          alt: Bars for a sunflower, a mushroom and a palm tree. The palm tree bar is the longest, so it is the tallest. The mushroom is the shortest.
    - teach: Long means it stretches far, like a train 🚆. Short means it does not stretch far, like a crayon 🖍️.
      check:
        prompt: 'Which is longer: 🚆 or 🖍️?'
        options:
        - 🚆
        - 🖍️
        - both the same
        answer: 🚆
        why: A train stretches much further than a crayon.
      ways:
      - style: visual
        teach: Some long things and some short things, side by side. Which ones stretch far?
        picture:
          kind: compare
          columns:
          - title: Long
            points:
            - 🛤️ road
            - 🧣 scarf
            - 🪢 rope
          - title: Short
            points:
            - 🖇️ clip
            - 🥜 peanut
          alt: The road, the scarf and the rope are long. The clip and the peanut are short.
      - style: step_by_step
        teach: 'Check which is longer. First: lay two ribbons on the table. Second: line up one end of each. Third: look at the other ends. Fourth: the ribbon that goes further is longer.'
  items:
  - prompt: Which is big?
    options:
    - 🐘 elephant
    - 🐭 mouse
    - 🐜 ant
    answer: 🐘 elephant
    difficulty: 1
    hints:
    - Think of their size.
    - It has a trunk.
    solution: The elephant is big.
    mistakes:
      🐭 mouse: lkg_look
  - prompt: Which is small?
    options:
    - 🐜 ant
    - 🦒 giraffe
    - 🐄 cow
    answer: 🐜 ant
    difficulty: 1
    hints:
    - Tiny.
    - It walks in a line.
    solution: The ant is small.
    mistakes: {"🦒 giraffe": "kg_size", "🐄 cow": "kg_size"}
  - prompt: Which is tall?
    options:
    - 🦒 giraffe
    - 🐢 tortoise
    - 🐇 rabbit
    answer: 🦒 giraffe
    difficulty: 1
    hints:
    - Long neck.
    - Very high.
    solution: The giraffe is tall.
    mistakes: {"🐢 tortoise": "kg_tall", "🐇 rabbit": "kg_tall"}
  - prompt: Which is longer?
    options:
    - 🐍 snake
    - 🐛 caterpillar
    - 🐞 ladybird
    answer: 🐍 snake
    difficulty: 2
    hints:
    - Stretch them out.
    - Very long body.
    solution: The snake is longer.
    mistakes: {"🐛 caterpillar": "kg_long", "🐞 ladybird": "kg_long"}
  - prompt: Papa's shoe and baby's shoe. Which is big?
    options:
    - Papa's shoe
    - baby's shoe
    - both the same
    answer: Papa's shoe
    difficulty: 2
    hints:
    - Whose feet are bigger?
    - Papa.
    solution: Papa's shoe is big.
    mistakes: {"baby's shoe": "kg_shoe", "both the same": "kg_shoe"}
  - prompt: Which is the opposite of big?
    options:
    - small
    - tall
    - red
    answer: small
    difficulty: 2
    hints:
    - Not big.
    - Tiny.
    solution: Small is the opposite of big.
    mistakes: {"tall": "kg_opposite", "red": "kg_opposite"}
  - prompt: 'Which is smaller: 🐄 or 🐤?'
    options:
    - 🐤
    - 🐄
    - both the same
    answer: 🐤
    difficulty: 1
    hints:
    - Which could sit in your hand?
    - Picture them side by side.
    solution: 'Step 1: a cow is big. Step 2: the chick is smaller.'
    mistakes:
      🐄: lk1_size
      both the same: lk1_size
  - prompt: 'Which is bigger: ⚽ or 🏀 or 🌍 the Earth?'
    options:
    - 🌍 the Earth
    - ⚽
    - 🏀
    answer: 🌍 the Earth
    difficulty: 3
    hints:
    - We all live on one of them.
    - Which holds every country?
    solution: 'Step 1: balls fit in hands. Step 2: the Earth is the biggest.'
    mistakes:
      ⚽: lk1_size
      🏀: lk1_size
  - prompt: 'Which is taller: a 🏠 house or a 🏢 tall building?'
    options:
    - 🏢 tall building
    - 🏠 house
    - both the same
    answer: 🏢 tall building
    difficulty: 2
    hints:
    - Count the floors.
    - Which reaches higher in the sky?
    solution: 'Step 1: a house has few floors. Step 2: the tall building is taller.'
    mistakes:
      🏠 house: lk1_tall
      both the same: lk1_tall
  - prompt: 'Which is shorter: a pencil ✏️ or a stick 🦯?'
    options:
    - ✏️ pencil
    - 🦯 stick
    - both the same
    answer: ✏️ pencil
    difficulty: 2
    hints:
    - Lay them side by side.
    - Which ends sooner?
    solution: 'Step 1: the stick is long. Step 2: the pencil is shorter.'
    mistakes:
      🦯 stick: lk1_long
      both the same: lk1_long
  - prompt: Papa's shirt and baby's shirt. Which is small?
    options:
    - baby's shirt
    - Papa's shirt
    - both the same
    answer: baby's shirt
    difficulty: 1
    hints:
    - Who is smaller, Papa or baby?
    - Small people wear small clothes.
    solution: 'Step 1: babies are small. Step 2: baby''s shirt is small.'
    mistakes:
      Papa's shirt: lk1_size
      both the same: lk1_size
  - prompt: Which is the opposite of tall?
    options:
    - short
    - big
    - long
    answer: short
    difficulty: 2
    hints:
    - Stretch up, then crouch down.
    - Not tall at all.
    solution: 'Step 1: tall is high. Step 2: short is low.'
    mistakes:
      big: lk1_tall
      long: lk1_long
  - prompt: Which is the biggest?
    options:
    - 🐳 whale
    - 🐟 fish
    - 🦐 prawn
    answer: 🐳 whale
    difficulty: 2
    hints:
    - All live in water.
    - Which one is huge?
    solution: 'Step 1: fish and prawn are small. Step 2: the whale is biggest.'
    mistakes:
      🐟 fish: lk1_size
      🦐 prawn: lk1_size
  - prompt: A snake and a worm. Which is longer?
    options:
    - 🐍 snake
    - 🪱 worm
    - both the same
    answer: 🐍 snake
    difficulty: 1
    hints:
    - Lay them in a line.
    - Which stretches further?
    solution: 'Step 1: a worm is short. Step 2: the snake is longer.'
    mistakes:
      🪱 worm: lk1_long
      both the same: lk1_long
  - prompt: Which is the smallest?
    options:
    - 🐜 ant
    - 🐈 cat
    - 🐎 horse
    answer: 🐜 ant
    difficulty: 1
    hints:
    - Which could you hardly see?
    - Picture all three together.
    solution: 'Step 1: horse and cat are bigger. Step 2: the ant is smallest.'
    mistakes:
      🐈 cat: lk1_size
      🐎 horse: lk1_size
  - prompt: 'Case: Meena is packing for a trip. She has a big bag and a tiny purse. She needs to carry her blanket. Which should she use?'
    options:
    - the big bag
    - the tiny purse
    - her pocket
    answer: the big bag
    hints:
    - A blanket takes up lots of space.
    - Which one has the most space inside?
    solution: A blanket is big, so it needs the big bag, which has the most space.
    mistakes:
      the tiny purse: lk1_size
      her pocket: lk1_size
    exam: case
    difficulty: 2
  - prompt: 'Situation: Two children want to pick a mango from a high branch. Who can reach it more easily?'
    options:
    - the taller child
    - the shorter child
    - the child sitting down
    answer: the taller child
    hints:
    - The mango is high up.
    - Whose hands go higher when they stretch up?
    solution: The mango is high, so the taller child can reach it more easily.
    mistakes:
      the shorter child: lk1_tall
      the child sitting down: lk1_tall
    exam: competency
    difficulty: 2
