# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 1
title: Big and Small
tips:
  lkg_touch: Touch each one with your finger as you count. One touch, one number.
  lkg_look: Look again slowly. Say the name aloud.
  kg_long: "Long means far from one end to the other. Which one could stretch across the room?"
  kg_opposite: "Opposites are far apart, like hot and cold. Say both words. Are they far apart?"
  kg_shoe: "Whose feet are bigger, a grown-up's or a baby's? Bigger feet need bigger shoes."
  kg_size: "Hold your hands apart to show how big each one is. Which needs the smallest gap?"
  kg_tall: "Tall means far from the ground to the top. Which one could eat leaves from a tree?"
concepts:
- code: lkgm.size
  title: Big and Small
  notes: |
    Comparing size: big and small, tall and short, long and short, using animals and toys children know.
  explanations:
    text: An elephant is big. A mouse is small. Look at two things and say which is big and which is small.
    visual: Draw a big elephant next to a small mouse.
    step_by_step: 'Step 1: Look at both. Step 2: Which takes more space? That one is big.'
    real_world: Papa's shoes are big; baby's shoes are small.
  picture:
    kind: compare
    columns:
    - title: Big
      points:
      - elephant 🐘
      - bus 🚌
    - title: Small
      points:
      - mouse 🐭
      - car toy 🚗
    alt: An elephant and a bus are big; a mouse and a toy car are small.
  activity:
    type: sort
    prompt: Is it big or small?
    bins:
    - Big
    - Small
    items:
    - label: 🐘 Elephant
      bin: Big
      clue: Can it fit in your hand?
      why: An elephant is bigger than a house door. It is big.
    - label: 🐭 Mouse
      bin: Small
      clue: Could it hide in a shoe?
      why: A mouse fits in your hand. It is small.
    - label: 🚌 Bus
      bin: Big
      clue: How many people sit inside?
      why: A bus carries many people. It is big.
    - label: 🐜 Ant
      bin: Small
      clue: Look closely. Can you even see it?
      why: An ant is tiny. It is small.
    - label: 🌳 Tree
      bin: Big
      clue: Is it taller than you?
      why: A tree is much taller than you. It is big.
    - label: 🍒 Cherry
      bin: Small
      clue: Can it fit in your mouth?
      why: A cherry fits in your mouth. It is small.
  items:
  - prompt: Which is big?
    options:
    - 🐘 elephant
    - 🐭 mouse
    - 🐜 ant
    answer: 🐘 elephant
    difficulty: 1
    hints:
    - Think of their size.
    - It has a trunk.
    solution: The elephant is big.
    mistakes:
      🐭 mouse: lkg_look
  - prompt: Which is small?
    options:
    - 🐜 ant
    - 🦒 giraffe
    - 🐄 cow
    answer: 🐜 ant
    difficulty: 1
    hints:
    - Tiny.
    - It walks in a line.
    solution: The ant is small.
    mistakes: {"🦒 giraffe": "kg_size", "🐄 cow": "kg_size"}
  - prompt: Which is tall?
    options:
    - 🦒 giraffe
    - 🐢 tortoise
    - 🐇 rabbit
    answer: 🦒 giraffe
    difficulty: 1
    hints:
    - Long neck.
    - Very high.
    solution: The giraffe is tall.
    mistakes: {"🐢 tortoise": "kg_tall", "🐇 rabbit": "kg_tall"}
  - prompt: Which is longer?
    options:
    - 🐍 snake
    - 🐛 caterpillar
    - 🐞 ladybird
    answer: 🐍 snake
    difficulty: 2
    hints:
    - Stretch them out.
    - Very long body.
    solution: The snake is longer.
    mistakes: {"🐛 caterpillar": "kg_long", "🐞 ladybird": "kg_long"}
  - prompt: Papa's shoe and baby's shoe. Which is big?
    options:
    - Papa's shoe
    - baby's shoe
    - both the same
    answer: Papa's shoe
    difficulty: 2
    hints:
    - Whose feet are bigger?
    - Papa.
    solution: Papa's shoe is big.
    mistakes: {"baby's shoe": "kg_shoe", "both the same": "kg_shoe"}
  - prompt: Which is the opposite of big?
    options:
    - small
    - tall
    - red
    answer: small
    difficulty: 2
    hints:
    - Not big.
    - Tiny.
    solution: Small is the opposite of big.
    mistakes: {"tall": "kg_opposite", "red": "kg_opposite"}
