# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 1
title: Big and Small
tips:
  lkg_touch: Touch each one with your finger as you count. One touch, one number.
  lkg_look: Look again slowly. Say the name aloud.
concepts:
- code: lkgm.size
  title: Big and Small
  notes: |
    Comparing size: big and small, tall and short, long and short, using animals and toys children know.
  explanations:
    text: An elephant is big. A mouse is small. Look at two things and say which is big and which is small.
    visual: Draw a big elephant next to a small mouse.
    step_by_step: 'Step 1: Look at both. Step 2: Which takes more space? That one is big.'
    real_world: Papa's shoes are big; baby's shoes are small.
  picture:
    kind: compare
    columns:
    - title: Big
      points:
      - elephant 🐘
      - bus 🚌
    - title: Small
      points:
      - mouse 🐭
      - car toy 🚗
    alt: An elephant and a bus are big; a mouse and a toy car are small.
  items:
  - prompt: Which is big?
    options:
    - 🐘 elephant
    - 🐭 mouse
    - 🐜 ant
    answer: 🐘 elephant
    difficulty: 1
    hints:
    - Think of their size.
    - It has a trunk.
    solution: The elephant is big.
    mistakes:
      🐭 mouse: lkg_look
  - prompt: Which is small?
    options:
    - 🐜 ant
    - 🦒 giraffe
    - 🐄 cow
    answer: 🐜 ant
    difficulty: 1
    hints:
    - Tiny.
    - It walks in a line.
    solution: The ant is small.
  - prompt: Which is tall?
    options:
    - 🦒 giraffe
    - 🐢 tortoise
    - 🐇 rabbit
    answer: 🦒 giraffe
    difficulty: 1
    hints:
    - Long neck.
    - Very high.
    solution: The giraffe is tall.
  - prompt: Which is longer?
    options:
    - 🐍 snake
    - 🐛 caterpillar
    - 🐞 ladybird
    answer: 🐍 snake
    difficulty: 2
    hints:
    - Stretch them out.
    - Very long body.
    solution: The snake is longer.
  - prompt: Papa's shoe and baby's shoe. Which is big?
    options:
    - Papa's shoe
    - baby's shoe
    - both the same
    answer: Papa's shoe
    difficulty: 2
    hints:
    - Whose feet are bigger?
    - Papa.
    solution: Papa's shoe is big.
  - prompt: Which is the opposite of big?
    options:
    - small
    - tall
    - red
    answer: small
    difficulty: 2
    hints:
    - Not big.
    - Tiny.
    solution: Small is the opposite of big.
