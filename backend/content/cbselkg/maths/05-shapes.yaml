# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 5
title: Circle, Square, Triangle
concepts:
- code: lkgm.shapes
  title: Circle, Square, Triangle
  notes: |
    Recognising circle, square and triangle in everyday things: wheel, chapati, window, slice of watermelon, roof.
  explanations:
    text: A circle is round like a wheel. A square has 4 equal sides like a window. A triangle has 3 sides like a samosa.
    visual: Draw a circle, a square and a triangle, and next to each something that looks like it.
    step_by_step: 'Step 1: Is it round? Then it is a circle. Step 2: Count the corners: 3 is a triangle, 4 equal sides is a square.'
    real_world: A roti is a circle, a carrom board is a square, a samosa looks like a triangle.
  picture:
    kind: bars
    bars:
    - label: circle
      value: 0
    - label: triangle
      value: 3
    - label: square
      value: 4
    alt: 'Corners: a circle has 0, a triangle 3, a square 4.'
    unit: corners
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Circle
    - Square
    - Triangle
    items:
    - label: 🛞 Wheel
      bin: Circle
      clue: Is it round? Does it have corners?
      why: A wheel is round with no corners. A circle.
    - label: 🪟 Window with 4 equal sides
      bin: Square
      clue: Count the sides. Are they all the same?
      why: '4 equal sides: a square.'
    - label: 🥟 Samosa
      bin: Triangle
      clue: Count its corners.
      why: '3 corners: a triangle.'
    - label: 🍪 Round biscuit
      bin: Circle
      clue: Run your finger around it. Any corners?
      why: 'No corners, round: a circle.'
    - label: 🔺 Road sign with 3 sides
      bin: Triangle
      clue: Count the sides.
      why: '3 sides: a triangle.'
    - label: 🎲 Face of a dice
      bin: Square
      clue: Are all the sides the same?
      why: '4 equal sides: a square.'
  items:
  - prompt: 'A wheel is a:'
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 1
    hints:
    - Round.
    - It rolls.
    solution: A wheel is a circle.
    mistakes:
      square: lkg_look
  - prompt: 'A samosa looks like a:'
    options:
    - triangle
    - circle
    - square
    answer: triangle
    difficulty: 1
    hints:
    - 3 corners.
    - Pointy.
    solution: A samosa looks like a triangle.
  - prompt: 'A carrom board is a:'
    options:
    - square
    - circle
    - triangle
    answer: square
    difficulty: 1
    hints:
    - 4 equal sides.
    - 4 corners.
    solution: A carrom board is a square.
  - prompt: How many corners does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count the points.
    - Like a samosa.
    solution: A triangle has 3 corners.
    mistakes:
      '4': lkg_touch
  - prompt: Which shape has no corners?
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 2
    hints:
    - Round.
    - Like a coin.
    solution: A circle has no corners.
  - prompt: 'A roti is a:'
    options:
    - circle
    - triangle
    - square
    answer: circle
    difficulty: 1
    hints:
    - Round and flat.
    - Like the moon.
    solution: A roti is a circle.
