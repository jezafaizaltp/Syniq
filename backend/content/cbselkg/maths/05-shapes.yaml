# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 5
title: Circle, Square, Triangle
tips:
  kg_corners: "Count the pointy corners with your finger. 0 corners, 3 corners or 4 corners?"
  lk5_trace: Trace it in the air with your finger. Is it round, or does it have straight sides?
  lk5_count: Touch each corner once and count.
  lk5_see: Picture the thing in your hand. What shape is its outline?

concepts:
- code: lkgm.shapes
  title: Circle, Square, Triangle
  notes: |
    Recognising circle, square and triangle in everyday things: wheel, chapati, window, slice of watermelon, roof.
  explanations:
    text: A circle is round like a wheel. A square has 4 equal sides like a window. A triangle has 3 sides like a samosa.
    visual: Draw a circle, a square and a triangle, and next to each something that looks like it.
    step_by_step: 'Step 1: Is it round? Then it is a circle. Step 2: Count the corners: 3 is a triangle, 4 equal sides is a square.'
    real_world: A roti is a circle, a carrom board is a square, a samosa looks like a triangle.
  picture:
    kind: bars
    bars:
    - label: circle
      value: 0
    - label: triangle
      value: 3
    - label: square
      value: 4
    alt: 'Corners: a circle has 0, a triangle 3, a square 4.'
    unit: corners
  activity:
    type: sort
    prompt: What shape is it?
    bins:
    - Circle
    - Square
    - Triangle
    items:
    - label: 🛞 Wheel
      bin: Circle
      clue: Is it round? Does it have corners?
      why: A wheel is round with no corners. A circle.
    - label: 🪟 Window with 4 equal sides
      bin: Square
      clue: Count the sides. Are they all the same?
      why: '4 equal sides: a square.'
    - label: 🥟 Samosa
      bin: Triangle
      clue: Count its corners.
      why: '3 corners: a triangle.'
    - label: 🍪 Round biscuit
      bin: Circle
      clue: Run your finger around it. Any corners?
      why: 'No corners, round: a circle.'
    - label: 🔺 Road sign with 3 sides
      bin: Triangle
      clue: Count the sides.
      why: '3 sides: a triangle.'
    - label: 🎲 Face of a dice
      bin: Square
      clue: Are all the sides the same?
      why: '4 equal sides: a square.'
  lesson:
    - teach: 'A circle is round, with no corners, like a wheel, a bangle or a roti. Draw it in the air: round and round!'
      check:
        prompt: Which one is a circle?
        options:
        - 🍪 a biscuit
        - 📐 a set square
        - 📕 a book
        answer: 🍪 a biscuit
        why: A biscuit is round with no corners.
    - teach: A square has 4 straight sides, all the same length, and 4 corners, like a carrom board or a chess board.
      check:
        prompt: How many sides does a square have?
        options:
        - '4'
        - '3'
        - '0'
        answer: '4'
        why: 'Count them: 1, 2, 3, 4.'
    - teach: A triangle has 3 straight sides and 3 corners, like a samosa or a slice of watermelon 🍉.
      picture:
        kind: compare
        columns:
        - title: Circle
          points:
          - no corners
          - wheel
        - title: Square
          points:
          - 4 corners
          - carrom board
        - title: Triangle
          points:
          - 3 corners
          - samosa
        alt: Circle, square and triangle with an example of each.
      check:
        prompt: Which shape has 3 corners?
        options:
        - triangle
        - circle
        - square
        answer: triangle
        why: A triangle has 3 sides and 3 corners.
  items:
  - prompt: 'A wheel is a:'
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 1
    hints:
    - Round.
    - It rolls.
    solution: A wheel is a circle.
    mistakes:
      square: lkg_look
  - prompt: 'A samosa looks like a:'
    options:
    - triangle
    - circle
    - square
    answer: triangle
    difficulty: 1
    hints:
    - 3 corners.
    - Pointy.
    solution: A samosa looks like a triangle.
    mistakes: {"circle": "kg_corners", "square": "kg_corners"}
  - prompt: 'A carrom board is a:'
    options:
    - square
    - circle
    - triangle
    answer: square
    difficulty: 1
    hints:
    - 4 equal sides.
    - 4 corners.
    solution: A carrom board is a square.
    mistakes: {"circle": "kg_corners", "triangle": "kg_corners"}
  - prompt: How many corners does a triangle have?
    answer: '3'
    check: '3'
    difficulty: 2
    hints:
    - Count the points.
    - Like a samosa.
    solution: A triangle has 3 corners.
    mistakes:
      '4': lkg_touch
  - prompt: Which shape has no corners?
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 2
    hints:
    - Round.
    - Like a coin.
    solution: A circle has no corners.
    mistakes: {"square": "kg_corners", "triangle": "kg_corners"}
  - prompt: 'A roti is a:'
    options:
    - circle
    - triangle
    - square
    answer: circle
    difficulty: 1
    hints:
    - Round and flat.
    - Like the moon.
    solution: A roti is a circle.
    mistakes: {"triangle": "kg_corners", "square": "kg_corners"}
  - prompt: 'A coin is a:'
    options:
    - circle
    - triangle
    - square
    answer: circle
    difficulty: 1
    hints:
    - Run your finger round its edge.
    - Does it have any corners?
    solution: 'Step 1: no corners, round edge. Step 2: circle.'
    mistakes:
      triangle: lk5_trace
      square: lk5_trace
  - prompt: How many corners does a square have?
    options:
    - '4'
    - '3'
    - '5'
    answer: '4'
    difficulty: 1
    hints:
    - Touch each corner.
    - One for each side.
    solution: 'Step 1: 1, 2, 3, 4. Step 2: 4.'
    mistakes:
      '3': lk5_count
      '5': lk5_count
  - prompt: 'A slice of watermelon 🍉 looks like a:'
    options:
    - triangle
    - square
    - circle
    answer: triangle
    difficulty: 2
    hints:
    - It is pointy at one end.
    - Count its corners.
    solution: 'Step 1: 3 corners. Step 2: triangle.'
    mistakes:
      square: lk5_count
      circle: lk5_trace
  - prompt: Which shape can roll?
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 2
    hints:
    - Corners stop rolling.
    - Think of a wheel.
    solution: 'Step 1: no corners to stop it. Step 2: circle rolls.'
    mistakes:
      square: lk5_trace
      triangle: lk5_trace
  - prompt: 'A window often is a:'
    options:
    - square
    - circle
    - triangle
    answer: square
    difficulty: 1
    hints:
    - Look at its straight edges.
    - It has 4 corners.
    solution: 'Step 1: 4 straight sides. Step 2: square.'
    mistakes:
      circle: lk5_see
      triangle: lk5_see
  - prompt: Two triangles. How many corners in all?
    answer: '6'
    check: 3+3
    difficulty: 3
    hints:
    - One triangle has how many corners?
    - Count both.
    solution: 'Step 1: 3 and 3. Step 2: 6.'
    mistakes:
      '3': lk5_count
      '5': lk5_count
  - prompt: 'The sun ☀️ is drawn as a:'
    options:
    - circle
    - square
    - triangle
    answer: circle
    difficulty: 1
    hints:
    - Look at the middle part.
    - Round like a ball.
    solution: 'Step 1: round. Step 2: circle.'
    mistakes:
      square: lk5_see
      triangle: lk5_see
  - prompt: Which has the most corners?
    options:
    - square
    - triangle
    - circle
    answer: square
    difficulty: 3
    hints:
    - Count corners of each.
    - Circle has none.
    solution: 'Step 1: square 4, triangle 3, circle 0. Step 2: square.'
    mistakes:
      triangle: lk5_count
      circle: lk5_count
  - prompt: 'The roof of a hut 🛖 looks like a:'
    options:
    - triangle
    - circle
    - square
    answer: triangle
    difficulty: 2
    hints:
    - It goes up to a point.
    - Count the corners.
    solution: 'Step 1: pointy top, 3 corners. Step 2: triangle.'
    mistakes:
      circle: lk5_see
      square: lk5_see
