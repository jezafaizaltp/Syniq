# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 7
title: What Comes Next?
tips:
  kg_pattern: "Say the pattern aloud and clap it. What comes next when it starts again?"
  lk7_say: Say the pattern out loud like a song. Which one comes back again?
  lk7_part: Find the little part that repeats. Point to where it starts again.
  lk7_body: "Do the pattern with your body, slowly. Which move comes back again?"

concepts:
- code: lkgm.pattern
  title: What Comes Next?
  notes: |
    Simple AB patterns with colours, shapes and sounds (clap-stamp), continuing a pattern.
  explanations:
    text: 'A pattern repeats: red, blue, red, blue. What comes next? Red!'
    visual: 'Draw beads on a string: red, blue, red, blue, and an empty bead to colour.'
    step_by_step: 'Step 1: Say the pattern aloud. Step 2: Find what repeats. Step 3: Say what comes next.'
    real_world: 'Clap, stamp, clap, stamp: patterns in songs and dances.'
  picture:
    kind: flow
    steps:
    - 🔴
    - 🔵
    - 🔴
    - 🔵
    - '?'
    alt: 'A bead pattern: red, blue, red, blue, and next comes red.'
  activity:
    type: sort
    prompt: What comes next?
    bins:
    - 🔴
    - 🔵
    - ⭐
    items:
    - label: 🔴🔵🔴🔵🔴 ...
      bin: 🔵
      clue: 'Say it: red, blue, red, blue, red ...'
      why: Red and blue take turns. After red comes blue.
    - label: ⭐🔴⭐🔴 ...
      bin: ⭐
      clue: Say it out loud and keep going.
      why: Star and red take turns. After red comes star.
    - label: 🔵🔵🔴🔵🔵🔴🔵🔵 ...
      bin: 🔴
      clue: 'Find the part that repeats: two blues, then?'
      why: Two blues, then one red. Red comes next.
    - label: 🔴⭐⭐🔴⭐⭐🔴 ...
      bin: ⭐
      clue: The part that repeats is red, then two of something.
      why: Red, star, star. After red comes a star.
  lesson:
    - teach: 'A pattern repeats again and again. 🔴🟢🔴🟢: red, green, red, green. Next is red. Say it like a song!'
      check:
        prompt: 🌞 🌧️ 🌞 🌧️ ? What comes next?
        options:
        - 🌞
        - 🌧️
        - 🌈
        answer: 🌞
        why: Sun, rain repeats. After rain comes sun.
      ways:
      - style: visual
        teach: A colour pattern that repeats. Say the colours like a song as you follow it.
        picture:
          kind: flow
          steps:
          - 🟡 yellow
          - 🟣 purple
          - 🟡 yellow
          - 🟣 purple
          - 🟡 yellow
          - 🟣 purple
          alt: A pattern of yellow, purple, yellow, purple, yellow, purple. It keeps repeating.
      - style: real_world
        teach: Many bangles and necklaces have beads in a pattern, like one big bead and one small bead again and again.
    - teach: 'Patterns can be actions: clap, jump, clap, jump. Or sounds: moo, baa, moo, baa. Do it with your body!'
      check:
        prompt: jump, sit, jump, sit, ? What comes next?
        options:
        - jump
        - sit
        - run
        answer: jump
        why: Jump, sit repeats. After sit comes jump.
      ways:
      - style: step_by_step
        teach: 'Make a body pattern. First: tap your head. Second: tap your knees. Third: tap your head again. Fourth: tap your knees again, and keep going: head, knees, head, knees.'
      - style: visual
        teach: A body pattern drawn in a line. Do it as you read it.
        picture:
          kind: flow
          steps:
          - head
          - knees
          - head
          - knees
          - head
          - knees
          alt: A pattern of head, knees, head, knees, head, knees. Tap each one as you go.
    - teach: 'Some patterns repeat two of one thing: 🍎🍎🍌 🍎🍎🍌. Find the part that repeats: apple, apple, banana.'
      check:
        prompt: ⚪ ⚪ ⚫ ⚪ ⚪ ⚫ ⚪ ? What comes next?
        options:
        - ⚪
        - ⚫
        - 🔵
        answer: ⚪
        why: The part is white, white, black. After one white comes another white.
      ways:
      - style: step_by_step
        teach: 'Find the part that repeats in 🌼🌼🍃 🌼🌼🍃. First: point to the first flower. Second: move along until you see the same start again. Third: stop just before it. Fourth: the part you passed, flower, flower, leaf, is the part that repeats.'
      - style: visual
        teach: A pattern with two of one thing and one of another, drawn in a line.
        picture:
          kind: flow
          steps:
          - 🐟
          - 🐟
          - 🐚
          - 🐟
          - 🐟
          - 🐚
          alt: Fish, fish, shell, fish, fish, shell. The part fish, fish, shell repeats.
  items:
  - prompt: 🔴 🔵 🔴 🔵 ?
    options:
    - 🔴
    - 🔵
    - 🟢
    answer: 🔴
    difficulty: 1
    hints:
    - Red, blue repeats.
    - After blue comes ...
    solution: Red comes next.
    mistakes:
      🔵: lkg_look
  - prompt: 🐶 🐱 🐶 🐱 ?
    options:
    - 🐶
    - 🐱
    - 🐭
    answer: 🐶
    difficulty: 1
    hints:
    - Dog, cat, dog, cat ...
    - Repeat.
    solution: Dog comes next.
    mistakes: {"🐱": "kg_pattern", "🐭": "kg_pattern"}
  - prompt: ⭐ 🌙 ⭐ 🌙 ?
    options:
    - ⭐
    - 🌙
    - ☀️
    answer: ⭐
    difficulty: 1
    hints:
    - Star, moon ...
    - Repeat.
    solution: Star comes next.
    mistakes: {"🌙": "kg_pattern", "☀️": "kg_pattern"}
  - prompt: 👏 🦶 👏 🦶 ?
    options:
    - 👏 clap
    - 🦶 stamp
    - 🙌 wave
    answer: 👏 clap
    difficulty: 2
    hints:
    - Clap, stamp ...
    - After stamp comes ...
    solution: Clap comes next.
    mistakes: {"🦶 stamp": "kg_pattern", "🙌 wave": "kg_pattern"}
  - prompt: 🍎 🍎 🍌 🍎 🍎 🍌 ?
    options:
    - 🍎
    - 🍌
    - 🍇
    answer: 🍎
    difficulty: 2
    hints:
    - Apple, apple, banana repeats.
    - Start again.
    solution: Apple comes next.
    mistakes: {"🍌": "kg_pattern", "🍇": "kg_pattern"}
  - prompt: Big, small, big, small, ?
    options:
    - big
    - small
    - tall
    answer: big
    difficulty: 2
    hints:
    - Two sizes repeat.
    - After small comes ...
    solution: Big comes next.
    mistakes: {"small": "kg_pattern", "tall": "kg_pattern"}
  - prompt: 🐔 🐥 🐔 🐥 ? What comes next?
    options:
    - 🐔
    - 🐥
    - 🐣
    answer: 🐔
    difficulty: 1
    hints:
    - 'Say: hen, chick, hen, chick ...'
    - What starts again?
    solution: 'Step 1: hen, chick repeats. Step 2: hen.'
    mistakes:
      🐥: lk7_say
      🐣: lk7_part
  - prompt: 🟦 🟨 🟦 🟨 🟦 ? What comes next?
    options:
    - 🟨
    - 🟦
    - 🟥
    answer: 🟨
    difficulty: 1
    hints:
    - Say the colours aloud.
    - After blue comes ...
    solution: 'Step 1: blue, yellow repeats. Step 2: yellow.'
    mistakes:
      🟦: lk7_say
      🟥: lk7_part
  - prompt: clap, clap, stamp, clap, clap, ? What comes next?
    options:
    - stamp
    - clap
    - jump
    answer: stamp
    difficulty: 2
    hints:
    - Do it with your hands and feet.
    - Two claps, then ...
    solution: 'Step 1: clap, clap, stamp repeats. Step 2: stamp.'
    mistakes:
      clap: lk7_body
      jump: lk7_part
  - prompt: 🍓 🍌 🍓 🍌 ? What comes next?
    options:
    - 🍓
    - 🍌
    - 🍇
    answer: 🍓
    difficulty: 1
    hints:
    - Say the fruits aloud.
    - After banana comes ...
    solution: 'Step 1: strawberry, banana repeats. Step 2: strawberry.'
    mistakes:
      🍌: lk7_say
      🍇: lk7_part
  - prompt: 🔺 🔺 ⚫ 🔺 🔺 ⚫ 🔺 ? What comes next?
    options:
    - 🔺
    - ⚫
    - 🟩
    answer: 🔺
    difficulty: 3
    hints:
    - The repeating part has three.
    - Triangle, triangle, dot ... where are you?
    solution: 'Step 1: triangle, triangle, dot repeats. Step 2: triangle.'
    mistakes:
      ⚫: lk7_part
      🟩: lk7_part
  - prompt: moo, baa, moo, baa, ? What comes next?
    options:
    - moo
    - baa
    - quack
    answer: moo
    difficulty: 2
    hints:
    - Make the animal sounds.
    - After baa comes ...
    solution: 'Step 1: moo, baa repeats. Step 2: moo.'
    mistakes:
      baa: lk7_say
      quack: lk7_part
  - prompt: Small, big, small, big, ? What comes next?
    options:
    - small
    - big
    - tall
    answer: small
    difficulty: 2
    hints:
    - Show small with fingers, big with arms.
    - "What came after big last time?"
    solution: 'Step 1: small, big repeats. Step 2: small.'
    mistakes:
      big: lk7_body
      tall: lk7_part
  - prompt: Which one is a pattern?
    options:
    - 🍎 🍊 🍎 🍊 🍎 🍊
    - 🍎 🍎 🍊 🍎 🍊 🍊
    - 🍊 🍎 🍎 🍎 🍊 🍊
    answer: 🍎 🍊 🍎 🍊 🍎 🍊
    difficulty: 3
    hints:
    - A pattern repeats the same way every time.
    - Say each row out loud.
    solution: 'Step 1: in only one row the same two fruits take turns. Step 2: that row is the pattern.'
    mistakes:
      🍎 🍎 🍊 🍎 🍊 🍊: lk7_part
      🍊 🍎 🍎 🍎 🍊 🍊: lk7_part
  - prompt: up, down, up, down, ? What comes next?
    options:
    - up
    - down
    - side
    answer: up
    difficulty: 2
    hints:
    - Move your hand up and down.
    - After down comes ...
    solution: 'Step 1: up, down repeats. Step 2: up.'
    mistakes:
      down: lk7_body
      side: lk7_part
  - prompt: 'Case: Rani is threading beads for a necklace: 🔴 ⚪ 🔴 ⚪ 🔴. Rani wants to keep the pattern. Which bead should Rani add next?'
    options:
    - ⚪ white
    - 🔴 red
    - 🟢 green
    answer: ⚪ white
    hints:
    - Say the colours out loud.
    - After red, which colour came each time?
    solution: The pattern is red, white, red, white. After red comes white.
    mistakes:
      🔴 red: lk7_say
      🟢 green: lk7_say
    exam: case
    difficulty: 2
  - prompt: 'Situation: In a dance, the children go: jump, jump, turn, jump, jump, turn, jump, jump. What do they do next?'
    options:
    - turn
    - jump
    - sit
    answer: turn
    hints:
    - Find the part that repeats.
    - How many jumps come before each turn?
    solution: The part that repeats is jump, jump, turn. After two jumps comes a turn.
    mistakes:
      jump: lk7_part
      sit: lk7_part
    exam: competency
    difficulty: 2
