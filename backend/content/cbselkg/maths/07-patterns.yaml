# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 7
title: What Comes Next?
concepts:
- code: lkgm.pattern
  title: What Comes Next?
  notes: |
    Simple AB patterns with colours, shapes and sounds (clap-stamp), continuing a pattern.
  explanations:
    text: 'A pattern repeats: red, blue, red, blue. What comes next? Red!'
    visual: 'Draw beads on a string: red, blue, red, blue, and an empty bead to colour.'
    step_by_step: 'Step 1: Say the pattern aloud. Step 2: Find what repeats. Step 3: Say what comes next.'
    real_world: 'Clap, stamp, clap, stamp: patterns in songs and dances.'
  picture:
    kind: flow
    steps:
    - 🔴
    - 🔵
    - 🔴
    - 🔵
    - '?'
    alt: 'A bead pattern: red, blue, red, blue, and next comes red.'
  items:
  - prompt: 🔴 🔵 🔴 🔵 ?
    options:
    - 🔴
    - 🔵
    - 🟢
    answer: 🔴
    difficulty: 1
    hints:
    - Red, blue repeats.
    - After blue comes ...
    solution: Red comes next.
    mistakes:
      🔵: lkg_look
  - prompt: 🐶 🐱 🐶 🐱 ?
    options:
    - 🐶
    - 🐱
    - 🐭
    answer: 🐶
    difficulty: 1
    hints:
    - Dog, cat, dog, cat ...
    - Repeat.
    solution: Dog comes next.
  - prompt: ⭐ 🌙 ⭐ 🌙 ?
    options:
    - ⭐
    - 🌙
    - ☀️
    answer: ⭐
    difficulty: 1
    hints:
    - Star, moon ...
    - Repeat.
    solution: Star comes next.
  - prompt: 👏 🦶 👏 🦶 ?
    options:
    - 👏 clap
    - 🦶 stamp
    - 🙌 wave
    answer: 👏 clap
    difficulty: 2
    hints:
    - Clap, stamp ...
    - After stamp comes ...
    solution: Clap comes next.
  - prompt: 🍎 🍎 🍌 🍎 🍎 🍌 ?
    options:
    - 🍎
    - 🍌
    - 🍇
    answer: 🍎
    difficulty: 2
    hints:
    - Apple, apple, banana repeats.
    - Start again.
    solution: Apple comes next.
  - prompt: Big, small, big, small, ?
    options:
    - big
    - small
    - tall
    answer: big
    difficulty: 2
    hints:
    - Two sizes repeat.
    - After small comes ...
    solution: Big comes next.
