# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 2
title: Count 1 to 5
tips:
  lk2_touch: Touch each one once and say one number for each touch.
  lk2_last: The last number you say tells how many there are.
  lk2_hand: Hold up your fingers to match, one finger for each thing.
concepts:
- code: lkgm.count5
  title: Count 1 to 5
  notes: |
    Counting objects from 1 to 5, one touch for one number; matching a group to its number.
  explanations:
    text: 'Let''s count! Touch each one and say a number: 1, 2, 3, 4, 5. The last number tells how many.'
    visual: Draw 5 balloons and write 1 to 5 under them.
    step_by_step: 'Step 1: Touch the first one, say 1. Step 2: Touch the next, say 2. Step 3: Stop at the last one.'
    real_world: 'Count your fingers on one hand: 1, 2, 3, 4, 5!'
  picture:
    kind: number_line
    from: 0
    to: 5
    step: 1
    points:
    - at: 1
      label: '1'
    - at: 2
      label: '2'
    - at: 3
      label: '3'
    - at: 4
      label: '4'
    - at: 5
      label: '5'
    alt: Counting from 1 to 5 on a number line, one hop at a time.
    jumps:
    - from: 0
      to: 1
      label: '+1'
    - from: 1
      to: 2
      label: '+1'
    - from: 2
      to: 3
      label: '+1'
    - from: 3
      to: 4
      label: '+1'
    - from: 4
      to: 5
      label: '+1'
  activity:
    type: number_line
    min: 0
    max: 5
    step: 1
    start: 0
    prompt: Touch each one and count. Move to how many.
    goals:
    - prompt: 🍎🍎🍎
      target: 3
      mistakes:
      - when:
          v: 2
        say: 'Touch each apple once and say a number: 1, 2, 3. One was missed.'
      - when:
          v: 4
        say: One apple was counted two times. Touch each apple only once.
    - prompt: ⭐⭐⭐⭐⭐
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'Count again, touching each star: 1, 2, 3, 4, 5. The last one was missed.'
    - prompt: 🐟🐟
      target: 2
      mistakes:
      - when:
          v: 1
        say: 'There is another fish. Touch each one: 1, 2.'
      - when:
          v: 3
        say: 'Touch each fish only once: 1, 2.'
  lesson:
    - teach: 'We count with numbers: 1, 2, 3, 4, 5. Touch each thing once and say one number: 🍎 one, 🍎 two, 🍎 three.'
      picture:
        kind: number_line
        from: 0
        to: 5
        points:
        - at: 1
          label: '1'
        - at: 2
          label: '2'
        - at: 3
          label: '3'
        - at: 4
          label: '4'
        - at: 5
          label: '5'
        alt: Numbers 1 to 5.
      check:
        prompt: 'Count: 🐸🐸. How many frogs?'
        options:
        - '2'
        - '1'
        - '3'
        answer: '2'
        why: 'One touch, one number: 1, 2.'
      ways:
      - style: visual
        teach: Count along the number line, one hop for each number. Each hop is one more.
        picture:
          kind: number_line
          from: 0
          to: 5
          step: 1
          jumps:
          - from: 0
            to: 1
            label: '+1'
          - from: 1
            to: 2
            label: '+1'
          - from: 2
            to: 3
            label: '+1'
          alt: 'A number line from 0 to 5 with hops of one: 0 to 1, 1 to 2, and 2 to 3.'
      - style: real_world
        teach: When you climb the stairs at home, you can count each step out loud as your foot lands on it.
    - teach: 'The last number you say tells how many. Count 🐞🐞🐞🐞: 1, 2, 3, 4. The last number is 4, so there are 4 ladybirds.'
      check:
        prompt: 'Count: 🌼🌼🌼🌼. How many flowers?'
        options:
        - '4'
        - '3'
        - '5'
        answer: '4'
        why: '1, 2, 3, 4: the last number is 4.'
      ways:
      - style: step_by_step
        teach: 'Count the toy cars 🚙🚙🚙. First: put your finger on the first car and say one. Second: move to the next car and say two. Third: move to the last car and say three. Fourth: you stopped at three, so there are three cars.'
      - style: visual
        teach: Count the toy cars, one number for each car. The last number tells how many.
        picture:
          kind: flow
          steps:
          - 🚙 one
          - 🚙 two
          - 🚙 three
          alt: Three toy cars counted one, two, three. The last number is three, so there are three cars.
    - teach: 'One hand has 5 fingers. Show a number with your fingers: 3 means three fingers up.'
      check:
        prompt: How many fingers do you hold up to show 3?
        options:
        - '3'
        - '5'
        - '1'
        answer: '3'
        why: 'One finger for each: 1, 2, 3.'
      ways:
      - style: visual
        teach: Fingers can show numbers. Look at how many fingers are up for each number.
        picture:
          kind: bars
          bars:
          - label: one
            value: 1
          - label: two
            value: 2
          - label: three
            value: 3
          alt: Bars for one, two and three fingers. Each bar is one longer than the one before.
      - style: real_world
        teach: When someone asks your age, you can hold up your fingers to show the number.
  items:
  - prompt: How many? 🍎🍎
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Touch each apple.
    - 1, 2.
    solution: There are 2 apples.
    mistakes:
      '3': lkg_touch
  - prompt: How many? 🎈🎈🎈
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Touch each balloon.
    - 1, 2, 3.
    solution: There are 3 balloons.
    mistakes:
      '2': lkg_touch
      '4': lkg_touch
  - prompt: How many? ⭐
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Just one.
    - Count it.
    solution: There is 1 star.
    mistakes:
      '2': lkg_touch
  - prompt: How many? 🐟🐟🐟🐟🐟
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Count slowly.
    - 1, 2, 3, 4, 5.
    solution: There are 5 fish.
    mistakes:
      '4': lkg_touch
      '6': lkg_touch
  - prompt: How many fingers on one hand?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Count your fingers.
    - Thumb too!
    solution: One hand has 5 fingers.
    mistakes:
      '4': lkg_touch
  - prompt: How many? 🐥🐥🐥🐥
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Touch each chick.
    - 1, 2, 3, 4.
    solution: There are 4 chicks.
    mistakes:
      '3': lkg_touch
      '5': lkg_touch
  - prompt: 'Count: 🚗🚗🚗. How many cars?'
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Touch each car once.
    - Say a number for each.
    solution: 'Step 1: 1, 2, 3. Step 2: 3 cars.'
    mistakes:
      '2': lk2_touch
      '4': lk2_touch
  - prompt: 'Count: 🐰. How many rabbits?'
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Touch it.
    - How many touches?
    solution: 'Step 1: just one rabbit. Step 2: 1.'
    mistakes:
      '2': lk2_touch
      '0': lk2_touch
  - prompt: 'Count: 🍓🍓🍓🍓🍓. How many strawberries?'
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Touch each one once.
    - The last number tells how many.
    solution: 'Step 1: 1, 2, 3, 4, 5. Step 2: 5.'
    mistakes:
      '4': lk2_last
      '6': lk2_touch
  - prompt: Which group has 2?
    options:
    - 🦋🦋
    - 🦋🦋🦋
    - 🦋
    answer: 🦋🦋
    difficulty: 1
    hints:
    - Count each group.
    - Find the one that stops at 2.
    solution: 'Step 1: count each group. Step 2: 🦋🦋 is 2.'
    mistakes:
      🦋🦋🦋: lk2_touch
      🦋: lk2_touch
  - prompt: What comes after 3 when we count?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Say 1, 2, 3, ...
    - One more.
    solution: 'Step 1: 1, 2, 3. Step 2: next is 4.'
    mistakes:
      '2': lk2_last
      '5': lk2_last
  - prompt: Hold up 4 fingers. How many fingers are down on that hand?
    answer: '1'
    check: 5-4
    difficulty: 3
    hints:
    - One hand has 5 fingers.
    - Count the ones folded down.
    solution: 'Step 1: 5 fingers, 4 up. Step 2: 1 down.'
    mistakes:
      '4': lk2_hand
      '5': lk2_hand
  - prompt: Which group has 4?
    options:
    - 🍩🍩🍩🍩
    - 🍩🍩🍩
    - 🍩🍩🍩🍩🍩
    answer: 🍩🍩🍩🍩
    difficulty: 2
    hints:
    - Count each group with your finger.
    - Which stops at 4?
    solution: 'Step 1: 3, 4, 5 in the groups. Step 2: 🍩🍩🍩🍩 is 4.'
    mistakes:
      🍩🍩🍩: lk2_touch
      🍩🍩🍩🍩🍩: lk2_touch
  - prompt: 'Count: 🐢🐢🐢🐢. How many turtles?'
    answer: '4'
    check: '4'
    difficulty: 1
    hints:
    - Touch each turtle once.
    - 1, 2, ...
    solution: 'Step 1: 1, 2, 3, 4. Step 2: 4.'
    mistakes:
      '3': lk2_touch
      '5': lk2_touch
  - prompt: You have 2 eyes and 1 nose. How many in all?
    answer: '3'
    check: 2+1
    difficulty: 3
    hints:
    - Touch your eyes, then your nose.
    - Keep counting.
    solution: 'Step 1: eyes 1, 2. Step 2: nose 3.'
    mistakes:
      '2': lk2_last
      '1': lk2_last
  - prompt: 'Case: Asha is putting out spoons for the family. There are 3 people at the table. How many spoons does Asha need?'
    options:
    - '3'
    - '2'
    - '5'
    answer: '3'
    hints:
    - Each person needs one spoon.
    - Count the people, one by one.
    solution: One spoon for each person. 3 people need 3 spoons.
    mistakes:
      '2': lk2_touch
      '5': lk2_touch
    exam: case
    difficulty: 2
  - prompt: 'Situation: Ravi counts the ducks in a pond: 1, 2, 3, 4. Ravi stops at 4. How many ducks are there?'
    options:
    - '4'
    - '1'
    - '5'
    answer: '4'
    hints:
    - Which number did Ravi say last?
    - The last number you say tells how many.
    solution: Ravi said 4 last, so there are 4 ducks.
    mistakes:
      '1': lk2_last
      '5': lk2_last
    exam: competency
    difficulty: 2
