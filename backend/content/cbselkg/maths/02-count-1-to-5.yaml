# CBSE LKG Numbers and Shapes (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-math
chapter: 2
title: Count 1 to 5
concepts:
- code: lkgm.count5
  title: Count 1 to 5
  notes: |
    Counting objects from 1 to 5, one touch for one number; matching a group to its number.
  explanations:
    text: 'Let''s count! Touch each one and say a number: 1, 2, 3, 4, 5. The last number tells how many.'
    visual: Draw 5 balloons and write 1 to 5 under them.
    step_by_step: 'Step 1: Touch the first one, say 1. Step 2: Touch the next, say 2. Step 3: Stop at the last one.'
    real_world: 'Count your fingers on one hand: 1, 2, 3, 4, 5!'
  picture:
    kind: number_line
    from: 0
    to: 5
    step: 1
    points:
    - at: 1
      label: '1'
    - at: 2
      label: '2'
    - at: 3
      label: '3'
    - at: 4
      label: '4'
    - at: 5
      label: '5'
    alt: Counting from 1 to 5 on a number line, one hop at a time.
    jumps:
    - from: 0
      to: 1
      label: '+1'
    - from: 1
      to: 2
      label: '+1'
    - from: 2
      to: 3
      label: '+1'
    - from: 3
      to: 4
      label: '+1'
    - from: 4
      to: 5
      label: '+1'
  activity:
    type: number_line
    min: 0
    max: 5
    step: 1
    start: 0
    prompt: Touch each one and count. Move to how many.
    goals:
    - prompt: 🍎🍎🍎
      target: 3
      mistakes:
      - when:
          v: 2
        say: 'Touch each apple once and say a number: 1, 2, 3. One was missed.'
      - when:
          v: 4
        say: One apple was counted two times. Touch each apple only once.
    - prompt: ⭐⭐⭐⭐⭐
      target: 5
      mistakes:
      - when:
          v: 4
        say: 'Count again, touching each star: 1, 2, 3, 4, 5. The last one was missed.'
    - prompt: 🐟🐟
      target: 2
      mistakes:
      - when:
          v: 1
        say: 'There is another fish. Touch each one: 1, 2.'
      - when:
          v: 3
        say: 'Touch each fish only once: 1, 2.'
  items:
  - prompt: How many? 🍎🍎
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Touch each apple.
    - 1, 2.
    solution: There are 2 apples.
    mistakes:
      '3': lkg_touch
  - prompt: How many? 🎈🎈🎈
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Touch each balloon.
    - 1, 2, 3.
    solution: There are 3 balloons.
    mistakes:
      '2': lkg_touch
      '4': lkg_touch
  - prompt: How many? ⭐
    answer: '1'
    check: '1'
    difficulty: 1
    hints:
    - Just one.
    - Count it.
    solution: There is 1 star.
    mistakes:
      '2': lkg_touch
  - prompt: How many? 🐟🐟🐟🐟🐟
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Count slowly.
    - 1, 2, 3, 4, 5.
    solution: There are 5 fish.
    mistakes:
      '4': lkg_touch
      '6': lkg_touch
  - prompt: How many fingers on one hand?
    answer: '5'
    check: '5'
    difficulty: 2
    hints:
    - Count your fingers.
    - Thumb too!
    solution: One hand has 5 fingers.
    mistakes:
      '4': lkg_touch
  - prompt: How many? 🐥🐥🐥🐥
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - Touch each chick.
    - 1, 2, 3, 4.
    solution: There are 4 chicks.
    mistakes:
      '3': lkg_touch
      '5': lkg_touch
