# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 8
title: Rhymes and Little Words
concepts:
- code: lkge.rhyme
  title: Rhymes and Little Words
  notes: |
    Hearing rhyme (cat-hat, sun-bun), first words: names of family, body parts, colours; listening and saying.
  explanations:
    text: 'Words that rhyme sound the same at the end: cat, hat, bat. Rhymes make songs fun to sing.'
    visual: Draw a cat wearing a hat holding a bat.
    step_by_step: 'Step 1: Say both words. Step 2: Listen to the ending. Step 3: Same ending? They rhyme!'
    real_world: 'Nursery rhymes like ''Twinkle twinkle little star'' use rhyming words: star, are.'
  picture:
    kind: flow
    steps:
    - cat
    - hat
    - bat
    - mat
    alt: 'Words that rhyme: cat, hat, bat, mat.'
  activity:
    type: sort
    prompt: Which one rhymes?
    bins:
    - cat
    - sun
    - bed
    items:
    - label: 🎩 hat
      bin: cat
      clue: Say it, then say each word on the cards. Which ends the same?
      why: hat and cat end in -at.
    - label: 🍞 bun
      bin: sun
      clue: 'Listen to the ending: -un.'
      why: bun and sun end in -un.
    - label: 🔴 red
      bin: bed
      clue: 'Listen to the ending: -ed.'
      why: red and bed end in -ed.
    - label: 🐀 rat
      bin: cat
      clue: 'Listen to the ending: -at.'
      why: rat and cat end in -at.
  items:
  - prompt: Which rhymes with cat?
    options:
    - 🎩 hat
    - 🐶 dog
    - ☀️ sun
    answer: 🎩 hat
    difficulty: 1
    hints:
    - Same ending -at.
    - Say them aloud.
    solution: Cat and hat rhyme.
    mistakes:
      🐶 dog: lkge_sound
  - prompt: Which rhymes with sun?
    options:
    - 🍞 bun
    - 🌙 moon
    - ⭐ star
    answer: 🍞 bun
    difficulty: 1
    hints:
    - Same ending -un.
    - Say them aloud.
    solution: Sun and bun rhyme.
    mistakes:
      🌙 moon: lkge_sound
  - prompt: Which rhymes with star?
    options:
    - 🚗 car
    - 🐟 fish
    - 🍎 apple
    answer: 🚗 car
    difficulty: 2
    hints:
    - Same ending -ar.
    - Twinkle twinkle ...
    solution: Star and car rhyme.
  - prompt: Which rhymes with frog?
    options:
    - 🐶 dog
    - 🐱 cat
    - 🐄 cow
    answer: 🐶 dog
    difficulty: 2
    hints:
    - Same ending -og.
    - Say them aloud.
    solution: Frog and dog rhyme.
  - prompt: 'We see with our:'
    options:
    - 👀 eyes
    - 👂 ears
    - 👃 nose
    answer: 👀 eyes
    difficulty: 1
    hints:
    - Two of them on your face.
    - Open and close them.
    solution: We see with our eyes.
  - prompt: Which word is a colour?
    options:
    - red
    - run
    - rat
    answer: red
    difficulty: 2
    hints:
    - Like an apple.
    - Not an animal.
    solution: Red is a colour.
