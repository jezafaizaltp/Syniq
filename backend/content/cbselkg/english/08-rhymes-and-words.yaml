# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 8. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 8
title: Rhymes and Little Words
tips:
  kg_body_job: "Cover that part with your hand. What can you not do now?"
  kg_colour_word: "All three start with r. Which one could be the colour of a crayon?"
  kg_rhyme: "Rhyming words sound the same at the end. Say both words. Do the ends match?"
  lk8e_rhyme: Say both words and listen to the end. Do they sound the same at the end?
  lk8e_body: Point to that part of your body. What does it help you do?
  lk8e_kind: Is this word a colour, a body part, a family member or something else?

concepts:
- code: lkge.rhyme
  title: Rhymes and Little Words
  notes: |
    Hearing rhyme (cat-hat, sun-bun), first words: names of family, body parts, colours; listening and saying.
  explanations:
    text: 'Words that rhyme sound the same at the end: cat, hat, bat. Rhymes make songs fun to sing.'
    visual: Draw a cat wearing a hat holding a bat.
    step_by_step: 'Step 1: Say both words. Step 2: Listen to the ending. Step 3: Same ending? They rhyme!'
    real_world: 'Nursery rhymes like ''Twinkle twinkle little star'' use rhyming words: star, are.'
  picture:
    kind: flow
    steps:
    - cat
    - hat
    - bat
    - mat
    alt: 'Words that rhyme: cat, hat, bat, mat.'
  activity:
    type: sort
    prompt: Which one rhymes?
    bins:
    - cat
    - sun
    - bed
    items:
    - label: 🎩 hat
      bin: cat
      clue: Say it, then say each word on the cards. Which ends the same?
      why: hat and cat end in -at.
    - label: 🍞 bun
      bin: sun
      clue: 'Listen to the ending: -un.'
      why: bun and sun end in -un.
    - label: 🔴 red
      bin: bed
      clue: 'Listen to the ending: -ed.'
      why: red and bed end in -ed.
    - label: 🐀 rat
      bin: cat
      clue: 'Listen to the ending: -at.'
      why: rat and cat end in -at.
  lesson:
    - teach: 'Rhyming words sound the same at the end: cat, hat, mat; sun, bun, fun. Say them like a song!'
      check:
        prompt: Which word rhymes with 'bee'?
        options:
        - tree
        - bus
        - cup
        answer: tree
        why: B-ee and tr-ee end the same.
    - teach: 'Body words: eyes 👀 to see, ears 👂 to hear, nose 👃 to smell, mouth 👄 to eat and talk, hands ✋ to hold, legs 🦵 to walk.'
      picture:
        kind: compare
        columns:
        - title: Body part
          points:
          - eyes
          - ears
          - nose
        - title: Job
          points:
          - see
          - hear
          - smell
        alt: Body parts and what they do.
      check:
        prompt: 'We hear with our:'
        options:
        - 👂 ears
        - 👃 nose
        - 🦵 legs
        answer: 👂 ears
        why: Ears catch sounds.
    - teach: 'Family words: mother, father, sister, brother, grandmother, grandfather. Colour words: red, blue, green, yellow.'
      check:
        prompt: Which word is a family word?
        options:
        - grandmother
        - green
        - glass
        answer: grandmother
        why: Grandmother is someone in a family.
  items:
  - prompt: Which rhymes with cat?
    options:
    - 🎩 hat
    - 🐶 dog
    - ☀️ sun
    answer: 🎩 hat
    difficulty: 1
    hints:
    - Same ending -at.
    - Say them aloud.
    solution: Cat and hat rhyme.
    mistakes:
      🐶 dog: lkge_sound
  - prompt: Which rhymes with sun?
    options:
    - 🍞 bun
    - 🌙 moon
    - ⭐ star
    answer: 🍞 bun
    difficulty: 1
    hints:
    - Same ending -un.
    - Say them aloud.
    solution: Sun and bun rhyme.
    mistakes:
      🌙 moon: lkge_sound
  - prompt: Which rhymes with star?
    options:
    - 🚗 car
    - 🐟 fish
    - 🍎 apple
    answer: 🚗 car
    difficulty: 2
    hints:
    - Same ending -ar.
    - Twinkle twinkle ...
    solution: Star and car rhyme.
    mistakes: {"🐟 fish": "kg_rhyme", "🍎 apple": "kg_rhyme"}
  - prompt: Which rhymes with frog?
    options:
    - 🐶 dog
    - 🐱 cat
    - 🐄 cow
    answer: 🐶 dog
    difficulty: 2
    hints:
    - Same ending -og.
    - Say them aloud.
    solution: Frog and dog rhyme.
    mistakes: {"🐱 cat": "kg_rhyme", "🐄 cow": "kg_rhyme"}
  - prompt: 'We see with our:'
    options:
    - 👀 eyes
    - 👂 ears
    - 👃 nose
    answer: 👀 eyes
    difficulty: 1
    hints:
    - Two of them on your face.
    - Open and close them.
    solution: We see with our eyes.
    mistakes: {"👂 ears": "kg_body_job", "👃 nose": "kg_body_job"}
  - prompt: Which word is a colour?
    options:
    - red
    - run
    - rat
    answer: red
    difficulty: 2
    hints:
    - Like an apple.
    - Not an animal.
    solution: Red is a colour.
    mistakes: {"run": "kg_colour_word", "rat": "kg_colour_word"}
  - prompt: Which word rhymes with 'pan'?
    options:
    - 🚐 van
    - 🐷 pig
    - ☀️ sun
    answer: 🚐 van
    difficulty: 1
    hints:
    - Say the end of each word.
    - -an
    solution: 'Step 1: p-an. Step 2: v-an rhymes.'
    mistakes:
      🐷 pig: lk8e_rhyme
      ☀️ sun: lk8e_rhyme
  - prompt: 'We smell with our:'
    options:
    - 👃 nose
    - 👀 eyes
    - ✋ hands
    answer: 👃 nose
    difficulty: 1
    hints:
    - Sniff a flower.
    - It is in the middle of your face.
    solution: 'Step 1: smelling uses air we breathe in. Step 2: nose.'
    mistakes:
      👀 eyes: lk8e_body
      ✋ hands: lk8e_body
  - prompt: Which word rhymes with 'bed'?
    options:
    - red
    - bag
    - bus
    answer: red
    difficulty: 2
    hints:
    - Say the end of each word.
    - -ed
    solution: 'Step 1: b-ed. Step 2: r-ed rhymes.'
    mistakes:
      bag: lk8e_rhyme
      bus: lk8e_rhyme
  - prompt: Pick the colour word.
    options:
    - blue
    - ball
    - baby
    answer: blue
    difficulty: 1
    hints:
    - Which word tells how something looks, like the sky?
    - Not a thing, not a person.
    solution: 'Step 1: ball is a toy, baby is a person. Step 2: blue is a colour.'
    mistakes:
      ball: lk8e_kind
      baby: lk8e_kind
  - prompt: 'We walk with our:'
    options:
    - 🦵 legs
    - 👂 ears
    - 👃 nose
    answer: 🦵 legs
    difficulty: 1
    hints:
    - Which part touches the ground?
    - Left, right, left, right.
    solution: 'Step 1: walking needs feet and legs. Step 2: legs.'
    mistakes:
      👂 ears: lk8e_body
      👃 nose: lk8e_body
  - prompt: Which word does NOT rhyme with 'cake'?
    options:
    - cup
    - lake
    - snake
    answer: cup
    difficulty: 3
    hints:
    - Rhymes end in -ake.
    - Say each one's end.
    solution: 'Step 1: lake and snake end in -ake. Step 2: cup does not.'
    mistakes:
      lake: lk8e_rhyme
      snake: lk8e_rhyme
  - prompt: Which word is a body part?
    options:
    - hand
    - hat
    - hen
    answer: hand
    difficulty: 2
    hints:
    - Look at yourself.
    - You wave with it.
    solution: 'Step 1: hat is clothing, hen is a bird. Step 2: hand is a body part.'
    mistakes:
      hat: lk8e_kind
      hen: lk8e_kind
  - prompt: Which word rhymes with 'fish'?
    options:
    - dish
    - fan
    - fox
    answer: dish
    difficulty: 2
    hints:
    - Say the end of each word.
    - -ish
    solution: 'Step 1: f-ish. Step 2: d-ish rhymes.'
    mistakes:
      fan: lk8e_rhyme
      fox: lk8e_rhyme
  - prompt: 'Mother''s mother is called:'
    options:
    - grandmother
    - sister
    - aunty next door
    answer: grandmother
    difficulty: 3
    hints:
    - Think of the family tree.
    - Your mother's mummy.
    solution: 'Step 1: one step up from mother. Step 2: grandmother.'
    mistakes:
      sister: lk8e_kind
      aunty next door: lk8e_kind
