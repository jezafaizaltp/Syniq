# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 1
title: Letters A, B, C, D
tips:
  lkge_sound: Say the word slowly. Listen to the very first sound.
  lkge_look: Look at the picture again and say its name aloud.
  lk1e_first: Say the word slowly and listen only to the very first sound.
  lk1e_look: Look at the letter's shape carefully and trace it in the air with your finger.
concepts:
- code: lkge.ad
  title: Letters A, B, C, D
  notes: |
    Letters A, B, C, D, A, B: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. A for apple 🍎. B for ball ⚽. C for cat 🐱. D for dog 🐶. A for ant 🐜. B for bus 🚌.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - A
      - B
      - C
    - title: Word
      points:
      - apple 🍎
      - ball ⚽
      - cat 🐱
    alt: A for apple 🍎, B for ball ⚽, C for cat 🐱.
  activity:
    type: sort
    prompt: Which letter does it start with?
    bins:
    - A
    - B
    - C
    - D
    items:
    - label: 🍎 apple
      bin: A
      clue: Say the word slowly. What is the very first sound?
      why: apple starts with a.
    - label: ⚽ ball
      bin: B
      clue: Say the word slowly. What is the very first sound?
      why: ball starts with b.
    - label: 🐱 cat
      bin: C
      clue: Say the word slowly. What is the very first sound?
      why: cat starts with c.
    - label: 🐶 dog
      bin: D
      clue: Say the word slowly. What is the very first sound?
      why: dog starts with d.
  lesson:
    - teach: Letters have names and sounds. A is for alligator 🐊. B is for bear 🐻. Say each word slowly and hear the first sound.
      check:
        prompt: Which word starts with the sound of B?
        options:
        - 🐻 bear
        - 🐄 cow
        - 🦆 duck
        answer: 🐻 bear
        why: 'Say bear slowly: the first sound is B.'
    - teach: 'More letters: C is for cow 🐄. D is for duck 🦆.'
      check:
        prompt: Which word starts with the sound of C?
        options:
        - 🐄 cow
        - 🐻 bear
        - 🐊 alligator
        answer: 🐄 cow
        why: 'Say cow slowly: the first sound is C.'
    - teach: 'Each letter has a big shape and a small shape: A a, B b, C c, D d. Big letters are also called capital letters.'
      check:
        prompt: Which is the small letter for D?
        options:
        - d
        - a
        - c
        answer: d
        why: Big D and small d are the same letter.
  items:
  - prompt: Which begins with A?
    options:
    - 🍎 apple
    - 🐝 bee
    - 🐱 cat
    answer: 🍎 apple
    difficulty: 1
    hints:
    - Say each word. Which starts with the A sound?
    - A says /a/.
    solution: Apple begins with A.
    mistakes:
      🐝 bee: lkge_sound
  - prompt: Which begins with B?
    options:
    - ⚽ ball
    - 🐶 dog
    - 🍎 apple
    answer: ⚽ ball
    difficulty: 1
    hints:
    - Say each word. Which starts with the B sound?
    - B says /b/.
    solution: Ball begins with B.
    mistakes:
      🐶 dog: lkge_sound
  - prompt: Which begins with C?
    options:
    - 🐱 cat
    - 🐟 fish
    - ⚽ ball
    answer: 🐱 cat
    difficulty: 1
    hints:
    - Say each word. Which starts with the C sound?
    - C says /c/.
    solution: Cat begins with C.
    mistakes:
      🐟 fish: lkge_sound
  - prompt: Which begins with D?
    options:
    - 🐶 dog
    - 🐱 cat
    - 🥚 egg
    answer: 🐶 dog
    difficulty: 2
    hints:
    - Say each word. Which starts with the D sound?
    - D says /d/.
    solution: Dog begins with D.
    mistakes:
      🐱 cat: lkge_sound
  - prompt: Find another word that begins with A.
    options:
    - 🐜 ant
    - 🐄 cow
    - 🦆 duck
    answer: 🐜 ant
    difficulty: 2
    hints:
    - Say each word. Which starts with the A sound?
    - A says /a/.
    solution: Ant begins with A.
    mistakes:
      🐄 cow: lkge_sound
  - prompt: Find another word that begins with B.
    options:
    - 🚌 bus
    - 🍎 apple
    - 🐱 cat
    answer: 🚌 bus
    difficulty: 2
    hints:
    - Say each word. Which starts with the B sound?
    - B says /b/.
    solution: Bus begins with B.
    mistakes:
      🍎 apple: lkge_sound
  - prompt: Which picture starts with A?
    options:
    - 🚑 ambulance
    - 🍌 banana
    - 🥕 carrot
    answer: 🚑 ambulance
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say ambulance. Step 2: it starts with A.'
    mistakes:
      🍌 banana: lk1e_first
      🥕 carrot: lk1e_first
  - prompt: Which picture starts with B?
    options:
    - 🍌 banana
    - 🚑 ambulance
    - 🥁 drum
    answer: 🍌 banana
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say banana. Step 2: it starts with B.'
    mistakes:
      🚑 ambulance: lk1e_first
      🥁 drum: lk1e_first
  - prompt: Which picture starts with C?
    options:
    - 🥕 carrot
    - 🥁 drum
    - 🍌 banana
    answer: 🥕 carrot
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say carrot. Step 2: it starts with C.'
    mistakes:
      🥁 drum: lk1e_first
      🍌 banana: lk1e_first
  - prompt: Which picture starts with D?
    options:
    - 🥁 drum
    - 🚑 ambulance
    - 🥕 carrot
    answer: 🥁 drum
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say drum. Step 2: it starts with D.'
    mistakes:
      🚑 ambulance: lk1e_first
      🥕 carrot: lk1e_first
  - prompt: 🐊 alligator starts with which letter?
    options:
    - A
    - B
    - C
    answer: A
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: alligator starts with the A sound. Step 2: A.'
    mistakes:
      B: lk1e_look
      C: lk1e_look
  - prompt: 🐻 bear starts with which letter?
    options:
    - B
    - A
    - C
    answer: B
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: bear starts with the B sound. Step 2: B.'
    mistakes:
      A: lk1e_look
      C: lk1e_look
  - prompt: 🐄 cow starts with which letter?
    options:
    - C
    - A
    - D
    answer: C
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: cow starts with the C sound. Step 2: C.'
    mistakes:
      A: lk1e_look
      D: lk1e_look
  - prompt: 🦆 duck starts with which letter?
    options:
    - D
    - B
    - C
    answer: D
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: duck starts with the D sound. Step 2: D.'
    mistakes:
      B: lk1e_look
      C: lk1e_look
  - prompt: Which small letter matches big D? Look carefully.
    options:
    - d
    - b
    - p
    answer: d
    difficulty: 3
    hints:
    - Some small letters look like mirror twins.
    - Trace each one in the air and check which way it faces.
    solution: 'Step 1: big D and small d are the same letter. Step 2: d.'
    mistakes:
      b: lk1e_look
      p: lk1e_look
