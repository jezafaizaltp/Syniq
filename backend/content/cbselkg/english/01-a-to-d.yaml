# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 1
title: Letters A, B, C, D
tips:
  lkge_sound: Say the word slowly. Listen to the very first sound.
  lkge_look: Look at the picture again and say its name aloud.
concepts:
- code: lkge.ad
  title: Letters A, B, C, D
  notes: |
    Letters A, B, C, D, A, B: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. A for apple 🍎. B for ball ⚽. C for cat 🐱. D for dog 🐶. A for ant 🐜. B for bus 🚌.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - A
      - B
      - C
    - title: Word
      points:
      - apple 🍎
      - ball ⚽
      - cat 🐱
    alt: A for apple 🍎, B for ball ⚽, C for cat 🐱.
  activity:
    type: sort
    prompt: Which letter does it start with?
    bins:
    - A
    - B
    - C
    - D
    items:
    - label: 🍎 apple
      bin: A
      clue: Say the word slowly. What is the very first sound?
      why: apple starts with a.
    - label: ⚽ ball
      bin: B
      clue: Say the word slowly. What is the very first sound?
      why: ball starts with b.
    - label: 🐱 cat
      bin: C
      clue: Say the word slowly. What is the very first sound?
      why: cat starts with c.
    - label: 🐶 dog
      bin: D
      clue: Say the word slowly. What is the very first sound?
      why: dog starts with d.
  items:
  - prompt: Which begins with A?
    options:
    - 🍎 apple
    - 🐝 bee
    - 🐱 cat
    answer: 🍎 apple
    difficulty: 1
    hints:
    - Say each word. Which starts with the A sound?
    - A says /a/.
    solution: Apple begins with A.
    mistakes:
      🐝 bee: lkge_sound
  - prompt: Which begins with B?
    options:
    - ⚽ ball
    - 🐶 dog
    - 🍎 apple
    answer: ⚽ ball
    difficulty: 1
    hints:
    - Say each word. Which starts with the B sound?
    - B says /b/.
    solution: Ball begins with B.
    mistakes:
      🐶 dog: lkge_sound
  - prompt: Which begins with C?
    options:
    - 🐱 cat
    - 🐟 fish
    - ⚽ ball
    answer: 🐱 cat
    difficulty: 1
    hints:
    - Say each word. Which starts with the C sound?
    - C says /c/.
    solution: Cat begins with C.
    mistakes:
      🐟 fish: lkge_sound
  - prompt: Which begins with D?
    options:
    - 🐶 dog
    - 🐱 cat
    - 🥚 egg
    answer: 🐶 dog
    difficulty: 2
    hints:
    - Say each word. Which starts with the D sound?
    - D says /d/.
    solution: Dog begins with D.
    mistakes:
      🐱 cat: lkge_sound
  - prompt: Find another word that begins with A.
    options:
    - 🐜 ant
    - 🐄 cow
    - 🦆 duck
    answer: 🐜 ant
    difficulty: 2
    hints:
    - Say each word. Which starts with the A sound?
    - A says /a/.
    solution: Ant begins with A.
    mistakes:
      🐄 cow: lkge_sound
  - prompt: Find another word that begins with B.
    options:
    - 🚌 bus
    - 🍎 apple
    - 🐱 cat
    answer: 🚌 bus
    difficulty: 2
    hints:
    - Say each word. Which starts with the B sound?
    - B says /b/.
    solution: Bus begins with B.
    mistakes:
      🍎 apple: lkge_sound
