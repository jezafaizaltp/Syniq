# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 4
title: Letters M, N, O, P
tips:
  lk4e_first: Say the word slowly and listen only to the very first sound.
  lk4e_look: Look at the letter's shape carefully and trace it in the air with your finger.
concepts:
- code: lkge.mp
  title: Letters M, N, O, P
  notes: |
    Letters M, N, O, P, M, P: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. M for mango 🥭. N for nest 🪺. O for owl 🦉. P for parrot 🦜. M for moon 🌙. P for pen 🖊️.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - M
      - N
      - O
    - title: Word
      points:
      - mango 🥭
      - nest 🪺
      - owl 🦉
    alt: M for mango 🥭, N for nest 🪺, O for owl 🦉.
  activity:
    type: sort
    prompt: Which letter does it start with?
    bins:
    - M
    - N
    - O
    - P
    items:
    - label: 🥭 mango
      bin: M
      clue: Say the word slowly. What is the very first sound?
      why: mango starts with m.
    - label: 🪺 nest
      bin: N
      clue: Say the word slowly. What is the very first sound?
      why: nest starts with n.
    - label: 🐙 octopus
      bin: O
      clue: Say the word slowly. What is the very first sound?
      why: octopus starts with o.
    - label: 🦜 parrot
      bin: P
      clue: Say the word slowly. What is the very first sound?
      why: parrot starts with p.
  lesson:
    - teach: Letters have names and sounds. M is for monkey 🐒. N is for nose 👃. Say each word slowly and hear the first sound.
      check:
        prompt: Which word starts with the sound of N?
        options:
        - 👃 nose
        - 🐼 panda
        - 🐙 octopus
        answer: 👃 nose
        why: 'Say nose slowly: the first sound is N.'
      ways:
      - style: visual
        teach: More words for the letters M and N. Say each word and hear the first sound.
        picture:
          kind: compare
          columns:
          - title: Letter
            points:
            - M
            - N
          - title: Word
            points:
            - 🥛 milk
            - 🥅 net
          - title: Another word
            points:
            - 🗺️ map
            - 9️⃣ nine
          alt: M is for milk and map. N is for net and nine.
      - style: step_by_step
        teach: 'Hear the first sound. First: say the word milk slowly. Second: stop after the very first sound. Third: say that sound again by itself. Fourth: that sound belongs to the letter M.'
    - teach: 'More letters: O is for octopus 🐙. P is for panda 🐼.'
      check:
        prompt: Which word starts with the sound of O?
        options:
        - 🐙 octopus
        - 🐒 monkey
        - 👃 nose
        answer: 🐙 octopus
        why: 'Say octopus slowly: the first sound is O.'
      ways:
      - style: visual
        teach: More words for the letters O and P. Point to each picture and say its first sound.
        picture:
          kind: compare
          columns:
          - title: Letter
            points:
            - O
            - P
          - title: Word
            points:
            - 🐂 ox
            - 🐖 pig
          - title: Another word
            points:
            - 🦦 otter
            - 🍲 pot
          alt: O is for ox and otter. P is for pig and pot.
      - style: real_world
        teach: Look around your home or school for things that start with O and P, and say each first sound out loud to a grown-up.
    - teach: 'Each letter has a big shape and a small shape: M m, N n, O o, P p. Big letters are also called capital letters.'
      check:
        prompt: Which is the small letter for P?
        options:
        - p
        - m
        - o
        answer: p
        why: Big P and small p are the same letter.
      ways:
      - style: visual
        teach: Each big letter with its small letter, side by side. They have the same name.
        picture:
          kind: compare
          columns:
          - title: Big
            points:
            - M
            - N
            - O
            - P
          - title: Small
            points:
            - m
            - n
            - o
            - p
          alt: Big M goes with small m. Big N goes with small n. Big O goes with small o. Big P goes with small p.
      - style: step_by_step
        teach: 'Write a letter in the air. First: hold up one finger. Second: draw a big N in the air. Third: draw a small n next to it. Fourth: say the letter''s name for both shapes.'
  items:
  - prompt: Which begins with M?
    options:
    - 🥭 mango
    - 🪺 nest
    - 🦉 owl
    answer: 🥭 mango
    difficulty: 1
    hints:
    - Say each word. Which starts with the M sound?
    - M says /m/.
    solution: Mango begins with M.
    mistakes:
      🪺 nest: lkge_sound
  - prompt: Which begins with N?
    options:
    - 🪺 nest
    - 🥭 mango
    - 🦜 parrot
    answer: 🪺 nest
    difficulty: 1
    hints:
    - Say each word. Which starts with the N sound?
    - N says /n/.
    solution: Nest begins with N.
    mistakes:
      🥭 mango: lkge_sound
  - prompt: Which begins with O?
    options:
    - 🦉 owl
    - 🦜 parrot
    - 🪺 nest
    answer: 🦉 owl
    difficulty: 1
    hints:
    - Say each word. Which starts with the O sound?
    - O says /o/.
    solution: Owl begins with O.
    mistakes:
      🦜 parrot: lkge_sound
  - prompt: Which begins with P?
    options:
    - 🦜 parrot
    - 🦉 owl
    - 🥭 mango
    answer: 🦜 parrot
    difficulty: 2
    hints:
    - Say each word. Which starts with the P sound?
    - P says /p/.
    solution: Parrot begins with P.
    mistakes:
      🦉 owl: lkge_sound
  - prompt: Find another word that begins with M.
    options:
    - 🌙 moon
    - 🦉 owl
    - 🦜 parrot
    answer: 🌙 moon
    difficulty: 2
    hints:
    - Say each word. Which starts with the M sound?
    - M says /m/.
    solution: Moon begins with M.
    mistakes:
      🦉 owl: lkge_sound
  - prompt: Find another word that begins with P.
    options:
    - 🖊️ pen
    - 🌙 moon
    - 🪺 nest
    answer: 🖊️ pen
    difficulty: 2
    hints:
    - Say each word. Which starts with the P sound?
    - P says /p/.
    solution: Pen begins with P.
    mistakes:
      🌙 moon: lkge_sound
  - prompt: Which picture starts with M?
    options:
    - 🐭 mouse
    - 🥜 nut
    - 🍊 orange
    answer: 🐭 mouse
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say mouse. Step 2: it starts with M.'
    mistakes:
      🥜 nut: lk4e_first
      🍊 orange: lk4e_first
  - prompt: Which picture starts with N?
    options:
    - 🥜 nut
    - 🍊 orange
    - 🐭 mouse
    answer: 🥜 nut
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say nut. Step 2: it starts with N.'
    mistakes:
      🍊 orange: lk4e_first
      🐭 mouse: lk4e_first
  - prompt: Which picture starts with O?
    options:
    - 🍊 orange
    - 🍍 pineapple
    - 🐭 mouse
    answer: 🍊 orange
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say orange. Step 2: it starts with O.'
    mistakes:
      🍍 pineapple: lk4e_first
      🐭 mouse: lk4e_first
  - prompt: Which picture starts with P?
    options:
    - 🍍 pineapple
    - 🥜 nut
    - 🐭 mouse
    answer: 🍍 pineapple
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say pineapple. Step 2: it starts with P.'
    mistakes:
      🥜 nut: lk4e_first
      🐭 mouse: lk4e_first
  - prompt: 🐒 monkey starts with which letter?
    options:
    - M
    - O
    - P
    answer: M
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: monkey starts with the M sound. Step 2: M.'
    mistakes:
      O: lk4e_look
      P: lk4e_look
  - prompt: 👃 nose starts with which letter?
    options:
    - N
    - M
    - O
    answer: N
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: nose starts with the N sound. Step 2: N.'
    mistakes:
      M: lk4e_look
      O: lk4e_look
  - prompt: 🐙 octopus starts with which letter?
    options:
    - O
    - N
    - P
    answer: O
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: octopus starts with the O sound. Step 2: O.'
    mistakes:
      N: lk4e_look
      P: lk4e_look
  - prompt: 🐼 panda starts with which letter?
    options:
    - P
    - N
    - M
    answer: P
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: panda starts with the P sound. Step 2: P.'
    mistakes:
      N: lk4e_look
      M: lk4e_look
  - prompt: Which small letter matches big P? Look carefully.
    options:
    - p
    - q
    - b
    answer: p
    difficulty: 3
    hints:
    - Some small letters look like mirror twins.
    - Trace each one in the air and check which way it faces.
    solution: 'Step 1: big P and small p are the same letter. Step 2: p.'
    mistakes:
      q: lk4e_look
      b: lk4e_look
  - prompt: 'Case: Grandma is thirsty and asks for a drink that starts with M. What should Riya bring?'
    options:
    - 🥛 milk
    - 💧 water
    - 🧃 juice
    answer: 🥛 milk
    hints:
    - Say each word slowly.
    - Which one starts with the sound of monkey?
    solution: Milk starts with the m sound, like monkey.
    mistakes:
      💧 water: lk4e_first
      🧃 juice: lk4e_first
    exam: case
    difficulty: 2
  - prompt: 'Situation: The class is matching letters. Which small letter goes with big M?'
    options:
    - m
    - n
    - w
    answer: m
    hints:
    - Trace big M in the air.
    - Which small letter has two humps?
    solution: Small m has two humps, and it goes with big M.
    mistakes:
      n: lk4e_look
      w: lk4e_look
    exam: competency
    difficulty: 2
