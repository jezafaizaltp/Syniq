# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 4
title: Letters M, N, O, P
concepts:
- code: lkge.mp
  title: Letters M, N, O, P
  notes: |
    Letters M, N, O, P, M, P: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. M for mango 🥭. N for nest 🪺. O for owl 🦉. P for parrot 🦜. M for moon 🌙. P for pen 🖊️.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - M
      - N
      - O
    - title: Word
      points:
      - mango 🥭
      - nest 🪺
      - owl 🦉
    alt: M for mango 🥭, N for nest 🪺, O for owl 🦉.
  activity:
    type: sort
    prompt: Which letter does it start with?
    bins:
    - M
    - N
    - O
    - P
    items:
    - label: 🥭 mango
      bin: M
      clue: Say the word slowly. What is the very first sound?
      why: mango starts with m.
    - label: 🪺 nest
      bin: N
      clue: Say the word slowly. What is the very first sound?
      why: nest starts with n.
    - label: 🐙 octopus
      bin: O
      clue: Say the word slowly. What is the very first sound?
      why: octopus starts with o.
    - label: 🦜 parrot
      bin: P
      clue: Say the word slowly. What is the very first sound?
      why: parrot starts with p.
  items:
  - prompt: Which begins with M?
    options:
    - 🥭 mango
    - 🪺 nest
    - 🦉 owl
    answer: 🥭 mango
    difficulty: 1
    hints:
    - Say each word. Which starts with the M sound?
    - M says /m/.
    solution: Mango begins with M.
    mistakes:
      🪺 nest: lkge_sound
  - prompt: Which begins with N?
    options:
    - 🪺 nest
    - 🥭 mango
    - 🦜 parrot
    answer: 🪺 nest
    difficulty: 1
    hints:
    - Say each word. Which starts with the N sound?
    - N says /n/.
    solution: Nest begins with N.
    mistakes:
      🥭 mango: lkge_sound
  - prompt: Which begins with O?
    options:
    - 🦉 owl
    - 🦜 parrot
    - 🪺 nest
    answer: 🦉 owl
    difficulty: 1
    hints:
    - Say each word. Which starts with the O sound?
    - O says /o/.
    solution: Owl begins with O.
    mistakes:
      🦜 parrot: lkge_sound
  - prompt: Which begins with P?
    options:
    - 🦜 parrot
    - 🦉 owl
    - 🥭 mango
    answer: 🦜 parrot
    difficulty: 2
    hints:
    - Say each word. Which starts with the P sound?
    - P says /p/.
    solution: Parrot begins with P.
    mistakes:
      🦉 owl: lkge_sound
  - prompt: Find another word that begins with M.
    options:
    - 🌙 moon
    - 🦉 owl
    - 🦜 parrot
    answer: 🌙 moon
    difficulty: 2
    hints:
    - Say each word. Which starts with the M sound?
    - M says /m/.
    solution: Moon begins with M.
    mistakes:
      🦉 owl: lkge_sound
  - prompt: Find another word that begins with P.
    options:
    - 🖊️ pen
    - 🌙 moon
    - 🪺 nest
    answer: 🖊️ pen
    difficulty: 2
    hints:
    - Say each word. Which starts with the P sound?
    - P says /p/.
    solution: Pen begins with P.
    mistakes:
      🌙 moon: lkge_sound
