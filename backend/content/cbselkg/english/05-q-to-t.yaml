# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 5
title: Letters Q, R, S, T
concepts:
- code: lkge.qt
  title: Letters Q, R, S, T
  notes: |
    Letters Q, R, S, T, R, S: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. Q for queen 👸. R for rat 🐀. S for sun ☀️. T for tiger 🐯. R for rainbow 🌈. S for star ⭐.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - Q
      - R
      - S
    - title: Word
      points:
      - queen 👸
      - rat 🐀
      - sun ☀️
    alt: Q for queen 👸, R for rat 🐀, S for sun ☀️.
  activity:
    type: sort
    prompt: Which letter does it start with?
    bins:
    - Q
    - R
    - S
    - T
    items:
    - label: 👑 queen
      bin: Q
      clue: Say the word slowly. What is the very first sound?
      why: queen starts with q.
    - label: 🐇 rabbit
      bin: R
      clue: Say the word slowly. What is the very first sound?
      why: rabbit starts with r.
    - label: ☀️ sun
      bin: S
      clue: Say the word slowly. What is the very first sound?
      why: sun starts with s.
    - label: 🐯 tiger
      bin: T
      clue: Say the word slowly. What is the very first sound?
      why: tiger starts with t.
  items:
  - prompt: Which begins with Q?
    options:
    - 👸 queen
    - 🐀 rat
    - ☀️ sun
    answer: 👸 queen
    difficulty: 1
    hints:
    - Say each word. Which starts with the Q sound?
    - Q says /q/.
    solution: Queen begins with Q.
    mistakes:
      🐀 rat: lkge_sound
  - prompt: Which begins with R?
    options:
    - 🐀 rat
    - ☀️ sun
    - 🐯 tiger
    answer: 🐀 rat
    difficulty: 1
    hints:
    - Say each word. Which starts with the R sound?
    - R says /r/.
    solution: Rat begins with R.
    mistakes:
      ☀️ sun: lkge_sound
  - prompt: Which begins with S?
    options:
    - ☀️ sun
    - 🐯 tiger
    - 🐀 rat
    answer: ☀️ sun
    difficulty: 1
    hints:
    - Say each word. Which starts with the S sound?
    - S says /s/.
    solution: Sun begins with S.
    mistakes:
      🐯 tiger: lkge_sound
  - prompt: Which begins with T?
    options:
    - 🐯 tiger
    - ☀️ sun
    - 👸 queen
    answer: 🐯 tiger
    difficulty: 2
    hints:
    - Say each word. Which starts with the T sound?
    - T says /t/.
    solution: Tiger begins with T.
    mistakes:
      ☀️ sun: lkge_sound
  - prompt: Find another word that begins with R.
    options:
    - 🌈 rainbow
    - ☀️ sun
    - 🐯 tiger
    answer: 🌈 rainbow
    difficulty: 2
    hints:
    - Say each word. Which starts with the R sound?
    - R says /r/.
    solution: Rainbow begins with R.
    mistakes:
      ☀️ sun: lkge_sound
  - prompt: Find another word that begins with S.
    options:
    - ⭐ star
    - 🐀 rat
    - 🐯 tiger
    answer: ⭐ star
    difficulty: 2
    hints:
    - Say each word. Which starts with the S sound?
    - S says /s/.
    solution: Star begins with S.
    mistakes:
      🐀 rat: lkge_sound
