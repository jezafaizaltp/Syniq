# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 5
title: Letters Q, R, S, T
tips:
  lk5e_first: Say the word slowly and listen only to the very first sound.
  lk5e_look: Look at the letter's shape carefully and trace it in the air with your finger.
concepts:
- code: lkge.qt
  title: Letters Q, R, S, T
  notes: |
    Letters Q, R, S, T, R, S: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. Q for queen 👸. R for rat 🐀. S for sun ☀️. T for tiger 🐯. R for rainbow 🌈. S for star ⭐.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - Q
      - R
      - S
    - title: Word
      points:
      - queen 👸
      - rat 🐀
      - sun ☀️
    alt: Q for queen 👸, R for rat 🐀, S for sun ☀️.
  activity:
    type: sort
    prompt: Which letter does it start with?
    bins:
    - Q
    - R
    - S
    - T
    items:
    - label: 👑 queen
      bin: Q
      clue: Say the word slowly. What is the very first sound?
      why: queen starts with q.
    - label: 🐇 rabbit
      bin: R
      clue: Say the word slowly. What is the very first sound?
      why: rabbit starts with r.
    - label: ☀️ sun
      bin: S
      clue: Say the word slowly. What is the very first sound?
      why: sun starts with s.
    - label: 🐯 tiger
      bin: T
      clue: Say the word slowly. What is the very first sound?
      why: tiger starts with t.
  lesson:
    - teach: Letters have names and sounds. Q is for question ❓. R is for rabbit 🐇. Say each word slowly and hear the first sound.
      check:
        prompt: Which word starts with the sound of R?
        options:
        - 🐇 rabbit
        - ❓ question
        - 🐍 snake
        answer: 🐇 rabbit
        why: 'Say rabbit slowly: the first sound is R.'
    - teach: 'More letters: S is for snake 🐍. T is for tomato 🍅.'
      check:
        prompt: Which word starts with the sound of S?
        options:
        - 🐍 snake
        - ❓ question
        - 🐇 rabbit
        answer: 🐍 snake
        why: 'Say snake slowly: the first sound is S.'
    - teach: 'Each letter has a big shape and a small shape: Q q, R r, S s, T t. Big letters are also called capital letters.'
      check:
        prompt: Which is the small letter for T?
        options:
        - t
        - r
        - q
        answer: t
        why: Big T and small t are the same letter.
  items:
  - prompt: Which begins with Q?
    options:
    - 👸 queen
    - 🐀 rat
    - ☀️ sun
    answer: 👸 queen
    difficulty: 1
    hints:
    - Say each word. Which starts with the Q sound?
    - Q says /q/.
    solution: Queen begins with Q.
    mistakes:
      🐀 rat: lkge_sound
  - prompt: Which begins with R?
    options:
    - 🐀 rat
    - ☀️ sun
    - 🐯 tiger
    answer: 🐀 rat
    difficulty: 1
    hints:
    - Say each word. Which starts with the R sound?
    - R says /r/.
    solution: Rat begins with R.
    mistakes:
      ☀️ sun: lkge_sound
  - prompt: Which begins with S?
    options:
    - ☀️ sun
    - 🐯 tiger
    - 🐀 rat
    answer: ☀️ sun
    difficulty: 1
    hints:
    - Say each word. Which starts with the S sound?
    - S says /s/.
    solution: Sun begins with S.
    mistakes:
      🐯 tiger: lkge_sound
  - prompt: Which begins with T?
    options:
    - 🐯 tiger
    - ☀️ sun
    - 👸 queen
    answer: 🐯 tiger
    difficulty: 2
    hints:
    - Say each word. Which starts with the T sound?
    - T says /t/.
    solution: Tiger begins with T.
    mistakes:
      ☀️ sun: lkge_sound
  - prompt: Find another word that begins with R.
    options:
    - 🌈 rainbow
    - ☀️ sun
    - 🐯 tiger
    answer: 🌈 rainbow
    difficulty: 2
    hints:
    - Say each word. Which starts with the R sound?
    - R says /r/.
    solution: Rainbow begins with R.
    mistakes:
      ☀️ sun: lkge_sound
  - prompt: Find another word that begins with S.
    options:
    - ⭐ star
    - 🐀 rat
    - 🐯 tiger
    answer: ⭐ star
    difficulty: 2
    hints:
    - Say each word. Which starts with the S sound?
    - S says /s/.
    solution: Star begins with S.
    mistakes:
      🐀 rat: lkge_sound
  - prompt: Which picture starts with Q?
    options:
    - 🛏️ quilt
    - 🌹 rose
    - 🚂 train
    answer: 🛏️ quilt
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say quilt. Step 2: it starts with Q.'
    mistakes:
      🌹 rose: lk5e_first
      🚂 train: lk5e_first
  - prompt: Which picture starts with R?
    options:
    - 🌹 rose
    - 🧦 sock
    - 🚂 train
    answer: 🌹 rose
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say rose. Step 2: it starts with R.'
    mistakes:
      🧦 sock: lk5e_first
      🚂 train: lk5e_first
  - prompt: Which picture starts with S?
    options:
    - 🧦 sock
    - 🌹 rose
    - 🚂 train
    answer: 🧦 sock
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say sock. Step 2: it starts with S.'
    mistakes:
      🌹 rose: lk5e_first
      🚂 train: lk5e_first
  - prompt: Which picture starts with T?
    options:
    - 🚂 train
    - 🧦 sock
    - 🌹 rose
    answer: 🚂 train
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say train. Step 2: it starts with T.'
    mistakes:
      🧦 sock: lk5e_first
      🌹 rose: lk5e_first
  - prompt: ❓ question starts with which letter?
    options:
    - Q
    - T
    - S
    answer: Q
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: question starts with the Q sound. Step 2: Q.'
    mistakes:
      T: lk5e_look
      S: lk5e_look
  - prompt: 🐇 rabbit starts with which letter?
    options:
    - R
    - T
    - S
    answer: R
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: rabbit starts with the R sound. Step 2: R.'
    mistakes:
      T: lk5e_look
      S: lk5e_look
  - prompt: 🐍 snake starts with which letter?
    options:
    - S
    - R
    - T
    answer: S
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: snake starts with the S sound. Step 2: S.'
    mistakes:
      R: lk5e_look
      T: lk5e_look
  - prompt: 🍅 tomato starts with which letter?
    options:
    - T
    - R
    - S
    answer: T
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: tomato starts with the T sound. Step 2: T.'
    mistakes:
      R: lk5e_look
      S: lk5e_look
  - prompt: Which small letter matches big Q? Look carefully.
    options:
    - q
    - p
    - g
    answer: q
    difficulty: 3
    hints:
    - Some small letters look like mirror twins.
    - Trace each one in the air and check which way it faces.
    solution: 'Step 1: big Q and small q are the same letter. Step 2: q.'
    mistakes:
      p: lk5e_look
      g: lk5e_look
