# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 3
title: Letters I, J, K, L
concepts:
- code: lkge.il
  title: Letters I, J, K, L
  notes: |
    Letters I, J, K, L, K, L: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. I for igloo 🧊. J for jug 🫗. K for kite 🪁. L for lion 🦁. K for key 🔑. L for leaf 🍃.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - I
      - J
      - K
    - title: Word
      points:
      - igloo 🧊
      - jug 🫗
      - kite 🪁
    alt: I for igloo 🧊, J for jug 🫗, K for kite 🪁.
  items:
  - prompt: Which begins with I?
    options:
    - 🧊 igloo
    - 🪁 kite
    - 🦁 lion
    answer: 🧊 igloo
    difficulty: 1
    hints:
    - Say each word. Which starts with the I sound?
    - I says /i/.
    solution: Igloo begins with I.
    mistakes:
      🪁 kite: lkge_sound
  - prompt: Which begins with J?
    options:
    - 🫗 jug
    - 🪁 kite
    - 🦁 lion
    answer: 🫗 jug
    difficulty: 1
    hints:
    - Say each word. Which starts with the J sound?
    - J says /j/.
    solution: Jug begins with J.
    mistakes:
      🪁 kite: lkge_sound
  - prompt: Which begins with K?
    options:
    - 🪁 kite
    - 🦁 lion
    - 🫗 jug
    answer: 🪁 kite
    difficulty: 1
    hints:
    - Say each word. Which starts with the K sound?
    - K says /k/.
    solution: Kite begins with K.
    mistakes:
      🦁 lion: lkge_sound
  - prompt: Which begins with L?
    options:
    - 🦁 lion
    - 🪁 kite
    - 🫗 jug
    answer: 🦁 lion
    difficulty: 2
    hints:
    - Say each word. Which starts with the L sound?
    - L says /l/.
    solution: Lion begins with L.
    mistakes:
      🪁 kite: lkge_sound
  - prompt: Find another word that begins with K.
    options:
    - 🔑 key
    - 🦁 lion
    - 🧊 igloo
    answer: 🔑 key
    difficulty: 2
    hints:
    - Say each word. Which starts with the K sound?
    - K says /k/.
    solution: Key begins with K.
    mistakes:
      🦁 lion: lkge_sound
  - prompt: Find another word that begins with L.
    options:
    - 🍃 leaf
    - 🔑 key
    - 🫗 jug
    answer: 🍃 leaf
    difficulty: 2
    hints:
    - Say each word. Which starts with the L sound?
    - L says /l/.
    solution: Leaf begins with L.
    mistakes:
      🔑 key: lkge_sound
