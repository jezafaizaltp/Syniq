# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 3
title: Letters I, J, K, L
tips:
  lk3e_first: Say the word slowly and listen only to the very first sound.
  lk3e_look: Look at the letter's shape carefully and trace it in the air with your finger.
concepts:
- code: lkge.il
  title: Letters I, J, K, L
  notes: |
    Letters I, J, K, L, K, L: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. I for igloo 🧊. J for jug 🫗. K for kite 🪁. L for lion 🦁. K for key 🔑. L for leaf 🍃.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - I
      - J
      - K
    - title: Word
      points:
      - igloo 🧊
      - jug 🫗
      - kite 🪁
    alt: I for igloo 🧊, J for jug 🫗, K for kite 🪁.
  activity:
    type: sort
    prompt: Which letter does it start with?
    bins:
    - I
    - J
    - K
    - L
    items:
    - label: 🦎 iguana
      bin: I
      clue: Say the word slowly. What is the very first sound?
      why: iguana starts with i.
    - label: 🧃 juice
      bin: J
      clue: Say the word slowly. What is the very first sound?
      why: juice starts with j.
    - label: 🪁 kite
      bin: K
      clue: Say the word slowly. What is the very first sound?
      why: kite starts with k.
    - label: 🦁 lion
      bin: L
      clue: Say the word slowly. What is the very first sound?
      why: lion starts with l.
  lesson:
    - teach: Letters have names and sounds. I is for iguana 🦎. J is for juice 🧃. Say each word slowly and hear the first sound.
      check:
        prompt: Which word starts with the sound of J?
        options:
        - 🧃 juice
        - 🦘 kangaroo
        - 🦎 iguana
        answer: 🧃 juice
        why: 'Say juice slowly: the first sound is J.'
      ways:
      - style: visual
        teach: More words for the letters I and J. Say each word and hear the first sound.
        picture:
          kind: compare
          columns:
          - title: Letter
            points:
            - I
            - J
          - title: Word
            points:
            - 🐛 insect
            - 🚙 jeep
          - title: Another word
            points:
            - 🇮🇳 India
            - 🧥 jacket
          alt: I is for insect and India. J is for jeep and jacket.
      - style: step_by_step
        teach: 'Hear the first sound. First: say the word insect slowly. Second: stop after the very first sound. Third: say that sound again by itself. Fourth: that sound belongs to the letter I.'
    - teach: 'More letters: K is for kangaroo 🦘. L is for lemon 🍋.'
      check:
        prompt: Which word starts with the sound of K?
        options:
        - 🦘 kangaroo
        - 🦎 iguana
        - 🍋 lemon
        answer: 🦘 kangaroo
        why: 'Say kangaroo slowly: the first sound is K.'
      ways:
      - style: visual
        teach: More words for the letters K and L. Point to each picture and say its first sound.
        picture:
          kind: compare
          columns:
          - title: Letter
            points:
            - K
            - L
          - title: Word
            points:
            - 🤴 king
            - 🪜 ladder
          - title: Another word
            points:
            - 🫖 kettle
            - 🔒 lock
          alt: K is for king and kettle. L is for ladder and lock.
      - style: real_world
        teach: Look around your home or school for things that start with K and L, and say each first sound out loud to a grown-up.
    - teach: 'Each letter has a big shape and a small shape: I i, J j, K k, L l. Big letters are also called capital letters.'
      check:
        prompt: Which is the small letter for L?
        options:
        - l
        - i
        - k
        answer: l
        why: Big L and small l are the same letter.
      ways:
      - style: visual
        teach: Each big letter with its small letter, side by side. They have the same name.
        picture:
          kind: compare
          columns:
          - title: Big
            points:
            - I
            - J
            - K
            - L
          - title: Small
            points:
            - i
            - j
            - k
            - l
          alt: Big I goes with small i. Big J goes with small j. Big K goes with small k. Big L goes with small l.
      - style: step_by_step
        teach: 'Write a letter in the air. First: hold up one finger. Second: draw a big J in the air. Third: draw a small j next to it. Fourth: say the letter''s name for both shapes.'
  items:
  - prompt: Which begins with I?
    options:
    - 🧊 igloo
    - 🪁 kite
    - 🦁 lion
    answer: 🧊 igloo
    difficulty: 1
    hints:
    - Say each word. Which starts with the I sound?
    - I says /i/.
    solution: Igloo begins with I.
    mistakes:
      🪁 kite: lkge_sound
  - prompt: Which begins with J?
    options:
    - 🫗 jug
    - 🪁 kite
    - 🦁 lion
    answer: 🫗 jug
    difficulty: 1
    hints:
    - Say each word. Which starts with the J sound?
    - J says /j/.
    solution: Jug begins with J.
    mistakes:
      🪁 kite: lkge_sound
  - prompt: Which begins with K?
    options:
    - 🪁 kite
    - 🦁 lion
    - 🫗 jug
    answer: 🪁 kite
    difficulty: 1
    hints:
    - Say each word. Which starts with the K sound?
    - K says /k/.
    solution: Kite begins with K.
    mistakes:
      🦁 lion: lkge_sound
  - prompt: Which begins with L?
    options:
    - 🦁 lion
    - 🪁 kite
    - 🫗 jug
    answer: 🦁 lion
    difficulty: 2
    hints:
    - Say each word. Which starts with the L sound?
    - L says /l/.
    solution: Lion begins with L.
    mistakes:
      🪁 kite: lkge_sound
  - prompt: Find another word that begins with K.
    options:
    - 🔑 key
    - 🦁 lion
    - 🧊 igloo
    answer: 🔑 key
    difficulty: 2
    hints:
    - Say each word. Which starts with the K sound?
    - K says /k/.
    solution: Key begins with K.
    mistakes:
      🦁 lion: lkge_sound
  - prompt: Find another word that begins with L.
    options:
    - 🍃 leaf
    - 🔑 key
    - 🫗 jug
    answer: 🍃 leaf
    difficulty: 2
    hints:
    - Say each word. Which starts with the L sound?
    - L says /l/.
    solution: Leaf begins with L.
    mistakes:
      🔑 key: lkge_sound
  - prompt: Which picture starts with I?
    options:
    - 🖋️ ink
    - 🍮 jelly
    - 🐨 koala
    answer: 🖋️ ink
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say ink. Step 2: it starts with I.'
    mistakes:
      🍮 jelly: lk3e_first
      🐨 koala: lk3e_first
  - prompt: Which picture starts with J?
    options:
    - 🍮 jelly
    - 🖋️ ink
    - 🪔 lamp
    answer: 🍮 jelly
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say jelly. Step 2: it starts with J.'
    mistakes:
      🖋️ ink: lk3e_first
      🪔 lamp: lk3e_first
  - prompt: Which picture starts with K?
    options:
    - 🐨 koala
    - 🪔 lamp
    - 🖋️ ink
    answer: 🐨 koala
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say koala. Step 2: it starts with K.'
    mistakes:
      🪔 lamp: lk3e_first
      🖋️ ink: lk3e_first
  - prompt: Which picture starts with L?
    options:
    - 🪔 lamp
    - 🖋️ ink
    - 🐨 koala
    answer: 🪔 lamp
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say lamp. Step 2: it starts with L.'
    mistakes:
      🖋️ ink: lk3e_first
      🐨 koala: lk3e_first
  - prompt: 🦎 iguana starts with which letter?
    options:
    - I
    - K
    - L
    answer: I
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: iguana starts with the I sound. Step 2: I.'
    mistakes:
      K: lk3e_look
      L: lk3e_look
  - prompt: 🧃 juice starts with which letter?
    options:
    - J
    - L
    - K
    answer: J
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: juice starts with the J sound. Step 2: J.'
    mistakes:
      L: lk3e_look
      K: lk3e_look
  - prompt: 🦘 kangaroo starts with which letter?
    options:
    - K
    - I
    - L
    answer: K
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: kangaroo starts with the K sound. Step 2: K.'
    mistakes:
      I: lk3e_look
      L: lk3e_look
  - prompt: 🍋 lemon starts with which letter?
    options:
    - L
    - J
    - K
    answer: L
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: lemon starts with the L sound. Step 2: L.'
    mistakes:
      J: lk3e_look
      K: lk3e_look
  - prompt: Which small letter matches big J? Look carefully.
    options:
    - j
    - i
    - l
    answer: j
    difficulty: 3
    hints:
    - Some small letters look like mirror twins.
    - Trace each one in the air and check which way it faces.
    solution: 'Step 1: big J and small j are the same letter. Step 2: j.'
    mistakes:
      i: lk3e_look
      l: lk3e_look
  - prompt: 'Case: Nisha wants to keep her bicycle safe at school. She needs something that starts with L. What should she use?'
    options:
    - 🔒 lock
    - ⛓️ chain
    - 🧺 basket
    answer: 🔒 lock
    hints:
    - Say each word slowly.
    - Which one starts with the sound of lemon?
    solution: Lock starts with the l sound, like lemon, and it keeps the bicycle safe.
    mistakes:
      ⛓️ chain: lk3e_first
      🧺 basket: lk3e_first
    exam: case
    difficulty: 2
  - prompt: 'Situation: On the board the teacher writes the big letter K. Which small letter goes with it?'
    options:
    - k
    - x
    - h
    answer: k
    hints:
    - Trace big K in the air.
    - Which small letter has a tall line and two arms?
    solution: Small k has a tall line and two arms, like big K.
    mistakes:
      x: lk3e_look
      h: lk3e_look
    exam: competency
    difficulty: 2
