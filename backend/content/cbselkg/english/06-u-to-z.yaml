# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 6
title: Letters U, V, W, X, Y, Z
concepts:
- code: lkge.uz
  title: Letters U, V, W, X, Y, Z
  notes: |
    Letters U, V, W, Y, Z, X: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. U for umbrella ☂️. V for van 🚐. W for watermelon 🍉. Y for yak 🐂. Z for zebra 🦓. X for xylophone 🎼.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - U
      - V
      - W
    - title: Word
      points:
      - umbrella ☂️
      - van 🚐
      - watermelon 🍉
    alt: U for umbrella ☂️, V for van 🚐, W for watermelon 🍉.
  items:
  - prompt: Which begins with U?
    options:
    - ☂️ umbrella
    - 🚐 van
    - 🍉 watermelon
    answer: ☂️ umbrella
    difficulty: 1
    hints:
    - Say each word. Which starts with the U sound?
    - U says /u/.
    solution: Umbrella begins with U.
    mistakes:
      🚐 van: lkge_sound
  - prompt: Which begins with V?
    options:
    - 🚐 van
    - ☂️ umbrella
    - 🦓 zebra
    answer: 🚐 van
    difficulty: 1
    hints:
    - Say each word. Which starts with the V sound?
    - V says /v/.
    solution: Van begins with V.
    mistakes:
      ☂️ umbrella: lkge_sound
  - prompt: Which begins with W?
    options:
    - 🍉 watermelon
    - 🚐 van
    - 🦓 zebra
    answer: 🍉 watermelon
    difficulty: 1
    hints:
    - Say each word. Which starts with the W sound?
    - W says /w/.
    solution: Watermelon begins with W.
    mistakes:
      🚐 van: lkge_sound
  - prompt: Which begins with Y?
    options:
    - 🐂 yak
    - ☂️ umbrella
    - 🍉 watermelon
    answer: 🐂 yak
    difficulty: 2
    hints:
    - Say each word. Which starts with the Y sound?
    - Y says /y/.
    solution: Yak begins with Y.
    mistakes:
      ☂️ umbrella: lkge_sound
  - prompt: Which begins with Z?
    options:
    - 🦓 zebra
    - 🚐 van
    - 🐂 yak
    answer: 🦓 zebra
    difficulty: 2
    hints:
    - Say each word. Which starts with the Z sound?
    - Z says /z/.
    solution: Zebra begins with Z.
    mistakes:
      🚐 van: lkge_sound
  - prompt: Which begins with X?
    options:
    - 🎼 xylophone
    - 🦓 zebra
    - ☂️ umbrella
    answer: 🎼 xylophone
    difficulty: 2
    hints:
    - Say each word. Which starts with the X sound?
    - Look at the first letter of each word.
    solution: Xylophone begins with X.
    mistakes:
      🦓 zebra: lkge_sound
