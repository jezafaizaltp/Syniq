# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 6
title: Letters U, V, W, X, Y, Z
tips:
  lk6e_first: Say the word slowly and listen only to the very first sound.
  lk6e_look: Look at the letter's shape carefully and trace it in the air with your finger.
concepts:
- code: lkge.uz
  title: Letters U, V, W, X, Y, Z
  notes: |
    Letters U, V, W, Y, Z, X: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. U for umbrella ☂️. V for van 🚐. W for watermelon 🍉. Y for yak 🐂. Z for zebra 🦓. X for xylophone 🎼.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - U
      - V
      - W
    - title: Word
      points:
      - umbrella ☂️
      - van 🚐
      - watermelon 🍉
    alt: U for umbrella ☂️, V for van 🚐, W for watermelon 🍉.
  activity:
    type: sort
    prompt: Which letter does it start with?
    bins:
    - U
    - V
    - W
    - Y
    - Z
    items:
    - label: ☂️ umbrella
      bin: U
      clue: Say the word slowly. What is the very first sound?
      why: umbrella starts with u.
    - label: 🚐 van
      bin: V
      clue: Say the word slowly. What is the very first sound?
      why: van starts with v.
    - label: 🍉 watermelon
      bin: W
      clue: Say the word slowly. What is the very first sound?
      why: watermelon starts with w.
    - label: 🧶 yarn
      bin: Y
      clue: Say the word slowly. What is the very first sound?
      why: yarn starts with y.
    - label: 🦓 zebra
      bin: Z
      clue: Say the word slowly. What is the very first sound?
      why: zebra starts with z.
  lesson:
    - teach: Letters have names and sounds. U is for umbrella ☂️. V is for violin 🎻. W is for watch ⌚. Say each word slowly and hear the first sound.
      check:
        prompt: Which word starts with the sound of W?
        options:
        - ⌚ watch
        - 🪀 yo-yo
        - 🦓 zebra
        answer: ⌚ watch
        why: 'Say watch slowly: the first sound is W.'
      ways:
      - style: visual
        teach: More words for the letters U and V. Say each word and hear the first sound.
        picture:
          kind: compare
          columns:
          - title: Letter
            points:
            - U
            - V
          - title: Word
            points:
            - 🛏️ under
            - 🏺 vase
          - title: Another word
            points:
            - 👨 uncle
            - 🥦 vegetables
          alt: U is for under and uncle. V is for vase and vegetables.
      - style: step_by_step
        teach: 'Hear the first sound. First: say the word under slowly. Second: stop after the very first sound. Third: say that sound again by itself. Fourth: that sound belongs to the letter U.'
    - teach: 'More letters: X is for x-ray 🩻. Y is for yo-yo 🪀. Z is for zebra 🦓.'
      check:
        prompt: Which word starts with the sound of X?
        options:
        - 🩻 x-ray
        - 🦓 zebra
        - ⌚ watch
        answer: 🩻 x-ray
        why: 'Say x-ray slowly: the first sound is X.'
      ways:
      - style: visual
        teach: More words for the letters W, Y and Z. Point to each picture and say its first sound.
        picture:
          kind: compare
          columns:
          - title: Letter
            points:
            - W
            - Y
            - Z
          - title: Word
            points:
            - 🪟 window
            - 🥱 yawn
            - 🤐 zip
          - title: Another word
            points:
            - 🐺 wolf
            - 🍶 yogurt
            - 🦁 zoo
          alt: W is for window and wolf. Y is for yawn and yogurt. Z is for zip and zoo.
      - style: real_world
        teach: Look around your home or school for things that start with W, Y and Z, and say each first sound out loud to a grown-up.
    - teach: 'Each letter has a big shape and a small shape: U u, V v, W w, X x, Y y, Z z. Big letters are also called capital letters.'
      check:
        prompt: Which is the small letter for Z?
        options:
        - z
        - y
        - w
        answer: z
        why: Big Z and small z are the same letter.
      ways:
      - style: visual
        teach: Each big letter with its small letter, side by side. They have the same name.
        picture:
          kind: compare
          columns:
          - title: Big
            points:
            - U
            - V
            - W
            - Y
            - Z
          - title: Small
            points:
            - u
            - v
            - w
            - y
            - z
          alt: Big U goes with small u. Big V goes with small v. Big W goes with small w. Big Y goes with small y. Big Z goes with small z.
      - style: step_by_step
        teach: 'Write a letter in the air. First: hold up one finger. Second: draw a big V in the air. Third: draw a small v next to it. Fourth: say the letter''s name for both shapes.'
  items:
  - prompt: Which begins with U?
    options:
    - ☂️ umbrella
    - 🚐 van
    - 🍉 watermelon
    answer: ☂️ umbrella
    difficulty: 1
    hints:
    - Say each word. Which starts with the U sound?
    - U says /u/.
    solution: Umbrella begins with U.
    mistakes:
      🚐 van: lkge_sound
  - prompt: Which begins with V?
    options:
    - 🚐 van
    - ☂️ umbrella
    - 🦓 zebra
    answer: 🚐 van
    difficulty: 1
    hints:
    - Say each word. Which starts with the V sound?
    - V says /v/.
    solution: Van begins with V.
    mistakes:
      ☂️ umbrella: lkge_sound
  - prompt: Which begins with W?
    options:
    - 🍉 watermelon
    - 🚐 van
    - 🦓 zebra
    answer: 🍉 watermelon
    difficulty: 1
    hints:
    - Say each word. Which starts with the W sound?
    - W says /w/.
    solution: Watermelon begins with W.
    mistakes:
      🚐 van: lkge_sound
  - prompt: Which begins with Y?
    options:
    - 🐂 yak
    - ☂️ umbrella
    - 🍉 watermelon
    answer: 🐂 yak
    difficulty: 2
    hints:
    - Say each word. Which starts with the Y sound?
    - Y says /y/.
    solution: Yak begins with Y.
    mistakes:
      ☂️ umbrella: lkge_sound
  - prompt: Which begins with Z?
    options:
    - 🦓 zebra
    - 🚐 van
    - 🐂 yak
    answer: 🦓 zebra
    difficulty: 2
    hints:
    - Say each word. Which starts with the Z sound?
    - Z says /z/.
    solution: Zebra begins with Z.
    mistakes:
      🚐 van: lkge_sound
  - prompt: Which begins with X?
    options:
    - 🎼 xylophone
    - 🦓 zebra
    - ☂️ umbrella
    answer: 🎼 xylophone
    difficulty: 2
    hints:
    - Say each word. Which starts with the X sound?
    - Look at the first letter of each word.
    solution: Xylophone begins with X.
    mistakes:
      🦓 zebra: lkge_sound
  - prompt: Which picture starts with U?
    options:
    - ⬆️ up
    - 0️⃣ zero
    - 🌋 volcano
    answer: ⬆️ up
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say up. Step 2: it starts with U.'
    mistakes:
      0️⃣ zero: lk6e_first
      🌋 volcano: lk6e_first
  - prompt: Which picture starts with V?
    options:
    - 🌋 volcano
    - 🐋 whale
    - 🎼 xylophone
    answer: 🌋 volcano
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say volcano. Step 2: it starts with V.'
    mistakes:
      🐋 whale: lk6e_first
      🎼 xylophone: lk6e_first
  - prompt: Which picture starts with W?
    options:
    - 🐋 whale
    - 🌋 volcano
    - ⬆️ up
    answer: 🐋 whale
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say whale. Step 2: it starts with W.'
    mistakes:
      🌋 volcano: lk6e_first
      ⬆️ up: lk6e_first
  - prompt: Which picture starts with X?
    options:
    - 🎼 xylophone
    - 🐋 whale
    - 0️⃣ zero
    answer: 🎼 xylophone
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say xylophone. Step 2: it starts with X.'
    mistakes:
      🐋 whale: lk6e_first
      0️⃣ zero: lk6e_first
  - prompt: Which picture starts with Y?
    options:
    - 💛 yellow
    - 🎼 xylophone
    - ⬆️ up
    answer: 💛 yellow
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say yellow. Step 2: it starts with Y.'
    mistakes:
      🎼 xylophone: lk6e_first
      ⬆️ up: lk6e_first
  - prompt: Which picture starts with Z?
    options:
    - 0️⃣ zero
    - ⬆️ up
    - 🌋 volcano
    answer: 0️⃣ zero
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say zero. Step 2: it starts with Z.'
    mistakes:
      ⬆️ up: lk6e_first
      🌋 volcano: lk6e_first
  - prompt: ☂️ umbrella starts with which letter?
    options:
    - U
    - Z
    - X
    answer: U
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: umbrella starts with the U sound. Step 2: U.'
    mistakes:
      Z: lk6e_look
      X: lk6e_look
  - prompt: 🎻 violin starts with which letter?
    options:
    - V
    - Y
    - W
    answer: V
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: violin starts with the V sound. Step 2: V.'
    mistakes:
      Y: lk6e_look
      W: lk6e_look
  - prompt: ⌚ watch starts with which letter?
    options:
    - W
    - Z
    - U
    answer: W
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: watch starts with the W sound. Step 2: W.'
    mistakes:
      Z: lk6e_look
      U: lk6e_look
  - prompt: 'Case: The room is dark and stuffy. Sara wants to let in fresh air. She opens something that starts with W. What does she open?'
    options:
    - 🪟 window
    - 🚪 door
    - 📦 box
    answer: 🪟 window
    hints:
    - Say each word slowly.
    - Which one starts with the sound of watch?
    solution: Window starts with the w sound, like watch, and opening it lets in fresh air.
    mistakes:
      🚪 door: lk6e_first
      📦 box: lk6e_first
    exam: case
    difficulty: 2
  - prompt: 'Situation: The teacher shows the big letter Y. Which small letter goes with it?'
    options:
    - y
    - v
    - g
    answer: y
    hints:
    - Trace big Y in the air.
    - Which small letter has a tail that goes down below the line?
    solution: Small y has two arms and a tail that goes down, and it goes with big Y.
    mistakes:
      v: lk6e_look
      g: lk6e_look
    exam: competency
    difficulty: 2
