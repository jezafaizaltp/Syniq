# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 2
title: Letters E, F, G, H
tips:
  lk2e_first: Say the word slowly and listen only to the very first sound.
  lk2e_look: Look at the letter's shape carefully and trace it in the air with your finger.
concepts:
- code: lkge.eh
  title: Letters E, F, G, H
  notes: |
    Letters E, F, G, H, E, F: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. E for egg 🥚. F for fish 🐟. G for goat 🐐. H for hat 🎩. E for elephant 🐘. F for fan 🪭.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - E
      - F
      - G
    - title: Word
      points:
      - egg 🥚
      - fish 🐟
      - goat 🐐
    alt: E for egg 🥚, F for fish 🐟, G for goat 🐐.
  activity:
    type: sort
    prompt: Which letter does it start with?
    bins:
    - E
    - F
    - G
    - H
    items:
    - label: 🥚 egg
      bin: E
      clue: Say the word slowly. What is the very first sound?
      why: egg starts with e.
    - label: 🐟 fish
      bin: F
      clue: Say the word slowly. What is the very first sound?
      why: fish starts with f.
    - label: 🐐 goat
      bin: G
      clue: Say the word slowly. What is the very first sound?
      why: goat starts with g.
    - label: 🎩 hat
      bin: H
      clue: Say the word slowly. What is the very first sound?
      why: hat starts with h.
  lesson:
    - teach: Letters have names and sounds. E is for elephant 🐘. F is for frog 🐸. Say each word slowly and hear the first sound.
      check:
        prompt: Which word starts with the sound of F?
        options:
        - 🐸 frog
        - 🍇 grapes
        - 🐴 horse
        answer: 🐸 frog
        why: 'Say frog slowly: the first sound is F.'
    - teach: 'More letters: G is for grapes 🍇. H is for horse 🐴.'
      check:
        prompt: Which word starts with the sound of G?
        options:
        - 🍇 grapes
        - 🐘 elephant
        - 🐸 frog
        answer: 🍇 grapes
        why: 'Say grapes slowly: the first sound is G.'
    - teach: 'Each letter has a big shape and a small shape: E e, F f, G g, H h. Big letters are also called capital letters.'
      check:
        prompt: Which is the small letter for H?
        options:
        - h
        - f
        - g
        answer: h
        why: Big H and small h are the same letter.
  items:
  - prompt: Which begins with E?
    options:
    - 🥚 egg
    - 🐟 fish
    - 🐐 goat
    answer: 🥚 egg
    difficulty: 1
    hints:
    - Say each word. Which starts with the E sound?
    - E says /e/.
    solution: Egg begins with E.
    mistakes:
      🐟 fish: lkge_sound
  - prompt: Which begins with F?
    options:
    - 🐟 fish
    - 🥚 egg
    - 🎩 hat
    answer: 🐟 fish
    difficulty: 1
    hints:
    - Say each word. Which starts with the F sound?
    - F says /f/.
    solution: Fish begins with F.
    mistakes:
      🥚 egg: lkge_sound
  - prompt: Which begins with G?
    options:
    - 🐐 goat
    - 🎩 hat
    - 🐟 fish
    answer: 🐐 goat
    difficulty: 1
    hints:
    - Say each word. Which starts with the G sound?
    - G says /g/.
    solution: Goat begins with G.
    mistakes:
      🎩 hat: lkge_sound
  - prompt: Which begins with H?
    options:
    - 🎩 hat
    - 🐐 goat
    - 🥚 egg
    answer: 🎩 hat
    difficulty: 2
    hints:
    - Say each word. Which starts with the H sound?
    - H says /h/.
    solution: Hat begins with H.
    mistakes:
      🐐 goat: lkge_sound
  - prompt: Find another word that begins with E.
    options:
    - 🐘 elephant
    - 🐐 goat
    - 🎩 hat
    answer: 🐘 elephant
    difficulty: 2
    hints:
    - Say each word. Which starts with the E sound?
    - E says /e/.
    solution: Elephant begins with E.
    mistakes:
      🐐 goat: lkge_sound
  - prompt: Find another word that begins with F.
    options:
    - 🪭 fan
    - 🐐 goat
    - 🎩 hat
    answer: 🪭 fan
    difficulty: 2
    hints:
    - Say each word. Which starts with the F sound?
    - F says /f/.
    solution: Fan begins with F.
    mistakes:
      🐐 goat: lkge_sound
  - prompt: Which picture starts with E?
    options:
    - 🥚 egg
    - 🎸 guitar
    - 🦊 fox
    answer: 🥚 egg
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say egg. Step 2: it starts with E.'
    mistakes:
      🎸 guitar: lk2e_first
      🦊 fox: lk2e_first
  - prompt: Which picture starts with F?
    options:
    - 🦊 fox
    - 🥚 egg
    - 🏠 house
    answer: 🦊 fox
    difficulty: 1
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say fox. Step 2: it starts with F.'
    mistakes:
      🥚 egg: lk2e_first
      🏠 house: lk2e_first
  - prompt: Which picture starts with G?
    options:
    - 🎸 guitar
    - 🏠 house
    - 🦊 fox
    answer: 🎸 guitar
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say guitar. Step 2: it starts with G.'
    mistakes:
      🏠 house: lk2e_first
      🦊 fox: lk2e_first
  - prompt: Which picture starts with H?
    options:
    - 🏠 house
    - 🦊 fox
    - 🥚 egg
    answer: 🏠 house
    difficulty: 2
    hints:
    - Say each word slowly.
    - Listen to the very first sound.
    solution: 'Step 1: say house. Step 2: it starts with H.'
    mistakes:
      🦊 fox: lk2e_first
      🥚 egg: lk2e_first
  - prompt: 🐘 elephant starts with which letter?
    options:
    - E
    - F
    - H
    answer: E
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: elephant starts with the E sound. Step 2: E.'
    mistakes:
      F: lk2e_look
      H: lk2e_look
  - prompt: 🐸 frog starts with which letter?
    options:
    - F
    - E
    - G
    answer: F
    difficulty: 2
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: frog starts with the F sound. Step 2: F.'
    mistakes:
      E: lk2e_look
      G: lk2e_look
  - prompt: 🍇 grapes starts with which letter?
    options:
    - G
    - E
    - H
    answer: G
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: grapes starts with the G sound. Step 2: G.'
    mistakes:
      E: lk2e_look
      H: lk2e_look
  - prompt: 🐴 horse starts with which letter?
    options:
    - H
    - F
    - E
    answer: H
    difficulty: 3
    hints:
    - Say the word slowly.
    - Which letter makes that first sound?
    solution: 'Step 1: horse starts with the H sound. Step 2: H.'
    mistakes:
      F: lk2e_look
      E: lk2e_look
  - prompt: Which small letter matches big H? Look carefully.
    options:
    - h
    - n
    - k
    answer: h
    difficulty: 3
    hints:
    - Some small letters look like mirror twins.
    - Trace each one in the air and check which way it faces.
    solution: 'Step 1: big H and small h are the same letter. Step 2: h.'
    mistakes:
      n: lk2e_look
      k: lk2e_look
