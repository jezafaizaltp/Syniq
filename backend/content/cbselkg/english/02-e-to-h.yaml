# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 2
title: Letters E, F, G, H
concepts:
- code: lkge.eh
  title: Letters E, F, G, H
  notes: |
    Letters E, F, G, H, E, F: recognising each letter, its sound and a word that begins with it.
  explanations:
    text: Each letter has a sound. E for egg 🥚. F for fish 🐟. G for goat 🐐. H for hat 🎩. E for elephant 🐘. F for fan 🪭.
    visual: Draw each letter big, and next to it a picture of a word that begins with it.
    step_by_step: 'Step 1: Look at the letter. Step 2: Say its sound. Step 3: Find a picture whose name starts with that sound.'
    real_world: Look for these letters on signboards and packets around you.
  picture:
    kind: compare
    columns:
    - title: Letter
      points:
      - E
      - F
      - G
    - title: Word
      points:
      - egg 🥚
      - fish 🐟
      - goat 🐐
    alt: E for egg 🥚, F for fish 🐟, G for goat 🐐.
  items:
  - prompt: Which begins with E?
    options:
    - 🥚 egg
    - 🐟 fish
    - 🐐 goat
    answer: 🥚 egg
    difficulty: 1
    hints:
    - Say each word. Which starts with the E sound?
    - E says /e/.
    solution: Egg begins with E.
    mistakes:
      🐟 fish: lkge_sound
  - prompt: Which begins with F?
    options:
    - 🐟 fish
    - 🥚 egg
    - 🎩 hat
    answer: 🐟 fish
    difficulty: 1
    hints:
    - Say each word. Which starts with the F sound?
    - F says /f/.
    solution: Fish begins with F.
    mistakes:
      🥚 egg: lkge_sound
  - prompt: Which begins with G?
    options:
    - 🐐 goat
    - 🎩 hat
    - 🐟 fish
    answer: 🐐 goat
    difficulty: 1
    hints:
    - Say each word. Which starts with the G sound?
    - G says /g/.
    solution: Goat begins with G.
    mistakes:
      🎩 hat: lkge_sound
  - prompt: Which begins with H?
    options:
    - 🎩 hat
    - 🐐 goat
    - 🥚 egg
    answer: 🎩 hat
    difficulty: 2
    hints:
    - Say each word. Which starts with the H sound?
    - H says /h/.
    solution: Hat begins with H.
    mistakes:
      🐐 goat: lkge_sound
  - prompt: Find another word that begins with E.
    options:
    - 🐘 elephant
    - 🐐 goat
    - 🎩 hat
    answer: 🐘 elephant
    difficulty: 2
    hints:
    - Say each word. Which starts with the E sound?
    - E says /e/.
    solution: Elephant begins with E.
    mistakes:
      🐐 goat: lkge_sound
  - prompt: Find another word that begins with F.
    options:
    - 🪭 fan
    - 🐐 goat
    - 🎩 hat
    answer: 🪭 fan
    difficulty: 2
    hints:
    - Say each word. Which starts with the F sound?
    - F says /f/.
    solution: Fan begins with F.
    mistakes:
      🐐 goat: lkge_sound
