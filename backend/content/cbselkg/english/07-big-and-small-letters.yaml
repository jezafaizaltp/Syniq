# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 7
title: Big and Small Letters
tips:
  kg_letter_pair: "Big and small letters often look alike. Trace the small one in the air, then make it tall."
  kg_name_capital: "Look at your own name card. How does the first letter look next to the others?"

concepts:
- code: lkge.case
  title: Big and Small Letters
  notes: |
    Capital and small letters: A a, B b, M m; matching pairs; names start with a capital letter.
  explanations:
    text: 'Every letter has a big (capital) form and a small form: A and a, B and b, M and m. They make the same sound.'
    visual: Draw a mother elephant labelled A and a baby elephant labelled a.
    step_by_step: 'Step 1: Look at the big letter. Step 2: Find its small partner. Step 3: Say their sound together.'
    real_world: Your name starts with a big letter, like Riya or Arjun.
  picture:
    kind: compare
    columns:
    - title: Big
      points:
      - A
      - B
      - M
    - title: Small
      points:
      - a
      - b
      - m
    alt: 'Big and small letter pairs: A and a, B and b, M and m.'
  activity:
    type: sort
    prompt: Find the big letter's partner.
    bins:
    - A
    - B
    - M
    - D
    items:
    - label: a
      bin: A
      clue: One round part and one short line.
      why: Small a goes with big A.
    - label: b
      bin: B
      clue: A stick with a round tummy.
      why: Small b goes with big B.
    - label: m
      bin: M
      clue: Two humps.
      why: Small m goes with big M.
    - label: d
      bin: D
      clue: Round tummy, stick on the right.
      why: Small d goes with big D (b has the tummy on the right of the stick, d on the left).
  items:
  - prompt: Which is the small letter of A?
    options:
    - a
    - b
    - d
    answer: a
    difficulty: 1
    hints:
    - Same sound /a/.
    - Round with a tail.
    solution: Big A, small a.
    mistakes:
      d: lkge_look
  - prompt: Which is the small letter of B?
    options:
    - b
    - d
    - p
    answer: b
    difficulty: 1
    hints:
    - Tall line, belly on the right.
    - Ball.
    solution: Big B, small b.
    mistakes:
      d: lkge_look
  - prompt: Which is the big letter of m?
    options:
    - M
    - N
    - W
    answer: M
    difficulty: 1
    hints:
    - Two hills.
    - Mango.
    solution: Small m, big M.
    mistakes: {"N": "kg_letter_pair", "W": "kg_letter_pair"}
  - prompt: Which is the small letter of S?
    options:
    - s
    - z
    - c
    answer: s
    difficulty: 2
    hints:
    - Same shape, smaller.
    - Snake.
    solution: Big S, small s.
    mistakes: {"z": "kg_letter_pair", "c": "kg_letter_pair"}
  - prompt: 'A name starts with a:'
    options:
    - big letter
    - small letter
    - number
    answer: big letter
    difficulty: 2
    hints:
    - Look at your name.
    - Capital.
    solution: A name starts with a big letter.
    mistakes: {"small letter": "kg_name_capital", "number": "kg_name_capital"}
  - prompt: Which is the big letter of t?
    options:
    - T
    - F
    - L
    answer: T
    difficulty: 2
    hints:
    - Like a table top.
    - Tiger.
    solution: Small t, big T.
    mistakes: {"F": "kg_letter_pair", "L": "kg_letter_pair"}
