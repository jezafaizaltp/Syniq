# CBSE LKG English (letters and sounds) (play-based; no NCERT textbook for KG), chapter 7. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-eng
chapter: 7
title: Big and Small Letters
tips:
  kg_letter_pair: "Big and small letters often look alike. Trace the small one in the air, then make it tall."
  kg_name_capital: "Look at your own name card. How does the first letter look next to the others?"
  lk7e_pair: Big and small letters are the same letter. Say the letter's name for both.
  lk7e_look: Some small letters look alike. Trace each one in the air and check which way it faces.
  lk7e_name: Names of people and places start with a big (capital) letter.

concepts:
- code: lkge.case
  title: Big and Small Letters
  notes: |
    Capital and small letters: A a, B b, M m; matching pairs; names start with a capital letter.
  explanations:
    text: 'Every letter has a big (capital) form and a small form: A and a, B and b, M and m. They make the same sound.'
    visual: Draw a mother elephant labelled A and a baby elephant labelled a.
    step_by_step: 'Step 1: Look at the big letter. Step 2: Find its small partner. Step 3: Say their sound together.'
    real_world: Your name starts with a big letter, like Riya or Arjun.
  picture:
    kind: compare
    columns:
    - title: Big
      points:
      - A
      - B
      - M
    - title: Small
      points:
      - a
      - b
      - m
    alt: 'Big and small letter pairs: A and a, B and b, M and m.'
  activity:
    type: sort
    prompt: Find the big letter's partner.
    bins:
    - A
    - B
    - M
    - D
    items:
    - label: a
      bin: A
      clue: One round part and one short line.
      why: Small a goes with big A.
    - label: b
      bin: B
      clue: A stick with a round tummy.
      why: Small b goes with big B.
    - label: m
      bin: M
      clue: Two humps.
      why: Small m goes with big M.
    - label: d
      bin: D
      clue: Round tummy, stick on the right.
      why: Small d goes with big D (b has the tummy on the right of the stick, d on the left).
  lesson:
    - teach: 'Every letter has two shapes: a big (capital) letter and a small letter. A and a are both ''a''. B and b are both ''b''.'
      picture:
        kind: compare
        columns:
        - title: Big
          points:
          - A
          - B
          - C
          - D
        - title: Small
          points:
          - a
          - b
          - c
          - d
        alt: Big letters and their small letters.
      check:
        prompt: Which small letter goes with big C?
        options:
        - c
        - o
        - e
        answer: c
        why: C and c are the same letter, just big and small.
    - teach: 'Some big and small letters look the same, just a different size: C c, O o, S s, W w. Others look different: A a, G g, R r.'
      check:
        prompt: Which pair looks the same, just bigger and smaller?
        options:
        - O o
        - A a
        - G g
        answer: O o
        why: Big O and small o are both round circles.
    - teach: 'Your name starts with a big letter: Riya, Arjun, Meena. The first word of a sentence starts with a big letter too.'
      check:
        prompt: Which name is written the right way?
        options:
        - Anu
        - anu
        - aNU
        answer: Anu
        why: A name starts with a big letter, then small letters.
  items:
  - prompt: Which is the small letter of A?
    options:
    - a
    - b
    - d
    answer: a
    difficulty: 1
    hints:
    - Same sound /a/.
    - Round with a tail.
    solution: Big A, small a.
    mistakes:
      d: lkge_look
  - prompt: Which is the small letter of B?
    options:
    - b
    - d
    - p
    answer: b
    difficulty: 1
    hints:
    - Tall line, belly on the right.
    - Ball.
    solution: Big B, small b.
    mistakes:
      d: lkge_look
  - prompt: Which is the big letter of m?
    options:
    - M
    - N
    - W
    answer: M
    difficulty: 1
    hints:
    - Two hills.
    - Mango.
    solution: Small m, big M.
    mistakes: {"N": "kg_letter_pair", "W": "kg_letter_pair"}
  - prompt: Which is the small letter of S?
    options:
    - s
    - z
    - c
    answer: s
    difficulty: 2
    hints:
    - Same shape, smaller.
    - Snake.
    solution: Big S, small s.
    mistakes: {"z": "kg_letter_pair", "c": "kg_letter_pair"}
  - prompt: 'A name starts with a:'
    options:
    - big letter
    - small letter
    - number
    answer: big letter
    difficulty: 2
    hints:
    - Look at your name.
    - Capital.
    solution: A name starts with a big letter.
    mistakes: {"small letter": "kg_name_capital", "number": "kg_name_capital"}
  - prompt: Which is the big letter of t?
    options:
    - T
    - F
    - L
    answer: T
    difficulty: 2
    hints:
    - Like a table top.
    - Tiger.
    solution: Small t, big T.
    mistakes: {"F": "kg_letter_pair", "L": "kg_letter_pair"}
  - prompt: Which is the small letter of D?
    options:
    - d
    - b
    - p
    answer: d
    difficulty: 2
    hints:
    - Small b and small d face opposite ways.
    - Trace each in the air.
    solution: 'Step 1: D and d are the same letter. Step 2: d.'
    mistakes:
      b: lk7e_look
      p: lk7e_look
  - prompt: Which is the big letter of e?
    options:
    - E
    - F
    - B
    answer: E
    difficulty: 1
    hints:
    - Say the letter's name.
    - Find the big one with the same name.
    solution: 'Step 1: e and E are the same letter. Step 2: E.'
    mistakes:
      F: lk7e_pair
      B: lk7e_pair
  - prompt: Which is the small letter of G?
    options:
    - g
    - q
    - j
    answer: g
    difficulty: 2
    hints:
    - It has a tail that hangs down.
    - Say the letter's name.
    solution: 'Step 1: G and g are the same letter. Step 2: g.'
    mistakes:
      q: lk7e_look
      j: lk7e_look
  - prompt: Which is the big letter of r?
    options:
    - R
    - P
    - K
    answer: R
    difficulty: 1
    hints:
    - Say its name.
    - Find the big letter with that name.
    solution: 'Step 1: r and R are the same letter. Step 2: R.'
    mistakes:
      P: lk7e_pair
      K: lk7e_pair
  - prompt: Which name is written correctly?
    options:
    - Ravi
    - ravi
    - rAVI
    answer: Ravi
    difficulty: 2
    hints:
    - How should a name begin?
    - Only the first letter is big.
    solution: 'Step 1: names start with a big letter. Step 2: Ravi.'
    mistakes:
      ravi: lk7e_name
      rAVI: lk7e_name
  - prompt: Which pair is NOT a matching big and small letter?
    options:
    - B d
    - M m
    - T t
    answer: B d
    difficulty: 3
    hints:
    - Say the name of each letter in the pair.
    - Do both names match?
    solution: 'Step 1: M m and T t match. Step 2: B and d are different letters.'
    mistakes:
      M m: lk7e_pair
      T t: lk7e_pair
  - prompt: Which is the small letter of N?
    options:
    - n
    - m
    - u
    answer: n
    difficulty: 2
    hints:
    - It has one hump.
    - Say its name.
    solution: 'Step 1: N and n are the same letter. Step 2: n.'
    mistakes:
      m: lk7e_look
      u: lk7e_look
  - prompt: Which is the big letter of h?
    options:
    - H
    - N
    - K
    answer: H
    difficulty: 3
    hints:
    - Say its name.
    - It looks like a ladder with one step.
    solution: 'Step 1: h and H are the same letter. Step 2: H.'
    mistakes:
      N: lk7e_pair
      K: lk7e_pair
  - prompt: 'A sentence starts with a:'
    options:
    - big letter
    - small letter
    - number
    answer: big letter
    difficulty: 3
    hints:
    - Look at the first word in a storybook line.
    - Just like names do.
    solution: 'Step 1: sentences begin like names. Step 2: with a big letter.'
    mistakes:
      small letter: lk7e_name
      number: lk7e_name
