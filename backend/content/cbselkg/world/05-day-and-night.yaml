# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 5
title: Day and Night
concepts:
- code: lkgw.day
  title: Day and Night
  notes: |
    Day and night; sun, moon and stars; what we do in the day and at night; sleeping well.
  explanations:
    text: In the day the sun shines and we play and learn. At night the moon and stars come out and we sleep.
    visual: 'Draw two halves: a sunny day with children playing, and a night with the moon and a child sleeping.'
    step_by_step: 'Step 1: Is the sun out or the moon? Step 2: Is it time to play or to sleep?'
    real_world: Sleeping early helps you grow and feel happy.
  picture:
    kind: compare
    columns:
    - title: Day
      points:
      - ☀️ sun
      - play
      - school
    - title: Night
      points:
      - 🌙 moon
      - ⭐ stars
      - sleep
    alt: In the day there is the sun, play and school; at night the moon, the stars and sleep.
  activity:
    type: sort
    prompt: Day or night?
    bins:
    - ☀️ Day
    - 🌙 Night
    items:
    - label: We play outside in the sunshine
      bin: ☀️ Day
      clue: Is the sun up?
      why: The sun is up in the day.
    - label: The stars twinkle
      bin: 🌙 Night
      clue: Can you see stars when the sun is out?
      why: We see stars at night.
    - label: We go to school
      bin: ☀️ Day
      clue: Is it light outside?
      why: We go to school in the day.
    - label: We sleep in bed
      bin: 🌙 Night
      clue: Is it dark outside?
      why: We sleep at night.
    - label: The moon shines in the dark sky
      bin: 🌙 Night
      clue: Is it dark?
      why: The moon shines at night.
    - label: We eat lunch
      bin: ☀️ Day
      clue: Lunch comes in the middle of...?
      why: Lunch is in the day.
  items:
  - prompt: What shines in the day?
    options:
    - ☀️ sun
    - 🌙 moon
    - ⭐ stars
    answer: ☀️ sun
    difficulty: 1
    hints:
    - Bright and hot.
    - Morning.
    solution: The sun shines in the day.
    mistakes:
      🌙 moon: lkgw_look
  - prompt: What do we see at night?
    options:
    - 🌙 moon and stars
    - ☀️ sun
    - 🌈 rainbow
    answer: 🌙 moon and stars
    difficulty: 1
    hints:
    - Dark sky.
    - Twinkle.
    solution: We see the moon and stars.
  - prompt: 'We sleep at:'
    options:
    - night
    - noon
    - school time
    answer: night
    difficulty: 1
    hints:
    - Dark.
    - Bed time.
    solution: We sleep at night.
  - prompt: 'We go to school in the:'
    options:
    - day
    - night
    - dream
    answer: day
    difficulty: 2
    hints:
    - Sun is out.
    - Morning.
    solution: We go to school in the day.
  - prompt: Which is the opposite of day?
    options:
    - night
    - sun
    - play
    answer: night
    difficulty: 2
    hints:
    - Not day.
    - Moon time.
    solution: Night is the opposite of day.
  - prompt: 'Sleeping early helps us:'
    options:
    - grow and feel fresh
    - feel tired
    - get sick
    answer: grow and feel fresh
    difficulty: 2
    hints:
    - Good rest.
    - Healthy habit.
    solution: Sleep helps us grow and feel fresh.
