# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 5
title: Day and Night
tips:
  kg_night_sky: "Look up when it is dark outside. What shines softly and twinkles?"
  kg_school_time: "Is the sun out when you go to school?"
  kg_sleep_good: "How do you feel in the morning after a long, good sleep?"
  kg_sleep_time: "When do your lights go off and the sky turn dark?"
  lk5w_sky: Picture the sky. Is it bright with the sun, or dark with the moon and stars?
  lk5w_when: Think about your own day, from waking up to going to bed. When do you do this?
  lk5w_sleep: Think how you feel after a good long sleep.

concepts:
- code: lkgw.day
  title: Day and Night
  notes: |
    Day and night; sun, moon and stars; what we do in the day and at night; sleeping well.
  explanations:
    text: In the day the sun shines and we play and learn. At night the moon and stars come out and we sleep.
    visual: 'Draw two halves: a sunny day with children playing, and a night with the moon and a child sleeping.'
    step_by_step: 'Step 1: Is the sun out or the moon? Step 2: Is it time to play or to sleep?'
    real_world: Sleeping early helps you grow and feel happy.
  picture:
    kind: compare
    columns:
    - title: Day
      points:
      - ☀️ sun
      - play
      - school
    - title: Night
      points:
      - 🌙 moon
      - ⭐ stars
      - sleep
    alt: In the day there is the sun, play and school; at night the moon, the stars and sleep.
  activity:
    type: sort
    prompt: Day or night?
    bins:
    - ☀️ Day
    - 🌙 Night
    items:
    - label: We play outside in the sunshine
      bin: ☀️ Day
      clue: Is the sun up?
      why: The sun is up in the day.
    - label: The stars twinkle
      bin: 🌙 Night
      clue: Can you see stars when the sun is out?
      why: We see stars at night.
    - label: We go to school
      bin: ☀️ Day
      clue: Is it light outside?
      why: We go to school in the day.
    - label: We sleep in bed
      bin: 🌙 Night
      clue: Is it dark outside?
      why: We sleep at night.
    - label: The moon shines in the dark sky
      bin: 🌙 Night
      clue: Is it dark?
      why: The moon shines at night.
    - label: We eat lunch
      bin: ☀️ Day
      clue: Lunch comes in the middle of...?
      why: Lunch is in the day.
  lesson:
    - teach: In the day the sun shines ☀️ and the sky is bright. At night the sun goes away, the sky is dark, and we see the moon 🌙 and stars ⭐.
      picture:
        kind: compare
        columns:
        - title: Day
          points:
          - sun
          - bright sky
          - school and play
        - title: Night
          points:
          - moon
          - stars
          - sleep
        alt: Day and night compared.
      check:
        prompt: When is the sky dark?
        options:
        - at night
        - in the morning
        - at lunch time
        answer: at night
        why: At night the sun is gone, so the sky is dark.
      ways:
      - style: step_by_step
        teach: 'Watch the sky change. First: in the morning, look outside and see it get bright. Second: at lunch, see the sun high up. Third: in the evening, see the sky turn orange. Fourth: at night, see it go dark.'
      - style: real_world
        teach: Farmers wake up early when the sky gets light, and come home when it starts to get dark.
    - teach: In the day we wake up, go to school, eat, and play. At night we have dinner, brush our teeth, and sleep.
      picture:
        kind: flow
        steps:
        - wake up
        - school
        - play
        - dinner
        - sleep
        alt: What we do from morning to night.
      check:
        prompt: What do we do just before sleeping?
        options:
        - brush our teeth
        - go to school
        - eat breakfast
        answer: brush our teeth
        why: We brush at night so our teeth stay clean while we sleep.
      ways:
      - style: visual
        teach: Things we do in the day and things we do at night.
        picture:
          kind: compare
          columns:
          - title: Day
            points:
            - play in the park
            - eat lunch
            - read a book
          - title: Night
            points:
            - eat dinner
            - put on pyjamas
            - hear a bedtime story
          alt: In the day we play in the park, eat lunch and read a book. At night we eat dinner, put on pyjamas and hear a bedtime story.
      - style: real_world
        teach: Shops open in the morning and many close at night when people go home to rest.
    - teach: Sleep helps us grow and feel fresh. Children need a long sleep every night. Some animals, like owls, wake up at night!
      check:
        prompt: Which bird stays awake at night?
        options:
        - 🦉 owl
        - 🐓 rooster
        - 🦜 parrot
        answer: 🦉 owl
        why: Owls hunt at night and sleep in the day.
      ways:
      - style: visual
        teach: Some animals sleep at night and some wake up at night.
        picture:
          kind: compare
          columns:
          - title: Awake in the day
            points:
            - 🐿️ squirrel
            - 🦋 butterfly
          - title: Awake at night
            points:
            - 🦉 owl
            - 🦇 bat
          alt: Squirrels and butterflies are awake in the day. Owls and bats are awake at night.
      - style: step_by_step
        teach: 'Get ready for bed. First: put away your toys. Second: brush your teeth. Third: change into night clothes. Fourth: lie down, close your eyes and rest.'
  items:
  - prompt: What shines in the day?
    options:
    - ☀️ sun
    - 🌙 moon
    - ⭐ stars
    answer: ☀️ sun
    difficulty: 1
    hints:
    - Bright and hot.
    - Morning.
    solution: The sun shines in the day.
    mistakes:
      🌙 moon: lkgw_look
  - prompt: What do we see at night?
    options:
    - 🌙 moon and stars
    - ☀️ sun
    - 🌈 rainbow
    answer: 🌙 moon and stars
    difficulty: 1
    hints:
    - Dark sky.
    - Twinkle.
    solution: We see the moon and stars.
    mistakes: {"☀️ sun": "kg_night_sky", "🌈 rainbow": "kg_night_sky"}
  - prompt: 'We sleep at:'
    options:
    - night
    - noon
    - school time
    answer: night
    difficulty: 1
    hints:
    - Dark.
    - Bed time.
    solution: We sleep at night.
    mistakes: {"noon": "kg_sleep_time", "school time": "kg_sleep_time"}
  - prompt: 'We go to school in the:'
    options:
    - day
    - night
    - dream
    answer: day
    difficulty: 2
    hints:
    - Sun is out.
    - Morning.
    solution: We go to school in the day.
    mistakes: {"night": "kg_school_time", "dream": "kg_school_time"}
  - prompt: Which is the opposite of day?
    options:
    - night
    - sun
    - play
    answer: night
    difficulty: 2
    hints:
    - Not day.
    - Moon time.
    solution: Night is the opposite of day.
    mistakes: {"sun": "kg_opposite", "play": "kg_opposite"}
  - prompt: 'Sleeping early helps us:'
    options:
    - grow and feel fresh
    - feel tired
    - get sick
    answer: grow and feel fresh
    difficulty: 2
    hints:
    - Good rest.
    - Healthy habit.
    solution: Sleep helps us grow and feel fresh.
    mistakes: {"feel tired": "kg_sleep_good", "get sick": "kg_sleep_good"}
  - prompt: 'The sun comes up in the:'
    options:
    - morning
    - night
    - middle of the night
    answer: morning
    difficulty: 1
    hints:
    - It is when you wake up.
    - The start of the day.
    solution: 'Step 1: the day begins. Step 2: morning.'
    mistakes:
      night: lk5w_sky
      middle of the night: lk5w_sky
  - prompt: 'We eat breakfast in the:'
    options:
    - morning
    - night
    - evening
    answer: morning
    difficulty: 1
    hints:
    - The first meal of the day.
    - After waking up.
    solution: 'Step 1: first meal. Step 2: morning.'
    mistakes:
      night: lk5w_when
      evening: lk5w_when
  - prompt: What twinkles in the night sky?
    options:
    - ⭐ stars
    - ☀️ the sun
    - 🌈 a rainbow
    answer: ⭐ stars
    difficulty: 1
    hints:
    - Twinkle, twinkle ...
    - Many tiny lights.
    solution: 'Step 1: night sky lights. Step 2: stars.'
    mistakes:
      ☀️ the sun: lk5w_sky
      🌈 a rainbow: lk5w_sky
  - prompt: Which bird crows to wake us up in the morning?
    options:
    - 🐓 rooster
    - 🦉 owl
    - 🦇 bat
    answer: 🐓 rooster
    difficulty: 2
    hints:
    - Cock-a-doodle-doo!
    - It lives on farms.
    solution: 'Step 1: it calls at sunrise. Step 2: rooster.'
    mistakes:
      🦉 owl: lk5w_sky
      🦇 bat: lk5w_sky
  - prompt: 'After a good night''s sleep, we feel:'
    options:
    - fresh
    - very tired
    - hungry for sleep
    answer: fresh
    difficulty: 2
    hints:
    - Your body rested all night.
    - Ready to play!
    solution: 'Step 1: sleep rests the body. Step 2: fresh.'
    mistakes:
      very tired: lk5w_sleep
      hungry for sleep: lk5w_sleep
  - prompt: When do we switch on the lights at home?
    options:
    - when it gets dark
    - at noon in bright sun
    - never
    answer: when it gets dark
    difficulty: 2
    hints:
    - Lights help us see.
    - When the sun goes away.
    solution: 'Step 1: no sunlight. Step 2: switch on lights when dark.'
    mistakes:
      at noon in bright sun: lk5w_sky
      never: lk5w_sky
  - prompt: Which is the right order?
    options:
    - morning, afternoon, night
    - night, morning, afternoon
    - afternoon, morning, night
    answer: morning, afternoon, night
    difficulty: 3
    hints:
    - Start when you wake up.
    - End when you go to bed.
    solution: 'Step 1: wake in the morning. Step 2: afternoon, then night.'
    mistakes:
      night, morning, afternoon: lk5w_when
      afternoon, morning, night: lk5w_when
  - prompt: 'Bats and owls sleep in the:'
    options:
    - day
    - night
    - rain only
    answer: day
    difficulty: 3
    hints:
    - They are awake when we sleep.
    - So when do they rest?
    solution: 'Step 1: they are awake at night. Step 2: they sleep in the day.'
    mistakes:
      night: lk5w_when
      rain only: lk5w_when
  - prompt: Which do we do at night?
    options:
    - sleep in bed
    - go to school
    - eat lunch
    answer: sleep in bed
    difficulty: 1
    hints:
    - The sky is dark and you are tired.
    - Pyjama time.
    solution: 'Step 1: night is for rest. Step 2: sleep.'
    mistakes:
      go to school: lk5w_when
      eat lunch: lk5w_when
  - prompt: 'Case: It is late at night. Tara wants to keep playing with her blocks, but she has school tomorrow. What is best?'
    options:
    - put the blocks away and go to sleep
    - play until midnight
    - watch TV all night
    answer: put the blocks away and go to sleep
    hints:
    - What helps us grow and feel fresh?
    - What is night time for?
    solution: Night is for sleeping. A long sleep helps Tara grow and feel fresh for school.
    mistakes:
      play until midnight: lk5w_sleep
      watch TV all night: lk5w_sleep
    exam: case
    difficulty: 2
  - prompt: 'Situation: Ravi looks out of the window. The sky is bright and the sun is shining. Is it day or night?'
    options:
    - day
    - night
    - midnight
    answer: day
    hints:
    - When do we see the sun?
    - Is the sky bright or dark?
    solution: The sun shines and the sky is bright in the day, so it is day.
    mistakes:
      night: lk5w_sky
      midnight: lk5w_sky
    exam: competency
    difficulty: 2
