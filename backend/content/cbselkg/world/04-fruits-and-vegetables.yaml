# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 4
title: Fruits and Vegetables
tips:
  kg_banana: "Peel a ripe banana in your mind. What colour is the skin?"
  kg_carrot: "Think of carrot halwa or a raw carrot in your lunch box. What colour is it?"
  kg_healthy: "Which food grows on trees and plants, and makes us strong?"
  kg_veg: "Fruits are sweet and we eat them as they are. Which one goes into a curry or sambar?"
  kg_wash_fruit: "Fruit comes from a shop with dust on it. What do we do at the tap first?"

concepts:
- code: lkgw.food
  title: Fruits and Vegetables
  notes: |
    Common fruits and vegetables, their colours and tastes; healthy eating; washing fruit.
  explanations:
    text: Fruits like mango and banana are sweet. Vegetables like carrot and spinach make us strong. Wash them before eating.
    visual: Draw a basket with a mango, a banana, a carrot and some spinach.
    step_by_step: 'Step 1: Name it. Step 2: Say its colour. Step 3: Say if it is a fruit or a vegetable.'
    real_world: At the market, we choose fresh fruits and vegetables.
  picture:
    kind: compare
    columns:
    - title: Fruits
      points:
      - 🥭 mango
      - 🍌 banana
      - 🍎 apple
    - title: Vegetables
      points:
      - 🥕 carrot
      - 🥔 potato
      - 🍅 tomato
    alt: 'Fruits: mango, banana, apple. Vegetables: carrot, potato, tomato.'
  activity:
    type: sort
    prompt: Fruit or vegetable?
    bins:
    - Fruit
    - Vegetable
    items:
    - label: 🥭 Mango
      bin: Fruit
      clue: Is it sweet and juicy?
      why: A mango is a sweet fruit.
    - label: 🥕 Carrot
      bin: Vegetable
      clue: It grows under the soil.
      why: A carrot is a vegetable.
    - label: 🍌 Banana
      bin: Fruit
      clue: Peel it and eat it sweet.
      why: A banana is a fruit.
    - label: 🥬 Spinach
      bin: Vegetable
      clue: Green leaves we cook.
      why: Spinach is a vegetable.
    - label: 🍇 Grapes
      bin: Fruit
      clue: Small, sweet and round.
      why: Grapes are fruit.
    - label: 🧅 Onion
      bin: Vegetable
      clue: It can make your eyes water when cut.
      why: An onion is a vegetable.
  items:
  - prompt: Which is a fruit?
    options:
    - 🥭 mango
    - 🥔 potato
    - 🧅 onion
    answer: 🥭 mango
    difficulty: 1
    hints:
    - Sweet.
    - King of fruits.
    solution: A mango is a fruit.
    mistakes:
      🥔 potato: lkgw_look
  - prompt: Which is a vegetable?
    options:
    - 🥕 carrot
    - 🍌 banana
    - 🍇 grapes
    answer: 🥕 carrot
    difficulty: 1
    hints:
    - Orange and long.
    - Rabbits like it.
    solution: A carrot is a vegetable.
    mistakes: {"🍌 banana": "kg_veg", "🍇 grapes": "kg_veg"}
  - prompt: What colour is a carrot?
    options:
    - orange
    - blue
    - black
    answer: orange
    difficulty: 1
    hints:
    - Look at it.
    - Like an orange.
    solution: A carrot is orange.
    mistakes: {"blue": "kg_carrot", "black": "kg_carrot"}
  - prompt: 'Before eating fruit we should:'
    options:
    - wash it
    - drop it
    - hide it
    answer: wash it
    difficulty: 2
    hints:
    - Dust and germs.
    - Water.
    solution: Wash fruit before eating.
    mistakes: {"drop it": "kg_wash_fruit", "hide it": "kg_wash_fruit"}
  - prompt: Which food is healthy every day?
    options:
    - fruits
    - too many sweets
    - chips
    answer: fruits
    difficulty: 2
    hints:
    - Good for the body.
    - From trees.
    solution: Fruits are healthy.
    mistakes: {"too many sweets": "kg_healthy", "chips": "kg_healthy"}
  - prompt: 'A banana is:'
    options:
    - yellow
    - purple
    - green and red
    answer: yellow
    difficulty: 1
    hints:
    - Ripe banana.
    - Like the sun.
    solution: A ripe banana is yellow.
    mistakes: {"purple": "kg_banana", "green and red": "kg_banana"}
