# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 4
title: Fruits and Vegetables
tips:
  kg_banana: "Peel a ripe banana in your mind. What colour is the skin?"
  kg_carrot: "Think of carrot halwa or a raw carrot in your lunch box. What colour is it?"
  kg_healthy: "Which food grows on trees and plants, and makes us strong?"
  kg_veg: "Fruits are sweet and we eat them as they are. Which one goes into a curry or sambar?"
  kg_wash_fruit: "Fruit comes from a shop with dust on it. What do we do at the tap first?"
  lk4w_kind: Is it sweet and usually eaten raw like a fruit, or cooked in sabzi like a vegetable?
  lk4w_colour: Picture the real thing in the kitchen. What colour is it?
  lk4w_taste: "Imagine tasting it. How does your mouth feel?"

concepts:
- code: lkgw.food
  title: Fruits and Vegetables
  notes: |
    Common fruits and vegetables, their colours and tastes; healthy eating; washing fruit.
  explanations:
    text: Fruits like mango and banana are sweet. Vegetables like carrot and spinach make us strong. Wash them before eating.
    visual: Draw a basket with a mango, a banana, a carrot and some spinach.
    step_by_step: 'Step 1: Name it. Step 2: Say its colour. Step 3: Say if it is a fruit or a vegetable.'
    real_world: At the market, we choose fresh fruits and vegetables.
  picture:
    kind: compare
    columns:
    - title: Fruits
      points:
      - 🥭 mango
      - 🍌 banana
      - 🍎 apple
    - title: Vegetables
      points:
      - 🥕 carrot
      - 🥔 potato
      - 🍅 tomato
    alt: 'Fruits: mango, banana, apple. Vegetables: carrot, potato, tomato.'
  activity:
    type: sort
    prompt: Fruit or vegetable?
    bins:
    - Fruit
    - Vegetable
    items:
    - label: 🥭 Mango
      bin: Fruit
      clue: Is it sweet and juicy?
      why: A mango is a sweet fruit.
    - label: 🥕 Carrot
      bin: Vegetable
      clue: It grows under the soil.
      why: A carrot is a vegetable.
    - label: 🍌 Banana
      bin: Fruit
      clue: Peel it and eat it sweet.
      why: A banana is a fruit.
    - label: 🥬 Spinach
      bin: Vegetable
      clue: Green leaves we cook.
      why: Spinach is a vegetable.
    - label: 🍇 Grapes
      bin: Fruit
      clue: Small, sweet and round.
      why: Grapes are fruit.
    - label: 🧅 Onion
      bin: Vegetable
      clue: It can make your eyes water when cut.
      why: An onion is a vegetable.
  lesson:
    - teach: 'Fruits are usually sweet and we eat them raw: mango, banana, apple, grapes, orange. Fruits grow on trees and plants.'
      check:
        prompt: Which one is a fruit?
        options:
        - 🍇 grapes
        - 🥔 potato
        - 🧅 onion
        answer: 🍇 grapes
        why: Grapes are sweet and eaten raw.
      ways:
      - style: visual
        teach: 'Some fruits and where they grow: on a tall tree, a small plant or a palm.'
        picture:
          kind: compare
          columns:
          - title: Fruit
            points:
            - 🥥 coconut
            - 🍓 strawberry
            - 🍈 guava
          - title: Grows on
            points:
            - a tall palm tree
            - a small plant
            - a tree
          alt: A coconut grows on a tall palm tree, a strawberry on a small plant, and a guava on a tree.
      - style: real_world
        teach: At the fruit stall, the seller lets you smell a ripe guava. A sweet smell means it is ready to eat.
    - teach: 'Vegetables are often cooked: potato, onion, carrot, spinach, brinjal, peas. Some we eat raw too, like cucumber and carrot.'
      picture:
        kind: compare
        columns:
        - title: Fruits
          points:
          - mango
          - banana
          - apple
        - title: Vegetables
          points:
          - potato
          - brinjal
          - spinach
        alt: Fruits and vegetables.
      check:
        prompt: Which of these do we cook as a vegetable?
        options:
        - 🍆 brinjal
        - 🍌 banana
        - 🥭 mango
        answer: 🍆 brinjal
        why: Brinjal is cooked as a vegetable.
      ways:
      - style: step_by_step
        teach: 'Help make a salad. First: a grown-up washes the cucumber and tomato. Second: a grown-up cuts them. Third: you put the pieces in a bowl. Fourth: you mix them with a big spoon.'
      - style: real_world
        teach: At the vegetable market, sellers keep beans, ladyfingers and gourds in big piles.
    - teach: Fruits and vegetables come in many colours and tastes. A lemon is yellow and sour. A watermelon is green outside and red inside. Eat many colours every day!
      check:
        prompt: 'A lemon tastes:'
        options:
        - sour
        - sweet like a laddoo
        - salty like chips
        answer: sour
        why: 'Lemons make your mouth pucker: that is sour.'
      ways:
      - style: visual
        teach: Some foods and how they taste, side by side.
        picture:
          kind: compare
          columns:
          - title: Food
            points:
            - 🍯 honey
            - raw green mango
            - bitter gourd
          - title: Taste
            points:
            - sweet
            - sour
            - bitter
          alt: Honey tastes sweet, a raw green mango tastes sour and bitter gourd tastes bitter.
      - style: step_by_step
        teach: 'Eat a rainbow. First: pick one red food. Second: pick one green food. Third: pick one yellow food. Fourth: put them all on your plate and enjoy many colours.'
  items:
  - prompt: Which is a fruit?
    options:
    - 🥭 mango
    - 🥔 potato
    - 🧅 onion
    answer: 🥭 mango
    difficulty: 1
    hints:
    - Sweet.
    - King of fruits.
    solution: A mango is a fruit.
    mistakes:
      🥔 potato: lkgw_look
  - prompt: Which is a vegetable?
    options:
    - 🥕 carrot
    - 🍌 banana
    - 🍇 grapes
    answer: 🥕 carrot
    difficulty: 1
    hints:
    - Orange and long.
    - Rabbits like it.
    solution: A carrot is a vegetable.
    mistakes: {"🍌 banana": "kg_veg", "🍇 grapes": "kg_veg"}
  - prompt: What colour is a carrot?
    options:
    - orange
    - blue
    - black
    answer: orange
    difficulty: 1
    hints:
    - Look at it.
    - Like an orange.
    solution: A carrot is orange.
    mistakes: {"blue": "kg_carrot", "black": "kg_carrot"}
  - prompt: 'Before eating fruit we should:'
    options:
    - wash it
    - drop it
    - hide it
    answer: wash it
    difficulty: 2
    hints:
    - Dust and germs.
    - Water.
    solution: Wash fruit before eating.
    mistakes: {"drop it": "kg_wash_fruit", "hide it": "kg_wash_fruit"}
  - prompt: Which food is healthy every day?
    options:
    - fruits
    - too many sweets
    - chips
    answer: fruits
    difficulty: 2
    hints:
    - Good for the body.
    - From trees.
    solution: Fruits are healthy.
    mistakes: {"too many sweets": "kg_healthy", "chips": "kg_healthy"}
  - prompt: 'A banana is:'
    options:
    - yellow
    - purple
    - green and red
    answer: yellow
    difficulty: 1
    hints:
    - Ripe banana.
    - Like the sun.
    solution: A ripe banana is yellow.
    mistakes: {"purple": "kg_banana", "green and red": "kg_banana"}
  - prompt: Which one is a vegetable?
    options:
    - 🥔 potato
    - 🍎 apple
    - 🍊 orange
    answer: 🥔 potato
    difficulty: 1
    hints:
    - Which one grows under the ground?
    - We cook it in sabzi.
    solution: 'Step 1: apple and orange are fruits. Step 2: potato is a vegetable.'
    mistakes:
      🍎 apple: lk4w_kind
      🍊 orange: lk4w_kind
  - prompt: What colour is a ripe tomato?
    options:
    - red
    - blue
    - black
    answer: red
    difficulty: 1
    hints:
    - Picture a tomato in a salad.
    - Same as an apple.
    solution: 'Step 1: ripe tomatoes. Step 2: red.'
    mistakes:
      blue: lk4w_colour
      black: lk4w_colour
  - prompt: 'Inside a watermelon is:'
    options:
    - red
    - blue
    - brown
    answer: red
    difficulty: 2
    hints:
    - Cut it open in your mind.
    - Juicy with black seeds.
    solution: 'Step 1: green outside. Step 2: red inside.'
    mistakes:
      blue: lk4w_colour
      brown: lk4w_colour
  - prompt: Which is a green leafy vegetable?
    options:
    - spinach (palak)
    - potato
    - onion
    answer: spinach (palak)
    difficulty: 2
    hints:
    - We eat its leaves.
    - Green and soft.
    solution: 'Step 1: leaves we eat. Step 2: spinach.'
    mistakes:
      potato: lk4w_kind
      onion: lk4w_kind
  - prompt: 'A ripe mango tastes:'
    options:
    - sweet
    - salty
    - bitter
    answer: sweet
    difficulty: 1
    hints:
    - The king of fruits in summer.
    - Like honey.
    solution: 'Step 1: ripe mangoes. Step 2: sweet.'
    mistakes:
      salty: lk4w_taste
      bitter: lk4w_taste
  - prompt: Which fruit do we peel before eating?
    options:
    - 🍌 banana
    - 🍇 grapes
    - 🍓 strawberry
    answer: 🍌 banana
    difficulty: 2
    hints:
    - It has a thick skin.
    - Long and yellow.
    solution: 'Step 1: thick yellow skin. Step 2: banana.'
    mistakes:
      🍇 grapes: lk4w_kind
      🍓 strawberry: lk4w_kind
  - prompt: Which vegetable makes our eyes water when we cut it?
    options:
    - 🧅 onion
    - 🥒 cucumber
    - 🥕 carrot
    answer: 🧅 onion
    difficulty: 3
    hints:
    - Grown-ups cry a little while cutting it.
    - It has many thin layers.
    solution: 'Step 1: its juice stings the eyes. Step 2: onion.'
    mistakes:
      🥒 cucumber: lk4w_kind
      🥕 carrot: lk4w_kind
  - prompt: Why should we eat fruits and vegetables?
    options:
    - "to stay healthy and strong"
    - "to get very sleepy"
    - "to feel cold all day"
    answer: to stay healthy and strong
    difficulty: 2
    hints:
    - They help our body grow.
    - Good food, strong body.
    solution: 'Step 1: they have good things for our body. Step 2: healthy and strong.'
    mistakes:
      "to get very sleepy": lk4w_taste
      "to feel cold all day": lk4w_taste
  - prompt: Which fruit has a spiky crown of leaves on top?
    options:
    - 🍍 pineapple
    - 🥔 potato
    - 🧅 onion
    answer: 🍍 pineapple
    difficulty: 3
    hints:
    - It has spiky leaves on top.
    - Yellow inside, sweet and sour.
    solution: 'Step 1: spiky crown. Step 2: pineapple.'
    mistakes:
      🥔 potato: lk4w_kind
      🧅 onion: lk4w_kind
  - prompt: 'Case: Sam bought grapes from the market and wants to eat them right away. What should Sam do first?'
    options:
    - wash the grapes
    - eat them straight from the bag
    - put them on the floor
    answer: wash the grapes
    hints:
    - Fruit from the market has dust on it.
    - What makes fruit clean to eat?
    solution: Washing fruit removes dust and germs, so Sam should wash the grapes first.
    mistakes:
      eat them straight from the bag: kg_wash_fruit
      put them on the floor: kg_wash_fruit
    exam: case
    difficulty: 2
  - prompt: 'Situation: Amma is cooking sabzi for lunch. Which of these will most likely go in the sabzi?'
    options:
    - 🫛 peas
    - 🍇 grapes
    - 🍓 strawberry
    answer: 🫛 peas
    hints:
    - Sabzi is made with vegetables.
    - Which one is a vegetable, not a sweet fruit?
    solution: Peas are a vegetable that we cook, so they go in the sabzi.
    mistakes:
      🍇 grapes: lk4w_kind
      🍓 strawberry: lk4w_kind
    exam: competency
    difficulty: 2
