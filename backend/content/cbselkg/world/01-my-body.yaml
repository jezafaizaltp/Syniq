# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 1
title: My Body
tips:
  lkgw_look: Look at the picture again. Say what you see.
  lkgw_think: Think about your home and your day. What happens there?
  kg_clean_hands: "Hands touch many things. Germs on hands can go into our food. What keeps food clean?"
  lk1w_part: Point to that part of your body. What does it help you do?
  lk1w_count: Touch each one on yourself and count.
  lk1w_clean: Think what keeps germs away from your body.
concepts:
- code: lkgw.body
  title: My Body
  notes: |
    Parts of the body and what they do: eyes see, ears hear, nose smells, hands hold, feet walk; keeping clean.
  explanations:
    text: Our body has many parts. Eyes see, ears hear, nose smells, mouth eats and talks, hands hold, feet walk.
    visual: 'Draw yourself and label: eyes, ears, nose, mouth, hands, feet.'
    step_by_step: 'Step 1: Point to the part. Step 2: Say its name. Step 3: Say what it does.'
    real_world: Wash your hands before eating to keep germs away.
  picture:
    kind: compare
    columns:
    - title: Part
      points:
      - 👀 eyes
      - 👂 ears
      - 👃 nose
    - title: We
      points:
      - see
      - hear
      - smell
    alt: We see with our eyes, hear with our ears and smell with our nose.
  activity:
    type: sort
    prompt: Which part do we use?
    bins:
    - 👀 Eyes
    - 👂 Ears
    - 👃 Nose
    items:
    - label: To see a rainbow 🌈
      bin: 👀 Eyes
      clue: Close them. Can you still see it?
      why: We see with our eyes.
    - label: To hear a song 🎵
      bin: 👂 Ears
      clue: Cover them. Is the song quieter?
      why: We hear with our ears.
    - label: To smell a flower 🌸
      bin: 👃 Nose
      clue: Breathe in slowly.
      why: We smell with our nose.
    - label: To watch a bird 🐦
      bin: 👀 Eyes
      clue: Which part looks?
      why: We see with our eyes.
    - label: To hear a dog bark 🐶
      bin: 👂 Ears
      clue: Which part listens?
      why: We hear with our ears.
    - label: To smell food cooking 🍲
      bin: 👃 Nose
      clue: Which part sniffs?
      why: We smell with our nose.
  lesson:
    - teach: Our body has many parts. Head, shoulders, knees and toes! Point to each part as you say it.
      check:
        prompt: Which part is at the very top of your body?
        options:
        - head
        - knees
        - toes
        answer: head
        why: The head is on top; toes are at the bottom.
    - teach: 'Each part has a job: eyes see 👀, ears hear 👂, nose smells 👃, tongue tastes 👅, hands hold ✋, feet walk 🦶.'
      picture:
        kind: compare
        columns:
        - title: Part
          points:
          - eyes
          - tongue
          - hands
        - title: Job
          points:
          - see
          - taste
          - hold
        alt: Body parts and their jobs.
      check:
        prompt: 'We taste food with our:'
        options:
        - 👅 tongue
        - 👂 ears
        - 🦶 feet
        answer: 👅 tongue
        why: The tongue tells sweet, salty and sour.
    - teach: 'We keep our body clean: wash hands, bathe, brush teeth and cut nails. A clean body stays healthy.'
      check:
        prompt: What do we brush every morning and night?
        options:
        - teeth
        - ears
        - knees
        answer: teeth
        why: Brushing keeps teeth clean and strong.
  items:
  - prompt: 'We see with our:'
    options:
    - 👀 eyes
    - 👂 ears
    - 🦶 feet
    answer: 👀 eyes
    difficulty: 1
    hints:
    - Open and close them.
    - On your face.
    solution: We see with our eyes.
    mistakes:
      👂 ears: lkgw_look
  - prompt: 'We hear with our:'
    options:
    - 👂 ears
    - 👃 nose
    - ✋ hands
    answer: 👂 ears
    difficulty: 1
    hints:
    - Music goes in here.
    - On the sides of your head.
    solution: We hear with our ears.
    mistakes: {"👃 nose": "kg_body_job", "✋ hands": "kg_body_job"}
  - prompt: 'We walk with our:'
    options:
    - 🦶 feet
    - 👀 eyes
    - 👂 ears
    answer: 🦶 feet
    difficulty: 1
    hints:
    - At the bottom.
    - Wear shoes on them.
    solution: We walk with our feet.
    mistakes: {"👀 eyes": "kg_body_job", "👂 ears": "kg_body_job"}
  - prompt: 'We smell flowers with our:'
    options:
    - 👃 nose
    - ✋ hands
    - 🦶 feet
    answer: 👃 nose
    difficulty: 2
    hints:
    - In the middle of your face.
    - Sniff!
    solution: We smell with our nose.
    mistakes: {"✋ hands": "kg_body_job", "🦶 feet": "kg_body_job"}
  - prompt: How many eyes do you have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Touch them.
    - One, two.
    solution: We have 2 eyes.
    mistakes:
      '1': lkgw_look
  - prompt: 'Before eating we should:'
    options:
    - wash our hands
    - play in mud
    - sleep
    answer: wash our hands
    difficulty: 2
    hints:
    - Keep germs away.
    - Soap and water.
    solution: Wash your hands before eating.
    mistakes: {"play in mud": "kg_clean_hands", "sleep": "kg_clean_hands"}
  - prompt: 'We hold a cup with our:'
    options:
    - ✋ hands
    - 👂 ears
    - 👃 nose
    answer: ✋ hands
    difficulty: 1
    hints:
    - What do your fingers do?
    - Pick it up!
    solution: 'Step 1: holding needs fingers. Step 2: hands.'
    mistakes:
      👂 ears: lk1w_part
      👃 nose: lk1w_part
  - prompt: How many ears do you have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Touch one side of your head, then the other.
    - Count them.
    solution: 'Step 1: one on each side. Step 2: 2 ears.'
    mistakes:
      '1': lk1w_count
      '3': lk1w_count
  - prompt: How many fingers on one hand?
    answer: '5'
    check: '5'
    difficulty: 1
    hints:
    - Hold up one hand.
    - Count each finger.
    solution: 'Step 1: thumb and four more. Step 2: 5.'
    mistakes:
      '4': lk1w_count
      '10': lk1w_count
  - prompt: Which part helps us hear music?
    options:
    - 👂 ears
    - 👀 eyes
    - 👅 tongue
    answer: 👂 ears
    difficulty: 1
    hints:
    - Cover them and the music gets quiet.
    - On the sides of your head.
    solution: 'Step 1: sounds come in through them. Step 2: ears.'
    mistakes:
      👀 eyes: lk1w_part
      👅 tongue: lk1w_part
  - prompt: 'We bend our legs at the:'
    options:
    - knees
    - elbows
    - neck
    answer: knees
    difficulty: 2
    hints:
    - Sit down on the floor.
    - In the middle of your leg.
    solution: 'Step 1: legs fold in the middle. Step 2: knees.'
    mistakes:
      elbows: lk1w_part
      neck: lk1w_part
  - prompt: Why do we wash hands before eating?
    options:
    - to wash away germs
    - to make them wet for fun
    - to make them cold
    answer: to wash away germs
    difficulty: 2
    hints:
    - Hands touch many things.
    - Tiny things we cannot see can make us ill.
    solution: 'Step 1: hands carry germs. Step 2: washing removes them.'
    mistakes:
      to make them wet for fun: lk1w_clean
      to make them cold: lk1w_clean
  - prompt: How many legs do you have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Stand up and look down.
    - Count them.
    solution: 'Step 1: left and right. Step 2: 2 legs.'
    mistakes:
      '4': lk1w_count
      '1': lk1w_count
  - prompt: Which part do we use to smell food cooking?
    options:
    - 👃 nose
    - ✋ hands
    - 🦵 legs
    answer: 👃 nose
    difficulty: 2
    hints:
    - Sniff, sniff!
    - In the middle of your face.
    solution: 'Step 1: smells come in with air. Step 2: nose.'
    mistakes:
      ✋ hands: lk1w_part
      🦵 legs: lk1w_part
  - prompt: Two hands. How many fingers in all?
    answer: '10'
    check: 5+5
    difficulty: 3
    hints:
    - One hand has how many?
    - Count both hands.
    solution: 'Step 1: 5 and 5. Step 2: 10.'
    mistakes:
      '5': lk1w_count
      '8': lk1w_count
