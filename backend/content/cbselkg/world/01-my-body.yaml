# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 1
title: My Body
tips:
  lkgw_look: Look at the picture again. Say what you see.
  lkgw_think: Think about your home and your day. What happens there?
  kg_clean_hands: "Hands touch many things. Germs on hands can go into our food. What keeps food clean?"
concepts:
- code: lkgw.body
  title: My Body
  notes: |
    Parts of the body and what they do: eyes see, ears hear, nose smells, hands hold, feet walk; keeping clean.
  explanations:
    text: Our body has many parts. Eyes see, ears hear, nose smells, mouth eats and talks, hands hold, feet walk.
    visual: 'Draw yourself and label: eyes, ears, nose, mouth, hands, feet.'
    step_by_step: 'Step 1: Point to the part. Step 2: Say its name. Step 3: Say what it does.'
    real_world: Wash your hands before eating to keep germs away.
  picture:
    kind: compare
    columns:
    - title: Part
      points:
      - 👀 eyes
      - 👂 ears
      - 👃 nose
    - title: We
      points:
      - see
      - hear
      - smell
    alt: We see with our eyes, hear with our ears and smell with our nose.
  activity:
    type: sort
    prompt: Which part do we use?
    bins:
    - 👀 Eyes
    - 👂 Ears
    - 👃 Nose
    items:
    - label: To see a rainbow 🌈
      bin: 👀 Eyes
      clue: Close them. Can you still see it?
      why: We see with our eyes.
    - label: To hear a song 🎵
      bin: 👂 Ears
      clue: Cover them. Is the song quieter?
      why: We hear with our ears.
    - label: To smell a flower 🌸
      bin: 👃 Nose
      clue: Breathe in slowly.
      why: We smell with our nose.
    - label: To watch a bird 🐦
      bin: 👀 Eyes
      clue: Which part looks?
      why: We see with our eyes.
    - label: To hear a dog bark 🐶
      bin: 👂 Ears
      clue: Which part listens?
      why: We hear with our ears.
    - label: To smell food cooking 🍲
      bin: 👃 Nose
      clue: Which part sniffs?
      why: We smell with our nose.
  items:
  - prompt: 'We see with our:'
    options:
    - 👀 eyes
    - 👂 ears
    - 🦶 feet
    answer: 👀 eyes
    difficulty: 1
    hints:
    - Open and close them.
    - On your face.
    solution: We see with our eyes.
    mistakes:
      👂 ears: lkgw_look
  - prompt: 'We hear with our:'
    options:
    - 👂 ears
    - 👃 nose
    - ✋ hands
    answer: 👂 ears
    difficulty: 1
    hints:
    - Music goes in here.
    - On the sides of your head.
    solution: We hear with our ears.
    mistakes: {"👃 nose": "kg_body_job", "✋ hands": "kg_body_job"}
  - prompt: 'We walk with our:'
    options:
    - 🦶 feet
    - 👀 eyes
    - 👂 ears
    answer: 🦶 feet
    difficulty: 1
    hints:
    - At the bottom.
    - Wear shoes on them.
    solution: We walk with our feet.
    mistakes: {"👀 eyes": "kg_body_job", "👂 ears": "kg_body_job"}
  - prompt: 'We smell flowers with our:'
    options:
    - 👃 nose
    - ✋ hands
    - 🦶 feet
    answer: 👃 nose
    difficulty: 2
    hints:
    - In the middle of your face.
    - Sniff!
    solution: We smell with our nose.
    mistakes: {"✋ hands": "kg_body_job", "🦶 feet": "kg_body_job"}
  - prompt: How many eyes do you have?
    answer: '2'
    check: '2'
    difficulty: 1
    hints:
    - Touch them.
    - One, two.
    solution: We have 2 eyes.
    mistakes:
      '1': lkgw_look
  - prompt: 'Before eating we should:'
    options:
    - wash our hands
    - play in mud
    - sleep
    answer: wash our hands
    difficulty: 2
    hints:
    - Keep germs away.
    - Soap and water.
    solution: Wash your hands before eating.
    mistakes: {"play in mud": "kg_clean_hands", "sleep": "kg_clean_hands"}
