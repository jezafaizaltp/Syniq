# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 6
title: My Feelings
concepts:
- code: lkgw.feel
  title: My Feelings
  notes: |
    Naming feelings (happy, sad, angry, scared); what helps when we feel upset; being kind to friends.
  explanations:
    text: 'We all have feelings: happy 😊, sad 😢, angry 😠 and scared 😨. When we feel upset, we can take a deep breath and tell a grown-up.'
    visual: 'Draw four faces: happy, sad, angry and scared.'
    step_by_step: 'Step 1: Look at the face. Step 2: Name the feeling. Step 3: Think what could help.'
    real_world: If a friend is crying, we can ask, 'Are you okay?'
  picture:
    kind: compare
    columns:
    - title: Face
      points:
      - 😊
      - 😢
      - 😠
    - title: Feeling
      points:
      - happy
      - sad
      - angry
    alt: A smiling face is happy, a crying face is sad and a frowning face is angry.
  activity:
    type: sort
    prompt: How do they feel?
    bins:
    - 😊 Happy
    - 😢 Sad
    - 😨 Scared
    items:
    - label: Got a birthday hug
      bin: 😊 Happy
      clue: Would you smile or cry?
      why: A hug on your birthday makes us happy. Feeling happy is good.
    - label: Dropped their ice cream
      bin: 😢 Sad
      clue: Lost something they liked.
      why: We can feel sad. A hug or a kind word helps.
    - label: Heard loud thunder at night
      bin: 😨 Scared
      clue: A big sudden noise in the dark.
      why: Feeling scared is okay. Hold a grown-up's hand and take a deep breath.
    - label: Their friend came to play
      bin: 😊 Happy
      clue: Would you smile?
      why: Playing with a friend makes us happy.
    - label: Their balloon flew away
      bin: 😢 Sad
      clue: Something they liked is gone.
      why: Feeling sad is okay. We can tell someone.
    - label: Lost mother in a big shop
      bin: 😨 Scared
      clue: Alone and can't find her.
      why: It's okay to feel scared. Stand still and ask a shop helper.
  items:
  - prompt: '😊 This face is:'
    options:
    - happy
    - sad
    - angry
    answer: happy
    difficulty: 1
    hints:
    - A big smile.
    - Joy.
    solution: It is happy.
    mistakes:
      sad: lkgw_look
  - prompt: '😢 This face is:'
    options:
    - sad
    - happy
    - sleepy
    answer: sad
    difficulty: 1
    hints:
    - Tears.
    - Crying.
    solution: It is sad.
  - prompt: 'When we feel angry, we can:'
    options:
    - take a deep breath
    - hit someone
    - throw things
    answer: take a deep breath
    difficulty: 2
    hints:
    - Calm down first.
    - Breathe in, breathe out.
    solution: Take a deep breath to calm down.
  - prompt: 'A friend is crying. We can:'
    options:
    - ask if they are okay
    - laugh at them
    - walk away
    answer: ask if they are okay
    difficulty: 1
    hints:
    - Be kind.
    - How would you feel?
    solution: Ask if they are okay.
  - prompt: 'When we are scared, we can:'
    options:
    - tell a grown-up
    - hide forever
    - keep it secret
    answer: tell a grown-up
    difficulty: 2
    hints:
    - Someone who looks after you.
    - Mother, teacher.
    solution: Tell a grown-up you trust.
  - prompt: '😠 This face is:'
    options:
    - angry
    - happy
    - sleepy
    answer: angry
    difficulty: 2
    hints:
    - Frowning eyebrows.
    - Cross.
    solution: It is angry.
