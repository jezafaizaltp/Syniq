# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 6
title: My Feelings
tips:
  kg_calm: "Hitting and throwing can hurt others. What can you do with your own body to feel calm?"
  kg_face: "Make the same face in a mirror. How do you feel when your face looks like that?"
  kg_kind_friend: "If you were crying, what would you want a friend to do?"
  kg_tell: "Being scared is easier when someone big helps. Who can you go to?"
  lk6w_face: Make that face yourself. How do you feel when your face looks like that?
  lk6w_calm: Think what helps a big feeling get smaller, without hurting anyone.
  lk6w_kind: Think how the other child feels. What would make them feel better?

concepts:
- code: lkgw.feel
  title: My Feelings
  notes: |
    Naming feelings (happy, sad, angry, scared); what helps when we feel upset; being kind to friends.
  explanations:
    text: 'We all have feelings: happy 😊, sad 😢, angry 😠 and scared 😨. When we feel upset, we can take a deep breath and tell a grown-up.'
    visual: 'Draw four faces: happy, sad, angry and scared.'
    step_by_step: 'Step 1: Look at the face. Step 2: Name the feeling. Step 3: Think what could help.'
    real_world: If a friend is crying, we can ask, 'Are you okay?'
  picture:
    kind: compare
    columns:
    - title: Face
      points:
      - 😊
      - 😢
      - 😠
    - title: Feeling
      points:
      - happy
      - sad
      - angry
    alt: A smiling face is happy, a crying face is sad and a frowning face is angry.
  activity:
    type: sort
    prompt: How do they feel?
    bins:
    - 😊 Happy
    - 😢 Sad
    - 😨 Scared
    items:
    - label: Got a birthday hug
      bin: 😊 Happy
      clue: Would you smile or cry?
      why: A hug on your birthday makes us happy. Feeling happy is good.
    - label: Dropped their ice cream
      bin: 😢 Sad
      clue: Lost something they liked.
      why: We can feel sad. A hug or a kind word helps.
    - label: Heard loud thunder at night
      bin: 😨 Scared
      clue: A big sudden noise in the dark.
      why: Feeling scared is okay. Hold a grown-up's hand and take a deep breath.
    - label: Their friend came to play
      bin: 😊 Happy
      clue: Would you smile?
      why: Playing with a friend makes us happy.
    - label: Their balloon flew away
      bin: 😢 Sad
      clue: Something they liked is gone.
      why: Feeling sad is okay. We can tell someone.
    - label: Lost mother in a big shop
      bin: 😨 Scared
      clue: Alone and can't find her.
      why: It's okay to feel scared. Stand still and ask a shop helper.
  lesson:
    - teach: 'We all have feelings: happy 😊, sad 😢, angry 😠, scared 😨, surprised 😮. All feelings are okay. Our face often shows how we feel.'
      picture:
        kind: compare
        columns:
        - title: Face
          points:
          - smile
          - tears
          - frown
        - title: Feeling
          points:
          - happy
          - sad
          - angry
        alt: Faces and the feelings they show.
      check:
        prompt: '😮 This face is:'
        options:
        - surprised
        - sleepy
        - sad
        answer: surprised
        why: Open mouth and big eyes show surprise.
      ways:
      - style: visual
        teach: Some things that happen, and a feeling they might bring.
        picture:
          kind: compare
          columns:
          - title: What happens
            points:
            - a friend comes to play
            - a loud thunder clap
            - a surprise party
          - title: A feeling
            points:
            - happy
            - scared
            - surprised
          alt: A friend coming to play might make you happy. A loud thunder clap might make you scared. A surprise party might make you surprised.
      - style: step_by_step
        teach: 'Play the face game. First: look in a mirror. Second: make a happy face. Third: make a sad face. Fourth: make a surprised face, and see how your mouth and eyes change.'
    - teach: 'When a feeling is big, we can calm down: take slow deep breaths, count to five, hug a soft toy, or talk to a grown-up.'
      picture:
        kind: flow
        steps:
        - stop
        - breathe in slowly
        - breathe out slowly
        - talk about it
        alt: Steps to calm a big feeling.
      check:
        prompt: You feel very angry. What helps?
        options:
        - breathe slowly and count to five
        - hit someone
        - throw things
        answer: breathe slowly and count to five
        why: Slow breaths help the angry feeling get smaller.
      ways:
      - style: step_by_step
        teach: 'Smell the flower, blow the candle. First: pretend to hold a flower. Second: breathe in slowly through your nose. Third: pretend to hold a candle. Fourth: breathe out slowly through your mouth, and do it three times.'
      - style: real_world
        teach: Some classrooms have a quiet corner with soft cushions where a child can sit and calm down.
    - teach: We notice how friends feel. If a friend is sad, we can sit with them, share, or ask 'Are you okay?'. Kind words make people feel better.
      check:
        prompt: 'A friend has no one to play with. You can:'
        options:
        - invite them to play
        - laugh at them
        - walk away
        answer: invite them to play
        why: Inviting them is kind and makes them feel included.
      ways:
      - style: visual
        teach: Kind things we can do when a friend feels sad, one after another.
        picture:
          kind: flow
          steps:
          - notice the sad face
          - sit next to them
          - ask, 'Are you okay?'
          - listen or share a toy
          alt: When a friend is sad, notice their face, sit next to them, ask if they are okay, then listen or share a toy.
      - style: real_world
        teach: When a new child joins the class and looks shy, other children can smile and say, 'Come and sit with us.'
  items:
  - prompt: '😊 This face is:'
    options:
    - happy
    - sad
    - angry
    answer: happy
    difficulty: 1
    hints:
    - A big smile.
    - Joy.
    solution: It is happy.
    mistakes:
      sad: lkgw_look
  - prompt: '😢 This face is:'
    options:
    - sad
    - happy
    - sleepy
    answer: sad
    difficulty: 1
    hints:
    - Tears.
    - Crying.
    solution: It is sad.
    mistakes: {"happy": "kg_face", "sleepy": "kg_face"}
  - prompt: 'When we feel angry, we can:'
    options:
    - take a deep breath
    - hit someone
    - throw things
    answer: take a deep breath
    difficulty: 2
    hints:
    - Calm down first.
    - Breathe in, breathe out.
    solution: Take a deep breath to calm down.
    mistakes: {"hit someone": "kg_calm", "throw things": "kg_calm"}
  - prompt: 'A friend is crying. We can:'
    options:
    - ask if they are okay
    - laugh at them
    - walk away
    answer: ask if they are okay
    difficulty: 1
    hints:
    - Be kind.
    - How would you feel?
    solution: Ask if they are okay.
    mistakes: {"laugh at them": "kg_kind_friend", "walk away": "kg_kind_friend"}
  - prompt: 'When we are scared, we can:'
    options:
    - tell a grown-up
    - hide forever
    - keep it secret
    answer: tell a grown-up
    difficulty: 2
    hints:
    - Someone who looks after you.
    - Mother, teacher.
    solution: Tell a grown-up you trust.
    mistakes: {"hide forever": "kg_tell", "keep it secret": "kg_tell"}
  - prompt: '😠 This face is:'
    options:
    - angry
    - happy
    - sleepy
    answer: angry
    difficulty: 2
    hints:
    - Frowning eyebrows.
    - Cross.
    solution: It is angry.
    mistakes: {"happy": "kg_face", "sleepy": "kg_face"}
  - prompt: '😨 This face is:'
    options:
    - scared
    - happy
    - sleepy
    answer: scared
    difficulty: 1
    hints:
    - Make the face yourself.
    - Like when you hear a loud thunder.
    solution: 'Step 1: wide eyes, open mouth. Step 2: scared.'
    mistakes:
      happy: lk6w_face
      sleepy: lk6w_face
  - prompt: 'You get a new toy. You feel:'
    options:
    - happy
    - sad
    - angry
    answer: happy
    difficulty: 1
    hints:
    - Something nice happened.
    - You smile!
    solution: 'Step 1: a nice surprise. Step 2: happy.'
    mistakes:
      sad: lk6w_face
      angry: lk6w_face
  - prompt: 'Your ice cream fell on the ground. You might feel:'
    options:
    - sad
    - happy
    - sleepy
    answer: sad
    difficulty: 1
    hints:
    - You lost something you liked.
    - Maybe a tear.
    solution: 'Step 1: something you liked is gone. Step 2: sad.'
    mistakes:
      happy: lk6w_face
      sleepy: lk6w_face
  - prompt: 'A friend fell down and is hurt. You can:'
    options:
    - help and call a teacher
    - laugh
    - run away
    answer: help and call a teacher
    difficulty: 2
    hints:
    - How does your friend feel?
    - Who can help with a hurt?
    solution: 'Step 1: your friend is hurt. Step 2: help and get a grown-up.'
    mistakes:
      laugh: lk6w_kind
      run away: lk6w_kind
  - prompt: Someone took your crayon. You feel angry. What is a good thing to do?
    options:
    - say 'Please give it back' and tell the teacher
    - push them
    - shout and cry loudly
    answer: say 'Please give it back' and tell the teacher
    difficulty: 2
    hints:
    - Use words, not hands.
    - A grown-up can help.
    solution: 'Step 1: stay calm. Step 2: ask nicely, get help.'
    mistakes:
      push them: lk6w_calm
      shout and cry loudly: lk6w_calm
  - prompt: Is it okay to feel sad sometimes?
    options:
    - yes, all feelings are okay
    - no, never
    - only grown-ups can
    answer: yes, all feelings are okay
    difficulty: 2
    hints:
    - Everyone feels sad at times.
    - Then we can talk about it.
    solution: 'Step 1: everyone has feelings. Step 2: yes, it is okay.'
    mistakes:
      no, never: lk6w_calm
      only grown-ups can: lk6w_calm
  - prompt: 'Your friend shares a biscuit with you. You say:'
    options:
    - thank you
    - give me more
    - nothing
    answer: thank you
    difficulty: 1
    hints:
    - Your friend was kind.
    - Kind words back.
    solution: 'Step 1: kindness. Step 2: thank you.'
    mistakes:
      give me more: lk6w_kind
      nothing: lk6w_kind
  - prompt: 'Rina is smiling and jumping. Rina feels:'
    options:
    - happy
    - scared
    - sad
    answer: happy
    difficulty: 3
    hints:
    - 'Look at the clues: smile, jumping.'
    - How do you feel when you jump with joy?
    solution: 'Step 1: smile and jumping show joy. Step 2: happy.'
    mistakes:
      scared: lk6w_face
      sad: lk6w_face
  - prompt: You feel scared of the dark. What can help?
    options:
    - tell a grown-up and switch on a small light
    - hide and say nothing
    - scream at others
    answer: tell a grown-up and switch on a small light
    difficulty: 3
    hints:
    - Who can help you feel safe?
    - A little light helps you see.
    solution: 'Step 1: talk about the fear. Step 2: a grown-up and a light help.'
    mistakes:
      hide and say nothing: lk6w_calm
      scream at others: lk6w_calm
  - prompt: 'Case: In the playground, Ali''s tower of blocks fell down and Ali feels very angry. What can Ali do?'
    options:
    - take slow deep breaths, then build again
    - kick the blocks at a friend
    - throw sand
    answer: take slow deep breaths, then build again
    hints:
    - A big feeling can be made smaller.
    - Which one helps without hurting anyone?
    solution: Slow deep breaths help a big feeling get smaller. Then Ali can try again without hurting anyone.
    mistakes:
      kick the blocks at a friend: lk6w_calm
      throw sand: lk6w_calm
    exam: case
    difficulty: 2
  - prompt: 'Situation: Zoya''s eyes are wide open and her mouth is a big O. She just saw a rainbow. How does Zoya feel?'
    options:
    - surprised
    - sleepy
    - angry
    answer: surprised
    hints:
    - Make that face yourself.
    - Wide eyes and an O mouth show which feeling?
    solution: Wide eyes and an O-shaped mouth show surprise. Zoya is surprised by the rainbow.
    mistakes:
      sleepy: lk6w_face
      angry: lk6w_face
    exam: competency
    difficulty: 2
