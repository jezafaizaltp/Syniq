# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 3
title: Animals Around Us
tips:
  kg_animal_sound: "Moo is a cow, baa is a sheep. What does a dog say when it barks?"
  kg_fish_home: "A fish has fins, not legs or wings. Where can it swim?"
  kg_kind: "Animals feel pain too. How would you like to be treated?"
  kg_milk: "A hen gives eggs. Which big farm animal gives milk for our tea?"

concepts:
- code: lkgw.animals
  title: Animals Around Us
  notes: |
    Pet animals and farm animals, their sounds, food and homes; being kind to animals.
  explanations:
    text: Some animals live with us, like dogs and cats. Some live on farms, like cows and hens. Each animal has a sound and needs food and kindness.
    visual: Draw a cow, a dog and a hen, with their sounds.
    step_by_step: 'Step 1: Name the animal. Step 2: Make its sound. Step 3: Say where it lives.'
    real_world: We get milk from cows and eggs from hens.
  picture:
    kind: compare
    columns:
    - title: Animal
      points:
      - 🐄 cow
      - 🐶 dog
      - 🐔 hen
    - title: Sound
      points:
      - moo
      - woof
      - cluck
    alt: A cow says moo, a dog says woof and a hen says cluck.
  activity:
    type: sort
    prompt: Where does it live?
    bins:
    - 🏠 With us at home
    - 🚜 On a farm
    - 🌊 In water
    items:
    - label: 🐶 Dog
      bin: 🏠 With us at home
      clue: Does it sleep near your door?
      why: Dogs live with us as pets.
    - label: 🐱 Cat
      bin: 🏠 With us at home
      clue: Does it purr on your lap?
      why: Cats live with us as pets.
    - label: 🐄 Cow
      bin: 🚜 On a farm
      clue: It gives us milk and eats grass in a field.
      why: Cows live on farms.
    - label: 🐔 Hen
      bin: 🚜 On a farm
      clue: It lays eggs in a shed.
      why: Hens live on farms.
    - label: 🐟 Fish
      bin: 🌊 In water
      clue: Can it breathe out on land?
      why: Fish live in water.
    - label: 🐙 Octopus
      bin: 🌊 In water
      clue: It has 8 arms and swims.
      why: An octopus lives in the sea.
  items:
  - prompt: 'A cow says:'
    options:
    - moo
    - meow
    - quack
    answer: moo
    difficulty: 1
    hints:
    - Big farm animal.
    - Gives milk.
    solution: A cow says moo.
    mistakes:
      meow: lkgw_look
  - prompt: 'A dog says:'
    options:
    - woof
    - moo
    - baa
    answer: woof
    difficulty: 1
    hints:
    - Guards the house.
    - Wags its tail.
    solution: A dog says woof.
    mistakes: {"moo": "kg_animal_sound", "baa": "kg_animal_sound"}
  - prompt: 'We get milk from a:'
    options:
    - 🐄 cow
    - 🐔 hen
    - 🐟 fish
    answer: 🐄 cow
    difficulty: 1
    hints:
    - Moo.
    - Big farm animal.
    solution: We get milk from a cow.
    mistakes: {"🐔 hen": "kg_milk", "🐟 fish": "kg_milk"}
  - prompt: 'A fish lives in:'
    options:
    - water
    - a tree
    - a nest
    answer: water
    difficulty: 2
    hints:
    - It swims.
    - Pond or river.
    solution: A fish lives in water.
    mistakes: {"a tree": "kg_fish_home", "a nest": "kg_fish_home"}
  - prompt: How many legs does a dog have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - 'Count: front and back.'
    - Like a cow.
    solution: A dog has 4 legs.
    mistakes:
      '2': lkgw_look
  - prompt: 'We should treat animals:'
    options:
    - kindly
    - roughly
    - badly
    answer: kindly
    difficulty: 1
    hints:
    - They feel pain.
    - Be gentle.
    solution: Be kind to animals.
    mistakes: {"roughly": "kg_kind", "badly": "kg_kind"}
