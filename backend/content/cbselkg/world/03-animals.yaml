# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 3
title: Animals Around Us
tips:
  lk3w_give: "Think what each animal gives us: milk, eggs or a soft coat?"
  lk3w_kind: "Think how the animal feels. What kind thing could you do?"
  kg_animal_sound: "Moo is a cow, baa is a sheep. What does a dog say when it barks?"
  kg_fish_home: "A fish has fins, not legs or wings. Where can it swim?"
  kg_kind: "Animals feel pain too. How would you like to be treated?"
  kg_milk: "A hen gives eggs. Which big farm animal gives milk for our tea?"
  lk3w_sound: Picture the animal and make its sound softly. Which sound is it?
  lk3w_home: "Think where this animal lives and sleeps. Picture its home."
  lk3w_legs: Picture the animal standing and count its legs one by one.

concepts:
- code: lkgw.animals
  title: Animals Around Us
  notes: |
    Pet animals and farm animals, their sounds, food and homes; being kind to animals.
  explanations:
    text: Some animals live with us, like dogs and cats. Some live on farms, like cows and hens. Each animal has a sound and needs food and kindness.
    visual: Draw a cow, a dog and a hen, with their sounds.
    step_by_step: 'Step 1: Name the animal. Step 2: Make its sound. Step 3: Say where it lives.'
    real_world: We get milk from cows and eggs from hens.
  picture:
    kind: compare
    columns:
    - title: Animal
      points:
      - 🐄 cow
      - 🐶 dog
      - 🐔 hen
    - title: Sound
      points:
      - moo
      - woof
      - cluck
    alt: A cow says moo, a dog says woof and a hen says cluck.
  activity:
    type: sort
    prompt: Where does it live?
    bins:
    - 🏠 With us at home
    - 🚜 On a farm
    - 🌊 In water
    items:
    - label: 🐶 Dog
      bin: 🏠 With us at home
      clue: Does it sleep near your door?
      why: Dogs live with us as pets.
    - label: 🐱 Cat
      bin: 🏠 With us at home
      clue: Does it purr on your lap?
      why: Cats live with us as pets.
    - label: 🐄 Cow
      bin: 🚜 On a farm
      clue: It gives us milk and eats grass in a field.
      why: Cows live on farms.
    - label: 🐔 Hen
      bin: 🚜 On a farm
      clue: It lays eggs in a shed.
      why: Hens live on farms.
    - label: 🐟 Fish
      bin: 🌊 In water
      clue: Can it breathe out on land?
      why: Fish live in water.
    - label: 🐙 Octopus
      bin: 🌊 In water
      clue: It has 8 arms and swims.
      why: An octopus lives in the sea.
  lesson:
    - teach: 'Pet animals live with us at home: dog, cat, parrot, fish. Farm animals live on farms: cow, goat, hen, buffalo. Wild animals live in forests: lion, tiger, elephant.'
      picture:
        kind: compare
        columns:
        - title: Pet
          points:
          - dog
          - cat
          - parrot
        - title: Farm
          points:
          - cow
          - goat
          - hen
        - title: Wild
          points:
          - lion
          - tiger
          - elephant
        alt: Pet, farm and wild animals.
      check:
        prompt: Which animal lives in the forest?
        options:
        - 🐅 tiger
        - 🐈 cat
        - 🐓 hen
        answer: 🐅 tiger
        why: Tigers are wild animals.
      ways:
      - style: step_by_step
        teach: 'Sort animals into groups. First: name the animal. Second: ask, ''Does it live with people at home?'' Then it is a pet. Third: ask, ''Does it live on a farm?'' Then it is a farm animal. Fourth: if it lives in the forest, it is a wild animal.'
      - style: visual
        teach: Pets, farm animals and wild animals, each in its own group.
        picture:
          kind: compare
          columns:
          - title: Pets
            points:
            - 🐇 rabbit
            - 🐹 hamster
          - title: Farm
            points:
            - 🐖 pig
            - 🐴 horse
          - title: Wild
            points:
            - 🐯 tiger
            - 🐘 elephant
          alt: A rabbit and a hamster can be pets. A pig and a horse are farm animals. A tiger and an elephant are wild animals.
    - teach: 'Animals have homes: a bird lives in a nest, a dog in a kennel, a cow in a shed, a fish in water, a lion in a den.'
      check:
        prompt: Where does a bird live?
        options:
        - in a nest
        - in a shed
        - in water
        answer: in a nest
        why: Birds build nests of twigs.
      ways:
      - style: visual
        teach: Some more animals and their homes, side by side.
        picture:
          kind: compare
          columns:
          - title: Animal
            points:
            - 🐝 bee
            - 🐰 rabbit
            - 🐴 horse
          - title: Home
            points:
            - hive
            - burrow
            - stable
          alt: A bee lives in a hive, a rabbit in a burrow and a horse in a stable.
      - style: real_world
        teach: Some people put a small wooden box on a tree so birds can make a nest in it.
    - teach: 'Animals give us things: cows and goats give milk, hens give eggs, sheep give wool. We must be kind: give them water and never hurt them.'
      check:
        prompt: 'We get eggs from a:'
        options:
        - 🐓 hen
        - 🐕 dog
        - 🐟 fish
        answer: 🐓 hen
        why: Hens lay eggs.
      ways:
      - style: visual
        teach: Ways to be kind to animals, and things we never do.
        picture:
          kind: compare
          columns:
          - title: Kind
            points:
            - fill a water bowl
            - speak softly
            - let them rest
          - title: Never
            points:
            - throw stones
            - pull tails
            - shout at them
          alt: Being kind means filling a water bowl, speaking softly and letting animals rest. We never throw stones, pull tails or shout at them.
      - style: real_world
        teach: In hot summers, many families keep a bowl of water outside for birds and street dogs.
  items:
  - prompt: 'A cow says:'
    options:
    - moo
    - meow
    - quack
    answer: moo
    difficulty: 1
    hints:
    - Big farm animal.
    - Gives milk.
    solution: A cow says moo.
    mistakes:
      meow: lkgw_look
  - prompt: 'A dog says:'
    options:
    - woof
    - moo
    - baa
    answer: woof
    difficulty: 1
    hints:
    - Guards the house.
    - Wags its tail.
    solution: A dog says woof.
    mistakes: {"moo": "kg_animal_sound", "baa": "kg_animal_sound"}
  - prompt: 'We get milk from a:'
    options:
    - 🐄 cow
    - 🐔 hen
    - 🐟 fish
    answer: 🐄 cow
    difficulty: 1
    hints:
    - Moo.
    - Big farm animal.
    solution: We get milk from a cow.
    mistakes: {"🐔 hen": "kg_milk", "🐟 fish": "kg_milk"}
  - prompt: 'A fish lives in:'
    options:
    - water
    - a tree
    - a nest
    answer: water
    difficulty: 2
    hints:
    - It swims.
    - Pond or river.
    solution: A fish lives in water.
    mistakes: {"a tree": "kg_fish_home", "a nest": "kg_fish_home"}
  - prompt: How many legs does a dog have?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - 'Count: front and back.'
    - Like a cow.
    solution: A dog has 4 legs.
    mistakes:
      '2': lkgw_look
  - prompt: 'We should treat animals:'
    options:
    - kindly
    - roughly
    - badly
    answer: kindly
    difficulty: 1
    hints:
    - They feel pain.
    - Be gentle.
    solution: Be kind to animals.
    mistakes: {"roughly": "kg_kind", "badly": "kg_kind"}
  - prompt: 'A cat says:'
    options:
    - miaow
    - moo
    - quack
    answer: miaow
    difficulty: 1
    hints:
    - Picture a cat drinking milk.
    - A soft little sound.
    solution: 'Step 1: a cat''s sound. Step 2: miaow.'
    mistakes:
      moo: lk3w_sound
      quack: lk3w_sound
  - prompt: 'A duck says:'
    options:
    - quack
    - woof
    - roar
    answer: quack
    difficulty: 1
    hints:
    - Picture a duck in a pond.
    - Its beak makes the sound.
    solution: 'Step 1: a duck''s sound. Step 2: quack.'
    mistakes:
      woof: lk3w_sound
      roar: lk3w_sound
  - prompt: Where does a cow live?
    options:
    - in a shed
    - in a nest
    - in a pond
    answer: in a shed
    difficulty: 2
    hints:
    - Cows are farm animals.
    - A roof over the farm animals.
    solution: 'Step 1: cows live on farms. Step 2: in a shed.'
    mistakes:
      in a nest: lk3w_home
      in a pond: lk3w_home
  - prompt: How many legs does a hen have?
    answer: '2'
    check: '2'
    difficulty: 2
    hints:
    - Hens are birds.
    - Count the legs it stands on.
    solution: 'Step 1: birds have 2 legs. Step 2: 2.'
    mistakes:
      '4': lk3w_legs
      '1': lk3w_legs
  - prompt: Which animal is a pet?
    options:
    - 🐕 dog
    - 🦁 lion
    - 🐘 elephant
    answer: 🐕 dog
    difficulty: 1
    hints:
    - Which one could live in your home?
    - It wags its tail.
    solution: 'Step 1: lion and elephant are wild. Step 2: the dog is a pet.'
    mistakes:
      🦁 lion: lk3w_home
      🐘 elephant: lk3w_home
  - prompt: A thirsty puppy is near you. What can you do?
    options:
    - give it water in a bowl
    - throw a stone
    - pull its tail
    answer: give it water in a bowl
    difficulty: 2
    hints:
    - Thirsty means it needs a drink.
    - Be kind.
    solution: 'Step 1: the puppy is thirsty. Step 2: give water.'
    mistakes:
      throw a stone: lk3w_kind
      pull its tail: lk3w_kind
  - prompt: 'We get wool from a:'
    options:
    - 🐑 sheep
    - 🐟 fish
    - 🐓 hen
    answer: 🐑 sheep
    difficulty: 3
    hints:
    - Wool is soft and fluffy.
    - Which animal has a thick fluffy coat?
    solution: 'Step 1: wool comes from fluffy coats. Step 2: sheep.'
    mistakes:
      🐟 fish: lk3w_give
      🐓 hen: lk3w_give
  - prompt: 'A lion says:'
    options:
    - roar
    - tweet
    - baa
    answer: roar
    difficulty: 2
    hints:
    - The king of the forest.
    - Very loud and scary.
    solution: 'Step 1: a lion''s sound. Step 2: roar.'
    mistakes:
      tweet: lk3w_sound
      baa: lk3w_sound
  - prompt: A dog and a hen. How many legs in all?
    answer: '6'
    check: 4+2
    difficulty: 3
    hints:
    - Count the dog's legs first.
    - Then add the hen's legs.
    solution: 'Step 1: 4 + 2. Step 2: 6 legs.'
    mistakes:
      '4': lk3w_legs
      '8': lk3w_legs
  - prompt: 'Case: On a hot day, Arya sees a street dog lying in the sun, panting. What kind thing can Arya do?'
    options:
    - "ask a grown-up to put out a bowl of water"
    - "throw a stone to make it go away"
    - "pull its tail to make it get up"
    answer: ask a grown-up to put out a bowl of water
    hints:
    - Panting means the dog is hot and thirsty.
    - What would help it feel better, safely?
    solution: The dog is hot and thirsty. Asking a grown-up to put out water is kind and safe.
    mistakes:
      "throw a stone to make it go away": lk3w_kind
      "pull its tail to make it get up": lk3w_kind
    exam: case
    difficulty: 2
  - prompt: 'Situation: On a farm, Grandpa cuts the thick coat of the sheep in summer, and it is made into warm sweaters. What does the sheep give us?'
    options:
    - wool
    - eggs
    - milk
    answer: wool
    hints:
    - Sweaters are soft and warm.
    - Hens give eggs and cows give milk. What does a sheep give?
    solution: Sheep give us wool, which is made into warm sweaters.
    mistakes:
      eggs: lk3w_give
      milk: lk3w_give
    exam: competency
    difficulty: 2
