# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 2
title: My Family
tips:
  kg_grand: "Your mother had a mother too. The word has 'mother' in it, and it is a grand word!"
  kg_grand_f: "Your father had a father too. The word has 'father' in it, and it is a grand word!"
  kg_help_home: "Which one makes the home neater and Amma or Papa happier?"
  lk2w_who: Think of your own family. Who is that person to you?
  lk2w_help: Think what makes home happier and easier for everyone.
  lk2w_count: Touch one finger for each person and count.

concepts:
- code: lkgw.family
  title: My Family
  notes: |
    Family members (mother, father, grandparents, brothers, sisters); helping at home; loving and caring.
  explanations:
    text: My family loves me. There is my mother, my father, my grandparents, and maybe brothers and sisters. We help each other.
    visual: Draw your family holding hands and say each person's name.
    step_by_step: 'Step 1: Name each person. Step 2: Say how they help you. Step 3: Say how you help them.'
    real_world: Grandma tells stories; we can bring her water.
  picture:
    kind: flow
    steps:
    - Mother
    - Father
    - Grandparents
    - Me
    alt: 'A family: mother, father, grandparents and me.'
  activity:
    type: sort
    prompt: Who is it?
    bins:
    - Grandparent
    - Parent
    - Baby
    items:
    - label: Mother's mother
      bin: Grandparent
      clue: Who is your mother's mother?
      why: Your mother's mother is your grandmother.
    - label: Father's father
      bin: Grandparent
      clue: Who is your father's father?
      why: Your father's father is your grandfather.
    - label: Your mother
      bin: Parent
      clue: She looks after you every day.
      why: Mother and father are your parents.
    - label: Your father
      bin: Parent
      clue: He looks after you every day.
      why: Mother and father are your parents.
    - label: Your new little brother
      bin: Baby
      clue: He drinks milk and can't walk yet.
      why: A new little brother is a baby.
  lesson:
    - teach: 'A family is the people who love and look after us. Families can be big or small: mother, father, grandparents, brothers, sisters, aunts, uncles.'
      check:
        prompt: Who looks after us and loves us at home?
        options:
        - our family
        - a stranger
        - nobody
        answer: our family
        why: Our family cares for us.
      ways:
      - style: visual
        teach: Some families are small and some are big. Every family loves and cares.
        picture:
          kind: compare
          columns:
          - title: A small family
            points:
            - Amma
            - the child
          - title: A big family
            points:
            - grandparents
            - parents
            - children
            - an aunt and uncle
          alt: A small family can be Amma and the child. A big family can have grandparents, parents, children, an aunt and an uncle.
      - style: real_world
        teach: At a wedding or a festival, the whole big family often comes together, with cousins, aunts and uncles.
    - teach: Mother's mother is grandmother (nani), father's mother is grandmother (dadi). Mother's father is grandfather (nana), father's father is grandfather (dada).
      check:
        prompt: 'Your father''s mother is your:'
        options:
        - grandmother
        - sister
        - aunt
        answer: grandmother
        why: Father's mother is dadi, a grandmother.
      ways:
      - style: visual
        teach: Grandparents on the mother's side and on the father's side, side by side.
        picture:
          kind: compare
          columns:
          - title: Mother's side
            points:
            - nani (mother's mother)
            - nana (mother's father)
          - title: Father's side
            points:
            - dadi (father's mother)
            - dada (father's father)
          alt: On the mother's side are nani and nana, the mother's own parents. On the father's side are dadi and dada, the father's own parents.
      - style: step_by_step
        teach: 'Draw your family tree. First: draw yourself at the bottom. Second: draw your parents above you. Third: draw each parent''s parents above them. Fourth: say the name of each one.'
    - teach: 'Everyone helps at home: put toys away, water plants, set the plates, fold small clothes. Helping makes the family happy.'
      check:
        prompt: Which is a way to help at home?
        options:
        - water the plants
        - throw toys on the floor
        - leave the tap open
        answer: water the plants
        why: Watering plants is a helpful job.
      ways:
      - style: visual
        teach: Small jobs that children can do at home, one after another.
        picture:
          kind: flow
          steps:
          - fold your napkin
          - water the plants
          - feed the pet
          - line up the shoes
          alt: Children can fold a napkin, water the plants, feed the pet and line up the shoes.
      - style: real_world
        teach: When a grandparent is cooking, a child can pass the spoons and bowls.
  items:
  - prompt: Who is your mother's mother?
    options:
    - grandmother
    - sister
    - aunt's friend
    answer: grandmother
    difficulty: 2
    hints:
    - Mother's mother.
    - Nani or Dadi.
    solution: Mother's mother is your grandmother.
    mistakes: {"sister": "kg_grand", "aunt's friend": "kg_grand"}
  - prompt: How can you help at home?
    options:
    - put toys away
    - throw food
    - shout
    answer: put toys away
    difficulty: 1
    hints:
    - Keep things tidy.
    - A helpful job.
    solution: Putting toys away helps.
    mistakes: {"throw food": "kg_help_home", "shout": "kg_help_home"}
  - prompt: Who loves and looks after you?
    options:
    - your family
    - a stranger
    - nobody
    answer: your family
    difficulty: 1
    hints:
    - At home.
    - Mother, father.
    solution: Your family loves and looks after you.
    mistakes:
      a stranger: lkgw_think
  - prompt: 'Your father''s father is your:'
    options:
    - grandfather
    - brother
    - uncle's son
    answer: grandfather
    difficulty: 2
    hints:
    - Dada.
    - Old and wise.
    solution: Father's father is your grandfather.
    mistakes: {"brother": "kg_grand_f", "uncle's son": "kg_grand_f"}
  - prompt: 'When someone gives you a gift, say:'
    options:
    - thank you
    - go away
    - 'no'
    answer: thank you
    difficulty: 1
    hints:
    - Polite words.
    - Be grateful.
    solution: Say thank you.
    mistakes: {"go away": "e1_thank_you", "no": "e1_thank_you"}
  - prompt: Mother, father and you. How many people?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Count them.
    - 1, 2, 3.
    solution: 3 people.
    mistakes:
      '2': lkgw_look
  - prompt: 'Your mother''s father is your:'
    options:
    - grandfather
    - brother
    - uncle
    answer: grandfather
    difficulty: 2
    hints:
    - Think one step up from mother.
    - Nana.
    solution: 'Step 1: mother''s father. Step 2: grandfather (nana).'
    mistakes:
      brother: lk2w_who
      uncle: lk2w_who
  - prompt: Grandmother, grandfather, mother and you. How many people?
    answer: '4'
    check: '4'
    difficulty: 2
    hints:
    - One finger for each person.
    - Don't forget you!
    solution: 'Step 1: 1, 2, 3, 4. Step 2: 4 people.'
    mistakes:
      '3': lk2w_count
      '5': lk2w_count
  - prompt: After dinner, what can you do to help?
    options:
    - carry your plate to the sink
    - run away
    - hide the plates
    answer: carry your plate to the sink
    difficulty: 1
    hints:
    - Something small you can do.
    - Clean up after eating.
    solution: 'Step 1: plates need washing. Step 2: carry yours to the sink.'
    mistakes:
      run away: lk2w_help
      hide the plates: lk2w_help
  - prompt: 'A baby in the family is sleeping. You should:'
    options:
    - play quietly
    - shout loudly
    - bang a drum
    answer: play quietly
    difficulty: 2
    hints:
    - Babies need rest.
    - Noise wakes them.
    solution: 'Step 1: the baby needs sleep. Step 2: play quietly.'
    mistakes:
      shout loudly: lk2w_help
      bang a drum: lk2w_help
  - prompt: 'Your mother''s sister is your:'
    options:
    - aunt
    - grandmother
    - brother
    answer: aunt
    difficulty: 3
    hints:
    - She is your mother's sibling.
    - Mausi.
    solution: 'Step 1: mother''s sister. Step 2: aunt (mausi).'
    mistakes:
      grandmother: lk2w_who
      brother: lk2w_who
  - prompt: 'Grandparents are tired after a walk. You can:'
    options:
    - bring them water
    - ask them to carry you
    - make noise
    answer: bring them water
    difficulty: 2
    hints:
    - How can you help them rest?
    - A kind act.
    solution: 'Step 1: they are tired. Step 2: bring water.'
    mistakes:
      ask them to carry you: lk2w_help
      make noise: lk2w_help
  - prompt: Who is a baby girl in your family to you, if your parents are her parents too?
    options:
    - sister
    - aunt
    - grandmother
    answer: sister
    difficulty: 3
    hints:
    - You share the same parents.
    - Like a brother, but a girl.
    solution: 'Step 1: same parents. Step 2: sister.'
    mistakes:
      aunt: lk2w_who
      grandmother: lk2w_who
  - prompt: Your toys are all over the floor. What do you do?
    options:
    - put them back in the box
    - leave them there
    - kick them
    answer: put them back in the box
    difficulty: 1
    hints:
    - Someone could trip.
    - Tidy up!
    solution: 'Step 1: toys on the floor are messy. Step 2: put them away.'
    mistakes:
      leave them there: lk2w_help
      kick them: lk2w_help
  - prompt: Mother, father, two children. How many people?
    answer: '4'
    check: 2+2
    difficulty: 1
    hints:
    - Count the grown-ups, then the children.
    - One finger for each.
    solution: 'Step 1: 2 grown-ups, 2 children. Step 2: 4.'
    mistakes:
      '3': lk2w_count
      '2': lk2w_count
  - prompt: 'Case: Amma is carrying the shopping bags and the door is shut. How can you help?'
    options:
    - open the door for Amma
    - keep watching TV
    - run away to play
    answer: open the door for Amma
    hints:
    - Amma's hands are full.
    - What would make it easier for Amma?
    solution: Amma's hands are full, so opening the door is a helpful thing to do.
    mistakes:
      keep watching TV: lk2w_help
      run away to play: lk2w_help
    exam: case
    difficulty: 2
  - prompt: 'Situation: Rohan''s father''s sister is visiting. Who is that person to Rohan?'
    options:
    - aunt
    - grandmother
    - sister
    answer: aunt
    hints:
    - The visitor is the sister of a parent.
    - What do we call a parent's sister?
    solution: A parent's sister is an aunt, so the visitor is Rohan's aunt.
    mistakes:
      grandmother: lk2w_who
      sister: lk2w_who
    exam: competency
    difficulty: 2
