# CBSE LKG My World (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-world
chapter: 2
title: My Family
concepts:
- code: lkgw.family
  title: My Family
  notes: |
    Family members (mother, father, grandparents, brothers, sisters); helping at home; loving and caring.
  explanations:
    text: My family loves me. There is my mother, my father, my grandparents, and maybe brothers and sisters. We help each other.
    visual: Draw your family holding hands and say each person's name.
    step_by_step: 'Step 1: Name each person. Step 2: Say how they help you. Step 3: Say how you help them.'
    real_world: Grandma tells stories; we can bring her water.
  picture:
    kind: flow
    steps:
    - Mother
    - Father
    - Grandparents
    - Me
    alt: 'A family: mother, father, grandparents and me.'
  activity:
    type: sort
    prompt: Who is it?
    bins:
    - Grandparent
    - Parent
    - Baby
    items:
    - label: Mother's mother
      bin: Grandparent
      clue: Who is your mother's mother?
      why: Your mother's mother is your grandmother.
    - label: Father's father
      bin: Grandparent
      clue: Who is your father's father?
      why: Your father's father is your grandfather.
    - label: Your mother
      bin: Parent
      clue: She looks after you every day.
      why: Mother and father are your parents.
    - label: Your father
      bin: Parent
      clue: He looks after you every day.
      why: Mother and father are your parents.
    - label: Your new little brother
      bin: Baby
      clue: He drinks milk and can't walk yet.
      why: A new little brother is a baby.
  items:
  - prompt: Who is your mother's mother?
    options:
    - grandmother
    - sister
    - aunt's friend
    answer: grandmother
    difficulty: 2
    hints:
    - Mother's mother.
    - Nani or Dadi.
    solution: Mother's mother is your grandmother.
  - prompt: How can you help at home?
    options:
    - put toys away
    - throw food
    - shout
    answer: put toys away
    difficulty: 1
    hints:
    - Keep things tidy.
    - A helpful job.
    solution: Putting toys away helps.
  - prompt: Who loves and looks after you?
    options:
    - your family
    - a stranger
    - nobody
    answer: your family
    difficulty: 1
    hints:
    - At home.
    - Mother, father.
    solution: Your family loves and looks after you.
    mistakes:
      a stranger: lkgw_think
  - prompt: 'Your father''s father is your:'
    options:
    - grandfather
    - brother
    - uncle's son
    answer: grandfather
    difficulty: 2
    hints:
    - Dada.
    - Old and wise.
    solution: Father's father is your grandfather.
  - prompt: 'When someone gives you a gift, say:'
    options:
    - thank you
    - go away
    - 'no'
    answer: thank you
    difficulty: 1
    hints:
    - Polite words.
    - Be grateful.
    solution: Say thank you.
  - prompt: Mother, father and you. How many people?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Count them.
    - 1, 2, 3.
    solution: 3 people.
    mistakes:
      '2': lkgw_look
