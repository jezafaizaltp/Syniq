# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 1
title: अ, आ, इ, ई
tips:
  lkgh_sound: शब्द धीरे से बोलो। पहली आवाज़ सुनो।
  lkgh_look: चित्र फिर से देखो और उसका नाम बोलो।
  lkh1_first: शब्द धीरे-धीरे बोलो और सिर्फ़ सबसे पहली आवाज़ सुनो।
  lkh1_look: 'अक्षरों को ध्यान से देखो: कहाँ रेखा है, कहाँ गोला? उँगली से हवा में बनाओ।'
concepts:
- code: lkgh.svar1
  title: अ, आ, इ, ई
  notes: |
    हिंदी अक्षर अ, आ, इ, ई: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'हिंदी के स्वर बोलो: अ, आ, इ, ई। अ से अनानास 🍍, आ से आम 🥭, इ से इमली 🌰, ई से ईख 🎋, अ से अंगूर 🍇, आ से आलू 🥔।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - अ
      - आ
      - इ
    - title: शब्द
      points:
      - अनानास 🍍
      - आम 🥭
      - इमली 🌰
    alt: अ से अनानास 🍍, आ से आम 🥭, इ से इमली 🌰।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - अ
    - आ
    - इ
    - ई
    items:
    - label: 🔴 अनार
      bin: अ
      clue: 'पहली आवाज़ सुनो: अ-नार।'
      why: अनार अ से।
    - label: 🥭 आम
      bin: आ
      clue: 'आ-म: लंबी आवाज़ है?'
      why: आम आ से।
    - label: 🌈 इंद्रधनुष
      bin: इ
      clue: 'इं-द्र: छोटी इ?'
      why: इंद्रधनुष इ से।
    - label: 🧱 ईंट
      bin: ई
      clue: 'ईं-ट: लंबी ई?'
      why: ईंट ई से।
    - label: 🌿 इमली
      bin: इ
      clue: 'इमली: पहली आवाज़?'
      why: इमली इ से।
  lesson:
    - teach: 'आज के अक्षर: अ, आ। हर अक्षर की अपनी आवाज़ है: अ से 📰 अखबार; आ से 🔥 आग।'
      check:
        prompt: '''अ'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 📰 अखबार
        - 🏢 इमारत
        - 🔥 आग
        answer: 📰 अखबार
        why: 'अखबार बोलो: सबसे पहले ''अ'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: अ और आ से शुरू होने वाले कुछ और शब्द। हर शब्द बोलो और पहली आवाज़ सुनो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - अ
            - आ
          - title: शब्द
            points:
            - अनार
            - आसमान
          - title: एक और शब्द
            points:
            - 🐍 अजगर
            - आटा
          alt: अ से अनार और अजगर। आ से आसमान और आटा।
      - style: step_by_step
        teach: 'पहली आवाज़ सुनो। पहला: ''अनार'' शब्द धीरे-धीरे बोलो। दूसरा: सबसे पहली आवाज़ पर रुक जाओ। तीसरा: उस आवाज़ को अकेले बोलो। चौथा: यह आवाज़ ''अ'' अक्षर की है।'
    - teach: 'और अक्षर: इ, ई। इ से 🏢 इमारत; ई से 🧱 ईंट।'
      check:
        prompt: '''ई'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🧱 ईंट
        - 🍐 अमरूद
        - 🌈 इंद्रधनुष
        answer: 🧱 ईंट
        why: 'ईंट बोलो: सबसे पहले ''ई'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: इ और ई से शुरू होने वाले कुछ और शब्द। हर चित्र देखो और उसकी पहली आवाज़ बोलो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - इ
            - ई
          - title: शब्द
            points:
            - इडली
            - ईद
          - title: एक और शब्द
            points:
            - 🚂 इंजन
            - ईंधन
          alt: इ से इडली और इंजन। ई से ईद और ईंधन।
      - style: real_world
        teach: घर या स्कूल में ऐसी चीज़ें ढूँढो जिनके नाम इ और ई से शुरू होते हैं, और हर नाम ज़ोर से बोलकर किसी बड़े को सुनाओ।
    - teach: 'अ छोटी आवाज़ है, आ लंबी: अ... आ...। इ छोटी, ई लंबी: इ... ई...। देखो: आ में अ के बाद एक खड़ी पाई जुड़ी है।'
      check:
        prompt: किस अक्षर में 'अ' के बाद एक खड़ी पाई जुड़ी है?
        options:
        - आ
        - इ
        - ई
        answer: आ
        why: अ + पाई = आ, इसलिए आवाज़ लंबी।
      ways:
      - style: visual
        teach: छोटी आवाज़ वाले और लंबी आवाज़ वाले अक्षर, आमने-सामने।
        picture:
          kind: compare
          columns:
          - title: छोटी आवाज़
            points:
            - अ
            - इ
          - title: लंबी आवाज़
            points:
            - आ
            - ई
          alt: अ और इ छोटी आवाज़ वाले अक्षर हैं। आ और ई लंबी आवाज़ वाले अक्षर हैं।
      - style: step_by_step
        teach: 'छोटी और लंबी आवाज़ का खेल। पहला: ''अ'' बोलो और एक ताली बजाओ। दूसरा: ''आ'' बोलो और जब तक आवाज़ चले, हाथ फैलाते जाओ। तीसरा: ''इ'' के साथ एक ताली बजाओ। चौथा: ''ई'' के साथ फिर हाथ फैलाओ, लंबी आवाज़ देर तक चलती है।'
  items:
  - prompt: '''अ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🍍 अनानास
    - 🥭 आम
    - 🦉 उल्लू
    answer: 🍍 अनानास
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'अ' होनी चाहिए।
    solution: अनानास 'अ' से शुरू होता है।
    mistakes:
      🥭 आम: lkgh_sound
  - prompt: '''आ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🥭 आम
    - 🍍 अनानास
    - 🌰 इमली
    answer: 🥭 आम
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'आ' होनी चाहिए।
    solution: आम 'आ' से शुरू होता है।
    mistakes:
      🍍 अनानास: lkgh_sound
  - prompt: '''इ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🌰 इमली
    - 🥭 आम
    - 🦉 उल्लू
    answer: 🌰 इमली
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'इ' होनी चाहिए।
    solution: इमली 'इ' से शुरू होता है।
    mistakes:
      🥭 आम: lkgh_sound
  - prompt: '''ई'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🎋 ईख
    - 🍍 अनानास
    - 🥭 आम
    answer: 🎋 ईख
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ई' होनी चाहिए।
    solution: ईख 'ई' से शुरू होता है।
    mistakes:
      🍍 अनानास: lkgh_sound
  - prompt: '''अ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🍇 अंगूर
    - 🥭 आम
    - 🎋 ईख
    answer: 🍇 अंगूर
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'अ' होनी चाहिए।
    solution: अंगूर 'अ' से शुरू होता है।
    mistakes:
      🥭 आम: lkgh_sound
  - prompt: '''आ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🥔 आलू
    - 🍍 अनानास
    - 🍇 अंगूर
    answer: 🥔 आलू
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'आ' होनी चाहिए।
    solution: आलू 'आ' से शुरू होता है।
    mistakes:
      🍍 अनानास: lkgh_sound
  - prompt: किस शब्द की पहली आवाज़ 'अ' है?
    options:
    - 🍐 अमरूद
    - 🎋 ईख
    - 🏢 इमारत
    answer: 🍐 अमरूद
    difficulty: 1
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: अमरूद बोलो। चरण 2: पहली आवाज़ ''अ'' है।'
    mistakes:
      🎋 ईख: lkh1_first
      🏢 इमारत: lkh1_first
  - prompt: किस शब्द की पहली आवाज़ 'आ' है?
    options:
    - 👁️ आँख
    - 🎋 ईख
    - 📰 अखबार
    answer: 👁️ आँख
    difficulty: 1
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: आँख बोलो। चरण 2: पहली आवाज़ ''आ'' है।'
    mistakes:
      🎋 ईख: lkh1_first
      📰 अखबार: lkh1_first
  - prompt: किस शब्द की पहली आवाज़ 'इ' है?
    options:
    - 🌈 इंद्रधनुष
    - 🎋 ईख
    - 🔥 आग
    answer: 🌈 इंद्रधनुष
    difficulty: 2
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: इंद्रधनुष बोलो। चरण 2: पहली आवाज़ ''इ'' है।'
    mistakes:
      🎋 ईख: lkh1_first
      🔥 आग: lkh1_first
  - prompt: किस शब्द की पहली आवाज़ 'ई' है?
    options:
    - 🎋 ईख
    - 🌈 इंद्रधनुष
    - 📰 अखबार
    answer: 🎋 ईख
    difficulty: 2
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: ईख बोलो। चरण 2: पहली आवाज़ ''ई'' है।'
    mistakes:
      🌈 इंद्रधनुष: lkh1_first
      📰 अखबार: lkh1_first
  - prompt: '''📰 अखबार'' किस अक्षर से शुरू होता है?'
    options:
    - अ
    - इ
    - ई
    answer: अ
    difficulty: 2
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: अखबार की पहली आवाज़। चरण 2: ''अ''।'
    mistakes:
      इ: lkh1_look
      ई: lkh1_look
  - prompt: '''🔥 आग'' किस अक्षर से शुरू होता है?'
    options:
    - आ
    - ई
    - अ
    answer: आ
    difficulty: 2
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: आग की पहली आवाज़। चरण 2: ''आ''।'
    mistakes:
      ई: lkh1_look
      अ: lkh1_look
  - prompt: '''🏢 इमारत'' किस अक्षर से शुरू होता है?'
    options:
    - इ
    - आ
    - अ
    answer: इ
    difficulty: 3
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: इमारत की पहली आवाज़। चरण 2: ''इ''।'
    mistakes:
      आ: lkh1_look
      अ: lkh1_look
  - prompt: '''🧱 ईंट'' किस अक्षर से शुरू होता है?'
    options:
    - ई
    - अ
    - आ
    answer: ई
    difficulty: 3
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: ईंट की पहली आवाज़। चरण 2: ''ई''।'
