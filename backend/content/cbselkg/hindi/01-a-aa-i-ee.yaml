# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 1. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 1
title: अ, आ, इ, ई
tips:
  lkgh_sound: शब्द धीरे से बोलो। पहली आवाज़ सुनो।
  lkgh_look: चित्र फिर से देखो और उसका नाम बोलो।
concepts:
- code: lkgh.svar1
  title: अ, आ, इ, ई
  notes: |
    हिंदी अक्षर अ, आ, इ, ई: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'हिंदी के स्वर बोलो: अ, आ, इ, ई। अ से अनानास 🍍, आ से आम 🥭, इ से इमली 🌰, ई से ईख 🎋, अ से अंगूर 🍇, आ से आलू 🥔।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - अ
      - आ
      - इ
    - title: शब्द
      points:
      - अनानास 🍍
      - आम 🥭
      - इमली 🌰
    alt: अ से अनानास 🍍, आ से आम 🥭, इ से इमली 🌰।
  items:
  - prompt: '''अ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🍍 अनानास
    - 🥭 आम
    - 🦉 उल्लू
    answer: 🍍 अनानास
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'अ' होनी चाहिए।
    solution: अनानास 'अ' से शुरू होता है।
    mistakes:
      🥭 आम: lkgh_sound
  - prompt: '''आ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🥭 आम
    - 🍍 अनानास
    - 🌰 इमली
    answer: 🥭 आम
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'आ' होनी चाहिए।
    solution: आम 'आ' से शुरू होता है।
    mistakes:
      🍍 अनानास: lkgh_sound
  - prompt: '''इ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🌰 इमली
    - 🥭 आम
    - 🦉 उल्लू
    answer: 🌰 इमली
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'इ' होनी चाहिए।
    solution: इमली 'इ' से शुरू होता है।
    mistakes:
      🥭 आम: lkgh_sound
  - prompt: '''ई'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🎋 ईख
    - 🍍 अनानास
    - 🥭 आम
    answer: 🎋 ईख
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ई' होनी चाहिए।
    solution: ईख 'ई' से शुरू होता है।
    mistakes:
      🍍 अनानास: lkgh_sound
  - prompt: '''अ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🍇 अंगूर
    - 🥭 आम
    - 🎋 ईख
    answer: 🍇 अंगूर
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'अ' होनी चाहिए।
    solution: अंगूर 'अ' से शुरू होता है।
    mistakes:
      🥭 आम: lkgh_sound
  - prompt: '''आ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🥔 आलू
    - 🍍 अनानास
    - 🍇 अंगूर
    answer: 🥔 आलू
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'आ' होनी चाहिए।
    solution: आलू 'आ' से शुरू होता है।
    mistakes:
      🍍 अनानास: lkgh_sound
