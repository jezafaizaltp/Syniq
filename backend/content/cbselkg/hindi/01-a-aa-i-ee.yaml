    - किसे बोलते समय आवाज़ देर तक खिंचती है?
    solution: 'चरण 1: इ छोटी, ई लंबी। चरण 2: ई।'
    mistakes:
      इ: lkh1_look
      दोनों छोटे: lkh1_look
  - prompt: 'स्थिति (केस): माँ बाज़ार से एक फल लाईं। उसके अंदर लाल-लाल दाने हैं और उसका नाम ''अ'' से शुरू होता है। वह कौन-सा फल है?'
