    - किस नाम की पहली आवाज़ 'अ' है?
    solution: '''अनार'' की पहली आवाज़ ''अ'' है, और उसके अंदर लाल दाने होते हैं।'
    mistakes:
      केला: lkh1_first
      सेब: lkh1_first
    exam: case
    difficulty: 2
  - prompt: 'परिस्थिति: रसोई में लकड़ी और गैस को ''ईंधन'' कहते हैं। ''ईंधन'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - ई
    - इ
    - अ
    answer: ई
    hints:
    - '''ईंधन'' धीरे से बोलो।'
    - पहली आवाज़ छोटी है या लंबी?
    solution: '''ईंधन'' की पहली आवाज़ लंबी ''ई'' है।'
    mistakes:
      इ: lkh1_first
      अ: lkh1_first
    exam: competency
    difficulty: 2
