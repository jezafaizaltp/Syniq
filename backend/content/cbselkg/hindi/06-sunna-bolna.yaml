# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 6
title: सुनो और बोलो
tips:
  kgh_awaaz: "जानवर की आवाज़ मन में सुनो। म्याऊँ बिल्ली करती है। कुत्ता कैसे भौंकता है?"
  kgh_english: "Father पापा हैं, Sister बहन। माँ के लिए कौन-सा शब्द बचा?"
  kgh_namaste: "अलविदा जाते समय, शुभ रात्रि सोते समय। सुबह मिलते ही हाथ जोड़कर क्या कहते हैं?"
  kgh_paani: "पत्थर ज़िंदा नहीं है। पेड़, गाय, चिड़िया, तुम: सबको किसकी प्यास लगती है?"
  kgh_seb: "सेब को याद करो, उसका रंग टमाटर जैसा होता है।"
  lkh6_awaaz: उस जानवर को मन में देखो और उसकी आवाज़ धीरे से निकालकर सुनो।
  lkh6_rang: उस चीज़ को मन में देखो। उसका रंग कैसा है?
  lkh6_baat: सोचो, ऐसे समय में अच्छे बच्चे क्या बोलते हैं?

concepts:
- code: lkgh.bolo
  title: सुनो और बोलो
  notes: |
    सुनना और बोलना: अपना नाम, परिवार के लोगों के नाम, रंग, फल, जानवरों की आवाज़ें; छोटी कविताएँ।
  explanations:
    text: हम हिंदी में अपना नाम, परिवार के लोग, रंग और जानवरों की आवाज़ें बोल सकते हैं। गाय कहती है 'बाँ', कुत्ता 'भौं-भौं'।
    visual: 'चित्र बनाओ: गाय, कुत्ता और बिल्ली, और हर एक के पास उसकी आवाज़ लिखो।'
    step_by_step: 1. सुनो। 2. दोहराओ। 3. चित्र से मिलाओ।
    real_world: घर में हिंदी में चीज़ों के नाम बोलने का खेल खेलो।
  picture:
    kind: compare
    columns:
    - title: जानवर
      points:
      - 🐄 गाय
      - 🐶 कुत्ता
      - 🐱 बिल्ली
    - title: आवाज़
      points:
      - बाँ
      - भौं-भौं
      - म्याऊँ
    alt: गाय बाँ, कुत्ता भौं-भौं और बिल्ली म्याऊँ बोलती है।
  activity:
    type: sort
    prompt: कौन कैसे बोलता है?
    bins:
    - म्याऊँ
    - भौं-भौं
    - कुकड़ूँ-कूँ
    - मैं-मैं
    items:
    - label: 🐱 बिल्ली
      bin: म्याऊँ
      clue: बिल्ली की आवाज़?
      why: बिल्ली म्याऊँ करती है।
    - label: 🐶 कुत्ता
      bin: भौं-भौं
      clue: कुत्ते की आवाज़?
      why: कुत्ता भौं-भौं करता है।
    - label: 🐓 मुर्गा
      bin: कुकड़ूँ-कूँ
      clue: सुबह कौन जगाता है?
      why: मुर्गा कुकड़ूँ-कूँ करता है।
    - label: 🐐 बकरी
      bin: मैं-मैं
      clue: बकरी की आवाज़?
      why: बकरी मैं-मैं करती है।
  lesson:
    - teach: 'ध्यान से सुनो! हर जानवर की अपनी आवाज़ है: गाय ''बाँ'', बकरी ''में-में'', कौआ ''काँव-काँव'', शेर दहाड़ता है।'
      picture:
        kind: compare
        columns:
        - title: जानवर
          points:
          - गाय
          - बकरी
          - कौआ
        - title: आवाज़
          points:
          - बाँ
          - में-में
          - काँव-काँव
        alt: जानवर और उनकी आवाज़ें।
      check:
        prompt: कौआ कैसे बोलता है?
        options:
        - काँव-काँव
        - म्याऊँ
        - में-में
        answer: काँव-काँव
        why: कौआ काँव-काँव करता है।
      ways:
      - style: visual
        teach: कुछ और जीवों की आवाज़ें, साथ-साथ देखो और बोलकर सुनो।
        picture:
          kind: compare
          columns:
          - title: जीव
            points:
            - 🐓 मुर्गा
            - 🐝 मधुमक्खी
            - 🐦‍⬛ कौआ
          - title: आवाज़
            points:
            - कुकड़ूँ-कूँ
            - भिन-भिन
            - काँव-काँव
          alt: मुर्गा कुकड़ूँ-कूँ करता है, मधुमक्खी भिन-भिन करती है और कौआ काँव-काँव करता है।
      - style: step_by_step
        teach: 'आवाज़ पहचानो खेल। पहला: आँखें बंद करो। दूसरा: कोई बड़ा किसी जीव की आवाज़ निकाले। तीसरा: ध्यान से सुनो। चौथा: आँखें खोलकर उस जीव का नाम बोलो।'
    - teach: 'रंगों के नाम बोलो: लाल 🍎, पीला 🍌, हरा 🌿, नीला आसमान, सफ़ेद दूध 🥛, काला कौआ।'
      check:
        prompt: दूध का रंग क्या है?
        options:
        - सफ़ेद
        - हरा
        - काला
        answer: सफ़ेद
        why: दूध सफ़ेद होता है।
      ways:
      - style: visual
        teach: हमारे आसपास की कुछ और चीज़ें और उनके रंग, साथ-साथ देखो।
        picture:
          kind: compare
          columns:
          - title: चीज़
            points:
            - 🥕 गाजर
            - 🍆 बैंगन
            - ☁️ बादल
          - title: रंग
            points:
            - नारंगी
            - बैंगनी
            - सफ़ेद
          alt: गाजर नारंगी है, बैंगन बैंगनी है और बादल सफ़ेद है।
      - style: real_world
        teach: रंगोली बनाते समय लोग रंगों के नाम लेकर कहते हैं, 'अब यहाँ हरा डालो, वहाँ पीला।'
    - teach: 'अच्छे शब्द बोलो: मिलने पर ''नमस्ते'', कुछ मिले तो ''धन्यवाद'', गलती हो तो ''माफ़ कीजिए'', कुछ माँगना हो तो ''कृपया''।'
      check:
        prompt: किसी ने तुम्हें खिलौना दिया। तुम क्या बोलोगे?
        options:
        - धन्यवाद
        - जाओ
        - कुछ नहीं
        answer: धन्यवाद
        why: कुछ मिलने पर धन्यवाद कहते हैं।
      ways:
      - style: visual
        teach: किस मौके पर कौन-सा अच्छा शब्द बोलें, साथ-साथ देखो।
        picture:
          kind: compare
          columns:
          - title: कब
            points:
            - कोई खेल जीते
            - कोई मेहमान घर आए
            - किसी से विदा लेना हो
          - title: क्या बोलें
            points:
            - बधाई हो
            - आइए, स्वागत है
            - फिर मिलेंगे
          alt: कोई खेल जीते तो 'बधाई हो' बोलो, कोई मेहमान घर आए तो 'आइए, स्वागत है' बोलो, और विदा लेते समय 'फिर मिलेंगे' बोलो।
      - style: real_world
        teach: जन्मदिन पर जब कोई बच्चा मोमबत्ती बुझाता है, तो सब ताली बजाकर कहते हैं, 'जन्मदिन मुबारक हो!'
  items:
  - prompt: बिल्ली क्या बोलती है?
    options:
    - म्याऊँ
    - भौं-भौं
    - बाँ
    answer: म्याऊँ
    difficulty: 1
    hints:
    - छोटा जानवर, दूध पीती है।
    - म्या...
    solution: बिल्ली म्याऊँ बोलती है।
    mistakes:
      भौं-भौं: lkgh_look
  - prompt: कुत्ता क्या बोलता है?
    options:
    - भौं-भौं
    - म्याऊँ
    - कुहू
    answer: भौं-भौं
    difficulty: 1
    hints:
    - घर की रखवाली करता है।
    - भौं...
    solution: कुत्ता भौं-भौं बोलता है।
    mistakes: {"म्याऊँ": "kgh_awaaz", "कुहू": "kgh_awaaz"}
  - prompt: '''माँ'' को अंग्रेज़ी में क्या कहते हैं?'
    options:
    - Mother
    - Father
    - Sister
    answer: Mother
    difficulty: 2
    hints:
    - म से मिलता-जुलता।
    - "घर में माँ को मम्मी भी कहते हैं।"
    solution: माँ को Mother कहते हैं।
    mistakes: {"Father": "kgh_english", "Sister": "kgh_english"}
  - prompt: सेब का रंग क्या है?
    options:
    - लाल
    - नीला
    - काला
    answer: लाल
    difficulty: 1
    hints:
    - 🍎
    - आग जैसा।
    solution: सेब लाल होता है।
    mistakes: {"नीला": "kgh_seb", "काला": "kgh_seb"}
  - prompt: '''पानी'' कौन पीता है?'
    options:
    - सब जीव
    - सिर्फ़ पत्थर
    - कोई नहीं
    answer: सब जीव
    difficulty: 2
    hints:
    - प्यास लगती है।
    - हम भी।
    solution: सब जीव पानी पीते हैं।
    mistakes: {"सिर्फ़ पत्थर": "kgh_paani", "कोई नहीं": "kgh_paani"}
  - prompt: सुबह मिलने पर क्या बोलते हैं?
    options:
    - नमस्ते
    - अलविदा
    - शुभ रात्रि
    answer: नमस्ते
    difficulty: 2
    hints:
    - हाथ जोड़कर।
    - न से।
    solution: मिलने पर नमस्ते बोलते हैं।
    mistakes: {"अलविदा": "kgh_namaste", "शुभ रात्रि": "kgh_namaste"}
  - prompt: गाय कैसे बोलती है?
    options:
    - बाँ
    - भौं-भौं
    - काँव-काँव
    answer: बाँ
    difficulty: 1
    hints:
    - गाय को मन में देखो।
    - लंबी, गहरी आवाज़।
    solution: 'चरण 1: गाय की आवाज़। चरण 2: बाँ।'
    mistakes:
      भौं-भौं: lkh6_awaaz
      काँव-काँव: lkh6_awaaz
  - prompt: केले का रंग क्या है?
    options:
    - पीला
    - नीला
    - काला
    answer: पीला
    difficulty: 1
    hints:
    - पका केला मन में देखो।
    - धूप जैसा रंग।
    solution: 'चरण 1: पका केला। चरण 2: पीला।'
    mistakes:
      नीला: lkh6_rang
      काला: lkh6_rang
  - prompt: गलती से किसी का पैर दब गया। क्या बोलें?
    options:
    - माफ़ कीजिए
    - हा-हा
    - चुप रहें
    answer: माफ़ कीजिए
    difficulty: 2
    hints:
    - उसे दर्द हुआ होगा।
    - गलती मानने वाले शब्द।
    solution: 'चरण 1: गलती हुई। चरण 2: माफ़ी माँगो।'
    mistakes:
      हा-हा: lkh6_baat
      चुप रहें: lkh6_baat
  - prompt: बकरी कैसे बोलती है?
    options:
    - में-में
    - म्याऊँ
    - दहाड़
    answer: में-में
    difficulty: 1
    hints:
    - बकरी को मन में देखो।
    - पतली, काँपती आवाज़।
    solution: 'चरण 1: बकरी की आवाज़। चरण 2: में-में।'
    mistakes:
      म्याऊँ: lkh6_awaaz
      दहाड़: lkh6_awaaz
  - prompt: पत्तों का रंग क्या है?
    options:
    - हरा
    - लाल
    - सफ़ेद
    answer: हरा
    difficulty: 1
    hints:
    - पेड़ के पत्ते मन में देखो।
    - घास जैसा रंग।
    solution: 'चरण 1: पत्ते। चरण 2: हरा।'
    mistakes:
      लाल: lkh6_rang
      सफ़ेद: lkh6_rang
  - prompt: पानी माँगना है। कैसे बोलें?
    options:
    - कृपया पानी दीजिए
    - पानी लाओ जल्दी
    - चिल्लाकर रोएँ
    answer: कृपया पानी दीजिए
    difficulty: 2
    hints:
    - प्यार से माँगने वाला शब्द।
    - धीरे और अच्छे से।
    solution: 'चरण 1: माँगते समय अच्छे शब्द। चरण 2: कृपया पानी दीजिए।'
    mistakes:
      पानी लाओ जल्दी: lkh6_baat
      चिल्लाकर रोएँ: lkh6_baat
  - prompt: कोयल कैसे गाती है?
    options:
    - कुहू-कुहू
    - भौं-भौं
    - बाँ
    answer: कुहू-कुहू
    difficulty: 3
    hints:
    - काली चिड़िया, मीठा गाना।
    - आम के पेड़ पर गाती है।
    solution: 'चरण 1: कोयल का मीठा गाना। चरण 2: कुहू-कुहू।'
    mistakes:
      भौं-भौं: lkh6_awaaz
      बाँ: lkh6_awaaz
  - prompt: रात को सोने से पहले क्या बोलते हैं?
    options:
    - शुभ रात्रि
    - सुप्रभात
    - चलो खेलें
    answer: शुभ रात्रि
    difficulty: 3
    hints:
    - रात का अच्छा संदेश।
    - सुबह वाला शब्द नहीं।
    solution: 'चरण 1: रात का समय। चरण 2: शुभ रात्रि।'
    mistakes:
      सुप्रभात: lkh6_baat
      चलो खेलें: lkh6_baat
  - prompt: टमाटर का रंग क्या है?
    options:
    - लाल
    - नीला
    - पीला
    answer: लाल
    difficulty: 2
    hints:
    - पका टमाटर मन में देखो।
    - सेब जैसा रंग।
    solution: 'चरण 1: पका टमाटर। चरण 2: लाल।'
    mistakes:
      नीला: lkh6_rang
      पीला: lkh6_rang
  - prompt: 'स्थिति (केस): स्कूल में आशा ने गिरी हुई पेंसिल उठाकर रवि को दी। रवि को क्या बोलना चाहिए?'
    options:
    - धन्यवाद
    - शुभ रात्रि
    - कुछ नहीं
    answer: धन्यवाद
    hints:
    - आशा ने रवि की मदद की।
    - मदद मिलने पर कौन-सा अच्छा शब्द बोलते हैं?
    solution: किसी से मदद मिले तो 'धन्यवाद' बोलते हैं।
    mistakes:
      शुभ रात्रि: lkh6_baat
      कुछ नहीं: lkh6_baat
    exam: case
    difficulty: 2
  - prompt: 'परिस्थिति: रात में तालाब के पास से ''टर्र-टर्र'' की आवाज़ आ रही है। यह किसकी आवाज़ है?'
    options:
    - मेंढक
    - गाय
    - बिल्ली
    answer: मेंढक
    hints:
    - तालाब के पास कौन रहता है?
    - गाय 'बाँ' करती है और बिल्ली 'म्याऊँ'।
    solution: मेंढक तालाब के पास रहता है और 'टर्र-टर्र' करता है।
    mistakes:
      गाय: lkh6_awaaz
      बिल्ली: lkh6_awaaz
    exam: competency
    difficulty: 2
