# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 6. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 6
title: सुनो और बोलो
tips:
  kgh_awaaz: "जानवर की आवाज़ मन में सुनो। म्याऊँ बिल्ली करती है। कुत्ता कैसे भौंकता है?"
  kgh_english: "Father पापा हैं, Sister बहन। माँ के लिए कौन-सा शब्द बचा?"
  kgh_namaste: "अलविदा जाते समय, शुभ रात्रि सोते समय। सुबह मिलते ही हाथ जोड़कर क्या कहते हैं?"
  kgh_paani: "पत्थर ज़िंदा नहीं है। पेड़, गाय, चिड़िया, तुम: सबको किसकी प्यास लगती है?"
  kgh_seb: "सेब को याद करो, उसका रंग टमाटर जैसा होता है।"

concepts:
- code: lkgh.bolo
  title: सुनो और बोलो
  notes: |
    सुनना और बोलना: अपना नाम, परिवार के लोगों के नाम, रंग, फल, जानवरों की आवाज़ें; छोटी कविताएँ।
  explanations:
    text: हम हिंदी में अपना नाम, परिवार के लोग, रंग और जानवरों की आवाज़ें बोल सकते हैं। गाय कहती है 'बाँ', कुत्ता 'भौं-भौं'।
    visual: 'चित्र बनाओ: गाय, कुत्ता और बिल्ली, और हर एक के पास उसकी आवाज़ लिखो।'
    step_by_step: 1. सुनो। 2. दोहराओ। 3. चित्र से मिलाओ।
    real_world: घर में हिंदी में चीज़ों के नाम बोलने का खेल खेलो।
  picture:
    kind: compare
    columns:
    - title: जानवर
      points:
      - 🐄 गाय
      - 🐶 कुत्ता
      - 🐱 बिल्ली
    - title: आवाज़
      points:
      - बाँ
      - भौं-भौं
      - म्याऊँ
    alt: गाय बाँ, कुत्ता भौं-भौं और बिल्ली म्याऊँ बोलती है।
  activity:
    type: sort
    prompt: कौन कैसे बोलता है?
    bins:
    - म्याऊँ
    - भौं-भौं
    - कुकड़ूँ-कूँ
    - मैं-मैं
    items:
    - label: 🐱 बिल्ली
      bin: म्याऊँ
      clue: बिल्ली की आवाज़?
      why: बिल्ली म्याऊँ करती है।
    - label: 🐶 कुत्ता
      bin: भौं-भौं
      clue: कुत्ते की आवाज़?
      why: कुत्ता भौं-भौं करता है।
    - label: 🐓 मुर्गा
      bin: कुकड़ूँ-कूँ
      clue: सुबह कौन जगाता है?
      why: मुर्गा कुकड़ूँ-कूँ करता है।
    - label: 🐐 बकरी
      bin: मैं-मैं
      clue: बकरी की आवाज़?
      why: बकरी मैं-मैं करती है।
  items:
  - prompt: बिल्ली क्या बोलती है?
    options:
    - म्याऊँ
    - भौं-भौं
    - बाँ
    answer: म्याऊँ
    difficulty: 1
    hints:
    - छोटा जानवर, दूध पीती है।
    - म्या...
    solution: बिल्ली म्याऊँ बोलती है।
    mistakes:
      भौं-भौं: lkgh_look
  - prompt: कुत्ता क्या बोलता है?
    options:
    - भौं-भौं
    - म्याऊँ
    - कुहू
    answer: भौं-भौं
    difficulty: 1
    hints:
    - घर की रखवाली करता है।
    - भौं...
    solution: कुत्ता भौं-भौं बोलता है।
    mistakes: {"म्याऊँ": "kgh_awaaz", "कुहू": "kgh_awaaz"}
  - prompt: '''माँ'' को अंग्रेज़ी में क्या कहते हैं?'
    options:
    - Mother
    - Father
    - Sister
    answer: Mother
    difficulty: 2
    hints:
    - म से मिलता-जुलता।
    - "घर में माँ को मम्मी भी कहते हैं।"
    solution: माँ को Mother कहते हैं।
    mistakes: {"Father": "kgh_english", "Sister": "kgh_english"}
  - prompt: सेब का रंग क्या है?
    options:
    - लाल
    - नीला
    - काला
    answer: लाल
    difficulty: 1
    hints:
    - 🍎
    - आग जैसा।
    solution: सेब लाल होता है।
    mistakes: {"नीला": "kgh_seb", "काला": "kgh_seb"}
  - prompt: '''पानी'' कौन पीता है?'
    options:
    - सब जीव
    - सिर्फ़ पत्थर
    - कोई नहीं
    answer: सब जीव
    difficulty: 2
    hints:
    - प्यास लगती है।
    - हम भी।
    solution: सब जीव पानी पीते हैं।
    mistakes: {"सिर्फ़ पत्थर": "kgh_paani", "कोई नहीं": "kgh_paani"}
  - prompt: सुबह मिलने पर क्या बोलते हैं?
    options:
    - नमस्ते
    - अलविदा
    - शुभ रात्रि
    answer: नमस्ते
    difficulty: 2
    hints:
    - हाथ जोड़कर।
    - न से।
    solution: मिलने पर नमस्ते बोलते हैं।
    mistakes: {"अलविदा": "kgh_namaste", "शुभ रात्रि": "kgh_namaste"}
