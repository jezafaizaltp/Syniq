# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 2
title: उ, ऊ, ए, ऐ
tips:
  lkh2_first: शब्द धीरे-धीरे बोलो और सिर्फ़ सबसे पहली आवाज़ सुनो।
  lkh2_look: 'अक्षरों को ध्यान से देखो: कहाँ रेखा है, कहाँ गोला? उँगली से हवा में बनाओ।'
concepts:
- code: lkgh.svar2
  title: उ, ऊ, ए, ऐ
  notes: |
    हिंदी अक्षर उ, ऊ, ए, ऐ: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'और स्वर: उ, ऊ, ए, ऐ। उ से उल्लू 🦉, ऊ से ऊन 🧶, ए से एड़ी 🦶, ऐ से ऐनक 🕶️, ऊ से ऊँट 🐫, उ से उँगली ☝️।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - उ
      - ऊ
      - ए
    - title: शब्द
      points:
      - उल्लू 🦉
      - ऊन 🧶
      - एड़ी 🦶
    alt: उ से उल्लू 🦉, ऊ से ऊन 🧶, ए से एड़ी 🦶।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - उ
    - ऊ
    - ए
    - ऐ
    items:
    - label: 🦉 उल्लू
      bin: उ
      clue: 'उल्-लू: छोटी उ?'
      why: उल्लू उ से।
    - label: 🐪 ऊँट
      bin: ऊ
      clue: 'ऊँ-ट: लंबी ऊ?'
      why: ऊँट ऊ से।
    - label: 🧶 ऊन
      bin: ऊ
      clue: 'ऊ-न: लंबी आवाज़?'
      why: ऊन ऊ से।
    - label: 1️⃣ एक
      bin: ए
      clue: 'ए-क: पहली आवाज़?'
      why: एक ए से।
    - label: 👓 ऐनक
      bin: ऐ
      clue: 'ऐ-नक: पहली आवाज़?'
      why: ऐनक ऐ से।
  lesson:
    - teach: 'आज के अक्षर: उ, ऊ। हर अक्षर की अपनी आवाज़ है: उ से 🦉 उल्लू; ऊ से 🐫 ऊँट।'
      check:
        prompt: '''उ'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🦉 उल्लू
        - 1️⃣ एक
        - 🐫 ऊँट
        answer: 🦉 उल्लू
        why: 'उल्लू बोलो: सबसे पहले ''उ'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: उ और ऊ से शुरू होने वाले कुछ और शब्द। हर शब्द बोलो और पहली आवाज़ सुनो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - उ
            - ऊ
          - title: शब्द
            points:
            - 🎁 उपहार
            - ⬆️ ऊपर
          - title: एक और शब्द
            points:
            - उबला अंडा
            - ऊँचा पेड़
          alt: उ से उपहार और अंडा। ऊ से ऊपर और पेड़।
      - style: step_by_step
        teach: 'पहली आवाज़ सुनो। पहला: ''उपहार'' शब्द धीरे-धीरे बोलो। दूसरा: सबसे पहली आवाज़ पर रुक जाओ। तीसरा: उस आवाज़ को अकेले बोलो। चौथा: यह आवाज़ ''उ'' अक्षर की है।'
    - teach: 'और अक्षर: ए। ए से 1️⃣ एक।'
      check:
        prompt: '''ए'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 1️⃣ एक
        - ☝️ उँगली
        - 🧶 ऊन
        answer: 1️⃣ एक
        why: 'एक बोलो: सबसे पहले ''ए'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: ए से शुरू होने वाले कुछ और शब्द। हर चित्र देखो और उसकी पहली आवाज़ बोलो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - ए
          - title: शब्द
            points:
            - 🪕 एकतारा
          - title: एक और शब्द
            points:
            - 🚑 एंबुलेंस
          alt: ए से एकतारा और एंबुलेंस।
      - style: real_world
        teach: घर या स्कूल में ऐसी चीज़ें ढूँढो जिनके नाम ए से शुरू होते हैं, और हर नाम ज़ोर से बोलकर किसी बड़े को सुनाओ।
    - teach: 'उ छोटी आवाज़, ऊ लंबी: उ... ऊ...। ए और ऐ भी जोड़ी हैं: ए में ऊपर एक मात्रा, ऐ में दो। ऐ से ऐनक 🕶️ (चश्मा)।'
      check:
        prompt: किस अक्षर के ऊपर दो मात्राएँ हैं?
        options:
        - ऐ
        - ए
        - उ
        answer: ऐ
        why: ए में एक, ऐ में दो मात्राएँ ऊपर होती हैं।
      ways:
      - style: visual
        teach: छोटी आवाज़ और लंबी आवाज़ वाले अक्षर, और ए-ऐ की जोड़ी।
        picture:
          kind: compare
          columns:
          - title: छोटी आवाज़
            points:
            - उ
          - title: लंबी आवाज़
            points:
            - ऊ
          - title: जोड़ी
            points:
            - ए और ऐ
          alt: उ छोटी आवाज़ है और ऊ लंबी आवाज़। ए और ऐ एक जोड़ी हैं।
      - style: step_by_step
        teach: 'छोटी और लंबी आवाज़ सुनो। पहला: ''उ'' बोलो और एक बार उँगली उठाओ। दूसरा: ''ऊ'' बोलो और उँगली धीरे-धीरे ऊपर ले जाओ। तीसरा: देखो, ''ऊ'' देर तक चली। चौथा: अब ''ए'' और ''ऐ'' बोलकर सुनो, दोनों की आवाज़ अलग है।'
  items:
  - prompt: '''उ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🦉 उल्लू
    - 🧶 ऊन
    - 🕶️ ऐनक
    answer: 🦉 उल्लू
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'उ' होनी चाहिए।
    solution: उल्लू 'उ' से शुरू होता है।
    mistakes:
      🧶 ऊन: lkgh_sound
  - prompt: '''ऊ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🧶 ऊन
    - 🦉 उल्लू
    - 🕶️ ऐनक
    answer: 🧶 ऊन
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ऊ' होनी चाहिए।
    solution: ऊन 'ऊ' से शुरू होता है।
    mistakes:
      🦉 उल्लू: lkgh_sound
  - prompt: '''ए'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🦶 एड़ी
    - 🧶 ऊन
    - 🦉 उल्लू
    answer: 🦶 एड़ी
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ए' होनी चाहिए।
    solution: एड़ी 'ए' से शुरू होता है।
    mistakes:
      🧶 ऊन: lkgh_sound
  - prompt: '''ऐ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🕶️ ऐनक
    - 🦶 एड़ी
    - 🧶 ऊन
    answer: 🕶️ ऐनक
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ऐ' होनी चाहिए।
    solution: ऐनक 'ऐ' से शुरू होता है।
    mistakes:
      🦶 एड़ी: lkgh_sound
  - prompt: '''ऊ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🐫 ऊँट
    - 🦉 उल्लू
    - 🕶️ ऐनक
    answer: 🐫 ऊँट
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ऊ' होनी चाहिए।
    solution: ऊँट 'ऊ' से शुरू होता है।
    mistakes:
      🦉 उल्लू: lkgh_sound
  - prompt: '''उ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - ☝️ उँगली
    - 🐫 ऊँट
    - 🧶 ऊन
    answer: ☝️ उँगली
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'उ' होनी चाहिए।
    solution: उँगली 'उ' से शुरू होता है।
    mistakes:
      🐫 ऊँट: lkgh_sound
  - prompt: किस शब्द की पहली आवाज़ 'उ' है?
    options:
    - ☝️ उँगली
    - 🦶 एड़ी
    - 🐫 ऊँट
    answer: ☝️ उँगली
    difficulty: 1
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: उँगली बोलो। चरण 2: पहली आवाज़ ''उ'' है।'
    mistakes:
      🦶 एड़ी: lkh2_first
      🐫 ऊँट: lkh2_first
  - prompt: किस शब्द की पहली आवाज़ 'ऊ' है?
    options:
    - 🧶 ऊन
    - 🦶 एड़ी
    - 🦉 उल्लू
    answer: 🧶 ऊन
    difficulty: 1
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: ऊन बोलो। चरण 2: पहली आवाज़ ''ऊ'' है।'
    mistakes:
      🦶 एड़ी: lkh2_first
      🦉 उल्लू: lkh2_first
  - prompt: किस शब्द की पहली आवाज़ 'ए' है?
    options:
    - 🦶 एड़ी
    - ☝️ उँगली
    - 🐫 ऊँट
    answer: 🦶 एड़ी
    difficulty: 2
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: एड़ी बोलो। चरण 2: पहली आवाज़ ''ए'' है।'
    mistakes:
      ☝️ उँगली: lkh2_first
      🐫 ऊँट: lkh2_first
  - prompt: '''🦉 उल्लू'' किस अक्षर से शुरू होता है?'
    options:
    - उ
    - ऊ
    - ए
    answer: उ
    difficulty: 2
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: उल्लू की पहली आवाज़। चरण 2: ''उ''।'
    mistakes:
      ऊ: lkh2_look
      ए: lkh2_look
  - prompt: '''🐫 ऊँट'' किस अक्षर से शुरू होता है?'
    options:
    - ऊ
    - ए
    - उ
    answer: ऊ
    difficulty: 2
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: ऊँट की पहली आवाज़। चरण 2: ''ऊ''।'
    mistakes:
      ए: lkh2_look
      उ: lkh2_look
  - prompt: '''1️⃣ एक'' किस अक्षर से शुरू होता है?'
    options:
    - ए
    - उ
    - ऊ
    answer: ए
    difficulty: 3
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: एक की पहली आवाज़। चरण 2: ''ए''।'
    mistakes:
      उ: lkh2_look
      ऊ: lkh2_look
  - prompt: '''🕶️ ऐनक'' किस अक्षर से शुरू होता है?'
    options:
    - ऐ
    - ए
    - उ
    answer: ऐ
    difficulty: 2
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - ऊपर दो मात्राओं वाला अक्षर।
    solution: 'चरण 1: ऐ-नक। चरण 2: ऐ।'
    mistakes:
      ए: lkh2_look
      उ: lkh2_look
  - prompt: किस शब्द की पहली आवाज़ 'ऐ' है?
    options:
    - 🕶️ ऐनक
    - 1️⃣ एक
    - 🦉 उल्लू
    answer: 🕶️ ऐनक
    difficulty: 3
    hints:
    - हर शब्द धीरे बोलो।
    - ए से थोड़ी अलग, खुली आवाज़ सुनो।
    solution: 'चरण 1: ऐनक बोलो। चरण 2: पहली आवाज़ ऐ।'
    mistakes:
      1️⃣ एक: lkh2_first
      🦉 उल्लू: lkh2_first
  - prompt: 'लंबी आवाज़ वाला अक्षर कौन-सा है: उ या ऊ?'
    options:
    - ऊ
    - उ
    - दोनों छोटे
    answer: ऊ
    difficulty: 3
    hints:
    - दोनों को बोलकर देखो।
    - किसे बोलते समय होंठ देर तक गोल रहते हैं?
    solution: 'चरण 1: उ छोटी, ऊ लंबी। चरण 2: ऊ।'
    mistakes:
      उ: lkh2_look
      दोनों छोटे: lkh2_look
  - prompt: 'स्थिति (केस): सर्दी आ गई है। दादी गरम स्वेटर बुन रही हैं। स्वेटर किससे बुनते हैं, जिसका नाम ''ऊ'' से शुरू होता है?'
    options:
    - ऊन
    - रस्सी
    - कागज़
    answer: ऊन
    hints:
    - हर शब्द धीरे से बोलो।
    - किसकी पहली आवाज़ लंबी 'ऊ' है?
    solution: स्वेटर ऊन से बुनते हैं, और 'ऊन' की पहली आवाज़ 'ऊ' है।
    mistakes:
      रस्सी: lkh2_first
      कागज़: lkh2_first
    exam: case
    difficulty: 2
  - prompt: 'परिस्थिति: सुबह माँ प्यार से कहती हैं, ''उठो, बेटा!'' ''उठो'' शब्द किस अक्षर से शुरू होता है?'
    options:
    - उ
    - ऊ
    - ओ
    answer: उ
    hints:
    - '''उठो'' धीरे से बोलो।'
    - पहली आवाज़ छोटी है या लंबी?
    solution: '''उठो'' की पहली आवाज़ छोटी ''उ'' है।'
    mistakes:
      ऊ: lkh2_first
      ओ: lkh2_first
    exam: competency
    difficulty: 2
