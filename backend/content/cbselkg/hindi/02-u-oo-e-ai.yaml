# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 2. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 2
title: उ, ऊ, ए, ऐ
concepts:
- code: lkgh.svar2
  title: उ, ऊ, ए, ऐ
  notes: |
    हिंदी अक्षर उ, ऊ, ए, ऐ: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'और स्वर: उ, ऊ, ए, ऐ। उ से उल्लू 🦉, ऊ से ऊन 🧶, ए से एड़ी 🦶, ऐ से ऐनक 🕶️, ऊ से ऊँट 🐫, उ से उँगली ☝️।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - उ
      - ऊ
      - ए
    - title: शब्द
      points:
      - उल्लू 🦉
      - ऊन 🧶
      - एड़ी 🦶
    alt: उ से उल्लू 🦉, ऊ से ऊन 🧶, ए से एड़ी 🦶।
  items:
  - prompt: '''उ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🦉 उल्लू
    - 🧶 ऊन
    - 🕶️ ऐनक
    answer: 🦉 उल्लू
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'उ' होनी चाहिए।
    solution: उल्लू 'उ' से शुरू होता है।
    mistakes:
      🧶 ऊन: lkgh_sound
  - prompt: '''ऊ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🧶 ऊन
    - 🦉 उल्लू
    - 🕶️ ऐनक
    answer: 🧶 ऊन
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ऊ' होनी चाहिए।
    solution: ऊन 'ऊ' से शुरू होता है।
    mistakes:
      🦉 उल्लू: lkgh_sound
  - prompt: '''ए'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🦶 एड़ी
    - 🧶 ऊन
    - 🦉 उल्लू
    answer: 🦶 एड़ी
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ए' होनी चाहिए।
    solution: एड़ी 'ए' से शुरू होता है।
    mistakes:
      🧶 ऊन: lkgh_sound
  - prompt: '''ऐ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🕶️ ऐनक
    - 🦶 एड़ी
    - 🧶 ऊन
    answer: 🕶️ ऐनक
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ऐ' होनी चाहिए।
    solution: ऐनक 'ऐ' से शुरू होता है।
    mistakes:
      🦶 एड़ी: lkgh_sound
  - prompt: '''ऊ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🐫 ऊँट
    - 🦉 उल्लू
    - 🕶️ ऐनक
    answer: 🐫 ऊँट
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ऊ' होनी चाहिए।
    solution: ऊँट 'ऊ' से शुरू होता है।
    mistakes:
      🦉 उल्लू: lkgh_sound
  - prompt: '''उ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - ☝️ उँगली
    - 🐫 ऊँट
    - 🧶 ऊन
    answer: ☝️ उँगली
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'उ' होनी चाहिए।
    solution: उँगली 'उ' से शुरू होता है।
    mistakes:
      🐫 ऊँट: lkgh_sound
