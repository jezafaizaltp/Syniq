    answer: 🐦 चिड़िया
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'च' होनी चाहिए।
    solution: चिड़िया 'च' से शुरू होता है।
    mistakes:
      ☂️ छाता: lkgh_sound
  - prompt: '''ज'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 👟 जूता
    - 🐦 चिड़िया
    - ☂️ छाता
    answer: 👟 जूता
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ज' होनी चाहिए।
    solution: जूता 'ज' से शुरू होता है।
    mistakes:
      🐦 चिड़िया: lkgh_sound
  - prompt: किस शब्द की पहली आवाज़ 'च' है?
    options:
    - 🐭 चूहा
    - 👟 जूता
