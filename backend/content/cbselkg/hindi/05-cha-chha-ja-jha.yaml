# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 5
title: च, छ, ज, झ
tips:
  lkh5_first: शब्द धीरे-धीरे बोलो और सिर्फ़ सबसे पहली आवाज़ सुनो।
  lkh5_look: 'अक्षरों को ध्यान से देखो: कहाँ रेखा है, कहाँ गोला? उँगली से हवा में बनाओ।'
concepts:
- code: lkgh.cha
  title: च, छ, ज, झ
  notes: |
    हिंदी अक्षर च, छ, ज, झ: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: च, छ, ज, झ। च से चम्मच 🥄, छ से छाता ☂️, ज से जहाज़ 🚢, झ से झंडा 🚩, च से चिड़िया 🐦, ज से जूता 👟।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - च
      - छ
      - ज
    - title: शब्द
      points:
      - चम्मच 🥄
      - छाता ☂️
      - जहाज़ 🚢
    alt: च से चम्मच 🥄, छ से छाता ☂️, ज से जहाज़ 🚢।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - च
    - छ
    - ज
    - झ
    items:
    - label: 🥄 चम्मच
      bin: च
      clue: 'च-म्मच: पहली आवाज़?'
      why: चम्मच च से।
    - label: ☂️ छाता
      bin: छ
      clue: 'छा-ता: हवा वाली आवाज़?'
      why: छाता छ से।
    - label: ✈️ जहाज़
      bin: ज
      clue: 'ज-हाज़: पहली आवाज़?'
      why: जहाज़ ज से।
    - label: 🏳️ झंडा
      bin: झ
      clue: 'झं-डा: भारी आवाज़?'
      why: झंडा झ से।
    - label: 🐭 चूहा
      bin: च
      clue: 'चू-हा: पहली आवाज़?'
      why: चूहा च से।
  lesson:
    - teach: 'आज के अक्षर: च, छ। हर अक्षर की अपनी आवाज़ है: च से 🌙 चाँद; छ से ☂️ छाता।'
      check:
        prompt: '''च'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🌙 चाँद
        - 🚢 जहाज़
        - ☂️ छाता
        answer: 🌙 चाँद
        why: 'चाँद बोलो: सबसे पहले ''च'' की आवाज़ आती है।'
    - teach: 'और अक्षर: ज, झ। ज से 🚢 जहाज़; झ से 🚩 झंडा।'
      check:
        prompt: '''झ'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🚩 झंडा
        - 🐭 चूहा
        - 👟 जूता
        answer: 🚩 झंडा
        why: 'झंडा बोलो: सबसे पहले ''झ'' की आवाज़ आती है।'
    - teach: च, छ, ज, झ बोलते समय जीभ तालू (मुँह की छत) को छूती है। छ और झ में च और ज से ज़्यादा हवा निकलती है।
      check:
        prompt: '''ज'' और ''झ'' में किसमें ज़्यादा हवा निकलती है?'
        options:
        - झ
        - ज
        - दोनों में बराबर
        answer: झ
        why: 'झ बोलो: हाथ पर ज़्यादा हवा लगती है।'
  items:
  - prompt: '''च'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🥄 चम्मच
    - ☂️ छाता
    - 🚩 झंडा
    answer: 🥄 चम्मच
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'च' होनी चाहिए।
    solution: चम्मच 'च' से शुरू होता है।
    mistakes:
      ☂️ छाता: lkgh_sound
  - prompt: '''छ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - ☂️ छाता
    - 🥄 चम्मच
    - 🚢 जहाज़
    answer: ☂️ छाता
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'छ' होनी चाहिए।
    solution: छाता 'छ' से शुरू होता है।
    mistakes:
      🥄 चम्मच: lkgh_sound
  - prompt: '''ज'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🚢 जहाज़
    - 🚩 झंडा
    - ☂️ छाता
    answer: 🚢 जहाज़
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ज' होनी चाहिए।
    solution: जहाज़ 'ज' से शुरू होता है।
    mistakes:
      🚩 झंडा: lkgh_sound
  - prompt: '''झ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🚩 झंडा
    - 🚢 जहाज़
    - 🥄 चम्मच
