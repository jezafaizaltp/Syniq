# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 5. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 5
title: च, छ, ज, झ
concepts:
- code: lkgh.cha
  title: च, छ, ज, झ
  notes: |
    हिंदी अक्षर च, छ, ज, झ: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'व्यंजन: च, छ, ज, झ। च से चम्मच 🥄, छ से छाता ☂️, ज से जहाज़ 🚢, झ से झंडा 🚩, च से चिड़िया 🐦, ज से जूता 👟।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - च
      - छ
      - ज
    - title: शब्द
      points:
      - चम्मच 🥄
      - छाता ☂️
      - जहाज़ 🚢
    alt: च से चम्मच 🥄, छ से छाता ☂️, ज से जहाज़ 🚢।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - च
    - छ
    - ज
    - झ
    items:
    - label: 🥄 चम्मच
      bin: च
      clue: 'च-म्मच: पहली आवाज़?'
      why: चम्मच च से।
    - label: ☂️ छाता
      bin: छ
      clue: 'छा-ता: हवा वाली आवाज़?'
      why: छाता छ से।
    - label: ✈️ जहाज़
      bin: ज
      clue: 'ज-हाज़: पहली आवाज़?'
      why: जहाज़ ज से।
    - label: 🏳️ झंडा
      bin: झ
      clue: 'झं-डा: भारी आवाज़?'
      why: झंडा झ से।
    - label: 🐭 चूहा
      bin: च
      clue: 'चू-हा: पहली आवाज़?'
      why: चूहा च से।
  items:
  - prompt: '''च'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🥄 चम्मच
    - ☂️ छाता
    - 🚩 झंडा
    answer: 🥄 चम्मच
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'च' होनी चाहिए।
    solution: चम्मच 'च' से शुरू होता है।
    mistakes:
      ☂️ छाता: lkgh_sound
  - prompt: '''छ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - ☂️ छाता
    - 🥄 चम्मच
    - 🚢 जहाज़
    answer: ☂️ छाता
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'छ' होनी चाहिए।
    solution: छाता 'छ' से शुरू होता है।
    mistakes:
      🥄 चम्मच: lkgh_sound
  - prompt: '''ज'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🚢 जहाज़
    - 🚩 झंडा
    - ☂️ छाता
    answer: 🚢 जहाज़
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ज' होनी चाहिए।
    solution: जहाज़ 'ज' से शुरू होता है।
    mistakes:
      🚩 झंडा: lkgh_sound
  - prompt: '''झ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🚩 झंडा
    - 🚢 जहाज़
    - 🥄 चम्मच
    answer: 🚩 झंडा
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'झ' होनी चाहिए।
    solution: झंडा 'झ' से शुरू होता है।
    mistakes:
      🚢 जहाज़: lkgh_sound
  - prompt: '''च'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🐦 चिड़िया
    - ☂️ छाता
    - 🚩 झंडा
    answer: 🐦 चिड़िया
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'च' होनी चाहिए।
    solution: चिड़िया 'च' से शुरू होता है।
    mistakes:
      ☂️ छाता: lkgh_sound
  - prompt: '''ज'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 👟 जूता
    - 🐦 चिड़िया
    - ☂️ छाता
    answer: 👟 जूता
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ज' होनी चाहिए।
    solution: जूता 'ज' से शुरू होता है।
    mistakes:
      🐦 चिड़िया: lkgh_sound
