# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 4
title: क, ख, ग, घ
tips:
  lkh4_first: शब्द धीरे-धीरे बोलो और सिर्फ़ सबसे पहली आवाज़ सुनो।
  lkh4_look: 'अक्षरों को ध्यान से देखो: कहाँ रेखा है, कहाँ गोला? उँगली से हवा में बनाओ।'
concepts:
- code: lkgh.ka
  title: क, ख, ग, घ
  notes: |
    हिंदी अक्षर क, ख, ग, घ: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'अब व्यंजन: क, ख, ग, घ। क से कबूतर 🕊️, ख से खरगोश 🐰, ग से गाय 🐄, घ से घर 🏠, क से केला 🍌, घ से घड़ी ⏰।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - क
      - ख
      - ग
    - title: शब्द
      points:
      - कबूतर 🕊️
      - खरगोश 🐰
      - गाय 🐄
    alt: क से कबूतर 🕊️, ख से खरगोश 🐰, ग से गाय 🐄।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - क
    - ख
    - ग
    - घ
    items:
    - label: 🕊️ कबूतर
      bin: क
      clue: 'क-बूतर: पहली आवाज़?'
      why: कबूतर क से।
    - label: 🐰 खरगोश
      bin: ख
      clue: 'ख-रगोश: हवा के साथ आवाज़?'
      why: खरगोश ख से।
    - label: 🌹 गुलाब
      bin: ग
      clue: 'गु-लाब: पहली आवाज़?'
      why: गुलाब ग से।
    - label: 🏠 घर
      bin: घ
      clue: 'घ-र: भारी आवाज़?'
      why: घर घ से।
    - label: 🐄 गाय
      bin: ग
      clue: 'गा-य: पहली आवाज़?'
      why: गाय ग से।
    - label: ⏰ घड़ी
      bin: घ
      clue: 'घ-ड़ी: पहली आवाज़?'
      why: घड़ी घ से।
  lesson:
    - teach: 'आज के अक्षर: क, ख। हर अक्षर की अपनी आवाज़ है: क से 🍌 केला; ख से 🐰 खरगोश।'
      check:
        prompt: '''क'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🍌 केला
        - 🌹 गुलाब
        - 🐰 खरगोश
        answer: 🍌 केला
        why: 'केला बोलो: सबसे पहले ''क'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: क और ख से शुरू होने वाले कुछ और शब्द। हर शब्द बोलो और पहली आवाज़ सुनो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - क
            - ख
          - title: शब्द
            points:
            - 🪷 कमल
            - 🍛 खाना
          - title: एक और शब्द
            points:
            - ☕ कप
            - 🌾 खेत
          alt: क से कमल और कप। ख से खाना और खेत।
      - style: step_by_step
        teach: 'पहली आवाज़ सुनो। पहला: ''कमल'' शब्द धीरे-धीरे बोलो। दूसरा: सबसे पहली आवाज़ पर रुक जाओ। तीसरा: उस आवाज़ को अकेले बोलो। चौथा: यह आवाज़ ''क'' अक्षर की है।'
    - teach: 'और अक्षर: ग, घ। ग से 🌹 गुलाब; घ से ⏰ घड़ी।'
      check:
        prompt: '''घ'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - ⏰ घड़ी
        - 🦀 केकड़ा
        - 🎈 गुब्बारा
        answer: ⏰ घड़ी
        why: 'घड़ी बोलो: सबसे पहले ''घ'' की आवाज़ आती है।'
      ways:
      - style: visual
        teach: ग और घ से शुरू होने वाले कुछ और शब्द। हर चित्र देखो और उसकी पहली आवाज़ बोलो।
        picture:
          kind: compare
          columns:
          - title: अक्षर
            points:
            - ग
            - घ
          - title: शब्द
            points:
            - 🪴 गमला
            - 🔔 घंटी
          - title: एक और शब्द
            points:
            - ⚽ गेंद
            - 🌿 घास
          alt: ग से गमला और गेंद। घ से घंटी और घास।
      - style: real_world
        teach: घर या स्कूल में ऐसी चीज़ें ढूँढो जिनके नाम ग और घ से शुरू होते हैं, और हर नाम ज़ोर से बोलकर किसी बड़े को सुनाओ।
    - teach: क, ख, ग, घ की आवाज़ गले के पीछे से आती है। ख और घ में क और ग से ज़्यादा हवा निकलती है। हाथ मुँह के आगे रखकर बोलो।
      check:
        prompt: '''क'' और ''ख'' में किसमें ज़्यादा हवा निकलती है?'
        options:
        - ख
        - क
        - दोनों में बराबर
        answer: ख
        why: 'ख बोलो: हाथ पर ज़्यादा हवा लगती है।'
      ways:
      - style: visual
        teach: क, ख, ग, घ बोलते समय मुँह में क्या होता है, एक के बाद एक।
        picture:
          kind: flow
          steps:
          - मुँह खोलो
          - जीभ का पिछला भाग उठाओ
          - गले के पास से आवाज़ निकालो
          alt: मुँह खोलो, जीभ का पिछला भाग उठाओ, और गले के पास से आवाज़ निकालो।
      - style: step_by_step
        teach: 'हवा महसूस करो। पहला: हथेली मुँह के ठीक आगे रखो। दूसरा: ''क'' बोलो। तीसरा: अब ''ख'' बोलो। चौथा: सोचो, किस अक्षर पर हथेली पर ज़्यादा हवा लगी।'
