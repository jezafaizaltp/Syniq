# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 4. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 4
title: क, ख, ग, घ
concepts:
- code: lkgh.ka
  title: क, ख, ग, घ
  notes: |
    हिंदी अक्षर क, ख, ग, घ: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'अब व्यंजन: क, ख, ग, घ। क से कबूतर 🕊️, ख से खरगोश 🐰, ग से गाय 🐄, घ से घर 🏠, क से केला 🍌, घ से घड़ी ⏰।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - क
      - ख
      - ग
    - title: शब्द
      points:
      - कबूतर 🕊️
      - खरगोश 🐰
      - गाय 🐄
    alt: क से कबूतर 🕊️, ख से खरगोश 🐰, ग से गाय 🐄।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - क
    - ख
    - ग
    - घ
    items:
    - label: 🕊️ कबूतर
      bin: क
      clue: 'क-बूतर: पहली आवाज़?'
      why: कबूतर क से।
    - label: 🐰 खरगोश
      bin: ख
      clue: 'ख-रगोश: हवा के साथ आवाज़?'
      why: खरगोश ख से।
    - label: 🌹 गुलाब
      bin: ग
      clue: 'गु-लाब: पहली आवाज़?'
      why: गुलाब ग से।
    - label: 🏠 घर
      bin: घ
      clue: 'घ-र: भारी आवाज़?'
      why: घर घ से।
    - label: 🐄 गाय
      bin: ग
      clue: 'गा-य: पहली आवाज़?'
      why: गाय ग से।
    - label: ⏰ घड़ी
      bin: घ
      clue: 'घ-ड़ी: पहली आवाज़?'
      why: घड़ी घ से।
  items:
  - prompt: '''क'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🕊️ कबूतर
    - 🐰 खरगोश
    - 🏠 घर
    answer: 🕊️ कबूतर
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'क' होनी चाहिए।
    solution: कबूतर 'क' से शुरू होता है।
    mistakes:
      🐰 खरगोश: lkgh_sound
  - prompt: '''ख'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🐰 खरगोश
    - 🕊️ कबूतर
    - 🐄 गाय
    answer: 🐰 खरगोश
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ख' होनी चाहिए।
    solution: खरगोश 'ख' से शुरू होता है।
    mistakes:
