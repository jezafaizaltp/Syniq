    - पहली आवाज़ 'क' होनी चाहिए।
    solution: केला 'क' से शुरू होता है।
    mistakes:
      🏠 घर: lkgh_sound
  - prompt: '''घ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
