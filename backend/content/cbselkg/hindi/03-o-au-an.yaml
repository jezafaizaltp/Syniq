# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 3
title: ओ, औ, अं
concepts:
- code: lkgh.svar3
  title: ओ, औ, अं
  notes: |
    हिंदी अक्षर ओ, औ, अं: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'बाकी स्वर: ओ, औ, अं। ओ से ओखली 🪨, औ से औरत 👩, अं से अंगूर 🍇, ओ से ओस 💧, अं से अंडा 🥚, औ से औज़ार 🔧।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - ओ
      - औ
      - अं
    - title: शब्द
      points:
      - ओखली 🪨
      - औरत 👩
      - अंगूर 🍇
    alt: ओ से ओखली 🪨, औ से औरत 👩, अं से अंगूर 🍇।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - ओ
    - औ
    - अं
    items:
    - label: 🌧️ ओला
      bin: ओ
      clue: 'ओ-ला: पहली आवाज़?'
      why: ओला ओ से।
    - label: 🧰 औज़ार
      bin: औ
      clue: 'औ-ज़ार: पहली आवाज़?'
      why: औज़ार औ से।
    - label: 🍇 अंगूर
      bin: अं
      clue: 'अं-गूर: नाक से आवाज़?'
      why: अंगूर अं से।
    - label: 🥚 अंडा
      bin: अं
      clue: 'अं-डा: पहली आवाज़?'
      why: अंडा अं से।
    - label: 💊 औषधि
      bin: औ
      clue: 'औ-षधि: पहली आवाज़?'
      why: औषधि औ से।
  items:
  - prompt: '''ओ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🪨 ओखली
    - 👩 औरत
