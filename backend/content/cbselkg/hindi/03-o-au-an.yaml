# CBSE LKG Hindi (sounds and first letters) (play-based; no NCERT textbook for KG), chapter 3. Format: content/README.md.
# Written by Claude from NCERT's foundational-stage guidance for ages 3 to 6 (NCF-FS 2022, Aadharshila 2024); topics chosen by Claude.
subject: cbselkg-hin
chapter: 3
title: ओ, औ, अं
tips:
  lkh3_first: शब्द धीरे-धीरे बोलो और सिर्फ़ सबसे पहली आवाज़ सुनो।
  lkh3_look: 'अक्षरों को ध्यान से देखो: कहाँ रेखा है, कहाँ गोला? उँगली से हवा में बनाओ।'
concepts:
- code: lkgh.svar3
  title: ओ, औ, अं
  notes: |
    हिंदी अक्षर ओ, औ, अं: अक्षर पहचानना, उसकी आवाज़ और उससे शुरू होने वाला शब्द।
  explanations:
    text: 'बाकी स्वर: ओ, औ, अं। ओ से ओखली 🪨, औ से औरत 👩, अं से अंगूर 🍇, ओ से ओस 💧, अं से अंडा 🥚, औ से औज़ार 🔧।'
    visual: हर अक्षर बड़ा लिखो और उसके पास उससे शुरू होने वाली चीज़ का चित्र बनाओ।
    step_by_step: 1. अक्षर देखो। 2. उसकी आवाज़ बोलो। 3. वह चित्र ढूँढो जिसका नाम उसी आवाज़ से शुरू हो।
    real_world: घर में चीज़ों के नाम बोलो और पहली आवाज़ पहचानो।
  picture:
    kind: compare
    columns:
    - title: अक्षर
      points:
      - ओ
      - औ
      - अं
    - title: शब्द
      points:
      - ओखली 🪨
      - औरत 👩
      - अंगूर 🍇
    alt: ओ से ओखली 🪨, औ से औरत 👩, अं से अंगूर 🍇।
  activity:
    type: sort
    prompt: शब्द किस अक्षर से शुरू होता है?
    bins:
    - ओ
    - औ
    - अं
    items:
    - label: 🌧️ ओला
      bin: ओ
      clue: 'ओ-ला: पहली आवाज़?'
      why: ओला ओ से।
    - label: 🧰 औज़ार
      bin: औ
      clue: 'औ-ज़ार: पहली आवाज़?'
      why: औज़ार औ से।
    - label: 🍇 अंगूर
      bin: अं
      clue: 'अं-गूर: नाक से आवाज़?'
      why: अंगूर अं से।
    - label: 🥚 अंडा
      bin: अं
      clue: 'अं-डा: पहली आवाज़?'
      why: अंडा अं से।
    - label: 💊 औषधि
      bin: औ
      clue: 'औ-षधि: पहली आवाज़?'
      why: औषधि औ से।
  lesson:
    - teach: 'आज के अक्षर: ओ, औ। हर अक्षर की अपनी आवाज़ है: ओ से 💧 ओस; औ से 🔧 औज़ार।'
      check:
        prompt: '''ओ'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 💧 ओस
        - 🥚 अंडा
        - 🔧 औज़ार
        answer: 💧 ओस
        why: 'ओस बोलो: सबसे पहले ''ओ'' की आवाज़ आती है।'
    - teach: 'और अक्षर: अं। अं से 🥚 अंडा।'
      check:
        prompt: '''अं'' की आवाज़ किस शब्द में सबसे पहले आती है?'
        options:
        - 🥚 अंडा
        - 🪨 ओखली
        - 💊 औषधि
        answer: 🥚 अंडा
        why: 'अंडा बोलो: सबसे पहले ''अं'' की आवाज़ आती है।'
    - teach: 'ओ और औ में आ जैसी पाई है: ओ के ऊपर एक मात्रा, औ के ऊपर दो। अं में अ के ऊपर एक बिंदु है, जो आवाज़ को नाक से बोलता है।'
      check:
        prompt: किस अक्षर में अ के ऊपर बिंदु है?
        options:
        - अं
        - ओ
        - औ
        answer: अं
        why: अ + ऊपर बिंदु = अं।
  items:
  - prompt: '''ओ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🪨 ओखली
    - 👩 औरत
    - 🍇 अंगूर
    answer: 🪨 ओखली
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ओ' होनी चाहिए।
    solution: ओखली 'ओ' से शुरू होता है।
    mistakes:
      👩 औरत: lkgh_sound
  - prompt: '''औ'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 👩 औरत
    - 🪨 ओखली
    - 🍇 अंगूर
    answer: 👩 औरत
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'औ' होनी चाहिए।
    solution: औरत 'औ' से शुरू होता है।
    mistakes:
      🪨 ओखली: lkgh_sound
  - prompt: '''अं'' से कौन-सा शब्द शुरू होता है?'
    options:
    - 🍇 अंगूर
    - 👩 औरत
    - 🪨 ओखली
    answer: 🍇 अंगूर
    difficulty: 1
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'अं' होनी चाहिए।
    solution: अंगूर 'अं' से शुरू होता है।
    mistakes:
      👩 औरत: lkgh_sound
  - prompt: '''ओ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 💧 ओस
    - 👩 औरत
    - 🍇 अंगूर
    answer: 💧 ओस
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'ओ' होनी चाहिए।
    solution: ओस 'ओ' से शुरू होता है।
    mistakes:
      👩 औरत: lkgh_sound
  - prompt: '''अं'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🥚 अंडा
    - 💧 ओस
    - 👩 औरत
    answer: 🥚 अंडा
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'अं' होनी चाहिए।
    solution: अंडा 'अं' से शुरू होता है।
    mistakes:
      💧 ओस: lkgh_sound
  - prompt: '''औ'' से शुरू होने वाला एक और शब्द चुनो।'
    options:
    - 🔧 औज़ार
    - 🥚 अंडा
    - 💧 ओस
    answer: 🔧 औज़ार
    difficulty: 2
    hints:
    - हर शब्द बोलकर देखो।
    - पहली आवाज़ 'औ' होनी चाहिए।
    solution: औज़ार 'औ' से शुरू होता है।
    mistakes:
      🥚 अंडा: lkgh_sound
  - prompt: किस शब्द की पहली आवाज़ 'ओ' है?
    options:
    - 🪨 ओखली
    - 🍇 अंगूर
    - 🔧 औज़ार
    answer: 🪨 ओखली
    difficulty: 1
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: ओखली बोलो। चरण 2: पहली आवाज़ ''ओ'' है।'
    mistakes:
      🍇 अंगूर: lkh3_first
      🔧 औज़ार: lkh3_first
  - prompt: किस शब्द की पहली आवाज़ 'औ' है?
    options:
    - 💊 औषधि
    - 🍇 अंगूर
    - 💧 ओस
    answer: 💊 औषधि
    difficulty: 1
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: औषधि बोलो। चरण 2: पहली आवाज़ ''औ'' है।'
    mistakes:
      🍇 अंगूर: lkh3_first
      💧 ओस: lkh3_first
  - prompt: किस शब्द की पहली आवाज़ 'अं' है?
    options:
    - 🍇 अंगूर
    - 🪨 ओखली
    - 🔧 औज़ार
    answer: 🍇 अंगूर
    difficulty: 2
    hints:
    - हर शब्द धीरे बोलो।
    - पहली आवाज़ पर रुक जाओ और सुनो।
    solution: 'चरण 1: अंगूर बोलो। चरण 2: पहली आवाज़ ''अं'' है।'
    mistakes:
      🪨 ओखली: lkh3_first
      🔧 औज़ार: lkh3_first
  - prompt: '''💧 ओस'' किस अक्षर से शुरू होता है?'
    options:
    - ओ
    - औ
    - अं
    answer: ओ
    difficulty: 2
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: ओस की पहली आवाज़। चरण 2: ''ओ''।'
    mistakes:
      औ: lkh3_look
      अं: lkh3_look
  - prompt: '''🔧 औज़ार'' किस अक्षर से शुरू होता है?'
    options:
    - औ
    - अं
    - ओ
    answer: औ
    difficulty: 2
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: औज़ार की पहली आवाज़। चरण 2: ''औ''।'
    mistakes:
      अं: lkh3_look
      ओ: lkh3_look
  - prompt: '''🥚 अंडा'' किस अक्षर से शुरू होता है?'
    options:
    - अं
    - औ
    - ओ
    answer: अं
    difficulty: 3
    hints:
    - शब्द धीरे बोलो और पहली आवाज़ सुनो।
    - अब वह आवाज़ वाला अक्षर ढूँढो।
    solution: 'चरण 1: अंडा की पहली आवाज़। चरण 2: ''अं''।'
    mistakes:
      औ: lkh3_look
      ओ: lkh3_look
  - prompt: '''ओ'' और ''औ'' में क्या फ़र्क़ दिखता है?'
    options:
    - औ के ऊपर दो मात्राएँ हैं
    - ओ में बिंदु है
    - कोई फ़र्क़ नहीं
    answer: औ के ऊपर दो मात्राएँ हैं
    difficulty: 3
    hints:
    - दोनों अक्षरों का ऊपरी हिस्सा देखो।
    - ऊपर की टेढ़ी लकीरें गिनो।
    solution: 'चरण 1: ओ में एक, औ में दो। चरण 2: औ में दो मात्राएँ।'
    mistakes:
      ओ में बिंदु है: lkh3_look
      कोई फ़र्क़ नहीं: lkh3_look
  - prompt: अं बोलते समय आवाज़ कहाँ से भी निकलती है?
    options:
    - नाक से
    - कान से
    - आँख से
    answer: नाक से
    difficulty: 3
    hints:
    - अं... बोलकर नाक दबाओ।
    - बिंदु वाली आवाज़।
    solution: 'चरण 1: बिंदु नाक की आवाज़ लाता है। चरण 2: नाक से।'
    mistakes:
      कान से: lkh3_look
      आँख से: lkh3_look
  - prompt: '''💧 ओस'' कब दिखती है?'
    options:
    - सुबह घास पर
    - दोपहर में आग पर
    - रात को आसमान में
    answer: सुबह घास पर
    difficulty: 2
    hints:
    - छोटी-छोटी पानी की बूँदें।
    - ठंडी सुबह, हरी घास।
    solution: 'चरण 1: रात की ठंड से बूँदें बनती हैं। चरण 2: सुबह घास पर।'
    mistakes:
      दोपहर में आग पर: lkh3_first
      रात को आसमान में: lkh3_first
