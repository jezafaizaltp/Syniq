        ways:
        - style: real_world
          teach: 'A river is like a journey: it begins at its source, travels through its upper, middle and lower courses, and ends at its mouth, where it meets the sea. The North Indian Plain runs about 3200 km, from the mouth of the Indus to the mouth of the Ganga.'
        - style: visual
