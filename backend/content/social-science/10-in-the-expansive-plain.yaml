        mistakes: {"Over the Sundarbans": plain_climate}
      - prompt: "Why is winter so cold in the North Indian Plain?"
        options: ["It is far from the sea, and cold waves come from Himalayan snow and West Asia", "It is near the equator", "Warm ocean currents pass by", "It rains every day"]
        answer: "It is far from the sea, and cold waves come from Himalayan snow and West Asia"
        difficulty: 3
        hints: ["Think of the moderating influence of the sea."]
        solution: "Continental location plus cold winds and waves."
        mistakes: {"It is near the equator": plain_climate}
      - prompt: "Why are winters in Delhi much colder than in Chennai?"
        options: ["Delhi is far from the sea and further north", "Delhi is closer to the sea", "Chennai is higher above sea level", "Delhi gets more sunlight in winter"]
        answer: "Delhi is far from the sea and further north"
        difficulty: 2
        hints: ["The sea keeps coastal places mild.", "Which city also gets cold waves from Himalayan snow?"]
        solution: "Step 1: Delhi is inland, far from the moderating sea, and further from the Equator. Step 2: Cold waves from the snowy Himalayas and West Asia make it colder still."
        mistakes: {"Delhi is closer to the sea": far_from_sea, "Chennai is higher above sea level": far_from_sea, "Delhi gets more sunlight in winter": far_from_sea}
      - prompt: "Why does the western part of the plain (Punjab) get less monsoon rain than the eastern part (West Bengal)?"
        options: ["The Bay of Bengal winds lose moisture as they move west, inland", "Punjab is nearer the sea", "The west gets the monsoon first", "Mountains block all rain in Punjab"]
        answer: "The Bay of Bengal winds lose moisture as they move west, inland"
        difficulty: 3
        hints: ["Where does the monsoon over the plain come from?", "It rains as it travels."]
        solution: "Step 1: The Bay of Bengal branch enters from the east and moves west up the plain. Step 2: It drops rain along the way, so less is left for the west."
        mistakes: {"Punjab is nearer the sea": winds_dry_out, "The west gets the monsoon first": winds_dry_out, "Mountains block all rain in Punjab": winds_dry_out}
      - prompt: The plain's climate, far from the sea with extreme summers and winters, is called
        options:
        - Continental
        - Equatorial
        - Maritime
        - Polar
        answer: Continental
        difficulty: 2
        hints:
        - Places near the sea are called maritime.
        - This is the climate of the interior of a large landmass.
        solution: 'Step 1: Far from sea = big swings. Step 2: That is typical of the inside of continents. Step 3: Continental.'
        mistakes:
