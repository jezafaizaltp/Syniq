          - Lava from volcanoes
          - Sand blown from the sea
          answer: Alluvium brought by rivers
          why: Rivers carried silt, sand and gravel and laid it down.
        ways:
        - style: step_by_step
          teach: 'Step 1: the Himalayas rise. Step 2: a deep hollow forms to their south. Step 3: rivers from the mountains and the plateau carry silt, sand and gravel into it. Step 4: over millions of years this alluvium, 1000 to 2000 m deep, fills the hollow: the North Indian Plain.'
        - style: visual
