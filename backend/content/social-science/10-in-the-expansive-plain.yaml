  - code: ss9.plain.climate
    title: Climate of the North Indian Plain
    after: [ss9.plain.formation]
    notes: |
      Cold season from mid-November; December and January coldest. Reasons: far from the ocean (continental
      climate), snowfall in the nearby Himalayas brings cold waves, cold winds from West Asia bring frost
      and fog in the west, and the sun's apparent movement south. Slight rain in winter. Hot season: rising
      by March; April–June; up to 48 °C in the west by May; hot, dry Loo winds blow from Rajasthan to the
      Ganga Plain in May–June; evening dust storms in Punjab, Haryana, eastern Rajasthan and UP bring light
      rain. The heat creates low pressure that draws in the southwest monsoon in two branches. The Bay of
      Bengal branch enters through the Sundarbans and splits: one sub-branch to the Brahmaputra Plain, the
      other west along the Ganga Plain (West Bengal, Bihar, UP, Delhi); over Punjab it joins the Arabian Sea
      branch, which moves parallel to the Aravalis, and they bring rain to the Western Himalayan foothills.
      Rajasthan gets scanty rain. Southwest monsoon season June–September is the main rainy season.
      Retreating (northeast) monsoon: as the sun moves south, high pressure forms over the plain and dry
      winds blow from the north-east to the Indian Ocean; heat plus humidity makes 'October heat'.
    explanations:
      text: "Far from the sea, the plain has extremes: freezing winters, blazing summers with Loo winds, monsoon rain from June to September, then a sticky 'October heat'."
      visual: "Draw two monsoon arrows: one from the Bay of Bengal splitting east to Assam and west along the Ganga, one from the Arabian Sea sliding up beside the Aravalis. They meet over Punjab."
      step_by_step: "To explain the cold winter: Step 1: no sea nearby to soften it. Step 2: cold waves from Himalayan snow. Step 3: cold winds from West Asia. Step 4: the sun has moved south."
      real_world: "Delhi's winter fog that delays trains and flights is part of the cold season of the North Indian Plain."
    activity:
      type: sort
      prompt: Which season in the North Indian Plain?
      bins:
      - Cold season
      - Hot season
      - Southwest monsoon
      - Retreating monsoon
      items:
      - label: Frost, fog and cold waves
        bin: Cold season
        clue: December and January.
        why: Cold season.
      - label: Hot, dry Loo winds
        bin: Hot season
        clue: May–June, from Rajasthan.
        why: Hot season.
      - label: Evening dust storms in Punjab
        bin: Hot season
        clue: Before the rains come.
        why: Hot season.
      - label: Bay of Bengal branch brings rain up the Ganga
        bin: Southwest monsoon
        clue: June–September.
        why: Southwest monsoon.
      - label: '''October heat'''
        bin: Retreating monsoon
        clue: Heat plus humidity after the rains.
        why: Retreating monsoon.
      - label: Dry winds blow from the north-east
        bin: Retreating monsoon
        clue: The sun has moved south.
        why: Retreating monsoon.
    lesson:
      - teach: 'The plain has a continental climate because it is far from the sea: very cold winters and very hot summers. December and January are coldest; cold waves come from Himalayan snow and frost and fog from cold West Asian winds.'
        check:
          prompt: Why are the plain's winters so cold?
          options:
          - It is far from the sea and gets cold waves
          - It is near the equator
          - The sea warms it
          answer: It is far from the sea and gets cold waves
          why: The sea keeps coasts mild; inland places swing between extremes.
      - teach: Summer (April–June) is very hot, up to about 48 °C in the west. Hot, dry winds called Loo blow from Rajasthan to the Ganga Plain. The heat makes low air pressure over the plain, which pulls in the moist southwest monsoon winds.
        picture:
          kind: flow
          steps:
          - Strong summer heat
          - 'Hot air rises: low pressure'
          - Moist sea winds are pulled in
          - Southwest monsoon rain
          alt: How summer heat draws in the monsoon.
        check:
          prompt: What pulls the monsoon winds into the plain?
          options:
          - Low pressure from summer heat
          - Snow on the Himalayas
          - The Loo winds
          answer: Low pressure from summer heat
          why: Hot land makes low pressure, and winds blow from high to low pressure.
      - teach: The Bay of Bengal branch of the monsoon enters at the Sundarbans and moves west along the Ganga Plain, losing moisture as it goes. It meets the Arabian Sea branch over Punjab. From October the monsoon retreats; heat plus humidity then makes 'October heat'.
        picture:
          kind: bars
          unit: rain (relative)
          bars:
          - label: West Bengal
            value: 9
          - label: Bihar
            value: 7
          - label: Uttar Pradesh
            value: 5
          - label: Punjab
            value: 3
          alt: Rain becomes less from east to west along the plain.
        check:
          prompt: Along the Ganga Plain, rain becomes
          options:
          - Less as you go west
          - More as you go west
          - The same everywhere
          answer: Less as you go west
          why: The winds drop moisture as they travel inland.
    items:
      - prompt: "Which months are the coldest in the North Indian Plain?"
        options: ["December and January", "April and May", "July and August", "October and November"]
        answer: "December and January"
        difficulty: 1
        hints: ["The cold season starts in mid-November."]
        solution: "December and January."
        mistakes: {"October and November": plain_climate}
      - prompt: "The hot, dry wind that blows from Rajasthan to the Ganga Plain in May–June is"
