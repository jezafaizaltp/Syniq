            - Ganga Plain
            - Brahmaputra Plain
        - style: step_by_step
          teach: 'Step 1: start in the west on the Rajasthan Plain, with the Thar, the Luni and salt lakes like Sambhar. Step 2: move east to the Punjab-Haryana Plain and its five doabs. Step 3: cross the Yamuna onto the Ganga Plain. Step 4: end in the Assam Valley, the Brahmaputra Plain.'
