      - prompt: Evening dust storms in May bring light rain to which states?
        options:
        - Punjab, Haryana, eastern Rajasthan and UP
        - Kerala and Tamil Nadu
        - Assam and Meghalaya
        - Goa and Karnataka
        answer: Punjab, Haryana, eastern Rajasthan and UP
        difficulty: 2
        hints:
        - Dust storms happen in hot, dry places.
