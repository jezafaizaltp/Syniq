  - code: ss9.plain.vegetation_life
    title: Vegetation, soils and human life
    after: [ss9.plain.climate]
    notes: |
      Natural vegetation: plant community left undisturbed long enough to adapt to climate and soil.
      Tropical deciduous forests: dry deciduous where rain is 70–100 cm (plains of UP and Bihar; leaves shed
      6–8 weeks) and moist deciduous where rain is 100–200 cm (Shiwalik strip with Tarai and Bhabar, parts
      of Odisha and West Bengal); teak, sal, shisham, mahua, amla, sandalwood; parkland landscape. Tropical
      thorn forests in semi-arid SW Punjab, Haryana, Rajasthan, UP: babool, ber, wild date palm, khair,
      neem, khejri, palas; tussocky grass up to 2 m. Swamp forests in saline Rajasthan, freshwater marshes,
      Brahmaputra floodplains and the Sundarbans (mangroves, sundri; home of the Royal Bengal Tiger).
      Soils: mostly alluvial (sandy loam to clay; Khadar and Bhangar); red soil (iron) in the south of the
      Middle Ganga Plain; saline soil in the Sundarbans and over-irrigated areas; peat soil on the West
      Bengal coast; arid soil in Rajasthan (needs irrigation). Human life: less than a quarter of India's
      area but more than half its people; wheat, rice, jute, sugarcane; 'granary of India'; good roads and
      railways, industry and cities. Cropping seasons: Kharif (June–September: rice, cotton, jute, bajra,
      tur), Rabi (October–March: wheat, gram, mustard, barley), Zaid (April–June: vegetables, fruits,
      fodder).
    explanations:
      text: "Rain decides the forests: thorny scrub in the dry west, deciduous teak and sal in the middle, mangroves in the wet delta. Fertile alluvium makes the plain India's granary, feeding over half the country's people."
      visual: "Picture a strip map coloured west to east: brown thorn scrub, light green dry deciduous, darker green moist deciduous, deep green mangroves at the delta."
      step_by_step: "To match a crop to a season: Step 1: grown in the monsoon (June–Sept)? Kharif. Step 2: grown in winter (Oct–March)? Rabi. Step 3: short summer crop (April–June)? Zaid."
      real_world: "Much of the wheat in your chapati and the rice in ration shops across India comes from this plain."
    activity:
      type: sort
      prompt: Which cropping season?
      bins:
      - Kharif
      - Rabi
      - Zaid
      items:
      - label: Rice
        bin: Kharif
        clue: Needs the monsoon rains, June–September.
        why: Rice is a Kharif crop.
      - label: Jute
        bin: Kharif
        clue: Grown in the rainy season.
        why: Kharif.
      - label: Wheat
        bin: Rabi
        clue: Sown after the rains, October–March.
        why: Wheat is Rabi.
      - label: Mustard
        bin: Rabi
        clue: A winter crop.
        why: Rabi.
      - label: Gram
        bin: Rabi
        clue: Harvested in spring.
        why: Rabi.
      - label: Summer vegetables and fodder
        bin: Zaid
        clue: Short season, April–June.
        why: Zaid.
    lesson:
      - teach: 'Natural vegetation is plant life left alone long enough to fit the climate and soil. In the plain, the type depends on rain: thorn forests (babool, khejri) in dry Rajasthan and Punjab; dry deciduous (70–100 cm rain) in UP and Bihar; moist deciduous (100–200 cm) with teak and sal near the Tarai; mangroves in the salty Sundarbans.'
        picture:
          kind: flow
          steps:
          - Thorn forest (driest)
          - 'Dry deciduous: 70–100 cm'
          - 'Moist deciduous: 100–200 cm'
          - Mangroves (tidal, salty)
          alt: Forest types from dry to wet.
        check:
          prompt: Which forest grows in the driest part of the plain?
          options:
          - Thorn forest
          - Moist deciduous
          - Mangrove
          answer: Thorn forest
          why: Thorny plants with small leaves save water.
        ways:
        - style: visual
          teach: Rain decides the forest. Driest parts get thorn forest; 70–100 cm rain gives dry deciduous; 100–200 cm gives moist deciduous with teak and sal; the salty Sundarbans have mangroves.
          picture:
            kind: flow
            alt: 'From driest to wettest: thorn forest, dry deciduous, moist deciduous; mangroves in salty Sundarbans.'
            steps:
            - Thorn forest (driest)
            - Dry deciduous (70–100 cm)
            - Moist deciduous (100–200 cm)
            - Mangroves (salty coast)
        - style: step_by_step
          teach: 'Step 1: find the yearly rainfall. Step 2: very dry, as in Rajasthan and Punjab: thorn forest (babool, khejri). Step 3: 70–100 cm: dry deciduous. Step 4: 100–200 cm: moist deciduous with teak and sal; salty coast: mangroves.'
      - teach: 'Most soil is alluvial: Khadar (new) and Bhangar (old). There is red soil in the south of the Middle Ganga Plain, arid soil in Rajasthan, and saline soil in the Sundarbans and where too much irrigation has brought salt up.'
        check:
          prompt: How can too much irrigation spoil soil?
          options:
          - It brings salt to the surface
          - It adds iron
          - It turns soil into rock
          answer: It brings salt to the surface
          why: Water evaporates and leaves salts behind.
        ways:
        - style: step_by_step
          teach: 'Step 1: most of the plain is alluvial soil, new Khadar and old Bhangar. Step 2: in the south of the Middle Ganga Plain, there is red soil. Step 3: Rajasthan has arid soil. Step 4: the Sundarbans have salty soil, and too much irrigation can also draw salt up and spoil land.'
        - style: visual
          teach: Soils of the plain and where they are found.
          picture:
            kind: compare
            columns:
            - title: Alluvial (most)
              points:
              - 'Khadar: new'
              - 'Bhangar: old'
            - title: Others
              points:
              - 'red: south Middle Ganga Plain'
              - 'arid: Rajasthan'
              - 'saline: Sundarbans, over-irrigated land'
            alt: Most of the plain is alluvial soil, new Khadar and old Bhangar; there is red soil in the south of the Middle Ganga Plain, arid soil in Rajasthan, and saline soil in the Sundarbans and over-irrigated land.
      - teach: 'The plain is less than a quarter of India''s area but has more than half its people. It grows wheat, rice, jute and sugarcane: the granary of India. Three crop seasons: Kharif (June–Sept, rice, cotton, jute), Rabi (Oct–March, wheat, mustard, gram) and Zaid (April–June, vegetables, fruits, fodder).'
        picture:
          kind: compare
          columns:
          - title: Kharif
            points:
            - June–September
            - rice, cotton, jute
          - title: Rabi
            points:
            - October–March
            - wheat, gram, mustard
          - title: Zaid
            points:
            - April–June
            - vegetables, fruits, fodder
          alt: The three crop seasons.
        check:
          prompt: Mustard is grown in which season?
          options:
          - Rabi
          - Kharif
          - Zaid
          answer: Rabi
          why: Mustard is sown in winter, October to March.
        ways:
        - style: real_world
          teach: 'Think of a huge kitchen garden that feeds a whole joint family. The North Indian Plain is that for India: less than a quarter of the land but more than half the people, growing wheat, rice, jute and sugarcane. Kharif crops grow June–September, Rabi crops October–March, and Zaid crops April–June.'
        - style: visual
          teach: Three crop seasons on the granary of India.
          picture:
            kind: compare
            columns:
            - title: Kharif (June–Sept)
              points:
              - rice
              - cotton
              - jute
            - title: Rabi (Oct–March)
              points:
              - wheat
              - mustard
              - gram
            - title: Zaid (April–June)
              points:
              - vegetables
              - fruits
              - fodder
            alt: Kharif, June to September, grows rice, cotton and jute; Rabi, October to March, wheat, mustard and gram; Zaid, April to June, vegetables, fruits and fodder.
    items:
      - prompt: "Which crop is grown in the Rabi season?"
