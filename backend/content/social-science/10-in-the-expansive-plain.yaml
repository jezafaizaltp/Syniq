# Class 9 Social Science II, chapter 2 (stored as Social Science chapter 10). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 1 text supplied by the school.
subject: ss
chapter: 10
title: In the Expansive Plain

tips:
  renewed_soil: "Every flood leaves a fresh layer of fine silt on the fields. What does that do to the soil year after year?"
  slows_drops: "When a flooding river spills over its banks, it slows at once. Where does it drop its heaviest load?"
  far_from_sea: "The sea keeps nearby land mild. Compare how far each city is from the sea, and how far north."
  winds_dry_out: "The monsoon brings moisture from the Bay of Bengal and rains as it travels. How much is left by the time it reaches the far west?"
  salty_mud: "Mangroves grow in salty, muddy tidal water where roots get little air. What special roots help them?"
  kharif_crops: "Kharif crops are sown with the monsoon rains. Which crop needs a lot of water?"
  k9_red_soil: "Red soil's colour is like rust: which metal turns reddish when it reacts with air and water?"
  k9_oxbow: "When a river cuts straight across the neck of a tight bend, the old bend is left behind as a curved lake shaped like part of a bullock's yoke."
  k9_doab: "The word is Persian: 'do' (two) + 'ab' (water). A delta is at a river's mouth instead."
  plain_formation: "The North Indian (Indo-Gangetic-Brahmaputra) Plain formed when rivers from the Himalayas and the Peninsula deposited alluvium (silt, sand, gravel) in the deep depression south of the Himalayas. The deposits are 1000–2000 m deep."
  plain_divisions: "Go west to east across the North Indian Plain: the desert plain, the plain of the five rivers up to a river that later joins the Ganga, the Ganga plain, and finally the plain of the great river of Assam."
  doab: "'Do' means two and 'ab' means water: land between two rivers that later join. Name each doab from the first letters of its two rivers."
  river_landforms: "Rivers drop sediment where they slow down: fan shapes at the mountain foot, raised banks beside the channel, cut-off loops that become lakes, and triangle-shaped mouths named after a Greek letter."
  plain_zones: "From the mountains south: first a belt of boulders where rivers sink out of sight, then a marshy belt where they come back up, then the alluvial plain with old and new alluvium (the new one is on the flood plains)."
  plain_climate: "Cold season from mid-November (December–January coldest); hot season April–June, up to 48 °C, hot Loo winds and dust storms; southwest monsoon June–September (main rains); retreating (northeast) monsoon brings dry 'October heat'."
  plain_life: "Crop seasons: one sown with the monsoon (June) and harvested in autumn, the other sown in winter. Forests depend on rain: less rain gives drier forests and thorny trees. Iron gives soil a reddish colour, and too much irrigation leaves salt behind."
  ss10p_area_multiply: Area of a strip is length times width, not length plus width.
  ss10p_source_mouth: A river starts at one end and empties at the other. Which end is which?
  ss10p_west_to_east: 'Go from west to east across the plain: Rajasthan, then Punjab-Haryana, then Ganga, then Brahmaputra.'
  ss10p_old_new: The river keeps adding fresh silt near its channel today; higher ground away from it holds the older silt.
  ss10p_speed_drop: When a river slows down, it cannot carry its load. Where does it suddenly slow?
  ss10p_north_zones: Right at the foot of the hills the ground is stony and water sinks in; a little further south it comes back up and makes marshes.
  ss10p_heat_low: Hot land heats the air above it, and hot air rises. What does that leave near the ground, and what does it pull in?
  ss10p_season_months: "Match the months to the weather: one season is sown with the monsoon rains, one as winter begins, and one fills the short summer gap between them."
  ss10p_rain_band: 'Match the forest to the rain: thorn forest is driest, dry deciduous next, moist deciduous wetter.'
  ss10p_crowded_plain: Flat land, fertile soil and water all year make it easy to farm, travel and build. Where would most people live?

concepts:
  - code: ss9.plain.formation
    title: How the North Indian Plain formed and its divisions
    notes: |
      The Indo-Gangetic-Brahmaputra Plain (North Indian Plain) lies between the Northern Mountains and the
      Peninsular Plateau. Alluvium is debris such as silt, sand and gravel brought by rivers. Geomorphic
      agents (running water, wind, glaciers, waves) carry rock material and deposit it in low-lying areas
      (deposition). A river's origin is its source; where it discharges is its mouth; it has upper, middle
      and lower courses. When the Himalayas formed, a vast depression formed to their south; rivers from
      the Himalayas and the Peninsula filled it with alluvium 1000–2000 m deep over millions of years. The
      plain stretches about 3200 km from the mouth of the Indus to the mouth of the Ganga (about 2400 km in
      India), 150–300 km wide, about 7 lakh sq km; bordered by the Shiwaliks in the north and the Peninsular
      Plateau in the south; one of the world's largest alluvial plains. Himalayan rivers start in the
      Himalayas; peninsular rivers (e.g. Betwa) start on the plateau. Four divisions: Rajasthan Plain (west
      of the Aravalis; Thar with Marusthali and Rajasthan Bagar; non-perennial Luni; salt lakes Sambhar,
      Didwana, Sargol); Punjab-Haryana Plain (up to the Yamuna; Punjab, Haryana, Himachal; about 1.75 lakh
      sq km; slopes west; Satluj, Jhelum, Chenab, Ravi, Beas; 'Land of Five Rivers'; five doabs); Ganga Plain
      (Yamuna to Bangladesh; about 3.75 lakh sq km; average 200 m; slopes east and south-east; upper, middle
      and lower); Brahmaputra Plain (Assam Valley; about 720 km long, 60–70 km wide, about 56,275 sq km;
      bounded by the Eastern Himalaya, Patkai-Naga Hills, Garo-Khasi-Jaintia and Mikir Hills; tributaries
      Teesta, Manas, Lohit, Dibang).
    explanations:
      text: "Rivers carried soil down from the mountains for millions of years and filled a huge low area south of the Himalayas, making one of the world's biggest flat, fertile plains. It has four parts from west to east."
      visual: "Picture a long trough beside a new mountain wall. Rivers pour mud into it from both sides until it is filled flat: that is the North Indian Plain."
      step_by_step: "To name a doab: Step 1: find the two rivers on either side. Step 2: Beas–Satluj is Bist-Jalandhar, Beas–Ravi is Bari, Ravi–Chenab is Rachna, Chenab–Jhelum is Chaj, Indus–Jhelum/Chenab is Sindh-Sagar."
      real_world: "The word Punjab means 'five waters', after its five rivers."
    activity:
      type: sort
      prompt: Which part of the North Indian Plain?
      bins:
      - Rajasthan Plain
      - Punjab-Haryana Plain
      - Ganga Plain
      - Brahmaputra Plain
      items:
      - label: The seasonal Luni river
        bin: Rajasthan Plain
        clue: West of the Aravalis.
        why: Rajasthan Plain.
      - label: Sambhar salt lake
        bin: Rajasthan Plain
        clue: In the Thar region.
        why: Rajasthan Plain.
      - label: '''Land of Five Rivers'' with five doabs'
        bin: Punjab-Haryana Plain
        clue: Satluj, Beas, Ravi, Chenab, Jhelum.
        why: Punjab-Haryana Plain.
      - label: Slopes west, up to the Yamuna
        bin: Punjab-Haryana Plain
        clue: Water flows towards the Indus.
        why: Punjab-Haryana Plain.
      - label: From the Yamuna to Bangladesh, sloping east
        bin: Ganga Plain
        clue: Upper, middle and lower parts.
        why: Ganga Plain.
      - label: The Assam Valley, with the Teesta and Lohit
        bin: Brahmaputra Plain
        clue: Between the Eastern Himalaya and Garo-Khasi hills.
        why: Brahmaputra Plain.
    lesson:
      - teach: The North Indian Plain lies between the Himalayas and the Peninsular Plateau. When the Himalayas rose, a deep hollow formed south of them. Rivers from the mountains and the plateau filled it with alluvium (silt, sand, gravel) 1000 to 2000 m deep over millions of years.
        picture:
          kind: flow
          steps:
          - Himalayas rise
          - Deep hollow forms to the south
          - Rivers bring silt for millions of years
          - Flat, fertile plain
          alt: How the North Indian Plain was filled with alluvium.
        check:
          prompt: What filled the hollow south of the Himalayas?
          options:
          - Alluvium brought by rivers
          - Lava from volcanoes
          - Sand blown from the sea
          answer: Alluvium brought by rivers
          why: Rivers carried silt, sand and gravel and laid it down.
      - teach: A river starts at its source and ends at its mouth. In between are its upper, middle and lower courses. The plain stretches about 3200 km from the mouth of the Indus to the mouth of the Ganga, and is 150 to 300 km wide.
        check:
          prompt: Where a river empties into the sea is its
          options:
          - Mouth
          - Source
          - Upper course
          answer: Mouth
          why: The source is the start; the mouth is the end.
      - teach: 'The plain has four parts, west to east: the Rajasthan Plain (Thar, Luni river, salt lakes like Sambhar), the Punjab-Haryana Plain (five rivers, five doabs), the Ganga Plain (Yamuna to Bangladesh, slopes east) and the Brahmaputra Plain (Assam Valley). A doab is land between two rivers that later join.'
        picture:
          kind: flow
          steps:
          - Rajasthan Plain
          - Punjab-Haryana Plain
          - Ganga Plain
          - Brahmaputra Plain
          alt: The four divisions of the plain from west to east.
        check:
          prompt: Which plain is called the Land of Five Rivers?
          options:
          - Punjab-Haryana Plain
          - Ganga Plain
          - Rajasthan Plain
          answer: Punjab-Haryana Plain
          why: '''Punjab'' means five waters: Satluj, Beas, Ravi, Chenab, Jhelum.'
    items:
      - prompt: "Alluvium is"
        options: ["Silt, sand and gravel brought by rivers", "Lava from volcanoes", "Snow on mountains", "Salt from the sea"]
        answer: "Silt, sand and gravel brought by rivers"
        difficulty: 1
        hints: ["Rivers deposit it."]
        solution: "River-deposited debris."
        mistakes: {"Lava from volcanoes": plain_formation}
      - prompt: "A land lying between two rivers that later join is called a"
        options: ["Doab", "Delta", "Dun", "Bugyal"]
        answer: "Doab"
        difficulty: 1
        hints: ["Punjab has five."]
        solution: "A doab."
        mistakes: {"Delta": k9_doab}
      - prompt: "Which river forms the eastern boundary of the Punjab-Haryana Plain?"
        options: ["Yamuna", "Ganga", "Indus", "Luni"]
        answer: "Yamuna"
        difficulty: 1
        hints: ["The Ganga Plain starts east of it."]
        solution: "The Yamuna."
        mistakes: {"Ganga": plain_divisions}
      - prompt: "The plain extends about 3200 km, of which about 2400 km is in India. How many km lie outside India?"
        answer: "800"
        check: "3200 - 2400"
        difficulty: 2
        hints: ["Subtract."]
        solution: "3200 − 2400 = 800 km."
        mistakes: {"5600": plain_formation}
      - prompt: "The Rachna Doab lies between which rivers?"
        options: ["Ravi and Chenab", "Beas and Satluj", "Chenab and Jhelum", "Beas and Ravi"]
        answer: "Ravi and Chenab"
        difficulty: 2
        hints: ["Ra- for Ravi, -chna for Chenab."]
        solution: "Ravi and Chenab."
        mistakes: {"Beas and Satluj": doab}
      - prompt: "Why did a deep depression form south of the Himalayas?"
        options: ["It formed along with the Himalayas as the plates collided", "A meteor hit there", "The sea dried up last century", "Rivers dug it in one year"]
        answer: "It formed along with the Himalayas as the plates collided"
        difficulty: 2
        hints: ["The plain's story is linked to the mountains."]
        solution: "The collision that raised the Himalayas also made the trough that rivers later filled."
        mistakes: {"Rivers dug it in one year": plain_formation}
      - prompt: "Which is the easternmost division of the North Indian Plain?"
        options: ["Brahmaputra Plain", "Rajasthan Plain", "Punjab-Haryana Plain", "Ganga Plain"]
        answer: "Brahmaputra Plain"
        difficulty: 1
        hints: ["Also called the Assam Valley."]
        solution: "The Brahmaputra Plain."
        mistakes: {"Ganga Plain": plain_divisions}
      - prompt: "Average depth of alluvial deposits is 1000 to 2000 m. What is the midpoint of this range (m)?"
        answer: "1500"
        check: "(1000 + 2000)/2"
        difficulty: 2
        hints: ["Add and halve."]
        solution: "1500 m."
        mistakes: {"3000": plain_formation}
      - prompt: "Why is the North Indian Plain so fertile?"
        options: ["Rivers keep renewing it with fresh alluvium", "It is made of volcanic rock", "It never gets rain", "It is very high above sea level"]
        answer: "Rivers keep renewing it with fresh alluvium"
        difficulty: 2
        hints: ["How did the plain form?", "What do floods leave behind?"]
        solution: "Step 1: The plain is built of alluvium from Himalayan and peninsular rivers. Step 2: Floods keep adding fresh, fine silt, so the soil stays fertile."
        mistakes: {"It is made of volcanic rock": k9_basalt, "It never gets rain": renewed_soil, "It is very high above sea level": renewed_soil}
      - prompt: "The Bari Doab lies between which two rivers?"
        options: ["Beas and Ravi", "Ravi and Chenab", "Chenab and Jhelum", "Ganga and Yamuna"]
        answer: "Beas and Ravi"
        difficulty: 3
        hints: ["Doab names come from the first letters of the two rivers.", "B + Ari."]
        solution: "Step 1: Bari = B (Beas) + Ari (Ravi). Step 2: It lies between the Beas and the Ravi (Rachna is Ravi + Chenab)."
        mistakes: {"Ravi and Chenab": doab, "Chenab and Jhelum": doab, "Ganga and Yamuna": doab}
      - prompt: "Why is the North Indian Plain one of the most fertile regions in the world?"
        options:
        - "Rivers have filled a deep depression with layers of fine alluvium over millions of years"
        - "It is made of hard volcanic rock"
        - "It gets no rain, so soil stays dry"
        - "It is covered with glaciers"
        answer: "Rivers have filled a deep depression with layers of fine alluvium over millions of years"
        difficulty: 3
        hints: ["What did the rivers carry from the mountains?", "Where did they drop it?"]
        solution: "Step 1: When the Himalayas rose, a deep depression formed to their south. Step 2: Himalayan and Peninsular rivers deposited silt and sand in it, 1000–2000 m deep. Step 3: This alluvium is fine and fertile."
        mistakes: {"It is made of hard volcanic rock": plain_formation, "It gets no rain, so soil stays dry": plain_formation}
      - prompt: The place where a river begins is called its
        options:
        - Source
        - Mouth
        - Delta
        - Doab
        answer: Source
        difficulty: 1
        hints:
        - It is the starting point.
        - The other end is the mouth.
        solution: 'Step 1: A river has a start and an end. Step 2: The end is the mouth. Step 3: The start is the source.'
        mistakes:
          Mouth: ss10p_source_mouth
      - prompt: Sambhar and Didwana are salt lakes in which division of the plain?
        options:
        - Rajasthan Plain
        - Ganga Plain
        - Brahmaputra Plain
        - Punjab-Haryana Plain
        answer: Rajasthan Plain
        difficulty: 2
        hints:
        - Salt lakes form where it is dry and water evaporates.
        - This division is west of the Aravalis.
        solution: 'Step 1: Salt lakes need a dry climate. Step 2: The driest division is in the west. Step 3: Rajasthan Plain.'
        mistakes:
          Ganga Plain: ss10p_west_to_east
      - prompt: In which direction does the Ganga Plain slope?
        options:
        - East and south-east
        - West
        - North
        - North-west
        answer: East and south-east
        difficulty: 2
        hints:
        - Water flows downhill.
        - The Ganga flows towards the Bay of Bengal.
        solution: 'Step 1: Rivers follow the slope. Step 2: The Ganga flows to the Bay of Bengal. Step 3: The plain slopes east and south-east.'
        mistakes:
          West: ss10p_west_to_east
      - prompt: The Brahmaputra Plain is about 720 km long and 60 km wide. Roughly what area is that (sq km)?
        answer: '43200'
        check: 720*60
        difficulty: 3
        hints:
        - Area of a long strip is about length × width.
        - 720 × 60.
        solution: 'Step 1: Treat the plain as a rectangle. Step 2: 720 × 60 = 43,200. Step 3: About 43,200 sq km (the real shape gives about 56,000).'
        mistakes:
          '780': ss10p_area_multiply

  - code: ss9.plain.landforms
    title: River landforms and the zones of the plain
    after: [ss9.plain.formation]
    notes: |
      Alluvial fans: where rivers enter the plain from mountains, speed drops suddenly and sediment
      spreads in fan shapes (common in the Brahmaputra Plain). Rivers in plains split into many channels
      (braided). Meanders: sinuous curves formed when deposits deflect a slow river; continued erosion and
      deposition curve them more; when the river straightens, cut-off curves become ox-bow lakes. Flood
      plains: alluvium deposited on banks during floods; ideal for farming; river valley civilisations grew
      on them. Riverine islands (in channels), levees (ridges along banks), sandbars (linear deposits in
      beds). Deltas: near the mouth rivers branch into distributaries and deposit roughly triangular land,
      named after the Greek letter Δ. Zones north to south: Bhabar (8–10 km wide, south of the Shiwaliks,
      rocks and boulders; rivers flow under them and are not visible), Tarai (10–20 km wide, marshy, rivers
      re-emerge, rich vegetation and wildlife), alluvial plain with Bhangar (older alluvium) and Khadar
      (newer alluvium), with riverine islands, sandbars, deltas, braided streams, meanders and ox-bow lakes.
    explanations:
      text: "Slow rivers on a plain build things: fans where they leave the hills, bends that become ox-bow lakes, banks of levees, islands, and deltas at the sea. From the hills southwards, the plain changes from bouldery Bhabar to marshy Tarai to farmland of Bhangar and Khadar."
      visual: "Draw a snake-like river. Pinch off one big loop so it is a separate crescent of water: that is an ox-bow lake."
      step_by_step: "To order the zones from the Shiwaliks southwards: Step 1: Bhabar (boulders, hidden rivers). Step 2: Tarai (marshy, rivers reappear). Step 3: Bhangar (old alluvium). Step 4: Khadar (new alluvium near rivers)."
      real_world: "The Sundarbans and the Ganga–Brahmaputra delta in Bengal are the world's largest delta region."
    activity:
      type: order
      prompt: Walk south from the mountains. Put the zones in order.
      steps:
      - Shiwaliks
      - 'Bhabar: boulders, rivers vanish underground'
      - 'Tarai: marshy, rivers come up again'
      - 'Bhangar: older alluvium'
      - 'Khadar: newer alluvium near the river'
      reasons:
        'Bhabar: boulders, rivers vanish underground': Rivers drop rocks and boulders first, right at the foot of the Shiwaliks.
        'Tarai: marshy, rivers come up again': The rivers that sank under the Bhabar come back up further south.
        'Bhangar: older alluvium': Beyond the Tarai lies the wide alluvial plain; Bhangar is the older, higher part.
        'Khadar: newer alluvium near the river': Fresh silt is laid down closest to the river, after the older Bhangar.
    lesson:
      - teach: 'Where a river leaves the mountains and enters the plain, it slows suddenly and spreads its load in a fan shape: an alluvial fan. On the plain it may split into many channels (braided). Slow rivers bend into loops called meanders. A loop cut off from the river becomes an ox-bow lake.'
        picture:
          kind: flow
          steps:
          - River bends (meander)
          - Bend grows bigger
          - River cuts straight across
          - Old loop left as ox-bow lake
          alt: How an ox-bow lake forms from a meander.
        check:
          prompt: An ox-bow lake was once
          options:
          - A loop of a river
          - A glacier
          - A delta
          answer: A loop of a river
          why: It is a meander cut off from the main river.
      - teach: 'In floods, rivers spread silt on their banks: flood plains, good for farming. Silt piled beside the channel forms levees. Near the sea the river splits into distributaries and builds a triangle of land, a delta (named after the Greek letter Δ).'
        check:
          prompt: Why are flood plains good for farming?
          options:
          - Floods leave fresh fertile silt
          - They never get water
          - They are rocky
          answer: Floods leave fresh fertile silt
          why: New silt renews the soil after each flood.
      - teach: 'From the Shiwaliks southward: Bhabar (8–10 km, boulders, rivers vanish underground), Tarai (10–20 km, marshy, rivers come back up, thick forest and wildlife), then the alluvial plain with Bhangar (older alluvium, higher) and Khadar (newer alluvium, near rivers).'
        picture:
          kind: flow
          steps:
          - Shiwaliks
          - 'Bhabar: boulders'
          - 'Tarai: marshes'
          - 'Bhangar: old silt'
          - 'Khadar: new silt'
          alt: Zones of the plain from north to south.
        check:
          prompt: In which zone do rivers reappear and make marshes?
          options:
          - Tarai
          - Bhabar
          - Bhangar
          answer: Tarai
          why: Water that sank under the Bhabar boulders comes back up in the Tarai.
    items:
      - prompt: "A curved section of river cut off from the main channel forms"
        options: ["An ox-bow lake", "A doab", "A levee", "An alluvial fan"]
        answer: "An ox-bow lake"
        difficulty: 1
        hints: ["It starts as a meander."]
        solution: "An ox-bow lake."
        mistakes: {"A levee": k9_oxbow}
      - prompt: "Deltas are named after"
        options: ["The Greek letter Δ, because of their triangular shape", "A river in Greece", "A scientist named Delta", "Their colour"]
        answer: "The Greek letter Δ, because of their triangular shape"
        difficulty: 1
        hints: ["Look at the shape."]
        solution: "The Greek letter delta (Δ)."
        mistakes: {"A river in Greece": river_landforms}
      - prompt: "In which zone do rivers disappear under rocks and boulders?"
        options: ["Bhabar", "Tarai", "Khadar", "Bhangar"]
        answer: "Bhabar"
        difficulty: 1
        hints: ["It is just south of the Shiwaliks."]
        solution: "Bhabar."
        mistakes: {"Tarai": plain_zones}
      - prompt: "Newer alluvium in the plain is called"
        options: ["Khadar", "Bhangar", "Bhabar", "Karewa"]
        answer: "Khadar"
        difficulty: 2
        hints: ["Bhangar is older."]
        solution: "Khadar."
        mistakes: {"Bhangar": plain_zones}
      - prompt: "Ridges of sediment along the sides of a river are"
        options: ["Levees", "Sandbars", "Riverine islands", "Deltas"]
        answer: "Levees"
        difficulty: 2
        hints: ["They are on the banks, not in the channel."]
        solution: "Levees."
        mistakes: {"Sandbars": river_landforms}
      - prompt: "Fan-shaped deposits where rivers leave the mountains are"
        options: ["Alluvial fans", "Ox-bow lakes", "Gorges", "Margs"]
        answer: "Alluvial fans"
        difficulty: 2
        hints: ["The river slows suddenly."]
        solution: "Alluvial fans."
        mistakes: {"Gorges": river_landforms}
      - prompt: "Which zone is marshy, with rivers re-emerging and rich wildlife?"
        options: ["Tarai", "Bhabar", "Bhangar", "Marusthali"]
        answer: "Tarai"
        difficulty: 2
        hints: ["It runs parallel to the Bhabar."]
        solution: "The Tarai."
        mistakes: {"Bhabar": plain_zones}
      - prompt: "Why do rivers deposit more sediment as they near the sea?"
        options: ["Their speed drops", "They get faster", "The water turns salty first", "The sediment melts"]
        answer: "Their speed drops"
        difficulty: 3
        hints: ["Slow water cannot carry heavy loads."]
        solution: "Slower water drops its load, building deltas."
        mistakes: {"They get faster": river_landforms}
      - prompt: "Going south from the Shiwalik foothills, in which order do these zones come?"
        options: ["Bhabar, Tarai, then the alluvial plain (Bhangar and Khadar)", "Tarai, Bhabar, then the alluvial plain", "Khadar, Bhabar, Tarai", "Bhangar, Tarai, Bhabar"]
        answer: "Bhabar, Tarai, then the alluvial plain (Bhangar and Khadar)"
        difficulty: 3
        hints: ["Rivers first sink under boulders at the mountain foot.", "Where do they come back to the surface?"]
        solution: "Step 1: At the foothills is the Bhabar, where rivers disappear under pebbles. Step 2: Next the marshy Tarai, where they re-emerge. Step 3: Then the alluvial plain of older Bhangar and newer Khadar."
        mistakes: {"Tarai, Bhabar, then the alluvial plain": plain_zones, "Khadar, Bhabar, Tarai": plain_zones, "Bhangar, Tarai, Bhabar": plain_zones}
      - prompt: "Why do levees form along the banks of rivers in the plain?"
        options: ["In floods, the river slows as it spills over and drops sediment right beside the channel", "People build them with bricks", "Wind piles sand along rivers", "Glaciers leave them behind"]
        answer: "In floods, the river slows as it spills over and drops sediment right beside the channel"
        difficulty: 3
        hints: ["Rivers drop their load where they slow down.", "Where does water slow first when it spills out?"]
        solution: "Step 1: Floodwater slows sharply as soon as it leaves the channel. Step 2: The coarser sediment settles right there, building raised banks over many floods."
        mistakes: {"People build them with bricks": slows_drops, "Wind piles sand along rivers": slows_drops, "Glaciers leave them behind": slows_drops}
      - prompt: Older alluvium, on higher ground away from the rivers, is called
        options:
        - Bhangar
        - Khadar
        - Bhabar
        - Tarai
        answer: Bhangar
        difficulty: 2
        hints:
        - It is the opposite of the newer alluvium.
        - Floods no longer reach it.
        solution: 'Step 1: New alluvium near rivers is Khadar. Step 2: Older, higher alluvium is the other one. Step 3: Bhangar.'
        mistakes:
          Khadar: ss10p_old_new
      - prompt: Smaller channels into which a river splits near its mouth are called
        options:
        - Distributaries
        - Tributaries
        - Meanders
        - Levees
        answer: Distributaries
        difficulty: 2
        hints:
        - Tributaries bring water into a river.
        - These channels carry water away from the main river.
        solution: 'Step 1: Tributaries join a river. Step 2: Near the mouth the river splits and spreads its water out. Step 3: Distributaries.'
        mistakes:
          Tributaries: ss10p_source_mouth
