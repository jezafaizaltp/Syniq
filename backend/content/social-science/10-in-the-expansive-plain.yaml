        why: Kharif.
      - label: Wheat
        bin: Rabi
        clue: Sown after the rains, October–March.
        why: Wheat is Rabi.
      - label: Mustard
        bin: Rabi
        clue: A winter crop.
        why: Rabi.
      - label: Gram
        bin: Rabi
        clue: Harvested in spring.
        why: Rabi.
      - label: Summer vegetables and fodder
        bin: Zaid
        clue: Short season, April–June.
        why: Zaid.
    lesson:
      - teach: 'Natural vegetation is plant life left alone long enough to fit the climate and soil. In the plain, the type depends on rain: thorn forests (babool, khejri) in dry Rajasthan and Punjab; dry deciduous (70–100 cm rain) in UP and Bihar; moist deciduous (100–200 cm) with teak and sal near the Tarai; mangroves in the salty Sundarbans.'
        picture:
          kind: flow
          steps:
          - Thorn forest (driest)
          - 'Dry deciduous: 70–100 cm'
          - 'Moist deciduous: 100–200 cm'
          - Mangroves (tidal, salty)
          alt: Forest types from dry to wet.
        check:
          prompt: Which forest grows in the driest part of the plain?
          options:
          - Thorn forest
          - Moist deciduous
          - Mangrove
          answer: Thorn forest
          why: Thorny plants with small leaves save water.
      - teach: 'Most soil is alluvial: Khadar (new) and Bhangar (old). There is red soil in the south of the Middle Ganga Plain, arid soil in Rajasthan, and saline soil in the Sundarbans and where too much irrigation has brought salt up.'
        check:
