      - teach: 'The plain is less than a quarter of India''s area but has more than half its people. It grows wheat, rice, jute and sugarcane: the granary of India. Three crop seasons: Kharif (June–Sept, rice, cotton, jute), Rabi (Oct–March, wheat, mustard, gram) and Zaid (April–June, vegetables, fruits, fodder).'
        picture:
          kind: compare
