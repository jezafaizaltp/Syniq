  - code: ss9.plain.vegetation_life
    title: Vegetation, soils and human life
    after: [ss9.plain.climate]
    notes: |
      Natural vegetation: plant community left undisturbed long enough to adapt to climate and soil.
      Tropical deciduous forests: dry deciduous where rain is 70–100 cm (plains of UP and Bihar; leaves shed
      6–8 weeks) and moist deciduous where rain is 100–200 cm (Shiwalik strip with Tarai and Bhabar, parts
      of Odisha and West Bengal); teak, sal, shisham, mahua, amla, sandalwood; parkland landscape. Tropical
      thorn forests in semi-arid SW Punjab, Haryana, Rajasthan, UP: babool, ber, wild date palm, khair,
      neem, khejri, palas; tussocky grass up to 2 m. Swamp forests in saline Rajasthan, freshwater marshes,
      Brahmaputra floodplains and the Sundarbans (mangroves, sundri; home of the Royal Bengal Tiger).
      Soils: mostly alluvial (sandy loam to clay; Khadar and Bhangar); red soil (iron) in the south of the
      Middle Ganga Plain; saline soil in the Sundarbans and over-irrigated areas; peat soil on the West
      Bengal coast; arid soil in Rajasthan (needs irrigation). Human life: less than a quarter of India's
      area but more than half its people; wheat, rice, jute, sugarcane; 'granary of India'; good roads and
      railways, industry and cities. Cropping seasons: Kharif (June–September: rice, cotton, jute, bajra,
      tur), Rabi (October–March: wheat, gram, mustard, barley), Zaid (April–June: vegetables, fruits,
      fodder).
    explanations:
      text: "Rain decides the forests: thorny scrub in the dry west, deciduous teak and sal in the middle, mangroves in the wet delta. Fertile alluvium makes the plain India's granary, feeding over half the country's people."
      visual: "Picture a strip map coloured west to east: brown thorn scrub, light green dry deciduous, darker green moist deciduous, deep green mangroves at the delta."
      step_by_step: "To match a crop to a season: Step 1: grown in the monsoon (June–Sept)? Kharif. Step 2: grown in winter (Oct–March)? Rabi. Step 3: short summer crop (April–June)? Zaid."
      real_world: "Much of the wheat in your chapati and the rice in ration shops across India comes from this plain."
    activity:
      type: sort
      prompt: Which cropping season?
      bins:
      - Kharif
      - Rabi
      - Zaid
      items:
