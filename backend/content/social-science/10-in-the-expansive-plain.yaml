        solution: 'Step 1: Dust storms need dry ground and great heat. Step 2: That is the north-west plain in May. Step 3: Punjab, Haryana, eastern Rajasthan and UP.'
        mistakes:
          Assam and Meghalaya: plain_climate
      - prompt: During the retreating monsoon, winds blow from which direction?
        options:
        - North-east
        - South-west
        - South
        - West
        answer: North-east
        difficulty: 2
        hints:
        - They are the opposite of the summer monsoon.
