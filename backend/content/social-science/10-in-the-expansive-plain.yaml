# Class 9 Social Science II, chapter 2 (stored as Social Science chapter 10). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 1 text supplied by the school.
subject: ss
chapter: 10
title: In the Expansive Plain

tips:
  plain_formation: "The North Indian (Indo-Gangetic-Brahmaputra) Plain formed when rivers from the Himalayas and the Peninsula deposited alluvium (silt, sand, gravel) in the deep depression south of the Himalayas. The deposits are 1000–2000 m deep."
  plain_divisions: "Four regional divisions, west to east: Rajasthan Plain (Thar, Luni, salt lakes), Punjab-Haryana Plain (five doabs, up to the Yamuna), Ganga Plain (Yamuna to Bangladesh; upper, middle, lower), Brahmaputra Plain (Assam Valley, about 720 km long, 60–70 km wide)."
  doab: "A doab is land between two rivers that later join. Punjab doabs: Bist-Jalandhar (Beas–Satluj), Bari (Beas–Ravi), Rachna (Ravi–Chenab), Chaj (Chenab–Jhelum), Sindh-Sagar (Indus–Jhelum/Chenab)."
  river_landforms: "Depositional landforms: alluvial fans (where rivers leave the mountains), meanders and ox-bow lakes (cut-off curves), flood plains, levees, riverine islands, sandbars and triangular deltas at the mouth."
  plain_zones: "North to south: Bhabar (8–10 km, boulders, rivers vanish underground), Tarai (10–20 km, marshy, rivers re-emerge, rich wildlife), then the alluvial plain: Bhangar (older alluvium) and Khadar (newer alluvium)."
  plain_climate: "Cold season from mid-November (December–January coldest); hot season April–June, up to 48 °C, hot Loo winds and dust storms; southwest monsoon June–September (main rains); retreating (northeast) monsoon brings dry 'October heat'."
  plain_life: "Natural vegetation: tropical deciduous (dry 70–100 cm rain, moist 100–200 cm; teak, sal), thorn forests in the dry west, swamp forests and mangroves (Sundarbans, Royal Bengal Tiger). Soils: mostly alluvial; red, saline, peat and arid soils in parts. Cropping seasons: Kharif (June–Sept: rice, cotton, jute), Rabi (Oct–March: wheat, gram, mustard), Zaid (April–June: vegetables, fruits, fodder)."

concepts:
  - code: ss9.plain.formation
    title: How the North Indian Plain formed and its divisions
    notes: |
      The Indo-Gangetic-Brahmaputra Plain (North Indian Plain) lies between the Northern Mountains and the
      Peninsular Plateau. Alluvium is debris such as silt, sand and gravel brought by rivers. Geomorphic
      agents (running water, wind, glaciers, waves) carry rock material and deposit it in low-lying areas
      (deposition). A river's origin is its source; where it discharges is its mouth; it has upper, middle
      and lower courses. When the Himalayas formed, a vast depression formed to their south; rivers from
      the Himalayas and the Peninsula filled it with alluvium 1000–2000 m deep over millions of years. The
      plain stretches about 3200 km from the mouth of the Indus to the mouth of the Ganga (about 2400 km in
      India), 150–300 km wide, about 7 lakh sq km; bordered by the Shiwaliks in the north and the Peninsular
      Plateau in the south; one of the world's largest alluvial plains. Himalayan rivers start in the
      Himalayas; peninsular rivers (e.g. Betwa) start on the plateau. Four divisions: Rajasthan Plain (west
      of the Aravalis; Thar with Marusthali and Rajasthan Bagar; non-perennial Luni; salt lakes Sambhar,
      Didwana, Sargol); Punjab-Haryana Plain (up to the Yamuna; Punjab, Haryana, Himachal; about 1.75 lakh
      sq km; slopes west; Satluj, Jhelum, Chenab, Ravi, Beas; 'Land of Five Rivers'; five doabs); Ganga Plain
      (Yamuna to Bangladesh; about 3.75 lakh sq km; average 200 m; slopes east and south-east; upper, middle
      and lower); Brahmaputra Plain (Assam Valley; about 720 km long, 60–70 km wide, about 56,275 sq km;
      bounded by the Eastern Himalaya, Patkai-Naga Hills, Garo-Khasi-Jaintia and Mikir Hills; tributaries
      Teesta, Manas, Lohit, Dibang).
    explanations:
      text: "Rivers carried soil down from the mountains for millions of years and filled a huge low area south of the Himalayas, making one of the world's biggest flat, fertile plains. It has four parts from west to east."
      visual: "Picture a long trough beside a new mountain wall. Rivers pour mud into it from both sides until it is filled flat: that is the North Indian Plain."
      step_by_step: "To name a doab: Step 1: find the two rivers on either side. Step 2: Beas–Satluj is Bist-Jalandhar, Beas–Ravi is Bari, Ravi–Chenab is Rachna, Chenab–Jhelum is Chaj, Indus–Jhelum/Chenab is Sindh-Sagar."
      real_world: "The word Punjab means 'five waters', after its five rivers."
    items:
      - prompt: "Alluvium is"
        options: ["Silt, sand and gravel brought by rivers", "Lava from volcanoes", "Snow on mountains", "Salt from the sea"]
        answer: "Silt, sand and gravel brought by rivers"
        difficulty: 1
        hints: ["Rivers deposit it."]
        solution: "River-deposited debris."
        mistakes: {"Lava from volcanoes": plain_formation}
      - prompt: "A land lying between two rivers that later join is called a"
        options: ["Doab", "Delta", "Dun", "Bugyal"]
        answer: "Doab"
        difficulty: 1
        hints: ["Punjab has five."]
        solution: "A doab."
        mistakes: {"Delta": doab}
      - prompt: "Which river forms the eastern boundary of the Punjab-Haryana Plain?"
        options: ["Yamuna", "Ganga", "Indus", "Luni"]
        answer: "Yamuna"
        difficulty: 1
        hints: ["The Ganga Plain starts east of it."]
        solution: "The Yamuna."
        mistakes: {"Ganga": plain_divisions}
      - prompt: "The plain extends about 3200 km, of which about 2400 km is in India. How many km lie outside India?"
        answer: "800"
        check: "3200 - 2400"
        difficulty: 2
        hints: ["Subtract."]
        solution: "3200 − 2400 = 800 km."
        mistakes: {"5600": plain_formation}
      - prompt: "The Rachna Doab lies between which rivers?"
        options: ["Ravi and Chenab", "Beas and Satluj", "Chenab and Jhelum", "Beas and Ravi"]
        answer: "Ravi and Chenab"
        difficulty: 2
        hints: ["Ra- for Ravi, -chna for Chenab."]
        solution: "Ravi and Chenab."
        mistakes: {"Beas and Satluj": doab}
      - prompt: "Why did a deep depression form south of the Himalayas?"
        options: ["It formed along with the Himalayas as the plates collided", "A meteor hit there", "The sea dried up last century", "Rivers dug it in one year"]
        answer: "It formed along with the Himalayas as the plates collided"
        difficulty: 2
        hints: ["The plain's story is linked to the mountains."]
        solution: "The collision that raised the Himalayas also made the trough that rivers later filled."
        mistakes: {"Rivers dug it in one year": plain_formation}
      - prompt: "Which is the easternmost division of the North Indian Plain?"
        options: ["Brahmaputra Plain", "Rajasthan Plain", "Punjab-Haryana Plain", "Ganga Plain"]
        answer: "Brahmaputra Plain"
        difficulty: 1
        hints: ["Also called the Assam Valley."]
        solution: "The Brahmaputra Plain."
        mistakes: {"Ganga Plain": plain_divisions}
      - prompt: "Average depth of alluvial deposits is 1000 to 2000 m. What is the midpoint of this range (m)?"
        answer: "1500"
        check: "(1000 + 2000)/2"
        difficulty: 2
        hints: ["Add and halve."]
        solution: "1500 m."
        mistakes: {"3000": plain_formation}

  - code: ss9.plain.landforms
    title: River landforms and the zones of the plain
    after: [ss9.plain.formation]
    notes: |
      Alluvial fans: where rivers enter the plain from mountains, speed drops suddenly and sediment
      spreads in fan shapes (common in the Brahmaputra Plain). Rivers in plains split into many channels
      (braided). Meanders: sinuous curves formed when deposits deflect a slow river; continued erosion and
      deposition curve them more; when the river straightens, cut-off curves become ox-bow lakes. Flood
      plains: alluvium deposited on banks during floods; ideal for farming; river valley civilisations grew
      on them. Riverine islands (in channels), levees (ridges along banks), sandbars (linear deposits in
      beds). Deltas: near the mouth rivers branch into distributaries and deposit roughly triangular land,
      named after the Greek letter Δ. Zones north to south: Bhabar (8–10 km wide, south of the Shiwaliks,
      rocks and boulders; rivers flow under them and are not visible), Tarai (10–20 km wide, marshy, rivers
      re-emerge, rich vegetation and wildlife), alluvial plain with Bhangar (older alluvium) and Khadar
      (newer alluvium), with riverine islands, sandbars, deltas, braided streams, meanders and ox-bow lakes.
    explanations:
      text: "Slow rivers on a plain build things: fans where they leave the hills, bends that become ox-bow lakes, banks of levees, islands, and deltas at the sea. From the hills southwards, the plain changes from bouldery Bhabar to marshy Tarai to farmland of Bhangar and Khadar."
      visual: "Draw a snake-like river. Pinch off one big loop so it is a separate crescent of water: that is an ox-bow lake."
      step_by_step: "To order the zones from the Shiwaliks southwards: Step 1: Bhabar (boulders, hidden rivers). Step 2: Tarai (marshy, rivers reappear). Step 3: Bhangar (old alluvium). Step 4: Khadar (new alluvium near rivers)."
      real_world: "The Sundarbans and the Ganga–Brahmaputra delta in Bengal are the world's largest delta region."
    items:
      - prompt: "A curved section of river cut off from the main channel forms"
        options: ["An ox-bow lake", "A doab", "A levee", "An alluvial fan"]
        answer: "An ox-bow lake"
        difficulty: 1
        hints: ["It starts as a meander."]
        solution: "An ox-bow lake."
        mistakes: {"A levee": river_landforms}
      - prompt: "Deltas are named after"
        options: ["The Greek letter Δ, because of their triangular shape", "A river in Greece", "A scientist named Delta", "Their colour"]
        answer: "The Greek letter Δ, because of their triangular shape"
        difficulty: 1
        hints: ["Look at the shape."]
        solution: "The Greek letter delta (Δ)."
        mistakes: {"A river in Greece": river_landforms}
      - prompt: "In which zone do rivers disappear under rocks and boulders?"
        options: ["Bhabar", "Tarai", "Khadar", "Bhangar"]
        answer: "Bhabar"
        difficulty: 1
        hints: ["It is just south of the Shiwaliks."]
        solution: "Bhabar."
        mistakes: {"Tarai": plain_zones}
      - prompt: "Newer alluvium in the plain is called"
        options: ["Khadar", "Bhangar", "Bhabar", "Karewa"]
        answer: "Khadar"
        difficulty: 2
        hints: ["Bhangar is older."]
        solution: "Khadar."
        mistakes: {"Bhangar": plain_zones}
      - prompt: "Ridges of sediment along the sides of a river are"
        options: ["Levees", "Sandbars", "Riverine islands", "Deltas"]
        answer: "Levees"
        difficulty: 2
        hints: ["They are on the banks, not in the channel."]
        solution: "Levees."
        mistakes: {"Sandbars": river_landforms}
      - prompt: "Fan-shaped deposits where rivers leave the mountains are"
        options: ["Alluvial fans", "Ox-bow lakes", "Gorges", "Margs"]
        answer: "Alluvial fans"
        difficulty: 2
        hints: ["The river slows suddenly."]
        solution: "Alluvial fans."
        mistakes: {"Gorges": river_landforms}
      - prompt: "Which zone is marshy, with rivers re-emerging and rich wildlife?"
        options: ["Tarai", "Bhabar", "Bhangar", "Marusthali"]
        answer: "Tarai"
        difficulty: 2
        hints: ["It runs parallel to the Bhabar."]
        solution: "The Tarai."
        mistakes: {"Bhabar": plain_zones}
      - prompt: "Why do rivers deposit more sediment as they near the sea?"
        options: ["Their speed drops", "They get faster", "The water turns salty first", "The sediment melts"]
        answer: "Their speed drops"
        difficulty: 3
        hints: ["Slow water cannot carry heavy loads."]
        solution: "Slower water drops its load, building deltas."
        mistakes: {"They get faster": river_landforms}

  - code: ss9.plain.climate
    title: Climate of the North Indian Plain
    after: [ss9.plain.formation]
    notes: |
      Cold season from mid-November; December and January coldest. Reasons: far from the ocean (continental
      climate), snowfall in the nearby Himalayas brings cold waves, cold winds from West Asia bring frost
      and fog in the west, and the sun's apparent movement south. Slight rain in winter. Hot season: rising
      by March; April–June; up to 48 °C in the west by May; hot, dry Loo winds blow from Rajasthan to the
      Ganga Plain in May–June; evening dust storms in Punjab, Haryana, eastern Rajasthan and UP bring light
      rain. The heat creates low pressure that draws in the southwest monsoon in two branches. The Bay of
      Bengal branch enters through the Sundarbans and splits: one sub-branch to the Brahmaputra Plain, the
      other west along the Ganga Plain (West Bengal, Bihar, UP, Delhi); over Punjab it joins the Arabian Sea
      branch, which moves parallel to the Aravalis, and they bring rain to the Western Himalayan foothills.
      Rajasthan gets scanty rain. Southwest monsoon season June–September is the main rainy season.
      Retreating (northeast) monsoon: as the sun moves south, high pressure forms over the plain and dry
      winds blow from the north-east to the Indian Ocean; heat plus humidity makes 'October heat'.
    explanations:
      text: "Far from the sea, the plain has extremes: freezing winters, blazing summers with Loo winds, monsoon rain from June to September, then a sticky 'October heat'."
      visual: "Draw two monsoon arrows: one from the Bay of Bengal splitting east to Assam and west along the Ganga, one from the Arabian Sea sliding up beside the Aravalis. They meet over Punjab."
      step_by_step: "To explain the cold winter: Step 1: no sea nearby to soften it. Step 2: cold waves from Himalayan snow. Step 3: cold winds from West Asia. Step 4: the sun has moved south."
      real_world: "Delhi's winter fog that delays trains and flights is part of the cold season of the North Indian Plain."
    items:
      - prompt: "Which months are the coldest in the North Indian Plain?"
        options: ["December and January", "April and May", "July and August", "October and November"]
        answer: "December and January"
        difficulty: 1
        hints: ["The cold season starts in mid-November."]
        solution: "December and January."
        mistakes: {"October and November": plain_climate}
      - prompt: "The hot, dry wind that blows from Rajasthan to the Ganga Plain in May–June is"
        options: ["Loo", "Sea breeze", "Northeast monsoon", "Chinook"]
        answer: "Loo"
        difficulty: 1
        hints: ["It raises temperatures sharply."]
        solution: "Loo."
        mistakes: {"Sea breeze": plain_climate}
      - prompt: "What is the main rainy season of the North Indian Plain?"
        options: ["Southwest monsoon, June to September", "Northeast monsoon, October to November", "Winter, December to January", "Summer, April to May"]
        answer: "Southwest monsoon, June to September"
        difficulty: 1
        hints: ["Kharif crops grow then."]
        solution: "The southwest monsoon."
        mistakes: {"Northeast monsoon, October to November": plain_climate}
      - prompt: "What is 'October heat'?"
        options: ["Oppressive weather from high temperature and humidity in the retreating monsoon", "A summer festival", "Snow melting in October", "A cold wave"]
        answer: "Oppressive weather from high temperature and humidity in the retreating monsoon"
        difficulty: 2
        hints: ["The plain is dry but humid then."]
        solution: "Heat plus humidity during the retreating monsoon."
        mistakes: {"A cold wave": plain_climate}
      - prompt: "The maximum summer temperature in the western plain reaches about 48 °C, and a Kerala summer day is about 33 °C. What is the difference (°C)?"
        answer: "15"
        check: "48 - 33"
        difficulty: 2
        hints: ["Subtract."]
        solution: "48 − 33 = 15 °C."
        mistakes: {"81": plain_climate}
      - prompt: "Where does the Bay of Bengal branch of the monsoon join the Arabian Sea branch?"
        options: ["Over the Punjab Plain", "Over Kerala", "Over the Sundarbans", "Over Assam"]
        answer: "Over the Punjab Plain"
        difficulty: 2
        hints: ["Far in the north-west."]
        solution: "Over the Punjab Plain."
        mistakes: {"Over the Sundarbans": plain_climate}
      - prompt: "Why is winter so cold in the North Indian Plain?"
        options: ["It is far from the sea, and cold waves come from Himalayan snow and West Asia", "It is near the equator", "Warm ocean currents pass by", "It rains every day"]
        answer: "It is far from the sea, and cold waves come from Himalayan snow and West Asia"
        difficulty: 3
        hints: ["Think of the moderating influence of the sea."]
        solution: "Continental location plus cold winds and waves."
        mistakes: {"It is near the equator": plain_climate}

  - code: ss9.plain.vegetation_life
    title: Vegetation, soils and human life
    after: [ss9.plain.climate]
    notes: |
      Natural vegetation: plant community left undisturbed long enough to adapt to climate and soil.
      Tropical deciduous forests: dry deciduous where rain is 70–100 cm (plains of UP and Bihar; leaves shed
      6–8 weeks) and moist deciduous where rain is 100–200 cm (Shiwalik strip with Tarai and Bhabar, parts
      of Odisha and West Bengal); teak, sal, shisham, mahua, amla, sandalwood; parkland landscape. Tropical
      thorn forests in semi-arid SW Punjab, Haryana, Rajasthan, UP: babool, ber, wild date palm, khair,
      neem, khejri, palas; tussocky grass up to 2 m. Swamp forests in saline Rajasthan, freshwater marshes,
      Brahmaputra floodplains and the Sundarbans (mangroves, sundri; home of the Royal Bengal Tiger).
      Soils: mostly alluvial (sandy loam to clay; Khadar and Bhangar); red soil (iron) in the south of the
      Middle Ganga Plain; saline soil in the Sundarbans and over-irrigated areas; peat soil on the West
      Bengal coast; arid soil in Rajasthan (needs irrigation). Human life: less than a quarter of India's
      area but more than half its people; wheat, rice, jute, sugarcane; 'granary of India'; good roads and
      railways, industry and cities. Cropping seasons: Kharif (June–September: rice, cotton, jute, bajra,
      tur), Rabi (October–March: wheat, gram, mustard, barley), Zaid (April–June: vegetables, fruits,
      fodder).
    explanations:
      text: "Rain decides the forests: thorny scrub in the dry west, deciduous teak and sal in the middle, mangroves in the wet delta. Fertile alluvium makes the plain India's granary, feeding over half the country's people."
      visual: "Picture a strip map coloured west to east: brown thorn scrub, light green dry deciduous, darker green moist deciduous, deep green mangroves at the delta."
      step_by_step: "To match a crop to a season: Step 1: grown in the monsoon (June–Sept)? Kharif. Step 2: grown in winter (Oct–March)? Rabi. Step 3: short summer crop (April–June)? Zaid."
      real_world: "Much of the wheat in your chapati and the rice in ration shops across India comes from this plain."
    items:
      - prompt: "Which crop is grown in the Rabi season?"
        options: ["Wheat", "Rice", "Jute", "Cotton"]
        answer: "Wheat"
        difficulty: 1
        hints: ["Rabi begins with the cold season."]
        solution: "Wheat (also gram, mustard, barley)."
        mistakes: {"Rice": plain_life}
      - prompt: "The Kharif season runs from"
        options: ["June to September", "October to March", "April to June", "January to April"]
        answer: "June to September"
        difficulty: 1
        hints: ["It matches the southwest monsoon."]
        solution: "June to September."
        mistakes: {"October to March": plain_life}
      - prompt: "The Royal Bengal Tiger lives in which forest?"
        options: ["Sundarbans mangroves", "Thorn forests of Rajasthan", "Dry deciduous forests of Bihar", "Alpine meadows"]
        answer: "Sundarbans mangroves"
        difficulty: 1
        hints: ["A deltaic swamp forest in West Bengal."]
        solution: "The Sundarbans."
        mistakes: {"Thorn forests of Rajasthan": plain_life}
      - prompt: "Dry deciduous forests grow where annual rainfall is"
        options: ["70 to 100 cm", "100 to 200 cm", "Above 200 cm", "Below 25 cm"]
        answer: "70 to 100 cm"
        difficulty: 2
        hints: ["Moist deciduous need 100–200 cm."]
        solution: "70–100 cm."
        mistakes: {"100 to 200 cm": plain_life}
      - prompt: "What gives red soil its colour?"
        options: ["Iron", "Salt", "Humus", "Sand"]
        answer: "Iron"
        difficulty: 2
        hints: ["Like rust."]
        solution: "The presence of iron."
        mistakes: {"Salt": plain_life}
      - prompt: "Why is the North Indian Plain called the granary of India?"
        options: ["Extensive irrigated farming produces much of India's food grain", "It stores grain for other countries", "It has the most mountains", "It has no rivers"]
        answer: "Extensive irrigated farming produces much of India's food grain"
        difficulty: 2
        hints: ["Wheat and rice."]
        solution: "Fertile soil, rivers and irrigation give huge harvests."
        mistakes: {"It has the most mountains": plain_life}
      - prompt: "How has fertile alluvial soil become saline in some parts of the plain?"
        options: ["Intensive cultivation with excessive irrigation", "Too little rain", "Volcanic ash", "Snowfall"]
        answer: "Intensive cultivation with excessive irrigation"
        difficulty: 3
        hints: ["Over-watering brings salts up."]
        solution: "Over-irrigation has made some soils saline."
        mistakes: {"Volcanic ash": plain_life}
      - prompt: "Which tree is typical of the tropical thorn forests?"
        options: ["Babool", "Sundri", "Deodar", "Teak"]
        answer: "Babool"
        difficulty: 2
        hints: ["It grows in dry, semi-arid areas."]
        solution: "Babool (also ber, khair, khejri)."
        mistakes: {"Sundri": plain_life}
