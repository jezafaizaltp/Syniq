  - code: ss9.desert.human_life
    title: Human life in the Thar
    after: [ss9.desert.climate_nature]
    notes: |
      The Thar is sparsely populated; most people live in villages; in severe drought groups migrate as
      nomads. Agriculture: crops needing little water, and commercial farming with irrigation: bajra,
      jowar, wheat, corn, millets, groundnut, cotton. Indira Gandhi Canal (formerly Rajasthan Canal)
      starts at the Harike Barrage, supplies Sri Ganganagar, Bikaner and Jaisalmer, and gives drinking
      water to eight districts of western Rajasthan; farm output, agro-industries and fodder have
      increased. Pastoralism: Rajasthan has about 10% of India's livestock: goats, buffalo, sheep, cows,
      camels. Mining: world-famous Makrana marble (the Taj Mahal is made of it); also lead, zinc, silver,
      copper, tungsten, manganese, iron, gypsum, lignite, limestone. Handicrafts: leather goods from camel
      hide (lampshades, pouches, sandals) and leather musical instruments. Energy: wind parks (e.g.
      Jaisalmer) and solar panels, used mainly for desalination. Tourism: Hawa Mahal, Ajmer Fort, Dilwara
      and Ranakpur Jain temples, camel safaris. Challenges: up to 50 °C, water scarcity, roads blocked by
      sand winds and melting tar, poor communication.
    explanations:
      text: "Life in the Thar is hard, but people farm with canal water, raise animals, mine marble, make leather crafts, use wind and sun for power, and welcome tourists."
      visual: "Picture a map of western Rajasthan with a long blue line (the Indira Gandhi Canal) bringing water from the Harike Barrage in Punjab to green fields near Bikaner and Jaisalmer."
      step_by_step: "To link a resource to a job: Step 1: canal water → farming and drinking water. Step 2: dry grassland → pastoralism. Step 3: marble and minerals → mining. Step 4: wind and sun → energy. Step 5: forts, temples and dunes → tourism."
      real_world: "Many marble shops in Kerala sell stone brought from Rajasthan, and the Taj Mahal is made of Makrana marble."
