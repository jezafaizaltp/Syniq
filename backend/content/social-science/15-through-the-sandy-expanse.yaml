# Class 9 Social Science II, chapter 7 (stored as Social Science chapter 15). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 2 text supplied by the school.
subject: ss
chapter: 15
title: Through the Sandy Expanse

tips:
  cold_and_dry: "A desert is defined by very little rain, not by heat. Ladakh is high and freezing but gets almost no rain."
  share_percent: "Percentage in India = area in India ÷ total area × 100."
  salt_left_behind: "Rivers carry dissolved salts into a lake with no outlet. In fierce heat, what leaves the lake and what stays?"
  wet_patches: "Farming needs fertile soil and some water. Which parts of the Bagar have both?"
  dunes_migrate: "Wind lifts sand from the side facing it and drops it on the sheltered side. What happens to the whole dune over time?"
  process_match: "Abrasion rubs, deflation removes, deposition drops. Match each to what it would make."
  store_water: "In the desert, the hardest thing is to get water and not lose it. How do thick stems and spines help?"
  camel_body: "Think of what a desert animal needs: going long without water, walking on soft sand and coping with heat."
  canal_water: "What is the one thing desert farmland lacks most? What does a canal bring?"
  sun_and_wind: "Solar panels need sunshine and wind turbines need strong wind and open space. What does the Thar have plenty of?"
  k9_mushroom_abrasion: "Sand carried near the ground rubs the base of a rock like sandpaper. What is wearing away by rubbing called?"
  k9_dune_deposition: "A dune is a pile of sand that wind has dropped. Is that the wind taking material away, rubbing rock, or laying sand down?"
  k9_marusthali: "The desert proper is the driest western part, whose name means 'land of death'. The Bagar is the semi-arid strip to its east."
  desert_types: "Deserts get very little rain: less than about a quarter of a metre a year. Their study has a Greek name meaning lonely place. Hot deserts lie where dry trade winds blow, between the tropics and around 30°. Dry air and clear skies let heat in and out fast."
  thar_formation: "The Thar lies west of an old, worn mountain range in Rajasthan; the salty marsh of Gujarat is to its south. Only a small part lies outside India: subtract. The monsoon branch from the east is blocked by those hills."
  thar_regions: "Marusthali means land of death: the true desert. The local word for shifting dunes and for fertile tracts are in the textbook's box. The biggest inland salt lake is near Jaipur. The Luni's name means salty water, and it ends in the salty marsh of Kachchh. Its old rocks match the peninsula."
  wind_landforms: "Wind removes sand (deflation, leaving hollows), grinds rocks with sand (abrasion, mostly near the ground) and drops sand (deposition, making dunes). Crescent dunes have a special name. An oasis forms where underground water reaches the surface."
  thar_climate: "Summer March–June, 40–45 °C in Bikaner and Jaisalmer, hot Loo winds. Rain July–September, under 25 cm in the Thar (about 76.2 cm east of the Aravalis). Winter December–February, nights can go below 0 °C in Bikaner, Churu and Sikar."
  thar_life: "Thar farming uses crops that need little water, and a canal named after a Prime Minister brings water from a barrage in Punjab. The Taj Mahal's marble came from a famous town in Rajasthan. Check the textbook figure for livestock. Wind and solar power make sea or salty water drinkable."
  ss15d_hot_or_cold: A desert is about very little rain, not about heat. Some deserts are frozen.
  ss15d_borders: 'Picture the map: river basins to the north-west and west, a mountain range to the east, a salt marsh to the south.'
  ss15d_monsoon_miss: One monsoon branch runs alongside the Aravalis without turning inland; the other is blocked by them.
  ss15d_two_parts: The western part is the true sandy desert; the eastern part up to the Aravalis is semi-arid with some farming.
  ss15d_river_end: The Luni does not reach the open sea. Where does a desert river lose itself?
  ss15d_erode_or_drop: Is the wind taking sand away (erosion) or leaving sand behind (deposition)?
  ss15d_dune_shape: 'Each dune type is named by its shape: a crescent moon, a long line like a sword, or a U-shape.'
  ss15d_desert_seasons: "Thar seasons in order: hot and dry first, then the short rains, then a dry spell, then cold nights. Which comes right after winter ends?"
  ss15d_canal_source: "The canal takes water from rivers in the Land of Five Rivers, at a barrage, and carries it into the desert."
  ss15d_desert_jobs: Which work fits a dry land with rocks, sun, wind and animals, but little water?

concepts:
  - code: ss9.desert.deserts_thar
    title: Deserts and the Thar Desert
    notes: |
      Deserts generally get less than 25 cm of rain a year. 'Desert' comes from the Latin 'desertum'
      (abandoned place); the study of deserts is Eremology. Cold deserts: permanent snow and extreme cold,
      in polar regions and high mountains and plateaus. Hot deserts: arid, between 15° and 30° latitude on
      the western margins of continents, very hot days and cold nights (high diurnal range). The Thar or
      Great Indian Desert in northwest India covers about 200,000 sq km, of which 175,000 sq km is in
      India; about two-thirds of the Indian part is in Rajasthan, the rest in Haryana, Punjab and Gujarat;
      it extends into Punjab and Sindh in Pakistan. Boundaries: northwest Sutlej basin, west Indus basin,
      east Aravali mountains, south Rann of Kachchh. Formation: the Arabian Sea branch of the southwest
      monsoon passes parallel to the Aravalis without entering interior Rajasthan; the Bay of Bengal
      branch, blowing east to west along the Himalayas, is checked by the Aravalis; high evaporation and
      dry winds also reduce rain. So it is a rain shadow region for the Bay of Bengal branch.
    explanations:
      text: "A desert is a place with less than 25 cm of rain a year. The Thar formed because both branches of the monsoon fail to bring rain to western Rajasthan, and the Aravali hills play a big part in that."
      visual: "On a map of India, draw the Aravali hills running from northeast to southwest. The Arabian Sea winds slide along them; the Bay of Bengal winds hit them from the east. The land west of the hills stays dry."
      step_by_step: "To explain the Thar's low rain: Step 1: the Arabian Sea branch moves parallel to the Aravalis and does not enter. Step 2: the Bay of Bengal branch is stopped by the Aravalis. Step 3: high evaporation and dry winds lower rain further."
      real_world: "Benyamin's novel 'Goat Days' (Aadujeevitham) describes a Keralite stranded in a desert, where sand mountains seemed to move overnight."
    activity:
      type: sort
      prompt: Hot desert or cold desert?
      bins:
      - Hot desert
      - Cold desert
      items:
      - label: The Thar
        bin: Hot desert
        clue: Rajasthan, about 45 °C in summer.
        why: Thar is a hot desert.
      - label: Ladakh
        bin: Cold desert
        clue: High in the northern mountains, little rain.
        why: Ladakh is a cold desert.
      - label: Polar regions
        bin: Cold desert
        clue: Permanent snow.
        why: Cold desert.
      - label: Very hot days, cold nights, 15°–30° latitude
        bin: Hot desert
        clue: Western margins of continents.
        why: Hot desert.
      - label: Permanent snow and extreme cold on a high plateau
        bin: Cold desert
        clue: Little rain, but not hot.
        why: Cold desert.
      - label: Less than 25 cm of rain, on a continent's western edge
        bin: Hot desert
        clue: Between 15° and 30° latitude.
        why: Hot desert.
    lesson:
      - teach: A desert gets less than 25 cm of rain a year. 'Desert' comes from Latin 'desertum', an abandoned place; studying deserts is Eremology. Hot deserts lie between 15° and 30° latitude on the western sides of continents. Cold deserts, like Ladakh, are in polar areas and high mountains.
        picture:
          kind: compare
          columns:
          - title: Hot desert
            points:
            - 15°–30° latitude
            - hot days, cold nights
            - e.g. Thar
          - title: Cold desert
            points:
            - polar or high mountains
            - snow and extreme cold
            - e.g. Ladakh
          alt: Hot and cold deserts compared.
        check:
          prompt: What makes a place a desert?
          options:
          - Very little rain
          - Always hot weather
          - Lots of camels
          answer: Very little rain
          why: Deserts get under 25 cm of rain a year, hot or cold.
        ways:
        - style: step_by_step
          teach: 'Step 1: measure a place''s yearly rainfall. Step 2: if it is under 25 cm, it is a desert. Step 3: hot deserts lie between 15° and 30° latitude on the western sides of continents. Step 4: cold deserts, like Ladakh, are in polar areas and high mountains. The study of deserts is Eremology.'
      - teach: 'The Thar (Great Indian Desert) covers about 2,00,000 sq km; about 1,75,000 sq km is in India, two-thirds of that in Rajasthan. Boundaries: Sutlej basin (north-west), Indus basin (west), Aravalis (east), Rann of Kachchh (south).'
        check:
          prompt: Which state has most of the Indian Thar?
          options:
          - Rajasthan
          - Kerala
          - Assam
          answer: Rajasthan
          why: About two-thirds of the Indian part is in Rajasthan.
        ways:
        - style: visual
          teach: The Thar covers about 2,00,000 sq km, of which about 1,75,000 sq km is in India, and two-thirds of that is in Rajasthan. It is bounded by the Sutlej basin to the north-west, the Indus basin to the west, the Aravalis to the east and the Rann of Kachchh to the south.
          picture:
            kind: compare
            alt: 'Thar boundaries: north-west Sutlej basin, west Indus basin, east Aravalis, south Rann of Kachchh.'
            columns:
            - title: North-west and west
              points:
              - Sutlej basin
              - Indus basin
            - title: East and south
              points:
              - Aravalis
              - Rann of Kachchh
      - teach: Why is it dry? The Arabian Sea monsoon branch runs parallel to the Aravalis and does not turn inland. The Bay of Bengal branch, moving west along the Himalayas, is blocked by the Aravalis. Strong heat and dry winds also cut rain. So the Thar is a rain shadow for the Bay of Bengal branch.
        picture:
          kind: flow
          steps:
          - Arabian Sea winds pass alongside the Aravalis
          - Bay of Bengal winds blocked by the Aravalis
          - Heat and dry winds
          - 'Very little rain: Thar Desert'
          alt: Why the Thar gets so little rain.
        check:
          prompt: Which mountains block the Bay of Bengal winds from the Thar?
          options:
          - Aravalis
          - Western Ghats
          - Nilgiris
          answer: Aravalis
          why: The Aravalis lie on the Thar's east side, in the winds' path.
        ways:
        - style: step_by_step
          teach: 'Step 1: the Arabian Sea monsoon branch runs alongside the Aravalis and doesn''t turn inland. Step 2: the Bay of Bengal branch moves west along the Himalayas but the Aravalis block it. Step 3: strong heat and dry winds cut rain further. Step 4: so the Thar gets very little rain: a rain shadow.'
    items:
      - prompt: "Deserts generally receive annual rainfall of less than"
        answer: "25"
        check: "25"
        difficulty: 1
        hints: ["Give the answer in centimetres."]
        solution: "Less than 25 cm a year."
        mistakes: {"76.2": desert_types}
      - prompt: "The study of deserts is called"
        options: ["Eremology", "Ecology", "Geology", "Seismology"]
        answer: "Eremology"
        difficulty: 1
        hints: ["It comes from a word for a lonely place."]
        solution: "Eremology."
        mistakes: {"Ecology": desert_types}
      - prompt: "Which mountain range forms the eastern boundary of the Thar Desert?"
        options: ["Aravali", "Western Ghats", "Himalayas", "Vindhya"]
        answer: "Aravali"
        difficulty: 1
        hints: ["It also blocks the Bay of Bengal monsoon branch."]
        solution: "The Aravali mountains."
        mistakes: {"Himalayas": thar_formation}
      - prompt: "Hot deserts are generally found between which latitudes, on the western margins of continents?"
        options: ["15° and 30°", "0° and 10°", "40° and 60°", "60° and 90°"]
        answer: "15° and 30°"
        difficulty: 2
        hints: ["Away from the equator but not near the poles."]
        solution: "Between 15° and 30° latitude."
        mistakes: {"60° and 90°": desert_types}
      - prompt: "What is the southern boundary of the Thar Desert?"
        options: ["Rann of Kachchh", "Sutlej River basin", "Indus River basin", "Aravali mountains"]
        answer: "Rann of Kachchh"
        difficulty: 2
        hints: ["The Luni river disappears into it."]
        solution: "The Rann of Kachchh. Northwest: Sutlej basin; west: Indus basin; east: Aravalis."
        mistakes: {"Aravali mountains": thar_formation}
      - prompt: "About how much of the Thar Desert's 200,000 sq km lies in India (sq km)?"
        answer: "175000"
        check: "175000"
        difficulty: 2
        hints: ["The rest is in Pakistan."]
        solution: "About 175,000 sq km."
        mistakes: {"200000": thar_formation}
      - prompt: "If 175,000 sq km of the Thar is in India, how many sq km are outside India?"
        answer: "25000"
        check: "200000 - 175000"
        difficulty: 2
        hints: ["The whole desert is about 200,000 sq km."]
        solution: "200,000 − 175,000 = 25,000 sq km, in Pakistan."
        mistakes: {"175000": thar_formation}
      - prompt: "For which branch of the southwest monsoon is the Thar Desert a rain shadow region?"
        options: ["The Bay of Bengal branch, checked by the Aravalis", "The Arabian Sea branch, blocked by the Western Ghats", "The northeast monsoon", "No branch; it gets heavy rain"]
        answer: "The Bay of Bengal branch, checked by the Aravalis"
        difficulty: 3
        hints: ["Which branch is stopped by the Aravali hills?"]
        solution: "The Bay of Bengal branch is blocked by the Aravalis; the Arabian Sea branch runs parallel to them without entering."
        mistakes: {"The Arabian Sea branch, blocked by the Western Ghats": thar_formation}
      - prompt: "Ladakh gets very little rain and has bitterly cold winters. What kind of desert is it?"
        options: ["A cold desert", "A hot desert", "Not a desert, because it is cold", "A coastal desert"]
        answer: "A cold desert"
        difficulty: 2
        hints: ["What defines a desert: heat or lack of rain?", "Deserts can be hot or cold."]
        solution: "Step 1: A desert is a region with very little rain. Step 2: Ladakh is dry and very cold, so it is a cold desert."
        mistakes: {"A hot desert": cold_and_dry, "Not a desert, because it is cold": cold_and_dry, "A coastal desert": desert_types}
      - prompt: "The Thar Desert covers about 2,00,000 sq km, of which about 1,75,000 sq km is in India. What percentage of it is in India?"
        answer: "87.5"
        check: "175000/200000*100"
        difficulty: 3
        hints: ["Divide the part in India by the whole.", "Then multiply by 100."]
        solution: "Step 1: 1,75,000 ÷ 2,00,000 = 0.875. Step 2: × 100 = 87.5%."
        mistakes: {"0.875": share_percent, "12.5": share_percent, "114.3": share_percent}
      - prompt: '''Desert'' comes from the Latin ''desertum'', meaning'
        options:
        - Abandoned place
        - Hot land
        - Sandy sea
        - Place of camels
        answer: Abandoned place
        difficulty: 1
        hints:
        - 'Think of the English word ''desert'' as a verb: to leave.'
        - A place people left behind.
        solution: 'Step 1: To desert means to leave. Step 2: Desertum = a place left empty. Step 3: Abandoned place.'
        mistakes:
          Hot land: ss15d_hot_or_cold
      - prompt: Which basin forms the western boundary of the Thar?
        options:
        - Indus basin
        - Ganga basin
        - Godavari basin
        - Brahmaputra basin
        answer: Indus basin
        difficulty: 2
        hints:
        - It is a river that flows through Pakistan.
        - The Sutlej basin is to the north-west.
        solution: 'Step 1: The Thar extends into Pakistan. Step 2: The big river there forms the west edge. Step 3: Indus basin.'
        mistakes:
          Ganga basin: ss15d_borders
      - prompt: Ladakh and Antarctica are both
        options:
        - Cold deserts
        - Hot deserts
        - Rainforests
        - Grasslands
        answer: Cold deserts
        difficulty: 1
        hints:
        - Both get very little rain.
        - Both are freezing.
        solution: 'Step 1: Low rain makes them deserts. Step 2: They are extremely cold. Step 3: Cold deserts.'
        mistakes:
          Hot deserts: ss15d_hot_or_cold
      - prompt: Two-thirds of the Indian Thar (1,75,000 sq km) is in Rajasthan. About how many sq km is that, to the nearest thousand?
        answer: '117000'
        check: round(175000*2/3, -3)
        difficulty: 3
        hints:
        - Find one-third first.
        - 175,000 ÷ 3 ≈ 58,333, then double it.
        solution: 'Step 1: 175,000 ÷ 3 ≈ 58,333. Step 2: × 2 ≈ 116,667. Step 3: About 117,000 sq km.'
        mistakes:
          '58000': ss15d_two_parts
      - prompt: Why do hot deserts have very hot days and cold nights?
        options:
        - Dry air and clear skies let heat come in and escape fast
        - The sea warms them at night
        - Clouds trap heat all night
        - They are near the poles
        answer: Dry air and clear skies let heat come in and escape fast
        difficulty: 2
        hints:
        - Clouds act like a blanket.
        - Do deserts have many clouds?
        solution: 'Step 1: No clouds by day: strong heating. Step 2: No clouds at night: heat escapes. Step 3: Large day–night difference.'
        mistakes:
          Clouds trap heat all night: cold_and_dry

  - code: ss9.desert.regions
    title: Marusthali, Rajasthan Bagar, Luni and salt lakes
    after: [ss9.desert.deserts_thar]
    notes: |
      The Thar has two regions. Marusthali (arid plain, desert proper): vast sandy expanse with outcrops
      of gneiss, schist and granite, showing it is a northwestern extension of the Peninsular Plateau;
      average height 200–250 m above mean sea level; eastern part rocky, western part covered by shifting
      dunes called Dhrian. Rajasthan Bagar (semi-arid plain): eastern part up to the Aravalis, drained by
      short seasonal rivers from the Aravalis that allow farming in fertile patches called Rohi. The Luni,
      the most significant river, is seasonal (non-perennial), rises in the Aravalis near Ajmer, has
      tributaries Lilri, Sukri and Jawai, takes its name from Sanskrit 'Lavanavari' (salt river), and
      after about 482 km disappears into the Rann of Kachchh. The sandy plain north of the Luni is Thali.
      Salt lakes: Sambhar (largest, about 65 km west of Jaipur, about 225 sq km in the rainy season),
      Didwana, Sargol, Khatu; used for salt production.
    explanations:
      text: "The west of the Thar (Marusthali) is true desert with moving dunes. The east (Rajasthan Bagar) is semi-arid, with seasonal rivers, some farmland and salt lakes."
      visual: "Picture the Thar split by a line: on the west, rolling sand dunes; on the east, near the Aravalis, small green fields along the Luni river and white salt pans at Sambhar Lake."
      step_by_step: "To place a feature: Step 1: is it shifting dunes or bare rock with granite? Marusthali. Step 2: is it a seasonal river, Rohi farmland or a salt lake? Rajasthan Bagar."
      real_world: "Much of the salt used in north India comes from salt pans like those at Sambhar Lake."
    activity:
      type: sort
      prompt: Marusthali or Rajasthan Bagar?
      bins:
      - Marusthali
      - Rajasthan Bagar
      items:
      - label: Shifting dunes called Dhrian
        bin: Marusthali
        clue: The desert proper, in the west.
        why: Marusthali.
      - label: Rocky outcrops of gneiss and granite
        bin: Marusthali
        clue: Extension of the Peninsular Plateau, in the east of the arid plain.
        why: Marusthali.
      - label: Fertile patches called Rohi
        bin: Rajasthan Bagar
        clue: Farming near short streams.
        why: Rajasthan Bagar.
      - label: Short seasonal rivers from the Aravalis
        bin: Rajasthan Bagar
        clue: The semi-arid plain next to the hills.
        why: Rajasthan Bagar.
      - label: The arid, sandy desert proper
        bin: Marusthali
        clue: Driest part.
        why: Marusthali.
      - label: Semi-arid plain up to the Aravalis
        bin: Rajasthan Bagar
        clue: A little wetter.
        why: Rajasthan Bagar.
    lesson:
      - teach: 'The Thar has two parts. Marusthali (desert proper) in the west: sandy, 200–250 m high, with shifting dunes called Dhrian; rocks like granite show it is an extension of the Peninsular Plateau. Rajasthan Bagar (semi-arid) in the east up to the Aravalis: short seasonal rivers and fertile patches called Rohi.'
        picture:
          kind: compare
          columns:
          - title: Marusthali (west)
            points:
            - desert proper
            - 'shifting dunes: Dhrian'
            - granite outcrops
          - title: Rajasthan Bagar (east)
            points:
            - semi-arid
            - seasonal streams
            - fertile Rohi patches
          alt: The two regions of the Thar.
        check:
          prompt: Fertile farming patches in the Rajasthan Bagar are called
          options:
          - Rohi
          - Dhrian
          - Thali
          answer: Rohi
          why: Rohi tracts have fertile soil and some water.
        ways:
        - style: visual
          teach: 'The Thar has two parts. In the west, Marusthali, the desert proper: sandy, with shifting dunes, and granite rocks showing it continues the Peninsular Plateau. In the east up to the Aravalis, Rajasthan Bagar: semi-arid, with seasonal rivers and fertile patches called Rohi.'
          picture:
            kind: compare
            alt: 'Marusthali in the west: sandy, shifting dunes. Rajasthan Bagar in the east: semi-arid, seasonal rivers, fertile Rohi.'
            columns:
            - title: Marusthali (west)
              points:
              - Desert proper
              - Shifting dunes (Dhrian)
              - Granite rocks
            - title: Rajasthan Bagar (east)
              points:
              - Semi-arid
              - Seasonal rivers
              - 'Fertile patches: Rohi'
      - teach: 'The Luni is the main river: seasonal, from the Aravalis near Ajmer, with tributaries Lilri, Sukri and Jawai. Its name means ''salt river'' (Lavanavari). After about 482 km it disappears into the Rann of Kachchh. Salt lakes like Sambhar (largest), Didwana and Sargol produce salt.'
        check:
          prompt: Where does the Luni end?
          options:
          - In the Rann of Kachchh
          - In the Bay of Bengal
          - In the Ganga
          answer: In the Rann of Kachchh
          why: It fades into the salt marsh without reaching the open sea.
        ways:
        - style: step_by_step
          teach: 'Step 1: the Luni starts in the Aravalis near Ajmer. Step 2: it flows only in the rainy season, joined by the Lilri, Sukri and Jawai. Step 3: its name means salt river. Step 4: after about 482 km it disappears into the Rann of Kachchh. Salt lakes like Sambhar, the largest, give salt.'
    items:
      - prompt: "Which part of the Thar is called the desert proper?"
        options: ["Marusthali", "Rajasthan Bagar", "Rohi", "Thali"]
        answer: "Marusthali"
        difficulty: 1
        hints: ["It is the arid plain in the west."]
        solution: "Marusthali."
        mistakes: {"Rajasthan Bagar": k9_marusthali}
      - prompt: "Shifting sand dunes in western Marusthali are locally called"
        options: ["Dhrian", "Rohi", "Thali", "Bagar"]
        answer: "Dhrian"
        difficulty: 2
        hints: ["Rohi are fertile patches."]
        solution: "Dhrian."
        mistakes: {"Rohi": thar_regions}
      - prompt: "The largest salt lake in the Rajasthan Bagar region is"
        options: ["Sambhar Lake", "Didwana Lake", "Chilika Lake", "Dal Lake"]
        answer: "Sambhar Lake"
        difficulty: 1
        hints: ["It is about 65 km west of Jaipur."]
        solution: "Sambhar Lake."
        mistakes: {"Chilika Lake": thar_regions}
      - prompt: "The River Luni flows into"
        options: ["The Rann of Kachchh", "The Arabian Sea at Mumbai", "The Bay of Bengal", "Sambhar Lake"]
        answer: "The Rann of Kachchh"
        difficulty: 1
        hints: ["It disappears after about 482 km."]
        solution: "It disappears into the Rann of Kachchh."
        mistakes: {"Sambhar Lake": thar_regions}
      - prompt: "The name Luni comes from the Sanskrit word 'Lavanavari'. What does it mean?"
        options: ["Salt river", "Sweet river", "Long river", "Sand river"]
        answer: "Salt river"
        difficulty: 2
        hints: ["'Lavana' means salt."]
        solution: "Salt river."
        mistakes: {"Sand river": thar_regions}
      - prompt: "Granite, gneiss and schist outcrops in Marusthali show that, geologically, it is an extension of"
        options: ["The Peninsular Plateau", "The Himalayas", "The Northern Plains", "The coastal plains"]
        answer: "The Peninsular Plateau"
        difficulty: 2
        hints: ["Its northwestern extension."]
        solution: "It is the northwestern extension of the Peninsular Plateau."
        mistakes: {"The Himalayas": thar_regions}
      - prompt: "The fertile tracts in the Rajasthan Bagar where farming is possible are called"
        options: ["Rohi", "Dhrian", "Loo", "Thali"]
        answer: "Rohi"
        difficulty: 2
        hints: ["Seasonal rivers from the Aravalis water them."]
        solution: "Rohi."
        mistakes: {"Thali": thar_regions}
      - prompt: "Why is Sambhar Lake salty?"
        options: ["Streams bring dissolved salts and the hot, dry climate evaporates the water, leaving salt behind", "Sea water flows into it every day", "People pour salt into it", "It is fed by melting glaciers"]
        answer: "Streams bring dissolved salts and the hot, dry climate evaporates the water, leaving salt behind"
        difficulty: 3
        hints: ["Does the lake drain to the sea?", "What happens to water in desert heat?"]
        solution: "Step 1: Streams carry dissolved salts into the lake, which has no outlet. Step 2: Strong evaporation removes the water but not the salt, so salt builds up."
        mistakes: {"Sea water flows into it every day": salt_left_behind, "People pour salt into it": salt_left_behind, "It is fed by melting glaciers": salt_left_behind}
      - prompt: "Why is farming possible in the Rohi tracts of the Rajasthan Bagar?"
        options: ["They have fertile soil and some water", "They get the most snow in Rajasthan", "They are made of salt", "They are covered by shifting dunes"]
        answer: "They have fertile soil and some water"
        difficulty: 2
        hints: ["The Bagar is semi-arid, not desert proper.", "What do crops need?"]
        solution: "Step 1: The Bagar gets a little more rain than Marusthali. Step 2: Its Rohi tracts have fertile soil and water from small streams, so crops can grow."
        mistakes: {"They get the most snow in Rajasthan": wet_patches, "They are made of salt": wet_patches, "They are covered by shifting dunes": thar_regions}
      - prompt: "Outcrops of gneiss and granite are found in the Marusthali. What do they tell us?"
