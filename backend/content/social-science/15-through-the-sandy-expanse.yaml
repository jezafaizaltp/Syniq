  - code: ss9.desert.landforms
    title: Desert landforms made by wind
    after: [ss9.desert.deserts_thar]
    notes: |
      In hot deserts strong winds and whirlwinds lift and move sand. Erosion: deflation is the blowing
      away of sand by wind; persistent winds in one direction make shallow depressions called deflation
      hollows, and continuous deflation forms caves in rocks. Abrasion is wind-borne sand rubbing and
      wearing rock outcrops; since wind lifts particles only up to a certain height, rocks wear most near
      the bottom, forming mushroom rocks. Deposition: when wind slows or is checked, sand is deposited and
      piles into sand dunes, loose mounds of sand. Types in the Thar: barchans (crescent-shaped),
      parabolic dunes, seif (linear) dunes, longitudinal dunes, transverse dunes. Dune location changes
      with wind direction and speed. Oases are fertile patches around a freshwater source (springs or
      groundwater), where cotton, citrus, fruits, wheat and corn are grown.
    explanations:
      text: "Wind shapes the desert two ways. It cuts away rock and sand (erosion), making hollows, caves and mushroom rocks. It also drops sand (deposition), building dunes."
      visual: "A mushroom rock: sand flying low keeps grinding the bottom of a rock, so the base becomes thin and the top stays wide, like a mushroom."
      step_by_step: "To name the process: Step 1: was sand removed from a place? Deflation. Step 2: was rock worn by flying sand? Abrasion. Step 3: was sand piled up? Deposition (dunes)."
      real_world: "On a windy beach you can watch small ripples and heaps of sand form: tiny versions of desert dunes."
    activity:
      type: sort
      prompt: Did wind wear it away or drop sand?
      bins:
      - Erosion (wears away)
      - Deposition (drops sand)
      items:
      - label: Deflation hollow
        bin: Erosion (wears away)
        clue: Sand blown away leaves a dip.
        why: Erosion by deflation.
      - label: Mushroom rock
        bin: Erosion (wears away)
        clue: Sand rubs the bottom most.
        why: Erosion by abrasion.
      - label: A cave in a rock
        bin: Erosion (wears away)
        clue: Continuous blowing.
        why: Erosion.
      - label: Barchan (crescent dune)
        bin: Deposition (drops sand)
        clue: Sand piles up when wind slows.
        why: Deposition.
      - label: Seif (linear) dune
        bin: Deposition (drops sand)
        clue: Long piles of sand.
        why: Deposition.
      - label: Transverse dune
        bin: Deposition (drops sand)
        clue: Built from sand.
        why: Deposition.
    lesson:
      - teach: 'Wind shapes deserts. Erosion: deflation blows loose sand away, leaving shallow deflation hollows; abrasion is sand rubbing against rocks like sandpaper. Wind lifts sand only a little way up, so rocks wear most at the bottom and become mushroom rocks.'
        picture:
          kind: flow
          steps:
          - Wind carries sand low down
          - Sand rubs the rock's base
          - Base wears thin, top stays wide
          - Mushroom rock
          alt: How abrasion makes a mushroom rock.
        check:
          prompt: Blowing away of loose sand by wind is
          options:
          - Deflation
          - Abrasion
          - Deposition
          answer: Deflation
          why: Deflation removes sand and can leave hollows.
        ways:
        - style: real_world
          teach: 'Rub sandpaper low on a wooden post again and again, and the bottom wears thin while the top stays wide. Desert wind does the same to rocks: it carries sand only a little above the ground, so rocks wear at the base into mushroom shapes. Wind also blows loose sand away, deflation, leaving hollows.'
      - teach: 'Deposition: when wind slows, it drops sand into dunes. Thar dunes include barchans (crescent), seif or linear dunes (long ridges), parabolic (U-shaped), longitudinal and transverse. Dunes move as wind blows sand from one side to the other. Oases form around springs or groundwater.'
        picture:
          kind: compare
          columns:
          - title: Erosion (wind removes)
            points:
            - deflation hollows
            - mushroom rocks
          - title: Deposition (wind drops)
            points:
            - sand dunes
            - barchans, seif, parabolic
          alt: Wind erosion and deposition landforms.
        check:
          prompt: Sand dunes come from which wind process?
          options:
          - Deposition
          - Abrasion
          - Deflation
          answer: Deposition
          why: Dunes are piles of sand dropped by the wind.
        ways:
        - style: step_by_step
          teach: 'Step 1: wind carrying sand slows down. Step 2: it drops the sand: deposition. Step 3: the sand piles into dunes: crescent barchans, long seif ridges, U-shaped parabolic dunes and others. Step 4: wind blows sand over the top, so dunes slowly move. Where there is a spring, an oasis forms.'
    items:
      - prompt: "Sand dunes are formed by wind through"
        options: ["Deposition", "Abrasion", "Deflation", "Weathering by rivers"]
        answer: "Deposition"
        difficulty: 1
        hints: ["Sand drops when wind slows down."]
        solution: "Deposition."
        mistakes: {"Abrasion": k9_dune_deposition}
      - prompt: "Mushroom rocks are formed mainly by"
        options: ["Abrasion", "Deposition", "Volcanic eruption", "River erosion"]
        answer: "Abrasion"
        difficulty: 1
        hints: ["Flying sand wears the lower part of the rock."]
        solution: "Abrasion."
        mistakes: {"Deposition": k9_mushroom_abrasion}
      - prompt: "Crescent-shaped sand dunes are called"
        options: ["Barchans", "Seif dunes", "Transverse dunes", "Oases"]
        answer: "Barchans"
        difficulty: 2
        hints: ["Their shape is like a new moon."]
        solution: "Barchans."
        mistakes: {"Seif dunes": wind_landforms}
      - prompt: "Shallow depressions formed when sand is blown away by steady winds are"
        options: ["Deflation hollows", "Sand dunes", "Mushroom rocks", "Salt lakes"]
        answer: "Deflation hollows"
        difficulty: 2
        hints: ["The process is called deflation."]
        solution: "Deflation hollows."
        mistakes: {"Sand dunes": wind_landforms}
      - prompt: "An oasis is formed because of"
        options: ["A freshwater source such as a spring or groundwater", "Heavy monsoon rain", "A salt lake", "Strong winds"]
        answer: "A freshwater source such as a spring or groundwater"
        difficulty: 1
        hints: ["It is a fertile patch in a desert."]
        solution: "A freshwater source."
        mistakes: {"A salt lake": wind_landforms}
      - prompt: "Why are mushroom rocks narrow at the bottom?"
        options: ["Wind lifts sand only to a limited height, so abrasion is strongest near the base", "Rain falls only on the bottom", "Animals dig at the base", "The top is made of a weaker rock"]
        answer: "Wind lifts sand only to a limited height, so abrasion is strongest near the base"
        difficulty: 3
        hints: ["How high can wind carry sand grains?"]
        solution: "Most sand moves near the ground, so the lower part wears away faster."
        mistakes: {"Rain falls only on the bottom": wind_landforms}
      - prompt: "Why do some sand dunes slowly move across the desert?"
        options: ["Wind keeps blowing sand off one side and dropping it on the other", "Animals push them", "Rivers carry them", "Earthquakes shake them"]
        answer: "Wind keeps blowing sand off one side and dropping it on the other"
        difficulty: 3
        hints: ["Which side of a dune faces the wind?", "Where does the sand land after it blows over the top?"]
        solution: "Step 1: Wind lifts sand up the windward slope. Step 2: It drops down the sheltered side. Step 3: Grain by grain the whole dune shifts downwind."
        mistakes: {"Animals push them": dunes_migrate, "Rivers carry them": dunes_migrate, "Earthquakes shake them": dunes_migrate}
      - prompt: "Which pair matches a wind process with the landform it makes?"
        options: ["Abrasion: mushroom rock", "Deposition: deflation hollow", "Deflation: sand dune", "Abrasion: oasis"]
        answer: "Abrasion: mushroom rock"
        difficulty: 3
        hints: ["Abrasion rubs rocks with sand.", "Deflation removes sand; deposition drops it."]
        solution: "Step 1: Abrasion grinds rock near the ground, making mushroom rocks. Step 2: Deflation makes hollows and deposition makes dunes; an oasis comes from water, not wind."
        mistakes: {"Deposition: deflation hollow": process_match, "Deflation: sand dune": process_match, "Abrasion: oasis": process_match}
      - prompt: Long, sword-like linear sand dunes are called
        options:
        - Seif dunes
        - Barchans
        - Parabolic dunes
        - Mushroom rocks
        answer: Seif dunes
        difficulty: 2
        hints:
        - The name is an Arabic word for sword.
        - Barchans are crescent-shaped.
        solution: 'Step 1: Barchans = crescent. Step 2: Parabolic = U-shape. Step 3: Long sword-like = seif.'
        mistakes:
          Barchans: ss15d_dune_shape
      - prompt: U-shaped dunes are
        options:
        - Parabolic dunes
        - Barchans
        - Seif dunes
        - Transverse dunes
        answer: Parabolic dunes
        difficulty: 2
        hints:
        - Think of the shape of a curve from maths.
        - A parabola looks like a U.
        solution: 'Step 1: U-shape resembles a parabola. Step 2: Dunes with that shape are named after it. Step 3: Parabolic dunes.'
        mistakes:
          Barchans: ss15d_dune_shape
      - prompt: Rubbing and wearing of rocks by wind-blown sand is
        options:
        - Abrasion
        - Deflation
        - Deposition
        - Evaporation
        answer: Abrasion
        difficulty: 1
        hints:
        - Like sandpaper on wood.
        - The sand is a tool that scrapes.
        solution: 'Step 1: Deflation removes sand. Step 2: Here sand scrapes rock. Step 3: Abrasion.'
        mistakes:
          Deflation: ss15d_erode_or_drop
      - prompt: Deflation hollows are formed by
        options:
        - Wind erosion
        - Wind deposition
        - River floods
        - Glaciers
        answer: Wind erosion
        difficulty: 2
        hints:
        - A hollow is a dip, where something was removed.
        - Was sand taken away or left behind?
        solution: 'Step 1: Hollows mean sand was removed. Step 2: Removal by wind is erosion. Step 3: Wind erosion.'
        mistakes:
          Wind deposition: ss15d_erode_or_drop
      - prompt: Crops like dates, citrus and wheat grow in an oasis because
        options:
        - There is fresh water from a spring or groundwater
        - It rains every day
        - Wind brings soil
        - It is very cold
        answer: There is fresh water from a spring or groundwater
        difficulty: 1
        hints:
        - What does a desert lack most?
        - An oasis has that one thing.
        solution: 'Step 1: Deserts lack water. Step 2: An oasis has a freshwater source. Step 3: So crops grow.'
        mistakes:
          It rains every day: wet_patches
      - prompt: Wind drops its sand when
        options:
        - It slows down or meets an obstacle
        - It speeds up
        - It reaches the sea only
        - The sun sets
        answer: It slows down or meets an obstacle
        difficulty: 2
        hints:
        - Fast wind can carry sand.
        - What makes wind lose its carrying power?
        solution: 'Step 1: Speed lets wind carry sand. Step 2: Slowing or blocking removes that power. Step 3: Sand is dropped.'
        mistakes:
          It speeds up: ss15d_erode_or_drop
      - prompt: Which landform is made by deposition?
        options:
        - Barchan
        - Mushroom rock
        - Deflation hollow
        - Rock cave
        answer: Barchan
        difficulty: 3
        hints:
        - Deposition builds things up.
        - Three options are carved or hollowed.
        solution: 'Step 1: Mushroom rocks, hollows and caves are erosion. Step 2: A barchan is a pile of sand. Step 3: Barchan.'
        mistakes:
          Mushroom rock: ss15d_erode_or_drop

  - code: ss9.desert.climate_nature
    title: Climate, soil, plants and animals of the Thar
    after: [ss9.desert.regions]
    notes: |
      Summer: very hot and dry, begins in March; day temperatures in Bikaner and Jaisalmer rise from
      40 °C to 45 °C; very low humidity; hot winds called Loo and dust winds; ends by June. Rainy season
      July–September: east of the Aravalis about 76.2 cm a year, the Thar less than 25 cm. Retreating
      monsoon (October–November): little or no rain. Winter: begins in December, mean minimum 5–10 °C,
      clear skies, low humidity, gentle breezes; January is extremely cold; nights below 0 °C in Bikaner,
      Churu and Sikar; ends by February. Soil: desert (arid) soil, sandy and brown, highly saline due to
      evaporation, alkaline; crops possible with irrigation. Vegetation: thorny shrubs, cacti, drought-
      resistant gum arabic acacia and euphorbia. Fauna: camel ('ship of the desert'), reptiles, scorpions,
      mongooses, red foxes, chinkara (Indian gazelle), falcons, Indian spotted eagles, the Indian bustard,
      blackbucks and wild cats.
    explanations:
      text: "The Thar has burning summers with Loo winds, a short weak rainy season and freezing winter nights. Its soil is sandy and salty, and its plants and animals are built to save water."
      visual: "Draw a year as a strip: March–June red (40–45 °C, Loo), July–September a thin blue line (under 25 cm rain), December–February blue-white (below 0 °C at night)."
      step_by_step: "To compare rain across the Aravalis: Step 1: east of the hills, about 76.2 cm. Step 2: the Thar, under 25 cm. Step 3: subtract to see that the east gets more than 50 cm extra."
      real_world: "Camels can go days without drinking, which is why they are called the ship of the desert."
    activity:
      type: scale
      min: -5
      max: 50
      step: 1
      start: 25
      unit: °C
      prompt: A thermometer in the Thar. Slide the temperature.
      zones:
      - from: -5
        to: 0
        label: Below freezing
        says: January nights in Bikaner, Churu and Sikar drop below 0 °C.
      - from: 5
        to: 10
        label: Winter nights
        says: Winter mean minimum is 5–10 °C.
      - from: 40
        to: 45
        label: Summer days
        says: Days in Bikaner and Jaisalmer reach 40–45 °C.
      goals:
      - prompt: A May afternoon in Jaisalmer.
        zone: Summer days
        mistakes:
        - when:
            v:
            - 25
            - 35
          say: 'Warmer than that: Thar summer days reach 40–45 °C.'
        - when:
            v:
            - -5
            - 10
          say: That's winter. Summer begins in March and is very hot.
      - prompt: A January night in Bikaner.
        zone: Below freezing
        mistakes:
        - when:
            v:
            - 40
            - 45
          say: That's a summer day. Deserts have a large difference between day and night.
      - prompt: An ordinary December night in the Thar.
        zone: Winter nights
        mistakes:
        - when:
            v:
            - 40
            - 45
          say: That's a summer day. Winter nights are cold, 5–10 °C.
      orientation: vertical
    lesson:
      - teach: Thar summers (March–June) are very hot and dry; Bikaner and Jaisalmer reach 45 °C, with Loo and dust winds. Rain comes July–September but is under 25 cm in the Thar. Winters (December–February) are cold; nights in Bikaner, Churu and Sikar drop below 0 °C.
        picture:
          kind: flow
          steps:
          - 'March–June: hot, Loo winds'
          - 'July–September: little rain'
          - 'October–November: dry'
          - 'December–February: cold nights'
          alt: Seasons of the Thar.
        check:
          prompt: Which month is extremely cold in the Thar?
          options:
          - January
          - May
          - August
          answer: January
          why: Winter is December–February, coldest in January.
        ways:
        - style: visual
          teach: 'The Thar swings between extremes: March–June scorching, up to 45 °C in Bikaner and Jaisalmer with Loo winds; July–September a little rain, under 25 cm; December–February cold, with nights below 0 °C in Bikaner, Churu and Sikar.'
          picture:
            kind: compare
            alt: Summer March to June very hot up to 45 degrees; monsoon July to September under 25 cm rain; winter December to February nights below zero.
            columns:
            - title: Summer (Mar–Jun)
              points:
              - Up to 45 °C
              - Loo and dust winds
            - title: Rain (Jul–Sep)
              points:
              - Under 25 cm
            - title: Winter (Dec–Feb)
              points:
              - Nights below 0 °C
      - teach: 'Desert soil is sandy, brown, saline and alkaline; crops need irrigation. Plants save water: cacti, thorny shrubs, euphorbia, gum arabic acacia. Animals cope too: the camel (ship of the desert), chinkara, blackbuck, Indian bustard, red fox, reptiles.'
        check:
          prompt: Why do desert plants have spines instead of broad leaves?
          options:
          - To lose less water
          - To catch insects
          - To grow faster
          answer: To lose less water
          why: Small surfaces lose less water to the hot dry air.
        ways:
        - style: real_world
          teach: 'A broad leaf loses water like a wet towel in the sun. Desert plants like cacti have spines instead, and thick stems that store water. Desert animals cope too: the camel, the ship of the desert, plus chinkara, blackbuck and the red fox. The sandy, salty soil needs irrigation for crops.'
    items:
      - prompt: "The hot summer winds of the Thar Desert are called"
        options: ["Loo", "Mango showers", "Kalbaisakhi", "Chinook"]
        answer: "Loo"
        difficulty: 1
        hints: ["They blow in north and northwest India in summer."]
        solution: "Loo."
        mistakes: {"Mango showers": thar_climate}
      - prompt: "Which animal is called the 'ship of the desert'?"
        options: ["Camel", "Chinkara", "Red fox", "Blackbuck"]
        answer: "Camel"
        difficulty: 1
        hints: ["People ride it on desert safaris."]
        solution: "The camel."
        mistakes: {"Chinkara": thar_climate}
      - prompt: "The desert soil of the Thar is"
        options: ["Sandy, brown and highly saline", "Black and rich in clay", "Red due to iron and very wet", "Alluvial and very fertile"]
        answer: "Sandy, brown and highly saline"
        difficulty: 1
        hints: ["High evaporation leaves salt behind."]
        solution: "Arid soil is sandy, brown, saline and alkaline."
        mistakes: {"Alluvial and very fertile": thar_climate}
      - prompt: "In which months is the rainy season in the Thar Desert?"
        options: ["July to September", "March to June", "October to November", "December to February"]
        answer: "July to September"
        difficulty: 2
        hints: ["It is the southwest monsoon period."]
        solution: "July to September."
        mistakes: {"October to November": thar_climate}
      - prompt: "East of the Aravalis gets about 76.2 cm of rain a year and the Thar about 25 cm. How many centimetres more does the east get?"
        answer: "51.2"
        check: "76.2 - 25"
        difficulty: 2
        hints: ["Subtract the smaller from the larger."]
        solution: "76.2 − 25 = 51.2 cm."
        mistakes: {"101.2": thar_climate}
      - prompt: "Summer day temperature in Bikaner rises from 40 °C to 45 °C. By how many degrees does it rise?"
        answer: "5"
        check: "45 - 40"
        difficulty: 1
        hints: ["Subtract."]
        solution: "45 − 40 = 5 °C."
        mistakes: {"85": thar_climate}
      - prompt: "Which is a drought-resistant plant of the Thar Desert?"
        options: ["Euphorbia", "Mangrove", "Teak", "Coconut palm"]
        answer: "Euphorbia"
        difficulty: 2
        hints: ["Gum arabic acacia is another."]
        solution: "Euphorbia, along with gum arabic acacia and cacti."
        mistakes: {"Mangrove": thar_climate}
      - prompt: "Why is the daily range of temperature very high in hot deserts?"
        options: ["Dry air and clear skies let the ground heat fast by day and lose heat fast at night", "The sea keeps it warm at night", "Heavy rain cools the days", "Snow falls every night"]
        answer: "Dry air and clear skies let the ground heat fast by day and lose heat fast at night"
        difficulty: 3
        hints: ["There is little moisture or cloud to hold heat."]
        solution: "Sand heats and cools quickly, and dry clear air cannot trap heat at night."
        mistakes: {"The sea keeps it warm at night": desert_types}
      - prompt: "Many desert plants have thick, fleshy stems and spines instead of broad leaves. Why?"
        options: ["To store water and lose as little as possible", "To grow faster in the shade", "To catch insects", "To float in floods"]
        answer: "To store water and lose as little as possible"
        difficulty: 2
        hints: ["Water is scarce in the desert.", "Broad leaves lose water through their surface."]
        solution: "Step 1: Fleshy stems store water. Step 2: Spines have far less surface than leaves, so little water evaporates."
        mistakes: {"To grow faster in the shade": store_water, "To catch insects": store_water, "To float in floods": store_water}
      - prompt: "Why is the camel so well suited to life in the Thar?"
        options: ["It can go days without water and its wide, padded feet don't sink in sand", "It needs to drink water every hour", "It cannot bear heat", "It eats only fresh grass"]
        answer: "It can go days without water and its wide, padded feet don't sink in sand"
        difficulty: 2
        hints: ["What is scarce in the desert?", "What is the ground like?"]
        solution: "Step 1: Camels survive long periods without water. Step 2: Their broad feet spread their weight on soft sand, so they are called ships of the desert."
        mistakes: {"It needs to drink water every hour": camel_body, "It cannot bear heat": camel_body, "It eats only fresh grass": camel_body}
      - prompt: "Why is the soil of the Thar highly saline?"
        options:
        - "Strong evaporation draws water up and leaves salts at the surface"
        - "Sea water floods it every year"
        - "Heavy rain washes salts in"
        - "Farmers add salt to the fields"
        answer: "Strong evaporation draws water up and leaves salts at the surface"
        difficulty: 3
        hints: ["The Thar is hot with little rain. What does heat do to soil water?", "When water evaporates, what stays behind?"]
        solution: "Step 1: Little rain falls, so salts are not washed down. Step 2: Heat evaporates water from the soil. Step 3: The dissolved salts are left at the surface, making the soil saline."
        mistakes: {"Sea water floods it every year": salt_left_behind, "Heavy rain washes salts in": thar_climate}
      - prompt: The Indian gazelle found in the Thar is called
        options:
