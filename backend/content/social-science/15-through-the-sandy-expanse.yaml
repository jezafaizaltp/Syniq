        difficulty: 3
        hints: ["Gneiss and granite are very old, hard rocks. Where else in India are they found?", "What lies under the sand?"]
        solution: "Step 1: Gneiss, schist and granite are the ancient rocks of the Peninsular Plateau. Step 2: Finding them poking through the sand shows the same rock lies beneath. Step 3: So the Marusthali is an extension of the Plateau."
        mistakes: {"The desert was once under a glacier": thar_formation, "Volcanoes erupt there today": k9_marusthali}
      - prompt: Near which city does the Luni begin, in the Aravalis?
        options:
        - Ajmer
        - Jaisalmer
        - Bikaner
        - Jodhpur
        answer: Ajmer
        difficulty: 2
