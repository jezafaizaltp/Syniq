# Class 9 Social Science II, chapter 7 (stored as Social Science chapter 15). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 2 text supplied by the school.
subject: ss
chapter: 15
title: Through the Sandy Expanse

tips:
  desert_types: "A desert gets less than 25 cm of rain a year. Cold deserts have permanent snow (polar regions, high mountains and plateaus). Hot deserts lie between 15° and 30° latitude on the western margins of continents, very hot by day and cold at night."
  thar_formation: "The Arabian Sea branch of the southwest monsoon runs parallel to the Aravali hills and does not enter interior Rajasthan; the Bay of Bengal branch is blocked by the Aravalis. High evaporation and dry winds add to it, so the Thar gets very little rain."
  thar_regions: "Marusthali (arid plain, desert proper) is in the west: rocky in the east, shifting dunes (Dhrian) in the west, height 200–250 m. Rajasthan Bagar (semi-arid plain) is in the east up to the Aravalis, with seasonal rivers, fertile Rohi patches and salt lakes."
  wind_landforms: "Erosion by wind: deflation (sand blown away) makes deflation hollows and caves; abrasion (sand rubbing rocks) makes mushroom rocks. Deposition by wind makes sand dunes such as barchans."
  thar_climate: "Summer March–June, 40–45 °C in Bikaner and Jaisalmer, hot Loo winds. Rain July–September, under 25 cm in the Thar (about 76.2 cm east of the Aravalis). Winter December–February, nights can go below 0 °C in Bikaner, Churu and Sikar."
  thar_life: "Thar life: crops needing little water (bajra, jowar), the Indira Gandhi Canal from Harike Barrage, pastoralism (about 10% of India's livestock), Makrana marble, leather handicrafts, wind and solar power, tourism."

concepts:
  - code: ss9.desert.deserts_thar
    title: Deserts and the Thar Desert
    notes: |
      Deserts generally get less than 25 cm of rain a year. 'Desert' comes from the Latin 'desertum'
      (abandoned place); the study of deserts is Eremology. Cold deserts: permanent snow and extreme cold,
      in polar regions and high mountains and plateaus. Hot deserts: arid, between 15° and 30° latitude on
      the western margins of continents, very hot days and cold nights (high diurnal range). The Thar or
      Great Indian Desert in northwest India covers about 200,000 sq km, of which 175,000 sq km is in
      India; about two-thirds of the Indian part is in Rajasthan, the rest in Haryana, Punjab and Gujarat;
      it extends into Punjab and Sindh in Pakistan. Boundaries: northwest Sutlej basin, west Indus basin,
      east Aravali mountains, south Rann of Kachchh. Formation: the Arabian Sea branch of the southwest
      monsoon passes parallel to the Aravalis without entering interior Rajasthan; the Bay of Bengal
      branch, blowing east to west along the Himalayas, is checked by the Aravalis; high evaporation and
      dry winds also reduce rain. So it is a rain shadow region for the Bay of Bengal branch.
    explanations:
      text: "A desert is a place with less than 25 cm of rain a year. The Thar formed because both branches of the monsoon fail to bring rain to western Rajasthan, and the Aravali hills play a big part in that."
      visual: "On a map of India, draw the Aravali hills running from northeast to southwest. The Arabian Sea winds slide along them; the Bay of Bengal winds hit them from the east. The land west of the hills stays dry."
      step_by_step: "To explain the Thar's low rain: Step 1: the Arabian Sea branch moves parallel to the Aravalis and does not enter. Step 2: the Bay of Bengal branch is stopped by the Aravalis. Step 3: high evaporation and dry winds lower rain further."
      real_world: "Benyamin's novel 'Goat Days' (Aadujeevitham) describes a Keralite stranded in a desert, where sand mountains seemed to move overnight."
    items:
      - prompt: "Deserts generally receive annual rainfall of less than"
        answer: "25"
        check: "25"
        difficulty: 1
        hints: ["Give the answer in centimetres."]
        solution: "Less than 25 cm a year."
        mistakes: {"76.2": desert_types}
      - prompt: "The study of deserts is called"
        options: ["Eremology", "Ecology", "Geology", "Seismology"]
        answer: "Eremology"
        difficulty: 1
        hints: ["It comes from a word for a lonely place."]
        solution: "Eremology."
        mistakes: {"Ecology": desert_types}
      - prompt: "Which mountain range forms the eastern boundary of the Thar Desert?"
        options: ["Aravali", "Western Ghats", "Himalayas", "Vindhya"]
        answer: "Aravali"
        difficulty: 1
        hints: ["It also blocks the Bay of Bengal monsoon branch."]
        solution: "The Aravali mountains."
        mistakes: {"Himalayas": thar_formation}
      - prompt: "Hot deserts are generally found between which latitudes, on the western margins of continents?"
        options: ["15° and 30°", "0° and 10°", "40° and 60°", "60° and 90°"]
        answer: "15° and 30°"
        difficulty: 2
        hints: ["Away from the equator but not near the poles."]
        solution: "Between 15° and 30° latitude."
        mistakes: {"60° and 90°": desert_types}
      - prompt: "What is the southern boundary of the Thar Desert?"
        options: ["Rann of Kachchh", "Sutlej River basin", "Indus River basin", "Aravali mountains"]
        answer: "Rann of Kachchh"
        difficulty: 2
        hints: ["The Luni river disappears into it."]
        solution: "The Rann of Kachchh. Northwest: Sutlej basin; west: Indus basin; east: Aravalis."
        mistakes: {"Aravali mountains": thar_formation}
      - prompt: "About how much of the Thar Desert's 200,000 sq km lies in India (sq km)?"
        answer: "175000"
        check: "175000"
        difficulty: 2
        hints: ["The rest is in Pakistan."]
        solution: "About 175,000 sq km."
        mistakes: {"200000": thar_formation}
      - prompt: "If 175,000 sq km of the Thar is in India, how many sq km are outside India?"
        answer: "25000"
        check: "200000 - 175000"
        difficulty: 2
        hints: ["The whole desert is about 200,000 sq km."]
        solution: "200,000 − 175,000 = 25,000 sq km, in Pakistan."
        mistakes: {"175000": thar_formation}
      - prompt: "For which branch of the southwest monsoon is the Thar Desert a rain shadow region?"
        options: ["The Bay of Bengal branch, checked by the Aravalis", "The Arabian Sea branch, blocked by the Western Ghats", "The northeast monsoon", "No branch; it gets heavy rain"]
        answer: "The Bay of Bengal branch, checked by the Aravalis"
        difficulty: 3
        hints: ["Which branch is stopped by the Aravali hills?"]
        solution: "The Bay of Bengal branch is blocked by the Aravalis; the Arabian Sea branch runs parallel to them without entering."
        mistakes: {"The Arabian Sea branch, blocked by the Western Ghats": thar_formation}

  - code: ss9.desert.regions
    title: Marusthali, Rajasthan Bagar, Luni and salt lakes
    after: [ss9.desert.deserts_thar]
    notes: |
      The Thar has two regions. Marusthali (arid plain, desert proper): vast sandy expanse with outcrops
      of gneiss, schist and granite, showing it is a northwestern extension of the Peninsular Plateau;
      average height 200–250 m above mean sea level; eastern part rocky, western part covered by shifting
      dunes called Dhrian. Rajasthan Bagar (semi-arid plain): eastern part up to the Aravalis, drained by
      short seasonal rivers from the Aravalis that allow farming in fertile patches called Rohi. The Luni,
      the most significant river, is seasonal (non-perennial), rises in the Aravalis near Ajmer, has
      tributaries Lilri, Sukri and Jawai, takes its name from Sanskrit 'Lavanavari' (salt river), and
      after about 482 km disappears into the Rann of Kachchh. The sandy plain north of the Luni is Thali.
      Salt lakes: Sambhar (largest, about 65 km west of Jaipur, about 225 sq km in the rainy season),
      Didwana, Sargol, Khatu; used for salt production.
    explanations:
      text: "The west of the Thar (Marusthali) is true desert with moving dunes. The east (Rajasthan Bagar) is semi-arid, with seasonal rivers, some farmland and salt lakes."
      visual: "Picture the Thar split by a line: on the west, rolling sand dunes; on the east, near the Aravalis, small green fields along the Luni river and white salt pans at Sambhar Lake."
      step_by_step: "To place a feature: Step 1: is it shifting dunes or bare rock with granite? Marusthali. Step 2: is it a seasonal river, Rohi farmland or a salt lake? Rajasthan Bagar."
      real_world: "Much of the salt used in north India comes from salt pans like those at Sambhar Lake."
    items:
      - prompt: "Which part of the Thar is called the desert proper?"
        options: ["Marusthali", "Rajasthan Bagar", "Rohi", "Thali"]
        answer: "Marusthali"
        difficulty: 1
        hints: ["It is the arid plain in the west."]
        solution: "Marusthali."
        mistakes: {"Rajasthan Bagar": thar_regions}
      - prompt: "Shifting sand dunes in western Marusthali are locally called"
        options: ["Dhrian", "Rohi", "Thali", "Bagar"]
        answer: "Dhrian"
        difficulty: 2
        hints: ["Rohi are fertile patches."]
        solution: "Dhrian."
        mistakes: {"Rohi": thar_regions}
      - prompt: "The largest salt lake in the Rajasthan Bagar region is"
        options: ["Sambhar Lake", "Didwana Lake", "Chilika Lake", "Dal Lake"]
        answer: "Sambhar Lake"
        difficulty: 1
        hints: ["It is about 65 km west of Jaipur."]
        solution: "Sambhar Lake."
        mistakes: {"Chilika Lake": thar_regions}
      - prompt: "The River Luni flows into"
        options: ["The Rann of Kachchh", "The Arabian Sea at Mumbai", "The Bay of Bengal", "Sambhar Lake"]
        answer: "The Rann of Kachchh"
        difficulty: 1
        hints: ["It disappears after about 482 km."]
        solution: "It disappears into the Rann of Kachchh."
        mistakes: {"Sambhar Lake": thar_regions}
      - prompt: "The name Luni comes from the Sanskrit word 'Lavanavari'. What does it mean?"
        options: ["Salt river", "Sweet river", "Long river", "Sand river"]
        answer: "Salt river"
        difficulty: 2
        hints: ["'Lavana' means salt."]
        solution: "Salt river."
        mistakes: {"Sand river": thar_regions}
      - prompt: "Granite, gneiss and schist outcrops in Marusthali show that, geologically, it is an extension of"
        options: ["The Peninsular Plateau", "The Himalayas", "The Northern Plains", "The coastal plains"]
        answer: "The Peninsular Plateau"
        difficulty: 2
        hints: ["Its northwestern extension."]
        solution: "It is the northwestern extension of the Peninsular Plateau."
        mistakes: {"The Himalayas": thar_regions}
      - prompt: "The fertile tracts in the Rajasthan Bagar where farming is possible are called"
        options: ["Rohi", "Dhrian", "Loo", "Thali"]
        answer: "Rohi"
        difficulty: 2
        hints: ["Seasonal rivers from the Aravalis water them."]
        solution: "Rohi."
        mistakes: {"Thali": thar_regions}

  - code: ss9.desert.landforms
    title: Desert landforms made by wind
    after: [ss9.desert.deserts_thar]
    notes: |
      In hot deserts strong winds and whirlwinds lift and move sand. Erosion: deflation is the blowing
      away of sand by wind; persistent winds in one direction make shallow depressions called deflation
      hollows, and continuous deflation forms caves in rocks. Abrasion is wind-borne sand rubbing and
      wearing rock outcrops; since wind lifts particles only up to a certain height, rocks wear most near
      the bottom, forming mushroom rocks. Deposition: when wind slows or is checked, sand is deposited and
      piles into sand dunes, loose mounds of sand. Types in the Thar: barchans (crescent-shaped),
      parabolic dunes, seif (linear) dunes, longitudinal dunes, transverse dunes. Dune location changes
      with wind direction and speed. Oases are fertile patches around a freshwater source (springs or
      groundwater), where cotton, citrus, fruits, wheat and corn are grown.
    explanations:
      text: "Wind shapes the desert two ways. It cuts away rock and sand (erosion), making hollows, caves and mushroom rocks. It also drops sand (deposition), building dunes."
      visual: "A mushroom rock: sand flying low keeps grinding the bottom of a rock, so the base becomes thin and the top stays wide, like a mushroom."
      step_by_step: "To name the process: Step 1: was sand removed from a place? Deflation. Step 2: was rock worn by flying sand? Abrasion. Step 3: was sand piled up? Deposition (dunes)."
      real_world: "On a windy beach you can watch small ripples and heaps of sand form: tiny versions of desert dunes."
    items:
      - prompt: "Sand dunes are formed by wind through"
        options: ["Deposition", "Abrasion", "Deflation", "Weathering by rivers"]
        answer: "Deposition"
        difficulty: 1
        hints: ["Sand drops when wind slows down."]
        solution: "Deposition."
        mistakes: {"Abrasion": wind_landforms}
      - prompt: "Mushroom rocks are formed mainly by"
        options: ["Abrasion", "Deposition", "Volcanic eruption", "River erosion"]
        answer: "Abrasion"
        difficulty: 1
        hints: ["Flying sand wears the lower part of the rock."]
        solution: "Abrasion."
        mistakes: {"Deposition": wind_landforms}
      - prompt: "Crescent-shaped sand dunes are called"
        options: ["Barchans", "Seif dunes", "Transverse dunes", "Oases"]
        answer: "Barchans"
        difficulty: 2
        hints: ["Their shape is like a new moon."]
        solution: "Barchans."
        mistakes: {"Seif dunes": wind_landforms}
      - prompt: "Shallow depressions formed when sand is blown away by steady winds are"
        options: ["Deflation hollows", "Sand dunes", "Mushroom rocks", "Salt lakes"]
        answer: "Deflation hollows"
        difficulty: 2
        hints: ["The process is called deflation."]
        solution: "Deflation hollows."
        mistakes: {"Sand dunes": wind_landforms}
      - prompt: "An oasis is formed because of"
        options: ["A freshwater source such as a spring or groundwater", "Heavy monsoon rain", "A salt lake", "Strong winds"]
        answer: "A freshwater source such as a spring or groundwater"
        difficulty: 1
        hints: ["It is a fertile patch in a desert."]
        solution: "A freshwater source."
        mistakes: {"A salt lake": wind_landforms}
      - prompt: "Why are mushroom rocks narrow at the bottom?"
        options: ["Wind lifts sand only to a limited height, so abrasion is strongest near the base", "Rain falls only on the bottom", "Animals dig at the base", "The top is made of a weaker rock"]
        answer: "Wind lifts sand only to a limited height, so abrasion is strongest near the base"
        difficulty: 3
        hints: ["How high can wind carry sand grains?"]
        solution: "Most sand moves near the ground, so the lower part wears away faster."
        mistakes: {"Rain falls only on the bottom": wind_landforms}

  - code: ss9.desert.climate_nature
    title: Climate, soil, plants and animals of the Thar
    after: [ss9.desert.regions]
    notes: |
      Summer: very hot and dry, begins in March; day temperatures in Bikaner and Jaisalmer rise from
      40 °C to 45 °C; very low humidity; hot winds called Loo and dust winds; ends by June. Rainy season
      July–September: east of the Aravalis about 76.2 cm a year, the Thar less than 25 cm. Retreating
      monsoon (October–November): little or no rain. Winter: begins in December, mean minimum 5–10 °C,
      clear skies, low humidity, gentle breezes; January is extremely cold; nights below 0 °C in Bikaner,
      Churu and Sikar; ends by February. Soil: desert (arid) soil, sandy and brown, highly saline due to
      evaporation, alkaline; crops possible with irrigation. Vegetation: thorny shrubs, cacti, drought-
      resistant gum arabic acacia and euphorbia. Fauna: camel ('ship of the desert'), reptiles, scorpions,
      mongooses, red foxes, chinkara (Indian gazelle), falcons, Indian spotted eagles, the Indian bustard,
      blackbucks and wild cats.
    explanations:
      text: "The Thar has burning summers with Loo winds, a short weak rainy season and freezing winter nights. Its soil is sandy and salty, and its plants and animals are built to save water."
      visual: "Draw a year as a strip: March–June red (40–45 °C, Loo), July–September a thin blue line (under 25 cm rain), December–February blue-white (below 0 °C at night)."
      step_by_step: "To compare rain across the Aravalis: Step 1: east of the hills, about 76.2 cm. Step 2: the Thar, under 25 cm. Step 3: subtract to see that the east gets more than 50 cm extra."
      real_world: "Camels can go days without drinking, which is why they are called the ship of the desert."
    items:
      - prompt: "The hot summer winds of the Thar Desert are called"
        options: ["Loo", "Mango showers", "Kalbaisakhi", "Chinook"]
        answer: "Loo"
        difficulty: 1
        hints: ["They blow in north and northwest India in summer."]
        solution: "Loo."
        mistakes: {"Mango showers": thar_climate}
      - prompt: "Which animal is called the 'ship of the desert'?"
        options: ["Camel", "Chinkara", "Red fox", "Blackbuck"]
        answer: "Camel"
        difficulty: 1
        hints: ["People ride it on desert safaris."]
        solution: "The camel."
        mistakes: {"Chinkara": thar_climate}
      - prompt: "The desert soil of the Thar is"
        options: ["Sandy, brown and highly saline", "Black and rich in clay", "Red due to iron and very wet", "Alluvial and very fertile"]
        answer: "Sandy, brown and highly saline"
        difficulty: 1
        hints: ["High evaporation leaves salt behind."]
        solution: "Arid soil is sandy, brown, saline and alkaline."
        mistakes: {"Alluvial and very fertile": thar_climate}
      - prompt: "In which months is the rainy season in the Thar Desert?"
        options: ["July to September", "March to June", "October to November", "December to February"]
        answer: "July to September"
        difficulty: 2
        hints: ["It is the southwest monsoon period."]
        solution: "July to September."
        mistakes: {"October to November": thar_climate}
      - prompt: "East of the Aravalis gets about 76.2 cm of rain a year and the Thar about 25 cm. How many centimetres more does the east get?"
        answer: "51.2"
        check: "76.2 - 25"
        difficulty: 2
        hints: ["Subtract the smaller from the larger."]
        solution: "76.2 − 25 = 51.2 cm."
        mistakes: {"101.2": thar_climate}
      - prompt: "Summer day temperature in Bikaner rises from 40 °C to 45 °C. By how many degrees does it rise?"
        answer: "5"
        check: "45 - 40"
        difficulty: 1
        hints: ["Subtract."]
        solution: "45 − 40 = 5 °C."
        mistakes: {"85": thar_climate}
      - prompt: "Which is a drought-resistant plant of the Thar Desert?"
        options: ["Euphorbia", "Mangrove", "Teak", "Coconut palm"]
        answer: "Euphorbia"
        difficulty: 2
        hints: ["Gum arabic acacia is another."]
        solution: "Euphorbia, along with gum arabic acacia and cacti."
        mistakes: {"Mangrove": thar_climate}
      - prompt: "Why is the daily range of temperature very high in hot deserts?"
        options: ["Dry air and clear skies let the ground heat fast by day and lose heat fast at night", "The sea keeps it warm at night", "Heavy rain cools the days", "Snow falls every night"]
        answer: "Dry air and clear skies let the ground heat fast by day and lose heat fast at night"
        difficulty: 3
        hints: ["There is little moisture or cloud to hold heat."]
        solution: "Sand heats and cools quickly, and dry clear air cannot trap heat at night."
        mistakes: {"The sea keeps it warm at night": desert_types}

  - code: ss9.desert.human_life
    title: Human life in the Thar
    after: [ss9.desert.climate_nature]
    notes: |
      The Thar is sparsely populated; most people live in villages; in severe drought groups migrate as
      nomads. Agriculture: crops needing little water, and commercial farming with irrigation: bajra,
      jowar, wheat, corn, millets, groundnut, cotton. Indira Gandhi Canal (formerly Rajasthan Canal)
      starts at the Harike Barrage, supplies Sri Ganganagar, Bikaner and Jaisalmer, and gives drinking
      water to eight districts of western Rajasthan; farm output, agro-industries and fodder have
      increased. Pastoralism: Rajasthan has about 10% of India's livestock: goats, buffalo, sheep, cows,
      camels. Mining: world-famous Makrana marble (the Taj Mahal is made of it); also lead, zinc, silver,
      copper, tungsten, manganese, iron, gypsum, lignite, limestone. Handicrafts: leather goods from camel
      hide (lampshades, pouches, sandals) and leather musical instruments. Energy: wind parks (e.g.
      Jaisalmer) and solar panels, used mainly for desalination. Tourism: Hawa Mahal, Ajmer Fort, Dilwara
      and Ranakpur Jain temples, camel safaris. Challenges: up to 50 °C, water scarcity, roads blocked by
      sand winds and melting tar, poor communication.
    explanations:
      text: "Life in the Thar is hard, but people farm with canal water, raise animals, mine marble, make leather crafts, use wind and sun for power, and welcome tourists."
      visual: "Picture a map of western Rajasthan with a long blue line (the Indira Gandhi Canal) bringing water from the Harike Barrage in Punjab to green fields near Bikaner and Jaisalmer."
      step_by_step: "To link a resource to a job: Step 1: canal water → farming and drinking water. Step 2: dry grassland → pastoralism. Step 3: marble and minerals → mining. Step 4: wind and sun → energy. Step 5: forts, temples and dunes → tourism."
      real_world: "Many marble shops in Kerala sell stone brought from Rajasthan, and the Taj Mahal is made of Makrana marble."
    items:
      - prompt: "The Taj Mahal is built of marble from"
        options: ["Makrana", "Jaisalmer", "Ajmer", "Bikaner"]
        answer: "Makrana"
        difficulty: 1
        hints: ["This marble is world-famous."]
        solution: "Makrana marble from Rajasthan."
        mistakes: {"Jaisalmer": thar_life}
      - prompt: "The Indira Gandhi Canal was earlier known as"
        options: ["Rajasthan Canal", "Thar Canal", "Luni Canal", "Aravali Canal"]
        answer: "Rajasthan Canal"
        difficulty: 1
        hints: ["It was renamed after a former Prime Minister."]
        solution: "The Rajasthan Canal."
        mistakes: {"Luni Canal": thar_life}
      - prompt: "From where does the Indira Gandhi Canal begin?"
        options: ["Harike Barrage", "Sambhar Lake", "Bhakra Dam", "Rann of Kachchh"]
        answer: "Harike Barrage"
        difficulty: 2
        hints: ["It is a barrage in Punjab."]
        solution: "The Harike Barrage."
        mistakes: {"Bhakra Dam": thar_life}
      - prompt: "About what percentage of India's livestock is in Rajasthan?"
        answer: "10"
        check: "10"
        difficulty: 2
        hints: ["Many desert people rear animals because farming is limited."]
        solution: "About 10 percent."
        mistakes: {"50": thar_life}
      - prompt: "Which crop is commonly grown in the Thar because it needs little water?"
        options: ["Bajra", "Rice", "Rubber", "Tea"]
        answer: "Bajra"
        difficulty: 1
        hints: ["It is a millet."]
        solution: "Bajra (and jowar, millets)."
        mistakes: {"Rice": thar_life}
      - prompt: "Electricity from Thar wind parks and solar panels is mainly used for"
        options: ["Desalination of water", "Running ships", "Melting snow", "Making marble"]
        answer: "Desalination of water"
        difficulty: 2
        hints: ["Fresh water is scarce in the desert."]
        solution: "Mainly desalination of water."
        mistakes: {"Making marble": thar_life}
      - prompt: "Why are roads hard to maintain in the Thar Desert?"
        options: ["Sand-carrying winds cover roads and extreme heat melts the tar", "Heavy snowfall", "Floods every month", "There are no vehicles"]
        answer: "Sand-carrying winds cover roads and extreme heat melts the tar"
        difficulty: 2
        hints: ["Think of wind and heat."]
        solution: "Strong winds blow sand across roads and the heat melts tar."
        mistakes: {"Floods every month": thar_life}
