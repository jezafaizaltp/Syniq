    lesson:
      - teach: Few people live in the Thar, mostly in villages; in droughts some move as nomads. They grow bajra, jowar, millets and, with irrigation, wheat and cotton. The Indira Gandhi Canal, from the Harike Barrage in Punjab, brings water to Sri Ganganagar, Bikaner and Jaisalmer.
        picture:
          kind: flow
