          teach: 'Step 1: water is scarce, so few people live in the Thar, mostly in villages. Step 2: they grow crops that need little water: bajra, jowar and millets. Step 3: the Indira Gandhi Canal, from the Harike Barrage in Punjab, brings water to Sri Ganganagar, Bikaner and Jaisalmer. Step 4: there, wheat and cotton can grow too.'
      - teach: People rear goats, sheep, camels and cattle (Rajasthan has about 10% of India's livestock). Mining gives Makrana marble (used in the Taj Mahal), zinc, lead, copper, gypsum. Crafts use camel leather. Wind and solar parks power desalination. Tourists visit Hawa Mahal and go on camel safaris. Heat up to 50 °C and water shortage are big challenges.
        check:
