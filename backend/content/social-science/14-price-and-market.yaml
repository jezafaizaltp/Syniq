# Class 9 Social Science II, chapter 6 (stored as Social Science chapter 14). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 2 text supplied by the school.
subject: ss
chapter: 14
title: Price and Market

tips:
  needs_wants: "Basic needs (air, food, water, clothing, shelter) are essential to live. Wants make life happier but are not needed to survive."
  input_output: "Inputs are the things used in production (land, labour, machines, fuel, buildings, organisation). Outputs are the goods produced. Turning inputs into outputs is production."
  fixed_variable: "Fixed inputs cannot be changed in a short time (land, organisation). Variable inputs can (labour, capital). Short run: at least one input is fixed. Long run: all inputs are variable."
  sustainable: "Sustainable development meets the needs of the present without compromising the ability of future generations to meet their own needs (Brundtland Commission). The UN's 17 SDGs were announced in 2015, to be reached by 2030; goal 12 is responsible consumption and production."
  demand_law: "Demand is desire backed by willingness and ability to pay. When price rises, quantity demanded falls; the demand curve slopes downward (inverse relationship)."
  supply_law: "Supply is the quantity ready for sale at a given price in a given period. When price rises, quantity supplied rises; the supply curve slopes upward (direct relationship)."
  equilibrium: "Equilibrium price is the price at which quantity demanded equals quantity supplied. Demand more than supply pushes price up; supply more than demand pushes price down."
  price_control: "Government price control: fixing highest and lowest prices, public distribution (ration shops, Supplyco), and Minimum Support Price for farm products such as paddy, coconut and rubber."

concepts:
  - code: ss9.market.production
    title: Needs, inputs and the production function
    notes: |
      Basic or primary needs (air, food, water, clothing, shelter) are essential for life; wants help
      achieve life's aspirations but are not essential for survival. Producers recognise needs and
      produce goods and services. Factors used in production (raw materials like bamboo and wood pulp,
      machines, fuel, buildings, land, labour, organisation) are inputs; goods produced are outputs;
      converting inputs into outputs is production. Output can be increased by more inputs, better
      technology or higher productivity. Production function: the technical relationship between inputs
      and output in a given period, Q = f(N, L, K, O), where N land, L labour, K capital (technology,
      buildings, tools, financial capital), O organisation. Fixed inputs cannot be changed in the short
      period (land, organisation); variable inputs can (labour, capital). Short-run production function:
      at least one input is fixed. Long-run: all inputs are variable.
    explanations:
      text: "Production means turning inputs into outputs. The production function says output depends on land, labour, capital and organisation. In a short time you can hire more workers, but you cannot quickly get more land."
      visual: "A notebook factory: bamboo and wood pulp, machines, fuel, a building, land and workers go in (inputs); notebooks come out (output)."
      step_by_step: "To tell fixed from variable: Step 1: ask whether the input can be increased within a few weeks. Step 2: if yes (more workers, more machines), it is variable. Step 3: if no (more land, a new management system), it is fixed."
      real_world: "A tea shop owner can add one more helper during festival season (variable input), but cannot quickly make the shop bigger (fixed input)."
    items:
      - prompt: "Which of these is a basic need?"
        options: ["Food", "A motorbike", "A smartphone game", "A holiday trip"]
        answer: "Food"
        difficulty: 1
        hints: ["Basic needs are essential to stay alive."]
        solution: "Food is a basic need; the others are wants."
        mistakes: {"A motorbike": needs_wants}
      - prompt: "Things like land, labour, machines and fuel used to make a product are called"
        options: ["Inputs", "Outputs", "Wants", "Markets"]
        answer: "Inputs"
        difficulty: 1
        hints: ["They go into the production process."]
        solution: "They are inputs; the product made is the output."
        mistakes: {"Outputs": input_output}
      - prompt: "The process of converting inputs into outputs is called"
        options: ["Production", "Consumption", "Distribution", "Demand"]
        answer: "Production"
        difficulty: 1
        hints: ["All products we use are made this way."]
        solution: "Production."
        mistakes: {"Consumption": input_output}
      - prompt: "In the production function Q = f(N, L, K, O), what does K stand for?"
        options: ["Capital", "Knowledge", "Land", "Kind of product"]
        answer: "Capital"
        difficulty: 2
        hints: ["N is land, L is labour, O is organisation."]
        solution: "K is capital: technology, buildings, tools and financial capital."
        mistakes: {"Land": input_output}
      - prompt: "Which of these is a fixed input in the short run?"
        options: ["Land", "Labour", "Raw materials", "Fuel"]
        answer: "Land"
        difficulty: 2
        hints: ["It cannot be increased within a short period."]
        solution: "Land (and organisation) are fixed inputs."
        mistakes: {"Labour": fixed_variable}
      - prompt: "A production situation where all inputs can be changed is called"
        options: ["Long-run production function", "Short-run production function", "Fixed production", "Equilibrium"]
        answer: "Long-run production function"
        difficulty: 2
        hints: ["In the short run at least one input is fixed."]
        solution: "When all inputs are variable it is the long run."
        mistakes: {"Short-run production function": fixed_variable}
      - prompt: "A notebook maker hires 10 more workers to meet a rush of orders but keeps the same factory land. Which is true?"
        options: ["Labour is variable, land is fixed; this is the short run", "Both are fixed; this is the long run", "Land is variable; this is the long run", "Labour is fixed; this is the short run"]
        answer: "Labour is variable, land is fixed; this is the short run"
        difficulty: 3
        hints: ["Which input changed and which stayed the same?"]
        solution: "Labour changed, land did not. With one input fixed, it is the short run."
        mistakes: {"Both are fixed; this is the long run": fixed_variable}

  - code: ss9.market.consumption
    title: Consumption and sustainable development
    after: [ss9.market.production]
    notes: |
      Buying and using goods and services to fulfil needs is consumption. A consumer buys and uses goods
      and services by paying or agreeing to pay. Financial capacity is the main factor influencing
      consumption; others include tastes and preferences, climate and environmental awareness. The
      consumption pattern shows how a family spends its income on food, clothes, shelter, transport,
      health, education and entertainment. Unlimited wants and limited resources are the major challenge.
      Sustainable consumption minimises environmental impact; sustainable production uses minimum
      natural resources, saves energy, maximises renewability and recycling, and keeps workers safe. UN
      SDG 12: responsible consumption and production. Gandhi: "Earth has enough resources for everybody's
      needs but not for anybody's greed." Sustainable development (Brundtland Commission): development
      that meets the needs of the present without compromising the ability of future generations to meet
      their own needs. 17 SDGs announced in 2015, to be achieved by 2030.
    explanations:
      text: "Consumption is using goods and services. Sustainable consumption and production means using resources carefully so that people in the future also have enough."
      visual: "Think of a well shared by a village. If everyone draws only what they need, it lasts for years. If some waste water, it dries up for the next generation."
      step_by_step: "To judge whether a habit is sustainable: Step 1: does it waste resources? Step 2: can the thing be reused or recycled? Step 3: does it harm the environment? Fewer harms means more sustainable."
      real_world: "Carrying a cloth bag to the shop instead of taking new plastic covers is sustainable consumption."
    items:
      - prompt: "Buying and using goods and services to fulfil needs is called"
        options: ["Consumption", "Production", "Supply", "Marketing"]
        answer: "Consumption"
        difficulty: 1
        hints: ["The person who does it is a consumer."]
        solution: "Consumption."
        mistakes: {"Production": input_output}
      - prompt: "According to the textbook, what is the main factor influencing consumption?"
        options: ["Financial capacity of the consumer", "Climate only", "The colour of the product", "The number of shops"]
        answer: "Financial capacity of the consumer"
        difficulty: 1
        hints: ["You can only buy what you can pay for."]
        solution: "Financial capacity (income) is the main factor."
        mistakes: {"Climate only": needs_wants}
      - prompt: "How many Sustainable Development Goals did the United Nations set?"
        answer: "17"
        check: "17"
        difficulty: 1
        hints: ["Goal 12 is responsible consumption and production."]
        solution: "17 goals, announced in 2015."
        mistakes: {"12": sustainable}
      - prompt: "By which year does the UN aim to achieve the Sustainable Development Goals?"
        answer: "2030"
        check: "2030"
        difficulty: 2
        hints: ["They were announced in 2015."]
        solution: "2030."
        mistakes: {"2015": sustainable}
      - prompt: "Which SDG is about responsible consumption and production?"
        answer: "12"
        check: "12"
        difficulty: 2
        hints: ["It is the twelfth goal."]
        solution: "Goal 12."
        mistakes: {"17": sustainable}
      - prompt: "Who said, \"Earth has enough resources for everybody's needs but not for anybody's greed\"?"
        options: ["Mahatma Gandhi", "Jawaharlal Nehru", "B. R. Ambedkar", "Rabindranath Tagore"]
        answer: "Mahatma Gandhi"
        difficulty: 2
        hints: ["The Father of the Nation."]
        solution: "Mahatma Gandhi."
        mistakes: {"Jawaharlal Nehru": sustainable}
      - prompt: "Sustainable development means"
        options: ["Meeting present needs without harming the ability of future generations to meet theirs", "Using all resources now for fast growth", "Stopping all development", "Development only in cities"]
        answer: "Meeting present needs without harming the ability of future generations to meet theirs"
        difficulty: 2
        hints: ["The definition came from the Brundtland Commission."]
        solution: "It balances present needs with those of future generations."
        mistakes: {"Using all resources now for fast growth": sustainable}
      - prompt: "Which is an aim of sustainable production?"
        options: ["Maximum energy conservation and a safe workplace", "Producing as much as possible whatever the waste", "Using only non-renewable resources", "Ignoring recycling"]
        answer: "Maximum energy conservation and a safe workplace"
        difficulty: 3
        hints: ["Minimum misuse of natural resources is its primary goal."]
        solution: "Saving energy and keeping workers safe are among its aims."
        mistakes: {"Producing as much as possible whatever the waste": sustainable}

  - code: ss9.market.demand_supply
    title: Market, demand and supply
    after: [ss9.market.consumption]
    notes: |
      Consumers depend on producers and producers depend on consumers; the market links them. Marketing
      delivers goods to consumers directly or through sellers. A market has buyers and sellers, price is
      determined, both sides are equally important, there is choice, and marketing techniques are used.
      Demand: the desire for a commodity backed by willingness and ability to pay. Demand schedule (Table
      6.1): price ₹5, 10, 15, 20, 25 → quantity demanded 50, 40, 30, 20, 10 kg. Demand curve DD slopes
      downward from left to right: inverse relationship between price and quantity demanded. Supply: the
      quantity ready to be sold at a given price in a specific period. Supply schedule (Table 6.2): price
      ₹5 to 25 → quantity supplied 10, 20, 30, 40, 50 kg. Supply curve SS slopes upward: direct
      relationship. On both graphs quantity is on the OX axis and price on the OY axis.
    explanations:
      text: "Demand: when price goes up, people buy less. Supply: when price goes up, sellers offer more. So the demand curve goes down and the supply curve goes up."
      visual: "Draw price up the side and quantity along the bottom. Demand runs from top-left down to bottom-right. Supply runs from bottom-left up to top-right."
      step_by_step: "To read a schedule: Step 1: find the price in the left column. Step 2: read the quantity beside it. Step 3: compare two rows to see whether quantity went up or down when price rose."
      real_world: "When mango prices fall in season, families buy more mangoes. When fish prices rise, more boats try to bring fish to market."
    items:
      - prompt: "Demand is desire backed by"
        options: ["Willingness and ability to pay", "Only a wish", "Government orders", "The seller's needs"]
        answer: "Willingness and ability to pay"
        difficulty: 1
        hints: ["Wanting something is not enough."]
        solution: "Demand = desire + willingness to buy + ability to pay."
        mistakes: {"Only a wish": demand_law}
      - prompt: "The demand curve slopes"
        options: ["Downward from left to right", "Upward from left to right", "Straight across", "Straight up"]
        answer: "Downward from left to right"
        difficulty: 1
        hints: ["Higher price, lower quantity demanded."]
        solution: "It slopes downward, showing an inverse relationship."
        mistakes: {"Upward from left to right": demand_law}
      - prompt: "The supply curve shows what relationship between price and quantity supplied?"
        options: ["Direct", "Inverse", "No relationship"]
        answer: "Direct"
        difficulty: 1
        hints: ["Higher price, more is offered for sale."]
        solution: "Direct: both rise together."
        mistakes: {"Inverse": supply_law}
      - prompt: "In Table 6.1, how many kilograms are demanded at ₹5?"
        answer: "50"
        check: "50"
        difficulty: 1
        hints: ["Lowest price, highest demand."]
        solution: "50 kg."
        mistakes: {"10": demand_law}
      - prompt: "In Table 6.1, when the price rises from ₹5 to ₹10, by how many kilograms does quantity demanded fall?"
        answer: "10"
        check: "50 - 40"
        difficulty: 2
        hints: ["At ₹5 it is 50 kg; at ₹10 it is 40 kg."]
        solution: "50 − 40 = 10 kg less."
        mistakes: {"40": demand_law}
      - prompt: "In Table 6.2, how many kilograms are supplied at ₹25?"
        answer: "50"
        check: "50"
        difficulty: 2
        hints: ["Highest price, highest supply."]
        solution: "50 kg."
        mistakes: {"10": supply_law}
      - prompt: "On the demand and supply graphs in the textbook, what is shown on the OY axis?"
        options: ["Price of the product", "Quantity of the product", "Time", "Number of buyers"]
        answer: "Price of the product"
        difficulty: 2
        hints: ["Quantity is on the OX axis."]
        solution: "Price is on the OY (vertical) axis."
        mistakes: {"Quantity of the product": demand_law}
      - prompt: "In Table 6.2, from ₹5 to ₹25 how many kilograms does supply increase in total?"
        answer: "40"
        check: "50 - 10"
        difficulty: 2
        hints: ["Supply at ₹5 is 10 kg and at ₹25 is 50 kg."]
        solution: "50 − 10 = 40 kg."
        mistakes: {"50": supply_law}
      - prompt: "Which is a general characteristic of a market?"
        options: ["There are buyers and sellers and the price is determined", "There are only sellers", "Prices never change", "Buyers have no choice"]
        answer: "There are buyers and sellers and the price is determined"
        difficulty: 1
        hints: ["Both buyers and sellers are equally important."]
        solution: "A market has buyers, sellers, price determination, choice and marketing techniques."
        mistakes: {"There are only sellers": demand_law}

  - code: ss9.market.equilibrium
    title: Equilibrium price
    after: [ss9.market.demand_supply]
    notes: |
      The price of a product is determined by the forces of demand and supply. Table 6.3 combines the
      schedules: at ₹5 demand 50, supply 10 (demand > supply); ₹10: 40, 20; ₹15: 30, 30 (demand =
      supply); ₹20: 20, 40; ₹25: 10, 50 (demand < supply). Equilibrium is the condition where demand
      equals supply; the price is the equilibrium price (₹15) and the quantity the equilibrium quantity
      (30 kg), at point E where DD and SS intersect. Disequilibrium: demand and supply not equal. If demand
      falls and supply rises, price falls; if demand rises and supply falls, price rises. When demand
      exceeds supply, producers raise prices; this lowers purchasing power, forcing prices down, and the
      market returns to equilibrium.
    explanations:
      text: "Equilibrium is where the amount people want to buy equals the amount sellers want to sell. On the graph it is where the two curves cross."
      visual: "Picture the downward demand line and the upward supply line forming an X. The crossing point E gives the equilibrium price on the side and the quantity at the bottom."
      step_by_step: "To find equilibrium in a table: Step 1: go row by row. Step 2: compare quantity demanded with quantity supplied. Step 3: the row where they are equal gives the equilibrium price and quantity."
      real_world: "At the start of Onam, demand for flowers jumps and prices shoot up. After the festival demand falls, there are too many flowers, and prices drop."
    items:
      - prompt: "The price at which demand and supply are equal is called"
        options: ["Equilibrium price", "Support price", "Discount price", "Maximum price"]
        answer: "Equilibrium price"
        difficulty: 1
        hints: ["It is at the point where the curves meet."]
        solution: "Equilibrium price."
        mistakes: {"Support price": equilibrium}
      - prompt: "In Table 6.3, what is the equilibrium price in rupees?"
        answer: "15"
        check: "15"
        difficulty: 1
        hints: ["Find the row where demand = supply."]
        solution: "At ₹15 demand and supply are both 30 kg."
        mistakes: {"30": equilibrium}
      - prompt: "In Table 6.3, what is the equilibrium quantity in kilograms?"
        answer: "30"
        check: "30"
        difficulty: 2
        hints: ["At ₹15, both columns show the same number."]
        solution: "30 kg."
        mistakes: {"15": equilibrium}
      - prompt: "At ₹10 in Table 6.3, demand is 40 kg and supply is 20 kg. What is the shortage in kilograms?"
        answer: "20"
        check: "40 - 20"
        difficulty: 2
        hints: ["Shortage = demand − supply."]
        solution: "40 − 20 = 20 kg more is demanded than supplied."
        mistakes: {"60": equilibrium}
      - prompt: "At ₹25 in Table 6.3, demand is 10 kg and supply is 50 kg. What is the surplus in kilograms?"
        answer: "40"
        check: "50 - 10"
        difficulty: 2
        hints: ["Surplus = supply − demand."]
        solution: "50 − 10 = 40 kg is left unsold."
        mistakes: {"60": equilibrium}
      - prompt: "A situation where demand and supply are not equal is called"
        options: ["Disequilibrium", "Equilibrium", "Production function", "Price control"]
        answer: "Disequilibrium"
        difficulty: 1
        hints: ["The opposite of equilibrium."]
        solution: "Disequilibrium."
        mistakes: {"Equilibrium": equilibrium}
      - prompt: "Demand for a product falls and supply rises. What happens to its price?"
        options: ["It decreases", "It increases", "It stays the same"]
        answer: "It decreases"
        difficulty: 2
        hints: ["There is more of it than people want."]
        solution: "Too much supply and too little demand push the price down."
        mistakes: {"It increases": equilibrium}
      - prompt: "When demand is more than supply, producers raise prices. Why does the market still come back to equilibrium?"
        options: ["Higher prices reduce consumers' purchasing power, so producers must lower prices again", "The government always fixes the price", "Consumers stop buying everything forever", "Supply falls to zero"]
        answer: "Higher prices reduce consumers' purchasing power, so producers must lower prices again"
        difficulty: 3
        hints: ["Think about what consumers do when prices go too high."]
        solution: "Buyers cut purchases, sellers lower prices, and a price acceptable to both is reached."
        mistakes: {"The government always fixes the price": equilibrium}

  - code: ss9.market.techniques_control
    title: Marketing techniques, price control and digital marketing
    after: [ss9.market.equilibrium]
    notes: |
      Marketing technique: a plan to reach sales targets by understanding customers' needs, e.g.
      discounts, rebates, e-commerce and online stores, selling quality products. New technology and tough
      competition push producers to innovate and reduce costs. Price control: rising prices of essential
      goods hurt living standards, so government fixes highest and lowest prices to protect both producers
      and consumers. The public distribution system sells essential goods in limited quantity below market
      price; in Kerala: Public Distribution Centres, Fair Price Shops and Supplyco. Minimum Support Price:
      the minimum price fixed by government for agricultural products (rubber, coconut, paddy) so farmers
      do not lose when market prices fall below cost; government also buys and stores produce directly; a
      safety net for farmers. Digital marketing: marketing through digital channels using IT; the term was
      first used in the 1990s; also called online, web or internet marketing. Features: uses the internet,
      no need to visit the market, products from anywhere in the world, saves time, many products, new jobs.
    explanations:
      text: "Sellers use offers and online shops to attract buyers. The government steps in to keep essential goods affordable and to protect farmers with a minimum price."
      visual: "Picture a ration shop selling rice below market price on one side, and a paddy farmer receiving a guaranteed price on the other. Both are the government protecting people from bad prices."
      step_by_step: "To spot who is helped: Step 1: is the action about lowering prices for buyers (ration shop, Supplyco)? Consumers are helped. Step 2: is it about guaranteeing a minimum price for sellers (MSP)? Farmers are helped."
      real_world: "During festivals, Supplyco fairs sell essential items at lower prices. Ordering a school bag on a shopping app is digital marketing."
    items:
      - prompt: "Which is a marketing technique?"
        options: ["Discount", "Minimum Support Price", "Production function", "Census"]
        answer: "Discount"
        difficulty: 1
        hints: ["Producers use it to attract customers."]
        solution: "Discounts, rebates and online stores are marketing techniques."
        mistakes: {"Minimum Support Price": price_control}
      - prompt: "The minimum price fixed by the government for agricultural products is called"
        options: ["Minimum Support Price", "Equilibrium price", "Discount price", "Market price"]
        answer: "Minimum Support Price"
        difficulty: 1
        hints: ["It protects farmers from losses."]
        solution: "Minimum Support Price (MSP)."
        mistakes: {"Equilibrium price": price_control}
      - prompt: "Which of these is a Kerala institution that helps control prices of essential goods?"
        options: ["Supplyco", "A private supermarket", "A stock exchange", "A cinema theatre"]
        answer: "Supplyco"
        difficulty: 1
        hints: ["Fair Price Shops and Public Distribution Centres are others."]
        solution: "Supplyco, along with Fair Price Shops and Public Distribution Centres."
        mistakes: {"A private supermarket": price_control}
      - prompt: "The term digital marketing was first used in which decade?"
        options: ["1990s", "1950s", "1970s", "2010s"]
        answer: "1990s"
        difficulty: 2
        hints: ["Around when the internet became public."]
        solution: "The 1990s."
        mistakes: {"2010s": price_control}
      - prompt: "Digital marketing is also called"
        options: ["Online, web or internet marketing", "Barter", "Public distribution", "Wholesale trade"]
        answer: "Online, web or internet marketing"
        difficulty: 2
        hints: ["It uses the internet extensively."]
        solution: "Online marketing, web marketing, internet marketing."
        mistakes: {"Public distribution": price_control}
      - prompt: "What is the main aim of price control by the government?"
        options: ["To let exchange happen at a reasonable price and protect both producers and consumers", "To make goods as costly as possible", "To stop all trade", "To help only big companies"]
        answer: "To let exchange happen at a reasonable price and protect both producers and consumers"
        difficulty: 2
        hints: ["It fixes the highest and lowest prices."]
        solution: "It protects the interests of both producers and consumers."
        mistakes: {"To help only big companies": price_control}
      - prompt: "Paddy's market price falls below a farmer's cost of production. What protects the farmer?"
        options: ["Minimum Support Price", "A discount sale", "Digital marketing", "Equilibrium"]
        answer: "Minimum Support Price"
        difficulty: 3
        hints: ["The government buys at a guaranteed price."]
        solution: "MSP acts as a safety net; the government may also buy and store the paddy directly."
        mistakes: {"A discount sale": price_control}
