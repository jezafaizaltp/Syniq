# Class 9 Social Science II, chapter 6 (stored as Social Science chapter 14). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 2 text supplied by the school.
subject: ss
chapter: 14
title: Price and Market

tips:
  all_change: "If every input, even the building, is changed, is that the short run or the long run?"
  could_survive: "Could a person stay alive without it? If yes, it is a want, however useful."
  reduce_reuse: "SDG 12 is about using fewer resources and making less waste. Which habit does that?"
  waste_for_future: "Resources used up and waste dumped today are left for future generations. What does sustainable development ask us to protect?"
  surplus_falls: "When supply is more than demand, sellers are left with stock. What do they do to sell it?"
  more_buyers: "If more people want to buy and the same amount is for sale, who competes for the goods?"
  fair_price_poor: "Ration shops sell essentials at controlled prices. Who needs that help most?"
  k9_discount: "Think about who is doing it: a shop trying to sell more, or the government setting a rule. Which choice is a shop's own offer?"
  k9_consumption: "Producers make goods; households use them up. What do we call using up goods and services?"
  k9_fixed_land: "Which input can't be increased in a few weeks? You can hire workers quickly, but can you quickly get more of the ground you build on?"
  k9_k_capital: "N is natural resources (land), L is labour, O is organisation. Which factor is left for K? (Economists use K from the German spelling.)"
  k9_production: "Making goods from raw materials and work is the main activity of a factory. What is that activity called?"
  k9_inputs: "Land, labour, machines and fuel go in at the start of making something. What do we call what goes in?"
  needs_wants: "Ask: could you survive without it? Things essential for life are needs; things that make life nicer are wants. How much you can buy depends on how much money you have."
  input_output: "What goes into making something are inputs; what comes out is output. Turning one into the other is production; using goods up is consumption. In Q = f(N, L, K, O) the letters are land, labour, capital and organisation (K is used for one)."
  fixed_variable: "In the short run some inputs can't be changed quickly, like the land or building you use; workers can be added fast. When everything can be changed, it is the long run."
  sustainable: "The UN set its goals in 2015, to be met fifteen years later. Count the goals on the textbook chart and find responsible consumption among them. The quote about 'needs, not greed' comes from the Father of the Nation. Sustainable means meeting today's needs without harming tomorrow's."
  demand_law: "Demand is more than a wish: you must want to pay and be able to pay. When price rises, people buy less, so the curve falls as you go right. Read the table carefully, and remember price goes on the vertical axis."
  supply_law: "When the price is higher, sellers offer more: price and supply move the same way. Read the quantities straight from the table and subtract for the change."
  equilibrium: "At equilibrium, quantity demanded equals quantity supplied: find the row where the two are the same. A shortage or surplus is the gap between them. Less demand and more supply push price one way; higher prices cut buyers' purchasing power."
  price_control: "Government tools to keep prices fair: ration shops, Kerala's own supply corporation, and a guaranteed floor price for farm crops. Discounts are a selling trick, not government control. Digital marketing began with the World Wide Web in the decade before 2000."
  ss14m_need_or_want: Could a person stay alive without it? If yes, it is a want, however nice it is.
  ss14m_in_or_out: "Ask whether it goes into the making, or is what comes out at the end."
  ss14m_letters: 'In Q = f(N, L, K, O), each letter is one factor: nature''s gift, human work, man-made aids, and the person who organises.'
  ss14m_short_long: If even one input cannot be changed, it is the short run. Only when every input can change is it the long run.
  ss14m_future_too: Sustainable means thinking of people not yet born as well as people living now.
  ss14m_read_table: Find the row for that price first, then read across to the right column.
  ss14m_price_qty_direction: Buyers buy less when price goes up; sellers offer more when price goes up.
  ss14m_gap: "Compare the two amounts: the gap is the bigger minus the smaller. Then ask which side has too much, buyers or sellers."
  ss14m_push_price: Too much on sale pushes the price down; too many buyers chasing too little pushes it up.
  ss14m_who_protected: 'Ask whom the measure protects: the poor buyer, or the farmer who might sell at a loss.'

concepts:
  - code: ss9.market.production
    title: Needs, inputs and the production function
    notes: |
      Basic or primary needs (air, food, water, clothing, shelter) are essential for life; wants help
      achieve life's aspirations but are not essential for survival. Producers recognise needs and
      produce goods and services. Factors used in production (raw materials like bamboo and wood pulp,
      machines, fuel, buildings, land, labour, organisation) are inputs; goods produced are outputs;
      converting inputs into outputs is production. Output can be increased by more inputs, better
      technology or higher productivity. Production function: the technical relationship between inputs
      and output in a given period, Q = f(N, L, K, O), where N land, L labour, K capital (technology,
      buildings, tools, financial capital), O organisation. Fixed inputs cannot be changed in the short
      period (land, organisation); variable inputs can (labour, capital). Short-run production function:
      at least one input is fixed. Long-run: all inputs are variable.
    explanations:
      text: "Production means turning inputs into outputs. The production function says output depends on land, labour, capital and organisation. In a short time you can hire more workers, but you cannot quickly get more land."
      visual: "A notebook factory: bamboo and wood pulp, machines, fuel, a building, land and workers go in (inputs); notebooks come out (output)."
      step_by_step: "To tell fixed from variable: Step 1: ask whether the input can be increased within a few weeks. Step 2: if yes (more workers, more machines), it is variable. Step 3: if no (more land, a new management system), it is fixed."
      real_world: "A tea shop owner can add one more helper during festival season (variable input), but cannot quickly make the shop bigger (fixed input)."
    activity:
      type: sort
      prompt: In the short run, can this input be changed?
      bins:
      - Fixed in the short run
      - Variable
      items:
      - label: The land of a farm
        bin: Fixed in the short run
        clue: Can you buy more land in a week?
        why: Land is fixed in the short run.
      - label: The owner's organisation of the firm
        bin: Fixed in the short run
        clue: The way the firm is run.
        why: Organisation is fixed in the short run.
      - label: Number of workers at harvest
        bin: Variable
        clue: Can you hire more for a week?
        why: Labour can be changed quickly.
      - label: More machines and tools
        bin: Variable
        clue: Capital can be added.
        why: Capital is variable.
      - label: Extra hours worked by labourers
        bin: Variable
        clue: More labour, quickly.
        why: Labour is variable.
      - label: The factory's plot of land
        bin: Fixed in the short run
        clue: Land again.
        why: Fixed.
    lesson:
      - teach: Basic needs (air, food, water, clothing, shelter) keep us alive. Wants (a phone, a bike) make life better but are not essential. Producers see these needs and wants and make goods and services to meet them.
        picture:
          kind: compare
          columns:
          - title: Needs
            points:
            - essential to live
            - food, water, shelter
          - title: Wants
            points:
            - nice to have
            - phone, bike, toys
          alt: Needs compared with wants.
        check:
          prompt: Which is a basic need?
          options:
          - Shelter
          - A television
          - A video game
          answer: Shelter
          why: We cannot live safely without a home.
        ways:
        - style: step_by_step
          teach: 'Step 1: ask: could you live without it? Step 2: if not, like air, food, water, clothing or shelter, it is a basic need. Step 3: if it just makes life better, like a phone or a bike, it is a want. Step 4: producers make goods and services to meet both.'
      - teach: 'Inputs (land, labour, machines, raw materials, fuel, organisation) go in; outputs (goods) come out. Turning inputs into outputs is production. The production function writes this as Q = f(N, L, K, O): output depends on land (N), labour (L), capital (K) and organisation (O).'
        picture:
          kind: flow
          steps:
          - 'Inputs: land, labour, capital, organisation'
          - Production
          - Output (Q)
          alt: Inputs become output through production.
        check:
          prompt: In Q = f(N, L, K, O), Q stands for
          options:
          - Output
          - Quality
          - Quantity of land
          answer: Output
          why: Q is the quantity produced.
        ways:
        - style: real_world
          teach: 'A tailor takes cloth, thread, a sewing machine, electricity and her own skill, and out comes a shirt. Inputs go in, output comes out: that is production. Economists write it as Q = f(N, L, K, O): output Q depends on land, labour, capital and organisation.'
      - teach: Fixed inputs (land, organisation) cannot be changed quickly; variable inputs (labour, capital) can. If at least one input is fixed, it is the short run. If all inputs can change, it is the long run.
        check:
          prompt: A factory adds workers but keeps the same building. This is the
          options:
          - Short run
          - Long run
          - No production
          answer: Short run
          why: The building (land) stays fixed.
        ways:
        - style: real_world
          teach: A busy hotel can hire more cooks tomorrow, but it can't build a bigger kitchen overnight. When at least one input, like the building, is fixed, it is the short run. Given enough time to change everything, including the building, it is the long run.
    items:
      - prompt: "Which of these is a basic need?"
        options: ["Food", "A motorbike", "A smartphone game", "A holiday trip"]
        answer: "Food"
        difficulty: 1
        hints: ["Basic needs are essential to stay alive."]
        solution: "Food is a basic need; the others are wants."
        mistakes: {"A motorbike": needs_wants}
      - prompt: "Things like land, labour, machines and fuel used to make a product are called"
        options: ["Inputs", "Outputs", "Wants", "Markets"]
        answer: "Inputs"
        difficulty: 1
        hints: ["They go into the production process."]
        solution: "They are inputs; the product made is the output."
        mistakes: {"Outputs": k9_inputs}
      - prompt: "The process of converting inputs into outputs is called"
        options: ["Production", "Consumption", "Distribution", "Demand"]
        answer: "Production"
        difficulty: 1
        hints: ["All products we use are made this way."]
        solution: "Production."
        mistakes: {"Consumption": k9_production}
      - prompt: "In the production function Q = f(N, L, K, O), what does K stand for?"
        options: ["Capital", "Knowledge", "Land", "Kind of product"]
        answer: "Capital"
        difficulty: 2
        hints: ["N is land, L is labour, O is organisation."]
        solution: "K is capital: technology, buildings, tools and financial capital."
        mistakes: {"Land": k9_k_capital}
      - prompt: "Which of these is a fixed input in the short run?"
        options: ["Land", "Labour", "Raw materials", "Fuel"]
        answer: "Land"
        difficulty: 2
        hints: ["It cannot be increased within a short period."]
        solution: "Land (and organisation) are fixed inputs."
        mistakes: {"Labour": k9_fixed_land}
      - prompt: "A production situation where all inputs can be changed is called"
        options: ["Long-run production function", "Short-run production function", "Fixed production", "Equilibrium"]
        answer: "Long-run production function"
        difficulty: 2
        hints: ["In the short run at least one input is fixed."]
        solution: "When all inputs are variable it is the long run."
        mistakes: {"Short-run production function": fixed_variable}
      - prompt: "A notebook maker hires 10 more workers to meet a rush of orders but keeps the same factory land. Which is true?"
        options: ["Labour is variable, land is fixed; this is the short run", "Both are fixed; this is the long run", "Land is variable; this is the long run", "Labour is fixed; this is the short run"]
        answer: "Labour is variable, land is fixed; this is the short run"
        difficulty: 3
        hints: ["Which input changed and which stayed the same?"]
        solution: "Labour changed, land did not. With one input fixed, it is the short run."
        mistakes: {"Both are fixed; this is the long run": fixed_variable}
      - prompt: "A bakery doubles its workers, buys more ovens and moves into a bigger building. Which kind of production situation is this?"
        options: ["Long run: all inputs change", "Short run: only labour changes", "Short run: land is fixed", "No production is taking place"]
        answer: "Long run: all inputs change"
        difficulty: 3
        hints: ["In the short run, some inputs like land and buildings stay fixed.", "Here even the building changes."]
        solution: "Step 1: Workers, ovens and the building all change. Step 2: When every input can change, it is the long run."
        mistakes: {"Short run: only labour changes": all_change, "Short run: land is fixed": all_change, "No production is taking place": k9_production}
      - prompt: "Which of these is a want rather than a basic need?"
        options: ["A smartphone", "Drinking water", "Food", "Shelter"]
        answer: "A smartphone"
        difficulty: 2
        hints: ["Basic needs keep us alive.", "Could you live without each one?"]
        solution: "Step 1: Water, food and shelter are essential for life. Step 2: A smartphone is useful but not needed to survive, so it is a want."
        mistakes: {"Drinking water": could_survive, "Food": could_survive, "Shelter": could_survive}
      - prompt: Bamboo and wood pulp used to make paper are
        options:
        - Inputs
        - Outputs
        - Wants
        - Profits
        answer: Inputs
        difficulty: 1
        hints:
        - Do they go in or come out?
        - The paper is what comes out.
        solution: 'Step 1: Paper is made from bamboo and pulp. Step 2: What goes in is called an input. Step 3: Inputs.'
        mistakes:
          Outputs: ss14m_in_or_out
      - prompt: In Q = f(N, L, K, O), what does N stand for?
        options:
        - Land
        - Labour
        - Number of workers
        - Nation
        answer: Land
        difficulty: 2
        hints:
        - N stands for something given by nature.
        - L is already labour.
        solution: 'Step 1: L = labour, K = capital, O = organisation. Step 2: N is from ''nature''. Step 3: Land.'
        mistakes:
          Labour: ss14m_letters
          Number of workers: ss14m_letters
      - prompt: Which of these is a want, not a basic need?
        options:
        - A music system
        - Drinking water
        - Clothing
        - Food
        answer: A music system
        difficulty: 1
        hints:
        - Which could you live without?
        - Three are essential to life.
        solution: 'Step 1: Water, clothing and food keep us alive. Step 2: A music system does not. Step 3: It is a want.'
        mistakes:
          Clothing: ss14m_need_or_want
      - prompt: Which input is variable in the short run?
        options:
        - Labour
        - Land
        - Organisation
        - Factory site
        answer: Labour
        difficulty: 2
        hints:
        - Which can be changed quickly?
        - You can hire more workers in a week.
        solution: 'Step 1: Land and organisation take long to change. Step 2: Workers can be added fast. Step 3: Labour.'
        mistakes:
          Land: ss14m_short_long
      - prompt: How can a producer increase output without adding more workers?
        options:
        - Use better technology
        - Reduce raw materials
        - Close the factory
        - Lower productivity
        answer: Use better technology
        difficulty: 2
        hints:
        - Output rises with more inputs, better technology or higher productivity.
        - Which option is not about more workers and still helps?
        solution: 'Step 1: Output can grow by technology or productivity. Step 2: Better machines let the same workers make more. Step 3: Use better technology.'
        mistakes:
          Lower productivity: input_output
      - prompt: A farmer buys a second field, more tractors and hires a manager. Which situation is this?
        options:
        - 'Long run: all inputs change'
        - 'Short run: land fixed'
        - No production
        - Only consumption
        answer: 'Long run: all inputs change'
        difficulty: 3
        hints:
        - Check land, capital, labour and organisation.
        - Is any input left fixed?
        solution: 'Step 1: Land changes (new field). Step 2: Capital and organisation change too. Step 3: All change: long run.'
        mistakes:
          'Short run: land fixed': ss14m_short_long

  - code: ss9.market.consumption
    title: Consumption and sustainable development
    after: [ss9.market.production]
    notes: |
      Buying and using goods and services to fulfil needs is consumption. A consumer buys and uses goods
      and services by paying or agreeing to pay. Financial capacity is the main factor influencing
      consumption; others include tastes and preferences, climate and environmental awareness. The
      consumption pattern shows how a family spends its income on food, clothes, shelter, transport,
      health, education and entertainment. Unlimited wants and limited resources are the major challenge.
      Sustainable consumption minimises environmental impact; sustainable production uses minimum
      natural resources, saves energy, maximises renewability and recycling, and keeps workers safe. UN
      SDG 12: responsible consumption and production. Gandhi: "Earth has enough resources for everybody's
      needs but not for anybody's greed." Sustainable development (Brundtland Commission): development
      that meets the needs of the present without compromising the ability of future generations to meet
      their own needs. 17 SDGs announced in 2015, to be achieved by 2030.
    explanations:
      text: "Consumption is using goods and services. Sustainable consumption and production means using resources carefully so that people in the future also have enough."
      visual: "Think of a well shared by a village. If everyone draws only what they need, it lasts for years. If some waste water, it dries up for the next generation."
      step_by_step: "To judge whether a habit is sustainable: Step 1: does it waste resources? Step 2: can the thing be reused or recycled? Step 3: does it harm the environment? Fewer harms means more sustainable."
      real_world: "Carrying a cloth bag to the shop instead of taking new plastic covers is sustainable consumption."
    activity:
      type: sort
      prompt: Is it sustainable consumption?
      bins:
      - Sustainable
      - Not sustainable
      items:
      - label: Carrying a cloth bag to the shop
        bin: Sustainable
        clue: Used again and again.
        why: Reusing cuts waste.
      - label: Buying a new phone every year though the old one works
        bin: Not sustainable
        clue: Need or greed?
        why: 'It wastes resources: ''enough for need, not for greed''.'
      - label: Using LED bulbs and solar power
        bin: Sustainable
        clue: Saves energy.
        why: Saves energy and resources.
      - label: Throwing away leftover food every day
        bin: Not sustainable
        clue: Was it needed?
        why: Waste of food and resources.
      - label: Recycling paper
        bin: Sustainable
        clue: Old becomes new.
        why: Recycling is sustainable.
      - label: Single-use plastic cups at every meal
        bin: Not sustainable
        clue: Used once.
        why: Creates lasting waste.
    lesson:
      - teach: Consumption is buying and using goods and services to meet needs. What a family buys depends most on its money (financial capacity), and also on tastes, climate and awareness. Wants are unlimited, but resources are limited.
        check:
          prompt: What most decides how much a family can consume?
          options:
          - Its income (financial capacity)
          - The colour of its house
          - Its number of neighbours
          answer: Its income (financial capacity)
          why: You can only buy what you can pay for.
        ways:
        - style: real_world
          teach: Two families may both want a new fridge, but only the one with money for it can buy it. Consumption means buying and using goods and services, and what a family consumes depends most on its income, then on tastes, climate and awareness. Wants never end; resources do.
      - teach: 'Sustainable development meets today''s needs without harming the ability of future generations to meet theirs (Brundtland Commission). The UN set 17 Sustainable Development Goals in 2015, to reach by 2030. SDG 12 is responsible consumption and production: reduce, reuse, recycle, save energy.'
        picture:
          kind: flow
          steps:
          - Reduce
          - Reuse
          - Recycle
          - Resources last for the future
          alt: Responsible consumption keeps resources for the future.
        check:
          prompt: Which habit fits SDG 12?
          options:
          - Carrying a cloth bag instead of plastic
          - Buying new phones every month
          - Leaving lights on
          answer: Carrying a cloth bag instead of plastic
          why: Reusing cuts waste and saves resources.
        ways:
        - style: real_world
          teach: 'Using up the whole well today leaves nothing for your children. Sustainable development means meeting today''s needs without taking away the future''s. The UN''s 17 Sustainable Development Goals, set in 2015 for 2030, include SDG 12: reduce, reuse, recycle and save energy, like carrying a cloth bag.'
    items:
      - prompt: "Buying and using goods and services to fulfil needs is called"
        options: ["Consumption", "Production", "Supply", "Marketing"]
        answer: "Consumption"
        difficulty: 1
        hints: ["The person who does it is a consumer."]
        solution: "Consumption."
        mistakes: {"Production": k9_consumption}
      - prompt: "According to the textbook, what is the main factor influencing consumption?"
        options: ["Financial capacity of the consumer", "Climate only", "The colour of the product", "The number of shops"]
        answer: "Financial capacity of the consumer"
        difficulty: 1
        hints: ["You can only buy what you can pay for."]
        solution: "Financial capacity (income) is the main factor."
        mistakes: {"Climate only": needs_wants}
      - prompt: "How many Sustainable Development Goals did the United Nations set?"
        answer: "17"
        check: "17"
        difficulty: 1
        hints: ["Goal 12 is responsible consumption and production."]
        solution: "17 goals, announced in 2015."
        mistakes: {"12": sustainable}
      - prompt: "By which year does the UN aim to achieve the Sustainable Development Goals?"
        answer: "2030"
        check: "2030"
        difficulty: 2
        hints: ["They were announced in 2015."]
        solution: "2030."
        mistakes: {"2015": sustainable}
      - prompt: "Which SDG is about responsible consumption and production?"
        answer: "12"
        check: "12"
        difficulty: 2
        hints: ["It is the twelfth goal."]
        solution: "Goal 12."
        mistakes: {"17": sustainable}
      - prompt: "Who said, \"Earth has enough resources for everybody's needs but not for anybody's greed\"?"
        options: ["Mahatma Gandhi", "Jawaharlal Nehru", "B. R. Ambedkar", "Rabindranath Tagore"]
        answer: "Mahatma Gandhi"
        difficulty: 2
        hints: ["The Father of the Nation."]
        solution: "Mahatma Gandhi."
        mistakes: {"Jawaharlal Nehru": sustainable}
      - prompt: "Sustainable development means"
        options: ["Meeting present needs without harming the ability of future generations to meet theirs", "Using all resources now for fast growth", "Stopping all development", "Development only in cities"]
        answer: "Meeting present needs without harming the ability of future generations to meet theirs"
        difficulty: 2
        hints: ["The definition came from the Brundtland Commission."]
        solution: "It balances present needs with those of future generations."
        mistakes: {"Using all resources now for fast growth": sustainable}
      - prompt: "Which is an aim of sustainable production?"
        options: ["Maximum energy conservation and a safe workplace", "Producing as much as possible whatever the waste", "Using only non-renewable resources", "Ignoring recycling"]
        answer: "Maximum energy conservation and a safe workplace"
        difficulty: 3
        hints: ["Minimum misuse of natural resources is its primary goal."]
        solution: "Saving energy and keeping workers safe are among its aims."
        mistakes: {"Producing as much as possible whatever the waste": sustainable}
      - prompt: "Which habit best supports SDG 12, responsible consumption and production?"
        options: ["Repairing and reusing things instead of throwing them away", "Buying a new phone every few months", "Using plastic bags once and discarding them", "Leaving lights on all day"]
        answer: "Repairing and reusing things instead of throwing them away"
        difficulty: 2
        hints: ["SDG 12 is about using resources carefully.", "Which choice makes less waste?"]
        solution: "Step 1: Responsible consumption uses fewer resources and makes less waste. Step 2: Repairing and reusing does exactly that."
        mistakes: {"Buying a new phone every few months": reduce_reuse, "Using plastic bags once and discarding them": reduce_reuse, "Leaving lights on all day": reduce_reuse}
      - prompt: "Why is a 'use and throw' lifestyle a problem for sustainable development?"
        options: ["It uses up resources and leaves waste that future generations must deal with", "It makes goods cheaper for everyone forever", "It creates no waste", "It helps the environment recover"]
        answer: "It uses up resources and leaves waste that future generations must deal with"
        difficulty: 3
        hints: ["What does sustainable development promise future generations?", "Where do thrown-away goods end up?"]
        solution: "Step 1: Sustainable development meets present needs without harming future ones. Step 2: Use-and-throw drains resources and piles up waste, harming that future."
        mistakes: {"It makes goods cheaper for everyone forever": waste_for_future, "It creates no waste": waste_for_future, "It helps the environment recover": waste_for_future}
      - prompt: A person who buys and uses goods and services is a
        options:
        - Consumer
        - Producer
        - Wholesaler
        - Manufacturer
        answer: Consumer
        difficulty: 1
        hints:
        - They use the goods, not make them.
        - This word comes from 'consume'.
        solution: 'Step 1: Producers make goods. Step 2: The one who uses them consumes. Step 3: Consumer.'
        mistakes:
          Producer: needs_wants
      - prompt: How a family divides its income between food, clothes, rent, travel and school is its
        options:
        - Consumption pattern
        - Production function
        - Supply schedule
        - Equilibrium
        answer: Consumption pattern
        difficulty: 2
        hints:
        - It is about spending, not making.
        - It shows the pattern of what is bought.
        solution: 'Step 1: This is about how money is spent. Step 2: Spending to meet needs is consumption. Step 3: Consumption pattern.'
        mistakes:
          Production function: ss14m_in_or_out
      - prompt: The SDGs were announced in 2015 and are to be reached by 2030. How many years is that?
        answer: '15'
        check: 2030 - 2015
        difficulty: 1
        hints:
        - Subtract the start year from the end year.
        - 2030 − 2015.
        solution: 'Step 1: End 2030. Step 2: Start 2015. Step 3: 15 years.'
        mistakes:
          '25': m5_subtract_not_add
      - prompt: Which is an example of sustainable production?
        options:
        - A factory that recycles water and uses solar power
        - A factory that dumps waste in a river
        - Cutting a forest for timber without replanting
        - Using more fuel than needed
        answer: A factory that recycles water and uses solar power
        difficulty: 2
        hints:
        - Sustainable production uses the least natural resources.
        - Which one saves energy and recycles?
        solution: 'Step 1: Dumping, clear-cutting and waste harm the future. Step 2: Recycling and solar save resources. Step 3: That factory.'
        mistakes:
          Cutting a forest for timber without replanting: ss14m_future_too
      - prompt: The definition 'meeting present needs without compromising future generations' was given by the
        options:
        - Brundtland Commission
        - Planning Commission
        - Election Commission
        - Finance Commission
        answer: Brundtland Commission
        difficulty: 2
        hints:
        - It was a UN commission on environment and development.
        - It is named after its chairperson.
        solution: 'Step 1: This is the classic definition of sustainable development. Step 2: It came from a UN commission. Step 3: Brundtland Commission.'
        mistakes:
          Planning Commission: sustainable

  - code: ss9.market.demand_supply
    title: Market, demand and supply
    after: [ss9.market.consumption]
    notes: |
      Consumers depend on producers and producers depend on consumers; the market links them. Marketing
      delivers goods to consumers directly or through sellers. A market has buyers and sellers, price is
      determined, both sides are equally important, there is choice, and marketing techniques are used.
      Demand: the desire for a commodity backed by willingness and ability to pay. Demand schedule (Table
      6.1): price ₹5, 10, 15, 20, 25 → quantity demanded 50, 40, 30, 20, 10 kg. Demand curve DD slopes
      downward from left to right: inverse relationship between price and quantity demanded. Supply: the
      quantity ready to be sold at a given price in a specific period. Supply schedule (Table 6.2): price
      ₹5 to 25 → quantity supplied 10, 20, 30, 40, 50 kg. Supply curve SS slopes upward: direct
      relationship. On both graphs quantity is on the OX axis and price on the OY axis.
    explanations:
      text: "Demand: when price goes up, people buy less. Supply: when price goes up, sellers offer more. So the demand curve goes down and the supply curve goes up."
      visual: "Draw price up the side and quantity along the bottom. Demand runs from top-left down to bottom-right. Supply runs from bottom-left up to top-right."
      step_by_step: "To read a schedule: Step 1: find the price in the left column. Step 2: read the quantity beside it. Step 3: compare two rows to see whether quantity went up or down when price rose."
      real_world: "When mango prices fall in season, families buy more mangoes. When fish prices rise, more boats try to bring fish to market."
    activity:
      type: number_line
      min: 0
      max: 60
      step: 10
      start: 0
      prompt: 'Demand: ₹5→50, ₹10→40, ₹15→30, ₹20→20, ₹25→10 kg. Supply: ₹5→10 up to ₹25→50 kg.'
      goals:
      - prompt: How many kg are demanded at ₹10?
        target: 40
        mistakes:
        - when:
            v: 20
          say: That's supply at ₹10. Demand is high at a low price.
      - prompt: How many kg are supplied at ₹25?
        target: 50
        mistakes:
        - when:
            v: 10
          say: That's demand at ₹25. Sellers offer more when the price is high.
      - prompt: How many kg are demanded at ₹25?
        target: 10
        mistakes:
        - when:
            v: 50
          say: 'That''s supply. Buyers want less when the price is high: the demand curve slopes down.'
    lesson:
      - teach: 'A market brings buyers and sellers together, and a price is set there. Demand is a desire backed by willingness and ability to pay. When price goes up, people buy less: the demand curve slopes down from left to right (inverse relationship).'
        picture:
          kind: bars
          unit: kg demanded
          bars:
          - label: ₹5
            value: 50
          - label: ₹10
            value: 40
          - label: ₹15
            value: 30
          - label: ₹20
            value: 20
          - label: ₹25
            value: 10
          alt: Quantity demanded falls as price rises (Table 6.1).
        check:
          prompt: As price rises, quantity demanded
          options:
          - Falls
          - Rises
          - Stays the same
          answer: Falls
          why: Price and demand move in opposite directions.
        ways:
        - style: real_world
          teach: When mangoes cost ₹50 a kg you may buy 3 kg; at ₹150 a kg, maybe half a kilo. Higher price, less bought. Demand is wanting something AND being willing and able to pay; on a graph the demand curve slopes down from left to right.
      - teach: 'Supply is the amount sellers are ready to sell at a price in a period. Higher price means more profit, so sellers offer more: the supply curve slopes upward (direct relationship). On both graphs, quantity is on the OX axis and price on OY.'
        picture:
          kind: bars
          unit: kg supplied
          bars:
          - label: ₹5
            value: 10
          - label: ₹10
            value: 20
          - label: ₹15
            value: 30
          - label: ₹20
            value: 40
          - label: ₹25
            value: 50
          alt: Quantity supplied rises as price rises (Table 6.2).
        check:
          prompt: Which way does the supply curve slope?
          options:
          - Upward
          - Downward
          - Flat
          answer: Upward
          why: Higher price, more supplied.
        ways:
        - style: real_world
          teach: If fish fetches a high price at the market, fishermen bring in more boats and more fish. Higher price, more profit, more offered for sale. So the supply curve slopes upward. On both graphs, quantity goes along OX and price up OY.
    items:
      - prompt: "Demand is desire backed by"
        options: ["Willingness and ability to pay", "Only a wish", "Government orders", "The seller's needs"]
        answer: "Willingness and ability to pay"
        difficulty: 1
        hints: ["Wanting something is not enough."]
        solution: "Demand = desire + willingness to buy + ability to pay."
        mistakes: {"Only a wish": demand_law}
      - prompt: "The demand curve slopes"
        options: ["Downward from left to right", "Upward from left to right", "Straight across", "Straight up"]
        answer: "Downward from left to right"
        difficulty: 1
        hints: ["Higher price, lower quantity demanded."]
        solution: "It slopes downward, showing an inverse relationship."
        mistakes: {"Upward from left to right": demand_law}
      - prompt: "The supply curve shows what relationship between price and quantity supplied?"
        options: ["Direct", "Inverse", "No relationship"]
        answer: "Direct"
        difficulty: 1
        hints: ["Higher price, more is offered for sale."]
        solution: "Direct: both rise together."
        mistakes: {"Inverse": supply_law}
      - prompt: "In Table 6.1, how many kilograms are demanded at ₹5?"
        answer: "50"
        check: "50"
        difficulty: 1
        hints: ["Lowest price, highest demand."]
        solution: "50 kg."
        mistakes: {"10": demand_law}
      - prompt: "In Table 6.1, when the price rises from ₹5 to ₹10, by how many kilograms does quantity demanded fall?"
        answer: "10"
        check: "50 - 40"
        difficulty: 2
        hints: ["At ₹5 it is 50 kg; at ₹10 it is 40 kg."]
        solution: "50 − 40 = 10 kg less."
        mistakes: {"40": demand_law}
      - prompt: "In Table 6.2, how many kilograms are supplied at ₹25?"
        answer: "50"
        check: "50"
        difficulty: 2
        hints: ["Highest price, highest supply."]
        solution: "50 kg."
        mistakes: {"10": supply_law}
      - prompt: "On the demand and supply graphs in the textbook, what is shown on the OY axis?"
        options: ["Price of the product", "Quantity of the product", "Time", "Number of buyers"]
        answer: "Price of the product"
        difficulty: 2
        hints: ["Quantity is on the OX axis."]
        solution: "Price is on the OY (vertical) axis."
        mistakes: {"Quantity of the product": demand_law}
      - prompt: "In Table 6.2, from ₹5 to ₹25 how many kilograms does supply increase in total?"
        answer: "40"
        check: "50 - 10"
        difficulty: 2
        hints: ["Supply at ₹5 is 10 kg and at ₹25 is 50 kg."]
        solution: "50 − 10 = 40 kg."
        mistakes: {"50": supply_law}
      - prompt: "Which is a general characteristic of a market?"
        options: ["There are buyers and sellers and the price is determined", "There are only sellers", "Prices never change", "Buyers have no choice"]
        answer: "There are buyers and sellers and the price is determined"
        difficulty: 1
        hints: ["Both buyers and sellers are equally important."]
        solution: "A market has buyers, sellers, price determination, choice and marketing techniques."
        mistakes: {"There are only sellers": demand_law}
      - prompt: "The price of tea rises and nothing else changes. What happens to the quantity of tea demanded?"
        options: ["It falls", "It rises", "It stays the same", "It becomes zero"]
        answer: "It falls"
        difficulty: 2
        hints: ["Which way does the demand curve slope?", "Price and quantity demanded move in opposite directions."]
        solution: "Step 1: By the law of demand, price and quantity demanded are inversely related. Step 2: A higher price means less tea is bought."
        mistakes: {"It rises": demand_law, "It stays the same": demand_law, "It becomes zero": demand_law}
      - prompt: "Why do sellers usually offer more of a product when its price rises?"
        options: ["A higher price brings them more profit", "Buyers want less of it", "The government orders them", "Producing it becomes free"]
        answer: "A higher price brings them more profit"
        difficulty: 3
        hints: ["Price and supply move the same way.", "What do producers gain from a higher price?"]
        solution: "Step 1: A higher price means more earnings for each unit sold. Step 2: So producers bring more to market: the supply curve slopes upward."
        mistakes: {"Buyers want less of it": supply_law, "The government orders them": supply_law, "Producing it becomes free": supply_law}
      - prompt: "Using Tables 6.1 and 6.2, at what price are quantity demanded and quantity supplied equal?"
        options:
        - "₹15"
        - "₹5"
        - "₹25"
        - "₹10"
        answer: "₹15"
        difficulty: 3
        hints: ["Put the two tables side by side, price by price.", "Find the price where both quantities are the same."]
        solution: "Step 1: Demand: ₹5→50, ₹10→40, ₹15→30, ₹20→20, ₹25→10 kg. Step 2: Supply: ₹5→10, ₹10→20, ₹15→30, ₹20→40, ₹25→50 kg. Step 3: Both are 30 kg at ₹15, the equilibrium price."
        mistakes: {"₹5": equilibrium, "₹25": equilibrium}
      - prompt: In Table 6.1, how many kilograms are demanded at ₹20?
        answer: '20'
        check: '20'
        difficulty: 1
        hints:
        - Find the ₹20 row.
        - Demand falls by 10 kg for every ₹5 rise from 50 kg at ₹5.
        solution: 'Step 1: ₹5→50, ₹10→40, ₹15→30. Step 2: ₹20→20. Step 3: 20 kg.'
        mistakes:
          '40': ss14m_read_table
      - prompt: A child wants a toy but has no money to pay. Is this demand?
        options:
        - No, demand needs ability to pay
        - Yes, any wish is demand
        - Yes, if the toy is cheap
        - No, toys are never demanded
        answer: No, demand needs ability to pay
        difficulty: 2
        hints:
        - 'Demand has three parts: desire, willingness and ability.'
        - Which part is missing here?
        solution: 'Step 1: The child has desire and willingness. Step 2: Ability to pay is missing. Step 3: So it is not demand.'
        mistakes:
          Yes, any wish is demand: demand_law
      - prompt: Fish prices rise sharply. What do fish sellers usually do?
        options:
        - Offer more fish for sale
        - Offer less fish
        - Stop selling fish
        - Give fish away free
        answer: Offer more fish for sale
        difficulty: 2
        hints:
        - Think about profit for the seller.
        - Supply and price move the same way.
        solution: 'Step 1: Higher price means more profit. Step 2: Sellers want to sell more. Step 3: They offer more fish.'
        mistakes:
          Offer less fish: ss14m_price_qty_direction

  - code: ss9.market.equilibrium
    title: Equilibrium price
    after: [ss9.market.demand_supply]
    notes: |
      The price of a product is determined by the forces of demand and supply. Table 6.3 combines the
      schedules: at ₹5 demand 50, supply 10 (demand > supply); ₹10: 40, 20; ₹15: 30, 30 (demand =
      supply); ₹20: 20, 40; ₹25: 10, 50 (demand < supply). Equilibrium is the condition where demand
      equals supply; the price is the equilibrium price (₹15) and the quantity the equilibrium quantity
      (30 kg), at point E where DD and SS intersect. Disequilibrium: demand and supply not equal. If demand
      falls and supply rises, price falls; if demand rises and supply falls, price rises. When demand
      exceeds supply, producers raise prices; this lowers purchasing power, forcing prices down, and the
      market returns to equilibrium.
    explanations:
      text: "Equilibrium is where the amount people want to buy equals the amount sellers want to sell. On the graph it is where the two curves cross."
      visual: "Picture the downward demand line and the upward supply line forming an X. The crossing point E gives the equilibrium price on the side and the quantity at the bottom."
      step_by_step: "To find equilibrium in a table: Step 1: go row by row. Step 2: compare quantity demanded with quantity supplied. Step 3: the row where they are equal gives the equilibrium price and quantity."
      real_world: "At the start of Onam, demand for flowers jumps and prices shoot up. After the festival demand falls, there are too many flowers, and prices drop."
    activity:
      type: formula
      prompt: Change the price. Watch demand and supply.
      inputs:
      - name: p
        label: Price
        min: 5
        max: 25
        step: 5
        start: 5
        unit: ₹
      outputs:
      - name: d
        label: Quantity demanded
        expr: 60-2*p
        unit: kg
      - name: s
        label: Quantity supplied
        expr: 2*p
        unit: kg
      - name: g
        label: Demand minus supply
        expr: 60-4*p
        unit: kg
      goals:
      - prompt: Find the equilibrium price, where demand equals supply.
        want:
          g: 0
        mistakes:
        - when:
            g:
            - 10
            - 40
          say: 'Demand is more than supply: buyers compete and the price rises. Try a higher price.'
        - when:
            g:
            - -40
            - -10
          say: 'Supply is more than demand: goods stay unsold and the price falls. Try a lower price.'
      - prompt: Find the price where sellers offer 40 kg.
        want:
          s: 40
        mistakes:
        - when:
            s:
            - 10
            - 30
          say: 'Sellers offer more only at a higher price: supply rises with price.'
    lesson:
      - teach: 'Price is set by demand and supply together. Equilibrium is where they are equal. In Table 6.3, at ₹15 buyers want 30 kg and sellers offer 30 kg: equilibrium price ₹15, equilibrium quantity 30 kg, at point E where the DD and SS curves cross.'
        picture:
          kind: compare
          columns:
          - title: Below ₹15
            points:
            - demand > supply
            - 'shortage: price rises'
          - title: At ₹15
            points:
            - demand = supply = 30 kg
            - equilibrium
          - title: Above ₹15
            points:
            - supply > demand
            - 'surplus: price falls'
          alt: Shortage, equilibrium and surplus in Table 6.3.
        check:
          prompt: At equilibrium,
          options:
          - Demand equals supply
          - Demand is double supply
          - Supply is zero
          answer: Demand equals supply
          why: That is what equilibrium means.
        ways:
        - style: step_by_step
          teach: 'Step 1: list, for each price, how much buyers want and how much sellers offer. Step 2: find the price where the two numbers are equal. Step 3: that is the equilibrium price, and the amount is the equilibrium quantity. On the graph, it is point E, where DD and SS cross.'
      - teach: When demand and supply are unequal (disequilibrium), price moves. Demand up or supply down → price rises. Demand down or supply up → price falls. These moves push the market back to equilibrium.
        check:
          prompt: A big harvest floods the market with bananas. Price will
          options:
          - Fall
          - Rise
          - Stay the same
          answer: Fall
          why: Supply rose a lot while demand stayed the same.
        ways:
        - style: real_world
          teach: In mango season the market overflows, and sellers cut prices to clear their stock. In a festival week, everyone wants flowers, and prices shoot up. More supply or less demand pushes prices down; more demand or less supply pushes them up, until the market settles again.
    items:
      - prompt: "The price at which demand and supply are equal is called"
        options: ["Equilibrium price", "Support price", "Discount price", "Maximum price"]
        answer: "Equilibrium price"
        difficulty: 1
        hints: ["It is at the point where the curves meet."]
        solution: "Equilibrium price."
        mistakes: {"Support price": equilibrium}
      - prompt: "In Table 6.3, what is the equilibrium price in rupees?"
        answer: "15"
        check: "15"
        difficulty: 1
        hints: ["Find the row where demand = supply."]
        solution: "At ₹15 demand and supply are both 30 kg."
        mistakes: {"30": equilibrium}
      - prompt: "In Table 6.3, what is the equilibrium quantity in kilograms?"
        answer: "30"
        check: "30"
        difficulty: 2
        hints: ["At ₹15, both columns show the same number."]
        solution: "30 kg."
        mistakes: {"15": equilibrium}
      - prompt: "At ₹10 in Table 6.3, demand is 40 kg and supply is 20 kg. What is the shortage in kilograms?"
        answer: "20"
        check: "40 - 20"
        difficulty: 2
        hints: ["Shortage = demand − supply."]
        solution: "40 − 20 = 20 kg more is demanded than supplied."
        mistakes: {"60": equilibrium}
      - prompt: "At ₹25 in Table 6.3, demand is 10 kg and supply is 50 kg. What is the surplus in kilograms?"
        answer: "40"
        check: "50 - 10"
        difficulty: 2
        hints: ["Surplus = supply − demand."]
        solution: "50 − 10 = 40 kg is left unsold."
        mistakes: {"60": equilibrium}
      - prompt: "A situation where demand and supply are not equal is called"
        options: ["Disequilibrium", "Equilibrium", "Production function", "Price control"]
        answer: "Disequilibrium"
        difficulty: 1
        hints: ["The opposite of equilibrium."]
        solution: "Disequilibrium."
        mistakes: {"Equilibrium": equilibrium}
      - prompt: "Demand for a product falls and supply rises. What happens to its price?"
        options: ["It decreases", "It increases", "It stays the same"]
        answer: "It decreases"
        difficulty: 2
        hints: ["There is more of it than people want."]
        solution: "Too much supply and too little demand push the price down."
        mistakes: {"It increases": equilibrium}
      - prompt: "When demand is more than supply, producers raise prices. Why does the market still come back to equilibrium?"
        options: ["Higher prices reduce consumers' purchasing power, so producers must lower prices again", "The government always fixes the price", "Consumers stop buying everything forever", "Supply falls to zero"]
        answer: "Higher prices reduce consumers' purchasing power, so producers must lower prices again"
        difficulty: 3
        hints: ["Think about what consumers do when prices go too high."]
        solution: "Buyers cut purchases, sellers lower prices, and a price acceptable to both is reached."
        mistakes: {"The government always fixes the price": equilibrium}
      - prompt: "At ₹20 a kg, buyers want 20 kg but sellers offer 40 kg. What is likely to happen next?"
        options: ["The price falls towards the equilibrium", "The price rises", "Nothing changes", "Sellers offer even more"]
        answer: "The price falls towards the equilibrium"
        difficulty: 3
        hints: ["Is there a shortage or a surplus?", "What do sellers do with unsold stock?"]
        solution: "Step 1: Supply exceeds demand by 20 kg: a surplus. Step 2: Sellers cut prices to sell it, moving the price down towards equilibrium."
        mistakes: {"The price rises": surplus_falls, "Nothing changes": surplus_falls, "Sellers offer even more": surplus_falls}
      - prompt: "Before Onam, demand for vegetables rises sharply but supply stays the same. What happens to their price?"
        options: ["It rises", "It falls", "It stays the same", "It becomes zero"]
        answer: "It rises"
        difficulty: 2
        hints: ["Is demand now more or less than supply?", "Buyers compete for the same goods."]
        solution: "Step 1: Demand is now greater than supply: a shortage. Step 2: The price rises until a new equilibrium is reached."
        mistakes: {"It falls": more_buyers, "It stays the same": more_buyers, "It becomes zero": more_buyers}
      - prompt: At ₹5 in Table 6.3, demand is 50 kg and supply is 10 kg. What is the shortage (kg)?
        answer: '40'
        check: 50 - 10
        difficulty: 2
        hints:
        - Shortage = demand − supply.
        - 50 − 10.
        solution: 'Step 1: Demand 50. Step 2: Supply 10. Step 3: Shortage 40 kg.'
        mistakes:
          '60': ss14m_gap
      - prompt: At ₹20, demand is 20 kg and supply 40 kg. This is a
        options:
        - Surplus
        - Shortage
        - Equilibrium
        - Demand curve
        answer: Surplus
        difficulty: 1
        hints:
        - Which is bigger, demand or supply?
        - Sellers have more than buyers want.
        solution: 'Step 1: Supply 40 > demand 20. Step 2: Extra goods left unsold. Step 3: Surplus.'
        mistakes:
          Shortage: ss14m_gap
      - prompt: The point where the demand and supply curves cross is marked
        options:
        - E
        - D
        - S
        - O
        answer: E
        difficulty: 1
        hints:
        - It stands for the word for balance.
        - D and S label the curves themselves.
        solution: 'Step 1: DD is demand, SS is supply. Step 2: Where they meet is equilibrium. Step 3: Marked E.'
        mistakes:
          O: equilibrium
      - prompt: Rain destroys half the tomato crop, but people still want as many tomatoes. Tomato prices will
        options:
        - Rise
        - Fall
        - Stay the same
        - Become zero
        answer: Rise
        difficulty: 2
        hints:
        - What happened to supply?
        - Same demand, less supply.
        solution: 'Step 1: Supply falls. Step 2: Demand stays the same. Step 3: Price rises.'
        mistakes:
          Fall: ss14m_push_price
      - prompt: Demand for umbrellas falls after the monsoon while shops still have many. What happens to umbrella prices?
        options:
        - They fall
        - They rise
        - They double
        - They stay fixed by law
        answer: They fall
        difficulty: 3
        hints:
        - Less demand, same supply.
        - Shops want to clear their stock.
        solution: 'Step 1: Demand drops. Step 2: Supply stays high: surplus. Step 3: Prices fall.'
        mistakes:
          They rise: ss14m_push_price

  - code: ss9.market.techniques_control
    title: Marketing techniques, price control and digital marketing
    after: [ss9.market.equilibrium]
    notes: |
      Marketing technique: a plan to reach sales targets by understanding customers' needs, e.g.
      discounts, rebates, e-commerce and online stores, selling quality products. New technology and tough
      competition push producers to innovate and reduce costs. Price control: rising prices of essential
      goods hurt living standards, so government fixes highest and lowest prices to protect both producers
      and consumers. The public distribution system sells essential goods in limited quantity below market
      price; in Kerala: Public Distribution Centres, Fair Price Shops and Supplyco. Minimum Support Price:
      the minimum price fixed by government for agricultural products (rubber, coconut, paddy) so farmers
      do not lose when market prices fall below cost; government also buys and stores produce directly; a
      safety net for farmers. Digital marketing: marketing through digital channels using IT; the term was
      first used in the 1990s; also called online, web or internet marketing. Features: uses the internet,
      no need to visit the market, products from anywhere in the world, saves time, many products, new jobs.
    explanations:
      text: "Sellers use offers and online shops to attract buyers. The government steps in to keep essential goods affordable and to protect farmers with a minimum price."
      visual: "Picture a ration shop selling rice below market price on one side, and a paddy farmer receiving a guaranteed price on the other. Both are the government protecting people from bad prices."
      step_by_step: "To spot who is helped: Step 1: is the action about lowering prices for buyers (ration shop, Supplyco)? Consumers are helped. Step 2: is it about guaranteeing a minimum price for sellers (MSP)? Farmers are helped."
      real_world: "During festivals, Supplyco fairs sell essential items at lower prices. Ordering a school bag on a shopping app is digital marketing."
    activity:
      type: sort
      prompt: Marketing technique or government price control?
      bins:
      - Marketing technique
      - Price control
      items:
      - label: A 20% festival discount
        bin: Marketing technique
        clue: A seller's plan to sell more.
        why: A marketing technique.
      - label: Selling through an online store
        bin: Marketing technique
        clue: Digital marketing.
        why: A marketing technique.
      - label: A rebate on a fridge
        bin: Marketing technique
        clue: Money back to attract buyers.
        why: Marketing technique.
      - label: Minimum Support Price for paddy
        bin: Price control
        clue: Fixed so farmers don't lose.
        why: Price control by government.
      - label: Rice at a Fair Price Shop
        bin: Price control
        clue: Below market price, limited amount.
        why: 'Public distribution: price control.'
      - label: Supplyco selling essentials cheaply
        bin: Price control
        clue: A Kerala government outlet.
        why: Price control.
    lesson:
      - teach: 'Marketing techniques help sellers reach customers: discounts, rebates, offers, online stores and good quality. Competition and new technology push producers to improve and cut costs. Digital marketing (from the 1990s) sells through the internet: no need to visit a shop, goods from anywhere, saves time.'
        check:
          prompt: '''20% off this week'' is a'
          options:
          - Marketing technique
          - Tax
          - Minimum Support Price
          answer: Marketing technique
          why: A discount is used to attract buyers.
        ways:
        - style: real_world
          teach: '''Buy one get one free'', festival discounts, free delivery from an online store: these are marketing techniques to win customers. Competition and new technology push sellers to improve quality and cut costs, and since the 1990s digital marketing lets you buy from anywhere without visiting a shop.'
      - teach: 'When prices of essentials rise, people suffer, so the government steps in. Ration shops, Fair Price Shops and Supplyco sell essentials below market price to protect buyers. The Minimum Support Price (MSP) protects farmers: the government guarantees a minimum price for paddy, coconut and rubber.'
        picture:
          kind: compare
          columns:
          - title: Protects buyers
            points:
            - ration / Fair Price Shops
            - Supplyco
            - below market price
          - title: Protects farmers
            points:
            - Minimum Support Price
            - government buys and stores
          alt: How price control protects buyers and farmers.
        check:
          prompt: MSP mainly protects
          options:
          - Farmers
          - Online shoppers
          - Bank clerks
          answer: Farmers
          why: It ensures farmers don't have to sell below a fair minimum.
        ways:
        - style: visual
          teach: 'When essential prices rise, the government protects both sides. For buyers: ration shops, Fair Price Shops and Supplyco sell essentials below market price. For farmers: the Minimum Support Price guarantees a minimum price for crops like paddy, coconut and rubber.'
          picture:
            kind: compare
            alt: 'Protecting buyers: ration shops, Fair Price Shops, Supplyco. Protecting farmers: Minimum Support Price for paddy, coconut, rubber.'
            columns:
            - title: Protects buyers
              points:
              - Ration shops
              - Fair Price Shops
              - Supplyco
            - title: Protects farmers
              points:
              - Minimum Support Price
              - Paddy, coconut, rubber
    items:
      - prompt: "Which is a marketing technique?"
        options: ["Discount", "Minimum Support Price", "Production function", "Census"]
        answer: "Discount"
        difficulty: 1
        hints: ["Producers use it to attract customers."]
        solution: "Discounts, rebates and online stores are marketing techniques."
        mistakes: {"Minimum Support Price": k9_discount}
      - prompt: "The minimum price fixed by the government for agricultural products is called"
        options: ["Minimum Support Price", "Equilibrium price", "Discount price", "Market price"]
