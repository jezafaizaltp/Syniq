# Class 9 Social Science II, chapter 5 (stored as Social Science chapter 13). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 2 text supplied by the school.
# Social Science II chapters 1 to 8 are stored as chapters 9 to 16, after the eight Social Science I chapters.
subject: ss
chapter: 13
title: Indian Economy Through Various Sectors

tips:
  final_only: "Only the value of the final good counts. The wheat and flour are already inside the bread's price."
  per_head: "Per capita income = national income ÷ population. Work out each country's figure before comparing."
  share_not_size: "A sector's share is its part of the total. If the total grows faster than the sector, what happens to the share?"
  points_drop: "The fall in a percentage share is the older percentage minus the newer one."
  org_signs: "Organised jobs come with a contract, fixed hours and benefits like provident fund. Which worker has those?"
  k9_unorg_worker: "No registration, no contract, paid by the day: is that the sector with job security or the one without?"
  k9_org_feature: "Organised firms are registered, with written contracts and fixed jobs. Which choice shows a worker won't lose the job easily?"
  k9_gne: "GNE has the word 'expenditure' in it. Each method gives the total that matches its own name."
  k9_inputs_sector: "Fertilizers and machines are made in factories. Which sector makes things in factories?"
  k9_utilities_sector: "Generating power and supplying gas and water is treated as producing things, along with factories. Which sector makes goods?"
  k9_fishing_sector: "Fishing takes something straight from nature, like farming and mining. Is that the first, second or third sector?"
  sector_kinds: "Sort by what the work does: takes from nature (farming, fishing, mining), makes things (including power and water supply), or gives services. The national office for statistics publishes the figures. The sectors depend on each other."
  ni_methods: "India's financial year starts in spring, when the old year's accounts close. In NI = r + w + i + p, each letter is a factor payment; add them. In the expenditure method, add C + I + G and then exports minus imports."
  final_intermediate: "Ask: is the good used up by the buyer, or used to make something else? Counting the raw material and the finished product both means counting it twice."
  gdp_gnp: "GDP counts final goods and services produced inside the country's domestic territory. GNP = GDP + income of Indians and Indian firms abroad − income earned in India by foreigners and foreign firms."
  nnp_pci: "NNP = GNP − depreciation. Per capita income = national income ÷ total population."
  gva_formula: "GVA = gross product value − value of intermediate consumption. GDP = GVA + (product tax − product subsidy)."
  organised_sector: "The organised sector is registered under law, with fixed jobs, contracts and security; the unorganised sector has daily wages and no contract. Gig workers were covered by the 2020 code; the earlier unorganised workers' act came in the late 2000s."
  tertiary_growth: "India's GVA (2022-23) and Kerala's GSVA: the tertiary (service) sector gives the largest share, helped by health and education, banking and insurance, transport and communication, tourism and knowledge-based industries."
  ss13e_sector_test: 'Ask what the worker does: takes something straight from nature, makes or builds something, or gives a service.'
  ss13e_add_all: National income adds up every part of the formula. Check you have not left one out.
  ss13e_net_exports: 'In the expenditure method, exports are added and imports are taken away: (X − M).'
  ss13e_final_only: Count only what reaches the final user. Goods used up to make something else are already inside the final price.
  ss13e_inside_vs_residents: GDP asks 'where was it produced?' (inside the country). GNP asks 'who produced it?' (the country's own people and firms, anywhere).
  ss13e_depreciation: Wear and tear is a loss, so it is taken away from GNP, not added.
  ss13e_per_head: 'Per capita means per person: divide the total income by the number of people.'
  ss13e_gva_minus: 'Value added means what this unit added: its output minus the inputs it bought.'
  ss13e_tax_subsidy: To go from GVA to GDP, add the taxes on products and take away the subsidies.
  ss13e_registered: Organised work is registered under a law and gives contracts, fixed pay and security. Unorganised work has none of these.

concepts:
  - code: ss9.sectors.three_sectors
    title: Primary, secondary and tertiary sectors
    notes: |
      Economic activities give people income. The National Statistical Office (NSO, formed in 2019 by
      combining the CSO and NSSO) groups them into three sectors. Primary sector: activities that use
      natural resources directly (agriculture, animal husbandry, fishing, forestry, mining, quarrying);
      also called the agricultural sector. Secondary sector: industry and manufacturing, processing
      primary-sector raw materials into finished goods; also construction, electricity, gas and water
      supply; called the industrial sector. Tertiary sector: transport, communication, trade, banking,
      insurance, hotels, real estate, health and education; called the service sector. The economy grows
      when the three sectors work in tandem: to grow more sugarcane, the farmer gets machinery and
      fertilizers from the secondary sector and transport and financial help from the tertiary sector.
      Production, distribution and consumption are the major economic activities.
    explanations:
      text: "Every job belongs to one of three sectors. If it takes something straight from nature, it is primary. If it makes something out of raw materials, it is secondary. If it gives a service, it is tertiary. The three depend on each other."
      visual: "Picture a coconut. Climbing the tree and picking it is primary. Making coconut oil in a mill is secondary. Carrying the oil to shops by lorry, selling it and the bank loan for the mill are tertiary."
      step_by_step: "To place an activity: Step 1: does it take a product directly from land, water or forests? Then primary. Step 2: does it change raw materials into a new product, or build something? Then secondary. Step 3: does it serve people without making a product (teaching, transport, banking)? Then tertiary."
      real_world: "In your family or street, list five jobs and sort them: a fisherman (primary), a carpenter (secondary), a nurse, bus driver or bank clerk (tertiary)."
    activity:
      type: sort
      prompt: Which sector?
      bins:
      - Primary
      - Secondary
      - Tertiary
      items:
      - label: Fishing
        bin: Primary
        clue: Takes directly from nature.
        why: Primary.
      - label: Mining
        bin: Primary
        clue: Takes from the earth.
        why: Primary.
      - label: Growing rubber
        bin: Primary
        clue: Agriculture.
        why: Primary.
      - label: Making tyres from rubber
        bin: Secondary
        clue: Processes a raw material into goods.
        why: Secondary (industry).
      - label: Building a bridge
        bin: Secondary
        clue: Construction counts as industry.
        why: Secondary.
      - label: Electricity supply
        bin: Secondary
        clue: Grouped with industry, like gas and water supply.
        why: Secondary.
      - label: Banking
        bin: Tertiary
        clue: A service, nothing is made.
        why: Tertiary.
      - label: Teaching
        bin: Tertiary
        clue: A service.
        why: Tertiary.
      - label: Transporting tyres to shops
        bin: Tertiary
        clue: Moving goods is a service.
        why: Tertiary.
    lesson:
      - teach: 'Economic activities are sorted into three sectors. Primary: uses nature directly (farming, fishing, forestry, mining). Secondary: turns raw materials into goods (factories, construction, electricity, gas, water supply). Tertiary: gives services (transport, banking, trade, health, education).'
        picture:
          kind: compare
          columns:
          - title: Primary
            points:
            - from nature
            - farming, fishing, mining
          - title: Secondary
            points:
            - makes goods
            - factories, construction, power
          - title: Tertiary
            points:
            - gives services
            - transport, banks, schools
          alt: The three sectors of the economy.
        check:
          prompt: A coir factory making mats belongs to which sector?
          options:
          - Secondary
          - Primary
          - Tertiary
          answer: Secondary
          why: It turns coconut fibre into a finished product.
        ways:
        - style: step_by_step
          teach: 'Step 1: does the work take something straight from nature, like fish, crops or minerals? Primary sector. Step 2: does it turn raw materials into goods, like coir into mats or cotton into cloth? Secondary sector. Step 3: does it give a service, like transport, banking, teaching or treatment? Tertiary sector.'
      - teach: The sectors depend on each other. A sugarcane farmer (primary) needs fertiliser and machines (secondary) and trucks and bank loans (tertiary). The sugar mill needs the farmer's cane. Production, distribution and consumption tie them together.
        picture:
          kind: flow
          steps:
          - Farmer grows cane (primary)
          - Mill makes sugar (secondary)
          - Truck and shop sell it (tertiary)
          alt: Sugar moves through all three sectors.
        check:
          prompt: The truck taking sugar to shops is in which sector?
          options:
          - Tertiary
          - Primary
          - Secondary
          answer: Tertiary
          why: Transport is a service.
        ways:
        - style: visual
          teach: 'Follow sugar from field to shop. The farmer grows cane (primary), the mill makes sugar (secondary), and trucks, banks and shops get it to you (tertiary). Each sector needs the others: the farmer needs machines and loans, the mill needs the cane.'
          picture:
            kind: flow
            alt: Farmer grows sugarcane (primary), mill makes sugar (secondary), truck and shop bring it to buyers (tertiary).
            steps:
            - Farmer grows cane (primary)
            - Mill makes sugar (secondary)
            - Truck and shop sell it (tertiary)
    items:
      - prompt: "Fishing belongs to which sector?"
        options: ["Primary", "Secondary", "Tertiary"]
        answer: "Primary"
        difficulty: 1
        hints: ["It uses a natural resource directly."]
        solution: "Fishing uses natural resources directly, so it is primary."
        mistakes: {"Tertiary": k9_fishing_sector}
      - prompt: "Electricity, gas and water supply are included in which sector?"
        options: ["Secondary", "Primary", "Tertiary"]
        answer: "Secondary"
        difficulty: 1
        hints: ["Look at Fig 5.3 in the textbook."]
        solution: "They are part of the secondary (industrial) sector."
        mistakes: {"Tertiary": k9_utilities_sector}
      - prompt: "Why is the tertiary sector also called the service sector?"
        options: ["It provides services such as health, education, transport and banking", "It grows food", "It makes machines", "It is run only by the government"]
        answer: "It provides services such as health, education, transport and banking"
        difficulty: 1
        hints: ["It helps the other two sectors store and market goods."]
        solution: "Its activities are services."
        mistakes: {"It makes machines": sector_kinds}
      - prompt: "Which office collects and publishes India's economic statistics, including national income?"
        options: ["National Statistical Office (NSO)", "Reserve Bank of India", "Election Commission", "NITI Aayog"]
        answer: "National Statistical Office (NSO)"
        difficulty: 2
        hints: ["It was formed in 2019 by combining the CSO and NSSO."]
        solution: "The NSO."
        mistakes: {"Reserve Bank of India": sector_kinds}
      - prompt: "A sugarcane farmer gets fertilizers and machinery. Which sector supplies them?"
        options: ["Secondary", "Tertiary", "Primary"]
        answer: "Secondary"
        difficulty: 2
        hints: ["They are manufactured in factories."]
        solution: "The secondary sector; transport and loans come from the tertiary sector."
        mistakes: {"Tertiary": k9_inputs_sector}
      - prompt: "What does the sugarcane example show?"
        options: ["The three sectors depend on each other", "Only agriculture matters", "Industry can work without raw materials", "Services do not help production"]
        answer: "The three sectors depend on each other"
        difficulty: 2
        hints: ["Inputs come from the other two sectors."]
        solution: "Interdependence between sectors completes the production process."
        mistakes: {"Only agriculture matters": sector_kinds}
      - prompt: "Using goods and services to satisfy needs and wants is called"
        options: ["consumption", "production", "distribution", "saving"]
        answer: "consumption"
        difficulty: 3
        hints: ["Production makes goods; distribution allocates them or the income."]
        solution: "Consumption."
        mistakes: {"distribution": sector_kinds}
      - prompt: "A software company in Technopark, Thiruvananthapuram, belongs to which sector?"
        options: ["Tertiary", "Primary", "Secondary", "None of these"]
        answer: "Tertiary"
        difficulty: 2
        hints: ["Does it take things from nature, make goods in a factory, or provide a service?", "Software and IT services are knowledge services."]
        solution: "Step 1: It does not farm, mine or manufacture goods. Step 2: It provides IT services, so it is in the tertiary (service) sector."
        mistakes: {"Primary": sector_kinds, "Secondary": sector_kinds, "None of these": sector_kinds}
      - prompt: "Which of these activities is in the secondary sector?"
        options: ["Making coir mats from coconut fibre", "Catching fish", "Teaching in a school", "Growing coconut trees"]
        answer: "Making coir mats from coconut fibre"
        difficulty: 2
        hints: ["The secondary sector turns raw materials into goods.", "Which choice makes a new product?"]
        solution: "Step 1: Fishing and growing coconuts are primary; teaching is tertiary. Step 2: Making mats from fibre is manufacturing: secondary."
        mistakes: {"Catching fish": k9_fishing_sector, "Teaching in a school": sector_kinds, "Growing coconut trees": sector_kinds}
      - prompt: "A farmer grows sugarcane, a mill makes sugar from it, and a truck carries the sugar to shops. Which sectors are these, in order?"
        options:
        - "Primary, secondary, tertiary"
        - "Secondary, primary, tertiary"
        - "Primary, tertiary, secondary"
        - "Tertiary, secondary, primary"
        answer: "Primary, secondary, tertiary"
        difficulty: 3
        hints: ["Ask of each step: is it using nature directly, making goods, or giving a service?", "Transport is a service."]
        solution: "Step 1: Growing sugarcane uses natural resources directly: primary. Step 2: Making sugar is manufacturing: secondary. Step 3: Transport is a service: tertiary."
        mistakes: {"Secondary, primary, tertiary": sector_kinds, "Primary, tertiary, secondary": sector_kinds}
      - prompt: Mining and quarrying belong to which sector?
        options:
        - Primary
        - Secondary
        - Tertiary
        - None
        answer: Primary
        difficulty: 1
        hints:
        - Where do the stones and minerals come from?
        - Taking things straight from nature.
        solution: 'Step 1: Mining takes minerals from the earth. Step 2: Direct use of nature is one sector. Step 3: Primary.'
        mistakes:
          Secondary: ss13e_sector_test
      - prompt: A teacher in a government school works in which sector?
        options:
        - Tertiary
        - Primary
        - Secondary
        - Agricultural
        answer: Tertiary
        difficulty: 1
        hints:
        - Does a teacher grow, make, or serve?
        - Education is a service.
        solution: 'Step 1: A teacher does not grow or make goods. Step 2: Teaching is a service. Step 3: Tertiary.'
        mistakes:
          Secondary: ss13e_sector_test
      - prompt: Building a new bridge belongs to which sector?
        options:
        - Secondary
        - Primary
        - Tertiary
        - Service
        answer: Secondary
        difficulty: 2
        hints:
        - Construction is grouped with industry.
        - Something new is being built.
        solution: 'Step 1: Construction makes new structures. Step 2: It is grouped with industry. Step 3: Secondary.'
        mistakes:
          Tertiary: ss13e_sector_test
      - prompt: The secondary sector is also called the
        options:
        - Industrial sector
        - Service sector
        - Agricultural sector
        - Unorganised sector
        answer: Industrial sector
        difficulty: 1
        hints:
        - It is about factories.
        - Primary is agricultural, tertiary is service.
        solution: 'Step 1: Primary = agricultural. Step 2: Tertiary = service. Step 3: Secondary = industrial.'
        mistakes:
          Service sector: sector_kinds
      - prompt: The NSO was formed in 2019 by combining which two offices?
        options:
        - CSO and NSSO
        - RBI and SBI
        - NITI Aayog and Planning Commission
        - Census and Election Commission
        answer: CSO and NSSO
        difficulty: 2
        hints:
        - Both were statistics offices.
        - One was 'Central', the other did 'Sample Surveys'.
        solution: 'Step 1: NSO is a statistics office. Step 2: It joined the Central Statistical Office and the National Sample Survey Office. Step 3: CSO and NSSO.'
        mistakes:
          RBI and SBI: sector_kinds

  - code: ss9.sectors.national_income
    title: Measuring national income
    after: [ss9.sectors.three_sectors]
    notes: |
      National income is the sum total of the money value of all final goods and services produced in
      an accounting year (in India, 1 April to 31 March). Final goods are consumed directly; intermediate
      goods are raw materials for another product. Why measure it: to understand the country's growth,
      the contribution of each sector, to plan projects, compare countries, understand investment and
      spending, and see the economy's strengths and weaknesses. Three methods: Product method: add the
      value of all final goods and services from the three sectors (NI = x1 + x2 + ... + xn). Income
      method: NI = r + w + i + p (rent from land, wages from labour, interest from capital, profit from
      organisation); gives Gross National Income (GNI). Expenditure method: NI = C + I + G + (X − M)
      (consumption, investment, government expenditure, net exports); gives Gross National Expenditure
      (GNE). All three give the same value. Limits: lack of accurate data, double counting, goods made
      for self-consumption and household work not counted, products with no market value left out.
    explanations:
      text: "National income is the value of everything a country finally produces in a year. You can count it three ways: what was produced, what people earned, or what was spent. Done right, all three give the same total."
      visual: "Draw a circle: firms produce goods (product method) → they pay rent, wages, interest and profit (income method) → people spend that money on goods (expenditure method) → back to firms."
      step_by_step: "Expenditure method: Step 1: add consumption (C). Step 2: add investment (I). Step 3: add government spending (G). Step 4: add exports and subtract imports (X − M). The total is national income."
      real_world: "Your mother's home cooking and cleaning are real work, but they are not counted in national income because no money is paid. That is one limitation of measuring it."
    activity:
      type: sort
      prompt: Which way of measuring national income uses it?
      bins:
      - Product method
      - Income method
      - Expenditure method
      - Not counted
      items:
      - label: Value of all final goods from three sectors
        bin: Product method
        clue: Add up what is produced.
        why: Product method.
      - label: Rent + wages + interest + profit
        bin: Income method
        clue: Rewards to the factors.
        why: 'Income method: r + w + i + p.'
      - label: Wages paid to workers
        bin: Income method
        clue: A factor reward.
        why: Income method.
      - label: Consumption + investment + government spending
        bin: Expenditure method
        clue: What is spent.
        why: 'Expenditure method: C + I + G + (X − M).'
      - label: Exports minus imports
        bin: Expenditure method
        clue: Net exports.
        why: Part of C + I + G + (X − M).
      - label: Sugarcane bought by a sugar mill
        bin: Not counted
        clue: 'Intermediate good: is its value already in the sugar?'
        why: Counting it again would be double counting.
      - label: Cooking done at home for the family
        bin: Not counted
        clue: Is it sold in a market?
        why: Household work has no market value, so it is left out.
    lesson:
      - teach: National income is the money value of all final goods and services produced in a country in one financial year (1 April to 31 March). Only final goods count. Intermediate goods, like flour used to bake bread, are already inside the final price; counting them again is double counting.
        picture:
          kind: flow
          steps:
          - Wheat ₹100
          - Flour ₹150
          - Bread ₹220
          - Count only the final ₹220
          alt: Only the final value is counted to avoid double counting.
        check:
          prompt: Why is the flour sold to a bakery not counted separately?
          options:
          - Its value is already inside the bread's price
          - Flour is not a good
          - Bakeries pay no tax
          answer: Its value is already inside the bread's price
          why: Counting it again would be double counting.
        ways:
        - style: real_world
          teach: A bakery buys flour for ₹40 and sells bread for ₹100. If we counted both the flour and the bread, we'd add the flour twice, because its cost is already inside the bread's price. That's why national income counts only final goods and services made in a year, 1 April to 31 March.
      - teach: 'Three methods give the same answer. Product method: add all final output of the three sectors. Income method: NI = r + w + i + p (rent, wages, interest, profit). Expenditure method: NI = C + I + G + (X − M): consumption, investment, government spending, plus exports minus imports.'
        picture:
          kind: compare
          columns:
          - title: Product
            points:
            - add final output
            - of all sectors
          - title: Income
            points:
            - r + w + i + p
            - gives GNI
          - title: Expenditure
            points:
            - C + I + G + (X − M)
            - gives GNE
          alt: Three ways to measure national income.
        check:
          prompt: In C + I + G + (X − M), M stands for
          options:
          - Imports
          - Money
          - Machines
          answer: Imports
          why: Imports are spending on goods made abroad, so they are taken away.
        ways:
        - style: visual
          teach: 'Three ways to measure the same national income. Add up everything produced (product method). Add up what everyone earned: rent, wages, interest, profit (income method). Or add up what was spent: C + I + G + (X − M) (expenditure method).'
          picture:
            kind: compare
            alt: Product method adds final output; income method adds rent, wages, interest, profit; expenditure method adds C + I + G + exports minus imports.
            columns:
            - title: Product
              points:
              - Final output of all sectors
            - title: Income
              points:
              - r + w + i + p
            - title: Expenditure
              points:
              - C + I + G + (X − M)
    items:
      - prompt: "India's financial year starts on"
        options: ["1 April", "1 January", "15 August", "1 June"]
        answer: "1 April"
        difficulty: 1
        hints: ["It ends on 31 March."]
        solution: "1 April to 31 March."
        mistakes: {"1 January": ni_methods}
      - prompt: "In the income method, NI = r + w + i + p. What does 'w' stand for?"
        options: ["Wages", "Wealth", "Water", "Weight"]
        answer: "Wages"
        difficulty: 1
        hints: ["It is the reward for labour."]
        solution: "w = wages (labour); r = rent, i = interest, p = profit."
        mistakes: {"Wealth": ni_methods}
      - prompt: "Rent ₹20 crore, wages ₹50 crore, interest ₹10 crore, profit ₹20 crore. National income by the income method, in ₹ crore?"
        answer: "100"
        check: "20 + 50 + 10 + 20"
        difficulty: 1
        hints: ["NI = r + w + i + p."]
        solution: "Step 1: 20 + 50 = 70. Step 2: 70 + 10 + 20 = 100 crore."
        mistakes: {"80": ni_methods}
      - prompt: "C = 300, I = 100, G = 150, exports X = 60, imports M = 80 (₹ crore). National income by the expenditure method?"
        answer: "530"
        check: "300 + 100 + 150 + (60 - 80)"
        difficulty: 2
        hints: ["NI = C + I + G + (X − M). Net exports here are negative."]
        solution: "Step 1: C + I + G = 550. Step 2: X − M = 60 − 80 = −20. Step 3: 550 − 20 = 530 crore."
        mistakes: {"690": ni_methods, "570": ni_methods}
      - prompt: "Flour bought by a bakery to make bread is"
        options: ["an intermediate good", "a final good", "a service", "a subsidy"]
        answer: "an intermediate good"
        difficulty: 2
        hints: ["It is used as raw material for another product."]
        solution: "Intermediate good; the bread sold to you is the final good."
        mistakes: {"a final good": final_intermediate}
      - prompt: "Which method gives Gross National Expenditure (GNE)?"
        options: ["Expenditure method", "Income method", "Product method"]
        answer: "Expenditure method"
        difficulty: 2
        hints: ["The income method gives GNI."]
        solution: "Expenditure method."
        mistakes: {"Income method": k9_gne}
      - prompt: "Counting the value of cotton, then yarn, then cloth made from that yarn, all in national income, is the problem of"
        options: ["double counting", "depreciation", "net exports", "per capita income"]
        answer: "double counting"
        difficulty: 3
        hints: ["The cotton's value is already inside the cloth's value."]
        solution: "Double counting: the same value counted at more than one stage of production."
        mistakes: {"depreciation": final_intermediate}
      - prompt: "A farmer sells wheat to a miller for ₹100. The miller sells the flour to a baker for ₹150. The baker sells bread for ₹220. How many rupees are added to national income?"
        answer: "220"
        check: "220"
        difficulty: 3
        hints: ["Which of these is the final good?", "The wheat and flour are used up in making the bread."]
        solution: "Step 1: Wheat and flour are intermediate goods. Step 2: Only the final good, bread worth ₹220, is counted, to avoid double counting."
        mistakes: {"470": final_only, "370": final_only, "120": final_only}
      - prompt: "Using the expenditure method: C = 500, I = 200, G = 250, exports X = 100 and imports M = 150 (₹ crore). What is national income, in ₹ crore?"
        answer: "900"
        check: "500 + 200 + 250 + (100 - 150)"
        difficulty: 2
        hints: ["NI = C + I + G + (X − M).", "Imports are subtracted."]
        solution: "Step 1: C + I + G = 950. Step 2: X − M = −50. Step 3: NI = 900."
        mistakes: {"1200": ni_methods, "1000": ni_methods, "950": ni_methods}
      - prompt: India's financial year ends on
        options:
        - 31 March
        - 31 December
        - 30 June
        - 1 April
        answer: 31 March
        difficulty: 1
        hints:
        - It begins on 1 April.
        - It runs for twelve months from there.
        solution: 'Step 1: Starts 1 April. Step 2: Twelve months later is the day before 1 April. Step 3: 31 March.'
        mistakes:
          1 April: nnp_pci
      - prompt: Rent ₹15 crore, wages ₹60 crore, interest ₹10 crore, profit ₹25 crore. National income by the income method (₹ crore)?
        answer: '110'
        check: 15 + 60 + 10 + 25
        difficulty: 2
        hints:
        - Use NI = r + w + i + p.
        - Add all four.
        solution: 'Step 1: 15 + 60 = 75. Step 2: 75 + 10 + 25 = 110. Step 3: ₹110 crore.'
        mistakes:
          '85': ss13e_add_all
      - prompt: C = 400, I = 150, G = 200, X = 50, M = 100 (₹ crore). National income by the expenditure method?
        answer: '700'
        check: 400 + 150 + 200 + (50 - 100)
        difficulty: 3
        hints:
        - Use C + I + G + (X − M).
        - X − M here is negative.
        solution: 'Step 1: C + I + G = 750. Step 2: X − M = 50 − 100 = −50. Step 3: 750 − 50 = 700.'
        mistakes:
          '900': ss13e_net_exports
          '800': ss13e_net_exports
      - prompt: Which is a limitation in measuring national income?
        options:
        - Household work is not counted
        - Every good has a market price
        - Data is always exact
        - Only exports are counted
        answer: Household work is not counted
        difficulty: 2
        hints:
        - Some useful work has no price tag.
        - Think of cooking and caring at home.
        solution: 'Step 1: NI counts things with market value. Step 2: Unpaid home work has none. Step 3: It is left out.'
        mistakes:
          Every good has a market price: ss13e_final_only
      - prompt: Which is a final good?
        options:
        - A shirt bought by a family
        - Cotton bought by a spinning mill
        - Steel bought by a car factory
        - Paint bought by a furniture maker
        answer: A shirt bought by a family
        difficulty: 1
        hints:
        - Who uses it, and for what?
        - A final good is not used to make another product.
        solution: 'Step 1: Cotton, steel and paint go into other products. Step 2: The family wears the shirt. Step 3: The shirt is final.'
        mistakes:
          Cotton bought by a spinning mill: ss13e_final_only
      - prompt: Which method of measuring national income gives Gross National Income (GNI)?
        options:
        - Income method
        - Expenditure method
        - Product method
        - Census method
        answer: Income method
        difficulty: 2
        hints:
        - It adds what each factor earns.
        - Rent, wages, interest, profit.
        solution: 'Step 1: GNE comes from spending. Step 2: Adding earnings of factors gives income. Step 3: Income method.'
        mistakes:
          Expenditure method: ni_methods

  - code: ss9.sectors.gdp_gnp
    title: GDP, GNP, NNP and per capita income
    after: [ss9.sectors.national_income]
    notes: |
      GDP: money value of all final goods and services produced within the domestic territory of a
      country (includes air space, territorial waters, own embassies abroad, exclusive fishing and
      mining zones, offshore free zones; foreign embassies in India are not ours). Income of Indians
      working abroad and profits of Indian firms abroad are not in GDP. GNP: add the income of Indians and
      Indian firms abroad to GDP and exclude income earned in India by foreign nationals and firms; it is
      production by the residents of a country, at home and abroad. Depreciation: cost of wear and tear of
      vehicles and machinery. NNP = GNP − depreciation. Per capita income (PCI) = national income ÷ total
      population. If population grows faster than national income, PCI falls. If only a small group's
      income rises, PCI can rise while most people are no better off.
    explanations:
      text: "GDP asks 'what was produced inside India?'. GNP asks 'what did Indians produce, anywhere?'. NNP takes away the wear and tear of machines. Per capita income shares the national income equally among all people."
      visual: "A table with two columns: Inside India (GDP) and Indians abroad (+) minus foreigners in India (−). GDP + (+) − (−) = GNP. Then GNP − depreciation = NNP."
      step_by_step: "Per capita income: Step 1: take national income. Step 2: divide by total population. Example: ₹1,000 crore ÷ 10 lakh people = ₹10,000 per person."
      real_world: "Many Keralites work in the Gulf. Their earnings are part of India's GNP but not India's GDP."
    activity:
      type: sort
      prompt: Is it part of India's GDP?
      bins:
      - In India's GDP
      - Not in GDP, but in GNP
      - Not India's at all
      items:
      - label: A foreign company's factory in Chennai
        bin: In India's GDP
        clue: Produced inside India's territory.
        why: In GDP. It is taken out for GNP, since the owners are foreign.
      - label: India's embassy in Paris
        bin: In India's GDP
        clue: Our own embassies abroad count as our territory.
        why: In GDP.
      - label: Fishing in India's exclusive zone
        bin: In India's GDP
        clue: Part of the domestic territory.
        why: In GDP.
      - label: Salary of an Indian nurse in Dubai
        bin: Not in GDP, but in GNP
        clue: Earned outside India, by an Indian.
        why: Not GDP; added for GNP.
      - label: Profit of an Indian firm abroad
        bin: Not in GDP, but in GNP
        clue: Earned abroad by Indians.
        why: Added for GNP.
      - label: The US embassy in New Delhi
        bin: Not India's at all
        clue: Foreign embassies here are not our territory.
        why: Not in India's GDP.
    lesson:
      - teach: 'GDP is the value of all final goods and services produced inside a country''s borders (including its waters, air space and its embassies abroad), whoever produces them. GNP looks at the country''s own people: GNP = GDP + income Indians earn abroad − income foreigners earn in India.'
        picture:
          kind: flow
          steps:
          - Start with GDP
          - + income of Indians abroad
          - − income of foreigners in India
          - = GNP
          alt: How to go from GDP to GNP.
        check:
          prompt: An Indian company's profit in Dubai is counted in
          options:
          - India's GNP
          - India's GDP
          - Neither
          answer: India's GNP
          why: GNP counts Indian residents' income, wherever earned.
        ways:
        - style: real_world
          teach: 'GDP asks: what was made inside India''s borders, by anyone? GNP asks: what did Indians earn, anywhere? So a Malayali nurse''s salary in Dubai is in India''s GNP, not its GDP, and a foreign company''s profit in Chennai is in India''s GDP, but taken out of GNP.'
      - teach: 'Machines and vehicles wear out: that loss is depreciation. NNP = GNP − depreciation. Per capita income = national income ÷ population. If population grows faster than income, per capita income falls.'
        check:
          prompt: Per capita income is found by
          options:
          - National income ÷ population
          - National income × population
          - GNP − depreciation
          answer: National income ÷ population
          why: It is the average income per person.
        ways:
        - style: step_by_step
          teach: 'Step 1: start with GNP. Step 2: take away depreciation, the value of machines and vehicles worn out in the year: that gives NNP. Step 3: for per capita income, divide national income by the population. If population grows faster than income, per capita income falls.'
    items:
      - prompt: "GNP is ₹500 crore and depreciation is ₹40 crore. What is NNP (₹ crore)?"
        answer: "460"
        check: "500 - 40"
        difficulty: 1
        hints: ["NNP = GNP − depreciation."]
        solution: "500 − 40 = 460 crore."
        mistakes: {"540": nnp_pci}
      - prompt: "A country's national income is ₹60,000 crore and its population is 2 crore. What is its per capita income in ₹?"
        answer: "30000"
        check: "60000/2"
        difficulty: 1
        hints: ["PCI = national income ÷ population. Both are in crore, so the crores cancel."]
        solution: "60,000 crore ÷ 2 crore = ₹30,000 per person."
        mistakes: {"120000": nnp_pci}
      - prompt: "The profit an Indian company earns abroad is included in"
        options: ["India's GNP, not India's GDP", "India's GDP, not India's GNP", "both GDP and GNP", "neither"]
        answer: "India's GNP, not India's GDP"
        difficulty: 2
        hints: ["GDP counts only production inside the domestic territory."]
        solution: "GNP includes Indians' income abroad; GDP does not."
        mistakes: {"India's GDP, not India's GNP": gdp_gnp}
      - prompt: "India's GDP is ₹1,000 crore. Indians abroad earn ₹80 crore and foreigners earn ₹30 crore in India. What is India's GNP (₹ crore)?"
        answer: "1050"
        check: "1000 + 80 - 30"
        difficulty: 2
        hints: ["Add income from abroad; subtract foreigners' income in India."]
        solution: "Step 1: 1000 + 80 = 1080. Step 2: 1080 − 30 = 1050 crore."
        mistakes: {"1110": gdp_gnp, "1080": gdp_gnp}
      - prompt: "Which of these is NOT part of India's economic territory?"
        options: ["A foreign country's embassy in New Delhi", "India's territorial waters", "Indian embassies abroad", "India's air space"]
        answer: "A foreign country's embassy in New Delhi"
        difficulty: 2
        hints: ["Foreign embassies in India belong to the economic territory of their own country."]
        solution: "Foreign embassies in India are not included."
        mistakes: {"Indian embassies abroad": gdp_gnp}
      - prompt: "National income grows by 2% but population grows by 5%. What happens to per capita income?"
        options: ["It falls", "It rises", "It stays the same"]
        answer: "It falls"
        difficulty: 3
        hints: ["The same income is shared among more people."]
        solution: "Population rises faster than income, so each person's share falls."
        mistakes: {"It rises": nnp_pci}
      - prompt: "India's GDP is ₹2,000 crore. Indians abroad earn ₹150 crore and foreigners in India earn ₹250 crore. What is India's GNP, in ₹ crore?"
        answer: "1900"
        check: "2000 + 150 - 250"
        difficulty: 3
        hints: ["GNP = GDP + income earned by Indians abroad − income earned by foreigners in India.", "Net income from abroad here is negative."]
        solution: "Step 1: Net factor income from abroad = 150 − 250 = −100. Step 2: GNP = 2000 − 100 = 1900."
        mistakes: {"2400": gdp_gnp, "2100": gdp_gnp, "2150": gdp_gnp}
      - prompt: "Country X has a national income of ₹90,000 crore and 3 crore people. Country Y has ₹1,20,000 crore and 6 crore people. Which has the higher per capita income?"
        options: ["Country X", "Country Y", "Both are equal", "You cannot compare them"]
        answer: "Country X"
        difficulty: 3
        hints: ["Divide each national income by its population.", "X: 90,000 ÷ 3. Y: 1,20,000 ÷ 6."]
        solution: "Step 1: X = ₹30,000 per person. Step 2: Y = ₹20,000 per person. Step 3: X is higher, though Y's total is bigger."
        mistakes: {"Country Y": per_head, "Both are equal": per_head, "You cannot compare them": per_head}
      - prompt: GNP is ₹800 crore and depreciation is ₹50 crore. What is NNP (₹ crore)?
        answer: '750'
        check: 800 - 50
        difficulty: 1
        hints:
        - NNP = GNP − depreciation.
        - 800 − 50.
        solution: 'Step 1: Depreciation is subtracted. Step 2: 800 − 50 = 750. Step 3: ₹750 crore.'
        mistakes:
          '850': ss13e_depreciation
      - prompt: National income is ₹1,00,000 crore and population is 4 crore. Per capita income (₹)?
        answer: '25000'
        check: 100000/4
        difficulty: 2
        hints:
        - Per capita = per person.
        - Divide 1,00,000 by 4 (crores cancel).
        solution: 'Step 1: ₹1,00,000 crore ÷ 4 crore people. Step 2: The crores cancel. Step 3: ₹25,000 per person.'
        mistakes:
          '400000': ss13e_per_head
      - prompt: A Japanese car company's factory in Chennai produces cars. Their value is counted in
        options:
        - India's GDP
        - India's GNP only
        - Japan's GDP
        - Neither country
        answer: India's GDP
        difficulty: 2
        hints:
        - Where is the factory?
        - GDP is about where production happens.
        solution: 'Step 1: The cars are made inside India. Step 2: GDP counts production inside the borders. Step 3: India''s GDP.'
        mistakes:
          Japan's GDP: ss13e_inside_vs_residents
      - prompt: India's GDP is ₹1,500 crore. Indians abroad earn ₹100 crore; foreigners in India earn ₹60 crore. GNP (₹ crore)?
        answer: '1540'
        check: 1500 + 100 - 60
        difficulty: 3
        hints:
        - Add Indians' income abroad.
        - Take away foreigners' income in India.
        solution: 'Step 1: 1500 + 100 = 1600. Step 2: 1600 − 60 = 1540. Step 3: ₹1,540 crore.'
        mistakes:
          '1660': ss13e_inside_vs_residents
          '1440': ss13e_inside_vs_residents
      - prompt: The cost of wear and tear of machines and vehicles is called
        options:
        - Depreciation
        - Subsidy
        - Interest
        - Rent
        answer: Depreciation
        difficulty: 1
        hints:
        - Machines lose value as they are used.
        - This loss is taken away from GNP to get NNP.
        solution: 'Step 1: Machines wear out. Step 2: The lost value has a name. Step 3: Depreciation.'
        mistakes:
          Subsidy: ss13e_depreciation
      - prompt: Which is part of India's economic territory?
        options:
        - Indian embassy in Paris
        - French embassy in New Delhi
        - A US factory in Texas
        - A ship of Japan in Tokyo
        answer: Indian embassy in Paris
        difficulty: 2
        hints:
        - A country's embassies abroad count as its own territory.
        - Foreign embassies in India do not count as India's.
        solution: 'Step 1: Embassies belong to the country that owns them. Step 2: India''s own embassy is Indian territory. Step 3: Indian embassy in Paris.'
        mistakes:
          French embassy in New Delhi: ss13e_inside_vs_residents
      - prompt: National income rises by 6% and population by 2%. What happens to per capita income?
        options:
        - It rises
        - It falls
        - It stays the same
        - It becomes zero
        answer: It rises
        difficulty: 3
        hints:
        - Compare how fast the top and bottom of the division grow.
        - Income is growing faster than people.
        solution: 'Step 1: PCI = income ÷ population. Step 2: Income grows faster. Step 3: Per capita income rises.'
        mistakes:
          It falls: ss13e_per_head

  - code: ss9.sectors.gva
    title: Gross value added and sector shares
    after: [ss9.sectors.gdp_gnp]
    notes: |
      From January 2015 the NSO uses Gross Value Added (GVA) to find each sector's contribution (before
      that, GDP). GVA = gross product value − value of intermediate consumption. Taxes and subsidies on
      products are not counted in GVA; GDP = GVA + (product tax − product subsidy). Tax: compulsory payment
      to the government. Subsidy: financial support from the government. Economic Survey 2022-23 graph
      (1982-83 to 2022-23, constant prices): the agriculture share falls steadily; the service sector
      share keeps rising and is the largest (over half by 2022-23). Kerala's GSVA 2019-20 to 2022-23
      (Economic Review 2023): service sector about 60 to 64%, industry about 27 to 29%, agriculture
      about 9 to 10%. Reasons for tertiary growth: health and education programmes, banking and
      insurance, transport and communication, tourism, knowledge-based industries. Human capital:
      knowledge, skills, health and education. People under 35 are about 65% of India's population.
      Technopark and Infopark are Kerala's examples of the knowledge-based sector. Structural
      transformation: the change in the relative importance of sectors as an economy grows.
    explanations:
      text: "GVA is the new value a sector adds: what it produced minus the raw materials it used up. In both India and Kerala, services now add the most value, while agriculture's share has been falling."
      visual: "A bar chart: three colours (agriculture, industry, services) for 1982-83 to 2022-23. The agriculture bar shrinks each decade, the service bar grows tallest."
      step_by_step: "GVA example: Step 1: a furniture unit sells furniture worth ₹10 lakh. Step 2: it used wood and nails worth ₹6 lakh. Step 3: GVA = 10 − 6 = ₹4 lakh."
      real_world: "Technopark in Thiruvananthapuram and Infopark in Kochi employ thousands in software services, part of Kerala's large tertiary sector."
    activity:
      type: sort
      prompt: Find the value. GVA = output value − intermediate inputs.
      bins:
      - ₹40
      - ₹160
      - ₹200
      items:
      - label: Bread sold for ₹100, flour cost ₹60. GVA?
        bin: ₹40
        clue: Take away the inputs.
        why: 100 − 60 = 40. ₹160 would add the flour instead of taking it away.
      - label: Furniture sold for ₹500, wood cost ₹300. GVA?
        bin: ₹200
        clue: Output minus input.
        why: 500 − 300 = 200.
      - label: Cloth sold for ₹200, cotton cost ₹40. GVA?
        bin: ₹160
        clue: Output minus input.
        why: 200 − 40 = 160. ₹200 would forget the cotton.
      - label: GVA ₹150, product tax ₹20, subsidy ₹10. GDP?
        bin: ₹160
        clue: GDP = GVA + tax − subsidy.
        why: 150 + 20 − 10 = 160. Adding the subsidy would give 180.
      - label: Juice sold for ₹90, fruit cost ₹50. GVA?
        bin: ₹40
        clue: Output minus input.
        why: 90 − 50 = 40.
      - label: GVA ₹190, product tax ₹15, subsidy ₹5. GDP?
        bin: ₹200
        clue: Tax is added, subsidy taken away.
        why: 190 + 15 − 5 = 200.
    lesson:
      - teach: Since January 2015 the NSO measures each sector's contribution with Gross Value Added (GVA). GVA = value of output − value of inputs bought (intermediate consumption). GDP = GVA + product taxes − product subsidies.
        picture:
          kind: flow
          steps:
          - Output value
          - − inputs bought
          - = GVA
          - + product taxes − subsidies
          - = GDP
          alt: From output to GVA to GDP.
        check:
          prompt: A baker makes bread worth ₹10,000 using flour and gas worth ₹6,000. GVA?
          options:
          - ₹4,000
          - ₹16,000
          - ₹10,000
          answer: ₹4,000
          why: '10,000 − 6,000 = 4,000: what the baker added.'
        ways:
        - style: step_by_step
          teach: 'Step 1: write the value of what the firm produced, like bread worth ₹10,000. Step 2: write what it bought from others to make it, like flour and gas worth ₹6,000. Step 3: subtract: the value it added is GVA, ₹4,000. Step 4: for GDP, add product taxes and take away product subsidies.'
      - teach: Over 40 years, agriculture's share in India's GVA fell and services rose to over half. In Kerala, services give about 60–64%. This shift in the importance of sectors is called structural transformation. Tourism, IT (Technopark, Infopark), health, education and banking drove it.
        picture:
          kind: bars
          unit: '% of Kerala GSVA (approx.)'
          bars:
          - label: Services
            value: 62
          - label: Industry
            value: 28
          - label: Agriculture
            value: 10
          alt: Kerala's economy is mostly services.
        check:
          prompt: Which sector gives the biggest share of Kerala's GSVA?
          options:
          - Services
          - Agriculture
          - Industry
          answer: Services
          why: About three-fifths comes from services.
        ways:
        - style: real_world
          teach: Kerala's grandparents mostly farmed; many of their grandchildren work in hospitals, IT parks like Technopark and Infopark, banks and tourism. Over 40 years, farming's share of India's output fell and services rose to over half; in Kerala services give about 60–64%. This shift is structural transformation.
    items:
      - prompt: "A unit's gross product value is ₹50 lakh and its intermediate consumption is ₹30 lakh. What is its GVA (₹ lakh)?"
        answer: "20"
        check: "50 - 30"
        difficulty: 1
        hints: ["GVA = gross product value − intermediate consumption."]
        solution: "50 − 30 = 20 lakh."
        mistakes: {"80": gva_formula}
      - prompt: "GVA is ₹900 crore, product taxes ₹120 crore and product subsidies ₹20 crore. What is GDP (₹ crore)?"
        answer: "1000"
        check: "900 + (120 - 20)"
        difficulty: 2
        hints: ["GDP = GVA + (product tax − product subsidy)."]
        solution: "Step 1: 120 − 20 = 100. Step 2: 900 + 100 = 1000 crore."
        mistakes: {"1040": gva_formula, "880": gva_formula}
      - prompt: "From when has the NSO used GVA to find sector contributions?"
        options: ["January 2015", "1947", "2019", "1982"]
        answer: "January 2015"
        difficulty: 1
        hints: ["Before that, GDP was used."]
        solution: "From January 2015."
        mistakes: {"2019": gva_formula}
      - prompt: "Which sector's share in India's GVA has fallen steadily from 1982-83 to 2022-23?"
        options: ["Agriculture and allied", "Service", "Industry stayed the only growing one"]
        answer: "Agriculture and allied"
        difficulty: 2
        hints: ["Look at the trend in Fig 5.6."]
        solution: "The agriculture share keeps falling; the service share keeps rising."
        mistakes: {"Service": tertiary_growth}
      - prompt: "Which sector made the largest contribution to Kerala's GSVA in 2022-23?"
        options: ["Service sector", "Agriculture sector", "Industrial sector"]
        answer: "Service sector"
        difficulty: 2
        hints: ["It was over 60%."]
        solution: "The service (tertiary) sector."
        mistakes: {"Agriculture sector": tertiary_growth}
      - prompt: "Which is a reason for the growth of the tertiary sector's share?"
        options: ["Growth of tourism and knowledge-based industries", "Fewer schools and hospitals", "Less use of banks", "Closing of transport services"]
        answer: "Growth of tourism and knowledge-based industries"
        difficulty: 2
        hints: ["The textbook lists five reasons."]
        solution: "Health and education, banking, transport and communication, tourism and knowledge-based industries."
        mistakes: {"Fewer schools and hospitals": tertiary_growth}
      - prompt: "A change in the relative importance of sectors as an economy grows is called"
        options: ["structural transformation", "depreciation", "equilibrium", "double counting"]
        answer: "structural transformation"
        difficulty: 3
        hints: ["It changes each sector's contribution and its jobs."]
        solution: "Structural transformation."
        mistakes: {"equilibrium": tertiary_growth}
      - prompt: "A furniture maker produces goods worth ₹8 lakh in a year and uses wood worth ₹3 lakh and paint worth ₹1 lakh. What is its GVA, in ₹ lakh?"
        answer: "4"
        check: "8 - 3 - 1"
        difficulty: 2
        hints: ["GVA = gross product value − intermediate consumption.", "Wood and paint are both used up."]
        solution: "Step 1: Intermediate consumption = 3 + 1 = 4 lakh. Step 2: GVA = 8 − 4 = ₹4 lakh."
        mistakes: {"5": gva_formula, "12": gva_formula, "7": gva_formula}
      - prompt: "Agriculture's share of India's GVA has fallen for decades, yet farm output has grown. How can both be true?"
        options: ["Industry and services have grown much faster than agriculture", "Farm output really fell", "GVA does not include farming", "The population fell"]
        answer: "Industry and services have grown much faster than agriculture"
        difficulty: 3
        hints: ["A share is a part of a total.", "What happens to a slice if the rest of the cake grows faster?"]
        solution: "Step 1: Agriculture grew, but slowly. Step 2: Services and industry grew faster, so agriculture's share of the larger total shrank. This is structural transformation."
        mistakes: {"Farm output really fell": share_not_size, "GVA does not include farming": share_not_size, "The population fell": share_not_size}
      - prompt: A boat builder's output is worth ₹12 lakh; wood and nails cost ₹7 lakh. GVA (₹ lakh)?
        answer: '5'
        check: 12 - 7
        difficulty: 1
        hints:
        - Value added = output − inputs.
        - 12 − 7.
        solution: 'Step 1: Output 12 lakh. Step 2: Inputs 7 lakh. Step 3: GVA = 5 lakh.'
        mistakes:
          '19': ss13e_gva_minus
      - prompt: GVA is ₹500 crore, product taxes ₹60 crore, product subsidies ₹10 crore. GDP (₹ crore)?
        answer: '550'
        check: 500 + 60 - 10
        difficulty: 2
        hints:
        - GDP = GVA + taxes − subsidies.
        - 500 + 60 − 10.
        solution: 'Step 1: 500 + 60 = 560. Step 2: 560 − 10 = 550. Step 3: ₹550 crore.'
        mistakes:
          '570': ss13e_tax_subsidy
          '450': ss13e_tax_subsidy
      - prompt: A compulsory payment to the government is a
        options:
        - Tax
        - Subsidy
        - Profit
        - Wage
        answer: Tax
        difficulty: 1
        hints:
        - People must pay it by law.
        - A subsidy is money from the government, not to it.
        solution: 'Step 1: Subsidy flows from the government. Step 2: The compulsory payment flows to it. Step 3: Tax.'
        mistakes:
          Subsidy: ss13e_tax_subsidy
      - prompt: About what share of India's people are under 35 years of age?
        options:
        - About 65%
        - About 10%
        - About 25%
        - About 95%
        answer: About 65%
        difficulty: 2
        hints:
        - India is a young country.
        - It is nearly two out of three people.
        solution: 'Step 1: India has a very young population. Step 2: Nearly two-thirds are under 35. Step 3: About 65%.'
        mistakes:
          About 10%: tertiary_growth
      - prompt: Kerala's agriculture share of GSVA is about 10% and industry about 28%. About what share is services (%)?
        answer: '62'
        check: 100 - 10 - 28
        difficulty: 2
        hints:
        - The three shares add to 100%.
        - 100 − 10 − 28.
        solution: 'Step 1: Total = 100%. Step 2: 10 + 28 = 38. Step 3: 100 − 38 = 62%.'
        mistakes:
          '38': ss13e_add_all
      - prompt: Why is GVA used instead of total output to find a sector's contribution?
        options:
        - It counts only the value each unit adds, avoiding double counting
        - It includes all taxes
        - It counts imports twice
        - It ignores services
        answer: It counts only the value each unit adds, avoiding double counting
        difficulty: 3
        hints:
        - Total output includes inputs bought from others.
        - Those inputs were already counted where they were made.
        solution: 'Step 1: Inputs are produced by other units. Step 2: Counting them again double-counts. Step 3: GVA counts only value added.'
        mistakes:
          It includes all taxes: ss13e_gva_minus

  - code: ss9.sectors.employment
    title: Jobs in organised and unorganised sectors
    after: [ss9.sectors.gva]
    notes: |
      Occupational structure 1991 to 2019-20: the primary sector still employs the largest share of
      workers, though its share fell (about 66.8% in 1991 to about 43.5% in 2019-20); the secondary and
      tertiary shares rose. So services give the most income, but agriculture gives the most jobs.
      Organised sector: firms registered under the Companies Act, Factories Act, Societies Act or
      Co-operative Act; permanent jobs, comparatively high salary, job security, safe workplaces.
      Unorganised sector: not registered, no proper accounts, no job security, low wages, long hours,
      unsafe workplaces; this widens inequality. Laws: Unorganised Workers' Social Security Act 2008
      (health care, maternity benefits, old-age protection, education, housing); Code on Social Security
      2020 (covers organised and unorganised workers, self-employed, domestic workers, daily wage
      workers, migrant workers and gig platform workers). Gig platform worker: works outside the usual
      employer–employee relationship; temporary, time-bound jobs, can work for several firms, flexible
      time (for example online food delivery workers, freelancers, drivers).
    explanations:
      text: "Some jobs are registered and protected by law, with fixed pay and security: the organised sector. Many people work without such protection: the unorganised sector. Laws in 2008 and 2020 try to give these workers social security."
      visual: "Two columns: Organised (registered, permanent job, higher pay, job security) | Unorganised (not registered, no permanence, lower pay, no security)."
      step_by_step: "To classify a job: Step 1: is the employer registered under a law? Step 2: is the job permanent with fixed pay? Step 3: are there benefits like leave and pension? If yes, organised; if no, unorganised."
      real_world: "A food delivery rider who works through an app, choosing their own hours, is a gig platform worker covered by the Code on Social Security 2020."
    activity:
      type: sort
      prompt: Organised or unorganised sector?
      bins:
      - Organised
      - Unorganised
      items:
      - label: Permanent job in a public sector bank
        bin: Organised
        clue: Registered, secure, fixed salary.
        why: Organised sector.
      - label: Worker in a factory registered under the Factories Act
        bin: Organised
        clue: Registered under a law.
        why: Organised.
      - label: Government school teacher
        bin: Organised
        clue: Job security and benefits.
        why: Organised.
      - label: Daily-wage construction labourer
        bin: Unorganised
        clue: Paid by the day, no security.
        why: Unorganised.
      - label: Street vendor
        bin: Unorganised
        clue: Not registered, no accounts.
        why: Unorganised.
      - label: Food delivery gig worker
        bin: Unorganised
        clue: Temporary, many firms, no employer contract.
        why: Unorganised; now covered by the Code on Social Security 2020.
    lesson:
      - teach: Services earn the biggest share of India's income, but agriculture still gives the most jobs (about 43.5% of workers in 2019-20, down from 66.8% in 1991). So income per worker in agriculture is low.
        picture:
          kind: bars
          unit: '% of workers in primary sector'
          bars:
          - label: '1991'
            value: 66.8
          - label: 2019-20
            value: 43.5
          alt: The primary sector's share of workers fell but is still the largest.
        check:
          prompt: Which sector employs the most Indians?
          options:
          - Primary
          - Tertiary
          - Secondary
          answer: Primary
          why: Farming and related work still employ the largest share.
        ways:
        - style: visual
          teach: Income and jobs don't match. Services earn the biggest share of income, but farming still gives the most jobs, about 43.5% of workers in 2019-20, down from 66.8% in 1991. Many people sharing a small share of income means low income per farm worker.
          picture:
            kind: bars
            alt: 'Share of Indian workers in agriculture: 66.8 percent in 1991, 43.5 percent in 2019-20.'
            unit: '%'
            bars:
            - label: '1991'
              value: 66.8
            - label: 2019-20
              value: 43.5
      - teach: 'Organised sector: registered firms, contracts, fixed pay, job security, safe workplaces. Unorganised sector: unregistered, low pay, long hours, no security. Laws protect unorganised workers: the Unorganised Workers'' Social Security Act 2008, and the Code on Social Security 2020, which also covers gig workers like delivery riders.'
        picture:
          kind: compare
          columns:
          - title: Organised
            points:
            - registered
            - contract, fixed pay
            - job security
          - title: Unorganised
            points:
            - not registered
            - low pay, long hours
            - no security
          alt: Organised and unorganised sectors compared.
        check:
          prompt: An online food delivery rider is a
          options:
          - Gig platform worker
          - Government officer
          - Factory owner
          answer: Gig platform worker
          why: They do short, flexible jobs through an app, outside a normal employer contract.
        ways:
        - style: visual
          teach: 'Two kinds of work side by side. Organised: registered firms, written contracts, fixed pay, job security. Unorganised: unregistered, low pay, long hours, no security. Laws now protect unorganised workers, and the Code on Social Security 2020 covers gig workers like delivery riders too.'
          picture:
            kind: compare
            alt: 'Organised sector: registered, contracts, fixed pay, security. Unorganised sector: unregistered, low pay, long hours, no security.'
            columns:
            - title: Organised
              points:
              - Registered firms
              - Contracts and fixed pay
              - Job security
              - Safe workplaces
            - title: Unorganised
              points:
              - Not registered
              - Low pay
              - Long hours
              - No job security
    items:
      - prompt: "Which sector employed the largest share of India's workers from 1991 to 2019-20?"
        options: ["Primary sector", "Secondary sector", "Tertiary sector"]
        answer: "Primary sector"
        difficulty: 1
        hints: ["It is not the sector with the largest income share."]
        solution: "The primary (agriculture and allied) sector, although its share fell."
        mistakes: {"Tertiary sector": tertiary_growth}
      - prompt: "Which is a feature of the organised sector?"
        options: ["Job security", "No registration", "Very long hours with low pay", "No proper accounts"]
        answer: "Job security"
        difficulty: 1
        hints: ["It works under a proper legal system."]
        solution: "Job security, permanent jobs and higher pay."
        mistakes: {"No registration": k9_org_feature}
      - prompt: "A daily wage construction worker with no written contract works in the"
        options: ["unorganised sector", "organised sector", "public sector bank"]
        answer: "unorganised sector"
        difficulty: 1
        hints: ["No registration, no job security."]
        solution: "Unorganised sector."
        mistakes: {"organised sector": k9_unorg_worker}
      - prompt: "Which law gave social security benefits to gig platform workers?"
        options: ["Code on Social Security 2020", "Unorganised Workers' Social Security Act 2008", "Companies Act", "RTI Act 2005"]
        answer: "Code on Social Security 2020"
        difficulty: 2
        hints: ["It defines a gig platform worker."]
        solution: "The Code on Social Security 2020."
        mistakes: {"Unorganised Workers' Social Security Act 2008": organised_sector}
      - prompt: "In which year was the Unorganised Workers' Social Security Act passed?"
        answer: "2008"
        check: "2008"
        difficulty: 2
        hints: ["Twelve years before the Code on Social Security."]
        solution: "2008."
        mistakes: {"2020": organised_sector}
      - prompt: "Which is a feature of gig platform work?"
        options: ["Temporary, time-bound jobs, often for more than one firm", "A permanent government post", "Fixed pension from the employer", "Work only in agriculture"]
        answer: "Temporary, time-bound jobs, often for more than one firm"
        difficulty: 2
        hints: ["They work outside the usual employer–employee relationship."]
        solution: "Temporary jobs, flexible time, several firms at once."
        mistakes: {"A permanent government post": organised_sector}
      - prompt: "Why do problems in the unorganised sector matter for the whole economy?"
        options: ["Low pay and poor conditions lower workers' contribution to national income and widen inequality", "They do not matter at all", "They raise everyone's income", "They only affect factories"]
        answer: "Low pay and poor conditions lower workers' contribution to national income and widen inequality"
        difficulty: 3
        hints: ["Think of human capital."]
        solution: "Workers cannot grow into strong human capital, and inequality widens."
        mistakes: {"They do not matter at all": organised_sector}
      - prompt: "Which worker is most likely in the organised sector?"
        options: ["A bank clerk with a contract and provident fund", "A street vendor", "A daily-wage farm worker", "A household helper paid in cash"]
        answer: "A bank clerk with a contract and provident fund"
        difficulty: 2
        hints: ["The organised sector is registered, with written contracts.", "Who has job security and benefits?"]
        solution: "Step 1: The others work without contracts or security. Step 2: The bank clerk has a contract, fixed hours and benefits: the organised sector."
        mistakes: {"A street vendor": org_signs, "A daily-wage farm worker": k9_unorg_worker, "A household helper paid in cash": org_signs}
      - prompt: "The primary sector's share of India's workers fell from about 66.8% in 1991 to about 43.5% in 2019-20. By how many percentage points did it fall?"
        answer: "23.3"
        check: "(668 - 435)/10"
        difficulty: 2
        hints: ["Subtract the newer share from the older one.", "66.8 − 43.5."]
        solution: "Step 1: 66.8 − 43.5 = 23.3. Step 2: It fell by 23.3 percentage points, though it still employs the most workers."
        mistakes: {"110.3": points_drop, "33.3": points_drop}
      - prompt: "Services earn the biggest share of India's income, yet agriculture gives the most jobs. What does this tell us?"
        options:
        - "Income per worker is much lower in agriculture than in services"
        - "Farmers earn more than service workers"
        - "Services employ most people"
        - "Agriculture produces most of the income"
        answer: "Income per worker is much lower in agriculture than in services"
        difficulty: 3
        hints: ["Compare the share of workers with the share of income.", "If many people share a small part of the income, what is each one's part?"]
        solution: "Step 1: About 43.5% of workers are in the primary sector, but it earns a much smaller share of income. Step 2: Services earn the most with fewer workers. Step 3: So each farm worker earns much less on average."
        mistakes: {"Services employ most people": share_not_size, "Agriculture produces most of the income": share_not_size}
      - prompt: Which is a feature of the unorganised sector?
        options:
        - No job security
        - Paid holidays
        - Provident fund
        - Written contract
        answer: No job security
        difficulty: 1
        hints:
        - Three options are benefits of registered firms.
        - Can a worker be dismissed any day?
        solution: 'Step 1: Holidays, PF and contracts belong to organised jobs. Step 2: Unorganised work lacks them. Step 3: No job security.'
        mistakes:
          Paid holidays: ss13e_registered
      - prompt: A firm registered under the Factories Act belongs to the
        options:
        - Organised sector
        - Unorganised sector
        - Primary sector
        - Gig economy
        answer: Organised sector
        difficulty: 2
        hints:
        - Registration under a law is the key.
        - Registered firms must follow rules on pay and safety.
        solution: 'Step 1: It is registered under an Act. Step 2: Registered firms form one sector. Step 3: Organised sector.'
        mistakes:
          Unorganised sector: ss13e_registered
      - prompt: Which law first gave social security to unorganised workers?
        options:
        - Unorganised Workers' Social Security Act 2008
        - Factories Act
        - Companies Act
        - Right to Education Act
        answer: Unorganised Workers' Social Security Act 2008
        difficulty: 2
        hints:
        - Its name says who it protects.
        - It was passed before the 2020 code.
        solution: 'Step 1: The 2020 code came later. Step 2: The earlier law names unorganised workers. Step 3: The 2008 Act.'
        mistakes:
          Factories Act: organised_sector
      - prompt: A domestic worker cleans three homes with no contract and no leave. She works in the
        options:
        - Unorganised sector
        - Organised sector
        - Public sector bank
        - Primary sector
        answer: Unorganised sector
        difficulty: 1
        hints:
        - Is she registered or on a contract?
        - No leave, no contract.
        solution: 'Step 1: No contract, no benefits. Step 2: That marks unregistered work. Step 3: Unorganised sector.'
        mistakes:
          Organised sector: ss13e_registered
      - prompt: Why do low wages in the unorganised sector widen inequality?
        options:
        - Most workers earn little while a few earn much more
        - Everyone earns the same
        - Taxes are higher for the poor
        - It creates more organised jobs
        answer: Most workers earn little while a few earn much more
        difficulty: 3
        hints:
        - Inequality is a gap between groups.
        - Who earns more, and who earns less?
        solution: 'Step 1: Many workers are unorganised and low-paid. Step 2: Organised workers and owners earn more. Step 3: The gap grows.'
        mistakes:
          Everyone earns the same: ss13e_registered
