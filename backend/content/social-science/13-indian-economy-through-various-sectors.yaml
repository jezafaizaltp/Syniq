# Class 9 Social Science II, chapter 5 (stored as Social Science chapter 13). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 2 text supplied by the school.
# Social Science II chapters 1 to 8 are stored as chapters 9 to 16, after the eight Social Science I chapters.
subject: ss
chapter: 13
title: Indian Economy Through Various Sectors

tips:
  sector_kinds: "Primary sector uses natural resources directly (agriculture, fishing, mining, forestry). Secondary sector turns raw materials into products (industry, construction, electricity, gas, water supply). Tertiary sector gives services (transport, trade, banking, health, education)."
  ni_methods: "Three ways to measure national income: product method (add the value of final goods and services from all sectors), income method (rent + wages + interest + profit, gives GNI), expenditure method (C + I + G + (X − M), gives GNE). All three give the same answer."
  final_intermediate: "Final goods are consumed directly. Intermediate goods are used as raw material to make another product. National income counts only final goods, to avoid double counting."
  gdp_gnp: "GDP counts final goods and services produced inside the country's domestic territory. GNP = GDP + income of Indians and Indian firms abroad − income earned in India by foreigners and foreign firms."
  nnp_pci: "NNP = GNP − depreciation. Per capita income = national income ÷ total population."
  gva_formula: "GVA = gross product value − value of intermediate consumption. GDP = GVA + (product tax − product subsidy)."
  organised_sector: "Organised sector: registered under a law (Companies Act, Factories Act, Co-operative Act), permanent jobs, better pay, job security. Unorganised sector: not registered, no job security, low pay, long hours."
  tertiary_growth: "India's GVA (2022-23) and Kerala's GSVA: the tertiary (service) sector gives the largest share, helped by health and education, banking and insurance, transport and communication, tourism and knowledge-based industries."

concepts:
  - code: ss9.sectors.three_sectors
    title: Primary, secondary and tertiary sectors
    notes: |
      Economic activities give people income. The National Statistical Office (NSO, formed in 2019 by
      combining the CSO and NSSO) groups them into three sectors. Primary sector: activities that use
      natural resources directly (agriculture, animal husbandry, fishing, forestry, mining, quarrying);
      also called the agricultural sector. Secondary sector: industry and manufacturing, processing
      primary-sector raw materials into finished goods; also construction, electricity, gas and water
      supply; called the industrial sector. Tertiary sector: transport, communication, trade, banking,
      insurance, hotels, real estate, health and education; called the service sector. The economy grows
      when the three sectors work in tandem: to grow more sugarcane, the farmer gets machinery and
      fertilizers from the secondary sector and transport and financial help from the tertiary sector.
      Production, distribution and consumption are the major economic activities.
    explanations:
      text: "Every job belongs to one of three sectors. If it takes something straight from nature, it is primary. If it makes something out of raw materials, it is secondary. If it gives a service, it is tertiary. The three depend on each other."
      visual: "Picture a coconut. Climbing the tree and picking it is primary. Making coconut oil in a mill is secondary. Carrying the oil to shops by lorry, selling it and the bank loan for the mill are tertiary."
      step_by_step: "To place an activity: Step 1: does it take a product directly from land, water or forests? Then primary. Step 2: does it change raw materials into a new product, or build something? Then secondary. Step 3: does it serve people without making a product (teaching, transport, banking)? Then tertiary."
      real_world: "In your family or street, list five jobs and sort them: a fisherman (primary), a carpenter (secondary), a nurse, bus driver or bank clerk (tertiary)."
    items:
      - prompt: "Fishing belongs to which sector?"
        options: ["Primary", "Secondary", "Tertiary"]
        answer: "Primary"
        difficulty: 1
        hints: ["It uses a natural resource directly."]
        solution: "Fishing uses natural resources directly, so it is primary."
        mistakes: {"Tertiary": sector_kinds}
      - prompt: "Electricity, gas and water supply are included in which sector?"
        options: ["Secondary", "Primary", "Tertiary"]
        answer: "Secondary"
        difficulty: 1
        hints: ["Look at Fig 5.3 in the textbook."]
        solution: "They are part of the secondary (industrial) sector."
        mistakes: {"Tertiary": sector_kinds}
      - prompt: "Why is the tertiary sector also called the service sector?"
        options: ["It provides services such as health, education, transport and banking", "It grows food", "It makes machines", "It is run only by the government"]
        answer: "It provides services such as health, education, transport and banking"
        difficulty: 1
        hints: ["It helps the other two sectors store and market goods."]
        solution: "Its activities are services."
        mistakes: {"It makes machines": sector_kinds}
      - prompt: "Which office collects and publishes India's economic statistics, including national income?"
        options: ["National Statistical Office (NSO)", "Reserve Bank of India", "Election Commission", "NITI Aayog"]
        answer: "National Statistical Office (NSO)"
        difficulty: 2
        hints: ["It was formed in 2019 by combining the CSO and NSSO."]
        solution: "The NSO."
        mistakes: {"Reserve Bank of India": sector_kinds}
      - prompt: "A sugarcane farmer gets fertilizers and machinery. Which sector supplies them?"
        options: ["Secondary", "Tertiary", "Primary"]
        answer: "Secondary"
        difficulty: 2
        hints: ["They are manufactured in factories."]
        solution: "The secondary sector; transport and loans come from the tertiary sector."
        mistakes: {"Tertiary": sector_kinds}
      - prompt: "What does the sugarcane example show?"
        options: ["The three sectors depend on each other", "Only agriculture matters", "Industry can work without raw materials", "Services do not help production"]
        answer: "The three sectors depend on each other"
        difficulty: 2
        hints: ["Inputs come from the other two sectors."]
        solution: "Interdependence between sectors completes the production process."
        mistakes: {"Only agriculture matters": sector_kinds}
      - prompt: "Using goods and services to satisfy needs and wants is called"
        options: ["consumption", "production", "distribution", "saving"]
        answer: "consumption"
        difficulty: 3
        hints: ["Production makes goods; distribution allocates them or the income."]
        solution: "Consumption."
        mistakes: {"distribution": sector_kinds}

  - code: ss9.sectors.national_income
    title: Measuring national income
    after: [ss9.sectors.three_sectors]
    notes: |
      National income is the sum total of the money value of all final goods and services produced in
      an accounting year (in India, 1 April to 31 March). Final goods are consumed directly; intermediate
      goods are raw materials for another product. Why measure it: to understand the country's growth,
      the contribution of each sector, to plan projects, compare countries, understand investment and
      spending, and see the economy's strengths and weaknesses. Three methods: Product method: add the
      value of all final goods and services from the three sectors (NI = x1 + x2 + ... + xn). Income
      method: NI = r + w + i + p (rent from land, wages from labour, interest from capital, profit from
      organisation); gives Gross National Income (GNI). Expenditure method: NI = C + I + G + (X − M)
      (consumption, investment, government expenditure, net exports); gives Gross National Expenditure
      (GNE). All three give the same value. Limits: lack of accurate data, double counting, goods made
      for self-consumption and household work not counted, products with no market value left out.
    explanations:
      text: "National income is the value of everything a country finally produces in a year. You can count it three ways: what was produced, what people earned, or what was spent. Done right, all three give the same total."
      visual: "Draw a circle: firms produce goods (product method) → they pay rent, wages, interest and profit (income method) → people spend that money on goods (expenditure method) → back to firms."
      step_by_step: "Expenditure method: Step 1: add consumption (C). Step 2: add investment (I). Step 3: add government spending (G). Step 4: add exports and subtract imports (X − M). The total is national income."
      real_world: "Your mother's home cooking and cleaning are real work, but they are not counted in national income because no money is paid. That is one limitation of measuring it."
    items:
      - prompt: "India's financial year starts on"
        options: ["1 April", "1 January", "15 August", "1 June"]
        answer: "1 April"
        difficulty: 1
        hints: ["It ends on 31 March."]
        solution: "1 April to 31 March."
        mistakes: {"1 January": ni_methods}
      - prompt: "In the income method, NI = r + w + i + p. What does 'w' stand for?"
        options: ["Wages", "Wealth", "Water", "Weight"]
        answer: "Wages"
        difficulty: 1
        hints: ["It is the reward for labour."]
        solution: "w = wages (labour); r = rent, i = interest, p = profit."
        mistakes: {"Wealth": ni_methods}
      - prompt: "Rent ₹20 crore, wages ₹50 crore, interest ₹10 crore, profit ₹20 crore. National income by the income method, in ₹ crore?"
        answer: "100"
        check: "20 + 50 + 10 + 20"
        difficulty: 1
        hints: ["NI = r + w + i + p."]
        solution: "Step 1: 20 + 50 = 70. Step 2: 70 + 10 + 20 = 100 crore."
        mistakes: {"80": ni_methods}
      - prompt: "C = 300, I = 100, G = 150, exports X = 60, imports M = 80 (₹ crore). National income by the expenditure method?"
        answer: "530"
        check: "300 + 100 + 150 + (60 - 80)"
        difficulty: 2
        hints: ["NI = C + I + G + (X − M). Net exports here are negative."]
        solution: "Step 1: C + I + G = 550. Step 2: X − M = 60 − 80 = −20. Step 3: 550 − 20 = 530 crore."
        mistakes: {"690": ni_methods, "570": ni_methods}
      - prompt: "Flour bought by a bakery to make bread is"
        options: ["an intermediate good", "a final good", "a service", "a subsidy"]
        answer: "an intermediate good"
        difficulty: 2
        hints: ["It is used as raw material for another product."]
        solution: "Intermediate good; the bread sold to you is the final good."
        mistakes: {"a final good": final_intermediate}
      - prompt: "Which method gives Gross National Expenditure (GNE)?"
        options: ["Expenditure method", "Income method", "Product method"]
        answer: "Expenditure method"
        difficulty: 2
        hints: ["The income method gives GNI."]
        solution: "Expenditure method."
        mistakes: {"Income method": ni_methods}
      - prompt: "Counting the value of cotton, then yarn, then cloth made from that yarn, all in national income, is the problem of"
        options: ["double counting", "depreciation", "net exports", "per capita income"]
        answer: "double counting"
        difficulty: 3
        hints: ["The cotton's value is already inside the cloth's value."]
        solution: "Double counting: the same value counted at more than one stage of production."
        mistakes: {"depreciation": final_intermediate}

  - code: ss9.sectors.gdp_gnp
    title: GDP, GNP, NNP and per capita income
    after: [ss9.sectors.national_income]
    notes: |
      GDP: money value of all final goods and services produced within the domestic territory of a
      country (includes air space, territorial waters, own embassies abroad, exclusive fishing and
      mining zones, offshore free zones; foreign embassies in India are not ours). Income of Indians
      working abroad and profits of Indian firms abroad are not in GDP. GNP: add the income of Indians and
      Indian firms abroad to GDP and exclude income earned in India by foreign nationals and firms; it is
      production by the residents of a country, at home and abroad. Depreciation: cost of wear and tear of
      vehicles and machinery. NNP = GNP − depreciation. Per capita income (PCI) = national income ÷ total
      population. If population grows faster than national income, PCI falls. If only a small group's
      income rises, PCI can rise while most people are no better off.
    explanations:
      text: "GDP asks 'what was produced inside India?'. GNP asks 'what did Indians produce, anywhere?'. NNP takes away the wear and tear of machines. Per capita income shares the national income equally among all people."
      visual: "A table with two columns: Inside India (GDP) and Indians abroad (+) minus foreigners in India (−). GDP + (+) − (−) = GNP. Then GNP − depreciation = NNP."
      step_by_step: "Per capita income: Step 1: take national income. Step 2: divide by total population. Example: ₹1,000 crore ÷ 10 lakh people = ₹10,000 per person."
      real_world: "Many Keralites work in the Gulf. Their earnings are part of India's GNP but not India's GDP."
    items:
      - prompt: "GNP is ₹500 crore and depreciation is ₹40 crore. What is NNP (₹ crore)?"
        answer: "460"
        check: "500 - 40"
        difficulty: 1
        hints: ["NNP = GNP − depreciation."]
        solution: "500 − 40 = 460 crore."
        mistakes: {"540": nnp_pci}
      - prompt: "A country's national income is ₹60,000 crore and its population is 2 crore. What is its per capita income in ₹?"
        answer: "30000"
        check: "60000/2"
        difficulty: 1
        hints: ["PCI = national income ÷ population. Both are in crore, so the crores cancel."]
        solution: "60,000 crore ÷ 2 crore = ₹30,000 per person."
        mistakes: {"120000": nnp_pci}
      - prompt: "The profit an Indian company earns abroad is included in"
        options: ["India's GNP, not India's GDP", "India's GDP, not India's GNP", "both GDP and GNP", "neither"]
        answer: "India's GNP, not India's GDP"
        difficulty: 2
        hints: ["GDP counts only production inside the domestic territory."]
        solution: "GNP includes Indians' income abroad; GDP does not."
        mistakes: {"India's GDP, not India's GNP": gdp_gnp}
      - prompt: "India's GDP is ₹1,000 crore. Indians abroad earn ₹80 crore and foreigners earn ₹30 crore in India. What is India's GNP (₹ crore)?"
        answer: "1050"
        check: "1000 + 80 - 30"
        difficulty: 2
        hints: ["Add income from abroad; subtract foreigners' income in India."]
        solution: "Step 1: 1000 + 80 = 1080. Step 2: 1080 − 30 = 1050 crore."
        mistakes: {"1110": gdp_gnp, "1080": gdp_gnp}
      - prompt: "Which of these is NOT part of India's economic territory?"
        options: ["A foreign country's embassy in New Delhi", "India's territorial waters", "Indian embassies abroad", "India's air space"]
        answer: "A foreign country's embassy in New Delhi"
        difficulty: 2
        hints: ["Foreign embassies in India belong to the economic territory of their own country."]
        solution: "Foreign embassies in India are not included."
        mistakes: {"Indian embassies abroad": gdp_gnp}
      - prompt: "National income grows by 2% but population grows by 5%. What happens to per capita income?"
        options: ["It falls", "It rises", "It stays the same"]
        answer: "It falls"
        difficulty: 3
        hints: ["The same income is shared among more people."]
        solution: "Population rises faster than income, so each person's share falls."
        mistakes: {"It rises": nnp_pci}

  - code: ss9.sectors.gva
    title: Gross value added and sector shares
    after: [ss9.sectors.gdp_gnp]
    notes: |
      From January 2015 the NSO uses Gross Value Added (GVA) to find each sector's contribution (before
      that, GDP). GVA = gross product value − value of intermediate consumption. Taxes and subsidies on
      products are not counted in GVA; GDP = GVA + (product tax − product subsidy). Tax: compulsory payment
      to the government. Subsidy: financial support from the government. Economic Survey 2022-23 graph
      (1982-83 to 2022-23, constant prices): the agriculture share falls steadily; the service sector
      share keeps rising and is the largest (over half by 2022-23). Kerala's GSVA 2019-20 to 2022-23
      (Economic Review 2023): service sector about 60 to 64%, industry about 27 to 29%, agriculture
      about 9 to 10%. Reasons for tertiary growth: health and education programmes, banking and
      insurance, transport and communication, tourism, knowledge-based industries. Human capital:
      knowledge, skills, health and education. People under 35 are about 65% of India's population.
      Technopark and Infopark are Kerala's examples of the knowledge-based sector. Structural
      transformation: the change in the relative importance of sectors as an economy grows.
    explanations:
      text: "GVA is the new value a sector adds: what it produced minus the raw materials it used up. In both India and Kerala, services now add the most value, while agriculture's share has been falling."
      visual: "A bar chart: three colours (agriculture, industry, services) for 1982-83 to 2022-23. The agriculture bar shrinks each decade, the service bar grows tallest."
      step_by_step: "GVA example: Step 1: a furniture unit sells furniture worth ₹10 lakh. Step 2: it used wood and nails worth ₹6 lakh. Step 3: GVA = 10 − 6 = ₹4 lakh."
      real_world: "Technopark in Thiruvananthapuram and Infopark in Kochi employ thousands in software services, part of Kerala's large tertiary sector."
    items:
      - prompt: "A unit's gross product value is ₹50 lakh and its intermediate consumption is ₹30 lakh. What is its GVA (₹ lakh)?"
        answer: "20"
        check: "50 - 30"
        difficulty: 1
        hints: ["GVA = gross product value − intermediate consumption."]
        solution: "50 − 30 = 20 lakh."
        mistakes: {"80": gva_formula}
      - prompt: "GVA is ₹900 crore, product taxes ₹120 crore and product subsidies ₹20 crore. What is GDP (₹ crore)?"
        answer: "1000"
        check: "900 + (120 - 20)"
        difficulty: 2
        hints: ["GDP = GVA + (product tax − product subsidy)."]
        solution: "Step 1: 120 − 20 = 100. Step 2: 900 + 100 = 1000 crore."
        mistakes: {"1040": gva_formula, "880": gva_formula}
      - prompt: "From when has the NSO used GVA to find sector contributions?"
        options: ["January 2015", "1947", "2019", "1982"]
        answer: "January 2015"
        difficulty: 1
        hints: ["Before that, GDP was used."]
        solution: "From January 2015."
        mistakes: {"2019": gva_formula}
      - prompt: "Which sector's share in India's GVA has fallen steadily from 1982-83 to 2022-23?"
        options: ["Agriculture and allied", "Service", "Industry stayed the only growing one"]
        answer: "Agriculture and allied"
        difficulty: 2
        hints: ["Look at the trend in Fig 5.6."]
        solution: "The agriculture share keeps falling; the service share keeps rising."
        mistakes: {"Service": tertiary_growth}
      - prompt: "Which sector made the largest contribution to Kerala's GSVA in 2022-23?"
        options: ["Service sector", "Agriculture sector", "Industrial sector"]
        answer: "Service sector"
        difficulty: 2
        hints: ["It was over 60%."]
        solution: "The service (tertiary) sector."
        mistakes: {"Agriculture sector": tertiary_growth}
      - prompt: "Which is a reason for the growth of the tertiary sector's share?"
        options: ["Growth of tourism and knowledge-based industries", "Fewer schools and hospitals", "Less use of banks", "Closing of transport services"]
        answer: "Growth of tourism and knowledge-based industries"
        difficulty: 2
        hints: ["The textbook lists five reasons."]
        solution: "Health and education, banking, transport and communication, tourism and knowledge-based industries."
        mistakes: {"Fewer schools and hospitals": tertiary_growth}
      - prompt: "A change in the relative importance of sectors as an economy grows is called"
        options: ["structural transformation", "depreciation", "equilibrium", "double counting"]
        answer: "structural transformation"
        difficulty: 3
        hints: ["It changes each sector's contribution and its jobs."]
        solution: "Structural transformation."
        mistakes: {"equilibrium": tertiary_growth}

  - code: ss9.sectors.employment
    title: Jobs in organised and unorganised sectors
    after: [ss9.sectors.gva]
    notes: |
      Occupational structure 1991 to 2019-20: the primary sector still employs the largest share of
      workers, though its share fell (about 66.8% in 1991 to about 43.5% in 2019-20); the secondary and
      tertiary shares rose. So services give the most income, but agriculture gives the most jobs.
      Organised sector: firms registered under the Companies Act, Factories Act, Societies Act or
      Co-operative Act; permanent jobs, comparatively high salary, job security, safe workplaces.
      Unorganised sector: not registered, no proper accounts, no job security, low wages, long hours,
      unsafe workplaces; this widens inequality. Laws: Unorganised Workers' Social Security Act 2008
      (health care, maternity benefits, old-age protection, education, housing); Code on Social Security
      2020 (covers organised and unorganised workers, self-employed, domestic workers, daily wage
      workers, migrant workers and gig platform workers). Gig platform worker: works outside the usual
      employer–employee relationship; temporary, time-bound jobs, can work for several firms, flexible
      time (for example online food delivery workers, freelancers, drivers).
    explanations:
      text: "Some jobs are registered and protected by law, with fixed pay and security: the organised sector. Many people work without such protection: the unorganised sector. Laws in 2008 and 2020 try to give these workers social security."
      visual: "Two columns: Organised (registered, permanent job, higher pay, job security) | Unorganised (not registered, no permanence, lower pay, no security)."
      step_by_step: "To classify a job: Step 1: is the employer registered under a law? Step 2: is the job permanent with fixed pay? Step 3: are there benefits like leave and pension? If yes, organised; if no, unorganised."
      real_world: "A food delivery rider who works through an app, choosing their own hours, is a gig platform worker covered by the Code on Social Security 2020."
    items:
      - prompt: "Which sector employed the largest share of India's workers from 1991 to 2019-20?"
        options: ["Primary sector", "Secondary sector", "Tertiary sector"]
        answer: "Primary sector"
        difficulty: 1
        hints: ["It is not the sector with the largest income share."]
        solution: "The primary (agriculture and allied) sector, although its share fell."
        mistakes: {"Tertiary sector": tertiary_growth}
      - prompt: "Which is a feature of the organised sector?"
        options: ["Job security", "No registration", "Very long hours with low pay", "No proper accounts"]
        answer: "Job security"
        difficulty: 1
        hints: ["It works under a proper legal system."]
        solution: "Job security, permanent jobs and higher pay."
        mistakes: {"No registration": organised_sector}
      - prompt: "A daily wage construction worker with no written contract works in the"
        options: ["unorganised sector", "organised sector", "public sector bank"]
        answer: "unorganised sector"
        difficulty: 1
        hints: ["No registration, no job security."]
        solution: "Unorganised sector."
        mistakes: {"organised sector": organised_sector}
      - prompt: "Which law gave social security benefits to gig platform workers?"
        options: ["Code on Social Security 2020", "Unorganised Workers' Social Security Act 2008", "Companies Act", "RTI Act 2005"]
        answer: "Code on Social Security 2020"
        difficulty: 2
        hints: ["It defines a gig platform worker."]
        solution: "The Code on Social Security 2020."
        mistakes: {"Unorganised Workers' Social Security Act 2008": organised_sector}
      - prompt: "In which year was the Unorganised Workers' Social Security Act passed?"
        answer: "2008"
        check: "2008"
        difficulty: 2
        hints: ["Twelve years before the Code on Social Security."]
        solution: "2008."
        mistakes: {"2020": organised_sector}
      - prompt: "Which is a feature of gig platform work?"
        options: ["Temporary, time-bound jobs, often for more than one firm", "A permanent government post", "Fixed pension from the employer", "Work only in agriculture"]
        answer: "Temporary, time-bound jobs, often for more than one firm"
        difficulty: 2
        hints: ["They work outside the usual employer–employee relationship."]
        solution: "Temporary jobs, flexible time, several firms at once."
        mistakes: {"A permanent government post": organised_sector}
      - prompt: "Why do problems in the unorganised sector matter for the whole economy?"
        options: ["Low pay and poor conditions lower workers' contribution to national income and widen inequality", "They do not matter at all", "They raise everyone's income", "They only affect factories"]
        answer: "Low pay and poor conditions lower workers' contribution to national income and widen inequality"
        difficulty: 3
        hints: ["Think of human capital."]
        solution: "Workers cannot grow into strong human capital, and inequality widens."
        mistakes: {"They do not matter at all": organised_sector}
