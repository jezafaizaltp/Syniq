# Class 9 Social Science I, chapter 8. Format: content/README.md.
subject: ss
chapter: 8
title: Towards a Gender-Neutral Society

tips:
  sex_vs_gender: "Sex refers to biological differences; gender refers to the roles and behaviour that society expects. Gender roles are learned, so they can change."
  stereotype_meaning: "A gender stereotype is a fixed idea about what men or women can or should do, such as 'boys don't cry' or 'cooking is a woman's job'."
  equality_articles: "Article 14: equality before law. Article 15: no discrimination on grounds of sex (among others). Article 16: equal opportunity in public jobs. Article 39(d): equal pay for equal work."
  gender_laws: "Dowry Prohibition Act 1961; Equal Remuneration Act 1976; Protection of Women from Domestic Violence Act 2005; POSH Act 2013 (workplace harassment); Transgender Persons Act 2019."
  reservation_figures: "Local bodies: at least one-third of seats for women (50% in Kerala). The Women's Reservation Act 2023 reserves one-third of Lok Sabha and Assembly seats."
  transgender_rights: "The Supreme Court's NALSA judgment (2014) recognised transgender persons as a third gender; Kerala made India's first state transgender policy in 2015."

concepts:
  - code: ss9.gender.roles
    title: Sex, gender and stereotypes
    notes: |
      Sex refers to biological characteristics. Gender refers to the roles, behaviour and identities
      that society builds around them. Gender roles are learned from family, school, media and
      culture, so they differ between societies and change over time. Gender stereotypes are fixed,
      often unfair ideas ("girls are bad at maths", "boys must not cry") that limit choices for
      everyone. The gender division of labour often leaves women with unpaid care work at home.
      Gender identity includes women, men and transgender and non-binary people.
    explanations:
      text: "Nobody is born knowing that pink is for girls or that boys shouldn't help in the kitchen; we learn these ideas. Because they are learned, they can be unlearned. Stereotypes hurt everyone: a girl who loves cricket and a boy who loves cooking both deserve to follow their interests."
      visual: "Draw two columns: 'Sex (biological)' and 'Gender (learned from society)'. Put 'body differences' in the first, and 'who cooks, who drives, what colours to wear' in the second."
      step_by_step: "Is 'only men can be pilots' about sex or gender? Step 1: Flying a plane does not depend on biology. Step 2: It is an expectation made by society. Step 3: So it is a gender stereotype, and a false one."
      real_world: "Kerala has women bus drivers, women police stations and men working as nurses: proof that jobs are not fixed by gender."
    items:
      - prompt: "Gender refers to:"
        options: ["Roles and behaviour that society expects of people", "Only biological differences", "A person's height", "A person's blood group"]
        answer: "Roles and behaviour that society expects of people"
        difficulty: 1
        hints: ["Sex is the biological part."]
        solution: "Gender is socially constructed; sex is biological."
        mistakes: {"Only biological differences": sex_vs_gender}
      - prompt: "'Boys don't cry' is an example of:"
        options: ["A gender stereotype", "A biological fact", "A law", "A scientific discovery"]
        answer: "A gender stereotype"
        difficulty: 1
        hints: ["A fixed idea about how boys should behave."]
        solution: "It is a stereotype; crying is a normal human feeling."
        mistakes: {"A biological fact": stereotype_meaning}
      - prompt: "Why can gender roles change over time?"
        options: ["They are learned from society, not fixed by birth", "Biology changes every year", "Laws forbid them", "They are written in our genes"]
        answer: "They are learned from society, not fixed by birth"
        difficulty: 2
        hints: ["Where do we learn them?"]
        solution: "Because society creates gender roles, society can change them."
        mistakes: {"They are written in our genes": sex_vs_gender}
      - prompt: "Which of these is unpaid care work?"
        options: ["Cooking and looking after children at home", "Working as a paid nurse", "Driving a taxi", "Teaching in a school"]
        answer: "Cooking and looking after children at home"
        difficulty: 2
        hints: ["Work done at home without wages."]
        solution: "Household and care work at home is usually unpaid, and is mostly done by women."
      - prompt: "Which statement is a stereotype rather than a fact?"
        options: ["Girls are not good at maths", "People of all genders can be doctors", "Children learn behaviour from those around them", "Men and women both have the right to vote"]
        answer: "Girls are not good at maths"
        difficulty: 2
        hints: ["Which one is an unfair generalisation?"]
        solution: "Ability in maths does not depend on gender; that statement is a stereotype."
        mistakes: {"People of all genders can be doctors": stereotype_meaning}
      - prompt: "A school lets both girls and boys choose football or dance clubs freely. This helps to:"
        options: ["Break gender stereotypes", "Make stereotypes stronger", "Reduce choices", "Separate students"]
        answer: "Break gender stereotypes"
        difficulty: 3
        hints: ["Choices based on interest, not gender."]
        solution: "Free choice lets children follow interests regardless of gender."

  - code: ss9.gender.equality
    title: Gender equality in the Constitution and law
    after: [ss9.gender.roles]
    notes: |
      The Constitution promises equality: Article 14 (equality before law), Article 15 (no
      discrimination on grounds of religion, race, caste, sex or place of birth), Article 16 (equal
      opportunity in public employment), Article 39(d) (equal pay for equal work, a Directive
      Principle). Laws include the Dowry Prohibition Act (1961), the Equal Remuneration Act (1976),
      the Protection of Women from Domestic Violence Act (2005), the Sexual Harassment of Women at
      Workplace (POSH) Act (2013) and the Transgender Persons (Protection of Rights) Act (2019). One-third
      of seats in local bodies are reserved for women (Kerala: 50%); the Women's Reservation Act
      (2023) reserves one-third of seats in the Lok Sabha and State Assemblies.
    explanations:
      text: "Our Constitution says everyone is equal, but laws are needed to make that real. Asking for dowry is a crime; women and men must be paid the same for the same work; and violence at home or harassment at work can be reported. Reserving seats for women in panchayats has brought lakhs of women into public life."
      visual: "Draw a ladder from 'Constitution (Articles 14, 15, 16, 39(d))' to 'Laws (1961, 1976, 2005, 2013, 2019)' to 'Representation (local bodies, 2023 Act)'."
      step_by_step: "A legislature has 90 seats. How many are reserved for women under one-third reservation? Step 1: One-third of 90. Step 2: 90 ÷ 3 = 30. Step 3: 30 seats."
      real_world: "Kerala reserved 50% of local body seats for women from 2010, and many women now lead panchayats and municipal corporations."
    items:
      - prompt: "Which Article forbids discrimination on grounds of sex?"
        options: ["Article 15", "Article 324", "Article 148", "Article 280"]
        answer: "Article 15"
        difficulty: 1
        hints: ["It lists religion, race, caste, sex and place of birth."]
        solution: "Article 15 prohibits such discrimination."
        mistakes: {"Article 324": eci_role, "Article 148": cag_role}
      - prompt: "Equal pay for equal work for men and women is in which Article?"
        options: ["Article 39(d)", "Article 14", "Article 16", "Article 15"]
        answer: "Article 39(d)"
        difficulty: 2
        hints: ["A Directive Principle."]
        solution: "Article 39(d) directs equal pay for equal work."
        mistakes: {"Article 16": equality_articles, "Article 14": equality_articles}
      - prompt: "In which year was the Dowry Prohibition Act passed?"
        answer: "1961"
        check: "1961"
        difficulty: 2
        hints: ["Early 1960s."]
        solution: "The Dowry Prohibition Act was passed in 1961."
        mistakes: {"2005": gender_laws}
      - prompt: "A legislature has 90 seats. With one-third reserved for women, how many seats are reserved?"
        answer: "30"
        check: "90*Rational(1, 3)"
        difficulty: 1
        hints: ["90 ÷ 3."]
        solution: "90 ÷ 3 = 30 seats"
        mistakes: {"45": reservation_figures, "270": reservation_figures}
      - prompt: "What percentage of local body seats does Kerala reserve for women?"
        options: ["50%", "33%", "25%", "10%"]
        answer: "50%"
        difficulty: 2
        hints: ["More than the national minimum of one-third."]
        solution: "Kerala reserves half the seats for women."
        mistakes: {"33%": reservation_figures}
      - prompt: "Which law protects women from violence at home?"
        options: ["Protection of Women from Domestic Violence Act, 2005", "Right to Information Act, 2005", "Dowry Prohibition Act, 1961", "Equal Remuneration Act, 1976"]
        answer: "Protection of Women from Domestic Violence Act, 2005"
        difficulty: 2
        hints: ["'Domestic' means at home."]
        solution: "The 2005 Domestic Violence Act protects women at home."
        mistakes: {"Right to Information Act, 2005": rti_facts, "Equal Remuneration Act, 1976": gender_laws}
      - prompt: "A town council has 55 seats and 50% are reserved for women. Seats must be whole numbers, so the law rounds up. How many seats are reserved?"
        answer: "28"
        check: "ceiling(Rational(55, 2))"
        difficulty: 3
        hints: ["Half of 55 is 27.5."]
        solution: "55 ÷ 2 = 27.5, rounded up to 28."
        mistakes: {"27": reservation_figures}

  - code: ss9.gender.neutral
    title: Moving towards gender neutrality
    after: [ss9.gender.equality]
    notes: |
      A gender-neutral society treats people equally whatever their gender and does not limit
      opportunities by gender. Steps include: gender-neutral language and uniforms, equal sharing of
      housework, equal access to education, sport and jobs, and respect for transgender and
      non-binary people. The Supreme Court's NALSA judgment (2014) recognised transgender persons as
      a third gender; Kerala adopted India's first state transgender policy in 2015. Kerala
      initiatives: Kudumbashree (1998) for women's self-help groups and livelihoods, gender-neutral
      uniforms in some schools, and She Taxi and pink police services.
    explanations:
      text: "Gender neutrality doesn't mean pretending everyone is the same; it means no one's chances are decided by their gender. That can start small: sharing chores at home, letting every child choose their sport, using words like 'chairperson' instead of 'chairman', and treating transgender classmates with respect."
      visual: "Draw a set of balance scales: on one pan 'girls', on the other 'boys', with 'transgender' and 'non-binary' people standing on the beam, all level. Label it 'equal chances'."
      step_by_step: "Replace 'Every student must bring his book' with gender-neutral wording. Step 1: 'his' excludes many students. Step 2: Use 'their' or rephrase. Step 3: 'All students must bring their books.'"
      real_world: "Kudumbashree, started in Kerala in 1998, has lakhs of women members running small businesses and community kitchens."
    items:
      - prompt: "Which state adopted India's first transgender policy, in 2015?"
        options: ["Kerala", "Tamil Nadu", "Maharashtra", "Punjab"]
        answer: "Kerala"
        difficulty: 1
        hints: ["Our own state."]
        solution: "Kerala's State Policy for Transgenders came in 2015."
        mistakes: {"Tamil Nadu": transgender_rights}
      - prompt: "Which Supreme Court judgment of 2014 recognised transgender persons as a third gender?"
        options: ["NALSA judgment", "Kesavananda Bharati judgment", "Minerva Mills judgment", "Golaknath judgment"]
        answer: "NALSA judgment"
        difficulty: 2
        hints: ["Filed by the National Legal Services Authority."]
        solution: "The NALSA v. Union of India judgment (2014)."
        mistakes: {"Kesavananda Bharati judgment": transgender_rights}
      - prompt: "Which word is gender-neutral?"
        options: ["Chairperson", "Chairman", "Headmistress", "Policeman"]
        answer: "Chairperson"
        difficulty: 1
        hints: ["It does not say 'man' or 'woman'."]
        solution: "'Chairperson' includes everyone."
        mistakes: {"Chairman": stereotype_meaning}
      - prompt: "Kudumbashree, a women's empowerment programme of Kerala, was started in which year?"
        answer: "1998"
        check: "1998"
        difficulty: 2
        hints: ["Late 1990s."]
        solution: "Kudumbashree began in 1998."
      - prompt: "Which action at home supports a gender-neutral society?"
        options: ["Sharing housework equally among all family members", "Only women doing the cooking", "Only boys going out to play", "Giving boys more food"]
        answer: "Sharing housework equally among all family members"
        difficulty: 2
        hints: ["Equal responsibility."]
        solution: "Sharing chores removes the idea that housework is a woman's job."
        mistakes: {"Only women doing the cooking": stereotype_meaning}
      - prompt: "What does a gender-neutral society aim for?"
        options: ["Opportunities that do not depend on a person's gender", "Everyone wearing the same clothes", "Removing all differences between people", "Separate rules for each gender"]
        answer: "Opportunities that do not depend on a person's gender"
        difficulty: 3
        hints: ["It is about fairness, not sameness."]
        solution: "Gender neutrality means equal chances and respect for all, not erasing differences."
        mistakes: {"Separate rules for each gender": sex_vs_gender}
