# Class 9 Social Science I, chapter 8. Format: content/README.md.
subject: ss
chapter: 8
title: Towards a Gender-Neutral Society

tips:
  pictures_teach: "Children learn what jobs are 'for' them from what they see. What does showing only one gender in each job teach?"
  uncounted_work: "If work isn't paid, it isn't counted in national income. Who does most of that work, and what happens to its value?"
  equal_pay_article: "One Directive Principle speaks of equal pay for equal work for men and women. Which one?"
  why_reserve: "Look at how few women held local seats before reservation. What is reservation meant to change?"
  neighbourhood_groups: "Kudumbashree builds women's groups at the neighbourhood level. What do those groups do together?"
  k9_art39d: "Equal pay is a goal for the state, so it is in the Directive Principles (Part IV, from Article 36), not the Fundamental Rights 14–16."
  k9_art15: "Equality rights run from Article 14 onwards: 14 is equality before law, the very next one bans discrimination by religion, race, caste, sex or place of birth."
  sex_vs_gender: "Sex refers to biological differences; gender refers to the roles and behaviour that society expects. Gender roles are learned, so they can change."
  stereotype_meaning: "A stereotype is a fixed idea about what a whole group can or should do, not a fact. Gender-neutral words avoid saying 'man' or 'woman'; fair homes share work equally."
  equality_articles: "Equal pay for equal work is a Directive Principle, in Article 39, not a Fundamental Right like Articles 14–16."
  gender_laws: "Order the laws in time: the dowry law came in the early 1960s, equal pay in the 1970s, domestic violence in the 2000s, workplace harassment in 2013."
  reservation_figures: "Local bodies: at least one-third of seats for women (50% in Kerala). The Women's Reservation Act 2023 reserves one-third of Lok Sabha and Assembly seats."
  transgender_rights: "A southern state made India's first transgender policy, in 2015. The 2014 Supreme Court judgment is named after the legal services body that filed the case."
  break_stereotypes: "Letting every child choose any club freely breaks the idea that some activities are only for boys or girls."
  kudumbashree: "Kudumbashree was launched by the Kerala government in the late 1990s, in the year before 1999."
  unpaid_care: "Unpaid care work is done at home without a wage. A nurse, driver or teacher is paid."
  ss8_sex_vs_gender: One word is about the body we are born with; the other is about roles society expects. Which is learned?
  ss8_fact_or_fixed: A stereotype is a fixed idea about a whole group. A fact can be checked and is true for the case described.
  ss8_articles: '14: equality before law. 15: no discrimination. 16: equal chance in public jobs. 39(d): equal pay for equal work.'
  ss8_law_years: 'Put the laws in order by decade: dowry in the 1960s, equal pay in the 1970s, domestic violence in the 2000s, then workplace harassment, and the transgender rights law came last of all.'
  ss8_share_seats: Multiply the seats by the fraction reserved; if the answer is not whole, the law rounds up.
  ss8_neutral_word: A gender-neutral word fits anyone. Words ending in -man or -woman point to one gender.
  ss8_kerala_firsts: 'Kerala''s firsts: Kudumbashree (1998) and the first state transgender policy (2015).'

concepts:
  - code: ss9.gender.roles
    title: Sex, gender and stereotypes
    notes: |
      Sex refers to biological characteristics. Gender refers to the roles, behaviour and identities
      that society builds around them. Gender roles are learned from family, school, media and
      culture, so they differ between societies and change over time. Gender stereotypes are fixed,
      often unfair ideas ("girls are bad at maths", "boys must not cry") that limit choices for
      everyone. The gender division of labour often leaves women with unpaid care work at home.
      Gender identity includes women, men and transgender and non-binary people.
    explanations:
      text: "Nobody is born knowing that pink is for girls or that boys shouldn't help in the kitchen; we learn these ideas. Because they are learned, they can be unlearned. Stereotypes hurt everyone: a girl who loves cricket and a boy who loves cooking both deserve to follow their interests."
      visual: "Draw two columns: 'Sex (biological)' and 'Gender (learned from society)'. Put 'body differences' in the first, and 'who cooks, who drives, what colours to wear' in the second."
      step_by_step: "Is 'only men can be pilots' about sex or gender? Step 1: Flying a plane does not depend on biology. Step 2: It is an expectation made by society. Step 3: So it is a gender stereotype, and a false one."
      real_world: "Kerala has women bus drivers, women police stations and men working as nurses: proof that jobs are not fixed by gender."
    activity:
      type: sort
      prompt: Biology, a gender role, or a stereotype?
      bins:
      - Biological (sex)
      - Gender role
      - Stereotype
      items:
      - label: Only women can give birth
        bin: Biological (sex)
        clue: Can society change this?
        why: It comes from the body, so it is about sex.
      - label: Women do most unpaid care work at home
        bin: Gender role
        clue: Is it learned from family and culture?
        why: 'This division of labour is built by society: a gender role.'
      - label: Girls are bad at maths
        bin: Stereotype
        clue: A fixed, unfair idea about all girls.
        why: 'It is a stereotype: it is not true and limits choices.'
      - label: Boys must not cry
        bin: Stereotype
        clue: An unfair rule about all boys.
        why: 'A stereotype: it hurts boys too.'
      - label: Who wears which colour, set by custom
        bin: Gender role
        clue: Does it differ between societies?
        why: 'It is learned and changes: a gender role.'
      - label: Men usually grow beards
        bin: Biological (sex)
        clue: Body, not custom.
        why: A biological feature.
    lesson:
      - teach: Sex means biological features we are born with. Gender means the roles, behaviour and identities a society expects. Gender is learned from family, school, media and culture, so it differs between places and changes over time.
        check:
          prompt: Which of these is learned from society?
          options:
          - Gender roles
          - Biological sex
          - Height at birth
          answer: Gender roles
          why: Gender roles are taught by society; sex is biological.
        ways:
        - style: real_world
          teach: Who cooks at home and who goes to work isn't decided by our bodies; it differs from family to family, place to place, and has changed over the years. Sex is the biological features we are born with. Gender is the roles and behaviour a society expects, learned from family, school, media and culture.
      - teach: 'A gender stereotype is a fixed, often unfair idea about what girls or boys can or should do: ''girls are bad at maths'', ''boys must not cry''. Stereotypes limit everyone''s choices.'
        picture:
          kind: compare
          columns:
          - title: Stereotype
            points:
            - fixed idea about a whole group
            - e.g. only men can be pilots
          - title: Fact
            points:
            - can be checked
            - e.g. women fly fighter jets in the Indian Air Force
          alt: A stereotype compared with a fact.
        check:
          prompt: '''Only boys are good at sports'' is:'
          options:
          - A stereotype
          - A fact
          - A law
          answer: A stereotype
          why: It is a fixed, untrue idea about a whole group.
        ways:
        - style: step_by_step
          teach: 'Step 1: listen to the statement, like ''boys must not cry''. Step 2: ask: does it say all boys or all girls must be or do something? Step 3: ask: is it a fixed idea rather than a fact about each person? If yes, it is a stereotype, and it limits everyone''s choices.'
      - teach: 'The gender division of labour often gives women most of the unpaid care work at home: cooking, cleaning, looking after children and the elderly. This work is valuable but not counted in national income. Gender includes women, men, and transgender and non-binary people.'
        check:
          prompt: Which is an example of unpaid care work?
          options:
          - Looking after a sick grandparent at home
          - Working as a paid nurse
          - Selling vegetables
          answer: Looking after a sick grandparent at home
          why: It is care work done without pay.
        ways:
        - style: real_world
          teach: If someone were paid for cooking, cleaning and caring for grandparents, it would be a job. At home it is done free, often by women, and is not counted in national income, though it is valuable. Gender includes women, men, and transgender and non-binary people.
    items:
      - prompt: "Gender refers to:"
        options: ["Roles and behaviour that society expects of people", "Only biological differences", "A person's height", "A person's blood group"]
        answer: "Roles and behaviour that society expects of people"
        difficulty: 1
        hints: ["Sex is the biological part."]
        solution: "Gender is socially constructed; sex is biological."
        mistakes: {"Only biological differences": sex_vs_gender}
      - prompt: "'Boys don't cry' is an example of:"
        options: ["A gender stereotype", "A biological fact", "A law", "A scientific discovery"]
        answer: "A gender stereotype"
        difficulty: 1
        hints: ["A fixed idea about how boys should behave."]
        solution: "It is a stereotype; crying is a normal human feeling."
        mistakes: {"A biological fact": stereotype_meaning}
      - prompt: "Why can gender roles change over time?"
        options: ["They are learned from society, not fixed by birth", "Biology changes every year", "Laws forbid them", "They are written in our genes"]
        answer: "They are learned from society, not fixed by birth"
        difficulty: 2
        hints: ["Where do we learn them?"]
        solution: "Because society creates gender roles, society can change them."
        mistakes: {"They are written in our genes": sex_vs_gender}
      - prompt: "Which of these is unpaid care work?"
        options: ["Cooking and looking after children at home", "Working as a paid nurse", "Driving a taxi", "Teaching in a school"]
        answer: "Cooking and looking after children at home"
        difficulty: 2
        hints: ["Work done at home without wages."]
        solution: "Household and care work at home is usually unpaid, and is mostly done by women."
        mistakes: {"Working as a paid nurse": "unpaid_care", "Teaching in a school": "unpaid_care"}
      - prompt: "Which statement is a stereotype rather than a fact?"
        options: ["Girls are not good at maths", "People of all genders can be doctors", "Children learn behaviour from those around them", "Men and women both have the right to vote"]
        answer: "Girls are not good at maths"
        difficulty: 2
        hints: ["Which one is an unfair generalisation?"]
        solution: "Ability in maths does not depend on gender; that statement is a stereotype."
        mistakes: {"People of all genders can be doctors": stereotype_meaning}
      - prompt: "A school lets both girls and boys choose football or dance clubs freely. This helps to:"
        options: ["Break gender stereotypes", "Make stereotypes stronger", "Reduce choices", "Separate students"]
        answer: "Break gender stereotypes"
        difficulty: 3
        hints: ["Choices based on interest, not gender."]
        solution: "Free choice lets children follow interests regardless of gender."

        mistakes: {"Make stereotypes stronger": "break_stereotypes", "Separate students": "break_stereotypes"}
      - prompt: "A picture book shows only men as doctors and only women as nurses. What is the problem?"
        options: ["It strengthens gender stereotypes about jobs", "It shows the jobs accurately", "It promotes gender equality", "It makes no difference to children"]
        answer: "It strengthens gender stereotypes about jobs"
        difficulty: 2
        hints: ["Can women be doctors and men nurses?", "What will children reading it assume?"]
        solution: "Step 1: Either gender can do either job. Step 2: Showing only one way teaches children a stereotype about who 'should' do which work."
        mistakes: {"It shows the jobs accurately": pictures_teach, "It promotes gender equality": stereotype_meaning, "It makes no difference to children": pictures_teach}
      - prompt: "Why does it matter that unpaid care work is not counted in national income?"
        options: ["The large share of work done by women goes unrecognised", "Because it is well paid", "Because men do most of it", "Because it is not really work"]
        answer: "The large share of work done by women goes unrecognised"
        difficulty: 3
        hints: ["Who does most cooking, cleaning and caring at home?", "What happens to work no one measures?"]
        solution: "Step 1: Women do most unpaid care work. Step 2: Leaving it out of national income hides their contribution and its value to society."
        mistakes: {"Because it is well paid": unpaid_care, "Because men do most of it": uncounted_work, "Because it is not really work": uncounted_work}
      - prompt: 'Sex refers to:'
        options:
        - Biological characteristics
        - Roles society expects
        - Clothes people wear
        - Jobs people do
        answer: Biological characteristics
        difficulty: 1
        hints:
        - It is about the body.
        - Gender is the learned part.
        solution: 'Step 1: Gender is about social roles. Step 2: Sex is about the body. Step 3: Biological characteristics.'
        mistakes:
          Roles society expects: ss8_sex_vs_gender
      - prompt: Where do children first learn gender roles?
        options:
        - From family, school, media and culture
        - Only from their genes
        - From the census
        - From the Constitution
        answer: From family, school, media and culture
        difficulty: 1
        hints:
        - Gender roles are learned.
        - Who teaches children how to behave?
        solution: 'Step 1: Gender roles are not inborn. Step 2: Children copy family, teachers, TV and culture. Step 3: That is where they are learned.'
        mistakes:
          Only from their genes: ss8_sex_vs_gender
      - prompt: Which statement is a stereotype?
        options:
        - Women cannot be good engineers
        - Many women work as engineers in India
        - Boys and girls can both learn coding
        - Some men are nurses
        answer: Women cannot be good engineers
        difficulty: 2
        hints:
        - A stereotype is a fixed idea about a whole group.
        - Which statement says a whole group 'cannot'?
        solution: 'Step 1: Three statements describe real possibilities. Step 2: One claims a whole group can''t do something. Step 3: That is the stereotype.'
        mistakes:
          Some men are nurses: ss8_fact_or_fixed
      - prompt: 'Advertisements that show only women washing clothes:'
        options:
        - Reinforce gender stereotypes
        - Promote gender equality
        - Are required by law
        - Show biological sex
        answer: Reinforce gender stereotypes
        difficulty: 2
        hints:
        - What message do children take from such ads?
        - Does it suggest housework is everyone's job?
        solution: 'Step 1: The ad links housework to women only. Step 2: Viewers learn that idea. Step 3: It reinforces a stereotype.'
        mistakes:
          Promote gender equality: ss8_fact_or_fixed
      - prompt: A woman spends 5 hours a day on unpaid care work. How many hours is that in a week?
        answer: '35'
        check: 5*7
        difficulty: 1
        hints:
        - A week has 7 days.
        - Multiply hours per day by days.
        solution: 'Step 1: 5 hours a day. Step 2: 7 days. Step 3: 35 hours a week, all unpaid.'
        mistakes:
          '12': ss8_share_seats
      - prompt: Why do gender roles differ from one society to another?
        options:
        - They are shaped by culture, not fixed by biology
        - People in different places are born with different roles
        - Laws are the same everywhere
        - They never differ
        answer: They are shaped by culture, not fixed by biology
        difficulty: 2
        hints:
        - Are roles learned or inborn?
        - Cultures differ from place to place.
        solution: 'Step 1: Roles are learned. Step 2: Each culture teaches different things. Step 3: So roles differ between societies.'
        mistakes:
          People in different places are born with different roles: ss8_sex_vs_gender
      - prompt: A boy who likes cooking is teased for doing 'girls' work'. What is the problem?
        options:
        - A gender stereotype is limiting his choices
        - Cooking is against the law for boys
        - He is breaking a school rule
        - There is no problem
        answer: A gender stereotype is limiting his choices
        difficulty: 3
        hints:
        - Is cooking really only for girls?
        - What kind of idea is behind the teasing?
        solution: 'Step 1: Cooking is a skill for anyone. Step 2: The teasing comes from a fixed idea about boys. Step 3: The stereotype limits his choices.'
        mistakes:
          There is no problem: ss8_fact_or_fixed
  - code: ss9.gender.equality
    title: Gender equality in the Constitution and law
    after: [ss9.gender.roles]
    notes: |
      The Constitution promises equality: Article 14 (equality before law), Article 15 (no
      discrimination on grounds of religion, race, caste, sex or place of birth), Article 16 (equal
      opportunity in public employment), Article 39(d) (equal pay for equal work, a Directive
      Principle). Laws include the Dowry Prohibition Act (1961), the Equal Remuneration Act (1976),
      the Protection of Women from Domestic Violence Act (2005), the Sexual Harassment of Women at
      Workplace (POSH) Act (2013) and the Transgender Persons (Protection of Rights) Act (2019). One-third
      of seats in local bodies are reserved for women (Kerala: 50%); the Women's Reservation Act
      (2023) reserves one-third of seats in the Lok Sabha and State Assemblies.
    explanations:
      text: "Our Constitution says everyone is equal, but laws are needed to make that real. Asking for dowry is a crime; women and men must be paid the same for the same work; and violence at home or harassment at work can be reported. Reserving seats for women in panchayats has brought lakhs of women into public life."
      visual: "Draw a ladder from 'Constitution (Articles 14, 15, 16, 39(d))' to 'Laws (1961, 1976, 2005, 2013, 2019)' to 'Representation (local bodies, 2023 Act)'."
      step_by_step: "A legislature has 90 seats. How many are reserved for women under one-third reservation? Step 1: One-third of 90. Step 2: 90 ÷ 3 = 30. Step 3: 30 seats."
      real_world: "Kerala reserved 50% of local body seats for women from 2010, and many women now lead panchayats and municipal corporations."
    activity:
      type: sort
      prompt: Which article of the Constitution?
      bins:
      - Article 14
      - Article 15
      - Article 16
      - Article 39(d)
      items:
      - label: Everyone is equal before the law
        bin: Article 14
        clue: The first of the equality articles.
        why: 'Article 14: equality before law.'
      - label: No discrimination by religion, caste, sex or place of birth
        bin: Article 15
        clue: It lists the grounds that cannot be used.
        why: Article 15 bans such discrimination.
      - label: Equal chance in government jobs
        bin: Article 16
        clue: Public employment.
        why: Article 16 is about public employment.
      - label: Equal pay for equal work
        bin: Article 39(d)
        clue: A Directive Principle, not a fundamental right.
        why: Article 39(d) is a Directive Principle on pay.
      - label: A woman denied a government post for being a woman
        bin: Article 16
        clue: It's about a public job.
        why: Article 16 guarantees equal opportunity in public jobs.
      - label: A shop refusing entry to someone because of caste
        bin: Article 15
        clue: Discrimination on a listed ground.
        why: Article 15 forbids it.
    lesson:
      - teach: 'The Constitution promises equality. Article 14: equality before the law. Article 15: no discrimination on grounds of religion, race, caste, sex or place of birth. Article 16: equal opportunity in public jobs. Article 39(d), a Directive Principle: equal pay for equal work.'
        picture:
          kind: compare
          columns:
          - title: Equality rights
            points:
            - 'Art 14: equal before law'
            - 'Art 15: no discrimination'
            - 'Art 16: equal chance in public jobs'
          - title: Directive Principle
            points:
            - 'Art 39(d): equal pay for equal work'
          alt: Constitutional articles on equality.
        check:
          prompt: Which Article gives equality before the law?
          options:
          - Article 14
          - Article 39(d)
          - Article 324
          answer: Article 14
          why: Article 14 says all are equal before the law.
        ways:
        - style: visual
          teach: 'The Constitution''s promises of equality, side by side: Article 14, equality before the law; Article 15, no discrimination by religion, race, caste, sex or place of birth; Article 16, equal chance in public jobs. Article 39(d), a Directive Principle, asks for equal pay for equal work.'
          picture:
            kind: compare
            alt: Article 14 equality before law; Article 15 no discrimination; Article 16 equal opportunity in public jobs.
            columns:
            - title: Article 14
              points:
              - Equality before the law
            - title: Article 15
              points:
              - No discrimination
            - title: Article 16
              points:
              - Equal chance in public jobs
      - teach: 'Laws protect women and others: Dowry Prohibition Act (1961), Equal Remuneration Act (1976), Domestic Violence Act (2005), POSH Act against workplace sexual harassment (2013), and the Transgender Persons Act (2019).'
        check:
          prompt: Which law protects against sexual harassment at work?
          options:
          - POSH Act, 2013
          - Dowry Prohibition Act, 1961
          - RTI Act, 2005
          answer: POSH Act, 2013
          why: POSH stands for Prevention of Sexual Harassment.
        ways:
        - style: step_by_step
          teach: 'Step 1: dowry is banned by the Dowry Prohibition Act, 1961. Step 2: equal pay is protected by the Equal Remuneration Act, 1976. Step 3: violence at home is covered by the Domestic Violence Act, 2005. Step 4: harassment at work by the POSH Act, 2013. Step 5: transgender persons'' rights by the Transgender Persons Act, 2019.'
      - teach: Reservation brings women into decision-making. Local bodies reserve at least one-third of seats for women (Kerala, one-half). The Women's Reservation Act (2023) reserves one-third of seats in the Lok Sabha and State Assemblies.
        check:
          prompt: What share of Lok Sabha seats does the 2023 Act reserve for women?
          options:
          - One-third
          - One-half
          - One-tenth
          answer: One-third
          why: The 2023 Act reserves one-third.
        ways:
        - style: real_world
          teach: 'When a committee is full of one kind of person, others'' needs get missed. Reservation makes space: local bodies keep at least a third of seats for women, and Kerala keeps half. The Women''s Reservation Act, 2023, keeps one-third of seats in the Lok Sabha and State Assemblies for women.'
    items:
      - prompt: "Which Article forbids discrimination on grounds of sex?"
        options: ["Article 15", "Article 324", "Article 148", "Article 280"]
        answer: "Article 15"
        difficulty: 1
        hints: ["It lists religion, race, caste, sex and place of birth."]
        solution: "Article 15 prohibits such discrimination."
        mistakes: {"Article 324": k9_art15, "Article 148": cag_role}
      - prompt: "Equal pay for equal work for men and women is in which Article?"
        options: ["Article 39(d)", "Article 14", "Article 16", "Article 15"]
        answer: "Article 39(d)"
        difficulty: 2
        hints: ["A Directive Principle."]
        solution: "Article 39(d) directs equal pay for equal work."
        mistakes: {"Article 16": k9_art39d, "Article 14": k9_art39d}
      - prompt: "In which year was the Dowry Prohibition Act passed?"
        answer: "1961"
        check: "1961"
        difficulty: 2
        hints: ["Early 1960s."]
        solution: "The Dowry Prohibition Act was passed in 1961."
        mistakes: {"2005": gender_laws}
      - prompt: "A legislature has 90 seats. With one-third reserved for women, how many seats are reserved?"
        answer: "30"
        check: "90*Rational(1, 3)"
        difficulty: 1
        hints: ["90 ÷ 3."]
        solution: "90 ÷ 3 = 30 seats"
        mistakes: {"45": reservation_figures, "270": reservation_figures}
      - prompt: "What percentage of local body seats does Kerala reserve for women?"
        options: ["50%", "33%", "25%", "10%"]
        answer: "50%"
        difficulty: 2
        hints: ["More than the national minimum of one-third."]
        solution: "Kerala reserves half the seats for women."
        mistakes: {"33%": reservation_figures}
      - prompt: "Which law protects women from violence at home?"
        options: ["Protection of Women from Domestic Violence Act, 2005", "Right to Information Act, 2005", "Dowry Prohibition Act, 1961", "Equal Remuneration Act, 1976"]
        answer: "Protection of Women from Domestic Violence Act, 2005"
        difficulty: 2
        hints: ["'Domestic' means at home."]
        solution: "The 2005 Domestic Violence Act protects women at home."
        mistakes: {"Right to Information Act, 2005": rti_facts, "Equal Remuneration Act, 1976": gender_laws}
      - prompt: "A town council has 55 seats and 50% are reserved for women. Seats must be whole numbers, so the law rounds up. How many seats are reserved?"
        answer: "28"
        check: "ceiling(Rational(55, 2))"
        difficulty: 3
        hints: ["Half of 55 is 27.5."]
        solution: "55 ÷ 2 = 27.5, rounded up to 28."
        mistakes: {"27": reservation_figures}
      - prompt: "A company pays women less than men for exactly the same job. Which provision of the Constitution does this go against?"
        options: ["Article 39(d): equal pay for equal work", "Article 148: the CAG", "Article 324: the Election Commission", "Article 1: the name of India"]
        answer: "Article 39(d): equal pay for equal work"
        difficulty: 2
        hints: ["The problem is pay, not voting or auditing.", "It is a Directive Principle."]
        solution: "Step 1: The issue is unequal pay for the same work. Step 2: Article 39(d) directs equal pay for equal work for men and women (the Equal Remuneration Act puts it into law)."
        mistakes: {"Article 148: the CAG": equal_pay_article, "Article 324: the Election Commission": equal_pay_article, "Article 1: the name of India": equal_pay_article}
      - prompt: "Why are seats reserved for women in local bodies?"
        options: ["To bring more women into decision-making", "Because women cannot win open seats", "To reduce the number of seats", "To stop men from voting"]
        answer: "To bring more women into decision-making"
        difficulty: 2
        hints: ["How many women held these seats before reservation?", "Who decides about local roads, water and schools?"]
        solution: "Step 1: Women were badly under-represented in local bodies. Step 2: Reservation brings women into local decision-making and leadership."
        mistakes: {"Because women cannot win open seats": why_reserve, "To reduce the number of seats": why_reserve, "To stop men from voting": why_reserve}
      - prompt: "A woman and a man doing the same job are paid differently. Which part of the Constitution says this is wrong?"
        options:
        - "Article 39(d): equal pay for equal work"
        - "Article 14: equality before law only in courts"
        - "The Union List"
        - "Article 16: only for government jobs"
        answer: "Article 39(d): equal pay for equal work"
        difficulty: 3
        hints: ["Look for the article about pay.", "It is a Directive Principle, backed by the Equal Remuneration Act of 1976."]
        solution: "Step 1: The issue is unequal pay for the same work. Step 2: Article 39(d) directs equal pay for equal work for men and women. Step 3: The Equal Remuneration Act (1976) puts it into law."
        mistakes: {"Article 14: equality before law only in courts": equal_pay_article, "Article 16: only for government jobs": equal_pay_article}
      - prompt: Which Article guarantees equal opportunity in public employment?
        options:
        - Article 16
        - Article 14
        - Article 15
        - Article 39(d)
        answer: Article 16
        difficulty: 2
        hints:
        - 14 is equality before law; 15 is no discrimination.
        - Which one is about government jobs?
        solution: 'Step 1: 14: equality before law. 15: no discrimination. 39(d): equal pay. Step 2: Public jobs are covered next to 15. Step 3: Article 16.'
        mistakes:
          Article 15: ss8_articles
      - prompt: In which year was the Transgender Persons (Protection of Rights) Act passed?
        answer: '2019'
        check: '2019'
        difficulty: 2
        hints:
        - It is the most recent of the laws listed.
        - It came after the POSH Act of 2013.
        solution: 'Step 1: POSH was 2013. Step 2: The transgender rights law came later. Step 3: 2019.'
        mistakes:
          '2013': ss8_law_years
          '2014': ss8_kerala_firsts
      - prompt: A State Assembly has 141 seats, and one-third are reserved for women. How many seats is that, rounded up?
        answer: '47'
        check: ceiling(141/3)
        difficulty: 3
        hints:
        - Find one-third of 141.
