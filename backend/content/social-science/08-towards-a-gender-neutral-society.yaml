          '4029': ss8_kerala_firsts
      - prompt: Which family practice supports a gender-neutral society?
        options:
        - Boys and girls both help with cooking and cleaning
        - Only girls do housework
        - Only boys go to school
        - Only fathers make decisions
        answer: Boys and girls both help with cooking and cleaning
        difficulty: 1
        hints:
