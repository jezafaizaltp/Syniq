# Class 9 Social Science I, chapter 2. Format: content/README.md.
subject: ss
chapter: 2
title: Ideas and Early States

tips:
  vedas_count: "There are four Vedas: Rig, Sama, Yajur and Atharva. The Rigveda is the oldest."
  vedic_change: "Early Vedic life was mainly pastoral (cattle were wealth); in the Later Vedic period farming with iron tools grew and the varna system became rigid."
  buddha_places: "Buddha: born at Lumbini, enlightened at Bodh Gaya, first sermon at Sarnath, died at Kushinagar."
  jain_buddha_mix: "Mahavira (24th Tirthankara) founded Jainism's teachings on strict ahimsa and the three jewels; Buddha taught the Four Noble Truths and the Eightfold Path."
