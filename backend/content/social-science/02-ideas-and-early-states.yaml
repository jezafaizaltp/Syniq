# Class 9 Social Science I, chapter 2. Format: content/README.md.
subject: ss
chapter: 2
title: Ideas and Early States

tips:
  priests_language: The Buddha and Mahavira taught in the people's spoken languages. The Vedas were in the older language of priests and rituals.
  peoples_language: The Buddha wanted farmers and traders to understand him, so he did not use the priests' language.
  wrong_era_city: Mohenjo-daro was a Harappan city, gone more than a thousand years before Magadha. Magadha's new capital stood on the Ganga, at today's Patna.
  veda_purposes: "Each Veda has its own purpose: hymns of praise, chants arranged for singing, formulas for sacrifices, and charms for daily life. Which one is for singing?"
  middle_path: "Siddhartha tried a life of luxury, then a life of harsh fasting. What did he choose instead?"
  shared_ideas: "Look for what Mahavira and the Buddha both opposed and both taught. Which choice fits both?"
  dhamma_aims: "Ashoka's dhamma was a moral code for everyone, of every faith. What kind of behaviour did his edicts ask for?"
  river_capital: "Rivers were the highways of the time. Which great river flows past Pataliputra (Patna)?"
  vedas_count: "Name the Vedas one by one: Rig, Sama, Yajur, Atharva. Count them. The oldest is the one made of hymns (ṛc means praise)."
  vedic_change: "Early Vedic people moved with their herds, so wealth was counted in animals. Later, iron tools let farming spread and social divisions became fixed."
  buddha_places: "Follow Buddha's life in order: birth (Lumbini), enlightenment under the bodhi tree (the place is named after it), first sermon in the deer park near Varanasi, death at Kushinagar."
  jain_buddha_mix: "Mahavira (24th Tirthankara) founded Jainism's teachings on strict ahimsa and the three jewels; Buddha taught the Four Noble Truths and the Eightfold Path."
  mahajanapada_count: "Buddhist texts list a number of great states that is two eights. Among them, the kingdom in south Bihar, with iron mines and fertile land, became strongest."
  maurya_people: "The Mauryan empire's founder had a minister also called Chanakya, who wrote a book on statecraft. The philosophical texts about atman and brahman are a different group, 'sitting near' a teacher."
  ashoka_dhamma: "Ashoka gave up war after a bloody campaign against a kingdom on the east coast (in today's Odisha). His edicts used the common spoken language of the time, not Sanskrit. The Delhi Sultanate ended much later, in a battle near Delhi in 1526."
  magadha_power: "Magadha had fertile land to feed people, iron for weapons and tools, and rivers for transport."
  new_faiths_spread: "Buddhism and Jainism used people's own languages (like Pali and Prakrit), not Sanskrit, and rejected costly rituals."
  sabha_samiti: "Sabha and samiti were assemblies of people that advised the rajan, not temples or taxes."
  count_before: If someone is number n in a line, the people before them are numbers 1 to n − 1.
  oral_first: The Vedas were learned by heart and recited for centuries before anyone wrote them down. How were they passed on?
  herd_then_farm: Early Vedic people moved with their animals. What did they value most before farming spread?
  life_order: Follow the Buddha's life in order, birth, enlightenment, first sermon and death, and match each to its place.
  jewels_three: Jainism's three jewels are about believing, knowing and acting rightly. Which choice is one of these?
  states_sixteen: The great states of the 6th century BCE were later swallowed by the strongest one, in south Bihar.
  maurya_line: The Mauryan line runs grandfather, then father, then grandson. The one who fought at Kalinga came last of the three.
  greek_writer: A visitor from a Greek kingdom lived at the Mauryan court and wrote a book about India. Kautilya was an Indian minister.

concepts:
  - code: ss9.ideas.vedic
    title: Vedic society and ideas
    notes: |
      The Vedic period (about 1500–600 BCE) is known from the Vedas, composed in Sanskrit and passed on
      orally. Four Vedas: Rigveda (oldest), Samaveda, Yajurveda, Atharvaveda. Early Vedic people were
      mainly pastoral; cattle meant wealth; assemblies called sabha and samiti advised the chief
      (rajan). In the Later Vedic period people moved east into the Ganga plains, iron tools spread
      farming, kingdoms grew, rituals became elaborate and the varna system became rigid. The
      Upanishads raised questions about the soul and the universe.
    explanations:
      text: "The Vedas were memorised and recited for centuries before they were written down. In the early hymns people prayed for cattle and rain, and tribal assemblies met to discuss matters. Later, as farming spread in the Ganga plains, chiefs became kings, society divided into rigid varnas, and thinkers in the Upanishads began asking deep questions about life."
      visual: "Draw two columns: Early Vedic (cattle, tribe, sabha and samiti, flexible society) and Later Vedic (farming with iron, kingdoms, big rituals, rigid varna)."
      step_by_step: "Which Veda is oldest? Step 1: There are four Vedas. Step 2: The Rigveda's hymns were composed first. Step 3: The Rigveda is the oldest."
      real_world: "The Vedic chanting tradition, passed on orally for thousands of years, is recognised by UNESCO as intangible heritage."
    activity:
      type: sort
      prompt: Early Vedic or Later Vedic?
      bins:
      - Early Vedic
      - Later Vedic
      items:
      - label: Cattle counted as wealth
        bin: Early Vedic
        clue: Were people mainly herders or farmers then?
        why: Early Vedic people were mainly pastoral.
      - label: Sabha and samiti advise the rajan
        bin: Early Vedic
        clue: Assemblies still had a say over the chief.
        why: These assemblies were strong in the early period.
      - label: The Rigveda is composed
        bin: Early Vedic
        clue: It is the oldest Veda.
        why: The Rigveda belongs to the early period.
      - label: People move east into the Ganga plains
        bin: Later Vedic
        clue: Forests had to be cleared first.
        why: The eastward move came in the later period.
      - label: Iron tools spread farming
        bin: Later Vedic
        clue: Iron came into use about 1200 BCE.
        why: Iron helped farming grow in the later period.
      - label: Varna system becomes rigid
        bin: Later Vedic
        clue: Did society get more or less fixed over time?
        why: Varna became rigid in the later period.
      - label: Upanishads ask about the soul
        bin: Later Vedic
        clue: These questions came near the end of the Vedic age.
        why: The Upanishads are later Vedic.
    lesson:
      - teach: 'The Vedic period (about 1500–600 BCE) is known from the Vedas, sacred texts in Sanskrit. They were learned by heart and recited for centuries before being written down. There are four: Rigveda (the oldest, hymns of praise), Samaveda (hymns set to music), Yajurveda (rituals) and Atharvaveda (charms for daily life).'
        check:
          prompt: Which is the oldest Veda?
          options:
          - Rigveda
          - Atharvaveda
          - Samaveda
          answer: Rigveda
          why: The Rigveda's hymns are the earliest.
      - teach: Early Vedic people were mostly herders. Cattle meant wealth. The chief (rajan) was advised by assemblies of the people called sabha and samiti. Later, people moved east into the Ganga plains, used iron tools to clear forests and became settled farmers. Kingdoms grew larger.
        picture:
          kind: compare
          columns:
          - title: Early Vedic
            points:
            - herders
            - wealth in cattle
            - sabha and samiti advise the rajan
          - title: Later Vedic
            points:
            - farmers in the Ganga plains
            - iron tools
            - bigger kingdoms, rigid varna
          alt: Changes from the Early to the Later Vedic period.
        check:
          prompt: What were sabha and samiti?
          options:
          - Assemblies of the people
          - Types of tax
          - Temples
          answer: Assemblies of the people
          why: They advised the rajan.
      - teach: In the Later Vedic period, rituals became costly and the varna system became rigid, fixing people's place by birth. At the same time, thinkers in the Upanishads asked deep questions about the soul (atman) and the universe (brahman).
        check:
          prompt: Which texts asked questions about atman and brahman?
          options:
          - Upanishads
          - Arthashastra
          - Indica
          answer: Upanishads
          why: The Upanishads are philosophical texts.
    items:
      - prompt: "Which is the oldest Veda?"
        options: ["Rigveda", "Samaveda", "Yajurveda", "Atharvaveda"]
        answer: "Rigveda"
        difficulty: 1
        hints: ["Its hymns were composed first."]
        solution: "The Rigveda is the oldest."
        mistakes: {"Atharvaveda": vedas_count}
      - prompt: "How many Vedas are there?"
        answer: "4"
        check: "4"
        difficulty: 1
        hints: ["Rig, Sama, Yajur, ..."]
        solution: "Four: Rig, Sama, Yajur and Atharva."
        mistakes: {"3": vedas_count}
      - prompt: "In the Early Vedic period, wealth was mainly counted in:"
        options: ["Cattle", "Gold coins", "Land", "Iron tools"]
        answer: "Cattle"
        difficulty: 1
        hints: ["They were mainly herders."]
        solution: "Early Vedic people were pastoral; cattle were wealth."
        mistakes: {"Land": vedic_change}
      - prompt: "Sabha and samiti in the Vedic period were:"
        options: ["Assemblies of the people", "Temples", "Types of taxes", "Weapons"]
        answer: "Assemblies of the people"
        difficulty: 2
        hints: ["They advised the chief."]
        solution: "Sabha and samiti were assemblies that advised the rajan."
        mistakes: {"Temples": "sabha_samiti", "Types of taxes": "sabha_samiti"}
      - prompt: "Which change marks the Later Vedic period?"
        options: ["Spread of farming with iron tools and a rigid varna system", "Return to hunting and gathering", "End of all kingdoms", "Use of only stone tools"]
        answer: "Spread of farming with iron tools and a rigid varna system"
        difficulty: 2
        hints: ["People moved into the Ganga plains."]
        solution: "Iron tools helped farming spread, kingdoms grew and varna became rigid."
        mistakes: {"Return to hunting and gathering": vedic_change}
      - prompt: "Which texts asked questions about the soul (atman) and the universe (brahman)?"
        options: ["Upanishads", "Arthashastra", "Indica", "Jataka tales"]
        answer: "Upanishads"
        difficulty: 3
        hints: ["Philosophical texts at the end of the Vedic period."]
        solution: "The Upanishads discuss atman and brahman."
        mistakes: {"Arthashastra": maurya_people}
      - prompt: "Early Vedic people were mostly herders, while Later Vedic people were mostly settled farmers in the Ganga plain. What helped this change?"
        options: ["Iron tools to clear forests and plough", "Bronze tractors", "Trade with Rome", "Large dams on rivers"]
        answer: "Iron tools to clear forests and plough"
        difficulty: 2
        hints: ["The Ganga plain was thickly forested.", "Which metal came into use in the Later Vedic period?"]
        solution: "Step 1: The Ganga plain was covered with forest. Step 2: Iron axes and ploughs made it possible to clear and farm it."
        mistakes: {"Bronze tractors": vedic_change, "Trade with Rome": vedic_change, "Large dams on rivers": vedic_change}
      - prompt: "Which Veda is mainly made of hymns arranged to be sung?"
        options: ["Samaveda", "Rigveda", "Yajurveda", "Atharvaveda"]
        answer: "Samaveda"
        difficulty: 2
        hints: ["The Rigveda is hymns of praise; the Yajurveda, sacrificial formulas.", "The Atharvaveda has charms for daily life."]
        solution: "Step 1: Saman means melody. Step 2: The Samaveda arranges hymns (mostly from the Rigveda) for singing, and is linked to Indian music."
        mistakes: {"Rigveda": veda_purposes, "Yajurveda": veda_purposes, "Atharvaveda": veda_purposes}
      - prompt: "Which change made it possible for Later Vedic people to farm the thick forests of the Ganga plains?"
        options:
        - "Iron tools such as axes and ploughs"
        - "The invention of the wheel"
        - "Copper coins"
        - "Writing on palm leaves"
        answer: "Iron tools such as axes and ploughs"
        difficulty: 3
        hints: ["Clearing forest and ploughing heavy soil need strong tools.", "Which metal spread in the Later Vedic period?"]
        solution: "Step 1: The Ganga plains were covered with thick forest and heavy soil. Step 2: Iron axes cleared forests and iron ploughs broke the soil. Step 3: So iron tools spread farming eastwards."
        mistakes: {"The invention of the wheel": vedic_change, "Copper coins": vedic_change}
      - prompt: In which language were the Vedas composed?
        options:
        - Sanskrit
        - Pali
        - Tamil
        - Persian
        answer: Sanskrit
        difficulty: 1
        hints:
        - Buddhist texts used a different language.
        - It is the classical language of Vedic hymns.
        solution: 'Step 1: Pali was used for Buddhist texts. Step 2: Persian came much later. Step 3: The Vedas are in Sanskrit.'
        mistakes:
          Pali: priests_language
      - prompt: How were the Vedas first passed from one generation to the next?
        options:
        - They were learned by heart and recited
        - They were printed in books
        - They were carved on seals
        - They were painted in caves
        answer: They were learned by heart and recited
        difficulty: 1
        hints:
        - Writing them down came much later.
        - Pupils repeated after their teachers.
        solution: 'Step 1: The Vedas were composed long before they were written. Step 2: Pupils memorised them. Step 3: They were passed on orally.'
        mistakes:
          They were printed in books: oral_first
      - prompt: Which Veda contains charms and spells for everyday life?
        options:
        - Atharvaveda
        - Rigveda
        - Samaveda
        - Yajurveda
        answer: Atharvaveda
        difficulty: 2
        hints:
        - Each Veda has a purpose.
        - Hymns, songs, rituals… which one is left?
        solution: 'Step 1: Rigveda: hymns. Samaveda: music. Yajurveda: rituals. Step 2: The last deals with daily life. Step 3: Atharvaveda.'
        mistakes:
          Samaveda: veda_purposes
      - prompt: What did the rajan of an Early Vedic tribe mainly protect?
        options:
        - The tribe's cattle and people
        - Large cities and factories
        - Railway lines
        - Harappan dockyards
        answer: The tribe's cattle and people
        difficulty: 2
        hints:
        - Early Vedic people were herders.
        - What was their wealth?
        solution: 'Step 1: Early Vedic people were herders. Step 2: Cattle were their wealth. Step 3: The rajan protected the people and their cattle.'
        mistakes:
          Large cities and factories: herd_then_farm
      - prompt: In which period did the varna system become rigid?
        options:
        - Later Vedic period
        - Early Vedic period
        - Harappan period
        - Palaeolithic age
        answer: Later Vedic period
        difficulty: 2
        hints:
        - Social divisions hardened as kingdoms and rituals grew.
        - Was that early or later in the Vedic age?
        solution: 'Step 1: Early Vedic society was simpler. Step 2: Later, kingdoms grew and rituals spread. Step 3: Varna became rigid in the Later Vedic period.'
        mistakes:
          Early Vedic period: vedic_change
      - prompt: The Vedic period lasted from about 1500 BCE to 600 BCE. About how many years is that?
        answer: '900'
        check: 1500-600
        difficulty: 3
        hints:
        - Both dates are BCE.
        - Subtract the smaller from the larger.
        solution: 'Step 1: 1500 BCE to 600 BCE. Step 2: 1500 − 600. Step 3: = 900 years.'
        mistakes:
          '2100': both_bce

  - code: ss9.ideas.new_faiths
    title: Buddhism and Jainism
    after: [ss9.ideas.vedic]
    notes: |
      In the 6th century BCE new ideas challenged costly rituals and the dominance of priests.
      Vardhamana Mahavira, the 24th Tirthankara, taught strict ahimsa (non-violence) and the three
      jewels (triratna): right faith, right knowledge, right conduct. Gautama Buddha was born at
      Lumbini, attained enlightenment at Bodh Gaya, gave his first sermon at Sarnath and died at
      Kushinagar. He taught the Four Noble Truths and the Eightfold Path (the middle way). Both used the
      people's languages (Prakrit, Pali), opposed caste inequality and gained followers among traders
      and ordinary people.
    explanations:
      text: "Many people were unhappy with expensive sacrifices and with a society that ranked people by birth. Mahavira and Buddha offered a different path: live simply, harm no living thing, and find freedom from suffering through your own conduct. They spoke in everyday languages, so ordinary people could understand them."
      visual: "Draw a map of the Ganga plains with four dots for the Buddha's life: Lumbini (birth), Bodh Gaya (enlightenment), Sarnath (first sermon), Kushinagar (death)."
      step_by_step: "Where did Buddha give his first sermon? Step 1: He was enlightened at Bodh Gaya. Step 2: He then went to the deer park near Varanasi. Step 3: That is Sarnath."
      real_world: "The Ashoka lion capital from Sarnath, where Buddha preached, is India's national emblem."
    activity:
      type: sort
      prompt: Whose life or teaching is it?
      bins:
      - Gautama Buddha
      - Vardhamana Mahavira
      - Both
      items:
      - label: Born at Lumbini
        bin: Gautama Buddha
        clue: He gave his first sermon at Sarnath.
        why: Buddha was born at Lumbini.
      - label: Enlightenment at Bodh Gaya
        bin: Gautama Buddha
        clue: A place named after enlightenment.
        why: Buddha attained enlightenment at Bodh Gaya.
      - label: The Four Noble Truths and the Eightfold Path
        bin: Gautama Buddha
        clue: The 'middle way'.
        why: These are Buddha's teachings.
      - label: The 24th Tirthankara
        bin: Vardhamana Mahavira
        clue: Tirthankaras belong to which faith?
        why: Mahavira was the 24th Tirthankara of Jainism.
      - label: 'Triratna: right faith, knowledge, conduct'
        bin: Vardhamana Mahavira
        clue: The three jewels of Jainism.
        why: Mahavira taught the triratna.
      - label: Taught in people's languages, against caste inequality
        bin: Both
        clue: Did only one of them reach ordinary people?
        why: Both used Prakrit or Pali and opposed caste inequality.
    lesson:
      - teach: 'In the 6th century BCE, many people questioned costly rituals and the power of priests. Two great teachers offered new paths: Vardhamana Mahavira and Gautama Buddha. Both taught in the people''s languages (Prakrit, Pali), not Sanskrit.'
        check:
          prompt: Why did the new teachings reach ordinary people?
          options:
          - They used the people's own languages
          - They were only in Sanskrit
          - They needed costly rituals
          answer: They used the people's own languages
          why: Everyone could understand Prakrit and Pali.
      - teach: 'Mahavira, the 24th Tirthankara of Jainism, taught strict ahimsa (non-violence to all living things) and the three jewels: right faith, right knowledge and right conduct.'
        check:
          prompt: What does ahimsa mean?
          options:
          - Non-violence
          - Wealth
          - Prayer
          answer: Non-violence
          why: Ahimsa means not harming any living being.
      - teach: The Buddha was born at Lumbini, gained enlightenment at Bodh Gaya, gave his first sermon at Sarnath and died at Kushinagar. He taught the Four Noble Truths and the Eightfold Path, a 'middle way' between luxury and harsh self-punishment.
        picture:
          kind: flow
          steps:
          - 'Lumbini: birth'
          - 'Bodh Gaya: enlightenment'
          - 'Sarnath: first sermon'
          - 'Kushinagar: death'
          alt: Four places in the Buddha's life, in order.
        check:
          prompt: Where was the Buddha born?
          options:
          - Lumbini
          - Sarnath
          - Kushinagar
          answer: Lumbini
          why: Lumbini is his birthplace; Sarnath was the first sermon.
    items:
      - prompt: "Where did Gautama Buddha attain enlightenment?"
        options: ["Bodh Gaya", "Lumbini", "Sarnath", "Kushinagar"]
        answer: "Bodh Gaya"
        difficulty: 1
        hints: ["Under the Bodhi tree."]
        solution: "Buddha attained enlightenment at Bodh Gaya."
        mistakes: {"Lumbini": buddha_places, "Sarnath": buddha_places}
      - prompt: "Who was the 24th Tirthankara of Jainism?"
        options: ["Vardhamana Mahavira", "Gautama Buddha", "Ashoka", "Chanakya"]
        answer: "Vardhamana Mahavira"
        difficulty: 1
        hints: ["The last Tirthankara."]
        solution: "Mahavira was the 24th Tirthankara."
        mistakes: {"Gautama Buddha": jain_buddha_mix}
      - prompt: "The Four Noble Truths and the Eightfold Path were taught by:"
        options: ["Gautama Buddha", "Mahavira", "Kautilya", "Megasthenes"]
        answer: "Gautama Buddha"
        difficulty: 2
        hints: ["The 'middle way'."]
        solution: "These are the Buddha's teachings."
        mistakes: {"Mahavira": jain_buddha_mix}
      - prompt: "Where did Buddha give his first sermon?"
        options: ["Sarnath", "Bodh Gaya", "Pataliputra", "Lumbini"]
        answer: "Sarnath"
        difficulty: 2
        hints: ["Near Varanasi."]
        solution: "The first sermon was at Sarnath."
        mistakes: {"Bodh Gaya": buddha_places}
      - prompt: "Why did Buddhism and Jainism spread among ordinary people?"
        options: ["They taught in people's languages and opposed costly rituals and caste inequality", "Kings forced everyone to join", "They were taught only in Sanskrit", "They promised wealth"]
        answer: "They taught in people's languages and opposed costly rituals and caste inequality"
        difficulty: 2
        hints: ["Think of Prakrit and Pali."]
        solution: "Simple teachings in local languages, without expensive rituals, attracted many."
        mistakes: {"They were taught only in Sanskrit": "new_faiths_spread", "Kings forced everyone to join": "new_faiths_spread"}
      - prompt: "Which of these is one of the three jewels (triratna) of Jainism?"
        options: ["Right knowledge", "Eightfold Path", "Four Noble Truths", "Dhamma edicts"]
        answer: "Right knowledge"
        difficulty: 3
        hints: ["The three jewels are about the right way to believe, to know and to act. Which choice fits?"]
        solution: "The triratna are right faith, right knowledge and right conduct."
        mistakes: {"Eightfold Path": jain_buddha_mix, "Four Noble Truths": jain_buddha_mix}
      - prompt: "What does the Buddha's 'Middle Path' mean?"
        options: ["Avoiding both luxury and extreme self-punishment", "Fasting until the body gives up", "Performing many sacrifices", "Living only in cities"]
        answer: "Avoiding both luxury and extreme self-punishment"
        difficulty: 2
        hints: ["Siddhartha grew up as a prince.", "He then tried harsh fasting. Did it bring enlightenment?"]
        solution: "Step 1: He found neither luxury nor harsh self-denial led to truth. Step 2: The Middle Path avoids both extremes."
        mistakes: {"Fasting until the body gives up": middle_path, "Performing many sacrifices": middle_path, "Living only in cities": middle_path}
      - prompt: "Which idea did Buddhism and Jainism share?"
        options: ["Non-violence and rejecting costly rituals", "Animal sacrifice to Vedic gods", "Caste fixed by birth as the way to salvation", "Teaching only in Sanskrit"]
        answer: "Non-violence and rejecting costly rituals"
        difficulty: 3
        hints: ["Both arose in the 6th century BCE as a challenge to priests.", "Both taught in people's languages."]
        solution: "Step 1: Both opposed expensive sacrifices and priestly control. Step 2: Both stressed ahimsa and right conduct over birth."
        mistakes: {"Animal sacrifice to Vedic gods": shared_ideas, "Caste fixed by birth as the way to salvation": shared_ideas, "Teaching only in Sanskrit": new_faiths_spread}
      - prompt: Where did the Buddha pass away?
        options:
        - Kushinagar
        - Lumbini
        - Bodh Gaya
        - Sarnath
        answer: Kushinagar
        difficulty: 1
        hints:
        - List the four places of his life in order.
        - Which comes last?
        solution: 'Step 1: Lumbini (birth), Bodh Gaya (enlightenment), Sarnath (sermon). Step 2: The last place is where he died. Step 3: Kushinagar.'
        mistakes:
          Sarnath: life_order
      - prompt: In which language did the Buddha teach?
        options:
        - Pali
        - Sanskrit
        - Persian
        - English
        answer: Pali
        difficulty: 1
        hints:
        - He wanted ordinary people to understand.
        - Which was a language of the common people?
        solution: 'Step 1: Sanskrit was the language of priests. Step 2: The Buddha wanted everyone to understand. Step 3: He taught in Pali, a people''s language.'
        mistakes:
          Sanskrit: peoples_language
      - prompt: 'The ''Eightfold Path'' is a teaching of:'
        options:
        - Buddhism
        - Jainism
        - The Rigveda
        - The Arthashastra
        answer: Buddhism
        difficulty: 1
        hints:
        - It goes with the Four Noble Truths.
        - Jainism has the three jewels instead.
        solution: 'Step 1: The Four Noble Truths and the Eightfold Path go together. Step 2: Jainism teaches the three jewels. Step 3: The Eightfold Path is Buddhist.'
        mistakes:
          Jainism: jain_buddha_mix
      - prompt: Which is one of the three jewels (triratna) of Jainism?
        options:
        - Right conduct
        - Right sacrifice
        - Right wealth
        - Right war
        answer: Right conduct
        difficulty: 2
        hints:
        - The jewels are about faith, knowledge and how you act.
        - Which choice is about action?
        solution: 'Step 1: The three jewels are right faith, right knowledge and right conduct. Step 2: Sacrifice, wealth and war are not among them. Step 3: Right conduct.'
        mistakes:
          Right sacrifice: jewels_three
      - prompt: Who among these supported Buddhism and Jainism in large numbers?
        options:
        - Traders and ordinary people
        - Only priests who led costly rituals
        - Only the Harappans
        - Only foreign kings
        answer: Traders and ordinary people
        difficulty: 2
        hints:
        - The new faiths opposed costly rituals and caste inequality.
        - Who gained most from that?
        solution: 'Step 1: The new faiths rejected expensive rituals. Step 2: They opposed caste inequality. Step 3: Traders and ordinary people welcomed them.'
        mistakes:
          Only priests who led costly rituals: new_faiths_spread
      - prompt: Why did Mahavira's followers take great care not to harm even insects?
        options:
        - Jainism teaches strict ahimsa to all living things
        - Insects were sacred only in Harappa
        - Killing insects was a crime by law
        - It was a rule of the Vedas
        answer: Jainism teaches strict ahimsa to all living things
        difficulty: 3
        hints:
        - Think of the central teaching of Jainism.
        - How far does it extend?
        solution: 'Step 1: Jainism''s key teaching is ahimsa. Step 2: It applies to every living being. Step 3: So followers avoid harming even insects.'
        mistakes:
          It was a rule of the Vedas: shared_ideas
      - prompt: Mahavira was the 24th Tirthankara. If the Tirthankaras came one after another, how many came before him?
        answer: '23'
        check: 24-1
        difficulty: 2
        hints:
        - He was the 24th in line.
        - How many are before the 24th?
        solution: 'Step 1: Mahavira is number 24. Step 2: Those before him are numbers 1 to 23. Step 3: 23 came before him.'
        mistakes:
          '24': count_before

  - code: ss9.ideas.states
    title: Mahajanapadas and the Mauryan empire
    after: [ss9.ideas.vedic]
    notes: |
      By the 6th century BCE there were 16 Mahajanapadas (great states) such as Magadha, Kosala,
      Vatsa, Avanti and the Vajji confederacy. Magadha grew strongest thanks to fertile land, iron
      mines, rivers and able rulers; its capitals were Rajagriha and later Pataliputra. Chandragupta
      Maurya, guided by Chanakya (Kautilya, author of the Arthashastra), founded the Mauryan empire in
      about 321 BCE. Megasthenes, a Greek envoy, wrote the Indica. Ashoka, after the Kalinga war (261
      BCE), gave up conquest and spread dhamma through edicts in Prakrit, mostly in the Brahmi script.
    explanations:
      text: "Small tribal territories grew into sixteen large states. Magadha had rich farmland, iron for weapons and the river Ganga for transport, so it swallowed its rivals. The Mauryas turned it into an empire covering most of the subcontinent. Ashoka, shocked by the bloodshed at Kalinga, chose to rule by dhamma: tolerance, kindness and care for all."
      visual: "Draw a family tree: Chandragupta Maurya → Bindusara → Ashoka. Next to Chandragupta write 'Chanakya: Arthashastra'; next to Ashoka write 'Kalinga war → dhamma'."
      step_by_step: "How many years after the Mauryan empire began was the Kalinga war? Step 1: Founded about 321 BCE. Step 2: Kalinga war 261 BCE. Step 3: BCE years count down, so 321 − 261 = 60 years."
      real_world: "The wheel on India's flag is the Ashoka Chakra, taken from Ashoka's pillar at Sarnath."
    activity:
      type: order
      prompt: Put the events in order.
      steps:
      - 16 Mahajanapadas, such as Magadha and Kosala
      - Magadha grows strongest, capital Pataliputra
      - Chandragupta Maurya founds the Mauryan empire (321 BCE)
      - Ashoka fights the Kalinga war (261 BCE)
      - Ashoka spreads dhamma through edicts
      reasons:
        Magadha grows strongest, capital Pataliputra: Magadha had to beat the other Mahajanapadas first, using fertile land, iron and rivers.
        Chandragupta Maurya founds the Mauryan empire (321 BCE): The Mauryan empire grew out of Magadha's power.
        Ashoka fights the Kalinga war (261 BCE): Ashoka was Chandragupta's grandson, so he came later.
        Ashoka spreads dhamma through edicts: He gave up conquest only after seeing the suffering of the Kalinga war.
    lesson:
      - teach: By the 6th century BCE, small tribal states had grown into 16 great states, the Mahajanapadas, such as Magadha, Kosala, Vatsa, Avanti and the Vajji confederacy (a group ruled by assemblies).
        check:
          prompt: How many Mahajanapadas do Buddhist texts list?
          options:
          - '16'
          - '4'
          - '24'
          answer: '16'
          why: Sixteen great states are named.
      - teach: Magadha became the strongest. It had fertile land to feed many people, iron mines for weapons and tools, rivers for transport and defence, and able rulers. Its capital moved from Rajagriha to Pataliputra (Patna) on the Ganga.
        picture:
          kind: flow
          steps:
          - 'Fertile land: food'
          - 'Iron mines: weapons and tools'
          - 'Rivers: transport and defence'
          - Able rulers
          - Magadha grows strongest
          alt: Reasons Magadha became the most powerful Mahajanapada.
        check:
          prompt: Why were iron mines important to Magadha?
          options:
          - They gave iron for weapons and tools
          - They gave gold for coins
          - They gave salt for trade
          answer: They gave iron for weapons and tools
          why: Iron made strong weapons and farm tools.
      - teach: In about 321 BCE Chandragupta Maurya, helped by Chanakya (Kautilya, author of the Arthashastra), founded the Mauryan empire. The Greek envoy Megasthenes described it in the Indica. His grandson Ashoka fought the Kalinga war (261 BCE), was shocked by the bloodshed, gave up conquest and spread dhamma through edicts carved in Prakrit.
        check:
          prompt: After which war did Ashoka give up conquest?
          options:
          - Kalinga war
          - War with Magadha
          - War with Harappa
          answer: Kalinga war
          why: The suffering at Kalinga changed him.
    items:
      - prompt: "How many Mahajanapadas are listed in Buddhist texts?"
        answer: "16"
        check: "16"
        difficulty: 1
        hints: ["Sixteen great states."]
        solution: "There were 16 Mahajanapadas."
        mistakes: {"4": mahajanapada_count}
      - prompt: "Which Mahajanapada became the most powerful?"
        options: ["Magadha", "Kosala", "Avanti", "Vatsa"]
        answer: "Magadha"
        difficulty: 1
        hints: ["Its capital later was Pataliputra."]
        solution: "Magadha became the strongest and grew into the Mauryan empire."
        mistakes: {"Kosala": mahajanapada_count}
      - prompt: "Who wrote the Arthashastra?"
        options: ["Kautilya (Chanakya)", "Megasthenes", "Ashoka", "Mahavira"]
        answer: "Kautilya (Chanakya)"
        difficulty: 1
        hints: ["Chandragupta Maurya's adviser."]
        solution: "Kautilya, also called Chanakya, wrote the Arthashastra on statecraft."
        mistakes: {"Megasthenes": maurya_people}
      - prompt: "Which war made Ashoka give up conquest?"
        options: ["The Kalinga war", "The battle of Panipat", "The Trojan war", "The Magadha war"]
        answer: "The Kalinga war"
        difficulty: 2
        hints: ["Fought in present-day Odisha."]
        solution: "The suffering of the Kalinga war (261 BCE) led Ashoka to dhamma."
        mistakes: {"The battle of Panipat": ashoka_dhamma}
      - prompt: "Why did Magadha become powerful? Choose the best reason."
        options: ["Fertile land, iron mines and rivers for transport", "It had no army", "It was in a desert", "It had no neighbours"]
        answer: "Fertile land, iron mines and rivers for transport"
        difficulty: 2
        hints: ["Think of food, weapons and trade."]
        solution: "Rich land fed people, iron made weapons and tools, and rivers helped trade and transport."
        mistakes: {"It had no army": "magadha_power", "It was in a desert": "magadha_power"}
      - prompt: "The Mauryan empire was founded in about 321 BCE and the Kalinga war was in 261 BCE. How many years apart were they?"
        answer: "60"
        check: "321 - 261"
        difficulty: 3
        hints: ["BCE years count down towards CE."]
        solution: "321 − 261 = 60 years"
        mistakes: {"582": bce_counting}
      - prompt: "Ashoka's edicts were mostly written in which language?"
        options: ["Prakrit", "English", "Persian", "Latin"]
        answer: "Prakrit"
        difficulty: 3
        hints: ["The language ordinary people spoke."]
        solution: "Ashoka used Prakrit, mostly in the Brahmi script, so people could understand."
        mistakes: {"Persian": ashoka_dhamma}
      - prompt: "What did Ashoka's dhamma ask people to do?"
        options: ["Respect elders, be kind to animals and respect other faiths", "Conquer neighbouring lands", "Give up every faith except Buddhism", "Pay a new dhamma tax"]
        answer: "Respect elders, be kind to animals and respect other faiths"
        difficulty: 2
        hints: ["Ashoka turned to dhamma after the Kalinga war.", "It was a moral code, not forced conversion."]
        solution: "Step 1: Dhamma was a code of good conduct. Step 2: It asked for respect to elders and teachers, kindness to all living beings, and tolerance of all sects."
        mistakes: {"Conquer neighbouring lands": ashoka_dhamma, "Give up every faith except Buddhism": dhamma_aims, "Pay a new dhamma tax": dhamma_aims}
      - prompt: "Pataliputra became the capital of Magadha. Which river made it well placed for trade and defence?"
        options: ["The Ganga", "The Indus", "The Narmada", "The Kaveri"]
        answer: "The Ganga"
        difficulty: 2
        hints: ["Pataliputra is today's Patna, in Bihar.", "Which great river flows past Patna?"]
        solution: "Step 1: Pataliputra stood where the Son meets the Ganga. Step 2: The Ganga gave it a route for trade and a natural defence."
        mistakes: {"The Indus": river_capital, "The Narmada": river_capital, "The Kaveri": river_capital}
      - prompt: Who founded the Mauryan empire?
        options:
        - Chandragupta Maurya
        - Ashoka
        - Bindusara
        - Megasthenes
        answer: Chandragupta Maurya
        difficulty: 1
        hints:
        - The empire is named after his family.
