  - code: ss9.landgrants.kerala
    title: Land, temples and society in early Kerala
    after: [ss9.landgrants.grants]
    notes: |
      From about the 9th century CE the Perumals (Cheras) of Mahodayapuram (near Kodungallur) ruled
      much of Kerala, with local chiefs (naduvazhis) governing regions (nadus). Brahmin settlements
      (traditionally 32 gramams) and temples became centres of land control; temple committees
      (sabhas) managed temple land and tenants. Copper plates record grants, such as the Tharisappalli
      copper plates (849 CE), by which Ayyanadikal Thiruvadikal of Venad, in the reign of Sthanu Ravi,
      gave land and privileges to the Tharisappalli church at Kollam and its trader guilds
      (Manigramam, Anchuvannam). Trade with West Asia flourished.
    explanations:
      text: "In early Kerala, temples were not only places of worship: they owned land, employed many people and settled disputes. Kings and chiefs gave land to temples and brahmin settlements and also gave privileges to traders. The Tharisappalli copper plates show a Kollam church and merchant guilds getting land and rights in 849 CE, a sign of Kerala's busy sea trade."
      visual: "Draw a circle labelled 'Temple' with arrows to 'land', 'tenants', 'temple workers', 'committee (sabha)'. Beside it, a copper plate labelled 'Tharisappalli, 849 CE, Kollam'."
      step_by_step: "Who issued the Tharisappalli grant? Step 1: It was made in Venad. Step 2: The local ruler was Ayyanadikal Thiruvadikal. Step 3: It was in the reign of the Perumal Sthanu Ravi."
      real_world: "The Tharisappalli copper plates are among the oldest dated records of Kerala and mention witnesses who signed in Arabic, Pahlavi and Hebrew scripts."
    activity:
      type: sort
      prompt: Sort the names from early Kerala.
      bins:
      - Rulers and chiefs
      - Trader guilds
      - A written record
      items:
      - label: The Perumals of Mahodayapuram
        bin: Rulers and chiefs
        clue: They ruled much of Kerala from the 9th century.
        why: The Perumals (Cheras) were rulers.
      - label: Naduvazhis
        bin: Rulers and chiefs
        clue: They governed regions called nadus.
        why: Naduvazhis were local chiefs.
      - label: Sthanu Ravi
        bin: Rulers and chiefs
        clue: The grant was made in his reign.
        why: Sthanu Ravi was a Perumal king.
      - label: Ayyanadikal Thiruvadikal of Venad
        bin: Rulers and chiefs
        clue: He gave land to a church.
        why: He was the chief of Venad.
      - label: Manigramam
        bin: Trader guilds
        clue: They were given privileges at Kollam.
        why: Manigramam was a merchant guild.
      - label: Anchuvannam
        bin: Trader guilds
        clue: Another group of merchants at Kollam.
        why: Anchuvannam was a trader guild.
      - label: Tharisappalli copper plates (849 CE)
        bin: A written record
        clue: Engraved, not a person.
        why: They record a grant to the Tharisappalli church.
    lesson:
      - teach: From about the 9th century CE, the Perumals (Cheras) ruled much of Kerala from Mahodayapuram, near today's Kodungallur. Regions (nadus) were run by local chiefs called naduvazhis.
        check:
          prompt: Who governed the nadus under the Perumals?
          options:
          - Naduvazhis
          - Samantas of the Guptas
          - Mughal officers
          answer: Naduvazhis
          why: Naduvazhis were local chiefs of nadus.
        ways:
        - style: step_by_step
          teach: 'Step 1: from about the 9th century CE, the Perumals, or Cheras, rule much of Kerala. Step 2: their capital is Mahodayapuram, near today''s Kodungallur. Step 3: the land is divided into regions called nadus. Step 4: each nadu is run by a local chief, a naduvazhi.'
        - style: visual
          teach: How early Kerala was ruled, from the centre to the regions.
          picture:
            kind: flow
            steps:
            - Perumals (Cheras), from about 9th century CE
            - capital Mahodayapuram (near Kodungallur)
            - regions called nadus
            - run by naduvazhis
            alt: From about the 9th century CE the Perumals ruled from Mahodayapuram near Kodungallur, with regions called nadus run by local chiefs called naduvazhis.
      - teach: Brahmin settlements (traditionally 32 gramams) and temples controlled much land. Temple committees (sabhas) managed temple land and its tenants, so temples were centres of farming, wealth and local rule, not only worship.
        check:
          prompt: Who managed temple lands in early Kerala?
          options:
          - Temple committees (sabhas)
          - Foreign traders
          - The Harappans
          answer: Temple committees (sabhas)
          why: Sabhas looked after temple land and tenants.
        ways:
        - style: real_world
          teach: 'Some temples in Kerala today still own land and run schools and halls. In early Kerala this was much bigger: brahmin settlements and temples held a great deal of land, and temple committees, the sabhas, managed it and its tenants. So a temple was a centre of farming, wealth and local rule.'
        - style: visual
          teach: Temples in early Kerala did far more than worship.
          picture:
            kind: compare
            columns:
            - title: Worship
              points:
              - religious centre
            - title: Land and wealth
              points:
              - owned much land
              - sabhas managed tenants
              - centres of farming and local rule
            alt: Early Kerala temples were religious centres but also owned much land, with sabhas managing tenants, making them centres of farming, wealth and local rule.
      - teach: 'Copper plates show Kerala''s trade. The Tharisappalli copper plates (849 CE): Ayyanadikal Thiruvadikal of Venad, in the reign of Sthanu Ravi, gave land and rights to the Tharisappalli church at Kollam and to trader guilds, Manigramam and Anchuvannam. Trade with West Asia was busy.'
        picture:
          kind: flow
          steps:
          - 849 CE, reign of Sthanu Ravi
          - Ayyanadikal Thiruvadikal of Venad
          - Land and rights to Tharisappalli church, Kollam
          - 'Trader guilds: Manigramam, Anchuvannam'
          alt: 'The Tharisappalli copper plates: who gave what to whom.'
        check:
          prompt: Where was the Tharisappalli church?
          options:
          - Kollam
          - Kodungallur
          - Kozhikode
          answer: Kollam
          why: The grant was to the church at Kollam (Quilon).
        ways:
        - style: step_by_step
          teach: 'Step 1: in 849 CE, during the reign of Sthanu Ravi, Ayyanadikal Thiruvadikal of Venad issues copper plates. Step 2: they give land and rights to the Tharisappalli church at Kollam. Step 3: they also give rights to the trader guilds Manigramam and Anchuvannam. Step 4: this shows busy trade with West Asia.'
        - style: visual
          teach: Who is who in the Tharisappalli copper plates of 849 CE.
          picture:
            kind: compare
            columns:
            - title: Giver
              points:
              - Ayyanadikal Thiruvadikal of Venad
              - reign of Sthanu Ravi
            - title: Receivers
              points:
              - Tharisappalli church, Kollam
              - guilds Manigramam, Anchuvannam
            alt: In 849 CE, in the reign of Sthanu Ravi, Ayyanadikal Thiruvadikal of Venad gave land and rights to the Tharisappalli church at Kollam and the trader guilds Manigramam and Anchuvannam.
