# Class 9 Social Science I, chapter 3. Format: content/README.md.
subject: ss
chapter: 3
title: Land Grants and the Indian Society

tips:
  gupta_rulers: "Chandragupta I founded the Gupta empire (about 320 CE); Samudragupta's conquests are on the Allahabad pillar; Chandragupta II (Vikramaditya) ruled when Fa-Hien visited."
  grant_types: "Brahmadeya: land granted to brahmins. Devadana: land granted to temples. Agrahara: a brahmin settlement on granted land."
  grant_records: "Land grants were recorded on copper plates so the receiver had lasting proof of the gift and its tax exemptions."
  grant_effects: "Land grants created powerful landholders (samantas), spread farming into forests and new areas, and made the caste order stronger with many new jatis."
  tharisappalli: "The Tharisappalli copper plates (849 CE) record a grant to a church at Kollam, made by Ayyanadikal Thiruvadikal of Venad in the reign of Sthanu Ravi."
  gupta_scholars: "Aryabhata was a mathematician-astronomer; Kalidasa was a poet and playwright; Harisena wrote the Allahabad pillar praise of Samudragupta."

concepts:
  - code: ss9.landgrants.gupta
    title: The Gupta age
    notes: |
      The Gupta empire began with Chandragupta I (about 320 CE). Samudragupta extended it; his court
      poet Harisena praised him in the Allahabad pillar inscription. Chandragupta II (Vikramaditya)
      ruled when the Chinese traveller Fa-Hien visited. The period saw Kalidasa (Abhijnanasakuntalam),
      Aryabhata (Aryabhatiya; place value and the idea that the earth rotates), gold coins, temple
      building and the university at Nalanda (founded under Kumaragupta). Rulers took grand titles
      such as maharajadhiraja and depended on local chiefs (samantas).
    explanations:
      text: "The Guptas ruled much of north India for about two centuries. Their gold coins, Sanskrit poetry and science are famous: Kalidasa wrote plays still performed today, and Aryabhata worked out that the earth spins on its axis. But much of the empire was run through local chiefs who owed loyalty to the emperor, a sign of things to come."
      visual: "Draw a three-step ladder: Chandragupta I (founder), Samudragupta (conqueror, Allahabad pillar), Chandragupta II (Vikramaditya, Fa-Hien's visit)."
      step_by_step: "Who wrote the Allahabad pillar inscription? Step 1: It praises Samudragupta. Step 2: It was written by his court poet. Step 3: The poet was Harisena."
      real_world: "India's first satellite, launched in 1975, was named Aryabhata after the Gupta-age astronomer."
    items:
      - prompt: "Who founded the Gupta empire?"
        options: ["Chandragupta I", "Chandragupta Maurya", "Samudragupta", "Ashoka"]
        answer: "Chandragupta I"
        difficulty: 1
        hints: ["Not the Mauryan Chandragupta."]
        solution: "Chandragupta I founded the Gupta empire around 320 CE."
        mistakes: {"Chandragupta Maurya": gupta_rulers, "Samudragupta": gupta_rulers}
      - prompt: "Which Gupta ruler's conquests are described in the Allahabad pillar inscription?"
        options: ["Samudragupta", "Chandragupta II", "Kumaragupta", "Skandagupta"]
        answer: "Samudragupta"
        difficulty: 2
        hints: ["Written by Harisena."]
        solution: "The Allahabad pillar praises Samudragupta."
        mistakes: {"Chandragupta II": gupta_rulers}
      - prompt: "Aryabhata is known as a great:"
        options: ["Mathematician and astronomer", "Poet", "King", "Traveller"]
        answer: "Mathematician and astronomer"
        difficulty: 1
        hints: ["India's first satellite was named after him."]
        solution: "Aryabhata wrote the Aryabhatiya on mathematics and astronomy."
        mistakes: {"Poet": gupta_scholars}
      - prompt: "Which Chinese traveller visited India during the reign of Chandragupta II?"
        options: ["Fa-Hien", "Hiuen Tsang", "Ibn Battuta", "Megasthenes"]
        answer: "Fa-Hien"
        difficulty: 2
        hints: ["Hiuen Tsang came later, in Harsha's time."]
        solution: "Fa-Hien visited during Chandragupta II's rule."
        mistakes: {"Hiuen Tsang": gupta_rulers}
      - prompt: "Kalidasa, who wrote Abhijnanasakuntalam, lived in which period?"
        options: ["The Gupta period", "The Harappan period", "The Mauryan period", "The Delhi Sultanate"]
        answer: "The Gupta period"
        difficulty: 2
        hints: ["A golden age of Sanskrit literature."]
        solution: "Kalidasa is linked with the Gupta court."
        mistakes: {"The Mauryan period": gupta_scholars}
      - prompt: "The Gupta empire began in about 320 CE. About how many years ago was that from 2020 CE?"
        answer: "1700"
        check: "2020 - 320"
        difficulty: 3
        hints: ["Both years are CE, so subtract."]
        solution: "2020 − 320 = 1700 years"
        mistakes: {"2340": bce_counting}

  - code: ss9.landgrants.grants
    title: Land grants and their effects
    after: [ss9.landgrants.gupta]
    notes: |
      From the Satavahana and Gupta times onwards, kings granted land and villages to brahmins
      (brahmadeya, agrahara), to temples (devadana) and to officials and chiefs. The grants were
      engraved on copper plates and often freed the land from taxes and gave the receivers rights to
      collect revenue and settle disputes. Effects: a class of powerful landholders and samantas
      grew; farming spread into forests and new regions; forest and tribal people were drawn into
      the caste order, so many new jatis formed; peasants became more dependent; the king's direct
      control weakened (often called feudalism).
    explanations:
      text: "Imagine a king rewarding a group of priests with a whole village: they now collect its taxes, judge its quarrels and bring new land under the plough. Repeat that thousands of times and you get a society where landholders, not the king, have real power in the villages, and where caste rules spread with the new settlements."
      visual: "Draw a flow chart: king → copper-plate grant → brahmins / temples / chiefs receive villages → collect revenue and judge disputes → new landholding class, new farmland, new jatis."
      step_by_step: "A copper plate says a village is given to a temple, free of tax. Step 1: The receiver is a temple. Step 2: Land given to a temple is devadana. Step 3: So this is a devadana grant."
      real_world: "Many copper-plate grants survive in museums; historians read them to learn about villages, crops, taxes and caste over a thousand years ago."
    items:
      - prompt: "Land granted to brahmins was called:"
        options: ["Brahmadeya", "Devadana", "Iqta", "Kudakkallu"]
        answer: "Brahmadeya"
        difficulty: 1
        hints: ["Brahma-deya: given to brahmins."]
        solution: "Brahmadeya was land granted to brahmins."
        mistakes: {"Devadana": grant_types}
      - prompt: "Land granted to temples was called:"
        options: ["Devadana", "Brahmadeya", "Agrahara", "Janapada"]
        answer: "Devadana"
        difficulty: 1
        hints: ["Deva: god."]
        solution: "Devadana was land given to temples."
        mistakes: {"Brahmadeya": grant_types, "Agrahara": grant_types}
      - prompt: "Why were land grants engraved on copper plates?"
        options: ["To give lasting proof of the grant and its rights", "Because paper was banned", "To decorate temples", "To use as money"]
        answer: "To give lasting proof of the grant and its rights"
        difficulty: 2
        hints: ["Copper lasts for centuries."]
        solution: "A durable copper record protected the receiver's rights."
        mistakes: {"To use as money": grant_records}
      - prompt: "Which was an effect of land grants on society?"
        options: ["A class of powerful landholders grew and the king's direct control weakened", "All land became equal", "Farming stopped", "Caste disappeared"]
        answer: "A class of powerful landholders grew and the king's direct control weakened"
        difficulty: 2
        hints: ["Who collected the revenue?"]
        solution: "Grant holders gained power over villages, reducing the king's direct control."
        mistakes: {"Caste disappeared": grant_effects}
      - prompt: "How did land grants affect forest and tribal areas?"
        options: ["Farming spread there and tribal people were drawn into the caste order as new jatis", "They were left untouched", "They became cities", "They became Harappan sites"]
        answer: "Farming spread there and tribal people were drawn into the caste order as new jatis"
        difficulty: 3
        hints: ["New settlements were made on granted land."]
        solution: "Grantees cleared land for farming and the caste system absorbed local groups as jatis."
        mistakes: {"They were left untouched": grant_effects}
      - prompt: "An agrahara was:"
        options: ["A brahmin settlement on granted land", "A temple tank", "A military camp", "A copper mine"]
        answer: "A brahmin settlement on granted land"
        difficulty: 2
        hints: ["Linked with brahmadeya."]
        solution: "Agraharas were brahmin villages on granted land."
        mistakes: {"A temple tank": grant_types}

  - code: ss9.landgrants.kerala
    title: Land, temples and society in early Kerala
    after: [ss9.landgrants.grants]
    notes: |
      From about the 9th century CE the Perumals (Cheras) of Mahodayapuram (near Kodungallur) ruled
      much of Kerala, with local chiefs (naduvazhis) governing regions (nadus). Brahmin settlements
      (traditionally 32 gramams) and temples became centres of land control; temple committees
      (sabhas) managed temple land and tenants. Copper plates record grants, such as the Tharisappalli
      copper plates (849 CE), by which Ayyanadikal Thiruvadikal of Venad, in the reign of Sthanu Ravi,
      gave land and privileges to the Tharisappalli church at Kollam and its trader guilds
      (Manigramam, Anchuvannam). Trade with West Asia flourished.
    explanations:
      text: "In early Kerala, temples were not only places of worship: they owned land, employed many people and settled disputes. Kings and chiefs gave land to temples and brahmin settlements and also gave privileges to traders. The Tharisappalli copper plates show a Kollam church and merchant guilds getting land and rights in 849 CE, a sign of Kerala's busy sea trade."
      visual: "Draw a circle labelled 'Temple' with arrows to 'land', 'tenants', 'temple workers', 'committee (sabha)'. Beside it, a copper plate labelled 'Tharisappalli, 849 CE, Kollam'."
      step_by_step: "Who issued the Tharisappalli grant? Step 1: It was made in Venad. Step 2: The local ruler was Ayyanadikal Thiruvadikal. Step 3: It was in the reign of the Perumal Sthanu Ravi."
      real_world: "The Tharisappalli copper plates are among the oldest dated records of Kerala and mention witnesses who signed in Arabic, Pahlavi and Hebrew scripts."
    items:
      - prompt: "The Tharisappalli copper plates are dated to:"
        answer: "849"
        check: "849"
        difficulty: 2
        hints: ["Mid-9th century CE."]
        solution: "They are dated 849 CE."
      - prompt: "The Tharisappalli copper plates record a grant to a church at:"
        options: ["Kollam", "Kozhikode", "Kannur", "Thrissur"]
        answer: "Kollam"
        difficulty: 1
        hints: ["Old Quilon, in Venad."]
        solution: "The grant was to the Tharisappalli church at Kollam."
        mistakes: {"Kozhikode": tharisappalli}
      - prompt: "Who made the Tharisappalli grant?"
        options: ["Ayyanadikal Thiruvadikal", "Samudragupta", "Rajaraja Chola", "Ashoka"]
        answer: "Ayyanadikal Thiruvadikal"
        difficulty: 2
        hints: ["The ruler of Venad."]
        solution: "Ayyanadikal Thiruvadikal of Venad, in the reign of Sthanu Ravi."
        mistakes: {"Rajaraja Chola": tharisappalli}
      - prompt: "In early Kerala, what were temples besides places of worship?"
        options: ["Centres of land control and local administration", "Only places for festivals", "Army camps", "Ports"]
        answer: "Centres of land control and local administration"
        difficulty: 1
        hints: ["They owned land and had tenants."]
        solution: "Temples held land, employed workers and settled disputes."
        mistakes: {"Only places for festivals": grant_effects}
      - prompt: "The Perumals ruled from Mahodayapuram, which is near present-day:"
        options: ["Kodungallur", "Thiruvananthapuram", "Palakkad", "Kasaragod"]
        answer: "Kodungallur"
        difficulty: 2
        hints: ["In Thrissur district, an ancient port."]
        solution: "Mahodayapuram was near Kodungallur."
      - prompt: "The Tharisappalli plates also gave rights to trader guilds. Which is one of them?"
        options: ["Manigramam", "Mahajanapada", "Agrahara", "Iqta"]
        answer: "Manigramam"
        difficulty: 3
        hints: ["The other was Anchuvannam."]
        solution: "Manigramam and Anchuvannam were merchant guilds."
        mistakes: {"Agrahara": grant_types}
