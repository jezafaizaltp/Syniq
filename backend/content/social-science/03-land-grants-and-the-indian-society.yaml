# Class 9 Social Science I, chapter 3. Format: content/README.md.
subject: ss
chapter: 3
title: Land Grants and the Indian Society

tips:
  aryabhata_ideas: "Aryabhata worked out ideas far ahead of his time about the Earth's motion and eclipses. Which choice is scientific, not a myth?"
  court_poet: "An inscription written by a ruler's own court poet during his reign tells us what that ruler claimed. Whose deeds does it praise?"
  tax_free: "If granted land no longer pays tax to the ruler, whose income shrinks?"
  ce_gap: "Both years are CE, so subtract the earlier year from the later one."
  grant_shows: "The grant went to a church and gave rights to trader guilds. What does that say about trade and faiths at the time?"
  gupta_rulers: "Three rulers: the founder carries the number one; his son's conquests are praised on a pillar at Prayagraj; the grandson, called Vikramaditya, ruled when a Chinese Buddhist monk visited around 400 CE (a different monk from Hiuen Tsang)."
  grant_types: "The names tell you who got the land: brahma- for brahmins, deva- for gods (temples). An agrahara was a settlement built on granted land. The Tharisappalli plates also name merchant guilds."
  grant_records: "Land grants were recorded on copper plates so the receiver had lasting proof of the gift and its tax exemptions."
  grant_effects: "Land grants created powerful landholders (samantas), spread farming into forests and new areas, and made the caste order stronger with many new jatis."
  tharisappalli: "The plates record a gift to a church in the southern port of Venad, made by the local ruler of Venad (not a Chola king). The Chola sabha inscriptions are from a Tamil village."
  gupta_scholars: "Aryabhata was a mathematician-astronomer; Kalidasa was a poet and playwright; Harisena wrote the Allahabad pillar praise of Samudragupta."
  mahodayapuram: "The Perumal capital was in central Kerala near the old port of Muziris, by the Periyar's mouth."
  tharisappalli_date: "The plates come from the mid-800s CE, in the reign of the Perumal king Sthanu Ravi. Check the digits carefully."
  gupta_order: 'The Gupta line in order: the founder, then the great conqueror, then Chandragupta II, then the one under whom Nalanda began.'
  who_did_what: Match each famous person to their field. A poet writes plays, a scientist studies numbers and stars, a traveller writes about visits.
  ce_only_gap: Both years are CE, so the gap is the later year minus the earlier one.
  who_receives: Grant names tell who received the land. Deva means god, so one kind went to temples; the other went to brahmins.
  plate_purpose: Copper lasts for centuries. Why would someone want a grant written on something that lasts?
  grant_loss: If land is freed from tax, someone who used to collect that tax now gets nothing from it.
  kerala_places: Early Kerala's capital Mahodayapuram was near Kodungallur; the Tharisappalli church was at Kollam (Quilon), a port of Venad.
  guild_names: The plates name trader guilds. One was Manigramam and the other Anchuvannam.
  temple_role: In early Kerala temples owned land, had tenants and were run by committees. They did much more than worship.

concepts:
  - code: ss9.landgrants.gupta
    title: The Gupta age
    notes: |
      The Gupta empire began with Chandragupta I (about 320 CE). Samudragupta extended it; his court
      poet Harisena praised him in the Allahabad pillar inscription. Chandragupta II (Vikramaditya)
      ruled when the Chinese traveller Fa-Hien visited. The period saw Kalidasa (Abhijnanasakuntalam),
      Aryabhata (Aryabhatiya; place value and the idea that the earth rotates), gold coins, temple
      building and the university at Nalanda (founded under Kumaragupta). Rulers took grand titles
      such as maharajadhiraja and depended on local chiefs (samantas).
    explanations:
      text: "The Guptas ruled much of north India for about two centuries. Their gold coins, Sanskrit poetry and science are famous: Kalidasa wrote plays still performed today, and Aryabhata worked out that the earth spins on its axis. But much of the empire was run through local chiefs who owed loyalty to the emperor, a sign of things to come."
      visual: "Draw a three-step ladder: Chandragupta I (founder), Samudragupta (conqueror, Allahabad pillar), Chandragupta II (Vikramaditya, Fa-Hien's visit)."
      step_by_step: "Who wrote the Allahabad pillar inscription? Step 1: It praises Samudragupta. Step 2: It was written by his court poet. Step 3: The poet was Harisena."
      real_world: "India's first satellite, launched in 1975, was named Aryabhata after the Gupta-age astronomer."
    activity:
      type: sort
      prompt: Who was this person in the Gupta age?
      bins:
      - Ruler
      - Writer or scientist
      - Visitor from abroad
      items:
      - label: Chandragupta I
        bin: Ruler
        clue: The empire began with him, about 320 CE.
        why: He founded the Gupta empire.
      - label: Samudragupta
        bin: Ruler
        clue: His victories are praised on the Allahabad pillar.
        why: He extended the empire.
      - label: Chandragupta II (Vikramaditya)
        bin: Ruler
        clue: Fa-Hien visited in his reign.
        why: He was a Gupta king.
      - label: Harisena
        bin: Writer or scientist
        clue: He wrote the praise on the Allahabad pillar.
        why: Harisena was Samudragupta's court poet, not a king.
      - label: Kalidasa
        bin: Writer or scientist
        clue: Abhijnanasakuntalam.
        why: Kalidasa was a poet and playwright.
      - label: Aryabhata
        bin: Writer or scientist
        clue: Place value; the earth rotates.
        why: Aryabhata was a mathematician and astronomer.
      - label: Fa-Hien
        bin: Visitor from abroad
        clue: He came from China.
        why: Fa-Hien was a Chinese traveller.
    lesson:
      - teach: The Gupta empire began with Chandragupta I in about 320 CE. His son Samudragupta conquered widely; his court poet Harisena praised him in the Allahabad pillar inscription. Chandragupta II (Vikramaditya) ruled when the Chinese traveller Fa-Hien visited.
        picture:
          kind: flow
          steps:
          - 'Chandragupta I: founder (about 320 CE)'
          - 'Samudragupta: conquests (Allahabad pillar)'
          - 'Chandragupta II: Fa-Hien visits'
          - 'Kumaragupta: Nalanda founded'
          alt: The main Gupta rulers in order.
        check:
          prompt: Who wrote the Allahabad pillar inscription praising Samudragupta?
          options:
          - Harisena
          - Kalidasa
          - Fa-Hien
          answer: Harisena
          why: Harisena was Samudragupta's court poet.
        ways:
        - style: step_by_step
          teach: 'Step 1: Chandragupta I starts the Gupta empire in about 320 CE. Step 2: his son Samudragupta conquers widely, and the court poet Harisena praises him in the Allahabad pillar inscription. Step 3: Chandragupta II, Vikramaditya, rules when the Chinese traveller Fa-Hien visits.'
      - teach: The Gupta age is famous for learning and art. Kalidasa wrote the play Abhijnanasakuntalam. Aryabhata, a mathematician and astronomer, used place value and said the earth spins on its axis. Gold coins, temples and the university at Nalanda belong to this time.
        check:
          prompt: 'Aryabhata said that the Earth:'
          options:
          - Rotates on its axis
          - Is flat
          - Does not move
          answer: Rotates on its axis
          why: He explained day and night by the Earth's rotation.
        ways:
        - style: real_world
          teach: 'Some periods are remembered for their artists and scientists more than their wars. The Gupta age is one: Kalidasa wrote the play Abhijnanasakuntalam, Aryabhata used place value and said the Earth spins on its axis, and Nalanda, gold coins and temples belong to this time.'
      - teach: Gupta kings took grand titles like maharajadhiraja (great king of kings), but they relied on local chiefs called samantas to rule distant areas. This prepared the way for the land grants you will learn next.
        check:
          prompt: Who were samantas?
          options:
          - Local chiefs under the king
          - Chinese travellers
          - Temple priests only
          answer: Local chiefs under the king
          why: Samantas ruled areas for the Gupta kings.
        ways:
        - style: real_world
          teach: A big company may give its far-off branches to local managers instead of running them directly from head office. Gupta kings called themselves great king of kings, but distant areas were run by local chiefs called samantas. That set the stage for land grants.
    items:
      - prompt: "Who founded the Gupta empire?"
        options: ["Chandragupta I", "Chandragupta Maurya", "Samudragupta", "Ashoka"]
        answer: "Chandragupta I"
        difficulty: 1
        hints: ["Not the Mauryan Chandragupta."]
        solution: "Chandragupta I founded the Gupta empire around 320 CE."
        mistakes: {"Chandragupta Maurya": gupta_rulers, "Samudragupta": gupta_rulers}
      - prompt: "Which Gupta ruler's conquests are described in the Allahabad pillar inscription?"
        options: ["Samudragupta", "Chandragupta II", "Kumaragupta", "Skandagupta"]
        answer: "Samudragupta"
        difficulty: 2
        hints: ["Written by Harisena."]
        solution: "The Allahabad pillar praises Samudragupta."
        mistakes: {"Chandragupta II": gupta_rulers}
      - prompt: "Aryabhata is known as a great:"
        options: ["Mathematician and astronomer", "Poet", "King", "Traveller"]
        answer: "Mathematician and astronomer"
        difficulty: 1
        hints: ["India's first satellite was named after him."]
        solution: "Aryabhata wrote the Aryabhatiya on mathematics and astronomy."
        mistakes: {"Poet": gupta_scholars}
      - prompt: "Which Chinese traveller visited India during the reign of Chandragupta II?"
        options: ["Fa-Hien", "Hiuen Tsang", "Ibn Battuta", "Megasthenes"]
        answer: "Fa-Hien"
        difficulty: 2
        hints: ["Hiuen Tsang came later, in Harsha's time."]
        solution: "Fa-Hien visited during Chandragupta II's rule."
        mistakes: {"Hiuen Tsang": gupta_rulers}
      - prompt: "Kalidasa, who wrote Abhijnanasakuntalam, lived in which period?"
        options: ["The Gupta period", "The Harappan period", "The Mauryan period", "The Delhi Sultanate"]
        answer: "The Gupta period"
        difficulty: 2
        hints: ["A golden age of Sanskrit literature."]
        solution: "Kalidasa is linked with the Gupta court."
        mistakes: {"The Mauryan period": gupta_scholars}
      - prompt: "The Gupta empire began in about 320 CE. About how many years ago was that from 2020 CE?"
        answer: "1700"
        check: "2020 - 320"
        difficulty: 3
        hints: ["Both years are CE, so subtract."]
        solution: "2020 − 320 = 1700 years"
        mistakes: {"2340": bce_counting}
      - prompt: "Which idea did Aryabhata put forward?"
        options: ["The Earth rotates on its axis", "The Sun goes round a flat Earth", "Eclipses are caused by a demon swallowing the Sun", "The Earth stands still at the centre"]
        answer: "The Earth rotates on its axis"
        difficulty: 3
        hints: ["He explained day and night scientifically.", "He also explained eclipses by shadows."]
        solution: "Step 1: Aryabhata said the Earth turns on its axis, causing day and night. Step 2: He explained eclipses as shadows of the Earth and Moon."
        mistakes: {"The Sun goes round a flat Earth": aryabhata_ideas, "Eclipses are caused by a demon swallowing the Sun": aryabhata_ideas, "The Earth stands still at the centre": aryabhata_ideas}
      - prompt: "Why is the Allahabad pillar inscription an important source for the Gupta period?"
        options: ["It records Samudragupta's conquests, written by his court poet Harisena", "It is a copper-plate land grant", "It was written by Fa-Hien", "It lists the Gupta kings' taxes"]
        answer: "It records Samudragupta's conquests, written by his court poet Harisena"
        difficulty: 2
        hints: ["Who wrote it, and when?", "Whose campaigns does it describe?"]
        solution: "Step 1: Harisena, Samudragupta's court poet, composed it. Step 2: It describes the king's conquests in his own time, though as praise."
        mistakes: {"It is a copper-plate land grant": court_poet, "It was written by Fa-Hien": gupta_rulers, "It lists the Gupta kings' taxes": court_poet}
      - prompt: 'Chandragupta II was also known as:'
        options:
        - Vikramaditya
        - Ashoka
        - Harisena
        - Samudragupta
        answer: Vikramaditya
        difficulty: 1
        hints:
        - It was a title meaning 'sun of valour'.
        - Samudragupta was his father.
        solution: 'Step 1: Samudragupta was the father. Step 2: Chandragupta II took a grand title. Step 3: He was called Vikramaditya.'
        mistakes:
          Samudragupta: gupta_order
      - prompt: 'Kalidasa is famous as a:'
        options:
        - Poet and playwright
        - Astronomer
        - Chinese traveller
        - King
        answer: Poet and playwright
        difficulty: 1
        hints:
        - He wrote Abhijnanasakuntalam.
        - That is a play.
        solution: 'Step 1: Kalidasa wrote Abhijnanasakuntalam and Meghaduta. Step 2: These are plays and poems. Step 3: He was a poet and playwright.'
        mistakes:
          Astronomer: who_did_what
      - prompt: Which book did Aryabhata write?
        options:
        - Aryabhatiya
        - Arthashastra
        - Indica
        - Abhijnanasakuntalam
        answer: Aryabhatiya
        difficulty: 2
        hints:
        - The book is named after the author.
        - The others are by Kautilya, Megasthenes and Kalidasa.
        solution: 'Step 1: Arthashastra: Kautilya. Indica: Megasthenes. Abhijnanasakuntalam: Kalidasa. Step 2: Aryabhata''s book carries his name. Step 3: Aryabhatiya.'
        mistakes:
          Abhijnanasakuntalam: who_did_what
      - prompt: The university at Nalanda was founded under which Gupta ruler?
        options:
        - Kumaragupta
        - Chandragupta I
        - Ashoka
        - Harisena
        answer: Kumaragupta
        difficulty: 2
        hints:
        - It came late in the Gupta line.
        - He ruled after Chandragupta II.
        solution: 'Step 1: Chandragupta I founded the empire. Step 2: Later came Samudragupta, then Chandragupta II. Step 3: Nalanda began under Kumaragupta.'
        mistakes:
          Chandragupta I: gupta_order
      - prompt: What does the title 'maharajadhiraja' mean?
        options:
        - Great king of kings
        - Village headman
        - Court poet
        - Temple priest
        answer: Great king of kings
        difficulty: 2
        hints:
        - Maha = great, raja = king, adhiraja = overlord.
        - It is a grand royal title.
        solution: 'Step 1: Maha means great. Step 2: Rajadhiraja means king over kings. Step 3: Great king of kings.'
        mistakes:
          Village headman: gupta_rulers
      - prompt: Fa-Hien visited India around 400 CE. How many years before 2000 CE was that?
        answer: '1600'
        check: 2000-400
        difficulty: 2
        hints:
        - Both years are CE.
        - Subtract the earlier year.
        solution: 'Step 1: 2000 − 400. Step 2: = 1600. Step 3: About 1600 years before 2000 CE.'
        mistakes:
          '2400': ce_only_gap
      - prompt: Why are gold coins of the Gupta period useful to historians?
        options:
        - They show rulers' names, images and the wealth of the time
        - They were used as weapons
        - They record the Harappan script
        - They are made of copper
        answer: They show rulers' names, images and the wealth of the time
        difficulty: 3
        hints:
        - Look at what is stamped on a coin.
        - What does using gold tell you about the economy?
        solution: 'Step 1: Coins carry rulers'' names and pictures. Step 2: Gold coins show a rich economy. Step 3: They help date and describe the period.'
        mistakes:
          They are made of copper: grant_records

  - code: ss9.landgrants.grants
    title: Land grants and their effects
    after: [ss9.landgrants.gupta]
    notes: |
      From the Satavahana and Gupta times onwards, kings granted land and villages to brahmins
      (brahmadeya, agrahara), to temples (devadana) and to officials and chiefs. The grants were
      engraved on copper plates and often freed the land from taxes and gave the receivers rights to
      collect revenue and settle disputes. Effects: a class of powerful landholders and samantas
      grew; farming spread into forests and new regions; forest and tribal people were drawn into
      the caste order, so many new jatis formed; peasants became more dependent; the king's direct
      control weakened (often called feudalism).
    explanations:
      text: "Imagine a king rewarding a group of priests with a whole village: they now collect its taxes, judge its quarrels and bring new land under the plough. Repeat that thousands of times and you get a society where landholders, not the king, have real power in the villages, and where caste rules spread with the new settlements."
      visual: "Draw a flow chart: king → copper-plate grant → brahmins / temples / chiefs receive villages → collect revenue and judge disputes → new landholding class, new farmland, new jatis."
      step_by_step: "A copper plate says a village is given to a temple, free of tax. Step 1: The receiver is a temple. Step 2: Land given to a temple is devadana. Step 3: So this is a devadana grant."
      real_world: "Many copper-plate grants survive in museums; historians read them to learn about villages, crops, taxes and caste over a thousand years ago."
    activity:
      type: order
      prompt: Follow what a land grant led to. Put the steps in order.
      steps:
      - A king grants a village, engraved on copper plates
      - The receiver collects revenue and settles disputes there
      - Powerful landholders and samantas grow
      - Peasants depend more on landholders
      - The king's direct control weakens
      reasons:
        The receiver collects revenue and settles disputes there: The receiver can only collect revenue after the land has been granted.
        Powerful landholders and samantas grow: Collecting revenue and judging cases made the receivers powerful.
        Peasants depend more on landholders: Once landholders held the power, peasants had to depend on them.
        The king's direct control weakens: With power spread among landholders, the king ruled less directly. This is often called feudalism.
    lesson:
      - teach: 'From Satavahana and Gupta times, kings began giving land and whole villages as gifts: to brahmins (brahmadeya, with settlements called agraharas), to temples (devadana), and to officials and chiefs.'
        picture:
          kind: compare
          columns:
          - title: Brahmadeya
            points:
            - given to brahmins
            - settlements called agraharas
          - title: Devadana
            points:
            - given to temples
            - deva = god
          alt: Two kinds of land grant and who received them.
        check:
          prompt: 'Land given to a temple was called:'
          options:
          - Devadana
          - Brahmadeya
          - Agrahara
          answer: Devadana
          why: Deva means god, so devadana is a gift to a temple.
        ways:
        - style: visual
          teach: Kings gave land and whole villages as gifts to three kinds of receivers. To brahmins it was brahmadeya, with settlements called agraharas. To temples it was devadana. Officials and chiefs got grants too.
          picture:
            kind: compare
            alt: Land grants went to brahmins (brahmadeya, agraharas), to temples (devadana), and to officials and chiefs.
            columns:
            - title: To brahmins
              points:
              - Brahmadeya
              - Settlements called agraharas
            - title: To temples
              points:
              - Devadana
            - title: To officials and chiefs
              points:
              - Land in return for service
      - teach: Grants were engraved on copper plates so the record would last. They often freed the land from tax and gave the receiver the right to collect revenue from farmers and settle their disputes.
        check:
          prompt: Why were grants recorded on copper plates?
          options:
          - To give lasting proof of the grant
          - Because paper was cheaper
          - To use as coins
          answer: To give lasting proof of the grant
          why: Copper lasts for centuries.
        ways:
        - style: real_world
          teach: Today we keep land papers safely so nobody can deny we own the land. Kings did the same on copper plates, which last for centuries. A grant often freed the land from tax and let the receiver collect revenue from farmers and settle their disputes.
      - teach: 'Effects: powerful landholders and chiefs (samantas) grew, while the king''s direct control weakened. Farming spread into forests, and tribal people were drawn into the caste system as new jatis. Peasants depended more on landholders.'
        check:
          prompt: What happened to the king's direct control as grants grew?
          options:
          - It weakened
          - It became stronger
          - It did not change
          answer: It weakened
          why: Landholders now collected revenue and ran local affairs.
        ways:
        - style: step_by_step
          teach: 'Step 1: more land goes to chiefs and landholders, who grow powerful. Step 2: the king''s direct control weakens. Step 3: farming spreads into forests, and tribal people become new jatis in the caste system. Step 4: peasants depend more on the landholders.'
    items:
      - prompt: "Land granted to brahmins was called:"
        options: ["Brahmadeya", "Devadana", "Iqta", "Kudakkallu"]
        answer: "Brahmadeya"
        difficulty: 1
        hints: ["Brahma-deya: given to brahmins."]
        solution: "Brahmadeya was land granted to brahmins."
        mistakes: {"Devadana": grant_types}
      - prompt: "Land granted to temples was called:"
        options: ["Devadana", "Brahmadeya", "Agrahara", "Janapada"]
        answer: "Devadana"
        difficulty: 1
        hints: ["Deva: god."]
        solution: "Devadana was land given to temples."
        mistakes: {"Brahmadeya": grant_types, "Agrahara": grant_types}
      - prompt: "Why were land grants engraved on copper plates?"
        options: ["To give lasting proof of the grant and its rights", "Because paper was banned", "To decorate temples", "To use as money"]
        answer: "To give lasting proof of the grant and its rights"
        difficulty: 2
        hints: ["Copper lasts for centuries."]
        solution: "A durable copper record protected the receiver's rights."
        mistakes: {"To use as money": grant_records}
      - prompt: "Which was an effect of land grants on society?"
        options: ["A class of powerful landholders grew and the king's direct control weakened", "All land became equal", "Farming stopped", "Caste disappeared"]
        answer: "A class of powerful landholders grew and the king's direct control weakened"
        difficulty: 2
        hints: ["Who collected the revenue?"]
        solution: "Grant holders gained power over villages, reducing the king's direct control."
        mistakes: {"Caste disappeared": grant_effects}
      - prompt: "How did land grants affect forest and tribal areas?"
        options: ["Farming spread there and tribal people were drawn into the caste order as new jatis", "They were left untouched", "They became cities", "They became Harappan sites"]
        answer: "Farming spread there and tribal people were drawn into the caste order as new jatis"
        difficulty: 3
        hints: ["New settlements were made on granted land."]
        solution: "Grantees cleared land for farming and the caste system absorbed local groups as jatis."
        mistakes: {"They were left untouched": grant_effects}
      - prompt: "An agrahara was:"
        options: ["A brahmin settlement on granted land", "A temple tank", "A military camp", "A copper mine"]
        answer: "A brahmin settlement on granted land"
        difficulty: 2
        hints: ["Linked with brahmadeya."]
        solution: "Agraharas were brahmin villages on granted land."
        mistakes: {"A temple tank": grant_types}
      - prompt: "A copper plate grants a village to a temple, free of taxes, with rights over its farmers. Who loses income because of this grant?"
        options: ["The king", "The temple", "The brahmin priests", "The traders of the town"]
        answer: "The king"
        difficulty: 3
        hints: ["Before the grant, who collected tax from the village?", "After it, where does the produce go?"]
        solution: "Step 1: The village used to pay tax to the king. Step 2: Now the temple gets the income, so the king's revenue and control shrink."
        mistakes: {"The temple": tax_free, "The brahmin priests": tax_free, "The traders of the town": tax_free}
      - prompt: "What is the main difference between a brahmadeya and a devadana?"
        options: ["Who received the land: brahmins or temples", "The size of the land", "The metal of the plate", "The language of the grant"]
        answer: "Who received the land: brahmins or temples"
        difficulty: 2
        hints: ["Brahma-deya: given to brahmins.", "Deva-dana: given to the gods."]
        solution: "Step 1: Brahmadeya was land given to brahmins. Step 2: Devadana was land given to temples."
        mistakes: {"The size of the land": grant_types, "The metal of the plate": grant_types, "The language of the grant": grant_types}
      - prompt: What was an agrahara?
        options:
        - A settlement of brahmins on granted land
        - A temple tower
        - A copper coin
        - A trader guild
        answer: A settlement of brahmins on granted land
        difficulty: 1
        hints:
        - It is linked with brahmadeya grants.
        - It was a place where people lived.
        solution: 'Step 1: Brahmadeya land went to brahmins. Step 2: They lived together on it. Step 3: The settlement was an agrahara.'
        mistakes:
          A temple tower: who_receives
      - prompt: 'Land grants were usually recorded on:'
        options:
        - Copper plates
        - Palm leaves only
        - Clay seals
        - Paper notes
        answer: Copper plates
        difficulty: 1
        hints:
        - The record had to last a very long time.
        - A metal was used.
        solution: 'Step 1: Grants needed permanent proof. Step 2: A metal sheet lasts for centuries. Step 3: They were engraved on copper plates.'
        mistakes:
          Palm leaves only: plate_purpose
      - prompt: A village is granted free of tax. Who now receives the revenue from its farmers?
        options:
        - The person or temple that received the grant
        - The king
        - Nobody
        - The farmers' children
        answer: The person or temple that received the grant
        difficulty: 2
        hints:
        - The grant passed on rights over the village.
        - Who was given the right to collect?
        solution: 'Step 1: The king gave up the tax. Step 2: The grant gave collection rights to the receiver. Step 3: The receiver gets the revenue.'
        mistakes:
          The king: grant_loss
      - prompt: How did land grants change the lives of many peasants?
        options:
        - They became more dependent on landholders
        - They all became kings
        - They stopped farming
        - They moved to cities
        answer: They became more dependent on landholders
        difficulty: 2
        hints:
        - Landholders could collect revenue and settle disputes.
        - Who held power over the peasants?
        solution: 'Step 1: Landholders gained rights over villages. Step 2: Peasants paid them and went to them for justice. Step 3: Peasants depended more on them.'
        mistakes:
          They all became kings: grant_effects
      - prompt: 'The system in which kings depend on landholders and chiefs who control land and people is often called:'
        options:
        - Feudalism
        - Democracy
        - Federalism
        - Socialism
        answer: Feudalism
        difficulty: 3
        hints:
        - It describes power held through land.
        - It is not about elections or states.
