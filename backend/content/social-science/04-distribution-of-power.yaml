# Class 9 Social Science I, chapter 4. Format: content/README.md.
subject: ss
chapter: 4
title: Distribution of Power in the Indian Constitution

tips:
  peoples_plan: "The 1996 campaign moved money and planning power down, not up. Which level of government gained?"
  one_policy: "Imagine every state with its own army and its own currency. Which subjects need one policy for the whole country?"
  court_checks: "Courts guard the Constitution. What can they do to a law that breaks it?"
  executive_side: "The executive carries out laws. Is the choice a law-making body, a court, or a body that runs the government?"
  middle_tier: "The three rural tiers are village, block and district. Which one sits in the middle?"
  k9_73rd: "Two amendments were passed together in 1992: one for rural bodies and the next number for town bodies. Rural came first."
  union_list: "Ask whether the subject concerns the whole nation, like protecting the borders. Such subjects go on the list for the central government only."
  state_list: "Ask whether the subject is local, like keeping order on your streets. Such subjects go on the list run by each state government."
  concurrent_list: "Some subjects, like schooling, are shared: both the centre and the states can make laws. If the two laws clash, the national law wins."
  residuary_union: "Subjects not in any of the three lists are 'left over' powers, given to the national law-maker. Courts striking down unconstitutional laws is a separate power of judges."
  three_organs: "Three organs: one makes laws (the law-making body), one carries them out (the government that executes), one interprets them (the courts). Dividing power keeps each one in check."
  local_amendments: "Two amendments passed in the same year in the early 1990s gave local bodies constitutional status: the one with the lower number is for rural panchayats."
  three_tier: "Rural local government has three tiers: village, block and district. The smallest unit is at village level; the meeting of all voters in a ward is the sabha, not the council."
  court_hierarchy: "Courts form a pyramid: district courts at the base, a court for each state above, and one court for the whole country at the top."
  half_of: "50% means half: 20 ÷ 2."
  parliament_houses: "India's Parliament has the President and two houses: the House of the People and the Council of States. State Legislative Assemblies and courts are not part of it."
  sec_local: "Elections for Parliament and assemblies are run by a national commission. Panchayat and municipal elections are run by a separate commission in each state."
  three_lists: "The Seventh Schedule has three lists: Union, State and Concurrent."

concepts:
  - code: ss9.power.federal
    title: Union and States
    notes: |
      India is a union of states with a federal system: power is divided between the Union
      government and the State governments. The Seventh Schedule has three lists. Union List: defence,
      foreign affairs, railways, currency, banking, atomic energy. State List: police, public order,
      agriculture, public health, local government. Concurrent List: education, forests, marriage,
      criminal law, trade unions; both can make laws, and the Union law prevails in a conflict.
      Residuary powers lie with the Union. Education was moved from the State to the Concurrent List
      by the 42nd Amendment (1976). India has strong-centre features, so it is often called a union
      with federal features.
    explanations:
      text: "A country as large as India cannot be run from Delhi alone. The Constitution shares the work: the Union handles matters that affect the whole country, such as defence and currency, and the States handle matters closer to people's lives, such as police and farming. Some matters, like education, are shared."
      visual: "Draw three boxes. Union: tank, passport, rupee, train. State: police cap, paddy field, hospital. Concurrent: school, forest, wedding rings."
      step_by_step: "Who makes laws on railways? Step 1: Railways link the whole country. Step 2: They are in the Union List. Step 3: So Parliament makes laws on railways."
      real_world: "Kerala Police is run by the State government, while the Indian Railways in Kerala is run by the Union government."
    activity:
      type: sort
      prompt: Which list is it in?
      bins:
      - Union List
      - State List
      - Concurrent List
      items:
      - label: Defence
        bin: Union List
        clue: The whole country needs one army.
        why: Defence is a Union subject.
      - label: Railways
        bin: Union List
        clue: Trains cross many states.
        why: Railways are on the Union List.
      - label: Currency
        bin: Union List
        clue: One rupee for all of India.
        why: Currency is Union.
      - label: Police
        bin: State List
        clue: Each state runs its own.
        why: Police and public order are State subjects.
      - label: Agriculture
        bin: State List
        clue: Farming differs from state to state.
        why: Agriculture is on the State List.
      - label: Public health
        bin: State List
        clue: Hospitals run by each state.
        why: Public health is a State subject.
      - label: Education
        bin: Concurrent List
        clue: It was moved by the 42nd Amendment (1976).
        why: Education was moved from the State List to the Concurrent List, so both can make laws.
      - label: Forests
        bin: Concurrent List
        clue: Both levels can make laws.
        why: Forests are concurrent.
      - label: Marriage
        bin: Concurrent List
        clue: Both levels can make laws.
        why: Marriage is on the Concurrent List.
    items:
      - prompt: "Defence of the country is in which list?"
        options: ["Union List", "State List", "Concurrent List", "No list"]
        answer: "Union List"
        difficulty: 1
        hints: ["It concerns the whole country."]
        solution: "Defence is a Union subject."
        mistakes: {"State List": union_list, "Concurrent List": union_list}
      - prompt: "Police is a subject in which list?"
        options: ["State List", "Union List", "Concurrent List", "Residuary"]
        answer: "State List"
        difficulty: 1
        hints: ["Each state has its own police force."]
        solution: "Police and public order are State subjects."
        mistakes: {"Union List": state_list}
      - prompt: "Education is in which list today?"
        options: ["Concurrent List", "State List", "Union List", "No list"]
        answer: "Concurrent List"
        difficulty: 2
        hints: ["It was moved there by the 42nd Amendment."]
        solution: "Since 1976 education is on the Concurrent List."
        mistakes: {"State List": concurrent_list}
      - prompt: "If a Union law and a State law on a Concurrent subject conflict, which prevails?"
        options: ["The Union law", "The State law", "Neither", "The older law"]
        answer: "The Union law"
        difficulty: 2
        hints: ["The Constitution gives the Union the upper hand here."]
        solution: "The Union law prevails on Concurrent subjects."
        mistakes: {"The State law": concurrent_list}
      - prompt: "Who has residuary powers in India?"
        options: ["The Union Parliament", "State legislatures", "The Supreme Court", "Panchayats"]
        answer: "The Union Parliament"
        difficulty: 2
        hints: ["Subjects not mentioned in any list."]
        solution: "Residuary powers belong to the Union."
        mistakes: {"State legislatures": residuary_union}
      - prompt: "How many lists does the Seventh Schedule have?"
        answer: "3"
        check: "3"
        difficulty: 1
        hints: ["Union, State and one more."]
        solution: "Three: Union, State and Concurrent."
        mistakes: {"2": "three_lists", "7": "three_lists"}
      - prompt: "A new subject such as cyber security is not in any list. Who can make laws on it?"
        options: ["The Union Parliament", "Only the states", "Nobody", "Local bodies"]
        answer: "The Union Parliament"
        difficulty: 3
        hints: ["Think of residuary powers."]
        solution: "Subjects outside the lists are residuary, so Parliament legislates."
        mistakes: {"Only the states": residuary_union}
      - prompt: "Kerala wants to make a new law on agriculture in the state. From which list does it get this power?"
        options: ["State List", "Union List", "Residuary powers", "None: only Parliament can"]
        answer: "State List"
        difficulty: 2
        hints: ["Which subjects are local to each state?", "Agriculture is like police and public health."]
        solution: "Step 1: Agriculture is a State List subject. Step 2: So the Kerala Legislative Assembly can make laws on it."
        mistakes: {"Union List": state_list, "Residuary powers": residuary_union, "None: only Parliament can": state_list}
      - prompt: "Why are defence and currency placed in the Union List?"
        options: ["They need one policy for the whole country", "States asked to give them away", "They are less important subjects", "The courts chose them"]
        answer: "They need one policy for the whole country"
        difficulty: 2
        hints: ["Could each state have its own army?", "Could each state print its own money?"]
        solution: "Step 1: The country must defend itself as one and use one currency. Step 2: So these matters of national importance go to the Union."
        mistakes: {"States asked to give them away": one_policy, "They are less important subjects": one_policy, "The courts chose them": one_policy}
      - prompt: "Kerala passes a law on forests and Parliament passes a different law on the same matter. Which law prevails?"
        options:
        - "Parliament's law, because forests are in the Concurrent List"
        - "Kerala's law, because forests are in the State List"
        - "Both, equally"
        - "Neither: the courts decide the law"
        answer: "Parliament's law, because forests are in the Concurrent List"
        difficulty: 3
        hints: ["First find which list 'forests' is in.", "In that list, what happens when the Union and a State disagree?"]
        solution: "Step 1: Forests are in the Concurrent List. Step 2: Both the Union and the States can make laws on it. Step 3: In a conflict the Union law prevails."
        mistakes: {"Kerala's law, because forests are in the State List": concurrent_list, "Both, equally": concurrent_list}

  - code: ss9.power.organs
    title: Legislature, executive and judiciary
    after: [ss9.power.federal]
    notes: |
      Power is also divided among three organs of government. Legislature (Parliament: Lok Sabha and
      Rajya Sabha, with the President; State Legislative Assemblies) makes laws. Executive (President,
      Prime Minister and Council of Ministers; Governor, Chief Minister) implements laws. Judiciary
      (Supreme Court, High Courts, lower courts) interprets laws, settles disputes and protects
      fundamental rights; it is independent and can strike down unconstitutional laws (judicial
      review). This separation, with checks and balances, prevents misuse of power.
    explanations:
      text: "If the same person made the rules, enforced them and judged the cases, there would be no protection against abuse. So our Constitution gives these jobs to three separate organs that keep a check on one another. The courts can even cancel a law that goes against the Constitution."
      visual: "Draw a triangle with Legislature (makes laws), Executive (carries out laws) and Judiciary (interprets laws) at the corners, with two-way arrows labelled 'checks'."
      step_by_step: "Which organ decides whether a law is constitutional? Step 1: Making the law is the legislature's job. Step 2: Interpreting it against the Constitution is the courts' job. Step 3: So the judiciary decides, through judicial review."
      real_world: "The Kerala High Court at Ernakulam hears cases about whether actions of the State government follow the law."
    activity:
      type: sort
      prompt: Which organ of government is it?
      bins:
      - Legislature
      - Executive
      - Judiciary
      items:
      - label: Lok Sabha passes a bill
        bin: Legislature
        clue: Who makes laws?
        why: Parliament makes laws.
      - label: Kerala Legislative Assembly
        bin: Legislature
        clue: Elected members debate and vote on laws.
        why: State assemblies make laws.
      - label: Prime Minister and Council of Ministers
        bin: Executive
        clue: Who carries out laws?
        why: 'They run the government: executive.'
      - label: Governor and Chief Minister
        bin: Executive
        clue: They run the state government.
        why: Executive at the state level.
      - label: Supreme Court strikes down a law
        bin: Judiciary
        clue: Who checks laws against the Constitution?
        why: Judicial review is the judiciary's power.
      - label: High Court protects a citizen's rights
        bin: Judiciary
        clue: Courts interpret laws and settle disputes.
        why: The High Court is part of the judiciary.
    items:
      - prompt: "Which organ of government makes laws?"
        options: ["Legislature", "Executive", "Judiciary", "Election Commission"]
        answer: "Legislature"
        difficulty: 1
        hints: ["Parliament and Assemblies."]
        solution: "The legislature makes laws."
        mistakes: {"Executive": three_organs, "Judiciary": three_organs}
      - prompt: "Which organ carries out (implements) laws?"
        options: ["Executive", "Legislature", "Judiciary", "Panchayat"]
        answer: "Executive"
        difficulty: 1
        hints: ["Ministers and officials."]
        solution: "The executive implements laws."
        mistakes: {"Judiciary": three_organs}
      - prompt: "The power of courts to strike down laws that violate the Constitution is called:"
        options: ["Judicial review", "Residuary power", "Federalism", "Universal franchise"]
        answer: "Judicial review"
        difficulty: 2
        hints: ["The judiciary reviews laws."]
        solution: "This is judicial review."
        mistakes: {"Residuary power": residuary_union}
      - prompt: "Why is power divided among three organs?"
        options: ["To prevent misuse of power through checks and balances", "To make government slower", "To give all power to courts", "To avoid elections"]
        answer: "To prevent misuse of power through checks and balances"
        difficulty: 2
        hints: ["No single body should have all the power."]
        solution: "Separation of powers lets each organ check the others."
        mistakes: {"To give all power to courts": three_organs}
      - prompt: "Which is the highest court in India?"
        options: ["Supreme Court", "High Court", "District Court", "Lok Adalat"]
        answer: "Supreme Court"
        difficulty: 1
        hints: ["In New Delhi."]
        solution: "The Supreme Court is the highest court."
        mistakes: {"High Court": "court_hierarchy", "Lok Adalat": "court_hierarchy"}
      - prompt: "Parliament consists of the President and which two houses?"
        options: ["Lok Sabha and Rajya Sabha", "Lok Sabha and Legislative Assembly", "Rajya Sabha and High Court", "Grama Sabha and Lok Sabha"]
        answer: "Lok Sabha and Rajya Sabha"
        difficulty: 3
        hints: ["House of the People and Council of States."]
        solution: "Parliament = President + Lok Sabha + Rajya Sabha."

        mistakes: {"Lok Sabha and Legislative Assembly": "parliament_houses", "Rajya Sabha and High Court": "parliament_houses"}
      - prompt: "Parliament passes a law, and the Supreme Court finds that it violates fundamental rights. What can the Court do?"
        options: ["Declare the law invalid", "Nothing, because Parliament makes laws", "Dissolve Parliament", "Pass a different law itself"]
        answer: "Declare the law invalid"
        difficulty: 3
        hints: ["The judiciary protects the Constitution.", "What is the power of judicial review?"]
        solution: "Step 1: By judicial review, courts check laws against the Constitution. Step 2: A law that violates fundamental rights can be struck down."
        mistakes: {"Nothing, because Parliament makes laws": court_checks, "Dissolve Parliament": court_checks, "Pass a different law itself": three_organs}
      - prompt: "Which of these is part of the executive in a state?"
        options: ["The Chief Minister and Council of Ministers", "The Legislative Assembly", "The High Court", "The Supreme Court"]
        answer: "The Chief Minister and Council of Ministers"
        difficulty: 2
        hints: ["The executive carries out laws.", "The Assembly makes laws; courts interpret them."]
        solution: "Step 1: The Legislative Assembly is the legislature; the courts are the judiciary. Step 2: The Governor, Chief Minister and ministers form the executive."
        mistakes: {"The Legislative Assembly": executive_side, "The High Court": executive_side, "The Supreme Court": executive_side}
  - code: ss9.power.local
    title: Local self-government
    after: [ss9.power.federal]
    notes: |
      The third level of government is local self-government. The 73rd Amendment (1992) gave
      constitutional status to Panchayati Raj, and the 74th Amendment (1992) to urban local bodies
      (municipalities and corporations); both came into force in 1993. Rural bodies have three tiers:
      grama panchayat, block panchayat, district panchayat. Elections every five years by the State
      Election Commission; at least one-third of seats reserved for women (Kerala reserves 50%), and
      seats for SC and ST. The grama sabha (all voters of a ward) discusses plans. Kerala's People's
      Plan Campaign (1996) gave local bodies a large share of plan funds.
    explanations:
      text: "Many problems, like a broken road, a drinking water tap or an anganwadi, are best solved by people who live nearby. Local bodies bring government to the village and town. In Kerala, a large share of development money goes straight to panchayats and municipalities, and grama sabhas decide many priorities."
      visual: "Draw three stacked boxes: District Panchayat at the top, Block Panchayat in the middle, Grama Panchayat at the bottom, with a crowd labelled 'grama sabha' under the grama panchayat."
      step_by_step: "A panchayat has 20 wards and reserves 50% for women. How many wards are for women? Step 1: 50% means half. Step 2: 20 ÷ 2 = 10. Step 3: 10 wards."
      real_world: "Kerala's People's Plan Campaign of 1996 is studied around the world as an example of decentralised planning."
    activity:
      type: sort
      prompt: Rural or urban local body?
      bins:
      - Panchayati Raj (rural)
      - Urban local body
      items:
      - label: Grama panchayat
        bin: Panchayati Raj (rural)
        clue: The lowest of three tiers in villages.
        why: Grama panchayat is the first rural tier.
      - label: Block panchayat
        bin: Panchayati Raj (rural)
        clue: The middle tier for villages.
        why: Block panchayat is the second rural tier.
      - label: District panchayat
        bin: Panchayati Raj (rural)
        clue: The top tier for villages.
        why: District panchayat is the third rural tier.
      - label: Grama sabha
        bin: Panchayati Raj (rural)
        clue: All the voters of a village ward.
        why: The grama sabha belongs to Panchayati Raj.
      - label: Municipality
        bin: Urban local body
        clue: Given status by the 74th Amendment.
        why: Municipalities govern towns.
      - label: Corporation, such as Kozhikode
        bin: Urban local body
        clue: Big cities have this.
        why: Corporations govern cities.
    items:
      - prompt: "Which amendment gave constitutional status to Panchayati Raj?"
        options: ["73rd Amendment", "74th Amendment", "42nd Amendment", "61st Amendment"]
        answer: "73rd Amendment"
        difficulty: 1
        hints: ["The 74th is for towns."]
        solution: "The 73rd Amendment (1992) is for panchayats."
        mistakes: {"74th Amendment": k9_73rd}
      - prompt: "Which is the lowest tier of rural local government?"
        options: ["Grama panchayat", "Block panchayat", "District panchayat", "Municipality"]
        answer: "Grama panchayat"
        difficulty: 1
        hints: ["At village level."]
        solution: "Grama panchayat is the base tier."
        mistakes: {"District panchayat": three_tier}
      - prompt: "A panchayat has 20 wards and 50% are reserved for women. How many wards are reserved for women?"
        answer: "10"
        check: "20*Rational(50, 100)"
        difficulty: 2
        hints: ["Half of 20."]
        solution: "20 × 50 ÷ 100 = 10"
        mistakes: {"50": "half_of", "5": "half_of"}
      - prompt: "Who conducts elections to panchayats and municipalities?"
        options: ["The State Election Commission", "The Supreme Court", "The Prime Minister", "The grama sabha"]
        answer: "The State Election Commission"
        difficulty: 2
        hints: ["Not the Election Commission of India."]
        solution: "Local body elections are run by the State Election Commission."
        mistakes: {"The Supreme Court": "sec_local", "The grama sabha": "sec_local"}
      - prompt: "Which body includes all the voters of a ward or village?"
        options: ["Grama sabha", "Rajya Sabha", "Lok Sabha", "Legislative Assembly"]
        answer: "Grama sabha"
        difficulty: 2
        hints: ["It meets to discuss local plans."]
        solution: "The grama sabha is made up of all voters of the area."
        mistakes: {"Lok Sabha": three_tier}
      - prompt: "In which year were the 73rd and 74th Amendments passed?"
        answer: "1992"
        check: "1992"
        difficulty: 3
        hints: ["They came into force a year later, in 1993."]
        solution: "Both were passed in 1992."
        mistakes: {"1993": local_amendments}
      - prompt: "Which is the middle tier of rural Panchayati Raj in Kerala?"
        options: ["Block panchayat", "Grama panchayat", "District panchayat", "Grama sabha"]
        answer: "Block panchayat"
        difficulty: 2
        hints: ["The tiers are at village, block and district level.", "The grama sabha is not a tier: it is the meeting of voters."]
        solution: "Step 1: Grama panchayat (village), block panchayat (block), district panchayat (district). Step 2: The block panchayat is in the middle."
        mistakes: {"Grama panchayat": middle_tier, "District panchayat": middle_tier, "Grama sabha": three_tier}
      - prompt: "What did the 74th Amendment deal with?"
        options: ["Urban local bodies: municipalities and corporations", "Rural panchayats", "The Union List", "The Supreme Court"]
        answer: "Urban local bodies: municipalities and corporations"
        difficulty: 2
        hints: ["The 73rd and 74th Amendments were passed together in 1992.", "The 73rd was for villages."]
        solution: "Step 1: The 73rd Amendment covered panchayats. Step 2: The 74th gave constitutional status to municipalities and corporations."
        mistakes: {"Rural panchayats": local_amendments, "The Union List": local_amendments, "The Supreme Court": local_amendments}
      - prompt: "What was the main idea of Kerala's People's Plan Campaign of 1996?"
        options:
        - "Giving local bodies a large share of plan funds so people could plan for their own area"
        - "Moving all planning to Delhi"
        - "Ending elections to panchayats"
        - "Letting only the State Election Commission make plans"
        answer: "Giving local bodies a large share of plan funds so people could plan for their own area"
        difficulty: 3
        hints: ["Think about which level of government the campaign wanted to strengthen.", "Who decided how money was spent after it?"]
        solution: "Step 1: The campaign began in 1996. Step 2: It gave local bodies a large share of the State's plan funds. Step 3: Grama sabhas and local bodies then planned for their own areas."
        mistakes: {"Moving all planning to Delhi": peoples_plan, "Letting only the State Election Commission make plans": sec_local}
