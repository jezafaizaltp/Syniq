        solution: "20 × 50 ÷ 100 = 10"
        mistakes: {"50": "half_of", "5": "half_of"}
      - prompt: "Who conducts elections to panchayats and municipalities?"
        options: ["The State Election Commission", "The Supreme Court", "The Prime Minister", "The grama sabha"]
        answer: "The State Election Commission"
        difficulty: 2
        hints: ["Not the Election Commission of India."]
        solution: "Local body elections are run by the State Election Commission."
        mistakes: {"The Supreme Court": "sec_local", "The grama sabha": "sec_local"}
      - prompt: "Which body includes all the voters of a ward or village?"
        options: ["Grama sabha", "Rajya Sabha", "Lok Sabha", "Legislative Assembly"]
        answer: "Grama sabha"
        difficulty: 2
        hints: ["It meets to discuss local plans."]
        solution: "The grama sabha is made up of all voters of the area."
        mistakes: {"Lok Sabha": three_tier}
      - prompt: "In which year were the 73rd and 74th Amendments passed?"
        answer: "1992"
        check: "1992"
        difficulty: 3
        hints: ["They came into force a year later, in 1993."]
        solution: "Both were passed in 1992."
        mistakes: {"1993": local_amendments}
      - prompt: "Which is the middle tier of rural Panchayati Raj in Kerala?"
        options: ["Block panchayat", "Grama panchayat", "District panchayat", "Grama sabha"]
        answer: "Block panchayat"
        difficulty: 2
        hints: ["The tiers are at village, block and district level.", "The grama sabha is not a tier: it is the meeting of voters."]
        solution: "Step 1: Grama panchayat (village), block panchayat (block), district panchayat (district). Step 2: The block panchayat is in the middle."
        mistakes: {"Grama panchayat": middle_tier, "District panchayat": middle_tier, "Grama sabha": three_tier}
      - prompt: "What did the 74th Amendment deal with?"
        options: ["Urban local bodies: municipalities and corporations", "Rural panchayats", "The Union List", "The Supreme Court"]
        answer: "Urban local bodies: municipalities and corporations"
        difficulty: 2
        hints: ["The 73rd and 74th Amendments were passed together in 1992.", "The 73rd was for villages."]
        solution: "Step 1: The 73rd Amendment covered panchayats. Step 2: The 74th gave constitutional status to municipalities and corporations."
        mistakes: {"Rural panchayats": local_amendments, "The Union List": local_amendments, "The Supreme Court": local_amendments}
      - prompt: "What was the main idea of Kerala's People's Plan Campaign of 1996?"
        options:
        - "Giving local bodies a large share of plan funds so people could plan for their own area"
        - "Moving all planning to Delhi"
        - "Ending elections to panchayats"
        - "Letting only the State Election Commission make plans"
        answer: "Giving local bodies a large share of plan funds so people could plan for their own area"
        difficulty: 3
        hints: ["Think about which level of government the campaign wanted to strengthen.", "Who decided how money was spent after it?"]
        solution: "Step 1: The campaign began in 1996. Step 2: It gave local bodies a large share of the State's plan funds. Step 3: Grama sabhas and local bodies then planned for their own areas."
        mistakes: {"Moving all planning to Delhi": peoples_plan, "Letting only the State Election Commission make plans": sec_local}
      - prompt: In which year did the 73rd and 74th Amendments come into force?
        answer: '1993'
        check: '1993'
        difficulty: 2
        hints:
