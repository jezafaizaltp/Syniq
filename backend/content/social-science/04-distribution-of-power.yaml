# Class 9 Social Science I, chapter 4. Format: content/README.md.
subject: ss
chapter: 4
title: Distribution of Power in the Indian Constitution

tips:
  union_list: "The Union List has subjects of national importance: defence, foreign affairs, railways, currency, banking, atomic energy."
  state_list: "The State List has subjects of local importance: police, public order, agriculture, public health, local government."
  concurrent_list: "On the Concurrent List (education, forests, marriage, criminal law) both Union and States can make laws; if they clash, the Union law prevails."
  residuary_union: "Residuary powers (subjects in no list, such as cyber laws) belong to the Union Parliament."
  three_organs: "Legislature makes laws, executive carries them out, judiciary interprets them and settles disputes."
  local_amendments: "The 73rd Amendment (Panchayats) and 74th Amendment (Municipalities) of 1992 gave local bodies constitutional status."
  three_tier: "Rural local government has three tiers: grama panchayat (village), block panchayat, district panchayat."

concepts:
  - code: ss9.power.federal
    title: Union and States
    notes: |
      India is a union of states with a federal system: power is divided between the Union
      government and the State governments. The Seventh Schedule has three lists. Union List: defence,
      foreign affairs, railways, currency, banking, atomic energy. State List: police, public order,
      agriculture, public health, local government. Concurrent List: education, forests, marriage,
      criminal law, trade unions; both can make laws, and the Union law prevails in a conflict.
      Residuary powers lie with the Union. Education was moved from the State to the Concurrent List
      by the 42nd Amendment (1976). India has strong-centre features, so it is often called a union
      with federal features.
    explanations:
      text: "A country as large as India cannot be run from Delhi alone. The Constitution shares the work: the Union handles matters that affect the whole country, such as defence and currency, and the States handle matters closer to people's lives, such as police and farming. Some matters, like education, are shared."
      visual: "Draw three boxes. Union: tank, passport, rupee, train. State: police cap, paddy field, hospital. Concurrent: school, forest, wedding rings."
      step_by_step: "Who makes laws on railways? Step 1: Railways link the whole country. Step 2: They are in the Union List. Step 3: So Parliament makes laws on railways."
      real_world: "Kerala Police is run by the State government, while the Indian Railways in Kerala is run by the Union government."
    items:
      - prompt: "Defence of the country is in which list?"
        options: ["Union List", "State List", "Concurrent List", "No list"]
        answer: "Union List"
        difficulty: 1
        hints: ["It concerns the whole country."]
        solution: "Defence is a Union subject."
        mistakes: {"State List": union_list, "Concurrent List": union_list}
      - prompt: "Police is a subject in which list?"
        options: ["State List", "Union List", "Concurrent List", "Residuary"]
        answer: "State List"
        difficulty: 1
        hints: ["Each state has its own police force."]
        solution: "Police and public order are State subjects."
        mistakes: {"Union List": state_list}
      - prompt: "Education is in which list today?"
        options: ["Concurrent List", "State List", "Union List", "No list"]
        answer: "Concurrent List"
        difficulty: 2
        hints: ["It was moved there by the 42nd Amendment."]
        solution: "Since 1976 education is on the Concurrent List."
        mistakes: {"State List": concurrent_list}
      - prompt: "If a Union law and a State law on a Concurrent subject conflict, which prevails?"
        options: ["The Union law", "The State law", "Neither", "The older law"]
        answer: "The Union law"
        difficulty: 2
        hints: ["The Constitution gives the Union the upper hand here."]
        solution: "The Union law prevails on Concurrent subjects."
        mistakes: {"The State law": concurrent_list}
      - prompt: "Who has residuary powers in India?"
        options: ["The Union Parliament", "State legislatures", "The Supreme Court", "Panchayats"]
        answer: "The Union Parliament"
        difficulty: 2
        hints: ["Subjects not mentioned in any list."]
        solution: "Residuary powers belong to the Union."
        mistakes: {"State legislatures": residuary_union}
      - prompt: "How many lists does the Seventh Schedule have?"
        answer: "3"
        check: "3"
        difficulty: 1
        hints: ["Union, State and one more."]
        solution: "Three: Union, State and Concurrent."
      - prompt: "A new subject such as cyber security is not in any list. Who can make laws on it?"
        options: ["The Union Parliament", "Only the states", "Nobody", "Local bodies"]
        answer: "The Union Parliament"
        difficulty: 3
        hints: ["Think of residuary powers."]
        solution: "Subjects outside the lists are residuary, so Parliament legislates."
        mistakes: {"Only the states": residuary_union}

  - code: ss9.power.organs
    title: Legislature, executive and judiciary
    after: [ss9.power.federal]
    notes: |
      Power is also divided among three organs of government. Legislature (Parliament: Lok Sabha and
      Rajya Sabha, with the President; State Legislative Assemblies) makes laws. Executive (President,
      Prime Minister and Council of Ministers; Governor, Chief Minister) implements laws. Judiciary
      (Supreme Court, High Courts, lower courts) interprets laws, settles disputes and protects
      fundamental rights; it is independent and can strike down unconstitutional laws (judicial
      review). This separation, with checks and balances, prevents misuse of power.
    explanations:
      text: "If the same person made the rules, enforced them and judged the cases, there would be no protection against abuse. So our Constitution gives these jobs to three separate organs that keep a check on one another. The courts can even cancel a law that goes against the Constitution."
      visual: "Draw a triangle with Legislature (makes laws), Executive (carries out laws) and Judiciary (interprets laws) at the corners, with two-way arrows labelled 'checks'."
      step_by_step: "Which organ decides whether a law is constitutional? Step 1: Making the law is the legislature's job. Step 2: Interpreting it against the Constitution is the courts' job. Step 3: So the judiciary decides, through judicial review."
      real_world: "The Kerala High Court at Ernakulam hears cases about whether actions of the State government follow the law."
    items:
      - prompt: "Which organ of government makes laws?"
        options: ["Legislature", "Executive", "Judiciary", "Election Commission"]
        answer: "Legislature"
        difficulty: 1
        hints: ["Parliament and Assemblies."]
        solution: "The legislature makes laws."
        mistakes: {"Executive": three_organs, "Judiciary": three_organs}
      - prompt: "Which organ carries out (implements) laws?"
        options: ["Executive", "Legislature", "Judiciary", "Panchayat"]
        answer: "Executive"
        difficulty: 1
        hints: ["Ministers and officials."]
        solution: "The executive implements laws."
        mistakes: {"Judiciary": three_organs}
      - prompt: "The power of courts to strike down laws that violate the Constitution is called:"
        options: ["Judicial review", "Residuary power", "Federalism", "Universal franchise"]
        answer: "Judicial review"
        difficulty: 2
        hints: ["The judiciary reviews laws."]
        solution: "This is judicial review."
        mistakes: {"Residuary power": residuary_union}
      - prompt: "Why is power divided among three organs?"
        options: ["To prevent misuse of power through checks and balances", "To make government slower", "To give all power to courts", "To avoid elections"]
        answer: "To prevent misuse of power through checks and balances"
        difficulty: 2
        hints: ["No single body should have all the power."]
        solution: "Separation of powers lets each organ check the others."
        mistakes: {"To give all power to courts": three_organs}
      - prompt: "Which is the highest court in India?"
        options: ["Supreme Court", "High Court", "District Court", "Lok Adalat"]
        answer: "Supreme Court"
        difficulty: 1
        hints: ["In New Delhi."]
        solution: "The Supreme Court is the highest court."
      - prompt: "Parliament consists of the President and which two houses?"
        options: ["Lok Sabha and Rajya Sabha", "Lok Sabha and Legislative Assembly", "Rajya Sabha and High Court", "Grama Sabha and Lok Sabha"]
        answer: "Lok Sabha and Rajya Sabha"
        difficulty: 3
        hints: ["House of the People and Council of States."]
        solution: "Parliament = President + Lok Sabha + Rajya Sabha."

  - code: ss9.power.local
    title: Local self-government
    after: [ss9.power.federal]
    notes: |
      The third level of government is local self-government. The 73rd Amendment (1992) gave
      constitutional status to Panchayati Raj, and the 74th Amendment (1992) to urban local bodies
      (municipalities and corporations); both came into force in 1993. Rural bodies have three tiers:
      grama panchayat, block panchayat, district panchayat. Elections every five years by the State
      Election Commission; at least one-third of seats reserved for women (Kerala reserves 50%), and
      seats for SC and ST. The grama sabha (all voters of a ward) discusses plans. Kerala's People's
      Plan Campaign (1996) gave local bodies a large share of plan funds.
    explanations:
      text: "Many problems, like a broken road, a drinking water tap or an anganwadi, are best solved by people who live nearby. Local bodies bring government to the village and town. In Kerala, a large share of development money goes straight to panchayats and municipalities, and grama sabhas decide many priorities."
      visual: "Draw three stacked boxes: District Panchayat at the top, Block Panchayat in the middle, Grama Panchayat at the bottom, with a crowd labelled 'grama sabha' under the grama panchayat."
      step_by_step: "A panchayat has 20 wards and reserves 50% for women. How many wards are for women? Step 1: 50% means half. Step 2: 20 ÷ 2 = 10. Step 3: 10 wards."
      real_world: "Kerala's People's Plan Campaign of 1996 is studied around the world as an example of decentralised planning."
    items:
      - prompt: "Which amendment gave constitutional status to Panchayati Raj?"
        options: ["73rd Amendment", "74th Amendment", "42nd Amendment", "61st Amendment"]
        answer: "73rd Amendment"
        difficulty: 1
        hints: ["The 74th is for towns."]
        solution: "The 73rd Amendment (1992) is for panchayats."
        mistakes: {"74th Amendment": local_amendments}
      - prompt: "Which is the lowest tier of rural local government?"
        options: ["Grama panchayat", "Block panchayat", "District panchayat", "Municipality"]
        answer: "Grama panchayat"
        difficulty: 1
        hints: ["At village level."]
        solution: "Grama panchayat is the base tier."
        mistakes: {"District panchayat": three_tier}
      - prompt: "A panchayat has 20 wards and 50% are reserved for women. How many wards are reserved for women?"
        answer: "10"
        check: "20*Rational(50, 100)"
        difficulty: 2
        hints: ["Half of 20."]
        solution: "20 × 50 ÷ 100 = 10"
      - prompt: "Who conducts elections to panchayats and municipalities?"
        options: ["The State Election Commission", "The Supreme Court", "The Prime Minister", "The grama sabha"]
        answer: "The State Election Commission"
        difficulty: 2
        hints: ["Not the Election Commission of India."]
        solution: "Local body elections are run by the State Election Commission."
      - prompt: "Which body includes all the voters of a ward or village?"
        options: ["Grama sabha", "Rajya Sabha", "Lok Sabha", "Legislative Assembly"]
        answer: "Grama sabha"
        difficulty: 2
        hints: ["It meets to discuss local plans."]
        solution: "The grama sabha is made up of all voters of the area."
        mistakes: {"Lok Sabha": three_tier}
      - prompt: "In which year were the 73rd and 74th Amendments passed?"
        answer: "1992"
        check: "1992"
        difficulty: 3
        hints: ["They came into force a year later, in 1993."]
        solution: "Both were passed in 1992."
        mistakes: {"1993": local_amendments}
