  - code: ss9.mountains.life
    title: Human life in the mountains
    after: [ss9.mountains.climate_nature]
    notes: |
      Farming is limited by height, steep slopes, immature soil and low temperature. People terrace the
      slopes: paddy, legumes and potatoes in the rainy season; wheat and temperate fruits (apple) in spring.
      Tea grows in the Eastern Himalayas, especially Assam and Darjeeling. Tribes of the north-eastern
      hills practise shifting cultivation. Animal rearing is the main occupation: goats and cattle in
      valleys, sheep and horses on slopes, yak in the coldest parts of Himachal and Ladakh; the Gujjars are
      shepherd tribes of the Western Himalayan meadows. Tourism developed in three phases: pilgrimage
      (Kailas, Manasarovar, Amarnath, Hemkund Sahib); 19th-century British hill stations (Shimla,
      Darjeeling, Shillong, Almora, Ranikhet, Mussoorie, Nainital); adventure tourism (mountaineering,
      paragliding, skiing) after Tenzing Norgay and Edmund Hillary climbed Everest on 29 May 1953. Tenzing
      Norgay: "Mountains are not hindrances; they are doors to the outer world."
    explanations:
      text: "Mountain people farm in steps cut into slopes, raise animals suited to the cold, and live on tourism that began with pilgrims, grew with British hill stations and boomed with adventure sports."
      visual: "Picture a hillside cut into green stairs, each step a small flat field: terrace farming."
      step_by_step: "To match an animal to the place: Step 1: valley? Goats and cattle. Step 2: mountain slope? Sheep and horses. Step 3: freezing Ladakh? Yak."
      real_world: "Many Keralite families visit Shimla or Manali on holiday: they are using the hill stations the British set up in the 1800s."
    activity:
      type: sort
      prompt: How do people live from it?
      bins:
      - Farming
      - Animal rearing
      - Tourism
      items:
      - label: Paddy and potatoes on terraced slopes
        bin: Farming
        clue: Steps are cut into the hill.
        why: Terrace farming.
      - label: Tea gardens in Darjeeling
        bin: Farming
        clue: A plantation crop.
        why: Tea is farmed.
      - label: Yak herding in Ladakh
        bin: Animal rearing
        clue: In the coldest parts.
        why: Animal rearing is the main occupation.
      - label: Gujjars moving sheep to summer meadows
        bin: Animal rearing
        clue: Shepherd tribes.
        why: Animal rearing.
      - label: Pilgrims at Amarnath
        bin: Tourism
        clue: The oldest kind of mountain travel.
        why: Pilgrimage tourism.
      - label: Paragliding and skiing
        bin: Tourism
        clue: Adventure, after Everest was climbed in 1953.
        why: Adventure tourism.
      - label: Shimla, built as a summer retreat
        bin: Tourism
        clue: A 19th-century British idea.
        why: Hill-station tourism.
    items:
      - prompt: "Who first climbed Mount Everest in 1953?"
