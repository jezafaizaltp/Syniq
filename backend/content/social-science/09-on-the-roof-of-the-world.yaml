# Class 9 Social Science II, chapter 1 (stored as Social Science chapter 9). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 1 text supplied by the school.
subject: ss
chapter: 9
title: On the Roof of the World

tips:
  himalaya_ranges: "The Northern Mountains have three parts: the Trans Himalayas (Karakoram, Ladakh, Zaskar), the Himalayas and the Eastern (Purvachal) Hills. The Himalayas are three parallel ranges: Himadri (Greater, about 6100 m, ~25 km wide), Himachal (Lesser, 3500–4500 m, 60–80 km wide) and Shiwaliks (Outer, southernmost, 60–150 km wide)."
  plate_tectonics: "Lithospheric plates move slowly over the semi-molten asthenosphere. Convergent boundaries: plates move towards each other (fold mountains form). Divergent: they move apart. Transform: they slide past. The Himalayas rose when the Indian Plate moved north into the Eurasian Plate and pushed up the Tethys seabed."
  himalaya_divisions: "Regional divisions by rivers: Western Himalayas (Indus to Kali: Kashmir, Himachal, Uttarakhand), Central Himalayas (Kali to Teesta, mostly Nepal), Eastern Himalayas (Teesta to Brahmaputra, also called Assam Himalayas)."
  himalaya_features: "Key features: K2 (8611 m) in the Karakoram; Siachen glacier; Banihal Pass (Pir Panjal); Dal Lake; margs (Gulmarg, Sonmarg); Rohtang and Baralacha La passes; duns (Dehradun); bugyals (alpine meadows); Nathula and Bomdila passes; Namcha Barwa (7756 m); Loktak Lake and phumdis."
  himalaya_climate: "Climate changes with height: mild in the Shiwalik foothills, very cold higher up, polar-like in Ladakh. Bay of Bengal winds trapped between the Assam Himalayas and Purvachal give Meghalaya very heavy rain. Himalayan rivers are snow-fed and rain-fed, so they are perennial."
  himalaya_life: "Life: terrace farming (paddy, potatoes, wheat, fruit), tea in Assam and Darjeeling, shifting cultivation in the north-east, animal rearing (yak in Ladakh; Gujjar shepherds), transhumance, and tourism in three phases: pilgrimage, British hill stations, adventure after Everest was climbed in 1953."

concepts:
  - code: ss9.mountains.ranges
    title: The Northern Mountains and the three Himalayan ranges
    notes: |
      India's physiographic divisions: Northern Mountain Region, North Indian Plain, Peninsular Plateau,
      Indian Desert, Coastal Plains and Islands. The Northern Mountains start from the Pamir Knot ('the
      Roof of the World') and extend to Purvachal; other ranges from the Pamir include the Kunlun and Tian
      Shan. They are young fold mountains formed by folding of sedimentary rock layers; they stretch from
      the Indus to the Brahmaputra for nearly 2400 km, 150–400 km wide. Mountains generally average over
      900 m. Three parts: Trans Himalayas, the Himalayas, the Eastern Hills. Trans Himalayas (Tibetan
      Himalayas): average 3000 m, about 40 km wide and 965 km long; the Karakoram links the Himalayas to the
      Pamir Knot. The Himalayas: three parallel ranges. Shiwaliks: southernmost, Outer Himalayas, 60–150
      km wide, border the Ganga plains. Himachal: Lesser Himalayas, 3500–4500 m, 60–80 km wide. Himadri:
      Greater or Inner Himalayas, average about 6100 m, nearly 25 km wide, snow-clad, with most of the
      world's highest peaks.
    explanations:
      text: "The Northern Mountains are young, folded mountains that run about 2400 km. The Himalayas themselves are three ranges side by side: the high Himadri in the north, the Himachal in the middle and the low Shiwaliks in the south."
      visual: "Picture three steps going up from the Ganga plain: first the low Shiwaliks, then the Himachal, then the tall, snowy Himadri wall at the back."
      step_by_step: "To name a range from its height: Step 1: about 6100 m and snow-clad? Himadri. Step 2: 3500–4500 m? Himachal. Step 3: the low outer foothills next to the plains? Shiwaliks."
      real_world: "Shimla and Manali sit in the Lesser Himalayas; the snowy peaks you see behind them are the Himadri."
    items:
      - prompt: "The Pamir Knot is known as"
        options: ["The Roof of the World", "The Land of Rivers", "The Gate of India", "The Great Divide"]
        answer: "The Roof of the World"
        difficulty: 1
        hints: ["It is the chapter's title."]
        solution: "The Roof of the World."
        mistakes: {"The Gate of India": himalaya_ranges}
      - prompt: "Which is the southernmost range of the Himalayas?"
        options: ["Shiwaliks", "Himadri", "Himachal", "Karakoram"]
        answer: "Shiwaliks"
        difficulty: 1
        hints: ["It is also called the Outer Himalayas."]
        solution: "The Shiwaliks."
        mistakes: {"Himadri": himalaya_ranges}
      - prompt: "The Himadri is also called"
        options: ["The Greater or Inner Himalayas", "The Lesser Himalayas", "The Outer Himalayas", "The Trans Himalayas"]
        answer: "The Greater or Inner Himalayas"
        difficulty: 1
        hints: ["It is the highest range."]
        solution: "The Greater (Inner) Himalayas."
        mistakes: {"The Lesser Himalayas": himalaya_ranges}
      - prompt: "About how long are the Northern Mountains from the Indus to the Brahmaputra (km)?"
        answer: "2400"
        check: "2400"
        difficulty: 2
        hints: ["Between 2000 and 2500."]
        solution: "Nearly 2400 km."
        mistakes: {"965": himalaya_ranges}
      - prompt: "What is the average height of the Himadri range (metres)?"
        answer: "6100"
        check: "6100"
        difficulty: 2
        hints: ["Higher than 6000 m."]
        solution: "About 6100 m."
        mistakes: {"3000": himalaya_ranges}
      - prompt: "Which range connects the Himalayas with the Pamir Knot?"
        options: ["Karakoram", "Shiwalik", "Naga Hills", "Aravali"]
        answer: "Karakoram"
        difficulty: 2
        hints: ["K2 is in it."]
        solution: "The Karakoram."
        mistakes: {"Aravali": himalaya_ranges}
      - prompt: "The Himachal range averages 3500 to 4500 m. What is the difference between its highest and lowest average heights (m)?"
        answer: "1000"
