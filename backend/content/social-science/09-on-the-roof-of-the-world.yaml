        mistakes: {"They are the highest range": himalaya_ranges, "They are covered with glaciers all year": loose_sediment, "They are made of hard granite": loose_sediment}

  - code: ss9.mountains.origin
    title: How the Himalayas formed
    after: [ss9.mountains.ranges]
    notes: |
      Fold mountains form when sedimentary rock strata are compressed (folding); the Himalayas and Alps are
      examples. The lithosphere (crust plus upper mantle) is broken into lithospheric plates, thousands of
      km wide and about 100 km thick, covering continents, ocean floor or both. They move slowly over the
      asthenosphere, where rock is semi-plastic due to heat. Mountain building (orogenic processes) happens
      along plate boundaries: convergent (plates move towards each other), divergent (move apart),
      transform or shear (slide past). At convergent boundaries rock layers fold, making fold mountains.
      The Indian Plate (Peninsular India and Australia) was in the southern hemisphere 150–160 million years
      ago; it moved north toward the Eurasian Plate and the Tethys seabed between them was pushed up,
      forming the Himalayas, which are still growing.
    explanations:
      text: "The Himalayas formed when the Indian Plate crashed slowly into the Eurasian Plate. The sea floor of the Tethys between them was squeezed and folded up into mountains, and the push still continues."
      visual: "Push a tablecloth from both ends on a table: it crumples into folds. That is how rock layers fold at a convergent boundary."
      step_by_step: "To name a plate boundary: Step 1: plates moving towards each other? Convergent. Step 2: moving apart? Divergent. Step 3: sliding past side by side? Transform."
      real_world: "Earthquakes in Nepal and north India happen because the Indian Plate is still pushing north."
    activity:
      type: order
      prompt: How did the Himalayas form? Put the steps in order.
      steps:
      - Indian Plate in the southern hemisphere, 150 million yrs ago
      - The Indian Plate moves north towards the Eurasian Plate
      - The Tethys seabed between them is squeezed
      - Rock layers fold and rise as fold mountains
      - The Himalayas keep growing today
      reasons:
        The Indian Plate moves north towards the Eurasian Plate: The plate had to move before anything could collide.
        The Tethys seabed between them is squeezed: Only when the plates came close was the sea between them squeezed.
        Rock layers fold and rise as fold mountains: Squeezing sedimentary layers is what folds them upward.
        The Himalayas keep growing today: The plates are still pushing, so the rise continues.
    items:
      - prompt: "At which type of plate boundary did the Himalayas form?"
        options: ["Convergent", "Divergent", "Transform"]
        answer: "Convergent"
        difficulty: 1
        hints: ["The plates moved towards each other."]
        solution: "A convergent boundary."
        mistakes: {"Divergent": plate_tectonics}
      - prompt: "Which sea once lay between the Indian Plate and the Eurasian Plate?"
        options: ["Tethys", "Arabian Sea", "Mediterranean", "Caspian Sea"]
        answer: "Tethys"
        difficulty: 1
        hints: ["Its seabed was pushed up."]
        solution: "The Tethys."
        mistakes: {"Arabian Sea": plate_tectonics}
      - prompt: "Plates that slide past each other form a"
        options: ["Transform (shear) boundary", "Convergent boundary", "Divergent boundary"]
        answer: "Transform (shear) boundary"
        difficulty: 1
        hints: ["Neither towards nor apart."]
        solution: "A transform boundary."
        mistakes: {"Divergent boundary": plate_tectonics}
      - prompt: "Fold mountains are formed by"
        options: ["Compression of sedimentary rock layers", "Volcanic lava only", "Wind erosion", "River deposition"]
        answer: "Compression of sedimentary rock layers"
        difficulty: 2
        hints: ["The process is called folding."]
        solution: "Folding of compressed rock strata."
        mistakes: {"Wind erosion": plate_tectonics}
      - prompt: "The layer below the lithosphere where rocks are semi-plastic is the"
        options: ["Asthenosphere", "Crust", "Atmosphere", "Hydrosphere"]
        answer: "Asthenosphere"
        difficulty: 2
        hints: ["Plates move over it."]
        solution: "The asthenosphere."
        mistakes: {"Crust": plate_tectonics}
      - prompt: "About how thick is a lithospheric plate (km)?"
        answer: "100"
        check: "100"
        difficulty: 2
        hints: ["Its width is thousands of km."]
        solution: "About 100 km."
        mistakes: {"1000": plate_tectonics}
      - prompt: "Why are the Himalayas said to be still growing?"
        options: ["The Indian Plate is still pushing north into the Eurasian Plate", "Snow keeps piling on top", "Rivers deposit soil on peaks", "Volcanoes erupt there"]
        answer: "The Indian Plate is still pushing north into the Eurasian Plate"
        difficulty: 3
        hints: ["Plate movement has not stopped."]
        solution: "Continued convergence keeps folding the rocks upward."
        mistakes: {"Snow keeps piling on top": plate_tectonics}
      - prompt: "Fossils of sea animals are found high up in the Himalayas. How did they get there?"
        options: ["The rocks were once sediments on the floor of the Tethys Sea, later folded upwards", "Birds carried the shells up", "The sea covered the mountains a hundred years ago", "Glaciers carried them up from the ocean"]
        answer: "The rocks were once sediments on the floor of the Tethys Sea, later folded upwards"
        difficulty: 3
        hints: ["What lay between the Indian and Eurasian plates before they met?", "What happens to sea-floor layers when plates collide?"]
        solution: "Step 1: Sea creatures were buried in sediments on the Tethys floor. Step 2: As the Indian Plate pushed north, these layers were folded and lifted into mountains."
        mistakes: {"Birds carried the shells up": sea_fossils, "The sea covered the mountains a hundred years ago": sea_fossils, "Glaciers carried them up from the ocean": sea_fossils}
      - prompt: "What happens to plates at a divergent boundary?"
        options: ["They move apart", "They collide", "They slide past each other", "They stay still"]
        answer: "They move apart"
        difficulty: 2
        hints: ["The Himalayas formed at a convergent boundary.", "'Diverge' means to go in different directions."]
        solution: "Step 1: Convergent: plates collide. Transform: they slide past. Step 2: Divergent: they move apart, and new crust forms between them."
        mistakes: {"They collide": plates_apart, "They slide past each other": plates_apart, "They stay still": plates_apart}

  - code: ss9.mountains.divisions
    title: Regional divisions of the Himalayas
    after: [ss9.mountains.ranges]
    notes: |
      Rivers cut deep gorges (deep valleys with steep sides) across the Himalayas; the regional divisions
      follow these rivers. Western Himalayas (Indus to Kali): Kashmir, Himachal and Uttarakhand Himalaya.
      Kashmir Himalaya: about 3.5 lakh sq km, 700 km long, 500 km wide; ranges Karakoram, Zaskar, Ladakh,
      Pir Panjal; K2 (Godwin Austen, 8611 m), the world's second highest peak; Siachen (world's highest
      battlefield) and Baltoro glaciers feed the Indus, Ravi, Jhelum and Chenab; Banihal Pass across Pir
      Panjal joins Jammu and Kashmir Valley; Dal Lake at Srinagar with shikaras; margs (summer meadows,
      winter skiing) like Gulmarg and Sonmarg. Himachal Himalaya: rivers Chenab, Ravi, Beas; ranges
      Dhauladhar and Pir Panjal; Chandratal and Surajtal lakes; Baralacha La and Rohtang passes; Kulu,
      Kangra, Lahul valleys; Shimla, Manali; hot springs (Manikaran has a geothermal plant). Uttarakhand
      Himalaya (Satluj to Kali): Garhwal (west) and Kumaon (east); Nanda Devi, Kamet, Badrinath, Kedarnath;
      Gangotri and Yamunotri glaciers; Nainital and Bhimtal; duns (flat valleys, e.g. Dehradun); bugyals
      (alpine meadows 3000–4500 m) and transhumance (seasonal migration with herds). Central Himalayas
      (Kali to Teesta): Nepal Himalaya; Everest in Nepal; Kanchenjunga and Nathula Pass; Darjeeling tea.
      Eastern Himalayas (Teesta to Brahmaputra; Assam Himalayas): Namcha Barwa (7756 m); rivers Kameng,
      Lohit, Subansiri; Bomdila and Diphu passes. Purvachal Hills (500–3000 m): Patkai Bum, Naga, Mizo,
      Manipur hills; Cherrapunji and Mawsynram get the world's highest rainfall; living root bridges in
      Meghalaya; Keibul Lamjao floating national park on phumdis in Loktak Lake (Ramsar site).
    explanations:
      text: "Rivers slice the Himalayas into three regions: Western (Indus to Kali), Central (Kali to Teesta) and Eastern (Teesta to Brahmaputra). Each has its own peaks, passes, lakes and meadows."
      visual: "Draw the Himalayan arc and drop four river lines across it: Indus, Kali, Teesta, Brahmaputra. The three spaces between them are the Western, Central and Eastern Himalayas."
      step_by_step: "To place a feature: Step 1: K2, Dal Lake, Rohtang, Dehradun? Western. Step 2: Everest, Kanchenjunga, Darjeeling? Central. Step 3: Namcha Barwa, Bomdila? Eastern."
      real_world: "Darjeeling tea, sold all over the world, grows on the slopes of the Central Himalayas."
    activity:
      type: sort
      prompt: Which part of the Himalayas?
      bins:
      - Kashmir
      - Himachal
      - Uttarakhand
      - Eastern
      - Purvachal
      items:
      - label: Dal Lake and shikaras
        bin: Kashmir
        clue: At Srinagar.
        why: Dal Lake is in the Kashmir Himalaya.
      - label: K2 (Godwin Austen), 8611 m
        bin: Kashmir
        clue: In the Karakoram.
        why: K2 is in the Kashmir Himalaya.
      - label: Rohtang Pass and Kulu valley
        bin: Himachal
        clue: Near Manali.
        why: Himachal Himalaya.
      - label: Manikaran hot springs
        bin: Himachal
        clue: Has a geothermal plant.
        why: Himachal Himalaya.
      - label: Nanda Devi and Gangotri glacier
        bin: Uttarakhand
        clue: Between the Satluj and Kali.
        why: Uttarakhand Himalaya.
      - label: Dehradun, a dun
        bin: Uttarakhand
        clue: Flat valleys of Garhwal.
        why: Duns are in the Uttarakhand Himalaya.
      - label: Namcha Barwa, 7756 m
        bin: Eastern
        clue: Between the Teesta and the Brahmaputra.
        why: Eastern (Assam) Himalaya.
      - label: Bomdila Pass
        bin: Eastern
        clue: In Arunachal Pradesh.
        why: Eastern Himalaya.
      - label: Mawsynram, the world's highest rainfall
        bin: Purvachal
        clue: Meghalaya's hills.
        why: Purvachal hills.
      - label: Keibul Lamjao, a floating park on Loktak Lake
        bin: Purvachal
        clue: In Manipur.
        why: Purvachal hills.
    items:
      - prompt: "The world's second highest peak, K2, is in which range?"
        options: ["Karakoram", "Shiwalik", "Pir Panjal", "Naga Hills"]
