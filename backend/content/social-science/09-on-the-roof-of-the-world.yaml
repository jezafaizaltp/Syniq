# Class 9 Social Science II, chapter 1 (stored as Social Science chapter 9). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 1 text supplied by the school.
subject: ss
chapter: 9
title: On the Roof of the World

tips:
  loose_sediment: "The outermost range formed last, from sediments washed down by rivers. Are those rocks hard and firm, or loose?"
  sea_fossils: "The rocks of the Himalayas were once layers of mud on a sea floor. Which sea lay between the two plates?"
  plates_apart: "There are three kinds of plate boundary: plates push together, pull apart or slide past. 'Divergent' means going different ways."
  rivers_cut_down: "Fast water on steep slopes cuts downward. If the mountains keep rising while the river keeps cutting, what shape of valley forms?"
  mountain_wall: "Think of the Himalayas as a high wall between India and Central Asia. What can't cross a wall that high?"
  height_cools: "Climbing higher makes the air colder. What does that do to the plants that can grow?"
  seasonal_pastures: "High mountain meadows are under snow in winter. When can animals graze there?"
  fragile_slopes: "Mountain slopes, forests and glaciers are easily damaged. What do crowds, roads and waste do to them?"
  himalaya_ranges: "Picture the Himalayas as three parallel walls: the highest inner one, the middle one, and the low outer foothills furthest south. The Pamir Knot is so high it has a famous nickname about the top of the world. For numbers, check the chapter's table of lengths and heights; a mountain is taller than a plateau's 600–900 m."
  plate_tectonics: "Plates float on a soft, semi-plastic layer below the hard lithosphere. When plates push together (converge), rock layers from an old sea between them fold up into mountains. Plates can also pull apart or slide past each other. The Indian Plate has not stopped moving north."
  himalaya_divisions: "The regional divisions go by rivers: Indus to Kali in the west, Kali to Teesta in the middle (mostly Nepal), Teesta to Brahmaputra in the east (also called the Assam Himalayas). Which rivers is the place between?"
  himalaya_features: "Use the chapter's map of the north: the second-highest peak is in the range that links to the Pamirs; flat valleys in the outer hills have a name ending in -n; floating islands in Manipur's lake have a local name. For height differences, subtract carefully."
  himalaya_climate: "Himalayan rivers get water from melting snow as well as rain, so they flow all year and swell in summer heat. The Ganga starts from a glacier named after it. Trees on cold slopes have needles and cones. Winds trapped in a funnel of hills drop huge rain on Meghalaya."
  himalaya_life: "Think of life on steep, cold slopes: fields are cut into steps, herders move up and down with the seasons, and animals suited to thin cold air are reared. Tourism began with religious journeys. Everest was first climbed in the early 1950s by a Sherpa and a New Zealander."

concepts:
  - code: ss9.mountains.ranges
    title: The Northern Mountains and the three Himalayan ranges
    notes: |
      India's physiographic divisions: Northern Mountain Region, North Indian Plain, Peninsular Plateau,
      Indian Desert, Coastal Plains and Islands. The Northern Mountains start from the Pamir Knot ('the
      Roof of the World') and extend to Purvachal; other ranges from the Pamir include the Kunlun and Tian
      Shan. They are young fold mountains formed by folding of sedimentary rock layers; they stretch from
      the Indus to the Brahmaputra for nearly 2400 km, 150–400 km wide. Mountains generally average over
      900 m. Three parts: Trans Himalayas, the Himalayas, the Eastern Hills. Trans Himalayas (Tibetan
      Himalayas): average 3000 m, about 40 km wide and 965 km long; the Karakoram links the Himalayas to the
      Pamir Knot. The Himalayas: three parallel ranges. Shiwaliks: southernmost, Outer Himalayas, 60–150
      km wide, border the Ganga plains. Himachal: Lesser Himalayas, 3500–4500 m, 60–80 km wide. Himadri:
      Greater or Inner Himalayas, average about 6100 m, nearly 25 km wide, snow-clad, with most of the
      world's highest peaks.
    explanations:
      text: "The Northern Mountains are young, folded mountains that run about 2400 km. The Himalayas themselves are three ranges side by side: the high Himadri in the north, the Himachal in the middle and the low Shiwaliks in the south."
      visual: "Picture three steps going up from the Ganga plain: first the low Shiwaliks, then the Himachal, then the tall, snowy Himadri wall at the back."
      step_by_step: "To name a range from its height: Step 1: about 6100 m and snow-clad? Himadri. Step 2: 3500–4500 m? Himachal. Step 3: the low outer foothills next to the plains? Shiwaliks."
      real_world: "Shimla and Manali sit in the Lesser Himalayas; the snowy peaks you see behind them are the Himadri."
    activity:
      type: sort
      prompt: Which Himalayan range?
      bins:
      - Himadri
      - Himachal
      - Shiwaliks
      items:
      - label: Snow-clad, with most of the highest peaks
