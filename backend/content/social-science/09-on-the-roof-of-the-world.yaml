        mistakes: {"They flow slowly and drop sediment": rivers_cut_down, "People dug the gorges for roads": rivers_cut_down, "Only wind shaped them": rivers_cut_down}

  - code: ss9.mountains.climate_nature
    title: Climate, rivers, soil and vegetation of the Himalayas
    after: [ss9.mountains.divisions]
    notes: |
      The Himalayas form a climatic divide between the subcontinent and Central Asia. Climate varies with
      height: mild on lower slopes and Shiwalik foothills, very cold at height, polar-like in Ladakh. The
      southwest monsoon gives rain on the southern Shiwalik slopes and the north-east; snowfall higher up.
      Bay of Bengal winds trapped between the Assam Himalayas and Purvachal give the Meghalaya Plateau very
      heavy rain. Many hill stations because of the cool climate. Drainage: Indus (from Bokharchu glacier
      near Manasarovar), Ganga (from Gangotri glacier at Gomukh; tributaries Yamuna, Ghaghara, Gandak,
      Kosi), Brahmaputra (from Chemayungdung glacier near Manasarovar; tributaries Dibang, Lohit, Manas);
      snow-fed and rain-fed, so perennial; turbulent in mountains; flood even in summer from snowmelt;
      make V-shaped valleys, gorges and waterfalls. Soil: mountain and forest soil; fine humus-rich soil in
      valleys, coarse low-humus on high slopes; alluvium in valleys; Karewas (glacial deposits in Kashmir)
      suit saffron. Vegetation changes with height: tropical evergreen in the Eastern Himalayas and NE hills
      (rain above 200 cm); semi-evergreen and deciduous in valleys; moist deciduous at 1000–2000 m;
      coniferous pine and deodar on slopes; junipers and rhododendrons higher; alpine meadows highest,
      up to tundra-type. Wildlife: yak, musk deer, one-horned rhinoceros, snow leopard. National parks:
      Dachigam, Hemis, Valley of Flowers, Corbett, Rajaji (west); Kanchenjunga, Dibru-Saikhowa,
      Kaziranga, Manas, Keibul Lamjao (east).
    explanations:
      text: "In the Himalayas, everything changes with height: it gets colder, the forests change from evergreen to pine to meadows, and the soil gets coarser. Snow-fed rivers flow all year."
