        why: That is Himadri.
      - label: The Lesser Himalayas, 3500–4500 m
        bin: Himachal
        clue: The middle range.
        why: Himachal is the Lesser Himalayas.
      - label: 60–80 km wide, middle range
        bin: Himachal
        clue: Between the outer and inner ranges.
        why: That is Himachal.
      - label: The Outer Himalayas, southernmost
        bin: Shiwaliks
        clue: Closest to the plains.
        why: The Shiwaliks are the outer range.
      - label: Borders the Ganga plains, 60–150 km wide
        bin: Shiwaliks
        clue: The lowest, nearest the plains.
        why: That is the Shiwaliks.
    items:
