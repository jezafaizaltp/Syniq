  - code: ss9.mountains.origin
    title: How the Himalayas formed
    after: [ss9.mountains.ranges]
    notes: |
      Fold mountains form when sedimentary rock strata are compressed (folding); the Himalayas and Alps are
      examples. The lithosphere (crust plus upper mantle) is broken into lithospheric plates, thousands of
      km wide and about 100 km thick, covering continents, ocean floor or both. They move slowly over the
      asthenosphere, where rock is semi-plastic due to heat. Mountain building (orogenic processes) happens
      along plate boundaries: convergent (plates move towards each other), divergent (move apart),
      transform or shear (slide past). At convergent boundaries rock layers fold, making fold mountains.
      The Indian Plate (Peninsular India and Australia) was in the southern hemisphere 150–160 million years
      ago; it moved north toward the Eurasian Plate and the Tethys seabed between them was pushed up,
      forming the Himalayas, which are still growing.
    explanations:
      text: "The Himalayas formed when the Indian Plate crashed slowly into the Eurasian Plate. The sea floor of the Tethys between them was squeezed and folded up into mountains, and the push still continues."
      visual: "Push a tablecloth from both ends on a table: it crumples into folds. That is how rock layers fold at a convergent boundary."
      step_by_step: "To name a plate boundary: Step 1: plates moving towards each other? Convergent. Step 2: moving apart? Divergent. Step 3: sliding past side by side? Transform."
      real_world: "Earthquakes in Nepal and north India happen because the Indian Plate is still pushing north."
    items:
      - prompt: "At which type of plate boundary did the Himalayas form?"
        options: ["Convergent", "Divergent", "Transform"]
        answer: "Convergent"
        difficulty: 1
        hints: ["The plates moved towards each other."]
        solution: "A convergent boundary."
        mistakes: {"Divergent": plate_tectonics}
      - prompt: "Which sea once lay between the Indian Plate and the Eurasian Plate?"
        options: ["Tethys", "Arabian Sea", "Mediterranean", "Caspian Sea"]
        answer: "Tethys"
        difficulty: 1
        hints: ["Its seabed was pushed up."]
        solution: "The Tethys."
        mistakes: {"Arabian Sea": plate_tectonics}
      - prompt: "Plates that slide past each other form a"
        options: ["Transform (shear) boundary", "Convergent boundary", "Divergent boundary"]
        answer: "Transform (shear) boundary"
        difficulty: 1
        hints: ["Neither towards nor apart."]
        solution: "A transform boundary."
        mistakes: {"Divergent boundary": plate_tectonics}
      - prompt: "Fold mountains are formed by"
        options: ["Compression of sedimentary rock layers", "Volcanic lava only", "Wind erosion", "River deposition"]
        answer: "Compression of sedimentary rock layers"
        difficulty: 2
        hints: ["The process is called folding."]
        solution: "Folding of compressed rock strata."
        mistakes: {"Wind erosion": plate_tectonics}
      - prompt: "The layer below the lithosphere where rocks are semi-plastic is the"
        options: ["Asthenosphere", "Crust", "Atmosphere", "Hydrosphere"]
        answer: "Asthenosphere"
        difficulty: 2
        hints: ["Plates move over it."]
        solution: "The asthenosphere."
        mistakes: {"Crust": plate_tectonics}
      - prompt: "About how thick is a lithospheric plate (km)?"
        answer: "100"
        check: "100"
        difficulty: 2
        hints: ["Its width is thousands of km."]
        solution: "About 100 km."
        mistakes: {"1000": plate_tectonics}
      - prompt: "Why are the Himalayas said to be still growing?"
        options: ["The Indian Plate is still pushing north into the Eurasian Plate", "Snow keeps piling on top", "Rivers deposit soil on peaks", "Volcanoes erupt there"]
        answer: "The Indian Plate is still pushing north into the Eurasian Plate"
        difficulty: 3
        hints: ["Plate movement has not stopped."]
        solution: "Continued convergence keeps folding the rocks upward."
        mistakes: {"Snow keeps piling on top": plate_tectonics}

  - code: ss9.mountains.divisions
    title: Regional divisions of the Himalayas
    after: [ss9.mountains.ranges]
    notes: |
      Rivers cut deep gorges (deep valleys with steep sides) across the Himalayas; the regional divisions
      follow these rivers. Western Himalayas (Indus to Kali): Kashmir, Himachal and Uttarakhand Himalaya.
      Kashmir Himalaya: about 3.5 lakh sq km, 700 km long, 500 km wide; ranges Karakoram, Zaskar, Ladakh,
      Pir Panjal; K2 (Godwin Austen, 8611 m), the world's second highest peak; Siachen (world's highest
      battlefield) and Baltoro glaciers feed the Indus, Ravi, Jhelum and Chenab; Banihal Pass across Pir
      Panjal joins Jammu and Kashmir Valley; Dal Lake at Srinagar with shikaras; margs (summer meadows,
      winter skiing) like Gulmarg and Sonmarg. Himachal Himalaya: rivers Chenab, Ravi, Beas; ranges
      Dhauladhar and Pir Panjal; Chandratal and Surajtal lakes; Baralacha La and Rohtang passes; Kulu,
      Kangra, Lahul valleys; Shimla, Manali; hot springs (Manikaran has a geothermal plant). Uttarakhand
      Himalaya (Satluj to Kali): Garhwal (west) and Kumaon (east); Nanda Devi, Kamet, Badrinath, Kedarnath;
      Gangotri and Yamunotri glaciers; Nainital and Bhimtal; duns (flat valleys, e.g. Dehradun); bugyals
      (alpine meadows 3000–4500 m) and transhumance (seasonal migration with herds). Central Himalayas
      (Kali to Teesta): Nepal Himalaya; Everest in Nepal; Kanchenjunga and Nathula Pass; Darjeeling tea.
      Eastern Himalayas (Teesta to Brahmaputra; Assam Himalayas): Namcha Barwa (7756 m); rivers Kameng,
      Lohit, Subansiri; Bomdila and Diphu passes. Purvachal Hills (500–3000 m): Patkai Bum, Naga, Mizo,
      Manipur hills; Cherrapunji and Mawsynram get the world's highest rainfall; living root bridges in
      Meghalaya; Keibul Lamjao floating national park on phumdis in Loktak Lake (Ramsar site).
    explanations:
      text: "Rivers slice the Himalayas into three regions: Western (Indus to Kali), Central (Kali to Teesta) and Eastern (Teesta to Brahmaputra). Each has its own peaks, passes, lakes and meadows."
      visual: "Draw the Himalayan arc and drop four river lines across it: Indus, Kali, Teesta, Brahmaputra. The three spaces between them are the Western, Central and Eastern Himalayas."
      step_by_step: "To place a feature: Step 1: K2, Dal Lake, Rohtang, Dehradun? Western. Step 2: Everest, Kanchenjunga, Darjeeling? Central. Step 3: Namcha Barwa, Bomdila? Eastern."
      real_world: "Darjeeling tea, sold all over the world, grows on the slopes of the Central Himalayas."
    items:
      - prompt: "The world's second highest peak, K2, is in which range?"
        options: ["Karakoram", "Shiwalik", "Pir Panjal", "Naga Hills"]
        answer: "Karakoram"
        difficulty: 1
        hints: ["It is also called Godwin Austen."]
        solution: "The Karakoram."
        mistakes: {"Pir Panjal": himalaya_features}
      - prompt: "Which rivers mark the Central Himalayas?"
        options: ["Kali and Teesta", "Indus and Kali", "Teesta and Brahmaputra", "Ganga and Yamuna"]
        answer: "Kali and Teesta"
        difficulty: 1
        hints: ["Most of it is in Nepal."]
        solution: "From the Kali to the Teesta."
        mistakes: {"Indus and Kali": himalaya_divisions}
      - prompt: "Siachen glacier is known as"
        options: ["The world's highest battlefield", "The source of the Ganga", "A floating park", "The wettest place"]
        answer: "The world's highest battlefield"
        difficulty: 1
        hints: ["Soldiers guard it."]
        solution: "The world's highest battlefield."
        mistakes: {"The source of the Ganga": himalaya_features}
      - prompt: "How high is K2 (metres)?"
        answer: "8611"
        check: "8611"
        difficulty: 2
        hints: ["Over 8600 m."]
        solution: "8611 m."
        mistakes: {"7756": himalaya_features}
      - prompt: "Flat valleys between the Lesser Himalayas and the Shiwaliks are called"
        options: ["Duns", "Margs", "Bugyals", "Phumdis"]
        answer: "Duns"
        difficulty: 2
        hints: ["Dehradun is the famous one."]
        solution: "Duns."
        mistakes: {"Margs": himalaya_features}
      - prompt: "Seasonal migration of shepherds with their herds between grazing grounds is called"
        options: ["Transhumance", "Shifting cultivation", "Terrace farming", "Urbanisation"]
        answer: "Transhumance"
        difficulty: 2
        hints: ["They go up to bugyals in summer."]
        solution: "Transhumance."
        mistakes: {"Shifting cultivation": himalaya_life}
      - prompt: "Which pass connects the Kulu valley with Lahul and Spiti?"
        options: ["Rohtang Pass", "Banihal Pass", "Nathula Pass", "Bomdila Pass"]
        answer: "Rohtang Pass"
        difficulty: 2
        hints: ["It is in Himachal Pradesh."]
        solution: "Rohtang Pass."
        mistakes: {"Nathula Pass": himalaya_features}
      - prompt: "Floating islands of organic matter and soil in Loktak Lake are called"
        options: ["Phumdis", "Margs", "Duns", "Karewas"]
        answer: "Phumdis"
        difficulty: 2
        hints: ["Keibul Lamjao National Park floats on them."]
        solution: "Phumdis."
        mistakes: {"Karewas": himalaya_features}
      - prompt: "Namcha Barwa is 7756 m and K2 is 8611 m. How much higher is K2 (m)?"
        answer: "855"
        check: "8611 - 7756"
        difficulty: 2
        hints: ["Subtract."]
        solution: "8611 − 7756 = 855 m."
        mistakes: {"16367": himalaya_features}

  - code: ss9.mountains.climate_nature
    title: Climate, rivers, soil and vegetation of the Himalayas
    after: [ss9.mountains.divisions]
    notes: |
      The Himalayas form a climatic divide between the subcontinent and Central Asia. Climate varies with
      height: mild on lower slopes and Shiwalik foothills, very cold at height, polar-like in Ladakh. The
      southwest monsoon gives rain on the southern Shiwalik slopes and the north-east; snowfall higher up.
      Bay of Bengal winds trapped between the Assam Himalayas and Purvachal give the Meghalaya Plateau very
      heavy rain. Many hill stations because of the cool climate. Drainage: Indus (from Bokharchu glacier
      near Manasarovar), Ganga (from Gangotri glacier at Gomukh; tributaries Yamuna, Ghaghara, Gandak,
      Kosi), Brahmaputra (from Chemayungdung glacier near Manasarovar; tributaries Dibang, Lohit, Manas);
      snow-fed and rain-fed, so perennial; turbulent in mountains; flood even in summer from snowmelt;
      make V-shaped valleys, gorges and waterfalls. Soil: mountain and forest soil; fine humus-rich soil in
      valleys, coarse low-humus on high slopes; alluvium in valleys; Karewas (glacial deposits in Kashmir)
      suit saffron. Vegetation changes with height: tropical evergreen in the Eastern Himalayas and NE hills
      (rain above 200 cm); semi-evergreen and deciduous in valleys; moist deciduous at 1000–2000 m;
      coniferous pine and deodar on slopes; junipers and rhododendrons higher; alpine meadows highest,
      up to tundra-type. Wildlife: yak, musk deer, one-horned rhinoceros, snow leopard. National parks:
      Dachigam, Hemis, Valley of Flowers, Corbett, Rajaji (west); Kanchenjunga, Dibru-Saikhowa,
      Kaziranga, Manas, Keibul Lamjao (east).
    explanations:
      text: "In the Himalayas, everything changes with height: it gets colder, the forests change from evergreen to pine to meadows, and the soil gets coarser. Snow-fed rivers flow all year."
      visual: "Picture climbing a mountain: thick green forest at the bottom, then tall pine and deodar, then short shrubs like rhododendron, then grassy meadows, then snow."
      step_by_step: "To explain why Himalayan rivers never dry up: Step 1: monsoon rain feeds them in the rainy season. Step 2: melting snow and glaciers feed them in summer. Step 3: so they have water all year: perennial."
      real_world: "Kashmiri saffron, one of the costliest spices, grows on the Karewa soils of the Kashmir valley."
    items:
      - prompt: "Why are Himalayan rivers perennial?"
        options: ["They are fed by both snow and rain", "They flow only in winter", "They come from the sea", "They are man-made canals"]
        answer: "They are fed by both snow and rain"
        difficulty: 1
        hints: ["Glaciers melt in summer."]
        solution: "Snowmelt and rain keep them flowing all year."
        mistakes: {"They flow only in winter": himalaya_climate}
      - prompt: "The Ganga originates from which glacier?"
        options: ["Gangotri", "Siachen", "Bokharchu", "Yamunotri"]
        answer: "Gangotri"
        difficulty: 1
        hints: ["At Gomukh."]
        solution: "The Gangotri glacier."
        mistakes: {"Yamunotri": himalaya_climate}
      - prompt: "Karewas in the Kashmir valley are ideal for growing"
        options: ["Saffron", "Tea", "Rice", "Rubber"]
        answer: "Saffron"
        difficulty: 2
        hints: ["They are humus-rich glacial deposits."]
        solution: "Saffron."
        mistakes: {"Tea": himalaya_climate}
      - prompt: "Which trees grow mostly on the Himalayan mountain slopes?"
        options: ["Pine and deodar (coniferous)", "Coconut and arecanut", "Mangroves", "Cactus"]
        answer: "Pine and deodar (coniferous)"
        difficulty: 1
        hints: ["Cone-bearing trees."]
        solution: "Coniferous trees like pine and deodar."
        mistakes: {"Mangroves": himalaya_climate}
      - prompt: "Why does the Meghalaya Plateau receive very heavy rain?"
        options: ["Bay of Bengal winds are trapped between the Assam Himalayas and Purvachal hills", "It is a desert", "It has no mountains", "Winds come from Central Asia"]
        answer: "Bay of Bengal winds are trapped between the Assam Himalayas and Purvachal hills"
        difficulty: 2
        hints: ["Their moisture falls back as rain."]
        solution: "The trapped monsoon winds shed most of their moisture there."
        mistakes: {"Winds come from Central Asia": himalaya_climate}
      - prompt: "Kaziranga National Park, home of the one-horned rhinoceros, is in"
        options: ["Assam", "Uttarakhand", "Ladakh", "Sikkim"]
        answer: "Assam"
        difficulty: 2
        hints: ["Eastern Himalaya parks."]
        solution: "Assam."
        mistakes: {"Uttarakhand": himalaya_climate}
      - prompt: "Why are Himalayan rivers flood-prone even in summer?"
        options: ["Snow and glaciers melt in the heat", "The monsoon is strongest in winter", "Sea water enters them", "Dams release water"]
        answer: "Snow and glaciers melt in the heat"
        difficulty: 3
        hints: ["Think of what summer heat does to snow."]
        solution: "Summer snowmelt swells the rivers."
        mistakes: {"Sea water enters them": himalaya_climate}

  - code: ss9.mountains.life
    title: Human life in the mountains
    after: [ss9.mountains.climate_nature]
    notes: |
      Farming is limited by height, steep slopes, immature soil and low temperature. People terrace the
      slopes: paddy, legumes and potatoes in the rainy season; wheat and temperate fruits (apple) in spring.
      Tea grows in the Eastern Himalayas, especially Assam and Darjeeling. Tribes of the north-eastern
      hills practise shifting cultivation. Animal rearing is the main occupation: goats and cattle in
      valleys, sheep and horses on slopes, yak in the coldest parts of Himachal and Ladakh; the Gujjars are
      shepherd tribes of the Western Himalayan meadows. Tourism developed in three phases: pilgrimage
      (Kailas, Manasarovar, Amarnath, Hemkund Sahib); 19th-century British hill stations (Shimla,
      Darjeeling, Shillong, Almora, Ranikhet, Mussoorie, Nainital); adventure tourism (mountaineering,
      paragliding, skiing) after Tenzing Norgay and Edmund Hillary climbed Everest on 29 May 1953. Tenzing
      Norgay: "Mountains are not hindrances; they are doors to the outer world."
    explanations:
      text: "Mountain people farm in steps cut into slopes, raise animals suited to the cold, and live on tourism that began with pilgrims, grew with British hill stations and boomed with adventure sports."
      visual: "Picture a hillside cut into green stairs, each step a small flat field: terrace farming."
      step_by_step: "To match an animal to the place: Step 1: valley? Goats and cattle. Step 2: mountain slope? Sheep and horses. Step 3: freezing Ladakh? Yak."
      real_world: "Many Keralite families visit Shimla or Manali on holiday: they are using the hill stations the British set up in the 1800s."
    items:
      - prompt: "Who first climbed Mount Everest in 1953?"
        options: ["Tenzing Norgay and Edmund Hillary", "John McCarthy and Ward Cunningham", "Vasco da Gama", "Rakesh Sharma"]
        answer: "Tenzing Norgay and Edmund Hillary"
        difficulty: 1
        hints: ["A Sherpa and a New Zealander."]
        solution: "Tenzing Norgay and Edmund Hillary, 29 May 1953."
        mistakes: {"Rakesh Sharma": himalaya_life}
      - prompt: "In which year was Everest first climbed?"
        answer: "1953"
        check: "1953"
        difficulty: 1
        hints: ["Six years after independence."]
        solution: "1953."
        mistakes: {"1947": himalaya_life}
      - prompt: "Cutting mountain slopes into steps for farming is called"
        options: ["Terrace farming", "Shifting cultivation", "Transhumance", "Plantation"]
        answer: "Terrace farming"
        difficulty: 1
        hints: ["Steps like a terrace."]
        solution: "Terrace farming."
        mistakes: {"Shifting cultivation": himalaya_life}
      - prompt: "Which animal is reared in the coldest regions of Ladakh?"
        options: ["Yak", "Camel", "Buffalo", "Elephant"]
        answer: "Yak"
        difficulty: 1
        hints: ["It resists severe cold."]
        solution: "Yak."
        mistakes: {"Camel": himalaya_life}
      - prompt: "The Gujjars of the Western Himalayas are"
        options: ["Shepherd tribes", "Tea planters", "Fishermen", "Miners"]
        answer: "Shepherd tribes"
        difficulty: 2
        hints: ["They live in mountain meadows."]
        solution: "Shepherd tribes."
        mistakes: {"Tea planters": himalaya_life}
      - prompt: "Which was the first phase of tourism in the Himalayas?"
        options: ["Pilgrimage", "Adventure sports", "British hill stations", "Film shooting"]
        answer: "Pilgrimage"
        difficulty: 2
        hints: ["Kailas, Amarnath and Manasarovar."]
        solution: "Pilgrimage, then hill stations, then adventure tourism."
        mistakes: {"Adventure sports": himalaya_life}
      - prompt: "Which factors make farming hard in the Himalayas?"
        options: ["Height, steep slopes, immature soil and low temperature", "Too much flat land", "Lack of sunlight all year", "Salty sea water"]
        answer: "Height, steep slopes, immature soil and low temperature"
        difficulty: 2
        hints: ["Think about mountain conditions."]
        solution: "Elevation, slope, poor soil and cold."
        mistakes: {"Salty sea water": himalaya_life}
