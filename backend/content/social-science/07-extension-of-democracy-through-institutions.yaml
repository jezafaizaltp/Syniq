# Class 9 Social Science I, chapter 7. Format: content/README.md.
subject: ss
chapter: 7
title: Extension of Democracy through Institutions

tips:
  free_hand: "If the government in power controlled elections, could they be fair? Who should be free from its control?"
  audit_to_house: "The CAG audits spending on behalf of the people's representatives. Where do its reports go to be discussed?"
  next_commission: "A Finance Commission covers 5 years. Add 5 to the start year."
  rti_next_step: "The RTI Act gives a next step when an office doesn't answer in time. Who is above the Public Information Officer?"
  rti_goals: "RTI exists to open up government. Which choice would do the opposite?"
  k9_lokpal: "Corruption complaints at the national level go to an ombudsman whose name means 'protector of the people'. States have a similar body ending in -ayukta."
  eci_role: "National elections (Lok Sabha, assemblies, President) are run by the national election body set up under Article 324; local elections are run by each state's own commission. Rights against discrimination are in the Fundamental Rights, starting at Article 14."
  voting_age: "India lowered the voting age from 21 by the 61st Amendment in 1988: the new age is the age of adulthood."
  universal_franchise: "Universal adult franchise: every citizen aged 18 or above can vote, whatever their religion, caste, sex, wealth or education."
  cag_role: "Each body has its own job: one audits government accounts, one selects civil servants, one runs elections. Lok Adalats settle disputes by agreement. Rights against discrimination are in the Fundamental Rights, starting at Article 14."
  upsc_role: "National Voters' Day marks the founding of the national election body. Officers for the IAS and IPS are selected by the Union's public service commission."
  rti_facts: "Under RTI, information is due within a month; for life or liberty, within two days. Applications go to the officer named for public information."
  rights_bodies: "The Lokpal looks into corruption at the national level. The RTI Act came in the mid-2000s, the same year as the domestic violence law."
  finance_commission: "The Finance Commission is set up every five years to share taxes between the Union and the states."
  independent_watchdogs: "Watchdogs like the CAG check the government. If the government controlled them, they couldn't do that fairly."
  model_code: "The Model Code of Conduct guides parties and governments during campaigns so elections stay fair. It doesn't decide results."
  nhrc_1993: "The National Human Rights Commission was set up under the Protection of Human Rights Act in the early 1990s, soon after the Paris Principles."
  nota: "NOTA means 'None Of The Above': the voter rejects every candidate."
  rti_transparency: "RTI lets citizens see how the government works, so officials have to answer for their decisions."
  ss7_which_body: 'Match the job to the body: one runs elections, one audits spending, one selects officers, one looks into corruption, one into rights.'
  ss7_independent: A referee must not belong to either team. Why should a body that checks the government be free of it?
  ss7_rti_days: The usual time limit for an RTI reply is a month. Life-or-liberty cases are much faster.
  ss7_vote_age: The voting age was lowered by an amendment in 1988. Is it the same age you become an adult?
  ss7_five_yearly: Count on in steps of five years from the start year.
  ss7_ways_in: 'Citizens can take part between elections too: meetings in the ward, checking public works, going to court for others, and a free press.'

concepts:
  - code: ss9.institutions.elections
    title: Elections and the Election Commission
    notes: |
      Democracy works through free and fair elections. India follows universal adult franchise:
      every citizen aged 18 or above can vote (lowered from 21 by the 61st Amendment, 1988). The
      Election Commission of India (Article 324), set up on 25 January 1950 (now National Voters' Day),
      conducts elections to Parliament, State Legislatures, and the President and Vice-President. It
      prepares voters' lists, announces schedules, enforces the Model Code of Conduct, recognises
      parties and allots symbols. Electronic Voting Machines (EVMs) with VVPAT slips are used; NOTA
      (None of the Above) was added in 2013. State Election Commissions run local body elections.
    explanations:
      text: "In an election every adult's vote counts the same, whether rich or poor. To make sure the contest is fair, an independent Election Commission runs it: it decides the dates, keeps the voters' list, and enforces a code of conduct so that the ruling party cannot misuse government power during campaigning."
      visual: "Draw a path: voters' list → nomination → campaign (Model Code of Conduct) → voting on EVM with VVPAT → counting → result."
      step_by_step: "Can a 17-year-old vote in the Lok Sabha election? Step 1: The voting age is 18. Step 2: 17 is below 18. Step 3: No, not until they turn 18."
      real_world: "India's general elections are the largest in the world, with nearly a billion registered voters, all handled by the Election Commission."
    activity:
      type: sort
      prompt: Who conducts this election?
      bins:
      - Election Commission of India
      - State Election Commission
      items:
      - label: Lok Sabha election
        bin: Election Commission of India
        clue: Elects Parliament.
        why: The ECI (Article 324) runs Parliament elections.
      - label: Kerala Legislative Assembly election
        bin: Election Commission of India
        clue: Elects MLAs, not panchayat members.
        why: The ECI runs State Legislature elections too.
      - label: Election of the President
        bin: Election Commission of India
        clue: The highest office.
        why: The ECI conducts it.
      - label: Grama panchayat election
        bin: State Election Commission
        clue: A local body.
        why: Local body elections are run by the State Election Commission.
      - label: Kozhikode Corporation election
        bin: State Election Commission
        clue: A city's local body.
        why: Run by the State Election Commission.
      - label: Election of the Vice-President
        bin: Election Commission of India
        clue: A national office.
        why: The ECI conducts it.
    lesson:
      - teach: 'In a democracy, people choose their government through free and fair elections. India has universal adult franchise: every citizen aged 18 or more can vote, whatever their caste, religion, sex or wealth. The age was lowered from 21 to 18 in 1988.'
        check:
          prompt: Who can vote in India?
          options:
          - Every citizen aged 18 or more
          - Only people who own land
          - Only men over 21
          answer: Every citizen aged 18 or more
          why: Universal adult franchise gives every adult citizen a vote.
      - teach: The Election Commission of India (Article 324), set up on 25 January 1950, runs elections to Parliament, the State Legislatures, and the President and Vice-President. It prepares voters' lists, fixes the schedule, enforces the Model Code of Conduct and gives parties their symbols. State Election Commissions run local body elections.
        picture:
          kind: flow
          steps:
          - Prepare voters' list
          - Announce schedule; Model Code applies
          - Nomination and campaign
          - Voting on EVMs with VVPAT
          - Counting and results
          alt: The main steps of an election run by the Election Commission.
        check:
          prompt: Who runs elections to the Kerala Legislative Assembly?
          options:
          - The Election Commission of India
          - The State Election Commission
          - The Chief Minister
          answer: The Election Commission of India
          why: It conducts elections to Parliament and State Legislatures; the State EC runs local bodies.
      - teach: Voting uses Electronic Voting Machines (EVMs) with VVPAT slips so a voter can see their vote was recorded. Since 2013 there is a NOTA (None of the Above) button. The Commission is independent, so the party in power cannot control elections.
        check:
          prompt: What does a VVPAT slip let the voter do?
          options:
          - See that their vote was recorded correctly
          - Vote twice
          - Choose the counting date
          answer: See that their vote was recorded correctly
          why: VVPAT shows a slip with the chosen symbol.
    items:
      - prompt: "What is the minimum voting age in India?"
        answer: "18"
        check: "18"
        difficulty: 1
        hints: ["It was 21 before 1988."]
        solution: "The voting age is 18."
        mistakes: {"21": voting_age}
      - prompt: "Who conducts elections to the Lok Sabha?"
        options: ["The Election Commission of India", "The State Election Commission", "The Supreme Court", "The Prime Minister"]
        answer: "The Election Commission of India"
        difficulty: 1
        hints: ["An independent constitutional body."]
        solution: "The Election Commission of India conducts Parliament elections."
        mistakes: {"The State Election Commission": eci_role}
      - prompt: "Universal adult franchise means:"
        options: ["Every adult citizen can vote, regardless of caste, religion, sex or wealth", "Only educated people can vote", "Only taxpayers can vote", "Only men can vote"]
        answer: "Every adult citizen can vote, regardless of caste, religion, sex or wealth"
        difficulty: 1
        hints: ["Universal = for all."]
        solution: "All citizens aged 18+ have an equal vote."
        mistakes: {"Only educated people can vote": universal_franchise}
      - prompt: "What is the purpose of the Model Code of Conduct?"
        options: ["To keep elections fair by guiding parties and governments during campaigns", "To decide who wins", "To count votes", "To choose the Prime Minister"]
        answer: "To keep elections fair by guiding parties and governments during campaigns"
        difficulty: 2
        hints: ["It applies once elections are announced."]
        solution: "It stops misuse of power and unfair campaigning."
        mistakes: {"To decide who wins": "model_code", "To count votes": "model_code"}
      - prompt: "NOTA on a voting machine allows a voter to:"
        options: ["Reject all the candidates", "Vote twice", "Choose the Chief Minister", "Skip registering"]
        answer: "Reject all the candidates"
        difficulty: 2
        hints: ["None of the Above."]
        solution: "NOTA records that the voter rejects every candidate."
        mistakes: {"Vote twice": "nota", "Choose the Chief Minister": "nota"}
      - prompt: "National Voters' Day (25 January) marks the founding of which body?"
        options: ["The Election Commission of India", "The Supreme Court", "The Planning Commission", "The UPSC"]
        answer: "The Election Commission of India"
        difficulty: 3
        hints: ["Set up on 25 January 1950."]
        solution: "The Election Commission was formed on 25 January 1950."
        mistakes: {"The UPSC": upsc_role}
      - prompt: "During an election campaign, a candidate is found giving money to voters. Which body acts against this?"
        options: ["The Election Commission", "The Comptroller and Auditor General", "The UPSC", "The Finance Commission"]
        answer: "The Election Commission"
        difficulty: 2
        hints: ["Which body supervises elections?", "It enforces the Model Code of Conduct."]
        solution: "Step 1: Bribing voters is a corrupt practice in elections. Step 2: The Election Commission supervises elections and can act against it."
        mistakes: {"The Comptroller and Auditor General": eci_role, "The UPSC": eci_role, "The Finance Commission": eci_role}
      - prompt: "Why is the Election Commission an independent constitutional body instead of a government department?"
        options: ["So the party in power cannot control elections", "So it can make laws", "So it can collect taxes", "So it can choose the Prime Minister"]
        answer: "So the party in power cannot control elections"
        difficulty: 3
        hints: ["Who competes in elections?", "Could the referee be one of the players?"]
        solution: "Step 1: The ruling party is also a contestant. Step 2: An independent commission keeps elections free and fair for all parties."
        mistakes: {"So it can make laws": free_hand, "So it can collect taxes": free_hand, "So it can choose the Prime Minister": free_hand}
      - prompt: Which Article of the Constitution sets up the Election Commission?
        options:
        - Article 324
        - Article 15
        - Article 148
        - Article 280
        answer: Article 324
        difficulty: 2
        hints:
        - Article 148 is for the CAG and 280 for the Finance Commission.
        - Article 15 is about non-discrimination.
        solution: 'Step 1: 148: CAG; 280: Finance Commission; 15: equality. Step 2: The Election Commission is under a different article. Step 3: Article 324.'
        mistakes:
          Article 148: ss7_which_body
      - prompt: Which amendment lowered the voting age from 21 to 18?
        options:
        - 61st Amendment (1988)
        - 73rd Amendment (1992)
        - 42nd Amendment (1976)
        - 74th Amendment (1992)
        answer: 61st Amendment (1988)
        difficulty: 3
        hints:
        - It was in the late 1980s.
        - The 73rd and 74th were about local bodies.
        solution: 'Step 1: The 73rd and 74th were for local government. Step 2: The 42nd was in 1976. Step 3: The 61st Amendment of 1988 lowered the age.'
        mistakes:
          73rd Amendment (1992): ss7_vote_age
      - prompt: Which bodies hold elections to panchayats and municipalities?
        options:
        - State Election Commissions
        - The Election Commission of India
        - The Supreme Court
        - The CAG
        answer: State Election Commissions
        difficulty: 2
        hints:
        - Local bodies have their own election authority.
        - It works at the state level.
        solution: 'Step 1: The ECI runs national and state elections. Step 2: Local bodies are run by a separate body. Step 3: The State Election Commission.'
        mistakes:
          The Election Commission of India: ss7_which_body
      - prompt: National Voters' Day is celebrated on 25 January. In which year was the Election Commission set up on that day?
        answer: '1950'
        check: '1950'
        difficulty: 2
        hints:
        - It was the day before the Constitution came into force.
        - The Constitution came into force on 26 January of that year.
        solution: 'Step 1: The Constitution came into force on 26 January 1950. Step 2: The EC was set up one day earlier. Step 3: 25 January 1950.'
        mistakes:
          '1947': ss7_independent
      - prompt: What does the Model Code of Conduct do?
        options:
        - Guides parties and governments to keep campaigns fair
        - Lists who can vote
        - Counts the votes
        - Sets the voting age
        answer: Guides parties and governments to keep campaigns fair
        difficulty: 1
        hints:
        - It applies once the election dates are announced.
        - It is about behaviour during the campaign.
        solution: 'Step 1: It begins when elections are announced. Step 2: It sets rules for parties and the government in power. Step 3: It keeps the campaign fair.'
        mistakes:
          Counts the votes: ss7_which_body
      - prompt: A constituency has 1,50,000 voters and 1,20,000 of them vote. What is the voter turnout, as a percentage?
        answer: '80'
        check: 120000/150000*100
        difficulty: 2
        hints:
        - Turnout = voters who voted ÷ all voters.
        - Multiply by 100 for a percentage.
        solution: 'Step 1: 1,20,000 ÷ 1,50,000 = 0.8. Step 2: × 100. Step 3: 80%.'
        mistakes:
          '0.8': ss7_independent
      - prompt: Why is the secret ballot important?
        options:
        - Voters can choose freely without fear or pressure
        - It makes counting faster
        - It lets candidates see who voted for them
        - It stops people from voting
        answer: Voters can choose freely without fear or pressure
        difficulty: 2
        hints:
        - Imagine others could see your vote.
        - Would anyone pressure you?
        solution: 'Step 1: If votes were public, people could be threatened or bribed. Step 2: Secrecy protects voters. Step 3: They can choose freely.'
        mistakes:
          It lets candidates see who voted for them: ss7_independent

  - code: ss9.institutions.watchdogs
    title: Institutions that keep government accountable
    after: [ss9.institutions.elections]
    notes: |
      Besides elections, democracy is strengthened by independent institutions. The Comptroller and
      Auditor General (CAG, Article 148) audits government spending and reports to Parliament and
      the Legislatures. The Union Public Service Commission (Article 315) and State PSCs select civil
      servants on merit. The Finance Commission (Article 280) is set up every five years to recommend
      how taxes are shared between the Union and States. The National Human Rights Commission (1993)
      and State commissions look into rights violations. The Lokpal (Act of 2013) and Lokayuktas
      investigate corruption by public servants.
    explanations:
      text: "Voting once every five years is not enough. Between elections, independent bodies keep watch: the CAG checks how public money is spent, the Public Service Commissions make sure jobs go by merit, and human rights commissions and the Lokpal hear complaints against those in power."
      visual: "Draw a government building in the middle with watchdogs around it, each with a label: CAG (money), PSC (jobs), NHRC (rights), Lokpal (corruption)."
      step_by_step: "A report shows money for a road was spent without the road being built. Which body would find this? Step 1: It is about checking government accounts. Step 2: Auditing is done by the CAG. Step 3: So the CAG's audit report would show it."
      real_world: "The Kerala Public Service Commission conducts tests for thousands of State government jobs every year, on merit."
    activity:
      type: sort
      prompt: Which institution does this job?
      bins:
      - CAG
      - UPSC
      - Finance Commission
      - Human Rights Commission
      - Lokpal
      items:
      - label: Audits how government spends money
        bin: CAG
        clue: Article 148; reports to Parliament.
        why: The Comptroller and Auditor General audits spending.
      - label: Selects civil servants on merit
        bin: UPSC
        clue: Article 315; exams and interviews.
        why: The Union Public Service Commission selects officers.
      - label: Recommends how taxes are shared with states
        bin: Finance Commission
        clue: Article 280; set up every five years.
        why: The Finance Commission advises on sharing taxes.
      - label: Looks into police torture of a prisoner
        bin: Human Rights Commission
        clue: Set up in 1993 to protect dignity.
        why: The NHRC looks into rights violations.
      - label: Investigates a corrupt minister
        bin: Lokpal
        clue: Act of 2013, against corruption.
        why: The Lokpal investigates corruption by public servants.
      - label: Checks if a road project wasted money
        bin: CAG
        clue: An audit of spending.
        why: The CAG audits it.
    lesson:
      - teach: Elections are not enough. Independent institutions keep watch on the government between elections. The Comptroller and Auditor General (CAG, Article 148) checks how public money is spent and reports to Parliament and the Legislatures.
        check:
          prompt: What does the CAG do?
          options:
          - Audits government spending
          - Runs elections
          - Selects IAS officers
          answer: Audits government spending
          why: The CAG checks the accounts and reports to the legislature.
      - teach: The UPSC (Article 315) and State PSCs choose civil servants by exams, on merit. The Finance Commission (Article 280), set up every five years, recommends how tax money is shared between the Union and States.
        picture:
          kind: compare
          columns:
          - title: CAG
            points:
            - audits spending
            - Article 148
          - title: UPSC / PSCs
            points:
            - select officers on merit
            - Article 315
          - title: Finance Commission
            points:
            - shares taxes Union–States
            - every 5 years, Article 280
          alt: Three constitutional bodies and their jobs.
        check:
          prompt: Which body recommends how taxes are shared between the Union and States?
          options:
          - Finance Commission
          - UPSC
          - Election Commission
          answer: Finance Commission
          why: It divides tax revenue between the two levels.
      - teach: The National Human Rights Commission (1993) looks into violations of human rights. The Lokpal (2013) at the national level and Lokayuktas in the states investigate corruption by public servants. These bodies must be independent to check the government without fear.
        check:
          prompt: Which body investigates corruption at the national level?
          options:
          - Lokpal
          - NHRC
          - Finance Commission
          answer: Lokpal
          why: Lokpal handles corruption complaints against public servants.
    items:
      - prompt: "Which body audits the accounts of the government?"
        options: ["The Comptroller and Auditor General", "The Election Commission", "The UPSC", "The NHRC"]
        answer: "The Comptroller and Auditor General"
        difficulty: 1
        hints: ["CAG."]
        solution: "The CAG audits public accounts."
        mistakes: {"The UPSC": cag_role}
      - prompt: "Which body selects officers for the IAS and IPS?"
        options: ["Union Public Service Commission", "Comptroller and Auditor General", "Finance Commission", "Lokpal"]
        answer: "Union Public Service Commission"
        difficulty: 1
        hints: ["UPSC."]
        solution: "The UPSC conducts the civil services exams."
        mistakes: {"Comptroller and Auditor General": upsc_role}
      - prompt: "The National Human Rights Commission was set up in which year?"
        answer: "1993"
        check: "1993"
        difficulty: 2
        hints: ["Early 1990s."]
        solution: "The NHRC was set up in 1993."
        mistakes: {"2005": "nhrc_1993", "1950": "nhrc_1993"}
      - prompt: "Which body investigates complaints of corruption against public servants at the national level?"
        options: ["Lokpal", "Finance Commission", "Election Commission", "Grama sabha"]
        answer: "Lokpal"
        difficulty: 2
        hints: ["States have Lokayuktas."]
        solution: "The Lokpal deals with corruption complaints."
        mistakes: {"Finance Commission": k9_lokpal}
      - prompt: "The Finance Commission is set up every how many years?"
        answer: "5"
        check: "5"
        difficulty: 2
        hints: ["Same as the term of the Lok Sabha."]
        solution: "Every five years."
        mistakes: {"1": "finance_commission", "10": "finance_commission"}
      - prompt: "Why must institutions like the CAG and Election Commission be independent of the government?"
        options: ["So they can check the government without fear or favour", "So they can make laws", "So they can run the army", "So they can avoid work"]
        answer: "So they can check the government without fear or favour"
        difficulty: 3
        hints: ["Who watches the watchers?"]
        solution: "Independence lets them hold the government accountable."

        mistakes: {"So they can make laws": "independent_watchdogs", "So they can avoid work": "independent_watchdogs"}
      - prompt: "A CAG report shows that money for a road was spent but the road was never built. Where is this report discussed?"
        options: ["In Parliament or the State Legislature", "In the Election Commission", "In the UPSC", "Only in the newspapers"]
        answer: "In Parliament or the State Legislature"
        difficulty: 3
        hints: ["The CAG works for the people's representatives.", "Its reports are laid before the House."]
        solution: "Step 1: The CAG audits government accounts. Step 2: Its reports go to Parliament or the State Legislature, where committees question the government."
        mistakes: {"In the Election Commission": audit_to_house, "In the UPSC": audit_to_house, "Only in the newspapers": audit_to_house}
      - prompt: "A Finance Commission's recommendations covered the five years starting in 2021. In which year does the next five-year period begin?"
        answer: "2026"
        check: "2021+5"
        difficulty: 2
        hints: ["Each Finance Commission covers 5 years.", "2021 + 5."]
        solution: "Step 1: 2021 to 2025 is five years. Step 2: The next period begins in 2026."
        mistakes: {"2025": next_commission, "2031": finance_commission}
      - prompt: Which Article of the Constitution provides for the CAG?
        options:
        - Article 148
        - Article 324
        - Article 315
        - Article 280
        answer: Article 148
        difficulty: 2
        hints:
        - 324 is the Election Commission.
        - 315 is the UPSC and 280 the Finance Commission.
        solution: 'Step 1: 324: EC. 315: UPSC. 280: Finance Commission. Step 2: The CAG is the remaining one. Step 3: Article 148.'
        mistakes:
          Article 324: ss7_which_body
      - prompt: 'In the states, corruption by public servants is investigated by:'
        options:
        - Lokayuktas
        - The UPSC
        - The Finance Commission
        - Gram sabhas
        answer: Lokayuktas
        difficulty: 1
        hints:
        - The Lokpal works at the national level.
        - The state-level body has a similar name.
        solution: 'Step 1: Lokpal is national. Step 2: Each state has its own anti-corruption body. Step 3: The Lokayukta.'
        mistakes:
          The UPSC: ss7_which_body
      - prompt: The Lokpal Act was passed in 2013. How many years after the NHRC was set up in 1993 was that?
        answer: '20'
        check: 2013-1993
        difficulty: 1
        hints:
        - Both are CE years.
        - Subtract 1993 from 2013.
        solution: 'Step 1: 2013 − 1993. Step 2: = 20. Step 3: 20 years.'
        mistakes:
          '4006': ss7_five_yearly
      - prompt: A Finance Commission is set up in 2020. If one is set up every five years, when is the next?
        answer: '2025'
        check: 2020+5
        difficulty: 1
        hints:
        - Add the gap to the year.
        - The gap is five years.
        solution: 'Step 1: 2020. Step 2: + 5 years. Step 3: 2025.'
        mistakes:
          '2030': ss7_five_yearly
      - prompt: Police in a district are accused of beating people in custody. Which body can look into this at the national level?
        options:
        - National Human Rights Commission
        - Finance Commission
        - UPSC
        - CAG
        answer: National Human Rights Commission
        difficulty: 2
        hints:
        - This is about people's rights being violated.
        - Which body protects rights?
        solution: 'Step 1: Custodial violence violates human rights. Step 2: The NHRC investigates such cases. Step 3: National Human Rights Commission.'
        mistakes:
          CAG: ss7_which_body
      - prompt: Why are civil servants selected by the UPSC through exams?
        options:
        - So officers are chosen on merit, not favour
        - So ministers can pick friends
        - To audit accounts
        - To run elections
        answer: So officers are chosen on merit, not favour
        difficulty: 2
        hints:
        - Exams test ability.
        - What does that prevent?
        solution: 'Step 1: Open exams test everyone equally. Step 2: This prevents favouritism. Step 3: Officers are chosen on merit.'
        mistakes:
          So ministers can pick friends: ss7_independent
      - prompt: Why does the CAG report to Parliament rather than to the ministers?
        options:
        - Parliament can question the government about wasteful spending
        - Ministers cannot read reports
        - Parliament spends the money itself
        - It is a rule of the Sultanate
        answer: Parliament can question the government about wasteful spending
        difficulty: 3
        hints:
        - The CAG checks the government's spending.
        - Who holds the government to account?
        solution: 'Step 1: The CAG audits the executive. Step 2: Reporting to the executive would let it hide mistakes. Step 3: Parliament can question and hold it accountable.'
        mistakes:
          Parliament spends the money itself: ss7_independent
  - code: ss9.institutions.rti
    title: Right to Information and citizens' participation
    after: [ss9.institutions.watchdogs]
    notes: |
      The Right to Information Act, 2005 lets any citizen ask a public authority for information.
      Each office has a Public Information Officer; information must be given within 30 days (48
      hours if it concerns life or liberty). Information Commissions hear appeals. RTI makes
      government transparent and accountable and helps fight corruption. Other ways citizens take
      part: grama sabhas, social audits, Lok Adalats for quick settlement of cases, public interest
      litigation, a free press and peaceful protest.
    explanations:
      text: "Suppose your panchayat says it repaired the school road but nothing changed. Under RTI you can write to the office and ask how much was spent and on what. They must reply within 30 days. When people can see what the government does, officials are more careful."
      visual: "Draw a citizen handing an application to a Public Information Officer, a calendar showing '30 days', and a reply coming back."
      step_by_step: "An RTI application is filed on 1 June. By when must the reply come? Step 1: The limit is 30 days. Step 2: June has 30 days. Step 3: By about 1 July."
      real_world: "The RTI movement grew from the Mazdoor Kisan Shakti Sangathan's campaigns in Rajasthan, where villagers checked public works records."
    activity:
      type: number_line
      min: 0
      max: 40
      step: 1
      start: 0
      prompt: 'Right to Information Act, 2005: mark the deadline in days.'
      goals:
      - prompt: 'Normal request: the office must reply within how many days?'
        target: 30
        mistakes:
        - when:
            v: 2
          say: That's for life or liberty cases. A normal request has a longer limit. How many days does the Act give for an ordinary request?
      - prompt: 'Life or liberty is at risk: reply within 48 hours. How many days is that?'
        target: 2
        mistakes:
        - when:
            v: 30
          say: 30 days is for a normal request. When life or liberty is at risk it is 48 hours.
        - when:
            v: 1
          say: A day is 24 hours. 48 hours is two days.
