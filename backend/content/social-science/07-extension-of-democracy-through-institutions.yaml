    lesson:
      - teach: 'The Right to Information Act, 2005, lets any citizen ask a government office for information: how money was spent, why a decision was taken, the status of an application.'
        check:
          prompt: Who can ask for information under RTI?
          options:
          - Any citizen
          - Only MPs
          - Only journalists
          answer: Any citizen
          why: RTI is a right of every citizen.
      - teach: Each office has a Public Information Officer (PIO). The reply must come within 30 days, or within 48 hours if a person's life or liberty is at stake. If the reply doesn't come, you can appeal, and then go to the Information Commission.
        picture:
          kind: flow
          steps:
          - Write to the PIO
          - Reply within 30 days (48 hours for life or liberty)
          - 'No reply or unfair reply: first appeal'
          - 'Then: Information Commission'
          alt: How an RTI request and appeal work.
        check:
          prompt: Within how many days must an RTI reply normally come?
          options:
          - '30'
          - '7'
          - '365'
          answer: '30'
          why: The usual limit is 30 days.
      - teach: RTI makes government transparent and accountable and helps fight corruption. Citizens also take part through grama sabhas, social audits of public works, Lok Adalats that settle disputes by agreement, public interest litigation, a free press and peaceful protest.
        check:
          prompt: What is a social audit?
          options:
          - People checking whether public works were done as claimed
          - A tax on social media
          - A court trial
          answer: People checking whether public works were done as claimed
          why: Residents verify spending against what they can see on the ground.
