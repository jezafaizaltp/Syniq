# Class 9 Social Science II, chapter 4 (stored as Social Science chapter 12). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 1 text supplied by the school.
subject: ss
chapter: 12
title: Human Resources for National Development

tips:
  profit_left: "Profit is what the organiser keeps after paying every other factor and the cost of materials. Subtract all of them from the sales."
  natural_not_capital: "Capital is something made by people to help produce more. Which choice is a gift of nature?"
  workforce_count: "Start from everyone, remove those below 15, then remove those not willing or able to work."
  investment_return: "An investment is spent now to earn more later. What does education add to a person's future work?"
  off_season: "Seasonal unemployment comes from having work only part of the year. What could give work in the other months?"
  poverty_blocks: "Building human capital needs food, health care and schooling. Can a poor family afford these?"
  k9_hc_info: "The course exists, but the family never heard of it. What is missing: the training, or knowing about it?"
  k9_hc_training: "The nurses learned a new skill on the job. Which of the five factors is learning at work?"
  k9_hc_health: "Which choice makes people better able to work and learn? Barter is a way of trading, not something that builds people's abilities."
  k9_quality: "A large population is not useful unless people are healthy, educated and skilled. Is that about how many, or how good?"
  k9_pop_first: "In 2023 the UN reported that one Asian country passed China in population. Which country is it?"
  k9_productivity: "The word is built from 'produce' + '-ive' + '-ity': the ability to produce."
  k9_capital_reward: "Capital is often borrowed money or machines bought with it. What do you pay a lender for the use of money?"
  k9_tractor_factor: "A tractor is made by people and used to produce more. It isn't nature, and it isn't human effort."
  k9_land_factor: "Soil and water are gifts of nature, not made by people. Which factor covers all natural resources?"
  factors_production: "Natural resources are land; human effort is labour; things made by people to help produce, like machines, are capital; the person who brings them all together and takes the risk is the entrepreneur."
  factor_rewards: "Each factor gets its own payment: land earns rent, capital earns interest, the organiser earns profit, and the human effort of workers earns another. For costs, add up every payment."
  barter: "Barter is exchanging goods for goods. Its problems include difficulty in fixing the price of goods and needing someone who wants exactly what you have."
  money_evolution: "Money changed over time: goods for goods, then metals, then coins, then paper, and most recently money that exists only on computers and cards."
  human_resource: "Human resources are people as workers. Productivity is how much one worker or factor can produce. India passed China in population in 2023. Education and training can raise productivity, which is why this resource is called dynamic."
  labour_force: "The PLFS counts people from the age when compulsory schooling ends (about mid-teens) who are willing and able to work. Subtract the younger people first, then apply the share asked. A country's quality of people matters more than its numbers."
  human_capital: "When education and training raise people's economic value, they become a kind of capital. Technoparks and Infoparks drive an economy based on knowledge."
  hc_factors: "The textbook names five factors that build human capital: education, health, migration, job training and access to information. Match the example to the one it shows."
  health: "The WHO defines health as well-being of body, mind and social life together. Poor health lowers how much people can produce. Government-run health centres are in the public sector."
  migration: "People moving from one region to another, for work or study, for a time or for good, is called by the word for birds' seasonal journeys too."
  poverty_cycle: "Follow the circle: too little money → poor food, schooling and health → less ability to work → too little money again. Breaking it means improving people themselves."
  unemployment_types: "Open: willing to work but no job. Structural: job loss from new technology. Seasonal: work only in one season. Disguised: more workers than needed, with no change in total output."

concepts:
  - code: ss9.hr.factors
    title: Factors of production and money
    notes: |
      Factors of production (economic resources): land, labour, capital, entrepreneurship. Land: all natural
      resources such as soil and water. Labour: all intellectual or physical efforts done by people for reward.
      Capital: all man-made resources that aid production (machines, equipment). Entrepreneurship/organisation:
      combining land, labour and capital appropriately. Rewards: land rent, labour wages, capital interest,
      entrepreneurship profit. Example: paddy cultivation under the Padashekhara Samrakshana Koottayma.
      Barter system: goods exchanged for goods; drawbacks include difficulty in determining prices.
      Evolution of money: barter products (animal skins, agricultural products, cattle), gold and metals,
      metal coins, paper money, plastic cards, electronic money. Once money became the common medium, all
      factors could be paid in cash. Labour is the most important factor; wages are the income of most people.
    explanations:
      text: "Every product needs land, labour, capital and someone to organise them. Each gets a reward: rent, wages, interest and profit. Before money, people bartered goods for goods, which was hard, so money slowly developed from cattle and grain to coins, notes, cards and digital payments."
      visual: "A paddy field: the field and water are land, the farm workers are labour, the tractor and pump are capital, and the Padashekhara group that plans it all is entrepreneurship."
      step_by_step: "To name a factor: Step 1: is it from nature (soil, water)? Land. Step 2: is it human effort for pay? Labour. Step 3: is it a man-made tool or machine? Capital. Step 4: is it the planning that brings them together? Entrepreneurship."
      real_world: "Paying for vegetables with UPI on a phone is electronic money, the newest stage in the long history that began with barter."
    activity:
      type: sort
      prompt: Which factor of production?
      bins:
      - Land
      - Labour
      - Capital
      - Entrepreneurship
      items:
      - label: The paddy field
        bin: Land
        clue: A natural resource.
        why: Land.
      - label: Rent
        bin: Land
        clue: The reward paid for using a field.
        why: Rent is the reward for land.
      - label: Workers planting seedlings
        bin: Labour
        clue: Human effort for reward.
        why: Labour.
      - label: Wages
        bin: Labour
        clue: Paid for effort.
        why: Wages are the reward for labour.
      - label: A tractor
        bin: Capital
        clue: Man-made, helps production.
        why: Capital.
      - label: Interest
        bin: Capital
        clue: Earned by lending money for machines.
        why: Interest is the reward for capital.
      - label: The Padashekhara committee that organises it all
        bin: Entrepreneurship
        clue: Combines land, labour and capital.
        why: Entrepreneurship.
      - label: Profit
        bin: Entrepreneurship
        clue: Earned by the one who takes the risk.
        why: Profit is the reward for organisation.
    items:
      - prompt: "Soil and water used in paddy cultivation belong to which factor of production?"
        options: ["Land", "Labour", "Capital", "Entrepreneurship"]
        answer: "Land"
        difficulty: 1
        hints: ["All natural resources are part of the Earth."]
        solution: "Land includes all natural resources such as soil and water."
        mistakes: {"Capital": k9_land_factor}
      - prompt: "A tractor used on a farm is an example of"
        options: ["Capital", "Land", "Labour", "Rent"]
        answer: "Capital"
        difficulty: 1
        hints: ["It is man-made and helps production."]
        solution: "All man-made resources that aid production are capital."
        mistakes: {"Land": k9_tractor_factor, "Labour": k9_tractor_factor}
      - prompt: "The reward for labour is"
        options: ["Wages", "Rent", "Interest", "Profit"]
        answer: "Wages"
        difficulty: 1
        hints: ["Workers are paid this."]
        solution: "Labour gets wages; land rent; capital interest; entrepreneurship profit."
        mistakes: {"Profit": factor_rewards, "Rent": factor_rewards}
      - prompt: "The reward for capital is"
        options: ["Interest", "Wages", "Rent", "Profit"]
        answer: "Interest"
        difficulty: 1
        hints: ["Think of money lent to a bank."]
        solution: "Capital earns interest."
        mistakes: {"Profit": k9_capital_reward}
      - prompt: "Exchanging goods for goods without money is called"
        options: ["Barter system", "Market system", "Credit system", "Electronic money"]
        answer: "Barter system"
        difficulty: 1
        hints: ["It was used before money existed."]
        solution: "The barter system."
        mistakes: {"Market system": barter}
      - prompt: "Which is a drawback of the barter system?"
        options: ["Difficulty in determining the price of goods", "Goods cannot be produced", "Wages are too high", "Too many banks"]
        answer: "Difficulty in determining the price of goods"
        difficulty: 2
        hints: ["How many coconuts is one goat worth?"]
        solution: "Without a common measure, it is hard to fix prices; you also need someone who wants exactly what you offer."
        mistakes: {"Goods cannot be produced": barter}
      - prompt: "Which came last in the evolution of money?"
        options: ["Electronic money", "Metal coins", "Paper money", "Gold"]
        answer: "Electronic money"
        difficulty: 2
        hints: ["Think of today's technology."]
        solution: "Barter products, gold and metals, metal coins, paper money, plastic cards, electronic money."
        mistakes: {"Paper money": money_evolution, "Metal coins": money_evolution}
      - prompt: "Which factor of production combines land, labour and capital to make production possible?"
        options: ["Entrepreneurship", "Labour", "Capital", "Land"]
        answer: "Entrepreneurship"
        difficulty: 2
        hints: ["It is also called organisation."]
        solution: "Entrepreneurship (organisation), rewarded with profit."
        mistakes: {"Labour": factors_production}
      - prompt: "Which factor of production is the most important, since its reward is the income of most people?"
        options: ["Labour", "Land", "Capital", "Entrepreneurship"]
        answer: "Labour"
        difficulty: 2
        hints: ["Most people earn wages."]
        solution: "Labour; wages earned for labour are the income source of most people."
        mistakes: {"Capital": factor_rewards}
      - prompt: "A farmer rents land for ₹20,000, pays workers ₹50,000 in wages and ₹5,000 interest on a loan. How many rupees in total go to land, labour and capital together?"
        answer: "75000"
        check: "20000 + 50000 + 5000"
        difficulty: 3
        hints: ["Add rent, wages and interest."]
        solution: "20,000 + 50,000 + 5,000 = ₹75,000. Whatever is left from sales after this is the farmer's profit."
        mistakes: {"70000": factor_rewards}
      - prompt: "A shop takes ₹3,00,000 in sales in a year. It pays ₹40,000 rent, ₹1,20,000 wages, ₹20,000 interest and ₹70,000 for goods bought. How many rupees of profit are left?"
        answer: "50000"
        check: "300000 - 40000 - 120000 - 20000 - 70000"
        difficulty: 3
        hints: ["Add up all the payments first.", "Profit = sales − all payments."]
        solution: "Step 1: Payments = 40,000 + 1,20,000 + 20,000 + 70,000 = 2,50,000. Step 2: Profit = 3,00,000 − 2,50,000 = ₹50,000."
        mistakes: {"250000": profit_left, "120000": profit_left, "180000": profit_left}
      - prompt: "Which of these is NOT capital?"
        options: ["A river used for irrigation", "A tractor", "A factory building", "A computer in an office"]
        answer: "A river used for irrigation"
        difficulty: 2
        hints: ["Capital is made by people to help production.", "Which one is a natural resource?"]
        solution: "Step 1: Tractors, buildings and computers are made by people: capital. Step 2: A river is a natural resource, so it belongs to land."
        mistakes: {"A tractor": natural_not_capital, "A factory building": natural_not_capital, "A computer in an office": natural_not_capital}

  - code: ss9.hr.human_resources
    title: Human resources, productivity and labour force
    after: [ss9.hr.factors]
    notes: |
      Human resources: people who can work and can be used in production; they convert natural resources into
      products using physical power and intelligence with other factors. Productivity is the ability of each
      factor of production to produce goods and services; it decides the quality of human resources. Main
      factors influencing human resources: size, composition and skills of the population. India ranks first
      in world population. Population pyramid 2011 (National Health Profile 2022) shows age groups by sex.
      It is not the size but the quality of the population that determines human resources. PLFS report
      (Government of India, February 2023): labour force is the population aged 15 and above who are willing
      and able to work; a large labour force positively influences income and growth. Human resource is the
      dynamic factor of production; it becomes more efficient through education, training and healthcare.
    explanations:
      text: "Human resources are the people who can work. What matters most is how productive they are, which depends on their skills, health and education. The labour force is everyone aged 15 or more who is willing and able to work."
      visual: "A population pyramid: bars for each age group, males on one side and females on the other. The wide middle bars (15 to 59) show the working-age people."
      step_by_step: "Is a person in the labour force? Step 1: are they 15 or older? Step 2: are they willing to work? Step 3: are they able to work? All three yes means they are in the labour force."
      real_world: "A farmer using a power tiller ploughs much more land in a day than one using a hand plough: same person, higher productivity."
    activity:
      type: sort
      prompt: In the labour force or not? (15 and above, willing and able to work)
      bins:
      - In the labour force
      - Not in the labour force
      items:
      - label: A 30-year-old looking for work
        bin: In the labour force
        clue: Willing and able, even without a job yet.
        why: Job-seekers count in the labour force.
      - label: A 45-year-old nurse
        bin: In the labour force
        clue: Aged 15+, working.
        why: Workers are in the labour force.
      - label: A 17-year-old working in a shop
        bin: In the labour force
        clue: 'Check the age limit: 15 and above.'
        why: 17 is over 15, so they count.
      - label: A 12-year-old student
        bin: Not in the labour force
        clue: Check the age limit.
        why: Below 15, not counted.
      - label: A 70-year-old who has retired and doesn't want work
        bin: Not in the labour force
        clue: Are they willing to work?
        why: Not willing, so not counted.
      - label: A 20-year-old full-time student not seeking work
        bin: Not in the labour force
        clue: Old enough, but are they seeking work?
        why: Not seeking work, so not in the labour force.
    items:
      - prompt: "The term 'human resources' means"
        options: ["People who can work and be used in production", "All machines in a factory", "Natural resources like water", "Money in banks"]
        answer: "People who can work and be used in production"
        difficulty: 1
        hints: ["Human means people."]
        solution: "Human resources are people who can work and be used in the production process."
        mistakes: {"All machines in a factory": human_resource}
      - prompt: "The ability of a factor of production to produce goods and services is called"
        options: ["Productivity", "Population", "Migration", "Barter"]
        answer: "Productivity"
        difficulty: 1
        hints: ["It decides the quality of human resources."]
        solution: "Productivity."
        mistakes: {"Population": k9_productivity}
      - prompt: "According to the PLFS report of February 2023, the labour force includes people of what minimum age?"
        answer: "15"
        check: "15"
        difficulty: 1
        hints: ["It is the age when most students finish Class 9 or 10."]
        solution: "Population aged 15 years and above who are willing and able to work."
        mistakes: {"18": labour_force, "14": labour_force}
      - prompt: "Which country ranks first in world population?"
        options: ["India", "China", "USA", "Indonesia"]
        answer: "India"
        difficulty: 1
        hints: ["The textbook says statistics show this."]
        solution: "India ranks first in world population."
        mistakes: {"China": k9_pop_first}
      - prompt: "What determines the human resources of a country more: the size of the population or its quality?"
        options: ["Its quality", "Its size", "Neither", "Only the number of children"]
        answer: "Its quality"
        difficulty: 2
        hints: ["A large but unskilled population is less productive."]
        solution: "It is not the size but the quality of the population that determines human resources."
        mistakes: {"Its size": k9_quality}
      - prompt: "Which of these is NOT one of the main factors influencing human resources named in the textbook?"
        options: ["Colour of the national flag", "Size of the population", "Composition of the population", "Skills of the population"]
        answer: "Colour of the national flag"
        difficulty: 2
        hints: ["Size, composition and skills."]
        solution: "The main factors are size, composition and skills of the population."
        mistakes: {"Composition of the population": human_resource}
      - prompt: "A 16-year-old who is healthy and willing to work is part of the labour force. A 12-year-old is not. Why?"
        options: ["The labour force starts at age 15", "Only adults over 21 can work", "Children are not part of the population", "Willingness does not matter"]
        answer: "The labour force starts at age 15"
        difficulty: 2
        hints: ["Check the PLFS definition."]
        solution: "The labour force is people aged 15 and above who are willing and able to work."
        mistakes: {"Only adults over 21 can work": labour_force}
      - prompt: "Why is human resource called the 'dynamic' factor of production?"
        options: ["Its productivity can be increased by education, training and healthcare", "It never changes", "It is a natural resource", "It earns interest"]
        answer: "Its productivity can be increased by education, training and healthcare"
        difficulty: 2
        hints: ["Dynamic means able to change and grow."]
        solution: "People can become more efficient through education, proper training and healthcare."
        mistakes: {"It never changes": human_resource}
      - prompt: "A village has 1,000 people. 300 are below 15 years. Of those aged 15 and above, 100 are not willing or not able to work. How many people are in the labour force?"
        answer: "600"
        check: "1000 - 300 - 100"
        difficulty: 3
        hints: ["First remove those below 15, then those not willing or able."]
        solution: "1,000 − 300 = 700 aged 15+; 700 − 100 = 600 in the labour force."
        mistakes: {"700": labour_force}
      - prompt: "One worker harvests 2 acres a day by hand. With a harvesting machine she harvests 10 acres a day. By how many times did her productivity increase?"
        answer: "5"
        check: "10/2"
        difficulty: 3
        hints: ["Divide the new output by the old output."]
        solution: "10 ÷ 2 = 5 times."
        mistakes: {"8": human_resource}
      - prompt: "Country A has 10 crore people, most of them unschooled and in poor health. Country B has 5 crore healthy, educated and skilled people. Which has the stronger human resources?"
        options: ["Country B", "Country A", "Both are equal", "You can only tell from land area"]
        answer: "Country B"
        difficulty: 2
        hints: ["Is it the number of people that matters most, or what they can do?", "Health, education and skills raise productivity."]
        solution: "Step 1: Human resources depend more on quality than size. Step 2: Country B's healthy, skilled people can produce far more per person."
        mistakes: {"Country A": k9_quality, "Both are equal": k9_quality, "You can only tell from land area": k9_quality}
      - prompt: "A village has 1,200 people. 360 are below 15 years. Of the rest, 140 are not willing or not able to work. How many are in the labour force?"
        answer: "700"
        check: "1200 - 360 - 140"
        difficulty: 3
        hints: ["The labour force starts at age 15.", "Only those willing and able to work count."]
        solution: "Step 1: Aged 15 and above: 1,200 − 360 = 840. Step 2: Willing and able: 840 − 140 = 700."
        mistakes: {"840": workforce_count, "1060": workforce_count, "500": workforce_count}

  - code: ss9.hr.capital_formation
    title: Human capital formation
    after: [ss9.hr.human_resources]
    notes: |
      Human capital: the economic value of human resources; people become human capital through education and
      job training. Human capital formation: additions over time to the stock of human capital. Examples:
      farmers, teachers, scientists. Ways to strengthen it: better health facilities, large-scale investment in
      education, skill development, employee-friendly work environment. Factors influencing human capital
      formation: education, health, migration, job training, access to information.
      Education: helps use modern technology, get better jobs, earn more, build a society with values; chain
      education → increase in ability → technological knowledge → skill development → better job → better
      income → better quality of life → national development. Needs investment in public, cooperative and
      private sectors. Knowledge Economy: uses intelligence, innovative ideas and IT; Technopark and Infopark.
      Health: WHO defines health as physical, mental and social well-being. Poor health decreases productivity,
      keeps people from work, slows production. Measures: immunity, hygiene, nutritious food, medical
      facilities, recreation. Public system: health sub-centres, primary health centres, community health
      centres, taluk hospitals, district hospitals, medical colleges; also Ayurveda, Yoga, Naturopathy, Unani,
      Homeopathy. Kerala is a model for healthcare. Migration: permanent or temporary movement of people from
      one region to another; government must meet the basic needs of migrants. Job training: increases
      productivity (doctors, engineers, teachers). Access to information about education, health and job
      services, ensured by government.
    explanations:
      text: "People become more valuable to the economy (human capital) when they get education, good health, job training, the chance to move for work, and information about services. Investing in these is called human capital formation."
      visual: "A circle labelled 'Human capital formation' with five arrows pointing in: Education, Health, Migration, Job Training, Access to Information."
      step_by_step: "Follow the education ladder: education → more ability → technical knowledge → skills → a better job → better income → better life → national development."
      real_world: "Software engineers trained in Kerala colleges working at Technopark in Thiruvananthapuram are human capital in the Knowledge Economy."
    activity:
      type: order
      prompt: How does education build the nation? Put the chain in order.
      steps:
      - Education
      - Increase in ability
      - Technological knowledge
      - Skill development
      - Better job
      - Better income
      - Better quality of life
      - National development
      reasons:
        Increase in ability: Learning comes first; ability grows from it.
        Technological knowledge: With more ability, people can learn technology.
        Skill development: Knowledge turns into skills through practice.
        Better job: Skills are what get better jobs.
        Better income: A better job pays more.
        Better quality of life: More income improves how people live.
        National development: When many people live better, the nation develops.
    items:
      - prompt: "The economic value of human resources is called"
        options: ["Human capital", "Labour force", "Population", "Rent"]
        answer: "Human capital"
        difficulty: 1
        hints: ["It is built through education and training."]
        solution: "Human capital."
        mistakes: {"Labour force": human_capital}
      - prompt: "How many factors influencing human capital formation does the textbook name?"
        answer: "5"
        check: "5"
        difficulty: 1
        hints: ["Education, health, migration, ..."]
        solution: "Five: education, health, migration, job training and access to information."
        mistakes: {"4": hc_factors}
      - prompt: "Which is a factor influencing human capital formation?"
        options: ["Health", "Barter", "Rent", "Rainfall"]
        answer: "Health"
        difficulty: 1
        hints: ["A sick worker produces less."]
        solution: "Health, along with education, migration, job training and access to information."
        mistakes: {"Barter": k9_hc_health}
      - prompt: "The WHO defines health as a state of"
        options: ["Physical, mental and social well-being", "Only physical fitness", "Having no money worries", "Being able to run fast"]
        answer: "Physical, mental and social well-being"
        difficulty: 1
        hints: ["It has three parts."]
        solution: "Physical, mental and social well-being."
        mistakes: {"Only physical fitness": health}
      - prompt: "The permanent or temporary movement of people from one region to another is called"
        options: ["Migration", "Job training", "Barter", "Unemployment"]
        answer: "Migration"
        difficulty: 1
        hints: ["Many Keralites go to Gulf countries for work."]
        solution: "Migration."
        mistakes: {"Job training": migration}
      - prompt: "How does poor health affect production?"
        options: ["It decreases productivity and slows production", "It increases output", "It has no effect", "It raises wages"]
        answer: "It decreases productivity and slows production"
        difficulty: 2
        hints: ["A sick person may miss work."]
        solution: "Poor health decreases productivity, keeps people from work and slows down production."
        mistakes: {"It has no effect": health}
      - prompt: "In the chain 'Education → Increase in ability → Technological knowledge → Skill development → Better job → ?', what comes next?"
        options: ["Better income", "Poverty", "Migration", "Barter"]
        answer: "Better income"
        difficulty: 2
        hints: ["A better job pays more."]
        solution: "Better job → better income → better quality of life → national development."
        mistakes: {"Migration": hc_factors}
      - prompt: "Technopark and Infopark are assets that speed up the growth of the"
        options: ["Knowledge Economy", "Barter System", "Seasonal unemployment", "Population pyramid"]
        answer: "Knowledge Economy"
        difficulty: 2
        hints: ["It uses intelligence and information technology."]
        solution: "The Knowledge Economy, which turns intellectual capacity into intellectual capital."
        mistakes: {"Barter System": human_capital}
      - prompt: "Which is a public sector healthcare institution?"
        options: ["Primary health centre", "A private clinic", "A pharmacy shop", "A gym"]
        answer: "Primary health centre"
        difficulty: 2
        hints: ["Run by the government for public welfare."]
        solution: "Health sub-centres, primary health centres, community health centres, taluk and district hospitals and medical colleges are public sector."
        mistakes: {"A private clinic": health}
      - prompt: "A hospital trains its nurses in new equipment, and they can now care for more patients each day. Which factor of human capital formation is this?"
        options: ["Job training", "Migration", "Access to information", "Barter"]
        answer: "Job training"
        difficulty: 2
        hints: ["Employers give it to employees."]
        solution: "Job training increases productivity and enables higher output."
        mistakes: {"Access to information": k9_hc_training}
      - prompt: "A family does not know that a free government skill course exists in their town. Which factor of human capital formation is missing?"
        options: ["Access to information", "Migration", "Health", "Job training"]
        answer: "Access to information"
        difficulty: 3
        hints: ["They cannot use a service they do not know about."]
        solution: "Access to information helps people learn about services in education, health and employment; government must ensure it."
        mistakes: {"Job training": k9_hc_info}
      - prompt: "A nurse from Kerala works in the Gulf, gains new experience and sends money home for her children's education. Which factor of human capital formation does this show?"
        options: ["Migration", "Access to information", "Job training", "Health"]
        answer: "Migration"
        difficulty: 2
        hints: ["She moved to another region for work.", "Which of the five factors is about moving?"]
        solution: "Step 1: Moving to another region for better work is migration. Step 2: It raises income and skills and helps build human capital at home."
        mistakes: {"Access to information": hc_factors, "Job training": hc_factors, "Health": hc_factors}
      - prompt: "Why is money spent on education called an investment and not just an expense?"
        options: ["It raises people's future productivity and income", "Because the money can never be used again", "Because only the government spends it", "Because schools make a profit"]
        answer: "It raises people's future productivity and income"
        difficulty: 3
        hints: ["An investment is spent now to gain more later.", "What does an educated worker gain later?"]
        solution: "Step 1: Education builds knowledge and skills. Step 2: These raise future productivity and earnings for the person and the country, like capital."
        mistakes: {"Because the money can never be used again": investment_return, "Because only the government spends it": investment_return, "Because schools make a profit": investment_return}

  - code: ss9.hr.challenges
    title: "Challenges: poverty and unemployment"
    after: [ss9.hr.capital_formation]
    notes: |
      Poverty: the state of not being able to meet even basic needs; the biggest challenge to human capital
      formation. Caused by low income. Vicious circle (Fig 4.7): poverty → low income, low purchasing power →
      scarcity of food, malnutrition, lack of education, chronic illness → high infant mortality, low life
      expectancy, more dependents → low productivity, lack of capacity to work → poverty. Must be broken by
      improving human resources. Central and state schemes; Kerala a model in poverty alleviation.
      Unemployment: a healthy, capable person willing to work at the prevailing wage cannot find work.
      Types: open (willing but unemployed), structural (job loss due to new technology), seasonal (work only
      in a particular season), disguised (more labourers employed than needed with no change in total output).
      Human capital formation needs maximum use of human resources.
    explanations:
      text: "Poverty and unemployment stop people from becoming human capital. Poverty traps families in a circle: low income means poor food, health and schooling, which keeps income low. Unemployment wastes people's skills."
      visual: "A circle of arrows: Poverty → Low income → Malnutrition and no schooling → Illness and low life expectancy → Low productivity → back to Poverty."
      step_by_step: "To name the type of unemployment: Step 1: did a machine replace the worker? Structural. Step 2: is there work only part of the year? Seasonal. Step 3: are extra people working but adding nothing to output? Disguised. Step 4: willing but simply no job? Open."
      real_world: "If six family members work on a small paddy plot that four could manage with the same harvest, two of them are in disguised unemployment."
    activity:
      type: sort
      prompt: Which type of unemployment?
      bins:
      - Open
      - Structural
      - Seasonal
      - Disguised
      items:
      - label: A graduate willing to work but finds no job
        bin: Open
        clue: Willing, able, but no work at all.
        why: Open unemployment.
      - label: A typist replaced by computers
        bin: Structural
        clue: New technology took the job.
        why: Structural unemployment.
      - label: A bank clerk's job taken over by ATMs
        bin: Structural
        clue: Machines changed the work.
        why: Structural.
      - label: A paddy worker idle after harvest
        bin: Seasonal
        clue: Work only at one time of year.
        why: Seasonal.
      - label: A fisher idle in the monsoon ban
        bin: Seasonal
        clue: Work stops for part of the year.
        why: Seasonal.
      - label: 6 family members on a farm that needs 4
        bin: Disguised
        clue: 'Remove 2: does output fall?'
        why: Output stays the same, so 2 are disguised unemployed.
    items:
      - prompt: "The state of not being able to meet even basic needs is"
        options: ["Poverty", "Migration", "Productivity", "Human capital"]
        answer: "Poverty"
        difficulty: 1
        hints: ["It is the biggest challenge to human capital formation."]
        solution: "Poverty."
        mistakes: {"Migration": poverty_cycle}
      - prompt: "What is the main cause that pushes people into poverty, according to the textbook?"
        options: ["Low income", "High productivity", "Too much education", "Good health"]
        answer: "Low income"
        difficulty: 1
        hints: ["Without enough money, basic needs cannot be met."]
        solution: "Low income pushes people into poverty."
        mistakes: {"Too much education": poverty_cycle}
      - prompt: "A worker loses his job because a factory installs robots. This is"
        options: ["Structural unemployment", "Seasonal unemployment", "Disguised unemployment", "Open unemployment"]
        answer: "Structural unemployment"
        difficulty: 1
        hints: ["New technology caused it."]
        solution: "Job loss due to new technology is structural unemployment."
        mistakes: {"Open unemployment": unemployment_types, "Seasonal unemployment": unemployment_types}
      - prompt: "A worker who has work only during the harvest season and none the rest of the year faces"
        options: ["Seasonal unemployment", "Structural unemployment", "Disguised unemployment", "Open unemployment"]
        answer: "Seasonal unemployment"
        difficulty: 1
        hints: ["It depends on the season."]
        solution: "Seasonal unemployment."
        mistakes: {"Disguised unemployment": unemployment_types}
      - prompt: "More workers than needed are employed, but total output does not change. This is"
        options: ["Disguised unemployment", "Open unemployment", "Seasonal unemployment", "Structural unemployment"]
        answer: "Disguised unemployment"
        difficulty: 2
        hints: ["The extra workers look employed but add nothing."]
        solution: "Disguised unemployment."
        mistakes: {"Open unemployment": unemployment_types}
      - prompt: "Which best describes unemployment?"
        options: ["A healthy, capable person willing to work at the current wage cannot find work", "A person who does not want to work", "A child below 15 who is not working", "A retired person"]
        answer: "A healthy, capable person willing to work at the current wage cannot find work"
        difficulty: 2
        hints: ["Willingness and ability both matter."]
        solution: "Unemployment is when a healthy, capable person willing to work at the prevailing wage cannot find work."
        mistakes: {"A person who does not want to work": unemployment_types}
      - prompt: "In the poverty circle, malnutrition and lack of education lead to illness and low life expectancy. What do these lead to next?"
        options: ["Low productivity and lack of capacity to work", "High income", "More savings", "Better jobs"]
        answer: "Low productivity and lack of capacity to work"
        difficulty: 2
        hints: ["Sick people cannot work well."]
        solution: "They lead to low productivity, which brings back low income and poverty."
        mistakes: {"Better jobs": poverty_cycle}
      - prompt: "How can the vicious circle of poverty be broken, according to the textbook?"
        options: ["By improving human resources", "By stopping all education", "By reducing wages", "By increasing population only"]
        answer: "By improving human resources"
        difficulty: 2
        hints: ["Better health and education raise productivity."]
        solution: "Human capital formation is possible only if the circle is broken by improving human resources."
        mistakes: {"By increasing population only": poverty_cycle}
      - prompt: "Four people can farm a plot and harvest 40 sacks of rice. Seven family members now work on it and still harvest 40 sacks. How many of them are in disguised unemployment?"
        answer: "3"
        check: "7 - 4"
        difficulty: 3
        hints: ["Extra workers who add nothing to output."]
        solution: "7 − 4 = 3 people are in disguised unemployment; removing them would not reduce output."
        mistakes: {"7": unemployment_types}
      - prompt: "A graduate is willing to work at the current wage and has been looking for a job for a year, but cannot find one. Which type is this?"
        options: ["Open unemployment", "Disguised unemployment", "Seasonal unemployment", "Structural unemployment"]
        answer: "Open unemployment"
        difficulty: 3
        hints: ["No machine, no season, no extra workers on a plot."]
        solution: "Willing to work but unemployed is open unemployment."
        mistakes: {"Structural unemployment": unemployment_types}
      - prompt: "Farm workers in a village have work only at sowing and harvest time. What would best reduce this seasonal unemployment?"
        options: ["Starting dairy, poultry or small crafts for the off-season", "Adding more workers to each field", "Closing the village school", "Buying more harvesting machines"]
        answer: "Starting dairy, poultry or small crafts for the off-season"
        difficulty: 3
        hints: ["The problem is the months with no farm work.", "Which choice gives work in those months?"]
        solution: "Step 1: Seasonal unemployment comes from idle months. Step 2: Side activities like dairy, poultry or crafts give work and income all year."
        mistakes: {"Adding more workers to each field": unemployment_types, "Closing the village school": off_season, "Buying more harvesting machines": unemployment_types}
      - prompt: "Why is poverty the biggest challenge to building human capital?"
        options: ["Poor families cannot afford good food, health care or schooling", "Poor people do not want education", "Poverty makes people taller", "It only affects the government budget"]
        answer: "Poor families cannot afford good food, health care or schooling"
        difficulty: 2
        hints: ["What does human capital need?", "Follow the vicious circle of poverty."]
        solution: "Step 1: Human capital needs nutrition, health and education. Step 2: Low income denies these, so productivity stays low and poverty continues."
        mistakes: {"Poor people do not want education": poverty_blocks, "Poverty makes people taller": poverty_blocks, "It only affects the government budget": poverty_cycle}
