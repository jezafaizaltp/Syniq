# Class 9 Social Science I, chapter 5. Format: content/README.md.
# Figures are from Census 2011, the latest census held so far.
subject: ss
chapter: 5
title: Demographic Trends in India

tips:
  census_interval: "India's census is taken every 10 years. The latest completed census was in 2011."
  density_formula: "Population density = population ÷ area (persons per square kilometre). Divide, don't multiply."
  sex_ratio_formula: "Sex ratio = number of females per 1000 males = females ÷ males × 1000."
  growth_formula: "Natural growth rate = birth rate − death rate (both per 1000 people)."
  dependency_formula: "Dependency ratio = (children 0–14 + people 65 and over) ÷ people aged 15–64 × 100."
  kerala_figures: "Census 2011: Kerala's sex ratio 1084 (highest among states) and literacy about 94%; India's sex ratio 943 and literacy about 74%."
  dividend_meaning: "A demographic dividend is the chance for faster growth when a large share of people are of working age (15–64)."

concepts:
  - code: ss9.demography.census
    title: The census and population size
    notes: |
      A census counts every person and records age, sex, literacy, work, language and more. India's
      census is held every 10 years; the first synchronous census was in 1881 and the latest completed
      one was in 2011. Census 2011: India's population about 121 crore (1.21 billion), second only to
      China then; Uttar Pradesh the most populous state; Kerala about 3.34 crore. Population density
      = population ÷ area: India 382 per sq km, Kerala 860, Bihar the highest (1106).
    explanations:
      text: "Every ten years census enumerators visit every household in India. The numbers they collect decide where to build schools and hospitals and how to plan for the future. Density tells us how crowded a place is: Kerala is much more crowded than the Indian average."
      visual: "Draw two squares of the same size. In one draw 4 dots (sparse); in the other 9 dots (dense). Same area, more people: higher density."
      step_by_step: "A district has 12,00,000 people on 1,500 sq km. Step 1: Density = population ÷ area. Step 2: 12,00,000 ÷ 1,500 = 800. Step 3: 800 persons per sq km."
      real_world: "Census figures decide how many seats each area gets in panchayats, assemblies and Parliament."
    items:
      - prompt: "How often is the census held in India?"
        options: ["Every 10 years", "Every 5 years", "Every year", "Every 20 years"]
        answer: "Every 10 years"
        difficulty: 1
        hints: ["1991, 2001, 2011..."]
        solution: "The census is decennial: every 10 years."
        mistakes: {"Every 5 years": census_interval}
      - prompt: "A town has 50,000 people living on 20 sq km. What is its population density, in persons per sq km?"
        answer: "2500"
        check: "50000/20"
        difficulty: 1
        hints: ["Density = population ÷ area."]
        solution: "50,000 ÷ 20 = 2,500 per sq km"
        mistakes: {"1000000": density_formula, "1/2500": density_formula}
      - prompt: "According to Census 2011, which state had the largest population?"
        options: ["Uttar Pradesh", "Kerala", "Bihar", "Maharashtra"]
        answer: "Uttar Pradesh"
        difficulty: 2
        hints: ["About 20 crore people."]
        solution: "Uttar Pradesh was the most populous state."
      - prompt: "In which year was the latest completed census of India held?"
        answer: "2011"
        check: "2011"
        difficulty: 1
        hints: ["Ten years after 2001."]
        solution: "The latest completed census was in 2011."
        mistakes: {"2021": census_interval}
      - prompt: "Kerala's population density (860) is much higher than India's (382). What does this mean?"
        options: ["More people live on each square kilometre in Kerala", "Kerala has more people than India", "Kerala is larger than India", "Fewer people live in Kerala per sq km"]
        answer: "More people live on each square kilometre in Kerala"
        difficulty: 2
        hints: ["Density compares people with area."]
        solution: "Higher density means more crowding per unit area."
        mistakes: {"Kerala has more people than India": density_formula}
      - prompt: "A district has 12,00,000 people and an area of 1,500 sq km. What is its density, in persons per sq km?"
        answer: "800"
        check: "1200000/1500"
        difficulty: 3
        hints: ["Divide population by area."]
        solution: "12,00,000 ÷ 1,500 = 800 per sq km"
        mistakes: {"1800000000": density_formula}

  - code: ss9.demography.composition
    title: Sex ratio, literacy and age structure
    after: [ss9.demography.census]
    notes: |
      Sex ratio is the number of females per 1000 males. Census 2011: India 943, Kerala 1084 (the
      highest among states); the child sex ratio (0–6 years) of India was 919. Literacy rate
      (aged 7 and above): India about 74%, Kerala about 94%. Age structure: children (0–14),
      working age (15–64), elderly (65+). The dependency ratio compares dependents with
      working-age people. Kerala has a higher share of elderly people because of long life
      expectancy and low birth rates.
    explanations:
      text: "Sex ratio tells us whether girls and women are counted in fair numbers. Kerala has more women than men, linked with good health care and education for girls; in some states the ratio is low, a sign of discrimination against girls. Literacy and age structure tell us what the population needs: schools for children, jobs for the young, care for the old."
      visual: "Draw a population pyramid: a wide base (many children) for a young population, and a more column-like shape for Kerala with more older people."
      step_by_step: "A village has 600 men and 630 women. Step 1: Sex ratio = females ÷ males × 1000. Step 2: 630 ÷ 600 × 1000. Step 3: = 1050 females per 1000 males."
      real_world: "Kerala's high literacy owes much to early schools, library movements and the literacy campaign that made Kottayam India's first fully literate town in 1989."
    items:
      - prompt: "Sex ratio is the number of females per how many males?"
        answer: "1000"
        check: "1000"
        difficulty: 1
        hints: ["It is given per thousand."]
        solution: "Females per 1000 males."
        mistakes: {"100": sex_ratio_formula}
      - prompt: "A village has 600 men and 630 women. What is its sex ratio?"
        answer: "1050"
        check: "Rational(630, 600)*1000"
        difficulty: 2
        hints: ["Females ÷ males × 1000."]
        solution: "630 ÷ 600 × 1000 = 1050"
        mistakes: {"952": sex_ratio_formula}
      - prompt: "Which state had the highest sex ratio in Census 2011?"
        options: ["Kerala", "Haryana", "Punjab", "Uttar Pradesh"]
        answer: "Kerala"
        difficulty: 1
        hints: ["1084 females per 1000 males."]
        solution: "Kerala's sex ratio was 1084."
        mistakes: {"Haryana": kerala_figures}
      - prompt: "India's literacy rate in Census 2011 was about:"
        options: ["74%", "94%", "50%", "100%"]
        answer: "74%"
        difficulty: 2
        hints: ["Kerala's was about 94%."]
        solution: "India about 74%; Kerala about 94%."
        mistakes: {"94%": kerala_figures}
      - prompt: "A place has 300 children (0–14), 100 elderly (65+) and 800 people aged 15–64. What is the dependency ratio?"
        answer: "50"
        check: "Rational(300 + 100, 800)*100"
        difficulty: 3
        hints: ["(300 + 100) ÷ 800 × 100."]
        solution: "400 ÷ 800 × 100 = 50"
        mistakes: {"200": dependency_formula}
      - prompt: "Why does Kerala have a larger share of elderly people than many states?"
        options: ["Long life expectancy and low birth rates", "High birth rates", "Low literacy", "Few hospitals"]
        answer: "Long life expectancy and low birth rates"
        difficulty: 2
        hints: ["People live longer and families are smaller."]
        solution: "Good health care raises life expectancy, and fewer births mean fewer children relative to adults."

  - code: ss9.demography.growth
    title: Population growth and the demographic dividend
    after: [ss9.demography.composition]
    notes: |
      Population changes through births, deaths and migration. Birth rate and death rate are given
      per 1000 people per year; natural growth rate = birth rate − death rate. The demographic
      transition: high birth and death rates → death rates fall (better health) while birth rates
      stay high (fast growth) → birth rates fall too (slow growth). India has a large working-age
      population, a demographic dividend that can speed up growth if people get education, health
      and jobs. Migration (rural to urban, and from Kerala to the Gulf) also shapes population.
    explanations:
      text: "If 20 babies are born and 7 people die for every 1000 people in a year, the population grows by 13 per 1000. When medicines cut deaths but families stay large, numbers shoot up; later, as education spreads, families get smaller. India today has many young adults: a big advantage if they have skills and work."
      visual: "Draw two lines over time: death rate falling first, birth rate falling later. The gap between them is the growth, widest in the middle stage."
      step_by_step: "Birth rate 18, death rate 7 per 1000. Step 1: Growth = 18 − 7. Step 2: = 11 per 1000. Step 3: That is 1.1% a year."
      real_world: "Money sent home by Keralites working in the Gulf countries (remittances) changed housing, education and the economy of many Kerala villages."
    items:
      - prompt: "Birth rate is 20 per 1000 and death rate is 7 per 1000. What is the natural growth rate, per 1000?"
        answer: "13"
        check: "20 - 7"
        difficulty: 1
        hints: ["Subtract deaths from births."]
        solution: "20 − 7 = 13 per 1000"
        mistakes: {"27": growth_formula}
      - prompt: "What is the demographic dividend?"
        options: ["The chance for faster growth when many people are of working age", "Money paid to large families", "A tax on population", "The number of elderly people"]
        answer: "The chance for faster growth when many people are of working age"
        difficulty: 2
        hints: ["Think of a large young workforce."]
        solution: "A large working-age share can boost the economy if people have skills and jobs."
        mistakes: {"The number of elderly people": dividend_meaning}
      - prompt: "Which of these does NOT directly change population size?"
        options: ["Literacy rate", "Births", "Deaths", "Migration"]
        answer: "Literacy rate"
        difficulty: 1
        hints: ["Population changes when people are added or removed."]
        solution: "Births, deaths and migration change numbers; literacy does not directly."
      - prompt: "In the middle stage of the demographic transition, why does population grow fast?"
        options: ["Death rates fall while birth rates stay high", "Birth rates fall while death rates rise", "Both rates are low", "Everyone migrates"]
        answer: "Death rates fall while birth rates stay high"
        difficulty: 2
        hints: ["Medicine improves before family size changes."]
        solution: "The gap between high births and falling deaths makes growth fast."
        mistakes: {"Both rates are low": growth_formula}
      - prompt: "Birth rate 18 and death rate 7 per 1000. What is the growth rate as a percentage per year?"
        answer: "11/10"
        check: "Rational(18 - 7, 1000)*100"
        difficulty: 3
        hints: ["11 per 1000 = ? per 100."]
        solution: "11 per 1000 = 1.1 per 100 = 1.1%"
        mistakes: {"11": growth_formula}
      - prompt: "Which kind of migration has strongly affected Kerala's economy?"
        options: ["Migration of workers to the Gulf countries", "Migration to Antarctica", "Nomadic herding", "Migration of the Harappans"]
        answer: "Migration of workers to the Gulf countries"
        difficulty: 2
        hints: ["Remittances."]
        solution: "Gulf migration and the money sent home changed Kerala's economy."
