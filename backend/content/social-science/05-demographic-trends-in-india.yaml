# Class 9 Social Science I, chapter 5. Format: content/README.md.
# Figures are from Census 2011, the latest census held so far.
subject: ss
chapter: 5
title: Demographic Trends in India

tips:
  scale_up: "Equal numbers give a ratio of one to one. Sex ratio counts females for every thousand males, so scale it up."
  census_why: "Births, deaths and migration change the population all the time. What do planners of schools, hospitals and jobs need?"
  girls_missing: "Naturally, about as many girls as boys are born. If far fewer girls are counted, what does that suggest about how girls are treated?"
  rate_to_number: "A rate per 1000 tells you how many for every 1000 people. Scale it up to the whole population."
  use_the_young: "A large working-age population helps only if those people can find productive work. What must a country give its young people?"
  k9_sex_ratio_base: "India's sex ratio figures are numbers like 943 or 1084. What base would make those sensible?"
  census_interval: "India counts its people once every decade, in years ending in 1. The 2021 round was postponed, so the last completed census was the one before it."
  pop_density_formula: "Population density = population ÷ area (persons per square kilometre). Divide, don't multiply."
  sex_ratio_formula: "Sex ratio counts females per thousand males: females ÷ males × 1000. If there are more women than men, the ratio is above that thousand."
  growth_formula: "Natural growth rate = birth rate − death rate (both per 1000 people)."
  dependency_formula: "Dependency ratio = (children 0–14 + people 65 and over) ÷ people aged 15–64 × 100."
  kerala_figures: "In Census 2011 a southern state had more women than men and the highest sex ratio. India's overall literacy was roughly three-quarters, lower than that state's."
  dividend_meaning: "A demographic dividend is the chance for faster growth when a large share of people are of working age (15–64)."
  gulf_migration: "Kerala's economy was shaped by workers who went to the Gulf and sent money home."
  kerala_elderly: "Kerala's people live long and have few children, so the elderly form a larger share."
  most_populous: "The largest state by population is the big northern state on the Ganga plain, with over 19 crore people in 2011."
  population_change: "Only births, deaths and migration change how many people there are. Literacy changes what people can do, not their number."
  density_per_area: 'Density is people per square kilometre: divide the population by the area, not the other way round.'
  per_thousand_males: 'Sex ratio counts females for every 1000 males: divide females by males and multiply by 1000.'
  natural_minus: Natural growth is births minus deaths. Migration and literacy are not part of it.
  per_1000_to_percent: Rates per 1000 become percentages when you divide by 10.
  transition_stage: Better medicine lowers deaths first; families take longer to have fewer children.
  census_gap: The census is held once every ten years. Count on from the last one.
  dependents_only: Dependents are children (0–14) and the elderly (65+). People aged 15–64 are the working age.

concepts:
  - code: ss9.demography.census
    title: The census and population size
    notes: |
      A census counts every person and records age, sex, literacy, work, language and more. India's
      census is held every 10 years; the first synchronous census was in 1881 and the latest completed
      one was in 2011. Census 2011: India's population about 121 crore (1.21 billion), second only to
      China then; Uttar Pradesh the most populous state; Kerala about 3.34 crore. Population density
      = population ÷ area: India 382 per sq km, Kerala 860, Bihar the highest (1106).
    explanations:
      text: "Every ten years census enumerators visit every household in India. The numbers they collect decide where to build schools and hospitals and how to plan for the future. Density tells us how crowded a place is: Kerala is much more crowded than the Indian average."
      visual: "Draw two squares of the same size. In one draw 4 dots (sparse); in the other 9 dots (dense). Same area, more people: higher density."
      step_by_step: "A district has 12,00,000 people on 1,500 sq km. Step 1: Density = population ÷ area. Step 2: 12,00,000 ÷ 1,500 = 800. Step 3: 800 persons per sq km."
      real_world: "Census figures decide how many seats each area gets in panchayats, assemblies and Parliament."
    activity:
      type: number_line
      min: 1871
      max: 2021
      step: 10
      start: 1871
      prompt: India's census comes every 10 years. Mark the year.
      goals:
      - prompt: The first synchronous census
        target: 1881
        mistakes:
        - when:
            v: 1871
          say: Too early. Look for the first census taken all over India at the same time; it came in the next decade.
      - prompt: The latest completed census
        target: 2011
        mistakes:
        - when:
            v: 2021
          say: The 2021 census was not completed on time. Go back one census, ten years.
      - prompt: The census just before 2011
        target: 2001
        mistakes:
        - when:
            v: 1991
          say: 'That is 20 years before. A census comes every 10 years: 2011 − 10.'
    lesson:
      - teach: A census counts every person in the country and records their age, sex, literacy, work, language and more. India holds a census every 10 years. The first synchronous census was in 1881; the latest completed one was in 2011.
        check:
          prompt: How often does India hold a census?
          options:
          - Every 10 years
          - Every year
          - Every 5 years
          answer: Every 10 years
          why: 'The census is decennial: once in ten years.'
      - teach: Census 2011 counted about 121 crore (1.21 billion) people, second only to China then. Uttar Pradesh had the most people. Kerala had about 3.34 crore.
        check:
          prompt: Which state had the largest population in 2011?
          options:
          - Uttar Pradesh
          - Kerala
          - Goa
          answer: Uttar Pradesh
          why: UP was the most populous state.
      - teach: 'Population density tells how crowded a place is: population ÷ area, in persons per sq km. India''s was 382; Kerala''s 860; Bihar''s the highest, 1106. A town of 30,000 people on 10 sq km has a density of 3,000.'
        picture:
          kind: bars
          bars:
          - label: India
            value: 382
          - label: Kerala
            value: 860
          - label: Bihar
            value: 1106
          unit: per sq km
          alt: 'Population density in 2011: India 382, Kerala 860, Bihar 1106 per square kilometre.'
        check:
          prompt: A town has 40,000 people on 8 sq km. What is its density?
          options:
          - 5,000 per sq km
          - 320,000 per sq km
          - 40,008 per sq km
          answer: 5,000 per sq km
          why: 40,000 ÷ 8 = 5,000.
    items:
      - prompt: "How often is the census held in India?"
        options: ["Every 10 years", "Every 5 years", "Every year", "Every 20 years"]
        answer: "Every 10 years"
        difficulty: 1
        hints: ["1991, 2001, 2011..."]
        solution: "The census is decennial: every 10 years."
        mistakes: {"Every 5 years": census_interval}
      - prompt: "A town has 50,000 people living on 20 sq km. What is its population density, in persons per sq km?"
        answer: "2500"
        check: "50000/20"
        difficulty: 1
        hints: ["Density = population ÷ area."]
        solution: "50,000 ÷ 20 = 2,500 per sq km"
        mistakes: {"1000000": pop_density_formula, "1/2500": pop_density_formula}
      - prompt: "According to Census 2011, which state had the largest population?"
        options: ["Uttar Pradesh", "Kerala", "Bihar", "Maharashtra"]
        answer: "Uttar Pradesh"
        difficulty: 2
        hints: ["About 20 crore people."]
        solution: "Uttar Pradesh was the most populous state."
        mistakes: {"Bihar": "most_populous", "Maharashtra": "most_populous"}
      - prompt: "In which year was the latest completed census of India held?"
        answer: "2011"
        check: "2011"
        difficulty: 1
        hints: ["Ten years after 2001."]
        solution: "The latest completed census was in 2011."
        mistakes: {"2021": census_interval}
      - prompt: "Kerala's population density (860) is much higher than India's (382). What does this mean?"
        options: ["More people live on each square kilometre in Kerala", "Kerala has more people than India", "Kerala is larger than India", "Fewer people live in Kerala per sq km"]
        answer: "More people live on each square kilometre in Kerala"
        difficulty: 2
        hints: ["Density compares people with area."]
        solution: "Higher density means more crowding per unit area."
        mistakes: {"Kerala has more people than India": pop_density_formula}
      - prompt: "A district has 12,00,000 people and an area of 1,500 sq km. What is its density, in persons per sq km?"
        answer: "800"
        check: "1200000/1500"
        difficulty: 3
        hints: ["Divide population by area."]
        solution: "12,00,000 ÷ 1,500 = 800 per sq km"
        mistakes: {"1800000000": pop_density_formula}
      - prompt: "District A has 9,00,000 people on 300 sq km. District B has 15,00,000 people on 750 sq km. Which is more densely populated?"
        options: ["District A", "District B", "Both the same", "You cannot tell without a map"]
        answer: "District A"
        difficulty: 3
        hints: ["Find each density: population ÷ area.", "A: 9,00,000 ÷ 300. B: 15,00,000 ÷ 750."]
        solution: "Step 1: A = 3000 per sq km. Step 2: B = 2000 per sq km. Step 3: A is denser, even though B has more people."
        mistakes: {"District B": pop_density_formula, "Both the same": pop_density_formula, "You cannot tell without a map": pop_density_formula}
      - prompt: "Why is the census repeated every 10 years instead of being done once?"
        options: ["The population and its features keep changing, and planning needs fresh figures", "The law requires counting every house once a decade only", "It is used to elect the Prime Minister", "Old census records are thrown away"]
        answer: "The population and its features keep changing, and planning needs fresh figures"
        difficulty: 2
        hints: ["What changes the population?", "Who uses census figures?"]
        solution: "Step 1: Births, deaths and migration keep changing the population. Step 2: Governments need new figures to plan schools, hospitals, jobs and seats."
        mistakes: {"The law requires counting every house once a decade only": census_why, "It is used to elect the Prime Minister": census_why, "Old census records are thrown away": census_why}
      - prompt: A panchayat has 24,000 people on an area of 16 sq km. What is its population density, in persons per sq km?
        answer: '1500'
        check: 24000/16
        difficulty: 1
        hints:
        - Density is people per square kilometre.
        - Divide the population by the area.
        solution: 'Step 1: Population = 24,000. Step 2: Area = 16 sq km. Step 3: 24,000 ÷ 16 = 1,500 per sq km.'
        mistakes:
          '384000': density_per_area
      - prompt: Which state had the highest population density in Census 2011?
        options:
        - Bihar
        - Kerala
        - Rajasthan
        - Arunachal Pradesh
        answer: Bihar
        difficulty: 2
        hints:
        - Kerala is crowded, but one state was even more so.
        - It lies in the Ganga plain.
        solution: 'Step 1: India''s density was 382, Kerala''s 860. Step 2: One state crossed 1,100. Step 3: Bihar (1,106).'
        mistakes:
          Kerala: density_per_area
      - prompt: In which year was the first synchronous census of India held?
        answer: '1881'
        check: '1881'
        difficulty: 2
        hints:
        - It was during British rule.
        - It was 130 years before 2011.
        solution: 'Step 1: 2011 − 130 = 1881. Step 2: That was the first census taken across India at the same time. Step 3: 1881.'
        mistakes:
          '2011': census_gap
      - prompt: If the census is held every 10 years after 2011, in which year would the next one be due?
        answer: '2021'
        check: 2011+10
        difficulty: 1
        hints:
        - Add the gap to the last census year.
        - The gap is ten years.
        solution: 'Step 1: Last census 2011. Step 2: Add 10 years. Step 3: Due in 2021 (it was postponed).'
        mistakes:
          '2016': census_gap
      - prompt: Why does the government need census data?
        options:
        - To plan schools, hospitals, jobs and services
        - To decide the weather
        - To choose cricket teams
        - To print stamps
        answer: To plan schools, hospitals, jobs and services
        difficulty: 1
        hints:
        - The census tells how many people there are and what they need.
        - What does a government plan for?
        solution: 'Step 1: The census gives facts about people. Step 2: Planning needs these facts. Step 3: Schools, hospitals and jobs are planned from them.'
        mistakes:
          To decide the weather: census_gap
      - prompt: Village P has 6,000 people on 4 sq km. Village Q has 9,000 people on 10 sq km. Which is more densely populated?
        options:
        - Village P
        - Village Q
        - Both are equal
        - Cannot be found
        answer: Village P
        difficulty: 3
        hints:
        - Work out the density of each village.
        - Compare persons per sq km, not total people.
        solution: 'Step 1: P: 6,000 ÷ 4 = 1,500. Step 2: Q: 9,000 ÷ 10 = 900. Step 3: P is more densely populated.'
        mistakes:
          Village Q: density_per_area
      - prompt: Kerala had about 3.34 crore people in 2011. Written in full, how many people is 3.34 crore?
        answer: '33400000'
        check: 334*100000
        difficulty: 3
        hints:
        - 1 crore = 1,00,00,000 (ten million).
        - Multiply 3.34 by ten million.
        solution: 'Step 1: 1 crore = 10,000,000. Step 2: 3.34 × 10,000,000. Step 3: = 3,34,00,000 (33,400,000).'
        mistakes:
          '3340000': census_gap

  - code: ss9.demography.composition
    title: Sex ratio, literacy and age structure
    after: [ss9.demography.census]
    notes: |
      Sex ratio is the number of females per 1000 males. Census 2011: India 943, Kerala 1084 (the
      highest among states); the child sex ratio (0–6 years) of India was 919. Literacy rate
      (aged 7 and above): India about 74%, Kerala about 94%. Age structure: children (0–14),
      working age (15–64), elderly (65+). The dependency ratio compares dependents with
      working-age people. Kerala has a higher share of elderly people because of long life
      expectancy and low birth rates.
    explanations:
      text: "Sex ratio tells us whether girls and women are counted in fair numbers. Kerala has more women than men, linked with good health care and education for girls; in some states the ratio is low, a sign of discrimination against girls. Literacy and age structure tell us what the population needs: schools for children, jobs for the young, care for the old."
      visual: "Draw a population pyramid: a wide base (many children) for a young population, and a more column-like shape for Kerala with more older people."
      step_by_step: "A village has 600 men and 630 women. Step 1: Sex ratio = females ÷ males × 1000. Step 2: 630 ÷ 600 × 1000. Step 3: = 1050 females per 1000 males."
      real_world: "Kerala's high literacy owes much to early schools, library movements and the literacy campaign that made Kottayam India's first fully literate town in 1989."
    activity:
      type: scale
      min: 900
      max: 1100
      step: 1
      start: 1000
      unit: per 1000
      prompt: Sex ratio = females per 1000 males (Census 2011). Slide to the value.
      zones:
      - from: 900
        to: 1000
        label: Fewer females
        says: 'Below 1000: fewer females than males.'
      - from: 1000
        to: 1100
        label: More females
        says: 'Above 1000: more females than males.'
      goals:
      - prompt: Kerala's sex ratio, the highest of all states
        value: 1084
        mistakes:
        - when:
            v: 943
          say: That's India's ratio. Kerala has more females than males, so it is above 1000.
        - when:
            v:
            - 900
            - 999
          say: Below 1000 means fewer females. Kerala has more females than males.
      - prompt: India's sex ratio
        value: 943
        mistakes:
        - when:
            v:
            - 1000
            - 1100
          say: India has fewer females than males, so its ratio is below 1000.
        - when:
            v: 919
          say: 'That''s the child sex ratio (0–6 years). For all ages the number is higher: more girls survive in the count of everyone.'
      - prompt: India's child sex ratio (0–6 years)
        value: 919
        mistakes:
        - when:
            v: 943
          say: That one is for all ages. Among children aged 0–6 the ratio is lower still.
    lesson:
      - teach: Sex ratio is the number of females for every 1000 males. In 2011 India's was 943, and Kerala's 1084, the highest of all states. If a village has 500 men and 520 women, its sex ratio is 520 ÷ 500 × 1000 = 1040.
        picture:
          kind: bars
          bars:
          - label: India
            value: 943
          - label: Kerala
            value: 1084
          - label: India 0–6 yrs
            value: 919
          unit: females per 1000 males
          alt: 'Sex ratio 2011: India 943, Kerala 1084, India''s child sex ratio 919.'
        check:
          prompt: A place has 1000 males and 950 females. What is its sex ratio?
          options:
          - '950'
          - '1050'
          - '50'
          answer: '950'
          why: 950 females per 1000 males.
      - teach: Literacy rate is the share of people aged 7 and above who can read and write. India's was about 74% in 2011; Kerala's about 94%, among the highest.
        check:
          prompt: Literacy rate counts people from which age?
          options:
          - 7 years and above
          - All ages from birth
          - 18 years and above
          answer: 7 years and above
          why: Younger children are not counted.
      - teach: Age structure groups people as children (0–14), working age (15–64) and elderly (65+). Children and the elderly are dependents. Kerala has a large share of elderly people because people live long and have fewer children.
        check:
          prompt: Which group is the working-age population?
          options:
          - 15–64 years
          - 0–14 years
          - 65 and above
          answer: 15–64 years
          why: Working age is 15 to 64.
    items:
      - prompt: "Sex ratio is the number of females per how many males?"
        answer: "1000"
        check: "1000"
        difficulty: 1
        hints: ["It is given per thousand."]
        solution: "Females per 1000 males."
        mistakes: {"100": k9_sex_ratio_base}
      - prompt: "A village has 600 men and 630 women. What is its sex ratio?"
        answer: "1050"
        check: "Rational(630, 600)*1000"
        difficulty: 2
        hints: ["Females ÷ males × 1000."]
        solution: "630 ÷ 600 × 1000 = 1050"
        mistakes: {"952": sex_ratio_formula}
      - prompt: "Which state had the highest sex ratio in Census 2011?"
        options: ["Kerala", "Haryana", "Punjab", "Uttar Pradesh"]
        answer: "Kerala"
        difficulty: 1
        hints: ["1084 females per 1000 males."]
        solution: "Kerala's sex ratio was 1084."
        mistakes: {"Haryana": kerala_figures}
      - prompt: "India's literacy rate in Census 2011 was about:"
        options: ["74%", "94%", "50%", "100%"]
        answer: "74%"
        difficulty: 2
        hints: ["Kerala's was about 94%."]
        solution: "India about 74%; Kerala about 94%."
        mistakes: {"94%": kerala_figures}
      - prompt: "A place has 300 children (0–14), 100 elderly (65+) and 800 people aged 15–64. What is the dependency ratio?"
        answer: "50"
        check: "Rational(300 + 100, 800)*100"
        difficulty: 3
        hints: ["(300 + 100) ÷ 800 × 100."]
        solution: "400 ÷ 800 × 100 = 50"
        mistakes: {"200": dependency_formula}
      - prompt: "Why does Kerala have a larger share of elderly people than many states?"
        options: ["Long life expectancy and low birth rates", "High birth rates", "Low literacy", "Few hospitals"]
        answer: "Long life expectancy and low birth rates"
        difficulty: 2
        hints: ["People live longer and families are smaller."]
        solution: "Good health care raises life expectancy, and fewer births mean fewer children relative to adults."

        mistakes: {"High birth rates": "kerala_elderly", "Few hospitals": "kerala_elderly"}
      - prompt: "A town has 2,06,000 people, of whom 1,00,000 are males. What is its sex ratio?"
        answer: "1060"
        check: "(206000-100000)/100000*1000"
        difficulty: 3
        hints: ["First find the number of females.", "Females ÷ males × 1000."]
        solution: "Step 1: Females = 2,06,000 − 1,00,000 = 1,06,000. Step 2: 1,06,000 ÷ 1,00,000 × 1000 = 1060."
        mistakes: {"2060": sex_ratio_formula, "943.4": sex_ratio_formula}
      - prompt: "India's child sex ratio (ages 0–6) is lower than its overall sex ratio. What does a falling child sex ratio most likely signal?"
        options: ["Discrimination against girls, before or after birth", "More girls are being born than boys", "Girls' health is improving fastest", "Only mistakes in counting"]
        answer: "Discrimination against girls, before or after birth"
        difficulty: 3
        hints: ["Naturally, roughly equal numbers of girls and boys are born.", "Why might fewer girls survive or be born?"]
        solution: "Step 1: Nature gives roughly equal numbers. Step 2: A low and falling child sex ratio points to sex-selection and neglect of girls, a social problem laws try to stop."
        mistakes: {"More girls are being born than boys": girls_missing, "Girls' health is improving fastest": girls_missing, "Only mistakes in counting": girls_missing}
      - prompt: A village has 800 men and 840 women. What is its sex ratio?
        answer: '1050'
        check: 840/800*1000
        difficulty: 1
        hints:
        - Sex ratio = females per 1000 males.
        - Divide females by males, then multiply by 1000.
        solution: 'Step 1: 840 ÷ 800 = 1.05. Step 2: × 1000. Step 3: = 1050.'
        mistakes:
          '952': per_thousand_males
          '40': per_thousand_males
      - prompt: What was Kerala's literacy rate in Census 2011, approximately?
        options:
        - 94%
        - 74%
        - 50%
        - 65%
        answer: 94%
        difficulty: 1
        hints:
        - India's rate was about 74%.
        - Kerala's was much higher.
        solution: 'Step 1: India: about 74%. Step 2: Kerala is a leader in literacy. Step 3: About 94%.'
        mistakes:
          74%: per_thousand_males
      - prompt: Which age group is counted as the elderly?
        options:
        - 65 and above
        - 15–64
        - 0–14
        - Only above 90
        answer: 65 and above
        difficulty: 1
        hints:
        - There are three age groups.
        - The elderly come after working age ends.
        solution: 'Step 1: 0–14 children. Step 2: 15–64 working age. Step 3: 65+ elderly.'
        mistakes:
          15–64: dependents_only
      - prompt: A town has 400 children, 200 elderly and 1,200 people aged 15–64. How many dependents are there?
        answer: '600'
        check: 400+200
        difficulty: 2
        hints:
        - Dependents are children and the elderly.
        - Add those two groups.
        solution: 'Step 1: Children = 400. Step 2: Elderly = 200. Step 3: Dependents = 600.'
        mistakes:
          '1200': dependents_only
          '1800': dependents_only
      - prompt: A place has 5,000 females and 5,000 males. What is its sex ratio?
        answer: '1000'
        check: 5000/5000*1000
        difficulty: 2
        hints:
        - Equal numbers of females and males.
        - Females per 1000 males.
        solution: 'Step 1: 5,000 ÷ 5,000 = 1. Step 2: × 1000. Step 3: = 1000.'
        mistakes:
          '1': scale_up
      - prompt: 'Kerala''s high literacy and long life expectancy are linked mainly to:'
        options:
        - Good schools and public health care
        - Low rainfall
        - Fewer roads
        - Mountains
        answer: Good schools and public health care
        difficulty: 2
        hints:
        - Think of what helps people read and live long.
        - These are services, not geography.
        solution: 'Step 1: Literacy comes from schooling. Step 2: Long life comes from health care. Step 3: Kerala invested in both.'
        mistakes:
          Low rainfall: transition_stage
  - code: ss9.demography.growth
    title: Population growth and the demographic dividend
    after: [ss9.demography.composition]
    notes: |
      Population changes through births, deaths and migration. Birth rate and death rate are given
      per 1000 people per year; natural growth rate = birth rate − death rate. The demographic
      transition: high birth and death rates → death rates fall (better health) while birth rates
      stay high (fast growth) → birth rates fall too (slow growth). India has a large working-age
      population, a demographic dividend that can speed up growth if people get education, health
      and jobs. Migration (rural to urban, and from Kerala to the Gulf) also shapes population.
    explanations:
      text: "If 20 babies are born and 7 people die for every 1000 people in a year, the population grows by 13 per 1000. When medicines cut deaths but families stay large, numbers shoot up; later, as education spreads, families get smaller. India today has many young adults: a big advantage if they have skills and work."
      visual: "Draw two lines over time: death rate falling first, birth rate falling later. The gap between them is the growth, widest in the middle stage."
      step_by_step: "Birth rate 18, death rate 7 per 1000. Step 1: Growth = 18 − 7. Step 2: = 11 per 1000. Step 3: That is 1.1% a year."
      real_world: "Money sent home by Keralites working in the Gulf countries (remittances) changed housing, education and the economy of many Kerala villages."
    activity:
      type: number_line
      min: 0
      max: 40
      step: 1
      start: 0
      prompt: Natural growth rate = birth rate − death rate (per 1000 people).
      goals:
      - prompt: Birth rate 20, death rate 7
        target: 13
        mistakes:
        - when:
            v: 27
          say: 'That adds them. Deaths take people away: 20 − 7.'
        - when:
            v: 7
          say: That's the death rate. Take it away from the birth rate.
      - prompt: Birth rate 25, death rate 10
        target: 15
        mistakes:
        - when:
            v: 35
          say: That adds them. Growth is births minus deaths.
      - prompt: 'Birth rate 12, death rate 9: a late stage of the transition'
        target: 3
        mistakes:
        - when:
            v: 21
          say: 'That adds them. When both rates are low, growth is slow: 12 − 9.'
    lesson:
      - teach: Population changes through births, deaths and migration. Birth and death rates are given per 1000 people a year. Natural growth rate = birth rate − death rate. If birth rate is 22 and death rate 8, natural growth is 14 per 1000.
        check:
          prompt: Birth rate 25, death rate 10 per 1000. What is the natural growth rate?
          options:
          - 15 per 1000
          - 35 per 1000
          - 2.5 per 1000
          answer: 15 per 1000
          why: 25 − 10 = 15.
      - teach: 'Countries pass through a demographic transition. First, birth and death rates are both high: slow growth. Then medicine lowers death rates while birth rates stay high: fast growth. Finally birth rates fall too: slow growth again. Kerala reached the last stage early.'
        picture:
          kind: flow
          steps:
          - 'High births, high deaths: slow growth'
          - 'Deaths fall, births high: fast growth'
          - 'Births fall too: slow growth'
          alt: The three stages of the demographic transition.
        check:
          prompt: In which stage does population grow fastest?
          options:
          - When deaths fall but births stay high
          - When both are high
          - When both are low
