# Class 9 Social Science I, chapter 1. Format: content/README.md.
subject: ss
chapter: 1
title: Moving Forward from the Stone Age

tips:
  soft_metal: Copper is soft and bends easily, so it blunts against hard soil. Which metal came later and stays sharp?
  planned_town: "A planned town is laid out before anyone builds. Look for the choice that shows one pattern and shared services for the whole town."
  composite_tools: "A tiny blade alone is hard to hold. What could you make by setting several of them into a wooden or bone handle?"
  seals_far: "Seals were pressed on goods to mark them. If Harappan seals turn up far away, what must have travelled there?"
  both_bce: "When both dates are BCE, the gap between them is the bigger number minus the smaller one."
  no_writing: "For a time that left almost no writing, what kind of evidence do historians have to rely on?"
  bce_earlier: "In BCE, the bigger number is earlier. Which came first, 1900 BCE or 1200 BCE?"
  k9_urn_burial: "Think of the shape of the grave: a big pot that held remains. Megaliths of upright stones with a flat top are a different type."
  stone_age_order: "The names go Old → Middle → New: palaeo = old, meso = middle, neo = new. 'Chalco' comes from the Greek word for copper, and 'lithic' means stone."
  neolithic_farming: "The Stone Age has Old, Middle and New stages. Farming, pottery and polished tools mark the last of these, when people settled down and needed to store grain."
  microliths: "Tiny, sharp stone tools fixed to wooden or bone handles are called microliths; they belong to the Mesolithic age."
  harappan_sites: "Each site is known for one thing: a big public bathing tank, a dockyard for boats on the Gujarat coast, or being found first in the early 1920s. Bhimbetka is much older, with Stone Age rock art."
  harappan_script: "The Harappan script has not yet been read (deciphered), so we learn about Harappa mainly from archaeology."
  bronze_alloy: "Bronze is an alloy of copper and tin; the Harappan civilisation is a Bronze Age civilisation."
  megalith_types: "Big-stone burials in Kerala come from the age after copper, when a harder metal was used. Burying tools and pots with the dead shows what people believed about what comes next. A large clay pot burial is called nannangadi."
  bce_counting: "Years BCE count backwards: 2500 BCE is 2500 years before year 1 CE. To find the gap to a CE year, add the two numbers."
  edakkal_wayanad: "The Edakkal caves are high in the hills of north-east Kerala, in the district famous for coffee, tea and the Western Ghats."
  harappa_planning: "Grid streets and covered drains show careful planning. Harappan cities had brick houses and roads."
  iron_farming: "Iron tools were strong enough to clear forests and plough hard soil. They didn't make seeds grow faster."
  age_by_tools: Each age is named after what people mostly made their tools from. Think of what they used before metals.
  settle_needs: People who stay in one place to farm need things that hunters on the move do not. What would you need to keep a harvest?
  old_middle_new: Palaeo means old, meso middle and neo new. Put the ages in that order.
  grid_and_drains: Look for something that only works if the whole town was laid out in advance.
  trade_clues: Things made in one place and found far away must have been carried there.
  stones_or_pots: Megaliths are graves marked by big stones. Some Kerala burials used large pots instead.
  bce_gap: When both years are BCE, take the smaller from the bigger to find the gap.

concepts:
  - code: ss9.stoneage.ages
    title: The Stone Age
    notes: |
      Early humans used stone tools, so this long period is called the Stone Age. Palaeolithic (Old
      Stone Age): hunting and gathering, rough hand axes and choppers, use of fire, rock shelters
      (Bhimbetka in Madhya Pradesh has rock paintings). Mesolithic (Middle Stone Age): microliths, the
      first domestication of animals. Neolithic (New Stone Age): farming, settled villages, polished
      stone tools, pottery, the wheel (Mehrgarh in present-day Pakistan is an early farming village).
      Chalcolithic age: copper used along with stone.
    explanations:
      text: "For hundreds of thousands of years people lived by hunting and gathering, using rough stone tools. Slowly they made tools smaller and sharper, and later they learned to grow crops and keep animals. Farming meant staying in one place, so villages, pots for storing grain and polished tools appeared. That big change is the Neolithic revolution."
      visual: "Draw a timeline arrow with four boxes: Palaeolithic (hand axe, fire), Mesolithic (microliths, dog), Neolithic (wheat, pot, hut), Chalcolithic (copper axe)."
      step_by_step: "Which age does a clay storage pot with grain belong to? Step 1: Storing grain means farming. Step 2: Farming and pottery began in the Neolithic. Step 3: So it belongs to the Neolithic age."
      real_world: "The rock paintings of Bhimbetka, a UNESCO World Heritage site, show hunting scenes painted thousands of years ago."
    activity:
      type: order
      prompt: Put the ages in the order they came.
      steps:
      - 'Palaeolithic: hunting, gathering, rough hand axes, fire'
      - 'Mesolithic: tiny microliths, the first tamed animals'
      - 'Neolithic: farming, villages, pottery, polished tools'
      - 'Chalcolithic: copper used along with stone'
      reasons:
        'Mesolithic: tiny microliths, the first tamed animals': Microliths are smaller, sharper tools than rough hand axes, and taming animals came after a long time of only hunting.
        'Neolithic: farming, villages, pottery, polished tools': Farming needs settled life and storage pots. It came after people had learned to tame animals.
        'Chalcolithic: copper used along with stone': 'Copper came last: people still used stone, but had learned to work metal.'
    lesson:
      - teach: For hundreds of thousands of years, early humans made their tools from stone. So this long time is called the Stone Age. Historians learn about it from tools, bones, cave paintings and the remains of camps.
        check:
          prompt: Why is it called the Stone Age?
          options:
          - People made their tools mainly from stone
          - People lived only in stone houses
          - Everything was carved in stone writing
          answer: People made their tools mainly from stone
          why: Ages are named after the main material of tools.
      - teach: In the Palaeolithic (Old Stone) age people hunted and gathered, used rough hand axes, learned to use fire and lived in caves and rock shelters, like Bhimbetka with its paintings. In the Mesolithic (Middle Stone) age they made microliths, tiny sharp blades set in handles, and tamed the first animals.
        picture:
          kind: flow
          steps:
          - 'Palaeolithic: hunting, hand axes, fire'
          - 'Mesolithic: microliths, first tamed animals'
          - 'Neolithic: farming, villages, pottery'
          - 'Chalcolithic: copper with stone'
          alt: The Stone Age periods in order, with what changed in each.
        check:
          prompt: 'Tiny sharp stone blades fixed into handles are called:'
          options:
          - Microliths
          - Megaliths
          - Hand axes
          answer: Microliths
          why: Micro means small; lith means stone.
      - teach: In the Neolithic (New Stone) age people began to farm. Farmers stayed in one place, so villages grew. They made pottery to store grain, polished stone tools, and later the wheel. Mehrgarh is an early farming village. Next came the Chalcolithic age, when copper was used along with stone.
        check:
          prompt: Why did pottery become common after farming began?
          options:
          - Farmers needed to store and cook grain
          - Pots were used as weapons
          - Hunters carried pots on long trips
          answer: Farmers needed to store and cook grain
          why: Settled farmers had harvests to store.
    items:
      - prompt: "In which age did people first begin farming?"
        options: ["Neolithic age", "Palaeolithic age", "Mesolithic age", "Iron age"]
        answer: "Neolithic age"
        difficulty: 1
        hints: ["The 'New' Stone Age."]
        solution: "Agriculture began in the Neolithic age."
        mistakes: {"Palaeolithic age": neolithic_farming, "Mesolithic age": neolithic_farming}
      - prompt: "What are microliths?"
        options: ["Very small, sharp stone tools", "Large stone burial monuments", "Copper tools", "Clay pots"]
        answer: "Very small, sharp stone tools"
        difficulty: 1
        hints: ["Micro means small."]
        solution: "Microliths are tiny stone blades fixed to handles, typical of the Mesolithic."
        mistakes: {"Large stone burial monuments": microliths}
      - prompt: "Which is the correct order of the Stone Age periods?"
        options: ["Palaeolithic, Mesolithic, Neolithic", "Neolithic, Mesolithic, Palaeolithic", "Mesolithic, Palaeolithic, Neolithic", "Palaeolithic, Neolithic, Mesolithic"]
        answer: "Palaeolithic, Mesolithic, Neolithic"
        difficulty: 2
        hints: ["Old, Middle, New."]
        solution: "Palaeo = old, Meso = middle, Neo = new."
        mistakes: {"Neolithic, Mesolithic, Palaeolithic": stone_age_order, "Palaeolithic, Neolithic, Mesolithic": stone_age_order}
      - prompt: "Bhimbetka in Madhya Pradesh is famous for:"
        options: ["Rock shelters with paintings", "A dockyard", "The Great Bath", "Megalithic urns"]
        answer: "Rock shelters with paintings"
        difficulty: 2
        hints: ["Early humans lived in caves and shelters."]
        solution: "Bhimbetka's rock shelters have Stone Age paintings."
        mistakes: {"The Great Bath": harappan_sites}
      - prompt: "The Chalcolithic age is named after people using which two materials?"
        options: ["Copper and stone", "Iron and stone", "Bronze and gold", "Wood and bone"]
        answer: "Copper and stone"
        difficulty: 2
        hints: ["Chalco means copper."]
        solution: "Chalcolithic = copper + stone."
        mistakes: {"Iron and stone": stone_age_order}
      - prompt: "Why did villages and pottery appear along with farming?"
        options: ["Farmers stayed in one place and needed to store grain", "People stopped eating meat", "Rivers dried up", "Metal tools were invented"]
        answer: "Farmers stayed in one place and needed to store grain"
        difficulty: 3
        hints: ["Crops need looking after until harvest."]
        solution: "Farming made people settle near their fields and store surplus grain in pots."
        mistakes: {"Metal tools were invented": neolithic_farming}
      - prompt: "Put these in the order they first happened: farming, the use of fire, the use of copper."
        options: ["Fire, farming, copper", "Farming, fire, copper", "Copper, fire, farming", "Fire, copper, farming"]
        answer: "Fire, farming, copper"
        difficulty: 3
        hints: ["Palaeolithic people already used fire.", "Copper gives its name to the age after the Neolithic."]
        solution: "Step 1: Fire was used in the Palaeolithic. Step 2: Farming began in the Neolithic. Step 3: Copper came with the Chalcolithic age, after that."
        mistakes: {"Farming, fire, copper": stone_age_order, "Copper, fire, farming": stone_age_order, "Fire, copper, farming": stone_age_order}
      - prompt: "Mesolithic people often fixed several microliths into wooden or bone handles. What does this tell us?"
        options: ["They made composite tools such as arrows, harpoons and sickles", "They could not shape stone", "They had begun using iron", "They had stopped hunting"]
        answer: "They made composite tools such as arrows, harpoons and sickles"
        difficulty: 3
        hints: ["A microlith is a tiny sharp blade.", "What can you make by setting small blades in a row in a handle?"]
        solution: "Step 1: Microliths were too small to use alone. Step 2: Set into handles, they made arrows, spears, harpoons and sickles: composite tools."
        mistakes: {"They could not shape stone": composite_tools, "They had begun using iron": composite_tools, "They had stopped hunting": composite_tools}
      - prompt: In which age did people mainly live by hunting and gathering, using rough hand axes?
        options:
        - Palaeolithic age
        - Neolithic age
        - Chalcolithic age
        - Iron Age
        answer: Palaeolithic age
        difficulty: 1
        hints:
        - This is the oldest part of the Stone Age.
        - Farming had not begun yet.
        solution: 'Step 1: Farming began in the Neolithic. Step 2: Before that, people hunted and gathered. Step 3: The earliest stage, with hand axes, is the Palaeolithic.'
        mistakes:
          Neolithic age: old_middle_new
      - prompt: Which was one of the earliest discoveries of Palaeolithic people?
        options:
        - Using fire
        - Making iron ploughs
        - Writing on clay tablets
        - Building brick cities
        answer: Using fire
        difficulty: 1
        hints:
        - Think of the oldest stage, long before metals or towns.
        - What helped them keep warm and cook?
        solution: 'Step 1: Iron, writing and cities came much later. Step 2: Old Stone Age people learned to control flames. Step 3: Using fire was one of their great discoveries.'
        mistakes:
          Building brick cities: age_by_tools
      - prompt: 'The Mesolithic age is also called the:'
        options:
        - Middle Stone Age
        - Old Stone Age
        - New Stone Age
        - Copper Age
        answer: Middle Stone Age
        difficulty: 1
        hints:
        - '''Meso'' has a meaning.'
        - It comes between the Old and the New.
        solution: 'Step 1: Palaeo = old, meso = middle, neo = new. Step 2: Lithic = stone. Step 3: Mesolithic = Middle Stone Age.'
        mistakes:
          New Stone Age: old_middle_new
      - prompt: 'Mehrgarh is important because it is:'
        options:
        - One of the earliest farming villages
        - A Harappan port
        - An Iron Age burial site
        - A Stone Age cave with paintings
        answer: One of the earliest farming villages
        difficulty: 2
        hints:
        - It belongs to the Neolithic age.
        - What began in that age?
        solution: 'Step 1: Mehrgarh is a Neolithic site. Step 2: Remains of wheat, barley and tamed animals were found. Step 3: It is one of the earliest farming villages.'
        mistakes:
          A Stone Age cave with paintings: settle_needs
      - prompt: Which change came with farming in the Neolithic age?
        options:
        - People began living in settled villages
        - People stopped using stone tools forever
        - People began using iron
        - People moved every few days
        answer: People began living in settled villages
        difficulty: 2
        hints:
        - Farmers must look after their crops.
        - Can they keep moving?
        solution: 'Step 1: Crops need care until harvest. Step 2: Farmers had to stay near their fields. Step 3: Settled villages grew.'
        mistakes:
          People moved every few days: settle_needs
      - prompt: The Neolithic age is known for which kind of stone tools?
        options:
        - Polished stone tools
        - Rough, chipped hand axes only
        - No stone tools at all
        - Iron-tipped tools
        answer: Polished stone tools
        difficulty: 2
        hints:
        - Tools got finer as time went on.
        - New Stone Age tools were rubbed smooth.
        solution: 'Step 1: Old Stone Age tools were rough and chipped. Step 2: New Stone Age tools were ground and smoothed. Step 3: They are called polished stone tools.'
        mistakes:
          Rough, chipped hand axes only: old_middle_new
      - prompt: Why is the age after the Neolithic called 'Chalcolithic'?
        options:
        - People used copper along with stone
        - People used only iron
        - People stopped making tools
        - People used gold for tools
        answer: People used copper along with stone
        difficulty: 3
        hints:
        - Break the word into two parts.
        - '''Lithic'' means stone; what does ''chalco'' mean?'
        solution: 'Step 1: Chalco = copper. Step 2: Lithic = stone. Step 3: Chalcolithic means the copper-and-stone age.'
        mistakes:
          People used only iron: age_by_tools

  - code: ss9.stoneage.harappa
    title: The Harappan civilisation
    after: [ss9.stoneage.ages]
    notes: |
      The Harappan (Indus Valley) civilisation flourished from about 2600 to 1900 BCE in the Indus
      and Ghaggar-Hakra basins. It was a Bronze Age civilisation (bronze = copper + tin). Harappa was
      found in 1921 (Daya Ram Sahni) and Mohenjo-daro in 1922 (R. D. Banerji). Features: planned
      cities on a grid, baked-brick houses, covered drains, a citadel and lower town, the Great Bath
      at Mohenjo-daro, granaries, a dockyard at Lothal (Gujarat), seals, standard weights, trade with
      Mesopotamia. Other sites: Dholavira, Kalibangan, Rakhigarhi. The script is still not
      deciphered. Decline after about 1900 BCE is linked to climate change, floods and shifts of rivers.
    explanations:
      text: "Over 4,500 years ago people in the Indus valley built cities with straight streets crossing at right angles, brick houses with bathrooms and covered drains running under the streets. They traded beads and cotton as far as Mesopotamia. We can see their seals with writing, but nobody has yet managed to read the script."
      visual: "Draw a city map: a raised citadel on the west with the Great Bath and granary, a lower town to the east, straight streets in a grid, and drains along every street."
      step_by_step: "Why is Harappa called a Bronze Age civilisation? Step 1: Its people made tools from bronze. Step 2: Bronze is copper mixed with tin. Step 3: Using this metal marks the Bronze Age."
      real_world: "Dholavira in Gujarat, with its clever water reservoirs, became a UNESCO World Heritage site in 2021."
    activity:
      type: sort
      prompt: Would you find this in a Harappan city?
      bins:
      - Found in Harappan cities
      - From a later age
      items:
      - label: Covered drains along grid streets
        bin: Found in Harappan cities
        clue: Think of the planned towns of Mohenjo-daro.
        why: Harappan towns had baked-brick houses and covered drains.
      - label: A dockyard at Lothal
        bin: Found in Harappan cities
        clue: Lothal is in Gujarat, a trading site of 2600–1900 BCE.
        why: Lothal's dockyard is Harappan.
      - label: Seals and standard weights for trade
        bin: Found in Harappan cities
        clue: They traded with Mesopotamia.
        why: Seals and weights are Harappan.
      - label: A bronze tool (copper + tin)
        bin: Found in Harappan cities
        clue: Which metal age was this civilisation?
        why: Harappa was a Bronze Age civilisation.
      - label: Iron ploughs that cleared forests
        bin: From a later age
        clue: Iron came into use from about 1200 BCE.
        why: Harappa ended about 1900 BCE, before iron spread.
      - label: Ashoka's edicts in the Brahmi script
        bin: From a later age
        clue: Ashoka ruled in the 3rd century BCE.
        why: Harappan script is still not read; Brahmi edicts are Mauryan, much later.
      - label: Gold coins of a maharajadhiraja
        bin: From a later age
        clue: 'Grand titles and gold coins: which empire?'
        why: Gold coins are a Gupta-age feature, not Harappan.
    lesson:
      - teach: 'About 4,500 years ago, great cities grew along the Indus and Ghaggar-Hakra rivers: the Harappan (Indus Valley) civilisation, about 2600–1900 BCE. Harappa was found in 1921 and Mohenjo-daro in 1922. They used bronze, so it is a Bronze Age civilisation.'
        check:
          prompt: 'Bronze is made from copper and:'
          options:
          - Tin
          - Iron
          - Gold
          answer: Tin
          why: Bronze is an alloy of copper and tin.
      - teach: 'Harappan cities were planned: streets crossed at right angles, houses were of baked brick, and covered drains ran along the streets. A raised citadel stood apart from the lower town. Mohenjo-daro had the Great Bath; Lothal in Gujarat had a dockyard; there were granaries and standard weights.'
        picture:
          kind: compare
          columns:
          - title: Planning
            points:
            - grid streets
            - covered drains
            - baked bricks
          - title: Famous finds
            points:
            - 'Great Bath: Mohenjo-daro'
            - 'dockyard: Lothal'
            - granaries
          - title: Trade
            points:
            - seals
            - standard weights
            - links to Mesopotamia
          alt: Harappan planning, famous finds and trade.
        check:
          prompt: Which site had a dockyard?
          options:
          - Lothal
          - Mohenjo-daro
          - Bhimbetka
          answer: Lothal
          why: Lothal in Gujarat had a dockyard for boats.
      - teach: 'Harappans traded far: their seals have been found in Mesopotamia (Iraq). But we cannot read their script, so we learn about them from archaeology. After about 1900 BCE the cities declined, probably because of climate change, floods and rivers changing course.'
        check:
          prompt: Why do we depend on archaeology to know the Harappans?
          options:
          - Their script has not been deciphered
          - They had no towns
          - They left no objects
          answer: Their script has not been deciphered
          why: We can't read their writing, so objects and buildings are our evidence.
    items:
      - prompt: "Where was the Great Bath found?"
        options: ["Mohenjo-daro", "Lothal", "Harappa", "Kalibangan"]
        answer: "Mohenjo-daro"
        difficulty: 1
        hints: ["The largest Harappan city."]
        solution: "The Great Bath is at Mohenjo-daro."
        mistakes: {"Lothal": harappan_sites, "Harappa": harappan_sites}
      - prompt: "Which Harappan site had a dockyard?"
        options: ["Lothal", "Mohenjo-daro", "Bhimbetka", "Edakkal"]
        answer: "Lothal"
        difficulty: 1
        hints: ["In Gujarat, near the sea."]
        solution: "Lothal had a dockyard for boats."
        mistakes: {"Mohenjo-daro": harappan_sites}
      - prompt: "In which year was Harappa discovered?"
        answer: "1921"
        check: "1921"
        difficulty: 2
        hints: ["One year before Mohenjo-daro (1922)."]
        solution: "Daya Ram Sahni excavated Harappa in 1921."
        mistakes: {"1922": harappan_sites}
      - prompt: "Bronze is an alloy of copper and:"
        options: ["Tin", "Iron", "Zinc", "Gold"]
        answer: "Tin"
        difficulty: 1
        hints: ["Brass is copper and zinc."]
        solution: "Bronze = copper + tin."
        mistakes: {"Zinc": bronze_alloy, "Iron": bronze_alloy}
      - prompt: "Why do we depend mostly on archaeology to learn about the Harappans?"
        options: ["Their script has not been deciphered", "They did not build cities", "They left no objects behind", "They had no trade"]
        answer: "Their script has not been deciphered"
        difficulty: 2
        hints: ["We have their writing but cannot read it."]
        solution: "Since the script cannot be read, buildings, seals and objects are our main sources."
        mistakes: {"They left no objects behind": harappan_script}
      - prompt: "Which feature shows that Harappan cities were carefully planned?"
        options: ["Streets crossing at right angles and covered drains", "Houses built anywhere", "No roads at all", "Mud huts only"]
        answer: "Streets crossing at right angles and covered drains"
        difficulty: 2
        hints: ["Think of a grid."]
        solution: "Grid streets and an underground drainage system show town planning."
        mistakes: {"Houses built anywhere": "harappa_planning", "No roads at all": "harappa_planning"}
      - prompt: "Harappan cities flourished around 2500 BCE. About how many years before 2000 CE was that?"
        answer: "4500"
        check: "2500 + 2000"
        difficulty: 3
        hints: ["Add the BCE years and the CE years."]
        solution: "2500 years before CE began, plus 2000 years after: 4500 years."
        mistakes: {"500": bce_counting}
      - prompt: "Harappan seals have been found in Mesopotamia (present-day Iraq). What does this suggest?"
        options: ["The Harappans traded with distant lands", "Mesopotamia ruled the Harappan cities", "The Harappan script has been read", "The Harappans used iron"]
        answer: "The Harappans traded with distant lands"
        difficulty: 2
        hints: ["What were seals used for?", "How could a seal reach a land so far away?"]
        solution: "Step 1: Seals marked goods for trade. Step 2: Finding them in Mesopotamia shows that Harappan goods, and traders, reached there."
        mistakes: {"Mesopotamia ruled the Harappan cities": seals_far, "The Harappan script has been read": harappan_script, "The Harappans used iron": seals_far}
      - prompt: "The Harappan civilisation flourished from about 2600 BCE to 1900 BCE. For about how many years did it flourish?"
        answer: "700"
        check: "2600-1900"
        difficulty: 2
        hints: ["Both dates are BCE.", "Years BCE count down towards 1 CE."]
        solution: "Step 1: From 2600 BCE to 1900 BCE, the numbers fall by 700. Step 2: About 700 years."
        mistakes: {"4500": both_bce, "-700": both_bce}
      - prompt: "Which feature of Harappan cities best shows careful town planning?"
        options:
        - "Streets on a grid with covered drains along them"
        - "Houses built anywhere along winding lanes"
        - "No drains, with waste thrown on the streets"
        - "Only temples and no houses"
        answer: "Streets on a grid with covered drains along them"
        difficulty: 3
        hints: ["Planning means deciding the layout before building.", "Which choice shows a pattern and services built for the whole city?"]
        solution: "Step 1: Harappan streets crossed at right angles like a grid. Step 2: Covered drains ran along them, linked to houses. Step 3: This needed planning for the whole city."
        mistakes: {"Houses built anywhere along winding lanes": planned_town, "No drains, with waste thrown on the streets": planned_town}
      - prompt: Who discovered Harappa in 1921?
        options:
        - Daya Ram Sahni
        - R. D. Banerji
        - Megasthenes
        - Ashoka
        answer: Daya Ram Sahni
        difficulty: 2
        hints:
        - Two archaeologists are linked with the first two sites.
        - One found Harappa, the other Mohenjo-daro a year later.
        solution: 'Step 1: Harappa was found in 1921. Step 2: Mohenjo-daro was found in 1922 by R. D. Banerji. Step 3: Harappa was found by Daya Ram Sahni.'
        mistakes:
          R. D. Banerji: harappan_sites
      - prompt: Which of these is a Harappan site in present-day India?
        options:
        - Dholavira
        - Bhimbetka
        - Edakkal
        - Mehrgarh
        answer: Dholavira
        difficulty: 1
        hints:
        - Bhimbetka and Edakkal are much older or later rock sites.
        - Which one is a Harappan city in Gujarat?
        solution: 'Step 1: Bhimbetka has Stone Age art; Edakkal has engravings in Kerala; Mehrgarh is a Neolithic village. Step 2: Dholavira is a Harappan city in Kutch, Gujarat. Step 3: Dholavira.'
        mistakes:
          Mehrgarh: harappan_sites
      - prompt: What were Harappan seals mainly used for?
        options:
        - Marking goods for trade
        - Fighting wars
        - Cooking food
        - Ploughing fields
        answer: Marking goods for trade
        difficulty: 2
        hints:
        - Seals were pressed into clay.
        - Why would a trader mark a bundle?
        solution: 'Step 1: Seals were pressed on clay over goods. Step 2: This showed who owned or sent them. Step 3: They were used to mark goods in trade.'
        mistakes:
          Fighting wars: trade_clues
      - prompt: The Great Bath was found at Mohenjo-daro in 1922. How many years before 2022 was that?
        answer: '100'
        check: 2022-1922
        difficulty: 1
        hints:
        - Both years are CE.
        - Subtract the earlier year from the later one.
        solution: 'Step 1: 2022 − 1922. Step 2: = 100. Step 3: It was found 100 years before 2022.'
        mistakes:
          '3944': bce_counting
      - prompt: Which is a likely reason for the decline of Harappan cities?
        options:
        - Climate change, floods and rivers changing course
        - The arrival of the British
        - Use of iron weapons by Ashoka
        - Too many trains
        answer: Climate change, floods and rivers changing course
        difficulty: 2
        hints:
        - Think of the natural causes historians suggest.
