  - code: ss9.stoneage.iron
    title: The Iron Age and megaliths in Kerala
    after: [ss9.stoneage.harappa]
    notes: |
      Iron came into use in India from about 1200 BCE (earlier in some places). Iron tools helped
      clear forests and spread farming. In South India and Kerala the Iron Age is known mostly from
      megaliths, burial monuments made with large stones: umbrella stones (kudakkallu), hood stones
      (thoppikkallu), dolmens, cists, rock-cut caves and urn burials (nannangadi). Iron tools,
      pottery and beads are found inside them. The Edakkal caves in Wayanad have ancient rock
      engravings. Megaliths show belief in life after death and settled communities.
    explanations:
      text: "Iron is harder than copper and bronze, and iron ores were easy to find. Iron axes and ploughs let people clear thick forests and farm more land. In Kerala you can still see the burial stones of Iron Age people: big umbrella-shaped stones over graves, and large clay urns with iron tools and pots inside."
      visual: "Sketch an umbrella stone (a flat dome on four legs), a hood stone (a single dome on the ground) and a large clay urn half buried in the soil."
      step_by_step: "A grave with iron swords and black-and-red pots under a dome-shaped laterite stone is found in Thrissur. Step 1: Large stones over a burial: megalith. Step 2: Iron objects: Iron Age. Step 3: It is an Iron Age megalithic burial."
      real_world: "Umbrella stones (kudakkallu) can still be seen at Ariyannur in Thrissur district, protected as monuments."
    activity:
      type: sort
      prompt: Which age does this find belong to?
      bins:
      - Stone Age
      - Bronze Age (Harappan)
      - Iron Age (megaliths)
      items:
      - label: Tiny microlith blades
        bin: Stone Age
        clue: Small sharp stone tools, no metal.
        why: Microliths are Mesolithic, Stone Age.
      - label: Rock paintings of hunts at Bhimbetka
        bin: Stone Age
        clue: Painted by hunter-gatherers in rock shelters.
        why: Bhimbetka is a Stone Age site.
      - label: The Great Bath at Mohenjo-daro
        bin: Bronze Age (Harappan)
        clue: A planned city with baked bricks.
        why: Mohenjo-daro is Harappan, Bronze Age.
      - label: An umbrella stone (kudakkallu) in Thrissur
        bin: Iron Age (megaliths)
        clue: A burial marked by a big stone.
        why: Kudakkallu are megaliths of Kerala's Iron Age.
      - label: A nannangadi urn with iron tools inside
        bin: Iron Age (megaliths)
        clue: Look at what metal is inside.
        why: Urn burials with iron tools are Iron Age.
      - label: A hood stone (thoppikkallu)
        bin: Iron Age (megaliths)
        clue: Another large-stone burial marker.
        why: Thoppikkallu are megaliths, Iron Age.
    lesson:
      - teach: From about 1200 BCE, people in India began to use iron. Iron is harder and more plentiful than copper. Iron axes cleared thick forests and iron ploughs broke hard soil, so farming spread and villages grew.
        check:
          prompt: How did iron tools help farming?
          options:
          - They cleared forests and ploughed hard soil
          - They made rain fall
          - They made seeds grow faster
          answer: They cleared forests and ploughed hard soil
          why: Strong iron tools opened new land for farming.
      - teach: In South India and Kerala, the Iron Age is known mostly from megaliths, graves marked by big stones. Kerala has umbrella stones (kudakkallu), hood stones (thoppikkallu), dolmens, cists, rock-cut caves and urn burials in big clay pots (nannangadi).
        picture:
          kind: compare
          columns:
          - title: Big-stone graves
            points:
            - kudakkallu (umbrella stone)
            - thoppikkallu (hood stone)
            - dolmens, cists
          - title: Other burials
            points:
            - rock-cut caves
            - nannangadi (urn burial)
          alt: Types of Iron Age burials found in Kerala.
        check:
          prompt: What is a nannangadi?
          options:
          - A burial in a large clay pot
          - A stone umbrella
          - A Harappan seal
          answer: A burial in a large clay pot
          why: Nannangadi means an urn burial.
      - teach: Inside megaliths, archaeologists find iron tools, pottery and beads. Burying useful things with the dead shows a belief in life after death. Since few written records survive, these graves are our main evidence. The Edakkal caves in Wayanad also have ancient rock engravings.
        check:
          prompt: Why are tools buried in megaliths?
          options:
          - People believed in life after death
          - To hide them from thieves
          - To make the soil fertile
          answer: People believed in life after death
          why: Things were placed for the dead to use.
