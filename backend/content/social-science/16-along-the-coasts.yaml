# Class 9 Social Science II, chapter 8 (stored as Social Science chapter 16). Format: content/README.md.
# Written from the 2024 SCERT Social Science II Part 2 text supplied by the school.
subject: ss
chapter: 16
title: Along the Coasts

tips:
  west_east_coast: "Western coastal plain: narrow (10–15 km), about 1840 km from Kachchh to Kanyakumari, between the Western Ghats and the Arabian Sea, a submerged coast with backwaters (kayals). Eastern coastal plain: wider, about 1800 km from the Mahanadi delta to Kanyakumari, between the Eastern Ghats and the Bay of Bengal, an emerged coast built by river deltas."
  coast_divisions: "West, north to south: Gujarat coast, Konkan coast (Daman to Goa, about 500 km), Malabar coast (Mangalore to Kanyakumari, about 580 km). East: Northern Circars (Mahanadi to Krishna delta) and Coromandel coast (Krishna delta to Kanyakumari)."
  islands: "Lakshadweep: coral islands in the Arabian Sea, 36 islands, 10 inhabited, capital Kavaratti, largest Androth. Andaman and Nicobar: volcanic islands in the Bay of Bengal, about 572 islands, 38 inhabited, capital Port Blair, separated by the 10 Degree Channel; Barren Island is India's only active volcano; Indira Point is India's southernmost point."
  wave_landforms: "Wave erosion: cliff → sea cave → sea arch (two caves join) → sea stack (arch roof falls). Wave deposition: beach (between high and low tide limits), sand bar (parallel to coast), spit (sand bar joined to land), lagoon behind it."
  coastal_climate: "Coasts have a moderate climate because of the sea. Day: land heats fast, low pressure over land, sea breeze blows from sea to land. Night: land cools fast, land breeze blows from land to sea. The Coromandel coast gets rain in October–November from the northeast (retreating) monsoon; in Kerala this is Thulavarsham."
  coastal_resources: "Coastal soils: alluvial on the east coast, sandy, laterite, black and peaty on the west. Mangroves (largest: Sundarbans) protect coasts; International Mangrove Day is 26 July. Black sand at Chavara in Kollam holds rare earth minerals. Coasts are densely populated; Mumbai, Chennai and Kolkata grew on them."

concepts:
  - code: ss9.coasts.western
    title: Western coastal plain
    notes: |
      India's coastline is about 7517 km including Lakshadweep and the Andaman and Nicobar Islands.
      Coastal plains are densely populated: plain land, favourable climate, water. Emerged coast: land
      rises or sea falls through tectonic uplift. Submerged coast: land subsides and sea rises. The
      Western coastal plain is a narrow strip between the Peninsular Plateau and the Arabian Sea, about
      1840 km from Kachchh to Kanyakumari, 10–15 km wide, a submerged coast, with backwaters (kayals).
      Three divisions. Gujarat coast: Rann of Kachchh, Kachchh and Saurashtra coasts, Daman and Diu, Dadra
      and Nagar Haveli; formed by deposits of the Mahi and Sabarmati; Alang (graveyard of ships), Surat
      and Vadodara (cotton textiles), Veraval fishing harbour, Dandi beach, salt flats. Rann of Kachchh:
      salt marsh on the India–Pakistan border ('Rann' = desert in Gujarati), about 26,000 sq km, Greater
      and Little Rann; Rann Utsav from November to February. Konkan coast: Daman to Goa, about 500 km,
      narrow because the Western Ghats run parallel; sandy north, rocky south; cliffs, islands, beaches;
      heavy rain; Nhava Sheva (Navi Mumbai), Mormugao, Malpe; St. Mary's Island off Malpe has hexagonal
      columnar-joint rocks from lava about 88 million years ago. Malabar coast: Mangalore to Kanyakumari,
      about 580 km, wider than the Konkan; cliffs, sea stacks, beaches, estuaries, sand bars, kayals like
      Vembanad; Kottapuram–Kollam waterway is National Waterway 3; raised coast at Varkala, Ezhimala,
      Bekal; beaches Muzhuppilangad, Chavakkad, Kovalam; bird sanctuaries Kadalundi, Kumarakom,
      Pathiramanal; rice lands Nanjinad, Kuttanad, Kole; harbours Neendakara, Munambam, Ponnani, Beypore.
    explanations:
      text: "The west coast is a thin strip squeezed between the Western Ghats and the Arabian Sea. From north to south it is the Gujarat coast, the Konkan coast and the Malabar coast, which includes Kerala."
      visual: "Picture India's west edge as a ribbon: wide salty marsh at the top (Rann of Kachchh), a narrow rocky middle (Konkan), and green backwaters at the bottom (Malabar, Kerala)."
      step_by_step: "To place a west-coast place: Step 1: Gujarat (Alang, Surat, Dandi, Rann)? Gujarat coast. Step 2: Daman to Goa (Mumbai, Mormugao, Malpe)? Konkan coast. Step 3: Mangalore to Kanyakumari (Vembanad, Kovalam, Bekal)? Malabar coast."
      real_world: "A houseboat ride on Vembanad Lake travels part of National Waterway 3, which runs from Kottapuram to Kollam."
    items:
      - prompt: "The western coastal plain lies between the Western Ghats and"
        options: ["The Arabian Sea", "The Bay of Bengal", "The Indian Ocean only", "The Eastern Ghats"]
        answer: "The Arabian Sea"
        difficulty: 1
        hints: ["Kerala is on this coast."]
        solution: "The Arabian Sea."
        mistakes: {"The Bay of Bengal": west_east_coast}
      - prompt: "Backwaters along the western coast are also called"
        options: ["Kayals", "Rohi", "Deltas", "Lagoons only in Gujarat"]
        answer: "Kayals"
        difficulty: 1
        hints: ["Vembanad is one."]
        solution: "Kayals."
        mistakes: {"Deltas": west_east_coast}
      - prompt: "Which coast stretches from Mangalore to Kanyakumari?"
        options: ["Malabar coast", "Konkan coast", "Coromandel coast", "Gujarat coast"]
        answer: "Malabar coast"
        difficulty: 1
        hints: ["It is about 580 km long."]
        solution: "The Malabar coast."
        mistakes: {"Konkan coast": coast_divisions}
      - prompt: "Alang on the Gujarat coast is known as"
        options: ["The graveyard of ships", "The rocket launching station", "The largest salt lake", "The capital of Lakshadweep"]
        answer: "The graveyard of ships"
        difficulty: 2
        hints: ["Old ships are broken up there."]
        solution: "It is a ship-dismantling centre, called the graveyard of ships."
        mistakes: {"The rocket launching station": coast_divisions}
      - prompt: "National Waterway 3 runs between Kottapuram and"
        options: ["Kollam", "Kochi only", "Kozhikode", "Mangalore"]
        answer: "Kollam"
        difficulty: 2
        hints: ["It links Kerala's backwaters in the south."]
        solution: "Kottapuram to Kollam."
        mistakes: {"Kozhikode": coast_divisions}
      - prompt: "Why is the Konkan coastal plain narrow?"
        options: ["The Western Ghats run parallel and close to the coast", "Rivers have built wide deltas", "It is covered by sand dunes", "The sea is very shallow"]
        answer: "The Western Ghats run parallel and close to the coast"
        difficulty: 2
        hints: ["Look at what lies just east of it."]
        solution: "The Ghats are close to the sea, leaving a narrow strip."
        mistakes: {"Rivers have built wide deltas": west_east_coast}
      - prompt: "The western coastal plain is about 1840 km long and the Malabar coast about 580 km. How many km of it lie outside the Malabar coast?"
        answer: "1260"
        check: "1840 - 580"
        difficulty: 2
        hints: ["Subtract."]
        solution: "1840 − 580 = 1260 km (Gujarat and Konkan coasts)."
        mistakes: {"2420": coast_divisions}
      - prompt: "The Rann of Kachchh is best described as"
        options: ["A salt marsh that floods in the rains and dries into a salt desert", "A coral island", "A freshwater lake", "A mangrove forest"]
        answer: "A salt marsh that floods in the rains and dries into a salt desert"
        difficulty: 2
        hints: ["'Rann' means desert in Gujarati."]
        solution: "It is a salt marsh of about 26,000 sq km, with a Greater and a Little Rann."
        mistakes: {"A freshwater lake": coast_divisions}
      - prompt: "The western coast is a submerged coast. What does that mean?"
        options: ["The coastal land sank and the sea level rose", "The land rose and the sea fell", "It is under the sea all year", "It has no beaches"]
        answer: "The coastal land sank and the sea level rose"
        difficulty: 3
        hints: ["The opposite is an emerged coast."]
        solution: "Subsidence lowered the land relative to the sea."
        mistakes: {"The land rose and the sea fell": west_east_coast}

  - code: ss9.coasts.eastern_islands
    title: Eastern coastal plain and the islands
    after: [ss9.coasts.western]
    notes: |
      The Eastern coastal plain is wider, between the Eastern Ghats and the Bay of Bengal, about 1800 km
      from the Mahanadi delta to Kanyakumari, formed by deposits of the Mahanadi, Godavari, Krishna and
      Kaveri; an emerged coast with deltas. Northern Circars: Mahanadi delta to Krishna delta, in Odisha
      (Utkal Plain) and Andhra Pradesh (Andhra Plain); Chilika Lake (one of India's largest) and Kolleru
      Lake; fewer ports than the west, mainly Visakhapatnam and Machilipatnam (Masulipatnam). Coromandel
      coast: Krishna delta to Kanyakumari, including the Kaveri delta; rice; Pulicat Lake with Sriharikota
      rocket launching station; Point Calimere and Pichavaram mangroves; Nagapattinam and Cuddalore
      fishing harbours; Marina Beach in Chennai. Lakshadweep: coral islands in the Arabian Sea 280–480 km
      from Kerala; 36 islands, 10 inhabited; capital Kavaratti; largest Androth; fishing (tuna, 'mass' of
      dried tuna), coconut, copra, coir, tourism, scuba diving. Coral reefs form from calcium carbonate of
      coral polyps over hundreds of years in shallow, clear, tropical seas; also in the Gulf of Kachchh,
      Gulf of Mannar and Andaman and Nicobar. Andaman and Nicobar: volcanic islands in the Bay of Bengal,
      about 572 islands, 38 inhabited, mostly by indigenous tribes; 10 Degree Channel separates the
      Andaman and Nicobar groups; Barren Island is India's only active volcano; capital Port Blair; Indira
      Point on Great Nicobar is India's southernmost point; tropical evergreen forests; affected by the
      2004 tsunami.
    explanations:
      text: "The east coast is wide because big rivers built deltas there. It has two parts, the Northern Circars and the Coromandel coast. India's two island groups are coral Lakshadweep in the west and volcanic Andaman and Nicobar in the east."
      visual: "On the map, follow the east coast from Odisha down to Kanyakumari and mark four river deltas: Mahanadi, Godavari, Krishna, Kaveri. Then put a dot cluster in the Arabian Sea (Lakshadweep) and a long chain in the Bay of Bengal (Andaman and Nicobar)."
      step_by_step: "To sort an island fact: Step 1: coral, Arabian Sea, Kavaratti, tuna? Lakshadweep. Step 2: volcanic, Bay of Bengal, Port Blair, Barren Island, Indira Point? Andaman and Nicobar."
      real_world: "Every ISRO launch you see on TV lifts off from Sriharikota, on the shore of Pulicat Lake on the Coromandel coast."
    items:
      - prompt: "Which coast extends from the Mahanadi delta to the Krishna delta?"
        options: ["Northern Circars", "Coromandel coast", "Konkan coast", "Malabar coast"]
        answer: "Northern Circars"
        difficulty: 1
        hints: ["It covers Odisha and Andhra Pradesh."]
        solution: "The Northern Circars."
        mistakes: {"Coromandel coast": coast_divisions}
      - prompt: "India's rocket launching station Sriharikota is on the shore of"
        options: ["Pulicat Lake", "Chilika Lake", "Vembanad Lake", "Kolleru Lake"]
        answer: "Pulicat Lake"
        difficulty: 1
        hints: ["It is on the Coromandel coast."]
        solution: "Pulicat Lake."
        mistakes: {"Chilika Lake": coast_divisions}
      - prompt: "What is the capital of Lakshadweep?"
        options: ["Kavaratti", "Androth", "Port Blair", "Agatti"]
        answer: "Kavaratti"
        difficulty: 1
        hints: ["Androth is the largest island."]
        solution: "Kavaratti."
        mistakes: {"Port Blair": islands}
      - prompt: "India's only active volcano is"
        options: ["Barren Island", "Kavaratti", "St. Mary's Island", "Great Nicobar"]
        answer: "Barren Island"
        difficulty: 1
        hints: ["It is in the Andaman and Nicobar group."]
        solution: "Barren Island."
        mistakes: {"St. Mary's Island": islands}
      - prompt: "Out of 36 islands in Lakshadweep, 10 are inhabited. How many are uninhabited?"
        answer: "26"
        check: "36 - 10"
        difficulty: 1
        hints: ["Subtract."]
        solution: "36 − 10 = 26."
        mistakes: {"46": islands}
      - prompt: "The sea separating the Andaman Islands from the Nicobar Islands is the"
        options: ["10 Degree Channel", "Palk Strait", "Gulf of Mannar", "Rann of Kachchh"]
        answer: "10 Degree Channel"
        difficulty: 2
        hints: ["It is named after a line of latitude."]
        solution: "The 10 Degree Channel."
        mistakes: {"Palk Strait": islands}
      - prompt: "The Lakshadweep islands were formed by"
        options: ["Coral reefs", "Volcanic eruptions", "River deposits", "Glaciers"]
        answer: "Coral reefs"
        difficulty: 2
        hints: ["Andaman and Nicobar are the volcanic ones."]
        solution: "Coral reefs, built from calcium carbonate of coral polyps."
        mistakes: {"Volcanic eruptions": islands}
      - prompt: "India's southernmost point, Indira Point, is on"
        options: ["Great Nicobar Island", "Kanyakumari", "Androth Island", "Little Andaman"]
        answer: "Great Nicobar Island"
        difficulty: 2
        hints: ["It is further south than the mainland tip."]
        solution: "Great Nicobar Island."
        mistakes: {"Kanyakumari": islands}
      - prompt: "Andaman and Nicobar has about 572 islands, of which 38 are inhabited. How many are uninhabited?"
        answer: "534"
        check: "572 - 38"
        difficulty: 2
        hints: ["Subtract."]
        solution: "572 − 38 = 534."
        mistakes: {"610": islands}
      - prompt: "Why is the eastern coastal plain wider than the western?"
        options: ["Large rivers like the Mahanadi, Godavari, Krishna and Kaveri deposited wide deltas", "The Western Ghats are on the east", "It gets no rain", "It is made of coral"]
        answer: "Large rivers like the Mahanadi, Godavari, Krishna and Kaveri deposited wide deltas"
        difficulty: 3
        hints: ["Think of how it was formed."]
        solution: "River deposition built a broad, emerged coast with deltas."
        mistakes: {"It is made of coral": west_east_coast}

  - code: ss9.coasts.landforms
    title: Coastal landforms made by waves
    after: [ss9.coasts.western]
    notes: |
      Sea waves are the main geomorphic agent on coasts. Erosion: waves hitting coastal rock remove it,
      forming steep cliffs; small holes grow into sea caves; caves on both sides of a headland join to
      form a sea arch; when the arch roof collapses, the seaward part stands detached as a sea stack.
      Deposition: beaches are temporary deposits of sand and gravel between the high and low tide limits;
      sand bars are temporary sand embankments deposited parallel to the coast; a sand bar extending from
      land into the sea is a spit. Lagoons are shallow water bodies separated from the sea by sand bars
      or coral reefs.
    explanations:
      text: "Waves cut and waves build. Cutting gives cliffs, caves, arches and stacks. Building gives beaches, sand bars and spits."
      visual: "Draw a rocky headland in four stages: a steep cliff, a hole (cave), a hole right through (arch), then the arch broken leaving a lone pillar (stack)."
      step_by_step: "To order erosion landforms: Step 1: cliff. Step 2: sea cave. Step 3: two caves join into a sea arch. Step 4: the arch roof falls, leaving a sea stack."
      real_world: "Varkala's red cliffs in Kerala are a wave-cut cliff landform; Kovalam's sandy shore is a beach deposit."
    items:
      - prompt: "A steep rock face rising above the sea, formed by wave erosion, is a"
        options: ["Cliff", "Beach", "Spit", "Lagoon"]
        answer: "Cliff"
        difficulty: 1
        hints: ["Varkala has one."]
        solution: "A cliff."
        mistakes: {"Beach": wave_landforms}
      - prompt: "When the roof of a sea arch collapses, the remaining pillar is a"
        options: ["Sea stack", "Sea cave", "Sand bar", "Spit"]
        answer: "Sea stack"
        difficulty: 1
        hints: ["It stands detached from the shore."]
        solution: "A sea stack."
        mistakes: {"Sea cave": wave_landforms}
      - prompt: "Beaches are formed between"
        options: ["The high tide and low tide limits", "Two mountains", "Two rivers", "The sea and a desert"]
        answer: "The high tide and low tide limits"
        difficulty: 2
        hints: ["Look at Fig 8.14."]
        solution: "Between the high and low tidal limits, by wave deposition."
        mistakes: {"Two rivers": wave_landforms}
      - prompt: "A sand bar that extends from the land into the sea is called a"
        options: ["Spit", "Stack", "Cliff", "Arch"]
        answer: "Spit"
        difficulty: 2
        hints: ["It is joined to land at one end."]
        solution: "A spit."
        mistakes: {"Stack": wave_landforms}
      - prompt: "Arrange in order of formation: sea arch, cliff, sea stack, sea cave."
        options: ["Cliff, sea cave, sea arch, sea stack", "Sea stack, sea arch, sea cave, cliff", "Sea cave, cliff, sea stack, sea arch", "Cliff, sea arch, sea cave, sea stack"]
        answer: "Cliff, sea cave, sea arch, sea stack"
        difficulty: 2
        hints: ["Holes grow and join before the roof can fall."]
        solution: "Cliff → sea cave → sea arch → sea stack."
        mistakes: {"Cliff, sea arch, sea cave, sea stack": wave_landforms}
      - prompt: "Which of these is a depositional landform of waves?"
        options: ["Sand bar", "Sea arch", "Sea cave", "Cliff"]
        answer: "Sand bar"
        difficulty: 1
        hints: ["It is built from sand, not cut from rock."]
        solution: "Sand bars (and beaches, spits) are depositional."
        mistakes: {"Sea arch": wave_landforms}
      - prompt: "How is a sea arch formed?"
        options: ["Sea caves eroded from both sides of a headland join together", "Sand piles up into a bridge", "A volcano erupts under the sea", "Coral grows into a curve"]
        answer: "Sea caves eroded from both sides of a headland join together"
        difficulty: 3
        hints: ["Think of two caves meeting."]
        solution: "Waves enlarge caves from both sides until they join, making an arch."
        mistakes: {"Sand piles up into a bridge": wave_landforms}

  - code: ss9.coasts.climate_life
    title: Coastal climate, resources and human life
    after: [ss9.coasts.eastern_islands, ss9.coasts.landforms]
    notes: |
      Coastal India has a moderate climate (not too hot or cold) because of the sea's maritime effect.
      Land heats and cools quickly; the sea slowly. Day: low pressure over warm land, sea breeze from sea
      to land. Night: high pressure over cool land, land breeze from land to sea. The southwest monsoon
      from the Arabian Sea hits the Western Ghats and gives heavy rain to the west coast. The east coast,
      especially Coromandel, gets rain in October–November from the retreating (northeast) monsoon
      (Thulavarsham in Kerala) and from Bay of Bengal cyclones. Soils: west coast sandy, yellow and red
      laterite, black clayey and peaty; east coast mostly alluvial. Table: Gujarat black, coastal alluvial,
      saline; Konkan black, laterite; Malabar alluvial, peat; Eastern coastal and delta alluvial;
      Lakshadweep coral sandy; Andaman and Nicobar marine sandy and alluvial. Vegetation: dry (sandy and
      rocky strand) and wet (mangroves, salt marsh, seaweed, sea grass, coral plants); coconut, banana,
      rice, vegetables grown. Mangroves: salt-water marsh plants of tropical coasts, 'lungs of the
      coasts'; Sundarbans in the Ganga delta is India's largest; breeding grounds for fish; protect from
      cyclones and tsunamis; International Mangrove Day 26 July. Minerals: iron ore, manganese, bauxite;
      black sand with rare earth minerals at Chavara (Kollam) and in Odisha and Tamil Nadu. Coasts are
      densely populated (climate, farmland, water, transport, jobs); Mumbai, Chennai and Kolkata grew on
      coastal plains; Lakshadweep has higher density than the national average, Andaman and Nicobar low.
      Activities: farming, fishing, mineral industries, shipbuilding, fish processing, salt, tourism,
      ports. Challenges: tsunami, cyclones, sea level rise from climate change, coastal erosion; need
      warnings, community preparedness and sustainable planning.
    explanations:
      text: "The sea keeps coastal weather mild through sea and land breezes. Coasts have rich soils, mangroves and minerals, so many people live there, but they face cyclones, tsunamis, erosion and rising seas."
      visual: "Two arrows over a beach: by day, an arrow from sea to land (sea breeze); by night, an arrow from land to sea (land breeze). The air always moves from the cooler side to the warmer side."
      step_by_step: "To work out a breeze: Step 1: which heats or cools faster? Land. Step 2: by day land is warmer, so low pressure over land and air flows from sea: sea breeze. Step 3: at night land is cooler, so air flows to sea: land breeze."
      real_world: "Kerala's Thulavarsham rains in October–November, with afternoon thunderstorms, come from the retreating monsoon."
    items:
      - prompt: "During the day, wind blowing from the sea to the land is the"
        options: ["Sea breeze", "Land breeze", "Loo", "Northeast monsoon"]
        answer: "Sea breeze"
        difficulty: 1
        hints: ["Land heats up faster in the day."]
        solution: "The sea breeze."
        mistakes: {"Land breeze": coastal_climate}
      - prompt: "In Kerala, the rain of the retreating monsoon in October–November is called"
        options: ["Thulavarsham", "Edavappathi", "Mango showers", "Loo"]
        answer: "Thulavarsham"
        difficulty: 1
        hints: ["It comes in the Malayalam month of Thulam."]
        solution: "Thulavarsham."
        mistakes: {"Edavappathi": coastal_climate}
      - prompt: "India's largest mangrove forest is"
        options: ["Sundarbans", "Pichavaram", "Kumarakom", "Dharmadam"]
        answer: "Sundarbans"
        difficulty: 1
        hints: ["It is in the Ganga delta in West Bengal."]
        solution: "The Sundarbans."
        mistakes: {"Pichavaram": coastal_resources}
      - prompt: "International Mangrove Day is observed on"
        options: ["26 July", "5 June", "22 April", "16 September"]
        answer: "26 July"
        difficulty: 2
        hints: ["It is in the monsoon month of July."]
        solution: "26 July."
        mistakes: {"5 June": coastal_resources}
      - prompt: "Why do coastal regions have a moderate climate?"
        options: ["The nearby sea heats and cools slowly, and sea and land breezes even out temperatures", "They are far from the sea", "They are at high altitude", "They get snow"]
        answer: "The nearby sea heats and cools slowly, and sea and land breezes even out temperatures"
        difficulty: 2
        hints: ["This is called the maritime effect."]
        solution: "The maritime effect keeps it neither too hot nor too cold."
        mistakes: {"They are at high altitude": coastal_climate}
      - prompt: "Which soil is mostly found on the eastern coast?"
        options: ["Alluvial soil", "Coral sandy soil", "Desert soil", "Peat soil only"]
        answer: "Alluvial soil"
        difficulty: 2
        hints: ["Rivers built deltas there."]
        solution: "Alluvial soil, deposited by the rivers."
        mistakes: {"Desert soil": coastal_resources}
      - prompt: "Where in Kerala are black sand deposits with rare earth minerals found?"
        options: ["Chavara, Kollam", "Kovalam, Thiruvananthapuram", "Bekal, Kasaragod", "Ponnani, Malappuram"]
        answer: "Chavara, Kollam"
        difficulty: 2
        hints: ["It is in Kollam district."]
        solution: "Chavara in Kollam district."
        mistakes: {"Kovalam, Thiruvananthapuram": coastal_resources}
      - prompt: "The Coromandel coast gets most of its rain from"
        options: ["The northeast (retreating) monsoon in October–November", "The Arabian Sea branch in June", "Western disturbances", "The Loo winds"]
        answer: "The northeast (retreating) monsoon in October–November"
        difficulty: 2
        hints: ["Cyclones from the Bay of Bengal also bring rain."]
        solution: "The northeast monsoon and Bay of Bengal cyclones."
        mistakes: {"The Arabian Sea branch in June": coastal_climate}
      - prompt: "How do mangroves help coastal people?"
        options: ["They protect the coast from cyclones and tsunamis and are breeding grounds for fish", "They make the sea water fresh", "They stop all rain", "They produce marble"]
        answer: "They protect the coast from cyclones and tsunamis and are breeding grounds for fish"
        difficulty: 2
        hints: ["They are called the lungs of the coasts."]
        solution: "They shield the land and support fish and marine life."
        mistakes: {"They make the sea water fresh": coastal_resources}
      - prompt: "Which is a challenge faced by coastal regions?"
        options: ["Sea level rise due to climate change", "Lack of water everywhere", "Extreme snowfall", "No flat land"]
        answer: "Sea level rise due to climate change"
        difficulty: 1
        hints: ["Also tsunamis, cyclones and coastal erosion."]
        solution: "Sea level rise, tsunamis, cyclones and coastal erosion."
        mistakes: {"Extreme snowfall": coastal_resources}
