        solution: "Twice as long."
        mistakes: {"800": ghats}
      - prompt: "Why are the Eastern Ghats broken into separate hills?"
        options: ["East-flowing rivers cut across them", "Earthquakes split them every year", "They are made of sand", "The sea washed them away"]
        answer: "East-flowing rivers cut across them"
        difficulty: 3
        hints: ["Mahanadi, Godavari, Krishna, Kaveri."]
        solution: "Rivers flowing to the Bay of Bengal break their continuity."
        mistakes: {"They are made of sand": ghats}
      - prompt: "Why is the Peninsular Plateau called one of the oldest landmasses on Earth?"
        options: ["It is a part of the ancient Gondwana land, made of very old hard rocks", "It rose from the sea last century", "It is made of fresh river silt", "It is the highest land in India"]
        answer: "It is a part of the ancient Gondwana land, made of very old hard rocks"
        difficulty: 2
        hints: ["The chapter title says the Earth's history 'slumbers' here.", "Is it younger or older than the Himalayas?"]
        solution: "Step 1: The plateau is a block of the ancient Gondwana supercontinent. Step 2: Its crystalline rocks are among the oldest on Earth, far older than the Himalayas."
        mistakes: {"It rose from the sea last century": ancient_block, "It is made of fresh river silt": plain_formation, "It is the highest land in India": ancient_block}
      - prompt: "In which general direction does the Deccan Plateau slope?"
        options: ["Towards the east", "Towards the west", "Towards the north", "It is completely flat"]
        answer: "Towards the east"
        difficulty: 3
        hints: ["Where do the Godavari, Krishna and Kaveri flow?", "Rivers flow downhill."]
        solution: "Step 1: The big Deccan rivers rise in the Western Ghats and flow east into the Bay of Bengal. Step 2: So the plateau slopes gently to the east."
        mistakes: {"Towards the west": rivers_show_slope, "Towards the north": rivers_show_slope, "It is completely flat": rivers_show_slope}

  - code: ss9.plateau.climate_rivers
    title: Climate and rivers of the plateau
    after: [ss9.plateau.parts]
    notes: |
      Tropical monsoon climate, varying with tropical location, the Peninsula's shape, distance from the
      sea, orientation of mountains and direction of monsoon winds. Summer averages over 30 °C; the Deccan
      reaches 38 °C in March; high Western Ghats stay cool (Ooty, Kodaikanal, Wayanad). Interior plateau has
      a high diurnal range (difference between a day's maximum and minimum). Southwest monsoon: moist winds
      rise on the western slopes of the Western Ghats and give 250–400 cm; descending dry winds leave the
      eastern side with under 50 cm: rain shadow regions (interior Karnataka and Tamil Nadu). Winds also
      enter through the Narmada and Tapti basins, giving moderate rain to Central India. In the northeast
      monsoon the plateau stays dry while the east coast gets rain. The plateau slopes west to east; the
      Western Ghats are the main water divide. Catchment area: area from which water flows into a river;
      drainage basin: a river and its tributaries; water divide: boundary between basins. East-flowing:
      Mahanadi (Sihawa, Chhattisgarh; Ib, Tel), Godavari (Nashik; Pranhita, Indravati, Sabari; largest, 1465
      km, 3.13 lakh sq km basin, 'Dakshin Ganga'), Krishna (Mahabaleshwar; Tungabhadra, Bhima, Koyna),
      Kaveri (Brahmagiri, Karnataka; Kabani, Bhavani, Amaravati). Kaveri flows almost all year because its
      catchment gets both monsoons. Kaveri dispute: 1924 agreement, tribunal 1990, verdict 2007: Tamil Nadu
      419 TMC, Karnataka 270, Kerala 30, Puducherry 7. West-flowing: Narmada (Amarkantak; Dhuandhar Falls
      near Jabalpur; Sardar Sarovar project; Narmada Bachao Andolan) and Tapti (Multai), plus short rivers
      from the Western Ghats. North-flowing: Chambal (ravines: badland gullies), Betwa, Son. Peninsular
      rivers are seasonal and generally not navigable. Multipurpose projects (flood control, irrigation,
      hydel power, transport, fishing, tourism): Hirakud (Mahanadi, Odisha), Tungabhadra (Karnataka),
      Sardar Sarovar (Narmada, Gujarat), Krishna Raja Sagar (Kaveri, Karnataka), Nizam Sagar (Godavari).
    explanations:
      text: "The Western Ghats catch the monsoon and soak the coast, leaving the land behind them dry. Most plateau rivers flow east to the Bay of Bengal, because the plateau tilts that way; the Narmada and Tapti flow west."
      visual: "Picture wet air climbing the Western Ghats like a sponge being squeezed on the way up. When it comes down the other side it is wrung dry: that side is the rain shadow."
      step_by_step: "To sort a river: Step 1: does it reach the Bay of Bengal? East-flowing (Mahanadi, Godavari, Krishna, Kaveri). Step 2: the Arabian Sea? West-flowing (Narmada, Tapti, Kerala rivers). Step 3: does it join the Yamuna or Ganga? North-flowing (Chambal)."
      real_world: "Wayanad gets heavy rain while Mysuru, just over the hills, is much drier: a rain shadow you can drive across in two hours."
    activity:
      type: sort
      prompt: Which way does it flow?
      bins:
      - East to the Bay of Bengal
      - West to the Arabian Sea
      - North to the Ganga system
      items:
      - label: Godavari, the 'Dakshin Ganga'
        bin: East to the Bay of Bengal
        clue: Rises at Nashik and makes a delta.
        why: Godavari flows east.
      - label: Krishna
        bin: East to the Bay of Bengal
        clue: Rises at Mahabaleshwar.
        why: Krishna flows east.
      - label: Kaveri
        bin: East to the Bay of Bengal
        clue: Rises at Brahmagiri.
        why: Kaveri flows east.
      - label: Narmada
        bin: West to the Arabian Sea
        clue: Rises at Amarkantak; Dhuandhar Falls.
        why: Narmada flows west, against the plateau's slope.
      - label: Tapti
        bin: West to the Arabian Sea
        clue: Rises at Multai.
        why: Tapti flows west.
      - label: Chambal, with its ravines
        bin: North to the Ganga system
        clue: Joins the Yamuna.
        why: Chambal flows north.
      - label: Betwa
        bin: North to the Ganga system
        clue: A peninsular river that reaches the northern plain.
        why: Betwa flows north.
    items:
      - prompt: "Which is the largest peninsular river, called Dakshin Ganga?"
        options: ["Godavari", "Krishna", "Kaveri", "Narmada"]
        answer: "Godavari"
        difficulty: 1
        hints: ["It rises at Nashik."]
        solution: "The Godavari."
        mistakes: {"Kaveri": peninsular_rivers}
      - prompt: "A region on the leeward side of mountains that gets little rain is a"
        options: ["Rain shadow region", "Windward region", "Delta", "Water divide"]
        answer: "Rain shadow region"
        difficulty: 1
        hints: ["The descending air is dry."]
        solution: "A rain shadow region."
        mistakes: {"Windward region": rain_shadow}
      - prompt: "Which two peninsular rivers flow west from the Central Highlands?"
        options: ["Narmada and Tapti", "Godavari and Krishna", "Kaveri and Mahanadi", "Chambal and Betwa"]
        answer: "Narmada and Tapti"
        difficulty: 1
        hints: ["They rise in Madhya Pradesh."]
        solution: "Narmada and Tapti."
        mistakes: {"Godavari and Krishna": peninsular_rivers}
      - prompt: "How long is the Godavari (km)?"
        answer: "1465"
        check: "1465"
        difficulty: 2
        hints: ["Between 1400 and 1500."]
        solution: "1465 km."
        mistakes: {"1600": peninsular_rivers}
      - prompt: "Under the 2007 Kaveri verdict, Tamil Nadu got 419 TMC, Karnataka 270, Kerala 30 and Puducherry 7. What is the total (TMC)?"
        answer: "726"
        check: "419 + 270 + 30 + 7"
        difficulty: 2
        hints: ["Add all four."]
        solution: "726 TMC."
        mistakes: {"689": peninsular_rivers}
      - prompt: "Why does the Kaveri flow almost all year?"
        options: ["Its catchment gets both the southwest and northeast monsoons", "It is fed by Himalayan glaciers", "It flows from the sea", "It has many dams that make water"]
        answer: "Its catchment gets both the southwest and northeast monsoons"
        difficulty: 2
        hints: ["Rain in summer and in winter."]
        solution: "Two monsoons keep it flowing."
        mistakes: {"It is fed by Himalayan glaciers": peninsular_rivers}
      - prompt: "Western slopes of the Western Ghats get 250–400 cm; the rain shadow gets under 50 cm. At least how many cm more do the western slopes get?"
        answer: "200"
        check: "250 - 50"
        difficulty: 2
        hints: ["Use the smallest wet value and the largest dry value."]
        solution: "250 − 50 = 200 cm or more."
        mistakes: {"350": rain_shadow}
      - prompt: "The badland gullies along the Chambal river are called"
        options: ["Ravines", "Doabs", "Deltas", "Duns"]
        answer: "Ravines"
        difficulty: 2
        hints: ["Formed by continuous erosion."]
        solution: "Ravines."
        mistakes: {"Doabs": peninsular_rivers}
      - prompt: "Which movement opposed large dams on the Narmada?"
        options: ["Narmada Bachao Andolan", "Chipko Movement", "Silent Valley Movement", "Quit India Movement"]
        answer: "Narmada Bachao Andolan"
        difficulty: 2
        hints: ["Led by tribals, farmers and environmentalists."]
        solution: "Narmada Bachao Andolan."
        mistakes: {"Chipko Movement": peninsular_rivers}
      - prompt: "Why is the interior of Karnataka and Tamil Nadu dry during the southwest monsoon?"
        options: ["It lies in the rain shadow of the Western Ghats", "It is too close to the sea", "It is in the Himalayas", "The monsoon does not reach India"]
        answer: "It lies in the rain shadow of the Western Ghats"
        difficulty: 3
        hints: ["Which side of the Ghats is it on?"]
        solution: "The dry descending winds leave it in rain shadow."
        mistakes: {"It is too close to the sea": rain_shadow}
      - prompt: "Why do the Narmada and the Tapti form estuaries instead of deltas?"
        options: ["They flow fast through rift valleys over hard rock and carry little sediment to deposit", "They flow into the Bay of Bengal", "They are fed by glaciers", "They dry up before reaching the sea"]
        answer: "They flow fast through rift valleys over hard rock and carry little sediment to deposit"
        difficulty: 3
        hints: ["Deltas need a lot of sediment dropped at the mouth.", "These rivers flow west through narrow rift valleys."]
        solution: "Step 1: They run swiftly through rift valleys over hard rocks, picking up little silt. Step 2: With little to deposit, they enter the Arabian Sea through estuaries."
        mistakes: {"They flow into the Bay of Bengal": peninsular_rivers, "They are fed by glaciers": rift_estuary, "They dry up before reaching the sea": rift_estuary}
      - prompt: "Why do many peninsular rivers carry very little water in summer?"
        options: ["They are fed only by rain, not by snow or glaciers", "Their water is taken by the Himalayas", "They flow uphill in summer", "Rain falls only in summer there"]
        answer: "They are fed only by rain, not by snow or glaciers"
        difficulty: 2
        hints: ["Where do Himalayan rivers get water in summer?", "Is there snow on the Western Ghats?"]
        solution: "Step 1: Peninsular rivers depend on monsoon rain. Step 2: With no melting snow to feed them, many shrink or dry up in the dry season."
        mistakes: {"Their water is taken by the Himalayas": rain_only, "They flow uphill in summer": rain_only, "Rain falls only in summer there": rain_only}

  - code: ss9.plateau.vegetation_soil
    title: Vegetation and soils of the plateau
    after: [ss9.plateau.climate_rivers]
    notes: |
      Tropical deciduous forests (70–200 cm rain) are the most widespread: moist deciduous (100–200 cm;
      eastern slopes of the Western Ghats, hills of MP and Chhattisgarh, Chota Nagpur; teak, sal, shisham,
      mahua, sandalwood) and dry deciduous (70–100 cm; teak, rosewood, axlewood, bamboo; leafless in
      drought). Tropical thorn forests (below 75 cm, high heat): acacia, euphorbia, date palms; semi-arid
      Maharashtra and Karnataka east of the Ghats, dry Andhra Pradesh, Telangana, Tamil Nadu. Southern
      montane forests on the Western Ghats, Vindhyas, Nilgiris: temperate above 1500 m, subtropical below;
      subtropical forests of the Nilgiris, Palani and Anamalai are shola forests. Soils are mostly in-situ
      (formed where they lie) as opposed to transported (alluvial). Black soil: weathered basalt, mainly
      Maharashtra and MP, also called regur or black cotton soil; fertile, holds water; lime, iron, magnesium,
      aluminium. Red soil: weathered old crystalline rocks; iron gives red colour (also brown, grey, yellow).
      Laterite soil: leaching of silica and lime with alternate heavy rain and drought; Western and Eastern
      Ghats, Rajmahal, Vindhya, Satpura, Malwa; less fertile but used with fertiliser for tea, coffee,
      rubber, arecanut. Mountain soil on the Ghats: tea, coffee, spices, fruits.
    explanations:
      text: "Rain decides the forest: thorn scrub where dry, deciduous teak and sal in between, and shola forests high in the Ghats. The soils come from the rocks below: black from lava, red from old rocks, laterite where rain washes minerals out."
      visual: "Laterite is like a sieve washed again and again: heavy rains carry away the silica and lime, leaving the red, iron-rich stuff behind. Kerala's red building blocks are cut from it."
      step_by_step: "To name a soil: Step 1: black, sticky, from basalt, good for cotton? Black (regur). Step 2: red because of iron, from old rocks? Red. Step 3: formed by leaching in rain-and-drought climates, used for plantations? Laterite."
      real_world: "Many Kerala houses are built with laterite (vettukallu) blocks cut from the ground."
    activity:
      type: scale
      min: 0
      max: 250
      step: 5
      start: 250
      unit: cm
      prompt: Slide the yearly rainfall. Which forest grows?
      zones:
      - from: 0
        to: 75
        label: Thorn forest
        says: 'Below 75 cm and very hot: acacia, euphorbia, date palms.'
      - from: 75
        to: 100
        label: Dry deciduous
        says: '70–100 cm: teak, rosewood, bamboo; leafless in drought.'
      - from: 100
        to: 200
        label: Moist deciduous
        says: '100–200 cm: teak, sal, shisham, sandalwood.'
      - from: 200
        to: 250
        label: Evergreen
        says: 'Over 200 cm: forests stay green all year.'
      goals:
      - prompt: Find rainfall for dry deciduous forest.
        zone: Dry deciduous
        mistakes:
        - when:
            v:
            - 0
            - 70
          say: 'Too dry: below 75 cm you get thorn forest, not deciduous trees.'
        - when:
            v:
            - 105
            - 195
          say: That's wet enough for moist deciduous forest. Dry deciduous needs less.
      - prompt: Find rainfall for moist deciduous forest (teak, sal).
        zone: Moist deciduous
        mistakes:
        - when:
            v:
            - 75
            - 95
          say: That only gives dry deciduous forest. Moist needs over 100 cm.
      - prompt: Find rainfall for thorn forest east of the Ghats.
        zone: Thorn forest
        mistakes:
        - when:
            v:
            - 100
            - 195
          say: Thorn forest grows in dry rain-shadow areas, not wet ones.
    items:
      - prompt: "Black soil is also called"
        options: ["Regur or black cotton soil", "Laterite", "Alluvium", "Peat"]
        answer: "Regur or black cotton soil"
        difficulty: 1
        hints: ["It is good for cotton."]
        solution: "Regur, or black cotton soil."
        mistakes: {"Laterite": plateau_soils}
      - prompt: "Black soil forms from the weathering of which rock?"
        options: ["Basalt", "Marble", "Sandstone", "Coral"]
        answer: "Basalt"
        difficulty: 1
        hints: ["Lava rock of the Deccan Trap."]
        solution: "Basalt."
        mistakes: {"Marble": k9_basalt}
      - prompt: "Subtropical forests of the Nilgiris, Palani and Anamalai hills are called"
        options: ["Shola forests", "Mangroves", "Thorn forests", "Alpine meadows"]
        answer: "Shola forests"
        difficulty: 2
        hints: ["They are southern montane forests."]
        solution: "Shola forests."
        mistakes: {"Mangroves": plateau_soils}
      - prompt: "Laterite soil forms by"
        options: ["Leaching of silica and lime under alternate heavy rain and drought", "River deposition", "Volcanic ash falling", "Wind blowing sand"]
        answer: "Leaching of silica and lime under alternate heavy rain and drought"
        difficulty: 2
        hints: ["Minerals are washed out."]
        solution: "Leaching."
        mistakes: {"River deposition": plateau_soils}
      - prompt: "A soil that stays where it formed is called"
        options: ["In-situ soil", "Transported soil", "Alluvial soil", "Sandy soil"]
        answer: "In-situ soil"
        difficulty: 2
        hints: ["Black soil is an example."]
        solution: "In-situ soil."
        mistakes: {"Transported soil": plateau_soils}
      - prompt: "Thorn forests grow where annual rainfall is below"
        answer: "75"
        check: "75"
        difficulty: 2
        hints: ["Answer in cm."]
        solution: "Below 75 cm."
        mistakes: {"200": plateau_soils}
      - prompt: "Why is black soil good for crops even in summer?"
        options: ["It holds water well", "It is very sandy", "It has no minerals", "It is always frozen"]
        answer: "It holds water well"
