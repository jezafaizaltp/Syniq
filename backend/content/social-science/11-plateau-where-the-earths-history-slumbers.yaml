          say: Thorn forest grows in dry rain-shadow areas, not wet ones.
    lesson:
      - teach: 'Forests follow rain. Tropical deciduous forests are most common: moist deciduous (100–200 cm; teak, sal, sandalwood) and dry deciduous (70–100 cm). Thorn forests (acacia, euphorbia) grow where rain is under 75 cm. High on the Ghats are montane forests; in the Nilgiris, Palani and Anamalai these are shola forests.'
        check:
