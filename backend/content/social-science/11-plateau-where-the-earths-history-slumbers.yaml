subject: ss
chapter: 11
title: Plateau where the Earth's History Slumbers

tips:
  plateau_parts: "The Peninsular Plateau (about 16 lakh sq km, 600–900 m high, one of the oldest landforms) has two parts: the Deccan Plateau south of the Satpuras, between the Western and Eastern Ghats, and the Central Highlands north of the Satpuras (Malwa Plateau, Aravalis, Chota Nagpur Plateau)."
  ghats: "Western Ghats: about 1600 km from Gujarat to Kanyakumari, higher towards the south; Anamudi (2695 m) is the highest peak of Peninsular India; called Sahyadris in Maharashtra, Nilgiris in Karnataka/Tamil Nadu, Anamalai and Elamalai in Kerala. Eastern Ghats: lower, broken by rivers, about 800 km from the Mahanadi to the Nilgiris. They meet at the Nilgiris."
  rain_shadow: "Moist winds rise on the windward side of mountains, cool and give heavy rain (250–400 cm on the western slopes of the Western Ghats). The air coming down the leeward side is dry, so the area behind gets little rain (under 50 cm): a rain shadow region."
  peninsular_rivers: "East-flowing: Mahanadi, Godavari (largest, 1465 km, 'Dakshin Ganga'), Krishna, Kaveri (nearly perennial: rain in both monsoons). West-flowing: Narmada and Tapti (from the Central Highlands) and short Western Ghats rivers. North-flowing to the Yamuna/Ganga: Chambal (ravines), Betwa, Son. Peninsular rivers are mostly seasonal."
  plateau_soils: "Black (regur, black cotton) soil from basalt in the Deccan Trap, holds water, good for cotton; red soil from old crystalline rocks, red from iron; laterite soil from leaching under alternate rain and drought, used for tea, coffee, rubber, arecanut; mountain soil on the Ghats. Black soil is in-situ; alluvial is transported."
  plateau_resources: "Crops: coffee (Karnataka about 71% of output, Kerala 22%), tea in the Nilgiris and Western Ghats, sugarcane (black soil, long crushing season), cotton (21–30 °C, 50–100 cm rain; Gujarat leads). Minerals: Chota Nagpur is the heartland of minerals (coal, iron ore, manganese, mica, bauxite, copper)."

concepts:
  - code: ss9.plateau.parts
    title: The Peninsular Plateau, the Deccan and the Ghats
    notes: |
      Plateaus are relatively flat, extensive landforms higher than their surroundings; types:
      intermontane, piedmont, continental. The Peninsular Plateau is roughly triangular, 600–900 m high,
      over 16 lakh sq km, one of the world's oldest landforms; bordered by the Western Ghats and Eastern
      Ghats. Two parts. Deccan Plateau: south of the Satpura ranges, with Satpura, Maikala and Mahadeo
      Hills on its north; 'Deccan' from Sanskrit 'Dakshin' (south); crystalline rocks (basalt, granite,
      gneiss) from ancient lava flows; the north-west basalt area is the Deccan Trap, with black (regur)
      soil. Western Ghats: about 1600 km from Kanyakumari to Gujarat; height increases north to south;
      Anamudi (2695 m) in Anamalai, Kerala, highest in Peninsular India; Dodabetta (2637 m) in the Nilgiris;
      called Anamalai and Elamalai in Kerala, Nilgiris in Karnataka and Tamil Nadu, Sahyadris in
      Maharashtra; most peninsular rivers rise here. Eastern Ghats: lower hills (Javadi, Palkonda,
      Nallamalai, Mahendragiri), about 800 km from the Mahanadi in Odisha to the Nilgiris, broken by
      east-flowing rivers; the two Ghats meet at the Nilgiris. Nilgiris: Ooty (Queen of Hills), Kotagiri,
      Coonoor; India's first Biosphere Reserve. Central Highlands: north of the Satpuras; Malwa Plateau
      with the Aravalis on its west (old, worn-down residual fold mountains); Mount Abu is the highest peak
      and a hill station. Chota Nagpur Plateau in the east, south of the Rajmahal Hills, is the richest
      storehouse of minerals. Parts of Jaisalmer, the Meghalaya Plateau and Kachchh-Kathiawar outcrops
      also belong to the Peninsular Plateau.
    explanations:
      text: "The Peninsular Plateau is the old, high table-land of south and central India. The Deccan lies between the two Ghats; the Central Highlands lie north of the Satpuras. The Western Ghats are tall and continuous; the Eastern Ghats are low and broken."
      visual: "Draw an upside-down triangle for the Peninsula. Make the left edge a tall wall (Western Ghats) and the right edge a row of broken low hills (Eastern Ghats). They meet near the bottom at the Nilgiris."
      step_by_step: "To place a feature: Step 1: south of the Satpuras, between the Ghats? Deccan Plateau. Step 2: north of the Satpuras (Malwa, Aravali, Mount Abu, Chota Nagpur)? Central Highlands."
      real_world: "Anamudi in Idukki district, Kerala, is the highest peak in India south of the Himalayas."
    items:
      - prompt: "The highest peak in Peninsular India is"
        options: ["Anamudi", "Dodabetta", "Mount Abu", "K2"]
        answer: "Anamudi"
        difficulty: 1
        hints: ["It is in Kerala."]
        solution: "Anamudi (2695 m)."
        mistakes: {"Dodabetta": ghats}
      - prompt: "The word 'Deccan' comes from the Sanskrit 'Dakshin', meaning"
        options: ["South", "Plateau", "Black", "River"]
        answer: "South"
        difficulty: 1
        hints: ["Its position in India."]
        solution: "The South."
        mistakes: {"Plateau": plateau_parts}
      - prompt: "Where do the Western Ghats and Eastern Ghats meet?"
        options: ["Nilgiri Hills", "Aravali Hills", "Rajmahal Hills", "Satpura Range"]
        answer: "Nilgiri Hills"
        difficulty: 1
        hints: ["Ooty is there."]
        solution: "At the Nilgiris."
        mistakes: {"Satpura Range": ghats}
      - prompt: "How high is Anamudi (metres)?"
        answer: "2695"
        check: "2695"
        difficulty: 2
        hints: ["Just under 2700 m."]
        solution: "2695 m."
        mistakes: {"2637": ghats}
      - prompt: "Anamudi is 2695 m and Dodabetta 2637 m. How much higher is Anamudi (m)?"
        answer: "58"
        check: "2695 - 2637"
        difficulty: 2
        hints: ["Subtract."]
        solution: "2695 − 2637 = 58 m."
        mistakes: {"5332": ghats}
      - prompt: "The Western Ghats in Maharashtra are called"
        options: ["Sahyadris", "Nilgiris", "Anamalai", "Javadi Hills"]
        answer: "Sahyadris"
        difficulty: 2
        hints: ["Nilgiris are in Karnataka and Tamil Nadu."]
        solution: "The Sahyadris."
        mistakes: {"Nilgiris": ghats}
      - prompt: "Which plateau is called the richest storehouse of minerals?"
        options: ["Chota Nagpur Plateau", "Malwa Plateau", "Deccan Trap", "Meghalaya Plateau"]
        answer: "Chota Nagpur Plateau"
        difficulty: 2
        hints: ["South of the Rajmahal Hills."]
        solution: "The Chota Nagpur Plateau."
        mistakes: {"Malwa Plateau": plateau_parts}
      - prompt: "The Western Ghats run about 1600 km and the Eastern Ghats about 800 km. How many times longer are the Western Ghats?"
        answer: "2"
        check: "1600/800"
        difficulty: 1
        hints: ["Divide."]
        solution: "Twice as long."
        mistakes: {"800": ghats}
      - prompt: "Why are the Eastern Ghats broken into separate hills?"
        options: ["East-flowing rivers cut across them", "Earthquakes split them every year", "They are made of sand", "The sea washed them away"]
        answer: "East-flowing rivers cut across them"
        difficulty: 3
        hints: ["Mahanadi, Godavari, Krishna, Kaveri."]
        solution: "Rivers flowing to the Bay of Bengal break their continuity."
        mistakes: {"They are made of sand": ghats}

  - code: ss9.plateau.climate_rivers
    title: Climate and rivers of the plateau
    after: [ss9.plateau.parts]
    notes: |
      Tropical monsoon climate, varying with tropical location, the Peninsula's shape, distance from the
      sea, orientation of mountains and direction of monsoon winds. Summer averages over 30 °C; the Deccan
      reaches 38 °C in March; high Western Ghats stay cool (Ooty, Kodaikanal, Wayanad). Interior plateau has
      a high diurnal range (difference between a day's maximum and minimum). Southwest monsoon: moist winds
      rise on the western slopes of the Western Ghats and give 250–400 cm; descending dry winds leave the
      eastern side with under 50 cm: rain shadow regions (interior Karnataka and Tamil Nadu). Winds also
      enter through the Narmada and Tapti basins, giving moderate rain to Central India. In the northeast
      monsoon the plateau stays dry while the east coast gets rain. The plateau slopes west to east; the
      Western Ghats are the main water divide. Catchment area: area from which water flows into a river;
      drainage basin: a river and its tributaries; water divide: boundary between basins. East-flowing:
      Mahanadi (Sihawa, Chhattisgarh; Ib, Tel), Godavari (Nashik; Pranhita, Indravati, Sabari; largest, 1465
      km, 3.13 lakh sq km basin, 'Dakshin Ganga'), Krishna (Mahabaleshwar; Tungabhadra, Bhima, Koyna),
      Kaveri (Brahmagiri, Karnataka; Kabani, Bhavani, Amaravati). Kaveri flows almost all year because its
      catchment gets both monsoons. Kaveri dispute: 1924 agreement, tribunal 1990, verdict 2007: Tamil Nadu
      419 TMC, Karnataka 270, Kerala 30, Puducherry 7. West-flowing: Narmada (Amarkantak; Dhuandhar Falls
      near Jabalpur; Sardar Sarovar project; Narmada Bachao Andolan) and Tapti (Multai), plus short rivers
      from the Western Ghats. North-flowing: Chambal (ravines: badland gullies), Betwa, Son. Peninsular
      rivers are seasonal and generally not navigable. Multipurpose projects (flood control, irrigation,
      hydel power, transport, fishing, tourism): Hirakud (Mahanadi, Odisha), Tungabhadra (Karnataka),
      Sardar Sarovar (Narmada, Gujarat), Krishna Raja Sagar (Kaveri, Karnataka), Nizam Sagar (Godavari).
    explanations:
      text: "The Western Ghats catch the monsoon and soak the coast, leaving the land behind them dry. Most plateau rivers flow east to the Bay of Bengal, because the plateau tilts that way; the Narmada and Tapti flow west."
      visual: "Picture wet air climbing the Western Ghats like a sponge being squeezed on the way up. When it comes down the other side it is wrung dry: that side is the rain shadow."
      step_by_step: "To sort a river: Step 1: does it reach the Bay of Bengal? East-flowing (Mahanadi, Godavari, Krishna, Kaveri). Step 2: the Arabian Sea? West-flowing (Narmada, Tapti, Kerala rivers). Step 3: does it join the Yamuna or Ganga? North-flowing (Chambal)."
      real_world: "Wayanad gets heavy rain while Mysuru, just over the hills, is much drier: a rain shadow you can drive across in two hours."
    items:
      - prompt: "Which is the largest peninsular river, called Dakshin Ganga?"
        options: ["Godavari", "Krishna", "Kaveri", "Narmada"]
        answer: "Godavari"
        difficulty: 1
        hints: ["It rises at Nashik."]
        solution: "The Godavari."
        mistakes: {"Kaveri": peninsular_rivers}
      - prompt: "A region on the leeward side of mountains that gets little rain is a"
        options: ["Rain shadow region", "Windward region", "Delta", "Water divide"]
        answer: "Rain shadow region"
        difficulty: 1
        hints: ["The descending air is dry."]
        solution: "A rain shadow region."
        mistakes: {"Windward region": rain_shadow}
      - prompt: "Which two peninsular rivers flow west from the Central Highlands?"
        options: ["Narmada and Tapti", "Godavari and Krishna", "Kaveri and Mahanadi", "Chambal and Betwa"]
        answer: "Narmada and Tapti"
        difficulty: 1
        hints: ["They rise in Madhya Pradesh."]
        solution: "Narmada and Tapti."
        mistakes: {"Godavari and Krishna": peninsular_rivers}
      - prompt: "How long is the Godavari (km)?"
        answer: "1465"
        check: "1465"
        difficulty: 2
        hints: ["Between 1400 and 1500."]
        solution: "1465 km."
        mistakes: {"1600": peninsular_rivers}
      - prompt: "Under the 2007 Kaveri verdict, Tamil Nadu got 419 TMC, Karnataka 270, Kerala 30 and Puducherry 7. What is the total (TMC)?"
        answer: "726"
        check: "419 + 270 + 30 + 7"
        difficulty: 2
        hints: ["Add all four."]
        solution: "726 TMC."
        mistakes: {"689": peninsular_rivers}
      - prompt: "Why does the Kaveri flow almost all year?"
        options: ["Its catchment gets both the southwest and northeast monsoons", "It is fed by Himalayan glaciers", "It flows from the sea", "It has many dams that make water"]
        answer: "Its catchment gets both the southwest and northeast monsoons"
        difficulty: 2
        hints: ["Rain in summer and in winter."]
        solution: "Two monsoons keep it flowing."
        mistakes: {"It is fed by Himalayan glaciers": peninsular_rivers}
      - prompt: "Western slopes of the Western Ghats get 250–400 cm; the rain shadow gets under 50 cm. At least how many cm more do the western slopes get?"
        answer: "200"
        check: "250 - 50"
        difficulty: 2
        hints: ["Use the smallest wet value and the largest dry value."]
        solution: "250 − 50 = 200 cm or more."
        mistakes: {"350": rain_shadow}
      - prompt: "The badland gullies along the Chambal river are called"
        options: ["Ravines", "Doabs", "Deltas", "Duns"]
        answer: "Ravines"
        difficulty: 2
        hints: ["Formed by continuous erosion."]
        solution: "Ravines."
        mistakes: {"Doabs": peninsular_rivers}
      - prompt: "Which movement opposed large dams on the Narmada?"
        options: ["Narmada Bachao Andolan", "Chipko Movement", "Silent Valley Movement", "Quit India Movement"]
        answer: "Narmada Bachao Andolan"
        difficulty: 2
        hints: ["Led by tribals, farmers and environmentalists."]
        solution: "Narmada Bachao Andolan."
        mistakes: {"Chipko Movement": peninsular_rivers}
      - prompt: "Why is the interior of Karnataka and Tamil Nadu dry during the southwest monsoon?"
        options: ["It lies in the rain shadow of the Western Ghats", "It is too close to the sea", "It is in the Himalayas", "The monsoon does not reach India"]
        answer: "It lies in the rain shadow of the Western Ghats"
        difficulty: 3
        hints: ["Which side of the Ghats is it on?"]
        solution: "The dry descending winds leave it in rain shadow."
        mistakes: {"It is too close to the sea": rain_shadow}

  - code: ss9.plateau.vegetation_soil
    title: Vegetation and soils of the plateau
    after: [ss9.plateau.climate_rivers]
    notes: |
      Tropical deciduous forests (70–200 cm rain) are the most widespread: moist deciduous (100–200 cm;
      eastern slopes of the Western Ghats, hills of MP and Chhattisgarh, Chota Nagpur; teak, sal, shisham,
      mahua, sandalwood) and dry deciduous (70–100 cm; teak, rosewood, axlewood, bamboo; leafless in
      drought). Tropical thorn forests (below 75 cm, high heat): acacia, euphorbia, date palms; semi-arid
      Maharashtra and Karnataka east of the Ghats, dry Andhra Pradesh, Telangana, Tamil Nadu. Southern
      montane forests on the Western Ghats, Vindhyas, Nilgiris: temperate above 1500 m, subtropical below;
      subtropical forests of the Nilgiris, Palani and Anamalai are shola forests. Soils are mostly in-situ
      (formed where they lie) as opposed to transported (alluvial). Black soil: weathered basalt, mainly
      Maharashtra and MP, also called regur or black cotton soil; fertile, holds water; lime, iron, magnesium,
      aluminium. Red soil: weathered old crystalline rocks; iron gives red colour (also brown, grey, yellow).
      Laterite soil: leaching of silica and lime with alternate heavy rain and drought; Western and Eastern
      Ghats, Rajmahal, Vindhya, Satpura, Malwa; less fertile but used with fertiliser for tea, coffee,
      rubber, arecanut. Mountain soil on the Ghats: tea, coffee, spices, fruits.
    explanations:
      text: "Rain decides the forest: thorn scrub where dry, deciduous teak and sal in between, and shola forests high in the Ghats. The soils come from the rocks below: black from lava, red from old rocks, laterite where rain washes minerals out."
      visual: "Laterite is like a sieve washed again and again: heavy rains carry away the silica and lime, leaving the red, iron-rich stuff behind. Kerala's red building blocks are cut from it."
      step_by_step: "To name a soil: Step 1: black, sticky, from basalt, good for cotton? Black (regur). Step 2: red because of iron, from old rocks? Red. Step 3: formed by leaching in rain-and-drought climates, used for plantations? Laterite."
      real_world: "Many Kerala houses are built with laterite (vettukallu) blocks cut from the ground."
    items:
      - prompt: "Black soil is also called"
        options: ["Regur or black cotton soil", "Laterite", "Alluvium", "Peat"]
        answer: "Regur or black cotton soil"
        difficulty: 1
        hints: ["It is good for cotton."]
        solution: "Regur, or black cotton soil."
        mistakes: {"Laterite": plateau_soils}
      - prompt: "Black soil forms from the weathering of which rock?"
        options: ["Basalt", "Marble", "Sandstone", "Coral"]
        answer: "Basalt"
        difficulty: 1
        hints: ["Lava rock of the Deccan Trap."]
        solution: "Basalt."
        mistakes: {"Marble": plateau_soils}
      - prompt: "Subtropical forests of the Nilgiris, Palani and Anamalai hills are called"
        options: ["Shola forests", "Mangroves", "Thorn forests", "Alpine meadows"]
        answer: "Shola forests"
        difficulty: 2
        hints: ["They are southern montane forests."]
        solution: "Shola forests."
        mistakes: {"Mangroves": plateau_soils}
      - prompt: "Laterite soil forms by"
        options: ["Leaching of silica and lime under alternate heavy rain and drought", "River deposition", "Volcanic ash falling", "Wind blowing sand"]
        answer: "Leaching of silica and lime under alternate heavy rain and drought"
        difficulty: 2
        hints: ["Minerals are washed out."]
        solution: "Leaching."
        mistakes: {"River deposition": plateau_soils}
      - prompt: "A soil that stays where it formed is called"
        options: ["In-situ soil", "Transported soil", "Alluvial soil", "Sandy soil"]
        answer: "In-situ soil"
        difficulty: 2
        hints: ["Black soil is an example."]
        solution: "In-situ soil."
        mistakes: {"Transported soil": plateau_soils}
      - prompt: "Thorn forests grow where annual rainfall is below"
        answer: "75"
        check: "75"
        difficulty: 2
        hints: ["Answer in cm."]
        solution: "Below 75 cm."
        mistakes: {"200": plateau_soils}
      - prompt: "Why is black soil good for crops even in summer?"
        options: ["It holds water well", "It is very sandy", "It has no minerals", "It is always frozen"]
        answer: "It holds water well"
        difficulty: 2
        hints: ["Water-retaining capacity."]
        solution: "It retains moisture."
        mistakes: {"It is very sandy": plateau_soils}

  - code: ss9.plateau.resources_life
    title: Agriculture, minerals and life on the plateau
    after: [ss9.plateau.vegetation_soil]
    notes: |
      Farming is limited by undulating land, eroded thin topsoil, steep slopes, exposed rocks and hills;
      still rice, wheat, cotton, sugarcane, tobacco, tea and coffee are grown. Plantations dominate the
      Western Ghats; paddy on hill terraces in the Nilgiris. Coffee: Karnataka has about 59% of plantations
      and 71% of production; Kerala is second with 22%; Arabica and Robusta. Bababudan brought seven coffee
      seeds from Arabia in the later 17th century and planted them in the Chikkamagaluru hills (Bababudan
      Hills). Tea: Nilgiris and Western Ghats (Tamil Nadu, Karnataka, Kerala) have 44% of plantations and 25%
      of production; labour-intensive. Sugarcane: the Deccan is most favourable (black soil, tropical climate,
      long crushing season, high sucrose), though the Northern Plains have more area. Cotton: planted around
      October, harvested January–May; needs 21–30 °C, 50–100 cm rain, frost-free months; black soil of the
      Deccan-Malwa best; Gujarat leads, then Maharashtra. Minerals: concentrated in crystalline rocks;
      Chota Nagpur is the heartland. Zones: north-eastern (Chota Nagpur–Odisha: coal, iron ore, manganese,
      mica, bauxite, copper; largest belt), central (Chhattisgarh, MP, Telangana, AP, Maharashtra:
      manganese, bauxite, limestone, marble, coal, mica, iron, graphite), southern (Karnataka plateau and
      Tamil Nadu: iron ore, bauxite, lignite), south-western (western Karnataka and Goa: iron ore, clay),
      north-western (Aravalis of Rajasthan and Gujarat: copper, lead, zinc, uranium, mica). Population grew
      with mining, roads and railways, mineral industries and irrigated commercial farming.
    explanations:
      text: "The plateau is hard to farm but rich: coffee and tea on the Ghats, cotton and sugarcane on black soil, and India's biggest mineral belt in Chota Nagpur. Mining and industry drew people and built cities."
      visual: "Picture a map with five coloured mineral patches: black (coal) in Jharkhand and Odisha, grey in central India, red (iron) in Karnataka and Goa, and copper-coloured in the Aravalis."
      step_by_step: "To read a percentage: Step 1: Karnataka makes 71% of India's coffee. Step 2: Kerala makes 22%. Step 3: together 93%, leaving 7% for the rest of India."
      real_world: "Wayanad's coffee estates are part of the 22% of India's coffee that Kerala grows."
    items:
      - prompt: "Which state is India's leading coffee producer?"
        options: ["Karnataka", "Kerala", "Tamil Nadu", "Assam"]
        answer: "Karnataka"
        difficulty: 1
        hints: ["About 71% of production."]
        solution: "Karnataka."
        mistakes: {"Kerala": plateau_resources}
      - prompt: "Who brought the first coffee seeds to India?"
        options: ["Bababudan", "Vasco da Gama", "Tenzing Norgay", "Mahatma Gandhi"]
        answer: "Bababudan"
        difficulty: 1
        hints: ["He planted seven seeds in Chikkamagaluru."]
        solution: "Bababudan."
        mistakes: {"Vasco da Gama": plateau_resources}
      - prompt: "Which state leads in cotton production?"
        options: ["Gujarat", "Kerala", "Punjab", "Assam"]
        answer: "Gujarat"
        difficulty: 2
        hints: ["Maharashtra comes second."]
        solution: "Gujarat."
        mistakes: {"Punjab": plateau_resources}
      - prompt: "Karnataka produces 71% and Kerala 22% of India's coffee. What percentage do all other states produce together?"
        answer: "7"
        check: "100 - (71 + 22)"
        difficulty: 2
        hints: ["Total is 100%."]
        solution: "100 − 93 = 7%."
        mistakes: {"93": plateau_resources}
      - prompt: "Which region is called the heartland of minerals?"
        options: ["Chota Nagpur Plateau", "Nilgiri Hills", "Malwa Plateau", "Deccan Trap"]
        answer: "Chota Nagpur Plateau"
        difficulty: 1
        hints: ["It spreads over Jharkhand, West Bengal and Odisha."]
        solution: "The Chota Nagpur Plateau."
        mistakes: {"Deccan Trap": plateau_resources}
      - prompt: "The Aravalis of Rajasthan are rich in which minerals?"
        options: ["Copper, lead, zinc, uranium and mica", "Coal and lignite only", "Iron ore and clay only", "Salt"]
        answer: "Copper, lead, zinc, uranium and mica"
        difficulty: 2
        hints: ["The north-western mineral zone."]
        solution: "Copper, lead, zinc, uranium, mica."
        mistakes: {"Iron ore and clay only": plateau_resources}
      - prompt: "Why is the Deccan very favourable for sugarcane?"
        options: ["Black soil, tropical climate, a long crushing season and high sucrose", "Snowfall in winter", "Desert conditions", "Very low rainfall and frost"]
        answer: "Black soil, tropical climate, a long crushing season and high sucrose"
        difficulty: 2
        hints: ["Think of soil and climate."]
        solution: "Those four factors."
        mistakes: {"Snowfall in winter": plateau_resources}
      - prompt: "Why did the population of the plateau grow over time?"
        options: ["Mining, roads and railways, industries and irrigated farming attracted people", "The climate became cold", "The plateau sank to sea level", "Rivers became navigable"]
        answer: "Mining, roads and railways, industries and irrigated farming attracted people"
        difficulty: 3
        hints: ["Early on, the land was hard to farm."]
        solution: "Human effort created jobs and cities."
        mistakes: {"Rivers became navigable": plateau_resources}
