      - teach: 'Minerals lie in the old crystalline rocks. Chota Nagpur–Odisha is the biggest belt: coal, iron ore, manganese, mica, bauxite. The Aravalis have copper, lead, zinc and uranium. Mining, railways and industries brought more people to the plateau.'
