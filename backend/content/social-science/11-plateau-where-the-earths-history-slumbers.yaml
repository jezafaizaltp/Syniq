        mistakes: {"Plateau": plateau_parts}
      - prompt: "Where do the Western Ghats and Eastern Ghats meet?"
        options: ["Nilgiri Hills", "Aravali Hills", "Rajmahal Hills", "Satpura Range"]
        answer: "Nilgiri Hills"
