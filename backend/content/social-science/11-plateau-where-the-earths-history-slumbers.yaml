      - label: Seven seeds brought by Bababudan
        bin: Coffee
        clue: Planted in the Chikkamagaluru hills.
        why: Coffee came to India this way.
      - label: Arabica and Robusta
        bin: Coffee
        clue: Two varieties.
        why: Coffee varieties.
      - label: Karnataka gives 71% of production
        bin: Coffee
        clue: Kerala is second with 22%.
        why: Coffee.
      - label: 'Nilgiris: 44% of plantations'
        bin: Tea
        clue: Labour-intensive plucking on hills.
        why: Tea.
      - label: Needs 21–30 °C and frost-free months; harvested January–May
        bin: Cotton
        clue: Grows best in black soil.
        why: Cotton.
      - label: Gujarat leads production
        bin: Cotton
        clue: Then Maharashtra.
        why: Cotton.
      - label: High sucrose, long crushing season in the Deccan
        bin: Sugarcane
        clue: Black soil and tropical climate.
        why: Sugarcane.
    lesson:
      - teach: 'Farming on the plateau is hard in places: uneven land, thin topsoil, rocks. Still it grows rice, cotton, sugarcane, tea and coffee. Karnataka leads in coffee, Kerala is second. Bababudan brought the first coffee seeds from Arabia to Chikkamagaluru. Tea grows in the Nilgiris and Western Ghats.'
        check:
          prompt: Which state is second in coffee after Karnataka?
          options:
          - Kerala
          - Punjab
          - Assam
          answer: Kerala
          why: Kerala's Western Ghats grow about a fifth of India's coffee.
        ways:
