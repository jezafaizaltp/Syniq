subject: ss
chapter: 11
title: Plateau where the Earth's History Slumbers

tips:
  ancient_block: "The plateau is a piece of the ancient southern supercontinent, made of very old hard rocks. How does its age compare with the young Himalayas?"
  rivers_show_slope: "Most big peninsular rivers, like the Godavari and Krishna, flow into the Bay of Bengal. Which way must the land slope?"
  rift_estuary: "Deltas build where rivers drop lots of sediment slowly. These two rivers run fast through narrow rift valleys over hard rock. What does that leave at their mouths?"
  rain_only: "Peninsular rivers have no snow or glaciers at their source. What happens to them in the dry months?"
  leached_soil: "Heavy rain washes soluble nutrients down and out of laterite. What is left behind for crops?"
  forest_by_rain: "Teak and sal shed their leaves in the dry season and need moderate to good rain. Which forest type is that?"
  slope_drainage: "Tea and coffee bushes rot if water stands around their roots. What does a hill slope do to rainwater?"
  ore_and_coal: "Making steel needs iron ore and coal. What does the Chota Nagpur region have under the ground?"
  k9_coffee_top: "Coffee first came to the Baba Budan hills, and that state still grows about seven-tenths of India's coffee. Kerala comes second."
  k9_basalt: "The Deccan Trap was made by huge lava flows. Which dark rock forms when lava cools?"
  plateau_parts: "'Dakshin' is a direction word; think of the word for the opposite of north. The plateau richest in minerals is in Jharkhand, named after the city of Nagpur."
  ghats: "Peninsular India's highest peak is in Kerala, in the Anamalai hills; its name means 'elephant head'. The Western and Eastern Ghats meet in the Nilgiris. In Maharashtra the Western Ghats have a local name. East-flowing rivers cut through the Eastern Ghats. For differences and ratios, compute carefully."
  rain_shadow: "Moist winds rise up the mountain, cool and drop their rain on the windward side. The far side, sheltered from the rain, is said to be in the mountain's 'shadow' and gets much less."
  peninsular_rivers: "The biggest peninsular river is called the 'Ganga of the south'. Only two big rivers flow west into the Arabian Sea, through rift valleys. A river that gets both monsoons flows nearly all year. Chambal's badlands are cut into gullies. Add the shares carefully."
  plateau_soils: "Soils come from their rocks: lava (basalt) gives dark soil that holds water and suits cotton; heavy rain followed by dry spells washes away silica and lime, leaving laterite. The evergreen forests of the high southern hills have a local name. In-situ means formed in place."
  plateau_resources: "Coffee arrived in India with a Sufi saint who brought seeds from Yemen to Karnataka's hills. Use the chapter's table for the top producer of each crop, and subtract shares from 100. Chota Nagpur is the mineral heartland. Population grew with mines, roads and industry."

concepts:
  - code: ss9.plateau.parts
    title: The Peninsular Plateau, the Deccan and the Ghats
    notes: |
      Plateaus are relatively flat, extensive landforms higher than their surroundings; types:
      intermontane, piedmont, continental. The Peninsular Plateau is roughly triangular, 600–900 m high,
      over 16 lakh sq km, one of the world's oldest landforms; bordered by the Western Ghats and Eastern
      Ghats. Two parts. Deccan Plateau: south of the Satpura ranges, with Satpura, Maikala and Mahadeo
      Hills on its north; 'Deccan' from Sanskrit 'Dakshin' (south); crystalline rocks (basalt, granite,
      gneiss) from ancient lava flows; the north-west basalt area is the Deccan Trap, with black (regur)
      soil. Western Ghats: about 1600 km from Kanyakumari to Gujarat; height increases north to south;
      Anamudi (2695 m) in Anamalai, Kerala, highest in Peninsular India; Dodabetta (2637 m) in the Nilgiris;
      called Anamalai and Elamalai in Kerala, Nilgiris in Karnataka and Tamil Nadu, Sahyadris in
      Maharashtra; most peninsular rivers rise here. Eastern Ghats: lower hills (Javadi, Palkonda,
      Nallamalai, Mahendragiri), about 800 km from the Mahanadi in Odisha to the Nilgiris, broken by
      east-flowing rivers; the two Ghats meet at the Nilgiris. Nilgiris: Ooty (Queen of Hills), Kotagiri,
      Coonoor; India's first Biosphere Reserve. Central Highlands: north of the Satpuras; Malwa Plateau
      with the Aravalis on its west (old, worn-down residual fold mountains); Mount Abu is the highest peak
      and a hill station. Chota Nagpur Plateau in the east, south of the Rajmahal Hills, is the richest
      storehouse of minerals. Parts of Jaisalmer, the Meghalaya Plateau and Kachchh-Kathiawar outcrops
      also belong to the Peninsular Plateau.
    explanations:
      text: "The Peninsular Plateau is the old, high table-land of south and central India. The Deccan lies between the two Ghats; the Central Highlands lie north of the Satpuras. The Western Ghats are tall and continuous; the Eastern Ghats are low and broken."
      visual: "Draw an upside-down triangle for the Peninsula. Make the left edge a tall wall (Western Ghats) and the right edge a row of broken low hills (Eastern Ghats). They meet near the bottom at the Nilgiris."
      step_by_step: "To place a feature: Step 1: south of the Satpuras, between the Ghats? Deccan Plateau. Step 2: north of the Satpuras (Malwa, Aravali, Mount Abu, Chota Nagpur)? Central Highlands."
      real_world: "Anamudi in Idukki district, Kerala, is the highest peak in India south of the Himalayas."
    activity:
      type: sort
      prompt: Where is it?
      bins:
      - Western Ghats
      - Eastern Ghats
      - Central Highlands
      items:
      - label: Anamudi, 2695 m
        bin: Western Ghats
        clue: Highest peak in Peninsular India, in Kerala.
        why: In the Anamalai, Western Ghats.
      - label: Called the Sahyadris in Maharashtra
        bin: Western Ghats
        clue: A long, continuous wall near the west coast.
        why: Western Ghats.
      - label: About 1600 km, Kanyakumari to Gujarat
        bin: Western Ghats
        clue: Continuous, along the Arabian Sea side.
        why: Western Ghats.
      - label: Javadi and Nallamalai hills
        bin: Eastern Ghats
        clue: Low hills near the Bay of Bengal side.
        why: Eastern Ghats.
      - label: Broken by rivers flowing east
        bin: Eastern Ghats
        clue: Not one continuous wall.
        why: Eastern Ghats.
      - label: Malwa Plateau and Mount Abu
        bin: Central Highlands
        clue: North of the Satpuras.
        why: Central Highlands.
    items:
      - prompt: "The highest peak in Peninsular India is"
        options: ["Anamudi", "Dodabetta", "Mount Abu", "K2"]
        answer: "Anamudi"
        difficulty: 1
        hints: ["It is in Kerala."]
        solution: "Anamudi (2695 m)."
        mistakes: {"Dodabetta": ghats}
      - prompt: "The word 'Deccan' comes from the Sanskrit 'Dakshin', meaning"
        options: ["South", "Plateau", "Black", "River"]
        answer: "South"
        difficulty: 1
