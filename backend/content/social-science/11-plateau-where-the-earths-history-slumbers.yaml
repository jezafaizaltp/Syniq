      - teach: 'Most plateau soils are in-situ: formed where they lie. Black soil (regur) comes from basalt and holds water, great for cotton. Red soil comes from old crystalline rocks; iron makes it red. Laterite forms when heavy rain and dry spells wash out (leach) silica and lime, so it is poor without fertiliser, but grows tea, coffee, rubber.'
