        solution: "The Sahyadris."
        mistakes: {"Nilgiris": ghats}
      - prompt: "Which plateau is called the richest storehouse of minerals?"
        options: ["Chota Nagpur Plateau", "Malwa Plateau", "Deccan Trap", "Meghalaya Plateau"]
        answer: "Chota Nagpur Plateau"
        difficulty: 2
        hints: ["South of the Rajmahal Hills."]
        solution: "The Chota Nagpur Plateau."
        mistakes: {"Malwa Plateau": plateau_parts}
      - prompt: "The Western Ghats run about 1600 km and the Eastern Ghats about 800 km. How many times longer are the Western Ghats?"
        answer: "2"
        check: "1600/800"
        difficulty: 1
