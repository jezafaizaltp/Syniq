  - code: ss9.plateau.resources_life
    title: Agriculture, minerals and life on the plateau
    after: [ss9.plateau.vegetation_soil]
    notes: |
      Farming is limited by undulating land, eroded thin topsoil, steep slopes, exposed rocks and hills;
      still rice, wheat, cotton, sugarcane, tobacco, tea and coffee are grown. Plantations dominate the
      Western Ghats; paddy on hill terraces in the Nilgiris. Coffee: Karnataka has about 59% of plantations
      and 71% of production; Kerala is second with 22%; Arabica and Robusta. Bababudan brought seven coffee
      seeds from Arabia in the later 17th century and planted them in the Chikkamagaluru hills (Bababudan
      Hills). Tea: Nilgiris and Western Ghats (Tamil Nadu, Karnataka, Kerala) have 44% of plantations and 25%
      of production; labour-intensive. Sugarcane: the Deccan is most favourable (black soil, tropical climate,
      long crushing season, high sucrose), though the Northern Plains have more area. Cotton: planted around
      October, harvested January–May; needs 21–30 °C, 50–100 cm rain, frost-free months; black soil of the
      Deccan-Malwa best; Gujarat leads, then Maharashtra. Minerals: concentrated in crystalline rocks;
      Chota Nagpur is the heartland. Zones: north-eastern (Chota Nagpur–Odisha: coal, iron ore, manganese,
      mica, bauxite, copper; largest belt), central (Chhattisgarh, MP, Telangana, AP, Maharashtra:
      manganese, bauxite, limestone, marble, coal, mica, iron, graphite), southern (Karnataka plateau and
      Tamil Nadu: iron ore, bauxite, lignite), south-western (western Karnataka and Goa: iron ore, clay),
      north-western (Aravalis of Rajasthan and Gujarat: copper, lead, zinc, uranium, mica). Population grew
      with mining, roads and railways, mineral industries and irrigated commercial farming.
    explanations:
      text: "The plateau is hard to farm but rich: coffee and tea on the Ghats, cotton and sugarcane on black soil, and India's biggest mineral belt in Chota Nagpur. Mining and industry drew people and built cities."
