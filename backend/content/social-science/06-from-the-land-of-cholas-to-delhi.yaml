# Class 9 Social Science I, chapter 6. Format: content/README.md.
subject: ss
chapter: 6
title: From the Land of Cholas to Delhi

tips:
  sea_power: "The Chola lands faced the Bay of Bengal. What did the sea offer them, and how far did Rajendra I's fleet reach?"
  which_assembly: "Each kind of settlement had its own assembly: brahmin villages, merchant towns, and ordinary villages of landholders."
  fake_coins: "A copper coin was meant to be worth as much as a silver one. What happens when anyone can make copper coins at home?"
  woman_sultan: "Iltutmish chose his daughter to rule after him. Which ruler was she?"
  k9_nagaram: "Merchants lived in towns, so their assembly's name comes from the word for town or city (as in 'nagar')."
  k9_sabha: "Ordinary villages had the 'ur'; brahmin villages had a different, Sanskrit-named assembly, the one described in the Uttaramerur inscriptions."
  chola_rulers: "Two Chola kings: the father built the great temple at Thanjavur; his son sent armies north to the great northern river and ships to South-East Asia, and took a title saying he 'took the Ganga'."
  chola_assemblies: "Each village type had its own assembly: ur for ordinary villages, sabha for brahmin villages, nagaram for merchants. In kudavolai, names were written on palm leaves and picked by lot."
  sultanate_order: "Delhi Sultanate dynasties in order: Mamluk (Slave), Khalji, Tughlaq, Sayyid, Lodi (1206–1526)."
  tughlaq_experiments: "The sultan who moved the capital south to the Deccan and tried token copper coins was a Tughlaq. An iqta was land whose revenue was given to an officer in place of salary."
  khalji_reforms: "The sultan who kept a huge standing army also fixed prices in Delhi's markets so soldiers could live on low pay. He belonged to the Khalji family."
  iqta_meaning: "An iqta was a territory whose revenue was assigned to an officer (iqtadar or muqti) instead of a salary; it could be transferred and was not hereditary."
  sultanate_end: "The Delhi Sultanate ended in 1526 when Babur defeated Ibrahim Lodi at the First Battle of Panipat."
  chola_bronze: "Chola art is famous for bronze images like Nataraja. Bhimbetka paintings are prehistoric; miniatures are Mughal."
  chola_local_govt: "Chola villages ran their own affairs through assemblies and committees, much like panchayats today."
  kaveri_delta: "The Chola heartland was the rich delta of the main river of Tamil Nadu, which flows from Karnataka."
  variyam_tasks: "Chola village committees (variyams) ran the village's daily needs: water tanks, gardens, the temple and settling disputes."
  years_between: "Years ruled = end year − start year."

concepts:
  - code: ss9.cholas.empire
    title: The Chola empire
    notes: |
      The Cholas of the Kaveri delta rose again in the 9th century under Vijayalaya, who captured
      Thanjavur. Rajaraja I (985–1014) built a strong army and navy and the Brihadisvara (Rajarajeshwaram)
      temple at Thanjavur. His son Rajendra I campaigned up to the Ganga, took the title Gangaikondachola,
      built a new capital Gangaikonda Cholapuram, and sent a naval expedition to Srivijaya in
      South-East Asia. Chola bronze sculpture (such as Nataraja) is world famous. Irrigation tanks
      and canals supported rich agriculture.
    explanations:
      text: "From the fertile Kaveri delta the Cholas built one of the strongest kingdoms of South India. Rajaraja's huge temple at Thanjavur still stands, and his son's navy sailed as far as present-day Indonesia and Malaysia. Their bronze idols of Nataraja are admired in museums worldwide."
      visual: "Draw a map of South India with an arrow from Thanjavur north to the Ganga (Rajendra's army) and another arrow east across the sea to Srivijaya (his navy)."
      step_by_step: "Who built Gangaikonda Cholapuram? Step 1: The name means 'city of the Chola who took the Ganga'. Step 2: The Chola who reached the Ganga was Rajendra I. Step 3: So Rajendra I built it."
      real_world: "The Brihadisvara temple at Thanjavur is part of the UNESCO World Heritage site 'Great Living Chola Temples'."
    activity:
      type: order
      prompt: Put the Chola story in order.
      steps:
      - Vijayalaya captures Thanjavur (9th century)
      - Rajaraja I builds the Brihadisvara temple
      - Rajendra I campaigns up to the Ganga
      - Gangaikonda Cholapuram becomes the new capital
      reasons:
        Rajaraja I builds the Brihadisvara temple: Rajaraja I (985–1014) ruled more than a century after Vijayalaya.
        Rajendra I campaigns up to the Ganga: Rajendra I was Rajaraja's son, so he came next.
        Gangaikonda Cholapuram becomes the new capital: The capital was named after the Ganga campaign, so it came after it.
    items:
      - prompt: "Who built the Brihadisvara temple at Thanjavur?"
        options: ["Rajaraja I", "Rajendra I", "Vijayalaya", "Alauddin Khalji"]
        answer: "Rajaraja I"
        difficulty: 1
        hints: ["Also called Rajarajeshwaram."]
        solution: "Rajaraja I built it."
        mistakes: {"Rajendra I": chola_rulers}
      - prompt: "Which Chola ruler sent a naval expedition to Srivijaya in South-East Asia?"
        options: ["Rajendra I", "Rajaraja I", "Vijayalaya", "Iltutmish"]
        answer: "Rajendra I"
        difficulty: 2
        hints: ["He also reached the Ganga."]
        solution: "Rajendra I led the expedition to Srivijaya."
        mistakes: {"Rajaraja I": chola_rulers}
      - prompt: "The Chola kingdom grew in the delta of which river?"
        options: ["Kaveri", "Ganga", "Indus", "Periyar"]
        answer: "Kaveri"
        difficulty: 1
        hints: ["In Tamil Nadu."]
        solution: "The Cholas were based in the Kaveri delta."
        mistakes: {"Ganga": "kaveri_delta", "Periyar": "kaveri_delta"}
      - prompt: "Chola art is especially famous for:"
        options: ["Bronze sculptures such as Nataraja", "Cave paintings at Bhimbetka", "Harappan seals", "Mughal miniatures"]
        answer: "Bronze sculptures such as Nataraja"
        difficulty: 2
        hints: ["Cast in metal."]
        solution: "Chola bronzes, especially Nataraja, are world famous."
        mistakes: {"Cave paintings at Bhimbetka": "chola_bronze", "Mughal miniatures": "chola_bronze"}
      - prompt: "Rajaraja I ruled from 985 to 1014 CE. For how many years did he rule?"
        answer: "29"
        check: "1014 - 985"
        difficulty: 2
        hints: ["Subtract the years."]
        solution: "1014 − 985 = 29 years"
        mistakes: {"1999": "years_between", "30": "years_between"}
      - prompt: "Why did Rajendra I take the title Gangaikondachola?"
        options: ["His army reached the river Ganga", "He was born on the Ganga", "He built a dam on the Ganga", "He lost a battle at the Ganga"]
        answer: "His army reached the river Ganga"
        difficulty: 3
        hints: ["'The Chola who took the Ganga'."]
        solution: "The title celebrates his northern campaign to the Ganga."
        mistakes: {"He built a dam on the Ganga": chola_rulers}
      - prompt: "Why did the Cholas build a strong navy?"
        options: ["To control sea trade with South-East Asia and protect their coast", "Because they had no army", "To fight the Delhi Sultanate", "To cross the Himalayas"]
        answer: "To control sea trade with South-East Asia and protect their coast"
        difficulty: 2
        hints: ["Their kingdom lay along the east coast.", "Rajendra I sent ships to Srivijaya."]
        solution: "Step 1: The Cholas faced the Bay of Bengal and traded overseas. Step 2: A navy protected that trade and let Rajendra I attack Srivijaya and Sri Lanka."
        mistakes: {"Because they had no army": sea_power, "To fight the Delhi Sultanate": sea_power, "To cross the Himalayas": sea_power}
      - prompt: "Rajaraja I ruled from 985 to 1014 CE, and his son Rajendra I from 1014 to 1044 CE. For how many years did father and son rule in all?"
        answer: "59"
        check: "1044-985"
        difficulty: 2
        hints: ["The son's reign began when the father's ended.", "1044 − 985."]
        solution: "Step 1: Rajaraja: 29 years; Rajendra: 30 years. Step 2: Together 1044 − 985 = 59 years."
        mistakes: {"29": years_between, "30": years_between, "2029": years_between}

  - code: ss9.cholas.villages
    title: Chola villages and local self-government
    after: [ss9.cholas.empire]
    notes: |
      The Chola kingdom was divided into mandalams, valanadus, nadus and villages. Villages ran many
      of their own affairs through assemblies: the ur (assembly of a common village), the sabha
      (assembly of a brahmadeya, brahmin village) and the nagaram (merchants' assembly). The
      Uttaramerur inscriptions (in the reign of Parantaka I, 10th century) describe how sabha members
      were chosen: names written on palm leaves were put in a pot (kudavolai) and drawn by a child.
      Committees (variyams) looked after tanks, gardens, temples and justice. Rules barred people who
      had not submitted accounts.
    explanations:
      text: "A thousand years ago some Tamil villages had written election rules. Candidates had to own some land, be of a certain age and know the scriptures. Names were written on palm leaves, dropped in a pot, and a young boy drew them out. The chosen members served on committees for tanks, gardens and justice."
      visual: "Draw a clay pot with palm-leaf slips inside and a child's hand drawing one out; label it 'kudavolai, Uttaramerur'."
      step_by_step: "Which assembly ran a brahmin village (brahmadeya)? Step 1: Common villages had the ur. Step 2: Brahmadeya villages had the sabha. Step 3: So the sabha."
      real_world: "Uttaramerur in Tamil Nadu is often mentioned in speeches about the ancient roots of local democracy in India."
    activity:
      type: sort
      prompt: Which Chola assembly?
      bins:
      - Ur
      - Sabha
      - Nagaram
      items:
      - label: Assembly of a common village
        bin: Ur
        clue: Most villages had this one.
        why: The ur was the assembly of an ordinary village.
      - label: Assembly of a brahmadeya village
        bin: Sabha
        clue: A village granted to brahmins.
        why: The sabha met in brahmadeya villages.
      - label: Members chosen by kudavolai (palm leaves in a pot)
        bin: Sabha
        clue: Described in the Uttaramerur inscriptions.
        why: Uttaramerur's sabha used kudavolai.
      - label: Committees (variyams) for tanks and gardens
        bin: Sabha
        clue: Uttaramerur again.
        why: The sabha worked through variyams.
      - label: Assembly of merchants
        bin: Nagaram
        clue: Traders' town.
        why: The nagaram was the merchants' assembly.
      - label: Traders deciding market matters
        bin: Nagaram
        clue: Who runs trade?
        why: The nagaram.
    items:
      - prompt: "The assembly of a brahmadeya (brahmin) village under the Cholas was called:"
        options: ["Sabha", "Ur", "Nagaram", "Iqta"]
        answer: "Sabha"
        difficulty: 1
        hints: ["The ur was for common villages."]
        solution: "Brahmadeya villages had the sabha."
        mistakes: {"Ur": k9_sabha}
      - prompt: "The assembly of merchants in Chola towns was called:"
        options: ["Nagaram", "Sabha", "Ur", "Samiti"]
        answer: "Nagaram"
        difficulty: 2
        hints: ["Nagara = town."]
        solution: "The nagaram was the merchants' assembly."
        mistakes: {"Sabha": k9_nagaram}
      - prompt: "Which inscriptions describe how Chola sabha members were chosen?"
        options: ["Uttaramerur inscriptions", "Allahabad pillar inscription", "Tharisappalli copper plates", "Ashoka's edicts"]
        answer: "Uttaramerur inscriptions"
        difficulty: 1
        hints: ["A village near Kanchipuram."]
        solution: "The Uttaramerur inscriptions record the selection rules."
        mistakes: {"Tharisappalli copper plates": tharisappalli}
      - prompt: "In the kudavolai system, how were members chosen?"
        options: ["Names on palm leaves were drawn from a pot", "The king appointed them", "They were the eldest sons", "They fought a duel"]
        answer: "Names on palm leaves were drawn from a pot"
        difficulty: 2
        hints: ["Kudam = pot, olai = palm leaf."]
        solution: "Palm-leaf tickets were drawn from a pot by a child."
        mistakes: {"The king appointed them": chola_assemblies}
      - prompt: "What did Chola village committees (variyams) look after?"
        options: ["Tanks, gardens, temples and justice", "Only the army", "Foreign trade only", "Coin making"]
        answer: "Tanks, gardens, temples and justice"
        difficulty: 2
        hints: ["Local matters."]
        solution: "Committees handled local works such as irrigation tanks, gardens and disputes."
        mistakes: {"Only the army": "variyam_tasks", "Coin making": "variyam_tasks"}
      - prompt: "Why is the Chola village system often compared with local self-government today?"
        options: ["Villages managed their own affairs through elected assemblies and committees", "The king ran every village directly", "There were no rules", "Only soldiers could vote"]
        answer: "Villages managed their own affairs through elected assemblies and committees"
        difficulty: 3
        hints: ["Think of panchayats."]
        solution: "Like panchayats, Chola villages governed local matters through assemblies."

        mistakes: {"The king ran every village directly": "chola_local_govt", "There were no rules": "chola_local_govt"}
      - prompt: "What do the Uttaramerur inscriptions about the kudavolai system show?"
        options: ["Members were chosen by drawing lots, with rules on who could stand", "The king appointed every member", "Only merchants could be members", "There were no village assemblies"]
        answer: "Members were chosen by drawing lots, with rules on who could stand"
        difficulty: 3
        hints: ["Kudam means pot; olai means palm leaf.", "The inscriptions also list who could not be chosen."]
        solution: "Step 1: Names on palm leaves were put in a pot and drawn. Step 2: Rules set qualifications (land, age, learning) and barred wrongdoers."
        mistakes: {"The king appointed every member": chola_assemblies, "Only merchants could be members": k9_nagaram, "There were no village assemblies": chola_assemblies}
      - prompt: "Which Chola assembly ran an ordinary village of landholders that was not a brahmin settlement?"
        options: ["Ur", "Sabha", "Nagaram", "Variyam"]
        answer: "Ur"
        difficulty: 2
        hints: ["The sabha was for brahmadeya villages.", "The nagaram was for merchants."]
        solution: "Step 1: Sabha: brahmin villages. Nagaram: merchant towns. Step 2: The ur was the assembly of ordinary villages; variyams were committees."
        mistakes: {"Sabha": which_assembly, "Nagaram": which_assembly, "Variyam": which_assembly}
  - code: ss9.cholas.sultanate
    title: The Delhi Sultanate
    after: [ss9.cholas.empire]
    notes: |
      The Delhi Sultanate (1206–1526) began when Qutbuddin Aibak became sultan in 1206. Dynasties:
      Mamluk (Slave) — Aibak, Iltutmish (completed the Qutb Minar), Razia Sultan (the only woman
      sultan), Balban; Khalji — Alauddin Khalji (standing army, market price control, resisted Mongol
      invasions); Tughlaq — Muhammad bin Tughlaq (capital shifted to Daulatabad, token currency;
      Ibn Battuta visited), Firoz Shah Tughlaq; Sayyid; Lodi. The iqta system assigned the revenue of
      a territory to officers (muqtis) in place of salary. Persian was the language of
      administration. The Sultanate ended in 1526 when Babur defeated Ibrahim Lodi at Panipat.
    explanations:
      text: "For three centuries five dynasties ruled from Delhi. Sultans tried bold ideas: Alauddin Khalji fixed prices so he could pay a large army cheaply, and Muhammad bin Tughlaq moved his capital south and issued copper coins that were to be valued like silver, which failed because people forged them. Officers were paid with the revenue of territories called iqtas."
      visual: "Draw a timeline from 1206 to 1526 split into five coloured blocks: Mamluk, Khalji, Tughlaq, Sayyid, Lodi. Mark 1526 'Panipat — Babur'."
      step_by_step: "How long did the Delhi Sultanate last? Step 1: It began in 1206. Step 2: It ended in 1526. Step 3: 1526 − 1206 = 320 years."
      real_world: "The Qutb Minar in Delhi, begun by Aibak and completed by Iltutmish, is a UNESCO World Heritage site."
    activity:
      type: sort
      prompt: Which Delhi Sultanate dynasty?
      bins:
      - Mamluk (Slave)
      - Khalji
      - Tughlaq
      items:
      - label: Qutbuddin Aibak becomes sultan in 1206
        bin: Mamluk (Slave)
        clue: The very first dynasty.
        why: Aibak founded the Mamluk dynasty.
      - label: Razia, the only woman sultan
        bin: Mamluk (Slave)
        clue: Daughter of Iltutmish.
        why: Mamluk.
      - label: Iltutmish completes the Qutb Minar
        bin: Mamluk (Slave)
        clue: Aibak's successor.
        why: Mamluk.
      - label: Market price control and a standing army
        bin: Khalji
        clue: Alauddin, against the Mongols.
        why: Khalji.
      - label: Capital shifted to Daulatabad
        bin: Tughlaq
        clue: Muhammad bin ...
        why: Tughlaq.
      - label: Token currency; Ibn Battuta visits
        bin: Tughlaq
        clue: Same sultan as Daulatabad.
        why: Tughlaq.
      - label: Firoz Shah's rule
        bin: Tughlaq
        clue: Followed Muhammad.
        why: Tughlaq.
    items:
      - prompt: "Who founded the Delhi Sultanate in 1206?"
        options: ["Qutbuddin Aibak", "Alauddin Khalji", "Babur", "Ibrahim Lodi"]
        answer: "Qutbuddin Aibak"
        difficulty: 1
        hints: ["Founder of the Mamluk (Slave) dynasty."]
        solution: "Qutbuddin Aibak became the first sultan in 1206."
        mistakes: {"Babur": sultanate_end}
      - prompt: "Which is the correct order of Delhi Sultanate dynasties?"
        options: ["Mamluk, Khalji, Tughlaq, Sayyid, Lodi", "Khalji, Mamluk, Lodi, Tughlaq, Sayyid", "Lodi, Sayyid, Tughlaq, Khalji, Mamluk", "Mamluk, Tughlaq, Khalji, Lodi, Sayyid"]
        answer: "Mamluk, Khalji, Tughlaq, Sayyid, Lodi"
        difficulty: 2
        hints: ["It begins with the Slave dynasty and ends with the Lodis."]
        solution: "Mamluk → Khalji → Tughlaq → Sayyid → Lodi."
        mistakes: {"Mamluk, Tughlaq, Khalji, Lodi, Sayyid": sultanate_order}
      - prompt: "Who moved the capital from Delhi to Daulatabad?"
        options: ["Muhammad bin Tughlaq", "Alauddin Khalji", "Iltutmish", "Razia Sultan"]
        answer: "Muhammad bin Tughlaq"
        difficulty: 1
        hints: ["He also issued token currency."]
        solution: "Muhammad bin Tughlaq shifted the capital to Daulatabad."
        mistakes: {"Alauddin Khalji": tughlaq_experiments}
      - prompt: "Which sultan controlled market prices in Delhi?"
        options: ["Alauddin Khalji", "Muhammad bin Tughlaq", "Qutbuddin Aibak", "Ibrahim Lodi"]
        answer: "Alauddin Khalji"
        difficulty: 2
        hints: ["He needed to pay a large standing army."]
        solution: "Alauddin Khalji fixed prices to maintain his army."
        mistakes: {"Muhammad bin Tughlaq": khalji_reforms}
      - prompt: "What was an iqta?"
        options: ["A territory whose revenue was assigned to an officer instead of salary", "A type of temple", "A Chola village assembly", "A copper coin"]
        answer: "A territory whose revenue was assigned to an officer instead of salary"
        difficulty: 2
        hints: ["Held by a muqti or iqtadar."]
        solution: "Iqtas were revenue assignments to officers, transferable and not hereditary."
        mistakes: {"A Chola village assembly": iqta_meaning, "A copper coin": tughlaq_experiments}
      - prompt: "The Delhi Sultanate lasted from 1206 to 1526. For how many years was that?"
        answer: "320"
        check: "1526 - 1206"
        difficulty: 2
        hints: ["Subtract."]
        solution: "1526 − 1206 = 320 years"
        mistakes: {"2732": "years_between", "300": "years_between"}
      - prompt: "Which battle ended the Delhi Sultanate?"
        options: ["First Battle of Panipat, 1526", "Kalinga war", "Battle of Plassey", "Battle of Tarain"]
        answer: "First Battle of Panipat, 1526"
