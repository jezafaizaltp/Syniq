# Class 9 Chemistry, chapter 3. Format: content/README.md.
# Also uses tips from earlier chapters: valence_shell, ion_electrons, noble_full.
subject: chem
chapter: 3
title: Chemical Bonding

tips:
  ion_charge_strength: "Melting means pulling the ions apart. Compare the size of the charges on the ions in each compound."
  lone_pairs: "Count the outer electrons of the central atom, take away those used in bonds, and pair up what is left."
  ions_in_water: "Current in a solution needs ions that can move. Does the substance break into ions when it dissolves?"
  electrons_moved: "Count the electrons each metal atom gives, times the number of metal atoms in one unit."
  metals_lose: "Metals lose electrons to become positive ions; non-metals gain electrons to become negative ions."
  ionic_vs_covalent: "Ionic bonds form when a metal gives electrons to a non-metal. Covalent bonds form when non-metals share electrons."
  bond_pairs: "Each shared pair is 2 electrons: a single bond is one pair, a double bond two pairs, a triple bond three pairs. Count the bonds, then the pairs or electrons."
  charges_balance: "In an ionic formula the positive and negative charges must add up to zero. Cross over the charge numbers."
  valency_is_needed: "Valency is how many electrons an atom gives, takes or shares to complete its outer shell. Count how far the outer shell is from full (or from empty), whichever is fewer."
  polar_electronegativity: "A covalent bond is polar when the two atoms have different electronegativities; the more electronegative atom gets a slight negative charge."
  al_three: "Count aluminium's outer electrons from its configuration (13 electrons: 2, 8, …). It loses all of its outer electrons to form its ion."
  ions_must_move: "Current needs moving charges. In solid salt the ions are locked in place; melted or dissolved they can move."
  octet_duplet: "Helium's stable pair of two outer electrons has one name; the word for eight comes from the Latin for eight (as in October, once the eighth month)."

concepts:
  - code: chem9.bonding.octet
    title: Octet rule and valency
    notes: |
      Atoms combine to reach a stable configuration like a noble gas: 8 electrons in the outer shell
      (octet), or 2 for the first shell (duplet). They do this by losing, gaining or sharing
      electrons. Valency is the number of electrons lost, gained or shared: Na 1, Mg 2, Al 3, C 4,
      N 3, O 2, Cl 1. For 1–4 valence electrons valency = valence electrons; for 5–7 it is 8 − valence.
    explanations:
      text: "Atoms 'want' the full outer shell of a noble gas. Sodium (2, 8, 1) finds it easiest to lose 1 electron and become like neon. Chlorine (2, 8, 7) needs just 1 more. So sodium's valency is 1 and chlorine's is 1. Oxygen (2, 6) needs 2: valency 2."
      visual: "Draw each atom's outer shell as a ring with 8 seats. Count the empty seats (to gain) or the lonely few (to lose). Whichever number is smaller is the valency."
      step_by_step: "Valency of nitrogen, Z = 7: Step 1: Configuration 2, 5. Step 2: 5 valence electrons; losing 5 is hard. Step 3: Gain or share 8 − 5 = 3. Step 4: Valency 3."
      real_world: "Helium is used in balloons partly because, with a full shell, it never catches fire, unlike hydrogen."
    activity:
      type: sort
      prompt: What is the valency?
      bins:
      - '1'
      - '2'
      - '3'
      items:
      - label: Sodium (2, 8, 1)
        bin: '1'
        clue: Is it easier to lose 1 or gain 7?
        why: 'It loses 1 electron to reach a full shell: valency 1.'
      - label: Magnesium (2, 8, 2)
        bin: '2'
        clue: Is it easier to lose 2 or gain 6?
        why: 'It loses 2: valency 2.'
      - label: Aluminium (2, 8, 3)
        bin: '3'
        clue: Is it easier to lose 3 or gain 5?
        why: 'It loses 3: valency 3.'
      - label: Chlorine (2, 8, 7)
        bin: '1'
        why: 'It needs 1 more electron for an octet: valency 1.'
        clue: How many more electrons to make 8?
      - label: Oxygen (2, 6)
        bin: '2'
        clue: How many more electrons to make 8?
        why: 'It needs 2 more: valency 2.'
      - label: Nitrogen (2, 5)
        bin: '3'
        clue: How many more electrons to make 8?
        why: 'It needs 3 more: valency 3.'
    lesson:
      - teach: 'Noble gases like neon and argon hardly react. Their outer shells are full: 8 electrons (an octet), or 2 for helium (a duplet). Other atoms combine so that they, too, end up with a full outer shell like a noble gas.'
        check:
          prompt: Why do noble gases hardly react?
          options:
          - Their outer shells are already full
          - They have no electrons
          - They are too heavy
          answer: Their outer shells are already full
          why: A full octet (or duplet for helium) is stable, so they don't need to gain, lose or share.
      - teach: An atom reaches an octet in the easiest way. Sodium (2, 8, 1) loses its 1 outer electron. Chlorine (2, 8, 7) gains 1. Carbon (2, 4) shares 4. The number of electrons lost, gained or shared is the valency.
        picture:
          kind: compare
          columns:
          - title: 1–3 outer electrons
            points:
            - lose them
            - valency = outer electrons
            - e.g. Mg 2, 8, 2 → valency 2
          - title: 5–7 outer electrons
            points:
            - gain to reach 8
            - valency = 8 − outer electrons
            - e.g. O 2, 6 → valency 2
          alt: Atoms with few outer electrons lose them; atoms with many gain until they have eight.
        check:
          prompt: What is the valency of fluorine (2, 7)?
          options:
          - '1'
          - '7'
          - '9'
          answer: '1'
          why: 'It needs 1 more electron to reach 8: valency 8 − 7 = 1.'
      - teach: 'Valency helps write formulas. Cross over the valencies: aluminium (3) and oxygen (2) give Al₂O₃. Calcium (2) and chlorine (1) give CaCl₂.'
        check:
          prompt: Using valencies Na 1 and O 2, what is the formula of sodium oxide?
          options:
          - Na₂O
          - NaO₂
          - NaO
          answer: Na₂O
          why: 'Cross over: Na takes O''s 2, O takes Na''s 1: Na₂O.'
    items:
      - prompt: "What is the valency of magnesium (configuration 2, 8, 2)?"
        answer: "2"
        check: "2"
        difficulty: 1
        hints: ["It loses its 2 outer electrons."]
        solution: "Magnesium loses 2 electrons to reach 2, 8, so valency 2."
        mistakes: {"6": valency_is_needed}
      - prompt: "What is the valency of oxygen (atomic number 8)?"
        answer: "2"
        check: "8 - 6"
        difficulty: 1
        hints: ["Configuration 2, 6. How many to reach 8?"]
        solution: "Oxygen needs 8 − 6 = 2 more electrons: valency 2."
        mistakes: {"6": valency_is_needed}
      - prompt: "What is the valency of nitrogen (atomic number 7)?"
        answer: "3"
        check: "8 - 5"
        difficulty: 2
        hints: ["Configuration 2, 5."]
        solution: "8 − 5 = 3"
        mistakes: {"5": valency_is_needed}
      - prompt: "The stable arrangement of 8 outer electrons is called:"
        options: ["An octet", "A duplet", "A valency", "An isotope"]
        answer: "An octet"
        difficulty: 1
        hints: ["Octa means eight."]
        solution: "Eight outer electrons is an octet; two (for helium) is a duplet."
        mistakes: {"A duplet": "octet_duplet", "A valency": "valency_is_needed"}
      - prompt: "Which noble gas does a sodium ion Na⁺ resemble in electron arrangement?"
        options: ["Neon", "Argon", "Helium", "Krypton"]
        answer: "Neon"
        difficulty: 2
        hints: ["Na⁺ has 10 electrons: 2, 8."]
        solution: "Na⁺ is 2, 8, the same as neon."
        mistakes: {"Argon": ion_electrons}
      - prompt: "What is the valency of carbon (atomic number 6)?"
        answer: "4"
        check: "8 - 4"
        difficulty: 2
        hints: ["Configuration 2, 4."]
        solution: "Carbon shares 4 electrons to complete its octet: valency 4."

        mistakes: {"6": "valency_is_needed", "2": "valency_is_needed"}
      - prompt: "Element X has the configuration 2, 8, 6. What is its valency, and which ion does it form?"
        options: ["Valency 2; X²⁻", "Valency 6; X⁶⁺", "Valency 2; X²⁺", "Valency 6; X⁶⁻"]
        answer: "Valency 2; X²⁻"
        difficulty: 3
        hints: ["How many electrons short of 8 is the outer shell?", "Gaining electrons gives a negative ion."]
        solution: "Step 1: X needs 2 more electrons for an octet, so its valency is 2. Step 2: It gains 2 electrons to form X²⁻."
        mistakes: {"Valency 6; X⁶⁺": valency_is_needed, "Valency 2; X²⁺": metals_lose, "Valency 6; X⁶⁻": valency_is_needed}
      - prompt: "A metal X has valency 3 and a non-metal Y has valency 2. What is the formula of their compound?"
        options: ["X₂Y₃", "X₃Y₂", "XY", "XY₃"]
        answer: "X₂Y₃"
        difficulty: 2
        hints: ["X forms X³⁺ and Y forms Y²⁻.", "Make the total charge zero: what is the smallest number both 3 and 2 go into?"]
        solution: "Step 1: Charges +3 and −2. Step 2: 2 × (+3) + 3 × (−2) = 0, so X₂Y₃ (like Al₂O₃)."
        mistakes: {"X₃Y₂": charges_balance, "XY": charges_balance, "XY₃": charges_balance}
      - prompt: "How many electrons must a phosphorus atom (atomic number 15) gain to complete its octet?"
        answer: "3"
        check: "8 - (15-2-8)"
        difficulty: 2
        hints: ["Phosphorus is 2, 8, 5.", "How far is 5 from 8?"]
        solution: "Step 1: Phosphorus has 5 outer electrons. Step 2: It needs 8 − 5 = 3 more."
        mistakes: {"5": valency_is_needed, "13": valency_is_needed}
      - prompt: "Element Y has the configuration 2, 8, 3. Which compound does it form with chlorine (valency 1)?"
        options:
        - "YCl₃"
        - "YCl"
        - "Y₃Cl"
        - "YCl₅"
        answer: "YCl₃"
        difficulty: 3
        hints: ["Work out Y's valency from its outer shell first.", "Each chlorine shares or takes one electron. How many chlorines does Y need?"]
        solution: "Step 1: Y has 3 outer electrons, so its valency is 3 (it is aluminium). Step 2: Chlorine's valency is 1. Step 3: One Y joins three Cl, so the formula is YCl₃."
        mistakes: {"YCl": valency_is_needed, "Y₃Cl": charges_balance, "YCl₅": valency_is_needed}
      - prompt: What is the valency of chlorine (atomic number 17)?
        answer: '1'
        check: 8-7
        difficulty: 1
        hints:
        - 'Write its configuration: how many outer electrons?'
        - How many more are needed to reach 8?
        solution: 'Step 1: Cl = 2, 8, 7. Step 2: It needs 1 more for an octet. Step 3: Valency = 1.'
        mistakes:
          '7': valency_is_needed
      - prompt: What is the valency of aluminium (atomic number 13)?
        answer: '3'
        check: 13-10
        difficulty: 1
        hints:
        - Write the configuration.
        - 'Count its outer electrons: will it lose or gain?'
        solution: 'Step 1: Al = 2, 8, 3. Step 2: It loses 3 outer electrons. Step 3: Valency = 3.'
        mistakes:
          '5': valency_is_needed
          '13': al_three
      - prompt: 'A helium atom has 2 electrons in its only shell. This stable arrangement is called:'
        options:
        - A duplet
        - An octet
        - A triplet
        - A valency
        answer: A duplet
        difficulty: 1
        hints:
        - The first shell can hold only 2.
        - Its name is like 'octet' but for two.
        solution: 'Step 1: The K shell holds at most 2. Step 2: Helium''s K shell is full. Step 3: A full first shell of 2 is a duplet.'
        mistakes:
          An octet: octet_duplet
      - prompt: Which noble gas does the chloride ion Cl⁻ resemble in electron arrangement?
        options:
        - Argon
        - Neon
        - Helium
        - Krypton
        answer: Argon
        difficulty: 2
        hints:
        - Cl has 17 electrons. How many does Cl⁻ have?
        - Which noble gas has that many?
        solution: 'Step 1: Cl⁻ has 18 electrons: 2, 8, 8. Step 2: Argon (18) is 2, 8, 8. Step 3: Cl⁻ is like argon.'
        mistakes:
          Neon: metals_lose
      - prompt: Calcium has valency 2 and nitrogen valency 3. What is the formula of calcium nitride?
        options:
        - Ca₃N₂
        - Ca₂N₃
        - CaN
        - CaN₂
        answer: Ca₃N₂
        difficulty: 2
        hints:
        - Cross over the valencies.
        - Ca takes N's valency, N takes Ca's.
        solution: 'Step 1: Ca valency 2, N valency 3. Step 2: Cross over: Ca₃N₂. Step 3: Check: 3 × 2 = 6 = 2 × 3.'
        mistakes:
          Ca₂N₃: charges_balance
      - prompt: Element Z has the configuration 2, 5. How many electrons must it share or gain to complete its octet?
        answer: '3'
        check: 8-5
        difficulty: 3
        hints:
        - Count its outer electrons.
        - How many more make 8?
        solution: 'Step 1: Outer shell has 5. Step 2: 8 − 5 = 3. Step 3: It needs 3, so its valency is 3 (it is nitrogen).'
        mistakes:
          '5': valency_is_needed
  - code: chem9.bonding.ionic
    title: Ionic bonds
    after: [chem9.bonding.octet]
    notes: |
      An ionic (electrovalent) bond forms when a metal transfers electrons to a non-metal; the
      oppositely charged ions attract. NaCl: Na → Na⁺ + e⁻, Cl + e⁻ → Cl⁻. MgO: Mg gives 2 electrons
      to O. Ionic compounds are usually solids with high melting points, dissolve in water, and
      conduct electricity when molten or dissolved. Formula: charges must balance (Mg²⁺ + 2Cl⁻ =
      MgCl₂; Al³⁺ and O²⁻ give Al₂O₃).
    explanations:
      text: "Sodium hands its single outer electron to chlorine. Now sodium is Na⁺ and chlorine is Cl⁻, and the opposite charges stick together strongly: common salt. Magnesium has 2 electrons to give, so it needs 2 chlorine atoms: MgCl₂."
      visual: "Draw Na with one outer dot and Cl with seven. Draw a curved arrow carrying the dot from Na to Cl. Then draw [Na]⁺ and [Cl]⁻ with 8 dots each in square brackets."
      step_by_step: "Formula of aluminium oxide: Step 1: Al³⁺ and O²⁻. Step 2: Cross the numbers: Al₂O₃. Step 3: Check: 2 × 3 = 6 positive, 3 × 2 = 6 negative."
      real_world: "Salt water conducts electricity, which is why you should never touch electrical switches with wet hands: the dissolved ions carry current."
    activity:
      type: sort
      prompt: Ionic (electrons given) or covalent (electrons shared)?
      bins:
      - Ionic
      - Covalent
      items:
      - label: Sodium chloride (NaCl)
        bin: Ionic
        clue: Is it a metal with a non-metal, or only non-metals?
        why: 'Sodium (metal) gives an electron to chlorine (non-metal): ionic.'
      - label: Magnesium oxide (MgO)
        bin: Ionic
        clue: Metal with non-metal, or only non-metals?
        why: 'Magnesium (metal) gives 2 electrons to oxygen: ionic.'
      - label: Water (H₂O)
        bin: Covalent
        clue: Are there any metals in it?
        why: 'Hydrogen and oxygen are both non-metals, so they share: covalent.'
      - label: Methane (CH₄)
        bin: Covalent
        clue: Are there any metals in it?
        why: 'Carbon and hydrogen are non-metals: they share electrons, covalent.'
      - label: Chlorine gas (Cl₂)
        bin: Covalent
        clue: 'Two atoms of the same element: can one give electrons to the other?'
        why: 'Two identical atoms share: covalent.'
      - label: Calcium fluoride (CaF₂)
        bin: Ionic
        clue: Metal with non-metal, or only non-metals?
        why: 'Calcium (metal) gives electrons to fluorine: ionic.'
    lesson:
      - teach: 'When sodium meets chlorine, sodium gives its one outer electron to chlorine. Sodium becomes Na⁺ (2, 8) and chlorine becomes Cl⁻ (2, 8, 8). Both now have full shells. The opposite charges attract strongly: this is an ionic bond.'
        picture:
          kind: flow
          steps:
          - Na (2, 8, 1) gives 1 electron
          - Cl (2, 8, 7) takes it
          - Na⁺ and Cl⁻ formed
          - 'Opposite charges attract: ionic bond'
          alt: Sodium gives an electron to chlorine; the two ions attract to form sodium chloride.
        check:
          prompt: In NaCl, which atom gains an electron?
          options:
          - Chlorine
          - Sodium
          - Neither
          answer: Chlorine
          why: Chlorine is a non-metal and gains 1 electron to become Cl⁻.
      - teach: 'Ionic bonds form between a metal, which loses electrons, and a non-metal, which gains them. In MgO, magnesium gives 2 electrons to oxygen: Mg²⁺ and O²⁻. In the formula the charges must balance: Mg²⁺ with two Cl⁻ gives MgCl₂.'
        check:
          prompt: Potassium forms K⁺ and oxygen forms O²⁻. What is the formula of potassium oxide?
          options:
          - K₂O
          - KO₂
          - KO
          answer: K₂O
          why: Two K⁺ (total +2) balance one O²⁻.
      - teach: Ionic compounds are hard solids with high melting points, because a huge lattice of ions holds tightly together. They often dissolve in water. They conduct electricity only when melted or dissolved, because then the ions can move.
        check:
          prompt: Why doesn't solid salt conduct electricity?
          options:
          - Its ions are locked in place
          - It has no ions
          - It has free electrons
          answer: Its ions are locked in place
          why: Current needs moving charges; in the solid the ions cannot move.
    items:
      - prompt: "In forming sodium chloride, what happens to the sodium atom?"
        options: ["It loses one electron", "It gains one electron", "It shares one electron", "It loses one proton"]
        answer: "It loses one electron"
        difficulty: 1
        hints: ["Sodium is a metal."]
        solution: "Sodium gives its outer electron to chlorine and becomes Na⁺."
        mistakes: {"It gains one electron": metals_lose, "It loses one proton": ion_electrons}
      - prompt: "Which compound has ionic bonding?"
        options: ["Magnesium oxide", "Water", "Methane", "Oxygen gas"]
        answer: "Magnesium oxide"
        difficulty: 1
        hints: ["Look for a metal joined to a non-metal."]
        solution: "Magnesium (metal) gives electrons to oxygen (non-metal): ionic."
        mistakes: {"Water": ionic_vs_covalent, "Methane": ionic_vs_covalent}
      - prompt: "Magnesium forms Mg²⁺ and chlorine forms Cl⁻. What is the formula of magnesium chloride?"
        options: ["MgCl₂", "MgCl", "Mg₂Cl", "Mg₂Cl₃"]
        answer: "MgCl₂"
        difficulty: 2
        hints: ["Two Cl⁻ balance one Mg²⁺."]
        solution: "+2 needs two −1 charges: MgCl₂."
        mistakes: {"MgCl": charges_balance, "Mg₂Cl": charges_balance}
      - prompt: "How many electrons does each aluminium atom lose in forming Al₂O₃?"
        answer: "3"
        check: "3"
        difficulty: 2
        hints: ["Aluminium is 2, 8, 3."]
        solution: "Aluminium loses its 3 outer electrons to become Al³⁺."
        mistakes: {"2": "al_three", "6": "al_three"}
      - prompt: "When does solid sodium chloride conduct electricity?"
        options: ["When it is melted or dissolved in water", "Always, as a solid", "Never", "Only when cooled"]
        answer: "When it is melted or dissolved in water"
        difficulty: 2
        hints: ["The ions must be free to move."]
        solution: "In the solid the ions are fixed in place. Melted or dissolved, they can move and carry current."
        mistakes: {"Always, as a solid": "ions_must_move", "Never": "ions_must_move"}
      - prompt: "Calcium forms Ca²⁺ and nitrogen forms N³⁻. How many calcium ions are in one unit of calcium nitride?"
        answer: "3"
        check: "solve(Eq(2*x, 3*2), x)[0]"
        difficulty: 3
        hints: ["Cross over the charges: Ca₃N₂.", "3 × (+2) = +6 and 2 × (−3) = −6."]
        solution: "Ca₃N₂: three Ca²⁺ (+6) balance two N³⁻ (−6)."
        mistakes: {"2": charges_balance}
      - prompt: "Aluminium forms Al³⁺ and sulphur forms S²⁻. What is the formula of aluminium sulphide?"
        options: ["Al₂S₃", "Al₃S₂", "AlS", "AlS₃"]
        answer: "Al₂S₃"
        difficulty: 2
        hints: ["The charges must add to zero.", "Cross over the charge numbers."]
        solution: "Step 1: Two Al³⁺ give +6; three S²⁻ give −6. Step 2: Formula Al₂S₃."
        mistakes: {"Al₃S₂": charges_balance, "AlS": charges_balance, "AlS₃": charges_balance}
      - prompt: "Magnesium oxide melts at about 2850 °C, but sodium chloride melts at about 800 °C. What best explains this?"
        options: ["Mg²⁺ and O²⁻ carry bigger charges, so they attract more strongly", "Magnesium oxide is covalent", "Magnesium atoms are heavier than sodium atoms", "Oxygen is a gas, so it holds on harder"]
        answer: "Mg²⁺ and O²⁻ carry bigger charges, so they attract more strongly"
        difficulty: 3
        hints: ["Both are ionic. What holds ions together?", "Compare 2+ and 2− with 1+ and 1−."]
        solution: "Step 1: Both are held by attraction between ions. Step 2: Doubly charged ions attract much more strongly, so more energy is needed to melt MgO."
        mistakes: {"Magnesium oxide is covalent": ionic_vs_covalent, "Magnesium atoms are heavier than sodium atoms": ion_charge_strength, "Oxygen is a gas, so it holds on harder": ion_charge_strength}
      - prompt: "When one unit of calcium chloride, CaCl₂, forms from its atoms, how many electrons are transferred in all?"
        answer: "2"
        check: "1*2"
        difficulty: 2
        hints: ["How many electrons does Ca lose to become Ca²⁺?", "Each Cl takes one."]
        solution: "Step 1: Ca loses 2 electrons. Step 2: Each of the two Cl atoms gains 1. Step 3: 2 electrons are transferred."
        mistakes: {"1": electrons_moved, "4": electrons_moved, "3": electrons_moved}
      - prompt: In magnesium oxide, how many electrons does each magnesium atom give to oxygen?
        answer: '2'
        check: '2'
        difficulty: 1
        hints:
        - Magnesium is 2, 8, 2.
        - It loses all its outer electrons.
        solution: 'Step 1: Mg has 2 outer electrons. Step 2: Oxygen needs 2 more. Step 3: Mg gives 2, forming Mg²⁺ and O²⁻.'
        mistakes:
          '1': metals_lose
          '6': valency_is_needed
      - prompt: Which pair of elements is most likely to form an ionic bond?
        options:
        - Potassium and fluorine
        - Carbon and hydrogen
        - Oxygen and oxygen
        - Nitrogen and hydrogen
        answer: Potassium and fluorine
        difficulty: 1
        hints:
        - Ionic bonds form between a metal and a non-metal.
        - Which pair has one metal?
        solution: 'Step 1: Ionic bonds need a metal and a non-metal. Step 2: Only potassium is a metal here. Step 3: K and F form ionic KF.'
        mistakes:
          Carbon and hydrogen: ionic_vs_covalent
      - prompt: Sodium forms Na⁺ and sulphur forms S²⁻. What is the formula of sodium sulphide?
        options:
        - Na₂S
        - NaS₂
        - NaS
        - Na₂S₂
        answer: Na₂S
        difficulty: 2
        hints:
        - The charges must add up to zero.
        - How many Na⁺ balance one S²⁻?
        solution: 'Step 1: S²⁻ has charge −2. Step 2: Two Na⁺ give +2. Step 3: Formula Na₂S.'
        mistakes:
          NaS₂: charges_balance
      - prompt: Calcium chloride is dissolved in water. Does the solution conduct electricity?
        options:
        - Yes, because the ions are free to move
        - No, because ionic compounds never conduct
        - No, because water blocks current
        - Yes, because calcium is a metal with free electrons
        answer: Yes, because the ions are free to move
        difficulty: 2
        hints:
        - What does an ionic compound split into in water?
        - Can those particles carry charge?
        solution: 'Step 1: CaCl₂ splits into Ca²⁺ and Cl⁻ ions in water. Step 2: The ions can move. Step 3: Moving ions carry current, so it conducts.'
        mistakes:
          No, because ionic compounds never conduct: ions_must_move
      - prompt: In forming one unit of aluminium oxide, Al₂O₃, how many electrons are transferred in all?
        answer: '6'
        check: 2*3
        difficulty: 3
        hints:
        - Each Al atom loses 3 electrons.
        - How many Al atoms are in one unit?
        solution: 'Step 1: Each Al gives 3 electrons. Step 2: There are 2 Al atoms. Step 3: 2 × 3 = 6 electrons (each O takes 2: 3 × 2 = 6).'
        mistakes:
          '3': electrons_moved
          '2': electrons_moved
      - prompt: Calcium oxide (Ca²⁺, O²⁻) melts at about 2600 °C, but potassium chloride (K⁺, Cl⁻) melts at about 770 °C. What best explains this?
        options:
        - The ions in CaO carry bigger charges, so they attract more strongly
        - CaO is covalent
        - KCl has more ions
        - Potassium is heavier than calcium
        answer: The ions in CaO carry bigger charges, so they attract more strongly
        difficulty: 3
        hints:
        - Melting means pulling the ions apart.
        - Compare the charges on the ions.
        solution: 'Step 1: CaO has 2+ and 2− ions. Step 2: KCl has 1+ and 1− ions. Step 3: Bigger charges attract more strongly, so CaO needs much more heat to melt.'
        mistakes:
          KCl has more ions: ion_charge_strength

  - code: chem9.bonding.covalent
    title: Covalent bonds
    after: [chem9.bonding.octet]
    notes: |
      A covalent bond is a shared pair of electrons between two non-metal atoms. Single bond: one pair
      (H–H, Cl–Cl, H₂O, CH₄). Double bond: two pairs (O=O, CO₂). Triple bond: three pairs (N≡N).
      Covalent compounds usually have low melting points and do not conduct electricity. In a bond
      between atoms of different electronegativity the electrons are shared unequally: a polar
      covalent bond (H–Cl, O–H in water).
    explanations:
      text: "Two chlorine atoms each have 7 outer electrons. Neither can take one from the other, so each puts 1 electron into a shared pair. Now each 'counts' 8: a single covalent bond, Cl–Cl. Oxygen atoms need 2 each, so they share two pairs: a double bond, O=O. Nitrogen shares three pairs: N≡N."
      visual: "Draw two overlapping circles (outer shells). Put the shared electrons in the overlap: 2 dots for a single bond, 4 for a double, 6 for a triple. Count each circle: 8 dots in each."
      step_by_step: "Bonds in methane, CH₄: Step 1: Carbon has 4 outer electrons and needs 4 more. Step 2: Each hydrogen has 1 and needs 1. Step 3: Carbon shares one pair with each of 4 hydrogens: 4 single bonds."
      real_world: "Water's O–H bonds are polar: oxygen pulls the shared electrons harder. That makes water good at dissolving salt and sugar, which is why it is called the universal solvent."
    activity:
      type: sort
      prompt: How many pairs of electrons are shared?
      bins:
      - Single bond
      - Double bond
      - Triple bond
      items:
      - label: Hydrogen (H₂)
        bin: Single bond
        clue: How many electrons does each hydrogen need to fill its shell?
        why: 'Each needs 1: one shared pair, a single bond.'
      - label: Oxygen (O₂)
        bin: Double bond
        clue: How many electrons does each oxygen need for an octet?
        why: 'Each needs 2: two shared pairs, a double bond.'
      - label: Nitrogen (N₂)
        bin: Triple bond
        clue: How many electrons does each nitrogen need for an octet?
        why: 'Each needs 3: three shared pairs, a triple bond.'
      - label: Chlorine (Cl₂)
        bin: Single bond
        clue: How many electrons does each chlorine need?
        why: 'Each needs 1: a single bond.'
      - label: Each C=O in carbon dioxide
        bin: Double bond
        clue: Look at the sign between C and O.
        why: '= means two shared pairs: a double bond.'
      - label: Hydrogen chloride (HCl)
        bin: Single bond
        clue: How many does hydrogen need? And chlorine?
        why: 'Each needs 1: a single bond.'
    lesson:
      - teach: 'Two non-metal atoms can''t both take electrons, so they share. Each hydrogen atom has 1 electron; two hydrogens share their electrons as a pair, and each now has a duplet. A shared pair of electrons is a covalent bond, written as a line: H–H.'
        check:
          prompt: 'A covalent bond is:'
          options:
          - A shared pair of electrons
          - An electron given from one atom to another
          - An attraction between ions
          answer: A shared pair of electrons
          why: In a covalent bond, two atoms share electrons rather than transfer them.
      - teach: Atoms may share more than one pair. A single bond is one pair (Cl–Cl), a double bond two pairs (O=O), a triple bond three pairs (N≡N). Each pair is 2 electrons, so a triple bond shares 6 electrons.
        picture:
          kind: compare
          columns:
          - title: Single
            points:
            - 1 shared pair
            - 2 electrons
            - e.g. H–H, Cl–Cl
          - title: Double
            points:
            - 2 shared pairs
            - 4 electrons
            - e.g. O=O
          - title: Triple
            points:
            - 3 shared pairs
            - 6 electrons
            - e.g. N≡N
          alt: Single, double and triple bonds share one, two and three pairs of electrons.
        check:
          prompt: How many electrons are shared in N≡N?
          options:
          - '6'
          - '3'
          - '2'
          answer: '6'
          why: Three pairs × 2 electrons = 6.
      - teach: 'Covalent substances are made of separate molecules, so they usually have low melting points and do not conduct electricity. When two different atoms share, the more electronegative one pulls the pair closer and gets a slight negative charge: a polar bond, like O–H in water.'
        check:
          prompt: In an O–H bond, which atom has the slight negative charge?
          options:
          - Oxygen
          - Hydrogen
          - Neither
          answer: Oxygen
          why: Oxygen is more electronegative, so it pulls the shared pair closer.
    items:
      - prompt: "How many electrons are shared in a double bond?"
        answer: "4"
        check: "2*2"
        difficulty: 1
        hints: ["Each shared pair has 2 electrons."]
        solution: "Two pairs = 4 electrons."
        mistakes: {"2": bond_pairs}
      - prompt: "Which molecule has a triple bond?"
        options: ["Nitrogen, N₂", "Oxygen, O₂", "Chlorine, Cl₂", "Hydrogen, H₂"]
        answer: "Nitrogen, N₂"
        difficulty: 1
        hints: ["Which atom needs 3 more electrons?"]
        solution: "Nitrogen (2, 5) needs 3: it shares three pairs, N≡N."
        mistakes: {"Oxygen, O₂": bond_pairs}
      - prompt: "Which type of bond is in a chlorine molecule, Cl₂?"
        options: ["Single covalent bond", "Ionic bond", "Double covalent bond", "Triple covalent bond"]
        answer: "Single covalent bond"
        difficulty: 1
        hints: ["Each Cl needs just 1 electron."]
        solution: "Two non-metal atoms share one pair: a single covalent bond."
        mistakes: {"Ionic bond": ionic_vs_covalent}
      - prompt: "How many covalent bonds does carbon form in methane, CH₄?"
        answer: "4"
        check: "8 - 4"
        difficulty: 2
        hints: ["Carbon needs 4 more electrons."]
        solution: "Four single C–H bonds."
        mistakes: {"1": "bond_pairs", "8": "bond_pairs"}
      - prompt: "How many shared pairs of electrons are in a molecule of carbon dioxide, O=C=O?"
        answer: "4"
        check: "2 + 2"
        difficulty: 2
        hints: ["Two double bonds."]
        solution: "Each C=O is 2 pairs; 2 + 2 = 4 pairs."
        mistakes: {"2": bond_pairs}
      - prompt: "In a molecule of hydrogen chloride, H–Cl, which atom carries a slight negative charge?"
        options: ["Chlorine", "Hydrogen", "Neither", "Both equally"]
        answer: "Chlorine"
        difficulty: 3
        hints: ["Which atom is more electronegative?"]
        solution: "Chlorine pulls the shared pair closer, so it is slightly negative (δ−) and hydrogen slightly positive (δ+)."
        mistakes: {"Neither": polar_electronegativity, "Both equally": polar_electronegativity}
      - prompt: "In a water molecule, H₂O, how many lone pairs (pairs of electrons not used in bonding) are on the oxygen atom?"
        answer: "2"
        check: "(6-2)/2"
        difficulty: 3
        hints: ["Oxygen has 6 outer electrons.", "It uses one of its own electrons in each of its two bonds."]
        solution: "Step 1: Oxygen uses 2 of its 6 electrons in the two O–H bonds. Step 2: The other 4 make 2 lone pairs."
        mistakes: {"4": lone_pairs, "6": lone_pairs, "1": lone_pairs}
      - prompt: "How many electrons in all are shared in a molecule of ammonia, NH₃?"
        answer: "6"
        check: "3*2"
        difficulty: 2
        hints: ["How many N–H bonds are there?", "Each single bond is a shared pair."]
        solution: "Step 1: Three N–H single bonds. Step 2: 3 pairs = 6 shared electrons."
        mistakes: {"3": bond_pairs, "8": bond_pairs, "5": bond_pairs}
      - prompt: "A sugar solution does not conduct electricity, but a salt solution does. Why?"
        options: ["Sugar is covalent and does not form ions in water", "Sugar does not really dissolve", "Sugar is an ionic compound", "Salt has more electrons than sugar"]
        answer: "Sugar is covalent and does not form ions in water"
        difficulty: 2
        hints: ["What carries current in a solution?", "Does sugar break into charged particles?"]
        solution: "Step 1: Current in a solution needs moving ions. Step 2: Salt splits into Na⁺ and Cl⁻; covalent sugar molecules stay whole and uncharged."
        mistakes: {"Sugar does not really dissolve": ions_in_water, "Sugar is an ionic compound": ionic_vs_covalent, "Salt has more electrons than sugar": ions_in_water}
      - prompt: How many electrons are shared in a single covalent bond?
        answer: '2'
        check: '2'
        difficulty: 1
        hints:
        - A single bond is one shared pair.
        - How many electrons are in a pair?
        solution: 'Step 1: Single bond = 1 pair. Step 2: A pair = 2 electrons. Step 3: 2 electrons are shared.'
        mistakes:
          '1': bond_pairs
      - prompt: Which molecule has a double bond?
        options:
        - Oxygen, O₂
        - Hydrogen, H₂
        - Chlorine, Cl₂
        - Nitrogen, N₂
        answer: Oxygen, O₂
        difficulty: 1
        hints:
        - Each atom shares enough electrons to complete its octet.
        - 'Oxygen has 6 outer electrons: how many does it need?'
        solution: 'Step 1: H and Cl need 1 each: single bond. Step 2: N needs 3: triple bond. Step 3: O needs 2, so O₂ has a double bond.'
        mistakes:
          Nitrogen, N₂: bond_pairs
      - prompt: Which substance has covalent bonds?
        options:
        - Water, H₂O
        - Sodium chloride, NaCl
        - Magnesium oxide, MgO
        - Calcium chloride, CaCl₂
        answer: Water, H₂O
        difficulty: 1
        hints:
        - Covalent bonds form between non-metals.
        - Which compound has no metal in it?
        solution: 'Step 1: NaCl, MgO and CaCl₂ each contain a metal: ionic. Step 2: Water is made of hydrogen and oxygen, both non-metals. Step 3: Water has covalent bonds.'
        mistakes:
          Sodium chloride, NaCl: ionic_vs_covalent
      - prompt: How many electrons in all are shared in a molecule of nitrogen, N≡N?
        answer: '6'
        check: 3*2
        difficulty: 2
        hints:
        - Count the shared pairs.
        - Each pair is 2 electrons.
        solution: 'Step 1: A triple bond is 3 pairs. Step 2: 3 × 2 = 6. Step 3: 6 electrons are shared.'
        mistakes:
          '3': bond_pairs
      - prompt: How many lone pairs are on the nitrogen atom in ammonia, NH₃?
        answer: '1'
        check: (5-3)/2
        difficulty: 3
        hints:
        - Nitrogen has 5 outer electrons.
        - Take away those used in the three N–H bonds, then pair up the rest.
        solution: 'Step 1: N has 5 outer electrons. Step 2: 3 are used in N–H bonds. Step 3: 2 remain: 1 lone pair.'
        mistakes:
          '2': lone_pairs
          '3': lone_pairs
      - prompt: Kerosene does not conduct electricity, even as a liquid. What does this suggest?
        options:
        - It is a covalent substance with no ions
        - It is an ionic compound
        - It has free electrons
        - It is a metal
        answer: It is a covalent substance with no ions
        difficulty: 2
        hints:
        - Current needs moving charged particles.
        - Which kind of substance has none?
        solution: 'Step 1: Liquid ionic compounds conduct because ions move. Step 2: Kerosene doesn''t conduct. Step 3: So it has no ions: it is covalent.'
        mistakes:
          It is an ionic compound: ions_in_water
