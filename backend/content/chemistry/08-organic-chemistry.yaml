# Class 9 Chemistry, chapter 8. Format: content/README.md.
# Also uses tips from earlier chapters: bond_pairs.
subject: chem
chapter: 8
title: Organic Chemistry

tips:
  count_cc_too: "Count every bond: the C–H bonds and the bond between the carbons."
  carbon_exceptions: "Organic chemistry covers carbon compounds, with a few simple exceptions. Recall which small carbon compounds are left out."
  alkane_mass: "Write the formula first from CₙH₂ₙ₊₂, then add 12 for each carbon and 1 for each hydrogen."
  alkane_formula: "Alkanes are CₙH₂ₙ₊₂: double the carbons and add 2 for the hydrogens."
  alkene_formula: "Alkenes are CₙH₂ₙ (one double bond); alkynes are CₙH₂ₙ₋₂ (one triple bond)."
  prefix_count: "Prefixes count carbons: meth 1, eth 2, prop 3, but 4; after that they use Greek number words, like pent- in pentagon and hex- in hexagon. Then check the ending: -ane all single bonds, -ene one double bond."
  suffix_bond: "Suffix -ane means only single bonds, -ene a double bond, -yne a triple bond."
  homologous_ch2: "Write two neighbouring members, like CH₄ and C₂H₆, and subtract their formulas. Then add up the mass of the difference (C = 12, H = 1)."
  functional_group: "Find the group that makes the family: –OH, –COOH, or a C=O. If it is a C=O, check where it sits: at the end of the chain with an H on the same carbon, or in the middle between two carbons. Count every H, including any in –OH."
  catenation_carbon: "Carbon atoms can bond to other carbon atoms again and again, forming chains: the word for this comes from the Latin for chain. In a chain of n carbons, count the links between neighbours."
  carbon_variety: "Carbon makes millions of compounds because it bonds to itself in chains, branches and rings, with single, double and triple bonds."
  hydrocarbon_only_ch: "'Hydro-carbon': only hydrogen and carbon. With oxygen too, it's a different family."

concepts:
  - code: chem9.organic.carbon
    title: The special nature of carbon
    notes: |
      Carbon has 4 valence electrons and forms 4 covalent bonds (tetravalency). It can bond to other
      carbon atoms to form long chains, branches and rings (catenation), and can form single, double
      and triple bonds. That is why there are millions of carbon compounds. Organic chemistry is the
      chemistry of carbon compounds (except CO, CO₂ and carbonates). Hydrocarbons contain only C and H.
    explanations:
      text: "Carbon is like a Lego brick with 4 connectors. It can click onto other carbon bricks in long chains, branches and rings, and onto hydrogen, oxygen or nitrogen. Because it can build so many shapes, there are more carbon compounds than compounds of all other elements together."
      visual: "Draw a C with four lines sticking out. Join several C's in a row, add an H on each spare line: you have drawn a hydrocarbon chain."
      step_by_step: "Why does carbon form 4 bonds? Step 1: Carbon is 2, 4. Step 2: Gaining or losing 4 electrons is too hard. Step 3: So it shares 4 electrons: 4 covalent bonds."
      real_world: "Petrol, kerosene, LPG, coconut oil, sugar, rubber and plastics are all carbon compounds."
    activity:
      type: sort
      prompt: True or false? (Carbon)
      bins:
      - 'True'
      - 'False'
      items:
      - label: Carbon atoms can join into long chains
        bin: 'True'
        clue: Think of petrol and plastics. How are their carbons joined?
        why: 'Carbon atoms link to each other in long chains: true.'
      - label: Carbon has a valency of 4
        bin: 'True'
        clue: How many outer electrons does carbon have? (2, 4)
        why: '4 outer electrons, so it makes 4 bonds: true.'
      - label: Carbon usually forms ionic bonds
        bin: 'False'
        why: 'It shares electrons instead: covalent bonds.'
        clue: Can carbon easily lose or gain 4 electrons?
      - label: Carbon can form double and triple bonds
        bin: 'True'
        clue: Think of ethene (C=C) and ethyne.
        why: 'Ethene has C=C and ethyne a triple bond: true.'
      - label: There are only a few carbon compounds
        bin: 'False'
        why: There are millions of carbon compounds.
        clue: Think of all the foods, fuels and plastics.
    lesson:
      - teach: 'Carbon (2, 4) has 4 valence electrons. Gaining or losing 4 is too hard, so carbon shares: it forms 4 covalent bonds. This is called tetravalency. In methane, CH₄, one carbon shares a pair with each of 4 hydrogens.'
        check:
          prompt: Why does carbon form covalent bonds rather than ions?
          options:
          - Gaining or losing 4 electrons is too hard, so it shares
          - It has no valence electrons
          - It is a metal
          answer: Gaining or losing 4 electrons is too hard, so it shares
          why: With 4 outer electrons, sharing is the easy way to reach an octet.
      - teach: 'Carbon atoms can bond to other carbon atoms again and again: long chains, branched chains and rings. This is catenation. They can also form single, double and triple bonds with each other. That''s why there are millions of carbon compounds.'
        picture:
          kind: flow
          steps:
          - 4 bonds per carbon
          - Carbon joins carbon (catenation)
          - Chains, branches, rings
          - Single, double, triple bonds
          - Millions of compounds
          alt: Tetravalency and catenation together give carbon its huge variety of compounds.
        check:
          prompt: What is catenation?
          options:
          - Carbon atoms bonding to each other to form chains
          - Carbon reacting with oxygen
          - Carbon forming ions
          answer: Carbon atoms bonding to each other to form chains
          why: Catenation comes from the Latin for chain.
      - teach: 'Organic chemistry is the chemistry of carbon compounds, except a few simple ones: CO, CO₂ and carbonates are counted as inorganic. Compounds of only carbon and hydrogen are hydrocarbons, like methane in biogas and LPG''s butane.'
        check:
          prompt: Which is a hydrocarbon?
          options:
          - C₃H₈
          - C₂H₅OH
          - CO₂
          answer: C₃H₈
          why: It has only carbon and hydrogen.
    items:
      - prompt: "How many covalent bonds does a carbon atom usually form?"
        answer: "4"
        check: "8 - 4"
        difficulty: 1
        hints: ["Carbon has 4 valence electrons."]
        solution: "Carbon is tetravalent: it forms 4 bonds."
        mistakes: {"2": "valency_is_needed", "6": "valency_is_needed"}
      - prompt: "The ability of carbon atoms to join to each other in long chains is called:"
        options: ["Catenation", "Hydrogenation", "Oxidation", "Isomerism"]
        answer: "Catenation"
        difficulty: 1
        hints: ["Catena means chain."]
        solution: "Catenation is self-linking into chains and rings."
        mistakes: {"Isomerism": catenation_carbon}
      - prompt: "A hydrocarbon contains:"
        options: ["Only carbon and hydrogen", "Carbon, hydrogen and oxygen", "Only carbon", "Carbon and any other element"]
        answer: "Only carbon and hydrogen"
        difficulty: 1
        hints: ["Hydro + carbon."]
        solution: "Hydrocarbons are compounds of carbon and hydrogen only."
        mistakes: {"Carbon, hydrogen and oxygen": "hydrocarbon_only_ch", "Only carbon": "hydrocarbon_only_ch"}
      - prompt: "Why are there so many carbon compounds?"
        options: ["Carbon can form chains, branches and rings and multiple bonds", "Carbon is very common in rocks", "Carbon is a metal", "Carbon has 6 protons"]
        answer: "Carbon can form chains, branches and rings and multiple bonds"
        difficulty: 2
        hints: ["Catenation and tetravalency."]
        solution: "Catenation and 4 bonds per atom allow an almost endless variety of structures."
        mistakes: {"Carbon is very common in rocks": "carbon_variety", "Carbon has 6 protons": "carbon_variety"}
      - prompt: "How many electrons are shared between the two carbon atoms in ethyne, H–C≡C–H?"
        answer: "6"
        check: "3*2"
        difficulty: 2
        hints: ["A triple bond is three shared pairs."]
        solution: "3 pairs = 6 electrons."
        mistakes: {"3": bond_pairs}
      - prompt: "In propane, C₃H₈, how many C–C single bonds are there?"
        answer: "2"
        check: "3 - 1"
        difficulty: 3
        hints: ["Three carbons in a chain: C–C–C."]
        solution: "A chain of 3 carbons has 2 C–C bonds (and 8 C–H bonds)."
        mistakes: {"3": catenation_carbon}
      - prompt: "How many single covalent bonds are there in a molecule of ethane, C₂H₆?"
        answer: "7"
        check: "6+1"
        difficulty: 2
        hints: ["Each hydrogen is joined by one bond.", "Don't forget the bond joining the two carbons."]
        solution: "Step 1: Six C–H bonds. Step 2: One C–C bond. Step 3: Total 7."
        mistakes: {"6": count_cc_too, "8": count_cc_too, "14": bond_pairs}
      - prompt: "Which of these is NOT counted as an organic compound?"
        options: ["CO₂", "CH₄", "C₂H₅OH", "C₂H₄"]
        answer: "CO₂"
        difficulty: 2
        hints: ["All four contain carbon.", "A few simple carbon compounds are studied with inorganic chemistry."]
        solution: "Step 1: Organic chemistry is the chemistry of carbon compounds. Step 2: CO, CO₂ and carbonates are the exceptions, so CO₂ is not organic."
        mistakes: {"CH₄": carbon_exceptions, "C₂H₅OH": carbon_exceptions, "C₂H₄": carbon_exceptions}
      - prompt: "How many electrons in all are shared in a molecule of ethene, CH₂=CH₂?"
        answer: "12"
        check: "4*2 + 2*2"
        difficulty: 3
        hints: ["Four C–H single bonds.", "One C=C double bond is two pairs."]
        solution: "Step 1: 4 C–H bonds share 8 electrons. Step 2: C=C shares 4. Step 3: Total 12."
        mistakes: {"10": bond_pairs, "6": bond_pairs, "8": count_cc_too}
      - prompt: How many valence electrons does a carbon atom have?
        answer: '4'
        check: 6-2
        difficulty: 1
        hints:
        - Carbon's atomic number is 6.
        - Write its configuration.
        solution: 'Step 1: C = 2, 4. Step 2: The outer shell has 4. Step 3: Carbon has 4 valence electrons.'
        mistakes:
          '6': valence_shell
          '2': valence_shell
      - prompt: Which of these is a hydrocarbon?
        options:
        - Butane, C₄H₁₀
        - Ethanol, C₂H₅OH
        - Ethanoic acid, CH₃COOH
        - Carbon dioxide, CO₂
        answer: Butane, C₄H₁₀
        difficulty: 1
        hints:
        - A hydrocarbon has only two elements.
        - Which formula has no oxygen?
        solution: 'Step 1: Ethanol and ethanoic acid contain oxygen. Step 2: CO₂ has no hydrogen. Step 3: Butane has only C and H.'
        mistakes:
          Ethanol, C₂H₅OH: hydrocarbon_only_ch
      - prompt: How many C–C bonds are there in a straight chain of 5 carbon atoms (pentane)?
        answer: '4'
        check: 5-1
        difficulty: 2
        hints:
        - Draw 5 carbons in a row.
        - Count the links between neighbours.
        solution: 'Step 1: C–C–C–C–C. Step 2: Each link joins two neighbours. Step 3: 5 carbons have 4 links.'
        mistakes:
          '5': catenation_carbon
      - prompt: How many single covalent bonds are in a molecule of methane, CH₄?
        answer: '4'
        check: '4'
        difficulty: 1
        hints:
        - Carbon bonds to each hydrogen.
        - How many hydrogens are there?
        solution: 'Step 1: Carbon is joined to 4 hydrogens. Step 2: Each is a single bond. Step 3: 4 single bonds.'
        mistakes:
          '5': count_cc_too
          '8': bond_pairs
      - prompt: How many single covalent bonds are in a molecule of propane, C₃H₈?
        answer: '10'
        check: 8+2
        difficulty: 3
        hints:
        - Count the C–H bonds first.
        - Then add the C–C bonds.
        solution: 'Step 1: 8 hydrogens give 8 C–H bonds. Step 2: 3 carbons in a row give 2 C–C bonds. Step 3: Total = 10.'
        mistakes:
          '8': count_cc_too
      - prompt: Which of these is NOT an organic compound?
        options:
        - Calcium carbonate, CaCO₃
        - Methane, CH₄
        - Ethanol, C₂H₅OH
        - Glucose, C₆H₁₂O₆
        answer: Calcium carbonate, CaCO₃
        difficulty: 2
        hints:
        - All four contain carbon.
        - Which kinds of carbon compounds are left out of organic chemistry?
        solution: 'Step 1: Organic chemistry covers carbon compounds. Step 2: CO, CO₂ and carbonates are exceptions. Step 3: Calcium carbonate is inorganic.'
        mistakes:
          Glucose, C₆H₁₂O₆: carbon_exceptions

  - code: chem9.organic.hydrocarbons
    title: Alkanes, alkenes and alkynes
    after: [chem9.organic.carbon]
    notes: |
      Alkanes (saturated, single bonds only): CₙH₂ₙ₊₂ — methane CH₄, ethane C₂H₆, propane C₃H₈,
      butane C₄H₁₀. Alkenes (one C=C): CₙH₂ₙ — ethene C₂H₄. Alkynes (one C≡C): CₙH₂ₙ₋₂ — ethyne C₂H₂.
      Alkenes and alkynes are unsaturated. A homologous series is a family with the same general
      formula, similar chemistry, and successive members differing by CH₂ (14 u).
    explanations:
      text: "Alkanes are chains with only single bonds: each carbon is 'saturated' with hydrogens. Methane, CH₄, is the main gas in biogas. Put a double bond between two carbons and two hydrogens must go: ethane C₂H₆ becomes ethene C₂H₄. A triple bond removes two more: ethyne C₂H₂."
      visual: "Write the alkanes one under another: CH₄, C₂H₆, C₃H₈, C₄H₁₀. Each line adds one C and two H's: CH₂ each time."
      step_by_step: "Formula of the alkane with 5 carbons: Step 1: CₙH₂ₙ₊₂ with n = 5. Step 2: H = 2 × 5 + 2 = 12. Step 3: C₅H₁₂, pentane."
      real_world: "LPG cylinders contain mainly propane and butane. Ethyne (acetylene) burns very hot and is used in welding torches."
    activity:
      type: formula
      prompt: 'For n carbon atoms: alkane CₙH₂ₙ₊₂, alkene CₙH₂ₙ, alkyne CₙH₂ₙ₋₂.'
      inputs:
      - name: n
        label: Carbon atoms
        min: 1
        max: 8
        step: 1
        start: 1
      outputs:
      - name: a
        label: Hydrogens in the alkane
        expr: 2*n+2
      - name: e
        label: Hydrogens in the alkene
        expr: 2*n
      - name: y
        label: Hydrogens in the alkyne
        expr: 2*n-2
      goals:
      - prompt: Find the alkane with 10 hydrogens (butane).
        want:
          a: 10
        mistakes:
        - when:
            n: 5
          say: Five carbons make 12 hydrogens in the alkane (pentane). Butane is shorter.
      - prompt: Find the alkene with 6 hydrogens.
        want:
          e: 6
        mistakes:
        - when:
            n: 6
          say: Six carbons give an alkene with 12 hydrogens. In an alkene there are exactly twice as many hydrogens as carbons.
    lesson:
      - teach: 'Alkanes have only single bonds between carbons; they are saturated. Their general formula is CₙH₂ₙ₊₂: methane CH₄, ethane C₂H₆, propane C₃H₈, butane C₄H₁₀. For 6 carbons: 2 × 6 + 2 = 14 hydrogens, C₆H₁₄.'
        check:
          prompt: What is the formula of the alkane with 7 carbons?
          options:
          - C₇H₁₆
          - C₇H₁₄
          - C₇H₁₂
          answer: C₇H₁₆
          why: 'CₙH₂ₙ₊₂: 2 × 7 + 2 = 16.'
      - teach: 'Alkenes have one C=C double bond: CₙH₂ₙ (ethene C₂H₄). Alkynes have one C≡C triple bond: CₙH₂ₙ₋₂ (ethyne C₂H₂). Both are unsaturated: they have fewer hydrogens than the alkane with the same carbons.'
        picture:
          kind: compare
          columns:
          - title: Alkane
            points:
            - single bonds only
            - CₙH₂ₙ₊₂
            - e.g. C₂H₆
          - title: Alkene
            points:
            - one C=C
            - CₙH₂ₙ
            - e.g. C₂H₄
          - title: Alkyne
            points:
            - one C≡C
            - CₙH₂ₙ₋₂
            - e.g. C₂H₂
          alt: Alkanes, alkenes and alkynes compared by bonds and general formula.
        check:
          prompt: C₅H₁₀ belongs to which family?
          options:
          - Alkene
          - Alkane
          - Alkyne
          answer: Alkene
          why: 10 = 2 × 5, which fits CₙH₂ₙ.
      - teach: A homologous series is a family with the same general formula and similar chemistry. Each member differs from the next by CH₂, which is 12 + 2 = 14 u. Methane (16 u), ethane (30 u), propane (44 u).
        check:
          prompt: Ethane is 30 u. What is the mass of propane, the next alkane?
          options:
          - 44 u
          - 42 u
          - 31 u
          answer: 44 u
          why: 'Add CH₂ = 14 u: 30 + 14 = 44 u.'
    items:
      - prompt: "How many hydrogen atoms are in the alkane with 5 carbon atoms?"
        answer: "12"
        check: "2*5 + 2"
        difficulty: 1
        hints: ["CₙH₂ₙ₊₂."]
        solution: "2 × 5 + 2 = 12: C₅H₁₂."
        mistakes: {"10": alkene_formula, "8": alkene_formula}
      - prompt: "Which of these is an alkene?"
        options: ["C₂H₄", "C₂H₆", "C₂H₂", "CH₄"]
        answer: "C₂H₄"
        difficulty: 1
        hints: ["Alkenes are CₙH₂ₙ."]
        solution: "C₂H₄ fits CₙH₂ₙ with n = 2: ethene."
        mistakes: {"C₂H₆": alkene_formula, "C₂H₂": alkene_formula}
      - prompt: "How many hydrogen atoms are in the alkene with 4 carbon atoms?"
        answer: "8"
        check: "2*4"
        difficulty: 2
        hints: ["CₙH₂ₙ."]
        solution: "2 × 4 = 8: C₄H₈."
        mistakes: {"10": alkane_formula}
      - prompt: "Neighbouring members of a homologous series differ by:"
        options: ["CH₂", "CH₃", "C₂H₄", "H₂"]
        answer: "CH₂"
        difficulty: 2
        hints: ["Compare CH₄ and C₂H₆."]
        solution: "C₂H₆ − CH₄ = CH₂."
        mistakes: {"CH₃": homologous_ch2}
      - prompt: "By how many atomic mass units do neighbouring members of a homologous series differ? (C = 12 u, H = 1 u)"
        answer: "14"
        check: "12 + 2*1"
        difficulty: 2
        hints: ["Mass of CH₂."]
        solution: "12 + 2 = 14 u"
        mistakes: {"13": homologous_ch2}
      - prompt: "How many hydrogen atoms are in the alkyne with 3 carbon atoms?"
        answer: "4"
        check: "2*3 - 2"
        difficulty: 3
        hints: ["CₙH₂ₙ₋₂."]
        solution: "2 × 3 − 2 = 4: propyne, C₃H₄."
        mistakes: {"6": alkene_formula, "8": alkane_formula}
      - prompt: "An alkane has 22 hydrogen atoms in its molecule. How many carbon atoms does it have?"
        answer: "10"
        check: "(22-2)/2"
        difficulty: 3
        hints: ["Alkanes are CₙH₂ₙ₊₂.", "2n + 2 = 22."]
        solution: "Step 1: 2n + 2 = 22. Step 2: n = 10 (decane)."
        mistakes: {"11": alkane_formula, "20": alkane_formula, "12": alkane_formula}
      - prompt: "Which of these hydrocarbons is saturated?"
        options: ["C₃H₈", "C₃H₆", "C₃H₄", "C₂H₂"]
        answer: "C₃H₈"
        difficulty: 2
        hints: ["Saturated means single bonds only: an alkane.", "Which one fits CₙH₂ₙ₊₂?"]
        solution: "Step 1: For 3 carbons, an alkane has 2 × 3 + 2 = 8 hydrogens. Step 2: C₃H₈ (propane) is saturated; the others have double or triple bonds."
        mistakes: {"C₃H₆": alkene_formula, "C₃H₄": alkene_formula, "C₂H₂": alkene_formula}
      - prompt: "What is the molecular mass, in u, of the alkane with 4 carbon atoms? (C = 12 u, H = 1 u)"
        answer: "58"
        check: "4*12 + (2*4+2)*1"
        difficulty: 3
        hints: ["Its formula is C₄H₁₀.", "4 × 12 + 10 × 1."]
        solution: "Step 1: Butane is C₄H₁₀. Step 2: 48 + 10 = 58 u."
        mistakes: {"56": alkane_mass, "60": alkane_mass, "52": alkane_mass}
      - prompt: How many hydrogen atoms are in the alkane with 6 carbon atoms?
        answer: '14'
        check: 2*6+2
        difficulty: 1
        hints:
        - Use CₙH₂ₙ₊₂.
        - Double the carbons and add 2.
        solution: 'Step 1: n = 6. Step 2: 2 × 6 + 2. Step 3: = 14 (hexane, C₆H₁₄).'
        mistakes:
          '12': alkene_formula
          '10': alkene_formula
      - prompt: Which of these is an alkyne?
        options:
        - C₃H₄
        - C₃H₆
        - C₃H₈
        - C₂H₆
        answer: C₃H₄
        difficulty: 1
        hints:
        - Alkynes have the fewest hydrogens.
        - Use CₙH₂ₙ₋₂.
        solution: 'Step 1: For n = 3, CₙH₂ₙ₋₂ gives C₃H₄. Step 2: C₃H₆ is an alkene; C₃H₈ and C₂H₆ are alkanes. Step 3: C₃H₄ is the alkyne.'
        mistakes:
          C₃H₆: alkene_formula
      - prompt: Which hydrocarbons are called unsaturated?
        options:
        - Those with a double or triple bond
        - Those with only single bonds
        - Those that don't burn
        - Those with no hydrogen
        answer: Those with a double or triple bond
        difficulty: 2
        hints:
        - Saturated means 'full' of hydrogen.
        - Which have fewer hydrogens than possible?
        solution: 'Step 1: Alkanes have single bonds only: saturated. Step 2: Alkenes and alkynes have C=C or C≡C. Step 3: They are unsaturated.'
        mistakes:
          Those with only single bonds: suffix_bond
      - prompt: An alkene has 6 hydrogen atoms. How many carbon atoms does it have?
        answer: '3'
        check: 6/2
        difficulty: 2
        hints:
        - Alkenes are CₙH₂ₙ.
        - Hydrogens are twice the carbons.
        solution: 'Step 1: 2n = 6. Step 2: n = 3. Step 3: It is propene, C₃H₆.'
        mistakes:
          '2': alkane_formula
          '6': alkene_formula
      - prompt: What is the molecular mass, in u, of propane, C₃H₈? (C = 12 u, H = 1 u)
        answer: '44'
        check: 3*12+8
        difficulty: 2
        hints:
        - Add 12 for each carbon and 1 for each hydrogen.
        - 3 carbons and 8 hydrogens.
        solution: 'Step 1: Carbon: 3 × 12 = 36. Step 2: Hydrogen: 8 × 1 = 8. Step 3: Total = 44 u.'
        mistakes:
          '20': alkane_mass
          '11': alkane_mass
      - prompt: The third member of the alkene series is C₄H₈. What is the formula of the next member?
        options:
        - C₅H₁₀
        - C₅H₁₂
        - C₄H₁₀
        - C₅H₈
        answer: C₅H₁₀
        difficulty: 3
        hints:
        - Neighbouring members differ by CH₂.
        - Add one C and two H.
        solution: 'Step 1: Add CH₂ to C₄H₈. Step 2: C₅H₁₀. Step 3: Check: CₙH₂ₙ with n = 5 gives 10 H.'
        mistakes:
          C₅H₁₂: alkene_formula
          C₄H₁₀: homologous_ch2

  - code: chem9.organic.naming
    title: Naming and functional groups
    after: [chem9.organic.hydrocarbons]
    notes: |
      IUPAC names: a prefix for the number of carbons in the main chain (meth 1, eth 2, prop 3, but 4,
      pent 5, hex 6) and a suffix for the family (-ane, -ene, -yne). Functional groups give families
      their properties: alcohols –OH (-ol, ethanol C₂H₅OH), carboxylic acids –COOH (-oic acid,
      ethanoic acid CH₃COOH, in vinegar), aldehydes –CHO (-al), ketones C=O (-one).
    explanations:
      text: "Read a name in two parts: 'prop' + 'ene' means 3 carbons with a double bond. Swap a hydrogen for –OH and you get an alcohol: ethane becomes ethanol. Put –COOH at the end and you get an acid: ethanoic acid gives vinegar its sour taste."
      visual: "Draw the carbon chain, count it for the prefix, find any double or triple bond for the suffix, and circle any functional group like –OH or –COOH to choose the ending."
      step_by_step: "Name CH₃–CH₂–CH₂–OH: Step 1: 3 carbons: prop. Step 2: Single bonds: -an-. Step 3: –OH group: -ol. Step 4: Propanol."
      real_world: "Hand sanitisers contain ethanol or propanol. Vinegar used in pickles is about 5% ethanoic acid."
    activity:
      type: sort
      prompt: The first part of the name tells the number of carbons.
      bins:
      - 1 carbon
      - 2 carbons
      - 3 carbons
      - 4 carbons
      items:
      - label: Methane
        bin: 1 carbon
        clue: Meth- means how many carbons?
        why: Meth- = 1 carbon.
      - label: Ethene
        bin: 2 carbons
        clue: Eth- means how many?
        why: Eth- = 2 carbons. The -ene ending means a double bond.
      - label: Propene
        bin: 3 carbons
        clue: Prop- means how many?
        why: Prop- = 3 carbons.
      - label: Butane
        bin: 4 carbons
        clue: But- means how many?
        why: But- = 4 carbons.
      - label: Ethyne
        bin: 2 carbons
        clue: Look at the start, not the ending.
        why: Eth- = 2 carbons; -yne means a triple bond.
      - label: Methanol
        bin: 1 carbon
        clue: Look at the start of the name.
        why: Meth- = 1 carbon; -ol means an alcohol.
      - label: Propane
        bin: 3 carbons
        clue: Prop- means how many?
        why: Prop- = 3 carbons.
    lesson:
      - teach: 'IUPAC names have a prefix for the number of carbons in the main chain: meth (1), eth (2), prop (3), but (4), pent (5), hex (6). Then a suffix for the bonds: -ane (all single), -ene (one double), -yne (one triple). So C₃H₈ is propane and C₃H₆ is propene.'
        picture:
          kind: compare
          columns:
          - title: Prefix (carbons)
            points:
            - meth 1, eth 2
            - prop 3, but 4
            - pent 5, hex 6
          - title: Suffix (family)
            points:
            - '-ane: single'
            - '-ene: double'
            - '-yne: triple'
            - '-ol: alcohol'
            - '-oic acid: acid'
          alt: Names are built from a prefix for the carbons and a suffix for the family.
        check:
          prompt: What is the name of C₄H₁₀?
          options:
          - Butane
          - Propane
          - Butene
          answer: Butane
          why: 4 carbons is but-, and C₄H₁₀ fits CₙH₂ₙ₊₂, so -ane.
      - teach: A functional group is the part of a molecule that gives a family its properties. Alcohols have –OH and end in -ol (ethanol, C₂H₅OH). Carboxylic acids have –COOH and end in -oic acid (ethanoic acid, CH₃COOH, in vinegar).
        check:
          prompt: Which functional group is in methanol, CH₃OH?
          options:
          - –OH
          - –COOH
          - C=C
          answer: –OH
          why: The -ol ending and the OH show an alcohol.
      - teach: Aldehydes have –CHO at the end of the chain and end in -al (ethanal, CH₃CHO). Ketones have C=O in the middle of the chain and end in -one (propanone, CH₃COCH₃, used in nail polish remover).
        check:
          prompt: What family does the name 'butanal' belong to?
          options:
          - Aldehyde
          - Ketone
          - Alcohol
          answer: Aldehyde
          why: The -al ending means an aldehyde.
    items:
      - prompt: "What is the name of CH₄?"
        options: ["Methane", "Ethane", "Methene", "Propane"]
        answer: "Methane"
        difficulty: 1
        hints: ["One carbon, single bonds."]
        solution: "1 carbon: meth; single bonds: -ane. Methane."
        mistakes: {"Ethane": prefix_count, "Methene": suffix_bond}
      - prompt: "How many carbon atoms are in hexane?"
        answer: "6"
        check: "6"
        difficulty: 1
        hints: ["Hex means six."]
        solution: "Hex = 6 carbons: C₆H₁₄."
        mistakes: {"5": prefix_count, "4": prefix_count}
      - prompt: "Which compound is an alcohol?"
        options: ["C₂H₅OH", "CH₃COOH", "C₂H₆", "C₂H₄"]
        answer: "C₂H₅OH"
        difficulty: 1
        hints: ["Alcohols have –OH."]
        solution: "C₂H₅OH (ethanol) has the –OH group."
        mistakes: {"CH₃COOH": functional_group}
      - prompt: "What is the name of CH₂=CH–CH₃?"
        options: ["Propene", "Propane", "Propyne", "Ethene"]
        answer: "Propene"
        difficulty: 2
        hints: ["3 carbons and one double bond."]
        solution: "3 carbons: prop; double bond: -ene. Propene."
        mistakes: {"Propane": suffix_bond, "Propyne": suffix_bond, "Ethene": prefix_count}
      - prompt: "Vinegar contains which compound?"
        options: ["Ethanoic acid", "Ethanol", "Methane", "Ethene"]
        answer: "Ethanoic acid"
        difficulty: 2
        hints: ["It is sour, an acid with –COOH."]
        solution: "Vinegar is a dilute solution of ethanoic (acetic) acid, CH₃COOH."
        mistakes: {"Ethanol": functional_group}
      - prompt: "Which functional group is present in propanone, CH₃COCH₃?"
        options: ["Ketone (C=O within the chain)", "Alcohol (–OH)", "Carboxylic acid (–COOH)", "Aldehyde (–CHO)"]
        answer: "Ketone (C=O within the chain)"
        difficulty: 3
        hints: ["The ending -one."]
        solution: "-one means a ketone: the C=O is on the middle carbon."
        mistakes: {"Aldehyde (–CHO)": functional_group}
      - prompt: "How many hydrogen atoms are in a molecule of ethanol, C₂H₅OH?"
        answer: "6"
        check: "5 + 1"
        difficulty: 2
        hints: ["Count the H in C₂H₅ and in OH."]
        solution: "5 + 1 = 6 hydrogen atoms (C₂H₆O)."
        mistakes: {"5": functional_group}
      - prompt: "What is the name of CH≡C–CH₃?"
        options: ["Propyne", "Propene", "Ethyne", "Propane"]
        answer: "Propyne"
        difficulty: 2
        hints: ["Count the carbons for the prefix.", "Which bond is there: single, double or triple?"]
        solution: "Step 1: 3 carbons: prop-. Step 2: A triple bond: -yne. Step 3: Propyne."
        mistakes: {"Propene": suffix_bond, "Ethyne": prefix_count, "Propane": suffix_bond}
      - prompt: "What is the name of CH₃CH₂CH₂OH?"
        options: ["Propanol", "Propanoic acid", "Propanal", "Propane"]
        answer: "Propanol"
        difficulty: 2
        hints: ["Count the carbons.", "Which functional group is –OH?"]
        solution: "Step 1: 3 carbons: prop-. Step 2: –OH makes it an alcohol: -ol. Step 3: Propanol."
        mistakes: {"Propanoic acid": functional_group, "Propanal": functional_group, "Propane": functional_group}
      - prompt: "Which is the formula of ethanal, the aldehyde with two carbon atoms?"
        options: ["CH₃CHO", "CH₃COOH", "C₂H₅OH", "CH₃COCH₃"]
        answer: "CH₃CHO"
        difficulty: 3
        hints: ["Aldehydes end in -al and contain –CHO.", "Two carbons in all."]
        solution: "Step 1: -al means an aldehyde group, –CHO, at the end of the chain. Step 2: With two carbons: CH₃CHO."
        mistakes: {"CH₃COOH": functional_group, "C₂H₅OH": functional_group, "CH₃COCH₃": functional_group}
      - prompt: What is the name of C₂H₆?
        options:
        - Ethane
        - Ethene
        - Methane
        - Propane
        answer: Ethane
        difficulty: 1
        hints:
        - Count the carbons for the prefix.
        - 'Check the hydrogens: single bonds only?'
        solution: 'Step 1: 2 carbons: eth-. Step 2: C₂H₆ fits CₙH₂ₙ₊₂: -ane. Step 3: Ethane.'
        mistakes:
          Ethene: suffix_bond
          Propane: prefix_count
      - prompt: How many carbon atoms are in pentane?
        answer: '5'
        check: '5'
        difficulty: 1
        hints:
        - The prefix tells the number of carbons.
        - Think of a pentagon.
        solution: 'Step 1: Pent- means 5. Step 2: -ane: single bonds. Step 3: Pentane has 5 carbons (C₅H₁₂).'
        mistakes:
          '6': prefix_count
          '4': prefix_count
      - prompt: Which compound is a carboxylic acid?
        options:
        - CH₃COOH
        - C₂H₅OH
        - CH₃CHO
        - C₂H₆
        answer: CH₃COOH
        difficulty: 1
        hints:
        - Look for the group that makes a family an acid.
        - Which formula has –COOH?
        solution: 'Step 1: C₂H₅OH is an alcohol, CH₃CHO an aldehyde, C₂H₆ an alkane. Step 2: CH₃COOH has –COOH. Step 3: It is ethanoic acid.'
        mistakes:
          C₂H₅OH: functional_group
      - prompt: What is the name of CH₂=CH–CH₂–CH₃?
        options:
        - Butene
        - Butane
        - Propene
        - Butyne
        answer: Butene
        difficulty: 2
        hints:
        - Count the carbons.
        - What kind of bond is there between two carbons?
        solution: 'Step 1: 4 carbons: but-. Step 2: There is one C=C: -ene. Step 3: Butene.'
        mistakes:
          Butane: suffix_bond
          Propene: prefix_count
      - prompt: How many hydrogen atoms are in ethanoic acid, CH₃COOH?
        answer: '4'
        check: 3+1
        difficulty: 2
        hints:
        - Count the H in CH₃.
        - Don't forget the H in –COOH.
        solution: 'Step 1: CH₃ has 3 H. Step 2: –COOH has 1 H. Step 3: Total = 4.'
        mistakes:
          '3': functional_group
      - prompt: Butanone is used as a solvent. Which family does it belong to?
        options:
        - Ketone
        - Aldehyde
        - Alcohol
        - Carboxylic acid
        answer: Ketone
        difficulty: 3
        hints:
        - Look at the ending of the name.
        - Which family's names end in -one?
        solution: 'Step 1: The ending is -one. Step 2: -one means a C=O within the chain. Step 3: Butanone is a ketone.'
        mistakes:
          Aldehyde: functional_group
