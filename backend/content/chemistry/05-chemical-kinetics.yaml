# Class 9 Chemistry, chapter 5. Format: content/README.md.
subject: chem
chapter: 5
title: Chemical Kinetics

tips:
  rate_slows: "Work out how much gas is made in each 20 s. As the reactants get used up, does that amount grow or shrink?"
  interval_change: "The rate over a time interval uses the gas made during it: later volume − earlier volume, divided by the time between them."
  time_shrinks: "If the reaction goes k times as fast, the same reaction takes 1/k of the time."
  more_oxygen: "Pure oxygen has more oxygen particles in the same space than air does. What does that do to the number of collisions?"
  dust_surface: "Think about how much surface a fine powder has compared with the same mass in one lump."
  catalyst_amount: "A catalyst changes how fast the products form, not how much reactant there is to turn into product."
  meet_not_hit: "Concentration changes how often particles meet, not how hard they hit. Which factor changes how hard they hit?"
  rate_per_time: "Rate = change in amount ÷ time taken. Divide by the time."
  surface_area: "Smaller pieces have more surface for particles to collide with, so they react faster."
  temperature_up: "Higher temperature makes particles move faster and collide harder and more often, so the rate rises."
  catalyst_not_used: "A catalyst speeds up a reaction but is not used up: it is chemically the same at the end."
  concentration_up: "More concentrated means more particles in the same space, so more collisions and a faster rate."
  effective_collisions: "Only collisions with enough energy (at least the activation energy) and the right direction lead to reaction."
  activation_energy: "Particles must collide with at least a certain minimum energy to start reacting. The name of that energy is about getting the reaction going."
  lump_less_surface: "A bigger lump has less surface for its mass, so fewer particles can collide: it doesn't speed things up."
  rust_slow: "Rusting takes days or years. Burning and precipitation happen almost at once."

concepts:
  - code: chem9.kinetics.rate
    title: Rate of reaction
    notes: |
      The rate of a reaction is the change in the amount (or concentration) of a reactant or product
      per unit time. It can be measured by the volume of gas given off, loss of mass, colour change or
      the time for a precipitate to appear. Rate is fastest at the start and slows as reactants are
      used up. Some reactions are fast (explosions, precipitation) and some slow (rusting).
    explanations:
      text: "When marble chips react with acid, carbon dioxide bubbles off. If 60 cm³ of gas is collected in 30 s, the average rate is 60 ÷ 30 = 2 cm³ per second. The bubbling is fast at first and slows down as the acid gets used up."
      visual: "Picture a graph of gas volume against time: steep at the start, flattening out, then level when the reaction stops. Steepness is the rate."
      step_by_step: "Magnesium loses 0.6 g in 2 minutes. Step 1: Change = 0.6 g. Step 2: Time = 120 s. Step 3: Rate = 0.6 ÷ 120 = 0.005 g per second."
      real_world: "Fireworks explode in a fraction of a second, while an iron gate rusts over years. Both are chemical reactions, at very different rates."
    activity:
      type: formula
      prompt: Rate of reaction = change in amount ÷ time taken.
      inputs:
      - name: c
        label: Gas made
        min: 0
        max: 50
        step: 1
        start: 0
        unit: mL
      - name: t
        label: Time
        min: 1
        max: 60
        step: 1
        start: 1
        unit: s
      outputs:
      - name: r
        label: Rate
        expr: c/t
        unit: mL/s
        places: 2
      goals:
      - prompt: Make 0.5 mL of gas per second for 20 s.
        want:
          r: 0.5
          t: 20
    lesson:
      - teach: 'Some reactions are over in a flash, like a firecracker. Others take years, like an iron gate rusting. The rate of a reaction tells how fast reactants are used up or products are made: change in amount ÷ time taken.'
        check:
          prompt: Which reaction is very fast?
          options:
          - A firecracker exploding
          - An iron nail rusting
          - Milk slowly turning to curd
          answer: A firecracker exploding
          why: An explosion is over almost at once; rusting and curdling take hours or days.
        ways:
        - style: real_world
          teach: A match flares up in a second; milk turns sour over a day; a bicycle chain rusts over months. All are chemical changes, but at very different speeds. How fast reactants are used up, or products made, is the rate of reaction.
      - teach: 'We measure the rate by watching something change: the volume of gas given off, the loss of mass as a gas escapes, a colour fading, or the time for a cloudiness to appear. If 30 cm³ of gas forms in 10 s, the average rate is 30 ÷ 10 = 3 cm³ per second.'
        check:
          prompt: 100 cm³ of gas forms in 50 s. What is the average rate?
          options:
          - 2 cm³/s
          - 5000 cm³/s
          - 50 cm³/s
          answer: 2 cm³/s
          why: Rate = 100 ÷ 50 = 2 cm³ per second.
        ways:
        - style: step_by_step
          teach: 'Step 1: pick something you can measure that changes: gas volume, mass, colour. Step 2: measure how much it changed. Step 3: measure the time it took. Step 4: divide change by time: that is the average rate, like cm³ per second.'
      - teach: A reaction is fastest at the start, when there are most reactant particles. As they get used up, it slows down, and it stops when one reactant runs out. On a graph of gas volume against time, the curve is steep at first and then flattens.
        picture:
          kind: bars
          bars:
          - label: 0–20 s
            value: 40
          - label: 20–40 s
            value: 20
          - label: 40–60 s
            value: 10
          - label: 60–80 s
            value: 0
          unit: cm³
          alt: 'Gas made in each 20 seconds: 40, 20, 10, then 0 cm³. The reaction slows down and stops.'
        check:
          prompt: Why does the reaction slow down?
          options:
          - The reactants are being used up
          - The products speed it up
          - The gas is getting heavier
          answer: The reactants are being used up
          why: Fewer reactant particles means fewer reactions each second.
        ways:
        - style: real_world
          teach: 'Drop a fizzy tablet into water: it bubbles hardest at first, then gently, then stops. At the start there are the most particles to react; as they get used up, the fizzing slows, and it stops when one reactant runs out. A gas-volume graph is steep first, then flat.'
    items:
      - prompt: "60 cm³ of gas is produced in 30 s. What is the average rate, in cm³ per second?"
        answer: "2"
        check: "60/30"
        difficulty: 1
        hints: ["Rate = amount ÷ time."]
        solution: "60 ÷ 30 = 2 cm³/s"
        mistakes: {"1800": rate_per_time, "1/2": rate_per_time}
      - prompt: "Which reaction is very slow?"
        options: ["Rusting of iron", "Burning of a cracker", "Silver nitrate with salt solution", "Burning of cooking gas"]
        answer: "Rusting of iron"
        difficulty: 1
        hints: ["Which one takes days or months?"]
        solution: "Rusting takes days to years; the others are very fast."
        mistakes: {"Burning of a cracker": "rust_slow", "Burning of cooking gas": "rust_slow", "Silver nitrate with salt solution": "rust_slow"}
      - prompt: "In a reaction that produces gas, when is the rate the highest?"
        options: ["At the start", "In the middle", "At the end", "It is the same throughout"]
        answer: "At the start"
        difficulty: 2
        hints: ["When are there the most reactant particles?"]
        solution: "At the start the concentration of reactants is highest, so collisions are most frequent."
        mistakes: {"At the end": concentration_up}
      - prompt: "A reaction makes 45 cm³ of hydrogen in 3 minutes. What is the average rate, in cm³ per minute?"
        answer: "15"
        check: "45/3"
        difficulty: 1
        hints: ["Divide by 3."]
        solution: "45 ÷ 3 = 15 cm³ per minute"
        mistakes: {"135": rate_per_time}
      - prompt: "A flask of marble and acid loses 0.6 g in 2 minutes. What is the average rate of mass loss, in g per second?"
        answer: "0.005"
        check: "Rational(6, 10)/120"
        difficulty: 2
        hints: ["2 minutes = 120 s."]
        solution: "0.6 ÷ 120 = 0.005 g/s"
        mistakes: {"0.3": rate_per_time}
      - prompt: "Gas volume is 20 cm³ at 10 s and 50 cm³ at 25 s. What is the average rate between these times, in cm³/s?"
        answer: "2"
        check: "(50 - 20)/(25 - 10)"
        difficulty: 3
        hints: ["Change in volume ÷ change in time."]
        solution: "(50 − 20) ÷ (25 − 10) = 30 ÷ 15 = 2 cm³/s"
        mistakes: {"6/5": rate_per_time}
      - prompt: "Gas made by a reaction: 0 cm³ at 0 s, 40 cm³ at 20 s, 60 cm³ at 40 s and 70 cm³ at 60 s. In which 20 seconds is the rate highest?"
        options: ["0 to 20 s", "20 to 40 s", "40 to 60 s", "It is the same throughout"]
        answer: "0 to 20 s"
        difficulty: 2
        hints: ["Find the gas made in each 20 s.", "40, then 20, then 10."]
        solution: "Step 1: Gas made: 40, 20 and 10 cm³ in the three intervals. Step 2: The most gas per second is at the start, 0 to 20 s."
        mistakes: {"20 to 40 s": rate_slows, "40 to 60 s": rate_slows, "It is the same throughout": rate_slows}
      - prompt: "Gas made by a reaction: 40 cm³ at 20 s and 70 cm³ at 60 s. What is the average rate between 20 s and 60 s, in cm³ per second?"
        answer: "0.75"
        check: "(70-40)/(60-20)"
        difficulty: 3
        hints: ["How much gas was made between the two times?", "How many seconds passed?"]
        solution: "Step 1: Gas made = 70 − 40 = 30 cm³. Step 2: Time = 40 s. Step 3: Rate = 30 ÷ 40 = 0.75 cm³/s."
        mistakes: {"1.75": interval_change, "1.17": interval_change, "30": rate_per_time}
      - prompt: "A flask of marble chips and acid has a mass of 200.0 g at the start and 198.8 g after 4 minutes. What is the average rate of mass loss, in g per minute?"
        answer: "0.3"
        check: "(2000-1988)/40"
        difficulty: 2
        hints: ["The mass lost is the carbon dioxide that escaped.", "Mass lost ÷ minutes."]
        solution: "Step 1: Mass lost = 1.2 g. Step 2: Rate = 1.2 ÷ 4 = 0.3 g/min."
        mistakes: {"1.2": rate_per_time, "49.7": interval_change, "4.8": rate_per_time}
      - prompt: A reaction gives 90 cm³ of gas in 45 s. What is the average rate, in cm³ per second?
        answer: '2'
        check: 90/45
        difficulty: 1
        hints:
        - Rate = change in amount ÷ time.
        - Divide the volume by the time.
        solution: 'Step 1: Volume = 90 cm³. Step 2: Time = 45 s. Step 3: Rate = 90 ÷ 45 = 2 cm³/s.'
        mistakes:
          '4050': rate_per_time
      - prompt: Which of these is a slow reaction?
        options:
        - Ripening of a mango
        - Burning of a match
        - Adding silver nitrate to salt water
        - A cracker going off
        answer: Ripening of a mango
        difficulty: 1
        hints:
        - Fast reactions are over in a moment.
        - Which one takes days?
        solution: 'Step 1: A match burns and a cracker explodes in moments. Step 2: A white precipitate forms at once with silver nitrate. Step 3: Ripening takes days: it is slow.'
        mistakes:
          Burning of a match: rust_slow
      - prompt: A reaction makes 2 g of product in 4 minutes. What is the average rate, in g per minute?
        answer: '0.5'
        check: 2/4
        difficulty: 1
        hints:
        - Rate = amount ÷ time.
        - Use minutes, since the rate is asked per minute.
        solution: 'Step 1: Amount = 2 g. Step 2: Time = 4 min. Step 3: Rate = 2 ÷ 4 = 0.5 g/min.'
        mistakes:
          '8': rate_per_time
          '2': rate_per_time
      - prompt: Gas volume is 30 cm³ at 20 s and 54 cm³ at 50 s. What is the average rate between these times, in cm³/s?
        answer: '0.8'
        check: (54-30)/(50-20)
        difficulty: 2
        hints:
        - Find the gas made during the interval.
        - Divide by the length of the interval.
        solution: 'Step 1: Gas made = 54 − 30 = 24 cm³. Step 2: Time = 50 − 20 = 30 s. Step 3: Rate = 24 ÷ 30 = 0.8 cm³/s.'
        mistakes:
          '1.08': interval_change
          '1.8': interval_change
      - prompt: 'Magnesium ribbon reacts with acid. Gas made: 25 cm³ in the first 10 s, 15 cm³ in the next 10 s, 5 cm³ in the next 10 s. What does this show?'
        options:
        - The reaction slows down as the reactants are used up
        - The reaction speeds up as it goes
        - The rate stays the same
        - The reaction stops at once
        answer: The reaction slows down as the reactants are used up
        difficulty: 2
        hints:
        - Compare the gas made in each 10 s.
        - Is that amount growing or shrinking?
        solution: 'Step 1: 25, then 15, then 5 cm³ per 10 s. Step 2: Less gas each interval. Step 3: The rate falls as the reactants run low.'
        mistakes:
          The reaction speeds up as it goes: rate_slows
      - prompt: A reaction loses 1.5 g of carbon dioxide in 5 minutes. What is the average rate of mass loss, in g per second?
        answer: '0.005'
        check: 1.5/(5*60)
        difficulty: 3
        hints:
        - Change minutes to seconds first.
        - Then divide the mass by the time.
        solution: 'Step 1: 5 min = 300 s. Step 2: Rate = 1.5 ÷ 300. Step 3: Rate = 0.005 g/s.'
        mistakes:
          '0.3': rate_per_time

  - code: chem9.kinetics.factors
    title: Factors affecting the rate
    after: [chem9.kinetics.rate]
    notes: |
      The rate increases with: higher concentration of reactants (or pressure for gases), higher
      temperature (roughly doubles for each 10 °C rise in many reactions), larger surface area
      (powder rather than lumps), and a catalyst. Light speeds up some reactions (photosynthesis,
      silver chloride turning grey). The nature of the reactants also matters.
    explanations:
      text: "Marble powder fizzes in acid much faster than big chips: more surface is exposed. Warm acid works faster than cold. Stronger acid works faster than dilute. Adding manganese dioxide makes hydrogen peroxide release oxygen much faster, but the manganese dioxide is all still there at the end: it is a catalyst."
      visual: "Picture one big cube of sugar and the same sugar as powder. Cut the cube into 8 small cubes: the surface doubles. Grind it to powder and the surface becomes huge, so water reaches far more sugar at once."
      step_by_step: "To make a reaction faster: Step 1: Use powder, not lumps. Step 2: Use more concentrated solution. Step 3: Heat it. Step 4: Add a suitable catalyst."
      real_world: "Food lasts longer in a fridge because low temperature slows the reactions that spoil it. Chopped vegetables cook faster than whole ones."
    activity:
      type: sort
      prompt: Does it make the reaction faster or slower?
      bins:
      - Faster
      - Slower
      items:
      - label: Heating
        bin: Faster
        clue: Do particles move faster or slower when hot?
        why: 'Faster particles collide more often and harder: faster reaction.'
      - label: Cooling
        bin: Slower
        clue: Do particles move faster or slower when cold?
        why: 'Slower particles collide less: slower reaction.'
      - label: Powdering the solid
        bin: Faster
        why: 'More surface for particles to collide with: faster.'
        clue: Does powder have more or less surface than a lump?
      - label: Using big lumps
        bin: Slower
        clue: Do lumps have more or less surface than powder?
        why: 'Less surface: fewer collisions, slower.'
      - label: Using more concentrated acid
        bin: Faster
        clue: 'More acid particles in the same space: more or fewer collisions?'
        why: 'More collisions every second: faster.'
      - label: Adding a catalyst
        bin: Faster
        clue: What does a catalyst do to the energy needed to react?
        why: 'It lowers the energy needed, so more collisions work: faster.'
      - label: Diluting the acid
        bin: Slower
        clue: 'Fewer acid particles in the same space: more or fewer collisions?'
        why: 'Fewer collisions: slower.'
    lesson:
      - teach: 'Four things speed up most reactions. Concentration: stronger acid reacts faster. Temperature: warm reactions go faster (food spoils faster outside the fridge). Surface area: powder reacts faster than lumps. A catalyst: a substance that speeds up a reaction without being used up.'
        picture:
          kind: flow
          steps:
          - Higher concentration
          - Higher temperature
          - Larger surface area
          - Add a catalyst
          - Faster reaction
          alt: Concentration, temperature, surface area and catalysts all speed up reactions.
        check:
          prompt: 'Which will dissolve faster in acid: a lump of chalk or chalk powder of the same mass?'
          options:
          - Chalk powder
          - The lump
          - Both the same
          answer: Chalk powder
          why: Powder has much more surface for the acid to attack.
        ways:
        - style: real_world
          teach: 'In the kitchen: crushed garlic flavours a curry faster than whole cloves (more surface). Milk sours faster outside the fridge (higher temperature). Strong vinegar works faster than weak (concentration). Yeast speeds up dough rising without being used up (a catalyst).'
      - teach: Temperature has a big effect. For many reactions, the rate roughly doubles for every 10 °C rise. From 20 °C to 40 °C is two rises of 10 °C, so the rate becomes 2 × 2 = 4 times faster.
        check:
          prompt: A rate doubles every 10 °C. How much faster is it at 30 °C than at 20 °C?
          options:
          - 2 times
          - 10 times
          - 4 times
          answer: 2 times
          why: 'One 10 °C rise: one doubling.'
        ways:
        - style: step_by_step
          teach: 'Step 1: find how many degrees the temperature rose. Step 2: divide by 10 to count the 10 °C steps. Step 3: double the rate once for each step. Two steps: 2 × 2 = 4 times; three steps: 8 times.'
      - teach: 'A catalyst is not used up: at the end it is still there, chemically unchanged. Manganese dioxide speeds up the breakdown of hydrogen peroxide; iron is the catalyst in making ammonia. Enzymes in our body are catalysts too. Light also speeds up some reactions, like photosynthesis.'
        check:
          prompt: What happens to a catalyst during a reaction?
          options:
          - It is unchanged at the end
          - It is used up
          - It becomes a product
          answer: It is unchanged at the end
          why: A catalyst speeds up the reaction but is not consumed.
        ways:
        - style: step_by_step
          teach: 'Step 1: weigh the catalyst before the reaction. Step 2: let the reaction run, faster than without it. Step 3: weigh it after: the same mass, chemically unchanged. A catalyst helps the reaction along and is left over at the end.'
    items:
      - prompt: "Which will react fastest with dilute hydrochloric acid?"
        options: ["Marble powder", "Large marble chips", "One big marble block", "They all react at the same rate"]
        answer: "Marble powder"
        difficulty: 1
        hints: ["Which has the largest surface area?"]
        solution: "Powder exposes the most surface, so it reacts fastest."
        mistakes: {"They all react at the same rate": surface_area}
      - prompt: "Why does food keep longer in a refrigerator?"
        options: ["Low temperature slows down the reactions that spoil it", "Cold air has no oxygen", "The fridge kills all germs", "Light speeds up spoiling"]
        answer: "Low temperature slows down the reactions that spoil it"
        difficulty: 1
        hints: ["How does temperature affect rate?"]
        solution: "Lower temperature means fewer and gentler collisions, so spoiling reactions are slower."
        mistakes: {"The fridge kills all germs": temperature_up}
      - prompt: "Manganese dioxide speeds up the breakdown of hydrogen peroxide. After the reaction, how much manganese dioxide is left?"
        options: ["The same amount as at the start", "None", "Half", "More than at the start"]
        answer: "The same amount as at the start"
        difficulty: 2
        hints: ["It is a catalyst."]
        solution: "A catalyst is not used up, so all of it remains."
        mistakes: {"None": catalyst_not_used, "Half": catalyst_not_used}
      - prompt: "A reaction's rate doubles for every 10 °C rise. How many times faster is it at 50 °C than at 30 °C?"
        answer: "4"
        check: "2**((50 - 30)/10)"
        difficulty: 2
        hints: ["Two 10 °C steps."]
        solution: "Two doublings: 2 × 2 = 4 times faster."
        mistakes: {"2": temperature_up}
      - prompt: "A 2 cm cube is cut into eight 1 cm cubes. By how many times does the total surface area increase?"
        answer: "2"
        check: "(8*6*1**2)/(6*2**2)"
        difficulty: 3
        hints: ["Big cube: 6 × 4 = 24 cm².", "Eight small cubes: 8 × 6 × 1 = 48 cm²."]
        solution: "Step 1: 24 cm² before. Step 2: 48 cm² after. Step 3: 48 ÷ 24 = 2 times."
        mistakes: {"8": surface_area}
      - prompt: "Which change will NOT speed up the reaction between zinc and dilute sulphuric acid?"
        options: ["Using a bigger lump of zinc", "Heating the acid", "Using more concentrated acid", "Using zinc powder"]
        answer: "Using a bigger lump of zinc"
        difficulty: 2
        hints: ["A bigger lump has less surface per gram."]
        solution: "A bigger lump has less surface area for its mass, so it does not speed the reaction."

        mistakes: {"Using zinc powder": "lump_less_surface", "Heating the acid": "temperature_up", "Using more concentrated acid": "concentration_up"}
      - prompt: "A reaction takes 4 minutes at 20 °C. Its rate doubles for every 10 °C rise. How many minutes does it take at 40 °C?"
        answer: "1"
        check: "4/2**2"
        difficulty: 3
        hints: ["From 20 °C to 40 °C is two 10 °C steps.", "Rate × 4 means time ÷ 4."]
        solution: "Step 1: Two doublings make it 4 times as fast. Step 2: Time = 4 ÷ 4 = 1 minute."
        mistakes: {"16": time_shrinks, "2": temperature_up, "8": time_shrinks}
      - prompt: "Why does a glowing splint burn much faster in pure oxygen than in air?"
        options: ["More oxygen particles in the same space mean more collisions", "Pure oxygen is hotter than air", "Oxygen acts as a catalyst", "The splint has more surface in oxygen"]
        answer: "More oxygen particles in the same space mean more collisions"
        difficulty: 2
        hints: ["Air is only about one fifth oxygen.", "Which factor is this: temperature, concentration, surface area or catalyst?"]
        solution: "Step 1: Pure oxygen has about five times the oxygen concentration of air. Step 2: More collisions with oxygen each second make burning faster."
        mistakes: {"Pure oxygen is hotter than air": more_oxygen, "Oxygen acts as a catalyst": catalyst_not_used, "The splint has more surface in oxygen": more_oxygen}
      - prompt: "Lumps of coal burn slowly, but fine coal dust in a mine can explode. Why?"
        options: ["The dust has a far larger surface area, so it burns extremely fast", "Coal dust is a catalyst", "Coal dust contains more carbon", "Dust is hotter than lumps"]
        answer: "The dust has a far larger surface area, so it burns extremely fast"
        difficulty: 3
        hints: ["Which factor is different between a lump and dust of the same coal?", "Burning happens at the surface."]
        solution: "Step 1: Dust has a huge total surface for oxygen to reach. Step 2: So many collisions happen at once that the burning becomes explosive."
        mistakes: {"Coal dust is a catalyst": catalyst_not_used, "Coal dust contains more carbon": dust_surface, "Dust is hotter than lumps": dust_surface}
      - prompt: Which change will slow down the reaction between marble and hydrochloric acid?
        options:
        - Using more dilute acid
        - Warming the acid
        - Crushing the marble
        - Using more concentrated acid
        answer: Using more dilute acid
        difficulty: 1
        hints:
        - Three of the changes speed things up.
        - What does diluting do to the number of acid particles in the same space?
        solution: 'Step 1: Warming, crushing and concentrating speed it up. Step 2: Diluting means fewer acid particles per cm³. Step 3: Fewer collisions, so it slows down.'
        mistakes:
          Crushing the marble: surface_area
      - prompt: Why do we chew food well before swallowing?
        options:
        - Small pieces have more surface, so digestion is faster
        - Chewing adds heat to the food
        - It removes the catalyst
        - It makes the food more concentrated
        answer: Small pieces have more surface, so digestion is faster
        difficulty: 1
        hints:
        - Chewing breaks food into small bits.
        - What do small bits have more of than a big lump?
        solution: 'Step 1: Chewing breaks food into small pieces. Step 2: That gives more surface area. Step 3: Digestive enzymes can act faster.'
        mistakes:
          It makes the food more concentrated: surface_area
      - prompt: A reaction's rate doubles for every 10 °C rise. How many times faster is it at 60 °C than at 30 °C?
        answer: '8'
        check: 2**3
        difficulty: 2
        hints:
        - How many 10 °C rises are there from 30 °C to 60 °C?
        - Double once for each rise.
        solution: 'Step 1: 60 − 30 = 30 °C = three 10 °C rises. Step 2: 2 × 2 × 2. Step 3: 8 times faster.'
        mistakes:
          '6': temperature_up
          '3': temperature_up
      - prompt: In the Haber process for ammonia, iron is used as a catalyst. What does the iron do?
        options:
        - Speeds up the reaction without being used up
        - Becomes part of the ammonia
        - Makes more ammonia from the same reactants
        - Slows down the reaction
        answer: Speeds up the reaction without being used up
        difficulty: 2
        hints:
        - A catalyst changes how fast, not how much.
        - Is the iron still there at the end?
        solution: 'Step 1: Iron is a catalyst. Step 2: It speeds up the reaction. Step 3: It is not used up and does not become part of the product.'
        mistakes:
          Becomes part of the ammonia: catalyst_not_used
          Makes more ammonia from the same reactants: catalyst_amount
      - prompt: A reaction takes 12 minutes at 25 °C. Its rate doubles for every 10 °C rise. How many minutes does it take at 45 °C?
        answer: '3'
        check: 12/2**2
        difficulty: 3
        hints:
        - How many times faster is it at 45 °C?
        - Faster reaction, shorter time.
        solution: 'Step 1: 45 − 25 = 20 °C: two doublings. Step 2: 4 times faster. Step 3: Time = 12 ÷ 4 = 3 minutes.'
        mistakes:
          '48': time_shrinks
          '6': time_shrinks
      - prompt: Why does a cut apple turn brown faster on a hot day than in a fridge?
        options:
        - Higher temperature speeds up the reaction with air
        - The fridge has no oxygen
        - Cold makes apples sweeter
        - Heat adds a catalyst
        answer: Higher temperature speeds up the reaction with air
        difficulty: 2
        hints:
        - Browning is a chemical reaction.
        - Which factor differs between a hot day and a fridge?
        solution: 'Step 1: Browning is a reaction with oxygen in the air. Step 2: On a hot day the particles move faster and collide more. Step 3: So browning is faster.'
        mistakes:
          The fridge has no oxygen: temperature_up
  - code: chem9.kinetics.collisions
    title: Collision theory
    after: [chem9.kinetics.factors]
    notes: |
      Particles react only when they collide with at least a minimum energy, the activation energy,
      and in the right orientation (effective collisions). Concentration and surface area increase
      the number of collisions; temperature increases both the number of collisions and the fraction
      with enough energy; a catalyst provides a path with lower activation energy.
    explanations:
      text: "Reactant particles are like people in a crowded hall bumping into each other. Most bumps do nothing. Only a hard enough bump in the right way breaks bonds and makes new ones. Heating makes everyone move faster, so there are more bumps and far more hard ones."
      visual: "Draw an energy hill between reactants and products. The height of the hill is the activation energy. A catalyst digs a tunnel through the hill: a lower route that more particles can manage."
      step_by_step: "Why does heating speed up a reaction? Step 1: Particles gain kinetic energy. Step 2: They collide more often. Step 3: More of the collisions have energy above the activation energy. Step 4: More effective collisions per second, so a faster rate."
      real_world: "Enzymes in our body are natural catalysts. They let digestion happen at 37 °C, which would otherwise need much higher temperatures."
    activity:
      type: sort
      prompt: True or false? (Collision theory)
      bins:
      - 'True'
      - 'False'
      items:
      - label: Particles must collide to react
        bin: 'True'
        clue: Can two particles react without touching?
        why: 'They have to meet: true.'
      - label: Every collision causes a reaction
        bin: 'False'
        why: Only collisions with enough energy (and the right direction) react.
        clue: If every collision worked, what would happen to all reactions?
      - label: Heating makes particles move faster and collide harder
        bin: 'True'
        clue: What does heat do to particles?
        why: 'Heat gives them more energy: true.'
      - label: A catalyst gets used up in the reaction
        bin: 'False'
        clue: Is the catalyst still there at the end?
        why: A catalyst is left unchanged at the end.
      - label: A higher concentration means more collisions per second
        bin: 'True'
        clue: 'More particles in the same space: more or fewer bumps?'
        why: 'More particles, more collisions: true.'
    lesson:
      - teach: 'Why do these factors work? Collision theory says particles react only when they collide. But not every bump counts: they must hit hard enough, with at least the activation energy, and facing the right way. Such collisions are effective collisions.'
        check:
          prompt: Which collisions lead to a reaction?
          options:
          - Those with enough energy and the right orientation
          - Every collision
          - Only the slowest collisions
          answer: Those with enough energy and the right orientation
          why: Only effective collisions, with at least the activation energy and the right orientation, react.
        ways:
        - style: real_world
          teach: 'Think of opening a stuck door by bumping it. A gentle nudge does nothing; you need a hard enough shove, and you must hit the door, not the wall. Particles are similar: they react only when they collide with at least the activation energy and the right way round.'
      - teach: 'Concentration and surface area increase how often particles meet, so there are more collisions each second. Temperature does more: particles move faster, so they collide more often AND a much bigger share of collisions have enough energy.'
        picture:
          kind: compare
          columns:
          - title: Concentration / surface area
            points:
            - more collisions per second
            - same share with enough energy
          - title: Temperature
            points:
            - more collisions per second
            - bigger share with enough energy
          alt: Concentration and surface area add collisions; temperature also gives more of them enough energy.
        check:
          prompt: Why does heating speed up a reaction so much?
          options:
          - More collisions have at least the activation energy
          - Particles become bigger
          - The activation energy rises
          answer: More collisions have at least the activation energy
          why: Faster particles hit harder, so many more collisions are effective.
        ways:
        - style: step_by_step
          teach: 'Step 1: more concentration or more surface means more particles meeting, so more collisions per second. Step 2: higher temperature makes particles faster, so more collisions too. Step 3: and, more importantly, far more of them now have enough energy. So heat speeds things up the most.'
      - teach: 'A catalyst offers a different route with a lower activation energy. More collisions now have enough energy, so the reaction is faster. The catalyst does not change how much product forms: it only gets there sooner.'
        check:
          prompt: How does a catalyst speed up a reaction?
          options:
          - It lowers the activation energy
          - It gives particles more energy
          - It adds more reactant
          answer: It lowers the activation energy
          why: With a lower energy barrier, more collisions succeed.
        ways:
        - style: real_world
          teach: 'Crossing a mountain range, a tunnel lets you go through instead of climbing over the top. A catalyst is like that tunnel: it gives a route with a lower energy hill, so more collisions succeed. You end up in the same place with the same amount of product, just sooner.'
    items:
      - prompt: "The minimum energy colliding particles need in order to react is called:"
        options: ["Activation energy", "Kinetic energy", "Heat of reaction", "Bond energy"]
        answer: "Activation energy"
        difficulty: 1
        hints: ["It is the height of the energy hill."]
        solution: "Activation energy is the minimum energy needed for a collision to lead to reaction."
        mistakes: {"Kinetic energy": "activation_energy", "Heat of reaction": "activation_energy"}
      - prompt: "How does a catalyst speed up a reaction?"
        options: ["It lowers the activation energy", "It raises the temperature", "It increases the concentration", "It is used up as fuel"]
        answer: "It lowers the activation energy"
        difficulty: 2
        hints: ["It offers an easier path."]
        solution: "A catalyst provides an alternative route with a lower activation energy, so more collisions succeed."
        mistakes: {"It is used up as fuel": catalyst_not_used}
      - prompt: "Why does increasing concentration increase the rate?"
        options: ["There are more collisions per second", "Each collision has more energy", "The activation energy falls", "The particles get bigger"]
        answer: "There are more collisions per second"
        difficulty: 2
        hints: ["More particles in the same space."]
        solution: "More particles per volume means more frequent collisions."
        mistakes: {"The activation energy falls": concentration_up}
      - prompt: "Not every collision between reactant particles leads to a reaction. Why?"
        options: ["Some collisions have too little energy or the wrong orientation", "Particles never touch", "Only catalysts can react", "Reactions need light"]
        answer: "Some collisions have too little energy or the wrong orientation"
        difficulty: 1
        hints: ["Think about 'effective' collisions."]
        solution: "Only collisions with at least the activation energy, and in the right direction, are effective."
        mistakes: {"Particles never touch": effective_collisions}
      - prompt: "Heating increases the rate mainly because:"
        options: ["More collisions have energy greater than the activation energy", "The activation energy becomes zero", "The particles get heavier", "A catalyst forms"]
        answer: "More collisions have energy greater than the activation energy"
        difficulty: 3
        hints: ["Faster particles collide harder."]
        solution: "At higher temperature a much larger fraction of collisions have enough energy to react."
        mistakes: {"The activation energy becomes zero": effective_collisions}
      - prompt: "In a reaction, 1 collision in every 10,000 is effective. There are 5,000,000 collisions per second. How many effective collisions are there per second?"
        answer: "500"
        check: "5000000/10000"
        difficulty: 3
        hints: ["Divide by 10,000."]
        solution: "5,000,000 ÷ 10,000 = 500"
        mistakes: {"5000000": effective_collisions}
      - prompt: "A catalyst lowers a reaction's activation energy. What happens to the amount of product made by the end?"
        options: ["The same amount is made, but sooner", "More product is made", "Less product is made", "The product is made more slowly"]
        answer: "The same amount is made, but sooner"
        difficulty: 3
        hints: ["Is the catalyst used up or turned into product?", "What decides how much product can form?"]
        solution: "Step 1: The amount of product depends on the amount of reactants. Step 2: The catalyst only speeds up the reaction, so the same amount forms sooner."
        mistakes: {"More product is made": catalyst_amount, "Less product is made": catalyst_amount, "The product is made more slowly": catalyst_not_used}
      - prompt: "The concentration of an acid is doubled, at the same temperature. What happens to the fraction of collisions that have at least the activation energy?"
        options: ["It stays the same", "It doubles", "It halves", "Every collision now has enough energy"]
        answer: "It stays the same"
        difficulty: 3
        hints: ["Concentration changes how many collisions happen.", "What decides how energetic each collision is?"]
        solution: "Step 1: Doubling concentration doubles the number of collisions. Step 2: The particles' energies depend on temperature, which is unchanged, so the fraction with enough energy stays the same."
        mistakes: {"It doubles": meet_not_hit, "It halves": meet_not_hit, "Every collision now has enough energy": effective_collisions}
      - prompt: "In a reaction, 1 collision in every 2000 is effective. How many collisions per second are needed for 600 effective collisions per second?"
        answer: "1200000"
        check: "600*2000"
        difficulty: 2
        hints: ["Effective = total ÷ 2000.", "Total = 600 × 2000."]
        solution: "Step 1: Total × 1/2000 = 600. Step 2: Total = 1,200,000 collisions per second."
        mistakes: {"0.3": effective_collisions, "3.33": effective_collisions}
      - prompt: 'A collision that leads to a reaction is called:'
        options:
        - An effective collision
        - An activation collision
        - A catalyst collision
        - A slow collision
        answer: An effective collision
        difficulty: 1
        hints:
        - Most collisions do not lead to a reaction.
        - The ones that do have a special name.
        solution: 'Step 1: Not every collision reacts. Step 2: Those with enough energy and the right orientation do. Step 3: They are effective collisions.'
        mistakes:
          An activation collision: effective_collisions
      - prompt: Why does powdered zinc react faster with acid than a single piece of zinc?
        options:
        - More zinc surface is exposed, so there are more collisions
        - Powder has more energy
        - Powder lowers the activation energy
        - Powder is a catalyst
        answer: More zinc surface is exposed, so there are more collisions
        difficulty: 1
        hints:
        - Acid particles can only hit zinc on its surface.
        - Which form has more surface?
        solution: 'Step 1: Reactions happen at the surface. Step 2: Powder has much more surface. Step 3: More collisions per second, so a faster rate.'
        mistakes:
          Powder lowers the activation energy: surface_area
      - prompt: 'Raising the temperature makes particles:'
        options:
        - Move faster and collide harder and more often
        - Move slower
        - Lower their activation energy
        - Join together
        answer: Move faster and collide harder and more often
        difficulty: 2
        hints:
        - Heat gives particles more kinetic energy.
        - What happens to their collisions?
        solution: 'Step 1: Heat gives particles more energy. Step 2: They move faster. Step 3: They collide more often and harder, so more collisions are effective.'
        mistakes:
          Lower their activation energy: meet_not_hit
      - prompt: In a gas, 1 collision in every 500 is effective. There are 2,000,000 collisions per second. How many effective collisions are there per second?
        answer: '4000'
        check: 2000000/500
        difficulty: 2
        hints:
        - Find what fraction of collisions is effective.
        - Multiply the total by that fraction.
        solution: 'Step 1: Fraction = 1/500. Step 2: 2,000,000 ÷ 500. Step 3: = 4000 effective collisions per second.'
        mistakes:
          '1000000000': effective_collisions
      - prompt: 'Increasing the concentration of a reactant speeds up a reaction because:'
        options:
        - Particles meet more often
        - Each collision has more energy
        - The activation energy is lower
        - The products form a catalyst
        answer: Particles meet more often
        difficulty: 2
        hints:
        - More concentrated means more particles in the same space.
        - Does that change how hard they hit, or how often they meet?
        solution: 'Step 1: More particles in the same volume. Step 2: They meet more often. Step 3: More collisions per second means a faster rate; the energy of each hit is unchanged.'
        mistakes:
          Each collision has more energy: meet_not_hit
      - prompt: A catalyst is added to a reaction. Which is true?
        options:
        - More collisions are effective, because less energy is needed
        - Particles move faster
        - More product is made in the end
        - The catalyst is used up
        answer: More collisions are effective, because less energy is needed
        difficulty: 3
        hints:
        - A catalyst changes the route of the reaction.
        - Does it change the temperature, or the energy barrier?
        solution: 'Step 1: A catalyst gives a route with lower activation energy. Step 2: More collisions now have enough energy. Step 3: The rate rises, but the amount of product is the same.'
        mistakes:
          More product is made in the end: catalyst_amount
          The catalyst is used up: catalyst_not_used
