# Class 9 Chemistry, chapter 6. Format: content/README.md.
subject: chem
chapter: 6
title: Solutions

tips:
  other_solvents: "Water is not the only solvent. Which liquid here does the dissolving?"
  solution_minus_solute: "The solution's mass is solute + solvent. Take the solute away to find the solvent."
  dilute_target: "The salt does not change when water is added. Find what total mass of solution gives the new percentage, then subtract what you already have."
  mix_percent: "Percentages don't add. Add up the masses of sugar, add up the masses of solution, then find the new percentage."
  extra_stays: "Compare what you add with what the water can hold at that temperature. Anything over the limit stays undissolved."
  test_saturated: "A saturated solution can't take any more solute at that temperature. What simple test would show that?"
  colloid_signs: "Check two things: does a light beam show up (scattering), and do particles settle? Which kind of mixture scatters light but never settles?"
  ink_through_paper: "Filter paper stops only large particles. Ink is a colloid: how big are its particles compared with the paper's pores?"
  solute_solvent_swapped: "The solute is what dissolves (usually less); the solvent does the dissolving (usually more)."
  mass_of_solution: "Mass percentage uses the mass of the whole solution: solute + solvent."
  percent_times_100: "Multiply the fraction by 100 to get a percentage."
  saturated_meaning: "A solution that cannot dissolve any more solute at that temperature is full. When it cools and can hold less, the extra comes out as crystals: subtract the two solubilities."
  solubility_per_100g: "Solubility is grams per 100 g of solvent, and concentration in g/L is grams per 1000 mL. Scale the numbers you have up or down to the amount asked."
  tyndall_true_solution: "True solutions do not scatter light; colloids do (Tyndall effect)."
  particle_size: "True solution particles are smallest (< 1 nm), colloids in between (1–100 nm), suspensions largest (> 100 nm)."
  alloy_solid_solution: "In brass, zinc is dissolved in copper. Both are solids, so it's a solid-in-solid solution."
  concentration_ratio: "Compare salt per gram of water: the same salt in less water is more concentrated."
  fog_aerosol: "Fog is tiny water droplets (liquid) spread through air (gas)."
  gas_in_liquid: "Ask of each choice: what is dissolved, and what is it dissolved in? Find the one where a gas is dissolved in a liquid, like the fizz in a drink."
  gases_less_soluble_hot: "Gases dissolve less in warm water, so warm water holds less oxygen for fish."
  solids_more_soluble_hot: "For most solids, more dissolves in hot water. It's gases that dissolve less when warm."
  suspension_settles: "In a true solution particles are too small to see; in the in-between kind they stay spread out. Only a mixture with big enough particles falls to the bottom when left."
  universal_not_all: "Water dissolves very many substances, but not everything: oil doesn't dissolve in it."

concepts:
  - code: chem9.solutions.parts
    title: Solute, solvent and solution
    notes: |
      A solution is a homogeneous mixture of two or more substances. The substance that dissolves is
      the solute; the one it dissolves in is the solvent (usually present in larger amount). Water is
      the universal solvent. Solutions can be solid, liquid or gas: air (gas in gas), soda water (gas
      in liquid), brass (solid in solid). Aqueous solutions have water as the solvent.
    explanations:
      text: "Stir sugar into water: the sugar seems to vanish, and every spoonful tastes equally sweet. Sugar is the solute, water the solvent, and sugar water the solution. The mixture is the same all through: homogeneous."
      visual: "Picture sugar crystals breaking up into particles too small to see, spreading evenly between the water particles."
      step_by_step: "Identify the parts of salt water: Step 1: Salt dissolves: solute. Step 2: Water does the dissolving: solvent. Step 3: Salt water: solution. Step 4: Water is the solvent, so it is an aqueous solution."
      real_world: "The ORS given to children with diarrhoea is a solution of salt and sugar in water, made in exact amounts."
    activity:
      type: sort
      prompt: Solute (what dissolves) or solvent (what it dissolves in)?
      bins:
      - Solute
      - Solvent
      items:
      - label: Salt in salt water
        bin: Solute
        clue: Which is there in the smaller amount, and dissolves?
        why: 'Salt is what dissolves: the solute.'
      - label: Water in salt water
        bin: Solvent
        clue: Which does the dissolving?
        why: 'Water does the dissolving: the solvent.'
      - label: Sugar in sugar syrup
        bin: Solute
        clue: Which dissolves?
        why: 'Sugar dissolves: the solute.'
      - label: Water in sugar syrup
        bin: Solvent
        clue: Which does the dissolving?
        why: 'Water: the solvent.'
      - label: Iodine in tincture of iodine
        bin: Solute
        clue: Which dissolves?
        why: 'Iodine dissolves: the solute.'
      - label: Alcohol in tincture of iodine
        bin: Solvent
        clue: Which does the dissolving?
        why: 'Alcohol dissolves the iodine: the solvent.'
    lesson:
      - teach: 'Stir sugar into water and it seems to vanish: you get a clear, sweet liquid that tastes the same everywhere. This is a solution, a mixture that is the same all through (homogeneous). The substance that dissolves (sugar) is the solute; the one it dissolves in (water) is the solvent.'
        check:
          prompt: In salt water, what is the solvent?
          options:
          - Water
          - Salt
          - Both
          answer: Water
          why: Water does the dissolving; salt is the solute.
        ways:
        - style: real_world
          teach: 'Make a glass of sugar water and taste the top, middle and bottom: all equally sweet. That evenly mixed liquid is a solution. The thing that dissolved (sugar) is the solute; the thing it dissolved in (water) is the solvent. Usually the solvent is the one there is more of.'
      - teach: 'The mass of a solution is the solute plus the solvent: nothing is lost when it dissolves. 20 g of sugar in 180 g of water makes 200 g of solution.'
        check:
          prompt: 30 g of salt is dissolved in 120 g of water. What is the mass of the solution?
          options:
          - 150 g
          - 90 g
          - 120 g
          answer: 150 g
          why: Solution = solute + solvent = 30 + 120 = 150 g.
        ways:
        - style: step_by_step
          teach: 'Step 1: weigh the solute. Step 2: weigh the solvent. Step 3: add them: that is the mass of the solution. Dissolving hides the solute from sight, but none of its mass is lost.'
      - teach: 'Solutions are not only solids in liquids. Air is a gas in a gas, soda water is a gas in a liquid, and brass is a solid in a solid. Water dissolves so many substances that it is called the universal solvent, but some solutes need other solvents: iodine dissolves in alcohol, paint in turpentine.'
        picture:
          kind: compare
          columns:
          - title: Gas in liquid
            points:
            - soda water (CO₂ in water)
          - title: Gas in gas
            points:
            - air (O₂ in N₂)
          - title: Solid in solid
            points:
            - brass (zinc in copper)
          alt: 'Examples of solutions: soda water, air and brass.'
        check:
          prompt: Which is a solid-in-solid solution?
          options:
          - Bronze, an alloy
          - Lemonade
          - Air
          answer: Bronze, an alloy
          why: Alloys are solid metals dissolved in each other.
        ways:
        - style: real_world
          teach: Solutions are everywhere, not just in a glass. Air is gases mixed in gases. Soda is carbon dioxide gas in water. Brass and bronze are metals mixed into metals. Water dissolves a great many things, but paint needs turpentine, and iodine dissolves well in alcohol.
    items:
      - prompt: "In a solution of sugar in water, what is the solute?"
        options: ["Sugar", "Water", "Sugar water", "Air"]
        answer: "Sugar"
        difficulty: 1
        hints: ["The solute is what dissolves."]
        solution: "Sugar dissolves, so it is the solute; water is the solvent."
        mistakes: {"Water": solute_solvent_swapped}
      - prompt: "Which is a solution of a gas in a liquid?"
        options: ["Soda water", "Brass", "Air", "Sugar syrup"]
        answer: "Soda water"
        difficulty: 1
        hints: ["Carbon dioxide dissolved in water."]
        solution: "Soda water is CO₂ (gas) dissolved in water (liquid)."
        mistakes: {"Brass": "gas_in_liquid", "Air": "gas_in_liquid", "Sugar syrup": "gas_in_liquid"}
      - prompt: "Why is water called the universal solvent?"
        options: ["It dissolves a very large number of substances", "It dissolves everything", "It is found everywhere", "It has no colour"]
        answer: "It dissolves a very large number of substances"
        difficulty: 2
        hints: ["Not literally everything: oil does not dissolve in water."]
        solution: "Water dissolves more substances than any other common liquid, though not all (e.g. oil)."
        mistakes: {"It dissolves everything": "universal_not_all", "It is found everywhere": "universal_not_all"}
      - prompt: "Brass is a mixture of copper and zinc. What kind of solution is it?"
        options: ["Solid in solid", "Liquid in solid", "Gas in solid", "It is not a solution"]
        answer: "Solid in solid"
        difficulty: 2
        hints: ["Both are metals, solid at room temperature."]
        solution: "Zinc is dissolved in copper: a solid solution (an alloy)."
        mistakes: {"Liquid in solid": "alloy_solid_solution", "It is not a solution": "alloy_solid_solution"}
      - prompt: "10 g of salt is dissolved in 90 g of water. What is the mass of the solution, in g?"
        answer: "100"
        check: "10 + 90"
        difficulty: 1
        hints: ["Solute + solvent."]
        solution: "10 + 90 = 100 g"
        mistakes: {"90": mass_of_solution}
      - prompt: "Air contains about 78% nitrogen and 21% oxygen. In air, which is the solvent?"
        options: ["Nitrogen", "Oxygen", "Carbon dioxide", "Water vapour"]
        answer: "Nitrogen"
        difficulty: 3
        hints: ["The solvent is the component present in the largest amount."]
        solution: "Nitrogen is present in the greatest amount, so it is the solvent."
        mistakes: {"Oxygen": solute_solvent_swapped}
      - prompt: "Tincture of iodine is iodine dissolved in alcohol. What is the solvent?"
        options: ["Alcohol", "Iodine", "Water", "Both together"]
        answer: "Alcohol"
        difficulty: 2
        hints: ["Which substance dissolves?", "Which substance does the dissolving?"]
        solution: "Step 1: Iodine is the solute. Step 2: Alcohol dissolves it, so alcohol is the solvent."
        mistakes: {"Iodine": solute_solvent_swapped, "Water": other_solvents, "Both together": solute_solvent_swapped}
      - prompt: "25 g of sugar is dissolved in water to make 200 g of solution. How many grams of water were used?"
        answer: "175"
        check: "200-25"
        difficulty: 2
        hints: ["Solution = solute + solvent.", "200 − 25."]
        solution: "Step 1: Water = solution − sugar. Step 2: 200 − 25 = 175 g."
        mistakes: {"225": solution_minus_solute, "200": solution_minus_solute}
      - prompt: "Which of these is NOT a solution?"
        options: ["Muddy water", "Air", "Brass", "Soda water"]
        answer: "Muddy water"
        difficulty: 2
        hints: ["A solution is the same all the way through and never settles.", "Which one has particles you can see falling to the bottom?"]
        solution: "Step 1: Air, brass and soda water are all uniform mixtures. Step 2: Mud settles out of muddy water, so it is a suspension."
        mistakes: {"Air": suspension_settles, "Brass": alloy_solid_solution, "Soda water": gas_in_liquid}
      - prompt: "A doctor makes a solution by dissolving 5 g of glucose in 100 g of water. Which statement is true?"
        options:
        - "Glucose is the solute and water is the solvent; the solution weighs 105 g"
        - "Water is the solute; the solution weighs 100 g"
        - "Glucose is the solvent; the solution weighs 95 g"
        - "Both are solvents; the solution weighs 5 g"
        answer: "Glucose is the solute and water is the solvent; the solution weighs 105 g"
        difficulty: 3
        hints: ["Which substance dissolves, and which does the dissolving?", "Nothing is lost when a solid dissolves. Add the masses."]
        solution: "Step 1: Glucose dissolves, so it is the solute. Step 2: Water does the dissolving, so it is the solvent. Step 3: Mass of solution = 5 + 100 = 105 g."
        mistakes: {"Water is the solute; the solution weighs 100 g": solute_solvent_swapped, "Glucose is the solvent; the solution weighs 95 g": mass_of_solution}
      - prompt: In a solution of copper sulphate in water, what is the solute?
        options:
        - Copper sulphate
        - Water
        - The blue colour
        - Air
        answer: Copper sulphate
        difficulty: 1
        hints:
        - The solute is the substance that dissolves.
        - Which substance seems to disappear into the other?
        solution: 'Step 1: Copper sulphate dissolves. Step 2: Water does the dissolving. Step 3: Copper sulphate is the solute.'
        mistakes:
          Water: solute_solvent_swapped
      - prompt: 12 g of glucose is dissolved in 88 g of water. What is the mass of the solution, in g?
        answer: '100'
        check: 12+88
        difficulty: 1
        hints:
        - Nothing is lost when a solute dissolves.
        - Add the masses of solute and solvent.
        solution: 'Step 1: Solute = 12 g. Step 2: Solvent = 88 g. Step 3: Solution = 100 g.'
        mistakes:
          '76': solution_minus_solute
      - prompt: Which of these is a true solution?
        options:
        - Lemon juice with sugar stirred until clear
        - Sand in water
        - Oil and water shaken
        - Chalk in water
        answer: Lemon juice with sugar stirred until clear
        difficulty: 1
        hints:
        - A solution is the same all through and clear.
        - Which mixture does not settle or separate?
        solution: 'Step 1: Sand and chalk settle. Step 2: Oil and water separate. Step 3: Clear sugared lemon juice is uniform: a solution.'
        mistakes:
          Chalk in water: suspension_settles
      - prompt: Oil paint stains are cleaned with turpentine, not water. Here, what is the solvent?
        options:
        - Turpentine
        - Water
        - Oil paint
        - Soap
        answer: Turpentine
        difficulty: 2
        hints:
        - Oil paint does not dissolve in water.
        - Which liquid dissolves the paint?
        solution: 'Step 1: The paint is the solute. Step 2: It dissolves in turpentine. Step 3: Turpentine is the solvent.'
        mistakes:
          Water: universal_not_all
      - prompt: A 300 g sugar solution contains 270 g of water. How many grams of sugar does it contain?
        answer: '30'
        check: 300-270
        difficulty: 2
        hints:
        - Solution = solute + solvent.
        - Subtract the water from the total.
        solution: 'Step 1: Solution = 300 g. Step 2: Water = 270 g. Step 3: Sugar = 300 − 270 = 30 g.'
        mistakes:
          '570': solution_minus_solute

  - code: chem9.solutions.concentration
    title: Concentration
    after: [chem9.solutions.parts]
    notes: |
      Concentration is the amount of solute in a given amount of solution. Mass percentage = mass of
      solute ÷ mass of solution × 100. Mass by volume: grams of solute per litre (g/L). A dilute
      solution has little solute; a concentrated one has a lot. Adding solvent dilutes a solution:
      the mass of solute stays the same.
    explanations:
      text: "20 g of sugar in 80 g of water makes 100 g of solution, of which 20 g is sugar: 20% by mass. Add another 100 g of water and the sugar is still 20 g, but now in 200 g: only 10%."
      visual: "Picture a 100-bead necklace with 20 red beads (solute) and 80 white (solvent): 20% red. Add 100 more white beads: still 20 red, now out of 200, 10%."
      step_by_step: "Mass % of 15 g salt in 135 g water: Step 1: Solution = 15 + 135 = 150 g. Step 2: 15 ÷ 150 = 0.1. Step 3: × 100 = 10%."
      real_world: "Saline drips in hospitals are about 0.9% salt; too strong or too weak would harm blood cells."
    activity:
      type: formula
      prompt: Mass percentage = solute mass ÷ solution mass × 100.
      inputs:
      - name: s
        label: Solute
        min: 0
        max: 50
        step: 5
        start: 0
        unit: g
      - name: w
        label: Water
        min: 50
        max: 300
        step: 5
        start: 100
        unit: g
      outputs:
      - name: m
        label: Solution mass
        expr: s+w
        unit: g
      - name: c
        label: Concentration
        expr: 100*s/(s+w)
        unit: '%'
        places: 1
      goals:
      - prompt: Make a 20% solution with 25 g of salt.
        want:
          c: 20
          s: 25
        mistakes:
        - when:
            s: 25
            w: 125
          say: '25 g in 125 g of water makes 150 g of solution: about 17%. The percentage is out of the whole solution, salt and water together.'
      - prompt: Make a 10% solution weighing 200 g.
        want:
          c: 10
          m: 200
        mistakes:
        - when:
            s: 20
            w: 200
          say: '20 g in 200 g of water makes 220 g of solution: about 9.1%. The 200 g is the whole solution, salt and water together.'
    lesson:
      - teach: Two glasses of lemonade can be weak or strong. Concentration tells how much solute is in a given amount of solution. A dilute solution has little solute; a concentrated one has a lot.
        check:
          prompt: 'Which is more concentrated: 5 g of sugar in 100 g of water, or 20 g of sugar in 100 g of water?'
          options:
          - 20 g in 100 g
          - 5 g in 100 g
          - Both the same
          answer: 20 g in 100 g
          why: More solute in the same amount of water.
        ways:
        - style: real_world
          teach: 'Lime juice with a lot of sugar in it is ''strong'' and sweet; with a little sugar it is ''weak''. Concentration tells how much solute is packed into an amount of solution. A little solute: dilute. A lot: concentrated.'
      - teach: 'Mass percentage = mass of solute ÷ mass of solution × 100. Use the whole solution, not just the water. 10 g of salt in 40 g of water: solution = 50 g, so 10 ÷ 50 × 100 = 20%.'
        picture:
          kind: flow
          steps:
          - Mass of solute
          - ÷ mass of solution (solute + solvent)
          - × 100
          - Mass percentage
          alt: Mass percentage is solute divided by the whole solution, times 100.
        check:
          prompt: 5 g of salt is dissolved in 45 g of water. What is the mass percentage?
          options:
          - 10%
          - 11.1%
          - 5%
          answer: 10%
          why: Solution = 50 g; 5 ÷ 50 × 100 = 10%.
        ways:
        - style: step_by_step
          teach: 'Step 1: find the mass of the solution: solute + solvent. Step 2: divide the solute''s mass by the solution''s mass. Step 3: multiply by 100. 10 g salt in 40 g water: 10 ÷ 50 × 100 = 20%.'
      - teach: 'Concentration can also be grams per litre (g/L). 2 g in 250 mL is 8 g in 1000 mL: 8 g/L. When you add water, the solute stays the same; only the total grows, so the concentration falls.'
        check:
          prompt: Water is added to a salt solution. What stays the same?
          options:
          - The mass of salt
          - The concentration
          - The mass of the solution
          answer: The mass of salt
          why: Diluting adds only solvent; the salt is unchanged.
        ways:
        - style: real_world
          teach: When you add water to squash, the amount of squash in the glass doesn't change, but it is spread through more liquid, so it tastes weaker. Diluting keeps the solute the same and lowers the concentration. In g/L, scale the amount up to 1000 mL.
    items:
      - prompt: "20 g of sugar is dissolved in 80 g of water. What is the mass percentage of sugar?"
        answer: "20"
        check: "20/(20 + 80)*100"
        difficulty: 1
        hints: ["Solution mass = 100 g."]
        solution: "20 ÷ 100 × 100 = 20%"
        mistakes: {"25": mass_of_solution}
      - prompt: "15 g of salt is dissolved in 135 g of water. What is the mass percentage of salt?"
        answer: "10"
        check: "15/(15 + 135)*100"
        difficulty: 2
        hints: ["Solution = 150 g."]
        solution: "15 ÷ 150 × 100 = 10%"
        mistakes: {"100/9": mass_of_solution, "1/10": percent_times_100}
      - prompt: "How many grams of salt are in 200 g of a 5% salt solution?"
        answer: "10"
        check: "Rational(5, 100)*200"
        difficulty: 2
        hints: ["5% of 200."]
        solution: "5/100 × 200 = 10 g"
        mistakes: {"1000": percent_times_100}
      - prompt: "4 g of glucose is dissolved to make 500 mL of solution. What is its concentration, in g/L?"
        answer: "8"
        check: "4/Rational(500, 1000)"
        difficulty: 2
        hints: ["500 mL = 0.5 L."]
        solution: "4 ÷ 0.5 = 8 g/L"
        mistakes: {"2": solubility_per_100g}
      - prompt: "Which solution is more concentrated?"
        options: ["10 g of salt in 50 g of water", "10 g of salt in 100 g of water", "5 g of salt in 100 g of water", "They are all equal"]
        answer: "10 g of salt in 50 g of water"
        difficulty: 1
        hints: ["Most solute for the least water."]
        solution: "10 g in 50 g of water has the most salt per gram of water."
        mistakes: {"10 g of salt in 100 g of water": "concentration_ratio", "They are all equal": "concentration_ratio"}
      - prompt: "100 g of a 20% sugar solution is diluted by adding 100 g of water. What is the new mass percentage?"
        answer: "10"
        check: "20/(100 + 100)*100"
        difficulty: 3
        hints: ["The sugar is still 20 g.", "The solution is now 200 g."]
        solution: "20 g of sugar in 200 g: 20 ÷ 200 × 100 = 10%."
        mistakes: {"20": mass_of_solution}
      - prompt: "How many grams of water must be added to 50 g of a 20% salt solution to make it a 10% solution?"
        answer: "50"
        check: "50*0.2/0.1 - 50"
        difficulty: 3
        hints: ["How much salt is in 50 g of 20% solution?", "That salt must be 10% of the new solution."]
        solution: "Step 1: Salt = 20% of 50 = 10 g. Step 2: For 10%, the solution must be 100 g. Step 3: Add 100 − 50 = 50 g of water."
        mistakes: {"100": dilute_target, "25": dilute_target, "10": dilute_target}
      - prompt: "A 250 mL packet of oral rehydration solution contains 5 g of glucose. What is its glucose concentration, in g/L?"
        answer: "20"
        check: "5/0.25"
        difficulty: 2
        hints: ["250 mL is a quarter of a litre.", "How much glucose would 1000 mL have?"]
        solution: "Step 1: 250 mL = 0.25 L. Step 2: 5 ÷ 0.25 = 20 g/L."
        mistakes: {"1.25": solubility_per_100g, "0.02": solubility_per_100g, "50": solubility_per_100g}
      - prompt: "100 g of a 10% sugar solution is mixed with 100 g of a 30% sugar solution. What is the mass percentage of sugar in the mixture?"
        answer: "20"
        check: "(10+30)/200*100"
        difficulty: 3
        hints: ["How many grams of sugar are in each?", "Total sugar ÷ total solution × 100."]
        solution: "Step 1: Sugar = 10 g + 30 g = 40 g. Step 2: Solution = 200 g. Step 3: 40 ÷ 200 × 100 = 20%."
        mistakes: {"40": mix_percent, "0.2": percent_times_100}
      - prompt: 8 g of salt is dissolved in 32 g of water. What is the mass percentage of salt?
        answer: '20'
        check: 8/(8+32)*100
        difficulty: 1
        hints:
        - Find the mass of the whole solution first.
        - Then divide the salt by it and multiply by 100.
        solution: 'Step 1: Solution = 8 + 32 = 40 g. Step 2: 8 ÷ 40 = 0.2. Step 3: × 100 = 20%.'
        mistakes:
          '25': mass_of_solution
          '0.2': percent_times_100
      - prompt: Which solution is the most dilute?
        options:
        - 2 g of sugar in 100 g of water
        - 5 g of sugar in 100 g of water
        - 10 g of sugar in 100 g of water
        - 20 g of sugar in 100 g of water
        answer: 2 g of sugar in 100 g of water
        difficulty: 1
        hints:
        - Dilute means little solute.
        - 'All have the same water: compare the sugar.'
        solution: 'Step 1: Each has 100 g of water. Step 2: The least sugar is 2 g. Step 3: That one is the most dilute.'
        mistakes:
          20 g of sugar in 100 g of water: concentration_ratio
      - prompt: How many grams of sugar are in 400 g of a 15% sugar solution?
        answer: '60'
        check: 400*15/100
        difficulty: 2
        hints:
        - 15% of the solution is sugar.
        - Find 15% of 400.
        solution: 'Step 1: Sugar = 15% of 400 g. Step 2: 400 × 15 ÷ 100. Step 3: = 60 g.'
        mistakes:
          '26.67': percent_times_100
      - prompt: 3 g of salt is dissolved to make 200 mL of solution. What is the concentration, in g/L?
        answer: '15'
        check: 3*1000/200
        difficulty: 2
        hints:
        - 1 L = 1000 mL.
        - How much salt would be in 1000 mL?
        solution: 'Step 1: 1000 mL is 5 times 200 mL. Step 2: Salt in 1000 mL = 3 × 5. Step 3: = 15 g/L.'
        mistakes:
          '0.015': solubility_per_100g
          '600': solubility_per_100g
      - prompt: 200 g of a 10% salt solution is diluted by adding 300 g of water. What is the new mass percentage?
        answer: '4'
        check: 200*0.1/(200+300)*100
        difficulty: 3
        hints:
        - 'Find the mass of salt first: it does not change.'
        - Then find the new total mass.
        solution: 'Step 1: Salt = 10% of 200 = 20 g. Step 2: New solution = 500 g. Step 3: 20 ÷ 500 × 100 = 4%.'
        mistakes:
          '10': dilute_target
          '6.67': dilute_target
      - prompt: 200 g of a 5% solution is mixed with 300 g of a 15% solution of the same salt. What is the mass percentage of the mixture?
        answer: '11'
        check: (200*0.05+300*0.15)/500*100
        difficulty: 3
        hints:
        - Find the salt in each solution.
        - Total salt ÷ total solution × 100.
        solution: 'Step 1: Salt = 10 g + 45 g = 55 g. Step 2: Total solution = 500 g. Step 3: 55 ÷ 500 × 100 = 11%.'
        mistakes:
          '10': mix_percent
          '20': mix_percent

  - code: chem9.solutions.solubility
    title: Solubility and saturation
    after: [chem9.solutions.concentration]
    notes: |
      A saturated solution holds the maximum amount of solute that can dissolve at that temperature;
      an unsaturated solution can dissolve more. Solubility is the mass of solute that saturates
      100 g of solvent at a given temperature. The solubility of most solids increases with
      temperature; the solubility of gases decreases with temperature and increases with pressure.
    explanations:
      text: "Keep adding salt to a glass of water and stirring. At some point extra salt just sits at the bottom: the solution is saturated. At 25 °C about 36 g of salt saturates 100 g of water: that is salt's solubility. Warm the water and a little more dissolves."
      visual: "Draw a graph with temperature across and solubility up. Most salts make rising lines; a gas like oxygen makes a falling line."
      step_by_step: "Solubility of a salt is 40 g per 100 g water. How much saturates 250 g of water? Step 1: 250 ÷ 100 = 2.5. Step 2: 40 × 2.5 = 100 g."
      real_world: "Fish in warm ponds can gasp for air on hot days: warm water holds less dissolved oxygen. Soda goes flat faster when warm."
    activity:
      type: formula
      prompt: At 25 °C, 100 g of water can dissolve at most 36 g of salt.
      inputs:
      - name: s
        label: Salt added
        min: 0
        max: 50
        step: 1
        start: 0
        unit: g
      outputs:
      - name: d
        label: Dissolved
        expr: min(s,36)
        unit: g
      - name: u
        label: Left at the bottom
        expr: max(0,s-36)
        unit: g
      goals:
      - prompt: Make a saturated solution with nothing left over.
        want:
          d: 36
          u: 0
        mistakes:
        - when:
            u:
            - 1
            - 14
          say: 'Some salt is lying at the bottom: you added more than 100 g of water can dissolve. It is saturated, but with extra left over.'
        - when:
            d:
            - 1
            - 35
          say: 'All of it dissolved, and more still could. That''s unsaturated: the water hasn''t taken all it can.'
      - prompt: Make an unsaturated solution.
        want:
          d:
          - 1
          - 35
        mistakes:
        - when:
            d: 36
          say: 'That''s as much as the water can hold: saturated. Unsaturated means it could still dissolve more.'
    lesson:
      - teach: 'Keep adding salt to a glass of water and stirring. At first it all dissolves: the solution is unsaturated. Soon, extra salt stays at the bottom. Now the solution is saturated: it holds the most it can at that temperature.'
        check:
          prompt: 'You add a crystal of sugar to a solution and it dissolves. The solution was:'
          options:
          - Unsaturated
          - Saturated
          - A suspension
          answer: Unsaturated
          why: It could still dissolve more, so it was not yet saturated.
        ways:
        - style: step_by_step
          teach: 'Step 1: add a spoon of salt to water and stir: it dissolves, so the solution can still take more (unsaturated). Step 2: keep adding. Step 3: when some stays on the bottom however much you stir, the solution is saturated: full at that temperature.'
      - teach: Solubility is the mass of solute that saturates 100 g of solvent at a given temperature. If 36 g of salt saturates 100 g of water at 20 °C, then 200 g of water holds 72 g, and 50 g of water holds 18 g.
        check:
          prompt: Solubility is 30 g per 100 g of water. How much saturates 300 g of water?
          options:
          - 90 g
          - 30 g
          - 10 g
          answer: 90 g
          why: 300 g is 3 × 100 g, so 3 × 30 = 90 g.
        ways:
        - style: step_by_step
          teach: 'Step 1: solubility is given for 100 g of water. Step 2: divide your mass of water by 100. Step 3: multiply the solubility by that number. 300 g water: 3 × the solubility.'
      - teach: 'Temperature matters. Most solids dissolve more in hot water, so a hot saturated solution forms crystals as it cools. Gases do the opposite: they dissolve less when warm. That''s why a warm soda goes flat and fish struggle in warm ponds. Higher pressure makes gases dissolve more.'
        picture:
          kind: compare
          columns:
          - title: Solids in water
            points:
            - more soluble when hot
            - crystals form on cooling
          - title: Gases in water
            points:
            - less soluble when hot
            - more soluble at high pressure
          alt: Heating helps solids dissolve but drives gases out.
        check:
          prompt: Why does a cold soda keep its fizz longer than a warm one?
          options:
          - Gases dissolve better in cold liquid
          - Cold soda has more sugar
          - Warm soda has more gas
          answer: Gases dissolve better in cold liquid
          why: Gas solubility falls as temperature rises.
        ways:
        - style: real_world
          teach: 'Sugar dissolves much better in hot tea than in cold juice: most solids dissolve more when hot. Gases are the other way round: a warm soda loses its fizz fast, and warm ponds hold less oxygen for fish. Sealing a soda bottle under pressure keeps more gas in.'
    items:
      - prompt: "A solution in which no more solute can dissolve at that temperature is called:"
        options: ["Saturated", "Unsaturated", "Dilute", "Colloidal"]
        answer: "Saturated"
        difficulty: 1
        hints: ["It is 'full'."]
        solution: "A saturated solution holds the maximum possible solute."
        mistakes: {"Unsaturated": saturated_meaning}
      - prompt: "The solubility of a salt is 40 g per 100 g of water. How many grams saturate 250 g of water?"
        answer: "100"
        check: "40*250/100"
        difficulty: 2
        hints: ["250 g is 2.5 times 100 g."]
        solution: "40 × 2.5 = 100 g"
        mistakes: {"40": solubility_per_100g}
      - prompt: "What usually happens to the solubility of a solid in water when the water is heated?"
        options: ["It increases", "It decreases", "It stays the same", "It becomes zero"]
        answer: "It increases"
        difficulty: 1
        hints: ["Sugar dissolves better in hot tea."]
        solution: "For most solids, solubility rises with temperature."
        mistakes: {"It decreases": "solids_more_soluble_hot", "It stays the same": "solids_more_soluble_hot"}
      - prompt: "Why do fish find it harder to breathe in warm water?"
        options: ["Gases are less soluble in warm water", "Warm water has more oxygen", "Fish dislike heat", "Water vapour replaces oxygen"]
        answer: "Gases are less soluble in warm water"
        difficulty: 2
        hints: ["How does gas solubility change with temperature?"]
        solution: "Warm water holds less dissolved oxygen."
        mistakes: {"Warm water has more oxygen": "gases_less_soluble_hot", "Fish dislike heat": "gases_less_soluble_hot"}
      - prompt: "At 30 °C, 18 g of a substance saturates 50 g of water. What is its solubility, in g per 100 g of water?"
        answer: "36"
        check: "18*100/50"
        difficulty: 2
        hints: ["Double it for 100 g of water."]
        solution: "18 × 100/50 = 36 g per 100 g of water"
        mistakes: {"18": solubility_per_100g}
      - prompt: "A saturated solution at 60 °C has 110 g of solute in 100 g of water. When it cools to 20 °C, where the solubility is 32 g per 100 g, how many grams of crystals form?"
        answer: "78"
        check: "110 - 32"
        difficulty: 3
        hints: ["Only 32 g can stay dissolved at 20 °C."]
        solution: "110 − 32 = 78 g crystallises out."
        mistakes: {"142": saturated_meaning}
      - prompt: "The solubility of potassium nitrate at 20 °C is 32 g per 100 g of water. 50 g of it is stirred into 100 g of water at 20 °C. What do you get?"
        options: ["A saturated solution with 18 g left undissolved", "An unsaturated solution", "A saturated solution with nothing left over", "A saturated solution with 32 g left undissolved"]
        answer: "A saturated solution with 18 g left undissolved"
        difficulty: 3
        hints: ["How much can 100 g of water hold at 20 °C?", "Compare 50 g with that limit."]
        solution: "Step 1: Only 32 g can dissolve, so the solution is saturated. Step 2: 50 − 32 = 18 g stays undissolved."
        mistakes: {"An unsaturated solution": extra_stays, "A saturated solution with nothing left over": extra_stays, "A saturated solution with 32 g left undissolved": extra_stays}
      - prompt: "How can you tell whether a salt solution is saturated?"
        options: ["Add a little more salt at the same temperature and see if it dissolves", "Heat it and see if it boils", "Check whether it is clear", "Taste whether it is salty"]
        answer: "Add a little more salt at the same temperature and see if it dissolves"
        difficulty: 2
        hints: ["What can a saturated solution NOT do?", "Keep the temperature the same."]
        solution: "Step 1: A saturated solution cannot dissolve any more solute at that temperature. Step 2: If extra salt stays undissolved, the solution is saturated."
        mistakes: {"Heat it and see if it boils": test_saturated, "Check whether it is clear": test_saturated, "Taste whether it is salty": test_saturated}
      - prompt: "At 20 °C the solubility of common salt is 36 g per 100 g of water. What is the least mass of water, in g, that can dissolve 90 g of salt at 20 °C?"
        answer: "250"
        check: "90*100/36"
        difficulty: 2
        hints: ["36 g needs 100 g of water.", "90 g is 2.5 times as much."]
        solution: "Step 1: 90 ÷ 36 = 2.5. Step 2: Water = 2.5 × 100 = 250 g."
        mistakes: {"32.4": solubility_per_100g, "40": solubility_per_100g}
      - prompt: 'A solution that can still dissolve more solute at that temperature is called:'
        options:
        - Unsaturated
        - Saturated
        - Colloidal
        - Concentrated
        answer: Unsaturated
        difficulty: 1
        hints:
        - A saturated solution is full.
        - What is a solution called before it is full?
        solution: 'Step 1: Saturated means no more can dissolve. Step 2: This one can still take more. Step 3: It is unsaturated.'
        mistakes:
          Saturated: saturated_meaning
      - prompt: The solubility of a salt is 25 g per 100 g of water. How many grams of it saturate 40 g of water?
        answer: '10'
        check: 25*40/100
        difficulty: 2
        hints:
        - Solubility is per 100 g of water.
        - Scale it down to 40 g of water.
        solution: 'Step 1: 25 g per 100 g of water. Step 2: 40 g of water is 0.4 of that. Step 3: 25 × 0.4 = 10 g.'
        mistakes:
          '25': solubility_per_100g
          '62.5': solubility_per_100g
      - prompt: Why are bottles of soda filled under high pressure?
        options:
        - More carbon dioxide dissolves at high pressure
        - Pressure makes the drink sweeter
        - Pressure keeps the bottle cold
        - Pressure stops the sugar dissolving
        answer: More carbon dioxide dissolves at high pressure
        difficulty: 2
        hints:
        - The fizz is a gas dissolved in a liquid.
        - How does pressure affect how much gas dissolves?
        solution: 'Step 1: The fizz is CO₂ dissolved in water. Step 2: Gases dissolve more at high pressure. Step 3: So more CO₂ is held until the bottle is opened.'
        mistakes:
          Pressure keeps the bottle cold: gases_less_soluble_hot
      - prompt: Sugar dissolves faster and more in hot tea than in cold tea. What does this show about sugar?
        options:
        - Its solubility increases with temperature
        - Its solubility decreases with temperature
        - It is a gas
        - Tea is not a solvent
        answer: Its solubility increases with temperature
        difficulty: 1
        hints:
        - Sugar is a solid.
        - Does more dissolve when hot or when cold?
        solution: 'Step 1: More sugar dissolves in hot tea. Step 2: So solubility rises with temperature. Step 3: This is true of most solids.'
        mistakes:
          Its solubility decreases with temperature: solids_more_soluble_hot
      - prompt: A salt's solubility is 80 g per 100 g of water at 70 °C and 30 g per 100 g at 20 °C. A saturated solution in 200 g of water at 70 °C is cooled to 20 °C. How many grams of crystals form?
        answer: '100'
        check: 2*(80-30)
        difficulty: 3
        hints:
        - Find how much is dissolved in 200 g of water at each temperature.
        - The difference comes out as crystals.
        solution: 'Step 1: At 70 °C, 200 g water holds 160 g. Step 2: At 20 °C, it holds 60 g. Step 3: Crystals = 160 − 60 = 100 g.'
        mistakes:
          '50': solubility_per_100g
          '160': saturated_meaning
      - prompt: 40 g of a salt is stirred into 100 g of water at 30 °C, where its solubility is 45 g per 100 g. What do you get?
        options:
        - 'An unsaturated solution: all of it dissolves'
        - A saturated solution with 5 g left over
        - A saturated solution with 40 g left over
        - A suspension
        answer: 'An unsaturated solution: all of it dissolves'
        difficulty: 3
        hints:
        - Compare 40 g with the most the water can hold.
        - Is 40 g more or less than 45 g?
        solution: 'Step 1: The water can hold 45 g. Step 2: Only 40 g is added. Step 3: All of it dissolves and 5 g more could still dissolve: unsaturated.'
        mistakes:
          A saturated solution with 5 g left over: extra_stays

  - code: chem9.solutions.mixtures
    title: True solutions, colloids and suspensions
    after: [chem9.solutions.parts]
    notes: |
      True solutions have particles smaller than 1 nm, are transparent and homogeneous, do not
      scatter light, and pass through filter paper (salt water, sugar water). Colloids have particles
      1–100 nm, look uniform but scatter light (Tyndall effect) and do not settle (milk, fog, gel,
      ink). Suspensions have particles larger than 100 nm, are heterogeneous, settle on standing and
      can be filtered (muddy water, chalk in water).
    explanations:
      text: "Shine a torch through salt water: nothing visible. Shine it through milky water: the beam shows as a bright path. Muddy water lets the mud settle to the bottom if you wait. These are a true solution, a colloid and a suspension, and the difference is particle size."
      visual: "Draw three beakers side by side: clear with a torch beam invisible; cloudy-white with the beam showing; muddy with sediment at the bottom."
      step_by_step: "Classify starch in water: Step 1: It looks uniform. Step 2: A torch beam shows clearly: Tyndall effect. Step 3: It does not settle. Step 4: It is a colloid."
      real_world: "Sunbeams through the trees on a misty morning in Munnar show the Tyndall effect: fog is a colloid scattering the light."
    activity:
      type: sort
      prompt: True solution, colloid or suspension?
      bins:
      - True solution
      - Colloid
      - Suspension
      items:
      - label: Salt water
        bin: True solution
        clue: Does anything settle? Can you see the salt?
        why: 'The salt is spread as single particles you can''t see: a true solution.'
      - label: Sugar water
        bin: True solution
        clue: Does anything settle? Can you see the sugar?
        why: 'Invisible, never settles: a true solution.'
      - label: Milk
        bin: Colloid
        clue: It doesn't settle, but can you see through it?
        why: 'Tiny fat drops stay spread out and scatter light: a colloid.'
      - label: Fog
        bin: Colloid
        clue: Does it settle? Does it scatter a torch beam?
        why: 'Tiny water drops stay spread in air and scatter light: a colloid.'
      - label: Muddy water
        bin: Suspension
        why: 'The mud settles if left alone: a suspension.'
        clue: What happens if you leave it for an hour?
      - label: Chalk powder in water
        bin: Suspension
        clue: What happens if you leave it?
        why: 'The chalk settles at the bottom: a suspension.'
    lesson:
      - teach: 'Mixtures differ by the size of their particles. In a true solution (salt water) particles are tiny, under 1 nm: clear and never settling. In a suspension (muddy water) particles are big, over 100 nm: cloudy, and they settle. In between, 1 to 100 nm, is a colloid (milk, ink, fog).'
        picture:
          kind: bars
          bars:
          - label: True solution
            value: 1
          - label: Colloid
            value: 100
          - label: Suspension
            value: 1000
          unit: nm
          alt: 'Particle sizes: true solution below 1 nm, colloid up to 100 nm, suspension above 100 nm.'
        check:
          prompt: Which mixture has the biggest particles?
          options:
          - A suspension
          - A colloid
          - A true solution
          answer: A suspension
          why: Suspension particles are larger than 100 nm.
        ways:
        - style: real_world
          teach: 'Compare three glasses: salt water is clear, and nothing ever settles. Milk looks cloudy, but nothing settles either. Muddy water is cloudy and the mud sinks to the bottom. The difference is particle size: tiny in a solution, middle-sized in a colloid like milk, big in a suspension.'
      - teach: 'Shine a torch beam through each. In a true solution you can''t see the beam. In a colloid the particles scatter light and the beam''s path glows: the Tyndall effect. You see it when sunlight streams through a dusty room or headlights shine in fog.'
        check:
          prompt: 'A torch beam is clearly visible through a liquid. The liquid is probably:'
          options:
          - A colloid
          - A true solution
          - Pure water
          answer: A colloid
          why: Colloid particles scatter light; true solutions don't.
        ways:
        - style: step_by_step
          teach: 'Step 1: shine a torch through the liquid in a dark room. Step 2: if you can''t see the beam''s path, it is a true solution. Step 3: if the path glows, the particles are scattering light: a colloid. This is the Tyndall effect, the same as sunbeams in a dusty room.'
      - teach: Filter paper stops only big particles. Suspensions can be filtered; true solutions and colloids pass through. And only suspensions settle on standing.
        check:
          prompt: Which can be separated with filter paper?
          options:
          - Sand in water
          - Salt in water
          - Milk
          answer: Sand in water
          why: Only suspension particles are big enough to be caught.
        ways:
        - style: step_by_step
          teach: 'Step 1: pour the mixture through filter paper. Step 2: if solid is left on the paper, it was a suspension. Step 3: if everything passes through, it is a solution or a colloid. Step 4: let it stand: only a suspension settles.'
    items:
      - prompt: "Which of these shows the Tyndall effect?"
        options: ["Milk diluted with water", "Salt solution", "Sugar solution", "Copper sulphate solution"]
        answer: "Milk diluted with water"
        difficulty: 1
        hints: ["Which one is a colloid?"]
        solution: "Milk is a colloid, so its particles scatter light."
        mistakes: {"Salt solution": tyndall_true_solution, "Sugar solution": tyndall_true_solution}
      - prompt: "Which mixture will settle if left to stand?"
        options: ["Muddy water", "Salt water", "Milk", "Air"]
        answer: "Muddy water"
        difficulty: 1
        hints: ["Large particles."]
        solution: "Muddy water is a suspension; its particles are large and settle."
        mistakes: {"Salt water": "suspension_settles", "Milk": "suspension_settles"}
      - prompt: "Particles of a colloid have a size of about:"
        options: ["1 to 100 nm", "Less than 1 nm", "More than 100 nm", "More than 1 mm"]
        answer: "1 to 100 nm"
        difficulty: 2
        hints: ["Between a true solution and a suspension."]
        solution: "True solutions < 1 nm, colloids 1–100 nm, suspensions > 100 nm."
        mistakes: {"Less than 1 nm": particle_size, "More than 100 nm": particle_size}
      - prompt: "Which can be separated by filtering through filter paper?"
        options: ["Chalk powder in water", "Sugar in water", "Salt in water", "Ink"]
        answer: "Chalk powder in water"
        difficulty: 2
        hints: ["Only large particles are caught by filter paper."]
        solution: "Chalk in water is a suspension; filter paper holds back the chalk."
        mistakes: {"Ink": particle_size}
      - prompt: "Fog is a colloid. What is dispersed in what?"
        options: ["Liquid droplets in a gas", "Gas in a liquid", "Solid in a gas", "Liquid in a solid"]
        answer: "Liquid droplets in a gas"
        difficulty: 3
        hints: ["Tiny water droplets in air."]
        solution: "Fog is water droplets dispersed in air: liquid in gas (an aerosol)."
        mistakes: {"Gas in a liquid": "fog_aerosol", "Solid in a gas": "fog_aerosol"}
      - prompt: "A particle is 50 nm across. How many such particles would fit across 1 μm (1000 nm)?"
        answer: "20"
        check: "1000/50"
        difficulty: 2
        hints: ["Divide 1000 by 50."]
        solution: "1000 ÷ 50 = 20 particles"
        mistakes: {"50000": particle_size}
      - prompt: "A light beam shows a clear path through a liquid, and nothing settles even after a day. What kind of mixture is it?"
        options: ["A colloid", "A true solution", "A suspension", "Pure water"]
        answer: "A colloid"
        difficulty: 3
        hints: ["Which mixtures scatter light?", "Which of those don't settle?"]
        solution: "Step 1: Scattering light (Tyndall effect) rules out a true solution. Step 2: Not settling rules out a suspension. So it is a colloid."
        mistakes: {"A true solution": tyndall_true_solution, "A suspension": suspension_settles, "Pure water": colloid_signs}
      - prompt: "Ink, a colloid, is poured through filter paper. What happens?"
        options: ["The coloured liquid passes through", "The colour is left on the paper and clear water passes", "Only water stays on the paper", "The ink separates into layers"]
        answer: "The coloured liquid passes through"
        difficulty: 3
        hints: ["Colloid particles are 1 to 100 nm across.", "Filter paper stops particles bigger than that."]
        solution: "Step 1: Colloid particles are too small for filter paper to catch. Step 2: So the ink passes through, colour and all."
        mistakes: {"The colour is left on the paper and clear water passes": ink_through_paper, "Only water stays on the paper": ink_through_paper, "The ink separates into layers": suspension_settles}
      - prompt: "Starch stirred in hot water, salt in water, and sand in water: which kinds of mixture are these, in that order?"
        options: ["Colloid, true solution, suspension", "True solution, colloid, suspension", "Suspension, true solution, colloid", "Colloid, suspension, true solution"]
        answer: "Colloid, true solution, suspension"
        difficulty: 3
        hints: ["Which one settles?", "Which one is clear and does not scatter light? Which one looks cloudy but does not settle?"]
        solution: "Step 1: Salt dissolves completely: true solution. Step 2: Sand settles: suspension. Step 3: Starch gives a cloudy mixture that scatters light and doesn't settle: colloid."
        mistakes: {"True solution, colloid, suspension": particle_size, "Suspension, true solution, colloid": particle_size, "Colloid, suspension, true solution": particle_size}
      - prompt: Which of these is a colloid?
        options:
        - Milk
        - Salt water
        - Sugar water
        - Muddy water
        answer: Milk
        difficulty: 1
        hints:
        - A colloid looks uniform but scatters light.
        - It does not settle and is not clear.
        solution: 'Step 1: Salt and sugar water are true solutions. Step 2: Muddy water is a suspension. Step 3: Milk is a colloid.'
        mistakes:
          Muddy water: suspension_settles
      - prompt: Particles in a true solution are about what size?
        options:
        - Less than 1 nm
        - 1 to 100 nm
        - More than 100 nm
        - About 1 mm
        answer: Less than 1 nm
        difficulty: 1
        hints:
        - True solutions are perfectly clear.
        - Their particles are the smallest of the three kinds.
        solution: 'Step 1: Suspensions have the biggest particles. Step 2: Colloids are 1–100 nm. Step 3: True solutions are smaller than 1 nm.'
        mistakes:
          1 to 100 nm: particle_size
      - prompt: A torch beam is passed through copper sulphate solution. What do you see?
        options:
        - The beam's path is not visible
        - The beam's path glows
        - The beam turns blue and stops
        - The liquid turns cloudy
        answer: The beam's path is not visible
        difficulty: 2
        hints:
        - Copper sulphate solution is a true solution.
        - Do true solution particles scatter light?
        solution: 'Step 1: It is a true solution. Step 2: Its particles are too small to scatter light. Step 3: The beam''s path cannot be seen.'
        mistakes:
          The beam's path glows: tyndall_true_solution
      - prompt: Mist is a colloid. What is spread through what?
        options:
        - Water droplets through air
        - Air through water
        - Dust through water
        - Salt through air
        answer: Water droplets through air
        difficulty: 2
        hints:
        - Mist is like a thin fog.
        - What tiny things float in the air on a misty morning?
        solution: 'Step 1: Mist is tiny droplets of liquid water. Step 2: They are spread through air, a gas. Step 3: Liquid in gas.'
        mistakes:
          Air through water: fog_aerosol
      - prompt: A liquid is left overnight. In the morning there is a layer at the bottom. What kind of mixture was it?
        options:
        - A suspension
        - A colloid
        - A true solution
        - A pure substance
        answer: A suspension
        difficulty: 2
        hints:
        - Which kind of mixture settles?
        - Settling needs big particles.
        solution: 'Step 1: True solutions and colloids don''t settle. Step 2: Something settled here. Step 3: So it was a suspension.'
        mistakes:
          A colloid: colloid_signs
      - prompt: A particle is 200 nm across. How many such particles would line up across 1 mm (1,000,000 nm)?
        answer: '5000'
        check: 1000000/200
        difficulty: 3
        hints:
        - Divide the length by the size of one particle.
        - Both are in nanometres.
        solution: 'Step 1: 1 mm = 1,000,000 nm. Step 2: 1,000,000 ÷ 200. Step 3: = 5000 particles (these are suspension-sized).'
        mistakes:
          '200000000': particle_size
