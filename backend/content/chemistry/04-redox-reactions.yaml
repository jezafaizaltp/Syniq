# Class 9 Chemistry, chapter 4. Format: content/README.md.
subject: chem
chapter: 4
title: Redox Reactions

tips:
  peroxide: "Hydrogen is +1 here and the total must be 0. Share what is left equally between the two oxygen atoms."
  per_atom_change: "Find the oxidation number of one atom before and after the reaction. The change is the difference for each atom."
  oil_rig: "Remember OIL RIG: Oxidation Is Loss, Reduction Is Gain (of electrons). Then ask whether the substance gains or loses electrons, or loses or gains oxygen."
  oxidation_number_up: "Oxidation increases the oxidation number; reduction decreases it."
  element_zero: "An element on its own (like Cl₂ or Fe) has oxidation number zero. In a compound, use oxygen as −2 and hydrogen as +1 and make the total come out right."
  oxygen_minus_two: "Oxygen is −2 in most compounds, hydrogen +1. The total of all oxidation numbers in a neutral compound is 0."
  ion_total: "In an ion, the oxidation numbers add up to the charge of the ion, not to 0."
  agent_opposite: "The oxidising agent is itself reduced; the reducing agent is itself oxidised."
  forgot_count: "Multiply each oxidation number by how many of that atom there are before adding."
  redox_together: "Electrons lost by one substance must be taken by another, so oxidation and reduction always happen together."

concepts:
  - code: chem9.redox.electrons
    title: Oxidation and reduction
    notes: |
      Oxidation is loss of electrons (also gain of oxygen or loss of hydrogen). Reduction is gain of
      electrons (also loss of oxygen or gain of hydrogen). They always happen together: a redox
      reaction. In 2Na + Cl₂ → 2NaCl, sodium is oxidised (Na → Na⁺ + e⁻) and chlorine is reduced
      (Cl₂ + 2e⁻ → 2Cl⁻).
    explanations:
      text: "When magnesium burns in oxygen, each magnesium atom gives 2 electrons to oxygen. Magnesium has lost electrons: it is oxidised. Oxygen has gained them: it is reduced. One cannot happen without the other, because the electrons have to go somewhere."
      visual: "Draw two people passing a ball. The one who hands it over is oxidised (loses); the one who catches it is reduced (gains). Remember OIL RIG."
      step_by_step: "Zn + Cu²⁺ → Zn²⁺ + Cu: Step 1: Zn becomes Zn²⁺, losing 2 electrons: oxidised. Step 2: Cu²⁺ becomes Cu, gaining 2 electrons: reduced."
      real_world: "Rusting of iron is oxidation: iron loses electrons to oxygen in the presence of water. Painting or oiling iron keeps oxygen and water away."
    activity:
      type: sort
      prompt: Oxidation (losing electrons) or reduction (gaining electrons)?
      bins:
      - Oxidation
      - Reduction
      items:
      - label: Na → Na⁺ + e⁻
        bin: Oxidation
        clue: Which side is the electron (e⁻) on?
        why: 'The electron is given out on the right: sodium loses it, oxidation.'
      - label: Cl₂ + 2e⁻ → 2Cl⁻
        bin: Reduction
        clue: Which side are the electrons on?
        why: 'Electrons are taken in on the left: chlorine gains them, reduction.'
      - label: Fe²⁺ → Fe³⁺ + e⁻
        bin: Oxidation
        clue: Does the charge go up or down? Where is the e⁻?
        why: 'The charge goes up as an electron is lost: oxidation.'
      - label: Cu²⁺ + 2e⁻ → Cu
        bin: Reduction
        clue: Which side are the electrons on?
        why: 'Copper ions take in electrons: reduction.'
      - label: Mg → Mg²⁺ + 2e⁻
        bin: Oxidation
        clue: Which side are the electrons on?
        why: 'Magnesium gives out 2 electrons: oxidation.'
      - label: O₂ + 4e⁻ → 2O²⁻
        bin: Reduction
        clue: Which side are the electrons on?
        why: 'Oxygen takes in electrons: reduction.'
    lesson:
      - teach: 'Earlier, oxidation meant adding oxygen (magnesium burning to MgO) and reduction meant removing it (CuO turned into copper). The electron idea covers more reactions: oxidation is loss of electrons, reduction is gain of electrons. Remember OIL RIG: Oxidation Is Loss, Reduction Is Gain.'
        check:
          prompt: In Fe²⁺ → Fe³⁺ + e⁻, what happens to iron?
          options:
          - It is oxidised
          - It is reduced
          - Nothing
          answer: It is oxidised
          why: It loses an electron, and oxidation is loss.
      - teach: 'Electrons can''t just vanish. If one substance loses electrons, another must take them. So oxidation and reduction always happen together: a redox reaction. In 2Na + Cl₂ → 2NaCl, sodium loses electrons (oxidised) and chlorine gains them (reduced).'
        picture:
          kind: flow
          steps:
          - Na loses e⁻ (oxidised)
          - Electron passes across
          - Cl gains e⁻ (reduced)
          - Na⁺ Cl⁻ formed
          alt: 'In forming sodium chloride, sodium loses an electron to chlorine: oxidation and reduction together.'
        check:
          prompt: In Zn + Cu²⁺ → Zn²⁺ + Cu, which is reduced?
          options:
          - Cu²⁺
          - Zn
          - Zn²⁺
          answer: Cu²⁺
          why: Cu²⁺ gains 2 electrons to become Cu, and reduction is gain.
      - teach: The older definitions still fit. Gaining oxygen or losing hydrogen is oxidation. Losing oxygen or gaining hydrogen is reduction. In CuO + H₂ → Cu + H₂O, CuO loses oxygen (reduced) and H₂ gains oxygen (oxidised).
        check:
          prompt: 'When carbon burns to carbon dioxide, carbon is:'
          options:
          - Oxidised
          - Reduced
          - Neither
          answer: Oxidised
          why: It gains oxygen.
    items:
      - prompt: "Oxidation is:"
        options: ["Loss of electrons", "Gain of electrons", "Loss of protons", "Gain of neutrons"]
        answer: "Loss of electrons"
        difficulty: 1
        hints: ["OIL RIG."]
        solution: "Oxidation Is Loss of electrons."
        mistakes: {"Gain of electrons": oil_rig}
      - prompt: "In Na → Na⁺ + e⁻, sodium is:"
        options: ["Oxidised", "Reduced", "Neither", "Both"]
        answer: "Oxidised"
        difficulty: 1
        hints: ["It loses an electron."]
        solution: "Loss of an electron is oxidation."
        mistakes: {"Reduced": oil_rig}
      - prompt: "In CuO + H₂ → Cu + H₂O, what happens to copper oxide?"
        options: ["It is reduced", "It is oxidised", "It is neither", "It is decomposed by heat only"]
        answer: "It is reduced"
        difficulty: 2
        hints: ["It loses oxygen."]
        solution: "CuO loses oxygen to become Cu: reduction. Hydrogen gains oxygen: oxidation."
        mistakes: {"It is oxidised": oil_rig}
      - prompt: "In Cl₂ + 2e⁻ → 2Cl⁻, how many electrons are gained by one chlorine molecule?"
        answer: "2"
        check: "2*1"
        difficulty: 1
        hints: ["Each Cl atom gains 1."]
        solution: "Two Cl atoms each gain 1: 2 electrons."
        mistakes: {"1": "count_atoms"}
      - prompt: "In Zn + Cu²⁺ → Zn²⁺ + Cu, how many electrons does each zinc atom lose?"
        answer: "2"
        check: "2 - 0"
        difficulty: 2
        hints: ["Zn goes from 0 charge to 2+."]
        solution: "Zn → Zn²⁺ + 2e⁻: 2 electrons lost."
        mistakes: {"1": "ion_electrons"}
      - prompt: "Why must oxidation and reduction always happen together?"
        options: ["Electrons lost by one substance must be gained by another", "Oxygen is always present", "Heat is always given out", "Atoms are destroyed"]
        answer: "Electrons lost by one substance must be gained by another"
        difficulty: 3
        hints: ["Where do the lost electrons go?"]
        solution: "Electrons cannot just disappear: whatever loses them (oxidised) gives them to something that gains them (reduced)."

        mistakes: {"Oxygen is always present": "redox_together", "Heat is always given out": "redox_together"}
      - prompt: "In 2Mg + O₂ → 2MgO, how many electrons does one O₂ molecule gain?"
        answer: "4"
        check: "2*2"
        difficulty: 3
        hints: ["Each oxygen atom becomes O²⁻.", "An O₂ molecule has two oxygen atoms."]
        solution: "Step 1: Each O atom gains 2 electrons. Step 2: O₂ gains 2 × 2 = 4 (from two Mg atoms)."
        mistakes: {"2": forgot_count, "1": forgot_count}
      - prompt: "In 2Fe³⁺ + Sn²⁺ → 2Fe²⁺ + Sn⁴⁺, which is oxidised?"
        options: ["Sn²⁺", "Fe³⁺", "Both", "Neither"]
        answer: "Sn²⁺"
        difficulty: 3
        hints: ["Which ion's charge goes up?", "Going up in charge means losing electrons."]
        solution: "Step 1: Sn²⁺ → Sn⁴⁺ loses 2 electrons: oxidised. Step 2: Each Fe³⁺ → Fe²⁺ gains one: reduced."
        mistakes: {"Fe³⁺": oil_rig, "Both": redox_together, "Neither": redox_together}
      - prompt: "In 2H₂S + SO₂ → 3S + 2H₂O, what happens to H₂S?"
        options: ["It is oxidised: it loses hydrogen", "It is reduced: it gains hydrogen", "Neither, because it gains no oxygen", "It is reduced: it loses oxygen"]
        answer: "It is oxidised: it loses hydrogen"
        difficulty: 3
        hints: ["H₂S becomes S. What does it lose?", "Loss of hydrogen is one kind of oxidation."]
        solution: "Step 1: H₂S loses its hydrogen to become S. Step 2: Loss of hydrogen is oxidation (S goes from −2 to 0)."
        mistakes: {"It is reduced: it gains hydrogen": oil_rig, "Neither, because it gains no oxygen": oil_rig, "It is reduced: it loses oxygen": oil_rig}
      - prompt: 'Reduction is:'
        options:
        - Gain of electrons
        - Loss of electrons
        - Gain of oxygen
        - Loss of hydrogen
        answer: Gain of electrons
        difficulty: 1
        hints:
        - Use OIL RIG.
        - What does the R stand with?
        solution: 'Step 1: OIL RIG. Step 2: Reduction Is Gain. Step 3: Reduction is gain of electrons.'
        mistakes:
          Loss of electrons: oil_rig
      - prompt: 'In Mg → Mg²⁺ + 2e⁻, magnesium is:'
        options:
        - Oxidised
        - Reduced
        - Neither oxidised nor reduced
        - Both oxidised and reduced
        answer: Oxidised
        difficulty: 1
        hints:
        - Are electrons gained or lost?
        - Electrons appear on the right-hand side.
        solution: 'Step 1: Magnesium gives out 2 electrons. Step 2: Loss of electrons is oxidation. Step 3: Magnesium is oxidised.'
        mistakes:
          Reduced: oil_rig
      - prompt: In Fe³⁺ + e⁻ → Fe²⁺, how many electrons does each Fe³⁺ ion gain?
        answer: '1'
        check: 3-2
        difficulty: 1
        hints:
        - Compare the charges before and after.
        - The charge goes down by the number of electrons gained.
        solution: 'Step 1: Charge goes from +3 to +2. Step 2: One negative electron was added. Step 3: 1 electron is gained (Fe³⁺ is reduced).'
        mistakes:
          '3': per_atom_change
          '2': per_atom_change
      - prompt: In 2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu, how many electrons in all are passed from aluminium to copper?
        answer: '6'
        check: 2*3
        difficulty: 3
        hints:
        - Each Al atom becomes Al³⁺.
        - How many Al atoms are there?
        solution: 'Step 1: Each Al loses 3 electrons. Step 2: Two Al atoms lose 2 × 3 = 6. Step 3: Three Cu²⁺ ions gain 3 × 2 = 6.'
        mistakes:
          '3': forgot_count
          '2': forgot_count
      - prompt: In ZnO + C → Zn + CO, what happens to carbon?
        options:
        - 'It is oxidised: it gains oxygen'
        - 'It is reduced: it loses oxygen'
        - 'It is reduced: it gains electrons'
        - Nothing happens to it
        answer: 'It is oxidised: it gains oxygen'
        difficulty: 2
        hints:
        - Look at carbon before and after.
        - Has it gained or lost oxygen?
        solution: 'Step 1: Carbon becomes CO. Step 2: It gains oxygen. Step 3: Gain of oxygen is oxidation.'
        mistakes:
          'It is reduced: it loses oxygen': oil_rig
      - prompt: In H₂ + Cl₂ → 2HCl, chlorine gains hydrogen. What happens to chlorine?
        options:
        - It is reduced
        - It is oxidised
        - It is neither oxidised nor reduced
        - It loses electrons
        answer: It is reduced
        difficulty: 2
        hints:
        - Gain of hydrogen is one of the older definitions.
        - Is it the same as gain of oxygen?
        solution: 'Step 1: Chlorine gains hydrogen. Step 2: Gain of hydrogen is reduction. Step 3: Hydrogen, which is joined to chlorine, is oxidised at the same time.'
        mistakes:
          It is oxidised: oil_rig
  - code: chem9.redox.oxidation_number
    title: Oxidation numbers
    after: [chem9.redox.electrons]
    notes: |
      The oxidation number is the charge an atom would have if all its bonds were ionic. Rules: an
      element is 0; a simple ion equals its charge; O is −2 (except in peroxides, −1), H is +1 (with
      non-metals), group 1 metals +1, group 2 +2, F −1; the sum is 0 in a neutral compound and equals
      the charge in an ion. Example: S in H₂SO₄: 2(+1) + x + 4(−2) = 0, so x = +6.
    explanations:
      text: "Oxidation numbers are bookkeeping. In water, oxygen 'owns' the shared electrons, so O is −2 and each H is +1: 2(+1) + (−2) = 0. To find an unknown, set the total to 0 (or to the ion's charge) and solve."
      visual: "Write the formula, put the known numbers above each atom and a box (x) above the unknown. Multiply each by how many atoms there are and make the sum match the overall charge."
      step_by_step: "Mn in KMnO₄: Step 1: K = +1, O = −2. Step 2: +1 + x + 4(−2) = 0. Step 3: x − 7 = 0. Step 4: x = +7."
      real_world: "Purple potassium permanganate (Mn +7) is used to disinfect wells in Kerala. It works because Mn is in a very high oxidation state and readily takes electrons from germs."
    activity:
      type: formula
      prompt: In H₂SO₄, hydrogen is +1 and oxygen is −2. The total must be 0. Find sulphur's oxidation number x.
      inputs:
      - name: x
        label: x (sulphur)
        min: -4
        max: 8
        step: 1
        start: 0
      outputs:
      - name: t
        label: 'Total: 2(+1) + x + 4(−2)'
        expr: 2+x-8
      goals:
      - prompt: Make the total 0.
        want:
          t: 0
        mistakes:
        - when:
            x: 2
          say: '+2 leaves the total at −4: the four oxygens give −8, the hydrogens only +2.'
        - when:
            x: -2
          say: −2 is oxygen's number. Sulphur here has to balance the four oxygens.
    lesson:
      - teach: 'An oxidation number is the charge an atom would have if every bond were ionic. It lets us track electrons in any compound. Simple rules: an element on its own is 0 (O₂, Fe). A simple ion is its charge (Na⁺ is +1, Cl⁻ is −1).'
        check:
          prompt: What is the oxidation number of iron in a piece of pure iron?
          options:
          - '0'
          - '+2'
          - '+3'
          answer: '0'
          why: An element on its own always has oxidation number 0.
      - teach: 'More rules: oxygen is −2 (except in peroxides, −1), hydrogen is +1 with non-metals, group 1 metals are +1, group 2 are +2. In a neutral compound all the oxidation numbers add up to 0. In SO₂: x + 2(−2) = 0, so S is +4.'
        check:
          prompt: What is the oxidation number of carbon in CO?
          options:
          - '+2'
          - −2
          - '0'
          answer: '+2'
          why: x + (−2) = 0, so x = +2.
      - teach: 'Don''t forget to multiply by the number of each atom. In H₂SO₄: 2(+1) + x + 4(−2) = 0, so x = +6. In an ion, the numbers add up to the ion''s charge. In NO₃⁻: x + 3(−2) = −1, so N is +5.'
        picture:
          kind: flow
          steps:
          - Write x for the unknown atom
          - Multiply each known number by its count
          - Set the total = 0 (or the ion's charge)
          - Solve for x
          alt: 'Steps to find an oxidation number: write x, multiply known numbers by their counts, set the total, solve.'
        check:
          prompt: What is the oxidation number of sulphur in SO₄²⁻?
          options:
          - '+6'
          - '+8'
          - '+4'
          answer: '+6'
          why: x + 4(−2) = −2, so x = +6.
    items:
      - prompt: "What is the oxidation number of oxygen in O₂?"
        answer: "0"
        check: "0"
        difficulty: 1
        hints: ["An uncombined element."]
        solution: "Elements on their own have oxidation number 0."
        mistakes: {"-2": element_zero}
      - prompt: "What is the oxidation number of sulphur in H₂SO₄?"
        answer: "6"
        check: "solve(Eq(2*1 + x + 4*(-2), 0), x)[0]"
        difficulty: 2
        hints: ["2(+1) + x + 4(−2) = 0."]
        solution: "2 + x − 8 = 0, so x = +6."
        mistakes: {"0": element_zero, "-2": forgot_count}
      - prompt: "What is the oxidation number of manganese in KMnO₄?"
        answer: "7"
        check: "solve(Eq(1 + x + 4*(-2), 0), x)[0]"
        difficulty: 2
        hints: ["+1 + x + 4(−2) = 0."]
        solution: "1 + x − 8 = 0, so x = +7."
        mistakes: {"1": forgot_count}
      - prompt: "What is the oxidation number of nitrogen in NH₃?"
        answer: "-3"
        check: "solve(Eq(x + 3*1, 0), x)[0]"
        difficulty: 1
        hints: ["Each H is +1."]
        solution: "x + 3 = 0, so x = −3."
        mistakes: {"3": oxygen_minus_two, "-1": forgot_count}
      - prompt: "What is the oxidation number of carbon in CO₂?"
        answer: "4"
        check: "solve(Eq(x + 2*(-2), 0), x)[0]"
        difficulty: 1
        hints: ["Each O is −2."]
        solution: "x − 4 = 0, so x = +4."
        mistakes: {"2": forgot_count}
      - prompt: "What is the oxidation number of chromium in the dichromate ion Cr₂O₇²⁻?"
        answer: "6"
        check: "solve(Eq(2*x + 7*(-2), -2), x)[0]"
        difficulty: 3
        hints: ["The total is −2, not 0.", "2x − 14 = −2."]
        solution: "2x + 7(−2) = −2, so 2x = 12 and x = +6."
        mistakes: {"7": ion_total, "12": forgot_count}
      - prompt: "What is the oxidation number of nitrogen in nitric acid, HNO₃?"
        answer: "5"
        check: "0 - 1 - 3*(-2)"
        difficulty: 2
        hints: ["H is +1 and each O is −2.", "1 + x + 3(−2) = 0."]
        solution: "Step 1: 1 + x − 6 = 0. Step 2: x = +5."
        mistakes: {"-5": oxygen_minus_two, "1": forgot_count, "7": forgot_count}
      - prompt: "What is the oxidation number of oxygen in hydrogen peroxide, H₂O₂?"
        answer: "-1"
        check: "-2*1/2"
        difficulty: 3
        hints: ["Each H is +1.", "2(+1) + 2x = 0."]
        solution: "Step 1: 2 + 2x = 0. Step 2: x = −1. (Peroxides are the exception to O = −2.)"
        mistakes: {"-2": peroxide, "-4": peroxide, "1": peroxide}
      - prompt: "What is the oxidation number of sulphur in the thiosulphate ion, S₂O₃²⁻?"
        answer: "2"
        check: "(-2 + 6)/2"
        difficulty: 3
        hints: ["The total must equal the ion's charge, −2.", "2x + 3(−2) = −2."]
        solution: "Step 1: 2x − 6 = −2. Step 2: 2x = 4, so x = +2."
        mistakes: {"3": ion_total, "4": forgot_count, "8": ion_total}
      - prompt: What is the oxidation number of chlorine in Cl₂?
        answer: '0'
        check: '0'
        difficulty: 1
        hints:
        - Cl₂ is an element, not a compound.
        - What is the rule for elements?
        solution: 'Step 1: Cl₂ contains only chlorine. Step 2: Elements have oxidation number 0. Step 3: Cl in Cl₂ is 0.'
        mistakes:
          '-1': element_zero
      - prompt: What is the oxidation number of sulphur in SO₂?
        answer: '4'
        check: 2*2
        difficulty: 1
        hints:
        - Oxygen is −2 and the total is 0.
        - x + 2(−2) = 0.
        solution: 'Step 1: x + 2(−2) = 0. Step 2: x − 4 = 0. Step 3: x = +4.'
        mistakes:
          '2': forgot_count
          '-4': oxygen_minus_two
      - prompt: What is the oxidation number of iron in Fe₂O₃?
        answer: '3'
        check: 3*2/2
        difficulty: 2
        hints:
        - There are 2 iron atoms and 3 oxygen atoms.
        - 2x + 3(−2) = 0.
        solution: 'Step 1: 2x + 3(−2) = 0. Step 2: 2x = 6. Step 3: x = +3.'
        mistakes:
          '6': forgot_count
          '2': forgot_count
      - prompt: What is the oxidation number of phosphorus in H₃PO₄?
        answer: '5'
        check: 4*2-3
        difficulty: 2
        hints:
        - H is +1 and O is −2.
        - 3(+1) + x + 4(−2) = 0.
        solution: 'Step 1: 3 + x − 8 = 0. Step 2: x − 5 = 0. Step 3: x = +5.'
        mistakes:
          '3': oxygen_minus_two
          '-5': oxygen_minus_two
      - prompt: What is the oxidation number of nitrogen in the ammonium ion, NH₄⁺?
        answer: '-3'
        check: 1-4
        difficulty: 3
        hints:
        - H is +1.
        - In an ion, the total equals the ion's charge, +1.
        solution: 'Step 1: x + 4(+1) = +1. Step 2: x = 1 − 4. Step 3: x = −3.'
        mistakes:
          '-4': ion_total
          '3': ion_total
      - prompt: What is the oxidation number of manganese in MnO₂?
        answer: '4'
        check: 2*2
        difficulty: 2
        hints:
        - Oxygen is −2.
        - x + 2(−2) = 0.
        solution: 'Step 1: x + 2(−2) = 0. Step 2: x − 4 = 0. Step 3: x = +4.'
        mistakes:
          '2': forgot_count

  - code: chem9.redox.agents
    title: Oxidising and reducing agents
    after: [chem9.redox.oxidation_number]
    notes: |
      In a redox reaction, the substance whose oxidation number increases is oxidised and is the
      reducing agent; the substance whose oxidation number decreases is reduced and is the oxidising
      agent. Example: Fe₂O₃ + 3CO → 2Fe + 3CO₂: Fe goes +3 → 0 (reduced, Fe₂O₃ is the oxidising
      agent); C goes +2 → +4 (oxidised, CO is the reducing agent).
    explanations:
      text: "An oxidising agent oxidises something else by taking its electrons, so the agent itself is reduced. A reducing agent gives electrons away, so it is itself oxidised. In a blast furnace, carbon monoxide takes oxygen from iron oxide: CO is the reducing agent, iron oxide the oxidising agent."
      visual: "Draw two arrows on the equation: one from the atom whose number goes up ('oxidised: reducing agent') and one from the atom whose number goes down ('reduced: oxidising agent')."
      step_by_step: "CuO + H₂ → Cu + H₂O: Step 1: Cu: +2 → 0, reduced, so CuO is the oxidising agent. Step 2: H: 0 → +1, oxidised, so H₂ is the reducing agent."
      real_world: "Bleach and hydrogen peroxide are oxidising agents that remove stains and kill germs by taking electrons from coloured or living molecules."
    activity:
      type: sort
      prompt: Is it the oxidising agent or the reducing agent?
      bins:
      - Oxidising agent
      - Reducing agent
      items:
      - label: Zn in Zn + CuSO₄ → ZnSO₄ + Cu
        bin: Reducing agent
        why: 'Zinc gives electrons to copper ions, so it reduces them: the reducing agent.'
        clue: Does zinc give electrons away or take them?
      - label: Cu²⁺ in Zn + CuSO₄ → ZnSO₄ + Cu
        bin: Oxidising agent
        clue: Do copper ions give electrons or take them?
        why: 'Copper ions take electrons from zinc, oxidising it: the oxidising agent.'
      - label: H₂ in CuO + H₂ → Cu + H₂O
        bin: Reducing agent
        clue: Does hydrogen take oxygen or give oxygen?
        why: 'Hydrogen takes the oxygen away from copper oxide, reducing it: the reducing agent.'
      - label: CuO in CuO + H₂ → Cu + H₂O
        bin: Oxidising agent
        clue: Does copper oxide give oxygen away or take it?
        why: 'It gives its oxygen to hydrogen, oxidising it: the oxidising agent.'
    lesson:
      - teach: Oxidation numbers make redox easy to spot. If an atom's oxidation number goes up, it is oxidised. If it goes down, it is reduced. In Zn + Cu²⁺ → Zn²⁺ + Cu, zinc goes 0 → +2 (oxidised), copper goes +2 → 0 (reduced).
        check:
          prompt: 'An atom''s oxidation number changes from +2 to +4. It has been:'
          options:
          - Oxidised
          - Reduced
          - Neither
          answer: Oxidised
          why: An increase in oxidation number means oxidation.
      - teach: The substance that causes another to be oxidised is the oxidising agent. It takes the electrons, so it is itself reduced. The reducing agent gives the electrons, so it is itself oxidised. Each agent does to the other the opposite of what happens to itself.
        picture:
          kind: compare
          columns:
          - title: Oxidising agent
            points:
            - takes electrons
            - is itself reduced
            - its oxidation number goes down
          - title: Reducing agent
            points:
            - gives electrons
            - is itself oxidised
            - its oxidation number goes up
          alt: The oxidising agent is reduced; the reducing agent is oxidised.
        check:
          prompt: In Zn + Cu²⁺ → Zn²⁺ + Cu, what is the reducing agent?
          options:
          - Zn
          - Cu²⁺
          - Cu
          answer: Zn
          why: Zinc gives electrons to Cu²⁺ and is itself oxidised.
      - teach: In industry, carbon and carbon monoxide are used as reducing agents to get metals from their oxides. In a blast furnace, CO reduces Fe₂O₃ to iron and is oxidised to CO₂. Common oxidising agents in the lab include oxygen, chlorine and potassium permanganate.
        check:
          prompt: In ZnO + C → Zn + CO, which is the oxidising agent?
          options:
          - ZnO
          - C
          - CO
          answer: ZnO
          why: Zinc goes +2 → 0 (reduced), so ZnO is the oxidising agent.
    items:
