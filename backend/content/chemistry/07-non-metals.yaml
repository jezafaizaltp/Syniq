# Class 9 Chemistry, chapter 7. Format: content/README.md.
# Also uses tips from earlier chapters: oxygen_minus_two, forgot_count.
subject: chem
chapter: 7
title: Non-Metals

tips:
  acid_oxide_clue: "Shiny, bendable elements are ruled out by 'dull and brittle'. Then ask which kind of element gives an oxide that turns blue litmus red."
  nonmetal_clues: "Check every clue: dull, brittle, no conduction and an acidic oxide. One choice is a metal, and one is a non-metal that conducts."
  giant_network: "Most non-metals melt easily. One form of carbon is held together by a giant network of strong bonds."
  ozone_shield: "High up, ozone stops a kind of sunlight that harms skin and eyes. Which kind?"
  plant_nutrient: "Plants need certain elements to make proteins. Which element does ammonia bring?"
  hydrogen_test: "Hydrogen burns with a 'pop' sound when a lit splint is brought near. A glowing splint relighting is the test for oxygen."
  oxygen_test: "Oxygen relights a glowing splint. It supports burning but does not burn itself."
  ozone_formula: "Ozone is O₃: three oxygen atoms. Ordinary oxygen gas is O₂."
  ammonia_basic: "First decide: when ammonia dissolves in water, does it make an acid or a base? Then recall which colour change litmus paper shows for that kind of substance."
  haber_conditions: "The Haber process uses a cheap metal catalyst that is also the main metal in steel. Nickel is used for hydrogenating oils instead."
  mole_ratio: "Use the numbers in front of each formula in the balanced equation."
  nonmetal_properties: "Compare with metals: metals are shiny, bendable, conduct and form basic oxides. Non-metals usually do the opposite, with one well-known form of carbon as an exception for conducting."
  air_nitrogen_78: "Oxygen is only about a fifth of air. Nitrogen makes up most of the rest: roughly four-fifths."
  bromine_liquid: "Most non-metals at room temperature are gases or solids. Only one is a red-brown liquid, in group 17, between chlorine and iodine."
  cfc_ozone: "CFCs from old fridges and sprays break down ozone. Oxygen and nitrogen don't harm it."
  graphite_conducts: "Diamond is the hardest natural substance. Graphite is soft and, unusually for a non-metal, conducts electricity."
  hydrogenation: "The process is named after what is added: adding oxygen is oxidation, so adding hydrogen to oils is named after hydrogen."
  triple_bond_n2: "Nitrogen isn't a noble gas. Its two atoms share a very strong triple bond, which is hard to break."

concepts:
  - code: chem9.nonmetals.properties
    title: Properties of non-metals
    notes: |
      Non-metals are mostly gases or brittle solids (bromine is a liquid). They are usually dull, poor
      conductors of heat and electricity (graphite is an exception), not malleable or ductile, and
      have low melting points (diamond is an exception). They tend to gain or share electrons and
      their oxides are acidic (CO₂, SO₂). They are found on the right of the periodic table.
    explanations:
      text: "Sulphur is a yellow powder that crumbles when you hit it; it doesn't conduct electricity. Oxygen and nitrogen are gases. Unlike metals, non-metals tend to take or share electrons, and their oxides dissolve in water to make acids: sulphur dioxide makes acid rain."
      visual: "Make a two-column table: Metals (shiny, bendable, conduct, basic oxides) and Non-metals (dull, brittle, don't conduct, acidic oxides). Put carbon in the non-metal column with a star: graphite conducts."
      step_by_step: "Is element X a metal or non-metal? It is brittle, dull and its oxide turns blue litmus red. Step 1: Brittle and dull: non-metal-like. Step 2: Acidic oxide: non-metal. Step 3: X is a non-metal."
      real_world: "Pencil 'lead' is graphite, a form of carbon that conducts electricity: an unusual non-metal used in batteries and electrodes."
    activity:
      type: sort
      prompt: Metal or non-metal?
      bins:
      - Metal
      - Non-metal
      items:
      - label: Iron
        bin: Metal
        clue: Does it shine, bend and carry electricity?
        why: 'Shiny, bendable, conducts: a metal.'
      - label: Copper
        bin: Metal
        clue: Is it used in electric wires? Why?
        why: 'It conducts electricity and bends: a metal.'
      - label: Sulphur
        bin: Non-metal
        clue: Does it shine or carry electricity? Is it brittle?
        why: 'Dull yellow, brittle, doesn''t conduct: a non-metal.'
      - label: Carbon (coal)
        bin: Non-metal
        clue: Does it shine or bend?
        why: 'Dull and brittle: a non-metal (graphite is the odd one out that conducts).'
      - label: Oxygen
        bin: Non-metal
        clue: It's a gas. Are metals usually gases?
        why: 'A gas that doesn''t conduct: a non-metal.'
      - label: Aluminium
        bin: Metal
        clue: Does it shine and bend? Is it used in foil?
        why: 'Shiny, bendable, conducts: a metal.'
      - label: Iodine
        bin: Non-metal
        why: 'Shiny, but brittle and a poor conductor: a non-metal.'
        clue: It's shiny, but does it bend or conduct?
    items:
      - prompt: "Which non-metal is a liquid at room temperature?"
        options: ["Bromine", "Chlorine", "Sulphur", "Iodine"]
        answer: "Bromine"
        difficulty: 1
        hints: ["A reddish-brown liquid in group 17."]
        solution: "Bromine is the only non-metal that is liquid at room temperature."
        mistakes: {"Chlorine": "bromine_liquid", "Iodine": "bromine_liquid"}
      - prompt: "Which non-metal conducts electricity?"
        options: ["Graphite", "Sulphur", "Phosphorus", "Iodine"]
        answer: "Graphite"
        difficulty: 1
        hints: ["Used in pencils and battery electrodes."]
        solution: "Graphite (a form of carbon) conducts electricity."
        mistakes: {"Sulphur": nonmetal_properties}
      - prompt: "The oxides of non-metals are usually:"
        options: ["Acidic", "Basic", "Neutral salts", "Metallic"]
        answer: "Acidic"
        difficulty: 2
        hints: ["Think of CO₂ in soda water, or SO₂ in acid rain."]
        solution: "Non-metal oxides like CO₂ and SO₂ form acids with water."
        mistakes: {"Basic": nonmetal_properties}
      - prompt: "Which property is typical of non-metals?"
        options: ["Brittle as solids", "Shiny lustre", "Malleable", "Good conductor of heat"]
        answer: "Brittle as solids"
        difficulty: 1
        hints: ["Sulphur crumbles when hit."]
        solution: "Solid non-metals are brittle; the others are properties of metals."
        mistakes: {"Malleable": nonmetal_properties}
      - prompt: "Sulphur burns to form SO₂. What is the oxidation number of sulphur in SO₂?"
        answer: "4"
        check: "solve(Eq(x + 2*(-2), 0), x)[0]"
        difficulty: 2
        hints: ["Each O is −2."]
        solution: "x − 4 = 0, so S is +4."
        mistakes: {"2": forgot_count}
      - prompt: "Diamond and graphite are both pure carbon. Which statement is true?"
        options: ["Diamond is very hard; graphite is soft and conducts electricity", "Both conduct electricity", "Both are soft", "Graphite is harder than diamond"]
        answer: "Diamond is very hard; graphite is soft and conducts electricity"
        difficulty: 3
        hints: ["Same atoms, different arrangements (allotropes)."]
        solution: "In diamond each carbon is bonded to 4 others in a rigid network; graphite has layers that slide and free electrons that conduct."

        mistakes: {"Both conduct electricity": "graphite_conducts", "Graphite is harder than diamond": "graphite_conducts"}
      - prompt: "An element is a dull, brittle yellow solid that does not conduct electricity. Its oxide turns blue litmus red. What is it most likely to be?"
        options: ["Sulphur", "Copper", "Magnesium", "Graphite"]
        answer: "Sulphur"
        difficulty: 2
        hints: ["Which choices are metals?", "Which non-metal conducts electricity?"]
        solution: "Step 1: Dull, brittle, non-conducting and an acidic oxide all point to a non-metal. Step 2: Graphite conducts, so it is sulphur."
        mistakes: {"Copper": nonmetal_clues, "Magnesium": nonmetal_clues, "Graphite": graphite_conducts}
      - prompt: "What is the oxidation number of phosphorus in P₂O₅?"
        answer: "5"
        check: "5*2/2"
        difficulty: 2
        hints: ["Five oxygens at −2 make −10.", "Two phosphorus atoms must make +10."]
        solution: "Step 1: 2x + 5(−2) = 0. Step 2: x = +5."
        mistakes: {"10": forgot_count, "-5": oxygen_minus_two, "2": forgot_count}
      - prompt: "Which of these non-metals has a very high melting point?"
        options: ["Diamond", "Sulphur", "Iodine", "Phosphorus"]
        answer: "Diamond"
        difficulty: 2
        hints: ["Most non-metals melt easily.", "Which one is the hardest natural substance?"]
        solution: "Step 1: Sulphur, iodine and phosphorus melt at low temperatures. Step 2: Diamond is a giant network of carbon atoms and melts only above 3500 °C."
        mistakes: {"Sulphur": giant_network, "Iodine": giant_network, "Phosphorus": giant_network}
      - prompt: "An unknown element is a dull, brittle solid. Its oxide turns blue litmus red. What is it most likely to be?"
        options:
        - "A non-metal"
        - "A metal"
        - "A noble gas"
        - "An alloy"
        answer: "A non-metal"
        difficulty: 3
        hints: ["Look at each clue: dull, brittle, and what kind of oxide.", "An oxide that turns blue litmus red is acidic. Which elements give acidic oxides?"]
        solution: "Step 1: Dull and brittle are not metal properties. Step 2: Its oxide is acidic (turns blue litmus red). Step 3: Non-metals give acidic oxides, so it is a non-metal."
        mistakes: {"A metal": acid_oxide_clue, "An alloy": acid_oxide_clue}
  - code: chem9.nonmetals.hydrogen_oxygen
    title: Hydrogen, oxygen and ozone
    after: [chem9.nonmetals.properties]
    notes: |
      Hydrogen is made in the lab from zinc and dilute hydrochloric or sulphuric acid
      (Zn + 2HCl → ZnCl₂ + H₂). It is the lightest gas, burns with a pop, and is used in making
      ammonia, hydrogenating oils and as rocket fuel. Oxygen is made by heating potassium
      permanganate or decomposing hydrogen peroxide with MnO₂ (2H₂O₂ → 2H₂O + O₂). It supports
      combustion and relights a glowing splint. Ozone (O₃) in the upper atmosphere absorbs harmful UV;
      CFCs damage the ozone layer.
    explanations:
      text: "Drop zinc granules into dilute acid: bubbles of hydrogen rise. Hold a burning splint near: a squeaky pop. For oxygen, add manganese dioxide to hydrogen peroxide; a glowing splint pushed in bursts back into flame. High up, ozone (O₃) acts as the Earth's sunscreen."
      visual: "Draw two test tubes: one with a lit splint and 'POP!' (hydrogen), one with a glowing splint bursting into flame (oxygen)."
      step_by_step: "How many oxygen molecules come from 4 molecules of H₂O₂? Step 1: 2H₂O₂ → 2H₂O + O₂. Step 2: 2 H₂O₂ give 1 O₂. Step 3: 4 H₂O₂ give 2 O₂."
      real_world: "Hospitals give oxygen to patients who cannot get enough from air. The ozone layer protects us from UV rays that cause skin cancer."
    activity:
      type: sort
      prompt: Hydrogen, oxygen or ozone?
      bins:
      - Hydrogen
      - Oxygen
      - Ozone
      items:
      - label: Burns with a pop
        bin: Hydrogen
        clue: Which gas burns itself?
        why: Hydrogen burns with a pop.
      - label: Helps things burn
        bin: Oxygen
        clue: Which gas does a glowing splint need to relight?
        why: Oxygen helps burning but doesn't burn itself.
      - label: Shields us from ultraviolet rays
        bin: Ozone
        clue: Which gas makes a layer high in the sky?
        why: The ozone layer absorbs ultraviolet rays.
      - label: The lightest gas
        bin: Hydrogen
        clue: Which element has the smallest atoms?
        why: 'Hydrogen: one proton, the lightest.'
      - label: We breathe it in
        bin: Oxygen
        clue: Which gas do our cells need?
        why: Our cells need oxygen.
      - label: Each molecule has three oxygen atoms
        bin: Ozone
        clue: O₂ or O₃?
        why: O₃ is ozone; ordinary oxygen is O₂.
    items:
      - prompt: "Which test shows that a gas is hydrogen?"
        options: ["It burns with a pop when a lit splint is brought near", "It relights a glowing splint", "It turns lime water milky", "It turns red litmus blue"]
        answer: "It burns with a pop when a lit splint is brought near"
        difficulty: 1
        hints: ["Hydrogen is flammable."]
        solution: "Hydrogen burns with a pop."
        mistakes: {"It relights a glowing splint": hydrogen_test}
      - prompt: "Which test shows that a gas is oxygen?"
        options: ["It relights a glowing splint", "It burns with a pop", "It turns lime water milky", "It smells of rotten eggs"]
        answer: "It relights a glowing splint"
        difficulty: 1
        hints: ["Oxygen supports burning."]
        solution: "A glowing splint bursts into flame in oxygen."
        mistakes: {"It burns with a pop": oxygen_test}
      - prompt: "What is the formula of ozone?"
        options: ["O₃", "O₂", "O", "H₂O₂"]
        answer: "O₃"
        difficulty: 1
        hints: ["Three oxygen atoms."]
        solution: "Ozone is O₃."
        mistakes: {"O₂": ozone_formula}
      - prompt: "In Zn + 2HCl → ZnCl₂ + H₂, how many molecules of HCl react with one atom of zinc?"
        answer: "2"
        check: "2"
        difficulty: 2
        hints: ["Look at the number in front of HCl."]
        solution: "The balanced equation has 2HCl for each Zn."
        mistakes: {"1": mole_ratio}
      - prompt: "In 2H₂O₂ → 2H₂O + O₂, how many O₂ molecules are made from 6 molecules of H₂O₂?"
        answer: "3"
        check: "6*Rational(1, 2)"
        difficulty: 2
        hints: ["2 H₂O₂ give 1 O₂."]
        solution: "6 ÷ 2 = 3 molecules of O₂."
        mistakes: {"6": mole_ratio, "12": mole_ratio}
      - prompt: "What damages the ozone layer?"
        options: ["Chlorofluorocarbons (CFCs)", "Oxygen from plants", "Nitrogen gas", "Water vapour from the sea"]
        answer: "Chlorofluorocarbons (CFCs)"
        difficulty: 2
        hints: ["Once used in old fridges and sprays."]
        solution: "CFCs release chlorine high in the atmosphere, which breaks down ozone."
        mistakes: {"Oxygen from plants": "cfc_ozone", "Water vapour from the sea": "cfc_ozone"}
      - prompt: "Hydrogen is used to make vegetable ghee from oils. What is this process called?"
        options: ["Hydrogenation", "Oxidation", "Distillation", "Electrolysis"]
        answer: "Hydrogenation"
        difficulty: 3
        hints: ["Adding hydrogen."]
        solution: "Adding hydrogen to oils with a nickel catalyst (hydrogenation) turns them into solid fats."

        mistakes: {"Oxidation": "hydrogenation", "Distillation": "hydrogenation"}
      - prompt: "In 2KMnO₄ → K₂MnO₄ + MnO₂ + O₂, how many O₂ molecules are made from 8 units of KMnO₄?"
        answer: "4"
        check: "8/2"
        difficulty: 2
        hints: ["2 KMnO₄ give 1 O₂.", "8 is four lots of 2."]
        solution: "Step 1: Ratio 2 : 1. Step 2: 8 KMnO₄ give 4 O₂."
        mistakes: {"8": mole_ratio, "16": mole_ratio}
      - prompt: "How does the ozone layer protect living things?"
        options: ["It absorbs harmful ultraviolet rays from the Sun", "It makes the oxygen we breathe", "It keeps the Earth warm", "It blocks visible light"]
        answer: "It absorbs harmful ultraviolet rays from the Sun"
        difficulty: 2
        hints: ["Ozone is high up in the atmosphere, not where we breathe.", "Which rays cause sunburn and skin cancer?"]
        solution: "Step 1: Ozone high in the atmosphere absorbs most of the Sun's ultraviolet rays. Step 2: Without it, UV would harm skin, eyes and crops."
        mistakes: {"It makes the oxygen we breathe": ozone_shield, "It keeps the Earth warm": ozone_shield, "It blocks visible light": ozone_shield}
      - prompt: "In Zn + H₂SO₄ → ZnSO₄ + H₂, which element is reduced?"
        options: ["Hydrogen", "Zinc", "Sulphur", "Oxygen"]
        answer: "Hydrogen"
        difficulty: 3
        hints: ["Find each element's oxidation number before and after.", "Reduction lowers the oxidation number."]
        solution: "Step 1: Zn goes 0 → +2: oxidised. Step 2: H goes +1 → 0: reduced. S and O do not change."
        mistakes: {"Zinc": oil_rig, "Sulphur": oxidation_number_up, "Oxygen": oxidation_number_up}
  - code: chem9.nonmetals.nitrogen_ammonia
    title: Nitrogen and ammonia
    after: [chem9.nonmetals.hydrogen_oxygen]
    notes: |
      Nitrogen makes up about 78% of air. It is unreactive because of its strong triple bond. Ammonia
      is made industrially by the Haber process: N₂ + 3H₂ ⇌ 2NH₃, with an iron catalyst, about 450 °C
      and high pressure (about 200 atm). Ammonia is a colourless, pungent gas, very soluble in water,
      and basic (turns red litmus blue). It is used to make fertilisers such as urea and ammonium
      sulphate, and in refrigeration.
    explanations:
      text: "Plants need nitrogen, but cannot use the nitrogen gas around them. The Haber process joins nitrogen from air with hydrogen to make ammonia, which is turned into fertilisers. FACT, the fertiliser factory near Kochi, makes ammonium sulphate this way."
      visual: "Draw one N₂ molecule and three H₂ molecules going into a box labelled 'iron catalyst, 450 °C, 200 atm', and two NH₃ molecules coming out."
      step_by_step: "How much H₂ is needed for 10 molecules of N₂? Step 1: N₂ + 3H₂ → 2NH₃. Step 2: 1 N₂ needs 3 H₂. Step 3: 10 N₂ need 30 H₂, making 20 NH₃."
      real_world: "Smelling salts and some floor cleaners contain ammonia: its sharp smell is easy to recognise."
    activity:
      type: order
      prompt: Put the steps of making ammonia (Haber process) in order.
      steps:
      - 'Mix nitrogen and hydrogen (1 : 3)'
      - Compress to high pressure
      - Pass over an iron catalyst at about 450 °C
      - Cool the gases so ammonia turns liquid
      - Send unused gases back round
      reasons:
        Compress to high pressure: You need the gases mixed before you can squeeze them.
        Pass over an iron catalyst at about 450 °C: 'The gases are squeezed first: high pressure helps them react on the catalyst.'
        Cool the gases so ammonia turns liquid: There is no ammonia to cool until the gases have reacted on the catalyst.
        Send unused gases back round: First the ammonia has to be taken out as a liquid; only the gas left over is sent back.
    items:
      - prompt: "About what percentage of air is nitrogen?"
        answer: "78"
        check: "78"
        difficulty: 1
        hints: ["More than three quarters."]
        solution: "Air is about 78% nitrogen and 21% oxygen."
        mistakes: {"21": "air_nitrogen_78", "50": "air_nitrogen_78"}
      - prompt: "What colour change does ammonia gas cause in moist red litmus paper?"
        options: ["Red to blue", "Blue to red", "No change", "Red to white"]
        answer: "Red to blue"
        difficulty: 1
        hints: ["Ammonia is basic."]
        solution: "Bases turn red litmus blue."
        mistakes: {"Blue to red": ammonia_basic}
      - prompt: "Which catalyst is used in the Haber process?"
        options: ["Iron", "Platinum", "Nickel", "Manganese dioxide"]
        answer: "Iron"
        difficulty: 2
        hints: ["A common, cheap metal."]
        solution: "Finely divided iron is the catalyst."
        mistakes: {"Nickel": haber_conditions}
      - prompt: "In N₂ + 3H₂ ⇌ 2NH₃, how many molecules of ammonia are made from 10 molecules of nitrogen?"
        answer: "20"
        check: "10*2"
        difficulty: 2
        hints: ["1 N₂ gives 2 NH₃."]
        solution: "10 × 2 = 20 molecules of NH₃"
        mistakes: {"10": mole_ratio, "30": mole_ratio}
      - prompt: "Why is nitrogen gas so unreactive?"
        options: ["Its two atoms are joined by a strong triple bond", "It is a noble gas", "It has no electrons", "It is very heavy"]
        answer: "Its two atoms are joined by a strong triple bond"
        difficulty: 2
        hints: ["N≡N."]
        solution: "The N≡N triple bond needs a lot of energy to break."
        mistakes: {"It is a noble gas": "triple_bond_n2", "It is very heavy": "triple_bond_n2"}
      - prompt: "What is the oxidation number of nitrogen in ammonia, NH₃?"
        answer: "-3"
        check: "solve(Eq(x + 3*1, 0), x)[0]"
        difficulty: 3
        hints: ["H is +1."]
        solution: "x + 3 = 0, so N is −3."
        mistakes: {"3": oxygen_minus_two}
      - prompt: "In N₂ + 3H₂ ⇌ 2NH₃, how many molecules of hydrogen are needed to make 50 molecules of ammonia?"
        answer: "75"
        check: "50*3/2"
        difficulty: 3
        hints: ["3 H₂ make 2 NH₃.", "50 NH₃ is 25 lots of 2."]
        solution: "Step 1: Ratio H₂ : NH₃ = 3 : 2. Step 2: 50 × 3 ÷ 2 = 75 molecules of H₂."
        mistakes: {"150": mole_ratio, "25": mole_ratio, "100": mole_ratio}
      - prompt: "Why is ammonia used to make fertilisers?"
        options: ["It supplies nitrogen, which plants need to make proteins", "It kills insects", "It makes the soil less acidic only", "It supplies oxygen to the roots"]
        answer: "It supplies nitrogen, which plants need to make proteins"
        difficulty: 2
        hints: ["What is ammonia made of?", "Plants cannot use the N₂ of the air directly."]
        solution: "Step 1: Ammonia, NH₃, contains nitrogen. Step 2: Fertilisers like urea made from it give plants nitrogen in a form they can use."
        mistakes: {"It kills insects": plant_nutrient, "It makes the soil less acidic only": plant_nutrient, "It supplies oxygen to the roots": plant_nutrient}
      - prompt: "In ammonium nitrate, NH₄NO₃, what are the oxidation numbers of nitrogen in the NH₄⁺ ion and in the NO₃⁻ ion?"
        options: ["−3 and +5", "+3 and −5", "−3 and −5", "+4 and +5"]
        answer: "−3 and +5"
        difficulty: 3
        hints: ["In NH₄⁺: x + 4(+1) = +1.", "In NO₃⁻: y + 3(−2) = −1."]
        solution: "Step 1: NH₄⁺: x + 4 = 1, so x = −3. Step 2: NO₃⁻: y − 6 = −1, so y = +5."
        mistakes: {"+3 and −5": oxygen_minus_two, "−3 and −5": ion_total, "+4 and +5": ion_total}
