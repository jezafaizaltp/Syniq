# Class 9 Chemistry, chapter 2. Format: content/README.md.
# Also uses tips from chapter 1: valence_shell, subshell_order.
subject: chem
chapter: 2
title: Periodic Table

tips:
  period_is_shells: "The period number is the number of shells in use, the highest shell number in the configuration."
  group_from_valence: "For s-block elements, group = number of valence electrons. For p-block, group = valence electrons + 10."
  size_across: "Across a period atoms get smaller: more protons pull the same shells in tighter."
  size_down: "Down a group atoms get bigger: each step adds a new shell."
  metallic_trend: "Metallic character decreases across a period and increases down a group."
  block_last_subshell: "The block is the subshell that receives the last electron: s, p, d or f."
  noble_full: "Noble gases (group 18) have full outer shells, so they hardly react."

concepts:
  - code: chem9.periodic.layout
    title: Groups and periods
    notes: |
      The modern periodic table arranges elements in order of increasing atomic number (Moseley).
      It has 18 vertical groups and 7 horizontal periods. Elements in a group have the same number of
      valence electrons and similar properties. Period number = number of shells. Group 1: alkali
      metals; group 2: alkaline earth metals; group 17: halogens; group 18: noble gases.
    explanations:
      text: "Mendeleev arranged elements by atomic mass and left gaps for undiscovered ones. Moseley showed atomic number is the true basis. Now each row (period) starts a new shell, and each column (group) holds elements with the same outer electrons, like lithium, sodium and potassium in group 1, which all react strongly with water."
      visual: "Think of a cinema hall: rows are periods (how many shells), columns are groups (how many outer electrons). Sodium sits in row 3, column 1."
      step_by_step: "Place magnesium, 2, 8, 2: Step 1: Three shells, so period 3. Step 2: Two valence electrons, so group 2."
      real_world: "Chlorine and iodine are both in group 17, which is why both are used to kill germs: chlorine in drinking water and iodine on cuts."
    items:
      - prompt: "The modern periodic table is arranged in order of increasing:"
        options: ["Atomic number", "Atomic mass", "Number of neutrons", "Density"]
        answer: "Atomic number"
        difficulty: 1
        hints: ["Moseley's discovery."]
        solution: "The modern periodic law is based on atomic number."
      - prompt: "How many groups does the modern periodic table have?"
        answer: "18"
        check: "18"
        difficulty: 1
        hints: ["Columns from the alkali metals to the noble gases."]
        solution: "18 groups and 7 periods."
        mistakes: {"7": period_is_shells}
      - prompt: "An element has configuration 2, 8, 2. Which period is it in?"
        answer: "3"
        check: "3"
        difficulty: 1
        hints: ["Count the shells."]
        solution: "Three shells, so period 3 (it is magnesium)."
        mistakes: {"2": period_is_shells}
      - prompt: "Which group are the halogens in?"
        options: ["Group 17", "Group 1", "Group 2", "Group 18"]
        answer: "Group 17"
        difficulty: 2
        hints: ["They have 7 valence electrons."]
        solution: "Fluorine, chlorine, bromine and iodine are in group 17."
        mistakes: {"Group 18": noble_full}
      - prompt: "Which element has properties most like sodium?"
        options: ["Potassium", "Magnesium", "Chlorine", "Neon"]
        answer: "Potassium"
        difficulty: 2
        hints: ["Same group: same number of valence electrons."]
        solution: "Potassium is in group 1 like sodium, with 1 valence electron."
      - prompt: "Why are noble gases very unreactive?"
        options: ["Their outer shells are full", "They are gases", "They have no electrons", "They have very large nuclei"]
        answer: "Their outer shells are full"
        difficulty: 3
        hints: ["Neon is 2, 8."]
        solution: "With a full outer shell (8, or 2 for helium) they have no tendency to gain, lose or share electrons."
        mistakes: {"They are gases": noble_full}

  - code: chem9.periodic.position
    title: Finding an element's place
    after: [chem9.periodic.layout]
    notes: |
      From the subshell configuration: period = highest shell number; block = subshell of the last
      electron (s, p, d, f). s-block: groups 1–2, group = number of s electrons in the outer shell.
      p-block: groups 13–18, group = 10 + outer s and p electrons. d-block (transition elements):
      groups 3–12, group = (n − 1)d electrons + ns electrons. f-block: lanthanoids and actinoids.
    explanations:
      text: "Write the subshell configuration and read off the place. Chlorine is 1s² 2s² 2p⁶ 3s² 3p⁵: highest shell 3, so period 3; last electron in p, so p-block; outer electrons 2 + 5 = 7, so group 10 + 7 = 17."
      visual: "Picture the table in four blocks: a tall s-block on the left (2 columns), the d-block in the middle (10 columns), the p-block on the right (6 columns), and the f-block in two rows below."
      step_by_step: "Place iron, 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s²: Step 1: Highest shell 4, so period 4. Step 2: Last electron into 3d, so d-block. Step 3: Group = 6 + 2 = 8."
      real_world: "Most of the metals in everyday tools and wires, like iron, copper and zinc, come from the d-block."
    items:
      - prompt: "Chlorine is 1s² 2s² 2p⁶ 3s² 3p⁵. Which block is it in?"
        options: ["p-block", "s-block", "d-block", "f-block"]
        answer: "p-block"
        difficulty: 1
        hints: ["Where does the last electron go?"]
        solution: "The last electron enters 3p, so chlorine is in the p-block."
        mistakes: {"s-block": block_last_subshell}
      - prompt: "Chlorine is 1s² 2s² 2p⁶ 3s² 3p⁵. What is its group number?"
        answer: "17"
        check: "10 + 2 + 5"
        difficulty: 2
        hints: ["p-block: group = 10 + outer s and p electrons."]
        solution: "Outer electrons 3s² 3p⁵ = 7; group = 10 + 7 = 17."
        mistakes: {"7": group_from_valence}
      - prompt: "Potassium is 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹. What is its period?"
        answer: "4"
        check: "4"
        difficulty: 1
        hints: ["Highest shell number."]
        solution: "The highest shell is 4, so period 4."
        mistakes: {"3": subshell_order}
      - prompt: "Iron is 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s². What is its group number?"
        answer: "8"
        check: "6 + 2"
        difficulty: 3
        hints: ["d-block: group = d electrons + outer s electrons."]
        solution: "3d⁶ + 4s² gives 6 + 2 = 8, so group 8."
        mistakes: {"2": group_from_valence}
      - prompt: "Elements of groups 3 to 12 are called:"
        options: ["Transition elements", "Noble gases", "Alkali metals", "Halogens"]
        answer: "Transition elements"
        difficulty: 2
        hints: ["They make up the d-block."]
        solution: "The d-block elements, groups 3 to 12, are the transition elements."
      - prompt: "Aluminium is 1s² 2s² 2p⁶ 3s² 3p¹. What is its group number?"
        answer: "13"
        check: "10 + 2 + 1"
        difficulty: 2
        hints: ["p-block: 10 + outer electrons."]
        solution: "3s² 3p¹ is 3 outer electrons; group = 10 + 3 = 13."
        mistakes: {"3": group_from_valence}

  - code: chem9.periodic.trends
    title: Trends in the table
    after: [chem9.periodic.layout]
    notes: |
      Across a period (left to right): atomic size decreases, ionisation energy and electronegativity
      increase, metallic character decreases, non-metallic character increases. Down a group: atomic
      size increases, ionisation energy and electronegativity decrease, metallic character increases.
      Fluorine is the most electronegative element; caesium/francium the most metallic.
    explanations:
      text: "Going across a period, each element has one more proton but no new shell, so the nucleus pulls the electrons in tighter: atoms shrink and hold their electrons more strongly. Going down a group, each element adds a whole shell, so atoms grow and the outer electrons are easier to remove: metals get more reactive."
      visual: "Draw an arrow across the table pointing right labelled 'smaller, less metallic', and an arrow pointing down labelled 'bigger, more metallic'. The most metallic corner is bottom-left; the most non-metallic is top-right (fluorine)."
      step_by_step: "Which is bigger, Na or Cl? Step 1: Both in period 3. Step 2: Na is on the left. Step 3: Size decreases across, so Na is bigger."
      real_world: "Caesium, low in group 1, reacts so easily that it explodes in water; lithium at the top only fizzes. Atomic clocks use caesium because its outer electron is so loosely held."
    items:
      - prompt: "Across a period from left to right, the size of atoms:"
        options: ["Decreases", "Increases", "Stays the same", "First increases, then decreases"]
        answer: "Decreases"
        difficulty: 1
        hints: ["More protons, same number of shells."]
        solution: "The growing nuclear charge pulls the electrons closer, so atoms get smaller."
        mistakes: {"Increases": size_across}
      - prompt: "Down a group, the size of atoms:"
        options: ["Increases", "Decreases", "Stays the same", "First decreases, then increases"]
        answer: "Increases"
        difficulty: 1
        hints: ["Each step down adds a shell."]
        solution: "A new shell is added each period, so atoms get bigger down a group."
        mistakes: {"Decreases": size_down}
      - prompt: "Which of these is the largest atom?"
        options: ["Potassium", "Sodium", "Lithium", "Magnesium"]
        answer: "Potassium"
        difficulty: 2
        hints: ["Lithium, sodium and potassium are in group 1, going down."]
        solution: "Potassium is lowest in group 1, with 4 shells, so it is largest."
        mistakes: {"Lithium": size_down}
      - prompt: "Which element is the most electronegative?"
        options: ["Fluorine", "Chlorine", "Oxygen", "Sodium"]
        answer: "Fluorine"
        difficulty: 2
        hints: ["Top right of the table, leaving out noble gases."]
        solution: "Fluorine pulls shared electrons most strongly of all elements."
      - prompt: "Which of these is the most metallic?"
        options: ["Caesium", "Sodium", "Aluminium", "Silicon"]
        answer: "Caesium"
        difficulty: 2
        hints: ["Metallic character increases down a group and decreases across."]
        solution: "Caesium is far down group 1, so it is the most metallic."
        mistakes: {"Aluminium": metallic_trend, "Silicon": metallic_trend}
      - prompt: "Why does sodium lose its outer electron more easily than lithium?"
        options: ["Its outer electron is further from the nucleus", "It has fewer protons", "It has no inner electrons", "Its nucleus is smaller"]
        answer: "Its outer electron is further from the nucleus"
        difficulty: 3
        hints: ["Sodium has 3 shells, lithium 2."]
        solution: "With an extra shell, sodium's outer electron is further away and shielded, so the nucleus holds it less tightly."
        mistakes: {"It has fewer protons": size_down}
