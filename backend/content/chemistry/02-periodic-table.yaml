# Class 9 Chemistry, chapter 2. Format: content/README.md.
# Also uses tips from chapter 1: valence_shell, subshell_order.
subject: chem
chapter: 2
title: Periodic Table

tips:
  compare_outer: "Write both configurations and compare the outermost shells. Same number of outer electrons, same group."
  d_group: "For a d-block element, add the d electrons of the inner shell and the s electrons of the outer shell."
  reactivity_down: "Down group 1 the outer electron is further from the nucleus. Is it easier or harder to lose?"
  period_is_shells: "The period number is the number of shells in use, the highest shell number in the configuration."
  group_from_valence: "For s-block elements, group = number of valence electrons. For p-block, group = valence electrons + 10."
  size_across: "Across a period atoms get smaller: more protons pull the same shells in tighter."
  size_down: "Down a group atoms get bigger: each step adds a new shell."
  metallic_trend: "Metallic character decreases across a period and increases down a group."
  block_last_subshell: "Look at the last subshell in the configuration (the one that receives the final electron). Its letter names the block."
  noble_full: "Count outer electrons: halogens are one short of a full outer shell, while noble gases already have a full one. Which group number is one before the noble gases?"
  fluorine_most: "Electronegativity rises across a period (left to right) and falls down a group. Find the element furthest up and to the right, ignoring noble gases."
  periodic_by_number: "Mendeleev arranged elements by mass, but the modern table fixed some misplaced pairs by using a different property: the count that identifies each element."
  same_group_alike: "Elements in the same group have similar properties. Sodium is in group 1; look for another group 1 element."
  transition_block: "Groups 1, 17 and 18 have their own family names. The wide middle block of groups 3 to 12 has a different name: elements that sit in between."

concepts:
  - code: chem9.periodic.layout
    title: Groups and periods
    notes: |
      The modern periodic table arranges elements in order of increasing atomic number (Moseley).
      It has 18 vertical groups and 7 horizontal periods. Elements in a group have the same number of
      valence electrons and similar properties. Period number = number of shells. Group 1: alkali
      metals; group 2: alkaline earth metals; group 17: halogens; group 18: noble gases.
    explanations:
      text: "Mendeleev arranged elements by atomic mass and left gaps for undiscovered ones. Moseley showed atomic number is the true basis. Now each row (period) starts a new shell, and each column (group) holds elements with the same outer electrons, like lithium, sodium and potassium in group 1, which all react strongly with water."
      visual: "Think of a cinema hall: rows are periods (how many shells), columns are groups (how many outer electrons). Sodium sits in row 3, column 1."
      step_by_step: "Place magnesium, 2, 8, 2: Step 1: Three shells, so period 3. Step 2: Two valence electrons, so group 2."
      real_world: "Chlorine and iodine are both in group 17, which is why both are used to kill germs: chlorine in drinking water and iodine on cuts."
    activity:
      type: sort
      prompt: Which group does each element belong to?
      bins:
      - Alkali metals (group 1)
      - Halogens (group 17)
      - Noble gases (group 18)
      items:
      - label: Sodium (Na)
        bin: Alkali metals (group 1)
        clue: How many electrons are in its outer shell? (2, 8, 1)
        why: 'One outer electron: group 1, an alkali metal.'
      - label: Potassium (K)
        bin: Alkali metals (group 1)
        clue: How many outer electrons? (2, 8, 8, 1)
        why: 'One outer electron: group 1.'
      - label: Chlorine (Cl)
        bin: Halogens (group 17)
        clue: How many outer electrons? (2, 8, 7)
        why: 'Seven outer electrons: group 17, a halogen.'
      - label: Fluorine (F)
        bin: Halogens (group 17)
        clue: How many outer electrons? (2, 7)
        why: 'Seven outer electrons: group 17.'
      - label: Neon (Ne)
        bin: Noble gases (group 18)
        clue: Is its outer shell full? (2, 8)
        why: 'A full outer shell: group 18, a noble gas.'
      - label: Argon (Ar)
        bin: Noble gases (group 18)
        clue: Is its outer shell full? (2, 8, 8)
        why: 'A full outer shell: group 18.'
    lesson:
      - teach: Mendeleev arranged the known elements by atomic mass and left gaps for elements not yet found. Later, Moseley showed that atomic number is the right order. The modern periodic table lists elements in order of increasing atomic number.
        check:
          prompt: What decides an element's place in the modern periodic table?
          options:
          - Its atomic number
          - Its atomic mass
          - Its colour
          answer: Its atomic number
          why: Moseley's modern table uses atomic number.
      - teach: The table has 18 vertical columns, called groups, and 7 horizontal rows, called periods. The period number equals the number of shells. Sodium (2, 8, 1) uses 3 shells, so it is in period 3.
        picture:
          kind: compare
          columns:
          - title: Group (column)
            points:
            - 18 groups
            - same number of valence electrons
            - similar properties
          - title: Period (row)
            points:
            - 7 periods
            - period number = number of shells
          alt: Groups are columns with the same outer electrons; periods are rows whose number equals the number of shells.
        check:
          prompt: An element has configuration 2, 8, 8, 1. Which period is it in?
          options:
          - '4'
          - '1'
          - '8'
          answer: '4'
          why: It uses 4 shells, so period 4.
      - teach: Elements in the same group have the same number of valence electrons, so they behave alike. Group 1 (alkali metals) all react fast with water. Group 17 (halogens) all have 7 outer electrons. Group 18 (noble gases) have full shells and hardly react.
        check:
          prompt: Lithium, sodium and potassium all react strongly with water. Why?
          options:
          - They are in the same group, with 1 valence electron
          - They are in the same period
          - They have the same mass
          answer: They are in the same group, with 1 valence electron
          why: All group 1 elements have 1 outer electron and similar chemistry.
    items:
      - prompt: "The modern periodic table is arranged in order of increasing:"
        options: ["Atomic number", "Atomic mass", "Number of neutrons", "Density"]
        answer: "Atomic number"
        difficulty: 1
        hints: ["Moseley's discovery."]
        solution: "The modern periodic law is based on atomic number."
        mistakes: {"Atomic mass": "periodic_by_number", "Number of neutrons": "periodic_by_number"}
      - prompt: "How many groups does the modern periodic table have?"
        answer: "18"
        check: "18"
        difficulty: 1
        hints: ["Columns from the alkali metals to the noble gases."]
        solution: "18 groups and 7 periods."
        mistakes: {"7": period_is_shells}
      - prompt: "An element has configuration 2, 8, 2. Which period is it in?"
        answer: "3"
        check: "3"
        difficulty: 1
        hints: ["Count the shells."]
        solution: "Three shells, so period 3 (it is magnesium)."
        mistakes: {"2": period_is_shells}
      - prompt: "Which group are the halogens in?"
        options: ["Group 17", "Group 1", "Group 2", "Group 18"]
        answer: "Group 17"
        difficulty: 2
        hints: ["They have 7 valence electrons."]
        solution: "Fluorine, chlorine, bromine and iodine are in group 17."
        mistakes: {"Group 18": noble_full}
      - prompt: "Which element has properties most like sodium?"
        options: ["Potassium", "Magnesium", "Chlorine", "Neon"]
        answer: "Potassium"
        difficulty: 2
        hints: ["Same group: same number of valence electrons."]
        solution: "Potassium is in group 1 like sodium, with 1 valence electron."
        mistakes: {"Magnesium": "same_group_alike", "Neon": "same_group_alike"}
      - prompt: "Why are noble gases very unreactive?"
        options: ["Their outer shells are full", "They are gases", "They have no electrons", "They have very large nuclei"]
        answer: "Their outer shells are full"
        difficulty: 3
        hints: ["Neon is 2, 8."]
        solution: "With a full outer shell (8, or 2 for helium) they have no tendency to gain, lose or share electrons."
        mistakes: {"They are gases": noble_full}
      - prompt: "An element is in period 3 and group 2. What is its atomic number?"
        answer: "12"
        check: "2+8+2"
        difficulty: 3
        hints: ["Period 3 means three shells.", "Group 2 means 2 electrons in the outer shell."]
        solution: "Step 1: Configuration 2, 8, 2. Step 2: Atomic number = 12 (magnesium)."
        mistakes: {"5": period_is_shells, "6": period_is_shells, "20": period_is_shells}
      - prompt: "Where is the element with atomic number 19 in the periodic table?"
        options: ["Group 1, period 4", "Group 1, period 3", "Group 4, period 1", "Group 2, period 4"]
        answer: "Group 1, period 4"
        difficulty: 2
        hints: ["Write its configuration: 2, 8, 8, 1.", "Number of shells → period; outer electrons → group."]
        solution: "Step 1: 2, 8, 8, 1 uses four shells: period 4. Step 2: One outer electron: group 1 (potassium)."
        mistakes: {"Group 1, period 3": period_is_shells, "Group 4, period 1": period_is_shells, "Group 2, period 4": group_from_valence}
      - prompt: "Element A has atomic number 9 and element B has atomic number 17. Which statement is true?"
        options: ["They are in the same group", "They are in the same period", "Both are metals", "Both are noble gases"]
        answer: "They are in the same group"
        difficulty: 2
        hints: ["A is 2, 7. Write B.", "Compare the outer shells."]
        solution: "Step 1: A is 2, 7 and B is 2, 8, 7. Step 2: Both have 7 outer electrons, so both are in group 17 (fluorine and chlorine)."
        mistakes: {"They are in the same period": compare_outer, "Both are metals": compare_outer, "Both are noble gases": noble_full}
      - prompt: How many periods does the modern periodic table have?
        answer: '7'
        check: '7'
        difficulty: 1
        hints:
        - Periods are the horizontal rows.
        - Count the rows of the main table.
        solution: 'Step 1: Periods are rows. Step 2: The table has rows 1 to 7. Step 3: There are 7 periods.'
        mistakes:
          '18': period_is_shells
      - prompt: Which group are the noble gases in?
        options:
        - Group 18
        - Group 1
        - Group 17
        - Group 2
        answer: Group 18
        difficulty: 1
        hints:
        - Noble gases have full outer shells.
        - They come at the far right end of each period.
        solution: 'Step 1: Noble gases have full outer shells. Step 2: They end each period. Step 3: They form group 18.'
        mistakes:
          Group 17: noble_full
      - prompt: Which element is in the same group as chlorine?
        options:
        - Bromine
        - Argon
        - Sulphur
        - Sodium
        answer: Bromine
        difficulty: 2
        hints:
        - Chlorine is a halogen.
        - Which of these is also a halogen?
        solution: 'Step 1: Chlorine is in group 17. Step 2: The halogens are F, Cl, Br, I. Step 3: Bromine is in the same group.'
        mistakes:
          Argon: same_group_alike
      - prompt: An element has configuration 2, 8, 5. Which period is it in?
        answer: '3'
        check: '3'
        difficulty: 2
        hints:
        - Count how many shells hold electrons.
        - Period number = number of shells.
        solution: 'Step 1: The shells K, L and M hold electrons. Step 2: That is 3 shells. Step 3: It is in period 3.'
        mistakes:
          '5': period_is_shells
          '15': period_is_shells
      - prompt: Elements with atomic numbers 4 and 12 are in the same group. Why?
        options:
        - Both have 2 valence electrons
        - Both have 2 shells
        - Both have the same mass
        - Both are noble gases
        answer: Both have 2 valence electrons
        difficulty: 2
        hints:
        - Write both configurations.
        - Compare the outermost shells.
        solution: 'Step 1: 4 = 2, 2. Step 2: 12 = 2, 8, 2. Step 3: Both have 2 outer electrons, so both are in group 2.'
        mistakes:
          Both have 2 shells: compare_outer
      - prompt: An element is in period 2 and group 16. What is its atomic number?
        answer: '8'
        check: 2+6
        difficulty: 3
        hints:
        - Period 2 means two shells. Group 16 means 6 valence electrons.
        - Write the configuration and add.
        solution: 'Step 1: Two shells: K is full with 2. Step 2: Group 16 means 6 in L. Step 3: 2 + 6 = 8 (oxygen).'
        mistakes:
          '16': group_from_valence
          '18': group_from_valence

  - code: chem9.periodic.position
    title: Finding an element's place
    after: [chem9.periodic.layout]
    notes: |
      From the subshell configuration: period = highest shell number; block = subshell of the last
      electron (s, p, d, f). s-block: groups 1–2, group = number of s electrons in the outer shell.
      p-block: groups 13–18, group = 10 + outer s and p electrons. d-block (transition elements):
      groups 3–12, group = (n − 1)d electrons + ns electrons. f-block: lanthanoids and actinoids.
    explanations:
      text: "Write the subshell configuration and read off the place. Chlorine is 1s² 2s² 2p⁶ 3s² 3p⁵: highest shell 3, so period 3; last electron in p, so p-block; outer electrons 2 + 5 = 7, so group 10 + 7 = 17."
      visual: "Picture the table in four blocks: a tall s-block on the left (2 columns), the d-block in the middle (10 columns), the p-block on the right (6 columns), and the f-block in two rows below."
      step_by_step: "Place iron, 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s²: Step 1: Highest shell 4, so period 4. Step 2: Last electron into 3d, so d-block. Step 3: Group = 6 + 2 = 8."
      real_world: "Most of the metals in everyday tools and wires, like iron, copper and zinc, come from the d-block."
    activity:
      type: sort
      prompt: The number of shells gives the period. Which period?
      bins:
      - Period 2
      - Period 3
      items:
      - label: Lithium (2, 1)
        bin: Period 2
        clue: 'Count the numbers in the brackets: each is a shell.'
        why: 'Two shells: period 2.'
      - label: Carbon (2, 4)
        bin: Period 2
        clue: How many shells?
        why: 'Two shells: period 2.'
      - label: Oxygen (2, 6)
        bin: Period 2
        clue: How many shells? (The 6 is electrons, not shells.)
        why: 'Two shells: period 2.'
      - label: Sodium (2, 8, 1)
        bin: Period 3
        clue: How many shells?
        why: 'Three shells: period 3.'
      - label: Magnesium (2, 8, 2)
        bin: Period 3
        clue: How many shells?
        why: 'Three shells: period 3.'
      - label: Chlorine (2, 8, 7)
        bin: Period 3
        clue: How many shells? (The 7 is electrons, not shells.)
        why: 'Three shells: period 3.'
    lesson:
      - teach: 'The subshell configuration tells you exactly where an element sits. The period is the highest shell number used. The block is the subshell that gets the last electron: s, p, d or f. Magnesium 1s² 2s² 2p⁶ 3s²: period 3, s-block.'
        check:
          prompt: Sulphur is 1s² 2s² 2p⁶ 3s² 3p⁴. Which block is it in?
          options:
          - p-block
          - s-block
          - d-block
          answer: p-block
          why: The last electron goes into 3p.
      - teach: 'Group numbers: in the s-block (groups 1–2), group = number of outer s electrons. In the p-block (groups 13–18), group = 10 + outer s and p electrons. Nitrogen 2s² 2p³: 10 + 2 + 3 = group 15.'
        picture:
          kind: flow
          steps:
          - Find the last subshell (block)
          - Count outer s + p electrons
          - 's-block: group = s electrons'
          - 'p-block: group = 10 + s + p'
          alt: 'To place an element: find its block from the last subshell, then count outer electrons for the group.'
        check:
          prompt: Phosphorus ends in 3s² 3p³. What is its group?
          options:
          - '15'
          - '5'
          - '3'
          answer: '15'
          why: 'p-block: 10 + 2 + 3 = 15.'
      - teach: 'In the d-block (groups 3–12, the transition elements), group = d electrons of the inner shell + s electrons of the outer shell. Manganese ends in 3d⁵ 4s²: 5 + 2 = group 7. The f-block (lanthanoids and actinoids) sits below the table.'
        check:
          prompt: Titanium ends in 3d² 4s². What is its group?
          options:
          - '4'
          - '2'
          - '14'
          answer: '4'
          why: 'd-block: 2 + 2 = 4.'
    items:
      - prompt: "Chlorine is 1s² 2s² 2p⁶ 3s² 3p⁵. Which block is it in?"
        options: ["p-block", "s-block", "d-block", "f-block"]
        answer: "p-block"
        difficulty: 1
        hints: ["Where does the last electron go?"]
        solution: "The last electron enters 3p, so chlorine is in the p-block."
        mistakes: {"s-block": block_last_subshell}
      - prompt: "Chlorine is 1s² 2s² 2p⁶ 3s² 3p⁵. What is its group number?"
        answer: "17"
        check: "10 + 2 + 5"
        difficulty: 2
        hints: ["p-block: group = 10 + outer s and p electrons."]
        solution: "Outer electrons 3s² 3p⁵ = 7; group = 10 + 7 = 17."
        mistakes: {"7": group_from_valence}
      - prompt: "Potassium is 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹. What is its period?"
        answer: "4"
        check: "4"
        difficulty: 1
        hints: ["Highest shell number."]
        solution: "The highest shell is 4, so period 4."
        mistakes: {"3": subshell_order}
      - prompt: "Iron is 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s². What is its group number?"
        answer: "8"
        check: "6 + 2"
        difficulty: 3
        hints: ["d-block: group = d electrons + outer s electrons."]
        solution: "3d⁶ + 4s² gives 6 + 2 = 8, so group 8."
        mistakes: {"2": group_from_valence}
      - prompt: "Elements of groups 3 to 12 are called:"
        options: ["Transition elements", "Noble gases", "Alkali metals", "Halogens"]
        answer: "Transition elements"
        difficulty: 2
        hints: ["They make up the d-block."]
        solution: "The d-block elements, groups 3 to 12, are the transition elements."
        mistakes: {"Alkali metals": "transition_block", "Noble gases": "transition_block", "Halogens": "transition_block"}
      - prompt: "Aluminium is 1s² 2s² 2p⁶ 3s² 3p¹. What is its group number?"
        answer: "13"
        check: "10 + 2 + 1"
        difficulty: 2
        hints: ["p-block: 10 + outer electrons."]
        solution: "3s² 3p¹ is 3 outer electrons; group = 10 + 3 = 13."
        mistakes: {"3": group_from_valence}
      - prompt: "An element is 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s². Which block and group is it in?"
        options: ["d-block, group 12", "s-block, group 2", "d-block, group 10", "p-block, group 12"]
        answer: "d-block, group 12"
        difficulty: 3
        hints: ["Which subshell gets the last electron by the filling order: 4s or 3d?", "For d-block, group = d electrons + outer s electrons."]
        solution: "Step 1: 3d fills after 4s, so the last electron enters 3d: d-block. Step 2: Group = 10 + 2 = 12 (zinc)."
        mistakes: {"s-block, group 2": block_last_subshell, "d-block, group 10": d_group, "p-block, group 12": block_last_subshell}
      - prompt: "An element is in period 3 and group 15. Which is its configuration?"
        options: ["1s² 2s² 2p⁶ 3s² 3p³", "1s² 2s² 2p⁶ 3s² 3p⁵", "1s² 2s² 2p³", "1s² 2s² 2p⁶ 3s² 3p⁶ 3d³ 4s²"]
        answer: "1s² 2s² 2p⁶ 3s² 3p³"
        difficulty: 3
        hints: ["Period 3: the outer shell is 3.", "Group 15 = 10 + outer s and p electrons, so 5 outer electrons."]
        solution: "Step 1: Outer shell 3. Step 2: 5 outer electrons: 3s² 3p³. Step 3: 1s² 2s² 2p⁶ 3s² 3p³ (phosphorus)."
        mistakes: {"1s² 2s² 2p⁶ 3s² 3p⁵": group_from_valence, "1s² 2s² 2p³": period_is_shells, "1s² 2s² 2p⁶ 3s² 3p⁶ 3d³ 4s²": d_group}
      - prompt: "Which of these is in the s-block: calcium (20), aluminium (13), iron (26) or chlorine (17)?"
        options: ["Calcium", "Aluminium", "Iron", "Chlorine"]
        answer: "Calcium"
        difficulty: 2
        hints: ["Write where each one's last electron goes.", "Ca ends in 4s², Al in 3p¹."]
        solution: "Step 1: Ca: …4s², last electron in s. Step 2: Al and Cl end in p, Fe in d. So calcium is in the s-block."
        mistakes: {"Aluminium": block_last_subshell, "Iron": block_last_subshell, "Chlorine": block_last_subshell}
      - prompt: Magnesium is 1s² 2s² 2p⁶ 3s². Which block is it in?
        options:
        - s-block
        - p-block
        - d-block
        - f-block
        answer: s-block
        difficulty: 1
        hints:
        - Find the subshell that gets the last electron.
        - The letter of that subshell names the block.
        solution: 'Step 1: The last electron goes into 3s. Step 2: Its letter is s. Step 3: Magnesium is in the s-block.'
        mistakes:
          p-block: block_last_subshell
      - prompt: Oxygen is 1s² 2s² 2p⁴. What is its period?
        answer: '2'
        check: '2'
        difficulty: 1
        hints:
        - Look at the highest shell number in the configuration.
        - That number is the period.
        solution: 'Step 1: The highest shell used is 2. Step 2: Period = highest shell number. Step 3: Oxygen is in period 2.'
        mistakes:
          '4': period_is_shells
          '8': period_is_shells
      - prompt: Silicon is 1s² 2s² 2p⁶ 3s² 3p². What is its group number?
        answer: '14'
        check: 10+2+2
        difficulty: 2
        hints:
        - It is a p-block element.
        - Group = 10 + outer s and p electrons.
        solution: 'Step 1: Outer shell 3s² 3p². Step 2: Outer electrons = 4. Step 3: Group = 10 + 4 = 14.'
        mistakes:
          '4': group_from_valence
      - prompt: Sodium is 1s² 2s² 2p⁶ 3s¹. What is its group number?
        answer: '1'
        check: '1'
        difficulty: 1
        hints:
        - It is an s-block element.
        - For the s-block, count the outer s electrons.
        solution: 'Step 1: Last subshell 3s¹: s-block. Step 2: 1 outer s electron. Step 3: Group 1.'
        mistakes:
          '11': group_from_valence
          '3': period_is_shells
      - prompt: Copper is 1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹. What is its group number?
        answer: '11'
        check: 10+1
        difficulty: 3
        hints:
        - Copper is a d-block element.
        - Add the 3d electrons and the 4s electrons.
        solution: 'Step 1: d-block. Step 2: 3d¹⁰ + 4s¹ = 11. Step 3: Copper is in group 11.'
        mistakes:
          '1': d_group
          '10': d_group
      - prompt: An element is in period 4 and group 2. Which is its configuration?
        options:
        - 1s² 2s² 2p⁶ 3s² 3p⁶ 4s²
        - 1s² 2s² 2p⁶ 3s² 3p⁶ 3d²
        - 1s² 2s² 2p⁶ 3s²
        - 1s² 2s² 2p⁶ 3s² 3p²
        answer: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s²
        difficulty: 3
        hints:
        - Period 4 means shell 4 must be in use.
        - Group 2 is in the s-block.
        solution: 'Step 1: Period 4: the outer shell is 4. Step 2: Group 2: two outer s electrons, 4s². Step 3: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² (calcium).'
        mistakes:
          1s² 2s² 2p⁶ 3s²: period_is_shells
          1s² 2s² 2p⁶ 3s² 3p⁶ 3d²: block_last_subshell

  - code: chem9.periodic.trends
    title: Trends in the table
    after: [chem9.periodic.layout]
    notes: |
      Across a period (left to right): atomic size decreases, ionisation energy and electronegativity
      increase, metallic character decreases, non-metallic character increases. Down a group: atomic
      size increases, ionisation energy and electronegativity decrease, metallic character increases.
      Fluorine is the most electronegative element; caesium/francium the most metallic.
    explanations:
      text: "Going across a period, each element has one more proton but no new shell, so the nucleus pulls the electrons in tighter: atoms shrink and hold their electrons more strongly. Going down a group, each element adds a whole shell, so atoms grow and the outer electrons are easier to remove: metals get more reactive."
      visual: "Draw an arrow across the table pointing right labelled 'smaller, less metallic', and an arrow pointing down labelled 'bigger, more metallic'. The most metallic corner is bottom-left; the most non-metallic is top-right (fluorine)."
      step_by_step: "Which is bigger, Na or Cl? Step 1: Both in period 3. Step 2: Na is on the left. Step 3: Size decreases across, so Na is bigger."
      real_world: "Caesium, low in group 1, reacts so easily that it explodes in water; lithium at the top only fizzes. Atomic clocks use caesium because its outer electron is so loosely held."
    activity:
      type: sort
      prompt: What happens to the size of the atoms?
      bins:
      - Atoms get bigger
      - Atoms get smaller
      items:
      - label: Going down a group
        bin: Atoms get bigger
        why: A new shell is added each period, so atoms get bigger.
        clue: What gets added each time you go down one row?
      - label: Going left to right across a period
        bin: Atoms get smaller
        why: More protons pull the same shells in tighter, so atoms get smaller.
        clue: Same number of shells, but more protons. What do more protons do?
      - label: From lithium to caesium
        bin: Atoms get bigger
        clue: Is that across a period or down a group?
        why: 'Down group 1: more shells, bigger atoms.'
      - label: From sodium to chlorine
        bin: Atoms get smaller
        clue: Is that across a period or down a group?
        why: 'Across period 3: more protons, smaller atoms.'
    lesson:
      - teach: Across a period, each element has one more proton but the same number of shells. The bigger pull draws the electrons in, so atoms get smaller from left to right. Down a group, each step adds a new shell, so atoms get bigger.
        picture:
          kind: compare
          columns:
          - title: Across a period →
            points:
            - size decreases
            - electronegativity increases
            - metallic character decreases
          - title: Down a group ↓
            points:
            - size increases
            - electronegativity decreases
            - metallic character increases
          alt: Across a period atoms shrink and become less metallic; down a group they grow and become more metallic.
        check:
          prompt: 'Which is the bigger atom: lithium or fluorine (both period 2)?'
          options:
          - Lithium
          - Fluorine
          - They are the same size
          answer: Lithium
          why: Size decreases across a period, and lithium is on the left.
      - teach: Metallic character means how easily an atom loses electrons. A big atom holds its outer electrons loosely, so it loses them easily. So metallic character increases down a group and decreases across a period. Caesium is very metallic; chlorine is a non-metal.
        check:
          prompt: 'Which is more metallic: sodium or magnesium?'
          options:
          - Sodium
          - Magnesium
          - Both equally
          answer: Sodium
          why: Metallic character decreases across a period; sodium is further left.
      - teach: Electronegativity is how strongly an atom pulls shared electrons towards itself. Small atoms pull harder, so it rises across a period and falls down a group. Fluorine, at the top right (leaving out the noble gases), is the most electronegative element.
        check:
          prompt: 'Which is more electronegative: chlorine or iodine?'
          options:
          - Chlorine
          - Iodine
          - Both equally
          answer: Chlorine
          why: Electronegativity falls down a group, and chlorine is above iodine.
    items:
      - prompt: "Across a period from left to right, the size of atoms:"
        options: ["Decreases", "Increases", "Stays the same", "First increases, then decreases"]
        answer: "Decreases"
        difficulty: 1
        hints: ["More protons, same number of shells."]
        solution: "The growing nuclear charge pulls the electrons closer, so atoms get smaller."
        mistakes: {"Increases": size_across}
      - prompt: "Down a group, the size of atoms:"
        options: ["Increases", "Decreases", "Stays the same", "First decreases, then increases"]
        answer: "Increases"
        difficulty: 1
        hints: ["Each step down adds a shell."]
        solution: "A new shell is added each period, so atoms get bigger down a group."
        mistakes: {"Decreases": size_down}
      - prompt: "Which of these is the largest atom?"
        options: ["Potassium", "Sodium", "Lithium", "Magnesium"]
        answer: "Potassium"
        difficulty: 2
        hints: ["Atoms get bigger going down a group. Which of these sits lowest in group 1?"]
        solution: "Potassium is lowest in group 1, with 4 shells, so it is largest."
        mistakes: {"Lithium": size_down}
      - prompt: "Which element is the most electronegative?"
        options: ["Fluorine", "Chlorine", "Oxygen", "Sodium"]
        answer: "Fluorine"
        difficulty: 2
        hints: ["Top right of the table, leaving out noble gases."]
        solution: "Fluorine pulls shared electrons most strongly of all elements."
        mistakes: {"Chlorine": "fluorine_most", "Oxygen": "fluorine_most", "Sodium": "fluorine_most"}
      - prompt: "Which of these is the most metallic?"
        options: ["Caesium", "Sodium", "Aluminium", "Silicon"]
        answer: "Caesium"
        difficulty: 2
        hints: ["Metallic character increases down a group and decreases across."]
        solution: "Caesium is far down group 1, so it is the most metallic."
        mistakes: {"Aluminium": metallic_trend, "Silicon": metallic_trend}
      - prompt: "Why does sodium lose its outer electron more easily than lithium?"
        options: ["Its outer electron is further from the nucleus", "It has fewer protons", "It has no inner electrons", "Its nucleus is smaller"]
        answer: "Its outer electron is further from the nucleus"
        difficulty: 3
        hints: ["Sodium has 3 shells, lithium 2."]
        solution: "With an extra shell, sodium's outer electron is further away and shielded, so the nucleus holds it less tightly."
        mistakes: {"It has fewer protons": size_down}
      - prompt: "Put sodium, magnesium, silicon and chlorine (all in period 3) in order of atomic size, largest first."
        options: ["Na, Mg, Si, Cl", "Cl, Si, Mg, Na", "Mg, Na, Si, Cl", "Na, Cl, Mg, Si"]
        answer: "Na, Mg, Si, Cl"
        difficulty: 3
        hints: ["They are all in the same period.", "Which way does size change across a period?"]
        solution: "Step 1: Across period 3 the order is Na, Mg, Si, Cl. Step 2: Size decreases across, so Na is largest and Cl smallest."
        mistakes: {"Cl, Si, Mg, Na": size_across, "Mg, Na, Si, Cl": size_across, "Na, Cl, Mg, Si": size_across}
      - prompt: "Oxygen and sulphur are both in group 16. Which is more electronegative, and why?"
        options: ["Oxygen, because its atom is smaller", "Sulphur, because its atom is bigger", "Sulphur, because it has more protons", "Neither: they are in the same group"]
        answer: "Oxygen, because its atom is smaller"
        difficulty: 3
        hints: ["Which is higher up the group?", "In a smaller atom, shared electrons are closer to the nucleus."]
        solution: "Step 1: Oxygen is above sulphur. Step 2: Its smaller atom pulls shared electrons more strongly, so it is more electronegative."
        mistakes: {"Sulphur, because its atom is bigger": size_down, "Sulphur, because it has more protons": size_down, "Neither: they are in the same group": fluorine_most}
      - prompt: "Going down group 1 from lithium to caesium, how does reactivity with water change?"
        options: ["It increases", "It decreases", "It stays the same", "It increases, then decreases"]
        answer: "It increases"
        difficulty: 2
        hints: ["These metals react by losing their outer electron.", "Down the group, atoms get bigger."]
        solution: "Step 1: Down the group the outer electron is further from the nucleus. Step 2: It is lost more easily, so reactivity increases."
        mistakes: {"It decreases": reactivity_down, "It stays the same": reactivity_down, "It increases, then decreases": reactivity_down}
      - prompt: Which of these atoms is the smallest?
        options:
        - Chlorine
        - Sodium
        - Magnesium
        - Aluminium
        answer: Chlorine
        difficulty: 1
        hints:
        - All four are in period 3.
        - Which way does size change across a period?
        solution: 'Step 1: They are all in period 3. Step 2: Size decreases from left to right. Step 3: Chlorine, furthest right, is smallest.'
        mistakes:
          Sodium: size_across
      - prompt: 'Down group 17 from fluorine to iodine, electronegativity:'
        options:
        - Decreases
        - Increases
        - Stays the same
        - First rises, then falls
        answer: Decreases
        difficulty: 1
        hints:
        - Atoms get bigger down a group.
        - Does a bigger atom pull shared electrons more or less?
        solution: 'Step 1: Down the group, a new shell is added each step. Step 2: Shared electrons are further from the nucleus. Step 3: Electronegativity decreases.'
        mistakes:
          Increases: fluorine_most
      - prompt: Which of these is the least metallic?
        options:
        - Phosphorus
        - Sodium
        - Magnesium
        - Potassium
        answer: Phosphorus
        difficulty: 2
        hints:
        - Metallic character falls across a period.
        - Which element is furthest right?
        solution: 'Step 1: Na, Mg and P are in period 3; K is in period 4. Step 2: Metallic character falls across a period and rises down a group. Step 3: Phosphorus is the least metallic.'
        mistakes:
          Magnesium: metallic_trend
      - prompt: Which of these halogen atoms is the largest?
        options:
        - Iodine
        - Chlorine
        - Bromine
        - Fluorine
        answer: Iodine
        difficulty: 2
        hints:
        - All four are halogens, in group 17.
        - Which one has the most shells?
        solution: 'Step 1: They are in the same group. Step 2: Size increases down a group. Step 3: Iodine, lowest of the four, is largest.'
        mistakes:
          Fluorine: size_down
      - prompt: Potassium reacts with water more violently than sodium. Why?
        options:
        - Potassium's outer electron is further from the nucleus, so it is lost more easily
        - Potassium has fewer protons
        - Potassium has more valence electrons
        - Potassium is smaller
        answer: Potassium's outer electron is further from the nucleus, so it is lost more easily
        difficulty: 3
        hints:
        - Both are in group 1 with one outer electron.
        - Which has more shells?
        solution: 'Step 1: Both have 1 outer electron. Step 2: Potassium has one more shell, so its outer electron is further out. Step 3: It is held less tightly and lost more easily, so potassium is more reactive.'
        mistakes:
          Potassium is smaller: reactivity_down
      - prompt: Arrange carbon, nitrogen, oxygen and fluorine in increasing order of electronegativity.
        options:
        - C < N < O < F
        - F < O < N < C
        - C < O < N < F
        - N < C < F < O
        answer: C < N < O < F
        difficulty: 3
        hints:
        - All four are in period 2.
        - Electronegativity rises from left to right.
        solution: 'Step 1: Order in period 2: C, N, O, F. Step 2: Electronegativity increases across the period. Step 3: C < N < O < F.'
        mistakes:
          F < O < N < C: fluorine_most
