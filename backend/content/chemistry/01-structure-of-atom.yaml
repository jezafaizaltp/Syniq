# Class 9 Chemistry, chapter 1. Format: content/README.md.
subject: chem
chapter: 1
title: Structure of Atom

tips:
  particle_masses: "Look up each particle's mass in u. One of the three is nearly 2000 times lighter than the other two."
  average_isotopes: "Weight each mass by how common it is: multiply each mass by its share, then add."
  all_p: "Write the whole configuration and add the electrons in every p subshell, not just the last one."
  count_all_electrons: "Add the electrons in every subshell of the configuration. A neutral atom has as many electrons as protons."
  mass_not_neutrons: "Neutrons = mass number − atomic number. The mass number counts protons and neutrons together."
  protons_neutrons_mixed: "The atomic number is the number of protons. Neutrons are what is left of the mass number."
  ion_electrons: "A positive ion has lost electrons; a negative ion has gained them. The number of protons never changes."
  isotope_protons: "Isotopes are the same element, so think: which particle count decides which element an atom is? The particles that differ only change the mass."
  shell_capacity: "Shell n holds at most 2n² electrons: work out 2 × n × n for the shell asked. For the first 20 elements, the outermost shell never holds more than eight."
  subshell_order: "Subshells fill in order of energy: 1s 2s 2p 3s 3p, then the next one is lower in energy than 3d. Use this order to place each electron."
  subshell_capacity: "Each orbital holds 2 electrons. s has 1 orbital, p has 3, d has 5, f has 7. Multiply to find how many a subshell can hold."
  valence_shell: "Valence electrons are those in the outermost shell only."
  carbon_dating: "Dating old wood and bones needs an isotope that living things took in from the air while alive and that slowly decays after death. Which element is in all living things?"
  electron_negative: "Recall the charge of each particle in an atom: one is positive, one has no charge, one is negative. The nucleus holds two of them, so what is its overall charge?"
  electrons_equal_protons: "In a neutral atom, electrons = protons = atomic number."
  subshells_per_shell: "The number of subshells in a shell equals the shell number: shell 2 has 2s and 2p. Apply the same rule to the shell asked."

concepts:
  - code: chem9.atom.particles
    title: Protons, neutrons and electrons
    notes: |
      An atom has a tiny nucleus of protons (charge +1, mass about 1 u) and neutrons (no charge, mass
      about 1 u), with electrons (charge −1, mass about 1/1840 u) around it. The atomic number Z is
      the number of protons (equal to the electrons in a neutral atom). The mass number A is protons
      + neutrons, so neutrons = A − Z. Written as a symbol with A above and Z below, e.g. ²³Na with
      Z = 11. An ion has gained or lost electrons only.
    explanations:
      text: "Every atom of sodium has 11 protons: that is what makes it sodium, its atomic number. Most sodium atoms also have 12 neutrons, so the mass number is 11 + 12 = 23. A neutral atom has as many electrons as protons, so 11 electrons. When sodium loses one electron it becomes the ion Na⁺ with 10 electrons, still 11 protons."
      visual: "Draw a small circle in the middle with '11 p, 12 n' written in it: the nucleus. Around it draw rings with dots for electrons: 2 on the first ring, 8 on the second, 1 on the third."
      step_by_step: "Chlorine, A = 35, Z = 17. Step 1: Protons = Z = 17. Step 2: Electrons = 17 (neutral). Step 3: Neutrons = 35 − 17 = 18. Step 4: As Cl⁻ it gains 1 electron: 18 electrons."
      real_world: "If an atom were the size of a cricket stadium, its nucleus would be a small marble at the centre, yet it would hold almost all the mass."
    activity:
      type: formula
      prompt: Build an atom. Atomic number Z = protons; mass number A = protons + neutrons.
      inputs:
      - name: p
        label: Protons
        min: 1
        max: 25
        step: 1
        start: 1
      - name: n
        label: Neutrons
        min: 0
        max: 40
        step: 1
        start: 0
      outputs:
      - name: z
        label: Atomic number Z
        expr: p
      - name: a
        label: Mass number A
        expr: p+n
      goals:
      - prompt: 'Build sodium: Z = 11, A = 23.'
        want:
          z: 11
          a: 23
        mistakes:
        - when:
            n: 23
          say: With 23 neutrons the mass number is 34. The mass number 23 counts protons and neutrons together.
        - when:
            p: 23
          say: 23 protons would make a different element (vanadium). The atomic number, 11, is the number of protons.
      - prompt: 'Build chlorine-35: Z = 17.'
        want:
          z: 17
          a: 35
        mistakes:
        - when:
            n: 35
          say: Mass number 35 counts protons and neutrons together, so the neutrons alone are fewer than 35.
    lesson:
      - teach: Every atom has a tiny, heavy centre called the nucleus. It holds protons (charge +1) and neutrons (no charge). Around the nucleus move electrons (charge −1), which are about 1840 times lighter than a proton. Almost all the atom's mass is in the nucleus.
        picture:
          kind: compare
          columns:
          - title: Proton
            points:
            - in the nucleus
            - charge +1
            - mass about 1 u
          - title: Neutron
            points:
            - in the nucleus
            - no charge
            - mass about 1 u
          - title: Electron
            points:
            - around the nucleus
            - charge −1
            - mass about 1/1840 u
          alt: Protons and neutrons are in the nucleus with mass about 1 u; electrons move around it and are very light.
        check:
          prompt: Which particle has no charge?
          options:
          - Neutron
          - Proton
          - Electron
          answer: Neutron
          why: Protons are +1, electrons −1, and neutrons are neutral.
        ways:
        - style: real_world
          teach: 'Picture an atom as a huge cricket stadium. The nucleus is a small marble at the centre, yet it holds almost all the mass: protons, which are positive, and neutrons, which have no charge. Electrons, negative and far lighter, move around in the empty space out to the stands.'
      - teach: 'The atomic number Z is the number of protons. It decides which element the atom is: every atom with 6 protons is carbon. A neutral atom has as many electrons as protons, so the charges cancel.'
        check:
          prompt: A neutral atom has 13 protons. How many electrons does it have?
          options:
          - '13'
          - '14'
          - '26'
          answer: '13'
          why: In a neutral atom, electrons = protons.
        ways:
        - style: step_by_step
          teach: 'Step 1: count the protons: that is the atomic number Z. Step 2: Z names the element: 6 protons is always carbon. Step 3: in a neutral atom, the electrons equal the protons, so + and − cancel.'
      - teach: The mass number A counts protons and neutrons together. So neutrons = A − Z. Sodium has Z = 11 and A = 23, so it has 23 − 11 = 12 neutrons.
        check:
          prompt: An atom has Z = 9 and A = 19. How many neutrons does it have?
          options:
          - '10'
          - '19'
          - '28'
          answer: '10'
          why: Neutrons = A − Z = 19 − 9 = 10.
        ways:
        - style: step_by_step
          teach: 'Step 1: the mass number A counts everything in the nucleus: protons plus neutrons. Step 2: the atomic number Z counts only protons. Step 3: so neutrons = A − Z.'
      - teach: 'An ion forms when an atom gains or loses electrons; the protons never change. Losing electrons makes a positive ion: Na⁺ has 11 protons and 10 electrons. Gaining electrons makes a negative ion: Cl⁻ has 17 protons and 18 electrons.'
        check:
          prompt: An atom loses 2 electrons. What kind of ion forms?
          options:
          - A 2+ ion
          - A 2− ion
          - No ion
          answer: A 2+ ion
          why: 'Losing negative electrons leaves 2 more protons than electrons: charge 2+.'
        ways:
        - style: step_by_step
          teach: 'Step 1: the protons never change, so the + charge stays the same. Step 2: lose electrons, and there is less −, so the ion is positive. Step 3: gain electrons, and there is more −, so the ion is negative. Step 4: the charge equals how many were lost or gained.'
    items:
      - prompt: "An atom has atomic number 11 and mass number 23. How many neutrons does it have?"
        answer: "12"
        check: "23 - 11"
        difficulty: 1
        hints: ["Neutrons = mass number − atomic number."]
        solution: "23 − 11 = 12 neutrons"
        mistakes: {"23": mass_not_neutrons, "34": mass_not_neutrons}
      - prompt: "Which particle has a negative charge?"
        options: ["Electron", "Proton", "Neutron", "Nucleus"]
        answer: "Electron"
        difficulty: 1
        hints: ["Protons are positive; neutrons have no charge."]
        solution: "The electron has charge −1."
        mistakes: {"Proton": "electron_negative", "Neutron": "electron_negative", "Nucleus": "electron_negative"}
      - prompt: "A neutral atom of oxygen has atomic number 8. How many electrons does it have?"
        answer: "8"
        check: "8"
        difficulty: 1
        hints: ["Neutral: electrons = protons."]
        solution: "Protons = 8, so electrons = 8."
        mistakes: {"16": "electrons_equal_protons", "6": "valence_shell"}
      - prompt: "Chlorine has atomic number 17 and mass number 35. How many neutrons are in its nucleus?"
        answer: "18"
        check: "35 - 17"
        difficulty: 2
        hints: ["A − Z."]
        solution: "35 − 17 = 18"
        mistakes: {"17": protons_neutrons_mixed, "52": mass_not_neutrons}
      - prompt: "Magnesium (atomic number 12) forms the ion Mg²⁺. How many electrons does Mg²⁺ have?"
        answer: "10"
        check: "12 - 2"
        difficulty: 2
        hints: ["2+ means 2 electrons lost."]
        solution: "12 − 2 = 10 electrons. It still has 12 protons."
        mistakes: {"14": ion_electrons}
      - prompt: "An ion has 16 protons, 16 neutrons and 18 electrons. What is its charge?"
        options: ["2−", "2+", "0", "1−"]
        answer: "2−"
        difficulty: 3
        hints: ["Two more electrons than protons."]
        solution: "18 electrons − 16 protons = 2 extra negative charges: S²⁻."
        mistakes: {"2+": ion_electrons}
      - prompt: "An ion X³⁺ has 10 electrons and 14 neutrons. What is the mass number of X?"
        answer: "27"
        check: "(10+3) + 14"
        difficulty: 3
        hints: ["X³⁺ lost 3 electrons, so the atom had 13.", "Mass number = protons + neutrons."]
        solution: "Step 1: Protons = 10 + 3 = 13. Step 2: Mass number = 13 + 14 = 27 (aluminium)."
        mistakes: {"24": ion_electrons, "21": ion_electrons, "13": mass_not_neutrons}
      - prompt: "Which two particles have almost the same mass?"
        options: ["Proton and neutron", "Proton and electron", "Neutron and electron", "All three"]
        answer: "Proton and neutron"
        difficulty: 2
        hints: ["Which particles are in the nucleus?", "Which particle's mass is about 1/1840 u?"]
        solution: "Step 1: Proton ≈ 1 u, neutron ≈ 1 u. Step 2: Electron ≈ 1/1840 u, far lighter."
        mistakes: {"Proton and electron": particle_masses, "Neutron and electron": particle_masses, "All three": particle_masses}
      - prompt: "The sulphide ion S²⁻ has 18 electrons. How many protons does it have?"
        answer: "16"
        check: "18-2"
        difficulty: 2
        hints: ["A 2− ion has gained 2 electrons.", "Protons do not change."]
        solution: "Step 1: The neutral atom had 18 − 2 = 16 electrons. Step 2: So it has 16 protons."
        mistakes: {"20": ion_electrons, "18": ion_electrons}
      - prompt: An atom has atomic number 19 and mass number 39. How many neutrons does it have?
        answer: '20'
        check: 39-19
        difficulty: 1
        hints:
        - The mass number counts protons and neutrons.
        - Subtract the atomic number from the mass number.
        solution: 'Step 1: Protons = Z = 19. Step 2: Neutrons = A − Z = 39 − 19. Step 3: Neutrons = 20.'
        mistakes:
          '39': mass_not_neutrons
          '58': mass_not_neutrons
      - prompt: Where in an atom are the protons and neutrons found?
        options:
        - In the nucleus
        - In the shells around the nucleus
        - Spread evenly through the atom
        - Outside the atom
        answer: In the nucleus
        difficulty: 1
        hints:
        - The atom has a tiny, heavy centre.
        - Which particles make up most of the mass?
        solution: 'Step 1: Electrons move in shells around the centre. Step 2: The heavy particles are packed in the centre. Step 3: Protons and neutrons are in the nucleus.'
        mistakes:
          In the shells around the nucleus: electron_negative
      - prompt: A neutral atom has 15 electrons and 16 neutrons. What is its mass number?
        answer: '31'
        check: 15+16
        difficulty: 2
        hints:
        - In a neutral atom, protons = electrons.
        - Mass number = protons + neutrons.
        solution: 'Step 1: Protons = 15. Step 2: Neutrons = 16. Step 3: A = 15 + 16 = 31.'
        mistakes:
          '16': protons_neutrons_mixed
          '1': mass_not_neutrons
      - prompt: Aluminium (atomic number 13) forms the ion Al³⁺. How many electrons does Al³⁺ have?
        answer: '10'
        check: 13-3
        difficulty: 2
        hints:
        - A positive ion has lost electrons.
        - How many electrons has the neutral atom, and how many are lost?
        solution: 'Step 1: Neutral Al has 13 electrons. Step 2: Al³⁺ has lost 3. Step 3: 13 − 3 = 10 electrons.'
        mistakes:
          '16': ion_electrons
          '13': ion_electrons
      - prompt: The oxide ion O²⁻ comes from oxygen (atomic number 8). How many electrons does it have?
        answer: '10'
        check: 8+2
        difficulty: 2
        hints:
        - A negative ion has gained electrons.
        - Start from the neutral atom's electrons.
        solution: 'Step 1: Neutral O has 8 electrons. Step 2: The 2− charge means 2 were gained. Step 3: 8 + 2 = 10 electrons.'
        mistakes:
          '6': ion_electrons
      - prompt: A particle has 20 protons, 20 neutrons and 18 electrons. Which is it?
        options:
        - A calcium ion, Ca²⁺
        - A neutral calcium atom
        - A calcium ion, Ca²⁻
        - An argon atom
        answer: A calcium ion, Ca²⁺
        difficulty: 3
        hints:
        - The number of protons tells you the element.
        - Compare protons and electrons to find the charge.
        solution: 'Step 1: 20 protons means calcium. Step 2: 18 electrons is 2 fewer than the protons. Step 3: Charge = +2, so it is Ca²⁺.'
        mistakes:
          An argon atom: ion_electrons
          A calcium ion, Ca²⁻: ion_electrons

  - code: chem9.atom.isotopes
    title: Isotopes
    after: [chem9.atom.particles]
    notes: |
      Isotopes are atoms of the same element (same atomic number) with different mass numbers, because
      they have different numbers of neutrons. They have the same chemical properties. Examples:
      hydrogen ¹H (protium), ²H (deuterium), ³H (tritium); carbon-12 and carbon-14; chlorine-35 and
      chlorine-37. Uses: C-14 dating, Co-60 in cancer treatment, I-131 for thyroid, U-235 in reactors.
    explanations:
      text: "All carbon atoms have 6 protons. Most have 6 neutrons (carbon-12), but a few have 8 (carbon-14). They are isotopes: same element, same chemistry, different mass. Carbon-14 slowly changes into nitrogen, which lets scientists date old wood and bones."
      visual: "Draw three hydrogen nuclei side by side: 1 proton; 1 proton + 1 neutron; 1 proton + 2 neutrons. Each has one electron outside. Only the nucleus is heavier."
      step_by_step: "Are ³⁵Cl and ³⁷Cl isotopes? Step 1: Both are chlorine, Z = 17. Step 2: Neutrons: 35 − 17 = 18 and 37 − 17 = 20. Step 3: Same protons, different neutrons: yes, isotopes."
      real_world: "Doctors use radioactive iodine-131 to treat thyroid problems, and cobalt-60 to treat cancer."
    activity:
      type: sort
      prompt: Isotopes have the same number of protons. Which are isotopes of carbon (6 protons)?
      bins:
      - Carbon isotope
      - Another element
      items:
      - label: Carbon-12 (6 protons, 6 neutrons)
        bin: Carbon isotope
        clue: Count the protons. Carbon has 6.
        why: '6 protons: carbon.'
      - label: Carbon-14 (6 protons, 8 neutrons)
        bin: Carbon isotope
        clue: Count the protons. Do extra neutrons change the element?
        why: '6 protons: still carbon. Only the neutrons differ.'
      - label: Nitrogen-14 (7 protons, 7 neutrons)
        bin: Another element
        why: 'Same mass number as carbon-14, but 7 protons: nitrogen.'
        clue: Count the protons, not the mass number.
      - label: Carbon-13 (6 protons, 7 neutrons)
        bin: Carbon isotope
        clue: Count the protons.
        why: '6 protons: carbon, with one extra neutron.'
      - label: Boron-11 (5 protons, 6 neutrons)
        bin: Another element
        clue: Count the protons.
        why: '5 protons: boron, a different element.'
      - label: Oxygen-16 (8 protons)
        bin: Another element
        clue: Count the protons.
        why: '8 protons: oxygen, a different element.'
    lesson:
      - teach: Atoms of the same element always have the same number of protons, but they can have different numbers of neutrons. Such atoms are isotopes. Carbon-12 has 6 protons and 6 neutrons; carbon-14 has 6 protons and 8 neutrons. Both are carbon.
        picture:
          kind: compare
          columns:
          - title: Carbon-12
            points:
            - 6 protons
            - 6 neutrons
            - mass number 12
          - title: Carbon-14
            points:
            - 6 protons
            - 8 neutrons
            - mass number 14
          alt: Carbon-12 and carbon-14 have the same 6 protons but different numbers of neutrons.
        check:
          prompt: 'Isotopes of an element differ in their number of:'
          options:
          - Neutrons
          - Protons
          - Electrons in a neutral atom
          answer: Neutrons
          why: Same element means same protons; only the neutrons, and so the mass, differ.
        ways:
        - style: real_world
          teach: 'Twins can have the same face but different weights. Isotopes are like that: same element, same number of protons, but a different number of neutrons, so a different mass. Carbon-12 and carbon-14 are both carbon, with 6 protons each, but 6 and 8 neutrons.'
      - teach: Chemistry depends on electrons, and isotopes of an element have the same number of electrons. So isotopes react in the same way. Only properties that depend on mass, like density, differ slightly.
        check:
          prompt: Do chlorine-35 and chlorine-37 react differently with sodium?
          options:
          - No, they have the same electrons
          - Yes, chlorine-37 is heavier
          - Yes, they have different protons
          answer: No, they have the same electrons
          why: Chemical properties come from the electrons, which are the same.
        ways:
        - style: step_by_step
          teach: 'Step 1: reactions happen through electrons. Step 2: isotopes of an element have the same protons, so the same number of electrons. Step 3: so they react in the same way. Step 4: only things that depend on mass, like density, differ a little.'
      - teach: 'Hydrogen has three isotopes: protium (¹H, no neutron), deuterium (²H, one neutron) and tritium (³H, two neutrons). Isotopes are useful: carbon-14 dates old wood, cobalt-60 treats cancer, iodine-131 treats the thyroid, uranium-235 fuels nuclear reactors.'
        check:
          prompt: Which isotope is used to treat thyroid problems?
          options:
          - Iodine-131
          - Carbon-14
          - Uranium-235
          answer: Iodine-131
          why: The thyroid takes up iodine, so radioactive iodine-131 reaches it.
        ways:
        - style: real_world
          teach: 'Isotopes do real jobs. Scientists date ancient wood using carbon-14. Hospitals treat cancer with cobalt-60 and thyroid problems with iodine-131. Nuclear power plants run on uranium-235. Hydrogen itself has three: protium, deuterium and tritium.'
      - teach: 'Because an element is a mix of isotopes, its atomic mass is an average. Chlorine is 3 parts Cl-35 to 1 part Cl-37: (3 × 35 + 1 × 37) ÷ 4 = 35.5. That is why chlorine''s atomic mass is not a whole number.'
        check:
          prompt: Why is the atomic mass of chlorine 35.5 and not a whole number?
          options:
          - It is an average over its isotopes
          - Half a neutron is missing
          - Electrons add 0.5 u
          answer: It is an average over its isotopes
          why: Natural chlorine mixes Cl-35 and Cl-37, so the average is 35.5.
        ways:
        - style: step_by_step
          teach: 'Step 1: list each isotope''s mass and how many parts of each there are: 3 parts Cl-35, 1 part Cl-37. Step 2: multiply and add: 3 × 35 + 1 × 37 = 142. Step 3: divide by the total parts, 4: 35.5. An average of whole numbers needn''t be whole.'
    items:
      - prompt: "Isotopes of an element have the same number of:"
        options: ["Protons", "Neutrons", "Nucleons", "Mass number"]
        answer: "Protons"
        difficulty: 1
        hints: ["They are the same element."]
        solution: "Same element means same atomic number, so the same number of protons."
        mistakes: {"Neutrons": isotope_protons, "Mass number": isotope_protons}
      - prompt: "How many neutrons does carbon-14 have? (Carbon's atomic number is 6.)"
        answer: "8"
        check: "14 - 6"
        difficulty: 1
        hints: ["14 − 6."]
        solution: "14 − 6 = 8 neutrons"
        mistakes: {"14": mass_not_neutrons, "6": protons_neutrons_mixed}
      - prompt: "Which pair are isotopes?"
        options: ["¹²C and ¹⁴C", "¹⁴C and ¹⁴N", "²³Na and ²⁴Mg", "¹⁶O and ³²S"]
        answer: "¹²C and ¹⁴C"
        difficulty: 2
        hints: ["Isotopes are the same element."]
        solution: "Both are carbon, with different mass numbers."
        mistakes: {"¹⁴C and ¹⁴N": isotope_protons}
      - prompt: "Tritium is the hydrogen isotope with mass number 3. How many neutrons does it have?"
        answer: "2"
        check: "3 - 1"
        difficulty: 2
        hints: ["Hydrogen has 1 proton."]
        solution: "3 − 1 = 2 neutrons"
        mistakes: {"3": mass_not_neutrons}
      - prompt: "Which isotope is used to find the age of old wood and fossils?"
        options: ["Carbon-14", "Cobalt-60", "Iodine-131", "Uranium-235"]
        answer: "Carbon-14"
        difficulty: 2
        hints: ["Living things contain carbon."]
        solution: "Carbon-14 dating measures how much C-14 is left in once-living material."
        mistakes: {"Cobalt-60": "carbon_dating", "Uranium-235": "carbon_dating"}
      - prompt: "Why do ³⁵Cl and ³⁷Cl have the same chemical properties?"
        options: ["They have the same number of electrons", "They have the same mass", "They have the same number of neutrons", "They are both gases"]
        answer: "They have the same number of electrons"
        difficulty: 3
        hints: ["Chemical reactions involve electrons."]
        solution: "Both have 17 electrons arranged the same way (2, 8, 7). Chemistry depends on electrons, not neutrons."
        mistakes: {"They have the same number of neutrons": isotope_protons}
      - prompt: "Chlorine is 75% chlorine-35 and 25% chlorine-37. What is its average atomic mass?"
        answer: "35.5"
        check: "0.75*35 + 0.25*37"
        difficulty: 3
        hints: ["The average is weighted by how common each isotope is.", "0.75 × 35 + 0.25 × 37."]
        solution: "Step 1: 0.75 × 35 = 26.25. Step 2: 0.25 × 37 = 9.25. Step 3: Average = 35.5."
        mistakes: {"36": average_isotopes, "72": average_isotopes}
      - prompt: "What is different between an atom of carbon-12 and an atom of carbon-14?"
        options: ["The number of neutrons", "The number of protons", "The number of electrons", "Their chemical properties"]
        answer: "The number of neutrons"
        difficulty: 2
        hints: ["Both are carbon, so the atomic number is 6.", "The mass numbers differ by 2."]
        solution: "Step 1: Both have 6 protons and 6 electrons. Step 2: C-12 has 6 neutrons and C-14 has 8."
        mistakes: {"The number of protons": isotope_protons, "The number of electrons": isotope_protons, "Their chemical properties": isotope_protons}
      - prompt: "Atom A has 6 protons and 6 neutrons, B has 6 protons and 8 neutrons, and C has 7 protons and 7 neutrons. Which two are isotopes?"
        options: ["A and B", "B and C", "A and C", "All three"]
        answer: "A and B"
        difficulty: 3
        hints: ["Isotopes are the same element.", "B and C have the same mass number. Does that make them the same element?"]
        solution: "Step 1: A and B both have 6 protons, so both are carbon, with different neutrons. Step 2: C has 7 protons, so it is nitrogen, even though its mass number equals B's."
        mistakes: {"B and C": isotope_protons, "A and C": isotope_protons, "All three": isotope_protons}
      - prompt: Uranium-235 has atomic number 92. How many neutrons does it have?
        answer: '143'
        check: 235-92
        difficulty: 1
        hints:
        - The number after the name is the mass number.
        - Neutrons = mass number − atomic number.
        solution: 'Step 1: A = 235. Step 2: Z = 92. Step 3: Neutrons = 235 − 92 = 143.'
        mistakes:
          '235': mass_not_neutrons
          '92': protons_neutrons_mixed
      - prompt: Deuterium is an isotope of hydrogen with mass number 2. How many protons does it have?
        answer: '1'
        check: '1'
        difficulty: 1
        hints:
        - Every hydrogen atom is hydrogen because of its proton count.
        - What is hydrogen's atomic number?
        solution: 'Step 1: All hydrogen isotopes have the same atomic number. Step 2: Hydrogen''s Z is 1. Step 3: Deuterium has 1 proton (and 1 neutron).'
        mistakes:
          '2': isotope_protons
      - prompt: Which isotope is used to treat cancer?
        options:
        - Cobalt-60
        - Carbon-12
        - Hydrogen-1
        - Oxygen-16
        answer: Cobalt-60
        difficulty: 2
        hints:
        - Cancer treatment needs a radioactive isotope that gives out strong radiation.
        - The common, stable isotopes are not used.
        solution: 'Step 1: Carbon-12, hydrogen-1 and oxygen-16 are ordinary stable atoms. Step 2: Treatment needs radiation to kill cancer cells. Step 3: Cobalt-60 gives out this radiation.'
        mistakes:
          Carbon-12: carbon_dating
      - prompt: Two atoms both have 17 protons. One has 18 neutrons and the other 20. What is the mass number of the heavier one?
        answer: '37'
        check: 17+20
        difficulty: 2
        hints:
        - Mass number = protons + neutrons.
        - Use the atom with more neutrons.
        solution: 'Step 1: The heavier atom has 20 neutrons. Step 2: A = 17 + 20. Step 3: A = 37.'
        mistakes:
          '20': mass_not_neutrons
          '35': average_isotopes
      - prompt: Copper is 70% copper-63 and 30% copper-65. What is its average atomic mass?
        answer: '63.6'
        check: 0.7*63+0.3*65
        difficulty: 3
        hints:
        - Weight each mass by its share.
        - Multiply each mass by its fraction, then add.
        solution: 'Step 1: 0.7 × 63 = 44.1. Step 2: 0.3 × 65 = 19.5. Step 3: Average = 44.1 + 19.5 = 63.6.'
        mistakes:
          '64': average_isotopes
      - prompt: Which statement about ¹⁶O and ¹⁸O is true?
        options:
        - They have the same number of protons and electrons
        - They have different numbers of protons
        - ¹⁸O has more electrons
        - They are different elements
        answer: They have the same number of protons and electrons
        difficulty: 3
        hints:
        - Both are oxygen.
        - Only one kind of particle differs between isotopes.
        solution: 'Step 1: Both are oxygen, so both have 8 protons. Step 2: As neutral atoms, both have 8 electrons. Step 3: Only the neutrons differ: 8 and 10.'
        mistakes:
          They have different numbers of protons: isotope_protons

  - code: chem9.atom.shells
    title: Shells and electronic configuration
    after: [chem9.atom.particles]
    notes: |
      Bohr model: electrons move in fixed shells (energy levels) K, L, M, N (n = 1, 2, 3, 4). Shell n
      holds at most 2n² electrons. For the first 20 elements fill K (2), L (8), M (8), then N:
      Na = 2,8,1; Cl = 2,8,7; Ca = 2,8,8,2. Electrons in the outermost shell are valence electrons and
      decide the chemistry.
    explanations:
      text: "Electrons sit in shells around the nucleus like seats in rings round a stage. The first ring (K) has 2 seats, the next (L) 8. Sodium's 11 electrons fill K with 2, L with 8, and the last one sits alone in M: 2, 8, 1. That lone outer electron is why sodium reacts so easily."
      visual: "Draw concentric circles round the nucleus and put dots on them: 2 on the first, up to 8 on the second, then the rest on the third."
      step_by_step: "Configuration of sulphur, Z = 16: Step 1: K takes 2 (14 left). Step 2: L takes 8 (6 left). Step 3: M takes 6. Step 4: 2, 8, 6, with 6 valence electrons."
      real_world: "Neon signs glow because electrons jump to higher shells when electricity passes and give out light falling back."
    activity:
      type: formula
      prompt: 'Fill the shells K, L, M, N for the first 20 elements: K holds 2, L 8, M 8 (then N). Inner shells fill first.'
      inputs:
      - name: k
        label: K shell
        min: 0
        max: 2
        step: 1
        start: 0
      - name: l
        label: L shell
        min: 0
        max: 8
        step: 1
        start: 0
      - name: m
        label: M shell
        min: 0
        max: 8
        step: 1
        start: 0
      - name: n
        label: N shell
        min: 0
        max: 2
        step: 1
        start: 0
      outputs:
      - name: e
        label: Total electrons
        expr: k+l+m+n
      - name: gaps
        label: Empty places left in inner shells
        expr: min(l,1)*(2-k)+min(m,1)*(8-l)+min(n,1)*(8-m)
      goals:
      - prompt: Arrange chlorine's 17 electrons.
        want:
          e: 17
          gaps: 0
        mistakes:
        - when:
            gaps:
            - 1
            - 20
          say: 'An inner shell still has room, but you''ve put electrons further out. Electrons fill the inner shells first: K must be full (2) before L, and L full (8) before M.'
      - prompt: Arrange calcium's 20 electrons.
        want:
          e: 20
          gaps: 0
        mistakes:
        - when:
            gaps:
            - 1
            - 20
          say: An inner shell still has room, but you've put electrons further out. Fill K, then L, then M, before N.
    lesson:
      - teach: Niels Bohr pictured electrons moving in fixed circles around the nucleus, called shells or energy levels. They are named K, L, M, N (n = 1, 2, 3, 4). Shells closer to the nucleus have less energy and fill first.
        check:
          prompt: Which shell is closest to the nucleus?
          options:
          - K
          - L
          - N
          answer: K
          why: K is shell n = 1, the innermost.
        ways:
        - style: real_world
          teach: 'Think of a building with floors around a lift: the ground floor K is nearest the nucleus, then L, M and N above it. Electrons fill the lowest floors first, because those need the least energy. The floors are the shells, or energy levels, n = 1, 2, 3, 4.'
      - teach: 'Shell n holds at most 2n² electrons: K (n = 1) holds 2, L (n = 2) holds 8, M (n = 3) holds 18. For the first 20 elements, fill K with 2, L with 8, M with 8, then N.'
        picture:
          kind: bars
          bars:
          - label: K (n=1)
            value: 2
          - label: L (n=2)
            value: 8
          - label: M (n=3)
            value: 18
          - label: N (n=4)
            value: 32
          unit: electrons
          alt: 'Maximum electrons: K 2, L 8, M 18, N 32, from 2n².'
        check:
          prompt: How many electrons can the N shell (n = 4) hold at most?
          options:
          - '32'
          - '8'
          - '16'
          answer: '32'
          why: 2n² = 2 × 4 × 4 = 32.
        ways:
        - style: step_by_step
          teach: 'Step 1: take the shell number n. Step 2: square it. Step 3: double it: 2n². K: 2 × 1 = 2. L: 2 × 4 = 8. M: 2 × 9 = 18. N: 2 × 16 = 32.'
      - teach: 'To write a configuration, fill shell by shell. Magnesium has 12 electrons: K 2, L 8, M 2, written 2, 8, 2. Argon has 18: 2, 8, 8.'
        check:
          prompt: What is the configuration of nitrogen (atomic number 7)?
          options:
          - 2, 5
          - 2, 8, 5
          - '7'
          answer: 2, 5
          why: K takes 2, the remaining 5 go into L.
        ways:
        - style: step_by_step
          teach: 'Step 1: write the number of electrons. Step 2: put 2 in K. Step 3: put up to 8 in L. Step 4: put up to 8 in M (for the first 20 elements), and the rest in N. Magnesium, 12: 2, 8, 2.'
      - teach: The electrons in the outermost shell are the valence electrons. They decide how an atom reacts. Sodium (2, 8, 1) has 1 and loses it easily; chlorine (2, 8, 7) has 7 and gains 1. Neon (2, 8) has a full shell and hardly reacts.
        check:
          prompt: How many valence electrons does magnesium (2, 8, 2) have?
          options:
          - '2'
          - '12'
          - '8'
          answer: '2'
          why: 'Only the outermost shell counts: M has 2.'
        ways:
        - style: real_world
          teach: Atoms are like people trying to complete a set of 8 cards. Sodium has one extra card in a new shell, so it gives it away easily. Chlorine is one short of 8, so it grabs one. Neon already has a full set and isn't interested in trading. The outer electrons decide how an atom reacts.
    items:
      - prompt: "What is the electronic configuration of sodium (atomic number 11)?"
        options: ["2, 8, 1", "2, 9", "8, 2, 1", "2, 1, 8"]
        answer: "2, 8, 1"
        difficulty: 1
        hints: ["K holds 2, L holds 8."]
        solution: "2 in K, 8 in L, 1 in M."
        mistakes: {"2, 9": shell_capacity}
      - prompt: "What is the maximum number of electrons the L shell (n = 2) can hold?"
        answer: "8"
        check: "2*2**2"
        difficulty: 1
        hints: ["2n²."]
        solution: "2 × 2² = 8"
        mistakes: {"4": shell_capacity}
      - prompt: "How many valence electrons does chlorine (atomic number 17) have?"
        answer: "7"
        check: "17 - 2 - 8"
        difficulty: 2
        hints: ["Configuration: 2, 8, 7."]
        solution: "2, 8, 7: the outer shell has 7 electrons."
        mistakes: {"17": valence_shell}
      - prompt: "What is the electronic configuration of calcium (atomic number 20)?"
        options: ["2, 8, 8, 2", "2, 8, 10", "2, 18", "2, 8, 9, 1"]
        answer: "2, 8, 8, 2"
        difficulty: 2
        hints: ["After 2, 8, 8 the fourth shell starts."]
        solution: "K 2, L 8, M 8, N 2."
        mistakes: {"2, 8, 10": shell_capacity}
      - prompt: "What is the maximum number of electrons the M shell (n = 3) can hold?"
        answer: "18"
        check: "2*3**2"
        difficulty: 2
        hints: ["2n² with n = 3."]
        solution: "2 × 9 = 18"
        mistakes: {"8": shell_capacity, "6": shell_capacity}
      - prompt: "An element has configuration 2, 8, 3. What is its atomic number?"
        answer: "13"
        check: "2 + 8 + 3"
        difficulty: 3
        hints: ["Add up all the electrons."]
        solution: "2 + 8 + 3 = 13 (aluminium)."
        mistakes: {"3": valence_shell}
      - prompt: "An atom has electrons in 3 shells and 6 valence electrons. What is its atomic number?"
        answer: "16"
        check: "2+8+6"
        difficulty: 3
        hints: ["The first two shells are full.", "K holds 2, L holds 8."]
        solution: "Step 1: Configuration 2, 8, 6. Step 2: Atomic number = 16 (sulphur)."
        mistakes: {"6": valence_shell, "18": shell_capacity, "14": shell_capacity}
      - prompt: "How many electrons does a phosphorus atom (atomic number 15) have in its M shell?"
        answer: "5"
        check: "15-2-8"
        difficulty: 2
        hints: ["Fill K, then L, then M.", "15 − 2 − 8."]
        solution: "Step 1: Configuration 2, 8, 5. Step 2: The M shell has 5 electrons."
        mistakes: {"8": shell_capacity, "18": shell_capacity, "15": valence_shell}
      - prompt: "X has the configuration 2, 8, 8, 1 and Y has 2, 8, 7. Which ions do they form?"
        options: ["X⁺ and Y⁻", "X⁻ and Y⁺", "X²⁺ and Y⁻", "X⁺ and Y⁷⁺"]
        answer: "X⁺ and Y⁻"
        difficulty: 3
        hints: ["Which is easier for X: losing 1 or gaining 7?", "Which is easier for Y: gaining 1 or losing 7?"]
        solution: "Step 1: X loses its 1 outer electron to become X⁺. Step 2: Y gains 1 electron to complete its octet and becomes Y⁻."
        mistakes: {"X⁻ and Y⁺": metals_lose, "X²⁺ and Y⁻": ion_electrons, "X⁺ and Y⁷⁺": valency_is_needed}
      - prompt: What is the electronic configuration of aluminium (atomic number 13)?
        options:
        - 2, 8, 3
        - 2, 11
        - 2, 8, 2, 1
        - 8, 2, 3
        answer: 2, 8, 3
        difficulty: 1
        hints:
        - Fill K first, then L, then M.
        - K holds 2 and L holds 8.
        solution: 'Step 1: K takes 2 (11 left). Step 2: L takes 8 (3 left). Step 3: M gets 3: 2, 8, 3.'
        mistakes:
          2, 11: shell_capacity
      - prompt: What is the maximum number of electrons the K shell can hold?
        answer: '2'
        check: 2*1**2
        difficulty: 1
        hints:
        - Use 2n² with the shell number of K.
        - K is the first shell.
        solution: 'Step 1: K is n = 1. Step 2: 2n² = 2 × 1 × 1. Step 3: = 2 electrons.'
        mistakes:
          '8': shell_capacity
      - prompt: How many valence electrons does sulphur (atomic number 16) have?
        answer: '6'
        check: 16-2-8
        difficulty: 2
        hints:
        - Write the configuration first.
        - Count only the outermost shell.
        solution: 'Step 1: Configuration 2, 8, 6. Step 2: The outermost shell is M. Step 3: It has 6 valence electrons.'
        mistakes:
          '16': valence_shell
          '8': valence_shell
      - prompt: An element has configuration 2, 8, 8. What is its atomic number?
        answer: '18'
        check: 2+8+8
        difficulty: 2
        hints:
        - A neutral atom has as many electrons as protons.
        - Add up the electrons in all shells.
        solution: 'Step 1: Electrons = 2 + 8 + 8. Step 2: = 18. Step 3: Atomic number = 18 (argon).'
        mistakes:
          '8': count_all_electrons
      - prompt: Which element has a completely filled outermost shell?
        options:
        - Neon (atomic number 10)
        - Sodium (atomic number 11)
        - Oxygen (atomic number 8)
        - Fluorine (atomic number 9)
        answer: Neon (atomic number 10)
        difficulty: 2
        hints:
        - Write each configuration.
        - Which one ends with a full L shell of 8?
        solution: 'Step 1: Ne = 2, 8; Na = 2, 8, 1; O = 2, 6; F = 2, 7. Step 2: Only Ne has 8 in its outer shell. Step 3: Neon has a full outer shell.'
        mistakes:
          Fluorine (atomic number 9): valence_shell
      - prompt: An atom has 2 electrons in its N shell and nothing beyond. Its K, L and M shells hold 2, 8 and 8. What is its atomic number?
        answer: '20'
        check: 2+8+8+2
        difficulty: 3
        hints:
        - Write the configuration from K to N.
        - Add up all the electrons.
        solution: 'Step 1: Configuration 2, 8, 8, 2. Step 2: Total = 20 electrons. Step 3: Atomic number 20 (calcium).'
        mistakes:
          '2': count_all_electrons
          '18': count_all_electrons

  - code: chem9.atom.subshells
    title: Subshells
    after: [chem9.atom.shells]
    notes: |
      Each shell is made of subshells: s (holds 2), p (6), d (10), f (14). Shell 1 has 1s; shell 2 has
      2s, 2p; shell 3 has 3s, 3p, 3d; shell 4 has 4s, 4p, 4d, 4f. Filling order for the first 30
      elements: 1s 2s 2p 3s 3p 4s 3d. Example: Na 1s² 2s² 2p⁶ 3s¹; K 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹;
      Fe (26) 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁶ 4s².
    explanations:
      text: "Shells are split into smaller rooms called subshells: s rooms hold 2 electrons, p rooms 6, d rooms 10. Fill them in the order 1s, 2s, 2p, 3s, 3p, 4s, 3d. Notice that 4s fills before 3d: it is slightly lower in energy."
      visual: "Draw a staircase: 1s on the bottom step, then 2s, 2p, 3s, 3p, 4s, 3d going up. Fill electrons step by step, never skipping a step until the one below is full."
      step_by_step: "Configuration of potassium, Z = 19: Step 1: 1s² (2). Step 2: 2s² 2p⁶ (10). Step 3: 3s² 3p⁶ (18). Step 4: The 19th electron goes to 4s, not 3d: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹."
      real_world: "The colours of gemstones and of many transition metal compounds, like blue copper sulphate, come from electrons in d subshells."
    activity:
      type: order
      prompt: Put the subshells in the order electrons fill them.
      steps:
      - 1s
      - 2s
      - 2p
      - 3s
      - 3p
      - 4s
      - 3d
      reasons:
        2s: '1s fills first: it is closest to the nucleus and lowest in energy.'
        2p: 2s is lower in energy than 2p.
        3s: The second shell (2s and 2p) fills before the third.
        3p: 3s is lower in energy than 3p.
        4s: 3p has to fill first.
        3d: 4s is a little lower in energy than 3d, so it fills first.
    lesson:
      - teach: 'Each shell is split into subshells named s, p, d and f. An s subshell holds 2 electrons, p holds 6, d holds 10 and f holds 14. Shell n has n subshells: shell 1 has 1s; shell 2 has 2s and 2p; shell 3 has 3s, 3p and 3d.'
        picture:
          kind: bars
          bars:
          - label: s
            value: 2
          - label: p
            value: 6
          - label: d
            value: 10
          - label: f
            value: 14
          unit: electrons
          alt: 'Subshell capacities: s 2, p 6, d 10, f 14.'
        check:
          prompt: How many electrons can a d subshell hold?
          options:
          - '10'
          - '6'
          - '14'
          answer: '10'
          why: s 2, p 6, d 10, f 14.
        ways:
        - style: step_by_step
          teach: 'Step 1: shell 1 has one subshell, s. Step 2: shell 2 has s and p. Step 3: shell 3 has s, p and d. Step 4: remember the sizes: s 2, p 6, d 10, f 14. They go up by 4 each time.'
      - teach: 'Subshells fill in order of energy: 1s 2s 2p 3s 3p 4s 3d. Notice that 4s fills before 3d, because 4s has slightly lower energy.'
        check:
          prompt: After 3p is full, which subshell fills next?
          options:
          - 4s
          - 3d
          - 4p
          answer: 4s
          why: 4s is lower in energy than 3d, so it fills first.
        ways:
        - style: step_by_step
          teach: 'Step 1: write the order: 1s 2s 2p 3s 3p 4s 3d. Step 2: fill each fully before moving on. Step 3: note the jump: after 3p comes 4s, then 3d, because 4s is a little lower in energy.'
      - teach: 'Write the configuration with the electron count as a small raised number. Oxygen (8): 1s² 2s² 2p⁴. Magnesium (12): 1s² 2s² 2p⁶ 3s². The raised numbers always add up to the atomic number.'
        check:
          prompt: What is the subshell configuration of carbon (atomic number 6)?
          options:
          - 1s² 2s² 2p²
          - 1s² 2p⁴
          - 1s² 2s⁴
          answer: 1s² 2s² 2p²
          why: Fill 1s (2), 2s (2), then the last 2 go into 2p.
        ways:
        - style: step_by_step
          teach: 'Step 1: start with the atomic number. Step 2: fill 1s (2), then 2s (2), then 2p (up to 6), and so on. Step 3: write each electron count as a small raised number. Step 4: check the raised numbers add up to the atomic number.'
    items:
      - prompt: "What is the maximum number of electrons a p subshell can hold?"
        answer: "6"
        check: "6"
        difficulty: 1
        hints: ["s: 2, p: ?, d: 10."]
        solution: "A p subshell holds 6 electrons."
        mistakes: {"2": subshell_capacity, "8": subshell_capacity}
      - prompt: "What is the subshell configuration of sodium (atomic number 11)?"
        options: ["1s² 2s² 2p⁶ 3s¹", "1s² 2s² 2p⁷", "1s² 2s⁸ 3s¹", "1s² 2p⁸ 3s¹"]
        answer: "1s² 2s² 2p⁶ 3s¹"
        difficulty: 1
        hints: ["Fill 1s, 2s, 2p, then 3s."]
        solution: "2 + 2 + 6 = 10, then the 11th electron goes into 3s."
        mistakes: {"1s² 2s² 2p⁷": subshell_capacity}
      - prompt: "Which subshell is filled immediately after 3p?"
        options: ["4s", "3d", "4p", "3f"]
        answer: "4s"
        difficulty: 2
        hints: ["4s is lower in energy than 3d."]
        solution: "The order is … 3s 3p 4s 3d …"
        mistakes: {"3d": subshell_order}
      - prompt: "What is the subshell configuration of potassium (atomic number 19)?"
        options: ["1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹", "1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹", "1s² 2s² 2p⁶ 3s² 3p⁷", "1s² 2s² 2p⁶ 3s² 3d⁷"]
        answer: "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹"
        difficulty: 2
        hints: ["After 3p⁶, the next electron goes to 4s."]
        solution: "18 electrons fill up to 3p⁶; the 19th enters 4s."
        mistakes: {"1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹": subshell_order, "1s² 2s² 2p⁶ 3s² 3p⁷": subshell_capacity}
      - prompt: "How many electrons are in the 3d subshell of iron (atomic number 26)?"
        answer: "6"
        check: "26 - (2 + 2 + 6 + 2 + 6 + 2)"
        difficulty: 3
        hints: ["Fill up to 4s²: that is 20 electrons."]
        solution: "Step 1: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s² holds 20. Step 2: 26 − 20 = 6 go into 3d: 3d⁶."
        mistakes: {"8": subshell_order}
      - prompt: "How many subshells does the third shell (n = 3) have?"
        answer: "3"
        check: "3"
        difficulty: 2
        hints: ["Shell n has n subshells: 3s, 3p, …"]
        solution: "3s, 3p and 3d: 3 subshells."
        mistakes: {"9": "subshells_per_shell", "18": "subshells_per_shell"}
      - prompt: "How many electrons in all are in the p subshells of a chlorine atom (atomic number 17)?"
        answer: "11"
        check: "6+5"
        difficulty: 3
        hints: ["Chlorine is 1s² 2s² 2p⁶ 3s² 3p⁵.", "Add 2p and 3p."]
        solution: "Step 1: Chlorine is 1s² 2s² 2p⁶ 3s² 3p⁵. Step 2: p electrons = 6 + 5 = 11."
        mistakes: {"5": all_p, "6": all_p, "12": subshell_capacity}
      - prompt: "Which is the subshell configuration of the sodium ion Na⁺?"
        options: ["1s² 2s² 2p⁶", "1s² 2s² 2p⁶ 3s¹", "1s² 2s² 2p⁶ 3s²", "1s² 2s² 2p⁵"]
        answer: "1s² 2s² 2p⁶"
        difficulty: 2
        hints: ["Na has 11 electrons. Na⁺ has lost one.", "Which electron is lost: the outermost one."]
        solution: "Step 1: Na is 1s² 2s² 2p⁶ 3s¹. Step 2: Na⁺ loses the 3s electron, leaving 1s² 2s² 2p⁶ (like neon)."
        mistakes: {"1s² 2s² 2p⁶ 3s¹": ion_electrons, "1s² 2s² 2p⁶ 3s²": ion_electrons, "1s² 2s² 2p⁵": ion_electrons}
      - prompt: "An atom has the configuration 1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s². What is its atomic number?"
        answer: "25"
        check: "2+2+6+2+6+5+2"
        difficulty: 3
        hints: ["Add the small numbers above each subshell.", "Up to 3p⁶ there are 18 electrons."]
        solution: "Step 1: Up to 3p⁶: 18 electrons. Step 2: 3d⁵ 4s² adds 7. Step 3: Atomic number = 25 (manganese)."
        mistakes: {"7": count_all_electrons, "18": count_all_electrons, "23": count_all_electrons}
      - prompt: What is the maximum number of electrons an s subshell can hold?
        answer: '2'
        check: '2'
        difficulty: 1
        hints:
        - An s subshell has one orbital.
        - Each orbital holds 2 electrons.
        solution: 'Step 1: s has 1 orbital. Step 2: Each orbital holds 2. Step 3: s holds 2 electrons.'
        mistakes:
          '6': subshell_capacity
      - prompt: What is the subshell configuration of nitrogen (atomic number 7)?
        options:
        - 1s² 2s² 2p³
        - 1s² 2s² 2p⁶
        - 1s² 2p⁵
        - 1s² 2s⁵
        answer: 1s² 2s² 2p³
        difficulty: 1
        hints:
        - Fill 1s, then 2s, then 2p.
        - The raised numbers must add up to 7.
        solution: 'Step 1: 1s² uses 2. Step 2: 2s² uses 2 more. Step 3: The last 3 go into 2p: 1s² 2s² 2p³.'
        mistakes:
          1s² 2s⁵: subshell_capacity
      - prompt: How many subshells does the fourth shell (n = 4) have?
        answer: '4'
        check: '4'
        difficulty: 2
        hints:
        - Count the subshells in shells 1, 2 and 3 and look for the pattern.
        - The pattern links to the shell number.
        solution: 'Step 1: Shell 1 has 1, shell 2 has 2, shell 3 has 3. Step 2: So shell n has n subshells. Step 3: Shell 4 has 4: 4s, 4p, 4d, 4f.'
        mistakes:
          '3': subshells_per_shell
          '32': shell_capacity
      - prompt: What is the subshell configuration of calcium (atomic number 20)?
        options:
        - 1s² 2s² 2p⁶ 3s² 3p⁶ 4s²
        - 1s² 2s² 2p⁶ 3s² 3p⁶ 3d²
        - 1s² 2s² 2p⁶ 3s² 3p⁸
        - 1s² 2s² 2p⁶ 3s² 3d⁸
        answer: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s²
        difficulty: 2
        hints:
        - After 3p, which subshell has the lower energy?
        - A p subshell cannot hold more than 6.
        solution: 'Step 1: Fill up to 3p⁶ (18 electrons). Step 2: The next 2 go into 4s, which is lower in energy than 3d. Step 3: 1s² 2s² 2p⁶ 3s² 3p⁶ 4s².'
        mistakes:
          1s² 2s² 2p⁶ 3s² 3p⁶ 3d²: subshell_order
          1s² 2s² 2p⁶ 3s² 3p⁸: subshell_capacity
      - prompt: How many electrons are in the 3p subshell of phosphorus (atomic number 15)?
        answer: '3'
        check: 15-2-2-6-2
        difficulty: 2
        hints:
        - Fill 1s, 2s, 2p and 3s first.
        - Whatever is left goes into 3p.
        solution: 'Step 1: 1s² 2s² 2p⁶ 3s² holds 12. Step 2: 15 − 12 = 3. Step 3: 3p has 3 electrons.'
        mistakes:
          '5': valence_shell
          '9': all_p
      - prompt: An atom's configuration ends in 3d⁸ 4s². What is its atomic number?
        answer: '28'
        check: 2+2+6+2+6+8+2
        difficulty: 3
        hints:
