# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 7. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 7
title: Raksha Bandhan
tips:
  m3_equal_groups: "Equal groups have the same number in each."
  m3_repeat_add: "Count how many 2s there are, then count in 2s."
  m3_turnaround: "Swapping the numbers in a multiplication does not change the answer."

concepts:
- code: cbse3m.rb.groups
  title: Equal groups and repeated addition
  notes: |
    Multiplication starts with equal groups. 3 plates with 4 laddoos each: 4 + 4 + 4 = 12, written 3 × 4 = 12 ("3 groups
    of 4"). Rakhis with 5 beads each, 4 rakhis: 5 + 5 + 5 + 5 = 20. The groups must be equal.
  explanations:
    text: When we have equal groups, we can add the same number again and again. 3 plates with 4 laddoos each is 4 + 4 + 4 = 12. We write this as 3 × 4 = 12, which means 3 groups of 4.
    visual: 'Draw 3 plates with 4 laddoos on each. Count them in fours: 4, 8, 12.'
    step_by_step: 'Step 1: Count how many groups. Step 2: Count how many in each group. Step 3: Add that number again for each group, or multiply.'
    real_world: 'On Raksha Bandhan a sister might tie rakhis on 3 brothers, with 2 sweets for each brother: 2 + 2 + 2 = 6 sweets.'
  picture:
    kind: number_line
    from: 0
    to: 12
    step: 1
    points:
    - at: 4
      label: 1 plate
    - at: 8
      label: 2 plates
    - at: 12
      label: 3 plates
    alt: 'Jumps of 4 on a number line: 4, 8, 12, so 3 groups of 4 make 12.'
    jumps:
    - from: 0
      to: 4
      label: '+4'
    - from: 4
      to: 8
      label: '+4'
    - from: 8
      to: 12
      label: '+4'
  activity:
    type: formula
    prompt: Laddoos on plates. Set plates and laddoos on each.
    inputs:
    - name: p
      label: Plates
      min: 1
      max: 10
      step: 1
      start: 1
    - name: l
      label: Laddoos on each
      min: 1
      max: 10
      step: 1
      start: 1
    outputs:
    - name: tot
      label: Laddoos in all
      expr: p*l
    goals:
    - prompt: 3 plates with 4 laddoos each.
      want:
        p: 3
        l: 4
      mistakes:
      - when:
          p: 4
          l: 3
        say: That's 4 plates of 3. Same total, but the story has 3 plates.
    - prompt: 12 laddoos on 2 plates, the same on each.
      want:
        p: 2
        tot: 12
      mistakes:
      - when:
          p: 2
          l: 10
        say: 2 + 10 adds. 2 plates of 6 make 12.
    - prompt: 15 laddoos on 5 plates.
      want:
        p: 5
        tot: 15
      mistakes:
      - when:
          p: 5
          l: 10
        say: 5 + 10 adds. 5 plates of how many make 15?
  items:
  - prompt: 3 plates with 4 laddoos each. How many laddoos?
    answer: '12'
    check: 3*4
    difficulty: 1
    hints:
    - 4 + 4 + 4.
    - Count in fours.
    solution: 3 × 4 = 12.
    mistakes:
      '7': c3_count_once
  - prompt: 4 rakhis with 5 beads each. How many beads?
    answer: '20'
    check: 4*5
    difficulty: 1
    hints:
    - 5 + 5 + 5 + 5.
    - Count in fives.
    solution: 4 × 5 = 20.
    mistakes:
      '9': c3_count_once
  - prompt: 2 + 2 + 2 + 2 + 2 = ?
    answer: '10'
    check: 5*2
    difficulty: 1
    hints:
    - Five 2s.
    - Count in twos.
    solution: 5 × 2 = 10.
    mistakes: {"8": "m3_repeat_add", "12": "m3_repeat_add"}
  - prompt: '3 × 4 means:'
    options:
    - 3 groups of 4
    - 3 + 4
    - 4 − 3
    - '34'
    answer: 3 groups of 4
    difficulty: 2
    hints:
    - × means groups of.
    - Not adding the two numbers.
    solution: 3 × 4 means 3 groups of 4.
    mistakes:
      3 + 4: c3_count_once
  - prompt: 6 brothers each get 2 sweets. How many sweets?
    answer: '12'
    check: 6*2
    difficulty: 2
    hints:
    - 2 six times.
    - 6 × 2.
    solution: 6 × 2 = 12.
    mistakes:
      '8': c3_count_once
  - prompt: Which shows equal groups?
    options:
    - 3 bags with 5 apples each
    - a bag of 3 and a bag of 7
    - 1 apple and 5 bananas
    - an empty bag
    answer: 3 bags with 5 apples each
    difficulty: 1
    hints:
    - Equal means the same.
    - Same number in each.
    solution: 3 bags with 5 each are equal groups.
    mistakes: {"a bag of 3 and a bag of 7": "m3_equal_groups"}
- code: cbse3m.rb.tables
  title: Times tables of 2, 3, 4, 5 and 10
  after:
  - cbse3m.rb.groups
  notes: |
    Tables come from skip counting: 2s (2, 4, 6...), 3s, 4s, 5s (end in 0 or 5), 10s (end in 0). Order does not matter:
    3 × 5 = 5 × 3. Arrays (rows and columns) show multiplication: 4 rows of 3 = 12.
  explanations:
    text: 'Times tables are skip counting. Count in 5s: 5, 10, 15, 20. So 4 × 5 = 20. Swapping the numbers gives the same answer: 3 × 5 = 5 × 3 = 15.'
    visual: 'Draw 4 rows of 3 stars. Count by rows (3, 6, 9, 12) and by columns (4, 8, 12): both give 12.'
    step_by_step: 'Step 1: Pick the number to skip count by. Step 2: Count that many jumps. Step 3: The last number is the answer.'
    real_world: 'Fingers come in 5s: 3 children''s hands have 3 × 5 = 15 fingers.'
  picture:
    kind: bars
    bars:
    - label: 2 × 5
      value: 10
    - label: 3 × 5
      value: 15
    - label: 4 × 5
      value: 20
    alt: Two fives make 10, three fives 15 and four fives 20.
    unit: total
  activity:
    type: number_line
    min: 0
    max: 30
    step: 1
    start: 0
    prompt: Skip count to find the answer. Mark it.
    goals:
    - prompt: 4 × 5
      target: 20
      mistakes:
      - when:
          v: 9
        say: '4 + 5 adds. Count in 5s four times: 5, 10, 15, 20.'
      - when:
          v: 25
        say: That's 5 fives. You need 4.
    - prompt: 3 × 10
      target: 30
      mistakes:
      - when:
          v: 13
        say: 3 + 10 adds. Count in 10s three times.
    - prompt: 6 × 2
      target: 12
      mistakes:
      - when:
          v: 8
        say: 6 + 2 adds. Count in 2s six times.
  items:
  - prompt: 5 × 4 = ?
    answer: '20'
    check: 5*4
    difficulty: 1
    hints:
    - Count in 5s four times.
    - 5, 10, 15, 20.
    solution: 5 × 4 = 20.
    mistakes: {"9": "m5_times_table", "25": "m5_times_table"}
  - prompt: 3 × 3 = ?
    answer: '9'
    check: 3*3
    difficulty: 1
    hints:
    - 3, 6, 9.
    - Three 3s.
    solution: 3 × 3 = 9.
    mistakes:
      '6': c3_count_once
  - prompt: 10 × 7 = ?
    answer: '70'
    check: 10*7
    difficulty: 1
    hints:
    - Count in 10s seven times.
    - Add a 0 to 7.
    solution: 10 × 7 = 70.
    mistakes:
      '17': c3_place
  - prompt: 4 rows of 3 chairs. How many chairs?
    answer: '12'
    check: 4*3
    difficulty: 2
    hints:
    - "Count in threes, once for each row."
    - 4 × 3.
    solution: 4 × 3 = 12.
    mistakes:
      '7': c3_count_once
  - prompt: If 3 × 5 = 15, what is 5 × 3?
    answer: '15'
    check: 5*3
    difficulty: 2
    hints:
    - Order does not matter.
    - Same answer.
    solution: 5 × 3 = 15 too.
    mistakes: {"53": "m3_turnaround", "8": "m3_turnaround"}
  - prompt: 2 × 8 = ?
    answer: '16'
    check: 2*8
    difficulty: 1
    hints:
    - Double 8.
    - 8 + 8.
    solution: 2 × 8 = 16.
    mistakes: {"10": "m5_times_table", "14": "m5_times_table"}
