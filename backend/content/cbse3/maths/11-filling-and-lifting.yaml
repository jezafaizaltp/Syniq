# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 11
title: Filling and Lifting
tips:
  m3_add_kg: "Put both into one bag: 2 kg and 3 kg more."
  m3_balance_weights: "The pumpkin balances all the weights together. Add them up."
  m3_bottles: "Pour one bottle at a time into the bucket and count until it is full."
  m3_double: "Each jug fills 5 glasses. Two jugs fill 5 and 5."
  m3_heavier: "Which one would be hard to lift with one finger?"
  m3_kg: "Rice is weighed on a scale."
  m3_litres: "Milk is poured, like water. Liquids are measured in ..."
  m3_most_water: "Which would you use to bathe or wash a floor? It holds the most."
  m3_overflow: "Water spilling over means the glass could not take it all."
  m3_size_weight: "Big is not always heavy. A balloon is full of air."
  c3m11_fill: Picture pouring one container into the other. Does it spill over, or is there room left?
  c3m11_count: Count how many of the small cups it takes to fill the big one, one pour at a time.
  c3m11_balance: 'On a balance, picture the pans: the side that sinks holds the heavier thing.'
  c3m11_size: Do not judge by size alone. Imagine lifting each one in your hand.

concepts:
- code: cbse3m.fl.capacity
  title: How much a container holds
  notes: |
    Capacity is how much a container can hold. Compare by filling: a bucket holds more than a mug. Measure liquids in
    litres (L) and millilitres (mL); 1 L = 1000 mL. A water bottle often holds 1 L; a glass about 200 mL. Small cups can
    be used to count how many fill a jug.
  explanations:
    text: Capacity tells how much a container can hold. A bucket holds more than a glass. We measure liquids in litres. To compare, fill one container and pour it into the other.
    visual: Draw a bucket, a jug and a glass in a row, from the one that holds the most to the one that holds the least.
    step_by_step: 'Step 1: Fill one container. Step 2: Pour into the other. Step 3: If it overflows, the first holds more.'
    real_world: Milk comes in packets of half a litre and 1 litre.
  picture:
    kind: bars
    bars:
    - label: Glass
      value: 1
    - label: Jug
      value: 5
    - label: Bucket
      value: 50
    alt: A glass holds about 1 cup, a jug 5 cups and a bucket about 50 cups.
    unit: cups
  activity:
    type: sort
    prompt: Which holds more?
    bins:
    - The first holds more
    - The second holds more
    items:
    - label: A bucket or a glass
      bin: The first holds more
      clue: Which is bigger inside?
      why: A bucket.
    - label: A water tank or a jug
      bin: The first holds more
      clue: Think of filling them.
      why: A tank.
    - label: A big bottle or a spoon
      bin: The first holds more
      clue: Which needs more water to fill?
      why: The bottle.
    - label: A cup or a bathtub
      bin: The second holds more
      clue: Imagine pouring water.
      why: The bathtub.
    - label: A spoon or a bowl
      bin: The second holds more
      clue: Which is deeper?
      why: The bowl.
    - label: A glass or a pot
      bin: The second holds more
      clue: Which fills more glasses?
      why: The pot.
  lesson:
    - teach: 'Capacity means how much a container can hold. A bucket holds more water than a glass. To compare, fill one and pour into the other: if it spills, the first held more.'
      check:
        prompt: A full mug is poured into a glass and the glass overflows. Which holds more?
        options:
        - the mug
        - the glass
        - both the same
        answer: the mug
        why: The glass could not take all the mug's water.
    - teach: 'We can count small cups to measure: a jug that fills 6 glasses holds 6 glasses of water. 2 such jugs fill 12 glasses.'
      picture:
        kind: bars
        unit: glasses
        bars:
        - label: jug
          value: 6
        - label: bottle
          value: 4
        - label: mug
          value: 2
        alt: A jug holds 6 glasses, a bottle 4, a mug 2.
      check:
        prompt: A bottle fills 4 glasses. How many glasses do 3 bottles fill?
        options:
        - '12'
        - '7'
        - '4'
        answer: '12'
        why: 4 + 4 + 4 = 12.
    - teach: 'Liquids are measured in litres (L). Milk packets are often half a litre: 2 half-litre packets make 1 litre. Small amounts are in millilitres (mL); 1 L = 1000 mL.'
      check:
        prompt: How many half-litre packets make 1 litre?
        options:
        - '2'
        - '1'
        - '4'
        answer: '2'
        why: Two halves make a whole litre.
  items:
  - prompt: Which holds the most water?
    options:
    - bucket
    - cup
    - spoon
    - glass
    answer: bucket
    difficulty: 1
    hints:
    - Think of bath time.
    - Biggest container.
    solution: A bucket holds the most.
    mistakes: {"glass": "m3_most_water"}
  - prompt: 'Milk is measured in:'
    options:
    - litres
    - kilograms
    - metres
    - hours
    answer: litres
    difficulty: 1
    hints:
    - Milk is a liquid.
    - Milk packets say 1 L.
    solution: Liquids are measured in litres.
    mistakes: {"kilograms": "m3_litres"}
  - prompt: A jug fills 5 glasses. How many glasses do 2 jugs fill?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - 2 × 5.
    solution: 10 glasses.
    mistakes: {"7": "m3_double", "25": "m3_double"}
  - prompt: A bottle holds 1 litre. How many bottles fill a 6 litre bucket?
    answer: '6'
    check: 6/1
    difficulty: 1
    hints:
    - Each bottle 1 L.
    - 6 ÷ 1.
    solution: 6 bottles.
    mistakes: {"1": "m3_bottles", "5": "m3_bottles"}
  - prompt: 'Pouring a full jug into a glass makes the glass overflow. This means:'
    options:
    - the jug holds more
    - the glass holds more
    - they hold the same
    - the jug is empty
    answer: the jug holds more
    difficulty: 2
    hints:
    - Overflow means too much water.
    - Which was bigger?
    solution: The jug holds more than the glass.
    mistakes: {"the glass holds more": "m3_overflow"}
  - prompt: How many half-litre packets make 2 litres?
    answer: '4'
    check: 2*2
    difficulty: 2
    hints:
    - 2 halves make 1 litre.
    - 2 + 2.
    solution: 4 half-litre packets make 2 L.
    mistakes:
      '1': c3_count_once
  - prompt: A pot fills 8 cups. How many cups do 2 pots fill?
    answer: '16'
    check: 8*2
    difficulty: 1
    hints:
    - Double 8.
    - 8 + 8.
    solution: 'Step 1: 8 + 8. Step 2: = 16 cups.'
    mistakes:
      '10': c3m11_count
      '8': c3m11_count
  - prompt: Which holds the least water?
    options:
    - a spoon
    - a bottle
    - a tank
    answer: a spoon
    difficulty: 1
    hints:
    - Picture each one full.
    - Which is smallest inside?
    solution: 'Step 1: A tank holds the most, a spoon the least. Step 2: The spoon.'
    mistakes:
      a bottle: c3m11_fill
      a tank: c3m11_fill
  - prompt: How many half-litre packets make 3 litres?
    answer: '6'
    check: 3*2
    difficulty: 2
    hints:
    - 2 packets make 1 litre.
    - 3 litres need 3 times as many.
    solution: 'Step 1: 1 L = 2 packets. Step 2: 3 L = 6 packets.'
    mistakes:
      '3': c3m11_count
      '4': c3m11_count
  - prompt: A bucket holds 10 litres. 4 litres are used. How many litres are left?
    answer: '6'
    check: 10-4
    difficulty: 1
    hints:
    - Take away what was used.
    - 10 − 4.
    solution: 'Step 1: 10 − 4. Step 2: = 6 litres.'
    mistakes:
      '14': c3m11_fill
      '4': c3m11_fill
  - prompt: Which is measured in litres?
    options:
    - petrol in a scooter
    - the length of a rope
    - the weight of rice
    answer: petrol in a scooter
    difficulty: 1
    hints:
    - Litres are for liquids.
    - Which one can be poured?
    solution: 'Step 1: Rope is length, rice is weight. Step 2: Petrol is a liquid, so litres.'
    mistakes:
      the length of a rope: c3m11_fill
      the weight of rice: c3m11_fill
  - prompt: A water tank needs 20 buckets to fill. 12 are already poured in. How many more buckets?
    answer: '8'
    check: 20-12
    difficulty: 2
    hints:
    - How many are still needed?
    - 20 − 12.
    solution: 'Step 1: 20 − 12. Step 2: = 8 buckets.'
    mistakes:
      '32': c3m11_count
      '12': c3m11_count
  - prompt: Jug A fills 5 glasses and Jug B fills 7 glasses of the same size. Which jug holds more?
    options:
    - Jug B
    - Jug A
    - they hold the same
    answer: Jug B
    difficulty: 2
    hints:
    - More glasses means more water.
    - Compare 5 and 7.
    solution: 'Step 1: 7 > 5. Step 2: Jug B holds more.'
    mistakes:
      Jug A: c3m11_count
      they hold the same: c3m11_count
  - prompt: Why must the glasses be the same size when we count glasses to compare jugs?
    options:
    - so the count means the same amount
    - so they look nice
    - so they are easier to wash
    answer: so the count means the same amount
    difficulty: 3
    hints:
    - Think of a tiny glass and a big glass.
    - Would 5 of each hold the same?
    solution: 'Step 1: Different glasses hold different amounts. Step 2: Same-size glasses make the counts fair to compare.'
    mistakes:
      so they look nice: c3m11_count
      so they are easier to wash: c3m11_count
  - prompt: A family drinks 2 litres of milk a day. How many litres in 5 days?
    answer: '10'
    check: 2*5
    difficulty: 2
    hints:
    - 2 litres each day.
    - 2 × 5.
    solution: 'Step 1: 2 + 2 + 2 + 2 + 2. Step 2: = 10 litres.'
    mistakes:
      '7': c3m11_count
      '12': c3m11_count
- code: cbse3m.fl.weight
  title: Heavy and light
  after:
  - cbse3m.fl.capacity
  notes: |
    Weight tells how heavy something is. Compare with hands or a balance: the heavier side goes down. Big things are not
    always heavy (a balloon is big but light). Weight in kilograms (kg) and grams (g); 1 kg = 1000 g. Rice, vegetables
    are bought by the kg.
  explanations:
    text: 'Weight tells us how heavy a thing is. On a balance, the heavier side goes down. Big things are not always heavy: a balloon is big but very light. We measure weight in kilograms.'
    visual: Draw a see-saw balance with a brick on one side going down and a feather on the other going up.
    step_by_step: 'Step 1: Put one thing on each pan. Step 2: See which side goes down. Step 3: That side is heavier.'
    real_world: At the market, vegetables are weighed in kilograms on a balance.
  picture:
    kind: compare
    columns:
    - title: Heavy
      points:
      - brick
      - bag of rice
      - pumpkin
    - title: Light
      points:
      - feather
      - balloon
      - leaf
    alt: A brick, a bag of rice and a pumpkin are heavy; a feather, a balloon and a leaf are light.
  activity:
    type: sort
    prompt: Which is heavier?
    bins:
    - The first is heavier
    - The second is heavier
    items:
    - label: A brick or a balloon
      bin: The first is heavier
      clue: Big isn't always heavy. Lift them in your head.
      why: The brick.
    - label: A pumpkin or a feather
      bin: The first is heavier
      clue: Which would make the balance go down?
      why: The pumpkin.
    - label: A stone or a leaf
      bin: The first is heavier
      clue: Which drops faster in your hand?
      why: The stone.
    - label: A pillow or a bag of rice
      bin: The second is heavier
      clue: The pillow is big but soft.
      why: The rice.
    - label: A big empty box or a small iron ball
      bin: The second is heavier
      clue: Size can trick you.
      why: The iron ball.
    - label: A sheet of paper or a book
      bin: The second is heavier
      clue: Which presses your hand more?
      why: The book.
  lesson:
    - teach: 'Weight tells how heavy something is. You can feel it by lifting: a school bag is heavier than a pencil. A balance compares: the heavier side goes down.'
      picture:
        kind: compare
        columns:
        - title: Pan goes down
          points:
          - heavier thing
        - title: Pan goes up
          points:
          - lighter thing
        alt: On a balance, the heavier side goes down and the lighter side goes up.
      check:
        prompt: 'On a balance, the lighter side:'
        options:
        - goes up
        - goes down
        - stays on the floor
        answer: goes up
        why: The heavier side pulls down, so the lighter side rises.
    - teach: Big is not always heavy. A big balloon is light; a small stone is heavy. Lift or weigh to find out; do not just look.
      check:
        prompt: Which of these is the heaviest?
        options:
        - a small iron ball
        - a big pillow
        - a big balloon
        answer: a small iron ball
        why: Iron is heavy for its size; pillows and balloons are full of air or soft stuff.
    - teach: We weigh in kilograms (kg). Rice, sugar and vegetables are sold by the kg. Small things like a letter are weighed in grams (g); 1 kg = 1000 g.
      check:
        prompt: Which is weighed in kilograms?
        options:
        - a bag of potatoes
        - a bottle of water's capacity
        - a ribbon's length
        answer: a bag of potatoes
        why: Kilograms measure weight; capacity is litres, length is metres.
  items:
  - prompt: 'On a balance, the heavier side:'
    options:
    - goes down
    - goes up
    - stays level
    - falls off
    answer: goes down
    difficulty: 1
    hints:
    - Think of a see-saw.
    - Heavier pushes down.
    solution: The heavier side goes down.
    mistakes: {"goes up": "m4_balance"}
  - prompt: Which is heavier?
    options:
    - a brick
    - a feather
    - a leaf
    - a paper
    answer: a brick
    difficulty: 1
    hints:
    - Lift them in your mind.
    - Hard and solid.
    solution: A brick is heavier.
    mistakes: {"a feather": "m3_heavier"}
  - prompt: 'Rice is bought by the:'
    options:
    - kilogram
    - litre
    - metre
    - hour
    answer: kilogram
    difficulty: 1
    hints:
    - It is weighed.
    - kg.
    solution: Rice is weighed in kilograms.
    mistakes: {"litre": "m3_kg"}
  - prompt: A big balloon and a small stone. Which is heavier?
    options:
    - the small stone
    - the big balloon
    - they are the same
    - cannot be weighed
    answer: the small stone
    difficulty: 2
    hints:
    - Big does not mean heavy.
    - Balloons are full of air.
    solution: The small stone is heavier.
    mistakes: {"the big balloon": "m3_size_weight"}
  - prompt: A bag has 2 kg of potatoes and 3 kg of onions. How many kg in all?
    answer: '5'
    check: 2 + 3
    difficulty: 1
    hints:
    - Add.
    - 2 + 3.
    solution: 2 + 3 = 5 kg.
    mistakes: {"6": "m3_add_kg", "1": "m3_add_kg"}
  - prompt: A pumpkin balances 4 one-kg weights. How heavy is it in kg?
    answer: '4'
    check: 4*1
    difficulty: 2
    hints:
    - Each weight is 1 kg.
    - 4 × 1.
    solution: The pumpkin weighs 4 kg.
    mistakes: {"1": "m3_balance_weights", "8": "m3_balance_weights"}
  - prompt: A bag has 3 kg of rice and 2 kg of sugar. How many kg in all?
    answer: '5'
    check: 3+2
    difficulty: 1
    hints:
    - Put the weights together.
    - 3 + 2.
    solution: 'Step 1: 3 + 2. Step 2: = 5 kg.'
    mistakes:
      '1': c3m11_balance
      '6': c3m11_balance
  - prompt: A watermelon balances 3 one-kg weights. How heavy is it?
    answer: '3'
    check: '3'
    difficulty: 1
    hints:
    - Balanced means the same weight.
    - Count the 1 kg weights.
    solution: 'Step 1: The pans are level. Step 2: The watermelon weighs 3 kg.'
    mistakes:
      '1': c3m11_balance
      '4': c3m11_balance
  - prompt: Which is lighter?
    options:
    - a feather
    - a book
    - a brick
    answer: a feather
    difficulty: 1
    hints:
    - Imagine holding each one.
    - Which can float in the air?
    solution: 'Step 1: A brick and a book are heavy. Step 2: A feather is the lightest.'
    mistakes:
      a book: c3m11_size
      a brick: c3m11_size
  - prompt: A bag of onions weighs 10 kg. 4 kg are used. How much is left?
    answer: '6'
    check: 10-4
    difficulty: 1
    hints:
    - Take away what was used.
    - 10 − 4.
    solution: 'Step 1: 10 − 4. Step 2: = 6 kg.'
    mistakes:
      '14': c3m11_balance
      '4': c3m11_balance
  - prompt: A pumpkin goes down on a balance against a cabbage. Which is heavier?
    options:
    - the pumpkin
    - the cabbage
    - they weigh the same
    answer: the pumpkin
    difficulty: 1
    hints:
    - Which side went down?
    - Down means heavier.
    solution: 'Step 1: The pumpkin side went down. Step 2: So the pumpkin is heavier.'
    mistakes:
      the cabbage: c3m11_balance
      they weigh the same: c3m11_balance
  - prompt: Is a bigger thing always heavier?
    options:
    - no, a big balloon can be lighter than a small stone
    - yes, always
    - yes, if it is round
    answer: no, a big balloon can be lighter than a small stone
    difficulty: 2
    hints:
    - Think of a balloon and a stone.
    - Which is bigger? Which is heavier?
    solution: 'Step 1: A balloon is big but full of air. Step 2: A small stone can be heavier, so bigger is not always heavier.'
    mistakes:
      yes, always: c3m11_size
      yes, if it is round: c3m11_size
  - prompt: 4 bags each hold 5 kg of wheat. How many kg in all?
    answer: '20'
    check: 4*5
    difficulty: 2
    hints:
    - 4 groups of 5.
    - 5, 10, 15, 20.
    solution: 'Step 1: 4 × 5. Step 2: = 20 kg.'
    mistakes:
      '9': c3m11_balance
      '15': c3m11_balance
  - prompt: One side of a balance has 2 kg + 1 kg weights. The other side has a bag of dal that balances. How heavy is the dal?
    answer: '3'
    check: 2+1
    difficulty: 2
    hints:
    - Balanced means equal.
    - Add the weights on the other side.
    solution: 'Step 1: 2 + 1 = 3 kg. Step 2: The dal weighs 3 kg.'
    mistakes:
      '2': c3m11_balance
      '1': c3m11_balance
  - prompt: A box of apples weighs 7 kg. The empty box weighs 1 kg. How much do the apples weigh?
    answer: '6'
    check: 7-1
    difficulty: 3
    hints:
    - The 7 kg includes the box.
    - Take the box's weight away.
    solution: 'Step 1: 7 − 1. Step 2: = 6 kg of apples.'
    mistakes:
      '8': c3m11_balance
      '7': c3m11_balance
