# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 11. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 11
title: Filling and Lifting
concepts:
- code: cbse3m.fl.capacity
  title: How much a container holds
  notes: |
    Capacity is how much a container can hold. Compare by filling: a bucket holds more than a mug. Measure liquids in
    litres (L) and millilitres (mL); 1 L = 1000 mL. A water bottle often holds 1 L; a glass about 200 mL. Small cups can
    be used to count how many fill a jug.
  explanations:
    text: Capacity tells how much a container can hold. A bucket holds more than a glass. We measure liquids in litres. To compare, fill one container and pour it into the other.
    visual: Draw a bucket, a jug and a glass in a row, from the one that holds the most to the one that holds the least.
    step_by_step: 'Step 1: Fill one container. Step 2: Pour into the other. Step 3: If it overflows, the first holds more.'
    real_world: Milk comes in packets of half a litre and 1 litre.
  picture:
    kind: bars
    bars:
    - label: Glass
      value: 1
    - label: Jug
      value: 5
    - label: Bucket
      value: 50
    alt: A glass holds about 1 cup, a jug 5 cups and a bucket about 50 cups.
    unit: cups
  items:
  - prompt: Which holds the most water?
    options:
    - bucket
    - cup
    - spoon
    - glass
    answer: bucket
    difficulty: 1
    hints:
    - Think of bath time.
    - Biggest container.
    solution: A bucket holds the most.
  - prompt: 'Milk is measured in:'
    options:
    - litres
    - kilograms
    - metres
    - hours
    answer: litres
    difficulty: 1
    hints:
    - Milk is a liquid.
    - Milk packets say 1 L.
    solution: Liquids are measured in litres.
  - prompt: A jug fills 5 glasses. How many glasses do 2 jugs fill?
    answer: '10'
    check: 2*5
    difficulty: 1
    hints:
    - 5 + 5.
    - 2 × 5.
    solution: 10 glasses.
  - prompt: A bottle holds 1 litre. How many bottles fill a 6 litre bucket?
    answer: '6'
    check: 6/1
    difficulty: 1
    hints:
    - Each bottle 1 L.
    - 6 ÷ 1.
    solution: 6 bottles.
  - prompt: 'Pouring a full jug into a glass makes the glass overflow. This means:'
    options:
    - the jug holds more
    - the glass holds more
    - they hold the same
    - the jug is empty
    answer: the jug holds more
    difficulty: 2
    hints:
    - Overflow means too much water.
    - Which was bigger?
    solution: The jug holds more than the glass.
  - prompt: How many half-litre packets make 2 litres?
    answer: '4'
    check: 2*2
    difficulty: 2
    hints:
    - 2 halves make 1 litre.
    - 2 + 2.
    solution: 4 half-litre packets make 2 L.
    mistakes:
      '1': c3_count_once
- code: cbse3m.fl.weight
  title: Heavy and light
  after:
  - cbse3m.fl.capacity
  notes: |
    Weight tells how heavy something is. Compare with hands or a balance: the heavier side goes down. Big things are not
    always heavy (a balloon is big but light). Weight in kilograms (kg) and grams (g); 1 kg = 1000 g. Rice, vegetables
    are bought by the kg.
  explanations:
    text: 'Weight tells us how heavy a thing is. On a balance, the heavier side goes down. Big things are not always heavy: a balloon is big but very light. We measure weight in kilograms.'
    visual: Draw a see-saw balance with a brick on one side going down and a feather on the other going up.
    step_by_step: 'Step 1: Put one thing on each pan. Step 2: See which side goes down. Step 3: That side is heavier.'
    real_world: At the market, vegetables are weighed in kilograms on a balance.
  picture:
    kind: compare
    columns:
    - title: Heavy
      points:
      - brick
      - bag of rice
      - pumpkin
    - title: Light
      points:
      - feather
      - balloon
      - leaf
    alt: A brick, a bag of rice and a pumpkin are heavy; a feather, a balloon and a leaf are light.
  items:
  - prompt: 'On a balance, the heavier side:'
    options:
    - goes down
    - goes up
    - stays level
    - falls off
    answer: goes down
    difficulty: 1
    hints:
    - Think of a see-saw.
    - Heavier pushes down.
    solution: The heavier side goes down.
  - prompt: Which is heavier?
    options:
    - a brick
    - a feather
    - a leaf
    - a paper
    answer: a brick
    difficulty: 1
    hints:
    - Lift them in your mind.
    - Hard and solid.
    solution: A brick is heavier.
  - prompt: 'Rice is bought by the:'
    options:
    - kilogram
    - litre
    - metre
    - hour
    answer: kilogram
    difficulty: 1
    hints:
    - It is weighed.
    - kg.
    solution: Rice is weighed in kilograms.
  - prompt: A big balloon and a small stone. Which is heavier?
    options:
    - the small stone
    - the big balloon
    - they are the same
    - cannot be weighed
    answer: the small stone
    difficulty: 2
    hints:
    - Big does not mean heavy.
    - Balloons are full of air.
    solution: The small stone is heavier.
  - prompt: A bag has 2 kg of potatoes and 3 kg of onions. How many kg in all?
    answer: '5'
    check: 2 + 3
    difficulty: 1
    hints:
    - Add.
    - 2 + 3.
    solution: 2 + 3 = 5 kg.
  - prompt: A pumpkin balances 4 one-kg weights. How heavy is it in kg?
    answer: '4'
    check: 4*1
    difficulty: 2
    hints:
    - Each weight is 1 kg.
    - 4 × 1.
    solution: The pumpkin weighs 4 kg.
