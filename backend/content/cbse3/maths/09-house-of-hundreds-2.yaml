    difficulty: 2
    hints:
    - '3 − 8: open a ten.'
    - 13 − 8, then 5 − 3.
    solution: 'Step 1: 13 − 8 = 5, 5 − 3 = 2. Step 2: 5 − 2 = 3: 325.'
    mistakes:
      '335': c3m9_borrow
      '801': c3m9_line
  - prompt: A shop had 350 notebooks and sold 125. How many are left?
    answer: '225'
    check: 350-125
    difficulty: 2
    hints:
    - 0 − 5 needs a borrow.
    - 10 − 5, then 4 − 2.
    solution: 'Step 1: 10 − 5 = 5, 4 − 2 = 2. Step 2: 3 − 1 = 2: 225.'
    mistakes:
      '235': c3m9_borrow
      '475': c3m9_line
  - prompt: 720 − 60 = ?
    answer: '660'
    check: 720-60
    difficulty: 2
    hints:
    - 2 tens − 6 tens needs a borrow.
    - Open 1 hundred into 10 tens.
    solution: 'Step 1: 12 tens − 6 tens = 6 tens. Step 2: 6 hundreds stay: 660.'
    mistakes:
      '760': c3m9_borrow
      '160': c3m9_line
  - prompt: If 800 − 350 = 450, what is 450 + 350?
    answer: '800'
    check: 450+350
    difficulty: 1
    hints:
    - Adding back undoes taking away.
    - You get the start number.
    solution: 'Step 1: 450 + 350. Step 2: = 800.'
    mistakes:
      '100': c3m9_line
      '700': c3m9_carry
  - prompt: Village A has 485 people. Village B has 312. How many more people are in Village A?
    answer: '173'
    check: 485-312
    difficulty: 2
    hints:
    - Bigger minus smaller.
    - 5 − 2, 8 − 1, 4 − 3.
    solution: 'Step 1: 5 − 2 = 3, 8 − 1 = 7, 4 − 3 = 1. Step 2: = 173.'
    mistakes:
      '797': c3m9_line
      '183': c3m9_line
  - prompt: A rope is 500 cm long. 178 cm is cut off. How long is the rope now?
    answer: '322'
    check: 500-178
    difficulty: 3
    hints:
    - 500 has 0 tens and 0 ones; borrow from the hundreds.
    - Think of 500 as 4 hundreds, 9 tens, 10 ones.
    solution: 'Step 1: 10 − 8 = 2, 9 − 7 = 2, 4 − 1 = 3. Step 2: = 322 cm.'
    mistakes:
      '478': c3m9_borrow
      '432': c3m9_borrow
  - prompt: Is 600 − 230 = 470 correct?
    options:
    - no, because 470 + 230 = 700
    - yes, because 600 − 200 = 400
    - yes, because 470 is less than 600
    answer: no, because 470 + 230 = 700
    difficulty: 3
    hints:
    - Check by adding back.
    - Does it give 600?
    solution: 'Step 1: 470 + 230 = 700, not 600. Step 2: So it is wrong (the right answer is 370).'
    mistakes:
      yes, because 600 − 200 = 400: c3m9_line
      yes, because 470 is less than 600: c3m9_line
