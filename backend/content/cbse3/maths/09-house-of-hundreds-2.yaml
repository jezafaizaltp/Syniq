- code: cbse3m.hh2.sub
  title: Subtracting 3-digit numbers
  after:
  - cbse3m.hh2.add
  notes: |
    Subtract ones, then tens, then hundreds. 586 − 243 = 343. Borrowing: 452 − 127: 2 < 7, borrow a ten: 12 − 7 = 5;
    4 − 2 = 2; 4 − 1 = 3; answer 325. Check by adding: 325 + 127 = 452.
  explanations:
    text: To subtract, start with the ones. If the top digit is smaller, borrow one ten (or one hundred) from the next column. Always check by adding your answer to the number you took away.
    visual: 'Write 452 − 127 in columns. 2 is less than 7, so borrow: the 5 tens become 4, and the 2 ones become 12.'
    step_by_step: 'Step 1: Line up the columns. Step 2: Subtract ones, borrowing if needed. Step 3: Subtract tens. Step 4: Subtract hundreds. Step 5: Check by adding.'
    real_world: 'A train has 452 seats and 127 are filled: 325 seats are empty.'
  picture:
    kind: flow
    steps:
    - 452 − 127
    - 'Borrow: 12 − 7 = 5'
    - 'Tens: 4 − 2 = 2'
    - 'Hundreds: 4 − 1 = 3'
    - Answer 325
    alt: '452 minus 127: borrow so 12 minus 7 is 5, tens 4 minus 2 is 2, hundreds 4 minus 1 is 3, answer 325.'
  activity:
    type: sort
    prompt: Take away. Which answer does each one make?
    bins:
    - '274'
    - '343'
    - '499'
    items:
    - label: 432 − 158
      bin: '274'
      clue: '2 − 8: borrow. Then 2 − 5: borrow again.'
      why: '274. Check: 274 + 158 = 432.'
    - label: 374 − 100
      bin: '274'
      clue: Take one hundred.
      why: '274.'
    - label: 300 − 26
      bin: '274'
      clue: Borrow from the hundreds.
      why: '274.'
    - label: 586 − 243
      bin: '343'
      clue: 'Ones, tens, hundreds: no borrowing.'
      why: '343.'
    - label: 443 − 100
      bin: '343'
      clue: Take a hundred.
      why: '343.'
    - label: 400 − 57
      bin: '343'
      clue: Borrow from the hundreds.
      why: '343.'
    - label: 500 − 1
      bin: '499'
      clue: Borrowing from 5 hundreds leaves 4 hundreds.
      why: '499.'
    - label: 999 − 500
      bin: '499'
      clue: Take 5 hundreds.
      why: '499.'
    - label: 600 − 101
      bin: '499'
      clue: Take a hundred, then one more.
      why: '499.'
  lesson:
    - teach: 'To subtract 3-digit numbers, line up the places and take away ones, then tens, then hundreds. 768 − 325: 8 − 5 = 3, 6 − 2 = 4, 7 − 3 = 4. Answer 443.'
      check:
        prompt: 975 − 432 = ?
        options:
        - '543'
        - '547'
        - '1407'
        answer: '543'
        why: 5 − 2 = 3, 7 − 3 = 4, 9 − 4 = 5.
      ways:
      - style: step_by_step
        teach: 'Take away 697 − 452. Step 1: Ones: 7 − 2 = 5. Step 2: Tens: 9 − 5 = 4. Step 3: Hundreds: 6 − 4 = 2. Step 4: The answer is 245.'
      - style: visual
        teach: 697 − 452 worked out one place at a time.
        picture:
          kind: compare
          columns:
          - title: Hundreds
            points:
            - 6 − 4
            - = 2
          - title: Tens
            points:
            - 9 − 5
            - = 4
          - title: Ones
            points:
            - 7 − 2
            - = 5
          alt: 'To take 452 from 697, take the ones: 7 − 2 = 5, the tens: 9 − 5 = 4, and the hundreds: 6 − 4 = 2. The answer is 245.'
    - teach: 'If a top digit is smaller, borrow from the next place. 532 − 218: 2 − 8 cannot be done, so open 1 ten: 12 − 8 = 4. Tens: 2 − 1 = 1. Hundreds: 5 − 2 = 3. Answer 314.'
      picture:
        kind: flow
        steps:
        - 532 − 218
        - '2 < 8: open a ten'
        - 12 − 8 = 4
        - 2 − 1 = 1 ten
        - 5 − 2 = 3 hundreds
        - '314'
        alt: Steps for 532 − 218 with one borrow, giving 314.
      check:
        prompt: 641 − 125 = ?
        options:
        - '516'
        - '524'
        - '526'
        answer: '516'
        why: 11 − 5 = 6, 3 − 2 = 1, 6 − 1 = 5.
      ways:
      - style: visual
        teach: 'Borrowing in 643 − 127: one ten is opened into ten ones.'
        picture:
          kind: flow
          steps:
          - 'Ones: 3 − 7 cannot be done'
          - 'Open 1 ten: 4 tens become 3 tens'
          - 'Now 13 ones: 13 − 7 = 6'
          - 'Tens: 3 − 2 = 1'
          - 'Hundreds: 6 − 1 = 5'
          - 'Answer: 516'
          alt: 'In 643 − 127, 3 − 7 cannot be done, so one ten is opened: 4 tens become 3 tens and there are 13 ones. 13 − 7 = 6, 3 − 2 = 1 and 6 − 1 = 5. The answer is 516.'
      - style: real_world
        teach: When a shopkeeper has only one 100-rupee note and needs to give 30 rupees, they change the note into ten 10-rupee notes first. Borrowing in subtraction is the same idea.
    - teach: Always check by adding back. If 600 − 245 = 355, then 355 + 245 should be 600. If it is not, look again.
      check:
        prompt: 'To check 420 − 160 = 260, add:'
        options:
        - 260 + 160
        - 420 + 160
        - 420 + 260
        answer: 260 + 160
        why: Answer + what you took away gives back the start.
      ways:
      - style: visual
        teach: Checking a subtraction by adding the answer back.
        picture:
          kind: compare
          columns:
          - title: Subtract
            points:
            - 700 − 248 = 452
          - title: Check
            points:
            - 452 + 248 = 700
            - 'Back to the start: correct'
          alt: 700 − 248 = 452. To check, add 452 + 248. It makes 700, the number we started with, so the subtraction is correct.
      - style: real_world
        teach: A cashier counts the change back into your hand, starting from the price and adding up to the note you paid with. That is checking the subtraction by adding.
