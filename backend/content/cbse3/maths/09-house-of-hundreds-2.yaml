# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 9
title: House of Hundreds–II
tips:
  m3_check_add: "Adding back what you took away gets you to where you started."
  m3_hundreds_add: "3 hundreds and 4 hundreds make how many hundreds?"
  m3_sub_places: "Take ones from ones, tens from tens, hundreds from hundreds."
  c3m9_line: 'Write the numbers one under the other: hundreds under hundreds, tens under tens, ones under ones.'
  c3m9_carry: If a column adds to 10 or more, write the ones and carry 1 to the next column on the left.
  c3m9_borrow: If the top digit is smaller, open one from the next column on the left before taking away.
  c3m9_about: Round each number to the nearest hundred first, then add or take away.

concepts:
- code: cbse3m.hh2.add
  title: Adding 3-digit numbers
  notes: |
    Add ones, then tens, then hundreds. 234 + 152 = 386. Carrying: 268 + 125: 8 + 5 = 13, write 3 carry 1; 6 + 2 + 1 =
    9; 2 + 1 = 3; answer 393. Adding hundreds: 300 + 400 = 700. Estimating: 298 + 201 is about 500.
  explanations:
    text: To add big numbers, start with the ones, then the tens, then the hundreds. If a column makes ten or more, carry the extra ten to the next column.
    visual: 'Write 268 + 125 in columns. Add 8 + 5 = 13: write 3, carry 1 to the tens. Then 6 + 2 + 1 = 9, then 2 + 1 = 3.'
    step_by_step: 'Step 1: Line up hundreds, tens and ones. Step 2: Add ones; carry if 10 or more. Step 3: Add tens with the carry. Step 4: Add hundreds.'
    real_world: 'A school has 234 girls and 152 boys: 386 children in all.'
  picture:
    kind: flow
    steps:
    - 268 + 125
    - 'Ones: 8 + 5 = 13, write 3 carry 1'
    - 'Tens: 6 + 2 + 1 = 9'
    - 'Hundreds: 2 + 1 = 3'
    - Answer 393
    alt: '268 plus 125: ones 13 write 3 carry 1, tens 9, hundreds 3, answer 393.'
  activity:
    type: sort
    prompt: Add. Which answer does each one make?
    bins:
    - '377'
    - '500'
    - '622'
    items:
    - label: 245 + 132
      bin: '377'
      clue: Ones, then tens, then hundreds.
      why: No carrying needed.
    - label: 300 + 77
      bin: '377'
      clue: 3 hundreds and 77.
      why: '377.'
    - label: 177 + 200
      bin: '377'
      clue: Add 2 hundreds.
      why: '377.'
    - label: 368 + 254
      bin: '622'
      clue: '8 + 4 is more than ten: carry.'
      why: '12 ones and 12 tens: carry twice.'
    - label: 422 + 200
      bin: '622'
      clue: Add 2 hundreds.
      why: '622.'
    - label: 600 + 22
      bin: '622'
      clue: 6 hundreds and 22.
      why: '622.'
    - label: 499 + 1
      bin: '500'
      clue: '9 + 1 makes a ten: carry, and again.'
      why: Carrying twice gives 500.
    - label: 250 + 250
      bin: '500'
      clue: Two halves of 500?
      why: '500.'
    - label: 380 + 120
      bin: '500'
      clue: 8 tens + 2 tens is ten tens.
      why: 'Carry a hundred: 500.'
  lesson:
    - teach: 'To add 3-digit numbers, line up the places and add ones, then tens, then hundreds. 213 + 154: ones 3 + 4 = 7, tens 1 + 5 = 6, hundreds 2 + 1 = 3. Answer 367.'
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: H
        - size: 1
          label: T
        - size: 1
          label: O
        rows:
        - size: 1
          label: '213'
        - size: 1
          label: '+154'
        - size: 1
          label: sum
        cells:
        - - '2'
          - '1'
          - '3'
        - - '1'
          - '5'
          - '4'
        - - '3'
          - '6'
          - '7'
        alt: '213 + 154 in columns: 3 hundreds, 6 tens, 7 ones.'
      check:
        prompt: 321 + 456 = ?
        options:
        - '777'
        - '765'
        - '7107'
        answer: '777'
        why: 1 + 6 = 7, 2 + 5 = 7, 3 + 4 = 7.
    - teach: 'When a column makes 10 or more, carry. 147 + 238: ones 7 + 8 = 15, write 5 carry 1. Tens 4 + 3 + 1 = 8. Hundreds 1 + 2 = 3. Answer 385.'
      check:
        prompt: 126 + 157 = ?
        options:
        - '283'
        - '273'
        - '2713'
        answer: '283'
        why: '6 + 7 = 13: write 3 carry 1; 2 + 5 + 1 = 8; 1 + 1 = 2.'
    - teach: 'Estimating helps check: round each number to the nearest hundred. 298 + 405 is about 300 + 400 = 700. If your answer is far from 700, check again.'
      check:
        prompt: '195 + 310 is about:'
        options:
        - '500'
        - '300'
        - '900'
        answer: '500'
        why: 195 is about 200 and 310 is about 300; 200 + 300 = 500.
  items:
  - prompt: 234 + 152 = ?
    answer: '386'
    check: 234 + 152
    difficulty: 1
    hints:
    - Ones 4 + 2, tens 3 + 5, hundreds 2 + 1.
    - No carrying.
    solution: 234 + 152 = 386.
    mistakes: {"376": "m3_add_places", "82": "m3_add_places"}
  - prompt: 300 + 400 = ?
    answer: '700'
    check: 300 + 400
    difficulty: 1
    hints:
    - 3 hundreds + 4 hundreds.
    - 7 hundreds.
    solution: 300 + 400 = 700.
    mistakes: {"7000": "m3_hundreds_add", "70": "m3_hundreds_add"}
  - prompt: 268 + 125 = ?
    answer: '393'
    check: 268 + 125
    difficulty: 2
    hints:
    - '8 + 5 = 13: carry 1.'
    - 6 + 2 + 1 = 9.
    solution: 268 + 125 = 393.
    mistakes:
      '383': c3_place
      '3813': c3_place
  - prompt: A school has 234 girls and 152 boys. How many children?
    answer: '386'
    check: 234 + 152
    difficulty: 1
    hints:
    - Put together.
    - 234 + 152.
    solution: 386 children.
    mistakes: {"376": "m3_add_places", "82": "m3_add_places"}
  - prompt: 456 + 300 = ?
    answer: '756'
    check: 456 + 300
    difficulty: 1
    hints:
    - Add only the hundreds.
    - 4 + 3 = 7 hundreds.
    solution: 456 + 300 = 756.
    mistakes:
      '486': c3_place
  - prompt: 379 + 146 = ?
    answer: '525'
    check: 379 + 146
    difficulty: 2
    hints:
    - 9 + 6 = 15, carry 1.
    - 7 + 4 + 1 = 12, carry 1.
    solution: 379 + 146 = 525.
    mistakes:
      '415': c3_place
      '4115': c3_place
  - prompt: 415 + 263 = ?
    answer: '678'
    check: 415+263
    difficulty: 1
    hints:
    - 'Ones: 5 + 3.'
    - Then tens, then hundreds.
    solution: 'Step 1: 5 + 3 = 8, 1 + 6 = 7, 4 + 2 = 6. Step 2: = 678.'
    mistakes:
      '668': c3m9_line
      '6178': c3m9_carry
  - prompt: 500 + 300 + 100 = ?
    answer: '900'
    check: 500+300+100
    difficulty: 1
    hints:
    - Count the hundreds.
    - 5 + 3 + 1 hundreds.
    solution: 'Step 1: 9 hundreds. Step 2: = 900.'
    mistakes:
      '800': c3m9_line
      '810': c3m9_line
  - prompt: 238 + 145 = ?
    answer: '383'
    check: 238+145
    difficulty: 2
    hints:
    - 8 + 5 is more than 10.
    - Carry 1 to the tens.
    solution: 'Step 1: 8 + 5 = 13, write 3 carry 1. Step 2: 3 + 4 + 1 = 8, 2 + 1 = 3: 383.'
    mistakes:
      '373': c3m9_carry
      '3713': c3m9_carry
  - prompt: A library has 356 English books and 218 Hindi books. How many books?
    answer: '574'
    check: 356+218
    difficulty: 2
    hints:
    - Add the two kinds.
    - 6 + 8 needs a carry.
    solution: 'Step 1: 6 + 8 = 14, carry 1. Step 2: 5 + 1 + 1 = 7, 3 + 2 = 5: 574.'
    mistakes:
      '564': c3m9_carry
      '138': c3m9_line
  - prompt: 460 + 270 = ?
    answer: '730'
    check: 460+270
    difficulty: 2
    hints:
    - 6 tens + 7 tens is more than 10 tens.
    - Carry 1 hundred.
    solution: 'Step 1: 6 + 7 = 13 tens, write 3 carry 1. Step 2: 4 + 2 + 1 = 7: 730.'
    mistakes:
      '630': c3m9_carry
      '6130': c3m9_carry
  - prompt: '402 + 97 is about:'
    options:
    - '500'
    - '400'
    - '1300'
    answer: '500'
    difficulty: 2
    hints:
    - Round 402 and 97 to nearest hundreds.
    - About 400 + 100.
    solution: 'Step 1: 402 ≈ 400, 97 ≈ 100. Step 2: About 500.'
    mistakes:
      '400': c3m9_about
      '1300': c3m9_about
  - prompt: 199 + 1 = ?
    answer: '200'
    check: 199+1
    difficulty: 1
    hints:
    - 9 ones + 1 fills a ten.
    - The tens also fill a hundred.
    solution: 'Step 1: 199 + 1. Step 2: = 200.'
    mistakes:
      '1910': c3m9_carry
      '190': c3m9_carry
  - prompt: A farmer picked 275 mangoes on Monday and 325 on Tuesday. How many mangoes?
    answer: '600'
    check: 275+325
    difficulty: 3
    hints:
    - 5 + 5 makes a ten.
    - Carry each time.
    solution: 'Step 1: 5 + 5 = 10, carry 1; 7 + 2 + 1 = 10, carry 1. Step 2: 2 + 3 + 1 = 6: 600.'
    mistakes:
      '500': c3m9_carry
      '590': c3m9_carry
  - prompt: A school bus travels 128 km on Monday, 130 km on Tuesday and 142 km on Wednesday. How far in all?
    answer: '400'
    check: 128+130+142
    difficulty: 3
    hints:
    - Add two days first.
    - Then add the third.
    solution: 'Step 1: 128 + 130 = 258. Step 2: 258 + 142 = 400 km.'
    mistakes:
      '390': c3m9_carry
      '258': c3m9_line
- code: cbse3m.hh2.sub
  title: Subtracting 3-digit numbers
  after:
  - cbse3m.hh2.add
  notes: |
    Subtract ones, then tens, then hundreds. 586 − 243 = 343. Borrowing: 452 − 127: 2 < 7, borrow a ten: 12 − 7 = 5;
    4 − 2 = 2; 4 − 1 = 3; answer 325. Check by adding: 325 + 127 = 452.
  explanations:
    text: To subtract, start with the ones. If the top digit is smaller, borrow one ten (or one hundred) from the next column. Always check by adding your answer to the number you took away.
    visual: 'Write 452 − 127 in columns. 2 is less than 7, so borrow: the 5 tens become 4, and the 2 ones become 12.'
    step_by_step: 'Step 1: Line up the columns. Step 2: Subtract ones, borrowing if needed. Step 3: Subtract tens. Step 4: Subtract hundreds. Step 5: Check by adding.'
    real_world: 'A train has 452 seats and 127 are filled: 325 seats are empty.'
  picture:
    kind: flow
    steps:
    - 452 − 127
    - 'Borrow: 12 − 7 = 5'
    - 'Tens: 4 − 2 = 2'
    - 'Hundreds: 4 − 1 = 3'
    - Answer 325
    alt: '452 minus 127: borrow so 12 minus 7 is 5, tens 4 minus 2 is 2, hundreds 4 minus 1 is 3, answer 325.'
  activity:
    type: sort
    prompt: Take away. Which answer does each one make?
    bins:
    - '274'
    - '343'
    - '499'
    items:
    - label: 432 − 158
      bin: '274'
      clue: '2 − 8: borrow. Then 2 − 5: borrow again.'
      why: '274. Check: 274 + 158 = 432.'
    - label: 374 − 100
      bin: '274'
      clue: Take one hundred.
      why: '274.'
    - label: 300 − 26
      bin: '274'
      clue: Borrow from the hundreds.
      why: '274.'
    - label: 586 − 243
      bin: '343'
      clue: 'Ones, tens, hundreds: no borrowing.'
      why: '343.'
    - label: 443 − 100
      bin: '343'
      clue: Take a hundred.
      why: '343.'
    - label: 400 − 57
      bin: '343'
      clue: Borrow from the hundreds.
      why: '343.'
    - label: 500 − 1
      bin: '499'
      clue: Borrowing from 5 hundreds leaves 4 hundreds.
      why: '499.'
    - label: 999 − 500
      bin: '499'
      clue: Take 5 hundreds.
      why: '499.'
    - label: 600 − 101
      bin: '499'
      clue: Take a hundred, then one more.
      why: '499.'
  lesson:
    - teach: 'To subtract 3-digit numbers, line up the places and take away ones, then tens, then hundreds. 768 − 325: 8 − 5 = 3, 6 − 2 = 4, 7 − 3 = 4. Answer 443.'
      check:
        prompt: 975 − 432 = ?
        options:
        - '543'
        - '547'
        - '1407'
        answer: '543'
        why: 5 − 2 = 3, 7 − 3 = 4, 9 − 4 = 5.
    - teach: 'If a top digit is smaller, borrow from the next place. 532 − 218: 2 − 8 cannot be done, so open 1 ten: 12 − 8 = 4. Tens: 2 − 1 = 1. Hundreds: 5 − 2 = 3. Answer 314.'
      picture:
        kind: flow
        steps:
        - 532 − 218
        - '2 < 8: open a ten'
        - 12 − 8 = 4
        - 2 − 1 = 1 ten
        - 5 − 2 = 3 hundreds
        - '314'
        alt: Steps for 532 − 218 with one borrow, giving 314.
      check:
        prompt: 641 − 125 = ?
        options:
        - '516'
        - '524'
        - '526'
        answer: '516'
        why: 11 − 5 = 6, 3 − 2 = 1, 6 − 1 = 5.
    - teach: Always check by adding back. If 600 − 245 = 355, then 355 + 245 should be 600. If it is not, look again.
      check:
        prompt: 'To check 420 − 160 = 260, add:'
        options:
        - 260 + 160
        - 420 + 160
        - 420 + 260
        answer: 260 + 160
        why: Answer + what you took away gives back the start.
  items:
  - prompt: 586 − 243 = ?
    answer: '343'
    check: 586 - 243
    difficulty: 1
    hints:
    - 6 − 3, 8 − 4, 5 − 2.
    - No borrowing.
    solution: 586 − 243 = 343.
    mistakes: {"829": "m3_sub_places", "353": "m3_sub_places"}
  - prompt: 800 − 300 = ?
