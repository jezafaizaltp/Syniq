    - Count back.
    solution: 800 − 300 = 500.
    mistakes: {"1100": "m3_hundreds_add", "50": "m3_hundreds_add"}
  - prompt: 452 − 127 = ?
    answer: '325'
    check: 452 - 127
    difficulty: 2
    hints:
    - 'Borrow a ten: 12 − 7.'
    - Then 4 − 2 and 4 − 1.
    solution: 452 − 127 = 325.
    mistakes:
      '335': c3_place
  - prompt: A train has 452 seats; 127 are filled. How many are empty?
    answer: '325'
    check: 452 - 127
    difficulty: 2
    hints:
    - Take away the filled seats.
    - 452 − 127.
    solution: 325 seats are empty.
    mistakes: {"335": "m5_subtract_borrow", "579": "m5_subtract_borrow"}
  - prompt: 675 − 50 = ?
    answer: '625'
    check: 675 - 50
    difficulty: 1
    hints:
    - Take away 5 tens.
    - 7 − 5 = 2 tens.
    solution: 675 − 50 = 625.
    mistakes:
      '670': c3_place
  - prompt: 'Check: if 500 − 175 = 325, then 325 + 175 = ?'
    answer: '500'
    check: 325 + 175
    difficulty: 2
    hints:
    - Adding back gives the start number.
    - 325 + 175.
    solution: 325 + 175 = 500.
    mistakes: {"150": "m3_check_add", "325": "m3_check_add"}
