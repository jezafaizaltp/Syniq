# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 9
title: House of Hundreds–II
tips:
  m3_check_add: "Adding back what you took away gets you to where you started."
  m3_hundreds_add: "3 hundreds and 4 hundreds make how many hundreds?"
  m3_sub_places: "Take ones from ones, tens from tens, hundreds from hundreds."
  c3m9_line: 'Write the numbers one under the other: hundreds under hundreds, tens under tens, ones under ones.'
  c3m9_carry: If a column adds to 10 or more, write the ones and carry 1 to the next column on the left.
  c3m9_borrow: If the top digit is smaller, open one from the next column on the left before taking away.
  c3m9_about: Round each number to the nearest hundred first, then add or take away.

concepts:
- code: cbse3m.hh2.add
  title: Adding 3-digit numbers
  notes: |
    Add ones, then tens, then hundreds. 234 + 152 = 386. Carrying: 268 + 125: 8 + 5 = 13, write 3 carry 1; 6 + 2 + 1 =
    9; 2 + 1 = 3; answer 393. Adding hundreds: 300 + 400 = 700. Estimating: 298 + 201 is about 500.
  explanations:
    text: To add big numbers, start with the ones, then the tens, then the hundreds. If a column makes ten or more, carry the extra ten to the next column.
    visual: 'Write 268 + 125 in columns. Add 8 + 5 = 13: write 3, carry 1 to the tens. Then 6 + 2 + 1 = 9, then 2 + 1 = 3.'
    step_by_step: 'Step 1: Line up hundreds, tens and ones. Step 2: Add ones; carry if 10 or more. Step 3: Add tens with the carry. Step 4: Add hundreds.'
    real_world: 'A school has 234 girls and 152 boys: 386 children in all.'
  picture:
    kind: flow
    steps:
    - 268 + 125
    - 'Ones: 8 + 5 = 13, write 3 carry 1'
    - 'Tens: 6 + 2 + 1 = 9'
    - 'Hundreds: 2 + 1 = 3'
    - Answer 393
    alt: '268 plus 125: ones 13 write 3 carry 1, tens 9, hundreds 3, answer 393.'
  activity:
    type: sort
    prompt: Add. Which answer does each one make?
    bins:
    - '377'
    - '500'
    - '622'
    items:
    - label: 245 + 132
      bin: '377'
      clue: Ones, then tens, then hundreds.
      why: No carrying needed.
    - label: 300 + 77
      bin: '377'
      clue: 3 hundreds and 77.
      why: '377.'
    - label: 177 + 200
      bin: '377'
      clue: Add 2 hundreds.
      why: '377.'
    - label: 368 + 254
      bin: '622'
      clue: '8 + 4 is more than ten: carry.'
      why: '12 ones and 12 tens: carry twice.'
    - label: 422 + 200
      bin: '622'
      clue: Add 2 hundreds.
      why: '622.'
    - label: 600 + 22
      bin: '622'
      clue: 6 hundreds and 22.
      why: '622.'
    - label: 499 + 1
      bin: '500'
      clue: '9 + 1 makes a ten: carry, and again.'
      why: Carrying twice gives 500.
    - label: 250 + 250
      bin: '500'
      clue: Two halves of 500?
      why: '500.'
    - label: 380 + 120
      bin: '500'
      clue: 8 tens + 2 tens is ten tens.
      why: 'Carry a hundred: 500.'
  lesson:
    - teach: 'To add 3-digit numbers, line up the places and add ones, then tens, then hundreds. 213 + 154: ones 3 + 4 = 7, tens 1 + 5 = 6, hundreds 2 + 1 = 3. Answer 367.'
      picture:
        kind: area_grid
        cols:
        - size: 1
          label: H
        - size: 1
          label: T
        - size: 1
          label: O
        rows:
        - size: 1
          label: '213'
        - size: 1
          label: '+154'
        - size: 1
          label: sum
        cells:
        - - '2'
          - '1'
          - '3'
        - - '1'
          - '5'
          - '4'
        - - '3'
          - '6'
          - '7'
        alt: '213 + 154 in columns: 3 hundreds, 6 tens, 7 ones.'
      check:
        prompt: 321 + 456 = ?
        options:
        - '777'
        - '765'
        - '7107'
        answer: '777'
        why: 1 + 6 = 7, 2 + 5 = 7, 3 + 4 = 7.
      ways:
      - style: visual
        teach: Adding 321 + 456 place by place, ones first.
        picture:
          kind: compare
          columns:
          - title: Hundreds
            points:
            - 3 + 4
            - = 7
          - title: Tens
            points:
            - 2 + 5
            - = 7
          - title: Ones
            points:
            - 1 + 6
            - = 7
          alt: 'To add 321 and 456, add the ones: 1 + 6 = 7, the tens: 2 + 5 = 7, and the hundreds: 3 + 4 = 7. The answer is 777.'
      - style: real_world
        teach: A school counts the children in each class for sports day and then adds the totals of two wings of the building. Writing the numbers one under the other keeps hundreds, tens and ones in their places.
    - teach: 'When a column makes 10 or more, carry. 147 + 238: ones 7 + 8 = 15, write 5 carry 1. Tens 4 + 3 + 1 = 8. Hundreds 1 + 2 = 3. Answer 385.'
      check:
        prompt: 126 + 157 = ?
        options:
        - '283'
        - '273'
        - '2713'
        answer: '283'
        why: '6 + 7 = 13: write 3 carry 1; 2 + 5 + 1 = 8; 1 + 1 = 2.'
      ways:
      - style: step_by_step
        teach: 'Add 357 + 226. Step 1: Ones: 7 + 6 = 13. Write 3, carry 1 ten. Step 2: Tens: 5 + 2 + 1 = 8. Step 3: Hundreds: 3 + 2 = 5. Step 4: The answer is 583.'
      - style: visual
        teach: What carrying does when one column adds to 10 or more.
        picture:
          kind: flow
          steps:
          - Add the ones column
          - 10 or more? Keep the ones digit
          - Carry 1 ten to the tens column
          - Add the tens, with the carried 1
          - Then add the hundreds
          alt: Add the ones column. If it is 10 or more, keep the ones digit and carry 1 ten to the tens column. Add the tens with the carried 1, then add the hundreds.
    - teach: 'Estimating helps check: round each number to the nearest hundred. 298 + 405 is about 300 + 400 = 700. If your answer is far from 700, check again.'
      check:
        prompt: '195 + 310 is about:'
        options:
        - '500'
        - '300'
        - '900'
        answer: '500'
        why: 195 is about 200 and 310 is about 300; 200 + 300 = 500.
      ways:
      - style: visual
        teach: Estimating 512 + 289 by rounding each number to the nearest hundred.
        picture:
          kind: number_line
          from: 200
          to: 600
          step: 100
          points:
          - at: 289
            label: 289 ≈ 300
          - at: 512
            label: 512 ≈ 500
          alt: On a number line from 200 to 600, 289 is nearest to 300 and 512 is nearest to 500. So 512 + 289 is about 500 + 300 = 800.
      - style: real_world
        teach: 'Before going to the shop, a parent estimates the bill: about 200 rupees for rice and about 300 for oil, so about 500 in all. If the bill says 900, they know to check it.'
