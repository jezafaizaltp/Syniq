# CBSE Class 3 Mathematics (NCERT Maths Mela, 2024-25), chapter 9. Format: content/README.md.
# Chapter names from the new NCERT book; topics inside each chapter chosen by Claude, not checked against the printed book.
subject: cbse3-math
chapter: 9
title: House of Hundreds–II
tips:
  m3_check_add: "Adding back what you took away gets you to where you started."
  m3_hundreds_add: "3 hundreds and 4 hundreds make how many hundreds?"
  m3_sub_places: "Take ones from ones, tens from tens, hundreds from hundreds."

concepts:
- code: cbse3m.hh2.add
  title: Adding 3-digit numbers
  notes: |
    Add ones, then tens, then hundreds. 234 + 152 = 386. Carrying: 268 + 125: 8 + 5 = 13, write 3 carry 1; 6 + 2 + 1 =
    9; 2 + 1 = 3; answer 393. Adding hundreds: 300 + 400 = 700. Estimating: 298 + 201 is about 500.
  explanations:
    text: To add big numbers, start with the ones, then the tens, then the hundreds. If a column makes ten or more, carry the extra ten to the next column.
    visual: 'Write 268 + 125 in columns. Add 8 + 5 = 13: write 3, carry 1 to the tens. Then 6 + 2 + 1 = 9, then 2 + 1 = 3.'
    step_by_step: 'Step 1: Line up hundreds, tens and ones. Step 2: Add ones; carry if 10 or more. Step 3: Add tens with the carry. Step 4: Add hundreds.'
    real_world: 'A school has 234 girls and 152 boys: 386 children in all.'
  picture:
    kind: flow
    steps:
    - 268 + 125
    - 'Ones: 8 + 5 = 13, write 3 carry 1'
    - 'Tens: 6 + 2 + 1 = 9'
    - 'Hundreds: 2 + 1 = 3'
    - Answer 393
    alt: '268 plus 125: ones 13 write 3 carry 1, tens 9, hundreds 3, answer 393.'
  activity:
    type: sort
    prompt: Add. Which answer does each one make?
    bins:
    - '377'
    - '500'
    - '622'
    items:
    - label: 245 + 132
      bin: '377'
      clue: Ones, then tens, then hundreds.
      why: No carrying needed.
    - label: 300 + 77
      bin: '377'
      clue: 3 hundreds and 77.
      why: '377.'
    - label: 177 + 200
      bin: '377'
      clue: Add 2 hundreds.
      why: '377.'
    - label: 368 + 254
      bin: '622'
      clue: '8 + 4 is more than ten: carry.'
      why: '12 ones and 12 tens: carry twice.'
    - label: 422 + 200
      bin: '622'
      clue: Add 2 hundreds.
      why: '622.'
    - label: 600 + 22
      bin: '622'
      clue: 6 hundreds and 22.
      why: '622.'
    - label: 499 + 1
      bin: '500'
      clue: '9 + 1 makes a ten: carry, and again.'
      why: Carrying twice gives 500.
    - label: 250 + 250
      bin: '500'
      clue: Two halves of 500?
      why: '500.'
    - label: 380 + 120
      bin: '500'
      clue: 8 tens + 2 tens is ten tens.
      why: 'Carry a hundred: 500.'
  items:
  - prompt: 234 + 152 = ?
    answer: '386'
    check: 234 + 152
    difficulty: 1
    hints:
    - Ones 4 + 2, tens 3 + 5, hundreds 2 + 1.
    - No carrying.
    solution: 234 + 152 = 386.
    mistakes: {"376": "m3_add_places", "82": "m3_add_places"}
  - prompt: 300 + 400 = ?
    answer: '700'
    check: 300 + 400
    difficulty: 1
    hints:
    - 3 hundreds + 4 hundreds.
    - 7 hundreds.
    solution: 300 + 400 = 700.
    mistakes: {"7000": "m3_hundreds_add", "70": "m3_hundreds_add"}
  - prompt: 268 + 125 = ?
    answer: '393'
    check: 268 + 125
    difficulty: 2
    hints:
    - '8 + 5 = 13: carry 1.'
    - 6 + 2 + 1 = 9.
    solution: 268 + 125 = 393.
    mistakes:
      '383': c3_place
      '3813': c3_place
  - prompt: A school has 234 girls and 152 boys. How many children?
    answer: '386'
    check: 234 + 152
    difficulty: 1
    hints:
    - Put together.
    - 234 + 152.
    solution: 386 children.
    mistakes: {"376": "m3_add_places", "82": "m3_add_places"}
  - prompt: 456 + 300 = ?
    answer: '756'
    check: 456 + 300
    difficulty: 1
    hints:
    - Add only the hundreds.
    - 4 + 3 = 7 hundreds.
    solution: 456 + 300 = 756.
    mistakes:
      '486': c3_place
  - prompt: 379 + 146 = ?
    answer: '525'
    check: 379 + 146
    difficulty: 2
    hints:
    - 9 + 6 = 15, carry 1.
    - 7 + 4 + 1 = 12, carry 1.
    solution: 379 + 146 = 525.
    mistakes:
      '415': c3_place
      '4115': c3_place
- code: cbse3m.hh2.sub
  title: Subtracting 3-digit numbers
  after:
  - cbse3m.hh2.add
  notes: |
    Subtract ones, then tens, then hundreds. 586 − 243 = 343. Borrowing: 452 − 127: 2 < 7, borrow a ten: 12 − 7 = 5;
    4 − 2 = 2; 4 − 1 = 3; answer 325. Check by adding: 325 + 127 = 452.
  explanations:
    text: To subtract, start with the ones. If the top digit is smaller, borrow one ten (or one hundred) from the next column. Always check by adding your answer to the number you took away.
    visual: 'Write 452 − 127 in columns. 2 is less than 7, so borrow: the 5 tens become 4, and the 2 ones become 12.'
    step_by_step: 'Step 1: Line up the columns. Step 2: Subtract ones, borrowing if needed. Step 3: Subtract tens. Step 4: Subtract hundreds. Step 5: Check by adding.'
    real_world: 'A train has 452 seats and 127 are filled: 325 seats are empty.'
  picture:
    kind: flow
    steps:
    - 452 − 127
    - 'Borrow: 12 − 7 = 5'
    - 'Tens: 4 − 2 = 2'
    - 'Hundreds: 4 − 1 = 3'
    - Answer 325
    alt: '452 minus 127: borrow so 12 minus 7 is 5, tens 4 minus 2 is 2, hundreds 4 minus 1 is 3, answer 325.'
  activity:
    type: sort
    prompt: Take away. Which answer does each one make?
    bins:
    - '274'
    - '343'
    - '499'
    items:
    - label: 432 − 158
      bin: '274'
      clue: '2 − 8: borrow. Then 2 − 5: borrow again.'
      why: '274. Check: 274 + 158 = 432.'
    - label: 374 − 100
      bin: '274'
      clue: Take one hundred.
      why: '274.'
    - label: 300 − 26
      bin: '274'
      clue: Borrow from the hundreds.
      why: '274.'
    - label: 586 − 243
      bin: '343'
      clue: 'Ones, tens, hundreds: no borrowing.'
      why: '343.'
    - label: 443 − 100
      bin: '343'
      clue: Take a hundred.
      why: '343.'
    - label: 400 − 57
      bin: '343'
      clue: Borrow from the hundreds.
      why: '343.'
    - label: 500 − 1
      bin: '499'
      clue: Borrowing from 5 hundreds leaves 4 hundreds.
      why: '499.'
    - label: 999 − 500
      bin: '499'
      clue: Take 5 hundreds.
      why: '499.'
    - label: 600 − 101
      bin: '499'
      clue: Take a hundred, then one more.
      why: '499.'
  items:
  - prompt: 586 − 243 = ?
    answer: '343'
    check: 586 - 243
    difficulty: 1
    hints:
    - 6 − 3, 8 − 4, 5 − 2.
    - No borrowing.
    solution: 586 − 243 = 343.
    mistakes: {"829": "m3_sub_places", "353": "m3_sub_places"}
  - prompt: 800 − 300 = ?
    answer: '500'
    check: 800 - 300
    difficulty: 1
    hints:
